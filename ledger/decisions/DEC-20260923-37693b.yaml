  rulings:
    - id: R1
      subject: TASK-20260922-0e3b58
      ruling: COMPLETE BY CLAIM-AND-COMPLETE.
      mechanics: >-
        tools/research_dispatch.py verify_archive under `content_at_commit`
        reads each declared path's bytes from the archive's own commit tree and
        requires the task id plus every record_id in that commit's message. It
        does not require the commit to change every declared path. A claimed,
        completed release does NOT complete an archive
        ("archive_completion_requires_queue_record"). So the procedure is:
        claim; rebind the receipt, which is inside this task's own write_scope
        and not yet completed; make one commit X that stages exactly the
        fourteen declared paths, with a message naming TASK-20260922-0e3b58
        and all thirteen record_ids; then record completion in the queue's own
        archive block (commit_sha X, parent_sha, path_sha256 over the fourteen
        paths as they are at X) in a later commit. BATCH-cbb416 /
        TASK-20260916-9d98ef records its completion the same way.
      additivity: >-
        The receipt rebind replaces only the goal.yaml hash, parent_sha,
        base_commit_checked and merge_outcome. The replaced values are
        preserved in a rebind_history entry. No card, no decision
        (DEC-20260922-e9d35a included), no amendment and no correction of that
        lane is edited.
      what_the_rebind_binds: >-
        The current bytes of ledger/goals/GOAL-FROB-6333a9/goal.yaml (sha256
        b0dfd98098f9b22972b5def3b10e707d6cb516ccd9b2995aab10e17eb66caba4 as
        reported), which include the 8-line additive note from 571f0c7411.
        The archive binds that note as PRESENT. It does not make
        CORR-20260922-b14dc6 official, and that id is not among its
        record_ids.
      what_it_does_not_claim: >-
        That AMD-EXP-FROB-30006a-20260922-nullcontrol governed the out-of-band
        runs. The amendment's bytes predate those runs (06:33Z against 17:13Z,
        as reported), so completing this archive uses no outcome information.
        Whether the runs COMPLIED is R3's question.
    - id: R2
      subject: TASK-20260922-cd6f21
      ruling: STAYS `blocked`. NOT moved to `queued`.
      rationale: >-
        Its recorded blocker (0e3b58's receipt verifying) is discharged by R1,
        but a new blocker applies. Routing an executor now would do four bad
        things. It would pre-empt the admissibility ruling. It could duplicate or
        contend with a batch that may still be running (EX-2 requires a quiet
        machine; contention corrupts conflict counts). It would spend the
        card's maximum_runs of 20 before anyone decides what the existing runs
        count for. And it would start a fresh execution whose operators can
        read the prior outcome on a public PR. The card text is NOT edited. A
        queue tasks_state_revisions entry records the state holding under this
        decision.
      impediment_recorded:
        id: IMP-FROB-30006A-OOB
        raised: '2026-09-23'
        condition: >-
          Blocker, not a declared pause_condition: out-of-band execution of the
          approved experiment under a superseded card.
        what_is_blocked: >-
          Dispatch of TASK-20260922-cd6f21 (`/run EXP-FROB-30006a`), and so its
          snapshot TASK-20260922-98729f, the reviews TASK-20260922-ba4a2f and
          TASK-20260922-e62294, and the composition TASK-20260922-7ef166. Not
          the campaign, not track A, not stage0 design work.
        clears_when: >-
          All of the following: (a) the out-of-band batch is terminal (no
          live process, RUN-FROB-c77c53 landed or recorded as not landed);
          (b) its outputs are committed on a ref reachable from main or this
          branch, under an owning snapshot archive; (c) a committed Coordinator
          admissibility ruling exists that either admits a stated subset against
          the frozen contract plus amendment, rules the set inadmissible, or
          routes a successor executor card. That successor could be cd6f21
          itself, a scoped completion card, or a replication.
        recheck: >-
          `git fetch origin`; `git log --oneline origin/main..origin/cursor/semaev-2015-audit-program-5b8b -- experiments/EXP-FROB-30006a`;
          PR #1377 state; `python3 tools/agent_bus.py inbox --as coordinator`;
          `python3 tools/goal_lanes.py lanes GOAL-FROB-6333a9`.
        asserts_nothing_about: >-
          The science. An out-of-protocol execution is a custody and process
          fact. It is not positive or negative evidence about H-FROB-a5bf86,
          and a timeout in it is never a verdict (EX-4).
    - id: R3
      subject: the out-of-band EXP-FROB-30006a run set on origin/cursor/semaev-2015-audit-program-5b8b (93d51c97c4, a2d5202dc4)
      ruling: >-
        RECORDED AS A FACT. NOT EVIDENCE, NOT RULED INVALID, NOT ADMITTED. The
        ruling is deferred to a named successor act.
      rationale: >-
        Before interpreting executor output, the Coordinator must check expected
        run count, schema-complete manifests, seed integrity, raw/summary
        agreement and control comparability. None of that is possible on an
        unmerged ref with a possibly still-running batch. A premature
        invalidity ruling would discard real measurements; a premature
        admission would treat unreviewed, unarchived runs as evidence.
      standing_facts_for_the_ruling:
        - >-
          TASK-20260920-66a30e was superseded by TASK-20260922-cd6f21
          (CORR-20260922-9e402f). It is undispatchable under
          research_dispatch.py, and its archived_by names an archive that
          could not own its outputs. No authorization to execute under it
          exists, and none is created here.
        - >-
          The frozen contract was approved by DEC-20260920-cf8ded. The amendment
          was committed before the runs began. So the admissibility ruling
          measures the runs against contract plus amendment. It does NOT amend
          the protocol to fit them. Any protocol change from here on follows an
          observed outcome, needs a versioned protocol_amendment that says so,
          and may never weaken a threshold.
      checklist_for_the_admissibility_ruling:
        - Expected run count against a trial plan that predates the first solver call; any missing plan is itself a finding.
        - Schema-complete manifests. manifest_v2 was completed afterwards at a2d5202dc4 and registered in tools/run_supersession_registry.yaml; the ruling must say what that completion may and may not attest.
        - Seed and instance integrity, and whether both arms used identical instances.
        - Raw versus summary agreement, and independent UNSAT certificates re-verified (EX-6, C-CERT).
        - Compliance with amendment A-1 (both search modes on every certified-UNSAT primary replicate, identical instance) and with A-5 (trial-plan.json before the first run, RESULTS.json accounting for every planned cell).
        - Retained implementation_error attempts preserved and explained, not dropped.
        - Build identity per mode (EX-7).
        - Who launched the batch, under which authority, and a correction record for the out-of-protocol launch.
      successor: >-
        A Coordinator admissibility act. It needs (i) a snapshot archive that
        owns the run package on a reachable ref, and (ii) this checklist
        applied to the committed package. It is the goal head's track B next
        action.
    - id: R4
      subject: outcome blindness
      ruling: DISCLOSED; REVIEW-PLAN BLINDNESS FLAGGED AS POSSIBLY COMPROMISED.
      disclosure: >-
        This Coordinator was told in-session, by the top-level session's
        summary of the 93d51c97c4 commit message, that commit message's
        primary-cell observations. It has read no run artifact on that ref.
        Nothing in R1 to R3 depends on the outcome content: each ruling would
        be the same under any outcome.
      review_plan_risk: >-
        REVIEW-FROB-20260922-5286b0 (coordination/review/frob-20260922-5286b0/review-plan.yaml)
        was written before any measurement, with the Coordinator prior
        recorded first. That prior remains valid. But the plan's blindness walls
        assumed no leaked ratio or verdict in the tree, and its step (3) is to
        re-grep for one. The outcome is now in commit messages on a public PR,
        which `check_review_independence.py --blind-history` scans only for
        reachable commits. The admissibility ruling must decide whether the
        round needs an addendum: at least a reviewer attestation of not having
        read PR #1377 or those commit messages, and possibly a re-staffed blind
        re-derivation. This record adds no such addendum.
    - id: FINDING-1
      subject: DEC-20260922-5796b8 / H-FROB-6774fb / EV-FROB-d336b0
      finding: >-
        AUDITABLE PROCESS FINDING, recorded under AGENTS.md "Research-direction
        integrity and auditability". NO STATUS CHANGE. DEC-20260922-5796b8 moved
        H-FROB-6774fb from `proposed` to `supported` and accepted EV-FROB-d336b0
        as `strong`, in the same act that designed and approved EXP-FROB-ec08b5.
        No independent validator or red-team report existed. The decision's own
        knowledge_promotion says "the lane has not yet had an independent
        validator or red-team pass". agents/coordinator.md "Dynamic dispatch"
        requires the official decision to come only after those reports.
      disposition: >-
        The status is NOT reversed here. Reversing it without new evidence would
        be a decision without a basis in either direction. The remedy is rank
        2, the track A review round. Its composing decision will either
        re-affirm the status on reviewed evidence or move it, with
        this finding cited. Until then, H-FROB-6774fb's `supported` status
        should be cited only together with this finding, and EV-FROB-d336b0
        may not support a KN-FIND promotion.

