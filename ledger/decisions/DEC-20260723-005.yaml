coordinator_decision:
  id: DEC-20260723-005
  context: >-
    GOAL-MLKEM-001 BATCH-003 full-text review of ePrint 2026/1022 and
    2026/1465 plus triage of 69 supplied papers after verified snapshot 7393bb5.
  decision: revise
  target_ids:
    - GOAL-MLKEM-001
    - IDEA-20260723-001
  rationale:
    - >-
      Neither reviewed paper changes FIPS 203 DFRs, passive MLWE hardness,
      any BATCH-002 cost row, or standardized solve status.
    - >-
      The Thorns paper contains a scale mismatch and a repairable proof gap,
      while its exact-FIPS transfer is absent.
    - >-
      The sieve paper changes local model constants but not exponents and
      supplies no complete operational estimator bridge.
    - >-
      Independent review selected the narrowed Thorns source-and-marginal
      audit ahead of the substantially larger R07 radial rewrite.
    - >-
      The remaining supplied papers add no third claim-changing ML-KEM lead at
      triage depth; abstract-only exclusions remain non-evidentiary.
  evidence_refs:
    - EV-MLKEM-003
    - coordination/goals/GOAL-MLKEM-001/batches/BATCH-003/tasks/TASK-20260723-217/review_report.yaml
    - coordination/goals/GOAL-MLKEM-001/batches/BATCH-003/tasks/TASK-20260723-218/red_team_report.yaml
  limitations:
    - No empirical DFR, lattice-sieve, BKZ, or attack run was performed.
    - Source-level flaw findings are revision-specific and not universal judgments.
    - A successful toy audit would justify further work, not a FIPS-rate change.
  next_actions:
    - >-
      Freeze and execute the narrowed Thorns audit: repair the LDP lower-bound
      set, resolve the Gaussian scale, and derive one exact modulo-q FIPS
      output-coordinate law against the pinned estimator with representative
      and rounding controls.
