  rationale:
    - >-
      THE INCORPORATED READINGS DECIDE, AND THEY STAYED MONOTONE. RFR-1 was
      written before any of the four reviews; this review named a fail-open
      with a sequence from frozen code under a premise the lineage's own rules
      posit, found by the worked attack the card named. The draft is not
      approvable as written, and the remedy is the one the readings name.
    - >-
      NO READING IS NARROWED AFTER THE FACT. Definition (ii) is read with an
      absent record as "not class (A) or (C)", as both reviews that met the
      case read it. That the child physically could not have executed argv is
      recorded and is why no cap exposure is claimed; the rules do not infer
      execution from a missing file, so it cannot turn a rule's PASS into a
      held joint.
    - >-
      THE PART THIS DRAFT WAS WRITTEN FOR HELD. Every lost-record
      construction at an msolve or health launch is a named gap; no count is
      circular; no ordinary path is refused (85 rows). The prior's two
      predicted breaks (a circular count; the same atomic write) did not
      happen.
    - >-
      MULTIPLICITY IS NOT PRESENCE. A uniqueness condition bounds how many
      records carry a source; it says nothing about a launch that left no
      source at all. A lost launch must be detected by evidence written
      independently of the recorder whose presence implies the launch - a
      file the installing process writes before the launch, or a field of
      the frozen function's returned result copied by a different layer -
      and files the child writes cannot be that evidence, because a child can
      fail before writing any. KN-TECH-fe7faf records the lesson.
    - >-
      THE ENUMERATION HAS A FLOOR THIS TIME. The per-kind table is over six
      call sites of one frozen function in hash-bound code, re-derived by the
      review; an unknown-kind gap and a closure item make a seventh kind FAIL
      or STOP. That is the difference from the path enumerations that did not
      converge (KN-TECH-79d6b9), and it is why IE is not adopted now.
    - >-
      THE CHAIN IS CONVERGING, AND SAYS WHERE. failclosed broke on a foreign
      process (FO-1); childend on ordinary outputs refused by design (PB-2,
      PB-3); gapattr on a lost record at a shared source (CX-1); attcount on a
      lost record of a launch kind without a count (CX-A), whose child could
      not have executed argv. Each break is narrower than the last; the
      successor is additive and small.
    - >-
      FD AND IE ARE KEPT, NOT SPENT, with their triggers stated. THE LANE STAYS
      OPEN. Nothing measured D. NO SECURITY READING: toy EcGFp5-shaped
      arithmetic with known scalars; nothing transfers to p = 2^64 - 2^32 + 1.

