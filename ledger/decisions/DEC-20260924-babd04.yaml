  knowledge_promotion:
    section_4_remedy_ruling: >-
      KN-TECH-175a62 section 4 ("For each positive source an attribution rule
      reads, count the launch records that carry it. If the count can exceed
      one on an ordinary path, bind it to a count written independently ...
      Where the count should be one, require uniqueness.") FAILED AS STATED,
      though it HELD WHERE IT APPLIED. Held: at every shared source (msolve
      and health tags) the bound count turned every lost-record construction
      the review built into a named gap, no count was circular, and no
      ordinary path was refused (review 198-210, 228-234, 267-298). Failed:
      "require uniqueness" bounds duplication, not loss; a launch whose
      source is unique and that left no file at all is detected by nothing
      (CX-A, 397-442; OB-2, 480). The rule was stated per positive source,
      and a launch that writes nothing has no positive source to count. The
      note itself anticipated that it "will need amending if that fails"
      (KN-TECH-175a62 section 6).
    promoted:
      - KN-TECH-fe7faf
    promoted_note: >-
      knowledge/techniques/KN-TECH-fe7faf.md, a technique entry with confidence
      `reported`, AMENDS KN-TECH-175a62 by a new entry: bind PRESENCE as well
      as multiplicity, per launch KIND, with evidence written independently of
      the recorder whose presence implies the launch (never files the child
      writes), enumerated over the launcher's call sites (a closed set in
      hash-bound code), with an unknown-kind catch-all. It also records the
      definitional point (a definition that classifies "may have executed" by
      record class makes a lost record of a no-file launch fail-open whatever
      the physics) and the nearby-object control that separated the break
      (LN-7a closed, CX-A open). KN-TECH-175a62 and KN-TECH-79d6b9 are neither
      edited nor superseded: nothing in them is withdrawn. knowledge/INDEX.md
      is generated and is not written or staged.
    not_warranted: >-
      KN-FIND: not an evidence-review decision, and not a support or
      reject_scoped decision; it produces no measured or proven result about
      any GFPN object. KN-OPEN-9b4a2b still records the open question the
      protocol is designed to answer.

