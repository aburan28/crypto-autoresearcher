coordinator_decision:
  id: DEC-20260802-d94a64
  decided_at: '2026-08-03'
  owner: coordinator
  decided_by: coordinator
  goal_id: GOAL-HQC-001
  batch_id: BATCH-003
  decision: refine
  target_ids: [GOAL-HQC-001, RQ-HQC-001, BATCH-003, EV-HQC-0e9116]
  target: GOAL-HQC-001
  evidence_ids: [EV-HQC-0e9116]
  question_ids: [RQ-HQC-001]
  hypothesis_id: null
  hypothesis_status_change: none
  hypothesis_status_change_note: >-
    active_hypothesis_ids was empty before this decision and is empty after it.
    H-HQC-18d1b4 was allocated and deliberately NOT created.

  disposition: refine
  disposition_rationale: >-
    'refine' for the third consecutive batch, and this time it is the honest
    label for a batch that did most of its job well and was still not admitted.
    Not 'support' or 'weaken': nothing was measured. Not 'expand': the design
    needs narrowing and repair, not widening. Not 'pause': the campaign now has,
    for the first time, a route to an actual measurement at HQC's own moment
    order, and abandoning it at the point where the route was found would be
    exactly the premature closure docs/inventor-protocol.md forbids. Not
    'inconclusive': the batch reached several firm conclusions, including one
    that changes what the campaign can ever claim.

  decisions:
    - id: D-1
      statement: >-
        THE CONTRACT IS NOT FROZEN AND NO HYPOTHESIS IS CREATED. Both reviews
        declined to admit it: the validator returns REVISE on the design, and
        the red team returns FREEZE WITH REQUIRED AMENDMENTS conditional on
        O1-O4. The BATCH-003 ledger archive's own handoff said in advance that
        freezing a contract the reviews rejected would be the worst possible use
        of it, and that condition governs. EXP-HQC-982268 and H-HQC-18d1b4 are
        allocated and unused.
      basis: EV-HQC-0e9116; both review reports
      what_this_costs: >-
        Three batches in, this campaign still has no hypothesis and no
        experiment. That is stated plainly rather than softened: the goal record
        must not imply otherwise.
    - id: D-2
      statement: >-
        THE MEASUREMENT IS INFEASIBLE AT HQC'S OWN PARAMETERS, structurally.
        T_req is approximately 1/DFR, giving 3.401e41 / 6.80e59 / 8.387e79
        trials at NIST-1/3/5. This is not a budget shortfall that a bigger
        machine fixes; it is the arithmetic of estimating the probability of an
        event the scheme is designed to make astronomically rare.
      basis: EV-HQC-0e9116 O-1, reproduced independently by both reviewers
      consequence_for_the_goal: >-
        GOAL-HQC-001's first completion criterion asks for a measured
        decoding-failure-rate curve "at reduced parameters where failures are
        observable", with extrapolation stated conditionally on numbered
        heuristics. That wording anticipated exactly this: the criterion is
        reachable only through reduced parameters plus declared heuristics, and
        NEVER through direct measurement at the standardized sets. This decision
        records that as established rather than assumed.
    - id: D-3
      statement: >-
        A ROUTE TO A REAL MEASUREMENT EXISTS, AT THE EXACT MOMENT ORDER. With
        dup = 1 and nothing else changed, PS-R1 reaches k = m = 16 at
        T_req = 2.915e7 against a 1e8 budget; PS-R3 reaches 22 and PS-R5 reaches
        32, for 5.58e4 core-seconds total. This is the first affordable route
        this campaign has found, and it is why the disposition is 'refine' and
        not 'pause'.
      basis: EV-HQC-0e9116 O-2, reproduced by TASK-20260802-addcdd
    - id: D-4
      statement: >-
        THE RARITY GAP IS RELOCATED, NOT RENAMED, AND BATCH-004 SHOULD RUN once
        the amendments land. EV-HQC-6fd5b1 O-6 was a non-identifiability
        statement WITHIN one law; at the reduced sets the joint moment is
        measured DIRECTLY at k = m, so O-6 is dead there. What remains is an
        EXTRAPOLATION obstruction across a family, which unlike O-6 admits
        in-range tests. Two corrections to the producer stand: "0.33 decades"
        understates the design, and HEUR-HQC-3's stated reason overstates it -
        the rare mode is ABSENT at m/lambda about 1, not merely invisible, which
        is a STRONGER limitation than was claimed.
      basis: TASK-20260802-e5ebe9, answering the question the Coordinator posed as decisive
    - id: D-5
      statement: >-
        FOUR HIGH-SEVERITY DESIGN DEFECTS MUST BE REPAIRED BEFORE ANY COMPUTE IS
        SPENT. (i) The primary null object CTRL-BS states a condition that does
        not imply the property it claims - the requirement belongs on the SHIFTS
        j*o_j, not the offsets, and the coprimality clause does no work at all.
        (ii) The wash-out hole is named but not closed: gamma-hat is invariant
        under dup, so the guard passes regardless and the uninformative_null
        trigger cannot fire. (iii) Exchangeability, correctly removed from the
        estimand, re-enters through HEUR-HQC-2's closure and can cause a
        spurious shutdown from covariance heterogeneity the oracle shows is
        real. (iv) HEUR-HQC-4's formal statement inverts its own
        destroy-parameter direction.
      basis: EV-HQC-0e9116 D-1, D-3, D-4, D-5
      why_this_is_not_a_failure_report: >-
        Every one of these was found BEFORE compute was spent. A null object
        that silently retains the dependence it is meant to remove would have
        invalidated the measurement and misdiagnosed it as an estimator
        artifact; a wash-out guard that cannot fire would have let a null
        FALSELY CONFIRM A17. Catching them at design time is the entire purpose
        of putting a red team in front of the batch that spends the budget.
    - id: D-6
      statement: >-
        THE COST MODEL IS NOT CURRENTLY REPRODUCIBLE. calib_m0.py and
        calib_m0b.py, the source of every machine constant behind D-2's and
        D-3's figures, exist nowhere in the repository and are not listed in
        required_artifacts. The Coordinator confirmed their absence
        independently. The feasibility CONCLUSIONS survive - both reviewers
        re-derived the arithmetic from the published formulas - but the
        machine-constant layer must be shipped before any run is costed against
        it.
      basis: EV-HQC-0e9116 D-6
    - id: D-7
      statement: >-
        THREE COORDINATOR CLAIMS ARE RETRACTED. (i) "The ladder has exactly two
        rungs, no walkable path" is FALSE AS STATED: it dropped the producer's
        one-knob qualifier, and a dup = 2 rung exists at 2.0e4 core-seconds
        under relaxed parameters - a rung that supplies the ONLY matched test
        HEUR-HQC-6 will ever get, so the unscoped claim foreclosed an experiment
        the campaign should run. (ii) The oracle receipt's "aligned case"
        verification omitted that n = 16 is a non-prime degenerate ring HQC's
        own rule forbids - disclosed in the artifact, dropped from the receipt.
        (iii) The "corroboration, not independent discovery" hedge was correct on
        independence but under-reported the content.
      basis: TASK-20260802-e5ebe9 overreads; (i) and (ii) reconfirmed by the Coordinator against the files
      standing_pattern: >-
        FOURTH CONSECUTIVE BATCH in which independent review corrected
        Coordinator claims. The pattern is recorded rather than moralised: the
        reviews are doing what they exist to do, and the corrections have
        repeatedly been material rather than cosmetic. (i) here is the clearest
        case yet - an unscoped restatement of a scoped result would have removed
        a cheap, affordable experiment from the campaign's future.
    - id: D-8
      statement: >-
        A COORDINATOR PROCESS DEFECT WAS FOUND IN THE QUEUE ITSELF. The
        BATCH-003 ledger archive depended on TASK-20260802-506c73, the archive
        retained to record the two session-limit-killed producers. That card
        claims FAILED tasks and can never complete, so the batch could never
        have closed. Found by TASK-20260802-e5ebe9 objection O11 and repaired
        before this archive ran.
      why_it_is_recorded: >-
        It is invisible until a batch tries to close, which is precisely why the
        red team is asked to read the coordination queue and not only the
        research artifacts.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Nothing is promoted, and the reason is specific rather than a shrug. The
      infeasibility result (D-2) and the two-rung structure are genuine internal
      derivations and are KN-FIND candidates - but the two-rung claim is now
      known to be SCOPED and was mis-stated by the Coordinator once already
      (D-7), and every cost figure rests on calibration scripts that are missing
      from the repository (D-6). Promoting either into an immutable corpus entry
      in that state would repeat BATCH-002's D-7 failure, where a
      flag-without-resolution was frozen into the corpus by the very batch that
      was correcting one. Both are promotion candidates for BATCH-004, after the
      amendments and once the calibration artifacts exist.
  knowledge_promotion_detail:
    held_back:
      - what: A KN-FIND for the structural infeasibility at HQC's own parameters
        reason: >-
          Strong, twice-reproduced, and genuinely this program's own derivation
          - held only because its cost layer is not reproducible until D-6 is
          fixed. This is a deferral with a named blocker, not a judgement that
          the result is unworthy.
      - what: A KN-FIND or KN-TECH for the two-rung ladder
        reason: >-
          Held pending the D-7(i) rescoping and the red team's dup = 2
          counterexample being independently checked. A corpus entry asserting
          an unscoped version would be worse than no entry.
      - what: A KN-TECH for the exact joint-moment oracle
        reason: >-
          The strongest candidate on the merits - it is verified, reproducible,
          and its mutant suite is reusable - but it is an instrument for a
          protocol that does not yet exist. Promote it alongside the frozen
          contract, not before.

  promotion_gates_status: >-
    NONE OF G1-G4 ADDRESSED. BATCH-003 advances no asymptotic-complexity claim
    of this program's own.

  claim_tier_effect: none
  claim_tier_effect_note: Toy ceiling stands. Nothing was measured.

  closure_quorum_admissibility: NOT_ADMISSIBLE
  closure_quorum_note: >-
    Both reviews ran on claude-opus-5 with fallback_used true - the same
    resolved model as both producers AND the Coordinator, which the validator
    stated explicitly and unprompted. AGENTS.md rule 13 requires pairwise
    distinct resolved_model_id. No attestation is recorded and none may be
    synthesized from these reviews.

  next_action: >-
    EXACTLY ONE NEXT ACTION: open BATCH-004 to REPAIR AND FREEZE, then run. In
    order: (1) fix the four high-severity defects - require CTRL-BS's SHIFTS
    j*o_j to be pairwise distinct and assert it at run start; replace the
    wash-out guard with one that is not invariant under dup, since gamma-hat
    cannot detect what dup does; remove exchangeability from HEUR-HQC-2's
    closure and the Cov label; correct HEUR-HQC-4's inverted direction.
    (2) RESCOPE the two-rung claim to its one-knob premise and EVALUATE the red
    team's dup = 2 rung at n = 11779, omega = 62, omega_r = 70, p* = 0.388705 -
    it costs 2.0e4 core-seconds and is the only matched test HEUR-HQC-6 will
    get, so it should be IN the protocol unless it can be shown not to work.
    (3) Ship calib_m0.py and calib_m0b.py and list them in required_artifacts,
    so the cost model is reproducible. (4) THEN freeze EXP-HQC-982268 and create
    H-HQC-18d1b4, and only then authorise the run. Do NOT spend compute before
    (1)-(3): the null-object and wash-out defects would each have made a null
    result uninterpretable, and a null that falsely confirms A17 is the worst
    outcome available to this campaign. Claim-tier ceiling stays toy.

  audit:
    considered_and_not_taken:
      - option: Freeze the contract anyway and let BATCH-004 repair in flight
        why_not: >-
          Both reviews declined to admit it, and the archive's own handoff
          committed in advance to not freezing a rejected contract. Two of the
          four defects would make a NULL RESULT UNINTERPRETABLE, which is the
          one failure this design exists to avoid.
      - option: Pause the goal on the infeasibility result
        why_not: >-
          The infeasibility is at HQC's OWN parameters only. A route at the
          exact moment order was found in the same batch, and pausing at the
          moment the route appeared would be textbook premature closure.
      - option: Promote the infeasibility result to the corpus now
        why_not: >-
          Its cost layer is not reproducible until the calibration scripts
          exist, and BATCH-002 already froze one flag-without-resolution into an
          immutable entry. Deferred with a named blocker.
      - option: Quietly rescope the "two rungs" claim without recording it
        why_not: >-
          It was stated unscoped in a snapshot receipt, a commit message and a
          user-facing report. D-7 records the retraction; the receipt and commit
          are immutable and are superseded, not rewritten.
  inference:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: claude-opus-5
    fallback_used: true
    model_verified: false
