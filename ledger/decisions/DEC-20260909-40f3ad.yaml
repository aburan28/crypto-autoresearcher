          "manual_derivation": "The same two-row/two-auxiliary support graph has det(A)=1 and rank(A)=2, so its left cancellation kernel is zero. The second row is group-valid for the same labels because 4+2*5+3-6=11. It is a general modular/intermediate-row control, not a claimed raw arity-3 collector tuple.",
