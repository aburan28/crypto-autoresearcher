          "manual_derivation": "Both rows are the first valid row of the positive fixture. The same lambda=(1,-1) gives lambda*B=0. The graph, det(A), rank(A) and left-kernel dimension match the positive fixture but projected rank is 0.",
          "expected": "Retain both acquisition attempts and duplication record; give the zero projected row no rank credit."
        },
        {
          "name": "singular_auxiliary_redundant_projection",
          "N": 11,
          "A": [
            [
              1,
              1
            ],
            [
              1,
              1
            ]
