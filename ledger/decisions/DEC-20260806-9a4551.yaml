coordinator_decision:
  id: DEC-20260806-9a4551
  decided_by: coordinator
  decided_at: '2026-08-06'
  decision: refine
  target_ids:
  - GOAL-HQC-001
  - EXP-HQC-982268
  - H-HQC-18d1b4
  - EV-HQC-67a6ec
  context: "BATCH-2ecaa1 dispatched DEC-20260806-1ac8fa's next_action -- the campaign's first defect
    injection into stage_a.py's REAL (T)-sampler path, scoped as a small pilot with a binding stopping
    rule attached: mechanically sound -> scale to the full run; needs structural redesign -> PAUSE review.
    TASK-20260806-77a574 built and ran the pilot; TASK-20260806-1281e1 snapshotted it before either
    review; TASK-20260806-8d4d48 (Validator) and TASK-20260806-92aecb (Red Team) reviewed it
    independently and in parallel. This decision applies the stopping rule and closes the batch on their
    reports plus EV-HQC-67a6ec."
  rationale:
  - 'THE STOPPING RULE''S TWO NAMED OUTCOMES DO NOT CLEANLY FIT WHAT THE REVIEWS ACTUALLY FOUND, AND THAT
    IS RECORDED PLAINLY RATHER THAN FORCED INTO ONE BUCKET. Neither reviewer found grounds for "needs
    structural redesign" -- both independently confirmed, via their own fresh reimplementations rather
    than by trusting the executor, that the injection mechanism is genuine and mechanically sound: the
    Validator reproduced the executor''s exact shards bit-for-bit and recomputed every statistic exactly;
    the Red Team''s own matched-pair probe found an even LARGER, more clearly significant local injection
    effect than the executor demonstrated. But neither reviewer endorsed "mechanically sound, therefore
    scale to the full run" as a clean green light either. The Validator flagged, as a limitation rather
    than a redesign trigger, that no positive control was run so the null cannot distinguish "no effect"
    from "underpowered." The Red Team went further with new evidence: the pilot''s actual comparison
    design (disjoint PRNG shards) has standard errors 2.8-10.6x wider than a matched-pair design would at
    the identical trial count, so the reported null is consistent with both a near-zero effect and a real
    effect of the magnitude the raw point estimates suggest. The comparison method used cannot
    distinguish these -- which is a finding about statistical power, not about mechanical soundness, and
    the stopping rule as written does not have a branch for it.'
  - 'RULING: NEITHER SCALE TO THE FULL RUN NOR PAUSE. The full ~305,000-trial run would commit real
    budget to resolve a question this pilot''s own already-collected data can address for free, and doing
    so before knowing whether the measurement methodology can even detect the injected effect at all
    would repeat exactly the discipline failure this program''s inventor protocol warns against --
    spending on a larger test before the cheaper diagnostic is exhausted. PAUSE is equally unwarranted:
    both reviewers confirm the injection mechanism works, this campaign''s remaining budget is not the
    binding constraint here, and the Red Team explicitly did NOT recommend redesign or pause -- it named
    three concrete, cheap next steps instead. The responsible middle path, consistent with how every
    prior batch in this campaign has been scoped (a cheaper diagnostic before a costlier commitment), is
    to run those steps first.'
  - 'THE RED TEAM''S NAMED NEXT STEPS ARE ADOPTED AS THIS BATCH''S DIRECT SUCCESSOR, IN THE ORDER THAT
    MAXIMIZES INFORMATION PER UNIT COST: (1) a MATCHED-PAIR REANALYSIS of this pilot''s own already-
    collected data -- free, since it reuses the existing generated bits rather than requiring new
    sampling -- to see whether the tighter SE resolves the ambiguity outright without spending any new
    budget; (2) a REAL POWER CALCULATION derived from the defect''s own measured local effect size (10.7
    percent flip rate at the injected block, per the Red Team''s matched-pair measurement) rather than
    reusing the undefected estimator''s T_req, to determine the actual required T for THIS defect class
    at THIS injection point; (3) if (1) and (2) leave genuine ambiguity, a POSITIVE-CONTROL PILOT at a
    less-diluted injection point (V1, global, not yet tested at the real sampler) to obtain this
    campaign''s first actual positive detection through the real-sampler pipeline -- establishing that
    the methodology CAN detect something before concluding it detects nothing.'
  - 'A STOPPING-RULE GAP IS NAMED FOR FUTURE BATCHES: DEC-20260806-1ac8fa''s binary framing (sound ->
    scale up; broken -> pause) did not anticipate a mechanically-sound-but-underpowered-comparison
    outcome. This decision does not retroactively fault that framing -- it was reasonable given what was
    known before this pilot ran -- but records the gap so a future stopping rule in this campaign
    explicitly allows for a bounded "resolve the ambiguity cheaply" branch rather than forcing a
    premature commit-or-abandon choice.'
  evidence_refs:
  - EV-HQC-67a6ec
  - EV-HQC-bfb257
  - EV-HQC-163374
  - EV-HQC-9a30d3
  - EV-HQC-db1fd9
  - EV-HQC-b71230
  - coordination/goals/GOAL-HQC-001/batches/BATCH-2ecaa1/reviews/TASK-20260806-8d4d48/validation_report.yaml
  - coordination/goals/GOAL-HQC-001/batches/BATCH-2ecaa1/reviews/TASK-20260806-92aecb/red_team_report.md
  limitations:
  - NO statement about HQC, its decoding-failure rate, assumption A17 or A5, or any standardized
    parameter set. Claim tier stays toy.
  - H-HQC-18d1b4 UNCHANGED at proposed. Five consecutive batches of instrument-trust, feasibility, and
    pilot work have not moved it.
  - experiments/EXP-HQC-982268/specification.yaml is not amended by this decision. Neither the full run
    nor any further pilot work is pre-authorized beyond the three named next steps.
  - None of the four asymptotic-complexity promotion gates is engaged; none is claimed.
  - The matched-pair reanalysis and power calculation, being derived from this pilot's own data and
    effect-size measurement, cannot themselves supply a genuinely independent confirmation -- they
    resolve ambiguity in the EXISTING data, they do not constitute a new, independently-drawn sample.
    Only the positive-control step (3), if reached, supplies new data.
  knowledge_promotion:
    promoted: []
    not_warranted: 'A real methodological lesson is visible in this batch: a between-shard comparison
      design can look statistically clean (a null with a stated SE) while being far less powered than an
      available free alternative (matched-pair, reusing the same draws) -- and the difference is large
      enough (2.8-10.6x in this instance) to change whether a result is informative at all. This is close
      to KN-TECH-worthy but held pending confirmation that the matched-pair reanalysis (next_actions item
      1) actually resolves the ambiguity as expected; promoting the lesson before testing whether it
      changes the conclusion here would be premature. No KN-FIND: nothing was measured about HQC.'
  next_actions:
  - "Dispatch a matched-pair reanalysis of TASK-20260806-77a574's already-collected pilot data (no new
    sampling required): recompute the defected-vs-undefected comparison using paired draws instead of
    disjoint PRNG shards, at k=m=17 and across the full reported k range, and report whether the tighter
    SE resolves the null as genuine or reveals a real effect the between-shard design's wider SE masked."
  - "In the same task, derive a real required-T for this specific defect class and injection point from
    the Red Team's measured 10.7 percent local effect size (not the undefected estimator's T_req), and
    report what trial count would be needed for adequate power at the propagated (not local) statistic."
  - "If, after (1) and (2), genuine ambiguity remains -- the matched-pair reanalysis is inconclusive or
    the derived required-T is itself uncertain -- dispatch a positive-control pilot at a less-diluted
    injection point (V1, global off-by-one, not yet tested at the real sampler), to obtain this
    campaign's first actual positive detection through the real-sampler pipeline before any further
    scale-up decision."
  - "Only once the campaign has either a resolved matched-pair result or a positive control in hand
    should the original stopping rule's two branches (scale to the full T_req run, or a PAUSE review)
    be revisited, now with adequate information to choose between them rather than choosing under the
    ambiguity this pilot's design left unresolved."
  - "Carry forward, lowest priority: the unreconciled run-count discrepancy from the V1 arm (BATCH-4b8ad3)
    remains unresolved."
