  decision_scope: >-
    CONFIRMS scoped_no_candidate as the correct, honestly-scoped disposition
    for all six candidates (C1-C6: witness-set/numerical irreducible
    decomposition, monodromy-based decomposition, parameter/coefficient-
    parameter homotopy continuation, numerical resultant via random linear
    slicing, Smale's alpha-theory certification, finite-field-native
    probabilistic saturation) against the frozen gate G1-G8 (amended
    wording). CONFIRMS the general witness-set degree-floor fact (a witness
    set for a degree-D variety needs at least D homotopy paths, genuine and
    well-established) and its numeric anchor: independently re-verified by
    reading experiments/EXP-CREP-001/packages/ROUTE-08-displacement-representation/package.json
    directly, confirming node n2 (materialize_resultant_coefficients)
    carries cost_exponent_in_B 3 and the package's own exponent_certificate
    online.time_exponent_in_B is 3, genuinely matching what round 14 (and
    rounds 12-13) cite. FLAGS, without changing the verdict, that round 14's
    prose overstates this into "the ambient variety's degree is exactly
    deg(r_R) = Theta(B^3)" as an established mathematical fact: this same
    goal's own concurrent same-day derivation chain
    (pairproduct-telescoping-derivation, rcrep-definition-review,
    compact-zr-construction) already found build_packages.py's own docstring
    declares r_R's degree as Theta(B^2) (with Theta(B^3) there naming the
    representation cost, a distinct quantity), and that the two disputed
    literal readings of H-CREP-001's mechanism sentence give Theta(B^2) or
    Theta(B^4) -- neither of which is Theta(B^3) -- with RT103-C1 still
    undischarged on which reading is correct. Round 14 did not cross-check
    this against the goal's own concurrent findings. This does NOT change
    round 14's verdict: the G8 comparison against ROUTE-08's DECLARED
    certificate is procedurally sound regardless of r_R's disputed true
    degree, and G2/G3 fail independently of the exact figure. Future
    citations of round 14's degree-floor finding should qualify it as
    ROUTE-08's declared toy-route certificate, not a derived fact about the
    real r_R object. CONFIRMS both internal prior-art citations
    (knowledge/literature/KN-LIT-015.md; the never-promoted internal
    heuristic candidate ECFG-P1593 at inputs/idea_generation_20260719_batch4.md
    lines 798-882) as genuine and accurately quoted, by direct independent
    reading rather than trusting the producer's citation -- both concern a
    different hypothesis line (RQ-BKK-001/Semaev factor-base membership) and
    are honestly disclosed as corroborating, not duplicating, this round's
    exactness/field-mismatch finding.

  what_this_decision_does_not_do:
