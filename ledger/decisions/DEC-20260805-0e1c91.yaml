coordinator_decision:
  id: DEC-20260805-0e1c91
  context: 'GOAL-SSI-001 pre-compute design audit of IDEA-20260803-82b2b7 (trace-collision test for
    QM-STOPPING), considered for proposed batch BATCH-70a55a. The proposal was filed by the 2026-08-03
    analysis session (PR #141, commit 8c0ca209) as candidate NEW committed structure for the BATCH-043
    slot that GOAL-SSI-001''s next_action had intentionally left unfilled. No batch was opened; no
    experiment ran; no producer was dispatched. The audit is a KN-TECH-080 section 8 proof_search_map
    check performed before approval, and it FAILED on two of four checks.'
  decision: pause
  target_ids:
  - IDEA-20260803-82b2b7
  - GOAL-SSI-001
  - RQ-SSI-001
  rationale: 'Pre-compute proof_search_map audit under docs/inventor-protocol.md section 8 / KN-TECH-080
    fails on two of four audits. (1) BOTTLENECK MISIDENTIFIED: the proposal names "whether the stopping
    event is invariant under the FC0 trace projection" as what QM-STOPPING has been failing on. The
    committed control artifact records the FAIL as seven obligation rows, six not_instantiated for
    absence of source material and one rejected_as_insufficient; none is a measurability row. EV-SSI-041
    already classifies the gap in terms: "availability/host gap, not object obstruction". The proposal
    seeks an object obstruction where the committed evidence says there is an availability gap. (2)
    NEARBY-OBJECT CONTROL UNCONSTRUCTIBLE: FC0-EXT-PKG-SSI-001 freezes interface signatures and declares
    itself "not a CollimationSieve API surface"; it defines no execution model and no projection pi.
    The planted lossy-pi'' control is the proposal''s own hard blocker and cannot be built without
    inventing a host API, which every decision from BATCH-019 onward prohibits and which the proposal
    itself forswears. Under the proposal''s own F3 the modal outcome is an immediate stop, which this
    audit has already established at zero dispatch cost. Separately, the proposal''s lane_disposition_emitted
    prediction ("Retain FAIL IS NOT AN ADMISSIBLE OUTCOME") is in direct verbal conflict with the
    standing prohibition to retain QM-STOPPING FAIL; that conflict is repairable in a task card and
    is NOT the ground of this decline.'
  evidence_refs:
  - ledger/goals/GOAL-SSI-001/goal.yaml
  - coordination/goals/GOAL-SSI-001/batches/BATCH-018/tasks/TASK-20260730-043/stopping_law_artifact.md
  - ledger/evidence/EV-SSI-041.yaml
  - ledger/evidence/EV-SSI-042.yaml
  - coordination/goals/GOAL-SSI-001/batches/BATCH-021/tasks/TASK-20260730-055/fc0_extension_package.yaml
  - coordination/goals/GOAL-SSI-001/batches/BATCH-013/tasks/TASK-20260730-017/analyzer_results.yaml
  - coordination/goals/GOAL-SSI-001/batches/BATCH-022/tasks/TASK-20260730-059/scaffold/types.py
  - ledger/proposals/IDEA-20260803-82b2b7.yaml
  - analysis/SSI-ECDLP-SYNTHESIS-20260803.md
  limitations:
  - Claim ceiling toy_control. No breakthrough, closure, novelty, SOTA, QUERY_MEMORY clearance, or
    completion claim is authorized or made.
  - This is a DESIGN-AUDIT disposition on a proposal artifact. It is not empirical evidence about
    CSIDH, the collimation sieve, FC0, or any supersingular hardness assumption, and it does not weaken
    IDEA-20260803-82b2b7's underlying observation that eight-plus batches retained a FAIL with no
    named obstruction - that observation stands unrefuted.
  - The decline does NOT establish that no measurability obstruction exists. It establishes that the
    projection pi the proposal presumes is frozen is not defined in FC0-EXT-PKG-SSI-001, and that
    constructing one would be the host-API invention prohibited since BATCH-019.
  - Whether REV-1 or REV-2 is reachable is UNADJUDICATED here. BATCH-020 no_admissible_pin is a negative
    on one search, not a proof of unreachability.
  - 'Retained unchanged: FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED; QM-STOPPING FAIL with lane paused_pending_revisit;
    QM-MEMORY-MAP numeric_composition_operator_protocol_toy_partial; BATCH-020 no_admissible_pin;
    CollimationSieve@6f9188e4 pin untouched.'
  next_actions:
  - DO NOT open BATCH-70a55a. GOAL-SSI-001 capacity remains intentionally unfilled; current_batch_id
    stays BATCH-042 and the goal's single next_action is preserved unchanged by this task.
  - Route the section 6 QM-STOPPING premise-and-exit audit to /propose-ideas on RQ-SSI-001 so it acquires
    an IDEA record, a novelty screen, and its own proof_search_map before any Coordinator approval.
    Its deliverable is a row-by-row source_absent | object_obstructed | undetermined classification
    of the seven stopping_law_artifact.md section 4 obligations plus a reachability verdict on REV-1
    and REV-2.
  - Promote this decision to ledger/decisions/DEC-20260805-<tok>.yaml at the next GOAL-SSI-001 ledger
    archive, minting the token with tools/allocate_id.py and --check. Until then it is a coordination
    record and not an official transition.
  - Reconsider IDEA-20260803-82b2b7 only on revisit condition R-A (a committed artifact defines an
    execution model, a projection pi, and S as a subset of it) or R-B (the successor audit classifies
    at least one section 4 row as object_obstructed).
