      Zero runs, zero experiments, zero implementations, zero p-adic arithmetic
      on every side of this round - producer, validator and red team. There is
      no measurement, no seed, no sample and no measured obstruction anywhere in
      it, and none is asserted.
    - >-
      Both reviewers recorded resolved_model_id as claude-opus-5 and explicitly
      recorded it as NOT probe-verified, because the round contract permitted no
      network call. Two reviewers resolving to the same model is correlated
      judgement; they covered DIFFERENT joints, which is the property this round
      relies on, and no independence beyond that is claimed.
    - >-
      Control B is non-independent by construction - the moves M1 and M2 were
      abstracted from the four KN-FIND-002 classifications and validated by
      reproducing them, so the 4/4 is a fit statistic with no held-out object
      for M2 in the firing direction. One genuine held-out object exists, the
      anomalous curve, and it broke M1.
    - >-
      No null-object control exists for this round, and none can exist without
      running something. Until RC-1 runs, the reported flatness in the precision
      parameter is a derived claim with no measurement standing behind it, and
      it must not be cited as one.
    - >-
      This decision rests on a review whose subject artifacts are, at the time
      of the decision, still unrepaired - the memo and its proof-search-map
      carry the false universal statement, the misattributed caveat, and the
      false endomorphism-ring premise reproduced with a check mark. Records are
