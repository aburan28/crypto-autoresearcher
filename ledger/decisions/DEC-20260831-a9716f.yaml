coordinator_decision:
  id: DEC-20260831-a9716f
  recorded_at: '2026-08-31'

  decision: revise
  decision_label: idea436_ggm_gate_round_split_verdict_not_recordable_as_closure_bounded_erratum_required

  target_ids:
    - GOAL-ECDLP-001
    - ECDLP-IDEA-436
    - EV-ECDLP-048824
    - KN-OPEN-3417fc

  context: >-
    Disposes of the ECDLP-IDEA-436 GGM-simulability gate round under
    GOAL-ECDLP-001, proposal namespace
    B71-IDEA436-GGM-SIMULABILITY-GATE-20260831-c7c3ef, commissioned by
    DEC-20260831-169dc8 next action 2 as the first concrete attempt at
    KN-OPEN-3417fc own resolution criteria. The producer,
    TASK-20260831-c7c3ef (idea-generator, research-deep, effort high, zero
    runs), wrote a gate memo for the coordinate-valuation-profile family and
    returned the verdict scoped_rejection_simulable. Its bytes were
    snapshot-archived alone by TASK-20260831-60c419 at commit
    eeffdeb411bbd0b8d327d5799b2c3ed872cbcedb before any reviewer ran. A review
    plan naming two joints, one owner each, two proves-too-much objects, a blind
    re-derivation with a declared blind_from list, and an explicit escalation
    condition, was committed at 962e2f7ff BEFORE either reviewer launched, with
    the Coordinator prior and its own known weakness recorded in it. Two fresh
    concurrent independent sessions at review-adversarial, xhigh, then ran and
    were committed at 874b08904 - TASK-20260831-c6ceb9 (validator, joint J1,
    attested verdict holds, full disposition holds_with_findings) and
    TASK-20260831-62019a (red-team, joint J2, operative attested verdict
    breaks). Composed evidence is EV-ECDLP-048824.

  rationale:
    - >-
      A holds on one joint and a breaks on another is a SPLIT, not a pass.
      Joints are the claim load-bearing steps and are conjunctive by
      construction - templates/research-records.md states that if one fails the
      claim fails - and a blinded reviewer reports only on its own joint, so
      neither report is a whole-claim verdict and the composition is the
      Coordinator work. J2 broke. The claim as stated therefore does not carry,
      and the producer disposition is not recordable as an official closure in
      this archive.
    - >-
      The MATHEMATICS holds. The Proposition dichotomy is correct on the
      intended reading of the memo section 1.1, and the agreement is unusually
      strong evidence about the quantity rather than about the producer
      implementation - the validator wrote out and SEALED a full independent
      re-derivation before opening either blind_from path (sha256
      14b80674828ce3ff91d4d636e3ce494f61d9fb32a252264db13fdd25ad9630fc,
      2026-08-31T18:29:22Z, 107 lines) and independently derived the analogues
      of Corollaries 4.1, 4.2 and 4.3 before reading them. This is recorded so
      that nothing below is mistaken for doubt about the derivation itself.
    - >-
      The LICENSING INFERENCE does not hold as stated. The producer own
      proof-search-map method ceiling says the method can certify nothing about
      the real cost of any algorithm on a real curve and can never certify a
      lower bound in the structured GGM; KN-LIT-7606, quoted by the memo itself,
      says a plain-GGM simulability argument cannot close a candidate for real
      elliptic curves, and plain GGM is the strict branch the D1 closure lives
      in; KN-TECH-005 states its own bound as a barrier and not a proof that no
      non-generic attack exists. ECDLP-IDEA-436 is a proposal about real ECDLP,
      so a certification that says nothing about real curves cannot on its own
      ground its rejection. The disposition survives only on the memo model-free
      Corollary 4.3 ground, which the memo does not foreground.
    - >-
      Three further defects bear on the recorded scope rather than on the
      mathematics, and each has a zero-compute repair - the exponent step needs
      n prime and no stated hypothesis supplies it (KN-TECH-005 states its bound
      in the LARGEST PRIME FACTOR, while the memo states only gcd(n,p) equal to
      1 and its proof-search-map concludes Omega of the square root of n, false
      for composite n by Pohlig-Hellman); move M2 carries no cost bound and on
      its natural unbounded reading proves too much exactly as M1 does; and the
      O(1) figure presupposes a handle interface while the frozen family is
      integer-indexed, where the simulator must itself materialise handles at
      O(log n) and lands in KN-FIND-002 own NOT-closed-at-1/2 tier.
    - >-
      The proposed disposition is also BROADER than the findings support.
      ECDLP-IDEA-436 hypothesis H is a DISJUNCTION - a member of the frozen
      family D1, or a fixed statistic of the precision-r coordinate digits, D2.
      Only D1 was gated. D2 was assessed only at the weaker relative tier and
      its residue remains open. Closing one disjunct does not close the
      hypothesis, so scoped rejection of ECDLP-IDEA-436 as written may not be
      recorded even after the licensing repair.
    - >-
      The validator additionally falsified the Proposition LITERAL universal
      claim. On a non-minimal integral Weierstrass model - coefficients in Z_p
      being strictly weaker than a model realising the good reduction - the
      valuation takes the finite value 2 off the plus-or-minus locus, which the
      Proposition asserts is impossible. The two-valued partition, the
      group-theoretic separating predicate and the simulator all survive
      unchanged and every secondary consequence moves toward MORE degeneracy,
      so this cannot rescue the idea record; but it is a false stated sentence
      and a FAIL on the quantifier_fidelity proof-architecture check, and it
      must be repaired before anything is recorded on top of it.
    - >-
      A refutation artifact is not required by this decision, because this
      decision makes no adverse transition. Under
      docs/claims-and-verification.md the artifact obligation attaches to
      weaken, reject_scoped or a hypothesis moving to rejected. This decision is
      revise. The artifact question is deliberately deferred rather than
      quietly satisfied - the strongest artifact currently available is a
      derivation note (proof_status derivation on EV-ECDLP-048824), the RC-1
      control would raise it toward a checkable measurement, and neither exists
      in repaired form yet.
    - >-
      The round also has a real control gap that no amount of prose repairs.
      Zero runs means there is NO null object of the same shape, and the
      reported quantity is flat in the parameter meant to move it, which is the
      canonical artifact tell of docs/inventor-protocol.md section 3. Flatness
      here is derived rather than measured so the tell does not fire
      automatically, but a finite-precision implementation would report the same
      flatness and can never observe infinity, only at least r. KN-OPEN-3417fc
      own negative-resolution criterion is explicitly a measurement at toy p,
      and it has not been run.

