  escalation_determination:
    plan_condition: >-
      The committed review plan states that if either reviewer concludes the
      producer OFQ-1 - that this program has no canonical GGM branch, so
      KN-FIND-002 and KN-FIND-b7e091 evaluate on different branches and every
      corpus closed at exponent 1/2 carries an unstated model parameter -
      amounts to a CONTRADICTION of prior validated evidence rather than a
      scoping observation, then routing_rules unrecoverable-result-review fires
      and the round must be re-run at review-breakthrough, max, degradable
      false.
    outcome: 'DID NOT FIRE for this round.'
    assessed_by:
      - 'TASK-20260831-c6ceb9 (validator) - SCOPING OBSERVATION, NOT A CONTRADICTION; unrecoverable_result_review_fires false'
      - 'TASK-20260831-62019a (red-team) - SCOPING OBSERVATION, NOT A CONTRADICTION; escalation condition does not fire on OFQ-1 as stated'
    reached_independently: >-
      Yes. Both reviewers ran in fresh concurrent sessions under declared mutual
      blindness, neither read the other output, and each established the Fork-A
      branch of both finding records from the committed bytes rather than from
      the memo.
    composed_by: 'coordinator, in this decision'
    coordinator_composition_judgement: >-
      The red team stated explicitly that if the Coordinator judges OFQ-1 and
      its own OBJ-3 to be the SAME observation, escalation fires on OFQ-1 and
      this round re-runs, and it left that composition judgement to the
      Coordinator rather than deciding it silently. The Coordinator judges they
      are DIFFERENT. OFQ-1 asserts a model parameter is UNSTATED, which is a
      scoping gap about how the corpus is written and which is in any case only
      half true, since KN-FIND-002 declares its branch in its own scope block.
      OBJ-3 asserts that on one VALUE of that parameter the certification
      KN-FIND-002 records is unavailable, which is a claim about what a
      committed record supports. Escalation therefore does not fire on OFQ-1,
      this round is not re-run, and OBJ-3 is routed below to its own round at
      the tier its own subject demands.

  routed_separately_not_this_lane:
    subject: >-
      The recorded TIER of KN-FIND-002 (CC-3) and the recorded JUSTIFICATION of
      KN-FIND-b7e091 (CC-2), together with the incidence-oracle disagreement
      between the two records (CC-1) and the constant-overhead-criterion
      inconsistency the validator raised as F-5.
    required_policy: 'review-breakthrough, max effort, degradable false, independent session'
    basis: >-
      AGENTS.md rule 12 - a contradiction of established evidence receives
      independent review-breakthrough review at max, and that policy may never
      be degraded. Both subject records are marked authoritative: KN-FIND-002 is
      status established, confidence strong, internal_refs EV-GGM-001 and
      DEC-20260726-007; KN-FIND-b7e091 is confidence proved, evidence_level
      theorem_backed, source_refs EV-GGM-79e710 and DEC-20260804-3b4258.
    recommendation_adopted_from: 'red-team TASK-20260831-62019a routing_recommendation'
    adopted_with_reasons: >-
      ADOPTED. Re-running THIS round would not help - the D1 content does not
      depend on either finding record in either direction, and under the R-OBJ1
      re-founding it does not depend on the GGM at all - so the contradiction is
      collateral to these joints rather than load-bearing on them, and folding
      it in would both mis-scope this round and give the corpus question a
      review tier below what it requires. The declined alternative is recorded
      as declined rather than passed over.
    status: >-
      NOT OPENED BY THIS DECISION and NOT this lane next action. It requires its
      own Coordinator opening decision, its own review plan with its own
      recorded prior written before any reviewer runs, and its own handoff. The
      red-team and validator findings are the INPUT to that round at derivation
      tier, never its conclusion. Until that round runs, both records stand as
      committed and no downstream work may cite this decision as having retiered
      either of them.

  procedure_deviations_recorded:
    - id: PD-1
      summary: >-
        tools/check_review_independence.py reported exactly one problem, a
        blind_from overlap for the re-deriver, dispositioned as a FALSE POSITIVE
        arising from the tool having no notion of the two-phase protocol the
        committed plan mandates. The validator listed both blind_from paths
        HONESTLY; deleting them would have turned the check green by falsifying
        a source list and was refused. This round blind-ordering property rests
        on the sealed pre-read hash and the reviewer ordering attestation, and
        is RECORDED AS A PROCEDURE DEVIATION, NOT AS A PASSING MECHANICAL CHECK.
        No downstream record may state that the independence check passed.
    - id: PD-2
      summary: >-
        tools/check_review_independence.py reads field names the committed
        review plan did not use - joints[].joint, joints[].assigned_to,
        joints[].attack_plan, proves_too_much.objects,
        proves_too_much.failure_signature, blind_rederivation.required and
        blind_rederivation.assigned_to - so on the plan as committed it would
        have PASSED BY NOT RUNNING. A schema shim, review-plan.checker.yaml,
        restating the committed plan verbatim in the names the tool reads, was
        required to make the check execute at all. This is a real tooling gap
        between the review_plan vocabulary in templates/research-records.md and
        the checker implementation, and a check that passes by finding nothing
        is worse than no check because it still reads as rigorous.
    - id: PD-3
      summary: >-
        After the red-team report body and session receipt were complete, the
        orchestrating Coordinator session asked that reviewer to confirm its
        plan-vocabulary token, and the reviewer revised the operative top-level
        attestation from holds to breaks while leaving the nested block
        byte-identical, so both remain visible. No objection, control outcome,
        scope or cost finding, escalation determination or control design
        changed. This is a departure from review finality and the committed plan
        does not authorise post-hoc reviewer contact. Two mitigating facts are
        recorded without excusing it - the query concerned internal consistency
        of a one-token mapping with findings already recorded, and the revision
        moved AGAINST the Coordinator own recorded prior, which expected the
        rejection to survive. A future round must obtain the plan-vocabulary
        token inside the report contract.
    - id: PD-4
      summary: >-
        A disclosed additive formatting addendum was made to each review report
        at Coordinator request, supplying the exact top-level review_attestation
        field names the checker requires. Additive only, disclosed in the
        reports themselves, with no finding or verdict content changed. Same
        class as PD-3 and rooted in PD-2.
    - id: PD-5
      summary: >-
        tools/research_dispatch.py could not render this queue AT ALL, because
        it requires positive handoff.budget.wall_clock_seconds and
        handoff.budget.memory_gb while this goal committed
        campaign_budget.per_task_resource_budgets_status_at_20260830_amendment
        sets both null for every task dispatched from 2026-08-30 onward, on the
        user explicit 2026-08-30 instruction to remove per-task budgets. The
        round ran through the same claim, subagent and archive pattern as rounds
        13 through 15 WITHOUT a passing dispatcher render. The dispatcher was
        NOT patched and no budget was reinstated. This is infrastructure signal
        and is never mathematical counterevidence.
      needs: >-
        A Coordinator decision or a user ruling on WHICH SIDE MOVES - relax the
        dispatcher precondition so that null reads as unbounded, or reinstate
        per-task budgets for this goal against the standing user instruction.
        Not decided here, because it is a harness-wide question that touches a
        committed user instruction and belongs in its own decision.

  limitations:
