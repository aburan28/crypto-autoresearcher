  repairs_required_before_any_disposition_is_recorded:
    all_are_zero_compute: true
    blocking_set_declared_by_the_red_team: [OBJ-1, OBJ-2, OBJ-6, OBJ-7]
    items:
      - id: R-F1
        source: 'validator TASK-20260831-c6ceb9, finding F-1, repair R1'
        repair: >-
          Amend the frozen setting to require a Weierstrass model over Z_p
          REALISING the good reduction, that is with v_p of the discriminant
          equal to 0, and add model non-minimality to the section 10 exclusion
          list. The literal universal claim of the Proposition is false without
          it, on the explicit substitution x equal to u squared times X with u
          equal to 1 over p, which leaves coefficients in Z_p and gives the
          finite valuation 2 off the plus-or-minus locus.
      - id: R-OBJ1
        source: 'red-team TASK-20260831-62019a, OBJ-1, major'
        repair: >-
          Re-found the section 0 verdict on the MODEL-FREE Corollary 4.3 ground
          - D1 is the free plus-or-minus fibre indicator, computable in one F_p
          x-coordinate comparison, therefore zero information and zero leverage
          for ANY adversary including a non-generic one - and demote the
          strict-GGM simulator, Shoup and the phrase closed at exponent 1/2 to
          corroboration, carrying KN-TECH-005 own barrier caveat forward
          verbatim. This is a re-founding that makes the result stronger and
          independent of the Fork-A question, not a retraction.
      - id: R-OBJ2
        source: 'red-team TASK-20260831-62019a, OBJ-2, major'
        repair: >-
          Add n prime to the scope block, or restate the exponent as 1/2 in the
          LARGEST PRIME FACTOR of n. KN-TECH-005 states its bound that way;
          KN-FIND-b7e091, whose argument style the memo extends, already carries
          the prime-order hypothesis, and the memo dropped it while widening the
          quantifier.
      - id: R-OBJ6
        source: 'red-team TASK-20260831-62019a, OBJ-6, major'
        repair: >-
          Restate M2 constructively with its O(1) cost bound - M2 fires if and
          only if there is an EXPLICIT simulator answering each query with O(1)
          group operations, inversions and equality tests on handles - and
          re-run Control A half 2 against the repaired statement, recording the
          outcome. D1 is unaffected because the memo exhibits exactly such a
          simulator.
      - id: R-OBJ7
        source: 'red-team TASK-20260831-62019a, OBJ-7, medium'
        repair: >-
          Declare the query interface as an explicit fourth fork and answer on
          both branches - handle interface, O(1), closed by the
          constant-overhead bound; integer interface, O(log n), NOT closed by
          that bound but still no sub-birthday advantage, in KN-FIND-002 own
          elliptic-net language - and charge the reference-handle
          materialisation in the profile-vector cost line.
      - id: R-OBJ8
        source: 'red-team TASK-20260831-62019a, OBJ-8, scope-bearing'
        repair: >-
          Split the disposition explicitly - D1 disposed in scope, D2 NOT gated
          and returned to the record with the section 10 item 2 sub-question
          attached. The single verdict label must become a two-part disposition.
          Hypothesis H is a disjunction and only one disjunct was gated.
    lower_severity_items_to_fold_in_while_the_artifact_is_open:
      - 'OBJ-3 and OBJ-4 erratum sentences - the misattributed KN-FIND-002 caveat, and the reproduced false endomorphism-ring premise marked correct'
      - 'OBJ-9 - the section 0 cross-reference pointing at section 7, which contains no scope limitation; point at sections 5.4 and 10'
      - 'OBJ-10 - unlike those two overstates the distinction, which holds only against the KN-FIND-002 jet oracle'
      - 'OBJ-11 - a sota_delta of plus zero on every axis is MATCHED, not dominated, until the per-query cost is charged'
      - 'OBJ-12 - add the van Oorschot-Wiener and Pohlig-Hellman frontier rows'
      - 'OBJ-13 and F-4 - separate the argument-level control from the record instrument-level positive control, and carry the exclusion of curves with p dividing n up into section 0'
      - 'OBJ-15 and F-2 - record that ordinary and p at least 3 are inherited and unused, and that under Assumption 3 the query-density exponent is 1, so the record own gate fails harder than reported'
