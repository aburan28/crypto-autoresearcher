  disposition_one_line: >-
    SPLIT VERDICT - the mathematics holds and was independently blind-re-derived,
    the licensing inference does not hold as stated, so the producer
    scoped_rejection_simulable is NOT recorded as a closure; the round is
    returned for a bounded zero-compute erratum with six named repairs, and
    ECDLP-IDEA-436 stays frozen at its existing state.

  what_this_decision_does_not_do:
    - >-
      It does NOT change ECDLP-IDEA-436 State, which remains
      proposed_unapproved_pending_review. That record is frozen and was not
      edited by the producer, by either reviewer, or by this decision.
    - >-
      It does NOT record a scoped rejection of ECDLP-IDEA-436, of disjunct D1,
