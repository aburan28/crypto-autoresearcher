      against them are recorded as CC-1, CC-2 and CC-3 on EV-ECDLP-048824 at
      derivation tier and routed, not acted on.
    - >-
      It does NOT accept the round Control B as an independent control, and does
      not treat the reported 4/4 oracle reproduction as validation of M2 in the
      firing direction.
    - >-
      It does NOT report the mechanical independence check as passing, does not
