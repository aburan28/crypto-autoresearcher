        b_is_square_in_Fq false.
      - random_no2torsion has cofactor 3.
    - The norm criterion for b = 372z, recomputed by hand:
      - N(372z) = 372^5 * 2, so its Legendre class mod p' is that of
        744 = 2^3 * 3 * 31.
      - p' = 2^30 + 7 is 7 mod 8, so (2|p') = +1.
      - p' is 2 mod 3 and 3 mod 4, so (3|p') = (2|3) * (-1) = +1.
      - p' is 8 mod 31 (since 2^30 = (2^5)^6 is 1 mod 31), and 31 and p' are
        both 3 mod 4. So (31|p') = -(8|31) = -(+1) = -1.
      - The product is -1: b is a NON-square. The curve is double-odd,
