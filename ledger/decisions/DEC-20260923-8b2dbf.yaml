  rationale:
    - >-
      THE ADDENDUM IS COMPLETE AND ADDITIVE. It has an explicit v2 -> v2-a1
      mapping (amends_v2_fields). It adds exactly one rung, fixed by v1 before
      any measurement, carrying the full v2 cell set, controls and envelope.
      Its evaluation sets are declared before any value. It sets a blocking
      control package at the new characteristic, and states a package count
      within the unchanged ceiling (31 + 11 = 42 of 48). It gives a
      deterministic infrastructure fallback, and names paths and development
      checks. It edits no v2 byte. The one criterion change (the A1-3 sets) is
      made stricter on the controls and corrected to the frozen primary shape
      on the primary side, before any outcome. That is what AGENTS.md requires
      of a versioned protocol_amendment.
    - >-
      IT MAKES THE DECISIVE QUESTION ANSWERABLE. Without it, goal criterion
      C1's measured side and KN-OPEN-9b4a2b's flatness question are
      guaranteed not_applicable on the primary shape for every arm
      (DEC-20260923-034ba0 R-4). With it they are answerable, subject only to
      the solver completing at 31 bits, and a failure there is an envelope
      outcome, never a result. Approving is the choice that keeps the
      high-value question open (AGENTS.md "Research-direction integrity").
    - >-
      WHY CONDITIONS AND NOT A REVISION. No defect was found that makes the
      protocol unsound or its reading ambiguous.
      - AA-3 turns a judgement clause into a check.
      - AA-4 adds a like-for-like descriptive figure the review would
        otherwise have to compute ad hoc.
      - AA-5 records implementation facts that stage 1b must respect.
      - AA-2 makes R-5 binding on the dispatcher, where the immutable
        TASK-20260923-cd932c card cannot carry it.
      Returning the draft for these would cost a round trip and would change
      nothing a condition cannot carry.
    - >-
      SEQUENCING IS THE LOAD-BEARING CONTROL. Stage 1b and phase A of
      TASK-20260923-4ff597 come before stage 2. The whole v2-a1 run set is
      therefore fixed and hash-bound before any v2 measurement exists, and the
      stage-1b executor sees no v2 outcome. Without that, a late addendum
      would be weaker evidence (R-5 why_stage_1b_first). The cost stands as
      R-5 stated it: the v2 fixture gate is delayed by one implementation
      task.
    - >-
      NO SECURITY READING. Everything here is toy EcGFp5-shaped arithmetic at
      p' <= 1073741831 with known scalars. Nothing transfers to
      p = 2^64 - 2^32 + 1 except under HEUR-GFPN-DFLAT as frozen.

