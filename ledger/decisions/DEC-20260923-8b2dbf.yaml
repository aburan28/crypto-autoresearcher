  proof_search_map_audit:
    applicability: >-
      The addendum is not itself a theorem. It is an additive protocol change
      to a measurement, run under a hypothesis carrying a numbered heuristic
      (HEUR-GFPN-DFLAT). The audit therefore reads the addendum's measurement
      design, its new control package controls_a1 and its A1-3 evaluation rule
      against the four audits. DEC-20260923-e788a1's audit of the v2 mechanism
      stands, and nothing here re-opens it.
    baseline_reproduction: >-
      PRESENT, and INHERITED plus EXTENDED.
      - The v2 blocking gate is unchanged: fixture F-1 to F-3 at n = m = 3 at
        4111 and 16777291, the JV anchor identity, and the frozen controls.
        controls_a1 may run only after all four v2 gate packages are
        completed_valid with gate_pass true (A1-2 gates, lines 273-284).
      - At the new characteristic, controls_a1 is BLOCKING for every addendum
        package. Its six checks:
        (a) an independent known-scalar recheck for all three shapes;
        (b) a PARI ellcard recheck of the three orders, with the double-odd
            facts;
        (c) (beta, lam) for both 2-torsion shapes, and the rq refusal on the
            curve without rational 2-torsion;
        (d) msolve on synthetic zero-dimensional systems of known degree
            (8 and 64);
        (e) planted m < n lifting-path checks for torsion_S3_rq and
            S3_rescaled on the 31-bit curve, each certificate passing the
            independent verifier;
        (f) single-flip and held-out checks.
      - The same checks run first as stage-1b development checks A1-7 (b) to
        (d).
      COMPLETENESS OF controls_a1 (DEC-20260923-034ba0 next action (1)). It
      covers every characteristic-dependent input of the pipeline: group
      order, the square class of b, the solver's modular path, the lifting
      path and the verifier arithmetic. It does not repeat the
      characteristic-independent identity controls (F-1 to F-3,
      degenerate_symmetrization_identity) at 31 bits. That is accepted below
      (residual gap G-1).
    observation_collision: >-
      PRESENT. The observable is the cell D (FGLM ideal degree) per rung, and
      its relative variation over a declared triple. Four collisions are
      named, each with its separator.
      (1) An off-shape curve and an on-shape curve at the same prime would
          both yield "an ecgfp5_shaped D". Separator: A1-4 labels every
          (16777291, ecgfp5_shaped, c = 59) row `off_shape_non_double_odd`,
          and A1-3 excludes it from every primary set. The rq and
          S5_rescaled refusals there are construction-precondition refusals,
          never D.
      (2) A correct D and a wrong-but-parseable D from a solver misbehaving
          at a new characteristic. Separator: A1-7 (b) and A1-2 (d) solve
          synthetic systems of KNOWN degree at p' = 1073741831, and every
          accepted decomposition carries a certificate re-verified
          independently. This separator is partial for large D (G-2).
      (3) A solver fault at 31 bits against a fault in the addendum's own
          harness. Both would show as a failed A1-7 (b). Separator: AA-3 runs
          the identical harness at the known-good characteristic 16777291 in
          the same session, before FB-1 may fire.
      (4) A primary-shape DFLAT failure caused by genuine p-dependence
          against one caused by small-characteristic behaviour at the 13-bit
          rung. HEUR-GFPN-DFLAT is stated "above a small absolute bound".
          - The primary set has exactly one eligible triple, and it contains
            4111. The controls have triples that exclude 4111.
          - Separator: a READING, not a verdict change. The per-rung D table,
            the control triples without 4111, and the matched-triple figure
            of AA-4 let the review localise a failure. The A1-3 verdict stays
            as frozen (G-3; AA-7).
    quantifier_order: >-
      PRESENT and pre-registered. In this order:
      (i) The ladder rung p' = 1073741831 and its three curves were fixed by
          v1 before ANY measurement (ladder.json role "ladder", selection
          seed '2026092002:ladder:1073741831').
      (ii) The evaluation set S for every (arm, shape) is declared now, before
           any value (A1-3).
      (iii) For each (curve, p'), (beta, lam) is fixed by v2's rule before any
            target is drawn.
      (iv) Targets come from random.Random('2026092001:v2:targets:1073741831:<shape>'),
           identical for every arm and for m = 5 and m = 4 of a (p', shape).
           Stage 1b confirms that no v1 or v2 stream used this key
           (A1-7 (f)).
      (v) FB-1's trigger depends only on synthetic systems, never on a ladder
          object. Its curve rule (the smallest c >= 1 with order 2q, q proved
          prime, and b a non-square) involves no D.
      No witness depends on a target, a measured D or a v2 outcome. The whole
      v2-a1 run set is fixed and archived (phase A of TASK-20260923-4ff597)
      before any v2 measurement exists (AA-2).
    method_ceiling_and_nearby_object: >-
      PRESENT. The ceiling is unchanged from DEC-20260923-e788a1: measured D,
      flatness over declared triples, R_ref where the reference completes, and
      a modeled band emitted only under B-3 (A1-3 band clause).
      - The addendum adds nothing above that ceiling.
      - A TRUE primary-shape verdict supports flatness over {13, 19, 31} bits
        on toy EcGFp5-shaped curves only. It says nothing at p = 2^64 except
        under HEUR-GFPN-DFLAT as frozen (transfer_assumptions (4)).
      Nearby objects, all run at the new rung:
      - the matched random_2torsion curve (b non-square, cofactor 2);
      - random_no2torsion, which must refuse the rq, rescaled and norm arms;
      - the norm arm as a labelled negative control (order 3840).
      The c = 59 off-shape curve stays a labelled nearby object with no
      verdict (A1-4 (4)).
    separate_obligations: >-
      PRESENT. Each has its own check, and none is hidden inside a runtime or
      feasibility step:
      - triple accounting: A1-3, dev check A1-7 (a) on synthetic 3- and
        4-rung inputs, and the completion-gate checker A1-7 (4);
      - off-shape labels: A1-4 and A1-7 (4);
      - solver health at 31 bits: A1-7 (b) and A1-2 (d);
      - parameter verification: A1-7 (c) and A1-2 (b);
      - verifier arithmetic: A1-7 (d);
      - wrapper refusals: A1-7 (e);
      - stream disjointness: A1-7 (f);
      - the shared 48-package ceiling: AA-5 (e).
    residual_gaps_accepted:
      - id: G-1
        text: >-
          No n = m = 3 fixture at 31 bits. The frozen data has no n = 3 curve
          at that characteristic, and selecting one would add a degree of
          freedom the addendum deliberately avoids. The construction's
          algebra is gated at 13 and 25 bits by F-1 to F-3. At 31 bits the
          characteristic-dependent steps are checked by controls_a1 (a) to (f)
          and A1-7 (b) to (d).
      - id: G-2
        text: >-
          A small synthetic system cannot certify msolve at the large D of an
          m = 5 cell. A solver that silently dropped solutions at large D
          would lower D while every surviving certificate still verified. This
          exposure is the same as v2's at 25 bits. It is a review joint
          (AA-7), not a reason to withhold approval.
      - id: G-3
        text: >-
          The primary shape has exactly one eligible triple, {13, 19, 31}
          bits. A 13-bit anomaly on that shape cannot be separated from p'
          dependence by the primary data alone. This is disclosed, and read
          under AA-4 and AA-7. The A1-3 rule is not changed after the fact.
      - id: G-4
        text: >-
          Under FB-1 the primary span is exactly 12 bits, at the floor with no
          margin (DEC-20260923-034ba0 R-3 R-b "against").
    verdict: >-
      PASSES the gate. All four audits and the separate obligations are
      present before compute. controls_a1 and the A1-3 rules are complete for
      what the addendum claims, and gaps G-1 to G-4 are disclosed.

  # --------------------------------------------------------------------------
  # FB-1 DISPOSITION
  # --------------------------------------------------------------------------
  fb1_disposition:
    ruling: >-
      ACCEPTED as pre-declared (A1-9), with the narrowing condition AA-3. FB-1
      stays an infrastructure-only branch. R-5's sequencing is unchanged under
      it: stage 1b writes the FB-1 plan in place of the 31-bit plan, and
      everything else proceeds in the same order.
    why_accepted: >-
      - It is declared before any outcome. Its trigger reads only synthetic
        systems, and its curve rule is deterministic and independent of D.
      - Without it, a solver fault at 31 bits would leave every primary-shape
        verdict not_applicable, and would still need a new decision to
        recover. With it, that decision is taken now, blind to outcomes.
      - It keeps the frozen 3-prime / 12-bit rule reachable on the primary
        shape.
      - Its matched controls at 16777291 are v2's own rows, so it adds no
        control bytes.
    why_narrowed: >-
      A1-9's second trigger clause ("stage 1b attributes the failure to the
      solver rather than to the addendum's own code") is a judgement by the
      executor. A mis-attribution would silently switch the protocol branch.
      AA-3 replaces that judgement with a checkable criterion, and it only
      makes FB-1 HARDER to trigger.
    what_fb1_is_not: >-
      Neither the trigger nor FB-1 is evidence about any degree (A1-9
      not_a_result). A 31-bit solver fault is an infrastructure fact about
      msolve 0.6.5 on this host.

  # --------------------------------------------------------------------------
  # CONDITIONS
  # --------------------------------------------------------------------------
  conditions:
    - id: AA-1
      name: binding and authority
      text: >-
        Every addendum task computes the addendum's sha256 before writing any
        file, and refuses on any value other than
        2c5e052468e37111023dd116706149fb05d691e7188e26ae1e2c069bad792d0c. It
        does the same for the v2 amendment
        (e02d4976a5e773b9eee95aa4c376d6154e9c0a9da4e6c6118ed58748054924d3).
        The addendum's in-file `status: draft` is expected (in_file_status_note).
        Protocol v2 packages run exactly as trial-plan-v2.json defines them
        and record protocol_version 2. Addendum packages record "2-a1". The
        A1-3, A1-4 and A1-5 reading rules apply to v2 rows at reading time
        only, and never change a v2 byte.
    - id: AA-2
      name: SEQUENCING, BINDING ON THE DISPATCHER (restates DEC-20260923-034ba0 R-5 and addendum A1-8)
      text: >-
        The order below is NORMATIVE and binds the SESSION THAT DISPATCHES
        (AGENTS.md "Dispatch preconditions bind the DISPATCHER"). It binds in
        addition to each card's own preconditions, and it is binding even
        where a committed card is silent: TASK-20260923-cd932c and
        TASK-20260923-0fa03f are immutable and predate it.
        Standing rules:
        - Every archive runs ALONE.
        - Steps SQ-3, SQ-5 and SQ-7 never overlap each other or any other
          solver-running process on the host (EC-10; AC-6).
        - Each runs under a lane claimed on the BATCH-6b1c29 queue and
          released on return.
      sequence:
        - id: SQ-1
          step: Phase A of TASK-20260923-0fa03f.
          status: >-
            DONE: archive commit fb4597b20, backfill 2ae03d322, 14 paths
            bound, no scope finding.
        - id: SQ-2
          step: This decision is archived by TASK-20260923-58a958.
          condition: >-
            - Before that commit, the dispatching session runs
              tools/research_dispatch.py and
              tools/validate_dispatch_reference.py on the BATCH-6b1c29 queue,
              and both pass. A queue that fails is not committed.
            - After the commit, the post-commit verifier accepts it, the
              branch is pushed and PR #1383 (or its successor) is refreshed.
            - A queue revision then marks TASK-20260923-58a958 completed with
              its commit_sha and full path_sha256 coverage, and
              research_dispatch.py passes on it with the repository verifier.
            - `python3 tools/goal_lanes.py open-lane GOAL-GFPN-380702
              BATCH-6b1c29 --queue <queue path> ...` is run and published.
        - id: SQ-3
          step: Stage 1b, under TASK-20260923-4c64b5.
          condition: >-
            - It launches only after SQ-2 is complete in full.
            - The lane is claimed with `tools/goal_lanes.py claim <queue>
              TASK-20260923-4c64b5 --as executor --ttl-minutes N --publish`,
              after `git fetch` and `tools/goal_lanes.py lanes
              GOAL-GFPN-380702`.
            - The card's AC-1 preconditions hold: the 10 GiB child cap with
              getrlimit read-back, the memory-guard report, msolve -t 1, and a
              quiet machine.
            - The claim is released on return with --outcome
              completed|failed|abandoned.
        - id: SQ-4
          step: Phase A of TASK-20260923-4ff597.
          condition: >-
            - It runs ALONE, after stage 1b returns with outcome completed
              (the 31-bit plan, or the FB-1 plan under AA-3).
            - It binds the stage-1b paths by sha256, file by file.
            - The post-commit verifier accepts it, and it is pushed.
            - Then a queue revision records the phase-A commit in
              TASK-20260923-4ff597's archive block and sets
              TASK-20260923-cd932c from `blocked` to `queued`. That revision
              cites the phase-A receipt, and research_dispatch.py passes on
              it.
        - id: SQ-5
          step: Stage 2 of TASK-20260923-cd932c (the v2 plan, unchanged).
          condition: >-
            STAGE 2 MAY NOT LAUNCH until ALL of the following hold:
            (a) TASK-20260923-4c64b5 has returned and released its claim with
                outcome completed;
            (b) phase A of TASK-20260923-4ff597 is committed, accepted by the
                post-commit verifier and pushed;
            (c) the SQ-4 queue revision has set TASK-20260923-cd932c to
                `queued`;
            (d) a lane is claimed on the BATCH-6b1c29 queue with `--as
                executor`;
            (e) TASK-20260923-cd932c's own DP-1 to DP-6 hold, with DP-3
                satisfied by (d).
            Stage 2 never starts by default:
            - If stage 1b stops because the addendum cannot be built
              additively, or returns failed or abandoned, stage 2 waits for a
              NEW Coordinator decision (R-5 if_stage_1b_triggers_FB-1_or_stops).
            - A failed or abandoned stage 1b may be re-dispatched under the
              same card at claim epoch + 1, when the failure was
              infrastructure.
        - id: SQ-6
          step: Phase B of TASK-20260923-0fa03f.
          condition: >-
            It runs ALONE, after stage 2 returns (any outcome) and releases
            its claim. It is verified and pushed. A queue revision then marks
            TASK-20260923-0fa03f completed, with commit_sha and path_sha256
            covering every declared artifact. Before that, the revision
            appends the staged run-package files to TASK-20260923-cd932c's
            artifact_paths, as listed in the post-run receipt.
        - id: SQ-7
          step: Stage 2b, under TASK-20260923-6c7f55.
          condition: >-
            - It launches only after SQ-6 is complete, and after a queue
              revision has added the exact run directories reserved in
              trial-plan-v2-a1.json to TASK-20260923-6c7f55's write_scope and
              set it `queued`.
            - A lane is claimed `--as executor`, and the card's AC-1
              preconditions hold.
            - It is NOT launched if any of the four v2 gate packages
              (RUN-GFPN-ac4487, RUN-GFPN-3377f1, RUN-GFPN-76420e,
              RUN-GFPN-b231c1) lacks run_status completed_valid with
              gate_pass true (A1-2 gates; AC-5). A Coordinator decision then
              records the addendum packages as not_attempted, with the
              reason.
        - id: SQ-8
          step: Phase B of TASK-20260923-4ff597.
          condition: >-
            It runs ALONE, after stage 2b returns and releases its claim, and
            before any review plan or reviewer. It is verified and pushed,
            followed by the completing queue revision.
        - id: SQ-9
          step: Review.
          condition: >-
            A Coordinator act writes the v2-a1 review_plan FIRST, with its
            recorded prior and covering both execution reports. Independent
            validator and red-team review follow. Every joint named in AA-7 is
            owned. No evidence-review decision precedes the reports.
    - id: AA-3
      name: FB-1 attribution is checked, not judged (narrows A1-9)
      text: >-
        (a) Stage 1b runs development check A1-7 (b) (the same harness, flags
            and seed strings) at p' = 16777291 as well as at p' = 1073741831,
            in the same session, synthetic systems only. 16777291 is the
            characteristic at which msolve runs on this pipeline.
        (b) FB-1 may trigger ONLY IF all three of the following hold:
            - the 16777291 run PASSES;
            - both seeded systems at 1073741831 FAIL with one of A1-9's
              solver-side signals (crash or signal, refused characteristic,
              unparseable output, or a degree mismatch reproduced on the
              ':2' system);
            - the failure reproduces on a single re-invocation of the failing
              command.
            If the 16777291 run also fails, the failure is attributed to the
            addendum's own harness. It is fixed within stage 1b, or stage 1b
            STOPS and returns. FB-1 does not trigger.
        (c) The trigger evidence goes into implementation-v2-a1.md verbatim:
            for each run, the command, exit status, signal, and the last 50
            lines of msolve stderr. Phase A of TASK-20260923-4ff597 STOPS if
            an FB-1 plan is present without that evidence.
        (d) The FB-1 curve search tries c = 1, 2, ... in order and logs every
            c tried in implementation-v2-a1/ladder-a1.json. If no c <= 5000
            qualifies, stage 1b stops and returns, and a Coordinator decision
            follows. The cap is machine protection. It does not change which
            c is selected when one qualifies at or below it.
        (e) No ladder curve, cell or fixture system is solved at any prime by
            any part of this check. Once written, the FB-1 or 31-bit plan is
            final for this protocol version. Changing branch after phase A
            needs a new Coordinator decision.
    - id: AA-4
      name: matched-triple figure (descriptive; declared before any value)
      text: >-
        aggregate_a1 additionally reports the relative variation on the triple
        {4111, 262151, 1073741831}, the same rungs as the primary set:
        - for random_2torsion, for every arm of A1-3's random_2torsion set;
        - for random_no2torsion S5.
        Under FB-1 the triple is {4111, 262151, 16777291}, which is v2's own.
        - Each figure is labelled "matched-triple figure (same rungs as the
          primary set); descriptive; not a verdict".
        - A1-3's verdict rules, sets and threshold are unchanged.
        - The figure lets primary-versus-control flatness be read on
          identical rungs. It is emitted only where all three rungs have a
          defined cell D; otherwise it is reported not_applicable.
    - id: AA-5
      name: implementation findings carried into stage 1b
      text: >-
        (a) v2_common.py line 46 hard-codes TASK_ID = "TASK-20260923-cd932c".
            No addendum manifest may carry it. Addendum run manifests record
            TASK-20260923-6c7f55 (A1-7 (3)). Stage-1b development notes record
            TASK-20260923-4c64b5.
        (b) v2_run_wrapper.py W-2 (lines 10, 92-98) accepts only ids reserved
            in trial-plan-v2.json. The addendum needs its own wrapper,
            reserving from trial-plan-v2-a1.json (A1-7 (2)).
        (c) v2_driver.py cmd_build (line 935) and cmd_cells (line 1016) take
            --p, and read their package through the module constant
            v2_common.PLAN_PATH (line 32). They may be reused only by setting
            module-level paths inside the addendum's own process (A1-7 (1)).
            cmd_controls hard-codes (4111, 262151, 16777291) at line 899.
            controls_a1 therefore needs its own entry point for
            p' = 1073741831. It does not call cmd_controls for the 31-bit
            rung.
        (d) implementation-v2/, implementation-v2.md and trial-plan-v2.json
            are archive-bound by phase A of TASK-20260923-0fa03f and must not
            be edited. If the addendum cannot run without editing them, stage
            1b STOPS and returns.
        (e) v2_run_wrapper.py W-7 (lines 124-127) counts only
            trial-plan-v2.json packages toward 48. The addendum wrapper
            refuses when the existing v2 run directories plus the existing
            addendum run directories would exceed the shared DC-7 A-7 ceiling
            of 48.
    - id: AA-6
      name: envelope, lane and machine quiet
      text: >-
        DEC-20260923-e788a1 AC-1 to AC-6 apply to every stage-1b development
        check and every stage-2b package exactly as to v2 packages:
        - RLIMIT_AS = 10737418240 bytes, set in the child and read back with
          getrlimit, with the read-back value logged. A child that cannot
          set it refuses to start.
        - driver RSS at most 1 GiB;
        - one memory-heavy process at a time;
        - task envelope at most 11 GiB;
        - msolve -t 1;
        - the lowered cap if the dispatcher's guard threshold is below
          12.0 GB.
        No other solver-running process runs on the host during stage 1b's
        check (b), PARI point counting, or any stage-2b package. Exhausting
        the cap is an infrastructure outcome and never evidence about D.
    - id: AA-7
      name: review-plan joints (in addition to DEC-20260923-e788a1's minimum joints and DEC-20260923-034ba0's)
      text: >-
        The v2-a1 review_plan names one owner for each of:
        (1) the A1-3 evaluation sets and triple accounting, including AA-4's
            matched triple;
        (2) the A1-4 off-shape labels in aggregate_a1 and in both execution
            reports;
        (3) the 31-bit solver-health evidence (A1-2 (d), A1-7 (b)) and, if
            FB-1 fired, the AA-3 trigger evidence;
        (4) the G-2 exposure: whether any m = 5 D at 31 bits is consistent
            with the other rungs' support counts and certificates, or shows a
            solver-side drop;
        (5) the G-3 collision: whether a primary-shape variation is localised
            at the 13-bit rung, read against the control triples that exclude
            4111. This is a reading. It never changes a verdict.
    - id: AA-8
      name: authorization scope
      text: >-
        Exactly the addendum's authorization block (lines 619-631): stage 1b,
        its archive, and stage 2b behind its gates. There is NO attack, NO
        unknown-scalar solve, NO deployed-curve instance, NO wall-time
        extrapolation, and NO change to H-GFPN-9a29be's status or
        HEUR-GFPN-DFLAT's statement. Amazon Bedrock is prohibited. Any band
        figure is model arithmetic, reported next to its own convention's
        constant. A reading of any figure as a break or a closure routes to
        review-breakthrough before any promotion.

