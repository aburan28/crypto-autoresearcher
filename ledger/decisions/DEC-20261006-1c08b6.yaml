  context: >-
    /design-experiment, one contract, and three new proposals.
    IDEA-20261006-6bb2ec is on origin/design/mlkem-0e9abf-isometry and
    is not on origin/main. The question is RQ-SDEG-001. No hypothesis
    or experiment on origin/main cites that full id. The branch
    design/sdeg-6bb2ec was created from origin/main at
    96d15ed85c00fbbdd6205beb2bdf02099c576fb5 and git merge origin/main
    reported already up to date.

    The contract freezes p = 61, one ordinary curve, one factor base
    of size 8, eight complete targets, a degree-8 Macaulay matrix,
    grevlex Gaussian elimination, and the integer tests of the two
    medians against 1/2 and 2. Success is the source idea's
    prediction. The concrete negative is a finished support-matched
    median strictly below 1/2. No matrix was built in this session
    and no nonzero count was recorded.

    This session opened KR-IC-5a43e5, KR-IC-5931ee, KR-IC-0d2021,
    KR-IC-e847d1, KN-LIT-0acb8c, KN-OPEN-002, and the explicit S_3
    polynomial in
    coordination/reviews/pfdr-battery-20260904/reviews/TASK-20260904-642cf5/v1_blind_rederive.py.
    Those rows are not a measurement of the peak ratio.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. Success fails
    when a finished support-matched median is strictly below 1/2, and
    it also fails when that median is at least 1/2 while the dense
    median is strictly above 1/2. No field required for approval was
    left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - A finished support-matched median strictly below 1/2 is reachable as a recorded outcome, so success is not automatic.
    - The support-matched arm, the dense arm, and the second elimination are the instrument controls.
    - A short draw after the cap of 32 is not scored as extra sparsity.
    - This session did not compute a nonzero count and did not claim that the exponent moves.

  evidence_refs: []
  limitations:
    - The measurement covers one toy prime and one cardinality. It does not transfer to cryptographic primes or to larger B.
    - A ratio of nonzero counts is not a change in rho cost.
    - An audit mismatch or a missing peak transcript is an instrument failure and is not a median below 1/2.
    - A timeout is failed_infrastructure and is not a mathematical negative.
    - This decision authorizes a later execution. It does not start one.
    - This decision does not edit a goal head.

