coordinator_decision:
  id: DEC-20260804-419e3c
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-050
  recorded_by_task: TASK-20260804-013
  archived_by: TASK-20260804-013
  context: >-
    BATCH-050 ran two parallel tracks. Track A audited IDEA-e88120 (class group
    DLP reduction) via proof_search_map. Track B specified H-ICI-063e91 and
    designed EXP-ICI-e622fd (isogeny orbit factor-base augmentation test).

  decision: mixed_advance

  decision_scope: >-
    IDEA-e88120 is blocked at specification: the h(D) << N group-order mismatch
    makes the ECDLP → Cl(O_K) DLP reduction non-invertible without a Pollard-rho-
    equivalent residual search. No Executor dispatch. Classify as BLOCKED_AT_SPEC.
    H-ICI-063e91 and EXP-ICI-e622fd advance to independent pre-exec review
    (review_required). GOAL stays active.

  target_ids:
    - GOAL-ECDLP-001
    - SG-ECDLP-002
    - IDEA-20260804-e88120
    - H-ICI-063e91
    - EXP-ICI-e622fd
    - BATCH-050

  rationale:
    - >-
      IDEA-e88120 blocked: h(D) ~ sqrt(p) while N ~ p. A class group DLP in
      Cl(O_K) recovers k only mod h(D) ~ 2^128 (at b=256), leaving ~2^128
      candidates — equivalent to Pollard rho. The reduction is not circular
      but is informationally insufficient. No novel reduction known from 20
      years of class-group-based cryptography (CSIDH literature).
    - >-
      H-ICI-063e91 advances: the density amplification test (does phi^{-1}(F)
      bring new factor-base coverage beyond a random map?) is a cheap, well-
      scoped experiment with pre-registered controls (random-map null,
      negation sanity). It tests a genuinely novel empirical question about
      the isogeny class structure.

  proposal_dispositions:
    - id: IDEA-20260804-e88120
      disposition: blocked_at_specification
      reason: >-
        Group-order mismatch h(D) ~ sqrt(p) << N ~ p. Reduction recovers k
        only mod h(D), leaving residual search = Pollard rho. To reopen:
        exhibit an invertible map from Z/N to Cl(O_K) or a new reduction
        that circumvents the order mismatch.
    - id: IDEA-20260804-027a00
      disposition: advanced_to_review
      next_step: >-
        Dispatch independent review-adversarial session to validate
        EXP-ICI-e622fd (frozen status: review_required) before approval.

  exact_next_action: >-
    Open BATCH-051: dispatch one independent pre-exec review of EXP-ICI-e622fd
    under review-adversarial policy. If PASS: freeze the contract, approve, and
    dispatch the Executor. If REVISE: loop once with a protocol amendment.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      IDEA-e88120 blocked before specification; H-ICI-063e91 at specified/
      review_required only. No validated finding to promote.

  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2
    sota_delta:
      time_exponent: not_applicable
      memory_exponent: not_applicable
      data_or_query_exponent: not_applicable
  claim_ceiling: theoretical
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-04'
