coordinator_decision:
  id: DEC-20260901-4205b2

  context: >-
    GOAL-AES-003 batch-opening act by the dispatching Coordinator
    (session coordinator-aes003-1, 2026-09-01). DEC-20260901-d46348
    closed BATCH-2f12ac with RANK 1 = a repaired carrier-statistic
    proposal via idea-generator. IDEA-20260901-026d6a was authored and
    filed on main (PR #677): an envelope-relative statistic X(h) =
    Ze(h) - F(h), where F is the exact forced-zero term derived by the
    BATCH-2f12ac red team, tested against a per-mask-subclass
    conditional null with a preregistered dead-arm anchor. Its Stage r0
    is 0-run analysis of committed receipts; Stage r1 is one producer
    batch of 7 runs (Gate-0 extended reproduction, fresh r=6 dead
    anchor at seed 531002 analyzed FIRST, confirmatory J5-2 alive arm
    at seed 531002 admitted only if the anchor passes, determinism and
    digest gates). Stage 1a/1b of IDEA-20260901-363851 remains
    explicitly gated.

  decision: open_batch

  decision_scope: >-
    THIS DECISION OPENS BATCH-5ed9a3 AND DISPATCHES ITS QUEUE. It does NOT move
    current_batch_id (that happens in the closing ledger archive), does
    NOT approve Stage 1a/1b, and does NOT assert any outcome. It
    authorizes execution of IDEA-20260901-026d6a Stages r0+r1 under
    the proposal's preregistered decision rule, with validator and
    red-team review before ledger recording.

  target_ids:
    - GOAL-AES-003
    - RQ-AES-003
    - BATCH-5ed9a3
    - IDEA-20260901-026d6a
    - TASK-20260901-ed281d
    - TASK-20260901-6dbb7b
    - TASK-20260901-5174ca
    - TASK-20260901-281b77
    - TASK-20260901-9ba501
    - EV-AES-241790
    - DEC-20260901-600997
    - DEC-20260901-d46348
    - EV-AES-732f71

  outcome: >-
    Batch opened. Producer TASK-20260901-ed281d executes Stage r0+r1; snapshot TASK-20260901-6dbb7b
    binds the producer package before review; validator TASK-20260901-5174ca and
    red-team TASK-20260901-281b77 run blind to each other after the snapshot; ledger
    TASK-20260901-9ba501 is the sole archiver of both review packages and records
    EV-AES-241790/DEC-20260901-600997.

  rationale:
    - >-
      RANK 1 of DEC-20260901-d46348 is exactly this proposal. The
      repaired statistic's null is satisfiable by construction and its
      anchor control answers the BATCH-2f12ac proves-too-much finding
      before any alive reading is admitted.
    - >-
      The batch is bounded: 0-run Stage r0 plus 7 runs (~7200 s
      binding baseline), O(1) memory, every stage boundary a stopping
      point with a committed reading.
    - >-
      A claim-changing outcome (RX-ALIVE or RX-DEAD on the repaired
      carrier statistic) gets both validator and red-team before ledger
      recording; the coordinator prior is recorded below before any
      reviewer runs.

  review_plan:
    prior: >-
      I expect the anchor on committed and fresh dead data to pass
      (p_extra near 1.0) because the repaired statistic subtracts the
      forced envelope; I expect the confirmatory alive arm to be the
      uncertain joint -- the seed-531001 residual was weak and
      unadjudicated, and seed variance is on record. Where I think it
      breaks: (a) the class-wise empirical null may be mis-estimated
      from finite miss trials; (b) the 1-byte residual may not
      replicate at seed 531002; (c) RX-ALIVE language may overclaim
      beyond one probe cell/toy tier; (d) if the anchor fires on the
      dead arm the statistic is indicted and no alive reading is
      admitted.
    joints:
      - joint: arithmetic/gates/receipt identity
        owner: validator
        attack_plan: >-
          Re-derive X, F, S and exact DP p-values in fresh code blind
          from the proposal; verify Gate-0 extended receipt identity,
          KAT pins, determinism, digests, preregistration chronology,
          and snapshot hashes.
      - joint: interpretation/scope/statistic validity
        owner: red-team
        attack_plan: >-
          Attack whether the repaired statistic is genuinely
          non-tautological, whether the conditional null is correctly
          conditioned, whether any RX-ALIVE reading proves too much on
          dead arms or null objects, and whether scope language stays
          within the probe cell/toy tier.
    blindness:
      declared: true
      lifted_for: null
    proves_too_much: >-
      The fresh r=6 dead anchor is the built-in proves-too-much
      control; the red team must additionally run the statistic's
      reading against the committed dead r=6 arm and any available
      null objects.
    blind_rederivation:
      required: true
      blind_from: producer implementation and run report; validator derives from proposal and committed receipts only.

  next_action: >-
    Execute the queue. On RX-ALIVE: Coordinator decision required
    before unblocking Stage 1a/1b of IDEA-20260901-363851 with the X
    statistic as an additive amendment. On RX-WEAK: named successors
    only, no full ramp. On RX-DEAD: carrier spend off; return to idea
    generation or shape-only reduced Stage 1 by new decision. On
    RX-ANCHOR-FAIL/RX-GATE-FAIL: invalid_measurement, halt, repair.

  evidence_refs:
    - ledger/proposals/IDEA-20260901-026d6a.yaml
    - ledger/evidence/EV-AES-732f71.yaml
    - ledger/decisions/DEC-20260901-d46348.yaml

  decided_by: coordinator
  decided_at: '2026-09-01'
  added: 2026-09-01
  recorded_at: '2026-09-01T23:50:00Z'
  author_role: coordinator
  author_session: coordinator-aes003-1

  inference:
