coordinator_decision:
  id: DEC-20260916-59921c
  recorded_at: '2026-09-16'
  recorded_by: coordinator
  area: SEMBIN
  decision_type: batch_opening
  decided_by: coordinator
  target_ids:
    - GOAL-SEMBIN-fcb7a2
    - BATCH-cbb416
    - EXP-SEMBIN-4fa22c
    - H-SEMBIN-a7e721
    - REVIEW-SEMBIN-20260916-cbb416
  title: >-
    Open BATCH-cbb416, the first batch of GOAL-SEMBIN-fcb7a2, and rank the approved EXP-SEMBIN-4fa22c
    BEHIND the pre-compute audit its own contract requires and nobody has performed

  why_now:
    ranking: >-
      GOAL-SEMBIN-fcb7a2 is a declared ECC goal (`tools/ecc_priority.py --classify`), so it is
      considered before non-ECC work at every selection point. Its head's next_action rank 1 —
      author and freeze the hypothesis and contract — was discharged on 2026-09-16 and struck.
      What that left is a goal with an APPROVED, NEVER-DISPATCHED contract and three of four
      completion criteria unmet, each requiring run evidence that does not exist
      (CORR-20260916-402547). Dispatching it is the highest-ranked action available under this goal
      and is ranked ahead of doing nothing on the strength of that gap alone.
    why_it_is_not_make_work: >-
      Stated because an unlimited ECC budget is the strongest invitation to make-work this program
      has. This batch is not activity against an impeded campaign: the contract is complete and
      frozen, its instrument is buildable on this host, and its first task can CHANGE WHAT THE
      SECOND ONE DOES. A batch whose first producer can cancel or reframe its second is the opposite
      of filling capacity.

  decision: >-
    OPEN BATCH-cbb416, the first batch of GOAL-SEMBIN-fcb7a2, and dispatch the approved
    EXP-SEMBIN-4fa22c through it — but rank the contract's own unperformed
    observation-collision audit AHEAD of its execution, and gate the execution on a
    committed Coordinator ruling about that audit's verdict rather than on its mere
    completion. Write REVIEW-SEMBIN-20260916-cbb416 in this same opening, before any
    reviewer runs, with five joints, two owners, a blind re-derivation, a proves-too-much
    control and four Coordinator priors recorded in advance. This decision moves no
    completion criterion, no hypothesis status and no experiment status, and it re-approves
    nothing.

  the_decision:
    opened: BATCH-cbb416 on GOAL-SEMBIN-fcb7a2, with a lane, a queue of eight tasks, and max_concurrent 1
    ordering: >-
      TWO PRODUCERS IN SERIES, NOT ONE. The collision audit (TASK-20260916-fc72a6) runs first and the
      execution (TASK-20260916-0c2802) is `blocked` behind a Coordinator ruling on its verdict —
      deliberately NOT merely behind its completion.
    review_round: >-
      REVIEW-SEMBIN-20260916-cbb416 is written and committed in THIS opening, before the executor is
      dispatched and long before any reviewer runs. Five joints, two owners, a blind re-derivation, a
      proves-too-much control, and four Coordinator priors recorded in advance.

  why_the_audit_comes_first:
    its_own_contract_demands_it: >-
      EXP-SEMBIN-4fa22c's proof_search_map carries `observation_collision_search` with status
      "REQUIRED BEFORE THE FIRST RUN and not yet performed". Section 8 of docs/inventor-protocol.md
      makes these audits cheap pre-compute falsification checks, and a failed audit is frequently the
      useful result.
    and_the_evidence_is_that_it_will_find_something: >-
      One regex over knowledge/, ledger/ and experiments/ — `first.fall.degree|first_fall_degree|d._F`
      — returned first-fall-degree machinery in at least six places this campaign has not read,
      including experiments/EXP-ECTD-9e4248/driver/reused/macaulay.py, EXP-SIG-007's
      ic_first_fall_fast.py, EXP-ALPF-006's round004_exp005_validated_firstfall run, EXP-PFGB-d630f6
      and EXP-ECTD-abb8be, plus five knowledge techniques. THE COORDINATOR DID NOT READ THESE and
      makes no claim about what they contain; that is the audit's job and the list is recorded in its
      card as a starting point explicitly marked as not a result.
    what_it_could_change: >-
      Three outcomes, all cheaper before the compute than after. (1) An existing validated
      Macaulay-rank instrument would make writing a third one waste — and whether one may be reused
      is a Coordinator ruling, since the contract forbids importing EXP-ICPERF's converter and says
      nothing about EXP-ECTD's. (2) An existing measurement on a comparable object makes the planned
      run a REPLICATION, which is worth doing and must be framed as one. (3) An existing measurement
      that CONTRADICTS H-SEMBIN-a7e721's prediction is worth more than the run.
    the_retrieval_index_is_unavailable_and_this_is_disclosed: >-
      kb/ has no .venv, no .env and no reachable Qdrant in this checkout, so `search_knowledge`
      CANNOT BE CALLED and the audit must search the repository directly. AGENTS.md is explicit that
      absence of a result is not evidence something was not tried and that recall is a FLOOR. The
      audit's card requires it to report a floor and to record the index's unavailability as a limit,
      never a clean bill of novelty.

  why_the_execution_is_blocked_rather_than_queued: >-
      `blocked` is a task state, not a goal state, and nothing here pauses a goal — the goal is
      ACTIVE and this batch is its work. The block exists because dispatching the executor the moment
      the audit returns would waste the audit: a collision that reframes the run, or hands it an
      existing instrument, or contradicts the prediction, changes what the executor should build.
      Unblocking is a committed decision that records what the verdict changed. If the verdict is
      `collision: none, recommendation: proceed`, that decision is short and says so.

  what_this_decision_does_not_do:
    - >-
      DOES NOT re-approve EXP-SEMBIN-4fa22c or H-SEMBIN-a7e721. Both were approved by
      DEC-20260916-6ce039 and neither record is touched here. Nothing in this batch may edit either;
      a change is an additive amendment under a new id.
    - >-
      DOES NOT assert that the hypothesis is true, that the prediction will hold, or that the run
      will produce evidence. Approval to perform work asserts none of those.
    - >-
      DOES NOT move any completion criterion. Opening a batch is not progress against a criterion,
      exactly as authoring a contract was not (CORR-20260916-402547). Criterion 4 remains the only
      one met, by DEC-20260913-8d19e5.
    - >-
      DOES NOT pre-authorize a review tier for a result nobody has seen. The plan states the ceiling:
      a claim presented as contradicting Proposition 5 needs `review-breakthrough` at max, which is
      undegradable and cannot be served here, so such a claim would stay un-promoted while the
      campaign stays active. DEC-20260916-88ac73 declined to pre-authorize a cheaper tier and this
      decision declines again — deciding a tier in advance for an unobtained result is the shape of a
      silent downgrade.

  review_plan_prior_recorded_in_advance: >-
    The plan's four priors are recorded there rather than repeated here, but one belongs in this
    decision because it bears on how the batch should be read: THE COORDINATOR EXPECTS THE
    SHUFFLED NULL NOT TO SEPARATE from the target, or to separate only weakly, and considers that
    outcome about as likely as the headline one. If it happens, S-6 makes the null failure the run's
    headline and no d'_F value is offered as evidence about Nagao. Writing that down before the run
    is what stops it from reading as a disappointment later.

  inference_declared_up_front: >-
    Every card in this batch sets `fallback_allowed: true` with a stated reason instead of inheriting
    `false` from AGENTS.md's handoff template. That default is correct for the contract and false for
    this machine, which holds no API credentials for any adapter backend, and BATCH-a33cda needed
    three separate after-the-fact amendments to learn it (DEC-20260916-7b2235, DEC-20260916-bec4b8).
    `tools/research_dispatch.py inference_advisories` renders this queue with nothing to report,
    which is the check working as intended rather than a claim that the binding is verified —
    `model_verified` is false throughout and is recorded as NOT OBTAINED, not as met.

  ranking_of_what_is_not_in_this_batch:
    - candidate: A second read of Nagao 2013/548 Section 7 on the m!-removing device
      not_ranked_because: >-
        CORR-20260916-273589 already corrected the attribution and the remaining uncertainty is
        historical credit rather than a measurement. Revisit if a claim in this campaign comes to
        depend on who invented the construction.
    - candidate: Extending the n-series above the contract's 12
      not_ranked_because: >-
        The contract's stopping rules already walk n upward and stop at censoring, so the reachable
        n is a measurement rather than a design choice. Revisit when a completed pass shows where it
        actually stopped.
    - candidate: A red-team pass on the hypothesis's mechanism before any data exists
      not_ranked_because: >-
        There is nothing yet to falsify beyond the reasoning already recorded, and the review round
        opened here attacks the instrument and the controls, which is where this batch can actually
        be wrong. Revisit if the run returns a separation, at which point the mechanism claim becomes
        load-bearing and a red team has an object.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This decision opens a batch. It establishes no mathematical result and no reusable technique.
    revisit_if: >-
      The collision audit finds an existing validated first-fall-degree instrument in this program.
      That would be a reusable technique worth a KN-TECH entry regardless of what this batch measures,
      and the audit's report is where it would come from.

