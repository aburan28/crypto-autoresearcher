      specified_by_task, and must declare proof_search_map.note and P-T.
    - >-
      RD-5 (J4 BA-J4-1; D-5 H1-L): either support S_M as a lower bound, with an
      argument, or remove the lower edge from H1's formal statement and
      falsification condition. Reconcile E2's "at least D*_R" with the one-step
      tolerance. RD-6 (J4 BA-J4-2; D-4): state M7's direction conditionally, or
      restrict it to the degree range where it is one-way, in H
      interpretation_limits, spec decision_mapping K4 revisit (ii) and the
      audit L-INT summary. A consistent binomial reading moves D* later for
      crossings at D >= 19. RD-7 (J6 BA-J6-1; D-8 S-10): rekey K4 revisit
      sub-condition (i) to a condition that can fail, and in the right
      direction. As written it holds in every run, because at m = 2 the
      threshold is the grid's lower edge. RD-8 (J9 limb and J3 N-J3-1; D-7):
      disclose MI-1's consequence at every degree where it is used (the 283
      pass-rule target and 359, not only 571), and give its direction (the
      ceiled reading lowers stage-1 cost; Semaev's "at most"). RD-9 (N-J2-5;
      C8): memory beside the carried SN-1 time-only figure at 409, and a C8
      sweep of carried figures, not only of the c8_scan locations.
