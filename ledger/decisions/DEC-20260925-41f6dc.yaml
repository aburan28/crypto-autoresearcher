  # ---------------------------------------------------------------------------
  rulings:
    - id: R-J9
      subject: CA-3, J9 against v2 value by value, before any key (worksheet j9_versus_v2)
      ruling: >-
        Q1 (tolerance 0.01 bit; exact on bit length and k). The v2 values are
        K-571 279.7471, B-571 284.8257, K-283 136.2534 and B-283 140.8257 (the
        last two carried unchanged by reference), and ECC2-79 38.8257, ECC2-89
        43.8257, ECC2K-358 174.5818 (k 359) and ECC2-353 176.2018 (k 1). J9
        agrees on all eight rows to within 5e-5 bit, with k and bit length
        exact. Q2 (tolerance 5.0e-4 bit, exact on m, under MI-1 = J9 KR-A). v2
        gives 186.307 at m 12 (571), 147.649 at m 9 (283) and 159.5451 at m 10
        (359). J9 gives 186.306952 at m 12, 147.649476 at m 9 and 159.545142 at
        m 10. Every row AGREES; the 283 row is at 4.76e-4 of the three-decimal
        target, the grid artifact J3 also reports. Q3: v2 freezes no D*(m)
        value (definitions.d_star_of_m.frozen_values: NONE), so Q3 is a record
        with nothing to compare, and no entry is NOT BLIND-RE-DERIVED. The
        cross-implementation check under the same reading (J1 Certicom rho; J3
        fixture, ceiled argmin and 283 values against J9) finds no
        disagreement. The composer prefers neither implementation.
      keys: >-
        K-indeterminate does NOT fire. Every value-changing choice J9 reports
        is one of three kinds. Some are declared by v2: MI-1 (k rounding), CR-3
        (ECC2K-358 cofactor) and the Q3 lower-edge correspondence (spec lines
        423-428). The KR-C mixed reading is inadmissible by J9's own account
        and excluded by v2's definitions.A (the DEC-20260924-124667 R-J5
        precedent). The rest stay within tolerance (Q0-2 P form, Q0-8 F4
        variable count). K-fixture does NOT fire. One K-approve limb is NOT
        FULLY MET: MI-1's consequence is disclosed at 571 only (as D-7
        required), not at 283 (a pass-rule target: 6.12 bits lower, m 9 to 10)
        or at 359 (3.44 bits lower, m 10 to 11), and without its direction. J3
        independently found the 283 part (N-J3-1). This is added to the
        revision list as RD-8; it does not relax any key.
    - id: R-GATE
      subject: CA-4, R-PREREVIEW-GATE composer_check (worksheet gate_composer_check)
      ruling: >-
        The gate FOLLOWED R-PREREVIEW-GATE in substance. whitelist-grep-v2.yaml,
        blind-inputs-amendment-01.yaml and the TASK-20260925-792b02 receipt are
        present and bound. All thirteen hits are classified, and the composer
        checked each classification: eleven are the six-hex token of
        EXP-SEMBIN-992e73 read as e-notation, inside identifiers and paths; two
        are expository m-numerals at newline-counted Semaev lines 561 and 762,
        outside RD-SEM and not Q quantities. None is misclassified. The Q3 m-set
        (2..30) and omega-set ({3}) are pinned from v2 lines 402-403. The
        degree-extension statement is present: v2 freezes no D*(m), and R-B and
        R-M are transcribed value-free. PROCEDURE FINDING PF-2: the amendment
        disposed of hits as "classified non-value match, action none", which is
        not one of the plan's three dispositions (redaction, exclusion,
        disclosed leak).
      k_leak: >-
        Limb 1 does not fire: J9 reports no leak and no exposure, and its
        RD-CERT navigation departures displayed no protected content, so its
        Certicom Q1 values are admitted as attested-blind (plan PD-R5). On limb 2
        ("a retained hit"), the retained matches are not values that v2 freezes,
        which is the plan's object for the grep. Applied conservatively anyway,
        K-leak's effect sets aside only J9 values that could derive from a hit
        line. No compared J9 value does (J9's Q2 argmins are 12, 15, 9, 10, 10
        and 11, and Q3 is a record). K-leak therefore changes no key outcome.
        The disposition form is disclosed here and is never repaired by
        re-running a review.
    - id: R-JOINTS
      subject: per-joint composition (worksheet joint_table)
      ruling: >-
        J1 BREAKS: Stage 0's Certicom coverage check is keyed to the derived
        certicom_rows list, not the primary input, and detects 0 of 15
        single-row omissions (D-1 residue). J2 BREAKS: BA-J2-1 has time figures
        without Macaulay memory at c8_scan (2), (3) and (6) and four v2 places;
        BA-J2-2 has MI-1's 11.2-bit move without memory; BA-J2-3 has version_2
        block record-form contradictions. J3 HOLDS: the fixture passes as
        frozen, and D-7 and D-10 are discharged. J4 BREAKS: BA-J4-1, H1-L
        relabelled in a note while H1's formal statement and falsifier still
        use S_M as an edge; BA-J4-2, a one-way M7 direction claim that a
        consistent binomial reading escapes for crossings at D >= 19. J5 HOLDS.
        J6 BREAKS: BA-J6-1, K4 revisit sub-condition (i) holds with certainty.
        J7 HOLDS. J8 HOLDS, with no breaking UNOWNED item. J9 AGREES (R-J9).
        Every joint is owned and attested; none is unowned, shared or
        unattested. Each break is a protocol, disclosure, record-form or
        model-interface defect in design documents. None is a mathematical
        result about the cost model's value, the true solving degree, any
        curve, or any cell (CA-11).
      composer_acceptance: >-
        Each break is the plan's own enumerated breaking artifact for its joint.
        The composer checked the quoted texts of BA-J4-1 (H-NISTBIN-dec5e1 lines
        613-619, 626-632, 667-673), BA-J4-2 (H line 959; spec lines 1103-1104)
        and BA-J6-1 (spec lines 1098-1104) at source, and they read as quoted.
        J9's independent Q3 record corroborates BA-J6-1's premise: at m = 2
        the margin is positive at D = 2 in all twelve combinations.
    - id: R-S10
      subject: the reading of D-8 S-10 on which BA-J6-1 turns (red team scope_of_the_verdict)
      ruling: >-
        A revisit condition under S-10 (CLAUDE.md rule 9) must be a condition
        that can fail to hold. DEC-20260924-124667 D-8 applied the same
        standard to RT-4 (RT4-CERTAIN): a trigger that fires with certainty
        carries no information. A condition certain to hold when the
        deprioritisation is made gives K4 the same content as K3, so the
        pre-registered mapping carries an empty branch. BA-J6-1 therefore
        stands as a break. This reading tightens the standard and relaxes
        nothing. The defect errs toward reopening, never closure. The key
        outcome does not depend on this ruling, because K-revise-defect applies
        on J1, J2 and J4 alone.
    - id: R-KEYS
      subject: composition keys applied as written (CA-2)
      ruling: >-
        K-approve NOT met. K-revise-defect APPLIED (J1, J2, J4, J6). The
        following do NOT fire: K-fixture (fixture passes; J9 Q2 agrees);
        K-indeterminate (R-J9); K-duplicate (no D_solve surface on
        GOAL-SEMBIN-fcb7a2 per red team J7 C4; TA-3 not fired); K-impediment
        (all three cards served at max); K-infra (every joint ran to a verdict;
        J9's inconclusive is by design; J9's superseded S09 and S21 are
        infrastructure, not results). K-leak changes no outcome (R-GATE). No
        tripwire (TA-1 to TA-5) fired per all three reports and the composer's
        reading. No key is relaxed, and no protocol_amendment is needed.
    - id: R-PRIOR
      subject: CA-6, the recorded prior against the outcome (plan PD-R1, informed prior; worksheet prior_versus_outcome)
      ruling: >-
        Prior: approve about 0.3, most likely revise on J4, then J6, then J2.
        Outcome: revise on J1, J2, J4 and J6. The modal prediction held, and
        all three joints ranked likeliest to break did break, J6 at the
        predicted item S-10. The prior underrated J1 (p ~0.6 holds) but named
        its exact mechanism (a Stage-0 check keyed to a derived list). J3, J5,
        J7 and J8 held as predicted. On J9, Q1 and Q2 agree. The prior's Q3
        risk (a degree extension undetermined by the text) was avoided because
        v2 froze no D*(m) and wrote R-B and R-M out, so overturn condition (2)
        is vacuous. No overturn condition was met. Because the prior is
        informed, the independent confirmation of the numbers is J9's blind
        agreement.
    - id: R-HOLDS
      subject: CA-9, holds and triggers at this selection point (R-ONE-BATCH; DEC-20260925-89573b NA-8)
      ruling: >-
        HOLD-F and HOLD-G: the row-set condition of DEC-20260924-124667 R-NA7 is
        CARRIED UNCHANGED. When designed, their row set is reconciled against
        the frozen primary inputs (Certicom Appendix A, FIPS 186-4, RFC 2409),
        not against EXP-SEMBIN-992e73. Version 2 is not approved, so its revised
        row set changes nothing official. HOLD-A to HOLD-E: no lane-A finding of
        this round bears on them, and the order is unchanged. X-CERTBIN: NOT
        EVALUATED, because the CERTBIN contracts are outside this card's read
        scope. On lane A's side the rule is already met, since v2 reads every
        Certicom parameter from the primary input only (J1). The cross-lane
        check is routed to NA-1. X-KOBLITZ and every lane-B hold: not carried.

