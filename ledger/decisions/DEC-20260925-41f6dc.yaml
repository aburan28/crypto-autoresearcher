      and G4 rule; D-8 except S-10; everything J7 found regression-free; C1-C8;
      all seven proves-too-much controls; and J9's agreement on Q1 and Q2.
    - >-
      Target profile. Nothing here moves an exponent. The contract is a
      zero-solver derivation whose value is to make a conditional cost's
      dependence on the solving degree explicit and honest about model
      uncertainty. The defects are the honesty items that
      docs/target-result-profile.md asks for (memory beside time, conditional
      direction claims, disclosed reading consequences), so the revision is
      cheap and specified.

