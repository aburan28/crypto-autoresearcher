      suffix is "the bit length of its group order"; the suffixes equal the
      bit length of the base-point order r (J9 r_bits 79, 89, 358, 353), not
      of h r.
    - >-
      What holds, carried unchanged unless a defect above forces it: the D-1
      row set (fifteen curves, nine degrees, m and h, CR-1 to CR-3); the rho
      column and the four added rows; the UNRESOLVED rule; D-2's pin and
