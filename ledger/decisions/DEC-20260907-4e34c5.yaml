  transferable_finding_for_other_lanes:
    id: TF-1
    what: >-
      THE STATED SELECTION-WEIGHT FORMULA IS THE FORMULA PRODUCTION COMPUTES.
      weight_d = S_d + 4*W*h_d, with S_d the summed lengths of the
      pool-construction walks terminating at d, h_d their count, and
      W = sqrt(a*N/T), reproduces the v1 production `Pool.weights` computation
      exactly.
    established_by: >-
      The gate session of TASK-20260907-f65c6e -- a fresh Coordinator session
      that authored none of the artifacts involved. It re-generated the pool
      from the commit-pinned instrument at each committed seed, applied the
      formula, selected the top-T by (weight descending, tie-break key
      ascending), and recomputed the Sel_static DP set, share_top(T_sel),
      cov_static and the margin against each run's own committed basin arrays.
    scope: >-
      All 20 committed v1 cells: 5 seeds x 4 a-values (a in {1/16, 1/8, 3/16,
      1/4}), N = 2^24, r = 2, T_sel = T/2, the generic keyed-random-function
      instrument. The Sel_static DP SET reproduces identically at all 20 cells;
      all three quantities reproduce with a WORST ABSOLUTE DEVIATION of
      0.000e+00 over all 20 cells.
    artifacts_it_rests_on:
      - experiments/EXP-ECDLP-6ac801/source/run_stageb.py (the v1 Stage B production script; line 92 inlines `np.asarray(snap.S) + 4.0 * P.W * np.asarray(snap.h)`; selection at 93-97, coverage at 98, margin at 100)
      - experiments/EXP-ECDLP-612fb1/source_v2/instrument.py (`Pool.weights(W)` lines 445-446; `generate_pools` 243-289 accumulating S and h; `walk_to_dp` 126-151; `Params.__post_init__` line 75 fixing W = sqrt(a*N/T))
      - experiments/EXP-ECDLP-6ac801/runs/RUN-ECDLP-6ac801-001..005/raw-result.json (the committed basin arrays the recomputation was checked against)
      - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/tasks/TASK-20260907-f65c6e/approval_review.yaml (`check_1_formula_versus_implementation`, the worked line-by-line check and the end-to-end reproduction)
    why_it_transfers_to_BATCH_8f3e86: >-
      It is a verification of a DEFINITION against an IMPLEMENTATION, not of a
      contract text. BATCH-8f3e86's approved narrow amendment states the same
      formula -- experiments/EXP-ECDLP-6ac801/amendments/v1_to_v2.yaml states
      `weight_d = S_d + 4*W*h_d` at lines 63, 97, 136, 141 and 258, and
      experiments/EXP-ECDLP-6ac801/specification.v2.yaml at line 324, verified
      by reading those records in this archive -- and its grid (N = 2^24, seeds
      1..5, the same four a-values) is exactly the grid the 20 cells cover. So
      that lane may cite TF-1 for the proposition that the formula it states is
      the one v1 production computed, at that grid.
    how_to_cite_it: >-
      Cite DEC-20260907-4e34c5 `transferable_finding_for_other_lanes` (TF-1)
      together with
      coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/tasks/TASK-20260907-f65c6e/approval_review.yaml
      `check_1_formula_versus_implementation.end_to_end_reproduction`, and
      attribute it to the TASK-20260907-f65c6e gate session, not to this
      archive.
    what_it_is_NOT:
      - >-
        NOT a measurement produced by this archive task. TASK-20260907-ceb8cf
        ran the 20-cell reproduction NOWHERE; it committed a verdict another
        session formed and cites it as that session's work.
      - >-
        NOT evidence about the ECDLP, about H-ECDLP-37dc01, or about G3
        feasibility at any a. It is a definition-versus-implementation identity
        check. No hypothesis status moves on it and no evidence record is
        created by it.
      - >-
        NOT a validation of the formula's statistical merit as a basin-size
        estimator, and NOT a statement about any cell's verdict. It says the two
        implementations compute the same function; it says nothing about what
        that function returns.
      - >-
        NOT scoped beyond the 20 cells. In particular it says nothing about
        N = 2^20, where D1 shows the sidecar contract and the pinned instrument
        already disagree on T, and nothing about any seed outside 1..5.
      - >-
        NOT a review, an attestation, or a quorum member. No validator, red team
        or reviewer ran; no attestation was obtained by the gate or by this
        archive.

