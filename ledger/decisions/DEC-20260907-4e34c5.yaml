        A DIRECT CONTRADICTION between two records this batch's Stage A'
        re-deriver is instructed to obey. The sidecar contract's
        `blind_rederivation.not_blind_from` (lines 248-252) says
        specification.v2.yaml and amendments/v1_to_v2.yaml are NOT blind_from and
