  formula_check:
    question: >-
      Is v2's stated rule -- weight_d = S_d + 4*W*h_d -- actually the rule the
      v1 production implementation computed, including symbol meanings, units,
      indexing, normalisation, truncation and tie-breaking?
    checked_against_instrument_py: >-
      YES, BY READING BOTH. experiments/EXP-ECDLP-612fb1/source_v2/instrument.py
      `Pool.weights(W)` (lines 445-446) returns
      np.asarray(S, float64) + 4.0 * W * np.asarray(h, float64), and
      experiments/EXP-ECDLP-6ac801/source/run_stageb.py line 92 -- the actual
      v1 Stage B production script -- inlines the identical closed form
      `np.asarray(snap.S) + 4.0 * P.W * np.asarray(snap.h)`. S_d and h_d are
      accumulated in `generate_pools` (243-289) exactly as v2 states: S[j] +=
      L for every pool-construction walk terminating at d, with L the step
      count from the restart to the DP from `walk_to_dp` (126-151), and
      h[j] += 1 counting those walks. W = sqrt(a*N/T) at
      Params.__post_init__ line 75, matching v2's `definitions.W`. Selection
      (run_stageb.py 93-97) takes exactly T entries by weight descending with
      ties by ascending key via np.lexsort((keys, -weights)), and coverage
      (line 98, Basins.coverage 177-182) sums the TRUE exact basin sizes of
      exactly those entries and divides by N.
    verdict: 'REPRODUCES THE PRODUCTION COMPUTATION EXACTLY'
    independent_end_to_end_reproduction: >-
      Not accepted on a code read alone. For each of the 20 committed v1 cells
      (5 seeds x 4 a-values) this gate re-generated the pool from the pinned
      instrument at the committed seed, computed weight_d = S_d + 4*W*h_d,
      selected the top-T by (weight descending, key ascending), and recomputed
      share_top(T_sel), cov_static and the margin against each run's own
      committed raw-result.json basin arrays. The Sel_static DP SET is
      reproduced identically at all 20 cells and all three quantities are
      reproduced with a worst absolute deviation of 0.000e+00 over all 20
      cells. Zero experiment runs; no run record written; no committed
      artifact modified.
    derivable_by_a_reader_who_never_opens_instrument_py: >-
      NO -- NOT YET, and this is why the verdict is revise. The WEIGHT is now
      recoverable from the contract text alone, which is exactly the repair
      RANK 1 asked for and it works. Four other conventions the same quantity
      depends on are not recoverable: T at N = 2^20 (v2 states a value the
      pinned instrument cannot produce), the cap = ceil(8*W) that defines
      which points belong to a basin at all (absent from v2, and contradicted
      by v2 asserting sum_d b(d) = N), the identity of the tie-break "pool
      key", and the BCa bootstrap variant on whose interval endpoints the
      FEASIBLE and INFEASIBLE verdicts turn.

  blocking_defects:
    - id: D1
      field: 'experiments/EXP-ECDLP-6ac801/specification.v2.yaml definitions.T and definitions.T_sel'
      defect: >-
        v2 states "T = 102 at N = 2^20" and "T_sel ... 51 at N = 2^20". The
        stated rule's arithmetic is right -- round(2^20^(1/3)) = 102 -- and
        the value contradicts both governing sources: EXP-ECDLP-612fb1
        specification.v2.yaml line 223 fixes T as "64 at 2^20, 256 at 2^24,
        1024 at 2^30", and the commit-pinned production instrument freezes
        T_OF_NBITS = {20: 64, 24: 256, 30: 1024} with no code path to 102. At
        2^24 and 2^30 the frozen table and round(N^{1/3}) coincide; 2^20 is
        the one scale where they diverge, and 2^20 is the scale v2 adds.
      why_blocking: >-
        T fixes T_sel = T/2 and W = sqrt(aN/T), hence the DP rate, the cap,
        the basin partition, the pool size r*T, and every quantity read off
        them. A re-deriver working from v2 alone uses T = 102, T_sel = 51 and
        W about 26% lower at every a; a Stage B' reusing the pinned instrument
        uses T = 64, T_sel = 32. Those are two different instruments, so every
        N = 2^20 cell would return a guaranteed, contract-manufactured
        blind-versus-production divergence. It also defeats the amendment's own
        item (e) rationale, since the N = 2^20 arm was added to be comparable
        under the SAME definition against a Stage 0 a-scan that ran at T = 64.
      required_change: >-
        State T as the frozen table the instrument implements -- 64 at 2^20,
        256 at 2^24, 1024 at 2^30 -- citing EXP-ECDLP-612fb1
        specification.v2.yaml as its source, and correct T_sel = T/2 to 32 at
        N = 2^20. If the intent is genuinely to measure at round(N^{1/3}) =
        102, v2 must say that this is a NEW instrument at that scale and
        withdraw the claim that the instrument is unchanged from v1.
        Alternatively drop the N = 2^20 arm, which RANK 1 never asked for.
    - id: D2
      field: 'specification.v2.yaml definitions."exact basin partition"; inputs.pool_construction; definitions.W'
      defect: >-
        v2 defines the partition as exhaustive -- "sum over all d of b(d) = N"
        -- and describes pool construction as walking "until a distinguished
        point is reached". Production does neither. `exact_basins`
        (instrument.py 194-215) keeps only points with dist <= cap where
        cap = ceil(8*W) (CAP_MULT = 8, lines 31 and 77), and reports
        cycle_mass and capped_mass as unassigned. Measured directly on the
        committed v1 basin arrays at N = 2^24, the unassigned fraction
        (N - sum_d b(d))/N runs from 4.67e-4 to 2.09e-3 across the four
        a-cells of RUN-ECDLP-6ac801-001, rising with a. `walk_to_dp` likewise
        stops at the cap and returns terminal = -1, so a capped
        pool-construction walk is charged but credits no S_d and no h_d.
      why_blocking: >-
        This is a second definitional gap of the same class as the v1 defect,
        and worse in one respect: v1 was SILENT about the weight, whereas v2
        asserts an identity that is false of the object both readings must
        compute, with the authority of the repair. A re-deriver taking the
        stated identity as a self-check will implement no cap -- which does
        not terminate on a DP-free cycle -- or will assign the residual mass to
        some basin, and will compute a different b(.), hence a different
        share_top and cov_static, in a direction v2 gives no way to predict.
        The constant 8 appears nowhere in v2, so the cap is not derivable at
        all.
      required_change: >-
        State cap = ceil(8*W) as part of the instrument; state that a point on
        a DP-free cycle and a point whose first DP lies beyond the cap belong
        to NO basin; replace "sum over all d of b(d) = N" with the true
        relation sum_d b(d) = N - cycle_mass - capped_mass; require both
        readings to report cycle_mass and capped_mass per cell; and state that
        a pool-construction walk reaching the cap is charged and credits no
        S_d or h_d.
    - id: D3
      field: 'specification.v2.yaml blind_rederivation.blind_from and blind_history_contamination'
      defect: >-
        `blind_history_contamination` scopes the leak hazard to git commit
        messages, and that is not the only committed leak path on this branch.
        The Stage A' re-deriver TASK-20260907-6a2b2e declares
        `review_plan_path: ledger/handoffs/TASK-20260907-e423d5.yaml` and must
        read that file to learn which joints it owns. That file, and the
        committed BATCH-e9fd22 dispatch_queue.json, each state the
        Coordinator's directional expectation at the decision-changing cell in
        plain text (`review_plan.coordinator_prior`, items 2, 3 and 4).
        Neither path is on `blind_from`, and the declared mitigation speaks
        only of git history commands.
      why_blocking: >-
        The entire purpose of the re-seal is independence at the
        decision-changing cell, and the re-deriver is currently instructed to
        read, before sealing, a file stating which way the Coordinator expects
        that cell to fall. A prior is weaker than a committed verdict, and
        AGENTS.md "Review architecture" REQUIRES the prior be recorded before
        any reviewer runs -- so the answer is not to stop recording it. But
        leaving it on the pre-seal reading path spends the independence this
        batch is buying, and it is undetectable afterwards for exactly the
        reason v2 itself gives for the commit-message leak.
      required_change: >-
        Keep the prior; move it off the pre-seal reading path. Put
        `coordinator_prior` in its own file; add that file,
        ledger/handoffs/TASK-20260907-e423d5.yaml, the batch
        dispatch_queue.json, this decision record, and
        coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/tasks/TASK-20260907-f65c6e/
        to `blind_from` until the seal exists; and give the Stage A' handoff a
        joints-and-deliverables extract carrying no prior, no verdict and no
        margin. Widen `blind_history_contamination` from "commit messages" to
        every committed path the re-deriver is instructed or likely to read
        before sealing, enumerated.

  defect_status_at_archive:
    checked_by: TASK-20260907-ceb8cf
    checked_at: '2026-09-07'
    method: >-
      The gate's three blocking defects were re-read against the sidecar and
      queue text as it stands after commit 465c01cba and after the origin/main
      merge at 475ca4419, by grepping the exact fields each defect names and
      reading them. This is a POINTER-AND-TEXT re-check, not a re-gate: no
      recomputation was performed, no new defect is added to the gate's list,
      and nothing here revises a gate finding.
    D1:
      status: STILL HOLDS
      evidence: >-
        specification.v2.BATCH-e9fd22-proposed.yaml `definitions.T` still reads
        'nominal table size, round(N^{1/3}): T = 256 at N = 2^24, T = 102 at
        N = 2^20.' and `definitions.T_sel` still states 51 at N = 2^20. Commit
        465c01cba did not touch either field. The defect additionally
        PROPAGATED into a record the retarget did edit:
        ledger/handoffs/TASK-20260907-e423d5.yaml
        `review_plan.blind_rederivation.parameters` still states
        'N in {2^20, 2^24} (T = 102 and 256 respectively)', so the Stage A'
        re-deriver would be handed T = 102 twice.
    D2:
      status: STILL HOLDS
      evidence: >-
        specification.v2.BATCH-e9fd22-proposed.yaml
        `definitions."exact basin partition"` still asserts 'sum over all d of
        b(d) = N'. The words cap, CAP_MULT, cycle_mass and capped_mass appear
        NOWHERE in the sidecar, so the responsible cap = ceil(8*W) is still
        unstated and still not derivable from the contract text. Commit
        465c01cba touched neither field.
    D3:
      status: STILL HOLDS, and the omission is now sharper than when the gate found it
      evidence: >-
        The retarget stripped prior per-cell VERDICTS from the required-reading
        contract, which is a real and correct improvement, but D3 is about the
        Coordinator's directional PRIOR, which is untouched.
        ledger/handoffs/TASK-20260907-e423d5.yaml still carries
        `review_plan.coordinator_prior` items (1) through (7) in plain text,
        including the directional prior at the decision-changing cell at item
        (2) and the endpoint expectations at item (3);
        coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/dispatch_queue.json
        carries the same text (five occurrences of `coordinator_prior`); and
        coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/tasks/TASK-20260907-6a2b2e/task_card.yaml
        line 22 still declares `review_plan_path:
        ledger/handoffs/TASK-20260907-e423d5.yaml`, so the re-deriver is still
        instructed to read it before sealing. Neither of the two paths D3 names
        is on either blind list: the sidecar's own
        `blind_rederivation.blind_from` lists the task DIRECTORY
        coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/tasks/TASK-20260907-e423d5/
        but not the ledger handoff file, and not the dispatch queue.
      why_sharper: >-
        Commit 465c01cba DID edit `review_plan.blind_rederivation.blind_from` in
        that same handoff -- it added the two live canonical paths to it -- while
        adding neither the handoff itself nor the batch dispatch queue. The gap
        D3 names now sits in a list that was opened and revised after the gate
        named it, which removes any reading of it as an oversight nobody had
        looked at.
    non_blocking_defects_D4_to_D7:
      status: >-
        NOT RE-CHECKED INDIVIDUALLY, and none is claimed fixed. Commit
        465c01cba's diff touches none of the fields D4 (tie-break key), D5 (BCa
        variant), D6 (a = 1/16 independence weight) or D7 (NULL-RANDSEL shape)
        name, so there is no reason to believe any was addressed; they are
        archived exactly as the gate wrote them. This archive states that as an
        absence of evidence of change, not as a verification.

  non_blocking_defects_folded_into_the_same_revision:
    - id: D4
      field: 'specification.v2.yaml definitions."STATIC(T)_r exact coverage (v2, CORRECTED, item a)" item (4)'
      defect: >-
        "ties broken by ASCENDING pool key" does not say what the key is.
        Production uses a per-entry pseudorandom 63-bit integer from an
        independent stream (Params.seed_tiebreak = 400 + seed) in
        pool-insertion order -- not the DP value and not the pool index. A
        re-deriver would most naturally use the DP value.
      materiality_measured: >-
        The convention is load-bearing in the committed data rather than a
        corner case: a tie AT the T-th largest weight occurs in all 20
        committed cells and is SPLIT by the tie-break in 16 of them. Its effect
        on the load-bearing quantity is nevertheless small -- re-selecting
        under ascending DP value instead of the production key changed that
        quantity by at most 3.7e-4 absolute across the four cells of the one
        seed measured, below its own committed per-seed dispersion. Hence
        non-blocking on magnitude, and named because it is free to fix and is
        precisely the class of convention this amendment exists to eliminate.
      required_change: >-
        Either name the production convention exactly and declare that the two
        readings' key streams necessarily differ, so tie-broken selections may
        differ, with the induced difference declared within-noise and reported;
        or specify a reading-independent rule (ascending DP value) and restate
        control (f)'s 1e-9 reproduction tolerance, because the committed v1
        cells were produced under the pseudorandom key.
    - id: D5
      field: 'specification.v2.yaml definitions."G3-feasibility predicate (v2, stated as a formula)"'
      defect: >-
        The predicate turns on the SIGN of a bootstrap interval endpoint
        (FEASIBLE requires L > 0, INFEASIBLE requires U < 0), but "95% BCa
        bootstrap ... 10000 resamples and RNG seed 20260907" does not
        determine an implementation: BCa's bias-correction and jackknife
        acceleration have variants, and two independent implementations cannot
        produce the same resamples from one integer seed. A near-zero cell can
        therefore receive different verdicts from the two readings for reasons
        unrelated to the quantity, presenting as an S4 DISAGREEMENT that is an
        artifact of the interval machinery -- the v1 failure mode relocated
        from the weight to the CI.
      required_change: >-
        Either state the BCa variant precisely enough to reimplement, or
        preferably decouple agreement from the interval: judge
        blind-versus-production agreement on the pass-count and the sign of
        the mean margin, use the interval only to route a cell to UNRESOLVED,
        make a percentile interval primary with BCa reported beside it, and
        state a tolerance below which a verdict difference is reported as
        interval-method sensitivity rather than as S4.
      note: >-
        The authoring Coordinator's own recorded prior (item 5) expects joint
        J2 to raise this and says it regards the objection as likely correct.
        Fixing it in the contract removes the round's dependence on a reviewer
        happening to catch it.
    - id: D6
      field: 'specification.v2.yaml blind_history_contamination.consequence_on_scope and interpretation (new bullet 5)'
      defect: >-
        v2 sets a = 1/16's independence to "WEAKENED" and leaves to joint J5
        whether that is the right word, while itself recording that the
        contamination is undetectable downstream.
      required_change: >-
        Make the rule asymmetric and binding in the contract: AGREEMENT at
        a = 1/16 carries ZERO independence weight from the outset;
        DISAGREEMENT at a = 1/16 retains FULL weight and additionally triggers
        F2 and AGENTS.md rule 12.
      ruling_reasoning: >-
        An agreement produced because the re-deriver was told the answer is,
        by v2's own account, indistinguishable from one produced because the
        answer is right. A weight no observation can revise is not a weight,
        so any nonzero independence credit at that cell is unfalsifiable. The
        converse does not hold and is preserved: a disagreement reached
        despite two commit messages stating the opposite verdict is strong
        evidence. The rule costs the batch nothing, because a = 1/16 already
        has two jobs in v2 that need no independence -- control (f)'s
        reproduction target and DECAY-A's low-a endpoint -- and it removes a
        judgement call from a post-hoc reviewer, leaving J5 a stated rule to
        attack instead of an adjective to arbitrate.
    - id: D7
      field: 'specification.v2.yaml controls (g) NULL-RANDSEL'
      defect: >-
        v2 claims NULL-RANDSEL is the real measurement's shape "in every
        respect ... with exactly one substitution". It is two. The real
        treatment arm, share_top(T_sel), ranges over the ENTIRE basin
        partition (order 10^5 basins at these parameters); the null's arm
        ranges only over the r*T = 512-entry pool. The null therefore changes
        the selection rule AND the universe, and its guaranteed negativity is
        bought largely by the universe change and the T_sel/|P| = 1/4 size
        ratio rather than by the weight carrying information. Recomputed on
        the committed cells, its quantity sits one to two orders of magnitude
        beyond its own declared firing threshold at every cell, so it has
        almost no discriminating power against the claim actually under test.
      required_change: >-
        Keep NULL-RANDSEL as a check on the weight estimator and ADD a null of
        the real measurement's shape: replace the ORACLE side --
        top-T_sel-by-size over the whole partition -- with a random
        T_sel-subset drawn over the SAME universe (uniform over basins, and a
        size-biased variant), holding cov_static fixed, with its own stated
        firing signature. This is the properly-shaped null "controls before
        belief" asks for, and it is the joint the red team is already assigned
        to break (J3).

  control_falsifiability_findings:
    method: >-
      Each declared control's firing signature was read against what the
      committed v1 artifacts permit, recomputing the control's own quantity
      from the basin arrays and re-generated pools rather than trusting the
      contract's description, and asking of each the inventor-protocol
      question: does a state of the world exist in which this control fires on
      a correct implementation?
    decay_tsel_repair: >-
      CONFIRMED GENUINE, and verified against the code rather than accepted on
      the authoring session's word. run_stageb.py line 96 selects T entries
      and never T_sel, so cov_static is T_sel-independent by construction, and
      Basins.top_share is a prefix sum of a descending sorted array, strictly
      decreasing in the prefix length because every DP's basin size is
      positive. The removed monotonicity clause was therefore an arithmetic
      identity that held on every correct implementation, and the two
      replacement clauses are implied by no identity in the code.
    null_randsel: >-
      FALSIFIABLE but LOW POWER. Nothing in code or arithmetic forces its
      quantity negative -- it fires if cov_static is computed over the wrong
      universe, if the "random" subset is size- or weight-biased, if the
      coverage read-off double-counts, or if the weight ceases to track basin
      size -- so it is a control that can fail. But on the committed cells it
      sits one to two orders of magnitude beyond its threshold, for the
      shape-mismatch reason in D7, so it will not fire on anything short of a
      gross defect.
    decay_a: >-
      FALSIFIABLE, and the strongest control in the batch. Each a is a
      different instrument (different W, DP rate, cap and basin partition), so
      no identity relates the four means and a single non-monotone step fires
      clause (i). Clause (iii), mbar(1/4) < 0 with its CI excluding 0, is the
      only clause anchored OUTSIDE this batch -- on EV-ECDLP-60e266's
      independently established a = 1/4 infeasibility -- so a self-consistent
      but wrong implementation does not pass it automatically. v2's own claim
      that DECAY-A carries the load is correct.
    decay_tsel: >-
      FALSIFIABLE but WEAK, as v2 itself discloses. Clause (i) fires if a
      T/8-entry table already matches STATIC(T)'s coverage, which is an
      empirical fact about the basin-size distribution and not forced, but it
      is comfortably satisfied on every committed cell. Clause (ii) can take
      only three values on the read grid given clause (i), and only two on the
      committed cells, so it is effectively a two-level ordering check on the
      same directional claim DECAY-A already makes.
    reproduction_control_f: >-
      FALSIFIABLE and independently confirmed SATISFIABLE: this gate
      reproduced all three quantities at all 20 committed cells to 0.000e+00
      from the pinned instrument, so the target is real and the 1e-9 tolerance
      is achievable. Note the interaction with D4 -- changing the stated
      tie-break convention requires restating that tolerance.
    null_shuf: >-
      Correctly scoped as a DIAGNOSTIC and excluded from every verdict. v2's
      statement that it fires in the wrong direction to serve as a G3 null is
      right, and disclosing that rather than dropping it is correct handling.
    summary: >-
      No declared control is a control that cannot fail; each has a state of
      the world in which it fires on a correct implementation. What the check
      does show is a power gradient the contract only partly discloses:
      DECAY-A clause (iii) is the sole externally anchored clause and carries
      essentially the whole artifact-detection load, while NULL-RANDSEL --
      nominally the null object -- is shape-mismatched and far from its own
      threshold. That is a reason to strengthen the null (D7), not to refuse
      the amendment.

