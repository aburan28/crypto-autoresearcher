  decision_scope: >-
    H-PSEUDO-83817b is specified. Empirical support from two independent measurement
    batches (BATCH-073: k=1..300 partial; BATCH-074: k=1..N full range). Consistent
    C ≈ 2.7-3.5. No growth with p at tested scale.

    The evidence picture for GOAL-ECDLP-001 is now:
    1. Algebraic FB: Bezout no-go (proved) → O(1) factor-base too small
    2. Arithmetic FB: H-PSEUDO empirically true with C≈3 → yield ≤ heuristic
    3. Together: Semaev index calculus has complexity exp(c*sqrt(log N*log log N))
       BOTH FROM ABOVE (by the Bezout/yield analysis) AND FROM BELOW (the same
       complexity is achievable by standard Semaev). The complexity is tight.
    4. All other attack families: closed by theorem (NCP, TTN, TRA, GGM, BGS, etc.)

    This is the most complete picture of prime-field ECDLP attack complexity
    achievable without a new structural ingredient.

    GOAL-ECDLP-001 stays active.

