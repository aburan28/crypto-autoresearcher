  review_composition:
    composed_by: coordinator, TASK-20260822-0e9c74
    independence_tool_note: >-
      `python3 tools/check_review_independence.py --batch <dir>` was NOT RUN.
      This role holds no command-execution tool. The independence facts below are
      composed from the two reports' own attestations, which are checkable by any
      session that holds a shell, and running the tool is named as an open item on
      this batch's ledger archive receipt.
    joints:
    - joint: certified lower bound from exhibited points, never an analytic rank or r_high
      owner: TASK-20260822-0de988
      verdict: holds
    - joint: the reported k = 3 optimum is the true maximum over the enumerated space
      owner: TASK-20260822-0de988
      verdict: inconclusive (enumeration completeness holds, scoring and indexing hold, MAXIMALITY inconclusive)
    - joint: the base rank needed for 31 at k = 3 is MEASURED, not assumed (separability)
      owner: TASK-20260822-de2fa2
      verdict: breaks
    - joint: any degree-8 result is reported as WEAKER IN KIND than the held degree-32 exact certificate
      owner: TASK-20260822-de2fa2
      verdict: holds, but the guardrail is UNMAINTAINED -- the certificate-kind axis is absent from every table
    coordinator_prior_recorded_before_the_round: >-
      "The Coordinator expects P1 and P2 to HOLD and P3 to HOLD." THE PRIOR WAS
      PARTLY OVERTURNED AND THAT IS THE ROUND'S MOST VALUABLE OUTPUT. P1 held. P2
      was not testable by the batch as designed, which the prior did not
      anticipate. P3's supporting quantity -- the measured ceiling -- was found not
      to exist, which contradicts the prior's premise rather than agreeing with it.
      The red team notes explicitly that its verdict contradicts the prior's
      premise rather than concurring, and it reached that from recomputation.
    blindness: >-
      Mutual, lifted_for empty, respected in substance by both. One disclosed
      slip: the validator ran `ls` on the red team's task directory near the end of
      its work and thereby learned a 70,288-byte deliverable existed. It did not
      open it and disclosed the listing. Recorded, not waived.
    coverage_not_correlation: >-
      Each joint had exactly one owner and each reviewer returned NO VERDICT on
      the other's joints while still reporting overlapping recomputations as
      measurements. That is the design working: the two reports agree on numbers
      derived by independent code and do not agree on judgements they did not both
      make.
    rule_12_status: >-
      UNMET AND UNWAIVED. Producers, snapshot archive, both reviewers and this
      decision all resolve to claude-opus-5. Independence here is independence of
      CODE, which is real and is what carries the recomputations, and not
      independence of MODEL, which is absent. No conclusion in this decision rests
      on two records agreeing.
    procedure_deviations:
    - >-
      review_plan.claim_under_review item (b) names a measurement -- the k = 3 and
      k = 4 twist-family optima ON THE AUGMENTED POOL -- that no task in the batch
      was commissioned to produce. The plan put under review something the queue
      never asked for. Recorded as a Coordinator planning defect, not a producer
      failure.
    - >-
      The blind re-derivation was scoped so that its maximality half was
      undischargeable: the only artifact carrying the per-twist counts is on the
      blind_from list. To make maximality blind-derivable the per-twist profile
      table must be committed as an artifact separate from the scan implementation
      and its output. Recorded as a review-design defect.
    - >-
      coordination/goals/GOAL-ECRANK-002/batches/BATCH-e0caa5/batch.yaml does not
      exist; the dispatch queue and the committed handoffs were read in its place.
      Established by an earlier worker in this batch and repeated here only so the
      absence is not rediscovered as new.

  limitations:
  - >-
    Everything decided here is scoped to the committed bytes of BATCH-e0caa5 at
    2938068a3: the 1206-curve Mestre pool (1169 distinct minimal models), the
    502-row / 501-distinct-curve small-coefficient scan, the five committed
    certificates on four distinct base curves, the support [-1,2,3,5,7,11,13],
    PARI 2.15.4 via cypari for the one producer that had it, and the recorded
    budgets. Toy scale by the experiment's own declaration.
  - >-
    NO RANK OVER Q IS ASSERTED BY THIS DECISION, anywhere, including in N1. The
    external rank >= 31 record is a POINTER, NOT EVIDENCE; no point list was
    fetched or checked by anyone in this program.
  - >-
    Every per-class r_low in this batch is PARI's and was re-derived by nobody;
    within-class independence is not checked by C1-C6; independence for the
    Mestre pool is numerical for the producer and numerical for the validator,
    and no exact independence witness exists for any curve in the pool.
  - >-
    This decision changes no hypothesis status, because ledger/hypotheses/ is
    outside this task's write_scope. See status_effects.hypothesis_status_note
    and next_action N3.
  - >-
    knowledge/ is outside this task's write_scope, so no KN-* entry was created
    and none is claimed. See knowledge_promotion.
  - >-
    This role holds no shell: no digest, timestamp, git fact or tool result in
    this record was computed by it. Every such value is attributed to the session
    or record that produced it, or left null and named on the receipt.

  next_actions:

  - id: N1
    priority: 1 -- ahead of every other queued expense on this goal
    action: >-
      RUN THE CHEAPEST CONTROL THAT CAN SETTLE C1. Fetch the exhibited points of
      the externally reported rank >= 31 curve over Q and run this program's own
      committed verifiers on them as a k = 0 configuration (V trivial, degree 1):
      experiments/EXP-ECRANK-e1e30e/source/verify_certificate.py for the exact
      on-curve and non-torsion checks and regulator_check.py for a non-singular
      regulator, exactly as C1 specifies. Then record, in a Coordinator decision,
      whether C1 CLOSES on an external witness at degree 1 or must be RESTATED as
      "rank >= 31 at degree <= 8 BY THIS CONSTRUCTION".
    why_first: >-
      C1 reads "degree <= 8" and degree 1 qualifies; the campaign has already
      accepted the external-witness pattern (its degree-2 ladder row is "external
      30, exact +1"); and the verification costs minutes once the points are in
      hand. Every other expense on this goal -- wider Mestre scans, extended
      support, a PARI-equipped re-run -- is ranked against a target this decision
      may have already moved.
    caveat_carried_verbatim_and_not_softened: >-
      "This review did NOT verify the 31 points and asserts no rank." The external
      record is a POINTER, NOT EVIDENCE, until this program's own verifier accepts
      the bytes. The leaderboard page also mentions BSD+GRH in connection with
      rank 31, which plausibly concerns the UPPER bound; a lower bound from
      exhibited independent points should be unconditional, and checking that is
      part of this action. If the points cannot be obtained or do not verify, the
      outcome is recorded as such and is NOT a statement about anyone's rank.
    dispatch_note: >-
      This task needs NETWORK OR RETRIEVAL PERMISSION to fetch the point list --
      the batch that produced this decision was forbidden it. Granting that is a
      dispatch decision and must be recorded on the handoff, with the fetched
      bytes archived under a content hash so the verification is replayable.
    owner: coordinator to dispatch; executor to run

  - id: N2
    priority: 2
    action: >-
      Rank the red team's reversal candidate as an ordinary proposal: a
      construction that FORCES POINTS ACROSS SEVERAL TWIST CLASSES AT ONCE.
      Mestre's construction forces s(a_i) to be a square; the same machinery can
      force s(a_i) = d * square for a chosen d, putting prescribed points on E^(d)
      rather than on E, so a construction prescribing points across four or five
      classes of one k = 3 coset attacks the 8-class total directly instead of
      paying for it through one class. File it as an IDEA-* under RQ-ECRANK-27dcc5
      with a minted identifier and let it enter the ranking on its merits.
    why: >-
      It follows from the obstruction read forward rather than backward: since
      separability FAILED, the other seven classes are not a fixed tax but
      engineerable headroom (11 units of variation at fixed maximum). It is also
      the only route in view NOT blocked by the descent-infeasibility obstacle,
      because it produces the twist points BY CONSTRUCTION rather than by descent.
    status: >-
      A CANDIDATE FOR RANKING, NOT EVIDENCE. It changes no status by existing and
      no identifier was minted for it here (TASK-20260822-0e9c74 was allocated
      exactly two and instructed to mint no others).
    owner: idea-generator, on a coordinator handoff

  - id: N3
    priority: 3
