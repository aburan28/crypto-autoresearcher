      values only through their multiset and their constant pairwise
      co-occurrence; its R^2 must therefore be read against a label-shuffle null,
      and an R^2 that survives label permutation is a statement about a histogram."
      It carries its own measurement (200 shuffles, seed 20260904: pooled observed
      R^2 0.6682 vs null median 0.6691; identical in 200/200 on the degenerate
      rows; pair co-occurrence 7/35/35/155) and it generalises to any campaign that
