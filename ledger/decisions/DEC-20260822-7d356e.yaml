coordinator_decision:
  id: DEC-20260822-7d356e

  context: >-
    BATCH-e0caa5 of GOAL-ECRANK-002 ran two producers and two blinded reviewers
    against H-ECRANK-f2a2f7. TASK-20260822-a7a9e8 built a Mestre-style pool of
    1206 curves reaching certified rank 13 over Q from exhibited points.
    TASK-20260822-8df232 reproduced the committed k = 3 fixture of 20 at two of
    three levels and measured the coset structure of the five committed
    certificates, but could attempt no new descent -- PARI is absent from its
    execution environment -- so its extended-support deliverable and the
    fixture's maximality level are OPEN AND UNATTEMPTED. TASK-20260822-0de988
    (validator) returns `incomplete`: every quantity it could recompute
    reproduced exactly or to stated tolerance under code sharing nothing with
    either producer, with five named defects owed superseding records.
    TASK-20260822-de2fa2 (red team) breaks the separability joint and upholds
    the certificate-kind joint. The snapshot archive TASK-20260822-e7c486 binds
    content_first; all seven declared digests were recomputed from committed
    blobs and matched by the validator, by the red team and by the orchestrating
    session. Evidence: EV-ECRANK-6695dc. This decision closes the batch; it does
    not close the goal.

  decision: weaken

  decision_scope: >-
    `weaken`, applied to H-ECRANK-f2a2f7's MECHANISM, on the tested cosets,
    parameters, solver and budget. NOT `reject_scoped` and NOT `support`.
    Not `reject_scoped`: no prediction of the hypothesis was measured and found
    false; the assumption that broke is a modelling assumption the hypothesis
    itself flagged as most likely to be wrong, and a scoped rejection would
    additionally rest on a single unreplicated line of work in a batch where
    model independence is zero. Not `support`: P1 holds, but P2 and P3 -- the
    two predictions that would decide the goal -- are UNTESTED, and the number
    C2 asks for does not exist in committed bytes. Not `pause`: the line is not
    exhausted, the cheapest decisive control has not been run, and refusing to
    keep a live lane open because a budget ran out is the fatigue report
    docs/inventor-protocol.md section 4 names.

  target_ids:
  - H-ECRANK-f2a2f7
  - EV-ECRANK-6695dc
  - GOAL-ECRANK-002
  - RQ-ECRANK-27dcc5
  - EXP-ECRANK-e1e30e

  status_effects:
    hypothesis_status_changed: false
    hypothesis_status_note: >-
      NO HYPOTHESIS STATUS TRANSITION IS MADE BY THIS DECISION, AND THE REASON IS
      RECORDED RATHER THAN LEFT AS AN OMISSION. H-ECRANK-f2a2f7 remains
      `specified`. This task's declared write_scope is the evidence record, this
      decision, the GOAL-ECRANK-002 goal directory and its own receipt;
      ledger/hypotheses/ is NOT in it. A status change that cannot be persisted
      in the same archive that decides it would be an official transition
      resting on an uncommitted record, which AGENTS.md forbids. The change this
      evidence warrants -- H-ECRANK-f2a2f7 to `analyzed`, with assumptions[2]
      annotated as FALSE ON THE TESTED COSETS by EV-ECRANK-6695dc, and
      heuristic_assumptions split as HC-01 asks (empty for the CERTIFICATE
      branch, non-empty for the CEILING branch, since separability is a
      heuristic in everything but name) -- is named in next_actions as a
      successor ledger archive whose write_scope includes ledger/hypotheses/.
    goal_status_changed: false
    goal_status_after: active
    goal_next_action_replaced: true
    completion_criteria:
      C1: >-
        OPEN -- unchanged. No certificate of rank >= 31 at degree <= 8 exists or
        is claimed. See next_actions N1, which may move this.
      C2: >-
        NOT MET -- and this is the load-bearing finding for the goal. C2 asks for
        "the base rank that would be needed for 31 at k = 3, derived from the
        measured coset structure rather than asserted", and adds "A negative
        result closes this goal only if it carries that number." THE BATCH DOES
        NOT CARRY THAT NUMBER. It carries four in-sample extrapolations spanning
        7.86 to 11.72 (base rank) and 10.32 to 23.80 (max single class), of which
        the two coset-derived ones are invariant under randomising their own
        input and the most optimistic is a sample-size artifact. Closing this
        goal on C2 today would be closure on an artifact. C2 remains OPEN.
    evidence_record_written: true
    knowledge_promoted: false
    batch_closed: BATCH-e0caa5

  rationale:

  - >-
    R1. THE RUN SET IS VALID BEFORE ANYTHING IS INTERPRETED, WITH DEFECTS NAMED.
    Declared run counts match present counts (8 and 8); every run of both
    producers has manifest, command, environment, stdout and stderr; raw/summary
    agree everywhere they could be compared, including a rebuild of the untrimmed
    RUN-004 raw output from history that reproduces the headline table exactly;
    seeds are recorded (20260822 in command.txt for a7a9e8; measurement RNG none
    plus selftest seed 20260904 for 8df232) and the deterministic re-execution of
    RUN-8df232-005 matched field for field. The two exceptions and the five
    manifest/provenance defects (D1-D5) are recorded in EV-ECRANK-6695dc, weaken
    re-execution, and touch no measured value. This set is evidence; it is not
    returned to the Executor.

  - >-
    R2. THE SEPARABILITY ASSUMPTION IS FALSE ON THE MEASURED DATA, BY EXHIBITED
    COUNTEREXAMPLE. Equal-maximum / different-total k = 3 sub-cosets exist in
    quantity: within cert_deg32_multiplicity at max 3 the total takes 10, 12, 14,
    16, 18; over the 651 multiplicity-objective rows `others` spans 6 to 17 on a
    mean of 10.41, and its conditional mean rises 9.49 -> 10.70 -> 13.07 as the
    max goes 2 -> 3 -> 4. The refutation artifact is a counterexample, not a
    narrative, and it was recomputed by two independent implementations. This is
    the assumption H-ECRANK-f2a2f7 itself names as "THE ASSUMPTION MOST LIKELY TO
    BE WRONG", and the batch did exactly what it was built to do: it measured it
    rather than assuming it, and it came back false.

  - >-
    R3. THE RELATION THAT CARRIED THE CEILING FIGURES CANNOT FAIL, SO IT MEASURED
    NOTHING ABOUT COSETS. A label-shuffle null (200 trials, seed 20260904) leaves
    the fit where it was -- pooled observed R^2 0.6682 against null median 0.6691;
    IDENTICAL in 200 of 200 trials on the n_classes rows; on the sum_mult rows the
    observed fit is WORSE than the null median. The cause is structural: the k = 3
    sub-coset enumeration is a 2-design (constant pair co-occurrence 7 / 35 / 35 /
    155), and a least-squares fit is a second-moment statistic, so it depends on
    the class values only through quantities the design holds constant. A quantity
    that does not move when the parameter meant to destroy it is varied is an
    artifact tell (docs/inventor-protocol.md section 3). The absence of this
    control from the record is the finding, not merely its result: it costs
    seconds and needs no PARI.

  - >-
    R4. CONSEQUENTLY C2's NUMBER DOES NOT EXIST, AND SAYING SO IS THE RESULT.
    "Required base rank ~8 to ~12" reads as a campaign one step from its target.
    It is not a width of the phenomenon; it is the gap between an uncorrected
    order statistic and a mean. Once the sample-size confound is removed every
    defensible variant of relation 1b lands in 9-12 and the encouraging end of the
    published range is the artifact. Reporting the spread rather than one number
    was the producer's correct choice and it does not rescue the quantity: two of
    the four fits fail their null and no held-out set exists anywhere.

  - >-
    R5. P1 HOLDS AT FULL STRENGTH AND IS NOT DIMINISHED BY R2-R4. Certified rank
    13 over Q from 13 exhibited points, against a measured twist-search ceiling of
    4 -- with all 13,980 pool points exact on their curves, all 11,499 independent
    points non-torsion by Mazur under independent code, the Mestre construction
    re-derived exactly on all 1206 curves, and both rank-13 curves' regulators
    recomputed without PARI to 0.03-0.81 percent. The construction also saturated
    its function-theoretic ceilings exactly (7 on M8, 9 on M10, never 8 and never
    10), which is a clean structural result reported as one. Everything above 9
    came from an extra-point scan over |n| <= 400, d <= 12 that was never widened.

  - >-
    R6. NO CLOSURE IS SUPPORTED IN EITHER DIRECTION, AND THE NEGATIVE ONE IS THE
    TRAP. A positive closure is unavailable: no k = 3 total above 20 exists
    anywhere, and 20's maximality is unverified by anyone (level C BLOCKED; the
    validator's blind re-derivation hit the same wall from the other side --
    >= 20 verified, <= 20 NOT). A negative closure is worse than unavailable:
    "Mestre reached 13 and k = 3 gave 20, so degree 8 is out of reach" would be a
    count of what a 1218-second and a 24-second budget did, dressed as a statement
    about the problem, AND it would convert an absent tool into evidence. THE 13
    AND THE 20 ARE MEASUREMENTS ON DISJOINT OBJECT SETS: no task in this batch was
    commissioned to enter a7a9e8's curves into a twist scan, and none did.

  - >-
    R7. P2 IS UNTESTED BY THIS BATCH IN EITHER DIRECTION -- not screened, not
    negative, not weakly supported. Untested. RUN-a7a9e8-008's 31 of 31 ellrank
    timeouts at a 25 s alarm on the rank >= 12 base curves (a4 ~ 1e19, a6 ~ 1e28,
    scaling to a4 d^2 ~ 1e28 and a6 d^3 ~ 1e41 under the support's twists) are a
    MEASURED OBSTACLE to performing that measurement WITH THIS ENGINE. Under
    AGENTS.md rule 3 that is an infrastructure fact about an instrument at a
    coefficient size and is never evidence against P2 or against the construction.
    Both producers handled this correctly in their own records; the live risk is
    downstream and directional, because reading "P3 holds, the optimum stayed
    below 31" would agree with the recorded Coordinator prior and is therefore the
    easy error to make. This decision does not make it.

  - >-
    R8. THE BLOCKED WORK WAS BLOCKED BY PROVISIONING, NOT BY MATHEMATICS, AND A
    SIBLING TASK IN THE SAME BATCH HAD THE TOOL. a7a9e8 declares cypari 2.5.6 /
    PARI 2.15.4 present; 8df232 declares PARI, cypari, cypari2, gp and Sage all
    absent, and the validator verified the absence a third time in its own
    session. The re-run costs roughly 25 minutes of descent by the committed
    scan's own measured rate (~1.5 s per curve for 128 twists; the producer's
    107 CPU-hour figure is an every-descent-hits-its-alarm ceiling, not an
    expectation) -- but the ENUMERATION half grows by 16.4x at k = 3 and 34x at
    k = 4 on an eighth prime and becomes the binding cost, and NEITHER PRODUCER
    COSTED ITS MEMORY. Any successor dispatch must budget the enumeration and
    must measure peak RSS, not declare it qualitatively. THIS IS A DISPATCH
    FAILURE OF MINE, NOT A PRODUCER FAILURE: two producers in one batch were
    given the same work with different tool surfaces and neither was asked to
    check the surface before accepting the deliverable.

  - >-
    R9. THE PROVES-TOO-MUCH CONTROL EARNED ITS PLACE. Objects 1 and 2 pass (20
    returned on unchanged inputs at four independent points; 0 returned on the
    empty-point-set configuration built to reproduce the GOAL-ECRANK-001
    [1,1,0,[]] failure mode). OBJECT 3 FIRES: an all-2-torsion synthetic
    certificate is correctly REJECTED by C3 and by all_checks_passed, yet
    recomputed_sum_mult returns 8 rather than 0, because the scoring convention
    certified(d) = min(r_low(d), #points) never consults the non-torsion result.
    No committed number is affected. A designed control that finds a real bug on
    an object whose answer is known is the cheapest evidence this program
    produces, and it is recorded as a success of the review design.

  - >-
    R10. A COMMITTED INPUT IS WRONG AND THE DEFECT IS UPSTREAM OF THIS BATCH.
    experiments/EXP-ECRANK-e1e30e/source/scan_pool.py declares rank 3 for
    [1,1,1,-2,0], whose discriminant is exactly 79 (recomputed independently here
    from the a-invariants: b2 = 5, b4 = -3, b6 = 1, b8 = -1), hence prime, hence
    minimal model and conductor 79 -- where the minimal conductor for rank 2 is
    389. It is LMFDB 79.a1, rank 1. base_rank_distribution should read
    {1: 2, 2: 1, 3: 496, 4: 3}. Relation 1 becomes required base rank 11.52 rather
    than 11.72 and relation 1b is unchanged. BOTH PRODUCERS REPRODUCE THEIR
    DECLARED INPUTS TO THE LAST DIGIT and neither is at fault. The repair is a new
    correction record owned by EXP-ECRANK-e1e30e, never an edit.

  - >-
    R11. THE ATTRIBUTION IS SETTLED AND IT CONVICTS THE ORCHESTRATING SESSION.
    a7a9e8's report section 6.1 blames the archiving task TASK-20260822-e7c486 for
    the concurrent writes into its run directory; the committed
    CORRECTION-anomaly-A1-attribution.md blames the orchestrating session. THE
    REPORT IS WRONG AND THE CORRECTION IS RIGHT. Both reviews reached this
    independently and by DIFFERENT evidence -- the red team on capability (that
    role's tool surface holds no command-execution tool, so it can neither gzip
    nor write .git/info/exclude), the validator on timestamps (the writes are
    commit 4df65c1c2 at 2026-08-22T14:36:56Z, inside RUN-004's window, while
    e7c486's lane claim was acquired 2026-09-04T19:24:50Z, thirteen days later).
    The commit subject corroborates. The interference was purely additive and
    touches no rank claim. The same fault hit BOTH producers in one batch
    (8df232's in-flight files were committed at ba9bd1bcd while it ran), which
    makes it a standing process cost I own, not an incident.
    THIS CONVERGENCE IS THE BATCH'S ONLY GENUINE CORROBORATION: model independence
    is ZERO across every task here -- both producers, the snapshot archive, both
    reviewers and this decision all resolve to claude-opus-5 -- so agreement
    between records is otherwise not evidence, and AGENTS.md rule 12 is UNMET AND
    UNWAIVED for this batch.

  - >-
    R12. PREMATURE CLOSURE IS A FAILURE MODE SYMMETRIC WITH OVERCLAIMING, AND
    NEITHER REVIEW CALLS THIS LINE SATURATED. What holds is substantial and is
    recorded at full strength in EV-ECRANK-6695dc rather than compressed into a
    verdict: exact point certification on 13,980 points, a construction that
    re-derives exactly on 1206 curves, complete and correctly sized enumerations,
    C1-C6 passing on all five certificates under independent code with no
    recurrence of the XOR-cancellation bug, a fixture that reproduces at two
    levels, and two producers whose scope discipline the red team records as above
    this program's average. The lane stays open.

  - >-
    R13. THE CHEAPEST DECISIVE ACTION IS NOT ANOTHER MESTRE SEARCH. The goal's own
    C1 reads "rank >= 31 over a number field of degree <= 8" and DEGREE 1
    QUALIFIES. The red team reports external records of a curve over Q of rank
    >= 31 dated 2026-08-23, one day after this batch's task ids, which would make
    the committed statement in EXP-ECRANK-e1e30e/analysis.md that "rank >= 31 over
    Q is open" out of date. CARRIED VERBATIM AND NOT SOFTENED: "This review did
    NOT verify the 31 points and asserts no rank. ... An external record is a
    pointer, not evidence, until this program's own verifier accepts the bytes."
    THIS DECISION ASSERTS NO RANK OVER Q. Running the committed exact verifier on
    those points as a k = 0 (degree 1, V trivial) configuration costs minutes once
    the points are in hand and is the only action in view that can SETTLE the goal
    rather than refine it; every other queued expense is ranked against a target
    it may already have moved. The reduction runs one way only -- a curve of rank
    r over Q has rank >= r over any extension, so a degree-1 witness settles the
    degree- <= 8 question and not conversely -- which is a scope statement
    GOAL-ECRANK-002 must make explicit before it is closed either way.

  evidence_refs:
  - EV-ECRANK-6695dc
  - coordination/goals/GOAL-ECRANK-002/batches/BATCH-e0caa5/tasks/TASK-20260822-0de988/validation_report.yaml
  - coordination/goals/GOAL-ECRANK-002/batches/BATCH-e0caa5/tasks/TASK-20260822-de2fa2/red_team_report.md
