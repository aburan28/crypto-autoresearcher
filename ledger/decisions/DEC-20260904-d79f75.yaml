coordinator_decision:
  id: DEC-20260904-d79f75
  context: >-
    Closes the review-breakthrough round (TASK-20260904-4580e8) escalated
    by DEC-20260904-ffaebb. Composes validator-breakthrough (JB1 breaks,
    JB2 holds) and red-team-breakthrough (JB3 breaks decisively via exact
    computation, JB4 holds as a finding), both `degradable: false`, both
    completed at full rigor, working fully independently (each disclosed
    never opening the other's directory), on different models (Red Team
    ran claude-opus-5, not the claude-sonnet-5 that produced and reviewed
    every prior record in this chain, materially reducing this lane's own
    repeatedly-disclosed model-correlation confound). This Coordinator
    independently re-verified the single most load-bearing specific claim
    (cell 1's forced degeneracy) via elementary number theory before
    adopting either report.
  decision: revise
  decision_label: >-
    pooled_headline_refuted_by_exact_computation_and_independent_procedure_audit_deterministic_completion_of_part_b_identified_pending_independent_rederivation_no_third_cell_two_construction_defects_disclosed
  target_ids:
    - H-MONO-1d50ac
    - H-MONO-45183a
    - EXP-MONO-005b49
    - EXP-MONO-cb905d
    - EXP-MONO-64aaa4
    - RQ-MONO-001
    - EV-MONO-9c760b
    - CORR-20260904-80506e
    - CORR-20260904-30a8ce

  hypothesis_status_before: proposed_pooled_two_cell_signal_pending_review_breakthrough_escalation
  hypothesis_status_after: refuted_at_tested_scale_sampling_artifact_exactly_explained_deterministic_completion_of_h_mono_45183a_part_b_identified
  hypothesis_status_after_note: >-
    H-MONO-1d50ac's own pre-registered, two-sided prediction is answered:
    prediction (A) (agreement) holds EXACTLY at cell 1 (not merely within
    tolerance -- the two curves are forced identical in every invariant
    the rate depends on) and holds to within 0.042%, in the direction
    OPPOSITE the measured signal, at cell 2. Prediction (B) (a material,
    curve-specific deviation beyond (N,tau)) does NOT hold for this m=4
    construction at these two cells: the apparent ~15.6% pooled effect is
    refuted by exact computation as a null-hypothesis artifact (63.3% of
    it is a single, never-re-measured statistical fluctuation from
    EXP-MONO-64aaa4's own original run, carried through three
    re-expressions) and, independently, by a formal audit showing the
    statistical procedure that produced it has a true false-positive rate
    of approximately 10%, not 5%. This is a genuine, load-bearing REFUTATION
    at the tested scale and construction -- not a return to "inconclusive."
    The valuable byproduct is that H-MONO-45183a Part B's own
    (N,tau)-only completeness IS independently confirmed false, via the
    SAME exact computation, but the completion is small ((N, tau,
    #E(F_p)[4]), mean +0.60% bias) and explicitly does NOT implicate the
    endomorphism ring beyond its effect on #E[4] -- see EV-MONO-9c760b.

  experiment_status_before: completed
  experiment_status_after: completed

  official_status_changes:
    goal_status_changed: false
    goal_status_after: paused
    hypothesis_status_changes:
      - hypothesis_id: H-MONO-1d50ac
        from: proposed_pooled_two_cell_signal_pending_review_breakthrough_escalation
        to: refuted_at_tested_scale_sampling_artifact_exactly_explained_deterministic_completion_of_h_mono_45183a_part_b_identified
    experiment_status_changes: []
    resource_disposition_changed: false
    completion_criteria_met: []
    implementation_authorized: false
    experiment_runs_authorized: 0
    scientific_interpretation_authorized: true
    closure_authorized: false
    breakthrough_authorized: false

  claim_tier: mixed_deterministic_for_the_new_closed_form_pending_independent_rederivation_toy_for_all_sampled_measurements
  scope_statement: >-
    Scoped exactly to the m=4 three-point four-sign-class construction at
    the two tested cells (p=617, p=3541). No ECDLP, relation-rate,
    exponent, or cryptographic-scale claim -- the measured/exact quantity
    is ~2^-251 at 256-bit N and the true structural term would need
    ~2^732 tuples to observe. Does not close KN-OPEN-009, which this
    design is structurally barred from addressing (its own text requires
    excluding the j=0/1728 artifacts that constitute this design's entire
    CM arm; it concerns a different observable, Semaev cycle-type
    monodromy, already reported constant by H-MONO-45183a Part A). Does
    not establish anything about m != 4. The (N,tau,#E[4]) completion is
    claimed at DETERMINISTIC tier for the closed form itself (pending
    independent rederivation) but its citation anywhere as an established
    program result must wait for that rederivation.

  rationale:
    - >-
      TWO INDEPENDENT, DISJOINT REFUTATIONS ARE STRONGER THAN EITHER
      ALONE, AND NEITHER DEPENDS ON THE OTHER'S CORRECTNESS: the Red
      Team's exact combinatorial derivation shows cell 1 is mathematically
      forced to zero effect (independently reverified by this Coordinator
      via elementary number theory on 580 = 2^2*5*29's factorization,
      without running any reviewer's code) and traces 63.3% of the pooled
      signal to one reused count. The Validator's formal simulation of the
      actual six-look procedure, using ONLY the archive's own pairs-vs-
      tuples counts (not an assumed worst case), independently shows the
      true false-positive rate is ~10%, driven by omitted overdispersion
      and a post-hoc choice between two named combination rules. Either
      finding alone would be sufficient to reject the pooled headline;
      both holding, via unrelated methods, on different models, is
      decisive.
    - >-
      THE PROVES-TOO-MUCH CONTROLS ON BOTH SIDES PASSED, MEANING NEITHER
      METHOD IS AN INDISCRIMINATE DEBUNKING TEMPLATE: the Red Team's exact
      machinery CONFIRMS the corrected v2 sampler's uniformity, FLAGS the
      v1 sampler's known bias, and REPAIRS (rather than dismisses) Part
      B's closed form -- it refutes only the claim under review. The
      Validator's simulation shows false-positive rate rising monotonically
      as synthetic looks are added and returns ~0.05 for correctly-
      specified unadjusted tests within the same machinery. This is
      exactly the discriminating-method standard this program's review
      architecture requires.
    - >-
      THE POSITIVE RESIDUE IS ACCEPTED AS GENUINE PROGRESS, NOT AS A
      CONSOLATION PRIZE: H-MONO-45183a Part B's own residual_collision_risk
      clause asked exactly the right question ("if two curves with
      identical (N,tau) but different endomorphism rings gave different
      rates, the derivation would be incomplete") and it IS incomplete --
      but the missing variable is #E(F_p)[4], not the endomorphism ring
      per se, and the effect is small (mean +0.60%, bounded at 0.46%
      relative in every archived matched cell) and exactly characterized
      rather than merely detected. This is a materially better outcome
      than either "supported" (which would have been wrong) or "still
      inconclusive" (which would have wasted the exact computation this
      round produced).
    - >-
      THIS FINDING IS NOT YET PROMOTED TO KNOWLEDGE, DESPITE ITS QUALITY,
      BECAUSE THE REVIEWER WHO PRODUCED IT EXPLICITLY FLAGGED IT AS
      UNVERIFIED BY ANYONE ELSE: the exact closed forms are the Red Team's
      own derivation, validated extensively by that same reviewer (brute
      force to <1e-14, 145-point calibration, forward prediction) but not
      yet independently rederived by a different party, per their own
      stated RC-B10 falsification route. This Coordinator's own
      verification covered only the single specific numerical consequence
      at cell 1, not the general closed forms. Treating a reviewer's own
      unverified-by-others derivation as settled program knowledge, even
      when it is extremely well self-validated and even when this
      Coordinator finds no fault in it, would repeat exactly the failure
      mode this whole cycle is about: trusting a single party's careful
      work without the second independent check this program's own
      architecture requires for anything load-bearing.
    - >-
      THE VALIDATOR'S OWN FB4 FINDING (the already-archived 100-cell panel
      corroborates a small real effect while excluding the pooled
      headline's magnitude by ~8x) IS ACCEPTED AS PROVISIONAL, NOT CLEAN,
      pending the partition CORR-20260904-30a8ce requires: 64 of those 100
      cells have a supersingular curve misclassified as CM. The direction
      of the finding (a small, real, ~40x-better-powered corroboration)
      is credible and consistent with the exact-formula explanation, but
      its exact confidence interval should not be cited until re-derived
      on the clean, partitioned subset.
    - >-
      NO THIRD CELL IS COMMISSIONED, PER BOTH REVIEWERS' EXPLICIT,
      INDEPENDENTLY-REACHED RECOMMENDATION: a 20,000-tuple cell's own
      standard error is roughly 8x the largest true effect anywhere in
      the 145-measurement archive. Spending further sampling compute on a
      question the exact closed form already answers deterministically
      would repeat this cycle's own central lesson.
    - >-
      THE COORDINATOR'S OWN PRIOR WAS OVERTURNED A SECOND CONSECUTIVE
      TIME, IN THE OPPOSITE DIRECTION FROM THE FIRST: at ordinary review
      tier, this Coordinator's prior (a non-significant second cell
      supports reading cell 1 as noise) was rejected as premature. At
      breakthrough tier, this Coordinator's prior (the pooled estimate is
      probably a genuine, if modest, signal) is rejected as wrong, for a
      reason that Coordinator's own review plan flagged as its own risk
      (correlated blind spots from repeated involvement across five
      sessions, none of which thought to check whether the quantity was
      exactly computable). This is recorded as the strongest available
      argument, from direct experience within this lane, for keeping the
      escalation discipline that produced both corrections.

  next_action: >-
    THREE NAMED ACTIONS, NONE OF WHICH IS A NEW EXPERIMENT RUN. (1) HIGH
    PRIORITY: dispatch a fresh, independent party (a new session, ideally
    on a third model where feasible) to rederive the Red Team's two exact
    closed forms from first principles, per RC-B10's own stated
    falsification route -- if confirmed, file the (N, tau, #E(F_p)[4])
    completion to H-MONO-45183a Part B as a knowledge-promotion candidate
    at DETERMINISTIC claim tier via /curate-knowledge, explicitly scoped
    to m=4 and this construction, with the "endomorphism ring enters only
    through #E[4]" statement attached so it cannot be miscited as an
    endomorphism-ring result. (2) MEDIUM PRIORITY: re-analyze the 100-cell
    Part B panel after partitioning out the 64 supersingular-contaminated
    cells (CORR-20260904-30a8ce), re-deriving se_deviation figures against
    the EXACT expectation rather than Part B's own approximate closed form
    (which the Red Team shows produces a spurious CM/ordinary split purely
    from its own missing term) -- this cleans up the Validator's own FB4
    finding into a citable result. (3) LOW PRIORITY, DOCUMENTATION ONLY:
    future records in this lane should describe same-prime matched cells
    as "crater (extra-automorphism) curve versus lower-conductor curve in
    the same isogeny class," not "CM versus ordinary," per OBJ-B5 -- no
    correction record needed for this alone since it changes no
    conclusion, but new records should use the corrected terminology.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      The (N,tau,#E[4]) completion is exactly the kind of result this
      program promotes -- but not yet, per rationale item 4 above: it is a
      single reviewer's own unverified derivation, however well
      self-validated, and this program's knowledge-promotion gate requires
      more than one party's confidence before a DETERMINISTIC-tier claim
      enters the corpus. next_action (1) names the exact path to promotion
      once that independent check lands.

  procedure_deviations:
    - >-
      NONE FROM THE REVIEW PLAN ITSELF: both breakthrough reviewers
      completed all four joints at full rigor (`degradable: false`
      honored), disclosed model identity (one differing from the task
      card's own recorded resolved_model_id, per AGENTS.md's never-
      silently-substitute rule -- itself now flagged as its own minor
      receipt defect worth fixing in future handoffs), and each
      independently confirmed never reading the other's directory.
    - >-
      SELF-DISCLOSED, SECOND CONSECUTIVE COORDINATOR PRIOR OVERTURNED: see
      rationale item 7. Recorded per this lane's own standing practice of
      disclosing when a recorded prior is wrong, regardless of direction.

  limitations:
    - >-
      This decision does not itself independently rederive the Red Team's
      exact closed forms; it names that rederivation as the required next
      step before DETERMINISTIC-tier citation.
    - >-
      Does not perform the clean re-analysis of the partitioned 100-cell
      panel; names it as next_action (2).
    - >-
      Does not reopen H-MONO-45183a Part A's own already-validated
      cycle-type-constancy finding, nor KN-OPEN-009 itself; both are cited
      as already-settled context, not re-examined here.
    - >-
      Model-correlation confound: this Coordinator and the Validator-
      breakthrough resolved to claude-sonnet-5 and claude-opus-5
      respectively per their own disclosures (the task card incorrectly
      recorded sonnet-5 for both breakthrough reviewers; the Red Team
      actually ran opus-5 too, per its own disclosure). Two disjoint
      methods on a partially-diversified model set converging is stronger
      evidence against rubber-stamping than any prior round in this
      chain, but the confound (same vendor/family lineage) is not fully
      eliminated.

  reviewed_by: [validator-breakthrough, red-team-breakthrough]
