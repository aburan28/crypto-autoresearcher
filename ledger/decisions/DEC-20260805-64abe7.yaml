coordinator_decision:
  id: DEC-20260805-64abe7
  goal_id: GOAL-MLDSA-001
  batch_id: BATCH-214d98
  recorded_at: '2026-08-05'
  supersedes: DEC-20260805-ae4a96  # resolves ANO-1 blocker from that decision

  decision: advance_lane_b_coverage_determined
  decision_label: >-
    ANO-1 resolved: KN-LIT-3907 is ePrint 2023/246 (confirmed from primary ePrint
    page). Abstract-level determination: KN-LIT-3907's formal proof covers CMA
    security in the ROM/QROM (cryptographic adversary model); both Shin DFA and
    Jendral glitch are OUTSIDE this formal model by adversary-model construction.
    Lane B coverage determination completed. H-MLDSA-f3a291 and H-MLDSA-c7b4e8
    advance to supported_scoped.

  context: >-
    DEC-20260805-ae4a96 blocked Lane B on ANO-1 (wrong ePrint for KN-LIT-3907).
    ePrint 2023/246 located via primary ePrint search. Abstract read from primary
    page (https://eprint.iacr.org/2023/246). The adversary model is unambiguous
    from the abstract: CMA security, ROM/QROM, cryptographic adversary (signing
    oracle + hash oracle queries). No physical fault adversary modelled.

  what_is_now_established:
    - >-
      H-MLDSA-f3a291 (Shin DFA challenge-sampling): The formal proof KN-LIT-3907
      covers CMA security against a cryptographic adversary. The Shin DFA exploits
      physical challenge recovery from the signed message + key. Physical fault
      adversaries that observe or manipulate device-level computations are OUTSIDE
      the adversary model of KN-LIT-3907 by construction. Coverage: NOT COVERED.
      Hypothesis supported_scoped at abstract level. Full text needed for deeper
      characterisation (is there an explicit remark excluding fault adversaries?).
    - >-
      H-MLDSA-c7b4e8 (Jendral nonce-erasure): The formal proof covers the standard
      signing oracle in the hedged model. Voltage-glitch attacks that corrupt the
      randomness input rnd before or during the hash H(ξ||M||rnd) require physical
      access to the device. Physical fault adversaries are OUTSIDE the adversary
      model of KN-LIT-3907 by construction. Coverage: NOT COVERED. Hypothesis
      supported_scoped at abstract level.
    - >-
      The boundary of the formal fault-injection security proof is therefore:
      any attack that requires physical device access is outside KN-LIT-3907.
      KN-LIT-8ce0b5 (Gupta) is the only formal source that explicitly addresses
      a physical fault class (NTT twiddle faults), and Shin DFA / Jendral glitch
      are outside that scope as well.
    - >-
      Together: no existing formal source (KN-LIT-3907, KN-LIT-8ce0b5) covers the
      Shin DFA or Jendral glitch attack surface. The fault-proof boundary at these
      two attack classes is formally uncharacterised.

  hypothesis_status_changes:
    H-MLDSA-f3a291: supported_scoped  # "outside formal model" is the supported prediction
    H-MLDSA-c7b4e8: supported_scoped  # same

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Abstract-level determination only. Full text of ePrint 2023/246 not obtained
      (PDF access not tested). The adversary-model boundary is derivable from the
      abstract but a complete characterisation would require reading the formal
      adversary definition. Not promoting until full-text confirmation.
      Knowledge entry for this specific boundary observation is scheduled as a
      KN-FIND candidate after full-text read.

  evidence_refs: [EV-MLDSA-32d752]

  next_actions:
    - >-
      Open BATCH-005 (or fold into BATCH-004 if budget permits):
      (1) Obtain ePrint 2023/246 PDF. If accessible, read the adversary model
      definition (Section 2 or preliminaries) and extract the exact tightness
      factor for EXP-MLDSA-3f7ab2. (2) Promote the Lane B coverage observation
      as a KN-FIND entry: "Dilithium/ML-DSA formal proof boundary excludes physical
      fault adversaries." (3) Continue Lane A (EXP-MLDSA-3f7ab2) with the tightness
      factor once obtained.

  decided_by: coordinator
  decided_at: '2026-08-05'

  inference_provenance:
    requested_policy: coordinator-archive
    resolved_model_id: amazon-bedrock/us.anthropic.claude-sonnet-4-6
    fallback_used: true
    model_verified: false
