  rationale:
    - >
      Protocol completeness verified before this approval (the
      Coordinator's standing duty; user authorization already satisfied
      by the standing instruction of 2026-09-06, so no per-experiment
      user confirmation is requested): objective with decidable
      positive AND negative outcomes (M-A/M-B/M-C); inputs (frozen
      abstract object set with machine-verified exact facts, frozen
      candidate-curve list with run-start exact selection rule,
      enclosure and C(E)-derivation requirements, the independent
      verifier machinery); controls C1-C6 with invalidation clauses
      (C1 exact baseline, C2 matched null, C3 known-false inward
      rounding, C4 observation collision, C5 determinism replay, C6
      producer-verifier agreement / blind re-derivation); independent
      variables; primary metrics (verdict_ledger, power_result,
      interface_result) and secondary metrics including the full
      charged cost ledger; seeds (none, by deterministic construction,
      stated); budget (3 runs, 3600 s each, 8 GB template floor, 1
      worker, no descent, no PARI, no network); stopping rules
      (exhaustion inert; baseline-stop; n_max interface stop; wall
      exhaustion = failed_infrastructure); invalidation rules per
      control; success criteria G1-G4 machine-checkable with negative
      outcomes FIRST-CLASS; falsification criteria F1-F3 each closing
      only its declared scope; required artifacts (nested run schema,
      witnesses, run-start derivation, C(E) derivation + blind re-
      derivation, cost ledgers, replay diff log, candidate-check
      archive).
    - >
      Stated exact facts machine-verified at design time with exact
      rational arithmetic (fractions.Fraction): pivots of A2 are
      (1, 15/16, 2^-20) with margin 2^-20; pivots of A3 and G_dep are
      (1, 15/16, 0); the explicit positive definite box members
      (A3, G_dep with (3,3) entry raised by 2^-10) have final pivot
      2^-10; G_dep row 3 = 2 x row 1 exactly; all three candidate
      points lie exactly on their candidate curves; all three
      candidate curves are nonsingular; candidates 1 and 3 pass the
      Mazur non-torsion test m*P != O for m = 1..12 (candidate 2
      fails it, as the frozen selection rule handles: first passing
      candidate wins, all checks archived). The run-start
      recomputation remains a frozen control; these design-time checks
      de-risk the frozen declarations.
    - >
      Grounding is not circular: the only elliptic-level independent
      object is the singleton {P}, grounded by the run-start Mazur
      non-torsion control (the established exact control of
      EXP-ECRANK-e1e30e), never by the certificate; the dependent
      object {P, 2P} is dependent by exact construction. No pre-
      committed independent pair is required, so the certificate is
      never validated against a set whose independence it alone would
      establish.
    - >
      Soundness quantifier order frozen: the certificate is sound
      because EVERY real symmetric matrix in the certified interval
      box has positive LDL pivots; the existence of one positive
      definite box member is never used as a soundness argument
      (the C4 object makes the distinction a tested case).
    - >
      HEUR-1 is carried unverified and REPORTED, not tested, at this
      gate (n_cert vs gamma and n* as data); no number in the contract
      rests on a recalled external source (rule 9): the Silverman AEC
      height-difference bound is a recalled pointer, and the number is
      the exact C(E) derived and blind-re-derived in R2.
    - >
      Scope guards: toy tier only; supplied points only; no curve
      discovery, no rank upper bound, no transfer claim to the
      31-point ICARM-302 witness (a named follow-up after review); the
      unpromoted C1-closure candidate of DEC-20260905-7adca0 stays
      gated by IMP-2 (review-breakthrough unservable, never degraded);
      no 2-descent or ellrank anywhere.
  evidence_refs:
