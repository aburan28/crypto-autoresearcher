  # ==================================================================
  # 11. KNOWLEDGE PROMOTION
  # ==================================================================
  knowledge_promotion:
    promoted: [KN-FIND-9b5df0]
    not_warranted: null
    promotion_note: >-
      DISCRETIONARY, AND THE MANDATORY TRIGGER IS EXPLICITLY NOT MET: this decision is
      `revise`, not `support`/`reject_scoped` on `replicated`/`strong` evidence, and
      adjudicates no proposition about a lattice. The Coordinator that authored this record
      requested an identifier rather than drawing one itself, per AGENTS.md rule 14. The
      dispatching harness session minted KN-FIND-9b5df0 without scanning state, confirmed it
      in two scopes (worktree --check: well-formed, 0 of 6,611 paths; cross-ref sweep of the
      25 most-recently-updated remote branches: 0 hits), and wrote the entry following the
      Coordinator's own specified content (its `what_the_promotion_would_say_if_minted` field
      below). I JUDGE THE CENTRAL FINDING (F-1/RT-1)
      MERITS DISCRETIONARY PROMOTION, on these grounds: it is CONVERGENT (independently
      found by both reviews, working blind to each other, via partially different
      supporting methods -- an epsilon-scale contrast class versus a same-host environment
      record plus a built rdet control); it is DURABLE (invariant under RC-1's headline-count
      resolution and RT-2's coverage-table correction, both unrelated fields); and it
      GENERALIZES BEYOND THIS GOAL: a pre-registration that names two data sources as
      "independent routes" for a cross-validation comparison must check their code
      provenance BEFORE freezing that designation, because bit-identical agreement between a
      shared-kernel pipeline re-executed on a different host is diagnostically
      indistinguishable, at the level of the raw comparison number, from genuine
      cross-implementation agreement -- and this campaign has now hit exactly that trap in a
      frozen, notarized pre-registration (PREREG-3's own "ROUTE-I" label), independently
      caught by two reviewers using different methods. This is a distinct lesson from this
      goal's existing "genuinely cross-platform NOT citable" carry (which is about not
      over-reading environment diversity AFTER an agreement is observed); this one is about
      auditing CODE PROVENANCE BEFORE a pre-registration NAMES a source as an independent
      route in the first place, and I judge it warrants a standalone corpus entry rather
      than only a repetition of the existing carry. THE DEFERRED PROMOTION IS NO LONGER
      DEFERRED: matching the exact precedent of DEC-20260812-781961 (KN-FIND-9d44b4) and
      DEC-20260813-c60bba (KN-FIND-7d098b), the requested identifier was supplied before
      this archive committed, and the finding is promoted as KN-FIND-9b5df0 IN THIS SAME
      ARCHIVE rather than a successor's.
    what_the_promotion_would_say_if_minted: >-
      In a pre-registered two-route cross-validation comparison, bit-identical (or
      near-epsilon) agreement between two named "independent routes" is diagnostic of
      independent verification ONLY IF the two routes are algorithmically independent; when
      one route's core computational kernel is transcribed, verbatim, from the other
      (directly or through an intermediate carrier), the same agreement is fully explained
      by cross-environment reproducibility of ONE deterministic pipeline, and no comparison
      of that shape can distinguish "the observable is real and both algorithms agree" from
      "the code is shared and of course it reproduces." A pre-registration that designates a
      data source as an "independent route" before checking its code provenance against the
      route it is meant to validate risks freezing that conflation before any data exists.
      Checking code provenance -- not merely execution-host diversity, which is neither
      necessary nor sufficient -- is a cheap, mechanical, pre-registrable due-diligence step
      (a directory diff of the actual function bodies each route's own docstrings may
      already disclose) that should be performed BEFORE a pre-registration names two sources
      as independent, not discovered after the fact by review. This narrows nothing about
      any specific route; it names a general instrument-design failure mode for the
      "two-route disagreement as an uncertainty floor" pattern, distinct from and
      complementary to KN-FIND-9d44b4 and KN-FIND-7d098b's findings about fibre-constancy
      instrument design.

