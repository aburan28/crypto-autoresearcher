coordinator_decision:
  id: DEC-20260813-28d7b2

  context: >-
    BATCH-fbb639 of GOAL-MLKEM-005 discharged DEC-20260813-c60bba's single next_action
    (three parts: RC-1, RC-2, and the lead measurement of part (c)) against PREREG-3, the
    frozen pre-registration notarized alone at commit 3d2eabf8ddfa9e33ed3c9cf5b0cc0d9f14ebcd82
    by TASK-20260813-6ad846 in a commit containing ZERO producer artifacts, and applied by
    the bounded lead producer TASK-20260813-7b3039, snapshot-committed at
    391f811e7b6b23fb40235a0608aebeb05b5b9c4a by TASK-20260813-7ac7cd. Part (c) measured
    whether the reduction-dependent observables lam1n, hkz and rawtail -- out of A-1's scope
    by PREREG-2 2.5, and the half of this goal's candidate list that matters for C3 -- have
    their own fibre dispersion at binary64 exceeding their own two-route disagreement, at
    L7/L9/L11 (d <= 40, no new reduction). TWO INDEPENDENT REVIEWS RETURNED: Validator
    TASK-20260813-451a6d (VAL-20260813-451a6d), verdict `incomplete`; Red Team
    TASK-20260813-6ab893 (RT-20260813-6ab893), three objections (RT-1 CRITICAL, RT-2 MAJOR,
    RT-3 MINOR), stating explicitly it is "not arguing for a different branch." THE FROZEN
    TERMINATION CLAUSE OF PREREG-3 SECTION 3.5 FIRED T-C3LANE-OPEN, REPORTED WITH THE 3.5
    -PARTIAL SUFFIX AS T-C3LANE-OPEN-PARTIAL, AND BOTH REVIEWS CONFIRM IT INDEPENDENTLY FROM
    THE FROZEN TEXT, ROBUST UNDER TWO DIFFERENT, INDEPENDENTLY-CONSTRUCTED STRICTER
    READINGS. This decision is that batch's official close.
    CLAIM TIER TOY, UNCONDITIONALLY: nothing here bears on ML-KEM security, on any FIPS 203
    parameter set, on any attack cost, or on any cost model.

  decision: revise

  decision_note: >-
    `revise` is the ACTION -- the evidence record is committed with a verdict-aware
    admissibility split, RC-1 and RC-2 are discharged as committed text, F-1/RT-1's
    qualification is attached to the termination branch's license, one required correction
    (RT-2's coverage table) is ordered for a cheap superseding record, and the successor's
    single next action is specified -- and it is NOT a verdict on any proposition about a
    lattice. NOTHING IS `support`ed, `weaken`ed OR `reject_scoped` HERE, no hypothesis status
    moves and none is named, and no refutation artifact is owed for a transition that is not
    made. `approve` would treat the Validator's `incomplete` verdict as `passed`, which it
    explicitly is not, and would silently endorse "a genuinely independent computation" at
    the strength report_c3lane.md states it -- which F-1/RT-1 show it is not.
    `reject_scoped` would be forbidden even if it applied: this is a single, unreplicated
    (model-correlated) empirical batch, and `reject_scoped` on such a batch is barred by
    AGENTS.md's evidence rules regardless. `pause` is unavailable: GOAL-MLKEM-005's
    pause_conditions are INFRASTRUCTURE-ONLY plus a user request, and an instrument outcome,
    a scoped negative and a coverage-table defect are all either listed in
    non_terminal_conditions or are not infrastructure failures, and none may be cited in a
    decision that closes, pauses or completes it. THIS BATCH CLOSES, PAUSES AND COMPLETES
    NOTHING. T-C3LANE-OPEN-PARTIAL CLOSES NO LANE BY ITSELF -- PREREG-3 3.5 is explicit that
    T-C3LANE-OPEN forbids "closing, pausing or completing GOAL-MLKEM-005" and licenses only
    a bare domain-worth-stating statement; T-C3LANE-OBSTRUCTED did not fire, and even had it
    fired, PREREG-3 3.5 requires the admissibility-gate lane's closure to be made in its OWN
    separate committed Coordinator decision, never in this batch's own close. Neither
    condition is met, so this decision does not close that lane and does not declare any C3
    candidate safe -- the latter would in any case run directly against F-1/RT-1, which
    shows the EXCEEDS verdicts rest on a same-code reproducibility floor, not a genuine
    cross-implementation one.

  target_ids:
  - GOAL-MLKEM-005
  - BATCH-fbb639
  - EV-MLKEM-965a37
  - TASK-20260813-0eb5a3
  - TASK-20260813-6ad846
  - TASK-20260813-7b3039
  - TASK-20260813-7ac7cd
  - TASK-20260813-451a6d
  - TASK-20260813-6ab893

  # ==================================================================
  # 1. VALIDITY BEFORE INTERPRETATION
  # ==================================================================
  run_set_validity:
    ruling: >-
      THE RUN SET IS VALID AND ADMISSIBLE AS EVIDENCE FOR THE PARTS NAMED admissible_now IN
      EV-MLKEM-965a37, AND NOT YET ADMISSIBLE FOR THE TWO PARTS NAMED
      not_admissible_until_superseded. This is the Validator's own `incomplete` split, not a
      rounding by me. Checked before interpretation.
    expected_run_count: >-
      ONE lead producer, ONE measurement invocation (measure_c3lane.py, 0.0589 s of a 600 s
      cap; a second, discarded, scratch-path determinism-check invocation is disclosed but
      not counted against the 1-run budget, consistent with prior batches' convention). Both
      reviews independently confirm no invocation is omitted and no reduction of any kind
      occurred anywhere in this batch (Validator AC-11; Red Team
      reduction_and_scope_challenges).
    schema_complete_manifests: >-
      CONFIRMED BY THE VALIDATOR (AC-1 through AC-12) AND INDEPENDENTLY BY THE RED TEAM
      ("What I reviewed" section). Both archives -- the notarization (3d2eabf8d, 3 paths) and
      the lead snapshot (391f811e7, 8 paths) -- pass change-set equality at 3/3 and 8/8 with
      0 extra and 0 missing, verified by BOTH reviews independently running git plumbing
      themselves. Durable command.txt, stdout.log and stderr.log exist; the exact runnable
      command including resource caps is recorded; git revision and dirty-tree state are
      recorded. ONE MINOR DEFECT: run_manifest.yaml's git.note field embeds a path inside a
      folded YAML scalar, contrary to the stated rule (F-2, Validator alone) -- recorded, not
      corrected, no declared artifact obscured.
    seed_integrity: >-
      CONFIRMED BY BOTH REVIEWS. Both reviewers built implementations of PREREG-3's part (c)
      formulae from the frozen prose alone -- the Validator importing NO producer module, the
      Red Team likewise -- and both report agreement with the committed values at every one
      of the 27 cells (Validator MR-2: 27/27, 0 mismatches, to full float64 precision; Red
      Team section 5, same branch re-derived independently).
    raw_summary_agreement: >-
      CONFIRMED FOR THE MACHINE-READABLE RECORD, WITH ONE MATERIAL QUALIFICATION AND ONE
      MATERIAL COVERAGE DEFECT, BOTH NAMED. results_c3lane.json's per-cell numbers, aggregate
      verdict and termination branch are reproduced EXACTLY by both reviews from an
      independent implementation. THE MATERIAL QUALIFICATION: report_c3lane.md's
      characterization of the L9/L11 am4 contribution as "a genuinely independent
      computation" is not supported at the strength stated once the source code is read --
      D_route measures cross-environment reproducibility of one shared deterministic
      pipeline, not disagreement between independently designed computations (F-1, Validator;
      RT-1, Red Team, independently). THE MATERIAL COVERAGE DEFECT: 2 of the 18 reported
      COVERED cells (hkz/L9_b15, hkz/L11_b20) have no genuine per-beta am4 comparison at all,
      and 2 more (hkz/L9_b22, hkz/L11_b30) cite the wrong beta's value, numerically harmless
      (RT-2, Red Team alone). Neither disagreement invalidates the run set: every reported
      arithmetic value, the aggregate verdict and the termination branch are unaffected by
      both, and both are ordered as required corrections in EV-MLKEM-965a37 rather than
      treated as invalidating.
    control_comparability: >-
      CONFIRMED, AND STRENGTHENED BY THE RED TEAM'S OWN BUILT CONTROL. The rawtail ROUTE-W
      labelling and exclusion, and the exclusion of the second rawtail candidate
      (TASK-20260812-56b9da), are both independently re-verified correct by direct code
      inspection by BOTH reviews, the Red Team reporting its own confirmation explicitly
      AGAINST its own thesis (section 7). The Red Team additionally built a control PREREG-3
      never required -- D_route(rdet) across genuinely different hosts -- which is the
      null-object-control discipline docs/inventor-protocol.md section 3 requires, applied
      here to the instrument itself rather than to a candidate. It ties out (rdet's own
      fibre dispersion is algebraically forced to zero) rather than demonstrating a false
      EXCEEDS, and this is reported honestly as neither confirming nor refuting the open
      question -- see central_finding below.
    infrastructure_separation: >-
      No infrastructure failure, timeout, crash or missing dependency occurred anywhere in
      this batch's execution or review, confirmed by both reviews. The 8 UNCOVERED rawtail
      cells are a corpus-gap finding (no independent second computation of rawtail exists in
      the committed corpus at these lattices), not an infrastructure failure, and are
      reported as UNCOVERED rather than defaulted to either verdict, exactly as PREREG-3 3.5
      requires.

  # ==================================================================
  # 2. THE BRANCH THAT FIRED, AND WHAT IT MEANS
  # ==================================================================
  termination_branch:
    branch: T-C3LANE-OPEN, reported with the PREREG-3 3.5 suffix as T-C3LANE-OPEN-PARTIAL.
    read_off: >-
      COVERED = 18 of 27 cells (or 16 of 27 under RT-2's correction), non-empty, so
      T-C3LANE-NODATA does not fire. D_route = 0.0 exactly at every covered cell, s_c^fib
      strictly positive at every one -- no ties -- so every covered cell verdicts EXCEEDS
      and SOME-EXCEEDS holds; ALL-CLEAR is arithmetically impossible on this data. PREREG-3
      3.5's stated precedence gives SOME-EXCEEDS priority over ALL-CLEAR whenever both could
      otherwise be read from the same data, so T-C3LANE-OPEN fires and T-C3LANE-OBSTRUCTED
      is precluded. Coverage < 27/27 under either reading, so the -PARTIAL suffix applies.
      BOTH REVIEWS RE-DERIVED THIS INDEPENDENTLY from raw per-cell verdicts with NO producer
      import and CONFIRM IT ROBUST under two different, independently constructed stricter
      readings (Validator CC-5: 6/27 L7-only, same branch; Red Team RT-2: 16/27 corrected,
      same branch). T-C3LANE-OBSTRUCTED could not have fired under any reading either review
      could construct.
    what_it_licenses_quoted_verbatim: >-
      "a statement that 'a successor assumption analogous to A-1, restricted to the
      reduction-dependent candidates and to the covered cells/routes, has a domain worth
      stating' -- and nothing stronger."
    what_it_forbids_quoted_verbatim_and_honoured_in_full:
    - treating this as A-1 held for lam1n/hkz/rawtail (A-1 was never stated over them and
      this measurement does not state it now)
    - specifying any dispersion criterion, fibre clause or gate on the strength of this
      branch alone
    - any claim about ML-KEM, any FIPS 203 parameter set, any attack cost or any cost model
    - closing, pausing or completing GOAL-MLKEM-005
    the_license_as_qualified_by_the_central_finding_stated_here_so_it_travels_at_every_citation: >-
      GIVEN F-1/RT-1 (below), THIS DECISION IS MORE CONSERVATIVE THAN PREREG-3 3.5's OWN
      FLOOR REQUIRES. The domain-worth-stating license this branch permits, wherever it is
      invoked from this batch, IS QUALIFIED AS FOLLOWS: worth stating ON THE COVERED CELLS,
      UNDER CODE-SHARED CROSS-ENVIRONMENT REPRODUCIBILITY, NOT UNDER INDEPENDENT
      VERIFICATION. A future reader citing T-C3LANE-OPEN-PARTIAL from this batch MAY NOT
      silently upgrade it to "independently confirmed," "cross-implementation agreement," or
      any phrase implying two algorithmically distinct computations concurred. This
      qualification travels with the branch's license at every future citation, exactly as
      this goal's existing "PORTABILITY not cross-platform" qualification already travels
      with the L7/L8 headline (carried, not new).

  # ==================================================================
  # 3. RC-1 / RC-2 -- DISCHARGED
  # ==================================================================
  rc1_rc2: >-
    Both discharged as committed, citable text by this record and EV-MLKEM-965a37 (full text
    in EV-MLKEM-965a37.rc1_rc2_discharge), carried verbatim from PREREG-3 sections 1 and 2 by
    TASK-20260813-7b3039 with NO recomputation, and independently re-confirmed by both
    reviews DIRECTLY against the committed results_a1.json (Validator CC-1..CC-3; Red Team
    section 6). RC-1: the BATCH-6b6e78 headline count is 1,313, not 1,416, under PREREG-2
    2.6's own declared route_provenance. RC-2: results_a1.json's P-A12a.OUTCOME reads
    "FALSIFIED", not "HELD", and always did; the prior commit message's "mis-scored HELD ...
    left unedited" account is false and is corrected here, without editing the immutable
    commit 4e466c6bf221ea002fe84311baccdb816081a8cd or its message. PREREG-3 3.7 states these
    become durable "only when that record commits and the verifier accepts it" -- this
    record and EV-MLKEM-965a37 freeze and publish the text; durability follows this ledger
    archive's commit and verifier acceptance.

  # ==================================================================
  # 4. THE CENTRAL FINDING -- CONVERGENT, INDEPENDENTLY FOUND BY BOTH REVIEWS
  # ==================================================================
  central_finding: >-
    F-1 (Validator, MAJOR) / RT-1 (Red Team, CRITICAL): the "independent" second route
    (PREREG-3's "ROUTE-I") is not independent. `results_l7l8.json` and `results_am4.json`,
    the two sources PREREG-3 designates as ROUTE-I, share their core numerical kernel --
    `make_A`, `build_basis`, `hkz_profile` -- VERBATIM with ROUTE-P's `results_relvar.json`
    (each downstream file's own docstring saying so: "CARRIED VERBATIM"), forming a
    documented chain `measure_am4.py` -> `measure_relvar.py` -> `replicate_l7l8.py`. For L7
    the two routes additionally ran on the SAME HOST (`results_l7l8.json`'s own environment
    block: `ENVIRONMENTS_DIFFER: false`). `D_route = 0.0` at all 18 covered cells is
    explained by SAME-CODE, CROSS-ENVIRONMENT REPRODUCIBILITY, not by independent-algorithm
    cross-validation. `report_c3lane.md`'s own characterization of the L9/L11 contribution as
    "a genuinely independent computation" OVERSTATES what it establishes. THIS CHANGES NO
    NUMBER AND NOT THE BRANCH -- both reviews independently confirm `T-C3LANE-OPEN-PARTIAL`
    is robust under two different stricter readings, each constructed without reference to
    the other's work. IT CHANGES WHAT THE EXCEEDS VERDICTS CAN BE READ TO SUPPORT: they show
    the observables' fibre dispersion is nonzero and detectable through this pipeline, and
    exceeds this specific corpus's own same-code reproducibility floor -- not that two
    independent implementations agree that fact.
    THE RED TEAM'S OWN CONTROL, CHECKED AGAINST ITS OWN THESIS AND REPORTED EVEN THOUGH IT
    COMPLICATES IT: it built `D_route(rdet)` comparing genuinely different-host data (Linux
    vs macOS), confirming the code-sharing artifact is CORPUS-WIDE, not cell-specific --
    `D_route(rdet) = 0.0` too. But `rdet`'s own dispersion (`s_c^fib`) is ALSO algebraically
    forced to zero regardless of code sharing (`|det B| = q^(d-k)` is independent of the
    random draw), so the control TIES OUT rather than proving the artifact produces a false
    EXCEEDS anywhere. RECORDED HONESTLY, PLAINLY, AND WITHOUT RESOLVING IT EITHER WAY: this
    null-result-on-its-own-control NEITHER CONFIRMS NOR REFUTES that the 18 (or 16) EXCEEDS
    verdicts would still fire under genuine algorithmic independence. That question REMAINS
    OPEN. No non-target candidate with genuine, non-algebraically-forced fibre dispersion
    exists anywhere in this corpus to complete a clean false-positive demonstration either
    way (Red Team, "required_controls").

  # ==================================================================
  # 5. THE COVERAGE-DEFECT FINDING -- RED TEAM ALONE
  # ==================================================================
  coverage_defect_finding: >-
    RT-2 (Red Team, MAJOR, single-source, not yet cross-checked by the Validator): 2 cells
    (`hkz/L9_b15`, `hkz/L11_b20`) are falsely marked COVERED in `R-C-OUT-0` -- PREREG-3 3.2's
    first-class deliverable -- because `results_am4.json`'s `G_REL1` block never reports
    either lattice's middle beta at all, only the two `REL1_PAIR` endpoint betas, and
    `measure_c3lane.py` never reads `X_hi`. Two further cells (`hkz/L9_b22`, `hkz/L11_b30`)
    cite the WRONG beta's value as their `D_route` source; the Red Team independently
    computed the TRUE `beta_hi` comparison for both and it is ALSO exactly `0.0`, so no
    reported `D_route` value is numerically wrong on the evidence checked. This narrows
    GENUINE coverage from 18 to 16 of 27, WITHOUT changing the fired branch: all 16
    genuinely-covered cells still verdict EXCEEDS. `lam1n`'s equivalent beta reuse is
    verified LEGITIMATE and excluded from this finding (`lam1n`'s `X_lo == X_hi` exactly, so
    any beta's comparison genuinely is "the" comparison for it). RECORDED AS ITS OWN
    NUMBERED FINDING, DISTINCT FROM THE CENTRAL FINDING: it is a provenance/labelling defect
    in the coverage table, not a route-independence defect, and the two are independent
    (fixing one does not fix or depend on the other).

  # ==================================================================
  # 6. THE MINOR ARTIFACT-POLICY DEFECT -- VALIDATOR ALONE
  # ==================================================================
  minor_defect: >-
    F-2 (Validator, MINOR, single-source): `run_manifest.yaml`'s `git.note` field embeds a
    repository-relative directory path inside a folded YAML scalar, contrary to PREREG-3
    section 7's stated rule. LOW severity -- a directory prefix in a sentence, not a
    declared artifact path hidden from a machine check; `artifacts_declared` itself is a
    plain list and remains fully greppable. Disclosed here; no correction to any immutable
    artifact is required or made.

  # ==================================================================
  # 7. RATIONALE
  # ==================================================================
  rationale:
  - >-
    THE BATCH DISCHARGED ITS PREDECESSOR'S SINGLE NEXT ACTION IN FULL, AND THE ANSWER TO
    PART (c) IS AN OPEN-BUT-QUALIFIED DOMAIN, NOT A CLOSED LANE. RC-1 and RC-2 are cheap,
    correct, mechanical corrections, both independently re-confirmed against the primary
    artifact by both reviews. Part (c)'s termination clause was frozen and notarized before
    any measurement existed, and the branch that fired -- T-C3LANE-OPEN-PARTIAL -- is exactly
    the branch the frozen text fires from the reported numbers, independently re-derived and
    confirmed robust by both reviews under two different stricter readings.
  - >-
    THE HARD CALL IS WHAT THE CENTRAL FINDING DOES TO THE BRANCH'S EVIDENTIARY WEIGHT, AND
    IT IS MADE MORE CONSERVATIVELY THAN PREREG-3 3.5's OWN FLOOR REQUIRES. Both reviews,
    working blind to each other, independently read the actual source code behind PREREG-3's
    "ROUTE-I" label and independently concluded it is not algorithmically independent of
    ROUTE-P. This is not a re-litigation of the branch -- both reviews explicitly confirm the
    branch is unaffected and robust -- it is a correction of what the branch's firing can be
    read to establish. Recording this as the batch's central finding, rather than folding it
    silently into "the measurement succeeded," is deliberate: the arithmetic answering
    PREREG-3's literal question is sound, but the informal reading a future citation would
    reach for ("two independent computations agree the dispersion is real") is not supported,
    and this record exists specifically to prevent that informal reading from becoming
    citable by default.
  - >-
    THE CONVERGENCE IS WHAT MAKES THE CENTRAL FINDING ACTIONABLE RATHER THAN SUGGESTIVE, AND
    THE RED TEAM'S OWN CONTROL IS WHAT KEEPS IT HONEST. Two reviewers, working from the same
    frozen text without reading each other's write scope, independently diffed the same three
    source files and reached the same conclusion by partially different supporting methods
    (an epsilon-scale contrast class; a same-host environment record plus a built rdet
    control). The Red Team's own control complicating its own thesis -- rdet ties out rather
    than proving a false EXCEEDS -- is reported at full weight rather than omitted, which is
    exactly what keeps "the routes are not independent" from overreaching into "the EXCEEDS
    verdicts are therefore false": that stronger claim is NOT made here, and the open
    question is stated as open, not resolved by assertion in either direction.
  - >-
    THE ADVERSE ITEMS ARE CARRIED RATHER THAN BURIED. The central finding (F-1/RT-1), the
    coverage-table defect (RT-2), and the minor artifact-policy defect (F-2) are all recorded
    at full weight, none is smoothed into a `passed` verdict, and the one required correction
    that is not yet discharged (RT-2's coverage table) is ordered explicitly as part of the
    single next action rather than deferred indefinitely.
  - >-
    WHAT THIS BATCH IS NOT ALLOWED TO BUY, STATED SO NO LATER READER HAS TO INFER IT. It buys
    no admissibility claim about any lattice, no statement about ML-KEM, no closure of the
    admissibility-gate lane (T-C3LANE-OBSTRUCTED did not fire, and PREREG-3 3.5 requires a
    separate decision for that regardless of this batch's outcome), no declaration that any
    C3 candidate is safe, no rescoring of any prior batch, and no retirement of AM-3.

  # ==================================================================
  # 8. WHAT DOES NOT CHANGE
  # ==================================================================
  binding_carries_restated_and_not_re_litigated:
  - CLAIM TIER STAYS TOY, UNCONDITIONALLY. No number transports to beta = 606, d = 1420 or
    any FIPS 203 parameter set by extrapolation, analogy or any other route.
  - AM-3 IS NOT RETIRED. AM-10 through AM-18 and their carries are in force.
  - BATCH-a44d08, BATCH-4ed139, BATCH-9e3584, BATCH-cbe023 and BATCH-6b6e78 are NOT
    RESCORED OR REVALIDATED IN ANY RESPECT by anything in this batch, including its reads of
    results_am4.json and results_l7l8.json, which extract already-committed numbers only.
  - NEITHER SUB-6x COUNT IS CITABLE. "A factor of 6 to 31" is FALSE; the citable range is
    4.87x to 31.03x. "Genuinely cross-platform" is NOT citable; the citable form is a
    PORTABILITY result across three textually distinct implementations with fpylll pinned
    at 0.6.4 -- and this batch's own central finding directly reinforces why that caveat
    exists.
  - AM4-OBS-1 is cited ONLY through KN-FIND-f38a89. AM-9 binds (fpylll's k counts the
    q-scaled rows, not the identity block) and was directly checked in this batch's
    construction-comparability audit.
  - THE G-VAR REFUSAL IS CITED ONLY AS CONDITIONAL ON THE FROZEN FAMILY F0.
  - KN-FIND-7d098b and KN-FIND-9d44b4 ARE PROMOTED, not restated as new anywhere in this
    batch or this record.
  - >-
    RULE 12 IS UNMET AND UNWAIVED, AND THIS DECISION DOES NOT EXEMPT ITSELF FROM THE
    STANDARD IT APPLIES TO THE PRODUCER. Both reviews of THIS batch are two SESSIONS ON ONE
    MODEL and, per the Red Team's own host_measured note, the same sandboxed execution
    recipe as the producer -- the identical shape of dependence F-1/RT-1 criticizes in
    PREREG-3's own "ROUTE-I" claim. The irony is named rather than left implicit: a decision
    that qualifies the producer's "genuinely independent computation" for resolving to
    shared code and a shared host is written by a Coordinator whose own two reviewing
    sessions resolve to one model on one host, exactly as every prior batch in this goal has
    stated of itself and exactly as this batch states of itself again here.
  - T-C3LANE-OPEN-PARTIAL CLOSES NOTHING. This batch closes, pauses and completes nothing,
    and does NOT itself close the admissibility-gate lane even though T-C3LANE-OBSTRUCTED
    did not fire (it would not have under either coverage reading, and PREREG-3 3.5 requires
    a SEPARATE decision for that lane closure regardless).
  - THE SPLIT-PRODUCER NOTARIZATION PATTERN IS RETAINED UNCHANGED, having now worked seven
    times and been verified in both directions by independent sessions each time.
    knowledge/INDEX.md must NOT be written, regenerated or staged.

  # ==================================================================
  # 9. EVIDENCE
  # ==================================================================
  evidence_refs:
  - ledger/evidence/EV-MLKEM-965a37.yaml
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-fbb639/reviews/TASK-20260813-451a6d/validation_report.yaml
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-fbb639/reviews/TASK-20260813-6ab893/red_team_report.md
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-fbb639/tasks/TASK-20260813-0eb5a3/prereg.md
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-fbb639/tasks/TASK-20260813-7b3039/report_c3lane.md
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-fbb639/tasks/TASK-20260813-7b3039/results_c3lane.json
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-fbb639/tasks/TASK-20260813-7b3039/run_manifest.yaml
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-fbb639/archives/TASK-20260813-6ad846/snapshot-receipt.json
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-fbb639/archives/TASK-20260813-7ac7cd/snapshot-receipt.json
  - ledger/decisions/DEC-20260813-c60bba.yaml
  - knowledge/findings/KN-FIND-7d098b.md
  evidence_refs_note: >-
    Every number quoted in this decision is attributed to the producer, review or committed
    artifact that measured it. I re-ran no code and made no independent measurement of my
    own beyond reading the cited committed files.

  # ==================================================================
  # 10. LIMITATIONS
  # ==================================================================
  limitations:
  - >-
    CLAIM TIER TOY, UNCONDITIONALLY. Scope exactly as PREREG-3 8 and EV-MLKEM-965a37 state
    it. EVERY CONCLUSION IS SCOPED TO EXACTLY THAT AND TRANSPORTS NOWHERE.
  - >-
    INDEPENDENCE IS PROCEDURAL, NEVER MODEL-LEVEL, AND NOT ENVIRONMENTAL. AGENTS.md RULE 12
    IS UNMET AND UNWAIVED. The producer and both reviews resolve to the SAME MODEL and, per
    the Red Team's own record, largely the same execution environment.
  - >-
    THE CENTRAL FINDING MEANS THIS BATCH DOES NOT ESTABLISH THAT lam1n/hkz's FIBRE
    DISPERSION EXCEEDS A GENUINELY ALGORITHMICALLY INDEPENDENT SECOND COMPUTATION'S
    DISAGREEMENT. No such computation exists anywhere in this corpus, for these candidates
    or for any candidate this corpus has ever tested this way (per the rdet control). This is
    the batch's central limitation, restated here.
  - >-
