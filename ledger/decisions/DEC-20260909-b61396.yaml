      The evidence is toy-scale and scoped to the committed seeds, b-tuples,
      heights, counted-operation caps, and same-machine/runtime deployment.
    - >-
      R10's exponent-window and per-decade calibration checks fail; no
      exponent claim is supported.
    - >-
      R9/R11 `CERTIFIER_LIMITED` outcomes are lower bounds, not PASS or exact
      all-tuple totals, and the ladder was a no-op under the 60-prime cap.
    - >-
      R14's completed zero excludes the unenumerated rational-height lattice.
    - >-
      The review checker reports two procedure/conformance deviations: J1's
      required post-freeze receipt comparison intersects its declared blind
      prefix, and J3 lacks the checker-required aggregate attestation verdict.
      The reports are preserved and neither deviation is recast as evidence.
