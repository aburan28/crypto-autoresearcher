    - coordination/goals/GOAL-ECRANK-002/batches/BATCH-8fa16f/reviews/TASK-20260909-9ee65f/validation-report.yaml
    - coordination/goals/GOAL-ECRANK-002/batches/BATCH-8fa16f/reviews/TASK-20260909-66f9be/red-team-report.yaml
  limitations:
