  rationale:
    - >-
      J1's frozen derivation agrees with the conditional IV-1R and IV-4R gate
      truth table, and exact post-freeze receipt comparison finds eight valid
      R9 n=6 control records and 64 valid R15 null records. The omitted
      defining geometry remains outside the blind input, so this is a gate
      check rather than a new geometric proof.
    - >-
      J2 independently verifies all 62 hash-bound snapshot paths, the terminal
      companions for R9-R15, seeded R10 reconstruction and 9/9 recovery,
      canonical R12/R13 replay equality, and three exact R12 certificate spot
      checks. These checks support custody and bounded integrity only.
    - >-
      J3 rejects every scope-removing mutation: R14's zero is only the
      completed n=8 integer coefficient-box enumeration with c solved exactly;
      R9/R11 remain CERTIFIER_LIMITED lower-bound observations with the
      60-prime no-op disclosure; and R10's 9/9 is only the named planted
      R3-family n=6 control on the same disclosed machine/runtime.
    - >-
      The v2 fresh-seed round gives a replicated toy-scope existence and
      control observation relative to v1, but its same-machine limitation,
      failed R10 calibration, dual-convention HEUR-1 tension, unmeasured
      rational lattice, and limited n=8 certifier remain unresolved.
    - >-
      No result here closes C1, promotes C1, supports a breakthrough, or
      changes the hypothesis/experiment/goal status. A broader reading needs
      a fresh additive protocol with rational-lattice coverage, independent
      machine/runtime controls, and an exact certifier ladder.
  evidence_refs:
    - EV-ECRANK-039664
    - experiments/EXP-ECRANK-73275e/analysis-v2-review.md
    - experiments/EXP-ECRANK-73275e/execution-report-v2.yaml
    - coordination/goals/GOAL-ECRANK-002/batches/BATCH-e3cf55/archives/TASK-20260908-9439c0/snapshot-receipt.json
