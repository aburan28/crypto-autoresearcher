coordinator_decision:
  id: DEC-20260803-4d31df
  goal_id: GOAL-MLKEM-003
  batch_id: BATCH-016
  evidence_id: EV-MLKEM-ee220e
  recorded_by_task: TASK-20260803-9d3a59
  archive_kind: ledger
  recorded_at: '2026-08-03'
  decision: revise
  decision_label: right_conclusion_wrong_mechanism_floor_rejected_as_reference_point

  context: >-
    BATCH-016 red-teamed BATCH-015, which had one investigation, one validation
    and no adversarial pass. TASK-20260803-6329c6 returned blocking_objections
    with both requested rulings made explicitly.

  central_adjudication: >-
    BATCH-015 REACHED THE RIGHT CONCLUSION BY THE WRONG MECHANISM, AND I ENDORSED
    THE MECHANISM TWICE. The occupancy floor 0.9183 is a valid MINIMUM over the
    admissible family and an invalid REFERENCE POINT: it is attained only by the
    member where each iteration contributes 0 or 1 per cell, and the archive
    rejects that member at more than three standard deviations. The floor member
    predicts a deficit concentrated at HIGH occupancy; the observed deficit sits
    in the LOW-occupancy tercile, where the correction is 0.4 percent, and
    vanishes in the high tercile where it is 22 percent. Promoting a minimum to a
    reference point is a third statement that nobody checked -- the same
    quantifier blind spot that produced the error BATCH-015 itself recorded
    against me. ANOM-5 is still not an effect, on multiplicity, model-order
    sensitivity and a sign disagreement between the two files, none of which
    needs a floor. `revise`: the conclusion stands, the mechanism is withdrawn.

  what_is_established:
    - >-
      Identical distribution SURVIVES: lag-1..8 autocorrelation max |0.035|
      against sd 0.0158, runs z = -0.214, block-mean variance ratios 0.893-1.228,
      with the probe's power calibrated to detect monotone drift above 0.25 sd of
      F(solution).
    - >-
      IT WAS NEVER THE LOAD-BEARING ASSUMPTION. Heterogeneous independent Poisson
      sums have Var = mu exactly, so non-identity cannot produce a sub-floor
      reading. The Coordinator verified this. The batch was convened partly to
      test a hypothesis that could not have mattered.
    - >-
      ANOM-5 is not an effect: Sidak p = 0.105 over six post-hoc readings, a
      rate-model-order range of 0.43 against a 0.082 floor correction, and the two
      files disagreeing in sign.

  what_is_withdrawn:
    - >-
      THE FLOOR AS A REFERENCE POINT. EV-MLKEM-ce1884 U-1 and U-4 are superseded
      by EV-MLKEM-ee220e W-4. The floor remains a correct minimum and a correct
      statement about the admissible set; it is not the expected value of the
      statistic, and the -1.4 to -1.6 sd residue computed against it is not the
      quantity anyone thought it was.
    - >-
      My own snapshot-receipt framing of the floor as the thing that "dissolves"
      ANOM-5. What dissolves ANOM-5 is multiplicity and model-order sensitivity.

  ruling_on_exhaustion: >-
    THE MID-BAND LANE IS NOT EXHAUSTED. Five moves remain at 301 bins and the red
    team executed one of them. The WHOLE-BAND POINT-COMPARISON SUB-LANE IS
    exhausted, with a sharper obstruction than the bin count I had proposed:
    K = ln(100)/a with a = 0.01530 per score fixed by the instance, so more
    iterations TRANSLATE the count window without WIDENING it and buy no mid-band
    bins at all. The 1414-bin requirement would need 9.4 decades of count range in
    a region where the floor's own applicability flag is False. Forward guidance,
    as the closure standard requires: only a flatter-decay instance helps, never
    more data. I asked for this ruling expecting "exhausted" and got a more
    precise answer that is partly the opposite.

  weighing_of_the_red_team: >-
    Accepted in full.
    (1) W-1 IS THE SIXTH FALSIFIED COORDINATOR PREMISE IN THIS GOAL AND THE
    LEAST excusable. I asserted the archive holds no per-iteration data. It holds
    4000 per-iteration values in iteration order, and BATCH-015's own code had
    already used them. One command would have settled it. The pattern is now
    established beyond doubt: I assert facts about the archive from memory of
    summaries instead of opening files, and downstream agents keep catching it.
    (2) W-4 IS THE BLOCKING FINDING AND IT IS EXACTLY THE RIGHT SHAPE: not an
    argument that the floor is wrong, but a measurement showing the floor
    member's own prediction runs opposite to the data, with all terciles pushed
    through the identical instrument so leverage and edge effects cancel.
    (3) W-3 RETIRES THE BATCH'S PREMISE ENTIRELY, and the red team said so rather
    than answering the question it was given.
    (4) THE EXHAUSTION RULING REFUSED THE TIDY ANSWER. I offered "exhausted" and
    it declined for the lane while identifying a genuinely exhausted sub-lane
    with a better obstruction. That is the closure standard working in both
    directions.
    (5) W-5 IS WHY THIS IS `revise` AND NOT SOMETHING WORSE: the conclusion
    survives, so nothing downstream that relied on "ANOM-5 is not an effect"
    needs to move.

  hypothesis_status_changes: []
  hypothesis_status_note: >-
    No hypothesis moves. Withdrawing a mechanism for a non-effect changes nothing
    about the subject matter.

  rule_12_status: >-
    UNMET AND UNWAIVED. Nothing here changes EV-MLKEM-011, EV-MLKEM-013 or
    EV-MLKEM-017; KN-FIND-031 stays withdrawn.

  binding_instructions_updated:
    - >-
      All existing bindings stand.
      NEW AND BLUNT: before asserting that the archive lacks something, OPEN THE
      DIRECTORY. Six premises in this goal have been falsified downstream and at
      least three were one shell command from being checked. Any future handoff
      that asserts an absence must name the command that established it.
    - >-
      NEW: a minimum over a family is not the expected value of the statistic.
      When a bound is used as a reference point, that promotion is a separate
      claim and needs its own check.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      `revise` on `preliminary` evidence fails the gate outright. The batch's
      transferable content -- that promoting a family minimum to a reference
      point is a distinct and checkable claim, and that the check is to test the
      minimising member's own prediction against the data -- is genuinely
      reusable, but it has one adversarial pass, no validation, and it corrects a
      record that was itself correcting a record. Promoting it now would be the
      third instance of the error CORR-20260802-d8ba0e documents.
    promote: false

  non_claims:
    - ML-KEM is not broken.
    - KN-OPEN-016 remains open.
    - >-
      Nothing here says the archived data is defective. W-4 rejects a MODEL of
      the data, not the data.
    - >-
      No mechanism for the low-occupancy deficit is offered, and none should be
      inferred from the floor's rejection.
    - No asymptotic claim advanced. No closure quorum asserted.

  next_actions:
    - >-
      BATCH-017, zero new sampling: execute the red team's own cheapest check,
      which it specified precisely enough to run without further design. Refit
      the archived degree-5 model on scores 551-851 of the n=43 file, keep the
      301 per-cell terms t_T = (D_T - mu_T)^2 / (mu_T (1 - h_T)) instead of only
      their mean, regress them on mu_T/4000, and calibrate with the producer's
      own N1 and N2 generators. Twelve seconds of pure Python, all inputs already
      archived. It settles whether the low-occupancy deficit is structural, and
      it is the move that makes the remaining mid-band lane worth continuing or
      not. Require an independent validation in the same batch, since BATCH-015
      went to ledger on one investigation and one validation and this batch is
      the correction.

