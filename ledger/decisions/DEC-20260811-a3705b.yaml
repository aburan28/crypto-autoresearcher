  rationale:
    passing_design: >-
      RT-OBJ2 (asymmetric shard parallelism) is now genuinely and fully
      closed: both independent reviews confirm shard_sets.rho and
      shard_sets.bsgs are symmetrically widened from five to eight shards,
      matching the candidate path and budget.maximum_parallel_shards: 8, and
      that this equalization has independently verified zero side effect on
      any group-addition, logical-traffic, archive, communication, output,
      CPU-hour, or wall-second figure in the document. RT-OBJ1's original
      defect (no derivation, no bound, no overflow-invalidation rule for
      candidate_index occupancy) is also genuinely closed: a correct,
      independently-reproducing worst-case bound (8*(L(bits)-1), exact at
      all five ladder sizes) and a correct overflow-invalidation rule
      (independently confirmed symmetric with the pre-existing output-byte
      overflow rule) now exist where none did before. This is real,
      independently-verified progress: the frontier narrows from four
      blocking findings to three disclosed residuals, and RT-OBJ1's
      remaining residual now rests on a concrete conditional bound rather
      than an unbounded, unguarded field. The two Validator-origin findings
      (archive/communication byte charging, output-manifest disclosure) are
      also genuinely fixed on disclosure: neither reviewer found any
      silently-uncharged byte or undisclosed file swap surviving in this
      successor, and every disclosed over-cap figure independently
      reproduces exactly under both reviews.
    blocking_design: >-
      RT-OBJ1 is NOT closed as DEC-20260809-e35473 required. The producer's
      own disclosed DERIV-1 heuristic margin (~16,644x at bits=18 rising to
      ~4,198,404x at bits=30) was independently found by the Red Team to be
      miscalibrated by two to three orders of magnitude against
      H-SYC-b854f4's own already-adopted, numbered heuristic HA-2 for the
      identical quantity: recomputed directly from HA-2 at the hypothesis's
      own decision-changing threshold (gamma_x>5/18), the margin is only
      64x-101.6x, and at the hypothesis's own theoretical ceiling
      (gamma_x<=1/3) the margin is a constant, non-growing 32.0x at every
      tested size -- razor-thin, and never computed or disclosed by the
      producer. This is not a defect in the disclosed arithmetic (all of
      which independently reproduces correctly); it is that the disclosed
      confidence figure was calibrated against an internally-inconsistent
      reference point rather than the hypothesis's own model, so "32 remains
      adequate" is not adequately supported as disclosed. Two further,
      non-overlapping defects survive: the Validator found one arithmetic
      literal error in the DERIV-1 table at bits=27 (isolated,
      non-consequential to the qualitative conclusion, since the row's own
      margin_vs_32 field is consistent with the correct value); the Red Team
      found the 5-to-8-way shard widening's claim of "provably zero effect
      on every figure" omits peak_live_bytes, the one non-additive
      comparison axis not actually checked, with a plausible ~8/5x increase
      in BSGS's concurrently-live baby-table memory left undisclosed
      (moderate, non-blocking to this batch's static-review admissibility
      since no live number is asserted or contradicted, but blocking to
      accepting the "every figure" claim as written). The two
      Validator-origin capacity-fit residuals (archive/communication bytes
      over their unchanged hard caps by 3256009664/3285369792 bytes; output
      budget over its unchanged cap by 7132160 bytes) remain open exactly as
      the producer itself discloses -- an infrastructure/budget-adequacy
      finding about caps inherited unchanged across two successor
      generations from a one-mount-state predecessor design, not a
      mathematical result about H-SYC-b854f4, and not this batch's authority
      to resolve. Finally, the Red Team found the task card's explicit
      instruction to note RT-OBJ3/RT-OBJ4 as deferred, not dropped, was not
      fulfilled in any of the five producer artifacts (advisory).
    authorization:
      implementation_granted: false
      execution_granted: false
      budget_increase_granted: false
      reason: >-
        Both mandatory independent pre-implementation reviews returned
        REVISE. Per this exact batch's own dispatch constraint ("Any REVISE
        or REJECT blocks implementation") and the identical precedent
        DEC-20260809-e35473 itself set for the predecessor batch, any single
        REVISE or REJECT blocks implementation regardless of how the
        individual findings compare or overlap; dual REVISE doubly confirms
        that rule rather than weakening it.

  experiment_disposition:
    status: review_required
    action: preserve_pending_further_versioned_static_repair
    experiment_runs: 0
    implementation_exists: false

  next_actions:
    - >-
      Open one further versioned static successor to EXP-SYC-12de89 (not an
      Executor or implementation task) that: (a) recomputes the
      candidate_index margin using H-SYC-b854f4's own already-adopted HA-2
      heuristic directly (E[X]=N^(-1/3+gamma_x+o(1)), not DERIV-1's
      uncalibrated generic "1/N" substitute) at the hypothesis's own
      decision threshold (gamma_x=5/18) and theoretical ceiling
      (gamma_x=1/3), states the exact correspondence between H-SYC-b854f4's
      per-root X and the compiler's per-(curve,root,model,eta)-tuple
      candidate_index occupancy explicitly, and either shows adequacy still
      holds at those recomputed margins or raises the candidate_index cap
      (closes Red Team OBJ1); (b) adds a peak_live_bytes accounting for the
      widened 8-way BSGS baseline -- either an analytic shard-invariance
      derivation or an explicit disclosure parallel to the existing
      wall-axis treatment (closes Red Team OBJ2); (c) fixes the bits=27
      DERIV-1 expected_occupancy literal (closes the Validator's isolated
      arithmetic defect); (d) explicitly and visibly notes RT-OBJ3
      (crossover-N estimate) and RT-OBJ4 (k-list/generalized-birthday
      baseline) as deferred, not dropped, per this batch's own scope (closes
      Red Team OBJ3); and (e) either proposes a scoped resolution for the
      archive/communication/output capacity-fit residuals that fits within
      unchanged hard caps, or explicitly carries them forward again as
      disclosed, quantified residuals rather than silently dropping them.
      This is itself a further static repair task -- zero-run, no
      implementation or execution authority -- matching this batch's own
      claim ceiling. Obtain fresh independent Validator and Red Team review
      of that successor before any Coordinator decision considers a
      maximum-runs-zero implementation batch. The standing hold from
      DEC-20260809-e35473 (no implementation, execution, run, or ECDLP
      claim) is carried forward unchanged and not weakened.

