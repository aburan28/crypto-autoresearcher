  citation_boundary:
    status: RETAINED IN FULL, VERBATIM, AND NOT LIFTED BY THIS DECISION.
    retained_verbatim: >-
      The `P=512` crossover value and its `w=2^80` sign are **NOT
      citation-eligible**. This task does not lift that prohibition. Only a
      committed Coordinator decision on independently reviewed evidence can lift
      it.
    predicate_extension_retained_verbatim: >-
      In addition to the retained sentence, a row of any EXP-WESOVOW-001
      reconciliation is NOT citation-eligible when either (a) the two anchors
      disagree in the SIGN of the baseline comparison at that row, or (b) the
      smaller |margin| across the two anchors at that row is below that field
      size's anchor gap |Delta log2 T_full + Delta log2 M / 2|.
    did_either_fire_in_this_round: >-
      No. No task of this batch computed a crossover, a T_DG baseline comparison,
      a margin or a speedup. Both reviewers applied both limbs to their own
      artifacts and to the package and reported no hit; the Validator additionally
      scanned all six producer artifacts for the prohibited tokens and found every
      occurrence to be inside the verbatim prohibition text or inside reasoning
      about it, and deliberately did not read the crossover, van_oorschot_wiener
      or baseline_log2TDG key paths of either run package.
    why_this_decision_declines_to_lift: >-
      THOUGHT ABOUT, AND DECLINED, AND THE REASONING IS THE POINT. This decision
      COULD lift it - it is the committed Coordinator decision on independently
      reviewed evidence that the prohibition names as the only instrument that
      can. It does not, because RC-1 verified a TRANSCRIPTION and the prohibition
      is about a CROSSOVER and a SIGN. Every ground DEC-20260904-166ab5 gave for
      refusing the lift survives this round untouched: one anchor is still not a
      point of this model at three of five field sizes (RC-2 confirms it rather
      than resolving it); the resolving power at the scale that decides the sign
      is still unestablished for the RECONCILIATION procedure, since VC-2 measured
      the LITERAL-COMPARISON procedure instead (RC-4 remains undischarged); the
      overhead c is still a free scenario knob rather than a measurement; and both
      runs' execution provenance is still unattested with dirty_tree: true on both
      manifests (RC-7 undispatched). What has changed is that the cheapest BENIGN
      explanation of the divergence is now eliminated, which makes the remaining
      two worlds MORE in need of evidence, not less - the Red Team's own
      recommendation, marked by it as a recommendation and not a decision, is
      RETAIN unchanged, and this decision reaches the same place independently. A
      transcription-faithfulness result must not be laundered into "the anchors
      are reconciled".
    machine_flag_status_restated: >-
      BATCH-256a94's anchor_reconciliation.json per-row `citation_prohibited` flag
      is scoped by field size and is KNOWN TO UNDER-REPORT: at least two rows
      carrying `citation_prohibited: false`, at log2 p = 256, fall under the
      predicate. That artifact is snapshot-bound, immutable, and MUST NOT be
      edited. Every consumer applies DEC-20260904-166ab5, and now this decision,
      on top of it. This round produced no successor to that artifact and did not
      repair the flag.

  procedure_deviations:
    - id: PD-1
      what: >-
        THE BLIND PHASE WAS CONTAMINATED BEFORE IT BEGAN AND THE CONTAMINATION WAS
        REPAIRED BY RE-SITING THE TASK, NOT BY RE-DECLARING THE RULE. Commit
        6eacc1fdf's message stated all ten values, the composed verdict and the
        once-only finding; f8c09984e reverted the files and quoted the subject
        verbatim in its own subject.
      raised_by: >-
        validator, TASK-20260904-82665d finding F-9, which interrupted its own
        review to send a pointer to the main session rather than hold a live
        hazard until its report was finished; the orchestrating session then
        verified the leak itself before recording CORR-20260905-547849.
      coordinator_ruling: >-
        Recorded as a deviation and as the round's most transferable process
        finding. The review plan's procedure_deviations was empty and the
        blind_phase_hygiene rule was true as written; it enumerated FILES and was
        defeated by something that is not a file. The mitigation - a detached
        worktree at origin/main whose 200-commit reachable history was inspected
        before dispatch - restores blindness BY CONSTRUCTION, which is the
        standard the rule's own `why` sets, and the Red Team's attestation is
        consistent with it. It is nonetheless HAND-VERIFIED and weaker than a
        checked guarantee, and it cost the Red Team its snapshot-receipt binding
        (OBJ-6), because the archives directory does not exist at origin/main.
        Standing rulings for successors: a blind task is given a WORKING TREE, not
        a rule; a summary commit message in a batch with a blind phase carries
        LOCATORS under the same PD-2 rule the control-plane files follow; and
        history is not rewritten to repair a disclosure defect.
    - id: PD-2
      what: >-
        tools/check_review_independence.py WAS NOT RUN FOR THIS ROUND and its
        result is recorded as OUTSTANDING rather than as a pass.
      reason: >-
        Two independent reasons, both recorded rather than one being used to hide
        the other. (a) No `review_plan` file exists in the form the checker
        requires for this batch - the plan lives as a `review_plan` BLOCK inside
        TASK-20260904-d66403/task_card.yaml, which is the same shape the earlier
        BATCH-a1c262 round hit; the batch's CF-5 fix addressed the REPORT format
        (.yaml with a top-level review_attestation, which both reports duly
        carry), not the plan-file discovery. (b) This composing task holds
        Read/Grep/Glob/Write/Edit and NO SHELL, so it could not have run the
        checker in any case.
      coordinator_ruling: >-
        Not reported as passed, and not worked around. Blindness for this round is
        therefore verified by hand - both reports read in full, both attestations
        read, the mitigation of PD-1 relied on - which is weaker than the tool,
        exactly as DEC-20260904-166ab5 PD-6 requires such a substitution to be
        recorded. The checker also could not have seen PD-1's leak even had it
        run, since `git log` is not a file read. Two concrete successors are named
        in next_actions: give the checker a plan-file shape it can resolve, and
        extend it to inspect the reachable commit-message history of the tree a
        blind agent is handed.
    - id: PD-3
      what: >-
        tools/validate_ledger.py WAS NOT RUN BY THIS TASK, and neither was
        tools/allocate_id.py --check, git fetch/merge, the push, or the PR.
      reason: >-
        This composing task holds no shell. Recorded as OUTSTANDING in
        coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/archives/TASK-20260904-cb8d1d/ledger_commit_receipt.json,
        which names each command the committing session must run before this
        decision is durable. The orchestrating session reports 12 pre-existing
        validation errors on `main` originating in other sessions' commits and not
        in this branch; that figure is RECORDED AS REPORTED BY THAT SESSION and is
        not a measurement of this task, which ran nothing.
      coordinator_ruling: >-
        No gate is reported as passed that was not run. The two reserved
        identifiers were checked by DIRECT SEARCH only - no file
        ledger/evidence/EV-SSI-7a3e91.yaml or
        ledger/decisions/DEC-20260904-4c81b6.yaml existed before this task, and
        the tokens `7a3e91` and `4c81b6` occur under ledger/ only in
