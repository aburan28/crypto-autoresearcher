    anchor-reachability control no committed artifact previously provided,
    recomputes bit-exactly and returns `off_curve` at log2 p in {256, 384, 512}
    and `reachable` at {576, 768}. This decision accepts that evidence record,
    fixes what it does and does not license, retains the citation prohibition,
    carries every undispatched item forward, and makes no transition of any kind.
