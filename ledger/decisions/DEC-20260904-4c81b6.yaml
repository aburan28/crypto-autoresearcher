  prior_versus_outcome:
    where_the_prior_is_recorded: >-
      coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/tasks/TASK-20260904-d66403/task_card.yaml,
      review_plan.coordinator_prior, written before any task of the batch ran and
      by a Coordinator that deliberately did not read Section 4.1. Six numbered
      commitments; two are overturned, one is overturned in its specific
      mechanism, and one names its prediction by reference to an immutable record
      rather than by value.
    element_by_element:
      - element: >-
          (1) "I expect the composed verdict to be `literals_faithful`, at
          perhaps half my belief."
        outcome: HELD.
        detail: >-
          10 faithful, 0 mis_transcribed, 0 undetermined; clause (2) of the
          pre-registered rule fires; the Validator recomputed the composition by
          hand and via the producer's own `compose()`, and the Red Team's blind
          extraction agrees value by value. Concurrence with a prior that was
          recorded in advance, which is the only reason this line is worth
          anything.
      - element: >-
          (2) "roughly a third of my belief to `undetermined`, on a specific and
          checkable ground: memory in bytes, or a different entry convention, or a
          formula to evaluate rather than a tabulated number."
        outcome: OVERTURNED, AND OVERTURNED ON ITS OWN NAMED MECHANISM.
        detail: >-
          The ground was checkable and both reviewers checked it independently
          against the document rather than against the producer. Bytes: the tokens
          `byte`, `bytes`, `word`, `cell` occur zero times in the 350-line file.
          Entry convention: the paper's own lines 169/185 fix an entry as one
          isogeny keyed by its codomain, which is specification.yaml's
          unit_of_memory. Formula: the paper PRINTS the number, so nothing is
          evaluated. The prior's own escape hatch closed, and the memory column is
          `direct` (Red Team: `direct_after_in_section_unit_chain`, weaker in
          exactly one respect and explicitly not `undetermined`).
      - element: >-
          (3) "the remainder to `literals_mis_transcribed`, and I name where I
          would look first WITHOUT naming it: the field size carrying the
          largest-magnitude delta in EV-SSI-5d954c."
        outcome: >-
          REFERENCE RESOLVED, AND THE PREDICTION DID NOT PAY OUT.
        detail: >-
          Resolving the reference against the immutable record: EV-SSI-5d954c
          observation 7 records five paper-minus-attained-minimum deltas whose
          magnitudes rank 256 largest, then 512, then 768, then 576, then 384. The
          prior therefore pointed at log2 p = 256. No mis-transcription exists
          there or anywhere: both reviewers independently report a signed
          difference of exactly 0.0 at all ten values, and the Red Team's blind
          extraction returns `agree` at both 256 entries. The "look here first"
          heuristic - large-magnitude delta as a typo tell - is spent for this
          object and should not be reused on it.
      - element: >-
          (4) "On RC-2 I expect `off_curve` at three field sizes and `reachable`
          at two, reproducing EV-SSI-5d954c's recorded pattern; a DISAGREEMENT
          would be the most informative thing RC-2 can produce."
        outcome: HELD, BIT-EXACTLY, AND THE INFORMATIVE OUTCOME DID NOT OCCUR.
        detail: >-
          Three `off_curve` at {256, 384, 512}, two `reachable` at {576, 768};
          the Validator recomputed all five rows in its own script from
          RUN-WESOVOW-001/raw-result.json per_field optima and the cost_model.py
          literals it read itself, and reproduced every digit of the five signed
          differences. Two computations of the same committed numbers agreed, so
          RC-2 bought a control that did not previously exist rather than a
          discrepancy.
      - element: >-
          (5) "I expect the controls to be the weak point again ... a VC-2 that
          reports resolution no tighter than 0.5 bits confirms it."
        outcome: HALF OVERTURNED - RIGHT CATEGORY, WRONG MECHANISM, WRONG NUMBER.
        detail: >-
          The numeric prediction failed: VC-2 measured the literal-comparison
          procedure's resolution at 0.05-0.1 bits, an order of magnitude tighter
          than predicted and tight enough for the 0.18-3.22-bit scale this
          campaign cares about, and the producer said so plainly. But the category
          held in a shape the prior did not anticipate: the weakness is not a
          blunt decoy, it is disclosure - F-3, the entailment set incomplete by
          exactly the item advanced as non-entailed; F-4 and F-5, two undisclosed
          blind spots; F-6, a branch never exercised. A prior that predicted the
          right area for the wrong reason is worth recording as such.
      - element: >-
          (6) "I expect the Red Team's blind re-transcription to AGREE on any
          `direct` value, and the informative disagreement, if there is one, to be
          about FORM rather than digits."
        outcome: HELD ON AGREEMENT; THE FORM AXIS APPEARED, BUT NOT AS A DISAGREEMENT.
        detail: >-
          Agreement is total on digits. The form question the prior anticipated
          did surface and is the round's most substantive content - but as a
          finding both sides make against the instrument (producer NS-2, Red Team
          OBJ-2, Validator F-10), not as a disagreement between the two agents,
          who reached the same comparability judgement by different routes. The
          prior located the right axis and mis-predicted where the tension would
          sit.
    what_this_comparison_is_worth: >-
      Two of six elements are overturned and a third is overturned in its
      mechanism, which is the only reason the four that held are reportable at
      all: "the reviews concurred" and "the reviews concurred with what the
      Coordinator already believed" are different findings and only a
      pre-recorded prior separates them. The prior was recorded by a Coordinator
      that had not read Section 4.1 and did not read it before composing this
      decision either.

  rationale:
    - >-
      THE TWO REVIEWS AGREE, AND THE AGREEMENT IS INFORMATIVE BECAUSE THE SECOND
      WAS BLIND - AND FOR NO OTHER REASON. The Red Team re-derived the five pairs
      from the paper alone, located Section 4.1 itself, wrote and hashed its Phase
      A block, and only then opened cost_model.py. That is the one check
      validation cannot perform: recomputing from the producer's artifacts
      reproduces a wrong-but-self-consistent implementation faithfully, and its
      own OBJ-3 exhibits precisely such an implementation - a containment-style
      locator check, which is what VC-0 literally specifies, returns PRESENT for a
      claimed time column that is the Delfs-Galbraith baseline printed in the same
      five lines. THIS IS A GENUINE INDEPENDENT REPLICATION OF A TRANSCRIPTION AND
      OF NOTHING ELSE. It says nothing about whether the paper's numbers are
      right, whether this cost model reproduces them, or what any divergence
      means. EV-SSI-7a3e91 is recorded at claim tier `toy`, certificate kind
      `none`, direction `neutral`, with `replicated` claimed for the transcription
      measurement alone and scoped in its own strength_note.
    - >-
      NEITHER REVIEW IS MODEL-INDEPENDENT, AND FOR A TRANSCRIPTION TASK THAT IS A
      REAL WEAKNESS RATHER THAN A DISCLAIMER. The Validator records it as its
      FIRST limitation: the harness resolves every policy alias to one backend, so
      its judgement and the producer's are correlated in a way no attestation can
      remove, and "agreement between us is weaker evidence than it looks". Both
      reviewers self-report the same model and neither is probe-verified; the
      producer's DIV-1 records that no backend probe-verifies here; the goal's
      IMP-1 records that only the `local` backend resolves. A shared misreading -
      a mis-parsed glyph, a systematically preferred slot on a line that carries
      two time figures, a shared assumption about which figure is "the" figure -
      is exactly the error two instances of one model can make identically, and
      OBJ-3 shows that such a slot ambiguity genuinely exists on these five lines.
      What the round bought is corroboration by two independent METHODS in two
      independent SESSIONS. It may never be presented as agreement between
      distinct models.
    - >-
      BLINDNESS WAS BROKEN AND THEN REPAIRED BY CONSTRUCTION, AND THE REPAIR IS
      HAND-VERIFIED. CORR-20260905-547849 records it and the Validator found it
      independently as F-9: commit 6eacc1fdf's MESSAGE states all ten values, the
      composed verdict and the once-only finding; its subject survives verbatim
      inside the reverting commit f8c09984e's subject, so `git log --oneline`
      displayed the composed verdict twice on the branch the blind task was to
      have run in. Git reverted the files; a commit message cannot be reverted.
      The plan's `blind_from` is a list of FILES and no declared checker could
      have enforced it against a `git log`. The mitigation changed the object
      rather than the rule: TASK-20260904-c8675d ran in a detached worktree at
      origin/main (a773ebc3e2ba8706bda99eb5277229019c7b6eaf), verified before
      dispatch to carry zero statements of the verdict across 200 commits of
      reachable history, and its attestation is consistent with that. SAID
      PLAINLY, AS THE GATE REQUIRES: blindness in this round is HAND-VERIFIED and
      is therefore WEAKER THAN A CHECKED GUARANTEE. It rests on the orchestrating
      session's inspection of the tree it handed over and on the reviewer's own
      attestation, and on no tool. The mitigation also cost something and the cost
      is recorded: at origin/main the batch's `archives/` directory does not
      exist, so the Red Team could not bind the bytes it reviewed to the snapshot
      receipt (OBJ-6).
    - >-
      THE ROUND ELIMINATES ONE WORLD OF THREE AND THE RECORD SAYS SO IN THE
      NARROWEST FORM (OBJ-5). A transcription defect is out. A defect or
      difference in the cost model, and a genuine external disagreement between
      the paper and this model, are untouched - they produce identical committed
      symptoms and separating them needs work nobody has done. And the batch's own
      gloss on `literals_faithful` was too narrow: the producer's NS-2 exhibits a
      third branch, a CATEGORY defect, in which the divergence is neither a
      transcription defect nor a model defect but a quantity the source states as
      a lower bound, from an explicitly rough underestimation, consumed by a
      two-sided point test. F-12 warns that the gloss travels with a verdict while
      a `what_this_does_not_settle` entry does not; NS-2 is therefore restated
      inside EV-SSI-7a3e91 and inside this decision, and it scopes what the
      successor amendment must say.
    - >-
      OBJ-1 IS THE SHARPEST ITEM IN EITHER REVIEW AND IT IS A LIVE CODE PATH.
      cost_model.py:309-313 emits `log2bytes_64B_per_entry` = log2M + 6.0 and
      `log2bytes_256B_per_entry` = log2M + 8.0 into the SAME per_field record as
      `paper_pair`, whose `log2memory` at line 302 carries no unit annotation,
      while MEMORY_BUDGETS at line 67 IS annotated "entries". The one memory
      quantity compared against the paper is the one with no declared unit, and a
      differently-united sibling sits three keys away in the same serialized
      record; a consumer reaching for the wrong key reproduces the round's UNIT
      OBJECT decoy exactly, with a clean +6.0-bit error and no symptom. The Red
      Team raised it from the code alone and states that it did NOT check whether
      any downstream artifact actually made the error, because the run directories
      and the reconciliation artifacts are in its blind_from. IT IS CARRIED
      FORWARD AS A NAMED NEXT ACTION AND IS NOT FIXED HERE: cost_model.py is
      frozen, and a change to it - even a comment - is a separate authorization
      and a supersede-not-overwrite question.
    - >-
      OBJ-2 CORRECTS A FRAMING THIS PROGRAM HAD BEEN USING, INCLUDING IN COMMITTED
      COMMIT MESSAGES OF THIS BATCH'S WORKING BRANCH, AND THE CORRECTION IS
      RECORDED IN THE RED TEAM'S NARROWER FORM. The broad framing was that
      applying a two-sided `abs(dev) <= 0.75` test to the paper's one-sided `>=`
      figures is itself the defect. That is broader than the evidence supports.
      For control C1's own declared purpose the two-sided test is CORRECT: C1 is
      declared an INSTRUMENT SANITY GATE and a model-reproduction check
      (specification.yaml:47-52, 134-141), its target is the paper's ARITHMETIC,
      and a reimplementation landing above the paper's figure is as suspect as one
      landing below. The paper's `>=` attaches to the interpretation of that
      arithmetic as an attack cost, not to the arithmetic itself. The defensible
      objection is the narrower one: the SERIALIZED `paper_pair` values at line
      302 escape the file carrying neither the relation nor the unit, into records
      whose readers must re-derive both from a paper outside most read_scopes in
      this campaign - and DEC-20260904-166ab5:178 records that the C1 tolerance is
      exceeded at every field size, so those figures are in fact being read as
      signed anchors somewhere. That is what the successor amendment addresses.
    - >-
      THE PACKAGE IS ACCEPTED WITH ITS DEFECTS RECORDED RATHER THAN REPAIRED.
      Twelve Validator findings, none overturning a verdict, all real. Two are
      completion-gate misses on the producer: F-2, the GATING artifact omits the
      citation prohibition and its predicate extension entirely and states nowhere
      whether either fired (the Validator independently confirmed nothing
      prohibited escaped, so the defect is procedural); and F-6, RC-2's third
      branch was reported empty rather than exercised (the emptiness is a true
      report - all five key paths exist - and the Validator fired the branch
      itself). Neither is repaired: the artifacts are immutable and snapshot-bound
      and a correction supersedes. F-3 is the one to carry into successor cards -
      a control whose firing condition was asserted from a plausible mental model
      rather than read out of the instrument is this program's recurring defect
      class, and it was found here on the item the package advanced as its
      non-entailed content.
    - >-
      NOTHING TRANSITIONS. No hypothesis exists in scope; EXP-WESOVOW-001 remains
      `approved` and untouched and is NOT amended by this decision, because RC-1
      verified the literals and what to do about the COMPARISON is a separate
      decision resting on evidence nobody has produced; GOAL-SSI-001 remains
      `active` with exactly one next action, since goals are never paused
      (CLAUDE.md rule 10) and the round met no completion criterion and approached
      none.

