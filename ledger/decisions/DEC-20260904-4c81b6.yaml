      `strong` evidence. This decision is `revise`, so the rule does not fire on
      its face - but the honest reason is stronger than the mechanical one and is
      recorded instead of it. EV-SSI-7a3e91 IS `replicated`, and precisely one
      thing is replicated: that ten decimal literals in one committed file equal
      ten decimal literals in one committed document at fixed locators. That is a
      fact about this repository's own bookkeeping at one commit, not a durable
      finding about isogenies, about cost models, or about anything a later
      campaign could reuse; a knowledge/findings/ entry saying "our transcription
      of a paper's table is correct" would present housekeeping as a result and
      would carry into the corpus a claim whose own load-bearing limitation
      (OBJ-4: the freeze is unverified against any published source) it cannot
      discharge. The round's genuinely transferable content - the commit-message
