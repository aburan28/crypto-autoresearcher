  id: DEC-20260904-4c81b6
  id_note: >-
    The identifier's date segment is 2026-09-04, the day it was RESERVED in
    BATCH-dc1424's batch.yaml and dispatch_queue.json; the decision was composed
    and decided on 2026-09-05, which `decided_at` records. Identifiers are
    immutable and are not renamed to match a later date, and this one is bound by
    the queue's archive.record_ids and by the ledger-archive handoff. Chronology
    is read from `decided_at`, never from the token.
  context: >-
    Composing the BATCH-dc1424 RC-1 round on GOAL-SSI-001: one producer
    (TASK-20260904-d66403, six artifacts, snapshot-archived alone at commit
    98e3945a596b02f038529ca905769d6450da3aa9 before either reviewer read a byte),
    one Validator (TASK-20260904-82665d, joints J1-J4, verdict `passed`, four
    joints CONFIRMED WITH CAVEAT, twelve findings), and one Red Team
    (TASK-20260904-c8675d, joint J5 plus the proves-too-much control and the
    blind re-derivation, verdict `holds` on digits, units, order and keying).
    RC-1 asked which of three worlds the committed fitted_opt / PAPER_PAIRS
