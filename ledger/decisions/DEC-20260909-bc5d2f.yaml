  id: DEC-20260909-bc5d2f
  decision: approve
  decided_by: coordinator
  decided_at: '2026-09-09T07:10:18.249957+00:00'
  target_ids:
  - EXP-ECDLP-709063
  - TASK-20260909-85c2fe
  - TASK-20260909-ff426d
  context: Correct independently reproduced decoder type coercion without changing BSGS/rho mathematics or
    storage.
  rationale:
  - Archived review caa52784117983cf519305b57ab4316fbf5457fe reproduces three invalid raw-input acceptances
    at the public decoder API. All other named kernel,storage,charging and custody controls held in the final125of128case
    suite.
  - Rejecting invalid carrier types before conversion directly implements the existing representation boundary.
    It is ranked ahead of additional proposals because it removes the one reported component blocker.
  - Standing authorization covers this bounded source correction and subsequent fresh review; no scientific
    or full-runner admission follows.
  accepted_findings:
  - id: DECODER-TYPE-1
    kind: bytes_constructor_scalar_alias_across_all_public_decoders
    affected_source:
      path: experiments/EXP-ECDLP-709063/implementation/TASK-20260908-7771f2/table.py
      sha256: 078256c8abd57dc2442f89bc8e889838314c314358fad9f2a7a6621ead529705
      lines:
      - 115-120 decode_logical_point
      - 132-140 decode_hash_preimage
      - 150-155 decode_physical_slot
    contract_fields:
    - protocol_amendment.portable_fixed_physical_table.representation_domains
    - protocol_amendment.stage_accounting_and_memory_conformance.typed_encodings
    - review_plan.joints[0].attack_plan
    - review_plan.proves_too_much
    worked_counterexamples:
    - decode_logical_point(9) executes bytes(9), obtains nine zero bytes and returns LogicalPoint(tag=0,x=0,y=0),
      although 9 is outside the declared bytes/bytearray/memoryview input domain.
    - decode_hash_preimage(True) executes bytes(True), obtains the single zero byte and returns logical O,
      so a bool is accepted across the hash-preimage boundary.
    - decode_physical_slot(16) executes bytes(16), obtains sixteen zero bytes and returns a physical empty
      slot, although the caller supplied an integer rather than physical bytes.
    failure_signature: Three invalid representations crossed an explicit decoder boundary and were accepted
      as canonical O/empty encodings. This is exactly a proves-too-much failure for the component conformance
      claim.
    scope: The defect is in the public decoder API. Internal table reads currently pass memoryview slices,
      so these counterexamples do not show an incorrect BSGS solution or a scientific result.
    correction_required: Add an explicit runtime bytes-like type check before bytes(raw) in all three decoders,
      retain the exact malformed-scalar controls, snapshot a prospective corrected source package and commission
      a fresh independent component review. This report does not edit or approve that correction.
  approved_correction_boundaries:
  - Copy the eight-file package at d8f64d928c8f6a28eed97eac70b741ad3232fbd5 into the new task path. Preserve
    bsgs.py and rho-corrected.py byte-identically and preserve every table layout,capacity,hash,probe,encoding
    and solver/charge convention.
  - Correct only the three decoder raw-input boundaries in table.py and necessary tests/metadata. Before bytes
    conversion, accept only the declared built-in bytes,bytearray,memoryview carriers. Reject int,bool,str,lists,iterators
    and arbitrary __bytes__ objects without invoking their coercion. A private shared helper is allowed. Normalize
    invalid/released buffers to TableValidationError rather than inventing a valid zero encoding.
  - 'Check permitted byte length before copying a mutable buffer: logical9,physical16,hash1or9. For memoryview
    use its actual nbytes; do not mistake element count for byte count. Preserve valid bytes/bytearray/memoryview
    encodings and existing canonical field checks. No new representation domain or on-disk format is introduced.'
  - Retain all320 existing producer cases and add named independent-input controls for the three reported counterexamples,invalid/coercible
    types,accepted carrier types and wrong byte lengths. Preserve original case outcomes and original historical
    receipts. Final complete suite at most384cases; at most800TOTAL executions including failures/parameters/reruns,with
    a complete final suite reserved.10s/case1800aggregate executed-check wall/CPU,one worker2GiB.
  - No scientific curve/fixture,full rho solve,manifest,runtime/Docker/guard,key/signature/RUN or experiment
    pipeline. Fixed synthetic groups/encodings and source checks only. No independent-conformance or scientific
    conclusion from producer tests.
  - Retain complete OUTER exec responses/session IDs/terminal polls as artifacts plus nested commands,absoluteUTC,reservations,redirected
    logs,allcases and actualCPU/wall/RSS. Use -B/PYTHONDONTWRITEBYTECODE and absolute output paths. Set implementation_commit:null
    pending snapshot; record checkout base separately. Final report must describe actual outcomes and bind
    receipt without a hash cycle.
