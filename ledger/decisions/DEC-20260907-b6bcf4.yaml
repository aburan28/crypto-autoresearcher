coordinator_decision:
  id: DEC-20260907-b6bcf4
  id_allocation_provenance: >-
    Minted by this session with `python3 tools/allocate_id.py --next
    coordinator_decision --date 20260907`, which draws a random 6-hex token
    without scanning state, then confirmed with `python3 tools/allocate_id.py
    --check DEC-20260907-b6bcf4`: well-formed against the
    coordinator_decision pattern and 0 occurrences across 13008
    identifier-bearing paths. Nothing was allocated by grepping for a maximum.
  recorded_at: '2026-09-07'
  goal_id: GOAL-ECDLP-bbc21f
  question_id: RQ-ECDLP-78dbc5
  batch_id: BATCH-e9fd22
  task_id: TASK-20260907-9e7580

  context: >-
    CLOSE LANE BATCH-e9fd22 OF GOAL-ECDLP-bbc21f, with a committed checkpoint
    and a rerank. The lane opened on DEC-20260907-38e5ae, authored a wide
    v1-to-v2 amendment of EXP-ECDLP-6ac801, and had it GATED and REFUSED
    (`revise`) by a fresh Coordinator session that authored none of the
    artifacts (TASK-20260907-f65c6e, DEC-20260907-4e34c5), on three blocking
    contract defects all re-confirmed as still holding against the committed
    text. Concurrently another session's lane BATCH-8f3e86 got its own narrow
    a = 1/8 v1-to-v2 amendment of the SAME experiment approved and merged (PR
    #822), leaving one experiment identifier carrying two v1-to-v2 amendments
    under one amendment id. NO RUN EXECUTED IN THIS LANE. This decision closes
    a schedule, performs the compatibility read the lane's ledger archive
    declined to perform, reranks the goal's open work, and answers explicitly
    whether a completion criterion closes the goal. It creates no evidence
    record, approves no protocol, authorises no run, changes no hypothesis
    status, and reports no measurement.

  decision: synthesize

  decision_verb_note: >-
    `synthesize`: the substantive acts are a lane close, a portfolio rerank,
    and a published reading of two committed contracts against each other --
    which is what this verb covers (AGENTS.md: the Coordinator owns synthesis
    and roadmap reprioritization). It is deliberately NOT the following.
    Not `approve`: nothing is approved, and the successor v3 sits unauthored
    with its own fresh gate still owed. Not `revise`: that verb belongs to
    DEC-20260907-4e34c5 and is not restated or re-decided here. Not `reject`
    and not `pause`-on-no-route-remains: THE CLOSURE GATE IS NOT ENGAGED,
    because closing a LANE is a scheduling act and no research direction, lane
    or question is closed by it. No obstruction block appears below for that
    reason -- an obstruction block asserts a measured quantity bounding a
    route, and this decision asserts the opposite, that a route exists and is
    ranked first.

  target_ids:
    - GOAL-ECDLP-bbc21f
    - BATCH-e9fd22
    - EXP-ECDLP-6ac801
    - H-ECDLP-37dc01
    - RQ-ECDLP-78dbc5
    - PA-ECDLP-6ac801-v1-to-v2

  # =====================================================================
  # 1. THE COMPATIBILITY READ
  # =====================================================================
  compatibility_read:
    why_it_was_owed: >-
      TASK-20260907-ceb8cf recommended closing this lane and carrying its
      scope forward as a v2-to-v3 amendment on top of BATCH-8f3e86's approved
      v2, and named its own falsifying condition without testing it: if the
      approved v2's frozen `definitions` or `success_criterion` cannot
      additively host the wide scope, then this lane's draft is the better
      base and the identifier collision must instead be resolved by
      superseding one amendment under a NEW id. A recommendation whose
      falsifier is unrun is not a recommendation this decision may
      rubber-stamp.
    verdict: >-
      A v2-to-v3 AMENDMENT CAN CARRY THE WIDE SCOPE ADDITIVELY. The archive
      task's recommendation stands; its falsifying condition does NOT fire; no
      supersession under a new id is needed and none is performed.
    the_field_that_decides_it:
      field: 'experiments/EXP-ECDLP-6ac801/specification.v2.yaml invalidation_rules item 7'
      quoted: >-
        "Any post-hoc change to the a-grid, N, r, T_sel, or the G3-style
        feasibility criterion beyond what THIS versioned contract states:
        requires a further versioned protocol_amendment; runs already executed
        are never re-scored."
      why: >-
        It is the APPROVED CONTRACT'S OWN DECLARED CHANGE MECHANISM, and it
        names three of the four things the wide scope must move -- N (the
        second scale), T_sel (T/4 and T/8 for the DECAY-TSEL control), and the
        G3-style feasibility criterion (interval estimation with an UNRESOLVED
        verdict). A v2-to-v3 amendment is precisely the instrument the rule
        points at. Its one binding condition holds: the six executed runs
        RUN-ECDLP-6ac801-001..006 enter the wide scope as control (f)'s
        REFERENCE, never as its subject, so nothing already executed is
        re-scored.
    the_four_conditions_v3_must_meet:
      - id: COND-1
        field: 'definitions.N; independent_variables; inputs.stage_plan (Stage B); inputs.exact_basins; blind_rederivation.parameters'
        finding: >-
          N is frozen as a constant in five places ("fixed at 2^24 =
          16777216", "N: fixed, 2^24", "N = 2^24 only", "restricted to
          N = 2^24", "N = 2^24; ...; 5 seeds"). The second scale is
          nevertheless additive, because the approved v2 states NOTHING at
          N = 2^20: there is no value to contradict, only a blank to fill.
        requirement: >-
          Append a second arm declaring T = 64 and T_sel = 32 at N = 2^20,
          cited to experiments/EXP-ECDLP-612fb1/specification.v2.yaml line 223
          ("T: nominal table size N^{1/3} rounded, i.e. 64 at 2^20, 256 at
          2^24, 1024 at 2^30"), leaving every N = 2^24 field byte-identical.
          NOTE: this makes blocking defect D1 CHEAPER against the approved v2
          than against the refused draft -- against the draft it is a
          contradiction to repair (T = 102 vs the frozen 64), against the
          approved v2 it is a value to state.
      - id: COND-2
        field: 'success_criterion (S1 / S2 / S3) and metrics.primary'
        finding: >-
          THIS IS THE ONE PLACE A NAIVE PORT IS NOT ADDITIVE, and the defect
          is a LABEL COLLISION rather than a frozen conflict. The approved
          v2's S3 means DISAGREEMENT. The refused draft's S3 means CONFIRMED
          UNRESOLVED and its S4 means DISAGREEMENT. Adopting the draft's
          labels would make "S3" denote two different outcomes for one
          experiment identifier -- exactly the failure this experiment has
          already suffered once, at the amendment id.
        requirement: >-
          Keep S1, S2 and S3 with the approved v2's meanings verbatim and give
          the interval-routed outcome its own FRESH label. With that done the
          change is additive: a new verdict value plus a new criterion for the
          25-seed arm, with the approved ">= 4 of 5 seeds" rule preserved
          verbatim and applied to the seeds 1..5 subgroup, reported separately
          and never composited with the 25-seed reading.
      - id: COND-3
        field: 'controls (e) SEED-COUNT PARITY; definitions.seed; replication.seeds; replication.independent_instances'
        finding: >-
          THE SEED SET IS THE ONE WIDE-SCOPE ITEM invalidation_rules item 7
          DOES NOT NAME, so its authority to change comes from nowhere in that
          rule. It is instead frozen in four places, one of them a CONTROL
          with a stated rationale: "(e) SEED-COUNT PARITY: 5 seeds per a ... so
          this batch's statistical power is comparable, not thinner, than the
          batch that produced the original discrepancy." The rationale settles
          it -- 25 seeds satisfy "comparable, not thinner" a fortiori.
        requirement: >-
          Supersede control (e) by APPENDING a new control that quotes (e)
          verbatim, states that its purpose is met more strongly, and pins
          seeds 1..5 as the subgroup serving the reproduction control. Never
          edit (e)'s text. (Corroborating, not authoritative: the refused
          draft's own version of item 7 silently ADDS "the seed set" to the
          enumerated list, a tell that its author noticed the same omission.)
      - id: COND-4
        field: 'blind_rederivation (frozen: true) and its appended sub-key v2_rerequirement_a_1_8'
        finding: >-
          THE APPROVED v2 ANSWERS THE "DOES frozen: true CLOSE A BLOCK TO
          EXTENSION" QUESTION AGAINST ITSELF. It appended
          `v2_rerequirement_a_1_8` as a new sub-key INSIDE a block carrying
          `frozen: true`, and its own amendment's `not_changed` records the
          pattern: "blind_rederivation's own v1 fields (required, frozen,
          quantity, parameters, procedure, blind_from, comparison_rule,
          non_negotiable_note) -- verbatim; `v2_rerequirement_a_1_8` is a new,
          appended sub-key only". So in this program's practice `frozen: true`
          means the existing fields are byte-identical, not that no sub-key may
          be appended.
        requirement: >-
          v3 appends its own re-requirement sub-key and its extended
          `blind_from`; it may not touch the eight named v1 fields. It must
          also name ONE authoritative blind list and have the other reference
          it, per AO-3.
    not_an_obstacle_recorded_so_it_is_not_re_raised:
      budget: >-
        The wide scope needs maximum_runs 30 and 6 CPU-hours against the
        approved v2's 8 and 1. `enforcement: advisory` plus CLAUDE.md
        "Research budgets: progress first" make these revisable upward without
        further approval. `maximum_memory_gb: 8` and `maximum_workers: 1` are
        machine protection and v3 must NOT raise them.
    the_finding_that_strengthens_the_recommendation:
      id: CR-1a
      what: >-
        THE APPROVED v2 REPAIRED ONE DEFINITIONAL GAP AND LEFT A SECOND OF THE
        SAME CLASS IN PLACE. The strings `cap`, `CAP_MULT`, `cycle_mass` and
        `capped_mass` appear ZERO times in
        experiments/EXP-ECDLP-6ac801/specification.v2.yaml, so the
        cap = ceil(8*W) that decides which points belong to a basin at all is
        not derivable from the approved contract's text.
      why_it_matters: >-
        The approved v2 is `execution_authorized: true` and requires a freshly
        sealed Stage A' re-derivation of the a = 1/8 cell. A from-scratch
        re-deriver working from that contract alone must INVENT a cap
        convention -- the identical failure mode TASK-20260907-80e198's
        validator root-caused the original a = 1/8 disagreement to, relocated
        from the weight to the cap. So blocking defect D2 is live in the
        APPROVED v2, not only in the refused draft.
      what_is_NOT_claimed: >-
        NO MAGNITUDE AND NO DIRECTION. Whether a cap difference could change
        the a = 1/8 verdict is UNMEASURED by this decision and by the gate.
        The gate measured only the unassigned mass itself -- 4.67e-4 to
        2.09e-3 of N across the four a-cells of RUN-ECDLP-6ac801-001 -- and
        stated that the direction of any induced difference is unpredictable
        from the contract text. What is asserted here is the RISK OF A REPEAT
        OF A FAILURE CLASS, read off committed text. It is not evidence about
        G3 feasibility at any a, and it does not predict a verdict flip.
      one_asymmetry_worth_recording: >-
        The approved v2 is SILENT about the partition's exhaustiveness; the
        refused draft ASSERTS "sum over all d of b(d) = N", which is false of
        the object both readings compute. Silence is the lesser defect: a
        re-deriver taking the draft's stated identity as a self-check is
        actively misled, whereas one reading the approved v2 knows only that
        it must choose. D2 against the approved v2 is therefore a PURE
        ADDITION -- state cap = ceil(8*W) and the true relation
        sum_d b(d) = N - cycle_mass - capped_mass -- with nothing to retract.
    method_and_its_limits: >-
      A field-by-field read of the two live approved records
      (experiments/EXP-ECDLP-6ac801/specification.v2.yaml and
      amendments/v1_to_v2.yaml) against the refused draft's `definitions`,
      `controls`, `independent_variables`, `metrics`, `replication`, `budget`,
      `stopping_rules`, `invalidation_rules` and `success_criterion`. READ
      ONLY: no byte of either approved record was written; they are another
      lane's approved records. Every decisive field is quoted above precisely
      so a later reader can falsify this reading from the same committed text
      rather than trust it. See `procedure_deviations` PD-2: the read was
      performed by the same session that then acted on it.

  # =====================================================================
  # 2. THE IDENTIFIER COLLISION AND ITS DISPOSITION
  # =====================================================================
  identifier_collision_disposition:
    the_collision: >-
      One experiment identifier carries two v1-to-v2 amendments under the same
      amendment id PA-ECDLP-6ac801-v1-to-v2: BATCH-8f3e86's narrow a = 1/8
      re-seal, approved and frozen at
      experiments/EXP-ECDLP-6ac801/{amendments/v1_to_v2.yaml,specification.v2.yaml};
      and this lane's wide re-seal at `revision_required`, at the two
      `.BATCH-e9fd22-proposed.yaml` sidecars. No file was overwritten; the
      collision is in the identifier and it is real. Sequence:
      DEC-20260907-4e34c5 `procedure_deviations` PD-1.
    disposition: >-
      IT STANDS PERMANENTLY AS A DISCLOSED DEFECT. NEITHER RECORD IS RENAMED
      AND NEITHER IS SUPERSEDED.
    why_no_rename: >-
      AGENTS.md rule 15 forbids it. The identifier appears in the binding
      fields of TWO COMPLETED archives -- TASK-20260907-4ce154's
      `archive.record_ids` (commit 5856b36e8) and TASK-20260907-ceb8cf's
      ledger receipt `record_ids` (commit f996864d2). Those commits are
      immutable, so a rename would leave both archives' declared sets forever
      irreconcilable with the tree.
    why_no_superseding_record: >-
      Nothing needs one. The successor is a v2-to-v3 amendment under the NEW
      id PA-ECDLP-6ac801-v2-to-v3, which names the approved v1-to-v2 as its
      base explicitly. Neither colliding record has to change for that to
      work, and CR-1 establishes the additive route exists. A supersession
      would have been required only if the approved v2 could not host the wide
      scope; it can.
    what_a_later_reader_must_do: >-
      Cite PA-ECDLP-6ac801-v1-to-v2 WITH a path or a status qualifier.
      Disambiguation today comes from the sidecar's own `revision_required`
      status and from DEC-20260907-4e34c5's `gated_object` block, which states
      which bytes the gate read.
    residual_risk: >-
      An unqualified citation of that id names an ambiguous object, and that
      is not repairable by this or any later record. It is the cost of two
      lanes amending one experiment concurrently, recorded rather than
      smoothed over.

  # =====================================================================
  # 3. THE HEAD-BLINDNESS FINDING
  # =====================================================================
  head_blindness_finding:
    id: HB-1
    what: >-
      THIS GOAL'S HEAD CARRIED AS ITS RANK 1 A PIECE OF WORK THAT HAD ALREADY
      LANDED. EXP-ECDLP-6ac801 under BATCH-3c7493 executed exactly the
      N = 2^24 exact-basin, blind-re-derived check of T_sel = T/2 at small a
      that the head asked for, with evidence EV-ECDLP-2e9680 and decision
      DEC-20260907-9b1b02 at commit 84233e8c3.
    three_independent_causes:
      - BATCH-3c7493 was opened under coordination/experiments/ rather than under this goal's lane directory, so `tools/goal_lanes.py lanes` never listed it.
      - 'Its dispatch queue carries the field `goal_id` set to GOAL-ECDLP-001,
        because EXP-ECDLP-6ac801 and H-ECDLP-37dc01 both leave their own
        `goal_id` null.'
      - No checkpoint shard was ever written under ledger/goals/GOAL-ECDLP-bbc21f/checkpoints/ for it.
    generic_statement: >-
      WORK ARCHIVED AGAINST ONE GOAL IDENTIFIER IS INVISIBLE TO THE HEAD OF
      THE GOAL IT ACTUALLY ADVANCES, and each of the three causes above is
      independently sufficient to hide it. A head read is not a substitute for
      reading the decisions. The cost already paid: a lane opening spent on
      discovering the staleness, and a session that had instead executed the
      head's literal text would have re-measured a resolved cell.
    scope: >-
      Observed on this goal for BATCH-3c7493 / EXP-ECDLP-6ac801. No other goal
      was audited for the pattern; this is not a survey.
    recorded_not_repaired: >-
      This decision records the four affected records on the goal head
      additively so the next session's head read is not blind again. It does
      NOT set `goal_id` on EXP-ECDLP-6ac801 or H-ECDLP-37dc01 and does NOT
      retroactively register BATCH-3c7493 as a lane -- both are additive acts
      on records this lane does not own, and both stay in the ranking.

  # =====================================================================
  # RATIONALE
  # =====================================================================
  rationale:
    - >-
      THE LANE HAS NO COHERENT OBJECT LEFT TO RUN AGAINST, AND THE REASON IS
      NOT SCIENTIFIC. Its five remaining tasks all depend on an approved
      contract under this lane's wide protocol. The gate refused that protocol
      and all three blocking defects were re-verified as still holding
      (DEC-20260907-4e34c5 `defect_status_at_archive`). Meanwhile two
      v1-to-v2 amendments of one experiment cannot both be right and the other
      is approved, frozen and merged, so the only additive move available
      builds ON it. Authoring this lane's repair as a second, competing
      v1-to-v2 would either require overwriting an approved frozen record --
      forbidden -- or leave the collision standing with two live candidates
      instead of one.
    - >-
      THE SCOPE IS WORTH KEEPING, WHICH IS WHY THE LANE CLOSES AND THE SCOPE
      DOES NOT. 25 seeds, interval estimation with an UNRESOLVED verdict, an
      externally anchored decay control, a properly-shaped null and a
      reproduction control against the committed v1 cells are what would let a
      cell be RESOLVED rather than re-argued at n = 5. CR-1 establishes they
      can all be carried additively on the approved v2 under four named
      conditions, so nothing is lost by closing the lane.
    - >-
      THE APPROVED v2 STILL CARRIES ONE OF THE THREE BLOCKING DEFECTS, AND
      THAT IS THE STRONGEST REASON TO RANK v3 FIRST. `cap`, `CAP_MULT`,
      `cycle_mass` and `capped_mass` appear zero times in its text (CR-1a), so
      its own required Stage A' re-seal hands a from-scratch re-deriver a
      convention it must invent -- the same class of gap that produced the
      a = 1/8 disagreement in the first place, relocated from the weight to
      the cap. Repairing a foreseeable repeat before the re-seal runs is
      cheaper than diagnosing a second disagreement after it. Stated with its
      limit: the magnitude and direction of any induced difference are
      UNMEASURED, so this is a risk-of-recurrence argument and not a
      prediction that any verdict flips.
    - >-
      C2 WAS RANKED AGAINST THIS AND RANKED SECOND, ON THE MERITS AND NOT BY
      DEFAULT. C2 is the only OPEN completion criterion and therefore the only
      route to a complete criterion set, which is a real argument for ranking
      it first. It loses to RANK 1 for two reasons. Its immediate blocker is
      instrumental rather than scientific -- BATCH-1e7251 delivered the
      re-keyed 2^24 fixture but left `fixture_gate_v2` NOT SCORED because the
      O(theta) correction was `not_evaluated`, and V2-V5 / M1-M5 are not to be
      scored until that gate is evaluated -- so its next step is also an
      amendment authorship, with no advantage in immediacy. And chasing the
      third criterion while the goal's central hypothesis clause sits
      unresolved at the operating point it cares about would be optimising the
      tally rather than the question. C1 and C3 being MET does not license
      that: it makes it more tempting, which is exactly the make-work
      temptation an unlimited ECC budget creates and AGENTS.md names.
    - >-
      THE ONLINE RESEL-L ARM IS THE HIGHEST-VALUE CARRIED ITEM AND STILL
      RANKS THIRD. Zero online arms have ever been run at any batch size U, so
      every ceiling result this goal holds says nothing about whether the
      mechanism reaches the ceiling -- a genuine and large gap. It ranks below
      RANK 1 and RANK 2 because it is the largest of the three and because its
      output would be interpreted against a definition D2 leaves incomplete;
      spending it first buys a measurement whose reading is already known to be
      contestable.
    - >-
      NOTHING ABOUT THE ECDLP IS ESTABLISHED BY THIS DECISION, AND NOTHING IN
      THIS LANE EVER WAS. No run executed. The formula verification TF-1 is the
      GATE SESSION'S work (TASK-20260907-f65c6e), cited as that session's and
      never as this decision's, and it is a definition-versus-implementation
      identity check that says nothing about what the function returns.
      H-ECDLP-37dc01 stays `analyzed` with no status_history entry, because
      there is no evidence to add one for.
    - >-
      ECC PRIORITY AND THE DUTY TO RANK BOTH HOLD.
      `python3 tools/ecc_priority.py --classify GOAL-ECDLP-bbc21f` returns
      `area=ECDLP ECC`, so this goal is considered before every non-ECC goal
      and its campaign budget carries no ceiling. Unlimited removes the
      ceiling, not the duty to rank -- which is why this decision CANCELS five
      tasks rather than dispatching one it cannot rank ahead of doing nothing,
      and why the ranking below gives reasons rather than a list.

  # =====================================================================
  # THE CLOSURE QUESTION, ANSWERED EXPLICITLY
  # =====================================================================
  goal_closure_assessment:
    question: Does a completion criterion close GOAL-ECDLP-bbc21f?
    answer: 'NO. The goal stays `active`.'
    criteria_state:
      C1: MET (unchanged; flipped by TASK-20260906-ae5bb4 on EV-ECDLP-60e266 and EV-ECDLP-f6b3f5)
      C2: OPEN (unchanged)
      C3: MET (unchanged; flipped by TASK-20260906-ae5bb4 on EV-ECDLP-60e266's obstruction block)
    which_is_unmet_and_why: >-
      C2. It requires the EXP-ECDLP-869870 instrument committed with its
      basin-law measurements (survival slope, cutoff), its oracle-ceiling
      measurements (exact top-T share against C_max(a)), its published-rule
      measurements (the seven-cell primary-source fixture and C_rule/C_oracle
      as a function of N/T), AND their N-independence verdict across
      2^20..2^30, each with a confidence interval and the model value beside
      it. BATCH-1e7251 delivered the re-keyed 2^24 fixture (16/16
      completed_valid; blinded J1-J4 all hold or PASS) but its own checkpoint
      records `fixture_gate_v2` NOT SCORED because the O(theta) correction was
      `not_evaluated`, with V2-V5 / M1-M5 explicitly not to be scored until it
      is. No N-independence verdict exists at any scale, and no CI-bearing
      measurement set has been composed.
    why_ranked_work_remains: >-
      Two independent reasons, either sufficient. The criterion set is not
      satisfied and the head declares no rule under which two of three
      suffice; C2 names a distinct object (the EXP-ECDLP-869870 instrument)
      from the one C1 and C3 rest on (EXP-ECDLP-612fb1), so C1 and C3 being
      met says nothing about it. More decisively, this goal's own most recent
      evidence-review decision DEC-20260907-9b1b02 records the a = 1/8 cell as
      GENUINELY OPEN and leaves four ranked next actions standing, one of
      which (the online RESEL-L arm) has never been run at any batch size.
    weight_this_decision_carries: >-
      AGENTS.md's goal-closure quorum is SUSPENDED, so a met criterion plus a
      committed Coordinator decision would suffice to close and the decision
      would carry the full weight alone. That is precisely why this one
      declines: reachable is not automatic, and closing on a two-of-three
      tally while the central clause is unresolved would present the campaign
      as more complete than its own records support.
    what_is_not_done_either: >-
      The goal is NOT parked and NOT understated. `paused` and `blocked` are
      refused statuses. `closed_at_budget` is unavailable and would be false
      (the ECC budget is unlimited and no stagnation review exists);
      `cancelled` would be false (the campaign is not abandoned).
      `impediments` stays EMPTY because nothing is blocked: the collision has
      an additive route around it and the refusal names exactly what to author.
    no_quorum_claimed: >-
      No `completion_quorum` block is written and no attestation of any kind
      was obtained by this session. None is recorded, because none exists.

  # =====================================================================
  # OBSTRUCTION REGISTRY: THE REVERSAL QUESTION
  # =====================================================================
  obstruction_registry_pass:
    command: python3 tools/obstruction_registry.py --unexamined
    result: '1 obstruction in the standing set; 1 never resource-checked'
    entry: EV-AES-abf3dc (ledger/evidence/EV-AES-abf3dc.yaml)
    reversal_question: Which theory takes this measurement as its hypothesis rather than its refutation?
    reading: >-
      THERE IS NO MEASUREMENT TO REVERSE; THE FLAG IS A SCHEMA ARTIFACT. That
      record's `obstruction` block has `statement: null`, `quantity: null`,
      `value: null`, `measured_by: []` and `scope: null`, and its own
      `obstruction_note` reads "NOT APPLICABLE ... No obstruction quantity is
      claimed here" -- its `direction` is `neutral` and it closes no lane
      (GOAL-AES-002 stays active per DEC-20260810-6c00b4). The registry flags
      it only because `resource_check.examined` is null on a block whose every
      substantive field is also null. The honest answer is therefore not "no
      theory takes it up" but "NO OBSTRUCTION WAS EVER ASSERTED": there is no
      quantity, value, scope or run set for any theory to re-read as an asset.
    acted_on: >-
      NOTHING. EV-AES-abf3dc belongs to GOAL-AES-002, is immutable, and is
      outside this ECDLP lane's write scope and authority. Recorded here so the
      next rerank does not re-ask it blind; that record's own `resource_check`
      is not edited. Small transferable finding for whoever owns that goal: the
      registry cannot distinguish an unexamined obstruction from an
      inapplicable one, so a `neutral` evidence record with a null obstruction
      block sits in `--unexamined` forever.
    consequence_for_this_rerank: >-
      NONE OF THE STANDING UNEXAMINED OBSTRUCTIONS BEARS ON THIS GOAL'S
      RANKING. This goal's own live obstruction -- EV-ECDLP-60e266's
      T_sel = T/2 disjointness at a = 1/4, which C3 rests on -- is already
      resource-checked and is not in the unexamined set, and its resource
      reading is exactly what the small-a lane pursues: the quantity that
      bounds the gain at a = 1/4 is the hypothesis that a smaller a escapes the
      bound. That reversal is already this goal's RANK 1 lineage.

  # =====================================================================
  # EVIDENCE REFERENCES
  # =====================================================================
