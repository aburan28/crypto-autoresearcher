    - id: PD-4
      deviation: >-
        THE DISPATCHING INSTRUCTION MISATTRIBUTED AN OBSERVATION, AND THE
        RECORD WINS. It asked this close to notify peers, "from AO-2", that the
        approved v2's contract at specification.v2.yaml:297 still carries only
