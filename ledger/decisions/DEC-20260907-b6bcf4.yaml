      what_the_record_actually_says: >-
        AO-2 in DEC-20260907-4e34c5 is about something else entirely: a direct
        contradiction between the sidecar contract's `not_blind_from` (which
        says the two live canonical paths MUST be read) and commit 465c01cba's
        addition of those same paths TO
        `review_plan.blind_rederivation.blind_from` in
        ledger/handoffs/TASK-20260907-e423d5.yaml.
      what_the_committed_text_shows: >-
        THE CLAIM IS ALSO FALSE ON THE FACTS. The approved contract states the
        formula in its OWN `definitions` block: `weight_d = S_d + 4 * W * h_d`
        at experiments/EXP-ECDLP-6ac801/specification.v2.yaml line 324, inside
        the appended key at line 317, with the implementation citation at lines
        353-374. Line 297 is the v1 `STATIC(T)_r exact coverage` text,
        deliberately left byte-identical with the formula APPENDED after `seed`
        -- which is the additive pattern, not a residual gap. A re-deriver
        reading the approved contract alone CAN recover the weight.
      what_the_live_gap_actually_is: >-
        The CAP, not the weight. See CR-1a: `cap`, `CAP_MULT`, `cycle_mass` and
        `capped_mass` appear zero times in the approved contract, so the
        cap = ceil(8*W) that decides basin membership is not derivable from it.
      handling: >-
        Corrected here and in the bus notice rather than propagated. AO-2 is
        posted as what it is, and CR-1a is posted as the live gap. Recording a
        peer notice that misstates a committed record would have been worse
        than posting nothing.

