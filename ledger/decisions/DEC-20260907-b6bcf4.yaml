  # =====================================================================
  limitations:
    - >-
      THIS DECISION ESTABLISHES NOTHING SCIENTIFIC. It closes a lane, records a
      contract-compatibility reading, and reranks. Every research statement it
      makes restates an already-committed record with that record named beside
      it. No run, timing, margin, verdict or measurement originates here, and
      none is invented.
    - >-
      THE COMPATIBILITY READ IS ONE SESSION'S, AND IT IS NOT INDEPENDENT. The
      session that performed CR-1 is the session that acted on it, so the check
      that could have falsified both the archive task's recommendation and this
      ranking was self-administered (PD-2). It is mitigated only by quoting
      every decisive field so a later reader can falsify it from the same text.
      No independent read was obtained and no exhaustiveness is claimed: "no
      other frozen field conflicts" is not a finding this decision can support.
    - >-
      CR-1a NAMES A RISK, NOT A MAGNITUDE. That the approved v2 leaves
      cap = ceil(8*W) unstated is read directly off the committed text. That
      this could change the a = 1/8 verdict is NOT measured, by this decision
      or by the gate; only the unassigned mass itself was measured (4.67e-4 to
      2.09e-3 of N, four cells of one run), and the direction of any induced
      difference is unpredictable from the contract. Nothing here is evidence
      for or against G3 feasibility at any a.
    - >-
      THE RANKING IS A JUDGEMENT AND IS REVERSIBLE. RANK 1 and RANK 2 are
      close: C2 is the only OPEN completion criterion, and a session that
      weighs criterion completion above the central hypothesis clause would
      reasonably invert them. The reasons are recorded in `rationale` so the
      inversion can be argued on the merits rather than rediscovered.
    - >-
      NO REVIEW OF THIS DECISION, AND NO ATTESTATION. A lane close and rerank
      is not a claim-changing review round and none is required. No validator,
      red team or reviewer ran at any point in this lane; the approval gate was
      a single fresh Coordinator session's reading.
    - >-
      THE GATE'S DEFECT LIST IS NOT EXHAUSTIVE AND THIS DECISION DOES NOT MAKE
      IT SO. DEC-20260907-4e34c5 says so itself, and D1 and D2 were both found
      by comparing contract text against implementation -- a check a fresh v3
