coordinator_decision:
  id: DEC-20260724-015
  context: >-
    GOAL-MLKEM-002 BATCH-001 execution, independent validation, and independent
    red team of EXP-MLKEM-004 (repaired hardened multi-class ML-KEM comparison
    gate with baseline-invisible synthetic control and mechanism-matched
    second-implementation requirement) under Cursor Grok after verified
    run-package snapshot c3bd8ba.
  decision: inconclusive_scoped
  target_ids:
    - H-MLKEM-004
    - EXP-MLKEM-004
    - GOAL-MLKEM-002
  outcome_classification_adjudication:
    executor_reported: second_impl_unavailable
    official: second_impl_unavailable
    authority: >-
      Validator accepted the package with qualifications and confirmed the
      class; red team left the class standing while narrowing what it licenses.
  rationale:
    - >-
      The run package is admissible (accept_with_qualifications, 53/53 hash
      match, exact argv commands, all nine controls pass on the frozen text).
    - >-
      The KN-TECH-054 precedence repair succeeded as a reachability fix: the
      synthetic control was G1-silent and G2/G3-detected, rediscovery of the
      known defect was not counted as marginal information, and
      isolated_to_audited_commits was a reachable world that simply was not
      earned because the second-implementation line failed.
    - >-
      second_impl_unavailable is the honest class. The preference order was
      exhausted with evidenced mechanism rejections. Isolation across
      implementations is not claimed and must not be paraphrased as a null.
    - >-
      Red-team scope limits are binding: the synthetic control is a harness
      tautology and answers KN-TECH-054 only for precedence reachability, not
      for library-facing generator power; the mechanism-match criterion as
      applied left an empty public neighborhood among preferred candidates;
      the post-fix wolfSSL null remains partly generator-scoped.
    - >-
      H-MLKEM-004 is inconclusive. Detection retention held; isolation was not
      tested; instrument adequacy held only at the harness-precedence level.
  evidence_refs:
    - EV-MLKEM-007
    - coordination/goals/GOAL-MLKEM-002/batches/BATCH-001/tasks/TASK-20260724-921/validation_report.yaml
    - coordination/goals/GOAL-MLKEM-002/batches/BATCH-001/tasks/TASK-20260724-922/red_team_report.yaml
    - experiments/EXP-MLKEM-004/execution-report.yaml
  limitations:
    - No attack, oracle, exploitation path, or key recovery was built, and none is authorized.
    - Nothing here bears on MLWE hardness or passive ML-KEM security.
    - No release is approved and no library outside the audited wolfSSL commits is characterized as systemically clean.
    - Isolation across implementations was not tested.
  hypothesis_status_record:
    H-MLKEM-004: inconclusive
    prior_status: specified
    note: >-
      File ledger/hypotheses/H-MLKEM-004.yaml is not rewritten in this ledger
      archive because BATCH-001 artifact ownership remains with
      TASK-20260724-917; this decision is the official status binding.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No new reusable finding beyond KN-TECH-054, which already records the
      precedence design constraint. The harness tautology and empty
      mechanism-neighborhood observations are scoped negative results that
      drive the next experiment rather than a corpus entry.
  next_actions:
    - >-
      Open BATCH-002 to specify H-MLKEM-005 / EXP-MLKEM-005 that (1) replaces
      the harness-tautology synthetic control with a library-facing
      baseline-invisible adequacy probe or an independently injected defective
      comparator object that G2/G3 must detect without special-casing
      len(diffs)==1, and (2) either names a concrete reachable fixed-bound
      hand-written comparison target with preflight mechanism evidence before
      freeze, or explicitly widens the mechanism criterion with a recorded
      rationale so the isolation question is asked of a real peer rather than
      predetermined second_impl_unavailable.
  decided_by: coordinator
  decided_at: '2026-07-24'
