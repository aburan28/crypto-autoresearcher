coordinator_decision:
  id: DEC-20260805-f2086a
  context: >-
    GOAL-AES-003 BATCH-013 close. RC-C (DEC-20260805-0041a6 rank 1, carried
    forward unrun since BATCH-010) recomputed OBS-B8-7's S-box-specificity
    percentile using all five already-available AES r=5/amask=1/smask=1 data
    points (14, 14, 8, ~13.5, 12) against the 27-arm random-S-box reference
    distribution, instead of the original two (12, 14). The package was
    bound by a dispatcher-verified snapshot archive at commit
    b128056b49dd3286040460247a7cacd65248f80b (TASK-20260805-c7e43d) and
    reviewed by one independent validator (TASK-20260805-9c54e4), verdict
    passed_with_caveats, treated as `passed` for downstream ledger purposes
    with its two caveats carried forward.
  decision: confirm_and_reroute
  target_ids: [RQ-AES-003, GOAL-AES-003, EV-AES-d81acf]

  rationale:
    - >-
      OBS-B8-7's QUALITATIVE CONCLUSION SURVIVES UNDER THE FULLER
      EVIDENCE BASE, BUT THE CORROBORATION IS MODEST RATHER THAN
      DRAMATIC, AND BOTH FACTS ARE STATED IN THE SAME SENTENCE PER THIS
      GOAL'S OWN DISCIPLINE. All five AES r=5 readings (14, 14, 8, ~13.5
      (a rate, kept separate from raw counts per producer and validator
      agreement), 12) sit interior to the 27-arm random-S-box reference
      distribution's observed range (6-25, mean 15.481481481481481,
      independently reconstructed by the validator from raw BATCH-006
      files rather than trusted from citation), at per-arm right-tail
      probabilities of P(X>=14)=0.6811403904651809 (D-AES-K1, D-AES-K2),
      P(X>=8)=0.98638462537402 (D-AES-K3), and P(X>=12)=0.845060624282609
      (B0-AES-REF), none near either tail. Independently reproduced by
      the producer (analyze.py) and the validator (scipy.stats.poisson, a
      different code path) to full double precision.
    - >-
      THE VALIDATOR'S OWN RULING CAPS HOW MUCH WEIGHT THIS ADDS, AND THE
      DECISION ADOPTS IT RATHER THAN THE PRODUCER'S MORE OPTIMISTIC
      FRAMING. D-AES-K1, D-AES-K2 and D-AES-K3 are three measurements of
      the SAME S-box (AES) under different keys, not three independent
      draws from the 27-arm random-S-box comparison population.
      BATCH-005's own preregistered key-main-effect test already found no
      detectable key-to-key rate variation among these exact three arms
      (T2, p=0.24734580566758235, independently re-verified
      character-for-character by both producer and validator). They
      sharpen the estimate of AES's own rate under this geometry but do
      not increase the effective sample size against the comparison
      population of 27 distinct random S-boxes each measured once. Five
      data points therefore corroborate, modestly and in the same
      direction, the two-point reading; they do not constitute five
      independent samples and this record's evidence strength (weak) is
      set accordingly.
    - >-
      TWO MINOR PRODUCER-SIDE DEFECTS WERE FOUND AND NEITHER CHANGES THE
      SUBSTANTIVE CONCLUSION. (a) An incorrect claim that key_hex fields
      are 33-character strings; the validator measured all five directly
      and found the standard 32 characters, harmless to the distinctness
      conclusion since that check is a plain string inequality. (b) A
      genuine internal-consistency bug in analyze.py's CDF-from-below
      interpolation for the descriptive-only 13.5-rate figure, giving
      36.3% where the internally-consistent complement of the correctly
      computed survival figure is ~27.4%. This defect is confined to a
      value both records explicitly label descriptive-only; it does not
      touch any of the four raw-count percentiles (independently
      reproduced via a different code path) and does not change the
      qualitative reading under any of the candidate figures (27.4%,
      36.3%, or 36.8%, all well below the ~50th percentile).
    - >-
      THE VALIDATOR WENT BEYOND SCOPE IN A WAY THAT STRENGTHENS THIS
      RECORD'S BASIS: it independently reconstructed the 27-arm reference
      distribution from the raw BATCH-006 files rather than trusting
      either OBS-B8-7's or the producer's stated mean/range, and
      cross-checked all four raw-count percentiles via a separate code
      path. Both checks matched to full double precision, which is why
      this decision treats the recomputed percentiles as independently
      corroborated rather than merely re-asserted.

  evidence_refs:
    - EV-AES-d81acf

  what_this_decision_does_not_do:
    - >-
      It does not strengthen the r=5 excess's S-box-specificity finding
      beyond "modest corroboration". The five-point set is not treated as
      five independent samples against the comparison population, and no
      pooled or combined statistical test of the five AES points as a
      group was run or is claimed here.
    - >-
      It does not resolve RC-D (still unrun, tests idealness versus
      structurelessness, residual limitation U4) or the cipher-substitution
      mechanism's lack of independent-instrument corroboration; both remain
      open exactly as EV-AES-837cd8 left them.
    - >-
      It does not advance any closure criterion; no model independence
      exists under standing basis 0137a051eb5828789eb267fa83c8278086578d4c,
      so nothing here counts toward a goal-closure quorum.
    - >-
      It does not make, and nothing in it may be transcribed as, any
      statement about full-round or deployed AES, or any comparison to
      published cryptanalysis in either direction.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED. This is a robustness/recomputation check over an
      already-recorded descriptive finding (OBS-B8-7), not a new technique,
      a replicated strong result, or a durable methodological pattern. Its
      evidence strength is `weak` by this decision's own accounting, and the
      validator's own ruling is explicit that the five-point addition is
      modest corroboration, not a materially new or independently
      replicated result. The interpolation-bug finding is worth carrying
      forward as a defect note in this record and in analyze.py's future
      reuse, but a single instance of catching one arithmetic bug is not a
      durable technique warranting a knowledge/findings entry on its own.

  next_actions:
    - >-
      SINGLE NEXT ACTION: GOAL-AES-003 BATCH-014, rank 1 = RC-D (carried
      forward unrun since BATCH-010, now moved to rank 1 with RC-C closed
      out): a second, differently-constructed null object -- a keyed PRP
      that is not an oracle, e.g. a wide-block Feistel with a fixed non-AES
      round function -- to test whether BATCH-009's OUTCOME-A depends on
      IDEALNESS specifically or on structurelessness more broadly (residual
      limitation U4). This can proceed independently of the
      cipher-substitution instrument's memory-architecture problem. RANK 2,
      EXPLICITLY DEFERRED RATHER THAN RANKED, PER THE STANDING DECISION
      (DEC-20260805-0041a6, unchanged by this record): an O(1)-memory-per-
      query ideal-permutation construction (e.g. a Feistel or
      Thorp-shuffle-style keyed permutation evaluated directly rather than
      stored in a pair table) capable of reaching a decisive exposure
      (order 2^30) for the cipher-substitution comparison specifically.
      BATCH-012 established arithmetically that the pair-storage
      architecture used by rc8probe_ideal.c cannot reach 2^26 within any
      plausible memory budget; this lever remains real engineering work,
      not a cheap follow-on, and stays deferred until rank 1 is exhausted or
      a specific reason emerges to prioritize it sooner.

  budget_accounting:
    producer_declared_seconds: 1200
    producer_consumed_seconds: 187
    note: >-
      From budget_stamps.jsonl in TASK-20260805-258754's task folder: start
      event declares wall_clock_seconds=1200; end event records
      elapsed_seconds=187, within_budget=true, status=completed. Well inside
      budget, consistent with the task's own characterization as a pure
      recomputation over already-committed data with no new measurement arm.

  limitations:
    - Toy tier only; one probe geometry (r=5, amask=1, smask=1), one machine, five data points at 2^30-2^31 trials.
    - >-
      Session and implementation independence only. NO MODEL INDEPENDENCE
      under standing basis 0137a051eb5828789eb267fa83c8278086578d4c; nothing
      here counts toward a closure quorum.
    - No red team reviewed this batch.
    - >-
      The cipher-substitution mechanism remains uncorroborated by any
      independent instrument at a decisive exposure, unchanged by this
      batch.
    - >-
      "Five points" is not "five independent samples" against the
      comparison population; three of the five are the same cipher under
      different keys, and no formal accounting for that reduced effective
      sample size has been run.

  decided_by: coordinator
  decided_at: 2026-08-05

  inference:
    policy: coordinator-orchestration-code
    requested_policy: coordinator-orchestration-code
    resolved_model: claude-sonnet-5
    fallback_used: true
    model_verified: false
    standing_basis: 0137a051eb5828789eb267fa83c8278086578d4c
