  design_summary: >
    Chosen configuration: main arm n = 8, 4 twist classes x 2 forced points
    of one k = 3 coset (density exponent +1); anchor arm n = 6 (exponent
    +2); scale arm n = 10 (exponent 0, borderline -- a null there is a
    P3-relevant measurement, not an invalidation, stated in the hypothesis
    so it cannot be misread). Sample size derived explicitly from the
    HEUR-1 density H^(5 - n/2): per-point probability 10^-32 at n = 8,
    H = 10^4; pre-registered resolution floor q = 10^-3 (DECLARED design
    constant, flagged, frozen; the finer floor q = 10^-4 priced out of the
    idea's own 10^9-op cap); N_b = 10/q = 10^4 seeded b-tuples per arm;
    expected tail count N_b * q = 10 (10x multiple stated). Budget: 10^4 b
    x 10^4 counted exact ops per b = 10^8 counted ops per arm (inside the
    idea's 10^8-10^10 estimate, 10x inside its <= 10^9 cap); wall 7200 s
    against a 2 x 10^4 ops/s floor (5000 s expected); checkpointing every
    10^7 counted ops; exhaustion inert (a slow machine yields a completed
    prefix plus an exhaustion report, never a fake result). Decidable
    success criterion (frozen verbatim in the contract): arm B exhibits at
    least one nonsingular quartic v^2 = s(u) with 8 forced non-torsion
    points across 4 DISTINCT twist classes of ONE k = 3 coset of the
    committed support, all within the frozen box (b_1 = 0, b_2 = 1, b_3..b_8
    distinct integers in [-20, 20]; r-height <= 10^4; <= 10^8 counted exact
    rational operations; <= 7200 s wall), whose exact descent-free
    certificate reports a certified k = 3 total contribution from the
    forced classes of >= 8 -- at least 4 exact eigenspace units plus at
    least 4 exact F_l within-class units, certificate-kind split carried,
    zero verifier errors -- with ALL controls passing (IV-1 through IV-7
    untriggered). Negative branch derived first: P(zero | rate >= q) is
    approximately 4.5 x 10^-5, so the criterion CAN fail. Invalidation
    rules: IV-1 known-false d = (1..1) must report total = n (7 at n = 8,
    9 at n = 10) or ALL runs void; IV-2 planted synthetic control misses
    or recovers the wrong exponent -> distributional metric void; IV-3
    blind kernel re-derivation mismatch unresolved -> affected runs void;
    IV-4 degeneracy leak -> instance struck, success claim void; IV-5
    verifier rejects witness -> run invalid plus F5; IV-6 any descent,
    r_low, or floating point in the exact certificate part -> certificate
    void; IV-7 determinism re-run divergence -> both runs void.
  prior_comparison: >
    Pointwise against the six-point prior in DEC-20260905-eba685. Point
    (1) DECIDABILITY -- CONFIRMED, and the predicted failure mode was
    actively avoided: the criterion binds the falsifiable P1 target
    (certified k = 3 total >= 8 from the forced classes) inside a frozen
    box/sample/counted-op cap; the unfalsifiable "given enough solver
    time" phrasing is excluded by the counted-op cap; the negative branch
    was derived FIRST (P(zero | rate >= q) ~ 4.5 x 10^-5). Coordinator
    verified success_criterion and its decidability note present in the
    committed spec. Point (2) SAMPLE-SIZE DERIVATION -- CONFIRMED, the
    field I expected to be skipped was done explicitly: H^(5 - n/2) table
    at n = 6/8/10 (+2/+1/0), per-point probability, resolution floor,
    N_b = 10^4, expected tail count 10 stated -- with the honest flag that
    q = 10^-3 is DECLARED, not theorem-derived (finding 1). Point (3)
    CONTROL BINDING -- CONFIRMED: known-false d = (1..1) is invalidation
    rule IV-1 (failure voids ALL runs), not decoration; null-object scan,
    blind kernel re-derivation (with blind_from), and degeneracy filter
    bound as C2-C4 with IV-3/IV-4; skill minimums added (planted synthetic
    control -> IV-2; seed/instance independence; three scales n = 6/8/10).
    Coordinator verified invalidation_rules present in the committed spec.
    Point (4) BUDGET CONSISTENCY -- CONFIRMED with two disclosed findings:
    10^8 counted ops per arm sits inside the idea's own estimate and 10x
    inside its cap; the tension between the n = 8 target and a bounded
    budget was resolved by fixing scope (seeded 10^4 sample; F1 scoped to
    the completed sample per rule 6), not by an unbounded run; the
    throughput floor and the per-b cost estimate are flagged as
    assumptions with their bias direction and inert-exhaustion mitigation
    (findings 2-3). Point (5) WALL DISCIPLINE -- CONFIRMED: scope n <= 10
    everywhere; the idea's P4 and the P3 n = 12 sub-step are carried in
    the hypothesis with explicit excuse reasons; no budget line, stopping
    rule, or criterion references n >= 12 or total >= 32; nothing promises
    the unpriced wall-crossing route. Point (6) STATUS DISCIPLINE --
    CONFIRMED by direct Coordinator inspection of the committed bytes:
    hypothesis status `specified`; experiment status `review_required`;
    approved_by null with an approval_note; no self-approval; zero
    execution. No prior point was overturned; point (2)'s expected
    breakage did not materialize (the derivation was done) and point (1)'s
    expected breakage was designed around with a derived negative branch.
  design_findings_carried: >
    Seven disclosed findings from design-notes.md, carried into the
    approval gate (none blocking presentation): (1) q = 10^-3 is declared,
    not theorem-derived -- a frozen pre-registered design constant,
    movable only by amendment; (2) the wall budget assumes >= 2 x 10^4
    exact Fraction ops/s (the idea's cost model implies up to 1.4 x 10^6);
    the COUNTED-ops cap is the binding budget, checkpointing every 10^7
    ops, exhaustion inert; (3) the per-b cost (~7.2 x 10^3 ops) rests on
    the idea's cost-model estimate, not a measurement of this engine -- if
    the real cost exceeds the declared per-b cap, the arm completes a
    smaller prefix and reports it as such; (4) F6 statistical power is
    limited at the declared scan box (4 constructed non-forced cells vs 32
    null cells) -- fires decisively only on large effects, disclosed in
    C2 and P3's honest_power_note; (5) arm C (n = 10, exponent 0) is
    borderline -- a null there is a P3-relevant measurement, not an
    invalidation; (6) Hasse-Minkowski and Mazur are RECALLED pointers
    (Serre Ch. IV; Mazur IHES 1977) -- pointers, never support (rule 9);
    the pipeline relies on the COMMITTED verifier implementations, and P0's
    "near-rigorous" label carries a rigor_note asking the approval-gate
    reviewer to confirm the statement from a read source before any
    conclusion leans on it; (7) the kb index is absent in this session
    (second occurrence) -- novelty stays `unverified`, no absence
    inference drawn.
  design_verdict: >
