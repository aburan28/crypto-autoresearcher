  reference_table:
    machine_check_format: >-
      Exactly experiments/EXP-PFDR-011cd0/amendments/AMD-20261002-236691.yaml
      protocol_amendment.machine_check_format, with the AMD-20261002-594eab
      format it inherits, as applied in DEC-20261002-e7f8c9
      approval_reference_table.
      - Paths are repository-relative unless they start with /. A path
        ending in / is a directory.
      - file may be a list; the check then applies to each file.
      - Locators: yaml: and json: paths, with ["..."] literal-key segments
        and [N] 0-based indices; 'file' for the whole file text; 'path' for
        the path itself. No line: locator is used here.
      - A list locator takes a list expected, compared entry by entry.
      - Checks used:
        - equals (Python == after loading, type-exact);
        - contains (the token is a substring of the loaded string at the
          locator, or of the whole file text for locator 'file'; expected
          true);
        - count_equals (locator 'file'; non-overlapping str.count of the
          token over the whole file text);
        - sha256_equals (hashlib.sha256 of the file bytes, lowercase hex);
        - exists and not_exists (os.path.exists of each listed path);
        - key_count (len of the object at the locator);
        - keys_include.
      - YAML folded scalars are compared after loading. A token in a
        double-quoted YAML string may contain the escape \n, which is a
        newline.
    rules:
      - "The top-level session runs every row with a read-only script, writing only to an absolute scratch path: (1) BEFORE anything is staged for TASK-20261008-5ea531 (order step 1), and (2) again inside TASK-20261008-13dfad, before anything is staged there. Each time it records the script's sha256, this decision's sha256 as checked, and per row PASS, MISS or INFO with the observed value."
      - "A row whose check fails, whose file is absent, or whose key, index or token is not found as stated is a MISS. Any MISS stops the run: nothing is committed under 5ea531 or 13dfad, and the MISS rows return to this Coordinator. This decision is then superseded or replaced, never edited after a passing check. If the bytes of any file named here change before the 13dfad commit, (j) is re-run in full."
      - "Rows on the three cards written by this act (RT-65 to RT-67) are checked in the working tree."
      - "verified_by_coordinator_reading is true when this Coordinator read the location while drafting. It is false for sha256 rows and for rows on files written by this act."
