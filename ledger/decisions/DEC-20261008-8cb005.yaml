# =============================================================================
# DEC-20261008-8cb005 -- Coordinator ruling on the two STOPs of the snapshot
# archive TASK-20261002-33afa9 and on DEF-1 of TASK-20261002-8a6b8a
# (EXP-PFDR-0b3699; H-PFDR-2765d2; RQ-PFDR-ae2fba).
# RULINGS:
#  (1) Both 33afa9 STOPs are defects of the archive CARD, not of custody or of
#      the package. TASK-20261002-33afa9 is SUPERSEDED (never completed, nothing
#      committed under it) by TASK-20261008-5ea531, which archives the package
#      AS PRODUCED with corrected checks (a), (b), (d), (g) and an added,
#      record-only (i). It runs first, alone, right after check (j) of this
#      decision passes, because the package has sat uncommitted for six days.
#  (2) DEF-1: route (B). Pinned scripts stay unchanged for the whole run set;
#      every run-root manifest finalized by the pinned run_jobs.py is repaired
#      later by supersession. The registry write that needs is a SHARED-FILE
#      write held for the user (HU-4). (A) and (C) are not adopted.
#      The continuation is NOT dispatched by this decision: it needs an
#      additive protocol amendment (execution_authorized_scope names 8a6b8a
#      only), a Coordinator validity check of RA-01..RA-03 on archived bytes,
#      and a ruling on PDI-2 formed from a BLIND adjudication
#      (TASK-20261008-e2830e) because this Coordinator already knows PDI-2
#      bears on whether G-REPRO passed.
#  (3) Flagged points: four ruled now, four deferred with named owners.
# No hypothesis, experiment, evidence or goal status changes. Zero runs.
# Nothing under ledger/hypotheses/ is written. No shared tool or config file
# is written by anything this decision authorises. TW-SCOPE binds.
# =============================================================================
coordinator_decision:
  id: DEC-20261008-8cb005
  id_provenance: >-
    Minted by the top-level session with tools/allocate_id.py and confirmed
    free with --check, together with TASK-20261008-5ea531,
    TASK-20261008-e2830e and TASK-20261008-13dfad, then supplied to this
    Coordinator. The Coordinator has no shell and minted no identifier.
  recorded_at: '2026-10-08'
  decided_at: '2026-10-08'
  decided_by: coordinator
  archived_by: TASK-20261008-13dfad
  goal_id: null
  batch_id: null
  question_id: RQ-PFDR-ae2fba
  hypothesis_id: H-PFDR-2765d2
  experiment_id: EXP-PFDR-0b3699
  review_plan_id: null
  authorised_by:
    - DEC-20261002-e7f8c9 NA-3 (snapshot archive of the run package, alone, before any review) and NA-4 (Coordinator validity check after that archive verifies)
    - TASK-20261002-33afa9 constraints (a STOP goes to a Coordinator decision; it is never fixed by editing an artifact)
    - AGENTS.md "Durable research commits"; core rules on immutability and on infrastructure failures never being negative evidence

  decision: supersede
  decision_label: 33afa9_superseded_by_5ea531__archive_as_produced_with_corrected_checks__DEF1_route_B__continuation_held_for_amendment_validity_and_blind_PDI_adjudication__registry_write_held_for_user__no_status_change
  target_ids:
    - TASK-20261002-33afa9
    - TASK-20261002-8a6b8a
    - EXP-PFDR-0b3699
    - H-PFDR-2765d2
    - RQ-PFDR-ae2fba
    - TASK-20261008-5ea531
    - TASK-20261008-e2830e
    - TASK-20261008-13dfad

  context: >-
    TASK-20261002-8a6b8a (executor) returned STOPPED after RA-03 and before
    RA-04 on DEF-1. DEF-1 is that the pinned run_jobs.py finalize writes the
    executed commands as run.code.commands (a list) and in command.txt, but
    writes no run.code.command key. tools/validate_ledger.py requires that
    key (rows RT-26, RT-27, RT-34, RT-35, RT-58). RA-01, RA-02 and RA-03 are
    terminal, with status completed_valid as recorded by the executor (not
    yet validated by this Coordinator). design.json is pinned, and RA-04 to
    RA-06 never started.
    The snapshot archive TASK-20261002-33afa9 then stopped in pre-staging on
    two checks:
    (a) the TASK-20261001-b64be7 receipt has 617 of 619 paths matching; the
        two mismatches are exactly the EC-A1 files;
    (g) validate_ledger names three paths to be staged, the three run-root
        manifests, each with the DEF-1 line.
    Nothing is committed: 230 untracked or modified files, 8,832,608 bytes,
    about six days in an ephemeral container. The merged head is 5fbfbf118
    (fa53fa540 plus origin/main 3e05e9d15), clean and pushed.
    This Coordinator read the executor's report and notes, both cards, the
    specification, the precheck JSON in the session scratch directory, the
    validator's check_run code and the CI ledger gate. It ran no command.

  # ---------------------------------------------------------------------------
  # RULING 1 -- the two 33afa9 STOPs and how the package is archived
  # ---------------------------------------------------------------------------
  ruling_on_33afa9_stops:
    stop_a_b64be7:
      finding: >-
        The TASK-20261001-b64be7 receipt binds
        src/crypto_autoresearcher/index_calculus/__main__.py and
        factor_base.py at their 38be58dad bytes:
        - __main__.py ef9a516d9b11d371bf76b0c39813e55abdaee1e068397454ded1bd17c3212c26
        - factor_base.py c36d88e2333acdd860952be4c3249d40589bc3be7d62016f7408bfe022a9cde0
        (RT-02, RT-03). The executor's build-base table records the same
        values as the 38be58dad bytes (RT-04). DEC-20261002-e7f8c9 na5_lift
        authorised TASK-20261002-8a6b8a, and only it, to change exactly
        those two files plus one new test (RT-64). The working-tree bytes are
        the pinned EC-A1 bytes:
        - factor_base.py d166ac34d8187a6f3f80670b890628babbab35efb67ca2837049e2e21ae8140e
        - __main__.py 3e4b76a46e07e7077e984eac231938dd5f02f7dfa741529def68ae2aa68ae063
        (RT-05 to RT-07).
      classification: >-
        A drafting defect in the 33afa9 card, which this Coordinator wrote.
        Its check (b) expects these two files to differ from 38be58dad. Its
        check (a) nevertheless listed b64be7 without excepting them (RT-39).
        The divergence is the authorised change. It is not a custody
        failure, and no archived path outside EC-A1 differs: 617 of 617
        match.
      ruling: >-
        Not a STOP once the check is corrected. TASK-20261008-5ea531 check
        (a4) replaces it with a three-way identity for each of the two
        paths: the receipt value equals both git show 38be58dad:<path> and
        the build-base table, and the working tree equals the pins.scripts
        value. Every other b64be7 path must still match. Any other outcome
        is a STOP.
    stop_a_7505b5_note: >-
      Not a STOP; recorded for completeness. The precheck evaluated
      verify_archive at the receipt-only commit 0eec511ab. The 7505b5 receipt
      names its package commit as package_commit_sha
      ecdbe98c62d46cd51ad38bcf83d74cae68a91e08 (RT-61), and verification
      passes there with 32 of 32 hashes matching (precheck-addendum.json).
      This is the reading already used for PD-A7505B5-1 (AMD-20261002-236691
      row PR-01). 5ea531 check (a3) names that commit explicitly.
    stop_g_def1:
      finding: >-
        validate_ledger on the merged head names exactly three paths to be
        staged, each with "run.code.command missing (not reproducible)":
        the run-root manifests of RUN-PFDR-0b3699-tests, -repro and
        -p0-design. The executor's report records the same three lines
        (RT-33). No `    command:` key exists under run.code in any of them
        (RT-35); run.code.commit and run.code.commands are present (RT-34).
      classification: >-
        DEF-1 is a known, disclosed provenance-schema defect in an immutable
        record. It sits in the writer (the pinned run_jobs.py finalize), not
        in any measurement. Under AGENTS.md it is infrastructure or
        implementation signal, never evidence about H-PFDR-2765d2. A repair
        is a superseding record routed through
        tools/run_supersession_registry.yaml (RT-59). That is a shared file
        this session may not write without the user (HU-4).
      ruling: >-
        Archive the package AS PRODUCED, now. The 33afa9 card itself says a
        failed, partial, stopped or invalid run set is archived with its
        status. Check (g) exists so that a malformed record is not archived
        unknowingly. Here the defect is known and exact, and its repair is
        additive. Holding the archive for a repair that is unavailable would
        trade a disclosed schema defect for a real risk of losing six days of
        uncommitted run data.
        5ea531 check (g) therefore requires the lines naming a staged path
        to be EXACTLY the three DEF-1 lines, and records them as
        known_defect_lines. Any other line naming a staged path is still a
        STOP, and so is any change to the three.
        Expected consequence, recorded in advance: the PR's "Validate ledger"
        CI step (tools/ci_ledger_gate.py) reports these three lines as
        validation errors introduced by the PR (RT-60). The PR stays red on
        that step until HU-4 is resolved, and it is never merged while red.
    latent_stop_b_pycache:
      finding: >-
        33afa9 check (b) records any __pycache__ directory as a scope_finding,
        and any scope_finding is a STOP (RT-41). __pycache__ directories exist
        under src/crypto_autoresearcher/index_calculus/ and tests/. They are
        gitignored, absent from git status, have mtimes from 2026-09-26 to
        2026-09-29 (none in the executor window), and the executor recorded
        them as pre-existing at build-base time.
      ruling: >-
        Not a stop. 5ea531 check (b) classifies a __pycache__ directory or
        .pyc file as PREEXISTING_IGNORED when all of these hold: git
        check-ignore matches it, it is not in git status, every file in it
        has an mtime earlier than 2026-10-02T19:51:50Z (the executor's
        build-base check), and it is not under experiments/EXP-PFDR-0b3699/.
        It is recorded under preexisting_ignored_paths, never staged and
        never deleted. Anything else of that kind is a scope_finding and a
        STOP.
    branch_d:
      finding: >-
        The state fits S4 structurally (RT-37). The stop cause, however, is
        DEF-1, which is not one of S4's parenthetical causes (RT-42).
        pins.design_json is absent at the pins key (RT-16). It is recorded
        twice with equal values: under defect_found_after_pinning, because
        of an indentation slip, and restated under pins_design_json; both
        equal the sha256 of design.json (RT-17, RT-18).
      ruling: >-
        5ea531 check (d) defines the one admissible branch, S4-DEF1, exactly
        (see that card). The restated pin
        implementation_notes.pins_design_json.design_json is the
        pins.design_json record of TASK-20261002-8a6b8a for every downstream
        check (flagged point FP-4).
    archive_route:
      ruling: >-
        TASK-20261002-33afa9 is superseded by TASK-20261008-5ea531. The 33afa9
        card stays committed and byte-unchanged. It was never completed:
        nothing was staged and no 33afa9 receipt exists (RT-38) or will be
        written. 5ea531 has the same scope (the 8a6b8a artifact_paths that
        exist) and the corrected checks, plus a record-only check (i) of the
        mechanical validity facts this Coordinator needs for NA-4. It runs
        first, alone, immediately after check (j) of this decision passes,
        and before any review agent reads the package (procedure deviation
        PD-1).

  # ---------------------------------------------------------------------------
  # RULING 2 -- DEF-1 and continuation
  # ---------------------------------------------------------------------------
  ruling_on_def1:
    classification: >-
      implementation_error in the provenance writer, as the executor
      classifies it. No gate, count or scientific quantity is shown to be
      affected. That last point is the executor's statement and is confirmed
      or refuted at the validity check (NA-5), not here.
    option_A:
      verdict: not adopted
      reasons:
        - >-
          The frozen contract names exactly four scripts with run_jobs.py as
          the writer of every manifest (RT-54; AR-2). Changing the launcher
          between RA-03 and RA-04 needs an amendment, a new fixture exercise
          and new pins. It would split the run set into two provenance
          regimes: RA-01..RA-03 under v1 and RA-04..RA-06 under v2.
        - >-
          It does not avoid the shared registry write, because the three
          existing manifests still need supersession. It only reduces the
          later count from six to three.
    option_B:
      verdict: adopted as the route
      terms:
        - >-
          Every pinned file (pins.scripts, RT-09 to RT-14) is used unchanged
          for RA-04 to RA-06. No pinned file is edited, and no fifth script is
          added.
        - >-
          After the run set ends (RA-06, or any earlier stop), one mechanical
          task writes a superseding manifest for every run root finalized by
          the pinned run_jobs.py. The task id is minted then. Each
          superseding manifest is a verbatim copy plus run.code.command,
          derived only from that run root's archived command.txt, with a note
          that finalize invocations are not logged there (FP-7). Both sha256
          values are pinned, and no other field changes. The registry entries
          are the shared-file write held for the user (HU-4). Until they
          exist, the validator lines stand, disclosed.
        - >-
          The continuation's completion gate carries an exact carve-out for
          the DEF-1 line class, limited to run-root manifests written by the
          pinned finalize. Every other validator error naming a new path
          still fails the gate. This is written fresh in the continuation
          card. It is not an edit of the 8a6b8a gate.
        - >-
          The continuation executor logs every finalize invocation verbatim,
          as the exact argv, in its own execution report, because the pinned
          script cannot be changed to log it (FP-7).
    option_C:
      verdict: not adopted as framed
      reason: >-
        TASK-20261002-8a6b8a has ended at a stop. Its completion-gate item
        (RT-45) is recorded NOT MET and stays so. Amending it afterwards
        would relabel a finished task. The only gate text that changes is in
        a new card (option B, third term).
    continuation_not_dispatched_now:
      reasons:
        - >-
          AUTHORITY. The frozen execution_authorized_scope reads "by
          TASK-20261002-8a6b8a only. Nothing else." (RT-49). A continuation by
          any other task needs an additive protocol_amendment (AMD id minted
          then). The amendment extends execution_authorized_scope and
          output_archive to named continuation and archive tasks, records
          DEF-1's handling, records the 33afa9 to 5ea531 substitution (PD-2),
          and changes no scientific clause.
        - >-
          ORDER. PDI-2 decides which census-row keys G-REPRO excludes
          (RT-22), and G-REPRO precedes RA-03 in the fixed order (RT-52). The
          executor reports that without PDI-2, G-REPRO would not pass (RT-28).
          If PDI-2 departs from the frozen text, the stopping rule required a
          stop before RA-03 and RA-07, and running RA-04 on top would compound
          an order violation. PDI-2 must be ruled before any continuation.
        - >-
          BLINDNESS. This Coordinator now knows which way PDI-2 cuts, and a
          reading it forms now is not independent of that knowledge. The
          ruling therefore rests on a reading formed without it:
          TASK-20261008-e2830e, a fresh validator that reads only the frozen
          texts, the committed T-DET helper, the engine and the PDIs. It first
          writes its own blind reading of the clause, and it never sees any
          output of this experiment. The routing of each possible adjudication
          verdict is fixed below, before the adjudication runs.
        - >-
          VALIDITY. NA-4 of DEC-20261002-e7f8c9 requires this Coordinator's
          validity check on archived bytes before interpretation. RA-01 to
          RA-03 are checked at NA-5, using the 5ea531 receipt including its
          check (i).
    pre_committed_routing_for_the_adjudication:
      PDI-2:
        follows_from_text_or_admissible: >-
          G-REPRO is evaluated under PDI-2 at the validity check. If RA-01 to
          RA-03 are otherwise valid, the continuation proceeds under route B
          by the amendment.
        departs_from_text_or_cannot_decide: >-
          G-REPRO is treated as NOT passed under the frozen text, and RA-03 as
          run out of order. It is archived as produced, and is not usable
          until a decision rules otherwise. RA-07 attribution (AR-7) is owed
          before anything else, in a task authorised by an amendment. Only
          then does a Coordinator decision choose between two routes:
          (i) a fully disclosed post-hoc amendment of the G-REPRO exclusion
              set, with RA-03 re-run or explicitly retained;
          (ii) another route.
          Neither verdict is evidence about H-PFDR-2765d2.
      PDI-1_and_PDI-3_to_PDI-10:
        follows_from_text_or_admissible: carried; reviewed again in the full review round after RA-06.
        departs_from_text_or_cannot_decide: >-
          The quantity it bears on is named. If that is the RA-03 design
          (PDI-1, PDI-5 to PDI-8), RA-03 is re-run under a pre-data amendment
          before RA-04. If it is RA-05 or RA-06 only (PDI-4, PDI-9, PDI-10),
          the pre-data amendment fixes the reading before the continuation.
          Either way it is also a procedural finding against 8a6b8a under its
          NO JUDGMENT ON SCOPE constraint.
      PC-NULL-R_ii:
        informative: no change.
        weak_or_degenerate: >-
          A pre-data amendment may revise criterion (ii) or mark it
          report-only, in the continuation amendment. The decision weighs
          that against keeping the frozen control as written, and it is made
          before any RA-04 data exists. Criterion (i) is untouched in every
          case.

  # ---------------------------------------------------------------------------
  # RULING 3 -- the executor's flagged points
  # ---------------------------------------------------------------------------
  ruling_on_flagged_points:
    ruled_now:
      - id: FP-3
        point: fixtures/fixture_exercise.py pinned beside the "exactly four scripts"
        ruling: >-
          Accepted as fixture tooling inside the declared fixtures/ location
          (required_artifacts.per_experiment names fixtures/ and the exercise
          log; RT-24). It is not a fifth experiment script, PROVIDED no RA
          command invoked it and no RA run had the EXP0B3699_RUNS_ROOT or
          FIXTURE_DIR override set. 5ea531 check (i3) records the mechanical
          counts, and NA-5 confirms the proviso. If the proviso fails, the
          point reopens. e2830e Q3 gives an independent text reading.
      - id: FP-4
        point: the design_json pin placement
        ruling: >-
          The pin was written once at 2026-10-02T20:48:59.756753730Z under the
          wrong parent and restated 12 seconds later under pins_design_json,
          with the same path and sha256. Both precede any RA-04 process, and
          none exists (RT-17, RT-37). The restated record is the
          pins.design_json record. This is a record-location slip in an
          append-only file, not a pin defect.
      - id: FP-7
        point: command.txt does not log finalize invocations
        ruling: >-
          A disclosed provenance gap, and not a stop. Finalize writes only
          provenance files. The finalize lines in the execution report are
          paraphrased, not exact argv (RT-32). The run-root manifests state
          that command.txt holds "every run_jobs.py invocation", which is
          inaccurate for finalize. Remedies:
          (i) the later superseding manifests derive run.code.command from
              command.txt only and state the gap;
          (ii) the continuation executor logs each finalize argv verbatim in
               its own report;
          (iii) NA-5 records whether any archived file holds the exact
                finalize argv (5ea531 (i4)).
      - id: FP-8
        point: the DEF-1 stop itself (pinned-file rule versus validator gate)
        ruling: >-
          The executor acted correctly. It did not edit the pinned file
          (RT-44). It finalized the in-flight location and returned with
          options (route B above).
    deferred:
      - id: FP-1
        point: PDI-2 is load-bearing for G-REPRO
        owner: TASK-20261008-e2830e (blind adjudication), then the NA-5 Coordinator ruling under the pre-committed routing above
        gating: true (no continuation before it)
      - id: FP-1b
        point: PDI-1 and PDI-3 to PDI-10, and whether recording them, rather than stopping, met 8a6b8a's NO JUDGMENT ON SCOPE constraint
        owner: TASK-20261008-e2830e (Q1), then NA-5; the full review round after RA-06 re-examines them
        gating: only where e2830e returns departs_from_text or cannot_decide
      - id: FP-2
        point: >-
          Read-scope disclosure. While locating mu_model the executor
          displayed EXP-PFDR-011cd0 design.json keys beyond the named fields,
          including estimates.TT4, a p0_inputs_not_used field (RT-31). It
          states it did not use them. The display may have preceded the PDIs
          being recorded at 2026-10-02T20:03:05Z (RT-20).
        owner: >-
          The validity check at NA-5 records it as an 8a6b8a procedure
          deviation and asks whether any pinned script reads a
          p0_inputs_not_used field; review-round joint "P0 input provenance".
          The e2830e PDI adjudication is blind to the 011cd0 estimates, which
          neutralises any influence on the PDIs.
        gating: false unless a pinned script is found to read such a field
      - id: FP-6
        point: PC-NULL-R criterion (ii) near-degenerate (the four null numerators sum to zero by algebra; RT-29, RT-53)
        owner: TASK-20261008-e2830e Q2 (pre-data assessment on synthetic draws only), then NA-5; red team in the review round (proves-too-much on the null pseudo-cells, DEC-20261002-e7f8c9 NA-4)
        gating: false; but any change must be pre-data, so it is decided in the continuation amendment or not at all

  coordinator_prior:
    recorded_before: the e2830e adjudication is dispatched; e2830e may not read this block
    PDI-2: >-
      harvest.harvest_seconds is a timing key on the plain words. The
      expected verdict on harvest.worker_maxrss_bytes is "admissible reading
      of an open detail": not named by the word "timing", but within G1''s
      evident purpose of excluding host measurements that cannot reproduce,
      and equal to the committed T-DET exclusion set (RT-55 to RT-57). A
      literal-only reading would make G-REPRO unpassable for any build,
      38be58dad included. Probability that e2830e returns follows_from_text
      or admissible: about 0.7.
    other_PDIs: expected follows_from_text or admissible for all; lowest confidence on PDI-4 (permutation as a uniform choice of the position-0 arm) and PDI-6 (common random numbers across synthetic designs).
    PC-NULL-R_ii: expected weak but not strictly tautological; criterion (i) carries the control.

  # ---------------------------------------------------------------------------
  # ORDER OF OPERATIONS (mechanical; the top-level session performs steps 1-4)
  # ---------------------------------------------------------------------------
  order_of_operations:
    - step: 1
      who: top-level session
      what: >-
        Check (j): run every row of this decision's reference_table with a
        read-only script, per its machine_check_format, writing only to an
        absolute scratch path. Record the script's sha256, this decision's
        sha256 as checked, and per row PASS, MISS or INFO with the observed
        value. Any MISS: stop. Nothing is staged, and the MISS rows return to
        this Coordinator.
    - step: 2
      who: top-level session
      what: >-
        Run TASK-20261008-5ea531 ALONE, per its card. That covers: merge
        origin/main, re-running (j) if any (j)-named file changed; checks
        (a) to (i); stage by literal pathspec; receipt in the same commit;
        verify; push; refresh the PR. Do not write
        tools/run_supersession_registry.yaml or any other shared tool or
        config file.
    - step: 3
      who: top-level session
      what: >-
        Run TASK-20261008-13dfad ALONE, per its card, after the 5ea531 receipt
        verifies and the branch is pushed. That covers: re-run (j); custody of
        the 5ea531 receipt and of the authority bytes it recorded; stage the
        four records and the receipt; verify; push; refresh the PR.
    - step: 4
      who: top-level session
      what: >-
        Dispatch TASK-20261008-e2830e to a FRESH validator session, exactly as
        its dispatch_preconditions state: claim before launch, release on
        return. Nothing else is dispatched. In particular, no executor runs
        RA-04.
    - step: 5
      who: coordinator
      what: NA-5 below (sealing archive of the adjudication, then the validity and continuation decision).
  dispatch_preconditions:
    - "For step 2: TASK-20261002-8a6b8a has returned, its session has ended and its claim is released (MSG-20261002-43db6a; commit fa53fa540). TASK-20261002-33afa9 staged nothing: git diff --cached --name-only is empty, and the 33afa9 receipt path does not exist (RT-38). Check (j) recorded no MISS. No other archival task is running. No review agent has read the package."
    - "For step 3: the TASK-20261008-5ea531 receipt has verified with tools/research_dispatch.py (content_at_commit), and the branch is pushed."
    - "For step 4: the TASK-20261008-13dfad receipt has verified and the branch is pushed, so this decision and the three cards are committed and published."
    - "For any continuation of RA-04 to RA-06: NONE holds yet. It requires the NA-5 decision, its amendment and its cards, each archived and verified."

  procedure_deviations:
    - id: PD-1
      text: >-
        TASK-20261008-5ea531 runs before its own card and this decision are
        ledger-committed, by 13dfad. That is the reverse of the
        4b35db-then-33afa9 order used on this line. Reasons:
        (i) AGENTS.md durable-commit order, snapshot before ledger: this
            decision rules on a package that is not yet committed;
        (ii) six days uncommitted in an ephemeral container.
        Guards:
        (i) check (j) runs first;
        (ii) the 5ea531 receipt records the sha256 of this decision and of
             its own card as the authority read;
        (iii) 13dfad's custody check requires the committed bytes to equal
              them.
        A snapshot archive changes no research state.
    - id: PD-2
