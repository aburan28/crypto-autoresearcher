  context: >-
    BATCH-065 searched for structural ingredients for prime-field ECDLP sub-rho.
    Result: SVP superlattice blocked (explicit lattice obstruction); 2025-2026
    corpus incomplete; Wesolowski Component 1 absent for ECDLP. One new unexplored
    lane identified: Bourgain-Gamburd-Sarnak (BGS) thin-set distribution bounds.

  decision: admit_bgs_direction
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    Admit IDEA-20260804-04e6e6 (BGS thin sets) as a fresh high-priority direction.
    The SVP superlattice transfer is formally closed (explicit-lattice obstruction).
    External literature survey (2024-2026 arXiv/ePrint) is a recommended action
    before the next ideation batch. GOAL-ECDLP-001 stays active.

  svp_transfer_disposition: >-
    BLOCKED: The Gao-Feng-Hu superlattice schema requires an explicitly constructible
    lattice. The DLP lattice cannot be constructed without knowing k; testing membership
    is the DLP itself. Three independent obstacles block the transfer.

  bgs_direction_rationale: >-
    Bourgain-Gamburd (and Bourgain-Gamburd-Sarnak) results bound the mixing time of
    random walks on linear groups over F_p and establish "spectral gap" / "expander"
    properties for Cayley graphs of SL_2(F_p) and elliptic curve groups. These results
    give quantitative bounds on how quickly random walks on E(F_p) equidistribute.

    Relevance to ECDLP: If a STRUCTURED subset S ⊆ E(F_p) equidistributes
    "faster than random" under random isomorphisms (in the sense of Bourgain-Gamburd
    spectral gaps), then it might provide a structural advantage for relation finding
    that exceeds the birthday bound. This is the "thin set" approach: find a set S with
    |S| = N^alpha and "above-random" equidistribution properties.

    Key questions: (1) Does any structured set S ⊆ E(F_p) have equidistribution rate
    faster than N/|S| (which would imply a collision event occurs faster than birthday)?
    (2) Is there a Bourgain-Gamburd type spectral gap for EC isogeny walks that could
    give a faster mixing time than the generic birthday paradox?

    The BGS direction has NOT been tried in this program's ECDLP campaign. It requires
    algebraic number theory / additive combinatorics tools beyond the standard index
    calculus framework.

  exact_next_action: >-
    Dispatch a mathematical analysis of the BGS/thin-set direction for ECDLP in BATCH-066.
    Specifically: (1) State Bourgain-Gamburd's spectral gap theorem for SL_2(F_p) and
    its analogue for elliptic curve groups. (2) Determine whether any structured subset
    of E(F_p) equidistributes faster than N/|S| under the random walk. (3) If yes:
    propose a hypothesis and minimal discriminating test. If no: record as a named
    obstruction.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
