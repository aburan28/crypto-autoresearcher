  limitations:
    - >-
      ONE CURVE, ONE CELL. Nothing transfers beyond n = 17 without
      HEUR-CERTBIN-TS3, which is untested. Cross-curve replication, the
      Koblitz form and random-V belong to later contracts.
    - >-
      NO STABLE-CORNER REPRODUCTION IN THIS CONTRACT. The idea's baseline
      embedding reproduces "stable trace" in regime B before believing
      "unstable" in regime A. That is Stage 2. Here, a regime-A instability
      reading rests on the instrument checks (C-FIX, C-ORACLE, C-AFF, C-DET,
      C-PASS, C-PROPS, C-UNIF) instead. The evidence review must weigh that.
    - >-
      PS2 MAY BE VACUOUS. If no unsatisfiable reference reaches 1 in R_D at
      D <= 4, Proposition S's T_set clause is not exercised at this cell. The
      semi-regular Boolean Hilbert series gives d_reg = 5. PS0, PS1 and PS3
      still apply.
    - >-
      The satisfiability stratification is ALGEBRAIC (Boolean solutions of the
      descended system), as Proposition S requires. Relation yield (rational
      lifts) is recorded but is not the arm variable.
    - >-
      KN-LIT-275 (Joux-Vitse ePrint 2010/158) was not read at source by anyone
      in this program. Its reported c(p)^{n_step} success heuristic is a
      pointer only. If confirmed, regime A would be its p = 2 corner. Nothing
      here relies on it.
