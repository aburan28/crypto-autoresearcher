  rationale:
    - >-
      WHY THIS, NOW. The user asked for it. It is ECC-area work. And it is the
      cheapest valid discriminator for a design premise that would otherwise
      absorb GPU engineering. The exact part (Proposition S) and the sizing
      arithmetic already say much of the answer on paper. Stage 1 measures the
      one open number, the retention, together with the saving ratio that
      bounds the whole constant at stake.
    - >-
      TARGET-PROFILE HONESTY. This is not exponent-targeting work, and it is
      not ranked as if it were. It is a constant-factor go/no-go, dominated by
      rho, with sota_delta zero. It is admitted on user request and on its
      falsification value per unit cost. It does not rank above
      exponent-targeting ECC lanes at the next portfolio pass by virtue of
      this approval. No conditional complexity result is being dispatched, so
      the paired heuristic-validation rule is satisfied trivially: the
      experiment IS the validation of HEUR-CERTBIN-TS1 at this cell.
    - >-
      DESIGN REFINEMENTS OVER THE IDEA TEXT. All were made before any data. All
      tighten instruments; none moves a threshold.
      (1) A fourth granularity, T_ops. T_strict fixes only pivot rows, while a
          fixed-schedule branch-free replay is valid only if the XOR sets also
          match.
      (2) An exact fixed-schedule replay through the affine decomposition
          M_D(r) = M_0 + sum r_j M_j. This makes each replayed pivot entry
          exactly affine in r and yields K_exact and K_rank beside the
          preregistered sampled K.
      (3) A second, exhaustive satisfiability oracle, required to agree with
          the O(2^l) oracle. It doubles as a Weil-descent correctness check.
      (4) Proposition S's regime-A consequences as PS0-PS3, including the
          always-applicable "no satisfiable instance has 1 in R_D". This is
          needed because PS2 may be vacuous if D* > 4.
      (5) Sampling WITHOUT replacement in x_R. The subgroup has only about
          2^15-2^16 distinct x-values, and duplicate targets would manufacture
          trace collisions.
      (6) Three affine-null draws with paired r bytes, instead of one.
      (7) The saving-ratio identity saving_set = C_D R_D / rank_D^2, which is a
          free exactness check.
      (8) A mechanical rule for M3 at zero counts, fixed now so that it cannot
          be chosen after the fact.
    - >-
      SCOPE STATEMENT, carried into every deliverable. Claim tier toy. This is
      a scoped measurement of THIS solver's trace stability on THIS family at
      this cell, never an ECDLP cost claim. sota_delta is zero. Parallel
      Pollard rho dominates. No deployed curve is affected.

