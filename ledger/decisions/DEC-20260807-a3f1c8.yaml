coordinator_decision:
  id: DEC-20260807-a3f1c8
  goal_id: GOAL-SSI-001
  context: >-
    Evidence review for EXP-SSI-9b542d (Wesolowski crossover locus, REPAIRED).
    This experiment was the repair of EXP-SSI-697354, which was rejected by
    DEC-20260806-a00a28 on independent red-team review. The repair
    (TASK-20260806-55cf1f) was independently verified by EV-SSI-a42460 before
    execution was authorized. RUN-SSI-9b542d-001 completed in 8.71s (budget 600s),
    all blocking gates PASS, MONO-3 non-blocking finding recorded. The run maps
    the crossover locus between P^{1/3} and vOW cost models across a 4480-cell
    grid at five NIST levels.
  decision: accept
  decision_scope: >-
    RUN-SSI-9b542d-001 ACCEPTED AS VALID EVIDENCE at strength PRELIMINARY and
    claim_tier MEDIUM. The run demonstrates that (a) the convention choice dominates
    the sign of the cost comparison at all tested cells, (b) the advantage grows
    with security level, and (c) all crossover cells are memory-infeasible by 25+
    bits. This closes the "crossover locus" sub-question of H-SSI-7fe2bf within its
    stated scope. It does NOT support any security claim, parameter recommendation,
    or crypto-scale cost assertion.
  target_ids:
    - EXP-SSI-9b542d
    - RUN-SSI-9b542d-001
    - H-SSI-7fe2bf
    - GOAL-SSI-001
    - EV-SSI-b7c3a1
  rationale:
    - >-
      ALL BLOCKING GATES PASS. BOUNDARY-CONDITION-GATE demonstrates both formula
      directions (corrected=0.0, superseded=0.5*L_mem(P)) exactly. REPRODUCTION-GATE
      confirms the corrected formula's boundary behavior. XCHK-1 confirms inter-law
      consistency. MONO-1/2/4/5 all pass.
    - >-
      MONO-3 IS A LEGITIMATE FINDING, NOT A DEFECT. The non-monotonicity of p*(w) is
      a property of the cost model's locus-penalty feedback, not a computation error.
      It was correctly classified as non-blocking in the specification and is recorded
      as a structural observation in the evidence record.
    - >-
      THE CONVENTION-DOMINANCE RESULT IS CLEAN AND DECISION-RELEVANT. All 15 feasible
      cells show the same sign, the advantage grows monotonically with NIST level
      (9.5/22.0/38.8 bits), and the null displacement confirms the per-entry correction
      is load-bearing (> 11 bits). This validates the thesis that cost-model convention
      matters more than implementation differences in this parameter space.
    - >-
      MEMORY INFEASIBILITY CAPS THE PRACTICAL RELEVANCE. At 25.4 bits above global
      storage at NIST-I (the BEST case), no crossover cell corresponds to a realizable
      attack. The entire comparison is between cost models of unrealizable algorithms.
      This bounds what this result means: it is a statement about analytical cost
      functions, not about deployable attacks.
    - >-
      CLAIM CEILING IS MEDIUM, NOT CRYPTO. The cost formulas are evaluated at crypto-
      scale P values, but their calibration constants derive from measurements at
      p <= 2^40. The claim tier is honestly medium: the formulas themselves are clean,
      but a systematic error in their inputs would shift everything. This is an honest
      strength assignment and not a finding of weakness.
  evidence_refs:
    - EV-SSI-b7c3a1
    - EV-SSI-a42460
    - experiments/EXP-SSI-9b542d/runs/RUN-SSI-9b542d-001/execution_report.yaml
    - experiments/EXP-SSI-9b542d/runs/RUN-SSI-9b542d-001/raw-result.json
  limitations:
    - >-
      No independent post-execution review of this run. The pre-execution contract was
      independently verified (EV-SSI-a42460), but the run output itself has not been
      reviewed by a non-originating party. This is acceptable for a preliminary evidence
      record but would need to be addressed before any promotion to replicated or strong.
    - >-
      Cost model calibration constants derive from p <= 2^40 measurements. A systematic
      bias in those constants shifts all crossover cells in the same direction.
    - >-
      MONO-3 non-monotonicity means the locus in some neighborhoods is multivalued.
      The 80 MULTIPLE_ROOTS cells (1.8%) require bracket reporting, not point estimates.
    - >-
      No operational recommendation follows. Memory infeasibility at all levels means
      this result is a statement about the shape of cost functions, not about attacks.
  next_actions:
    - >-
      CROSSOVER LOCUS SUB-QUESTION IS CLOSED WITHIN ITS SCOPE. The experiment answered
      its stated question: where does the assessed method transition from cheaper to
      more expensive? Answer: at 288/4480 cells, all memory-infeasible, with the
      convention choice dominating.
    - >-
      KNOWLEDGE PROMOTION: The convention-dominance finding and the memory-infeasibility
      scope statement are the decision-relevant outputs. These are not promoted yet
      because no independent post-execution review exists.
    - >-
      NEXT FOR GOAL-SSI-001: The crossover sub-question does not advance the exponent
      search. The Frobenius-degree census (EXP-SSI-6a2619) and any successor at larger
      primes are higher priority for the goal's main objective. The crossover result
      should be noted as supporting material in any future synthesis but does not drive
      the next experiment.
    - >-
      IF REPLICATION IS DESIRED: control for ANOM-002 (multiple roots) by
      characterizing the multivalued regions more finely, and run a sensitivity analysis
      varying the calibration constants within their published uncertainty bounds.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No independent post-execution review exists. The convention-dominance finding and
      memory-infeasibility scope statement are real and decision-relevant, but promoting
      them from a single unreplicated run without independent validation would set a
      precedent that undermines the corpus. Hold for independent review or replication.
  decided_by: coordinator
  decided_at: '2026-08-07'
