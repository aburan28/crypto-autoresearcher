    keep its path_sha256, each path is checked against the LATEST verified
    receipt that binds it, in commit order. For this lane, that order is
    5ea531, then 398fce, then 70f831, then 57637b.
    For experiments/EXP-PFDR-0b3699/implementation-notes.yaml, two
    conditions both hold:
