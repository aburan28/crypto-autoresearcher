         are an exact byte prefix of the file (AMD-20261008-9c080d A-6).
    Every other path keeps the sha256 of the latest receipt that binds it.
    Any mismatch is still a STOP. No path is exempted, and no other path
    may have changed between receipts.
    The receipt names clause K-1 and records, for implementation-notes.yaml,
    both bound sha256 values, the current sha256, the prefix length and
    the result of (ii).

