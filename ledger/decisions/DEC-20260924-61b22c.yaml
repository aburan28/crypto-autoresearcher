  rationale:
    - >-
      THE INCORPORATED READINGS DECIDE, AND THEY STAYED MONOTONE. RFR-2 was
      written before either review; the review named planned-basis refusals
      with sequences from frozen code, reachable on ordinary operation. The
      draft is not approvable as written, and the remedy is the one the
      readings name.
    - >-
      NO READING IS NARROWED AFTER THE FACT. (iv) stays literal; RFR-2 is not
      limited to FAILs caused by added conditions; PB-4 is ruled a refusal as
      worded although it is definitional; an unexamined sub-item is not
      counted as a confirmation; RFR-4 is not satisfied by substituting the
      earlier review.
    - >-
      THE PART THAT MATTERS MOST HELD. RG-1, which removes the foreign-process
      fail-open class by evidence the escaped process cannot forge, survived an
      independent attack whose known-answer control showed it could see a
      weakening of exactly that rule. The failure is one attribution sentence.
    - >-
      A RULE ADDED TO REPAIR A FAIL-CLOSED FINDING IS ITSELF A NEW CONDITION
      ON PASS. FC-7 (a conditional stop) was repaired by RG-4 with a rule that
      FAILs every file it cannot attribute; checked against the frozen code's
      ordinary outputs it refuses planned bases. The successor's review is
      therefore asked to apply the attribution to the file listings of real
      archived packages, not only to rule text.
    - >-
      DEFINITIONAL EXCLUSIONS ARE LIMITED. The route RG-2 used (narrowing the
      rule the definition references) is accepted, with four stated
      conditions, so that it cannot be used to define away a refusal of an
      ordinary basis; PB-2 and PB-3 are repaired by changing what the rule
      computes.
    - >-
      FD IS KEPT, NOT SPENT, AND ITS TRIGGER IS NOW CONCRETE: a gapattr
      fail-open in the foreign-process class, or a DV-18 (f) (xiv) / (xv) STOP
      on the r4 host.
    - >-
      THE LANE STAYS OPEN. Nothing measured D. NO SECURITY READING: toy
      EcGFp5-shaped arithmetic with known scalars; nothing transfers to
      p = 2^64 - 2^32 + 1.

