  rationale:
    - >
      G1/M-A is satisfied at the tested scope: in-box 24/24, planted meets
      3/3/4 vs E = 5.0 (P(meets <= 3) ~ 0.2649), audit arithmetic blind
      re-derived and validator-reproduced from the predecessor committed bytes.
      The predecessor zero is attributed to square-pattern incidence density,
      not sampler geometry, at the audited scope -- discharging the J4-F3
      route of the predecessor review round.
    - >
      The existence half of M-B is satisfied at n=6 at the tested scope: 28
      certified instances, every certificate exactly rechecked, one instance
      blind re-derived from the mechanism statement alone (exact roots
      c = -28/13, c = 324772/376343; producer matches -28/13). Measured
      construction incidence 2.8e-3 per b-tuple vs the draw-route bound 3e-4
      per b-tuple (EV-ECRANK-8b35bb, per-b-tuple units; red-team J4d) --
      construction-over-draw at the tested scope, with the different-n caveat
      disclosed (measurement at n=6, bound measured at n=8).
    - >
      G4's control failures are adjudicated CONTRACT-DESIGN DEFECTS, not
      implementation defects (red-team J1 exact derivation): at n=6 the
      d=(1..1) control objects have deg s = 2 (conics, genus 0), so
      degenerate_deg_s_2 is the mathematically correct rejection and the
      expected certified total 5 was unsatisfiable through any pipeline
      enforcing deg s in {3,4}; at n=8 the objects are elliptic (deg s = 3)
      and all shortfalls are F_l-certifier lower-bound limits (prime bound
      1500), reproduced 8/8 with the committed certifier and consistent with
      the closed form. The pipeline and solver behaved correctly on every
      control.
    - >
      INVALIDATION ADJUDICATION (IV-1 vs F4 textual conflict). Reading A
      (IV-1 literal, "any control failure voids ALL runs") proves too much:
      it voids runs whose checks passed (R1/R2/R4/R6) without textual warrant
      (red-team J4c proves-too-much control). Reading B (F4, pipeline-defect
      premise) has a premise falsified by the exact derivation. READING C IS
      ADOPTED (F4 with the contract-design-defect premise): no run is
      "affected" in the sense F4 names; no run is voided; all eight survive
      as measurements; G4's pre-registered check is recorded as failed-as-
      written with the adjudication attached. This is a Coordinator ruling on
      a frozen-contract textual conflict: it re-scores no run, edits no
      protocol field, and the successor contract repairs the control
      expectations by versioned amendment (additive; rule: frozen protocols
      are amended, never rewritten).
    - >
      Why replicate and not support: this is a single execution round (R4 is
      a determinism replay, not replication); the result is surprising
      (construction incidence 9.3x above the draw-route bound) and the
      first-observation rule for surprising results requires independent
      replication before any status beyond analyzed; counts are lower bounds
      (detection path unvalidated, red-team J4a breaks); and the HEUR-1
      decade-ratio tension is unresolved. Hypothesis moves specified ->
      analyzed; experiment moves approved -> analyzed; neither claim is
      promoted.
    - >
      The n=8 zero is inert in both directions (cap breach PD-2 plus
      integer-box narrowing PD-3; F3_n8 did not fire): neither evidence of
      absence nor falsification. Nothing at n=8 is claimed.
    - >
      C1 stays OPEN and UNPROMOTED; IMP-2 (review-breakthrough at max, never
      degraded) still gates the C1-closure candidate of DEC-20260905-7adca0.
      No breakthrough, closure, or established-evidence contradiction is
      proposed by this batch, so no review-breakthrough gate is engaged.
