      approved repair.
    - >-
      No public rank-30 baseline or literature statement supports a research
      conclusion until its source has actually been retrieved and recorded with
      citation provenance.
    - >-
      The approved campaign budget bounds this campaign projection only.
      Exhausting it supports closed_at_budget or paused status, never a
      mathematical rejection and never a completion claim.
