  rationale:
    - >-
      Open GOAL-ECQ-bef741 as a fresh random-suffix successor under
      RQ-ECQ-80f23c, continuing only the unresolved C1 scope of GOAL-ECQ-001.
      Do not edit, reopen, or supersede GOAL-ECQ-001's completed C2 result.
    - >-
      Bind the opening to
      origin/main@c57d838d910c42d089632457c97adc3a0100b948. The isolated
      worktree advanced from 76b860c1ba1364b6a74695a09d1ae995a6ba8ebe to that
      authority by a clean fast-forward, so no pushed research history was
      rewritten and no merge conflict requires an immutable-record correction.
    - >-
      The production random-goal allocation and validation support is present
      on authoritative main. The known Git 2.55 test-observer/full-suite gap is
      a nonblocking infrastructure residual because the affected behavior
      passed targeted coverage on Apple Git 2.39.5 and official Linux Git
      2.55.0 and no production allocation or validation contradiction has been
      observed.
    - >-
      Use a zero-new-error shield around inherited red state: every new file
      must parse, every identifier must pass its allocator check, direct
      new-goal validation must pass, inherited diagnostic fingerprints must be
      unchanged from the clean bound base, and the opening archive must change
      exactly its declared paths with verified hashes.
    - >-
      Authorize only the zero-experiment opening and the bounded no-experiment
      protocol-design task. The recommended first executable batch remains
      ineligible until its protocol is frozen, snapshot-archived, independently
      reviewed and validated, approved by a new Coordinator decision, and
      ledger-archived.
    - >-
      Strengthen the inherited C1 completion boundary: a numerical nonsingular
      regulator may guide search but is not proof. Completion requires an exact
      nonsingular curve, 31 exact on-curve rational points, an unconditional
      exact independence certificate, rigorous torsion treatment, reproducible
      artifacts, independent validation and red-team review, and a nondegraded
      review-breakthrough assessment at max.
