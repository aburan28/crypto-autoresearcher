  context: >-
    The persistent user objective is to generate an elliptic curve over Q with
    rigorously verified Mordell-Weil rank greater than 30. GOAL-ECRANK-001 and
    GOAL-ECRANK-002 concern number-field scopes, while GOAL-ECQ-002 concerns
    ICARM size-relative cells and does not target rank at least 31. The
    completed GOAL-ECQ-001 leaves its criterion C1, construction of a
    rank-at-least-31 curve over Q, open and directs a successor under
    RQ-ECQ-80f23c. Current origin/main contains the random-suffix GOAL allocator
    and validator support. Its remaining Git-version test-observer and inherited
    merge-hygiene failures are infrastructure residuals and do not constitute
    mathematical evidence.
  decision: approve
  target_ids:
