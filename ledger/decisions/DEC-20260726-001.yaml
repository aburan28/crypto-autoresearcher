coordinator_decision:
  id: DEC-20260726-001
  context: >-
    EXP-FCP-001 (fixed-curve preprocessing pilot) produced 72 completed_valid
    runs across bit sizes 8/10/12/14/16, seeds 1/2, factor base 14, m=2 S_3
    decomposition, with Pollard-rho baselines. The Coordinator independently
    verified four certificates (two decomposition, two discrete-log) and
    confirmed control comparability across all matched fixed/naive pairs. The
    data show no robust constant-factor improvement from fixed-curve factor-base
    preprocessing over per-target rebuilding. However, the experiment was
    executed without a frozen protocol (no specification.yaml), all runs carry
    dirty: true (the harness code was uncommitted at run time, first committed
    in e648670d after the runs), no formal hypothesis record exists, and no
    execution_report was produced. These governance gaps limit the evidence to
    preliminary strength and prevent a scoped rejection of the preprocessing
    direction.
  decision: pause
  target_ids:
    - EXP-FCP-001
    - RQ-ECDLP-001
  rationale:
    - >-
      The runs are valid: 72/72 completed_valid, certificates independently
      verified, controls comparable, seed integrity confirmed, raw/summary
      agreement checked. The empirical observation is trustworthy as a
      descriptive measurement.
    - >-
      No robust constant-factor improvement from fixed-curve preprocessing was
      observed. The fixed-vs-naive wall-time ratio is inconsistent in direction
      across bit sizes (2.31x slower at bits 8, 0.54x faster at bits 10, within
      1.4x at bits 12-16). Decomposition success is identical between modes at
      every bit size. Factor-base construction cost (~0.0001 s) is negligible
      relative to Groebner solving (~0.04-0.11 s).
    - >-
      pause is chosen over reject_scoped or weaken because no frozen protocol
      existed: there is no pre-defined success threshold, falsification
      criterion, or stopping rule against which to test the null. A scoped
      rejection requires a pre-registered prediction that the data falsify;
      here the observation is descriptive only. The evidence is preliminary,
      not replicated or strong.
    - >-
      pause is chosen over expand because the protocol governance gaps must be
      repaired before any follow-up can produce evidence of higher strength.
      Committing more runs under the same informal protocol would not advance
      the evidence hierarchy.
    - >-
      The direction is not closed: the absence of a preprocessing win at toy
      scale (8-16 bit fields, factor base 14, m=2) does not bound behavior at
      larger scale, different factor-base sizes, higher arity, or multi-target
      amortization strategies. A properly specified follow-up could test
      whether factor-base construction cost becomes dominant at larger field
      sizes.
  evidence_refs:
    - EV-FCP-001
  limitations:
    - >-
      No frozen protocol (specification.yaml) existed; the experiment was not
      routed through the /design-experiment lifecycle. Metrics are descriptive,
      not tested against a pre-defined threshold.
    - >-
      dirty: true on all 72 runs; the manifest commit SHA (16c37dcf) is a
      ledger-only commit, and the harness code was first committed in e648670d
      after the runs. The exact code that produced the results is not pinned by
      the manifests.
    - >-
      No formal hypothesis record (H-*) exists; the evidence binds to
      RQ-ECDLP-001 as the closest research question.
    - >-
      Only 2 seeds (1 for bits 12), 3 targets per curve, factor base 14, and
      m=2 were tested. The wall-time distributions are noisy and dominated by
      single-target outliers.
    - >-
      Claim tier is toy (max field bits = 16); nothing supports medium-scale,
      cryptographic-scale, or universal ECDLP claims.
  next_actions:
    - >-
      If this direction is to be pursued: create a formal hypothesis record
      (H-FCP-001) with a pre-registered prediction, success threshold, and
      falsification criterion via the /design-experiment lifecycle. The
      hypothesis should specify whether the prediction is about wall-time
      ratio, decomposition success rate, or total amortized cost per target at
      a defined scale.
    - >-
      Re-run the experiment under a frozen specification.yaml with a clean
      commit (dirty: false) so that the manifest commit SHA pins the exact
      code. Consider extending to larger bit sizes (20-28) where factor-base
      construction cost may become non-negligible relative to Groebner solving.
    - >-
      If the direction is not pursued: the 72 runs remain as a preliminary
      descriptive observation in the ledger. No evidence promotion is warranted.
    - >-
      RQ-ECDLP-001 remains active; this experiment contributes a preliminary
      data point on preprocessing cost behavior but does not change the
      question's status.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      EV-FCP-001 is preliminary empirical evidence (valid runs but limited
      instances, no frozen protocol, dirty code) with a neutral direction and
      a pause decision. Strength is below replicated/strong, no
      support/reject_scoped finding exists, and the observation that
      factor-base construction is negligible at toy scale is not durable beyond
      the tested 8-16 bit range.
  decided_by: coordinator
  decided_at: "2026-07-26T23:00:00-07:00"
