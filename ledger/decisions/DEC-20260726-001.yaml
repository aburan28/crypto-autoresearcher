coordinator_decision:
  id: DEC-20260726-001
  context: >-
    TASK-20260726-001 asked for an approval decision on a six-experiment suite auditing
    Jao-Miller-Venkatesan 2005 (arXiv:math/0411378v3), drafted by the top-level session in
    research/JMV2005_experiment_suite_20260726.md, with RQ-JMV-001 and EXP-JMV-001..006 all
    at status draft, approved_by null. Nothing has been executed; no evidence record exists
    for anything in this suite. This decision admits the research question, fixes its goal
    attachment, creates two hypotheses, and approves exactly two of the six experiments
    under named claim tiers and boundaries. The other four are handled in DEC-20260726-002;
    the Figure 1 scouting result and the KN-LIT ingestion are ruled on in DEC-20260726-003.
  decision: approve
  target_ids:
    - RQ-JMV-001
    - H-JMV-001
    - H-JMV-002
    - EXP-JMV-001
    - EXP-JMV-004
  rationale:
    - >-
      RQ-JMV-001 IS ADMITTED (status draft -> active) as a STANDALONE track. It does NOT
      attach to GOAL-ECDLP-001 and it does not attach to GOAL-CRYPTO-001.
    - >-
      Goal attachment, reason 1 (structural, not budgetary). GOAL-ECDLP-001's completion
      criteria require either an independently reproduced attack improvement with complete
      end-to-end cost accounting, or a novel technique that concretely improves a
      decision-critical ECDLP attack stage or rigorous cryptanalytic verification.
      RQ-JMV-001's own constraint states that no experiment under it can produce an ECDLP
      attack or an attack-cost improvement. A question that cannot in principle satisfy
      either completion criterion must not be attached to that goal; doing so would be goal
      drift and would make a paused campaign appear to have live qualifying work.
      GOAL-CRYPTO-001 is excluded for the same reason - its criteria demand a
      certificate-verified, fully charged advantage over matched Pollard rho above 96 bits.
    - >-
      Goal attachment, reason 2 (budget, stated explicitly as the handoff requires).
      GOAL-ECDLP-001 is status paused with campaign_budget.maximum_batches = 3 fully
      consumed (BATCH-001/002/003 all checkpointed) and its pause condition "the three-batch
      campaign budget is exhausted without meeting a positive completion criterion" already
      fired under DEC-20260724-008. Its next_action explicitly forbids activating attempts
      while paused. I create no fourth batch, reopen no campaign budget, and spend none of
      that goal's 14400 s. Separately noted as an open hygiene item, not repaired here:
      GOAL-ECDLP-001's BATCH-003 checkpoint still carries ledger_commit null, so that goal's
      own checkpoint is incomplete and is a bad place to bolt new work onto.
    - >-
      Budget provenance for what is approved here. The two approved experiments total under
      2 CPU-hours of deterministic arithmetic with no sampling and no seeds. They are funded
      under the standalone RQ-JMV-001 track with a hard cap of 2 CPU-hours and 10 runs across
      both, not under any goal campaign budget. This is deliberately small: the program is at
      a documented saturation state and a literature/reduction audit has to earn its keep at
      the margin, not at campaign scale.
    - >-
      EXP-JMV-001 APPROVED (claim tier crypto; boundary: exact arithmetic about the exact
      named curves only). It is deterministic, exact, cheap, carries a genuine positive
      control (the Koblitz d_pi = -7*c_pi^2 identity), and refuses the one dishonest move
      available to it (reporting a censored factorization as c_pi = 1). Its headline test is
      a residue computation mod 9 that an independent reader re-checks in one line - i.e. it
      admits a counterexample certificate in the sense of docs/claims-and-verification.md,
      which is the strongest refutation artifact this class of claim can carry.
    - >-
      EXP-JMV-004 APPROVED FOR BRANCH (a) ONLY (proven explicit constants). Branch (b), which
      consumes a measured constant from EXP-JMV-003, is NOT approved and is blocked pending
      DEC-20260726-002. Branch (a) is under one CPU-hour of deterministic arithmetic, has no
      dependencies, and asks the one question in this suite that is both cheap and genuinely
      unanswered in the literature: whether the PROVEN eigenvalue separation underlying
      Corollary 1.2 is non-vacuous at the sizes anyone deploys.
    - >-
      Sequencing judgement, against the suite doc. The doc calls Track C (EXP-JMV-006)
      "highest research value". I do not accept that. Track C is the most expensive item in
      the suite, its own claim boundary concedes that BOTH outcomes are compatible with
      Theorem 1.1, and the prior (Corollary 1.2 plus EV-ISO-001) favours a null that would
      close toy scope only. The suite's real content is the cheap deterministic arithmetic in
      EXP-JMV-001 and EXP-JMV-004 branch (a). Approvals follow that ordering, not the doc's.
    - >-
      Non-duplication checked independently of the suite doc's Section 7 audit and found
      sound for the two approved experiments. EV-ISO-001 / H-ISO-001 (rejected_scoped) is a
      3-neighbour PDP/yield probe at p ~ 2^13 and shares no metric with either approved
      experiment. ISOWALK-C1 exists only as unscheduled proposal G30-019 in
      research_goals_20260723.md (non-backtracking isogeny-walk collision exponent vs
      birthday); it is disjoint from a conductor audit and from a reduction cost model.
      EXP-ISADV-001 concerns planted-advice transfer, absent here. KN-TECH-024/029 and
      KN-OPEN-013 are supersingular over F_{p^2}; JMV is ordinary prime-field horizontal
      isogenies on class-group Cayley graphs.
  evidence_refs:
    - "NONE. No EV-* record exists for any part of this suite and nothing has been executed. The inputs to this decision are design documents only: research/JMV2005_experiment_suite_20260726.md, ledger/questions/RQ-JMV-001.yaml, experiments/EXP-JMV-001..006/specification.yaml, experiments/EXP-JMV-001/cpi_audit.py (SCOUTING SCRIPT, not a run)."
    - "Prior records consulted for non-duplication and prior expectation: EV-ISO-001, H-ISO-001 (rejected_scoped), DEC-20260724-008 (GOAL-ECDLP-001 pause)."
  limitations:
    - No experiment in this suite can produce an ECDLP attack, an attack-cost improvement, or any result bearing on GRH. No record, artifact, or summary arising from it may be framed that way, and it must not be written up as evading the D1 data-movement or BAR-AMORT-D2 exponent-neutrality barriers, which concern attacks.
    - "APPROVAL IS OF SPECIFICATION VERSION 2, NOT VERSION 1. TASK-20260726-001 gives me write scope on ledger/decisions/, ledger/questions/RQ-JMV-001.yaml, and ledger/hypotheses/ only. I have not edited experiments/. No run may start until a task with write scope on experiments/ updates each approved spec to version 2 with status approved, approved_by coordinator, the hypothesis_id assigned here, and every binding condition below, and that update is snapshot-committed and verified."
    - "BINDING CONDITION C1 (applies to both approvals; the single largest validity risk in the suite and absent from all six drafts). SOURCE-TRANSCRIPTION CONTROL: every statement taken from arXiv:math/0411378v3 that a conclusion depends on - the Figure 1 rows used, Theorem 1.1, Corollary 1.2, Proposition 3.1's walk-length inequality, Lemma 4.1's eigenvalue bound and its normalization - must be archived verbatim in the run artifacts with version, section, and figure/equation numbers, and must be checked against the source by a reviewer who did not produce the transcription, BEFORE any conclusion is recorded. This suite's headline claims are claims about someone else's text; an unchecked transcription would manufacture a false erratum or a false vacuity result out of our own reading error."
    - "BINDING CONDITION C2 (both approvals). Claim-tier and framing discipline as stated per experiment below. No promotion of any result above its approved tier, and no attack framing of any kind."
    - "EXP-JMV-001 CONDITION D1 (conductor definition defect). The suite doc and cpi_audit.py define c_pi as 'the largest integer whose square divides d_pi'. That is not the conductor. The conductor is the unique f with d_pi = f^2 * d_K and d_K fundamental; if d_pi = s^2 * u with u squarefree and u = 2 or 3 (mod 4) then f = s/2, not s. Every reported c_pi, P(c_pi), and level count must use the conductor definition, with the naive square part reported only as a secondary quantity. The mod-9 scouting argument is unaffected (3 is odd), but the table values and the level counts are not."
    - "EXP-JMV-001 CONDITION D2 (level count). Define level count explicitly as the number of orders O with Z[pi] contained in O contained in O_K, i.e. the number of divisors of c_pi, and report it as censored/bounded whenever c_pi is censored. The spec's notes forbid reporting a censored c_pi as 1 but say nothing about the derived level count - which is exactly the quantity the 'single-level' census reading depends on."
    - "EXP-JMV-001 CONDITION D3 (binary-field scope). inputs.curves spans K-*, B-*, and the IPSec F_{2^155}/F_{2^185} curves, but the only referenced implementation is prime-field sympy code. Either declare an explicit GF(2^m) dependency (named module or Sage) and define the [n]G = O control over binary fields, or restrict the approved scope to the prime curves and record every binary row as not_attempted - NEVER as agreeing with Figure 1. Note the consequence: the Koblitz d_pi = -7*c_pi^2 positive control lives on the binary rows, so the restricted option removes the pipeline's positive control and must substitute an independent one on prime curves (e.g. a curve with known CM discriminant)."
    - "EXP-JMV-004 CONDITION E1. Branch (a) only. Branch (b) is blocked."
    - "EXP-JMV-004 CONDITION E2 (normalization reconciliation). The spec writes the degree as 'k = lambda_triv ~ pi(m)/2' while EXP-JMV-003 uses a '(1/e) * sum' eigenvalue normalization. A factor of 2 in the degree convention - whether a split prime contributes one generator or two, whether the generating set is symmetric - moves log(k/c) across zero, which IS the headline quantity. Fix one stated convention, reconcile it in writing to the paper's own statements of Prop 3.1 and Lemma 4.1, and report any conclusion that flips under the convention as convention-dependent, exactly as the spec already requires for the logarithm base."
    - "EXP-JMV-004 CONDITION E3 (claim tier - the draft's tier is NOT approved). The draft asserts claim_tier crypto. EXP-JMV-004 instantiates zero curves and measures nothing; per docs/claims-and-verification.md the tier is a function of the instances actually tested, and this one tests none. Approving it at crypto tier would be the suite's own failure mode with the scale set to zero. It is approved instead as an ANALYTIC DERIVATION: any resulting evidence record must be type theoretical, proof_status derivation, proof_refs pointing at the archived cost_model.md, and must carry the boundary 'a claim about the stated cost model, with no tested instance at any size'. Every numeric statement about q = 2^256 must be phrased as an evaluation of the model at that parameter, never as a measurement on P-256. If branch (b) is later unblocked it inherits the medium ceiling of EXP-JMV-003's measurements."
    - "EXP-JMV-004 CONDITION E4 (precomputation term). The per-step cost model must state whether Phi_l is assumed precomputed and available. At the m values the theorem's generator set forces at cryptographic q, Phi_l has on the order of l^2 coefficients and is not storable; a cost that silently assumes free precomputation is not a cost. Report the precomputation term explicitly or declare the assumption in cost_model.md."
    - Toy-scale and zero-scale evidence is never crypto-scale validation. EXP-JMV-001's crypto tier covers arithmetic on named curves and nothing about their dlog difficulty.
  next_actions:
    - "Coordinator: snapshot-commit this decision, DEC-20260726-002, DEC-20260726-003, H-JMV-001, H-JMV-002, and the admitted RQ-JMV-001 as one ledger archive touching only those declared paths. Nothing below starts before that commit is verified."
    - "Then issue a spec-update handoff (write scope: experiments/EXP-JMV-001/, experiments/EXP-JMV-004/ ONLY) producing specification.yaml version 2 for both: status approved, approved_by coordinator, hypothesis_id H-JMV-001 and H-JMV-002 respectively, conditions C1-C2, D1-D3, E1-E4 written into the spec, and EXP-JMV-004's claim_tier field corrected per E3. Snapshot-commit before any run."
    - "Then dispatch EXP-JMV-004 branch (a) to the executor FIRST (under 1 CPU-hour, no dependencies, highest insight per unit compute). Then EXP-JMV-001. Do not run them concurrently in one worktree."
    - "Reserve an independent reviewer for condition C1 on both experiments, and an independent validator for EXP-JMV-001's run integrity, before any evidence review. Per AGENTS.md core rule 12, a claimed erratum against a published paper and a claimed vacuity of a published corollary both require independent review-xhigh review by an agent that did not originate the claim."
    - "Do not schedule EXP-JMV-002, 003, 005, or 006. See DEC-20260726-002."
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No evidence record exists and nothing has been executed. This is an approval decision,
      not an evidence review, so there is no observation of any strength to promote.
      Promotion becomes possible only after EXP-JMV-001 and EXP-JMV-004 branch (a) produce
      reviewed, validated runs. The one knowledge action authorized today is the KN-LIT
      ingestion of JMV 2005 itself, ruled on separately in DEC-20260726-003, which is corpus
      coverage rather than promotion of an internal finding.
  decided_by: coordinator
  decided_at: "2026-07-26"
