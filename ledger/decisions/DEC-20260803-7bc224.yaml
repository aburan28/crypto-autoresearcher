coordinator_decision:
  id: DEC-20260803-7bc224
  goal_id: GOAL-MLKEM-003
  batch_id: BATCH-014
  evidence_id: EV-MLKEM-c50030
  recorded_by_task: TASK-20260803-0d2548
  archive_kind: ledger
  recorded_at: '2026-08-03'
  decision: refine
  decision_label: deep_tail_is_poisson_dof_value_not_reproducible_three_coordinator_errors_corrected

  context: >-
    BATCH-014 ran control C1 and independently recomputed the two quantities on
    which DEC-20260803-52a750 retired this goal's whole-band statistic.
    TASK-20260803-f81a66 produced both, snapshot-archived at e95fe60d.
    TASK-20260803-83e457 returned ADMISSIBLE_WITH_DEFECTS after rebuilding the
    estimator from scratch on a different basis, a different selection rule, a
    different binning rule and a different optimiser.

  central_adjudication: >-
    THE CONTROL SUCCEEDED AND THE COORDINATOR'S SUMMARY OF IT DID NOT. C1 is the
    first of three attempts that is not inconclusive: the deep tail is consistent
    with Poisson under two independent constructions, with a two-sided power
    control showing the test would have seen phi = 1.5 and would not have seen
    0.80. That is a real result and it removes over-dispersion as an explanation
    for models reading below the deep-tail floor. Against that, three statements
    in my own snapshot receipt are wrong -- the plug-in-control inference, the
    sign-alternation claim, and the labelling of a model-dependent number as
    structural -- and the headline effective-dof value that this goal used to
    retire its main statistic does not reproduce from the formula as written.
    `refine`: the finding stands, the summary is corrected, and the dof VALUE
    stops being quoted while the dof CONCLUSION stands.

  what_is_established:
    - >-
      The deep tail is consistent with Poisson: producer phi = 0.895 +/- 0.154
      and 1.062 +/- 0.166; validator, from a scratch rebuild, 0.9494 and 1.1229,
      all 24 of its windows within 1.20 sd of 1.0.
    - >-
      The null is properly powered in BOTH directions. phi_true = 1.5 recovers as
      1.5038 +/- 0.2529 and 1.5312 +/- 0.2406; the validator added the missing
      downward control, phi_true = 0.80 recovering as 0.813 +/- 0.133.
    - >-
      The attenuation identity reproduces a third time to 6-13 digits, and the
      counting floors a fourth time to 13 digits.
    - >-
      The whole-band statistic carries O(1) effective degrees of freedom across
      all four conventions examined (1.51 to 2.35 against n = 1803 and 2310).

  what_is_corrected:
    - >-
      THE DOF VALUE. The stated formula, brute-forced over all pairs, gives
      1.573411 and 1.519356, not the published 1.5454 and 1.5135. The published
      pair uses a different convention and the two differ only because a_exact is
      non-monotone at one step per file. Every sub-band value agrees exactly.
      DEC-20260803-52a750's "1.55 / 1.51" is convention-contingent and is
      withdrawn as a quotable figure; its O(1) conclusion is unaffected.
    - >-
      MY PLUG-IN-CONTROL HEADLINE. The BATCH-014 snapshot receipt claimed the
      control shows "the construction the earlier attempts leaned on cannot
      produce a dispersion reading in either direction". It shows no such thing:
      the control computes ((Y-Y)^2)/Y, identically zero by construction with no
      archived byte entering, and its "leverage exactly 1" is asserted rather
      than computed. The two S-11 attempts used a local unweighted quadratic and
      a global log-linear Poisson trend, neither of which this control touches.
      The producer framed it correctly and I over-read it.
    - >-
      MY SIGN-ALTERNATION CLAIM. The receipt said window signs alternate. For
      n=43 they read -, +, -, -, +, -, which I confirmed is not alternating. I
      repeated a producer statement without checking a six-element sequence.
    - >-
      MY STRUCTURAL-QUANTITY LABELLING. The receipt listed "a perfect model reads
      0.7701x" among structural quantities. It is model-dependent -- M2's own
      residuals -- and a model at the floor would read 0.9996x.

  bound_on_the_finding: >-
    ANOM-5 is real and travels with T-1. The validator measured n=43's MID-BAND
    phi at 0.8020 against its own null object at 0.9923 +/- 0.0806, i.e. -2.36
    sd, stable while the rate model was given 6 to 33 parameters, and extra
    parameters can only push phi up. The deep-tail test's unexcluded band
    CONTAINS 0.80. So the same instrument that cannot separate 0.80 from 1.00 in
    the deep tail measures 0.80 at -2.4 sd three hundred rows shallower in the
    same file. T-1 is a null at the deep tail's resolution and must never be
    stated as "no dispersion structure exists".

  weighing_of_the_review: >-
    Accepted in full, including all three findings against my own receipt.
    (1) D-6 IS THE ONE I MOST NEEDED. I took a control at face value because its
    result was congenial -- it explained why two earlier attempts disagreed --
    and the validator read the actual code and found the numerator is (Y-Y)^2.
    That is the exact failure mode KN-FIND-029 catalogues, committed by the
    Coordinator in a receipt rather than by an instrument.
    (2) D-1 IS MATERIAL AND SELF-INFLICTED IN THE SAME WAY. I recorded the dof
    reproduction as confirmation without re-deriving from the stated formula; the
    validator brute-forced all 1803^2 pairs and found the formula gives 1.57.
    (3) THE VALIDATOR RAN A CONTROL NOBODY ASKED FOR and it changed the reading:
    the downward power control shows 0.80 is not excluded, which is what makes
    ANOM-5 a bound on T-1 rather than a curiosity.
    (4) IT ALSO EXERCISED THE REPRODUCIBILITY POINTER instead of asserting it,
    re-running the producer's script to zero differing leaves outside provenance.
    (5) D-5 is accepted as a general lesson: an algebraic identity of a
    construction is not a control, and reporting it as a passed check inflates
    the apparent control count.

  hypothesis_status_changes: []
  hypothesis_status_note: >-
    No hypothesis moves. A dispersion null and a set of arithmetic corrections
    carry no transition.

  rule_12_status: >-
    UNMET AND UNWAIVED. Nothing here changes EV-MLKEM-011, EV-MLKEM-013 or
    EV-MLKEM-017; KN-FIND-031 stays withdrawn.

  binding_instructions_updated:
    - >-
      The DEC-20260803-52a750 binding stands: no whole-band ratio without its
      effective degrees of freedom beside it.
    - >-
      NEW: do not quote a specific effective-dof VALUE. State that it is O(1),
      cite the convention range 1.51-2.35, and give the C >= 1000 comparison.
    - >-
      NEW: a control whose result is congenial gets its code read before it is
      summarised. This decision exists partly because I did not do that.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      `refine` on `preliminary` evidence fails the gate. The batch's transferable
      content is a set of corrections to this program's own records plus a null
      result bounded by an unexplained mid-band anomaly; none of it is a durable
      finding about the subject matter, and ANOM-5 is precisely the loose end
      that would make a promotion premature.
    promote: false

  non_claims:
    - ML-KEM is not broken.
    - KN-OPEN-016 remains open.
    - >-
      "The deep tail is Poisson" means at this data's resolution. True phi in
      roughly [0.6, 1.4] is not excluded, and 0.80 is not excluded for n=43.
    - >-
      Approximation 4.9 is neither validated nor refuted; this batch measured an
      instrument, not the model.
    - No asymptotic claim advanced. No closure quorum asserted.

  next_actions:
    - >-
      BATCH-015, zero new sampling: investigate ANOM-5, the only unexplained
      measured effect currently open in this goal. n=43's mid band shows a 20
      percent variance deficit at -2.36 sd against its own null while n=50 reads
      +1.55 sd, stable across 6 to 33 rate parameters. A variance DEFICIT below
      Poisson is not explicable by rate misfit, which can only inflate it, so it
      points at the data-generating process or at the archived file itself.
      Pair it with the cheap repair the producer named: archive residuals[T] per
      model per fit, which makes the four currently unreconstructible rows of
      BATCH-012's deep-tail table checkable.

