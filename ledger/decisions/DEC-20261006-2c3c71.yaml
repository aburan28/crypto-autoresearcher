  context: >-
    /design-experiment, one contract, for IDEA-20261005-78e17d. No
    hypothesis and no experiment on origin/main cites that idea. The
    proposal file is absent from origin/main. It was read from
    origin/design/drinf-474802-torsion and copied byte for byte. Its
    question id is RQ-PAIR-f2e31f. The branch design/drinf-78e17d-tower
    was created from origin/main at
    9c2bc35e93f0c2f83026c8e351c621f623bdfb90 and git merge origin/main
    reported already up to date.

    The contract counts ordered pairs eta, kappa at least 2 with
    eta times kappa equal to n and gcd 1, for n in {4, 5, 6, 8, 12},
    and checks one discrete log of the element 2 in
    F_121 = F_11[z] / (z^2 + 1). The pre-registered prediction is the
    count tuple (0, 0, 2, 0, 2) and the equality s = 12 t. A different
    tuple is a negative. A failed logarithm identity is a negative. No
    attack and no exponent improvement are claimed.

    This session listed the pairs. n = 6 contributes (2, 3) and (3, 2).
    n = 12 contributes (3, 4) and (4, 3). The other three degrees
    contribute none. Squares modulo 11 omit 10, so z^2 + 1 is
    irreducible over F_11. That enumeration is not a baby-step
    giant-step run. The markdown notes KN-LIT-3743 and KN-LIT-2061
    were opened. Their PDFs were not opened. The frontier row
    KR-RHO-46c2c6 was opened and is not used as a cost.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, seeds, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. Success is the
    tuple together with s = 12 t, and it fails when the tuple differs
    or the logarithm identity fails. No field required for approval was
    left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading are fixed before any executor run.
    - A different tuple is reachable as a recorded outcome, and a failed logarithm identity is reachable as a recorded outcome, so success is not automatic.
    - n = 5 and n = 8 are same-shape inputs on which a positive count is a negative rather than an infrastructure failure.
    - Two enumerators and two power routines give the run a way to come back invalid when the arithmetic splits.
    - This session did not run baby-step giant-step and did not claim an ECDLP exponent improvement.

  evidence_refs: []
  limitations:
    - The measurement covers five integers and one field of 121 elements. It is not a theorem about exTNFS at a pairing prime.
    - F_121 is not GF(p^12). No bit level is inferred.
    - KN-LIT-3743 and KN-LIT-2061 remain abstract-level notes. Their PDFs were not opened, and no formula was taken from them.
    - This decision authorizes a later execution. It does not start one. It does not move an ECDLP exponent.

  next_actions:
