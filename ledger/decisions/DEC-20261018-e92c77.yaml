coordinator_decision:
  id: DEC-20261018-e92c77
  recorded_at: '2026-10-18'
  decided_at: '2026-10-18'
  decided_by: coordinator
  archived_by: TASK-20261018-86dec0
  goal_id: GOAL-ICPERF-e6b6a4
  batch_id: BATCH-4379b2
  target_ids:
  - TASK-20261018-3b41b1
  - TASK-20261018-a2cf7c
  - TASK-20261018-86dec0
  - EXP-ICPERF-891f7f
  - RUN-ICPERF-7ed866
  decision: open_bounded_prime63_monitor_phase_implementation_batch
  context: >-
    DEC-20261018-eb6e00 classified RUN-ICPERF-7ed866 as an
    infrastructure/invalid-output attempt. Six planted positives, including
    every m=2 control, reached their individual 300-second caps without a
    response. The first natural cell lost RSS monitoring, the independent
    checker rejected its no-response state, and twenty natural cells were
    unattempted. The sealed run and approved 27-cell queue remain immutable.
  uncertainty: >-
    The existing artifacts do not distinguish expensive Groebner work,
    preparation cost, or process-supervision behavior within the six
    time-censored positives; a process-lifecycle race may have caused the
    natural-cell monitor fault but has not been isolated.
  decision_scope: >-
    Open one disjoint, bounded nonexecution engineering batch to implement
    race-safe fail-closed process-tree RSS monitoring, phase telemetry and
    synthetic fault controls, and to prepare a prospective small m=2
    planted-positive diagnostic design. This decision authorizes zero
    scientific trials and approves no diagnostic experiment or full-panel
    retry.
  rationale:
  - >-
    A monitor-only retry of 27 cells would leave the six observed 300-second
    positive-control censors unexplained. Synthetic monitor fault tests and a
    later small phase-traced positive diagnostic are the cheaper
    discriminating steps before broader arity comparisons.
  - >-
    The three B=475 m=2 input formulations have different serialized support
    (coset quadratic lift 60 monomial occurrences; random and small-x direct
    964 and 962), but input support is not observed Groebner degree or
    runtime. Phase telemetry is needed before choosing a solver strategy.
  - >-
    BATCH-25c5e3 owns the wide-prime backend directory. This batch's
    implementation write scope is the new
    research/icperf_prime63_monitor_phase_20261018/ directory, so the
    concurrent lanes have disjoint writes.
  selected_handoff:
    id: TASK-20261018-3b41b1
    role: executor
    kind: implementation
    archived_by: TASK-20261018-a2cf7c
    scientific_trials_authorized: 0
    completion_gate: >-
      A tested fail-closed monitor, phase-event source, synthetic fault-test
      receipts, exact source manifest, engineering report and prospective
      m=2 diagnostic design are archived under the declared task scope.
  archival_order:
  - >-
    TASK-20261018-86dec0 first snapshots the opening decision, handoffs,
    queue and checkpoint in a content-at-commit design archive. The Executor
    handoff is not dispatched until this archive and the lane are published.
  - >-
    TASK-20261018-a2cf7c later snapshots the Executor's exact engineering
    outputs before any independent review or subsequent scientific design.
  outcomes_and_next_decisions:
    monitor_controls_pass: >-
      Coordinator may design a separate fresh-ID diagnostic packet with
      prospective preapproval; this engineering result alone is not a solver
      or ECDLP observation.
    monitor_controls_fail: >-
      Preserve failure output and return the exact defect to the Executor;
      do not run scientific calls through the unvalidated monitor.
    prospective_diagnostic_complete: >-
      Rank its exact m=2 controls and phase metrics for later approval. Direct
      S8 at m=7 and direct S9 versus chained S3 at m=8 remain separate
      research obligations; natural yield, rank and complete IC costs remain
      unmeasured.
  official_transitions:
    goal: {id: GOAL-ICPERF-e6b6a4, status_unchanged: active}
    hypothesis: {id: H-ICPERF-05021b, status_unchanged: approved}
    experiment: {id: EXP-ICPERF-891f7f, status_unchanged: failed_infrastructure}
    scientific_claim_changed: false
  knowledge_promotion:
    promoted: []
    not_warranted: A nonexecution implementation batch contains no new ECDLP evidence.
  next_actions:
  - >-
    Publish and verify the exact design archive and lane, then dispatch only
    TASK-20261018-3b41b1 under its bounded engineering handoff.
  - >-
    When its complete output is available, snapshot it under
    TASK-20261018-a2cf7c; decide a fresh diagnostic contract separately.
