coordinator_decision:
  id: DEC-20260804-2fae6a
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-048
  recorded_by_task: TASK-20260804-003
  archived_by: TASK-20260804-004
  context: >-
    BATCH-048 dispatched a mathematical analysis (TASK-20260804-002) to evaluate
    the class-invariant argument from EV-IT-aefd12 O-6. The analysis, grounded in
    the Tate isogeny theorem, found that ordinary F_p-isogenies preserve trace of
    Frobenius unconditionally. All three special families named in H-IT-001
    (anomalous, MOV, Weil-descent) are isogeny-class invariants. The H-IT-001
    ordinary-isogeny transfer mechanism is structurally infeasible.

  decision: reject_scoped
  decision_vocabulary_note: >-
    reject_scoped means: the specific mechanism tested (ordinary isogeny transfer
    to anomalous/MOV/Weil-descent endpoints from generic prime-field curves) is
    ruled out by the Tate isogeny theorem at the MECHANISM level. This does NOT
    mean ECDLP is easy, isogeny-based attacks are impossible in general, or that
    H-IT-001 is closed. It means the stated ordinary-isogeny mechanism cannot
    work. Named successor directions (DIR-2, DIR-3 in successor_directions.yaml)
    remain open.

  decision_scope: >-
    H-IT-001 is moved to `weakened` at ordinary-isogeny scope for the three named
    special families (anomalous, MOV, Weil-descent). The scope of rejection is
    exactly: ordinary F_p-isogenies (degree coprime to p) connecting a
    non-special generic curve to any of these three families. Supersingular
    isogenies, F_{p^k}-isogenies, and other transfer mechanisms are out of scope
    of this decision. GOAL-ECDLP-001 remains `active`. The isogeny-transfer
    research lane (SG-ECDLP-002) remains open pending a new mechanism proposal
    that avoids the class-invariant obstruction.

  target_ids:
    - GOAL-ECDLP-001
    - H-IT-001
    - SG-ECDLP-002
    - EXP-IT-001
    - BATCH-048
    - EV-IT-511f3d
    - EV-IT-aefd12
    - TASK-20260804-002

  evidence_ids:
    - EV-IT-511f3d
    - EV-IT-aefd12

  rationale:
    - >-
      Tate isogeny theorem (unconditional): two ordinary elliptic curves over F_p
      are F_p-isogenous if and only if they have the same trace of Frobenius.
      Proof cited in EV-IT-511f3d. No heuristic assumption involved.
    - >-
      All three H-IT-001 special families are determined by #E(F_p) (trace),
      hence are isogeny-class invariants. A generic curve with trace t ≠ 1 cannot
      reach an anomalous curve (trace=1) by any ordinary F_p-isogeny of finite
      degree coprime to p.
    - >-
      rho_special=0 (EV-IT-aefd12 O-3) is a mathematical certainty, not a
      finite-scale artifact. BATCH-047's empirical density scan correctly confirmed
      the prediction of the Tate theorem at toy scale.
    - >-
      H-IT-001 is weakened, not rejected outright, because: (a) the experiment
      was never executed cleanly (RT-047-B1..B3 prevented a clean measurement);
      (b) successor directions DIR-2 and DIR-3 might lead to a revised formulation
      that avoids the class-invariant obstruction; (c) the weakness is scoped to
      the ordinary-isogeny mechanism, not to the broader question of whether
      ECDLP cost can be reduced via any isogeny-related technique.

  h_it_001_transition:
    from: specified
    to: weakened
    scope: >-
      Ordinary F_p-isogeny transfer to anomalous/MOV/Weil-descent endpoints.
      Mechanism ruled out by Tate isogeny theorem (unconditional).
    surviving_open_questions:
      - Supersingular isogeny paths (whether they can provide a sub-rho bridge)
      - >-
        Non-invariant special families (DIR-2: does a special family exist where
        the distinguishing property is not an isogeny-class invariant?)
      - >-
        Within-class reformulation (DIR-3: can a weakness of a large fraction of
        curves in the same isogeny class be exploited?)

  exact_next_action: >-
    Dispatch the Idea Generator to propose a revised mechanism for SG-ECDLP-002
    that avoids the class-invariant obstruction (DIR-2 or DIR-3 from
    successor_directions.yaml), with a falsifiable experimental test, a
    mechanism that avoids the Tate theorem obstruction, and an explicit
    dominated_by / sota_delta comparison against Pollard rho. If no viable
    mechanism is identified, formally close SG-ECDLP-002 with a named obstruction
    and open a different ECDLP sub-goal.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No KN-* entry was created by this decision. The record's `promoted` list held
      a placeholder id for a promotion that was OWED but never made, which made the
      record assert the opposite of the truth -- that the corpus had been updated.
      Converted under DEC-20260805-7b3e91 (RUL-9): the obligation is declared here,
      where the schema puts an unmet obligation, and every word of the original
      entry is preserved verbatim under owed_promotions below. Nothing was deleted.
    owed_promotions:
      - id: pending_kn_find
        note: >-
          The Tate isogeny theorem applied to ECDLP ordinary-isogeny transfer
          obstruction warrants promotion to KN-FIND. Curate in the next session.
    not_warranted_reason: null

  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2 (no algorithmic improvement found).
    sota_delta:
      time_exponent: not_applicable
      memory_exponent: not_applicable
      data_or_query_exponent: not_applicable
      note: Negative structural result; no algorithm.
  claim_ceiling: theoretical
  official_research_state_changed: true
  state_changed_fields:
    - "H-IT-001.status: specified -> weakened"
  asymptotic_promotion_gates:
    proof_decomposition: open
    numbered_heuristics_validated: open
    concrete_cost_table: open
    independent_review_xhigh_and_red_team: open
    note: No asymptotic-complexity claim; all gates remain OPEN.
  decided_by: coordinator
  decided_at: '2026-08-04'
