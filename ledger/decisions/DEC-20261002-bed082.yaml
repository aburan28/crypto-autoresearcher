  context: >-
    The TW-FLOOR composition left F7 open: at m = 4 small_x harvest-on over
    12..32 bits the engine's r_rank ratio slope is -0.01491 (calibrated
    [-0.0242, -0.0053]) while staying at level 2.10-3.63, and the per-rung
    r_frozen aggregate T falls from 2.507 at 12 bits to 1.115 at 30 bits
    (99% [1.070, 1.161]) (EV-PFDR-d90ccd OBS-8, cross_joint_reading). Whether
    that decline is the generic floor-attainment path (T flattens at >= 1) or
    the lemma failing for adaptive engines (T crosses 1) is the
    decision-changing quantity, and DEC-20261001-494663 NA-3 rules the
    cheapest first probe is a ZERO-RUN analysis of the round's archived PTM-5
    outputs: an exactly generic replica (over Z_N, N <= 2^24, 8400 rows at
    m = 3, 4, 5, 12..24 bits, census and on modes) whose descriptive per-rung
    T exists (RT attacks/out/09b_ptm5_agg_by_rung.json) but whose r_rank
    slope was never fitted and whose per-rung T was never calibrated. The
    record acts of rank (2) (AMD-20261002-2bc8cf, H-PFDR-cf8ca6) are archived
    (PR #1592), so this act can commission the analysis under the amendment's
    reading rules (C-1..C-4) with the refined record's conventions.

  validity_check_before_interpreting:
    applicable: false
    reason: >-
      Nothing is interpreted by this act; it approves a bounded analysis and
      fixes the decision rule before its data exists. The analysis's own
      validity (conventions licensed by the archive, no engine execution,
      determinism) is its completion gate's job, checked on return.

  approvals:
    - id: AP-1
      what: >-
        The zero-run analysis TASK-20261002-758e51 (executor): slopes (replica
        r_rank and r_frozen ratio slopes at m = 4 on-mode over 12..24 bits,
        with bootstrap intervals, compared against the engine's F7 values
        restated from EV-PFDR-d90ccd OBS-8); per-rung aggregate T at m = 4 and
        5 on-mode, both r conventions, 99% curve-bootstrap intervals per the
        round's MC-5 discipline (five instances per rung per replicate, at
        least 20000 replicates, coverage reported); the identity's
        decomposition check on the same rows (exact OLS additivity plus the
        multiplicity growth comparison); and the pre-registered reading as
        the narrowest supported sentence.
      bounds: >-
        No solver or engine execution (no import or run of anything under
        src/crypto_autoresearcher/index_calculus); reads the archived round
        outputs only; writes only under coordination/tasks/
        TASK-20261002-758e51/; outputs under 50 MB; one analysis attempt (the
        identity-check rerun after a located defect is the one permitted
        retry, both attempts recorded); wall clock 7200 s; memory 4 GB; no
        RUN id; never evidence about any base, class or m beyond the
        archived replica rows; a stop is blocked, not a finding.
    - id: AP-2
      what: the snapshot archive TASK-20261002-572da8, run alone after the executor returns.
  approval_scope_note: >-
    Approval to perform this work asserts nothing about the floor, the F7
    trend, or HEUR-cf8ca6-H3. It approves no run of the engine, amends no
    protocol beyond AMD-20261002-2bc8cf's reading rules, and changes no
    hypothesis status.

  pre_registered_decision_rule: >-
    Fixed BEFORE any data is computed (this is the act's prior, per the
    review-architecture obligation that the Coordinator's expectation is
    recorded before the result exists): (i) replica r_rank slope with its own
    interval inside the engine's calibrated interval [-0.0242, -0.0053], or
    overlapping it with the engine's point inside the replica's interval ->
    reading "F7's r_rank decline reproduces on the exactly generic replica";
    the decline is the generic floor-attainment path, and OQ-F7 narrows
    toward 'T flattens at >= 1'; (ii) replica slope interval containing 0
    while the engine's excludes it -> reading "the decline is not reproduced
    at the replica's scale; engine-specific or scale-dependent, unresolved at
    12..24 bits"; OQ-F7 stays open and step (b) (an exactly generic replica
    beyond 24 bits) is the successor; (iii) replica slope steeper than the
    engine's beyond both intervals -> record both, state the narrowest
    sentence, no further interpretation, successor (b). Per-rung T: any rung
    whose 99% interval excludes 1 from below is TW-BREAK-shaped and routes
    to the Coordinator untouched (never self-interpreted by the executor).
    The identity is exact arithmetic; a violation is an analysis defect
    (locate, rerun once, record both). The Coordinator's own expectation,
    recorded for honesty and marked NOT independent: this Coordinator
    expects outcome (i), on the ground that the replica's harvested share of
    X^2/N already rises from 0.45 to 0.77 over 12..24 bits (EV-PFDR-d90ccd
    cross_joint_reading), which is the same approach-to-budget path the
    engine shows; what would overturn it is a replica whose r_rank slope
    interval contains 0 (outcome (ii)), which would mean the engine's decline
    carries an engine-specific component the replica cannot reproduce.

  rationale:
    - >-
      Why now. The rank-(2) record acts are archived (PR #1592), so
      DEC-20261001-3fbaff NA-4's withhold on floor-relative work lifts for
      the commissioned validation route, and DEC-20261002-8ac70f NA-3 names
      this design act next. The analysis is zero-run and cheap, its write
      scope is disjoint from every live lane, and its answer decides which
      successor (a larger-N replica, or harvest-on rows above 32 bits) is
      worth spending on.
    - >-
      Why the decision rule is fixed here. NA-3 requires the decision rule
      fixed before data; the review architecture requires the prior recorded
      before the result exists. The rule, and this Coordinator's expectation
      with it, are above; the analysis computes and reports, the Coordinator
      reads.
    - >-
      Why the replica is the right first object. It is exactly generic by
      construction, so any trend it reproduces is a property of the generic
      collision process, not of the mitm engine's specifics; and its rows are
      already archived (TASK-20261001-96d1e8 at 92f503cb9), so the probe
      costs no run at all. Its limit -- 24 bits -- is why step (b) exists.
    - >-
      Scope discipline. DEC-20261001-e9e7e6 NA-3 forbids write scope over
      src/crypto_autoresearcher/index_calculus/** and
      experiments/EXP-PFDR-011cd0/** while TASK-20261001-7f7a33 is live: this
      task writes only under its own coordination/tasks/ directory and its
      executor never imports engine code. The EXP-PFDR-011cd0 lane
      (coordinator-pfdr-1rfntm) is untouched.
    - >-
      Exponent bias (docs/target-result-profile.md). The floor is the
      admission gate every structured proposal must beat; HEUR-cf8ca6-H3 is
      the gate's open derivation step. Settling whether the generic replica
      reproduces the F7 decline is the cheapest evidence that can move on
      OQ-F7, and it prices the successor steps (b) and (c) before any
      compute is spent on them.

