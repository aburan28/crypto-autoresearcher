    This session opened knowledge/literature/KN-LIT-6130.md,
    knowledge/techniques/KN-TECH-060.md,
    knowledge/techniques/KN-TECH-046.md, and the block of
    research_digest/chunks/chunk_023.txt headed "### file: 12171116.pdf
    (30p)". KN-LIT-6130.md is still a title-only stub. No abstract was
    extracted. Listing downloads/12171116.pdf and downloads/12171116
    (1).pdf returned "No such file or directory". Those PDFs were not
    opened, and an unopened PDF is not a reading.

    The contract measures a sentence count. It is not a heuristic
    validation of an asymptotic theorem and not a concrete-cost table.
    The pre-registered prediction is count 0 on opened files. The
    falsifying sentence is "The archimedean fibre supplies the
    logarithmic embedding at the infinite places and thereby determines
    the covering radius of the Arakelov-class-group random walk." No
    attack and no exponent improvement are claimed. No Selmer or Sha
    certificate is proposed.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, seeds, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. Success is the
    absence row and fails when an opened file contains the falsifying
    sentence or any other fibre-contribution sentence. No field required
    for approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction, the falsifying sentence, and the assignment of each observation to a reading are fixed before any executor run.
    - The instrument control on KN-TECH-046 gives the absence reading a way to come back inconclusive when the procedure drops a sentence that is present.
    - A missing PDF is an unreadable path, so success cannot be manufactured by scoring an unopened file as zero.
    - Quoting the falsifying sentence from an opened file fails the absence reading, so a negative result is reachable.
    - This session did not extract an abstract into KN-LIT-6130 and did not evaluate the asymptotic Hermite-factor loss.

  evidence_refs: []
  limitations:
    - The reading covers the opened files only. It is not a theorem about the unread PDF.
    - KN-LIT-6130 remains title-only. Venue and year are null in that file and were not checked.
    - The digest abstract is truncated mid-word, so a later page of the paper can contain the fibre sentence without it appearing in the dump.
    - This decision authorizes a later reading. It does not start one. It does not move an Ideal-SVP exponent.

