coordinator_decision:
  id: DEC-20260730-010
  reserved_alias_note: >-
    This decision was archived as DEC-20260730-003 under GOAL-SSI-001. Main assigned
    DEC-20260730-003 to a non-SSI record, so per CORR-20260731-002 this decision uses
    the next free id DEC-20260730-010. Content is otherwise unchanged aside from
    remapped sibling DEC/TASK citations.
  context: >-
    GOAL-SSI-001 BATCH-011 FC0-R2 joint stopping-law and global-liveness
    control for IDEA-20260729-001; snapshot 442dbe69; red-team
    RT-20260730-011 CONFIRM retaining FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED.
  decision: confirm
  target_ids:
    - IDEA-20260729-001
    - GOAL-SSI-001
    - RQ-SSI-001
    - TASK-20260730-009
    - TASK-20260730-011
    - KN-OPEN-014
  rationale:
    - >-
      CONFIRM adopted for the narrow control result: the single joint
      stopping/liveness worksheet failed to instantiate a source-compatible
      finite additive ledger, global memory schedule, or common operational
      error metric. QUERY_MEMORY unreconciliation remains supported with
      named blockers QM-STOPPING, QM-MEMORY, and QM-ERROR.
    - >-
      C2 and C3 remain live only as underdetermination controls; they are not
      claims that the paper's actual process has infinite cost or unbounded
      memory. No numeric, breakthrough, or completion claim.
    - >-
      O5 archived-host clearance from BATCH-010 stands; canonical ePrint PDF
      bytes remain unverified (converted text only on HTTP 200).
    - >-
      Keep GOAL-SSI-001 active with null campaign budgets. Do not reopen
      closed IDEA-20260725-001/002/003 lanes.
  evidence_refs:
    - EV-SSI-011
    - coordination/goals/GOAL-SSI-001/batches/BATCH-011/archives/TASK-20260730-010/snapshot-receipt.json
    - coordination/goals/GOAL-SSI-001/batches/BATCH-011/tasks/TASK-20260730-011/red_team_report.yaml
  limitations:
    - No experiment or quantum-circuit execution.
    - Same-model fallback on producer and red-team.
    - Canonical ePrint PDF bytes were not obtained for hashing.
  next_actions:
    - >-
      Open BATCH-012: pin a concrete Peikert binary c-sieve simulator or
      reference-implementation control-flow artifact and extract one explicit
      transition kernel plus object-lifetime trace under FC0-R2; derive a
      uniform conditional progress or tail bound, prove or refute finite
      Q/S/P/C expectations, enumerate W/R/B/M_tail births/deaths with
      deterministic concurrency, map all failure paths to one event F, and
      rerun C2/C3 plus the error-map audit against that artifact; zero curve
      compute; no numeric security, breakthrough, or completion claim
      (DEC-20260730-010 / EV-SSI-011).
  hypothesis_status_record:
    IDEA-20260729-001: confirm_query_memory_reconfirmed_impl_gate_next
    note: >-
      QUERY_MEMORY unreconciliation independently reconfirmed; next gate is
      implementation-compatible process extraction, not numeric review.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      CONFIRM is a scoped accounting-control reconfirmation at preliminary
      strength, not a replicated/strong cryptanalytic boundary. KN-TECH-051
      already covers the CSIDH quantum cost-model dispute; QUERY_MEMORY
      remains open with the same named blockers. No KN-FIND/KN-TECH until a
      reconciled FC0 row or durable negative boundary is independently
      confirmed.
  decided_by: coordinator
  decided_at: '2026-07-30'
