coordinator_decision:
  id: DEC-20260907-38e5ae
  context: >-
    Open lane BATCH-e9fd22 on GOAL-ECDLP-bbc21f, rerank the goal head's stale
    next_action onto the RANK 1 that DEC-20260907-9b1b02 actually left standing,
    and author the frozen-but-unapproved artifacts that lane needs before any
    producer can run. This decision opens a batch. It approves no protocol,
    authorises no run, reports no measurement, and changes no hypothesis status.

  decision: expand
  decision_note: >-
    `expand` in the template's sense: the research direction is widened by one
    new lane with a new arm and a new review round. It is NOT `approve` -- the
    protocol amendment authored under this decision sits at
    `approved_by: null` / `execution_authorized: false` and its approval is a
    separate gated task (TASK-20260907-f65c6e) with its own decision record
    (DEC-20260907-4e34c5) and its own ledger archive.

  target_ids:
    - GOAL-ECDLP-bbc21f
    - BATCH-e9fd22
    - EXP-ECDLP-6ac801
    - PA-ECDLP-6ac801-v1-to-v2
    - RQ-ECDLP-78dbc5

  rationale:
    - >-
      THE GOAL HEAD'S RECORDED RANK 1 IS STALE, AND THE RECORD GOVERNS. The
      committed next_action (written 2026-09-06, quoted verbatim and preserved
      under `next_action_superseded_20260906` in the goal head) asks for "a
      small, independently reviewed follow-up ... resolving whether T_sel = T/2
      is genuinely G3-feasible at a in {1/16, 1/8} on EXP-ECDLP-612fb1, ideally
      at N = 2^24 exact basins with a blind re-derivation". That work was
      designed, approved, executed and ledger-archived on 2026-09-07 as
      EXP-ECDLP-6ac801 under BATCH-3c7493: N = 2^24 exact basins, a in
      {1/16, 1/8, 3/16, 1/4}, r = 2, T_sel = T/2, with a sealed Stage A blind
      re-derivation (TASK-20260907-80e198) and a proves-too-much control. Its
      evidence record is EV-ECDLP-2e9680 and its decision is
      DEC-20260907-9b1b02.
    - >-
      WHY THE GOAL HEAD NEVER SAW IT. BATCH-3c7493 was opened under
      coordination/experiments/EXP-ECDLP-6ac801/, not under this goal's lane
      directory; its queue carries `goal_id: GOAL-ECDLP-001` with a
      `goal_id_note` recording that EXP-ECDLP-6ac801 and H-ECDLP-37dc01 both
      declare `goal_id: null`; and it was never registered as a lane of
      GOAL-ECDLP-bbc21f (`tools/goal_lanes.py lanes GOAL-ECDLP-bbc21f` lists
      only BATCH-252a44, BATCH-289698 and BATCH-f3a30a, all closed). So the
      goal's own bookkeeping has no way to know the work happened. This is a
      coordination defect, not a research one, and it is recorded here rather
      than silently repaired.
    - >-
      WHAT DEC-20260907-9b1b02 LEFT STANDING AS ITS OWN RANK 1. Of the four
      cells, a = 1/16 resolved CONFIRMED FEASIBLE (blind and production agreeing
      5/5), a = 3/16 and a = 1/4 resolved CONFIRMED INFEASIBLE, and a = 1/8
      resolved DISAGREEMENT at the literal sealed level. The validator
      root-caused that single disagreement not to a scientific question but to
      an UNDERSPECIFICATION IN THE FROZEN v1 CONTRACT: v1's
      `definitions.STATIC(T)_r exact coverage` names "the published
      Bernstein-Lange weight" and never states the formula, so an independent
      re-deriver working from the contract text alone must supply one. Stage A
      supplied true exact basin size; production supplies S_d + 4*W*h_d.
      DEC-20260907-9b1b02 declined to relabel the cell on a post-hoc,
      non-blind diagnostic and required instead a protocol amendment stating the
      formula plus a FRESHLY SEALED re-derivation under it. That is this batch.
    - >-
      THIS IS STILL THE SAME RANK 1 QUESTION, AT ITS ONE REMAINING OPEN CELL.
      The framing that opened this session and the record agree on the target --
      G3-feasibility at small a, at N = 2^24 exact basins, settled by a blind
      re-derivation and a proves-too-much control. They differ on which
      experiment carries it (EXP-ECDLP-6ac801, not EXP-ECDLP-612fb1) and on how
      much is already done (a = 1/16 is settled; a = 1/8 is not). Opening a
      second lane against EXP-ECDLP-612fb1 to re-measure a = 1/16 would spend
      the batch re-deriving a resolved cell and would leave the one genuinely
      open cell exactly as open as it is now.
    - >-
      RANKED AHEAD OF DOING NOTHING, AND AHEAD OF THE ALTERNATIVES. The goal is
      ECC and its budget is unlimited, which orders the queue and removes a
      ceiling but does not license make-work. Against DEC-20260907-9b1b02's own
      RANK 2 (an online RESEL-L batch) and RANK 3 (further v3 amendment items):
      both are larger, and both would be interpreted against a definition that
      has already produced one disagreement. Repairing the definition first is
      cheap, is a prerequisite for reading anything measured under it, and is
      the only item whose absence currently blocks a cell from being reported at
      all.
    - >-
      THE AMENDMENT IS AUTHORED, NOT APPROVED. specification.v2.yaml and
      PA-ECDLP-6ac801-v1-to-v2 are written at `status: proposed`,
      `approved_by: null`, `execution_authorized: false`. This session is
      non-interactive and cannot obtain the user confirmation this lane's own
      precedent required for v1 (see v1's `approval_note` and
      PA-ECDLP-612fb1-v1-to-v2 `binding`). The queue makes the executor
      unreachable until TASK-20260907-f65c6e decides and TASK-20260907-ceb8cf
      commits that decision. Designing is not approving.
    - >-
      THE REVIEW PLAN IS WRITTEN NOW, BEFORE ANY REVIEWER EXISTS, AND SO IS THE
      PRIOR. AGENTS.md "Review architecture" makes the Coordinator's prior
      unrecoverable if written afterwards, so it is recorded in
      ledger/handoffs/TASK-20260907-e423d5.yaml `review_plan.coordinator_prior`
      as seven numbered expectations -- including two I expect the round to
      OVERTURN (that the BCa bootstrap at n = 25 is the wrong interval, and that
      DECAY-TSEL is the weakest of the four controls). Recording an expectation
      I think is probably right, in advance, is what makes acting on it a review
      result rather than a Coordinator preference applied after the fact.
    - >-
      CONTROLS ARE DECLARED BEFORE BELIEF, AND ONE WAS REPAIRED WHILE DRAFTING.
      The contract declares a null object (NULL-RANDSEL) whose G3-feasibility is
      known false by argument, two decay controls, a cross-scale reproduction
      control at N = 2^20 against the committed v1 cells, and four
      proves-too-much objects including the lane's existing permanent bijection
      fixture. DECAY-TSEL as first drafted was VACUOUS: cov_static does not
      depend on T_sel and share_top(T_sel) is a prefix sum of a descending
      sequence, so its monotonicity clause held by arithmetic on every correct
      implementation. That clause was removed before freezing and replaced with
      two clauses that can actually fail. The episode is recorded because a
      control that cannot fail is the most expensive kind of reassurance.

  evidence_refs:
    - DEC-20260907-9b1b02 (the authoritative current RANK 1; its next_actions RANK 1 is quoted verbatim in the amendment's `discharges` block)
    - DEC-20260906-bcc097 (the superseded RANK 1 the goal head still quotes)
    - EV-ECDLP-2e9680 (BATCH-3c7493's per-cell evidence: a = 1/16 S1, a = 3/16 and a = 1/4 S2, a = 1/8 S3)
    - EV-ECDLP-60e266 (the external anchor for a = 1/4 infeasibility, OBJ-1 and DECAY-A's outside clause)
    - EV-ECDLP-f6b3f5
    - coordination/experiments/EXP-ECDLP-6ac801/batches/BATCH-3c7493/tasks/TASK-20260907-80e198/validation_report.yaml (block `a_1_8_disagreement_root_cause`)
    - experiments/EXP-ECDLP-6ac801/specification.yaml (frozen v1, sha256 dfd4047f467b2faab12f179e6907a11f53d72ca6d1239836c0b162c7369a82b9)
    - experiments/EXP-ECDLP-612fb1/source_v2/instrument.py (`Pool.weights`, the implementation the corrected formula is read off)
    - ledger/goals/GOAL-ECDLP-bbc21f/goal.yaml (`next_action_superseded_20260906`, preserving the stale text verbatim)

  evidence_refs_note: >-
    Every reference above is `provenance: internal` -- a committed record of
    this program, read by this session. No external literature is cited by this
    decision and none is needed: it is a coordination decision, not a scientific
    one.

  limitations:
    - >-
      THIS DECISION ESTABLISHES NOTHING SCIENTIFIC. It opens a lane. Every
      research statement it makes is a restatement of an already-committed
      record with that record named beside it. No run, timing, margin, verdict
      or measurement originates here.
    - >-
      THE RERANK IS THIS SESSION'S JUDGEMENT AND IS REVERSIBLE. If the
      dispatching Coordinator judges that the literal stale next_action should
      have been executed against EXP-ECDLP-612fb1 anyway, this lane can be
      closed and that one opened; the goal head preserves the superseded text
      verbatim precisely so that remains possible without archaeology.
    - >-
      SCOPE DEVIATION, DISCLOSED. The session that dispatched this work
      allow-listed writes under `experiments/EXP-ECDLP-612fb1/` and named that
      experiment as the amendment target. The amendment is instead written under
      `experiments/EXP-ECDLP-6ac801/`, because that is the contract carrying the
      underspecified definition -- amending EXP-ECDLP-612fb1 would leave the
      defect in place in the contract that has it. No byte of EXP-ECDLP-612fb1
      is modified; it is read only. See `scope_deviation` below.
    - >-
      THE a = 1/16 CELL CAN NEVER BE FULLY RE-BLINDED ON THIS BRANCH. Two commit
      messages reachable from it state that verdict in plain text (84233e8c3,
      376c6660e) and `git log` is on no blind_from list. This is recorded in
      specification.v2.yaml `blind_history_contamination` and in the review
      plan's `blind_phase_hygiene`, mitigated (the re-deriver is instructed not
      to run git history commands before sealing; no commit message in this
      batch may state a verdict), and scoped (independence is FULL at a = 1/8
      and a = 3/16, WEAKENED at a = 1/16). It cannot be repaired: the commits
      are immutable archive commits bound to verified receipts.
    - >-
      EXP-ECDLP-6ac801 AND H-ECDLP-37dc01 STILL CARRY `goal_id: null`, AND THIS
      DECISION DOES NOT CHANGE THAT. BATCH-e9fd22 is a lane of
      GOAL-ECDLP-bbc21f and lives in that goal's directory; the experiment and
      hypothesis records are untouched. Binding them is a separate act on
      separate records and is left as an explicit open item.
    - >-
      NO INDEPENDENT REVIEW OF THIS DECISION. A batch-opening decision is not
      claim-changing and none is required, but the rerank rests on one session's
      reading of DEC-20260907-9b1b02 and the goal head. The reading is
      falsifiable from the two records named above.

  scope_deviation:
    declared_write_allowlist:
      - experiments/EXP-ECDLP-612fb1/
      - coordination/goals/GOAL-ECDLP-bbc21f/
      - ledger/handoffs/
      - ledger/decisions/
      - ledger/goals/GOAL-ECDLP-bbc21f/
      - coordination/bus/
    actual_write:
      - experiments/EXP-ECDLP-6ac801/amendments/v1_to_v2.yaml
      - experiments/EXP-ECDLP-6ac801/specification.v2.yaml
      - "(all other writes inside the declared allow-list)"
    substituted: experiments/EXP-ECDLP-6ac801/ in place of experiments/EXP-ECDLP-612fb1/
    reason: >-
      The instruction named EXP-ECDLP-612fb1 because the goal head's stale
      next_action names it. The definitional defect the amendment repairs is in
      EXP-ECDLP-6ac801's frozen v1 contract, which reused EXP-ECDLP-612fb1's
      instrument but did not copy the line stating the weight formula. Amending
      the experiment that does not have the defect would produce a correct
      document about the wrong contract.
    what_was_not_written: >-
      Nothing under experiments/EXP-ECDLP-612fb1/ was created, modified or
      deleted. Its specification.v2.yaml and source_v2/instrument.py were read.
    reversibility: >-
      Both new files are additive and unapproved. Deleting them removes the
      deviation entirely; no existing record depends on them until
      DEC-20260907-4e34c5 is committed.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is a batch-opening and reranking decision, not an evidence review. It
      reports no result and rests on no new evidence, so there is no durable
      finding to promote. The knowledge-promotion gate for this lane belongs to
      TASK-20260907-022c19's decision DEC-20260907-7328d4, whose completion gate
      requires the field to be filled with either a KN-FIND plus a regenerated
      knowledge/INDEX.md in the same commit, or a concrete reason.

  next_actions:
    - >-
      RANK 1 (this lane, and the only ranked work it contains): run BATCH-e9fd22
      to its ledger archive. Ready first is the isolated snapshot archive
      TASK-20260907-4ce154; then the approval gate TASK-20260907-f65c6e and its
      ledger archive TASK-20260907-ceb8cf; only then the executor
      TASK-20260907-e423d5, its snapshot TASK-20260907-60957d, the two blinded
      reviews TASK-20260907-6a2b2e and TASK-20260907-3dff63 concurrently, and
      the composing ledger archive TASK-20260907-022c19.
    - >-
      RANK 2 (unchanged from DEC-20260907-9b1b02): the online RESEL-L batch. A
      ceiling result at any a says nothing about whether the online lower-bracket
      re-selection mechanism reaches that ceiling at any batch size U; zero
      online arms have ever been run.
    - >-
      RANK 3 (unchanged): the remaining v3 amendment items on EXP-ECDLP-612fb1
      that DEC-20260907-9b1b02 enumerates.
    - >-
      RANK 4 (housekeeping, unranked against the science): decide whether
      EXP-ECDLP-6ac801 and H-ECDLP-37dc01 should be bound to GOAL-ECDLP-bbc21f
      rather than left at `goal_id: null`, and whether BATCH-3c7493 should be
      retroactively registered as a closed lane of this goal so its work is
      visible to `tools/goal_lanes.py`. Both are additive record changes and
      neither is urgent; both are why this rerank was needed at all.

  decided_by: coordinator
  decided_at: '2026-09-07'
  session_provenance:
    requested_policy: coordinator-orchestration-code
    resolved_model: claude-opus-5 (Cursor cloud agent runtime)
    fallback_used: false
    degraded_requirements: []
    model_verified: false
    model_verified_note: >-
      `python3 -m orchestration.adapter doctor --probe` was not run by this
