  rationale: >-
    Authorize one bounded, lane-separated independent validation pass over all 30
    proposals already archived by snapshot task TASK-20260813-91f6de at commit
    db6279ef401a240a0f76f527be31fbc1b693ae17. The six validators will test
    schema completeness, falsifiability, controls, cost and proof-search fields,
    Pareto disclosures, citation provenance, duplicate risk, and claim ceilings;
    a Coordinator disposition and neutral administrative evidence record will
    then preserve the literal PASS or REVISE outcomes without changing research
    status.
  limitations:
    - This decision authorizes review only; it does not authorize a new proposal, experiment, hypothesis transition, goal-head change, novelty claim, or promotion.
    - The reviewed producer snapshot is bound by coordination/ideation/direct-six-wave-20260813/archives/TASK-20260813-91f6de/snapshot-receipt.json and commit db6279ef401a240a0f76f527be31fbc1b693ae17.
    - MCP search_knowledge is not callable in the current runtime and the local KB is empty/in-memory; absence of a retrieved match is not novelty evidence.
    - Validators may verify existing retrieval receipts and direct-tree duplicate relationships, must preserve novelty_status as unverified, and may return REVISE where required evidence is unavailable.
    - No agreement, approval, retrieval result, or independent verdict may be inferred or fabricated.
