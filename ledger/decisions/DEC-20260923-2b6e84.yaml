      reproducible, main-descended tree. The prose rule still covers the
      literal, and the other 65 stay mechanically checked.
    - >-
      THE RECORDS REACHED MAIN BEFORE THEIR ARCHIVE. That inverts
      commit-after-archive, but it does not invalidate the records. Archive
      receipts bind to content first (CLAUDE.md). The remedy is a
      content-binding receipt that asserts byte-equality with what the
      Coordinator wrote. The records are never re-staged or edited. The
      inversion is disclosed in CORR-20260923-7c14d9 K2.
    - >-
      Dispatch stays blocked. Nothing in this ruling lets any reviewer launch
      before TASK-20260923-e3b590's receipt verifies with the corrected check
      PASSING.

