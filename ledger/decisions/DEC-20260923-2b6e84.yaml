  rationale:
    - >-
      The match is a false positive: a small integer that is also a standard
      binary-field degree, in commits one day older than the run. The protected
      value is a null-family arm size and is not among J6's quantities, so its
      disclosure cannot bias the re-derivation or the J7 comparison. Option (b)
