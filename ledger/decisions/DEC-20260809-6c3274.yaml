coordinator_decision:
  id: DEC-20260809-6c3274
  goal_id: GOAL-SSI-001
  batch_id: BATCH-cdcf50
  recorded_by_task: TASK-20260809-5b07f8
  archived_by: TASK-20260809-5b07f8
  context: >-
    BATCH-cdcf50 opened an additive v10 successor to EXP-SSI-9d821a after its
    independent Validator and Red Team identified remaining byte, semantic,
    finite-cost, control, and incumbent gaps. Fresh independent Validator and
    Red Team sessions reviewed the v10 snapshot. Neither executed an experiment
    or diagnostic.
  decision: refine
  decision_scope: >-
    Retain EXP-SSI-7b1469 as a materially improved but still incomplete design
    candidate and open a bounded additive v11 clarification. This decision does
    not freeze the contract, authorize execution, change a hypothesis or
    experiment status, or make any SSI, SQIsign, attack, security, novelty, or
    exponent claim.
  target_ids: [IDEA-20260806-9c2f80, EXP-SSI-16649a, EXP-SSI-9d821a, EXP-SSI-7b1469, GOAL-SSI-001]
  evidence_ids: [EV-SSI-770b21]
  review_ids: [VAL-20260809-f84cd9, RT-20260809-68dca1]
  review_task_ids: [TASK-20260809-80c7d5, TASK-20260809-68dca1]
  snapshot_commit: 659a1a93ac53d9e03fb4fef1c9d58468d1b394a6
  queue_binding_commit: 12e6fe74d34e0a037ceb1eee1d5ccb9790e89871
  rationale:
    design_progress: >-
      V10 makes real additive progress on request/index widths, registered
      attempt seed binding, control-domain separation, helper blob preimages,
      provider signature recursion, event naming, and memory formulas. These
      are contract edits only and have no scientific interpretation.
    independent_validation: >-
      Validator VAL-20260809-f84cd9 returned incomplete with
      INCOMPLETE_ON_V10_BYTE_RECOMPUTABILITY_AND_ADMISSION_READINESS. It
      confirmed snapshot reachability and path hashes but found unresolved
      nested framing, raw digest domains, circular terminal identity, source and
      pair-matrix semantics, event/memory closure, certificate/HNF/output,
      replay/null, controls, incumbent, and provider gates.
    independent_red_team: >-
      Red Team RT-20260809-68dca1 returned DISSENT_ON_V10_BYTE_RECOMPUTABILITY_SEMANTIC_COST_CLOSURE_AND_EXECUTION_READINESS. It independently identified
      the same execution-blocking gaps and additionally challenged target-bound
      advice quantification, hidden oracle boundaries, exact event decomposition,
      uncharged mirror/signature work, and missing typed replay frames.
    execution_authorization:
      granted: false
      reason: >-
        V10 remains non-recomputable end to end: canonical nested framing and
        digest domains, fixed-advice/source and pair-matrix semantics, finite
        terminal/pair/null bounds, complete FOE and memory inventories,
        provider/edge validity, deterministic HNF/output, replay materiality,
        measured controls, incumbent admission, and snapshot provenance closure
        are not all satisfied. No Executor task may be opened.
    claim_boundary: >-
      No measurement, run, attack, security, exponent, novelty, hypothesis
      transition, or goal completion follows from either review.
  official_research_state_changed: false
  hypothesis_status_transition: none
  experiment_status_transition:
    - id: EXP-SSI-7b1469
      from: review_required
      to: review_required
      note: >-
        The v10 successor remains review_required, unfrozen,
        execution_authorized:false, evidence_eligible:false, and unapproved.
        EXP-SSI-9d821a, EXP-SSI-16649a, and all earlier predecessors remain
        immutable.
  asymptotic_promotion_gates:
    gate_1_proof_decomposition: open
    gate_2_numbered_heuristics: open
    gate_3_concrete_cost_table: open
    gate_4_independent_review_and_red_team: >-
      Completed only as an execution-blocking design review; all scientific
      promotion gates remain open.
  next_actions:
    - >-
      Open an additive v11 successor that publishes byte-level tables and
      complete framed preimages for every registered/nested/control object and
      resolves digest placement, registry serialization, and terminal identity.
    - >-
      Separate pre-target advice from target-bound construction; materialize
      source-generator, pair-matrix, edge predicate, provider trust typing,
      deterministic HNF/saturation/output, replay/null, event, and memory
      semantics with finite bounds.
    - >-
      Materialize and independently verify finite C-pair/synthetic controls and
      obtain a matched independently verified INCUMBENT-FOE-v1 measurement.
      Keep all SSI experiments unapproved, unfrozen, and unexecuted.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This batch measured nothing and promotes no technique, theorem, attack,
      exponent, security conclusion, or knowledge item.
  claim_ceiling: >-
    The strongest true statement is that EXP-SSI-7b1469 materially refines v9
    framing and finite interfaces but remains an execution-unauthorized,
    underdefined design. This is not evidence about SSI hardness or deployed
    security.
  decided_by:
    task: TASK-20260809-5b07f8
    role: coordinator
    policy: coordinator-orchestration-code
  decided_at: '2026-08-09'
