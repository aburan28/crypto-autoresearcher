  - TASK-20260810-ab0a07
  - DEC-20260810-d82c61
  - DEC-20260811-af68d1

  hypothesis_status_transition:
    from: specified
    to: refined_scoped

  rationale:
  - >-
    H1's OWN LITERAL CLAIM IS CONFIRMED, NARROWLY. H-ICINV-d5e351 claims
    decidability, not direction: "the comparison is decisive in both
    directions... it does NOT assert which way the comparison falls." The
    comparison was decisive -- falsification condition F4 fired cleanly (a
    pair of curves differing in one invariant family, surviving the gauge
    recheck and the second-backend cross-check) -- and both archivable
    branches the hypothesis pre-registered (F2/F3 closure, F4 variation)
    are exactly the vocabulary this evidence is reported in. This is
    genuinely confirmed and is the reason this decision is `refine`, not
    `weaken` or `reject_scoped`.
  - >-
    BUT THE PRACTICAL CONSEQUENCE THE FROZEN CONTRACT ATTACHES TO AN F4
    FIRING IS NOT LICENSED BY THIS SPECIFIC EVIDENCE. specification.yaml's
    success_criterion and DEC-20260810-a4bec4's own approval both state
    that ANY surviving cross-family variation "hands the campaign
    min_{E'~E} C(E') as a target" and promotes EXP-JINV-bd141d and
    EXP-VOLC-9f5571. Two independent reviews, and this Coordinator's own
    from-scratch sympy Groebner-basis derivation (a THIRD, fully
    independent method reaching the identical result), establish that the
    one family that varies -- elimination_factor_partition -- is, by exact
    symbolic identity and not by inference, the curve's classical rational
    2-torsion factorisation type: the monic generator of the Jacobian
    ideal's elimination to x3 alone is literally `x3^3 + a*x3 + b`, the
    curve's own Weierstrass cubic. Full derivation and its consequences are
    recorded in KN-FIND-ddd982, promoted by this decision. A quantity this
    campaign already computes elsewhere as `two_torsion_x_count`, already
    measured on THIS EXACT class in BATCH-cb71b5 with the IDENTICAL 66/72
    split, and already the explicit subject of H-ICINV-6c7920 as a
    sampling-bias nuisance covariate is not new information about Semaev-
    variety or Jacobian-ideal geometry, however elaborate the machinery
    (two CAS backends, Betti tables, singular loci) that arrived at it.
  - >-
    THE CLASS/CONTROL ASYMMETRY THAT MADE THE FINDING LOOK MOST STRIKING
    HAS A COMPLETE, TRIVIAL EXPLANATION NEEDING NO ISOGENY-CLASS ARGUMENT.
    The class never exhibits the irreducible-cubic partition (3,) (present
    49/138 times in the control) because the class's fixed trace (t=30)
    fixes an EVEN group order (3972) for every member, and Cauchy's/
    Lagrange's theorem then forces at least one rational 2-torsion point --
    ruling out zero roots of x^3+ax+b mod p identically. Any fixed-even-
    trace class would show this same absence; it is a property of the
    class's group order, not of its position among isogenous curves.
  - >-
    A SEPARATE, EQUALLY IMPORTANT CAUTION APPLIES TO THE SIX FAMILIES THAT
    DID NOT VARY. Both independent reviews flag -- and this Coordinator's
    own snapshot-commit verification independently confirmed from raw
    JSON -- that S_3 support, singular-locus dimension and degree,
    regularity, and the graded Betti table are constant not merely across
    the 138-curve class but at IDENTICAL values on the 138-curve control
    set. Falsification condition F2 treats exactly this pattern ("all four
    invariant families are constant... AND the random-curve control set
    exhibits the SAME single values... the constancy is a property of
    S_3's shape, not of the isogeny class") as a REFUTATION of curve-class-
    specific informativeness for the affected families -- but the run's own
    verdict-computation code only surfaces F2's caution when the WHOLE
    verdict is CLASS-INVARIANT, so it never fired here even though its
    substantive condition is met for six of the seven measured quantities.
    This is not a code defect (the contract's success_criterion is written
    at the whole-family level and the executor implemented it faithfully);
    it is a design gap this decision names rather than silently routes
    around.
  - >-
    NEITHER FINDING CONTRADICTS, NOR IS CONTRADICTED BY, DEC-20260810-cc6577.
    That decision adjudicated a DIFFERENT, specific mechanism claim --
    whether r-stratification/coverage explains EV-ENDO-10109d's within-
    class over-dispersion -- and found it does not (reject_scoped). This
    evidence is silent on that mechanism question; it establishes only that
    r (under a different name and a much more elaborate derivation) varies
    within a class, which was never in dispute and is not what
    DEC-20260810-cc6577 tested. H-ICINV-6c7920's own status is unaffected
    by this decision.
  - >-
    WHY `refine` AND NOT `support` OR `reject_scoped`. `support` would be
    read, in context, as endorsing the contract's promotion consequence,
    which this decision explicitly withholds. `reject_scoped` does not fit
    either: H1's own decidability claim was not refuted, and this decision
    is not refuting a specific proposed mechanism the way DEC-20260810-cc6577
    did. What actually happened is that a decisive, triple-independently-
    verified result was obtained, and what it teaches the campaign is how
    the NEXT version of this measurement (or its downstream consequence)
    needs to be refined before being relied upon further -- the textbook
    case this campaign's own `refine` decision precedent (e.g.
    DEC-20260731-003/004/005/006) already establishes.
  - >-
    A SEPARATE, EARLIER, INDEPENDENT DISPATCH OF THIS SAME CONTRACT EXISTS
    AND DOES NOT CONFLICT WITH THIS EVIDENCE. Merging origin/main a third
    time (after this evidence was drafted, before it was committed)
    surfaced TASK-20260810-ab0a07 -- another session's own dispatch of
    EXP-ICINV-e0cd8f, RUN-ICINV-e0cd8f-s0/-s1, which terminated at the SR3
    backend gate with `failed_infrastructure` and emitted NO verdict in
    either direction. That session's own environment had SageMath but
    correctly determined Sage's bundled Singular is not independent OF
    Sage, so three of seven primary metrics (graded Betti numbers,
    regularity, singular-locus degree) had no genuinely independent
    cross-check backend available, and the run stopped rather than
    substitute a weaker check -- a principled, honest infrastructure stop,
    not a defect. This branch's own dispatch succeeded because its
    handoff (TASK-20260811-d9d01e) had its executor install standalone
    Singular AND Macaulay2, two backends independent of each other and of
    any Sage installation, which is what actually closes the C-BACKEND gap
    for every metric. Per AGENTS.md rule 5, an infrastructure stop is never
    negative evidence; the two runs are compatible, not contradictory. The
    duplicate dispatch itself (two sessions independently approved-and-
    handed-off the same contract without visibility into each other) is
    the same recurring pattern DEC-20260810-d82c61 and DEC-20260811-af68d1
    already name for this goal's SR3 lane, now observed a fourth time.
    Resolved non-destructively: this branch's own execution_report.md and
    harness/exp_icinv_e0cd8f.py stay at their canonical paths (this
    evidence and KN-FIND-ddd982 are built on them); the other session's
    execution_report.md and its harness/exp_icinv_e0cd8f/ PACKAGE (which
    would otherwise silently shadow this branch's own exp_icinv_e0cd8f.py
    MODULE under Python's import resolution -- verified empirically, a
    same-named package always wins over a same-named module in the same
    directory) are preserved in full at new, clearly-labelled paths. Its
    own two run directories (RUN-ICINV-e0cd8f-s0/-s1) do not collide with
    RUN-ICINV-e0cd8f-m3class and are merged in unchanged.
  - >-
    THIS DOES NOT DEPRIORITIZE OR DIMINISH BATCH-d7e255's OTHER THREE
    CONTRACTS. EXP-JINV-bd141d and EXP-VOLC-9f5571 are not cancelled; they
    are correctly understood as NOT YET PROMOTED by this specific result,
    pending either (a) an explicit, checked mechanism argument connecting
    rational 2-torsion structure to Groebner-solving degree/regularity, or
    (b) the null-object control both independent reviews recommend (the
    same seven families computed on a size-matched set of generic,
    non-elliptic-curve polynomials of the same bidegree as S_3 and its
    partials, to determine whether the six constant families ever tested
    curve geometry at all). Neither is authorized or dispatched by this
    decision. AGENTS.md rule 9 (do not deprioritize a plausible lead
    without recording evidence, budget, test boundary and a concrete
    successor) is satisfied: the successor conditions are named explicitly
    above, not left implicit.

