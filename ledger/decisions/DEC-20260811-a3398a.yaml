  limitations:
  - >-
    This Coordinator's own symbolic re-derivation used sympy's `groebner`
    over `QQ.frac_field(a,b)` with lex order, matching (but computed
    independently of) the Red Team's own derivation. It was not additionally
    cross-checked against a THIRD symbolic-algebra system by this
    Coordinator; the Validator's own independent confirmation used a
    different method (direct factorisation and empirical cross-check on 18
    curves) rather than a third Groebner computation, so the identity rests
    on two independent symbolic derivations plus one independent empirical
    check, not three independent symbolic derivations.
  - >-
    Whether KN-FIND-ddd982's identity extends to the m=4 elimination
    construction is untested and explicitly named as open in that record.
  - >-
    The generic-polynomial null-object control both reviews recommend for
    the six constant families is not run by this decision and is named as
    a candidate future contract, not dispatched.
  - Toy scale throughout (p=4001, ~12 bits); claim_tier toy; sota_delta zero.

  next_actions:
  - >-
    Before EXP-JINV-bd141d or EXP-VOLC-9f5571 is described as "promoted" by
    any record: either produce an explicit, checked mechanism argument
    connecting rational 2-torsion structure to Groebner-solving degree or
    regularity of the summation-polynomial elimination system, or run the
    generic-polynomial null-object control on the six constant families and
    report its outcome. Neither is dispatched by this decision.
  - >-
    A candidate follow-up contract (not drafted here): the same seven
    invariant families computed on a size-matched set of generic bidegree-
    (2,2)-shaped trivariate polynomials that are NOT derived from any
    elliptic curve, to determine directly whether the six currently-
    constant families test curve geometry at all or are S_3-shape
    artifacts, per both independent reviews' recommendation.
  - >-
    EXP-ICINV-e0cd8f's own m=4 secondary metrics (support and singular
    locus, required; Betti/regularity, optional) were within budget
    (0.24 of 6 CPU-hours used) and were not computed in this run; a future
    dispatch could extend RUN-ICINV-e0cd8f-m3class's own class rather than
    opening a fresh run, if the m=4 question becomes a priority.
  - >-
    This decision does not touch EXP-ICINV-e0cd8f's OTHER sibling batch
    (BATCH-74ebef)'s open items: ICINV amendment v4 and CANL amendment v2
    remain filed, unapproved, awaiting the user's review, unaffected by
    anything in this decision.

