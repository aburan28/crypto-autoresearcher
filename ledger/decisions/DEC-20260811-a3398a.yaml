  context: >-
    EXP-ICINV-e0cd8f version 1 (TASK-20260811-d9d01e, approved by
    DEC-20260810-a4bec4) executed 2026-08-11: RUN-ICINV-e0cd8f-m3class,
    emitted verdict CLASS-VARYING. Independently re-verified by this
    Coordinator from raw artifacts before the snapshot commit (904841f8),
    then independently reviewed by both a Validator and a Red Team session
    (validation_report.md: "passed"; redteam_report.md: "sound execution,
    unsupported downstream interpretation"), each working independently of
    the other and of this Coordinator. This decision adjudicates
    H-ICINV-d5e351 and states plainly what this evidence does and does not
    license.

  decision: refine

  target_ids:
  - GOAL-ENDO-001
  - BATCH-d7e255
  - EXP-ICINV-e0cd8f
  - H-ICINV-d5e351
  - RQ-ICINV-475b5e
