coordinator_decision:
  id: DEC-20260901-34e038
  recorded_at: '2026-09-01'

  target_ids:
    - GOAL-ECDLP-001
    - RQ-ECDLP-002
    - H-ECDLP-a40416
    - ECDLP-IDEA-436

  decision: support
  decision_label: rc1_confirms_d1_collapse_toy_instance_kn_find_promoted_preliminary

  context: >-
    Disposes of RC-1 (TASK-20260901-400254, executor; archived by
    TASK-20260901-833888), the toy-scale measurement DEC-20260831-a9716f's
    Q-1 and DEC-20260901-255ebd's next_actions identified as the single
    remaining undischarged control before any KN-FIND promotion on
    ECDLP-IDEA-436's D1 derivation-tier finding could be warranted. The
    hypothesis this run tested, H-ECDLP-a40416, and its frozen specification
    EXP-ECDLP-c373eb, were approved concurrently by ordinary Coordinator
    authority in the same batch that opened this dispatch.

  decision_scope: >-
    CONFIRMS RC-1's result as genuine, independently re-verified evidence,
    not merely accepted from the executor's own report. This Coordinator
    independently re-derived the core claims from scratch using a SEPARATE
    implementation (different code from the executor's): confirmed the
    reported canonical lift S-hat satisfies the curve equation exactly mod
    p^8, reduces to S=(286,680) mod p exactly, and satisfies n*S-hat equals
    the exact projective identity mod p^8 (the order-n certificate);
    independently recomputed D1 for five (j,k) pairs spanning both on-fibre
    and off-fibre cases and found all five matched the reported image
    {0,8} exactly; and independently confirmed, by direct inspection of
    raw-result.json, that the reported {0,8} image holds across ALL 1035
    tested pairs (exhaustive coverage, not a sample) with zero exceptions,
    and that the null-lift control's image {0,1} is genuinely different.
    CONFIRMS the interpretation that Part 1 and Part 2 together support
    H-ECDLP-a40416's central claim (D1's mechanism, not merely its bare
    two-valued fact, is confirmed) and that Part 3's non-rigid-functional
    probe is statistically underpowered at six triples rather than
    confirming or refuting RTF-1 -- a distinction this decision preserves
    rather than collapsing into a false "pass" or "fail."

  what_this_decision_does_not_do:
    - >-
      It does NOT claim replicated or strong evidence. This rests on a
      single toy instance (one curve, one n=47); EV-ECDLP-f5c698's strength
      is recorded as preliminary. A second, independent toy instance would
      be needed to move toward replicated.
    - >-
      It does NOT close KN-OPEN-3417fc, which quantifies over any computable
      non-group-theoretic invariant, not only D1.
    - >-
      It does NOT dispose of ECDLP-IDEA-436 disjunct D2, which remains open,
      or of the ECDLP-IDEA-436 record as a whole (its own State remains
      proposed_unapproved_pending_review; this decision does not edit that
      frozen record, consistent with this program's established practice for
      idea records).
    - >-
      It does NOT retier KN-FIND-002 or KN-FIND-b7e091; the objections
      against their recorded tier/justification remain routed to their own
      unopened review-breakthrough round per DEC-20260831-a9716f.
    - >-
      It does NOT claim any cryptographic-scale result, attack, speedup, or
      breakthrough. Toy tier only.
    - It does not change H-CREP-001's status or EXP-CREP-001's specification (unrelated hypothesis/experiment line).

  non_claims:
    - >-
      Confirming D1's collapse on this toy instance is not a claim that
      structured attacks on prime-field ECDLP are broadly foreclosed; it is
      one more confirmed instance consistent with this program's existing
      generic-hardness baseline (KN-TECH-005), not a new theorem about that
      baseline.
    - >-
      The RTF-1 non-rigid-functional observation ({0} on six triples) is not
      evidence against RTF-1's rigidity reading; it is simply underpowered
      and is recorded as an open item, not a negative finding.

  rationale:
    - "Independent re-derivation from a separate implementation, checking the order-n certificate and five tabulated values directly rather than trusting the executor's self-reported spot-check alone, is the appropriate level of scrutiny for a genuine numerical result feeding a knowledge-corpus promotion -- especially following this session's own earlier same-day inadequate single-pass verification on a different round of this same proposal lane, disclosed in DEC-20260901-255ebd."
    - "Exhaustive coverage of all 1035 pairs (not a sample) is unusually strong evidence for a universal mathematical claim like Proposition E: a single toy instance searched exhaustively for a counterexample and finding none is a genuine, if narrow, confirmation -- stronger than a random sample would be for a statistical heuristic, though still short of replication across multiple instances."
    - "ECDLP-IDEA-436's own frozen record already anticipated this exact closure path (its own gate sentence: closed at exponent 1/2 without any experiment, once the GGM-simulability question resolved) and DEC-20260831-a9716f explicitly scheduled KN-FIND promotion to become eligible once this exact control ran -- this decision executes that already-recorded plan rather than exercising new discretion."

  evidence_refs:
    - ledger/evidence/EV-ECDLP-f5c698.yaml
    - experiments/EXP-ECDLP-c373eb/specification.yaml
    - experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-1/manifest.yaml
    - experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-1/raw-result.json
    - experiments/EXP-ECDLP-c373eb/execution-report.yaml
    - ledger/hypotheses/H-ECDLP-a40416.yaml
    - ledger/decisions/DEC-20260831-a9716f.yaml
    - ledger/decisions/DEC-20260901-255ebd.yaml
    - ideas/artifacts/ECDLP-IDEA-436/ggm_simulability_gate_erratum_20260831.md
    - knowledge/techniques/KN-TECH-73630e.md
    - knowledge/open-problems/KN-OPEN-3417fc.md

  limitations:
    - "Single toy instance, not replicated; strength preliminary, not strong or replicated."
    - "RTF-1's non-rigid-functional half remains untested in any discriminating sense (six generic triples, expected coincidence probability ~1/p per triple)."
    - "RC-3 (held-out oracle class outside KN-FIND-002/KN-FIND-b7e091) and RC-4 (frozen regression fixture) remain queued and undischarged per DEC-20260831-a9716f."
    - "This Coordinator's independent re-verification used a different implementation but the same underlying mathematical approach (Jacobian-coordinate scalar multiplication) as the executor; a structurally different verification method (e.g. a third-party computer-algebra system) was not used."

  knowledge_promotion:
    promoted: [KN-FIND-1ba0fe]
    not_warranted: null

  next_actions:
    - >-
      A second toy instance (different curve, different n) would move this
      finding from preliminary toward replicated; not urgent given the
      finding's narrow, negative-for-cryptanalysis scope, but available as a
      future low-cost action.
    - >-
      A genuinely discriminating test of RTF-1's non-rigid-functional half
      requires either a larger sample or a deliberately constructed triple
      exhibiting a mod-p coincidence; not dispatched by this decision.
    - >-
      RC-3 and RC-4 remain queued per DEC-20260831-a9716f and are not
      dispatched by this decision; they are zero-compute (RC-3) and require
      opening experiments/EXP-GGM-001/simulability_test.py (RC-4, not yet
      opened by any session in this lane).
    - >-
      Per this goal's own standing next_action (not superseded by this
      decision, which addresses a separate RQ-ECDLP-002 thread), the
      ordinary GOAL-ECDLP-001 / H-CREP-001 / EXP-CREP-001 line's own resume
      action remains this goal's primary open next step for the next batch.

