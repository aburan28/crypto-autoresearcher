coordinator_decision:
  id: DEC-20260809-0f8def
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-9b55d5
  context: >-
    Coordinator materialization of a new Arm-A successor after the fresh
    independent TASK-20260809-221bc9 NO-GO. This decision records a design
    repair only; it authorizes neither implementation nor execution.
  decision: revise
  target_ids:
    - GOAL-ECDLP-001
    - BATCH-9b55d5
    - H-ECDLP-f6d060
    - EXP-ECDLP-5ec1c5
    - EV-ECDLP-59a023
    - TASK-20260809-221bc9
  rationale:
    - >-
      The fresh independent review found four blocking protocol defects in
      the prior successor: map-level automorphism witnesses were not typed or
      fully bound, calibration search had no per-row terminal cap, the stated
      FULL/BASE prediction was absent from the success gate, and the baseline
      fixture did not freeze selector semantics.
    - >-
      This successor creates new immutable H and EXP records. Each generated
      map now has a typed index, generator word, formula and field witness,
      composition row, image of P, certified scalar, scalar certificate, and
      replay witness; closure and stabilizer receipts refer to exact map
      indices and the complete duplicate-free closure.
    - >-
      All eight calibration rows now carry the same finite 256-attempt cap and
      explicit unavailable or detector-mismatch terminal outcomes that
      invalidate the package without replacement. The success rule now tests
      FULL/NEG and FULL/BASE with Bonferroni-adjusted exact two-sided gates.
      The baseline audit freezes fixture mode, selector schedule, encoded
      inputs, and preimages while retaining the separate primary hash rule.
  official_state_changes: []
  official_state_change_note: >-
    H-ECDLP-f6d060 remains specified, EXP-ECDLP-5ec1c5 remains review_required,
    unfrozen, unauthorized, and evidence-ineligible. H-ECDLP-e42bda and
    EXP-ECDLP-2ebd6c are new design-only successor records. GOAL-ECDLP-001
    remains active. No mathematical conclusion or research status changes.
  evidence_refs:
    - EV-ECDLP-59a023
    - ledger/decisions/DEC-20260809-7ea901.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-e0da0a/reviews/TASK-20260809-221bc9/review_report.yaml
  limitations:
    - >-
      The successor is a design package only. It has no implementation, run,
      empirical evidence, approval, or freeze decision.
    - >-
      The finite toy claim ceiling and generic 1/2 exponent ceiling are
      unchanged; no finite-size design supports a cryptographic-scale claim.
    - >-
      Independent review, snapshot archive, proof-audit execution, and a
      separate Coordinator approval/freeze gate remain outstanding.
  next_actions:
    - Snapshot-archive TASK-20260809-a9d72e and all successor producer artifacts.
    - Obtain a fresh independent review-adversarial report against that exact snapshot.
    - If and only if that review passes, create a separate approval/freeze decision and Executor implementation task.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This record is a design repair after a NO-GO. It contains no empirical
      result, mathematical closure, or durable algorithmic claim.
  decided_by: coordinator
  decided_at: '2026-08-09'
  inference_provenance:
    runtime: codex_desktop_native
    requested_policy: coordinator-orchestration-code
    resolved_model_id: gpt-5
    model_verified: false
    fallback_used: false
    degraded_requirements: []
    bedrock_used: false
