    - >-
      H-ECDLP-2ade73 remains specified.
      classification_eligible remains false for
      the documented S2FIT gate reasons
      (DEC-20260907-c93a4c): W_rel loses primes
      after null subtraction, P2 does not exceed
      sha by the frozen factor of 10, and
      planted_theta does not exceed sha at three
      or more primes. That is not a W class and
      is not a reason to close the hypothesis.
      Do not rerun the S2FIT P2-versus-sha
      W-ratio nearby-object gate.
    - >-
      Previous rankings treated designing an
      unrelated open ECC idea as dominated while
      a live residual existed on the approved
      experiment. That residual is now
      discharged. Instruction 3 then ranks
      design of a related open RQ-ECDLP-002
      idea. IDEA-20260904-d84512 is open (no
      hypothesis or experiment cites it), cites
      RQ-ECDLP-002, and is an exponent-first
      measurement of advice length gamma_C under
      charged polylog decompression, with null
      H1 gamma -> 0, an anomalous-curve positive
      control, and an explicit distinction from
      closed Kolmogorov D3
      (IDEA-20260806-071255). Designing it is
      not approving it. This decision does not
      start that design.
    - >-
      IDEA-20260904-f7ee90 is already designed
      into H-ECDLP-75b566 and approved
      EXP-ECDLP-df601f; it is not a lane on this
      goal head and is not dispatched from
      BATCH-5a5091. IDEA-20260904-7caed1 is
      already cited by that hypothesis.
      IDEA-20260904-f68c7f converts a deferred
      H-ECDLP-a4be60 cost model.
      IDEA-20260904-742c48 and
      IDEA-20260904-ab226c cite RQ-ECDLP-165d4b,
      which is outside this goal's cited
      questions. Those are not selected.
    - >-
      Re-partitioning the 168-row S2CS table,
      Stage 5, a subset fit of a, the S2FIT
      W-ratio gate, CAND-D2-A, D2 closure,
      EXP-ECDLP-3930b1, a rerun of
      EXP-ECDLP-56ee42, and classifying the
      miss or any swap uniqueness as SMALL-W or
      LARGE-W remain dominated or forbidden.

