  decision: open_batch
  decision_label: batch_04272f_opened_md4_lower_control_and_method_ceiling_audit

  context: >-
    BATCH-46254b (gate package, BCP-1), BATCH-312472 (BCP-2 supersession +
    certificate kind), and BATCH-1f30fe (the blind calibration search) are
    CLOSED. The calibration verdict exists: decision-table row R6 (target
    FAIL, variant FAIL, R = 1.018031 COMPARABLE), cost anchor ~54-55 s for
    the bounded 2^21-block birthday enumeration at the declared encoding
    (hex 512-bit blocks, full 128-bit digest equality), instrument verdict
    = the declared instrument cannot close a 128-bit match at the declared
    budget and shows no recall tell (EV-MDFIVE-f3e1ca; DEC-20260821-6df1e9
    F-2/F-4). The calibration gate conditions of DEC-20260820-32bf19 F-6
    are all satisfied. THIS DECISION OPENS BATCH-04272f (batch 4 of the
    7-batch campaign): the METHOD-CEILING AUDIT, which OPENS WITH MD4 AND
    NOT MD5 (the committed binding from the goal head and DEC-20260821-
    6df1e9 F-6): the MD4 lower control (the cheaper digest in the family)
    plus the instrument-class question (what class of instrument could
    close the ~2^64-block gap, at what asymptotic cost), grounded in a
    frontier ledger built from primary text. The batch asserts nothing
    about MD5 and no security claim about MD4 (the published breakage of
    MD4 is cited, not claimed).

  scope:
    claim_ceiling: frontier_ledger_and_md4_control_scoping_only
    claim_ceiling_statement: >-
      This batch (a) builds a frontier ledger of the published MD4/MD5
      collision and preimage results from primary text (provenance:
      retrieved, recorded per entry), (b) scopes the instrument class
      through a falsifiable idea record (mechanism, asymptotic cost,
      campaign-scale feasibility, predictions, falsification, Pareto
      checks), and (c) executes the MD4 CONTROL RUN of the calibrated
      instrument class (bounded birthday enumeration) with its null-object
      control, to measure: the cost-anchor transfer to MD4's structure,
      the partial-hit signature (MD4 vs the MD5 calibration pair), and the
      BCP-2 decision-table row for the MD4 pair. All three are statements
      about the method/instrument at the declared scope and about published
      results (cited). NONE of them is evidence about MD5 (SC-2/SC-4), and
      none is a method-ceiling STATEMENT: that is the goal's completion
      criterion 3 and requires a named obstruction, an argument, and
      forward guidance (docs/inventor-protocol.md section 2) — the batch
      produces the evidence such a statement would rest on, and says so
      explicitly if the evidence does not yet carry one.
    in_scope:
      - >-
        RANK 1 (TASK-20260821-cbb510): ACQUISITION + FRONTIER LEDGER. RFC
        1320 (the MD4 specification) acquired under the network policy and
        filed under the batch inputs with its sha256 recorded. The
        published MD4 and MD5 collision/preimage frontier results,
        acquired in primary text under the BATCH-46254b source-
        preference order (TASK-20260810-bde128 acquisition-report.yaml is
        the precedent), one ledger entry per result (primitive, property,
        exponent_or_cost, method_family, citation, provenance, retrieval
        date, URL, verification note). Every candidate source the idea-
        generator or coordinator recalls is marked recalled until
        fetched; a result whose primary text cannot be obtained in
        primary text stays marked, with the source-preference order
        exhausted and recorded (a pause condition of the goal, checked at
        the close). The F-7 "first practical preimage attack" apparent
        error (DEC-20260810-1163ec F-7, UNSETTLED) is checked against the
        acquired texts: settled with the primary citation, or still
        UNSETTLED with the reason.
      - >-
        RANK 2 (TASK-20260821-229643): INSTRUMENT-CLASS AUDIT SCOPE.
        Given the committed frontier ledger, a falsifiable idea record,
        with 1-3 ranked candidates for the instrument class that could
        close the ~2^64-block gap in a 128-bit Merkle-Damgard digest, each
        with mechanism, asymptotic cost (from primary text,
        provenance-marked), campaign-scale feasibility (executable /
        measurable / argument-only), prediction, test boundary,
        falsification condition, dominated_by (checked against the
        frontier across time, memory, data/queries - null only after the
        check, per the inventor protocol's Pareto honesty) and sota_delta.
        Plus the concrete MD4 control-run specification (search
        parameters for the MD4 sibling instrument, n_max, key-table
        width, encoding) - the scope the Coordinator rules for RANK 3.
        Plus the named-obstruction candidate for the MD5 preimage
        frontier, or the explicit statement that the current evidence
        cannot name one (a fatigue report is unverified, not closure).
      - >-
        RANK 3 (TASK-20260821-c4a158): THE MD4 CONTROL RUN, per the
        Coordinator-ruled scope. harness/run_md4_calib.py is a standalone
        MD4 written from the RFC 1320 text (not imported from any
        library), with the SAME search structure as the frozen MD5
        instrument (bounded deterministic birthday enumeration, meet
        table over low digest bits, 16-step round fragments), --seed,
        --variant-shift, --deadline, run_wrapped charging. Two runs,
        SEQUENTIAL, the MD4 TARGET (variant-shift 0) and the MD4 NULL
        OBJECT (the 64 round constants T[i] of RFC 1320 section 3
        cyclically shifted by 16, T'[i] = T[(i+16) mod 64]; all other
        structure identical). Seed 0, 900 s wall ceiling each, 4 GB, 1
        run each, charged via run_wrapped wrapper-measured wall_seconds;
        cost = ceiling on halt. Sealed hash-manifested input set (RFC 1320
        sha256 + declared budget + seed + instrument sha256); CONSUMPTION
        declared NOT APPLICABLE (there is no MD4 quarantined payload; the
        MD5 quarantined payload is untouched and its sha256 is checked
        against the manifests for completeness, intersection must be
        empty). Interpretation strictly through BCP-2's decision table
        (R1-R6) with TOL = 2; the MD4 pair's R ratio uses the MD4
        target's own wall_seconds, and the COST-TRANSFER comparison uses
        the MD5 calibration pair (54.179836 / 55.156728 s, EV-MDFIVE-
        f3e1ca O-2) as the named cross-primitive baseline.
      - RANK 4 (TASK-20260821-86c2ba): isolated content_first snapshot with pre-freeze checks.
      - RANK 5 (TASK-20260821-02d397, red team) and RANK 6 (TASK-20260821-6a36a4, validator) CONCURRENTLY, sibling-blind under the pre-committed plan review-plan/review-plan-02d397.yaml.
      - RANK 7 (TASK-20260821-5b74dc): isolated commit-mode ledger archive (EV-MDFIVE-1a2952 + DEC-20260821-117817).
    out_of_scope:
      - Any further MD5 run: the MD5 side of the measurement is complete at its declared scope (DEC-20260821-6df1e9 F-6); batch 4 runs MD4 only, unless the ruled scope names an MD5-specific step.
      - The method-ceiling STATEMENT itself (completion criterion 3): it needs the named obstruction + argument + forward guidance and is decided at the close from what this batch and the remaining batches produce. Producing the evidence for it is in scope; asserting it is not, until the evidence carries it.
      - A reduced-scale or reduced-round demonstration of the differential/MITM method (the published breakthrough class): the ruled scope may name it for a LATER batch; it is not in this batch (budget).
      - Any BCP supersession (no BCP-3); the MD5 quarantine is untouched; any cost-model transfer to SHA-2 or other primitives; any assertion about the existence or non-existence of MD5 or MD4 collision paths (SC-2/SC-4).

  budgets:
    total_wall_clock_seconds: 6320
    per_task:
      TASK-20260821-a2cb2b: 160
      TASK-20260821-cbb510: 900
      TASK-20260821-229643: 900
      TASK-20260821-c4a158: 3000
      TASK-20260821-86c2ba: 160
      TASK-20260821-02d397: 450
      TASK-20260821-6a36a4: 450
      TASK-20260821-5b74dc: 300
    memory_gb: 4
    envelope_note: >-
      BUDGET-EXTENSION DECISION (recorded, not silent; the harness rule is
      that a budget extension is a Coordinator decision with a recorded
      rationale). The goal's campaign envelope was declared at 10800 s
      total. Batches 1-3 declared 3300 + 2880 + 4720 = 10900 s (the +0.9%
      recorded at the batch-3 opening, delta = in-loop review cost
      under-planned in the original envelope). Batch 4 declares 6320 s,
      bringing the cumulative declared total to 17220 s vs the 10800 s
      original plan (+59.4%). Rationale: (1) the batch cap, not the wall
      clock, is the binding campaign gate - this is batch 4 of 7; (2) batch
      4 IS goal completion criterion 3 (the method ceiling with its MD4
      control) - the campaign's own research target - and the remaining
      criteria cannot be reached without it; (3) the declared total is
      dominated by two 900 s run ceilings and two xhigh review sessions
      (1360 s of the 6320 s is review + archive overhead); (4) the batch-3
      disclosed implementation overrun (f5f96a, 4.3x) was an instrument-
      build cost, and this batch's instrument build (c4a158) carries the
      same shape at 3000 s declared. PRE-REGISTERED STOP CONDITION: if the
      cumulative declared total exceeds 18000 s before a batch-5 opening,
      the goal is PAUSED with a concrete resume action (user budget
      authorization recorded in a Coordinator decision) rather than
      re-declared again.
    run_basics:
      seed_policy: Deterministic seed 0 (0x0) for every stochastic element of the solver (fragment sampling, table ordering); the seed is a declared input of both runs and appears in both run records.
      encoding: >-
        Messages as 512-bit blocks, hex-encoded (64 hex chars per block);
        the collision target is equality of the full 128-bit MD4 digest of
        the two full messages. No certificate kind exists for MD4 pairs in
        harness/runner.py in this batch: a SUCCESS is not expected at this
        budget, and if one occurs it is verified through the standalone
        MD4 recomputation plus the two pinned MD5-implementation discipline
        analogue (both digests recomputed independently, m1 != m2), with
        the limitation that this is a WEAKER acceptance path than
        md5_collision_pair recorded in the run report; the md4_collision_
        pair certificate kind is a candidate for the next BCP supersession,
        not an in-batch addition (SC-6).
      charging_convention: >-
        BCP-2 charging_convention carried over: wrapper-measured
        wall_seconds via run_wrapped; caller-supplied timing not trusted;
        cost = the 900 s ceiling if a run halts there.
    null_object: >-
      The MD4 null object is the MD5 calibration's null object transposed
      to MD4's constants: T-prime[i] = T[(i+16) mod 64] over RFC 1320
      section 3's 64 round constants; all other structure (schedule,
      rotations, IV, chaining, step count) identical. TOL = 2 (fixed, not
      tuned), baseline = the MD4 target run's own wall_seconds for the
      decision-table R ratio; the MD5 calibration pair (54.179836 /
      55.156728 s) is the named cross-primitive cost-transfer baseline.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Reserved for the closing decision DEC-20260821-117817. This opening
      decision writes no evidence and reviews no cryptanalytic result, so
      it supplies no promotion warrant. A KN-LIT frontier-ledger entry is a
      CANDIDATE for the close (the ledger is exactly the kind of retrieved-
      provenance literature record the corpus carries); the closing
      decision decides with its concrete reason.

  reservations:
    closing_decision_reserved: DEC-20260821-117817
    batch_evidence_reserved: EV-MDFIVE-1a2952
    reservation_note: >-
      Both reserved identifiers are allocated and verified free but are
      written only by TASK-20260821-5b74dc and are deliberately absent
      from this decision's target_ids, which references committed records.

  protocol_state:
    protocol_of_record: BCP-2 at snapshot commit 8677f11af (frozen; immutable) - its null_object_control, charging_convention, cost_definition, decision table (R1-R6), and evidence-record requirements govern the MD4 control run by carry-over.
    pre_dispatch_gate: >-
      NOT APPLICABLE to this batch's runs (no quarantined payload is the
      input of an MD4 run; the MD5 gate remains verified and the payload
      untouched - its sha256 e44a3fed... is checked against both input
      manifests for completeness, intersection must be empty). Recorded as
      N/A, not omitted.
    confound_caveat: >-
      REQUIRED (INV-10) in the evidence record of any REDISCOVERY-eligible
      success, verbatim per BCP-2 evidence_record_requirement; a record
      without it is invalid. For the MD4 runs, the analogous caveat is the
      instrument-class statement: a success by the bounded enumeration
      against MD4 would still not separate genuine search from partial-
      structure recall (the null object's known limit), and it would be
      recorded with that limit named.

  hard_rules_for_this_batch:
    - SC-1 FABRICATE NOTHING: a run that halts at the ceiling records the ceiling as its cost and the search report as its result; unknown fields stay null and named.
    - SC-2 CLAIM CEILING: assert nothing about MD5; assert no security claim about MD4 (published results are cited with retrieved provenance, not re-claimed).
    - SC-3 UNVERIFIED FIGURES STAY MARKED: every cost, count, or bound carries its run ID and the charging convention; every frontier figure carries its provenance (retrieved / recalled).
    - SC-4 BUDGET OUTCOMES NEVER EVIDENCE: a FAIL of the MD4 runs is a statement about the instrument at the declared encoding, seed, and ceiling - never about MD4's or MD5's security.
    - SC-5 OPEN AND UNATTEMPTED STAY NAMED: the method-ceiling STATEMENT (named obstruction + argument + forward guidance) and the reduced-scale differential/MITM demonstration remain OPEN AND UNATTEMPTED in this batch.
    - SC-6 NO STATUS CHANGE / APPROVAL / PROMOTION / EDIT TO A COMMITTED RECORD: findings are reported; disposition is this decision's successor's. No in-batch addition of a certificate kind to runner.py.
    - SC-7 HALT AT THE DECLARED CEILING, REPORTED TRUTHFULLY: 900 s per run is a hard wall; a halted run is a complete, admissible observation.
    - SC-8 NEVER USE AMAZON BEDROCK: no runtime, agent, fallback, or probe may select a Bedrock backend; absence of an allowed runtime is a terminal infrastructure stop.
    - QUARANTINE: no batch task reads the MD5 quarantined payload (hash-only; its sha256 is checked against the MD4 input manifests, intersection must be empty).
    - INDEPENDENCE: the two reviewers are siblings in one round, do not read each other's reports, and the round runs under the pre-committed plan review-plan/review-plan-02d397.yaml.
    - SCOPE RULING: RANK 3 executes the MD4 control per the Coordinator's ruling of RANK 2's proposed scope, recorded in the dispatch record (queue completed_note + dispatch note) BEFORE RANK 3 runs; a scope the ruling does not approve is not executed (the f5f96a strategy-ruling precedent).

  reservations_and_next:
    - TASK-20260821-cbb510 (RANK 1 - acquisition + frontier ledger) runs ALONE first; it grounds every later claim in this batch.
    - THEN TASK-20260821-229643 (RANK 2 - instrument-class scope, idea-generator) ALONE; it reads RANK 1's committed-to-tree ledger.
    - THEN the Coordinator rules RANK 2's MD4 control-run specification (recorded before dispatch); THEN TASK-20260821-c4a158 (RANK 3 - MD4 control runs) ALONE.
    - THEN TASK-20260821-86c2ba (isolated content_first snapshot with pre-freeze checks) ALONE.
    - THEN TASK-20260821-02d397 (red team) and TASK-20260821-6a36a4 (validator) CONCURRENTLY, sibling-blind.
    - THEN TASK-20260821-5b74dc (isolated commit-mode ledger archive) ALONE, which checkpoints the goal head.
