coordinator_decision:
  id: DEC-20260921-8e8086
  context: >-
    Normalisation adjudication for EXP-ECDLP-fac9ea and the lambda-registry
    lane, resolving the concurrent-repair conflict disclosed in
    DEC-20260921-4516a0's limitations and PR #1339: the frozen
    specification's L2 normalisation clause broke the gate and control
    semantics (an L2-normalised sharp interval carries ~sqrt(p)·log p
    spectral mass, clearing every threshold vacuously), and TWO pre-run
    repairs of that defect exist. (a) Amendment DEC-20260921-f1d95a: the
    additive amendments path, probability normalisation (v = 1_A/|A|,
    mode-level indicator constructions), executed by RUN-ECDLP-8e13c2,
    RUN-ECDLP-ccf8f0, and RUN-ECDLP-0c5f65 exactly as their manifests
    record. (b) Commit 4785243985 (another session, 2026-09-21T18:07Z):
    an IN-PLACE rewrite of specification.yaml to a unitary normalisation
    (vhat = p^{-1/2}·sum, ||vhat||_2 = ||v||_2 = 1) with
    Thue-Morse/character constructions, which bypassed the amendments
    path and was not pulled before the run executed. Both repairs were
    made before any cell ran; the run executed (a). This ruling is a
    Coordinator contract-interpretation decision on records already read
    in full this session; it is itself subject to the owed independent
    adversarial review and creates no claim above the evidence tier.

  decision: supersede

  decided_by: coordinator

  target_ids:
    - experiments/EXP-ECDLP-fac9ea/specification.yaml
    - DEC-20260921-f1d95a
    - EXP-ECDLP-fac9ea

  rationale:
    - >-
      THE MATHEMATICAL RELATION, STATED FIRST: the two normalisations
      measure the same object up to a uniform prefactor --
      ||vhat||_1^{unitary} = p^{-1/2} · ||vhat||_1^{prob} exactly -- so
      lambda_unitary = lambda_prob - 1/2 for every statistic. Every
      DIFFERENCE the census promoted is invariant under the change
      (row-vs-row level comparisons, row-vs-Moebius stability deltas,
      row-vs-C02 level): EV-ECDLP-81f4d4's durable findings survive this
      adjudication unchanged, as its record already states. Only ABSOLUTE
      thresholds are affected.
    - >-
      CANONICAL NORMALISATION FOR ALL SUCCESSOR CONTRACTS: the probability
      normalisation (the executed one, amendment DEC-20260921-f1d95a).
      Grounds: it is the normalisation in which the two committed gate
      consumers' statements are calibrated -- IDEA-20260904-f68c7f (E)
      composes eps <= ||vhat||_1·n^{-1/2+o(1)} with bias quantities of
      scale 1/M and states the interval and top-bit families have
      L = O(log p)^{O(1)} (true for v = 1_A/|A|), and
      IDEA-20260920-b6ad24's thresholds lambda > 1/4 and lambda >= 1/6
      are stated in that scale. Under the unitary form every lambda shifts
      by -1/2 and the committed thresholds no longer mean what their
      sources state; a successor contract wanting unitary values derives
      them from any prob-normalised measurement by the relation above, so
      nothing is lost by fixing one scale of record.
    - >-
      THE IN-PLACE EDIT IS SUPERSEDED PROSPECTIVELY AS CONTRACT TEXT.
      Its mathematical critique -- the L2 clause is inconsistent with the
      frozen gates and controls -- is CORRECT, and is the same defect
      amendment DEC-20260921-f1d95a fixed through the amendments path.
      But its route (rewriting a frozen, approved specification in place,
      bypassing the additive-amendments rule) is a freeze violation, and
      its construction change (Thue-Morse/unimodular R03) is a different
      statistic family, not a correction of the executed one. The contract
      of record for EXP-ECDLP-fac9ea is specification v1 as amended by
      DEC-20260921-d3fafb, DEC-20260921-f1d95a, DEC-20260921-a796fe, and
      DEC-20260921-e7edc5; the in-place edited text at commit 4785243985
      governs nothing. The file is not rewritten (corrections supersede,
      never overwrite): this decision is the supersession record, and the
      git history carries both texts.
    - >-
      OPEN ITEM, NOT DECIDED BY FIAT: the R03 reproduction construction.
      The executed census measured the mode-level popcount indicator at
      0.4191 (marginal against the KN-FIND-ffe1df 0.39 band edge 0.42);
      the Thue-Morse/unimodular construction is the other candidate
      reading of that record's measurement and has NOT been measured. A
      future calibration experiment may measure both constructions under
      the canonical normalisation; until then the reproduction status
      stays 'marginal, construction-scoped' exactly as EV-ECDLP-81f4d4
      records it.
    - >-
      FREEZE-BYPASS FLAG, for the harness ledger's attention: an in-place
      edit of a frozen, approved specification bypassed the amendments
      path and raced an in-flight execution (the run executed its own
      manifest's contract; the edit was not pulled before execution and
      was discovered only at push). Two sessions independently found the
      same defect; the amendments path is the route of record, and this
      incident is recorded as an auditable process finding, not a
      mathematical one.
  evidence_refs:
    - experiments/EXP-ECDLP-fac9ea/amendments/DEC-20260921-f1d95a.yaml
    - experiments/EXP-ECDLP-fac9ea/analysis.md
    - ledger/evidence/EV-ECDLP-81f4d4.yaml
    - RUN-ECDLP-8e13c2
    - RUN-ECDLP-ccf8f0
    - RUN-ECDLP-0c5f65
    - ledger/proposals/IDEA-20260904-f68c7f.yaml
    - ledger/proposals/IDEA-20260920-b6ad24.yaml
  limitations:
    - A Coordinator contract-interpretation ruling, made in the same
      session that executed the runs; it is covered by the owed
      independent adversarial review and should be re-examined there.
    - >-
      It adjudicates CONTRACT interpretation, not mathematics: the
      invariant findings it relies on are EV-ECDLP-81f4d4's and remain
      self-reviewed until that review runs.
  next_actions:
    - >-
      The owed independent adversarial review of EV-ECDLP-81f4d4, both
      extension runs, and this ruling -- still blocked behind the
      role-runtime outage (AWS DescribeInstances AuthFailure at bootstrap,
      six consecutive role-agent failures; recheck: probe a role subagent
      or run the adapter doctor).
    - >-
      Synthetic coordinate-statistic design (the census's named
      successor) proceeds under the probability normalisation as fixed
      here; no successor contract may re-litigate the scale without a
      new amendment citing measured grounds.
    - >-
      Optional calibration design candidate: measure the
      Thue-Morse/unimodular digit-family construction under the canonical
      normalisation to settle the R03 reproduction construction question.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      A contract-interpretation ruling, not a research finding: nothing
      here is promotable to knowledge/. The mathematical content it
      relies on (the prefactor relation, the invariant findings) is
      already on record in EV-ECDLP-81f4d4 and analysis.md, pending the
      owed independent review.
