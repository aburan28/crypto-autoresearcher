coordinator_decision:
  id: DEC-20260808-0de8b2
  goal_id: GOAL-SSI-001
  batch_id: BATCH-284f63
  recorded_by_task: null
  archived_by: coordinator

  context: >-
    DEC-20260807-f360f9 re-scoped the "NIST-III/V retain comfortable
    margins" documentation correction after finding the flagged sentence in
    analysis/SSI-ECDLP-SYNTHESIS-20260803.md describes a different quantity
    (GOAL-P13-001's Delfs-Galbraith margin) and that the document's own
    GOAL-SSI-001 section (Section 2) predates the SQIsign concrete-cost
    work entirely and contains no NIST-I/III/V margin statement at all. It
    named two valid paths forward: add a correctly-scoped statement to
    Section 2, or independently verify and correct Section 3 on its own
    terms. This decision executes the first path.

  decision: revise

  decision_scope: >-
    Adds one addendum section to an analysis document. Establishes no new
    empirical finding -- every figure cited was already independently
    verified before this decision (twice by red-team sessions in BATCH-284f63,
    a third time by EV-SSI-0c529c). This decision's own contribution is
    citation and scope discipline: placing the already-verified figures in
    the correct document location with the correct caveats, not measuring
    anything new. Section 3's separate P13/ECDLP margin claim remains
    untouched and unverified by this decision, per DEC-20260807-f360f9's
    second named path, which is not attempted here.

  target_ids:
    - analysis/SSI-ECDLP-SYNTHESIS-20260803.md
    - EXP-SSI-9b542d
    - EV-SSI-59f7a2

  evidence_ids:
    - EV-SSI-a42460
    - EV-SSI-0c529c

  rationale:
    what_was_added:
      basis: >-
        A new subsection in Section 2 ("Addendum, 2026-08-08") states the
        growing-gap finding (9.5387/21.9537/38.8387 bits at NIST-I/III/V,
        MC_P13_CORRECTED, S=A=c=0) with its full provenance chain
        (DEC-20260806-a00a28, DEC-20260806-e2a6fa, EV-SSI-a42460,
        EV-SSI-0c529c, RUN-SSI-9b542d-001), re-verified by direct
        arithmetic a fourth time in this decision
        (128-118.461337=9.538663, 192-170.046299=21.953701,
        256-217.161337=38.838663) and matching all three prior independent
        recomputations exactly.
    scope_discipline_preserved:
      basis: >-
        The addendum explicitly states the finding is a cost-model result
        on an extrapolated estimator with certificate.kind: none, that
        memory feasibility (not security margin) is the only axis actually
        favouring NIST-III/V in practice (every level memory-infeasible by
        25-114 bits above Earth's storage, per EV-SSI-a42460), and that
        EV-SSI-59f7a2's separate 2^{120-123} NIST-I figure is a DIFFERENT
        quantity carrying its own unresolved SC-1/SC-3 caveat -- not
        conflated with the growing-gap figure this addendum corrects.
        MONO-3's non-monotone finding is disclosed for completeness rather
        than omitted, with its non-blocking status stated per the frozen
        run's own acceptance criteria.
    non_conflation_with_section_3:
      basis: >-
        The addendum's closing paragraph explicitly names that Section 3's
        "NIST-III/V retain comfortable margins" sentence describes the
        GOAL-P13-001 Delfs-Galbraith margin, a different quantity, and
        points to DEC-20260807-f360f9 for why it was left unedited rather
        than overwritten with these numbers -- so a future reader of
        Section 3 is not misled by this addendum's presence in Section 2.

  limitations:
    - >-
      Section 3's own P13/ECDLP margin claim ([8.3498,13.1544]-bit bracket)
      remains independently unverified. This decision does not evaluate
      whether that claim is itself correct.
    - >-
      EV-SSI-59f7a2's SC-1/SC-3 labeling caveat remains unresolved --
      flagged again here, not fixed. A superseding record for it is still
      owed per DEC-20260806-a00a28.
    - >-
      EV-WESO-001's anchor-error correction and EXP-WESOVOW-001/cost_model.py's
      source-level fix (the two remaining items of GOAL-SSI-001's original
      four queued corrections) are untouched by this decision.

  next_actions:
    - >-
      GOAL-SSI-001.next_action updated in this same commit: the synthesis-
      document correction is now DISCHARGED. Three items remain queued --
      EV-WESO-001's anchor re-derivation, EV-SSI-59f7a2's SC-1/SC-3
      superseding record, and EXP-WESOVOW-001/cost_model.py's source fix.
      Any one is a valid next batch.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This decision places already-established, already-cited figures into
      correct documentation context. It creates no new durable
      cryptanalytic claim beyond what EV-SSI-a42460 and EV-SSI-0c529c
      already record.

  decided_by: coordinator
  decided_at: '2026-08-08'
