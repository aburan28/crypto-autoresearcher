  limitations:
    - >-
      THE ZERO DOES NOT ATTRIBUTE. The characteristic-versus-descent-multiplicity
      sub-question is INCONCLUSIVE, and this limitation is load-bearing rather
      than decorative: it is why the promoted finding may not be worded as the
      prior expected.
    - >-
      THE RESULT IS NOT ABOUT ELLIPTIC CURVES. The same [0,0,0,0] is returned by
      both nulls, the singular cubic and an ordinary random quartic pair.
    - >-
      Nothing here bears on D > 8, m > 3, d > 2, the solving degree, yield,
      cost, KN-OPEN-002, or whether the 8 dim V law survives to a DESCENDED
      prime-field presentation, which was never built.
    - >-
      CTRL-BINARY-CALIBRATION is a SAME-CONSTRUCTION known-answer test, not a
      byte-exact replay: the fixture's own matches_archived_system_hash is false
      because Sage is absent on this host and the system was rebuilt in pure
      Python. Every archived invariant reproduces. Disclosed by the producer.
    - >-
      The twin's whole trivial-syzygy budget at D = 8 is ONE Koszul pair against
      78 at the calibration cell. The twin is measured where almost nothing can
      happen for ANY pair of quartics; the exclusion is real and the space of
      relations it excludes is small.
    - >-
      NULL-TOPOLOGY is not a distinct control at E2 at any tested s (E2's
      support IS its whole topology box) and is a near-duplicate at E1, so the
      null band width is 0 by construction and "inside the band" reduces to
      "exactly 0". All six curve templates are identical, so the null arms carry
      no curve variability at all.
    - >-
      The s = 1 slice runs in ORDINARY mode at d = B in {4, 8} while every
      measured arm runs in MIXED mode at d = 2, so it reproduces cb8e46's
      ENCODING and not the instrument configuration the twin values come from.
      No boundary or strictness claim on the tested axis is available from it.
    - >-
      The load-bearing identification - that the twin instantiates
      KN-FIND-006's parameter k as s - is ASSERTED, not derived, and is not
      numbered among the heuristic assumptions. In KN-FIND-006 k is
      simultaneously dim V, the number of descended equations per S_3, and the
      variable count per leaf; the twin reproduces only the third and sets the
      second to 1, and the generator-threshold table shows the second is the
      load-bearing one at p = 2.
    - >-
      The deciding cell replicates over 11 distinct generator systems, not 12;
      the blind re-derivation covers 12 of 246 draws.
    - >-
      "The twin at p = 2" is not a characteristic-only perturbation: the digit
      leaves collapse to their lowest bit and the generator degree drops from 4
      to 3. No future reading may treat p = 2 as a member of the twin's (s, p)
      family. The plan's declared p = 2 failure signature was itself partly
      wrong and the reviewer corrected it.
    - >-
      Two coded-rule fidelity notes (analyze.py's M1 test uses a residual
      against the topology median, and S_MAIN excludes the s = 6 cells), and one
      instrument default (default_frobenius is ring-keyed, not generator-keyed).
      Neither changes a number here; both must be named before reuse.
    - >-
      Correlated judgement: producer and both reviewers report the same model
      family with model_verified false; no backend could be probed.
    - >-
      This decision was composed by a Coordinator subagent with no shell and no
      interpreter; it ran no code and executed neither
      tools/check_review_independence.py nor tools/validate_ledger.py.
  next_actions:
    - >-
      THE ONE NEXT ACTION FOR THIS LANE. Before any knowledge finding attributes
      the twin's zero to characteristic, run the DESCENT-SEPARATION CONTROL as a
      bounded, zero-risk cell under a NEW experiment id: the F_{p^k} chained twin
      at k = v = 2 with p in {4099, 16411} - the two chained S_3 equations over
      F_{p^2} with leaves in an F_p-subspace V of dimension 2, Weil-descended
      over F_p into 4 quartic generators in 8 ordinary variables - measured with
      the SAME meter, the SAME cumulative convention and the SAME deficit
      definition at D = 5..8, with the A(g) and D1 planted-syzygy ladder
      attached as its positive control. Pre-flight is 1980 rows x 12870 columns,
      well inside the 60,000-column cap and minutes of CPU. It is the ONLY
      object in or near this battery that separates "characteristic 2" from
      "descent multiplicity": a nonzero deficit there isolates descent
      multiplicity as the carrier and refutes the characteristic-2 attribution,
      and a zero there at k = 2 and k = 3 is the first evidence that would
      actually support it. Either way it converts the open objection into a
      measurement.
    - >-
      RECORDS THE ORCHESTRATING SESSION MUST ALLOCATE IDENTIFIERS FOR - each a
      SUPERSEDING record, never an edit. (a) An annotation of H-PFDR-9aadc0 (S2)
      and of stage0-derivation.md section 4 separating the RIGOROUS
      trivial-syzygy count from the HEURISTIC attainment of the bound, so that
      no record calls the Koszul-only baseline derived. (b) An annotation
      numbering the k -> s identification as a heuristic assumption in its own
      right, with its justification or its withdrawal. (c) A correction note
      recording that F3 fires literally under the contract's own cumulative
      formula while both integers are KN-FIND-006's own, and that the
      calibration headline and the twin headline are different functionals.
      None is created by this decision, and this agent allocated no identifiers.
    - >-
      ATTACH THE PLANTED LADDER TO THE METER'S VALIDATION NOTE and report it
      BESIDE the four arms whenever the all-zero table is presented, so that
      "0" carries a scale (resolution 1, observed range 0..805 at D = 8) rather
      than reading as an instrument that cannot move. Record deficit(8) with its
      KERNEL IDENTIFICATION - the kernel dimension and the fact that the Koszul
      vector spans it - and not only the integer, since that is what makes
      "rows - rank - koszul = 0" a statement about syzygies.
