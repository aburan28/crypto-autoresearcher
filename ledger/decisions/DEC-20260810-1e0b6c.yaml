coordinator_decision:
  id: DEC-20260810-1e0b6c
  goal_id: GOAL-MD5-001
  question_id: RQ-MDFIVE-6870c1
  batch_id: BATCH-46254b
  recorded_by_task: null
  recorded_by_task_note: >-
    NULL BY CONSTRUCTION, NOT BY OMISSION. This decision was authored while
    TASK-20260810-fc23ce was being executed, but it is NOT that task's product:
    fc23ce's declared write_scope is
    coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/archives/TASK-20260810-fc23ce
    only, and ledger/decisions/ is outside it. It is a Coordinator disposition of
    a defect DISCOVERED during that task, taken under the standing Coordinator
    authority to dispose of a defective task specification, and no dispatch-queue
    task was minted for it. Naming fc23ce here would misattribute a ledger write
    to a task that was forbidden to make one.
  decision: revise

  decision_scope: >-
    ARCHIVE MECHANICS ONLY. This decision voids ONE DEFECTIVE TASK SPECIFICATION
    inside the BATCH-46254b dispatch queue and requires a successor. IT ASSERTS
    NOTHING ABOUT MD5 AT ANY TIER - no collision, no preimage, no complexity, no
    method ceiling, no obstruction, and no comparison against any published
    result in either direction. It reviews no evidence, changes no hypothesis,
    question, experiment or goal status, approves no experiment, authorizes no
    search, promotes nothing, records no attestation and no review verdict, and
    touches no record of any other goal. The batch's claim ceiling,
    protocol_freeze_implementation_pin_and_literature_acquisition_only, is
    UNTOUCHED, and so is the ranked shape approved by DEC-20260810-9942ea. The
    defect is in a harness contract, not in the research.

  context: >-
    TASK-20260810-fc23ce is the isolated snapshot archive of the BATCH-46254b
    opening control plane and was the batch's single ready task. Its declared
    artifact was authored and committed; while binding that commit to the
    dispatcher's archive verifier, the dispatching session found that the task's
    archive specification is UNSATISFIABLE - not failed, not unfinished, but
    incapable of reaching state `completed` against tools/research_dispatch.py
    under any execution. This decision records what is durable, states the defect
    and its root cause, records the disposition the dispatching session already
    applied, and names the repair. It is authored because a task that can never
    complete must be disposed of by an explicit Coordinator act with its
    reasoning on the record, not left to be rediscovered by the next session that
    tries to dispatch this batch.

  target_ids:
    - GOAL-MD5-001
    - BATCH-46254b
    - TASK-20260810-fc23ce
    - TASK-20260810-cbd708

  # ===================================================================
  # WHAT IS DURABLE. RECORDED FIRST, SO THE DEFECT IS NOT MISREAD AS LOSS.
  # ===================================================================
  what_is_durable:
    receipt_commit: >-
      TASK-20260810-fc23ce's declared artifact, the snapshot receipt at
      coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/archives/TASK-20260810-fc23ce/snapshot-receipt.json,
      was authored and committed at
      a7d59bdf2dea629d7a0690db743babe72babfc95, first parent
      7df1972a4e084e3272ee124ea211f2268ea44ceb, on branch
      coord/harness-hourly-20260810-0910. That commit changed exactly one path:
      the receipt. The receipt is reachable from HEAD.
    receipt_contents_independently_verified: >-
      The dispatching session re-verified all THIRTEEN declared digests in the
      receipt against the working tree: 13 of 13 match, 0 mismatches. The
      fourteenth path_sha256 entry is the receipt's own, recorded as the string
      SELF by the established fixed-point convention. All FOURTEEN
      archive.record_ids appear in the commit message.
    opening_control_plane_already_durable: >-
      INDEPENDENTLY OF THIS TASK. Commit 230038427 - "research: GOAL-MD5-001 open
      BATCH-46254b (TASK-20260810-cbd708)" - is on origin/main and carries
      batch.yaml, dispatch_queue.json, ledger/decisions/DEC-20260810-9942ea.yaml,
      all ten task cards and all ten ledger handoff records, byte-identical to
      the current tree. Nothing this decision voids removes anything from that
      commit, and no artifact of BATCH-46254b is lost, unwritten or at risk.
    sha_form_note: >-
      230038427 is reproduced in the abbreviated form in which it was observed
      and reported, and is NOT expanded here; expanding it would be guessing
      characters that were not observed (SC-1).

  # ===================================================================
  # THE DEFECT. THIS IS THE SUBSTANCE OF THE DECISION.
  # ===================================================================
  the_defect:
    statement: >-
      TASK-20260810-fc23ce CAN NEVER REACH STATE `completed`, because its
      specification is unsatisfiable against tools/research_dispatch.py's own
      archive verifier. This is a property of the specification, not an outcome
      of the execution: no amount of re-running, re-staging or re-committing
      changes it.
    chain_verified_by_running_the_tool:
      - >-
        STEP 1. The verifier derives expected_paths for an archive task as that
        task's artifact_paths UNION its source tasks' artifact_paths
        (research_dispatch.py:564). For fc23ce that is fc23ce.artifact_paths
        UNION cbd708.artifact_paths = four paths: the snapshot receipt,
        coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/batch.yaml,
        coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/dispatch_queue.json,
        and ledger/decisions/DEC-20260810-9942ea.yaml.
      - >-
        STEP 2. A `completed` archive task must have path_sha256 EQUAL to
        expected_paths exactly - not a subset (research_dispatch.py:577).
      - >-
        STEP 3. The verifier then requires the archive COMMIT's changed-path set
        to equal expected_paths exactly, rejecting both missing and extra paths
        (research_dispatch.py:1073-1089).
      - >-
        STEP 4. But cbd708's three artifacts were committed by cbd708 ITSELF,
        inside commit 230038427, which changed 24 paths. They are immutable
        committed records. So NO LATER COMMIT CAN CHANGE EXACTLY THOSE FOUR PATHS
        without rewriting immutable records - which AGENTS.md rule 4 ("Results
        are immutable records. Corrections create new records.") and the fc23ce
        task card's SC-6 both forbid. Steps 2 and 3 cannot both be satisfied.
    observed_rejections_quoted_verbatim: |-
      archive task TASK-20260810-fc23ce path_sha256 contains paths outside its commit scope
      archive task TASK-20260810-fc23ce commit must change exactly declared archive and source artifacts (missing ['.../batch.yaml', '.../dispatch_queue.json', 'ledger/decisions/DEC-20260810-9942ea.yaml'])
    observed_rejections_note: >-
      Quoted as reported by the dispatching session, which ran the tool. The
      '...' in the second message is that session's own elision of the
      coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/ prefix; it is left
      unexpanded here so the quote stays a quote.
    root_cause_stated_plainly: >-
      THE BATCH-OPENING ACT COMMITTED ITS OWN ARTIFACTS, leaving its snapshot
      archive with an EMPTY DELTA over them. A snapshot archive is only
      satisfiable when the work it archives is left UNCOMMITTED for the archive
      to commit. cbd708 wrote batch.yaml, dispatch_queue.json and
      DEC-20260810-9942ea and they were committed at 230038427 before fc23ce
      ever ran; fc23ce was then asked to produce a commit whose changed-path set
      includes three paths that were already durable and that it therefore could
      not change.
    second_independent_disagreement: >-
      ALSO OBSERVED, AND SEPARATE FROM THE ABOVE. The fc23ce task card directs
      staging the ten BATCH-46254b handoff records under ledger/handoffs/, but
      the queue-derived expected_paths EXCLUDES them, and including them is
      itself a rejection under STEP 1's subset check. The card's staging list and
      the queue's artifact_paths were authored separately and NOTHING CHECKS THEM
      AGAINST EACH OTHER. Either staging set is rejected; the two documents
      cannot both be obeyed. This is a second defect in the same task and must be
      repaired in the successor's card, not silently absorbed.

  # ===================================================================
  # DISPOSITION ALREADY APPLIED BY THE DISPATCHING SESSION. RECORDED, NOT RE-APPLIED.
  # ===================================================================
  disposition_already_applied:
    applied_by: the dispatching session, before this decision was authored
    queue_state: >-
      dispatch_queue.json sets TASK-20260810-fc23ce state to `invalid`. Its
      archive.commit_sha and archive.path_sha256 were left carrying the OBSERVED
      values, with an explanatory path_sha256_note, so that the work that was
      genuinely done stays auditable rather than being erased along with the
      defective specification.
    why_invalid_and_not_completed: >-
      `completed` is unreachable, and asserting it would additionally make the
      whole queue UN-RENDERABLE - blocking every future run of this batch, not
      just this task. With `invalid` the queue renders cleanly with no dispatch
      errors.
    why_invalid_and_not_queued: >-
      `queued` was rejected as DISHONEST AND WASTEFUL: it would advertise the
      task as ready and make every future run re-attempt an act that cannot
      succeed.
    verified_consequence: >-
      BATCH-46254b NOW HAS ZERO READY DISPATCHES, verified by re-rendering the
      queue. Every remaining task defers behind
      "dependency_not_completed:TASK-20260810-fc23ce:invalid". THE BATCH IS
      STALLED pending the repair in next_actions.
    latest_verified_commit: >-
      REMAINS NULL for GOAL-MD5-001, and this decision does not advance it. The
      receipt's content was verified BY HAND (13 of 13 digests) but the
      dispatcher's archive verifier REFUSED THE TASK, so no archive of this goal
      is dispatcher-verified. Under AGENTS.md rule 7 as this program applies it,
      hand verification is not the verifier's acceptance, and recording it as
      such would be the precise kind of overstatement the field exists to
      prevent.

  # ===================================================================
  # WHY `revise`.
  # ===================================================================
  why_this_verb:
    chosen: revise
    reasoning: >-
      The template vocabulary is approve | revise | replicate | expand | support
      | weaken | reject_scoped | pause | supersede. `revise` is the honest verb
      for "this task's specification is defective and is voided; a successor with
      a corrected specification is required": the object being changed is a plan,
      the change is bounded to one task inside it, and the batch's approved shape
      survives.
    why_not_supersede: >-
      `supersede` would say a committed IMMUTABLE RECORD is being replaced
      wholesale by a corrected one. Nothing here is. DEC-20260810-9942ea stands
      unamended, the batch record stands, the receipt stands, and the ten
      handoffs stand. Exactly one task's archive block is defective.
    why_not_pause: >-
      `pause` would say the work is halted pending a judgement, a budget or an
      unblocking event. It is not: the repair is concrete, cheap, and named in
      next_actions, and the batch resumes as soon as it lands.
    why_not_reject_scoped_or_weaken: >-
      Both are EVIDENCE verbs about a theory. Using either here would imply a
      mathematical finding where there is none. Under AGENTS.md rule 5 and this
      program's standing rule, a tooling contradiction is INFRASTRUCTURE SIGNAL
      and is never a negative result about anything.
    why_not_approve: >-
      Nothing is approved. No new task, budget, artifact or claim is authorized
      by this act; minting the successor is a subsequent act with its own card
      and handoff.

  rationale:
    - >-
      AN UNSATISFIABLE TASK MUST BE VOIDED EXPLICITLY, NOT LEFT TO ROT. A task
      whose completion gate cannot be met by any execution will be re-attempted
      by every future session that reads the queue, each one burning its budget
      rediscovering the same contradiction. Recording the impossibility once,
      with the verifier's own rejections quoted, converts a recurring cost into a
      one-time one.
    - >-
      THE DEFECT IS IN THE SPECIFICATION, AND SAYING SO IS THE POINT. The work
      fc23ce was actually asked to produce - a truthful receipt binding the
      opening control plane to observed hashes - WAS PRODUCED, COMMITTED AND
      INDEPENDENTLY RE-VERIFIED AT 13 OF 13 DIGESTS. Recording this as a task
      failure would blame an execution that did everything available to it, and
      would leave the real cause - a queue authored so that an archive had an
      empty delta - in place to recur.
    - >-
      `invalid` IS THE HONEST TERMINAL STATE AND IT IS ALSO THE OPERABLE ONE, and
      those two facts pointing the same way is worth stating rather than
      assuming. `completed` is false AND makes the queue un-renderable for every
      future run; `queued` is false AND makes every future run re-attempt an
      impossible act; `invalid` is true AND renders cleanly. The disposition did
      not have to choose between honesty and operability here, and it should not
      be read as having done so.
    - >-
      A STALLED BATCH IS REPORTED AS STALLED. BATCH-46254b has ZERO ready
      dispatches and every task deferred behind an invalid dependency. That is
      stated plainly in this decision and in the goal head rather than left for a
      session to infer from an empty dispatch plan, because an empty plan and a
      finished batch look identical from the outside.
    - >-
      latest_verified_commit STAYS NULL BECAUSE THE VERIFIER SAID NO. Thirteen
      hand-checked digests are a real observation and are recorded as one; they
      are not the dispatcher's acceptance, which is what that field means. The
      cheapest way to hollow out a verification field is to fill it with the
      strongest evidence to hand rather than the evidence it names.
    - >-
      THE ROOT CAUSE GENERALISES AND THE LESSON IS CHEAPER THAN THE INCIDENT. An
      opening act that commits its own artifacts leaves its snapshot archive
      nothing to do, and the dispatcher's exact-delta rule then rejects it
      forever. Any batch in this program opened the same way will stall the same
      way at exactly the same step, and this decision states the rule so the next
      opening does not have to derive it from a rejection message.
    - >-
      THE CARD-VERSUS-QUEUE DISAGREEMENT IS RECORDED AS A SECOND DEFECT, NOT
      FOLDED INTO THE FIRST. It has an independent cause - two documents authored
      separately with nothing checking one against the other - and would survive
      a repair aimed only at the empty-delta problem.

  evidence_refs:
    - coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/archives/TASK-20260810-fc23ce/snapshot-receipt.json
    - coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/dispatch_queue.json
    - coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/task-cards/TASK-20260810-fc23ce.md
    - ledger/decisions/DEC-20260810-9942ea.yaml

  evidence_refs_note: >-
    EVERY ENTRY IS CITED FOR WHAT IT IS, AND ALL FOUR ARE HARNESS ARTIFACTS. The
    receipt is cited for the commit, parent, staged path set and observed
    digests it records. The queue is cited for the task's archive block,
    artifact_paths, dependency edges and its now-`invalid` state. The task card
    is cited for the staging list that disagrees with the queue. DEC-20260810-9942ea
    is cited as the decision that opened this batch and declared its ranked shape
    and claim ceiling. NO RUN RECORD, EVIDENCE RECORD OR KNOWLEDGE ENTRY SUPPORTS
    ANYTHING HERE, because this decision draws no scientific conclusion. The
    verifier behaviour at research_dispatch.py:564, :577 and :1073-1089 was
    observed by the dispatching session by RUNNING THE TOOL, and the two
    rejection strings above are its output, quoted rather than paraphrased.

  hypothesis_status_transition:
    hypothesis_id: null
    changed: false
    reason: >-
      GOAL-MD5-001 has no active hypothesis and this act creates none. A defect
      in a dispatch queue's archive bookkeeping produces no falsifiable claim
      about MD5 and must not be dressed as one.

  goal_status_transition:
    from: active
    to: active
    changed: false
    reason: >-
      Voiding one task is not a goal transition. GOAL-MD5-001 stays `active`, its
      current_batch_id stays BATCH-46254b, and its latest_verified_commit stays
      null. Only its next_action is rewritten, to name the stall, the reason and
      the single repair. A stalled batch is not an exhausted campaign and is not
      a pause condition: none of the goal's four declared pause_conditions is
      engaged by a harness defect with a named repair.

  asymptotic_promotion_gates:
    status_all: OPEN
    note: >-
      No asymptotic or concrete cost claim exists under this goal, so all four
      gates of agents/coordinator.md are open and untouched. This decision moves
      none of them and creates no claim that could approach them.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      THIS IS A HARNESS AND TOOLING DEFECT, NOT A RESEARCH FINDING ABOUT MD5. No
      evidence was reviewed, no EV-* record exists for this goal, no producer has
      run, no independent validation or red-team report exists, and no `support`
      or `reject_scoped` determination on `replicated` or `strong` evidence is
      available - so the promotion trigger in agents/coordinator.md is not
      reached in either direction. Promoting a KN-FIND here would file a
      statement about a dispatch verifier's exact-delta rule into
      knowledge/findings/, which is the corpus of internal findings ABOUT
      CRYPTANALYSIS. The generalisable lesson is instead carried where it binds -
      in this decision's next_actions and in the goal head - and if it warrants a
      durable home later it belongs to the harness documentation, not to
      knowledge/findings/.

  limitations:
    - >-
      THIS DECISION IS ABOUT ARCHIVE MECHANICS ONLY AND ASSERTS NOTHING ABOUT MD5
      AT ANY TIER. No collision, no preimage, no complexity figure, no method
      ceiling, no obstruction, and no comparison against any published result in
      either direction. It changes no hypothesis or question status, approves no
      experiment, authorizes no search, promotes nothing, satisfies no promotion
      gate, records no attestation and no review verdict.
    - >-
      THE BATCH'S CLAIM CEILING IS UNTOUCHED:
      protocol_freeze_implementation_pin_and_literature_acquisition_only, exactly
      as DEC-20260810-9942ea set it. So is the approved ranked shape: RANK 1
      BCP-1 before RANK 3 acquisition, for the contamination-firewall reason that
      decision gives, and the blind calibration search remains OUT OF THIS BATCH
      under any budget.
    - >-
      EVERY GIT AND TOOL OBSERVATION HERE IS ATTRIBUTED, NOT PERFORMED BY THIS
      AUTHOR. The author of this record had NO SHELL: no git command, no hash, no
      render of the dispatch queue and no run of tools/research_dispatch.py was
      executed by it. The commit identifiers, the 13-of-13 digest agreement, the
      24-path count for 230038427, the two rejection strings and the zero-ready
      dispatch count are reproduced verbatim from the dispatching session's
      observations and are recorded at that provenance and no stronger (SC-1).
      The verifier line numbers and the immutability and vocabulary rules were
      READ DIRECTLY FROM THE FILES, and so were the successor-shape constraints
      in next_actions - the non-empty archive.source_task_ids rule
      (research_dispatch.py:351, :85-93), the non-archive-source rule (:545-548),
      the one-assignment-per-source rule (:553-557), the readiness rule in
      `blockers()` (:630-639) and the failure-provenance source requirement
      (:205-215). READ IS NOT RUN: those are the author's reading of the code,
      not the tool's verdict, and the queue re-render named in next_actions is
      what settles them.
    - >-
      THE SUCCESSOR'S ADMISSIBILITY IS NOT ASSERTED BY THIS DECISION. next_actions
      names the shape a satisfiable archive block must have; whether a
      particular successor actually renders and verifies must be established by
      re-running tools/research_dispatch.py against the amended queue BEFORE
      dispatch, not by relying on this reasoning. The failure mode being repaired
      is precisely a specification believed satisfiable without being checked.
    - >-
      NO IDENTIFIER WAS MINTED OR CHECKED BY THIS ACT. DEC-20260810-1e0b6c was
      pre-allocated and verified free with tools/allocate_id.py --check outside
      this session. No other identifier is minted here, and next_actions
      deliberately NAMES NO SUCCESSOR TASK ID: an unminted identifier written
      into a record is how two worktrees come to write different records under
      one name (AGENTS.md rule 14).
    - >-
      NO KNOWLEDGE RETRIEVAL WAS PERFORMED BY THIS ACT, which had no retrieval
      tool available. NO absence, novelty, prior-non-testing or saturation
      inference follows in any direction (AGENTS.md knowledge retrieval policy).
    - >-
      THE FIVE DEPENDENT GOALS ARE UNAFFECTED AS RECORDS AND DELAYED AS A MATTER
      OF FACT. This decision changes no status, budget, scope, priority or
      next_action of GOAL-SHA1-001, GOAL-SHA2-001, GOAL-SHA3-001, GOAL-BLAKE-001,
      GOAL-ASCON-001, GOAL-SIMSPK-001 or GOAL-RSA-001. But BCP-1 is what unblocks
      five of them for protocol and setup work, BCP-1 is downstream of the
      stalled task, and so the stall delays them in fact. Stated here so the
      delay is visible rather than discovered.

  next_actions:
    - >-
      MINT A SUCCESSOR COORDINATOR SNAPSHOT-ARCHIVE TASK FOR THE BATCH-46254b
      OPENING CONTROL PLANE. Allocate its identifier with
      `python3 tools/allocate_id.py --next handoff --date <today>` and confirm it
      with `--check` before use; NO IDENTIFIER IS NAMED HERE, because naming an
      unminted one is how collisions are created (AGENTS.md rule 14).
    - >-
      THE SUCCESSOR'S ARCHIVE BLOCK MUST BE SATISFIABLE, WHICH IS THE ENTIRE
      POINT OF THE REPAIR, AND THE ADMISSIBLE SHAPE IS TIGHTER THAN IT LOOKS.
      Every archive task must declare a NON-EMPTY archive.source_task_ids
      (research_dispatch.py:351, with require_text_list defaulting to
      allow_empty=False at :85-93), and an archive may archive only NON-ARCHIVE
      sources (:545-548). Two consequences follow directly. "Archive only its own
      receipt, declaring no source task" IS NOT ADMISSIBLE. And
      TASK-20260810-fc23ce cannot be the successor's source, because it is itself
      an archive task. THE ONLY SATISFIABLE SHAPE IS AN ARCHIVE WHOSE DECLARED
      SOURCE IS A NON-ARCHIVE TASK WHOSE artifact_paths WILL STILL BE UNCOMMITTED
      WHEN THE ARCHIVE RUNS, so that its commit can change exactly the derived
      expected_paths.
    - >-
      CONSEQUENCE, AND IT IS WHY THE REPAIR IS NOT A ONE-LINE QUEUE EDIT.
      TASK-20260810-cbd708 cannot serve as that source, twice over: its three
      artifacts are already immutable at 230038427 so the delta would again be
      empty, AND it is already assigned to fc23ce, which may not hold two
      assignments for one source (:553-557) and may not drop its only source
      without violating the non-empty rule (:351). Expect the repair to require
      minting BOTH a non-archive successor task that writes genuinely uncommitted
      artifacts AND the archive over it - or, if that proves inadmissible too, a
      Coordinator act that reopens the batch rather than patches it. WHICH OF
      THOSE IS CORRECT IS NOT DECIDED HERE and must be established by re-render,
      not by this reasoning.
    - >-
      REPOINT THE DEPENDENCY EDGE, OR THE BATCH STAYS STALLED EVEN AFTER THE
      SUCCESSOR COMPLETES. TASK-20260810-26d0d5 currently depends on
      TASK-20260810-fc23ce, which is now terminally `invalid`, and `blockers()`
      defers any task whose dependency is not `completed`
      (research_dispatch.py:630-639). The queue amendment that adds the successor
      must also move that edge to it. Nothing downstream becomes dispatchable
      until it does. THE FAILURE-PROVENANCE ESCAPE HATCH DOES NOT APPLY HERE and
      should not be attempted: a preserved terminal dependency must be a SOURCE
      of the failure-provenance archive that preserves it (:205-215), and fc23ce
      cannot be any archive's source because it is an archive (:545-548).
    - >-
      AUTHOR THE SUCCESSOR'S TASK CARD FROM THE QUEUE'S DERIVED expected_paths,
      NOT INDEPENDENTLY OF IT. The second defect above exists because the card's
      staging list and the queue's artifact_paths were written separately and
      nothing compared them. The successor's card must name exactly the paths the
      verifier will derive, and must not direct staging the ten ledger handoff
      records - they are already committed at 230038427 and any extra path is a
      rejection.
    - >-
      RE-RENDER THE QUEUE WITH tools/research_dispatch.py AND CONFIRM THE
      SUCCESSOR IS READY BEFORE DISPATCHING IT. The defect being repaired is a
      specification that was believed satisfiable without being checked against
      the tool; repeating that belief about the repair would reproduce the
      incident.
    - >-
      GENERAL LESSON FOR FUTURE BATCH OPENINGS, STATED SO THE NEXT ONE DOES NOT
      DERIVE IT FROM A REJECTION MESSAGE: AN OPENING ACT MUST NOT COMMIT THE
      ARTIFACTS ITS OWN SNAPSHOT ARCHIVE IS DECLARED TO ARCHIVE. The opening act
      WRITES ITS ARTIFACTS AND LEAVES THEM UNCOMMITTED for the snapshot task to
      commit. That is not one option among several: an archive must declare a
      non-empty, non-archive source (:351, :545-548), so "archive only its own
      receipt" is NOT available as a fallback. Any other arrangement gives the
      archive an empty delta over already-immutable records, and the dispatcher's
      exact-changed-path rule then rejects it permanently.
    - >-
      AFTER THE SUCCESSOR'S ARCHIVE IS ACCEPTED BY THE DISPATCHER, and only then,
      GOAL-MD5-001's latest_verified_commit may be advanced - in its own
      Coordinator act, from the verifier's acceptance, never from a hand check.
      Then the batch resumes at TASK-20260810-26d0d5 (BCP-1) and
      TASK-20260810-927ab5 exactly as DEC-20260810-9942ea approved; this decision
      re-ranks nothing.

  decided_by: coordinator
  decided_at: '2026-08-10'

  inference_provenance:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: claude-opus-5
    model_verified: null
    model_verification_basis: >-
      Self-reported by the answering session's own runtime context. Neither
      `python3 -m orchestration.adapter resolve --role coordinator` nor
      `doctor --probe` was run, because this session has no shell; the identifier
      is reported at that provenance and no stronger, and remains unverified
      configuration until a probe confirms it.
    fallback_used: false
    degraded: false
    degraded_requirements: []
    policy_honoured_note: >-
      The requested policy was honoured and NO SUBSTITUTION AND NO DOWNGRADE was
      made. Had the resolved model not served coordinator-orchestration-code, the
      instruction was to refuse rather than downgrade.
    amazon_bedrock_selected_configured_probed_contacted_or_used: false
