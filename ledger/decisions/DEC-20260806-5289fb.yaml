coordinator_decision:
  id: DEC-20260806-5289fb
  decided_by: coordinator
  decided_at: '2026-08-06'
  decision: approve
  target_ids:
  - GOAL-HQC-001
  - RQ-HQC-001
  - H-HQC-18d1b4
  - EXP-HQC-982268
  context: 'GOAL-HQC-001 next_action asked for exactly one thing: open BATCH-003 and DESIGN THE MEASUREMENT
    of the high-order joint moment on the true space (T). That design exists and was independently reviewed,
    but it was never promoted out of the BATCH-003 task directory: H-HQC-18d1b4 and EXP-HQC-982268 lived
    only under coordination/goals/GOAL-HQC-001/batches/BATCH-003/tasks/TASK-20260803-c470c0/ as proposed_hypothesis.yaml
    and proposed_specification.yaml, so neither was a ledger record and neither could be dispatched. This
    decision promotes both and opens BATCH-6fddee.'
  rationale:
  - 'The design satisfies all four requirements the next_action imposed: (i) it targets a HIGH-ORDER joint
    moment mubar_k for k=2..k_max rather than a pairwise correlation, per D-6; (ii) it samples on space
    (T) with true fixed-weight x,y,r1,r2,e and never on model space (M), per D-5; (iii) it carries i.i.d.-by-construction
    NULL ARMS of the same shape with an INV-NULL gate, per docs/inventor-protocol.md; (iv) its reduced
    parameters and extrapolation are stated as numbered heuristics. It also honours D-3 by not pursuing
    A19.'
  - 'Independent review is on the record and is favourable: TASK-20260802-addcdd (validator) returns PASS
    / PASS_WITH_DEFECTS with the design''s own diagnostic gates D1-D5 intact, and TASK-20260802-e5ebe9
    (red team) recomputed all eight snapshot hashes and matched them.'
  - 'BATCH-003 also produced a genuine CLOSURE at the inventor-protocol section 4 standard, which the
    validator checked and confirmed: no unbiased unconditional Monte-Carlo estimator that samples (T)
    can measure A17''s failure at STANDARDIZED HQC parameters at any budget, because T_req ~ 1/DFR and
    the specification designs DFR below 2^-128. Named obstruction, argument, and forward guidance (importance
    sampling, explicitly not designed and not claimed to work). This is why the approved contract measures
    at REDUCED parameters, which is what completion criterion 1 asks for in the first place.'
  limitations:
  - APPROVAL IS OF THE CONTRACT, NOT AN EXECUTION AUTHORIZATION FOR ALL OF IT. The contract models 55,785
    core-seconds; at this host's 4 cores that is ~13,946 wall-seconds against a WHOLE-CAMPAIGN budget
    of 10,800 seconds that BATCH-001..003 have already drawn on. Only Stage A (1,692 core-seconds) is
    authorized to execute.
  - THE COORDINATOR DOES NOT RAISE THE BUDGET. Removing or raising campaign_budget is the user's call;
    a Coordinator self-grant is precisely what this program has refused elsewhere and it is refused here.
  - Stage A validates the INSTRUMENT. It measures nothing about HQC. No log2_A_k, no statement about A17
    or A5, no DFR claim, and no claim about standardized parameter sets may be drawn from it.
  - Claim-tier ceiling stays toy. Nothing here is admissible toward an AGENTS.md rule 13 closure quorum,
    and no hypothesis status moves.
  - 'The four asymptotic-complexity promotion gates are NOT engaged: this batch advances no asymptotic
    claim, so none of the four is satisfied and none is claimed.'
  evidence_refs:
  - coordination/goals/GOAL-HQC-001/batches/BATCH-003/reviews/TASK-20260802-addcdd/validation_report.yaml
  - coordination/goals/GOAL-HQC-001/batches/BATCH-003/reviews/TASK-20260802-e5ebe9/red_team_report.md
  - coordination/goals/GOAL-HQC-001/batches/BATCH-003/tasks/TASK-20260803-6f50df/oracle_report.md
  - coordination/goals/GOAL-HQC-001/batches/BATCH-003/tasks/TASK-20260803-c470c0/feasibility_analysis.md
  knowledge_promotion:
    promoted: []
    not_warranted: No new durable claim is established by this decision. It promotes an already-reviewed
      design into the ledger and authorizes an instrument-validation stage; no measurement has been taken.
      The BATCH-003 infeasibility closure is a candidate KN-FIND, but it belongs to the batch that produced
      and reviewed it and is not re-promoted here on second hand.
  next_actions:
  - Execute BATCH-6fddee TASK-20260806-64b506 (Stage A only, 1692 core-seconds).
  - Snapshot-archive its receipts before any independent read.
  - Run TASK-20260806-43a44f (validator) and TASK-20260806-dd901b (red team) on the snapshot.
  - Ledger-archive evidence + decision, then rerank against the remaining campaign budget.
