coordinator_decision:
  id: DEC-20260810-2f86db
  decided_at: '2026-08-10'
  decided_by: coordinator
  goal_id: GOAL-MONO-001
  batch_id: BATCH-003
  batch_note: >-
    NO NEW BATCH IS OPENED BY THIS DECISION. batch_id names BATCH-003 because
    this decision adjudicates the single re-scoping question that BATCH-003's
    closing decision DEC-20260802-a51c82 left as its N-1. The campaign budget
    remains exhausted (campaign_budget.maximum_batches is 3, BATCH-003 was the
    third) and no run, census or experiment is authorized here.
  decision: reject_scoped
  decision_note: >-
    reject_scoped in the template vocabulary. WHAT IS REJECTED IS THE
    INSTRUMENT, NOT THE QUESTION. The rejected object is the frozen
    generic-fibre Frobenius cycle-type census (EXP-MONO-4b50b6's instrument
    form) considered AS A PROBE OF INDEX-CALCULUS RELATION RATE, at every m
    including m >= 4. What is NOT rejected: the relation-rate half of
    KN-OPEN-009 as a research question; the imprimitivity half of KN-OPEN-009,
    which stays live and non-degenerate at m >= 4; any statistic other than
    the generic-fibre cycle type; and the m=3 derivational content already
    supported by DEC-20260802-a51c82. This record answers DEC-20260802-a51c82
    next action N-1 by taking its option (ii), narrowed: it does not adopt N-1's
    own phrase "a scoped no-go for the relation-rate half of KN-OPEN-009",
    because that phrasing is broader than the evidence supports. See D-2.

  answers: DEC-20260802-a51c82 next_action N-1
  answers_note: >-
    This decision ANSWERS, and does not supersede, DEC-20260802-a51c82. That
    record's findings D-1 through D-4, its ICEX feed supersession, its rule_12
    status and its N-2/N-3 stand unaltered and are not rewritten here.

  target_ids: [RQ-MONO-001, EV-MONO-a0a89c, KN-OPEN-009]
  evidence_refs: [EV-MONO-a0a89c]
  corrections: [CORR-20260802-1d8384]

  rationale:
    - id: D-1
      text: >-
        THE INSTRUMENT CANNOT DISCRIMINATE, AND THE REASON IS DERIVATIONAL, NOT
        EMPIRICAL. EV-MONO-a0a89c OBS-5 establishes unconditionally, at every m,
        by the group law, that if x_1..x_{m-1} are x-coordinates of F_p-rational
        points then the roots of S_m(x_1..x_{m-1},T) are exactly
        x(eps_1 P_1 + ... + eps_{m-1} P_{m-1}) over sign vectors - 2^{m-2}
        values, matching deg_T S_m - and every one lies in F_p. So S_m splits
        completely over F_p on the factor-base locus. Verified at m=4 by
        TASK-20260802-1b4130 objection O-9: S_4 built by the resultant recursion
        over F_211, 193/193 triples of rational x-coordinates split completely
        with root set exactly {x(+/-P1 +/-P2 +/-P3)}. ON THAT LOCUS THE CENSUS
        STATISTIC IS THEREFORE IDENTICALLY TRIVIAL - constant, zero variance,
        across every curve, every prime and every m. A statistic that is constant
        across curves cannot distinguish between curves. Hence the generic-fibre
        cycle-type census cannot produce curve-specific relation-rate deviations
        at any m, and an m >= 4 census in this instrument's form buys nothing
        that is not already known before it runs. That is a genuine no-go for
        the instrument, and it is a no-go by derivation - it needs no further
        measurement to establish, and no further measurement could overturn it
        without overturning the addition law.
    - id: D-2
      text: >-
        THE NO-GO IS SCOPED TO THE INSTRUMENT AND MUST NOT BE ALLOWED TO GROW.
        DEC-20260802-a51c82 N-1 offered as its option (ii) "a scoped no-go for
        the relation-rate half of KN-OPEN-009". THAT PHRASING IS TAKEN, BUT
        NARROWED, AND THE NARROWING IS DELIBERATE. What OBS-5 closes is the
        generic-fibre Frobenius cycle-type census as a probe of relation rate.
        It does not close the question of whether Semaev-cover geometry
        influences index-calculus relation supply; it shows only that this
        particular statistic is blind to it, because the statistic is evaluated
        on a locus where it is constant. Recording a blanket no-go for the
        relation-rate half of KN-OPEN-009 would be an overclaim by omission and
        would commit exactly the premature-closure failure mode that
        docs/inventor-protocol.md treats as symmetric with overclaiming -
        declining to search because a target looks saturated. The instrument is
        saturated. The target is not shown to be.
    - id: D-3
      text: >-
        THE IMPRIMITIVITY HALF OF KN-OPEN-009 IS CARRIED FORWARD UNCHANGED AND
        LIVE. At m >= 4, deg_T S_m = 2^{m-2} >= 4, so the block-system and
        resolvent-decomposition mechanism KN-OPEN-009 hunts is NON-DEGENERATE
        there. EV-MONO-a0a89c boundaries are explicit on both sides of this: the
        half is vacuous at m=3 for degree reasons (a transitive degree-2 group
        is primitive by definition, so the mechanism cannot exist before any
        curve is examined), and NOTHING IN BATCH-003 IS EVIDENCE ABOUT m >= 4.
        Nothing in this decision touches that half, weakens it, or licenses
        reading D-1 as bearing on it. The instrument no-go is about a relation-
        rate statistic; imprimitivity is a group-structure question and is
        untested at the scale where it is even well-posed.
    - id: D-4
      text: >-
        THE CONCRETE SUCCESSOR IS A DIRECTION SWAP, AND IT IS AN UNTESTED
        PROPOSAL, NOT A RESULT. AGENTS.md research-direction integrity requires
        that any deprioritization name a concrete successor or revisit
        condition, so the successor is named here in full and labelled for what
        it is. THE OBSERVATION: the census instrument samples the BASE
        coordinates (x_1..x_{m-1}) uniformly from F_p^{m-1} and reads the
        Frobenius cycle type of the fibre in the T-coordinate; OBS-5 restricts
        the BASE to the factor-base locus and finds the fibre trivial there.
        Index-calculus relation search does the OPPOSITE: it FIXES T = x(R) for
        a random multiple R and searches for (x_1..x_{m-1}) in FB^{m-1} lying on
        the fibre of the projection to the T-line. The governing count is the
        number of FB-rational points on that (m-2)-dimensional fibre. OBS-5 does
        NOT show that count trivial - it is a different statistic over a
        different projection, and it is the one the attack actually consumes.
        The successor route is to instrument THAT statistic instead. THE
        DIRECTION SWAP IS PROPOSED, NOT VALIDATED; no computation supporting it
        was performed in this session.
    - id: D-5
      text: >-
        THE SUCCESSOR CARRIES ITS OWN CHEAPEST FALSIFICATION CHECK, TO BE RUN
        BEFORE ANYTHING EXPENSIVE, AND IT IS UNVERIFIED HERE. Semaev polynomials
        are symmetric in all their variables. So at m=3, IF OBS-1's identity
        disc_T S_3(x1,x2,T) = 16 f(x1) f(x2) transports under that symmetry to
        disc_{x2} S_3(x1,x2,T0) = 16 f(x1) f(T0), THEN the swapped statistic
        collapses to the same quadratic character product at m=3 and the swapped
        route is degenerate at m=3 in exactly the way the original was. THIS
        TRANSPORT WAS NEITHER COMPUTED NOR REVIEWED IN THIS SESSION AND IS
        RECORDED AS UNVERIFIED. It is a designed minimal discriminating test
        handed to the successor - a cheap pre-compute falsification check in the
        sense of docs/inventor-protocol.md section 8, where a failed audit is
        itself the useful result. Dispositions: if the transport holds, the
        swapped route is dead at m=3 and only m >= 4 remains open for it; if it
        does not hold, the swapped statistic is the live relation-rate
        instrument and is the thing a future batch should measure. Either way
        the check is cheap and must precede any harness work.
    - id: D-6
      text: >-
        CRITERION (c) WAS NEVER ADJUDICATED, AND THAT GAP IS RECORDED AS A
        FINDING. GOAL-MONO-001 completion_criteria offers three alternatives;
        (c) is "a scoped instrument/protocol no-go is recorded".
        DEC-20260802-a51c82 N-2 reasoned ONLY about criterion (a) - that the
        census was shown non-discriminating and so did not decide
        full-versus-exceptional monodromy - and concluded "no completion
        criterion is met" without ever examining (c). The goal's own
        paused_because repeats that conclusion. The no-go recorded in D-1 is, on
        its face, the object criterion (c) asks for. SO THIS DECISION BRINGS
        GOAL-MONO-001 WITHIN ONE STEP OF completed. A later reader must not
        infer from status paused that the goal lacks progress; it lacks one
        review.
    - id: D-7
      text: >-
        THAT ONE STEP IS AGENTS.md RULE 12, WHICH IS NOT SUSPENDED. Closing a
        goal is a CLOSURE RESULT, and rule 12 requires that any claim proposed
        as a breakthrough, closure result, or contradiction of established
        evidence receive independent review-breakthrough review at max effort,
        on a backend that can reach it, undegraded. ONLY RULE 13 - the
        three-model closure quorum - IS SUSPENDED (AGENTS.md "Goal closure
        quorum"; CLAUDE.md non-negotiable 8). Rule 12 is a separate and still
        binding requirement, and the suspension of 13 does not touch it. THIS
        SESSION IS COORDINATOR-ONLY BY ITS OPERATING INSTRUCTION AND DISPATCHED
        NO REVIEWER. NO RULE-12 REVIEW WAS OBTAINED, SO NONE IS RECORDED - no
        attestation, no verdict, no review is asserted here, because none
        happened.
    - id: D-8
      text: >-
        THE BLOCKER IS ALSO STRUCTURAL, AND IT IS AN INFRASTRUCTURE FINDING FOR
        THE PROGRAM RATHER THAN A COMPLAINT. In this worktree the command
        `PYTHONPATH=. python3 -m orchestration.adapter doctor` was run and
        reported every API backend unusable for want of credentials - anthropic,
        fireworks, fireworks-anthropic, openai, openrouter, zai and zai-anthropic
        each reporting `$..._API_KEY unset (backend unusable)` - with only
        `local` reporting OK. A genuinely model-independent review-breakthrough
        at max effort is therefore NOT OBTAINABLE on this harness as currently
        credentialed. This is the same single-backend pathology that motivated
        suspending rule 13, and the same pathology EV-MONO-a0a89c already records
        as its unresolved MODEL CORRELATION confound and DEC-20260802-a51c82
        records under rule_12_status. Rule 12 was not suspended alongside 13, so
        criterion-(c) closure for GOAL-MONO-001 is at present UNREACHABLE FOR AN
        INFRASTRUCTURE REASON RATHER THAN A RESEARCH ONE. Recorded plainly so
        the program can decide whether to credential a second backend or to
        revisit the asymmetry between rules 12 and 13.
    - id: D-9
      text: >-
        THEREFORE THE GOAL STAYS paused, AND THIS IS NOT AN UNDERSTATEMENT
        VIOLATION. CLAUDE.md non-negotiable 8 forbids retiring a goal that met a
        criterion under paused or closed_at_budget in order to understate it.
        That prohibition is not engaged here, and the reason is in the
        criterion's own words: (c) is satisfied when a scoped instrument no-go
        "is recorded". This decision RECORDS the no-go - as a Coordinator
        proposal whose adoption as official closure is gated on the rule-12
        review that was not obtained. The goal is held open, not understated:
        its status is paused pending a review, its progress is stated
        prominently in D-6, and the next action names closure as the immediate
        next step once that review lands. Marking the goal completed on a
        Coordinator's own unreviewed no-go would be the actual violation - of
        rule 12 - and would be the stronger error.
    - id: D-10
      text: >-
        NOTHING HERE IS A CRYPTANALYTIC RESULT. The claim tier ceiling stays
        toy. No hypothesis status changes; GOAL-MONO-001 has no hypothesis
        record and active_hypothesis_ids stays empty. Nothing in this decision
        is admissible toward the AGENTS.md rule 13 closure quorum. No security
        estimate for any curve at any size moves in either direction.

  what_is_closed_and_what_is_not:
    closed_at_scope: >-
      The generic-fibre Frobenius cycle-type census, in the frozen instrument
      form of EXP-MONO-4b50b6, AS A PROBE OF INDEX-CALCULUS RELATION RATE, at
      every m. No m >= 4 census in that form is authorized or worth its budget.
    not_closed:
      - >-
        The relation-rate question of KN-OPEN-009 itself. A different statistic
        on the same geometry - see D-4 - is untested.
      - >-
        The imprimitivity / block-system half of KN-OPEN-009 at m >= 4, where
        deg_T S_m = 2^{m-2} >= 4 and the mechanism is non-degenerate.
      - >-
        Whether the direction-swapped statistic of D-4 discriminates. Its own
        cheapest falsification check (D-5) is unverified in this session.

  rule_12_status:
    finding: >-
      AGENTS.md rule 12 IS NOT SATISFIED for the closure this decision proposes,
      and NO CLOSURE IS RECORDED.
    what_is_missing: >-
      An independent review-breakthrough review at max effort of the proposed
      instrument no-go (D-1) and of its adequacy for GOAL-MONO-001 completion
      criterion (c).
    why_it_is_missing: >-
      This session is coordinator-only and dispatched no reviewer; and per D-8
      the adapter doctor reports every API backend unusable for want of
      credentials, with only `local` OK, so a model-independent
      review-breakthrough cannot be resolved on this harness at all.
    what_is_recorded_instead: >-
      A Coordinator proposal. The no-go is recorded as this decision's content
      and is available for review; it is not adopted as official goal closure.
      NO ATTESTATION, VERDICT OR REVIEW IS RECORDED, BECAUSE NONE WAS OBTAINED.
    what_would_change_it: >-
      One additional genuinely resolvable backend, credentialed, plus a
      dispatched review-breakthrough task at max effort in an independent
      session. That single artifact moves GOAL-MONO-001 to completed under
      criterion (c).

  limitations:
    - >-
      TOY PRIMES 211-1601 ONLY (11 bits) in all supporting empirical work. NO
      extrapolation to 256-bit ECDLP, and no statement about ECDLP hardness in
      either direction.
    - >-
      EV-MONO-a0a89c OBS-1, OBS-2, OBS-3 and OBS-6 are m=3 ONLY. They rest on
      the degree-2 discriminant factorization, which has no analogue at m >= 4.
      Only OBS-4/OBS-5 carry to general m, and they carry by the group law.
    - >-
      THE NO-GO IS INSTRUMENT-SCOPED. It rejects the generic-fibre cycle-type
      census as a relation-rate probe. It is not a no-go for the relation-rate
      question, for KN-OPEN-009 as a whole, or for any other statistic.
    - >-
      THE SUCCESSOR OF D-4 IS AN UNTESTED PROPOSAL and its m=3 collapse check
      (D-5) WAS NOT COMPUTED OR REVIEWED IN THIS SESSION. Neither may be cited
      as a result.
    - >-
      The m=4 verification behind OBS-5 is a single reviewer's computation at
      p=211 on one curve, 193 triples. The general-m statement is derivational
      (the group law) and does not depend on that computation, but the
      computational corroboration is narrow.
    - >-
      AGENTS.md rule 12 is UNSATISFIED. No closure, breakthrough or
      contradiction claim is made or may be read into this record.
    - >-
      No hypothesis status changes. Claim tier stays toy. Nothing here is
      admissible toward the AGENTS.md rule 13 closure quorum.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      DEFERRED, NOT DECLINED, AND THE DEFERRAL IS THE POINT. The right eventual
      curation act is a supersession of KN-OPEN-009 splitting it into its two
      halves - a closed instrument no-go for the generic-fibre cycle-type
      relation-rate probe, and a still-open imprimitivity question at m >= 4.
      THAT MUST NOT BE DONE NOW. Doing it would enter an UNREVIEWED no-go into
      the long-term corpus as settled, at precisely the moment rule 12 is
      unsatisfied (see rule_12_status), and a corpus entry is far harder to
      unwind than a decision record. Promotion is deferred until the rule-12
      review-breakthrough adopts the no-go; at that point the supersession and
      the goal closure should land together. KN-FIND-c41ea9 already carries the
      m=3 derivation from BATCH-003, so no durable result is lost by waiting,
      and KN-OPEN-009 remains accurate as written - it asks the question, and
      the question is still open in the half that matters.

  next_actions:
    - id: N-1
      text: >-
        OBTAIN THE RULE-12 REVIEW, THEN CLOSE. Dispatch an independent
        review-breakthrough task at max effort, undegraded, in its own session,
        against the instrument no-go of D-1 and its sufficiency for
        GOAL-MONO-001 completion criterion (c). The review must attack two
        things specifically: whether OBS-5's complete-splitting statement really
        renders the census statistic constant across curves at every m (and not
        merely at the m=4 case computed), and whether "the instrument is a no-go"
        is what criterion (c) asks for or a substitution for it. On an adopting
        verdict, GOAL-MONO-001 moves to completed under criterion (c) in a
        committed Coordinator decision, together with the KN-OPEN-009
        supersession deferred above. PRECONDITION: per D-8 this requires a
        second credentialed, resolvable backend; without one the task cannot be
        dispatched to standard and must not be faked, degraded, or recorded as
        obtained.
    - id: N-2
      text: >-
        THE DIRECTION-SWAP SUCCESSOR, CHEAPEST CHECK FIRST. Before any harness
        work, settle the D-5 question by hand or by a few lines of CAS: does
        disc_{x2} S_3(x1,x2,T0) = 16 f(x1) f(T0) follow from OBS-1 by the
        symmetry of S_3? If YES, the swapped statistic collapses at m=3 exactly
        as the original did and only m >= 4 remains for that route - report the
        collapse as the result. If NO, the swapped statistic - the count of
        FB-rational points on the fibre of the projection to the T-line at fixed
        T = x(R) - is the live relation-rate instrument and is what a future
        batch should specify and measure. This is a pre-compute falsification
        check under docs/inventor-protocol.md section 8; a failed audit here is
        a useful result and costs almost nothing.
    - id: N-3
      text: >-
        THE FIVE REPAIRS REMAIN A PRECONDITION ON ANY SUCCESSOR HARNESS, carried
        forward unchanged from DEC-20260802-a51c82 N-3: CORR-20260802-1d8384
        OI-1's reverification-disposition rule, 2-torsion generator guard,
        relative tolerances on the two window controls (CTRL-NEG-UNIFORM-WINDOW
        and CTRL-NEG-SHUFFLED-WINDOW, which currently pass for an empty window
        at every pinned prime), FAMILY_RATE_ALERT, and a uniform (A,B) draw. No
        new census of any statistic may be dispatched before these are carried.
    - id: N-4
      text: >-
        A FRESH BUDGET GRANT FROM GOAL-PATH-001 IS REQUIRED BEFORE ANY NEW
        BATCH. GOAL-MONO-001 campaign_budget.maximum_batches is 3 and BATCH-003
        was the third; the budget is exhausted and this decision does not open a
        batch. N-1 and N-2 are both cheap and can be argued for on that basis,
        but neither is authorized by this record. Note the asymmetry when
        requesting: N-1 is a closure step for an already-spent campaign, not new
        research; N-2 is a hand computation.

  admissible_toward_closure_quorum: false
  is_not_a_cryptanalytic_result: true
  changes_no_hypothesis_status: true
