coordinator_decision:
  id: DEC-20260808-3312cc
  context: >-
    Close of BATCH-aa267f, opened from DEC-20260807-41c173's next actions (N6,
    N8) with two approved contracts: EXP-ICINV-4d33aa (a certified full-group
    sampler test designed to attack this campaign's own within-class
    over-dispersion finding to destruction) and EXP-INSTR-85b102 (a blocked
    label-permutation replacement for the between-class null NULL-C). Both
    executed. EXP-ICINV-4d33aa's baseline-reproduction gate then exposed a
    defect in the frozen contract itself; EXP-INSTR-85b102's execution surfaced
    an unexplained non-monotonicity that a chain of independent review,
    Coordinator self-correction, a Coordinator-designed control, and a rule-12
    review-breakthrough review eventually resolved to one narrow, upheld
    finding. This decision was written LATE: it should have closed the batch
    before EXP-ICINV-4d33aa's amendment v2 was drafted, and its absence is
    itself recorded as a defect below rather than backfilled silently.
  decision: refine
  target_ids:
  - GOAL-ENDO-001
  - BATCH-aa267f
  - EXP-ICINV-4d33aa
  - EXP-INSTR-85b102
  - H-ICINV-6c7920
  - H-INSTR-fffbfb
  - RQ-ICINV-475b5e
  - RQ-INSTR-f8faa0
  - EV-INSTR-03fdcf
  - CORR-20260807-911ef7
  - CORR-20260807-732541
  - CORR-20260807-f551a5
  - CORR-20260808-045334
  rationale:
  - >-
    EXP-ICINV-4d33aa TERMINATED INVALID, AND THE CAUSE IS A CONTRACT DEFECT THE
    COORDINATOR INTRODUCED, NOT A MATHEMATICAL RESULT. Stopping rule SR3 fired
    at p = 6007 because the frozen contract required Arm A0 to reproduce a
    committed baseline that was measured at different parameters (T = 500 over
    eleven factor-base sizes, against the contract's own frozen T = 400 over
    thirteen). `terminal_state: INVALID` is `state_0`, first in the evaluation
    order; no OUTCOME state was reached, and `H-ICINV-6c7920` is neither
    supported nor refuted. What survives is the Stage 1 coverage certificate at
    all three primes -- Arm A coverage exactly 1.0 on every r = 1 member and
    exactly 0.5 on every r = 3 member, Arm B exactly 1.0 everywhere -- which
    upgrades `CORR-20260807-d78e2f`'s asserted confound from inferred to
    certified by enumeration, without resolving whether that confound explains
    `EV-ENDO-10109d`'s density-independent over-dispersion.
  - >-
    A PROTOCOL AMENDMENT IS APPROVED BUT NO RE-EXECUTION HAS RUN.
    `experiments/EXP-ICINV-4d33aa/amendments/v2.yaml` repairs the p = 6007
    baseline mismatch (re-measure at the frozen grid before gating), the
    primary-class tie-break ambiguity, the run-count budget, and requires
    reference values to be read from committed records rather than transcribed
    (closing the exact path that produced `CORR-20260807-a24675`'s
    fabrication). It is approved by the user after both independent
    validations reported. IT AUTHORIZES NO RUN: a v2 execution still needs its
    own handoff, and remains gated on change A6 (manifests must pin every
    executed source hash), which N6's fix makes SATISFIABLE but which no v2
    run has yet SATISFIED. This is the campaign's most direct path back to
    adjudicating C2, and it is next_action N10 below.
  - >-
    EXP-INSTR-85b102's OWN QUESTION -- CAN NULL-C BE REPLACED -- WAS NEVER
    ADJUDICATED, DESPITE THE EXPERIMENT COMPLETING S0 THROUGH S6 WITH EVERY
    COMPLETION-GATE ITEM MET. The execution surfaced a non-monotonicity in the
    ladder's ratio verdicts, and every subsequent action in this batch --
    `CORR-20260807-732541`'s refutation of the noise attribution, the
    Coordinator-approved CTRL-VALUESHUFFLE control, its voiding by the rule-12
    review -- chased THAT side question to ground and never returned to
    `H-INSTR-fffbfb`'s replacement question itself. `H-INSTR-fffbfb` remains at
    status `specified`. The per-rung operating characteristics the v1
    execution report actually delivered (S1 gate pass at +2.86e-14; all 11
    frozen functions zero behavioural change; CTRL-NULLOBJ inside its exact
    binomial interval at 28/28 cells; the pre-registered twist-blocking
    contradiction confirmed at 7.20% against a derived ~7%) are sitting
    un-adjudicated in a validated execution report. Recorded here as
    next_action N12 rather than adjudicated now, because adjudicating it
    properly means reading that report as its own question, not as a residue
    of the non-monotonicity investigation this Coordinator got absorbed into.
  - >-
    EXACTLY ONE EVIDENCE RECORD SURVIVES THE WHOLE CHAIN, AND IT SURVIVES A
    REVIEW THAT VOIDED THE WORK COMMISSIONED TO PRODUCE IT. `EV-INSTR-03fdcf`
    (strength `replicated`, direction `refutes`, `claim_tier: toy`) states only
    that the ladder's 74-of-144 non-monotone verdicts are not Monte-Carlo error
    and that reversal is governed by a functional's coupling to the group
    order N (monotone 24/24 for N-coupled functionals, non-monotone 74/120
    otherwise, Fisher exact one-sided 2.6e-09). It carries the rule-12
    reviewer's own permitted sentence VERBATIM rather than a Coordinator
    paraphrase, and its own `unresolved_confounds` block names what it does
    NOT establish: no mechanism beyond N-coupling, and a flagged-not-claimed
    lead (`two_torsion_x` at the resolution floor, R = 0.647 at POOL_C R4).
  - >-
    SIX CORRECTIONS WERE FILED AGAINST THIS BATCH'S OWN WORK, FIVE OF THEM
    AGAINST THE COORDINATOR, AND EACH IS RECORDED RATHER THAN QUIETLY
    ABSORBED. `CORR-20260807-911ef7`: the Coordinator repeated a Validator's
    "dirty in every manifest" count without checking it; the real split is
    13/6, and the honest finding is worse, not better (zero of nineteen runs
    pinned their source, not seventeen). `CORR-20260807-732541`: the version-1
    execution report's Monte-Carlo attribution is refuted, independently
    re-derived by the Coordinator before recording. `CORR-20260807-f551a5`: the
    Coordinator's own CTRL-VALUESHUFFLE reading inverted the effect's true
    direction and rested a third of its magnitude on a circular design choice.
    `CORR-20260808-045334`: the rule-12 review then showed the control was
    VOID outright -- its statistic is invariant under the correctly matched
    conditional null (p = 1.0 under a within-finest-band shuffle), a pure-N
    surrogate with zero arithmetic content reproduces the whole result, and the
    Coordinator's own exclusion threshold sat on a monotonically decaying,
    sign-changing sequence rather than at a principled cut. `decision: refine`
    rather than `support` or `expand` because the batch's net effect was
    sharpening what the instrument measures and repeatedly catching its own
    errors, not advancing any hypothesis toward a positive claim.
  - >-
    N6 IS CLOSED. `harness/runner.py:source_provenance()` now pins every
    executed source file by content hash, derived from `sys.modules` rather
    than a declared list; `write_run()` refuses to write an unpinnable run,
    checked before `os.makedirs` so a refusal cannot leave an empty immutable
    RUN id behind (a defect a Coordinator-written test caught in the first
    pass); `tools/check_run_source_provenance.py` audits the corpus,
    advisory by default so pre-fix runs do not retroactively redden every
    campaign's build. Exercised end to end by the CTRL-VALUESHUFFLE runs
    (`all_pinned` and `all_clean` both true) -- the first runs in this campaign
    to carry that binding.
  - >-
    A PROCEDURAL DEFECT IN THIS DECISION ITSELF, RECORDED RATHER THAN HIDDEN.
    This record is being written after PR #249 already merged BATCH-aa267f's
    work to `main`, and the goal checkpoint for BATCH-523510 -- which HAD a
    committed decision (`DEC-20260807-41c173`) and a written checkpoint file --
    was never reflected in `goal.yaml`'s own `current_batch_id`, `next_action`
    or `dispatch_queue_path` fields, which still named `BATCH-cb71b5` and a
    dispatch queue file that no longer exists on disk. That drift predates
    this decision and was caught only by a `/launch-research-harness`
    research-status scan, not by any Coordinator archive step at the time
    either batch closed. This decision and its accompanying checkpoint and
    goal-record update are the repair.
