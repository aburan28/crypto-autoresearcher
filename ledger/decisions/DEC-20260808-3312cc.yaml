  - CORR-20260808-045334
  - CORR-20260807-a24675
  - CORR-20260807-14431d
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-aa267f/reviews/validator-icinv/validation_report.yaml
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-aa267f/reviews/validator-instr/validation_report.yaml
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-aa267f/reviews/red-team-nonmonotonicity/report.yaml
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-aa267f/reviews/breakthrough/report.yaml
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-aa267f/execution/EXP-ICINV-4d33aa/execution_report.md
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-aa267f/execution/EXP-INSTR-85b102/execution_report.md
  limitations:
  - >-
    Every review in this batch's chain -- both Validators, both Red Team
    dispatches, the rule-12 review -- resolved to the same model on the same
    backend as the Coordinator writing this decision (CLAUDE.md model policy
    note). "Independent" here means independent context and a fresh
    adversarial reading, not independent judgement from a genuinely different
    model. Recorded against every review in this chain, not concealed.
  - >-
    EXP-ICINV-4d33aa's substantive question (does the within-class
    over-dispersion survive a certified full-group sampler, and does it
    stratify by r) remains UNANSWERED. INVALID is not a scoped negative and is
    not evidence; it is an admissibility failure in the measurement's own
    gate. C2 is not adjudicated by this decision.
  - >-
    H-INSTR-fffbfb's replacement question is likewise UNANSWERED by this
    decision, for the reason stated in the rationale: the batch's attention
    went to the non-monotonicity side question and never returned.
  - >-
    This decision was drafted after the branch's PR (#249) already merged, so
    it does not gate what was pushed the way a decision drafted before
    archival would. The repair is corrective, not preventive, for this one
    instance; N9's reduced-scope review pattern is a partial mitigation for
    future batches but does not by itself guarantee a batch-close decision
    gets written before the branch merges.
  - >-
    Toy scale throughout (p in {2003, 4001, 6007, 10007}), `claim_tier: toy`
    on every record this batch produced. `sota_delta` is zero -- no speedup
    against any baseline is produced or claimed anywhere in this batch or by
    this decision, and nothing here bears on isogeny-class structure,
    endomorphism rings, or ECDLP cost.
  next_actions:
  - >-
    N10 (new, highest priority). Dispatch an executor handoff for
    `EXP-ICINV-4d33aa` amendment v2: re-measure the p = 6007 baseline at the
    contract's own frozen T = 400 / thirteen-row grid as a new
    `EXP-ICINV-55c2d8` run BEFORE gating Arm A0 against it, then run the
    stage-3 sweep. Verify `tools/check_run_source_provenance.py --experiment
    EXP-ICINV-4d33aa --strict` passes before admitting the result as evidence
    (amendment v2 change A6). Any resulting evidence record is pre-capped at
    `preliminary` per the amendment's own `confirmatory_status:
    exploratory_only`, regardless of which way the persistence majority falls
    -- fixed before re-execution per the amendment's own post-review notes,
    because the Coordinator drafting it already knows the version-1 chain's
    counterfactual OUTCOME-C would have refuted `H-ICINV-6c7920`.
  - >-
    N7 (carried, still open across three batches). Re-dispatch the
    RQ-CANL-63098f lane, which has had no executed experiment since its
    idea-generator session died on a provider session limit in BATCH-cb71b5.
  - >-
    N12 (new). Adjudicate `H-INSTR-fffbfb`'s actual replacement question from
    the v1 execution report's per-rung operating characteristics (S1 gate,
    frozen-function receipts, CTRL-NULLOBJ/CTRL-SIZE0 calibration, twist-block
    contradiction, D6 stopping-rule disposition), independently of the
    non-monotonicity investigation that consumed this batch's attention. This
    is a re-read of an already-validated report, not a new run.
  - >-
    N11 (new, low priority, explicitly not to be chased without a cheap
    control first). `two_torsion_x` sits at the resolution floor with R =
    0.647 at POOL_C R4 and R = 0.912 at POOL_D R3, surfaced by the rule-12
    review and unrecorded anywhere before `CORR-20260808-045334`. Flagged, not
    claimed: no control has been run against it.
  - >-
    N9 (status change: ADOPTED AS STANDING PRACTICE, not a pending item). The
    reduced-scope, incremental-save review pattern first used to survive
    BATCH-523510's provider session-limit failures has now completed four more
    dispatches in this batch alone (two Validators, two Red Team / breakthrough
    reviews) without one hitting that failure mode. Future review dispatches
    on this campaign should default to it; this is recorded as adopted, not
    reopened as an action.
  - >-
    N6 (status change: CLOSED). See rationale. No further action; retained
    here only so the next reader sees it was carried from `DEC-20260807-41c173`
    and closed here, not silently dropped.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      `EV-INSTR-03fdcf` is `replicated` and `toy`, but it is an instrument
      finding about how one blocked-permutation ladder behaves on one
      contract's declared functional list at two primes -- not yet a
      general technique note. Promoting it now would overstate its reach.
      A `/curate-knowledge` promotion is warranted once N12 adjudicates
      whether the N-coupling finding changes how any future blocked-null
      contract should declare its ladder, which is the form a reusable
      technique note would need to take. The five corrections in this batch
      refine already-recorded practice (source-provenance pinning, control
      invariance checking, transcription-free reference values) rather than
      warranting new entries; N6's fix is process, already reflected in
      `harness/runner.py` itself rather than in a knowledge note about it.
  decided_by: coordinator
  decided_at: '2026-08-08'
  inference:
    requested_policy: coordinator-orchestration-code
