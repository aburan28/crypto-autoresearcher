  rationale:
  - >-
    The five frozen trials produced run records and the runbook session verified after one infrastructure-class stop
    (attempt 1) that was repaired in the launcher binding and not in any trial, threshold, seed or artifact of the
    experiment. Execution is therefore recorded as complete.
  - >-
    The criterion readings are observations of producer-computed values against thresholds frozen before the run. The
    inferential reading, including what a toy-scale null does and does not say about H1, belongs to the independent review
    round (AGENTS.md rules 1 and 10), after a blind recount of S, M and kappa, a re-derivation of classes, reading and
    headline, and a kernel spot-check.
  evidence_refs: []
  limitations:
  - >-
    Toy scale only (generated curves of 20 to 28 bits); nothing about any standardized or deployed curve, any key or
    target, any cost, or the security of any curve. The real-curve prediction stays untested and held.
  - >-
    Per hypothesis interpretation_limits, a null does not exclude label structure for sets that are not log-GAPs,
    translated or truncated-differently boxes, or other labelings, and kappa within 5 percent at p of 20 to 28 bits never
    confirms the asymptotic random-set statement.
  - >-
    The cell b20-r3-n4096 is invalid, so the 45-cell quantifier of the hypothesis as tested is not fully observed. Cells at
    the same bits share their curve sets, so cell statistics and z_cal values are correlated.
  - >-
    check.py is producer-written and does not recompute the bootstrap interval or the replication statistics beyond the
    recorded interval (resolution R8 of DEC-20261022-f1efde); the sha256 values above are those recorded by the supervisor
    in each receipt and were not recomputed by this session.
  knowledge_promotion:
    promoted: []
    not_warranted: Observation of execution and of frozen-criterion readings only; promotion follows independent review of the evidence record.
