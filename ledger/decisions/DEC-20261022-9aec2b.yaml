        ok after 4 degenerate main-census jobs, powered null), so "every one of the 45 cells" is not observed.
    P_detect:
      criterion: '|kappa - 1| >= 0.10 at |z| > 4 in some toy cell, confirmed on fresh curves (outcome O-STRUCT)'
      observation: >-
        not met (not observed): no cell was flagged (flagged_cells []), the largest |kappa - 1| is 0.0414 and the largest
        |z| is 3.13146488900909 (b24-r1-n2048, not above 4, and |kappa - 1| there is about 0.0011), and the replication
        trial census-toy-rep ran zero jobs because flags.json listed no cell.
    P2:
      criterion: 'plant_kappa >= 1.15 and plant_z > 4 in every powered toy cell (planted label AP recovered, plant feasible on every curve)'
      observation: >-
        met on the 44 powered cells: the smallest plant_kappa is 1.2885210809756396 (b20-r2-n4096) and the smallest
        plant_z is 21.926462756813883 (b24-r2-n256); plant_infeasible_cells []. NOT ASSESSABLE for b20-r3-n4096
        (planted_recovered null).
    calibration_gate_C4:
      criterion: 'over powered cells population sd(z_cal) in [0.75, 1.25] and |mean(z_cal)| <= 0.35'
      observation: met (n 44, sd 0.9735699770654103, mean -0.26757013662385903, pass true)
    outcome_rule_O_NULL:
      criterion: 'calibration passes, at least 80 percent of the 45 toy cells valid and every valid cell null'
      observation: >-
        met as tool-computed: calibration pass true; fraction_valid 0.9777777777777777 (44 of 45); 44 cells null, 1
        invalid, none non-null. The tool wrote outcome "O-NULL" and headline "SUPPORT_SCOPED". This decision records
        those strings and does not adopt them.
    outcome_rule_O_STRUCT:
      criterion: 'at least one flagged cell survives replication on fresh curves'
      observation: not met (no flagged cell, no replication job)
    outcome_rule_O_INVALID:
      criterion: 'calibration fails or fewer than 50 percent of the 45 toy cells valid'
      observation: not met (calibration passed; 44 of 45 cells valid)
    falsification_conditions_of_the_hypothesis:
      criterion: 'a toy cell off by at least 10 percent at |z| > 4 that replicates on fresh curves'
      observation: not met (not observed; no flagged cell)
    invalidation_infrastructure:
      criterion: 'a timeout, memory kill, kernel failure or crash is failed_infrastructure; its cells are invalid, never null'
      observation: >-
        failed_infrastructure 0 in both censuses. The 4 degenerate jobs are not infrastructure failures; their cell
        b20-r3-n4096 is invalid, never null, as the contract requires.
    tail_check:
      criterion: 'largest |z| over powered cells compared descriptively with the expected maximum (about 2.4 at 45 cells) and the count of cells with |z| > 3 against about 0.3 percent'
      observation: >-
        reported, not interpreted: largest |z| 3.13146488900909 (b24-r1-n2048); 1 of 44 powered cells has |z| > 3;
        the contract names this comparison as descriptive.
    secondary_and_descriptive:
      criterion: 'slope of log kappa on log2 n, D ratio, null mean against the formula, even-odd kappa, log-GAP geometry, wall time'
      observation: >-
        slopes quoted above; null_mean_anomalies []; D ratio, kappa_even, kappa_odd and null_mean_over_formula per cell are
        in analysis.json and are for the review round. Descriptive, not decisive.
    held_extension_P3:
      criterion: 'verified coincidence on standardized curves (secp256k1, NIST P-256)'
      observation: not assessable (held for the user decision HU-5; no bound artifact contains a standardized-curve constant)
  validity_gate: >-
    Execution validity is the tool-reported state complete with 5 of 5 runs valid, control validity passed, 0
    failed_infrastructure jobs, VERIFY OK on the runbook session, and CHECK OK from the checker of every run. The
    execution-proof count is 0 verified with milestones open. Run count, schema-complete manifests, seed integrity,
    raw/summary agreement and control comparability are re-checked independently at review.
