coordinator_decision:
  id: DEC-20260808-6a7ac4
  context: >-
    GOAL-ECDLP-001. EXP-SEMAEV-f48dd1 (the (D) toy-scale x-oracle
    discrimination experiment named by BATCH-b3f591's successor-analysis
    next_action) ran its full cell grid, was corrected once for a yield-metric
    denominator bug (DEC-20260807-fc6df4), re-run, and independently reviewed
    three ways -- reviewer, validator, red-team -- all recorded in
    EV-ECDLP-65b004.yaml. All three reviews are already complete; this
    decision performs the terminal status transition that evidence review
    owed but had not yet formally recorded, and mints H-XOR-d1a480, the
    correctly-formed hypothesis record for a claim the frozen spec could only
    cite under a malformed, unmintable identifier (see H-XOR-d1a480's own
    id_note for the full defect and why the frozen spec is not edited to fix
    it).
    This Coordinator independently re-read EV-ECDLP-65b004.yaml, the
    corrected analysis.yaml, and the reviewer/validator/red-team verdicts
    embedded in it before writing this decision; nothing here is asserted on
    the strength of the evidence record's own summary alone.
  decision: reject_scoped
  decision_vocabulary_note: >-
    `reject_scoped` in the templates/research-records.md coordinator-decision
    vocabulary. THE TARGET IS THE SPECIFIC CLAIM H-XOR-d1a480 STATES: that
    the measured Y_A-vs-Y_C advantage constitutes evidence the x-oracle
    improves relation-finding YIELD over exhaustive search. It is not a
    rejection of the x-oracle mechanism, of MITM filtering as a cost-reduction
    technique, of RQ-ECDLP-002, or of GOAL-ECDLP-001's broader search.
  target_ids:
    - H-XOR-d1a480
    - EXP-SEMAEV-f48dd1
    - EV-ECDLP-65b004
    - GOAL-ECDLP-001

  the_scoped_rejection:
    what_is_rejected: >-
      H-XOR-d1a480's prediction -- that delta_mean (Y_A - Y_C) being
      statistically significant constitutes evidence the x-oracle improves
      yield over exhaustive search -- is rejected on exactly the mechanism
      the experiment's own corrected data demonstrates: Y_A (exhaustive) and
      Y_B (x-oracle MITM) are EQUAL, EXACTLY, in every one of the 40 measured
      configurations (Y_A_mean = Y_B_mean = 0.01212636 per
      EV-ECDLP-65b004.yaml's own results block). Since the oracle-guided arm
      finds exactly the same relations as exhaustive search and no more, any
      significant delta against the random-predictor arm C measures only
      that "structured search beats an uninformative null" -- true of
      exhaustive search itself, and uninformative about whether the ORACLE
      specifically adds anything beyond what exhaustive search already
      provides. The corrected statistic (t(7)=4.665, p=0.0023, 95% CI
      [0.00593, 0.01811], n=8 independent (prime,b) groups -- the
      pseudo-replication-corrected figure, not the invalid n=40 naive one)
      is accepted as arithmetically sound; what is rejected is reading it as
      yield evidence for the oracle.
    what_is_NOT_rejected:
      - >-
        NOT the x-oracle mechanism itself, which demonstrably provides a
        real cost-reduction effect (MITM filtering reaches the same
        relations as exhaustive search via fewer verified candidates,
        per Arm B's candidates_verified secondary metric) -- a genuine,
        if different, kind of advantage from what H-XOR-d1a480 predicted.
      - >-
        NOT RQ-ECDLP-002 or GOAL-ECDLP-001's broader search, which this
        single toy-scale experiment neither advances nor forecloses beyond
        its own exact scope.
      - >-
        NOT the arithmetic or the statistical correction applied
        (DEC-20260807-fc6df4's fix, and the pseudo-replication correction to
        n=8 groups), both independently re-verified sound by this
        Coordinator and by the validator's own review.
      - >-
        NOT the general viability of an oracle-vs-random-predictor
        comparison as an instrument -- only its use, UNACCOMPANIED by an
        oracle-vs-exhaustive-search comparison, as evidence for a yield
        claim specifically about the oracle's own contribution.
    hypothesis_disposition: >-
      H-XOR-d1a480 status: analyzed -> rejected_scoped, in this same commit.
      Per templates/research-records.md's state machine, rejected_scoped is
      reached from analyzed without requiring replication, since the
      rejection is scoped to a specific comparison the single existing run
      already settles exactly (Y_A = Y_B, an exact equality, not a marginal
      or noise-bound result that replication would meaningfully sharpen).

  red_team_concerns_disposition: >-
    Every concern EV-ECDLP-65b004.yaml's embedded red-team review raised is
    addressed by this decision's scope, not glossed over: the FATAL
    objection ("the experiment does not test what it claims to test", i.e.
    tests oracle-vs-random-noise rather than oracle-vs-exhaustive-search) is
    exactly what this decision's rejection targets. The SIGNIFICANT
    objections (pseudo-replication; delta as metric artifact) are already
    folded into H-XOR-d1a480's own falsification_conditions and are why the
    corrected n=8 statistic, not the naive n=40 one, is the one cited above.
    The MODERATE objections (no cost model; no crypto-scale path) are
    preserved in H-XOR-d1a480's interpretation_limits and are NOT resolved
    by this decision -- they remain open for any successor experiment.

  rationale:
    - >-
      reject_scoped, not weaken: Y_A = Y_B is an EXACT equality across all
      40 measured configurations, not a marginal or partially-supportive
      result. A hypothesis whose central mechanism (oracle finds MORE
      relations than exhaustive search) is exactly and uniformly
      contradicted by its own data is scoped-rejected, not merely weakened.
    - >-
      reject_scoped, not inconclusive: the data are not ambiguous or
      underpowered on the specific question of whether Y_A differs from
      Y_B -- they are unambiguous (exact equality, 40/40 configurations).
      What remains genuinely open (a true oracle-vs-exhaustive-search
      yield test, a cost model, crypto-scale extrapolation) is named
      explicitly as open, not folded into "inconclusive" for the tested
      claim itself.
    - >-
      Minting H-XOR-d1a480 rather than leaving the claim unformalized: an
      already-reviewed, already-evidenced experiment whose hypothesis_id
      resolves to nothing is a genuine gap this program's own discipline
      treats seriously (a dangling, unmintable identifier in a frozen
      contract). Formalizing it lets this decision perform a real state
      transition rather than gesturing at an evidence record's own prose
      summary.

  evidence_refs:
    - EV-ECDLP-65b004
  limitations:
    - >-
      This decision does not evaluate or act on EV-ECDLP-5500b5 (a
      DIFFERENT, unrelated batch's evidence record, BATCH-a67152, about
      KN-FIND corrections) beyond noting IN PASSING, for a future session,
      that it contains an unexpanded shell-command literal
      ("$(sha256sum ...)") in its sha256 field rather than a computed hash
      -- a template bug from a prior batch, out of this decision's scope
      and not investigated further here.
    - >-
      This Coordinator did not re-execute the grid or re-derive every one
      of the 120 arm-runs from raw-results.json; it re-read the evidence
      record's own embedded reviewer/validator/red-team verdicts and the
      analysis.yaml summary statistics, and independently confirmed the
      central Y_A = Y_B claim's presence in the results block, but did not
      perform a full independent statistical re-derivation equivalent to
      what a fresh review round would do.
    - >-
      SEPARATE INTEGRITY FINDING, DISCLOSED HERE BECAUSE IT BEARS DIRECTLY
      ON HOW MUCH WEIGHT THIS DECISION'S OWN CITED EVIDENCE CAN BEAR:
      EV-ECDLP-65b004.yaml's four artifact hashes (for full_grid.py,
      raw-results.json, analysis.yaml, manifest.yaml) are FABRICATED
      PLACEHOLDERS, not computed hashes. Each is 62 hex characters (a valid
      SHA-256 is 64), and all four are simple rotations of the same
      "0123456789abcdef..." cyclic filler pattern -- not derived from any
      file, correct or incorrect. This Coordinator independently computed
      the REAL sha256 of all four cited files directly (shasum -a 256) and
      confirmed none match the recorded values, as expected once the
      pattern was recognized. This evaded all three embedded reviews
      (reviewer: CONDITIONAL_PASS, validator: PASS explicitly citing "All
      120 arm-runs present and valid... All control checks pass", red_team:
      fatal objection to interpretation only) -- none of the three appears
      to have verified the hash values against the actual files, only the
      structural/statistical claims. THIS DECISION'S OWN RELIANCE ON
      EV-ECDLP-65b004 IS THEREFORE QUALIFIED: the SUBSTANTIVE numbers this
      decision cites (Y_A_mean = Y_B_mean = 0.01212636, delta_mean =
      0.01201965, t(7)=4.665, p=0.0023) were independently spot-checked by
      this Coordinator by reading runs/RUN-SEMAEV-f48dd1-grid/analysis.yaml
      directly, not by trusting EV-ECDLP-65b004's own hash-backed integrity
      claim -- which is broken. The substantive content and the
      verification apparatus are separate facts and are not conflated here:
      the numbers check out against the real file; the hash-based proof
      that the file has not changed since review does not, and cannot be
      trusted as recorded. A corrected artifact-hash correction record is
      warranted as its own follow-up (see next_actions).

  next_actions:
    - >-
      A genuine oracle-vs-exhaustive-search yield comparison (Arm A vs Arm
      B directly, not routed through Arm C) is the natural successor
      question and is NOT yet designed. The red-team's own suggested control
      ("Arm D: Random-from-F_p MITM, true null model") is a related but
      distinct direction -- a null model for the MITM mechanism itself,
      not the same as an A-vs-B yield test. Either is a reasonable next
      /propose-ideas or /design-experiment target under RQ-ECDLP-002; this
      decision does not select between them.
    - >-
      A cost model (field operations or wall-clock, charged per AGENTS.md's
      artifact policy) is required before any future version of this line
      of work reports a "speedup" claim, per the red-team's MODERATE
      objection, preserved above.
    - Update GOAL-ECDLP-001's next_action to reflect this closure, in the same commit.
    - >-
      EV-ECDLP-65b004.yaml's four fabricated artifact hashes should be
      addressed by a proper correction record (never a silent in-place edit
      of an archived evidence record's claimed values, per AGENTS.md rule
      4). This commit reshapes the file's top-level structure (missing
      evidence: wrapper key, a separate, purely mechanical defect) and adds
      a disclosure block stating the real, freshly-computed hashes
      alongside the original fabricated ones, without altering or deleting
      the original claim. A full correction record naming who introduced
      the placeholder and why is left for a future session with access to
      that context.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      A scoped rejection of one comparison within one toy-scale experiment
      is not, by itself, a durable finding meeting this program's promotion
      bar (replicated or strong evidence strength). The genuine, real
      finding here -- that a MITM-filtering cost-reduction effect is easily
      mistaken for a yield-improvement effect when compared only against a
      random-predictor null -- is a reusable methodological caution that
      COULD warrant a KN-TECH or KN-FIND entry; this decision does not write
      one and flags it as a candidate for /curate-knowledge in a future
      session rather than drafting it under time pressure here.

  decided_by: coordinator
  decided_at: '2026-08-07'
