  rationale:
    - >-
      RUN-ECDLP-5cad48-S0 already records p2_W_note: P2 is
      known-large G, not known-large W, and near-zero W is
      expected. The S2FIT P2-versus-sha W-ratio gate asking
      for P2 W / sha W >= 10 therefore tests the wrong
      nearby-object quantity. Failing it is not instrument
      failure and is not SMALL-W or LARGE-W.
    - >-
      On the same Stage 0 table, P2 has G=20.012253587339654
      and cs_bound=1.0022365752394244. Comparing G to
      cs_bound is a units mismatch: G is M times max pi,
      cs_bound is the Cauchy-Schwarz bound on max_pi/delta.
      The aligned ratio is G/M_delta = 1.0005973532323276,
      which is at most cs_bound on every Stage 0 arm,
      including P2. This arithmetic is a Coordinator
      composition of archived digits, not a new run and
      not an official bound claim until independent review
      owns that joint.
    - >-
      Three-curve spread of the same W, or any subset fit
      of a, is dominated by first aligning the nearby-object
      control with Stage 0's G-versus-W distinction.
    - >-
      IDEA-20260904-7caed1 is already cited by H-ECDLP-75b566
      / EXP-ECDLP-df601f and was not approved by
      DEC-20260907-88893e. It is not this lane's next act.

  ranking:
    selected: >-
      Quantity-aligned Cauchy-Schwarz audit of archived
      RUN-ECDLP-5cad48-S0 arm table: compare G/M_delta to
      cs_bound on every arm. No new eight-prime ladder.
    dominated:
      - three-curve spread of the same sampled W
      - any proper-subset fit of a
