coordinator_decision:
  id: DEC-20260727-003
  context: >-
    GOAL-SSI-001 BATCH-002 derivation gate for revised IDEA-20260725-001
    (ADMIT_BASELINE_DERIVATION_FOR_BATCH_002). TASK-20260727-601 produced
    derivation_note.md and matched_baseline_recommendation.yaml under verified
    snapshot 65e5bdb8. Independent red-team TASK-20260727-603 (review-adversarial,
    independent_session: true, resolved_model: glm-5p2) returned REVISE with one
    fatal objection (F1: VW parallelization fails with fixed walk function) and
    four nonfatal objections (N1-N4). Evidence EV-SSI-002.
  decision: revise
  target_ids:
    - IDEA-20260725-001
    - GOAL-SSI-001
    - RQ-SSI-001
    - TASK-20260727-601
    - TASK-20260727-603
    - EV-SSI-002
  rationale:
    - >-
      The MITM full-cost exponent p^{2/3} (F_{p^2}) and Delfs-Galbraith
      full-cost exponent p^{1/3} (F_p) are confirmed correct by independent
      review. These are new, decision-relevant, and not in KN-TECH-029.
      They raise the bar for novelty screening: future candidates must beat
      the full-cost baseline, not the easier step-count baseline.
    - >-
      The low-memory van Oorschot-Wiener collision-search analogue on the
      supersingular isogeny graph is well-defined in mechanism (walk model,
      distinguished predicate, collision-to-path reconstruction) with no
      uncharged oracles. However, the parallelization specification has a
      fatal error (F1): with a fixed deterministic walk function, only 2
      useful walks exist (from E_0 and E_1), not P = p^{1/4}. The claimed
      VW full cost p^{1/2} does not hold as specified. The fix (per-processor
      walk-function variation) is known and does not affect the mechanism
      definition, but must be applied before the VW exponents can be promoted.
    - >-
      The F_p mixing conditional is correctly scoped: G_l^{F_p} is not known
      to be Ramanujan; VW on F_p requires unproven mixing; DG at p^{1/3} full
      cost is the correct fallback. This is consistent with AGENTS.md rule 2
      and the target-result-profile's explicit-conditional-rigor requirement.
    - >-
      This is a matched-baseline correction, not a cryptanalytic mechanism
      toward GOAL-SSI-001 completion criteria. It does not claim a sub-p^{1/4}
      break. It does not close KN-OPEN-013, KN-OPEN-014, or KN-OPEN-015.
    - >-
      Independence was achieved: the red-team review ran in a separate session
      (independent_session: true) with a different model lineage than the
      producer. This is a strengthening over BATCH-001 where independence was
      weakened by API-limit fallback.
  evidence_refs:
    - EV-SSI-002
    - coordination/goals/GOAL-SSI-001/batches/BATCH-002/tasks/TASK-20260727-601/derivation_note.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-002/tasks/TASK-20260727-601/matched_baseline_recommendation.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-002/tasks/TASK-20260727-603/review_report.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-002/tasks/TASK-20260727-603/falsification_check.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-002/archives/TASK-20260727-602/snapshot-receipt.json
  limitations:
    - The VW full-cost exponents are conditional on the F1 fix (per-processor walk-function variation).
    - The F_p VW variant is additionally conditional on unproven F_p subgraph mixing.
    - No isogeny or curve computation was performed; this is a derivation only.
    - Clock-cycle reasoning inconsistency (N1) not yet reconciled.
    - Full-cost constants from KN-LIT-094 are asymptotic with unextracted o(1) terms.
  next_actions:
    - >-
      Open BATCH-003: apply the F1 fix (per-processor walk-function variation
      for VW parallelization), reconcile the clock-cycle reasoning (N1), correct
      the YAML phrasing (N2), and specify l as a small fixed prime (N3). Then
      re-derive the VW full-cost exponents and, if confirmed at p^{1/2} (F_{p^2})
      and p^{1/4} (F_p conditional on mixing), promote the full matched-baseline
      recommendation and VW analogue to a KN-TECH entry. Continue screening
      orientation, CSIDH-quantum, and SQIsign-transcript lanes as separate
      candidates. Do not count this lane toward completion criteria unless it
      yields a new attack mechanism.
  hypothesis_status_record:
    IDEA-20260725-001: revise_to_fixed_derivation
    note: >-
      No H-SSI-* hypothesis file created; candidate remains at idea stage
      until BATCH-003 fixes F1 and confirms the VW full-cost exponents.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Partial promotion is warranted in principle (MITM/DG full-cost exponents
      are confirmed correct and new), but the VW side of the ranking is
      incorrect as specified. Promoting the MITM/DG exponents alone without
      the VW context would be misleading: the matched-baseline recommendation
      depends on all three algorithms being correctly costed. BATCH-003 will
      fix F1 and, if the VW exponents are confirmed, promote the complete
      matched-baseline package (MITM/DG/VW full-cost exponents + VW analogue
      definition + matched-baseline recommendation) to a KN-TECH entry or
      KN-TECH-029 update in a single coherent promotion.
  decided_by: coordinator
  decided_at: '2026-07-27'