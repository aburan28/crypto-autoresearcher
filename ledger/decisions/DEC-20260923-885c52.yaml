      assigned to an archive task in the same queue that depends on it, and a
      ledger archive must own an artifact under ledger/decisions/
      (_validate_ledger_archive); the reviewers' archive is
      TASK-20260923-3b12c2, which per C-6 also archives this act and must
      therefore run BEFORE the reviewers, so it cannot also depend on them;
      the post-review decision that would anchor the ledger archive has no
      minted identifier and this act mints none. (2) C-7 asks for
      review_required true on each reviewer task, but _validate_review_chains
      makes review_required true mean "claim-relevant producer requiring an
      independent reviewer successor and a snapshot archive", which reviewer
      tasks do not have; the queue would be rejected. A queue that fails its
      own validator, or that misstates when its archive runs, is worse than
      none. current_batch_id stays null; opening the batch is a next action
      once the post-review archive binding is settled.
