  finding:
    classification: drafting defect in DEC-20261009-ff58fe validator_change.acceptance (and its copies in the 0f4c0a and 70f831 cards)
    mechanism: >-
      tools/validate_ledger.py prints "FAIL: {len(new)} new validation
      error(s):" before listing the error lines (VF-04). Removing any error
      line changes that count, so the literal sentence could never be met by
      a correct change. The intended invariant is about error lines, and the
      observed result meets it exactly.

  clause_V1: >-
    Clause V-1 (DEC-20261009-4f0003). It governs the validator-output
    comparison of TASK-20261009-0f4c0a step (6) and of TASK-20261009-70f831
    step (6). Split each output into three parts:
    - E, the set of lines beginning with "  - " (error lines);
    - S, the summary line or lines beginning with "FAIL:" or "PASS";
    - O, every other line, in order.
    The comparison passes iff all of the following hold:
    (1) E_pre minus E_post is exactly the expected removed set. For 0f4c0a
        that is the one line naming ledger/decisions/DEC-20261008-ef482f.yaml
        and containing "approval capacity:". For 70f831 it is the three
        "run.code.command missing (not reproducible)" lines naming the
        RUN-PFDR-0b3699-tests, -repro and -p0-design run-root manifests.
    (2) E_post minus E_pre is empty.
    (3) S changes only in its error count, and the count drops by exactly
        the size of the removed set. If E_post becomes empty, the summary
        may change to the validator's pass line; record it verbatim.
    (4) O_pre equals O_post.
    Anything else is a STOP. Record E-diff, S-pre, S-post and the O equality
    in the receipt.
    Applied to the 0f4c0a observation:
    - (1) holds: the one ef482f line;
    - (2) holds: none added;
    - (3) holds: 109 to 108;
    - (4) is to be confirmed by the session from pre.txt and post.txt (sha256
      4248a426... and d49855a9...) before step (7).

  clause_V1_git_status_and_records: >-
