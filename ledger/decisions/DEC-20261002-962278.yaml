  rationale:
    - >-
      Keys as written. K-approve needs J3 and J4 to hold and every RV item and
      condition to be discharged. Two joints break and RV-2, RV-3, RV-5 and C7
      are contradicted in part. Approving under any other reading would relax
      a key after reading the reports (CB4-9).
    - >-
      The breaks are cheap to see. The guard defect is a one-line mutation
      (replace L2 by 'always holds'; PC-16c still passes), and the frozen
      rv2_route text claims the opposite. The F5xF4 bound follows from the
      frozen C-4 row that J1 and J5 reproduce exactly. The over-scoped floor
      is contradicted by the contract's own C-8 row and its own line 967. The
      rates are the reviewers' computations, cited by label.
    - >-
      Revise before run. As frozen, the run would be well behaved under the
      null (P(clean) at least 0.9886). But a declared role whose excess decays
      slowly along the ladder could read LEAD with no control able to show
      that L2 let it through, opening a max-tier round and a replication on a
      decay. F5xF4's LEAD and fixed-alphabet HEUR-B2 readings would be empty
      by construction, and a reader of any LEAD or ART-RES would be told the
      wrong floor for skewed roles.
    - >-
      Most of version 4 stands, and the version-3 repairs work. The null
      false-fire table is complete and independently corroborated (overturn
      event 2). SR-6 can no longer fire on degenerate rows. PC-16c no longer
      voids NEG. Roles are named in code. The degeneracy audit is
      blind-confirmed exactly. Every PTM meets its signature. The remedies are
      local and zero-run, which is why the decision is revise and not a return
      to ideation.
    - >-
      Exponent bias kept. S2's LEAD branch is the only exponent-relevant row
      of its round, so the lane continues as LANE-B-V5 at a place recorded with
      its reason and cost (SPC-1). It displaces no item placed with a reason
      before this outcome.

