  revision_requirements:
    note: >-
      Numbered R5-* in this record. R5-1 to R5-5 remedy the breaking artifacts
      and the contradicted discharge clauses; the rest are non-breaking and
      are discharged in the same revision. Every item is an instrument,
      decision-rule, labelling, completeness or procedure defect; none bears
      on any curve, filter or k-list cost (CB4-11). The remedies are the
      reviewers' recommendations; the designer may meet each by any
      equivalent route stated with its reason.
    items:
      - id: R5-1
        breaking: true
        joints: [J3]
        artifacts: [O-1, 'RV-2', 'CODE-GATE DECAY_RHOS and pc16c_decay', 'IR-23(c)', 'rv2_route', 'rule_sweep L2']
        remedy: >-
          Give PC-16c a planted decay at which L1 and L3 hold at all three
          cells, so that only L2 can reject it. The reviewer's candidates are
          rho = 1, 0.8, 0.7 or 1, 0.8, 0.65 at M = 16; re-verify on the
          contract's own ladder at S0. Add a committed design-time MUTATION
          CRITERION: the guard must fail when clause_L2 is replaced by 'always
          holds'. Compute its null false-fail rate in code. Correct the
          IR-23(c), rv2_route, RV-2 discharge and rule_sweep sentences.
      - id: R5-2
        breaking: false
        joints: [J3, J4]
        artifacts: [O-3, 'success_criterion LEAD-reach sentence', 'interpretation_limits']
        remedy: >-
          State LEAD specificity on the curve path at the lead alphabets. Either
          re-scope the LEAD-reach sentence with its measured curve-path rate,
          or add a curve-path decay guard on the ISO lead shapes, or redefine
          L2 on a resolution-invariant quantity. The choice and its reason
          belong to the designer. Carried with R5-1 because the same clause is
          at issue.
      - id: R5-3
        breaking: true
        joints: [J3]
        artifacts: [O-2, 'RV-3 generative', 'C7 for F5xF4', 'heur_b2_held_out fixed-alphabet test']
        remedy: >-
          Record F5xF4's LEAD branch as closed by its own marginal, or remove
          F5xF4 from the LEAD-eligible roles with the reason. Commit a
          best-case-excess (blind-row) criterion, evaluated per declared (cell,
          role, M) at design time on permitted groups or from the carve-out's
          marginals, flagging a row whose best-case stratified excess cannot
          reach L3. Report every flagged row's NEG as uninformative beyond the
          exact component (at least CELL-K13 M 16 and CELL-K19 M 16, and
          CELL-K23 M 32 if the criterion flags it). State that F5xF4's
          fixed-alphabet HEUR-B2 held-out test is undefined (C7).
      - id: R5-4
        breaking: true
        joints: [J4]
        artifacts: [OS-V4-1, 'RV-5 effective-floor sentence', 'definitions.effective_lead_floor_for_exact_free_arms', 'SR-4 sentence', 'DF-12', 'negpath_floor_table.exact_carrying_offsets', 'both records interpretation_limits']
        remedy: >-
          Make the offset arm-specific: offset_F = (q50 - median stratified
          shuffle median of F) / W, effective LEAD floor 3 W + max(0,
          offset_F). Quote 4.40, 3.41 and 2.34 W as the near-uniform XF(1)
          instance, with their realisation spread (J3 O-5), and the C-8
          planted marginal-only label as a skewed instance. Delete DF-12's sign
          claim, the exact-free universal and the exact-carrying 'within 0.16
          W' universal. Report offset_F per role at run time from the recorded
          E_RL and E_Sh (J4 RC-2).
      - id: R5-5
        breaking: true
        joints: [J4]
        artifacts: [OS-V4-2, 'hypothesis title', 'strongest_certifiable_claim (hypothesis and sheet)']
        remedy: Insert 'below l' (or 'of alphabet below l') in the three certificate sentences.
      - id: R5-6
        breaking: false
        joints: [J3, J4]
        artifacts: [OBJ-2, O-4]
        remedy: >-
          State each NEG-path floor as a single-replicate design figure, or
          measure P(L3) at each floor over at least 20 fresh design replicates
          on permitted groups and quote the floor at a stated detection
          probability. Correct the two sentences that describe NEG as 'excess
          below 3 W on enough seeds' and omit L3's rank branch.
      - id: R5-7
        breaking: false
