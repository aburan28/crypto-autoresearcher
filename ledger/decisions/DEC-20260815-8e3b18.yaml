    validator: REVISE
    red_team: REVISE

  rationale:
    - >-
      D2. Archive itemization basis overlooked: FULLY CLOSED, no residual.
      Both reviewers independently re-derived the
      archive_hashing_mount_state_scaling basis, re-summed the 5-row
      itemization to exactly 5563755264, and -- going beyond every prior
      review in this chain -- independently reconstructed the
      x3-multiplier DERIVATION itself from the raw predecessor
      n_c_by_size values, not merely re-summing the already-stated rows;
      both reconstructions land exactly on the stated totals, including
      the disclosed non-adopted additive-delta alternative (7713503488).
      communication_scheduled_bytes is now correctly and consistently
      re-scoped to NOT_ACHIEVABLE_WITHOUT_FABRICATION alone. Red Team's
      full-repository search found no missed or drifted basis in either
      direction.
    - >-
      A, B, C: reconfirmed byte-identical/unweakened relative to
      EXP-SYC-edf98d by both reviewers.
    - >-
      V2's specifically-required remedy: genuinely, completely restored.
      Independent parsed-YAML comparison with per-field SHA-256 hashing
      confirms all five named sub-fields are byte-for-byte identical to
      EXP-SYC-793304, and the restoration is itself honestly described as
      a correction relative to EXP-SYC-edf98d.
    - >-
      V4 (new, supersedes V2's open remainder). A full recursive
      parsed-YAML structural diff of the ENTIRE
      blocker_repairs.HA2-EXPECTATION-NOT-TAIL block against the same
      frozen EXP-SYC-793304 baseline -- a check neither this successor's
      producer, nor the original Validator, nor the original Red Team
      performed exhaustively (they checked five named phrases, not the
      whole block) -- finds twelve further undisclosed content losses of
      the IDENTICAL defect class (silently trimmed supporting prose, no
      ITEM-X-style annotation), all confirmed PRE-EXISTING (already absent
      in EXP-SYC-edf98d, not newly introduced by this successor's own
      authoring). Item 1 (contract_1_worst_case.falsification_condition)
      is an ENTIRE MISSING FIELD, not a trimmed clause. Red Team's
      twelve-item enumeration is a strict superset of the Validator's
      seven-item enumeration and is recorded as authoritative. What IS new
      in this successor: specification.yaml's own preamble comment
      (~lines 519-528) asserts that, once V2's five fields are restored,
      the "carried forward unchanged... nothing else in it is touched"
      language "is literally accurate again" -- both reviewers
      independently confirm this specific claim is FALSE against the same
      EXP-SYC-793304 baseline the original V2 finding used. This is the
      identical failure mode as the original V2 defect (a checkable
      completeness claim a byte comparison falsifies), narrower in surface
      area, but appearing as a FRESH assertion in this successor's own
      committed bytes, not merely repeated verbatim from its predecessor.
      No numeric row, bound, or disposition label anywhere is affected;
      the machine-checked field
      preserved_do_not_weaken.ha2_tail_unavailability_proof is correctly
      scoped ("untouched in LOGIC and CONCLUSION") and is NOT false -- only
      the human-readable prose preamble comment overclaims.
    - RT-OBJ3 and RT-OBJ4 remain open, non-blocking, and deferred, confirmed not narrowed by either reviewer.
    - Archive, communication, and output overages remain exactly 3256009664, 3285369792, and 7132160 bytes; PEAK-AGGREGATE-FIT-UNPROVED remains open with no numeric figure.
    - RT-OBJ2's factual closure fields, the worst-case candidate_index bound [504,1016,2040,4088,8184] against capacity 32, the overflow-invalidation rule, the DERIV-1 bits=27 literal 0.0000304579734802, and the HA-2 tail-unavailability proof's logic and conclusion all recompute unweakened by both reviewers, independently, by every finding this batch.
    - Quarantine of EXP-SYC-24123d, TASK-20260811-5e4a0f, and TASK-20260813-a8dc5e confirmed cited nowhere as evidence or authority by either reviewer.
    - >-
      Secondary, non-blocking (Red Team RT-FBD43E-OBJ3-ITEMS-ABC-MINOR-NOTE):
      items A, B, C each lost their own checkpoint_statement_verbatim /
      approach_chosen / approach_rejected explanatory sub-fields, same
      undisclosed-trim pattern as V4 but on CLOSED items with no stored
      value affected and the text permanently recoverable from BATCH-11dc7b
      and EXP-SYC-edf98d.

  inference_amendment:
    scope: session_provenance_gap_for_review_adversarial_under_this_launch_path
    applies_to_receipts:
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-8c58a3/reviews/TASK-20260815-839dc8/review-report.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-8c58a3/red-team/TASK-20260815-fbd43e/red-team-report.yaml
    fresh_amendment_required_note: >-
      Neither DEC-20260815-23d3bd's nor DEC-20260815-d83212's
      inference_amendment covers this batch's two new receipts by their own
      explicit stated scope (applies_to_receipts is exact-path). Because
      ledger decisions are immutable, neither prior decision's scope can be
      retroactively broadened -- this is a FRESH inference_amendment,
      recorded under identical underlying reasoning, scoped explicitly to
      this batch's two receipts alone. Both reviewers independently
      confirmed this batch's need for a fresh amendment.
    requested_policy: review-adversarial
    committed_binding_target: 'anthropic:claude-opus-5 (max reasoning effort ceiling)'
    actually_served_by: >-
      claude-sonnet-5, requested/observed reasoning_effort xhigh (both
      receipts self-report this via each session's own configured
      system-prompt identifier), one tier below review-adversarial's
      committed max.
    discovered_not_selected: true
    discovered_by:
      - validator TASK-20260815-839dc8 (on itself, via `adapter resolve --role validator --independent-session` plus its own runtime system context)
      - red-team TASK-20260815-fbd43e (on itself, via its own env inspection)
    fallback_allowed_at_dispatch: false
    degraded_allowed_at_dispatch: false
    coordinator_disposition: >-
      ACCEPTED as a disclosed degradation, not a clean review-adversarial
      pass. review-adversarial is not marked degradable:false in AGENTS.md
      (unlike review-breakthrough), and both reviews' substantive technical
      content is independently reproducible, cross-corroborating, and was
      produced under genuine independent sessions at requested/observed
      xhigh effort. Accepting both reviews' substantive findings as valid
      for this batch's checkpoint is therefore proportionate. This does NOT
      constitute, and is not asserted to constitute, a full,
      policy-compliant review-adversarial closure -- it is recorded as an
      accepted, disclosed degradation, explicitly NOT extended to
      review-breakthrough-tier work.
    fallback_used: true
    degraded_allowed: true
    degraded_requirements:
      - >-
        requested review-adversarial (anthropic:claude-opus-5, max
        reasoning-effort ceiling) was not confirmed served for either
        review; both were actually served by claude-sonnet-5 at
        requested/observed xhigh effort.
    non_authorization_statement: >-
      This amendment authorizes NOTHING beyond accepting the two
      already-delivered review-adversarial receipts named above as this
      checkpoint's independent-review basis. It does NOT authorize
      review-breakthrough-tier work under these same launch conditions.
    standing_risk: >-
      Same standing harness-wide condition already disclosed and accepted in
      DEC-20260815-23d3bd and DEC-20260815-d83212 (native Claude Code
      remote/mobile launch, AUTORESEARCH_POLICY/AUTORESEARCH_BACKEND unset,
      not routed through orchestration/adapter's env mechanism), now
      independently reconfirmed a further two times by this batch's
      reviewers, NOT a new anomaly.

  red_team_infrastructure_observation:
    id: RT-FBD43E-SESSION-PROVENANCE-secondary_infrastructure_note
    finding: >-
      Red Team (TASK-20260815-fbd43e) observed that this session's
      CLAUDE_CODE_SESSION_ID / scratchpad directory was identical to the
      value reported by the prior Red Team session in this batch chain, and
      the scratchpad directory on disk already contained leftover files
      from earlier producer, Validator, and Red Team sessions in this same
      orchestrating run. This confirms the session_uuid is the top-level
      orchestrating session's identifier, shared across sibling subagent
      dispatches, NOT a per-dispatch identifier.
    disposition: >-
      Not a finding against EXP-SYC-ff777e or against this batch's review
      independence: Red Team explicitly confirmed it read no sibling
      session's file and re-derived every fact fresh via its own
      `git show`/`git grep`/python3 invocations against the committed
      snapshot, writing only newly-created, uniquely-named scratch files.
      Recorded as a PROCESS OBSERVATION for a future harness revision: it
      should not rely on session_uuid distinctness as a proxy for review
      independence. No correction record is triggered, since no committed
      record anywhere asserted session_uuid distinctness as evidence of
      independence.

