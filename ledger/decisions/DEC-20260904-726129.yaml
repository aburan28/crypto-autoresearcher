coordinator_decision:
  id: DEC-20260904-726129
  context: >-
    Records four maintainer rulings given in session on 2026-09-04, in reply to
    a direct question about which decisions were open on the maintainer. They
    are recorded here because they are governance acts that changed what the
    harness dispatched next, and a ruling that exists only in a chat transcript
    cannot be cited by a later record (AGENTS.md rule 6). This record is the
    citable form; it creates no evidence and approves no experiment.
  decision: revise
  target_ids:
    - EXP-DREG-620b15
    - EXP-WESOVOW-001
    - EXP-ECDLP-a1c262
    - GOAL-SSI-001
    - orchestration/research-priority.yaml
  rationale:
    - >-
      RULING 1 -- EXP-DREG-620b15: REVISE BEFORE APPROVING. The frozen contract
      as written asks for cells this host cannot serve; the maintainer declined
      to approve it as-is and directed that the budget and cell list be resized
      to host capacity first, with the cheap refutation promoted to a gating
      first stage. The contract therefore stays `review_required` with
      `approved_by: null`. Revising a contract is not approving it, and this
      record does not approve it.
    - >-
      RULING 2 -- EXP-WESOVOW-001: RUN RC-1 BEFORE AMENDING THE SPEC. The
      blinded round closed by DEC-20260904-166ab5 established that
      experiments/EXP-WESOVOW-001/specification.yaml:39-40 still carries the
      pre-fix crossover on origin/main -- found independently by both reviewers
      (red team by blind re-derivation, validator by recomputation, gap exactly
      log2 M). The maintainer declined to amend the literal directly and
      directed that the five PAPER_PAIRS literals at cost_model.py:61-65 first
      be verified against inputs/P13-WESOLOWSKI-2026/paper_fulltext.md section
      4.1 with locators. Rationale, as ruled: the defect is a disagreement
      between a committed literal and a paper, so the paper is read before the
      literal is moved. BATCH-dc1424 was opened on GOAL-SSI-001 with RC-1 as
      its gating task.
    - >-
      RULING 3 -- ECC AREA SET: KEEP BOTH PAIR AND AUXIN. The maintainer was
      asked whether the pairing (PAIR) and auxiliary-input (AUXIN) areas belong
      in the ECC set that receives unlimited budget and first selection, since
      both are elliptic-curve areas whose attacks are not themselves generic
      prime-field ECDLP. Ruled: keep both. This CONFIRMS the committed state of
      orchestration/research-priority.yaml rather than changing it; no edit
      follows from this ruling, and it is recorded so a later reader does not
      re-open a question already settled.
    - >-
      RULING 4 -- EXP-ECDLP-a1c262: ROUTE TO AN APPROVAL ROUND FIRST. This is
      the contract DEC-20260904-3bb7fc recommended first if only one of the
      ECDLP tranche were approved. The maintainer declined to approve it off
      that recommendation and directed an independent pre-approval review,
      consistent with that record's own next_action ("APPROVAL IS A SEPARATE
      ROUND AND THE MAINTAINER'S GATE"). A validator was dispatched to write
      coordination/reviews/approval-a1c262-20260904/validation_report.yaml.
    - >-
      COMMON THREAD, STATED SO IT IS NOT LOST: all four rulings move work
      TOWARD verification and AWAY from spending. Three of them decline to
      approve or amend something the harness had prepared, and the fourth
      declines to shrink a scope. None of them lowers an evidence bar, and none
      is a substitute for the review it commissions.
  evidence_refs:
    - ledger/decisions/DEC-20260904-166ab5.yaml
    - ledger/decisions/DEC-20260904-3bb7fc.yaml
    - orchestration/research-priority.yaml
    - experiments/EXP-WESOVOW-001/specification.yaml
    - experiments/EXP-DREG-620b15/specification.yaml
    - experiments/EXP-ECDLP-a1c262/specification.yaml
  limitations:
    - >-
      NO EXPERIMENT IS APPROVED BY THIS RECORD. EXP-DREG-620b15 and
      EXP-ECDLP-a1c262 both remain `review_required` with `approved_by: null`,
      and EXP-WESOVOW-001's specification is unchanged on main. Approval
      remains a separate committed decision.
    - >-
      NO MATHEMATICAL CLAIM IS MADE OR MOVED. These are scheduling and gating
      rulings about which work runs next and in what order. No hypothesis
      status changes, no evidence record is created, no claim tier is asserted.
    - >-
      RULING 3 IS A CONFIRMATION, NOT A CHANGE. PAIR and AUXIN were already in
      the committed ecc_areas list; nothing in the repository differs because
      of it. It is recorded to close the question, not to claim an edit.
    - >-
      THE RULINGS ARE RELAYED, NOT INFERRED. They were given as explicit
      answers to an explicit question in session on 2026-09-04. Where a ruling
      is summarised here in more words than the maintainer used, the expansion
      is this record's reading of it and is marked as such by wording
      ("Rationale, as ruled"), not attributed to the maintainer as their own
      stated reasoning.
    - >-
      THE THREE DISPATCHED FOLLOW-UPS ARE NOT YET COMPLETE at the time this
      record is written. Their outputs -- the revised EXP-DREG-620b15 contract,
      BATCH-dc1424's queue, and the a1c262 validation report -- are separate
      artifacts under their own review, and nothing here anticipates their
      verdicts.
  next_actions:
    - >-
      EXP-DREG-620b15: on return of the revised contract, route it to an
      independent approval review. It does not become approved by having been
      revised.
    - >-
      EXP-WESOVOW-001: RC-1's verification of the five PAPER_PAIRS literals is
      the gating task of BATCH-dc1424. Only its outcome may motivate an
      amendment to the specification's crossover, and the amendment supersedes
      rather than overwrites.
    - >-
      EXP-ECDLP-a1c262: the validator's report is an input to an approval
      decision, not the approval. A separate committed coordinator decision is
      still required before any execution.
    - >-
      Standing under CLAUDE.md rule 11, unchanged by these rulings: open ECC
      ideas remain ranked work (327 at last count via
      `python3 tools/ecc_priority.py --open-ideas`), and ECC goals are selected
      first at every selection point.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is a governance and scheduling record, not an evidence-review
      decision. No run exists, no evidence record is cited in support of a
      claim, and no hypothesis status changes. A KN-FIND requires a support or
      reject_scoped decision on replicated or strong evidence; there is none
      here.
  decided_by: coordinator
  decided_at: '2026-09-04'
