      program holds about it reaches n <= 21, is external, is unreviewed, and
      measures first fall degree rather than d_F4 -- three separate reasons it
      does not transfer. The smallest row in the curve table is n = 97.
    - >-
      THE RULING THAT `replicated` IS NOT CONFERRED IS A GRADING JUDGEMENT, NOT
      A FINDING THAT THE UNDERLYING WORK IS DEFECTIVE. EV-ICPERF-10c5fc may well
      deserve that grade once a reviewer in this program has read its bound
      artifacts. Until then the grade is the producer's.
    - >-
      THE BLOCK ON THE LADDER FINDING RESTS ON AN ABSENCE, AND ABSENCES ARE WEAK
      EVIDENCE. I did not find the instrument in this repository; I cannot show
      it was never here. The review round is scoped to settle that, and a
      Coordinator who resolves it the other way should expect a genuine
      impediment on GOAL-DREG-001 to follow.
    - >-
      THE `experiments/` SWEEP FOR CITATIONS OF THE WITHDRAWN FIGURES IS
      INCOMPLETE. Ripgrep timed out twice on that subtree. The ledger sweep is
      complete and clean; the experiments sweep is a declared gap carried as a
      gate on TASK-20260918-c93f0a.
    - >-
      NONE OF THE RECORDS THIS DECISION WRITES IS COMMITTED AT THE TIME OF
      WRITING, AND THEREFORE NONE OF IT IS OFFICIAL YET. Under AGENTS.md
      "Durable research commits" and agents/coordinator.md Prohibitions, no
      transition above takes effect until TASK-20260918-c93f0a's commit is
      verified. See procedure_deviations PD-1: this session has no shell.
    - >-
      THE REVIEW ROUND OPENED BELOW HAS ONE REVIEWER OWNING FOUR JOINTS. That is
      a deliberate trade and it costs something real: with no sibling reviewers
      there is no convergence to measure, so the round buys coverage and not
      corroboration. It is proportionate to a question that is largely
      definitional, and a red-team pass is named as the successor if J1 returns
      "same object".

  procedure_deviations:
    - id: PD-1
      severity: material
      what: >-
        THIS SESSION HAS NO SHELL. The Bash tool is disabled for this agent and
        for its subagents. Three things the hard constraints require could
        therefore not be done: `python3 tools/allocate_id.py --next <type>
        --check` was not run for any identifier; `python3
        tools/validate_ledger.py` was not run on anything written here; and no
        git command was executed, so nothing is committed.
      what_was_done_instead: >-
        Identifiers were drawn as random 6-hex tokens -- which is the same
        anti-collision property `allocate_id.py` provides, since that tool draws
        without scanning state -- and each was then checked free by Glob over
        `**/*<token>*` across the whole repository, which is the `--check` step
        performed by a different instrument. The four tokens are 4b7e21,
        c93f0a, 7d15e6 and a2f84c; all four returned no match.
      what_was_NOT_done: >-
        No substitute exists for the validator or for the commit, and none was
        improvised. The records are working-tree artifacts until the driving
        session commits them.
      consequence: >-
        Every official transition listed above is PENDING, not effective.
        TASK-20260918-c93f0a carries the validator run and the commit as hard
        completion gates, and carries re-running `allocate_id.py --check` on all
        four tokens before the commit lands.
      why_this_is_not_papered_over: >-
        AGENTS.md assigns the git duties to "the control plane / session that
        drives this role", so the division of labour is contemplated by the
        contract. What is NOT contemplated is a Coordinator reporting
        transitions as official on the strength of files it wrote, and that is
        why the limitation is stated three times in this record rather than
        once.
    - id: PD-2
      severity: disclosed
      what: >-
        Ripgrep timed out (20 s) on three searches: `experiments/` for the
        withdrawn figure names, `coordination/` for `525e13`, and a
        repository-wide search for the figure names.
      consequence: >-
        One sweep is declared incomplete (see limitations). The other two
        questions were answered by narrower Glob and Grep queries that
        succeeded, so no conclusion rests on a timed-out search. A timeout is an
        infrastructure fact and is not evidence about anything (AGENTS.md rule
        3 / core rule 5).

