  limitations:
    - >-
      NOTHING IN THIS DECISION IS A STATEMENT ABOUT THE SECURITY OF ANY CURVE,
      IN EITHER DIRECTION. No Certicom challenge curve and no FIPS binary curve
      is asserted safe or attackable. Every figure discussed carries
      `claim_tier: heuristic_estimate` or `toy`, no curve was instantiated, no
      relation computed, no polynomial system solved, and no certificate
      attaches to any number named here.
