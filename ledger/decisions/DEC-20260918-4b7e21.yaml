# =============================================================================
# DEC-20260918-4b7e21 -- disposition of three artifacts created OUTSIDE the
# approval lifecycle and already merged on main.
#
# WHAT THIS DECISION IS: a ruling on what may and may not rest on
# EXP-SEMBIN-992e73 / RUN-SEMBIN-a7a2f3, on CORR-20260917-02cfe6, and on
# EV-ICPERF-10c5fc / EV-ICPERF-a8080e. It unsticks stranded effort by naming
# exactly what each artifact IS, rather than by promoting any of it.
#
# WHAT IT IS NOT: it approves no experiment, moves no hypothesis status,
# discharges no goal completion criterion, promotes no knowledge entry, and
# records no attestation. One review round is opened and one goal head is
# checkpointed.
#
# THE ONE THING A HURRIED READER SHOULD TAKE AWAY: nothing here becomes
# citable. Two artifacts are admitted as POINTERS with a named ceiling, one
# correction is accepted, and the single highest-value finding on the table
# (EV-ICPERF-a8080e's ladder-mismatch) is BLOCKED FROM PROPAGATING to
# GOAL-DREG-001 because this Coordinator could not verify its attribution and
# has concrete reason to doubt it. See ITEM-3 / J1.
# =============================================================================
coordinator_decision:
  id: DEC-20260918-4b7e21
  recorded_at: '2026-09-18'
  decided_at: '2026-09-18'
  decided_by: coordinator
  archived_by: TASK-20260918-c93f0a
  goal_id: GOAL-SEMBIN-cbf422
  batch_id: null
  batch_id_note: >-
    Null deliberately. This is a portfolio disposition act, not work inside a
    batch. It must NOT be filed under BATCH-9d649f, whose completed-archive
    gate is currently failing (see archive_binding_defect below), and opening a
    fresh batch to hold a single ruling would be ceremony.

  decision: revise
  decision_label: >-
    Refuse retroactive approval of EXP-SEMBIN-992e73 and admit RUN-SEMBIN-a7a2f3
    as a re-derivable derivation and reproduction target, not as evidence.
    Accept CORR-20260917-02cfe6; propagate nothing, because nothing else cites
    the withdrawn figures. Admit EV-ICPERF-10c5fc and EV-ICPERF-a8080e as
    external_unreviewed, refuse their strength grades as this program's, and
    BLOCK the ladder finding from propagating to GOAL-DREG-001 pending one
    review round on its attribution. Both named SEMBIN ideas stay open; neither
    is discharged.

  context: >-
    A prior session in this conversation produced three artifact groups outside
    the approval lifecycle. All are merged on main. All three say plainly, in
    their own text, that they are unapproved and unreviewed; none conceals its
    status, and that candour is why the effort is recoverable at all rather
    than being a contamination event.

    The question this decision answers is not "is the work good" but "what may
    rest on it". Those are different questions, and the failure mode being
    guarded against is the one where a clean-looking record is manufactured
    after the fact so that good numbers can be cited. Permission and evidence
    are separate; a decision that repairs the first in order to obtain the
    second has destroyed the audit trail of both.

