  # ---------------------------------------------------------------------------
  # The archive hash mismatch. Diagnosed, not papered over.
  # ---------------------------------------------------------------------------
  archive_binding_defect:
    task: TASK-20260913-525e13
    goals_reporting_it: [GOAL-SEMBIN-cbf422, GOAL-SEMBIN-5078bc]
    reported_as: >-
      content hash mismatch for tools/run_supersession_registry.yaml, expected
      d5161e3a..., observed 5bab7fc6...
    diagnosis: >-
      NOT CORRUPTION, NOT A SEMBIN DEFECT, AND NOT EVIDENCE ABOUT ANYTHING
      MATHEMATICAL. TASK-20260913-525e13 declared a SHARED, APPEND-ONLY,
      CROSS-CAMPAIGN REGISTRY as a content-bound source artifact of one
      campaign's archive. Every later campaign that appends a supersession entry
      to that file invalidates this receipt. The expected hash was correct when
      the archive was written; the file has moved since, for reasons belonging
      to other areas entirely.
    my_own_finding_on_top_of_that: >-
      The defect is structurally worse than a single stale hash, and I found
      this rather than being told it. The queue's `archive.path_sha256` declares
      d5161e3a... for that path while the task's own snapshot-receipt.json
      declares 4e37db3d... for the same path at the same commit
      (5ef0749162dbceb0369dfec6b006f662f3a54859), with the receipt asserting its
      hashes were recomputed immediately before that commit. TWO BINDINGS, ONE
      PATH, ONE COMMIT, DISAGREEING. The file was already moving beneath the
      archive as it was being written. A binding that was never internally
      consistent cannot be repaired by recomputing it; it can only be replaced
      by a binding of a different KIND.
    one_defect_or_two: >-
      ONE, REPORTED TWICE. Both SEMBIN goals inherit the same stale receipt from
      the same archive task, which is why the expected and observed hashes are
      identical in both reports. Treating it as two defects would double-count a
      single tooling problem.
    does_it_block_anything_i_am_deciding: >-
      NO, and I checked rather than assumed. TASK-20260913-525e13 binds exactly
      two records: CORR-20260913-a99454 and RUN-SEMBIN-1b9afe, both belonging to
      EXP-SEMBIN-354a75. Nothing in ITEM-1, ITEM-2 or ITEM-3 cites either. The
      correction accepted in ITEM-2 concerns RUN-SEMBIN-aa5161 under
      EXP-SEMBIN-81dc96, a different experiment under a different archive.
    what_it_DOES_block: >-
      The BATCH-9d649f dispatch queue's completed-archive gate, and therefore
      any new dispatch routed through that queue. This is why this decision
      carries `batch_id: null` and why the review round opened below is NOT
      filed into BATCH-9d649f. Recorded as a routing constraint, not worked
      around.
    ruling: >-
      WARRANTS A TOOLING TASK. NOT DISPATCHED HERE -- it ranks below the review
      round and dispatching it now would be the make-work AGENTS.md warns
      unlimited ECC budgets invite. Named as ranked-but-not-dispatched below.
      The receipt is NOT edited and the registry is NOT touched: the receipt is
      part of a completed archive and is immutable, and editing either to turn
      the gate green is exactly the papering-over this decision is instructed to
      avoid.
    preferred_fix_when_it_is_dispatched: >-
      BIND THE ENTRY, NOT THE FILE. Of the three candidates -- exclude shared
      registries from source-artifact declarations; bind at a commit; bind only
      the depended-on entry -- the third is preferred and the second is
      rejected. Binding at a commit reintroduces exactly the reachability
      dependence that CLAUDE.md "Archive receipts bind to CONTENT first" exists
      to remove, and which N concurrent worktrees cannot tolerate. Excluding the
      file entirely loses the binding that the registry entry is what makes a
      supersession real. Hashing the canonicalised ENTRY for the record ids the
      receipt depends on is content-first, stable under every other campaign's
      appends, and preserves the guarantee. The registry is AUTHORED state and
      must stay committed; it is not a generated artifact and gitignoring it
      would be wrong.

