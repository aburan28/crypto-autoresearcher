  # ---------------------------------------------------------------------------
  # ITEM 1
  # ---------------------------------------------------------------------------
  item_rulings:
    - item: ITEM-1
      subject: EXP-SEMBIN-992e73 / RUN-SEMBIN-a7a2f3
      goal: GOAL-SEMBIN-cbf422
      verb: refuse_retroactive_approval_and_open_a_replication_successor
      option_chosen: >-
        (c). Neither (a) nor (b) as offered. (a) is refused on the merits below;
        (b) is right in direction but stops short of naming the ceiling, which
        is the only part that prevents a later reader from citing the run.

      ruling:
        - >-
          EXP-SEMBIN-992e73 STAYS `specified` AND IS NEVER APPROVED. It is
          recorded `approval_closed: true` -- retired in place, not as a defect
          in its design but as a consequence of its execution order. No future
          Coordinator may approve it. A contract whose preregistered predictions
          have been read against their own outcomes by the approving authority
          cannot be approved without the approval asserting something false.
        - >-
          RUN-SEMBIN-a7a2f3 IS ADMITTED TO THE ARCHIVE with disposition
          `unapproved_re_derivable_derivation`. It is a REPRODUCTION TARGET and
          a DESIGN ARTIFACT. It is not evidence and does not become evidence.
        - >-
          BINDING CEILING, stated so it cannot be read narrowly: no `EV-*`
          record may cite RUN-SEMBIN-a7a2f3; no hypothesis status may move on
          it; no goal completion criterion may be discharged by it; no `KN-*`
          entry may be promoted from it; and no cost figure in
          experiments/EXP-SEMBIN-992e73/RESULTS.md may be quoted in any record
          of this program as a result. RESULTS.md is an INTERNAL WORKING NOTE
          from this decision forward.
        - >-
          THE ROUTE TO CITABILITY is a successor contract under a fresh
          identifier, approved BEFORE execution under the standing user
          authorization, which (i) carries NO preregistered predictions, because
          P1/P2/P3 are spent and re-registering them would be a fabrication;
          (ii) declares its success criterion as byte-identical reproduction of
          experiments/EXP-SEMBIN-992e73/runs/RUN-SEMBIN-a7a2f3/raw-result.json;
          (iii) executes in a session independent of the one that produced the
          original; and (iv) is reviewed independently before any evidence
          record is written. That successor is GOAL-SEMBIN-cbf422's new
          next_action. It is NOT this engagement's ranked next action and is not
          dispatched here.

      why_not_option_a: >-
        THIS IS THE LOAD-BEARING REFUSAL AND IT IS NOT A TECHNICALITY.
        Approving the contract now and re-running it would cost 0.11 s and
        produce, by the contract's own determinism and seedlessness, a
        BYTE-IDENTICAL artifact. So the re-run buys exactly zero information
        about the mathematics. What it WOULD buy is the appearance of lifecycle
        compliance: a run record sitting under an `approved` contract with three
        `preregistered_predictions` all marked confirmed, whose approving
        authority had already read that they were confirmed. Downstream, that
        record is indistinguishable from an honest preregistration, and it
        asserts a provenance it does not have. That is laundering, and it is
        strictly worse than the candid unapproved record we currently hold --
        which at least tells every reader the truth. The prohibition on changing
        success criteria after observing outcomes (agents/coordinator.md,
        Prohibitions) is the same principle one step removed: here the criteria
        would be unchanged but the PREREGISTRATION would be manufactured.
      why_not_option_b_as_offered: >-
        "Accept the existing run under an explicit disposition" is the right
        instinct and is most of what is ruled above. What it omits is the
        ceiling. An artifact accepted without a named ceiling is cited: six
        months from now the per-curve margin table is the most quotable object
        in this campaign, and "it was accepted" will be read as "it may be
        used". The ruling above therefore spends its words on the prohibition
        rather than on the acceptance.

      what_is_genuinely_unstranded_by_this: >-
        Most of the effort, and this is the point of ruling rather than
        discarding. (1) The CONTRACT'S DESIGN survives intact and may be reused
        verbatim by the successor -- the procedure, the three conventions, the
        frozen-source provenance discipline that caught the ECCp-359 recall
        error, and the controls C-REPRO, C-FLOOR and C-CAP. (2) The RUN becomes
        the successor's success criterion, which is a genuinely stronger
        position than a fresh run would occupy: the replication's target is
        fixed by an artifact that already exists and is hash-bound, so the
        replication cannot be tuned toward its answer. (3) The C-FLOOR finding
        is already banked as ITEM-2 and is unaffected by any of this. The only
        thing actually lost is the ability to cite the table today.

      scope_acknowledged: >-
        Restating the contract's own scope block because it bounds everything
        above: `claim_tier: heuristic_estimate`, no curve instantiated, no
        security statement about any curve in either direction, and Assumption 1
        (d_F4 <= 4) inherited wholesale and verified NOWHERE NEAR any n in the
        table. The smallest row is n = 97; the largest cell any instrument in
        this program's reach has ever checked is n = 21, and that check is
        itself external and unreviewed (ITEM-3). Every row is conditional on an
        assumption verified more than four times below where it is used. Even
        after a successful replication, that condition travels with every cell.

    # -------------------------------------------------------------------------
    # ITEM 2
    # -------------------------------------------------------------------------
    - item: ITEM-2
      subject: CORR-20260917-02cfe6
      goal: GOAL-SEMBIN-cbf422
      verb: accept_correction

      ruling:
        - >-
          CORR-20260917-02cfe6 IS ACCEPTED. `crossover_cofactor_absorbed = 250`
          and the derived `shift_upward_from_charging = 52` are WITHDRAWN from
          RUN-SEMBIN-aa5161. The immutable run is not edited and must never be.
        - >-
          THE CHARGED CROSSOVER OF 302 STANDS and is unaffected. It is
          floor-independent, returning 302 from both n_lo = 20 and n_lo = 250,
          which is what distinguishes it from the withdrawn figure.
        - >-
          NO PROPAGATION IS OWED ANYWHERE. Verified above: DEC-20260913-74e208
          does not lean on either withdrawn figure, and a ledger-wide grep finds
          the field names only inside the correction itself. GOAL-SEMBIN-cbf422's
          head needs no withdrawal notice for these figures, and no other record
          does. The `experiments/` sweep is declared incomplete (grep timeout),
          so the archival task carries completing it as a gate.
        - >-
          THE CORRECTION IS ACCEPTED DESPITE RESTING ON AN UNAPPROVED RUN, and
          the asymmetry is deliberate rather than an oversight. A correction
          that WITHDRAWS a figure is not subject to the ITEM-1 ceiling, because
          the ceiling exists to stop unapproved work from ADDING to what this
          program asserts. Withdrawal subtracts. The evidential burden runs the
          other way: the defect is a two-line property of the frozen code
          (`charge_cofactor=False` sets `solve = 0.0` outright, so stage-1 cost
          is below 2^{n/2} throughout and `crossover()` returns its own n_lo),
          it is checkable by reading `joint_balance.py` without running
          anything, and it was demonstrated at three floors returning 20, 100
          and 250. Refusing a withdrawal on provenance grounds would leave a
          figure standing that this program now knows to be an artifact. That
          would be the real error.

      goal_criterion_consequence:
        criterion: >-
          GOAL-SEMBIN-cbf422 completion criterion 4: "the two-stage balance
          recomputed with the n^{4 omega} cofactor charged rather than absorbed,
          at n = 233, 283, 409, 571, alongside the paper's own absorbed form,
          with the divergence between them stated in bits."
        finding: >-
          THE CRITERION IS PARTLY MALFORMED AS WRITTEN, and this is a real
          research result rather than bookkeeping. It presumes the absorbed form
          is a COMPARATOR -- something with a crossover that the charged form
          shifts. It is not. As implemented it prices the entire solving stage
          at zero, which makes it a LOWER BOUND ON THE MODEL, not a reading of
          it. "The divergence between them stated in bits" is therefore
          well-defined as a per-n cost difference and NOT well-defined as a
          crossover shift, which is exactly the quantity the withdrawn +52
          reported.
        action_taken: >-
          RECORDED ON THE GOAL HEAD, NOT EDITED INTO THE CRITERION. Rewriting a
          completion criterion after seeing the result that embarrasses it is
          prohibited without a versioned protocol_amendment, and no amendment is
          authored here because the criterion is still satisfiable in its
          well-defined reading. A future decision discharging criterion 4 must
          report the per-n cost difference and must state, in terms, that no
          crossover shift exists to report.

      tooling_ruling:
        defect: >-
          `crossover()` returns the first n in its sweep meeting margin < 0 and
          has no way to signal that the condition ALREADY HELD at the first n
          examined. Any caller whose floor sits above the true crossover
          receives a plausible integer with no indication that it is a floor.
          The figure is uncatchable by inspection of the output alone.
        is_it_worth_a_tooling_action: >-
          YES, and the proposed `crossover_n_at_search_floor` flag is the right
          shape. But it MUST NOT BE APPLIED AS AN EDIT, and this is the part the
          proposal as stated would get wrong.
          experiments/EXP-SEMBIN-81dc96/code/joint_balance.py is a FROZEN
          instrument: it is the bound artifact of RUN-SEMBIN-aa5161 and it is
          the object RUN-SEMBIN-a7a2f3's C-REPRO gate reproduced five cells
          against. Editing it would invalidate both bindings and would destroy
          the one property that made the search-floor probe a finding about the
          frozen instrument rather than about a copy.
        ruling: >-
          TWO PARTS, and the first is free and binds immediately.
          (1) STANDING CONTROL REQUIREMENT, effective from this decision: any
          contract in this program that consumes a crossover-search routine
          MUST carry a search-floor probe as a declared control -- the returned
          crossover computed at no fewer than two materially separated lower
          bounds, reported per bound, with a return that tracks its bound
          recorded as NO CROSSOVER IN RANGE rather than as a crossover. This
          costs nothing, cannot break a frozen archive, generalises beyond
          `joint_balance.py`, and is precisely the control whose presence in
          EXP-SEMBIN-992e73 and absence in EXP-SEMBIN-81dc96 is the whole
          difference between catching this and shipping it.
          (2) THE FLAG IS CARRIED FORWARD as a required feature of the NEXT
          crossover implementation written fresh in this program, never as a
          patch to the frozen file. Recorded here so it is not lost; not
          dispatched, because (1) already closes the exposure.

    # -------------------------------------------------------------------------
    # ITEM 3
    # -------------------------------------------------------------------------
    - item: ITEM-3
      subject: EV-ICPERF-10c5fc and EV-ICPERF-a8080e
      goals: [GOAL-ICPERF-e6b6a4, GOAL-DREG-001]
      verb: admit_as_external_unreviewed_and_block_propagation

      ruling_on_status:
        - >-
          BOTH RECORDS STAND AS FILED. They are immutable and are not edited.
          Their disposition is `external_unreviewed`: records of work performed
          in github.com/aburan28/crypto, bound by sha256 per artifact, under
          external contract records (EXP-ICPERF-779f11, EXP-ICPERF-5fd141) that
          stand in for contracts this program never authored or approved, and
          read by no reviewer in this program. All four records say so; none is
          concealing anything.
        - >-
          THEIR `strength` GRADES ARE NOT CONFERRED BY THIS PROGRAM. This is the
          operative ruling and it has teeth. EV-ICPERF-10c5fc carries
          `strength: replicated`. Under the knowledge-promotion gate in
          agents/coordinator.md, `replicated` is precisely the threshold at
          which a `support` or `reject_scoped` decision MUST promote a KN-FIND.
          An unreviewed external record carrying `replicated` is therefore a
          promotion trigger sitting armed in the ledger. I rule that neither
          record's strength is this program's grade, and specifically that
          EV-ICPERF-10c5fc's `replicated` DOES NOT satisfy the
          `replicated`/`strong` precondition of that gate.
        - >-
          CONSEQUENCES, binding: no `KN-*` entry may be promoted from either
          record; neither may support a hypothesis status change; neither may
          discharge a completion criterion of GOAL-ICPERF-e6b6a4 or
          GOAL-DREG-001 -- which both records already state for themselves in
          their `completion_criteria_impact` blocks, and which is restated here
          so it is the Coordinator's ruling and not only the producer's
          self-assessment. `direction: weakens` stands as the PRODUCER'S
          reading, scoped to the boundaries each record declares.

      ruling_on_the_ladder_finding:
        claim_at_issue: >-
          EV-ICPERF-a8080e's load-bearing and portfolio-relevant finding:
          "GOAL-DREG-001's subspace ladder measures the wrong object family",
          on the ground that `koblitz_bench::subspace_ladder` uses
          Frobenius-invariant subspaces of dimension ord_n(2) while Semaev's
          Assumption 1 names arbitrary subspaces of dimension ceil(n/m), the two
          coinciding in 0 of 23 cells at m = 2 across n = 5..49 odd.
        ruling: >-
          PROPAGATION IS BLOCKED. NO impediment, NO correction, and NO
          next_action is filed against GOAL-DREG-001 on this record. The goal is
          untouched by this decision and stays `active` with its existing head.
        basis:
          - >-
            THE ATTRIBUTION IS UNVERIFIED AND I HAVE CONCRETE REASON TO DOUBT
            IT. `koblitz_bench` appears nowhere in this repository. There are no
            Rust source files in this repository at all. The strings
            `subspace_ladder`, `koblitz_bench` and `invariant_subspace_basis`
            match exactly one file under `ledger/`, and that file is
            EV-ICPERF-a8080e itself. The record calls the instrument "this
            program's" and names it "GOAL-DREG-001's existing subspace ladder";
            on the evidence available to me it is an instrument of the EXTERNAL
            repository, and the attribution to GOAL-DREG-001 is an inference the
            record does not show its work for.
          - >-
            THE ARITY DOES NOT LINE UP. The ladder finding is entirely at m = 2
            -- "0 of 23 cells at m = 2", "only twice at m = 3". GOAL-DREG-001's
            object is the boolean chained Semaev system at m = 3, t = 3. The
            record's OWN `boundaries` block concedes that "m = 2 results carry
            that structure and are not a generic m statement." A count taken at
            m = 2 is being read as a verdict on an m = 3 campaign's measurement
            base, and the record itself supplies the reason that reading is
            unsafe.
          - >-
            THE COST OF BEING WRONG IS ASYMMETRIC, WHICH IS WHY THIS IS BLOCKED
            RATHER THAN HEDGED. Filing an impediment or a correction against
            GOAL-DREG-001 on this record would read downstream as "a portion of
            GOAL-DREG-001's accumulated degree measurements is void". That is
            among the most consequential things that could be said about an
            active ECC campaign, it would be said on an unverified external
            attribution at a different arity, and unsaying it later costs far
            more than checking it now costs. Checking it costs one review round
            and no compute.
        what_this_block_is_not: >-
          IT IS NOT A JUDGEMENT THAT THE FINDING IS WRONG, and it must not be
          read as one. The definitional core -- that ord_n(2) and ceil(n/2) are
          different functions of n that rarely coincide -- is arithmetic and I
          expect it to hold exactly as stated (recorded as a prior in the review
          plan). What is unestablished is the BRIDGE from that arithmetic to a
          statement about GOAL-DREG-001. If the review establishes the bridge,
          this is a significant negative finding about this program's own
          measurement base and will be filed as such, with an impediment on the
          still-active goal per CLAUDE.md rule 10. Blocking propagation for the
          length of one review is the opposite of suppressing it.

      ruling_on_review:
        does_either_warrant_a_round: >-
          YES, ONE ROUND, ON EV-ICPERF-a8080e ONLY, and narrowly scoped. Opened
          as TASK-20260918-7d15e6 with the review plan on that card.
        why_a8080e_and_not_10c5fc: >-
          RANKED, not omitted. EV-ICPERF-10c5fc's conclusions are self-limiting
          in a way a8080e's are not: it reports that a decomposition-oracle
          family is bounded below by its own arity arithmetic, it discharges no
          criterion, it moves nothing, and its consequence if true is that a
          lane stays closed -- the status quo. EV-ICPERF-a8080e carries a claim
          that would INVALIDATE EXISTING WORK on a different active ECC goal.
          That asymmetry decides the ranking. A round on 10c5fc's strength grade
          is named below as ranked-but-not-dispatched.
        independence_note: >-
          The artifacts are external and the reviewer cannot be given a run
          record of this program to check. That is a genuine limit and it is why
          the round's joints are chosen to be answerable WITHOUT the external
          repository: the attribution question is answerable from this
          repository alone, and the definitional count is answerable from
          arithmetic alone. A round that depended on reading
          github.com/aburan28/crypto would be unservable and would be recorded
          as an impediment rather than staffed.

      ruling_on_the_corpus:
        discovered_after_the_ruling_above_was_drafted: >-
          YES, AND THE SEQUENCE MATTERS. The block on the ladder finding was
          drafted on the assumption that the claim lived in the ledger, where
          readers are careful and records carry their own caveats. It does not
          only live there. `knowledge/findings/KN-FIND-9cba50.md` was promoted
          from EV-ICPERF-a8080e on 2026-09-17 and carries the disputed
          attribution IN ITS TITLE -- "GOAL-DREG-001's subspace ladder measures
          a different object family...". The corpus is what the retrieval index
          serves. A future agent asking about Assumption 1 would be handed that
          sentence as a CURATED INTERNAL FINDING of this program.
        why_this_is_the_more_serious_half_of_ITEM_3: >-
          A block that stops at the ledger does not reach the readers it was
          written for. The evidence record states its own limits in six places;
          a corpus title states a conclusion. The propagation I refused to
          perform had already been performed through a channel my refusal did
          not cover, and I would not have found it had the count of files citing
          `subspace_ladder` not been put in front of me.
        ruling: >-
          KN-FIND-9cba50 IS QUARANTINED by CORR-20260918-3e91d7 pending
          TASK-20260918-7d15e6. Not edited, not deleted, `superseded_by` left
          null -- a quarantine is provisional and supersession is not. It may
          not be cited for any claim about GOAL-DREG-001, its instruments, or
          the admissibility of its measurements. It MAY still be cited for what
          it measured on the family it names, with its own caveats attached.
          KN-FIND-aa2efc is NOT quarantined -- its headline claims nothing about
          this program's own instruments or goals -- but it may not be cited as
          a replicated finding of this program, since the grade it inherits is
          ruled unconferred above. Its grade goes to J4.
        the_process_finding: >-
          BOTH entries were promoted from evidence records carrying
          `review_refs: []` whose own text says no reviewer in this program has
          read the artifacts. EV-ICPERF-a8080e is `strength: preliminary`, which
          does not reach the promotion gate at all; EV-ICPERF-10c5fc's
          `replicated` is ruled unconferred here. Neither promotion should have
          occurred on the gate as written. Recorded as a process finding about
          two entries, not as an accusation about their contents -- and it is
          the concrete reason the "armed trigger" argument in the rationale is
          not hypothetical. The trigger had already fired, twice, before this
          decision was drafted.
        what_did_not_move_it: >-
          The entry's author volunteered by inter-agent message that the
          attribution was its error. THAT IS NOT WHY THIS IS QUARANTINED. A
          message is not evidence and cannot carry a correction any more than it
          could carry an approval. CORR-20260918-3e91d7 rests on three facts
          read from committed artifacts -- GOAL-DREG-001's m = 3 arity, its
          declared admissibility rule excluding first fall degree, and the
          instrument's absence from this repository -- and says so in terms.

  # ---------------------------------------------------------------------------
  # The two open ECC ideas. Neither is closed, and the ranking says why.
  # ---------------------------------------------------------------------------
  open_idea_rulings:
    - idea: IDEA-20260913-449d2b
      title_short: >-
        Four quantities, one name -- separate d_F4 from first fall degree, from
        the degree-4 solving predicate, and from the Macaulay-rank statistic
      status_now: proposed (unchanged)
      ruling: STILL OPEN. NOT discharged, NOT rescoped, NOT closed.
      reasoning: >-
        EV-ICPERF-a8080e bears on it directly and RAISES its priority rather
        than discharging it. The record measures first fall degree and a
        degree-4 refutation predicate, states in three separate places that
        NEITHER IS SEMAEV'S d_F4, and routes the gap to this program's own
        KN-OPEN-d218ec. That is the idea's premise being independently
        corroborated as live, not its question being answered. The idea asks for
        a SEPARATION of four quantities; the record demonstrates that conflating
        them is an active hazard and separates none of them. Two further
        reasons it cannot be even partly discharged: an `external_unreviewed`
        record discharges nothing by construction under the ruling above, and
        the record's reach is n <= 63 for first fall and n <= 21 for the
        predicate, which is not a range in which the four quantities can be
        told apart where it matters.
    - idea: IDEA-20260913-9c54f9
      title_short: >-
        The diagonal k = ceil(n/m) is not load-bearing: recharge Table 3 with
        integer k
      status_now: proposed (unchanged)
      ruling: STILL OPEN. NOT discharged, NOT rescoped, NOT closed.
      reasoning: >-
        EXP-SEMBIN-992e73 touches the same knob and does not turn it. Its run
        parameters record `k_reading: unceiled` -- it evaluated the UNCEILED
        diagonal, which is the reading the idea proposes to replace, not the
        integer-k recharge the idea asks for. So the overlap is in the object,
        not in the question. And even had it computed the integer-k column, the
        ITEM-1 ceiling forbids any completion criterion or idea being discharged
        by that run. Priority RAISED, for a reason that comes from ITEM-3 rather
        than from ITEM-1: EV-ICPERF-a8080e's entire ladder argument turns on
        ceil(n/m) being the dimension Assumption 1 actually names. If that is
        right, the integer-k question stops being a cosmetic convention choice
        and becomes the question of whether Table 3 is charged at the dimension
        the assumption quantifies over.
  open_idea_rulings_note: >-
    Scoped to BOTH ideas, which is why it sits here as a sibling of
    `open_idea_rulings` rather than inside either list item. Recorded explicitly
    because the instruction to say so is itself a guard: NEITHER IDEA IS CLOSED
    AND NEITHER IS QUIETLY DOWNGRADED. Both remain open ECC ideas and therefore
    ranked design work under AGENTS.md "ECC comes first" instruction 3. Neither
    is dispatched in this engagement, because both rank below the review round
