  rationale:
    - >-
      PERMISSION AND EVIDENCE ARE DIFFERENT OBJECTS AND THE WHOLE DECISION TURNS
      ON KEEPING THEM APART. An approval says work was authorised. A run record
      says what a computation produced. Retroactive approval attempts to buy the
      second with the first, and it cannot: approving EXP-SEMBIN-992e73 today
      would not make RUN-SEMBIN-a7a2f3 any more or less correct, and the
      arithmetic is in fact almost certainly correct. What retroactive approval
      WOULD do is make the record look preregistered when it was not. So the
      ruling gives the run everything its determinism actually earns -- archival
      admission, reproduction-target status, reuse of its design -- and refuses
      the one thing that would require a false statement.
    - >-
      DETERMINISM IS WHY THIS IS RECOVERABLE AT ALL, AND ALSO WHY THE RE-RUN
      BUYS NOTHING. A seedless standard-library derivation that loads a frozen
      instrument and passes a five-cell reproduction gate before computing
      anything new is about as re-checkable as an artifact in this program gets.
      Anyone can reproduce it in 0.11 s. That is exactly the property that makes
      "accept as a reproduction target" a real disposition rather than a
      euphemism -- and exactly the property that makes a fresh run under a
      post-hoc approval a byte-identical file whose only new content is a
      provenance claim.
    - >-
      A WITHDRAWAL IS NOT SUBJECT TO THE SAME GATE AS AN ASSERTION. The ITEM-1
      ceiling and the ITEM-2 acceptance look inconsistent until the direction is
      noticed: the ceiling stops unapproved work from adding to what the program
      claims, while CORR-20260917-02cfe6 subtracts. A programme that refused
      withdrawals on provenance grounds would preserve known artifacts in its
      record in the name of process, which inverts the purpose of the process.
      The defect is additionally checkable by reading the frozen code without
      running it, which is the strongest refutation basis this result admits.
    - >-
      THE LADDER FINDING IS BLOCKED BECAUSE THE CHECK WAS CHEAP AND CAME BACK
      NEGATIVE. This is not caution in the abstract. I looked for
      `koblitz_bench` and found no Rust file of any kind in this repository, and
      found the instrument named in exactly one place -- the record making the
      claim. The finding's cells are at m = 2; GOAL-DREG-001's object is m = 3;
      the record's own boundaries concede m = 2 is not a generic m statement.
      Two independent reasons to doubt a bridge that would, if accepted, void
      part of an active ECC campaign's measurement base. Under AGENTS.md
      "Research-direction integrity", steering a campaign on an unverified
      attribution is as much a failure as suppressing a lead; the response to
      both is the same, which is to check.
    - >-
      AN UNREVIEWED EXTERNAL RECORD CARRYING `replicated` IS AN ARMED TRIGGER,
      NOT A DORMANT FIELD. The knowledge-promotion gate keys on exactly that
      value. Left alone, the first `support` or `reject_scoped` decision that
      cites EV-ICPERF-10c5fc would be obliged to promote a KN-FIND resting on
      artifacts no reviewer in this program has opened, and the obligation would
      look like compliance. Ruling the grade unconferred defuses it without
      editing an immutable record and without asserting that the underlying work
      is wrong.
    - >-
      RANKING, STATED BECAUSE UNLIMITED ECC BUDGET IS THE STRONGEST INVITATION
      TO MAKE-WORK THIS PROGRAM HAS. Four candidate actions were available: the
      curve-table replication, the ladder-attribution review, the registry
      tooling repair, and design work on the two open ideas. Exactly one is
      dispatched. The review wins because it is the only one whose outcome
      changes what other work is worth doing: if the ladder finding bridges to
      GOAL-DREG-001, a portion of that campaign's measurement base needs redoing
      and the DREG frontier is re-ranked; if it does not, GOAL-DREG-001 is
      undisturbed and EV-ICPERF-a8080e narrows to an external result about an
      external instrument. Every other candidate refines something whose
      direction is already settled. It also costs no compute and needs no
      Groebner engine, so it does not contend with IMP-SEMBIN-ENGINE or any
      measurement lane.
    - >-
      FOCUS DISCIPLINE IS RESPECTED WITH ROOM TO SPARE. One review round is
      opened. No scientific trial is launched by this decision, no batch is
      opened, and the three named-but-not-dispatched items are recorded in rank
      order so that the next session reranks rather than rediscovers.

