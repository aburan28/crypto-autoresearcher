  context: >-
    /design-experiment plus /propose-ideas, one cycle. IDEA-20261006-2abea4
    is on origin/design/hyper-79cb0a-prym and is not on origin/main.
    The question is RQ-SSIQ-9702af. No hypothesis or experiment on
    origin/main cites that full id. The branch design/ssiq-2abea4 was
    created from origin/main at
    cd2471e93113e228f3daabaee4bc2d3044bb8c98 and the merge of
    origin/main was already up to date. The copied proposal bytes
    hash to blob 5bd9739da7c93ae940ef8b62fc279c6da374a9ef.

    The contract freezes p = 101, the field polynomial a^2 - 2, δ as
    the least separable degree of an isogeny from E to E^{(p)}, the
    search cap 8, and the ordinary control excluded from the maximum.
    Success is the source idea's prediction that the maximum δ is at
    most 3 and that at least one δ is at least 2. The concrete
    negative is that some supersingular j has least found degree at
    least 4 inside the cap 8. No supersingular root was listed in
    this session.

    This session opened KR-RHO-755e35, KR-RHO-13bf67, KR-IC-5ea2f8,
    and KR-IC-f5c584. Those rows are not a measurement of this
    histogram. The Aubry-Oyono-Vincent bound is recalled and is not
    used as support.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. Success fails
    when some supersingular degree is at least 4.

    The same pass files three proposals and does not design them:
    IDEA-20261006-45908f, IDEA-20261006-b8d10a, and
    IDEA-20261006-237ce0.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - A supersingular degree at least 4 is reachable as a recorded outcome, so success is not automatic.
    - The reverse enumeration, the ordinary control, and the degree-1 field-membership test are the instrument controls.
    - An instrument failure is not relabeled as a ceiling miss.
    - This session did not list a supersingular root and did not claim that an exponent moves.

  evidence_refs: []
  limitations:
    - The measurement covers p = 101 only. It does not transfer to a cryptographic prime.
    - A maximum of 3 does not lower the conditional exponent 1/3 and does not produce a p^{1/4} algorithm.
    - Every δ equaling 1 is a failure of the witness clause, not a confirmation of the ceiling's usefulness.
    - An instrument failure is not a degree.
    - A timeout is failed_infrastructure and is not a mathematical negative.
    - This decision authorizes a later execution. It does not start one.
    - This decision does not edit a goal head.
    - The three new proposals are not hypotheses and are not approved experiments.

  next_actions:
