    -> analyzed). Two lanes therefore held concurrent approval and
    execution of the same frozen contract. This decision disposes of
    this lane and its records; it changes no scientific status.
  rationale:
    - >
      CANONICAL EXECUTION. The program state of record is main's:
      BATCH-a2bf8b's R1-R8 (git_commit_at_runs 5b83fed02e, snapshot
      03c6e3181b, spec sha256 9edd4a9ba1c9...a904be41, as recorded in
      DEC-20260908-d361ab), reviewed and analyzed. This decision
      recognizes that state and disposes of the duplicate; it does not
      elevate or demote either execution.
    - >
      UNPUBLISHED LANE RUNS. This lane's runs (R1-smoke, R2-audit,
      R3-construct-n6, R4-construct-n6-replay, plus the superseded
      R4-replay-n6 intermediate and the R5-construct-n8 development
      files) were never snapshot-archived: they existed only in the
      working tree of .worktrees/aes003-batch015-20260831 (branch
      ecrank-76a70d-exec2-20260906, 16 commits, none merged). Per the
      artifact policy a run whose receipts exist outside a committed
      archive is not program evidence and is treated as not executed
      for the program. No number from those runs is cited as evidence
      in this decision; the sole exception is the cost datum named in
      the defect finding below.
    - >
      PRESERVATION. Before the branch switch the working-tree
      artifacts were copied unmodified to
      /Volumes/SSD990/llm/tmp/opencode/ecrank-523fe1-backup-20260908
      (456 files; MANIFEST.sha256 alongside, 399 MB). That is storage,
      not evidence: it preserves this lane's implementation attempts
      (including the n = 8 modular rational-root finder ratroots.py
      and its test state) as possible prior internal work for the
      future v3-amendment design, and it carries no standalone
      evidential weight.
    - >
      DUAL APPROVAL, RECORDED. Both approval records stand as
      history: DEC-20260906-37d020 (user-confirmed; this lane's
      BATCH-6d91f9) and DEC-20260907-12086e (standing authorization;
      BATCH-a2bf8b). The latter's approval_note explicitly
      supersedes the earlier confirmation gate under the 2026-09-06
      standing authorization and preserves the pre-approval note
      verbatim, so the approval duplication was itself a recorded,
      deliberate supersession. The executed authorization is
      DEC-20260907-12086e, under which TASK-20260907-2a3331 ran.
    - >
      BRANCH AND AMENDMENT FATE. Branch ecrank-76a70d-exec2-20260906
      (origin) remains as immutable history and is ABANDONED: no
      further commits, no merge to main, no further runs. Its unique
      records are cited here by commit hash: approval archive
      20e55df413 (BATCH-6d91f9, DEC-20260906-37d020), the v2
      amendment 7ae5732837 (DEC-20260907-d8614b) and its correction
      b45b179085 (CORR-20260907-6d3247). The v2 amendment's measured
      finding (infeasibility of the v1 planted-meet floor) was
      independently re-derived by main's review round as the
      control-expectation defects adjudicated in DEC-20260908-d361ab
      (N1-N3); the amendment is input to that future v3 amendment and
      otherwise remains unexecuted history on its branch. It never
      bound the executed protocol.
    - >
      DEFECT FINDING (process, auditable). The two lanes approved and
      executed the same frozen contract in parallel. Cost of the
      duplication: this lane's unarchived R1-R4 counted work (8,683,560
      counted exact ops at R1/R2, 10,748,124 at R3, 8,406,879 at R4,
      plus wall time). The approval side was recorded (the
      supersession is explicit in DEC-20260907-12086e, which cites
      this lane's approval record DEC-20260906-98315b); the missing
      check was on the execution side: before minting an approval DEC
      for a frozen experiment, the goal's open lanes should be listed
      (tools/goal_lanes.py lanes) and any in-flight execution lane
      either justified or closed. This finding imposes no status
      change, no re-scoring, and no retroactive invalidation; it is a
      forward process recommendation only.
    - >
      GOAL-HEAD NEXT-ACTION DEFERRAL. Per user direction given to this
      session on 2026-09-08, the goal head's current next_action (the
      v3 amendment + replication batch, N1-N3 of DEC-20260908-d361ab)
      is deferred behind the design of IDEA-20260906-ae1cfa (open
      ECRANK proposal), which this batch BATCH-a9c273 now designs.
      Basis for the ranking: both actions serve GOAL-ECRANK-002's C1
      gate, and the certificate mechanism is a prerequisite for any
      replication round that re-certifies an ill-conditioned witness
      at scale, while the v3 amendment repairs control text whose
      defects are already adjudicated. Revisit condition: the v3
      amendment returns to the top of the ranking when the ae1cfa
      design batch completes its approval gate, or as soon as the
      ae1cfa design records a concrete technical impediment. This is
      a deferral with a named revisit condition, not a closure of the
      amendment work.
