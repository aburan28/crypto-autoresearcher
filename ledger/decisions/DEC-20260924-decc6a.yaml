# DEC-20260924-decc6a -- open GOAL-SERP-5ecff7 and GOAL-TFISH-9db414 with
# their questions RQ-SERP-722a09 and RQ-TFISH-9b13ff, on direct user
# instruction. Opens goals only. Dispatches nothing, approves no experiment.
coordinator_decision:
  id: DEC-20260924-decc6a
  recorded_at: '2026-09-24'
  decided_at: '2026-09-24'
  decided_by: coordinator
  recorded_by: coordinator
  decision: open_goal
  target_ids: [GOAL-SERP-5ecff7, GOAL-TFISH-9db414, RQ-SERP-722a09, RQ-TFISH-9b13ff]
  user_instruction: >-
    2026-09-24, paraphrased from a spoken request: devise goals to go after
    other block ciphers such as Serpent and Threefish, focusing on
    differential, linear, algebraic and related cryptanalysis, because the
    user suspects they may carry critical vulnerabilities.
  standing_authorization: >-
    AGENTS.md "Standing user authorization for ideas and experiments"
    (2026-09-06). It authorizes ideation and design under these goals; it
    approves no specific experiment.
  rationale: >-
    The program has no execution campaign on either cipher. GOAL-SYMF-c00fa1
    is census-only, and its own ideation (IDEA-20260805-5b8f95) records zero
    Serpent rows. Corpus literature entries put the published frontier at
    about 10-12 of 32 Serpent rounds (KN-LIT-3430, KN-LIT-2112, KN-LIT-5142)
    and about 32-35 of 72 Threefish rounds for single-cipher
    distinguishers/key recovery, with an estimated 53/57 of 72 for the
    rotational-rebound known-key setting (KN-LIT-4395, KN-LIT-6311). The
    nominal margins are large, so the goals are framed to produce either a
    frontier result or a measured per-family barrier; a scoped barrier is a
    complete, reportable outcome. Modern automated search and middle-layer
    theory postdate most of those results, which is the concrete reason to
    expect a measurable delta rather than a re-run.
  priority: >-
    Both areas are declared non-ECC (added to excluded_areas in
    orchestration/research-priority.yaml by this decision's archive). They
    are ranked after every ECC goal offering a ranked task.
  prior_expectation: >-
    Coordinator prior, recorded before any work: the most likely outcome for
    each cipher is a reproduced frontier plus measured death rounds per
    family, with at most a one-round improvement under one comparison key.
    A full-round weakness is not expected. The goals are designed so that
    outcome, if it appears, is reviewable rather than presumed.
  knowledge_promotion:
    promoted: []
    not_warranted: Goal opening; no evidence reviewed and no durable claim made.
  next_actions:
    - GOAL-SERP-5ecff7 next_action (batch 1 foundations).
    - GOAL-TFISH-9db414 next_action (batch 1 foundations).
