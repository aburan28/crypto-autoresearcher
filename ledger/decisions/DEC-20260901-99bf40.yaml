      the review-breakthrough POLICY or claim any breakthrough tier for its
      verdict; it runs the SAME review-adversarial task at max EFFORT under
      explicit user authorization of the added cost. If the resume session
      can only serve max effort by rerouting policy — which would change the
      tier's meaning — it must instead dispatch at the highest effort the
      task's own policy can serve and record the gap, never silently reroute.
