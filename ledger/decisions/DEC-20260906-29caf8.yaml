  context: >-
    Ledger-archive step for RUN-CSIDH-c65945-001 (EXP-CSIDH-c65945, committed
    95cc1fd4c under DEC-20260906-b60887's authorization and amendments/v1.yaml).
    Both required independent reviews are complete: validation
    (coordination/goals/GOAL-QALG-001/reviews/RUN-CSIDH-c65945-001-validation/report.yaml,
    verdict REVISE) and red-team
    (coordination/goals/GOAL-QALG-001/reviews/RUN-CSIDH-c65945-001-redteam/report.yaml,
    verdict SUSTAINED). This decision synthesizes both, files the required
    correction, promotes the durable finding, and records the resulting
    hypothesis status.
  decision: reject_scoped
  target_ids:
    - H-CSIDH-3eaede
    - EXP-CSIDH-c65945
    - RUN-CSIDH-c65945-001
    - EV-QALG-1b3395
    - KN-FIND-e22186
    - CORR-20260906-4c1b57
  rationale:
    - >-
      BOTH REVIEWS AGREE THE TWO PRIMARY FINDINGS SURVIVE. The Validator
      independently re-fetched all four required primary sources (plus two
      more) and confirmed every citation this task named for spot-checking
      verifies verbatim, with class_group_order_match and
      applicability_outcome both "CONFIRMED correct as reported." The Red
      Team's six-attack falsification attempt -- including the single
      strongest constructive case for outcome A this reviewer could
      build -- broke neither finding: Kuperberg's own general-N technique
      was shown to be bound to an oracle-model interface and a
      sieve-specific recovery step Simon's sample-based, binary-recursive
      construction does not share, on two independently-verified structural
      grounds, and a proves-too-much control confirmed the operative test
      discriminates correctly rather than blanket-rejecting.
    - >-
      VALIDATOR'S REVISE IS ON NARROW, NOW-DISCHARGED POINTS. The three
      defects driving REVISE (a Kuperberg citation misattributed by one
      section/page; an undisclosed Theorem-vs-Proof scope tension in Simon
      2026 that, on the Validator's own analysis, still would not flip
      outcome B; and an unmeasured, disclosed wall-clock overrun) are
      addressed by CORR-20260906-4c1b57. None targets
      class_group_order_match or applicability_outcome, both of which the
      Validator's own verdict_rationale states are "CONFIRMED correct."
    - >-
      SCOPE OF THE `reject_scoped` VERDICT. H-CSIDH-3eaede is an explicit
      two-premise (AND) conditional; this experiment tests ONLY premise
      (i). Premise (i) is found NOT satisfied under the currently citable
      literature (outcome B), independently confirmed by two adversarial
      reviews that each re-fetched every source live rather than trusting
      the executor. Per the hypothesis's own conditional structure, a
      negative on premise (i) forecloses THIS SPECIFIC hypothesis chain
      (Simon's construction, as currently published, applied to CSIDH-512)
      regardless of premise (ii), which remains untested and moot for this
      chain. This decision therefore records `reject_scoped`, scoped
      EXACTLY as EV-QALG-1b3395's boundaries and obstruction block state:
      a citation-existence finding at CSIDH-512's actual scale, NOT a
      mathematical-impossibility proof, NOT a claim about Simon 2026's
      Lemma 3, CSIDH's security, or a cost/speedup comparison, and NOT
      foreclosing a future literature discovery (the red-team's own
      next_concrete_action names the sharpest remaining open question: a
      noise-tolerant analog of the CRT/automorphism patch for an
      odd-modulus component).
    - >-
      EVIDENCE STRENGTH `strong`. Two independent adversarial review
      sessions, each re-fetching every primary source live (Kuperberg,
      Simon, Regev, Ettinger-Hoyer, plus CJS and, beyond scope, Peikert
      2019/725), confirming byte-identical file sizes and byte-verbatim
      citations, with four independent primality-verification methods
      agreeing exactly and a genuinely adversarial falsification attempt
      (not a defence) failing to overturn either finding. This meets the
      applicable bar for `strong` under docs/claims-and-verification.md for
      a derivation/literature-audit claim_tier, matching the identical
      standard applied to the sibling MLKEM finding (DEC-20260906-cc4fb6).
    - >-
      KNOWLEDGE PROMOTION IS THEREFORE OWED. Per CLAUDE.md's
      knowledge-promotion gate, a `reject_scoped` decision backed by
      evidence of strength `strong` must promote a finding
      (knowledge/findings/KN-FIND-e22186.md, filed alongside this decision)
      or state why not; this decision promotes.
  evidence_refs:
