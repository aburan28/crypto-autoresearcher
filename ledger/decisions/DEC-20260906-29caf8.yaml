      GOAL-QALG-001's next_action may now reflect H-CSIDH-3eaede's premise-(i)
      chain as closed (rejected, scoped) via this decision, EV-QALG-1b3395,
      and KN-FIND-e22186 rather than restating the finding.
    - >-
      No further compute or literature search is warranted against
      EXP-CSIDH-c65945 under this specific chain. Should a future session
