      both reviews' explicit warning against collapsing this distinction.
    - >-
      Does not resolve the run's disclosed budget/timing instrumentation
      gap beyond what CORR-20260906-4c1b57 states; a future literature-heavy
      task of this shape should use a genuinely measured timer or a
      budget field calibrated for full-text review.
  next_actions:
