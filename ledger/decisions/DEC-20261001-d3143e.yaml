coordinator_decision:
  id: DEC-20261001-d3143e
  recorded_at: '2026-10-01'
  decided_at: '2026-10-01'
  decided_by: coordinator
  recorded_by: coordinator
  goal_ids: [GOAL-RELN-001]
  archived_by: TASK-20261001-600563
  prior_decisions:
    - DEC-20261001-7fa9f9 (RELN review round; NA-1/NA-2)
    - DEC-20261001-f5e83a (opened BATCH-9fba5a; R-1)
  inference:
    policy: coordinator-orchestration-code
    resolved_model_id: unknown (Cursor runtime; top-level session on its inherited model)
    fallback_used: true
    fallback_reason: Cursor runtime does not expose the resolved model identifier.

  decision: hold_approval
  decision_label: >-
    DO NOT YET APPROVE EXP-RELN-dc761f / H-RELN-940f14. The design is complete
    except for its own impediment IMP-1: the three 28-bit fixtures and their
    budgets are not derived, so the inputs are not frozen. NEXT: a derivation
    task with an independent reproduction, then approval.

  target_ids:
    - EXP-RELN-dc761f
    - H-RELN-940f14
    - H-RELN-4d092c
    - TASK-20261001-5a45b1
    - TASK-20261001-8caa47
    - TASK-20261001-fc2bdf
    - TASK-20261001-600563

  readiness:
    checked_against: design snapshot TASK-20261001-8caa47, content-bound at 41096282bc (21 path hashes verified by tools/research_dispatch.py)
    present:
      - the v4 generator with B and B2 kept, L = ceil(q^{1/5}) fixed for every logarithm, fresh seed namespace EXP-RELN-dc761f/v1
      - C34 statistic (cycles of length 3 and 4) with a minimum-cycle-basis secondary, against 999 matched-degree rewires per cell conditioned on no root-root edge
      - kappa budgets {1/4, 1/2, 1, 2} from an exact label-free yield count; verdict pools kappa = 1 and 2
      - controls (planted positive, forests, null against itself, ER null keeping every replicate, report-only), verdict_rules and null_rules as the analysis, heuristic_under_test, proof_search_map, dominated_by, sota_delta
      - every v4 open-question ruling and re-derivation finding inlined
      - power check (non-protocol; 399 rewires): null-like graphs 0/100 ENRICHED, forests 0, planted 1.25x/1.5x/2x 100/100 ENRICHED
    blocking: >-
      IMP-1. The F-2 28-bit fixtures and their P-5 budgets require hashing
      EXP-RELN-dc761f/v1 curve labels, which the design card forbade. The rule
      is fully specified, so the values are deterministic.
    cosmetic_defect: >-
      open_question_rulings.rederivation_findings U-10 parses its finding label
      "aggregation, CI, undefined values, trend" as separate null keys (flow
      mapping). The ruling text is intact. To be quoted in the approval
      amendment, not by editing the snapshot.
    open_design_question: >-
      The certified-subcritical certificate is report-only and rarely
      reachable (kappa = 1/4: 0% of 20-bit, 5% of 24-bit, about 38-41% of
      28-bit cells; never at kappa = 1/2 or at 16 bits). Acceptable because it
      no longer enters the verdict; recorded so nobody reads its absence as
      evidence.

  rulings:
    - id: R-1
      ruling: >-
        Approval waits for IMP-1 to clear rather than approving a nine-fixture
        fallback now. The fallback keeps power for C34 but makes the
        certificate effectively unreachable, and choosing the panel after the
        fact is exactly the kind of post-hoc freedom the successor exists to
        remove. If derivation fails on its merits, a later decision may approve
        the nine-fixture panel, recording why.
    - id: R-2
      ruling: >-
        The rewire conditioning (no root-root edge) was introduced by the
        designer after the plain rewire read null-like graphs about 9%
        enriched. Accepted; the approval review must still check that the
        conditioning does not manufacture depletion in the treatment.

  transitions_not_made:
    - record: H-RELN-940f14
      note: Stays specified.
    - record: EXP-RELN-dc761f
      note: Stays review_required, approved_by null.
    - record: H-RELN-4d092c
      note: Stays approved.

  next_actions:
    - id: NA-1
      action: >-
        Dispatch a fixture-derivation task (executor-mechanical) that derives
        the three F-2 28-bit fixtures and their P-5 budgets by the contract's
        rule, plus an independent second implementation (validator) that
        reproduces them blind. Both are deterministic computations; no
        scientific run.
      owner: coordinator
    - id: NA-2
      action: Approval decision with the derived values frozen by additive amendment; quote the U-10 label.
      owner: coordinator

  knowledge_promotion:
    promoted: []
    not_warranted: Readiness decision; it records no result.
