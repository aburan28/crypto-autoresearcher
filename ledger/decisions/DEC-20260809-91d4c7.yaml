coordinator_decision:
  id: DEC-20260809-91d4c7
  context: >-
    /review-evidence for EXP-DTREE-001 / H-DTREE-001 (multi-level descent
    tree for prime-field ECDLP: C1 tests HEUR-001's decomposition-probability
    exponent by exact enumeration at 8-12 bits; C2 measures depth-2 descent
    cost against single-level descent at 16-24 bits). All 12 planned runs
    reached terminal status with complete, schema-checked, certificate-
    verified artifacts. This review independently re-derived the C1 lambda
    table, the C2 16-bit zero-success claim, the CTRL-GENERIC-HEURISTIC ratio
    range, and the bootstrap-CI figures directly from raw.json/summary.json
    (not merely trusting experiments/EXP-DTREE-001/analysis.md), and
    independently re-verified two certificates (one decomposition, one
    discrete-log) via from-scratch elliptic-curve point-addition and
    scalar-multiplication arithmetic. Full detail in EV-DTREE-b47c19 (C1)
    and EV-DTREE-2e8f6a (C2), which this decision treats as two genuinely
    different findings rather than one blended verdict.
  decision: inconclusive
  decision_label: c1_no_evidence_design_infeasible__c2_inconclusive_no_validity_prefix_qualified_comparison
  target_ids: [H-DTREE-001, EXP-DTREE-001, EV-DTREE-b47c19, EV-DTREE-2e8f6a]

  disposition_by_claim:
    c1_slope_heur001_exponent:
      outcome: design_infeasible — zero data produced bearing on HEUR-001's exponent
      status_effect: >-
        Not weakened, not supported, not refuted. HEUR-001's own
        falsification_condition (a 95% CI from >=6 fitted cells excluding
        m-1=2) was never triggered because no cell ever qualified for
        fitting (0 of 18 tested (curve, B') combinations, independently
        recomputed and confirmed). Per AGENTS.md rule 5, a design/
        instance-generation defect in the frozen generate_instance
        procedure at seed 1 is infrastructure signal, not a mathematical
        result about the (B'/N)^(m-1) heuristic or its birthday-counting
        competitor. This claim remains exactly as untested as it was before
        EXP-DTREE-001 ran.
      does_not_close_the_route: >-
        This is explicitly NOT a finding that the grid rule is
        unsatisfiable in general, nor that HEUR-001 is untestable — only
        that this specific seed, under this specific unmodified
        instance-generation function, does not produce curves whose tiny
        subgroups are large enough (n >= 80 by my precise re-derivation,
        corrected from analysis.md's looser "n >= 71.4" shorthand — see
        EV-DTREE-b47c19 OBS-2).
    c2_depth2_cost_vs_single_level:
      outcome: >-
        Mixed: 16-bit meets the validity prefix but yields an
        undefined-vs-undefined non-comparison (C1 AND C2 both undefined for
        the identical reason — P(m=3,B) measured as an exact 0 on the same
        underlying test); 20-bit and 24-bit both fail the validity prefix.
        Where C2 is defined at all (6/8 configs, all at 20-bit, the one
        sub-prefix size), every value exceeds C1, 5 of 6 carry bootstrap
        95% CIs entirely above 1 (lowest lower bound 1.15), and all three
        disjuncts of the falsification condition either fail to reach a
        validity-qualified "yes" or only reach one at the sub-prefix size.
        Zero configurations anywhere meet the success criterion
        (C2 < 0.8*C1 with CI entirely below 1) — this part is unambiguous
        regardless of the prefix question, since 24-bit (the size the
        success criterion names) has no defined C2 anywhere.
      status_effect: >-
        inconclusive, not weakened. See rationale below for the specific
        reasoning on why the falsification condition is not satisfied as
        literally, validity-qualified-ly written, and why I resolve the
        genuine interpretive tension toward the more conservative
        disposition rather than toward weaken.
      does_not_close_the_route: >-
        The multi-level descent route is NOT formally closed at toy scale by
        this record. Closing it under H-DTREE-001's own falsification
        criterion requires "C_2 >= C_1 for every tested configuration at
        every size with measured prefix meeting the validity minimum" — and
        no size supplies that as a validity-qualified, defined comparison.
        The uniform directional lean in every defined number (C2 always >
        C1 where either is defined; the generic-heuristic control shows a
        wildly non-generic effect; the fully-charged accounting is even
        more unfavorable) is real and is recorded in full in
        EV-DTREE-2e8f6a, but it does not, on its own, meet the bar the
        frozen protocol pre-registered for a decisive negative.

  rationale:
    - >-
      C1: design_infeasible is the protocol's own named stop-rule outcome,
      triggered exactly as specified (freeze-stage stop rule: "If the frozen
      grid yields fewer than 6 non-saturated cells... stop and record
      design_infeasible... do not improvise a new grid"). I independently
      recomputed all 18 tested (curve, B') lambda values by hand from
      RUN-DTREE-001/raw.json and confirm 0 qualifying cells exactly; the
      root cause (generate_instance's weak largest-prime-factor>=5 bar,
      which does not search for a large prime-order subgroup) is a property
      of the frozen instance-generation procedure at this specific seed, not
      of the mathematics under test. Under AGENTS.md rule 5 this is
      infrastructure/design signal, not evidence against (or for) HEUR-001.
    - >-
      C2, interpretive call (the genuine tension this review was asked to
      resolve explicitly): the falsification condition reads "C_2 >= C_1 for
      every tested (B_med, m', m) configuration at every size with measured
      prefix meeting the validity minimum". I read the ONE validity-
      qualified size (16-bit) as NOT supplying a valid instance of this
      clause, because the comparison is vacuous there — C1 is undefined
      for the SAME reason C2 is (both collapse to the identical underlying
      measurement, P(m=3,B) = exact 0 on the standard-base decomposition
      test), so there is no finite C1 baseline for C2 to be "worse than" in
      the first place. This is a stronger, not a weaker, reason for caution
      than the briefing's framing ("is an exact-zero rate an even stronger
      form of failure than a finite ratio") suggested: it is not merely that
      C2 fails to be a number while C1 stands as a clean baseline — neither
      term of the comparison exists. Symmetrically, I read the one
      validity-DISQUALIFIED size with a clean, finite, uniformly unfavorable
      signal (20-bit) as informative context but not as a validity-qualified
      falsifying instance, because the frozen protocol explicitly
      pre-designated exactly this category of result
      ("a size with fewer than 10 measured targets in at least 2
      configurations is resource_exhaustion (recorded, not evidence)")
      BEFORE any data existed — this is not a post-hoc excuse invoked to
      explain away an inconvenient number, it is the protocol's own advance
      commitment against over-reading an underpowered measurement (n1=3-4 of
      a planned 50 targets, driven by a shared 8-configuration budget being
      exhausted after 4 target-rounds). I also checked the falsification
      condition's other two disjuncts against their exact wording, not just
      the first: "optimal B_med = B at every size" is actively FALSE where
      measurable (20-bit's optimum is 16*B, not B) and undefined elsewhere,
      so it is not satisfied either; "medium-base log-table construction
      cost exceeds any descent saving in the fully charged comparison" IS
      satisfied, in a strong form (K*C2 alone exceeds K*C1 before even
      adding preprocessing, using K=standard_B=66 per aggregate.py's own
      accounting), but only at the same sub-prefix 20-bit size. No disjunct
      of the falsification condition is met at a validity-qualified size
      anywhere. Given genuine ambiguity remains even after this analysis
      (every defined number does lean the same unfavorable direction, and a
      reasonable reader could weigh that consistency more heavily than I
      have), I resolve it toward `inconclusive` rather than `weaken`, per
      this review's explicit instruction to prefer the more conservative
      disposition when torn.
    - >-
      The success criterion for C2 ("at least one configuration at the
      largest tested size [24-bit] achieves C2 < 0.8*C1 with a CI entirely
      below 1") is unambiguously NOT met, independent of the interpretive
      question above: 24-bit has no defined C2 in any of its 8
      configurations, so there is no configuration to evaluate against the
      threshold at all.
    - >-
      Two disclosed confounds bear on how much weight even the informative
      (non-validity-qualified) 20-bit signal should carry: (a)
      harness.semaev.build_factor_base samples the whole curve rather than
      the target's subgroup, and the three main curves have large,
      size-varying cofactors (2280/196/31512); measured single-level P does
      not track HEUR-001's own point-prediction in either direction or
      magnitude, and 20-bit (smallest cofactor) is the only size where any
      decomposition success was ever observed at all — cofactor size is a
      live, untested alternative explanation for the whole size-dependent
      pattern. (b) A confirmed, brute-force-verified bug in the shared
      harness/semaev.py's s4_expr (worked around locally for this
      experiment, but live in the shared file and directly imported by two
      other experiments, EXP-MTIC-001 and EXP-FIB-001) does not affect any
      number in this record but is disclosed for its own sake. CORRECTION,
      applied by the dispatching Coordinator during archival (2026-08-09):
      this review's own initial check described EXP-MTIC-001/EXP-FIB-001 as
      "approved-but-unexecuted" (zero runs); that check was wrong. Both
      experiments have many already-executed, already-committed runs (11 for
      EXP-MTIC-001, 10 for EXP-FIB-001) that call the buggy s4_expr directly
      on their result path. See KN-OPEN-5b3a08 (corrected in the same
      archival pass) for the verified detail. This does not change this
      decision's own C1/C2 findings, which concern only EXP-DTREE-001. Both
      are carried into EV-DTREE-2e8f6a's unresolved_confounds and into
      KN-OPEN-5b3a08.
    - >-
      Not `weaken`: doing so would require treating the 20-bit numbers as
      the decisive evidence despite their explicit sub-prefix status under
      the frozen protocol's own pre-registered rule, and despite the live,
      undiagnosed cofactor confound. Not `supported`: no configuration
      anywhere meets the success criterion, at any size, prefix-qualified or
      not. Not `rejected`/`reject_scoped`: forbidden on a single
      unreplicated empirical-only run in any case, and not reached here even
      in principle given the interpretive ambiguity above.
    - >-
      This is not a claimed breakthrough, closure result, or contradiction
      of previously validated evidence (H-DTREE-001 had no prior evidence
      record), so AGENTS.md rule 12's review-breakthrough-at-max escalation
      does not apply; ordinary Coordinator review-evidence discipline
      governs this decision.

  evidence_refs: [EV-DTREE-b47c19, EV-DTREE-2e8f6a]

  limitations:
    - >-
      This review's session had no shell/Bash execution tool available.
      tools/allocate_id.py and tools/validate_ledger.py were NOT executed;
      instead, new identifiers (EV-DTREE-b47c19, EV-DTREE-2e8f6a,
      DEC-20260809-91d4c7, KN-OPEN-5b3a08) were checked for well-formedness
      by hand against the exact regexes in tools/validate_ledger.py
      (ID_PATTERNS) and for freedom via a repository-wide Glob search for
      each token (a superset of allocate_id.py's own search paths, since it
      searched the whole repository rather than only the declared
      SEARCH_GLOBS) — zero hits for all four tokens. This is not the same
      guarantee as actually running the tool, and the dispatching session
      must run `python3 tools/allocate_id.py --check <id>` and
      `python3 tools/validate_ledger.py` before treating these records as
      final, per this task's own instructions.
    - >-
      C1's design_infeasible outcome was checked only against seed 1 at
      8/10/12 bits (the only seed the frozen contract names for the tiny
      curves). Whether a different seed under the SAME unmodified
      generate_instance function would populate the grid is untested and
      is the cheapest open question a successor should check first.
    - >-
      The cofactor/whole-curve-factor-base confound (rationale item 4a) is
      recorded as a live alternative explanation for the C2 pattern, not
      resolved. I did not attempt to isolate it from C2 data alone — the
      specification correctly identifies the (unavailable) C1 slope fit as
      the tool that would have isolated it under controlled, exact
      conditions.
    - >-
      This review did not re-verify all 12 runs' certificates individually
      (256 claimed across the experiment) — it independently re-verified 2
      by hand (one decomposition, one discrete-log) via from-scratch EC
      arithmetic, and cross-checked certificate COUNTS for internal
      consistency (e.g., RUN-DTREE-006's 38 claimed = sum of per-config
      stage1_found) for all runs claiming certificates. It relies on the
      run wrapper's own "verified: true / verifier: independent-recompute"
      field for the remaining 254, which is itself a documented,
      code-enforced independent-verification step per
      docs/claims-and-verification.md, not a self-report from the solver.
    - >-
      No goal-record checkpoint was performed. GOAL-ECDLP-001 (the parent
      campaign) was not touched by this review, per the explicit scope
      given ("H-DTREE-001, EXP-DTREE-001, and your new EV-DTREE-*/DEC-*
      records" only). AGENTS.md's checkpoint-after-every-ledger-archive rule
      applies to the dispatching Coordinator's archive step, not to this
      review.

  next_actions:
    - >-
      C1: requires either a versioned protocol_amendment to EXP-DTREE-001
      (using the existing, currently-empty experiments/EXP-DTREE-001/
      amendments/ directory) that changes ONLY the tiny-curve seed selection
      policy — e.g., searching over a small set of alternative seeds under
      the UNMODIFIED generate_instance function for ones whose 8/10/12-bit
      subgroup orders reach n >= 80 (the precise threshold this review
      derived), or fixing generate_instance itself to search for a
      large-subgroup curve rather than merely a largest-prime-factor>=5 one
      — or a scoped successor experiment (EXP-DTREE-002 or similar) that
      inherits C2's frozen main-curve results unchanged and only re-attempts
      the slope grid. Either path requires a Coordinator decision approving
      the change before any new run; specification.yaml itself stays frozen
      and unedited (AGENTS.md rule 4).
    - >-
      C2: a naive re-run of 20-bit/24-bit at a larger per-run cumulative
      Groebner-time budget WOULD directly address the validity-prefix
      shortfall (RUN-DTREE-007/008 exhausted their 1500s cap after only 4
      and 7 target-rounds respectively, well short of the needed 10
      targets in >=2 configs) and should be considered. But per the
      cofactor confound above, a larger budget alone may not be sufficient
      to produce a MORE INFORMATIVE result if cofactor size (not raw
      compute) is the true bottleneck — 16-bit already has a fully
      budget-adequate validity-prefix-meeting measurement (8/8 configs) and
      STILL shows an exact 0/N stage-2 success rate throughout. A future
      task should consider pairing (or sequencing before) a larger-budget
      re-run with a variant that restricts build_factor_base to the target
      subgroup <P>, to separate "genuinely needs more compute" from
      "genuinely needs a different factor-base construction" as the
      explanation for the current pattern.
    - >-
      Knowledge: KN-OPEN-5b3a08 is created (see knowledge_promotion below)
      to carry the two cross-experiment-relevant confounds (the
      harness/semaev.py s4_expr bug's blast radius into EXP-MTIC-001 and
      EXP-FIB-001; the build_factor_base whole-curve-vs-subgroup sampling
      property) forward for a future session with bandwidth to audit or fix
      them, rather than letting them sit undiscoverable inside one
      experiment's implementation notes.
    - >-
      The dispatching session should merge origin/main, push this branch,
      and open/refresh the PR naming EV-DTREE-b47c19, EV-DTREE-2e8f6a,
      DEC-20260809-91d4c7, KN-OPEN-5b3a08, and the amended H-DTREE-001,
      after independently confirming `python3 tools/validate_ledger.py`
      reports zero new errors and after running the two allocate_id.py
      `--check` invocations this review could not run itself (see
      limitations).
    - >-
      A future GOAL-ECDLP-001 checkpoint (not performed by this review)
      should record that this lane resolved to inconclusive on both claims
      and name the two next_actions above as the concrete re-rank triggers,
      per the focus-discipline rule that a scoped rejection, invalid run, or
      exhausted batch ends the TASK, not the larger goal.

  knowledge_promotion:
    promoted: [KN-OPEN-5b3a08]
    not_warranted: >-
      No KN-FIND is warranted: the mandatory-promotion gate ("support or
      reject_scoped on replicated/strong evidence") is not triggered by an
      inconclusive decision, and neither evidence record reaches
      replicated/strong strength (both are strength: inconclusive). A
      KN-OPEN entry (KN-OPEN-5b3a08) IS promoted, covering the two
      cross-experiment-relevant confounds surfaced during this review (the
      harness/semaev.py s4_expr bug's blast radius into EXP-MTIC-001 and
      EXP-FIB-001 (each with many already-executed runs on the buggy path,
      per the correction in rationale item 4b — not "approved-but-unexecuted"
      as this review initially and incorrectly stated); and the
      build_factor_base whole-curve-vs-subgroup sampling property's
      interaction with cofactor size) — these are precisely statable open
      questions extending beyond this one experiment, which is exactly the
      KN-OPEN trigger per knowledge/README.md ("Inconclusive outcomes that
      leave a precisely statable question become KN-OPEN entries").

  decided_by: coordinator
  decided_at: '2026-08-09'
