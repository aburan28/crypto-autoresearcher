  context: Accept exact unchanged component files and the corrected v2 binding for subsequent integration.
  rationale:
  - The older independent review held the bounded decoder/table/BSGS/rho behavior controls but failed its overall
    joint for BINDING-CUSTODY-1. That historical verdict remains failed.
  - The new independent review holds the replacement metadata and confirms byte-for-byte source conservation,42input
    bindings,19comparisons and42malformed controls.
  - Together these support selecting the exact component files and corrected binding for integration;they do
    not imply a fresh whole-runtime review or scientific admission.
  approved_boundaries:
  - Explicitly select and hash-check the v2 binding;do not fall back to the superseded v1 file in the original
    source folder.
  - Treat tests.py as verification source,not a production solver entry point.
  - Preserve caller-exclusive mutation of the table buffer;the reviewed component does not promise external-tamper
    detection.
  - Complete and independently review runner/generator/manifest/runtime/trust/guard integration before any
    scientific execution.
  - Bounded reviewed component source and metadata selection for further integration;not a claim of universal
    correctness, measured performance, full runtime readiness or scientific validity.
