    design/canl-8276a8-qshare was created from origin/main at
    9c2bc35e93f0c2f83026c8e351c621f623bdfb90 and git merge origin/main
    reported already up to date.

    The contract freezes Q_4 at p=19 and n=4 on (2, 3), (0, 1), and
    (1, 1). The pre-registered prediction is a CM-null absolute gap of
    at least 0.25 gated by a null-null gap of at most 0.10. A finished
    CM-null gap strictly below 0.25, with the null-null gap at most
    0.10 and the ordinary, non-CM, stability, and p=17 gates passing,
    is a negative. No discrete log is lifted.

    This session checked the three point substitutions, checked that
    4 A^3 + 27 B^2 is 27, 31, and 23, and counted #E(F_17) = 18 for
    y^2 = x^3 + 1. It did not compute 16P. It opened KR-IC-cd159a,
    KR-RHO-0528e7, and KN-TECH-018. Those rows are not used as costs.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. Success is a
    valid pin together with the predicted gaps, and it fails when the
    finished CM-null gap is below 0.25 against matched nulls. No field
    required for approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading are fixed before any executor run.
    - A finished CM-null gap below 0.25, including the all-zero valuation case, is reachable as a recorded outcome, so success is not automatic.
    - Two non-CM models are the same-shape control. A null-null gap above 0.10 is its own negative.
    - The p=17 supersingular reduction is the nearby object that must not be scored.
    - This session did not compute Q_4 and did not claim that xedni works.

  evidence_refs: []
  limitations:
    - The measurement covers one pin at p=19 and n=4. It does not determine the canonical height of order N.
    - KR-IC-cd159a remains the known negative result for characteristic-zero lifts. This decision does not contradict it.
    - HEUR-1 is exact arithmetic. It is not a distribution of heights.
    - A null-null gap above 0.10 is a negative of a different row and is not a CM effect.
    - This decision authorizes a later execution. It does not start one.
    - This decision does not edit GOAL-ENDO-001.

