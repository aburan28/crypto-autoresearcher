  context: >-
    /design-experiment, one contract. IDEA-20261005-1896e8 already has
    hypothesis H-CSIDH-73e6ab and experiment EXP-CSIDH-999626 on open
    pull request 1904. IDEA-20261005-447d82 already has hypothesis
