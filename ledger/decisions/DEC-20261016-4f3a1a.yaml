  rationale:
    - >-
      The frozen success criterion is met on the recorded one-shot figures
      (+3.71 % to +10.36 % against GLV on E) and remains met under the
      validator's correction (at most +2.20 % to +9.46 %, all positive). The
      corollary holds on all six (-25.2 % to -34.1 % one-shot). No criterion
      was relaxed or tightened.
    - >-
      Support is premature on three grounds. The deciding column of the run
      record is known to be under-charged, and its corrected signs rest on a
      written derivation, not on an executed instrument. The six positives
      are four isogeny classes, and the mnt5 pair routes to the
      negative-control curve itself. The GOST margin shrinks to at most
      2.2 %. A corrected re-run is cheap (the frozen run took 74.7 s) and
      turns the correction into a run record.
    - >-
      The frozen on_positive branch is honoured: GOST 2001 test curve, mnt3
      (mnt3/1, mnt3/3), mnt5 (mnt5/2, mnt5/3) and Tom-384 are recorded as
      candidates for a timed comparison against GLV on E. That comparison
      should freeze its prediction from the corrected modelled figures, which
      is why the re-run ranks first.
    - >-
      This is not a surprising or high-impact result: the Coordinator prior
      in the frozen specification predicted it. It is a constant-factor,
      known-scalar result and does not displace exponent-targeting work.
