  scoped_claim: >-
    On four isogeny classes (GOST 2001 test curve; mnt3/1, mnt3/3; mnt5/2,
    mnt5/3; Tom-384), within ell <= 13, depth 2, 12 candidates and the
    curvesweep M_eq = M + S model at S = 1 M, the 2-GLV on a horizontal
