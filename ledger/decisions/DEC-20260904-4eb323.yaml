coordinator_decision:
  id: DEC-20260904-4eb323
  context: >-
    Composes independent Validator (J1 holds-with-finding, J2 confirms
    witnesses exactly plus finds a mislabeling) and Red Team (J3
    holds-with-finding, J4 breaks) review of H-MONO-93bc4d's candidate
    proof discharging HEUR-KUM-2 (H-MONO-45183a's own named weakest
    link), per review-plan TASK-20260904-cb0cb2. Both reviewers worked
    fully independently (each disclosed never reading the other's
    directory) and converged, via unrelated methods, on the same core
    correction to the ordered-base argument and the same correction to a
    disclosed anomaly, while diverging sharply on the symmetric-base
    extension (D3), which the Red Team shows is actively wrong at its own
    stated baseline. This Coordinator adopts both reviews in full; see
    CORR-20260904-d2c631 for the complete disclosure.
  decision: revise
  decision_label: >-
    heur_kum_2_discharged_for_ordered_base_via_convergent_independent_proof_and_prior_publication_symmetric_base_extension_refuted_at_own_baseline_mislabeled_collision_corrected
  target_ids:
    - H-MONO-93bc4d
    - H-MONO-45183a
    - IDEA-20260904-0417a5
    - IDEA-20260904-ad63fe
    - EXP-MONO-917e3a
    - RQ-MONO-001
    - EV-MONO-95b9b1
    - CORR-20260904-d2c631

  hypothesis_status_before: proposed
  hypothesis_status_after: split_ordered_base_supported_symmetric_base_extension_refuted_at_m3_baseline
  hypothesis_status_after_note: >-
    H-MONO-93bc4d's (D1)/(D2) ordered-base claim (HEUR-KUM-2: S_m
    irreducible over k(x_1..x_{m-1}), monodromy exactly (Z/2)^{m-2}, at
    every m>=3) is SUPPORTED, decisively: two independent reviewers each
    independently closed the honest |S|>=2 gap via a general argument
    requiring no witness (a dominance argument and a transcendence-degree
    argument, respectively, both correct and mutually corroborating), and
    the Red Team additionally located the underlying absolute-
    irreducibility theorem already published (arXiv:1403.0126 Theorem 1).
    H-MONO-93bc4d's (D3) symmetric-base claim (monodromy exactly V
    semidirect S_{m-1}, order 2^{m-2}(m-1)!, empty exceptional locus at
    every m) is REFUTED AT ITS OWN m=3 BASELINE: the true m=3
    symmetric-base group is S_2 (order 2), not the order-4 group (D3)
    predicts, because (D3)'s own unstated requirement (the symmetric-base
    splitting field contains the ordered-base one) is false at m=3. This
    is not merely "unconfirmed" -- it is an active, independently-verified
    refutation of a specific numeric prediction against an
    already-established value (OBS-2).

  experiment_status_before: completed
  experiment_status_after: completed

  official_status_changes:
    goal_status_changed: false
    goal_status_after: paused
    hypothesis_status_changes:
      - hypothesis_id: H-MONO-93bc4d
        from: proposed
        to: split_ordered_base_supported_symmetric_base_extension_refuted_at_m3_baseline
      - hypothesis_id: H-MONO-45183a
