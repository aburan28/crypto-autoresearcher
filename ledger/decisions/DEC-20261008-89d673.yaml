    F1: Lane opening archive TASK-20261002-aa2b91 is commit 32ffef4661be618f26a5d2bee55c779259bf99de, on origin/main.
    F2: >-
      After git fetch, git log 32ffef4661..origin/main -- experiments/EXP-QSP-70b731
      excluding experiments/EXP-QSP-70b731/runs lists no commit.
    F3: >-
      git log 32ffef4661..origin/main -- experiments/EXP-QSP-70b731/runs lists
      two commits. The first is e294b34ac8. Its author and committer date is
      2026-10-02T15:05:53Z and its author name is "Dispatch Test". Its
      name-status shows 8 paths ADDED under experiments/EXP-QSP-70b731/runs/;
