  # ---------------------------------------------------------------------------
  rulings:
    - id: R-STOP-MET
      subject: Is DEC-20261002-c01bb7 R-QSP-RETURN (2) met on F1 to F8?
      ruling: >-
        (2)(b) IS MET, BY e294b34ac8. (2)(a) IS NOT MET. e8fd380147 MEETS
        NOTHING. The session was right to stop before TASK-20261002-9831c4.
      reasons:
        - >-
          The text. (2)(b) stops the lane on "any commit, on origin/main or on
          origin/exec/qsp-70b731-run-20260921, that adds or changes a file
          under experiments/EXP-QSP-70b731/ outside this batch's write
          scopes". It makes no exception for runs/. The same decision did
          narrow a different check to "outside runs/": the R-NOT-DUPLICATED
          re-check in NA-1 (2). So the drafters distinguished the two cases,
          and the absence of an exception in (2)(b) is deliberate. Additions
          under runs/ were meant to stop the lane, because they are the
          likeliest trace of another party executing EXP-QSP-70b731.
        - >-
          The commit qualifies. e294b34ac8 adds 8 paths under
          experiments/EXP-QSP-70b731/runs/ (F3). No write scope of this batch
          lies under runs/. Under experiments/EXP-QSP-70b731/ the batch writes
          only amendments/AMD-20261002-09957b.yaml, implementation/r1/ and
          trial-plan-r1.json. e294b34ac8 is reachable from origin/main through
          64447e7331. It is not an ancestor of 32ffef4661. Its author date
          follows the opening archive, and its merge to main followed it by
          about six hours. The opening re-check reported no foreign commit
          under experiments/EXP-QSP-70b731/ (DEC-20261002-c01bb7
          session_checks_reported.qsp_return). So it arrived after the lane
          opened.
        - >-
          e8fd380147 changes no path under runs/ (F3). It is listed only
          because it is not an ancestor of 32ffef4661, and it predates the
          lane. It adds and changes nothing there, so it does not meet (2)(b).
        - (2)(a) fails on F5. Nothing was found on origin/exec/qsp-70b731-run-20260921 (F4).
        - >-
          Owner silence (F6) is recorded, not read as consent, objection or
          abandonment (R-QSP-RETURN (5)). No reply exists, so clause (3) is
          not triggered by a reply. Its rule still governs how the committed
          bytes are read (R-FRESH-READ).
      not_evidence: >-
        A stop is a custody and coordination signal. It is not a
        mathematical result, it supports or weakens nothing, and it says
        nothing about H-QSP-cd0c90, EV-QSP-a6aa4b or any run.

    - id: R-BEARING
      subject: >-
        What the added files can and cannot change for this lane, decided
        without reading them
      ruling: >-
        NO BEARING ON ANY ROUND-1 OBJECT OR JOINT CAN BE ESTABLISHED, AND
        NONE IS STRUCTURALLY POSSIBLE ON F2. A BEARING ON ROUND-2 CUSTODY AND
        ON WHETHER THE LANE DUPLICATES ANOTHER PARTY'S WORK CANNOT BE EXCLUDED
        WITHOUT READING THEM. Reading them is the fresh read's job (R-FRESH-READ).
      reasons:
        - >-
          F2: from 32ffef4661 to origin/main, no commit touched the
          specification, any trial plan, any bound implementation file, the
          amendments directory, implementation/r1/ or trial-plan-r1.json.
          Every input the producer designed against, and every input a
          round-1 reviewer reads, is therefore unchanged on main.
          TASK-20261002-9831c4 checks this mechanically through its input-hash
          constraints, which read nothing under runs/.
        - >-
          No card of this batch reads or writes runs/ (R-READ). The round-1
          joints (JRD1 to JRD3) judge a design and an amendment against the
          frozen specification and the committed round-1 material. A file
          under runs/ is outside that evidence base and cannot change a joint
          verdict.
        - >-
          No plan, amendment or approval accompanied the files on main (F2).
          This record does not characterise the files. It notes only that
          they did not arrive with a new protocol object. Today no
          EXP-QSP-70b731 plan can produce evidence (DEC-20261002-a63f13 C-EQ
          with DEC-20261002-5e691c R-CONTINUATION, as DEC-20261002-c01bb7
          cites them), and nothing here reopens that ruling.
        - >-
          The author identity "Dispatch Test" does not tell us where the
          commit came from. tools/test_research_dispatch.py (lines 554, 605,
          694, 782, 1830) sets it inside temporary test repositories, and
          docs/track-record-review-20261006.md (line 95) counts 3,158 commits
          under that name since 2026-09-01. Sessions doing ordinary work
          therefore use it widely. It neither identifies a session nor shows
          that the files are a test fixture.
        - >-
          Three questions remain open, and only reading the files answers
          them. (Q1) What the files are and who produced them. (Q2) Round-2
          custody: whether the files name run ids or directories that the
          twenty fresh RUN-QSP ids (R-IDS, CC-1) must avoid, and whether they
          bear on CC-2 (the 14 invalid trials re-run) or on the CI-2 paths.
          (Q3) Whether another party is executing or repairing EXP-QSP-70b731,
          which would make this lane duplicate work or be moot. Q2 and Q3 can
          change round 2 and the lane's purpose. None of them can change a
          round-1 verdict.

    - id: R-NEXT
      subject: what the lane does next, ranked against doing nothing
      ruling: >-
        ORDER: (1) TASK-20261008-7edaa3. The session writes the stop-facts
        record. (2) TASK-20261008-9c4f20. This decision's ledger archive runs
        alone and is verified and pushed. (3) TASK-20261002-9831c4. The design
        snapshot runs on terms T-1 to T-8. (4) TASK-20261008-4fe79a, the
        quarantined fresh read, then TASK-20261008-b653a5, its archive. (5)
        The round-1 review cards TASK-20261002-865f15, -820856 and -efd590, as
        planned. Because the queue is serial, (4) and (5) may interleave in
        any order once (3) verifies. (6) The composer TASK-20261002-eced26 is
        launched only after TASK-20261008-b653a5 verifies (C-4). Every later
        card keeps its existing preconditions.
      ranking:
        - rank: 1
          act: TASK-20261008-7edaa3 and TASK-20261008-9c4f20 (make this ruling official)
          against_doing_nothing: >-
            A ruling that lifts a stop must be committed before a card acts on
            it (agents/coordinator.md, Prohibitions; AGENTS.md "Durable
            research commits"). The cost is about one short archive.
        - rank: 2
          act: TASK-20261002-9831c4 (durability of the producer's files)
          against_doing_nothing: >-
            The producer's two files exist only untracked. This lane has
            already lost one dispatch to a container restart
            (DEC-20261002-c01bb7 PD-5), and the session was halted for six
            days (F8). Losing the files would forfeit a completed producer
            card of a fresh, independent session, and that cannot be redone
            with the same independence. Binding the bytes now also proves the
            design was fixed before any party of this batch read the foreign
            files.
        - rank: 3
          act: TASK-20261008-4fe79a with TASK-20261008-b653a5 (fresh read)
          against_doing_nothing: >-
            Q1 to Q3 stay open otherwise. Eight unexplained files under an
            immutable runs/ tree, in an experiment whose plans cannot produce
            evidence, are an anomaly the program must preserve and explain
            (agents/coordinator.md, Prohibitions). Round 2 cannot mint its run
            ids safely while Q2 is open. The read takes one Coordinator
            session and zero runs.
        - rank: 4
          act: Round-1 reviews TASK-20261002-865f15, -820856 and -efd590
          against_doing_nothing: >-
            This is the lane's decision-changing information: whether
            EXP-QSP-70b731 can be made executable (DEC-20261002-c01bb7
            lane.decision_it_changes). The reviews read nothing the foreign
            files touch (R-BEARING).
        - rank: 5
          act: Doing nothing (lane held stopped)
          cost: >-
            Slot 2 sits idle while S1-V5 waits behind it (DEC-20261002-c01bb7
            R-ORDER-6 (2)). The producer's files stay at risk. The anomaly
            stays unexplained. Nothing is learned.
      alternatives_rejected:
        - alternative: Fresh read first, snapshot after
          why_not: >-
            The fresh read cannot change which bytes the snapshot binds. The
            snapshot commits the files exactly as returned, whatever the read
            finds. Waiting only lengthens the time the files sit untracked.
            Binding first also removes any later doubt that the design was
            influenced by the read.
        - alternative: Hold the round-1 reviews until the fresh read is committed
          why_not: >-
            No question the read can answer changes a round-1 joint
            (R-BEARING). The queue is serial anyway, and the composer gate
            (C-4) puts the read's result in front of the only round-1 party
            that decides anything.
        - alternative: Proceed with no fresh read and record the finding only
          why_not: >-
            The purpose of R-QSP-RETURN (2)(b) is to surface another party's
            activity on EXP-QSP-70b731, and Q3 is exactly that question.
            Leaving Q2 open would carry an unknown custody fact into round 2.
        - alternative: Close or suspend the lane
          why_not: >-
            There is no evidence of duplication: no live QSP claim (F5), no
            owner message (F6), and no protocol object outside runs/ (F2).
            Rule 9 forbids closing a lane on an unexamined suspicion. If Q3
            proves real, the fresh read stops the lane (FR-STOP).

    - id: R-SNAPSHOT-TERMS
      subject: whether the snapshot may secure the untracked producer files before the fresh read, and on what terms
      ruling: YES. TASK-20261002-9831c4 runs before the fresh read, on terms T-1 to T-8, with every constraint on its card unchanged.
      terms:
        - id: T-1
          text: It runs only after TASK-20261008-9c4f20's receipt is verified by research_dispatch.py and pushed, and it runs alone.
        - id: T-2
          text: >-
            The session first applies R-AMD-PATH exactly as the queue note
            says. The producer reports that it wrote the amendment, and the
            session confirms the file exists at
            experiments/EXP-QSP-70b731/amendments/AMD-20261002-09957b.yaml.
            In the same tasks_state_revisions practice, the session records
            TASK-20261002-01d26d's FINAL return and its claim release (epoch
            3). The session applies these revisions; this decision only
            directs them.
        - id: T-3
          text: >-
            The pre-gate sha256 of each producer file, its first act, must
            equal the custody digest that stop-facts.txt (SF-6) recorded for
            that file. Any difference is a custody stop that returns the lane
            to a Coordinator pass. The file is never repaired or re-hashed
            into agreement.
        - id: T-4
          text: >-
            The R-QSP-RETURN check is performed as written. e294b34ac8 and
            e8fd380147 are RULED HERE and do not stop TASK-20261002-9831c4 or
            any later card. Any OTHER commit, on origin/main or on
            origin/exec/qsp-70b731-run-20260921, that is not an ancestor of
            32ffef4661 and adds or changes a file under
            experiments/EXP-QSP-70b731/ outside this batch's write scopes is a
            NEW stop, and so is a live claim on any QSP queue. Any owner MSG
            id is recorded for the composer as R-QSP-RETURN (1) says. The
            receipt names DEC-20261008-89d673 as the ruling applied.
        - id: T-5
          text: >-
            Nothing under experiments/EXP-QSP-70b731/runs/ is listed, opened,
            hashed or staged. The input-hash checks on the card are unchanged
            and touch no runs/ path.
        - id: T-6
          text: >-
            The snapshot binds bytes and nothing else. It approves no design
            or amendment, and committing AMD-20261002-09957b.yaml with
            approved_by null is not an approval. Only DEC-20261002-ff2bd5
            rules on the amendment.
        - id: T-7
          text: >-
            The commit message states no value, no rate and no verdict, and
            says nothing about the foreign files beyond "R-QSP-RETURN ruled by
            DEC-20261008-89d673".
        - id: T-8
          text: >-
            If the snapshot cannot run (custody stop, parse failure reported,
            or an infrastructure fault), the producer files stay untouched and
            untracked, the lane returns to a Coordinator pass, and nothing is
            treated as evidence.

    - id: R-FRESH-READ
      subject: the read of the e294b34ac8 files (R-QSP-RETURN (3)), carded and not performed here
      ruling: >-
        CARDED AS TASK-20261008-4fe79a, a quarantined Coordinator card that
        writes the fresh-read decision DEC-20261008-ee5340 (reserved id) and a
        read worksheet, archived by TASK-20261008-b653a5. R-READ is
        LIFTED FOR THAT CARD ALONE and for exactly the paths e294b34ac8 adds
        under experiments/EXP-QSP-70b731/runs/. Every other party and card of
        this batch keeps the full exclusion.
      questions:
        - id: FR-1
          text: >-
            Provenance. Which session, branch and PR produced e294b34ac8, and
            which branch 64447e7331 merged. What the eight files are (a run
            record set, a fixture, or something else). Which plan, task, run
            ids and source digests they name.
        - id: FR-2
          text: >-
            Protocol standing. Whether the files bind to any existing
            EXP-QSP-70b731 plan or to none, and whether any approval or
            execution card authorises them. The read gives no reading of
            validity beyond that.
        - id: FR-3
          text: >-
            Round-2 custody. Run ids or directory names that the twenty fresh
            RUN-QSP ids must avoid (R-IDS, CC-1). Any bearing on CC-2 or on
            the CI-2 paths.
        - id: FR-4
          text: >-
            Duplication. Whether another party is executing or repairing
            EXP-QSP-70b731 in a way that duplicates this lane or makes it
            moot.
        - id: FR-5
          text: >-
            Disposition outside this lane. Route any custody, correction or
            evidence question to its owner, by record. If any party asserts
            that the files are valid observations that could contradict
            EV-QSP-a6aa4b, the route is TW-C1 at review-breakthrough max.
            Nothing is decided on it here.
      quarantine:
        - >-
          The card is held by a fresh Coordinator session. That session did
          not author this decision or DEC-20261002-c01bb7. It is not the
          producer, a reviewer or a composer of either round, nor the session
          of TASK-20261002-c5d9e7 or TASK-20261002-323713, nor any party of
          BATCH-4708f7, nor coordinator-qsp-run-20260921. It holds no other
          card of BATCH-521e9d, before or after.
        - >-
          The top-level session does not open the files. It relays only git
          metadata and the eight path names, which it enumerates inside this
          card's launch prompt and nowhere else.
        - >-
          No file the card writes states a run value of EXP-QSP-70b731 or
          EXP-QSP-33b442, a count, a reading of H-QSP-cd0c90's standing, or
          whether anything supports, weakens or contradicts H-QSP-cd0c90 or
          EV-QSP-a6aa4b. This is the TQR-4 discipline of
          REVIEW-QSP-RD-20261002-521e9d, binding on this card. Findings are
          stated at the level of identity, provenance and custody only.
        - >-
          The read worksheet is readable by no other card of this batch. The
          fresh-read decision is readable by both composers, because it
          carries no value.
      authority:
        - id: FR-STOP
          text: >-
            If FR-4 finds duplication or mootness, or FR-2 finds an approval
            or execution that conflicts with this lane, the fresh read stops
            the lane under R-QSP-RETURN (2) before the next card. It returns
            the lane to a Coordinator pass, not to the composer, and it may
            not close the lane.
        - >-
          The fresh read approves nothing, moves no status, edits no record,
          and does not rule on AMD-20261002-09957b or the design.

    - id: R-COMPOSER-CARRY
      subject: how the finding reaches DEC-20261002-ff2bd5
      ruling: >-
        By four routes, without changing the composer's stored prompt or its
        four session blocks.
      routes:
        - id: C-1
          text: >-
            The queue's tasks_state_revisions entry written in this pass names
            DEC-20261008-89d673, the met stop and the fresh-read cards. The
            composer reads the queue.
        - id: C-2
          text: >-
            In the session's third block for the composer (GOAL-ECDLP2M-001
            decisions later than DEC-20261002-c01bb7), the session names
            DEC-20261008-89d673 and the fresh-read decision with their archive
            commits, and states for each whether it is on origin/main yet. A
            decision of this lane that is committed but not yet on main is
            stated as such and is readable under the composer's read_scope
            (ledger/decisions/).
        - id: C-3
          text: >-
            The composer treats the finding as it treats an owner reply under
            CR-12: as a pointer it rules on, never as evidence. The ruling
            records (a) the met stop and this decision, (b) the fresh-read
            decision's findings on FR-3 and FR-4, and (c) whether the
            producer's read attestation names any path under
            experiments/EXP-QSP-70b731/runs/, cross-checked against SF-7. If
            it does, TQR-4 or R-READ applies under the plan's keys as written.
            The composer reads neither the eight files nor the read worksheet.
        - id: C-4
          text: >-
            TASK-20261002-eced26 is launched only after TASK-20261008-b653a5
            verifies, unless the fresh read stopped the lane (FR-STOP). This
            is a hold on launch timing. It does not edit the card.

    - id: R-ROUND2-GATE
      subject: round-2 custody
      ruling: >-
        If DEC-20261002-ff2bd5 applies K-design-accept, neither the twenty
        RUN-QSP ids (R-IDS) nor TASK-20261002-38ffea is minted or dispatched
        until the fresh-read decision is verified. Every id the fresh read
        names under FR-3 is added to the list the minted ids must avoid. The
        R-QSP-RETURN check before each executor card stays as written.

  # ---------------------------------------------------------------------------
  cards_added:
    note: >-
      Appended additively to the queue in this pass as four new task entries
      and one tasks_state_revisions entry. No existing task, receipt, claim
      or handoff is edited. The handoff of each new card is carried in full
      in its queue entry, because this pass was limited to writing this
      decision and the queue (PD-2).
    cards:
      - id: TASK-20261008-7edaa3
