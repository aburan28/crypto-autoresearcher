  ruling_on_the_draft:
    complete_as_design: true
    approvable_now: false
    redesign_required: false
    summary: >-
      The draft meets every item of its completion gate, and its
      load-bearing inputs check out at source. No defect found here changes a
      cell, a rung, an arm, the statistic, alpha, an outcome rule or the
      scope, so no corrected draft and no new design task is needed. Two
      groups of items still stand between the draft and an approval. The
      first is the runnable-gate findings RG-1 to RG-4, which come from the
      probe's source code. They are interface requirements the card's
      docstring-only scope could not reveal. The second is the draft's own
      blockers B-1 to B-6, ruled below. Seven approval-time items (AT-1 to
      AT-7) are left to the approval act, which states each of them before
      anything is frozen.
    runnable_gate_findings:
      - id: RG-1
        title: a canonical review_required specification must be committed on main before the probe
        finding: >-
          tools/experiment_preapproval.py reads
          experiments/<EXP>/specification.yaml from the working tree. It
          requires that file's status to be review_required or specified and
          its approved_by to be empty. It requires the file to be committed
          with the same bytes at source_ref (origin/main), and otherwise
          reports a blocker (RB-57, RB-58). The draft's B-2 says
          "specification.yaml is written only at approval" (RB-27), and
          DEC-20261017-f70b44 OD-3 says the id "names no record until an
          approval freezes a specification" (RB-70). Both are incompatible
          with the probe.
        ruling: >-
          Before the probe, a canonical review_required specification for
          EXP-PFDR-969aae is committed and merged to main. This supersedes,
          prospectively, the OD-3 sentence above and the B-2 sentence; neither
          record is edited. The rest of OD-3 stands: the id was minted and
          confirmed free, and if the design is declined the declining act
          records the experiment's terminal state. The canonical file is a
          MECHANICAL transcription of the archived draft's `experiment`
          mapping, made under a field map (NA-3 (ii)). The field map adds
          only the RG-2 keys and a draft-provenance key. Loaded, the result
          minus those keys must equal the archived mapping exactly; that
          equality is the transcription's acceptance check. Status stays
          review_required, frozen false, approved_by null and
          execution_authorized false.
      - id: RG-2
        title: specification fields the probe requires that the draft lacks
        finding: >-
          For the prospective (approved) specification, the probe requires
          the following: decision_impact with distinct on_positive and
          on_negative (RB-59); a non-empty input_bindings mapping whose
          path and sha256 entries are committed at source_ref (RB-60); and
          goal_id equal to the queue's goal_id (RB-61). It also requires
          status approved, frozen true, approved_by equal to the approval
          decision, and execution_authorized true. The draft has no
          decision_impact (RB-29), no input_bindings (RB-30), and no goal_id
          inside `experiment` (RB-31).
        ruling: >-
          The NA-3 field map adds these to the canonical review_required
          specification.
          - goal_id comes from the B-1 ruling.
          - decision_impact transcribes the draft's own outcome rows and adds
            nothing to them. on_positive: any G+ routes to a
            review-breakthrough round at max with independent replication,
            and no status change follows from the run set. on_negative: a G0
            cell becomes eligible, after independent review, for a weaken of
            the growth reading over 20-32 bits (empirical_only), never
            reject_scoped. G? and G-INVALID are recorded as rerank inputs and
            no reading.
          - input_bindings lists, with sha256, every archived input the
            contract reads: the P0 inputs, the G-REPRO-C job directories'
            files and the disjointness files (draft
            source_and_input_paths_bound_by_the_packet, inputs half).
          The approval act then sets the approval fields in the prospective
          specification.
      - id: RG-3
        title: the supervised trial model constrains run ids and the run layout
        finding: >-
          The probe and tools/experiment_execution.py impose four
          constraints on every trial. (i) The run id must match
          RUN-<area>-<6 hex> and be unique and random-suffixed (RB-63,
          RB-66); the draft's RUN-PFDR-969aae-<name> form, used 4 times
          (RB-32, RB-33), fails this. (ii) Declared trial artifacts must be
          flat file names with no "/", must exclude the supervisor-generated
          names, and must include manifest.yaml and raw-result.json (RB-64,
          RB-65, RB-67). The generated names are launch.json,
          execution-receipt.json, command.txt, environment.json, stdout.log,
          stderr.log and the check logs. The draft's per_run_data declares
          jobs/ directories (RB-39), and its per_run artifacts include
          command.txt and other generated names as experiment-written files
          (RB-40). (iii) Each trial has an argv and a check_argv that name a
          bound source, and a positive memory_mb. (iv) The trial plan
          carries source_sha256 and input_sha256 maps, each committed at
          source_ref, and the executor task's artifact_paths and the archive
          task's read_scope cover every runs/<rid>/<artifact> path.
        ruling: >-
          This is the concrete content of the draft's B-3. The science is
          unaffected; the run layout must conform. H-1 (NA-4) reports, before
          writing any launcher code that depends on it, how each run's
          outputs map onto the supervised trial model: flat declared
          artifacts, with per-job outputs packaged inside one declared
          artifact per run or written under a declared name. A conformance
          that would change any gate, control, count or blinding rule is a
          stop returned to the Coordinator, never a silent change. The
          approval act mints one RUN-PFDR-<tok> per run (eight) and states
          the layout as an approval ruling (AT-6).
      - id: RG-4
        title: the trial plan, queue and executor handoff are approval-packet previews
        finding: >-
          The trial plan binds the approval decision id, the executor task id
          and the goal queue. The queue binds the goal and the lane. The probe
          reads all four canonical files as previews.
        ruling: >-
          H-1 does not write trial-plan.json, and it leaves the draft's B-2
          write scope. H-1 supplies, in implementation-notes.yaml, each run's
          argv, check_argv, memory_mb and flat artifact list. The approval
          preparation (NA-5) builds the four previews mechanically from those
          entries and the ids minted then.

    blockers_ruled:
      - id: B-1
        title: no goal lane (the goal question)
        ruling: >-
          Verified at source (RB-62): the probe needs
          ledger/goals/<goal_id>/goal.yaml and an open lane within the goal's
          max_concurrent, so goal_id null always fails. PFDR is an ECC area
          (RB-68). A grep of ledger/goals finds no goal naming
          RQ-PFDR-ae2fba, H-PFDR-2765d2, EXP-PFDR-011cd0 or PFDR. The goals
          that mention index calculus own other questions (for example
          GOAL-ICPERF-e6b6a4, which owns RQ-ICPERF-94c86e).
          RULING: B-1 is resolved by OPENING A NEW GOAL whose question_ids
          include RQ-PFDR-ae2fba, by a committed Coordinator act (NA-3 (i)).
          There is one exception: if the census at that act
          (tools/ledger_summary.py; tools/goal_head.py show) finds an
          active goal whose question_ids already include RQ-PFDR-ae2fba, the
          line attaches to that goal. Borrowing a lane from a goal that does
          not own RQ-PFDR-ae2fba is NOT permitted, because it would misstate
          that goal's scope and spend its concurrency.
          The new goal is ECC. It therefore carries campaign_budget
          maximum_batches null and total_wall_clock_seconds null. Its
          max_concurrent is 1, because this line's archives run alone and
          C-1 admits nothing else during its census runs. It states its
          success criterion under AGENTS.md "Every improvement is a success",
          and it is never paused (impediments only). Its lane (BATCH) is
          opened with tools/goal_lanes.py at approval preparation (NA-5), not
          before. The census is run, and origin/main merged in, before the
          goal is created.
      - id: B-2
        title: the experiment scripts do not exist
        ruling: >-
          ACCEPTED, with RG-4's change of scope. H-1 is a pre-approval
          implementation task (policy executor-implementation; a fresh
          session that did not produce EXP-PFDR-011cd0 or EXP-PFDR-0b3699;
          claimed before launch). Its write scope is exactly
          experiments/EXP-PFDR-969aae/run_jobs.py, design_c.py, analyze_c.py,
          reproduce_check.py, fixtures/ and implementation-notes.yaml. It
          writes no specification.yaml (RG-1), no trial-plan.json (RG-4), and
          no engine, test or tools/ file. So it needs no lift of the
          DEC-20261002-c3f49b NA-5 restriction. It runs synthetic fixtures
          only, with zero real-data runs and no census on any curve. Its
          deliverables beyond the scripts and fixtures are:
          (1) the RG-3 conformance report;
          (2) per-run argv, check_argv, memory_mb and flat artifact lists
              (RG-4);
          (3) the package-size model of B-6;
          (4) a read-only G-ID listing (B-4);
          (5) the two pre-data confirmations the draft assigns to the
              implementation: --modes search accepting small_x_offset, and
              where planted_sub's base params are recorded.
          Its snapshot archive H-2 runs alone. The scripts reach main through
          a merge commit before the probe.
      - id: B-3
        title: trial-plan schema
        ruling: Superseded by RG-3 and RG-4, which make it concrete. Nothing is left to the implementation by schema name alone.
      - id: B-4
        title: engine identity on the merged tree
        ruling: >-
          ACCEPTED. G-ID binds at approval preparation, at dispatch and at
          RC-02, on the tree of that moment. The launch-fact commits named in
          the draft (db3b3fe7ed, 714e2ac8a7) are historical; the branch has
          since been fast-forwarded to main ea0652c922. H-1's read-only
          listing gives early warning only. AT-1 fixes the comparison set.
      - id: B-5
        title: execution_state ready after approval
        ruling: ACCEPTED as written (AGENTS.md "Approval is bounded by execution"). A mismatch stops dispatch and needs an additive correction.
      - id: B-6
        title: package-size risk (SS rows retained in full)
        ruling: >-
          Converted into a PRE-FREEZE choice. As written, the design stop
          fires at P0, after approval (RB-17, RB-28), which would cost an
          amendment after approval. Instead, H-1 delivers a modeled package
          size before approval. The model uses file SIZES only (no content)
          of the archived EXP-PFDR-011cd0 R12 and R13 per-job files at the
          same (m, rung), scaled to the planning n and the arm counts. The
          approval act then decides, before freezing, whether to adopt
          design_options_for_the_approval_act.ss_row_retention_fallback
          (AT-5). P0's 2.0 GB design stop stays as the backstop.

    c2_ruling: >-
      ACCEPTED: C-2 is a LATER, SEPARATE experiment, not a phase of
      EXP-PFDR-969aae (RB-19). DF-4 is verified at source:
      H-PFDR-2765d2's test_boundary is "toy (fields <= 32 bits)" and makes no
      statement about N above 32 bits (RB-42, RB-43, RB-35). A C-2 growth
      fit therefore needs a hypothesis-boundary act first. Hypothesis
      records are immutable, so that act is a successor hypothesis or an
      additive boundary record, never an edit. EC-C1 is not implemented
      while C-1 is queued or running, because engine identity must hold for
      C-1. The EC-C1 lift is REQUESTED by the draft and NOT granted (RB-20).
      C-2 is not ranked now. It is revisited when C-1 composes, because
      C-1's outcome decides what C-2 would add.
