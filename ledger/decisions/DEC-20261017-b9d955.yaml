      Exactly TASK-20261017-0576ba reference_table.machine_check_format (the
      DEC-20261010-b662c7 format, which is the DEC-20261008-8cb005 format,
      itself AMD-20261002-236691 protocol_amendment.machine_check_format as
      applied in DEC-20261002-e7f8c9). Paths are repository-relative, and
      file may be a list, with the check applied to each file. Locators are
      yaml: or json: paths with ["..."] literal keys and [N] indices; the
      locator yaml: with an empty path is the document root. Locators may
      also be file or path. A list locator takes a list expected. The checks
      are:
      - equals (type-exact);
      - contains (token in the loaded string; with locator file, in the raw
        file text; expected true);
      - count_equals (locator file; non-overlapping str.count over the whole
        file text);
