  context: >-
    /design-experiment, one contract, for IDEA-20261005-5cbadc. No
    hypothesis and no experiment on origin/main cites that idea. The
    only match for the token on origin/main is a sha256 substring inside
    an unrelated ML-KEM events log. The branch design/ssi-5cbadc-edges
    was created from origin/main at
    3575cc2705c200ffc0c0163c82548ab3335585ce and git merge origin/main
    reported already up to date.

    The named prime is 11. A design-session point-count census found one
    supersingular j-invariant in F_5, one in F_7, and the two
    j-invariants 0 and 1 in F_11. The contract predicts that the internal
    2-isogeny edge set and the cut edge set at that prime have
    cardinalities differing by at least 1. Equality of the two edge sets
    is a negative, and equality of the cardinalities is a negative. No
    kernel was enumerated while writing this decision. No path and no
    exponent change are claimed.

    Protocol completeness: inputs, controls, independent variables, primary
    and secondary metrics, seeds, replication, budget, stopping rules,
    invalidation rules, success criterion, falsification criterion, and
    required artifacts are all non-null. Success is a cardinality gap of
    at least 1 and fails when the cardinalities are equal.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prime, the inequality, and the assignment of each observation to a reading are fixed before any edge enumeration.
    - The minimality census, the supersingular-neighbor test, the unique-pair rule, the loop exclusion, and the second-model check give the comparison a way to come back invalid.
    - Equality of the edge sets can occur, so success can fail.
    - No 2-isogeny was enumerated while writing this decision.

  evidence_refs: []
  limitations:
    - Toy scope only: p = 11. No transfer to a larger prime.
    - The edge sets were not computed in this design. The frozen prediction is the inequality, not a numeral.
    - This decision authorizes a later run. It does not start one.

