    approved_by: null
    reason: This is an archive-history repair, not experiment approval.
  limitations:
    - Historical claim and source-precommit deviations disclosed by CORR-20261011-c310ec remain recorded; ancestry repair does not erase them.
    - Dispatcher acceptance would establish custody/admission only, not D6 instrument validity or an index-calculus result.
    - BATCH-94168f remains a separate open lane; this decision frees no lane until a later terminal decision and closure side file are archived.
  next_actions:
    - Archive this prospective decision before the guarded historical merge.
    - If every gate passes, land the repair PR by merge commit and repeat ancestry and dispatcher checks on main.
    - Write a separate evidence-bound Coordinator closure decision, then archive a BATCH-e261c2.closed.json side file only if terminal task and receipt checks pass.
    - If any gate fails, preserve the failed output, leave the lane open, and choose a separately specified write-once superseding archive route.
