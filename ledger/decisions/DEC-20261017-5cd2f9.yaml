coordinator_decision:
  id: DEC-20261017-5cd2f9
  id_provenance: >-
    Allocated and globally checked free by the parent session with
    tools/allocate_id.py before this Coordinator decision was drafted.
  recorded_at: '2026-10-17'
  decided_at: '2026-10-17'
  decided_by: coordinator
  archived_by: TASK-20261017-942443
  goal_id: GOAL-ICPERF-e6b6a4
  batch_id: BATCH-e261c2
  mode: archive_ancestry_repair
  kind: prospective_custody_repair
  decision: revise
  decision_scope: >-
    Authorize only an isolated, ancestry-preserving merge of the exact D6
    correction snapshot commit d9ce97fd66d68d85bf613a434e7b7259f63f8998
    after this decision has been committed and archived. Retain the current
    main version of dispatch_queue.correction.json at the sole expected add/add
    conflict. Preserve the historical commit, its seven bound paths and its
    receipt unchanged. This decision neither closes BATCH-e261c2 nor changes
    any hypothesis, experiment or goal status, approves a protocol, or
    authorizes a scientific trial.
  target_ids:
    - GOAL-ICPERF-e6b6a4
    - BATCH-e261c2
    - TASK-20261011-c65ff7
    - EXP-ICPERF-104054
  context: >-
    The D6 correction queue declares TASK-20261011-c65ff7 completed with
    binding_mode content_at_commit, but research_dispatch.py refuses its
    archive because d9ce97fd66d68d85bf613a434e7b7259f63f8998 is not
    an ancestor of current main. PR #2084's one-parent integration did not
    preserve that source commit in main ancestry. The archived correction
    queue was intentionally revised after its snapshot to add the actual
    commit and receipt binding. A read-only comparison in the isolated
    worktree found the current queue digest below, while the other six
    historical paths still match their declared digests. The reported dry-run
    merge-tree has one add/add conflict on that queue path; the actual merge
    must be inspected afresh before any commit.
  selected_route:
    historical_archive_commit: d9ce97fd66d68d85bf613a434e7b7259f63f8998
    historical_first_parent: 1d1504c16c5d186505e4fc5527b0aafa7ff0c854
    binding_mode: content_at_commit
    source_branch_scope: merge the exact commit, not an unreviewed branch tip
    base: fresh origin/main in a clean isolated worktree
    merge_method: true two-parent merge commit; no squash, rebase or cherry-pick
    conflict_resolution: >-
      For the single expected add/add conflict at
      coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-e261c2/dispatch_queue.correction.json,
      retain the current main bytes with SHA-256
      2033d4eee69b01752a6658550b61ef4f57524a615371e2a6812f76aaf5e61e55.
      Do not edit the historical commit's tree, the current queue, or its
      receipt. A merge result with any other conflict or changed frozen path
      is outside this authorization.
    historical_paths_sha256:
      coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-e261c2/archives/TASK-20261011-c65ff7/snapshot-receipt.json: af20de9182794d1797ff95588ede833e3c74858325a00bae74c125a078bbce3d
      coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-e261c2/dispatch_queue.correction.json: 93b94e38c6d823a3ee5b4836df182c6e2bc1b5b10508478fbdd25ea33e993a44
      coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-e261c2/dispatch_queue.post_snapshot.json: b36a5abdfbbc67b850fcd4c91a3c51c2e0fc12141b81c819aaa66ae99ea405d6
      ledger/corrections/CORR-20261011-c310ec.yaml: c3a43217635d9f2ff2fbbf0c876eebad5303736084df199d2924052c14241bc7
      ledger/decisions/DEC-20261011-5d5428.yaml: 7562386d594ad762cccb8776d29a6b94bca4ff8b17e3fb7b60f05d1bfe644660
      ledger/handoffs/TASK-20261011-904a16.yaml: 581f3c650899e42edfd1b8ce9807267ea6a89fc61c412e74b78ba58cb4fc77d1
      ledger/handoffs/TASK-20261011-c65ff7.yaml: 262c51574dd127c03d1c5b361e65c5c2e086d5731ce443b653caa02554fa69ef
  rationale:
    - >-
      A true merge makes the exact recorded archive commit reachable while
      content_at_commit continues to verify the original seven bytes in that
      commit. Merely copying the files, cherry-picking, or substituting a new
      archive SHA would not repair this historical binding.
    - >-
      Retaining main's postcommit correction queue preserves its operational
      archive.commit_sha and receipt-hash revision. Its current digest is not
      expected to equal the queue blob in the older archive commit.
    - >-
      This route is narrower than a superseding archive: it keeps the
      write-once receipt, queue and record IDs intact and permits the existing
      dispatcher to perform its full first-parent, path-hash and commit-ID
      checks after ancestry is restored.
  pre_merge_gates:
    - This decision is committed and archived on the isolated repair branch before the historical merge begins.
    - The worktree is clean at a freshly fetched origin/main base; the old commit object and its declared first parent resolve.
    - The seven historical paths and SHA-256 values above are independently checked at the old commit, including the unchanged receipt.
    - The current queue and receipt hashes match the values above before conflict resolution.
    - The proposed merge has exactly the one expected add/add queue conflict and no unrelated changes.
  abort_conditions:
    - A historical commit, parent, path hash, receipt, or required commit-message ID fails verification.
    - Any conflict other than the declared queue path appears, or retaining main's queue bytes is impossible without changing another frozen path.
    - The merge would introduce unrelated files, alter scientific inputs, or require editing an immutable record.
    - The resulting commit does not have the old archive commit as an ancestor, or the PR cannot land by a true merge commit that preserves that ancestry on main.
    - research_dispatch.py reports any archive, content, claim or queue refusal after the merge; leave the lane open and record the exact refusal.
  acceptance_checks:
    - >-
      On the repair branch and again on the final main history,
      git merge-base --is-ancestor
      d9ce97fd66d68d85bf613a434e7b7259f63f8998 HEAD exits zero.
    - >-
      The current correction queue still has SHA-256
      2033d4eee69b01752a6658550b61ef4f57524a615371e2a6812f76aaf5e61e55,
      and the historical receipt still has SHA-256
      af20de9182794d1797ff95588ede833e3c74858325a00bae74c125a078bbce3d.
    - >-
      python3 tools/research_dispatch.py
      coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-e261c2/dispatch_queue.correction.json
      --ready-only --claims refs exits zero without an archive or content
      binding refusal. An empty ready-task list is expected because both
      correction tasks are recorded completed.
    - >-
      Independently recheck the correction queue's completed task states,
      TASK-20261011-c65ff7 completed claim release, both snapshot receipts,
      and goal-lane state before any later closure decision.
  evidence_refs:
    - CORR-20261011-c310ec
    - DEC-20261011-5d5428
    - TASK-20261011-c65ff7
  citations:
