    - {source: coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-e261c2/dispatch_queue.correction.json, provenance: internal, verified_by: coordinator}
    - {source: coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-e261c2/archives/TASK-20261011-c65ff7/snapshot-receipt.json, provenance: internal, verified_by: coordinator}
  official_transitions: {}
  knowledge_promotion:
