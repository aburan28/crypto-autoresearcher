coordinator_decision:
  id: DEC-20260830-509678
  context: >-
    This Coordinator decision composes the independent Validator (J1) and
    Red Team (J2) reviews of EXP-MONO-2a13d7's execution: an exhaustive,
    toy-scale (p in {101,211}), exact-arithmetic census testing
    H-MONO-0f9170's claim that seven Frobenius-stratum counts of the m=3
    symmetric-base Semaev cover are exact integer functions of (p,t,Z)
    alone. It also discloses a fourth out-of-band edit incident and a
    manifest schema correction (both already disclosed in the batch's
    snapshot receipt) and names a concrete, cheap follow-up the review
    surfaced.
  decision: support
  decision_label: >-
    p_t_z_completeness_claim_supported_toy_scale_named_control_strength_limitation
  target_ids:
    - H-MONO-0f9170
    - EXP-MONO-2a13d7
    - RQ-MONO-001
    - EV-MONO-d90e9c
    - H-MONO-0b3def
    - EXP-MONO-4c7479
    - IDEA-20260830-9761f0
    - KN-FIND-a8990a
  rationale:
    - >-
      CLAIM SUPPORTED, INDEPENDENTLY RE-DERIVED. Both reviewers
      independently re-derived the seven closed forms from scratch
      (algebraically, and in the Validator's case also via a
      structurally-different O(p^2) brute-force implementation) and
      confirmed R1=0, R3 exact, and baseline reproduction exact, at every
      one of 18 panel curves across both primes, both runs (bit-identical,
      confirming full determinism as this contract requires). The
      Validator's independent implementation rules out a shared-bug
      explanation for the clean pass; the Red Team's proves-too-much and
      known-false-object controls confirm the verification method has
      genuine discriminating power rather than being vacuously permissive.
    - >-
      NOVELTY CORRECTLY CALIBRATED. Per the Red Team's explicit
      characterization: this is a legitimate, low-novelty extension of
      KN-FIND-a8990a's already-proven Theorem B (the case-A counts are a
      near-mechanical corollary; the case-B counts are genuinely new
      relative to Theorem B's stated setup but still a mechanical
      derivation), not a surprising new phenomenon. Recorded plainly so
      the evidence is neither overclaimed nor undersold.
    - >-
      NAMED LIMITATION: THE NON-VACUITY CONTROL'S STRONG FORM WAS NOT
      EXERCISED. The matched-pair test passed non-vacuity via j-invariant
      difference only, at both primes; the stronger order-3-point-count
      criterion H-MONO-0f9170's own proof_search_map names as the
      informative confounder-control never fired. At p=101 this was
      structurally unavoidable (the Red Team proved, independently of any
      code, that order-3 count is forced by Cauchy's theorem at every one
      of that prime's 51 populated (t,Z) cells). At p=211, 7 of 74
      populated cells DO have order-3-count freedom, but the frozen
      contract's own deterministic tie-break rule (preferring a
      Z-coverage-touching cell) selected outside them. This is a design
      limitation in the FROZEN CONTRACT's own selection rule, not an
      implementation defect and not a falsifier: j-difference alone is
      independently sufficient to rule out the one vacuity failure mode
      H-MONO-0f9170's own confounders list names (two isomorphic curves
      being mistaken for a genuine pair), so the control is genuinely
      non-vacuous, just weaker than its strongest available form.
    - >-
      WHY THIS IS NOT REPAIRED IN PLACE. A cheap fix exists using
      ALREADY-COMPUTED data from this same run: re-select the p=211
      matched pair from one of the 7 already-identified order3-varying
      cells (e.g. t=-13, Z=0, named explicitly by the Red Team) and report
      R2 on that pair. This is NOT performed by this decision because the
      frozen contract's own `invalidation_rules` require a versioned
      protocol amendment for any post-hoc change to a pre-registered
      tie-break rule after Stage-1 numbers have already been observed --
      re-selecting silently now would violate exactly the discipline this
      program's frozen-contract regime exists to enforce. It is instead
      named as a concrete next action.
    - >-
      DISPOSITION. H-MONO-0f9170's status moves to `supported`, scoped
      exactly to p in {101,211}, m=3, and the 18 tested panel curves,
      carrying the named non-vacuity-strength limitation explicitly (not
      silently). This does not touch H-MONO-0b3def (already `supported`
      from the sibling experiment) or any other record.
    - >-
      GOVERNANCE FINDINGS CARRIED FORWARD, NOT RE-LITIGATED HERE. The
      fourth out-of-band "Cursor Agent" edit and the manifest schema
      correction are both fully disclosed in
      coordination/tasks/TASK-20260830-832479/snapshot-receipt.json and
      summarized in EV-MONO-d90e9c; this decision does not restate them in
      full but confirms neither affected the archived scientific result
      (the Executor's run predates the edit and used its own
      independently-fixed code; the manifest correction was a lossless
      structural remapping with no value changed).
  evidence_refs:
    - EV-MONO-d90e9c
    - experiments/EXP-MONO-2a13d7/execution_report.yaml
    - experiments/EXP-MONO-2a13d7/reviews/validator/validation-report.yaml
    - experiments/EXP-MONO-2a13d7/reviews/red-team/red-team-report.yaml
    - coordination/tasks/TASK-20260830-832479/snapshot-receipt.json
    - knowledge/findings/KN-FIND-a8990a.md
  official_status_changes:
    goal_status_changed: false
    goal_status_after: paused
    hypothesis_status_changes:
      - hypothesis_id: H-MONO-0f9170
        prior_status: proposed
        new_status: supported
        scope: >-
          Scoped exactly to m=3, p in {101,211}, the 18 tested panel
          curves. The non-vacuity control's strong form was not exercised
          (named limitation, not a falsifier); a cheap follow-up is named
          as future work, not performed here.
    experiment_status_changes:
      - experiment_id: EXP-MONO-2a13d7
        prior_status: approved
        new_status: completed
    resource_disposition_changed: false
    completion_criteria_met: []
    completion_criteria_note: >-
      RQ-MONO-001 and GOAL-MONO-001 are not closed or advanced by this
      decision; it resolves one hypothesis at toy scale only.
    implementation_authorized: false
    experiment_runs_authorized: 0
    scientific_interpretation_authorized: true
    scientific_interpretation_scope: >-
      Exactly the scoped support stated above; no ECDLP, relation-rate, or
      m>=4 claim.
    closure_authorized: false
    breakthrough_authorized: false
  disclosed_open_items:
    - id: NON-VACUITY-STRONG-FORM-FOLLOWUP
      description: >-
        Re-select the p=211 matched pair from one of the 7 already-
        identified order3-count-varying (t,Z) cells (e.g. t=-13, Z=0,
        named by the Red Team) using data already computed in
        RUN-MONO-2a13d7-1/RUN-MONO-2a13d7-2's curve_invariant_table.csv,
        and run Stage 1's classification on that pair to report R2 on a
        genuinely order3-differing pair -- the strong form of the
        non-vacuity control H-MONO-0f9170's proof_search_map calls for.
      carried_forward_to: >-
        A versioned protocol_amendment to EXP-MONO-2a13d7 (reusing
        already-computed Stage-0 data, requiring only a fresh Stage-1
        census on the 2 newly-selected curves, cheap) or a small successor
        experiment; either is future work, not performed by this decision.
      does_not_block: H-MONO-0f9170's supported status at its current scope
    - id: PANEL-ELIGIBILITY-FILTER-GAP
      description: >-
        The Validator's Finding F1: the current (post-out-of-band-edit)
        specification text's panel-eligibility filter excludes A=0
        (j=1728) and B=0 (j=0) explicitly but has no explicit t=0
        (supersingular) check, though H-MONO-0f9170's own curve_panel_note
        intends to exclude CM curves generally. Did not affect this run
        (no supersingular curve came close to selection at either tested
        prime, independently verified).
      carried_forward_to: >-
        Any future amendment or successor experiment to EXP-MONO-2a13d7
        should add an explicit t!=0 check to the panel-eligibility filter.
      does_not_block: this decision's disposition
  procedure_deviations: []
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      A low-novelty, mechanical extension of an already-committed result
      (KN-FIND-a8990a Theorem B), per the Red Team's own characterization;
      no durable new finding independent of the already-curated corpus
      entry is created. The case-B (inert-base) counts are the one
      genuinely new component and may warrant a brief addendum to
      KN-FIND-a8990a in a future /curate-knowledge pass, but that is
      deferred rather than authored inline here.
  limitations:
    - >-
      Toy scale only. No claim about cryptographic-scale p, m>=4, or
      relation rates.
    - >-
      The non-vacuity control's strong form remains unexercised at the
      time of this decision; see `disclosed_open_items`.
    - >-
      Both reviewers disclose an unresolved model-identity discrepancy
      (self-reported claude-sonnet-5 vs. this environment's static
      adapter resolution of anthropic:claude-opus-5), neither
      probe-verified. Not resolved by this decision.
  inference:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
    amazon_bedrock_selected_configured_probed_contacted_or_used: false
  decided_by: coordinator
  decided_at: '2026-08-30'
