coordinator_decision:
  id: DEC-20260805-af8565

  context: >-
    Close of GOAL-AES-003 BATCH-015 (opened as RANK 1 by
    DEC-20260805-b42d5c on the BATCH-014 checkpoint, promoted from
    explicitly deferred per the goal record's next_action). BATCH-015's
    rank-1 item was the cipher-substitution comparison with an
    O(1)-memory-per-query construction that APPROXIMATES an ideal random
    permutation -- the instrument the campaign designated decisive for the
    cipher-substitution mechanism question that BATCH-009's central claim
    left without independent-instrument corroboration in either direction.

    The producer (TASK-20260805-d408ac, snapshot-archived 10127906c) built
    the construction (16-round balanced Feistel, SipRound-based round
    function, fresh random 128-bit key per trial, direct evaluation),
    reached the decisive exposure with no shortfall (2^30 matched both arms
    plus 2^33 on the substitute; live AES arm reproduced BATCH-009's frozen
    P1-R5-PAIR reading byte-exactly), and applied the preregistered rule:
    OUTCOME-A'' on both comparisons -- the excess STAYS ABSENT. The
    independent validator (TASK-20260805-849a4a) returned PASS with zero
    decision-relevant disagreement under fully blind re-derivation. The
    reviewed package is converted by this archive into EV-AES-4ba350 and
    this decision.

  decision: close_batch

  decision_scope: >-
    THIS DECISION CLOSES BATCH-015, RECORDS ITS EVIDENCE, AND NAMES THE
    NEXT ACTION.

    It moves NO hypothesis (RQ-AES-003 carries none for this record; the
    documented-null allowance of CORR-20260802-009 applies). It promotes NO
    knowledge entry. It makes NO claim beyond EV-AES-4ba350's stated toy
    tier and boundaries, and NO comparison to published cryptanalysis in
    either direction. It asserts nothing about full-round or deployed AES.

  target_ids:
    - GOAL-AES-003
    - RQ-AES-003
    - BATCH-015
    - BATCH-014
    - BATCH-b41ba9
    - EV-AES-4ba350
    - EV-AES-e4c091
    - EV-AES-dec938
    - EV-AES-048545
    - TASK-20260805-d408ac
    - TASK-20260805-849a4a

  rationale:
    - >-
      BATCH-015's single rank-1 item ran to completion at the decisive
      exposure the campaign defined for it, with the producer's numbers
      blindly re-derived by the independent validator and every validity
      property the comparison depends on (independence, fresh-key-per-trial,
      O(1) memory, closeness-to-ideal as labeled working assumption)
      confirmed. The batch has no outstanding research debt.
    - >-
      The result corroborates BATCH-009's null-object exclusion with the
      strongest substitute yet: the first to combine perm128's
      per-trial-fresh-permutation semantics with direct evaluation
      (BATCH-012 proved perm128's pair-storage architecture can never reach
      this exposure) and with a statistical-quality argument verified
      robust to the exact form of its recalled citations.
    - >-
      Across the three substitute classes now tested (stored ideal table,
      deterministic non-ideal PRP, fresh-key ideal-approximating O(1)), the
      excess is absent every time at or above decisive exposure, while
      BATCH-b41ba9's affine-only-S-box arm reproduces it at maximal rate --
      the signal lives in the SPN round geometry operating on AES's actual
      round content, at toy tier. That composed reading is recorded as
      EV-AES-4ba350 OBS-B15-7, a scope statement, not a mechanism theorem.

  next_action_for_BATCH_016: >-
    OPEN BATCH-016 WITH THE TWO NAMED RC-D CLASS-EXTENSION FOLLOW-ONS AS
    RANK 1 (both named in the goal record since BATCH-014 as "named but not
    ranked ahead of rank 1" -- the rank-1 item they waited behind is now
    done): (i) a decay check varying rc8probe_feistel's round count, and
    (ii) a second key/seed for the same construction -- extending
    EV-AES-dec938's single-instance finding toward a class-level claim for
    the structured non-ideal substitute family, the cheapest remaining
    lever on the substitution question. RANK 2: schedule BATCH-713991's
    still-outstanding integrity debt (item (b) of the goal's second-merge
    addendum: the RANK-1 stamp-gap supersession and the verified
    ledger-archive commit for TASK-20260804-0e75d5, per DEC-20260804-73977c
    D-7/D-8's dual-device repair) so that batch's S-box finding becomes
    citable as official evidence. Any NEW mechanism lever on where the
    excess lives (beyond substitution-class exclusion and affine-geometry
    reproduction) requires a fresh idea-generation round with falsifiable
    proposals, not ad-hoc improvisation -- the three-class exclusion plus
    the affine reproduction have narrowed but not resolved the mechanism
    question, and the inventor protocol binds the search to named mechanisms
    with predictions and falsification criteria.

  evidence_refs:
    - id: EV-AES-4ba350
      role: this_batch_evidence_record_created_by_this_archive
    - id: EV-AES-e4c091
      role: comparator_anchor_and_first_substitute_class
    - id: EV-AES-dec938
      role: second_substitute_class_precedent
    - id: EV-AES-048545
      role: affine_arm_composed_reading_cited_not_reinterpreted

  evidence_refs_note: >-
    EV-AES-048545 is cited for the composed reading in OBS-B15-7 and is not
    re-run or re-interpreted here. All producer numbers cited above rest on
    the validator's blind re-derivation, not on the producer's self-report.

  limitations:
    - >-
      Single-instance moderation applies exactly as written in
      EV-AES-4ba350 strength_basis; the class-level claim for the
      ideal-approximating family is NOT established by this batch.
    - >-
      The recalled citations underlying the idealness bound remain unopened
      pointers (AGENTS.md rule 9); OBS-B15-5's robustness argument is the
      standing basis, disclosed in the evidence record.
    - >-
      One resolved model served every role this batch under the zai-outage
      amendment DEC-20260831-0d1eeb; session/implementation independence
      was preserved, model independence was not, and no multi-model quorum
      is claimed or needed at this claim tier.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED at this time. The three-class exclusion pattern
      (OBS-B15-7) is approaching a durable technique-level finding, but a
      class-level claim for the ideal-approximating family needs at least
      one differently-constructed second instance before promotion; the
      BATCH-016 rank-1 follow-ons are the cheapest route toward that.

  decided_by: coordinator
  decided_at: '2026-08-31'

  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
