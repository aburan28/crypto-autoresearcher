coordinator_decision:
  id: DEC-20260806-26c0e8
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-73cd92
  recorded_by_task: TASK-20260806-001
  archived_by: TASK-20260806-001
  supercedes_records: [DEC-20260805-364e9e, DEC-20260805-48b52e,
        DEC-20260805-d4b182]
  context: >-
    Gate-review of EXP-MTBK-306bdb v0 → v1 (AMEND-001) after the BATCH-124
    smoke pass. An analytical + toy-probe review found that the rescue-window
    prediction (regime (ii), DEC-20260805-364e9e/48b52e) is structurally
    unreachable, and the measured channel ratios contradict the sweep-based
    unreachable, and the measured channel ratios contradict the sweep-based
    speedup the protocol assumed.

  decision: approve_amendment_and_supersede_claim
  target_ids: [GOAL-ECDLP-001, EXP-MTBK-306bdb, H-MTBK-001]
  target_ids_basis: >-
    The decision acts on the EXP-MTBK-306bdb protocol object (AMEND-001),
    supersedes the rescue-window prediction carried in prior DECs, and scopes
    H-MTBK-001's claimed mechanism to the corrected falsifiable ratio. No
    hypothesis status transition is made; H-MTBK-001 remains 'proposed'.

  findings:
    - id: F1
      claim: corridor-emptiness
      statement: >-
        No (B,m) cell at N in {64, 10^3, 1e5, 5.2e4, 1e9}, m in {3,4,5} admits
        both decomposability (B >= N^(1/m)) and a BKK rescue window
        (1 <= B^(m-1)/sqrt(N) and beta*(B/2)^(m-1) < sqrt(N)). The window
        exists only if N < ((m+1)/2)^(2m/(m-2)) <= 64 (m=3), 39 (m=4),
        39 (m=5). Proven by extrusion, verified numerically.
      evidence: AMEND-001 probe_details.corridor_emptiness + numeric trans.
    - id: F2
      claim: geometric-cost dominance
      statement: |-
        Per-target first-success descent cost measured at ~N/B (mean std 149,
        bkk 123 checks on p=52721/12 targets vs N/B=228, sweep B^2=52900).
        Relation collection to 40 rels: std 4251 vs bkk 3856 checks, ratio
        1.10x, NOT the 4x domain ratio. BKK yields ~1.0-1.8x in both channels
        at the planned sizes, not (m+1)/2 or 2^(m-1).
      evidence: contradiction analysis + cell-grid run (RUN-MTBK-cellgrid).
    - id: F3
      claim: rescue-claim-unfalsifiable
      statement: |-
        Because the corridor is empty and the geometric model collapses both
        K* to ~1-2 targets (or both to inf), the claim "K*(std) infinite,
        K*(BKK) finite" cannot be observed at any planned (curve,b,m) cell.
        Removed from testable scope (per AMEND-001).
      evidence: AMEND-001 + corridor derivation.

  decisions:
    - id: D1
      subject: EXP-MTBK-306bdb protocol
      action: approve_amendment
      detail: >-
        AMEND-001 approved: rescue-window (regime (ii)) REMOVED from testable
        claim; falsifiable quantity re-cast as the measured full-check ratio
        against 2^(m-1). Method-observation only; no hypothesis transition
        (H-MTBK-001 stays Proposed). Executor full dataset MAY proceed only
        under v1 protocol.
    - id: D2
      subject: correction-of-claim
      action: supersede
      detail: >-
        The rescue-window prediction in DEC-2023-384e9e / 48b52e / d4b182
        (BKK rescues infinite-K* instances) is SUPERSEDED by the corridor
        emptiness. The multi-target crossover K*(BKK) is unreachable for the
        naive ordered-enumeration descent at toy sizes; the measured gain in
        both channels is ~1.0-1.8x (not (m+1)/2).
    - id: D3
      subject: provenance
      action: disclosed
      detail: >-
        Given the parallel session's uncommitted EXP-MTBK changes (b={0.6,0.7}
        spec and a full-pipeline execution report) NOT under this batch's
        authorship, this batch owns only AMEND-001, the probes, and the
        corrected cell-grid run (RUN-MTBK-306bdb-cellgrid). The parallel
        artifacts are preserved untouched for the owning session.

  decision_scope: >-
    Within GOAL-ECDLP-001 / H-MTBK-001. Amends the EXP-MTBK contract object.
    No official hypothesis-status transition (the [declared] H-MTBK-001 stays
    Proposed). Does NOT touch the BKK index theorem (KN-FIND-c7d31e/982fdf) -
    that remains correct as a combinatorial statement about order-statistics
    under exhaustive sweeps; it is the spent-parameter statement that fails.

  exact_next_action: >-
    BATCH-74+ (next batch): (a) record the corrected cell-grid run artifacts
    (RUN-MTBK-306bdb-cellgrid, AMEND-001, analysis.md) in a snapshot + ledger
    commit; (b) dispatch an INDEPENDENT review on the corridor-emptiness and
    geometric-model claim (prop, RED TEAM), (c) integrate the parallel
    b={0.6,0.7} spec pipeline evidence when its owning session merges it -
    and reconcile the two EXP-MTBK volumes (their pipeline manifests vs this
    batch's corrected v1 grid) under ONE canonical protocol version.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      The corridor-emptiness result and the geometric-cost model correction are
      behavior-claims that need an INDEPENDENT review pass before any KN-FIND
      promotion (exact_next_action (b)). Owning the promotion now would assert
      corpus standing the review might change. Deferred to that batch.
  pareto_integrity:
    dominated_by: Pollard rho family (multi-target) at exponent 1/2
    sota_delta: none
  claim_ceiling: corrected (rescue-window overreach replaced by testable ratio)
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-06'