  standing_authorization: >-
    AGENTS.md standing user authorization (user instruction, 2026-09-06:
    "all is approved. ideas/experiments should be always approved")
    would be the user-approval basis for a complete runnable protocol.
    It is not applied here. The missing driver is a program that
    enumerates the non-2-torsion affine points of y^2 = x^3 + 1 and
    y^2 = x^3 + x + 1 over F_13, lifts x and y into {0, 1, ..., 12},
    writes the doubling slope over Q in lowest terms, and reports
    13 * H(E_cm) - H(E_gen) with one group-law check on each model.
    The contract cannot report execution_state ready. A run-aware
    count on origin/main gives GOAL-ENDO-001 approved_unrun=2 against
    cap 3, so check_approval_capacity would not be the rejecting
    check. This decision does not assert that the gap is at least 0,
    does not assert that it is strictly negative, and does not rewrite
    IDEA-20261006-9deda5.

  decision: revise
  decision_label: >-
    Specify H-CANL-b9033d and leave EXP-CANL-5b859e at
