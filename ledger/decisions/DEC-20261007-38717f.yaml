  context: >-
    One cycle of design-experiment plus propose-ideas.
    IDEA-20261006-9deda5 is on origin/design/volc-b4c2bf-root and is
    not on origin/main. The question is RQ-CANL-63098f. No hypothesis
    or experiment on origin/main cites that full idea id. The branch
    design/canl-9deda5 was created from origin/main at
    8237815ee1d85844924a5b08950d326955fff924. The copied proposal
    bytes are blob f7ba500c552867a83c6cae4b1d1bc5fedb4c5e4e and parsed
    as YAML without a quote change. The prediction is
    13 * H(E_cm) >= H(E_gen). A strictly smaller left side is the
    concrete negative.

    A run-aware count on origin/main, using the first top-level
    status and goal_id in each specification that names
    GOAL-ENDO-001, together with git ls-tree of experiments/*/runs
    and ignoring .gitkeep, gives 10 approved contracts and
    approved_unrun=2. The two with no run are EXP-TORS-77e641 and
    EXP-VOLC-3fee23. The cap in tools/portfolio_kpis.py is 3, so
    headroom is 1. check_approval_capacity would not reject an
    approving decision. This decision does not name any contract
    under supersedes_experiments or withdraws_experiments. The
    working tree omits experiment run trees, so portfolio_kpis.py
    --capacity on that tree is not the figure used here.

    The missing driver is the F_13 denominator comparison.
    harness/run_canl.py fits log-log slopes of a canonical-height
    lift ratio and does not form lambda = (3x^2 + A) / (2y) over Q.
    A search of origin/main for the phrases "H_cm" and
    "point_count_cm" under *.py and *.sage returned no path.
    There is no trial-plan.json. The only file under runs/ is
    .gitkeep.

    Success is the source idea's prediction. The concrete negative
    is 13 * H(E_cm) strictly less than H(E_gen), with both maxima
    defined and the group-law, j-invariant, and ordinary checks
    passed. No slope was computed in this session. The same pass
    files IDEA-20261007-1f3eaf, IDEA-20261007-7892fa, and
    IDEA-20261007-6c65b7 and does not design them. Proposals on
    origin/main and the idea files on pull requests 1972 and 1971
    were read before those three claims were written. The
    idea-generator was not dispatched. The coordinator wrote the
    three records in this pass.

  rationale:
    - The standing authorization covers a complete runnable protocol. This one has no doubling-slope denominator comparison, so it is not approved.
    - check_approval_capacity would not reject an approving decision. GOAL-ENDO-001 has approved_unrun=2 against cap 3. This decision names that check and does not force approved, because the driver is missing.
    - The missing driver is the F_13 comparison of the largest absolute doubling denominators of y^2 = x^3 + 1 and y^2 = x^3 + x + 1, including one group-law check on each model. No program on origin/main evaluates that gap.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - A strictly negative gap, with the checks passed, is reachable as a recorded outcome, so success is not automatic.
    - A group-law match, two defined maxima, j(E_gen) outside {0, 1728}, and the ordinary nonsingular check are the controls.
    - An undefined maximum is not relabeled as a strictly negative gap.
    - This session did not compute a slope and did not claim that the exponent 1/2 moves.
    - No run id was minted. The replication plan does not name a future run slot while the trial plan is unfrozen.

  evidence_refs: []
  limitations:
    - The measurement, once run, covers p = 13 and these two models only. It does not transfer to another prime or to a canonical lift.
    - A gap of at least 0 does not lower the generic-group exponent and is not a Néron-Tate height.
    - An undefined H and a crash are not the negative.
    - This decision does not authorize execution.
    - This decision does not edit a goal head.
    - The three new proposals are not hypotheses and are not approved experiments.

  next_actions:
