  recorded_at: '2026-09-13'
  recorded_under_task: TASK-20260913-e41247
  goal_id: GOAL-ECRANK-002
  question_id: RQ-ECRANK-27dcc5
  decision: approve
  target_ids:
  - EXP-ECRANK-b23a5e
  - H-ECRANK-7f0ec1
  - IDEA-20260829-c7472b
  context: >
    Proposal selection was made by the orchestrating session, not
    re-litigated here: IDEA-20260829-c7472b is the only well-developed
    unconverted proposal on RQ-ECRANK-27dcc5, per
    `python3 tools/audit_proposal_backlog.py --question RQ-ECRANK-27dcc5
    --list` scanning all branch tips. The proposal audits whether this
    program's own flagship rank-exactness claim (EV-ECQ-0d142e OBS-3,
    "rank E(Q) is EXACTLY 12" from PARI ellrank's "unconditional" upper
    bound) is secretly GRH-conditional through the class-group
    computation ellrank performs internally -- a controls-before-belief
    integrity check of this program's own strongest existing claim over
    Q, directly in the spirit of AGENTS.md's inventor protocol and
    docs/target-result-profile.md's honesty requirements. This decision
    converts the proposal into hypothesis H-ECRANK-7f0ec1, freezes and
    approves experiment contract EXP-ECRANK-b23a5e, and hands both to the
    executor as TASK-20260913-e41247, under the standing user
    authorization of 2026-09-06 ("all is approved. ideas/experiments
    should be always approved") -- no per-experiment user confirmation is
    requested.
  title: >
    Approve the frozen first contract EXP-ECRANK-b23a5e (trust-surface
    audit + GRH/bnfcertify audit of ellrank's rank-12 upper bound +
    conformance suite; converts IDEA-20260829-c7472b under H-ECRANK-7f0ec1),
    and hand it to the executor as TASK-20260913-e41247.
  binding:
    hypothesis_file: ledger/hypotheses/H-ECRANK-7f0ec1.yaml
    specification_file: experiments/EXP-ECRANK-b23a5e/specification.yaml
    handoff_file: ledger/handoffs/TASK-20260913-e41247.yaml
    sha256_note: >
      Byte hashes are recorded by the Coordinator's snapshot-archive task
      at commit time (this decision is authored before that commit, per
      the design-experiment skill's step ordering: design, then approve,
      then snapshot-archive). The gate-field flip performed on
      specification.yaml between its first draft and this approval
      changed ONLY status, approved_by, and approval_note; every
      protocol field (objective, inputs, controls, independent
      variables, metrics, heuristics, preregistered_prediction,
      sample_size_derivation, scale_relevance, tail_checks, replication,
      budget, stopping/invalidation rules, success/falsification
      criteria, required_artifacts) is untouched between the two writes.
  rationale:
  - >
    PROTOCOL COMPLETENESS CHECKED BEFORE THIS APPROVAL, field by field
    against experiments/EXP-ECRANK-b23a5e/specification.yaml: objective
    (decidable, both branches of M-A/P1 stated as first-class outcomes);
    inputs (frozen 9-rung enumeration naming every source record, a
    classification rule fixed before the audit, the named
    ellrank/bnfcertify procedure on the exact rank-12 curve, the
    discriminant ladder and HA-2 survey samples, the frozen 13-item
    conformance suite); controls CTL-1 through CTL-5 (classifier
    separation, GRH baseline, seeded-fault suite, producer-state trap,
    budget symmetry) each with an invalidation clause; independent
    variables; primary metrics (trust_surface_table, grh_audit_result,
    certifiability_horizon, conformance_detection_rate) and secondary
    metrics (HA-2 survey, per-field cost ledger, missing-schema-field
    list, labeller agreement log); heuristic_under_test naming HA-1,
    HA-2, HA-3, each stated exactly with rigorous-plus-classical
    justification (Minkowski/Bach/Landau/Cohen-Lenstra for HA-1, the
    curve-discriminant bound plus Hardy-Ramanujan/Erdos-Kac for HA-2, the
    proven soundness-lemma half for HA-3) and an obstruction declared for
    each; the preregistered_prediction (P1-P4 transcribed verbatim from
    the proposal through the hypothesis into the contract, unweakened,
    with P1's "unconditional, certified" branch stated explicitly as a
    real, welcome, first-class outcome and NOT a failure); sample_size_derivation
    (R1: 9 rungs x 2 labellers; R2: >=22 fields x 2 budgets plus a
    ~340-curve survey; R3: 13 fault trials); scale_relevance (tier
    `toy`, honestly stated as sub-cryptographic -- a single named
    discriminant, not a security parameter); tail_checks (HA-1's
    largest-certified/smallest-timeout overlap check, HA-2's rank-12-curve
    tail placement, HA-3's mandatory real-fault detection, CTL-1's joint
    pass/fail); replication (seeds none, deterministic by construction;
    independent_instances recorded at the 9-rung level with R2/R3 sample
    counts stated separately); budget (3 runs; R2's own worst-case
    ~144,000 s / ~40 CPU-hours stated as the binding per-run cap with an
    explicit derivation, since EXP-ECRANK-52d039's 10,800 s precedent
    does not fit R2's stated cost; 8 GB; 1 worker, since bnfcertify does
    not parallelize usefully per the proposal); stopping rules and
    invalidation rules (a bnfcertify timeout or a missing PARI/cypari
    environment is `failed_infrastructure`/`invalid_measurement` for the
    affected scope only, never a mathematical result, per AGENTS.md rule
    3); success_criterion and falsification_criterion, both decidable
    from the predefined metrics, with every negative branch (classifier
    separation failure, P1's vindicating branch, P2's horizon-exceeds-60
    branch, P4's sub-11/12 branch, total bnfcertify failure) recorded as
    a FIRST-CLASS SUCCESS of the decision rather than a failure of the
    experiment; and required_artifacts (the trust-surface table, the
    per-field bnfcertify/discriminant table and fitted horizon, the
    frozen witness schema plus independent verifier plus detection
    table, execution-report.yaml, implementation.md). No field checked
    was null.
  - >
    NOTHING IS WEAKENED FROM THE PROPOSAL. The five controls
    (classifier separation, GRH baseline, seeded-fault suite,
    producer-state trap, budget symmetry), the three heuristics
    (HA-1/HA-2/HA-3 with their rigorous_support and validation_plan
    text), and the four predictions (P1-P4 with their exact
    minimum_effect text, including the real negative branches) are
    transcribed into H-ECRANK-7f0ec1 and EXP-ECRANK-b23a5e without
    omission or softening; this was checked line-by-line against
    ledger/proposals/IDEA-20260829-c7472b.yaml before this approval.
  - >
    THIS EXPERIMENT IS SYMMETRIC, NOT A HUNT FOR A FLAW, and the
    contract says so explicitly in three places (the hypothesis
    statement part B, the experiment objective, and the
    falsification_criterion): P1 resolving "unconditional, certified"
    VINDICATES EV-ECQ-0d142e with a basis it currently lacks and is
    the outcome this design would most like to find. No transition of
    EV-ECQ-0d142e's status is authorized by this decision in either
    direction; any adverse finding routes to the Coordinator as a
    PROPOSED supersession under the two-record rule of
    docs/claims-and-verification.md, never an edit.
  - >
    PROOF-SEARCH MAP PRESENT AND CARRIED (docs/inventor-protocol.md
    section 8 / KN-TECH-080): bottleneck (the source of the upper bound
    in any exactness statement), baseline_embedding (the conductor-37/53
    controls, where conditional and unconditional answers coincide),
    observation_collision (two collisions named: rank-heterogeneous
    rungs sharing a label multiset, and a theorem-applied-incorrectly
    collision that the seeded non-subgroup-V fault targets), quantifier_order
    (FOR EACH rung, THERE EXISTS a path; never the stronger FOR-ALL-PATHS
    claim), and method_ceiling with its nearby_object_control (the
    degree-32 eigenspace and 31-point certificates must classify clean;
    the degree-16 multiplicity certificate must be flagged). All four
    audits are present in H-ECRANK-7f0ec1.proof_search_map; none records
    not_applicable.
  - >
    SETUP DEPENDENCY DISCLOSED, NOT ASSUMED: PARI/GP 2.15.4 with cypari
    is not currently installed in this execution environment. The
    specification's inputs.solver, the handoff's constraints, and the
    invalidation_rules all state this explicitly and route a failure to
    make it available to `failed_infrastructure` for R2, never to a
    scientific verdict about GRH-conditionality.
  - >
    SCALE HONESTY: scale_relevance.tier is `toy`, with an explicit
    statement that this is sub-cryptographic (a single named
    discriminant of expected log_10|d_A| around 50, not a security
    parameter) and that no claim here transfers to cryptographic-size
    instances without a separately frozen follow-up, per
    docs/claims-and-verification.md's tier table.
  - >
    NO OTHER RECORD'S STATUS IS TOUCHED by this decision or by the
    frozen contract: GOAL-ECRANK-002's goal.yaml, EV-ECQ-0d142e,
    EV-ECRANK-b6c9b6, and RQ-ECRANK-27dcc5 are read-only inputs. The
    proposal's own assumptions block (routing an adverse finding to the
    Coordinator as a new superseding record) is transcribed unchanged
    into H-ECRANK-7f0ec1.assumptions.
