  limitations:
  - >-
    TOY TIER, TWO CELLS, ONE MASTER SEED, ONE HOST, ONE UNREPLICATED REAL ARM, ONE NULL DRAW PER
    CELL FOR THE PRIMARY COMPARISON. p = 46663 and p = 767551 are 16-bit and 20-bit FIELD
    primes; `bits` names the field prime and nothing else. Nothing here transfers to
    cryptographic or medium parameters and no correspondence argument to scale exists.
  - >-
    ZERO MEASURED POWER AGAINST DEPENDENCE-ONLY ALTERNATIVES. This is the single largest
    limitation of the result and it is unmeasured rather than bounded.
  - >-
    THE DESIGN IS BLIND BY CONSTRUCTION to any deviation the deterministic and the random base
    SHARE. It is the right design for L2 and the wrong design for the absolute question
    HEUR-DS-1 needs.
  - >-
    THE DETERMINISM VERSUS SMALL-x-WINDOW CONFOUND IS UNRESOLVED (RT049-B6) and the L1
    cancellation argument does not reach it.
  - >-
    e_2 COVERAGE RESTS ON TWO COARSE JOINT GRIDS ONLY, the dedicated marginal probe having been
    excluded in advance.
  - >-
    THE CERTIFIED DELTA IS COARSE BY ABOUT A FACTOR OF FOUR - R_REPS = 20 makes the 0.95 bar a
    20-of-20 test on a five-rung ladder.
  - >-
    CTRL-EQD-S3 covers a 1000-entry PREFIX touching only 2 of the 512 base points as first
    element; the remaining 129816 half-tuples rest on the vectorized formula, with
    RT-20260801-049's collision-structure argument as independent but non-pointwise
    corroboration.
  - >-
    THE DV-5 BELOW-BAND LEG IS DEAD AT BOTH CELLS, so the deduplication and without-replacement
    failure modes were NOT checked and are never reported as passed.
  - >-
    UNDER THIS HARNESS THE AUTHOR, THE VALIDATOR, THE RED TEAM AND THIS COORDINATOR ALL RESOLVE
    TO claude-opus-5. Independence is PROCEDURAL, not model-level, and NO review in this batch
    is admissible toward the AGENTS.md rule 13 three-model closure quorum. model_verified is
    false everywhere; no adapter probe was run.
  - >-
    THIS DECISION IS NOT A MATHEMATICAL RESULT ABOUT ECDLP HARDNESS, NOT AN ATTACK, NOT AN
    ATTACK IMPROVEMENT, NOT A CLOSURE AND NOT AN IMPOSSIBILITY CLAIM. No exponent moved in
    either direction.

