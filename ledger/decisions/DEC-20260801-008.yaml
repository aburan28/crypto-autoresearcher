  decided_by_task: TASK-20260801-031
  decision: replicate
  decision_label: N_2_not_distinguishable_at_both_toy_cells_by_the_three_retained_statistics__with_a_measured_branch_level_detection_floor_of_delta_0_02_in_the_e_1_marginal_plant_class_and_ZERO_measured_power_against_dependence_only_alternatives__replicate_not_support
  target_ids:
  - EXP-EQD-001
  - H-EQD-001
  - EV-EQD-001
  - RR-EQD-1
  - RUN-EQD-001-real
  - GOAL-ECDLP-001
