    (OPEN-BATCH023-A) IS THE PROGRAM'S OLDEST DEBT AND IS THE HIGHER-VALUE OBJECT - it is the
    heuristic-validation experiment HEUR-DS-1 actually needs, and deferring it again is a real
    cost, stated in its open item rather than hidden. IT IS RANKED IMMEDIATELY BEHIND CTRL-1
    RATHER THAN AHEAD OF IT for one reason - it requires a FRESH FROZEN CONTRACT with its two
    named repairs, that is a full design-and-review cycle, whereas CTRL-1 is a bounded
