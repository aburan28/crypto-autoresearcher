  context: >-
    BATCH-023 froze EXP-EQD-001 to measure LIMB L2 - whether the half-arity Semaev fibre
    invariants (e_1, e_2) = INT-2 induced by a frozen deterministic 512-point factor base are
    distinguishable from those induced by a uniformly random 512-point factor base on the same
    curve, under an identical map, enumeration and code path, at thresholds calibrated from a
    MEASURED null under a rule frozen BEFORE the calibration ran. The calibration
    RUN-EQD-001-calib was validated ADMISSIBLE (VAL-20260801-003), the reading rule RR-EQD-1
    was frozen at TASK-20260801-023 and archived at 2918680a, the independent review at
