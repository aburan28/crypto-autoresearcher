    STAT-CHI-64, STAT-KS1-E1 and STAT-KS1-E2 at both cells. Freeze the ladder, the rho values,
    the statistic forms and the reading of the outcome BEFORE the measurement, under the same
    ATS-1 and AP-2 discipline that governed BATCH-023. THE COST IS MINUTES - the entire archived
    calibration, about 742 arms per cell at both cells, ran in 59.19 s at a peak RSS of 176 MB
    against a 4 GiB budget - so compute is not a reason to defer it. THE OUTCOME IS
    DECISION-RELEVANT IN BOTH DIRECTIONS AND THE READING IS DECLARED IN ADVANCE - if the joint
    chi-squares reach 0.95 detection at a rho a structured base could plausibly induce, the
    present non-rejection is substantially STRONGER than the certified delta 0.05 admits and
    EV-EQD-001's reading is amended upward by a superseding evidence record; if they do not, the
    honest reading of EV-EQD-001 DROPS to "the two marginals are not distinguishable and the
    joint was not effectively tested" and is amended downward by a superseding evidence record.
    Either way EV-EQD-001 is superseded by addition and never edited.
