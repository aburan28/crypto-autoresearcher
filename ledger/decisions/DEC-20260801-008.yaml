    the package was snapshot-archived at f6f5210d4272598687f33a71e816fc43a6925cbc. This
    decision applies the frozen rule to that package. IT IS THE FIRST MEASUREMENT OF A SEMAEV
    FIBRE INVARIANT EVER MADE IN THIS PROGRAM.

  # ==================================================================
  # 1. VALIDITY BEFORE INTERPRETATION
  # ==================================================================
  validity_determination:
    verdict: 'ADMISSIBLE. The run set is complete, valid and interpretable.'
    basis: >-
      VAL-20260801-004 returned ADMISSIBLE with ZERO DEFECTS, having re-executed the recorded
      command into a scratchpad (regenerated EQD_report.json EQUAL to the archived one at every
      key, TOLERANCE ZERO) AND independently reimplemented every statistic in pure Python
      reusing none of the driver's statistic code (agreement exact or to the last ulp).
      RT-20260801-049 independently recomputed the driver digest, all eight frozen thresholds
      from the raw CAL-1 arrays, all six retained comparisons, the duplicate structure and the
      branch arithmetic itself. THE COORDINATOR DID NOT ADOPT EITHER SESSION'S BRANCH
      ARITHMETIC - it is recomputed below against the frozen file.
    expected_run_count: '1 of 1 permitted; exit status 0; 1.617 s of an 1800 s budget; 0.148 GiB of 4 GiB.'
    expected_arm_count: 'Every arm at exactly 130816 pairs at both cells, independently regenerated.'
    manifest_schema_completeness: 'Complete; tools/validate_ledger.py check_run returned an EMPTY error list.'
    seed_integrity: >-
      Master seed 2301; real-arm null seeds 52317 and 52321 reproduce as 2301 + 50000 + bits
      and are DISJOINT from every archived calibration stream seed; first-draw redraw counts
      reproduced.
    raw_versus_summary_agreement: 'EXACT at every reported quantity, by two independent routes.'
    control_comparability: >-
      ESTABLISHED FROM SOURCE, not argued. Both arms pass through the identical
      int2_fibre_invariants call over the identical upper-triangle index set over 512 points;
      the ONLY difference is the source of the 512-element x-list.
    calibration_chain_confirmed: >-
      TASK-20260801-032 returned ADMISSIBLE (VAL-20260801-003) and the reading rule was frozen
      against it. THE SHA256 EQUALITY IS ATTESTED BY REFERENCE AND NOT BY THIS SESSION - see
      integrity_declarations.calibration_report_digest.
    infrastructure_signal_check: >-
      NO TIMEOUT, CRASH, RESOURCE EXHAUSTION OR BUDGET CANCELLATION OCCURRED, so AGENTS.md rule
      5 is not engaged in either direction. A fast run is not a truncated run.

  # ==================================================================
  # 2. THE FROZEN RULE, APPLIED IN ITS DECLARED PRECEDENCE ORDER
  # ==================================================================
  reading_rule_application:
    rule_id: RR-EQD-1
    rule_path: experiments/EXP-EQD-001/reading_rule.yaml
    rule_frozen_at_commit: 2918680a
    rule_sha256_recorded_inside_the_run_output: 1e6a6e22f4929dada11e7432899cded2d72218a0df2f5a80e0d4e1acfbf21ce5
    applied_as_frozen: true
    amended: false
    precedence_order_as_frozen: 'N-0, then N-5, then N-1, then exactly one of N-2, N-4, N-6.'
    step_1_N_0:
      condition_quoted: >-
        "ANY of the following - a sample set with other than 130816 recorded pairs; any
        recorded c_2 = 0 draw on any arm; a real-arm admissible-support fraction other than
        1.0; a driver sha256 differing from bdb2601b...; a CTRL-EQD-S3 faithfulness check below
        1000 of 1000 at either cell; a threshold in this reading rule not traceable to a named
        CAL-1 order statistic; the frozen INT-2 map not reproducible by the Validator from the
        manifest alone; or any timeout, crash, resource exhaustion or budget cancellation."
      result: DOES NOT FIRE
      leg_by_leg: >-
        130816 pairs on every arm at both cells; degenerate_draw_count 0; support_fraction_real
        exactly 1.0 at both cells; driver sha256 equal at seven independent computation sites
        with an EMPTY git diff across the calibration-to-real boundary and the same git blob id
        at both snapshots and at HEAD; CTRL-EQD-S3 1000 of 1000 at both cells; all eight
        thresholds recomputed from named CAL-1 order statistics by two sessions; INT-2
        reproduced from the specification formula alone in independent pure-Python arithmetic
        over all 130816 pairs per cell; no infrastructure stop of any kind.
    step_2_N_5:
      condition_quoted: >-
        Leg (a) - "DV-6 PC-1 FAILS TO REJECT". Leg (b) - "DV-7 REJECTS". Leg (c) - the in-run
        null-versus-null STAT-CHI-16 value "lies STRICTLY OUTSIDE the full measured CAL-1
        support at that cell", declared as [182.87972687693338, 321.9563383966048] at bits 16
        and [191.40792384797555, 335.54712432476106] at bits 20.
      result: DOES NOT FIRE ON ANY LEG
      leg_a: >-
        PC-1 REJECTED AT BOTH CELLS - 463.573258544002 > 315.4755320010126 at bits 16 and
        359.93896300215863 > 326.2209621328956 at bits 20, with n_replaced 6541 =
        int(round(0.05 * 130816)) at both cells. Leg (a) requires a FAILURE to reject; it did
        not occur.
      leg_b: >-
        DV-7 DID NOT REJECT - 261.8934732210371 at bits 16 and 256.60109843454813 at bits 20,
        both at or below their thresholds.
      leg_c: >-
        261.8934732210371 lies inside [182.87972687693338, 321.9563383966048] and
        256.60109843454813 lies inside [191.40792384797555, 335.54712432476106]. The
        load-bearing lower side - a null-versus-null statistic implausibly SMALL, the signature
        of an arm compared against itself - did not fire at either cell.
      controls_are_not_evidence: >-
        PC-1 and DV-7 are CONTROLS. PC-1's rejection is not evidence for any hypothesis and
        DV-7's non-rejection is expressly NOT corroboration of anything; only a DV-7 rejection
        would have been informative, as an implementation defect. Recorded because the frozen
        rule says so and because RT048-H4 was handled in advance.
    step_3_N_1:
      condition_quoted: >-
        "DV-5 STAT-DUP on OBJ-REAL falls STRICTLY OUTSIDE its calibrated band at either bit
        size - strictly outside [0, 110] at bits 16 or strictly outside [0, 0] at bits 20."
      result: DOES NOT FIRE
      observed: '20 at bits 16, inside [0, 110]. 0 at bits 20, inside [0, 0].'
      scope_of_what_this_non_firing_discharges: >-
        THE SUPPORT-COLLAPSE DEFECT CLASS ONLY (RT047-H2 / RT048-H1), via the live above-band
        leg, at both cells. IT DISCHARGES NOTHING ELSE. See
        superseding_correction_to_the_frozen_prose below - DV-5 is a pure function of the base's
        2-torsion closure at BOTH cells and bears on the fibre-invariant law at neither. The
        below-band leg is unreachable at both cells, declared so in advance, and the
        deduplication / without-replacement failure mode it exists to catch WAS NOT CHECKED and
        is never reported as passed.
    step_4_the_substantive_branch:
      branch_fired: N-2
      branch_name: NOT DISTINGUISHABLE FROM THE MATCHED NULL AT BOTH TOY CELLS
      condition_quoted: >-
        "No N-0, no N-5, no N-1, AND at BOTH bits 16 and bits 20 every RETAINED statistic -
        STAT-CHI-16, STAT-CHI-64 and STAT-KS1-E1 - fails to reject at its calibrated threshold,
        that is all six values are less than or equal to their thresholds in
        reading_rule.thresholds."
      arithmetic_recomputed_by_the_coordinator_against_the_frozen_file:
      - 'bits 16 STAT-CHI-16 - 269.31040852448893 > 315.4755320010126 is FALSE. No rejection.'
      - 'bits 16 STAT-CHI-64 - 4200.313917714735 > 4345.885305765976 is FALSE. No rejection.'
      - 'bits 16 STAT-KS1-E1 - 0.004540728962818041 > 0.006191903131115506 is FALSE. No rejection.'
      - 'bits 20 STAT-CHI-16 - 302.82051508909535 > 326.2209621328956 is FALSE. No rejection.'
      - 'bits 20 STAT-CHI-64 - 4168.585685033559 > 4293.229704961268 is FALSE. No rejection.'
      - 'bits 20 STAT-KS1-E1 - 0.002912487769080263 > 0.006841670743639949 is FALSE. No rejection.'
      conjunction: 'SATISFIED AT BOTH CELLS. Six of six fail to reject under the STRICT-GREATER rule.'
      exhaustiveness: >-
        Given that N-0, N-5 and N-1 do not fire, each cell either satisfies the N-2 conjunction
        or does not. Both satisfy, so N-2 fires and N-4 and N-6 are excluded. The branches are
        mutually exclusive and jointly exhaustive and this result is read into exactly one.
      independent_concurrence: >-
        RT-20260801-049's own arithmetic identified N-2 and it recommended `replicate`, while
        expressly declining to select the branch. The Coordinator's recomputation above agrees.
      disposition_as_frozen: >-
        "`replicate`. The deterministic factor base's fibre invariants are not distinguishable
        from a random factor base's at these resolutions, this n and these two toy cells.
        EXPLICITLY NOT `support`; NOT validation of HEUR-DS-1 at any tier; NOT a smoothness
        result of any kind; NOT S1_met, F1_met or F2_met; NOT any movement of G1-G4; and NOT a
        licence for any conditional asymptotic statement."

  # ==================================================================
  # 3. THE READING, WITH ITS POWER ATTACHED - RT049 BC-2 IS BINDING
  # ==================================================================
  the_finding_stated_with_its_floor: >-
    THE FINDING IS THE DETECTION FLOOR AS MUCH AS THE SIX FAILURES TO REJECT, AND THE TWO MAY
    NOT BE SEPARATED. At these two toy cells, with n = 130816 per arm and this design, a
    plant-class deviation affecting 2 percent or more of the half-tuples would have been caught
    with per-cell detection probability at least 0.928 (95 percent one-sided lower bound from
    40 of 40 CAL-2 detections by STAT-KS1-E1), joint at least 0.861 across the two cells, and
    NONE WAS SEEN; a deviation affecting 1 percent - ABOUT 1300 OF THE 130816 HALF-TUPLES -
    would have been MISSED ROUGHLY 85 PERCENT OF THE TIME; a deviation affecting 0.5 percent
    would have been missed essentially always; and A DEVIATION OF ARBITRARY SIZE THAT PRESERVES
    BOTH MARGINALS AND MOVES ONLY THE DEPENDENCE BETWEEN e_1 AND e_2 CARRIES NO MEASURED POWER
    AT ALL AND IS NOT EXCLUDED TO ANY DEGREE WHATSOEVER. The family-wise level of this branch
    is 1 - 0.99005**6 = 0.0582, not 0.00995. Both floors are cited - the CERTIFIED delta 0.05
    by the frozen predicate, and the MEASURED branch-level floor 0.02 via STAT-KS1-E1, which is
    a property of the apparatus and not a change to the frozen rule.
  the_sharpest_finding_of_this_batch:
    id: RT049-B1
    statement: >-
      THE POWER CERTIFICATE IS AGAINST THE WRONG ALTERNATIVE CLASS. The planted object
      OBJ-PLANT-delta - the only alternative class on the frozen ladder, hence the only class
      against which any power was ever measured - moves the e_1 MARGINAL ONLY - the driver's
      plant() replaces out1[idx] and returns e2.copy(), read from the source and confirmed by
      two independent sessions. NO RUNG OF THE FROZEN LADDER MOVES DEPENDENCE AT FIXED
      MARGINALS. Because the real base is a SMALL-x WINDOW - max x = 1052 against p = 46663 at
      bits 16 - a dependence deviation at preserved marginals is precisely the shape a
      structured base is most likely to induce. THIS RUN BOUNDS DEPARTURES IN THE e_1 MARGINAL;
      IT DOES NOT BOUND THE JOINT LAW.
    consequence_for_this_decision: >-
      IT DOES NOT CHANGE THE BRANCH - the frozen rule is applied as written and N-2 is the
      branch the data select. IT CHANGES WHAT THE BRANCH MEANS, and it is why the single next
      action of this goal is RT049-CTRL-1 rather than the replication. If the joint chi-squares
      turn out to have essentially no power against a dependence deviation, the honest reading
      of THIS run drops to "the two marginals are not distinguishable and the joint was not
      effectively tested", which is materially weaker than N-2's English suggests. THAT
      POSSIBILITY IS LIVE AND UNMEASURED, and it is recorded here rather than discovered later.
    unnumbered_heuristic_now_named: >-
      RT049-H2. "A plant-class detection floor bounds all deviations" is a HEURISTIC, and it was
      nowhere stated as one. It is named here; its discharge is RT049-CTRL-1.
  what_this_decision_explicitly_does_not_say:
  - 'NOT `support`. The state machine requires `replicated` first and this is one unreplicated toy run.'
  - >-
    NOT that the fibre invariants are GENERIC, EQUIDISTRIBUTED, RANDOM-LIKE or INDISTINGUISHABLE
    in any sense broader than the three retained two-sample statistics at K = 16, K = 64 and the
    e_1 marginal, at n = 130816, on the two named curve instances, at Bfb = 512, m = 4, one
    master seed, one host, one null draw per cell.
  - >-
    NOT any transfer to HEUR-DS-1 as validation, and not an adverse finding about it either.
    This experiment measures no smoothness, factors no integer and computes no largest prime
    factor.
  - 'NOT any asymptotic, crypto-scale, medium-scale or affected-scheme statement. Toy stays toy.'
  - 'NOT any rescue or re-scoring of the BATCH-020 R result or of EV-DS-001 through EV-DS-004.'
  - 'NOT S1_met, F1_met, F2_met or structure_gate_passed, none of which this experiment can evaluate because it runs no search.'
  - 'NOT any movement of the asymptotic promotion gates G1 through G4, which all remain OPEN.'
  - >-
    AND EQUALLY - NOT vacuous, NOT worthless, NOT a mere control, and NOT `reject_scoped` in any
    form. The run carries three positive contributions, each independently verified - a measured
    branch-level detection floor at delta 0.02 in the plant class, an exact and independently
    reproduced structural reconciliation of the duplicate count, and a mechanism correction that
    falsifies the specification's duplicate model at BOTH cells. Discarding those would be
    premature closure under docs/inventor-protocol.md section 4, which is a failure mode
    symmetric with overclaiming.

  superseding_correction_to_the_frozen_prose:
    id: RT049-B2
    what_is_corrected: >-
      RR-EQD-1's stat_dup_handling PROSE states that the specification's idealized duplicate
      model n**2 / (2 S) at bits 16 "predicts 31.4 per arm against a measured mean of 30.82, a
      good match". THAT MATCH IS A NUMERICAL COINCIDENCE, not a validated model.
    evidence: >-
      On six independently drawn random bases at bits 16, the observed duplicate count equalled
      the 2-torsion-orbit prediction EXACTLY in all six cases with ZERO residual accidental
      collisions, where the birthday model predicts about 31 accidental collisions each.
    mechanism: >-
      The same 2-torsion closure that operates at bits 20. (e_1, e_2) fixes the unordered pair
      {x(P+Q), x(P-Q)}; inverting requires halving, and halving's ambiguity IS E[2]; so the map
      is STRUCTURALLY INJECTIVE OFF THE TRANSLATE ORBITS and there is no birthday channel.
      Labelled derivation, never "proved".
    consequence: >-
      DV-5 MEASURES BASE TORSION GEOMETRY AT BOTH CELLS AND NOTHING ABOUT THE FIBRE-INVARIANT
      LAW. It discharges the support-collapse class via its live above-band leg and discharges
      nothing else. This supersedes the C-4 framing further in the direction C-4 already
      pointed, and it is the position this batch keeps.
    immutability: >-
      RR-EQD-1 IS NOT EDITED. The correction is recorded here and in EV-EQD-001 and is carried
      into any successor specification, together with RT049-CTRL-4's pre-registered decomposed
      diagnostic (dup_translate_explained and dup_residual, the residual pre-registered as an
      integrity tell). IT MAY NOT BE APPLIED RETROSPECTIVELY TO THIS RUN AS A REJECTION OR AS A
      FINDING.
    it_is_not_an_ATS_1_violation: >-
      Correct. It moved no threshold and changed no branch - the frozen band came from the raw
      order statistics regardless of the prose. It is an ERROR, recorded as a correction.

  duplicate_reconciliation_is_a_theorem_not_a_fit: >-
    CONDITION C-2 IS DISCHARGED WITH NO MASKING. The 20 iota-orbit pairs are IDENTICAL AS A SET
    to the 20 observed duplicate pairs with ZERO unexplained residual (VAL-20260801-004), and
    45 = 5 + 2 * 20 is FORCED by counting once the 10-element translate-closed set is known and
    is closed under a fixed-point-free involution. RT-20260801-049 reproduced the decomposition
    independently by point addition and confirmed the prediction transfers - predicted equalled
    observed on 6 of 6 fresh random bases. The real count 20 is EXACTLY the CAL-1 median and
    |S| = 10 against an expectation of about 11.2, so THE DETERMINISTIC BASE IS TYPICAL IN ITS
    TORSION CLOSURE and no masking of the substantive branch occurred. At bits 20 the curve
    order is odd, the translate map does not exist, and 0 duplicates is forced rather than
    improbable - the correct shape of a decay control under docs/inventor-protocol.md section 3.

  the_exclusion_of_STAT_KS1_E2_cost_nothing_here: >-
    COMPUTABLE, NOT ASSUMED, AND HONOURED IN BOTH DIRECTIONS UNDER CONDITION C-1. The excluded
    statistic's measured values are 0.003095951565557725 at bits 16 against the CAL-1 199th
    order statistic 0.00623012475538165, and 0.004548373287671215 at bits 20 against
    0.00631421232876711. NEITHER EXCEEDS, so retaining DV-4 would have left the branch
    IDENTICAL. This is the strongest available post-hoc evidence that the exclusion was NOT
    outcome-driven. C-1 IS HONOURED BOTH WAYS - the non-rejection is NOT converted into a
    rejection, AND it is NOT counted as an additional passed test that strengthens this result,
    because an uncertified statistic carries no power certificate in either direction. WHAT WAS
    LOST IN PRINCIPLE IS REAL AND IS STATED - STAT-KS1-E2 was the ONLY dedicated full-resolution
    marginal probe of e_2, and after its exclusion e_2 is seen only through two coarse joint
    grids. No gloss of this result may say "the invariants are indistinguishable" without the
    e_2 qualifier.

  the_measurement_is_of_L2_and_not_a_disguised_L1_statement: >-
    VERIFIED FROM THE DRIVER SOURCE, NOT FROM PROSE. Both arms pass through the identical
    fibre-invariant call over the identical index set over 512 points, differing only in the
    x-list, and stat_chi uses POOLED expectation, so everything common to both arms - all of
    L1, the 1/8 support density, the binning unevenness - cancels IDENTICALLY. The two-sample KS
    statistic compares the two empirical CDFs to each other and behaves the same way.
    support_fraction_real is exactly 1.0 at both cells and empty_cell_omission_count is 0 at
    both resolutions, so the cancellation is empirical as well as structural. RESIDUAL CAVEAT
    RT049-B6 - CANCELLATION DOES NOT PROTECT AGAINST THE DETERMINISM VERSUS SMALL-x-WINDOW
    CONFOUND, because that feature interacts with the base geometry rather than being shared by
    the two arms. L1 remains a DERIVATION and is never a finding of this batch; L3 remains
    instrument characterization and is never a result about the Semaev map.

  observation_recorded_under_AGENTS_rule_8_and_not_acted_on: >-
    THE BITS-20 STAT-CHI-16 VALUE SITS AT THE 192nd OF 200 CAL-1 REPLICATES, EMPIRICAL
    p = 0.0498. It does NOT exceed the frozen threshold 326.2209621328956, the frozen rule was
    applied as written, and condition C-1 forbids converting it. FOUR REASONS DISQUALIFY IT AND
    ALL FOUR TRAVEL WITH IT - (1) with six retained comparisons, 1 - 0.95**6 = 0.265 is the
    probability that at least one value lands above the 95th null percentile on a correct null,
    so this is the single most likely observation and it appeared; (2) NO CROSS-CELL CONSISTENCY
    - the same statistic at bits 16 sits at p = 0.2736; (3) five of six retained values above
    their null median gives a sign test P of 0.109, which is nothing; (4) converting it would be
    exactly the post-calibration latitude ATS-1 clause 4 forbids. DISPOSITION - CARRIED AS A
    PRE-REGISTRATION TARGET FOR THE REPLICATION, NEVER AS A FINDING. Naming it now is what makes
    the replication informative rather than exploratory.

  # ==================================================================
  # 4. BC-6 - THE HYPOTHESIS STATE MACHINE, RESOLVED EXPLICITLY
  # ==================================================================
  BC_6_resolution:
    the_gap_stated_plainly: >-
      RR-EQD-1's N-2 disposition reads "H-EQD-001 `analyzed` -> stays `analyzed`", but
      ledger/hypotheses/H-EQD-001.yaml stood at `specified` with a SINGLE status_history entry
      (status `specified`, decision DEC-20260801-007, from_status null). THERE WAS NO
      `approved`, NO `running` AND NO `analyzed` ANYWHERE IN ITS HISTORY. The frozen branch's
      status precondition was not satisfied by the ledger as it stood, and RT-20260801-049
      raised this as a hard gate that must not be short-circuited.
    resolution_chosen: >-
      OPTION (a) OF BC-6 - RECORD THE INTERVENING TRANSITIONS WITH THEIR DECISION REFERENCES,
      THEN APPLY THE BRANCH. H-EQD-001 is set to `analyzed` by THIS decision, and its
      status_history now carries four entries - the original `specified` (DEC-20260801-007,
      untouched), then `approved`, `running` and `analyzed`, each recorded RETROSPECTIVELY BY
      DEC-20260801-008 with its own authorizing artifact named. The alternative of writing
      `analyzed` with no intervening record is what BC-6 forbids and it was not taken; the
      alternative of declaring the clause inapplicable was rejected because the events the
      clause presumes ACTUALLY HAPPENED and are each evidenced by a committed artifact - what
      was missing was the bookkeeping, not the event.
    why_this_is_not_backdating_or_fabrication: >-
      EACH TRANSITION NAMES THE ARTIFACT THAT ACTUALLY EFFECTED IT AND EACH IS MARKED
      recorded_retrospectively true. `approved` - APPROVAL_DETERMINATION APPROVED in the
      TASK-20260801-026 snapshot receipt, after the independent review REV/TASK-20260801-025
      whose attainability and ATS-1 duties both passed. `running` - RUN-EQD-001-real executed at
      TASK-20260801-027 under that approval and snapshot-archived at
      f6f5210d4272598687f33a71e816fc43a6925cbc. `analyzed` - the completion of
      VAL-20260801-004 and RT-20260801-049 and the application of the frozen rule in this
      record. No date is falsified - each entry carries decided_at 2026-08-01, which is the true
      date of all four events, and each states the task that effected it.
    the_process_defect_is_filed_rather_than_papered_over: >-
      OPEN-BATCH023-B, NEW. THE BATCH'S APPROVAL AND EXECUTION GATES LIVED IN SNAPSHOT RECEIPTS
      AND THE HYPOTHESIS RECORD WAS NEVER ADVANCED TO MATCH, so a frozen reading rule written in
      terms of hypothesis STATUS referred to a status the ledger never held. That is a real
      bookkeeping defect and it is the second time this lane has shipped a disposition map whose
      precondition was not checked against the object it names. The structural repair for the
      successor is stated in declared_open_items - a hypothesis-status transition belongs in the
      hypothesis record at the gate that effects it, not only in the archive receipt, and any
      reading rule that keys a branch on a status must have that status checked at freeze time.
    forbidden_outcome_confirmed_not_taken: >-
      IN NO CASE MAY H-EQD-001 REACH `supported`, AND IT DOES NOT. The state machine requires
      `replicated` first and this is a single unreplicated toy run.
    status_scope_written: >-
      YES, MANDATORY. A bare status field is unscoped by construction and successors read the
      field rather than the branch text, so H-EQD-001 carries a `status_scope` block in this
      same ledger commit bounding what `analyzed` asserts.

  hypothesis_disposition:
    hypothesis_id: H-EQD-001
    status_from: specified
    status_to: analyzed
    intervening_transitions_recorded: [approved, running]
    status_scope_block_written: true
    mechanism_test_status: >-
      EXERCISED, FOR THE FIRST TIME IN THIS PROGRAM, AND RECORDED BY ADDITION. The existing
      mechanism_test_status block is scoped "AS OF THE BATCH-023 OPENING" and remains true of
      that moment, so it is PRESERVED VERBATIM rather than edited; a new dated block
      mechanism_test_status_batch023_close records exercised true with a statement bounding
      exactly what was exercised - the fibre-invariant map INT-2 was computed exhaustively on
      real and null objects at two toy cells and the L2 comparison was carried out. That is the
      INSTRUMENT statement the field is for; it is not a statement that the hypothesis is
      supported, and HEUR-DS-1 was NOT exercised by it.
    forbidden: 'supported, replicated, weakened, rejected. None is taken.'

  # ==================================================================
  # 5. RATIONALE
  # ==================================================================
  rationale:
  - >-
    THE BRANCH IS NOT A JUDGEMENT CALL. The Coordinator recomputed all six comparisons against
    the frozen thresholds under the frozen strict-greater rule, checked every N-0 leg, all three
    N-5 legs and both N-1 legs, and found the N-2 conjunction satisfied at both cells and no
    pre-empting branch firing. The exhaustiveness argument leaves no alternative.
  - >-
    `replicate` IS THE CORRECT STRENGTH AND EACH ALTERNATIVE IS EXCLUDED FOR A STATED REASON. It
    is not `support`, which the state machine forbids without `replicated`. It is not `weaken`,
    which no rejection licenses because nothing rejected. It is not `reject_scoped`, which a
    single unreplicated empirical-only run may not carry IN EITHER DIRECTION. It is not
    `inconclusive`, because the data DID discriminate the branch the frozen rule asks about -
    what remains uncertain is the POWER of that discrimination against a class the design never
    measured, which is a scope limitation recorded as such and not an inability to read the
    result.
  - >-
    THE NON-REJECTION IS REPORTED WITH ITS FLOOR IN THE SAME BREATH, because a non-rejection
    without its power is an overclaim by omission. Both floors are cited - certified 0.05 by the
    frozen predicate and measured 0.02 at the branch level - and the largest deviation
    consistent with the observation, about 1 percent of 130816 half-tuples inside the plant
    class and UNBOUNDED outside it, appears in the same paragraph everywhere it is stated.
  - >-
    THE RUN IS NEITHER INFLATED NOR DEFLATED. Inflation is blocked by the licensed-English
    clause and by the explicit list of what this decision does not say. Deflation is blocked by
    naming the three verified positive contributions - the measured detection floor, the exact
    structural reconciliation of the duplicate count, and the mechanism correction to the
    duplicate model. Premature closure is a failure mode symmetric with overclaiming
    (docs/inventor-protocol.md section 4) and both are refused here.
  - >-
    THE CONTROLS-BEFORE-BELIEF DUTY WAS DISCHARGED BY THE DESIGN AND IS DISCHARGED AGAIN IN THE
    READING. The identical measurement ran against a null object of the same shape by
    construction, not by argument; the duplicate quantity decayed to exactly zero at the cell
    where its named generator is destroyed; and the one apparent signal in the package - the
    bits-20 upper-tail percentile - is recorded and explicitly not read, with its four
    disqualifying reasons attached.
  - >-
    THE OWED MEASUREMENT IS NOT DISCHARGED BY ANY OF THIS AND SAYING SO IS PART OF THE DECISION.
    Equidistribution of the fibre invariants is a LOAD-BEARING INPUT to HEUR-DS-1 and is not
    identical to it. This experiment factored no integer.

