    Coordinator snapshot TASK-20260908-08f8f1, independent validator
    TASK-20260908-002334, and this ledger archive (TASK-20260908-782c0e).
  decision: support
  decision_note: >-
    "support" because the independent validator returned an overall PASSED
    verdict on every substantive claim this batch was dispatched to
    establish (SR1 discharge, the L3 base-point certificate for M1/M2/M3
    including the M2 falsifier diagnosis, and all three declared controls),
    each independently re-derived from raw git/RFC sources rather than
    copied from the producer. This is a diagnostic/custody measurement, not
    an ECDLP or SafeCurves-criterion claim: no hypothesis status changes, no
    SafeCurves True/False comparison cell is authorized, and no statement
    is made about curve safety.
  target_ids:
    - GOAL-SCURVE-15e805
    - BATCH-0aef14
    - TASK-20260908-42e809
    - TASK-20260908-08f8f1
    - TASK-20260908-002334
  rationale:
    - >-
      INDEPENDENT VALIDATOR VERDICT: PASSED. TASK-20260908-002334
      (review-adversarial, xhigh, fresh session) independently re-fetched
      RFC 7748 and RFC 8032 via its own curl call, recomputed sha256 matching
      the producer's declared hashes, and independently re-derived every
      L3-relevant value with its own line citations -- all matching the
      producer's raw-transcription.yaml.
    - >-
      THE L3 BASE-POINT CERTIFICATE WAS FULLY INDEPENDENTLY REPRODUCED: using
      its own from-scratch Montgomery ladder, twisted-Edwards addition law,
      on-curve check, and exact-integer Hasse-interval test (never the
      producer's code, which does not exist as a separate file to read -- only
      prose method descriptions, independently reimplemented), the validator
      confirmed M1 (curve448) and M3 (edwards448/Ed448-Goldilocks) both
      certify cleanly, and independently reproduced M2's exact falsifier
      trigger (l*B = the order-2 point (0, p-1), not the identity).
    - >-
      THE M2 DIAGNOSIS -- THE CHECK THIS BATCH TREATED AS MOST IMPORTANT --
      WAS INDEPENDENTLY CONFIRMED ON ALL FOUR SUPPORTING SUB-CLAIMS: d is a
      genuine quadratic non-residue mod p; the M2 point and its algebraic
      negation double consistently as true negatives of one another; RFC
      7748's own stated birational map recovers curve448's base point u=5
      exactly from the M2 point; and 2*l*(x,y) independently computes to the
      Edwards identity, confirming the point's true order is 2*l. The root
      cause -- this specific non-normalized birational chart mapping the
      Montgomery group identity to the Edwards curve's own 2-torsion point --
      is independently verified, not merely restated from the producer.
    - >-
      ALL THREE OF LANE L3's DECLARED CONTROLS WERE INDEPENDENTLY RE-RUN with
      the validator's own code, own random seed (20260908991, distinct from
      the producer's), and own control-point constructions: positive control
      (order-4/order-2l constructions on both models), parameter-matched
      negative (Curve25519, independent of any p25519 square-root claim), and
      same-shape null (quadratic twist plus 1000 random pairs plus a
      bit-decay sweep on both models) -- all confirmed correct, with the
      decay checks showing the required monotone collapse to zero and no
      non-zero floor at any tested bit count.
    - >-
      ONE GENUINE, SCOPED DEFECT WAS INDEPENDENTLY FOUND AND IS NOT SOFTENED:
      the producer's stated M1 order-4 positive-control point (u=1,
      v=528950...173011) does not actually lie on curve448 -- 156328 (the
      curve-equation value the point would need to satisfy at u=1) is not a
      quadratic residue mod p; the given v is a genuine square root of the
      unrelated constant 156324, correctly computed but attached to the
      wrong u-coordinate (u=p-1 is the correct pairing, not u=1). The
      validator traced this to a coordinate/sign transcription slip and
      confirmed the corrected point (u=p-1, v=<same v>) genuinely has order
      4. This defect is isolated to one redundant auxiliary control
      sub-case: it does not touch the M1/M2/M3 certificate itself (verified
      against the actual transcribed base points, not this fabricated
      auxiliary point), does not touch the M2 diagnosis, and global
      precondition P4 ("controls must run and behave as required before any
      finding is believed") remains substantively satisfied via three other
      independently-valid positive-control demonstrations (M1 order-2l; M3
      order-4; M3 order-2l), alongside the fully valid parameter-matched-
      negative and same-shape-null controls.
    - >-
      A SECOND, NON-LOAD-BEARING FACTUAL ERROR was independently found: the
      producer's base-point-audit.yaml environment note claims RFC 7748
      states Curve25519's prime is congruent to 3 mod 4; RFC 7748 line 183 in
      fact states it is congruent to 1 mod 4 (only curve448's prime is
      congruent to 3 mod 4). No modular square root over p25519 is actually
      computed anywhere in the certificate, so this error did not propagate
      into any reported value -- confirmed by the validator re-running all
      three Curve25519 checks independently and getting exact agreement.
    - >-
      NO SAFECURVES COMPARISON AND NO SECTION-5 LEAKAGE: the validator
      independently confirmed no SafeCurves True/False comparison cell was
      emitted anywhere (global precondition P2 remains open, per capsule
      conflict C6b's unsourced thresholds), and that no value from
      parameter-capsule.yaml's quarantined section 5 (USE_PROHIBITED)
      leaked into the certificate -- four values do numerically coincide
      with quarantined entries, but the validator independently re-derived
      all four from its own fresh RFC fetch and confirmed the coincidence
      reflects that the earlier unreliable channel happened to transcribe
      those specific fields correctly, not that they were copied from the
      off-limits source.
