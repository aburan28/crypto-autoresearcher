  pre_commit_protocol_revision:
    at: '2026-09-13T22:50:00Z'
    scope: made before the design was committed (TASK-20260913-f8bdec); no frozen record was rewritten
    changes:
      - >-
        P3 was unfalsifiable as first drafted: the -g 1..ml "core order" is a prefix
        of WDSat's default order (wdsat.c sets the default branching set to 1..N), so
        it must reproduce default exactly. It is kept as P3a, an identity check on the
        -g wiring, and a real order control is added as P3b: a full permutation with
        the N-ml e-variables ahead of the ml core variables, 5 S + 5 U per cell, 120 s
        timeout, compared on right-censored wall time (>= 2x). Pilot values are in
        the specification's coordinator_prior and are sizing inputs, not evidence.
      - >-
        P4 gained a 0.05 s default-median floor and a 10% tolerance: the smoke summary
        decided it on a 0.5 ms difference between two ~5 ms medians.
      - >-
        summary.py evaluates P5's SAT clause on CryptoMiniSat CNF-XOR conflicts as
        well as WDSat, since the hypothesis says "the SAT solvers".
      - specification.yaml budget field split so the file parses (an unquoted colon had made it unparsable).
