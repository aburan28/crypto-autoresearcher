coordinator_decision:
  id: DEC-20260913-6270ba
  recorded_at: '2026-09-13'
  decided_at: '2026-09-13T21:55:00Z'
  decided_by: coordinator (top-level session, branch cursor/semaev-2015-audit-program-5b8b, Claude Fable 5.1)
  recorded_by_task: TASK-20260913-e74a82
  archived_by: TASK-20260913-f8bdec
  goal_id: GOAL-ICPERF-e6b6a4
  batch_id: BATCH-51e2aa
  decision: >-
    Open research area ICPERF and goal GOAL-ICPERF-e6b6a4 on the user's instruction of
    2026-09-13 (phase-decomposed runtime boundary for index-calculus ECDLP on Koblitz,
    binary and prime-field curves, plus the algorithm library); freeze the user-
    suggested benchmark generator (SRC-ICPERF-TRIMOSKA-ECICB-2024) and WDSat
    (SRC-ICPERF-TRIMOSKA-WDSAT-2024) as inputs; specify H-ICPERF-cc4847; APPROVE
    EXP-ICPERF-66fd51 as frozen; open BATCH-51e2aa; rank its executor first.
  decision_label: open_goal_and_approve
  context: >-
    The user asked for a concrete, iterable performance boundary and for the
    algorithms (solvers, Groebner/F4, Nagao, summation polynomials), then pointed at
    github.com/mtrimoska/EC-Index-Calculus-Benchmarks. That repository is the instance
    generator behind the only published SAT-versus-Groebner PDP comparison in the
    corpus (KN-LIT-102cdb), whose every number this program has so far carried as
    reported-not-reproduced (SRC-SATIC-TRIMOSKA-2019; RQ-SATIC-1ae57a constraint 2).
    The Coordinator cloned both repositories, verified that the vendored generator
    regenerates a shipped instance byte-for-byte, built WDSat, installed Macaulay2,
    Singular, CryptoMiniSat, CaDiCaL, MiniSat and msolve, wrote an independent
    GF(2^n) certificate checker that verifies all 30 shipped certificates and
    rejects a perturbed one, and smoke-ran every engine path. That is enough to
    freeze a complete protocol; the smoke numbers are recorded as sizing inputs and
    as the Coordinator's prior, never as evidence.
  target_ids:
    - RQ-ICPERF-94c86e
    - GOAL-ICPERF-e6b6a4
