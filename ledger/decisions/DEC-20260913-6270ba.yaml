  dispatch_ranking:
    - rank: 1
      task: TASK-20260913-0b470b
      why: >-
        The only executable task under the new goal; it is the user's direct request
        and produces the first measured row. Ranked ahead of doing nothing because the
        protocol is complete, every engine path has been exercised, and the run is
        bounded (8 h executor cap, sequential single-solver execution). Ranked
        alongside, not ahead of, the in-flight GOAL-SEMBIN-5078bc validator
        TASK-20260913-0d6586 and the queued GOAL-SEMBIN-fcb7a2 design completion:
        both are ECC, both are ranked, and the machine has headroom for one solver
        benchmark beside a file-review subagent (loadavg 0.2-0.6 measured).
    - rank: 2
      task: TASK-20260913-6c5729
      why: independent validation under a review_plan written before it runs; required because the executor's rows will be cited in a boundary table
  infrastructure_stops: []
  model_fallback_authorization:
    what: >-
      TASK-20260913-0b470b runs on executor-mechanical (policy effort low). The user's
      'Use fable' instruction binds it to claude-fable-5-1-thinking-low. The Fable
      backend hit a usage limit at 2026-09-13T20:26Z (DEC-20260913-c224bb); if it is
      still unavailable at dispatch, fallback to a first-party model at the policy's
      effort is authorized and must be recorded in manifest.yaml as fallback_used
      with the reason.
    what_not: no degradation of any review tier; review-adversarial for the validator stays xhigh
    user_preference_note: Fable is preferred; the fallback is recorded, never silent.
  rationale:
    - >-
      Direct user request with a user-supplied instrument; the instrument was
      verified (deterministic regeneration, 30/30 certificates) before being frozen.
    - >-
      It closes a recorded gap: RQ-SATIC-1ae57a's motivation names the WDSat/Groebner
      effect as the largest reported effect on exactly the C_decomp step the program
      models, and states it has never been run here.
    - >-
      Every engine that will appear in a boundary-table cell is installed, versioned,
      and named; engines that are absent (Magma, PolyBoRi) are named as absent and
      not substituted silently.
    - >-
      The protocol carries the inventor-protocol controls: matched null objects
      before belief in structure (C-NULL), independent certificate re-verification
      (C-CERT, C-ANSWER), and a proves-too-much style hash check that the regenerated
      pure-CNF equals the authors' bytes (C-REGEN).
