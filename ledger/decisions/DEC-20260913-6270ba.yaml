    - The Groebner baselines are not Magma; P2 is about the installed engines only.
    - The Coordinator wrote the experiment code. Independence is recovered at review by a blind re-derivation joint (certificates recomputed without reading binec.py) and a mechanical re-run of a sample of rows.
