  rationale:
  - >-
    (a) VALIDITY GATES FIRST, BECAUSE THEY DOMINATE THE READING RULE. AT THE BATCH LEVEL EVERY GATE
    PASSES AND NO INFRASTRUCTURE EVENT OF ANY KIND OCCURRED: decoder_calls_made is 0 of 0 authorized,
    both call counters are exactly 0 at exit, all three pinned module sha256 values re-verify UNCHANGED
