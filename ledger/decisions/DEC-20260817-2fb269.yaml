    protocol_deviations is empty and the Red Team verified that as true, and every one of the 19 source
    arrays spans k = 2..26 so no cell is limited by coverage. THE ZERO-DECODER-CALL GUARANTEE IS
    ESTABLISHED AS A CONSTRUCTION RATHER THAN ACCEPTED AS AN ASSERTION (EV-HQC-4973ff O2): Part A
    imports no pinned decoder module at all; Part B's tripwires raise rather than delegate and are
    installed before the selftests, the probe and any replicate; the sharpest bypass -- a second,
    unpatched stage_a module object -- is structurally impossible because matched_pair.py never imports
    stage_a and receives it as an explicit parameter; neither selftest can reach a decoder; and
    import-time execution was checked and is empty in fact. AT THE CELL LEVEL, TWO CELLS ARE
    INFRASTRUCTURE-CLASS OUTCOMES AND ARE NAMED INDIVIDUALLY RATHER THAN VOIDING THE BATCH, AS THE RULE
    REQUIRES: the frozen 1e-12 reconstruction gate FAILED on (5000, regime P) (recomputed
    2.8360981651225576 against committed 2.836, residual 9.8165e-05) and on (6000, regime P)
    (1.4019206406015738 against 1.402, residual 7.9359e-05), and PASSED on (8001, regime N) (residual
    8.327e-16) and (8002, regime N) (residual 1.887e-15). BRANCH I GOVERNS THE TWO FAILING CELLS. Their
    low-k values are WITHHELD -- literal null at every k, not missing, not dropped, not estimated, not
    fabricated -- and under AGENTS.md rule 5 that withholding is a DATA-AVAILABILITY OUTCOME and is
    NEVER negative mathematical evidence about k, the shards, the regimes, the estimator or HQC. Both
    reviews independently verified the producer's conduct as clean: mapping_was_adjusted_or_searched is
    false and neither found any trace of an alternative pairing in code, results or logs.
  - >-
    (b) THE FROZEN READING RULE, APPLIED EXACTLY AS FROZEN, AT THE k=5 THE RULE FIXED IN ADVANCE.
    RULING: BRANCH R. D_RMS(5) = 0.124859, so predicate (i)'s frozen threshold max(D_RMS(5), 0.25) =
    0.25 and the floor binds on both coordinates. FRESH: deviations 0.197364 / 0.044602 / 0.106080 /
    0.007221, dev_fresh(5) = 0.197364; predicate (i) 0.197364 <= 0.25 TRUE (21.1% under); dev_fresh(17)
    = 2.460737 so predicate (ii) 0.197364 <= 1.230369 TRUE (6.23x margin); COLLAPSE(fresh) = TRUE.
    HISTORICAL: the two AVAILABLE cells give deviations 0.275554 (cell (8001,N)) and 0.089316 (cell
    (8002,N)), maximum 0.275554; predicate (i) 0.275554 <= 0.25 FALSE, exceeded by 0.025554, i.e. 10.2%
    over the floor; predicate (ii) is TRUE under EITHER available comparator (0.275554 <= 1.168049
    using batch.yaml's own pre-computed four-cell dev_hist(17)/2, and 0.275554 <= 0.683118 using the
    surviving subset's 1.366236/2), so the comparator ambiguity batch.yaml left in predicate (ii) does
    not affect the outcome and is stated rather than resolved silently; COLLAPSE(historical) = FALSE.
    (TRUE, FALSE) -> BRANCH R. NO THRESHOLD, FLOOR, FACTOR OR BRANCH READING WAS ADJUSTED AFTER SEEING
    THE OUTCOME, and no protocol_amendment is written. k=10 was read as the intermediate monotonicity
    datum the rule declares it to be and ADJUDICATED NOTHING: at k=10 dev_fresh = 0.636112 and the
    available historical maximum is 0.428888, both far outside the 0.25 floor, so an adjudication at
    k=10 would have selected Branch F. It was not made and is not made here; batch.yaml fixed k=5 in
    advance precisely so a later session could not choose the k after seeing the data, and this archive
    honours that.
  - >-
    (c) THE RULING THE VALIDATOR HANDED ME BY NAME, MADE EXPLICITLY BECAUSE IT IS CONSEQUENTIAL AND
    BECAUSE THE RULE DOES NOT SUPPLY IT: DOES BRANCH I's PER-CELL PRE-EMPTION PERMIT READING A SET
    PREDICATE WHOSE MAXIMUM SITS ON AN UNAFFECTED CELL? I RULE THAT IT DOES, IN ONE STRICTLY BOUNDED
    DIRECTION AND NO OTHER. Branch I's operative clause is "no other branch may be read FROM AN
    AFFECTED CELL", with the batch-level consequence deliberately refused ("the affected cells are
    named individually rather than the whole batch being voided"). The historical predicate here is
    read from the two UNAFFECTED cells plus one mathematical fact: batch.yaml defines dev_set(k) as a
    MAX of per-cell absolute deviations, and a maximum is non-decreasing in its argument set, so the
    maximum over any subset is a LOWER BOUND on the maximum over the whole. 0.275554 > 0.25 on the
    available cells therefore fixes predicate (i) FALSE for the full four-cell set UNDER EVERY POSSIBLE
    VALUE OF THE TWO WITHHELD CELLS. Reading it consumes ZERO information from an affected cell; it is
    a derivation, not an inference from missing data, and it is the only step of this decision that is
    derivation-grade rather than empirical (EV-HQC-4973ff proof_status_note (1)). THE RULING IS
    ONE-SIDED AND I STATE THE COUNTERFACTUAL SO IT IS NOT MISTAKEN FOR A GENERAL LICENCE: had the
    available maximum fallen BELOW the threshold, the predicate would have been genuinely
    UNDER-DETERMINED -- the withheld cells could have pushed it either way -- and Branch I's pre-emption
    would then have propagated to the set-level predicate, taking the outcome to BRANCH X
    (inconclusive) rather than to any substantive branch. A partial set may fix a set predicate ONLY
    when the surviving cells decide it by monotonicity alone. THE ALTERNATIVE RULING IS NAMED RATHER
    THAN SUPPRESSED, BECAUSE IT WOULD HAVE CHANGED THE OUTCOME: a Coordinator could instead hold that
    "max over THE FOUR CELLS" is simply undefined on a partial domain and take the outcome to Branch X.
    I reject that reading on the ground that it would make Branch I's own anti-voiding clause
    self-defeating -- a per-cell pre-emption that silently voids every set-level branch is a batch-level
    pre-emption -- and because the monotone argument removes exactly the post-hoc latitude
    pre-registration exists to remove. BOTH REVIEWERS REACHED THE SAME ARITHMETIC INDEPENDENTLY and
    both correctly declined to make the ruling. I NOTE, AND DECLINE TO RELY ON, THE RED TEAM's
    observation that the k=5 argmax happens to be an available cell so the two-cell and four-cell
    answers coincide: that fact is established only by ITS OWN mapping-conditional recomputation of the
    withheld cells, this decision reads no withheld value, and the monotone bound needs none.
  - >-
    (d) BRANCH R's READING, RECORDED IN THE FROZEN ROUTE's OWN WORDS AND UNSOFTENED: THE k-EXPLANATION
    IS REFUTED AND THE SHARD/REGIME/PROCEDURE QUESTION IS LIVE AGAIN AT LOW k. THAT IS A USEFUL RESULT
    TO BE RECORDED AS SUCH, NOT A FAILURE OR A DISAPPOINTMENT. It is the second time in this campaign
    that a pre-registered rule has produced a substantive verdict rather than an inconclusive one, and
    the first time one has fired AGAINST the explanation the campaign itself was carrying. BRANCH R's
    REQUIRED ADDITIONAL RECORDING, given in full because a refutation is only useful if it says what
    replaced the explanation. WHICH CELLS FAIL AND BY HOW MUCH: exactly one available cell drives it --
    (8001, regime N), deviation 0.275554 against the 0.25 floor, over by 0.025554; (8002, regime N) at
    0.089316 is comfortably inside; the two regime-P cells contribute nothing in either direction under
    Branch I. IS THE FAILURE PATTERN SHARD-ALIGNED, REGIME-ALIGNED OR PROCEDURE-ALIGNED? THE RUN DOES
    NOT DETERMINE IT, AND THE REASON IS STRUCTURAL RATHER THAN A SHORTAGE OF EFFORT, WHICH IS ITSELF
    THE ANSWER TO RECORD. It is not cleanly SHARD-aligned: 8001 fails while 8002, of the same shard
    family, does not. SHARD AND REGIME CANNOT BE SEPARATED IN THE HISTORICAL SET AT ALL, because there
    regime is 100% COLLINEAR with shard -- 5000 and 6000 are P-only, 8001 and 8002 are N-only -- so the
    historical set has no factorial structure and admits no main effect or interaction even with all
    four cells present; and with the regime-P half withheld, both survivors are regime N, so the
    P-versus-N contrast has no P half. PROCEDURE-ALIGNED IS FULLY LIVE AND IS THE ONE OF THE THREE THAT
    HAS NEVER BEEN TESTED: every historical cell's two T-points come from different tasks in different
    processes (and different machines, operating systems, Python and numpy versions) while no fresh
    cell's do, and the observed pattern -- one historical cell outside the floor, no fresh cell outside
    it -- is consistent with a procedural effect AND equally consistent with cell-level sampling
    variation at one failing cell. ALL THREE ARE RECORDED AS LIVE, NONE IS SELECTED, AND THE REFUTATION
    IS NOT WEAKENED BY THAT: the frozen route's verdict is about the historical set's failure to
    collapse, not about which factor explains it.
  - >-
    (e) THE HEADLINE OBJECTION, ADOPTED IN FULL AND UNSOFTENED, BECAUSE IT IS THE MOST CONSEQUENTIAL
    THING IN THIS BATCH AND BECAUSE IT CUTS AGAINST THE COORDINATE MY OWN RULE SCORED AS A PASS: THE
    COLLAPSE IS A COLLAPSE OF UNITS, NOT OF SIGNIFICANCE, AND THE BATCH'S OWN DESIGNATED PRIMARY
    BAND-FREE YARDSTICK SAYS SO. Normalised by D_RMS(k) -- which batch.yaml itself names "THE PRIMARY
    YARDSTICK OF ITS READING RULE" and which DEC-20260817-2b638b rationale (e) made load-bearing --
    dev_fresh/D_RMS is 1.499 / 1.581 / 0.709 / 0.776 at k = 2 / 5 / 10 / 17, and over the four
    historical cells dev_hist/D_RMS is 1.471 / 2.207 / 0.807 / 0.737. THE DEVIATION FROM 0.5 IS LARGEST
    RELATIVE TO THE INSTRUMENT'S OWN NOISE AT LOW k, peaking near k=4-5 (1.564 fresh, 2.421 historical)
    and falling below one noise scale only for k >= 8; the noise handle falls 37.0x from k=17 to k=2
    while the deviation falls only 19.2x. THE CONSEQUENCE, STATED PLAINLY: COLLAPSE(fresh) = TRUE IS A
    STATEMENT IN ABSOLUTE ALPHA UNITS AGAINST AN ARBITRARY 0.25 FLOOR AND IS NOT A STATEMENT THAT THE
    FRESH CELLS SIT RESOLVABLY AT 0.5. Anyone reading this archive's Branch R as "the fresh half
    collapsed and only the historical half misbehaved" has read it wrong. The k-explanation SURVIVES IN
    MAGNITUDE AND FAILS IN RESOLVABILITY, and this campaign has been reading it as the second. Under
    docs/inventor-protocol.md section 3 the k-explanation's own correct prediction is that the
    noise-normalised deviation should DECAY as k falls; measured, it stays flat and then RISES, and a
    quantity that fails to decay when it should is the artifact tell -- here firing on the refutation
    side, by the campaign's own control against the campaign's own signal. TWO LIMITS TRAVEL WITH THIS
    AND ARE NOT SOFTENED EITHER: D_RMS is a SCALE FROM n = 2 CONTRASTS measured on the FRESH windows
    only, so applying it to the historical cells assumes transfer across the procedural asymmetry; and
    the four-cell historical column uses the Red Team's mapping-conditional recomputation of the
    withheld cells at every k EXCEPT k=5, where the maximum is attained on an available cell and
    0.275554 / 0.124859 = 2.207 rests on no withheld value. The Red Team named its own falsifier and it
    is adopted into this decision's next action.
  - >-
    (f) MY RULING ON THE RECONSTRUCTION GATE, WHICH BOTH REVIEWS ATTACKED AND WHICH IS MY OWN OFFICE'S
    DEFECT, NOT THE EXECUTOR'S: THE GATE COULD NOT FIRE IN EITHER DIRECTION, AND I ADOPT THE RED TEAM'S
    STRONGER CHARACTERISATION IN FULL. The Validator and the Red Team are not in conflict here and I
    say so precisely. ON THE TWO PASSES: the Validator establishes, by an exhaustive search over all
    19 committed arrays and 228 ordered pairings NOT seeded from my mapping, that exactly one physical
    pairing of 114 reproduces each regime-N target within 1e-12, with next-best pairings missing by
    3.698e-03 and 1.351e-02 -- so as a test of ARRAY SELECTION the gate is genuinely discriminating
    there. The Red Team establishes that as a test of the RECONSTRUCTION HYPOTHESIS it bought almost
    nothing, because TASK-20260815-e61cca's own committed JSON already records both inputs
    (0.024506333220408173 and 0.029514095961871902), the method string AND the answer
    (-0.2682495157085447): THERE WAS NEVER A RECONSTRUCTION HYPOTHESIS FOR THOSE TWO CELLS -- THE
    SOURCE FILE STATES THE PAIRING -- and agreement at 8.3e-16 is what float64 does when you evaluate
    one expression twice. BOTH ARE TRUE; the second is the one that matters for what the gate bought,
    and I adopt it. This is the same defect family as EV-HQC-e458ef O11's algebraic tautology, one
    level up: not an identity true for any input, but a recomputation whose inputs the source already
    recorded. ON THE TWO FAILS: the gate was unpassable before any datum existed, because +2.836 and
    +1.402 exist in this repository ONLY at four significant figures, originating in
    BATCH-0e126d/reviews/TASK-20260814-a49f1c/red_team_report.md LINE 129 and carried at that precision
    into EV-HQC-469c08 O6, so a 1e-12 ABSOLUTE gate passes only on a measure-zero coincidence. THE FAIL
    CARRIES NO INFORMATION ABOUT THE MAPPING IN EITHER DIRECTION, and the Validator's formulation binds
    here: A GATE THAT CANNOT PASS IS NOT EVIDENCE THAT THE MAPPING IS WRONG. WHAT THE GATE ACTUALLY
    BOUGHT, STATED WITHOUT FLATTERY: a transcription-and-determinism check on two cells, and the
    DELETION of the regime-P half of the historical set on two cells where it could never have passed.
    Both reviewers independently found, by different searches, that at the precision the P comparators
    actually support (6000, P) ADMITS A SECOND PAIRING -- the Validator two pairings within 5e-4 with
    the spurious one at residual 3.392e-04, the Red Team the same spurious pairing at 3.39e-04 -- so at
    that precision the residual does not identify the mapping and SEMANTICS THE GATE NEVER EVALUATES
    DOES. THREE CORRECTIONS TO batch.yaml FOLLOW, APPLIED BY SUPERSEDING RECORD AND NEVER BY EDITING A
    FROZEN ARTIFACT. (1) "The gate proves the array selection is the right one" is TRUE AT 16 DIGITS
    AND FALSE AT 4, and is narrowed to: the mapping is corroborated to the full precision the record
    supports and to nothing beyond it. (2) The mapping IS nonetheless correct for all four cells,
    established INDEPENDENTLY OF THE GATE by the Validator's own construction -- the same source table
    records the SE inputs to six decimals (5000: 0.125106 -> 0.017520; 6000: 0.149899 -> 0.056725) and
    the arrays batch.yaml names round to exactly those, with the table's prose independently stating
    the same provenance. (3) THE TWO CELLS NONETHELESS STAY WITHHELD IN OFFICIAL STATE: the frozen rule
    is fail-closed, the producer applied it correctly and was right to, and this decision imports
    neither reviewer's recomputation of those cells into any predicate, contrast, branch or conclusion.
    The remedy is for a successor and is not applied here: gate at the comparator's OWN precision AND
    require uniqueness over all committed candidate pairings, which is 114 pairs and takes milliseconds.
  - >-
    (g) AN INSTRUMENT-GOVERNANCE RULING, WIDENING DEC-20260817-2b638b's SCOPED RETIREMENT AND STATING
    ITS BASIS AS empirical_only RATHER THAN LEAVING THE BASIS UNDECLARED. DEC-20260817-2b638b rationale
    (g) retired the 2-point local exponent of se_paired AT k=17 as a DIRECTIONAL statistic for this
    task family, pending calibration. THAT RETIREMENT IS WIDENED HERE TO EVERY TESTED ORDER: THE
    2-POINT (ZERO-DEGREE-OF-FREEDOM) LOCAL EXPONENT IS RETIRED AS A DIRECTIONAL STATISTIC FOR THIS TASK
    FAMILY AT EVERY k IN 2..26, PENDING CALIBRATION. The reason is rationale (e): moving to k=5 changes
    the units and not the resolvability, no cell in either set is separated from 0.5 by more than about
    2.4 of its own same-T noise scales at any tested k, and the fresh set's absolute collapse is itself
    gone by k=10. THE RED TEAM RECOMMENDS EXACTLY THIS WIDENING AND THE VALIDATOR'S NUMBERS SUPPORT IT;
    the Red Team also notes it is widening a recommendation of its own lineage, which is recorded. WHAT
    IS AND IS NOT RETIRED IS UNCHANGED IN KIND FROM THE PREDECESSOR RULING: it is NOT retired as a
    recorded measurement -- every value this family has published remains correct and reproducible, and
    where checked they are bit-identical -- and it does NOT touch any validity gate, disjointness
    proof, F-invariant, D2/D3 count or reproducibility result, none of which are 2-point exponents.
    What is removed is the basis for reading any of them DIRECTIONALLY at ANY k. This touches
    EV-HQC-469c08 O6 and O7 and EV-HQC-927899 O3 and O4 by superseding observation and never by edit,
    exactly as its predecessor did. BASIS, DECLARED EXPLICITLY PER docs/claims-and-verification.md
    "REFUTATION ARTIFACTS": the strongest checkable refutation artifact this result admits is neither a
    counterexample certificate nor a derivation note but an ARCHIVED EMPIRICAL MEASUREMENT, and it is
    declared empirical_only and archived at EV-HQC-4973ff -- in this same ledger commit and cited by
    this decision -- ahead of the decision relying on it. Its weaknesses are stated with it and not
    around it: n = 2 per shard, fresh windows only, transfer to the historical cells assumed and not
    discharged, and one independent corroboration at k=5 only. THIS IS WHY THE DISPOSITION IS refine
    AND NOT reject_scoped, and why the replication route is this decision's next action rather than a
    footnote. THIS IS A SCOPED RETIREMENT OF A STATISTIC, NOT A CLOSURE OF A LANE. Under
    docs/inventor-protocol.md section 4, closing this lane on this evidence would be premature closure:
    the obstruction is real, named, MEASURED, localised to a property of a two-point log-ratio of a
    jackknife standard error rather than to the shards, the regimes or HQC, and correctable at zero
    decoder cost with the replacement instrument already computed. Declining to state it would be a
    fatigue report. Neither is done. A count of six blind controls is a fatigue report about the
    search, not a statement about the problem, and I adopt the Red Team's words for that.
  - >-
    (h) THE BLINDNESS TESTS, APPLIED MECHANICALLY, AND THE VERDICT THE RULE REQUIRES AND WHICH BOTH
    REVIEWERS CORRECTLY REFUSED TO ISSUE. SHAPE: the coupled null's pooled median se_unpaired/se_paired
    is 5.143413 at k=5 against the eight real cells' range [8.545049, 11.126178] -> FAIL; 4.301179 at
    k=10 against [4.937997, 11.905557] -> FAIL; 2.826520 at k=17 against [2.338019, 28.691278] -> PASS.
    Per-rung verdicts agree with the pooled ones at every k, and the Validator independently recomputed
    the denominator from committed arrays and confirmed the k=17 range reproduces batch.yaml's
    pre-declared list exactly, so the test's denominator is the object frozen in advance and was not
    moved. POWER: all five contrasts pass at k=5 (widest MDE 0.6994) and at k=10, and the interaction
    FAILS at k=17 (MDE 4.4850 > 3.702). I THEREFORE DECLARE THE COUPLED NULL BLIND AT k=5 IN THE RULE'S
    VERDICT SENSE, ON ITS OWN PRE-DECLARED SHAPE TEST, AT THE ADJUDICATION ORDER FIXED IN ADVANCE. THE
    DECLARED FALLBACK FIRES MECHANICALLY: clause (a) of the CONTRAST CLAUSE is DROPPED and the clause
    stands on its band-free half alone. TWO THINGS ARE RECORDED WITH THE VERDICT RATHER THAN GLOSSED.
    (i) THE k=5 POWER PASSES ARE NOT INDEPENDENT REASSURANCE. The Validator shows POWER is nearly
    non-discriminating at the adjudication k: its 3.702 threshold is a k=17-scale quantity applied to a
    band that narrows sharply with k, so at k=5 the widest MDE is 0.6994, a factor of 5.3 of headroom,
    and POWER could realistically only fail there if the band were roughly five times wider than
    measured. THE BINDING TEST AT k=5 IS SHAPE, AND SHAPE FAILS BY A WIDE MARGIN. (ii) A SHAPE FAIL IS
    A STATEMENT ABOUT MODEL ADEQUACY, NOT ABOUT ANTI-CONSERVATISM: the coupled band is in fact WIDER
    than its uncoupled predecessor (+23.2% and +40.8% at k=17), reproducing EV-HQC-e458ef O12's finding
    that fixing the shape makes the diagnostic look worse rather than better.
  - >-
    (i) THIS IS THE SIXTH INSTANCE OF THIS CAMPAIGN'S CONTROL-BLINDNESS PATTERN AND IT IS NAMED AS
    SUCH, NOT SOFTENED -- after CTRL-BS, CTRL-POSHOM, CTRL-IDXMAP, BATCH-4b8ad3's planted arm and
    BATCH-91929e's null object. THE BATCH PRODUCED A SECOND UNCALIBRATED PARAMETRIC BAND AND THAT IS
    RECORDED IN THOSE WORDS. TWO DIFFERENCES FROM THE FIRST FIVE ARE RECORDED ALONGSIDE THE COUNT,
    BECAUSE THE CAMPAIGN NEEDS THE DISTINCTION AND BOTH REVIEWERS DREW IT INDEPENDENTLY. (1) THE
    VALIDATOR'S: unlike the prior five, which were blind in ways discovered AFTER the fact and mostly
    by reviewers, THIS ONE WAS PRE-DECLARED AS A MECHANICAL TEST BEFORE ANY DATA EXISTED, WAS RUN BY
    THE PRODUCER ON ITSELF, AND FIRED. A control that announces its own blindness at the k that matters
    is a working instrument for detecting blindness even though it is a failed calibration, and the
    SHAPE test deserves that credit. (2) THE RED TEAM'S: it is the first whose cause is a SINGLE
    MEASURABLE SCALAR whose measurement is already committed, so it is the first that is REPAIRABLE
    rather than merely nameable. Measured from TASK-20260809-a79e4f's stage_1.per_trial_S -- THE ONLY
    PER-TRIAL S ARRAYS THIS CAMPAIGN HAS EVER PERSISTED, in the very file Part A already opens for its
    regime-P T_lo arrays -- the real arms disagree on the last block on 0.1094 (shard 5000) and 0.1038
    (shard 6000) of trials, against the null's 2p(1-p) = 0.434647, which is not "a" coupling but the
    MAXIMUM compatible with the marginal: A 3.97x TO 4.19x OVER-STATEMENT OF THE PAIRED-DIFFERENCE
    VARIANCE. Repaired with a one-line change that preserves Binomial(56,p) EXACTLY and the forced zero
    difference EXACTLY, the SHAPE statistic moves from 5.14 / 4.30 / 2.83 to 10.25 / 9.04 / 9.25 --
    INSIDE the real cells' range at ALL THREE k -- and every band widens by 1.26x to 1.68x. SO THE
    BATCH'S SHAPE FAILURE AT k=5 IS AN ARTIFACT OF A NULL THAT IS STILL MIS-SPECIFIED, AND THE DATUM
    THAT FIXES IT WAS ALREADY OPEN ON THE PRODUCER'S DESK. That is a cost this decision records as an
