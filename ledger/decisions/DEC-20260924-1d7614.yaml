  rationale:
    - >-
      THE INCORPORATED READINGS DECIDE, AND THEY STAYED MONOTONE. RFR-1 was
      written before any of the three reviews; this review named a fail-open
      with a sequence from frozen code under a premise the lineage's own rules
      assign to the rule under review. The draft is not approvable as written,
      and the remedy is the one the readings name.
    - >-
      NO READING IS NARROWED AFTER THE FACT. The lost-record premise is not
      set aside because no ordinary path supplies it: the gap test exists to
      detect exactly that case, RFR-1 has no reachability condition, and the
      X1 / X6b / X10 precedent turns on what the rules posit, which here
      points the other way. (iv) stays literal; condition (iii) is applied as
      its author applied it, and said plainly to be weak for this class.
    - >-
      THE PART THIS DRAFT WAS WRITTEN FOR HELD. Positive attribution cleared
      every file of four real packages and every constructed normal outcome,
      where the previous rule refused planned bases; the prior's likeliest
      break did not happen. The failure is one level down, and specific.
    - >-
      POSITIVE PER FILE IS NOT POSITIVE PER LAUNCH. A positive source shared by
      several launches re-creates an absence-based condition ("some record
      explains this file"). The successor binds each shared source's
      multiplicity to counts a different code path writes, and the note
      KN-TECH-175a62 records the lesson with its limit (RGL-9).
    - >-
      THE CHAIN IS CONVERGING, AND SAYS WHERE. failclosed broke on a foreign
      process (FO-1); childend on ordinary outputs refused by design (PB-2,
      PB-3); gapattr only on a constructed lost record with no ordinary path.
      Each successor is smaller than the last. The revisit condition names the
      structural alternative (IE) if counting also fails.
    - >-
      FD IS KEPT, NOT SPENT, AND ITS TRIGGER IS UNCHANGED: a foreign-process
      fail-open, or a DV-18 (f) (xiv) / (xv) STOP on the r4 host.
    - >-
      THE LANE STAYS OPEN. Nothing measured D. NO SECURITY READING: toy
      EcGFp5-shaped arithmetic with known scalars; nothing transfers to
      p = 2^64 - 2^32 + 1.

  scope: >-
    This decision concerns the gapattr draft's approvability and the design of
    its successor only. Its readings rest on the archived review (a static
    reading of the frozen implementation-v2/ and implementation-v2-a1/ trees,
    the phase-A-bound r3 layer, both r3 plans, the three censuses, four
    archived r3 gate package listings with reconstructed launch sets, and the
    Python text of four third-party packages; zero runs) and this act's
    reading of the code named under bound_inputs. No package ran. Nothing here
    is a measurement of D. Nothing transfers to 262151, 16777291, 1073741831 or
    p = 2^64 - 2^32 + 1 as a result.

