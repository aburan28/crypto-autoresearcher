      - BJ-0: holds (high confidence).
      - BJ-1: holds; about one chance in five of a fail-open finding. The
        likeliest break: a count RI-1 reads that the r4 design derives from
        the launch records themselves (circular), or a lost record whose
        counted entries are lost in the same atomic write (RGL-9), which the
        approval act would have to rule on the same basis as CX-1.
      - BJ-2: the joint most likely to break (about one in three): an ordinary
        path on which the counts disagree by design - an S-1 or S-2 launch
        the resolve layer does not count (a refused-to-start attempt, a
        pass-through, a health solve outside HR-3), or an output path reused
        outside an event (a health check run twice at one p into one
        directory; a tag solved twice; a callgrind child twice for one tag).
        If it breaks, the useful outcome is the list.
      - BJ-3: holds.
      - BJ-4: holds (about three in four); the likeliest miss is an RI-4 list
        that omits one path-bearing field.
      - BJ-5, BJ-6: hold.
      A prior the review overturns is the most useful outcome here.

