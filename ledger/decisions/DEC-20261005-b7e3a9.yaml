  rationale:
    - >-
      EXPONENT FIRST, READ AGAINST THE USER'S GOAL. Semaev's chained-S_3 index
      calculus is the only candidate this program holds for "index calculus
      faster than rho on binary curves", and its exponent rests on one
      numbered heuristic, Assumption 1. The target profile's dispatch-bias rule
      asks for heuristic-validation experiments for exactly such conditional
      results. Two of them are approved and unrun, so they take the lanes.
    - >-
      THE TOP DRAFT IS NOT APPROVED BECAUSE ITS LIKELY OUTCOME IS THE ONE ITS
      DESIGN CANNOT AUDIT. e2b864 predicts PASS. Its decision statistics are
      paired family-minus-null differences through shared code, so a shared
      defect reads as PASS. JV-2 showed that six wrong drivers passed an
      un-powered gate on this goal. Approving the same blind spot again would
      repeat the program's own recorded failure.
    - >-
      3d9a71 IS RANKED BELOW e2b864 AND DISPATCHED NO LATER. Ranking orders
      lanes. 3d9a71's approval is a Coordinator decision that takes no lane,
      so it proceeds as soon as its snapshot verifies.
    - >-
      THE ARCHIVE DEFECT IN R5 IS STATED NOW, BEFORE ANY RUN, because a run
      whose outputs no task owns is the case AGENTS.md calls "not durable
      evidence", and finding it after the run would turn a binding error into
      an integrity correction.
    - >-
      THE HEAD IS RECONCILED, NOT ONLY SHARDED, because the resume tool reads
      the head.

