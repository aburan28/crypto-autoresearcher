    - id: R7
      question: Question attribution for H-SEMBIN-9c41f7.
      ruling: >-
        A NEW RESEARCH QUESTION UNDER GOAL-SEMBIN-5078bc. Its identifier
        RQ-SEMBIN-6d4e0b is reserved now and filed by the e2b864 approval
        decision, not here. It is not attached to RQ-SEMBIN-fa2e3f, because
        no limb of that question is a Wagner-filter gain. It is not attached to
        RQ-BINSTD-b6f698, because that question owns Koblitz curves sampled
        from E for ECC2K-130, a different domain. Attaching either would
        misstate the question the way H-SEMBIN-9c41f7's own question_id_note
        warns. The question is in the goal's lane because DEC-20261003-4e91b7
        R5 filed KN-OPEN-91d4f6 and carded its design here.
      fixed_question_text: >-
        On toy ordinary non-Koblitz binary curves, does any declared,
        poly(n)-computable F_2-linear or 1/x-linear x-label show a level-1,
        selection-corrected single-bucket gain G(M) = M_eff max_{c,d} pi_c(d)
        on the prime-order subgroup <P> that grows along M = 2^j beyond both a
        SHA null and an exact matched-marginal null, in ladder slope or in
        top-rung level (KN-OPEN-91d4f6)?
      goal_head_effect: >-
        The approval decision that files RQ-SEMBIN-6d4e0b adds it to the
        head's question_ids in its own ledger archive. This decision does not.

