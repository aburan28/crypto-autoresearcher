  # ---------------------------------------------------------------------------
  # R1. PORTFOLIO RANKING. Value rank, exponent-moving first. Dispatch order
  # follows value rank among items that are READY, within max_concurrent 2 on
  # GOAL-SEMBIN-5078bc. Archive tasks run alone and do not take a lane.
  # ---------------------------------------------------------------------------
  portfolio_ranking:
    profile: docs/target-result-profile.md (exponent-first; conditional rigor; validation at scale; cost honesty)
    user_goal_read_as: >-
      An index calculus faster than rho on binary curves. The only published
      candidate on the table is Semaev 2015's chained-S_3 index calculus over
      F_{2^n} (KN-LIT-fa346d). Its sub-rho conclusion at the FIPS sizes is
      conditional on Assumption 1 (d_F4 <= 4). So the experiments that test
      Assumption 1 are the heuristic-validation experiments for the
      exponent-moving conditional claim the user wants. They rank first.
    items:
      - rank: 1
        item: /run EXP-SEMBIN-35bf67
        kind: execution (approved, DEC-20261002-99c798; executor card TASK-20261002-530540)
        exponent_relevance: >-
          DECIDES THE LOAD-BEARING HEURISTIC. It locates the d_F4 = 4 versus
          >= 5 boundary of Assumption 1 as a surface in (n, k) from one-sided
          SOLV4 certificates. It reproduces Semaev's (40,2,2,20) baseline and
          probes Kosters' (45,2,2,23) counter-datum. The goal's own impediment
          note records that degree 5 raises the n = 409 memory figures by 19.4
          bits. Completion criterion 3.
        why_this_rank: >-
          Highest information about whether the only sub-rho binary index
          calculus survives at all. It is approved and complete. Its Stage-1
          engine gate is also the first chance to clear IMP-SEMBIN-ENGINE.
        ready_when: A run-snapshot archival card is bound for it (R5).
      - rank: 2
        item: /run EXP-SEMBIN-79a02d
        kind: execution (approved, DEC-20261002-5a576d; executor card TASK-20261002-fc71d6)
        exponent_relevance: >-
          INTERPRETS RANK 1. It decides whether the SOLV4 and Macaulay-rank
          instruments measure Semaev's d_F4. Without that map, rank 1's surface
          is a SOLV4 surface, not an Assumption-1 surface, and GOAL-DREG-001's
          degree-5 and degree-6 data stay unreadable (KN-OPEN-d218ec).
          Completion criterion 1. It is the approved successor to
          EXP-SEMBIN-c2c312 (DEC-20260921-2c62d7). Whether it discharges each
          of 2c62d7 next_actions [1] to [4] is checked at its review, not
          asserted here.
        why_this_rank: >-
          It is coupled to rank 1, and the two together use the goal's two
          lanes. It ranks below rank 1 because it maps an instrument rather
          than locating the boundary.
        ready_when: A run-snapshot archival card is bound for it (R5).
      - rank: 3
        item: EXP-SEMBIN-e2b864 (re-draft TASK-20261005-e93d27, then approval)
        kind: design completion (non-execution; zero runs)
        exponent_relevance: >-
          A NEW EXPONENT MECHANISM. KN-OPEN-91d4f6 is one of the two places in
          this lane where an exponent can move (DEC-20261002-7a3f19 R10). An
          F_2-linear x-label with single-bucket gain growing along M ~ l^theta
          on <P> is the ingredient a Wagner/HGJ tree on an approximate quotient
          needs. The predicted outcome is the null (PASS). A REFUTED reading is
          possible rule-12 material.
        why_this_rank: >-
          It is the top-ranked unapproved SEMBIN experiment, ranked above
          3d9a71. KN-OPEN-91d4f6 (Related open surface) says of 3d9a71: "It is
          a one-fibre probe and does not settle this question." 3d9a71 also
          carries sota_delta 0 under every outcome. e2b864 is not approvable
          now (R2).
        ready_when: TASK-20261005-4c1f86 and TASK-20261003-d05b93 receipts verify, and a lane is free.
      - rank: 4
        item: Design of the KN-OPEN-8f3d27 restricted-solving-degree test
        kind: design (not carded)
        exponent_relevance: >-
          The other exponent place in the lane. A proof of KN-OPEN-8f3d27 part
          2 would make the V-restricted index calculus heuristically
          subexponential (KN-OPEN-8f3d27, Exponent stake).
        why_this_rank: >-
          It needs a degree instrument. No design is carded until a Stage-1
          engine gate passes in rank 1 or rank 2. REVISIT TRIGGER: the
          decision that reads the first passing engine gate cards
          /design-experiment for it. This is a dependency, not a
          deprioritisation.
      - rank: 5
        item: IDEA-20261003-cd1903 (GOAL-ECDLP-001), with IDEA-20261003-76df35's C(E) census as a shared Stage 0
        kind: design of an open ECC idea (advisory here; carded in its own goal)
        exponent_relevance: >-
          In the algebraic-omega model the window alpha in (1/2, 3/4], which
