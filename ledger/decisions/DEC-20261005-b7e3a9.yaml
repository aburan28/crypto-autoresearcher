  # ---------------------------------------------------------------------------
  # Rulings
  # ---------------------------------------------------------------------------
  rulings:
    - id: R2
      question: >-
        Is EXP-SEMBIN-e2b864 (the top-ranked unapproved SEMBIN experiment)
        complete enough to approve now?
      ruling: >-
        NO. It is strong on observable, nulls and controls, and missing in
        seven places. Two of them are design defects that only a re-draft can
        fix (E4, E5). One is a ruling this decision supplies (E3, via R7).
        Four are mechanical or archival (E1, E2, E6, E7). Under
        DEC-20261002-7a3f19 R11 and DEC-20261003-4e91b7 R6 precedent, a draft
        that was never approved is RE-DRAFTED as version 2 under the same
        identifier, not amended. Version 1 is not edited.
      audit:
        proof_search_map:
          baseline_reproduction: >-
            PASS. FX-1 and FX-2 reproduce RT-EXP-1's RNG-free cells at
            p = 65539, M = 40 (1.0859 and 1.0742) to 5e-5, and FX-3 checks the
            sampled estimator against the exact per-cell pi. The
            characteristic-2 baseline is exact: CE-TR = 2, CE-AS = 2 and
            CE-Z4 = 4 on E(F_{2^n}), with zero violations.
          observation_collision: >-
            PARTIAL. The enumerated confounds each have a null or control:
            marginal skew (N-MM), the finite-population floor (N-SHA), domain
            leakage (CP-*, DOMAIN), selection bias (split sample) and degenerate
            characters (M_eff, degeneracy audit). Not searched: defects common
            to the family arm and the null arm. Every decision statistic is a
            paired family-minus-null difference through one code path, so a
            defect shared by both arms cancels and reads as "tracks the nulls",
            which is the predicted PASS. This is closed by E4.
          quantifier_order: PASS (declared families with alpha fixed per curve before the run; per curve and rung; best cell chosen after seeing half A)
          method_ceiling_and_nearby_object: "PASS (level 1 only; E(F_{2^n}) where the exact gain h is attained; E(F_p) fixture)"
          interface_obligations: >-
            PASS WITH A NOTE. Estimator unbiasedness at the held-out cell and
            the N-MM bijection properties are listed obligations. The chord
            identity is checked at run time by G-CHORD, not assumed. The PL-X
            3/4 constant uses a recalled beta(3) = pi^3/32. FX-4 records it but
            does not gate it, so an EDGE control that fails to trip yields
            INCONCLUSIVE, never a false reading.
        controls: >-
          PASS. Two nulls, both required to separate. Exact positive controls
          alive on E and dead on <P>. Planted FLAT and EDGE controls under both
          rules. PL-MM-COLLAPSE. NULL-FLOOR. These are among the strongest
          control sets this lane has designed.
        gate_failure_power: >-
          FAIL. The JV-2 lesson (DEC-20261002-7a3f19, joint JV-2 and the R3
          order) is that a gate's power must be designed against each named
          defect class: off-grid, domain predicate, enumerator, shared input,
          baseline column. A self-test certifies power only against its own
          mutation sites. e2b864 has NO mutation self-test, NO wrong-
          implementation suite and NO independent recomputation of the
          decision table. Its gates (G-CHORD, DOMAIN, G-Z4, AS identity, mask
          and normal-basis checks) cover arithmetic and domain only. The
          dangerous classes here are the ones that bias toward a FALSE PASS,
          because PASS is the predicted outcome and sharpens KN-OPEN-91d4f6's
          negative route. Three examples: an N-MM sigma that is accidentally
          a homomorphism (a multiplier map, which the design itself names as
          forbidden), nulls evaluated on the family's own labels, and
          selection and estimation drawn from overlapping halves. None has a
          designed catching gate.
        frozen_parameters_and_thresholds: >-
          PASS WITH TWO GAPS. Frozen: n in {19, 23, 31, 41}; three roles per
          n; S = 2^30, S_E = 2^24, S_FX = 2^26; eight blocks with two halves;
          eligibility >= 100; slope 0.10; level 0.10; Bonferroni 0.05 over 12
          (family, rule) cells per n; REFUTED at >= 2 n including 31 or 41;
          the j_max rule; FX tolerance 5e-5. Not frozen: the PRP round
          function ("SHA-256 or keyed BLAKE2b, declared in the manifest") (E5);
          a numeric per-run watchdog and checkpoint unit, since
          wall_clock_seconds_per_run and total_cpu_hours are null (E6). The
          overall null probability of a REFUTED or BOUNDED-EXCESS outcome
          across 4 n under the >= 2 n rule is unstated (E7). E7 asks for a
          statement only; no threshold changes.
        hypothesis_and_question: FAIL. H-SEMBIN-9c41f7 is an unfiled draft with question_id null; the contract's own precondition requires filing (E3).
        snapshot_and_identifiers: OWED. TASK-20261003-d05b93 has not run (E1). The draft ids and the YAML parse are unchecked (E2).
      missing_items:
        - id: E1
          what: >-
            TASK-20261003-d05b93 receipt verifies, in DEC-20261003-e2a917 R6
            mode (R4 below). The approval must read fixed bytes of version 1 and
            of version 2 (TASK-20261005-0a6bd5).
          closed_by: TASK-20261003-d05b93 and TASK-20261005-0a6bd5
        - id: E2
          what: >-
            Identifier checks for IDEA-20261003-5a2c9e, H-SEMBIN-9c41f7 and
            EXP-SEMBIN-e2b864 (`allocate_id.py --check`; `git grep -l <token>
            HEAD`), a strict yaml.safe_load of every draft, and
            `tools/validate_ledger.py` with zero new errors for any draft path.
          closed_by: TASK-20261003-d05b93 (id checks) and TASK-20261005-0a6bd5 (version 2 parse)
        - id: E3
          what: >-
            H-SEMBIN-9c41f7 needs a resolvable question_id. Ruled in R7:
            RQ-SEMBIN-6d4e0b (reserved). The re-draft carries it, and the
            approval decision files the RQ, the hypothesis and
            IDEA-20261003-5a2c9e together.
          closed_by: R7, then the approval decision
        - id: E4
          what: >-
            GATE FAILURE POWER (the JV-2 standard, R3 by analogy). (a) An
            independent module B recomputes every per-n decision vector from
            the sealed histograms: G_sc, beta, both Deltas, the CIs, NULL-FLOOR,
            REFUTE-n and the outcome. It shares no code with module A and must
            agree exactly. (b) A declared mutant table with at least one mutant
            per JV-2 class (off-grid or mislabel, domain predicate, enumerator,
            shared input, baseline column), plus estimator-specific classes.
            Each mutant names its expected catching gate and whether it biases
            toward a FALSE PASS or a FALSE REFUTE. Every false-PASS mutant must
            be caught by a STOPPING gate. The minimum set is listed in
            TASK-20261005-e93d27. (c) A null-equivalence gate: synthetic all-null
            label streams through the full machinery must give no REFUTE-n and
            no BOUNDED-EXCESS beyond the rate E7 states. (d) The suite runs in
            RUN-1, and an uncaught mutant makes the experiment INVALID before
            any family histogram is unsealed.
          closed_by: TASK-20261005-e93d27
        - id: E5
          what: Freeze the PRP round function, one named choice, before RUN-1.
          closed_by: TASK-20261005-e93d27
        - id: E6
          what: >-
            State a numeric per-run watchdog (wall_clock_seconds_per_run) and
            the checkpoint unit (curve x block) for deterministic resume. The
            later executor card must carry non-null budget fields, and a
            Coordinator card with a null budget field is rejected. CPU stays
            advisory.
          closed_by: TASK-20261005-e93d27
        - id: E7
          what: >-
            State, as scratch arithmetic, the probability under the global null
            of REFUTED and of BOUNDED-EXCESS given the per-n Bonferroni 0.05
            over 12 cells and the >= 2-n rule. Thresholds stay unchanged. This
            is a disclosure that a screening rule needs before approval, not a
            re-tuning.
          closed_by: TASK-20261005-e93d27
      what_remains_after_the_redraft: >-
        Version 2 returns, then TASK-20261005-0a6bd5 verifies, then an approval
        decision checks E1 to E7 item by item. That decision files
        RQ-SEMBIN-6d4e0b, H-SEMBIN-9c41f7 and IDEA-20261003-5a2c9e, moves the
        contract into experiments/EXP-SEMBIN-e2b864/, and writes the executor
        card (non-null budget) and its run-snapshot card. A ledger archive
        follows, and then the named execution is /run EXP-SEMBIN-e2b864. None
        of this is approved here.

    - id: R3
      question: >-
        EXP-SEMBIN-3d9a71 version 2. Where does it stand against
        DEC-20261003-4e91b7 R6 X1 to X9 and the JV-2 standard?
      ruling: >-
        PRE-AUDIT PASSED ON THE CONTENT ITEMS; NOT APPROVED. The approval
        decision may follow TASK-20261003-7a4c19 directly, with no further
        design work, provided 7a4c19 verifies and the two report-only re-checks
        below pass. This is a reading of the draft, not an approval.
      items:
        X1: >-
          The verbatim blocks in heuristic_as_stated match
          ledger/hypotheses/H-SEMBIN-c7e1d4.yaml at the lines cited (preamble
          371-378, clause (a) 379-392, SCOPE 397-403, falsification_condition
          439-444), compared by this Coordinator on the working tree. The
          sha256 that binds the file exists: the 6d2f84 receipt records
          7f28bdb1bc9ca0707e667b99fb93ab09fe596c93ddb44696b137c58f7d6192b4, and
          the file passed C3's single-commit test there. The draft's
          source_sha256 stays null, because the draft is not edited. The
          approval decision records the value. Re-check owed: the same sha256
          at the current merged HEAD.
        X2_to_X8: >-
          Met, per DESIGN.md section 1, and spot-checked here. Z4 and raw Z3
          decide. N_2 is gated by G9 and only reported. There are two-sample
          stratified permutation tests, a split-half null calibration at a
          frozen theta_SH = 5.13e-6, and GU at 5e-4. The Koblitz families are
          re-derived, with G3 corrected and G16 brute force. KS is dropped and
          the sigma-stable sub-clause is UNTESTED. m_max = 270 is frozen. The
          tested law is conditioned on |F_V| > 0, with the skip rate logged.
          decision_it_changes and hypothesis_link are rewritten.
        X9: >-
          The 6d2f84 identifier row for EXP-SEMBIN-3d9a71 lists only the
          version-1 and version-2 draft definitions, and DEC-20261003-4c81fa R5
          rules that this is not a collision. The version-1 receipt
          (TASK-20261002-5f0b2c) is substituted by C1 and C3 content
          verification in the 6d2f84 receipt (DEC-20261003-e2a917 R1, R3).
          Re-check owed: `git grep -l 3d9a71 HEAD` at the current merged HEAD.
        JV2_gate_power: >-
          Meets the R3-by-analogy standard at design level. Module B shares no
          code with module A. The draft maps every JV-2 class to gates
          (DESIGN.md section 9: off-grid and mislabel to G6 and G7; domain
          predicate to G1, G3 and G16; enumerator to G2; shared input to G8;
          baseline column to G7, C-NULL and G14). Its mutant table has at
          least one mutant per class. This Coordinator's classification: off-grid
          M16 and M20; domain predicate M1, M2 and M24 to M26; enumerator M3;
          shared input M5, M11 and M12; baseline column M7 to M9 and M18. The
          draft names catching gates for M10 and M21 to M30 explicitly. For M1
          to M9 and M11 to M20 it says "as in v1", and those were not re-read
          here. G12 measures every mutant, and an uncaught mutant makes the
          run INVALID.
        remaining_before_its_approval:
          - TASK-20261003-7a4c19 receipt verifies (R6 mode).
          - Report-only re-check (a) on TASK-20261005-4c1f86 passes (X1 sha256 at HEAD).
          - Report-only re-check (b) on TASK-20261005-4c1f86 passes (git grep 3d9a71 at HEAD).

    - id: R4
      question: TASK-20261003-d05b93's producer output is already on main. How does it run?
      ruling: >-
        In DEC-20261003-e2a917 R6 mode, the same mode as 7a4c19 and f2b6e0.
        It content-verifies coordination/tasks/TASK-20261003-3c8ea2/ on the
        merged tree with C1 (the producer's declared set: DESIGN.md and the
        three proposed-records drafts), C3 (write-once history) and C6 (commit
