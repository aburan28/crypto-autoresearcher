        re-commit already-merged bytes, and it commits only its receipt.
        Evidence for the premise: the 6d2f84 receipt's parent_sha names "the
        TASK-20261003-3c8ea2 design commit" beneath 6d2f84's commit, which
        reached main via PR #1784 as the dispatching session reports. If C1
        finds the directory absent from origin/main, d05b93 runs as written
        instead, and the receipt says so.

    - id: R5
      question: Are the three approved SEMBIN runs dispatchable as carded?
      ruling: >-
        NOT YET, FOR AN ARCHIVAL-BINDING DEFECT. The executor cards
        TASK-20261002-530540, TASK-20261002-fc71d6 and TASK-20261002-e71399
        set archived_by to TASK-20261002-af3c9f, TASK-20261002-8480bf and
        TASK-20261002-39f6cf. Those are DESIGN-PACKET snapshots. Each declares
        only its packet paths and has already produced its receipt (present
        under coordination/goals/GOAL-SEMBIN-5078bc/design/). The run outputs
        (implementation/, runs/, stage0-3/, RESULTS.md) are therefore owned by
        no archival task, which breaks AGENTS.md standing precondition 1. This
        is an evidence-integrity binding defect. It is not a scientific
        defect, and it does not reopen any of the three approvals. REMEDY: one
        run-snapshot card per experiment, staging exactly that executor card's
        artifact_paths, bound before its /run is dispatched. Those cards are
        NOT written in this decision, because of the user's two-handoff limit
        for this session (PD-2). They are the first Coordinator write of the
        next session, at zero compute. If the user invokes /run directly first,
        AGENTS.md "Harness entry point" governs: the launcher runs and every
        output is retained. The binding is then made afterwards and disclosed
        in a correction as a remedy, not as compliance. No run output is read
        as evidence before its snapshot verifies.
      cards_not_edited: >-
        The three executor cards are immutable and keep their archived_by
        values. The binding is supplied by new cards that cite this ruling.

