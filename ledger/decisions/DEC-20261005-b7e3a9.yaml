        edited, and active_hypothesis_ids are recorded in the shard only.
      why_the_head_is_edited: >-
        tools/goal_head.py reads the head's next_action as the resume field.
        DEC-20261003-e2a917 next_actions asked for a decision that "writes ONE
        head next_action". A reconciliation that left the head at 2026-09-15
