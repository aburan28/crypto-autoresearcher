coordinator_decision:
  id: DEC-20261005-0305c1
  context: >-
    Design tick on 2026-10-05. origin/main was fetched and this
    branch was created at 0b8c5f815b, which includes the merged
    ENDO contract H-ENDO-58fc5c. That contract is a different
    question. IDEA-20261004-edbd24 already has an E[4] contract.
    That contract excludes every torsion module other than E[4].
    The same eight endomorphisms have not been read on E[8].
  decision: approve
  target_ids:
    - IDEA-20261004-edbd24
    - H-SSI-915a14
    - EXP-SSI-5bacb4
  rationale:
    - >-
      SSI is an ECC area. The contract partitions eight
      endomorphisms of y^2 = x^3 + x by their fixed points in
      E[8] at primes 7, 23, and 31, the first primes at which
      that module lies in E(F_{p^2}).
    - >-
      A design-session count, not a run, gave seven fibers at
      each prime and a different fixed-point vector at p=31.
      Both Frobenius routes must recompute the membership.
    - >-
      Standing user authorization of 2026-09-06 covers approval.
      The protocol fields required before dispatch are filled.
    - >-
      H-SSI-cb227f, EXP-SSI-494592, and H-ENDO-58fc5c are not edited.
  evidence_refs: []
  limitations:
    - The module has sixty-four points. The interface is equality bits only.
    - iota and iota^3 fix the same two points for an algebraic reason that is not special to E[8].
    - Approval authorizes six deterministic runs. It does not assert the fibers.
  next_actions:
    - >-
      Snapshot-archive this contract. Do not launch
      TASK-20261005-a87161 until the receipt verifies.
  knowledge_promotion:
    promoted: []
    not_warranted: Approval of an unrun contract. No finding is promoted.
  decided_by: coordinator
  decided_at: '2026-10-05'
