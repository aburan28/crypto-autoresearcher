  rulings:
    - id: R-1
      subject: STOP-1 (which option)
      ruling: >-
        A strengthened option (A), written as AMD-20260929-430f44 M-1..M-6.
        Every unfinished job runs as its own census process with --workers 1
        and the frozen flags restricted to that job. At most four such
        processes run at once, each under the unchanged 3.5e9-byte cap. The
        engine code is unchanged. R11 resumes exactly its 33 job-crash jobs
        in attempt-2, R12 and R14 run this way from their start, and R13
        keeps its frozen command.
      why_this_option: >-
        The committed code shows the likely failure point: the pool parent
        keeps every completed Future's result, including all retained harvest
        rows, and unpickles each result under its own cap. The executor's
        option (A) with --workers 4 would keep a pool and a pickled transfer
        per job. With --workers 1 there is no pool, no Future and no pickle,
        and the process holds exactly the working set a worker held in
        attempt 1. The worker count is the one flag changed, and I-5 plus the
        R01a determinism test already require it to change nothing. IE-1
        checks this directly on one completed job before any resumed job
        runs.
      options_not_taken:
        B: >-
          A streaming code change in _census_job and cmd_census would be
          robust, but it is a post-data code change to functions that
          produced R10 and 396 R11 instances. It would need a fresh C-2-style
          certificate and a full R11 re-run, and it adds risk that the
          invocation change avoids.
        C: >-
          Raising a cap or changing the worker envelope is machine
          protection, not a research lever. It is not taken, and nothing in
          the chosen option needs it.
        D: >-
          Accepting the loss would leave m = 4, and almost certainly m = 5,
          empty at 12-24 bits. That removes whole A1 rungs and weakens the
          dynamic-range controls, when a cheap equivalent route exists.
          Declining that route would be premature closure.
    - id: R-2
      subject: R12 (m = 5) very likely hitting the same failure
      ruling: >-
        R12 is never attempted under its frozen single invocation. It runs
        all 55 jobs under the per-job procedure from its start (M-2). R14 does
        the same, because every R14 job is at bits <= 24 and retains every
        harvested row. R13 has no harvest rows and keeps its frozen command.
        Any frozen-invocation attempt that ends with job-crash rows resumes
        those jobs the same way (M-2 general rule).
      residual_risk_and_bounded_fallback: >-
        A single 24-bit m = 4 or m = 5 job may still exceed the per-process
        cap inside an instance. The frozen code then records that instance
        failed_infrastructure ("address-space cap:", with ru_maxrss) and the
        job continues. For such jobs M-4 allows one per-arm re-run of the
        affected arms, main panel only, after IE-2 proves per-arm
        equivalence. Its outcome is final. No other retry exists.
    - id: R-3
      subject: making the rows R15 reads complete and unambiguous
      ruling: >-
        M-5 defines, per run, a cell universe U and one canonical row per key
        in U. A key keeps its attempt-1 row unless its job was resumed, in
        which case the row comes from the latest attempt that ran it. A key
        with no row gets a placeholder failed_infrastructure row. Non-cell
        rows are excluded and listed, and duplicates within an attempt stop
        the run. Canonical rows and staircases are sorted by (bits, curve, m,
        arm, mode). R11's canonical files go to <R11>/merged/, because its
        root holds attempt 1 as archived. R12, R14 and R16 write theirs at
        the run root. R15 runs the pinned analyze_census.py unchanged
        (c40ea02f...) with --runs-dir pointing at a view of symbolic links:
        merged/ where it exists, the run root otherwise (M-6).
      why: >-
        analyze_census.py keeps the last row per key and bootstraps over row
        order with fixed seeds. Duplicates or an arbitrary order would
        therefore make R15 depend on how the files were assembled. The
        EXP-PFDR-7c8bf2 review showed that such order effects can decide an
        outcome id at the Monte Carlo level (DEC-20260929-1b779a, finding
        G-1). Editing the pinned analysis after data exist would be a
        post-data change. Writing into R11's archived root would overwrite
        an immutable record. The view changes only one path argument.
    - id: R-4
      subject: another build-equivalence certificate?
      ruling: >-
        No new certificate of the C-2 kind. C-2 certified engine-code changes
        between builds. Nothing in the engine, CLI, tests or analysis changes
        here, so BI-1 requires every pinned file to equal its R11 attempt-1
        and dc61c5e1e bytes. The changed invocation is covered by I-5 and the
        R01a determinism test, and checked directly by IE-1 (and IE-2 before
        any per-arm fallback). The two new harness scripts import no engine
        module. They are pinned before use and exercised on dummy commands
        and synthetic fixtures only. R01a stands as G3 for this build.
    - id: R-5
      subject: the pool break and its 594 rows
      ruling: >-
        The pool break is failed_infrastructure and never evidence about any
        base, class, m or prediction. The 594 job-crash rows stay in R11's
        archived root file, unedited. In the canonical set they are
        superseded, not deleted, by the attempt-2 rows of the same keys. The
        resume set is defined mechanically, before any of its data exist, as
        every job with only job-crash rows. No instance outcome was observed
        for those jobs, so resuming them is not adaptive sampling.
    - id: R-6
      subject: DEV-1..DEV-4
      ruling: >-
        Material and ratified (AMD-20260929-430f44 M-8): DEV-1 (ru_maxrss and
        the address-space-cap label, required by C-8 D-2), DEV-2 (G3 reads
        R01 and R01a) and DEV-3 (the H3 permutation tally restricted to
        A3-qualifying instances). DEV-1 is inside E-3's allowed functions and
        certificate-passed; DEV-2 and DEV-3 were pinned before R10. Accepted
        as recorded: DEV-4 (summarize_run.py correction, post-processing
        only; the corrected hash governs BI-1). Also accepted as recorded:
        the venv interpreter (C-8 D-12) and the skipped msolve tests (D-15).
    - id: R-7
      subject: run-level label "partial_failed_infrastructure"
      ruling: >-
        Not a status value (M-7). R11's attempt-1 manifest keeps the label,
        because it is immutable, and the label is read as
        failed_infrastructure at attempt level with its completeness counts.
        R11's run-level status is written once, in <R11>/merged/manifest.yaml,
        by M-7's rule. Later records use completed_valid,
        failed_infrastructure or invalid plus a completeness field.
    - id: R-8
      subject: the 66 non-cell known_log rows at m = 4
      ruling: >-
        They are artefacts of the frozen job_failure path, which ignores the
        known_log applicability rule. They are retained unedited in the
        archive and excluded from the canonical set and listed (M-5 (3),
        M-9). They are never counted as instances or failures, and never
        evidence. No code change.
    - id: R-9
      subject: pre-data status
      ruling: >-
        PRE-DATA for every quantity R11-R15 measure (AMD-20260929-430f44
        pre_data_assessment). This Coordinator read statuses, counts, RSS and
        timing only, and no change depends on a value. The one order-bearing
        choice (M-5 (7)) is fixed by rule. Residual risk: the executor's
        attestation that no measured quantity was read. It is mitigated by a
        fresh session and the unchanged analysis pin.

