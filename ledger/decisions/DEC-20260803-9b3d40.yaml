coordinator_decision:
  id: DEC-20260803-9b3d40
  context: >-
    /review-evidence for EXP-MLKEM-007 (frozen, approved 2026-07-27,
    claim_tier toy), executed by the Executor under TASK-20260727-012 and
    snapshot-archived by the Coordinator at commit 12be4ae7 (parent 59ef3299,
    receipt experiments/EXP-MLKEM-007/archives/snapshot_receipt_20260802.json).
    Four planned runs, four terminal: RUN-MLKEM-025 completed_valid (controls,
    915.65 s), RUN-MLKEM-026 completed_valid (n=32 gate, 17.72 s),
    RUN-MLKEM-027 resource_exhaustion (n=64, 1700.01 s, ZERO of 30
    dimension-248 LLL reductions completed on a pure-CPython host),
    RUN-MLKEM-028 completed_valid (analysis, 15.44 s). The n=32 gate PASSED
    (held-out r_eff 3.9828 >= 2.0; exact equality; charged work GLS
    292,105,468 < unfused 293,491,916), so RUN-MLKEM-027 was executed rather
    than gate-stopped. Against the frozen thresholds at n=32: the m50 ratio
    (8.0x vs >= 2x) and the charged-work ratio (0.995276 vs < 1) are MET; the
    GLS-versus-unweighted false-positive-rate ratio is 1.000 under BOTH
    pre-registered readings against a required <= 0.5 and is NOT MET; the
    orbit-versus-permutation gain is 0.021722 bits on the frozen counted_exact
    metric against a required >= 1.0 bit and is NOT MET. The frozen precedence
    yields first match fusion_no_advantage, at n=32 only. Ten protocol
    deviations and nine anomalies are recorded. This decision adjudicates that
    run set, sets the official status of H-MLKEM-007, and rules on PD-5 and
    PD-1.
  decision: weaken
  target_ids:
    - H-MLKEM-007
    - EXP-MLKEM-007
    - EV-MLKEM-c47a1e
    - TASK-20260727-012
    - HEUR-001

  rationale:
    - >-
      VALIDITY FIRST, INTERPRETATION SECOND. Before reading a single threshold
      the Coordinator re-verified: expected run count (4 planned, 4 terminal,
      0 missing, matching the frozen expected_run_count); schema completeness
      of all four manifests (exact command, commit and dirty state,
      environment and dependency versions, seeds and derivation paths,
      inference block, timestamps, resources, stdout/stderr, raw and summary,
      validity status); seed discipline (30 seeds, 15/15 split enforced before
      any fitting, held_out_seeds_read_by_fitting_phases empty and violations
      empty in every manifest, fitting phases reading exactly seeds 1-15);
      seed integrity (all 30 planted layers re-derived from the recorded
      derivation paths by the sampler alone, 30/30 matching); raw/summary
      agreement; and control comparability (all five rules on identical
      instances, vectors and thresholds at all ten grid points). The
      Coordinator additionally recomputed r_eff from the archived held-out
      covariance (3.98283), the charged-work ratio (0.995276), the projected
      gain bits (0.006831 and -0.014891) and their difference (0.021722), all
      matching the recorded values. The run set is ADMISSIBLE. It is not
      returned to the Executor.
    - >-
      CERTIFICATES ARE `none` AND THAT IS RECORDED, NOT ASSUMED. Each of the
      four manifests' result.certificate was read directly: kind `none` in
      every case. This experiment claims no discrete-log solve and no
      factor-base relation, so there is nothing to certify. RUN-MLKEM-026's
      planted-layer re-verification is an INSTRUMENT check, not a solution
      certificate, and is deliberately excluded from EV-MLKEM-c47a1e's
      certificate_refs so no reader mistakes it for one.
    - >-
      THE n=64 ARM IS UNEVALUATED, NOT FAILED. RUN-MLKEM-027 completed ZERO of
      30 required reductions at dimension 248 within its frozen 1700 s stage
      budget, on a host with no numpy, fpylll or Sage and with
      network_operations none. Under AGENTS.md rule 5 and the specification's
      own stopping rules this is an infrastructure outcome with ZERO evidence
      value. Half the frozen success criterion -- r_eff >= 4.0 and >= 4x
      vector-count reduction at n=64 -- was therefore never tested, and the
      n=64 limb of the frozen correlated_reindexing disjunction is neither true
      nor false. No value is inferred for it anywhere in this decision or in
      EV-MLKEM-c47a1e. Everything below is scoped to n=32.
    - >-
      A REFUTATION ARTIFACT WAS SOUGHT BEFORE THE ADVERSE CALL, AND ONE WAS
      OBTAINABLE. docs/claims-and-verification.md requires the strongest
      checkable artifact the result admits, in order. Level 1, a counterexample
      certificate, does not apply: the failing prediction is a distributional
      threshold, not a per-instance witness. Level 2, a derivation note, WAS
      achievable and is archived at
      experiments/EXP-MLKEM-007/analysis/refutation-note-gls-vs-uniform.yaml.
      From the archived held-out covariance: GLS weights are
      Sigma^{-1}1/(1'Sigma^{-1}1) and equal uniform weights exactly when Sigma
      has constant row sums; the measured row sums have a coefficient of
      variation of 7.7 percent, and the attainable variance gain is second
      order in that quantity. Exact evaluation gives an ORACLE variance ratio
      of 0.99407, i.e. a 0.297 percent reduction in the fused null standard
      deviation, whereas a 2x tail-FPR reduction at tau = 3.0 requires about
      6.4 percent -- a shortfall of roughly 22x. The realised estimator, fitted
      on 15 training instances, was 0.0258 percent WORSE than uniform out of
      sample. So the measured ratio of 1.000 is what the algebra predicts, not
      a surprising null. proof_status on EV-MLKEM-c47a1e is `derivation`, not
      `empirical_only`, and the basis is declared.
    - >-
      WHY `weaken` AND NOT `reject_scoped`, STATED PLAINLY. A scoped rejection
      confined to (n=32, d_shift=8, |J|=4, this pool construction) would have
      been defensible: a derivation-grade artifact exists, the falsification
      class was pre-registered, both readings of the ambiguous metric were
      pinned before any run, all controls passed, and the shuffled-label null
      is flat at 0.000. It is declined for two reasons. FIRST, this is a SINGLE
      EXECUTION. The byte-identical re-run establishes determinism -- same
      host, same executor, same implementation -- not independent replication,
      and rejecting a theory deserves the same skepticism as confirming one.
      SECOND, the derivation is conditional on the MEASURED Sigma, which is one
      measurement at one pool construction and one d_shift; it explains why the
      criterion failed here and bounds nothing about Sigma elsewhere in the
      frozen parameter space.
    - >-
      THE MECHANISM'S OWN EXISTENTIAL WAS TESTED AT ONE POINT, AND THE
      RESTRICTION WAS INFRASTRUCTURAL. H-MLKEM-007 quantifies over "at least
      one selected orbit subset of size at most 32". Shift invariance of the
      guess block forces |G| = |J| = n/d_shift; with the frozen d_shift = 8 the
      only reachable choice at n=32 on a pure-Python host was |J| = 4, with 81
      enumerable candidates (PD-2, PD-3). Subsets of size up to 32, and
      alternative d_shift values admitting |J| = 8 or 16, were never evaluated.
      Under AGENTS.md rule 5 an infrastructure-driven restriction of a search
      space cannot be converted into a negative mathematical result about the
      part never searched. This is on its own sufficient to bar
      reject_scoped from covering the hypothesis as written.
    - >-
      WHAT IS NOT WEAKENED. The isometry-reuse premise survives this
      experiment. All four orbit elements are signal-preserving (m50 64),
      whereas the size-matched random signed-permutation control's are not
      (m50 1024) -- being size-matched it comprises the identity plus three
      non-commuting signed permutations whose scores carry no signal and dilute
      the informative one (AN-3). What is weakened is the covariance-aware
      FUSION limb specifically, and the vector-count gain that met its
      threshold (8x, grid-resolved) is quantitatively consistent with plain
      averaging of four near-independent scores (predicted 4x) -- which the
      ablation delivers at strictly lower charged work. The mechanism's real
      content at these parameters is signal preservation under the isometry,
      not covariance modelling.
    - >-
      HEUR-001 IS ADJUDICATED AS FALSIFIED AS WRITTEN, BY ONE DISJUNCT ONLY.
      The Executor deliberately did not adjudicate; adjudication is the
      Coordinator's. Disjunct (1), held-out FPR outside the frozen factor-2
      band: NOT triggered (variance ratio 1.0919). Disjunct (2), r_eff
      deviating by >= 50 percent: NOT triggered (0.56 percent). Disjunct (3),
      naive unweighted averaging matches GLS on held-out instances: TRIGGERED.
      The covariance model transferred essentially perfectly -- the heuristic's
      stated subject held -- and the disjunct that fired says the model was
      unnecessary, a different failure. That the frozen wording bundled "does
      not transfer" with "is not needed" is a drafting defect and is recorded
      as one. It is NOT used to reinterpret the trigger: no success or
      falsification criterion is changed after observing an outcome without a
      versioned protocol_amendment, and none is issued here.
    - >-
      RULING ON PD-5 (UNAUTHORISED INFERENCE FALLBACK). The handoff
      TASK-20260727-012 sets inference.fallback_allowed: false; every manifest
      records fallback_used: true with resolved_model_id claude-opus-5. Under
      AGENTS.md's model policy the substitution was NOT authorised. It is NOT
      retroactively authorised by this decision, and NO inference_amendment is
      granted: authorising after the fact a fallback that has already run is
      exactly the post-hoc criterion change the contract forbids. Three
      findings follow. (a) The Executor's conduct was CORRECT: rule 11 forbids
      silently altering one's own model, and the substitution was disclosed as
      a deviation with its reason in every manifest rather than treated as
      permitted. (b) The measurements STAND. The frozen protocol is
      deterministic, every reported quantity is produced by archived code
      rather than by model judgement, the implementation is itself an archived
      artifact an independent reader can check, and the gate32 stage reproduces
      byte-identically from the recorded command and revision. The defect bears
      on implementation quality assurance, not on the integrity of the numbers.
      (c) The STRUCTURAL FAULT IS IN THE HANDOFF, NOT THE EXECUTOR: under
      CLAUDE.md's model-policy note this Claude Code harness cannot resolve the
      GPT-5.6 policy aliases at all, so any handoff issued here with
      fallback_allowed: false is unsatisfiable by construction. Issuing an
      unsatisfiable inference envelope and then charging its violation to the
      agent that disclosed it would be incoherent. The repair is prospective
      and binding: Coordinator handoffs issued under this harness must either
      set fallback_allowed: true and name the harness constraint, or carry a
      pre-approved inference_amendment. Separately, model_verified: false with
      no `python3 -m orchestration.adapter doctor --probe` for the resolved
      identifier is an unremedied provenance gap, correctly recorded in form
      and carried into EV-MLKEM-c47a1e's unresolved_confounds.
    - >-
      RULING ON PD-1 (AUTHORIZATION CHAIN), WHICH IS WORSE THAN THE EXECUTOR
      FLAGGED. Three facts. (a) EXP-MLKEM-007.goal_id is GOAL-MLKEM-001, whose
      status has been closed_at_budget since 2026-07-24 with next_action "None
      under this goal ... no seventh batch is authorized" (DEC-20260724-019).
      (b) The handoff cites authorized_by: DEC-20260727-002, and that decision
      does NOT cover this task: it is a GOAL-ECDLP-001 budget and BATCH-009
      decision whose target_ids are GOAL-ECDLP-001, BATCH-009 and
      TASK-20260727-002..006, naming no ML-KEM record anywhere. The Executor's
      PD-1 asserted that decision made the authorisation "independent and
      current"; that assertion is not supported by the cited record and is
      corrected here. (c) The identifier TASK-20260727-012 is occupied twice:
      by ledger/handoffs/TASK-20260727-012.yaml (this experiment's executor
      handoff) and by
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-006/reviews/TASK-20260727-012/
      (a red-team review cited in DEC-20260727-008.evidence_refs) -- precisely
      the sequential-allocation collision AGENTS.md rule 14 exists to prevent.
      RULING: execution was LEGITIMATE. The authority to execute is the
      experiment's own approval, recorded as frozen fields in
      specification.yaml (status approved, approved_by coordinator, approved_at
      2026-07-27) and archived by TASK-20260727-904 at commit 2b77906e; the
      Executor ran a frozen, approved, archived protocol within budget and
      changed no ledger status. The run set is admissible. But the chain is
      defective in two ways that are recorded rather than papered over: an
      experiment approval exists with NO corresponding coordinator_decision
      record, contrary to AGENTS.md's requirement that every state transition
      include a decision record with rationale and evidence references; and a
      handoff cites a decision that does not name it. Neither is repairable by
      editing an immutable record, and under AGENTS.md rule 15 the duplicated
      TASK id must NOT be remapped -- both occurrences are named in completed
      archives (TASK-20260727-904 binds the ledger path; DEC-20260727-008's
      evidence_refs bind the coordination path), so the resolution is a
      correction record. Successors are in next_actions.
    - >-
      THIS DECISION DOES NOT REOPEN GOAL-MLKEM-001. The goal remains
      closed_at_budget with its recorded next_action unchanged; no seventh
      batch is created and this experiment is not counted as goal progress. The
      goal_id field on EXP-MLKEM-007 and H-MLKEM-007 is treated as a provenance
      pointer to the line of work, not as an assertion that the goal is active.
      EXP-MLKEM-007 is adjudicated on its own approved specification alone.
    - >-
      EVIDENCE STRENGTH IS `preliminary`, NOT `replicated` OR `strong`. The
      protocol was predefined and frozen, seven controls were attested, thirty
      instances were used with an enforced split, all artifacts were retained,
      and the effect is stable across nine of ten grid points and both
      pre-registered readings -- which is why it is not `anecdotal` and not
      `inconclusive`. It is not `replicated`: the byte-identical re-run is
      determinism on the same host with the same implementation, and
      docs/evidence-and-reproducibility.md reserves `replicated` for
      reproduction from a clean, preferably independent, run. It is not
      `strong`: fifteen held-out instances give wide binomial intervals (the
      0.600 known-answer rate spans [0.357, 0.802]), the m50 grid is
      power-of-two so 8.0x is grid-resolved only, half the protocol produced no
      data, the orbit-subset existential was tested at one point of its
      admissible range, and the two charged-work verdicts turn on a ~0.5
      percent remainder above an m-independent LLL floor.
    - >-
      REGIME SENSITIVITY IS RECORDED AS THE PRIMARY UNRESOLVED CONFOUND, AND
      THE `generic_batching` LABEL IS EXPLICITLY BOUNDED. The
      orbit-versus-permutation metric gives 0.0217 bits on the frozen
      counted_exact model and 3.989 bits on the labelled modeled
      sieve-dominated alternative, straddling its own 1.0-bit threshold; the
      frozen decision uses the measured figure, as it must. Because ~291.6 M of
      ~293 M charged units are an m-independent LLL floor, the same ~0.5
      percent remainder also decides the total_charged_score_work_ratio < 1
      verdict that was MET. Consequently the `generic_batching` antecedent
      fires because the cost model cannot see a 16x vector-count difference
      between orbit (m50 64) and permutation (m50 1024), NOT because the two
      behave alike. That class must never be cited from this experiment as
      evidence that the negacyclic orbit is equivalent to generic batching.
    - >-
      PARETO HONESTY (docs/inventor-protocol.md). dominated_by is NOT null and
      was not left blank: the GLS rule is dominated by its own ablation, the
      naive unweighted mean, which attains the identical m50 (64) and identical
      held-out FPR under both readings at strictly lower charged work
      (292,067,004 vs 292,105,468) while paying no covariance-estimation cost.
      Every row of the experiment's own frontier was checked across vector
      count, charged work and false-positive rate; no row is dominated by GLS;
      no external row is contested because this experiment occupies no
      cryptanalytic cost frontier at all. sota_delta is ZERO against any
      standardized ML-KEM frontier, and -0.00019 bits against the ablation --
      i.e. the covariance-aware term is 0.013 percent more expensive for
      identical detection performance.
    - >-
      PREMATURE CLOSURE IS NOT INVOKED. Under docs/inventor-protocol.md,
      declining to search is a failure mode symmetric with overclaiming. This
      decision closes no lane. It names the exact obstruction at the tested
      configuration (a near-isotropic score covariance leaves covariance-aware
      weighting nothing to exploit), states the evidence, budget, test boundary
      and remaining uncertainty, and names concrete successors and a revisit
      condition below. The mechanism's stronger limbs -- larger orbit subsets,
      other d_shift values, n=64, and a sieve-dominated cost regime -- remain
      open and are cheap to test.

  evidence_refs:
    - EV-MLKEM-c47a1e
    - EXP-MLKEM-007
    - RUN-MLKEM-025
    - RUN-MLKEM-026
    - RUN-MLKEM-027
    - RUN-MLKEM-028
    - experiments/EXP-MLKEM-007/analysis/coordinator-analysis.yaml
    - experiments/EXP-MLKEM-007/analysis/refutation-note-gls-vs-uniform.yaml
    - experiments/EXP-MLKEM-007/analysis/gate_decision.json
    - experiments/EXP-MLKEM-007/analysis/covariance_report.json
    - experiments/EXP-MLKEM-007/analysis/cost_accounting.json
    - experiments/EXP-MLKEM-007/execution-report.yaml
    - experiments/EXP-MLKEM-007/archives/snapshot_receipt_20260802.json
    - EV-MLKEM-001

  refutation_artifact:
    class: derivation_note
    path: experiments/EXP-MLKEM-007/analysis/refutation-note-gls-vs-uniform.yaml
    proof_status: derivation
    archived_before_this_decision: >-
      Written in the same working tree before this record and assigned to the
      same ledger archive. docs/claims-and-verification.md asks that the
      artifact be committed before the decision relying on it; because this
      decision is `weaken` rather than `reject_scoped`, and `weaken` is
      supportable at empirical_only, the decision does not DEPEND on the
      artifact -- the artifact strengthens the declared basis from
      empirical_only to derivation. If the archive is split, the artifact must
      be staged in the same commit as, or an earlier commit than, this record.
    strongest_level_achievable: >-
      Level 2 of 3. Level 1 (counterexample certificate) does not apply: the
      failing prediction is a distributional threshold, not a per-instance
      witness that independent code could re-check.

  limitations:
    - >-
      claim_tier toy. Synthetic MLWE at n = 32 (n = 64 attempted, no data),
      q = 3329, k = 2, lattice dimension 124. Nothing here bears on
      ML-KEM-512/768/1024 or on MLWE hardness. ML-KEM is not broken and this
      decision must never be cited as bearing on that.
    - >-
      Every verdict is scoped to n = 32. The n=64 thresholds are UNEVALUATED,
      not failed, and the n=64 limb of the correlated_reindexing disjunction is
      neither true nor false.
    - >-
      The orbit-subset existential was tested at |J| = 4 only, out of an
      admissible range up to 32, and the cap came from the pure-Python
      execution host. Alternative d_shift values were not swept.
    - >-
      Single execution. No independent Validator or Red Team session reviewed
      this run package, and no second implementation or environment has
      reproduced any figure. Any escalation toward reject_scoped, support, or a
      knowledge promotion requires that review first.
    - >-
      Both charged-work verdicts turn on a ~0.5 percent m-dependent remainder
      above an m-independent LLL floor; the orbit-versus-permutation metric
      straddles its threshold between the counted_exact and modeled regimes.
    - >-
      The derivation's step from a standard-deviation budget to a
      false-positive-rate budget uses a Gaussian tail while AN-5 shows the
      empirical null is heavier-tailed. The direction of that model error is
      conservative (a heavier tail requires a LARGER sd reduction), and the
      variance computation itself uses no tail model, but it is a model and is
      labelled as one.
    - >-
      PD-5 remains an uncured, unauthorised inference-policy deviation and
      model_verified is false for every run. No figure rests on model judgement,
      but the provenance gap is not closed by this decision.
    - >-
      The authorisation chain for EXP-MLKEM-007 remains defective (no approving
      decision record; a handoff citing a decision that does not name it; a
      duplicated TASK identifier). This decision records those defects and
      schedules corrections; it repairs none of them, and it does not
      retroactively supply the missing approval decision.
    - >-
      DEC-20260722-003's required carry-aware LaMS layer derivation and
      corrected commit-pinned matched baseline remain open prerequisites and
      are not discharged.
    - >-
      This authoring session had no shell: it could not run
      tools/allocate_id.py, tools/validate_ledger.py, or any git command, and
      it made no commit and staged nothing. Identifiers were minted as RANDOM
      6-hex tokens (never max+1) and checked free by exhaustive path search
      across the repository; the archiving session must confirm both with
      `python3 tools/allocate_id.py --check EV-MLKEM-c47a1e` and
      `--check DEC-20260803-9b3d40` and run the ledger validator before
      committing. Until the post-commit verifier accepts, nothing here is
      durable.

  hypothesis_status_transition:
    record: H-MLKEM-007
    from: approved
    to: weakened
    scope_of_the_transition: >-
      `weakened` records that one pre-registered limb of the conjunction --
      covariance-aware GLS fusion beating naive unweighted averaging by >= 2x
      in held-out false-positive rate -- failed cleanly at n = 32 with
      d_shift = 8 and |J| = 4, with an archived derivation for why. It does NOT
      record that the hypothesis is rejected, that the isometry-reuse premise
      failed, or that anything was established at n = 64 or at larger orbit
      subsets. Revisit conditions are in next_actions.

  next_actions:
    - >-
      1. REPLICATE, INDEPENDENTLY, BEFORE ANY STRONGER CALL. Open a task for an
      independent session (different implementation of the scoring and fusion
      layer, ideally a different host) to reproduce the n=32 gate32 stage from
      the frozen specification and confirm the two decisive figures: held-out
      GLS-vs-unweighted FPR ratio ~= 1.000 under both pre-registered readings,
      and held-out r_eff >= 3.9. A confirming replication converts this
      `weaken` into a candidate `reject_scoped` bounded to (n=32, d_shift=8,
      |J|=4, this pool construction) -- and nothing wider. A disconfirming
      replication supersedes EV-MLKEM-c47a1e.
    - >-
      2. TEST THE PART OF THE EXISTENTIAL THE HOST BLOCKED. Specify a
      successor experiment sweeping d_shift in {2, 4, 8} at n = 32, giving
      |J| in {16, 8, 4}, and measure the coefficient of variation of the
      orbit-score covariance's ROW SUMS at each. That statistic -- not r_eff --
      is what bounds any covariance-aware gain (see the refutation note), it
      costs one covariance estimate per configuration, and it decides the
      fusion limb before any lattice reduction is run. |J| = 8 is reachable in
      pure Python (3^8 = 6561 candidates); |J| = 16 is not and needs the
      backend in action 3.
    - >-
      3. RESOLVE THE n=64 INFRASTRUCTURE BLOCK BEFORE RE-ATTEMPTING n=64. The
      n=64 arm is not a mathematical question at present: dimension-248 LLL is
      out of reach of pure-Python inside any budget this program will grant. A
      new experiment or amendment requires an environment providing fpylll,
      Sage or an equivalent reduction backend. Do NOT re-run RUN-MLKEM-027 --
      run records are immutable and a corrected run needs a new ID and a new
      experiment or amendment.
    - >-
      4. RESOLVE THE COST-REGIME AMBIGUITY BEFORE ANY FUTURE ORBIT-VERSUS-
      PERMUTATION VERDICT. The frozen counted_exact model cannot distinguish a
      16x vector-count difference from none, because it is dominated by an
      m-independent reduction floor. Any successor specification must pin, in
      advance, whether short-vector generation is charged per instance or per
      vector, and must not leave the decisive metric to be settled by a 0.5
      percent remainder.
    - >-
      5. WRITE THE CORRECTION RECORDS FOR THE AUTHORISATION CHAIN. One
      correction recording that TASK-20260727-012's authorized_by
      DEC-20260727-002 does not cover it and naming the archived frozen
      approval (TASK-20260727-904, commit 2b77906e) as the actual authority;
      one recording that no coordinator_decision approves H-MLKEM-007 or
      EXP-MLKEM-007; one recording the dual occupancy of the identifier
      TASK-20260727-012 across ledger/handoffs/ and
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-006/reviews/. NO RENAME:
      both occurrences are bound by completed archives (AGENTS.md rule 15).
    - >-
      6. FIX THE INFERENCE ENVELOPE PROSPECTIVELY. Every future Coordinator
      handoff issued under this Claude Code harness must set
      fallback_allowed: true with the harness constraint named, or carry a
      pre-approved inference_amendment. No further handoff may be issued with
      an envelope this harness cannot satisfy. Where model provenance matters,
      run `python3 -m orchestration.adapter doctor --probe` so model_verified
      is not false by default.
    - >-
      7. MATERIALISE THE ANALYSIS DOCUMENT AND ARCHIVE. Render
      experiments/EXP-MLKEM-007/analysis/coordinator-analysis.yaml verbatim to
      experiments/EXP-MLKEM-007/analysis.md (required by the reproduction
      package in docs/evidence-and-reproducibility.md; the authoring session
      could not write .md files), then run one Coordinator LEDGER archive
      staging exactly: experiments/EXP-MLKEM-007/analysis.md,
      experiments/EXP-MLKEM-007/analysis/coordinator-analysis.yaml,
      experiments/EXP-MLKEM-007/analysis/refutation-note-gls-vs-uniform.yaml,
      ledger/evidence/EV-MLKEM-c47a1e.yaml,
      ledger/decisions/DEC-20260803-9b3d40.yaml,
      ledger/hypotheses/H-MLKEM-007.yaml. Merge origin/main first (merge, never
      rebase), push the branch, and open or refresh the PR naming
      EV-MLKEM-c47a1e and DEC-20260803-9b3d40. The transition to `weakened` is
      not official until the post-commit verifier accepts.
    - >-
      8. GOAL-MLKEM-001 STAYS CLOSED. No goal checkpoint follows from this
      decision, no seventh batch is opened, and the goal's recorded next_action
      is unchanged. Any continuation of this line requires a new goal record.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Promotion is not warranted YET, for a concrete reason rather than a
      formality: this decision is `weaken` on evidence of strength
      `preliminary`, and the promotion gate requires `support` or
      `reject_scoped` on `replicated` or `strong` evidence. The single
      execution has not been independently replicated (the byte-identical
      re-run is determinism on the same host and implementation), and no
      independent Validator or Red Team session reviewed the package. There IS
      a concrete promotion candidate, and it is named rather than lost: the
      reusable design rule in
      experiments/EXP-MLKEM-007/analysis/refutation-note-gls-vs-uniform.yaml --
      that the attainable advantage of covariance-aware GLS weighting over
      plain uniform averaging is second order in the coefficient of variation
      of the score covariance's ROW SUMS (~ CV^2 in variance), so a factor-f
      tail-FPR improvement at standardised threshold tau demands CV of roughly
      36 percent for f = 2 at tau = 3, making a one-covariance-estimate row-sum
      check a cheap pre-compute falsification gate in the sense of
      docs/inventor-protocol.md section 8. That is a TECHNIQUE claim
      (KN-TECH-*), not a finding about ML-KEM, and it is scheduled behind
      next_action 1 (independent replication) and next_action 2 (the d_shift
      sweep, which tests the rule on more than one covariance). It must not be
      promoted from a single unreplicated execution, and knowledge/INDEX.md is
      therefore not regenerated in this archive.

