coordinator_decision:
  id: DEC-20260724-020
  context: >-
    GOAL-ICLIFT-001 BATCH-001 executed EXP-FB3-001, the six-geometry factor-base
    battery approved by DEC-20260717-002 and never run, under the approved
    amendment EXP-FB3-001-AMD-001 (exact full-target-space counting, frozen
    geometry definitions, pre-registered analytic arm). Evidence EV-FB3-001;
    validation TASK-20260724-232 (valid_with_findings, exact independent
    recomputation of 7 cells); red team TASK-20260724-233
    (conclusion_requires_narrowing, 0 fatal, 7 scoping, 6 noted).
  decision: reject_scoped
  target_ids: [H-FBG-001, RQ-FBG-001, EV-FBG-001]
  target_ids_note: >-
    The experiment is EXP-FB3-001 and the originating records are H-FB3-001 and
    RQ-FB3-001. Those three IDs cannot appear in a machine-checked reference
    field: their files are not parseable YAML, so the validator never registers
    them, and their IDs predate the current format, which forbids a digit inside
    the area code. H-FBG-001 and RQ-FBG-001 are faithful transcriptions created
    by this task for that reason alone; the frozen originals are unedited and
    their hashes are recorded in the transcriptions.
  rationale:
    - >-
      The frozen success criterion of EXP-FB3-001 requires at least one geometry
      with a Holm-adjusted yield-ratio CI excluding 1 AND a growth slope versus
      log N excluding 0 in the alive direction across 2^14..2^18. Zero of six
      geometries meet it. No geometry has a mean-yield ratio above 1 at any size,
      and no geometry has both an advantage-direction CI excluding 1 and an
      advantage-direction slope excluding 0, on either the primary mean-yield
      metric or the secondary exact-coverage metric.
    - >-
      The mean-yield arm is vacuous by construction, and the decision says so
      rather than banking it as a strong null. The pre-registered conservation
      identity forces the exact mean per-target yield of every base of size B to
      binomial(B+2,3)/N, so the primary metric equals 1 for every matched-size
      untyped base at every N by arithmetic. The two typed Holm rejections are
      the closed-form typing penalty, not an element-geometry effect. The
      evidential weight of the negative rests on the secondary exact-coverage
      metric.
    - >-
      Exactness makes the null qualitatively better than the contract expected —
      counts are over the complete target space with no sampling error, and the
      hard closed-form total control passed 67,784 times — but the red team is
      right that the frozen falsification wording ("scoped KILL of the F3 family",
      "no signal seen at reachable scale") is broader than what was measured.
      This decision adopts the red team's narrowest defensible boundary rather
      than the frozen wording.
    - >-
      The red team's Bose-Chowla B_3 (Sidon) probe reaching a 1.1071 coverage
      ratio, and its corrected whole-group greedy reaching +2.69% against the
      arm-as-frozen's +0.30%, are treated as real limits on the claim, not as
      noise. They establish that coverage headroom outside the six pre-registered
      geometries exists and is roughly 36x and 9x anything the battery observed.
      They do not overturn the verdict, because every such probe still fails the
      growth clause — the corrected greedy fails it more steeply (slope
      -0.00734/bit versus -0.00118/bit).
    - >-
      A record-integrity defect was found while filing this decision and is
      recorded rather than quietly worked around: the frozen EXP-FB3-001 contract
      and its hypothesis and question records have never been machine-parseable.
      That is very likely part of why an experiment approved on 2026-07-17 sat
      unexecuted — no tool could read its contract. The files stay immutable;
      transcriptions carry the references.
    - >-
      Sequencing matters here: the analytic arm was committed in the protocol
      snapshot (commit 81d9e9f) BEFORE any cell was measured, so it is a
      pre-registered prediction that the battery confirmed, not a post-hoc
      rationalization of a null.
  evidence_refs:
    - EV-FB3-001
    - experiments/EXP-FB3-001/analysis.md
    - experiments/EXP-FB3-001/conservation.md
    - experiments/EXP-FB3-001/execution-report.yaml
    - experiments/EXP-FB3-001/runs/RUN-FB3-001-N14
    - experiments/EXP-FB3-001/runs/RUN-FB3-001-N16
    - experiments/EXP-FB3-001/runs/RUN-FB3-001-N18
    - experiments/EXP-FB3-001/runs/RUN-FB3-001-CTRL
    - experiments/EXP-FB3-001/runs/RUN-FB3-001-FAMILY
    - coordination/goals/GOAL-ICLIFT-001/batches/BATCH-001/tasks/TASK-20260724-232/validation_report.yaml
    - coordination/goals/GOAL-ICLIFT-001/batches/BATCH-001/tasks/TASK-20260724-233/red_team_report.yaml
  status_transitions:
    - record_id: H-FB3-001
      from: approved
      to: rejected_scoped
      note: >-
        The frozen root-level record ledger/H-FB3-001.yaml is immutable and is
        NOT edited. This decision record carries the transition, as in the
        precedent set by DEC-20260724-006. The transcription H-FBG-001 records
        the same transition in a parseable form.
    - record_id: H-FBG-001
      from: transcribed
      to: rejected_scoped
      note: Canonical parseable restatement of H-FB3-001; same scope, same evidence.
    - record_id: EXP-FB3-001
      from: approved
      to: analyzed
      note: >-
        All 288 pre-registered cells measured; artifacts snapshot-archived at
        commit 68e375f and independently validated.
  limitations:
    - >-
      Scope of the scoped rejection: the six pre-registered geometries
      (high_bit_interval, small_height, mixed_two_base, coset_union,
      greedy_optimized, asymmetric_sizing), the frozen counting convention
      (m = 3, unsigned multisets of factor-base points, targets uniform over the
      whole group, matched size B = ceil((6N)^(1/3))), N in {2^14, 2^16, 2^18},
      12 generated prime-order curves, toy claim tier.
    - >-
      The following sentences are explicitly NOT recorded and must not be quoted
      from this decision: "no structured factor base outperforms a matched random
      factor base" (refuted by the red team's Sidon probe at ratio 1.1071); "even
      an oracle-aided base gains less than 1%" (refuted at +2.69%); "the F3
      factor-base family is dead"; "factor-base geometry is closed as a research
      direction"; "structured factor bases cannot help index calculus"; "the
      coverage channel is closed".
    - >-
      Yield and coverage only. The point-decomposition solve and the linear
      algebra stage are untouched, and the conservation identity is CONSISTENT
      with index calculus working — the Gaudry-Diem 1/n! decomposition
      probability over extension fields IS the conservation mean, so the
      extension-field advantage lives in the solve. KN-OPEN-001 is untouched.
    - >-
      Relation rank and independence were not measured; the metrics score a
      rank-deficient base as tied with a random base of the same size.
    - >-
      The greedy arm as frozen understates its own geometry by about 9x, and the
      asymmetric arm cannot reach its design point at fixed total size, so those
      two Holm rejections are weaker than they look. Both are recorded as
      unresolved confounds in EV-FB3-001.
    - >-
      No independent-session review in the strict sense was available: the
      review-xhigh policy cannot be resolved in this Claude-family harness. The
      validator and red team were separate subagents with independent context and
      the validator recomputed cells without importing executor code, which is
      the weaker sense in which AGENTS.md rule 12 is discharged here.
  next_actions:
    - >-
      Adopt the red team's cheapest falsifying control as the next factor-base
      action if the direction is revisited: re-run the greedy arm at the three
      frozen sizes against the whole-group coverage objective with no train/held-out
      split, plus a Bose-Chowla B_3 arm at matched B and the same greedy at a 64B
      pool, and report exact coverage ratio with its permutation band and the
      family-wise slope versus log2 N against the ceiling min(1, mu)/(1 - e^-mu).
      It overturns this decision only if some arm's coverage-ratio family-wise CI
      excludes 1 upward AND its slope excludes 0 upward.
    - >-
      Do not re-run any of the six geometries on mean yield. The identity settles
      that arm; spending the contract's remaining 24 CPU-hours on it would be
      waste.
    - >-
      Repair or supersede the unparseable frozen FB3 records as a separate
      ledger-hygiene task, and add a YAML-parse check to the contract-freezing
      step so no future experiment is approved with an unreadable contract.
    - >-
      Record the minor validator findings as documentation debt against any
      future re-use of this implementation: the conservation.md label carrying a
      curve-1 value, the Holm aggregation rule documented only in a code comment,
      and the matched-random draw range [1, N) versus the convention string
      [0, N).
  knowledge_promotion:
    promoted: [KN-FIND-001]
    not_warranted: null
  decided_by: coordinator
  decided_at: '2026-07-24T12:40:00-07:00'
