coordinator_decision:
  id: DEC-20260807-af4689
  goal_id: GOAL-ECDLP-001
  batch_id: null
  recorded_by_task: null
  archived_by: null
  decided_by: top-level session
  decided_by_note: NOT an independent Coordinator subagent, and not independently reviewed.
    This decision opens experiments and narrows two recorded claims; it changes no hypothesis
    status and closes no open problem.
  decided_at: '2026-08-07'
  context: Follow-up experiments to the Semaev monodromy package (DEC-20260807-64df6a) and to
    the highest-value gaps identified in a survey of all 55 knowledge findings. Four were designed;
    two were run.
  decision: expand
  decision_scope: 'FOUR FOLLOW-UPS OPENED. TWO RUN, TWO DESIGNED AND EXPLICITLY NOT RUN.


    (1) EXP-HPSC-74991c -- RUN, and it does not reproduce the corpus. The H-PSEUDO constant''s
    recorded scaling C ~ p^0.079 (KN-FIND-e7a3b1, KN-FIND-4c9e71 as corrected) is outside the
    bootstrap interval for BOTH the curve-mean and the curve-max once the sample count is matched
    across primes. More consequentially, four models fit C(p) within 0.002 RMS of each other
    and extrapolate to 2^256 across three orders of magnitude, so the FORM of C(p) -- never
    tested anywhere in the corpus -- and not its exponent is what decides the crypto-scale yield-error
    claim that KN-FIND-5c1a03 and KN-FIND-f8c290 rest on. Recorded as EV-HPSC-a23ace and CORR-20260807-0021c7.


    (2) EXP-SMON-32339c -- RUN, and it holds. Theorems A/B/C of the manuscript extend to m =
    6 and m = 7 (fibre degrees 16 and 32) without exception: 556 good specializations, 556 pattern
    matches, max factor degree 2, zero mixed types, all 16 and all 32 Frobenius classes realized,
    and 431 of 431 factor-base specializations totally split. Recorded as EV-SMON-0213fa.


    (3) EXP-KDUAL-8f0b69 -- DESIGNED, NOT RUN, blocked on SageMath. It asks the one question
    that decides what KN-FIND-015 means: does lattice-estimator''s dual_hybrid model a coded/decoding
    stage at all? If not, ''dual does not win on Kyber'' is a statement about the public instrument
    and must be re-scoped wherever cited; if so, it is a substantive disagreement about deployed
    ML-KEM parameters. This is the highest cryptographic-relevance unrun item in the corpus.


    (4) EXP-FBST-190234 -- DESIGNED, NOT RUN. Section 11 Question 2 of the manuscript: does
    ANY factor-base statistic vary across curves at matched (p,B,m)? Mean yield is fixed by
    KN-FIND-007 and the fibre by Theorem C; coverage, multiplicity dispersion, relation rank
    and recognizability are not. Relation rank is the most likely carrier because no theorem
    and no measurement in this corpus touches it. Mean yield is the positive control and must
    show exactly zero excess variance or the instrument is void.'
