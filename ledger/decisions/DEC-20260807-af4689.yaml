  rationale:
  - 'The H-PSEUDO re-measurement was chosen first because the corpus held three mutually inconsistent
    readings of one number and two further findings leaned on the result at crypto scale. Cost
    to resolve: 26 seconds. That ratio is the argument.'
  - 'The over-correction in KN-FIND-4c9e71 has an identifiable mechanism, which makes it worth
    recording rather than merely overwriting: it compared a sample MAXIMUM across primes at
    152, 26, 12 and 6 draws. A maximum is a function of sample size. Any future adversarial-max
    claim in this program should state its n per cell.'
  - The model-degeneracy result is the part that generalises beyond H-PSEUDO. Fitting a power
    law to a slowly growing quantity over a narrow range and extrapolating 240 bits will always
    succeed and will always be uninformative. The corpus should treat 'which functional form'
    as a pre-registered question wherever it extrapolates.
  - 'm = 6 and m = 7 were cheap and were chosen because the monodromy group there has order
    16 and 32: ''every class yields exactly one factorization type'' is a much stronger coincidence
    to satisfy accidentally than at m = 3, so agreement is worth more per sample than more samples
    at low arity would be.'
  - EXP-KDUAL is specified as a SOURCE READ, not a benchmark, because output numbers cannot
    separate 'modelled and cheaper' from 'not modelled at all' -- which is exactly the ambiguity
    KN-FIND-015 leaves open.
  - EXP-FBST's mean-yield positive control is the load-bearing part of that contract. KN-FIND-007
    proves the mean is invariant, so any measured variation in it is proof the instrument is
    broken before any other number is read.
  evidence_refs:
  - EV-HPSC-a23ace
  - EV-SMON-0213fa
  - experiments/EXP-HPSC-74991c/runs/RUN-HPSC-74991c-001/raw-result.json
  - experiments/EXP-SMON-32339c/runs/RUN-SMON-32339c-001/raw-result.json
  limitations:
  - No independent review of any kind on either run. AGENTS.md rule 12 not met.
  - Both runs are toy scale; largest prime 400009 (18.6 bits).
  - One implementation and one seed each. The HPSC code carried a silent point-counting defect
    on first draft that inflated C by 5x before a coverage gate caught it.
  - The level offset between this run's C values and KN-FIND-d4f820's (about 0.75-1.2) is unexplained
    and is NOT resolved by this decision.
  - No ECDLP or lattice security claim is made anywhere, in either direction.
  next_actions:
  - Run EXP-KDUAL-8f0b69 from any session with SageMath. It is the highest-value unrun item
    and the determination is a source read, not a compute job.
  - Run EXP-FBST-190234; it needs no dependencies and roughly 2 CPU-hours.
  - Re-run EXP-HPSC-74991c under an independent implementation, ideally in Sage, and with the
    threshold t swept rather than pinned, to settle the unexplained level offset.
  - Have a Coordinator decide whether KN-FIND-5c1a03 and KN-FIND-f8c290 should be amended to
    cite the functional form of C(p) as an assumption. This session did not amend them, because
    narrowing a finding it did not produce, without review, would repeat the failure CORR-20260807-0021c7
    is about.
  - Mint proper research questions for the HPSC, FBST and KDUAL lines; all three currently point
    at RQ-MONO-001 because no better question record exists, and each says so.
  knowledge_promotion:
    promoted: []
    not_warranted: Nothing promoted. The HPSC result narrows existing entries and is recorded
      as CORR-20260807-0021c7 rather than as a new finding, because a single unreviewed run
      at toy scale should not create a durable claim about a quantity three existing entries
      already disagree about. The m=6/7 extension is additional support for KN-FIND-a8990a,
      not a separate finding.
