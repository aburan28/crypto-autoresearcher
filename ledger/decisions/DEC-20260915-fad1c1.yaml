coordinator_decision:
  id: DEC-20260915-fad1c1
  recorded_at: '2026-09-15'
  decided_at: '2026-09-15'
  decided_by: coordinator
  recorded_by_task: TASK-20260913-f0f5f1
  archived_by: TASK-20260913-f0f5f1
  goal_id: GOAL-SEMBIN-5078bc
  batch_id: BATCH-9d649f
  decision: support
  decision_label: >-
    Compose REVIEW-SEMBIN-20260913-2c40bb (M1-M5 and the proves-too-much control, one
    validator) on RUN-SEMBIN-3ae91c of EXP-SEMBIN-2c40bb, the memory-charged cost
    SURFACE. H-SEMBIN-97ea23 moves approved -> supported (moderate, in scope): none of
    its five falsification conditions fired and every stated numeric prediction was
    met; the support is recorded as NARROWER than the hypothesis's prose -- C1 holds
    under every storage reading, C2 holds only for (sparse reading, parent metric set,
    persistent crossover), C3 holds under the hard budget by 0.33 bits and not under
    the soft. COST-SEMBIN-e9960c is recorded as the canonical crossover surface of
    which COST-SEMBIN-8d123b's table is one slice. Nothing here is a statement about
    the security of any curve in either direction.
  context: >-
    EXP-SEMBIN-2c40bb was the successor DEC-20260913-8a0f3d named when REVIEW-9d649f's
    joints J2 and J3 broke on RUN-SEMBIN-121b59: the parent record charged the vOW
    baseline at one arbitrary operating point (M = 1, w = 2^30), compared one store
    value, and let the storage reading decide its n = 409 verdict. The run replaces the
    table with a 254,016-cell surface over store, processors, baseline charging mode,
    kappa, cofactor, storage reading, k reading and m selection, with a reproduction
    gate at the parent slice, a coherent-baseline arm, a fixed-budget arm, an
    unreached prime-field arm, a sparse second implementation, and ten controls.
    The Coordinator's prior was written in the review plan before the validator ran
    (plan written_before_any_reviewer_ran: true, commit dfffbeb6d; claim a0dd30000).
    The validator (TASK-20260913-67ab4f) ran in a single independent session on the
    default model under the user's "auto mode" directive; the independence checker
    passed before composition.
  target_ids: [H-SEMBIN-97ea23, EXP-SEMBIN-2c40bb, RUN-SEMBIN-3ae91c, COST-SEMBIN-e9960c, COST-SEMBIN-8d123b, EV-SEMBIN-4125ec]
  official_transitions:
    H-SEMBIN-97ea23:
      from: approved
      to: supported
      basis: >-
        Pre-registered test: eight predictions, five falsification conditions. P1
        (gate) HELD at 4.8e-5 bits against four implementations (EV-SEMBIN-4125ec O-1),
        so the hypothesis is not void. P2 (C1: +85 in n, 29.0 bits, both coherent
        crossovers above 409) HELD under all four storage readings (O-3). P3 (C2) HELD
        as worded in the contract -- sparse 96 > 72 against the parent's metric set --
        and is FALSE against this contract's full metric set (96 < 103), for the dense
        reading under both sets (93 < 132 / 162), and under the first-crossing
        definition everywhere (0 < 300) (O-4, O-5). P4 (C3) HELD under the hard budget
        with 0.33 bits to spare and is FALSE under the soft penalty semantics, which C3's
        own wording arguably excludes (O-6, O-7). P5 HELD on arithmetic only (O-13). P6
        HELD (O-10). P7 HELD on the surface, lightly validated (O-15). P8 UNREACHED
        (O-12). `supported` because the contract's falsification criteria are the
        pre-registered standard and none fired, the gate passed, the proves-too-much
        control passed at the untuned point (O-14), and C1 -- the load-bearing claim,
        that the parent's n = 409 verdict is an artefact of the baseline operating
        point worth 29.0 bits -- is unconditional across readings. `moderate`, not
        `strong`, and scoped in the record, because C2 and C3 survive on the reading
        of their own wording that the contract fixed and fail on the others (a wording
        defect, recorded, not a refutation); because C2's headline "not a property of
        the storage reading" is contradicted by O-5 (the ordering is decided by the
        reading's size); because everything is conditional on an unmeasured degree-4
        bound and an unread vOW primary source; and because one reviewer validated
        every joint. Not `weakened`: no falsification condition fired and no stated
        numeric prediction was missed. Not `inconclusive`: the arithmetic was
        re-derived blind and re-executed byte-identically; the uncertainty is in the
        models' inputs, not in whether the predictions were met.
    EXP-SEMBIN-2c40bb:
      from: approved
      to: analyzed
      basis: >-
        Evidence record EV-SEMBIN-4125ec written and archived under this decision.
        The contract head was left at `approved` when RUN-SEMBIN-3ae91c was archived
        by TASK-20260913-a10005 (be240e540); `running` and `completed` status_history
        entries are recorded on the head under this archive so the transition is
        reachable, following DEC-20260914-537000's pattern.
  confirmed_priors:
    - joint: M1
      prior: '"I EXPECT M1 TO HOLD ... the collision-pair count (1,556,684) to be reproducible but UNINFORMATIVE."'
      finding: >-
        Confirmed and exceeded: the validator did not only recompute, it re-executed
        run_all.py to byte-identical output for all ten JSON artifacts, and re-derived
        the gate and coherent figures blind. 0 of 40 sampled collision pairs are two
        mechanisms reaching one number. One unexpected item: the relation-store
        row-width convention ((m k + 2n) x 2^k bits) is stated in implementation.md
        and is needed to reproduce every memory figure; the validator's non-blind
        sweep also tried the approximate 3n x 2^k total (O-2).
    - joint: M2
      prior: '"I EXPECT M2 TO HOLD FOR THE SPARSE READING AND TO SHOW THAT C2 AS WORDED IS READING-DEPENDENT AND METRIC-SET-DEPENDENT."'
      finding: >-
        Confirmed on both dependences (sparse 96 > 72 parent set, 96 < 103 full set;
        dense 93 < 132 / 162). See refuted_priors for the crossover-definition part.
    - joint: M3
      prior: '"I EXPECT C3 AND C4 TO HOLD AND C10 TO BE THE FINDING ... I want [the moved C4 criterion] checked rather than trusted."'
      finding: >-
        Confirmed on all three points: 219 / -87 / 132 sums with DEGENERATE labelled;
        all eight attempt-2 C4 "failures" are floor-pinned at n = 3 and the refinement
        is a correction checkable from the with-factor cell alone (with a one-cell
        labelling gap, O-11); the C10 residual table matches to 4 decimals and the
        dense accounting is below the 33 measurements in 11/33 (A) and 5/33 (B) rows
        while both sparse accountings upper-bound every row under B (O-9).
    - joint: M4
      prior: '"I EXPECT THE HARD BAND TO HOLD AND THE SOFT BAND TO BE THE CAVEAT C3 NEEDS ... 62.31 bits at m = 4 sparse."'
      finding: >-
        Confirmed with one detail corrected: 62.31 at m = 4 is arm-f's n = 163 DENSE
        value; at 409 the sparse cheapest is 65.33 at m = 8 and the dense 80.07 at
        m = 6, exactly the contract's predicted band. The soft semantics is shown to be
        a threshold-multiplicative penalty (T x max(1, Mem/B)) whose flip is the
        product margin re-expressed, and not a bound on memory (O-7). The
        rows_times_cols_dense reading flips at 64.64, 0.36 bits below 2^65 -- the
        complement to C3's 0.33-bit knife-edge (O-6).
    - joint: M5
      prior: '"I EXPECT THE UNREACHED TO BE LEGITIMATE AND ARM I TO BE DISCOUNTED."'
      finding: >-
        Confirmed. EXP-ICEX-c32447 states three closed forms the producer's account
        omits or understates (m! N; N^beta factor base; sqrt(T N) time shape), none of
        which makes C6 instantiable; nothing was substituted; the sparse term
        re-derives from KN-LIT-e77232's statement to 1e-6 bits against both
        implementations, and PD-I's disclosure is accurate (O-12, O-13).
    - joint: proves_too_much
      prior: '"time-only invariance ... at most one or two units of n across modes; free yield at the coherent mode moves every cell down."'
      finding: >-
        Passed on both objects. Spread over store and reading at fixed mode is 0;
        the cross-mode move is 3 units, not 1-2, and is exactly the one disclosed bit
        at the local slope. 16/16 coherent free-yield cells move down (O-14).
  refuted_priors:
    - joint: M2
      prior: '"WHERE I THINK IT BREAKS: ... I do not expect [the crossover definition] to flip either ordering, only to move ranges by less than 10."'
      finding: >-
        OVERTURNED. Under the FIRST-crossing definition the store range is 0 and the
        metric range is 300 for every reading -- every ordering flips, by 300 versus
        0 -- because with store >= 30 the record-point baseline pays 2^30 x 3n bits at
        every n and Semaev's product cost is below it at n = 3..9 (the low-n artefact
        C8 labels). The persistent and parent-window definitions, which carry the
        run's figures, move at most 3 in n and flip nothing. The Coordinator had the
        magnitude wrong by two orders and the mechanism wrong (saw-tooth, not
        artefact); the outcome is that C2's truth value depends on the crossover
        definition as well as on the reading and the metric set (O-5).
  procedure_deviations:
    - id: PD-V1
      side: reviewer
      text: >-
        The validator's context was compacted mid-task; the post-compaction session
        re-did the blind step (rederive_pre_code.py, 07:27) and wrote a sequencing log
        claiming code was first opened at 07:31, whereas own_model.py's docstring
        records surface_cost.py was read at ~07:10. The attestable blind derivation is
        own_rederivation.py (07:04); the second derivation is NOT blind and the
        sequencing log is superseded by the report's own paragraph. The two derivations
        agree on every shared quantity. Nothing was deleted or rewritten. The
        Coordinator accepts the 07:04 derivation as the plan's M1(1) / M4(1) / M5(4)
        blind step and records the blindness as temporal, not structural.
    - id: PD-V2
      side: reviewer
      text: >-
        The parent round's reports (red-team-cf9d98, validator-da3982,
        blind-rederivation-ec11c4) and EV-SEMBIN-71e5cd were listed as inputs; the
        validator's retained context does not record opening them and it does not
        claim to have. No joint depended on them; the Coordinator read them when
        writing the plan.
    - id: PD-C1
      side: coordinator
      text: >-
        The plan's M4 prior quoted "62.31 bits at m = 4 (sparse)" as Semaev's cheapest
        memory at n = 409; that figure is arm-f's n = 163 dense value. A Coordinator
        transcription error in the prior, corrected by the reviewer; it did not affect
        any joint's attack plan, which was stated in terms of the formulas.
    - id: PD-C2
      side: coordinator
      text: >-
        The validator ran on the default (inherited) model under the user's "auto
        mode" directive rather than on an adapter-resolved review-adversarial binding;
        resolved_model_id is the reviewer's self-report, model_verified false,
        fallback_used false. Recorded as the round's inference provenance; not a
        degradation of a non-degradable tier (this round is not review-breakthrough,
        plan escalation: NOT ESCALATED).
    - id: PD-C3
      side: coordinator
      text: >-
        The validator subagent was launched only after the user asked a portfolio
        question ("Are there any other areas we want to target here?"); the answer
        was given first and the already-claimed, already-ranked review dispatched in
        the same turn. No scope of the review changed.
  rationale: >-
    The question this run existed to answer was whether the parent record's
    memory-charged n = 409 verdict was a property of Semaev's algorithm or of the way
    the comparison was set up. The surface answers it in three ordered magnitudes,
    each now validated: the baseline operating point is worth 29.0 bits and +85 in n
    under every reading (O-3); the storage reading is worth 20 bits at 409 and decides
    which of store and metric is the larger parameter (O-5, O-9); the budget semantics
    decides whether the readings agree below 2^65 at all (O-6, O-7). The hypothesis
    predicted the first exactly, predicted the second and third in a form that holds
    on the reading of its wording the contract fixed and fails on the others, and
    predicted none of the definitional dependences the validator found. That is a
    supported hypothesis with a scope narrower than its prose, and the ledger records
    it as such rather than rounding either way. The most consequential fact in the
    round is O-9: the dense accounting on which every "indeterminate at 409" verdict
    in this family rests is below the only 33 measurements that exist, under both
    readings of the MB column, while both sparse accountings upper-bound them under
    reading B. That is not picked as a reading here -- N <= 60 measurements with t for
    m and no relation store do not transfer -- but it is the reason the next
    measurement this program needs on the Semaev side is a relation matrix's actual
    working set above N ~ 60, not another closed form.
  next_actions:
    - >-
      Read van Oorschot-Wiener 1999 at source (retrieve, KN-LIT record, `retrieved`
      provenance with verified_by) and score HEUR-VOW-CURVE's T = W(1/M + 1/w), Mem =
      3n max(w, M), W = 0.886 x 2^{n/2} against it. Every crossover in COST-SEMBIN-8d123b
      and COST-SEMBIN-e9960c is scored against this heuristic and no agent has opened
      the paper. Cheapest task in the goal; ranked first.
    - >-
      Design (not run) a closed-form prime-field index-calculus cost model WITH a
      memory term -- C_LA, relation-matrix memory and factor-base storage as functions
      of (N, B, m) with beta fixed, and a multi-target rho baseline whose distinguished-
      point table is a formula -- as the C6 comparator for both RUN-SEMBIN-121b59 and
      RUN-SEMBIN-3ae91c, under an additive amendment naming it. This is the
      prime-field third of RQ-ICPERF-94c86e as well; design it once, in the ICPERF
      goal, and cite it from SEMBIN. Ranked second.
    - >-
      Restate C2 and C3 in a superseding hypothesis (never by editing H-SEMBIN-97ea23)
      that names the metric set, the crossover definition and the budget semantics,
      so that the claim's truth value no longer depends on an unstated choice; record
      the exact relation-store row-width convention ((m k + 2n) x 2^k bits) in the
      same statement, noting that 3n x 2^k is only an approximation.
      Ranked third; a wording task, no compute.
    - >-
      Carry O-9 into the ICPERF batch-2 design as a linear-algebra arm: build relation
      matrices at the density Semaev's sparse formula predicts, at N above 60, and
      measure the working set of an actual sparse elimination, so that the dense-vs-
      sparse reading is calibrated by data rather than argued. Ranked below the
      degree-4 closure predicate (DEC-20260914-537000 next_actions) because the degree
      is the larger uncertainty.
    - >-
      Repair the one-cell C4 labelling gap (O-11) only if a successor run re-executes
      the controls; not worth a task on its own.
  evidence_refs: [EV-SEMBIN-4125ec, EV-SEMBIN-71e5cd]
  citations:
    - claim: >-
        The contract's eight predictions, five falsification conditions and the
        Coordinator prior quoted in the review plan are as stated.
      source: experiments/EXP-SEMBIN-2c40bb/specification.yaml
      provenance: internal
      verified_by: coordinator (read in full when writing REVIEW-SEMBIN-20260913-2c40bb)
    - claim: >-
        The validator's joint verdicts, numbers, and two procedure deviations are as
        recorded in EV-SEMBIN-4125ec.
      source: coordination/review/sembin-20260913-9d649f/TASK-20260913-67ab4f/report.md
      provenance: internal
      verified_by: coordinator (read in full before composition; independence checker PASS)
    - claim: >-
        Semaev's Tables 1-2 contain 33 measured rows (12 + 21), not 34.
      source: inputs/SEMAEV-2015-310/tables.yaml
      provenance: internal
      verified_by: TASK-20260913-67ab4f (validate_c10.py re-parse; the run compares 33)
  citations_note: >-
    No external source is cited from recollection. The FIPS cofactors used in ARM S
    are `recalled` inside the run and are NOT relied on by this decision (all three h
    are on the surface). Van Oorschot-Wiener 1999 is deliberately NOT cited: no agent
    has read it, which is next_actions[0].
  limitations:
    - NOTHING IN THIS DECISION IS A STATEMENT ABOUT THE SECURITY OF ANY CURVE AT ANY PARAMETER, IN EITHER DIRECTION.
    - >-
      Every figure is conditional on Assumption 1 at degree 4 (unmeasured, unmeasurable
      on this host: IMP-SEMBIN-ENGINE) and on HEUR-VOW-CURVE as internally stated
      (primary source unread). No degree is asserted.
    - >-
      `supported` is scoped: C1 across readings; C2 for (sparse, parent metric set,
      persistent crossover) only; C3 under the hard budget only. The record's prose
      headline about the storage reading is contradicted by O-5 and is not supported.
    - >-
      The prime-field nearby-object control is UNREACHED for this run and its parent;
      the machinery has not returned the known answer on a prime-field object.
    - >-
      One reviewer validated every joint; blindness is temporal (PD-V1); the model
      was the default binding (PD-C2).
    - >-
      The "canonical surface" statement about COST-SEMBIN-e9960c is a synthesis, not a
      status change: COST-SEMBIN-8d123b is immutable and remains the record of what
      RUN-SEMBIN-121b59 computed; its crossover table is reproduced inside e9960c to
      4.8e-5 bits and future comparisons cite the surface.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Two candidates deferred, both named in EV-SEMBIN-4125ec knowledge_promotion_reason:
      the 6nW / off-ray excess corollary of HEUR-VOW-CURVE waits on the primary source
      being read (next_actions[0]); the dense-below-measurements finding waits on a
      working-set measurement above N ~ 60 (next_actions[3]). Neither is declined.
  standing_user_authorization:
    cited: '2026-09-06: "all is approved. ideas/experiments should be always approved"'
    applied_to: []
    note: >-
      This decision approves nothing; it composes a review and moves a hypothesis
      status, which is Coordinator authority under AGENTS.md. The design tasks in
      next_actions are designed and approved under the standing authorization when
      their contracts are complete.
