coordinator_decision:
  id: DEC-20260805-cc2b32
  context: >-
    Approval review of EXP-SDEG-f7faa8 (frozen contract for the D6 below-freeze rank
    collapse, converted from IDEA-20260803-202a15 under H-SDEG-0dd021). Snapshot
    07c43118 archived the hypothesis, contract and CORR-20260805-9d2e17 before review.
    Two independent sessions reviewed it: Validator TASK-20260805-5b9c60 and Red Team
    TASK-20260805-f7c853, neither of which produced the artifacts. Both returned REVISE.
    The dispatching session independently recomputed the load-bearing quantities rather
    than accepting either review's arithmetic. NO STAGE WAS RUN; the contract was never
    approved, so no Executor was dispatched and no compute was spent.
  decision: revise
  target_ids:
  - EXP-SDEG-f7faa8
  - H-SDEG-0dd021
  - IDEA-20260803-202a15
  - GOAL-SDEG-001
  - RQ-SDEG-001
  rationale: >-
    THE CONTRACT IS NOT APPROVED, AND THE REASON IS NOT A DEFECT IN ITS ARITHMETIC. Both
    reviewers independently re-derived the frozen closed form Phi from its stated clauses
    and reproduced every committed anchor exactly - sr_pred(9,3..6), sr_pred(12,3..6)
    including 156520, HF(9), the frozen quotient 3112, N(24,6)=190051, three nrows
    values, h_6(12)=7494, phi_full(12)=7, and both endpoints of CTRL-B's preregistered
    bracket [140504, 156520]. The skeleton is genuine and is not fitted. The dispatching
    session confirmed h_6(12)=7494, u_6=16018, s_6=-8524 and phi_F=6 by its own
    convolution.

    WHAT FAILS IS THE GATE BUILT ON IT, AND IT FAILS IN A SPECIFIC AND INSTRUCTIVE WAY.
    The Red Team computed the discrete answer rather than a probabilistic one: G1
    requires Q = 24623 within the band [24267.5, 24978.5], and the reachable lattice of
    partial-sum conventions is {0, 1, 2, 25, 289, 2013, 9117, 17513, 26037}. ZERO POINTS
    LIE IN THE BAND; the nearest misses by 1058.5, which is 1.5 window widths. So
    P(a random one of the three candidates passes G1) = 0 EXACTLY, and P(any partial-sum
    convention passes) = 0. The Validator reached the same verdict from relative errors
    (0.199 / 1.000 / 3.463 against a 0.05 threshold); the dispatching session reached it
    from an independent reconstruction (2.452 / 1.253 / 1.210). The three sets of numbers
    differ because the CELL-C arm assignment is genuinely ambiguous - which is itself the
    blocking defect - and the verdict is identical under all three.

    THE CONTRACT IS THEREFORE NOT "DECIDABLE WITH A REACHABLE NEGATIVE", AS IT STATES. IT
    IS DETERMINED WITH AN UNREACHABLE POSITIVE. Approving it would spend an execution
    authorization on a computation whose answer is fixed at freeze. That is the ground
    for revise rather than approve.

    THE GATE WAS NOT RIGGED, AND THIS MUST BE RECORDED AS CAREFULLY AS THE DEFECT. The 5
    per cent band is inherited verbatim from IDEA-20260803-202a15 as filed on 2026-08-03
    and predates the s_6 computation, which is affirmative evidence against band-fitting.
    The producing Coordinator disclosed s_6 = -8524 unprompted in a
    coordinator_prior_disclosure field and asked whether it leaked a winner. It does not:
    it settles that there is none. Disclosure was correct; what pre-registration cannot
    do is protect an outcome that is a deterministic function of the pre-registration.

    THE SCIENTIFIC CONTENT IS REAL AND IS A NEGATIVE. The untruncated boolean/Koszul form
    Phi, under every one of the three pre-declared collapse rules AND under any
    partial-sum collapse convention on the reachable lattice, DOES NOT EXPLAIN THE 7110
    DEFICIT at n=12 D6 arm R. This was obtained at zero compute, before authorizing a
    ladder the Red Team costs at 28.9 GB against a 24 GB cap for its n=13 D6 cell alone.
    The two-stage design did exactly the job it was built for.
  evidence_refs:
  - coordination/goals/GOAL-SDEG-001/reviews/TASK-20260805-5b9c60/validation_report.md
  - coordination/goals/GOAL-SDEG-001/reviews/TASK-20260805-f7c853/red_team_report.md
  - experiments/EXP-SDEG-f7faa8/specification.yaml
  - ledger/hypotheses/H-SDEG-0dd021.yaml
  - ledger/corrections/CORR-20260805-9d2e17.yaml
  - ledger/evidence/EV-SIG-006.yaml
  - ledger/evidence/EV-SIG-008.yaml
  - ledger/evidence/EV-DREG-008.yaml
  blocking_defects_to_repair:
  - id: B1
    source: VAL F-1 / RT OBJ-2
    statement: >-
      CELL-C's arm assignment is ambiguous and settleable after seeing the cell. Declared
      arm P, the rule returns 28068 and G3's demanded 31179 is unsatisfiable by
      construction; read as arm R, C2/C3 give exactly 31179 and pass. A record stating
      "NO OTHER DEGREE OF FREEDOM EXISTS" contains one.
    repair: Fix the arm by fiat in the frozen text before any evaluation.
  - id: B2
    source: VAL F-2 / RT OBJ-1
    statement: >-
      G2 and G5 are model tautologies. G2 is candidate-independent (the arm-P rule
      contains no Q; C1/C2/C3 differ only in Q) and its projection loss is
      max(0, -17515) = 0, a constant PASS. G5 is an identity in which u_D cancels because
      phi_F = 6 > D = 5, so all three candidates collapse to the same Q. Neither can fail,
      so neither discriminates, and G2 may not be called HEUR-BF-3's falsifier.
    repair: >-
      Demote both to non-gating consistency checks, or replace with a conjunct that can
      fail. RT notes the live half - same value on both arms, which C2 triggers - sits in
      CTRL-3 prose outside the GATE VERDICT conjunction.
  - id: B3
    source: VAL F-4
    statement: >-
      The blanket "u_k = 0 for k < D, VERIFIED PER CELL" is not dischargeable at CELL-D
      (no committed D5 histogram) and is contradicted by a committed histogram giving
      u_4 = 2. G5's outcome is invariant under both histograms, so this is a text defect
      rather than an evaluability blocker, but it also exposes a third unreported n=12
      pair, 46709/8746 against 46717/8738.
    repair: Restate per-cell with the committed histogram named, or mark undischarged.
  - id: B4
    source: RT OBJ-8
    statement: >-
      Stage 2 is not survivable as budgeted. n=13 D6 projects to about 28.9 GB against a
      24 GB cap and about 4.6 hours; the 40-cell ladder is 2.7x oversubscribed; the n=13
      rung alone is 2.3x the ceiling; the budget block is internally inconsistent by 2.4x.
      The core n in {9,12} is survivable at 23 per cent of budget.
    repair: Re-scope Stage 2 to the survivable core, or re-budget with a named remedy.
  - id: B5
    source: RT decay control
    statement: >-
      AN ALTERNATIVE HYPOTHESIS IS MISSING AND IT IS THE CANONICAL ONE FOR THIS SHAPE.
      Phi freezes only where u_6 >= h_6. The dispatching session independently confirms
      h_6(12) = 7494 and h_6(13) = 106743, a 14.2x jump, so at n=13 the mechanism requires
      a sextic miss far above the committed n=12 rate and ALL THREE CANDIDATES PREDICT
      DEFICIT EXACTLY 0 AT n=13 D6 ARM R. The mechanism is live only at n in {10, 11, 12}.
      That is the signature of a one-size artifact and it belongs in the contract as an
      explicit alternative hypothesis, not as a Stage-2 surprise.
    repair: Add it as a named alternative hypothesis with its own discriminating cell.
  next_actions:
  - >-
    DO NOT APPROVE EXP-SDEG-f7faa8. It remains status review_required with approved_by
    null. No Executor is dispatched, no stage is authorized, and no compute is spent.
  - >-
    RUN THE CHEAPEST CONTROL FIRST, and it is cheap enough that no ladder authorization is
    needed: rebuild the n=12 systems at seeds 2 and 2026 from the hash-pinned
    src/semaev_tree.py (builder sha e9f1681b...), recording the system hash and the
    per-degree column histograms at D=5 and D=6. NO RANK COMPUTATION, about one minute.
    It settles builder identity behind the two unreconciled n=12 readings, supplies the
    missing D5 histogram that discharges B3 at CELL-D, and re-derives
    174033 / 16018 / 46709 independently of EV-SIG-008's unregistrable receipts. Extended
    to n=13 as a build only, it also discharges the Stage-2 constructibility check L0 and
    yields the u_6 that decides B5.
  - >-
    Repair B1-B5 in a versioned protocol_amendment under
    experiments/EXP-SDEG-f7faa8/amendments/, never as an edit of the frozen text (IR7).
    Runs already executed are never re-scored against a repaired prediction; none were
    executed here.
  - >-
    A repaired contract needs a candidate family that is not confined to the partial-sum
    lattice, because P(pass) = 0 was proved for that lattice as a whole and not merely for
    C1/C2/C3. Widening the lattice is the substantive research step, and it should be
    routed through /propose-ideas so it acquires its own novelty screen and
    proof_search_map.
  - >-
    GOAL-SDEG-001 status, current_batch_id and next_action are UNCHANGED by this decision.
    Its "no runs now" posture stands. GOAL-SIG-001 and GOAL-DREG-001 are untouched.
  limitations:
  - >-
    Claim ceiling toy, and narrower than the contract proposed. What is established is the
    refutation of ONE MODEL FAMILY - and, better stated, of ANY partial-sum collapse
    convention on the reachable lattice - for one measurement instrument at n in {9,12},
    D in {5,6}. Nothing else.
  - >-
    sr_pred IS NEITHER REPAIRED NOR CONDEMNED. A negative here condemns a proposed REPAIR
    of the semi-regular prediction, not the prediction itself.
  - >-
    THE 7110 MECHANISM REMAINS FULLY OPEN. No explanation of the D6 below-freeze collapse
    is advanced, supported, or weakened by this decision.
  - >-
    NO GOAL IS UNBLOCKED. The "unblocks SDEG/DREG/SIG" justification in
    IDEA-20260803-202a15 is rhetorical on this branch: no goal's next_action changes under
    either outcome, and the Red Team is correct to say so.
  - >-
    Boolean systems are not prime-field systems. Nothing here transfers to the ECDLP
    target, KN-OPEN-002 is not closed or narrowed, no exponent is moved, Pollard rho
    remains the ECDLP baseline, and sota_delta is zero on every axis.
  - >-
    G1's anchor 7110 rests on EV-SIG-008, whose own artifact_absence_statement records that
    no claim in it is bound to a frozen protocol or reproducible receipt. The Red Team
    notes a committed RUN-EXP-SIG-008-n/raw.json (rank 149410, deficit 7110, builder sha
    e9f1681b...) that the contract leaves uncited; provenance is mis-stated in both
    directions and the cheapest control above repairs it.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No experiment ran and no evidence record was produced. A zero-compute refutation of
      one model family, reached during pre-approval review of a contract that was never
      approved, is not replicated or strong evidence and promotes no KN-FIND. The finding
      is durable in this decision and in the two committed review reports; if a repaired
      contract executes and the refutation survives independent replication, promotion
      should be reconsidered then.
  dominated_by: >-
    Not applicable - no attack, no Pareto point, no cost claim. Written explicitly rather
    than left null.
  sota_delta: >-
    Zero on every axis. No ECDLP or boolean-solving cost is improved, and no exponent is
    moved.
  decided_by: coordinator
  decided_at: '2026-08-05'
  inference:
    requested_policy: coordinator-orchestration
    resolved_model_id: claude-opus-5
    reasoning_effort: null
    fallback_used: true
    fallback_reason: >-
      This Claude Code harness cannot resolve the policy aliases in
      orchestration/model-policies.yaml. Recorded, never silently substituted
      (AGENTS.md rule 11).
    degraded_allowed: false
    degraded_requirements: []
    model_verified: false
    model_verified_reason: >-
      No adapter probe receipt exists for this session.
    review_independence: >-
      Both reviews ran as independent sessions that did not produce the artifacts, with
      disjoint write scopes and no coordination. BOTH RESOLVED TO THE SAME MODEL IDENTITY
      (claude-opus-5); independence here is session and role independence, NOT model
