coordinator_decision:
  id: DEC-20260921-4d1b40
  context: >-
    Design step of the research lifecycle for the ECDLP portfolio.
    IDEA-20260921-6a29df (lambda-registry census) was ranked first among
    the four proposals filed today against RQ-CRYPTO-001 (PR #1334, merged
    as d3acb61019) and among open ECC work generally, under the ECC-first
    priority of AGENTS.md: it is the cheapest decisive gate in the
    portfolio (hours of single-core exact FFT), it is the generator's
    recommended first test, it is measurement-class with a fully specified
    controls battery, and its two gate consumers (the lambda > 1/4
    learning threshold of IDEA-20260904-f68c7f (D) and the lambda >= 1/6
    n^{1/3}-corner floor of IDEA-20260920-b6ad24 (A3)) are already
    committed on file, so every outcome -- new band inhabitant, scoped
    negative, or void census -- is a recorded result with a named
    successor. Runtime provenance, recorded for auditability: the
    dedicated coordinator subagent failed its environment bootstrap (AWS
    DescribeInstances AuthFailure) at dispatch -- the same failure that
    affected the idea-generator dispatch earlier today -- so the
    hypothesis conversion and contract drafting ran in the top-level
    coordinator session under Coordinator authority, with this record and
    the specification's inference block carrying the substitution.
  decision: approve
  decided_by: coordinator
  target_ids:
    - IDEA-20260921-6a29df
    - H-ECDLP-4e1880
    - EXP-ECDLP-fac9ea
    - TASK-20260921-4888d4
  rationale:
    - >-
      USER APPROVAL BASIS: the standing user authorization of 2026-09-06
      ("all is approved. ideas/experiments should be always approved")
      supplies user approval; no per-experiment confirmation is required.
    - >-
      PROTOCOL COMPLETENESS (the Coordinator's own obligation, checked and
      passed): EXP-ECDLP-fac9ea v1 freezes the statistic registry (12
      rows), both prime ladders, the exact-transform convention (nontrivial
      additive L1 norm, fixed before any run), all four controls (all-ones
      endpoint, random-sign Parseval level on two seed sets, PGL_2
      reparametrisation battery, digit-sum reproduction band [0.36,
      0.42]), seeds and replication plan, primary/secondary metrics, gate
      verdict vocabulary, stopping rules, invalidation rules, tail checks,
      success and falsification criteria, required artifact paths, and the
      executor write scope. No required field is null.
    - >-
      Every possible outcome is decidable from the predefined metrics: a
      new lambda > 1/4 inhabitant, an all-lambda-<=-1/4 scoped negative,
      per-row unresolved/artifactual statuses, or a void census on control
      failure. No outcome is silently absorbable.
    - >-
      Budget is advisory per docs/research-budget-policy.md and
      AGENTS.md ("progress first"); only the 8 GiB memory ceiling is
      machine protection. The run is one full census pass over frozen
      cells (maximum_runs: 1).
    - >-
      Scope honesty: toy/medium ladder (p <= 2^26), gates necessary not
      sufficient, no crypto-scale claim, HEUR-1/HEUR-2 carried with their
      falsification conditions and checker re-derivations.
  evidence_refs:
    - IDEA-20260921-6a29df
    - IDEA-20260904-f68c7f
    - IDEA-20260920-b6ad24
    - IDEA-20260920-dd041a
    - knowledge/findings/KN-FIND-ffe1df.md
    - EV-FB-001
  limitations:
    - The census measures the frozen registry only; unmeasured statistics
      are unmeasured.
    - Ladder extrapolation beyond 2^26 carries the fitted error bar
      explicitly (HEUR-1).
    - Gate verdicts are necessary conditions; they license no attack or
      exponent claim.
    - The contract was drafted in the coordinator session rather than a
      coordinator subagent because of the runtime bootstrap failure
      recorded above; the inference provenance blocks carry this.
  next_actions:
    - Dispatch TASK-20260921-4888d4 to the executor against the frozen
      specification EXP-ECDLP-fac9ea v1.
    - Snapshot-archive the proposal, hypothesis, specification, decision,
      and handoff by exact path before executor dispatch.
    - On the completed run receipt: >-
        independent evidence review
        (/review-evidence) of the census, then the band-census consequence
        decision (new-inhabitant construction step vs scoped negative with
        synthetic-statistic-design successor).
    - Separately: >-
        repair or route around the role-runtime bootstrap
        failure (AWS credential probe) that blocked idea-generator and
        coordinator subagent dispatches today; it is an infrastructure
        impediment, not evidence, and is recorded here for the harness
        ledger's attention.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      The measurement has not run; nothing is promotable to knowledge/
      before a completed, reviewed run receipt exists.
