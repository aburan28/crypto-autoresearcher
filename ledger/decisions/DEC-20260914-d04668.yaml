      - 'experiments/EXP-FROB-b8cf21/runs/TASK-20260907-ee1e3c/metrics.json: the Delta_rank values and cell statuses quoted in dependency_and_ordering above.'
      - 'knowledge/literature/KN-LIT-796.md: the GGMP record, confidence reported, claims relayed from the abstract without independent verification.'
      - 'knowledge/techniques/KN-TECH-b18366.md: chained S_3 system size, and "Solving cost is NOT established -- it depends on the degree of regularity, which is the contested quantity (KN-OPEN-d218ec)".'
      - 'knowledge/open-problems/KN-OPEN-d218ec.md: the open (n, m, t, k) surface, the confinement of Assumption 1 support to n <= 21, m <= 6 plus n = 40, and the definitional gap.'
      - 'knowledge/literature/KN-LIT-71b758.md: Nagao separates the true from the fake first fall degree and proves d_F <= d_F-prime.'
      - '/home/user/crypto/src/cryptanalysis/koblitz_factor_base_search.rs lines 1-44: the definitions of p_m and U and the sentence naming (U + 1 + extra)/p_m as the minimised ratio, plus the divisor lattice as "the complete list of Frobenius-stable linear subspaces".'
      - 'tools/validate_ledger.py lines 140-342: handoff required fields [id, from, to, objective, budget]; review_plan optional but fully checked when present, requiring claim_under_review, coordinator_prior, non-empty owned joints with attack plans, proves_too_much.objects with a failure_signature, and blind_rederivation quantity/assigned_to/blind_from when required is true.'
    not_measured_by_this_agent: >-
      No factorisation of x^n - 1 was computed here, no curve was counted, no
      subgroup was enumerated, and no ker Tr was verified. The cell
      characterisations recorded in the contract (ord_5(11) = 1, ord_5(19) = 2,
      ord_5(13) = 4, ord_7(13) = 2) are PREDICTIONS FROZEN IN THE CONTRACT that
      the run must assert and report, not measurements. A mismatch is a frozen
      prediction that failed and is reported as such.

  review_disposition:
    review_required_on_TASK_20260914_7119f2: true
    rationale: >-
      It is a claim-relevant scientific producer whose outputs are the intended
      basis of a future EV-* record, so agents/coordinator.md requires
      review_required true with dependent independent review. It is not the
      zero-science case of TASK-20260909-4e8f94 or TASK-20260914-861bb9, both of
      which measure nothing and can move no claim; setting review_required false
      here would be wrong.
    review_plan_present: true
    declared_defect_in_that_plan: >-
      The plan's joint owners are ROLE ADDRESSES (validator, red-team, executor)
      rather than reviewer TASK-* identifiers, because this Coordinator was
      allocated exactly five identifiers and inventing a reviewer task id would
      be a fabrication under core rule 9. Those roles are real and declared in
      orchestration/roles.yaml. The dispatching session mints one TASK-* per
      owner and records the role-to-task binding in the NEW handoff that opens
      the review round; it must never edit TASK-20260914-7119f2, which is
      immutable. Until that binding exists,
      tools/check_review_independence.py cannot bind the plan to attestations and
      the round is not complete. This is recorded as a procedure_deviation on the
      handoff rather than absorbed silently, and it is the honest alternative to
      both an invented name and an eleventh incomplete review_plan of the kind
      already failing validation on ten other handoffs.

