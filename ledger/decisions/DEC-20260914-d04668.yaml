coordinator_decision:
  id: DEC-20260914-d04668
  decided_by: coordinator
  decided_at: '2026-09-14'

  context: >-
    /design-experiment was invoked on RQ-FROB-7d8dd4, the research question,
    rather than on a proposal. All five proposals under that question are
    already consumed: IDEA-20260906-a77711 by H-FROB-73df22 (EXP-FROB-d8aa37,
    approved, ZERO runs, runtime-impeded per DEC-20260914-37e0d9),
    IDEA-20260906-6da433 by H-FROB-17c272 (EXP-FROB-18da73, no runs),
    IDEA-20260906-a538a8 by H-FROB-2d6ccb (EXP-FROB-a95296, one run),
    IDEA-20260906-5d2fd9 by H-FROB-24f425 (EXP-FROB-0d885c, one run,
    EV-FROB-e61994 inconclusive) and IDEA-20260906-2dae28 by H-FROB-824aa8
    (EXP-FROB-b8cf21, run TASK-20260907-ee1e3c COMPLETED with a full artifact
    set and NO evidence record). With no open proposal, the Coordinator selects
    the next justified candidate under the AGENTS.md standing user
    authorization, mints it as IDEA-20260914-e2e0cf with the authorship
    deviation disclosed on the record, and completes its contract. This decision
    approves the complete frozen contract EXP-FROB-91ee9c v1 for hypothesis
    H-FROB-d93575, and dispatches nothing yet: it orders the EXP-FROB-b8cf21
    evidence review first.

  decision: approve

  target_ids:
    - IDEA-20260914-e2e0cf
    - H-FROB-d93575
    - EXP-FROB-91ee9c
    - TASK-20260914-7119f2
    - RQ-FROB-7d8dd4
    - EXP-FROB-b8cf21

  rationale:
    - >-
      WHY THIS RANKS AHEAD OF DOING NOTHING. FROB is an ECC area: it is listed
      in orchestration/research-priority.yaml under ecc_areas as
      "FROB      # Frobenius exploitation in subfield-curve index calculus",
      added 2026-09-06 with the other user-named targets, and that file is the
      single declared source read through tools/ecc_priority.py. AGENTS.md "ECC
      comes first, and its budget is unlimited" therefore places this work ahead
      of every non-ECC candidate at this selection point. Unlimited removes the
      batch ceiling, not the duty to rank, so the ranking is given on the merits.
      The FROB lane currently has five hypotheses, four approved or drafted
      experiments, and exactly two completed runs between them; one lane is
      runtime-impeded and one completed run is unreviewed. What is scarce here
      is not more design, it is a MEASUREMENT THAT CAN COME BACK NEGATIVE
      CHEAPLY. EXP-FROB-91ee9c is that: it is exhaustive rather than sampled,
      its enumeration is bounded above by q^(n-1) tuples per configuration
      (14641, 28561, 130321 and 4826809 in the four cells), it needs no Groebner
      engine, no solver, and no cloud runtime, and it can falsify at five
      distinct points. Doing nothing leaves the slot-count axis - which the
      sibling implementation's own objective function is defined over and which
      NO experiment in this program has ever swept - unmeasured while further
      experiments are designed on top of it.
    - >-
      DIRECTION CHECK AGAINST docs/target-result-profile.md, STATED HONESTLY.
      This experiment is NOT exponent-moving and is not presented as such. The
      Coordinator's standing bias is toward exponent-targeting mechanisms over
      constant-cofactor polishing, and a within-cell improvement factor of 4 in a
      combinatorial ratio is 2 bits of finite work that changes no asymptotic
      exponent whatsoever. It is approved as a CHEAP PRE-COMPUTE FALSIFICATION
      CHECK in the sense of docs/inventor-protocol.md section 8: the exponent
      question for this lane is whether Frobenius structure reaches the
      decomposition step, and every route to it passes through a factor-base
      design whose achievable configurations are exactly the divisor lattice of
      x^n - 1. If the slot-count axis is flat, several downstream designs lose
      their premise before anyone pays for a solver; if the null and control arms
      reproduce the object arm's spread, the whole lattice framing is measuring
      cardinality arithmetic and that is the most valuable thing this batch could
      learn. A failed audit is often the useful result.
    - >-
      NO CONDITIONAL RESULT IS DISPATCHED, SO NO PAIRED HEURISTIC-VALIDATION
      EXPERIMENT IS OWED. H-FROB-d93575 makes no asymptotic claim
      (asymptotic_claim null) and carries no heuristics (heuristic_assumptions
      empty, with the emptiness justified on the record). Every quantity is an
      exact finite count over an exhaustively enumerated toy panel. The four
      promotion gates in agents/coordinator.md are therefore not triggered by
      this approval, and nothing here may transition toward `supported` on the
      strength of it.
    - >-
      THE PROOF-ORIENTED DISPATCH GATE IS DISCHARGED. The contract carries a
      structural prediction (the direct sum of non-trivial factor kernels equals
      ker Tr), so KN-TECH-080 applies and proof_search_map is filled on both
      H-FROB-d93575 and EXP-FROB-91ee9c: the bottleneck is named; the baseline is
      embedded as the m = 1 single-invariant-base slice with a closed-form
      reproduction check (control C1); the observation-collision search is run as
      two ARMS rather than argued about (C3 matches U_neg exactly with no linear
      structure, C2 matches dimension exactly with no Frobenius stability); the
      quantifier order is explicit and forbids the witness partition from
      depending on any measured outcome; and the method ceiling comes with its
      nearby-object control, FROB-NOLATTICE-q13n5, which is the same n, the same
      total dimension and the same construction with the partition lattice
      removed. The trace identity is recorded as a PREDICTION WITH AN EXACT
      IN-PROTOCOL VERIFICATION STEP (control C5), never as an established fact,
      and C5 is deliberately built so that computing ker Tr from h(pi) - the
      circular route - is a review failure.
    - >-
      STANDING AUTHORIZATION. AGENTS.md "Standing user authorization for ideas
      and experiments" (user instruction 2026-09-06, verbatim "all is approved.
      ideas/experiments should be always approved") is the user-approval basis
      for the new idea, the hypothesis, the frozen contract and its execution. No
      user confirmation is sought and none is required. What the authorization
      does not do is supply protocol completeness: this Coordinator checked that
      inputs, controls, independent variables, primary and secondary metrics,
      the preregistered prediction, seeds, replication, stopping rules,
      invalidation rules, success criterion, falsification criterion, required
      artifacts, memory accounting and optimistic-assumption disclosure are all
      present and non-null before recording approval. Advisory time and CPU
      estimates are null, which docs/research-budget-policy.md and the CLAUDE.md
      budget instruction permit and which this Coordinator will not fabricate.
    - >-
      WHY A NEW IDEA RECORD RATHER THAN REUSING A CONSUMED ONE.
      IDEA-20260906-2dae28 is the nearest and is already bound to H-FROB-824aa8
      and EXP-FROB-b8cf21, which enumerate arbitrary COVERS (deliberately
      including overlapping and duplicate bases) and measure Delta_rank, a row-
      span diagnostic at fixed union columns. That is a different object from a
      DIRECT SUM given by a partition, a different independent variable (cover
      membership versus slot count), and a different metric (rank versus yield
      and cost ratio). Reusing the consumed proposal would have blurred two
      audits that must stay separable, and editing it is forbidden in any case.
      The authorship deviation - the Coordinator, not the idea-generator,
      produced this candidate - is disclosed in the idea record's
      provenance_note rather than hidden, because the usual independence between
      proposer and approver is absent here and a reviewer must know that.
    - >-
      NOTHING HERE CLAIMS AN ATTACK, A SPEEDUP OR A SECURITY CONSEQUENCE, AND
      THE CONTRACT IS WRITTEN SO THAT IT CANNOT. KN-LIT-796 is this program's
      record of Galbraith-Granger-Merz-Petit "On Index Calculus Algorithms for
      Subfield Curves" (ePrint 2020/1315, SAC 2020), whose relayed abstract-level
      claims are a 1/n reduction in the number of polynomial systems - "the best
      one could hope for" - an n^2 linear-algebra acceleration, and improved
      symmetry breaking. The further statement that index calculus on subfield
      curves gains more from subfield structure than rho does and STILL LOSES
      OUTRIGHT AT DEPLOYED SIZES is recorded in IDEA-20260914-e2e0cf with
      provenance `recalled`: no agent in this program has verified it, so it is a
      pointer for a reviewer and supports nothing, and it is recorded precisely
      so that the contract can be checked against it. EXP-FROB-91ee9c's
      affected_and_safe_scope states affected: NONE, and lists deployed Koblitz
      and sect-family curves as out of range by construction.

  approval_checklist:
    protocol_complete: true
    fields_verified_non_null:
      - inputs (four named parameter sets with per-cell justification and a frozen execution order)
      - controls (C1 baseline, C2 matched-dimension non-stable, C3 matched-cardinality random, C4 matched null curve, C5 exact trace identity, C6 known-false/proves-too-much, C7 denominator-zero, C8 independent recheck)
      - independent_variables, metrics.primary, metrics.secondary, and the binding measured/modelled separation rule
      - preregistered_prediction with quantity, formula, source, and an amendment path
      - optimistic_assumptions OA-1..OA-6, each with the direction of its bias
      - hidden_overhead_disclosure and memory_accounting with analytic sizing and a reconciliation rule
      - scale_relevance, tail_checks, replication (two seeds, up to two curves per cell)
      - budget (advisory nulls permitted; memory and workers bind), stopping_rules SR-1..SR-6, invalidation_rules IR-1..IR-9
      - success_criterion and falsification_criterion, both decidable from the predefined metrics
      - required_artifacts (fifteen exact paths) and run_record_contract
    nulls_remaining_and_why_they_do_not_block: >-
      budget.wall_clock_seconds_per_run and budget.total_cpu_hours are null, and
      inference.resolved_model_id is null. The first two are advisory research
      estimates that the budget policy explicitly permits to be null; the third
      is an honest absence because this Coordinator holds no shell and resolved
      no model. None of them is a scientific field, so status moves from
      review_required to approved.
    cost_model_pattern_clauses_honoured:
      measured_vs_modelled: >-
        Three mutually exclusive top-level objects - measured, modelled,
        derived_from_measured - with a formula string on every non-measured
        value, and IR-6 invalidating any file that mixes them in one column, row
        or object.
      optimistic_disclosure: OA-1..OA-6 with directions of bias; OA-2 is flagged as the largest and as biased specifically in favour of fine partitions, i.e. against the experiment's own hypothesis being conservatively stated.
      memory_accounting: Dominant structure named and sized analytically (min(prod_j |B_j|, N-1) entries at 8 bytes with load factor 2.0), reconciled against measured peak_rss_bytes, with a reported-not-explained-away rule outside [0.5, 4], plus the unused streaming time-memory tradeoff recorded so the measured peak is not mistaken for an intrinsic requirement.
      hidden_overhead: The entire per-trial algebraic half is disclosed as hidden inside the "one trial" unit, with the chained-S_3 system size from KN-TECH-b18366 and the contested d_reg from KN-OPEN-d218ec and KN-LIT-71b758 named as the reason it cannot be priced.
      standardized_parameter_sets: Four named sets with per-cell justification, plus an explicit affected/safe scope statement whose affected list is empty.

  cell_selection_rationale: >-
    n is prime and p does not divide n in every cell, so x^n - 1 is squarefree
    and its non-trivial irreducible factors automatically have equal degree
    d = ord_n(q), with s = (n-1)/d of them. That makes the factorisation type a
    one-parameter structural dial set by q mod n, and the ladder holds n = 5 and
    total non-trivial dimension 4 FIXED across the three core cells while moving
    only that dial: q = 11 (ord = 1, s = 4, x^5-1 splits completely - the richest
    lattice at n = 5); q = 19 (ord = 2, s = 2, two EQUAL-DEGREE quadratic
    factors - the required several-equal-degree-factors cell, where the partition
    lattice cannot be an artefact of degree-1 factors); q = 13 (ord = 4, s = 1,
    only dimensions 1 and n-1 achievable - the required NULL cell for the
    partition axis, which is what lets the design tell a partition effect apart
    from a generic one). The extension cell q = 13, n = 7 (ord = 2, s = 3, three
    equal quadratics) adds an m = 3 point at a second n and is explicitly not
    load-bearing. All four field sizes - 161051, 2476099, 371293 and 62748517,
    roughly 2^17 to 2^26 - lie in RQ-FROB-7d8dd4's declared toy window of about
    2^16 to about 2^40 with n prime, and all four are exactly enumerable because
    the tuple count per configuration is bounded by q^(n-1).

  dependency_and_ordering:
    finding: >-
      EXP-FROB-b8cf21's run TASK-20260907-ee1e3c is COMPLETED with all thirteen
      declared artifacts present, and HAS NO EV-* RECORD. Read directly by this
      Coordinator from
      experiments/EXP-FROB-b8cf21/runs/TASK-20260907-ee1e3c/metrics.json: at cell
      FROB-q7-n3-object01, cover "1,2,3", negation-only presentation, Delta_rank
      is 5 on the object arm and 6 and 7 on the two matched null arms - the
      control out-measured the object; and cell FROB-q7-n3-object02 carries
      status `ineligible_object` with reason `fixed_object_curve_pool_exhausted`,
      with its two null cells `not_run_no_eligible_object`, so only three of the
      four planned object cells and nine of the twelve planned cells reached a
      completed status. EXP-FROB-b8cf21's own specification states that "Fewer
      than 2 qualifying object curves at either field or any unmatched null makes
      the planned 12-cell experiment inconclusive". THESE ARE READS, NOT
      VERDICTS: this Coordinator is not interpreting that run here, and no
      evidence strength, direction or hypothesis status follows from this
      paragraph. Establishing what those numbers mean is exactly the job of the
      review being ordered.
    ordering_decision: >-
      YES - THE EXP-FROB-b8cf21 EVIDENCE REVIEW IS ORDERED FIRST, AND IT IS THIS
      DECISION'S NEXT ACTION NA-1. TASK-20260914-7119f2 is approved but NOT
      dispatched, and carries the dependency explicitly as DEP-1.
    why_this_ordering_and_not_parallel_dispatch: >-
      Three concrete reasons, none of them procedural. (1) The two experiments
      probe the SAME lattice with complementary diagnostics, and b8cf21's null
      arm out-measuring its object arm is the canonical artefact tell of
      docs/inventor-protocol.md section 3 - a quantity that does not decay when
      the parameter meant to destroy it is removed. Whether that is an artefact
      of the deliberately non-geometric membership-matched null, of the tiny
      q = 7, n = 3 cell, or of something real about the lattice, directly
      determines whether EXP-FROB-91ee9c's own null arm is strong enough as
      designed. (2) b8cf21's null arm was declared by its own specification to be
      non-geometric and unable to isolate a Frobenius effect; EXP-FROB-91ee9c's
      C4 is a GEOMETRIC null curve written as the response to that limitation,
      and the review is what confirms the response is the right one. (3) An
      unreviewed completed run is the most expensive thing in this lane: it is
      finished science that cannot be cited. Dispatching a second uninterpreted
      run set on the same lattice ahead of it would grow that backlog rather than
      reduce uncertainty, which is the make-work failure AGENTS.md warns about.
    what_would_discharge_the_dependency_without_the_review: >-
      A committed Coordinator decision stating the reason for proceeding without
      it. The ordering is a ranked judgement, not a prohibition: if the b8cf21
      review is itself impeded - for instance by reviewer availability - the
      correct response is a recorded reason and dispatch, not an indefinite
      hold. An impediment is never negative evidence and never parks a lane.
    what_this_ordering_does_not_do: >-
      It changes no status on EXP-FROB-b8cf21, H-FROB-824aa8 or any other
      record, asserts nothing about whether b8cf21's result is positive,
      negative or invalid, and does not pre-judge its review. EXP-FROB-b8cf21
      remains exactly as committed.

