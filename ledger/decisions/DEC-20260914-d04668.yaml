  verification:
    attribution_note: >-
      HONEST ATTRIBUTION per AGENTS.md core rule 9. This Coordinator subagent
      holds no shell. It ran no command, executed no test, recomputed no hash,
      ran no factorisation, invoked no tools/allocate_id.py, tools/ecc_priority.py
      or tools/validate_ledger.py, and probed no runtime or model. Every factual
      item below was read from a file by this agent. The five record identifiers
      used here were allocated and --check-verified by the dispatching session
      and supplied to this agent; this agent minted none and may mint none.
    read_by_coordinator:
      - 'orchestration/research-priority.yaml: FROB is listed under ecc_areas with the comment "Frobenius exploitation in subfield-curve index calculus".'
      - 'ledger/questions/RQ-FROB-7d8dd4.yaml: status active, owner coordinator, goal_ids [], toy window "q^n from about 2^16 to about 2^40, n prime between 5 and 41", mandatory non-subfield null in every measurement, deployed curves never instances, claim tier toy.'
