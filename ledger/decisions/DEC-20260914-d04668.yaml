  limitations:
    - >-
      THIS DECISION APPROVES A CONTRACT AND IS NOT EVIDENCE. Zero scientific runs
      exist for EXP-FROB-91ee9c. H-FROB-d93575 is `approved`, which asserts that
      its protocol is complete and worth executing and asserts nothing about
      whether its statement is true.
    - >-
      No existing record was edited and no existing status was changed. In
      particular H-FROB-73df22, H-FROB-17c272, H-FROB-2d6ccb, H-FROB-24f425 and
      H-FROB-824aa8 keep their committed statuses; EXP-FROB-b8cf21 keeps its; no
      GOAL-* record was created, edited, paused or blocked; and no attestation of
      any kind is recorded here, because none was obtained.
    - >-
      Scope of the approved work: four named toy cells at (q, n) = (11,5),
      (19,5), (13,5) and (13,7), self-generated ordinary curves, exact arithmetic,
      one aggregate run, measuring the combinatorial half of relation collection
      only. It says nothing about any other q, any other n, any other curve, any
      solver, any descent, any deployed parameter, or Pollard rho.
    - >-
      Ranking slot counts by END-TO-END solve cost is out of reach and is
      forbidden to any record descending from this one. It needs d_reg, which is
      contested: KN-OPEN-d218ec records that the surface separating d_F4 = 4 from
      d_F4 >= 5 is unknown and that it is open whether this program's d_reg
      statistic is even Semaev's quantity, and KN-LIT-71b758 separates the true
      first fall degree from the fake one. Worse for this axis specifically, the
      chained-S_3 system size grows with the slot count (KN-TECH-b18366), so the
      omitted algebraic cost moves AGAINST the very quantity being measured.
    - >-
      No refutation artifact is required or claimed here: this decision makes no
      adverse transition. Nothing is weakened, rejected or scoped out, and no
      obstruction block is asserted.
    - >-
      This Coordinator ran no command and measured nothing; see
      verification.attribution_note for exactly which facts are its own file
      reads and which are frozen predictions the run must test.
    - >-
      The cited statement that index calculus on subfield curves still loses
      outright to rho at deployed sizes carries provenance `recalled` and
      supports nothing. It is recorded as a pointer and as a constraint the
      contract must not contradict, and it is a reviewer's job to check it
      against the source.

