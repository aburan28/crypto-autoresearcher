  context: >-
    The line is at 414303194 after 398fce, with 1087 files and verify_archive
    passing. CI fails on two checks.
    (1) The ledger job reports the three AMD A-4 DEF-1 lines for the table,
        calibrate and analysis run roots. These are expected, and PROC-DEF1-C
        repairs them at NA-6.
    (2) One harness test fails:
