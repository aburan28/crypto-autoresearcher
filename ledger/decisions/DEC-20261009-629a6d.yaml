        It accepts a superseding record only in the run directory, with a
        run.supersedes chain, or under experiments/<EXP>/corrections/. The
        PROC-DEF1 records sit at experiments/EXP-PFDR-0b3699/supersessions/<RUN>/manifest_v2.yaml,
        outside the run root, by DEC-20261009-ff58fe's ruling, so that no
        archived checksums.sha256 changes. That location is a fifth
        vocabulary the test does not yet know. The finding is a gap in the
        test, not in the records.

  exact_change:
    file: tools/test_run_supersession.py
    task: TASK-20261009-c2666f
    a_helper: >-
      Insert, immediately after the function _is_experiment_correction (it
      ends at the line "    )" after `and parts[2] == "corrections"`), one
      blank-line-separated function:
        def _is_experiment_supersession(path: Path, repo_root: Path, run_id: str) -> bool:
            """True for experiments/<EXP>/supersessions/<run_id>/manifest_v2.yaml under repo_root."""
      It returns True iff path.resolve().relative_to(repo_root).parts has
      exactly five parts, where:
      - parts[0] == "experiments";
      - parts[2] == "supersessions";
      - parts[3] == run_id;
      - parts[4] == "manifest_v2.yaml".
      It returns False if relative_to raises ValueError.
    b_branch: >-
      In test_superseding_record_declares_the_supersession_from_its_own_side,
      insert a new branch immediately after the corrections branch's
      `continue` and before the line
      `self.assertEqual(current.parent, run_dir, str(current))`, preceded by
      a three-line comment naming the "fifth vocabulary: experiment-level
      supersessions/<RUN-ID>/manifest_v2.yaml (DEC-20261009-ff58fe PROC-DEF1;
      DEC-20261009-629a6d)". The branch applies when
      _is_experiment_supersession(current, repo_root, entry["run_id"]) holds.
      It loads doc = yaml.safe_load(current.read_text(encoding="utf-8")),
      asserts each of the following with str(current) (or
      str(registry_original)) as the message, and then `continue`s:
        (1) current.relative_to(repo_root).parts[1] ==
            registry_original.relative_to(repo_root).parts[1]
            (same experiment directory);
        (2) doc["run"].get("id") == entry["run_id"];
        (3) sha256_of(current) == entry["superseding_sha256"];
        (4) sha256_of(registry_original) == entry["superseded_sha256"];
        (5) declared = doc.get("supersession") or {} and
            (repo_root / declared.get("supersedes_path", "")).resolve() ==
            registry_original;
        (6) declared.get("supersedes_sha256") == entry["superseded_sha256"].
    must_not_alter:
      - any existing line of tools/test_run_supersession.py (the diff is insertions only)
      - every other test, constant, debt set and helper in the file
      - any other file under tools/ (tools/validate_ledger.py and tools/run_supersession_registry.yaml included), any record, any manifest_v2.yaml
    why_this_shape: >-
      The branch checks everything the corrections branch checks (run id,
