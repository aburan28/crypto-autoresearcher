coordinator_decision:
  id: DEC-20261023-122e32
  context: Independent composition of the prospectively approved held-out balanced-slot native IC
    target experiment.
  decision: accept
  target_ids:
  - EXP-ICPERF-6c546e
  rationale:
  - Independent fresh reviewer owns J-integrity and J-inference; unchanged algebra dependency retains
    its prior blind independent certificate.
  - "All162 workers and known-false controls pass; every arm crosses all execution slots. No known\
    \ competing scientific producer was launched during17:06:26\u201317:07:07UTC; host-global isolation\
    \ remains unproved."
  - Scoped end-to-end native instrumented solve improvement meets speedup>max(1.05,A/A) and clustered
    lower endpoint>1; retain both disclosed percentile conventions.
  - Earlier EXP-ICPERF-3065f9 remains preliminary/not_isolated; no retrospective timing promotion
    or pooling.
  evidence_refs:
  - EV-ICPERF-92c130
  - coordination/tasks/TASK-20261023-6562b0/review_report.yaml
  - claims/ic-target-balanced-6c546e.json
  limitations:
  - One machine and one session, AMD EPYC 9V74, Linux x86_64, CPython3.12.14, scalar native mitm
    engine. Results do not replicate across machines, runtimes or sessions.
  - Nine independently generated public curves, only three curve groups per bit stratum. The54 paired
    cell-repetitions are not54 independent curves; clustered bootstrap uncertainty is conditional/descriptive,
    not population assurance or asymptotic validation.
  - Curve seeds3/4/5 are held out from the seen seeds0/1/2. Sizes12/14/16, mechanism and success
    threshold were informed by the original observation; this is held-out-instance confirmation,
    not independent discovery.
  - "All workers pin CPU0 and report matching environment and loads, but pre/post process census\
    \ includes only surviving processes in the visible namespace. It misses transient activity and\
    \ cannot prove host-wide isolation, CPU frequency stability, cache state or absence of unobserved\
    \ host activity. Parent reports no known concurrent scientific producer during17:06:26\u2013\
    17:07:07UTC; that is orchestration context, not a host-global isolation certificate."
  - Five of54 candidate paired observations are slower than the arithmetic reference mean. Per-size
    and per-slot gains are descriptive; the pooled gate does not certify every individual curve/seed/trial,
    and A/A geometric mean is not an upper bound on arbitrary timing noise.
  - The frozen specification says empirical percentiles without prescribing endpoint rounding. The
    independently generated bootstrap supports both the blind floor-index interval and the prior
    empirical-index convention, with the same strict gate. This small endpoint convention difference
    is disclosed, not silently normalized.
  - Base worker timing/instrumentation semantics are reused from the committed prior independent
    full audit after checking unchanged source hash. This review freshly derives new raw statistics
    and replay certificates; it does not claim a new blind audit of base implementation.
  - The wrapper manifest says certificate.kind:none; actual solve witnesses are all162 raw result.k
    values plus bound public instances, independently verified here. No zkVM execution proof or sealed
    machine-bound measured bound follows from hashes or certificates.
  - No matched rho or Bernstein-Lange gaps were measured. No production-curve, cryptographic security-level,
    asymptotic, frontier, default, attack-cost-bound, novel-algorithm or best-known-baseline change
    follows. Promotion requires the Coordinator archive/decision and any applicable progress-fidelity
    record.
  next_actions:
  - Expose/document optional fixed_window generator and exact scoped delta; preserve reference default
    and all prior records.
  - Keep GOAL-ICPERF-e6b6a4 active. A subsequent full-pipeline/best-known-baseline comparison, matched
    rho/BL gap or larger/vectorized scope needs its own frozen contract and independent review.
  knowledge_promotion:
    promoted: []
    not_warranted: Scoped native engineering measurement only; no new theorem, best-known frontier,
      official measured bound or hypothesis-state promotion.
  decided_by: coordinator
  decided_at: '2026-10-23'
