# =============================================================================
# DEC-20260926-c8d4b0 -- EVIDENCE REVIEW of EXP-WESO-9e2d6d (H-WESO-516558),
# Stages A-C. Decision: INCONCLUSIVE for Heuristic 1. Stage C is FC-VOID
# (SR-4, NULL-2 band), so no reading of either sign is drawn. The Stage-B
# sampler result is recorded as a preliminary toy-scale measurement. The
# NULL-2 failure is diagnosed, provisionally, as a comparator-calibration
# defect of the frozen protocol. The Stage-D ruling (SR-4 governs) is upheld.
# H-WESO-516558 moves approved -> analyzed with no directional transition.
# Next: independent review (AC-6), an exact-Psi diagnostic, an additive
# protocol amendment with a fresh-seed confirmatory arm and Stage D, and
# Delgado verification ranked ahead of that replication.
# Evidence: EV-WESO-af78c1. Analysis: experiments/EXP-WESO-9e2d6d/analysis.md.
# =============================================================================
