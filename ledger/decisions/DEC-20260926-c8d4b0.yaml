  validity_verification:
    verdict: >-
      Run set valid for review. A and C are valid and schema-complete. B is
      valid as reported, but its raw/summary agreement has not been
      independently recomputed and its per-sample file is in ephemeral
      storage. That is a confound, not an invalidation. Details:
