      factorisations). Stage A exact. Stage B not independently recomputed.
    controls: NULL-1/NULL-2/arms comparable; NULL-2 generator unbiased (code read)

  rationale:
    - >-
      FC-VOID IS BINDING. The frozen falsification_criterion defines FC-VOID
      as "no H-1 reading of either sign", and SR-4 stops before any criterion
      is evaluated. The Stage-C smoothness values (EV-WESO-af78c1 O-4) are
      therefore observations only, even those computed against the
      model-free NULL-1. Reading them now, in either direction, would be
      re-scoring a frozen protocol after seeing its data. The evidence cannot
      discriminate between the H-1 explanations, so the decision is
      inconclusive.
    - >-
      THE NULL-2 FAILURE IS A MEASUREMENT, NOT NOISE. S_NULL2 = 336 / 10^5
      gives a 99% ratio interval of [2.13, 2.82] against rho(4.5); the lower
      end exceeds the band edge 2.0 (analysis.md C-2).
    - >-
      DIAGNOSIS (PROVISIONAL): A COMPARATOR-CALIBRATION DEFECT OF THE FROZEN
      PROTOCOL, NOT A CODE DEFECT. The evidence (analysis.md C-3, C-4, I-3):
      (a) CLS-1, the IV-4 sympy re-verification and the generator code leave
      no path to a wrong NULL-2 count.
      (b) At large B, both null populations reproduce the first-order
      classical terms to within about 1-2.5%, and those terms have opposite
      signs: NULL-2 matches the cumulative term 1 + (1 - gamma) rho(u-1) /
      (rho(u) ln X), and NULL-1 against the spec's rho-sum matches the
      point-density term 1 - gamma rho(u-1) / (rho(u) ln X).
      (c) The excess over first order grows monotonically as B falls at
      each prime (to 2.0 at the failing cell).
      (d) The band [0.7, 2.0] and the B >= 128 floor were fixed without a
      finite-size model.
      The decisive check, an exact count of 131-smooth integers <= 3408917801
      against S_NULL2 = 336, was NOT computed in this act (no execution
      tool). It is NA-3. If it disagrees beyond binomial error, this
      diagnosis is withdrawn and the run returns to the Executor as a code
      defect.
    - >-
      A SECOND DESIGN DEFECT SURFACED BY THE SAME ANALYSIS. The protocol uses
      rho for two different quantities: the cumulative fraction
      Psi(X,B)/X (above rho) and the point probability for integers of a
      given size (below rho at first order). Its R_max expected_direction
      rationale and PRED-2's size-matched rho-sum inherit this conflation.
      The model-free NULL-1 is the size-consistent comparator. This informs
      the amendment (NA-4). Because it was found after the data were seen,
      the amendment must say so.
    - >-
      STAGE B IS A VALID MEASURED RESULT WITHIN ITS SCOPE, at preliminary
      strength: one run, toy primes, grid-limited c_hat (threshold in
      (12, 16] at every prime), no independent recomputation or review yet,
      and tight type-level margins (1019, k = 64: 0.00009 below the floor).
      It is consistent with H-S at the four primes. It says nothing about
      transfer to 64-250 bits. No H-S status change is made on it before
      AC-6 review.
    - >-
      STAGE-D RULING REVIEWED AND UPHELD: SR-4 governs. Reasons (analysis.md
      I-5):
      (a) stopping rules are the specification's control flow, and "any
      verdict" ranges over decision outcomes that presuppose IG; FC-VOID is
      an instrument void, not a verdict;
      (b) EX-4 says "gate failures stop as SR-1..SR-9 say";
      (c) AC-2 says "a gate stop ends the card's execution at that stage";
      (d) under ambiguity, the conservative reading spends no compute and
      loses no evidence;
      (e) Stage D would have carried the same unresolved comparator question.
      Not running Stage D is never evidence (AGENTS.md core rules 5 and 9).
      RUN-WESO-0b4b33 is retired unused. A future Stage D takes a newly
      minted id under the amended protocol.
    - >-
      (p64, u = 3) FLOAT DEFECT RESOLVED EXACTLY, not by float. B =
      (p/2)^{1/9} >= 128 iff p >= 2^64, and p64 = 2^64 + 51, so the cell is
      admissible (N rho(3) = 4860.8). No other grid cell is at the boundary.
      Smooth counts are unaffected. Its NULL-2 ratio is 1.477, inside the
      band. FC-VOID is unchanged. Only the u = 3 members of the SEED-1, KS-1
      and START-2 families at p64 (family size 5, alpha 0.002) remain to be
      recomputed from the retained samples (NA-2). They cannot change the
      outcome code.
    - >-
      WHY INCONCLUSIVE AND NOT REFINE/REPLICATE AS THE LABEL. The operating
      rule is that evidence that cannot discriminate yields inconclusive. The
      refinement (amendment) and the replication (fresh seeds) are the
      next actions this label schedules, per DEC-20260926-ec2847's attention
      contract ("If the verdict is inconclusive, the next decision is a
      targeted replication ... not a re-scoring"). No `weaken` is possible:
      there is no adverse reading, and FC-VOID forbids one.
    - >-
      HYPOTHESIS STATUS. H-WESO-516558 moves approved -> analyzed: its
      experiment was executed and analyzed. This follows the ledger
      convention of editing `status` in place and appending a
      `status_history` entry with a decision ref (e.g. H-WESO-001,
      DEC-20260724-016). The `running` state was passed through when
      TASK-20260926-41c7e7 was dispatched and was not recorded then; it is
      noted, not back-dated. No directional state (supported, weakened,
      rejected, inconclusive) is entered. The hypothesis stays open for the
      amended re-test.
    - >-
      PRIORITY AND DELGADO (KN-LIT-6fb205, read in full, unverified).
      If Delgado holds, Heuristic 1 no longer carries the p^{1/3} exponent.
      Verifying it is therefore an exponent-level question, and under the
      program's bias toward exponent-moving work it is ranked AHEAD of the
      H-1 confirmatory replication (NA-4d/NA-5).
      The H-1 line is deprioritized behind that verification, not closed. It
      keeps independent value:
      (i) the heuristic as literally stated is still cited by GOAL-SSIQ-001
      SC-1;
      (ii) concrete cost at SQIsign parameters is governed by Wesolowski's
      heuristic algorithm, because Delgado disclaims concrete costs and
      carries constants of order 2^80 n^4, and the calibration found here
      (rho vs Psi) bears directly on that cost;
      (iii) the sampler result.
      NA-2 and NA-3 are cheap, need no new sampling, and proceed regardless.
      Revisit condition for the replication's rank: archival of NA-3, or a
      committed verification outcome for KN-LIT-6fb205, whichever comes first.

  scoped_statement: >-
    At p in {1019, 4099, 10007, 20011}, the endpoint of a uniform
    non-backtracking norm-2 ideal walk from O_0 of length k >= 16 was
    statistically indistinguishable (TV at or below the 99.9% multinomial
    null floor of 0.018-0.027 on the delta law; 0.038-0.063 on the type law at
    1019 and 4099; 10^4 draws per cell) from the exhaustive Eichler-mass-
    weighted law, and was distinguishable for k <= 12. Over the tested
    instances, parameters, solver and budget, EXP-WESO-9e2d6d produced no
    admissible reading of Heuristic 1 of either sign: its pre-registered
    instrument check failed because Dickman rho(4.5) = 0.00137 understates
    the measured 131-smooth fraction of uniform integers <= 3408917801
    (0.00336; 99% ratio interval [2.13, 2.82]).

