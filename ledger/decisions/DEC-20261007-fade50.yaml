  context: >-
    One cycle of design-experiment plus propose-ideas.
    IDEA-20261006-4c39d3 is on origin/design/frob-bda728-descent and
    is not on origin/main. The question is RQ-ECDLP-bc7a54, listed on
    GOAL-ECDLP-001. No hypothesis or experiment on origin/main cites
    that full id. The branch design/ecdlp-4c39d3 was created from
    origin/main at dd2fabaf827e69460d7f2834ecfd07e5f99f8971. The merge
    of origin/main was already up to date. The copied proposal bytes
    hash to blob 6486bd85dbb8ac9171cf078ecfb2fdc07ff16484 and parsed
    as YAML without a quote change. The question id is
    RQ-ECDLP-bc7a54. The prediction is an ordinary-to-random
    interpolation degree ratio of at least 1/2, and an anomalous
    calibration ratio strictly below 1/2.

    python3 tools/portfolio_kpis.py --capacity GOAL-ECDLP-001 reports
    approved_unrun=7, cap=3, headroom=0. The seven contracts are
    EXP-ECDLP-08f99d, EXP-ECDLP-96c4dc, EXP-ECDLP-b2e5d1,
    EXP-ECDLP-c74a83, EXP-LHW-22aefa, EXP-SEMAEV-a097b5, and
    EXP-SMTH-9d04ba. This decision does not name any of them under
    supersedes_experiments or withdraws_experiments.
    check_approval_capacity is the validator check that would reject
    an approving decision. The contract therefore stays
    review_required.

    The missing driver is a program that tabulates a prime-order
    subgroup, draws S inside {Q : x(Q) < p^{2/3}}, and reports the
    minimal total degree of a bivariate polynomial agreeing with the
    discrete log on S, the same degree for two random bijections, and
    the same degree on one anomalous curve. A search of origin/main
    for the phrase "minimal total degree" under *.py and *.md returned
    no path. There is no trial-plan.json. The only file under runs/ is
    .gitkeep, so execution_progress reports needs_reconciliation
    because any directory entry counts as activity. That label does
    not mean a run exists. newest_experiments.py --experiment
    EXP-ECDLP-58aaaa returns no selectable row because status is not
    approved. The contract is not execution_state ready.

    Success is the source idea's prediction. The concrete negative is
    an ordinary degree ratio strictly below 1/2 on both ordinary
    curves, with the instrument checks passed and the anomalous ratio
    strictly below 1/2. No degree was computed in this session. The
    same pass files IDEA-20261007-1a61b9, IDEA-20261007-611573, and
    IDEA-20261007-41f810 and does not design them.

  rationale:
    - The standing authorization covers a complete runnable protocol. This one is over the approval cap and has no interpolation-degree driver, so it is not approved.
    - check_approval_capacity is the named validator check. GOAL-ECDLP-001 has approved_unrun=7 against cap 3. An approving decision would be rejected. This decision does not force approved.
    - The missing driver is the bivariate interpolation-degree comparison. No program on origin/main reports that degree.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - An ordinary ratio strictly below 1/2 on both curves, with the instrument checks passed, is reachable as a recorded outcome, so success is not automatic.
    - The random-degree stability check, the dimension threshold, the anomalous drop, and the excluded curve are the instrument controls.
    - An instrument failure is not relabeled as a ratio below 1/2.
    - This session did not compute a degree and did not claim that the exponent 1/2 moves.
    - No run id was minted. The replication plan does not name a future run slot while the trial plan is unfrozen.

  evidence_refs: []
  limitations:
    - The measurement, once run, covers two ordinary curves and one anomalous curve at toy N in (2^{10}, 2^{12}). It does not transfer to cryptographic N.
    - A passing ratio does not lower the rho exponent 1/2.
    - A calibration failure and a crash are not the negative.
    - This decision does not authorize execution.
    - This decision does not edit a goal head.
    - The three new proposals are not hypotheses and are not approved experiments.

  next_actions:
    - A later session may approve EXP-ECDLP-58aaaa only after check_approval_capacity reports headroom on GOAL-ECDLP-001 and an interpolation-degree driver exists. Both were absent on 2026-10-07.
    - Do not dispatch TASK-20261007-287e0b from the design session that wrote this decision.

