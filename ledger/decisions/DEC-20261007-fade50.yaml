    decision does not assert that the ordinary degree ratio is at
    least 1/2, does not assert that it is below 1/2, and does not
    rewrite IDEA-20261006-4c39d3.

  decision: revise
  decision_label: >-
    Specify H-ECDLP-03e287 and leave EXP-ECDLP-58aaaa at
