          instrument, not a target population, and RQ-BINSTD-b6f698 names it
          only as the place its cost columns would be measured. It stays a
          cross-reference.
        - >-
          No new goal. Creating one needs an explicit user request and none
          exists, and an existing goal fits.
        - >-
          All four together, not BINSTD and CERTBIN alone. NISTBIN and OAKLEY
          are in the same unattached state, carry six open ECC proposals that no
          decision has ever cited, and are declared roll-ups of the same goal.
          One append to a shared flat head is cheaper and less conflict-prone
          than three.
    - id: R2
      subject: non-duplication inside the cluster
      ruling: >-
        RQ-BINSTD-b6f698 owns the population-indexed REACHABILITY TABLE and the
        structural-emptiness certificates for its rows, and nothing else, as its
        own constraint "This question OWNS NO MECHANISM" already says.
        RQ-CERTBIN-836ce2, RQ-NISTBIN-06157b and RQ-OAKLEY-264353 own the
        measured per-family decomposition cost on their own scaled-down
        siblings. A BINSTD cell that needs a measured cost cites the owning
        sibling's (or the mechanism owner's) measurement and never re-measures
        it under BINSTD. The ranking task (TASK-20260924-25a6b2) and the
        selection (DEC-20260924-99ce20) apply this when proposals overlap.
      rationale: >-
        The four questions were posed on the same day and cover overlapping
        curves: the FIPS 186-4 binary curves are rows of both BINSTD and
        NISTBIN; ECC2K-130 and ECC2-131 are rows of both BINSTD and CERTBIN; and
        the composite-degree ANSI curves in BINSTD are the GHS class that
        OAKLEY's comparator addresses. Without an ownership rule, two designs
        could measure the same cell under two questions.
    - id: R3
      subject: custody, not science
      ruling: >-
        The attachment is custodial in exactly the sense of GOAL-ECDLP2M-001's
        adoption_note. It changes no status, claim or evidence of any record
        under the four questions. It re-approves nothing. It does not re-home
        any open item: DEC-20260923-f25b97 next_actions NA-1 to NA-7 stay owned
        where they were recorded. H-CERTBIN-a73f1c is NOT added to
        active_hypothesis_ids, because no batch of this goal works it. No
        question record is edited.
    - id: R4
