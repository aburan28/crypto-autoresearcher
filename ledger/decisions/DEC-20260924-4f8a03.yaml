        DEC-20260923-f25b97 NA-8 for RQ-CERTBIN-836ce2.
      rationale:
        - >-
          The goal's declared scope contains all four. Its field family is
          binary extension fields F_(2^m). Its mechanism families name
          summation-polynomial decomposition, GHS/Weil descent, and
          Frobenius-orbit and subfield-orbit relation generation, which are
          exactly the lines these questions index.
        - >-
          orchestration/research-priority.yaml declares OAKLEY, CERTBIN and
          NISTBIN as roll-ups of GOAL-ECDLP2M-001, and each of those question
          records says rolls_up_to GOAL-ECDLP2M-001. RQ-BINSTD-b6f698's own
          goal_note names GOAL-ECDLP2M-001 as the goal whose declared scope
          contains it and defers attachment to a Coordinator act on a committed
          decision. This is that act.
        - >-
