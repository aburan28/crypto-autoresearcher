        is run and discharged for this batch. RQ-FROB-7d8dd4 is listed in
        GOAL-FROB-6333a9 question_ids, so it has an owning goal and is NOT
        adopted here. The candidate adoption is moot while that holds. The head
        entry is annotated additively; its recorded text is kept.
    - id: R5
      subject: goal-head layout
      ruling: >-
        GOAL-ECDLP2M-001 is NOT converted with tools/shard_goal.py in this act.
        The edit is additive to the flat file.
      rationale: >-
        The flat head carries no batch_checkpoints list, so shard_goal.py would
