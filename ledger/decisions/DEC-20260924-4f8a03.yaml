  rulings:
    - id: R1
      subject: attachment
      ruling: >-
        Append RQ-BINSTD-b6f698, RQ-CERTBIN-836ce2, RQ-NISTBIN-06157b and
        RQ-OAKLEY-264353 to GOAL-ECDLP2M-001 question_ids, after the existing
