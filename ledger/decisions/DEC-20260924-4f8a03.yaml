        opened and from DEC-20260922-61cdc1 NA-2's preference, and says so.
      revisit: >-
        Convert when the QSP lane records (BATCH-1faf6f, -ed05f2, -9dbda3,
        -ee209c, -2c4a9c) are closed, or at the first checkpoint that would add
        a batch_checkpoints entry, whichever is first.
    - id: R6
      subject: review tier
      ruling: >-
        No review round and no review_plan. Every card has review_required
        false.
      rationale: >-
        Nothing in BATCH-81fda1 can change a claim. The ranking report is
