coordinator_decision:
  id: DEC-20260809-7a7099
  goal_id: GOAL-SSI-001
  batch_id: BATCH-c057fd
  recorded_by_task: TASK-20260809-1654d3
  archived_by: TASK-20260809-1654d3
  context: >-
    BATCH-c057fd opened an additive successor to EXP-SSI-8e589d after the
    BATCH-0a1b85 review found direct b_order/b_index undercounts and broader
    finite-contract gaps. Fresh independent Validator and Red Team sessions
    reviewed the immutable EXP-SSI-357363 snapshot. Neither executed an
    experiment or diagnostic.
  decision: refine
  decision_scope: >-
    Retain EXP-SSI-357363 as a materially improved but incomplete design
    candidate and open a further additive clarification. This decision does not
    freeze the contract, authorize execution, change hypothesis or experiment
    status, or make any SSI, SQIsign, attack, security, novelty, or exponent
    claim.
  target_ids: [IDEA-20260806-9c2f80, EXP-SSI-8e589d, EXP-SSI-357363, GOAL-SSI-001]
  evidence_ids: [EV-SSI-736443]
  review_ids: [VAL-20260809-ad1631, RT-20260809-bcd3d9]
  review_task_ids: [TASK-20260809-ad1631, TASK-20260809-bcd3d9]
  snapshot_commit: d2e1cb4eed78b798682b779db3d86ee17c60d024
  rationale:
    design_progress: >-
      The successor repairs the direct predecessor byte-width contradictions
      and adds literal branch/domain codes, count-width intent, a hard attempt
      cap, typed output paths, helper-manifest names, paired-replay identity
      intent, owner-mismatch exceptions, C statistic shape, and an explicit
      non-SSI boundary. Both reviews confirm these as design improvements only.
    independent_validation: >-
      Validator TASK-20260809-ad1631 returned incomplete with
      DISSENT_ON_FREEZE_AND_EXECUTION_READINESS and recorded seventeen
      unresolved finite-contract defects, including provenance-path, helper,
      framing, index, output, path, replay, null, and diagnostic gaps.
    independent_red_team: >-
      Red Team TASK-20260809-bcd3d9 returned DISSENT on freeze and execution
      readiness, while concurring with the additive design-only and unauthorized
      execution boundary. It independently found C-helper undercounting,
      query-key, setup, external-certificate, output, replay, null, and
      synthetic-statistic defects.
    execution_authorization:
      granted: false
      reason: >-
        The direct width equations now survive, but the finite contract still
        lacks complete helper bytes, canonical frames, bounded counter output,
        manifest/index/query semantics, output-producing C paths, end-to-end
        certificate accounting, computable q/T_inc/break-even, paired trace
        bytes, valid nulls, and calibrated diagnostics. No execution task may
        be opened from this decision.
    claim_boundary: >-
      No measurement, run, attack, security, exponent, novelty, hypothesis
      transition, or goal completion follows from either review.
  official_research_state_changed: false
  hypothesis_status_transition: none
  experiment_status_transition:
    - id: EXP-SSI-357363
      from: review_required
      to: review_required
      note: >-
        The successor remains review_required, unfrozen,
        execution_authorized:false, evidence_eligible:false, and approved_by
        null. EXP-SSI-8e589d and all earlier predecessors remain immutable.
  asymptotic_promotion_gates:
    gate_1_proof_decomposition: open
    gate_2_numbered_heuristics: open
    gate_3_concrete_cost_table: open
    gate_4_independent_review_and_red_team: >-
      Completed only as an execution-blocking design review; all scientific
      promotion gates remain open.
  next_actions:
    - >-
      Open an additive successor that first corrects the successor provenance
      paths, then freezes C-HELPER-v1 and all SSJ/ORDER/helper manifest headers,
      payload widths, capacities, digests, and setup equations.
    - >-
      Define complete SSI-BYTES-v1 frames, bounded biguint/counter encodings,
      target-derived query keys, finite saturation outcomes, HNF/output source
      and C terminal order semantics, and exact EDGE-STREAM certificate
      availability/FOE accounting.
    - >-
      Close q/T_inc/break-even equations, byte-identical replay traces and
      witnesses, serialized null/shuffle algorithms, C-pair calibration, and
      synthetic seed/CDF aggregation. Snapshot before fresh independent review.
    - >-
      Keep EXP-SSI-357363, EXP-SSI-8e589d, and all SSI advice-frontier
      experiments unapproved, unfrozen, and unexecuted.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This batch measured nothing and promotes no technique, theorem, attack,
      exponent, security conclusion, or knowledge item.
  claim_ceiling: >-
    The strongest true statement is that EXP-SSI-357363 repairs two direct
    physical-width contradictions and materially expands the design contract,
    but remains execution-unauthorized and underdefined. This is not evidence
    about the SSI problem or any deployed security level.
  decided_by:
    task: TASK-20260809-1654d3
    role: coordinator
    policy: coordinator-orchestration-code
  decided_at: '2026-08-09'
