  rationale:
    - Design the definition/quantifier audit first because an incompatible degree convention invalidates downstream comparisons cheaply.
    - Design the finite top-kernel/survival panel second because it separates two claims with small exact certificates.
    - Design the changing-s ladder third because its terminality certificates and retained controls have higher cost and dependency risk.
    - These are three designed candidates, with zero live execution lanes; subsequent admission requires focus ranking and committed approval.
  evidence_refs: []
  limitations:
    - No experiment, independent evidence review, mathematical finding, or existing hypothesis-status change occurred in this task.
    - Candidate dimension counterexamples remain replication predictions; untracked reviews are not adopted as evidence.
    - Finite panels cannot disprove an unspecified O(1) bound or establish an ECDLP complexity improvement.
    - Native ordinary, quotient-layer, and solving-degree definitions require separate interfaces; solving-degree measurement is excluded from the new protocols.
    - The closure upper-bound argument and native first-fall convention remain explicit proof/applicability gates.
  next_actions:
    - Archive these exact eight owned files with a verified Coordinator snapshot and publish the updated PR.
    - Review the contracts and implementation prerequisites before any execution approval.
    - Admit at most the ranked justified lanes through the focus tool and bounded dispatcher; do not admit all three merely because they are designed.
    - Precommit the required independent review plan before any claim-changing round.
