      text: >-
        A Coordinator ruling governs a check of an uncommitted card, by named
        clause, instead of superseding the card. This was chosen over
        superseding 5ea531, 13dfad and e2830e: e2830e's AUTHORITY constraint
        names 13dfad literally, and three superseding cards would cascade.
        The clauses are narrow, name exact paths, and are bound by check (j)
        of this decision. Every archive receipt records which clause it ran
        under.

