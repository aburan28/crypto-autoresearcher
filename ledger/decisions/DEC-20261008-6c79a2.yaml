    - DEC-20261008-8cb005 (PD-1; ruling_on_33afa9_stops.archive_route)
  decision: revise
  decision_label: 5ea531_check_b_stop_is_PD1_drafting_defect__clause_B_AUTH_excepts_six_named_authority_records__13dfad_scope_unchanged_with_clause_S13__new_ledger_archive_7457ec__5ea531_rerun_in_full__no_status_change
  target_ids:
