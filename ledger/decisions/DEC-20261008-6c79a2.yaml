  rationale:
    - >-
      Every package check that bears on custody, scope inside write_scope,
      state and defects passed. The single STOP is a direct consequence of
      the PD-1 order this Coordinator chose, so it is a card defect to rule
      on, not a finding about the package.
    - >-
      Each clause names exact paths and requires hashes that later archives
      compare. A blanket ledger/ exception would let an unrelated record
      slip past a custody check.
    - >-
      Re-running in full rather than resuming keeps the fail-fast and
      receipt-in-the-same-commit guarantees, and costs minutes.
