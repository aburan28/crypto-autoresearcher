    - step: 4
      who: top-level session
      what: >-
        Run TASK-20261008-7457ec alone. It commits this decision and its own
        card with its receipt. Verify, push and refresh the PR.
    - step: 5
      who: top-level session
      what: >-
        Dispatch TASK-20261008-e2830e per its card and e2830e_dispatch above.
        Claim it before launch and release it on return.
    - step: 6
      who: coordinator
      what: DEC-20261008-8cb005 NA-5, unchanged.
