# =============================================================================
# DEC-20261008-6c79a2 -- Coordinator ruling on the STOP of
# TASK-20261008-5ea531 at check (b): the uncommitted authority records of
# DEC-20261008-8cb005 sit in the working tree outside
# TASK-20261002-8a6b8a's write_scope.
# RULING: a drafting defect of DEC-20261008-8cb005 PD-1. PD-1 requires those
# records to be present and uncommitted while 5ea531 runs, but 5ea531 check
# (b) did not except them. They are not a custody or scope failure of the
# package.
#   - Clause B-AUTH (below) governs 5ea531 check (b) for exactly six named
#     authority records.
#   - Clause S-13 (below) governs TASK-20261008-13dfad's git-status check for
#     exactly the two records of this act.
#   - 13dfad's artifact_paths, staging, commit and completion gate are
#     UNCHANGED. This decision and its card are committed by a separate
#     ledger archive, TASK-20261008-7457ec, which runs right after 13dfad.
#   - 5ea531 is re-run IN FULL from its step (0).
# DEC-20261008-8cb005 and its three cards are not edited. No status changes.
# Zero runs. No shared tool or config file is written.
# =============================================================================
coordinator_decision:
  id: DEC-20261008-6c79a2
  id_provenance: >-
    Minted by the top-level session with tools/allocate_id.py and confirmed
    free with --check, together with TASK-20261008-7457ec and
    TASK-20261008-78cb29, then supplied to this Coordinator. The Coordinator
    has no shell and minted no identifier.
