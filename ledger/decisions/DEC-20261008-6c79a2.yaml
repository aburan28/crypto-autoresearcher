    - H-PFDR-2765d2
    - RQ-PFDR-ae2fba

  context: >-
    The top-level session ran TASK-20261008-5ea531.
    - Check (j) of DEC-20261008-8cb005 passed: 67 rows, 0 MISS.
    - The index was empty, and HEAD 5fbfbf118 already contains origin/main
      3e05e9d15.
    - Checks (a1) to (a5), (c) to (i), and (b) apart from one clause all
      passed as the card requires. That includes (a4) for both EC-A1 paths,
      branch S4-DEF1 with all five clauses, and (g) with exactly the three
      known_defect_lines. Staged size was 230 files, 8,832,608 bytes.
    - Check (b) STOPPED on its clause "Every working-tree change, untracked
      files included, is a path inside TASK-20261002-8a6b8a's write_scope,
      specification.yaml excepted." (SR-01, SR-02).
    Four untracked entries lie outside that scope: DEC-20261008-8cb005 and
    the cards TASK-20261008-5ea531, -13dfad and -e2830e. Nothing was staged
    or committed. The full output is the top-level session's scratch file
    a5ea531/precheck-run1.json.

  ruling:
    classification: >-
      This is a drafting defect in DEC-20261008-8cb005 and the 5ea531 card,
      both written by this Coordinator. PD-1 deliberately runs the snapshot
      before its authority records are ledger-committed, and 5ea531 must hash
      them in place (authority_as_read; SR-03). Their presence is therefore
      required, not a scope breach. They are ledger records, not package
      artifacts. They are never staged by 5ea531; TASK-20261008-13dfad and
      TASK-20261008-7457ec commit them. The top-level session was right to
      stop.
    clause_B_AUTH:
      governs: TASK-20261008-5ea531 pre-staging check (b), the working-tree scope clause quoted in context (SR-01, SR-02)
      text: >-
        Clause B-AUTH (DEC-20261008-6c79a2). The working-tree scope clause of
        5ea531 check (b) does not apply to EXACTLY these six paths, and only
        while all of the following hold for each of them:
        - it is present;
        - it is untracked;
        - it is not staged;
        - its sha256 is recorded under authority_as_read.
        The six paths are:
          ledger/decisions/DEC-20261008-8cb005.yaml
          ledger/decisions/DEC-20261008-6c79a2.yaml
          ledger/handoffs/TASK-20261008-5ea531.yaml
          ledger/handoffs/TASK-20261008-13dfad.yaml
          ledger/handoffs/TASK-20261008-e2830e.yaml
          ledger/handoffs/TASK-20261008-7457ec.yaml
        The receipt lists them under authority_records_uncommitted, each with
        its sha256. None of them is staged or committed by 5ea531. Each of the
        following remains a scope_finding and a STOP:
        - any other working-tree entry outside TASK-20261002-8a6b8a's
          write_scope, including any other path under ledger/;
        - any of the six that is absent, tracked or staged;
        - any working-tree entry inside write_scope that lies under no
          artifact_path.
        Every other clause of check (b), and every other check, is
        unchanged.
    clause_AUTHORITY_AS_READ:
      governs: TASK-20261008-5ea531 constraint AUTHORITY AS READ (SR-03)
      text: >-
        authority_as_read records the sha256 of all six B-AUTH paths, not
        only DEC-20261008-8cb005 and the 5ea531 card. TASK-20261008-13dfad
        and TASK-20261008-7457ec each require the committed bytes of the
        records they stage to equal these values.
    clause_S_13:
      governs: TASK-20261008-13dfad constraint "git status --porcelain --untracked-files=all must show exactly the four record paths this task stages, besides its receipt" (SR-04)
      text: >-
        Clause S-13 (DEC-20261008-6c79a2). Besides the four record paths and
        the receipt, git status may show EXACTLY two more untracked entries:
        ledger/decisions/DEC-20261008-6c79a2.yaml and
        ledger/handoffs/TASK-20261008-7457ec.yaml. Each must have a sha256
        equal to its value in the 5ea531 receipt's authority_as_read. Both
        are recorded in the 13dfad receipt under
        authority_records_uncommitted and are NOT staged by 13dfad. Anything
        else remains a STOP.
        13dfad's custody step (b) also compares
        ledger/handoffs/TASK-20261008-13dfad.yaml and
        ledger/handoffs/TASK-20261008-e2830e.yaml with authority_as_read;
        this is stricter, and a mismatch is a STOP. 13dfad's artifact_paths
        (five, SR-06), staging list, commit message, record_ids and
        completion gate are unchanged.
        13dfad's ORDER (1) said that if 5ea531 stopped, 13dfad does not run
        and the Coordinator rules first (SR-05). This decision is that
        ruling. 13dfad runs only after the re-run of 5ea531 completes and its
        receipt verifies.
    rerun_of_5ea531: >-
      5ea531 is re-run IN FULL from its step (0), under its card plus B-AUTH
      and clause_AUTHORITY_AS_READ:
      - check (j) of DEC-20261008-8cb005 (67 rows), plus check (j) of this
        decision (12 rows);
      - the empty-index check;
      - the merge;
      - checks (a) to (i) recomputed fresh;
      - stage, commit, verify, push.
      The stopped first attempt is recorded in the receipt under
      prior_attempts, with its scratch output path, the STOP clause, and
      "nothing staged or committed". Its results are not reused as results.
      The commit message also names DEC-20261008-6c79a2. 5ea531's archive
      record_ids are unchanged; naming an extra id in the message is
      additive.
    e2830e_dispatch: >-
      TASK-20261008-e2830e is dispatched only after BOTH the 13dfad receipt
      (as its card requires) AND the TASK-20261008-7457ec receipt have
      verified and the branch is pushed. Then every record its run depends
      on is committed. This adds to its preconditions and relaxes none. Its
      launch prompt still states that the 13dfad receipt has verified, which
      its AUTHORITY constraint requires (SR-07), and states nothing about
      this decision's reasoning.
    13dfad_scope_answer: >-
      13dfad does not commit this decision. Its scope and completion gate do
      not change; only its git-status check gains clause S-13. This decision
      and its card are committed by TASK-20261008-7457ec, a ledger archive
      that runs alone immediately after 13dfad.

  order_of_operations:
    - step: 1
      who: top-level session
      what: >-
        Run check (j) of THIS decision's reference_table (SR-01 to SR-12),
        read-only, writing only to scratch. Any MISS: stop, and the rows
        return to this Coordinator.
    - step: 2
      who: top-level session
      what: >-
        Re-run TASK-20261008-5ea531 IN FULL from step (0), under B-AUTH and
        clause_AUTHORITY_AS_READ. Its step (0) runs (j) of
        DEC-20261008-8cb005; check (j) of this decision is also recorded in
        the receipt. Then commit the package with the receipt, verify, push
        and refresh the PR.
    - step: 3
      who: top-level session
      what: >-
        Run TASK-20261008-13dfad alone under clause S-13. It commits
        DEC-20261008-8cb005 and the three cards with its receipt. Verify,
