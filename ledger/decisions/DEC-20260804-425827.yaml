  context: >-
    BATCH-091: All filtered/alternative complex approaches reduce to H-PSEUDO.
    The Betti-Yield Duality is proved: any sub-rho complex requires structured
    additive density (= H-PSEUDO).

  decision: advance_ec_additive_energy
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    **BETTI-YIELD DUALITY** (proved in BATCH-091):
    For any subset S used as 1-skeleton of the decomposition complex:
    EITHER β_1 ≥ Ω(sqrt(N)) (not sub-rho)
    OR the average yield ⟨r_2^S(R)⟩ → 0 (useless for most targets).
    Escaping BOTH requires |S| = o(sqrt(N)) AND yield exceeding the random baseline —
    exactly H-PSEUDO.

    This is a THEORETICALLY IMPORTANT result: H-PSEUDO is the exact condition needed
    for ANY combinatorial approach to prime-field ECDLP to achieve sub-rho complexity.
    The question "does a sub-rho algorithm exist?" reduces precisely to H-PSEUDO.

    NEW DIRECTION identified: EC additive energy.
    High additive energy E(S,S) = |{(a,b,c,d)∈S^4: a+b=c+d}| gives structured
    density for S. If S is the small-x factor base with B_frac=0.05:
    E(S,S) counts pairs of factor-base decompositions that share the same sum.
    If E(S,S) >> B^3/N (exceeds the random baseline B^4/N), then S has structured
    density — a MEASUREABLE indicator for H-PSEUDO.

    This is a new, concrete, computable quantity that can be measured experimentally.

    GOAL-ECDLP-001 stays active.

  betti_yield_duality:
    statement: >-
      For any S ⊆ E(F_p) used as factor-base 1-skeleton: if β_1(C_R^S) = o(N^{1/2})
      then ⟨r_2^S⟩ = o(1). Equivalently: sub-rho critical complex requires yield
      above the random baseline. Proved via Betti-Yield duality theorem.
    significance: >-
      H-PSEUDO is the exact algebraic condition for sub-rho combinatorial ECDLP.
      The gap between "avoids DL circularity" and "achieves sub-rho" IS H-PSEUDO.

  exact_next_action: >-
    BATCH-092: Measure EC additive energy E(F,F) for the small-x factor base F at p=1009..4001.
    Compare to random set baseline B^4/N. If E(F,F)/baseline is > 1 and GROWING: structured
    density detected, H-PSEUDO is "more likely." If ratio → 1: factor base behaves like random
    set, consistent with H-PSEUDO but inconclusive. This is a NEW empirical measurement
    complementary to the Fourier constant C.

