  knowledge_promotion:
    promoted:
      - KN-FIND-bdcd60
      - KN-OPEN-62c870
    basis: >-
      support on evidence of strength replicated with proof_status derivation:
      the CU-9 derivations, re-derived blind (TASK-20261017-ccd10c) and
      independently (TASK-20261017-8aff64), agreeing with the original reviewer
      derivation (TASK-20260930-40470a), each corroborated by sampling at toy
      primes. RA-C5 is met: RA-1, RA-2 and RA-3 compose C and RB agrees on Q1 to
      Q3. agents/coordinator.md responsibility 11; templates/research-records.md
      knowledge_promotion.
    entries:
      KN-FIND-bdcd60:
        path: knowledge/findings/KN-FIND-bdcd60.md
        written_by: TASK-20261022-a2f575 (this act)
        statement_frozen: >-
          For every prime p > 3, every nonsingular E: y^2 = f(x) = x^3 + ax + b
          over F_p (any j-invariant, ordinary or supersingular) and every m >= 3,
          let F(T) = S_m(x_1, ..., x_{m-1}, T) with x_1..x_{m-1} independent
          indeterminates and K an algebraic closure of F_p. (1) Ordered base. F
          has degree 2^{m-2} in T and is squarefree; its Galois group over
          K(x_1..x_{m-1}), as a permutation group on the roots, is elementary
          abelian (Z/2)^{m-2} acting regularly (V_4 at m = 4), and the arithmetic
          group over F_p(x_1..x_{m-1}) equals it. (2) Symmetric base. Over
          K(e_1..e_{m-1}) the group is, for m >= 4, (Z/2)^{m-2} semidirect
          S_{m-1}, the image of Z/2 wr S_{m-1} with kernel {+1, -1}, of order
          2^{m-2}(m-1)!: S_4 = AGL(2,2) at m = 4 and orders 192, 1920 and 23040
          at m = 5, 6, 7; it is primitive iff m - 1 is odd (primitive at m = 4
          and 6; at m = 5 and 7 exactly one nontrivial block system, two blocks
          of size 2^{m-3}); at m = 3 it is S_2 of order 2. The arithmetic group
          equals the geometric one. (3) Frobenius rule. For x_1..x_{m-1} in F_p,
          not required to be x-coordinates of F_p-points, with every f(x_i) != 0
          and F squarefree of full degree, Frobenius acts on the roots as
          translation by the class of (chi(f(x_1)), ..., chi(f(x_{m-1}))) modulo
          +-(1, ..., 1): the cycle type is 1^{2^{m-2}} iff all chi(f(x_i)) are
          equal, and 2^{2^{m-3}} otherwise. (4) None of (1) to (3) depends on
          (a, b): no curve has a different generic monodromy on either base.
        scope_frozen: >-
          Derivation tier (docs/claims-and-verification.md level 2, never
          "proved"); generic monodromy only, nothing about specializations to
          proper closed subvarieties. The "every m" extent rests on the
          derivations; group orders at m = 6, 7 rest on the derivation plus a
          curve-free permutation-group computation. Measured corroboration
          covers m in {3, 4, 5} only, at p in {53, 59, 101, 103, 997, 1009, 1013,
          1019, 10007, 10009}, on the curves the two reports tabulate; nothing
          at m >= 6 is measured. Toy tier; CS-R7 binds.
      KN-OPEN-62c870:
        path: knowledge/open-problems/KN-OPEN-62c870.md
        written_by: TASK-20261022-a2f575 (this act)
        content_rule: >-
          Supersedes KN-OPEN-8a7432. Q1 carried verbatim with one added design
          constraint (PF-1). Q2: the generic-monodromy half is answered by
          KN-FIND-bdcd60; what stays open is stated. Q3 and "Why it matters"
          carried verbatim. CS-K1d2, CS-R7, and DEC-20261017-435b01 CS-D2 and
          CS-N1 carried verbatim.
    supersessions:
      - old: KN-OPEN-8a7432
        new: KN-OPEN-62c870
        edit: frontmatter superseded_by only (one line; CC-6)
    not_superseded:
      - KN-FIND-4f0d84 stands unchanged. KN-FIND-bdcd60 is consistent with it (the Frobenius rule with every chi(f(x_i)) = +1 is its complete splitting on nondegenerate factor-base fibres) and does not restate its degenerate-fibre content.
    honest_accounting:
      object: The generic monodromy of the Semaev summation cover T -> S_m(x_1..x_{m-1}, T) over prime fields, on the ordered and the symmetric base.
      depth_of_verified_structure: >-
        Derivation tier, re-derived twice in one rule-12 round (once blind),
        corroborated at toy primes with exact finite-p expectations at m <= 5.
      dominated_by: >-
        Not checked against the literature in this decision. The ordered-base
        irreducibility of S_m is published (arXiv:1403.0126 Theorem 1, as the
        H-MONO-93bc4d status note records it; pointer only, not read here).
        Whether the group determinations are themselves published was not
        checked. The finding is recorded as an internal re-derivation, not a
        new theorem.
      sota_delta: No attack; a structural/measurement contribution only. No exponent moves in either direction.
      open_directions: KN-OPEN-62c870 Q1 (factor-base statistics) and Q3 (extension fields, IDEA-20260803-ff7415).

