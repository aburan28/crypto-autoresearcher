    instruments:
      proves_too_much: >-
        Passes on all three objects (8aff64 section 6). PT-1: the argument stops
        at the Kummer step (y_i in the base); on 46,529 all-rational
        nondegenerate fibres only 1^4 occurs. PT-2: the independence step fails
