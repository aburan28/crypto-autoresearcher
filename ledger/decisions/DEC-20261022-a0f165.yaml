          exceptional-locus branch of the objective's dichotomy is false on both
          bases; "full symmetric" holds literally only at m = 4 on the
          symmetric base; the dichotomy as posed is not exhaustive; criterion
          (a) unmet as committed texts stand; criterion (b) cannot be met; the
          cleanest home is RA-C5.
