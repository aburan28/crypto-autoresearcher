        including all 24 with chi(f(x_1)) = -1. PT-3: S_3 becomes A_3 and the
        image A_4; 3,998 square-discriminant fibres show no 2+1+1 and no
        4-cycle (chi-square 1.56 on df 2 against A_4). K4a has nothing to compose.
