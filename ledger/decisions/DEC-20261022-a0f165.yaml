          KN-OPEN-8a7432 Q2 is answered by derivation for p > 3 and every
          nonsingular E/F_p (KN-FIND-bdcd60). "No exceptional locus" is read as
          "no curve whose GENERIC monodromy differs"; nothing is asserted about
