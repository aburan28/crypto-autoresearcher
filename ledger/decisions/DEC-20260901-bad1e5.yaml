  outcome: >-
    OUTCOME (a) ABSENCE-PERSISTS on BOTH axes, at matched decisive
    exposure, with zero validator discrepancies:

    (i) Round count: substitute hits 2, 1, 0, 1 at r = 4, 8, 16, 32
    against the frozen comparator's 14 -- every arm OUTCOME-A' (all
    Garwood CIs contain 1; exact conditional-binomial p = 0.00418,
    0.000977, 0.000122, 0.000977). The statistic moved within absence
    (non-monotonic, max R=2.0 at r=4), never toward reappearance. The
    r=16 point is literally RC-D re-measured (byte-parity passed).

    (ii) Key/seed: verbatim RC-D oracle at second seed 531002 read 0 hits
    against a freshly recomputed AES arm reading 19 (exact p = 3.81e-06;
    rate-ratio CI lower bound 4.667). The absence is not key-specific.

    Composed with EV-AES-dec938, EV-AES-4ba350, EV-AES-e4c091 and
    EV-AES-048545: four substitute measurements (two classes, plus the
    affine reproduction) now exclude the r=5 excess, and within the RC-D
    family the exclusion is robust across round count 4-32 and across two
    keys. The mechanism question -- WHERE the excess lives, given it
    survives none of these substitutions but does survive them all at
    r=5 with AES's actual round content -- remains open and is narrowed,
    not resolved.

  rationale:
    - >-
      Both preregistered decision rules returned OUTCOME (a); the
      validator independently reproduced every number from raw data; the
      close is the mechanical recording of committed results, not a new
      judgement.
    - >-
      Strength is recorded moderate (not strong) per the campaign
      precedent and EV-AES-5478a0's strength_basis: one substitute
      family, two seeds, four round counts, one geometry, one machine.
      The class-level claim is explicitly scoped to the keyed
      murmur3-fmix64 balanced Feistel family.
    - >-
      The 951e22 snapshot-commit deviation (one extra coordination path,
      truthfully declared, dispatcher-verified after declaration) is
      carried in EV-AES-5478a0's procedure_deviations and the batch
      queue's batch_notes; it affected no producer artifact and no
      binding.

  next_action: >-
    SCHEDULE BATCH-713991'S OUTSTANDING INTEGRITY DEBT AS RANK 1. Per
    DEC-20260804-73977c D-7/D-8 and the prior next_action's RANK 2: the
    RANK-1 stamp-gap supersession and a verified ledger-archive commit
    for TASK-20260804-0e75d5, which BATCH-713991's goal-file checkpoint
    still shows as ledger_archive commit null. This is ledger/queue
    repair on historical records, needs its own scoped task with a write
    scope disjoint from any concurrent batch, and writes
    ledger/goals/GOAL-AES-003.yaml (so it must own that file in its own
    queue, as this batch's ledger card did). RANK 2 after that: any new
    mechanism lever on where the r=5 excess lives requires a fresh
    idea-generation round with falsifiable proposals (inventor
    protocol), not ad-hoc improvisation -- the four substitute
    exclusions plus the affine-geometry reproduction have narrowed but
    not resolved the mechanism question. RANK 3: a decay-specific
    design (much larger exposure on low-r variants) if the program ever
    needs to distinguish flat absence from slow decay within the RC-D
    family (EV-AES-5478a0 unresolved confound 2). Full rationale:
    DEC-20260805-af8565 (predecessor) and EV-AES-5478a0.

