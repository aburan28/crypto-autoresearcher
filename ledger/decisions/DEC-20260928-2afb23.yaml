  plan_amendment:
    id: PA-8456b6-T1
    kind: additive
    applies_to: >-
      Every artifact written in BATCH-8456b6, wherever "retypes no held text",
      "retype no held amendment text" or "keep what held" is carried into this
      batch by citation. No other batch, round or record.
    reading: >-
      Verbatim, span-hashed transclusion of held text does NOT count as
      retyping held text when every condition T1 to T5 holds. Any other
      reproduction of held text (paraphrase, reordering, reformatting inside a
      span, partial or edited copy) does count as retyping.
    conditions:
      - id: T1
        text: >-
          Byte-exact copy of one contiguous span of a committed record. No
          paraphrase, reordering, reformatting, elision or insertion inside the
          span.
      - id: T2
        text: >-
          Each span carries its source path, the commit at which it was read,
          a span anchor (line or byte range, or a named field path) and the
          sha256 of the span's bytes, so any reader can recompute the hash from
          the source blob.
      - id: T3
        text: >-
          Transcluded spans are marked as transcluded and kept visibly
          separate from fresh text. Fresh text is labelled fresh and is never
          presented as held.
      - id: T4
        text: >-
          Transclusion copies into this batch's design artifacts only. It
          neither edits nor supersedes the source record, which stays in force
          for its own experiment exactly as held.
      - id: T5
        text: >-
          A span whose recomputed hash does not match, or whose anchor does not
          resolve, is treated as retyped text, not held text.
    does_not_decide:
      - Whether RS-B transcludes, restates freshly, or both. That stays the producer's recorded choice under TASK-20260928-fa9275's constraints.
      - >-
        That a transcluded span is correct, or already reviewed in its new
        context. Held status in a source round does not carry into a new
        composition; review of any draft is set by a review plan frozen in a
        later act.
      - Anything about RS-B's content, a successor EXP id, or the binding to H-AUXIN-6db354.
    producer_eligibility_effect: >-
      None beyond the reading above. The producer eligibility recorded in
      BATCH-8456b6 batch.yaml and the queue note producer_eligibility is
      unchanged.
    held_text_check: >-
