coordinator_decision:
  id: DEC-20261016-264eed
  recorded_at: '2026-10-16'
  decided_at: '2026-10-16'
  decided_by: coordinator
  recorded_by_task: TASK-20261016-714367
  archived_by: TASK-20261016-714367
  goal_id: GOAL-SCURVE-be9707
  decision: revise
  decision_label: revise_EXP-SCURVE-bf0f93_later_stages_after_nist_seed_provenance
  target_ids:
    - GOAL-SCURVE-be9707
    - RQ-SCURVE-03aa7e
    - IDEA-20260829-0656b1
    - H-SCURVE-ae7264
    - EXP-SCURVE-bf0f93
  context: >-
    Goal-scoped Coordinator pass on the SafeCurves goals, at the user's
    request in this session to bring the ledger up to date now that the NIST
    curve seeds have an explanation. No scientific trial was run. IDEA-20260829-0656b1
    ("price the adjective") wanted to measure the acceptance rate rho of the
    NIST P-256 seed-to-curve pipeline at 24-44 bits and extrapolate it to 256 bits
    under heuristic H1, in order to price SafeCurves' "manipulatable" label as
    W = 2^k / rho evaluations over a 2^160 seed space. DEC-20260913-6b1b16 approved
    only Stage 0 of EXP-SCURVE-bf0f93, a closed-form check of four identity names.
    Stage 0 has no runs. Stages 1 and later were never authorized.
    Two primary sources dated 2026-10-16 are now on record (KN-LIT-d2f917),
    together with an internal reproduction bundle
    (research/nist_seed_provenance_20261016/). The bundle contains a full-size
    census of the actual 1997 X9.62 pipeline in the six recovered srand48 runs.
  official_transitions:
    hypothesis_status_changed: false
    hypothesis_id: H-SCURVE-ae7264
    hypothesis_status: specified
    experiment_status_changed: false
    experiment_id: EXP-SCURVE-bf0f93
    experiment_status: approved
    execution_authorized_stages_unchanged: [0]
    stage1_authorized: false
    goal_status_changed: false
    goal_next_action_changed: false
  ruling:
    - >-
      The premise of the later stages of IDEA-20260829-0656b1 no longer
      describes the NIST curves, so those stages must be revised before anyone
      designs them. A revised design must start from the recorded full-size
      census in research/nist_seed_provenance_20261016/census/summary.json
      (21,753 blocks; b exists for 11,042; 47 twist-only-prime; 17 rejected
      because bitlen(n) > bitlen(p); 21 accepted, of which 10 were published and
      11 skipped). For these curves, a reduced-size extrapolation under H1 is no
      longer the best available evidence.
    - >-
      For the historical NIST prime curves, the reachable set is now bounded by
      the generator, not by the 2^160 seed space. Valsorda reports about 30 bits
      of freedom per curve: any 1997-98 timestamp (about 2^25.9) times any of the
      first 16 accepted candidates. This bound is reported in KN-LIT-d2f917 and
      its arithmetic is reproduced in the bundle README. It replaces the
      "2^30 seeds or 2^30 * 177 / C point counts over 2^160 seeds" framing for
      these curves. It holds only under the assumptions stated there.
    - >-
      Claim A2 of the idea ("both square roots are admissible, so the
      generator gets a free bit back, cancelling A1") does not describe the
      historical generator. On all nine published p = 3 (mod 4) curves, b is the
      (p+1)/4 root. The 1997 code therefore never tried -b. In the p = 3 (mod 4)
      runs, 31 candidates whose quadratic twist (reachable by -b) has prime order
      were never taken (bundle README, "Derived observations"). A2 may still
      describe SP 800-186 C.3.1 as written. Any revised design must keep the
      standard-as-written and the historical generator as separate objects.
    - >-
      The Stage 0 approval stays as recorded: a closed-form name-count
      calibrator that none of these facts touch. It should not be dispatched
      until a revised Stage 1 exists, because Stage 0 only gates Stage 1, and a
      Stage 1 built on the superseded premise could not be ranked ahead of doing
      nothing. This is a scheduling statement and says nothing about the
      hypothesis. An approved, unrun contract is neither evidence nor a failure.
  rationale:
    - >-
      Research-direction integrity: this revises a design premise; it does not
      close the direction. What remains open: the acceptance rate of the SP
      800-186 pipeline as written, outside the six historical runs; and A1/A2 for
      the standard as written. Both are generic procedure questions and no longer
      NIST-provenance questions. Revisit condition: a ranked proposal that names
      one of them and starts from the census as its baseline.
    - >-
      The census is the better measurement for the NIST question. It is
      full size, it is the actual pipeline (with the historical b-root choice and
      the bitlen(n) <= bitlen(p) rule), and it reproduces the published accept
      list 21 of 21. The idea's own interpretation_limits already rank this
      ordering: counting actual rejections is "strictly better evidence than
      this record's sampling wherever it is available", and its sampling
      method is "the second-best one used where the first-best is impossible".
      For the NIST runs the first-best method is now available.
  evidence_refs:
    - KN-LIT-d2f917
    - research/nist_seed_provenance_20261016/README.md
    - research/nist_seed_provenance_20261016/census/summary.json
    - research/nist_seed_provenance_20261016/SOURCE.md
    - ledger/proposals/IDEA-20260829-0656b1.yaml
    - ledger/decisions/DEC-20260913-6b1b16.yaml
    - experiments/EXP-SCURVE-bf0f93/specification.yaml
  citations:
    - ref: KN-LIT-d2f917
      provenance: retrieved
      claim: >-
        Every X9.62 / FIPS 186-2 prime-curve seed is one 20-byte drand48 block
        after srand48(t) with t a 1997-98 UNIX time. Valsorda bounds the freedom
        at about 30 bits per curve.
      verified_by: >-
        Top-level Claude Code session session_01TPFiTk4kt2VfEauB3PKCbN, which
        read the Anthropic post in full and the Valsorda post in part (the rest
        retrieved in full by its research subagent) on 2026-10-16 and relayed them to
        this Coordinator subagent. This subagent did not open the sources itself.
    - ref: research/nist_seed_provenance_20261016/census/summary.json
      provenance: internal
      claim: >-
        The per-run accepted, twist-only-prime and n-longer-than-p indices. Their
        totals (11,042 candidates; 21 accepted; 47; 17) agree with the README
        table. This Coordinator checked those totals by reading the file. It did
        not recompute any point count.
      verified_by: Coordinator subagent, DEC-20261016-264eed, Read tool, 2026-10-16
  limitations:
    - >-
      The census is an internal measurement that has not yet been independently
      validated. Its native Rust receipt and enumerator live in aburan28/crypto
      and are not copied into this repository (SOURCE.md). The producer reports
      a byte-identical re-run of the P-256 run. This Coordinator verified only
      that the summary agrees with the report's table.
    - >-
      Each run's census stops at its last published seed, so any rate read from
      it is a stopped-sample estimate. This decision quotes counts and
      interprets no rate.
    - >-
      Scope: the six recovered srand48 runs and the ten prime curves they
      produced. Nothing here is an ECDLP statement, and no attack cost on any
      curve changes. The about-30-bit bound is reported, and it assumes the
      published provenance is the actual generation process.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is not an evidence-review decision, and no EV record exists for the
      internal reproduction. The external claim is recorded as KN-LIT-d2f917.
      A KN-FIND needs an evidence record of strength replicated or strong,
      according to knowledge/README.md and /curate-knowledge, so promotion waits
      for the independent validation named in DEC-20261016-fb3a6f.
  next_actions:
    - >-
      None on this experiment now. Do not dispatch Stage 0 of
      EXP-SCURVE-bf0f93 and do not design Stage 1 on the original premise. The
      goal's recorded next_action is unchanged.
