  rationale:
    - >-
      THE ECC QUEUE MUST MEAN WHAT IT SAYS. Rule 11 makes open ECC ideas ranked
      work, which is right only if an open ECC idea is an ECDLP idea. Sixteen of
      nineteen are not. Leaving them listed makes every Coordinator pass either
      do make-work or spend a ranking slot re-deciding this.
    - >-
      THE DISPOSITION RESTS ON SCOPE, NOT ON FALSITY. The records say that they
      are not ECDLP work. Taking them at their word needs no experiment and
      closes nothing that any of them claims.
    - >-
      APPROVALS ARE NOT REWRITTEN. Withholding dispatch is a ranking act within
      Coordinator authority. Revoking 47 approvals would require editing or
      superseding 47 contracts for no information gain. The approvals stay as
      historical records, and what changes is only whether anyone spends a
      session on them.
    - >-
      EXPLICIT IDs ONLY, AND A REVISIT CONDITION, so that this cannot become a
      filter that hides a real precomputation-table or scalar-recoding idea
      that someday names a curve and a cost.

