  id: DEC-20261005-138b51
  id_provenance: >-
    Pre-minted and collision-checked by the dispatching session
    (tools/allocate_id.py --next / --check), relayed to this Coordinator
    session, which has no shell. Re-checked on the merged tree by
    TASK-20261005-8d4da1 (stopping gate).
  recorded_at: '2026-10-05'
  decided_at: '2026-10-05'
  decided_by: coordinator
  archived_by: TASK-20261005-8d4da1
  goal_id: GOAL-ECDLP-001
  question_ids:
    - RQ-ECDLP-002
  base_checked: >-
    Reported by the dispatching session, not observed here: branch
    claude/coordinate-portfolio-20261005 equals origin/main at ad0722d7b5,
    fetched and merged 2026-10-05. This session ran no git command.
  standing_authorization: >-
    Not relied on for any approval: this decision approves nothing. It records
    that the standing user authorization of 2026-09-06 (AGENTS.md "Standing
    user authorization for ideas and experiments") removes the need for user
    confirmation of each idea and experiment, and does not remove ranking,
    question scope or protocol readiness, which "still apply" in its own text.

  decision: pause
  decision_label: >-
    DISPOSE AND WITHHOLD. (1) The sixteen open RQ-ECDLP-002 ideas listed in
    idea_dispositions are DECLINED as out of question. They are not designed,
    not carded and not ranked as ECC work. (2) The forty-seven approved, unrun
    contracts listed in withheld_contracts, and the executor cards that serve
    them, are WITHHELD FROM DISPATCH: no /run, no executor launch, no snapshot
    archive of theirs is ranked ahead of doing nothing. Their approvals are
    historical records and are not rewritten. (3) An auditable finding F-1 is
    recorded. (4) A tooling change is specified (T-1) so the open-idea ranking
    reads this disposition instead of silently re-listing the sixteen. "pause"
    is used in its lane sense only. It closes no research lane and rests on no
    "no route remains" argument, so the closure gate's obstruction block does
    not apply (agents/coordinator.md "Closure gate"); see closure_gate_note.

  context: >-
    tools/ecc_priority.py --open-ideas (run by the dispatching session at
    ad0722d7b5; output read here from its scratch file) lists 19 open ECC ideas.
    Three are the SSI EndRing-PKE audits IDEA-20261004-e4c461, -edbd24 and
    -a09dd4 (RQ-SSI-1946c9). The other sixteen are filed against RQ-ECDLP-002
    and each states one elementary count about an integer of the form 2^k - 1
    ("bit length k, k-1 doublings, k-1 additions") or about two power-of-two
    window-table sizes. The same template recurs across the ledger. Pattern
    searches of this working tree (title regexes "has bit length N, N
    doublings" and "window table stores N entries") find 64 proposals under
    ledger/proposals/ (the 16 open ones and 48 already designed), 47 experiment
    specifications, all `status: approved` and frozen, with no run manifest
    under any of their runs/ directories, and 50 approval decisions dated
    2026-10-03 and 2026-10-04 that share the phrase "Approval authorises the
    integer checks. It does not add a curve point." The dispatching session
    reports that the stream was filed by an automated Cursor Agent session on
    2026-10-04/05; the records themselves show merged PRs #1808 ("experiment:
    EXP-ECDLP-9233d4 digit counts of 33554431"), #1813 and #1822
    (docs/reports/2026-10-04.md, Appendix A). This Coordinator read in full:
    IDEA-20261005-bb4d3d, the first 45 lines of IDEA-20261005-a8d8eb,
    EXP-ECDLP-9233d4 specification.yaml, TASK-20261004-392144,
    DEC-20261004-7e7a95, DEC-20261004-473789, RQ-ECDLP-002, the
    TASK-20261004-181651 snapshot receipt, and tools/ecc_priority.py
    open_ecc_ideas(). It read the other fifteen open ideas by title only, from
    the open-ideas output.

  # ---------------------------------------------------------------------------
  # Evidence for the disposition (the ideas' and contracts' OWN text)
  # ---------------------------------------------------------------------------
  scope_evidence:
    question_admission_rule: >-
      RQ-ECDLP-002 decision_target: "Admit only a mechanism or methodology
      whose operation-level novelty survives the full ledger/idea/literature
      screen and whose cheapest decisive test can change a scoped ECDLP
      decision."
    self_declarations_read:
      - "IDEA-20261005-bb4d3d claim: 'The gap is a digit count, not an ECDLP exponent.' mechanism: 'No curve point is added.' target_complexity.time_exponent: 'No exponent claimed.' interpretation_limits: 'No transfer to a cryptographic scalar.' sota_delta.time: 'zero attack delta'."
      - "IDEA-20261005-a8d8eb claim: 'The gap is a table size, not an ECDLP exponent.' mechanism: 'No curve point is added.'"
      - "EXP-ECDLP-9233d4 out_of_scope: 'Any addition of a curve point or scalar recovery.' 'Any claim that a digit-count gap moves an exponent.' 'Any comparison with rho at cryptographic size.' scale_relevance: 'One written integer. No transfer to a scalar multiplication.' heuristic_under_test: null."
      - "DEC-20261004-7e7a95 and DEC-20261004-473789 limitations: 'Approval authorises the integer checks. It does not add a curve point.'"
    reading: >-
      By their own statements these records name no elliptic-curve group
      object, no ECDLP cost quantity and no transfer to one. Their cheapest
      decisive test therefore cannot change a scoped ECDLP decision, which is
      the one admission condition RQ-ECDLP-002 sets. They are filed under an
      ECC question, so rule 11 instruction 3 ranks them as ECC work, but they
      are not work that question admits.

