  # ---------------------------------------------------------------------------
  # (3) Auditable finding (AGENTS.md "Research-direction integrity")
  # ---------------------------------------------------------------------------
  auditable_findings:
    - id: F-1
      finding: >-
        A stream of ~50 approval decisions over three days admitted, under the
        ECC-first rule and the standing authorization, contracts that by their
        own out_of_scope text cannot change any ECDLP decision, against
        RQ-ECDLP-002's admission rule. Each tick of the stream mints an idea,
        designs it and approves it, so the open-ECC-idea worklist that rule 11
        tells every Coordinator to work never empties. The effect is to occupy
        ECC selection points, PR capacity and archive commits with records that
        carry no ECDLP information. This is the make-work AGENTS.md names
        ("an unlimited budget is the single strongest invitation to make-work
        this program has; it is still forbidden"). It is recorded as an effect.
        No intent is inferred and no session is named beyond what the
        dispatching session reported.
      supporting_defects:
        - >-
          Executor cards of the stream carry a null budget field
          (TASK-20261004-392144 budget.wall_clock_seconds: null), which a
          Coordinator must reject on its own handoff.
        - >-
          The stream's idea citations record "verified_by: coordinator session
          2026-10-05" for RQ-ECDLP-002 and frontier rows. That labels the
          authoring session; it is not a Coordinator decision of record, and
          this decision does not treat it as one.
      remedy: >-
        This decision (dispose and withhold), T-1 (tooling), and one bus
        pointer to role coordinator at archive time (next_actions). Stopping an
        automated loop at its source is an operator act; it is reported to the
        user and is not ordered by any record here.

  # ---------------------------------------------------------------------------
  # (4) Tooling change T-1 (specification; the card is owed, see next_actions)
  # ---------------------------------------------------------------------------
  tooling_change_T1:
    what: >-
      tools/ecc_priority.py open_ecc_ideas() reads committed Coordinator
      decisions that carry an `idea_dispositions` block, and excludes their
      `applies_to_exactly` IDs from the open list. It lists them instead in a
      separate, always-printed "disposed by decision" section, giving the
      idea id, the decision id and the disposition, so that nothing becomes
      invisible.
    guards:
      - Membership only by explicit ID in applies_to_exactly. Never by title, regex or area.
      - The block is honoured only if rule_9_fields carries non-empty evidence, budget, test_boundary, remaining_uncertainty and successor_or_revisit. Otherwise the tool warns and keeps the ideas open.
      - A later decision whose idea_dispositions names the same ID with disposition `reopened` restores it.
      - A unit test pins the three behaviours and asserts that the three SSI ideas stay open on the current corpus (a floor, never an exact corpus count).
    census: >-
      The same task writes a report-only census of the stream (proposal IDs,
      contract IDs, approval decision IDs and executor card IDs) by reading
      each record's own claim and out_of_scope text, and lists any withheld
      contract it cannot confirm. Report only; it edits no record.
    why_not_without_it: >-
      Without T-1 every future selection point re-lists the sixteen as open ECC
      work, and an automated designer will design them, which re-creates the
      defect this decision disposes of.

  closure_gate_note: >-
    No lane is closed. No mathematical route is declared dead, and no
    hypothesis status moves, so no obstruction block or refutation artifact is
    needed or claimed (docs/claims-and-verification.md, "Refutation
    artifacts"). The statements are not refuted; they are out of question.

