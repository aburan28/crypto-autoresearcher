      - {id: IDEA-20261004-f3a30e, title: "The integer 262143 has bit length 18, 17 doublings, and 17 additions"}
      - {id: IDEA-20261004-f46864, title: "The integer 8388607 has bit length 23, 22 doublings, and 22 additions"}
      - {id: IDEA-20261005-a8d8eb, title: "A width-33 window table stores 4294967296 entries and a width-32 table stores 2147483648"}
      - {id: IDEA-20261005-bb4d3d, title: "The integer 536870911 has bit length 29, 28 doublings, and 28 additions"}
    not_covered: >-
      Membership is by this explicit ID list ONLY. A title or template match
      does not dispose of any other record. IDEA-20261004-e4c461, -edbd24 and
      -a09dd4 (SSI) are untouched and remain open ECC ideas.
    rule_9_fields:
      evidence: >-
        scope_evidence above: RQ-ECDLP-002's admission rule, and the ideas' own
        statements that no curve point is added, no exponent is claimed and
        nothing transfers to a cryptographic scalar (read in full for
        IDEA-20261005-bb4d3d and IDEA-20261005-a8d8eb; read by title for the
        rest, whose titles state the same integer or table-size count).
      budget: >-
        Zero compute spent and none withheld on budget grounds. The disposition
        is not a budget act and does not rely on any estimate (CLAUDE.md
        "Research budgets: progress first").
      test_boundary: >-
        Nothing was tested. This decision did not re-verify any of the sixteen
        identities and makes no statement about their truth. Correctness is not
        the ground of the disposition.
      remaining_uncertainty: >-
        None that bears on ECDLP. Each statement is an elementary identity
        under the record's own convention (bit length of 2^k - 1 is k;
        left-to-right binary double-and-add on it uses k - 1 doublings and
        k - 1 additions; a width-w table of the stated convention holds a power
        of two entries). Whether one of these counts could ever enter a charged
        ECDLP cost is exactly what the records themselves decline to claim.
      successor_or_revisit: >-
        REVISIT if any of: (a) a record names an elliptic-curve group object and
        a mechanism by which a counted quantity enters a stated ECDLP cost
        (time, memory or data exponent, or a fully charged constant against rho
        or BSGS), for example a precomputation-table time-memory tradeoff with
        a stated exponent; that is a different idea and is ranked on its own
        merits, and nothing here pre-judges it; (b) RQ-ECDLP-002's
        decision_target is amended to admit arithmetic-only fixtures; (c) an
        independent Validator finds ECDLP content in a listed record that this
        reading missed, in which case that entry is superseded by a new
        decision. SUCCESSOR: ideation on RQ-ECDLP-002 continues through
        /propose-ideas under docs/inventor-protocol.md with a proof_search_map
        and an object-first frame. This decision withdraws nothing from that
        route.

  # ---------------------------------------------------------------------------
  # (2) The forty-seven approved, unrun contracts of the same stream
  # ---------------------------------------------------------------------------
  withheld_contracts:
    ruling: >-
      DISPATCH WITHHELD, APPROVAL NOT REWRITTEN. Each contract below is frozen
      and `status: approved`, and none has a run manifest on this tree. Running
      one produces a true integer identity and no information about any ECDLP
      decision, so no execution, executor launch or archive task for them is
      ranked ahead of doing nothing (AGENTS.md "Goals are never paused", "Never
      dispatch a task you cannot rank ahead of doing nothing"). Their
      specification files, hypotheses, approval decisions and executor cards
      are immutable and are not edited. If one is run anyway (for example by a
      bare /run under AGENTS.md "Harness entry point"), every output is
      retained as written, and none is cited as RQ-ECDLP-002 or GOAL-ECDLP-001
      evidence.
    membership_basis: >-
      Pattern search of experiments/*/specification.yaml for the stream's title
      templates, followed by a status read of each matched file (47 of 47 read
      `status: approved`) and a glob for runs/*/manifest.yaml under each (0
      found). EXP-ECDLP-9233d4 was read in full. The census in T-1 confirms each
      ID against its own out_of_scope text. An ID that the census does not
      confirm is dropped from this list by a superseding decision, never kept by
      pattern.
