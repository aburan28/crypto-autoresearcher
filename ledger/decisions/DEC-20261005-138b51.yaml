# =============================================================================
# DEC-20261005-138b51 -- TRIAGE OF THE ARITHMETIC-STATEMENT STREAM FILED AGAINST
# RQ-ECDLP-002. Sixteen open ECC ideas are DECLINED as out of question (no curve
# object, no ECDLP cost quantity, by their own text). Forty-seven approved,
# unrun experiment contracts of the same stream have DISPATCH WITHHELD: they rank
# below doing nothing. No proposal, hypothesis, experiment, approval decision or
# handoff is edited. No hypothesis status moves. Nothing here says any of the
# arithmetic is wrong; the disposition rests on scope, not on falsity.
#
# NOT EFFECTIVE until TASK-20261005-8d4da1 commits it and its receipt verifies.
# =============================================================================
