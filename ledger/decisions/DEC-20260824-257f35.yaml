      THE REVERSE-ENGINEERING TEST AND ITS MEASURED ANSWER: A REVERSE-ENGINEERING PRODUCER AIMING AT
      1/3/0/1/1 WOULD HAVE PRODUCED SIX AGREEMENTS. This partition disagrees on `length` for a reason
