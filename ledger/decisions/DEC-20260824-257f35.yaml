      ONE IT COULD NOT, AND IT WORKED. RECORDED AS HAVING PAID FOR ITSELF AND BINDING ON THE SUCCESSOR
      OPENING.
    no_other_encounter: >-
      BOTH REVIEWERS REPORT NO ENCOUNTER WITH A FINDING THROUGH COMMIT METADATA, A PR TITLE OR BODY, THE
      MERGE DIGEST, coordination/events/main, A BUS MESSAGE OR A COMMITTED ARTIFACT RESTATING HISTORY.
      BR-10's channel -- the producer's own committed execution report quoting shas and describing their
      contents, which round 2 disclosed as a near miss -- IS MEASURED CLOSED THIS ROUND: neither reviewer
      reports encountering it. BR-1's subject-line-only commit discipline held through the round.
    quarantine_non_reading_attested_BY_MECHANISM_by_both_and_the_mechanisms_differ: >-
      NEITHER REVIEWER ATTESTS BY INTENT AND THE TWO MECHANISMS ARE DIFFERENT, WHICH IS WHAT THE STANDARD
