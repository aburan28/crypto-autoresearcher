      therefore did not even use the permitted `--format=%H`. THE ROUND IS COMPOSED AS MUTUALLY BLIND, ON
      THE ATTESTATIONS.
    the_checker_output_recorded_verbatim_and_adjudicated_for_what_it_does_NOT_confirm: >-
      tools/check_review_independence.py, run by the driving session against this batch, returned:
      "PASS: 2 report(s), every joint owned and attested, blindness respected, controls declared".
      A GREEN TOOL IS THE EASIEST THING IN THIS PROGRAM TO OVER-READ AND THIS CLOSE ADJUDICATES THE PASS AS
      CAREFULLY AS IT WOULD A FAILURE. THE CHECKER CANNOT CHECK READ ORDER. IT CANNOT SEE A PRIOR EMBEDDED
      IN A DOCUMENT IT VALIDATES. IT SAYS NOTHING ABOUT WHETHER THE COMPOSITION IS CORRECT. AND ITS LEAK
      TEST COVERS THE RE-DERIVER ONLY -- it is not run against the other reviewer's sources_read at all.
      THIS ROUND'S SEAL IS THEREFORE MECHANICALLY TESTED FOR ONE REVIEWER AND ATTESTED FOR THE OTHER, AND
      THIS CLOSE DOES NOT DESCRIBE IT AS MECHANICALLY VERIFIED FOR BOTH.
    RULING_ON_WHETHER_BR_9s_STRUCTURAL_FIX_HELD:
      the_ruling: >-
        **BR-9's STRUCTURAL FIX HELD, WITH ONE NAMED RESIDUAL. IT DID NOT FAIL.** And it is a measured
        improvement on round 2 rather than an asserted one.
      what_it_bought_that_round_2_did_not_have: >-
        ROUND 2's LEAK DID NOT RECUR. DEC-20260824-c5bb72 PD-3 measured that the one-sentence prior naming
        the in_linearized_code mechanism sat inside review-plan.yaml's mandatory `coordinator_prior` field,
        which the checker REQUIRES to be non-empty and which BOTH reviewers list in sources_read, so the
        discount applied to both rather than to one. THIS ROUND: the prior lives outside every reviewer
        read_scope, under a path prefix no reviewer's declared scope reaches; the plan's `coordinator_prior`
        field carries A POINTER AND A SEALED MARKER AND NO SENTENCE, NO MECHANISM AND NO INTEGER; and the
        prefix is a LITERAL blind_from entry (BR-3) AND is additionally inside
        `blind_rederivation.blind_from`, which is the only list the checker mechanically tests. THE SEAL IS
        MACHINE-TESTABLE FOR ONE REVIEWER FOR THE FIRST TIME IN THIS GOAL.
      the_measured_consequence_which_is_the_whole_point_of_the_fix: >-
        THE ONE ITEM OF THE SEALED PRIOR THAT THE ROUND CONFIRMED -- P-6, A PREDICTION ABOUT THIS
        COORDINATOR'S OWN ERROR MODE -- IS CONFIRMED BY THE REVIEWER WHOSE NON-READING IS MECHANICALLY
        TESTED, AND IS THEREFORE UNDISCOUNTED. In round 2 no concurrence could be undiscounted. THAT IS
        WHAT BR-9 BOUGHT, STATED AS A MEASURED CHANGE OF STATE RATHER THAN AS COMPLIANCE.
      THE_DISCLOSED_EXPOSURE_COMPOSED_RATHER_THAN_ABSORBED: >-
        THE VALIDATOR DISCLOSED, UNPROMPTED AND IN FULL, that while verifying the archive's 34-path content
        binding for R3-J1 it printed the receipt's path list filtered for the substrings `review-plan`,
        `sealed`, `batch.yaml` and `task-cards`, AND THE OUTPUT INCLUDED THE TWO SEALED-PRIOR FILE PATHS,
        because they are declared artifacts of TASK-20260824-aed5ca and are bound in a receipt that is in
        its read scope. It states it saw TWO FILE NAMES and did not print, open, read, parse or infer one
        byte of either file's CONTENT, and that the same listing showed its sibling's assignment document
        and task card as bound paths, again as names only, neither opened.
      the_ruling_on_that_exposure_stated_explicitly_because_the_card_requires_it: >-
        **BR-9 HOLDS WITH A NAMED RESIDUAL. IT DOES NOT FAIL, AND IT DOES NOT HOLD UNQUALIFIED.** FOUR
        GROUNDS, GIVEN IN FULL SO THE RULING CAN BE CHECKED RATHER THAN TAKEN.
        (1) THE MARGINAL INFORMATION IS ESSENTIALLY NIL AND IS BOUNDED PRECISELY. The plan's own
        `coordinator_prior` field PUBLISHES THE SAME PATH PREFIX TO BOTH REVIEWERS BY DESIGN, and states
        that the prior exists in two write-once parts. What the listing added beyond that is the two
        filenames' suffixes. A PATH NAME AND A SHA256 DIGEST ARE NOT CONTENT, and no prediction, mechanism,
        integer or item label is recoverable from either.
        (2) THE EXPOSURE IS STRUCTURALLY UNAVOIDABLE UNDER THIS BATCH'S OWN RULES, AND NAMING THAT TRADE IS
        THE USEFUL OUTPUT. BR-8 and PDV-5 together REQUIRE the sealed prior to be a declared artifact_path
        bound by a receipt, precisely so it cannot be the unbindable document round 2's equivalents were.
        A receipt binding it must be readable by a reviewer verifying the archive under R3-J1. SO BR-9's OWN
        DURABILITY FIX CREATES THIS RESIDUAL: the two rules are in tension and the tension is a defect in
        the round's design, WHICH IS THIS COORDINATOR ROLE'S, AND NOT A DEFECT IN THE REVIEW.
        (3) THE DIRECTIONAL CHECK CUTS AGAINST CONTAMINATION RATHER THAN FOR IT. A prior-contaminated reader
        confirms the prior; this reviewer's hand-derivation matched the PRODUCER on all six rows before
        reading, and its two major findings D-2 and D-8 are precisely the two UNDECLARED MECHANISMS THAT
        MOVE THE RESULT TOWARD THE PRE-REGISTERED TARGET. That is the opposite of what contamination
        produces.
        (4) THE DISCLOSURE ITSELF IS A CREDIT AND IS RECORDED AS ONE. Round 1's Red Team disclosed an
        encounter unprompted and the round was composable only because of it; the same standard applies
        here. A reviewer that discloses a filename it need not have mentioned is a reviewer whose
        `read_sealed_prior: false` is worth more, not less.
      the_residual_recorded_for_the_successor_rather_than_dismissed: >-
        A SEALED PRIOR DECLARED IN AN ARCHIVE RECEIPT THAT REVIEWERS MUST READ IS A STRUCTURAL HALF-LEAK BY
        CONSTRUCTION. THE FIX IS NOT TO STOP BINDING IT: bind it in a receipt reviewers do NOT read, or
        carry its digest in a sidecar the reviewer's verification does not enumerate. Routed to the
        successor opening, where it is fixable and where retrofitting is structurally impossible.
      the_second_residual_the_plan_itself_named_and_this_close_upholds: >-
        THE CHECKER'S LEAK TEST COVERS THE RE-DERIVER ONLY, so the Validator's compliance with the seal
        rests on its own honest boolean and on its sources_read being complete, WHICH NO TOOL HERE CAN
        VERIFY. The plan said so at opening and this close repeats it rather than letting the PASS absorb
        it.
    what_the_round_achieved_in_the_plans_own_words_and_not_upgraded: >-
      THE ROUND ACHIEVED SEAL-BLINDNESS, SIBLING-BLINDNESS AND IMPLEMENTATION-BLINDNESS FOR ONE REVIEWER,
      MECHANICALLY. IT DID NOT ACHIEVE VALUE-BLINDNESS AND DOES NOT CLAIM IT: the producer's committed
      execution report states the differing-cell quantity in prose, as H-5 and IR-10 require, and every
      reviewer must read that report to discharge any joint. A MATCHING INDEPENDENT DERIVATION WITH
      `derived_before_reading: true` IS CORROBORATION AND NOT PROOF OF INDEPENDENCE, AND THIS CLOSE WEIGHTS
      IT THAT WAY. The Red Team's own honesty statement gives the executed sequence and states that no tool
      in this repository can check the boolean.
    the_blind_rederivation_paid_for_itself_and_that_is_a_measured_procedural_result: >-
      `blind_rederivation.required: true` IS THE SINGLE PROCEDURAL DECISION OF THIS ROUND THAT PRODUCED NEW
      FINDINGS, AND THE REVIEWER SAYS SO AGAINST ITS OWN INTEREST: BOTH of its strongest objects -- J13's
