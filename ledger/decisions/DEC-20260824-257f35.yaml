    silence_was_checked_for_explicitly_and_there_was_none: >-
      NO JOINT WAS SILENT AND NO JOINT WAS REPORTED AS NOT REACHED. Eight assigned, eight reported with
      their measurements. HAD ANY BEEN SILENT, READING IT AS AN ADMISSION WOULD HAVE BEEN MANUFACTURING
      ONE, AND THIS CLOSE WOULD HAVE RECORDED IT AS A GAP.
    THE_GOAL_HEAD_RESTRICTION_4_J8_J11_AND_J13_EACH_ANSWERED_SEPARATELY:
      the_requirement: >-
        The goal head's restriction (4) requires that J8, J11 AND J13 BE ANSWERED rather than omitted, and
        states that "a later round that simply omits them would not meet it and any close reading it that
        way would be manufacturing an admission". R3-J6 is where this round met it or failed to.
      ruling_on_the_requirement: >-
        **MET.** ALL THREE ARE ANSWERED, SEPARATELY, EACH WITH ITS OWN VERDICT AND ITS OWN MEASUREMENT,
        NONE SILENT AND NONE UNREACHED. THIS IS A DIFFERENT STATEMENT FROM THE CRITERION ITSELF AND MUST
        NOT BE READ AS IT: THE THREE JOINTS ARE ANSWERED AND COMPLETION CRITERION 4 IS STILL NOT MET.
      J8:
        verdict: ANSWERED -- NARROWED, NOT CLOSED.
        the_measurement_it_rests_on: >-
          Read directly from BATCH-efcae7's committed constructions/j8_results.json and NOT from the
          producer's re-run: of the five surviving adversarial instruments the D-SHA1-INCODE sub-arm figure
          `subarm_incode_member` is 520/520 FOR O-E AND 0/520 FOR EACH OF O-D, O-C, O-C-prime AND
          O-C-double-prime. The refold is the committed disjunction with that sub-arm carried in, and A
          DISJUNCT THAT IS 0 FOR FOUR INSTRUMENTS CANNOT CHANGE THEIR VERDICTS. rc1-refold-result.json
          reports instruments caught 1 and verdicts changed 1, and IR_11_disagreements is empty.
        the_ruling_on_what_the_re_scoring_is_evidence_OF: >-
          THE PRE-REGISTERED ANSWER P-D IS AN ARITHMETIC CONSEQUENCE OF A COMMITTED TABLE AND NOT A
          MEASUREMENT OF COVERAGE, and the producer reports it as the confirmation of a known outcome,
          which is correct and is a credit. DOES CATCHING ONE KNOWN-FALSE INSTRUMENT WITH A RULE WRITTEN
          AFTER THAT INSTRUMENT WAS EXHIBITED CLOSE J8? NO -- IT NARROWS J8 BY EXACTLY ONE OBJECT. The rule
          was written after the object was exhibited, against the one arm that object saturates, and the
          committed rule is NOT changed by this batch. THE RE-SCORING IS EVIDENCE THAT A DETECTION RULE CAN
          BE EXTENDED TO CATCH A NAMED OBJECT ONCE THE OBJECT IS IN HAND. IT IS NOT EVIDENCE ABOUT OBJECTS
          NOT IN HAND.
        the_object_list_that_remains: >-
          O-D (block_index-blind), O-C (block_index + length blind), O-C-prime (block_index +
          in_linearized_code blind) and O-C-double-prime (depth-3). ALL FOUR REMAIN UNREPLICATED -- built
          once by one session and re-executed here from the SAME committed construction file, which is a
          re-execution and not an independent construction -- and permissive mode is unmeasured for all
          four in both directions.
        the_sixth_passer_and_the_accounting_this_close_adopts: >-
          A SIXTH INSTRUMENT ALSO PASSES AND IS IN NEITHER THE FIVE-SURVIVOR LIST NOR THE REFOLD'S
          PER-INSTRUMENT LIST. Committed j8_results.json records O-RT2 -- the sha1 message difference
          restricted to the seed window dv[:16] -- at plant 96/96, subarm_incode_member 0/520,
          passes_strengthened_suite true, and the refold cannot touch it either. The producer's own O_RT2
          block argues the projection is LOSSLESS on in-code objects, which is a coherent reason to treat it
          as not known-false, BUT THAT ARGUMENT IS MADE IN A DIFFERENT BLOCK AND IS NOT CONNECTED TO THE
          SURVIVOR ACCOUNTING. THIS CLOSE THEREFORE STATES **FIVE NON-HONEST PASSERS WITH O-RT2 NAMED AND
          ITS LOSSLESSNESS ARGUMENT ATTACHED**, rather than four with an unstated exclusion, because
          reporting the smaller number without the argument would be understating in the direction that
          flatters the instrument.
      J11:
        verdict: ANSWERED -- HOLDS. ROUND 2's FINDING IS UNCHANGED BY THIS PACKAGE.
        the_measurement_it_rests_on: >-
          partition-derived.json's `probing_profile_per_component` reports, per component, BOTH
          `isolating_draw_exists` -- there exists a draw D and there exists a census entry C, ANY entry,
          whose committed attribution against D is exactly [X] -- AND `own_source_differing`, the strictly
          different statement about D's OWN source entry, with a verbatim quantifier_note naming
          CORR-20260824-c1c8b1 and H-7. The step_delta CONTINGENT class fires on the FIRST, at
          isolating_draw_count 6 on md5.
        the_determination: >-
          THE SUB-ARM BINDS A PARTITION CLASS AND STILL BINDS NO CELL VERDICT AND NO DIFFERING-CELL COUNT.
          Not one of the nine adjudicated cells, and not one of the independent twenty-four, turns on an
          isolation result: the cell rule is membership of a perturbed draw under a projection composed with
          the row's deletion, AND ISOLATION NEVER ENTERS IT. ROUND 2's FINDING STANDS EXACTLY AS RECORDED.
        the_credit: >-
          The class now rests on the WEAKER SOME-ENTRY QUANTIFIER AND SAYS SO IN THE STRING THAT CARRIES IT,
          which is precisely the H-7 repair CORR-20260824-c1c8b1 demanded. That is a real improvement and it
          is recorded as one.
        AND_THE_COMPOSED_FINDING_NEITHER_REVIEWER_COULD_HAVE_MADE_ALONE: >-
          THE ONE PARTITION CLASS THE SUB-ARM DOES BIND IS EMITTED WITH A PRIMITIVE SCOPE IT DOES NOT HAVE.
          The Red Team routed the implementation question away explicitly -- whether the module's isolation
          computation is the committed attribution over all entries or a re-implementation "cannot be checked
          without reading harness/diffpath/depgraph.py, which is a blind_from path for me. I DID NOT READ IT"
          -- and the Validator, WHICH DID NOT KNOW J11 WAS THE JOINT ITS MEASUREMENT BORE ON, measured that
          restricted to sha1 the isolating count is 0 and the honest sha1 class is R5 NOT_PROBED (D-1).
          COMPOSED: J11 HOLDS, AND THE SINGLE CLASS ITS SUB-ARM BINDS IS HALF-WRONG ON ITS EMITTED
          PRIMITIVE SCOPE. THIS IS THE SECOND FINDING OF THIS ROUND THAT ONLY THE COMPOSITION PRODUCES.
      J13:
        verdict: ANSWERED -- BREAKS, ON A MEASURED COUNTEREXAMPLE, IN TWO SEPARABLE PARTS.
        part_1_relocation: >-
          EXCLUDING THE DIAGONAL DOES NOT ANSWER J13; IT MOVES IT INTO THE not_constructible COLUMN. Of the
          36 family-by-row cells, 18 -- EXACTLY HALF -- are excluded because three of the six declared
          families cannot be honoured at all under CTL-WF, a further 3 as diagonal and 6 as forced. NINE
          CELLS REMAIN. The off-diagonal remainder is measuring WHICH OFF-DIAGONAL FAMILIES COULD BE
          CONSTRUCTED AT ALL far more than it is measuring the instrument: THE CONSTRUCTIBILITY TEST DECIDES
          HALF THE MATRIX BEFORE ANY ADJUDICATION RUNS.
        part_2_the_theorem_it_relocates_onto_is_FALSE_on_sha1: >-
          The diagonal cell is excluded WITH ITS VALUE STATED AS A THEOREM -- "a family perturbing exactly
          the set S while holding every other key component fixed makes the row deleting S DETECTED BY
          CONSTRUCTION". MEASURED: for d_message_difference against the row deleting message_difference, md5
          DETECTED and SHA1 **NOT DETECTED**.
          WHY IT FAILS THERE: ITS HYPOTHESIS IS FALSE FOR THE ONE FAMILY THE CONTRACT REUSES RATHER THAN
          REBUILDS. controlpower.perturb_message_difference HONESTLY RECOMPUTES in_linearized_code from the
          perturbed dv and the committed PERTURBATION_DECLARATION SAYS SO in the field
          `recomputed_because_derived_from_the_perturbed_component`. A random bit flip takes the dv out of
          the linearized code, SO ON SHA1 THE DRAW MOVES TWO KEY COMPONENTS. It does not perturb "exactly
          the set {message_difference}". The row deleting message_difference RETAINS the flag, the flag
          differs, the draw is a NON-MEMBER, and the cell is NOT DETECTED.
        the_narrowest_repair_that_saves_the_theorem_and_it_is_sound_when_correctly_instantiated: >-
          For this family on sha1, S = {message_difference, in_linearized_code}, so THE THEOREM APPLIES TO
          THE DEPTH-2 ROW DELETING THAT PAIR -- which is BATCH-efcae7's declared multi-deletion row 5 and
          the unique dependency-breaking depth-2 subset the graph names. INSTANTIATE S FROM THE FAMILY'S
          ACTUAL MOVED-COMPONENT SET PER PRIMITIVE RATHER THAN FROM ITS NAME, and report the sha1 diagonal
          cell as MEASURED NOT DETECTED rather than as an excluded theorem. THE EXCLUSION RULE READS A
          FAMILY'S NAME WHERE IT SHOULD READ THE FAMILY'S BEHAVIOUR.
        the_per_primitive_split_stated_as_the_mixed_thing_it_is: >-
          THE ANSWER DIFFERS ON THE TWO PRIMITIVES AND THE SPLIT IS THE FINDING, AND IT IS NOT ROUNDED TO
          EITHER END. ON MD5 the diagonal theorem HOLDS for all three constructible families, measured
          DETECTED in all three. ON SHA1 it HOLDS for d_step_delta and d_block_index and FAILS for
          d_message_difference.
        what_it_does_not_take_with_it: >-
          IT DOES NOT INVALIDATE THE DIFFERING-CELL COUNT AND DOES NOT CHANGE IT. The diagonal cells are
          outside the adjudicated set for BOTH instruments and O-E agrees with the honest instrument on that
          cell too, both NOT DETECTED. IT INVALIDATES THE WORD THEOREM AGAINST THAT ONE EXCLUDED CELL.
    what_the_criterion_would_need_and_it_is_named_so_it_cannot_drift: >-
      IT NEEDS BOTH SESSIONS TO ADMIT, WHICH REQUIRES THE PACKAGE UNDER REVIEW TO SURVIVE AN ADVERSARIAL
      PASS ON THE JOINTS THAT MATTER, NOT A LARGER REVIEW BUDGET AND NOT FEWER JOINTS. CUTTING JOINTS UNTIL
      NOTHING BREAKS WOULD SATISFY THE CRITERION'S LETTER AND DESTROY IT, AND THIS CLOSE NAMES THAT ROUTE
      EXPLICITLY SO THAT NO SUCCESSOR OPENING CAN TAKE IT WITHOUT SAYING SO. Criterion 1 remains unmet for
      the reason batches 1 and 2 recorded -- two of the four verified generators emit no orbit image at all
