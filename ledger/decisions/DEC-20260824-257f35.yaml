    the_comparison_with_round_2_stated_plainly_rather_than_flattered: >-
      ROUND 2: the Validator ADMITTED on all seven joints it owned and the Red Team did not admit, with
      three of six breaking. ROUND 3: THE VALIDATOR ADMITS ON THREE OF FOUR AND THE RED TEAM ON NONE OF
      FOUR. THAT IS A BROADER REFUSAL, NOT A NARROWER ONE, AND THIS CLOSE DOES NOT PRESENT ROUND 3 AS AN
