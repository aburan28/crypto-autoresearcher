  independence_ruling:
    ruled_from_the_attestations_and_not_from_the_plans_intent: >-
      BOTH REVIEWERS ATTEST `read_sibling_reports: false` AND `read_sealed_prior: false`. Neither's
      sources_read contains a sealed-prior path or the sibling's report, card, assignment or constructions.
      The Red Team additionally records that its sibling's review directory DID NOT EXIST WHEN IT BEGAN and
