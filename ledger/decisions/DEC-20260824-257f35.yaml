      ON AN OWNED JOINT IS NOT AN ADMISSION ON THAT JOINT. It admits on R3-J1, R3-J2 and R3-J4 -- THREE OF
      ITS FOUR -- and it states in its own words that its report "IS NOT a verdict on the batch ... and not
