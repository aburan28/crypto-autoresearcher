      THE ROWS WHERE IT COULD HAVE MATTERED MORE WERE CHECKED AND IT BITES ON EXACTLY ONE BRANCH OF ONE
      ROW.
      D-3, MINOR: isolating_draw_count 6 beside an isolating_examples list of 5 on both branches, with no
      declared truncation anywhere in the artifact. One declared field closes it.
    the_order_claim_and_the_contamination_ruling: >-
      NO CONTAMINATION AND THE STOP DOES NOT FIRE, established statically (derive_partition references
      neither the pre-registered dict nor the column reader, and the derived write precedes the column
      read causally and textually) and from the artifact (no occurrence of the compared column's
