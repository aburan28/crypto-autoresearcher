      AND THE RE-DERIVER RULED AGAINST ITSELF ON THE DENOMINATOR, WHICH IS RECORDED AS A CREDIT: its
      forced set used only the flag edge, while the producer additionally forces the `length` row on the
      step_delta edge, which it CONFIRMED from committed source and from its own gate check; it measured
