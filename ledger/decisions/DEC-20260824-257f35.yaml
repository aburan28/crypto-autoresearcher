      THE ORDER CLAIM IS ADEQUATELY LIMITED, IN H-2'S REQUIRED WORDS VERBATIM, AND IT VOLUNTEERS THE
      DISCLOSURE THAT WEAKENS IT. The blind-to-target-versus-blind-to-column distinction is RULED REAL BUT
      THINNER THAN IT SOUNDS: the module hard-codes the six target classes, so the producer had the answer
