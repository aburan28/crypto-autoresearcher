        word count, measured on 3208 objects, zero exceptions; the derivation states in terms that it
        does NOT hold on md5 and the graph is consistent, no such md5 edge being labelled derived.
        WITNESS CAPACITY: CANNOT FAIL, distinct_Y 1.
      E4: >-
