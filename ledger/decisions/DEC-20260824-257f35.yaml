      UNDECLARED CLAUSE IS LOAD-BEARING AND IT MOVES THE RESULT TOWARD THE PRE-REGISTERED TARGET.
      THIS CLOSE ADOPTS THE REVIEWER'S RULING AND ITS REASONING: THE ROW CLASSES ARE DEFENSIBLE AND THE
      RULE TEXT IS FALSE OF THE FUNCTION THAT EMITS IT. d_step_delta and d_block_index are NEW families of
      THIS contract, and classifying a re-partitioned earlier verdict by a family invented in the contract
