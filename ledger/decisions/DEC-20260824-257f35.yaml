    **`analyzed`. NEVER `supported`. STATED EXPLICITLY AND NOT LEFT TO INFERENCE, AND NOT ROUNDED UP.**
    Three of CLAUDE.md's four supported-promotion gates are STRUCTURALLY UNMET by a batch of this kind --
    there is no asymptotic-complexity claim, no proof decomposition into single-responsibility lemmas, no
    numbered heuristics with archived validation evidence and no concrete-cost table -- and the fourth,
    independent review plus a red-team pass on the cost model, is not attempted because there is no cost
    model. TWO INDEPENDENT REVIEWERS DO NOT RAISE A CEILING SET BY THAT, AND NEITHER DOES AN EVIDENCE
    STRENGTH OF `replicated`, WHICH DESCRIBES HOW MANY IMPLEMENTATIONS PRODUCED A NUMBER AND NEVER WHAT THE
    NUMBER MEANS.
    NO PATH IS CLAIMED NEW FOR MD5 OR SHA-1 AT ANY TIER BY THIS DECISION, BY EV-DIFFP-afd96c, BY
    KN-TECH-6785f2 OR BY THE GOAL CHECKPOINT. NO CRYPTANALYTIC IMPROVEMENT OF ANY KIND IS CLAIMED. NO
    NON-MEMBER VERDICT IS WRITTEN OR IMPLIED AS NOVELTY, AND WITH A READABLE CENSUS OF **ZERO** A NON-MEMBER
    VERDICT CARRIES NO INFORMATION ABOUT THE LITERATURE AT ALL. A PASSING CONTROL IS NOT AN IMPROVEMENT. AN
    INSTRUMENT WHOSE PROFILE BECOMES READABLE IS A BETTER-UNDERSTOOD INSTRUMENT AND IS NOT A RESULT ABOUT
    MD5 OR SHA-1. A DIFFERING-CELL COUNT OF ZERO AND A DIFFERING-CELL COUNT OF TEN ARE BOTH MEASUREMENTS AND
    NEITHER IS A SCORE.
    CENSUS COMPLETENESS, BESIDE EVERY VERDICT CITED IN THIS RECORD AND NEVER SUMMED: readable 0 /
    quarantined_not_read 1 / acquisition_gap 8, with shadow_planted 16 carried separately. EVERY PLANTED MD5
    ENTRY CARRIES A WEIGHT-1 MESSAGE DIFFERENCE NO REAL MD5 COLLISION CHARACTERISTIC HAS, AND ADJUDICATOR
    CORRECTNESS AGAINST A PUBLISHED CHARACTERISTIC REMAINS UNTESTED.
    THE STRUCTURAL OBSERVATION ABOUT SHA-1 EXPANSION LINEARITY IS EXPLICITLY NOT NEW AND NOT CRYPTANALYTIC:
    it is a textbook property of a GF(2)-linear message expansion, restated about this key, and it is
    offered to GOAL-SHA1-001 ONLY in the corrected long form with its component scope attached, or not at
    all.
