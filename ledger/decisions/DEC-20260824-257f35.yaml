  composition_rule_applied:
    the_rule: >-
      COMPOSE, DO NOT COUNT. A blinded reviewer's scalar verdict is a lossy roll-up the checker's schema
      requires, and BOTH REVIEWERS SAID SO THEMSELVES AND ASKED THAT THE PER-JOINT MAPS GOVERN. THEY DO.
      The Validator's `breaks` and the Red Team's `breaks` ARE NOT WEIGHED AGAINST EACH OTHER AND ARE NOT
      ADDED: the two were asked different questions on disjoint joint sets and neither can see the
      other's four joints.
    the_agreement_rule_stated_explicitly_so_it_can_be_checked: >-
      WHERE THE TWO REPORTS AGREE, THE AGREEMENT COUNTS AS **TWO** OBSERVATIONS ONLY WHEN BOTH
      CONDITIONS HOLD: (a) mutual blindness demonstrably held for that object, from the attestations and
      not from the plan's intent; AND (b) the two reached it BY DIFFERENT MECHANISMS. IF EITHER FAILS IT
      COUNTS AS **ONE** OBSERVATION REACHED TWICE, AND THE DISCOUNT IS STATED AT THE POINT OF USE.
    application_1_the_exclusion_machinery_TWO_observations_and_this_is_the_rounds_best_output: >-
      BOTH REVIEWERS LANDED INDEPENDENTLY ON THE EXCLUSION MACHINERY AND THE CONVERGENCE IS WORTH TWO
      OBSERVATIONS, NOT ONE, BECAUSE THEY ARE NOT THE SAME OBSERVATION AT ALL.
      THE VALIDATOR'S (R3-J4): every exclusion's stated reason is TRUE given the honest key -- the 18
      not-constructible cells rejected by a theorem and not by sampling luck, the 6 forced cells each
      resting on a derivation-carrying edge, the 3 diagonal cells excluded under the declared rule -- and
      it deferred "whether the count MEANS anything" to R3-J8 in terms.
      THE RED TEAM'S (R3-J8, RT-J8-1): the rule COMPUTING those reasons is instrument-independent, so it
      cannot bound an instrument-dependent quantity, and on this family set it deletes the single cell in
      the entire 72-cell per-primitive matrix at which the honest instrument and O-E differ.
      CONDITION (a) HOLDS: both attest read_sibling_reports false, and the Red Team's sibling directory
      DID NOT EXIST when it began. CONDITION (b) HOLDS AND IS THE STRONGER HALF: the Validator re-ran the
      producer's committed module and re-implemented select_cells from its own edge records; the Red Team
      re-implemented the contract's declared rule WITHOUT EVER OPENING harness/diffpath/depgraph.py,
      asserting at run time that the module was absent from sys.modules.
      THE COMPOSITION IS THE FINDING NEITHER COULD HAVE MADE ALONE, AND IT IS THE PRECISE REASON TWO
      BLINDED REVIEWERS WERE WORTH PAYING FOR THIS ROUND: THE EXCLUSION SET IS CORRECT UNDER THE HONEST
      KEY, AND THAT CORRECTNESS IS EXACTLY WHY IT CANNOT BOUND AN INSTRUMENT. The Red Team's structural
      point would be dismissible as a suspicion of arithmetic error without the Validator's verification;
      with it, the point is unavoidable. Neither reviewer could state the conjunction and this close does.
    application_2_the_one_directional_capacity_ONE_observation_with_the_discount_stated: >-
      THE VALIDATOR'S D-10 AND THE RED TEAM'S RT-J8-2 BOTH SAY THE always_member ARM DEMONSTRATES THE
      COUNTING RULE'S CAPACITY AND NOT THE FAMILY SET'S. CONDITION (b) FAILS: both read the producer's own
      volunteered block `the_always_non_member_arm_is_vacuous_here_and_that_is_said_plainly`, which is in
      both read scopes and states the argument for the other arm. THE AGREEMENT IS THEREFORE COMPOSED AS
      ONE OBSERVATION REACHED TWICE FROM A SHARED SOURCE, AND THE PRODUCER GETS THE CREDIT FOR IT.
      ONE HALF IS NOT DISCOUNTED, BECAUSE IT IS NOT IN THE SHARED SOURCE: the Red Team's observation that
      THE SAME SENTENCE IS OWED TO THE always_member ARM IN THE OTHER DIRECTION AND IS NOT MADE THERE is
      its own, and the Validator's arithmetic that the always_non_member arm is PINNED at 0 because the
      honest instrument reports DETECTED on ZERO of nine cells is its own. Those two are composed as two.
    application_3_the_integer_0_TWO_observations_for_the_VALUE_and_none_for_its_MEANING: >-
      THE DIFFERING-CELL INTEGER 0 IS REPRODUCED BY TWO IMPLEMENTATIONS OVER TWO DIFFERENT DENOMINATORS,
      9 AGGREGATE CELLS AND 24 PER-PRIMITIVE CELLS, ONE OF WHICH NEVER READ THE PRODUCER'S MODULE. That
      is TWO observations that the integer is a property of THE CONTRACT'S DECLARED RULE and not an
      artifact of one implementation. IT IS ZERO OBSERVATIONS THAT THE INTEGER MEANS ANYTHING, and the
      re-deriver says so itself: the same rule returns 0 for an instrument that returns NON-MEMBER for
