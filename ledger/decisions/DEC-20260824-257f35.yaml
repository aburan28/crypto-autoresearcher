        PRIMITIVES CARRY DIFFERENT ARGUMENTS -- RT-J5-4.
    class_counts_stated_as_a_partition_never_as_a_fraction: >-
      DERIVED: provably_undetectable 2 / not_probed 2 / probed_and_genuinely_not_detected 0 / entailed 1 /
      contingent 1. PRE-REGISTERED: 1 / 3 / 0 / 1 / 1. Both sum to the six depth-1 rows. Rows agreeing: 5
      of 6. THE ONE DISAGREEING ROW IS `length`.
    the_disagreement_named_on_BOTH_sides_and_its_kind_ruled: >-
      THE TWO CLASSES ARE NOT THE SAME KIND OF STATEMENT AND ARE NOT CONTRADICTORY.
      NOT_PROBED_BY_A_DECLARED_FAMILY is a COVERAGE statement about a finite declared family set;
      PROVABLY_UNDETECTABLE_BY_ANY_FAMILY quantifies over EVERY POSSIBLE FAMILY and is strictly stronger,
      so if `length` is undetectable by any family then a fortiori no declared family detected it. THE
      DERIVED CLASS REFINES THE PRE-REGISTERED CLASS ON THIS ROW RATHER THAN CONTRADICTING IT.
      THIS CLOSE THEREFORE DOES NOT READ "1 OF 6 ROWS DISAGREE" AS "EITHER THE GRAPH OR BATCH-efcae7'S
      READING IS WRONG", although the contract's own `both_outcomes_are_results` framing invites exactly
      that. On this row the question of which side is wrong does not arise, and the producer correctly
      declined to decide it under IR-8 and H-11.
    what_the_partition_actually_proves_stated_with_its_three_grounds: >-
      TWO OF SIX DEPTH-1 ROWS ARE NOW PROVABLY_UNDETECTABLE, AND THE GROUNDS ARE: A TUPLE CARRIES ITS OWN
      LENGTH; A FIELD IS ABSENT ON MD5; AND A REDUNDANT RECOMPUTED PREDICATE IS A FUNCTION OF ITS OWN
      ARGUMENT, THE LAST HOLDING ONLY OVER A POPULATION A GATE OF THIS BATCH'S OWN CONSTRUCTION ADMITS BY
      ASSERTING THAT VERY PREDICATE. A record that reports "the graph proved two of six depth-1 rows
      undetectable by any family" without those three grounds beside it is reporting a stronger sentence
      than the derivations support.
    the_two_defects_in_the_partition_and_their_exact_reach: >-
      D-2, MAJOR: the implemented R2 filters candidates by `and n == "d_message_difference"`, an
      UNDECLARED restriction to one family BY NAME, while the emitted ASSIGNING_RULE says only "a declared
      family's own declaration". THE COUNTERFACTUAL WAS MEASURED: under the rule AS WRITTEN, d_step_delta
      (368 of 368 accepted per primitive) and d_block_index (368 of 368) give step_delta and block_index
