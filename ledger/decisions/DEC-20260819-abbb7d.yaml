  rationale:

    - id: R1
      claim: >-
        Item 2 is selected. It is the only one of the four whose answer is not
        already known, and it is upstream of item 3.
      basis: >-
        CORR-20260808-c792f8 refuted EV-WESO-001's beats-Delfs-Galbraith-at-
        every-tested-budget claim by counterexample and attributed the
        overclaim to this defect, then stated in its own
        what_this_does_not_establish that it does not touch
        EXP-WESOVOW-001/cost_model.py at its source and that the code defect
        remains uncorrected there. A defect left at its source keeps
        regenerating derived claims. Item 3's numeric answer, by contrast, was
        already computed twice by the Validator and is recorded in this goal's
        head; item 1's own committed record states that no uncertainty remains
        about WHAT is missing, only about WHEN it is filed.

    - id: R2
      claim: >-
        On reading, the defect appears broader than one mis-stated line, which
        raises the expected information gain further. This is recorded as a
        Coordinator reading to be independently rechecked, NOT as a finding.
      basis: >-
        Three committed files state the same charging law and appear not to
        agree. cost_model.py line 236 documents T_full / sqrt(min(w, M)) and
        line 270 computes log2Tw = log2Tfull - 0.5 * min(lw, log2M) +
        overhead_bits. specification.yaml declares the crossover metric w* =
        (T_full * 2^{c*sqrt(log2 p)} / T_DG)^2 capped by M, and its controls C3
        and C4 require T(w) to equal T_full for w at or above M.
        RUN-WESOVOW-001/execution_report.yaml records C4_vow_asymptote as PASS
        by construction against a formula written there as T_full * min(1,
        sqrt(M/w)), noting the cap branch is not exercised by the tested grid.
        If confirmed, a control recorded as passing describes a formula the
        code does not implement, which is a control-integrity finding of the
        class this program treats as first-class. NOTHING HERE WAS EXECUTED. No
        tool was run. The producer is instructed to re-localize independently
        and to report this reading refuted if that is what it finds.

    - id: R3
      claim: >-
        Item 3 is NOT selected and is NOT closed. It stays queued with a
        strictly better basis after this batch.
      basis: >-
        Item 3 asks for the P=512 crossover rederived from
        RUN-WESOVOW-001/raw-result.json's own opt values. The selected batch
        recomputes the whole grid under exactly that anchor, so item 3's
        amendment would afterwards rest on an independently reviewed corrected
        law rather than on a run whose charging law is still wrong at source.
        Filing item 3 first would have produced an amendment liable to
        immediate supersession. This batch does not file that amendment and
        does not lift the P=512 prohibition.

    - id: R4
      claim: >-
        The CORR-20260808-ea85c0 retraction applies to the CLOSEOUT's item 3,
        not to the head's item 3, and no closed work is re-queued.
      basis: >-
        Determined from the correction record itself rather than from the
        head's summary of it. CORR-20260808-ea85c0's own corrects list names
        two targets by path and position: DEC-20260808-7ed316's next_actions
        fourth item, and
        coordination/goals/GOAL-SSI-001/batches/BATCH-5a3d0a/closeout.md's Next
        action section item 3 - the analysis/SSI-ECDLP-SYNTHESIS-20260803.md
        comfortable-margins sentence. The closeout lists four items, its item 4
        being the P=512 anchor ambiguity marked there as new and surfaced by
        the Validator; the head lists three, having dropped the retracted one,
        so the closeout's item 4 became the head's item 3. The two numberings
        differ by exactly that removal. The head's item 3, the one this
        decision leaves queued, is therefore not the retracted item.

    - id: R5
      claim: >-
        The line addresses used to name the optional fourth item have drifted
        and must be re-anchored to content before that item is ever selected.
      basis: >-
        Exact search, stated per the standing absence-claim rule: Grep, pattern
        comfortable, single file analysis/SSI-ECDLP-SYNTHESIS-20260803.md,
        output mode content with line numbers, whole-file scope, no line-scoped
        filtering. Result: two matches, at lines 191 and 231; zero at line 171.
        Line 231 is the Section 3 GOAL-P13-001 sentence the optional fourth
        item targets; line 191 sits inside the Section 2 addendum
        DEC-20260808-0de8b2 added, which shifted the addresses by about sixty
        lines. Both the head and CORR-20260808-ea85c0 address that file at line
        171. This does not disturb R4, which rests on the correction's corrects
        list, addressing records by path and item position rather than by line.

    - id: R6
      claim: >-
        The frozen contract and the committed run are read-only for this batch,
        so correcting at source means a reviewed localization plus a corrected
        reference implementation held outside the experiment directory - not an
        in-place code edit.
      basis: >-
        experiments/EXP-WESOVOW-001/cost_model.py is the executed code artifact
        of a committed run and is named in that contract's own
        required_artifacts. Editing it in place would invalidate
        RUN-WESOVOW-001's reproducibility while the run record continued to
        assert otherwise, which is what AGENTS.md rule 4 exists to prevent. The
        contract is also approved and frozen, so its declared crossover metric
        cannot be restated without a versioned protocol_amendment. A superseding
        contract carrying the corrected law, and a new run under it, are named
        as successor work and are explicitly out of scope here.

    - id: R7
      claim: >-
        The head's dispatch precondition is carried unchanged into the new
        batch and is not waived by pointing dispatch_queue_path at it.
      basis: >-
        The head requires that the four BATCH-284f63 and BATCH-b3c87f archive
