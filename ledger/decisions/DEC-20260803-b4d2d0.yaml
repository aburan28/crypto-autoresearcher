coordinator_decision:
  id: DEC-20260803-b4d2d0
  goal_id: GOAL-MLKEM-003
  batch_id: BATCH-015
  evidence_id: EV-MLKEM-ce1884
  recorded_by_task: TASK-20260803-8e8a07
  archive_kind: ledger
  recorded_at: '2026-08-03'
  decision: refine
  decision_label: anom5_dissolved_floor_theorem_corrected_coordinator_confirmation_was_blind

  context: >-
    BATCH-015 investigated ANOM-5, the last unexplained measured effect open in
    this goal, and archived per-model residuals. TASK-20260803-d9afbd produced
    both, snapshot-archived at 18e6679b. TASK-20260803-a395a3 returned
    ADMISSIBLE_WITH_DEFECTS after recomputing Job A from an implementation
    importing nothing from the producer's or BATCH-012/014's code.

  central_adjudication: >-
    ANOM-5 DISSOLVES, THE ARGUMENT THAT DISSOLVES IT IS OVER-STATED, AND MY
    CONFIRMATION OF IT WAS BLIND IN EXACTLY THE SAME PLACE. The substance is
    right: a finite-iteration statistic at occupancy 0.739 cannot be measured
    against the Poisson point 1.0, the admissible floor is 0.9183, and the
    residue is about -1.5 sd rather than -2.4. But the claim "under ANY
    independent-iteration model" is false -- the final step needs
    sum p_i^2 <= mu^2/N and Cauchy-Schwarz gives the opposite -- and the
    validator produced a counterexample returning phi = 0.00433, some 2300 sd
    below the floor. The theorem needs IDENTICAL DISTRIBUTION. My snapshot
    receipt recorded a Coordinator re-derivation as confirming the general claim;
    that re-derivation silently assumed identical per-iteration means when
    summing and therefore could not have caught the error it existed to catch.
    `refine`: keep the number, fix the quantifier, and record that the
    confirmation was worthless.

  what_is_established:
    - >-
      ANOM-5 is the estimator's null object, not its arithmetic and not the file
      format. Residue -1.4 to -1.6 sd across two independent instruments, which
      is not an effect.
    - >-
      Under i.i.d. iterations the floor mean_T(1 - mu_T/N) is the EXACT minimum,
      confirmed by an independently derived minimum-variance two-point law whose
      null mean lands on the analytic floor.
    - >-
      The deep-tail Poisson null is untouched and BATCH-014's T-1 stands,
      verified both unbinned and under BATCH-014's own coarser binning.
    - >-
      Format excluded decisively and estimator arithmetic excluded to a
      bit-for-bit third implementation.
    - >-
      BATCH-012's flagged deep-tail rows are now reconstructible to 2.6e-10 bits
      and the flags were correct.

  what_is_corrected:
    - >-
      THE FLOOR THEOREM'S QUANTIFIER. "Any independent-iteration model" becomes
      "any independent and IDENTICALLY DISTRIBUTED iteration model". The
      distinction is not pedantic: without identical distribution the floor is
      false by 2300 sd. Identical distribution is supported by the file header
      and already assumed by the pooled-rate estimator, but it is an ASSUMPTION
      and the archive contains no per-iteration data to verify it.
    - >-
      MY OWN CONFIRMATION. The BATCH-015 snapshot receipt claims a Coordinator
      re-derivation confirmed the inequality. It confirmed the parts that were
      already right and inherited the assumption that was wrong. A check that
      shares the claim's blind spot is not a check.
    - >-
      JOB B'S INFERENCE, AND THE CORRECTION IS STRONGER THAN WHAT I PROMOTED. I
      recorded that "the deep tail sits below its floor" is a property of the
      whole-band-fitted normalisation. The validator decomposed rms into bias
      plus centred scatter and found the two fits' M1a residuals differ by a
      RIGID CONSTANT: centred scatter over floor is 0.5656 under both fits, and
      likewise unchanged for M4 and SENS. Only M1 and M3, whose shape parameters
      moved, differ. So the fit-dependence is a normalisation bias and the
      scatter deficit is fit-INDEPENDENT for four of six models -- and with O(1)
      degrees of freedom neither 0.57 nor 2.39 is resolved from 1.0. The honest
      statement is "UNRESOLVED UNDER BOTH FITS".
    - >-
      M-a4's testability. A uniform variance-scaling version is excluded at +3.10
      and +3.21 sd using numbers already in the producer's own results.json; only
      the general non-uniform mechanism is untestable.

  weighing_of_the_review: >-
    Accepted in full.
    (1) D-1 IS THE MOST VALUABLE FINDING IN THIS BATCH AND IT IS AGAINST BOTH THE
    PRODUCER AND ME. The validator did not merely object to the quantifier; it
    built a counterexample and ran it through its own instrument to get a number.
    That is what distinguishes a checkable objection from a complaint.
    (2) D-4 IS THE SECOND TIME IN THREE BATCHES THAT A DECOMPOSITION CHANGED A
    CONCLUSION I HAD ALREADY WRITTEN. Separating bias from centred scatter is
    cheap and I did not think to ask for it.
    (3) THE VALIDATOR ARGUED AGAINST ITS OWN CONVENIENCE TWICE: it confirmed the
    producer's central finding plainly when it could have leant on D-1 to
    unsettle everything, and it found M-a4 partly testable, which ADDS work
    rather than closing it.
    (4) U-6 IS CORRECTLY DEFLATED. The new n=50 over-dispersion is real
    arithmetic, but the admissible set is unbounded above, a mechanism already
    exists, and p is about 0.15 after multiplicity. It is recorded and not
    escalated.
    (5) U-10 CONFIRMS A SECOND CONGENIAL CONTROL WAS DEGENERATE, by
    reimplementation rather than by reading. Two in two batches.

  hypothesis_status_changes: []
  hypothesis_status_note: >-
    No hypothesis moves. Dissolving an anomaly in this program's own estimator
    carries no transition about the subject matter.

  rule_12_status: >-
    UNMET AND UNWAIVED. Nothing here changes EV-MLKEM-011, EV-MLKEM-013 or
    EV-MLKEM-017; KN-FIND-031 stays withdrawn.

  binding_instructions_updated:
    - >-
      Existing bindings stand: no whole-band ratio without its effective degrees
      of freedom; do not quote a specific dof value; read a congenial control's
      code before summarising it.
    - >-
      NEW: a Coordinator re-derivation that reaches the same conclusion by the
      same route is not an independent check and must not be recorded as one.
      State which STEP was checked, not that the result was confirmed.
    - >-
      NEW: when a fit-dependence is claimed, decompose rms into bias and centred
      scatter before drawing the inference. D-4 shows the two answer different
      questions.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      `refine` on `preliminary` evidence fails the gate. The batch's most
      transferable content -- that a dispersion statistic on a finite-iteration
      sum must be referenced to its occupancy floor rather than to Poisson 1.0,
      and that the floor requires identical distribution and not merely
      independence -- is a genuine methodological rule with a worked
      counterexample, and it is exactly one investigation and one validation old
      in a goal that has now recorded five Coordinator errors. Promoting it here
      would repeat CORR-20260802-d8ba0e a third time.
    promote: false

  non_claims:
    - ML-KEM is not broken.
    - KN-OPEN-016 remains open.
    - >-
      Nothing here says the archived data is defective. The format is exonerated
      decisively and the residue is unresolved, not attributed.
    - >-
      Approximation 4.9 is neither validated nor refuted; this batch measured an
      instrument.
    - No asymptotic claim advanced. No closure quorum asserted.

  next_actions:
    - >-
      BATCH-016, zero new sampling: red-team this batch. It has had one
      investigation and one validation and no adversarial pass, and it carries a
      corrected theorem, a materially changed inference on BATCH-012's table, and
      an unresolved -1.5 sd residue with a +0.104 lag-1 autocorrelation. Target
      the i.i.d. assumption itself -- the header supports it and the estimator
      assumes it, but no per-iteration data exists to verify it, so the whole
      floor rests on an unverified hypothesis. Also require the red team to state
      whether this goal's mid-band lane is now exhausted at 301 bins, since
      resolving the residue to 3 sd would need roughly 1321 to 1488.

