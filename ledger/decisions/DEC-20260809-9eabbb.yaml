coordinator_decision:
  id: DEC-20260809-9eabbb
  goal_id: GOAL-SSI-001
  batch_id: BATCH-6c960d
  recorded_by_task: TASK-20260809-0c65c9
  archived_by: TASK-20260809-0c65c9

  context: >-
    BATCH-6c960d created an additive successor to EXP-SSI-2d8583 after the
    BATCH-4f52ab Validator and Red Team identified quantifier, representation,
    fiber, control, cost, and path defects. Fresh independent Validator and Red
    Team sessions reviewed the immutable successor snapshot. Neither executed
    the experiment or its diagnostics.

  decision: refine

  decision_scope: >-
    Retain EXP-SSI-1d0f36 as a materially improved design candidate and open a
    further additive refinement. This decision does not approve or freeze the
    contract, authorize execution, change hypothesis or experiment status, or
    make any SSI, SQIsign, attack, security, novelty, or exponent claim.

  target_ids:
    - IDEA-20260806-9c2f80
    - EXP-SSI-2d8583
    - EXP-SSI-1d0f36
    - GOAL-SSI-001

  evidence_ids:
    - EV-SSI-323324
  review_ids:
    - VAL-20260809-9f5850
    - TASK-20260809-950724
  review_task_ids:
    - TASK-20260809-9f5850
    - TASK-20260809-950724
  snapshot_commit: e17eeccdf5870580c9b87fc2a29d66d5ef4dfb72

  rationale:
    design_progress:
      basis: >-
        The successor explicitly separates fixed A_p/worst-case-E semantics
        from random-set diagnostics, splits order-tagged and membership-only B,
        defines an output-producing unique fiber union, adds H-ADV-4 and its
        C-only pair null, demotes the nearby comparison to non-gating, uses
        exact rational labels, charges build/query/physical axes, and corrects
        the catalogue path.
    independent_validation:
      basis: >-
        VAL-20260809-9f5850 independently verified the snapshot and every
        named prior repair, returning CONCUR_WITH_CAVEAT. It marked the
        contract incomplete for execution because finite-size tolerances and
        B's theta-to-sigma mapping remain open.
    independent_red_team:
      basis: >-
        TASK-20260809-950724 independently attacked the repaired semantics and
        found additional underdefinition in T_q, seed/zero-success behavior,
        typed byte widths, C pair generation, shared-index fibers, null/shuffle
        semantic paths, retained-versus-attempted build accounting, Q, and
        exact-prime finite-size evaluation. It returned CONCUR_WITH_CAVEAT for
        the design boundary.
    execution_authorization:
      granted: false
      reason: >-
        The controls and cost model are not yet reproducible enough for a
        freeze or execution. In particular, a validity_tag=0 null or shuffled
        identity rejection could fail before exercising the treatment semantic
        path. Exact finite primes, acceptance statistics, tolerances, branch
        schemas, and shared-byte fiber semantics must be pinned first.
    claim_boundary:
      basis: >-
        No measurement, run, attack, security, exponent, novelty, hypothesis
        transition, or goal completion follows from either review.

  official_research_state_changed: false
  hypothesis_status_transition: none
  experiment_status_transition:
    - id: EXP-SSI-1d0f36
      from: review_required
      to: review_required
      note: >-
        The successor remains review_required, unfrozen, execution_authorized:
        false, and evidence_eligible: false. This is a refinement decision only.

  asymptotic_promotion_gates:
    gate_1_proof_decomposition: open
    gate_2_numbered_heuristics: open
    gate_3_concrete_cost_table: open
    gate_4_independent_review_and_red_team: >-
      Passed only for this design-boundary review. It does not pass an
      asymptotic, breakthrough, or security promotion gate.
    note: >-
      The candidate remains conditional and unexecuted; no formula is promoted
      from prediction to observation.

  next_actions:
    - >-
      Open an additive refinement batch for IDEA-20260806-9c2f80 that pins a
      finite prime/vertex encoding convention, defines T_q including zero-
      success and seed semantics, specifies complete A/B/C byte schemas and
      B-theta-to-sigma mapping, reconciles shared indexes with R_t(A), and
      replaces validity-tag/identity-rejection nulls with semantic-path-
      equivalent controls carrying pre-registered sample counts, statistics,
      tolerances, and seeds. Snapshot before fresh independent review.
    - >-
      Keep EXP-SSI-1d0f36 and EXP-SSI-2d8583 unapproved, unfrozen, and
      unexecuted. Do not infer a security result from EV-SSI-59f7a2 or its
      model-dependent 2^{120-123} bracket.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This batch measured nothing and promotes no technique, theorem, attack,
      exponent, security conclusion, or knowledge item.

  claim_ceiling: >-
    The strongest true statement is that EXP-SSI-1d0f36 materially repairs the
    prior design boundary but remains underdefined for execution. This is not
    evidence about the SSI problem or any deployed security level.

  decided_by:
    task: TASK-20260809-0c65c9
    role: coordinator
    policy: coordinator-orchestration-code
  decided_at: '2026-08-09'
