coordinator_decision:
  id: DEC-20260830-c7fa5d
  context: >-
    This Coordinator decision composes the independent Validator (J1) and
    Red Team (J2) reviews of EXP-MONO-a20e48's execution: a toy-scale
    (p=211), six-object base-change-ladder battery over F_{p^k} (k=1..4)
    testing H-MONO-59f6a6's claim that this instrument can separate
    arithmetic from geometric monodromy, and correctly refuses to overclaim
    fullness when no independent structural lower bound is available. It is
    the third and structurally different record in this session's
    RQ-MONO-001 work, sibling to H-MONO-0b3def (supported: decided the m=3
    symmetric-base cover's arithmetic group is D_4) and H-MONO-0f9170
    (supported: decided the exact (p,t,Z)-completeness of that cover's
    stratum counts). This record instead asks whether the fixed-F_p census
    method those two records used is even capable, in general, of
    certifying GEOMETRIC monodromy — and names, as its own most
    consequential possible outcome, whether N1 (that same m=3 cover) would
    be observed to drop across the ladder. It was not observed to drop.
  decision: support
  decision_label: >-
    base_change_ladder_protocol_supported_toy_scale_n1_no_drop_confirmed_general_witness_weakness_named
  target_ids:
    - H-MONO-59f6a6
    - EXP-MONO-a20e48
    - RQ-MONO-001
    - EV-MONO-e9fcef
    - H-MONO-0b3def
    - H-MONO-0f9170
    - EXP-MONO-4c7479
    - IDEA-20260830-8a767e
    - KN-FIND-a8990a
  rationale:
    - >-
      CLAIM SUPPORTED, INDEPENDENTLY RE-DERIVED, NO DISSENT. Both
      reviewers independently re-derived every one of the hypothesis's six
      pre-registered predictions from raw per-point/per-draw data using
      verification code sharing no lines with the Executor's
      implementation, and both return `holds`. N1 held at R_k=8 with no
      drop at any k=1..4 in either run; N2 showed the exact forced
      period-2 contrast (4,2,4,2); N2-twin held constant at 4; N4 reached
      the exact forced period-3 sequence (3,3,1,3); N5 returned UNDECIDED
      at every k, confirmed hardcoded rather than density-derived; the
      sample-size and labelling controls both confirmed. The Validator's
      third, wholly independent implementation of N1's classifier
      (spot-checked on 10 points spanning all five outcome classes) and
      the Red Team's independent raw-data reconstruction of N1/N2/
      N2-twin/N4's R_k sequences together rule out a shared-bug
      explanation for the clean sweep.
    - >-
      THE MOST CONSEQUENTIAL POSSIBLE OUTCOME, NAMED IN ADVANCE, DID NOT
      OCCUR. H-MONO-59f6a6 named an N1 drop as the single most
      consequential possible result of this record — a genuine drop would
      have contradicted H-MONO-0b3def STEP 4 and KN-FIND-a8990a Theorem
      A's arithmetic-equals-geometric clause, requiring escalation before
      any status change. No drop occurred, and both reviewers independently
      confirmed this from raw data using methods that would have caught a
      broken protocol producing a false "no drop" reading (see next
      finding). This corroborates, without proving, H-MONO-0b3def's
      already-derived conclusion for N1; it does not touch that record's
      status (Coordinator authority alone, AGENTS.md rule 1; the proof
      remains the derivation, not this census).
    - >-
      SAMPLING RISK IS NOT THE OPERATIVE UNCERTAINTY FOR N1'S HEADLINE
      RESULT — BOTH REVIEWERS AGREE THIS IS EXISTENCE-PROOF-GRADE
      EVIDENCE. Both independently computed the coupon-collector
      false-negative probability at the pre-registered S=10,000 as
      astronomically small (~10^-580 for N1's order-8 group), far below
      HEUR-AG-2's own conservative floor — a real drop cannot be masked by
      unlucky sampling, since a smaller true arithmetic group
      deterministically caps closure below U. The correctness question
      that remains is field-arithmetic correctness, addressed by the next
      two findings.
    - >-
      A REAL, GENERAL METHODOLOGICAL WEAK POINT WAS IDENTIFIED AND
      RESOLVED FOR THIS RUN, BUT NOT FOR THE PROTOCOL IN GENERAL. The Red
      Team constructed a maximally-broken `tower.Level2.frob` (identity
      map) and showed it does NOT crash: the `four_cycle` stratum
      silently vanishes, yet the surviving generators still close to the
      full order-8 D_4 group by composition, because two reflections from
      distinct conjugacy classes already generate the whole group. A
      record reporting only closure order and the labelling control could
      not distinguish this broken run from the real one. THE ACTUAL
      ARCHIVED RUN IS INDEPENDENTLY CONFIRMED UNAFFECTED: both reviewers
      verified from raw per-point logs that `four_cycle` is genuinely
      present with structurally-plausible, nonzero density at every k
      (exact match to EXP-MONO-4c7479's own committed histogram at k=1).
      The general lesson — that closure-order-alone is an insufficient
      correctness witness for a multi-generator group — is named below as
      a required control for future records in this family, not silently
      absorbed.
    - >-
      DISCLOSURE-PRECISION GAP ON THE PRE-RUN BUG CATCH, FOUND
      INDEPENDENTLY BY BOTH REVIEWERS. `implementation.md`'s claim of "the
      required ring-homomorphism self-test" catching a pre-run Frobenius-
      exponent defect is not literally accurate: no such dedicated test
      exists in the committed implementation, and `tower.py`'s git
      history contains only the already-corrected version, so the
      narrative cannot be corroborated from the archive. Both reviewers
      independently reconstructed the disclosed bug and confirmed it
      produces a loud, uncaught crash on real data (not a silent wrong
      value) — mechanistically consistent with, though not proof of, the
      disclosed account. This is a disclosure-precision finding, not a
      correctness finding: the code that actually ran is independently
      verified correct at all four ladder steps.
    - >-
      NOVELTY AND SCOPE CORRECTLY CALIBRATED. This is an instrument/
      protocol validation record, not a new mathematical result about any
      curve family; it is orthogonal to, and does not dominate or get
      dominated by, H-MONO-0b3def or H-MONO-0f9170 (`sota_delta: 0`,
      `dominated_by: not_applicable`). The N5 scoping-down (literal
      degree-100 object to a generic quintic, disclosed via a Lagrange's-
      theorem feasibility argument) preserves the functional test purpose
      and is confirmed, by both reviewers, never to have been used to
      smuggle a DECIDED verdict past the forced UNDECIDED discipline.
    - >-
      DISPOSITION. H-MONO-59f6a6's status moves to `supported`, scoped
      exactly to p=211, the six frozen battery objects, k<=4, two
      replication runs. This does not touch H-MONO-0b3def, H-MONO-0f9170,
      KN-FIND-a8990a, RQ-MONO-001, or GOAL-MONO-001 (which remains
      `paused`; this experiment drew on no part of its campaign budget,
      per the same standalone-approval reasoning already established for
      EXP-MONO-4c7479 and EXP-MONO-2a13d7).
  evidence_refs:
    - EV-MONO-e9fcef
    - experiments/EXP-MONO-a20e48/execution_report.yaml
    - experiments/EXP-MONO-a20e48/reviews/validator/validation-report.yaml
    - experiments/EXP-MONO-a20e48/reviews/red-team/red-team-report.yaml
    - coordination/tasks/TASK-20260830-cfbb85/snapshot-receipt.json
    - ledger/hypotheses/H-MONO-0b3def.yaml
    - knowledge/findings/KN-FIND-a8990a.md
  official_status_changes:
    goal_status_changed: false
    goal_status_after: paused
    hypothesis_status_changes:
      - hypothesis_id: H-MONO-59f6a6
        prior_status: proposed
        new_status: supported
        scope: >-
          Scoped exactly to p=211, the six frozen battery objects
          (N1, N2, N2-twin, N3, N4, N5), k<=4, two replication runs. The
          general closure-order-witness weakness identified by the Red
          Team is a named forward-looking design lesson, not a falsifier
          or a scope limitation on this record's own tested objects (both
          reviewers independently confirmed the actual run unaffected).
    experiment_status_changes:
      - experiment_id: EXP-MONO-a20e48
        prior_status: approved
        new_status: completed
    resource_disposition_changed: false
    completion_criteria_met: []
    completion_criteria_note: >-
      RQ-MONO-001 and GOAL-MONO-001 are not closed or advanced by this
      decision; it resolves one instrument/protocol hypothesis at toy
      scale only.
    implementation_authorized: false
    experiment_runs_authorized: 0
    scientific_interpretation_authorized: true
    scientific_interpretation_scope: >-
      Exactly the scoped support stated above; no ECDLP, relation-rate, or
      m>=4 claim; no status change to H-MONO-0b3def or H-MONO-0f9170.
    closure_authorized: false
    breakthrough_authorized: false
  disclosed_open_items:
    - id: CLOSURE-ORDER-WITNESS-STRENGTHENING-FOLLOWUP
      description: >-
        Retrofit a class-coverage assertion (all forced conjugacy
        classes/strata observed with nonzero count, not just closure
        order == U) as a standard required control for any future record
        in this family claiming a generated-subgroup order on a group
        where closure could be reached from a strict subset of the true
        generating classes (D4, S4, S5, and any group with more than one
        "layer" of field-extension lift), per the Red Team's
        `next_concrete_action`. Not performed here: the actual archived
        run is independently confirmed unaffected by the specific
        constructed failure mode, so this is a forward-looking process
        improvement, not a correction to this record.
      carried_forward_to: >-
        Any future amendment or successor experiment working with a
        multi-generator monodromy group in this lane.
      does_not_block: H-MONO-59f6a6's supported status at its current scope
    - id: PRE-RUN-BUG-SELF-TEST-ARTIFACT-FOLLOWUP
      description: >-
        Require the self-test script and its failing-then-passing
        transcript as a named `required_artifact` whenever a future record
        discloses a "bug caught before an official run," exactly as this
        contract's own m_k(x) search transcript and Frobenius-two-ways
        cross-check already are for other components. The
        frobenius_two_ways_cross_check preserved in this run's Stage-0
        only ever exercised `fieldext.FpK` (level-0 fields), never
        `tower.Level1`/`Level2` — exactly where the disclosed bug lived —
        a real coverage gap in this contract's own required self-checks,
        independent of whether the specific disclosed bug is true as
        narrated.
      carried_forward_to: >-
        Any future amendment to this contract's Stage-0 self-check
        requirements, or a template addition to the executor role
        contract for disclosing pre-run bug fixes.
      does_not_block: H-MONO-59f6a6's supported status at its current scope
    - id: LABELLING-CONTROL-RAW-LOG-RETENTION-FOLLOWUP
      description: >-
        The labelling control's per-point raw logs were not retained by
        design; a future amendment could retain them at negligible
        additional cost, letting this one primary control be independently
        re-derived like every other rather than taken on the Executor's
        summary alone.
      carried_forward_to: any future amendment to this contract or a successor
      does_not_block: H-MONO-59f6a6's supported status at its current scope
  procedure_deviations: []
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is an instrument/protocol validation on a frozen toy battery,
      not a new mathematical result about any curve family; its own
      `asymptotic_claim` and `dominated_by` are explicitly null/
      not_applicable. The one durable, reusable methodological insight —
      closure-order-alone as an insufficient witness for a multi-generator
      group's monodromy — is recorded in this decision's
      `disclosed_open_items` as a concrete process follow-up rather than
      authored as a `KN-TECH-*`/`KN-FIND-*` entry now; a future
      `/curate-knowledge` pass may promote it once the retrofit named above
      has been applied to at least one successor record, giving it more
      than a single-instance basis.
  limitations:
    - >-
      Toy scale only. p=211, six frozen battery objects, degrees at most
      5, groups of order at most 120. No claim about cryptographic scale,
      any other prime, or any object outside the battery.
    - >-
      The closure-order-witness weakness is real and general, though not
      exercised by this specific run; see `disclosed_open_items`.
    - >-
      The pre-run bug-fix narrative has no surviving git artifact; both
      reviewers found it mechanistically plausible but not independently
      verifiable from the archive alone.
    - >-
      Both reviewers disclose the same unresolved model-identity
      discrepancy noted for the two sibling experiments this session
      (self-reported claude-sonnet-5, neither probe-verified). Not
      resolved by this decision.
  inference:
