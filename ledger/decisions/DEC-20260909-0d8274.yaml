coordinator_decision:
  id: DEC-20260909-0d8274
  id_allocation_provenance: >-
    Token pre-minted and verified free on origin/main by the
    orchestrating session before this design (2026-09-09) and relayed in
    the design instruction for IDEA-20260906-ac100b. Not derived by
    scanning state. The handoff identifier TASK-20260909-2989a0 and the
    snapshot-archive identifier TASK-20260909-b95f26 were pre-minted and
    verified free the same way; the coordinator minted nothing and
    grepped for nothing.
  recorded_at: '2026-09-09'
  goal_id: null
  question_id: RQ-ECDLP-78dbc5
  batch_id: null
  batch_id_note: >-
    Standalone design task in worktree
    /Volumes/SSD990/llm/tmp/opencode/design-ecdlp-20260909, not a goal
    batch: no batch id, no dispatch queue, no task card. The RQ is
    RQ-ECDLP-78dbc5 (the lane of GOAL-ECDLP-bbc21f), but this design
    writes no goal-head field and opens no batch.
  context: >-
    Coordinator verdict ses_f7c589781ffeGfc3ONOpFH2U7b (2026-09-09)
    decided the class of the (B1)-(B3) closed forms of
    IDEA-20260906-aed829, carried as a proof-shaped claim in
    IDEA-20260906-ac100b: OTHER -- VERIFICATION-PROTOCOL for a
    derivation artifact, never a theorem and never labelled "proved".
    Three stages: Stage 0 a zero-compute independent validator audit of
    Lemmas 1-6 (hard gate on the ceiling claim); Stage 1 minutes-scale
    quadrature table with the committed anchor values as digit-for-digit
    fixture, a permutation nearby-object control, a proves-too-much
    non-uniform-rule control, and one exact-basin array pass at N = 2^26
    (no committed run exists at 2^26, verified by search of the committed
    runs on 2026-09-09); Stage 2 read-only re-read of the committed
    exact-enumeration residuals (EXP-ECDLP-869870 at N in {2^20, 2^22,
    2^24}, EXP-ECDLP-612fb1 anchor values) with the N^{-1/3} decay check
    and the 15% decidable-negative band at 2^26. This design produced:
    H-ECDLP-f2bdd0 (status specified), EXP-ECDLP-e962f6 (designed at
    version 1, committed at status review_required with approved_by
    null, then approved by this decision), and the executor handoff
    TASK-20260909-2989a0 (Stages 1-2 only). No run exists under the
    contract.
  decision: approve_experiment
  decision_rationale_for_verb: >-
    Marks the frozen contract EXP-ECDLP-e962f6 APPROVED (status approved,
    approved_by coordinator, frozen true, execution_authorized true;
    version 1) and binds the executor handoff TASK-20260909-2989a0,
    discharging the design task's approval gate. The gate's
    user-confirmation requirement (design-experiment skill step 4) is met
    by the standing user authorization of 2026-09-06 ("all is approved.
    ideas/experiments should be always approved"), which AGENTS.md
    records as superseding per-experiment user selection; the design
    verdict itself (class, stages, decidable negative) is the
    Coordinator's own recorded decision ses_f7c589781ffeGfc3ONOpFH2U7b,
    not a user selection. The verb is approve_experiment: the protocol is
    complete (controls, metrics, budgets, stopping rules, artifact
    paths, dependencies, inference policy and committed handoff all
    present) and no revision direction was given. This decision
    authorizes execution of Stages 1-2 and nothing else: it changes no
    hypothesis status, promotes no finding, produces no evidence, and
    does not make the ceiling claim citable -- that waits on the Stage 0
    validator audit, which is a separate reserved validator task
    dispatched after the snapshot archive TASK-20260909-b95f26.
  target_ids:
    - EXP-ECDLP-e962f6
    - H-ECDLP-f2bdd0
    - TASK-20260909-2989a0
    - TASK-20260909-b95f26
    - RQ-ECDLP-78dbc5
  user_confirmation_record:
    obtained_at: '2026-09-06'
    obtained_via: >-
      Standing user authorization recorded in AGENTS.md ("Standing user
      authorization for ideas and experiments", 2026-09-06): "all is
      approved. ideas/experiments should be always approved". No
      per-experiment user selection was requested or needed for this
      contract; the design verdict is the Coordinator's own recorded
      decision ses_f7c589781ffeGfc3ONOpFH2U7b.
    question_presented: null
    presentation_included: null
    options_offered: null
    answer_verbatim: null
    reaffirmation: null
    answer_meaning: >-
      Approve EXP-ECDLP-e962f6 as frozen at version 1 and bind the
      executor handoff TASK-20260909-2989a0 (Stages 1-2 only); the Stage 0
      validator audit follows separately after the snapshot archive. No
      contract was declined and no revision direction was given, so no
      `revise` branch is recorded.
  gate_field_scope: >-
    Exactly FIVE fields of the specification change and nothing else:
    status (review_required -> approved), approved_by (null ->
    coordinator), frozen (false -> true), execution_authorized (false ->
    true), and approval_note (the "DESIGNED, NOT APPROVED ..." note
    superseded by the approval record, its original text preserved
    verbatim inside the new note). `version` stays 1. Every protocol
    field (stage_plan, inputs, controls, independent_variables, metrics,
    preregistered_prediction, scale_relevance, tail_checks, replication,
    seed_policy, budget, stopping_rules, invalidation_rules,
    success_criterion, falsification_criterion, required_artifacts,
    cost_model, interpretation, review_note) is byte-identical to the
    designed contract.
  approved_contract_binding: >-
    The approved protocol is
    experiments/EXP-ECDLP-e962f6/specification.yaml at version 1 in
    worktree /Volumes/SSD990/llm/tmp/opencode/design-ecdlp-20260909,
    bound to the bytes with the five gate fields named in
    gate_field_scope as the ONLY differences from the designed contract.
    This coordinator role has no shell and computed no hash: the sha256
    of the approved specification at its committed bytes is recorded by
    the Git half of the snapshot archive TASK-20260909-b95f26 in the
    ledger receipt, which research_dispatch.py verifies content-first. No
    hash is asserted in prose here. Any later protocol change requires a
    versioned protocol_amendment under
    experiments/EXP-ECDLP-e962f6/amendments/ and never an edit of the
    frozen contract; runs already executed are never re-scored.
  executor_handoff_note: >-
    TASK-20260909-2989a0 targets the executor under policy
    executor-implementation with fallback_allowed false and
    degraded_allowed false, review_required true, and the contract's
    budget envelope copied verbatim: 600 s per run, 0.5 CPU-h, 4 GB, 8
    runs, one worker (7 planned runs with 1 spare for a recorded
    infrastructure re-run). Scope per the handoff: Stages 1-2 ONLY --
    RUN-001 quadrature (deterministic), RUN-002 the N = 2^26 exact-basin
    anchor, RUN-003/004/005 the permutation nearby-object control at
    N = 2^20 seeds 1-3, RUN-006 the proves-too-much non-uniform-rule
    control at N = 2^20 seed 1, RUN-007 the Stage 2 read-only residual
    re-read -- plus the derivation document with per-lemma check boxes.
    Stage 0 (the validator audit) is NOT part of this handoff: it is a
    separate reserved validator task (review-adversarial, independent
    session) dispatched after the snapshot archive, with a review_plan
    written by the Coordinator before the validator runs. Completion gate
    for the handoff: every run carries the full artifact-policy manifest;
    RUN-001's anchor reproduction is reported before any other Stage 1
    number is interpreted; RUN-007's read-only guarantee is verified
    (sha256 match on every committed file read); a timeout, crash or
    dependency failure is failed_infrastructure and never a result. The
    Executor interprets nothing and changes no status.
  rationale:
    - >-
      The gate condition is satisfied by the standing user authorization
      of 2026-09-06, which AGENTS.md records as superseding per-experiment
      user selection; the design verdict (class OTHER --
      VERIFICATION-PROTOCOL, the three stages, the decidable negative) is
      the Coordinator's own recorded decision ses_f7c589781ffeGfc3ONOpFH2U7b,
      so nothing in this approval rests on an unrecorded in-session word.
    - >-
      The contract carries a decidable success criterion (S1-S7) with a
      matching falsification branch (F1-F5), F1 being the verdict's
      decidable negative verbatim (|R(2^26)| > 0.15 with the residuals
      not shrinking as N^{-1/3}, or a validator exhibiting a stored set
      beating C_max(a)(1+o(1)) under H1, withdraws the ceiling and
      replaces it with the exact enumeration); the four controls
      (independent re-derivation per lemma, permutation nearby-object,
      exact-enumeration anchor, proves-too-much) plus the N-decay control
      are frozen before compute is spent.
    - >-
      The compute is minutes-scale and exists to check the derivation,
      never the other way round: the quadrature reproduces the committed
      anchor values digit-for-digit (5e-5), the 2^26 anchor is one array
      pass (about 1.3 GB, minutes), the permutation and non-uniform
      objects are seconds each at 2^20, and Stage 2 is read-only. The
      ceiling claim is gated on the Stage 0 audit (hard gate), so this
      approval cannot produce a citable ceiling without independent
      review.
    - >-
      Every handoff budget field is non-null and copied verbatim from the
      contract; the review chain (snapshot archive TASK-20260909-b95f26,
      then the reserved Stage 0 validator audit, then a Coordinator
      ledger archive) is reserved with identifiers before any run exists,
      so the execution cannot skip independent review by omission.
  evidence_refs:
    - ledger/questions/RQ-ECDLP-78dbc5.yaml
    - ledger/hypotheses/H-ECDLP-f2bdd0.yaml
    - experiments/EXP-ECDLP-e962f6/specification.yaml
    - ledger/proposals/IDEA-20260906-ac100b.yaml
    - ledger/proposals/IDEA-20260906-aed829.yaml
    - ledger/handoffs/TASK-20260909-2989a0.yaml
    - experiments/EXP-ECDLP-869870/runs/RUN-ECDLP-869870-011-N24-s1/summary.json
    - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-002/summary.json
    - knowledge/literature/KN-LIT-013.md
    - ledger/decisions/DEC-20260906-2b1387.yaml
  limitations:
    - >-
      No run exists under the contract. Nothing in this decision is
      evidence: no measurement, no constant, no confidence interval, no
      certificate. It authorizes execution of Stages 1-2 only.
    - >-
      H-ECDLP-f2bdd0 stays `specified`. No hypothesis status moves here,
      and none may move until the execution's snapshot archive, the Stage
      0 validator audit and a Coordinator ledger archive with evidence
      records have completed and been verified.
    - >-
      Claim tier is toy: the tested objects are uniformly random
      functions and permutations at N in {2^20, 2^22, 2^24, 2^26} (the
      committed grid extends to 2^30 sampled, which carries no exact
      top-T share and is not used for the decay check). No result
      transfers to r-adding walks (H1 only, tested by EXP-ECDLP-869870)
      or to cryptographic N without an explicit, separately tested
      transfer assumption.
    - >-
      The contract is a verification protocol for a derivation artifact
      under the KN-LIT-013 S T^2 = Omega~(eps N) ceiling. It moves no
      exponent, names no non-generic structure, solves and certifies
      nothing, and makes no attack, speedup, novelty, completion or
      breakthrough claim of any kind; the four promotion gates for
      asymptotic claims are not engaged.
    - >-
      The sha256 binding of the approved specification is not asserted in
      this record; it is recorded by the Git half of
      TASK-20260909-b95f26 in the ledger receipt, where the dispatcher
      verifies it content-first.
    - >-
      The Stage 0 validator audit is not part of this approval and has
      not happened: the ceiling claim C_max(a) is NOT citable until the
      audit completes and returns accepted or corrected (with the
      corrected error term recorded) per lemma.
  next_actions:
    - >-
      RANK 1: dispatch TASK-20260909-2989a0 (EXP-ECDLP-e962f6,
      verification Stages 1-2 ONLY: RUN-001 quadrature, RUN-002 the
      N = 2^26 anchor, RUN-003/004/005 the permutation control, RUN-006
      the proves-too-much control, RUN-007 the Stage 2 read-only
      residual re-read, plus the derivation document with per-lemma check
      boxes) under the frozen contract, in the worktree
      /Volumes/SSD990/llm/tmp/opencode/design-ecdlp-20260909, under the
      handoff's verbatim budget envelope.
    - >-
      Then the snapshot archive TASK-20260909-b95f26 ALONE, staging
      exactly the declared source, derivation, run and report paths
      before any reviewer runs.
    - >-
      Then the Stage 0 validator audit as a fresh independent validator
      session (review-adversarial, independent session) under a
      review_plan written by the Coordinator BEFORE the validator runs,
      with the Coordinator prior recorded in it; the audit's input is the
      archived derivation document.
    - >-
      Then the Coordinator ledger archive with the evidence records, the
      decision on the ceiling claim (citable as a checkable derivation
      artifact, or withdrawn per F1/F4), and any hypothesis transition --
      the first point at which H-ECDLP-f2bdd0 may leave `specified`.
  non_goals:
    - >-
      No attack, no speedup, no novelty, no exponent move, no completion
      claim, no breakthrough claim: the contract is a verification
      protocol for a derivation artifact and says so in its own text.
    - >-
      No hypothesis status change: H-ECDLP-f2bdd0 stays `specified` until
      the review chain completes.
    - >-
      No protocol amendment, no budget increase, and no later-stage
      scheduling is authorized by this decision; the deferred r = 2
      adding-walk control (named in the contract's controls block) is a
      successor control, not part of this contract.
    - >-
      No knowledge promotion: no run exists, so there is no finding to
      promote.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Approval authorizes execution only; no evidence was reviewed and no
      run exists, so there is no finding to promote. H-ECDLP-f2bdd0 stays
      `specified` until executed, independently reviewed evidence moves
      it through the research states.
