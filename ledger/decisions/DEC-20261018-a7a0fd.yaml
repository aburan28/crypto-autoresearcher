  overlap:
    EXP-DTREE-b93a15: >-
      Approved 2026-10-05 (DEC-20261005-a67fea), never run. Its bit-exact
      fix-only recomputation of the MTIC/FIB runs is this contract's repaired
      arm; this contract adds the legacy arm, a reproduction control and the
      ICINV run. EXP-DTREE-b93a15 keeps its status and bytes; its 21-row
      table may cite these runs once reviewed. Deciding whether to withdraw it
      is left to a later Coordinator decision.
  rationale:
  - The arms differ in one function bound by sha256; the archived programs, instances, seeds and caps are fixed, so the arm contrast is one-factor.
  - Running both arms concurrently in one trial gives them the same host and load, which matters because the MTIC and FIB programs measure under wall-clock caps.
  - The legacy arm against the archive is the A/A that makes environment drift (macOS arm64 to Linux x86_64, Singular 4.3.2 to 4.4.1) visible instead of attributing it to the defect.
  - The cells are the whole exposed set, so no selection can follow the results.
  evidence_refs: []
  limitations:
  - Toy tier only; no ECDLP, cost or security claim; not an improvement over any index-calculus baseline.
  - Cap-truncated counts depend on host speed; categorical outcomes are compared exactly and counts with a frozen tolerance of 2.
  - The archived programs were untracked at their run commits; their run-time bytes are tested only through the legacy-arm control.
  knowledge_promotion:
    promoted: []
    not_warranted: Approval is not evidence.
