  rationale:
    - >-
      Why (b) and why the segment slope. F7(a) settled that the decline
      reproduces generically at 12..24; the open question is whether it
      BENDS above 24 (flattening) or continues (crossing projected ~34..36
      bits). The segment slope is the sharpest discriminator at n = 200 per
      rung: F7(a) calibrated the 12..24 slope to +-0.0037 at that design, so
      a bend of >= 0.015 in the 26..32 segment is a 3-sigma-plus effect.
    - >-
      Why the replica and not the engine first. The replica is exactly
      generic by construction, so a bend (or its absence) is a property of
      the generic collision process; engine rows above 32 bits (successor
      (c)) are the more expensive confirmation and are priced only if (b)
      leaves the question open or supports flattening, exactly as
      DEC-20261001-494663 NA-3 orders ((c) only if (a)-(b) leave it open).
    - >-
      Why the power rule is fixed here. NA-3 requires it pre-registered;
      the review architecture requires the prior before the result exists.
      The sizing (n = 200/rung, the archived design), the rung order, the
      primary discriminator, the outcome branches and this Coordinator's
      expectation are all above, before any new data.
    - >-
      Machine protection. The host disk is at 100% (~5 GiB free; the F7(a)
      executor already recorded a pre-compute failure on it). The replica's
      outputs are bounded (< 50 MB); rungs run one at a time in ascending
      order; a budget stop is archived as-is with its reason.
    - >-
      Exponent bias (docs/target-result-profile.md). The floor is the
      admission gate; HEUR-cf8ca6-H3 is its open derivation step. (b) is
      the cheapest evidence that can move on whether the generic process
      itself bends above 24 bits, before any compute is spent on engine rows
      above 32 bits.

