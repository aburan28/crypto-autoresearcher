        conventions, 99% curve-bootstrap, five instances per rung per
        replicate, >= 20000 replicates, coverage reported), segment slopes,
        and the pre-registered outcome reading under the rule above.
      bounds: >-
        Wall clock 21600 s; RSS stop 2.5e9 bytes per process; launch only
        with >= 6 GB MemAvailable; one computation process at a time; rungs
        in ascending order; outputs under 50 MB under the task directory; no
