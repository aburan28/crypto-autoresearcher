  f7a_reading: >-
    Under DEC-20261002-bed082's pre-registered decision rule, branch (i)
    fired by condition A: the replica's r_rank ratio slope -0.019426
    (MC-5-calibrated 99% [-0.022747, -0.016027], 20000 replicates, seed 0)
    lies inside the engine's F7 calibrated interval [-0.0242, -0.0053].
    NARROWEST SUPPORTED SENTENCE: F7's r_rank decline reproduces on the
    exactly generic replica at 12..24 bits; the decline is the generic
    floor-attainment path, and OQ-F7 narrows toward 'T flattens at >= 1'.
    Supporting observations (all from the archived package): no per-rung 99%
    interval excludes 1 from below at m = 4 or m = 5 on-mode (lowest hi99
    1.6013 at m4/b24 frozen; three m4 frozen rungs straddle 1 with lo99
    0.96-0.99 at n = 200); the identity's decomposition holds to 3.47e-18;
    every slope component within 0.0022 of the engine's. WHAT IT DOES NOT
    SUPPORT: the asymptotic question (HEUR-cf8ca6-H3 / DN D3) stays open --
    the replica stops at 24 bits, the projection under the naive 12..24
    r_frozen slope (-0.038062) puts T_frozen(32) at about 1.05, and the
    crossing-vs-flattening discrimination at 26..32 is exactly what
    successor (b) tests. The executor's recorded defects stand as recorded
    (report.md section 6): the card's sign slip on r_rank/|F| (archive
    followed), the NULL-P -> NULL-B coverage adaptation (labelled), the
    pre-compute heredoc failure on the full disk (infrastructure note, no
    analysis command failed).

  context: >-
    F7(a) returned: the generic replica reproduces the decline. The
    discriminating signal at 26..32 bits is the SEGMENT SLOPE of log2
    T_frozen vs log2 N: flattening bends the segment toward 0 as the
    harvested share of the X^2/N budget approaches 1 (the share was 0.45 ->
    0.77 over 12..24 on the replica, EV-PFDR-d90ccd cross_joint_reading;
    about 10% headroom left at 30..32 on the engine); naive continuation
    holds the 12..24 slope (-0.038062 calibrated [-0.041782, -0.034385]) and
    projects T_frozen(32) ~ 1.05 with a crossing around 34..36 bits.
    Successor (b) is the exactly generic replica at 26, 28, 30, 32 bits --
    the red team's missing control -- sized by the power rule below. The
    archived 12..24 rows (same construction, same conventions) serve as the
    first segment, so (b) generates only the new rungs.

  power_rule_fixed_before_data: >-
    FIXED HERE, BEFORE ANY (b) DATA EXISTS. Sizing: n = 200 instances per
    (m, rung) cell, matching the archived replica design exactly (the red
    team's construction at rungs 26, 28, 30, 32); the T-interval half-width
    at these n is projected from the archived b24 half-width (0.3197 at m4
    frozen, n = 200) and reported honestly per rung; if the executor's
    wall-clock projection shows a rung cannot finish inside the declared
    budget, rungs are computed in ascending order (26, 28, 30, 32), the stop
    is recorded with its reason (a stop is blocked, never a finding), and
    no n is silently changed. m = 4 on-mode is primary (the decision
    quantity); m = 5 on-mode is generated ONLY if at least 50% of the wall
    clock remains after the m = 4 rungs complete. PRIMARY DISCRIMINATOR: the
    26..32 segment slope of log2 T_frozen vs log2 N at m = 4 on-mode
    (weighted OLS, the F7(a) conventions), read against (a) the archived
    12..24 segment slope -0.038062 calibrated [-0.041782, -0.034385] and
    (b) 0. T-POINT RULE: any rung whose calibrated 99% interval excludes 1
    from below is TW-BREAK-shaped and routes to the Coordinator untouched.
    OUTCOMES (pre-registered): (FLAT) the 26..32 calibrated interval
    excludes the 12..24 slope (bending beyond both intervals) -> flattening
    supported; OQ-F7 narrows further; successor (c) (harvest-on m = 4 rows
    above 32 bits with certified solves) is priced for the rerank.
    (CONT) the 26..32 interval overlaps the 12..24 slope AND excludes 0 ->
    the decline continues at the same rate; the crossing is projected
    within a few further bits; successor: extend the replica rungs (34..36)
    or (c), priced at the rerank. (AMBIG) the interval overlaps BOTH the
    12..24 slope and 0 -> unresolved at these n; record and price (c) or a
    larger-n (b) at the rerank. (CROSS) any T interval excludes 1 from
    below -> review-breakthrough round at max with replication before any
    other reading.

  coordinator_prior: >-
    Recorded before the (b) data exists, marked NOT INDEPENDENT: it is
    informed by F7(a)'s branch (i) result and by the cross_joint headroom
    reading (about 10% headroom at 30..32 on the engine). This Coordinator
    expects FLAT: the harvested share of the X^2/N budget approaches 1 and
    the decline must bend. WHAT WOULD OVERTURN IT: a 26..32 segment slope
    consistent with -0.038 while the engine's own 30..32 headroom said
    roughly 10% -- which would mean the replica and the engine diverge
    above 24 bits, localising to the replica's fidelity at larger N and
    pricing (c) over further replica rungs; or any rung interval excluding
    1 from below (CROSS), which is the lemma failing for adaptive engines
    in the aggregate and routes to review-breakthrough untouched.

