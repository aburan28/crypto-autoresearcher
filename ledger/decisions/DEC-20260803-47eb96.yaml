coordinator_decision:
  id: DEC-20260803-47eb96
  context: >-
    GOAL-AES-003 BATCH-006 close. The batch ran the only two measurements the
    BATCH-005 red team judged capable of changing a conclusion: the r=4 yoyo arm,
    which had never been paired to an r=5 arm, and RC-8's 27 S-box draws, which
    had been declined twice on a cost estimate wrong by ~28x.
  decision: support
  target_ids: [GOAL-AES-003, RQ-AES-003, EV-AES-9794e1]
  rationale:
    - >-
      THE FALSIFIER DID NOT FIRE AND THE FRAMING AROUND IT DID. r=4 is saturated,
      so the yoyo statistic is not peaked at r=5; r=5 is the last sub-saturated
      above-null round. The measurements were never in question. What failed,
      three times running, were Coordinator descriptions OF those measurements:
      "peak at r=5" (refuted), "monotone decreasing" (overstated, since r=10 is
      not below r=6), and the claim that the low side had never been measured
      (false -- BATCH-001 had r=3 and r=4 arms).
    - >-
      RC-8 MOVED THE CAMPAIGN'S CENTRAL SCOPING BOUND FROM 0.224 TO 0.78, AND THE
      0.90 TARGET IS MISSED BY TWO DRAWS. The validator ruled that only the strict
      BATCH-004 criterion was ever frozen and that BATCH-005's looser form is a
      corrupted quotation of it, not a second rule. That ruling COST the campaign
      its target and I adopt it, because the alternative was to keep two readings
      alive until the data told me which to prefer.
    - >-
      THE STRONGEST RESULT IS ONE NOBODY HIGHLIGHTED. Three independent
      implementations agree TO THE INTEGER on a 14-in-2^30 rare-event count,
      including an identical by-word vector. The producer listed it third of
      three; the validator flagged that as an understatement. It is the best
      evidence in six batches that this instrument measures what it claims to.
    - >-
      ONE OBJECT REMAINS WITH NO PROPOSED MECHANISM. At r <= 4 exactly three of
      four words are preserved on every trial and the never-preserved index tracks
      the ACTIVE word. The validator ran the null-object control the batch lacked
      and showed it is not a counting artifact. Nobody -- producer, validator or
      Coordinator -- has offered an explanation.
  evidence_refs: [EV-AES-9794e1, CORR-20260803-2cefa6, CORR-20260803-9a67de, CORR-20260803-c92db5]

  what_this_batch_cost_in_integrity_and_what_it_bought:
    archives_unverifiable: >-
      This batch's snapshot is the THIRD unverifiable archive of the session,
      after BATCH-001's ledger archive and ECDLP BATCH-029's snapshot. Its cause
      was new: a shell quoting error, not a discipline lapse. The commit that
      landed the content calls itself VERIFIED and is the reason verification is
      impossible, which the validator caught.
    coordinator_claims_corrected: >-
      SIX this session, every one found by a producer or reviewer rather than by
      me. The common act is asserting the state of something without looking at
      it: two absence claims, two summary compressions, a regex-corrupted field
      write, and a commit message that described a commit it was not.
    what_it_bought: >-
      Every one of those is in the ledger with its cause, and the machinery that
      caught them is the same machinery producing the results. A campaign whose
      reviewers only ever confirmed its Coordinator would be worth less than this
      one.

  limitations:
    - Toy tier. r in {2,3,4,5}, one machine, one instrument family.
    - ONE independent review, not two.
    - The snapshot archive is not dispatcher-verified; anything derived from it is published but not official.
    - The 27 RC-8 arms were not independently re-executed.
    - No model independence, so nothing counts toward a closure quorum.

  next_actions:
    - >-
      SINGLE NEXT ACTION: open BATCH-007 with THE ACTIVE-WORD STRUCTURE as rank 1.
      It is the only object in this campaign with a confirmed, controlled,
      unexplained behaviour: three of four words preserved on every trial at
      r <= 4, with the never-preserved index tracking the active word, not a
      counting artifact. Rank 2: independent re-execution of the RC-8 arms, which
      the validator dropped on budget and which is the difference between a
      one-session bound and a replicated one. Rank 3: the two further draws that
      would close the 0.90 gap, run BEFORE any decision about whether 0.90 matters,
      so the target cannot be argued about on the data.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      The candidate durable finding is the round-profile shape, and it is not
      promotable while the batch that established it has one review and an
      unverifiable archive. The active-word structure is not promotable because
      nobody can say what it is. Revisit after BATCH-007 rank 1.

  decided_by: coordinator
  decided_at: 2026-08-03
