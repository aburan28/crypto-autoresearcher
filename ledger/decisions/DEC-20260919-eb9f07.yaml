coordinator_decision:
  id: DEC-20260919-eb9f07
  decided_by: coordinator
  decided_at: '2026-09-19'

  context: >-
    Continuation of the EXP-FROB-d8aa37 stage0 launch lane, immediately
    following DEC-20260919-119999's launch authorization of RUN-FROB-39714f
    under driver-v2.py/checker-v2.py (the identity/provenance-corrected
    source whose diff this coordinator independently re-verified matches
    DEC-20260915-744b57's exact_diff_authorized exactly). The dispatching
    session claimed TASK-20260919-4baa89 and launched RUN-FROB-39714f as a
    genuinely backgrounded process, with no external tool-call-duration
    timeout wrapper, relying solely on trial-plan-stage0-v4.json's own
    watchdog_seconds=86400. The dispatching session reports the run was
    progressing genuinely and correctly -- roots.jsonl.gz grew from ~4MB to
    88MB over approximately 10 minutes, no errors appeared in stdout/stderr,
    matching the same healthy partial-execution pattern RUN-FROB-2404fa
    itself showed before its own interruption -- when the entire underlying
    execution environment (the container/VM this dispatching session runs
    in) was restarted. The dispatching session states this was confirmed by
    `/proc/uptime` showing the machine had been up only ~141 seconds when
    checked, and by a system-level notice that the working directory bounced
    during the restart. This killed every process in the tree, including the
    Python supervisor process (tools/experiment_execution.py's own launcher),
    not merely the sage subprocess.
    This coordinator has no shell and cannot independently recompute any
    hash, re-check process state, or re-read `/proc/uptime`; the hashes, the
    uptime reading, and the process-tree death are accepted as
    reported_by_session (see verification block below). This coordinator DID
    independently verify, by listing experiments/EXP-FROB-d8aa37/runs/RUN-FROB-39714f/
    directly with its own Glob tool in this engagement, that it contains
    exactly seven entries -- launch.json, command.txt, stdout.log, stderr.log,
    environment.json, tuples.jsonl.gz, roots.jsonl.gz -- and that NO
    execution-receipt.json, manifest.yaml, raw-result.json, fixtures.json,
    metrics.json, certificates.json, report.md, check.stdout.log, or
    check.stderr.log exists at that path. This is not trusted from the
    requesting account; it is this coordinator's own read of the actual
    committed-but-not-yet-committed working tree.
    This coordinator also independently re-read
    coordination/frobenius/BATCH-2f8435/admission/linux-runtime-lock-successor-20260914-c85f6a.json
    and coordination/frobenius/BATCH-2f8435/admission/run-binding-successor-20260914-8374d8.json
    in full: both confirm the still-current, unedited
    scientific_launch_authorized:true lock and its sha256
    46d918a1a4b9d358df39f09a87d5221128cc1ce19cb62672bc35204785952eb5, agreeing
    with run-binding-stage0-driver-v2-retry-20260919.json's own citation --
    independent cross-corroboration across two already-committed artifacts,
    not reliance on the requesting message's stated value alone. This
    coordinator also re-read DEC-20260919-119999 and trial-plan-stage0-v4.json
    in full as the immediate predecessor record and still-valid template for
    this record's own authorized amendment.

  decision: amend
  target_ids:
    - EXP-FROB-d8aa37
    - RUN-FROB-2404fa
    - RUN-FROB-3c0b8f
    - RUN-FROB-39714f
    - RUN-FROB-f3e2a3
    - TASK-20260919-4baa89
    - BATCH-2f8435
    - RQ-FROB-7d8dd4
    - H-FROB-73df22

  the_decision_stated_plainly: >-
    RUN-FROB-39714f's interruption is a THIRD, DISTINCT infrastructure-
    interruption mode in this lane's history -- categorically different from
    both prior failures -- and is diagnosed, honestly and without
    fabrication, as infrastructure destroying the whole process tree
    mid-run, external to any script's own control and external to any
    timeout wrapper this dispatching session applied (there was none this
    time). It is not caused by any code defect: driver-v2.py/checker-v2.py
    were behaving correctly right up to the moment of the restart, per the
    genuinely growing roots.jsonl.gz and the absence of any error in
    stdout.log/stderr.log. On that basis, this coordinator (1) preserves
    RUN-FROB-39714f's directory exactly as it stands -- its real partial
    roots.jsonl.gz and the four hashed files, with no execution-receipt.json
    authored for it, because the absence of one IS the honest record of what
    happened, not a gap to be papered over -- and (2) authorizes a fresh
    retry under a fresh, previously-reserved run_id, RUN-FROB-f3e2a3, via a
    fresh trial-plan-stage0-v5.json, a fresh run-binding, and a fresh launch
    handoff to the Executor (TASK-20260919-490018).

  rationale:
    - >-
      THREE DISTINCT FAILURE MODES, ALL INFRASTRUCTURE/PROTOCOL SIGNAL, NEVER
      NEGATIVE MATHEMATICAL EVIDENCE, PER AGENTS.md CORE RULE 5 / CLAUDE.md
      RULE 3. RUN-FROB-2404fa was interrupted by an external `timeout 580`
      that sent a signal the launcher process itself could catch, producing a
      graceful "interrupted" execution-receipt.json. RUN-FROB-3c0b8f failed
      in ~7 seconds with a clean, immediate application-level
      infrastructure_error from a hardcoded run-identity/lock-path defect
      (since fixed in driver-v2.py/checker-v2.py), with a receipt written
      normally. RUN-FROB-39714f is neither: the entire execution environment
      -- container/VM, and with it the Python supervisor process that would
      have written execution-receipt.json -- was destroyed mid-run by
      infrastructure external to this lane's own tooling, before the
      supervisor's own completion/receipt-writing logic could run at all.
      This is LESS signal than RUN-FROB-3c0b8f's clean infrastructure_error,
      not more: there is not even a completed adapter verdict of any kind,
      only a preserved partial scientific artifact and four hashed files.
      None of the three says anything about H-FROB-73df22, RQ-FROB-7d8dd4, or
      whether Frobenius structure moves the index-calculus exponent.
    - >-
      NO FABRICATED RECEIPT. This decision does NOT author an
      execution-receipt.json for RUN-FROB-39714f, and does not construct,
      estimate, or infer one from the partial roots.jsonl.gz or from what a
      graceful interruption receipt would ordinarily contain. Per AGENTS.md
      core rule 5 ("Never fabricate commands, outputs, timings, statistics,
      citations, or runs. Missing data stays missing and is reported as
      such."), the honest record of RUN-FROB-39714f is exactly what is on
      disk: real partial output, four hashed adapter/launch files, and a
      documented absence of every downstream adapter/checker artifact,
      because the process that would have produced them was destroyed before
      it could run. RUN-FROB-39714f's directory, as it stands right now, is
      preserved as-is by this decision -- uncommitted-but-about-to-be-
      committed by the dispatching session under this decision's own
      authority, and immutable once committed. No file within it is edited,
      completed, or backfilled by this record.
    - >-
      THE RUNTIME LOCK BEING CITED REMAINS THE SAME, STILL-CURRENT, STILL-
      UNEDITED, LAUNCH-AUTHORIZED LOCK. This coordinator independently
      re-read linux-runtime-lock-successor-20260914-c85f6a.json in full in
      this engagement and reconfirms scientific_launch_authorized: true and
      its sha256 46d918a1a4b9d358df39f09a87d5221128cc1ce19cb62672bc35204785952eb5,
      cross-checked against run-binding-successor-20260914-8374d8.json's own
      already-committed, already-filled runtime_lock_sha256 field (both
      agree). Nothing about the runtime, its guards, or its authorization
      changes here; the infrastructure event that destroyed RUN-FROB-39714f's
      process tree is not evidence the runtime lock's own guards were
      inadequate -- the failure was a whole-machine restart, a class of event
      no per-process guard in linux-runtime-lock-successor-20260914-c85f6a.json
      claims to protect against, and this record does not construct a new
      claim that it does.
    - >-
      WATCHDOG SIZING RATIONALE REMAINS VALID, UNCHANGED. No run in this
      lane has ever shown signs of hanging or needing a shorter or longer
      watchdog; the three failures observed to date have each been either an
      instant application-level error, an external interruption from this
      lane's own now-corrected tooling, or (this record) an infrastructure
      restart external to any process's own control -- never a hang.
      86400 seconds remains sized generously above the only real duration
      signal available and remains a ceiling meant never to bind in the
      normal case, machine protection only per CLAUDE.md "Research budgets:
      progress first."
    - >-
      DIRECTION CHECK, unchanged from the whole DEC-20260909-bf5b48 ..
      DEC-20260919-119999 chain. Stage0 is not itself exponent-moving; it is
      the correctness gate for H-FROB-73df22's two arms. No scientific claim
      of any kind is advanced by this admission/retry-authorization record.
      FROB is a declared ECC area (orchestration/research-priority.yaml line
      79), ranked ahead of non-ECC candidates at every selection point, with
      unlimited batch/wall-clock budget per AGENTS.md "ECC comes first."
    - >-
      BUDGET. Per CLAUDE.md "Research budgets: progress first" (2026-09-06):
      research cost estimates are advisory and require no repeated user
      approval; the Coordinator continues justified work within the
      authorized research scope. No 90-day stagnation review is active or
      warranted -- this lane has shown continuous documented progress across
      DEC-20260909-bf5b48 through DEC-20260919-119999 and now this record,
      all within the last five days, including a genuine, correctly-executing
      partial run destroyed only by infrastructure external to this program's
      own control. Authorizing a further retry after an infrastructure-only
      interruption is exactly the kind of routine continuation CLAUDE.md's
      "progress first" instruction protects, not a new spending decision
      requiring fresh justification. A whole-machine restart mid-run is
      squarely within "watchdog expiry checkpoints a task; it does not
      exhaust the campaign."

