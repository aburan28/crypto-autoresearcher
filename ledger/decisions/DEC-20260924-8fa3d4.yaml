      carried_rows: >-
        Recorded, not a bar: P-6, P-7, P-14a and P-14b are created children
        whose parent never read a pair, recorded true / "absent" (the NOT A BAR
        class); P-1..P-5b are no-child paths recorded false; P-8..P-13, P-14c
        and P-F1 are recorded true with the pair.
      result: >-
        FAILS. (a) holds; (b) fails on P-16 and on P-F2 (after P-14a or P-16).
        NOT APPROVABLE AS WRITTEN.

