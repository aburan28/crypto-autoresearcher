      R-RKR1-b_P-16: >-
        A CREATED CHILD RECORDED AS NOT CREATED, NOT NAMED NOT A BAR.
        (1) Fact (md 200, 226-229): fork() has created the child, and a
            MemoryError converting the new pid, or an asynchronous
            KeyboardInterrupt at the boundary after CALL, raises before
            STORE_FAST pid. `rec` has no child_rlimit_report (220 not
            reached) and the _run_child_locked frame holds no `pid`, so RK-1
            (b) as worded ("true if that `rec` carries the key ... OR if a
            frame ... holds a local `pid` that is an int greater than 0; false
            otherwise", lines 268-271) records FALSE.
        (2) The NOT A BAR class "a created child whose parent never read a
            pair (... a raise before 227; recorded "absent" with its report
            under RK-1 (c) and named under RK-2)" is about the missing PAIR,
            the subject of condition (a). Its own parenthesis presupposes the
            child is recorded as created ("A created child with
            pair_read_by_parent false is recorded with the pair "absent"",
            RK-1 (c), lines 285-289). It does not name the value of
            child_created, the subject of condition (b).
        (3) Reading that class as also exempting (b) would make (b) VACUOUS:
            on every path on which RK-1 records child_created false for a
            created child, 220 has not run, so 227 has not run, so the parent
            read no pair, so every (b) failure would fall inside the class.
            The draft wrote (b) precisely because DEC-20260924-a789e1 found
            children "RECORDED FALSELY AS NOT CREATED" (R-RLR1-P-14_P-15). A
            reading that empties a pre-declared condition, chosen after the
            census, is the post-hoc widening refused in DEC-20260924-a789e1
            R-RLR1-P-7 (2) and DEC-20260924-650068 R-RB1-I-10 (3).
        (4) "a child left waiting for the go byte (RKL-2)" names the child's
            unrecorded RUN, not the value of child_created; RKL-2 itself says
            "Its launch record exists (RK-1 (b))" (line 510), asserting a
            correct record (CORR-20260924-7fcbd2 item 1).
        (5) L-11 does not remove P-16 (see method_limits_ruled.L-11).
        RESULT: (b) fails on P-16.
      R-RKR1-b_P-F2: >-
        A CREATED CHILD RECORDED AS NOT CREATED, NOT NAMED NOT A BAR, AND NOT
        DEPENDENT ON L-11. A raise in _run_child_locked after fork and before
        220 (P-14a: os.close 210 / 211, os.read 214, 217, os.close 218, 219,
        220; ordinary OSError is possible at several) followed by a raise from
        lk.release() in run_child's finally (fcntl.flock LOCK_UN or
        self.fh.close raising OSError, 115-117). The exception that leaves
        run_child is release's; its traceback holds run_child (174) and
        SolverLock.release, not _run_child_locked; the first exception, which
        does, is only its __context__ (md 205, 230-233). RK-1 (b) inspects
        only "the exception's traceback" (line 258), so it finds no `pid` and
        no report key and records FALSE. The same NOT A BAR reasoning as for
        P-16 applies. RESULT: (b) fails on P-F2 after P-14a, and after P-16.
      R-RKR1-substance: >-
        Neither failure changes a package VERDICT under RK-3: a record with
