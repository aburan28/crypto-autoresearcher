  rationale:
    - >-
      THE DRAFT'S OWN READINGS DECIDE. RKR-1 (b) and RKR-6 (c) were written
      before the census and say what a created child recorded as not created,
      and a frozen command that reads the run id for another purpose, mean:
      not approvable as written. The census found both, from frozen code.
    - >-
      NO READING IS WIDENED AFTER THE FACT. Reading the no-pair NOT A BAR class
      as also exempting RKR-1 (b) would make (b) vacuous; reading RK-4 (a) as
      permitting unnamed shims would add replacements to a closed list; W-2 is
      left undecided rather than decided the convenient way.
    - >-
      SIX IN A ROW IS A PATTERN, NOT BAD LUCK. Each exact-coverage reading of
      this lineage failed on the next finer enumeration, and the latest
      enumeration reached bytecode boundaries and interpreter documentation
      (L-11). Repeating the method would spend another draft and census for a
      predictable result. Premature closure is a failure mode; so is repeating
      a method whose failure is already evidenced.
    - >-
      THE PROPERTY THE SCIENCE NEEDS IS MONOTONE. AC-1 needs: no package is a
      basis for anything unless every capped child that may have executed argv
      has its cap read-back recorded; otherwise stop for a decision. Rules that
      are exact on the normal paths (RKR-1 (a) holds) and FAIL everywhere else
      satisfy it, and a new path that only yields FAIL cannot break it. The
      real fail-open routes this census exposed were in the verdict rules (W-1
      PASS_ZL; the E-2 (c) PASS route), which the successor closes.
    - >-
      AN ADVERSARY, NOT AN ENUMERATOR. A review blind to this decision, with a
      known-answer control, searching for fail-open counterexamples, tests
      exactly the property that matters; its fail-closed findings cost at most
      a stop, never a result.
    - >-
      THE LANE STAYS OPEN. Nothing measured D. The obstruction is recording
      and approval design in a layer not yet written.
    - >-
      NO SECURITY READING. Toy EcGFp5-shaped arithmetic with known scalars;
      nothing transfers to p = 2^64 - 2^32 + 1.

