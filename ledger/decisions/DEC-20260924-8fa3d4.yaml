        - RF-5: X-13 by name. RF-6: DV-18 (f) (x)-(xiii) and (i) (7)-(13).
          RF-7: value classes. RF-8: THIRTEEN bound hashes.
        - Readings RFR-5 (integrity), RFR-0 (review validity and known-answer
          control), RFR-1 (no fail-open), RFR-2 (no planned-basis refusal),
