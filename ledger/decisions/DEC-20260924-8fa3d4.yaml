  method_limits_ruled:
    L-11_interpreter_behaviour: >-
      P-16 rests on documented interpreter behaviour and bytecode compiled
      from source (a C call raising after its side effect; asynchronous
      exceptions at bytecode boundaries), not on interpreter source. RULING:
      a path derived from documented behaviour is a finding, not a limit that
      removes it ("not expected is not impossible", DEC-20260924-650068;
      DEC-20260924-a789e1 R-RLR1-P-14_P-15 (4)); RKR-1 has no method-limit
      exemption. P-F2 after P-14a does not depend on L-11 at all (ordinary
      OSError at both raises). L-11 is also the clearest sign that exact path
      enumeration has no floor, which is part of the reason the approach
      changes. Carried to the successor as RFL-4, where a behaviour that
      differs can only yield `undetermined` or FAIL.
    L-12_fork_child_path: >-
      P-C is not traced beyond run_child. RULING: RKR-1 is stated on the
      parent ("CHILD CREATED: os.fork (181) returned a positive pid in the
      parent", line 527), and in the parent P-C is P-7, which RK-1 records
      true by key presence; so P-C is not an RKR-1 failure. What RK-1 does in
      the FORK CHILD is unspecified, and the frozen behaviour there (the child
      continues the caller's program without RLIMIT_AS; O-4) is a real
      frozen-code property. Named defect E-9; the successor records it by a
      process-identity rule and fails the package (failclosed RF-1 (b), RFL-5).
      Never a finding about D.
    L-13_W-1_W-2: 'Not decided here, as the census left it; not outcome-determinative; removed in the successor by defined outcome classes (see RKR-3).'
    L-14_r4_wrapper_inferred: >-
      The r4 R-6 analogue is an inference about unwritten code. RULING: the
      successor lists it as an expected refusal (or handles it by the r3
      method), lists R-10 as a bounded wait rather than a STOP, and leaves the
      r4 code itself to DV-18 on delivered code (failclosed RF-4 (b)).
    carried: >-
      L-1..L-10 as the close census carries them (md 721-736): L-2 and L-7 are
      closed as worded; L-3 (which path occurs), L-4 (grandchildren), L-5 (no
      r3 run of most commands), L-8 (r4 closure; DV-18 (h)), L-9 (1073741831)
      and L-10 (static) stand.

  observations_ruled:
    O-1_rec_unbound: 'RK-1 (b) does not say what is recorded when `rec` is unbound (a raise at 152); no child exists. Named in E-8; the successor records rec "unbound" and child_created false by its positive rule.'
    O-2_lock_left_held: 'An asynchronous raise between acquire and the try (167-170) can leave the host lock held until the SolverLock is collected; later launches of that process refuse before fork; the package has already failed. Frozen behaviour; recorded (RFL-7). Not a defect of the draft.'
    O-3_OK_report_without_pair: 'A raise at 226-227 leaves report "OK soft hard" with no pair read; RK-1 (c) and RK-2 (ii) do not name the class. Named in E-8; the successor names it and makes it FAIL.'
    O-4_fork_child: See L-12 and E-9.

  # --------------------------------------------------------------------------
  disposition:
    outcome: revise
    approve_considered: >-
      REJECTED. RKR-1 and RKR-6 each state that a failure makes the draft "NOT
      approvable as written", and what_the_readings_cannot_do (lines 650-657)
      forbids an approval "with a removed field, an added exclusion or
      tolerance, a waived checker item, or a changed ... reading rule". Every
      condition that would make the draft sound is one of those or new
      normative text: a third child_created value and a chain walk (RKR-1
      (b)); an accepted certificate label read (RKR-6 (c)); named shims and an
      expected REG-1 item (DV-18); a narrower PASS and PASS_ZL (E-2). Protocol
      text changes only by a versioned amendment decided on archived bytes
      (AGENTS.md; precedents DEC-20260924-a789e1, DEC-20260924-650068,
      DEC-20260924-e6638d approve_considered).
    change_of_approach:
      stated: >-
        YES. THE APPROACH CHANGES. The next step is NOT another exact-coverage
        patch followed by another static census.
      evidence: >-
        - Six drafts failed a pre-declared exact-coverage reading on the next
          finer enumeration: healthresolve CN-1 (DEC-20260924-afdc3b: three
          classified msolve launch sites), launchcover LP-1 / LP-2 (iv)
          (DEC-20260924-a7453e: six readers of the callgrind record),
          consumercover CU-2 (DEC-20260924-e6638d: consumers not covered),
          readbackcover RBR-1 (DEC-20260924-650068: I-10 and failure-branch
          children), readbackfull RLR-1 / RLR-4 (b) (DEC-20260924-a789e1: P-7,
          P-14, P-15; zero-launch refusal), readbackclose RKR-1 (b) (this
          decision: P-16, P-F2). The one approved draft (valueclose,
          DEC-20260924-e52eec) failed at its gate on a recording gap
          (DEC-20260924-1ce186).
        - The granularity grew each round: launch sites, consumers, children,
          branches, implicit raise points, bytecode boundaries, exception
          chaining in a finally, the fork-child path (close census md
          133-236). The close census itself declares that interpreter
          behaviour is taken from documentation (L-11). There is no finest
          level at which an exact-coverage reading is known to close.
        - Every exceptional path the censuses found ends in a failed package
          (the driver has no handler; the wrapper records the package failed:
          v2_driver.py 1329-1348, r3_run_wrapper.py 483-509), so the
          record-exactness readings were placed where no verdict depends on
          them, while real fail-open routes sat in the verdict rules (W-1
          PASS_ZL; the E-2 (c) PASS route).
      what_changes: >-
        (1) RULES: every r4 recording and verdict value is taken from a named
            positive record or is `undetermined`; `undetermined` yields FAIL;
            every FAIL of a read package is a designed stop; PASS and PASS_ZL
            require positive child classes and a driver-written
            raw-result.json (failclosed RF-0..RF-3).
        (2) READINGS: monotone. Only a FAIL-OPEN counterexample (a pass or
            admission while a child that may have executed argv lacks a
            recorded pair, or while the outcome is wrapper-recorded) or a
            PLANNED-BASIS REFUSAL bars approval. A path on which the rules FAIL
            or say `undetermined` is never a bar and never orders another
            census (failclosed what_the_readings_cannot_do).
        (3) CHECK: an INDEPENDENT zero-run red-team review, blind to this
            decision, that searches for fail-open counterexamples and must
            first reproduce a known answer (P-16, P-F2, W-1 under readbackclose
            as worded), instead of a Coordinator-ordered census that enumerates
            paths for the Coordinator to rule on.
        (4) EMPIRICAL BURDEN: the remaining uncertainty about r4 code moves to
            DV-18 on the delivered code, extended with stand-in tests of P-16,
            P-F2 and the fork-child path (failclosed RF-6).
      test_boundary: >-
        What the change rests on: the frozen, hash-bound code of
        implementation-v2/ and -v2-a1/, the phase-A-bound r3 layer and plans at
        dd1034553 bytes, and the three archived censuses. It asserts nothing
        about r4 code, which does not exist, and nothing about D.
      remaining_uncertainty: >-
        Whether an r3 / r4 layer between run_child and the driver catches an
        exception from run_child (not read by this act; review J-2); whether
        the recorder's own failure paths are fail-closed (J-1); whether the
        development harness reproduces the plan package's computation (J-4);
        whether the fail-closed rules refuse a planned basis outcome (J-3).
      successor: >-
        AMD-EXP-GFPN-05ff43-20260924-failclosed (DRAFT), reviewed by
        TASK-20260924-f5631b, archived by TASK-20260924-0c2fdc, decided by the
        reserved approval act TASK-20260924-64c8fe (DEC-20260924-844896,
        archive TASK-20260924-5816cd).
      revisit_condition_for_this_choice: >-
        If the review finds a FAIL-OPEN counterexample that no r4-layer rule can
        close without changing a frozen byte, the approval act reconsiders
        option FD of the successor (a v3 implementation that writes per-child
        records in the frozen commands, under a new protocol version and REG-1
        reference) against the cost of a new REG-1 reference and gate.
    other_dispositions_considered: >-
      - Approve readbackclose with conditions: rejected above.
      - Sixth patch (a clause for P-16 and P-F2, shims named) and a sixth
        census: REJECTED; the evidence under change_of_approach predicts
        another failure on the next finer path, at the same cost.
      - Waive the 65-67 item and rely on the frozen code's own cap check:
        REJECTED; the waiver DEC-20260924-1ce186 R-1 refused (AC-1 requires the
        read-back in the manifest).
      - A v3 implementation changing the frozen commands to record per child:
