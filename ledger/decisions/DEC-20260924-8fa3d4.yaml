        wrapper (r3_resolve) or the HR-3 health wrapper for handlers. If one
        converts a raise into a result, RF-3 should still FAIL through raised
        non-null, so I expect "holds" with a fail-closed finding; about one
        chance in four of a genuine fail-open counterexample.
