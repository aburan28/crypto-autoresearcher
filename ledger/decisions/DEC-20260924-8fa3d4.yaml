      archived_values: >-
        md 131-268; receipt 165-176.
        - run_child returns at 155, 160, 165, 169, 171; _run_child_locked at
          225, 232, 308; no explicit raise; every return value is the 152
          record; no frozen handler returns another object (md 135-165).
        - Line 181 compiles to CALL then STORE_FAST pid; `pid` is bound only
          there; the finally at 172-174 has a RERAISE exit (md 151-156).
        - Per-path table P-1..P-16, P-F1, P-F2, P-C (md 190-206).
        - (a): no failing path. (b): fails on P-16 and on P-F2 after P-14a or
          P-16 (md 250-268).
      R-RKR1-a: >-
        HOLDS. On every path on which 227 completed, either run_child returns
        the 152 object, which carries the pair, or `rec` in the outermost
        frozen run_child frame of the leaving exception is that object (P-8..
        P-14c, P-F1, P-F2 after P-14c). This act read v2_solver.py 149-308 and
