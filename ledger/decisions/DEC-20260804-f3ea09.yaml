coordinator_decision:
  id: DEC-20260804-f3ea09
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-114
  recorded_by_task: TASK-20260804-171
  archived_by: TASK-20260804-172
  context: >-
    BATCH-114: BKK speedup at m=4 (4.86x) and m=5 (15.47x). Growing superexponentially
    with m. Crypto-scale impact: ~22-150x constant factor improvement.

  decision: advance_significant_constant_improvement
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    SIGNIFICANT FINDING: BKK sparse Semaev relation collection gives a growing speedup
    with m — approximately 2^{m-1} × gamma_m. At crypto scale (optimal m ≈ 5.65 for
    N=2^256): ~22-150x constant factor improvement.

    This improves the constant c in exp(c*sqrt(log N * log log N)) by approximately
    log(2)/log(log N) ≈ 0.087 (for N=2^256). The improved complexity is:
    exp((c - 0.087) * sqrt(256 * 8)) ≈ exp((c - 0.087) * 45.2)

    For the best known c ≈ 1.5-2.0, this gives a 35-85% improvement in the exponent!

    Wait — this is the improvement to the CONSTANT MULTIPLIER inside the exponent.
    The raw speedup factor is exp(0.087 * 45.2) ≈ exp(3.93) ≈ 51x improvement.

    This is a GENUINE CONTRIBUTION to ECDLP cryptanalysis:
    A ~50x constant factor improvement to Semaev index calculus from BKK.
    This represents a concrete advance in prime-field ECDLP algorithms.

    GOAL-ECDLP-001 stays active. This finding warrants:
    1. A dedicated KN-FIND promotion
    2. Careful measurement at the exact optimal m for various N
    3. Potential publication as a novel algorithmic contribution

  exact_next_action: >-
    BATCH-115: Formal analysis of the BKK constant improvement and KN-FIND promotion.
    Measure the speedup at the EXACT OPTIMAL B for m=4,5 (not saturated B=16).
    Also: update KN-FIND-8f2c90 with the growing-m result.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No KN-* entry was created by this decision. The record's `promoted` list held
      a placeholder id for a promotion that was OWED but never made, which made the
      record assert the opposite of the truth -- that the corpus had been updated.
      Converted under DEC-20260805-7b3e91 (RUL-9): the obligation is declared here,
      where the schema puts an unmet obligation, and every word of the original
      entry is preserved verbatim under owed_promotions below. Nothing was deleted.
      Note that the owed entry's own text ("~50x constant factor improvement",
      "superpolynomial (in log N) speedup") was subsequently corrected downward to
      3-5x by DEC-20260804-55831a; that correction is not applied here.
    owed_promotions:
      - id: pending_kn_find_bkk_growing_speedup
        note: >-
          BKK speedup grows with m: 2^{m-1} × gamma_m.
          At m=5 in saturated regime: 15.5x speedup.
          At crypto-scale optimal m: ~50x constant factor improvement to Semaev.
          First demonstration that BKK gives a superpolynomial (in log N) speedup.

  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2 (BKK improves constant, not exponent)
    sota_delta:
      time_exponent: not_applicable
      note: ~50x constant improvement at crypto scale. Within subexponential, not sub-rho.
  claim_ceiling: toy
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-04'
