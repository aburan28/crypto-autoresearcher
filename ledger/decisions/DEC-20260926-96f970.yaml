  # ---------------------------------------------------------------------------
  # DEFECTS. Each with its joint and breaking artifact. The revision
  # discharges every DF item and addresses or declares every RI item.
  # ---------------------------------------------------------------------------
  defects_to_discharge:
    - id: DF-1
      joint: J1
      entry: 1
      breaking_artifact: a locator that fails on its pinned revision; a pin that needs a reader's choice
      defect: >-
        The PR-EIP197 regular expression for BN254-r matches nothing in the
        pinned revision of eip-197.md, because the markdown places a backtick
        before "q". A literal executor reaches locator_failure and the row is
        UNPINNED; tolerating the backtick is an undeclared choice. The design
        report records that its producer did not verify this locator (D-3).
        Consequence to address: with BN254-r unpinned, a null-arm bit class
        disappears.
      source: VAL-20260927-b99738 J1.decisive_reason, attack_results.i_all_rows
    - id: DF-2
      joint: J1
      entry: 4
      breaking_artifact: a confounder check that still refers to the row it tests
      defect: >-
        FP is defined to include the two C-FIELD expression values, so each
        C-FIELD case is in FP by definition. Reviewer mutation M-FP (FP built
        from the two C-FIELD values only) leaves every declared control
        passing while a real field prime presented as r is admitted. The
        controls cannot detect an FP that omits the extracted primes.
      source: VAL-20260927-b99738 J1.secondary_break, coverage entry 4
    - id: DF-3
      joint: J6
      entry: 8
      breaking_artifact: a gate that cannot be executed as written
      defect: >-
        The admission gate's PARI version_command reads cypari2.__version__,
        which cypari2 does not define in any release the reviewer executed or
        inspected. Admission item 1 fails before any tool is admitted.
      source: VAL-20260927-b99738 J6.decisive_reason, admission_gate_as_written.item_1_versions
    - id: DF-4
      joint: J6
      entry: 9
      breaking_artifact: an undetermined timeout; a gate that does not determine admission
      defect: >-
        The text says an in-process timeout is an alarm return (e_ALARM) and
        that admission item 3 "returns an alarm error". Through cypari2 the
        alarm raises an interrupt exception that ordinary handlers do not
        catch; in gp it returns an error object. Whether admission item 3
        passes, and how F2 recognises a timeout, therefore turn on an
        undeclared reading. The red team's own helper met the interface
        difference from the other side (RT-20260926-40d75b PTM-C note), which
        corroborates that the behaviour is interface-dependent; composition
        does not adjudicate between the two observations.
      source: VAL-20260927-b99738 J6.decisive_reason, coverage entry 9
    - id: DF-5
      joint: J5
      entry: 13
      breaking_artifact: an over-scoped sentence
      defect: >-
        interpretation_limits (pairing-family item) says family polynomials
        force divisors so deep values are the expected case on BN254-r and
        BLS12-381-r. Under the typed costs the premise fails on at least one
        branch; the sentence predicts a category on deployed rows, contrary to
        the draft's "no value is predicted"; and it reads a bin as
        family-caused, contrary to the draft's own descriptive-bin rule, which
        PTM-C shows is needed. The sentence was imported from H-AUXIN-6db354.
      source: RT-20260926-40d75b O-J5-1
    - id: DF-6
      joint: J4 (K-indeterminate, D5)
      entry: none (reporting field)
      breaking_artifact: a choice the text leaves open that affects a reported quantity
      defect: >-
        bin_by_status leaves bin_at_least undefined when a BOUND value bins
        NEAR_FLOOR. Minor; both implementations chose null and no gate reads it.
      source: VAL-20260927-b27125 Q0-J4-4
