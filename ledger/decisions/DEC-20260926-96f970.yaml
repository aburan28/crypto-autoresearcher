  # ---------------------------------------------------------------------------
  # CB-6. Prior versus outcome (plan coordinator_prior; PD-R1).
  # ---------------------------------------------------------------------------
  prior_versus_outcome:
    overall: >-
      Prior: about 0.25 that the round composes to approve; most likely outcome
      "revise under K-indeterminate on a new convention, then K-revise-defect
      on J1 or J6". Outcome: revise, driven by K-revise-defect on J1, J5 and
      J6; K-indeterminate fires only on a minor reporting field. The direction
      of the prior held; its predicted locus did not.
    per_joint:
      J1: >-
        Prior holds about 0.5, expected break on the BLS12-381 source or the
        PDF comparison rule. Outcome: breaks, but both expected loci HOLD; the
        break is on a different time-pinned source (EIP-197) and on FP
        seeding. Overturn item (2) of the prior occurred.
      J2: Prior holds about 0.7. Outcome holds; the expected loci (O9/RC1, O10) held.
      J3: Prior holds about 0.55, expected break at a new convention. Outcome holds.
      J4: >-
        Prior about 0.75 that J4 agrees with J3 on every value, and about 0.4
        that neither reports an open material choice. Outcome: full agreement;
        one minor open choice (DF-6). Overturn item (1) was nearly met.
      J5: Prior holds about 0.6, expected break on a new over-scoped sentence. Outcome breaks exactly there.
      J6: >-
        Prior holds about 0.55, expected break on F-J1-5 or F-J1-3. Outcome
        breaks on F-J1-5 (timeout recognition) and on the PARI version command
        (F-J1-2), which the prior did not anticipate; F-J1-3 held.
    where_it_broke_versus_prediction: >-
      Predicted J3/J4, then J1, then J6. Actual: J3/J4 held; J1, J6 and J5
      broke. The "J3/J4 first" prediction is overturned.
    PD-R1_reading: >-
      The prior was informed, so concurrence of TASK-20260926-b99738 or
      TASK-20260926-bc2a62 with it is weak corroboration. The most informative
      result is where they disagreed with it: J1's expected loci held, and the
      blind J4 joint agreed completely with J3 for the second round running.
      The recipe-and-convention layer is determinate; the failures sit in the
      source-pin and tool-interface layer, which a text review can only find
      by executing against live sources and real tool builds.

  # ---------------------------------------------------------------------------
  # CB-12. Diminishing-returns guard (DEC-20260926-0eed78).
  # ---------------------------------------------------------------------------
  diminishing_returns_guard:
    applies: true
    note: >-
      This is the second refusal on this amendment lineage. The next selection
      point must rank, explicitly and against a full third revision, at least
      the following re-scoping alternatives, and record its reason.
    rescoping_alternatives:
      - id: RS-A
        text: >-
          Split the source-pin and tool-admission layer (D1, D6, D8: DF-1 to
          DF-4, RI-6, RI-7) into its own additive amendment, reviewed on J1 and
          J6 only with executed pins and a provisioned admission gate, ahead of
          the census protocol. The census protocol (D2 to D5, D7, D9, D10),
          whose recipe and convention layer held twice, would then be revised
          only for DF-5, DF-6 and RI-1 to RI-5, RI-8.
        why_considered: >-
          Every break of this round and most of the last lie in that layer,
          while J2, J3 and J4 held; separating them stops a pin or tool
          defect from refusing a determinate census text.
      - id: RS-B
        text: A successor experiment under H-AUXIN-6db354 in place of a third additive amendment to EXP-AUXIN-7e2e3d.
        why_considered: >-
          Three layered amendments over the frozen v1 specification make the
          governing text harder to read; a single successor file would state
          every rule once.
      - id: RS-C
        text: >-
          A narrow corrective amendment superseding only the fields named in
          DF-1 to DF-6 and RI-1 to RI-9, reviewed under a plan limited to those
          fields plus the regression set.
    closes_nothing: This is a ranking duty. It closes, pauses and deprioritises nothing.

