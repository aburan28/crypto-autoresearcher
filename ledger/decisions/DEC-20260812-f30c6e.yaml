coordinator_decision:
  id: DEC-20260812-f30c6e
  context: >-
    The user explicitly authorized, this session (via AskUserQuestion), a
    program-wide budget-ceiling extension: raise campaign_budget.maximum_batches
    by exactly one batch on every currently active research goal that carries a
    finite (non-null) cap. This decision records that authorization and the
    resulting single, uniform administrative act across the program's active
    finite-cap campaigns. It is the "separate decision, on explicit user
    authorization" that ledger/goals/GOAL-ECDLP-001/goal.yaml's own
    BUDGET-AMEND-20260729-003/004 entries state THE COORDINATOR DOES NOT
    SELF-GRANT: this record is that authorization, made explicit and cited
    rather than assumed.
  decision: approve
  decision_vocabulary_note: >-
    approve means approve the batch-ceiling raise itself (campaign_budget.maximum_batches
    += 1 on each named goal) as a bounded administrative act on explicit user
    authorization. It does not approve any experiment, does not open any new
    batch, does not change any hypothesis status, claim tier, completion
    criterion or pause condition, and does not reactivate any goal that is not
    already `active`.
  decision_scope: >-
    STRICTLY campaign_budget.maximum_batches, +1, on each target goal below.
    No other campaign_budget field (total_wall_clock_seconds, max_concurrent,
    accounting_basis) moves. No claim_tier_ceiling, completion_criteria,
    pause_conditions, objective_and_scope, active_hypothesis_ids, or hypothesis
    status moves on any target goal. No batch is opened, no run is authorized,
    and no Executor task is dispatched by this decision.
  target_ids:
    - GOAL-AES-001
    - GOAL-AES-002
    - GOAL-ARGON-001
    - GOAL-CRYPTO-001
    - GOAL-DREG-001
    - GOAL-ECTD-001
    - GOAL-FAEST-001
    - GOAL-HAWK-001
    - GOAL-MD5-001
    - GOAL-MLDSA-001
    - GOAL-PATH-001
    - GOAL-RELN-001
    - GOAL-ECDLP-001
    - GOAL-MCE-001
  amendments_recorded:
