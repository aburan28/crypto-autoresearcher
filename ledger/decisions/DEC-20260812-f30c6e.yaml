  explicitly_skipped:
    - goal_id: GOAL-MLKEM-003
      reason: >-
        Listed in the requested batch but NOT amended. GOAL-MLKEM-003.status
        is `closed_at_budget` (DEC-20260803-64b55b, "batch 12 of maximum_batches
        12", no completion criterion met), not `active`. The authorization this
        decision records is scoped to "every currently active goal that
        currently has a finite cap"; a closed_at_budget goal does not meet that
        description, and raising its ceiling without a separate decision to
        reopen/reactivate it would be an unrequested and unexplained status
        change smuggled in as a budget act. campaign_budget.maximum_batches
        stays 12 and the goal stays closed_at_budget. If the user intends to
        resume GOAL-MLKEM-003, that requires its own explicit reactivation
        decision, separate from this ceiling raise.
    - goal_ids: [GOAL-AES-003, GOAL-HQC-001, GOAL-ICEX-001, GOAL-MLKEM-005,
                 GOAL-SDEG-001, GOAL-SIG-001, GOAL-ENDO-001, GOAL-SSI-001,
                 GOAL-SSIQ-001]
      reason: >-
        campaign_budget.maximum_batches is already null (unbounded) on each of
        these. There is nothing to raise; amending a null ceiling would be a
        fabricated action with no operative content.
  rationale:
    - >-
      The user gave this authorization explicitly via AskUserQuestion this
      session (2026-08-12), scoped to exactly "+1 maximum_batches on every
      active goal with a finite cap" and nothing else. That is the exact
      basis multiple goal records (GOAL-AES-001, GOAL-ECDLP-001) already
      require in writing before the Coordinator may raise a batch ceiling:
      "THE COORDINATOR DOES NOT SELF-GRANT ONE."
    - >-
      Consistent with prior practice on this ledger (protocol-amendment-GOAL-AES-001-001..005,
      BUDGET-AMEND-20260727-001..20260730-001 on GOAL-ECDLP-001), a batch-ceiling
      raise is recorded as a scoped `campaign_budget_ceiling` amendment that
      touches maximum_batches alone and leaves claim_tier_ceiling,
      completion_criteria, pause_conditions, objective_and_scope, and every
      hypothesis status explicitly unchanged.
    - >-
      GOAL-MLKEM-003 is excluded because it is not active (closed_at_budget);
      applying the "active goal" authorization to it would exceed what was
      actually authorized. The remaining nine goals with null caps are
      excluded because there is nothing for a ceiling raise to do to an
      unbounded budget.
  evidence_refs: []
  limitations:
    - >-
      This decision authorizes no research, no experiment, no run, and no
      batch opening. It changes exactly one integer field on fourteen goal
      records and nothing else. Each amended goal's next actual batch still
      requires its own separate dispatch decision under its existing scope,
      completion criteria, and review requirements.
    - >-
      Raising a batch ceiling is not evidence that any campaign's remaining
      work is more tractable, more likely to succeed, or closer to a
      completion criterion; none of that is asserted here.
    - >-
      GOAL-MLKEM-003 is deliberately left un-amended; see explicitly_skipped
      above. This is a discrepancy between the requested 15-line list (which
      named 15 goals under a "14 goals" heading) and the actual count of goals
      amended (14): the arithmetic reconciles once GOAL-MLKEM-003 is excluded
      as not active.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Administrative budget-ceiling amendment; no empirical or theoretical
      evidence is produced or reviewed by this decision.
  next_actions:
    - >-
      No batch is authorized to open by this decision alone. Each goal's next
      batch remains gated on its own existing next_action, scope ruling, and
      (where applicable) any still-open budget/wall-clock constraint (e.g.
      GOAL-ECDLP-001's total_wall_clock_seconds remains untracked/unevaluable
      per INT-BATCH006-005 and is unaffected by this decision).
    - >-
      If the user intends GOAL-MLKEM-003 to resume, record a separate,
      explicit reactivation decision (status closed_at_budget -> active) before
      any campaign_budget amendment is made to it.
  decided_by: coordinator
  decided_at: '2026-08-12'
