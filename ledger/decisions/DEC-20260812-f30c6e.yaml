      field: campaign_budget.maximum_batches
      prior_value: 6
      new_value: 7
      record: protocol-amendment-GOAL-AES-001-006 (in ledger/goals/GOAL-AES-001.yaml amendments:)
    - goal_id: GOAL-AES-002
      field: campaign_budget.maximum_batches
