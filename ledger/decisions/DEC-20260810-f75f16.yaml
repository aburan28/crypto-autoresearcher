coordinator_decision:
  id: DEC-20260810-f75f16
  context: >-
    EXP-ICINV-e0cd8f (GOAL-ENDO-001, BATCH-d7e255, RQ-ICINV-475b5e,
    H-ICINV-d5e351) executed six runs of exact symbolic geometry on the
    138-curve Hurwitz-Kronecker-certified ordinary isogeny class p=4001,
    t=30, computing six families of exact invariants of the f_V-free m=3
    Semaev Jacobian ideal (and a secondary m=4 pair), snapshotted at
    5ecab6c78 / 1721063e4, and received both an independent Validator pass
    (VAL-20260810-ad7360, verdict PASSED, "NUMBERS REPRODUCE") and an
    independent Red Team pass (RT-20260810-2ee0af, verdict "CONFIRMED WITH
    SCOPE CORRECTION"), dispatched respectively as TASK-20260810-7b1369 and
    TASK-20260810-9bed1d. This is TASK-20260810-539f92, the ledger archive
    that records the resulting evidence, corrects a factual error in this
    Coordinator's OWN prior commit-message prose, and updates the goal head.
    This task runs ALONE; every other agent on BATCH-d7e255 has terminated.
    BATCH-d7e255 remains OPEN with three of its four approved contracts
    (EXP-INSTR-36c8cf, EXP-JINV-bd141d, EXP-VOLC-9f5571) still undispatched;
    this archive does not close it.

  decision: refine

  target_ids:
    - EXP-ICINV-e0cd8f
    - H-ICINV-d5e351
    - RQ-ICINV-475b5e
    - GOAL-ENDO-001

  rationale:
    - >-
      Both independent reviews confirm the raw numbers reproduce exactly. The
      Validator wrote fresh, independent code from the frozen mathematical
      specification (not by reading or trusting harness/exp_icinv_geometry.py
      at any version) and reproduced every headline number, including a
      full-population recomputation of the class and control multisets from
      the raw 138+138 per-curve arrays for the five class-invariant families
      and for F4b. The Red Team independently re-derived, programmatically,
      that elimination.polynomial equals x3^3+a*x3+b verbatim on 276/276
      sampled curves and confirmed the D-4 predicate defect (RUN-ICINV-geom-m3
      superseded by -v2) touched no primary invariant, by direct diff of all
      138 curves rather than accepting the execution report's word. Neither
      review found a defect in the computation of the five class-invariant
      families (F1 S3 support, F2 Betti table, F2b regularity, F3 singular
      locus, F4 elimination degree).
    - >-
      F4b (elimination F_p-factorisation type) is WITHDRAWN as a novel
      isogeny-class finding, on independently-verified mechanistic grounds,
      not merely on a diversity-comparison heuristic. Both reviewers
      independently established, by exact algebraic re-derivation across all
      276 sampled curves (not statistical correlation), that
      elimination.polynomial is verbatim the curve's own Weierstrass right-
      hand side x3^3+a*x3+b, and that factorisation_type corresponds with
      ZERO exceptions to two_torsion_x_count, a quantity
      harness/exp_icinv.py already computes (committed 2026-08-07, three days
      before this contract) with a docstring that already states this
      quantity "is NOT an isogeny-class invariant". The expensive
      Groebner/elimination pipeline (~270s per full run, Sage/Singular/
      msolve) reproduces exactly a fact already computable in milliseconds
      with no Semaev polynomial, ideal, or Groebner basis. This is recorded
      as a genuine and useful NEGATIVE result about WHICH ROUTE measures the
      quantity, not as a failure of the experiment: the D-4 predicate defect
      that superseded RUN-ICINV-geom-m3 is unrelated and independently
      confirmed to have left the 66/72 split, the verdict, and every primary
      invariant untouched.
    - >-
      Against H-ICINV-d5e351's own pre-declared falsification branches: for
      F2/F2b/F3/F4 (elimination DEGREE), the control set is ALSO constant at
      the identical single value, which is H1's own F2 branch verbatim --
      constancy explained by S_3's shape, not by isogeny-class membership, so
      no closure of the d_reg axis is licensed for these four functionals
      specifically. This is a scoped negative on those four functionals, not
      an isogeny-class-invariance discovery. For F1 (S3 support), the
      class-constant/control-varying pattern matches H1's F3 branch, but the
      constancy was already ANALYTICALLY DERIVED in H-ICINV-d5e351's own
      mechanism (STEP 1, from T4: D_0=-59 forces a_i != 0 != b_i on every
      member) and pre-registered as a correctness gate, not a discovery --
      confirming it is a passed check, not new evidence.
    - >-
      Net: the five genuinely-new-computation families (F1-F4) are class-
      invariant, gauge-invariant, order-independent, cross-backend confirmed,
      and not a Koszul degeneration -- a real, independently reviewed result
      about the f_V-free Jacobian ideal's structure on this class -- but four
      of the five are shown uninformative for isogeny-class closure
      specifically (control-constant too), and the fifth (S3 support) was a
      pre-derived correctness check. The sixth family (F4b), the only
      candidate that looked like within-class variance exceeding a matched
      null, is withdrawn as carrying no information beyond a pre-existing,
      already-known-non-invariant quantity. C2 is therefore NOT discharged in
      either direction: no functional surviving scrutiny shows informative
      within-class variance, and no scoped negative closing RQ-ICINV-475b5e
      as a whole (across all functionals and arities) is recorded either.
    - >-
      DISPOSITION: `refine`. Neither H-ICINV-d5e351 nor RQ-ICINV-475b5e
      changes status. What this archive refines is (i) the experiment's
      scope -- five families are confirmed class-invariant but four of them
      are shown to carry no isogeny-class-specific information, narrowing
      what future work on this ideal-and-grading combination can expect to
      find -- and (ii) the campaign's understanding of what F4b actually
      measures, redirecting future effort away from repeating this expensive
      Groebner/elimination route for that specific quantity and toward the
      cheap zero-Groebner checks the Red Team names in A6.
    - >-
      A witness-curve error in THIS Coordinator's OWN commit-message prose at
      1721063e4 is corrected in CORR-20260810-676b0d: the message stated
      (a,b)=(17,1345) has 0 F_p-rational points; it has 6. The curve with 0
      rational points, which the D-4 diagnosis actually rests on, is
      (a,b)=(148,2766). No run artifact was ever wrong -- only this
      Coordinator's prior prose. The same correction records two further
      record-quality findings, not status changes: a SOURCE-REPRODUCIBILITY
      GAP (two of three harness/exp_icinv_geometry.py source versions used
      across the five completed runs -- including the version behind the
      PRIMARY m3-v2 result -- are not git-recoverable, only hash-pinned) and
      a STATUS-LABEL DISCREPANCY on RUN-ICINV-geom-m4 (manifest.yaml:
      completed_invalid; execution_report.md's table: failed_infrastructure
      -- the same underlying disk-exhaustion event, both consistent with
      AGENTS.md rule 5, a documentation-layer inconsistency and not a
      substantive disagreement).

  evidence_refs:
    - EV-ICINV-343679
    - CORR-20260810-676b0d
    - coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/reviews/validator/validation_report.yaml
    - coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/reviews/red-team/red_team_report.md
    - experiments/EXP-ICINV-e0cd8f/execution_report.md
    - ledger/hypotheses/H-ICINV-d5e351.yaml
    - harness/exp_icinv.py

  limitations:
    - >-
      TOY SCALE, CLAIM_TIER TOY, SOTA_DELTA ZERO. One prime (p=4001), one
      isogeny class (t=30, D_0=-59), 138 curves, arities {3,4}. No ECDLP
      claim in either direction anywhere in this decision or any cited
      record. The withdrawal of F4b as a novel finding is stated plainly and
      is NOT softened: it carries zero information beyond
      two_torsion_x_count on this evidence.
    - >-
      C2, GOAL-ENDO-001's gating completion criterion for RQ-ICINV-475b5e, IS
      NOT DISCHARGED by this archive. The withdrawn F4b family was the only
      candidate this experiment produced for within-class variance exceeding
      a matched null, and it is withdrawn; no scoped negative closing the
      lane as a whole is recorded either -- only four specific functionals
      are shown uninformative at this one class and prime. C1, C3, C4
      unaffected by this archive.
    - >-
      NO QUORUM IS GATHERED OR CLAIMED. This decision rests on the committed
      Coordinator decision and its cited evidence alone, per AGENTS.md's
      goal-closure-quorum suspension. This decision does not close any goal,
      hypothesis, or research direction, so the suspension's closure-specific
      weight does not bear on it in any case.
    - >-
      REVIEW-INDEPENDENCE LIMITS, CARRIED FORWARD AND NOT PRESENTED AS
      INDEPENDENT-MODEL CORROBORATION. Both the Validator and the Red Team
      resolved, per their own inference blocks, to models on the SAME
      Anthropic backend as the reviewed run (which itself answered on
      claude-opus-5 per its own D-1 disclosure) and as this Coordinator's own
      session. "Independent" throughout means independent session, context,
      and a from-scratch reading of committed artifacts -- not independent
      judgement from a materially different model family. The Validator
      additionally could not confirm its own policy resolution
      (review-adversarial should resolve to opus-5/xhigh; that session
      self-declared claude-sonnet-5), recorded as `model_verified: false`
      rather than silently treated as satisfied; accepted on the strength of
      its concrete, independently-reproduced, deterministic recomputations
      per AGENTS.md's provision that review-adversarial (unlike
      review-breakthrough) is degradable when the degradation is recorded.
    - >-
      C-CENSUS GAP (unchanged from the experiment's own record): the
      138-member class enumeration was not independently re-derived by
      either reviewer, only internally cross-checked by this Coordinator
      against a previously-committed reference. D-3 GAP: true per-curve
      2-volcano level remains uncomputed; only the class-wide histogram
      exists. Neither gap is closed by this archive; both are named as N15
      next steps below.
    - >-
      This decision does not change H-ICINV-d5e351's `status` (remains
      `specified`) or RQ-ICINV-475b5e's disposition, and does not edit
      execution_report.md, any run artifact, or either review report
      (AGENTS.md rule 4; corrections supersede by reference only, per
      CORR-20260810-676b0d).

  next_actions:
    - >-
      N15(i) -- Close the D-3 volcano-level gap via Velu 2-isogeny-graph
      construction on the already-certified 138-member census (the campaign
      already has an isogeny-construction instrument from prior lanes), then
      cross-tabulate true per-curve level against F4b/two_torsion_x_count. No
      new Semaev/Groebner computation required.
    - >-
      N15(ii) -- Test whether the class-wide ABSENCE of the irreducible-cubic
      ((3,), two_torsion_x_count=0) factorisation type among these 138 curves
      is CM-theoretic (D_0's splitting behaviour at 2) or a 138-curve sample
      artifact, by repeating the same trivial x^3+ax+b root-count check
      (already available in harness/exp_icinv.py, no new Groebner code
      needed) on 2-3 further classes with different D_0 2-splitting
      behaviour.
    - >-
      N16 (harness-hygiene, NOT research work, for a future maintenance
      session) -- the source-reproducibility gap CORR-20260810-676b0d found
      is a repeatable failure mode: an Executor's working script can be
      rewritten multiple times across a run sequence with no intermediate
      commit, so only the LAST version reached becomes git-recoverable even
      though every run's manifest claims a pinned, reproducible hash.
      Consider requiring a source commit (or a content-addressed archive
      outside git) after EVERY run, not just at task end.
    - >-
      BATCH-d7e255 remains OPEN. Dispatch EXP-INSTR-36c8cf next (already
      approved, blocking for EXP-JINV-bd141d and EXP-VOLC-9f5571 under
      GOAL-ENDO-001 criterion C4); RQ-ICINV-475b5e remains PAUSED for
      EXP-ICINV-4d33aa pending v4 resolution of F-V1.4, unaffected by this
      archive (a different, unrelated contract).
    - >-
      N7/N13/N14/N11 from prior batches are UNCHANGED by this archive; do not
      re-dispatch or re-litigate them here.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This decision is `refine`, not `support` or `reject_scoped`, so the
      mandatory promotion gate does not fire. Independently, no promotion
      would be warranted on the merits even if it did: evidence strength is
      `preliminary` (below the `replicated`/`strong` threshold), the one
      candidate for a decisive class-level finding (F4b) is explicitly
      withdrawn on this same evidence, the C-CENSUS and D-3 gaps remain open,
      and cross-class replication of the "no closure via these four
      functionals" and "F4b == two_torsion_x_count" observations (Red Team
      A6, N15(ii) above) has not yet been attempted. A future decision, after
      N15's cross-tabulation and cross-class replication, is the earliest
      point at which a KN-FIND (e.g. on the F4b/two_torsion_x_count identity
      as a reusable methodological lesson -- expensive Semaev-elimination
      routes should be checked against cheap classical covariates before
      being trusted as novel) would be warranted.

  decided_by: coordinator
  decided_at: '2026-08-10'

  inference:
    requested_policy: coordinator-orchestration
    resolved_model_id: claude-sonnet-5
    reasoning_effort: high
    fallback_used: true
    fallback_reason: >-
      This Claude Code harness cannot resolve the policy aliases in
      orchestration/model-policies.yaml at subagent level (`model: inherit`
      in every .claude/agents/*.md); every alias falls back to the one model
      this session runs on (CLAUDE.md, "Model policy note"). Standing,
      harness-wide, not a per-task discretionary substitution; refused rather
      than downgraded per the handoff's explicit instruction.
    degraded_allowed: false
    degraded_requirements: []
    model_verified: false
    model_verified_reason: >-
      This coordinator subagent has no Bash tool and cannot run
      `python3 -m orchestration.adapter doctor --probe`; the identifier
      recorded is the session's self-declared runtime identity only.
    executed_runs: 0
