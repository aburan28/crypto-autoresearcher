coordinator_decision:
  id: DEC-20260908-e19a04
  context: >-
    /design-experiment invoked with no named proposal (2026-09-08). Per that
    skill's own instructions and AGENTS.md rule 11 ("ECC comes first"), the
    Coordinator selected the next justified candidate from 354 open ECC-area
    proposals (orchestration/research-priority.yaml declares every area in the
    candidate pool ECC, so priority among them was decided by research
    judgment, not by area token) without renewed per-idea user approval.
    Selected IDEA-20260904-742c48 (RQ-ECDLP-165d4b, GOAL-ECDLP-001): a
    correction to the endomorphism-evaluation cost term in the standing
    endomorphism-orbit rho closure (IDEA-20260901-6b63a4's C1), converted into
    hypothesis H-ECDLP-9f3c7a and frozen, approved experiment contract
    EXP-ECDLP-b2e5d1.
  decision: approve
  target_ids: [H-ECDLP-9f3c7a, EXP-ECDLP-b2e5d1, IDEA-20260904-742c48]
  decided_by: coordinator
  decided_at: '2026-09-08'

  user_authorization:
    source: AGENTS.md
    declared: '2026-09-06'
    scope: >-
      CLAUDE.md "Research budgets: progress first" and the /design-experiment
      skill's own procedure text ("the Coordinator ranks open proposals and
      selects the next justified candidate ... under AGENTS.md standing user
      authorization. Do not ask for per-idea selection or approval") together
      constitute standing authorization for complete idea selection, hypothesis
      authoring, protocol design, and approval of a frozen experiment contract
      with null or advisory budget fields. No renewed user approval was sought
      or required for this selection or this approval.

  rationale:
    - >-
      IDEA-20260904-742c48 corrects an existing internal closure
      (IDEA-20260901-6b63a4's C1, which prices non-unit endomorphism
      evaluation at Omega(n) uniformly) rather than proposing a fresh
      speculative mechanism, and the correction makes the closure STRONGER,
      not weaker if Reading 1 holds -- the "closure that survives its own
      best-case cost model" standard of docs/inventor-protocol.md section 4.
    - >-
      Its decisive test is cheap and sharply discriminating: Stage 0 (zero
      compute derivation, reviewable before any run) plus Stage 1/3 (one
      microbenchmark and one planted-cost-ratio dial at 16-20 bits, under an
      hour per the source proposal's own compute_budget_note) decide the
      entire orbit-lane ceiling.
    - >-
      It is paired, in the same contract, with a genuine heuristic-validation
      experiment at cryptographic scale (Stage 4: 256- and 384-bit
      discriminant norm-form sampling against the Dickman-de Bruijn
      prediction, with matched random-integer null and explicit tail checks),
      reached via a sampling shortcut needing no curve construction -- the
      A7/target-result-profile pattern this program is directed to bias
      toward, and the pairing AGENTS.md requires for a conditional result.
    - >-
      Every citation the core algebra depends on is either read in full this
      session (IDEA-20260901-6b63a4, KN-TECH-018, KN-TECH-005, KN-TECH-031)
      or independently checked by the experiment itself (Velu-composition
      evaluation cost, Canfield-Erdos-Pomerance/Dickman-de Bruijn, genus
      theory) -- no unverified external citation is load-bearing for the
      derivation.
    - >-
      Dedup check performed and negative: none of the 8 existing H-ECDLP-*
      hypotheses under RQ-ECDLP-165d4b (f6d060, ff38dc, e42bda, 80fceb,
      63d136, 63eecd, 1853dc, 24d15c -- all a supersession chain testing the
      UNIT-automorphism rho-quotient case) covers endomorphism-evaluation
      cost, and no experiment under experiments/EXP-ECDLP-*/ references this
      idea or IDEA-20260901-6b63a4.
    - >-
      A near-neighbour candidate, IDEA-20260829-882739 (special-j exit-
      boundary correction, RQ-ECDLP-912694), was explicitly considered and
      NOT selected because its content is already substantially designed into
      the existing, unapproved contract EXP-ECDLP-6ecca1 (status
      review_required, approved_by null, derived from the sibling proposal
      IDEA-20260812-c49409): that contract's Stage 4/5 (Arm S) already carries
      "an F_p-rational isogeny of odd degree ell>3 whose codomain still has
      |Aut|=6" as an explicit falsification criterion for the same D2 claim
      882739 targets. Designing a second contract there would duplicate
      EXP-ECDLP-6ecca1 rather than add a distinguishing test.
    - >-
      IDEA-20260904-cb1199 (Galbraith transfer-exponent crossover, same RQ)
      was set aside for this decision, not closed, because its central
      quantitative claim leans on an external 2025 result read only at
      abstract level (search-result summaries; the primary source returned a
      block page on retrieval), a heavier external dependency than the
      selected candidate.
    - >-
      IDEA-20260904-ab226c (class-level census occupancy, same RQ) is a
      strong, self-contained alternative that was NOT selected only because a
      single Coordinator engagement designs one experiment; it remains
      available, undesignated, for the next RQ-ECDLP-165d4b design task.

  ranking:
    ahead_of_doing_nothing: >-
      RQ-ECDLP-165d4b's endomorphism-orbit arm has an active internal cost
      dispute (this proposal argues the standing closure's cost model is
      wrong) that a single microbenchmark plus a planted dial resolves at
      trivial compute; designing it now converts an open algebraic
      disagreement into a checkable protocol rather than leaving it
      unresolved in the proposal pool.
    comparison_scope: >-
      Comparison among the small set of concretely falsifiable, non-
      duplicative, reasonably-costed RQ-ECDLP-165d4b and RQ-ECDLP-912694
      candidates actually read in full this session (four proposals plus the
      existing H-ECDLP-3cf1d8/EXP-ECDLP-6ecca1 pair); not a claim of global
      portfolio optimality over all 354 open ideas.
    other_leads: >-
      IDEA-20260904-ab226c and IDEA-20260904-cb1199 remain open and ranked;
      neither is deprioritized or closed by this decision. EXP-ECDLP-6ecca1's
      own approval remains a separate, still-open Coordinator action.

  target_class_assessment: >-
    Scored against docs/target-result-profile.md Part C. C1/C2: NO -- this is
    explicitly a constant-factor closure/correction (claim_kind:
    constant_factor), not an exponent-moving direction; disclosed as a
    limitation in the hypothesis's own selection_rationale rather than
    presented as more than it is. C3-C5: heuristic HEUR-9f3c7a-01 is numbered,
    formally quantified with a stated uniformity range, and justified by a
    rigorous genus-theory/lattice-point-count bound composed with the
    classical Canfield-Erdos-Pomerance/Dickman-de Bruijn distribution theorem.
    C6-C11: the proof_search_map in H-ECDLP-9f3c7a supplies a named
    bottleneck, a frozen baseline embedding with a reproduction check, an
    executed observation-collision search, an explicit quantifier order, a
    method ceiling with a nearby-object (supersingular) control, and proof
    obligations tagged by responsibility (runtime/correctness/strictness/
    size/baseline/interface/scope) per Part B. C12: a heuristic-validation
    experiment at 256/384-bit discriminants with sampling method, sample
    sizes, distributional prediction, and tail checks is included (Stage 4).
    C13-C16: NOT included in this contract -- a concrete-cost table,
    time-memory tradeoff statement and affected/safe scope statement are
    deferred to the evidence-review decision after Stage 1's run, since this
    is a design/approval decision, not a promotion decision; this hypothesis
    may reach `analyzed` on this contract's results but not `supported`
    without a separate concrete-cost artifact per templates/research-records.md.

  proof_search_map_audit: >-
    Audited against KN-TECH-080 before approval, per the approval_gate note in
    EXP-ECDLP-b2e5d1. The four cheap pre-compute audits are present and
    non-vacuous: (1) baseline reproduction names the unit-automorphism slice
    and a symbolic + frozen-fixture check against EV-ENDO-10109d; (2)
    observation collision names the observable (gamma, G_max) and searches for
    -- and finds -- two genuine collision risks (isolated-timing versus
    end-to-end-difference measurement of gamma; overstated c_step versus a
    genuinely marginal map), each with a stated blocking separating condition;
    (3) quantifier order is stated explicitly with FOR ALL/THERE EXISTS and an
    explicit statement of what is NOT claimed; (4) method ceiling states the
    strongest certifiable claim and a nearby-object control (the supersingular
    curve) with a stated failure signature. No audit was skipped or answered
    with a bare "not applicable".

  evidence_refs:
    - ledger/proposals/IDEA-20260904-742c48.yaml
    - ledger/hypotheses/H-ECDLP-9f3c7a.yaml
    - experiments/EXP-ECDLP-b2e5d1/specification.yaml
    - ledger/proposals/IDEA-20260901-6b63a4.yaml
    - ledger/proposals/IDEA-20260829-882739.yaml
    - experiments/EXP-ECDLP-6ecca1/specification.yaml
    - ledger/hypotheses/H-ECDLP-3cf1d8.yaml
    - ledger/proposals/IDEA-20260904-ab226c.yaml
    - ledger/proposals/IDEA-20260904-cb1199.yaml
    - knowledge/techniques/KN-TECH-018.md
    - knowledge/techniques/KN-TECH-005.md
    - docs/target-result-profile.md
    - docs/inventor-protocol.md

  limitations:
    - >-
      This decision approves a PROTOCOL. No run has been executed under
      EXP-ECDLP-b2e5d1; no gamma, no smooth-split fraction, no KS statistic
      and no reading (1 or 2) has been observed. Nothing here is evidence
      about the endomorphism-orbit lane's actual ceiling.
    - >-
      Approval is not a claim that the hypothesis's derivations (the
      corrected cost formula, the ceiling G_max, the break-even inequality)
      are correct -- they are labelled `derivation` per
      docs/claims-and-verification.md and are themselves checked
      symbolically at Stage 0 and empirically at Stages 1-6 of the approved
      contract.
    - >-
      Best possible outcome under either reading is a constant-factor
      statement; no exponent of the ECDLP moves regardless of the result.
    - >-
      This decision does not close, deprioritize, or rule on
      EXP-ECDLP-6ecca1 (still review_required, approved_by null) or on
      IDEA-20260904-ab226c / IDEA-20260904-cb1199, all of which remain open
      Coordinator actions.
    - >-
      A Reading-2 outcome (gamma_min < 0.25 on any tested curve) is NOT
      pre-approved for any use beyond this contract's own reporting; it
      requires a separate independent-validation and red-team-review decision
      before escalation, per the approval_gate recorded in the contract.

  next_actions:
    - >-
      Dispatch TASK-20260908-c7f382 to the executor to run EXP-ECDLP-b2e5d1
      per its frozen Stage 0-7 procedure.
    - >-
      After the run, open an evidence-review round (per /review-evidence) that
      independently verifies the manifest, the certificate verification
      fraction, and the Reading 1/2 classification before any evidence record
      or hypothesis-status transition is written.
    - >-
      Separately, rule on EXP-ECDLP-6ecca1's outstanding approval gate
      (review_required since 2026-08-25) -- it is a distinct, already-designed
      contract on RQ-ECDLP-912694 and does not require this decision to
      proceed.
    - >-
      Rank IDEA-20260904-ab226c as the next RQ-ECDLP-165d4b design candidate
      for a subsequent /design-experiment engagement.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is a protocol-approval decision, not an evidence-review decision;
      no run has been observed and no hypothesis status has moved past
      `proposed`. Per templates/research-records.md, knowledge promotion
      applies to evidence-review decisions of strength replicated/strong;
      there is no evidence to promote yet.

  review_plan: null
