          designs, so an exclusion by this procedure does not by itself
          falsify the model. The rho known-answer slice passes.
    prior_comparison: >-
      Prior (recorded before any report, after reading the producer's report,
      plan PD-1). J1-J3 are confirmed. J5 is confirmed. J4 is confirmed in
      direction and exceeded in strength: the family-wise rate is 0.57-0.61,
      not 0.2-0.4, and the event is seed- and order-contingent, which the
      prior did not anticipate. The prior's J4 expectation ("supports at most
      a scoped weaken") is therefore revised down to "supports no adverse
      reading". J6 is partly overturned: the stopping rule does not explain
      the m = 7 rejection, and undeclared conventions move the outcome id.
    whole_claim_reading: >-
      The run is valid, and the frozen outcome is correctly computed. The
      frozen outcome does not discriminate between the even-m gap value 1/12
      and an excess of order 0.02-0.03 on these rows. Neither direction is
      supported. See EV-PFDR-cf6ee5 inference.

  rationale:
    - >-
      Why not weaken (the ceiling). "May weaken" in the outcome table is a
      permission, not a requirement. A weaken needs an adverse event that
      carries weight. This one does not. The S6 lower end exceeds 1/12 by
      0.0008, within the endpoint's own Monte Carlo s.d. of 0.00069, and at
      2e6 replicates the interval contains 1/12 (M1). Sorting the rows
      removes the exclusion (G-1), and 35% of bootstrap seeds give
      OUT-CONSISTENT (J4-c). The procedure excludes true values in most
      eight-series families (J4-b, proves_too_much). Recording a weaken on
      it would be the overread that joint J4 was designed to detect.
    - >-
      Why not replicate as the decision itself. The red team shows that no
      zero-run re-read of these rows can separate 1/12 from 1/12 + 0.03;
      only new rows can. A replication is therefore warranted as a separate
      design act (NA-3), ranked against other work. It is not a
      re-execution of this experiment.
    - >-
      Why not support. The success criterion was not met. F-1's non-firing
      depends on two declared conventions (J6 A-S-table, A3a). The
      hypothesis carries an asymptotic claim, which may not move toward
      supported without the four promotion gates; this experiment supplies
      part of gate 2 at most.
    - >-
      Why inconclusive. The evidence-hierarchy definition applies: the data
      do not distinguish the relevant explanations. This is said plainly in
      EV-PFDR-cf6ee5 and here.
    - >-
      Target profile (docs/target-result-profile.md). The floor check is a
      calibration of a generic lower bound on a toy engine, not an
      exponent-moving mechanism for ECDLP. The exponent-relevant reading in
      this lane is the kappa census (EXP-PFDR-1b78f7), which reads its floor
      constants against the archived Stage 0 fits. So NA-4 takes precedence
      over NA-3 in the roadmap.

