coordinator_decision:
  id: DEC-20260806-0c1e35
  goal_id: GOAL-MLKEM-003
  batch_id: BATCH-e41719
  evidence_id: EV-MLKEM-26cf46
  recorded_by_task: TASK-20260806-95eeea
  archive_kind: ledger
  recorded_at: '2026-08-06'
  decision: refine
  decision_label: deficit_survives_joint_nulls_on_a_tested_exclusion_published_calibration_corrected

  context: >-
    BATCH-e41719 tested the largest named threat to this lane's only surviving
    positive finding. BATCH-017's validator had established that N2 is the
    PER-CELL minimum-variance member and not the joint one, and that neither
    existing null carries cross-cell dependence while the physical process
    couples cells within an iteration. The Coordinator dispatched the batch on
    the hypothesis that the sub-Poisson deficit might therefore be an artifact of
    the independence assumption.

  central_adjudication: >-
    THE FINDING SURVIVES, THE ARGUMENT FOR IT IS REPLACED, AND MY DISPATCHING
    HYPOTHESIS WAS AIMED AT THE WRONG SIGN. The deficit holds against every joint
    null in the iteration-budget family under five independent constructions
    across two parties (z = -2.82 to -2.98), and the observed statistics reproduce
    to eight significant figures through a pipeline that never imported the prior
    module. But the producer's reason -- that coupling structurally CANNOT rescue
    the rejection because variance is pinned by the marginals -- IS FALSE AS
    STATED, because the (1 - h) correction is derived under independence and
    off-diagonals do enter the null mean. The validator supplied the excluded
    construction, showed it DOES rescue at r = +0.60, and then EXCLUDED IT FROM
    THE DATA AT ABOUT 9 SD on the Pearson-residual autocorrelation. That is a
    strictly better outcome than the one claimed: the finding now rests on a
    tested exclusion rather than on an assumed impossibility. Separately the
    batch found that a number this program PUBLISHED is wrong -- the model-free
    statistic's null expectation is not 1 -- and correcting it makes the finding
    stronger while inverting one archived row. `refine`: the claim is kept and
    strengthened, its argument is replaced, one prior record is superseded in two
    places, and two escapes are left explicitly open.

  what_survives:
    - >-
      The 164-cell low-occupancy deficit, mean t = 0.681097, at z = -2.84 (JN-2)
      and -2.82 (JN-3) from the producer and -2.98, -2.90, -2.88 from the
      validator's three further constructions, against -2.69 to -2.82 for the
      independence nulls. Analytic null means with no Monte Carlo confirm.
    - >-
      The model-free detrended var/mean, at CORRECTED calibration: about -2.8
      (validator) or -3.36 (Coordinator) at L = 100, stronger than the -2.40 the
      published wording implied.
    - >-
      EV-MLKEM-890e2a W-1's core -- the low-occupancy test, the quartile
      gradient, the leverage restriction -- and EV-MLKEM-ee220e W-4. The
      counterfactual that would have retracted them did not occur.

  what_is_struck_or_superseded:
    - >-
      The producer's pinning identity, that coupling cannot move the null mean.
      FALSE AS STATED. It holds for JN-2 and JN-3 only because their coupling is
      RANK-ONE and the degree-5 residual projection annihilates it, with analytic
      shifts of -3.2e-4 and under 1e-6 -- a reason the producer did not give.
    - >-
      EV-MLKEM-890e2a W-1's clause "against an expectation of 1 with sampling sd
      0.29, 0.20 and 0.14", and the same wording in DEC-20260803-95176a.
      SUPERSEDED by EV-MLKEM-26cf46 J-7. The expectation exceeds 1 and grows with
      the window; L = 150's archived 1.551 inverts from apparent excess to about
      0.9 sd below its own null.
    - >-
      EV-MLKEM-890e2a W-11's attribution that the rounded-Gaussian sampler is
      "undisclosed in BOTH BATCH-015 and BATCH-017". FALSE for BATCH-015, whose
      report.md carries a section headed "Sampler approximations, disclosed". The
      substance of the defect stands; the attribution does not.
    - >-
      The producer's claim that JN-3 is the joint minimum-variance object. It is
      not: a design constraining the subset count per iteration reaches a variance
      ratio 5.8x tighter. BATCH-017 W-10's gap is NOT closed.
    - >-
      The producer's JN-4 sigma = 0.20 row (z = -1.87). Does not reproduce:
      -2.10 and -2.15 at 2000 replicates over two seeds, empirical tails 0.006 and
      0.007. A Gaussian z overstates the rescue on a right-skewed null.

  weighing_of_the_review: >-
    Accepted in full.
    (1) V-1 IS THE BEST SINGLE PIECE OF WORK THIS GOAL HAS RECEIVED. It refuted
    the central argument of the package it was reviewing, constructed the
    counterexample that argument excluded, showed the counterexample actually
    rescues the rejection, and then killed the counterexample from the data at
    9 sd using a statistic the producer had already computed for another purpose.
    That is the difference between confirming a conclusion and establishing it.
    (2) IT CORRECTED THE COORDINATOR TWICE. J-7 corrects a calibration I
    published in EV-MLKEM-890e2a and repeated in DEC-20260803-95176a; J-11
    corrects an attribution I published in the same record. Both were surfaced
    from below -- J-11 by the producer, J-7 by the producer and then derived
    analytically by the validator.
    (3) MY DISPATCHING HYPOTHESIS WAS AIMED AT THE WRONG SIGN, and the batch is
    more valuable for it. I sent it to ask whether NEGATIVE cross-cell dependence
    manufactured the deficit. Negative dependence narrows the null and makes the
    deficit MORE significant; only POSITIVE coupling can rescue, which I did not
    name. The batch found the real exposure anyway. This is the seventh
    Coordinator premise in this goal to be falsified or misdirected downstream.
    (4) J-6 IS AN HONEST NEGATIVE AND IS RECORDED PROMINENTLY. The validator
    searched for a second statistic discriminating the positive-coupling rescue
    from independence and FAILED, reporting the failure and the 0.1-0.4 sd
    separation rather than quietly omitting it.
    (5) THE JN-4 RULING IS THE STANDING BINDINGS DOING THEIR JOB. Ruling it an
    alternative rather than a null rests partly on binding (g): sigma was chosen
    to cross -2, and a minimum over a family is not the expected value of the
    statistic.

  hypothesis_status_changes: []
  hypothesis_status_note: >-
    No hypothesis moves. A dispersion deficit on one toy-dimension file, with an
    unidentifiable mechanism, a contrary second file, an unbuilt joint
    minimum-variance object and an unfitted competing alternative, carries no
    transition in either direction. Strength stays `preliminary` and NOT
    `replicated`: five constructions and two parties have re-measured ONE
    archived dataset, and re-analysis of the same bytes is not replication of the
    experiment.

  rule_12_status: >-
    UNMET AND UNWAIVED. Nothing here changes EV-MLKEM-011, EV-MLKEM-013 or
    EV-MLKEM-017; KN-FIND-031 stays withdrawn.

  binding_instructions_for_this_goal:
    - >-
      A STATISTIC'S NULL MEAN IS PART OF THE STATISTIC. Never quote a
      goodness-of-fit or dispersion reading against an ASSUMED expectation of 1;
      measure or derive the null mean under the same construction that produced
      the observation. This program quoted "against an expectation of 1" for two
      batches on a statistic whose expectation reaches 1.14 to 1.26 at L = 100
      and 1.75 to 4.46 at L = 150. This is the fourth binding of the same shape:
      nominal-versus-effective degrees of freedom, nominal-versus-effective design
      size, marginal-versus-joint tests, and now assumed-versus-derived null mean.
    - >-
      "MODEL-FREE" DESCRIBES A NUMERATOR, NOT A TEST. If a statistic needs no
      rate model for its observed value but needs one for its reference, say so
      whenever the phrase is used. The two independent calibrations here differ by
      a factor of 2.5 at L = 150.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      `refine` on `preliminary` evidence fails the gate, which needs `support` or
      `reject_scoped` at `replicated` or `strong`, and the hypothesis_status_note
      above explains why `replicated` is not available on re-analysis of one
      archived dataset. The transferable candidate is now sharp enough to name
      precisely, and is carried forward rather than promoted: an
      independence-derived leverage correction embedded in a test statistic makes
      the null MEAN sensitive to cross-cell dependence, so an argument that
      "variance is pinned by the marginals" is not sufficient to show a coupling
      class is harmless -- the harmlessness must be shown per coupling structure,
      and rank-one coupling is harmless for a reason that does not generalise.
      Promoting this on one execution plus one validation would be the error the
      rule itself describes.

  non_claims:
    - ML-KEM is not broken. Nothing here bears on ML-KEM security in either direction.
    - KN-OPEN-016 remains open.
    - >-
      Approximation 4.9 is neither validated nor refuted. This batch measured the
      dispersion of the archived counting process, not the model.
    - >-
      The mechanism of the deficit is NOT identified, and this design CANNOT
      identify it: occupancy and score position are inseparable here under all 24
      specifications tried, and the cross-file contrast reverses sign on this
      lane's own declared scale.
    - >-
      The positive-coupling alternative is NOT excluded as a model. It is
      excluded as a TUNED FAMILY, and it has never been fitted.
    - No asymptotic claim advanced. No closure quorum asserted.

  next_actions:
    - >-
      Next batch, zero new sampling: FIT the competing alternative instead of
      tuning it. The validator ruled the log-normal AR(1) random-dispersion
      process an ALTERNATIVE rather than a null, on four grounds of which the
      sharpest is that sigma was CHOSEN to make z cross -2 -- a minimum over a
      family, which standing binding (g) forbids reading as the value of the
      statistic. The legitimate version has never been done. Fit (sigma, ell) by
      maximum likelihood, compare it against the independence model on a proper
      criterion with the parameter count paid for, and report which the data
      prefer. This is the move that decides between two genuinely different
      mechanisms -- sub-Poisson counting versus spatially smooth random
      dispersion -- and it converts the last live escape from an untested
      possibility into a measured comparison. Pair it with the joint
      minimum-variance object J-4 says is still unbuilt: the subset-count-
      constrained design reaching a variance ratio of 0.1588, which BATCH-017 W-10
      asked for and neither batch has delivered. Its direction is conservative, so
      it cannot overturn the finding, but leaving a named object unbuilt across
      three batches is how a program accumulates unexamined premises. REQUIRE AN
      INDEPENDENT VALIDATION IN THE SAME BATCH, and require an `inference` block
      in every machine-readable artifact, closing V-5.

