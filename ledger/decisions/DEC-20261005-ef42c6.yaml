# =============================================================================
# DEC-20261005-ef42c6 -- REVISION of the stranded-stack repair specification
# (DEC-20261005-040d37 C2), absorbing the G-1 stop of TASK-20261005-b73fd8.
#
# WHAT STOPPED. TASK-20261005-b73fd8 executed G-1 correctly and stopped before
# any repair write: the inventory maps 7 distinct CI error lines (16
# occurrences) to S1-S4 but leaves 86 distinct UNMAPPED lines (241
# occurrences); 31 of 32 conflicted PRs conflict with main outside S5, several
# as add/add conflicts inside immutable records (H-BINSTD-ce918e, -5c4afb,
# -39a59f, -b334a6, H-CERTBIN-4d3853 and EXP specifications), which is S5's own
# stop condition. Under G-1 no repair write was made. Only S6 completed
# (#1663 closed as redundant with #1667). The specification, not the
# executor, is what ran out: DEC-20261005-040d37 C2 did not pre-authorize a
# classification pass for unmapped CI lines, and S5 names the immutable-record
# remedy ("a superseding record under a new id that the Coordinator authors")
# without a mechanism card that scales it past a single PR.
#
# WHAT THIS DECISION DOES. It extends the repair specification with two new
# item classes (S9, S10), converts the G-1 stop into a phased follow-on card
# (TASK-20261005-fae96b, which subsumes the unexecuted remainder of
# TASK-20261005-b73fd8 and takes its G-1 inventory as an input), and changes
# nothing else. No research status, hypothesis, evidence, experiment or goal
# status changes. No verdict is re-judged. G-6 (merging is not endorsing)
# stands for every record the repair makes durable.
#
# RANKING CONTEXT. This is the ranked act 2 of DEC-20261005-7a74e9
# ("Repair and merge the stranded BINSTD/CERTBIN evidence stacks") resumed:
# evidence that is not on main does not exist for the program, and the next
# GOAL-ECDLP2M-001 ranking cannot honestly re-rank without it.
# =============================================================================
coordinator_decision:
  id: DEC-20261005-ef42c6
  id_provenance: >-
    Minted with python3 tools/allocate_id.py --next coordinator_decision
    --date 20261005 and confirmed free with --check before use.
  recorded_at: '2026-10-05'
  decided_at: '2026-10-05'
  decided_by: coordinator
  archived_by: TASK-20261005-fae96b
  archived_by_note: >-
    Effective when TASK-20261005-fae96b's final ledger archive commits this
    decision and its receipt verifies. The card is WRITTEN, NOT DISPATCHED;
    the dispatching session binds its run-snapshot owner under the standing
    three preconditions before launch.
  goal_id: GOAL-ECDLP2M-001
  question_ids: [RQ-BINSTD-b6f698, RQ-CERTBIN-836ce2]
  mode: portfolio_coordination
  base_checked: db353642fa
  base_sync: >-
    git fetch origin; authored on a sparse worktree branched from origin/main
    at db353642fa with ledger/, coordination/, tools/ and knowledge/ checked
    out; experiments/ read through git only.
  standing_authorization:
    - DEC-20260906 standing user authorization for experiment design and
      execution (approval recorded under it once the contract is complete).
    - DEC-20261005-7a74e9 act 2 (repair the stranded stacks).
  decision: revise
  decision_label: >-
    REVISE THE REPAIR SPECIFICATION, NOT THE REPAIR. Absorb the G-1 stop of
    TASK-20261005-b73fd8 by adding classes S9 (diverged-branch conflict
    inside an immutable record) and S10 (non-validator CI lines) to
    DEC-20261005-040d37 C2, and by converting the stopped inventory into the
    phased card TASK-20261005-fae96b. Every remedy stays a superseding
    record. No pushed record is edited.
  target_ids:
    - DEC-20261005-040d37
    - TASK-20261005-b73fd8
    - TASK-20261005-fae96b
    - GOAL-ECDLP2M-001
  context:
    stop_report_reading: >-
      TASK-20261005-b73fd8's stop report (coordination/archives/
      TASK-20261005-b73fd8/stop-report.yaml, commit 068945b3d4) is accepted as
      a correct G-1 stop, not a failure: the card's own S8 rule ("a PR with a
      validator error not mapped to S1 to S6 stops and is reported") fired 86
      distinct times, and S5's immutable-conflict stop fired on 31 of 32
      conflicted PRs. The G-1 inventory (13,711 lines) is preserved as input.
    why_revision_not_relaunch: >-
      Restarting the same card would stop again on the same lines. The
      specification must first classify what the unmapped lines ARE, and must
      pre-authorize the Coordinator-authored supersession that S5 already
      requires but never scaled. Both are added here; the repair mechanisms
      (S1-S4, S6-S8), the lane reconciliation (C3) and the head change (C4)
      are unchanged and are not re-decided.
  revision_of_C2:
    new_items:
      - id: S9
        blocker: >-
          An add/add or content conflict inside an immutable record (hypothesis,
          evidence, decision, handoff, run file, knowledge entry, experiment
          specification) between a stranded branch and main, where the two
          pushed versions of the same path differ.
        mechanism: >-
          A superseding record under a NEW id authored by the repair session
          acting in the Coordinator role (exactly DEC-20261005-040d37 S5's
          remedy, made scalable), registered in
          tools/schema_supersession_registry.yaml. Where the divergence is
          exactly a schema-defective field, a same-id v2 record under the
          existing schema-supersession mechanism is preferred; where the two
          versions differ substantively, a new-id record supersedes BOTH, pins
          each prior sha256, and carries a divergence note stating what each
          side asserted. Never a pick-a-side edit; never a deletion; both
          pushed versions remain readable in git history and are named by
          sha256 in the registry entry.
        named_records: >-
          H-BINSTD-ce918e, H-BINSTD-5c4afb, H-BINSTD-39a59f, H-BINSTD-b334a6,
          H-CERTBIN-4d3853, and every EXP specification the inventory marks as
          add/add-conflicted (the classification in TASK-20261005-fae96b
          Phase 1 records the exact set; this list is the stop report's, not a
          ceiling).
        guardrail: >-
          If the repair session cannot state, from the two pushed versions
          alone, what each side asserted and which supersession kind applies,
          it stops on that record and reports it (G-1 unchanged). No record
          is merged on a guess.
      - id: S10
        blocker: >-
          A CI line that is not a validator error at all: workflow-level,
          environment, tooling or infrastructure failures reported by a check
          run (for example a runner or setup failure) rather than a schema or
          supersession defect in a record.
        mechanism: >-
          Recorded verbatim in the classification with its workflow, job and
          check name, and routed out of the repair: if a repository-tooling
          change is needed it becomes a normal code task requested from the
          dispatcher, never a mixed-in repair write. A PR whose only blockers
          are S10 lines is re-run once on its current head; if the lines
          persist it is reported, not repaired.
    phased_card:
      - >-
        TASK-20261005-fae96b (written in this archive, not dispatched)
        subsumes the unexecuted remainder of TASK-20261005-b73fd8: Phase 1
        classifies every unmapped CI line and every conflicted path (read-only,
        extends the existing inventory); Phase 2 commits the per-PR disposition
        table before any repair write; Phase 3 executes the S1-S4, S6, S9
        repair writes; Phase 4 merges under S7 and executes C3 and C4 exactly
        as DEC-20261005-040d37 specifies them; Phase 5 writes the ledger
        receipt. Its G-1/G-2/G-3/G-4/G-5/G-7 constraints are inherited
        verbatim from DEC-20261005-040d37 C2.
      - >-
        TASK-20261005-b73fd8's completed parts are not undone: its inventory
        and stop report remain its deliverables and TASK-20261005-fae96b's
        inputs; S6 (#1663) is already done and is not redone.
  limitations:
    - >-
      This decision authorizes record repair only. It promotes no evidence,
      changes no verdict, and merges nothing whose own archive receipt fails;
      G-6 stands. Records whose receipts are missing or failing remain
      unofficial after the merge and are listed as such.
    - >-
      The 86 unmapped lines are classified in Phase 1, not here. This
      decision does not assert what they are; it only names where each must go
      once classified.
  evidence_refs:
    - coordination/archives/TASK-20261005-b73fd8/stop-report.yaml
    - coordination/archives/TASK-20261005-b73fd8/inventory.yaml
    - ledger/decisions/DEC-20261005-040d37.yaml
    - ledger/decisions/DEC-20261005-7a74e9.yaml
  next_actions:
    - >-
      Dispatch TASK-20261005-fae96b (the dispatching session binds its
      run-snapshot owner, claims its lane, and verifies the declared inputs
      are committed and pushed before launch, per the standing three
      preconditions). Phase 1 is read-only and is the first act.
    - >-
      No new batch on GOAL-ECDLP2M-001 until the repair lands
      (DEC-20261005-7a74e9 ranking, unchanged).
  goal_checkpoint: null
  amazon_bedrock: not used and prohibited as a cost guardrail; no inference call was made in this decision.
