        justification: Already designed and run; a forced-value statistic. Any successor census carries PF-1.
      - rank: 5
        id: C-Q1c
        justification: Answered at the tested scale.
      - rank: 6
        id: N-0
        justification: Ranked below C-Q3. C-Q1a to C-Q1d are not dispatched, so this act does not need them to outrank N-0.
    winner: C-Q3
    focus_discipline: >-
      One lane. The chain is sequential and has zero runs. Idle capacity on
      GOAL-PATH-001 (max_concurrent 3, no open lane) does not justify a second
      lane for C-Q1d.
    approved_unrun_kpi: >-
      1216 of 1620 approved experiments have no run (reported, advisory). This
      act adds no approval. The later design step may add one contract and its
