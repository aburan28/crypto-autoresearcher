  # ------------------------------------------------------------------ ranking
  rerank:
    rule: >-
      ECC first (AGENTS.md "ECC comes first"). Every candidate below is under
      RQ-MONO-001, which is reported ECC, so the ECC order does not separate
      them. They are ranked by expected information gain per cost, by whether
      each is decision-changing, and by readiness. Exponent-targeting work is
      preferred over constant-cofactor work (agents/coordinator.md
      responsibility 3; docs/target-result-profile.md). A candidate is
      dispatched only if it ranks ahead of doing nothing.
    candidates:
      - id: C-Q3
        what: >-
          Re-scope IDEA-20260803-ff7415 onto KN-OPEN-62c870 Q3 and KN-FIND-007
          (idea-generator, zero runs), then design it.
        assessment:
          exponent_relevance: >-
            The only candidate in this lineage whose subject is an exponent
            statement. The 2^(n-1) compounding clause is the "would move an
            exponent" sentence of the superseded KN-FIND-c41ea9. KN-FIND-4f0d84
            reads it "only as CS-D2's untested R2 lead", and KN-OPEN-62c870
            ("Why it matters") says "the exponent-relevant content, if any, is
            Q3". The idea's own interpretation_limits say a result here "MOVES
            NO EXPONENT IN EITHER DIRECTION". Its value is to decide whether a
            clause the program's cost-model inputs carry is real.
          decision_changing: >-
            Yes, outside the completed goal. (i) GOAL-ICEX-001 carries the
            mandated relation-rate read of DEC-20260802-a51c82 ("USE THE
            FORMULA, NOT THE NUMBER"), which is silent on compounding (ff7415
            mechanism (1)). (ii) GOAL-PATH-001's own BATCH-002 checkpoint
            (icex_feed_supersession) records the clause as "it compounds as
            2^{n-1} ... where it WOULD move an exponent". (iii) Any future
            F_p-to-F_{q^n} transfer argument would inherit it. If the clause
            is diagnosed as a convention artifact, it becomes a correction that
            both heads must cite. If it survives, event identification becomes
            mandatory (ff7415 F1) before anything is read as an exponent.
          prior: >-
            Recorded before any work, so that a result that overturns it is
            visible. Most likely outcome: a convention artifact. KN-FIND-4f0d84
            CU-1 gives the fibre over the factor-base locus as 2^{m-2} sign
            classes. For an n-point decomposition the cover is S_{n+1}, so the
            count is 2^{n-1}, which is exactly the compounding factor (ff7415
            "THE ONE DESIGN DECISION THAT MATTERS"). KN-FIND-007 makes the
            multiset mean exact. Coordinator prior about 0.85 for
            CONVENTION_ARTIFACT_DIAGNOSED or CLAUSE_REFUTED_AT_TOY, and about
            0.15 for a residual that needs event identification. The index
            map m = n + 1 is a design input that 4c12dc must derive or refute
            (IG-2). It is not asserted here.
          readiness: >-
            Ideation is ready now. Design is not: DEC-20261017-12e0f4 S-2
            readiness lists three blockers: (a) an anchor on the superseded
            KN-FIND-c41ea9, (b) no target-scale sampled validation arm, and
            (c) no implementation. 4c12dc clears (a) and specifies (b). (c)
            belongs to the later design step.
          cost: >-
            One research-deep session with zero runs, plus two archives. The
            later measurement is low compute (ff7415 estimated_cost: hours).
          risks: >-
            (1) The re-scope may find the question decidable by derivation
            alone, because the ordered/multiset/sign-class ratios are
            combinatorial. That is a cheaper and stronger result, and IG-9
            asks for it. (2) Overlap with H-MONO-663fb4, which already reports
            both conventions over F_p and calls the ordered/multiset
            correspondence a declared stage (its statement and HEUR text cite
            ff7415). IG-10 checks this by key. (3) ff7415's conservation band
            may be vacuous when computed over all targets (KN-FIND-007). IG-3
            requires each metric's discriminating power to be stated.
      - id: C-Q1a
        what: >-
          H-MONO-663fb4 Fisher-combined sensitivity (parent IDEA-20260805-a9a95d).
        assessment: >-
          Designed and run. EXP-MONO-670aa6, EXP-MONO-b19c6b, EXP-MONO-b1423c
          and EXP-MONO-c819ba are completed (ledger/.index/experiments.jsonl).
          The status is supported_scoped_k3_k4_controlled_null_fisher_sensitivity_open,
          and its status_note (DEC-20260831-7d623d) records the sensitivity
          gap as "PARTIALLY CLOSED". What remains qualifies a test statistic
          on a toy controlled null. It is not decision-changing for any
          exponent or feed, and any successor census carries PF-1 (the five
          CORR-20260802-1d8384 OI-1 repairs). It ranks ahead of doing nothing
          only weakly, and it is not dispatched in this act.
      - id: C-Q1b
        what: IDEA-20260805-90df50 (root-coincidence rate on the factor-base locus).
        assessment: >-
          Not open. H-MONO-0f9170 (supported; EXP-MONO-2a13d7 completed) and
          H-MONO-45183a (supported_scoped; EXP-MONO-12ce1c completed) cite it.
          Its statistic has a forced value at fixed (N, tau) (its title). That
          is a constant-cofactor question with no exponent content, and a
          successor census carries PF-1. Not dispatched.
      - id: C-Q1c
        what: IDEA-20260831-d29a71 (CM dependence of the m=4 root-multiplicity collision rate).
        assessment: >-
          Not open. H-MONO-1d50ac is
          refuted_at_tested_scale_transversal_formula_independently_confirmed_...,
          with EXP-MONO-64aaa4 and EXP-MONO-cb905d completed. It is answered
          at the tested scale and has no exponent content. Not dispatched.
      - id: C-Q1d
        what: IDEA-20260904-a1b81b (G_R = S_3 at m = 4 behind the 1/(m-1)! factor).
        assessment: >-
          Designed, not run. H-MONO-403c01 (EXP-MONO-e102a3) and H-MONO-572e7e
          (EXP-MONO-bb6fa1) are approved and unrun. By its own claim it is
          about "a CONSTANT FACTOR in a relation-rate MODEL". Before anything
          runs, it must be checked against KN-FIND-bdcd60, whose
          symmetric-base group (Z/2)^{m-2} semidirect S_{m-1} (S_4 = AGL(2,2)
          at m = 4) may already settle G_R by derivation, given absolute
          irreducibility of W_R. That check is a zero-run Coordinator or
          reviewer act. This decision does not perform it, does not rule on
          absorption, and does not touch either approved contract. Ranked
          below C-Q3 because it targets a constant factor, and its next step
          is a check rather than a run.
      - id: N-0
        what: Do nothing.
        assessment: >-
          Leaves KN-OPEN-62c870 Q3 with no scheduled act. It also leaves the
          clause in two goal heads (ICEX's mandated read, PATH's BATCH-002
          checkpoint) undecided, and leaves an ECC open idea unshelved but
          undesigned, against "ECC comes first" rule 3. Its only merit is zero
          cost.
    ranked:
      - rank: 1
        id: C-Q3
        justification: >-
          Its subject is the corpus's only exponent statement in this lineage.
          It is decision-changing for two live goal heads, cheap, and ready
          for ideation. It is also the declared successor (DEC-20261017-12e0f4,
          DEC-20261022-a0f165). It ranks ahead of N-0 because either outcome
