  # ------------------------------------------------------------- owning goal
  owner_assignment:
    chosen: GOAL-PATH-001
    why: >-
      Its question_ids list RQ-MONO-001, the question of ff7415 and of the new
      IDEA, as well as RQ-RELN-001 and RQ-ICEX-001, whose feeds the outcome
      decides. The second arm of its objective is to "close the remaining
      algebraic and relation-supply routes with scoped evidence", and the
      compounding clause is a relation-supply-rate statement. Its own BATCH-002
      checkpoint (icex_feed_supersession) records the clause verbatim, so it
      decides about text it carries. It is active, reported ECC, with
      campaign_budget.maximum_batches and total_wall_clock_seconds null,
      max_concurrent 3, and no lanes directory, so no lane is open on it.
    caveats_recorded:
      - >-
        PATH's objective concerns "ECDLP over generic prime fields". The new
        IDEA's subject is F_{q^n}. It is owned here as a decision about a
        clause that PATH's and ICEX's prime-field cost-model inputs carry, not
        as an extension of PATH's objective to extension fields. Every outcome
        is scoped to F_{q^n} at the tested (q, n), and no prime-field
        statement follows from it (ff7415 no_power_against).
      - >-
        PATH's objective says "Child goals own their batches". The child that
        owned RQ-MONO-001, GOAL-MONO-001, is completed and is not reopened
        (DEC-20261022-a0f165 reopen_condition not met). PATH has opened its
        own batches before (BATCH-001; BATCH-002, decision-only).
      - >-
        GOAL-PATH-001 is a flat goal file (ledger/goals/GOAL-PATH-001.yaml).
        This act does not run tools/shard_goal.py, because conversion
        re-serializes every line and this act rewrites nothing. The head
        update is additive on the flat file, and validate_ledger.py reads both
        layouts. Conversion is left to the act that writes this lane's
        checkpoint.
      - >-
        PATH's existing next_action (dispatch TASK-20260810-9e7f4c) is not
        re-assessed, restated or superseded. Per docs/concurrent-goal-lanes.md
        "exactly one next action per lane", BATCH-7ca353's next action is the
        new dated key.
    not_chosen:
      - id: GOAL-ICEX-001
        why: >-
          A consumer, not an owner. Its question_ids are RQ-ICEX-001 and
          RQ-ECDLP-002, and its objective aggregates "admissible G4-G6 outputs
          into one fully charged toy-scale index-calculus versus Pollard
          rho/BSGS exponent comparison for generic prime-field ECDLP". ff7415
          has no power on prime-field questions (no_power_against). Its
          campaign_budget.max_concurrent is 1, and lanes BATCH-1104d5 and
          BATCH-454f85 are open with no .closed.json, held by other sessions.
          A third lane would contend with them for the shared goal.yaml. None
          of their write scopes is touched.
      - id: GOAL-RELN-001
        why: >-
          Considered as a named consumer (ff7415 mechanism (2)). Its question
          is RQ-RELN-001, and its objective is a prime-field P(decomp) audit
          "feeding GOAL-ICEX-001". It does not list RQ-MONO-001. Its lanes
          were not inspected.
      - id: GOAL-MONO-001
        why: Completed (DEC-20261022-a0f165). A completed goal is not silently reopened.

