  context: >-
    One cycle of design-experiment plus propose-ideas.
    IDEA-20261006-fec972 is on origin/design/ssi-e211ac-distance and
    is not on origin/main. The question is RQ-SSI-001. No hypothesis
    or experiment on origin/main cites that full idea id. The branch
    design/ssi-fec972 was created from origin/main at
    9e25fddba6d9d9a397521b2b0456e7ff18edb1c8. The copied proposal
    bytes are blob b7dba488e03248752b0e5f569fbc860fdee78614 and parsed
    as YAML without a quote change. The prediction is that the
    fraction of supersingular F_{p^2}-isomorphism classes at p = 23
    with three rational points of order 2 equals 1.

    A run-aware count, using specification status together with
    git ls-tree of experiments/*/runs and ignoring .gitkeep, gives
    GOAL-SSI-001 approved_unrun=2, cap=3, headroom=1. The two
    contracts are EXP-SSI-001 and EXP-SSI-db46fa. This decision does
    not name them under supersedes_experiments or
    withdraws_experiments. check_approval_capacity would not reject
    an approving decision on this goal. The working tree omits run
    trees, so portfolio_kpis.py --capacity on that tree would
    over-count unrun contracts and is not the figure used here.

    The missing driver is a program that enumerates supersingular
    F_{p^2}-isomorphism classes at p = 23, counts roots of
    x^3 + Ax + B in F_{p^2}, checks y^2 = x^3 - x over F_23, and
    samples 100 random monic cubics. A search of origin/main for the
    phrases "2-division cubic" and "three rational points of order 2"
    under *.py returned no path.
    experiments/EXP-SSIQ-4de240/implementation/fit_delta_counting.py
    counts supersingular j-invariants in F_p and does not evaluate
    this fraction. There is no trial-plan.json. The only file under
    runs/ is .gitkeep.

    Success is the source idea's prediction. The concrete negative
    is a fraction at most 1 - 1/C, with the instrument passed. No
    class was scored in this session. The same pass files
    IDEA-20261007-df68f9, IDEA-20261007-9b9dac, and
    IDEA-20261007-ac5a0d and does not design them. Proposals on
    origin/main and the idea files on pull requests 1969 and 1968
    were read before those three claims were written. The
    idea-generator was not dispatched. The coordinator wrote the
    three records in this pass.

  rationale:
    - The standing authorization covers a complete runnable protocol. This one has no supersingular 2-torsion class census driver, so it is not approved.
    - check_approval_capacity would accept an approving decision. GOAL-SSI-001 has approved_unrun=2 against cap 3. This decision does not pretend the cap rejected it, and it does not force approved.
    - The missing driver is the census of supersingular F_{p^2}-isomorphism classes at p = 23, including the root counter, the instrument on y^2 = x^3 - x over F_23, and 100 random monic cubics. No program on origin/main evaluates that fraction.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - A fraction at most 1 - 1/C, with the instrument checks passed, is reachable as a recorded outcome, so success is not automatic.
    - The instrument, the random cubics, the class-versus-j rule, and the ordinary neighbor are the controls.
    - An instrument failure is not relabeled as a fraction at most 1 - 1/C.
    - This session did not score a class and did not claim that the exponent p^{1/3+o(1)} moves.
    - No run id was minted. The replication plan does not name a future run slot while the trial plan is unfrozen.

  evidence_refs: []
  limitations:
    - The measurement, once run, covers p = 23 only. It does not transfer to another prime or to cryptographic size.
    - A fraction equal to 1 does not lower the supersingular isogeny exponents.
    - An instrument failure and a crash are not the negative.
    - This decision does not authorize execution.
    - This decision does not edit a goal head.
    - The three new proposals are not hypotheses and are not approved experiments.

  next_actions:
    - A later session may approve EXP-SSI-0d35ba only after a supersingular 2-torsion class census driver exists and a trial plan is frozen. The driver was absent on 2026-10-07. GOAL-SSI-001 had headroom 1 on that date.
    - Do not dispatch TASK-20261007-ea1333 from the design session that wrote this decision.

