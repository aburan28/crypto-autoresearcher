  next_actions:
    - id: NA-1
      owner: coordinator
      action: >-
        Generate batch 2 with THREE PREREQUISITES before any comparison against
        the assumed law, all named by RT-20260803-4064e1.
      prerequisite_1: >-
        Name the exact (m, k_enum, k_fft, p, beta_bkz, beta_sieve) tuple this
        design corresponds to, OR declare that no such tuple exists for a
        distinguishing-only design and compare against the law's two SEPARABLE
        ingredients instead. Carry the inherited CTRL-RT-4 known-answer control
        on estimator.lwe_dual.matzov itself.
      prerequisite_2: >-
        Run the VECTOR-NULL -- random directions of matched ||x|| against the
        sieve database -- and the m-sweep, before quoting any inflation figure.
        The red team has already run both; batch 2 reproduces them under
        contract rather than citing an unreplicated reviewer computation.
      prerequisite_3: >-
        Emit x and y (roughly 1 MB) and report mean +/- sd over at least 1000
        error draws. Report per candidate GROUP, never pooled -- the
        decomposition is the result.
    - id: NA-2
      owner: coordinator
      action: >-
        Batch-2 card must name the object whose removal each null tests, per the
        corrective rule in PD-1.

  decided_by: coordinator
  decided_at: '2026-08-03'

