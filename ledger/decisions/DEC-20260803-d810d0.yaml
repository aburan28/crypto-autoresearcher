coordinator_decision:
  id: DEC-20260803-d810d0
  goal_id: GOAL-MLKEM-004
  batch_id: BATCH-d2a728
  recorded_by_task: TASK-20260803-586a7f
  authorized_by: DEC-20260803-4d4528
  recorded_at: '2026-08-03'

  decision: continue
  decision_label: >-
    Admit the first measurement as raw data, record that its null validates the
    wrong object, correct two Coordinator overclaims, and proceed to batch 2
    with three prerequisites rather than the planned direct comparison.
  decision_vocabulary_note: >-
    `continue` and not `support`: nothing is supported by this batch. It
    establishes that a measurement is possible and well-certified, and it
    establishes what must be fixed before the batch-2 comparison is even
    well-posed.

  context: >-
    BATCH-d2a728 is batch 1 of 6 of GOAL-MLKEM-004, opened hours after its
    predecessor closed at budget having measured nothing in twelve batches. Its
    contract was deliberately narrow: deliver raw scores, run a null, state NO
    finding, and leave the MATZOV.Nf comparison to batch 2 after independent
    review. The producer honoured that contract exactly and reported five
    limitations against itself.

  coordinator_validity_check: >-
    Both reviews ran concurrently in independent sessions, neither was shown the
    other's findings, and the Coordinator authored no interpretive note during
    the review window. Both reviewers reconstructed the measured object from the
    archive rather than accepting the transcript. A real limit on their
    independence is recorded in the evidence: both resolved to claude-opus-5,
    the same underlying model as the producer.

  what_is_established_and_is_genuinely_good_news:
    - >-
      AGREEMENT IS A REACHABLE OUTCOME OF THIS DESIGN, which was the question I
      dispatched the red team to answer, because a harness shaped only to find
      departure would have made batch 2 worthless. It answered yes, and showed
      agreement on two ingredients: the per-vector advantage law across ||x||^2
      deciles spanning 3.8x (measured/predicted 0.987-1.060, no trend), and
      uniform wrong-candidate noise matching the iid prediction to a ratio of
      1.00 over 2000 draws. MATZOV.Nf's own predicted N of approximately 25 is
      CONFIRMED against the population its assumption describes.
    - >-
      The certificate is genuine and the secret does not leak. The validator
      built A, ran the sieve TO COMPLETION, and only then drew the secret,
      reproducing the database bound three ways -- so the sieve output is
      provably a function of A alone. The red team independently reconstructed
      x and y for all 17,919 vectors and rebuilt the database from the declared
      seeds with its own code, obtaining an identical multiset.
    - >-
      The departure that exists is LOCALISED to near-miss candidates and is
      precisely where the law's own correction term lives. That is a sharper
      and more useful position than either "the model is wrong" or "the model is
      fine".

  what_is_weakened:
    - >-
      The batch-1 null. It CANNOT FAIL: with b uniform, x . b is uniform mod q,
      so any code that reads b passes it. It leaves the sieve database
      untouched, which is the object whose independence the law asserts. The
      null was made a completion gate specifically to avoid the predecessor's
      controls failure, and the gate was met by a control that could not fail.
      PASSING A GATE IS NOT THE SAME AS HAVING THE CONTROL, and that is the
      lesson of this batch.
    - >-
      Every pooled null statistic. "18 of 33" and "-0.04 sd" pool three
      populations the producer itself calls non-exchangeable, and 8 of the 32
      wrong candidates are near-copies of the ranked item. Per candidate GROUP
      is the reportable form.
    - >-
      Every headline score, by roughly 20% unreported uncertainty that does not
      shrink with N (correct-secret mean +0.4029 +/- 0.0856).
    - >-
      The sigma sweep's apparent structure. All five points lie within
      +1.20/-0.45 sd and the "factor-2 shortfall" at sigma=4 is -0.45 sd, i.e.
      noise.

  coordinator_error_corrections:

    - id: CE-1
      title: >-
        I asserted in an immutable commit message that the pipeline does not
        find structure that is not there. The package's own null table
        contradicts it.
      raised_by: RT-20260803-4064e1 OBJ-4
      what_i_wrote: >-
        Snapshot commit 8cc51677 reads "THE NULL RAN, and it behaved as a null
        must ... The pipeline does not find structure that is not there."
      why_it_is_wrong: >-
        The nominal secret ranks 5 of 17 against uniform candidates and 9 of 9 --
        LAST -- against secret-shaped candidates. Only the pooled figure gives
        18 of 33. And the null itself cannot fail, so even a clean pass would
        not have supported the sentence. I generalised a pooled statistic into a
        property of the pipeline.
      corrected_statement: >-
        Under a target-replacement null the correct secret is not
        distinguished, with rank 5/17 against uniform, 9/9 against
        secret-shaped, and 18/33 pooled. That null does not test the sieve
        database, so it licenses no statement about the pipeline as a whole.
      note: >-
        THIS IS THE THIRD OVERCLAIM I HAVE PUT IN AN IMMUTABLE COMMIT MESSAGE IN
        THIS PROGRAM -- BATCH-010, then 1cd863b1 in BATCH-012, now 8cc51677. All
        three were caught by red team, none by me. The pattern is identical each
        time: the artifact states a scoped result and my commit message states
        it unscoped.

    - id: CE-2
      title: >-
        I carried a producer limitation into an immutable receipt without
        checking it, and it was false.
      raised_by: VAL-20260803-535d15 defect 1
      what_i_wrote: >-
        The snapshot receipt at 8cc51677 records "Dual vectors (x,y) are NOT in
        raw_scores.json ... so a reviewer cannot score a candidate of their own
        choosing directly from the JSON without re-running."
      why_it_is_wrong: >-
        y is fully recoverable from the emitted phase differences. The validator
        recovered it and scored a candidate the producer never scored, obtaining
        +0.174586 from the JSON alone against +0.174586 from re-run vectors,
        with identical phase arrays. What is actually lost is x, which is needed
        for new targets and for the full certificate.
      direction_of_the_error: >-
        Conservative -- it understates what the archive supports. Recorded with
        the same weight regardless, because the failure was procedural: I
        propagated a self-reported limitation into a permanent record without
        testing it, which is the same class of error as accepting a producer's
        transcript.

  correction_mechanism: >-
    Commit 8cc51677 and its message are immutable and are NOT edited. CE-1 and
    CE-2 are corrected by supersession; this decision is the correction of
    record.

  process_defect_recorded:
    id: PD-1
    title: The null was a completion gate and the gate was satisfiable by a control that cannot fail.
    what_happened: >-
      I wrote "NULL OBJECT IS A COMPLETION GATE, not an aspiration" into the
      producer card, in direct response to the predecessor campaign going two
      batches without one. The producer complied. The control it built passes
      unconditionally.
    why_it_is_my_defect_and_not_the_producer_s: >-
      The card specified that a null be RUN and its outcome reported. It did not
      specify that the null remove the object under test. The producer met the
      contract as written. The predecessor campaign recorded the identical
      structure as a Coordinator defect in BATCH-009 F1 -- a completion gate that
      never required the thing it was meant to require -- and I reproduced it.
    corrective_rule_adopted: >-
      A null-object requirement must name the OBJECT whose removal it tests, not
      merely require that a null be run. For batch 2 the card names the
      vector-null explicitly: random directions of matched ||x|| against the
      sieve database.

  explicit_non_claims:
    - >-
      No ML-KEM break. No attack was implemented, run, or claimed. No speedup.
    - >-
      No security proof and no security claim in either direction.
    - >-
      No FIPS 203 parameter set is affected or cleared. Dimension 60 with
      q = 127 against n = 256k with q = 3329 is toy scale and AGENTS.md rule 4
      applies in full.
    - >-
      The independence law is NOT shown to fail. Two of its ingredients were
      tested and held.
    - >-
      No comparison against MATZOV.Nf was performed, and OBJ-1 shows that a
      naive one would have been meaningless: the log-term's three components
      have no referent in a distinguishing-only design, and admissible readings
      span N_pred from 24.9 to 723 -- a factor of 29 before any data.
    - >-
      certificate.kind is dual-membership only. It certifies the vectors, not
      any inference from their scores.

  official_status_changes:
    - record: EV-MLKEM-da9e3b
      from: null
      to: recorded
  official_status_changes_note: >-
    GOAL-MLKEM-004 remains `active`; its batch log and next_action are updated
    in this same commit. No other record changes status. Specifically unchanged:
    every GOAL-MLKEM-003 record and every KN-* entry.

  knowledge_promotion:
    promote: false
    promoted: []
    not_warranted: >-
      NOT WARRANTED, and two candidates were weighed. CANDIDATE A, a KN-TECH on
      "a null object must name the object whose removal it tests", is the real
      lesson of this batch and is genuinely transferable -- but it rests on one
      batch of one campaign, and the right time to promote it is after batch 2
      shows whether the corrected null behaves differently. CANDIDATE B, the
      agreement findings themselves, would be promotion of a result from a
      single toy-scale instance with roughly 20% unreported uncertainty and no
      replication; promoting it now is exactly the failure the predecessor
      campaign spent twelve batches demonstrating. Additionally the two
      promotions inherited as OWED from GOAL-MLKEM-003 -- the KN-FIND-012
      restatement and the KN-FIND-014 withdrawal -- remain rule-12 blocked and
      are not executable here.

  ranking_rationale: >-
    Batch 2 proceeds rather than redesigning. The red team was explicit that
    redesign would be premature abandonment on a first measurement this clean,
    and premature closure is a failure mode symmetric with overclaiming. But it
    does not proceed "as planned": substituting these numbers into MATZOV.Nf and
    reporting a residual would produce a number with a factor-29 ambiguity in
    its predicted value and no error bars on its measured one.

  limitations:
    - >-
      One instance, one seed, one dimension, one sieve algorithm, distinguishing
      form only.
    - >-
      Both reviewers resolved to the same underlying model as the producer
      (claude-opus-5, fallback_used: true in all three). Their independence is
      procedural -- separate sessions, no shared findings -- not model-level.
    - >-
      The instrument was re-verified rather than rebuilt, which the goal record
      requires. Recorded as not met (RT OBJ-9).

  evidence_refs:
    - EV-MLKEM-da9e3b

  references_unchanged_by_this_decision:
