coordinator_decision:
  id: DEC-20260806-0995d5
  decided_by: coordinator
  decided_at: '2026-08-06'
  decision: refine
  target_ids:
  - GOAL-HQC-001
  - EXP-HQC-982268
  - H-HQC-18d1b4
  - EV-HQC-163374
  context: "BATCH-f8050e dispatched DEC-20260806-cf5102's next_action -- a V3 planted-correlation control
    arm for EXP-HQC-982268 replacing V2's two fixed worst-case templates with a genuinely heterogeneous
    per-position, per-trial content ensemble, so a real detection RATE could be measured against the
    ~8.8 percent baseline the V2-batch Red Team established. DEC-20260806-cf5102 also explicitly required
    this batch to reckon with whether the control-arm lineage has reached a ceiling. TASK-20260806-e1700f
    built and ran it; TASK-20260806-c2b509 snapshotted it before either review; TASK-20260806-cdc631
    (Validator) and TASK-20260806-7008de (Red Team) reviewed it independently and in parallel. This
    decision closes the batch, and closes the control-arm sub-line of investigation, on their reports
    plus EV-HQC-163374."
  rationale:
  - 'V3 DELIVERED A REAL, CALIBRATED INSTRUMENT -- BUT BOTH REVIEWERS, INDEPENDENTLY, SHOWED ITS HEADLINE
    "CONFIRMATION" WAS A COMPOSITIONAL ARTIFACT, NOT NEW EVIDENCE. The measured ~10.47 percent
    unconditional and ~20.12 percent margin-conditioned detection rates are honest, reproducible, and
    correctly computed (both reviewers ADMIT). But the Validator first showed, and the Red Team then
    independently confirmed with a fresh 4,000,000-sample stratified measurement, that reweighting the
    SAME two label-conditional flip rates by V3''s own planted mixture (q = 9/28) versus the natural
    Bernoulli(0.35) population''s own decode-label mixture (about 21.1 percent) exactly reproduces V3''s
    figure and the V2-batch Red Team''s ~8.8 percent figure respectively, each to within 0.02-0.03
    percentage points. The ~1.19x gap between the two headline numbers is FULLY explained by one already-
    known constant. This is not a defect in the run -- it is a finding about what the comparison actually
    measures, and it changes how much weight "close agreement" deserves.'
  - 'THE COORDINATOR''S OWN PRIOR FRAMING IS CORRECTED HERE, NAMED RATHER THAN QUIETLY DROPPED. The
    BATCH-f8050e opening commit and the TASK-20260806-c2b509 snapshot receipt both described V3''s rate
    as "closely tracking" and "confirming" the V2-batch baseline. That description is not false as a
    numeric statement, but it invited exactly the over-read both reviewers caught: two mixture-dependent
    toy quantities differing by a known constant are not independent convergent evidence for one portable
    "natural detection rate." Recorded per this program''s own discipline of retracting Coordinator
    overreads rather than letting them stand uncorrected.'
  - 'THE REQUIRED CEILING RECKONING IS ANSWERED, DIRECTLY, BY BOTH INDEPENDENT REVIEWERS: YES, THE
    CONTROL-ARM LINEAGE (V1, V2, V3) HAS REACHED ITS CEILING. The Red Team''s own words are adopted
    without softening: V3''s "new" headline number is almost entirely arithmetically recoverable from
    what the V2-batch review already established, rather than a genuinely new independent data point.
    Three generations of increasingly sophisticated planted-content proxies have converged on the same
    structural limitation -- none of them ever runs the real cryptographic sampler (CTRStream,
    fixed_weight_support, ring_mul_sparse/dense), so none of them can speak to whether THAT code path
    harbors the subtle defect OPEN-6 actually worries about. A V4 of the same shape would predictably
    repeat this pattern: diminishing information per unit of campaign budget spent.'
  - 'THIS DECISION THEREFORE ENDS THE CONTROL-ARM SUB-LINE, RATHER THAN EXTENDING IT. This is not a
    negative result about HQC -- it is a negative result about ONE INVESTIGATIVE APPROACH within this
    campaign, recorded with the same honesty the program requires of any other closure: a named
    obstruction (planted-content proxies cannot, by construction, exercise the real sampler''s actual
    code path), an argument (three converging instances, the third of which reviewers showed to be
    largely redundant with the second), and forward guidance (inject defects directly into the real
    sampler). This is a change in KIND of next action, not a fourth iteration of the same kind.'
  - 'WHAT IS GENUINELY ESTABLISHED ACROSS ALL THREE BATCHES, AND SHOULD NOT BE LOST IN THE PIVOT: V1
    proved a specific instrument-design failure mode (homogeneous-block majority-threshold construction
    is mathematically blind to boundary-shift defects). V2 proved the failure mode is fixable (the real
    decoder DOES express such defects, at least for worst-case content). V3 proved a calibrated,
    reproducible instrument for measuring flip rates CAN be built, even though its particular headline
    number this batch turned out to be redundant with V2''s review. These are real, cited, toy-scale
    results about instrument design, independent of what they do or do not establish about OPEN-6 itself.'
  evidence_refs:
  - EV-HQC-163374
  - EV-HQC-9a30d3
  - EV-HQC-db1fd9
  - EV-HQC-b71230
  - coordination/goals/GOAL-HQC-001/batches/BATCH-f8050e/reviews/TASK-20260806-cdc631/validation_report.yaml
  - coordination/goals/GOAL-HQC-001/batches/BATCH-f8050e/reviews/TASK-20260806-7008de/red_team_report.md
  limitations:
  - NO statement about HQC, its decoding-failure rate, assumption A17 or A5, or any standardized
    parameter set. Claim tier stays toy.
  - H-HQC-18d1b4 UNCHANGED at proposed. Three batches of instrument-trust work have not moved it, by
    design -- none measured anything about HQC itself.
  - experiments/EXP-HQC-982268/specification.yaml is not amended by this decision.
  - None of the four asymptotic-complexity promotion gates is engaged; none is claimed.
  - 'The block-level-vs-estimator-level gap remains: no arm has measured what fraction of block-level
    flips (V3''s quantity) propagate to a detectable log2_Ahat_k MISMATCH under realistic content. This
    is now explicitly out of scope for further control-arm work per this decision, not silently dropped
    -- it would need to be re-approached, if at all, from the real-sampler-injection direction named
    below.'
  knowledge_promotion:
    promoted: []
    not_warranted: 'A genuine methodological lesson is ready across this three-batch arc: planted-content
      control arms, however carefully constructed, cannot exercise the code path they are meant to be a
      proxy for, and successive refinements of such arms tend toward redundancy with earlier refinements
      rather than new information -- V3''s own result is the demonstration. This is close to KN-TECH-
      worthy but held pending the real-sampler-injection attempt: promoting a "control arms of this shape
      plateau" lesson before trying the alternative risks foreclosing a nearby variant that might not
      share the limitation. No KN-FIND: nothing was measured about HQC across any of the three batches.'
  next_actions:
  - "Design and dispatch a real-sampler defect-injection experiment: inject a boundary-index-shift defect
    (the V1/V3-class off-by-one or last-block-early perturbation, unchanged in shape from what all three
    control arms tested) directly into stage_a.py's actual generation path -- CTRStream,
    fixed_weight_support, ring_mul_sparse/dense, decode_blocks -- run genuine (T)-distributed instances
    through it, and measure whether the resulting joint-moment estimator (measure.py's own
    comb_matrix/log2_A_from_hists pipeline, the SAME code that produced PS-R3) detects the defect. This is
    a change in kind from the three prior batches and should be scoped as its own bounded task, not
    assumed to fit the same shape or budget as a planted-arm batch -- state explicit budget and
    feasibility bounds before committing to a full run, since fixed_weight_support sampling is
    substantially more expensive than the planted-content shortcuts V1-V3 used."
  - 'Only after that experiment reports (or after a feasibility analysis shows it is not tractable at any
    affordable budget, which would itself be a named, honest finding) should the remaining resume-plan
    items from DEC-20260806-2947ba be attempted: the missing extrapolation to standardized parameters,
    PS-R3''s second independent reviewer, and the remaining named harness repairs.'
  - 'Carry forward, lowest priority: the unreconciled run-count discrepancy from the V1 arm (BATCH-4b8ad3)
    remains unresolved.'
