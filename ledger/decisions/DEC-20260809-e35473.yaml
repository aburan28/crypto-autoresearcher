  rationale:
    passing_design: >-
      Both reviewers independently reconfirmed, by recomputation and not by
      re-reading the producer's stated equalities, that all eight named
      BATCH-ece945 blockers are genuinely repaired at the byte level: the
      RFC 8439 ChaCha20-Poly1305 production envelope KAT (AAD, external key
      ID, commitment, custody lifecycle), the deterministic event-to-shard
      function and 28-row consumer-allocation matrix (28/28 rows sum
      exactly), the byte-exact rho/BSGS finite frontier with the positive
      gate applied to both baselines, the canonical 19-bit-field null-point
      KAT, and the honest lifecycle self-correction. The verification-count
      identity and its derived group-addition, logical-traffic, and
      per-size physical-memory-topology arithmetic also independently
      recompute exactly under both reviews.
    blocking_design: >-
      Four distinct blocking items survive across the two independent
      reviews, none of them overlapping and none one of the original eight
      blockers: (1) VAL-EA56C5-ARCHIVE-COMMUNICATION-BYTES-UNCHARGED --
      archive_scheduled_bytes, communication_scheduled_bytes, and the
      archive_hashing class population are byte-identical to the unrepaired
      predecessor despite newly charged work elsewhere in the same document;
      (2) VAL-EA56C5-OUTPUT-MANIFEST-UNDISCLOSED-SWAP -- the output_caps
      table silently substitutes a different five-file, 8388608-byte
      composition for the predecessor's ten-file, 8388608-byte composition
      with no disclosed disposition for the nine dropped files; (3)
      RT-OBJ1-candidate-population-cap-N-independent-vs-HA1-N-dependent-boundary
      -- the fixed candidate_index cap of 32 per tuple has no derived bound
      or overflow rule against H-SYC-b854f4's own N-dependent HA-1
      selector-regularity boundary, an observation-collision risk; and (4)
      RT-OBJ2-asymmetric-shard-parallelism-biases-wall-axis-of-positive-gate
      -- the candidate path's 8-way shard parallelism against the
      rho/BSGS baselines' 5-way parallelism mechanically biases the
      wall-time axis of the mandatory strict-dominance
      candidate_positive_gate. Two further Red Team items are non-blocking:
      OBJ3 (non_blocking_but_required_before_implementation_authorization,
      method ceiling not reconciled against already-declared constants into
      a crossover-N estimate) and OBJ4 (advisory, no k-list/
      generalized-birthday specialized baseline named). Full detail for all
      six items is preserved in checkpoint BATCH-ea56c5 and in
      EV-ECDLP-bf53c2; none is summarized away here.
    authorization:
      implementation_granted: false
      execution_granted: false
      budget_increase_granted: false
      reason: >-
        Both mandatory independent pre-implementation reviews returned
        REVISE, each on independent, non-overlapping grounds. Per
        BATCH-ea56c5's own dispatch constraint, any single REVISE or REJECT
        blocks implementation regardless of how the findings compare; two
        independent REVISE verdicts on disjoint grounds does not weaken that
        rule, it doubly confirms it.

  experiment_disposition:
    status: review_required
    action: preserve_pending_versioned_static_repair
    experiment_runs: 0
    implementation_exists: false

  next_actions:
    - >-
      Open one versioned static successor to EXP-SYC-a59d02 (not an
      Executor or implementation task) that closes all four blocking
      findings within the unchanged caps: derive and bound candidate_index
      occupancy per (curve,root,model,eta) tuple against L(N) at all five
      ladder sizes with an explicit overflow-invalidation rule (closes
      RT-OBJ1); equalize shard parallelism between the candidate path and
      the rho/BSGS baselines, or recompute and document the wall axis at
      matched parallelism (closes RT-OBJ2); and recompute
      archive_scheduled_bytes, communication_scheduled_bytes, and the
      archive_hashing class population for the two newly charged
      mount-state passes, giving the output_caps table an explicit,
      disclosed disposition for the predecessor's nine required output
      artifacts (closes both Validator findings). Obtain fresh independent
      Validator and Red Team review of that successor before any
      Coordinator decision considers a maximum-runs-zero implementation
      batch.

  restart_condition: >-
    Standing direction to continue permits a later bounded static successor,
