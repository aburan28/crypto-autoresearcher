  decision: revise_and_pause_pre_implementation
  context: >-
    BATCH-ea56c5 froze one zero-run successor intended to clear the eight
    BATCH-ece945 blockers within unchanged caps. Both mandatory independent
    reviews returned REVISE. The canonical decoder/null KAT, exact three-mount
    verification charge, twenty-eight population/allocation sums, deterministic
    shard arithmetic, declared resource caps and toy boundary pass, but eleven
    receipt, block, slot, cost, baseline, executable and noninterference
    interfaces still prevent implementation.
  decision_scope: >-
    This decides only admission of EXP-SYC-a59d02 to implementation. It
    authorizes no implementation or execution, changes no hypothesis status,
    and makes no ECDLP security, asymptotic, or performance claim.
  target_ids: [GOAL-ECDLP-001, BATCH-ea56c5, H-SYC-b854f4, EXP-SYC-a59d02]
  evidence_ids: [EV-ECDLP-bf53c2]
