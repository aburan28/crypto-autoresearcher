    checkpoint_sha256: 450c9b2bc355d11bf66f799c83bdfca39b3714505b1a64e4b9aaeffe26b3de06
  rationale:
    passing_design: >-
      Snapshot integrity, strict parsing, canonical decoder/null replay,
      three-mount verification and table additions, all twenty-eight
      population/allocation sums, declared shard/resource arithmetic, and the
      toy/no-run boundary independently pass.
    blocking_design: >-
      Approval is blocked by the eleven findings in checkpoint BATCH-ea56c5:
      uninstantiable receipt grammar; cross-consumer block receipts; uncharged
      census/reset work; missing semantic slot bijection; lost fixed-target
      cost pairing; selectable rho scheduling; incomplete finite frontier;
      circular manifest/coverage hashes; unenforceable syscall claims; omitted
      wiring-axis adjudication; and a median-only physical gate that misses
      sparse two-fold interference.
    authorization:
      implementation_granted: false
      execution_granted: false
      budget_increase_granted: false
      reason: Both mandatory independent pre-implementation reviews returned REVISE.
  experiment_disposition:
    status: review_required
    action: preserve_pending_versioned_static_repair
    experiment_runs: 0
    implementation_exists: false
  next_actions:
    - >-
      Open one fresh bounded maximum-runs-zero static successor and first
      require complete custody_open and cross-consumer block receipts as cheap
      falsifiers.
    - >-
      Freeze self-neutral receipt/hash preimages, consumer-split block and slot
      coordinates, complete artifact/reset charges, targetwise cost pairing,
      exact rho scheduling, a finite memory-time baseline frontier, enforceable
      syscall/path validation, and wiring plus sparse-tail noninterference gates
      without increasing existing caps.
    - >-
      Snapshot that successor and require fresh independent Validator and Red
      Team PASS verdicts before any implementation batch is considered.
  restart_condition: >-
    Standing direction to continue permits a later bounded static successor,
    but not a budget increase, implementation, or experiment execution.
  knowledge_promotion:
    promoted: []
    not_warranted: No experiment, theorem, or cryptanalytic result exists.
  claim_ceiling: >-
    A versioned zero-run pre-implementation design and two independent REVISE
