  context: >-
    BATCH-ea56c5 froze EXP-SYC-a59d02, a zero-run static successor intended
    to repair all eight named BATCH-ece945 blockers within unchanged caps.
    Both mandatory independent reviews (Validator TASK-20260809-db593f, Red
    Team TASK-20260809-3e9c18) independently re-derived the arithmetic and
    cryptography from scratch and confirm all eight original blockers are
    genuinely repaired at the byte level. Both verdicts are nonetheless
    REVISE: each reviewer found different, non-overlapping blocking gaps
    outside the eight-blocker list. Per BATCH-ea56c5's own dispatch
    constraint ("Any REVISE or REJECT blocks implementation"), no
    implementation is authorized regardless of how the individual findings
    compare or overlap. This decision is the ledger-archive disposition of
    that outcome, per TASK-20260809-30ed00's handoff.

  decision_scope: >-
    This decides only admission of EXP-SYC-a59d02 to implementation. Zero
    experiments ran (experiment_runs: 0 in both review reports).
    execution_authorized and implementation_authorized are false in both
    review reports, in checkpoint BATCH-ea56c5, in EV-ECDLP-bf53c2, and in
    this decision. This decision authorizes no implementation or execution,
    changes no hypothesis status, and makes no ECDLP security, asymptotic,
    or performance claim. It bears only on EXP-SYC-a59d02's static design,
    not on H-SYC-b854f4 or ECDLP.

  target_ids: [GOAL-ECDLP-001, BATCH-ea56c5, H-SYC-b854f4, EXP-SYC-a59d02]
