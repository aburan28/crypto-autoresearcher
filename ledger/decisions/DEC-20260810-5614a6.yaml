coordinator_decision:
  id: DEC-20260810-5614a6
  context: >-
    EXP-JINV-bd141d (GOAL-ENDO-001, BATCH-d7e255, RQ-JINV-8fc13a,
    H-JINV-5a0b9e) and EXP-VOLC-9f5571 (RQ-VOLC-f6253b, H-VOLC-dff1f8) both
    executed to bounded, honest, incomplete terminal states and were
    independently validated (VAL-20260811-0c8fd4 "DIAGNOSIS CONFIRMED";
    VAL-20260811-31690a "CONFIRMED WITH CORRECTIONS"). Their findings share
    a root cause -- harness/isogeny_class.py's point-based-only
    construction cannot reach the crater<->floor 107-isogeny in either
    experiment's matched-order N=19507 family -- and their combined framing
    needs to be corrected at once: the Validator for EXP-VOLC-9f5571 issued
    a MATERIAL CORRECTION to this Coordinator's own prior synthesis (commit
    a72f28b1e), which is corrected here as CORR-20260810-4a8bc6, not
    silently absorbed. This is TASK-20260810-e3e59e, the ledger archive
    that records both resulting evidence records, the correction, and
    updates the goal head. This task runs ALONE; every other agent on
    BATCH-d7e255 has terminated. BATCH-d7e255 remains OPEN; this archive
    does not close it (opened by a different, concurrent session -- not
    this archive's call).

  decision: refine

  target_ids:
    - EXP-JINV-bd141d
    - EXP-VOLC-9f5571
    - H-JINV-5a0b9e
    - H-VOLC-dff1f8
    - RQ-JINV-8fc13a
    - RQ-VOLC-f6253b
    - GOAL-ENDO-001

  rationale:
    - >-
      EXP-JINV-bd141d terminated with two unrelated terminal facts, both
      exhaustively independently validated (VAL-20260811-0c8fd4, checks
      V1-V6, no correction needed to any of them). (1) C-TRANSPORT-CERT is
      genuinely UNREACHED: gcd(107,19507)=1, confirmed both arithmetically
      and by an exhaustive computational check (all 19507 points of an
      actual t=211-class curve enumerated, zero of order 107), generalised
      to the whole class and family by Lagrange's theorem (N=19507 prime).
      (2) SEPARATELY, specification.yaml never instantiates
      factor_base_sizes or a target count anywhere in its 561 lines,
      independently confirmed by the Validator's exhaustive full-document
      grep -- a genuine contract defect (specification_error) blocking
      SR4/raw data collection regardless of the isogeny question. SR1, its
      completeness certificate, and SR2 all PASS and independently
      reproduce digit for digit. No isogeny-class-invariance verdict was
      reached on either arm.
    - >-
      EXP-VOLC-9f5571's SR1 (Velu-2 volcano reconstruction, doubled-v_Q
      defect fix) and SR2 (family numbers) are independently validated
      (VAL-20260811-31690a, checks V1-V2). SR5/T5/T1-transport remain
      UNREACHED in the run itself, for the same point-based-tool reason.
      THE VALIDATOR ISSUED A MATERIAL CORRECTION to this Coordinator's own
      prior snapshot-commit framing (a72f28b1e), which called the block a
      "genuine design tension in MATCHED-ORDER-DESIGN.md." That framing
      OVERREACHED. Independently confirmed by two separate methods -- the
      Validator's algebra plus an executable toy-analog computation at
      D_0=-3, ell=5, p=19 (5-division-polynomial factorisation over
      GF(19), matching the general prediction exactly), AND this
      Coordinator's own independent field-theoretic re-derivation (D mod
      107 = 0 exactly, confirming 107^2|D; Kronecker(-3,107)=-1 via Euler's
      criterion, confirming 107 is inert in O_K; standard CM theory then
      forces O_K/(107) to be a field and Frobenius to act as the exact
      scalar root at the crater) -- a Frobenius-RATIONAL KERNEL (not a
      rational point) EXISTS for the crater<->floor 107-isogeny on this
      class. This Coordinator did NOT accept the correction on the
      Validator's word alone, given it reverses a framing already pushed in
      a prior commit; the independent re-derivation is recorded in
      CORR-20260810-4a8bc6. harness/isogeny_class.py is point-based only
      (grep-confirmed: no eigenspace/frobenius/kernel_polynomial function
      exists in it) -- the correct diagnosis is "wrong tool for this
      vertical, conductor-prime case, not wrong design and not a
      mathematical impossibility." No run artifact was ever wrong -- only
      this Coordinator's own synthesis was, and it is corrected in
      CORR-20260810-4a8bc6, not silently absorbed.
    - >-
      A SECOND, independent finding on EXP-VOLC-9f5571: the Validator's
      direct recomputation from matched-null-verdict.json's raw cell data
      found execution_report.md's and implementation.md's own claim -- "a
      plain pooled (non-split-aware) statistic never fires on either null
      class" -- to be FALSE: it fires on 2/48 cells (f=3-sized null) and
      4/48 cells (f=107-sized null). This is a report-text inaccuracy, not
      a data-correctness issue: SR4's own gate verdict field
      (NULL_FIRES_OVERDISPERSION_DETECTED, per-half) is independently
      confirmed accurate and unaffected, and run admissibility is
      unaffected. Recorded per the Validator's own figures
      (VAL-20260811-31690a, check "V4-additional-finding") without this
      Coordinator re-deriving the exact fire count.
    - >-
      DISPOSITION: `refine`. Neither H-JINV-5a0b9e nor H-VOLC-dff1f8
      changes status (both remain as they were; no isogeny-class- or
      level-invariance verdict was reached on any arm of either
      experiment). What this archive refines is (i) the diagnosis of WHY
      both experiments' isogeny-construction steps are unreachable --
      correcting this Coordinator's own overreached "design tension"
      framing to "wrong tool, not wrong design," a materially different and
      more actionable characterisation -- and (ii) EXP-JINV-bd141d's own
      path forward, which needs a versioned protocol_amendment for its
      specification gap before any further dispatch, independent of the
      isogeny question. Per the target-result-profile bias toward
      exponent-targeting mechanisms (docs/target-result-profile.md) and the
      requirement to pair a conditional/structural lead with a
      heuristic-validation step: the kernel-exists finding is paired with
      N18 naming the concrete engineering task (a kernel-polynomial
      construction method) that would let a future run test it at the real
      ell=107 parameters, plus the toy-analog computation already reported
      by the Validator as the heuristic-validation precedent at ell=5 --
      neither is approved, contracted, or executed by this decision.
    - >-
      claim_tier toy, sota_delta zero throughout both experiments and this
      decision. The kernel-exists correction is a CM-theory/tooling
      finding about local Frobenius structure at a conductor prime, not an
      attack result, and is not framed as one anywhere in this decision or
      its cited records: it establishes existence of a mathematical
      object, not a working construction, cost estimate, or advantage over
      any baseline.

  evidence_refs:
    - EV-JINV-a8c812
    - EV-VOLC-3529e8
    - CORR-20260810-4a8bc6
    - experiments/EXP-JINV-bd141d/execution_report.md
    - coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/reviews/validator-jinv/validation_report.yaml
    - experiments/EXP-VOLC-9f5571/execution_report.md
    - coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/reviews/validator-volc/validation_report.yaml

  limitations:
    - >-
      TOY SCALE, CLAIM_TIER TOY, SOTA_DELTA ZERO throughout. No ECDLP claim
      in either direction anywhere in this decision or any cited record.
    - >-
      NO COMPLETION CRITERION IS MET. Neither EXP-JINV-bd141d nor
      EXP-VOLC-9f5571 reached a class-invariance or level-invariance
      verdict on any arm; GOAL-ENDO-001's C2 is unaffected by this archive.
      C1, C3, C4 unaffected. No quorum gathered or claimed; this decision
      rests on the committed Coordinator decision and its cited evidence
      alone, per AGENTS.md's goal-closure-quorum suspension, and does not
      close any goal, hypothesis, or research direction.
    - >-
      REVIEW-INDEPENDENCE LIMITS, CARRIED FORWARD AND NOT PRESENTED AS
      INDEPENDENT-MODEL CORROBORATION. Both validators resolved, per their
      own inference blocks, to models on the SAME Anthropic backend as the
      work they reviewed and as this Coordinator's own session (only one
      usable backend currently configured). "Independent" throughout means
      independent session, context, and a from-scratch reading of
      committed artifacts -- not independent judgement from a materially
      different model family. The EXP-JINV-bd141d validator additionally
      could not confirm its own policy resolution (should resolve to
      opus-5/xhigh; self-declared claude-sonnet-5), recorded as
      `model_verified: false` rather than silently treated as satisfied,
      and accepted on the strength of its concrete, independently-
      reproduced, deterministic recomputations per AGENTS.md's provision
      that review-adversarial is degradable when the degradation is
      recorded.
    - >-
      N18 (the kernel-polynomial/eigenspace construction method) is named
      as a concrete next step ONLY. It is NOT approved, NOT contracted, and
      NOT assumed trivial by this decision: the vertical/conductor-prime
      case needs its own implementation and its own correctness check, and
      the horizontal-case precedent (tools/isogeny_class_screen.py) does
      not simply transfer.
    - >-
      This decision does not change H-JINV-5a0b9e's or H-VOLC-dff1f8's
      `status`, does not edit any execution_report.md, run artifact, or
      either validation report (AGENTS.md rule 4; corrections supersede by
      reference only, per CORR-20260810-4a8bc6), and does not close
      BATCH-d7e255 (opened by a different, concurrent session; that call
      is not this archive's to make).

  next_actions:
    - >-
      N17 -- author a versioned protocol_amendment for EXP-JINV-bd141d
      instantiating factor_base_sizes and a target count in its
      density_grid section before any further dispatch of that contract --
      the specification gap is independently confirmed by two readings
      (this Coordinator's, the Validator's exhaustive one) and blocks
      SR4/raw data collection regardless of the isogeny question below.
    - >-
      N18 (the more consequential of the two) -- implement a
      Frobenius-eigenspace / kernel-polynomial isogeny construction method
      for harness/isogeny_class.py (or a new sibling module), capable of
      computing VERTICAL isogenies at a volcano's own conductor prime when
      that prime is inert in the maximal order -- now KNOWN, by two
      independent derivations, to be mathematically necessary and
      sufficient to unblock EXP-VOLC-9f5571's SR5/T5/T1-transport chain
      (and, downstream, EXP-INSTR-36c8cf's Phase B, and by extension the
      EXP-ICINV-4d33aa v4 lead named in N13). Real engineering work with
      its own risk (the horizontal case tools/isogeny_class_screen.py
      demonstrated does not simply transfer to the vertical/
      conductor-prime case); named here as a concrete next step, NOT
      approved, NOT contracted, and NOT assumed trivial.
    - >-
      N7/N11/N13/N14/N15/N16 from prior batches are UNCHANGED by this
      archive; do not re-dispatch or re-litigate them here.
    - >-
      BATCH-d7e255 remains OPEN; whether and when to close it is not this
      archive's call.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This decision is `refine`, not `support` or `reject_scoped`, so the
      mandatory promotion gate does not fire. Independently, no promotion
      would be warranted on the merits even if it did: neither experiment
      reached a class-invariance or level-invariance verdict in any
      direction (both remain UNREACHED on their decisive arms), so there is
      no isogeny-class-invariance finding to promote. The kernel-exists
      correction (CORR-20260810-4a8bc6) is a CM-theory/tooling diagnosis
      about a specific harness limitation, not a durable research finding
      about isogeny classes or ECDLP hardness, and is not yet backed by any
      constructed object or implementation (N18 is named, not built); it is
      recorded as a correction and as N18/N17 next actions rather than
      promoted to knowledge/findings/. A future decision, after N18 is
      implemented and the ell=107 hub-and-spoke prediction is checked at
      real parameters, is the earliest point at which a KN-FIND on this
      lane would be warranted.

  decided_by: coordinator
  decided_at: '2026-08-11'

  inference:
    requested_policy: coordinator-orchestration
    resolved_model_id: claude-sonnet-5
    reasoning_effort: high
    fallback_used: true
    fallback_reason: >-
      This Claude Code harness cannot resolve the policy aliases in
      orchestration/model-policies.yaml at subagent level (`model: inherit`
      in every .claude/agents/*.md); every alias falls back to the one
      model this session runs on (CLAUDE.md, "Model policy note"). Standing,
      harness-wide, not a per-task discretionary substitution; refused
      rather than downgraded per the handoff's explicit instruction.
    degraded_allowed: false
    degraded_requirements: []
    model_verified: false
    model_verified_reason: >-
      This coordinator session has no Bash tool and cannot run
      `python3 -m orchestration.adapter doctor --probe`; the identifier
      recorded is the session's self-declared runtime identity only.
    executed_runs: 0
