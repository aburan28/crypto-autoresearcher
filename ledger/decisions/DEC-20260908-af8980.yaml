    EXP-ECDLP-184fc4:
    - id: THIRD-184-1
      required_correction: Add the exact hash-sampler probability assumption and bind the 65-way rank's calibration
        to both that assumption and the joint assignment null, or replace the fixed schedule with independently
        sampled recorded permutations under a complete randomness contract. If neither premise is asserted, retain
        the number as descriptive and do not call joint assignment exchangeability alone sufficient.
    EXP-ECDLP-1e6502:
    - id: THIRD-1E-1
      required_correction: Bind only the generic sibling subfields actually inherited, such as the exact spectrum
        identities and the explicit finite-null order-statistic/tie/zero-dispersion rules. Keep the 1e6502 member,
        cell, precision-tag, family-statistic and permutation stream local. Carry the corrected SHA probability
        premise from THIRD-184-1 into the local 1e6502 rank semantics rather than importing a family-specific sibling
        block.
    EXP-ECDLP-2c3d20:
    - id: THIRD-2C-1
      required_correction: Fit the restored sigma_center slope against ln(p) on all seven rungs, and apply the identical
        ln(p) abscissa to every matched null trajectory. If ln(N) is desired as a second descriptive diagnostic,
        give it a separate key. Replacing the original primary abscissa instead requires an explicit additive scope
        amendment and technical rationale; it cannot be called preservation of the original question.
