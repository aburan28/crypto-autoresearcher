      OneEnd/Isogeny lift, and attacker-to-complete-ring reduction are absent.
    - >-
      J3 breaks because the HHK outer theorem remains conditional while the
      base algorithms, canonical transport, validation, total Dec0, and actual
      correctness bound are unavailable.
    - >-
      J4 breaks because the real adversarial distribution and instantiated
      operation, bit, memory, retry, preprocessing, and verification costs are
      incomplete. The symbolic checklist is not a total cost result.
    - >-
      J5 breaks because Seta already supplies the exact endpoint-plus-torsion
      M=1 algebraic core and finite-action recovery; the added outer shell and
      unused complete-ring witness do not establish a materially different
      EndRing mechanism.
    - >-
      Applying O1--O6 conjunctively gives O1/O2/O3/O6 open and O4/O5
      contradicted for this exact frozen interface, with zero reviewed
      discharges. The construction gate therefore fails.
    - >-
      Authenticated CEST remains separate: it is only a conditional accepted-
      key classical-ROM CEST-XFER-COMP/EvalLine control. It is neither the
      EigenX-v2 candidate nor an EndRing construction and receives no security
      or deployment label here.
    - >-
      J6 passed the release-bound Markdown, Mermaid, SVG, ten-page PDF, and
      visual inspection without requesting corrections, including the valid
      J5 source-metadata corrections and zero-run boundary.
