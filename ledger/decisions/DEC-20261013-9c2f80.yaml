    - >-
      J1 breaks because accepted Decaps factors through the finite trapdoor
      q_N=(d,e,theta(P_N),theta(Q_N)) plus z; the complete rank-four End(E)
      witness is not necessary for this declared M=1 recipient operation.
    - >-
      J2 breaks because the exact real-key challenge embedding, decapsulation-
