  context: Prospective portable-monitoring successor to an inconclusive zero-export image audit.
  rationale:
  - The earlier setup failure preceded all image and malformed-control operations, so image validity remains
    untested.
  - The same identity/custody audit remains ranked; sampled parent monitoring and exclusive temporary attempt
    receipts address the observed operational failures without weakening image correctness controls.
  - Standing authorization covers the same exact read-only image audit. No live container, guard or scientific
    execution is authorized.
  approved_boundaries:
  - You are not alone. Own only three exact new outputs;no Git,ledger,queue,claim,status,approval,source or
    image mutation.
  - Read full declared inputs and verify all hashes. No producer/parent conversation or concurrent reports.
  - Fresh native review-adversarial gpt-5.6-sol/xhigh,no fallback,degradation,Bedrock or serving probe.
  - Allowed Docker operations are read-only image inspect and image save for exact ID sha256:376f4a364f0b4cf1422b0f4ef1855b080e91ac858b47ef94dd8eee764d1eb3a7
    through unix:///Users/adamburan/.docker/run/docker.sock only. No create/run/start/exec/cp/commit/tag/pull/push/kill/rm/prune
    or settings changes. No image code or library import executed.
  - At most2read-only image export invocations including failures;precheck each output path and keep unique
    owned temporary exports. Maximum2GiB per export/cumulative uncompressed data,memory2GiB,streamed buffers<=1MiB,oneworker.
    Export watchdog180seconds. Reject malformed/traversing archive paths;read members as data,never extract
    or follow archive symlinks. Retain export/command hashes and delete only owned temporary exports after
    custody.
  - At most128fixed malformed-control cases including failures/reruns,each complete suite<=48with finalreserved;10s/case1800aggregate
    executed-check wall/CPU. Source/hash/archive-file comparisons are administrative and their counts remain
    explicit.
  - The final preparation receipt adds Coordinator annotations inside inner.image_binding after execution;they
    are not container-emitted observations. Its solver/generator exclusion means repository experiment code,not
    the mathematical functions shipped by SymPy. Audit actual command outputs separately.
  - Return exact three hashes,scoped verdict and all limitations. No scientific,8GiB group-guard,whole-runtime
    or launch verdict.
  - The previous audit had zero Docker inspect/export calls and zero malformed cases; preserve its inconclusive
    result and setup failure. Fresh maximum counts remain2exports and128controls because no previous export/control
    occurred. No image code or container execution.
  - Do not install or attempt RLIMIT_AS on macOS. Use a parent watchdog that samples only its owned checker
    child and its owned descendants at <=100ms cadence, with a2GiB aggregate sampled-RSS threshold. A scoped
    ps -o rss= -p OWNED_PID observation may be used; no broad process listing, host package install or new
    dependencies. Keep bounded streams and input caps already declared. The watchdog is sampled machine protection
    and may overshoot between samples; never call it a kernel-enforced hard2GiB guarantee.
  - Before any Docker call, demonstrate watchdog readiness on the exact owned worker paused at a startup barrier.
    If process-memory sampling is unavailable or malformed before release, stop without image export and retain
    that setup failure. While running, sampled threshold breach terminates and reaps only owned child processes
    and records failure; do not infer a scientific result. A child already terminal has no fabricated final
    sample. Retain actual sample timestamps, peak sampled aggregateRSS, child CPU/wall and watchdog outcome.
  - Every attempt uses an exclusive new temporary directory and receipt paths outside canonical outputs. Before
    launch, reserve its command, checker SHA and output paths; retain exact checker bytes, all outer tool responses/session/polls/terminal
    exits, nested commands,UTC,stdout,stderr and failures. Never write or reserve canonical check-receipt.json
    as the invocation sink. Create canonical check-receipt.json exactly once only after every attempt has terminated
    and no further invocation is intended, embedding the complete immutable attempt records.
  - At most two administrative watchdog setup attempts; the second requires a concrete documented setup correction.
    Setup attempts perform no Docker action. They do not reset export/control counts. Retain all zero-case
    failures. No undeclared script or current-model provenance may be invented.
  - If tool sandboxing blocks the declared local socket or scoped owned-PID sampling, request tool escalation
    specifically for the authorized read-only audit and watchdog commands. No Docker mutation is permitted.
    An approval rejection or tool failure remains operational and does not license a broader action.
