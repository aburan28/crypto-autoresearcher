    "rationale": [
      "Both content-first custody chains pass: the exact fifteen-path semantic snapshot and exact four-path conformance snapshot are reachable, byte-identical, complete, and have zero skipped paths.",
      "The archived conformance outcome is invalid_source_custody. Its sole public call stopped at STATIC_ADMISSION with CUSTODY_FAILURE; 83 cases were declared, 0 executed, and 83 not reached, so it supplies no semantic or scientific sample.",
      "Fresh independent Red Team review returned REVISE and sustained five blocking objections: mutable queue-byte custody; incomplete row-terminal and aggregate replay; typed-certificate identity, uniqueness, and ordering failures; noncanonical y=7 control targets; and caller-controlled decision replay with missing endpoint and distinct-edge binding.",
      "The faithful Coordinator determination sustains RT-ECTD-V7-O1 through RT-ECTD-V7-O5, overrules none, records not_approved_revise, and leaves amendment v7 review_required, unapproved, future-runs-only, and non-operative.",
      "DEC-20260813-59da8c authorized at most one additive successor and v7 consumed that authority. This decision therefore authorizes no v8 and pauses the verifier-first repair lane pending a separate explicit Coordinator or user scope decision.",
      "Version 2 remains the sole operative experiment protocol; GOAL-ECTD-001 remains active and H-ECTD-19017a remains specified, with no scientific, knowledge, or status effect."
