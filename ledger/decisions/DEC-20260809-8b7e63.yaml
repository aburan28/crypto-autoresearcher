  decision: revise_and_pause_pre_implementation
  context: >-
    BATCH-3468a0 froze one zero-run successor intended to clear the seven
    BATCH-eec496 blockers within unchanged caps. Both mandatory independent
    reviews returned REVISE. The confidence extremum, numeric class/population
    arithmetic, all-root losslessness, traffic, budget, and toy boundaries
    pass, but six reproducibility, reachable-control, ownership, physical-cost,
    baseline, and noninterference defects prevent implementation.
  decision_scope: >-
    This decides only admission of EXP-SYC-24f469 to implementation. It
    authorizes no implementation or execution, changes no hypothesis status,
    and makes no ECDLP security, asymptotic, or performance claim.
