  rationale:
    passing_design: >-
      Snapshot integrity, strict parsing, the confidence-box extremum, restart
      semantics, twenty-eight numeric rows, candidate/verifier populations,
      all-root X=V/S, traffic and budget caps, and the toy/no-execution boundary
      independently pass.
    blocking_design: >-
      Approval is blocked by the six findings in checkpoint BATCH-3468a0:
      missing class/artifact/probe and decoy-scalar ownership; an unreachable
      and incomplete confidence KAT; noncanonical byte/seed framing; unfrozen
      null bytes and shape; no unambiguous fully charged per-size hardware-time
      comparison against a frozen rho baseline; and nonexhaustive verifier
      isolation.
    authorization:
      implementation_granted: false
      execution_granted: false
      budget_increase_granted: false
      reason: Both mandatory independent pre-implementation reviews returned REVISE.
