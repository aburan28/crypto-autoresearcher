      property of the PRINCIPAL CLASS and not of the ORDER, so the candidate
      entry's own sentence is false about the object it names. Promoting it would
      have written a false boundary into the corpus. The independent grounds that
      already blocked promotion still hold and are not weakened: zero runs, no
      EV-* record, a derivation living inside contracts that are still
      `status: draft`, the mandatory automorphism-discounted rho baseline
      (KN-TECH-018) never applied, and the JKSST reading unresolved. The
      trigger does not fire on the other side either: this decision is `refine`,
      not `support` or `reject_scoped`, and it reviews no evidence record of any
      strength. A corpus entry may be reconsidered only after N14's stratified
      STAGE 0/1 returns, and then only for the two-regime statement, with
      proof_status `derivation` and never stronger.
