  limitations:
  - >-
    ZERO EXECUTED RUNS IN THIS BATCH, AND NO EVIDENCE RECORD. Neither the CANL
    lane nor the ICINV lane produced a run; no EV-* record is written by this
    decision. The L9 closure's basis remains `derivation` and is now known to
    have a narrower valid support than it stated. No measurement in this campaign
    has ever confirmed hhat(alpha P) = N(alpha) hhat(P), measured rho_lift, or
    checked the norm-form gap by machine, although EXP-CANL-86c465 STAGE 0 and
    STAGE 1 specify exactly those checks at negligible cost.
  - >-
    THE REVIEWS' INDEPENDENCE IS LIMITED AS RECORDED IN RATIONALE ITEM 8, AND
    NEITHER IS A RULE-12 `review-breakthrough` PASS AT `max`. DEC-20260810-2c7e3c
    recorded, as an open judgement, whether a scoped LANE closure inside an open
    goal falls under AGENTS.md rule 12; that judgement is not settled here, and
    what has now happened is one adversarial red-team pass, which is more than
    that record had and less than rule 12 would require if the answer is yes.
  - >-
    THE LARGEST UNVERIFIED INPUT TO THE L9 CLOSURE IS STILL UNVERIFIED.
    KN-LIT-021 (JKSST) is not in this repository, carries `confidence: reported`
    and its own "full paper not read", and describes the mechanism as an
    ABSOLUTE coefficient bound while DECOMPOSITION.md L9 states the obstruction
    as a height ~N. The decision under correction uses the absolute reading in one
    place and the relative reading in another and never reconciles them, and the
    JKSST relay is not flagged in its limitations although two weaker relays are.
    Unchecked, not passed.
  - >-
    THE PRE-REGISTERED KILL CRITERION OF LANE L9 IS ITSELF MISSTATED (A4-a). The
    obstruction as pre-registered in DECOMPOSITION.md L9 and RQ-CANL-63098f's
    decision_target is a HEIGHT ~N; the closure's own Answer 3 derives the height
    budget as Theta(N^{2/r}), contradicting it for every r >= 3. That is a defect
    in the gate, to be corrected by a superseding record against those two
    artifacts rather than inherited by the next lane. This decision does not
    correct it, because those artifacts are outside TASK-20260810-934566's write
    scope.
  - >-
    NOTHING IS DURABLE UNTIL COMMITTED AND VERIFIED. This task wrote files only
    and committed nothing (SC-9). Until the dispatching session's post-commit
    verifier accepts this archive and the branch is pushed with an open PR naming
    these records, none of this is durable evidence and no transition it records
    is official (AGENTS.md "Durable research commits", CLAUDE.md rule 7).
  - >-
    TOY SCALE THROUGHOUT, `claim_tier: toy`, `sota_delta` zero, as stated in
    rationale item 9.
  next_actions:
  - >-
    N13 (NEW, BLOCKING, HIGHEST PRIORITY). Author protocol_amendment v4 for
    EXP-ICINV-4d33aa resolving F-V1.4 -- the per-curve exactness MUST is
    unsatisfiable because the reference data does not exist and A9 forbids
    re-measuring it. v4 either drops that reporting requirement, conditions it on
    availability, or states the alternative evidence that discharges it. NO
    EXECUTION UNTIL F-V1.4 IS RESOLVED. The v4 record should also state the
    conjunction of F-V4.1 and carry the F-V3.2 / F-V2.4 / F-V2.1 / F-V3.1
    corrections of CORR-20260810-ea47d6 forward in its own text.
  - >-
    N14 (NEW). Before any KN-FIND promotion or any EXP-CANL-* contract approval,
    run EXP-CANL-86c465 STAGE 0 and STAGE 1 as pre-registered but EXTENDED BY AN
    IDEAL-CLASS STRATIFIER, per the red team's concrete next action. Minutes of
    integer arithmetic. Predictions are stated in advance in the review: STAGE 0
    confirms N(alpha) >= |D_E|/4 off Z and refutes the equality clause for
    D_E = 1 mod 4; the stratified extension shows the ratio-of-minima law holds
    for the principal class and stays O(1) for roughly half the non-principal
    classes at every |D_E|. If that is the outcome, a SUPERSEDING decision
    restates the L9 closure in its two-regime, two-argument form and re-scopes
    EXP-CANL-86c465's success_criterion and falsification_criterion item 3 to the
    principal class BEFORE that contract is ever approved. This next action
    APPROVES NOTHING AND DISPATCHES NOTHING: it needs its own Coordinator
    decision and a contract freeze.
  - >-
    N11 (CARRIED, STILL OPEN). The two_torsion_x lead at POOL_C R4 (R = 0.647),
    flagged and not claimed, needs a cheap control before any chase.
  - >-
    N7 IS DISCHARGED by DEC-20260810-2c7e3c as corrected by CORR-20260810-930c42.
    Lane L9 (RQ-CANL-63098f) is adjudicated as a scoped closure whose stated
    argument has been corrected and whose actual support is the
    target-independence bound plus the constancy of C_0 and r. It must not be
    carried forward as an open next action a sixth time.
  - >-
    LEDGER ARCHIVE (dispatching session, not this task). Commit exactly the paths
    declared in TASK-20260810-934566's write_scope, push the branch, and open or
    refresh the PR against `main` naming DEC-20260810-3110d5, CORR-20260810-930c42,
    CORR-20260810-ea47d6 and the BATCH-de621d checkpoint shard. Run the
    post-commit verification before treating any of this as durable.
