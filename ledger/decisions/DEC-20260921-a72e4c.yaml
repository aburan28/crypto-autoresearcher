coordinator_decision:
  id: DEC-20260921-a72e4c
  context: >-
    /review-evidence round on EXP-FROB-b8cf21, run TASK-20260907-ee1e3c,
    executing the review_plan committed in
    ledger/handoffs/TASK-20260921-e107c8.yaml. The run's frozen 12-cell panel
    reached only 9 completed cells: FROB-q7-n3-object02 is ineligible_object
    (pool exhausted, independently re-confirmed exhaustive over the full
    49-candidate q=7,n=3 pool) and its two null-seed cells are correctly
    not_run_no_eligible_object. The q11,n5 field cell (2 object curves, 4
    matched null cells) completed in full and shows a clean, triply
    corroborated all-zero Delta_rank pattern on both object curves against
    positive Delta_rank on every matched null. Full analysis, including a
    blind rederivation of the accepted-relation definition recorded BEFORE
    any producer artifact was opened (verbatim reading, worked sample, and
    number, in experiments/EXP-FROB-b8cf21/analysis.md's own first section),
    is in experiments/EXP-FROB-b8cf21/analysis.md. Review attestation for the
    blind_rederivation and all five owned joints (J1-J5) is in
    experiments/EXP-FROB-b8cf21/review-attestation-20260921.yaml.

  decision: inconclusive

  target_ids:
    - EXP-FROB-b8cf21
    - H-FROB-824aa8
    - EV-FROB-b53a91
    - TASK-20260921-e107c8

  rationale:
    - >-
      J1 (holds): the q7,n3 curve pool was exhaustively searched (49 = 7^2
      candidates, each logged exactly once as object_curve_rejected or
      object_curve_selected in raw.jsonl) and exactly one curve
      (FROB-q7-n3-object01) is eligible. FROB-q7-n3-object02's
      ineligible_object status is genuine and unremediable within this run;
      no amendment on file (amendments/DEC-20260909-24ab46.yaml) touched the
      curve pool.
    - >-
      J4 (holds, run-level reading): specification.yaml's incomplete_selection
      rule reads, verbatim, "Fewer than 2 qualifying object curves at either
      field ... makes the planned 12-cell experiment inconclusive" -- it
      names the experiment, not the field, as void. Both success_criterion
      and falsification_criterion share a whole-panel "complete ... cells"
      precondition before either's per-field existential/universal check
      applies. No textual argument was found that the rule is scoped
      per-field; the frozen text supports a run-level stop rule. q11,n5
      being complete does not let its result trigger
      falsification_criterion alone, because that criterion's own gating
      precondition was never satisfied for the whole run.
    - >-
      J2/J5/proves_too_much (all hold): the q11,n5 all-zero pattern is a
      genuine combinatorial fact, not a rank/accept-counting artifact.
      Corroborated three independent ways: this review's code-informed
      replication (positive control at q7,n3-object01 rules out "always
      returns zero"); a from-scratch, pre-code blind rederivation of the
      accepted-relation definition from specification.yaml's prose alone,
      which reached the producer's exact raw Q3 value on a hand-checked
      sample pair (152799) using field arithmetic derived only from the
      encoding sentence in the spec, before ever opening implementation.py;
      and an exhaustive 400/400 raw.jsonl recount for cover "1,2" on
      object01 (0 accepted, matching metrics.json). proves_too_much
      controls PTM-1 (nonzero on the positive control) and PTM-2 (t=1
      baseline exactly zero everywhere) both pass with no failure
      signature.
    - >-
      J3 (holds, scope caveat disclosed): null-invariant preservation
      (candidate cardinalities, intersection sizes, negation closure;
      Frobenius weights not transported) is enforced by runtime assertions
      in implementation.py's null_labels() that would have invalidated the
      run on failure; the run completed_valid. Verified via the code's
      enforcement plus non-crash completion, not an independent by-hand
      fixture re-derivation for every null cell -- disclosed as a
      limitation, not hidden.
    - >-
      Given J1 and J4, this run's own preregistered decision_branches.
      inconclusive text controls: "Record exact matching/eligibility/
      validity/infrastructure impediment and concrete recheck; no scientific
      status transition." The formal verdict on H-FROB-824aa8's
      universally-quantified ("in each frozen field cell") existence
      statement is therefore inconclusive, not reject_scoped and not
      support, regardless of q11,n5's own clean pattern. reject_scoped on a
      single field of an incomplete run would also independently fail
      AGENTS.md's "reject_scoped on a single unreplicated empirical-only run
      is forbidden" bar, since only one field of a two-field, single-run
      (maximum_runs=1) protocol reached completion.
    - >-
      Claim tier is toy (GF(7^3), GF(11^5), both <32 bits); certificate_refs
      is empty and justified (certificate.kind=none, no solve/relation
      claimed, per docs/claims-and-verification.md's certificate gate
      applying only to claimed solves/relations); proof_status is
      not_applicable because this decision makes no adverse transition
      (weaken/reject_scoped/rejected) that would trigger the
      refutation-artifact requirement.

  evidence_refs:
    - EV-FROB-b53a91
    - experiments/EXP-FROB-b8cf21/analysis.md
    - experiments/EXP-FROB-b8cf21/review-attestation-20260921.yaml
    - experiments/EXP-FROB-b8cf21/runs/TASK-20260907-ee1e3c/metrics.json
    - experiments/EXP-FROB-b8cf21/runs/TASK-20260907-ee1e3c/raw.jsonl
    - experiments/EXP-FROB-b8cf21/runs/TASK-20260907-ee1e3c/report.md
    - experiments/EXP-FROB-b8cf21/review-20260921-independent-replication/README.md
    - experiments/EXP-FROB-b8cf21/amendments/DEC-20260909-24ab46.yaml

  limitations:
    - >-
      This decision does not close H-FROB-824aa8's lane and does not assert
      the mixed-incidence-span existence prediction is false at any field:
      the run's own incomplete_selection rule voids a run-level verdict, it
      does not supply one.
    - >-
      The q11,n5 secondary observation is scoped exactly as measured (GF(11^5),
      the two selected j-invariants, covers up to arity 3) and is not
      transferable to any other field, curve, or arity without a new
      experiment.
    - >-
      The blind numeric rederivation (J5) covered one cover on one sample
      pair plus one tangent case by hand, corroborated by an exhaustive
      raw-log recount for that one cover; it is not an independent
      from-scratch re-enumeration of all 70 object-arm covers across both
      q11,n5 curves.
    - >-
      J3's null-invariant check relied on the producer's own runtime
      assertions and non-crash completion, not an independent by-hand
      fixture re-derivation.
    - >-
      Per AGENTS.md "Review architecture" procedure_deviations PD-1/PD-2 on
      TASK-20260921-e107c8, this round dispatched a single coordinator
      subagent owning all five joints as sequenced steps, not five
      independently-owned agent sessions. A full multi-agent
      independence-checked round remains a candidate escalation (see
      next_actions) and was not silently substituted for by this lighter
      round.

  next_actions:
    - >-
      NA-1 (coordinator): DEP-1 on TASK-20260914-7119f2 is now discharged --
      an EV-* record (EV-FROB-b53a91) and this Coordinator decision now
      exist for EXP-FROB-b8cf21. TASK-20260914-7119f2 tests a different
      hypothesis (H-FROB-d93575) with a different independent variable
      (direct-sum partitions, not arbitrary covers) and does not depend on
      H-FROB-824aa8's verdict, only on this review's existence. Per
      DEC-20260914-d04668 NA-2: the dispatching session fills
      TASK-20260914-7119f2's archived_by with a freshly minted,
      --check-verified task identifier and dispatches the Executor against
      the committed, published EXP-FROB-91ee9c contract.
    - >-
      NA-2 (coordinator): design a NEW, differently-parametrized experiment
      (not an amendment to EXP-FROB-b8cf21, whose incomplete_selection rule
      forbids widening this run's pool) to obtain a second eligible q7,n3-scale
      object curve -- either a larger q at the same toy scale with a richer
      curve pool, or an explicitly pre-registered wider (A,B) search box
      declared before any search runs -- so that a future run of this same
      hypothesis can actually reach a run-level verdict. This is the
      "concrete recheck" this run's own decision_branches.inconclusive
      clause requires being named.
    - >-
      NA-3 (coordinator, dispatching session): run
      tools/check_review_independence.py against
      ledger/handoffs/TASK-20260921-e107c8.yaml and
      experiments/EXP-FROB-b8cf21/review-attestation-20260921.yaml before
      treating this round as complete, per AGENTS.md "Review architecture."
    - >-
      NA-4 (coordinator, dispatching session): merge origin/main into the
      working branch, run the isolated ledger archive staging exactly
      experiments/EXP-FROB-b8cf21/analysis.md,
      experiments/EXP-FROB-b8cf21/review-attestation-20260921.yaml,
      ledger/evidence/EV-FROB-b53a91.yaml,
      ledger/decisions/DEC-20260921-a72e4c.yaml, and
      ledger/hypotheses/H-FROB-824aa8.yaml (status field only), then push and
      open or refresh a PR against main naming these records, per
      TASK-20260921-e107c8's archived_by (TASK-20260921-2befda).
    - >-
      NA-5 (coordinator, if a future full-panel run reaches reject_scoped or
      support at strength >= replicated/strong on H-FROB-824aa8): escalate
      to a full multi-agent independence-checked review round per this
      decision's limitations note on PD-1/PD-2, rather than a second
      single-session round.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Decision is inconclusive, not support or reject_scoped, so the
      replicated/strong-evidence promotion gate is not triggered; the
      q11,n5 secondary observation is recorded as a scoped observation in
      EV-FROB-b53a91 pending a completed panel, not promoted as a
      standalone knowledge/findings/ entry, because promoting it now would
      assert a durability the run's own incomplete_selection rule
      explicitly withholds from this run's verdict.

  decided_by: coordinator
  decided_at: '2026-09-21'
