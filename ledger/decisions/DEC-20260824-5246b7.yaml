coordinator_decision:
  id: DEC-20260824-5246b7
  decided_by: coordinator
  decided_at: '2026-08-24'
  goal_id: GOAL-ECQ-2298dc
  question_id: RQ-ECQ-e9b361
  hypothesis_id: null
  hypothesis_id_note: >-
    DELIBERATELY NULL. No hypothesis of this program's own is under test and none is named, moved
    or touched by this decision. See experiments/EXP-ECQ-f5af06/specification.yaml
    hypothesis_id_note. Naming an H-ECQ-* record here would invite exactly the inference these runs
    cannot support.
  batch_id: null

  decision: approve

  target_ids:
  - EXP-ECQ-f5af06
  - PA-ECQ-f5af06-v2-triage-gate-sign
  - TASK-20260824-02c3e4

  decision_scope: >-
    THIS DECISION APPROVES EXACTLY THREE THINGS AND NOTHING ELSE. (1) The versioned protocol
    amendment at experiments/EXP-ECQ-f5af06/amendments/PA-ECQ-f5af06-v2-triage-gate-sign.yaml, as
    a frozen overlay on the immutable v1 contract experiments/EXP-ECQ-f5af06/specification.yaml.
    (2) The re-run it governs, dispatched by ledger/handoffs/TASK-20260824-02c3e4.yaml to the
    executor at policy executor-implementation. (3) TASK-20260824-b6d348 as the Coordinator-only
    snapshot archival task for that handoff's declared artifact_paths. IT APPROVES NO CLAIM, NO
    EVIDENCE RECORD, NO HYPOTHESIS TRANSITION AND NO KNOWLEDGE PROMOTION. No run set has been
    verified for validity by this Coordinator, and this decision therefore interprets no result.

  context: >-
    GOAL-ECQ-2298dc IS UNCHANGED AND LITERAL: exhibit an elliptic curve over Q of Mordell-Weil rank
    at least 32. NOTHING HAS BEEN FOUND. TASK-20260824-261bb4 executed EXP-ECQ-f5af06 v1 and
    returned A-FULL (rank >= 31 certified for ICARM no. 302, 31 of 31, independently re-verified by
    a checker written without importing the solver), B-NULL (0 hits at 2347563 / 2347563, box
    exhausted), C-NULL (max certified rank 0 in both arms), with all six controls PASS and two
    deviations self-reported and superseded rather than edited. THE DEFECT THAT FORCES THIS
    AMENDMENT IS THE COORDINATOR'S. v1's part-C triage gate is SIGN-INVERTED: it selects the top 20
    candidates by S = sum over p <= 500 of (a_p log p) / p, but S DECREASES with rank, so the gate
    selected the LOWEST-rank candidates in each arm -- the opposite of the triage's stated purpose.
    CONSEQUENCE, STATED PLAINLY: v1's C-NULL IS REAL AS RECORDED AND UNINFORMATIVE ABOUT THE TWIST
    NEIGHBOURHOOD. The pre-registered part-C prior was met FOR THE WRONG REASON and may never be
    cited as evidence that the twist neighbourhood of no. 302 is barren. v1's Executor applied the
    frozen rule exactly as written, refused to self-authorise a change, reported the inversion as
    its most consequential finding, and preserved every per-candidate score so the re-gate needs no
    new scoring run. THAT WAS CORRECT BEHAVIOUR ON EVERY COUNT and is recorded here as correct.

  rationale:

  - id: R1-THE-CORRECTION-IS-FIXED-BY-AN-EXTERNAL-FACT
    statement: >-
      THE AMENDMENT CHANGES A SELECTION RULE AFTER SCORES WERE SEEN, WHICH IS NORMALLY THE DEFECT
      CLASS THIS PROGRAM HAS PAID FOR TWICE, AND THIS DECISION DOES NOT CLAIM EXEMPTION FROM THE
      CONCERN. It approves the change because the correction's DIRECTION is determined by the sign
      of a_p = p + 1 - #E(F_p) -- a curve of high rank has many points mod p, so #E(F_p) is large,
      so a_p is small or negative, so S is more negative -- and NOT by which candidates scored
      well. Had every candidate score in v1 been deleted, the amendment would set the same rule.
      Only the SIGN of the Mestre-Nagao heuristic is used; no quantitative or asymptotic form of it
      is asserted or relied on anywhere.
  - id: R2-THE-CALIBRATION-GROUND-TRUTH-IS-DISJOINT-AND-INTERNAL
    statement: >-
      The direction is calibrated against curves NONE OF WHICH IS A CANDIDATE IN EITHER ARM -- no
      twist of no. 302 and no a6-perturbation of no. 302 appears in the calibration. Stronger than
      that, and this is the Coordinator judgement recorded at J1 below: the four curves the
      blocking control actually uses carry rank lower bounds THIS PROGRAM ITSELF CERTIFIED in v1 --
      37a1 at 1 and 5077a1 at 3 and 389a1 at 2 from CTL-POSITIVE-INDEPENDENCE and
      CTL-NEGATIVE-INDEPENDENCE-PROVES-TOO-MUCH, and ICARM no. 302 at 31 from part A -- so the gate
      direction depends on NO external rank claim at all.
  - id: R3-THE-DIRECTION-SURVIVES-TWO-INDEPENDENT-IMPLEMENTATIONS
    statement: >-
      The v1 producer's convention includes every prime p <= 500, good or bad; the Coordinator's
      independent re-derivation skips p dividing the discriminant. Absolute scales differ and
      reconcile exactly by that choice; THE ORDERING AND DIRECTION ARE IDENTICAL UNDER BOTH. A rule
      tuned to the observed candidates would not be reproduced by an independent re-derivation
      under a different convention. LIMITATION CARRIED: the Coordinator's re-derivation has NO
      COMMITTED RUN RECORD, exactly as v1's cited membership verification did not, and it is cited
      with that limitation in the amendment's citation_provenance.
  - id: R4-THE-CORRECTION-IS-MADE-FALSIFIABLE-RATHER-THAN-ASSERTED
    statement: >-
      CTL-GATE-DIRECTION is blocking and re-establishes the direction INSIDE the v2 run set with a
      PASS condition stated before it runs. On failure nothing is gated in either arm. The
      direction is therefore not a claim in prose that a future reader must take on trust. This is
      the substantive answer to the objection that the same defect went undetected through an
      entire frozen contract once already.
  - id: R5-THE-BUDGET-CASE
    statement: >-
      v1 consumed 23.8 s of a 3600 s task budget across 7 runs of 40, with part B touching 0.5
      percent of its cap and every frozen region sized far below what was available. Under-sizing a
      frozen region is not a neutral conservatism: it buys a smaller measurement at the same price
      and makes every negative weaker than the budget could have made it. v2's regions are re-sized
      with their arithmetic exposed in the amendment's sizing_basis, to a projected consumption of
      about 1282 s -- roughly 54 times v1's -- and every v2 region STRICTLY CONTAINS its v1 region,
      so no candidate is dropped and v1's fractions remain recoverable sub-fractions.
  - id: R6-THE-MECHANISM-CHOICE
    statement: >-
      THE AMENDMENT IS AN OVERLAY AND NOT A specification.v2.yaml, AND THE REASON IS CONCRETE
      RATHER THAN STYLISTIC. tools/validate_ledger.py discovers experiment contracts by globbing
      experiments/*/specification.yaml AND NOTHING ELSE. A specification.v2.yaml would therefore be
      the GOVERNING contract that the validator CANNOT SEE, while the SUPERSEDED file keeps the
      validator's attention -- with 7099 records currently validating clean. Supporting reasons:
      docs/task-lifecycle.md defines the protocol_amendment field set and this overlay uses those
      names unchanged; the repository's only working precedent for a post-approval change is the
      overlay form at experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc36-repair-2.yaml; and since
      roughly ninety-five percent of v1's clauses are unchanged, a full copy would make every one
      of them a second source of truth. NOTE HONESTLY that specification.vN.yaml is NOT forbidden
      -- EXP-IT-001 carries v2 and v3 -- and was rejected on these grounds, not by prohibition.
  - id: R7-THE-DIRECTION-OF-PART-C-IS-SOUND-AND-A-PRIOR-COORDINATOR-FRAMING-WAS-WRONG
    statement: >-
      A PRIOR COORDINATOR FRAMING DESCRIBED THE NUMBER-FIELD TRAP AS IF IT CONDEMNED PART C
      GENERALLY. IT DOES NOT, AND THAT FRAMING IS CORRECTED BY THIS DECISION. What the trap forbids
      is ADDING RANKS: rank E(Q) + rank E^(D)(Q) = rank E(Q(sqrt D)), so pairing no. 302's rank
      >= 31 with a positive-rank twist to announce rank >= 32 OVER Q(sqrt D) is the rejected shape,
      and a previous campaign's rank->=31 result over multiquadratic fields was rejected for
      exactly that reason -- a rejection this decision does not weaken by one word. What it does
      NOT forbid: a twist E^(D) whose OWN Mordell-Weil rank OVER Q is at least 32 IS a legitimate
      rank->=32 curve over Q and WOULD meet GOAL-ECQ-2298dc C1 in full, subject to the claim bar.
      PART C'S DIRECTION IS SOUND; ONLY ITS GATE WAS BROKEN. No artifact may describe part C as
      structurally disqualified.
  - id: R8-NOTHING-HERE-IS-PROGRESS-TOWARD-RANK-32
    statement: >-
      RANK >= 31 OVER Q IS THE LIVE WORLD RECORD AND IT IS CLAIMED (ICARM no. 302, posted
      2026-08-23); no artifact may describe it as unclaimed. Part A confirms SOMEONE ELSE'S result
      and is an external positive control, never this program's own rank result. Part B found
      nothing. Part C's certified ranks are 0. This decision approves a better-pointed instrument
      and a bigger measurement; it records NO progress toward rank 32 and no ECDLP, speedup or
      asymptotic-complexity claim, so the four asymptotic promotion gates of agents/coordinator.md
      are not engaged.

  coordinator_judgements_recorded_as_such:
    why_this_block_exists: >-
      RECORDED AT THE ORCHESTRATING SESSION'S EXPLICIT REQUEST, so the audit trail shows where the
      authored contract departed from the instruction it was given and who made the call. Each item
      names the instruction as given, the judgement made, and the reason. Three of the five are
      cases where the instruction was followed but tightened; two are cases where the instruction
      was wrong or unsatisfiable and was amended.
    items:

    - id: J1-DROP-11A1-FROM-THE-BLOCKING-CONTROL
      instruction_as_given: >-
        Calibrate the gate direction on four published curves of known rank -- 11a1 at rank 0, 37a1
        at 1, 389a1 at 2, 5077a1 at 3 -- plus no. 302 at rank >= 31.
      judgement: >-
        11a1 IS CARRIED FOR THE RECORD BUT EXCLUDED FROM CTL-GATE-DIRECTION'S PASS CONDITION.
        Rank 0 is a rank EQUALITY claim, and this program's certifier produces only rank LOWER
        BOUNDS from exhibited points, so it cannot confirm it; including it would rest the
        correction on an external claim this program cannot check. The pass condition uses the four
        curves whose lower bounds v1 itself certified -- 1, 2, 3 and 31 -- which removes the last
        external dependency from the correction.
      status: adopted_and_tightened

    - id: J2-RESTRICT-PRE-REGISTERED-INFERENCE-TO-THE-DISJOINT-V2-ONLY-SUBSET
      instruction_as_given: >-
        The correction is admissible because it is fixed by an external mathematical fact rather
        than by which candidates scored well; state that framing precisely, and say so if it is
        insufficient.
      judgement: >-
        THE FRAMING IS SUFFICIENT FOR THE GATE DIRECTION AND INSUFFICIENT FOR THE BETWEEN-ARM
        COMPARISON, and the amendment adopts a stricter route for the second rather than accepting
        the first for both. 443 scores and a Mann-Whitney z of +3.24 were already observed, and no
        amount of good reasoning un-sees them; re-scoring them would not either, since the values
        were seen regardless of which run produced them. THE ONLY PRE-REGISTERED INFERENTIAL TEST
        THEREFORE APPLIES TO THE DISJOINT v2-ONLY SUBSET -- twist candidates with
        200 < |D| <= 10000 and null candidates with 100 < |v| <= 6000 -- whose scores exist nowhere
        at dispatch. Pooled and v1-subset statistics are DESCRIPTIVE ONLY and labelled so, and v1's
        descriptives are carried forward verbatim rather than recomputed.
      status: instruction_followed_for_the_gate_stricter_route_adopted_for_the_inference

    - id: J3-REQUIRE-BOTH-A-Z-THRESHOLD-AND-AN-EFFECT-SIZE-THRESHOLD
      instruction_as_given: >-
        Carry the between-arm descriptive statistics forward with no threshold pre-registered.
      judgement: >-
        WHERE A THRESHOLD IS PRE-REGISTERED AT ALL -- on the disjoint v2-only subset, per J2 -- IT
        REQUIRES BOTH |z| >= 3.0 AND A COMMON-LANGUAGE EFFECT SIZE OUTSIDE [0.45, 0.55], and the
        second is the operative condition. At roughly twelve thousand candidates per arm a z of 3.0
        is reachable from an effect far too small to mean anything, so a z threshold alone is a
        machine for manufacturing findings. NOTABLE would license one replication on a fresh
        disjoint range and nothing else; it is not a rank result, and the score certifies nothing.
      status: adopted_and_tightened

    - id: J4-REFUSE-TO-SIZE-THE-REGIONS-TO-FILL-THE-CAPS
      instruction_as_given: >-
        Size the frozen regions to actually consume the budget.
      judgement: >-
        THE REGIONS ARE SIZED TO A PROJECTED 36 PERCENT OF THE TASK BUDGET WITH ROUGHLY 3.5x MARGIN
        END TO END, NOT TO FILL THE CAPS. The caps are HARD STOPS: a region sized to exactly fill
        its cap at a nominal throughput truncates on any slower machine, silently converting a
        COMPLETE measurement into a coverage fraction. The sizing constant used is 2.0e-06 s per
        point test against a v1-measured 1.46e-06, and the arithmetic is exposed in the amendment's
        sizing_basis so it can be checked rather than trusted. This is still about fifty-four times
        v1's consumption. THE INSTRUCTION AS GIVEN -- spend the headroom -- IS NOT FOLLOWED
        LITERALLY, and the departure is recorded here rather than buried.
      status: instruction_amended_by_the_authoring_coordinator

    - id: J5-MINIMALITY-THE-INSTRUCTION-WAS-UNSATISFIABLE-AND-IS-AMENDED
      instruction_as_given: >-
        v2 must require minimality for any candidate that reaches the exact gate.
      judgement: >-
        READ AS "ESTABLISH GLOBAL MINIMALITY FOR ALL 400 GATED CURVES BEFORE GATING", THAT IS
        INFEASIBLE AT ANY BUDGET: Laska-Kraus-Connell minimalisation needs the factorisation of
        discriminants of roughly 450 to 900 decimal digits. Writing an unsatisfiable clause into a
        frozen contract is worse than writing none. WHAT THE AMENDMENT REQUIRES INSTEAD, IN THREE
        TIERS. Every gated row carries a non-null minimality_status and a PARTIAL SCREEN computed
        and LABELLED PARTIAL -- minimal at every prime p <= 100000, via p^12 dividing the
        discriminant plus a Kraus-Laska descent test, about 15 s for 400 curves -- which does NOT
        discharge claim-bar clause (1) and no artifact may say it does. ESTABLISHED minimality is
        required exactly where it binds: any row returning a certified rank lower bound of 1 or
        more, which is where a rank claim first exists. A row returning 32 or more flags claim-bar
        clause (1) as OUTSTANDING and routes out to a dedicated task plus review-breakthrough,
        rather than attempting minimalisation inline. GROUNDING: a certified rank lower bound from
        exhibited points is invariant under Q-isomorphism and needs no minimal model, so minimality
        binds the CLAIM BAR and not the arithmetic.
      status: instruction_recorded_as_amended
      the_instruction_that_was_amended: >-
        NAMED EXPLICITLY AT THE ORCHESTRATING SESSION'S REQUEST. The flat requirement "require
        minimality for any candidate that reaches the exact gate" is the clause that was amended.
        It was unsatisfiable as written and the orchestrating session has recorded that it should
        not have written it as a flat requirement.

