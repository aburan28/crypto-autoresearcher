  procedure_notes:
    approval_form: >-
      AGENTS.md RULE 1 GIVES APPROVAL EXACTLY ONE LEGITIMATE FORM AND THIS RECORD IS IT. Neither a
      note in a contract, nor an in-session message, nor an entry on tools/agent_bus.py approves an
      experiment. The amendment and the handoff both carry a dispatch_gate saying so, and both
      instruct the executor to refuse as `specification_error` if dispatched before this record is
      COMMITTED -- writing the file is not committing it.
    dispatch_blocker_lineage: >-
      DEC-20260823-ee9162 N1(h) makes dispatch without a frozen, committed contract a DISPATCH
      BLOCKER. It has two recorded instances against it in this campaign's lineage;
      TASK-20260824-261bb4 was the second, its executor refused and started nothing, and that
      refusal is recorded as correct behaviour on that handoff's procedure_deviation. This decision
