  - >-
    ledger/handoffs/TASK-20260824-02c3e4.yaml -- the re-run handoff this decision approves.
  evidence_refs_limitation: >-
    THESE ARE THE PRODUCER'S REPORTED VALUES, CROSS-READ BETWEEN report.md AND twist_search.json.
    THIS COORDINATOR HAS NOT RE-EXECUTED ANY RUN BEHIND THEM AND HAS NOT PERFORMED THE RUN-VALIDITY
    VERIFICATION -- expected run count, schema-complete manifests, seed integrity, agreement
    between raw and summary, control comparability -- that must precede interpreting any result.
    THAT VERIFICATION IS NOT REQUIRED FOR THIS DECISION AND IS NOT CLAIMED BY IT, because this
    decision interprets no result: it approves a corrected protocol and a re-run. It WILL be
    required before any evidence record cites either v1 or v2.

  limitations:
  - >-
    THIS DECISION APPROVES A PROTOCOL, NOT A RESULT. No run set has been verified valid by this
    Coordinator, no evidence record is written or implied, no hypothesis moves, and no claim is
    made about the rank of any curve.
  - >-
    THE AMENDMENT CHANGES A SELECTION RULE AFTER SCORES WERE SEEN. That remains true after every
    argument in the rationale. A reviewer is entitled to discount any between-arm INFERENTIAL
    statement drawn from the 443 v1-scored candidates, which is precisely why the amendment
    restricts pre-registered inference to the disjoint v2-only subset and labels everything else
    descriptive.
  - >-
    v1's C-NULL IS RE-SCOPED, NOT REPAIRED. It is real as recorded and uninformative about the
    twist neighbourhood. No v2 result retro-actively strengthens it, and no artifact may cite it as
    evidence that the neighbourhood is barren.
  - >-
    THE COORDINATOR'S INDEPENDENT RE-DERIVATION OF THE SCORE HAS NO COMMITTED RUN RECORD. It is
    cited with that limitation, and nothing rests on it alone because CTL-GATE-DIRECTION
    re-establishes the direction inside the v2 run set.
  - >-
    THE CALIBRATION IS FIVE CURVES AND FOUR CERTIFIED LOWER BOUNDS, NOT A PROOF AND NOT A
    DISTRIBUTION. Certified lower bounds do not pin true ranks and the Mestre-Nagao statistic is a
    heuristic. What the table establishes is a DIRECTION for a SEARCH HEURISTIC that certifies
    nothing; every rank reported by part C is decided by the exact gate.
  - >-
    THE SIZING PROJECTIONS ARE PROJECTIONS FROM ONE MACHINE'S MEASURED THROUGHPUT. If the executor's
    machine is materially slower, caps bite and the consequence is a smaller numerator over an
    unchanged denominator -- never a redefined denominator, and never negative mathematical
    evidence.
  - >-
    THE PARTIAL MINIMALITY SCREEN IS PARTIAL. Minimal at every prime p <= 100000 does not discharge
    claim-bar clause (1) and no artifact may say it does.
  - >-
    SCOPE OF ANYTHING v2 CAN PRODUCE. One curve of naive height 468.2771; one frozen x-coordinate
    box reaching 8-digit numerators; roughly twelve thousand squarefree twisting discriminants with
    |D| <= 10000; twelve thousand additive perturbations of a6 with |v| <= 6000; Mestre-Nagao
    scores to p <= 500; a reduced box reaching 6-digit numerators on 200 gated curves per arm;
    exact stdlib integer and Fraction arithmetic; one machine, one worker; a board snapshot frozen
    at 2026-08-23T00:43Z and an input fetched 2026-08-24 THROUGH A SUMMARISING FETCH TOOL whose
    board comment string is unverified at source. NO TRANSFER ASSUMPTIONS ARE MADE. Nothing here
    transfers to another curve, family, height range or search method.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED, FOR THREE INDEPENDENT REASONS, ANY ONE OF WHICH SUFFICES. FIRST, THIS IS NOT
      AN EVIDENCE-REVIEW DECISION: it approves a corrected protocol and a re-run, no evidence record
      exists or is implied, and the promotion gate fires on `support` or `reject_scoped` over
      `replicated` or `strong` evidence, none of which is present. SECOND, NO RUN SET HAS BEEN
      VERIFIED VALID BY THIS COORDINATOR -- expected run count, schema-complete manifests, seed
      integrity, raw-versus-summary agreement and control comparability have not been checked -- so
      there is nothing durable to promote and promoting from an unverified run set is exactly the
      error the gate exists to prevent. THIRD, THE ONE PART-C FINDING THAT MIGHT LOOK PROMOTABLE IS
      BEING RE-SCOPED DOWNWARD, NOT UP: v1's C-NULL is uninformative about the twist neighbourhood
      because the gate was inverted, so it supports no durable claim at all. WHAT IS DELIBERATELY
      NOT PROMOTED EITHER, AND WHY: part A's certified rank lower bound of 31 for ICARM no. 302 is a
      CONFIRMATION OF AN EXTERNAL PARTY'S RESULT on an externally claimed curve, and this program's
      corpus does not record someone else's record as an internal finding. REVISIT CONDITION: if v2
      returns a verified run set whose part-C readout under the corrected gate is replicated, or if
      the instrument-capability result (this program certifies 31-point independence at record scale
      in under 2 s, re-verified without importing the solver) is wanted as a durable technique note,
      a KN-FIND or KN-TECH entry is warranted then and is written under /curate-knowledge with a
      regenerated knowledge/INDEX.md in the same ledger archive commit.

  next_actions:
  - >-
    COMMIT AND PUSH the three records --
    experiments/EXP-ECQ-f5af06/amendments/PA-ECQ-f5af06-v2-triage-gate-sign.yaml,
    ledger/handoffs/TASK-20260824-02c3e4.yaml and
    ledger/decisions/DEC-20260824-5246b7.yaml -- to a branch with an OPEN PR against main naming
