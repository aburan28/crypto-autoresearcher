  - >-
    OPEN THE REVIEW ROUND with a review_plan written before any reviewer runs, pointing the
    reviewer explicitly at the amendment's why_this_instance_is_different and
    coordinator_judgement_on_the_framing blocks AND at J2 and J5 of this decision, and INVITING
