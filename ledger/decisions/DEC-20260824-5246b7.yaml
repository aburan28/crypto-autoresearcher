    `xhigh`; a rank-increasing part-B hit or a part-C curve certifying rank >= 32 over Q for its
    own Mordell-Weil group routes to `review-breakthrough` at `max` in a separate session under
    AGENTS.md rule 12 and may not be degraded.
  - >-
    CHECKPOINT GOAL-ECQ-2298dc after the ledger archive with this decision, the verified commit and
