  - >-
    coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-261bb4/certification.json and
    extension_search.json -- part A's certificate and part B's exhausted-box measurement.
  - >-
    experiments/EXP-ECQ-f5af06/amendments/PA-ECQ-f5af06-v2-triage-gate-sign.yaml -- the frozen
