    CONCRETE DEFECTS LISTED; IT IS NOT EVIDENCE.
  - >-
    THEN run TASK-20260824-b6d348 as a Coordinator-only SNAPSHOT archive, ALONE, staging only the
    declared paths, BEFORE independent review; the LEDGER archive is a second, separate task that
    runs alone after review. The post-commit verifier must accept each commit before anything is
