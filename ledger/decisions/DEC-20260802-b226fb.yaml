coordinator_decision:
  id: DEC-20260802-b226fb
  context: >-
    GOAL-AES-003 BATCH-002 close. Three producers ran the ranked shape
    DEC-20260802-9bda5c fixed: the wrong-hint null (rank 1), the null residue
    distribution and the zero-entry mixing-layer control (ranks 2 and 4), and an
    independent re-execution of the yoyo objects (rank 3). The package was bound
    by a DISPATCHER-VERIFIED snapshot archive at c1ff4665 -- the first archive in
    this campaign to pass its own gate -- then reviewed by an independent
    validator and an independent red team.
  decision: support
  target_ids: [RQ-AES-003, GOAL-AES-003, EV-AES-d33b1c]
  rationale:
    - >-
      RANK 1 ANSWERED THE QUESTION IT WAS BUILT FOR, IN THE DIRECTION THAT
      STRENGTHENS THE PRIOR BATCH. The hinted r=6 and r=7 constructions isolate
      the CORRECT byte: falsifying any hint byte empties the candidate set rather
      than populating it differently. Hypothesis (B) -- that the filter admits one
      survivor structurally and it was correct only because the hint was -- is
      refuted, independently re-executed by the validator on its own attack
      variant. EV-AES-005's r=6/r=7 statements therefore stand rather than needing
      supersession. The opposite outcome was pre-committed as equally reportable.
    - >-
      THE HEADLINE FINDING WAS WRONG AS FRAMED AND WAS CAUGHT BEFORE IT ENTERED
      THE LEDGER. The producer proposed superseding EV-AES-005 with a blanket
      claim that the derivation's no-zero-entry hypothesis is false. BOTH
      reviewers rejected that framing on complementary grounds: the red team
      showed the tested matrix has a single zero relaxing only one of four
      constraints for one column, so fact 2's conclusion still holds under it and
      the arm never tested what fact 2 does; the validator verified that fact 2's
      k=1 class contributes a multiple of 2^24, so the mod-8 conclusion survives
      deleting fact 2 -- making the step NON-MINIMAL, not wrong -- and ruled that
      any supersession must be SPLIT BY ROUND COUNT. The Coordinator HELD the
      supersession and minted the split version as CORR-20260802-46b73b. A
      blanket supersession would have written a NEW error into the ledger at r=4,
      where the condition is genuinely load-bearing. The red team named this
      hazard exactly: the failure mode here was not a missing result but a false
      correction made permanent.
    - >-
      THE OPEN INSTRUMENT RISK IS CLOSED, and it is the strongest single item in
      the batch. Every prior surviving control predicted zero, so a systematically
      undercounting engine would have passed them all. An exact large non-zero
      value was preregistered and returned to the digit with its occupancy
      histogram, and the paired non-critical arm returned exactly 0 -- a
      convention misalignment would have swapped them. Both reproduced by the
      validator on an engine written from scratch.
    - >-
      THE YOYO OBJECT REPLICATES IN A THIRD INDEPENDENT IMPLEMENTATION and, more
      importantly, its p-value no longer rests on an unmeasured null: the measured
      PRP null agrees with the analytic one. The structure-destroyed control reads
      1.00x, which is what makes the 15.63x interpretable.
    - >-
      THE REVIEW MACHINERY CAUGHT UNDERSTATEMENT, NOT ONLY OVERCLAIMING, BECAUSE
      IT WAS INSTRUCTED TO. Two understatements in EV-AES-005 are corrected in
      CORR-20260802-e73e06. Counting CORR-20260802-007, this campaign has now
      understated its own evidence twice and overstated it once. The asymmetry is
      recorded: reviews not explicitly told to audit in both directions did not
      find these.
  evidence_refs:
    - EV-AES-d33b1c
    - EV-AES-005
    - CORR-20260802-46b73b
    - CORR-20260802-e73e06

  measured_but_not_reviewed:
    what: >-
      Two arms under a four-zero mixing matrix, in which fact 2 is FALSE for every
      j0 rather than merely unnecessary, both read n mod 8 = 0. A post-hoc
      structural decomposition reproduced the measured count exactly.
    status: >-
      SEGMENT-3 PRODUCER OUTPUT THAT NO REVIEWER HAS SEEN. The producer was
      resumed for these arms AFTER the reviewers were dispatched, because both
      reviewers named that matrix as decisive and leaving it unrun would have
      meant writing a permanent correction while the settling measurement sat
      affordable and undone.
    weight_carried: >-
      NONE. It supports no observation in EV-AES-d33b1c and no clause of
      CORR-20260802-46b73b. That correction is written from the REVIEWED
      analysis and would read identically had these arms never been run. Naming a
      result without leaning on it is the point of this field.
    disposition: >-
      Carries to BATCH-003 as its opening input, requiring its own snapshot
      archive and independent review before any record relies on it.

  budget_accounting:
    declared_for_producers_seconds: 9600
    consumed_by_producers_seconds_approx: 15300
    ceiling_seconds: 30400
    note: >-
      THE OVERRUN IS A COORDINATOR DEFECT, RECORDED AS SUCH. Three producers were
      dispatched onto a 4-core machine against this goal's explicit instruction
      that a batch WAITS rather than run degraded. Load average reached 13; one
      producer's entire first segment was destroyed with ZERO measured numbers and
      another lost five of eight trials to timeouts. Both were repaired by
      re-running alone, and the repair is what cost the overrun. The red team
      noted that no artifact carried a running balance against the ceiling; this
      field is that balance. Timeouts are recorded as resource exhaustion
      throughout and never as negative evidence.

  limitations:
    - >-
      Nothing here is a statement about full-round or deployed AES, and no
      comparison to published cryptanalysis is made in either direction.
    - >-
      The r=6 construction works and is DOMINATED (sota_delta negative); r=7 is
      not a key recovery. Adding query cost to the domination makes it larger.
    - >-
      Session and implementation independence only. NO MODEL INDEPENDENCE under
      standing basis 0137a051, so nothing in this batch counts toward a closure
      quorum.
    - >-
      The rank 2 null-distribution gate remains NOT MET at 1 arm of >= 3.
    - >-
      Single-slot hint corruption tested only at prefix slot t=0.

  next_actions:
    - >-
      SINGLE NEXT ACTION: open GOAL-AES-003 BATCH-003 with the SEGMENT-3 REVIEW as
      rank 1. The four-zero-matrix arms are measured and unreviewed, and the
      cheapest way to convert them into evidence is a snapshot plus one
      independent re-execution. Rank 2: an independent-key arm under that matrix,
      since both existing arms share key and base and differ only in j0 -- the
      same independence defect the validator already had to repair once for the
      single-zero matrix. Rank 3: the cross-instrument anchor between this batch's
      counting engine and BATCH-001's, the one unresolved confound that could
      invalidate comparisons across batches. Rank 4: single-slot hint corruption at
      slots t=1 and t=2, roughly two short runs. Rank 5: the rank 2 null arms N2-N5
      to meet a gate this campaign set itself and has not met.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED YET, AND THE REASON IS SPECIFIC RATHER THAN CAUTIOUS. The
      candidate durable finding is the round-split scoping rule for the mixing
      layer -- dispensable at r=5, load-bearing at r=4 in an exactly stated form
      -- which is genuinely general and would outlive this campaign. It is held
      back because its r=5 half rests on reviewed ANALYSIS plus arms that are
      themselves unreviewed, and a knowledge entry is the wrong place to first
      assert something whose decisive measurement is queued for review in the
      next batch. Promote it after the BATCH-003 rank 1 review, or record why the
      review changed the picture.

  decided_by: coordinator
  decided_at: 2026-08-02
