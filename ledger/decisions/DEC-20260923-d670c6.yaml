      - SF-2: the solverevent re-solve rule, with SSF in place of NSP. The 2 s
        spacing is grounded as guaranteeing distinct seeds, and a consistency
        check enforces it. A re-solve wall-time cap keeps the extra time per
        target below 2 x per-target timeout. The per-cell watchdog is unchanged
        and its interaction is disclosed.
      - SF-3: K = 5 by declaration.
      - SF-4: REG-1 (d) = d-parsed.
      - SF-5: a Coordinator certification note, unreviewed.
