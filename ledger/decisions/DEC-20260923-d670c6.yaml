  named_defects:
    D-1_signature_misses_a_seed_driven_class: >-
      SE-1 covers only degenerate_parametrisation with the three
      non-square-free / degree reasons. Mode B (CR-1 instance) is ok at
      n_sub_fail = 0 with a different solution set. In a real package the
      frozen driver computes substitution against the system it wrote
      (v2_driver.py lines 162 and 192-197). If that system equals the parsed
      .ms, mode B becomes degenerate_parametrisation with the substitution
      reason (v2_solver.py lines 506-507), which SE-1 excludes, so it would
      NOT be re-solved. It would then:
      - remove a D at a cell under "non_generic_system (R-5)";
      - fail F-1 on a regression target;
      - change the fixture target set on a fresh target;
      - fail REG-1 at G1.
      Any of these would happen for a reason unrelated to the system.
    D-2_CR-2_counts_solves_not_seeds: >-
      The established mechanism seeds by wall-clock second. The back-to-back
      classes put about 5 solves in one second: C-1a has 500 solves in 103
      distinct start seconds, C-1c 3500 in 718, C-2 3600 in 738
      (characterization.md lines 244-252). u_c computed per solve therefore
      does not bound a per-seed failure probability, and it is optimistic by
      roughly the solves-per-second factor. A K derived from it rests on a unit
      mismatch.
    D-3_random_linear_form_path_uncovered: >-
      The -c 2 random-linear-form path (b == 2) is time-seeded (msolve.c line
      718). A failure there would surface as positive_dimensional, which SE-1
      excludes. It was not reached in the characterization. That is no
      evidence it cannot be reached at a ladder prime.
    D-4_watchdog_interaction_unaddressed: >-
      The draft keeps the watchdogs "verbatim" and bounds each attempt by the
      per-target timeout, but it never states how re-solve time interacts with
      the per-cell no-measurement watchdog. That watchdog is evaluated between
      targets on wall time (v2_driver.py lines 1149-1154). At m = 5 (43200 s
      per target, 172800 s per cell; trial-plan-v2.json lines 146-161), the
      re-solves of one target could exhaust it.
    D-5_forced_checks_cover_one_class: >-
      DV-12 forces only the NSP class. None of the forced cases exercises the
      classes of D-1 and D-3.

  remedies_weighed_given_the_mechanism:
    pinned_clock_or_seed: >-
      A single pinned seed: REJECTED. It makes a seed-driven failure
      deterministic and unrecoverable. A pinned seed SCHEDULE combined with a
      re-solve trigger: the declared FALLBACK (seedresolve option a2). It
      needs a time() interposer in the solver path, whose availability is not
      established. It changes the child environment relative to
      RUN-GFPN-ac4487, and under d-parsed it adds no protection to the
      recorded fields.
    re_solve_rule: >-
      ADOPTED, WIDENED. Spacing of at least 2 s guarantees a new seed, because
      FGLM reads time(0) after the child starts and every earlier attempt's
      FGLM began before it ended. A seed-independent failure reproduces and
      keeps its frozen class. The quotient dimension is printed before FGLM,
      never differed in 8,680 solves, and must agree across attempts, so the
      rule cannot select among D values.
    c_flags: >-
      REJECTED.
      - The FGLM srand site is reached regardless of -c.
      - -c 1 fails the 12 raw_x / raw_u archived inputs ("Computation failed"),
        which default flags solve.
      - -c 0 quits on non-generic staircases.
      - The 200 + 200 flagged solves on the event input spanned 41 seconds
        each, too few seeds to show removal of a failure seen in 1 of 603
        default-flag seconds.
      (characterization.md lines 330-342, 359-379.)
    substitution_check: >-
      ADOPTED AS A TRIGGER. It is already computed by the frozen driver
      (v2_driver.py lines 192-197), so no new check is added. Its coverage of
      mode B rests on a premise the characterization did not check: that the
      .ms equals the substituted system (characterization.md line 438). The
      premise check's PR-1 checks it before approval.

  executor_deviations_ruled:
    DEV-1_uncapped_help_and_version: >-
      ACCEPTED AS DISCLOSED, AS A BREACH OF CH-2 WITH NO EFFECT ON ANY
