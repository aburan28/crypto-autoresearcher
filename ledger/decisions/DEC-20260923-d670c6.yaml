      - SF-1 SSF signature: degenerate_parametrisation with any of the four
        classify_solve reasons (v2_solver.py lines 498, 500-502, 503-505,
        506-507, the last being the substitution failure), OR
        positive_dimensional with msolve's random-linear-form message in the
