  rationale:
    - >-
      THE PRE-DECLARED RULE DECIDES. CR-1 was written before the
      characterization ran and names exactly the observed case. Following it
      is the point of having declared it. The draft's rule was built for one
      failure class, and the data show two.
    - >-
      THE MECHANISM CHANGES WHICH REMEDY IS SOUND, NOT THE READING. Clock
      seeding explains why re-solving works: a new second gives a new seed.
      It also shows that -c flags cannot remove the FGLM randomness, and that
      one pinned seed would make a bad seed permanent. So the successor keeps
      the re-solve design, keeps the frozen solver path, and widens only the
      trigger.
    - >-
      NO OUTCOME IS REPAIRED OR TUNED. K is fixed at the top of the range
      already declared, without reading any rate. The (d) branch comes from a
      rule declared before its data. The trigger clauses are classify_solve's
      own reasons and msolve's own message. The premise check's readings are
      declared before it runs.
    - >-
      STRICTNESS IS NOT LOOSENED. REG-1 still compares the recorded attempt
      with no tolerance. The exclusion list gains nothing. Every attempt is
      preserved. A failure that reproduces keeps its frozen class.
    - >-
      THE BIAS IS TOWARD THE DECIDABLE QUESTION. Criterion C1's measured side
      and KN-OPEN-9b4a2b need the v2-a1 ladder. A second development finding
      is a reason to fix the pipeline, not to abandon the lead (AGENTS.md
      "Research-direction integrity").
    - >-
      NO SECURITY READING. The work uses toy EcGFp5-shaped arithmetic with
      known scalars, and nothing transfers to p = 2^64 - 2^32 + 1.

