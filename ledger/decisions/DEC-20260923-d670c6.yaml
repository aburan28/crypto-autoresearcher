  mechanism_recorded:
    provenance: >-
      retrieved. The Executor of TASK-20260923-6599cf read the Ubuntu msolve
      0.6.5-1build2 source package from archive.ubuntu.com. The orig tarball
      sha256 is 30e3712eab4077438e2b3228d5958adb7e8488e523244a02320f80bd8c412c89,
