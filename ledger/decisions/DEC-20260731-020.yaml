coordinator_decision:
  id: DEC-20260731-020
  context: >-
    GOAL-FAEST-001 BATCH-001 (campaign open): obtain and file the Round-3
    FAEST primary sources, then run object-first ideation for RQ-FAEST-001
    with matched AES baselines. TASK-20260731-012 filed KN-LIT-7637, KN-LIT-7638, KN-LIT-7619..7620
    plus a sources note under verified snapshot b706062f. TASK-20260731-014
    produced IDEA-20260731-019, IDEA-20260731-002..003 plus an ideation report under verified
    snapshot 37d8ee81. Independent red-team TASK-20260731-005
    (review-adversarial, independent_session: true, resolved model
    opencode/deepseek-v4-flash-free) returned ADMIT on all three ideas with
    zero fatal objections and five nonfatal scope fixes (RSF-1..5). Evidence
    EV-FAEST-001.
  decision: admit_ideation_to_experiment_design
  target_ids:
    - IDEA-20260731-019
    - IDEA-20260731-002
    - IDEA-20260731-003
    - GOAL-FAEST-001
    - RQ-FAEST-001
    - TASK-20260731-012
    - TASK-20260731-014
    - TASK-20260731-005
    - EV-FAEST-001
  rationale:
    - >-
      All three IDEA records are schema-complete, name an exact attack object
      (never 'attack FAEST'), carry the matched AES-128 baseline (2^126.1
      biclique; Grover 2^64) under one cost convention, and include
      falsification conditions with deployed-parameter re-derivation gates
      and toy-tier labeling per AGENTS.md rule 7. Independent review passed
      all five checks with no fatal objection.
    - >-
      Primary sources are now filed and citation-verified (KN-LIT-7637, KN-LIT-7638, KN-LIT-7619..7620).
      The headline source finding — no Round-3 FAEST specification exists as
      of 2026-07-31; v2.0 is the latest — is recorded and does not pause the
      goal: v2.0 + faest-ref + IR 8610 suffice for experiment design with the
      Round-3 tweak tracked as a caveat. The csrc.nist.gov obstruction
      recorded in RQ-FAEST-001 was not observed in the sources task.
    - >-
      The five nonfatal scope fixes (RSF-1..5) are accepted and carried into
      the BATCH-002 experiment-design contracts. RSF-5 (spec v2.0 PDF-text
      blocker) is the single gating dependency: no experiment may be designed
      until the exact deployed check equation, (kappa, tau), field size, and
      LeafCommit/bAVC modes are pinned from primary-source text or a pinned
      faest-ref commit is adopted as ground truth.
    - >-
      No hypothesis, experiment, run, or certificate was created in BATCH-001;
      this decision admits proposals to experiment design only. No claim about
      FAEST's deployed security is made or implied.
    - >-
      Independence was achieved: the review ran in a separate session with an
      independent_session_required handoff and no shared lineage with either
      producer; receipt validity, mathematical interpretation, baseline
      comparison, and novelty were treated as separate checks.
  evidence_refs:
    - EV-FAEST-001
    - knowledge/literature/KN-LIT-7637.md
    - knowledge/literature/KN-LIT-7638.md
    - knowledge/literature/KN-LIT-7619.md
    - knowledge/literature/KN-LIT-7620.md
    - coordination/goals/GOAL-FAEST-001/batches/BATCH-001/archives/TASK-20260731-013/snapshot-receipt.json
    - ledger/proposals/IDEA-20260731-019.yaml
    - ledger/proposals/IDEA-20260731-002.yaml
    - ledger/proposals/IDEA-20260731-003.yaml
    - coordination/goals/GOAL-FAEST-001/batches/BATCH-001/archives/TASK-20260731-015/snapshot-receipt.json
    - coordination/goals/GOAL-FAEST-001/batches/BATCH-001/tasks/TASK-20260731-005/review_report.yaml
    - coordination/goals/GOAL-FAEST-001/batches/BATCH-001/tasks/TASK-20260731-005/objections.md
  limitations:
    - The admitted ideas are measurement/barrier lanes, not attack mechanisms; none claims a breakthrough.
    - All deployed-parameter statements are placeholders until the spec PDF-text blocker (RSF-5) is resolved.
    - The one-pair OWF data-budget caveat (RSF-1) must be carried into every matched-baseline block before any barrier wording is used.
    - Toy-scale falsification, if it fires, is toy-tier until re-derived at deployed parameters.
  next_actions:
    - >-
      Open BATCH-002 as a single design gate: resolve RSF-5 by extracting or
      pinning the deployed parameters (exact consistency-check equation,
      degree, (kappa, tau), field, LeafCommit/bAVC modes) from spec v2.0
      section-security text / eprint 2023/996 full text, or by adopting a
      pinned faest-ref commit as ground truth; apply RSF-1..4 to the IDEA
      records; then design experiment contracts for the highest-priority
      admitted idea (IDEA-20260731-019 or -002, per re-derivation outcome).
      Do not exceed the remaining five batches of the campaign budget.
  hypothesis_status_record:
    note: >-
      No H-FAEST-* hypothesis file was created. The three IDEA records remain
      at proposal stage until BATCH-002 designs and approves a frozen
      experiment contract. GOAL-FAEST-001 remains active; no completion
      criterion is met.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      The four KN-LIT entries (KN-LIT-7637, KN-LIT-7638, KN-LIT-7619..7620) are primary-source
      literature entries already filed in the knowledge corpus by the producer
      and are archived in the snapshot; no separate promotion is needed. No
      technique or finding promotion is warranted from BATCH-001: the ideas
      are proposals and no result was established.
  decided_by: coordinator
  decided_at: '2026-07-31'
