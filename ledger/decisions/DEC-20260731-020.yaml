      goal. Every agreement obtainable here is CORRELATED confirmation, which is
      why C5 rests on MECHANICAL RE-EXECUTION. `completed` is unreachable; no
      attestation is recorded.
    - >-
      THESE THREE RECORDS ARE UNCOMMITTED AT THE TIME OF WRITING AND ARE
      THEREFORE NOT YET DURABLE (AGENTS.md "Durable research commits"). They must
      be committed in an ISOLATED OPENING COORDINATION COMMIT, the branch pushed,
