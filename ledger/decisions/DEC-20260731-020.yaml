      (ruling 9(3)). NOTE THE DISTINCTION THAT MATTERS FOR THIS GOAL: the four
      gates govern ASYMPTOTIC-COMPLEXITY claims. GOAL-AES-003's primary success
      mode is not an asymptotic claim but an EXECUTED, CERTIFIED, MEASURED
      concrete result at a stated round count, whose evidence is a re-verifiable
      certificate and an instrumented counter rather than a proof decomposition. A
      MODELLED or asymptotic cost claim arising here faces all four gates in full
      and is capped at `analyzed`; a MEASURED concrete result does not become an
      asymptotic claim by being fast.

  limitations:
    - >-
      THIS DECISION ASSERTS NOTHING ABOUT AES, at any round count, in any threat
      model. It creates two records and takes scoping rulings. No distinguisher,
      no key recovery, no speedup, no measured structural excess and no barrier
      statement is asserted or implied.
    - >-
      THE HONEST EXPECTATION IS THAT THIS CAMPAIGN PRODUCES NO IMPROVEMENT ON THE
      PUBLISHED REDUCED-ROUND FRONTIER, and that if it produces an executed
      certified attack at all, that attack is a rediscovery. Opening the question
      is a refusal to close prematurely, not a prediction of success. THE THING
      THAT IS DIFFERENT HERE IS NOT THE ODDS OF A NOVEL RESULT BUT THE ABILITY TO
      GET A DETERMINATE ANSWER.
    - >-
      THE ATTACK-FAMILY LIST, THE EXISTENCE OF PUBLISHED 5-, 6- AND 7-ROUND
      RESULTS, AND THIS COORDINATOR'S EXPECTATION OF REDISCOVERY ARE ALL RECALLED
      FROM MEMORY AND ALL UNVERIFIED. They are recorded so their status is
      explicit and are usable as neither authority nor comparison. Novelty against
      the external literature is UNRESOLVABLE here, in both directions.
    - >-
      THE MEASURED FIGURES THIS DECISION RELIES ON — 7.555e7 enc/s single core,
      2^38.81 per task, 2^42.63 per campaign, the 53 s 2^32 sweep, the integral
      death at r = 5, the influence-bias death at r = 4, the mu series and the
      state-distinctness measurements — ARE DISPATCHING-SESSION, COORDINATOR-SIDE
      MEASUREMENTS AND ARE EXPLICITLY NOT INDEPENDENT VALIDATION. They share the
      campaign's single resolved model under 0137a051. Re-measurement under an
      independent Validator is rank 3 of the next action, and none of them may be
      load-bearing in a completion argument until then. FOUR-CORE SCALING IS
      ASSUMED LINEAR AND NOT MEASURED, and the MEMORY-BOUND envelope — where
      MITM- and table-style constructions actually bind — IS ENTIRELY UNMEASURED.
    - >-
      THE AES-NI C PATH IS AN UNPINNED SECOND INSTRUMENT. Its round-count
      convention is declared but not re-verified against the pinned harness across
      r = 3-7, and integral_depth_probe.c is additionally reported by the red team
      to contain a real C defect at line 42 (argv[2] cast as a ternary condition;
      atoi/strtoull with no stdlib.h) which affected the printed seed and,
      reportedly, not the accumulators. NO MEASUREMENT MAY BE CHARGED TO IT UNTIL
      IT IS PINNED.
    - >-
      THREE ACTIVE AES CAMPAIGNS NOW SHARE ONE MACHINE, roughly 68000 s of budget
      is in flight, and CONCURRENCY RATHER THAN SECONDS IS THE BINDING CONSTRAINT.
      The decision not to pause either predecessor to make room is ruled in
      ruling 4 and is the most attackable line in this record.
    - >-
      BLK-1 MEANS THIS GOAL'S PRIMARY COMPLETION CRITERION IS CURRENTLY
      UNEXPRESSIBLE by a conforming run record. That is an infrastructure fact
      about this repository, not a mathematical one, and it is the first item of
