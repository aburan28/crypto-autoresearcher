coordinator_decision:
  id: DEC-20260731-020
  context: >-
    A NEW RESEARCH DIRECTIVE was set by the user: FIND A BREAKTHROUGH FOR
    REDUCED-ROUND AES. The dispatching session put a structural question first,
    and answering it is this decision's primary act: GOAL-AES-001 ALREADY covers
    reduced-round AES (RQ-AES-001, rounds 3-7, toy tier) and is `active` at
    BATCH-004 with a ranked BATCH-005 shape bound by DEC-20260731-018 — a shape
    that is OD-4 / CTRL-810-A / pre-screen reform, i.e. CONSOLIDATION AND
    INSTRUMENT WORK RATHER THAN BREAKTHROUGH-SEEKING. Three options were put:
    (a) redirect GOAL-AES-001's BATCH-005 toward attack construction by
    superseding DEC-20260731-018's ranked shape; (b) open a distinct
    breakthrough-seeking question and goal alongside it; (c) something better.
    THIS DECISION RULES (b), AS MODIFIED — it opens RQ-AES-003 and GOAL-AES-003
    as an EXECUTION-AND-CERTIFICATION question distinct from RQ-AES-001's
    SCREENING-AND-DERIVATION question, draws the non-duplication boundary
    explicitly on the decision target and the reference rather than on the round
    range, and REFUSES option (a) on the merits with reasons recorded. It also
    rules on what counts as a breakthrough here, carries three corrections
    forward so the new goal does not inherit broken reasoning, and ranks the
    BLK-1 infrastructure blocker as load-bearing rather than hypothetical.
    IT REVIEWS NO EVIDENCE, CREATES NO HYPOTHESIS, AND ASSERTS NOTHING ABOUT AES
    AT ANY ROUND COUNT.
  decision: approve
  target_ids:
    - RQ-AES-003
    - GOAL-AES-003

  id_provenance: >-
    RQ-AES-003, GOAL-AES-003 and DEC-20260731-020 were verified free by directory
    listing at authoring time (highest existing: RQ-AES-002, GOAL-AES-002,
    DEC-20260731-019; no DEC-2026080* exists), independently of the dispatching
    session's own verification, which agreed. If a concurrent branch has published
    any of them by merge time the collision is resolved by a CORR record under a
    new id (CORR-20260731-006 is next free), NEVER by editing a committed record
    and never by resolving a sync conflict inside one. The ID continues the AES
    campaign's 20260731 decision series; the session taking it is running on
    2026-08-01 and the divergence is preserved rather than smoothed over, exactly
    as DEC-20260731-019 preserved its own.

  rationale:
    - >-
      RULING 1 — THE STRUCTURAL QUESTION, ANSWERED (b)-AS-MODIFIED, AND THE
      BOUNDARY DRAWN ON THE DECISION TARGET RATHER THAN THE ROUND RANGE. The
      overlap with RQ-AES-001 is real and is not glossed over: both cover
      reduced-round AES at r in 3-7 at toy tier. They do not duplicate, because
      RQ-AES-001 asks WHICH NAMED PROPAGATION OBJECT admits a result whose cost
      "matches or beats A NAMED BASELINE MECHANISM", and its work is object-first
      screening, the lossy-projection test, novelty deduplication and derivation.
      RQ-AES-003 asks whether an attack can be BUILT, RUN TO COMPLETION,
      CERTIFIED, AND MEASURED, against references that are adjudicable inside this
      repository. The unit of work is a working program plus a re-verified
      certificate plus an instrumented cost, not a screened candidate plus a
      derivation. FOUR BATCHES UNDER RQ-AES-001 SPENT ZERO CRYPTANALYTIC COMPUTE
      ON AES ITSELF AND PRODUCED NO CLAIM ABOUT AES AT ANY ROUND COUNT
      (EV-AES-001..004, each saying so in its own headline). That is not a
      criticism of that campaign, whose work is real and honestly recorded; it is
      a diagnosis of a MODE. Screening and derivation without execution has been
      tried at length here. Building and running the attack has not been tried at
      all.
    - >-
      RULING 2 — THE REFERENCE IS WHY A SEPARATE QUESTION IS NECESSARY RATHER
      THAN MERELY TIDY, AND THE PRECEDENT IS THIS PROGRAM'S OWN. RQ-AES-001's
      decision target is bound to a comparison against a NAMED BASELINE MECHANISM
      whose figures are unverified-from-memory — the exact comparison
      DEC-20260731-011 STRUCK program-wide and DEC-20260731-019 ruling 3 ruled
      UNADJUDICABLE IN BOTH DIRECTIONS. Executing the present directive requires
      REPLACING that reference with references this environment can adjudicate.
      Replacing the reference of a committed question under which four batches of
      reviewed evidence and two knowledge entries were produced is the retroactive
      act DEC-20260731-019 refused when it opened RQ-AES-002 rather than widening
      RQ-AES-001. The same reasoning here gives the same answer in the opposite
      direction of scope. RQ-AES-003's three references are named in its R1:
      REF-A the DEFINITIONAL exhaustive-key-search cost at round count r; REF-B a
      generic baseline THIS CAMPAIGN implements, freezes and measures itself at
      the same r; REF-C THIS CAMPAIGN'S OWN MEASURED DEATH ROUNDS.
    - >-
      RULING 3 — OPTION (a) IS REFUSED ON THE MERITS, AND THE REASONS ARE
      SPECIFIC RATHER THAN DEFERENTIAL. Redirecting GOAL-AES-001's BATCH-005
      toward attack construction would require superseding DEC-20260731-018's
      ranked shape, and it fails on four independent grounds, any one of which is
      sufficient.
      (i) IT WOULD MAKE THAT CAMPAIGN'S REFUSAL TO PAUSE RETROACTIVELY DISHONEST,
      IN THAT DECISION'S OWN WORDS. DEC-20260731-018 declined to pause on exactly
      two grounds, the first and decisive being that BATCH-004's own red team
      demonstrated the campaign screened out its best remaining exponent-relevant
      candidate on an erroneous constant (RT-8, traceable to this Coordinator's
      own guidance, D-811-2), and it wrote that "declining to attempt it now,
      having refused to pause BECAUSE of it, would make the refusal to pause
      dishonest". CAND-806-A's bounded-index-subgroup residual is rank 1 of
      BATCH-005 for that reason. Redirecting the batch away from it is precisely
      the act that decision forbade its author.
      (ii) IT WOULD BREACH THIS COORDINATOR'S OWN CONTRACT. CTRL-810-A is
      HEUR-806-1's own already-specified validation experiment, and the
      Coordinator contract requires a conditional result to be paired with a
      heuristic-validation experiment in the same or the FOLLOWING batch.
      BATCH-005 IS THAT FOLLOWING BATCH, which makes CTRL-810-A NON-DEFERRABLE.
      Dropping it leaves RT-1, RT-2, RT-3 and RT-5 unsettled while the package
      that provoked them stands committed.
      (iii) THERE IS NO CAPACITY. maximum_batches is 6 and FOUR ARE SPENT.
      BATCH-005 is the LAST batch that may open new research questions and
      BATCH-006 is reserved for consolidation and the terminal record
      (DEC-20260731-018). A genuinely new research programme — build a harnessed
      attack, build a baseline, freeze a cost model, execute, certify, replicate,
      red-team the cost model — does not fit in one batch of 8600 s, and pretending
      it does would guarantee a batch that produced neither the consolidation nor
      the attack.
      (iv) THE OBJECTIVE WOULD NOT FIT THE QUESTION IT IS BOUND TO. RQ-AES-001's
      decision target would still demand a named-baseline comparison this
      environment cannot adjudicate, so the redirected batch's output would have
      no reference. Redirecting the batch without also replacing the reference
      solves nothing; replacing the reference is ruling 2's retroactive act.
    - >-
      RULING 4 — THE THIRD CONCURRENT AES CAMPAIGN IS THE HARDEST PART OF THIS
      DECISION AND IS RULED ON EXPLICITLY RATHER THAN ABSORBED. Opening
      GOAL-AES-003 puts roughly 68000 s of AES budget in flight across three
      campaigns — GOAL-AES-001 with 15042 s remaining, GOAL-AES-002 with 22500
      unspent, this goal at 30400 — on a machine with four cores and a
      concurrency cap of 3 SHARED ACROSS ALL THREE. Pausing one of the others to
      make room was considered and REFUSED: GOAL-AES-001 was NOT paused eleven
      hours ago on a recorded rationale that has not changed and on a user
      authorization obtained on an adverse-leaning disclosure, and re-pausing it
      now to fund a newer campaign would be exactly the momentum-driven act
      DEC-20260731-018 argued against; GOAL-AES-002 was opened yesterday on
      DEC-20260731-019's rulings and has not yet run a batch, so there is no
      evidence on which to pause it. THE HONEST POSITION IS THAT CONCURRENCY, NOT
      SECONDS, IS THE BINDING CONSTRAINT ACROSS THE THREE, and GOAL-AES-003's own
      record says its batch WAITS rather than running degraded. THE
      COUNTER-ARGUMENT IS RECORDED IN THAT GOAL'S
      `what_a_red_team_should_attack_here` AS ITEM 1 AND IS NOT ANSWERED HERE
      BEYOND THIS: this is the only one of the three that can reach a DETERMINATE
      verdict, and that answer is only as good as its first executed run turns
      out to be.
    - >-
      RULING 5 — WHAT COUNTS AS A BREAKTHROUGH HERE, RULED IN THREE FORMS, ALL
      ADJUDICABLE INSIDE THIS REPOSITORY WITH NO LITERATURE.
      BT-1 — AN EXECUTED, CERTIFIED KEY RECOVERY BEATING THE DEFINITIONAL
      REFERENCE AT ROUND r. REF-A is 2^(k-1) r-round AES-k evaluations, which
      follows from the key length and the definition of the cipher. NOTE WHAT
      DOES NOT CHANGE WITH r: THE KEY LENGTH. Reducing rounds reduces the cost of
      one trial, not the number of trials, so REF-A at r = 5 for AES-128 is 2^127
      five-round encryptions — an executed attack beats it by an enormous margin
      or not at all, which is exactly why the comparison is decidable on a machine
      whose whole-campaign reach is 2^42.6. THIS IS THE FLOOR AND THE ENTRY
      TICKET. It is determinate, checkable and certified, AND IT IS VERY PROBABLY
      A REDISCOVERY — a judgement which, being an unverified recollection, MAY NOT
      BE USED TO DOWNGRADE IT.
      BT-2 — AN EXECUTED, CERTIFIED KEY RECOVERY BEATING A GENERIC BASELINE THIS
      CAMPAIGN IMPLEMENTS AND MEASURES ITSELF AT THE SAME r. This is the strongest
      COMPARATIVE statement available here and it is a real comparison precisely
      because BOTH SIDES ARE BUILT AND RUN IN THIS REPOSITORY — the
      DEC-20260731-019 ruling 6(iii) route, merely conceivable at full round and
      actually affordable at reduced rounds. THE DISCIPLINE THAT SEPARATES IT
      FROM A RIGGED COMPARISON IS NON-NEGOTIABLE AND IS WRITTEN INTO C2: the
      baseline is tuned in good faith, its parameters FROZEN AND COMMITTED BEFORE
      the candidate's cost is measured, produced by a DIFFERENT task, and it is
      the object an independent red team is specifically tasked to attack.
      BT-3 — A NEW DISTINGUISHER SURVIVING BEYOND THIS CAMPAIGN'S OWN MEASURED
      DEATH ROUNDS. This has the most genuine information content of the three,
      because REF-C is MEASURED ON THIS MACHINE rather than recalled or
      definitional: the full-diagonal 2^32 integral holds exactly through r = 4
      and is dead at r = 5 (0/16 for two independent keys, full-entropy
      accumulators); the 1-byte delta-set integral holds through r = 3; the
      key-indexed influence object is at the null from r = 4 by per-cell bias; and
      CAND-FR-2's linear-structure set died at r = 2-4. A DATA-PATH DISTINGUISHER
      SURVIVING TO r >= 6, OR A KEY-INDEXED ONE TO r >= 5, IS STRICTLY BEYOND
      EVERY OBJECT THIS PROGRAM HAS MEASURED. It requires, without exception, a
      MEASURED false-positive rate against a matched random-permutation control at
      the same data complexity, a round-count decay check, THE INSTRUMENT'S
      RESOLUTION STATED IN BITS, and a SIBLING NULL that isolates the property
      named.
      WHAT DOES NOT COUNT is ruled at the same standard in
      GOAL-AES-003.what_does_not_count, and its first item is the one the whole
      goal turns on: A MODELLED COST IS NOT A RESULT.
    - >-
      RULING 6 — THE COMPARISON AGAINST PUBLISHED REDUCED-ROUND CRYPTANALYSIS
      REMAINS UNADJUDICABLE, AND DEC-20260731-019 RULING 3 IS CARRIED FORWARD BY
      REFERENCE IN FULL AND IN BOTH DIRECTIONS. No record under RQ-AES-003 may say
      "this beats the published reduced-round frontier". EQUALLY AND WITH THE SAME
      FORCE, none may say "this falls short of it", "this is only a rediscovery of
      the classical square attack", or "our r = 6 distinguisher is uninteresting
      because one is known". Using an unverified recollection to DISMISS is the
      same fabrication under AGENTS.md rule 9 as using it to PROMOTE, and it is
      additionally the premature-closure failure CLAUDE.md names as symmetric with
      overclaiming. THE PLACE THIS BITES HARDEST IS NAMED SO IT IS NOT MISSED: a
      first executed certified attack at r = 4 or 5 is, on this Coordinator's
      unverified recollection, very likely known — and that recollection may not
      touch its verdict. THE TWO VERDICTS ARE SEPARATE AND ARE NEVER MERGED: the
      verdict against REF-A / REF-B / REF-C is DETERMINATE, and the verdict on
      novelty is `inconclusive` and says so plainly.
    - >-
      RULING 7 — THE SUBSTANTIVE POINT THAT MAKES THIS DIFFERENT FROM
      GOAL-AES-002, ADOPTED AS THE DESIGN OF THE COMPLETION CRITERIA. GOAL-AES-002
      is capped at `analyzed` FOREVER by its own R7 and by DEC-20260731-019
      ruling 8: a certificate proves a claimed solve is real on the instance
      solved but does not validate a cost model, and this environment cannot
      execute at the scale where a full-round cost claim would be tested —
      measured reach 2^42.6 against 2^128 (MEAS-GOAL-AES-002-001, 7.555e7 enc/s
      single core). AT r = 4-6 THAT CAP LIFTS, and the reason is specific rather
      than optimistic: THE ATTACK RUNS, THE RECOVERED KEY IS CHECKED AGAINST THE
      TARGET CIPHERTEXTS UNDER AN INDEPENDENT IMPLEMENTATION, AND THE COST IS
      MEASURED ON THE MACHINE THAT RAN IT. Every completion criterion is therefore
      written to demand an EXECUTED attack with a VERIFIED CERTIFICATE and a
      MEASURED cost — instrumented counter, measured wall clock, MEASURED peak
      RSS, counted queries with their kind, and success probability MEASURED over
      declared independent instances — and to accept no derivation, no
      extrapolation and no model in their place. WHAT DOES NOT LIFT IS THE CLAIM
      TIER: every record here is `toy`-tier and reduced-round-only, exactly as
      RQ-AES-001 binds, and RQ-AES-002's single `crypto` gate is a full-round gate
      unavailable here. THE TIER BOUNDS WHAT MAY BE ASSERTED; IT DOES NOT BOUND
      THE EVIDENTIAL STATUS A HYPOTHESIS MAY REACH. That distinction is the entire
      design of RQ-AES-003 R6 and is the reason this is the only AES goal in this
      program under which a hypothesis can honestly reach `supported`.
    - >-
      RULING 8 — BLK-1 IS LOAD-BEARING HERE AND IS RANKED FIRST. The certificate
      vocabulary in docs/claims-and-verification.md admits only
      `discrete_log | decomposition | none`, and `check_run` in
      tools/validate_ledger.py errors on any other `kind`, so AN AES KEY-RECOVERY
      CERTIFICATE CANNOT CURRENTLY BE EMITTED BY A CONFORMING RUN RECORD. Under
      RQ-AES-002 that gates an outcome the campaign does not expect to reach; HERE
      IT GATES THE OUTCOME THE CAMPAIGN IS BUILT TO PRODUCE, so it is rank 1(a) of
      the single next action and must be COMMITTED BEFORE any card is issued that
      could produce a solve. THIS COORDINATOR ADDS ONE REQUIREMENT NOT PRESENT IN
      DEC-20260731-019's version: THE ROUND COUNT IS A MANDATORY FIELD OF THE
      `key_recovery` STATEMENT, because a reduced-round certificate that does not
      state r is transcribable as a full-round claim. NON-DUPLICATION RULING,
      SINCE TWO GOALS NOW NEED THE SAME REPOSITORY-LEVEL CHANGE: whichever
      campaign authors it first OWNS it and the other ADOPTS IT BY EXPLICIT
      REFERENCE rather than authoring a second amendment to the same clause; if
      GOAL-AES-002 commits one without the round-count field, this campaign's
      amendment is a narrow ADDITIVE supersession of that clause alone, under a
      new id, never an edit. BLK-1 IS AN INFRASTRUCTURE BLOCKER, NEVER A NEGATIVE
      MATHEMATICAL RESULT (AGENTS.md rule 5).
    - >-
      RULING 9 — THREE CORRECTIONS ARE CARRIED FORWARD SO THE NEW GOAL DOES NOT
      INHERIT BROKEN REASONING, AND ALL THREE RUN AGAINST THIS PROGRAM'S OWN
      PRIOR STATEMENTS.
      (1) THE INFLUENCE-DENSITY CLOSURE IS WITHDRAWN AS STATED. The density
      statistic HAS NO POWER BY CONSTRUCTION — a pure random function with zero
      structure measures 0.4995 against the AES reading of 0.4996 — so a
      CONTROLLED NULL WAS READ AS A CLOSURE. The key-indexed object dies one round
      later (r = 4) and by a different statistic (per-cell bias, +43.84 sd from
      null at r = 3). The original receipt is not edited;
      CORRECTION-influence-and-O3.json (MEAS-GOAL-AES-002-006) is the correction
      of record. THE RESIDUAL BINDS EVERY DISTINGUISHER CLAIM UNDER THE NEW GOAL:
      the bias probe resolves to ~2^-8.8 per cell against a relevant threshold of
      2^-40, so "at the null" means "below an instrument about 30 bits too blunt",
      and every distinguisher and death-round claim must state its instrument's
      resolution in bits in the same sentence.
      (2) THE O-3 CEILING'S PREMISE IS MEASURABLY FALSE THOUGH ITS CONCLUSION
      SURVIVES ON MEASURED GROUNDS. Measured mu falls 194.4 -> 125.2 -> 12.3
      against a PRE-REGISTERED discriminator that it should RISE, and is capped
      analytically at 200 x 256 = 2^15.64 (MEAS-GOAL-AES-002-006); the conclusion
      is re-established because full 16-byte states are FULLY DISTINCT across a
      structured key coset at every round with zero collisions
      (MEAS-GOAL-AES-002-007), and sharing exists ONLY at byte granularity, with
      one column, one diagonal and eight bytes all fully distinct
      (MEAS-GOAL-AES-002-008). NO RECORD UNDER RQ-AES-003 MAY CITE THE 7.64-BIT
      FIGURE AS THE JUSTIFICATION FOR THE BOUND, and the bound is scoped to affine
      master-key cosets at d <= 12 with four coordinate projections; other
      structured families and non-coordinate projections are UNMEASURED.
      (3) PROMOTION GATE (4)'s INDEPENDENT-CONFIRMATION HALF IS STRUCTURALLY
      UNSATISFIABLE UNDER THIS HARNESS (RT-13; DEC-20260731-017; NOT re-scoped by
      DEC-20260731-018 and NOT re-scoped here, since re-scoping a review
      requirement is a separate amendment on its own rationale). NO PROMOTION
      UNDER GOAL-AES-003 MAY REST ON IT. THE OPERATIVE CONSEQUENCE, WHICH IS THIS
      COORDINATOR'S ADDITION: what carries evidential weight here is MECHANICAL
      RE-EXECUTION by a session that did not author the artifact — re-run the
      certificate verifier from committed bytes, re-run the attack from its
      committed seed and reproduce its counter, recompute the digests,
      re-implement the baseline's cost count from scratch — and NOT judgemental
      concurrence between correlated sessions. The certificate discipline is what
      makes this campaign less exposed to that structural gap than its
      predecessors: a certificate is CHECKED, not agreed with.
    - >-
      RULING 10 — WHAT WORKS IS INHERITED BY CITATION RATHER THAN RESTATED, AND
      THE INHERITANCE IS EXPLICIT RATHER THAN ASSUMED. In force from BATCH-001 of
      GOAL-AES-003: the artifact-provenance gate of
      protocol-amendment-GOAL-AES-001-004 Part B AS CORRECTED by amendment 005
      Part C (covering manifest, closed case-insensitive class vocabulary,
      in-text inference stanzas); the clock convention of amendment 005 Part B
      C1-C6 verbatim, with the C4 compute-reported-separately clause load-bearing
      here because this is the first AES campaign whose producers spend real
      compute; amendment 005 Part A's coordination-act charging fix, so no
      coordination act is charged at zero; amendment 003's measured accounting
      basis; the certificate discipline of docs/claims-and-verification.md; the
      requirement that a producer's own falsification gate be PRE-REGISTERED with
      its predictions bound to a committed digest (the TASK-20260801-807
      practice); the requirement that NULLS BE SIBLINGS and ISOLATE the property
      they name (V-804-1, KN-FIND-018 practice rule 6); KN-FIND-018's practice
      rules on instruments, including rule 4 on multiple random vectors; and the
      pre-screen with the five DEC-20260731-017 reforms plus RT-9's ruling that
      "no upper bound exhibited" is a FATIGUE REPORT and not a vacuity verdict,
      with DEFERRED_UNBOUNDED kept OUT of any count of rulings.
    - >-
      RULING 11 — THE PRIOR IS STATED PLAINLY AND THE QUESTION IS STILL OPENED,
      AND THE HONEST DIFFERENCE FROM FULL-ROUND IS NAMED RATHER THAN IMPLIED.
      Reduced-round AES is heavily studied, the 4-6 round frontier is a mature
      literature, and the odds of a genuine improvement here are low; RQ-AES-003's
      motivation says so in those words. THEY ARE FAR BETTER THAN FULL-ROUND:
      improvements at 5-7 rounds are still published, the round range is where
      structure demonstrably still exists rather than where it demonstrably does
      not, and unlike full-round WE CAN ACTUALLY TEST. Premature closure remains a
      failure mode symmetric with overclaiming, "the 4-6 round space is mined" is
      a hypothesis about the search whose honest status is `unverified`, and the
      incident that motivated the inventor protocol (KN-LIT-7594) is a model
      declining AES cryptanalysis on exactly these grounds immediately before
      improving a best-known attack. ONE DELIBERATE ASYMMETRY IS RULED HERE AND IS
      NOT PRESENT IN RQ-AES-001 OR RQ-AES-002: the off-limits family list binds
      the NOVEL arm only, while BUILDING AND RUNNING A KNOWN ATTACK IS PRODUCTIVE
      WORK under this question, because a baseline built and measured here is the
      only comparative reference this environment can adjudicate at all.
    - >-
      RULING 12 — BUDGET, SIZED BOTTOM-UP WITH NO CUSHION, AND THE ARGUMENT
      AGAINST IT RECORDED. Four batches and 30400 MEASURED seconds, sized from
      GOAL-AES-001's measured per-role actuals at or near each role's observed
      maximum with NO cushion and NO rounding slack, per amendment 005 Part A's
      discipline adopted at the opening: 8800 + 7700 + 7700 + 6200 = 30400
      exactly. FOUR RATHER THAN THREE, giving three research batches against
      GOAL-AES-002's two, on the specific ground that this is the only AES goal
      whose success mode is EXECUTABLE AND CERTIFIABLE HERE, so a batch spent here
      can produce a determinate verdict rather than a derivation. BATCH-004 is
      reserved for consolidation and the terminal record and MAY NOT OPEN NEW
      RESEARCH LINES — the GOAL-AES-001 lesson inherited rather than relearned. A
      FIFTH BATCH REQUIRES A VERSIONED AMENDMENT ON THE MERITS OF WHAT THE FIRST
      FOUR PRODUCED. COMPUTE FITS INSIDE THE 1600 s PRODUCER LINE AS A MEASURED
      CLAIM RATHER THAN AN ASSUMPTION: 2^38.81 AES evaluations per task, and a
      full-diagonal 2^32 integral sweep measured at 53 s. THE FOUR
      COUNTER-ARGUMENTS ARE RECORDED IN THE GOAL'S OWN
      `what_a_red_team_should_attack_here`, and the fourth is this Coordinator's
      sharpest concern against its own sizing: the 1600 s producer line was
      measured on AUTHORING-HEAVY tasks that spent almost no compute, and this
      campaign's producers write code, run it and write it up.
    - >-
      RULING 13 — GOAL-AES-001 AND GOAL-AES-002 ARE NOT TOUCHED. This decision
      does not pause, close, supersede, re-scope, re-budget or reprioritize either
      goal; does not alter RQ-AES-001's or RQ-AES-002's claim_tier_ceiling in any
      respect; does not change the status, strength, tier or scope of
      EV-AES-001..004; and does not re-read KN-FIND-017 or KN-FIND-018.
      GOAL-AES-001 remains `active` at BATCH-004 with its single next action —
      draft, commit and dispatch the BATCH-005 queue in the DEC-20260731-018
      ranked shape — INTACT, UNREORDERED AND UNABSORBED, and DEC-20260731-018's
      ranked shape IS NOT SUPERSEDED. GOAL-AES-002 remains `active` with its
      single next action intact. Prior derivations may be cited under RQ-AES-003
      as INPUTS carrying their original scope verbatim: Proposition 806-1 only at
      one super-box interface, for the F-linear round-independent subclass, never
      as a cost inequality and never with U-809-1 dropped; PROP-701-I and
      Proposition 801-1 WITHHELD and not citable as established; section 5's cost
      table STRUCK. RESOURCE CONTENTION IS RULED ON: max_concurrent 3 is a cap
      ACROSS ALL THREE AES GOALS, not 3 each, and no campaign's budget may be
      charged for another's work.
    - >-
      RULING 14 — `completed` IS UNREACHABLE, `supported` IS NOT, AND THE
      DIFFERENCE IS RECORDED AT THE OPENING RATHER THAN DISCOVERED AT THE CLOSE.
      Under AGENTS.md rule 13 and CLAUDE.md rule 8 a GOAL closes only on three
      CONCUR attestations with pairwise distinct resolved_model_id; under
      inference-amendment 0137a051 every role in this harness resolves to one
      model, so `completed` is unreachable unless the dispatching session
      deliberately routes three different backends. No completion_quorum block is
      created and NO ATTESTATION IS RECORDED. WHAT IS REACHABLE IS A DIFFERENT
      OBJECT: a HYPOTHESIS under this goal may reach `replicated` and `supported`
      on executed, certified, measured evidence, scoped to the tested rounds. If a
      completion criterion is met without the quorum, the honest transition is
      `paused` with the supported hypothesis recorded at its exact tier and the
      quorum named as outstanding — never `completed`, and never `closed_at_budget`
      used to retire a goal that DID meet a criterion.

