  context: >-
    User request, 2026-08-30, verbatim: "Add goal to develop quantum algorithm
    for lwe, rlwe, mlwe". This decision records the creation of
    GOAL-QLWE-291164 and its three research questions as an operational anchor.
    It authorizes NO batch, NO task dispatch, NO experiment, NO implementation,
    and NO run; it moves no hypothesis status and promotes no knowledge entry.
    The goal is created in `draft` and a separate Coordinator ledger commit
    moves it to `active` when its first batch is opened.
  target_ids:
    - GOAL-QLWE-291164
    - RQ-QLWE-1c4a3b
    - RQ-QLWE-9108dc
    - RQ-QLWE-d2d713
  rationale:
    - >-
      SCOPE AS REQUESTED, SPLIT INTO THREE FALSIFIABLE LANES. The request names
      three hardness assumptions, not one scheme, so the goal's object is the
      LWE family with the algebraic structure separating its members as the
      variable under study. Lane 1 (RQ-QLWE-1c4a3b) establishes the matched
      quantum baseline per assumption and adjudicates standing claims; Lane 2
      (RQ-QLWE-9108dc) searches the algebraic-structure mechanism space against
      mandatory null-object controls; Lane 3 (RQ-QLWE-d2d713) maps whether the
      quantum machinery inside LWE's own hardness reduction can be run in the
      attack direction. Lane 1 gates the other two: a mechanism cannot be scored
      against a baseline that has not been written down.
    - >-
      NON-DUPLICATION ESTABLISHED BY RECORD INSPECTION, NOT BY ASSUMPTION. The
      nearest existing work is RQ-QALG-457b41 under GOAL-QALG-001, which owns
      the quantum sieving/enumeration lane against MLWE/MSVP scoped to
      standardized ML-KEM parameter sets. This goal does not search that lane
      and asserts no ML-KEM parameter-set verdict. The boundary was checked
      directly: H-MLKEM-36f511 (RQ-QALG-457b41) evaluates Simon 2026's stated
      constants at FIPS 203 parameters, and H-MLKEM-7f3a2c (RQ-MLKEM-001,
      status approved) is a conditional reach map whose own statement grants
      KN-OPEN-8a5965's Q1 "WITHOUT ADJUDICATING IT -- Q1 is explicitly OUT OF
      SCOPE for this record". Neither adjudicates Q1. A repository-wide search
      on 2026-08-30 found no ledger record referencing KN-LIT-1743 (Luo 2026)
      at all. The unowned gap is therefore real and specific, and this goal
      takes it.
    - >-
      A CORPUS DEBT MADE OWNABLE. The knowledge corpus carries three claims of
      polynomial-time quantum attacks reaching this family in three different
      states: KN-LIT-52ce4c (Chen 2024, main LWE claim retracted after a bug in
      Step 9), KN-LIT-e204ab (Simon 2026, unverified preliminary draft, all four
      substantive lemmas labelled "(Sketch)"), and KN-LIT-1743 (Luo 2026,
      bulk-seeded on 2026-07-24 from a local PDF's first two pages, self-flagged
      as heuristically parsed and independently unverified, claiming ML-KEM,
      Falcon, Hawk and NTRU broken at all standardized parameter sets).
      KN-OPEN-8a5965's posture -- "record, do not re-plan" -- was correct on the
      day each was filed and remains binding until a claim is adjudicated. It is
      not a permanent substitute for reading one named step, and KN-OPEN-8a5965
      itself names the cheapest such step. Lane 1's second completion criterion
      converts that standing debt into a bounded, recordable verdict per claim.
    - >-
      GOOD-FAITH SEARCH WITH AN EXPLICIT NULL BRANCH. No break is presupposed.
      The governing base rate is KN-LIT-52ce4c: a credentialed author, a
      specific checkable algorithm, enormous stakes, and a fatal defect found in
      a single step within ten days. That prior cuts both ways and is written
      into the goal that way -- it is a reason to read the load-bearing step
      rather than to dismiss the claim, and a reason never to restate an
      unverified claim as fact. A rigorous null with named obstructions in one,
      two, or all three lanes is the expected and fully legitimate outcome, and
      premature closure is treated as a failure mode symmetric with
      overclaiming (docs/inventor-protocol.md). Deprioritizing any lane must
      record its evidence, budget, test boundary, remaining uncertainty, and a
      concrete successor or revisit condition.
    - >-
      CLAIM CEILINGS SET AT CREATION, NOT LEFT TO A LATER BATCH. Lane 1 is
      literature and derivation only and runs no attack. Lane 2 is toy-scale
      measurement, symbolic derivation, and obstruction mapping only, with
      certificates required for any claimed recovery and both controls -- plain
      LWE at equal total dimension, and a structure-removed nearby ring shape --
      run before any structural claim is believed. Lane 3 is derivation and
      obstruction mapping with toy-scale instrument checks. No record produced
      under this goal may state that any deployed scheme is or is not secure.
      Any claim of a mechanism beating the baseline on a real parameter set
      routes to `review-breakthrough` rather than to ordinary adversarial review.
    - >-
      BUDGET IS FINITE AND THE 2026-08-28 STANDING DIRECTIVE IS NOT INHERITED.
      DEC-20260828-fe4cfa recorded the user's "Fund every goal" instruction with
      a scope the user pinned as the 47 goals active on origin/main at 49f2868f2
      on 2026-08-28. GOAL-QLWE-291164 was created on 2026-08-30 and is not in
      that set, so its campaign_budget is finite (6 batches, 18000 seconds) and
      its budget pause condition can fire. Extending the directive to this goal
      would be a Coordinator self-grant of a user authorization, which that
      directive's own record forbids; it requires fresh explicit user
      authorization recorded as its own decision and budget amendment. This is
      stated in the goal record as well, so a future reader cannot mistake the
      omission for an oversight.
    - >-
      SHARDED LAYOUT AT CREATION. The goal is created directly as
      ledger/goals/GOAL-QLWE-291164/goal.yaml rather than as a flat file, so its
      batch checkpoints are write-once per-batch shards from the first batch and
      no later conversion is needed. Both layouts validate; converting an
      existing goal remains a task for whoever next has it open, never a bulk
      operation (CLAUDE.md, "Concurrency: many agents, many worktrees").
    - >-
      IDENTIFIERS MINTED WITHOUT SCANNING STATE. GOAL-QLWE-291164,
      RQ-QLWE-1c4a3b, RQ-QLWE-9108dc, RQ-QLWE-d2d713 and this decision's own id
      were drawn with `tools/allocate_id.py --next` and each confirmed free with
      `--check` before use, per the concurrency rule against grepping for "the
      next free number".
