  limitations:
  - Toy tier. 80 primes below 2000 (at most 11 bits), precision 4, 3200 pairs, F_p^* only.
  - The rejection is of the smallest-primitive-root instantiation frozen in run.py; the hypothesis text said only
    "generator g". The random-root reading (expected z 0.18 +/- 1.21) is review-side and untested by runs.
  - The elliptic analogue (red-team O1/O9) is a review-side computation on two curves, not a run record; it is model-
    and lift-convention-dependent (37a1 minimal model gives integral multiples d in {1, 2, 3, 4, 6}, short model
    {1..6}).
  - The z statistic treats rows as i.i.d.; duplicates and clumping inflate sd(z) to about 1.1-1.2 under the null
    rules. No criterion outcome changes.
  - The recorded vanishing flag covers 40 distinct points per seed (s(g)); full-row coverage (omega(g^d), 3200/3200)
    is the validator's.
