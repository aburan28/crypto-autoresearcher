  scoped_claim: 'Scope: toy tier, G_m only. Two seeds (20261009, 20261010), each 40 seeded primes 50 < p < 2000
    with 40 pairs (1600 pairs), d in [2, p-3], precision 4, g the smallest primitive root. (i) The Teichmuller section
    is homomorphic on every sampled pair, log_p(s(x)^{p-1}) vanishes on every sampled point and the Smart-style
    ratio is never defined. (ii) The random-Hensel ratio equals d on 3 of 3200 pairs against 5.39 at mean 1/p (ratio
    0.56, 95% CI 0.12-1.63). (iii) The naive integer section''s ratio equals d on 13 and 20 of 1600 pairs (z = 7.65,
    9.14), exactly on the pairs with g^d mod p^2 < p: all 24 pairs with g^d < p succeed, no pair with p <= g^d <
    p^2 can, and the other 9 match the exact conditional null (1.37x, CI 0.63-2.60). (iv) The naive section is homomorphic
    exactly when x*y < p (10 and 10 against 9.35 and 12.96); the Hensel section on 0 pairs (p^-3). H-CZLIFT-d37231
    is rejected as posed in its naive-success and homomorphism-rate clauses. The falsifying excess is the archimedean
    no-carry region (Eisenstein''s logarithmic property of the Fermat quotient); it carries no discrete-log information
    beyond an O(log p) integer-logarithm check and is no evidence of p-adic leakage or about any elliptic curve.
    Evidence: EV-CZLIFT-f2a401. Runs: RUN-CZLIFT-0cefcd, RUN-CZLIFT-a5c1da. Review tasks: TASK-20261022-2d255e,
    TASK-20261023-20d7d9.'
  rationale:
  - The run set is valid. Both planned trials (2 of 2) reached output_validated with seeds as frozen and a clean
    commit; custody holds on 32 hashes; every frozen metric recomputes exactly; the validator's implementation-independent
    replay matches 3200/3200 rows on every field; the Teichmuller control passes, so the instrument-invalidity clause
    is not triggered. No run claims a solve, so no certificate is owed. No defect returns to the Executor.
  - 'The pre-registered falsification criterion is met as written: a non-canonical section (naive) has z > 4 on
    both seeds (7.65, 9.14), under every z variant the validator computed (minimum 7.24). It is read against the
    hypothesis''s own 1/p null, which is the null the hypothesis asserts (red-team R2). The criterion is not re-read
    after the fact.'
  - 'The refutation has a checkable artifact stronger than empirical-only. Derivation (analysis.md I-1, D-1 to D-4):
    the functional reads the Fermat quotient mod p; by Eisenstein''s logarithmic property the ratio is d + k/(r
    q_p(g)) mod p for g^d = r + kp, so success holds iff g^d mod p^2 < p; the naive section is homomorphic iff x*y
    < p. Two independent implementations (validator J3 sealed blind; red team r2_nulls) reproduce every recorded
    success bit on 3200/3200 rows. The falsification is replicated across two seeds within the frozen protocol.
    reject_scoped is therefore permitted (docs/claims-and-verification.md, Refutation artifacts); it is not a single
    unreplicated empirical-only run.'
  - 'Second false clause. "Homomorphic on a fraction near 1/p" is false for both non-canonical sections by D-4:
    naive 10 and 10 against 9.35 and 12.96 under x*y < p (P(>= 10) under 1/p is 5.7e-5 on seed 20261009), Hensel
    0 and 0 against p^-3. The metric was secondary and unscored, so the falsification does not rest on it, but it
    makes the statement false a second way and bars it from any knowledge note (red-team O4).'
  - 'I weighed weaken against reject_scoped. weaken fits evidence that lowers credence without settling the clause.
    Here the clause is settled: the exact mechanism is derived and checked row by row, and the generator arms (review-side)
    show the excess appears exactly where the derivation says. A restated "refine" hypothesis (excluding the sub-p
    range) would re-test an elementary identity. reject_scoped with an explicit scope is the proportionate transition,
    and rejected is the ledger state for it (AGENTS.md Research states).'
  - 'Strength is strong for the falsification, not for the program''s scientific position: frozen protocol, theorem-level
    control, same-shape null, two seeds far beyond threshold (random-root P(z > 4 on both) about 3.3e-5), exact
    mechanism, full independent replay. Its scientific content is weak: it refutes a mis-derived prediction (an
    unnumbered random-model assumption about a structured section, red-team O3), not the stated mechanism, and the
    effect is an elementary archimedean one. The Hensel clause is supported only to 1.63x of 1/p (red-team O5).'
  - 'Red-team R1 accepted. The break is on transfer only: an elliptic analogue exists where the integral section
    coincides with a small global point (37a1 short model, 1420/1420 at d in {2..6}; y^2 = x^3 + 17, 287/287 at
    d = 2), bounded by the integral multiples of the global lift. This overturns the third part of my recorded prior
    in REVIEW-CZLIFT-BDAE69-EVIDENCE-20261023 ("no elliptic analogue"); the first two parts (Teichmuller and Hensel
    hold; the naive excess is a smallest-root artifact) were confirmed. The overturned part is the useful result
    of this round: it requires stratifying elliptic Smart-style statistics in this goal before they are read as
    random rate.'
  - The specification's decision_impact.on_negative is not executed. It predicted that a negative would "contradict
    a textbook fact" and send the log_p instrument to repair. The instrument is verified (validator replay, PTM-1,
    red-team own ratio) and the textbook fact that applies, Eisenstein's property, predicts the excess (red-team
    O2).
  - 'Red-team R2 and O7 accepted: the seed-20261010 residual (7 rest successes) is sampling variation under the
    exact conditional null (P = 0.12); the validator''s "rest rate exceeds 1/p at small primes" is true only for
    particular primes, not in the population (0.984 +/- 0.085).'
  - 'No gate blocks the transition. asymptotic_claim is null, so the four promotion gates of agents/coordinator.md
    do not apply; the exemplar checklist does not apply (no heuristic-conditional complexity claim). The direction
    is contradicts; the obstruction block is complete with a quantity, value, units, error bars, runs and scope,
    and its resource_check is examined (no new lane). The closure gate does not apply: no lane is closed.'
