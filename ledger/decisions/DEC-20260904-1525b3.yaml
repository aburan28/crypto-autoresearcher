coordinator_decision:
  id: DEC-20260904-1525b3
  recorded_at: '2026-09-04'
  goal_id: GOAL-AES-003
  question_id: RQ-AES-003
  batch_id: BATCH-a861e9
  decision: open_batch
  decision_rationale_for_verb: >-
    Batch-opening decision for the EXECUTION-GATE REVIEW ROUND named as
    RANK 1 by the goal head after DEC-20260904-5427fa (the ledger archive
    of BATCH-519c76, now on main via PR 732 / merge commit fd375dbec).
    This round is the last design-only gate before any execution-
    authorization decision on the FM-cascade candidate IDEA-20260904-
    6aed0b: it rules RT2-SR-5 (the Coordinator's adoption trade), runs the
    red-team re-review reserved from BATCH-519c76's opening decision, and
    ADVISES the Coordinator on whether any execution of D-1 or D-2 may be
    authorized. The round itself authorizes nothing; the authorization
    decision, if ever taken, is a separate committed Coordinator decision.

  context: >-
    IDEA-20260904-6aed0b is the reviewed, RT2-SR-1..4-closed FM-cascade
    candidate (promoted by DEC-20260904-5427fa after J-C1
    HOLDS_WITH_FINDINGS, all checks PASS). DEC-20260904-5427fa's
    execution_gate_statement requires, before any execution authorization:
    (1) this gate round including the reserved red-team re-review;
    (2) RT2-SR-5 ruled; (3) adoption conditions AC-1/AC-2 satisfied if the
    gate batch relies on the skeleton or treats the pricing JSON as
    binding verbatim-standing text. This batch is requirement (1) plus (2);
    requirement (3) is deferred unless the round reaches adoption.

  target_ids:
    - IDEA-20260904-6aed0b
    - DEC-20260904-5427fa
    - DEC-20260904-031ed2
    - TASK-20260904-937822
    - GOAL-AES-003
    - RQ-AES-003

  coordinator_prior: >-
    RECORDED BEFORE ANY REVIEWER RUNS, per the review-architecture
    obligation. What I expect this round to find: (1) on RT2-SR-5, I expect
    the 0.171940 range-wide false-plateau bound on the OBJ-5A calibration
    family to be CONFIRMED as a real disclosed worst-case over phi in
    [1.0, 2.0], with the 11-17% residual remaining a bounded price that
    cannot be removed without abandoning bound-carrying plateau sentences
    entirely; I expect the honest gate options to be (i) accept the bound
    as a standing disclosed price with an explicit per-arm false-positive
    budget in any execution design, or (ii) require a tighter bound before
    execution - and I lean toward (i) BECAUSE the design already pays a
    larger disclosed price on the decay branch (0.018883 routing to
    FM-OVERDISPERSED under the written cascade order). If a reviewer shows
    the 0.171940 bound is a point estimate rather than range-wide, or that
    the residual is larger than disclosed, that OVERTURNS my expectation
    and is the most valuable outcome of the round. (2) I expect the
    validator to confirm the SR-2 heterogeneity bound arithmetic one final
    time at gate scope and find the execution_gate_statement checkable as
    written. (3) I expect the red team to find NO scope creep introduced by
    the RT2-SR-1..4 corrections (they were fidelity-only) and all five
    proves-too-much objects still routing correctly under the corrected
    design; any licensed sentence beyond NARROW/RAT scope would be a
    BREAKS-level finding. (4) I expect both reviewers to treat AC-1/AC-2
    as dormant (this round adopts no binding document). A review that
    returns exactly my expectations on all four points is LESS informative
    than one that overturns any of them; the prior exists so the
    difference is measurable.

  review_plan:
    joints:
      - joint: J-G1
        owner: TASK-20260904-f5b7fc
        role: validator
        scope: >-
          Quantitative gate basis: independently re-derive the OBJ-5A
          calibration family's false-plateau bound and verify it is
          RANGE-WIDE (worst case over phi in [1.0, 2.0]), not a point
          estimate; re-derive the 11-17% disclosed residual decomposition;
          re-derive the SR-2 heterogeneity bound at gate scope; verify the
          execution_gate_statement of DEC-20260904-5427fa is checkable as
          written. Fresh sealed code; blind to the red-team report.
        worked_attack_plan: >-
          Where I think it breaks: the 0.171940 bound may hold only at the
          grid endpoints or under the both-points split reading; the
          residual decomposition may double-count or drop a boundary cell;
          the 'range-wide' claim may implicitly condition on Branch H not
          firing. Attack each: sweep phi off-grid, re-enumerate the
          residual split with independent code, recompute under both
          cascade conventions.
      - joint: J-G2
        owner: TASK-20260904-f405c6
        role: red-team
        scope: >-
          License audit and RT2-SR-5 attack: re-run the five proves-too-
          much objects against IDEA-20260904-6aed0b (post-correction);
          search for any sentence the corrected candidate licenses beyond
          NARROW-1..5/RAT-3/4/5 with SR-1 scope; find the cheapest
          counterexample to the 0.171940 / 11-17% claims; adjudicate
          whether AC-1/AC-2 are dormant this round. Blind to the validator
          report.
        worked_attack_plan: >-
          Where I think it breaks: the RT2-SR-2 written-order restatement
          may have quietly changed a routing verdict for a margin-zone
          reading; the restored verbatim blocks may carry a glyph that
          changes arithmetic meaning; the 0.171940 bound may not survive
          the OBJ-5B split-point naming (RT2-SR-4) when the split is read
          k=4-only. Attack each with the object definitions themselves.
    blindness:
      within_round: >-
        The two reviewers may not read each other's reports; each attests
        what it read. Neither reads the other's task directory.
      lifted_for: []
    proves_too_much_control: >-
      Inherited from J-R2 and re-run by J-G2: the five objects (including
      the homogeneous-null OBJ-4 and the analytic-null-mean heterogeneous
      object) for which an FM-PLATEAU-CONSISTENT verdict is KNOWN FALSE
      must all route away from plateau-consistent under the corrected
      design.
    blind_rederivation: >-
      J-G1 re-derives the gate quantities from the object definitions and
      the DEC-20260904-5427fa / red_team_report statements alone, never
      from the producer's or prior validator's implementations.

  decision_summary: >-
    Open BATCH-a861e9 on branch aes003-exec-gate-20260904 (from main
    fd375dbec): 1 validator (J-G1, fresh session), 1 red-team (J-G2, fresh
    session, the re-review reserved from BATCH-519c76), 1 ledger archive
    (composes both joints into the gate-advisory decision
    DEC-20260904-c501b9). No producer task: the round reviews the existing
    candidate; nothing new is authored except the two review reports and
    the gate decision. No snapshot task: there is no new producer package
    to bind; reviewers read only already-archived, hash-pinned artifacts.

  budget_accounting: >-
    Batch budget 3700 s wall (validation 1400 + red team 1400 + ledger
