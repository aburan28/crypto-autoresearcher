        The mechanism this Coordinator had in mind for rank 1, stated so the
        designer does not have to rediscover it and CAN CHECK IT RATHER THAN
        INHERIT IT. On a binary elliptic curve defined over F_2 and considered
        over F_{2^d}, the Frobenius endomorphism is believed to satisfy a
        quadratic characteristic relation of the form pi^2 - t pi + 2 = 0 on the
        point group, with t the trace. If the factor base F is Frobenius-stable,
        pi(F) = F, then P_1 + ... + P_m = R implies pi(P_1) + ... + pi(P_m) =
        pi(R) at zero cost -- a free orbit action on the m-SUM solution set, which
        a generic oracle does not have by definition.
