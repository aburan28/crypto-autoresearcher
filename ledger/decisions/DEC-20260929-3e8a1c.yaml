    - check: >-
        Whether EXP-ICEX-850e41 tests HEUR-GENERIC-MSUM, by comparing the two
        objects field by field rather than by resemblance.
      result: >-
        IT DOES NOT, ON THREE INDEPENDENT AXES, AND THIS IS THE ENGAGEMENT'S MOST
        CONSEQUENTIAL FINDING. (i) FIELD. H-ICEX-8f9ea2's first words are "SCOPE
