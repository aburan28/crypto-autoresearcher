        at all. These connect only through the group isomorphism Z/n = <P>, whose
        non-computability is the ECDLP itself. (iii) REGIME. 850e41 runs w up to
        l/2 (w = 12 at l = 24), so subset size is comparable to basis size -- the
        balanced-knapsack regime where the recalled representation gains
        (BCJ 2^{0.291n} against MITM 2^{0.5n}) are asymptotic. HEUR-GENERIC-MSUM is
        fixed small m with |F| = 2^d large -- the k-SUM regime, whose generic
        bounds are a different literature. A representation gain in the first
        regime is not evidence about the second.
    - check: >-
        Whether the integer arm is a blocking positive control that a broken
        implementation would actually fail.
      result: >-
        YES FOR TOTAL FAILURE, NO FOR PARTIAL FAILURE, AND THE CONTRACT DOES NOT
        SEE THE DIFFERENCE. C3 catches the dominant defect -- a SOLVER-R that is
        SOLVER-I with extra bookkeeping yields rho_int about 1 and the run is
        correctly voided as UNTESTED. But C3's pass test is the bare inequality
        rho_int < 1, with no floor. At rho_int = 0.95, |log2 rho_int| = 0.074 and
        the pre-registered decision lines become Delta >= 0.055 and Delta <= 0.018
        -- bands narrower than any realistic bootstrap interval, so the verdict is
        decided by noise while every blocking gate reports PASS. The
        self-calibration is a genuinely good idea that DEGRADES GRACELESSLY: as
        rho_int approaches 1 from below the bands collapse to zero width and the
        instrument silently stops discriminating. Repaired by A2.
    - check: >-
        Whether the curve-free (Z/n, +) arm separates the curve's contribution
        from a generic cyclic group's, or whether the two collapse.
      result: >-
        AS SPECIFIED IT SEPARATES THE WRONG THING, AND THIS IS THE HIGHEST-VALUE
        REPAIR IN THIS DECISION. The contract declares the elliptic arm's filter
        ("a bucket of the x-coordinate, or a quadratic character") and the integer
        arm's filter ("a prefix of the integer"). IT NEVER DECLARES THE CURVE-FREE
        ARM'S FILTER. On (Z/n, +) a group element IS an integer mod n, so the
        natural reading of "the identical solvers" makes its filter a bucket of the
        integer representative -- which is approximately sum-compatible up to carry
        and modular wrap, i.e. structurally the INTEGER arm's filter, not the
        elliptic arm's. So the elliptic and curve-free arms differ in TWO ways at
        once, group law AND filter, and any observed difference is unattributable
        between them. G7/P7's pre-stated consequence is well designed and is
        exactly the right discipline; it just cannot fire cleanly on this design.
        MY PRIOR, RECORDED BEFORE THE RUN: the curve-free arm will track the
        INTEGER arm rather than the elliptic arm, G7 will NOT fire, and without
        repair the contract would record a clean "the curve contributes something"
        reading that is in fact a filter artifact. Repaired by A1.
    - check: >-
        Whether "one frozen operation counter" actually fixes the degenerate band,
        or picks one arbitrary point in it.
      result: >-
        IT FIXES THE DISCRIMINATOR BUT THE CONTRACT'S STATED REASON IS FALSE. The
        claim, in objective (C) and in assumptions, is that "the counting
        convention cancels because it appears identically above and below". That is
        wrong as a general statement: the three conventions of statement (D) differ
        in WHAT IS CHARGED (one balanced list; list plus complement lookup over
        success probability; all weight splits on each half), and those change
        SOLVER-I and SOLVER-R by DIFFERENT factors, because SOLVER-R's defining
        property is that its lists are larger and overlapping. A convention that
        charges list construction penalises SOLVER-R more. So rho = T_R/T_I is NOT
        convention-invariant and the cancellation argument does not hold.
        WHAT DOES HOLD, AND IS BETTER THAN THE CONTRACT CLAIMS FOR ITSELF: C8 pins
        the convention to a SPECIFIC PRE-COMPUTED CHECKABLE POINT (SOLVER-I's R at
        23.1 / 13.3 / 7.47 within a factor of 1.5), which is Convention 3 and is
        not arbitrary; and Delta = log2 rho(group) - log2 rho(integer) cancels any
        convention effect that acts IDENTICALLY on both arms. The residual risk is
        precisely the case where it does not act identically -- which is live here,
        because the arms use different filters (see A1) and therefore plausibly
        different list structures. Measured rather than assumed by A3.
    - check: >-
