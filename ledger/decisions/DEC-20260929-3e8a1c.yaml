  rationale:
    - >-
      THE RANKING IS DECIDED BY RELEVANCE TO THE NAMED ASSUMPTION, NOT BY
      READINESS. EXP-ICEX-850e41 is the most READY of the three -- a complete
      contract needing four additive repairs -- and it is ranked second, because
      readiness is not relevance and the engagement was asked to attack
      HEUR-GENERIC-MSUM. Ranking the ready thing first is the standing temptation
      an unlimited ECC budget creates, and AGENTS.md names it: never dispatch a
      task you cannot rank ahead of doing nothing. I can rank 850e41 ahead of doing
      nothing on RQ-ECDLP-002. I cannot rank it ahead of rank 1 on the question
      actually asked.
    - >-
      THE STRONGEST FINDING IS THAT THE PROXY DOES NOT HOLD. Low Hamming weight and
      m-SUM decomposition are relatives, and the resemblance is close enough that
      the inference is available to a careful reader. They differ on field, on
      which object is decomposed, and on parameter regime, and each difference
      alone breaks the transfer. Finding this before the run costs an amendment;
      finding it after a quotable Delta exists costs a correction and leaves a
      number in the corpus that reads as bearing on a binary-curve heuristic.
    - >-
      THE CURVE-FREE ARM WAS THE ONE THAT DID NOT SURVIVE THE AUDIT INTACT. The
      contract's own G7 is excellent discipline -- pre-stating that arm agreement
      voids the ECDLP reading is exactly what a null object is for -- and the arm
      as specified cannot deliver it, because its filter is undeclared and the
      natural reading makes it the integer arm's filter. Two variables move
      together and the result is unattributable. A1 crosses the filter axis with
      the arm axis at essentially zero cost, and the reason it is worth an
      amendment rather than a note is that the UNREPAIRED failure mode is not a
      null result -- it is a clean-looking positive reading of a filter artifact.
    - >-
      A POSITIVE CONTROL THAT DEGRADES GRACELESSLY IS THE SAME CLASS OF DEFECT AS A
      CONTROL THAT CANNOT FAIL, AND IT IS HARDER TO SEE. C3 catches the failure it
      was designed for. What it does not catch is the partial success that leaves
      the decision bands narrower than the noise while reporting PASS, and the
      self-calibrating design is what creates that mode: tying the bands to the
      measured dynamic range is right, and it needs a floor or the bands can
      vanish. A2 declares that floor now, with nothing observed, which is the only
      time a threshold can be declared honestly.
    - >-
      I CORRECTED A CLAIM THE CONTRACT MAKES IN ITS OWN FAVOUR RATHER THAN
      ACCEPTING IT. "The counting convention cancels" is the sentence that
      justifies the whole replacement statistic, and it is false as stated, because
      the conventions differ in what is charged and the two solvers have different
      list structures. The replacement statistic is still a large improvement on
      the source's degenerate absolute band -- C8 pins the convention to a
      checkable point and Delta cancels arm-common effects -- but the protection is
      narrower than advertised and its residual is live precisely where A1 found
      the arms differ. A3 measures the residual instead of assuming it away, from
      the same runs.
    - >-
      ROUTE 3 IS DEFERRED ON RELEVANCE AND IS NOT CLOSED, AND THE DISTINCTION IS
      THE ENGAGEMENT'S INSTRUCTION AS WELL AS THE PROTOCOL'S. KN-FIND-ffe1df says
      in its own words that the empirical result does not close the hole and that
      eight toy primes are not a bound; I adopt that rather than improving on it.
      The reason it is not this session's work is that it is prime-field and the
      premise under attack is binary-field, so success there would leave the
      premise untouched -- a better and more checkable reason than difficulty, and
      one that comes with a revisit condition either limb of which is observable.
    - >-
      THE ICEX HOLD IS REAL AND IS NOT REACHED, AND I READ IT RATHER THAN ROUTING
      AROUND IT BY HABIT. EV-ICEX-001 prohibits implementing or measuring the ICEX
      index-calculus EXPONENT protocol until the SDEG/MONO/RELN conjunction is
      satisfied, and that conjunction is genuinely unmet. EXP-ICEX-850e41 is not a
      term in it: no feed, no factor base, no exponent, a different question
      record. Treating the area token as the goal assignment would have blocked a
      contract the hold was never about, which is the inference CLAUDE.md
      instruction 11 forbids in the other direction and which is wrong in both.

