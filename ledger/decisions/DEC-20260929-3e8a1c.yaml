  # ---------------------------------------------------------------------------
  # The rulings.
  # ---------------------------------------------------------------------------
  rulings:
    - id: R1
      question: How do the three routes rank against HEUR-GENERIC-MSUM?
      ruling: >-
        RANK 1 -- DIRECT SUB-GENERIC m-SUM ATTACK ON THE BINARY CURVE VIA FROBENIUS
        ORBIT STRUCTURE. This is the user's route 3, and the framing it arrived in
        undersold it. It is the ONLY one of the three that is on the right field,
        the right object and the right regime, and the heuristic's own committed
        falsification_condition names Frobenius FIRST among the places such an
        algorithm would come from. THAT SENTENCE, READ FROM A COMMITTED RECORD, IS
        THE BASIS OF THIS RANKING AND IS SUFFICIENT FOR IT. A candidate mechanism
        -- a free Frobenius orbit action on the m-SUM solution set over a
        Frobenius-stable factor base -- is recorded separately as FG-1 under
        `forward_guidance`, UNOPENED AND BACKING NOTHING HERE, because no agent in
        this program has opened a source for the characteristic relation it rests
        on and the corpus does not contain one to promote it against. THE RANKING
        DOES NOT DEPEND ON FG-1 BEING RIGHT: if the relation is wrong in form or
        hypotheses, rank 1 is still the only route of the three on the right field,
        the right object and the right regime, and D3's method ceiling is where it
        would properly die. What the heuristic asserts WITHOUT ARGUMENT is that NO
        structure of this curve's group buys a better time-store tradeoff than
        |F|^(m-s) at store |F|^s, and that assertion is attackable cheaply
        whichever structure turns out to be the live one: the first deliverable is
        a literature screen and a derivation, not compute.
        RANK 2 -- EXP-ICEX-850e41. Approved, and ranked second rather than first
        for one reason: it does not test HEUR-GENERIC-MSUM (R2). It is a careful,
        genuinely two-sided, cheap contract on a real and different question, it is
        open ECC work that CLAUDE.md instruction 11(3) says is designed rather than
        shelved, and its dispatch is deferred behind rank 1 rather than cancelled.
        RANK 3 -- THE PRIME-FIELD WAGNER BUCKET PROOF OBLIGATION. Out of scope for
        this session, NOT closed (R4). Ranked last on RELEVANCE, not on difficulty:
        KN-FIND-ffe1df is entirely E(F_p), and HEUR-GENERIC-MSUM is entirely
        E(F_{2^d}). Discharging Lemma 5's equal-pi_c hypothesis over the prime
        field would be a real result and would still not touch the user's premise.
        That is a better reason to defer it than "the proof is hard", and it is the
        reason recorded.
      what_this_ranking_is_worth: >-
        LESS THAN AN INDEPENDENT RANKING, AND I SAY SO RATHER THAN BANKING IT. Two
        committed records -- H-SEMBIN-8e7ae3's validation_plan and
        DEC-20260928-7c3d91's frontier item (3) -- already name rank 1's object. I
        read both during this engagement. My agreement with them is therefore
        confirmatory, not independent, and a reader should weigh it as one reading
        rather than three.

    - id: R2
      question: >-
        Is the low-Hamming-weight promise class the right proxy for the m-SUM
        decomposition HEUR-GENERIC-MSUM is about?
      ruling: >-
        NO. THE MAPPING IS LOOSE, AND IT IS LOOSE IN THE DIRECTION THAT MATTERS.
        The two are relatives -- both are "find a subset of a fixed generating set
        summing to a target" -- and that resemblance is exactly what makes the
        error available to a later reader in good faith. They differ on field, on
        which object is decomposed, and on parameter regime; the three axes are
        independent, and each alone is sufficient to break the inference. The
        detail is in verification_performed. The operative consequence: NEITHER
        branch of EXP-ICEX-850e41 bears on HEUR-GENERIC-MSUM. A controlled null
        (P5/G5) would not support it, because a prime-field exponent-side promise
        in the balanced regime says nothing about a binary-field point-side
        decomposition at fixed m. A BREAK (P4/G4) would not void it either, for the
        same reason in reverse. Made binding by A4.
      what_850e41_does_test_and_it_is_not_nothing: >-
        SAID PLAINLY, BECAUSE "IT IS THE WRONG PROXY" READS AS A DISMISSAL AND IS
        NOT ONE. The contract asks whether a solver seeing ONLY group elements can
        exploit low-weight exponent structure on a real curve, against an integer
        arm where the representation technique is expected to work and against a
        curve-free arm that strips the curve away. That is a sharp, controlled,
        falsifiable question about the free-re-randomisation family, which is
        RQ-ECDLP-002's territory, and the balance law C(W) = T(W) n / |W| makes it
        the ONE ratio that family reduces to. It deserves to run. It deserves not
        to be quoted at HEUR-GENERIC-MSUM.

    - id: R3
      question: >-
        Does GOAL-ICEX-001's hold, or its TASK-20260731-024 archive defect, block
        opening work here?
      ruling: >-
        NEITHER REACHES THIS WORK, AND THE ROUTE AROUND IS A RULING ON SCOPE RATHER
        THAN A WORKAROUND. Three grounds, each read from a committed record.
        (1) THE HOLD IS SCOPED TO THE ICEX EXPONENT MEASUREMENT. EV-ICEX-001 is a
        PASS on "the review-only ICEX exponent protocol design", its hypothesis_id
        is RQ-ICEX-001, its boundaries say "Protocol-design PASS only", and its
        prohibition is on implementing or measuring THAT protocol until charged
        SDEG/MONO/RELN packages exist. EXP-ICEX-850e41 consumes no such feed,
        builds no factor base, computes no index-calculus exponent, and is bound to
        RQ-ECDLP-002. The conjunction the goal head tracks over SDEG, MONO and RELN
        is a precondition for the index-calculus exponent comparison, and this
        contract is not a term in it.
        (2) THE AREA TOKEN IS NOT A GOAL ASSIGNMENT. CLAUDE.md instruction 11 and
        AGENTS.md both forbid inferring ownership or area membership from an
        identifier prefix, and this is the case they exist for: an ICEX-tokened
        experiment whose question is RQ-ECDLP-002 and whose subject is a promise
        class, not an index calculus. GOAL-ICEX-001's objective is "Aggregate
        admissible G4-G6 outputs into one fully charged toy-scale index-calculus
        versus Pollard rho/BSGS exponent comparison"; EXP-ICEX-850e41 contributes
        nothing to it and discharges none of its completion criteria. I therefore
        do NOT route it under that goal, and I do not treat that goal as impeded by
        anything in this decision.
        (3) THE ARCHIVE DEFECT BLOCKS ROUTING, NOT OPENING, AND NOTHING HERE IS
        ROUTED THROUGH IT. TASK-20260731-024's BATCH-001 ledger receipt declares
        record_ids [EV-ICEX-001, DEC-20260731-015, GOAL-ICEX-001] and a
        source_path_sha256 for ledger/decisions/DEC-20260731-015.yaml, while the
        file now standing at that id is a GOAL-ECDLP-001 BATCH-021 record
        containing no occurrence of GOAL-ICEX-001 -- the same-day sequential-id
        collision signature the goal head already records at length. This decision
        carries batch_id null, opens no batch, and touches neither that receipt nor
        that identifier. Same disposition DEC-20260928-7c3d91 gave BATCH-9d649f.
      what_i_am_not_doing_about_it: >-
        NOT REPAIRING IT, NOT REMAPPING ANYTHING, AND NOT TREATING IT AS SETTLED.
        AGENTS.md rule 15 makes an identifier remap a last resort and a completed
        archive receipt already binds that id, so the repair is a superseding
        record authored by whoever owns GOAL-ICEX-001's custody follow-up -- which
        DEC-20260907-582b27 already owes and which this decision does not claim,
        rank, or discharge. It is recorded here only because I was asked whether it
        blocks, and the answer needed the reason.
      the_real_routing_defect_is_a_different_one: >-
        BATCH-a70dc3, which the contract names, DOES NOT EXIST as a coordination
        directory. That is the defect that actually bites, and it bites at dispatch
        rather than at approval. Carried as a dispatch precondition on the deferred
        run, not repaired by editing the contract.

    - id: R4
      question: >-
        Should route 3's remaining proof obligation -- bounding max_c pi_c -- be
        opened as work now, or recorded out of scope with a revisit condition?
      ruling: >-
        OUT OF SCOPE FOR THIS SESSION, EXPLICITLY NOT CLOSED, AND NOT CLOSED BY THE
        EMPIRICAL RESULT. KN-FIND-ffe1df says so in its own words and I adopt them
        rather than paraphrasing: "This does NOT close the hole. Lemma 5 is a PROOF
        gap and no theorem here bounds max_c pi_c; eight toy primes are not a
        bound. It lowers the probability that the gap conceals an attack. j = 2
        remains UNPROVED." RT-EXP-1 spent the empirical arm and spent it well --
        the instrument passed its own sensitivity test, P2 collapsed 20.0122 ->
        1.0030 under the matched-marginal shuffle, the planted theta = p^{-1/9}
        mixture separated where Lambda could not, and popcount and digitsum were
        shown false positives by that same shuffle. What remains is a proof, and a
        proof is not made more or less true by eight primes.
      why_it_is_deferred_and_the_reason_is_relevance: >-
        NOT DIFFICULTY. KN-FIND-ffe1df is a statement about E(F_p); its theorems,
        its Weil input, its coverage table, its counterexamples and RT-EXP-1's
        eight-prime ladder are all prime-field. HEUR-GENERIC-MSUM is a statement
        about E(F_{2^d}). Discharging Lemma 5's equal-pi_c hypothesis over the
        prime field would be a genuine result on RQ-ECDLP-002 and would leave the
        user's premise exactly where it stands. Spending this session's rank-1 slot
        on it would be spending it on a different question.
      revisit_condition: >-
        CONCRETE AND CHECKABLE, EITHER LIMB SUFFICES. (a) Rank 1's design pass
        finds that the binary-curve m-SUM tradeoff question reduces to, or shares a
        load-bearing lemma with, a single-bucket rate bound -- at which point the
        prime-field proof stops being lane-local and becomes a transferable lemma,
        and it is reranked on that. (b) ANY route measures a filter family whose
        max_c pi_c excess FAILS TO DECAY in the field size -- the artifact tell
        RT-EXP-1 looked for and did not find, and the one empirical observation
        that would make the proof gap urgent rather than merely open. Absent both,
        it stays open and unranked, which is its honest status.
      what_this_ruling_does_not_do: >-
        It closes nothing, retires no lane, and moves no status. Families D, I, J,
        the non-x members of A and B, and all levels at or above 2 remain uncovered
        exactly as KN-FIND-ffe1df records them. Declining to rank a lane this
        session is not a finding about the lane, and under docs/inventor-protocol.md
        premature closure is a failure mode symmetric with overclaiming.

    - id: R5
      question: Approve EXP-ICEX-850e41, or name what it still needs?
      ruling: >-
        APPROVED, WITH FOUR BINDING PRE-APPROVAL AMENDMENTS. The contract is
        unusually thorough and the thoroughness is real rather than decorative: ten
        controls of which six are blocking, a leak check and scalar withholding
        that are both blocking and both aimed at the dominant risk, an explicitly
        computed demonstration that its own source's pre-registered band was
        degenerate, decision lines computed from a MEASURED quantity rather than a
        recalled one, a pre-stated consequence for the curve-free null, tail checks
        that include the 90th percentile as well as the median, and a
        success_criterion that is satisfied by neither branch outcome. Its
        interpretation_limits already carry the two things most contracts omit --
        that at w = 12 the class is about 16 percent of n so the n/|W| factor
        biases absolute R downward toward a FALSE BREAK, and that SOLVER-R's larger
        lists mean an operation-only cost model flatters it.
        FOUR DEFECTS REMAIN AND ALL FOUR ARE REPAIRABLE ADDITIVELY, AT ZERO
        COMPUTE, BEFORE ANY IMPLEMENTATION EXISTS: an unattributable arm/filter
        confound (A1), a positive control that degrades gracelessly (A2), a
        convention-cancellation claim that is false as stated and unmeasured (A3),
        and an unstated relevance boundary that a later reader would cross in good
        faith (A4).
      why_approve_rather_than_revise: >-
        Because `revise` would produce the same text a round later with no more
        information, and because the standing user authorization of 2026-09-06
        makes protocol completeness this Coordinator's responsibility rather than a
        reason to bounce a contract. All four amendments are ADDITIVE, none edits
        an authored field, none changes the cost model, a parameter, the
        success criterion or the budget, and all were written before any
        implementation existed. `approve` plus a published diff is the reading a
        later auditor can check; a bounce is not.
      what_the_approval_does_not_do: >-
        IT DOES NOT DISPATCH. Approving a contract and dispatching an Executor
        against it are separate acts, and CLAUDE.md instruction 11(3) draws exactly
        that line ("Designing is not approving"). This contract's run is DEFERRED
        behind rank 1, and additionally blocked on the BATCH-a70dc3 routing defect.

  # ---------------------------------------------------------------------------
  # Binding pre-approval amendments to EXP-ICEX-850e41. ADDITIVE ONLY.
  # Written into the contract head by TASK-20260929-7b42d9 as an `amendments`
  # block. No authored field is edited.
  # ---------------------------------------------------------------------------
  amendments:
    - id: A1
      title: THE CURVE-FREE ARM'S FILTER IS DECLARED, AND THE FILTER AXIS IS CROSSED WITH THE ARM AXIS
      defect: >-
        The contract declares a filter for the elliptic arm and a filter for the
        integer arm and NEVER DECLARES ONE FOR THE CURVE-FREE ARM. On (Z/n, +) the
        group element is an integer mod n, so "the identical solvers" most
        naturally gives it an integer-bucket filter -- approximately sum-compatible
        up to carry, which is the INTEGER arm's structure and precisely what the
        x-coordinate bucket lacks. The elliptic and curve-free arms then differ in
        group law AND filter simultaneously, and G7/P7's pre-stated consequence
        becomes unattributable between the two.
      requirement: >-
        (i) The curve-free arm's filter is DECLARED IN THE FROZEN MANIFEST BEFORE
        STAGE 1, by name and image size, alongside the other two. (ii) NULL-2 (C5,
        the keyed random function of the same image size) is run on ALL THREE ARMS,
        not the group arm alone; STAGE 4 is read accordingly. (iii) The paired
        elliptic-minus-curve-free rho difference is reported SEPARATELY under the
        declared filter and under the keyed-random filter. (iv) G7/P7 may be
        recorded as fired ONLY on the keyed-random-filter comparison, where the
        filter is matched across arms by construction and the group law is the only
        remaining difference. Under the declared filters the paired difference is
        reported as a DIAGNOSTIC and may not by itself support or refute G7.
      cost: >-
        Free in design and small in compute: NULL-2 already exists as a code path
        and this runs it on two further arms over the same instances. No new
        solver, no new cell, no change to the grid or the budget.
      coordinator_prior_on_this_amendment: >-
        RECORDED BEFORE THE RUN. I expect the curve-free arm to track the INTEGER
        arm rather than the elliptic arm under the declared filters, and G7 not to
        fire. If that happens without this amendment, the contract records "the
        curve contributes something" when what it has measured is "the
        x-coordinate bucket is a worse filter than an integer bucket". With the
        amendment the two readings separate.
    - id: A2
      title: C3 GAINS A DECLARED DYNAMIC-RANGE FLOOR, DECLARED NOW AND NOT FITTED LATER
      defect: >-
        C3's pass test is the bare inequality rho_int < 1. The decision lines are
        0.75 and 0.25 times |log2 rho_int|, so the gap between them is
        0.5 * |log2 rho_int| and shrinks to zero as rho_int approaches 1 from
        below. At rho_int = 0.95 the bands are 0.055 and 0.018 -- narrower than any
        realistic bootstrap interval -- and the verdict is decided by noise while
        C3 and every other blocking gate report PASS.
      requirement: >-
        C3 passes only if BOTH hold. (i) ABSOLUTE FLOOR: |log2 rho_int| >= 1.0 at
        every l, i.e. the integer arm demonstrates at least a factor-2 separation
        between the two solvers. (ii) RESOLUTION FLOOR: the band gap
        0.5 * |log2 rho_int| is at least twice the half-width of the 95 percent
        bootstrap interval on Delta at that l. If either misses, the disposition is
        the one the contract already declares for rho_int >= 1 -- the instrument
        has no demonstrated dynamic range, no group-arm negative is admissible, and
        every cell is reported UNTESTED rather than closed. P2 and G2 are read to
        include both limbs.
      why_1_point_0_and_why_it_is_not_fitted: >-
        STATED BECAUSE A THRESHOLD CHOSEN AFTER SEEING DATA HAS STOPPED BEING A
        CHECK, AND NOTHING HAS BEEN SEEN. No implementation exists, no run exists,
        no value of rho_int has been observed by anyone. 1.0 is the smallest
        separation at which the instrument has demonstrated that SOLVER-R and
        SOLVER-I are different algorithms at all, which is exactly what C3 is for.
        The contract's own recalled expectation is |log2 rho_int| about 5.04 at
        l = 24, so a working representation solver clears this floor by a factor of
        five and the floor never binds; it binds only on a solver that barely
        works, which is the case C3 currently passes and should not.
    - id: A3
      title: >-
        THE CONVENTION-CANCELLATION CLAIM IS CORRECTED, AND CONVENTION SENSITIVITY
        IS MEASURED RATHER THAN ASSUMED
      defect: >-
        Objective (C) and the assumptions state that "the counting convention
        cancels because it appears identically above and below". FALSE AS A GENERAL
        CLAIM. The conventions of statement (D) differ in what is charged, and
        charging list construction penalises SOLVER-R more than SOLVER-I because
        SOLVER-R's lists are larger and overlapping by design. rho is therefore not
        convention-invariant. What is actually protective is (a) C8 pinning the
        convention to a specific pre-computed checkable point and (b) Delta
        cancelling any convention effect that acts IDENTICALLY on both arms -- and
        (b) is exactly what A1 shows cannot be assumed, since the arms carry
        different filters and so plausibly different list structures.
      requirement: >-
        (i) The claim is restated in the contract head as: the frozen counter fixes
        ONE declared convention, C8 makes that convention checkable, and Delta
        cancels convention effects TO THE EXTENT THAT THEY ACT IDENTICALLY ON BOTH
        ARMS. The unqualified "the convention cancels" is withdrawn. (ii) The run
        re-accounts the SAME instances under ONE declared alternative convention --
        Convention 1 of statement (D), charging one balanced list only -- and
        reports rho and Delta under both. (iii) If |Delta_conv1 - Delta_conv3|
        exceeds 0.25 * |log2 rho_int| at any l, the verdict at that l is recorded
        as CONVENTION-SENSITIVE and may not be reported as CASCADE or BREAK.
      cost: >-
        A second accounting of the same runs, not a second run. The counters are
        recorded per instance already; this is a re-tally at analysis time.
    - id: A4
      title: RELEVANCE BOUNDARY -- NO OUTCOME OF THIS CONTRACT BEARS ON HEUR-GENERIC-MSUM
      defect: >-
        Not a defect in the contract, which never claims otherwise, but an
        omission that a later reader crosses in good faith. The contract shares
        vocabulary with the binary-curve decomposition-oracle family -- subset
        sums, a fixed basis, meet-in-the-middle, representation techniques,
        time-store tradeoffs -- and sits one merge away from a result whose single
        load-bearing assumption is HEUR-GENERIC-MSUM.
      requirement: >-
        The contract head and every derived evidence record carry, in terms: NO
        OUTCOME OF THIS EXPERIMENT SUPPORTS, REFUTES, VALIDATES OR BEARS ON
        HEUR-GENERIC-MSUM, on three independent grounds -- field (prime E(F_p)
        against binary E(F_{2^d}) with a Frobenius-stable F_2-subspace base, so
        Frobenius, the first item on that heuristic's own list of where a
        sub-generic algorithm would come from, is absent here); object (the promise
        is on the EXPONENT against a decomposition of the POINT); and regime
        (w up to l/2, the balanced-knapsack regime, against fixed small m with |F|
        large, the k-SUM regime). A controlled null here is not evidence for that
        heuristic and a BREAK here is not evidence against it.
      why_this_is_binding_rather_than_advisory: >-
        Because the inference is available, cheap, and wrong, and because the same
        shape of error is what CORR-20260916-402547 corrects on a sibling campaign
        and what DEC-20260928-7c3d91 ruled on in advance for criterion 4 of
        GOAL-SEMBIN-5078bc. Ruling on it before the run costs a paragraph; ruling
        on it after a quotable number exists costs a correction.

