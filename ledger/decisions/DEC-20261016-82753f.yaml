  context: >-
    Phase 3 of the validation round the user asked for in this session ("run
    independent validation on the seed provenance finding"). Phase 1 froze the
    review plan in commit dbd1b8d15845579aaaa3af47b827955e2b625e77
    (DEC-20261016-7bcdd6, TASK-20261016-9bf74b, TASK-20261016-670480). In phase
