  validity_check_before_interpretation:
    expected_outputs: >-
      The card's deliverables are validation_report.yaml (id
      VAL-20261016-cd9156, task_id TASK-20261016-9bf74b), validation.md and
      logs/order.log. All three are present. artifact_paths lists 98 files
      with SHA-256, every file under validation-20261016/ except the report
      itself, and that matches the directory listing (99 files).
    schema: >-
      Every check is a separate entry with status, claim, joint, evidence path
      and compared values. A review_attestation is present, with a verdicts
      mapping per joint, sources_read, a separate opaque_operations list,
      read_sibling_reports false, and blind_from_respected false with its
      reason.
    seed_integrity: >-
      The nonce re-derives from the freeze-commit SHA. The 204 sampled rows
      are listed per run with zero and nonzero counts, so the sample is
      reproducible from the freeze commit.
    raw_summary_agreement: >-
      The figures checked here (see context) agree with the report.
    control_comparability: >-
      All five proves-too-much objects ran on the same objects and parameters
      as the main checks, and all failed as required.
  rulings:
    - ruling: independence_deviation
      statement: >-
        Not material. Independence from the producer holds for this round.
        The harness injected /home/user/crypto/CLAUDE.md into the Validator's
        context at session start. That path falls under the blind_from entry
        /home/user/crypto/, so the attestation honestly reports
        blind_from_respected false, and tools/check_review_independence.py
        reports exactly that one problem. Grounds: (a) blind_from exists to
        keep the producer's implementation and notes out of the re-derivation
        (templates/research-records.md, "Blind re-derivation is not
        replication"). The whole-repository entry was put there for the Rust
        receipt (TASK-20261016-9bf74b procedure_deviations[2];
        DEC-20261016-7bcdd6 limitations (b)). CLAUDE.md is neither a producer
        artifact nor a note about the bundle. (b) No tool call by the
        Validator opened it. (c) This Coordinator session received the same
        file through the same harness injection, and attests that it holds
        generic workflow policy only: ready-for-review PRs, the success
        criterion, research-visuals and benchmarks, Conductor, PR check-in
        cadence and GAE pricing. It contains nothing about drand48, lrand48,
        X9.62, the census, the classifier, the orders or the seeds. (d) No
        other blind_from path was read. Only the listed opaque operations
        touched them (hashes, ls-tree, log lines). This is a factual ruling on
        what was read and whether it carries producer content. It is not a
        protocol amendment. The condition in pre-committed reading (1) keeps
        its purpose and its wording. A reader who rejects this ruling should
        read C1a-C4 as "replicated or strong, with one recorded independence
        deviation", not as weaker evidence. Nothing else depends on it.
    - ruling: c1_not_run_cap
      statement: >-
        Pre-committed reading (4) applies, scoped to the sub-claim the not_run
        check bears on. VAL J6-4 (README path references absent here) is
        not_run by plan design, because /home/user/crypto/ was blind for the
        round. What it leaves unverified is C1b: the README's description of
        what the native Rust tests check, and the byte-for-byte census.sh
        re-run. C1b is capped at preliminary. C1a, the generator facts those
        tests describe, was re-derived independently from public
        specifications, with every control failing as required. So the cap
        does not reach C1a, which is replicated. Splitting C1 here identifies
        which claim the not_run check affects, as reading (4) requires. It
        changes no criterion.
    - ruling: c3_twist_sentence
      statement: >-
        The README sentence "In the four p = 3 mod 4 runs, 31 seeds were lost
        this way" is a derived-interpretation error, not a measurement error.
        It miscounts the runs (five, not four), and it overstates the loss,
        because five of the 31 twist orders fail the bundle's own bitlen
        rule, leaving 26. The data it summarises are correct, and J4 holds.
        The sentence is excluded from C3's strength and corrected by
        CORR-20261016-10d498 without editing the README or
        DEC-20261016-264eed. It does not lower the rest of C3: pre-committed
        reading (1) admits wording concerns, and reading (2)'s strong
        condition, the row-by-row re-census, is met. This Coordinator's prior
        expected the "four" miscount. It did not expect 26 versus 31.
    - ruling: c2_strength
      statement: >-
        Strong. Reading (2) required state recovery and walk-back for all ten
        prime seeds, and the Validator did all ten, by lattice CVP from the
        seed alone. The README's "at most one block-aligned state within
        8,000 blocks" holds deterministically up to 16,384 blocks. The 10^-11
        figure leaves out the roughly 0.12 chance per seed that an aligned
        state exists at all, which makes chance less likely, not more. Not a
        defect.
    - ruling: j7
      statement: >-
        J7 is inconclusive, as this Coordinator's prior expected. The
        labelling holds: no sentence presents a C5 result as a repository
        measurement or as validated. The preregistration's timing is
        unverifiable. PREREGISTRATION.md was first committed in the same
        commit as the census data, in aburan28/crypto (bc6b8f29) and here
        (64a46b4c). Its "~19:27 UTC" time is self-asserted, and no third-party
        timestamp exists. The file also says that the published n had been
        inspected, and its amendment came after the P-192 run reproduced. So
        the README's "frozen before any curve order was seen" and "frozen
        before the census was read" say more than any record supports. No
        record shows it was written after the census orders were inspected
        either, so the breaking artifact is absent. Under reading (5), C1-C4
        are not lowered. From this decision on, records that call the
        skip-filter screen "preregistered" are to be read as "a self-dated
        protocol, first committed together with the census data, with a
        post hoc amendment": DEC-20261016-fb3a6f synthesis_statement and its
        problem_history ruling, KN-LIT-d2f917, CORR-20261016-0bf0b2, and the
        problem record. A dedicated correction record follows (next_actions).
    - ruling: review_independence_check
      statement: >-
        tools/check_review_independence.py, run by the Validator, reports one
        problem: "re-deriver TASK-20261016-9bf74b read 1 blind_from path(s) --
        /home/user/crypto/". Joint ownership, per-joint verdicts, sibling reads
        and the proves-too-much declaration pass. The one problem is the
        injection decided above. The TASK-20261016-670480 receipt must record
        the check's full output, re-run before its commit. If that run reports
        anything else, this decision does not become official and returns to
        the Coordinator.
    - ruling: brief_versus_contracts
      statement: >-
        Four points where the dispatching brief and the repository contracts
        differ. The contracts win. (1) One combined archival commit was
        asked for. TASK-20261016-670480 is snapshot-only and forbids staging
        ledger or knowledge records, and agents/coordinator.md runs the
        snapshot alone, then the ledger archive alone. So there are two
        commits, the second under TASK-20261016-a28b0d (id allocated by the
        top-level session). (2) The Coordinator brief says to commit the
        regenerated knowledge/INDEX.md. AGENTS.md ("Concurrency") makes it a
        gitignored generated artifact, so it is regenerated and checked, not
        committed. (3) The review-evidence skill puts the decision report in
        experiments/<EXP-ID>/reports/. No EXP exists, so it goes in
        research/nist_seed_provenance_20261016/review-DEC-20261016-82753f/, as
        the brief names. (4) No status note is appended to
        TASK-20261016-670480. The handoff template has no status field, the
        record is immutable, and its own input_bindings require it to stay
        byte-identical to the freeze commit. Its outcome goes in its
        receipt.yaml.
  procedure_deviations:
    - >-
      Harness-injected /home/user/crypto/CLAUDE.md in the Validator's context
      (ruling independence_deviation).
    - >-
      This evidence review was written while the Validator's outputs were
      still untracked, before the TASK-20261016-670480 snapshot. That inverts
      the order the card states ("archived ... before the Coordinator
      interprets them"). Mitigation: the decision cites only paths whose
      SHA-256 values are listed in validation_report.yaml artifact_paths, and
      it is official only after the snapshot commit and this ledger commit
      are verified. If the snapshot receipt shows any staged file whose hash
      differs from artifact_paths, this decision is void and returns to the
      Coordinator.
    - >-
      The Validator records that during its session the driving session made
      a WIP checkpoint commit (3d1b3b7e, 22:37:23Z) that captured
      validation-20261016/, then reset the branch to the freeze commit and
      force-pushed. The bundle and the freeze records were not modified. The
      TASK-20261016-670480 receipt must confirm that dbd1b8d1 is an ancestor
      of the snapshot commit and that the three freeze records are
      byte-identical. No archive bound 3d1b3b7e, so no archive receipt is
      orphaned.
    - >-
      Single reviewer, no red-team pass (planned; DEC-20261016-7bcdd6
      limitations). J7 is inconclusive on timing only, and that bears on C5,
      which carries no strength. So no review_plan_addendum is opened.
  rationale:
    - >-
      Pre-committed strength reading of DEC-20261016-7bcdd6, applied as
      written. (1) Every joint bearing on C1-C4 holds, every proves-too-much
      object fails as required, and the one concern is wording, so C1-C4 are
      replicated, subject to the independence ruling. (2) The full row-by-row
      re-census makes C3 strong, and ten-of-ten state recovery makes C2
      strong. (4) The not_run cap reaches C1b only. (5) C5 gets no strength,
      and J7 lowers nothing. (6) Promotion follows because the decision is
      support at replicated or stronger, and the finding's text is limited to
      the claims that reached that strength.
    - >-
      The evidence is an independent implementation from retrieved standards
      (POSIX drand48, FIPS 186-2, SP 800-186, SEC 1, OpenSSL parameters) that
      never read classify.gp, sea_census.gp, the skipped-curves study or
      aburan28/crypto. Its agreement is evidence about the quantities, not
      a faithful reproduction of a shared error. The one shared component,
      PARI/GP SEA, is bounded by N*P = O certificates on every prime order the
      classification uses.
    - >-
      Not a first observation: two external primary sources (KN-LIT-d2f917),
      the producer's reproduction, and now an independent validation agree.
      "support" rather than "replicate" is therefore proportionate (skill rule:
      surprising or high-impact results get replicate on first observation).
    - >-
      Proportionality: this is provenance on historical curves. No ECDLP cost,
      no attack claim, and no curve-safety or SafeCurves cell depends on it, so
      rule 12 (review-breakthrough) and the asymptotic promotion gates do not
      apply. No quantitative speedup claim is made, so no claims/*.json is
      required.
  evidence_refs:
    - ledger/evidence/EV-SCURVE-e9d71b.yaml
    - research/nist_seed_provenance_20261016/validation-20261016/validation_report.yaml
    - research/nist_seed_provenance_20261016/validation-20261016/validation.md
    - research/nist_seed_provenance_20261016/validation-20261016/logs/order.log
    - research/nist_seed_provenance_20261016/validation-20261016/logs/q7_state_recovery.log
    - research/nist_seed_provenance_20261016/validation-20261016/out/recensus_compare.json
    - research/nist_seed_provenance_20261016/validation-20261016/out/j4_lost_criteria.json
    - research/nist_seed_provenance_20261016/README.md
    - research/nist_seed_provenance_20261016/SOURCE.md
    - ledger/decisions/DEC-20261016-7bcdd6.yaml
    - ledger/handoffs/TASK-20261016-9bf74b.yaml
    - ledger/corrections/CORR-20261016-10d498.yaml
  limitations:
    - >-
      PARI/GP SEA is common to producer and Validator, so the composite (0)
      rows are empirical_only. A wrong abort on a prime-order curve would have
      to occur in both runs.
    - >-
      prime192v2/v3 and prime239v1-v3 parameters come only from OpenSSL 3.0.13,
      because ANSI X9.62 itself was not retrieved. The NIST curves agree across
      three sources.
    - >-
      Constraint 4 ordering is attested, not enforced. The independence ruling
      is a judgement made after results were seen. It is recorded openly and
      its grounds are given.
    - >-
      Lesson for later review plans, not a rule change: list the producer's
      artifact paths in blind_from rather than a whole sibling repository root.
      The harness injects that root's CLAUDE.md into every session.
    - >-
      This Coordinator subagent has no shell. It checked that the five record
      ids were free (no file at the paths), and the top-level session
      allocated and --checked TASK-20261016-a28b0d. Both commits, the
      rendering, the validators, the push and the PR are the top-level
      session's.
  knowledge_promotion:
    promoted:
      - KN-FIND-cee88d
    not_warranted: null
    scope_note: >-
      KN-FIND-cee88d states C1a, C2, C3 as scoped and corrected, and C4,
      at their EV strengths. It excludes C1b, C5, the base points, B-163, the
      freedom figure, the security table and any ECDLP statement. It carries
      the EV's proof_status and proof_refs. No KN-OPEN is created: the open
      skip rule is already problems/nist-seed-selection-rule-unexplained.md.
  visual_record:
    report: research/nist_seed_provenance_20261016/review-DEC-20261016-82753f/report.md
    rendered_by: >-
      The top-level session, under TASK-20261016-a28b0d (graphs and report.pdf
      beside report.md). The harness refused this subagent's write of
      report.md, so the Coordinator sent the report text by in-session message
      to the top-level session, which writes it verbatim and records its
      SHA-256 in the TASK-20261016-a28b0d receipt.
    canonical_graphs_checked: >-
      knowledge/frontiers/ has no seed-provenance or rigidity graph (searched
      for srand48, nist_seed and seed provenance, none found).
      research/nist_seed_provenance_20261016/streams.svg is drawn from
      census/summary.json, whose lists this review reproduced exactly, so it
      is unchanged. No ECDLP cost row changes.
  next_actions:
    - >-
      Top-level session, now: run TASK-20261016-670480 alone (snapshot of the
      Validator's artifacts, git add -f for the artifact_paths files under
      validation-20261016/ plus its receipt), verify it, push, refresh the PR.
      Then run TASK-20261016-a28b0d alone (this ledger archive, with the
      rendered graphs and PDF), verify it, push, refresh the PR.
    - >-
      Next Coordinator pass on the provenance lane, after both commits are
      verified: one task under fresh ids for (a) a correction record for the
      preregistration-timing wording (ruling j7), and (b) a dated addendum to
      KN-LIT-d2f917 pointing its "Internal reproduction (pointer, not a
      promoted finding)" section to KN-FIND-cee88d and EV-SCURVE-e9d71b. The
      literature entry's confidence stays reported.
    - >-
      Goal next_actions are unchanged for GOAL-SCURVE-be9707,
      GOAL-SCURVE-cef9f7 and GOAL-SCURVE-137bd9. No batch is opened, no goal
      checkpoint is written, and the problem record stays open (its exit
