coordinator_decision:
  id: DEC-20260803-c7a1a3
  goal_id: GOAL-MLKEM-003
  batch_id: BATCH-010
  recorded_by_task: TASK-20260803-341aad
  authorized_by: DEC-20260802-56cc4b
  recorded_at: '2026-08-03'

  decision: revise
  decision_label: >-
    refine_the_finding_and_reject_its_framing;
    no_status_change_anywhere;
    extend_campaign_budget_10_to_12_on_user_instruction_and_keep_goal_active
  decision_vocabulary_note: >-
    The disposition on the merits is REFINE: the finding is real, its framing was
    wrong, and a confirmed arithmetic error plus a vacuous control preclude
    anything stronger. `refine` is not a value in the
    templates/research-records.md enum, whose nearest term is `revise` - defined
    by this campaign's own precedent (DEC-20260802-937ba9) as "a batch whose
    artifacts stand and whose interpretation is re-recorded on top of them",
    which is exactly this case. `revise` is therefore the recorded value and
    `refine` is its intent, stated here so no reader has to guess. `support` was
    considered and REFUSED - see `why_not_support`.

  # ------------------------------------------------------------------
  # CONTEXT
  # ------------------------------------------------------------------
  context: >-
    DEC-20260802-56cc4b resumed GOAL-MLKEM-003 from the DEC-20260802-937ba9 pause
    on a user-directed budget extension (maximum_batches 8 -> 10) and on an
    explicit decision to proceed without the unserved rule-12 review. BATCH-009
    ran F1's producer half and then terminated: its validator session died on a
    provider session limit before writing a verdict, so its ledger archive stayed
    blocked and EV-MLKEM-019 was never written (infrastructure signal, never a
    mathematical result - AGENTS.md rule 5). BATCH-010, the last batch under the
    extension, asked a different and older question, the one this goal's
    completion criterion actually names: EV-MLKEM-015 found primal_bdd under
    RC.MATZOV BELOW the NIST classical cutoffs on all three FIPS 203 sets, by
    2.80 / 6.04 / 1.28 bits, under a cost model that charges nothing for memory.
    Does that undercut survive memory charging, and in whichever direction it
    falls, by how much? The headline instrument was the critical memory-charge
    exponent c*: the smallest c such that charging M^c erases the undercut.

  # ------------------------------------------------------------------
  # WHAT WAS ESTABLISHED, AND IN WHICH DIRECTION
  # ------------------------------------------------------------------
  what_was_established:
    direction: >-
      UPWARD, and the direction was fixed by algebra before the run: T*M^c >= T
      for M >= 1 and c >= 0, so memory charging can only raise an estimate. Only
      the MAGNITUDE was in question. This is stated plainly so a determined
      direction is not mistaken for a confirmed one (red team OBJ-11), and it is
      explicitly NOT a rule-9 concern: KN-OPEN-017 posed the question on
      2026-07-24, before this batch; the BATCH-010 objective pre-registered
      "report the margin in whichever direction it falls"; and a program that
      reported only margin-reducing findings while suppressing the
      margin-restoring one would be committing the failure rule 9 names.
    the_finding: >-
      A ROBUSTNESS STATEMENT, NOT A MAGNITUDE. For primal_bdd under RC.MATZOV at
      the free-memory operating point, the charge that erases EV-MLKEM-015's
      undercut is c* = 0.03164649 / 0.04588645 / 0.00705473 (Model A, Z_q units)
      - one to two orders of magnitude below every named hardware convention -
      and the INEQUALITY c* < 1/3 is invariant to the sieve-memory exponent
      across [0.05, 0.40], to all three memory units, to both charge models, to
      the BKZ-vs-SVP sieve-dimension choice, to within-RC.MATZOV memory-aware
      re-optimisation, and to the polynomial-memory enumeration falsifier the red
      team named and I ran. The invariance is the finding. The VALUE is an
      identity in two numbers that pre-date the batch.
    the_framing_that_was_wrong: >-
      c* = margin / log2(M). Kyber sits within a few bits of a category boundary
      and any cryptographic-dimension sieve has log2 M = O(100), so c* = O(1e-2)
      is forced before any instrument runs. "10.5x below 1/3" IS "the margin is
      10.5x smaller than 29.498 bits", and the ratio moves INVERSELY with the
      undercut - Kyber-1024's 47.2x is large precisely because its undercut is
      the smallest. Eight significant figures contradict the package's own H11,
      under which a one-bit cutoff error moves Kyber-1024's c* by 78% of its
      value. Two significant figures is the ceiling this quantity supports.
    what_i_ran_myself: >-
      The cheapest falsification either review could name, after both reviews
      were complete: all 18 combinations of {RC.CheNgu12, RC.ABFKSW20, RC.ABLR21}
      x {primal_bdd, primal_usvp} x three parameter sets, in the same pinned
      harness. Zero below-cutoff cases; the smallest excess is +76.04 bits
      (RC.ABLR21 primal_usvp, Kyber-512: 219.04 vs 143). Since T*M^c >= T, that
      route is closed at every c, not only at c = 0. Full figures in
      EV-MLKEM-020.coordinator_independent_falsification, labelled
      `unable_to_check` because a non-RC.MATZOV reduction cost model is outside
      the harness's known-answer control.
    what_does_not_survive_scrutiny: >-
      Four items, enumerated in EV-MLKEM-020.what_does_not_survive_scrutiny:
      (1) c* as a headline number is an identity, not a discovery (OBJ-1);
      (2) the memory model is BORROWED - `grep -n "mem" estimator/lwe_primal.py`
      returns nothing, lwe_primal never calls short_vectors, and the 0.2075
      literals cited live in a function primal_bdd does not invoke, annotated
      "# pick something" by the estimator's own authors, while the unit
      convention comes from lwe_dual.py, a different module (H4/H5);
      (3) CTRL-5 is vacuous - it asserts x * 1^c == x - so the inventor-protocol
      controls-before-belief obligation is FORMALLY UNMET (OBJ-3, D3);
      (4) a real arithmetic bug at memory_charged_derivation.py:151 adds log2_q
      instead of log2(log2 q), overstating one memory unit by 8.152329 bits on
      all three sets and feeding a c* row IN THE DIRECTION OF THE CONCLUSION
      (OBJ-6).

  # ------------------------------------------------------------------
  # COORDINATOR VALIDITY CHECK BEFORE INTERPRETATION
  # ------------------------------------------------------------------
  coordinator_validity_check:
    performed_before_interpretation: true
    expected_run_count: >-
      Met. Producer: 1 of 1 allowed, 19.5 s of a 3000 s allowance. Validator: 1
      of 1, ~1180 s of 2400. Red team: 1 of 1, 25.9 s of 2400. No budget
      exceeded, and no result is reported from an exhausted budget.
    manifest_and_seed_integrity: >-
      Met. The producer's receipt records command chain, repo_commit
      072629728d35 (the snapshot parent, so the run predates its own snapshot),
      a named and in-scope dirty path, python 3.11.15, mpmath 1.3.0, scipy
      1.17.1, ulimit, and an empty seed list with the reason recorded - correct,
      since the derivation is deterministic with no Monte Carlo step. The
      operational test of that claim is that two independent sessions reproduced
      it bit-for-bit.
    raw_summary_agreement: >-
      Checked and one disagreement found and recorded: derivation_report section
      4 claims "a 1001-point sweep over c in [0,1] is in results.json" while the
      stored sweep has 19 points (validator D6, C12). No number is affected;
      section 9 of the same report is correct. A second, more serious raw/summary
      divergence is OBJ-6, which IS a wrong number in the raw file.
    control_comparability: >-
      The known-answer control was run by all three of producer, validator and
      red team on their own clones, exit 0, delta 0.00e+00 against the
      Sage-computed RUN-MLKEM-015-001. Four of the package's eight controls are
      algebraic identities that cannot fail; the substantive four (CTRL-0,
      CTRL-1, CTRL-2, CTRL-3) are genuinely strong.
    verdict: >-
      Admissible as evidence of what it is: an independently reproduced,
      honestly scoped cost-model derivation with four recorded defects. It is not
      admissible as validation of any heuristic, as an ML-KEM claim, or as a
      rule-12 adjudication of anything.

  # ------------------------------------------------------------------
  # WHY NOT `support`
  # ------------------------------------------------------------------
  why_not_support: >-
    Three independent grounds, any one sufficient. (1) THE FRAMING FAILED
    REVIEW. Both independent sessions found the same defect: the package leads
    with a number that is an identity and buries the invariance that is the
    actual content. A `support` disposition would ratify the framing rather than
    the finding. (2) A REAL BUG AND A VACUOUS CONTROL. results.json carries an
    8.152329-bit arithmetic error that feeds a c* row in the direction of the
    conclusion, and the declared null object cannot fail, so the
    controls-before-belief obligation is formally unmet. A durable artifact with
    a confirmed wrong number in it does not `support` anything. (3) THERE IS NO
    HYPOTHESIS HERE TO SUPPORT. EV-MLKEM-020's direction with respect to
    H-MLKEM-014 is `neutral`: H-MLKEM-014's conjunct (3) is a c = 0 statement
    that this c > 0 computation reproduces at delta 0.0 and cannot contradict.
    `support` would also have triggered the mandatory knowledge-promotion path
    on `replicated` evidence, which would enshrine the rejected framing in the
    corpus - the opposite of what the reviews establish.

  why_not_weaken_or_reject_scoped: >-
    Nothing here is adverse to a theory. The batch does not weaken EV-MLKEM-015,
    H-MLKEM-014, or any other record: it computes a different quantity in a
    different convention. `reject_scoped` is additionally forbidden by the
    Coordinator contract on a single unreplicated empirical-only run, and this is
    neither adverse nor empirical. The only things weakened are two of the
    package's OWN sourcing labels (H4/H5's "sourced three ways" and H7's
    "SOURCED" on c = 1/3), which are downgraded on the record in EV-MLKEM-020
    rather than by any status transition.

  # ------------------------------------------------------------------
  # THE COORDINATOR OVERCLAIM, CORRECTED ON THE RECORD
  # ------------------------------------------------------------------
  coordinator_overclaim_correction:
    raised_by: red team RT-20260803-e5a272, OBJ-2 (major)
    what_i_wrote: >-
      The commit message of snapshot 7afc38466bb697ac309a89a49e92f396393a5e73,
      made by me under TASK-20260803-cf95ec, says: "The EV-MLKEM-015 undercut of
      the NIST cutoffs survives only under literally free memory."
    what_the_artifacts_support: >-
      The producer's own report says "does not survive any of the memory charges
      EXAMINED HERE". My sentence is stronger in two ways and both are wrong.
      (i) The undercut survives on the INTERVAL 0 <= c < c*, of positive width -
      c* = 0.03164649 / 0.04588645 / 0.00705473 in the headline unit - not at the
      single point c = 0. "Literally free memory" collapses an interval to a
      point. (ii) It reads as a verdict ON EV-MLKEM-015, when by the batch's own
      H6 EV-MLKEM-015's undercut is a c = 0 statement that a c > 0 computation
      cannot contradict.
    corrected_statement: >-
      For primal_bdd under RC.MATZOV at the free-memory operating point, the
      EV-MLKEM-015 undercut survives every memory charge M^c with c below
      c* = 0.03164649 / 0.04588645 / 0.00705473 (Model A, Z_q elements) and is
      erased by every charge above it. Nothing in BATCH-010 contradicts,
      corrects, or qualifies EV-MLKEM-015.
    why_it_is_corrected_here_and_not_there: >-
      Commit messages are immutable and are read by every future agent running
      `git log` on this path. AGENTS.md rule 4: corrections create new records,
      they never overwrite. This decision is that record. Every downstream record
      must use the qualified wording; no record may quote the commit message.
    accountability: >-
      Mine. The overclaim was written by the Coordinator, not by the producer,
      and the producer's own text was more careful than mine. Recorded so the
      audit trail shows where the inflation entered.

  # ------------------------------------------------------------------
  # EXPLICIT NON-CLAIMS
  # ------------------------------------------------------------------
  explicit_non_claims:
    - >-
      NO ML-KEM BREAK. Nothing in BATCH-010 is a cryptanalytic result. No solve,
      no relation, no certificate; the batch RAISES an estimated attack cost.
    - >-
      A RAISED ESTIMATE IS NOT A SECURITY PROOF. This is the direction that
      invites the subtler overclaim and it is refused explicitly: the result is a
      statement about ONE cost model, at ONE parameter set, for ONE attack, under
      twelve numbered heuristics of which H3, H6, H8, H9, H10 and H11 are
      unvalidated and H11 is unverifiable in this environment.
    - >-
      NO FIPS 203 PARAMETER SET IS AFFECTED OR CLEARED. Kyber-512, Kyber-768 and
      Kyber-1024 stand exactly where they stood before this batch. No security
      level is asserted or revised; COST-MLKEM-001's conditional envelope is
      untouched.
    - >-
      EV-MLKEM-015 IS NOT CONTRADICTED, CORRECTED, OR QUALIFIED. Its undercut is
      a c = 0 statement; BATCH-010 reproduces it at delta 0.00e+00 and computes
      in a different convention.
    - >-
      NO STATUS CHANGES ANYWHERE. H-MLKEM-014 stays `analyzed`. EV-MLKEM-011,
      EV-MLKEM-013 and EV-MLKEM-017 keep their status. KN-FIND-012 and
      KN-FIND-014 are untouched and the restatement/withdrawal recorded as
      PENDING in DEC-20260802-937ba9 remain owed, not cancelled. AGENTS.md rule
      12 is UNMET and UNWAIVED.
    - >-
      c* IS PER-ATTACK, NOT SCHEME-LEVEL. The scheme-level exponent is a maximum
      over the attack frontier and is unknown; a low-memory attack with a small
      log2 M could carry a large c*.
    - >-
      KN-OPEN-016 AND KN-OPEN-017 REMAIN OPEN. This batch answers at most half of
      KN-OPEN-017's stated closure condition - it prices the near-neighbour list
      and not its access pattern - and answers nothing about the measured
      G6K/FPLLL crossover dimension the open problem actually names.
    - >-
      NO CLOSURE QUORUM IS SOUGHT OR ASSERTED, and no attestation was obtained or
      recorded. The AGENTS.md rule-13 quorum is suspended repo-wide (and
      origin/main's copy of the rule text disagrees with its own enforcement code
      - see `repository_state_observation`); that is irrelevant here because
      nothing is being closed. GOAL-MLKEM-003 stays `active`, and `active`
      asserts no success: continuing a goal is not evidence that its completion
      criteria can be met, and they are not met.
    - >-
      THE 18 ENUMERATION FIGURES I RAN ARE NOT AN ENUMERATION COST CLAIM. They
      close a named falsification route by a 76-to-270-bit margin; they carry no
      Sage reference and support nothing about enumeration costs in their own
      right.

  # ------------------------------------------------------------------
  # REFUTATION ARTIFACT ACCOUNTING
  # ------------------------------------------------------------------
  refutation_artifact_accounting:
    applicability: >-
      docs/claims-and-verification.md's "Refutation artifacts" requirement binds
      adverse transitions (`weaken`, `reject_scoped`, hypothesis -> `rejected`).
      This decision makes none, so the requirement is not triggered. It is
      answered anyway, because the decision does REJECT a framing and DOWNGRADE
      two sourcing labels, and those should rest on something checkable.
    artifacts_offered:
      - >-
        For "c* is an identity": the closed form c* = margin / log2 M, verified
        against an independent 300-iteration bisection at < 1e-9 by the
        validator, plus the red team's RT-A1/A2 fibre exhibiting distinct
        (margin, log2 M) pairs mapping to the same c*. A derivation, checkable
        by anyone from the archived numbers.
      - >-
        For "CTRL-5 cannot fail": the algebraic fact that the charge term is
        c*log2M, so log2 M = 0 forces the output for any implementation, plus
        results.json's own CTRL-5 rows printing an identical cost at every c. A
        constructive demonstration, not an opinion.
      - >-
        For "the memory model is borrowed": `grep -n "mem"
        estimator/lwe_primal.py` returning nothing, and the observation that
        lwe_primal never calls short_vectors. Directly re-runnable at the pin.
      - >-
        For OBJ-6: the corrected values 92.042616 / 135.205831 / 184.473537
        against the reported 100.194944 / 143.358160 / 192.625866, from
        `log2 M_zq + log2(log2 q)`. One line of arithmetic.
      - >-
        For "the named falsifier does not falsify": my own 18-combination run,
        recorded in EV-MLKEM-020 with its uncovered-path caveat intact.
    proof_status_declared: derivation
    not_a_certificate_and_why: >-
      There is no certificate family here for a wrapper to re-verify: the objects
      are cost-model outputs and algebraic identities over them. `derivation` is
      the honest tier and it is declared. The absence of a proof object is not
      the failure; an undeclared basis would be.

  # ------------------------------------------------------------------
  # OFFICIAL STATUS CHANGES
  # ------------------------------------------------------------------
  official_status_changes:
    ev_mlkem_020: new record, status accepted_with_qualifications
    ev_mlkem_015: unchanged
    ev_mlkem_011: unchanged
    ev_mlkem_013: unchanged
    ev_mlkem_017: unchanged
    ev_mlkem_018: unchanged
    h_mlkem_014: unchanged (analyzed)
    h_mlkem_010: unchanged
    h_mlkem_011: unchanged
    h_mlkem_012: unchanged
    h_mlkem_013: unchanged
    kn_find_012: unchanged
    kn_find_014: unchanged
    kn_open_016: unchanged_and_open
    kn_open_017: unchanged_and_open
    cost_mlkem_001: unchanged
    exp_mlkem_015: unchanged
    goal_mlkem_003: >-
      active -> active. The budget-exhaustion pause condition was MET at batch 10
      of 10 and CLEARED in this same decision by a 10 -> 12 extension on direct
      user instruction. `maximum_batches` 10 -> 12, `current_batch_id` BATCH-010
      -> BATCH-011, one new `next_action`. NOT paused, NOT completed, NOT
      closed_at_budget; `active` asserts no success.
    new_records: [EV-MLKEM-020, DEC-20260803-c7a1a3]
    note: >-
      No field of any prior record was edited by TASK-20260803-341aad.
      Corrections supersede rather than overwrite (AGENTS.md rule 4). The four
      defects found in the BATCH-010 producer package are recorded in
      EV-MLKEM-020 and NOT repaired in the archived artifacts, which are
      immutable.

  # ------------------------------------------------------------------
  # KNOWLEDGE PROMOTION
  # ------------------------------------------------------------------
  knowledge_promotion:
    promote: false
    promoted: []
    not_warranted: >-
      NOT WARRANTED, on three concrete grounds, and the candidates were really
      considered rather than waved past. CANDIDATE A, a KN-FIND on the robustness
      result ("the inequality c* << 1/3 is invariant across the sieve-memory
      exponent, the memory unit, both charge models, the sieve-dimension choice,
      within-model re-optimisation, and a polynomial-memory enumeration
      alternative"). REFUSED FOR NOW because the package it would summarise
      carries a confirmed arithmetic error in a durable artifact (OBJ-6:
      +8.152329 bits, feeding a c* row, in the direction of the conclusion), a
      declared null object that cannot fail so that controls-before-belief is
      formally unmet (OBJ-3), and a memory model whose "sourced three ways" claim
      is not supported because the attack's own estimator module supplies no
      memory figure at all (H4/H5). Promoting now would durably enshrine exactly
      the framing both independent reviews rejected, and the corpus is the last
      place a rejected framing should land. CANDIDATE B, a KN-TECH on the
      Sage-free estimator harness - genuinely uncovered: no knowledge entry
      describes tools/sage_free_estimator, and a harness whose known-answer
      control reproduces a Sage-computed reference at delta 0.0 and refuses to
      emit numbers otherwise is a reusable technique. REFUSED HERE because the
      validator's D4 shows its scope documentation is materially incomplete
      (`dual` and `primal_hybrid` also fail to execute, not only Arora-Groebner),
      and because the shim was modified outside any declared write_scope during
      this batch (EV-MLKEM-020 EI-2), so the tool is currently in a state no
      receipt pins. Writing a technique entry for an unpinned,
      incompletely-documented instrument would be a fabrication of stability.
      PROCEDURAL GROUND, independent of both: TASK-20260803-341aad's declared
      write_scope is exactly four paths and contains no `knowledge/` path.
      Writing one would expand a declared archival path set and break the
      archive contract (AGENTS.md "Durable research commits"); a knowledge
      promotion belongs to a task that declares it. Finally, the disposition is
      `revise`, which does not itself trigger the mandatory-promotion rule (that
      binds `support` and `reject_scoped` on `replicated`/`strong` evidence) -
      recorded for completeness, and NOT offered as the reason.
    concrete_successor: >-
      One promotion task, declaring `knowledge/` in its write_scope, dispatched
      after BATCH-011 and gated on three conditions that are all cheap and that
      ranking candidate A is instructed to satisfy in passing: (1) a successor
      record recomputes or withdraws
      log2_memory_bits_information_theoretic and restates the "c* moves by about
      15% across units" claim accordingly (red team RC-2); (2) the red team's two
      non-degenerate nulls (RC-1: the sign null and the denominator null) are run
      and archived by a session that did not author them, so
      controls-before-belief is met rather than asserted; (3) H4/H5's sourcing is
      restated as a construction with partial support, and H7's c = 1/3 as a
      transfer by analogy from KN-LIT-094's BSGS analysis. On those three, the
      KN-FIND that should be written is the INVARIANCE, at two significant
      figures, with `dominated_by` and `sota_delta` filled - not the exponent.
      The KN-TECH for the harness follows a separate task that first pins and
      documents the shim's true served-attack set.

  # ------------------------------------------------------------------
  # RANKING RATIONALE
  # ------------------------------------------------------------------
  ranking_rationale:
    basis: >-
      AGENTS.md "Research-direction integrity and auditability" and
      docs/inventor-protocol.md section 4. The budget was extended 10 -> 12, so
      this ranks a REAL allocation: candidate A is BATCH-011's producing task and
      is written into the goal's single `next_action`. Each candidate carries its
      evidence, cost, test boundary, remaining uncertainty and revisit condition.
      No candidate is abandoned.
    the_choice_that_was_made: >-
      Two candidates were put to me as the strongest, and I rank the
      BORROWED-MEMORY-MODEL problem above the REPAIR-AND-RE-RUN. Reason: they are
      not the same kind of work. The repair fixes a real bug in a non-headline
      unit row, swaps a vacuous control for two nulls the red team has already
      specified and run, and rewrites a framing - all of which I want, none of
      which changes what the result is ABLE to support. The borrowed memory model
      is the load-bearing weakness: every c* in EV-MLKEM-020 divides by a log2 M
      that the attack's own instrument path never supplies, so if the figure
      primal_bdd actually implies differs materially, every number moves and the
      invariance claim is tested where it has never been tested. It is also the
      one axis on which the answer could still change, since the red team showed
      the conclusion survives an 8x change in the sieve-memory EXPONENT but
      nobody has questioned the OBJECT being sized. Under
      docs/target-result-profile.md the bias is toward the mechanism over the
      polish. The repair is not dropped: because candidate A rebuilds the same
      script, RC-1 and RC-2 ride along as mandatory deliverables of the same task
      at near-zero marginal cost, and the standalone repair remains recorded as
      candidate B if A returns "cannot be sourced" before touching them.
    candidates:
      - id: A
        candidate: >-
          Derive a memory figure that primal_bdd actually implies, and recompute
          c* against it beside the borrowed one. State what the MATZOV/AGPS20
          gate count charged for primal_bdd's two sieve calls implies about the
          database those calls hold, sourced from retrievable primary or archived
          text rather than from a function the attack never invokes. Carry RC-2
          (fix memory_charged_derivation.py:151 and restate the 15%-across-units
          claim) and RC-1 (replace CTRL-5 with the sign null and the denominator
          null) in the same script, and frame the deliverable around the
          robustness of the inequality with c* at two significant figures.
        rank: 1
        cost: One producing run, <= 1800 s, plus one independent review session.
        why_first: >-
          It is the only candidate that can change what BATCH-010's result
          supports rather than how it reads. `grep -n "mem"
          estimator/lwe_primal.py` returns nothing and lwe_primal never calls
          `short_vectors`: the instrument supplies no memory figure for this
          attack at all, the 0.2075 literals cited come from `short_vectors()`
          annotated "# pick something" by the estimator's authors, and the unit
          convention comes from lwe_dual.py. A denominator nobody has derived is
          a worse defect than a numerator everybody has checked three times.
        test_boundary: >-
          The same three FIPS 203 sets, the same pin, the same single attack.
          Nothing here reaches other attacks, other cost models, or ML-KEM
          security.
        expected_outcome_stated_in_advance: >-
          More likely than not, a declared "the instrument cannot supply it and
          no retrievable source states it for this attack path". THAT IS A
          USABLE RESULT and must be reported as one, not padded: it converts
          H4/H5 from a sourcing claim into an honestly declared construction and
          tells every downstream reader exactly what the c* denominator is. A
          task that can only succeed is not a test.
        remaining_uncertainty: >-
          Whether AGPS20/MATZOV primary text is retrievable under this program's
          network policy at all. EV-MLKEM-015's boundary - no FIPS 203 or NIST
          text readable - suggests caution.
      - id: B
        candidate: >-
          The standalone repair-and-re-run: fix OBJ-6, replace CTRL-5 per OBJ-3,
          and re-frame the deliverable around the inequality, without touching
          the memory model's provenance.
        rank: 2 (recorded successor)
        cost: Minutes of compute; one session.
        why_second_and_not_dropped: >-
          Every item in it is named by an independent review and together they
          convert this batch's output from "admissible with four defects" into
          something promotable - it is the gate on the knowledge promotion this
          decision declined. It ranks second only because it is bookkeeping on a
          result rather than a test of one, and because candidate A absorbs its
          two cheapest items by construction. If A is dispatched and returns
          before touching RC-1/RC-2, B is dispatched immediately as its own task.
      - id: C
        candidate: >-
          The BATCH-009 repair: a successor validation task under a freshly
          minted id, repeating the TASK-20260802-08f428 handoff in full against
          snapshot d0f2bf7f1770, then the blocked ledger archive
          TASK-20260802-43e5e4 carrying EV-MLKEM-019.
        rank: 3
        cost: One independent review session; no new compute.
        why_third_despite_being_owed: >-
          It is the only OWED item in this campaign and leaving a hash-pinned
          snapshot un-reviewed is how a program accumulates artifacts that look
          like results - so it is not optional and it is not deprioritized on
          merit. It ranks third only because BATCH-011 has two batches and this
          work is review-bound rather than producer-bound: it can ride BATCH-012,
          or BATCH-011's review slot if that slot is otherwise idle. The
          successor must re-derive independently rather than adopt the preserved
          notes, which came from a session that did not finish.
        test_boundary: Toy parameters, the resolved band only; nothing about Kyber, nothing about ML-KEM.
        revisit_condition: >-
          Promote it to rank 1 if BATCH-011 cannot be dispatched for any reason,
          since it needs no new compute and clears a standing debt.
      - id: D
        candidate: >-
          The access-DISTANCE half of KN-OPEN-017 (red team RC-4): source a
          bucket/filter working-set exponent for the list-decoding sieve and
          recompute c* against M_eff, or record that MATZOV.NN_AGPS
          (reduction.py:972-998) carries only time-fit coefficients so the
          instrument cannot supply one.
        rank: 4
        cost: Literature retrieval plus arithmetic; no large compute.
        why_fourth: >-
          It is the half of KN-OPEN-017's own closure condition this batch did
          not compute. It ranks just below candidate A because it is the same
          question one level out - A asks what the database IS, D asks what
          fraction of it an access must span - and A's answer conditions D's.
          Bounded in advance by the red team: locality alone cannot restore the
          undercut at c = 1/3 unless log2 M_eff <= 3*margin = 8.40 / 18.12 / 3.83
          bits, which no sieve of this family has, so the expected outcome is a
          completeness gain, not a reversal.
        remaining_uncertainty: >-
          Whether any retrievable source states a working-set exponent for a
          bucketed list-decoding sieve at all.
      - id: E
        candidate: >-
          Memory-aware re-optimisation OUTSIDE RC.MATZOV: tuple sieving,
          reduced-database sieving, enumeration hybrids, costed under a charge.
        rank: 5
        cost: New cost-model work; a project, not a batch.
        why_fifth: >-
          It is the genuine open flank. The within-family ceiling is now known
          (0.46 bits at c = 1/3 against 26.70 needed), and the polynomial-memory
          endpoint is now known (+76 to +270 bits above cutoff), so the
          interesting region is the interpolation between them - the lattice
          analogue of a van Oorschot-Wiener time-memory tradeoff, which no row of
          this batch supplies. Explicitly NOT abandoned; ranked on cost.
        revisit_condition: >-
          Promote it above D if any source claims a sieve variant reaching the
          same SVP instances with materially less memory at comparable gate
          count, since that is H4's own stated falsifier.
      - id: F
        candidate: >-
          The rule-12 `review-breakthrough` pass at `max` over the BATCH-007/008
          contradiction, still gating the KN-FIND-012 restatement, the
          KN-FIND-014 withdrawal successor and the KN-OPEN-016 amendment.
        rank: gate, not a rival
        stated_risk: >-
          Still unservable in this environment on the last recorded probe. It is
          not optional and cannot be substituted; recording a degraded review as
          a rule-12 pass remains the one outcome worse than no review. BATCH-011
          is chosen, like BATCH-010, as work that does not depend on it, which is
          why the goal can proceed while it remains unmet.
      - id: G
        candidate: >-
          The standing expensive branch: install G6K and measure sieve behaviour
          directly, which is what this goal's completion criterion names when it
          says "calibrated by measured sieve behaviour at reduced dimensions".
        rank: 6
        deprioritized: true
        evidence_for_deprioritization: >-
          Blocked twice on infrastructure (BATCH-003, BATCH-005) - infrastructure
          signal, never mathematical evidence (AGENTS.md rule 5) - and reframed
          by BATCH-008's ~93-117-bit dynamic-range result for its originally
          stated target. It is NOT dead for THIS batch's question, though: the
          calibration half of the completion criterion has still never been
          attempted, and BATCH-010 charged a memory model that no measurement in
          this program has ever touched.
        revisit_condition: >-
          Reopen if a working G6K install is demonstrated independently of this
          goal, or if candidate A or D returns a memory figure or working-set
          exponent that a measurement could check - which would make it the
          direct route to the completion criterion's calibration half.
    dominated_by: >-
      NOT ESTABLISHED, and recorded as a gap rather than as null, because an
      unchecked null would be a fabrication under AGENTS.md rule 5. What HAS been
      checked, at these parameters in this instrument: primal_bdd is cheaper than
      primal_usvp (143.771733) and dual_hybrid (145.528285) at Kyber-512 under
      RC.MATZOV (validator VAL-CTRL-A), and the polynomial-memory enumeration row
      is 76 to 270 bits more expensive than the cutoffs at c = 0 (my own run), so
      the low-memory row the red team flagged as missing is now present. What
      remains UNCHECKED: `dual` and `primal_hybrid` do not execute in this
      harness at all, Arora-Groebner is unavailable, and no sieve variant outside
      RC.MATZOV (tuple, reduced-database, hybrid) was costed. The frontier is
      therefore partially mapped, not mapped.
    sota_delta: >-
      Zero against any external baseline. BATCH-010 produced no time, memory,
      data/query or security-bits improvement against any published result and
      claims none. Its delta is internal and conditional: it converts
      EV-MLKEM-015's c = 0 undercut into a statement about the charge interval
      0 <= c < c*, and it adds the polynomial-memory row that no prior batch had.
    named_obstruction: >-
      Stated per the inventor-protocol closure standard, and it closes no lane.
      The obstruction to turning this batch's c = 1/3 and c = 1/2 rows from upper
      bounds into estimates is that RC.MATZOV supplies no lower-memory sieve
      model, and MATZOV.NN_AGPS carries only time-fit coefficients with no space
      entry, so the instrument cannot price either a reduced database or an
      access pattern. That is an instrument limitation with named forward
      guidance (candidates C and D), not a dead lane.
    premature_closure_check: >-
      This decision closes no lane, closes no goal, and pauses none. It keeps
      KN-OPEN-016 and
      KN-OPEN-017 open, keeps the access-pattern half of KN-OPEN-017 explicitly
      unanswered, keeps candidates A-G named and ranked with revisit conditions,
      records the BATCH-009 repair as OWED rather than dropped, and records the
      rule-12 transitions as still owed rather than cancelled.

