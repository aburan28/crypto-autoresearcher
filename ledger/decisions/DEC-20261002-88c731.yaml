  # ---------------------------------------------------------------------------
  amb_a3_fx31_ruling:
    grounds_stated_before_deciding: >-
      Three grounds, applied option by option in AMD-20261002-c7ccde
      ruling_grounds before choosing: fidelity to AMD-20261002-280481's
      intent, blinding (no real-archive P0 value has been computed by the
      copy), and test-harness honesty. Neither speed nor favourability was
      a criterion.
      FIDELITY. A-1 (b) ("P0 stops before writing design.json ... a
      Coordinator matter, not data") and A-3 ("one new helper that implements
      A-1 (b) and its stop") state the substantive rule, and the copy
      implements them literally. The archived fixtures/make_fixtures.py
      (b64be7 package, written before AMD-20261002-280481) relabels fixture
      C's archive to 30/32 bits, so on that input A-1 (b) mandates the stop
      whatever the completeness counts. The conflict is a drafting defect of
      AMD-20261002-280481 by this Coordinator (CD-1): exercise (1) asked for
      after-D7 identity on the one step that exercises the changed rule. The
      faithful repair keeps the rule and corrects that one expectation, which
      is OPT-1.
      BLINDING. OPT-2 would let a real-archive P0 run with an unratified
      selection write design.json and power.json (t*_plan, final n,
      predicted powers), and the executor would read them before the
      Coordinator rules. That is the exposure the code stop prevents. OPT-1
      and OPT-3 keep the code stop.
      TEST-HARNESS HONESTY. OPT-1's step-31 expectation is derived from the
      rule and committed code, not from the observation, and the parts
      reproduced from the record are labelled as such (c7ccde B-1). Step 31
      becomes the only exercise of the "selection is not exactly {22, 24}"
      branch. OPT-2's step-31 pass would be coincidental, because fixture C's
      [30, 32] equals I-8's band, and would exercise no amended rule. OPT-3
      cannot keep its expectation "unchanged", because the after-D7 values
      were computed on fixture C, and it would require writing new expected
      values after a failure. OPT-1 loses part of step 31's coverage of the
      design-written path. c7ccde B-1 (iv) restores the P0X part, and P1
      covers the design-written path. The numeric downstream residual is
      recorded (c7ccde B-6) and routed to the review.
    ruling: >-
      OPT-1, made precise and versioned by the additive amendment
      AMD-20261002-c7ccde (protocol v2 -> v3), APPROVED HERE. The A-3 copy is
      kept and pinned as built (sha256 e80f6d6c...), with no code change.
      Step 31's v3 expected result is the A-1 (b) stop with B-1 (i)-(iv); the
      other 37 steps keep after-D7 identity under B-2's exclusions. The pin
      is made by a fresh session after the B-3 re-verification: archived-log
      comparison, full exercise re-run, SX-31 with full stderr, and P-case
      re-run equality. Pins and reports move to the -c7ccde record files
      (B-4), and manifests carry the v3 protocol block (B-5). OPT-2 and OPT-3
      are not taken.
    amendment_written: AMD-20261002-c7ccde (experiments/EXP-PFDR-011cd0/amendments/AMD-20261002-c7ccde.yaml), protocol v2 -> v3, approved by this decision
    unchanged: AMD-20261002-280481 A-1 (a)-(e) including the code stop, A-2, A-4 (1)-(4) and (7), A-5, A-7; specification.yaml v1; every threshold, prediction, cell, seed, gate and machine limit
    pre_data: >-
      Yes. The changed expectation is a synthetic-fixture expectation. No
      census quantity or real-archive P0 input has been computed or seen by
      anyone in this line since DEC-20261002-1efb1f.

