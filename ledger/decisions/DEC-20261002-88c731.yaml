  archive_route_ruling:
    finding: >-
      TASK-20261002-1fcda9's check (e) ("analyze_relcensus.py equals its pin
      in implementation-notes-amd280481.yaml") presumed a pin. Its card named
      no expected state for a stop before the pin. That is a second
      Coordinator drafting defect (CD-2). The session stopped at (e) and
      committed nothing, which is the correct application of
      DEC-20261002-1efb1f PD-2. It is compliance, not a deviation.
    ruling: >-
      TASK-20261002-07fdcb GOVERNS the archiving of TASK-20261002-ce5403's
      stopped package. It is a snapshot card modelled on 1fcda9. Its check
      (e) verifies the expected stopped state: the copy equals the recorded
      a3_copy.sha256 e80f6d6c..., the record shows pinned false with every
      pin null, and each of the 11 amd-280481/ files equals its hash in
      amd_280481_files. A recorded pin or a differing hash is a STOP. Its
      check (c) names the exact expected working-tree changes. It commits
      its own card with the package (precedent TASK-20261001-cb35e7 and
      TASK-20261001-fc620a). TASK-20261002-1fcda9 is SUPERSEDED, NOT EDITED.
      It governs nothing further, and its stopped attempt is recorded as
      history in the 07fdcb receipt. TASK-20261002-ce5403's archived_by
      still reads 1fcda9, which was correct when it was dispatched. The
      archival obligation for its outputs passes to 07fdcb by this ruling.
    ordering: >-
      SNAPSHOT FIRST, IN ITS OWN COMMIT. 07fdcb runs alone and commits the
      13 executor files plus its own card and receipt. Only after its
      receipt verifies and the branch is pushed does TASK-20261002-1a4023
      run, alone, committing this decision, the amendment, 7cf711, b905f7,
      its own card and its receipt. The 1a4023 commit stages no executor
      output. Grounds: AGENTS.md "Durable research commits" (snapshot before
      ledger) and the rule that no official transition is made from
      uncommitted research artifacts. This decision rules on, and pins,
      bytes that must already be committed. "With" is excluded, because
      archives run alone. "After" is excluded, because the ruling would then
      precede the custody of the bytes it rules on.
    card_lesson: >-
      b905f7's check (e) names its expected state for every stop point:
      before the pin, pinned, and design.json produced but not yet pinned.

