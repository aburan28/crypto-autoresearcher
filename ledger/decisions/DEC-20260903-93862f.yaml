  rationale:
    - >-
      Approval on user confirmation. The design-experiment skill (step 4)
      makes user confirmation the gate that authorizes execution and spends
      compute; DEC-20260903-8cdf8d withheld approval for exactly that
      reason. The user confirmed all six contracts as drafted on
      2026-09-03. Approval is therefore recorded by ordinary Coordinator
      authority (AGENTS.md rule 1) as a NEW record (this decision) together
      with the approved_by / approved_at / approval_note fields set on each
      specification in the same archive step, per the approval_condition of
      DEC-20260903-8cdf8d. No contract is approved in part; no contract's
      inputs, controls, metrics, budgets, stopping rules, invalidation
      rules, success or falsification criteria, or preregistered prediction
      were changed.
    - >-
      The calibration-first order is preserved exactly as recommended in
      DEC-20260903-8cdf8d: tooling prerequisite (TASK-20260903-ba41aa), then
      EXP-PFDR-fd901a (p-independence calibration, the small-p artifact
      budget), EXP-PFDR-5726af (the forced first-fall cell, which decides
      whether the 84cdb7 ladder runs), EXP-PFDR-cbdefb (the (d_ff, d_lf)
      slope ladder, consuming contract 1's budget and contract 2's d_ff
      values), EXP-PFDR-20ee58 (the digit-twin deficit cells with the
      binary n = 12 calibration), EXP-PFDR-4bfc6f (the ALPF-011 mechanism
      separation), and EXP-PFDR-c04716 (the zero-run cost table), which
      needs no meter and may run at any time after the approving snapshot
      archive verifies but MUST be archived before any Outcome III of
      contract 3 is interpreted.
    - >-
      Execution is gated on the tooling prerequisite. Contracts 1-5 each
      name the F_p port of experiments/EXP-SBRG-60c55e/driver/macaulay.py
      as a REQUIRED INPUT and each carries an invalidation rule voiding any
      run whose meter has not passed the p = 2 known answer against
      KN-FIND-006 and the planted-syzygy positive control in the same
      manifest lineage. The port is charged ONCE as TASK-20260903-ba41aa
      (maximum_runs 0; it is tooling, not an experiment), and every
      executor handoff for contracts 1-5 states the dependency explicitly
      and forbids starting before that task's snapshot receipt verifies.
      Contract 6's handoff states that the dependency does not apply.
    - >-
      Budgets are as frozen. Each executor handoff copies its contract's
      maximum_runs and maximum_memory_gb unchanged and sets
      wall_clock_seconds = min(wall_clock_seconds_per_run x maximum_runs,
      total_cpu_hours x 3600 at maximum_workers 1), with the bound explained
      in a budget_note; no budget field is null; the two zero-run tasks
      (tooling and contract 6) carry session-time bounds and maximum_runs 0.
      Every executor handoff runs under executor-implementation in an
      independent session.
    - >-
      Target-profile bias and the conditional-result pairing rule are
      satisfied as in DEC-20260903-8cdf8d: the battery's one exponent-
      relevant outcome (contract 3's Outcome III) is paired in the same
      batch with its heuristic-validation experiment (contract 3 itself)
      and its concrete-cost artifact (contract 6); everything else is
      calibration, instrument validation, or closure of stakes never
      costed. The proof-oriented gate (KN-TECH-080) was met at design time
      by the filled proof_search_map on all six hypotheses.
    - >-
      Hypothesis transition proposed -> specified is the state the precedent
      (H-JPR-5e33d6 under DEC-20260902-52868a) uses once a frozen contract
      is approved; it asserts nothing about the hypotheses' truth and moves
      none of them toward supported. The contracts' status
      review_required -> approved is the experiment-state transition of
      AGENTS.md 'Research states'; running is entered only by
      /run-experiment after the snapshot archive.
