    - >-
      Contract 6 (EXP-PFDR-c04716) is zero-run and may execute immediately
      after the approving snapshot archive verifies; its package is a
      derivation-tier concrete-cost artifact conditional on HEUR-001 of
      H-PFDR-06fd60 throughout and validates no heuristic.
    - >-
