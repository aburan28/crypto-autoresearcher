      REVISIT CONDITION: reconsider authorizing it as soon as NA-1 verifies,
      together with the C2 backlog in NA-3 and against the campaign's remaining
      batch budget (maximum_batches: 6, current_batch_id BATCH-005). Declining
      to authorize it TODAY is a sequencing judgement about an unverified
      archive and a nearly-spent budget, and is explicitly NOT a judgement that
      the lane is exhausted, saturated, or unpromising -- which under
      docs/inventor-protocol.md would be a premature-closure failure and would
      require a named obstruction this record does not have and does not claim.

  authorization_boundary: >-
    STATED EXPLICITLY SO IT CANNOT BE READ WIDER THAN IT IS. This decision:
    AUTHORIZES NO EXECUTOR -- no task is dispatched and no queue entry is
    created or reopened;
    APPROVES NO EXPERIMENT -- no experiment contract is frozen and no EXP-*
    record is created or moved;
    AUTHORIZES NO MEASUREMENT AND NO IMPLEMENTATION -- consistent with
    RT-20260731-013's own experiment_authorized: false,
    measurement_authorized: false, implementation_authorized: false;
    MOVES NO HYPOTHESIS -- H-DREG-001 stays `inconclusive` (its committed status
    in ledger/H-DREG-001.yaml, per DEC-20260717-002) and H-SIG-001 is untouched;
    LIFTS NO QUARANTINE -- the raw 17947 headline stays quarantined (see
    standing_hold_reaffirmed);
    CLOSES NO GOAL AND NO RESEARCH QUESTION -- GOAL-DREG-001 stays `active`,
    RQ-DREG-001 is untouched, and no completion criterion is claimed met;
    APPENDS NO GOAL CHECKPOINT AND ADVANCES NO latest_verified_commit -- for the
    reason given in NA-2, which is that the archive is not yet verified;
    CREATES NO KNOWLEDGE ENTRY -- see knowledge_promotion;
    AND IS NOT ADMISSIBLE TOWARD ANY CLOSURE QUORUM -- it is one Coordinator
    subagent in one session, no attestation was obtained or is claimed, and no
    completion_quorum block appears anywhere in this record. AGENTS.md's "never
    record an attestation you did not obtain" binds regardless of the quorum's
    suspension.

