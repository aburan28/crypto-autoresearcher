coordinator_decision:
  id: DEC-20260810-3c851d
  goal_id: GOAL-DREG-001
  batch_id: BATCH-005

  context: >-
    CLOSES GOAL-DREG-001 BATCH-005 IN THE LEDGER. This is item (1) of the
    goal head's own next_action (ledger/goals/GOAL-DREG-001.yaml, key
    research_goal.next_action), executed as a Coordinator ledger act rather
    than an executor dispatch.

    BATCH-005 was complete in every respect except one. Its four queue entries
    (TASK-20260731-016 executor, TASK-20260731-025 coordinator snapshot,
    TASK-20260731-026 red-team, TASK-20260731-027 coordinator ledger) are all
    at state "completed" in
    coordination/goals/GOAL-DREG-001/batches/BATCH-005/dispatch_queue.json. Its
    evidence record ledger/evidence/EV-DREG-008.yaml is committed. Its
    independent red team returned PASS (RT-20260731-013). BUT NO COMMITTED FILE
    IN THE CURRENT TREE HOLDS THIS BATCH'S CLOSING DECISION.

    THE MECHANISM IS IDENTIFIER DISPLACEMENT ACROSS TWO REUSES, NOT A SINGLE
    COLLISION, AND THE FULL SEQUENCE IS RECORDED IN CORR-20260810-177f1a.
    A closing decision WAS authored and committed for this batch on 2026-07-31,
    under the identifier DEC-20260731-002, in commit
    bee3b3d8be35feb41bdd9af64cd43a9f6ce69d12. That identifier was later reused
    by GOAL-CRYPTO-001 BATCH-013, and ledger/decisions/DEC-20260731-002.yaml in
    the current tree is that other campaign's record
    (decision: final_no_candidate_keep_active; target_ids GOAL-CRYPTO-001,
    EV-CRYPTO-013, DEC-20260730-004) with the GOAL-DREG-001 text gone.
    Separately, the pointer in this batch's ledger receipt was remapped to
    DEC-20260731-014 — an identifier that was itself already occupied by
    GOAL-ECDLP-001 BATCH-021, whose record
    (decision: approve; target_ids include EXP-DS-001, H-DS-001,
    GOAL-ECDLP-001, BATCH-021; decided_at 2026-07-31) is what
    ledger/decisions/DEC-20260731-014.yaml holds today. The DREG disposition
    fell out of the tree between the two reuses.

    THE GOAL HEAD'S CONCLUSION IS THEREFORE CORRECT AND ITS DIAGNOSIS WAS HALF
    THE STORY. GOAL-DREG-001 has BATCH-005 evidence and, in the current tree, no
    BATCH-005 decision — but because its decision was displaced, not because it
    was never written. This record carries that disposition forward under a
    fresh random-suffix identifier; it does not pretend to be the first attempt
    at it, and the verb it lands on is reconciled against the original in
    decision_vocabulary_note and restored_from_displaced_record below.

    This decision is authored by a Coordinator subagent with NO shell. It ran no
    command, recomputed no hash, and re-executed no measurement. Facts about the
    CURRENT TREE are read directly from the committed files named beside them.
    Facts about GIT HISTORY — the existence, ancestry, contents and changed-path
    set of bee3b3d8 — were established by the orchestrating Coordinator session
    that does have shell access and are ATTRIBUTED TO IT, not independently
    verified here; see git_history_provenance. NOTHING HERE IS DURABLE UNTIL AN
    ARCHIVAL COMMIT IS MADE, PUSHED, AND ACCEPTED BY THE POST-COMMIT VERIFIER
    (AGENTS.md "Durable research commits").

  decision: support

  decision_vocabulary_note: >-
    `support`, chosen against the template's enumerated values and defended
    against each.

    WHY `support`. EV-DREG-008 carries direction `supports` at strength
    `preliminary`, the independent red team PASSed the package it rests on, and
    this batch is being closed on that evidence. `support` is the evidence
    verdict that matches an admitted, reviewed, direction-positive measurement,
    and it is the same verb GOAL-DREG-001's own BATCH-004 closing decision
    DEC-20260725-026 used on a red-team PASS. The verb records that the evidence
    points the way the evidence record says it points, AT ITS OWN STRENGTH AND
    TIER -- preliminary, toy, one cell. It is not a statement that H-DREG-001 is
    supported.

    WHY NOT `approve`. `approve` names an authorization to run. THIS DECISION
    AUTHORIZES NOTHING TO RUN: no experiment is approved, no measurement is
    authorized, no executor is dispatched, no contract is frozen. Using
    `approve` would misdescribe a closing act as an opening one.

    WHY NOT THE OTHERS. `weaken` and `reject_scoped` are wrong on direction --
    the evidence supports rather than undercuts, and `reject_scoped` on a single
    unreplicated empirical-only run is forbidden to the Coordinator outright.
    `revise` sends a producer's work back; the producer's work PASSED
    independent review and needs no rework. `replicate` orders a re-run; this
    decision orders none (a re-rank remains available and unordered -- see
    residual_controls_available). `pause` would stall a live lane at the moment
    its measurement landed, and would be a steering failure under AGENTS.md
    rule 9. `supersede` is close but wrong at the record level: this decision
    replaces no record wholesale -- it carries forward a disposition whose
    original record was displaced, and corrects a broken POINTER by naming it,
    which is done in prose below and not by rewriting anything.

    WHY NOT `expand`, WHICH IS THE VERB THE DISPLACED ORIGINAL USED. This needs
    its own answer rather than a one-line dismissal, because DEC-20260731-002 as
    it stood at commit bee3b3d8be35feb41bdd9af64cd43a9f6ce69d12 decided `expand`
    on this exact evidence, and a narrowing must be argued rather than
    performed silently. THE DISPOSITION IS NARROWED TODAY, DELIBERATELY, FOR
    REASONS THAT DID NOT EXIST ON 2026-07-31:

    (i) THIS RECORD AUTHORIZES NOTHING, AND `expand` NAMES AN AUTHORIZATION TO
    WIDEN. Using `expand` while the authorization_boundary below denies every
    concrete widening would invite exactly the read-wider-than-it-is failure
    that boundary exists to prevent.

    (ii) THE GOAL HEAD NOW GATES RE-DISPATCH BEHIND THIS ARCHIVE. Its
    next_action item (3) holds Chain C2 unarchived and permits re-dispatch or
    supersession ONLY AFTER the ledger act; item (2) requires the archive to
    land and verify first. Authorizing new ladder cells from a record whose own
    archive is not yet verified would invert that order, and AGENTS.md forbids
    an official transition from uncommitted ledger artifacts.

    (iii) THE BUDGET IS NEARLY SPENT AND EXPANSION WOULD CONSUME IT. GOAL-DREG-001
    declares campaign_budget.maximum_batches: 6 with current_batch_id BATCH-005.
    An expansion authorized here would commit the campaign's last batch, sight
    unseen, before the C2 backlog is even archived. That is a sequencing call
    the next Coordinator should make with the archive verified, not one this
    record should pre-empt.

    (iv) THE ORIGINAL'S OWN `expand` BULLET WAS DISJUNCTIVE. It read "Expand next
    to additional ladder cells / seeds under the same CTRL-B instrument, OR
    PAUSE IF PATH CAPACITY PRIORITIZES ELSEWHERE" -- it did not firmly commit to
    expansion either, and the branch it left open is the branch conditions now
    select.

    WHAT THE NARROWING IS NOT. It is NOT a judgement that expansion is
    unwarranted, and the lead is NOT dropped: the original's expansion direction
    is preserved in substance, with a concrete revisit condition, in
    restored_from_displaced_record.preserved_expansion_option. AGENTS.md rule 9
    forbids steering away from a live lead, and recording an option as available
    and unexercised is how a sequencing constraint is honoured without
    abandoning the lane.

    WHAT `support` DOES NOT MEAN HERE, RESTATED SO IT CANNOT BE READ AS A
    STRENGTHENING OVER `expand`. It does NOT mean H-DREG-001 is supported at
    ladder scope. The displaced original said in its own second bullet that
    "this cell pin alone does not support or reject H-DREG-001 at ladder scope",
    and D-7 below says the same thing in the same words' substance. On the only
    question where the two verbs could have diverged in claim strength, the two
    records agree exactly.

  supersedes_displaced_decision_reference: >-
    THIS RECORD IS THE ONE THAT CARRIES GOAL-DREG-001 BATCH-005's DISPOSITION IN
    THE CURRENT TREE. Wherever a GOAL-DREG-001 BATCH-005 artifact names a
    closing Coordinator decision, the correct referent for the current tree is
    DEC-20260810-3c851d. The bookkeeping detail is recorded in full in
    CORR-20260810-177f1a; the operative points are three.

    (1) THE POINTER IN THE RECEIPT AND QUEUE IS WRONG, AND IT IS WRONG IN A
    SPECIFIC WAY. Both
    coordination/goals/GOAL-DREG-001/batches/BATCH-005/archives/TASK-20260731-027/ledger-receipt.json
    (fields record_ids, artifact_sha256) and
    coordination/goals/GOAL-DREG-001/batches/BATCH-005/dispatch_queue.json
    (task TASK-20260731-027, fields handoff.deliverables,
    handoff.artifact_paths, archive.record_ids, archive.path_sha256) name
    ledger/decisions/DEC-20260731-014.yaml at digest
    6093f111f4b1f7eef4c5da8e067a9f8e8cb14984c1885cbdff88414ba1a0a81b. Per the
    orchestrating session's git checks, THAT PATH WAS EMPTY AT THE ARCHIVE'S OWN
    DECLARED COMMIT bee3b3d8: the blob there hashes to
    e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855, which is
    the SHA-256 of the empty string — a constant this Coordinator can and does
    confirm independently of any shell. So the receipt binds a path that held
    nothing when it was written, and today holds a different campaign's record.

    (2) THE DECISION THE ARCHIVE ACTUALLY CARRIED WAS DEC-20260731-002 AS IT
    STOOD AT bee3b3d8be35feb41bdd9af64cd43a9f6ce69d12, AND MUST ALWAYS BE CITED
    WITH THAT COMMIT QUALIFIER. A bare citation of "DEC-20260731-002" now
    resolves to GOAL-CRYPTO-001 BATCH-013's record — verified by this
    Coordinator by reading ledger/decisions/DEC-20260731-002.yaml in the current
    tree — and would therefore be a wrong citation, not merely an imprecise one.

    (3) NOTHING IS EDITED, DELETED OR RENUMBERED TO ACHIEVE ANY OF THIS. Not
    ledger/decisions/DEC-20260731-014.yaml, which is CORRECT AS WRITTEN for
    GOAL-ECDLP-001 BATCH-021; not ledger/decisions/DEC-20260731-002.yaml, which
    is CORRECT AS WRITTEN for GOAL-CRYPTO-001 BATCH-013; not the receipt; not
    the queue; not EV-DREG-008. AGENTS.md rule 15 is directly on point and
    forbids the alternative: these identifiers appear in a completed archive's
    binding fields, so a remap would permanently break that archive and the
    remedy is supersession by a new record. AGENTS.md rule 4 and CLAUDE.md
    non-negotiable rule 2 say the same generally — corrections supersede, never
    overwrite.

    WHAT THIS DOES NOT ASSERT. It does not assert that either occupying record
    is wrong; each is right about its own campaign. It does not assert who
    minted or remapped which identifier, or when, or with what intent — the
    displacement is recorded as a mechanism, not as a fault. And it does not
    assert that the 2026-07-31 ledger archive failed: per the orchestrating
    session, that archive LANDED at bee3b3d8, which is an ancestor of
    origin/main. What failed is the pointer, and what fell out of the tree is
    the decision text.

