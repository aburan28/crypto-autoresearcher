  rationale:
    - id: D-1
      what: >-
        BATCH-005 is closed on EV-DREG-008 at that record's own declared
        strength and tier -- `preliminary`, `toy`, direction `supports` -- and
        not one increment above it.
      why: >-
        The batch produced exactly one admitted cell: n=12, t=3, ti=0,
        seed=2026, D=6, executed by TASK-20260731-016 under the protocol frozen
        as TASK-20260725-701 / DEC-20260725-026. A single admitted cell is a
        preliminary toy-tier measurement by construction, and AGENTS.md rules 4,
        6 and 7 forbid presenting it as anything else. Closing the batch is a
        bookkeeping act about a batch; it is not an upgrade of the evidence
        inside it.
      evidence: >-
        ledger/evidence/EV-DREG-008.yaml (type: empirical; direction: supports;
        strength: preliminary; claim_tier: toy; proof_status: not_applicable;
        observations item 1); ledger/decisions/DEC-20260725-026.yaml
        (next_actions, which directed exactly this measurement).
    - id: D-2
      what: >-
        The measurement was ADMITTED under the pre-registered admission
        machinery, and admission is what makes the structural number citable at
        all.
      why: >-
        EV-DREG-008 records ctrl_b_admission_status=admitted with all admission
        metrics passing, restricted_support_hash=8a1bf796ccb340181af0c78920e9ebc9d527743d87d6053333ed3d4cbb7bae17,
        deleted_set_hash=a0203e81cd0947aea405bdb7c7ae98b2ddd60c970b96b1a7d2a5caf4b5d6809b,
        and rebuild_match=true. DEC-20260725-026 approved the repaired CTRL-B
        protocol on the express condition that deficit_genuine be reported ONLY
        if all admission metrics pass. That condition was met, on the record,
        before any number was cited.
      evidence: >-
        ledger/evidence/EV-DREG-008.yaml (observations item 2);
        ledger/decisions/DEC-20260725-026.yaml (rationale, limitations);
        coordination/goals/GOAL-DREG-001/batches/BATCH-005/dispatch_queue.json
        (TASK-20260731-016 handoff.completion_gate).
    - id: D-3
      what: >-
        The structural number for this cell is deficit_genuine=17947, obtained
        as rank_null_restricted=156520 minus the sem anchor 138573, landing at
        the UPPER endpoint of the pre-registered bracket [1931, 17947], with
        validity=completed_valid.
      why: >-
        The bracket was pre-registered before the measurement, so an outcome at
        its upper endpoint is a pre-registered admissible outcome rather than a
        post-hoc accommodation. The value is cited here under the label
        structural_metric_id=deficit_genuine ONLY, as the required control
        CTRL-013-LABEL demands, and always as the support-aligned D6 structural
        number from this admitted receipt.
      evidence: >-
        ledger/evidence/EV-DREG-008.yaml (observations item 3);
        coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-026/red_team_report.yaml
        (critical_anomaly_disposition; required_controls CTRL-013-LABEL).
    - id: D-4
      what: >-
        THE NUMERICAL COINCIDENCE WITH THE QUARANTINED RAW HEADLINE IS A
        MEASURED OUTCOME, NOT A LAUNDERING OF IT, AND THE QUARANTINE SURVIVES
        THIS DECISION INTACT.
      why: >-
        deficit_genuine and the raw headline are computed by DIFFERENT FORMULAS
        over different objects: the quarantined raw quantity is
        sr_pred - rank_sem, a support-INDEPENDENT proxy; the structural quantity
        is rank(null | sem_support) - 138573, measured after support alignment.
        They coincide at 17947 for this cell if and only if
        rank(null | sem_support) equals sr_pred -- that is, if and only if the
        16016 deleted degree-6 columns contributed zero rank. The receipt and
        the chunk trail report exactly that case. The independent red team
        examined this specific risk and recorded formulas_distinct: true and
        smuggling_of_raw_as_structural: false. So the equality is a fact about
        this cell's rank, discovered by measurement, and it grants the raw
        formula nothing.
      evidence: >-
        coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-026/red_team_report.yaml
        (critical_anomaly_disposition: formula_raw, formula_genuine,
        equality_mechanism, smuggling_of_raw_as_structural, q_machine_coherence
        Q1/Q2/Q4; objections OBJ-013-1);
        ledger/evidence/EV-DREG-008.yaml (observations item 4).
    - id: D-5
      what: >-
        The support-gap confound that quarantined the raw headline in BATCH-002
        was independently closed for this cell by regenerate-and-match, not
