    how_to_recheck: >-
      git cat-file -p bee3b3d8be35feb41bdd9af64cd43a9f6ce69d12:ledger/decisions/DEC-20260731-002.yaml
      and
      git show --stat bee3b3d8be35feb41bdd9af64cd43a9f6ce69d12.
