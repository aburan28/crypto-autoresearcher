    not_promoted:
      - what: "the R6 calibration result and cost anchor"
        why: >-
          Admissible and recorded in EV-MDFIVE-f3e1ca, but the method-
          ceiling audit is unattempted: promoting a cost anchor before
          the ceiling is measured would freeze a number the next batch is
          likely to re-scope. Revisit at the batch-4 close.
      - what: "the instrument verdict (bounded enumeration cannot close 128 bits at this budget)"
        why: >-
          True at the declared scope and correctly scoped in the evidence
          record; promotion is deferred to the batch-4 close together
          with the MD4 lower control, which converts "cannot at this
          budget" into a measured bound.

  attestation:
    decision_authored_by: coordinator (top-level session; coordinator-role subagents of this runtime have no command execution)
    requested_policy: coordinator-orchestration-code
    resolved_model_id: vllm/qwen3.8-27b
    model_verified: unverified (adapter is authority)
    fallback_used: false
    degraded_requirements: []
    amazon_bedrock_selected_configured_probed_contacted_or_used: false

  independence_note: >-
    Both reviewers of the round resolved to the same model identifier
    (zai/glm-5.2 at xhigh), in independent sessions, sibling-blind (each
    attested read_sibling_reports: false; the red team attested
    blind_from_respected: true). Independence is therefore session-level,
    not model-level, and this decision does not claim model-level
    independence - the same declared constraint as BATCH-312472 (one
    usable backend in the harness as deployed; see the goal-closure
    quorum suspension for the same reasoning). The round's validity does
    not rest on model diversity: it rests on the two reviewers running
    disjoint mechanical surfaces (red team: the protocol's interpretation
    joints + proves-too-much objects + blind re-derivation; validator: the
    seven re-run integrity checks) under a plan that pre-committed the
    Coordinator prior, and on both determinations agreeing with the prior
    recorded before either ran.

  completion_quorum: null
  batch_state: closed
  next_action_single: >-
    Open BATCH-4 (batch 4 of 7): the method-ceiling audit opening with the
    MD4 lower control (the cheaper digest in the family, same instrument
    class, to bound the method's cost from below) plus the instrument-
    class question (what could close the ~2^64-block gap and at what
    asymptotic cost). Re-declare the cumulative campaign budget at the
    opening. No further MD5 runs in batch 4 unless the ceiling audit names
    an MD5-specific step.
