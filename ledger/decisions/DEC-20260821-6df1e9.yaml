  decision: close_batch
  decision_label: batch_1f30fe_closed_calibration_row_r6_instrument_verdict_recorded
  context: >-
    BATCH-1f30fe (batch 3 of the 7-batch campaign, opened by
    DEC-20260821-68fb76 under claim ceiling
    blind_calibration_execution_and_instrument_verdict_only) executed the
    blind calibration search under the frozen protocol BCP-2: the
    instrument and its pre-registered pin-mechanism test were built
    (TASK-20260821-f5f96a), the blind TARGET run (TASK-20260821-c91be2,
    standard MD5, seed 0, 900 s, run_wrapped) and the NULL-OBJECT run
    (TASK-20260821-93cc38, round constants cyclically shifted by 16,
    identical in all other respects) ran sequentially, the package was
    frozen at the content_first snapshot (TASK-20260821-711350, freeze
    commit bf69cd3f2, declaration 4aebc03e), and two concurrent
    independent reviews ran under the pre-committed plan
    review-plan-9c62ae.yaml (red team TASK-20260821-9c62ae, validator
    TASK-20260821-aabf94). This decision closes the batch. It records only
    what the frozen bytes and the two independent reports support, and
    nothing about MD5 (SC-2).

  findings:
    - id: F-1
      text: >-
        ROUND VERDICTS. Red team (TASK-20260821-9c62ae, resolved model
        zai/glm-5.2, xhigh, independent session): holds-with-named-gaps -
        joints K1-K5 all hold, proves-too-much objects D/E/F all rejected
        with the plan-declared failure signatures, blind re-derivation of
        the REDISCOVERY-eligibility predicate (from BCP-2's
        evidence_record_requirement section only) agrees with the
        implemented behavior on D and F, blind_from_respected true, and NO
        prior overturns: the Coordinator prior recorded in the plan before
        any report returned (FAIL/FAIL, row R6, no verified certificate,
        the informative case being a fast success) held exactly. Validator
        (TASK-20260821-aabf94, resolved model zai/glm-5.2, xhigh,
        independent session): run-integrity HOLDS - all seven mechanical
        checks pass on its own re-run output (gate digest recompute
        MATCH, ceiling reports internally consistent with the run records,
        wrapper timing on both, CONSUMPTION empty, T-prime table exact,
        suite 35 passing at the snapshot commit, firewall carry-over with
        no regression), 0 defects. The determinations agree and are
        recorded as the round result.
    - id: F-2
      text: >-
        CALIBRATION RESULT AND WHAT A DEPENDENT GOAL MAY CITE. The pair
        lands on BCP-2 decision-table row R6 (target FAIL, variant FAIL):
        the instrument found nothing on either object within budget; this
        does NOT show that no collision path exists for either (SC-4). R =
        1.018031 (COMPARABLE, TOL = 2 fixed pre-acquisition). A dependent
        goal may cite: (a) the cost anchor - bounded 2^21-block birthday
        enumeration, 40-bit-key table, hex 512-bit blocks, full 128-bit
        digest equality, costs ~54-55 s wall at this encoding on this
        hardware, wrapper-measured; (b) the instrument verdict - the
        declared instrument cannot, at the declared budget, close a full
        128-bit match by search (the declared space is ~2^64 blocks short),
        and the identical-cost null object (R ~= 1.0) shows the
        measurement is not an artifact of the target structure; (c) the
        gate state - the pinned canonicalization reproduces the
        pre-registered digest 2ea0083b... (three independent
        recomputations), the payload remains quarantined and was never
        opened. A dependent goal may NOT cite this batch as evidence that
        MD5 is hard, easy, or rediscovered: the claim ceiling
        (blind_calibration_execution_and_instrument_verdict_only) binds,
        and the method-ceiling audit plus MD4 control remain OPEN AND
        UNATTEMPTED (SC-5). The calibration gate conditions of
        DEC-20260820-32bf19 F-6 are all satisfied: (a) the committed
        pin-mechanism test landed and passes (7 new tests, suite 35),
        (b) the dispatch-time gate re-verification ran with interpreter
        and PyYAML recorded (Python 3.12.8 / PyYAML 6.0.3), (c) the
        opening named budget (900 s / 4 GB), seed (0), null object
        (cyclic shift by 16), and charging convention (run_wrapped,
        ceiling on halt).
    - id: F-3
      text: >-
        NAMED GAPS AND DISPOSITIONS. (1) DEF-1 (red team, K1, minor): the
        BCP-2-specified encoding_provenance_declaration field format
        (authoring_session_read_quarantined_payload,
        authoring_session_id) is not carried in the run records in that
        exact form; equivalent attestations exist in the implementation
        report and both run reports. Disposition: ACCEPTED AS DECLARED -
        for a FAIL/FAIL outcome no REDISCOVERY-eligible success exists to
        qualify, so the gap is nil for this batch (as the red team
        states); the actionable is carried to the batch-4 dispatch record
        as a required field for any future success run. (2) DEF-2 (red
        team, K1, minor): the null run read quarantine/MANIFEST.yaml,
        which is not in the 93cc38 read_scope, and the null report's
        quarantine_access statement is internally contradictory.
        Disposition: ACCEPTED AS DECLARED - the MANIFEST is open metadata
        (no collision-path data), the sha256 list was also available in
        the in-scope target report, the CONSUMPTION intersection is empty
        regardless of source, and BCP-2 firewall.what_read_scope_alone_
        cannot_do states read_scope is a declaration, not a control; the
        batch-4 dispatch record will add the MANIFEST to null-run
        read_scope and the report template will resolve the contradiction.
        (3) DEF-3 (red team, K4, minor): the f5f96a 4.3x budget overrun is
        not cross-referenced from the opening decision. Disposition:
        CROSS-REFERENCE NOW in this finding (F-5 below) and in
        EV-MDFIVE-f3e1ca O-7; the opening decision carries the batch
        budget and the overrun is a disclosed outcome, not a hidden one.
        (4) DEF-4 (red team, K5, informational): stop_reason "table_full"
        is a misnomer (the search space was exhausted, not the table
        literally full). Disposition: RECORDED - the instrument is frozen
        by the campaign (defects are recorded, not patched, per the run
        protocol); the term is used as declared and the meaning is
        documented in the ceiling reports and this decision. (5) The three
        f5f96a disclosed deviations (strategy = bounded birthday search
        accepted over differential/MTM; 6513 s overrun accepted as a
        disclosed budget outcome with the halt-rule breach recorded as a
        procedural deviation; pre-correction smoke run records deleted and
        replaced by same-ID post-correction records, pre-fix bytes
        lost) were ruled at completion time and are formally dispositioned
        here as RECORDED AND CARRIED: none affects the R6 verdict, all
        three are stated in EV-MDFIVE-f3e1ca O-7, and the smoke-record
        replacement is the kind of observation core rule 8 requires to be
        recorded rather than discarded.
    - id: F-4
      text: >-
        INSTRUMENT VERDICT (the batch's licensed claim). The bounded
        enumeration instrument, at the declared encoding, seed, and
        ceiling, executes BCP-2's blind protocol honestly and cannot
        close a 128-bit match at the declared budget; it shows no recall
        tell (real search history, one random 40-bit partial, no
        certificate); and the identical-cost null object (R = 1.018031)
        shows the measurement is not an artifact of the target structure.
        This is a statement about the instrument at the declared scope.
        It is NOT evidence about MD5 (SC-4): the batch asserted nothing
        about MD5, and this decision promotes nothing about MD5.
    - id: F-5
      text: >-
        BUDGET ACCOUNT. Declared batch budget 4720 s (opening decision).
        Actual: f5f96a ~6513 s (disclosed overrun, 4.3x the 1500 s
        declared, ruled at completion - the halt-rule breach is a
        procedural deviation, not a budget hiding); c91be2 54.179836 s
        (6.0% of its 900 s); 93cc38 55.156728 s (6.1% of its 900 s);
        reviews within their declared budgets. The campaign cumulative
        (batches 1-3) stands at ~10900 s wall against the 10800 s plan
        (+0.9%), a review-cost delta re-declared and recorded at the
        opening; batches 4-7 re-declare at their openings. Budget outcomes
        are not evidence about MD5 (SC-4).
    - id: F-6
      text: >-
        METHOD CEILING AND MD4 CONTROL. OPEN AND UNATTEMPTED. The
        calibration measured the instrument at ONE declared encoding
        (hex 512-bit blocks, full 128-bit digest equality, 2^21-block
        birthday enumeration, 40-bit-key table). It did not measure what
        class of instrument could close the ~2^64-block gap, at what
        cost, and the MD4 lower control (the cheaper digest in the same
        family, which would bound the method's cost from below) has not
        been run. The next batch (batch 4 of 7) opens with the MD4 run
        and the method-ceiling audit - NOT with further MD5 runs: the MD5
        side of the measurement is complete at this scope, and spending
        more MD5 budget before the ceiling is known would be polishing a
        logarithmic cofactor while the exponent question (which
        instrument class, at what asymptotic cost) stays open.

  knowledge_promotion:
