      ruling: '**UPHELD IN FULL AND EXTENDED.** Two instances in the prior (the trigger; the unbound cell-set quantifier in Q-1 and Q-5) and a THIRD this close adds: **P-B, THE FROZEN CONTRACT''S OWN PRE-REGISTRATION, IS ALSO BINARY AND CANNOT EXPRESS THE MEASURED STATE.** See `sealed_prior_scoring.part_1_trigger_ruling`.'
