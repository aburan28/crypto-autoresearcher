        IT SAYS SO PLAINLY **BECAUSE IT WAS INVITED TO FIND THE OPPOSITE AND THE INVITATION IS NOT
        EVIDENCE**. All three of its joints BREAK; the cut was argued on the OBJECT at batch.yaml
        `joint_count_note` rather than on the budget; and the argument is checkable and correct --
        round 3's object was a 60-ordered-pair graph, a five-class re-partition, a fifteen-subset
        lattice and a 36-cell matrix from five runs and thirteen artifacts, while this round's is one
        predicate, one family constructor and two cell tables from four runs.
      the_ruling_on_the_refusal: >-
        **THE REFUSAL IS ACCEPTED AND IS NOT UPGRADED.** A reviewer declining an invited finding is a
        stronger signal than one accepting it, and PB-8's own note said a round producing NO finding
        against the plan more likely means the attack surface was cut. THIS ROUND PRODUCED THREE AND
        REFUSED A FOURTH.
      the_half_that_IS_upheld_and_it_is_upgraded_rather_than_generalised: >-
        **UPHELD IN FULL, AND IN THE SHARPER FORM THE REVIEWER ASKS FOR.** The cut removed the region
        where the last two rounds' most valuable objects were actually found -- no dedicated
        generator-action joint is funded for a SECOND consecutive round, and round 3's RT-J5-3 was
        found INCIDENTALLY off another joint's floor item. **AND THAT REGION IS LOAD-BEARING FOR THIS
        ROUND SPECIFICALLY IN A WAY THE PLAN DOES NOT SAY**: the derivation-backed edge
        message_difference -> in_linearized_code, WHICH FORCES THE VERY CELLS THIS ROUND'S WHOLE
        COMPARISON TURNS ON, carries its own scope limit in committed source --
        `equivalence.act_E1_shift` and `act_E2_rotate` CARRY THE FLAG OVER RATHER THAN RECOMPUTING
        IT, so the derivation covers their images only because W3 is MEASURED on them rather than
        assumed. **THE ONE EDGE THE ROUND DEPENDS ON IS THE ONE WHOSE DERIVATION LEANS ON THE
        UNAUDITED REGION.** IT IS RECORDED AS A SECOND CONSECUTIVE UNAUDITED REGION CARRYING A
        FIRST-ORDER DEPENDENCY, AND NOT AS A GENERIC BREADTH COST.
    F-P2:
      finding: 'THE REVIEWER BUDGET IS DECLARED BELOW THE MEASURED RATE FOR A FIFTH CONSECUTIVE ROUND. "A figure that has been wrong in the same direction five times is not a budget, it is a ritual."'
      ruling: >-
        **UPHELD.** The reviewer also records that the plan's HANDLING is the best available --
        declared at the opening with a named drop order rather than discovered in the report, no
        ceiling raised, no ceiling reallocated -- and objects to the PATTERN and not the handling.
        THAT DISTINCTION IS ACCEPTED AND CARRIED. The calibration finding this close adds is that A
        PER-JOINT RATE IS NOT A CONSTANT OF THIS PROGRAM, measured at `budget_adjudication`.
    F-P3:
      finding: >-
        THE PLAN'S proves_too_much OBJECT O-Q4 IS UNDER-SPECIFIED AND WOULD HAVE PASSED THE PACKAGE
        ON A TECHNICALITY. As written -- drop in_linearized_code on sha1 only -- it receives the SAME
        adjudication surface as the honest instrument (four rows on sha1), because the contract's
        predicate never asks whether the instrument can SEE the deleted component; it asks only
        whether a DETERMINER remains, and message_difference remains. A reviewer that ran only the
        plan's object would have reported the control REFUSED and moved on. The object that actually
        fires drops a DETERMINER rather than a TARGET, and the plan did not distinguish the two.
      ruling: >-
        **UPHELD IN FULL AGAINST THIS COORDINATOR ROLE, AND IT IS THE MOST INSTRUCTIVE OF THE THREE.**
        THE PLAN'S OBJECT LIST WAS DECLARED A FLOOR AND THE REVIEWER TREATED IT AS ONE; HAD IT BEEN
        TREATED AS A CEILING, **THIS ROUND'S PRINCIPAL FINDING WOULD NOT EXIST**. It is the third
        consecutive round in which the plan's candidate list did not bound the pass, and it is the
        FIRST in which the plan's own object would have produced a **FALSE NEGATIVE**. THE SUCCESSOR
        RULE: A proves_too_much OBJECT MUST NAME WHETHER IT ABLATES A **DETERMINER** OR A **TARGET**,
        BECAUSE UNDER A DETERMINER-BASED PREDICATE ONLY THE FORMER CAN FIRE.
    F-5:
      finding: 'THE FROZEN CONTRACT DEFEATS ITS OWN VALUE-BLINDNESS. Its `objective` states the control "has been run EXACTLY ONCE ... returning 1 of 30 (RT-J8-4)", H-13 repeats the denominator of 30, and the contract is required reading for the producer, for BOTH reviewers and for any re-deriver. So BR-5''s blinded quantity is stated in the one document nobody in this round could avoid reading.'
      ruling: >-
        **UPHELD IN FULL AGAINST THIS COORDINATOR ROLE.** It is not a criticism of anyone's honesty;
        it is a STRUCTURAL FACT THAT BOUNDS WHAT THE ROUND'S AGREEMENT IS WORTH, and it is why the
        independence label is `INDEPENDENT RE-IMPLEMENTATION, VALUE-INFORMED`. THE SUCCESSOR FIX IS
        NAMED AND IS CHEAP: A FUTURE CONTRACT OF THIS SHAPE STATES THE PREDECESSOR'S INTEGER IN THE
        **DECISION** AND **EVIDENCE** RECORDS THAT H-1 REQUIRES BE READ FOR CONTEXT, AND **NOT** IN
        THE FROZEN CONTRACT THAT ALSO DEFINES THE MEASUREMENT -- OR, IF IT MUST APPEAR THERE,
        DECLARES THE VALUE-BLINDNESS FORFEIT AT THE OPENING INSTEAD OF DISCOVERING IT AT THE REVIEW.
