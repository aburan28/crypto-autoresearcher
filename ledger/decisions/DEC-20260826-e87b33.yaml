  # ===================================================================
  # 5. THE SEALED PRIOR, BOTH PARTS, SCORED ITEM BY ITEM.
  # ===================================================================
  sealed_prior_scoring:
    the_use_rule_applied_verbatim: >-
      THIS PRIOR IS NEVER EVIDENCE. Where a party's finding AGREES with it, the agreement is
      DISCOUNTED to the extent that party could have read it, AND THE DISCOUNT IS STATED AT THE
      POINT OF USE. Where a finding CONTRADICTS it, THE FINDING WINS and the item is recorded as
      OVERTURNED. An overturned item is a FIRST-CLASS FINDING and never absorbed into a summary.
      EVERY ITEM OF BOTH PARTS IS SCORED BELOW, AND NONE IS DROPPED.
    the_contamination_discount_that_applies_to_every_producer_side_confirmation: >-
      THE PRODUCER'S NON-READING OF THE SEALED-PRIORS PREFIX IS MECHANICALLY ENFORCED IN-PROCESS
      AND ATTESTED FOR THE SESSION: independence-attestation.json records the prefix among the audit
      hook's three blocked prefixes with blocked_open_attempts_recorded = [] and reads_by_every_route
      = 0, and both reviewers attest `read_sealed_prior: false`, one of them inside a mechanically
      tested leak set. SO THE DISCOUNT IS THE SMALLEST OF ANY ROUND OF THIS GOAL -- AND IT IS NOT
      ZERO, because the session-level boolean is exactly the thing no tool in this repository can
      check. A SEPARATE AND LARGER DISCOUNT APPLIES WHERE AN ITEM WAS **DESIGNED AROUND**, meaning
      the mechanism it names was also written into the frozen contract this same role approved; that
      discount is independent of contamination and is the binding one on Q-1.

    part_1_trigger_ruling:
      the_trigger_as_part_1_wrote_it: '"BOTH ARMS RETURNING NULL: the re-admitted count comes back 0 under an implementation that passes CTL-FORCE-PI, AND the consistent-pair family is not constructible."'
      did_it_fire: 'NO, AND PART 2''s EVALUATION OF THAT IS UPHELD IN FULL.'
      why: >-
        NEITHER CONJUNCT IS SATISFIED AS WRITTEN AND BOTH CAME BACK **SPLIT** RATHER THAN NULL. Arm
        (a)'s count is 1 on the O-E-selected cell sets and 0 on the honest-selected ones, so the
        antecedent is true on one cell set and false on the other. "An implementation that passes
        CTL-FORCE-PI" is itself READING-DEPENDENT: side A is MET under `edge_or_vacuous` and NOT MET
        under `edge_only`. And arm (b) is constructible on SHA-1 and not on MD5.
      part_2s_own_conduct_ruled_on_and_it_is_the_opposite_of_round_3s_departure: >-
        PART 2 DECLARED THE TRIGGER UNFIRED AND THEREFORE **DECLINED TO REACH FOR THE TRIGGER'S
        PRE-AUTHORISED ESCAPES** -- Q-4 REFUTED, Q-5 VOID, Q-6 CONFIRMED IN ITS STRONGEST FORM --
        stating that helping itself to both branches would be the defect. THAT IS CORRECT AND IS
        UPHELD. Round 3's addendum departed from its own trigger rule and the close had to rule on
        the departure; THIS ROUND'S ADDENDUM HONOURED THE RULE IT INHERITED, and only commitment (1)
        -- Q-1, Q-2, Q-3, Q-7 and Q-8 scored individually in every case -- was operative. Q-5 IS
        THEREFORE SCORED ON ITS OWN FALSIFIER AND IS NOT VOID, AND Q-6 IS ARGUED ON THE EVIDENCE AND
        NOT AUTO-CONFIRMED.
      part_2s_finding_against_part_1s_own_trigger_design_ruled_on: >-
        **UPHELD IN FULL, AGAINST THIS COORDINATOR ROLE, AND EXTENDED.** Part 2 found that the
        trigger was written as a STRICT CONJUNCTION OF TWO BINARY OUTCOMES while both arms came back
        SPLIT -- split by cell set on arm (a), split by reading on CTL-FORCE-PI, split by primitive
        on arm (b) -- so a trigger that can only see NULL-versus-NONNULL cannot see the state the
        round is actually in, and part 1's congratulation of itself for stating a trigger in advance
        is worth less than it claimed. PART 2 FOUND TWO INSTANCES OF THE DEFECT IN THE PRIOR (the
        trigger, and the unbound cell-set quantifier in Q-1 and Q-5). **THIS CLOSE ADDS A THIRD,
        WHICH PART 2 COULD NOT SEE BECAUSE IT WAS SCORING THE PRIOR AND NOT THE CONTRACT: P-B, THE
        FROZEN CONTRACT'S OWN PRE-REGISTRATION, IS ALSO BINARY** -- `outcome_zero` against
        `outcome_nonzero` -- AND CANNOT EXPRESS "0 UNDER ONE SELECTOR AND 1 UNDER THE OTHER FROM ONE
        INSTRUMENT PAIR". THE SUCCESSOR RULE, BINDING ON THE NEXT OPENING: WRITE TRIGGERS AND
        PRE-REGISTRATIONS OVER PER-CELL-SET, PER-READING AND PER-PRIMITIVE OUTCOMES, OR DO NOT WRITE
        THEM AT ALL.

    part_1_items:
      Q-1:
        confidence_declared: STRONG
        verdict: HALF-CONFIRMED BY UNDERSPECIFICATION
        the_integers_that_settle_it: 'differing_cell_count = 1 on all four O-E-selected blocks, with the single entry {family d_message_difference, row_deletes in_linearized_code, primitive_scope sha1, honest NOT DETECTED, O_E DETECTED} -- the cell, the verdict pair AND the direction exactly as predicted. AND differing_cell_count = 0 on both honest-selected blocks.'
        the_defect_in_the_item_and_it_is_this_roles: >-
          **Q-1 DID NOT SAY WHICH CELL SET, AND THE ANSWER IS CELL-SET-DEPENDENT.** The item is
          CONFIRMED on the O-E-selected set and FALSE on the honest-selected one, and it reads as
          confirmed only because the reader is free to pick the set that confirms it. R4-J4
          STRENGTHENS THIS RATHER THAN SOFTENING IT: the cell-set dependence is not a bookkeeping
          ambiguity, it is THE ROUND'S PRINCIPAL FINDING. Part 2 scored it HALF-CONFIRMED-BY-
          UNDERSPECIFICATION and that score is adopted unchanged.
        weight_after_discount: >-
          NEAR ZERO, AND THE BINDING DISCOUNT IS NOT CONTAMINATION. DESIGNED-AROUND, HEAVILY: the
          mechanism Q-1 cited -- E4, plus O-E's per-primitive blindness removing the determiner -- IS
          THE MECHANISM THE FROZEN CONTRACT'S FORCING PREDICATE ENCODES, AND THAT CONTRACT IS THIS
          ROLE'S. A PREDICTION THAT A RULE I WROTE WILL DO WHAT I WROTE IT TO DO IS CLOSE TO A
          TAUTOLOGY.
        the_most_valuable_outcome_part_1_named_and_whether_it_happened: >-
          IT HAPPENED, AND PART 1 NAMED THE RIGHT **KIND** OF SURPRISE AND THE WRONG **INSTANCE**.
          `what_would_make_me_wrong_in_an_interesting_way` named exactly one thing: A SECOND
          ADMISSIBLE READING OF THE FORCING PREDICATE giving different forced sets. Part 1 guessed
          the composition-order ambiguity; THE ORDERS WERE MEASURED BOTH WAYS AND AGREE ON EVERY
          QUANTITY, and the actual gap is the absent-component case. AND THE ROUND WENT ONE FURTHER
          THAN PART 2 COULD SEE: THERE IS A **THIRD** READING, BUILT AND RUN, AND THE TWO-READING
          FRAMING IS ITSELF FALSE. Credit for the kind; none for the instance.
      Q-2:
        confidence_declared: 'MODERATE, AND DELIBERATELY NOT STRONG'
        verdict: CONFIRMED
        the_integers_that_settle_it: 'differing_cell_count = 1 on every O-E-selected arm-(a) cell set and 0 on every honest-selected one. It is never 2 or more anywhere in arm (a).'
        risk_it_actually_ran: >-
          MODERATE AND GENUINE. A count of 2 or more was arithmetically available -- the O-E cell set
          adjudicates MORE cells than the honest one, and any second edge whose determiner O-E
