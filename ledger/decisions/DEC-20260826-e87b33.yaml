  the_headline_ruling:
    both_halves_are_true_at_once_and_neither_is_softened: true
    half_1_the_arithmetic_reproduces: >-
      EVERY INTEGER ARM (a) REPORTS IS WHAT TWO INDEPENDENTLY AUTHORED IMPLEMENTATIONS OF THE
      WRITTEN RULE PRODUCE. Six of six emitted documents reproduce in a fresh process from the
      eight declared seeds and five are byte-identical; the frozen-identity criterion set recomputes
      15 of 15 unchanged; the run index binds 28 of 28 run files and 8 of 8 task artifacts; 30 of 31
      snapshot digests verify. ALL THREE OF THE VALIDATOR'S JOINTS HOLD. NOTHING IN THIS DECISION
      FINDS AN ERROR IN THE PRODUCER'S ARITHMETIC AND NO PART OF IT MAY BE READ AS DOING SO.
    half_2_the_quantity_does_not_mean_what_the_campaign_took_it_to_mean: >-
      THE REPORTED QUANTITY IS A PROPERTY OF THE SELECTOR, NOT OF THE INSTRUMENT PAIR. ONE PAIR,
      ONE SET OF VERDICTS, TWO INTEGERS: 0 when the honest instrument's forcing predicate chooses
      the domain, 1 when O-E's does. The mechanism is a MONOTONICITY derived from the contract's own
      predicate -- removing a component from a projection can only remove determiners, so it can
      only shrink the forced set and can only grow the adjudicated set -- and the differing cell is
      FORCED for the honest instrument under every reading, so THE COUNT IS 1 ONLY WHEN THE BLIND
      INSTRUMENT SELECTS.
    verified_by_this_close_and_not_taken_from_the_reviewer_that_ruled_it: >-
      THE TWO INTEGERS ARE IN THE **VALIDATOR'S** OWN INDEPENDENT TABLE -- 0 of 21 and 0 of 18 with
      the honest selector, 1 of 24 and 1 of 21 with O-E's -- PRODUCED BY A SESSION THAT EXPLICITLY
      DECLINED TO RULE ON THE QUESTION BECAUSE IT BELONGED TO ITS SIBLING'S JOINT. THE FINDING IS
      THEREFORE ARITHMETICALLY VISIBLE IN THE BLIND REVIEWER'S OWN NUMBERS AND IS NOT AN ARTEFACT
      OF THE RULING SESSION'S FRAMING. The Validator went as far as its joint allowed and stopped
      exactly there, which is the joint boundary working as designed.
    the_null_object_and_the_artifact_tell: >-
      THE PARAMETER THAT SHOULD DESTROY A REAL SIGNAL IS THE INSTRUMENT'S INFORMATIVENESS: AN
      INSTRUMENT THAT IDENTIFIES LESS SHOULD ADJUDICATE NO MORE. The null object projects away every
      component but `primitive` and identifies LITERALLY NOTHING; its forced set is EMPTY on both
      primitives and it receives SIX ADJUDICATED ROWS PER PRIMITIVE, MORE THAN THE HONEST
      INSTRUMENT'S FOUR ON SHA-1 AND FIVE ON MD5. A second object, blind only to step_delta,
      receives SIX on md5 against the honest instrument's FIVE. THE QUANTITY DOES NOT DECAY AS
      INFORMATIVENESS FALLS; IT GROWS. THAT IS THE CANONICAL ARTIFACT TELL OF
      docs/inventor-protocol.md, "controls before belief", MEASURED RATHER THAN ASSERTED, AND THIS
      CLOSE UPHOLDS IT IN FULL.
    how_the_two_halves_compose_stated_exactly: >-
      THEY ARE NOT IN TENSION. A MEASUREMENT CAN BE PERFECTLY REPRODUCIBLE AND STILL MEASURE
      SOMETHING OTHER THAN ITS NAME. The producer computed correctly what the contract asked for;
      THE CONTRACT ASKED FOR A QUANTITY WHOSE DOMAIN IS CHOSEN BY ONE OF THE OBJECTS BEING COMPARED.
      THAT IS THIS COORDINATOR ROLE'S DEFECT AND NOT THE PRODUCER'S, and the remedy is a term in the
      successor contract plus a versioned protocol_amendment, NOT a correction against
      TASK-20260826-82c660.
    the_renaming_which_is_the_whole_fix_and_is_free: >-
      THE QUANTITY IS NOT `the differing-cell count between honest and O-E`, WHICH NAMES THE PAIR
      AND NOT THE SELECTOR. IT IS `the number of cells whose verdict O-E changes among the cells
      O-E's own blindness re-admits`. NO RECORD OF THIS CAMPAIGN MAY REPORT THE QUANTITY WITHOUT
      NAMING ITS SELECTOR.
    the_md5_half_is_a_CONTROLLED_NULL_reported_only_inside_an_aggregate: >-
      O-E IS THE IDENTITY FUNCTION ON MD5. The honest instrument and the known-false instrument ARE
      THE SAME FUNCTION THERE, so EVERY MD5 DIFFERING COUNT IS 0 BY CONSTRUCTION, on every cell,
      under every reading, for every family, forever. 12 OF THE 24 CELLS IN THE `edge_only`
      AGGREGATE DENOMINATOR AND 9 OF THE 21 IN THE `edge_or_vacuous` ONE THEREFORE CANNOT PRODUCE A
      DIFFERING VERDICT FOR ANY REASON WHATSOEVER. No per-primitive differing count is emitted
      anywhere in readmitted-cells-result.json; `differing_cell_count` appears eight times and is an
      aggregate every time. THE CORRECT READING, WHICH NO RECORD OF THIS BATCH PREVIOUSLY STATED
      AND WHICH IS STATED HERE: THE PARAMETER THAT SHOULD DESTROY THE SIGNAL IS THE DIFFERENCE
      BETWEEN THE TWO INSTRUMENTS; ON MD5 THAT DIFFERENCE IS EXACTLY ZERO AND THE MEASUREMENT
      RETURNS EXACTLY ZERO -- A MATCHING RESULT AGAINST A NULL OBJECT, HENCE A CONTROLLED NULL AND
      NEVER A FINDING. A row reading `md5: 0 differing` is a fact about a projection returning its
      argument AND IS NOT A FACT ABOUT MD5.
    what_no_record_of_this_campaign_may_state_under_this_ruling:
      - 'That CTL-FORCE-PI''s known answer was met SIMPLICITER, without naming the reading and the granularity under which it was met.'
      - 'That the differing-cell count characterises the pair of instruments.'
      - 'That the md5 count of 0 is a measurement rather than a controlled null.'
      - 'That the composition-order agreement or the reading agreement shows the quantifier is right -- the contract''s own CTL-FORCE-PI note forbids that in terms.'
      - 'Anything whatever about MD5 or SHA-1.'
    what_a_record_MAY_state_under_this_ruling: >-
      That the per-instrument forcing rule, under the reading the contract's own text gives, reduces
