    status_all: OPEN
    note: No claim from this batch may move beyond `analyzed`.

  structural_ruling: >-
    (1) THE PRE-SCREEN IS NOT SOUND AS WRITTEN AND MUST BE REFORMED, NOT ABANDONED,
    before either producer applies it again: rename it a LAYER-DEPENDENCE screen;
    adopt TASK-20260801-807's interface-counting rule (for round-independent pi the
    graph walk is over the invariance group, not over cipher interfaces, so its
    interface constant is 1) campaign-wide; add a DEFERRED_UNBOUNDED verdict value,
    kept OUT of any count of candidates the screen has RULED vacuous, for the "no
    upper bound exhibited" case RT-9 identifies; state explicitly that n = 1 is NOT
    a tractability licence and requires a separate tractability judgement; and
    restate the ~7-interface threshold against the quantity it actually bounds
    (available cipher interfaces), not the argument's iteration count, per RT-10.
    (2) CAND-806-A's bounded-index-subgroup residual RE-ENTERS THE CANDIDATE POOL:
    it was screened out at n = 30 under a rule its sibling screen shows gives n = 1,
    it is the only route this campaign has identified to OD-4's hoped-for
    inequality, and it is explicitly open and unattempted. (3) PROPOSITION 806-1
    MAY NOT BE CARRIED BEYOND ONE INTERFACE: both horns of RT-3 destroy the n-axis
    (no nonlinear layer, in which case Phi^n saturates at RT-2's ceiling and is not
    J^n; or a nonlinear layer is present, in which case the proposition's proof no
    longer applies past interface 1), neither horn is stated in the package, and
    section 5's cost table is STRUCK AS UNUSABLE pending CTRL-810-A, the settling
    control the red team specified (saturating frontier census under both
    composition models, GF(2^4) exhaustive plus a named GF(2^8) witness list
    including ker(M+I) = span(1,1,1,1)).

  limitations:
    - >-
      NO cryptanalytic result and NO claim about AES of any kind, at any round
      count, is asserted by this decision. No distinguisher, no key recovery, no
      speedup, no structural excess, no barrier statement. Zero cryptanalytic
      compute was spent on AES itself in BATCH-004, the fourth consecutive batch
      of which this is true.
    - >-
      RT-1, RT-2 and RT-3 are SINGLE-SESSION results reproduced by no second party.
      RT-1 is a witness, not an established minimum (a kernel with J < 2^24 is
      UNRESOLVED). RT-2 is a dimension count, not a measurement; the direct
      composition that would settle it (CTRL-810-A) was not run at any scale. RT-3
      is an omission, not a demonstrated falsehood, and which of its two horns
      holds is UNRESOLVED.
    - >-
      NO_ADMISSIBLE_MEMBER for OD-3 is CONDITIONAL ON UNVERIFIABLE RECOLLECTIONS
      for six of its eight rejections (D-809-6) and must never be transcribed
      downstream as an established non-existence result. Only OBJ-807-1 and
      OBJ-807-2 are rejected on structure alone.
    - >-
      CROSS-MODEL INDEPENDENCE IS UNAVAILABLE THROUGHOUT. Under
      inference-amendment 0137a051 both producers, the validator, the red team and
      this Coordinator resolve to the same model. Every agreement recorded in
      EV-AES-004 and in this decision is CORRELATED confirmation. NO ATTESTATION IS
      RECORDED anywhere in this batch or by this decision, and `completed` remains
      unreachable for GOAL-AES-001 under AGENTS.md rule 8 regardless of outcome.
    - >-
      The campaign's declared budget ceiling (campaign_budget.total_wall_clock_
      seconds: 34500 in the live goal record) is NOT independently re-verified by
      this decision: its cited authorizing decision, DEC-20260731-030, is on
      inspection a GOAL-ECDLP-001 record (see known_id_collision_audit above) and
      does not authorize any GOAL-AES-001 budget act. This decision spends nothing
      against that ceiling and does not rule on whether it is genuinely 34500 or
      the earlier 20000; that question is left open and flagged, not resolved.
    - >-
      PROP-701-I and Proposition 801-1 stand exactly as written and are untouched
      by this decision. The scoped closure of the round-independent single-word
      deterministic class remains WITHHELD (V-804-1 undischarged for the third
      consecutive batch this decision does not change).
    - >-
      Every literature statement anywhere in this batch is UNVERIFIED-FROM-MEMORY.
      No literature comparison, sota_delta, bit-margin or extrapolation is made
      here.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Five concrete grounds. (i) The trigger for a KN-FIND is a `support` or
      `reject_scoped` decision on `replicated`/`strong` evidence; this decision is
      `revise`, and no hypothesis exists for either verb to attach to. (ii) The
      batch's strongest derivation, Proposition 806-1, carries a KNOWN-INCOMPLETE
      hypothesis list — the unrestricted state quantifier (U-809-1) which this
      batch's OWN other producer measured is restrictable — so promoting it now
      would put a result with a known, unnumbered gap into the corpus. (iii) The
      one item that IS a genuine proven boundary — the trivial-ceiling obstruction
      and the yield reframing, independently re-verified AND attacked by the red
      team without being broken — is the strongest candidate for a future KN-FIND
      but is not yet separable from a framing carrying D-809-3 (universal phrasing
      one notch too strong) and D-809-4 (must never be transcribed as "a cost
      inequality was obtained"); it is DEFERRED, not declined. (iv) RT-13's gate-4
      finding is a standing campaign-wide limitation, not new knowledge about AES,
      and belongs with the protocol amendment that eventually acts on it. (v)
      Nothing in this batch concerns AES itself. WHAT WOULD WARRANT PROMOTION: a
      future batch numbers the state-quantifier dependence with a paired
      validation experiment, runs CTRL-810-A so the composition class is stated,
      and the trivial-ceiling boundary survives both, separated from its current
      overstated framing.

