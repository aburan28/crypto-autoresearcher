  rationale:
    - >-
      PROPOSITION 806-1 FOLLOWS AND WAS INDEPENDENTLY RE-DERIVED. The validator
      worked all four lemmas and the Assembly from its own arithmetic (not the
      producer's code) and reproduced the minimum exhaustively over 78899 GF(2^4)
      subspaces and 527 GF(2^2) subspaces, both matching the producer's counts
      exactly. B = q^(s - dim(W_S cap K)) hence B >= q = 256, independent of L,
      tight at L = 8/16/24 (EV-AES-004 A-4, strength_scoping A1).
    - >-
      OD-4 AS POSED IS ANSWERED NO AT THE INVENTOR-PROTOCOL SECTION 4 CLOSURE
      STANDARD. The breaking step (Step 2's first sentence: an induction whose
      conclusion type equals its hypothesis type, so B-confinement under B > 1 does
      not typecheck) was independently re-derived by the validator, who confirms it
      is the RIGHT step (EV-AES-004 A-2, A-3). Two further independent failures
      (Step 2's union over different confining sets; Step 3's non-transitivity) are
      also confirmed.
    - >-
      THE TRIVIAL-CEILING OBSTRUCTION (B <= |X| = 2^(32-L)) IS THE ONE CLOSURE THE
      RED TEAM ATTACKED AND COULD NOT WALK PAST. It reports the core inequality as
      an identity of the definition, not a modelling step, so no object class
      evades it and OD-4's hoped-for inequality shape cannot exist; the campaign
      must re-pose the question in the yield Y = log2|X| - log2 B (EV-AES-004 A-7,
      A-8; redteam_findings.yaml attempt_to_break_the_negative_closure).
    - >-
      PROPOSITION 806-1 CARRIES AN UNNUMBERED CONDITIONAL DEPENDENCE ON THE
      UNRESTRICTED STATE QUANTIFIER (U-809-1, MEDIUM), and the SAME BATCH'S OTHER
      PRODUCER MEASURED, IN THE SAME BATCH, that the restriction bites on exactly
      the freedom the bound's proof consumes (12.5% of admissible configurations
      collapse the sweep to reach 1). Whether the bound survives a restricted state
      quantifier is UNRESOLVED, not settled favorably (EV-AES-004 A-6,
      unresolved_confounds).
    - >-
      THE FIRST RED-TEAM PASS VOIDED THE ONLY COST MODEL THE CAMPAIGN HAD, ON THE
      MERITS, NOT ON PROCESS. RT-1 (MAJOR, demonstrated): re-running the producer's
      own unmodified code on an eigenvector-structured input (not the
      support-structured inputs the producer tried) finds a GF(2^8) kernel with
      joint branching J = 2^24, strictly below the table's central-column value of
      2^32 — CONFIRMS rather than falsifies HEUR-806-1, but the producer's six
      witnesses missed it. RT-2 (MAJOR, demonstrated): every n >= 2 entry of that
      column exceeds its own object's frontier ceiling q^(4(4-dim K)), so the
      2^128-at-n=4 barrier reading and the 2^112 MITM entry at n=7 are BOTH ABOVE
      the largest attainable ceiling (2^96) and are not attainable frontier sizes.
      RT-3 (MAJOR, demonstrated omission, a SECOND and DISTINCT unnumbered
      conditional dependence from the validator's U-809-1): the nonlinear layer
      between consecutive super-box interfaces is nowhere modelled, and on one horn
      of that omission Proposition 806-1 governs no interface after the first.
      Nothing in the table survives these three findings at any strength, in
      either direction (redteam_findings.yaml RT-1, RT-2, RT-3; r2_ruling).
    - >-
      THE PRE-SCREEN INSTRUMENT ITSELF IS SHOWN DEFECTIVE, AND THE DEFECT COST THE
      CAMPAIGN ITS BEST REMAINING EXPONENT-RELEVANT CANDIDATE. RT-8 (MAJOR,
      demonstrated): the two sibling pre-screens (TASK-806's and TASK-807's,
      frozen the same day under declared-identical language) assign interface
      constants n = 30 and n = 1 to the SAME structural situation — a
      round-independent pi traversing the (lambda,k) invariance-group graph — and
      807's rule is the correct one (its own question_c measures consecutive
      SUPER-BOX INTERFACES; for round-independent pi the graph is a walk over the
      invariance group, not over cipher interfaces). Under 807's own rule,
      CAND-806-A ("re-run Steps 1-3 with B-confinement, close under the group") and
      CAND-806-E should have been PURSUED, not killed at n = 30. CAND-806-A's
      remaining content — a bounded-index subgroup statement replacing Step 3's
      group closure — is precisely the route to OD-4's hoped-for inequality and is
      explicitly left open ("a genuine open question ... not answered here") and
      was never attempted by anyone (redteam_findings.yaml RT-8; r5_ruling).
    - >-
      RT-9 (MAJOR, demonstrated): the verdict label IN_SCOPE_VACUOUS was used on
      CAND-806-E and CAND-B4 to record "no upper bound exhibited" — a FATIGUE
      REPORT ABOUT THE PRODUCER'S SEARCH, per docs/inventor-protocol.md section 4's
      own language, not a NAMED OBSTRUCTION about the candidate. IN_SCOPE_VACUOUS
      is a predicate on the candidate; "I could not bound n in the time I had" is a
      predicate on the search. The screen recorded the second under the label of
      the first, and the resulting "3 of 7 killed" / "2 of 6 killed" counts mix a
      ruling with an abstention. This is a genuine verdict-vocabulary defect in the
      pre-screen, not a producer error (redteam_findings.yaml RT-9).
    - >-
      RT-13 (MAJOR, structural): promotion gate (4) is satisfiable in this harness
      only in its mechanical-reproducibility and session-independence halves; its
      independent-CONFIRMATION half is structurally unsatisfiable while producer,
      validator, red team and Coordinator all resolve to one model under
      inference-amendment 0137a051. A validator CONCUR plus a red-team CONCUR is
      ONE DRAW FROM A CORRELATED PAIR, not two, and no combination of the two
      review sessions run in this batch can repair that. What the two DID deliver
      is real at full value (model-free evidence-integrity confirmation; mechanical
      re-execution that CHANGED a headline number, RT-1; session-independent
      defect-finding; named adversarial coverage with nine unrun attacks
      enumerated honestly) — but none of it may be read as independent
      confirmation for any promotion, ever, while this harness's model resolution
      is unchanged (redteam_findings.yaml RT-13; EV-AES-004 promotion_gates_status
      gate_4).
    - >-
      NO GATE PACKAGE STANDS ON THE MERITS INDEPENDENTLY OF RT-13. Gate (1) stands
      for the proposition only and is degenerate for the cost model (p = 1 by
      construction, so the inverse-success factor does no work in the tabulated
      column). Gate (2) fails on THREE unnumbered conditional dependences found by
      two different reviewers (U-809-1, RT-3, RT-4) plus one unresolved (RT-5), one
      heuristic numbered in the direction the model does not use (RT-6), and one
      paired with a non-falsifying experiment (RT-7). Gate (3) fails because the
      central column is BEATEN by RT-1 and every n>=2 entry exceeds the object's
      own ceiling by RT-2, with no alternative baseline costed and peak memory
      unmeasured throughout.
    - >-
      NOTHING HERE IS A PRODUCER DEFECT. Both producers' pre-screens are FROZEN
      before work, honestly applied in both directions (validator's
      prescreen_audit_both_directions: CLEAN on no-vacuous-pursued and
      no-inflated-constant, in EACH screen's OWN rule), and TASK-20260801-807
      explicitly recorded the n=1/n=30 asymmetry as a contradiction rather than
      smoothing it over. RT-8's error traces to the SCREEN RULE, not to either
      producer, and independently to this Coordinator's own BATCH-003 forward
      guidance, which stated the interface rule in terms of the graph rather than
      layer-dependence (recorded as D-811-2 in EV-AES-004, Coordinator-side).

