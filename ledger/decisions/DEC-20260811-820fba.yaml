  decision: revise
  decision_vocabulary_note: >-
    `revise` because no hypothesis exists to `support`, `weaken` or `reject_scoped`
    (GOAL-AES-001 has never created one; EV-AES-004 binds to RQ-AES-001 for exactly
    this reason) and because the batch's own instrument — the mandatory pre-screen —
    is independently shown DEFECTIVE by two reviewers who found two DIFFERENT
    unnumbered conditional dependences (validator's U-809-1, red team's RT-3) plus a
    THIRD (red team's RT-4) and a mislabelled verdict class (RT-9) and a
    cross-screen inconsistency that wrongly killed the campaign's one remaining
    exponent-relevant candidate (RT-8). The batch is CLOSED as a batch — nothing is
    left running — but the instrument it used and the promotion pathway it relied on
    (gate 4) both require revision before the next batch may safely reuse them.
    `approve` is not used because nothing here authorizes further execution by
    itself; `pause` is not used because the goal is not paused (see recommendation
    below); `supersede` is not used because no record's content is replaced, only a
    dangling planning citation is corrected.

  decision_scope: >-
    Official disposition of BATCH-004 under GOAL-AES-001 / RQ-AES-001 only.
    NO cryptanalytic result and NO claim about AES at any round count is asserted,
    approved, or authorized by this decision — EV-AES-004's headline_non_result
    stands and is adopted verbatim. Proposition 806-1 (B >= q = 256 for the
    F-linear, round-independent, single-super-box-interface subclass) is a real,
    independently reproduced derivation FACT, scoped to exactly that subclass,
    that ONE interface, and the unrestricted state quantifier named in U-809-1;
    it may never be cited as a bound on OD-4, as a cost inequality, or beyond one
    interface (RT-3). OD-4 as literally posed is answered NO at the closure
    standard. OD-3 returns NO_ADMISSIBLE_MEMBER conditional on unverifiable
    recollections for six of eight rejections. Section 5's n-interface cost table
    is STRUCK as unusable in either direction pending CTRL-810-A. No knowledge
    promotion is made. No gate package stands; nothing moves beyond `analyzed`.

