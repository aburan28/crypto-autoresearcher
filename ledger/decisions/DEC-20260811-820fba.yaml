  asymptotic_promotion_gates:
    gate_1_proof_decomposition: not_met_for_cost_model_stands_for_proposition_only
    gate_2_numbered_heuristics: not_met
    gate_3_concrete_cost_table: not_met
    gate_4_independent_review_and_red_team: >-
      performed_but_not_satisfied; independent-confirmation half STRUCTURALLY
      UNSATISFIABLE under standing inference-amendment 0137a051 (RT-13); NOT
