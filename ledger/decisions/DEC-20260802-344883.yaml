coordinator_decision:
  id: DEC-20260802-344883
  decided_at: '2026-08-02'
  owner: coordinator
  goal_id: GOAL-HQC-001
  batch_id: BATCH-001
  decision: refine
  decided_by: coordinator
  target_ids: [GOAL-HQC-001, RQ-HQC-001, BATCH-001, EV-HQC-9906b9]
  target: GOAL-HQC-001
  target_note: >-
    The decision targets the GOAL and its BATCH, not an experiment. No EXP-*
    exists for this goal and none is created here.
  evidence_ids: [EV-HQC-9906b9]
  question_ids: [RQ-HQC-001]
  hypothesis_id: null
  hypothesis_status_change: none
  hypothesis_status_change_note: >-
    No hypothesis exists for GOAL-HQC-001. active_hypothesis_ids was empty
    before this decision and is empty after it.

  disposition: refine
  disposition_rationale: >-
    'refine' is the correct transition and the alternatives are wrong for
    specific reasons. Not 'support' or 'weaken': nothing about HQC was tested,
    so there is no direction to move. Not 'reject_scoped': no prediction was
    contradicted. Not 'inconclusive' as the batch's own disposition: the batch
    was not an attempt to discriminate explanations that failed - it did
    exactly what it set out to do and returned a usable object plus a list of
    defects. Not 'pause': the campaign has a concrete, cheap, unblocked next
    action and five of six batches of budget remain. The work needs REFINEMENT
    - one arithmetic correction, two Coordinator retractions, and a filing step
    - before it can carry anything.

  decisions:
    - id: D-1
      statement: >-
        RQ-HQC-001's experiment-design precondition is PARTLY discharged, not
        discharged. The constraint requires that primary sources be 'filed as
        KN-LIT entries'. ACQUISITION is discharged: the HQC specification
        (22/08/2025, 51 pp.) and arXiv:2005.10741 were obtained in full text,
        re-acquired byte-identical by an independent session, and the analytic
        DFR model is transcribed with 23 numbered assumptions. FILING IS NOT
        DISCHARGED - no KN-LIT entry exists.
      basis: EV-HQC-9906b9 O-1, O-2; defect D-4 (TASK-20260802-73a352 objection O8)
      correction_of: >-
        The TASK-20260802-1f2e40 snapshot receipt, which reported the
        precondition 'DISCHARGED' on a paraphrase. That receipt is immutable
        and is superseded on this point, not rewritten.
    - id: D-2
      statement: >-
        NO KN-LIT ENTRY IS FILED BY THIS BATCH, and filing is deliberately
        deferred to BATCH-002. Filing now would propagate defect D-1 of
        EV-HQC-9906b9 - the RS-S3 minimum distance recorded as 49 where both
        the MDS property (d = n - k + 1 = 59) and the transcribed delta = 29
        (2*29 + 1 = 59) force 59 - into the permanent corpus. The red team
        computes that error as worth 50.7 bits at NIST-5, i.e. it would
        manufacture a false finding that HQC-5 misses its DFR target by 46
        bits. A corpus entry is immutable once filed; an unfiled proposal is
        not.
      basis: EV-HQC-9906b9 D-1, independently reconfirmed by the Coordinator
    - id: D-3
      statement: >-
        TWO COORDINATOR CLAIMS ARE RETRACTED ON THE MERITS. (a)
        BATCH-001-OPENING.md section 4's claim that GOAL-HQC-001.next_action
        was 'already partly discharged' because IDEA-20260801-011 exists is
        WITHDRAWN: that proposal is one of 21 filed 2026-08-01, one per
        research question across the roster - a bulk sweep, not a
        /propose-ideas run for RQ-HQC-001. (b) The claim that the proposal is
        'not executable as specified' is DOWNGRADED to 'externally blocked':
        it was gated by RQ-HQC-001.constraints[0], not internally defective.
      basis: TASK-20260802-73a352 objections O4 and O5; Coordinator reconfirmed the count of 21
      what_survives: >-
        The DECISION not to run /propose-ideas in BATCH-001 stands, but on a
        DIFFERENT and narrower ground than the one recorded: not that ideation
        was already done, but that RQ-HQC-001.constraints[0] forbade experiment
        design until the sources were in hand, which at batch open they were
        not. The mechanism of supersession was right; the stated reason was
        not.
      what_the_coordinator_missed: >-
        The red team found the real named-rule violation section 4 did not: 20
        of the 21 swept proposals carry dominated_by: null with no frontier
        check, which docs/inventor-protocol.md requires. That is a Pareto-honesty
        defect across the whole 2026-08-01 sweep and is NOT this goal's to fix;
        it is recorded here so it is not lost.
      process_finding: >-
        This is the SECOND consecutive campaign in which a Coordinator
        'the goal's next_action is defective' claim was found to be an overread
        by its own red team (GOAL-HAWK-001 BATCH-001 is the first). The
        Coordinator named that precedent in the handoff and asked to be checked
        against it; the check worked. Repeating the error after naming it is
        itself the finding, and it is recorded rather than smoothed over.
    - id: D-4
      statement: >-
        THE 'EPRINT BLOCKER DID NOT REPRODUCE' CLAIM IS RETRACTED AS FALSE.
        eprint.iacr.org/2026/1498.pdf returns HTTP 403 while the HTML endpoint
        returns 200; GOAL-HAWK-001 BATCH-002 recorded exactly that split
        (pdf_endpoint BLOCKED, html_endpoint REACHABLE). The producer tested
        three HTML endpoints and never the PDF endpoint, so it never tested
        the claim it was said to contradict. THE HAWK FINDING STANDS
        UNREFUTED, and no inference about GOAL-HAWK-001's pause reasoning may
        be drawn from this batch.
      basis: TASK-20260802-73a352 objection O2; Coordinator independently reconfirmed both status codes
      correction_of: >-
        The TASK-20260802-1f2e40 snapshot receipt and that commit's message,
        both immutable and both superseded on this point rather than rewritten.
    - id: D-5
      statement: >-
        THE CSRC.NIST.GOV HALF STANDS AND HAS CROSS-GOAL CONSEQUENCES.
        csrc.nist.gov returned HTTP 200 with real content, and www.nist.gov
        also returns 200, against RQ-HQC-001.provenance's record that both are
        unreachable under this network policy via proxy CONNECT 403.
        RQ-HQC-001 is immutable and is superseded on this point, not edited.
        Consequence: a recorded source-access blocker in this program is
        STALE, and any goal resting on 'NIST is unreachable' should re-test
        before invoking it.
      basis: TASK-20260802-6344ed source_access_log.yaml; strengthened by TASK-20260802-73a352
    - id: D-6
      statement: >-
        ISD-FC-2026 IS NOT ADOPTED. The proposed convention is admitted as a
        reviewed working document only. Adoption is conditional on resolving
        the red team's O6 and O7: the mandatory F4 self-audit is
        under-determined by the convention's own rules (U2 and section 3(g)
        never pin N, and Wiener's form is F = Theta(T r m^{1/3}) at
        p = Theta(m^{2/3}/r)), the second stated justification for the
        cube-root memory-access model is circular, and the producer's
        self-nomination of U4b as the most abusable clause is rejected in
        favour of U3 plus section 9, which silently obliges this program to
        re-derive every baseline it compares against.
      basis: EV-HQC-9906b9 O-4, D-5
      note: >-
        The convention's scheme-independence gate DID hold under exhaustive
        integer enumeration, and its five charged/uncharged verdicts and
        falsification hooks are complete. It is a usable draft, not a binding
        convention, and GOAL-SDITH-001 must not bind to it in its current
        state.
    - id: D-7
      statement: >-
        THE CORPUS-PROVENANCE DEFECT IS RECORDED AS AN OPEN PROBLEM AND IS NOT
        ACTED ON HERE. 7457 of 7666 knowledge/literature entries carry
        citation_verified: read against an absent, never-tracked, non-gitignored
        downloads/ tree; 7421 cite a path inside it and 7477 carry a bulk-seed
        note. Promoted as KN-OPEN-3f7a21 with a concrete successor action.
        NO CORPUS RECORD IS DOWNGRADED BY THIS DECISION: that is a
        program-level act far outside GOAL-HQC-001's mandate, and performing
        it inside an HQC batch would be exactly the kind of scope creep this
        harness exists to prevent.
      basis: EV-HQC-9906b9 U-1; every headline number re-measured by the Coordinator
      framing_correction_carried: >-
        The Coordinator's description of the two producers' convergence as
        'the most consequential thing in this batch' is WITHDRAWN as a
        controlled null (red team O9): at 96.8% prevalence any two agents
        would hit it. The finding stands; the inference from convergence does
        not.

  knowledge_promotion:
    promoted: [KN-OPEN-3f7a21]
    not_warranted: >-
      PARTIAL PROMOTION, with the deferrals itemised in
      knowledge_promotion_detail below. KN-OPEN-3f7a21 is promoted. No KN-LIT
      and no KN-FIND is promoted: filing the literature entries is BLOCKED on
      correcting the RS-S3 minimum-distance error (D-2), and no KN-FIND is
      warranted because this program produced no internal result about HQC -
      it read a specification.
  knowledge_promotion_detail:
    promoted:
      - id: KN-OPEN-3f7a21
        type: open_problem
        why: >-
          An unexpected observation that AGENTS.md rule 8 forbids discarding,
          independently measured three times, affecting every future novelty
          screen this program runs. The red team's objection O9 found the
          finding real but noted it had NO SUCCESSOR TASK; an open-problem
          entry with a concrete successor is the cheapest fix.
    not_promoted:
      - what: KN-LIT entries for the HQC specification, arXiv:2005.10741, and eprint 2026/461
        reason: >-
          not_warranted_yet - see D-2. Filing is blocked on correcting the
          RS-S3 minimum distance (49 -> 59) and on the D-6 one-line citation
          fix for the over-cautious EXTRACTION-DAMAGED marker. Both are
          BATCH-002's first action. This is a deferral with a named blocker
          and a named successor, not a decision that the entries are
          unwarranted.
      - what: An upgrade to KN-LIT-2141 (Guo-Johansson)
        reason: >-
          not_warranted - the paper was NOT read in full (paywalled, no open
          version located), so no upgrade to citation_verified: read is
          supportable on this batch's work. The bibliographic corrections are
          real but are entangled with the D-7 corpus question and should not be
          applied piecemeal to one record while 7457 others sit in the same
          state.
      - what: A KN-FIND for the DFR model
        reason: >-
          not_warranted - this program produced no internal result about HQC.
          It READ a specification. A literature entry never becomes a finding
          (knowledge/SEEDING.md), and the nine-way arithmetic agreement in
          EV-HQC-9906b9 O-3 is a TRANSCRIPTION-FIDELITY CONTROL, not a
          reproduction of a result.
      - what: A KN-TECH for ISD-FC-2026
        reason: not_warranted - see D-6; the convention is not adopted.

  promotion_gates_status: >-
    NONE OF THE FOUR ASYMPTOTIC-CLAIM GATES ARE ADDRESSED, because BATCH-001
    ADVANCES NO ASYMPTOTIC-COMPLEXITY CLAIM OF THIS PROGRAM'S OWN. It read
    other people's work and drafted an accounting convention. Stated explicitly
    so this batch cannot be misread as gate progress.

  claim_tier_effect: none
  claim_tier_effect_note: >-
    The toy ceiling declared by RQ-HQC-001 is untouched. No statement about
    HQC's standardized parameter sets is made or implied by this decision.

  closure_quorum_admissibility: NOT_ADMISSIBLE
  closure_quorum_note: >-
    Both reviews were independent SESSIONS but not independent MODELS: no
    policy alias in orchestration/model-policies.yaml resolves under this
    Claude Code harness, so validator and red team both resolved to
    claude-opus-5 with fallback_used true. AGENTS.md rule 13 requires pairwise
    distinct resolved_model_id. NO ATTESTATION IS RECORDED BY THIS DECISION AND
    NONE MAY LATER BE SYNTHESIZED FROM THESE REVIEWS.

  next_action: >-
    Open BATCH-002 and correct before filing. In order: (1) fix the RS-S3
    minimum distance 49 -> 59 by superseding correction, with the MDS and
    delta = 29 derivations recorded, and apply the D-6 citation fix; (2) file
    the corrected KN-LIT entries, which is the step that actually discharges
    RQ-HQC-001's precondition and unblocks experiment design; (3) then, and
    only then, design the DFR measurement experiment against the transcribed
    model, using assumption A17 - the unstated i.i.d. inner-decoder assumption
    that the red team identified as unproved in EITHER source - as the primary
    target, since a load-bearing assumption that neither the specification nor
    HQC-RMRS proves is the highest-value falsification surface this batch
    found.

  audit:
    considered_and_not_taken:
      - option: Mark the goal paused on the source gate
        why_not: >-
          The gate did not fire. Sources were obtained; pause_conditions[1] is
          not met and invoking it would be false.
      - option: File the KN-LIT entries now and correct later
        why_not: >-
          A corpus entry is immutable once filed. Filing a known 50.7-bit error
          and superseding it afterwards is strictly worse than filing correctly
          one batch later.
      - option: Adopt ISD-FC-2026 so GOAL-SDITH-001 can bind to it
        why_not: >-
          Two unresolved red-team objections go to whether the convention's own
          mandatory self-audit is even well defined. Adopting it to unblock
          another goal would propagate the defect to both.
      - option: Downgrade the 7457 read-tier corpus records
        why_not: >-
          Outside this goal's mandate and not a decision an HQC batch should
          make. Recorded as an open problem with a successor instead.
      - option: Suppress or soften the two Coordinator retractions
        why_not: >-
          They are the most useful output of the review chain. AGENTS.md rule 9
          and the research-direction integrity requirement both make recording
          them mandatory.
  inference:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: claude-opus-5
    fallback_used: true
    model_verified: false
