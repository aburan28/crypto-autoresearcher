  rationale:
  - The failed producer and all eight artifacts are archived under ac21aa38b782e894f58a5914214a1bd67837cfdf.
    The first complete suite retained313passes/7checker failures.
  - Repository ancestry and scalar-body indentation are mechanical checker defects. Repairing and rerunning
    the same full fixed suite is ranked ahead of a fresh algorithm implementation or proposal.
  - The old report described a pending suite and used the checkout base as implementation_commit. The successor
    will state the actual outcome with acyclic report/receipt hashes and complete outer terminal custody.
  - Standing authorization covers this exact zero-science successor. This does not reset the historical task
    allowance or validate the kernel independently.
  approved_correction_boundaries:
  - Copy the exact eight-file failed source package at ac21aa38b782e894f58a5914214a1bd67837cfdf into the new
    task path. Preserve table.py,bsgs.py,rho-corrected.py byte-identically. Preserve all original artifacts
    and the320case313pass7failure receipt.
  - Repair only checker repository ancestry HERE.parents[4] to HERE.parents[3], and use the already-indented
    nested scalar span directly rather than adding another indentation layer. Update task IDs,source binding
    hashes,receipt paths and source metadata for the new artifact set. Preserve all320fixed cases,their names
    and expected outcomes.
  - Prevent Python bytecode writes using -B and PYTHONDONTWRITEBYTECODE=1 for both parent and worker. Keep
    worker telemetry and exact terminal process receipt. The outer invocation must also retain complete exec
    result or terminal poll,command,UTC,exit and stdout/stderr; do not infer outer status from an unset shell
    variable.
  - 'Keep receipt source hashes acyclic: bind the three unchanged kernels,the corrected checker and solver-source-bindings,
    but do not bind a report that is populated after the receipt. The final report binds the actual receipt
    and states its observed result. Set implementation_commit:null pending snapshot and separately name the
    actual source baseline/authority/claim.'
  - At most640TOTAL fixed case executions under this successor, including every failure and rerun. One unchanged320case
    complete suite is planned; reserve a second only for a concrete checker failure.10s/case1800aggregate executed-check
    wall/CPU,one worker2GiB. Original320cases are retained as history and never relabelled as this task.
  - No kernel/algorithm/contract change,scientific curve,fixture,actual rho solve,manifest generation,process
    guard,Docker,signature,key,RUN or experiment pipeline. Existing fixed synthetic group and source cases
    only. No independent-review or scientific claim from this producer correction.
