  recorded_at: '2026-09-01'

  decision: revise
  decision_label: >-
    idea436_gate_erratum_round_split_again_disposition_not_recordable_one_bounded_zero_compute_correction_with_a_threshold_sensitivity_recensus_idea436_stays_frozen

  target_ids:
