  authoring_task: TASK-20260901-83ce35
  authoring_role: coordinator

  context: >-
    DEC-20260831-a9716f commissioned a superseding erratum for the
    ECDLP-IDEA-436 GGM-simulability gate memo, specifying six blocking repairs
    and nine lower-severity items. The idea-generator produced it under
    TASK-20260831-0e7ce6 at zero runs, and the Coordinator snapshot-archived the
    producer bytes ALONE under TASK-20260831-95b530 at commit 3cf1ccf68 before
    any reviewer read them. A review plan with a pre-recorded Coordinator prior
    was committed at 484699b93 BEFORE either reviewer session launched. Two
    fresh, concurrent, mutually blinded sessions then reviewed it at
    review-adversarial and xhigh effort, one joint each: TASK-20260901-a8e281,
    validator, joint J1, verdict HOLDS; TASK-20260901-8def30, red team, joint
    J2, verdict BREAKS. This decision composes those two reports, disposes the
    round, and states exactly one next action for the lane. The composed
    evidence is EV-ECDLP-e6f5f2, archived in the same ledger archive as this
    decision.

  what_this_decision_disposes:
    the_disposition_in_one_line: >-
      SPLIT. The repairs were performed and the load-bearing mathematics holds
      on one further blind and one further independent re-derivation, but the
      re-issued artifact
      overclaims in at least four identified places and one of its headline
      self-reported consequences is factually WRONG on the corpus text, so the
      erratum recommended disposition is NOT recorded as official.
    what_is_not_recorded: >-
      Neither d1_scoped_rejection_zero_leverage_model_free nor any other
      disposition label of the erratum section B is adopted as an official
      status of anything. No scoped rejection, no closure, and no promotion is
      recorded, in any direction.
    what_does_not_move: >-
      ECDLP-IDEA-436 stays FROZEN and its State remains
      proposed_unapproved_pending_review. KN-OPEN-3417fc stays OPEN and is
      neither closed, resolved nor narrowed. Disjunct D2 stays NOT GATED.
      KN-FIND-002, KN-FIND-b7e091, EV-GGM-79e710, EV-GGM-001, DEC-20260831-a9716f
      and DEC-20260901-70ba34 are untouched and stand exactly as committed. No
      hypothesis, experiment, question, goal or knowledge status is changed by
      this decision and none is authorised in advance.
    why_split_is_the_honest_word: >-
      Joints are the load-bearing steps of a claim and are conjunctive by
      construction. A blinded reviewer reports on its own joint and cannot see
      the other, so neither report is a whole-claim verdict. A validator HOLDS
      on J1 and a red team BREAKS on J2 is a SPLIT and the claim as stated does
      not carry. This is the second consecutive split on this artifact lineage,
      the first being EV-ECDLP-048824 and DEC-20260831-a9716f. Calling it a pass
      with findings, or a fail, would each misreport it.

  how_the_reviewer_disagreement_was_dispositioned:
    the_disagreement: >-
      The two reviewers disagreed on a matter of FACT, not of judgement, on the
      shared Control B: whether the repaired constructive M2 fires on any
      corpus-recorded oracle. The validator reported CONFIRMED on all four,
      scoring the incidence row from KN-FIND-002 item 4 at O(B to the m), and
      derived from that census, as its finding F-V4, that the repaired M2 has
      exactly one firing instance and zero held-out ones and so has become a
      restatement of its instance. The red team reported REFUTED as its finding
      F-RT5, scoring the incidence row against BOTH records as the committed
      review plan declares the control object, and found that the repaired M2
      FIRES on the incidence CHECK oracle.
    the_adjudication: >-
      THE RED TEAM IS CORRECT, AT FIXED m. This Coordinator session read the
      three source texts directly from the committed tree rather than composing
      the two reports against each other. The repaired M2 fires on an oracle if
      and only if an EXPLICIT simulator answers each query using O(1) group
      operations, inversions and equality tests ON HANDLES and no other access,
      with no coordinate access, no field arithmetic and no local bit-work
      growing with the instance. EV-GGM-79e710 observation O-2 records the
      incidence CHECK oracle as fully checkable via group operations and
      equality tests at at most m group ops per query, which is an EXHIBITED
      handle-only simulator - add the m factor-base handles with the group law,
      compare the sum to the target with one equality test. At fixed m that cost
      is O(1) and every clause of the firing condition is satisfied. KN-FIND-002
      item 4 prices a DIFFERENT interface, the SEARCH interface, at O(B to the
      m), and that is the only one the erratum scored. Two oracle interfaces
      share one name in this corpus and only one of them was scored.
    the_condition_attached: >-
      The refutation holds if m is a fixed decomposition size, which is how both
      records use it and how index calculus uses it, and it is unaffected by the
      KN-FIND-002 note that B grows with problem size, because the CHECK cost is
      m group operations and does not involve B. If m were allowed to grow, the
      repaired M2 would not fire on the CHECK oracle either. WHICH READING
      GOVERNS THE CORPUS IS NOT DECIDED HERE and must not be: that is
      sub-question Q1 of DEC-20260901-70ba34, owned by an open
      review-breakthrough round whose decisive artifact,
      experiments/EXP-GGM-001/simulability_test.py, no session in this lane has
      opened. What is unconditional is that the erratum ran a firing census
      against one of two conflicting corpus definitions of the same oracle
      without disclosing that it had done so, which makes the census unsupported
      as stated whichever reading governs.
    consequences_recorded_as_official_findings_of_this_round:
      - >-
        The erratum section E headline that the repaired M2 fires on none of the
        four corpus-recorded oracles is WRONG.
      - >-
        The erratum statement that M2 has exactly one firing instance anywhere
        and zero independent ones is WRONG. It has at least two and at least one
        is independent of D1.
      - >-
        The validator DERIVED conclusion F-V4, that M2 has become a restatement
        of its instance, is therefore also wrong on its premise. A HOLDS verdict
        on joint J1 does not immunise a Control B finding reached inside it. The
        control was shared by both reviewers by the plan own design, and on a
        shared control the more completely scored run governs. The validator J1
        verdict on the six repairs is unaffected and STANDS in full.
      - >-
        The correction runs in the direction FAVOURABLE to M2 and adverse to the
        erratum self-report. It partly RESCUES M2: the prior-round objection
        that M2 has no held-out object in the firing direction is partly
        discharged rather than sharpened. It is not fully discharged, because
        one corpus firing instance is not a HELD-OUT one and because a
        burden-of-construction criterion remains a definition rather than an
        empirically validated criterion.
      - >-
        BOTH REVIEWERS, FROM OPPOSITE VERDICTS, INDEPENDENTLY REACHED THE SAME
        STRUCTURAL POINT: whatever happens to M2 standing does not touch the D1
        ground, because Proposition E uses neither M1 nor M2, no oracle model
        and no imported generic bound. Agreement across opposite control
        outcomes is the most robust single result of this round, and it makes
        the re-founding commissioned by R-OBJ1 retrospectively necessary rather
        than merely tidier.
    why_they_diverged: >-
      Scope of the control object, not mathematics. The committed plan names the
      object as the four corpus-recorded oracles of KN-FIND-002 AND
      KN-FIND-b7e091. The red team ran both records. The validator ran the
      KN-FIND-002 definitions only and did not record that narrowing as a
      departure from the plan. That is recorded as procedure deviation PD-3 of
      EV-ECDLP-e6f5f2, against the plan rather than against the reviewer: a
      plan that names two records and a count of four, instead of naming the
      control OBJECTS, invites exactly this. A successor plan must list the
      SEARCH definition and the CHECK definition as separate rows.

  rationale:
    - >-
      THE EXECUTION QUALITY IS REAL AND IS RECORDED FIRST, so that the split is
      not read as a verdict on the producer. Six blocking repairs performed in
      the body rather than named in the audit table, twelve conjuncts checked
      separately, three verified mechanically by grep rather than by reading,
      nine lower-severity items addressed with one reasoned declined
      sub-option and zero silent items, a byte-clean snapshot with three bound
      hashes recomputing from the commit and from the working tree, supersession
      by reference with the superseded bytes unmoved, and a producer that
      reported two consequences AGAINST its own commissioning decision rather
      than conforming to its task card. The load-bearing Proposition was
      independently blind re-derived by the validator under a sealed pre-read
      hash and independently re-derived again by the red team, and both found it
      sound. That is the second and third independent re-derivation of this
      object in this lane.
    - >-
      AND THE ARTIFACT STILL OVERCLAIMS IN FOUR PLACES, ONE OF WHICH IS A FALSE
      UNIVERSAL OF EXACTLY THE CLASS THE ROUND WAS COMMISSIONED TO REMOVE. R-F1
      existed because a universal sentence quantified over a list that omitted
      the Weierstrass model. Section C.1 performs that repair and then, three
      paragraphs after constructing its own counterexample model, asserts that
      Proposition E holds on every admissible integral model. It does not: on
      that same counterexample every prime-to-p torsion point reduces to the
      singular point, so the F_p test returns EQUAL for every index pair while
      the correct value off the locus is the minimum of two and r. Adding the
      public model constant does not save it, because the constant fixes the
      VALUE and the failure is in the TEST. Both reviewers found this
      independently, at different severities; this decision adopts the red team
      characterisation on the merits and the shared conclusion that the
      DISPOSITION is model-independent while the EVALUATION ROUTE is not.
    - >-
      THE COST QUALIFICATION IS CONTRADICTED INSIDE THE SECTION THAT DISCHARGES
      THE INTERFACE REPAIR. Section C.2 explicitly declines the unqualified
      phrase and states that the oracle saves at most two scalar multiplications
      per query; section C.5 then states that the materialisation is a cost the
      adversary pays with or without the oracle, which restores the unqualified
      claim. On the integer branch the materialisation is paid only WITHOUT the
      oracle. The red team supplies the sharper and correct statement, which
      makes the Fork-D indifference claim TRUE on a correct premise rather than
      asserted on a false one, and which STRENGTHENS the erratum: on the integer
      interface the predicate is decided from the two integers and the public
      group order by two reductions and one comparison, so the saving is
      O(log n) BIT operations and no group or field element is touched.
    - >-
      THE RECORD-LEVEL NEGATIVE CONCLUSION LEAKED THROUGH THE SPLIT. Two bolded,
      unscoped sentences assert that the record own promotion gate fails, both
      derived from a D1-only query-density quantity, one of them in the Pareto
      section a Coordinator composing a decision reads for headline numbers.
      Part 3 of the same artifact withdraws exactly that class of conclusion.
      The two cannot both stand, and the provenance is visible: both sentences
      are inherited from the superseded memo, where the disposition WAS
      record-level and the sentence was in scope. This is the mechanical route
      by which a correctly-labelled tier leaks downstream, which is the failure
      the erratum own OBJ-9 repair names.
    - >-
      THE CENSUS THRESHOLD IS AN UNDECLARED MODELLING CHOICE WITH A FITTED
      MOTIVE, AND THIS DECISION RECORDS IT AGAINST A DECISION OF ITS OWN LANE.
      DEC-20260831-a9716f states the motive verbatim in its R-OBJ6 repair text:
      D1 is unaffected because the memo exhibits exactly such a simulator. The
      witness threshold was chosen after seeing the instance it is then reported
      as classifying. It is also stricter than the mathematics requires: an n to
      the o(1) bound blocks the anomalous transfer by the same Level 2 argument
      and preserves the exponent-1/2 conclusion, since an oracle simulable at
      overhead n to the o(1) turns a T-query algorithm into a generic algorithm
      at T times that overhead, forcing T to be Omega of n to the one half minus
      o(1). A modelling parameter that determines a reported census must be
      declared with the same discipline as the two forks the erratum does
      declare. The erratum inherited the threshold and applied it faithfully;
      the defect is reporting the resulting census as a fact about the objects.
      That same R-OBJ6 clause was separately FALSIFIED on the integer branch by
      the work it commissioned, as the validator records. DEC-20260831-a9716f is
      immutable and is not edited; both points supersede it by reference.
    - >-
      THE PROVES-TOO-MUCH CONTROL PASSED AND BOTH REVIEWERS QUALIFIED THE PASS
      IN THE SAME DIRECTION, INDEPENDENTLY. M2 does not fire on the anomalous
      additive transfer, the implication chain never starts, and the
      exponent-1/2 corroboration is not broken by that control. But a
      burden-of-construction criterion is trivially non-firing on every object
      nobody has tried, so the control cannot FAIL for M2 on any object
      whatsoever, and a control that cannot fail carries no information. The
      pass is real and close to vacuous FOR M2; it remains fully discriminating
      for M1, where it fires, and that firing remains the most valuable single
      result in this lane. The discriminating burden for M2 has migrated
      entirely onto a held-out object in the FIRING direction, which is
      undischarged, and that migration was not reported.
    - >-
      NONE OF THIS IS EVIDENCE ABOUT ECDLP IN EITHER DIRECTION, AND THE LANE
      STILL HAS NO MEASUREMENT. Zero runs across four producer and reviewer
      sessions and two rounds. No null object exists, the declared negative
      control of the frozen record has never been run, and the
      negative-resolution criterion of KN-OPEN-3417fc is a toy-scale measurement
      that has not been performed. The reported quantity is flat in the
      parameter meant to move it, which is the canonical artifact tell; here the
      flatness is DERIVED, so the tell does not fire automatically, but the
      derivation converts directly into a demand for the measurement. The red
      team supplies a sharper design than the record own control: a two-model
      tabulation on a minimal model and on the explicit non-minimal model, where
      the derivation makes fully determined and DIFFERENT predictions, so the
      model constant is a parameter that provably moves the quantity.
    - >-
      ESCALATION DOES NOT FIRE, AND IT WAS REMOVED BY EVIDENCE RATHER THAN BY
      JUDGEMENT. Both reviewers independently determined that the round stays at
      review-adversarial. The one live escalation candidate the plan singled out
      was the M2-fires-on-nothing finding, and the red team own Control B
      refutation REMOVES it: the corrected census is MORE consistent with the
      corpus than the erratum reported, not less. This session additionally
      checked whether the corrected census creates a NEW trigger and finds it
      does not - it bears on a question already open at review-breakthrough
      under DEC-20260901-70ba34, and neither that decision nor
      DEC-20260831-a9716f rested on the erratum census when routing or opening
      that round, so no prior decision requires supersession on this ground.
    - >-
      ONE MORE TEXT ROUND IS PROPORTIONATE, AND IT IS BOUNDED SO IT CANNOT
      BECOME A REGRESS. Leaving the artifact uncorrected leaves a known-false
      universal, a self-contradicting cost line, two unscoped record-level
      sentences and a refuted census in the committed record a later reader will
      open and cite. The correction costs one paragraph per item and no compute,
      and it carries the cheapest falsification control this lane has. The
      stopping rule below prevents a third text round from being taken for
      granted: prose is not the lane product, and the measurement is.

