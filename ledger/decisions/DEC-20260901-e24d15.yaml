      required_content_blocking:
        - >-
          F-RT1. Withdraw the sentence asserting that Proposition E holds on
          every admissible integral model. State instead that the two-valuedness
          of D1 and its group-theoretic separating predicate hold on every
          admissible integral model, so the zero-information and no-leverage
          DISPOSITION is model-independent, while the Proposition E EVALUATION
          ROUTE is not - on a model that does not realise the good reduction the
          reduced coordinates are all equal and the single comparison decides
          nothing, so the comparison must be performed on the minimal model,
          which is the hypothesis R-F1 added and which is not removable.
        - >-
          F-RT2 and F-RT3. Replace the Fork-D indifference clause with the sharp
          three-case cost statement, so the indifference claim stands on a
          correct premise: integer interface, two reductions modulo n and one
          comparison, O(log n) bit operations, no group or field element
          touched; coordinate-bearing points, one field comparison plus a small
          fixed number of field multiplications if points are held projectively;
          opaque handles, one inversion and two equality tests. State it where
          the disposition is stated, not only where the limitation is admitted.
