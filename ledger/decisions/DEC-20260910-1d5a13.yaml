  approved_boundaries:
  - You are not alone. Own only the seven exact new output paths. No Git,queue,claim,status,approval,shared-module,predecessor
    or immutable record changes. Preserve every existing source and report.
  - Read all declared inputs and verify hashes before implementation. The approved effective_contract and bound
    schema are authoritative; old driver behavior is only a predecessor reference, not the target. Scope is
    every cost_contract requirement, baseline_selection, analysis_and_decision, and the cost-related hard-validity
    predicates. Read the complete sections, including all crosswalk rows and semantic predicates, without output
    truncation.
  - 'Implement real reusable pure Python component APIs in costs.py and reducers.py: strict byte parsing/canonical
    cost CSV; typed raw-row and whole-ledger validation; complete eligible edge generation/validation; exact
    actual campaign accounting; normalized candidate selection; endpoint/class/global reductions; all LOO,
    q_star and branch checks. README freezes the concrete callable signatures and data shapes used by tests
    and later integration. No placeholder, arbitrary callback replacing required logic, hard-coded successful
    validity or always-refusing substitute.'
  - Use only Python standard library arithmetic/serialization plus already installed PyYAML or jsonschema if
    needed, with exact versions and dependency use recorded; no package installation, network, backend/model
    probe, subprocess arithmetic library or scientific runtime. Fraction/int decisions only. Pure modules must
    be inert on import.
  - Preserve the entire component/phase/scope/plane/arm crosswalk and numeric lexical profile. Reject recursive
    duplicate keys, integral float tokens, booleans as integer axes/costs, aliases, unknown fields, invalid
    null/reason pairs and noncanonical fractions. Do not treat schema validation alone as semantic conformance.
  - All physical leaves counted once; no charged rollup plus children. Validate capture identity/clock ordering,
    nonoverlap for chargeable capture spans, raw/physical/logical uniqueness and leaf references. Derive allocation
    targets from explicit supplied candidate-prefix and endpoint-class input tables; validate their shape,
    membership and consistency. These tables are caller-provided component inputs, not mathematical certificate
    verification. Missing target/context remains unresolved and retains actual-only custody.
  - Implement every edge_existence_rule and reason_code_relation, including eight alternative cold scenarios,
    full72-target candidate7 initialization, per-strategy/scenario weight and integer-remainder reconciliation,
    actual-only rows, unavailable-value propagation and derived rollups without edges. Do not sum view copies
    into actual CPU or add RSS values.
  - Normalized selection uses exact U_integer+Med7(B/n) per endpoint then average over exact eight endpoints
    in each of nine strata. All six candidates required; lowest numeric arm only tie break. Actual selection
    expenditure is charged separately in scalar cold totals. No confirmation reselection, point-cache assumption,
    rational replacement of setup remainders or second division by q.
  - Compute exact scalar/transport endpoint totals and ratio of certified-class endpoint sums; every288 cell
    tuple and8global alternatives in complete input,36 governing cells, seven uniquely labelled joint omissions
    per governing cell only, exact Med6, fixed selection/setup, exact6/5 and1 gates, full ladder q_star with
    all earlier cells resolved. Global summaries never override per-cell gates. Missing/duplicate/partial/failed/below-resolution
    data cannot be rescued by omission. Component outputs distinguish invalid ledger, unresolved estimate and
    valid-but-statistically-inconclusive outcomes.
  - No real curve, fixture search, maps, discrete logarithm, signature, private key, RUN allocation, experiment
    output directory, launch lock/nonce consumption, Docker, cgroup, privilege, pressure, scientific timing
    or scientific execution. Tests use explicitly artificial cost/certificate-shape/timing metadata, never
    run the old driver or any calibration path. No claimed theorem, performance, source acceptance or launch
    admission.
  - Freeze named deterministic control registry in coverage.json before first test invocation. Each control
    has its contract path, synthetic input construction, expected predicate and count. At most512 total control
    executions including failures/reruns; each complete suite at most192 with one full final suite reserved.
    Parameterized cases count separately; no uncounted repeated sampling. Test positive and negative cases
    for every crosswalk family and edge rule, malformed bytes, source gaps, fractional selection reversal,
    ties, nondivisible splits,72-edge sum vs8-stratum grouping, duplicate/missing events, nullable values,
    arbitrary valid two-pair class memberships,288/8/36 coverage, labelled LOO permutation/relabel error, all
    threshold/equality/mixed/unresolved/q-star boundaries. No random seeds or generated scientific panel.
  - One checker worker,2GiB sampled aggregate owned-process RSS threshold, nominal<=100ms cadence,10s per case,1800s
    aggregate executed checks as a machine watchdog. No RLIMIT_AS on macOS and no hard-kernel-limit assertion.
    Use require_escalated exec_command for scoped owned-process monitoring/checker invocations; no broader
    process queries or unrelated kills. Preserve cadence, peak basis, actual wall/CPU and unavailable terminal
    samples. Only checker plus its parent controller; no test fixture child processes.
  - Before every invocation create an exclusive temporary attempt directory and retain exact source/checker
    bytes, command and log destinations. Persist child PID immediately after creation, all raw stdout/stderr
    and primary/cleanup exceptions; terminate/reap only owned checker/group on watchdog. Retain every outer
    tool response/session/poll/exit, nested command, UTC, per-case outcome and raw resource samples. Canonical
    check-receipt.json is created once after every intended attempt terminates, never used as an attempt sink.
    Do not guess missing provenance or overwrite failed attempts.
  - Fresh native executor-implementation gpt-5.6-terra with high reasoning, no fallback,degradation,Bedrock
    or serving probe. Record requested model/runtime separately from unverified serving telemetry; model_verified
    false absent independent evidence.
  - 'Implementation report maps every in-scope contract requirement to source and controls and names exact
    integration prerequisites. This component cannot set whole-run authorization, resource/custody or certificate
    validity: those arrive from separately verified launcher/receiver and arithmetic integration. Coordinator
    must snapshot, arrange fresh independent complete component review, then freeze complete runner/receiver
    integration preserving every approved stage and real evidence gates. This task is an intermediate part
    of that integration, never the requested ready experiment itself.'
