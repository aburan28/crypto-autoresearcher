  context: Advance the existing approved CM calibration definitions through a bounded complete cost/reducer
    component while the independent image audit occupies the separate native-runtime queue.
  rationale:
  - DEC-20260908-aa587b explicitly calls for complete implementation handoffs; the old driver uses adaptive-total
    selection, universal costs and floating ratios that do not satisfy the new contract.
  - Complete allocator and reducer code is a necessary independent integration prerequisite and ranks ahead
    of idle waiting; it does not depend on the image audit or modify its inputs.
  - Standing user authorization covers this zero-science component implementation. Full runner, trusted authorization/receiver,
    arithmetic, runtime and independent review remain mandatory; no readiness count changes.
