coordinator_decision:
  id: DEC-20260804-0a4bc2
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-105
  recorded_by_task: TASK-20260804-152
  archived_by: TASK-20260804-153
  context: >-
    BATCH-105: Adversarial max C at p=1009..9001. Max C ≈ 4 (bounded). NOT growing
    as fast as mean C ~ p^{0.079}. Strong support for H-PSEUDO with constant C.

  decision: upgrade_hpseudo_evidence
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    H-PSEUDO-83817b REVISED: The empirical evidence now supports the STRONGER form:
    C = O(1) (constant, not growing with p), not just C = O(p^{0.079}).

    Evidence:
    - Mean C ~ p^{0.079} (from BATCH-073..079 random curve measurements)
    - Adversarial max C ~ 4 across p=1009..9001 (this batch + BATCH-104)
    - The adversarial max is NOT growing with p (3.90 → 3.87 → 4.11)

    H-PSEUDO with C ≤ 5 (universal constant) is STRONGLY empirically supported.
    The earlier estimate C ~ p^{0.079} was based on MEAN measurements; the maximum
    (which is what H-PSEUDO needs) appears constant.

    Note: the mean C growing might reflect that MOST curves have C > C_random (EC structure
    adds global correlation), but the WORST curve has C bounded. H-PSEUDO needs the bound
    for all curves, so the adversarial max is the relevant quantity.

    GOAL-ECDLP-001 stays active.

  h_pseudo_revision:
    original: C(p) ~ p^{0.079} (mean over random curves)
    revised: max_curves C(p) ~ O(1) ≈ 4 (adversarial maximum, empirically bounded)
    claim_strength: preliminary_empirical (toy scale p=1009..9001)

  exact_next_action: >-
    BATCH-106: Promote new KN-FIND for adversarial robustness of H-PSEUDO.
    Update H-PSEUDO-83817b to reflect max C ~ O(1) evidence.
    Then continue: investigate whether the adversarial max is PROVABLY bounded by a
    constant, or whether it grows for specific arithmetic-progression primes.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No KN-* entry was created by this decision. The record's `promoted` list held
      a placeholder id for a promotion that was OWED but never made, which made the
      record assert the opposite of the truth -- that the corpus had been updated.
      Converted under DEC-20260805-7b3e91 (RUL-9): the obligation is declared here,
      where the schema puts an unmet obligation, and every word of the original
      entry is preserved verbatim under owed_promotions below. Nothing was deleted.
    owed_promotions:
      - id: pending_kn_find_hpseudo_adversarial
        note: >-
          Adversarial max C ~ 4 at p=1009..9001 (190+ measurements). H-PSEUDO with
          constant C ≤ 5 strongly empirically supported. Not growing with p across
          tested range.

  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2
    sota_delta: {time_exponent: not_applicable}
  claim_ceiling: toy
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-04'
