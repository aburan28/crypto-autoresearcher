      be carried into texts that do not exist yet: the C-4 supersession and
      the decision report. They must also land together with the adoption. One
      ledger archive with explicit conditions does that without letting any
      piece become official alone.
    - >-
      No goal transition. The J4 DISSENT is recorded and outstanding. AGENTS.md
      says a recorded DISSENT blocks closure, and AGENTS.md prevails over C-4.
      Superseding J4 here would need a fresh rule-12 review of route (a) that
      does not exist (K1e). Recording (c) met while the goal stays active is
      the honest state.
    - >-
      Exponent bias (docs/target-result-profile.md). The no-go moves no
      exponent. Its forward value is R2 (IDEA-20260803-ff7415), the only
      exponent-relevant lead in the lane, still untested, plus the
