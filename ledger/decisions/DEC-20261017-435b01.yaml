    - id: PD-B
      what: >-
        The inputs of TASK-20261017-5aa462 and TASK-20261017-df5651 (this
        decision and the composition files) are committed only by the archive
        that depends on those tasks. AGENTS.md "Dispatch preconditions" asks for
        committed and pushed inputs. This cannot be met without splitting the
        adoption from its supersession and report, which C-4 and research-visuals
        forbid. Mitigation: no concurrent worker is involved. Both tasks are
        executed by the top-level session in the same worktree and commit
        nothing. Each pins the sha256 of every working-tree input at its start,
        and its claim release records them (--artifact). TASK-20261017-517bbe
        re-verifies that none changed (517bbe LA-10). A change stops the archive.
