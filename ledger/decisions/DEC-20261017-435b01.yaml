      internal consistency.
    - >-
      Semaev 2004 Theorem 1 was retrieved once (TASK-20260930-40470a). CU-7 could
      not retrieve it (HTTP 403, a tooling failure under RC-6) and verified its
      content on its own S_3 to S_5. The m >= 6 extent rests on the theorem as
      read once, which is acceptable for a derivation-tier record.
    - >-
      This composer holds no shell. Every digest, checker output and git fact is
      taken from committed files or the top-level session's reports. It read
      the predecessor report only at G-3 (by search) and read computations.json
      only at the keys cited.
    - >-
      Toy primes only (13 to 1999 across CU-7; 101 to 1999 in the predecessor;
      211 to 1601 in BATCH-003). No claim at cryptographic scale. No ECDLP
      result. No security estimate moves.
    - >-
      Two lanes (BATCH-450ac7 and BATCH-3186a5) stay open together until the
      517bbe archive verifies and BATCH-450ac7 is closed. Neither holds a live
      claim at writing. Claims stay within max_concurrent 1.
