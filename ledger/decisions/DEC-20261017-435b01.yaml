  # ---------------------------------------------------------- independence
  independence_ruling:
    check_output: >-
      tools/check_review_independence.py --plan ledger/handoffs/TASK-20261016-9c1bc5.yaml
      --reports .../review_attestation.yaml, exit 1, verbatim in the
      TASK-20261016-548959 snapshot receipt: "re-deriver TASK-20261016-9c1bc5
      read 1 blind_from path(s) --
      coordination/goals/GOAL-MONO-001/review/TASK-20260930-40470a/". The same
      single problem appears in the reviewer's self-run (computations.json
      independence_check_self_run).
    ruling: >-
      ACCEPTED AS THE PLAN'S DELIBERATE SEQUENCED LIFT. NOT AN INDEPENDENCE
      FAILURE. The ruling rests on the plan text, not on the reviewer's word.
      (1) The plan declares the lift BEFORE any reviewer ran. blindness.lifted_for
      names TASK-20261016-9c1bc5, and its rationale says "The reviewer is blind to
      coordination/goals/GOAL-MONO-001/review/TASK-20260930-40470a/ until its
      blind re-derivation section and outputs are written ... After that it may
      read the predecessor report". blind_rederivation.blind_from_note says "The
      third path is blind until the blind section is complete". RC-2 orders the
      work that way. inputs_note lists the two predecessor files as SEQUENCED
      inputs. PD-2 declares the lift "so that tools/check_review_independence.py
      and the composer can read it as deliberate". (2) The checker computes a
      flat intersection between sources_read and blind_from. It has no
      representation of order (tools/check_review_independence.py lines
      1012-1028). Its FAIL is therefore exactly what the plan's own design
      produces when the reviewer reads what the plan told it to read. (3) The
      only path flagged is the third one. The two producer paths that stay
      blind throughout, experiments/EXP-MONO-4b50b6/ and
      coordination/goals/GOAL-MONO-001/batches/BATCH-003/, are not flagged, so
      sources_read names neither. (4) The report's own evidence of order: the
      attestation's sources_read carries a "--- blind section frozen here
      (2026-10-16T17:25:53Z) ---" marker before the first predecessor path, and
      computations.json records blind.frozen_at_utc 2026-10-16T17:25:53Z and
      blind.frozen_section_sha256
      244bca5607c005444c7c2893fb13d419abc3e3da2d25fabe2ebe79aa39c50afb. That
      freeze time lies inside the session window the runtime receipt records
      (launch about 17:06Z, report received before 17:55Z). (5) The blind
      section is substantively disjoint from the predecessor's (Part 1a). It
      uses curves A, B, C and D, none of the predecessor's C1 to C5 and not the
      producers' p=211 curve. It builds S_5 by a different route (a
      formal-degree Sylvester determinant interpolated over F_p, with no PARI
      or FLINT). Its specialisation argument also differs (a morphism E^{m-1}
      -> P^1 and the regularity of mu, against the predecessor's curve germ and
      Gauss's lemma). A replication of the predecessor would be unlikely to
      differ on all three.
    what_the_ruling_does_not_establish: >-
      The ORDER of work is self-attested. No commit or external timestamp
      separates the freeze from the unblinding. The frozen hash and the freeze
      time sit inside the reviewer's own computations.json. The ruling accepts
      the order on the plan's declared design and on corroborating evidence. It
      does not claim the order was externally verified. AC-1 makes the one
      cheap mechanical cross-check: the embedded frozen text must hash to the
      recorded value and must agree with report Parts 0 and 1.
    disclosed_pre_blind_exposure: >-
      Disclosed by the reviewer in Part 0.3 item 1, and a plan-design defect,
      not a reviewer defect. The card the reviewer had to read first embeds
      the Coordinator's prior. That prior names the leading-coefficient shape
      "S_{m-1}^2" and the degree-drop worry. The reviewer proves the identity
      itself (Part 1.2 step 2, symbolic at m=4 and numeric at m=5) and tests the
      worry on constructed instances. The exposure points at the quantity under
      attack, not at the predecessor's derivation. It does not defeat blindness
      against the blind_from artifacts. Lesson for successor plans: keep
      coordinator_prior out of the reviewer-visible card, or declare it as a
      pre-blind read (LS-1).
    tooling_finding: >-
      T-1 (report Part 6). tools/check_review_independence.py cannot express a
      sequenced lift of a blind_from path. Its blind-phase split and
      scoped-lift mechanisms (lines 693-759) cover a separate blind task or an
      addendum allow-list, not "blind until step k". An infrastructure finding.
      It is not a gate on this goal and not evidence (core rule 5). Successor
      plans that need this pattern either use the phase-split mechanism, with
      the blind section as its own task, or pin the freeze with a commit or a
      bus post before unblinding (LS-2).

