    - id: R-FORM
      subject: >-
        Whether DR-1 to DR-14 can be discharged under the existing approval
        DEC-20260920-2b276f, as DEC-20261002-a63f13 R-FORM held for D-1 to
        D-8, or need a new record
      ruling: >-
        YES, UNDER THE EXISTING APPROVAL. QSP-SUCC-R is a zero-run revision of
        the implementation-repair DESIGN under DEC-20260920-2b276f, gated by a
        design review round, with AT MOST ONE conditional versioned
        protocol_amendment under a freshly minted id and a new path, inside
        DEC-20261002-a63f13 R-AMEND-SCOPE unchanged (as clarified by R-C6-DIAG
        and R-AMD-PATH-2, neither of which widens it). Not a new experiment
        or hypothesis record; no EXP or H identifier is needed or held.
      reasons:
        - >-
          (1) The finding that decides it is already composed.
          DEC-20261002-6e68d8 R-KEY ruled K-new-record does NOT apply: all three
          round-1 joints point to derivation (A) being implementable on the
          bridge and Band H, and to the replication remaining performable under
          the frozen specification plus an A1 amendment once the defects are
          repaired. No fact since then (the brief reports none) changes that.
        - >-
          (2) Every DR item falls in a class the existing approval already
          covers. Work-order and acceptance-check repairs inside the frozen
          fields: DR-1 (failed-record raw-result.json; check_run on the failure
          branch), DR-2 (certificates bound per row), DR-3 (canonical read
          paths), DR-4 (transitive imports, argv form, F-10 mutation, Linux as a
          dispatch precondition, test-tree coverage), DR-7 (operand-provenance
          trace and independence rules R1 to R3), DR-11 (the I_indep minimum
          read set), DR-13 (TQ-3 statement and synthetic routing on every card)
          and DR-14 (new files only). Implementation choices the specification
          leaves open: DR-5 (the I_indep product engine set under CI-5).
          A1 content inside R-AMEND-SCOPE: DR-6 (the route line redrawn from
          measured rates), DR-8 (wording and labelling of the amendment's
          consequences), DR-9 (A-TWIST's status, A1 change or a reading of
          C5; the composer rules, as DEC-20261002-6e68d8 DR-9 says). A
          limitation, not a change: DR-12. A diagnostic that touches no
          criterion: DR-10 (R-C6-DIAG).
        - >-
          (3) No DR item touches preregistered_prediction, success_criterion,
          falsification_criterion, M1 to M9, certificate_semantics, the
          candidate set, the cells, seeds, claim_tier, the field model or any
          tolerance, and R-C6-DIAG keeps DR-10 off the C6 pass criterion. The
          frozen prediction therefore stays byte-identical, which is the reason
          DEC-20261002-a63f13 R-FORM (3) gave for preferring the amendment route
          to a new record; that reason is unchanged.
        - >-
          (4) The specification names protocol_amendment under
          experiments/EXP-QSP-70b731/amendments/ as its own change mechanism,
          and DEC-20260920-2b276f approved implementation and Stage measurement
          as the contract defines. A refused design does not consume the
          approval; it consumed one amendment identifier, which is why a fresh
          one is used (R-AMD-PATH-2).
      what_would_require_a_new_record: >-
        Key K-new-record of REVIEW-QSP-RD-20261002-521e9d: (a) derivation (A)
        shown not implementable on the bridge or Band H as stated; or (b) a
        holding JRD2 showing, by construction on synthetic cells, that no
        acceptance check can both reject every I_direct-in-disguise mutation
        the plan names and pass a legitimate Band-L substitute route, so that
        Band-L agreement could not certify an independent instrument. Either
        closes the lane at TASK-20261002-ea2ed7 and ranks a new-record design
        batch at that selection point with its reason and cost.

    - id: R-AMD-PATH-2
      subject: the amendment identifier, path and version (DEC-20261002-6e68d8 DR-14 and R-AMD)
      ruling: >-
        If the revision needs an amendment, it is written at
        experiments/EXP-QSP-70b731/amendments/AMD-20261002-09957b.yaml with id
        AMD-20261002-09957b (pre-minted by the session; a random 6-hex token
        with zero whole-tree hits, disclosed as AMD-20261002-1303c4's
        provenance was), version 1 to 2, kind additive, approved_by null, an
        approval block naming DEC-20261002-ff2bd5, precedence over version 1,
        and a field refused_predecessor naming AMD-20261002-1303c4 (refused by
        DEC-20261002-6e68d8, never in force, unedited). Protocol version 2 is
        the first APPROVED amendment; the refused file's own "version 2" label
        governs nothing. amendment-v2.yaml is never reused, edited or
        renamed. If no amendment is written, DEC-20261002-ff2bd5 returns
        AMD-20261002-09957b unused by name.

    - id: R-AMEND-SCOPE-CARRIED
      subject: what the conditional amendment may change
      ruling: >-
        DEC-20261002-a63f13 R-AMEND-SCOPE stands verbatim: MAY CHANGE A1
        (I_indep route per census or calibration cell where derivation (A) is
        shown infeasible, naming the route, why it is independent of
        I_direct, and on which cells derivation (A) itself runs and is
        calibrated by C1 before Band H), A2 (stage and blocking-control order)
        and A3 (Stage 0 mechanics only to make D-6 executable); MAY ONLY
        TIGHTEN invalidation rules, stopping rules and blind_from; MAY NOT
        CHANGE the preregistered prediction, the criteria, M1 to M9,
        certificate_semantics, the candidate set, the cells, seeds,
        claim_tier, the field model or any tolerance. DEC-20261002-6e68d8 R-AMD
        classified the dual-route calibration requirement as an
        A1-consequential tightening inside scope; the revision labels it so
        (DR-8). Infeasibility for A1 is decided only by R-ROUTE-RULE.

    - id: R-ROUTE-RULE
      subject: >-
        The criterion "derivation (A) shown infeasible", fixed before any
        rate is measured (quantifier order; red-team report RT-20261002-f6c6f4
        proof_architecture_challenges, adopted by DEC-20261002-6e68d8 DR-5 and
        DR-6)
      ruling: >-
        FROZEN NOW. For a census or calibration (cell, d) with n = q n' + r,
        s = n' - r, B = max(2^s, d^(q+1)) and group size G (candidates of
        exact degree d under the specification's candidate rule), derivation
        (A) is INFEASIBLE iff (M) a modular squaring or the gcd at degree B on
        the I_indep engine does not complete under RLIMIT_AS = 8 GiB (measured
        where B lies within the measured ladder; above it, the larger of the
        floor 2B bits and the measured peak-address-space-per-bit ratio
        extrapolated linearly, against 2^36 bits), OR (T) the projected
        single-worker group time T_A = G x (131 x t_sq(B) + t_gcd(B)) exceeds
        90 days, where t_sq is the measured seconds per modular squaring at
        degree B on the fastest engine of the I_indep engine set the design
        declares, t_gcd the measured (or fitted and labelled) seconds for the
        gcd of two degree-B operands under the design's declared gcd, and 90
        days is the round-1 design's 30-day horizon times a declared
        measurement-uncertainty allowance of 3. Composition of lambda and
        factorisation of the gcd are excluded from T_A (optimistic toward
        derivation (A)), and disclosed. Rows with 30 < T_A <= 270 days are
        flagged marginal. Bridge and Band H are never substituted (PTM-D2).
        Every other route than derivation (A) on a census or calibration
        (cell, d) is an A1 change.
      reasons:
        - >-
          Round 1 broke because the line was drawn from an unmeasured model
          and then defended as optimistic (O-1, O-2). Fixing the criterion
          before any measurement removes the one free choice left to the party
          that draws the line; the producer measures and applies, it does not
          choose the threshold.
        - >-
          The 30-day horizon is the refused design's own parameter, which
          JD2 attacked on rates, not on the horizon; the factor 3 places the
          burden of infeasibility where the specification places it (I_indep
          rests on derivation (A); a substitute only where it is shown
          infeasible) and is also the agreement tolerance of the blind rate
          card, so a row cannot be substituted on a difference the blind card
          could not distinguish.
      revisit: >-
        A composer that finds the rule itself unworkable (for example an
        engine whose peak memory cannot be bounded by measurement) records it
        under K-design-revise with the reason; the rule is changed only by a
        later Coordinator decision, never by a producer or reviewer.

    - id: R-RATES
      subject: >-
        Who measures the DR-5 engine-rate table, and how (DEC-20261002-6e68d8
        DR-5 "a shell-holding party named on a card"; NA-1 (2) "a
        shell-holding card for the DR-5 engine-rate table")
      ruling: >-
        THE TOP-LEVEL SESSION, AS ALLOWED SESSION COMPUTATIONS NAMED IN
        ADVANCE ON THE PRODUCER CARD TASK-20261002-01d26d (items R-C5 to R-C7),
        running the producer's committed benchmark blocks; checked by a
        STRUCTURALLY BLIND re-measurement on its own card
        (TASK-20261002-efd590, JRD3) and by the red team's own measurements
        (TASK-20261002-820856, JRD2). The measurements are design figures on
        uniformly random F_2[X] operands of stated degree from a declared seed:
        no RUN id, no field degree, no lambda, no L, no H, nothing built from
        a declared cell; one measurement process at a time; RLIMIT_AS = 8 GiB
        set inside the block; a per-process watchdog of 3600 s (machine
        protection, CLAUDE.md research budgets) whose expiry is an instrument
        condition, never a result; host load recorded before and after each
        item; numpy's version recorded if numpy is used.
      reasons:
        - >-
          DR-5 asks for a shell-holding party named on a card; the session is
          that party and the producer card names it. NA-1 (2)'s "shell-holding
          card" is met in substance: the computations are fixed on a card
          before the producer runs, run by a shell-holding party, and relayed
          verbatim. Timing the very code blocks the design pins keeps the
          measured engine identical to the declared engine, which a separate
          executor card writing its own benchmark would not guarantee.
        - >-
          Independence of the measurement comes from the blind card, which
          re-measures the named engine families from a statement alone and
          never reads the producer's code or numbers (the plan's
          blind_rederivation). A separate executor card would add two archives
          and a dispatch for about an hour of benchmark compute without adding
          that independence.
      procedure_note: >-
        Disclosed as PD-2: NA-1 (2)'s wording is met by a declared
        session-computation item set rather than a separate executor card.

    - id: R-C6-DIAG
      subject: DEC-20261002-6e68d8 DR-10 (the C6 exact count N = 2^(deg gcd(f, T^n - 1)) for linearized lambda)
      ruling: >-
        ADMITTED ONLY AS A RECORDED, NON-BLOCKING DIAGNOSTIC. It may be
        written into the design as a value the runner computes and records
        beside C6's frozen check, flagged when it disagrees; it does not
        change C6's pass criterion, fires no stopping rule and enters no
        success or falsification criterion. A design or amendment that makes
        it a pass criterion is outside R-AMEND-SCOPE (TQR-2).
      reasons:
        - >-
          R-AMEND-SCOPE does not list controls among tightenable fields, and
          the owner session saw run outputs, so a control criterion changed now
          would be a criterion changed after outcomes were observed by a party
          to the lineage, which requires more than this decision.
        - >-
          The formula's provenance is recalled (red-team report O-8) and was
          checked on synthetic cases only; a recalled formula supports nothing
          (AGENTS.md core rule 9). As a diagnostic it costs nothing and its
          disagreement would be informative.
      revisit: >-
        A later Coordinator decision may promote it to a criterion through a
        versioned amendment once a retrieved or derived proof of the formula
        is archived and the change is shown pre-data for every party that
        would apply it.

    - id: R-WHO
      subject: who writes the revision, in which order
      ruling: >-
        DESIGN FIRST, THEN TWO EXECUTORS, THEN A VALIDATION ROUND, as
        DEC-20261002-a63f13 R-WHO, with fresh parties throughout. (1) A fresh
        Coordinator /design-experiment session (TASK-20261002-01d26d, no
        shell) writes revision-design.yaml, a new file discharging DR-1 to
        DR-14 by number together with D-1 to D-8, CC-1 to CC-5 and CI-1 to
        CI-6, carrying the refused design's holding parts by citation and
        re-stating them where it relies on them, and, only if needed, the
        amendment under R-AMD-PATH-2. (2) Round 1 reviews it at zero runs
        (REVIEW-QSP-RD-20261002-521e9d) and DEC-20261002-ff2bd5 composes it.
        (3) Only under K-design-accept: TASK-20261002-38ffea writes I_indep,
        then TASK-20261002-909f2c the runner and trial-plan-r1.json, in two
        separate executor sessions. (4) Round 2
        (REVIEW-QSP-RI-20261002-521e9d) and DEC-20261002-e23776. (5)
        Execution is a later batch with its own run card and execution
        approval; nothing here schedules it.
      independence: >-
        No card of this batch is held by: this Coordinator session; the
        session of TASK-20261002-c5d9e7 or of TASK-20261002-323713 (TQ-3
        self-reports; DEC-20261002-6e68d8 R-TRIPWIRES and DR-13); any party
        that held a card of BATCH-4708f7 (producer, reviewer, composer) or
        authored DEC-20261002-a63f13 or either of its plans;
        coordinator-qsp-run-20260921; or a producer, reviewer or composer of
        BATCH-d08b44 or BATCH-bc5bd5 in flight.

    - id: R-CARRIED
      subject: carried conditions and implementation conditions
      ruling: >-
        DEC-20261002-e0aa2b carried_conditions (CC-1 fresh run ids; CC-2 the 14
        invalid trials re-run, not carried; CC-3 Linux; CC-4 the
        specification's blind_from binds every implementer; CC-5 TW-C1) and
        DEC-20261002-a63f13 CI-1 to CI-6 stand unchanged. CI-2 keeps its path:
        the closure lives under experiments/EXP-QSP-70b731/implementation/r1/
        and the successor plan is experiments/EXP-QSP-70b731/trial-plan-r1.json,
        because neither was ever written (cards TASK-20261002-e0b22e and
        TASK-20261002-b72830 were cancelled before dispatch); before the first
        executor card the session confirms neither path exists, and an
        existing path is a custody stop. DEC-20261002-6e68d8 DR-12 is carried
        as a limitation for any later evidence review. DR-13 is carried onto
        every card: evaluating any H polynomial, root, gcd or count on a
