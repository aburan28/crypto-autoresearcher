  rationale:
    - >-
      Why now and why first. DEC-20260929-bbb3a9 NA-12 ranks this round first
      in the line: NA-3's reading of the relation count r may change the unit
      the successor census (NA-5) is designed in, and NA-10's reassessment of
      H-PFDR-0cc7e8 waits on it. Every floor-relative reading of
      EV-PFDR-1faf10, including the prediction (2) floor-attainability
      framing, is withheld until it composes.
    - >-
      Why review-breakthrough. The firing rows are filed by the frozen spec as
      "a claimed contradiction of a generic lower bound or an accounting
      error", a review-breakthrough class. The policy is non-degradable; if it
      cannot be served at max the round does not start at a lower tier.
    - >-
      Why the joints. They implement NA-3's design constraints (i)-(vi) and
      the user's list: solve reality with disjoint code (F1, constraint i);
      a blind re-derivation of A7 under the frozen r and named alternatives
      (F2, ii); the floor formula, its conventions and the premise per arm
      against the H-PFDR-0cc7e8 text (F3, iii and the convention list); S_3
      charging and uncounted work, including the charged-range rule and the
      SS store (F4, iv); the OBJ-5 / F-J3-1 undercount (F5); the threshold's
      calibration under the null (F6, v); and the (2) exponent comparison
      (F7, vi). Proves-too-much covers known_log, rho, harvest-off rows,
      random arms and a synthetic generic engine. One owner per joint; the
      validator re-derives blind and re-executes, the red team attacks the
      argument and calibrates it.
    - >-
      Why the worktree is 66d6eab71. It is the first commit holding the
      object under review, the sealed prior reports and the routing
      authority; it precedes the a569199 in-place manifest edit, so the
      reviewers read receipt-bound content; and it precedes the merge of a
      main whose CI is red for an unrelated record.
    - >-
      Why a bounded recomputation rather than a certification run. NA-3
      allows either. A review-scoped re-execution, keys fixed by rule before
      anything is read, with a disjoint checker, gives the firing instances a
      verified k without a new RUN id or protocol, and it binds each archived
      row to a re-execution whose k was checked. A separately approved
      certification run would add nothing the round needs, and NA-8 already
      makes k archiving a standing design rule for future specifications.
    - >-
      Why the memory caps. The largest archived job peak RSS is 1.03e9 bytes,
      for a full nine-arm job including census mode at m = 4 and 32 bits; a
      single-key job is bounded by it, and a baby-step giant-step at N < 2^32
      needs at most 2^16 baby steps. A 2.0e9-byte stop is about twice the
      measured maximum and below the frozen 3.5e9-byte per-process cap. The
      red team runs no solver, so 1.5e9 bytes covers its N <= 2^24
      simulation with wide margin. Both together stay well within the 15 GB
      host.
    - >-
      Exponent bias (docs/target-result-profile.md). The floor is the
      admission gate every structured proposal of this line must beat by a
      non-generic step (H-PFDR-0cc7e8 interpretation_limits). Settling whether
      the harvest-on firings are an accounting or calibration artifact, a
      premise violation, or a residue decides whether that gate is usable as
      a screen for exponent-moving claims. That outranks the
      constant-factor generic work of this line.

