  rationale:
    - >
      IDEA-20260905-05648a cites
      RQ-ECDLP-002 and RQ-CRYPTO-001,
      has a cheap finite deck-type
      versus count degree identity,
      and is not owned by a hypothesis
      or experiment. Confirmed unowned
      immediately before ID allocation.
      IDEA-20260902-2327a5 shares the
      W_n law of P-S0-WTLAW and is not
      selected. Stage 0 is the
      deck-type versus count degree
      iff only: at m=3 REAL j=0
      p=13 B=2 t=x^3 has every fibre
      size 6 and type equals count;
      KF Edwards p=17 d=3 t=(xy)^2
      has max fibre 8 and type 2
      disagrees with count 8.
    - >
