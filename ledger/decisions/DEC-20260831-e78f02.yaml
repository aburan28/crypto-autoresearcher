coordinator_decision:
  id: DEC-20260831-e78f02

  context: >-
    Evaluation of the DEC-20260810-0c0946 head-advancement successor
    condition for GOAL-AES-003, as instructed by DEC-20260831-5cf890's
    next_actions. The dispatched executor task TASK-20260810-724383
    completed (COMPLETED_WITH_REJECTION_AS_VALID_RESULT); its binding
    package was snapshot-archived by TASK-20260831-58a03d at commit
    13be2cfa7 (five declared paths, sha256-bound in
    archives/TASK-20260831-58a03d/snapshot-receipt.json); the authored
    checkpoint entry was spliced into ledger/goals/GOAL-AES-003.yaml by
    Coordinator coordination commit 0fe42b000 (51 insertions, 0 deletions,
    first-list position matching the entry's original placement at
    8098bb98e; YAML parses; head fields untouched).

    The binding facts, all re-derived from the tree by the executor: commit
    74e33ea35 (snapshot) changed 24 paths and is an ancestor of
    origin/main; commit 8098bb98e (ledger) changed 4 paths, is an ancestor
    of origin/main, and its record_ids [EV-AES-048545, DEC-20260804-73977c]
    were confirmed against what the commit actually changed; both original
    receipts are byte-identical to their committed state; one disagreement
    with DEC-20260810-0c0946 was recorded (3/24 snapshot paths sit under
    archives/, not tasks/ -- the tree wins).

    The dispatcher verdict on BATCH-b41ba9's queue, verbatim: exit 2,
    "dispatch error: completed archive task TASK-20260806-9c6a11 requires
    archive.commit_sha". The verification report section 6.2 then
    establishes by direct static analysis of validate_dispatch_queue and
    GitRepositoryVerifier.verify_archive that this rejection is not
    closeable by any executor-lawful action, for three PRE-EXISTING
    immutable facts: (1) the queue's completed archive cards carry
    archive.commit_sha null and editing a completed card's state is
    falsification, not repair; (2) the snapshot card's declared 5-path set
    cannot match the commit's actual 24 paths without amending a completed
    card's declarations; (3) the ledger card's expected set includes
    archives/TASK-20260806-7943b5/validation-report.md, which was NEVER
    COMMITTED and cannot be supplied without manufacturing the forbidden
    validator report. Section 7 confirms the standing validator-archive gap:
    BATCH-b41ba9's PASS is attested only inside its ledger receipt's
    self-authored review_chain; no independently archived validation report
    exists.

  decision: supersede

  decision_scope: >-
    THIS DECISION ADJUDICATES THE HEAD-ADVANCEMENT SUCCESSOR CONDITION AND
    NOTHING ELSE.

    It reviews NO experimental evidence, moves NO hypothesis, promotes NO
    knowledge, moves NO claim tier, and asserts NOTHING about AES at any
    round count. The restored BATCH-b41ba9 outcome text remains restored
    committed content, not a new attestation; this decision neither re-runs
    nor re-interprets EV-AES-048545 or DEC-20260804-73977c. It closes no
    batch and opens no batch.

  target_ids:
    - GOAL-AES-003
    - BATCH-b41ba9
    - BATCH-014
    - BATCH-015
    - TASK-20260810-724383
    - TASK-20260831-58a03d
    - DEC-20260810-0c0946
    - DEC-20260831-5cf890
    - CORR-20260810-e00f0e

  head_disposition: >-
    THE HEAD REMAINS AT BATCH-014. IT IS NOT MOVED TO BATCH-b41ba9.

    DEC-20260810-0c0946 bound the outcome in advance: IF the ledger archive
    verifies, the head moves; IF IT DOES NOT, BATCH-014 is correct as it
    stands. The only verification mechanism the goal's head convention
    recognizes -- tools/research_dispatch.py accepting BATCH-b41ba9's queue
    -- has now been run, rejects verbatim, and is PROVEN UNREACHABLE under
    every executor-lawful action by the verification report's section 6.2.
    The condition fails, and this decision discharges it by confirmation,
    exactly as DEC-20260810-0c0946 discharged LIVE-HEAD-AES003.

    `current_batch_id` stays BATCH-014. `dispatch_queue_path` stays
    coordination/goals/GOAL-AES-003/batches/BATCH-009/dispatch_queue.json.
    `latest_verified_commit` is NOT advanced by this decision (the commits
    bound here predate 0f86463eb0eb4eca7c28a0bba2d7b4864d863832, and
    advancing it requires the batch-close path, not a reconciliation). The
    next legitimate head move is BATCH-015's own close: its ledger archive
    (TASK-20260805-3f00cb) appends the checkpoint and advances the head
    fields in its own commit, superseding the b41ba9 question for
    advancement purposes by recency.

  rationale:
    - >-
      No completed card's state or declared path set is amended to force
      dispatcher acceptance: the handoff's own constraint (and AGENTS.md
      rule 4) names that act falsification of an archive, not repair. The
      19-path snapshot mismatch and the never-committed validator report
      are real facts about how BATCH-b41ba9 was archived; papering over
      them would convert a disclosed defect into a silent one.
    - >-
      BATCH-b41ba9 is NOT treated as a "fully verified checkpoint": its
      validator PASS lives only in the archiving coordinator's self-authored
      review_chain field, and its queue can never pass the dispatcher. The
      head convention's own words ("the most recent FULLY VERIFIED
      checkpoint") therefore exclude it, independent of the dispatcher
      failure.
    - >-
      The content bindings and the restored checkpoint still have durable
      value: they stop every future head-reconciliation session from
      re-deriving these findings at fresh cost (the exact failure mode
      DEC-20260810-0c0946 was written to end), and they bind both commits
      by content for any later adjudication.
    - >-
      BATCH-015's rank-1 research is unaffected and proceeds; this
      adjudication only closes the b41ba9 advancement question.

  superseded_conditions:
    - condition: >-
        DEC-20260810-0c0946 successor condition: "TASK-20260810-724383 must
        be queued, run, committed AND tools/research_dispatch.py must accept
        BATCH-b41ba9's queue; only then may a NEW Coordinator decision move
        the head fields."
      disposition: >-
        SUPERSEDED AS UNREACHABLE. The task was queued, run, and committed
        (packages at 13be2cfa7, splice at 0fe42b000); the dispatcher
        acceptance half is proven unreachable by the archived verification
        report section 6.2. No future session may retry a BATCH-b41ba9 head
        move except under a NEW Coordinator decision that either (i)
        accepts a documented content-bound degradation with the card
        declaration mismatches disclosed and the validator gap carried
        explicitly, or (ii) introduces a supersession mechanism that does
        not edit the immutable cards. Silence is not permission; a retry
        without such a decision is unauthorized.

  evidence_refs:
    - id: TASK-20260810-724383
      role: producer_of_the_binding_package_and_verdicts
    - id: DEC-20260810-0c0946
      role: decision_whose_successor_condition_is_discharged
    - id: DEC-20260831-5cf890
      role: dispatch_decision_instructing_this_evaluation
    - id: CORR-20260810-e00f0e
      role: merge_drop_record_now_fully_repaired_by_0fe42b000
    - id: EV-AES-048545
      role: batch_evidence_untouched_and_unreinterpreted

  evidence_refs_note: >-
    The dispatcher rejection, the re-derived path sets, and the ancestry
    checks live in the archived package (commit 13be2cfa7):
    archives/TASK-20260810-724383/verification-report.md plus the two
    binding JSONs. EV-AES-048545 is named only to assert it is neither
    reviewed nor re-interpreted here.

  limitations:
    - >-
      The static analysis in report section 6.2 is a reading of
      tools/research_dispatch.py's code, not a second dispatcher run; its
      three items are pre-existing facts about immutable cards and commits,
      and any future mechanism must re-verify rather than trust this
      summary.
    - >-
      BATCH-b41ba9's validator gap remains OPEN as a disclosed defect; this
      decision records it and does not repair it. Repair would require
      re-running validation against the archived artifacts under a new
      task, which no current batch dispatches.
    - >-
      latest_verified_commit is unchanged; if a later review argues the
      bound commits should count toward it, that is a separate decision
      with its own gates.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED. This is an integrity adjudication over archive
      bindings and head fields; it produces no durable research claim.

  next_actions:
