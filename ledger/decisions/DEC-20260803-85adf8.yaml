      candidates A-I named and ranked with revisit conditions, records
      DEC-20260803-c7a1a3's ranked-first candidate as NOT DROPPED (candidate F)
      together with the fact that I deviated from it, and records the rule-12
      transitions and the BATCH-010 archival debts as owed rather than cancelled.

