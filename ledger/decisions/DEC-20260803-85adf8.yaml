    - >-
      NO SECURITY PROOF, IN EITHER DIRECTION. A cost figure that sits below or
      above a cutoff in one cost model at one parameter set under eighteen
      numbered heuristics is neither a break nor a proof. This batch RAISES
      nothing and LOWERS nothing about ML-KEM's security.
    - >-
      NO FIPS 203 PARAMETER SET IS AFFECTED OR CLEARED. Kyber-512, Kyber-768 and
      Kyber-1024 stand exactly where they stood before this batch. No security
      level is asserted or revised; COST-MLKEM-001's conditional envelope is
