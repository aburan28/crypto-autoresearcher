      `__module__`, `__qualname__`/`type(...).__name__` and the tool's own
      `f_name` into results.json; state non-coverage positively by naming the
      siblings you did NOT run; scope the verb to the object"). This is the
      strongest candidate in the batch and BOTH reviews wrote essentially the
      same guidance independently, which is itself evidence it is a real
      technique. REFUSED NOW, for two reasons and neither is that it lacks merit.
      (i) Its natural worked example is the EV-MLKEM-015 misidentification, and
      writing that into the corpus as an established correction is exactly what
      rule 12 gates - a KN-FIND or KN-TECH asserting it would route the gate
      rather than respect it. A version scoped strictly to the SOURCE FACTS
      (estimator/lwe.py:13 binds one name to another object) and to the method,
      with no claim about EV-MLKEM-015, is writable and is the successor named
      below. (ii) PROCEDURAL AND BINDING: TASK-20260803-12eab2's declared
      `write_scope` is exactly four paths and contains no `knowledge/` path.
      Writing one would expand a declared archival path set and break the archive
      contract (AGENTS.md "Durable research commits"). A knowledge promotion
      belongs to a task that declares it.
      CANDIDATE B - a KN-FIND on ANOM-3 itself. REFUSED ON THE MERITS: the
      finding does not survive as stated, its Kyber-512 instance dies under 2.4
      bits of sample-count inflation and a memory-charge exponent of 0.0197, its
      768/1024 instances sit on an instrument path with NO Sage reference whose
