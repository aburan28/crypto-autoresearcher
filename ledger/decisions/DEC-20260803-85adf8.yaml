  # ==================================================================
  # RANKING RATIONALE
  # ==================================================================
  ranking_rationale:
    basis: >-
      AGENTS.md "Research-direction integrity and auditability" and
      docs/inventor-protocol.md section 4. ONE batch remains under the 10 -> 12
      extension, so this ranks a REAL and final allocation: candidate A is
      BATCH-012's first task and is written into the goal's single `next_action`.
      Every candidate carries its evidence, cost, test boundary, remaining
      uncertainty and a revisit condition. No candidate is abandoned.
    profile_honesty_stated_up_front: >-
      Under docs/target-result-profile.md this campaign is a concrete-cost and
      verification campaign, not an exponent-moving one. NO CANDIDATE BELOW MOVES
      AN ASYMPTOTIC EXPONENT, none claims to, and the ranking is on falsification
      value rather than on exponent ambition. Recorded so the bias toward
      exponent-targeting mechanisms is not silently claimed to have been applied
      where it does not apply. The four asymptotic-claim promotion gates are not
      engaged by anything here because no asymptotic claim is made.
    the_choice_that_was_made: >-
      I rank the SAGE-REFERENCE FALSIFICATION first, above every interpretive or
      remedial candidate, and above the Coordinator's own instinct to keep
      building on ANOM-3. Reason: it is the only outstanding check that can fail
      CATASTROPHICALLY rather than incrementally. Kyber-768 and Kyber-1024
      `matzov` are an uncovered instrument path - the harness control covers
      `primal_bdd` and `dual_hybrid(fft=True)`, and the sole Sage anchor for
      `matzov` anywhere is the pin's own Kyber-512 doctest - and those two
      numbers carry ANOM-3's 4.59 and 8.39-bit margins, D1's 7.42 and 11.48 bits,
      the Carrier residuals at 768/1024, and every below-cutoff sentence for
      768/1024. ONE DISAGREEMENT FALSIFIES ALL OF IT AT ONCE, and nothing else in
      the package survives independent of it. It is also the producer's own
      section 8 item 1 and the red team's `next_concrete_action`, i.e. the
      producer and both reviews converged on it without being asked to.
    candidates:
      - id: A
        candidate: >-
          OBTAIN A SAGE-COMPUTED REFERENCE FOR `estimator.lwe_dual.matzov` AT
          KYBER-768 AND KYBER-1024 under RC.MATZOV at pin 3e48ef4, and compare
          against 196.3662433540 and 262.3356800075. Route: install Sage and run
          `LWE.estimate(schemes.Kyber768)` / `LWE.estimate(schemes.Kyber1024)`,
          or simply run the estimator's own doctest suite at the pin. Archive the
          transcript verbatim whichever way it falls.
        rank: 1
        cost: One Sage installation plus minutes of compute; one producing run; one independent review session.
        why_first: >-
          It is the cheapest single check that can falsify the batch's headline,
          ANOM-3 and the Carrier agreement SIMULTANEOUSLY. Every load-bearing
          number other than Kyber-512 flows through a path with no known-answer
          coverage, and three sessions agreeing on the same uncovered path is not
          a Sage reference.
        expected_outcome_stated_in_advance: >-
          Two outcomes are usable and one is not permitted. (i) AGREEMENT: the
          uncovered path is covered, ANOM-3's 768/1024 numbers become
          instrument-anchored, and the strength cap on EV-MLKEM-021 lifts by one
          notch - though the INTERPRETIVE refutations W2-W4 are untouched by it,
          because they are about what the numbers mean and not about whether the
          instrument computes them correctly. (ii) DISAGREEMENT: the headline,
          ANOM-3 at 768/1024, and the Carrier agreement all fall at once, and
          that is the more valuable outcome. (iii) SAGE CANNOT BE INSTALLED UNDER
          THIS PROGRAM'S NETWORK POLICY: a declared "the reference cannot be
          obtained here" is a USABLE RESULT and must be reported as one, not
          padded - and it is infrastructure signal, never a mathematical result
          (AGENTS.md rule 5). A task that can only succeed is not a test.
        riders_in_the_same_task: >-
          Because outcome (iii) is a real possibility, the same task carries the
          red team's RUNNER-UP and the two owed nulls, all cheap and all on the
          same artifact: RC-4 / OBJ-9(b), re-run stages 2-4 with the search boxes
          doubled (p in [2,16], k_enum/k_fft/beta +-16, ~60 s) - if S4 keeps
          falling, the Carrier agreement is bounded by the box rather than by the
          model; RC-1, the null object ANOM-3 still lacks - cost `matzov` and
          `primal_bdd` on an LWE instance with the same (n, q, m) as Kyber but a
          secret/error distribution for which the dual distinguisher provably
          cannot work, and report whether the ordering persists; and RC-2, extend
          the N-inflation decay test to 2^24 and 2^32 so Kyber-768 and Kyber-1024
          are BRACKETED rather than merely unbroken at 2^16.
        test_boundary: >-
          The same three FIPS 203 sets, the same pin, the same three callables,
          the same cost model. Nothing here reaches other attacks, other cost
          models, KN-OPEN-016's repaired-heuristic question, or ML-KEM security.
        remaining_uncertainty: >-
          Whether Sage is installable at all under this program's network policy.
          EV-MLKEM-015's standing boundary - no FIPS 203 or NIST text readable -
          and two prior G6K install failures (BATCH-003, BATCH-005) counsel
          caution, which is why the riders travel in the same card.
        revisit_condition: not applicable - it is ranked first and dispatched.
      - id: B
        candidate: >-
          The KN-TECH promotion on the callable-identity discipline, scoped to
          source facts only, with `knowledge/` in its declared write_scope and a
          regenerated knowledge/INDEX.md in the same ledger archive.
        rank: 2
        cost: One session, no compute.
        why_second_and_not_dropped: >-
          It is the batch's only durable, transferable output and it is gated on
          nothing this batch has not established. It ranks second only because it
          is corpus work rather than a test, and because candidate A can falsify
          the numbers the entry would otherwise be tempted to cite. If BATCH-012
          can carry two tasks, it is dispatched with A.
      - id: C
        candidate: >-
          SIZE THE R HALF OF H17: expose an outer repetition factor on the
          estimator's MATZOV path and sweep it against Carrier's archived
