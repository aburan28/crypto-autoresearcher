      null instead of inheriting it, and the red team wrote a third, independent
      rebinding controlled at delta 0.000e+00 against the pin. All three ran the
      known-answer control first, as a subprocess, exit 0.
      WEAKER: the control does NOT cover `matzov`. The only known-answer
      reference for that callable anywhere in this campaign is the pin's own
      committed doctest at KYBER-512. CTRL-6, the package's sign null, is a null
      of the wrong shape (magnitudes 60-120 bits; it cannot fail informatively),
      and CTRL-5 as written checks an internal identity of a transcribed dict and
      would pass on a mistyped table - the validator did the transcription check
      CTRL-5 does not do, and it passed. The discriminating controls are CTRL-4
      and CTRL-7, and both are real.
    verdict: >-
      ADMISSIBLE AS EVIDENCE OF WHAT IT IS: an independently reproduced,
      honestly scoped decomposition over a pinned instrument, whose central
      finding is a source fact, with twelve recorded defects and one uncovered
      instrument path carrying its largest numbers. It is NOT admissible as
