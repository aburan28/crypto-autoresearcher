coordinator_decision:
  id: DEC-20260803-85adf8
  goal_id: GOAL-MLKEM-003
  batch_id: BATCH-011
  recorded_by_task: TASK-20260803-12eab2
  authorized_by: DEC-20260803-c7a1a3
  recorded_at: '2026-08-03'

  decision: weaken
  decision_label: >-
    weaken_the_anom3_internal_finding_as_stated_and_the_coordinator_scouting_premise;
    keep_what_is_source_checkable;
    correct_two_coordinator_errors_on_the_record;
    no_status_change_anywhere;
    rule_12_gate_intact_and_now_blocking_a_correction_both_reviewers_recommend
  decision_vocabulary_note: >-
    The disposition on the merits is WEAKEN, and the intent is REFINE-BY-
    SUBTRACTION: something the campaign believed is taken away, on the merits,
    with archived refutation artifacts, and what remains is stated more narrowly
    than before. `weaken` is the enum value; `refine` is not in the
    templates/research-records.md enum and this campaign's precedent maps it to
    `revise` (DEC-20260802-937ba9, DEC-20260803-c7a1a3). `revise` was considered
    and REFUSED here, because it would understate what happened: an independent
    reviewer refuted a Coordinator claim, and the label should show a retraction
    rather than a re-framing. WHAT IS WEAKENED is named precisely in
    `what_is_weakened` - it is NOT a hypothesis status and NOT any prior evidence
    record. `support` and `reject_scoped` were both refused; see `why_not_support`
    and `why_not_reject_scoped`.

  # ==================================================================
  # CONTEXT
  # ==================================================================
  context: >-
    DEC-20260803-c7a1a3 extended GOAL-MLKEM-003's budget 10 -> 12 on direct user
    instruction and authorized BATCH-011 with ranking candidate A - derive a
    memory figure that primal_bdd actually implies - as its producing task. I did
    not dispatch that. I dispatched a different question: Coordinator scouting
    had found that the published dual headlines (Carrier 139.5 / 195.1 / 259.7,
    MATZOV-2022 137.5 / 193.5 / 257.8) sat 4-16 bits below what the pinned
    estimator reproduced, and that the gap grew SUPERLINEARLY in beta
    (gap/beta 0.01067 / 0.01411 / 0.01632), which is the signature of a
    systematic modelling difference rather than noise. That is KN-OPEN-016's live
    question and it cuts both ways, so I put it to the executor: decompose the
    gap into named, individually-sized modelling differences.
    The producer decomposed it and the answer was that the premise was mine.
    Between 81% and 96% of the gap, and ALL of its growth in beta, is a
    comparison against the wrong estimator callable: `estimator/lwe.py:13` binds
    the public `LWE.dual_hybrid` name to `class MATZOV`, while the scouting - and
    EV-MLKEM-015 before it - used the module-level `lwe_dual.dual_hybrid(fft=True)`,
    the Espitau-Joux-Kharchenko hybrid.
    Correcting that surfaced ANOM-3: under RC.MATZOV at the pin, `matzov` is
    cheaper than `primal_bdd` by 0.543432 / 4.592472 / 8.387943 bits, at
    139.66 / 196.37 / 262.34 against the secondary-sourced cutoffs 143/207/272.
    Both independent reviews then died on a provider session limit before writing
    anything (TASK-20260803-e09290, TASK-20260803-95d8be); I wrote an unreviewed
    significance note while they were down; and the successors
    (TASK-20260803-0d860f, TASK-20260803-f42495) returned
    ADMISSIBLE_WITH_DEFECTS with 12 defects and pass_with_constraints with 12
    objections. This decision is the adjudication of that package and those two
    reviews.

  # ==================================================================
  # COORDINATOR VALIDITY CHECK, BEFORE ANY INTERPRETATION
  # ==================================================================
  coordinator_validity_check:
    performed_before_interpretation: true
    expected_run_count: >-
      MET. Producer: 1 results-bearing run of 1 allowed, 369.5 s wall of a 3000 s
      allowance, `ulimit -v 4194304` enforced, `timeout 2900`, exit 0; four
      exploratory instrument probes listed separately with their purpose and no
      number reported from any of them except as reproduced inside the single
      deliverable run. Validator: 1 of 1, 38.5 s control plus 222.7 s
      results-bearing, of 2400 allowed. Red team: 1 of 1, 136.1 s of 2400, with
      no estimator computation outside it. No budget exceeded anywhere and NO
      RESULT IS REPORTED FROM AN EXHAUSTED BUDGET.
    schema_complete_manifests: >-
      MET, with two Coordinator-owned exceptions recorded as defects rather than
      waved through. The producer receipt records the command chain verbatim,
      environment (python 3.11.15, Linux-6.18.5, mpmath 1.3.0, scipy 1.17.1,
      "sage: not installed"), the estimator pin with `dirty: false`, the mid-task
      HEAD move as ANOM-1 with an independently verified empty diff over the
      instrument and the archived sources, and its own deviations DEV-1..DEV-3.
      All seven declared artifact sha256 were recomputed independently by the
      validator and match both the snapshot receipt and the producer receipt; the
      red team verified the same against the worktree. THE EXCEPTIONS: the
      snapshot archive receipt carries `commit_sha: null` / `parent_sha: null` /
      `verification.status: pending_post_commit`, so the dispatcher's post-commit
      verifier cannot be run against it (DEF-1, OBJ-12) - both reviews performed
      the four checks by hand and all four passed; and the reviewed snapshot's
      tree carries a shim different from the one the producer's receipt pins,
      because my own shim commit 0100fdbc landed 31 s before the snapshot (DEF-2,
      third recurrence of EV-MLKEM-020's EI-2 class).
    seed_integrity: >-
      MET AND OPERATIONALLY TESTED. `randomness.seeds: []` with an explicit
      justification - no sampling, no Monte Carlo, no RNG on any exercised path -
      which the validator confirmed by inspection (all grid searches exhaustive
      over declared integer ranges) and, more convincingly, by its own
      from-scratch searches landing on the IDENTICAL argmin points. The receipt
      also states plainly that a byte-reproduction check was not performed and
      why (results.json stores timestamps), which is an honest statement of a
      real limit rather than a claim of byte reproducibility.
    raw_summary_agreement: >-
      CHECKED, AND THREE DIVERGENCES FOUND AND RECORDED. (1) DEF-4: the gap/beta
      growth table in gap_report.md section 4 appears NOWHERE in results.json,
      and its printed "residual/beta after D1-D4" row has no beta column, with
      the printed -0.00125 / -0.00103 corresponding to beta = 386 and beta = 589
      rather than S4's own beta. Fifth-decimal, and the validator recomputed the
      row under all three beta conventions and it brackets zero and fails to
      scale under every one. (2) DEF-5: "reproduces those ratios exactly" is not
      exact - the scouting figure 0.01411 was the imprecise one, the run gives
      0.0141036. (3) DEF-8, the one that MOVES A NUMBER: ANOM-4 is recorded in
      section 5(5) and is not carried into the headline reproduction sentence, so
      measured against Carrier's own archived Table C.2 rather than against the
      abstract the like-for-like residual is +0.146010 / +1.555798 / +2.985671
      rather than +0.156 / +1.266 / +2.636 - LARGER at 768/1024 by 23% and 13%,
      i.e. in the direction that does NOT flatter the reproduction claim. No
      producer number failed to reproduce: zero `not_reproduced` in both reviews.
    control_comparability: >-
      MET, AND STRONGER THAN USUAL IN ONE RESPECT AND WEAKER IN ANOTHER.
      STRONGER: the validator deliberately ran on a DIFFERENT INSTRUMENT - the
      committed post-0100fdbc shim whose `_Real.n()` ignores `prec` and returns
      the full 200-bit value - and applied NO patch of its own, where the producer
      ran the pre-0100fdbc shim plus an in-process rounding patch. Agreement
