  knowledge_promotion:
    promote: false
    promoted: []
    not_warranted: >-
      NOT WARRANTED, and three real candidates were weighed rather than waved
      past.
      CANDIDATE A - a KN-TECH on the callable-identity discipline ("record the
      fully-qualified callable actually invoked, its binding locus and the pin;
