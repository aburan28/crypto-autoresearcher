      actual net contribution to the campaign is SUBTRACTIVE: it removed a
      Coordinator artifact that had shaped the campaign's reading since BATCH-001.
    named_obstruction: >-
      Stated per the inventor-protocol closure standard, and it CLOSES NO LANE.
      The obstruction to settling whether `matzov` really is cheaper than
      `primal_bdd` in any meaningful sense is that the two costs are not
      commensurable at the resolution of the margin: one is an explicitly
      truncated asymptotic resting on a disputed law, the other is not; they
      price different events (an advantage-0.5 distinguisher over k_enum+k_fft
      coordinates versus a full-secret BDD); the instrument exposes no
      `success_probability` or `repetitions` on the MATZOV path with which to
      normalise them; and neither reports memory. FORWARD GUIDANCE, which is what
      the standard actually requires: normalising the two attacks to a common
      success probability and a common memory convention is a well-posed piece of
      work that no batch has attempted, and candidate C's amendment is its first
      step.
    premature_closure_check: >-
      This decision closes no lane, closes no goal, pauses nothing, and retires
      no candidate. It keeps KN-OPEN-016 and KN-OPEN-017 open, keeps ANOM-3 alive
      as a per-parameter-set result rather than dismissing it, records that its
