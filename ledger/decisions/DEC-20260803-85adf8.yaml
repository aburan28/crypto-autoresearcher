      at Kyber-768/1024, or as a rule-12 adjudication of anything.

  # ==================================================================
  # WHAT IS WEAKENED, AND WHAT IS NOT
  # ==================================================================
  what_is_weakened:
    - id: W1
      target: The Coordinator scouting premise that motivated BATCH-011.
      was: >-
        "The published dual headlines sit 4-16 bits below what the pinned
        estimator reproduces, and the gap grows superlinearly in beta, so it is a
        systematic modelling difference."
      now: >-
        96.36% / 85.43% / 81.33% of that gap, and ALL of its growth in beta, is
        the comparison object. D1 = +4.132437 / +7.421620 / +11.481588 bits;
        residual/beta after D1 alone is 0.000403 / 0.002150 / 0.003203 and after
        D1-D4 brackets zero. The premise was an artifact of my own function
        selection.
      artifact: >-
        estimator/lwe.py:13 read at the pin, plus the validator's executed
        identity check (`lwe.dual_hybrid is lwe_dual.matzov` -> True), plus two
        independent recomputations of D1 to <= 1.9e-09 bits.
    - id: W2
      target: >-
        ANOM-3's internal finding AS STATED - my note's claim that it "stands or
        falls on the function identity alone" and survives globally.
      was: >-
        "Within the estimator's own frame, under RC.MATZOV, matzov is cheaper
        than primal_bdd by 0.54 / 4.59 / 8.39 bits; that is a statement about
        this program's own evidence and it stands on the function identity
        alone."
      now: >-
        REFUTED AS A SURVIVAL ARGUMENT, on three checkable grounds, and replaced
        by a PER-PARAMETER-SET statement.
        (i) There is no single frame: `matzov` is costed from an explicitly
        truncated asymptotic (lwe_dual.py:551, "# p.29, we're ignoring O()")
        resting on the disputed independence law, `primal_bdd` is not, and
        Kyber-512's entire 0.543432-bit margin is smaller than one dropped factor
        of 2. Sharing the disputed law contaminates the comparison BECAUSE only
        one side carries it.
        (ii) The batch's own diagnostic convicts it: ANOM-3's margin/beta =
        0.0014042 / 0.0077971 / 0.0101919 at beta 387 / 589 / 823 is the same
        monotone-in-beta shape the batch used to convict my scouting gap. The
        diagnostic was applied to the finding that embarrassed the scouting and
        not to the one that flattered the campaign.
        (iii) The decay test was RUN, controlled at delta 0.000e+00 against the
        pin: inflating N with full re-optimisation flips Kyber-512 at
        delta ~ 2.3732 bits, while Kyber-768 (+0.728911) and Kyber-1024
        (+5.233394) survive N x 2^16. FRAGILE AT KYBER-512, GENUINELY ROBUST AT
        KYBER-768 AND KYBER-1024 - and the 768/1024 half is recorded in the
        direction it falls, because a quantity that DOES survive the parameter
        meant to destroy it is a point in its favour under inventor-protocol
        section 3, not against it.
      artifact: >-
        RT-20260803-f42495 OBJ-3 and counterexample_or_mutation, archived by this
        same ledger commit; the source locus lwe_dual.py:551; and arithmetic over
        results.json anyone can redo.
    - id: W3
      target: >-
        Any security reading of ANOM-3 - including the sentence in BOTH failed
        tasks' receipts, written by me, calling it "the most consequential
        finding this campaign has produced".
      now: >-
        DISSOLVED TWICE OVER, and the two reasons compound. FIRST, the shared
        assumption: the estimator's `matzov` implements the very sample-count law
        whose independence assumptions Ducas-Pulles dispute and that Carrier
        claims to avoid, so two models agreeing is an observation and not
        corroboration of either. SECOND, memory charging: the reconstructed
        exponent that flips the ORDERING is c_flip = 0.019688 at Kyber-512 -
        BELOW EV-MLKEM-020's own primal c* - and 0.141988 at Kyber-1024, with no
        flip at Kyber-768; and matzov's own c* against the cutoffs is
        0.028803 / 0.080877 / 0.040268, all one to two orders of magnitude below
        every named hardware convention. Reported in the direction it falls:
        matzov's undercut is MORE memory-robust than primal_bdd's at Kyber-768
        and Kyber-1024 and slightly less at Kyber-512.
      artifact: RT-20260803-f42495 OBJ-4, whose reconstruction reproduces EV-MLKEM-020's published primal log2 M to |delta| < 4.0e-07.
    - id: W4
      target: >-
        The claim that "the pinned public estimator reproduces Carrier's
        published headline".
      now: >-
        BOUNDED BY A SEARCH BOX, NOT BY A MODEL. D2/D3/D4 measure the estimator's
        own optimiser slack applied to ONE SIDE ONLY, which is why
        `fraction_attributed` exceeds 1 on two of three sets; a one-sided
        relaxation started above a target crosses it for any target it started
        above. The producer's own H9 states the boxes are local, so a wider
        search makes S4 strictly cheaper still. The box-doubling control (RC-4)
        was not run. The only defensible accounting is the D1-only row and it is
        quoted at ONE decimal place until Carrier's unmapped log2 R
        (9.39 / 9.49 / 15.15) is mapped: +0.2 / +1.3 / +2.6 bits against the
        abstract-derived headline, +0.1 / +1.6 / +3.0 against Carrier's own
        archived table.
      artifact: RT-20260803-f42495 OBJ-9; VAL-20260803-cc262c DEF-8.

  what_is_not_weakened_and_is_explicitly_kept:
    - >-
      THE D1 IDENTITY AND ITS SHARE OF THE GAP. A source fact plus a
      deterministic evaluation, reproduced independently twice. This is the
      durable content of BATCH-011.
    - >-
      THE KYBER-512 INSTANCE OF ANOM-3 AS AN INSTRUMENT FACT. It is printed in
      the pinned upstream repository's OWN COMMITTED DOCTEST at
      estimator/lwe.py:124 (`bdd :: rop ~2^140.2, beta 389, eta 422, d 1005` and
      `dual_hybrid :: rop ~2^139.7, beta 387`) with no shim and no patch. I ran
      and read this myself; the validator (M9) and red team reproduced it
      independently. It also independently validates this program's harness on
      the primal path, since the doctest's beta/eta/d match ours exactly.
    - >-
      THE PRODUCER'S CONDUCT. Both reviews searched for fabrication and scope
      inflation and found none. The red team calls the package "the most
      disciplined artifact this campaign has produced": it ran its control first,
      numbered eighteen heuristics with falsifiers, disclosed its own
      over-attribution and negative residual, disclosed the stale task card and a
      mid-task HEAD move, refused "best attack" phrasing, recorded a failing
      cost-model combination rather than dropping it, and surfaced ANOM-3 -
      the observation most inconvenient to its own batch's premise - while
      explicitly refusing to adjudicate it. That is rule-8 and rule-9 compliance
      under a task card I wrote badly.

  # ==================================================================
  # WHY NOT support, WHY NOT reject_scoped
  # ==================================================================
  why_not_support: >-
    Four independent grounds, any one sufficient. (1) THE FINDING DOES NOT
    SURVIVE AS STATED - that is the red team's central judgement and this
    decision adopts it; a `support` disposition would ratify a claim its own
    reviewer refuted. (2) THE LOAD-BEARING NUMBERS SIT ON AN UNCOVERED
    INSTRUMENT PATH. `matzov` at Kyber-768 and Kyber-1024 has no Sage-computed
    reference of any kind, and the single cheapest check that would falsify the
    whole batch at once was named by the red team and NOT RUN. Supporting a
    result whose named falsification is outstanding inverts the order of
    operations this program exists to enforce. (3) CONTROLS-BEFORE-BELIEF IS
    FORMALLY UNMET, for the second consecutive batch: no null object of the right
    shape exists for the reproduction claim (DEF-7) or for ANOM-3 (RC-1).
    (4) RULE 12 IS UNMET AND UNWAIVED, and `support` on evidence of strength
    `replicated` would additionally trigger the mandatory knowledge-promotion
    path, enshrining in the corpus a claim two reviewers have constrained.
  why_not_reject_scoped: >-
    REFUSED, and the refusal is a rule, not a preference. My contract forbids
    `reject_scoped` on a single unreplicated empirical-only run and directs
    `weaken` plus replication instead - which is exactly what this decision does.
    Beyond the rule: ANOM-3's Kyber-768 and Kyber-1024 margins SURVIVED the
    strongest mutation anyone has applied (16 bits of N-inflation with full
    re-optimisation), and at Kyber-768 charging memory WIDENS the margin. A
    scoped rejection would misreport a per-parameter-set result as a uniform
    negative and would be as dishonest as the overclaim it was avoiding.
    `reject_scoped` would also assert a closure that the outstanding Sage
    reference could overturn in either direction.

  # ==================================================================
  # TWO COORDINATOR ERRORS, CORRECTED ON THE RECORD
  # ==================================================================
  coordinator_error_corrections:

    - id: CE-1
      title: I transferred EV-MLKEM-020's per-attack critical memory exponent to a different attack.
      raised_by: VAL-20260803-cc262c DEF-12 (moderate)
      what_i_wrote: >-
        The "Unchanged and reinforcing" paragraph of
        coordination/goals/GOAL-MLKEM-003/batches/BATCH-011/coordinator_notes/anom3_significance_note.md
        says "EV-MLKEM-020 established the undercut dies at a memory-charge
        exponent as small as 0.007. These are free-memory gate counts. Two
        independent reasons now cut against the security reading, and they
        compound."
      why_it_is_wrong: >-
        c* IS PER-ATTACK. EV-MLKEM-020 says so in its own boundaries: "c* is the
        critical exponent OF primal_bdd under RC.MATZOV at the free-memory
        optimum." 0.00705473 is Kyber-1024's PRIMAL exponent, computed as
        margin / log2 M for primal_bdd at eta = 422/640/889. The matzov undercut
        has a LARGER margin and a SMALLER sieve, so its exponent is LARGER, not
        equal. Attaching the primal's smallest figure to the dual made the dual
        look maximally fragile, which is the direction that flattered my own
        note's conclusion.
      corrected_values: >-
        Carrying EV-MLKEM-020's own Model A convention across to `matzov`
        (log2 M = 0.2075*b + log2 b at b = beta_sieve = 391/583/804, margins
        +3.343959 / +10.633757 / +9.664320) gives c*_matzov ~ 0.0373 / 0.0817 /
        0.0548 against the primal's 0.0316 / 0.0459 / 0.0071 - UP TO 7.8x LARGER
        at Kyber-1024 (validator DEF-12). The red team computed the same quantity
        against PEAK memory including the FFT table and obtained 0.028803 /
        0.080877 / 0.040268 (OBJ-4); the two differ at Kyber-1024 precisely
        because the 2^240-cell FFT table dominates the 2^166.83 sieve there. Both
        are indicative arithmetic on a memory model EV-MLKEM-020 itself
        downgraded to `construction_with_partial_support`, both are marked
        `unable_to_check`, and neither is a validated result.
      what_survives: >-
        The QUALITATIVE point survives intact and is not withdrawn: 0.03-0.08 is
        still one to two orders of magnitude below every named hardware
        convention and far below 1/3, so memory charging does dissolve the
        security reading. THE FIGURE 0.007 MUST NOT TRAVEL WITH ANOM-3, and no
        downstream record may quote it in that context.
      accountability: >-
        Mine. The error is in a Coordinator note, not in the producer package,
        which makes no memory claim at all. It was caught because the validator
        treated my note as a claim to check rather than a finding to accept -
        which is what the task card told it to do and what OBJ-8 shows was not
        guaranteed.

    - id: CE-2
      title: I over-read my own grep and asserted the estimator prices no false positives at all.
      raised_by: RT-20260803-f42495 OBJ-1 (major)
      what_i_wrote: >-
        The same note's fact 2 says "There is no false-positive cost anywhere in
        the class. Searching lines 496-700 for `Pwrong`, `false_pos`, `fpfn`,
        `Phi_inv` returns zero occurrences... This is consistent with what
        BATCH-007 recorded of MATZOV-2022 itself (no `Pwrong` term; false
        positives handled analytically), and here NOT EVEN THE ANALYTIC TERM
        APPEARS."
      what_is_confirmed: >-
        THE GREP IS RIGHT AND IS STRONGER THAN I STATED. Both reviewers verified
        it independently: zero occurrences in lines 496-700, zero in the whole of
        lwe_dual.py, and zero in the entire `estimator/` package. There is also
        no outer repetition factor and no amplification term on the MATZOV path.
      what_is_wrong: >-
        THE FINAL CLAUSE. The ANALYTIC false-positive cost IS present, at
        `estimator/lwe_dual.py:555`, as the bracket
        `(k_enum*cls.Hf(params.Xs) + k_fft*log(p) + log(1/mu))`. That bracket is
        the LOG-COUNT OF CANDIDATE HYPOTHESES the distinguisher scores -
        2^{k_enum*H} enumerated guesses times p^{k_fft} FFT bins - plus
        log(1/mu), and it MULTIPLIES N, inflating the required sample count so
        the best wrong candidate stays below the right one. That is precisely
        MATZOV's analytic handling of false positives, and precisely where the
        independence assumption does its work. The absence of a `Pwrong` LITERAL
        is a fact about naming, not about the cost model.
      corrected_statement: >-
        The estimator's MATZOV path prices false positives ANALYTICALLY, through
        the union-bound-shaped bracket at lwe_dual.py:555, and carries no
        `Pwrong` variable, no measured false-positive rate, no outer repetition
        and no amplification term. It does NOT omit false-positive cost entirely.
        No downstream record may repeat that it does.
      what_survives: >-
        The note's REASON 1 - that `Nf` derives N from a closed-form advantage
        law with no term modelling dependence between score contributions - is
        confirmed by both reviewers and is SOUND AND SUFFICIENT ON ITS OWN to
        dissolve the security reading. My error was in presenting a second,
        unsound reason as compounding it.
      accountability: >-
        Mine, and it is the more instructive of the two: a grep for four
        identifiers cannot establish the absence of a concept, and I wrote as
        though it could. The red team's cheapest check for it was "read lines
        552-556 and ask what 2^{k_enum*Hf} * p^{k_fft} counts" - one minute, no
        compute.

  correction_mechanism: >-
    BOTH ERRORS ARE CORRECTED BY SUPERSESSION, NOT BY REWRITING. The note at
    coordination/goals/GOAL-MLKEM-003/batches/BATCH-011/coordinator_notes/anom3_significance_note.md
    is committed and IS NOT EDITED by this archive (AGENTS.md rule 4). It keeps
    its own "Status: NOT EVIDENCE" header and its errors, and this decision plus
    EV-MLKEM-021 are the records that correct it. Any future reader who reaches
    the note through git log must be able to find the correction, which is why
    both errors are named here with their loci and their corrected values.

  # ==================================================================
  # PROCESS DEFECT: THE UNREVIEWED NOTE
  # ==================================================================
  process_defect_unreviewed_coordinator_note:
    raised_by: RT-20260803-f42495 OBJ-8 (moderate)
    what_happened: >-
      Both BATCH-011 reviews died on a provider session limit before writing any
      deliverable. While they were down I wrote a Coordinator source-reading note
      on what ANOM-3 does and does not mean, committed it (0cf03c06,
      2026-08-03 15:43:18 UTC), and then wrote the successor task cards
      (6876940e, 15:45:12) instructing BOTH successors to read it first.
    what_it_did_right_and_the_red_team_says_it_is_a_lot: >-
      It is labelled "Status: NOT EVIDENCE", dated, attributed, scoped to a named
      snapshot, committed durably rather than left in a working tree, it forbids
      citation as validation, and every factual claim in it is stated at a
      checkable source locus - which is why both of its errors were findable.
    what_it_did_that_a_coordinator_input_to_a_review_should_not: >-
      Three things, in the red team's words. (a) It ANSWERS the reviewer's
      designated lead objection. (b) It INSTRUCTS the reviewer on budget
      allocation on that question - "the retry should not spend its budget
      re-deriving it". (c) It PRE-ANNOUNCES THE SPLIT, "Dissolved - the security
      reading / Survives - the internal finding", which is the interpretive
      verdict that agents/red-team.md assigns to the red team as
      `narrowest_supported_statement`. AGENTS.md's model-policy section requires
      a reviewer that did not originate the claim; the note does not breach that
      literally, but supplying the reviewer's conclusion in advance produces the
      correlation the requirement exists to prevent.
    did_it_pre_empt_or_inform_the_reviews: >-
      THE RED TEAM'S JUDGEMENT, ADOPTED HERE AS THE FINDING: "recoverable, and I
      judge it INFORMED RATHER THAN CONTROLLED this review, but only because I
      re-derived both facts and found one over-read (OBJ-1) and the note's
      central emphasis quantitatively misplaced by two to six orders of magnitude
      (OBJ-2). Had I complied with 'do not spend budget re-deriving it', both
      errors would have propagated into EV-MLKEM-021."
      That conditional is the whole finding. The outcome was good; the process
      made the good outcome contingent on a reviewer disobeying a Coordinator
      instruction. The validator likewise treated the note as a claim to check,
      confirmed both source facts, and caught CE-1 in the course of doing so.
      Both errors were caught by the reviewers, neither by me.
    corrective_rule_adopted: >-
      THE CORRECT FORM WAS A QUESTION IN THE TASK CARD, NOT A NOTE SUPPLYING BOTH
      THE ANSWER AND THE VERDICT. Concretely, for future batches of this
      campaign: (1) a Coordinator reading that bears on a pending review is
      dispatched as an interrogative in the card - "verify whether `Nf` models
      dependence between score contributions, and state what follows" - and
      never as a note that also states what follows; (2) a Coordinator note must
      not contain a budget instruction to a reviewer; (3) it must not fill any
      field of the reviewer's own report schema, and `narrowest_supported_statement`
      is the field to check that against; (4) if a note is written anyway,
      the card must say "disagree with it if you find reason to, and re-derive
      anything you intend to rely on" rather than "do not spend budget
      re-deriving it".
    what_this_defect_is_not: >-
      It is NOT a rule-9 steering finding. The note reports the reading most
      DAMAGING to the campaign's own headline - it dissolves the security reading
      of the batch's most quotable number - and it was written to sharpen the
      retry rather than to protect a result. Its errors both run in the direction
      of MY conclusion (CE-1 made the dual look maximally fragile, CE-2 supplied
      a second reason that was not sound), which is exactly why they needed an
      independent reviewer and got one.

