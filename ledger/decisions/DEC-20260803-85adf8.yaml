  # ==================================================================
  # REFUTATION ARTIFACT ACCOUNTING (required for an adverse transition)
  # ==================================================================
  refutation_artifact_accounting:
    applicability: >-
      REQUIRED AND SATISFIED. docs/claims-and-verification.md's "Refutation
      artifacts" requirement binds adverse transitions, and this decision is one:
      `weaken`. My contract requires the strongest checkable refutation artifact
      the result admits - counterexample certificate, then derivation note, then
      declared `empirical_only` - archived BEFORE the decision that relies on it.
    artifacts_offered:
      - >-
        FOR W2(i), "not one frame": the source line
        `estimator/lwe_dual.py:551`, carrying the estimator authors' own comment
        "# p.29, we're ignoring O()", beside `lwe_primal.py`'s BKZ-simulation
        costing which carries no such disclaimer. One line, re-runnable at the
        pin, no compute. Plus the arithmetic fact that Kyber-512's margin
        (0.543432) is less than 1 bit.
      - >-
        FOR W2(ii), the diagnostic: ANOM-3 margin/beta = 0.0014042 / 0.0077971 /
        0.0101919 at beta 387/589/823, computed from three numbers already in
        results.json. Anyone can redo it in one division.
      - >-
        FOR W2(iii), the decay test: a MATZOV subclass that reproduces the pinned
        optimum at delta = 0 to EXACTLY 0.000e+00 on all three sets, then
        inflates `Nf`'s output by 2^delta with full re-optimisation inside
        RC.MATZOV. Kyber-512 flips at delta ~ 2.3732; Kyber-768 +0.728911 and
        Kyber-1024 +5.233394 at N x 2^16. A CONTROLLED MUTATION, which is the
        strongest artifact this result admits, and it is reported in the
        direction it falls at all three sets rather than only where it is
        convenient.
      - >-
        FOR W3, memory: a reconstruction CALIBRATED against EV-MLKEM-020's own
        published primal figures to |delta| < 4.0e-07, yielding c_flip 0.019688 /
        none / 0.141988 and c*_matzov 0.028803 / 0.080877 / 0.040268. Its
        p^{k_fft} FFT-table term is a LABELLED INFERENCE from the pin's own time
        formula, not a quotation, and it is labelled as such.
      - >-
        FOR W4, the box bound: `fraction_attributed` 1.112888 / 1.070009 /
        0.978413 and residuals -0.484118 / -0.608231 / +0.304744, all present in
        the producer's own results.json, plus the producer's own H9 statement
        that the boxes are local.
      - >-
        FOR CE-1: the validator's recomputation of c*_matzov under EV-MLKEM-020's
        own Model A convention. One line of arithmetic from numbers already
        archived.
      - >-
        FOR CE-2: `estimator/lwe_dual.py:555` read at the pin. One line, no
        compute.
    archived_before_this_decision: >-
      YES, WITH ONE PRECISION THAT MATTERS AND IS STATED RATHER THAN GLOSSED. The
      producer package was snapshot-archived at 12e97be8e04ebf685b5ba326b01241c06eb7c8e0
      BEFORE either review read it, and both reviews verified the declared
      path_sha256 against the on-disk bytes. The two REVIEW REPORTS carrying the
      refutation artifacts are archived by THIS SAME ledger commit
      (TASK-20260803-12eab2), which is the batch's declared archival plan and the
      same arrangement BATCH-010 used: review reports and the ledger records they
      support land in one isolated commit. Consequently this decision is NOT
      DURABLE until the dispatcher's post-commit verifier accepts that commit,
      and the artifacts are durable in exactly the same instant as the decision
      that rests on them - never after it.
    proof_status_declared: derivation
    not_a_certificate_and_why: >-
      There is no certificate family here for a wrapper to re-verify: the objects
      are source facts, cost-model outputs, and controlled mutations of a cost
      formula. `derivation` is the honest tier and it is declared in
      EV-MLKEM-021. The absence of a proof object is not the failure; an
      undeclared basis would be.

