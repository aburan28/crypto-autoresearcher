      The patterns were counted in this session. That count is not a run.
      At m = 2, 4 of 16 pairs sum to 0 modulo 4 and 12 do not. The
      level-2 increment is 4. The written near-3/4 share is exactly 12
      of 16 on this alphabet. The reduced floor gap is 577 hundredths.
    - >-
      origin/main was already contained in HEAD. origin/main was
      f462195707b5f4ac424eea37a0058147a60df714.
