      v12 [never launched, wiring bugfix], v13 through v21 [tenth through
      seventeenth restarts], v22 [eighteenth restart], and v23, this record).
      The restarting-instance count (eighteen consecutive, under
      driver-v2.py/checker-v2.py) is not in dispute between the two framings
