    than an in-guest OOM-kill) and closed NA-4 without further condition. This
    coordinator's task context explicitly instructs it not to invent a new
    blocking precondition absent a concrete, well-reasoned basis DEC-20260921-8aa5cf/
    DEC-20260921-8e20f0 did not already cover. This coordinator independently
    considers whether RUN-FROB-4b8e05's own diagnosis -- an EIGHTEENTH,
    CONSECUTIVE instance of the SAME whole-environment-restart signature, with
    its own widest-yet detection gap -- supplies such a basis, and finds that
