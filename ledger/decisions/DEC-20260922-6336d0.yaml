    coordination/frobenius/BATCH-2f8435/stage0-v22-retry-TASK-20260921-9b3836/dispatch_queue.json)
    was admitted under that authorization and launched genuinely at
    2026-09-21T22:06:42.795098Z. RUN-FROB-4b8e05 ran with confirmed genuine
    progress -- a growing roots.jsonl.gz, last observed write at
    2026-09-22T01:08:29.082602222Z, final size 2443452479 bytes (2.44GB), sha256
    cebad2c6a5e4f7b1f5ddee428fe4796464180cbebe31130d82d7b5392bb24f3a -- for at
    least 3h01m46s, THE LARGEST PARTIAL OUTPUT EVER PRODUCED IN THIS LANE'S
    HISTORY BY SIZE, with a confirmed-genuine duration floor nearly identical
    to (marginally below) the seventeenth restart's own 3h01m55s floor. This
    is noted only as an observation, not a trend. Because that output file
    (2443452479 bytes) exceeds GitHub's 100MiB per-file limit and git-lfs is
    not installed in this execution environment, it was disclosed via the
    established oversized-artifact-pointer.json pattern
    (experiments/EXP-FROB-d8aa37/runs/RUN-FROB-4b8e05/roots.jsonl.gz.oversized-artifact-pointer.json)
    rather than committed directly. The confirmed reboot was detected via
    who -b / /proc/uptime at approximately 2026-09-22T04:21:25Z, a gap of
    roughly 3h12m56s after the last observed write -- THE WIDEST GAP disclosed
    anywhere in this lane's history, exceeding even the seventeenth restart's
    own ~1h57m00s gap and the thirteenth restart's own ~2h12m gap -- so
    RUN-FROB-4b8e05's own true survival interval is, like the twelfth through
    seventeenth restarts' own, honestly ambiguous rather than resolved by
    assumption: bounded [~3h01m46s, ~6h14m42s]. This wide gap is disclosed, in
    the dispatching session's own diagnosis, as resulting partly from that
    session's own deliberate widening of its monitoring cadence to 15 minutes
    after ~3 hours of sustained health (matching the same pattern that also
    widened RUN-FROB-6d29ae's own gap), combined with an unexplained
    additional gap whose cause -- a missed scheduled wakeup, or the whole
    session/environment itself being reclaimed during inactivity before the
    user's own /run command resumed it -- could not be determined from any
    surviving evidence. No execution-receipt.json was ever produced.
    TASK-20260921-9b3836's claim (which held RUN-FROB-4b8e05's write_scope)
    has already been released as failed with this same disclosure
    (coordination/frobenius/BATCH-2f8435/stage0-v22-retry-TASK-20260921-9b3836/claims/TASK-20260921-9b3836.1.release.json),
    and RUN-FROB-4b8e05's run directory (command.txt, environment.json,
    launch.json, roots.jsonl.gz.oversized-artifact-pointer.json [the FULL
    2443452479-byte roots.jsonl.gz itself is NOT committed, per the pointer's
    own disclosure], stdout.log, stderr.log, tuples.jsonl.gz) and the
    diagnosis/preservation record were already committed and pushed in commit
    52f69b89e, prior to this engagement -- this record does not touch that
    directory again.
    THIS COORDINATOR INDEPENDENTLY READ, IN FULL, VIA ITS OWN Read TOOL IN
    THIS ENGAGEMENT: DEC-20260921-8e20f0.yaml (this record's own immediate
    predecessor and structural template, in full, including its own
