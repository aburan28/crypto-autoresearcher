  the_decision_stated_plainly: >-
    RUN-FROB-4b8e05's interruption is diagnosed, honestly and without
    fabrication, as the SAME failure family that destroyed all seventeen of
    its predecessors under driver-v2.py/checker-v2.py: a whole-environment
    restart external to any script's own control, external to any timeout
    wrapper (there was none this time either), and external to any code
    defect in driver-v2.py/checker-v2.py. This is the EIGHTEENTH, CONSECUTIVE
    instance of the identical infrastructure failure family under the same,
    already-corrected source and launch procedure, and is cited in full via
    commit 52f69b89e's own committed artifacts (the release record and the
    oversized-artifact-pointer.json). Its own survival duration is honestly
    ambiguous rather than resolved by assumption: a confirmed floor of at
    least 3h01m46s and an upper bound of approximately 6h14m42s if the process
    continued silently until the confirmed reboot, separated by a ~3h12m56s
    monitoring gap (the WIDEST disclosed in this lane's history). This record
    does not resolve that ambiguity by assumption. This uncertainty is itself
    infrastructure/observability signal, never negative mathematical evidence
    about H-FROB-73df22 (AGENTS.md core rule 3 / CLAUDE.md rule 3).
    Separately and centrally: DEC-20260921-8aa5cf's NA-4 evidentiary
    precondition was already satisfied and CLOSED by DEC-20260921-8e20f0. This
    coordinator does NOT reopen it. It independently examined whether
    RUN-FROB-4b8e05's own diagnosis -- including its own widest-yet detection
    gap, itself disclosed as arising from the same monitoring-cadence pattern
    already discussed for RUN-FROB-6d29ae plus an honestly unresolved residual
    ambiguity -- supplies new grounds or a materially different failure
    signature warranting reopening NA-4, and finds that it does not: the same
    whole-microVM-restart signature recurs, and the residual gap-cause
    ambiguity is a further instance of findings.md's own Finding 1 (no
    forensic log survives any restart in this environment, by construction),
    not a new question. NA-4 REMAINS CLOSED.
    On that basis, this coordinator (1) makes no change to RUN-FROB-4b8e05's
    directory -- already committed and pushed exactly as found (commit
    52f69b89e), including the oversized-artifact-pointer.json disclosure for
    its 2443452479-byte roots.jsonl.gz -- and (2) authorizes a fresh retry
    under a fresh, coordinator-proposed (NOT yet allocate_id.py-confirmed)
    run_id, RUN-FROB-7b3e6d, via a fresh trial-plan-stage0-v23.json, a fresh
    run-binding, and a fresh launch handoff to the Executor
    (TASK-20260922-44dc30), per the user's standing instruction to keep
    retrying automatically through this exact recurring failure mode -- and
    (3) does NOT install a further blocking evidentiary precondition on the
    NEXT authorization beyond this one. This coordinator REAFFIRMS, and does
    NOT re-litigate, DEC-20260921-8e20f0's own NA-4-successor recommendation
    (driver-v2.py checkpoint/resume capability, non-blocking, tooling only)
    below, and EXTENDS it lightly given that RUN-FROB-4b8e05's own upper-bound
    duration (~6h14m42s) is now this lane's largest amount of confirmed-or-
    plausible genuine compute lost outright to a single restart to date.

  rationale:
    - >-
      EIGHTEENTH, CONSECUTIVE INSTANCE OF THE SAME FAILURE FAMILY, STILL
      INFRASTRUCTURE/PROTOCOL SIGNAL, NEVER NEGATIVE MATHEMATICAL EVIDENCE,
      PER AGENTS.md CORE RULE 3 / CLAUDE.md RULE 3. RUN-FROB-4b8e05's
      resulting run-directory shape (real, partial scientific output --
      2443452479 bytes of roots.jsonl.gz, THE LARGEST PARTIAL OUTPUT EVER
      PRODUCED IN THIS LANE, disclosed via the oversized-artifact-pointer.json
      pattern since it exceeds GitHub's 100MiB limit and git-lfs is
      unavailable -- no execution-receipt.json, entire process tree including
      the Python supervisor destroyed before any receipt-writing logic could
      run) matches every one of its seventeen predecessors under
      driver-v2.py/checker-v2.py. Eighteen-for-eighteen launch attempts under
      that source have now been killed by whole-environment restarts, all
      non-scientific, non-protocol infrastructure signal. None of
      RUN-FROB-4b8e05 or any predecessor says anything about H-FROB-73df22,
      RQ-FROB-7d8dd4, or whether Frobenius structure moves the index-calculus
      exponent.
    - >-
      THIS EIGHTEENTH RESTART'S OWN NOTABLE FEATURES: SECOND-LONGEST CONFIRMED
      GENUINE PROGRESS WINDOW AND THE WIDEST DETECTION GAP IN THIS LANE'S
      HISTORY. RUN-FROB-4b8e05's last confirmed write
      (2026-09-22T01:08:29.082602222Z, roots.jsonl.gz at 2443452479 bytes)
      establishes a floor of at least 3h01m46s of genuine progress -- nearly
      identical to, though marginally below, the seventeenth restart's own
      3h01m55s floor, noted only as an observation, not a trend. The gap
      itself (last write to confirmed reboot, ~3h12m56s) is the WIDEST
      disclosed in this lane's history, exceeding both the seventeenth
      restart's own ~1h57m00s gap and the thirteenth's own ~2h12m gap, so this
      eighteenth point's true interval cannot be narrowed below
      [~3h01m46s, ~6h14m42s]. This record explicitly declines to assume
      either bound as fact and carries the range forward honestly, consistent
      with this lane's established practice for the twelfth through
      seventeenth restarts.
    - >-
      NA-4 REMAINS CLOSED; THIS RECORD REAFFIRMS RATHER THAN REOPENS IT, ON
      ITS OWN MERITS, NOT BY MECHANICAL DEFERENCE. DEC-20260921-8e20f0 already
      independently engaged with findings.md's three findings and judged NA-4
      satisfied. This coordinator's own task context explicitly instructs it
      not to invent a new blocking precondition absent a concrete,
      well-reasoned basis the prior two decisions did not already cover.
      This coordinator examined the one candidate for such a basis --
      RUN-FROB-4b8e05's own widest-yet detection gap and its partly
      self-disclosed, partly unresolved cause -- and finds it is NOT such a
      basis: the widened gap's disclosed proximate cause (monitoring cadence
      deliberately widened after sustained health) is the SAME pattern
      already discussed for RUN-FROB-6d29ae, and the residual, unresolved
      portion of the gap (whether a scheduled wakeup was missed, or the
      session/environment itself was reclaimed) is a further, honestly
      disclosed instance of exactly the structural evidentiary gap findings.md's
      own Finding 1 already described (no forensic log survives a restart in
      this environment, by construction) -- not a new or materially different
      failure signature bearing on the memory_mb=8192 question NA-4 actually
      asked. Eighteen consecutive infrastructure-only interruptions with
      continuous genuine progress each time is exactly the pattern CLAUDE.md's
      "Research budgets: progress first" and the user's own standing
      "keep retrying automatically" instruction are meant to keep moving, not
      a basis for a new gate.
    - >-
      OVERSIZED-ARTIFACT HANDLING WAS AGAIN NEEDED, AT AN EVEN LARGER SIZE.
      RUN-FROB-4b8e05's roots.jsonl.gz (2443452479 bytes, ~2.44GB) exceeds
      GitHub's 100MiB per-file limit; git-lfs remains unavailable in this
      execution environment. This was disclosed via the established
      roots.jsonl.gz.oversized-artifact-pointer.json pattern (size_bytes,
      sha256, last_modified_local, reason_not_committed, lfs_available_in_this_environment
      all recorded), consistent with RUN-FROB-6d29ae's (seventeenth restart),
      RUN-FROB-d05e7a's, RUN-FROB-9c4e81's, RUN-FROB-b8e451's, and
      RUN-FROB-35c3b1's own precedent. This is a difference in file size only,
      not a scientific or protocol difference, and is by far this lane's
      largest partial output to date -- roughly correlating with, though not
      proving, the driver producing output at a roughly steady rate over the
      confirmed floor.
    - >-
      THE RUNTIME LOCK BEING CITED REMAINS THE SAME, STILL-CURRENT, STILL-
      UNEDITED, LAUNCH-AUTHORIZED LOCK. This coordinator carries forward
      linux-runtime-lock-successor-20260914-c85f6a.json's content sha256
      (46d918a1a4b9d358df39f09a87d5221128cc1ce19cb62672bc35204785952eb5)
      unchanged from trial-plan-stage0-v22.json's and
      run-binding-stage0-v22-retry-20260921.json's own already-filled
      runtime_lock_sha256 fields (all agree, re-read directly in this
      engagement). Nothing about the runtime, its guards, or its
      authorization changes here; an eighteenth whole-machine restart is not
      evidence the runtime lock's own guards were inadequate against a class
      of event (whole-machine restart) no per-process guard in that lock
      claims to protect against.
    - >-
      WATCHDOG AND MEMORY SIZING RATIONALE REMAIN VALID, UNCHANGED, AND ARE
      NOT REVISED BY THIS RECORD. No evidence obtained since DEC-20260921-8e20f0's
      own findings.md engagement motivates reducing memory_mb below 8192; the
      dispatching session's own diagnosis of this eighteenth restart continues
      to point at an external, platform-level cause (widened monitoring
      cadence plus an unresolved additional gap) rather than at any in-guest
      memory pressure. Lowering memory_mb now would be an unmotivated protocol
      change and would itself require a justified additive amendment this
      record does not have grounds for. The 86400s (24h) watchdog ceiling
      remains sized generously above the longest duration this lane can
      currently establish under any reading -- even this eighteenth restart's
      own upper (~6h14m42s) bound, this lane's own new widest-gap point,
      remains far short of it -- and remains machine protection only per
      CLAUDE.md "Research budgets: progress first".
    - >-
      DIRECTION CHECK, unchanged from the whole DEC-20260909-bf5b48 ..
      DEC-20260921-8e20f0 chain. Stage0 is not itself exponent-moving; it is
      the correctness gate for H-FROB-73df22's two arms. No scientific claim
      of any kind is advanced by this admission/retry-authorization record.
      FROB is a declared ECC area (orchestration/research-priority.yaml),
      ranked ahead of non-ECC candidates at every selection point, with
      unlimited batch/wall-clock budget per AGENTS.md "ECC comes first."
    - >-
      BUDGET. Per CLAUDE.md "Research budgets: progress first" (2026-09-06):
      research cost estimates are advisory and require no repeated user
      approval; the Coordinator continues justified work within the
      authorized research scope. No 90-day stagnation review is active or
      warranted. Authorizing a further retry after an eighteenth, consecutive
      infrastructure-only interruption, with its evidentiary precondition
      already satisfied and reaffirmed rather than reopened, is exactly the
      kind of routine continuation CLAUDE.md's "progress first" instruction
      protects. This is additionally covered by the user's own standing
      instruction to keep retrying automatically through this exact recurring
      failure mode. A whole-machine restart mid-run is squarely within
      "watchdog expiry checkpoints a task; it does not exhaust the campaign."
    - >-
      NA-4 IS REAFFIRMED CLOSED, NOT RE-ESCALATED, AND NO NEW BLOCKING
      PRECONDITION IS INSTALLED ON THE NEXT RETRY. Having independently
      examined this eighteenth restart's own diagnosis and found no new
      grounds or materially different failure signature, this coordinator
      explicitly declines to manufacture a further blocking condition on the
      next authorization merely to appear rigorous -- doing so would
      functionally cap unlimited ECC research spending by indefinite
      precondition-accretion, contrary to AGENTS.md "ECC comes first" and
      CLAUDE.md "Research budgets: progress first," and contrary to the
      good-faith-pursuit duty in AGENTS.md core rule 9 not to steer away from
      a plausible high-value lead. Instead, this record REAFFIRMS and lightly
      EXTENDS DEC-20260921-8e20f0's own NA-4-successor recommendation
      (non-blocking, forward-looking, tooling only), informed by
      RUN-FROB-4b8e05's own upper-bound duration (~6h14m42s) now being this
      lane's largest single amount of confirmed-or-plausible genuine compute
      lost outright to one restart to date.
    - >-
      TWO DIVERGENT COUNTS, REPORTED HONESTLY AND SEPARATELY, CONSISTENT WITH
      THIS CHAIN'S OWN PRIOR NUMBERING, WITH ONE DISCLOSED DISCREPANCY. Per
      DEC-20260921-8e20f0's own established counting convention (which this
      coordinator carries forward as authoritative, having independently
      re-read that record in full), RUN-FROB-4b8e05 was the NINETEENTH
      genuine launch attempt overall (counting RUN-FROB-2404fa, under the
      pre-fix driver.py, as this lane's first) and the EIGHTEENTH under
      driver-v2.py/checker-v2.py; this record's own authorization,
      RUN-FROB-7b3e6d, is accordingly the TWENTIETH genuine launch attempt
      overall and the NINETEENTH under driver-v2.py/checker-v2.py. The
      dispatching session's own task-framing prose in this engagement instead
