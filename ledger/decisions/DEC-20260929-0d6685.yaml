    - {record: H-SEMBIN-d8c4fe, from: none, to: approved}
  status_transitions_note: >-
    No other status moves. H-SEMBIN-934774, EXP-SEMBIN-e76704,
    EV-SEMBIN-c71cad and KN-OPEN-7f0511 are untouched. No goal status or
    completion criterion changes, and approving a contract is not progress
    against any criterion of GOAL-SEMBIN-fcb7a2.
  official_until: >-
    Not official until the NA-1 commit is verified against Git and pushed to
    a branch with an open PR against main.
  asserts_nothing_about: >-
