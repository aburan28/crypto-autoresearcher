coordinator_decision:
  id: DEC-20260929-0d6685
  id_provenance: >-
    Pre-minted and --check verified by the top-level session on 2026-09-29,
    together with IDEA-20260929-688ea4, H-SEMBIN-d8c4fe, EXP-SEMBIN-473340,
    TASK-20260929-3b3e0b, RUN-SEMBIN-3a4248 and the archive task
    TASK-20260929-d98ee8. This Coordinator holds no shell and minted nothing.
  recorded_at: '2026-09-29'
  decided_at: '2026-09-29'
  decided_by: coordinator
  goal_id: GOAL-SEMBIN-fcb7a2
  question_ids:
    - RQ-DREG-bd6c86
  question_choice: >-
    RQ-DREG-bd6c86 is the question research/FFD_SEMAEV_MEASUREMENT1.md was
    measured for: its header names it, and section 0 cites that question's
    support-matched null requirement. The re-measurement is ordered by
    DEC-20260929-d75c82 NA-3 under GOAL-SEMBIN-fcb7a2, which is the goal
    recorded here. RQ-SEMBIN-9e8f82 (Nagao coset shift) is related and is
    not the question the table answers. No goal record lists
    RQ-DREG-bd6c86. That is recorded here and not repaired.
  standing_authorization: >-
    AGENTS.md "Standing user authorization for ideas and experiments" (user,
    2026-09-06: "all is approved. ideas/experiments should be always
    approved"). The top-level session relayed the user's in-session
    "continue" of 2026-09-29, given after the user was told this
    re-measurement was the next step. Approval is permission to run a
    complete protocol. It asserts nothing about the hypothesis and validates
    no result.

  decision: approve
  decision_label: >-
    Approve EXP-SEMBIN-473340 version 1 (status approved, approved_by
    coordinator) for one execution as RUN-SEMBIN-3a4248. Approve
    H-SEMBIN-d8c4fe as well-formed and worth testing. Dispatch
    TASK-20260929-3b3e0b to the executor only after the NA-1 commit of these
    five records verifies.

  context: >-
    DEC-20260929-d75c82 found that the program's first-fall instruments,
    including research/verification/ffd_semaev_core.py, build m*f as a set-OR
    of monomials rather than the Boolean-ring product
    (CORR-20260929-616d03). It ruled that the "Semaev pinned at 2 versus null
    climbs" comparison of FFD_SEMAEV_MEASUREMENT1 section 2 is unverified and
    may not be cited until re-measured (NA-3). A corrected instrument has
    now been written under NA-2 and committed at be6c822cb5 (session
    report): experiments/EXP-SEMBIN-473340/src/. The session reports that its
    tests all pass. No run of the re-measurement exists.

  target_ids:
    - IDEA-20260929-688ea4
    - H-SEMBIN-d8c4fe
    - EXP-SEMBIN-473340
    - TASK-20260929-3b3e0b
    - RQ-DREG-bd6c86
  identifiers_reserved:
    - {id: RUN-SEMBIN-3a4248, note: run id for the executor; the directory must not exist before the pre-launch gate}
    - {id: TASK-20260929-d98ee8, note: post-run snapshot archive of the run directory; minted and checked by the session on 2026-09-29; no record written yet}

  protocol_readiness:
    checked_against: templates/research-records.md "Experiment" and "Hypothesis" blocks; tools/validate_ledger.py REQUIRED and the approved-experiment checks
    fields_non_null_or_explicitly_not_applicable: >-
      id, hypothesis_id, version, title, status, objective, launcher,
      pre_launch_gate, inputs (four pinned sources plus the gate's external
      dependency, pinned), controls C1 to C4, independent_variables, metrics,
      heuristic_under_test (explicit not_applicable), preregistered_prediction
      (quantity, formula, source), scoring_rule (censoring, per-P rules,
      aggregation), interpretation_map, scale_relevance, tail_checks,
      replication, budget (all six fields non-null), stopping_rules,
      invalidation_rules IR-1 to IR-9, success_criterion,
      falsification_criterion, required_artifacts, assigned_to, approved_by.
    predictions_fixed_before_execution: >-
      Yes. P1 to P3 are MEASUREMENT1's own published claims of 2026-09-16,
      transcribed with their operational reading fixed by the published table.
      None was read off the corrected instrument on these cells. The
      instrument-development facts this Coordinator was given concern test
      fixtures at (n, n') = (6,3) with fixed basis [1,2,4], seed 603 and
      generators reduced to an independent subset. That is a different
      system from every MEASUREMENT1 draw, which uses a random basis, seeds
      47907..47916 and unreduced generators. One identity value there carries
      negligible information about the scored medians. It is disclosed
      rather than claimed to be zero.
    source_pinning: >-
      sha256 of the four src/*.py files and of the gate's external dependency
      boolring.py were computed by the session on 2026-09-29 and relayed.
      This Coordinator did not compute them.
    transcription_check: >-
      This Coordinator compared remeasure.PUBLISHED against
      MEASUREMENT1 section 2 and ffd_semaev_measure_results.txt: 16 of 16
      distributions match. It compared remeasure.indep_basis and the loop
      against research/verification/ffd_semaev_measure.py: seeds, draw
      counts, the s == 0 null matching and Dmax = min(N, 6) match. It also
      checked that legacy_or_fall_profile reproduces the original
      fall_profile row construction and differencing. This was a reading
      check. The executed check is C1.
    proof_search_map: >-
      not_applicable_reason is set on H-SEMBIN-d8c4fe and IDEA-20260929-688ea4.
      This is an empirical re-measurement with no theorem, bound or reduction
      claimed, so the KN-TECH-080 gate does not apply.
    target_profile: >-
      Not exponent-moving (docs/target-result-profile.md). It is admitted as
      a cheap corrective measurement that DEC-20260929-d75c82 made a
      precondition for citing any first-fall-degree result on this lane. It
      needs one single-threaded process and no new implementation. No
      conditional result is dispatched, so the heuristic-validation pairing
      rule does not apply.

  rationale:
    - >-
      The protocol is complete, and the predictions are genuinely prior to
      the data. They are the defective instrument's published claims, so the
      run TESTS whether those claims survive the correction instead of
      fitting new ones. Each of the six outcomes (P1 to P3 by reduced and
      formal) is scored separately by a mechanical rule written now. The rule
      handles censored (None) values, which the runner's own medians silently
      drop.
    - >-
      Control C1 turns the superseded instrument into a useful tool. It must
      reproduce the published table exactly, which pins the systems, seeds,
      draw counts and RNG behaviour to MEASUREMENT1's. The reduced convention
      then differs from legacy in the product ONLY. A P2_reduced or
      P3_reduced failure is therefore attributable to the product error, and
      "null climbs" would be shown to have been an artifact. The formal
      convention also changes the row filter, so a failure there is not
      attributed to the product alone. The spec says so.
    - >-
      C2 (the pre-launch gate) is the check that DEC-20260929-79ba35's C1
      could not be: it tests the product against its definition. It covers
      u0u1*(u0+u1) = 0, explicit span enumeration, and the validator's
      independent kernel for the reduced convention, and the
      counterexample [1,2,4,13,26] is a regression fixture. That discharges
      the unit-test and fixture requirements of DEC-20260929-d75c82 NA-2. It
      does not discharge the rest of NA-2 (see next_actions NA-6).
    - >-
      Every quantity names its definition, field-equation handling and
      product (DEC-20260929-d75c82 NA-4). Neither convention is asserted
      equal to a numbered literature definition, and the formal convention's
      docstring claim of equality with the {f} union S_fe filtration is
      explicitly not adopted.
    - >-
      Cost is negligible: one process, 280 systems of at most 8 variables,
      with a 24-hour watchdog and a 4 GB ceiling as machine protection only.

  definitional_finding:
    status: >-
      Recorded here as a scope note. It is an instrument unit-test result on
      one instance, not a protocol measurement and not evidence. It becomes
      an archived artifact when prelaunch_test.log is snapshot-archived by
      TASK-20260929-d98ee8. EV-SEMBIN-c71cad and DEC-20260929-d75c82 are not
      edited. The refinement goes into a later correction record (NA-5).
    instance: >-
      Semaev (n, n') = (6, 3), basis [1, 2, 4], x_R = a_real_xR(6, 1, 1,
      random.Random(603)), reduced to 5 independent generators. Identity
      [1,2,4,8,16]; witness M = [1,2,4,8,26], whose generator h4 is the
      unique one of degree 1 (test_boolean_macaulay.py section 4).
    three_observables_plus_def1: >-
      (a) Nagao 2013/549 Definition 1 on bare generators: identity 2,
      witness 3, through a Koszul syzygy (validator, non-blind;
      EV-SEMBIN-c71cad). (b) Nagao Definition 1 with S_fe as generators:
      witness 2, so no separation (validator; EV-SEMBIN-c71cad observation
      (b)). (c) Differencing observable, reduced convention, XOR product:
      identity 2, witness 3 (gate fixtures). (d) Differencing observable,
      formal convention, XOR product: identity 2, witness 3 (gate fixtures).
      The Definition 1 fall element at D = 2,
      sum_{j in supp h4} u_j * h4 = h4, exists (asserted by the gate). But
      h4 is already in V_1, since formal lowdim(2) = dim V_1 = 1, so it is
      not a NEW fall under differencing.
    consequence: >-
      The statement "the separation disappears once the field equations are
      generators" (EV-SEMBIN-c71cad observation (b) and inference;
      DEC-20260929-d75c82 rationale item 4(b) and its KN-OPEN-7f0511 (A)
      paragraph) holds for Nagao Definition 1. It does NOT hold for the
      differencing observable in the formal convention, where the witness
      still separates 2 -> 3. The two statements concern different
      observables and do not contradict each other. KN-OPEN-7f0511 (A)
      remains unresolved in both directions, and this finding resolves
      nothing there.
    limits: >-
      One instance. Non-blind: the same session wrote the instrument and the
      test. The formal convention's equality with the F_2[u] Macaulay
      filtration of {f} union S_fe is not established. The session reported
      the gate's pass. This Coordinator read the assertions, not their
      output.

  coordinator_prior:
    recorded_before_any_run: true
    note: >-
      These are subjective expectations recorded for pre-commitment. They
      are not predictions, are not scored, and are not evidence.
    C1: >-
      Expected to pass (about 0.9). The code is verbatim. The residual risk
      is CPython random-stream drift between versions.
    P1_reduced: >-
      Expected to hold (about 0.75). The validator reported identity values
      unchanged under the true product at n' in {2,3} for a fixed basis.
      n' = 4 was never checked.
    P1_formal: >-
      Expected to hold (about 0.8). The section 3a combination is a
      generator-only (m = 1) row, so in the formal convention it is a new
      fall at D = 2 whenever it is nonzero and no generator has degree <= 1.
      I also expect no more Semaev 3s under formal than under reduced. That
      expectation is weaker and is not scored.
    P2_P3_both_conventions: >-
      Genuinely uncertain (about 0.5 each), with no directional prior strong
      enough to state. The set-OR product's monomial set contains the XOR
      product's, so correction admits more low-degree rows at each D. That
      could move null falls earlier, which puts P2_reduced at risk, but it
      also enlarges V_{D-1}. A P2 or P3 failure would be the most
      informative outcome, since it would withdraw a comparison other
      documents lean on.

  evidence_refs:
    - research/FFD_SEMAEV_MEASUREMENT1.md (read in full)
    - research/verification/ffd_semaev_measure.py and ffd_semaev_measure_results.txt (read in full; published medians and deficits)
    - ledger/decisions/DEC-20260929-d75c82.yaml (read in full; NA-2, NA-3, NA-4)
    - ledger/corrections/CORR-20260929-616d03.yaml (read in full; scope_of_effect.ffd_semaev_measurement1)
    - ledger/evidence/EV-SEMBIN-c71cad.yaml (read in full; observations (a) to (d))
    - experiments/EXP-SEMBIN-473340/src/boolean_macaulay.py, remeasure.py, test_boolean_macaulay.py, ffd_semaev_core_v1.py (read in full)
    - ledger/questions/RQ-DREG-bd6c86.yaml and RQ-SEMBIN-9e8f82.yaml (read in full)
    - experiments/EXP-SEMBIN-e76704/specification.yaml, ledger/hypotheses/H-SEMBIN-934774.yaml, ledger/decisions/DEC-20260929-79ba35.yaml, ledger/handoffs/TASK-20260929-9dbd8a.yaml (structural precedent)
    - templates/research-records.md; tools/validate_ledger.py (REQUIRED, check_citations, check_prior_art, check_experiment, check_run)

  limitations:
    - >-
      Toy tier. The null is matched on degree profile only, and the
      block-multiaffine null (MEASUREMENT1 N1) is not run. d_ff is not the
      solving degree. The re-computation uses MEASUREMENT1's own systems,
      whose null draws share seeds across cells.
    - >-
      The formal convention has no independent-kernel check, only
      brute-force span agreement at N = 3. The blind re-derivation (NA-3
      below; DEC-20260929-d75c82 NA-5) is the check that could see a shared
      definitional error.
    - >-
      This Coordinator has no shell. It ran nothing, parsed none of the
      written YAML, did not run tools/validate_ledger.py or
      tools/autoresearch_focus.py, did not compute any hash, and did not
      observe the gate pass (session-reported).
    - One model family serves every role by runtime inheritance. Session independence is real; model independence is not claimed.

  next_actions:
    - id: NA-1
      first_next_action: true
      role: top-level session (dispatcher)
      text: >-
        Parse the five records written here and run
        python3 tools/validate_ledger.py. Fix any error attributable to them
        by editing only these still-uncommitted files, never tools or existing
        records. Confirm that the four src/*.py sha256 values at HEAD still
        equal the specification's. Merge origin/main into
        claude/regularity-growth-ecdlp-31utms (merge, never rebase). Then
        commit ALONE, staging exactly
        experiments/EXP-SEMBIN-473340/specification.yaml,
        ledger/proposals/IDEA-20260929-688ea4.yaml,
        ledger/hypotheses/H-SEMBIN-d8c4fe.yaml, this decision and
        ledger/handoffs/TASK-20260929-3b3e0b.yaml, with every record id in
        the message. Verify the receipt, push, and open or refresh the PR
        against main naming them. Claim the lane with tools/goal_lanes.py
        before launch. Until the commit verifies, this approval is not
        official and the executor may not launch.
    - id: NA-2
      role: executor, via TASK-20260929-3b3e0b
      text: >-
        After NA-1, from a clean checkout of the approved commit, run the
        pre-launch gate and then the launcher, once each. Write the run
        record and return without interpreting.
    - id: NA-3
      role: coordinator
      text: >-
        Snapshot-archive the run directory alone as TASK-20260929-d98ee8,
        then push. Then write a review_plan and dispatch an independent
        validator (review-adversarial, xhigh, independent session). The
        validator owns IR-1 to IR-9, C1 to C4, and an independent application
        of scoring_rule from results.json, with its own scorer. A blind
        re-derivation owns the observable: it recomputes, from the
        specification's written inputs.observable_naming_NA4 definitions and
        its written inputs.system_construction, the
        reduced and formal d_ff of at least the s = 0 Semaev system and 5
        null systems at (4,3) and at (6,4). blind_from covers
        experiments/EXP-SEMBIN-473340/src/boolean_macaulay.py,
        experiments/EXP-SEMBIN-473340/runs/, and
        experiments/EXP-SEMBIN-e76704/validation/. The coordinator_prior
        above is the recorded prior for that plan.
    - id: NA-4
      role: coordinator
      text: >-
        After review, write a new EV-* record (id minted then) with
        claim_tier toy and proof_status empirical_only. Record the six
        outcomes per convention, never pooled, with naming per NA-4 of
        DEC-20260929-d75c82. Write an evidence decision filling
        knowledge_promotion. Corrected values reach readers of MEASUREMENT1
        through that record or a new superseding note, and the note itself
        is never edited. A C1 failure or infrastructure failure is recorded
        as such and is re-attempted only under SR-2.
    - id: NA-5
      role: coordinator
      text: >-
        After TASK-20260929-d98ee8 archives prelaunch_test.log, author a
        correction record (new CORR id, session-minted) carrying the
        definitional_finding above as a scope note on EV-SEMBIN-c71cad
        (observation (b) and inference) and on DEC-20260929-d75c82 (rationale
        item 4(b) and the KN-OPEN-7f0511 (A) paragraph). The note says that
        "separation vanishes with field equations" holds for Nagao
        Definition 1 and not for the formal-convention differencing
        observable. Neither record is edited.
    - id: NA-6
      role: coordinator (later ranking; not dispatched here)
      text: >-
        The rest of DEC-20260929-d75c82 is still open. From NA-2: the
        successor hypothesis to H-SEMBIN-934774, meaning the recombination
        counts with the corrected product, Definition 1 on bare generators
        and with S_fe, Koszul-only falls reported separately, and a
        satisfiable instance family. Also NA-5 (blind re-derivation of the
        recombination witness and counts) and NA-6 (goal checkpoint).
        MEASUREMENT1's own N1 (block-multiaffine null) and N3 (n' = 5 to 6)
        also remain unranked successors.
    - id: NA-7
      role: coordinator, with the session minting the shard id
      text: >-
        After NA-1 verifies, write a write-once checkpoint shard for
        GOAL-SEMBIN-fcb7a2 under ledger/goals/GOAL-SEMBIN-fcb7a2/checkpoints/
        recording exactly one next action: execution of TASK-20260929-3b3e0b.
        DEC-20260929-d75c82 NA-6's checkpoint was never written. This shard
        stands in for it and states that the instrument part of that
        decision's NA-2 is delivered while its recombination part is not.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Approval decision. No evidence record is reviewed and no result exists.
      The definitional finding is a single non-blind unit-test instance and
      goes to a correction record (NA-5), not to KN-FIND.

