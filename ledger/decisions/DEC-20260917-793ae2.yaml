  scoped_claim_this_decision_authorizes: >-
    PHRASED PER THE NEGATIVE-RESULT RULES OF docs/evidence-and-reproducibility.md.
    Over the tested instances, parameters, instruments and budget -- p = 2 at
    (n, n') in {(11,6), (13,7), (7,3), (11,4), (13,5)} for every lambda of exact
    degree 2..7 (1260 candidates); 1200 seeded K-coefficient draws at n = 11 and
    13; the complete-splitting sweep over prime n in {7,...,31} with
    2 <= n' <= 15, n' < n, n' not dividing n and 2 <= d <= 8 (42244 candidates);
    the n = 131 census over F_2[z]/(z^131 + z^13 + z^2 + z + 1) at n' in
    {33, 44, 66} for every non-linearized F_2-coefficient lambda of exact degree
    3..7 (732 candidates); and, from independent review only, p in {3,5,7} at
    n <= 13 with n' <= 8 and degree 2..4 (291997 candidates) plus 2400
    K-coefficient draws at odd p -- NO lambda was observed with
    N_K(L) > max(d^{q+1}, p^{n'-r}), and NO completely splitting L with r >= 1 was
    observed with beta < n/(n + n' - r). The largest ratio N/bound observed
    anywhere is exactly 1, attained at (7,3) by lambda = X^2 + X; the largest N at
    n = 131 is 132 against a ceiling of 2401 and against the 2^33 a complete
    splitter at n' = 33 would require.
    These observations do NOT prove that (A) or (B) holds for every p, n, n' and
    lambda: the general statement rests on the derivation, which three independent
    sessions attacked at six named joints and did not break. They do not prove
    that all parameterizations fail, that all related representations fail, that
    no undiscovered structure exists, or that no future algorithm exploits the
    mechanism. They establish nothing about any deployed curve -- no curve, group
    or point was constructed anywhere in this contract -- and they move no attack
    exponent; rho on ECC2K-130 stands at 2^60.9 (KN-LIT-096), untouched.
    RQ-QSP-f9bbdb decision target (a), an existence result at n' = 33, is answered
    NEGATIVELY ON THE 732 ENUMERATED CANDIDATES AND ON NOTHING ELSE.
    THE CLOSURE READING (E) IS NOT SUPPORTED AND ITS STATED REASON IS REFUTED:
    (E) excludes a cheap solver by citing kappa = 4.876, which both frozen sources
    give as an UPPER bound on the solver exponent
    (inputs/EULER-PETIT-2019-QSP/paper_fulltext.md:2597, "currently majored by
    4.876"), where the exclusion needs a LOWER bound of 130/131 = 0.9924 at
    n = 131 -- a margin of 0.76% over H1's own assumption, not a factor of five.
    THE EXPERIMENT'S OWN HEADLINE IS CORRECTED to: "732 exact counts at n = 131,
    546 of them certificate-bearing, under two independent determinations at
    Stage 1 over a shared primitive base and one instrument at n = 131."

  limitations:
  - >-
    Ten of the 65 complete splitters, all at (31, 5, d = 8), rest on instrument I2
    alone under the ratified AMD-20260917-001; they are the only 10 of 65 with a
    single non-null instrument. Reported that way and never again as "14 of the
    356 near-complete candidates" without it.
  - >-
    720 of the 732 census rows at n = 131 (98.4%) are single-instrument, verified
    in one direction only by a re-verifier that can falsify a listed root and
    cannot detect a missing one. Twelve affine rows now carry an independent
    determination; the blind re-derivation covers the n' = 33 cell's aggregate
    quantities and computed nothing at n' = 44 or n' = 66.
  - >-
    The degeneracy control is vacuous by construction: degeneracy requires
    (q+1) | n and every one of the 111 declared cells has n prime with
    2 <= n' < n, so the instrument returned False on 45436 candidates and could
    not have returned anything else. The superseded and incorrect reason -- that
    every cell has n' - r in {1,2} -- is false on 56 of the 95 Stage-2 cells and
    must not be repeated.
  - >-
    p != 2 evidence exists now, and only at p in {3,5,7}, n <= 13 (p = 3) and
    n <= 11 (p = 5,7), n' <= 8, degree 2..4, plus 2400 odd-p K-coefficient draws
    -- and it is a REVIEW artifact of TASK-20260917-34b637, not a run of
    EXP-QSP-33b442, whose every numerical cell is p = 2.
  - >-
    beta > 1/2 requires n' < n. The corollary cannot be witnessed false because
    complete splitting forces n' <= n, but that step is written nowhere in the
    record and (E)'s written quantifier admits objects with beta <= 1/2, one of
    which was produced.
  - >-
    The census certifies 244 distinct lambda examined at three n', not "732 named
    polynomials", and is a measure-zero slice: K-coefficient lambda at n = 131 are
    entirely untouched and degree is capped at 7.
  - >-
    No independent replication invocation was spent (PD-6). Determinism by
    construction and one blind re-derivation are what stand in its place, and they
    are not the same thing.
  - >-
    H1 is untested and untestable here by the contract's own design. Nothing in
    this decision asserts H1 is false; what is established is that the record's
    support for H1's load-bearing direction is absent once `recalled` citations
    are honoured.
  - >-
    Two citation defects in H-QSP-5540d7 (the degenerate case described as an
    affine BINOMIAL of subfield/multiplicative type, where for b != 0 it is an
    affine trinomial covered by neither cited result; and c' = c^{p^{-j}} stated
    "over a field" where finiteness is needed) and one incompleteness (the r = 0
    vacuity stated only for the max form). None touches a bound; none is patched,
    because records are immutable.
  - >-
    An unreconciled discrepancy inside the J1 artifacts between the machine
    roll-up (205 rows / 292105 candidates / 46 degenerate / 12 boundary rows) and
    the report's prose (203 / 291997 deduplicated; 10 boundary rows / 53885 / 38
    degenerate). No verdict depends on which is used; both give 0 violations.
  - >-
    tools/check_review_independence.py has NOT been run against this composition.
    This session had no shell. It is a completion-gate item of
    TASK-20260917-43701b and is carried as NA-1; until it passes, the composition
    claims an independence it has declared but not machine-checked -- and PROC-1
    is precisely why that check matters here.
  - >-
    Five ledger-schema errors on RUN-QSP-33b442-S0 remain standing disclosed debt
    and must be named as known debt in the archive receipt carrying this decision.

  procedure_deviations_recorded:
    note: >-
      Recorded, not absorbed, per AGENTS.md "Review architecture". The full text
      of each, with its ruling, is in EV-QSP-a6aa4b procedure_deviations and in
      experiments/EXP-QSP-33b442/analysis.md section 3.9.
      TASK-20260917-43701b IS NOT EDITED: a handoff is immutable and rewriting it
      to make a past dispatch look compliant destroys the only evidence that the
      ordering was wrong. NA-2 mints the superseding card.
    PROC-1: >-
      The orchestrating session committed the COMPLETED red-team report to the
      shared branch (8f15567f6) while this mutually-blind round was still running,
      and the other two reviewers' in-flight artifacts (600bc97af, c0b3125ec),
      with blindness.mutual true and lifted_for empty. THE ORCHESTRATING
      SESSION'S FAULT, NOT ANY REVIEWER'S. The validator saw only a path and a
      commit subject line and disclosed it; the red team declares
      read_sibling_reports false; the blind re-deriver ran no git command.
      Independence survives on this evidence, but blindness is now a property of
      three reviewers' RESTRAINT rather than of the round's SETUP.
    PROC-2: >-
      Commit c0b3125ec is labelled a work-in-progress snapshot and contains the
      validator's FINAL 814-line report. No artifact content affected; the commit
      log misstates the state of a deliverable, which is exactly the
      reconstruction PROC-1 invites. History is pushed and is not rewritten.
    PROC-3: >-
      ACCEPTED. The coordinator subagent that wrote the review plan had no Bash
      tool and emitted unparseable YAML; the orchestrating session quoted one
      scalar so it would parse, changing no content, disclosed in
      TASK-20260917-5b9153 and its receipt. Same test as the producer's PD-5: no
      key, value or meaning altered, disclosed before any reviewer read the card.
      The systemic finding -- two independent YAML-emission defects in one round,
      both from agents with no shell -- is routed as NA-6.
    PROC-4: >-
      RULED THE RIGHT CALL, AND PRECEDENT. The blind re-deriver skipped the
      agent-bus inbox and ran no git/merge-digest command because two blind_from
      paths are bus records and an inbox render could surface them, and it
      DISCLOSED the suspension rather than performing it quietly or omitting it
      silently. A standing convention yields to a round-specific blindness that
      cannot be restored once destroyed. Cost accepted and stated: if a peer sent
      it something it needed, it did not see it, and nothing in its output depends
      on repository state.
    PROC-6: >-
      THE COMPOSING AGENT COULD NOT WRITE experiments/EXP-QSP-33b442/analysis.md
      AND THE ORCHESTRATING SESSION TRANSCRIBED IT. THE OBSERVED FACTS, AND
      NOTHING BEYOND THEM: two write attempts at that exact path were refused,
      deterministically, with "Subagents should return findings as text, not
      write report files"; minutes later, on the same runtime and in the same
      session, writes to knowledge/open-problems/KN-OPEN-ac409f.md and
      knowledge/techniques/KN-TECH-54c38e.md SUCCEEDED ON THE FIRST ATTEMPT. So
      the refusal is keyed to something about that path or filename rather than
      to markdown, or to subagent writes, in general. WHAT THE MECHANISM ACTUALLY
      IS WAS NOT DETERMINED, and four data points do not support a rule about the
      runtime; an earlier draft of this entry asserted that the runtime "refuses a
      markdown write from a subagent", which the two successful writes disprove,
      and it is withdrawn rather than softened.
      The Coordinator subagent composed the file in full and returned it verbatim;
      the orchestrating session wrote those bytes to the path. Recorded because a
      later reader reconstructing authorship from git would attribute the file to
      the session that typed it. NO CONTENT WAS AUTHORED OR ALTERED BY THE
      TRANSCRIBING SESSION -- the same test that accepts PROC-3 and the producer's
      PD-5.
      ROUTED TO NA-6, BUT NOT AS A SIBLING OF THE OTHER TWO. PD-5 (a YAML emitter
      that wrote unparseable manifests) and PROC-3 (a shell-less agent emitting
      unparseable YAML) are artifact-emission DEFECTS. This is a guard behaving as
      designed on a path that happened to be a required experiment artifact, which
      is a different failure and may well need a different fix. The common thread
      worth routing is narrower than "three emission defects": IN THIS ROUND,
      THREE TIMES, AN AGENT ASSIGNED TO PRODUCE A DECLARED ARTIFACT COULD NOT
      PRODUCE IT CORRECTLY WITH THE TOOL SURFACE IT WAS GIVEN.
    PROC-5: >-
      J1'S VERDICT IS NOT DISTURBED. The post-round fix to j1_kcoef.c (4e74a24af)
      corrected a PRECONDITION CHECK, not a counting routine; the precondition was
      independently confirmed true for all ten moduli; only (5,6) has an n with
      two distinct prime factors and its modulus X^6 + X + 2 is irreducible; and a
      re-run under the corrected criterion reproduces the committed output byte for
