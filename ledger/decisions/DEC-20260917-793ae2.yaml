  prior_calibration:
    plan: TASK-20260917-43701b review_plan.coordinator_prior
    written_before_any_reviewer_ran: true
    declared_contamination: >-
      The prior states in terms that the Coordinator had already read the
      headline numbers and had itself recomputed several from raw rows, so
      agreement on the headline is close to worthless as evidence. That
      declaration is what makes the scoring below meaningful.
    verdict: >-
      WELL CALIBRATED ON WHAT THE ROUND WOULD FIND; POORLY CALIBRATED ON WHICH
      JOINT WOULD COST THE CLAIM AND BY WHAT MECHANISM. The modal expectation at
      0.70 -- "(A) and (B) hold as stated on the tested scope; the empirical
      support is narrower than the headline suggests; (E) stays un-promoted" -- is
      essentially exactly what came back, needing only the n' < n narrowing. But
      THE TWO JOINTS THE PRIOR PRICED HIGHEST AS BREAKS BOTH HELD (J4 at 0.65,
      named "the joint where I most expect the round to cost the claim something";
      J2 at 0.70), and the two that actually broke are J6 (0.60, right) and J5
      (0.20/0.45, and mislocated).
    where_it_was_overturned:
    - >-
      J4, AND THIS IS THE MOST INFORMATIVE OVERTURN IN THE ROUND. The prior's
      hypothesis was falsifiable -- "if a single injected fault leaves the
      agreement matrix clean, the matrix is measuring shared code, not agreement"
      -- and the ANTECEDENT DOES NOT HOLD. A single fault in the most-shared
      primitive changed 87 of 120 counts and took M2 from (0,0,0) to (75,73,43);
      single-instrument faults produce a localising signature; three faults
      designed to evade the field-polynomial self-check were caught by an internal
      algebraic assertion instead; and a negative control confirmed the harness
      does not manufacture disagreements. M2 = 0 moves from suspected artifact to
      measured property, in the record's favour and against the Coordinator.
    - >-
      J4 again, at 0.08 on an actual I3 undercount at n = 131: none was found, on
      36 independent determinations by two procedures the experiment never used,
      12 of them on real census rows.
    - >-
      J2's REASON, though not its conclusion. The prior argued from n' - r being
      small against q+1 >= 2. The correct criterion is (q+1) | n, and the prior's
      stated reason is FALSE ON 56 OF THE 95 STAGE-2 CELLS ((13,12) has
      n' - r = 11; (31,15) has 14). The conclusion never changed and the affected
      candidate count grew from 3192 to 45436.
    - >-
      J5's LOCATION AND SEVERITY. The prior expected, at 0.45, a downstream
      sentence over-reading the census. What was found is an arithmetic
      overstatement of 186 rows -- 732 claimed against 546 actual, 34% more than
      exist -- in the FROZEN CONTRACT'S OWN SUCCESS-CRITERION
      HEADLINE -- the exact sentence the round was convened to evaluate -- plus a
      sharper restatement in the Stage 5 report contradicting three of the run's
      own records. The prior priced a wording risk and got a counting error in the
      claim itself.
    - >-
      A COORDINATOR ARITHMETIC INFERENCE OVERTURNED. CORR-20260917-8b80cc inferred
      "at least four distinct splitters at equality" from 8 literal
      beta_minus_exact 0.0 occurrences; the independently recomputed answer is
      EXACTLY THREE, which also corrects the execution report's "two". Its
      classification of the item as a prose imprecision is confirmed.
    where_it_was_right:
    - J6 at 0.60 -- right, and under-confident: the reviewer found more than gate (2).
    - >-
      J6's weak-margin sub-point -- the prior computed that the closure needs only
      kappa >= 0.992 rather than 4.876, and the reviewer confirmed it exactly at
      130/131.
    - J3 at 0.40 -- right, by the route the prior named (n' > 2n gives q = 0), with a witness produced.
    - J2's CONCLUSION at 0.70 -- right, and strengthened.
    - J1 at 0.02 and a genuine F1 at n = 131 at 0.01 -- neither occurred; 0 in roughly 294000 candidates.
    - J5's enumeration half at 0.20 -- no enumeration error; clean on all six checks.
    structural_observation: >-
      On every quantity the Coordinator had ALREADY RECOMPUTED, the round agreed
      and bought nothing. On the three it had NOT -- the direction of the cited
      kappa constant, the certificate accounting, and the fault-injection
      behaviour of the agreement matrix -- the round corrected the Coordinator
      each time, twice against the record and once in its favour. A contaminated
      prior does not merely weaken agreement as evidence; it predicts, in advance,
      exactly where the round will be informative. THAT IS THE REUSABLE LESSON
      AND IT SHOULD SHAPE THE NEXT REVIEW PLAN: assign joints to what the
      Coordinator has NOT checked.

