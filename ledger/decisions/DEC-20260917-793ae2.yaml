      therefore minted nothing itself, per AGENTS.md rule 14.
      (1) KN-OPEN-ac409f, knowledge/open-problems/KN-OPEN-ac409f.md, for the
      precisely statable unknown (E) leaves behind: "Is
      there a LOWER bound on the exponent kappa of eliminant-solving for the
      structured chain systems S of KN-LIT-0a321c section 3.1? Every published
      constraint located by this program is an upper bound (Euler-Petit Prop. 7,
      'currently majored by 4.876'; Huang Lemma 3.1's big-O; Huang App. A.1's
      degree 'bounded by M(E)' with root-finding cost that 'can be neglected').
      A quasi-subfield factor base with n' not dividing n beats generic algorithms
      iff kappa < 1/(2 beta), which at n = 131 means kappa < 130/131 = 0.9924. The
      question is open in the literature and the cheapest informative measurement
      is the eliminant degree at (m, d) = (2, 2) or (2, 3), where a resultant
      suffices and no Groebner engine is needed." Cites EV-QSP-a6aa4b,
      DEC-20260917-793ae2, EXP-QSP-33b442, TASK-20260917-52b4e6, H-QSP-5540d7 H1.
      (2) KN-TECH-54c38e, knowledge/techniques/KN-TECH-54c38e.md, for the blind
      re-derivation's composition instrument: to count K-rational roots
      of X^{p^{n'}} - lambda(X) at a field where deg L is astronomically large,
      pick k with k n' = n + e for small e, form P = lambda^{(k)}(X) - X^{p^e} of
      degree d^k, take g = gcd(P, X^{p^n} - X) and then
      G = gcd(X^{p^{n'}} - lambda, g), and read N = deg G -- L is never
      materialised. At n = 131, n' = 33 this turns a degree-2^33 object into a
      degree-2401 one and counts all 244 cells in about 6 seconds. Validation
      evidence: exhaustive brute-force agreement at n = 7, 9, 11, 13 with two
      field polynomials each (~2000 comparisons, 0 mismatches, including composite
      n); an independent k = 8 depth at n = 131 agreeing; an F_2-rank computation
      on the linearized slice agreeing; a full sympy re-implementation agreeing on
      all 244; and EXACT agreement with an independently produced archive of
      disjoint lineage. Cites TASK-20260917-5fa7d5, EV-QSP-a6aa4b,
      DEC-20260917-793ae2.
      BOTH ENTRIES EXIST AT THE PATHS ABOVE AND RIDE THE SUPERSEDING LEDGER
      ARCHIVE -- NOT THE ARCHIVE THAT CARRIED THIS RECORD. This record was
      archived at commit 7a8ebec9a under TASK-20260917-26ffa2, and that commit
      does NOT contain either knowledge entry; they were authored afterwards.
      An earlier draft of this clause said they "ride the same ledger archive as
      this record", which is false of 7a8ebec9a, and it is withdrawn rather than
      softened. knowledge/INDEX.md is NOT staged in either archive: it is a
      derived, gitignored artifact (.gitignore line 134) rebuilt with
      `tools/build_knowledge_index.py`, never hand-maintained and never
      committed. NA-7 and NA-8 are DISCHARGED and are retained above as the
      historical record of the dispatch, not as outstanding work.
      WHY NO KN-FIND, AND THIS IS A DELIBERATE DEFERRAL RATHER THAN A DECLINE.
