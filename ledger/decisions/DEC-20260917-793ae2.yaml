coordinator_decision:
  id: DEC-20260917-793ae2
  recorded_at: '2026-09-17'
  question_id: RQ-QSP-f9bbdb
  experiment_id: EXP-QSP-33b442
  hypothesis_id: H-QSP-5540d7
  evidence_id: EV-QSP-a6aa4b
  review_plan_id: TASK-20260917-43701b
  kind: evidence_review_transition

  context: >-
    Lifecycle steps 9-10 of .claude/skills/review-evidence/SKILL.md for
    EXP-QSP-33b442, composing the claim-changing review round opened by
    TASK-20260917-43701b. Branch claude/ecc2k-130-quasi-subfield-poly-nhcj1f,
    HEAD 9bdcc586c, PR #1265.
    All three reviewers returned and their reports are committed:
    TASK-20260917-34b637 (validator-breakthrough, J1/J3/J5),
    TASK-20260917-52b4e6 (red-team-breakthrough, J2/J4/J6 and the required
    proves-too-much control), TASK-20260917-5fa7d5 (blind re-derivation of the
    load-bearing n = 131 quantity). Verdicts as returned: J1 holds, J2 holds,
    J3 holds with a required narrowing, J4 holds, J5 BREAKS, J6 BREAKS,
    proves_too_much holds with the declared failure signature ABSENT on both
    known-false families, blind re-derivation passed and agrees with the producer
    EXACTLY on maximum, argmax, histogram, candidate-set size and orbit structure.
    The validity gate, the ratification of AMD-20260917-001 and the refusal of
    amendments/v2.yaml are CORR-20260917-8b80cc and are not re-litigated here.
    The producer stated no verdict; what the round evaluated is the frozen
    contract's own pre-registered success headline.
    THIS SESSION HAD NO SHELL. No command was run, no validator was executed, and
    every figure cited below is quoted from a committed artifact.

  decision: weaken

  decision_scope: >-
    ONE TRANSITION IS RECORDED, AS REQUIRED, AND THE PARTS OF THE RECORD POINT
    DIFFERENT WAYS. Flattening them would misreport the round, so they are stated
    separately and the single transition is justified against all of them.
    - (A) the twisted injection bound, (B) the beta corollary and (C) the
      tightness claim: the evidence SUPPORTS them at derivation tier on the
      tested scope. Taken alone they would attract `support` at strength
      `strong`, subject to the n' < n narrowing.
    - (E) the closure reading: the evidence WEAKENS it and refutes its STATED
      REASON. `support` on (E) is not available and is not sought.
    - the experiment's pre-registered empirical headline: two measurable
      overstatements, both flattering.
    - (D)(ii): already WITHDRAWN AS STATED by the producer's own Stage 5 report.
    `weaken` is the transition because the record under review is H-QSP-5540d7 AS
    WRITTEN, and (A)/(B)/(C) and (E) are parts of ONE hypothesis record. A record
    that carries a refuted closure reading cannot be moved toward `supported` as a
    package, and splitting it is a superseding act, not a status change (NA-4).
    `weaken` says exactly what happened: the claim survives in a narrower form
    than it is written in, and the specific overreaching parts are withdrawn.

  target_ids:
  - H-QSP-5540d7
  - EXP-QSP-33b442
  - EV-QSP-a6aa4b
  - RQ-QSP-f9bbdb

  hypothesis_status_change:
    record: ledger/hypotheses/H-QSP-5540d7.yaml
    from: specified
    to: analyzed
    basis: >-
      The experiment ran to completion under a frozen approved protocol, its run
      set passed the validity gate, and a full independent review round has
      reported. `analyzed` is the honest position on the AGENTS.md state line
      (proposed -> specified -> approved -> running -> analyzed -> replicated ->
      supported | weakened | rejected | inconclusive | superseded): the results
      exist and have been reviewed, and promotion is blocked.
    why_not_supported: >-
      Three independent blocks, any one sufficient. (i) agents/coordinator.md
      promotion gate (2) is unsatisfied -- H1 carries validation_experiment_ids
      [] and IDEA-20260916-b84e2d is a PROPOSAL, not an experiment -- and a claim
      missing any gate may reach `analyzed`, never `supported`. (ii) (E)'s stated
      reason is refuted on a verified misreading of a cited constant's direction.
      (iii) AGENTS.md: a surprising or high-impact result gets `replicate`, not
      `support`, on first observation, and PD-6 records that no independent
      replication invocation was spent.
    why_not_weakened: >-
      `weakened` as a TERMINAL hypothesis status would assert that the mechanism
      as a whole came out worse, which is false: (A) and (B) survived every
      attack named in advance and two that were not, across roughly 340000
      candidates from two implementations with no shared lineage, and the
      load-bearing target-scale quantity was independently re-derived blind with
      exact agreement. The DECISION is `weaken` because the RECORD AS WRITTEN is
      weakened; the hypothesis STATUS is `analyzed` because the mechanism is
      neither promoted nor knocked down. Recording the decision and the status
      differently is deliberate and is stated here so no later reader reads it as
      an inconsistency.
    why_not_replicated: >-
      `replicated` is a status about the EXPERIMENT having been reproduced from a
      clean run. No replication invocation was spent (PD-6) and the substitute is
      a same-binary same-host determinism check over 54.9% of Stage 2. The blind
      re-derivation replicates ONE cell's aggregate quantities by a disjoint
      method, which is stronger than replication where it reaches and does not
      reach the rest.
    immutability: >-
      This is a STATUS FIELD UPDATE on the head record, which is the one change
      AGENTS.md rule 1 reserves to the Coordinator. Nothing else in
      H-QSP-5540d7 is edited. The substantive defects the round found in the
      record's TEXT -- (E)'s stated reason, the missing n' < n clause, the
      omitted (D)(ii) survivor, the two citation defects -- are NOT patched:
      records are immutable and corrections supersede. NA-4 mints the superseding
      hypothesis record.

  rationale:
  - >-
    THE RUN SET IS VALID AND IS NOT RETURNED TO THE EXECUTOR. Expected run count
    (six counted invocations against maximum_runs 6), schema-complete manifests on
    every measurement-bearing run, seed integrity matching the pre-registration
    exactly, raw-versus-summary agreement recomputed from per-candidate rows at
    eight points, and control comparability all check out. The fifteen
    ledger-schema errors are record-level, fall on S0 (zero compute), S5
    (extraction) and S2 (aborted, no number reported), and both reviewers asked to
    opine on that classification independently declined to overturn it
    (CORR-20260917-8b80cc; TASK-20260917-34b637 OOS-6; TASK-20260917-52b4e6
    section 9).
  - >-
    (A), (B) AND (C) SURVIVED EVERY ATTACK NAMED IN THE PLAN AND TWO THAT WERE
    NOT. 0 violations of N_K(L) <= max(d^{q+1}, p^{n'-r}) in 45436 producer
    candidates and in 291997 + 2400 independent ones written against the STATEMENT
    at p in {2,3,5,7}; 0 candidates with deg D above the bound; 0 K-root sets
    failing to divide D; 0 complete splitters below either corollary, recomputed
    from (n, n', d) alone with exact rationals on all 65 rows; 0 counterexamples to
    the composition-equals-monomial step in 1324468 characteristic-p compositions;
    0 lambda with D = 0 outside the claimed shape in 331664 searched. The bound is
    ATTAINED at p = 2 and, newly, at p = 3 and p = 5. The proves-too-much control's
    declared failure signature is ABSENT on both known-false families, and the
    r = 0 vacuity is traceable to the single occurrence of r in the derivation
    rather than to a choice of parameters.
  - >-
    THE LOAD-BEARING TARGET-SCALE QUANTITY IS NOW ESTABLISHED ON TWO LINEAGES
    WITH NO SHARED CODE. TASK-20260917-5fa7d5, blind (blind_from_respected true;
    two repository files read, no git command run, no sibling path listed),
    derived the candidate-set size 244 for itself and returned max N = 132, the
    same four attaining lambda {132, 161, 204, 251}, the same histogram
    {0:62, 1:118, 2:60, 132:4} and the same orbit sizes [1, 131] -- by a method
    that never materialises L (composition lemma plus two gcds, degree 2^33 never
    built) and re-implemented a second time inside its own task in sympy GF(2)
    arithmetic with 0 mismatches. Under the interpretation_rule fixed in advance,
    agreement is evidence about the QUANTITY and is the only evidence at n = 131
    that does not pass through the producer's single instrument.
  - >-
    THE CLOSURE READING (E) IS NOT PROMOTABLE AND ITS STATED REASON IS REFUTED,
    WHICH IS THE PRIMARY GROUND FOR `weaken`. (E) excludes a cheap solver by
    citing kappa = 4.876. Euler-Petit Proposition 7 states verbatim that kappa is
    "currently majored by 4.876" (inputs/EULER-PETIT-2019-QSP/paper_fulltext.md
    line 2597) -- an UPPER bound -- and Huang Lemma 3.1 gives the eliminant cost
    as a big-O, also an upper bound. Excluding a cheap solver requires a LOWER
    bound. At n = 131 the exclusion needs kappa >= 130/131 = 0.9923664 against
    H1's own assumption kappa >= 1: a margin of 0.76%, tending to zero, NOT a
    factor of five. Separately H1's declared "rigorous ingredient" asserts
    eliminant degree exactly M(E) and cost at least M(E) where Huang Appendix A.1
    (lines 1116-1118) says degree "bounded by M(E)" and that root-finding's cost
    "can be neglected"; the step that would bridge the gap is the
    BKK/generic-attainment statement H1 itself marks RECALLED, which AGENTS.md
    rule 9 bars from discharging supporting_results.
  - >-
    PROMOTION GATE (2) IS UNSATISFIED INDEPENDENTLY OF THAT. H1 carries
    validation_experiment_ids: []; IDEA-20260916-b84e2d is a proposal at status
    `proposed`, called "scheduled, not yet designed" by the hypothesis itself, so
    no EXP-* id exists for the gate to name; and its engine impediment is
    re-confirmed by this run's own environment.json. The gate's last sentence is
    unconditional, so the blockage is a scheduling fact and not the reason.
  - >-
    THE PRE-REGISTERED EMPIRICAL HEADLINE OVERSTATES ITS SUPPORT IN TWO
    MEASURABLE WAYS, BOTH FLATTERING, AND ONE OF THEM IS IN THE EXACT SENTENCE
    THIS ROUND WAS CONVENED TO EVALUATE. "732 certificate-bearing exact counts at
    n = 131" overstates by 186 rows -- 732 claimed against 546 actual, 34% more
    than exist (732/546 = 1.3407); the 186 surplus is 25% of the 732 claimed and
    34% of the 546 actual: 732 exact counts exist, 546 bear a
    certificate, 186 have N = 0 and certificate_path null, and the contract's own
    required_artifacts defines the certificates as "one file per candidate with
    N > 0". "1260 exhaustive toy candidates under three agreeing instruments"
    describes as three what is two determinations over one shared primitive base
    (I1 has no primitive of its own; the certificate re-verifier shares square,
    polymod and clmul with the counters; the one implementation-independent
    instrument in the package contributed none of the 1260 agreements) and ONE
    instrument at n = 131.
  - >-
    THE ADVERSE CALL CARRIES THE STRONGEST REFUTATION ARTIFACT EACH FINDING
    ADMITS, ARCHIVED BEFORE THIS DECISION (docs/claims-and-verification.md,
    "Refutation artifacts"). J6/O1 reaches DERIVATION tier: a self-contained
    checkable argument over verbatim quotations from two frozen source texts plus
    exact rational arithmetic. It does not reach counterexample tier because no
    instance of a solver with kappa < 130/131 is exhibited -- the break is that
    nothing excludes one. J5-1 reaches COUNTEREXAMPLE-CERTIFICATE tier against the
    claim sentence: 186 named rows, re-countable from the committed cell JSONs.
    The J3 scope finding reaches COUNTEREXAMPLE-CERTIFICATE tier against (E)'s
    written quantifier: (2, 5, 11, X^2) with N = 32 by two agreeing instruments
    and beta = 5/121. EV-QSP-a6aa4b carries proof_status `derivation`, the tier of
    the artifact that weakens H-QSP-5540d7 itself. THIS IS NOT AN UNREPLICATED
    EMPIRICAL-ONLY REFUTATION, and `weaken` is not being used as a substitute for
    a rejection it could not support -- `reject_scoped` is separately unavailable
    because nothing here refutes (A) or (B) and (E) is not refuted in its
    CONCLUSION, only in its stated reason.
  - >-
    WHY NOT `support`, WEIGHED HONESTLY BOTH WAYS. Against support: AGENTS.md
    requires `replicate` on first observation of a surprising or high-impact
    result, this is a closure-adjacent claim under rule 12, promotion gate (2) is
    unsatisfied, PD-6 records no replication invocation, and the headline sentence
    that would be promoted is wrong by 186. For support, and it is not nothing:
    the round's load-bearing quantity WAS independently re-derived BLIND -- not
    replicated from the producer's artifacts, which is the failure mode
    replication cannot see -- and agreed exactly; Stages 0, 1, 2 and 3 and every
    control are exhaustive and seed-free, hence deterministic by construction, so
    a fresh replication would return the same numbers with probability 1 and would
    buy nothing that determinism does not already give; the validator recomputed
    M1 at all five Stage-1 cells from scratch with three instruments of its own;
    and the red team made 36 independent determinations at n = 131. THAT CASE IS
    STRONG ENOUGH THAT `replicate` WOULD HAVE BEEN THE WRONG DISPATCH -- there is
    nothing informative left to re-run -- BUT IT DOES NOT REACH `support`, because
    what blocks support here is not reproducibility. It is gate (2), a refuted
    reason in (E), and a false sentence in the headline, and no amount of
    re-running touches any of the three.
  - >-
    WHY NOT `inconclusive`. The evidence discriminates sharply. It says (A) and
    (B) held everywhere they could have failed, that (E)'s stated reason is wrong
    in a direction that is checkable from two frozen texts, and that the headline
    miscounts by 186. `inconclusive` is for evidence that cannot distinguish
    explanations; this evidence distinguishes them.
  - >-
    RULE 9 COMPLIANCE, STATED EXPLICITLY BECAUSE THIS DECISION CARRIES A SCOPED
    NEGATIVE. NOTHING HERE CLOSES THE QSP LINE. (E)'s own forward guidance names
    three survivors -- n' | n (at n = 131 only n' in {1, 131}), correspondence
    shapes of conjugate degree >= 2 (IDEA-20260916-a17f43), and factor bases that
    are not root sets of a single X^{p^{n'}} - lambda -- and the round adds a
    FOURTH that (E) silently absorbed: rational lambda, since (D)(ii) is recorded
    WITHDRAWN AS STATED. The evidence, budget, test boundary and remaining
    uncertainty are in EV-QSP-a6aa4b boundaries and obstruction.scope; the
    concrete successors are NA-4 through NA-9; the revisit condition is stated in
    revisit_conditions below. ECC budgets are unlimited (AGENTS.md "ECC comes
    first"), so nothing in this decision is a budget closure and none was
    considered.

