coordinator_decision:
  id: DEC-20261005-031527
  context: >-
    Design tick on 2026-10-05. origin/main was fetched and this
    branch was created at 7ab85b985a. The only open non-arithmetic
    ECC proposals already have curve contracts on other branches.
    IDEA-20261004-31991f still names an n=3, m=3 exhaustive table
    as its reproduction check. The n=1 pair-sum contracts do not
    build that table.
  decision: approve
  target_ids:
    - IDEA-20261004-31991f
    - H-GFPN-ce885c
    - EXP-GFPN-76a1cd
  rationale:
    - >-
      GFPN is an ECC area. The contract enumerates three-point
      sums on y^2 = x^3 + x and on one root-free model at
      q = 5, 7, and 11.
    - >-
      A design-session count, not a run, gave lemma violations 0
      and type (c) counts 0, 15, 39 on the torsion model and
      0 on the root-free model. Both norm formulas must recompute
      them.
    - >-
      Standing user authorization of 2026-09-06 covers approval.
      The protocol fields required before dispatch are filled.
    - >-
      No existing GFPN record is edited. The count is not a
      Gaudry cost and not a solver comparison.
  evidence_refs: []
  limitations:
    - The tables use at most eleven factor-base abscissae.
    - At q=5 the torsion model has an empty side-0 set.
    - Approval authorizes six deterministic runs. It does not assert the counts.
  next_actions:
    - >-
      Snapshot-archive this contract. Do not launch
      TASK-20261005-748802 until the receipt verifies.
  knowledge_promotion:
    promoted: []
    not_warranted: Approval of an unrun contract. No finding is promoted.
  decided_by: coordinator
  decided_at: '2026-10-05'
