coordinator_decision:
  id: DEC-20260813-e0077d
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-002
  question_id: RQ-ECDLP-002
  recorded_at: '2026-08-13'

  decision: approve

  decision_type_rationale: >-
    `approve` and not `revise`, because the contract is executable as written:
    every field docs/task-lifecycle.md step 4 requires is present and non-null,
    the controls are the ones that make the measurement mean anything, and the
    residual ambiguities are implementation choices an approving Coordinator
    fixes in the handoff rather than protocol gaps only a re-authored contract
    could close. `approve` and not `support`/`weaken`/`reject_scoped`, because
    nothing has been measured -- this decision authorizes a measurement and
    scores no outcome. `approve` and not `expand`, because no new lane is
    opened -- this discharges a recorded audit debt on a closure the program
    already made.

  context: >-
    EV-ECDLP-b3e847 closed the isogeny-transfer direction on four named
    obstructions. Three are proven. The fourth -- "within-class uniformity",
    the claim that no curve in an ordinary F_p-isogeny class has lower DLP
    cost than any other -- was recorded by the red team
    (TASK-20260807-d8bb19-redteam) as an absence-of-evidence claim, and the
    toy-scale test that would settle it (IDEA-20260807-0afbab, minimal_test)
    was never run in this harness. IDEA-20260812-68e87f proposes running it and
    sharpening it; H-ISOU-c5bfea states it as a three-leg hypothesis; and
    EXP-ISOU-2ac81f is the contract that measures it -- a complete-class ECDLP
    cost census on a P-256-SHAPED toy curve (ordinary, prime order N,
    conductor f = 1, a = -3), with explicit Velu isogenies, a transferred DLP
    instance carrying independently re-verified certificates, and separated
    measurement of the group-operation count (Q1), the field cost per group
    operation (Q2), and the charged end-to-end cost (Q3).

    Three defects were found and repaired by an independent reviewer BEFORE
    this review, on a contract that had never been approved or frozen -- so
    they are drafting, not amendments. They were (1) an unusable same-p
    different-trace null object, replaced by a different-ORDER control over a
    smaller declared prime with N' <= N/16; (2) walk termination being treated
    as class completeness, replaced by a gate on the vertex count matching
    h(disc(End(E_0))); and (3) a mixed-unit end-to-end cost, replaced by field
    multiplications throughout. This Coordinator reviewed the repaired contract
    on its merits and approves it, freezing it at version 1.

  target_ids:
    - EXP-ISOU-2ac81f
    - H-ISOU-c5bfea
    - TASK-20260813-4bee82
    - IDEA-20260812-68e87f

  evidence_refs:
    - EV-ECDLP-b3e847
    - DEC-20260807-d4f2a9
    - IDEA-20260807-0afbab
    - IDEA-20260812-68e87f

  rationale:
    - >-
      The contract satisfies the Coordinator decision checklist item by item.
      The uncertainty is exact and decision-changing at the level of the
      program's own record: obstruction 4 of EV-ECDLP-b3e847 is currently
      asserted, and this converts it to measured-at-toy-scale or exposes it.
      The outcomes that would change the next decision are pre-registered as
      F1-F4, each naming an observable the protocol actually measures. It is
      the cheapest valid version of the test -- toy primes chosen precisely so
      the class can be enumerated COMPLETELY rather than sampled. The budget is
      bounded and fully specified (600 s per run, 2 CPU-hours, 8 GB, 4 runs,
      1 worker), and the required artifacts are enumerated.
    - >-
      The control set is the reason this is worth compute at all, and it is
      built the way the inventor protocol demands (controls before belief). The
      instrument carries a theorem-backed POSITIVE control -- Tate fixes the
      group order across the class, so Q1 must come out null, and a Q1 anomaly
      indicts the meter before it indicts the mathematics. It carries a null
      object that must SEPARATE (different-order curves, N' <= N/16), with an
      explicit stopping rule that no Q1 or Q3 result may be reported from a run
      where it fails. It carries a within-curve seed dispersion band frozen
      before any between-member comparison, a solver-independent BSGS
      cross-check, segregation of j = 0 and j = 1728 members whose automorphism
      discount is not a within-class effect, and a model-normalization control
      that keeps Q1 and Q2 in separate coordinate regimes. That last one is the
      single most important line in the contract, because mixing them is the
      one way this census could manufacture a speedup out of nothing.
    - >-
      The claim discipline is correct in advance rather than negotiated after
      the fact. claim_tier is toy; P-256 is declared as the SHAPE imitated and
      not the object measured; dominated_by is Pollard rho at exponent 1/2 with
      sota_delta not_applicable on every axis; asymptotic_claim is null, so the
      four asymptotic promotion gates in agents/coordinator.md are not engaged
      by this approval and must not be read as satisfied by it. The success
      criterion is about the QUALITY OF THE MEASUREMENT and not the direction
      of the result, which is what stops a null from being quietly reframed as
      a finding or a nonzero constant from being inflated into a speedup.
    - >-
      A proof_search_map is present on H-ISOU-c5bfea and passes the section-8
      gate this Coordinator is bound by (KN-TECH-080). The bottleneck is named
      and decision-changing; the baseline is a frozen reproduction fixture
      (0.886*sqrt(N) on the base curve, recorded before any between-member
      comparison is read); the observation-collision search is stated as a
      concrete search over members of one class; the quantifier order is
      explicit and correctly ordered -- the class is fixed FIRST by the base
      curve, mirroring an attacker handed P-256 who cannot choose its class,
      not the far weaker "there exists a class with a cheap member"; and the
      method ceiling is stated with a nearby-object control that is now the
      right object after the reviewer's repair.
    - >-
      On direction and taste: this is explicitly a constant-factor
      measurement, and docs/target-result-profile.md biases the roadmap toward
      exponent-moving work. It is approved anyway, on narrow and stated
      grounds. It costs 2 CPU-hours; it discharges an objection an independent
      red team put on the record against a closure the program has already
      acted on; and the inventor protocol treats premature closure as a failure
      mode symmetric with overclaiming, which makes an unmeasured leg of a
      recorded closure a debt rather than a settled matter. It opens no lane
      that competes with exponent-targeting work, and it must not be cited as
      one.
    - >-
      The heuristic-pairing duty is met internally rather than deferred.
      HEUR-ISOU-1 (rho step counts concentrating at 0.886*sqrt(N)*(1+o(1))
      uniformly over curves of equal order) is numbered, formally stated, given
      its random-model justification, and given a falsification condition; its
      validation_experiment_ids names this same experiment, and the mechanism
      of validation is real -- the different-order controls must exhibit the
      same relative dispersion under matched seed schedules, and a mismatch is
      reported as an instrument finding rather than a mathematical one.

  what_this_approval_does_not_do:
    - >-
      It does not change the status of obstruction 4 of EV-ECDLP-b3e847, which
      remains empirical and not proven, exactly as the red team recorded it.
    - >-
      It does not reopen SG-ECDLP-002 or alter H-IT-001's status. Only an F1
      observation -- a class member solving in materially fewer group
      operations, with a verified certificate, surviving fresh seeds -- could
      put that question back on the table, and it would be triaged as an
      instrument defect first.
    - >-
      It does not license any statement about P-256, and it does not promote
      H-ISOU-c5bfea past `specified`.
    - >-
      It does not dispatch the Executor. TASK-20260813-4bee82 is written and
      dispatch-ready, not dispatched.

  limitations:
    - >-
      RESOLUTION FLOOR. The census can only see between-member differences
      larger than the frozen seed dispersion band. Pollard rho step counts have
      dispersion comparable to their mean, so a 16-seed median carries a
      standard error on the order of a quarter of the mean; a real within-class
      group-operation effect smaller than that is invisible to this instrument.
      A null on Q1 therefore means "no effect above the frozen band at the
      tested scale" and must never be reported as "no effect".
    - >-
      NULL-OBJECT STRENGTH. The different-order control demonstrates that the
      meter tracks group order at all. It does not demonstrate sensitivity to a
      hypothetical within-class cost difference of the size the census would
      need to detect, because no object of that kind is available to control
      against. This is the strongest available control and it is weaker than
      the ideal one; the gap belongs in any evidence record that cites a null
      from this run.
    - >-
      BUDGET FEASIBILITY AT 24 BITS. The census cost scales roughly as (seeds)
      x 0.886 x sqrt(N) x h(disc), and with conductor f = 1 the class size h
      itself grows like sqrt(p), so the total scales close to linearly in p.
      The 20-bit censuses should sit comfortably inside 600 s; the 24-bit
      censuses may not, and the class-completeness gate means a budget-exhausted
      24-bit run yields an incomplete subgraph and no "no member is cheaper"
      claim. This is a known and accepted risk of the approved budget, handled
      by run ordering in TASK-20260813-4bee82 rather than by re-budgeting the
      contract. A 24-bit run that exhausts its budget is an infrastructure
      signal and negative mathematical evidence about nothing (AGENTS.md
      rule 5).
    - >-
      IMPLEMENTATION RISK IS NOT MATHEMATICAL RISK. Explicit Velu isogenies
      over a toy field, an instrumented field-arithmetic layer, and an
      independent certificate checker are the three places this can fail. Every
      such failure is an infrastructure or implementation outcome, reported as
      one.
    - >-
      FOCUS ACCOUNTING NOT RE-RUN. This Coordinator session has no Bash and did
      not run tools/autoresearch_focus.py, so the count of active critical
      experiments was not verified here. The dispatching session must confirm
      the active-lane count before this task occupies a slot.
    - >-
      NOT YET DURABLE. This decision, the approval on the specification, the
      hypothesis transition, and TASK-20260813-4bee82 are uncommitted. Nothing
      here is official until the Coordinator snapshot archive commits and its
      post-commit verification is accepted (AGENTS.md "Durable research
      commits"). No goal checkpoint shard is written by this task and
      GOAL-ECDLP-001's single next_action is not altered by it; no BATCH id was
      allocated to this session.

  next_actions:
    - >-
      Snapshot-archive the exact paths changed by this approval --
      experiments/EXP-ISOU-2ac81f/specification.yaml,
      ledger/hypotheses/H-ISOU-c5bfea.yaml,
      ledger/decisions/DEC-20260813-e0077d.yaml,
      ledger/handoffs/TASK-20260813-4bee82.yaml -- as an isolated Coordinator
      commit naming DEC-20260813-e0077d and TASK-20260813-4bee82, then push the
      branch and open or refresh a PR against main naming those records.
    - >-
      Only after that archive verifies, dispatch TASK-20260813-4bee82 to the
      Executor, set its archived_by to the snapshot task that will commit the
      run artifacts, and record the dispatch. An Executor that cannot find both
      the frozen contract and this committed decision refuses the work.
    - >-
      Reserve the dependent independent review before the run completes, not
      after. The producer task is claim-relevant (it audits a leg of a recorded
      closure), so it carries review_required and needs a Validator task on run
      integrity and control comparability -- expected run count, seed integrity,
      raw-versus-summary agreement, certificate independence, and whether the
      different-order control actually separated -- under review-adversarial in
      an independent session.
    - >-
      On receipt, verify validity BEFORE interpreting anything: expected run
      count, schema-complete manifests, seed integrity, raw/summary agreement,
      control comparability, and the class-completeness gate (vertex count
      versus h(disc(End(E_0)))). An invalid or incomplete run set returns to the
      Executor with concrete defects listed and is not evidence.
    - >-
      When an admissible result exists, write the EV-* record scoped to the
      tested primes, degrees, seeds, solver, and budget, with claim_tier toy and
      the resolution floor above stated in its boundaries, and only then decide.
      Note in advance that a `reject_scoped` on a single unreplicated
      empirical-only run is forbidden; the two independent instances in the
      contract's replication block are what make replication reachable here.
    - >-
      If Q2 comes out inside the predicted (1.0, 1.5) interval and tracks a = -3
      reachability, the durable output is a quantified constant, not a speedup.
      Any follow-on that proposes to exploit it must state its dominated_by as
      Pollard rho at exponent 1/2 before it is considered.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is an experiment approval, not an evidence review. No run has
      occurred and no evidence record of strength `replicated` or `strong`
      exists to promote from; EV-ECDLP-b3e847, the record this experiment
      audits, is itself `preliminary`. A KN-FIND entry becomes due only at the
      evidence-review decision that follows an admissible run.

  decided_by: coordinator
  decided_at: '2026-08-13'

