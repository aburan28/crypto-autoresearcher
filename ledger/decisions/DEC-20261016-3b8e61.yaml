coordinator_decision:
  id: DEC-20261016-3b8e61
  context: >-
    design-experiment for IDEA-20261015-5888a7 (joint x-y window factor
    bases, RQ-CMFB-33610e). Hypothesis H-CMFB-c5e29b and contract
    EXP-CMFB-a07d3f were drafted. The protocol is scientifically complete
    (pre-registered random-model dispersion, synthetic and planted controls,
    gates, simultaneous intervals, mechanical decision rule, decision_impact)
    but no launcher, trial plan or dispatch queue exists, and the designing
    session had no shell to implement, pilot or check execution_state.
  decision: revise
  target_ids: [EXP-CMFB-a07d3f, H-CMFB-c5e29b, IDEA-20261015-5888a7]
  rationale:
    - >-
      AGENTS.md "Approval is bounded by execution": approval requires
      tools/newest_experiments.py to report execution_state ready; with no
      trial-plan.json it reports needs_implementation_or_plan. The contract
      therefore stays review_required with approved_by null; this is not an
      approval and asserts nothing about H1.
    - >-
      The design corrects the idea's Poisson prediction to the exact two-sign
      random-model value D_pred = 1 - B2/(p-1) + B2/(2(p-B2)) before any run,
      and replaces the planted dense sub-box with a planted clustered set of
      known effect (rho about 1.67), so that the sensitivity gate is decidable
      at every shape.
    - >-
      Priority is low (counting only, no exponent mechanism; yield conserved
      by KN-FIND-007). It is designed now because open ECC ideas are designed,
      not shelved (AGENTS.md "ECC comes first"), and its cost is small
      (about 1.6 core-hours analytic).
  evidence_refs:
    - ledger/proposals/IDEA-20261015-5888a7.yaml
    - ledger/proposals/IDEA-20261015-5888a7.notes.md
    - knowledge/findings/KN-FIND-007.md
    - experiments/EXP-CMFB-cea1d2/specification.yaml
  limitations:
