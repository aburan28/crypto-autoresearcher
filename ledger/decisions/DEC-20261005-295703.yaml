coordinator_decision:
  id: DEC-20261005-295703
  context: >-
    Design tick on 2026-10-05. origin/main was fetched at
    f5b5a0efae5331bac173f05f5bf70c2b32f82225 and had not moved.
    The height regression is already frozen as EXP-PAIR-894a7f.
    No newer uncited non-arithmetic ECC idea is on main. The
    remaining named cell of IDEA-20261005-3a18d1 is the
    16-bit through 28-bit prime bins. The arithmetic statements
    declined by DEC-20261005-138b51 stay declined.
  decision: approve
  target_ids:
    - IDEA-20261005-3a18d1
    - H-PAIR-48510d
    - EXP-PAIR-c28df1
  rationale:
    - >-
      PAIR is an ECC area. The contract point-counts both
      twists at the smallest split and inert prime in each
      named bit bin.
    - >-
      A design-session count, not a run, gave twist traces
      {t, -t} on all 12 split cells and zero norm-equation hits
      on 12 inert cells that each still have one root.
    - >-
      Standing user authorization of 2026-09-06 covers approval.
      The protocol fields required before dispatch are filled.
    - >-
      The cells are the smallest prime in each bin. Unnamed
      primes in the same bin stay outside this contract.
  evidence_refs: []
  limitations:
    - The largest prime is 134218171 and the largest class number is 5.
    - Twelve matches do not certify any unnamed prime.
    - Approval authorizes two deterministic runs. It does not assert the traces.
  next_actions:
    - >-
      Snapshot-archive this contract. Do not launch
      TASK-20261005-84a69f until the receipt verifies.
  knowledge_promotion:
    promoted: []
    not_warranted: Approval of an unrun contract. No finding is promoted.
  decided_by: coordinator
  decided_at: '2026-10-05'
