coordinator_decision:
  id: DEC-20260802-007
  recorded_at: '2026-08-02'
  goal_id: GOAL-HAWK-001
  question_id: RQ-HAWK-001
  batch_id: BATCH-001
  decision: refine
  title: >-
    BATCH-001 close - re-scope GOAL-HAWK-001 off "polynomial-time"; source
    acquisition partially discharged; no ideation authorized
  target_ids: [GOAL-HAWK-001, RQ-HAWK-001, BATCH-001, EV-HAWK-001]
  hypothesis_transition: null
  evidence_refs: [EV-HAWK-001]
  applies_to_goal: GOAL-HAWK-001
  decided_at: '2026-08-02'
  target_note: >-
    The target is the GOAL's SCOPE, not a hypothesis. GOAL-HAWK-001 has no
    hypothesis and this decision creates none. NO HYPOTHESIS STATUS MOVES.
  evidence_ids: [EV-HAWK-001]
  disposition: refine
  disposition_note: >-
    `refine` is the correct transition and the alternatives are wrong. `support`
    and `weaken` are unavailable because no hypothesis exists. `reject_scoped`
    would assert valid evidence contradicting a tested prediction; nothing was
    tested. `inconclusive` would understate a batch that established checkable
    facts and had them independently re-measured. `pause` is unavailable because
    NO PAUSE CONDITION HAS FIRED - the campaign is on batch 1 of 6 and the source
    blocker is origin-side, not a network-policy denial.

  what_is_decided:
    - id: D-1
      decision: >-
        THE GOAL'S OBJECTIVE IS RE-SCOPED OFF "POLYNOMIAL-TIME".
      rationale: >-
        GOAL-HAWK-001's objective reads "Independently verify or refute the
        reported classical polynomial-time smLIP key-recovery attack on HAWK".
        Against the obtained primary sources that phrase does not pick out a live
        target. For iacr:2026/1318 the polynomial-time claim is WITHDRAWN BY ITS
        OWN AUTHORS in the 30/06 update - "the main algorithm appears to run in
        super-polynomial time" - so there is nothing polynomial left to verify or
        refute. For the disclosed attack (Straznickas-Weis) the reduction is
        unconditional but the cost is EXPONENTIAL, 2^{(n/2+1)+o(n)} with a
        provable sieve oracle; it halves an exponent, it is not polynomial.
      scope_after: >-
        The goal's live target is the DISCLOSED ATTACK's exponent-halving claim
        and its concrete cost at HAWK's deployed parameter sets, plus the
        SEPARATE question of what iacr:2026/1318's corrected super-polynomial cost
        actually is. These are two different targets and must not be merged again.
      what_this_does_not_decide: >-
        NOTHING about whether either attack is correct, and nothing about HAWK's
        security. Re-scoping a question is not answering it.
    - id: D-2
      decision: >-
        THE SOURCE-ACQUISITION PRECONDITION IS PARTIALLY DISCHARGED, AND THE
        REMAINDER IS CARRIED FORWARD RATHER THAN WAIVED.
      obtained_full_text: >-
        van Gent-Pulles 2025 (KN-LIT-7673, citation_verified read) and the
        disclosed attack (KN-LIT-7592, upgraded web->read).
      not_obtained: >-
        The four heuristics of iacr:2026/1318 - the object the goal's original
        next_action actually named. Only its abstract and 30/06 update were
        obtained. THIS OBLIGATION SURVIVES INTACT AND IS NOT WAIVED BY THIS
        DECISION.
    - id: D-3
      decision: >-
        NO IDEATION IS AUTHORIZED YET.
      rationale: >-
        RQ-HAWK-001's constraint is explicit: "No experiment may be designed until
        the relevant primary sources are filed as KN-LIT entries." Two of four are
        filed at `read`. The third is abstract-only. Authorizing /propose-ideas
        now would proceed on a source base the goal itself declared insufficient.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NO KN-FIND IS PROMOTED, and the reason is structural rather than
      circumstantial. knowledge/README.md restricts findings/ to results produced
      by THIS program, promoted only from an evidence record at strength
      `replicated` or `strong`. EV-HAWK-001 is `literature`/`inconclusive` and
      this program produced no result - it READ OTHER PEOPLE'S WORK. The batch's
      output belongs in literature/ and it is there: KN-LIT-7673 (new),
      KN-LIT-7674 (new, superseding KN-LIT-7670), and the KN-LIT-7592 provenance
      upgrade.
    open_item_flagged_by_red_team: >-
      TASK-20260802-007 objection O3 notes that the batch's cross-paper synthesis
      - that the disclosed attack removes van Gent-Pulles's heuristic step - is
      filed inside KN-LIT relay records, while knowledge/SEEDING.md holds that a
      literature entry never becomes a finding. THE OBJECTION IS UPHELD AS A REAL
      TENSION AND IS NOT RESOLVED HERE. Whether a cross-source synthesis this
      program authored warrants its own record class is a corpus-schema question
      for a later Coordinator decision, carried as CORR-20260802-008 OI-4.

  promotion_gates:
    status: NONE ADDRESSED
    detail: >-
      The four asymptotic-complexity promotion gates are not engaged, because
      BATCH-001 ADVANCES NO ASYMPTOTIC CLAIM OF THIS PROGRAM'S OWN. G1 (proof
      decomposition), G2 (numbered heuristics with validation), G3 (concrete-cost
      table), G4 (independent review plus red team on the cost model) are all
      OPEN and untouched. Stated explicitly so this decision cannot be misread as
      gate progress. G4's review machinery ran, but on the ARTIFACT's integrity,
      not on any cost model of ours.

  review_outcomes:
    validator:
      task_id: TASK-20260802-006
      verdict: ADMIT_WITH_QUALIFICATIONS
      accepted: >-
        Receipts verify; both censuses independently reproduced exactly from
        byte-identical re-acquisitions; no claim depends on a damaged formula;
        the KN-LIT-7592 upgrade edited no claim (21 insertions, 1 deletion, the
        deleted line being citation_verified: web).
      qualifications_upheld: >-
        Q5, that "this attack has no heuristics" is broader than the census
        supports; the unmarked damaged renderings in
        disclosed_attack_transcription.md; the non-reproducing SRC-4 extraction
        hash (pdfminer.six is nondeterministic on that PDF - three distinct
        hashes over five runs, all length 78015); and the omission of van
        Gent-Pulles's own "this work does not affect the security of HAWK".
    red_team:
      task_id: TASK-20260802-007
      verdict: ADMIT_WITH_ONE_CRITICAL_CORRECTION
      critical_objection_upheld: >-
        O1. The producer recorded the iacr:2026/1318 abstract as truncated. It is
        not and never was. The omitted text contains the authors' withdrawal of
        the polynomial-time claim AND the report that Heuristics 1-3 have been
        independently experimentally verified. Corrected by KN-LIT-7674 and
        CORR-20260802-008.
      further_objections_upheld: >-
        O2 (program-voice "discharges" stronger than the authors' "upgrades the
        endgame", and the Pareto axis never put in a common unit); O5's two
        factual corrections - "four days" should be ONE day, and the claim that
        the goal's next_action was defective is AN OVERREAD, since the modifier
        attaches to the four sources collectively. The real conflation is in
        RQ-HAWK-001.motivation, which the batch missed.
      objection_clean: >-
        Duty 3's "negligible" direction. The batch neither inherits nor dismisses
        KN-LIT-7592's gate figures and HAWK-256 recovery.

  corrections_issued: [CORR-20260802-008]
  self_assessment: >-
    BOTH REVIEWS FOUND DEFECTS THE PRODUCER HAD NOT, AND THE MOST IMPORTANT ONE
    WAS SELF-INFLICTED AND HAD ALREADY BEEN PUBLISHED. The truncation error
    entered the corpus in KN-LIT-7670 on 2026-08-01, one batch before this goal
    existed, and would have propagated into this goal's evidence record had the
    Red Team not caught it. That is the review machinery working, and it is also
    a measured failure rate of this program's own reading discipline: an
    extraction artifact was recorded as a property of a source and survived two
    commits before challenge.

  boundaries_on_this_decision:
    changes_no_hypothesis_status: true
    creates_no_hypothesis: true
    authorizes_no_experiment: true
    authorizes_no_run: true
    is_not_a_cryptanalytic_result: true
    makes_no_hawk_security_assessment: true
    admissible_toward_closure_quorum: false
    quorum_note: >-
      Producer, validator, red team and coordinator all resolved to
      claude-opus-5. Independence is PROCEDURAL, not model-level. AGENTS.md rule
      13 requires three pairwise-distinct resolved_model_id attestations and this
      batch supplies none.

  next_action: >-
    EXACTLY ONE - open BATCH-002 as a source-completion and re-scoping batch. It
    must (a) retry routes A4 and A5 for iacr:2026/1318 from a fresh quota, with a
    NAMED retry-by date and owner so pause condition 2 becomes falsifiable, and
    if they fail, execute the Red Team's named cheapest untried route, a
    contact-author request - explicitly NOT proxying the gated PDF; (b) supersede
    KN-OPEN-027, whose question 1 is now partly answered by OBS-3 (Heuristics 1-3
    independently verified, Heuristic 4 failed and its failure is why the
    algorithm is super-polynomial); and (c) amend RQ-HAWK-001's motivation, which
    is the record that actually conflates the two attacks. DO NOT run
    /propose-ideas until (a) resolves in either direction.

  decided_by: coordinator
