  required_repairs:
    - id: REV-GAP-REPRESENTATION-007
      severity: critical
      predecessor_finding: REV-BOOT-GAP-001
      obligation: >-
        Freeze a canonical scalar representation, interval refinement rule,
        comparison and tie-breaking rule, record kind, and archive allocation for
        the 8191 retained gap values and their selected endpoints.
    - id: REV-CANONICAL-SCHEDULE-008
      severity: critical
      predecessor_finding: REV-SERIALIZATION-002
      obligation: >-
        Make COMPSCH2 flags, counters and equation bytes, PROVRC02 nested JSON
        and its escaping, and the complete ALIASv02 field layout byte-canonical
        with fixtures, so that exactly one byte string is admissible.
    - id: REV-RESOURCE-CONSUMER-009
      severity: critical
      predecessor_finding: REV-RESOURCE-ARTIFACT-004
      obligation: >-
        Add the omitted mandatory consumers and their rows: per-arm sorts and
        quantile endpoints, independent rank and retained-index comparison, S3
        index consumption, and gap archive traffic, then recompute every affected
        operation, logical-I/O, write, read, reserve and hard-cap equation.
    - id: REV-PACKAGE-FINALIZATION-010
      severity: critical
      predecessor_finding: REV-RESOURCE-ARTIFACT-004
      obligation: >-
        Split execution capture, package construction, immutable reread
        validation, and the final external receipt into an acyclic graph so that
        S4 no longer claims final measurements, validity, hashes, rereads and
        verification inside the same immutable logs, provenance and index it is
        still producing.
    - id: REV-MUTATION-LAYER-011
      severity: major
      predecessor_finding: REV-MUTATION-CONTROL-005
      obligation: >-
        Freeze the mutation enclosure, byte offsets, retained and rebound
        digests, and ALIASv02 parsing so that the required first error is exactly
        reproducible.
