  rationale:
    - >-
      The precondition stated by the BATCH-c3c474 checkpoint is met: the
      disposition was durably archived by completed ledger-archive task
      TASK-20260809-20aead, whose receipt is on disk, so opening a fresh
      non-overlapping design-repair batch is the action the checkpoint itself
      names.
    - >-
      The five carried-forward findings are specification defects, not
      mathematical or empirical results. REV-GAP-REPRESENTATION-007,
      REV-CANONICAL-SCHEDULE-008, REV-RESOURCE-CONSUMER-009 and
      REV-PACKAGE-FINALIZATION-010 are critical and REV-MUTATION-LAYER-011 is
      major; together they mean the design has no canonical archived gap
      representation, admits multiple byte encodings, omits mandatory resource
      consumers, attests final measurements about files it is still producing,
      and cannot reproduce its own required first mutation error. A design with
      those properties cannot be independently reproduced, so implementing or
      executing it would generate artifacts no reviewer could rebind.
    - >-
      EXP-ECDLP-ffa5c3 is immutable and stays immutable. AGENTS.md rule 4 and
      rule 15 require supersession by a new record rather than repair in place,
      which is why this batch authorizes authoring a successor design rather
      than editing the frozen specification.
    - >-
      The producing session may not also be the reviewing session. The batch
      therefore reserves one independent review-adversarial task at xhigh in a
      distinct session, and the Coordinator alone owns the two archival commits.
    - >-
      Budget discipline: max_concurrent is set to 1 because the execution
      machine is shared with other campaigns, and the recorded cost of
      oversubscribing a shared machine is on file at GOAL-AES-003 BATCH-002
      (DEC-20260802-b226fb budget_accounting). No budget field is raised.
  limitations:
    - >-
      This decision produces no evidence about ECDLP. It approves coordination
      work only: no implementation, no execution, no run record, no empirical
      observation, no curve, no selector, no solver, and no measurement.
    - >-
      No hypothesis status moves. No research-question status moves. No
      experiment status moves: EXP-ECDLP-ffa5c3 stays at review_required.
    - >-
      Authorizing creation of the EXP-ECDLP-d4d43e record is not an experiment
      approval. It is created at review_required with approved_by null, it
      inherits the apparatus-design claim ceiling unchanged, and its existence
      asserts nothing about whether the design is correct, implementable, or
      worth running.
    - >-
