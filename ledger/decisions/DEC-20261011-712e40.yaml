  # ---------------------------------------------------------------------------
  # STEP 1. A READ, NOT AN APPROVAL. Runs are used only as facts about what each
  # contract measured, never as evidence about H-SEMBIN-2d7708.
  # ---------------------------------------------------------------------------
  step1_read:
    status: read_only
    EXP-SEMBIN-79a02d:
      m2_window_cells: none. Frozen cells n in {12, 15}, m = t = 3, k = ceil(n/3) (specification independent_variables; definitions.md section 0).
      where_defined: >-
        Frozen contract: "SOLV4 via degree-4 capped GF(2) closure", metric
        solv4_closure_iterations "to fixpoint". Operational details in
        stage0/definitions.md section 2, frozen before Stage 1 as executor
        operationalizations reported for Coordinator ratification (answering
        DEC-20261005-3d5aea N2). Not ratified by any decision on the tree read.
      closure: iterated W_4 to a fixed point; a single-level reading is not measured.
      multiplier_budget: >-
        Level 0 admits m * f whenever the BOOLEAN product degree is <= D, including
        products whose degree falls by x^2 = x (deg m up to D); rounds multiply
        W intersected with B_{<=D-1} by single variables.
      order: >-
        Columns degree-descending, ties lexicographic on the sorted index tuple; used
        only to read off the low part. W_D stated order-independent.
      sufficiency: both. Records codim = dim B_{<=D} - dim W_D and 1 in W; SOLV-D iff codim = |V| (enumerated); 1 in W with |V| > 0 is a C2 disagreement.
      facts_measured: >-
        RUN-SEMBIN-004d51 (Stage 1, failed_implementation), -bdfd41 (Stage 1,
        corrected), -694183 and -5d7618 (Stage 2 at n = 12 and 15), -6c5c56 (Stage 3
        engine inventory). RESULTS.md labels O-DFF-ANOMALY (SR-7 escalation). No
        m = 2 cell, so nothing about the window.
    EXP-SEMBIN-35bf67:
      m2_window_cells: >-
        (40, 2, 2, 20) as the SR-3 baseline smoke and as a Stage-2 decisive cell, and
        (45, 2, 2, 23) as the Kosters probe. Not (41,2,2,21), (42,2,2,21), (43,2,2,22)
        or (44,2,2,22).
      where_defined: >-
        Frozen contract: dim_R4 "dimension of the degree-4 capped closure fixed
        point", closure_round_count "to fixpoint", M_le4 square-free count, "SOLV4
        identity uses exact per-instance s". Multiplier rule, order and early stop in
        stage0 OP-R4 and OP-SOLV4, pre-registered before any Stage-1 output and
        "submitted for Coordinator ratification". Not ratified by any decision on the
        tree read.
      closure: iterated R_4 fixed point.
      multiplier_budget: >-
        m * f with deg m <= 4 - deg f (formal, XL rule; implementation note D-13
        states products that fall below 4 only by cancellation are not admitted
        separately), closed under x * g for g of degree <= 3.
      order: columns degree-descending (4, 3, 2, 1, 0); tie-break not stated; verdict depends on dim only.
      sufficiency: both. SOLV4 iff dim R_4 = M_le4 - s with exact s; sound early stop at rank M_le4 - rE, then SOLV4 iff rE = s.
      facts_measured: >-
        Runs on the tree read: RUN-SEMBIN-a0d778 (Stage-1 engine gate), -745bf5
        (builder check), -814631 (Stage-1 smoke at (40,2,2,20), 8 SAT + 8 UNSAT,
        manifest status completed_valid, SR3_fail false), -24e9d9 (Stage 2 at
        (30,2,2,15)). No stage2/census.json and no RESULTS.md on the tree read; the
        Stage-2 (40,2,2,20) re-execution named in implementation note D-14
        (RUN-SEMBIN-cfd1a7) is not on the tree read. No evidence review exists.
    comparison_with_EV-SEMBIN-702d1d_and_DEC-20261005-859f40:
      F-3_one_level_vs_iterated: >-
        Both siblings define an iterated closure, so F-3's literal-versus-iterated
        flip does not arise between them and RUN-SEMBIN-5ed13e. 35bf67's multiplier
        rule equals 5ed13e's (EV claim scope: "multiplier budget D - deg f"); 79a02d's
        level-0 rule is the Boolean-degree reading and may give a different fixed
        point. That difference is untested.
      F-4_and_R4_order: >-
        Both siblings decide by codim = |V| (rank deficiency against the exact count),
        which does not depend on the order. F-4's order dependence concerns N_std from
        leading-monomial divisibility. On the twelve windows the codim rule and the
        N_std rule give the same label (EV arithmetic on recorded numbers).
      RD-6_one_in_W: >-
        79a02d compares 1 in W with |V| explicitly. 35bf67 always compares with exact s.
        Neither has the RD-6 defect as written.
      R3_contract_text: >-
        Neither sibling's frozen specification fixes the multiplier rule; both rest it
        on unratified Stage-0 executor operationalizations, and the two choose
        differently.

  criterion:
    text_of_NA-1: >-
      Write the v1 -> v2 amendment IF the read finds the m = 2 window baseline is not
      already carried by 35bf67 or 79a02d with a defined certificate; OTHERWISE
      supersede the remaining window scope to those contracts and cite
      EV-SEMBIN-702d1d for the facts.
    deterministic_resolution_of_carried: >-
      Fixed here, before the branch is chosen, and applied to both siblings alike.
      "Carried with a defined certificate" requires both: (a) the baseline cell is in
      a contract whose certificate is fixed on all four axes (closure type,
      multiplier rule, order where a statement depends on it, verdict rule) by its
      frozen specification or by a Coordinator-ratified record; and (b) the same
      contract measures the window cells that baseline anchors, so that the window
      and its baseline are read under one certificate.
    finding:
      EXP-SEMBIN-79a02d: not carried. It has no m = 2 cell.
      EXP-SEMBIN-35bf67: >-
        Not carried. (a) fails: its frozen specification fixes iteration and the |V|
        rule but not the multiplier rule, which lives in OP-R4, an unratified executor
        operationalization. (b) fails: it measures n = 40 and 45, not n = 41..44.
      honest_note: >-
        On the narrowest reading (the n = 40 cell measured under a pre-registered
        definition complete on every axis), 35bf67 comes close. The decision does not
        rest on that gap alone: superseding the window to 35bf67 would drop four of the
        six window cells, including n = 44 where DEC-20261005-859f40 R13 names a lead,
        with no contract to carry them. That would abandon a named lead without a
        successor (AGENTS.md "Research-direction integrity").
    branch_taken: amend

