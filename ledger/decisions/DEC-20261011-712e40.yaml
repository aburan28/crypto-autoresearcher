  # ---------------------------------------------------------------------------
  # RULINGS
  # ---------------------------------------------------------------------------
  rulings:
    - id: R1
      question: Does EXP-SEMBIN-79a02d carry the m = 2 window baseline?
      ruling: No. Its frozen cells are n in {12, 15} at m = t = 3. It defines a certificate, but for a different cell family.
    - id: R2
      question: Does EXP-SEMBIN-35bf67 carry it?
      ruling: >-
        No, by the resolution under `criterion`. Its certificate object (iterated,
        rank deficiency against exact s) is the one v2 adopts, but its multiplier rule
        is not fixed by its frozen contract and it does not measure n = 41..44. This
        ruling does NOT ratify or reject 35bf67's OP-R4 or OP-SOLV4 for 35bf67. That
        is a question for its own review.
    - id: R3
      question: What does the amendment fix?
      ruling: >-
        Adopted as written in experiments/EXP-SEMBIN-7e1371/amendments/v1_to_v2.yaml:
        C-1 certificate = iterated degree-capped closure W_D in the Boolean quotient,
        D = 4 for the verdict, literal block kept as a secondary metric with no verdict;
        C-2 the formal product-degree reading (deg m + deg f <= D), field equations
        implicit, the 79a02d Boolean-degree reading named and not adopted; C-3
        degrevlex with x_1 largest for every leading- or standard-monomial statement,
        secondary only; C-4 sufficient iff codim_4 = |V|, insufficient iff
        codim_4 > |V|, with |V| from two independent enumerations, 1 in W always
        compared with |V|, sound early stop only with intermediate records flagged, and
        the (closure, D, multiplier, order, rule) label; C-5 the n = 17 and n = 40
        baseline restated for W_4 (c_4 = 102091 at n = 40) and the precedence of
        stopping rule 1 over falsification clause 1; C-6 the (2, 2) nearby-object
        repair; C-7 a completeness cross-check by a second closure implementation for
        every insufficient diagonal verdict and every baseline verdict; C-8 the
        'degree <= 3' and field-equation repairs; C-9 a new seed family with the twelve
        systems named and excluded. The amendment is labelled post-data and
        exploratory for everything already seen, and discloses that this Coordinator
        also saw the 35bf67 smoke counts and the 79a02d RESULTS summary while
        writing it.
    - id: R4
      question: How are the twelve window records read under v2?
      ruling: >-
        As exploratory observations only (DEC-20261005-859f40 R5 unchanged). Their
        object coincides with C-1 to C-4 on those records, but the definition was
        chosen after they were seen. They are never v2 verdicts, never part of a v2
        control, and never pooled with v2-seed draws. No record is re-labelled.
    - id: R5
      question: The RUN-SEMBIN-9bb990 status (R6) and inference block (DV-9).
      ruling: >-
        Written as experiments/EXP-SEMBIN-7e1371/runs/RUN-SEMBIN-9bb990/manifest_v2.yaml
        and one appended registry entry whose two sha256 fields are left as
        TO_BE_FILLED_BY_DISPATCHER for TASK-20261011-2e0636 to compute. The run-level
        word stays completed_invalid: the vocabulary of docs/task-lifecycle.md section 6
        has no per-class word, and a run containing a contradicted measurement record
        must not be read as completed_valid. The narrowing R6 asks for is carried as
        machine-readable status_scope and validity.by_record_class, which govern. The
        inference block records every field as unknown: neither the run-root
        environment.json nor any per-worker environment.json under the run directory
        contains a policy, model, effort, fallback, provider or backend field (search
        of every environment.json in that directory; validator W8-3 reached the same
        finding for the manifest). Nothing is filled from the producing handoff.
    - id: R6
      question: Does IMP-SEMBIN-7E1371-CERT clear?
      ruling: >-
        Yes, effective when TASK-20261011-2e0636 verifies. Its clears_when has two
        parts. (1) "A Coordinator decision records the certificate definition for this
        lane (an additive protocol_amendment v1 to v2 ...)": this decision and the
        amendment. (2) "For any adverse reading of the window pattern, a
        review-breakthrough round at max has been served ... or the claim is recorded
        as un-promoted": no adverse reading is made here, and the R13 lead of
        DEC-20261005-859f40 is recorded un-promoted (R8). What stays true after it
        clears: the twelve records can never be read against v1's or v2's confirmatory
        criteria (R4), and a v2 run still needs its own dispatch decision.
        IMP-SEMBIN-ENGINE is not touched.
    - id: R7
      question: What does this read hand to the reviewers of the sibling lanes?
      ruling: >-
        A pointer, not a ruling on those contracts. The review plan owed for
        EXP-SEMBIN-79a02d (DEC-20261005-3d5aea B3) and the one owed for
        EXP-SEMBIN-35bf67 should own one joint: certificate comparability across lanes.
        79a02d's level-0 rule (Boolean product degree) and 35bf67's (formal degree, the
        rule v2 adopts) may give different fixed points. Worked attack: on small
        chained systems where both are affordable, compute both fixed points and count
        dim and label differences, as F-3 did for literal versus iterated. Until that
        is measured, a SOLV4 value from one lane is not assumed equal to the other's or
        to a v2 verdict.
    - id: R8
      question: Is any adverse claim made or promoted?
      ruling: >-
        No. The window pattern of DEC-20261005-859f40 R13 stays a named, un-promoted
        lead. Its test boundary, remaining uncertainty and revisit condition are now
        concrete: v2-seed draws at n = 44 and 45 under C-1 to C-4 with the C-6 and C-7
        controls, and the 35bf67 Stage-2 Kosters cell once reviewed. Any weaken or
        reject_scoped reading needs replication, a refutation artifact and
        review-breakthrough at max.
    - id: R9
      question: Should a correction record for the R8 wording be written (CORR-20261011-abc76b)?
      ruling: >-
        Not written; the pre-minted id stays unused. DEC-20261005-859f40 R8 is already
        a committed, additive disclosure carrying the corrected wording, and
        manifest_v2.yaml now points every reader of RUN-SEMBIN-9bb990 to it
        (record_defects_disclosed). A CORR record would restate the same text in a
        third place. The correction owed against RUN-SEMBIN-b6eb9f
        (DEC-20261005-859f40 R11 item 7) is a different record and is not covered here.

  impediments:
    - id: IMP-SEMBIN-7E1371-CERT
      action: cleared
      effective_when: TASK-20261011-2e0636 verifies
      basis: R6
      goal_head_entry: added to ledger/goals/GOAL-SEMBIN-5078bc/goal.yaml impediments with its cleared fields
    - id: IMP-SEMBIN-ENGINE
      action: none

  rationale:
    - >-
      WHY AMEND AND NOT SUPERSEDE. The criterion's condition holds (R1, R2). And the
      alternative would leave four window cells without a contract and the R13 lead
      without a test.
    - >-
      WHY THIS CERTIFICATE. It is the object the instrument measured and the review
      validated, and the object 35bf67 froze independently of this experiment's data.
      Choosing it aligns v2 with 35bf67 at the two shared cells, (40,2,2,20) and
      (45,2,2,23), so a later cross-lane comparison compares like with like. The
      choice was made after the literal block's baseline failure was known; the
      amendment says so and keeps every seen record out of every v2 control and
      criterion.
    - >-
      WHY THE CRITERIA TEXT IS NOT REWORDED. v1's prediction (sufficient at every
      n = 40..45) was written before any data. The three insufficient W_4 window
      records are known. Rewording the prediction now would be changing a success
      criterion after observing outcomes. Only the object, one precedence and one
      defective control change, each disclosed as post-data.
    - >-
      WHY THE ONE NEXT ACTION IS NOT A v2 RUN. v2 adopts the closure object whose
      sibling-lane instrument facts (79a02d complete, 35bf67 partial) are not yet
      reviewed. The completed 79a02d run set has no run-snapshot receipt on the tree
      read, and its review is the next claim-changing step for the goal. A v2 dispatch
      also needs the runnable and capacity checks this session cannot run.

