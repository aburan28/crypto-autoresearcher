    - docs/task-lifecycle.md

  limitations:
    - >-
      No shell. No hash, git command, validator, allocator or tool was run. The
      runnable check (tools/newest_experiments.py) and the capacity check were not run,
      which is one reason nothing is dispatched.
    - >-
      The 35bf67 and 79a02d facts come from unreviewed runs and are used only as facts
      about what each contract measured. Reading the 35bf67 smoke counts and the 79a02d
      summary before writing v2 is disclosed in the amendment's data_status.
    - >-
      Whether the formal and Boolean multiplier rules give different W_4 fixed points
      on chained Semaev systems is untested (R7).
    - >-
      The equivalence of the implicit Boolean ring with explicit field equations rests
      on composed W3 (a): argued, and checked on 60 systems with N 4..7, not at window
      scale.
    - >-
      The (2, 2) identity of eq. (4) and eq. (5) is still relayed, not checked; C-6
      turns it into a per-cell check instead of assuming it.
    - >-
      Exhaustive |V| for the C-6 sparse null may be unaffordable at n = 43..45
      (N = 44, 46); there the control is unreached and sufficient primary verdicts are
      labelled control_unreached.
    - >-
      The read used the tree before the dispatcher's merge of e229d0c391; the
      dispatcher reports no relevant change in it.
    - >-
      No visual artifact accompanies this record: it is not a run, an evidence review
