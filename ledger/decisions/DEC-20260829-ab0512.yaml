  next_actions:
    - >-
      NEXT SESSION, FIRST ACT: draft BATCH-820ee8 under
      coordination/goals/GOAL-ENDO-001/batches/BATCH-820ee8/ per this
      decision -- batch.yaml (controlling_decision: DEC-20260829-ab0512,
      predecessor_batch: BATCH-90392b), a review-plan.yaml written BEFORE
      any reviewer runs (coordinator prior recorded first; joints with one
      owner and a worked attack each in the
      check_review_independence.py vocabulary: `joint:` keys, string
      `attack_plan:` fields, and a `proves_too_much.failure_signature` --
      avoiding the six schema mismatches recorded as procedure deviations in
      DEC-20260825-dc7a01), a dispatch_queue.json with goal_id set whose
      five tasks (executor producer of the harness attachment package,
      coordinator snapshot archive, validator, red-team, coordinator ledger
      archive) carry exact artifact_paths, exclusive write_scopes, budgets,
      and full handoff envelopes in the AGENTS.md shape, and ledger handoff
      records. Then merge origin/main, snapshot-archive the goal/queue/
      handoffs before any worker runs, claim and dispatch the producer.
    - >-
      The producer's deliverable package (scope for the queue drafter): (1)
      a runtime-session-receipt schema extension to v2 that adds
      host_binding.host_id, host_binding.filesystem_id, and
      host_binding.filesystem_mount with declared provenance and
      verification semantics consistent with the v5 closure's
      authoritative-binding rule; (2) a minimal, runnable procedure or
      script by which any dispatched session emits a receipt with a REAL,
      verifiable host binding for its own session (source: the host's own
      identity surfaces; no caller-supplied values); (3) a demonstration
      receipt emitted by the producer's own session exercising that
      procedure; (4) a control proving the v5 STOP still fires on a
      caller-supplied or missing binding under the v2 schema. Deliverables
      stay inside the batch's write_scope; no experiment runs; the
      authorization boundary of j3-closure-v5.yaml is not relaxed.
