coordinator_decision:
  id: DEC-20260805-9a1c47
  context: >-
    GOAL-AES-003 BATCH-009 close. A single producer built and ran the
    inventor-protocol section 3 null object this campaign had owed itself
    since its first yoyo excess reading: a lazily-sampled uniform random
    bijection substituting the cipher itself at r=5, plus RC-11 trial-index
    pairing. The package was bound by a dispatcher-verified snapshot archive
    at commit db9322b6 (44 declared paths) and reviewed by one independent
    validator, verdict passed. This ledger archive also carries the merge of
    origin/main forward into this branch, deferred until the producer stopped
    writing, and the schema gaps that merge surfaced (CORR-20260805-1c9e4a).
  decision: support_with_scope_reduction
  target_ids: [RQ-AES-003, GOAL-AES-003, EV-AES-e4c091]

  rationale:
    - >-
      THE BATCH DISCHARGED A REAL DEBT AND THE RESULT IS NEGATIVE, WHICH IS
      THE OUTCOME IT WAS BUILT TO BE ABLE TO RETURN. Deliverable zero tested
      the campaign's own claim that no such control had ever been run -- and
      unlike the last four absence claims in this campaign, this one was
      TRUE, confirmed by two independent re-derivations (Coordinator and
      validator, from different starting points). The subsequent measurement
      shows the r=5 excess does NOT survive cipher substitution: 14 hits
      against a matched ideal-permutation arm's 1, sharpening to 18.7x
      [6.74, 59.27] at 8x exposure on the null arm alone. This removes the
      probe-geometry-plus-counting explanation for five batches of yoyo
      readings. It does not establish the excess is real; it removes one
      artifact explanation and leaves every other standing, exactly as
      preregistered.
    - >-
      THE CONSTRUCTION WAS CHECKED THE ONLY WAY THAT COULD HAVE CAUGHT A
      SUBTLE FLAW: LINE BY LINE, AGAINST WHAT A UNIFORM RANDOM BIJECTION
      ACTUALLY REQUIRES. An independent validator traced the injectivity-
      rejection logic on the forward draws and the exact domain-exclusion sets
      on the inverse draws, confirmed the implementation realises the correct
      conditional law given the four oracle queries per trial, and ruled the
      cross-trial birthday bound a valid if slightly conservative union bound.
      This is the class of check that would have caught a null object that was
      not actually null, and it passed.
    - >-
      A REAL DEFECT WAS FOUND AND IS NOT SMOOTHED OVER. The producer correctly
      excluded six unpreregistered geometry arms from any pooled statistic on
      non-independence grounds, but did not apply the same scrutiny to its own
      two preregistered null-object arms: N1 and N2 share identical cipher
      stream and thread seeds, so N1's trials are a prefix of N2's, and the
      RESULTS.json "pooled" figure silently double-counts them. This decision
      WITHDRAWS the pooled figure as decision-relevant and directs that the
      8x-exposure comparison (N2 alone) be cited in its place -- both narrower
      and cleaner than the withdrawn number. The underlying producer artifact
      is not edited; the correction lives in EV-AES-e4c091, OBS-B9-5.
    - >-
      THE COORDINATOR'S OWN BRIEFING TO THE REVIEWER CONTAINED TWO ERRORS,
      RECORDED HERE RATHER THAN QUIETLY DROPPED. The validator was told a
      SIGTERM occurred during this task's instrument development; no such
      event exists in this task's artifacts. It conflates a real, correctly-
      disclosed build bug in THIS task with a real, correctly-disclosed
      SIGTERM from BATCH-008, which this task's own RESULTS.json cites
      accurately only as the reason its arms ran in the background. The
      validator was also told all six geometry extension arms read bit-
      identical to the null; only three do, and the producer's own artifact
      was already precise about this. Neither error changed the batch's
      substance -- the validator caught both by reading the bound artifacts
      directly rather than trusting the brief -- but a Coordinator's
      characterization of a producer's work is not exempt from the same
      standard the producer's own claims are held to, and this decision
      records that explicitly.

  evidence_refs:
    - EV-AES-e4c091
    - CORR-20260805-1c9e4a

  what_this_decision_does_not_do:
    - It does not claim the r=5 excess is real, or that it has a mechanism.
    - >-
      It does not authorize a second null-object construction as urgent; one
      is proposed as the next action, not asserted to be needed before the
      result can be reported.
    - It does not advance any closure criterion; no model independence exists under standing basis 0137a051eb5828789eb267fa83c8278086578d4c.
    - It does not promote anything to the knowledge corpus. See below.

  the_absence_claim_pattern_update: >-
    This batch's absence claim (no null object had ever been run) was TRUE,
    the first of five recent absence claims in this campaign to survive
    independent checking -- three by the Coordinator (CORR-20260803-c92db5,
    -7d41c8, and the RC-10-premise error inside -7d41c8's own successor
    CORR-20260803-8fa302), one by a reviewer (RC-9's status field), and now
    one that held. The mechanical rule added after the fourth failure --
    a document may not assert something was never measured unless it records
    the search performed -- is what produced this success: SEARCH_RECORD.md
    existed, was written before measurement, and was independently re-run
    rather than trusted. The rule is working as intended and stays in force.

  branch_hygiene_and_schema_findings: >-
    This ledger commit also carries the deferred merge of origin/main
    (863+ commits) into this branch and the required post-merge
    re-validation. Four validate_ledger.py failures surfaced, one of which is
    a genuine authoring defect of the Coordinator's own: EV-AES-a47618's
    proof_status field carries an invented value never in the schema's enum,
    a check this session should have run against every new ledger record and
    did not. Recorded in CORR-20260805-1c9e4a with the correct value stated
    (derivation) and the pushed record left unedited, so that validator
    failure is now a permanent, disclosed cost on that record -- the same
    shape as BATCH-001 and BATCH-005's published-but-not-official archives.
    tools/validate_ledger_baseline.txt was not touched; its own stated
    invariant forbids adding lines to absorb a new violation, and all four
    surfaced findings are left visible rather than grandfathered.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED YET. The candidate is the localisation pair from BATCH-008
      (byte-locality and S-box-specificity both excluded for the r=5 excess)
      now joined by this batch's third exclusion (probe-geometry-plus-counting
      excluded). Three negative results narrowing the same open question are
      a strong candidate for a knowledge entry once a fourth party -- a red
      team, which two consecutive batches have lacked -- has checked the set
      together rather than each result being promoted piecemeal.

  next_actions:
    - >-
      SINGLE NEXT ACTION: GOAL-AES-003 BATCH-010, rank 1 = a red team pass over
      BATCH-007, BATCH-008 and BATCH-009 TOGETHER, since none of the three has
      had one and their results now compose into a single narrative (the r=5
      excess is a certainty-free real phenomenon, localised to the full word,
      not S-box-specific, and not a probe-geometry artifact) that has never
      been attacked as a whole. Rank 2: a second, differently-constructed null
      object (a wide-block Feistel or a non-AES keyed PRP), to test whether
      OUTCOME-A depends on idealness specifically (residual limitation U4).
      Rank 3: genuinely independent seed-varied replicates of the null-object
      arm, since every replicate run so far (N1/N2, G1-G6) has been correlated
      by construction and none tests reproducibility under fresh randomness.

  budget_accounting:
    producer_declared_seconds: 5400
    producer_consumed_seconds: 2584
    note: >-
      Well inside budget, including the instrument change (v3 to v4, additions
      only) and its equivalence proof.

  limitations:
    - Nothing here is a statement about full-round or deployed AES, and no comparison to published cryptanalysis is made in either direction.
    - Toy tier; one key, one probe geometry, trials from 2^30 to 2^33.
    - Session and implementation independence only; NO model independence, so nothing counts toward a closure quorum.
    - One reviewer, not two, for the third batch running.
    - The pooled N1+N2 statistic is withdrawn as decision-relevant; cite the 8x-exposure comparison instead.

  decided_by: coordinator
  decided_at: 2026-08-05

  inference:
    policy: coordinator-orchestration-code
    requested_policy: coordinator-orchestration-code
    resolved_model: claude-sonnet-5
    fallback_used: true
    model_verified: false
    standing_basis: 0137a051eb5828789eb267fa83c8278086578d4c
