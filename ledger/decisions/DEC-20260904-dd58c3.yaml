    breakthrough_authorized: false

  claim_tier: toy
  scope_statement: >-
    Scoped to full S_4 monodromy at m=4 over the symmetric base, at toy
    scale, on 4 curves at 2 primes. No ECDLP, relation-rate, cost, or
    exponent claim. Does not close KN-OPEN-009 (whose relation-rate half
    remains fully open) but does resolve the imprimitivity/monodromy
    disjunction the question's own title names, at this specific arity and
    scale. Does not extend to m != 4 or to cryptographic scale.

  rationale:
    - >-
      TWO INDEPENDENT REVIEWERS CONVERGING ON THE SAME STRENGTHENED
      ARGUMENT, VIA UNRELATED METHODS, IS STRONGER EVIDENCE THAN EITHER
      REVIEW ALONE OR THAN THE ORIGINAL DESIGN'S OWN PER-SUBGROUP
      ENUMERATION: this is not merely "both reviewers agreed with the
      Executor's own framing" -- both independently discovered a CLEANER
      proof of the same conclusion that the original experiment design did
      not use, a strong signal the underlying mathematics is genuinely
      simple and robust rather than an artifact of a particular framing.
    - >-
      THE VALIDATOR'S OWN FROM-SCRATCH RECOMPUTATION OF THE ENTIRE
      EXHAUSTIVE CENSUS (2,050,300 fibres, exact match on every reported
      digit, two independent construction routes, an independently-
      written factorizer cross-checked against sympy) removes essentially
      all residual doubt about the raw data's own correctness, going well
      beyond the sampled spot-checks this lane's review architecture
      typically produces.
    - >-
      THIS COORDINATOR'S OWN M3 DESIGN DEFECT AND SPECULATIVE-MECHANISM
      ERROR ARE ACCEPTED IN FULL, PRECISELY BECAUSE THEY DID NOT AFFECT THE
      HEADLINE CONCLUSION: this is the fourth consecutive experiment in
      this exact m=4 sub-thread where independent review found a genuine,
      disclosed defect in this Coordinator's own design or reasoning
      (H-MONO-93bc4d's scrutiny-sequencing gap; EXP-MONO-815525's empty
      falsification branch; and now EXP-MONO-0e6e8f's wrong M3 null and
      this Coordinator's own wrong O(1/sqrt(p)) mechanism). Naming this
      pattern plainly is itself a finding: this sub-lane's own review
      architecture has now caught a real, load-bearing issue in every
      single round it has run, a strong argument for continuing to require
      it rather than treating any single result -- however clean-looking --
      as self-evidently correct.
    - >-
      THE #E[4] LEAD IS ACCEPTED AS A GENUINELY VALUABLE, PROPERLY SCOPED
      OBSERVATION, NOT PROMOTED AS EVIDENCE: the Red Team's own matched-
      (t,Z) control finding a #E[4]-driven discrepancy invisible to (t,Z)
      is exactly the kind of cross-experiment structural convergence
      (the SAME invariant recurring in a wholly different question this
      session already investigated) that is worth naming explicitly for
      future work, without overclaiming it as a tested result here.

  next_action: >-
    (1) MEDIUM PRIORITY: design a properly pre-registered follow-up
    specifically targeting the #E[4]-driven discrepancy the Red Team's own
    matched-(t,Z) control surfaced, cross-referencing H-MONO-93bc4d's own
    earlier #E[4] finding explicitly, since this is now the SECOND
    independent context in this session where this exact invariant governs
    structure that (N,tau)/(t,Z) alone does not capture -- a recurring
    theme worth its own dedicated hypothesis. (2) LOW PRIORITY,
    HOUSEKEEPING: RQ-MONO-001's own title remains scoped to "m=3" and
    "geometric" monodromy despite this session's own three-experiment m=4
    extension (EXP-MONO-815525, EXP-MONO-0e6e8f, and the underlying
    H-MONO-93bc4d work); a future session should revise the question
    record's own title/scope to reflect the work actually done under it.
    (3) This closes the m=4 monodromy sub-thread that began with D-3 of
    DEC-20260802-a51c82: the imprimitivity half of KN-OPEN-009 at m=4 is
    now resolved (full symmetric monodromy, no exceptional locus at this
    arity), leaving m>=5 and the relation-rate half as the remaining live
    content under GOAL-MONO-001 and RQ-MONO-001.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This IS a genuine, clean, well-verified result (full S_4 monodromy at
      m=4) that resolves real content named in KN-OPEN-009 -- but this
      Coordinator judges it not yet ready for standalone knowledge-corpus
      promotion in this same cycle, given (a) it is toy-scale only with no
      stated transfer argument to larger m or to arithmetic monodromy at
      cryptographic-scale primes, and (b) the #E[4] lead this same round
      surfaced suggests the full picture at m=4 (arithmetic monodromy
      specifically) may have more structure worth understanding before
      writing a final knowledge entry. Recorded in H-MONO-ebd400's own
      status and this decision instead; promotion can follow a future
      batch that also resolves item (1) above.

  procedure_deviations:
