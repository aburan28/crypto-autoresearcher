      SELF-DISCLOSED, FOURTH CONSECUTIVE COORDINATOR DEFECT IN THIS
      SUB-THREAD: see rationale above. Recorded per this lane's own
      standing discipline of naming a pattern plainly rather than treating
      each instance as isolated.

  limitations:
