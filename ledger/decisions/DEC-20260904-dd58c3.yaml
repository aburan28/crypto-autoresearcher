  hypothesis_status_before: proposed
  hypothesis_status_after: supported
  hypothesis_status_after_note: >-
    H-MONO-ebd400's own two-sided prediction resolves to (I): full S_4
    monodromy at m=4 over the symmetric base is confirmed at toy scale,
    decisively, by a test proven genuinely discriminating (unlike its
    predecessor). Both independent reviewers, via unrelated methods,
    discovered a cleaner and stronger form of the argument than this
    record's own original design used: observing even one instance each
    in the "4" and "3+1" classes already forces the monodromy to be
    exactly S_4, since S_4 is the unique subgroup of itself containing
    both a 4-cycle and a 3-cycle -- no subgroup-lattice enumeration or
    transitivity assumption required. The subgroup lattice was
    independently confirmed complete regardless (exactly 5 transitive
    subgroup classes of S_4), and the arithmetic-vs-geometric monodromy
    gap was independently closed for the tested curves as well.

  experiment_status_before: completed
  experiment_status_after: completed

