coordinator_decision:
  id: DEC-20260808-7ed316
  goal_id: GOAL-SSI-001
  batch_id: BATCH-5a3d0a
  recorded_by_task: coordinator (direct authorship, BATCH-5a3d0a)
  archived_by: BATCH-5a3d0a (ledger archive, performed by the orchestrating
    session outside this authoring task)

  context: >-
    GOAL-SSI-001's next_action (set by DEC-20260807-47db22 / EV-SSI-0c529c)
    named exactly two obligations: (1) file a versioned correction to
    RG-REPRODUCTION-GATE.can_this_control_fail (specification.yaml, EXP-
    SSI-9b542d) before this contract's output is cited in any review-xhigh
    or review-breakthrough context -- required, non-blocking; and (2)
    select and scope one of four queued corrections carried unchanged from
    DEC-20260806-a00a28 as this batch's dispatch: EV-WESO-001's crossover
    overclaim, EV-SSI-59f7a2's missing SC-1/SC-3 conditionality, EXP-
    WESOVOW-001/cost_model.py's own uncorrected anchor bug, and analysis/
    SSI-ECDLP-SYNTHESIS-20260803.md's "NIST-III/V retain comfortable
    margins" sentence. This decision discharges (1) in full and discharges
    (2) by selecting and correcting EV-WESO-001.

  decision: weaken

  decision_scope: >-
    This decision (a) files CORR-20260808-d2568a, a prose-only gloss
    correcting one control's self-description in an already-frozen
    experiment contract, which changes no pass/fail verdict, no run's
    validity, and no hypothesis status; and (b) files CORR-20260808-c792f8,
    which WEAKENS EV-WESO-001's claim that the vOW middle regime "beats
    Delfs-Galbraith at every tested budget w=2^30..2^80 for all five
    sizes" and the paired inference-field claim that "NIST-III/V retain
    comfortable margins under every tested overhead scenario," by direct
    counterexample and derivation from the record's own committed source
    literals (experiments/EXP-WESOVOW-001/cost_model.py). It does NOT
    change H-WESO-001 or H-SSI-7fe2bf's status, does NOT create a new
    superseding EV-* evidence record for the crossover curve itself
    (that remains owed and requires independent review before use, per
    CORR-20260808-c792f8's own what_this_does_not_establish), and does NOT
    touch EXP-ECDLP-03a8c9 or EXP-SSI-eca132, which are out of scope for
    this batch entirely.

  target_ids:
    - EXP-SSI-9b542d
    - H-SSI-7fe2bf
    - EV-WESO-001
    - EXP-WESOVOW-001
    - H-WESO-001

  evidence_ids:
    - EV-SSI-0c529c
    - EV-SSI-455241

  corrections_filed:
    - id: CORR-20260808-d2568a
      corrects: EXP-SSI-9b542d specification.yaml, controls[RG-REPRODUCTION-GATE].can_this_control_fail
      nature: prose-only gloss; no verdict, run, or hypothesis-status change
    - id: CORR-20260808-c792f8
      corrects: EV-WESO-001 observations + inference (the vOW-beats-DG-everywhere overclaim)
      nature: >-
        weakens a specific claim by counterexample (w=2^30, all five sizes
        lose to Delfs-Galbraith under correct anchoring) plus a derivation
        (five-size crossover table, four of five values newly derived here
        from EXP-WESOVOW-001's own committed literals, not yet
        independently reviewed)

  rationale:
    why_the_rg_gate_correction_is_required_and_landed_now:
      basis: >-
        GOAL-SSI-001's own carried next_action states this correction must
        land and be snapshot-committed BEFORE EXP-SSI-9b542d's output is
        cited in any review-xhigh or review-breakthrough context. It was
        independently confirmed false-as-written by two separate red-team
        passes (TASK-20260806-9536f4 and, decisively, TASK-20260806-10980e
        section 3b) plus the Coordinator's own re-derivation in
        CORR-20260808-d2568a, all agreeing to the trailing digit
        (72.211328/72.2113/72.211337 against band [118.25,118.75]).
        Filing it now removes a standing blocker on this contract's
        eligibility for higher-tier review.
    why_ev_weso_001_was_selected_over_the_other_three_queued_items:
      basis: >-
        Of the four items, EV-WESO-001 is the ROOT CAUSE, not a symptom:
        TASK-20260806-9536f4's report traces the synthesis document's own
        "comfortable margins" sentence (item 4) to a verbatim copy of
        EV-WESO-001's inference field, and states explicitly that "a
        superseding correction must therefore supersede EV-WESO-001's
        inference sentence, not only the synthesis line." Correcting
        EV-WESO-001 is therefore higher-leverage than correcting the
        synthesis document alone, and leaves item 4 strictly cheaper for
        a future batch (a mechanical citation update once EV-WESO-001's
        own correction exists). EV-WESO-001 also bears directly on
        GOAL-P13-001's crossover-curve deliverable (IDEA-20260803-48e258),
        which analysis/SSI-ECDLP-SYNTHESIS-20260803.md section 3 and
        docs/target-result-profile.md both identify as the program's
        strongest line matching the canonical Wesolowski exemplar --
        AGENTS.md's bias toward exponent-targeting mechanisms over
        cofactor polishing weighs correcting the record that is actually
        load-bearing for that comparison over the two purely qualitative
        items (EV-SSI-59f7a2's SC-1/SC-3 gap changes no bit count) or the
        one requiring new computation outside Coordinator authority
        (item 3).
    why_the_correction_was_authorable_directly_rather_than_dispatched:
      basis: >-
        The refutation required no new experiment: it is a counterexample
        at an already-tested point (w=2^30, all five sizes) plus an
        algebraic derivation from literals already committed in
        EXP-WESOVOW-001/cost_model.py's own PAPER_PAIRS dictionary, using
        a charging formula (T_A(P,w)=T_full(P)+0.5*max(0,L_mem(P)-log2_w))
        that two independent red-team passes had already verified against
        the same source. This matches the precedent set by
        CORR-20260807-732541, where a Coordinator directly recomputed and
        filed a correction from already-committed artifacts without a new
        Executor run.
    why_item_3_cost_model_py_was_not_selected_this_batch:
      basis: >-
        experiments/EXP-WESOVOW-001/cost_model.py line 236's own
        T_w_vOW formula string is the actual source of the anchor defect.
        Fixing it requires editing committed experiment implementation
        code and re-running it to produce a new RUN-* record --
        Coordinator authority under agents/coordinator.md explicitly
        excludes writing experiment implementation code or running
        experiments ("You never run experiments and never write
        experiment implementation code"). This is Executor-scoped work
        and is not dispatched in this batch (see next_actions); it
        remains queued, not abandoned.

  limitations:
    - >-
      CORR-20260808-c792f8's four newly-derived crossover values
      (log2 w* at P=384/512/576/768: 69.6/77.7/91.8/109.0) are simple,
      transparent algebra from already-committed literals, but they have
      NOT been independently reviewed the way the P=256 value (49.5) was
      (that one was already computed and committed by an independent
      red-team pass). Per AGENTS.md rule 12, they may not be cited in a
      review-xhigh or review-breakthrough context, promoted to
      knowledge/, or treated as a new crypto-tier finding until an
      independent reviewer re-derives them.
    - >-
      Neither correction changes any hypothesis's official status. H-WESO-
      001 and H-SSI-7fe2bf remain exactly as they were before this batch.
    - >-
      This batch does not close, and does not approach closing, any of
      GOAL-SSI-001's three completion criteria.
    - >-
      Three of the four items DEC-20260806-a00a28 flagged as owed remain
      unaddressed by this batch (see next_actions). None is abandoned;
      each carries a concrete revisit condition below per AGENTS.md's
      research-direction-integrity rule.

  next_actions:
    - >-
      REQUIRED, NOW DISCHARGED: CORR-20260808-d2568a corrects
      RG-REPRODUCTION-GATE.can_this_control_fail. EXP-SSI-9b542d's output
      is now eligible for citation in a review-xhigh or review-breakthrough
      context, provided this correction is cited alongside it.
    - >-
      QUEUED, NOT MADE -- EV-SSI-59f7a2's missing SC-1/SC-3 conditionality
      (labels a OneEnd cost as a SQIsign security figure without carrying
      GRH-at-the-Isogeny-arrow or concrete-cost-not-inheritable caveats;
      QUALITATIVE only, the 2^{120-123} value itself is not challenged).
      Evidence: TASK-20260806-9536f4 section 1, "THE HEADLINE
      ADJUDICATION". Budget: low, a Coordinator-authorable prose
      correction analogous to this batch's two. Test boundary: EV-SSI-
      59f7a2's own committed observations and inference fields.
      Uncertainty: none remaining on WHAT is missing; only WHEN it is
      filed. Revisit condition: select it as a future batch's one
      dispatched correction, or bundle it with item 4 below since both
      are qualitative, low-cost, and share no dependency on item 3.
    - >-
      QUEUED, NOT MADE -- experiments/EXP-WESOVOW-001/cost_model.py's own
      T_w_vOW formula (line 236) remains uncorrected at its source; this
      batch's CORR-20260808-c792f8 works around it (by deriving corrected
      values from the same file's PAPER_PAIRS literals) rather than fixing
      it. Evidence: TASK-20260806-9536f4 section 4; independently
      confirmed by two EXP-SSI-9b542d red-team passes fixing the identical
      defect class in a sibling contract. Budget: requires a bounded
      Executor handoff (code edit + a single deterministic re-run,
      analogous in scope to EXP-SSI-9b542d's own repair) -- outside
      Coordinator authority per agents/coordinator.md. Test boundary: the
      w=M boundary-condition identity, the same BOUNDARY-CONDITION-GATE-
      style negative control EXP-SSI-9b542d already carries. Uncertainty:
      none on the defect or its fix; only on scheduling. Revisit
      condition: next batch that has Executor capacity, dispatched with a
      handoff naming exact artifact paths (experiments/EXP-WESOVOW-001/
      cost_model.py, a new RUN-* under the same experiment or a versioned
      successor experiment per docs/task-lifecycle.md's protocol_amendment
      discipline) and a completion gate requiring the w=M identity to hold
      to the same tolerance BCG-1 uses (1e-9 bits).
    - >-
      QUEUED, NOT MADE -- analysis/SSI-ECDLP-SYNTHESIS-20260803.md's
      "NIST-III/V retain comfortable margins under every tested overhead
      scenario" sentence (line 171) is wrong as written: the gap below
      each level's own target GROWS with level (9.5387/21.9537/38.8387
      bits at NIST-I/III/V per DEC-20260806-a00a28, independently
      reproduced in TASK-20260806-10980e section 7), and is true only on
      the memory-feasibility axis, not as an unqualified statement. This
      batch's CORR-20260808-c792f8 corrects the root cause the sentence
      was copied from (EV-WESO-001's inference field) but does not edit
      the analysis document itself, which is a separate markdown file,
      not a ledger record. Budget: very low -- now a near-mechanical
      citation fix (add a note pointing to CORR-20260808-c792f8 and
      restate the sentence per-axis, matching the pattern the frozen
      EXP-SSI-9b542d contract's own claim_ceiling.forbidden_sentences
      already uses). Test boundary: the one sentence at line 171.
      Uncertainty: none remaining. Revisit condition: select it as a
      future batch's one dispatched correction; it is now the cheapest of
      the three remaining items precisely because this batch corrected
      its upstream source.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Both corrections filed this batch are process/record-accuracy work,
      not new empirical or theoretical findings about SSI, SQIsign, or the
      supersingular isogeny problem. CORR-20260808-d2568a is a pure prose
      gloss. CORR-20260808-c792f8 weakens a specific prior overclaim but
      does not itself establish a reviewed, citable crossover-curve
      result -- four of its five supporting numbers are newly derived and
      explicitly marked not-yet-independently-reviewed, which is below the
      replicated/strong evidentiary bar this program requires before a
      KN-FIND promotion (docs/task-lifecycle.md section 9). A future
      superseding EV-* record for the crossover curve, once independently
      reviewed, is the right vehicle for that promotion decision.

  decided_by: coordinator
  decided_at: '2026-08-08'
