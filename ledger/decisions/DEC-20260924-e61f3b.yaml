  rationale:
    - >-
      WHY SUPPORT. Every clause of C1 held (PA-1, PA-2, PA-3); no
      falsification condition fired; no stated numeric prediction missed.
      That is the program's support test (DEC-20260915-fad1c1, applied in
      DEC-20260923-f25b97). The narrowed mechanism text is not part of C1's
      claim; C1's E-A is a count, and its general mechanism clause held.
    - >-
      WHY NOT REPLICATE FIRST ("surprising results get replicate"). The
      plan's tier_ruling left this open and EV-CERTBIN-4a9d2f
      replication_note_answer argues it: C1 is exact and deterministic on
      fixed archived systems; J5 re-derived all 62 blind from the
      specification (0 disagreements); each of the 62 carries a per-instance
      W_4 witness accepted by two independent checkers, plus 62 structured
      red-team witnesses; J1 verified all 268 flat certificates
      author-independently; and the surprise is located by derivation-level
      computation (S_3's substituted degree-4 space against the semi-regular
      reference). A `replicate` decision would recompute a certified
      identity. What IS unreplicated (other curves, V, n; the mechanism) is
      not claimed and is scheduled.
    - >-
      WHY `analyzed` AND NOT `supported` ON THE HEAD. The hypothesis carries
      three claims; C2 and C3 (cross-curve and cross-V rate transfer, x(2E)
      modulation) are exactly the claims a reader would take `supported` to
      assert, and they are untested.
    - >-
      WHY NOT WEAKEN. The mechanism narrowing (OBJ-2) refutes an attribution
      the hypothesis offered as explanation, not a claim it staked or a
      prediction it made. Recording it as a boundary keeps the support
      honest without inventing an adverse transition.
    - >-
      RERANK (DEC-20260924-8e2f47 NA-6, triggered by RC-1's completion).
      Within CERTBIN: (1) N-CONV design (RC-A): cheapest discriminator for
      KN-OPEN-3c8f51 item (A), zero new curve sampling, and it tells the
      n = 19 design which control carries the signal; (2) the n = 19 design
      (item (B)), the exponent-adjacent question, may be designed
      concurrently. EXP-CERTBIN-3f06d1 (C2, C3) and EXP-CERTBIN-a58c63
      (Stage 2) continue their own lifecycles unchanged.
    - >-
      TARGET-PROFILE HONESTY. Toy tier, sota_delta zero, oracle A per attempt
      and parallel rho dominate; no cost claim. Refutation degree on Semaev's
      diagonal is exponent-adjacent only: a persistent degree-4 refutation
      along n would be that assumption's content at work, not a test of it,
      and W_4 is not F4. The lane stays ranked within CERTBIN, not above
      exponent-targeting ECC work.

