      admission gate every structured proposal of this line must beat by a
      non-generic step. The refinement makes the gate usable (aggregate,
      premise-audited, dual-convention) instead of one that fires on rho at
      the generic rate. That outranks the constant-factor generic work of
      this line, exactly as the composition's rerank records.

