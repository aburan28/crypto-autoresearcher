  scoped_claim_this_decision_authorizes: >-
    UNCHANGED FROM DEC-20260917-793ae2, DELIBERATELY, AND NOT WIDENED BY A
    SINGLE CLAUSE. This decision adds no evidence and therefore may not add
    scope. Over the tested instances, parameters, instruments and budget --
    p = 2 at (n, n') in {(11,6), (13,7), (7,3), (11,4), (13,5)} for every lambda
    of exact degree 2..7 (1260 candidates); 1200 seeded K-coefficient draws at
    n = 11 and 13; the complete-splitting sweep over prime n in {7,...,31} with
    2 <= n' <= 15, n' < n, n' not dividing n and 2 <= d <= 8 (42244 candidates);
    the n = 131 census over F_2[z]/(z^131 + z^13 + z^2 + z + 1) at n' in
    {33, 44, 66} for every non-linearized F_2-coefficient lambda of exact degree
    3..7 (732 candidates, 244 distinct lambda); and, from independent review
    only, p in {3,5,7} at n <= 13 with n' <= 8 and degree 2..4 (291997
    candidates) plus 2400 K-coefficient draws at odd p -- NO lambda was observed
    with N_K(L) > max(d^{q+1}, p^{n'-r}), and NO completely splitting L with
    r >= 1 was observed with beta < n/(n + n' - r). The largest ratio N/bound
    observed anywhere is exactly 1, attained at (7,3) by lambda = X^2 + X; the
    largest N at n = 131 is 132 against a ceiling of 2401 and against the 2^33 a
    complete splitter at n' = 33 would require.
    These observations do NOT prove that (A) or (B) holds for every p, n, n' and
    lambda: the general statement rests on the DERIVATION, which three
    independent sessions attacked at six named joints and did not break. They do
    not prove that all parameterizations fail, that all related representations
    fail, that no undiscovered structure exists, or that no future algorithm
    exploits the mechanism. They establish nothing about any deployed curve --
    no curve, group or point was constructed anywhere in this contract -- and
    they move no attack exponent; rho on ECC2K-130 stands at 2^60.9
    (KN-LIT-096), untouched. RQ-QSP-f9bbdb decision target (a), an existence
    result at n' = 33, is answered NEGATIVELY ON THE 732 ENUMERATED CANDIDATES
    AND ON NOTHING ELSE.
    THE CLOSURE READING (E) IS NOT SUPPORTED. As restated in H-QSP-645a07 it is
    conditional on the cost model H1 AND on the proviso kappa >= (n-1)/n
    (= 130/131 = 0.9923664 at n = 131), for which no retrieved or derived
    support exists in the direction it is used; 4.876 is an UPPER bound
    (inputs/EULER-PETIT-2019-QSP/paper_fulltext.md:2597, "currently majored by
    4.876") and excludes no cheap solver. (E)'s CONCLUSION is not refuted: no
    solver with kappa < (n-1)/n is exhibited anywhere.
    THE EXPERIMENT'S HEADLINE REMAINS THE CORRECTED ONE: "732 exact counts at
    n = 131, 546 of them certificate-bearing, under two independent
    determinations at Stage 1 over a shared primitive base and one instrument at
    n = 131."

  limitations:
  - >-
    THIS DECISION ADDS NO EVIDENCE. Every limitation of DEC-20260917-793ae2 and
    every boundary of EV-QSP-a6aa4b applies unchanged and is not restated in
    full here; the ones a reader of the new records most needs are carried in
    KN-FIND-617d78 section 5 and in H-QSP-645a07 interpretation_limits.
  - >-
    THE SPLIT DOES NOT FREE PART I FOR PROMOTION. H-QSP-645a07 still contains
    Part II, so promotion gate (2) still applies to the record as a whole.
    Separating Part I onto its own hypothesis record would require a further
    identifier and a further decision, and is NOT done here. `part_status` is
    what makes the separation legible in the meantime.
  - >-
    THE r = 0 STATEMENT IS NOW MORE HONEST AND CORRESPONDINGLY NARROWER. The
    max form is vacuous at r = 0 and structurally so; the N <= deg D form is NOT
    vacuous there in general, because at d^{q+1} = p^{n'} the leading terms can
    cancel. It is correct there on everything measured (0 violations in 65832 +
    7244 candidates; 141 objects at r = 0 split completely and the derivation is
    vacuous on every one; of the 288 non-vacuous at r = 0, none splits
    completely), but the record's vacuity claim is narrower than its bound and
    that is now written down rather than implied.
  - >-
    H1 IS NOT ASSERTED FALSE ANYWHERE. What is established, and all that is
    established, is that the RECORD'S SUPPORT for H1's load-bearing direction is
    absent once `recalled` citations are honoured under AGENTS.md rule 9. H1 may
    well be true; the open problem is KN-OPEN-ac409f and the cheapest
    discriminating measurement is (m, d) = (2, 2) or (2, 3), where a resultant
    suffices and no Groebner engine is needed.
  - >-
    NA-10's THREE ITEMS ARE ROUTED AND FILED, BUT THEIR OWNERS HAVE NOT
    RESPONDED. CORR-20260917-c60dfb carries RET-1, RET-2 and RET-3 against the
    owning artifacts; it is a correction FROM the Coordinator, not an
    acknowledgement BY the Executor or by TASK-20260917-34b637. RET-3 in
    particular is a discrepancy only its owner can adjudicate -- which figure is
    the deduplicated one and which the raw -- and this decision does not
    adjudicate it. If an owner disputes any of the three, that dispute
    supersedes by a new record and never by an edit.
  - >-
    NOT A LIMITATION, AND RECORDED HERE BECAUSE AN EARLIER DRAFT OF THIS
    DECISION WRONGLY SAID IT WAS. tools/check_review_independence.py WAS RUN
    against this composition and PASSED -- "3 reports, every joint owned and
    attested, blindness respected, controls declared"
    (ledger/archives/TASK-20260917-c706bb.yaml,
    gates_at_this_tree.check_review_independence, committed on main). NA-1 OF
    DEC-20260917-793ae2 IS DISCHARGED. The draft asserted a gap that does not
    exist, because the composing session had no shell and did not find the
    receipt; it is withdrawn as factually wrong rather than softened.
    The receipt also records, and this decision carries forward, a TOOLING GAP
    worth routing with the other items of NA-E3: the checker reads only `*.yaml`
    while the reviewer reports are markdown carrying fenced YAML, so the three
    review_attestation blocks had to be extracted to a scratch directory (no
    extracted file entered the repository), and the FIRST run failed for a
    formatting reason rather than a substantive one -- blind_rederivation
    assigned to TASK-20260917-5fa7d5, which had filed no review_attestation
    block, having declared the substance in its report's section 0. It appended
    a proper block purely additively and the re-run passed. A round whose
    declared deliverable format its own completion-gate tool cannot read will
    fail that gate for the wrong reason every time.
    THE PASS DOES NOT TOUCH PROC-1. The checker inspects the composition's
    declared independence; PROC-1 is about the ordering of the orchestrating
    session's commits DURING a round that was still running, which no
    after-the-fact check can inspect. Both are true and both stay recorded.
  - >-
    THE FIVE RESIDUAL RUN-QSP-33b442-S0 SCHEMA ERRORS remain standing disclosed
    debt and must be named as known debt in the archive receipt carrying this
    decision, exactly as they were for the previous archive.
