  hypothesis_status_changes:
  - record: ledger/hypotheses/H-QSP-5540d7.yaml
    id: H-QSP-5540d7
    from: analyzed
    to: superseded
    superseded_by: H-QSP-645a07
    basis: >-
      `superseded` is on the AGENTS.md hypothesis state line (proposed ->
      specified -> approved -> running -> analyzed -> replicated -> supported |
      weakened | rejected | inconclusive | superseded) and is the only status
      that says what happened: the record's TEXT has been restated under a new
      identifier and later readers must work from the successor. It asserts
      nothing about the mechanism. In particular it is NOT `weakened` and NOT
      `rejected`: (A), (B) and (C) survived every attack named in the review
      plan and two that were not, with 0 violations across roughly 340000
      candidates from two implementations with no shared lineage, and NO
      REFUTATION ARTIFACT OF ANY TIER WAS PRODUCED AGAINST (A) OR (B).
    immutability: >-
      A STATUS FIELD UPDATE AND ITS OWN METADATA, AND NOTHING ELSE. The
      substantive text of H-QSP-5540d7 -- the statement, mechanism, assumptions,
      proof_search_map, heuristics, predictions and test boundary -- is NOT
      touched, NOT patched and NOT corrected in place. The `status_note` written
      by DEC-20260917-793ae2 is LEFT VERBATIM as the note of that first
      transition, and this second transition is recorded beside it in a separate
      note naming the prior values of `status_changed_at` and
      `status_changed_by`, so no earlier statement is overwritten. The defects
      the round found in the text are carried by H-QSP-645a07 as corrections
      C-1 through C-10; records are immutable and corrections supersede.
  - record: ledger/hypotheses/H-QSP-645a07.yaml
    id: H-QSP-645a07
    from: null
    from_note: >-
      A NEW RECORD; there is no prior status. It enters the ledger at the status
      below rather than passing through `proposed`, because its content is the
      restated content of a record that had already run, been validity-gated and
      been reviewed. Entering at `proposed` would misreport the evidence as
      absent; entering above `analyzed` would manufacture evidence that does not
      exist.
    to: analyzed
    basis: >-
      THE STATUS IS INHERITED, NOT EARNED. A restatement inherits its
      predecessor's evidentiary position exactly and may never gain from having
      its text improved. H-QSP-5540d7 stood at `analyzed`; no new measurement
      exists; therefore H-QSP-645a07 stands at `analyzed`.
    why_not_supported: >-
      THE THREE BLOCKS DEC-20260917-793ae2 RECORDED ARE ALL STILL STANDING, AND
      NONE OF THEM IS A DEFECT THIS RESTATEMENT COULD REPAIR.
      (i) agents/coordinator.md promotion gate (2) is unsatisfied: H1 still
      carries validation_experiment_ids [] and IDEA-20260916-b84e2d is still a
      PROPOSAL at status `proposed`, so no EXP-* id exists for the gate to name.
      The gate's last sentence is unconditional -- a claim missing any gate may
      reach `analyzed`, never `supported`.
      (ii) (E) as restated is explicitly conditional on a proviso,
      kappa >= (n-1)/n, FOR WHICH NO RETRIEVED OR DERIVED SUPPORT EXISTS in the
      direction it is used (KN-OPEN-ac409f). Restating the proviso honestly is
      an improvement in the record and is not evidence for it.
      (iii) No independent replication invocation was spent (PD-6), and
      AGENTS.md takes `replicate` rather than `support` on first observation of
      a surprising or high-impact result.
      NOTE THE ASYMMETRY DELIBERATELY: the SPLIT does not by itself free
      (A)/(B)/(C) to be promoted, because the successor record still CONTAINS
      Part II and gate (2) applies to the record. What the split buys is that
      the next decision wishing to move Part I need not drag a refuted closure
      reading with it, and a decision moving (E) need not disturb (A)/(B)/(C).
      Separating Part I onto its own record is a further act, requires a further
      identifier, and is NOT performed here.
    why_not_lower: >-
      `proposed` or `specified` would understate a record whose content ran
      under a frozen protocol (DEC-20260917-73c49a), passed the validity gate of
      CORR-20260917-8b80cc, and was attacked at six named joints by two
      independent review-breakthrough sessions plus a blind re-derivation of its
      load-bearing target-scale quantity. `analyzed` is where the state line
      puts a hypothesis whose results exist, have been reviewed, and cannot be
      promoted.
    why_not_weakened_or_rejected: >-
      Both are terminal statuses asserting the mechanism came out worse. It did
      not. `weaken` was the DECISION of 793ae2 on the RECORD AS WRITTEN; this
      record is the repair of that text, and re-applying a weakening to the
      repaired record would double-count a single round.
    part_positions: >-
      Carried on the record itself under `part_status`: PART I (A)/(B)/(C)/(D)
      at `analyzed`; PART II (E) at `conditional_unvalidated_not_promotable`.
      Those two fields, not the single lifecycle status, are what NA-4(a) asked
      for and what a later decision moves.

  rationale:
  - >-
    NA-4 IS DISCHARGED IN FULL AND EACH OF ITS SEVEN REQUIREMENTS IS TRACEABLE
    TO A NAMED CORRECTION ON THE SUCCESSOR RECORD. (a) the Part I / Part II
    split with independent `part_status` -> C-1; (b) n' < n stated explicitly in
    (B) and (E), with the TWO-CONJUNCT reason (cardinality N_K(L) <= |K| = p^n
    gives n' <= n; (B)'s own non-divisibility hypothesis excludes n' = n) and
    with the explicit counterexample to the one-conjunct version, plus the
    Definition 3.1 restriction on (E) -> C-2; (c) (E) restated WITHOUT the "five
    times below Rojas' 4.876" comparison, leading with kappa >= (n-1)/n and
    stating plainly that 4.876 is an UPPER bound -> C-3; (d) rational lambda
    added as the fourth survivor, (D)(ii) WITHDRAWN AS STATED -> C-4; (e) the
    degenerate case's citation corrected (affine TRINOMIAL for b != 0, covered
    by neither cited result; binomial of subfield/multiplicative type only for
    b = 0) and the "over a field" wording corrected to name the finiteness of K
    that makes c' = c^{p^{-j}} exist -> C-5; (f) the r = 0 vacuity stated for
    the N <= deg D form as well as the max form, with the honest note that the
    deg D form is NOT vacuous at r = 0 in general -> C-6; (g) H1's
    random_model_justification recorded honestly, its declared rigorous
    ingredient WITHDRAWN because its own cited appendix says "bounded by M(E)"
    and root-finding "can be neglected", and the record now stating in terms
    that after honouring its own RECALLED label H1 HAS NO RETRIEVED SUPPORT IN
    ITS LOAD-BEARING DIRECTION -> C-7.
  - >-
    THREE FINDINGS THE ROUND ESTABLISHED AFTER H-QSP-5540d7 WAS WRITTEN ARE
    FOLDED IN, AS NA-4 REQUIRED. C-8: the degeneracy criterion is (q+1) | n,
    derived from the identity n' - r = (q+1)n' - n, and NOT any statement about
    n' - r being small -- the superseded reason is false on 56 of the 95 Stage-2
    cells ((13,12) has n' - r = 11; (31,15) has 14), while the conclusion it
    supported never changed. C-9: n' = n is an instance of the proves-too-much
    FAMILY 1 control (n' | n), where at r = 0 the bound's second term is
    p^{n'-r} = p^{n'} = deg L, so (A) is vacuous and (B) draws no conclusion --
    the same boundary as (B)'s second conjunct seen from the control's side.
    C-10: (A) now carries ODD-CHARACTERISTIC evidence at p in {3,5,7}, which
    H-QSP-5540d7 did not have, with the bound ATTAINED at (3,8,3) and (5,5,3),
    and it is scoped everywhere as a REVIEW artifact of TASK-20260917-34b637
    rather than a run of EXP-QSP-33b442, whose every numerical cell is p = 2.
  - >-
    H-QSP-5540d7 IS NOT EDITED BEYOND ITS STATUS FIELD, AND THE STATUS NOTE OF
    THE EARLIER TRANSITION IS PRESERVED VERBATIM. Rewriting a producer's record
    to make it read correctly destroys the evidence of what was actually put
    under review -- the same principle by which TASK-20260917-43701b is not
    edited. A reader who wants to know what the round evaluated reads
    H-QSP-5540d7; a reader who wants the current statement reads H-QSP-645a07.
  - >-
    THE KNOWLEDGE PROMOTION IS PERFORMED, AND THE DEFERRAL THAT PRECEDED IT WAS
    CORRECT. DEC-20260917-793ae2 recorded that a KN-FIND was owed for
    (A)/(B)/(C) -- "a fresh agent reading only knowledge/ and the ledger should
    be able to rediscover the twisted injection bound" -- and declined to write
    it for one concrete reason: knowledge/README.md binds a finding never to
    claim more than its evidence record's scoped claim, and that claim sat
    inside a record whose (E) was refuted in its stated reason and whose (B)
    lacked the n' < n clause. A finding written then would have baked in the
    un-narrowed statement and been superseded immediately. The obstruction is
    now removed and KN-FIND-617d78 exists at
    knowledge/findings/KN-FIND-617d78.md, claiming no more than EV-QSP-a6aa4b's
    scoped claim and carrying its boundaries in the body rather than in a
    footnote.
  - >-
    THE FINDING CARRIES ITS BOUNDARIES AS PROMINENTLY AS ITS RESULT, WHICH IS
    THE CONDITION ON WHICH IT IS PROMOTED. Named in the entry itself: the
    degeneracy control is VACUOUS BY CONSTRUCTION across all 111 cells (which is
    why "0 degenerate candidates" is a fact about cell design and not an
    observation); 10 of the 65 complete splitters rest on instrument I2 alone;
    720 of the 732 census rows at n = 131 are single-instrument, verified in one
    direction only by a re-verifier that can falsify a listed root and cannot
    detect a missing one; and the blind re-derivation's null model shows the four
    maximizing lambda are the GENERIC outcome (expected 244/131 = 1.86 against 4
    observed, Poisson P[>=4] = 0.12), so nothing may treat them as algebraically
    distinguished. The corrected headline -- 732 exact counts, 546 of them
    certificate-bearing, two determinations at Stage 1 over a shared primitive
    base and one instrument at n = 131 -- is the one the entry uses.
  - >-
    NA-2 IS DISCHARGED WITHOUT TOUCHING THE ORIGINAL CARD. TASK-20260917-619c31
    supersedes TASK-20260917-43701b and carries PROC-1 and PROC-2 in its
    review_plan.procedure_deviations, both attributed where they belong: to THE
    ORCHESTRATING SESSION, not to any reviewer. PROC-1 -- reviewer artifacts
    committed to the shared branch while blindness.mutual was true and
    lifted_for empty -- converts blindness from a property of the round's SETUP
    into a property of three reviewers' RESTRAINT, which is the weaker guarantee
    and is undetectable downstream unless written down. PROC-2 -- commit
    c0b3125ec labelled a WIP snapshot while containing the validator's final
    814-line report -- affects no artifact content and misstates the state of a
    deliverable in the commit log, which is exactly the reconstruction PROC-1
    invites. History is pushed and is NOT rewritten.
  - >-
    NA-9 IS DISCHARGED BY REFERENCE, WHICH IS THE ONLY WAY IT COULD BE.
    IDEA-20260916-a17f43 is an immutable proposal record and is NOT edited. The
    constraint is issued on H-QSP-645a07 (`design_constraints_issued`) and
    restated below, so a reader arriving at the idea through either record finds
    it: ANY CORRESPONDENCE SHAPE PROPOSED AS A SUCCESSOR MUST BE SHOWN TO RAISE
    deg D, NOT TO FIND A LUCKIER lambda. The measurement behind it is
    EV-QSP-a6aa4b obstruction.resource_check -- 0 of roughly 340000 lambda
    across two implementations and four characteristics exceeded the cap, and
    the cap is EXACTLY ATTAINED at (7,3) at p = 2 and at (3,8,3) and (5,5,3) at
    odd p, so there is no headroom to be found by searching harder inside the
    same shape. The target to beat at n = 131, n' = 33 is 132 against 2^33.
  - >-
    NA-10 IS ROUTED, NOT REPAIRED, AND THE VEHICLE IS A CORRECTION RECORD THAT
    THIS SESSION COULD NOT MINT. Three items go back to their owners as
    SUPERSEDING CORRECTIONS and never as edits: two to the Executor and one to
    TASK-20260917-34b637; their content is stated in full under
    `returned_to_owners` below so that nothing is lost if the correction record
    is written later. NO VERDICT DEPENDS ON ANY OF THE THREE, and the corrected
    values are already on the record in EV-QSP-a6aa4b observations and in
    DEC-20260917-793ae2, so this routing closes a bookkeeping gap rather than a
    scientific one.
  - >-
    RULE 9 COMPLIANCE, RESTATED BECAUSE THIS DECISION TOUCHES A LINE THAT
    CARRIES A SCOPED NEGATIVE. NOTHING HERE CLOSES THE QSP LINE, and
    H-QSP-645a07 says so in its own interpretation_limits. Four survivors stand:
    n' | n (at n = 131 only n' in {1, 131}); correspondence shapes of conjugate
    degree >= 2 (IDEA-20260916-a17f43); factor bases that are not root sets of a
    single X^{p^{n'}} - lambda; and rational lambda, (D)(ii) being WITHDRAWN AS
    STATED. The most valuable outcome this line can produce remains F1 -- a
    single certified lambda with N_K(L) > max(d^{q+1}, p^{n'-r}) -- and the
    unexplored directions where it would most plausibly live are named in order.
    ECC budgets are unlimited (AGENTS.md "ECC comes first"), so nothing in this
    decision is a budget closure and none was considered.

