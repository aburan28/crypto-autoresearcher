  decision: supersede

  decision_scope: >-
    NOTHING IN THE SCIENCE CHANGES IN THIS DECISION, AND SAYING SO PLAINLY IS
    PART OF THE DECISION RATHER THAN A HEDGE ATTACHED TO IT.
    No new measurement exists. No run was executed, no evidence record was
    written or amended, no reviewer was dispatched, and no claim is promoted.
    EV-QSP-a6aa4b is unchanged and remains the sole evidence record for this
    line; its direction stays `weakens`, its strength stays `strong`, its
    proof_status stays `derivation`, and its scoped claim is quoted below
    verbatim in substance and not widened by a single clause.
    WHAT THIS DECISION ACTUALLY DOES IS THREE THINGS.
    (1) It SPLITS A COMPOUND RECORD so its parts can move independently.
    H-QSP-5540d7 is one record carrying an unconditional bound that survived
    every attack of the round and a conditional closure reading whose stated
    reason that round refuted. A single status field cannot move those apart,
    which is exactly why DEC-20260917-793ae2 had to record `weaken` on a record
    whose (A)/(B)/(C) would alone have attracted `support`. H-QSP-645a07
    restates them as PART I and PART II with separate positions, and repairs the
    six textual defects the round found -- none of which touches a bound.
    (2) It PERFORMS THE PROMOTION 793ae2 DEFERRED. That decision recorded, in
    terms, that a durable finding was owed for (A)/(B)/(C) and that it could not
    yet be written because knowledge/README.md binds a finding never to claim
    more than its evidence record's scoped claim, and the scoped claim then sat
    inside a hypothesis whose (E) was refuted and whose (B) lacked the n' < n
    clause. H-QSP-645a07 removes that obstruction. KN-FIND-617d78 is written
    now.
    (3) It ISSUES ONE DESIGN CONSTRAINT BY REFERENCE and ROUTES THREE
    CORRECTIONS BACK TO THEIR OWNERS, editing nobody's record to do either.
    `supersede` is the transition because that is precisely what happened: a
    record was superseded by a narrower, more honest one, and an owed corpus
    entry was written. It is NOT `support`: no gate moved, no evidence was
    added, and promoting a claim because its text improved is how a claim gets
    laundered. It is NOT `weaken`: 793ae2 already recorded that, and repeating
    it would double-count one round.

