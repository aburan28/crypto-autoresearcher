  # ---------------------------------------------------------------------------
  # 1. What E(r) is and why the escalate fired.
  # ---------------------------------------------------------------------------
  what_E_r_is:
    definition: >-
      Frozen in experiments/EXP-AUXIN-7e2e3d/specification.yaml and
      H-AUXIN-66e6fd: for prime subgroup order r and m in {r - 1, r + 1},
      E(r) = min over divisors d of m of log2(sqrt(m/d) + sqrt(d)) / log2(r).
      sqrt(m/d) + sqrt(d) is the running-time expression of Cheon's
      discrete-logarithm-with-auxiliary-input algorithm as filed in
      DEC-20260802-204 (B032-C4/C5, PKC 2012 implementation paper, d | r - 1
      form). E(r) is a MODELLED dimensionless exponent applied to MEASURED
      divisor lattices; no group operation was performed
      (cheon_executions 0, discrete_log_recoveries 0).
    the_floor: >-
      sqrt(m/d) + sqrt(d) >= 2 m^{1/4} for every d, so E(r) >= (1 +
      log2(m)/4)/log2(r), approximately 0.25 + 1/log2(r): 0.2539 at 256 bits.
      That floor is Cheon's known balanced r^{1/4} exponent with its factor 2
      written as an exponent. The census therefore CANNOT express an exponent
      below known prior art; the best any row can do is reach the floor.
    what_fired: >-
      The specification's preregistered e_escalate_ceiling is 0.40
      (inert floor 0.49). experiments/EXP-AUXIN-7e2e3d/runs/RUN-AUXIN-fd1edc/
      e_table.json lists stop_and_escalate_curves NIST-P-224 (0.39447, branch
      r+1, d 48 bits), NIST-P-256 (0.25391, r-1, 128 bits), secp256k1 (0.25392,
      r-1, 128 bits), brainpoolP256r1 (0.25563, r+1, 126 bits), BN254-r
      (0.25394, r+1, 127 bits; its r-1 branch is 0.25394 too) and BLS12-381-r
      (0.25392, r-1, 128 bits), all quantity_kind E(r) with complete lattices.
      Five of the six sit essentially on the floor: r - 1 or r + 1 has a
      divisor within a small factor of sqrt(r).
    plain_answer_to_the_question_put: >-
      YES: E(r) ~ 0.254 on NIST-P-256, secp256k1 and BLS12-381-r is the known
      Cheon auxiliary-input exponent, realised because those r +/- 1 happen to
      have a divisor near sqrt(r). It holds only GIVEN [x^d]P for that specific
      d -- here a 126-128-bit d -- which an attacker holding P and [x]P does not
      have; DEC-20260802-204 (B032-C7/C8) records that no sub-rho acquisition
      of such a point from ordinary input is established. It is not a new
      exponent, not an ordinary-ECDLP statement, and not a statement about any
      deployed system. Pairing rows are expected structure
      (H-AUXIN-66e6fd interpretation_limits; BLS12-381 r - 1 is highly
      2-adic by design).
    three_things_the_review_must_settle_that_are_not_settled: >-
      (a) Whether the six is the right set: driver.py fires only on
      quantity_kind "E(r)", but E_bound is an UPPER bound on true E(r), so
      NIST-P-384 (<= 0.3925), brainpoolP384r1 (<= 0.3972) and Ed25519-L
      (<= 0.3570 on a complete r+1 branch) satisfy the frozen rule literally.
      (b) Whether r - 1 and r + 1 rows may share one column: three flagged rows
      minimize on r + 1, and the d | r + 1 variant's auxiliary input is not the
      single power DEC-20260802-204 files (recalled pointer, unverified). On
      r - 1 alone NIST-P-224 is 0.4353 and brainpoolP256r1 is 0.4918.
      (c) Whether the thresholds could have come out otherwise: nobody measured
      what random primes of the same size do. All three are joints of the plan.

  # ---------------------------------------------------------------------------
  # 2. The tier ruling.
  # ---------------------------------------------------------------------------
  review_tier_ruling:
    tier: review-adversarial
    agents: validator (two SEPARATE independent sessions) and red-team, effort xhigh
    basis: >-
      orchestration/model-policies.yaml routing_rules
      `unrecoverable-result-review` routes to review-breakthrough when
      claimed_breakthrough, proposed_state_transition closed, or
      contradicts_prior_evidence. None holds. (1) No break is claimed: the
      producer's own artifacts say "no vulnerability claim", and the quantity is
      bounded below by Cheon's published exponent, so the package can only
      re-express known prior art at specific integers. (2) Nothing is
      proposed to close. (3) No validated evidence record exists on these
      divisor lattices to contradict -- RUN-AUXIN-6117d3 is void and its
      reviews (VAL-20260916-b828e7, RT-20260916-c14349) are reviews, not
      evidence -- and nothing here disputes DEC-20260802-204's acquisition
      gate. The round is claim-changing (it gates an official reading), so it is
      review-adversarial rather than anything lighter.
    why_this_is_not_a_downgrade: >-
      No record ever routed this package to review-breakthrough. The goal's
      pause condition prescribes "independent validation and red team"; the
      previous escalate package was reviewed at review-adversarial; and the
      policy file itself warns that paying the top tier for every validator
      pass prices review out of the loop.
    tripwires_pre_declared: >-
      The round stops and the affected CLAIM is routed to review-breakthrough at
      max (validator-breakthrough / red-team-breakthrough, independent,
      fallback_allowed false, degradable false) on: T1 any assertion or
      entailed reading of an ordinary-ECDLP cost below rho or a deployed-scheme
      break; T2 any real E_m(r) asserted below the analytic floor; T3 a
      deployed escalate rate far above the random-prime rate with a proposal
      that the standards are anomalous, or any finding contradicting
      DEC-20260802-204's acquisition gate; T4 any proposal to close the lane on
      this package. If review-breakthrough is unservable when a tripwire fires,
      the claim stays un-promoted and the goal stays active with an impediment;
      this round's reports never stand in for it.
    unverified_serviceability_note: >-
      REVIEW-FROB-20260922-5286b0 (same date) states review-breakthrough cannot
      be served in its environment; CLAUDE.md lists validator-breakthrough and
      red-team-breakthrough bindings at max. Not adjudicated here; the tier
      ruled does not depend on it. Any tripwire dispatch must first confirm
      serviceability with `python3 -m orchestration.adapter doctor --probe`.

