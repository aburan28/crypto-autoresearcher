coordinator_decision:
  id: DEC-20260810-17d5e8
  goal_id: GOAL-AES-002
  question_id: RQ-AES-002
  batch_id: BATCH-2b0fd1
  recorded_by_task: TASK-20260810-e72d61
  decision: approve

  decision_scope: >-
    ADJUDICATES THE ARCHIVE ACT TASK-20260810-c1cfd5 AND NOTHING ELSE. This
    decision accepts the BATCH-2b0fd1 opening archive as a TWO-COMMIT,
    CONTENT-VERIFIED archive; names its two defects and their remedies; sets the
    official outcome of TASK-20260810-c1cfd5; binds the batch's three remaining
    archival tasks to a receipt-before-staging discipline; and records the queue
    archive-block backfill values that a future in-scope task must write.
    IT REVIEWS NO EVIDENCE. It creates no hypothesis, moves no hypothesis,
    research-question, experiment or goal status, approves no cryptanalytic
    measurement, records no attestation and no review verdict, claims no closure
    quorum, promotes no knowledge, and ASSERTS NOTHING ABOUT AES AT ANY ROUND
    COUNT. It states no margin of any kind, so RQ-AES-002's R5 anti-laundering
    clause has nothing to attach to (SC-4, SC-7); it makes no comparison against
    the published state of the art, which is unadjudicable in this environment in
    both directions (SC-6); it cites no recalled literature figure in either
    direction (SC-5); and it asserts no reduced-round finding, which belongs to
    RQ-AES-001's ceiling (SC-8). It touches no GOAL-AES-001 and no GOAL-AES-003
    record, and does not read or re-score ledger/evidence/EV-AES-005.yaml.

  context: >-
    TASK-20260810-c1cfd5 is the snapshot archive of the BATCH-2b0fd1 opening
    control plane. Its card declares a staging set of twenty-two artifacts PLUS
    the task's own self-neutral receipt, to be committed together and alone. A
    prior session made that commit WITHOUT the receipt. Commit
    d0c6d7e130b670087c81493bd4b78ef0c34db867 (parent
    3cc95d80ddec1c2fb401ef817e76045c6e1ace78) changed exactly the twenty-two
    declared paths — the four TASK-20260810-095c67 artifacts, the nine
    BATCH-2b0fd1 task cards and the nine BATCH-2b0fd1 ledger handoffs — with no
    scope expansion and no omission other than the receipt itself. It is
    reachable from HEAD and from origin/main and was merged to main in PR #308.
    The archival session then wrote the receipt, adjudicated the departure, and
    declined to accept its own deviation, referring it here. This decision is
    that adjudication. It exists because a deviation recorded only inside the
    deviating task's own receipt is a self-report, and because the queue's task
    state vocabulary is closed and has no value that means
    "completed with a recorded defect".

  target_ids:
    - GOAL-AES-002
    - RQ-AES-002
    - BATCH-2b0fd1
    - DEC-20260810-ba50dc
    - TASK-20260810-095c67
    - TASK-20260810-c1cfd5
    - TASK-20260810-e72d61
    - TASK-20260810-f7bc82
    - TASK-20260810-1a81be
    - TASK-20260810-9f661a

  target_ids_note: >-
    No EV-* identifier appears. This decision reviews no evidence and creates
    none. EV-AES-abf3dc remains reserved for the BATCH-2b0fd1 ledger archive
    TASK-20260810-9f661a and is deliberately absent from target_ids because it
    does not yet exist, and target_ids is a reference to committed records.

  what_is_accepted:
    - >-
      THE BATCH-2b0fd1 OPENING ARCHIVE IS ACCEPTED AS A TWO-COMMIT,
      CONTENT-VERIFIED ARCHIVE. Its first commit is
      d0c6d7e130b670087c81493bd4b78ef0c34db867, parent
      3cc95d80ddec1c2fb401ef817e76045c6e1ace78, reachable from origin/main and
      merged to main in PR #308, carrying the twenty-two declared artifacts. Its
      second commit is the receipt commit made in the same session as this
      decision, carrying
      coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/archives/TASK-20260810-c1cfd5/snapshot-receipt.json.
      The two commits are bound together by content: the receipt names every one
      of the twenty-two paths with its sha256 as archived.
    - >-
      THE BASIS IS CLAUDE.md's CONTENT-FIRST ARCHIVE RULE, quoted in substance:
      "Archive receipts bind to CONTENT first" — research_dispatch.py verifies
      path_sha256 and treats commit reachability as advisory, verifying declared
      hashes against the tree when a commit cannot be reached, and a content
      mismatch is fatal. Here there is NO content mismatch and the commit is in
      addition fully reachable. ALL TWENTY-TWO DECLARED PATHS ARE BYTE-IDENTICAL
      AT d0c6d7e130b670087c81493bd4b78ef0c34db867 AND AT HEAD
      (2e530e6b59d2918c49517a4ac179f0e3dd5f80a2 at the moment of verification):
      zero drift, no digest missing, malformed or duplicated.
    - >-
      PR #308's title and body name GOAL-AES-002, BATCH-2b0fd1 and
      DEC-20260810-ba50dc, established by `gh pr view 308`. The publication duty
      for the twenty-two artifacts is discharged: they are durable, not merely
      local.

  named_defects:
    - id: DEF-1
      name: >-
        RECEIPT COMMITTED OUTSIDE THE COMMIT IT ATTESTS (SEQUENCING DEVIATION,
        NOT A CONTENT DEFECT)
      statement: >-
        The task card requires the receipt to be staged and committed together
        with the twenty-two artifacts, alone. It was not. The receipt rides a
        LATER commit. Stated without euphemism: the card said commit them
        together and they were not committed together, and no favourable
        verification result changes that.
      severity_and_reasoning: >-
        Recordable, not fatal. What is undamaged is the archive's evidentiary
        function: the twenty-two artifacts are immutable, content-addressed,
        reachable and drift-free, so every downstream reader — including this
        batch's independent red-team and validation passes — is bound to exactly
        the bytes the receipt names. What is damaged is single-commit atomicity:
        an auditor reading d0c6d7e13 alone finds no attestation and must be
        pointed to a second commit.
      why_it_cannot_be_repaired_in_place: >-
        d0c6d7e13 is immutable and already merged to main. Amending or rewriting
        it is forbidden — AGENTS.md prohibits rebasing or rewriting history over
        pushed run records, and CLAUDE.md records that squash-style replacement
        is what made five goals carry unresolvable latest_verified_commit values.
        No act available to any agent can now discharge the card's clause as
        written. The clause is therefore recorded as unmet; only the OBJECTIVE it
        served is discharged, by the receipt plus this decision.
      remedy: >-
        Accept the two-commit shape here, and prevent recurrence by binding the
        remaining archival tasks to write their receipt BEFORE staging (see
        binding_on_remaining_archival_tasks).
    - id: DEF-2
      name: RQ-AES-002 ABSENT FROM THE ARCHIVE COMMIT MESSAGE
      statement: >-
        The queue's archive.record_ids for TASK-20260810-c1cfd5 holds FOURTEEN
        identifiers. A literal grep of `git log -1 --format=%B d0c6d7e13` over all
        fourteen found THIRTEEN present — GOAL-AES-002, BATCH-2b0fd1,
        DEC-20260810-ba50dc, TASK-20260810-095c67, TASK-20260810-c1cfd5,
        TASK-20260810-4a478d, TASK-20260810-f7bc82, TASK-20260810-d8835b,
        TASK-20260810-2a0a37, TASK-20260810-1a81be, TASK-20260810-1166f2,
        TASK-20260810-9fc65d, TASK-20260810-9f661a — and ONE ABSENT: RQ-AES-002.
      not_rounded_up: >-
        Thirteen of fourteen is NOT scored as met, and this decision does not
        round it up. RQ-AES-002 is the research question the entire batch serves;
        its absence means the batch's governing question is not discoverable from
        its own opening archive commit by an auditor walking git history.
      severity_and_reasoning: >-
        A naming defect, not a content defect. No archived byte is affected and no
        record is mis-bound; what is lost is discoverability from one commit
        message.
      remedy: >-
        d0c6d7e13 must NOT be amended. The commit carrying the
        TASK-20260810-c1cfd5 receipt names ALL FOURTEEN identifiers INCLUDING
        RQ-AES-002, so the archive's record set is complete across the two commits
        that together constitute it. Because DEF-1 already makes this a two-commit
        archive, completing the record set across those same two commits is the
        consistent repair rather than a second irregularity.

  official_outcome:
    task_id: TASK-20260810-c1cfd5
    outcome: completed
    queue_state_to_record: completed
    the_acceptance_rests_on_this_decision: >-
      TASK-20260810-c1cfd5's official outcome is `completed` BECAUSE OF THIS
      DECISION AND NOT OTHERWISE. tools/research_dispatch.py fixes the queue task
      state vocabulary at queued, running, blocked, completed, failed, invalid and
      cancelled; there is no value meaning "completed with a recorded defect", and
      inventing one is not permitted. A BARE `completed` RECORDED WITHOUT THIS
      DECISION WOULD LAUNDER BOTH DEFECTS — a sequencing deviation and a naming
      omission — INTO A CLEAN ARCHIVE, which this program treats exactly as it
      treats dropping a conditional qualifier: as an assertion above what the
      record supports. The producing session's own honest verdict was
      `completed_with_deviation`; this decision is what converts that into an
      official `completed`, and it does so only by carrying both defects and both
      remedies on the permanent record.
    why_not_failed_or_invalid: >-
      `failed`, `invalid` and `cancelled` would each be FALSE. The archive exists,
      its content is exactly the declared set, every non-self digest verifies, and
      the commit is reachable from HEAD and from origin/main. Recording an invalid
      archive would misreport a working one and would block every dependent
      BATCH-2b0fd1 task for a reason that does not exist.

  binding_on_remaining_archival_tasks:
    tasks:
      - TASK-20260810-f7bc82
      - TASK-20260810-1a81be
      - TASK-20260810-9f661a
    bindings:
      - >-
        WRITE THE RECEIPT BEFORE STAGING. Each of these tasks must author its
        receipt file first, then stage the declared artifacts TOGETHER WITH the
        receipt, so that all declared paths enter ONE commit. The two-commit shape
        accepted here for TASK-20260810-c1cfd5 is accepted because it can no
        longer be undone, not because it is the standard; it must not recur.
      - >-
        NAME EVERY archive.record_ids IDENTIFIER IN THE COMMIT MESSAGE, checked
        against the queue's archive block before committing rather than after —
        including every RQ-* identifier, which is the one DEF-2 shows is easy to
        drop.
      - >-
        The SC-1 stamp block remains the first content of each receipt, and each
        receipt remains its task's designated covering manifest under SC-3.
    scope_of_this_binding: >-
      These three tasks only. TASK-20260810-9fc65d is not listed because the
      BATCH-2b0fd1 queue assigns it a non-archival role; if a later in-scope act
      determines otherwise, the same discipline applies to it by the same
      reasoning, but this decision does not assert a role it has not read for that
      task.

