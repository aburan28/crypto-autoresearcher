  goal_head_correction:
    id: CORR-BATCH-2b0fd1-FIRST-ACT
    field: ledger/goals/GOAL-AES-002.yaml next_action
    contradiction: >-
      The goal head directed dispatching TASK-20260810-4a478d, the RANK 1 protocol
      act, "AS THE FIRST ACT OF BATCH-2b0fd1". The committed dispatch queue gives
      TASK-20260810-4a478d depends_on [TASK-20260810-c1cfd5], and the dispatcher
      reported TASK-20260810-c1cfd5 as the only ready task. The head's single
      preserved next action was therefore BLOCKED BY THE HEAD'S OWN QUEUE.
    correction: >-
      TASK-20260810-c1cfd5, the opening snapshot, is the FIRST ACT of BATCH-2b0fd1
      and is discharged under this decision. TASK-20260810-4a478d is the first
      PRODUCING act and remains gated behind that snapshot exactly as the committed
      queue's depends_on states. The ranked shape, the concurrency cap and every
      other element of the head's planning text are unchanged.
    how_applied: >-
      By targeted string replacement only, never a YAML round-trip, with the
      superseded head text kept visible in this goal's established style. `status`
      was not changed and no other field was touched.
    what_this_correction_is_not: >-
      It is not a reprioritization, a re-scoping, a re-budgeting or a claim about
      any research content. It reconciles a planning-text ordering statement with
      the committed dependency graph.

  rationale:
    - >-
      An archive's purpose is to bind downstream readers to immutable bytes. That
      purpose is fully served here: twenty-two declared paths, exact set, every
      digest verified, zero drift, reachable from origin/main, published in a PR
      that names the batch's governing records.
    - >-
      CLAUDE.md makes content the primary binding and reachability advisory
      precisely so that an archive's validity does not depend on commit topology,
      which N concurrent worktrees cannot control. A two-commit archive whose
      content verifies exactly is the case that rule anticipates.
    - >-
      The alternative — marking the archive invalid — would be false to the
      observable facts and would block the batch on a defect of sequencing rather
      than of content. AGENTS.md is explicit that an evidence-integrity failure
      blocks downstream work; this is not one, and treating it as one would be its
      own misreport.
    - >-
      Both defects are nevertheless recorded rather than waived, because the
      failure mode this program guards against is not an irregular archive but an
      irregular archive that reads as clean. The producing session declined to
      accept its own deviation and referred it here, which is the correct
      escalation and is noted as such.
    - >-
      Binding the remaining archival tasks to receipt-before-staging converts a
      one-off irregularity into a corrected procedure, which is the only durable
      value this incident has.

