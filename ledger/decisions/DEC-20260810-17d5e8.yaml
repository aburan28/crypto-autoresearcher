  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No knowledge entry is warranted. This is an archival and procedural
      adjudication, not an evidence review: it cites no EV-* record, rests on no
      run, and produces no durable claim about AES or about any cryptographic
      object. The program promotes internal findings only from support or
      reject_scoped decisions backed by replicated or strong evidence, and this
      decision is neither. The procedural lesson — write the receipt before
      staging, and check the record_ids list against the commit message before
      committing rather than after — is bound where it can act, on the three
      remaining BATCH-2b0fd1 archival tasks, rather than generalized into a
      KN-TECH entry from a single incident.

  standing_constraints:
    SC-4: >-
      SATISFIED VACUOUSLY AND DELIBERATELY. This decision states NO MARGIN in any
      field, so RQ-AES-002's R5 anti-laundering clause has nothing to attach to.
      No definitional exhaustive-key-search reference is invoked, no CM-1
      comparison is made, and no dominated_by / sota_delta pair is emitted, because
      this is not an ideation or closure deliverable.
    SC-5: SATISFIED. No recalled literature figure is cited, in either direction.
    SC-6: >-
      SATISFIED. No comparison against the published state of the art appears; it
      is unadjudicable in this environment in both directions.
