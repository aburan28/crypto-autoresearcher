coordinator_decision:
  id: DEC-20261023-26a6de
  recorded_at: '2026-10-23'
  goal_id: GOAL-CZLIFT-1516d5
  question_ids: [RQ-CZLIFT-b9f765]
  kind: evidence_review
  mode: goal
  context: >-
    Evidence review of EXP-CZLIFT-a255fc (H-CZLIFT-9a32e9). Both planned trials
    (RUN-CZLIFT-74f172, hmax 1e5 with twists; RUN-CZLIFT-490b33, hmax 3e5) are
    output_validated, and DEC-20261009-9f9254 recorded their frozen
    criterion as met, as an observation. Independent validation
    VAL-20261022-9ab683 found custody and recomputation exact. It found that
    the 11a1 control fires as written at H = 10, which CORR-20261023-0657da
    resolved by scoping it to H >= 16, so both runs are admissible. It also
    found that the coverage instrument cannot detect excess (PTM-1). The red
    team RT-20261023-481827 broke R1: the uniform-reduction clause is
    contradicted, and the excess has a kernel-of-reduction height-floor
    mechanism that does not help an attacker. It also broke R2: the H_half
    extrapolation rests on four unstated transfer assumptions, T1 to T4. PTM-1
    held trivially. The coordinator prior, recorded before the reviewers ran,
    was right on growth and on the sign of the excess. It was wrong on the
    excess's size: lattice spread explains only about a third.
  decision: weaken
  decision_scope: >-
    One transition: H-CZLIFT-9a32e9 approved -> weakened. Readings by clause:
    C1 growth law supported; C2 uniform reduction contradicted as stated; C3
    H_half scaling consistent but derived from C1, and not uniform in p; C4
    exponential height ("useless") not measured, conditional on T1-T4; C5
    twists / E(K) untested. Scope: the eight-curve ladder, naive height
    <= 3e5, p = 103..20011, toy tier. No reject_scoped: the adverse C2 reading
    rests on a derivation plus post-hoc analyses, while the frozen criterion
    was met and the frozen falsification condition did not fire. Closes no
    lane, changes no RQ text, approves nothing, promotes nothing.
  target_ids:
    - H-CZLIFT-9a32e9
    - EXP-CZLIFT-a255fc
    - RUN-CZLIFT-74f172
    - RUN-CZLIFT-490b33
    - EV-CZLIFT-376eee
  status_transitions:
    - {id: H-CZLIFT-9a32e9, from: approved, to: weakened, evidence: EV-CZLIFT-376eee}
  clause_decisions:
    C1_growth_law: >-
      supported at toy scope: N_E(H) agrees with V_r (log H)^{r/2}/sqrt(Reg)
      within [0.963, 1.309] for 1e3 <= H <= 3e5 on ranks 1..7; growth slopes
      within 0.32 of r/2 on both runs; 11a1 at 5 for H >= 30.
    C2_uniform_reduction: >-
      contradicted as stated. The frozen criterion is met but cannot fail on
      the upper side. The median 1.0330 / 1.0333 lies outside every uniform null
      (upper edge <= 1.0041), and both cell tails reject. The structured
      kernel-floor null fits (1.0350 [1.0294, 1.0398] vs 1.0338).
    C3_h_half_scaling: >-
      consistent and derived from C1: off-grid slopes equal 2/r within 0 to +10
      percent for p = 103..2417. H_half is infinite where [E(F_p) : red_p E(Q)]
      >= 3 (37a1, p = 211, 293), so the uniform-in-p "+ O(1)" fails, in the safe
      direction.
    C4_exponential_height_useless: >-
      not measured: H_half <= p^{1.71} at every resolved toy prime. Beyond toy
      scale, only the conditional fixed-rank bound log H_half >= (sqrt(Reg)
      N_p/(2 V_r))^{2/r}(1 + o(1)) holds, under T1-T4. Height is not attack
      cost.
    C5_twists_E_of_K: >-
      untested: the instrument counts E(Q) union E^D(Q), not E(K). One twist
      supplies all 8 twist-bearing frozen cells.
  supersedes_readings:
    - record: DEC-20261009-9f9254
      fields: [criterion_readings.EXP-CZLIFT-a255fc.reading, user_hypothesis_clauses.global_lifts_fail_by_counting]
      note: >-
        Those observation readings ("reductions cover E(F_p) like uniform
        points"; the twist union "covers E(F_p) exactly as the uniform model ...
        predicts"; "Consistent at toy scope") are superseded at clause level by
        this decision. The earlier record is not edited.
  rationale:
    - 'Validity first: 2 of 2 trials, receipts output_validated (returncode 0, check_returncode 0), 20/20 artifact hashes bound, exact recomputation of every frozen metric, independent replay of all counts and coverage cells with H <= 3e4 by two implementations that share no producer code, and deterministic enumeration with no seeds. The 11a1 control is scoped by CORR-20261023-0657da, and its count of 3 at H = 10 is arithmetically correct. The run set is admissible evidence.'
    - 'The frozen coverage criterion is met but uninformative on the side that matters. Any point set gives ratio <= min(x,1)/(1 - e^-x), and the median x is 0.10. A maximally spread planted set passes (1.0514 / 1.0548). "Criterion met" therefore carries no support for C2. This is a reading of instrument power, not a change of criterion; no amendment is made, and the frozen reading stands as recorded.'
    - 'Calibrated against seeded nulls, C2 fails: 1.0330 / 1.0333 against uniform bands with upper edges 1.0023 (validator) and 1.0041 (nested and negation-paired), 0/200 reps reaching it; 97 / 123 cells with upper tail < 1e-6 and 2 / 6 with lower tail < 1e-6. The deviation is two-sided and structural.'
    - 'The refutation artifact is a derivation (analysis.md D1-D5): reduction is a homomorphism (D1); kernel vectors have h^ >= 2 log p - c_E (D2, measured >= 2 log p + 0.91); collisions are therefore suppressed at short distance and clumped on few kernel vectors (D3); rank-1 sets are injective below ord(red_p P)/2 (D4, matching the maximal spread of every 37a1 row); and the image index caps coverage (D5). A one-assumption structured null reproduces the median. proof_status is derivation, not certificate: the instances are not packaged with an independent re-checker.'
    - 'Weaken, not reject_scoped. The adverse analyses were not pre-registered, the frozen falsification condition of HEUR-CZLIFT-UNIFORM did not fire, and the two runs share every point up to 1e5. Rejecting a clause on post-hoc tests while its frozen criterion passed would amount to changing the criterion after the outcome. A pre-registered replication on disjoint curves and primes is required first.'
    - 'The C2 failure does not rescue global lifts. By pigeonhole (D6), any spread saves at most a factor 2 ln 2 in N, i.e. at most 0.327 (r = 2) to 0.093 (r = 7) in log log H_half. The kernel floor works against relation-finding. The obstruction survives as a counting obstruction at fixed rank (D7), carried by C1, not by uniformity.'
    - 'C4 is not a measurement. At toy primes half coverage is polynomial in p (H_half <= p^{1.71}). Ranks 5..7 already sit at or above r*(p) on those primes. The extrapolation to p ~ 2^256 spans 23 to 31 times the fitted log p and needs T1-T4, which no earlier record stated. The phrase "exponential in p^{2/r}" bounds height, not cost (log H ~ p^{2/r} bits < p^{1/2} for r >= 5).'
    - 'C5 is untested and stays open. It is not a negative result: the instrument did not form E(K) points.'
    - 'Strength replicated, tier toy. C1 alone would be strong. C2 is capped by post-hoc selection and by the shared point sets.'
  evidence_refs:
    - ledger/evidence/EV-CZLIFT-376eee.yaml
    - experiments/EXP-CZLIFT-a255fc/analysis.md
