    - experiments/EXP-CZLIFT-a255fc/reports/redteam-20261023/rt_c_points_kernel_index_output_H30000.json
    - experiments/EXP-CZLIFT-a255fc/reports/redteam-20261023/rt_g_conditioned_null_output.json
    - experiments/EXP-CZLIFT-a255fc/reports/redteam-20261023/rt_h_obstruction_numbers_output.json
