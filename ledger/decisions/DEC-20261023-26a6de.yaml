  review_round:
    plans: [REVIEW-CZLIFT-A255FC-20261022, REVIEW-CZLIFT-A255FC-EVIDENCE-20261023]
    joint_verdicts:
      J1: holds
      J2: 'breaks (admissibility; resolved by CORR-20261023-0657da)'
      J3: holds
      PTM-1_validation: 'breaks (instrument ceiling: upper side cannot fail)'
      R1: breaks
      R2: breaks
      PTM-1_red_team: 'holds (weak control; PTM-1b adopted as D5)'
    composition: >-
      J2's break concerned admissibility, and it is closed by the ruling. The
      validation PTM-1 and the red-team R1 compose: the instrument cannot test
      C2's upper side (PTM-1), and calibrated nulls contradict C2 (R1). R2
      composes with the D7 reading of C3/C4. The red-team PTM-1 "holds" is weak
      (torsion makes rank 0 trivial), and its strengthened object PTM-1b (37a1
      index primes) is adopted as D5.
    procedure_deviations:
      - 'Validation: the blind phase and J1/J2 sat in one task, so tools/check_review_independence.py is expected to report a blind_from intersection after the seal (disclosed in VAL-20261022-9ab683). Accepted: the blind values were sealed before any producer path was read.'
      - 'Red team: read docs/inventor-protocol.md (outside read_scope; named in its role contract) and two external sources (JKSST 2000 PDF, arXiv:1210.7459). Disclosed; no sibling report was read.'
      - 'tools/check_review_independence.py was not run by this composer (no shell); see next_actions.'
  limitations:
    - Toy tier only (p <= 20011, H <= 3e5); H_half is resolved only at p = 103..2417 with 4-10 primes per curve. No statement about cryptographic p except the conditional bound under T1-T4.
    - The adverse C2 analyses are post hoc. The two runs share all points up to 1e5. The structured-null and Mordell-Weil-coordinate analyses cover H <= 3e4 only (598 / 470 cells), and the kernel-floor analysis skips the 26 non-cyclic pairs.
    - Rank upper bounds are unverified; D4 and D5 rely on the recalled Mordell-Weil group of 37a1. The volume-law constant (Lang 1983) and the height-difference bound are recalled ingredients.
    - The producer's checker imports the driver; independence of the numbers rests on the validator's replay and the red team's sieve. No library versions or memory record exist in the run packages.
    - The derivation note is a checkable written argument, not a machine-checked proof; the counterexample instances are not yet packaged as certificates.
    - Spec discrepancies (primes 103..20011 vs 101..20000; cell domain; twist O double count; "10^6" in interpretation_limits) change no frozen outcome but remain on record.
    - This decision is not official until the ledger archive commit containing it, EV-CZLIFT-376eee, analysis.md, the hypothesis update and the decision report passes post-commit verification and is pushed to the PR branch.
  next_actions:
    - 'Session (archive): write experiments/EXP-CZLIFT-a255fc/analysis.md from the text returned by this coordinator subagent (the subagent could not write .md files). Run plot.py in reports/review-DEC-20261023-26a6de/ to produce graph.svg, compile report.typ to report.pdf, and inspect every page. Run tools/validate_ledger.py and python3 tools/check_review_independence.py --batch over the two review folders, recording any departure as a procedure deviation. Then run the ledger archive TASK-20261023-4d7449 alone, staging by exact path: the validation and red-team report folders, ledger/corrections/CORR-20261023-0657da.yaml, analysis.md, ledger/evidence/EV-CZLIFT-376eee.yaml, ledger/decisions/DEC-20261023-26a6de.yaml, ledger/hypotheses/H-CZLIFT-9a32e9.yaml and the review-DEC-20261023-26a6de folder (report.typ, plot_data.json, plot.py, graph.svg, report.pdf). Verify the commit, merge origin/main (merge, never rebase), push, and open or refresh the ready-for-review PR "evidence: EV-CZLIFT-376eee/DEC-20261023-26a6de".'
    - 'Goal checkpoint: after the verified archive, checkpoint GOAL-CZLIFT-1516d5 (still active) with exactly one next action for this lane: dispatch the idea-generator (/propose-ideas RQ-CZLIFT-b9f765) to write the refined successor of H-CZLIFT-9a32e9. It must replace HEUR-CZLIFT-UNIFORM by a numbered structured-reduction heuristic (lattice ball under red_p, image index k_p, kernel floor h^ >= 2 log p - c_E), scope H_half to k_p <= 2, state T1-T4 as numbered transfer assumptions, and restate C4 as the conditional fixed-rank counting bound, with height and cost kept separate.'
    - 'Replication before any reject_scoped (to /design-experiment once the successor exists): pre-register the structured null (rt_g R1) against the nested and negation-paired uniform null (rt_a) as the primary comparison, with exact per-cell tails, on curves and primes disjoint from this census (a second curve per rank 1..7 and primes above 20011). Compute k_p for every (curve, p) before reading H_half, compute H_half off the grid with tolerance |slope x r/2 - 1| <= 0.1, and include cells at H >= 1e5.'
    - 'Package the D5 and D3 instances as counterexample certificates with an independent re-checker: 37a1 at p = 211 (N_p 225, ord red(0,0) = 45) and p = 293 (N_p 296, ord 74); 389a1 at p = 149 (kernel point K with p^2 | den x(K) producing 28 collisions at H = 3e4). Cite the Mordell-Weil group of 37a1 with retrieved provenance. Then update proof_status in a successor evidence record if they pass.'
    - 'C5 (if kept): an E(K) census for K = Q(sqrt D) that forms sums over the Q-bases of E(Q) and E^D(Q), counts by K-height, uses positive-rank twists (for example 11a1 D = -7) and counts O once.'
    - 'If rank labels become load-bearing: rank upper bounds by 2-descent (PARI ellrank) on the ladder.'
    - 'Resource-check candidates to the idea-generator as ordinary proposals (they change no status): (a) global lifts whose rank grows like log p / log log p and that reduce to a prescribed target curve; (b) short vectors of ker red_p, or the coset of Q, without discrete logs, pre-screened against KN-LIT-7593.'
    - 'For the synthesis task on RQ-CZLIFT-b9f765 (corrections listed, not written here): (1) decision_target (a) "small global points cover E(F_p) no better than uniform reductions" is false as worded; a negative closure of the global-lift sub-question must rest on the counting obstruction of EV-CZLIFT-376eee with its forward guidance, not on uniformity. (2) The motivation''s "points of height <= H number about H^{r/2}" holds for canonical (logarithmic) height; for naive height it is (log H)^{r/2}. (3) The census quantifies the counting ingredient of JKSST 2000 Thm 4.1, not the theorem; "Silverman-Suzuki, Huang-Kueh-Tan and the xedni analysis all die on this" is not established. (4) Cite Lang 1983 Ch. 5 Thm 7.4 for the count with its constant (Neron 1965 is an imprecise attribution).'
    - 'Infrastructure ticket to the executor / harness owner (not evidence): make check.py independent of run.py; evaluate every frozen control in the checker; read the code revision at launch, not at write time (AC-5); record library versions and peak memory.'
