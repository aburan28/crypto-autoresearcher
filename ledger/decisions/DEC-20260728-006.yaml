coordinator_decision:
  id: DEC-20260728-006
  context: >-
    GOAL-SSI-001 BATCH-002 close-out. The batch ran the zero-compute
    matched-baseline derivation gate opened by DEC-20260725-002 under red-team
    disposition ADMIT_BASELINE_DERIVATION_FOR_BATCH_002. Producer
    TASK-20260728-005 closed gates G1-G4 under a named cost convention
    SSI-FC-2026 with zero curve compute. Independent, non-originating red team
    TASK-20260728-007 returned ACCEPT_WITH_MANDATORY_CORRECTIONS: all four gate
    VERDICTS survive, three supporting DERIVATIONS do not. Erratum
    TASK-20260728-009 applied controls RC1, RC2, RC3 and RC6 as a superseding
    artifact without editing the immutable v1 records. All three sessions
    independently report new_attack_mechanism_detected false, so BATCH-002
    satisfies no GOAL-SSI-001 completion criterion, exactly as its opening
    pre-registered.
  decision: revise
  target_ids:
    - GOAL-SSI-001
    - RQ-SSI-001
    - IDEA-20260725-001
    - EV-SSI-004
    - TASK-20260728-005
    - TASK-20260728-007
    - TASK-20260728-008
    - TASK-20260728-009
  rationale:
    - >-
      WHAT THE BATCH ESTABLISHED, AT DERIVATION TIER. Under SSI-FC-2026 with the
      table build charged for its own memory accesses, meet-in-the-middle on
      F_{p^2} has full cost Omega(p^{2/3}) UNIFORMLY in the table size; the
      p^{3/5} rebalance asserted by v1 does not exist and is withdrawn, and
      Wiener's n^{2/3} is recovered as the optimum within the convention. The
      producer's error ran conservative: the correction is stronger than what it
      replaced. RT-20260725-503 objection F2 is upheld with a model-independent
      proof. The low-memory analogue survives RESTATED, not falsified, and is
      well-defined only under extra assumptions. The F_{p^2} unconditional tier
      survives BY CITATION ONLY - C-alpha is CITED, not DERIVED.
    - >-
      WHY THE DISPOSITION IS revise AND NOT support. No H-SSI-* hypothesis
      exists to promote; IDEA-20260725-001 remains at idea stage. Independently
      of that, the four asymptotic-claim promotion gates are unmet: the batch
      assembles no proof decomposition for a new claim under per-attempt-cost
      times inverse-success-probability bookkeeping, its heuristics H1-prime
      through H4-prime carry no archived validation and no scheduled validation
      experiment, no concrete-cost table at standardized parameter sets exists,
      and the artifact that carries the corrections has itself received no
      independent review. A claim in this state may reach analyzed; it may never
      be recorded supported.
    - >-
      WHY NOT reject_scoped. The refutation artifacts required before an adverse
      transition DO exist and were archived before this decision, all at
      proof_status derivation rather than empirical_only: the algebraic mutation
      that closes the p^{3/5} regime, the spectral-plus-counting counterexample
      to the v1 index-space sizing, and the internal-contradiction falsification
      of the v1 descent specification. What is missing is not proof but
      independence and replication. The F_{p^2} half of the premise closure
      rests on one parenthetical clause of a related-work paragraph, labelled an
      interpretation of a quotation; the whole record is one unreplicated
      lineage on a single resolved model; and the correcting erratum is
      unreviewed. A terminal rejection on that basis would over-assert. The
      scoped closure of IDEA-20260725-001's premise is therefore recorded as an
      observation in EV-SSI-004 at strength preliminary, not enacted as an
      official rejection.
    - >-
      WHY NOT weaken, pause, replicate, expand OR supersede. weaken names a
      hypothesis-status transition and there is no hypothesis record to move;
      the weakening is already carried by EV-SSI-004 direction weakens. pause is
      unavailable because no declared pause condition holds. replicate was the
      closest runner-up - re-running the derivation on a distinct resolved model
      would repair the single-model concurrence - but it buys independence
      hygiene on a lane already established as non-target-class, and the
      remaining budget is better spent on a mechanism hunt with the review debt
      attached to it. expand is excluded by the dispatch bias: this lane moved
      no exponent. supersede describes an artifact-level fact - v2 supersedes v1
      for every machine-readable field - which is recorded inside EV-SSI-004
      rather than used as the batch disposition, because superseding a producer
      artifact is not a research-state transition.
    - >-
      RECORDED RATHER THAN INHERITED, ITEM 1: the completion flag. new attack
      mechanism detected is FALSE, reached independently three times, and
      BATCH-002 therefore satisfies NO completion criterion. Nothing in this
      decision may be read as partial completion, and no mechanism was
      manufactured to satisfy a completion route.
    - >-
      RECORDED RATHER THAN INHERITED, ITEM 2: the erratum introduced NEW,
      UNREVIEWED content - disagreement D1 (the reviewer's claim that the v1
      claw-count equality survives the restatement is wrong; the correct
      relation is omega, not Theta) and a newly derived Lemma 4-prime(b) that is
      load-bearing for the memory-independence conclusion. No independent
      session has checked either. Both are carried as unreviewed with a named
      successor gate.
    - >-
      RECORDED RATHER THAN INHERITED, ITEM 3: the F_p regime rests on an
      abstract. Every F_p figure relays through KN-LIT-078, whose own entry
      states the full paper was not read and whose ePrint number is
      unconfirmable, against KN-TECH-050's standing instruction that a BATCH-002
      derivation obtain every quoted figure from the papers themselves. Both
      quotations were verified verbatim. RC4 is carried open; it is a PRECISION
      control, not a verdict control, because the F_p ranking is robust either
      way.
    - >-
      RECORDED RATHER THAN INHERITED, ITEM 4: v1 carried a sign error. The
      memory rebalance of the archived conditional algorithm LOWERS a live
      attack's full cost from p^{4/9+o(1)} to p^{2/5+o(1)}; v1 asserted the
      opposite and used it as a reason no mechanism was found. The verdict is
      unchanged and the reasoning is replaced. Relatedly, the operative
      thresholds for any future candidate are the TIME tiers; the full-cost
      figures sit above a superpolynomial o(1) disclosed by the source's own
      authors and are carried as provisional.
    - >-
      RECORDED RATHER THAN INHERITED, ITEM 5: model independence was NOT
      achieved. orchestration/model-bindings.yaml binds both research-deep and
      review-adversarial to claude-opus-5 on the default backend with
      last_probed null, so producer, reviewer and erratum author resolved to one
      model and every session records model_verified false. This is three
      SESSIONS, not three independently-resolved judgements. No policy
      equivalence is claimed and no future closure attestation may count them as
      distinct.
    - >-
      RECORDED RATHER THAN INHERITED, ITEM 6: one independent review was
      commissioned, not two, and the campaign wall-clock tally is NOMINAL and
      NOT AUDITABLE - no committed artifact records BATCH-001's actual
      consumption. The budget is not asserted to be satisfied.
    - >-
      RECORDED RATHER THAN INHERITED, ITEM 7: an orchestrator repair is
      disclosed. baseline_recommendation_v2.yaml did not parse when returned;
      after one failed round-trip the dispatching layer dedented four lines. The
      change was verified whitespace-only (stripping all whitespace yields
      identical bytes), but it was an edit by the dispatcher to a producer
      artifact and is recorded as such.
    - >-
      RECORDED RATHER THAN INHERITED, ITEM 8: TASK-20260728-009 was added
      mid-batch on the reviewer's mandate and its own session records that no
      dispatch card for it exists in the tree. Its artifacts are committed; the
      handoff that authorised them is not. Future batches must archive the card
      before the artifact.
    - >-
      TARGET-CLASS ASSESSMENT. Under docs/target-result-profile.md rule A1
      nothing in BATCH-002 is target-class: no exponent of any named hard
      problem moves. This is cost-model hygiene plus one corpus-currency
      correction, and it is not a cryptanalytic result. The single most
      decision-relevant output, C-beta, needed no cost model at all: KN-TECH-029
      is stale against this repository's own archived primary text, so any
      candidate benchmarked against p^{1/2} on F_{p^2} measures against a
      superseded baseline.
    - >-
      DURABILITY. Nothing in BATCH-002 is official until this ledger archive
      commits and the dispatcher's post-commit verifier accepts it. This
      decision asserts no validator pass, no closure quorum, and no verification
      of any commit that this session could not read.
  evidence_refs:
    - EV-SSI-004
    - coordination/goals/GOAL-SSI-001/batches/BATCH-002/tasks/TASK-20260728-005/derivation_note.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-002/tasks/TASK-20260728-005/baseline_recommendation.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-002/reviews/TASK-20260728-007/red_team_report.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-002/reviews/TASK-20260728-007/falsification_review.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-002/tasks/TASK-20260728-009/baseline_recommendation_v2.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-002/tasks/TASK-20260728-009/errata_note.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-002/archives/TASK-20260728-006/snapshot_commit_receipt.json
    - DEC-20260725-002
  limitations:
    - >-
      Zero runs and zero curve compute. No empirical claim at any tier, no
      parameter set, no scale. The batch names no prime, no curve and no field
      size, so the toy-medium-crypto ladder does not apply and nothing here may
      be quoted as validation at any scale.
    - >-
      Scoped to SSI-FC-2026 and to supersingular path-finding at unrestricted
      degree, Problems 1 and 2. IDEA-20260725-001's premise is closed on that
      exact scope only; it closes nothing about full-cost accounting elsewhere
      in the program, where KN-TECH-035 and KN-TECH-044 remain in force. The
      fixed-degree CSSI/SIDH regime is explicitly outside it.
    - >-
      Every conditional exponent depends on Heuristic 1 of
      inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, which this program has
      neither validated nor challenged, and sits above a superpolynomial o(1).
      H1-prime through H4-prime are unvalidated and no validation experiment is
      scheduled.
    - >-
      The correcting artifact carries unreviewed content (D1 and Lemma
      4-prime(b)); RC4, RC5 and RC7 are open; the F_p regime is sourced at
      confidence relayed_from_abstract; and the memory model's achievability
      half is assumed, not proved.
    - >-
      Producer, reviewer and erratum author share one resolved model and none is
      probe-verified. One independent review, not two. Campaign budget tally
      nominal and unauditable.
    - >-
      This decision changes no hypothesis status, creates no hypothesis record,
      closes no research direction, opens no batch, and edits no immutable
      record. It does not assert that the ledger validates - the repository is
      known to carry pre-existing validation errors that are not this batch's to
      repair - and it does not assert that any closure quorum exists or is
      available.
  next_actions:
    - >-
      Open BATCH-003 as a MECHANISM-GENERATION batch against the corrected
      baseline, with the BATCH-002 review debt attached to it, in this card
      order and with every card carrying non-null budget fields and an exclusive
      write scope: (1) idea-generator mechanism hunt on the surviving
      supersingular hardness assumptions (endomorphism-ring / SQIsign
      foundations, CSIDH class-group action), admitting only candidates that
      target the TIME exponent - benchmarks are p^{1/2+o(1)} unconditional and
      p^{1/3+o(1)} conditional on F_{p^2} and p^{1/4+o(1)} on F_p, never the
      provisional full-cost figures - and carrying the L1 ceiling that a
      constant-multiplicity target set is already priced at o(1); (2) one
      bounded zero-compute card discharging the BATCH-002 review debt: an
      independent check of erratum items D1 and Lemma 4-prime(b), the RC4 and
      RC5 literature fetches, and a drafted KN-TECH supersession for C-beta with
      a regenerated knowledge/INDEX.md declared as its own paths; (3) an
      independent review dispatched with an inference binding that resolves to a
      model distinct from claude-opus-5, or, if that cannot be resolved, an
      explicit record of the failure and a correspondingly capped evidence
      strength - never a silent repeat; then (4) the isolated snapshot archive
      and (5) the isolated ledger archive, each declaring exactly the paths it
      commits. BATCH-003 must be scoped inside the remaining nominal headroom of
      campaign_budget.total_wall_clock_seconds - roughly 1800 of 10800 seconds
      on declared figures, with BATCH-001's actual consumption unrecorded - or
      carry its own Coordinator decision extending the campaign budget. Do not
      re-dispatch the full-cost accounting lane: it is exhausted of
      decision-relevant content.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NO KN-FIND IS WARRANTED BY THIS DECISION, for three concrete reasons.
      (1) The mandatory-promotion trigger does not fire: the disposition is
      revise, not support or reject_scoped, and EV-SSI-004 is strength
      preliminary - below the replicated/strong bar - because producer, reviewer
      and erratum author resolved to one model and the correcting artifact is
      unreviewed. (2) The one item with durable-finding character, the
      any-claw/golden-claw accounting, rests on the newly derived Lemma
      4-prime(b), which no independent session has checked; promoting it now
      would import an unreviewed lemma into the corpus. It is routed to
      BATCH-003 card 2. (3) The one correction that IS ready in substance,
      C-beta - KN-TECH-029's classical F_{p^2} figure is stale against this
      repository's own archived primary text - requires a KN-TECH supersession
      plus a regenerated knowledge/INDEX.md, and knowledge/ is deliberately
      outside every declared BATCH-002 write scope. This archive declares
      exactly four paths and none is under knowledge/; writing one here would
      break the declared-equals-committed discipline that main's GOAL-ECDLP-001
      BATCH-010 violated. C-beta is dispatched as a separate successor task with
      its own declared paths, per the next action. No KN-OPEN entry is created
      either: RC4, RC5 and RC7 are bounded controls with named owners, not
      crystallized open problems.
  decided_by: coordinator
  decided_at: '2026-07-28'
  decided_at_precision: >-
    Date only. This session has no shell and no clock access and does not
    fabricate a wall-clock time.
