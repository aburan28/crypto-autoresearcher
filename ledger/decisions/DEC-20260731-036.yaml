coordinator_decision:
  id: DEC-20260731-036
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-028
  recorded_by_task: TASK-20260731-131
  context: >-
    BATCH-028 was the bounded-toy EXP-IT-001 v3 Executor line
    (SG-ECDLP-002 / IDEA-20260731-008, hypothesis H-IT-001) under approved
    DEC-20260731-034 / specification.v3.yaml (claim ceiling toy). After a
    first zero-artifact STALL, a fresh Executor (TASK-20260731-127) produced
    RUN-IT-001-bounded-toy, snapshot-archived at TASK-20260731-128 commit
    a4561488d972895b1192cc4d0c99d86edc8a54f3. Independent Validator
    VAL-20260801-129 returned NOT_ADMISSIBLE with blocking defects D-1..D-4
    (truncated invalid-JSON HEUR_ISO_1_report.json crash artifact; undisclosed
    driver crash EXIT:1; snapshot missing 4 of 12 manifest-declared paths;
    unarchived density freeze). Red Team RT-20260731-130 returned BLOCKING x2
    + HIGH x3 + MEDIUM/LOW (crashed run archived as completed_valid; both
    controls void so all R_xfer=0.0 are censorship placeholders, not negative
    evidence; rate_iso_1_pass:false is a gate-hold over censored rows with a
    laundering route into H-DS-001 S1_met; C_special model inverted for the
    anomalous family so the planted control flips to PASS at the true Smart
    cost; no per-attempt x inverse-success-probability bookkeeping).
    Recommended disposition: failed_infrastructure for the run; scientific
    question inconclusive; H-IT-001 untouched at specified; gated rerun
    needed.
  decision: inconclusive
  decision_vocabulary_note: >-
    inconclusive means the data do not discriminate between explanations
    because the measurement is void (driver crash + corrupt declared artifact
    + both positive controls failed). It is NOT a null result, NOT negative
    evidence against H-IT-001, NOT reject_scoped, and NOT weaken. Per AGENTS.md
    rule 5 a crash / implementation failure is an evidence-integrity failure,
    never a mathematical result; the zeros carry no measured transfer content.
  decision_scope: >-
    Official disposition of RUN-IT-001-bounded-toy and of BATCH-028's first
    EXP-IT-001 execution attempt. The run is reclassified from the Executor's
    declared completed_valid to failed_infrastructure. H-IT-001 stays
    specified (unchanged transition). No support, no weaken, no reject_scoped,
    no lane-death claim for SG-ECDLP-001 / SG-ECDLP-002, no HEUR-ISO-1
    adjudication, no promotion. Claim ceiling toy.
  target_ids:
  - H-IT-001
  - EXP-IT-001
  - EV-IT-001
  - RUN-IT-001-bounded-toy
  - GOAL-ECDLP-001
  - BATCH-028
  - VAL-20260801-129
  - RT-20260731-130
  evidence_ids:
  - EV-IT-001
  evidence_refs:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/reviews/TASK-20260731-129/validation_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/reviews/TASK-20260731-129/receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/reviews/TASK-20260731-130/red_team_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/reviews/TASK-20260731-130/objections.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/reviews/TASK-20260731-130/receipt.json
  - ledger/evidence/EV-IT-001.yaml
  - experiments/EXP-IT-001/specification.v3.yaml
  - experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc27-b5-b8.yaml
  - experiments/EXP-IT-001/runs/RUN-IT-001-bounded-toy/manifest.json
  - experiments/EXP-IT-001/runs/RUN-IT-001-bounded-toy/stderr.log
  - snapshot a4561488d972895b1192cc4d0c99d86edc8a54f3
  hypothesis_status_transition:
    hypothesis_id: H-IT-001
    from: specified
    to: specified
    changed: false
    reason: >-
      First execution attempt (RUN-IT-001-bounded-toy) was void: the driver
      crashed (EXIT:1, Sage Integer serialization TypeError at
      run_bounded_toy.sage.py line 746), the required HEUR_ISO_1_report.json
      is a truncated crash artifact, both positive controls failed, and the
      run is reclassified failed_infrastructure. There is no admissible
      measurement, so H-IT-001 is neither supported nor refuted; status
      unchanged (specified). Do NOT read the censored zeros as negative
      evidence.
  h_ds_001_status:
    hypothesis_id: H-DS-001
    from: analyzed
    to: analyzed
    changed: false
    reason: >-
      BATCH-028 first-attempt disposition only; nothing in this void run
      touches H-DS-001 (S1_met must not be computed from rate_iso_1_* or
      rho_special fields of this package).
  asymptotic_promotion_gates:
    status_all: OPEN
  run_status_reclassification:
    run_id: RUN-IT-001-bounded-toy
    from: completed_valid
    to: failed_infrastructure
    reason: >-
      Driver crash EXIT:1 (TypeError: Object of type Integer is not JSON
      serializable, dict item 'version', run_bounded_toy.sage.py line 746),
      undisclosed in manifest/execution_report/dispatch_queue; corrupt
      declared artifact HEUR_ISO_1_report.json (153 B invalid JSON); both
      positive controls void; incomplete durable snapshot (4 of 12 declared
      paths missing; freeze file unarchived). AGENTS.md rule 5: evidence-
      integrity failure, not a mathematical result.
  concrete_run_defects_for_rerun:
  - >-
    D-1: HEUR_ISO_1_report.json truncated invalid JSON (153 B, ends at
    '"version": '); missing all spec.v3 schema-required fields (lines 184-196),
    pre-registered F_hit table (138-141), and density freeze (147-151).
    Crash artifact of run_bounded_toy.sage.py line 746 json.dump.
  - >-
    D-2: Undisclosed crash EXIT:1; manifest protocol_deviations=[] and
    validity_status completed_valid despite stderr traceback; stderr
    timestamps (23:13:35Z-23:17:32Z) fall after recorded finished_at
    23:13:16Z / wall_seconds 1758.87 s (provenance conflation with the
    stalled attempt, fresh_executor_after_stall=true).
  - >-
    D-3: Durable snapshot archives 9 of 12 manifest-declared paths; missing
    command.txt, environment.json, stdout.log, stderr.log (the only record of
    the crash).
  - >-
    D-4: HEUR_ISO_1_report.freeze.json (valid JSON, frozen_before_path_search
    =true, rate_iso_1_pass:null) is undeclared in manifest.json artifact_paths
    and unarchived; freeze obligation not certifiable from the snapshot.
  - >-
    RT-130-O2/O-6: Both controls void — planted_path_recovered=false
    (path_edges=[], n_hops_planted=0) and plant_detected=false (plant
    injected into a zero-signal cell; C_path_reported=0, C_path_recomputed=0,
    predicate false by construction). BFS explored zero edges on every cell
    (heur_edges_expanded=0), so all R_xfer=0.0 are censorship placeholders.
  - >-
    RT-130-O4: C_special model inverted for the anomalous planted family
    (modeled 7856 vs true Smart cost ~O(log p) ~ 20 ops); recomputation with
    the true cost flips the control to PASS (R_xfer ~ 0.047 < 0.7). C_special
    must be calibrated against true Smart/MOV attack cost.
  - >-
    RT-130-O5: No per-attempt x inverse-success-probability term in the
    transfer accounting; R_xfer is deterministic-cost-only and must either add
    the factor or declare deterministic-only.
  - >-
    RT-130-O3: rate_iso_1_pass:false / rate_iso_1_fraction_R_ge_1=0.0 are
    gate-hold numbers over 21 censored rows; they must not be aggregated into
    HEUR-ISO-1 or H-DS-001 (S1_met) negative evidence.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No durable finding results from this batch: the only run crashed
      (EXIT:1) with a corrupt declared artifact and both positive controls
      void, so there is no admissible measurement to promote in either
      direction. A KN-FIND entry would be a fabrication from censorship
      placeholders (AGENTS.md rule 9); the correct artifact is a gated
      repair/rerun task, not a corpus finding.
  forbid:
  - sub-rho_claim
  - support_H_IT_001
  - S1_met
  - lane_death
  - asymptotic_promotion
  - launder_into_H_DS_001
  rationale:
  - >-
    VAL-20260801-129 NOT_ADMISSIBLE with blocking D-1..D-4: corrupt required
    artifact, undisclosed EXIT:1 crash, incomplete durable snapshot, unarchived
    density freeze. The package is not admissible as completed_valid evidence.
  - >-
    RT-20260731-130 BLOCKING x2 + HIGH x3: (1) crashed run archived as
    completed_valid; (2) both controls void so the zeros are uninterpretable
    censorship placeholders, not negative evidence; (3) rate_iso_1_pass:false
    over censored rows is a laundering route into HEUR-ISO-1 / H-DS-001 S1_met;
    (4) C_special model inverted — the planted control flips to PASS at the
    true Smart-attack cost; (5) no per-attempt x inverse-success-probability
    bookkeeping.
  - >-
    AGENTS.md rule 5: a crash / implementation failure is an evidence-integrity
    failure, NOT a mathematical result. With zero admissible measurement there
    is nothing to support, weaken, or reject; the correct transition is
    inconclusive for the scientific question and failed_infrastructure for the
    run.
  - >-
    H-IT-001 remains specified: the first execution attempt was void; the
    hypothesis is neither supported nor refuted, and the censored zeros must
    not be interpreted as negative evidence or lane death.
  - >-
    knowledge_promotion not_warranted: a crashed, control-void, fully-censored
    run yields no durable finding; the fix is a gated repair/rerun task, not a
    corpus entry.
  limitations:
  - Toy claim ceiling only; EV-IT-001 asserts nothing about crypto-scale
    behavior or about any asymptotic exponent.
  - The R_xfer=0.0 / rho_special=0 values carry no measured transfer content;
    the 28-bit rho_special=0 is a ~0.16% sample estimate (847,433 of
    536,870,923) without confidence bounds and must not be quoted as a density.
  - >-
    The run's failure modes (Sage Integer serialization, dead BFS code path,
    control-design weaknesses) are infrastructure defects; their fix is a
    precondition for any future H-IT-001 evidence, not evidence itself.
  - >-
    Validator and Red Team review sessions resolved to
    opencode/deepseek-v4-flash-free with recorded degraded_requirements for
    review-adversarial; recorded honestly and not a basis for this
    disposition.
  next_actions:
  - >-
    Exact next action: Coordinator issues a gated repair/rerun task for
    EXP-IT-001 v3 (RUN-IT-001-*) that fixes, concretely: (1) Sage Integer ->
    int() casts at run_bounded_toy.sage.py line 746 (heur_report['version']
    and every other Sage Integer leaking into json.dump) so all declared
    artifacts are valid JSON, with crash/exit codes recorded as protocol
    deviations; (2) a working BFS whose neighbor enumeration explores nonzero
    edges (C_search > 0 on at least some cells); (3) a recoverable planted-path
    positive control (H_min >= 1, non-empty path_edges, endpoint != start)
    before any sub-rho reading; (4) C_special calibrated against true Smart/MOV
    attack cost so the anomalous control passes at ~O(log p) (~20 ops);
    (5) a null plant injected into a cell with nonzero honest cost;
    (6) a per-attempt x inverse-success-probability term in the transfer
    accounting, or an explicit deterministic-only declaration; and (7) a
    complete durable snapshot of all 12 manifest-declared paths plus
    HEUR_ISO_1_report.freeze.json (command.txt, environment.json, stdout.log,
    stderr.log included). RUN-IT-001-bounded-toy is reclassified
    failed_infrastructure (EV-IT-001); H-IT-001 stays specified; claim ceiling
    toy; no promotion; no lane-death claim. Regenerate the dispatch plan after
    this ledger commit and admit the rerun Executor only after this archive
    verifies.
  - >-
    Follow-up (separate ledger commit): GOAL-ECDLP-001 next_action bind for
    the IT lane, acknowledging the failed_infrastructure disposition and the
    gated rerun as the single next action.
  decided_by: coordinator
  decided_at: '2026-08-01'
