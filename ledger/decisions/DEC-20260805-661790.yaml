      - Unconditional (no H-PSEUDO dependence). Scoped: identification task, not
        IC-complexity; adaptive multi-query orders explicitly out of scope.
      - Proof-architecture audits (baseline reproduction, observation collision
        with random-hash control, quantifier order, method ceiling) included.

