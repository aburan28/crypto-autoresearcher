  ranking_rationale: >
    DUTY TO RANK, recorded. The three open ECRANK ideas
    (ecc_priority.py --open-ideas --area ECRANK) were ranked against
    GOAL-ECRANK-002's live completion criteria (C1 OPEN, C2 OPEN):
    (1) IDEA-20260829-173a32, DESIGNED NOW. It is the only one of the
    three that produces the number C2 names - the base rank needed for
    31 at k = 3 derived from the measured coset structure - and it
    tests C1's feasibility with the base curves whose existence was the
    goal's own recorded resume precondition (EV-ECQ-0d142e certified
    rank-12/13 bases post-date the pause). It measures the assumption
    H-ECRANK-f2a2f7 itself flags as 'THE ASSUMPTION MOST LIKELY TO BE
    WRONG'. prio=high, declared in the proposal. (2)
    IDEA-20260905-9f7bc1 (weighted character-support compression) is
    next: its first gate is cheap and synthetic, but its real yield
    consumes certified twist-rank witnesses of exactly the kind this
    experiment produces, so it is best designed once the 8156f9 table
    exists. (3) IDEA-20260829-c7472b (trust-surface audit) is a cheap,
    high-leverage control-class audit of the 'unconditional' wording
    in EV-ECQ-0d142e; prio=medium, designed after 9f7bc1. The other
    337 open ECC ideas of other areas remain ranked behind this goal's
    open work under the ECC-first ordering; nothing here licenses
    dispatching unranked work.
  completeness_checklist:
    objective_with_decidable_outcomes: present (M-A..M-D, each with positive and negative outcome classes)
    inputs: present (mechanism source, solver, six committed input paths with roles, frozen 32-base set by explicit rule, frozen support, alarms, subsample, seeds, stated exact facts F1-F5)
    controls: present (C1 regression stop-condition, C2 null class, C3 degeneracy, C4 censoring audit, C5 selection over cosets, C6 mixed certificate kinds, C7 synthetic known-answer optimiser controls, C8 replay)
    independent_variables: present (base curve, rung k, alarm, certificate column)
    metrics: present (primary P1_best_k3, P2_beta, P3_Rstar, P4_best_k4, regression_status; secondary ledger complete)
    seeds_and_replication: >
      present (frozen seed 20260909 for bootstrap and permutation;
      full coset enumeration, no sampling of the search space; R4
      fresh-process replay; 32 independent base instances in two arms)
    budget: present (4 runs, per-run wall-clock table R1 7200 / R2 130000 / R3 90000 / R4 3600, 56 CPU-hour worst case advisory, 8 GB, 8 workers, 4,512 descent ceiling)
    stopping_and_invalidation: present (R1 stop condition, no-early-stop on prediction mismatch, 80 percent censored-arm rule, per-control invalidations, spec-defect rule)
    success_and_falsification: present (G1-G5 decidable; five falsification conditions each closing only its declared scope)
    required_artifacts: present (run schema, F1-F5 re-verification, per-run raw tables, best-coset certificates with independent verifier output, replay diff, execution report)
  non_circular_grounding: >
    Every rank entering a coset sum is a committed exhibited-point
    lower bound from a named committed file; the regression control
    (R1) verifies the whole pipeline against the committed degree-8
    control (total 20) before any new reading is taken; the exact
    column never uses floating point; the regulator-assisted column
    labels its weakness per class and the rung carries the weakest
    kind. No number in the pre-registered predictions is backed by a
    recalled external source.
  quantifier_order_freeze: >
    The existential (E, V) claim is over the frozen finite search
    space declared before the run; the separability estimate is a
    conditional mean over the tested sample and must not be stated
    with the existential's quantifiers (contract clause, carried from
    the proposal's proof_search_map).
  scope_guards:
  - NOTHING HERE IS A CLAIM ABOUT RANK OVER Q; the d = 1 term is the only over-Q content and it is the committed base certificate.
  - A shortfall at k = 3 is a property of the frozen enumerated search space and the alarm budget, stated with its denominator, never a proof of unreachability.
  - The 80 percent censored-arm rule converts heavy timeout into an infrastructure outcome, never a mathematical negative (core rule 3).
