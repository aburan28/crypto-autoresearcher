    A follow-on session with shell access minted DEC-20260825-dc4fb8 via
    `tools/allocate_id.py --next coordinator_decision --date 20260825`,
    confirmed it free with `--check`, and substituted it here and in every
    cross-reference (batch.yaml controlling_decision, dispatch_queue.json
    opening_decision_id, goal.yaml next_action_note) in one control-plane
    edit before staging.
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-90392b
  recorded_at: '2026-08-25'
  recorded_by: coordinator
  decision: open_successor_repair_batch
  decision_label: OPEN
  disposition: bounded_static_repair_and_review
  context: >-
    BATCH-718595 closed as scoped REVISE (DEC-20260824-4a4dbc): J1 PASS, J2
    PASS, J3 REVISE with five material objections RT-J3-O8 through RT-J3-O12
    naming four repair groups (operation effect-class/host-binding
    provenance, recursive PB-3/resource composition, executable CT-1..CT-5
    semantics, and the dependent-action registry). GOAL-ENDO-001's next_action
    authorizes exactly one new bounded, nonautomatic Coordinator-approved
    static successor to close those four groups and obtain a fresh
    independent J3 review. This decision opens that fifth-generation
    successor batch and nothing beyond it.
  target_ids:
    - GOAL-ENDO-001
    - BATCH-90392b
    - BATCH-718595
    - EXP-JINV-bd141d
    - DEC-20260824-4a4dbc
    - EV-JINV-62b878
    - TASK-20260825-74615f
    - TASK-20260825-747a58
    - TASK-20260825-0d566b
    - TASK-20260825-306cc8
    - TASK-20260825-d4617b
  rationale:
    - >-
      GOAL-ENDO-001's committed next_action is the sole authority for opening
      this batch: it names the exact four repair groups and the exact five
      objection IDs (RT-J3-O8 through RT-J3-O12) this batch's single
      executor task is scoped to close, and it requires rerunning the 81
      existing controls plus the five newly named controls (nested-PB3,
      zero-baseline CT-4, CT-5 signedness, unlisted-action, host-binding)
      before a fresh independent J3 review.
    - >-
      J1 and J2 already PASSED in BATCH-718595 (VAL-20260824-9eeff7) and are
      not reopened; this batch's validator task is scoped to confirming
      that PASS is undisturbed, not to re-litigating custody or
      preservation. Only J3 requires new repair and new review, consistent
      with docs/task-lifecycle.md's rule that a scoped negative or REVISE
      narrows, rather than reopens, the whole prior package.
    - >-
      All five objections land in the same two static contract documents
      (the J3 repair contract and its control-formula manifest), so one
      executor task with two closely related deliverable files is bounded
      and sufficient; splitting further would fragment one coherent schema
      closure across artificial write-scope boundaries.
    - >-
      Per AGENTS.md's review architecture and this campaign's own precedent
      (BATCH-718595's review-plan), an ordinary planning-gate repair is
      routed to review-adversarial/xhigh (validator + red-team), not
      review-breakthrough: nothing in this batch claims a breakthrough,
      closure, or contradiction of prior validated evidence: it is a static
      governance repair.
  evidence_refs:
    - DEC-20260824-4a4dbc
    - EV-JINV-62b878
    - coordination/goals/GOAL-ENDO-001/batches/BATCH-718595/reviews/TASK-20260824-4927cd/red-team-report.yaml
    - coordination/goals/GOAL-ENDO-001/batches/BATCH-718595/reviews/TASK-20260824-9eeff7/validation-report.yaml
    - ledger/goals/GOAL-ENDO-001/goal.yaml (next_action field)
