  repair_requirements:
    - Close operation_effect_class into one enum with an explicit non-host value; reject every other value.
    - Bind the active host/filesystem identity to an immutable runtime-session-receipt field, never to caller-supplied observation input.
    - Recursively close every PB-3 nested model key, formula operand, residual, unit, and cap; reject any unknown or unbound nested field at every nesting level, not only the top level.
    - Define per-CT and total resource composition with an explicit schedule/concurrency aggregation rule, a total bootstrap cap, and host-demand-versus-observation inequalities.
    - Make CT-1 through CT-5 executable: unique record schema, event predicate, pairing/duplicate keys, one named interval algorithm with defined endpoints, pinned bootstrap PRNG/resampling/interpolation, positive timing denominators, and explicit signedness.
    - Close the dependent-action registry into one enum; STOP on any unlisted action label before dispatch.
    - Rerun the existing 81-control matrix plus nested-PB3 escape, zero-baseline CT-4, CT-5 signedness, unlisted-action, and host-binding-forgery controls.
  next_actions:
    - Execute BATCH-90392b only through its frozen five-task queue and Coordinator archive tasks, in dependency order, under max_concurrent 2.
    - Require fresh independent validator (J1J2-continuity-undisturbed) and red-team (J3-fifth-generation-closure) review before any scoped disposition.
    - Keep resource_incomplete and all official statuses unchanged unless a later Coordinator decision has separate evidence.
  dominated_by:
