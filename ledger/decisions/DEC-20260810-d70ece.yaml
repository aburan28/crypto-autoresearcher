  limitations:
  - >-
    THIS DECISION RESTS ON ONE EXECUTED CONTRACT THAT DID NOT REACH AN OUTCOME
    STATE. Nothing in it may be read as a statement about isogeny-class
    invariance, about RQ-ICINV-475b5e, or about the campaign's headline finding.
    One of four invariant families was computed, on the class only, with no
    control set and no resolution-derived quantity.
  - >-
    THE D1 PRECONDITION MAY NOT BE SATISFIABLE. Whether Macaulay2 or standalone
    Singular can be installed on this execution host was NOT tested by this
    Coordinator, which has no shell in this session. If the acquisition fails,
    route (b) leaves EXP-ICINV-e0cd8f permanently unexecutable as written, and
    the successor named in the rationale -- a new, narrower, freshly
    pre-registered contract -- becomes the live option. That is a real cost of
    the route chosen and it is not hedged.
  - >-
    THE S_4 STRATIFICATION AND THE msolve DEGREE DEMONSTRATION ARE
    VALIDATOR-DERIVED AND UNREPLICATED. They were computed by one independent
    session, on one curve (msolve) and over QQ[a,b] (the stratification), under
    no frozen contract and with no run record of their own. This decision relies
    on them for adjudication and correction, which is appropriate for a review
    finding, and does NOT promote them to findings of the campaign.
  - >-
    THE RUN DRIVER WAS NOT RE-EXECUTED BY THE VALIDATOR, which re-derived values
    instead. A defect in harness/exp_icinv_e0cd8f/run_gate.py that happens to
    produce correct values is not excluded by anything this decision relies on.
  - >-
    THIS COORDINATOR HAS NO SHELL. It could not run tools/allocate_id.py --check,
    tools/validate_ledger.py, or any git command. All four identifiers used here
    were pre-allocated and pre-verified by the dispatching session; the YAML has
    not been machine-parsed by this Coordinator; the driving session must
    parse-check, --check the identifiers, and run the origin/main merge before
    the archive.
  - >-
    BATCH-d7e255 REMAINS OPEN and one of its four contracts has executed. The
    write-once opening checkpoint shard
    ledger/goals/GOAL-ENDO-001/checkpoints/BATCH-d7e255.yaml is NOT edited by
    this decision and no closing shard is written, because the batch is not
    closed. The goal-head next_action edit archived with this decision is this
    ledger archive's checkpoint of record.

  next_actions:
  - >-
    NA1. MERGE origin/main INTO THE WORKING BRANCH FIRST (merge, never rebase),
    then ledger-archive EV-ICINV-6b6264, DEC-20260810-d70ece,
    CORR-20260810-7cf0e9, CORR-20260810-eb9062 and the GOAL-ENDO-001 goal-head
    edit in ONE isolated Coordinator commit staging only those declared paths.
    Push the branch and open or refresh the PR against main naming those four
    records and BATCH-d7e255. A record that exists only in a local commit is
    unpublished, not durable evidence. Record the base commit checked and the
    merge outcome in the archive receipt.
  - >-
    NA2. Parse-check every file written here with tools/validate_ledger.py and
    confirm all four identifiers with `python3 tools/allocate_id.py --check`
    before that commit. This Coordinator had no shell and could do neither.
  - >-
    NA3. D1 ROUTE (b) IS IN FORCE. Do NOT file a protocol_amendment for
    EXP-ICINV-e0cd8f. Do NOT re-dispatch it until a genuinely independent
    minimal-free-resolution backend over F_p -- Macaulay2 or standalone Singular
    -- is present on the execution host and recorded by exact version in a fresh
    backend-provenance probe. THAT ACQUISITION IS AN INFRASTRUCTURE TASK, NOT A
    RESEARCH TASK: it produces no evidence, moves no hypothesis, and its own
    failure is an infrastructure receipt. If it succeeds, the frozen contract is
    re-dispatched UNCHANGED and criterion (3) is met as literally written.
  - >-
    NA4. IF AND ONLY IF the acquisition in NA3 fails, the successor is a NEW
    pre-registered contract under a new identifier -- not an amendment to this
    one -- whose primary families are restricted IN ADVANCE to those an
    independent engine on the actual host can cover, authored before any of its
    data exists and by a session that has not read the runs. Named as the live
    option, not selected and not scheduled here.
  - >-
    NA5. INFERENCE-POLICY CORRECTIVE, HARNESS LEVEL, EFFECTIVE FOR EVERY FURTHER
    GOAL-ENDO-001 DISPATCH. Launch worker sessions from `eval "$(python3 -m
    orchestration.adapter env --runtime claude_code --backend <backend> --role
    <role>)"` and record the OBSERVED AUTORESEARCH_POLICY and AUTORESEARCH_BACKEND
    in the handoff at activation, before the worker starts; treat an unset
    AUTORESEARCH_POLICY at worker start as a dispatch defect owned by the
    dispatching session; and never assert `fallback_allowed: false` into an
    environment known to be unable to honour it. File the adapter resolve()
    API-signature mismatch as a separate maintenance task.
  - >-
    NA6. NEXT DISPATCH IS TASK-20260810-c98659, EXP-INSTR-36c8cf PHASE A. It was
    never blocked by this task scientifically and is not blocked by its outcome.
    IT IS GATED ON HOST LOAD: the host has 14 cores and recorded load averages of
    51.08 / 50.05 / 48.10 at the s0 probe and 43.77 / 47.15 / 47.15 at s1. A
    statistical contract cannot be run honestly at that oversubscription --
    EXP-ICINV-e0cd8f survived it only because every one of its outputs is an
    exact symbolic invariant that contention cannot corrupt, which is NOT true of
    a sampling instrument whose wall-clock and seed-count budgets are part of
    what it measures. Dispatch when load has dropped enough to run the declared
    budget without degradation; a degraded run is an infrastructure event, never
    a null result. Concurrency stays at 1 for this batch.
  - >-
    NA7. WHENEVER A SUCCESSOR CONTRACT IN THIS LANE IS WRITTEN, it must: compute
    the singular locus on the UN-HOMOGENISED ideal and report the affine and
    homogenised values DISTINCTLY, both labelled (CORR-20260810-eb9062); obtain
    singular-locus degree by a route that exists, since Sage 10.9's
    MPolynomialIdeal has no `.degree()` method, the sibling of the recorded
    `.betti()` gap; anticipate that the elimination family may reduce to the
    splitting type of x^3 + a x + b and say so before execution; and pin the
    preparser-generated .sage.py alongside the .sage file it executes.
  - >-
    NA8. CARRIED FORWARD UNCHANGED AND UNRESOLVED BY THIS DECISION: N7
    (RQ-CANL-63098f still under-populated with no executed experiment), N10
    (EXP-ICINV-4d33aa paused, second INVALID termination, awaiting the SR3 v3
    amendment file), N11 (the two_torsion_x lead, flagged not claimed, needs a
    cheap control first) and N12 (done, DEC-20260809-4081cc / EV-INSTR-ffbb5a,
    and NOT sufficient for criterion C4 on its own). DEFER-BATCH009-001 remains
    OPEN under GOAL-ECDLP-001. experiments/EXP-ICINV-4d33aa/amendments/v3.yaml
    remains unwritten and is required before any successor run there. The cause
    of the density-independent within-class over-dispersion remains the
    campaign's highest-priority open question and is untouched here.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NO KNOWLEDGE PROMOTION IS WARRANTED, AND THE REASON IS CONCRETE RATHER THAN
      PROCEDURAL. The promotion gate fires on a `support` or `reject_scoped`
      decision backed by `replicated` or `strong` evidence; this decision is
      `pause` and EV-ICINV-6b6264 carries strength `inconclusive` for
      H-ICINV-d5e351, so the gate does not fire. On the substance: the two
      exactly-reproduced facts are (i) a re-verification of an already-committed,
      already-certified census and (ii) the contract's own DERIVED pre-registered
      prediction, neither of which is a new durable claim. The one genuinely new
      and durable mathematical object here -- the six-locus j-line degeneration
      stratification of S_4, with a^3 + 8b^2 over QQ giving j = 1728 * 32/5 -- is
      a strong candidate for KN-FIND, but it was derived by a single reviewing
