coordinator_decision:
  id: DEC-20260810-d70ece
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-d7e255
  experiment_id: EXP-ICINV-e0cd8f
  task_id: TASK-20260810-ab0a07
  evidence_id: EV-ICINV-6b6264
  decided_by: coordinator
  decided_at: '2026-08-10'

  context: >-
    EVIDENCE-REVIEW DECISION FOR TASK-20260810-ab0a07, the first executed task of
    GOAL-ENDO-001 BATCH-d7e255. EXP-ICINV-e0cd8f was approved as a frozen
    pre-registration by DEC-20260810-a4bec4 and dispatched under
    TASK-20260810-ab0a07. It produced two runs, RUN-ICINV-e0cd8f-s0 and -s1,
    snapshot-archived at a15347ffa; an independent validating session recorded
    VAL-20260810-dc8bd8 (verdict `passed`), archived at a76673596.

    WHAT ACTUALLY HAPPENED. Both runs passed SR1 (support gate) and SR2 (census
    gate) and then terminated at SR3, the backend gate, with run_status
    failed_infrastructure and failure_class infrastructure_error. NO IDEAL WAS
    BUILT -- ideals_built 0, resolutions_computed 0 -- so three of the contract's
    four primary invariant families and the entire 138-curve control set were
    never computed, and NEITHER FROZEN VERDICT (CLASS-INVARIANT / CLASS-VARYING)
    WAS EMITTED. Under AGENTS.md rule 5 that is infrastructure signal, never a
    negative mathematical result and never evidence that any Semaev invariant is
    constant.

    THIS DECISION THEREFORE DOES FIVE THINGS AND NOTHING ELSE: it records
    EV-ICINV-6b6264 as the receipt for what the runs do and do not establish; it
    resolves D1, the SR3 C-BACKEND stop the Executor escalated; it resolves D4,
    the inference-policy divergence; it records two corrections
    (CORR-20260810-7cf0e9, CORR-20260810-eb9062) and one in-decision correction
    that no correction record can carry because the artifact is immutable; and it
    sets exactly one next action on GOAL-ENDO-001. IT ADJUDICATES NO HYPOTHESIS
    AND MEETS NO COMPLETION CRITERION.

  decision: pause

  decision_scope: >-
    `pause` IS SCOPED TO THE EXECUTION OF EXP-ICINV-e0cd8f AND TO NOTHING ELSE.
    The contract remains APPROVED, FROZEN AND UNAMENDED at version 1; it is not
    withdrawn, not closed, not superseded and not re-dispatched. Execution pauses
    on a NAMED, CHECKABLE INFRASTRUCTURE PRECONDITION stated in the D1 rationale
    below. This decision does NOT pause BATCH-d7e255 -- TASK-20260810-c98659
    (EXP-INSTR-36c8cf Phase A) is the next dispatch and is not blocked by this
    task, per the dispatching handoff's own dependency_note. It does not change
    any hypothesis status, does not adjudicate RQ-ICINV-475b5e in either
    direction, and is not an `inconclusive` verdict about the mathematics: the
    evidence is inconclusive FOR H-ICINV-d5e351 because three quarters of the
    contract never ran, not because two explanations competed and could not be
    separated.

  target_ids:
  - GOAL-ENDO-001
  - BATCH-d7e255
  - EXP-ICINV-e0cd8f
  - TASK-20260810-ab0a07
  - EV-ICINV-6b6264
  - CORR-20260810-7cf0e9
  - CORR-20260810-eb9062
  - H-ICINV-d5e351
  - RQ-ICINV-475b5e

  rationale:
  - >-
    VALIDITY BEFORE INTERPRETATION, PERFORMED FIRST AND NOT DELEGATED TO THE
    REPORTS. Expected run count: 2 of a declared maximum 8, both present with all
    15 contract-required artifacts plus two declared extras. Manifests: schema
    complete, 7 executed source files pinned by sha256,
    check_run_source_provenance.py --strict passing, code.dirty false. Seed
    integrity: the single contract seed 20260810 appears in manifest.inputs.seed,
    in gauge-recheck.json and as control-set-invariants.json:seed_reserved, and
    it governs only the gauge units and the never-drawn control set. Raw/summary
    agreement: this Coordinator read verdict.json, backend-provenance.json and
    both environment.json files DIRECTLY and confirmed they agree with the
    execution report on every figure it re-states -- with one exception, which is
    CORR-20260810-7cf0e9. Control comparability: THERE IS NO CONTROL. The run set
    is therefore VALID AND ADMISSIBLE only for the enumeration and support facts
    recorded in EV-ICINV-6b6264, and it is not returned to the Executor, because
    its defects are not defects in what it claims.
  - >-
    D1, THE SR3 C-BACKEND STOP -- THE STOP IS CORRECT AND IT IS NOT SELF-SERVING.
    C-BACKEND and success criterion (3) require a SECOND, INDEPENDENT
    computer-algebra backend agreeing on at least 20 curves. The independent
    validating session performed its OWN adversarial binary inventory: M2,
    macaulay2/Macaulay2, standalone Singular, magma, cocoa, gap, maple and
    mathematica all return nothing from `command -v`; the Singular bundled inside
    SAGE_ROOT does compute minimal free resolutions but is the same installation
    and, for resolutions, the same engine Sage itself calls, so it is a second
    CODE PATH and not a second BACKEND; PARI/gp computes no resolution. GRADED
    BETTI NUMBERS HAVE NO INDEPENDENT ENGINE ON THIS HOST AT ALL -- they are not
    determined by the initial ideal, so no Groebner engine can supply them by
    post-processing -- and that single fact makes criterion (3) unmeetable. Three
    separable reasons make the stop non-self-serving: it was PRE-RECORDED BY THIS
    COORDINATOR IN THE HANDOFF BEFORE DISPATCH (second_backend_note, which
    instructed the Executor to raise it at SR3 rather than work around it); it
    COST the Executor the entire deliverable and returned a failed_infrastructure
    receipt; and the gate condition is objectively true and was verified
    independently.
  - >-
    D1 ROUTE CHOSEN -- (b) RECORD failed_infrastructure AS-IS AND LEAVE THE
    CONTRACT UNAMENDED. No protocol_amendment is filed for EXP-ICINV-e0cd8f under
    this decision or as a consequence of it. The deficiency is in the HOST, not
    in the protocol: the contract asks for a cross-check that is standard,
    cheap and entirely reasonable, and the execution machine does not have the
    software to provide it. AGENTS.md rule 5 says an implementation failure is
    infrastructure signal; the corrective for infrastructure signal is to fix the
    infrastructure. THE NAMED PRECONDITION FOR RE-DISPATCH, CHECKABLE AND SET
    BEFORE ANY FURTHER DATA EXISTS: a genuinely independent engine computing
    minimal free resolutions over F_p -- Macaulay2 or standalone Singular --
    installed on the execution host and recorded by exact version in a fresh
    backend-provenance probe. With that present, criterion (3) is met AS
    LITERALLY WRITTEN, the frozen contract runs unchanged, and nothing was
    loosened after data.
  - >-
    WHY NOT (a), AN AMENDMENT TO C-BACKEND / CRITERION (3) -- THREE REASONS, THE
    SECOND OF WHICH IS THE DECIDING ONE. (i) TIMING. An amendment must be
    authored under the same freeze-before-execution discipline as v2. This
    session has read the SR1/SR2 data and the validator's S_4 stratification;
    although the data an amendment would admit (Betti, regularity, singular
    locus, elimination polynomial) does not yet exist, authoring the relaxation
    in a session that has already seen the run is a worse epistemic position than
    not needing the relaxation at all. (ii) SUBSTANCE -- AN AMENDMENT WOULD BUY A
    VERDICT WITHOUT BUYING AN ANSWER. The two metrics genuinely uncovered on this
    host, graded Betti numbers and CM-regularity, ARE the contract's d_reg
    content; an amendment that exempted exactly them would leave the verdict
    resting on the families that remain, and the evidence already in hand says
    those families are at risk of being decided by mechanisms with NO isogeny
    content -- the S_4 outlier is a j-invariant degeneration locus of the
    summation polynomial (EV-ICINV-6b6264), and the five-curve probe suggests the
    elimination family may be the splitting type of x^3 + a x + b, a function of
    E(F_p)[2] that 2-isogenies do not preserve. A CLASS-VARYING verdict reached
    that way would be true and worthless, and harder to retract than to prevent.
    (iii) COST DISCIPLINE. Installing one package is cheaper than amending a
    frozen pre-registration, and the cheaper option is also the more honest one
    here, which is rare enough to take.
  - >-
    WHAT ROUTE (b) COSTS, STATED WITHOUT MINIMISING IT. EXP-ICINV-e0cd8f delivers
    NOTHING further until the host acquires a resolution backend, and the
    acquisition may not happen. The d_reg axis of RQ-ICINV-475b5e stays
    unadjudicated; GOAL-ENDO-001 criterion C2 stays open; the two runs already
    spent yield only the enumeration and support facts of EV-ICINV-6b6264, none
    of which was in doubt (the 13-on-all-138 result is the contract's own DERIVED
    pre-registered prediction). If the backend cannot be obtained, the honest
    successor is NOT a loosened version of this contract but a NEW
    pre-registered contract whose primary families are restricted, in advance, to
    those an independent engine on the actual host can cover -- authored before
    any of its data exists and by a session that has not seen it. That option is
    NAMED here, not selected here.
  - >-
    D1 SUB-FINDING, CORRECTED IN THIS DECISION BECAUSE THE ARTIFACT IS IMMUTABLE.
    backend-provenance.json lists THREE metrics under
    `primary_metrics_with_no_independent_cross_check`:
    castelnuovo_mumford_regularity, graded_betti_numbers and
    singular_locus_degree. THE THIRD IS WRONG BY THE RUN'S OWN STANDARD. msolve
    0.9.5 supports `-g 2` and prints the full reduced grevlex Groebner basis;
    degree is a function of the initial ideal exactly as dimension is, and the
    run already credits msolve with singular_locus_dimension via the same
    staircase post-processing. The validator demonstrated it on the f_V-free
    Jacobian ideal of (a, b) = (441, 294): msolve returned the reduced grevlex GB
    [x1 + x2 + x3, x2^2 + x2 x3 + x3^2 + 441, x3^3 + 441 x3 + 294], whose leading
    monomials {x1, x2^2, x3^3} give affine dimension 0 and degree 6, agreeing
    with Sage's vector_space_dimension, with no Sage in the computation path. THE
    CORRECT COUNT IS TWO GENUINELY UNCOVERED METRICS, NOT THREE, AND THIS
    DECISION RESTS ON TWO. It does not change the outcome: graded Betti numbers
    remain uncovered, which is sufficient on its own for criterion (3) to be
    unmeetable and for the terminal stop to stand. The defect was in the gate's
    stated justification, not in its conclusion; an inconsistent standard was
    applied to two metrics of the same kind, and that is exactly the kind of
    slippage that makes a correct stop look forced. Run artifacts are immutable
    and are not edited; this paragraph is the correction of record, and any later
    citation of that JSON field must carry it.
  - >-
    D4, THE INFERENCE-POLICY DIVERGENCE -- RECORDED, AND IT INVALIDATES NOTHING
    IN THIS RECEIPT. AUTORESEARCH_POLICY was unset, so the executing session was
    not launched with the adapter-resolved environment; the adapter resolves
    executor-implementation to anthropic:claude-sonnet-5 (effort=medium) and
    claude-opus-5 answered, against a handoff that set fallback_allowed false.
    IT WAS ESCALATED AND NOT ABSORBED: both manifests carry
    inference.fallback_used true with the reason, the adapter resolution as
    independently re-run by the validator, and an honestly reported adapter_error
    for the in-process resolve() TypeError. JUSTIFICATION THAT IT INVALIDATES
    NOTHING: the validator did not accept the "no model in the loop" assertion,
    it TESTED it, re-deriving every reported number in two engines it wrote
    itself; a model that had influenced those values would have had to influence
    them into exact agreement with an independent re-derivation, which is not a
    failure mode. THE PRECISE BOUNDARY, STATED BECAUSE IT IS NOT COSMETIC: that
    defence covers the NUMBERS and not the run's CLASSIFICATIONS, which are
    judgements -- and one classification, the singular_locus_degree coverage
    call, is wrong. Judgement is exactly where the model sits, so D4 and the
    preceding sub-finding are the same event seen twice, and neither is dismissed
    by the other.
  - >-
    D4 CORRECTIVE, SET AT THE HARNESS LEVEL BECAUSE THE SAME GAP RECURRED IN THE
    VALIDATOR'S OWN SESSION AND IN THIS ONE. Three binding items for every
    further dispatch under GOAL-ENDO-001. (1) Worker sessions are launched from
    an adapter-resolved environment -- `eval "$(python3 -m orchestration.adapter
    env --runtime claude_code --backend <backend> --role <role>)"` -- and the
    dispatching session records the OBSERVED values of AUTORESEARCH_POLICY and
    AUTORESEARCH_BACKEND in the handoff at activation, before the worker starts.
    An unset AUTORESEARCH_POLICY at worker start is a DISPATCH DEFECT owned by
    the dispatching session, not a run defect owned by the worker; the current
    arrangement makes the worker discover and report the Coordinator's omission.
    (2) A handoff may not assert `fallback_allowed: false` into an environment
    that is known to be unable to honour it. If the resolved environment cannot
    be set, the dispatching session either records fallback_allowed true with its
    reason BEFORE dispatch, or does not dispatch. Writing a prohibition one
    cannot enforce and then accepting its violation is worse than declaring the
    constraint honestly. (3) The adapter's in-process resolve() API-signature
    mismatch, recorded as adapter_error in both manifests and worked around by a
    subprocess call, is a real tooling defect and is filed as its own maintenance
    task; it is not research work and produces no evidence.
  - >-
    THE S_4 OUTLIER IS ADJUDICATED AND THE ADJUDICATION BINDS FUTURE CITATION. It
    is a REAL, correctly measured, exactly characterised degeneration of the
    fourth summation polynomial that depends only on the j-invariant: 48 of 439
    coefficients carry a^3 + 8b^2 over QQ[a,b] as well as over F_4001, the locus
    is the single j = 1728 * 32/5 = 2257, it is one of six such universal loci in
    the j-line, and exactly one of the 138 class members happens to lie on it
    with no off-by-one in either direction. THE CONDITION NEVER MENTIONS THE
    TRACE OR ANY ISOGENY. The C-CONTROL-SET null was never drawn and the algebra
    supplies what it would have shown. Any later record citing the multiset
    {439: 137, 391: 1} MUST carry this characterisation; it may not be cited as a
    within-class difference, as CLASS-VARYING evidence, or as an unexplained
    anomaly. This is the validator's required correction C4 and it is adopted.
  - >-
    THE FIVE-CURVE ELIMINATION LEAD IS RECORDED AS NON-EVIDENCE AND IS ALLOWED TO
    SHAPE THE SUCCESSOR CONTRACT, NOT ANY CONCLUSION. Five curves, no control,
    not pre-registered, from a capability probe. It bears on two live questions
    and that is why it is kept: on how a successor contract is written, since a
    primary invariant family that reduces to the splitting type of the curve
    cubic must be recognised as such in advance rather than discovered in a
    verdict; and on whether the SR3 stop blocked work of value, where the honest
    answer is that it blocked work whose two cheapest families now look likely to
    be decided without Semaev content, which lowers rather than raises the cost
    of the pause. It establishes nothing on five curves and this decision draws
    no inference from it.
  - >-
    NO COMPLETION CRITERION IS MET, AND C1 IN PARTICULAR IS NOT MET BY AN
    INFRASTRUCTURE STOP -- STATED EXPLICITLY BECAUSE THE TEMPTATION IS REAL. C1
    requires, per lane, either an archived contract with an EXECUTED,
    independently reviewed run, or an archived decision closing the lane with a
    named obstruction, an argument and concrete forward guidance. A run that
    terminated at its own third gate before building an ideal is not an executed
    run in C1's sense, and THIS DECISION IS NOT A LANE CLOSURE: it closes
    nothing, names no mathematical obstruction, and pauses one contract on a
    software precondition. C2 (the RQ-ICINV-475b5e gating lane adjudicated) is
    NOT met. C3 and C4 are untouched. No attestation is recorded and no closure
    quorum is gathered or claimed; none is required, since nothing here closes a
    goal.
  - >-
    CLAIM DISCIPLINE, APPLIED UNIFORMLY. claim_tier toy on every record archived
    by this decision. NO ATTACK, NO EXPONENT, NO SPEEDUP; sota_delta ZERO on
    every axis; dominated_by parallel Pollard rho with distinguished points at
    0.886 sqrt(N) group operations and O(1) memory (KN-TECH-001, KN-TECH-006) and
    its automorphism-discounted variant on CM curves (KN-TECH-018), under which
    any factor at or below sqrt(6) ~ 2.449 is baseline calibration and never an
    attack. Every conclusion is scoped to p = 4001, t = 30, the 138-member class,
    m in {3, 4}, degrevlex and the declared grading, and cites its experiment,
    run and evidence identifiers.
  - >-
    STANDING CONSTRAINTS, NONE OF THEM MOVED BY THIS DECISION. H-ICINV-d5e351
    stays `specified`. H-ICINV-6c7920 stays `specified` and is neither presumed
    true nor false. H-ENDO-001 remains `approved` and is USED as the
    admissibility filter, not retested. H-STR-002 remains `weakened` with
    DEFER-BATCH009-001 OPEN, and pause condition P2 is respected -- this contract
    builds no equivariant factor base and tests no phi-stable structure, so
    nothing here bears on H-STR-002 in either direction. RQ-ICINV-475b5e REMAINS
    PAUSED for EXP-ICINV-4d33aa, which this decision does not touch and does not
    unpause; that lane waits on experiments/EXP-ICINV-4d33aa/amendments/v3.yaml,
    still unwritten. KN-FIND-b7e091 remains binding and unrevisited.

