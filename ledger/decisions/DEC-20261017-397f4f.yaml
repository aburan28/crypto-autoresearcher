  citations:
    - {source: ledger/proposals/IDEA-20261017-3f46a5.yaml, provenance: internal, verified_by: coordinator}
    - {source: docs/reports/2026-10-17-icperf-k11-common-target-inputs.md, provenance: internal, verified_by: coordinator}
    - {source: experiments/EXP-ICPERF-018b0c/inputs/independent_replay.json, provenance: internal, verified_by: coordinator}
    - {source: experiments/EXP-ICPERF-018b0c/inputs/sage_replay.json, provenance: internal, verified_by: coordinator}
  limitations:
    - Eight common targets are an input-feasibility pilot and cannot resolve a 1.25x base advantage.
    - Solver-reported UNSAT without independent proof, timeout, memory stop or invalid output cannot establish zero mathematical relation yield.
    - Only the ordinary-binary m=8 fixture is specified here; prime, Koblitz and m=2..7 whole-pipeline measurements remain open.
    - The two existing goal lanes occupy the max_concurrent=2 allowance, and BATCH-e261c2 has an archive-ancestry impediment; no new lane is admitted by this decision.
  next_actions:
    - >-
      Implement and bind a bounded common-target solver runner and independent
      result checker, checking the pinned binary and CLI on synthetic input.
    - >-
      Commit a complete trial plan and runbook or recorded implementation-tier
      reason, then obtain a lawful dispatch queue and goal lane. Approve only
      after newest_experiments reports execution_state ready and a separate
      Coordinator approval decision is committed.
    - >-
      Preserve the full-width m=2..8, prime/Koblitz/ordinary-binary baseline
      and matched-rho obligations in the existing problem record.
  knowledge_promotion:
    promoted: []
    not_warranted: Specification and input preparation only; no reviewed empirical finding.
