coordinator_decision:
  id: DEC-20261017-397f4f
  id_provenance: >-
    Allocated by the parent design session with tools/allocate_id.py --next
    coordinator_decision --date 20261017 and globally checked free before
    this record was drafted.
  recorded_at: '2026-10-17'
  decided_at: '2026-10-17'
  decided_by: coordinator
  goal_id: GOAL-ICPERF-e6b6a4
  question_ids: [RQ-ICPERF-94c86e]
  mode: design_experiment_specification
  kind: hypothesis_specification
  context: >-
    IDEA-20261017-3f46a5 proposes a bounded ordinary-binary k11
    candidate/control pilot on the certified GF(2^61) fixture. The two
    target-blind 316-column bases predate the eight common public subgroup
    targets. Deterministic preparation has produced and independently replayed
    64 natural seven-link XCNF inputs, 32 raw channels and two separately
    planted positive inputs. The experiment has no common-target solver trial,
    natural relation or complete-cost observation.
  decision: revise
  decision_scope: >-
    Select IDEA-20261017-3f46a5 for a finite-cap instrument test and specify
    H-ICPERF-195806 at its exact GF(2^61), m=8, B=316 boundary. Retain
    EXP-ICPERF-018b0c as review_required, approved_by null,
    execution_authorized false and frozen false. This decision does not approve
    the experiment, open a goal lane, dispatch a task, authorize solver trials
    or infer factor-base superiority or end-to-end speed.
  target_ids:
    - GOAL-ICPERF-e6b6a4
    - RQ-ICPERF-94c86e
    - IDEA-20261017-3f46a5
    - H-ICPERF-195806
    - EXP-ICPERF-018b0c
  rationale:
    - >-
      The proposal directly tests whether prepared elite-base equations can
      reach exact solver-to-point certificates at the requested 60-bit
      subgroup scale, using an equal-column local-random control and the same
      base-independent target schedule. It is a justified next instrument
      gate before any powered base comparison.
    - >-
      The hypothesis states a finite-cap prediction and distinct positive,
      negative and censored interpretations. Four raw lifts count as one
      subgroup target; repeated signs and torsion presentations cannot be
      promoted to useful independent relation rows.
    - >-
      Input preparation and independent replay close the target/formula
      correctness subtask. They do not establish CryptoMiniSat behavior under
      the proposed cap, natural relation yield, rank, linear algebra, target
      recovery, matched rho or complete index-calculus cost.
  input_preparation:
