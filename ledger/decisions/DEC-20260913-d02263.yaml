  rationale: >-
    THE FIRST THING TO RECORD IS A COST, NOT A GAIN. This program's mechanism lane has
    been working a coset-typed-factor-base idea built on Galbraith-Gebregiyorgis
    2014/806: disjoint cosets applied to Semaev's chained S_3 system, to remove the 1/m!
    decomposition-yield factor. That is Nagao 2015/984 Section 7 in full, published, and
    its opening sentence credits the construction to the author's own 2013/548 while
    saying 2014/806 "recently re-discovered" it. So the lane is a rediscovery of a
    rediscovery, and IDEA-20260913-352163 carries novelty_status: known accordingly.
    This was discoverable at any point from 2026-07-24 onward by reading an entry the
    program already had; what the program had instead was a title. The lesson is
    recorded in the limitations block below rather than absorbed.

    WHAT MAKES IT A RESEARCH LANE ANYWAY. Nagao's execution of the shared idea has an
    unproven step at exactly the point this program was independently uneasy about.
    Theorem 1 -- ECDLP over F_{2^n} in O(n^{8w+1}), polynomial, and the author's own
    ePrint keyword is "polynomial time algorithm" -- follows from Proposition 5, which
    asserts that the degree-4 first-fall-degree bound survives the affine coset shift,
    and which is stated with the proof omitted: footnote 6, verbatim, "The situation is
    the same as the Semaev's case. So, we omit the proof." It is not obviously the same
    case. The shift makes the Weil descent affine rather than linear, Nagao's own
    footnote 1 concedes the shift enters the descent definition, and Semaev's Section 4.4
    separately records d_F4 exceeding 4 once k > ceil(n/m). Affine invariance of a degree
    bound is decidable on matched (v = 0, v != 0) pairs by degree-4 GF(2) Macaulay rank
    -- no Groebner basis -- which DEC-20260913-47bbb7 established fits in budget. A
    negative result there is as valuable as a positive one, because Theorem 1 has no
    other support.

    WHY THE COSTING GOES FIRST. IDEA-20260913-41c4f0 is ranked ahead of 352163 for two
    reasons that are both about dependencies rather than about importance. It needs
    nothing: no Weil descent, no algebra engine, no curve beyond an exact enumeration at
    n <= 20. And its ARM C is a closed-form check on Nagao's own parenthesis -- "if one
    takes k = 1, it sometimes happens #Fb_i = empty ... we choose suitable constant C_0"
    -- which, if the coupon-collector condition forces C_0 = Omega(log n), refutes
    Theorem 1's polynomiality from the paper's own footnote with no computation at all,
    and independently of Proposition 5. Cheapest possible falsification, so it runs
    first.

    WHAT THE CONTRACT INHERITS FROM THE REVIEW ROUND THAT JUST CLOSED. Three findings of
    REVIEW-SEMBIN-20260913-9d649f are designed in rather than rediscovered.
    O-6 and O-7: the baseline is charged at the Pareto minimum of its own time-memory
    curve, not at a single operating point, because charging vOW the memory of a
    2^30-point store and the time of one processor overcharged it by exactly 29.0 bits at
    four labels and correcting it moved the crossover 85 in n. O-9: the deliverable is a
    SURFACE from the start, and a single crossover number is declared unacceptable,
    because the parent contract's own framing-failure condition fired on precisely that.
    And the ARM I blind re-implementation exists because TASK-20260913-ec11c4's
    disagreement (306 against 375) turned out to trace to the review plan's own parameter
    block giving a row width where it said variable count -- a defect no recomputation
    from the producer's artifacts could have found.

  ranking:
    - >-
      1. EXP-SEMBIN-db9bc3 (this decision). Ranked first among new work because it is
      unblocked, because ARM C is the cheapest available refutation of a published
      polynomial-time claim, and because it reuses validated machinery so its marginal
      cost is small. ECC area, so it precedes all non-ECC work at this selection point.
    - >-
      2. IDEA-20260913-352163's contract, once TASK-20260913-701b50 lands the Weil
      descent. Higher scientific value than 1 and lower readiness; designing it now and
      dispatching it on the dependency is the correct order, and designing is not
      approving.
    - >-
      3. Reading Nagao 2013/548 and 2013/549. 2013/549 carries Lemma 3, which is what
      licenses using the fake first fall degree in place of the true one, so the
      instrument 352163 builds rests on a lemma proved in a paper nobody here has read.
      Ranked below 1 and 2 because Lemma 4's inequality d_F <= d'_F is the only direction
      needed and it is derived in the text that WAS read.
    - >-
      4. Not ranked and not dispatched: any attempt to extend Nagao's construction before
      Proposition 5 is tested. Building on an unproven step is how a program spends a
      budget on an artifact.

  what_was_not_done_and_why:
    - >-
      NO EXECUTOR WAS LAUNCHED FOR EXP-SEMBIN-db9bc3 IN THIS DECISION. The batch is at
      its declared max_concurrent of 2, with TASK-20260913-80bae1 and TASK-20260913-4df669
      both in flight. The queue's own max_concurrent_basis records why that number is 2 --
      4 CPUs and ~6 GB free, two producers plus this coordinator -- and cites GOAL-AES-003
      BATCH-002 (DEC-20260802-b226fb) for the measured cost of dispatching more producers
      than a machine has headroom for. Raising the cap to launch a third immediately after
      recording that basis would be the same error. TASK-20260913-495fcc is therefore
      queued, not launched, and dispatches when a lane frees. Both in-flight runs have
      written complete manifests, so the wait is expected to be short; their lanes are
      released on their return and not from their artifacts, which is the distinction
      CORR-20260913-bb05b0 exists to enforce.
    - >-
      NO CONTRACT WAS WRITTEN FOR IDEA-20260913-352163 TODAY. Its dependency is declared
      and approved but not built. A contract whose instrument does not exist cannot state
      an honest budget or stopping rule.
    - >-
      THE PRIORITY QUESTION BETWEEN NAGAO 2013/548 AND GALBRAITH-GEBREGIYORGIS 2014/806
      IS LEFT OPEN. 2015/984 asserts it; neither cited paper is frozen here; and a
      priority claim relayed from a third source is a pointer. It is recorded as Nagao's
      assertion and nothing follows from it in any record above.

  limitations:
    - >-
      THE LANE'S ORIGIN IS A CORPUS FAILURE, AND THE FAILURE MODE IS GENERAL. A
      title-only literature entry is indistinguishable, at a glance, from a read one: both
      appear in a grep, both have an id, and KN-LIT-456 even carried
      `citation_verified: read` while its body said the abstract could not be extracted.
      This program worked a mechanism for weeks that a paper in its own corpus had
      published. The corpus contains other entries from the same 2026-07-24 bulk seeding
      pass with the same "No abstract was extractable" body, and no audit of them is
      proposed by this decision -- which is a disclosed gap, not a closed one.
    - >-
      EVERY COST EXP-SEMBIN-db9bc3 PRODUCES IS CONDITIONAL on Proposition 5 and on the
      first fall degree assumption, both granted there and neither tested there. A
      conditional cost is not a cost, and the contract says so in its own scope
      statement.
    - >-
      NAGAO'S o(1) IS SELF-DESCRIBED AS HUGE and his paper contains no table, no timing
      and no measurement. Any figure this program attaches to Theorem 1 is this program's
      arithmetic under this program's enumeration of the absorbed terms, and must be
      attributed here rather than to Nagao. The contract's required_reporting enforces
      this by naming each absorbed term as its own column.
    - >-
      THIS DECISION ASSERTS NOTHING ABOUT ANY CURVE'S SECURITY, and the contract's
      escalation clause exists so that an outcome which appears to bear on one cannot
      leave the program without independent review-breakthrough at max effort.

  claim_tier: >-
    None. This decision opens a lane, lands records, and approves a protocol. It reports
    no measurement and makes no scientific claim.

  review_plan: null
  review_plan_note: >-
