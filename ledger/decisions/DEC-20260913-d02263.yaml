    not_warranted: >-
      No KN-FIND is promoted. Nothing has been measured yet. The obvious candidate -- that
      the mechanism lane's idea is prior art -- is a property of a source and belongs in
      the literature entry above and in IDEA-20260913-352163's novelty_screen, not in a
      findings record, which is reserved for results this program produced. A KN-FIND on
      the corpus failure described in the limitations would be warranted only after the
      other 2026-07-24 stub entries are audited, and that audit is not done.

