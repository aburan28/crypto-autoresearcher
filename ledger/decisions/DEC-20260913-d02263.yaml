    a hypothesis past `approved`, closes a lane, or supports a headline claim. The review
    round for EXP-SEMBIN-db9bc3 is a separate batch and will carry its own plan, written
    before any reviewer runs, with the escalation to review-breakthrough that the
    contract's claim_tier_and_review block declares.

