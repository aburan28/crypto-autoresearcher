coordinator_decision:
  id: DEC-20260805-a9dade
  context: >-
    GOAL-AES-003 BATCH-010 close. A red team reviewed BATCH-007, BATCH-008 and
    BATCH-009 together for the first time -- none of the three had ever had an
    adversarial pass. Its report was bound by a snapshot archive, reviewed by
    two independent validator sessions (the first correctly refused on an
    admissibility ground caused by a Coordinator sequencing defect, a scoped
    successor rendered the terminal verdict), and both converged exactly on
    substance.
  decision: reclassify_composed_claim
  target_ids: [RQ-AES-003, GOAL-AES-003, EV-AES-1d5136]

  rationale:
    - >-
      THE CAMPAIGN'S OWN SUMMARY OF ITS THREE-BATCH CHAIN WAS IMPRECISE, AND
      THIS DECISION CORRECTS IT WHERE IT LIVES: DEC-20260805-9a1c47's
      next_actions text, not the underlying evidence records, which the red
      team confirmed are appropriately scoped. "Localised to the full word, not
      S-box-specific, and not a probe-geometry artifact" reads as three peer
      controls. It is not: two of the three run through the SAME shared,
      unmodified harness code as the live arm, and only the third (BATCH-009's
      ideal-permutation substitution) is a genuine inventor-protocol null
      object. Read in the correct order -- BATCH-009 first, supplying the
      discriminating power BATCH-008 lacked -- the composed claim is HONEST AND
      STRONGER than three independent checkmarks, but it is a different,
      narrower claim than the flat listing implied.
    - >-
      A REAL, PREVIOUSLY UNNAMED RESIDUAL RISK CLASS IS NOW ON THE RECORD:
      a shared-harness bug whose effect depends on interacting with actual
      round-function structure would produce exactly the observed pattern
      (inflating the live and random-S-box arms, not the ideal-permutation
      arm) and no control run in this campaign distinguishes it from a genuine
      signal. This is not a defect in any prior batch's arithmetic -- every
      number in EV-AES-a47618, EV-AES-8b8dcf and EV-AES-e4c091 stands exactly
      as measured -- it is a gap in what the composed set of controls can rule
      out, and naming it is the value this batch adds.
    - >-
      THE RED TEAM'S OWN ILLUSTRATIVE MECHANISM FOR THAT RISK DID NOT SURVIVE
      SCRUTINY, AND THIS IS RECORDED WITH THE SAME WEIGHT AS ITS CONFIRMED
      FINDINGS. Two independent validator sessions read yoyo_sbox_v2.c directly
      and found the proposed PW/CW-index-table aliasing with MixColumns/
      ShiftRows branch structure is not mechanically possible in the code as
      written -- the tables index only into worker()'s own I/O arrays, and
      MC/SR live entirely inside an opaque T-table implementation with no
      code path joining the two. The GENERAL risk class survives this
      correction untouched; the SPECIFIC illustration does not, and the red
      team's own "for instance" hedge is why this is scored as a narrow
      overstatement rather than a fabrication.
    - >-
      THE BATCH'S OWN TASK CARD CARRIED AN OVERCAUTION THAT THE RED TEAM'S
      SEARCH DISCIPLINE CORRECTED. The card asked whether the shared derived
      key across BATCH-008 and BATCH-009 was an untested risk. It was not: five
      distinct keys have been tested at the identical probe geometry across
      three prior batches, all elevated, no detected key effect (p=0.247). The
      mechanical rule from CORR-20260803-8fa302 -- search before asserting
      absence, and record the search -- worked in both directions this batch:
      it corrected the Coordinator's own overcaution, not only a producer's
      overclaim.
    - >-
      A COORDINATOR SEQUENCING DEFECT IS RECORDED PLAINLY RATHER THAN QUIETLY
      REPAIRED. The first independent validator was dispatched before the
      snapshot archive existed, and it correctly refused rather than reviewing
      an unarchived working-tree artifact. That refusal cost nothing
      substantive -- a scoped successor confirmed the same findings against the
      corrected state within the hour -- but the rule it enforces is exactly
      the one this campaign has repeatedly needed (CORR-20260802-009,
      CORR-20260803-ba2eb7), and its correct operation here, including at the
      Coordinator's own expense, is worth recording as the discipline working.

  evidence_refs:
    - EV-AES-1d5136
    - EV-AES-a47618
    - EV-AES-8b8dcf
    - EV-AES-e4c091

  what_this_decision_does_not_do:
    - >-
      It does not overturn any numeric result in BATCH-007, BATCH-008 or
      BATCH-009. Every figure in those three evidence records stands.
    - It does not name a mechanism for the r=5 excess.
    - It does not advance any closure criterion; no model independence exists under standing basis 0137a051eb5828789eb267fa83c8278086578d4c.
    - >-
      It does not treat the red team's aliasing overstatement as grounds to
      discount its confirmed findings; the two are independently scored.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED YET. The composed claim -- that the r=5 excess requires an
      actual round function and, given one, is neither byte-local nor S-box-
      specific -- is the strongest, most carefully qualified statement this
      campaign has produced, and it is a real candidate. It is held back
      because the residual risk class named in OBS-B10-3 is untested by any
      control, and RC-B (an independently-authored codebase extended with the
      same two mechanism checks) is the specific, affordable control that would
      convert this from a lineage-internal finding to a lineage-independent
      one. Promote after RC-B returns, or after a stated decision that RC-B is
      not worth running and why.

  next_actions:
    - >-
      SINGLE NEXT ACTION: GOAL-AES-003 BATCH-011, rank 1 = RC-B -- extend an
      already independently-authored codebase (valprobe.c or deriv_check.py,
      neither derived from the v2-v3-v4 lineage) with a prefix-counter and an
      ideal-permutation mode, and re-run BATCH-008's and BATCH-009's central
      comparisons on it at a modest exposure. This is the single control that
      would most directly convert "not byte-local" and "not a probe-geometry
      artifact" from lineage-internal findings into lineage-independent ones,
      and it is the cheapest way to bound the residual risk named in this
      decision. Rank 2: RC-C, a five-minute recomputation of OBS-B8-7's
      percentile comparison using all five available AES data points (14, 14,
      8, ~13.5, 12) rather than two, to confirm the qualitative conclusion is
      unchanged under the fuller evidence base. Rank 3: RC-D, a second,
      differently-constructed null object (a keyed PRP that is not an oracle,
      e.g. a wide-block Feistel with a fixed non-AES round function), to test
      whether BATCH-009's OUTCOME-A depends on idealness specifically or on
      structurelessness more broadly (residual limitation U4). RC-A IS NOT
      RANKED as specified: per D-B10-1, its stated exposure (2^20-2^24) is
      underpowered by 16-64x and would be vacuous. If a from-spec cross-check
      of v4's hit indices is still wanted, it must be re-specified at roughly
      2^28-2^30 trials before it is dispatched.

  budget_accounting:
    red_team_declared_seconds: 7200
    validation_declared_seconds: 5400
    note: >-
      Well inside budget. The dispatched successor validator (TASK-20260805-
      3b11d3) added review time beyond the original single-validator plan, a
      direct cost of the Coordinator's own sequencing defect, absorbed within
      GOAL-AES-003's null wall-clock ceiling by protocol-amendment-GOAL-AES-
      003-002.

  limitations:
    - Nothing here is a statement about full-round or deployed AES, and no comparison to published cryptanalysis is made in either direction.
    - Toy tier throughout.
    - Session and implementation independence only; NO model independence, so nothing counts toward a closure quorum.
    - RC-B and RC-D, the two controls with the most power to close the residual risk class, are unrun.

  decided_by: coordinator
  decided_at: 2026-08-05

  inference:
    policy: coordinator-orchestration-code
    requested_policy: coordinator-orchestration-code
    resolved_model: claude-sonnet-5
    fallback_used: true
    model_verified: false
    standing_basis: 0137a051eb5828789eb267fa83c8278086578d4c
