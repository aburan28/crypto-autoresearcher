coordinator_decision:
  id: DEC-20260824-526f89
  decided_by: coordinator
  decided_at: '2026-08-24'
  goal_id: GOAL-MLKEM-005
  decision: >-
    OPEN BATCH-f9780d and dispatch RT-CTRL-1 as a MATCHED PAIR (route (c)),
    running (d=512, beta=55, seed 452658293) at mpfr_bits 75 AND 100 in one
    invocation under one content-pinned BKZ strategies source, instead of the
    literally byte-identical single 100-bit cell GOAL-MLKEM-005.next_action
    names. No hypothesis moves, no claim tier moves, no budget is extended.
  target_ids:
    - GOAL-MLKEM-005
    - BATCH-f9780d
    - TASK-20260824-b3e9da
    - RQ-MLKEM-001
  supersedes: null
  rationale: >-
    The literal next_action cannot be executed here and would fail for a reason
    that is not about precision. The predecessor recorded its BKZ strategies
    input BY PATH -- /usr/share/libfplll8/strategies/default.json -- with no
    sha256 and no package version, across 29 recorded runs. That path does not
    exist in this container, and fpylll 0.6.4's own build-time fallback
    (/project/local/share/fplll/strategies/default.json) does not exist either;
    a filesystem search found no fplll strategies file anywhere. A byte-identical
    re-run therefore raises "Cannot open strategies file." at BKZ.Param, BEFORE
    any tour. Under AGENTS.md rule 3 that is an infrastructure failure and is
    never negative mathematical evidence, so dispatching it would have produced
    a result that looks like the obstruction RT-CTRL-1 exists to measure and is
    not. This is exactly the failure mode CLAUDE.md's "Archive receipts bind to
    CONTENT first" exists to prevent, occurring on a load-bearing producer input
    rather than on an archive receipt.
    Substituting any available strategies source into a single 100-bit cell would
    compare it against a 75-bit reference measured under DIFFERENT pruning, which
    confounds the control's own variable: RT-CTRL-1 varies precision, and pruning
    would vary with it. Route (c) removes the confound by making the contrast
    INTERNAL -- both cells in one container, one invocation, one strategies file
    bound by sha256 f516b0a6f0c580cff72e1e2c3562c44dc6f17e8f99613e9e4020e35481b27a18
    and archived beside the runner. The predecessor's 2502.74 s becomes a
    cross-container sanity reference only, never the contrast, and this record
    says so before any number exists.
  what_this_decision_does_not_do: >-
    It does not restore cross-container byte-identity, which is unrecoverable:
    the reference container no longer exists and no committed record carries the
    strategies bytes or the libfplll8 version. It does not amend the CONSTRUCTION
    -- basis, seed formula, mpfr-before-GSO ordering and ROW_EXPO-free GSO are
    reproduced verbatim from the pinned predecessor script (sha256
    58a1fdc21f45730789feeff69c6a6fd7c24bf4938be15d6e878afd246d0de485), and the
    seed formula was re-verified to emit 452658293 at (512,55), 915347894 at
    (512,70) and 2074339090 at (512,40), matching every recorded predecessor
    seed. It does not extend the campaign budget, which is unbounded already. It
    does not pre-judge the outcome: an ERROR in either cell is a reportable
    result and the task card declares in advance what each of the four possible
    outcomes would mean.
  evidence_basis:
    - coordination/goals/GOAL-MLKEM-005/instrument_readiness_20260824.md
    - ledger/decisions/DEC-20260815-3e8e9c.yaml
    - ledger/evidence/EV-MLKEM-e4189c.yaml
    - knowledge/techniques/KN-TECH-14efa5.md
    - knowledge/findings/KN-FIND-f54a82.md
  knowledge_promotion:
    promoted: []
    warranted: false
    not_warranted: >-
      Nothing here is a research result. The instrument-obtaining route is
      already recorded as KN-TECH-14efa5 and this session's successful
      reproduction in a new container is one data point on it, not a new entry;
      KN-TECH-797223 already records that the recipe is container-dependent. A
      knowledge entry becomes warranted only if the batch's own result warrants
      one, which is the ledger archive's decision, not this one.
  claim_tier: toy
  scope: >-
    One basis, one dimension (d=512), one block size (beta=55), two precisions,
    one container. Nothing here is a statement about ML-KEM at any standardized
    parameter set, and no toy-scale outcome may be reported as one.
