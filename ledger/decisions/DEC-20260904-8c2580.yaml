  claim_tier: derivation
  scope_statement: >-
    Scoped exactly to the m=3 Semaev summation polynomial S_3 for
    y^2 = x^3 + Ax + B over any field where the group law and the stated
    resultant elimination are valid (characteristic not 2 or 3, generic
    A, B). No ECDLP, relation-rate, exponent, or cryptographic-scale
    claim. Does not touch m >= 4, which DEC-20260810-2f86db D-3 already
    records as untested and live.

  rationale:
    - >-
      S_3 WAS DERIVED FROM SCRATCH, NOT TAKEN FROM A REFERENCE FORMULA:
      P1+P2 = -P3 iff x(P1+P2) = x(P3); clearing denominators in the
      point-addition formula gives (y2-y1)^2 - (x1+x2+x3)(x2-x1)^2 = 0;
      eliminating y1 via resultant against y1^2-f(x1), then y2 via
      resultant against y2^2-f(x2), gives a polynomial in (x1,x2,x3)
      equal to (x1-x2)^4 * S3^2 for
      S3 = A^2 - 2A(x1x2+x1x3+x2x3) - 4B(x1+x2+x3) + x1^2x2^2 -
      2x1^2x2x3 + x1^2x3^2 - 2x1x2^2x3 - 2x1x2x3^2 + x2^2x3^2 -- the
      squaring and the (x1-x2)^4 factor are the expected artifacts of a
      double resultant elimination (each elimination step is agnostic to
      the sign of the eliminated variable, doubling multiplicity; the
      extraneous (x1-x2)^4 factor arises from the elimination's own
      spurious common-root locus). S3 itself was independently verified
      fully symmetric under all 6 permutations of (x1,x2,x3) and degree
      exactly 2 in each variable -- both properties any genuine m=3
      summation polynomial must have, confirmed here, not assumed.
    - >-
      OBS-1 IS RECONFIRMED, FROM THIS INDEPENDENTLY-DERIVED S3, EXACTLY:
      disc_T S3(x1,x2,T) - 16 f(x1) f(x2) simplifies to 0 identically in
      A, B, x1, x2. This is a fresh, from-scratch confirmation of an
      identity this program already used, via a construction that did not
      assume OBS-1's own truth anywhere in its derivation.
    - >-
      THE D-5 TRANSPORT HOLDS, EXACTLY, BY THE SAME METHOD: disc_x2
      S3(x1,x2,T0) - 16 f(x1) f(T0) simplifies to 0 identically. Since S3
      is confirmed fully symmetric in all three of its variables, this is
      exactly what the symmetry argument in D-5's own text predicted
      (relabelling which slot is called "the discriminant variable" and
      which are held fixed as parameters is a symmetry of S3 itself, not
      a separate fact requiring its own proof) -- but D-5 explicitly asked
      for this to be verified rather than merely argued, and it now has
      been, by direct symbolic computation rather than by appeal to the
      symmetry argument alone.
    - >-
      PER D-5'S OWN STATED DISPOSITION, THIS CLOSES THE m=3 CASE OF THE
      DIRECTION-SWAP SUCCESSOR: "if the transport holds, the swapped route
      is dead at m=3 and only m >= 4 remains open for it." The transport
      holds. The swapped statistic (fix T=x(R), count FB-rational points
      on the fibre of the projection to the T-line) collapses, at m=3, to
      the identical quadratic-character-product structure OBS-1 already
      shows for the original (base-uniform) statistic -- both are governed
      by the same disc = 16 f(.)f(.) identity, merely with different
      variables held fixed. The swapped route buys nothing new at m=3 that
      was not already known.
    - >-
      THIS IS A CHEAP, MECHANICALLY-VERIFIED, FULLY TRANSPARENT
      COMPUTATION, RECORDED WITHOUT A FULL INDEPENDENT REVIEW ROUND: unlike
      this session's earlier statistical findings (which involved subtle,
      easy-to-miss specification errors in variance models and test
      selection), this is a short, mechanical symbolic-algebra check whose
      full derivation is reproducible by anyone reading this record or
      running the archived script. Per D-5's own text ("settle by hand or
      by a few lines of CAS"), this does not require the review-adversarial
      or review-breakthrough machinery this session used extensively for
      the H-MONO-1d50ac cycle. A future reader who doubts this result can
      re-run knowledge/derivations/d5_collapse_check_20260904.py directly
      and see the exact same mechanical check.

  next_action: >-
    UPDATE GOAL-MONO-001's own next_action (additive, not overwritten) to
