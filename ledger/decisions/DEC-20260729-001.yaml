      observations O-1 and O-5 to O-11.
    - 'L4 - writing a successor contract that pre-registers the repaired null. Taken, as the single next action.'
    - >-
      L5 - correcting, BY SUPERSESSION AND NEVER IN PLACE, the C-4 claim and the
      identical slip in the TASK-20260729-011 recheck note. Taken, below.
  red_team_prohibitions_accepted:
    - 'X1 - INV-4 is NOT re-dispositioned to NOT FIRED, on this or any basis.'
    - >-
      X2 - no efficiency is computed against a repaired prediction or a repaired
