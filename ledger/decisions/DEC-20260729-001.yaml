  corrections_by_supersession:
    method_note: >-
      Recorded here rather than as standalone ledger/corrections/CORR-* records.
      That directory is OUTSIDE the declared write scope and artifact_paths of
      TASK-20260729-009, and allocating a CORR identifier this session could not
      verify with tools/allocate_id.py would create a dangling id. Both
      supersessions are therefore carried inside this decision record and inside
      the ledger commit receipt, which is what OB-4 requires. NEITHER SUPERSEDED
      FILE IS EDITED; both remain readable at their commits.
    SUP-A:
      superseded_artifact: experiments/EXP-YIELD-001/amendments/v1_to_v2.yaml, clause C-4 basis
      superseded_statement: >-
        That the antipodal null process has mean (N-1)(1 - e^-lambda) and that
        "P_pred is therefore CORRECT to O(1)" against it.
      corrected_statement: >-
        The comparison silently drops P_pred's second term. P_pred equals
        N(1 - e^-lambda) + |S_(m-2)| e^-lambda, so the difference against the
        antipodal process's mean is |S_(m-2)| e^-lambda less an O(1 - e^-lambda)
        term from the (N-1)-versus-N bin count. The O(1) claim HOLDS AT m = 2,
        where |S_0| = 1, and FAILS AT m = 3, where |S_1| = B and grows with the
        factor base. C-4 repaired the antipodal-pairing half of the shape mismatch
        RT-4 identified and left the pre-marking half in place.
      basis: >-
        Independently re-derived at TASK-20260729-008 from the frozen contract
        before reading the Executor's arithmetic, and independently confirmed
        arithmetically at TASK-20260729-007 at all 49 criterion-evaluable cells.
    SUP-B:
      superseded_artifact: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-011/reviews/TASK-20260729-011/recheck_note.md,
        committed at 009b90a5
      superseded_statement: >-
        That the difference between P_pred and the antipodal null mean is O(1),
        "at lambda = 0.5 it is about 0.09".
      corrected_statement: >-
        That figure can only arise by comparing against the first term of P_pred
        alone. The correct difference is |S_(m-2)| e^-lambda, which at m = 3 is
        B e^-lambda. The same arithmetic slip appears in the amendment and in both
