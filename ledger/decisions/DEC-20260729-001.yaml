coordinator_decision:
  id: DEC-20260729-001
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-011
  recorded_by_task: TASK-20260729-009

  context: >-
    BATCH-011 froze one bounded toy-scale experiment, EXP-YIELD-001, under one
    new hypothesis H-YIELD-001, reviewed the contract before execution
    (TASK-20260729-003 returned REVISE), spent its single permitted
    protocol_amendment cycle (TASK-20260729-010 authored v1_to_v2, re-reviewed at
    TASK-20260729-011 with a PASS), executed six runs (TASK-20260729-005,
    snapshot-committed at 2fb2bb7a111d999859612e52990eea7dc6bbac1a by
    TASK-20260729-006), and then reviewed the run package twice independently -
    TASK-20260729-007 (Validator, VAL-20260729-001) and TASK-20260729-008 (Red
    Team, RT-20260729-008). RC-11's execution gate IS DISCHARGED: six committed
    run records with schema-complete manifests exist, so BATCH-011 is not a batch
    failure and is the FIRST batch since BATCH-007 to measure anything.
    THE PRE-REGISTERED INVALIDATION RULE INV-4 FIRED at 4 of 49
    criterion-evaluable cells. Under the frozen v2 outcome_disposition_table
    branch P0, every occupancy-normalised efficiency in the package is VOID, no
    outcome branch is evaluated, and the census supports no statement about
    decomposition yield in either direction. Both reviews independently confirmed
    a diagnostic locating the cause in the null control's construction rather
    than in any measured quantity, and each strengthened it. The Validator
    returned PARTIAL / `incomplete` with `blocks_ledger_record: true`; the Red
    Team returned 13 objections of which 3 are BLOCKING, ruling that the VOID
    stands AND that the fault is a located, repairable instrument fault, and that
    both must be recorded.

  decision: inconclusive
  decision_vocabulary_note: >-
    `inconclusive` is taken from the docs/task-lifecycle.md section 9 transition
    vocabulary, which the TASK-20260729-009 completion gate L2 names as
    governing. The coordinator_decision template enum in
    templates/research-records.md omits `inconclusive` while section 9 and
    agents/coordinator.md's escalation rule both require it for exactly this
    situation ("Mark a result inconclusive when evidence cannot discriminate
    between competing explanations"). The discrepancy between the two lists is
    recorded here rather than resolved by picking a weaker label that would
    misstate the finding; no label in the template enum is true of this batch.
  decision_scope: >-
    `inconclusive` ON THE YIELD QUESTION, WITH THE VOID UPHELD UNDER P0, PLUS ONE
    SCOPED INSTRUMENT SUCCESSOR. It is not `weaken`, because nothing was measured
    that could lower confidence in anything. It is not `reject_scoped`, which is
    independently forbidden on a single unreplicated empirical-only run set. It
    is not `support`. It is not `pause` on the lane: the decomposition-yield
    question at m in {2, 3} over prime fields remains OPEN and is now CHEAPER to
    answer than before, because the instrument fault is located and its repair is
    one term.

  target_ids:
    - EXP-YIELD-001
    - H-YIELD-001
    - EV-ECDLP-008
    - GOAL-ECDLP-001
    - BATCH-011

  evidence_refs:
    - EV-ECDLP-008
    - RUN-YIELD-001-CENSUS-M2
    - RUN-YIELD-001-CENSUS-M3
    - RUN-YIELD-001-NULL-UNIFORM-FB
    - RUN-YIELD-001-NULL-RANDOM-SUMSET
    - RUN-YIELD-001-CALIB-AP
    - RUN-YIELD-001-BASELINE-RHO-BSGS
    - >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-011/reviews/TASK-20260729-007/validation_report.yaml
      (VAL-20260729-001)
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-011/reviews/TASK-20260729-007/recount_note.md
    - >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-011/reviews/TASK-20260729-008/red_team_report.yaml
      (RT-20260729-008)
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-011/reviews/TASK-20260729-008/falsification_review.md
    - >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-011/archives/TASK-20260729-006/snapshot_commit_receipt.json
      - the receipt binding the run package at
      2fb2bb7a111d999859612e52990eea7dc6bbac1a, parent
      81e5edc3660bf6831734a9e4ac637515cd760ce8, 20 declared paths, 20 committed,
      20 of 20 hashes re-verified from the blobs at that commit by BOTH reviews.
    - >-
      Prior decisions this record does NOT disturb - DEC-20260727-008 (H-IC-001
      `weakened`), DEC-20260727-009 (H-STR-002 `weakened`, and the undischarged
      EXP-STR-004 replication obligation carried as DEFER-BATCH009-001),
      DEC-20260728-005 (H-ENDO-001 prediction 2 reject_scoped on the frozen J0
      eigenvalue source).

  rationale:
    - id: R-1
      text: >-
        THE RUN PACKAGE IS VALID AND ITS INTEGRITY IS THE STRONGEST THIS PROGRAM
        HAS PRODUCED, SO THE INCONCLUSIVE LABEL IS NOT A VALIDITY VERDICT. Six
        runs, all `completed_valid`, 136 of 136 cells measured, no cell skipped,
        23 of 23 artifact-policy fields present in 6 of 6 manifests, seed
        derivation recorded beside every number it produced. Re-execution of all
        six runs from the recorded command differs from the committed
        results.json in TIMING FIELDS ONLY, at every leaf; regenerating
        summary.json from the committed raw files reproduces it BYTE-IDENTICALLY
        at the hash the TASK-20260729-006 receipt binds. Expected run count,
        schema completeness, seed integrity, raw-to-summary agreement and control
        comparability all check out (VAL-20260729-001 A1-A10, M1, M2, C1-C9).
        There is no defect to return to the Executor and no repair is ordered.
    - id: R-2
      text: >-
        INV-4 FIRED FOR THE REASON IT WAS WRITTEN, ON THE DATA IT WAS WRITTEN TO
        POLICE, ON THE MORE FORGIVING OF THE TWO AVAILABLE DENOMINATOR READINGS -
        SO THE VOID STANDS. Its function is to certify P_pred empirically BEFORE
        any efficiency is read; it did not certify it. Lifting VOID on the
        strength of an analysis produced AFTER the rule fired would convert a
        pre-registered validity gate into a post-hoc judgement, which is the one
        thing pre-registration exists to prevent. RC-11's single amendment cycle
        is spent. This program has already had to correct one contract (EXP-IC-001
        v3) for outcome-selected criteria. And the diagnostic was FOUND by a dry
        run of the fired rule, so its use as a repair inside this batch is
        data-motivated in origin whatever its analytic standing. Adopted verbatim
        from OB-1.
    - id: R-3
      text: >-
        WHAT INV-4 ESTABLISHED IS NOT THAT P_pred IS WRONG - IT IS THAT P_pred WAS
        NEVER CERTIFIED, AND "not certified" AND "refuted" ARE DIFFERENT WORDS.
        VOID is the correct word for the first. That is why the disposition is
        `inconclusive` and not `weaken`: there is no measurement whose confidence
        could be lowered.
    - id: R-4
      text: >-
        THE FAULT IS ALSO LOCATED AND REPAIRABLE, AND RECORDING THAT IS AN
        OBLIGATION RATHER THAN A CONCESSION. AGENTS.md core rule 8 requires
        unexpected observations to be recorded, not silently discarded, and
        recording is not re-dispositioning. The fault is ONE deterministic term in
        a Monte Carlo control, not an error in any measured quantity: the primary
        metric is exhaustive, deterministic and seed-free; P_pred is recomputable
        from the frozen v1 formula and both reviewers reproduced all 49 recorded
        values to a maximum absolute difference of 0.0; and the omitted term is
        exact set inclusion, S_(m-2) contained in S_m, which needs no simulation
        at all. INV-4's own frozen text voids every EFFICIENCY VALUE, not every
        measurement, and that distinction is in the contract rather than invented
        here. Recorded as EV-ECDLP-008 observation O-4 with `proof_status:
        derivation`.
    - id: R-5
      text: >-
        THE DIAGNOSTIC IS CONFIRMED BY TWO NON-ORIGINATING SESSIONS AND IS
        STRONGER THAN THE EXECUTOR CLAIMED, AND ITS LOCATION IS A CONTRACT DEFECT
        RATHER THAN AN INSTRUMENT DEFECT IN THE NARROW SENSE. The driver
        implements v2 C-4's process verbatim and evaluates INV-4 against P_pred
        exactly as frozen, so the gap sits between TWO COMMITTED CONTRACT CLAUSES:
        C-4's own antipodal-mean derivation gives (N-1)(1 - e^-lambda) with no
        |S_(m-2)| e^-lambda term, while the v1 P_pred it declares correct to O(1)
        carries one. Under the stricter standard-error-of-the-mean reading of
        DEV-4 the UNCORRECTED comparison fails at 22 of 49 cells rather than 4,
        while the CORRECTED residual passes at 49 of 49 under BOTH readings. The
        same arithmetic slip propagated through the amendment and both
        pre-execution reviews and was catchable with no data at all.
    - id: R-6
      text: >-
        THE RESULT ROUTES TO O-6 AND NOT TO O-4, AND THE DISPATCHING FRAMING THAT
        SAID OTHERWISE IS FACTUALLY WRONG ON THE COMMITTED DATA. O-4 requires the
        out-of-band set to exceed one third of the realised evaluable set;
        recorded is 3 of 49, 6.12 per cent, against a threshold of 16.33 cells.
        All ten realised evaluable columns are FLAT (absolute OLS slope at most
        0.05 with a 95 per cent interval containing zero, largest +0.0408), so
        O-8, O-2, O-3 and O-7 are excluded, and O-1 fails because the out-of-band
        set is non-empty. The first matching branch is O-6, SPARSE OUT-OF-BAND
        SET, whose disposition is `inconclusive` at batch level with the explicit
        instruction that NO COST MODEL IS RE-CHARGED. EVEN A FULLY REPAIRED NULL
        WOULD THEREFORE HAVE PRODUCED NO COST-MODEL CONSEQUENCE - the
        counterfactual is the WEAKEST branch in the table, not the strongest.
        Adopted verbatim from OB-2.
    - id: R-7
      text: >-
        THE THREE OUT-OF-BAND CELLS ARE TWO FACTOR BASES ON ONE CURVE, AND THE
        DEVIATION SHRINKS WITH SIZE - THE OPPOSITE DIRECTION FROM THE OUTCOME THEY
        WERE READ AS. Two of the three have identical measured B = 22, identical
        C_red = 1782 and identical maximum load 14 and select the SAME factor
        base, so the evaluable set carries 48 distinct triples rather than 49; all
        three sit on ONE 12-bit curve, at the smallest size in the design, where
        the contract's own declared weakness is exactly one curve per size; and
        they sit not at the smallest C_red but at the largest lambda among small-N
        cells, which is a finite-N approach-to-saturation signature. Carried, if
        at all, only in the phrasing OB-3 requires: two factor bases on one 12-bit
        curve, at lambda 0.33 to 0.45, with the deviation decreasing in p. No
        interval-structure, curve-structure or yield reading of these cells is
        written anywhere, in either direction. Adopted verbatim from OB-3.
    - id: R-8
      text: >-
        THE EVIDENCE CANNOT DISCRIMINATE BETWEEN THE TWO LIVE EXPLANATIONS, AND
        THAT IS WHY THE LABEL IS `inconclusive` RATHER THAN A NARRATIVE. Either
        the null control's construction omits a term P_pred contains, or P_pred is
        wrong in some further unmodelled way. One term closes the residual at 49
        of 49 cells under both readings, and a second unmodelled term would have
        shown in that residual - but the DISCRIMINATING EXPERIMENT HAS NOT BEEN
        RUN. No repaired-null draw exists under any archived run id. Until RC-A is
        archived and verified, the second explanation is excluded by an argument
        and not by a measurement. That is the single next action.
    - id: R-9
      text: >-
        NO HYPOTHESIS MOVES, AND THAT IS A REASONED CHOICE RATHER THAN AN
        OMISSION. A VOID census is not evidence about the hypothesis it was built
        to test, so H-YIELD-001 stays at `specified`. OB-3's X3 independently
        forbids any `support`, `weaken` or `reject_scoped` label on H-YIELD-001 or
        any other hypothesis from this run set, and `reject_scoped` on a single
        unreplicated empirical-only run set is forbidden by agents/coordinator.md
        regardless. H-STR-002 must NOT move in either direction and does not:
        DEFER-BATCH009-001's EXP-STR-004 replication obligation is undischarged
        and binds its next transition. Nothing in this batch bears on H-IC-001,
        H-ENDO-001, H-GGM-001, H-FCP-001 or H-SUBRES-001 and none of them moves.
        BECAUSE NO HYPOTHESIS FILE IS TOUCHED, THE DEFAULT EIGHT-PATH COMMIT SET
        STANDS and no QUEUE-AMEND adding a hypothesis path was needed or recorded.
    - id: R-10
      text: >-
        THE BATCH IS NOT A FAILURE AND IS NOT A SUCCESS. RC-11's gate is
        discharged - six committed run records with schema-complete manifests
        exist, so the three-of-four-batches-measure-nothing pattern is broken and
        the non-execution branch does not apply. But the batch produced NO
        measurement of the quantity it was built to measure, and the record says
        so in those words rather than presenting an instrument finding as a
        research result.

  validator_narrowings_adopted_verbatim:
    adoption_statement: >-
      ALL SIX REQUIRED NARROWINGS N-1 TO N-6 FROM VAL-20260729-001 ARE ADOPTED
      VERBATIM, NOT PARAPHRASED AND NOT ANSWERED ON THE MERITS. The Validator's
      `blocks_ledger_record: true` is discharged by its own stated condition -
      that DEC-20260729-001 carry N-1 and N-2 verbatim - and the remaining four
      are adopted with them because they are correct and because adopting the
      Validator's own recommendation is cheaper and safer than re-arguing it.
    N-1: >-
      No committed record sets experiment.status to approved or fills approved_by
      for EXP-YIELD-001; the frozen specification is immutable and still reads
      review_required and null at the snapshot commit. The contract's own
      execution gate was met by committed records - the TASK-20260729-011 PASS
      review at 009b90a5 and BUDGET-AMEND-20260729-001 at 93d961e0, both ancestors
      of the run package - but the formal status transition was never recorded and
      cannot be supplied by editing an immutable file. This decision record
      supplies it.
    N-2: >-
      PC-1, PC-2 and PC-4 were applied by the Executor from the sole committed
      candidate reading in the TASK-20260729-011 review, which is an ancestor of
      the run package, and were never separately recorded by the Coordinator
      before dispatch as that review's binding note required. The readings are
      pre-data on commit order; the separate recording is supplied here. PC-2's
      eleven predicted class flips and the eleven realised flips are NOT the same
      eleven - only five overlap - and the count agreement must not be read as a
      confirmed prediction.
    N-3: >-
      The Executor's disclosure that only reporting changed after the scratch dry
      run is BOUNDED BY CONTRACT CONFORMANCE, NOT PROVEN BY A RECEIPT. The driver
      has exactly one commit in the whole repository and the dry run left no
      artifact. What is verified is that every threshold, criterion, seed, control
      process, replicate count and cell-class rule in the committed driver matches
      the contract pair frozen at 82327a02 and amended at 59f2e930, that INV-4 was
      evaluated against P_pred exactly as frozen, that the add-back diagnostic
      feeds no predicate, and that the package re-executes bit-exactly.
    N-4: >-
      Every conclusion drawn from this package is scoped to 12 to 18 field bits, m
      in {2, 3}, x-interval factor bases on the frozen beta grid, ONE prime-order
      curve per size, one implementation and one budget, on a SINGLE UNREPLICATED
      RUN SET. Four field sizes on one curve each is a size series, not a
      replication. No strength above preliminary is available from it and
      reject_scoped on it is forbidden.
    N-5: >-
      The Validator confirms the P_pred missing-term diagnostic ARITHMETICALLY and
      makes no ruling on whether the void verdict stands. The discrepancy sits
      between two committed contract clauses - v2 C-4 derives an antipodal mean of
      (N-1)(1 - e^-lambda) with no |S_(m-2)| e^-lambda term, while the v1 P_pred
      it calls correct to O(1) carries one - and not between the contract and the
      driver, which implements C-4 verbatim. Whether that is a located repairable
      instrument fault or a standing void is the Coordinator's call, informed by
      TASK-20260729-008.
    N-6: >-
      Model independence was NOT available for this validation and is NOT claimed.
      The adapter resolves review-adversarial to anthropic:claude-opus-5 at effort
      xhigh on the default backend and refuses it on zai-anthropic because the
      policy requires xhigh against a binding ceiling of high; ZAI_API_KEY and
      ANTHROPIC_API_KEY are both unset, so no identifier in this batch is
      probe-verified. Session independence is asserted and holds; model
      independence does not and must not be asserted anywhere downstream.
    N_5_coordinator_ruling: >-
      N-5 explicitly routes one question to the Coordinator, and it is answered
      here rather than left open: the fault is a LOCATED REPAIRABLE INSTRUMENT
      FAULT AND THE VOID NEVERTHELESS STANDS. Both are recorded, per rationale R-2
      and R-4 and per RT-20260729-008's ruling headline. The repair belongs to a
      successor contract and, on the cells reused from this package, that
      successor cannot be confirmatory.

  red_team_objection_dispositions:
    disposition_statement: >-
      All 13 objections are dispositioned. The three BLOCKING objections are
      ADOPTED VERBATIM into the rationale above and into EV-ECDLP-008; none is
      answered on the merits, because on the merits all three are correct and two
      of them correct the framing the batch was dispatched under. The ten
      NONFATAL objections are each accepted, with the action each implies named.
      None is silently dropped.
    OB-1:
      severity: BLOCKING
      disposition: ADOPTED VERBATIM
      where: rationale R-2, and decision label `inconclusive` with the VOID upheld under P0.
      action: >-
        No efficiency value is recomputed against a repaired P_pred or a repaired
        null anywhere in this record or in EV-ECDLP-008.
    OB-2:
      severity: BLOCKING
      disposition: ADOPTED VERBATIM
      where: rationale R-6, and EV-ECDLP-008 observation O-10.
      action: >-
        The counterfactual is named as O-6 and never as O-4, and both records
        carry the sentence that even a fully repaired null would have produced no
        cost-model consequence. THE COORDINATOR RECORDS THAT THE ERROR CORRECTED
        HERE WAS THE COORDINATOR'S OWN, in the TASK-20260729-009 dispatching
        framing, and that it was caught by the red team and not by the author.
    OB-3:
      severity: BLOCKING
      disposition: ADOPTED VERBATIM
      where: rationale R-7, and EV-ECDLP-008 observation O-9.
      action: >-
        The three cells are carried only as "two factor bases on one 12-bit curve,
        at lambda 0.33 to 0.45, with the deviation decreasing in p". No efficiency
        figure from those cells is quoted as a measured yield shortfall in either
        direction, and no interval-structure or curve-structure reading is
        written. The discriminating control is named as RC-B and is NOT dispatched
        here.
    OB-4:
      severity: NONFATAL
      disposition: ACCEPTED
      action: >-
        The two defective statements are SUPERSEDED, never edited in place, in the
        corrections_by_supersession block below and in the ledger commit receipt.
    OB-5:
      severity: NONFATAL
      disposition: ACCEPTED
      action: >-
        The dry-run residual is recorded honestly rather than as a clean bill, in
        EV-ECDLP-008 unresolved_confounds and in narrowing N-3. RC-F is named as
        the cheapest closure and is NOT claimed to be discharged.
    OB-6:
      severity: NONFATAL
      disposition: ACCEPTED
      action: >-
        The DEV-4 ambiguity is recorded with both counts (4 of 49 under the
        applied single-replicate reading, 22 of 49 under the standard-error-of-the
        -mean reading), and RC-E - pre-registering the denominator - is bound into
        the successor's freeze requirements below. The note that the corrected
        residual reaches 2.93 at one cell under the stricter reading, i.e. almost
        no margin, is carried into the successor's prediction.
    OB-7:
      severity: NONFATAL
      disposition: ACCEPTED
      action: >-
        INV-5 is recorded as UNADJUDICATED BY CONTRACT DEFECT with both readings
        and their counts, in EV-ECDLP-008 observation O-8. It is declared NEITHER
        fired NOR not fired as a finding of this batch. RC-D - quantifying "shrink"
        before data - is bound into the successor's freeze requirements.
    OB-8:
      severity: NONFATAL
      disposition: ACCEPTED
      action: >-
        Classing on measured B is confirmed sound and is not disturbed; the two
        residuals - the one-sided drift toward the noisiest corner of the design,
        and the duplicate factor base inside the evaluable count - are carried as
        unresolved confounds and as successor-design constraints (RC-C).
    OB-9:
      severity: NONFATAL
      disposition: ACCEPTED
      action: >-
        The non-independence of nested-interval cells within a column, and of the
        four sizes as four curves rather than four draws, is carried as an
        unresolved confound. NO POWER OR FALSE-DISCOVERY STATEMENT COMPUTED ON THE
        EVALUABLE-CELL COUNT MAY BE MADE IN ANY SUCCESSOR without addressing it.
    OB-10:
      severity: NONFATAL
      disposition: ACCEPTED
      action: >-
        The identity-bin approximation is carried as an unresolved confound and
        the successor is required to handle the identity bin EXPLICITLY rather
        than by declaration.
    OB-11:
      severity: NONFATAL
      disposition: ACCEPTED
      action: >-
        The Executor's policy-binding mismatch is carried into EV-ECDLP-008 rather
        than dropped: the model identity behind every number in the package is
        unverified configuration, disclosed and not silently substituted.
    OB-12:
      severity: NONFATAL
      disposition: ACCEPTED AND REPAIRED HERE
      action: >-
        The governance defect is repaired by the superseding record this decision
        constitutes - see experiment_status_transition and
        pre_dispatch_readings_recorded_late below - and not by editing the
        immutable specification.
    OB-13:
      severity: NONFATAL
      disposition: ACCEPTED
      action: >-
        The clean claim-tier audit is recorded. Claim tier is TOY throughout and
        the rule A1 admission survives intact: EXP-YIELD-001 is an
        exponent-DECIDING screen, expressly not an exponent-targeting mechanism,
        and nothing here is quotable as target-class.
  red_team_licenses_accepted:
    - 'L1 - `inconclusive` plus a scoped INSTRUMENT successor, under P0. Taken.'
    - 'L2 - recording the diagnostic as a located instrument fault with a named repair. Taken.'
    - >-
      L3 - carrying forward as DETERMINED, claim-tier-toy OBSERVATIONS and not as
