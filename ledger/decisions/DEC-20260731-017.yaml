  limitations:
    - >-
      This decision asserts NOTHING about AES. BATCH-004 produced no distinguisher,
      no key recovery, no speedup, no measured structural excess, and no barrier
      statement about the cipher, at any round count. Zero cryptanalytic compute
      was spent on AES itself, for the fourth consecutive batch.
    - >-
      Nothing here concerns full-round AES, AES-NI-deployed AES, or the security of
      any system that uses AES. Claim tier is toy / reduced-round.
    - >-
      A derivation is a DERIVATION FACT and an exhaustive toy enumeration is a
      COMPUTATION FACT. Neither is empirical cryptanalytic evidence, and a ledger
      archive makes work durable without upgrading the strength or scope of the
      evidence.
    - >-
      Proposition 806-1 is scoped to F-linear round-independent pi at ONE
      super-box interface, is INDEPENDENT of L, is NOT a cost inequality, carries
      an unnumbered dependence on the unrestricted state quantifier, and may not be
      quoted as a bound for OD-4's class. Section 5's n-interface table is STRUCK.
    - >-
      GF(2^4) and GF(2^2) are ANALOGUES; the GF(2^2) analogue is additionally not
      MDS. The GF(2^8) counterparts of the 57 and the 12.5/87.5 split were computed
      by NOBODY. The GF(2^8) (lambda,k) diameter of 30 was re-measured by NOBODY in
      this batch.
    - >-
      Every red-team finding is a SINGLE-SESSION result reproduced by no second
      party. RT-1 is a witness, not a minimum, and a kernel with J < 2^24 is
      UNRESOLVED. RT-2 is a dimension count, not an experiment. RT-3 and RT-4 are
      omissions, not demonstrated falsehoods. RT-5 is unresolved. The Coordinator's
      corroborations of RT-1 and RT-2 are CORRELATED and are not independent
      validation.
    - >-
      NO_ADMISSIBLE_MEMBER for OD-3 is conditional on unverifiable recollections
      for six of eight rejections and is NOT an established non-existence result.
      The relocation of hole (ii) is a description of a measured family in an
      analogue, explicitly not a theorem, with the closure fixpoint re-executed by
      nobody.
    - >-
      The two reviews cover LARGELY DISJOINT GROUND. Proposition 806-1's proof was
      re-worked by the VALIDATOR ONLY; the joint branching J was re-executed by the
      RED TEAM ONLY; the red team re-executed NONE of TASK-20260801-807's
      measurements and did not attack the proposition's proof, stating that as "an
      absence of attack, NOT A CLEARANCE". "Two reviewers looked" is therefore
      false for several items, where the count is ONE and in one case ZERO.
    - >-
      Every literature statement anywhere in this batch is UNVERIFIED-FROM-MEMORY;
      zero primary sources were read by any participant, and novelty against the
      external literature was not and in this environment cannot be settled.
    - >-
      CROSS-MODEL INDEPENDENCE IS UNAVAILABLE. Both producers, the validator, the
      red team and this Coordinator resolve to the same model under
      inference-amendment 0137a051; independence in BATCH-004 is in SESSION ONLY,
      never in MODEL, and CORRELATED AGREEMENT IS THE HONEST READING. A validator
      CONCUR plus a red-team CONCUR is ONE DRAW FROM A CORRELATED PAIR, NOT TWO.
      model_verified is FALSE in every inference block in this batch and
      `doctor --probe` was not run by any BATCH-004 task, so every resolved model
      identifier here is UNPROBED CONFIGURATION.
    - >-
      GOAL-AES-001 is NOT completed, is not proposed for completion, and cannot be
      completed in this harness. NO ATTESTATION IS RECORDED anywhere in this batch.
    - >-
      ARCHIVAL DEPENDENCY, stated as a condition on this record rather than
      assumed: the five TASK-20260801-809 and TASK-20260801-810 review artifacts are
      not in this ledger commit's declared path set (D-811-1 in EV-AES-004) and
      MUST be committed in an ISOLATED PREDECESSOR COMMIT immediately before this
      ledger commit, whose SHA is then recorded as this commit's parent in the
