  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED, ON FIVE CONCRETE GROUNDS RATHER THAN BY OMISSION, AND
      KN-FIND-019 STAYS RESERVED AND UNALLOCATED.
      (i) THE TRIGGER IS NOT MET. The promotion gate in agents/coordinator.md fires
      on a `support` or `reject_scoped` decision at `replicated` or `strong`
      evidence. This decision is `revise`: no hypothesis is supported, no scope is
      rejected, no lane is closed, and no gate package stands.
      (ii) THE BATCH'S CENTREPIECE HAS A KNOWN-INCOMPLETE HYPOTHESIS LIST.
      Proposition 806-1 FOLLOWS at one interface, but it carries an UNNUMBERED
      conditional dependence on the unrestricted state quantifier (U-809-1) that
      the batch's own other producer demonstrated is restrictable, and RT-3 shows
      the class assumption governing its composition is unstated. THE CORPUS MUST
      NOT RECEIVE A RESULT WHOSE HYPOTHESIS LIST IS KNOWN TO BE INCOMPLETE. The fix
      is to NUMBER the dependence and run CTRL-810-A, which is BATCH-005 work, not
      a corpus edit.
      (iii) THE ONE ITEM THAT IS A GENUINE PROVEN BOUNDARY IS NOT YET SEPARABLE
      FROM A FRAMING THAT IS ITSELF FLAGGED. The trivial-ceiling obstruction —
      B <= |X| = 2^(32-L) as an identity of the definition, so no f increasing in L
      can lower-bound B, hence re-pose OD-4 in the yield Y — IS a proven boundary
      in the sense the contract credits, was independently verified, and was
      ATTACKED BY THE RED TEAM AND NOT BROKEN. But D-809-3 records that its
      universal phrasing is one notch stronger than its argument, D-809-4 records
      that the surrounding Corollary 806-2 framing is the sentence most likely to
      be mis-transcribed downstream, and the cost model it sits beside has THREE
      MAJOR DEMONSTRATED DEFECTS. Promoting it now would put a boundary into the
      corpus in the company of a package no gate stands behind. It is the STRONGEST
      candidate for KN-FIND-019 and it is DEFERRED, not declined.
      (iv) RT-13's GATE-4 FINDING BELONGS WITH THE AMENDMENT THAT ACTS ON IT, NOT
      AHEAD OF IT. That a validator CONCUR plus a red-team CONCUR under one
      resolved model is ONE DRAW FROM A CORRELATED PAIR, and that gate (4)
      decomposes into a certifiable mechanical/session half and an uncertifiable
      confirmation half, is durable and reaches beyond this campaign — but this
      decision deliberately does NOT re-scope gate (4), and the DEC-20260731-016
      precedent is that a finding is promoted where the program ACTS on it. It is
      recorded at full strength in EV-AES-004 and is a candidate for promotion
      alongside the amendment that re-scopes or re-affirms the gate.
      (v) NOTHING HERE CONCERNS AES, so no finding about the cipher exists to
      promote, and the red team states independently that there is nothing in this
      package to promote in any case.
      WHAT WOULD WARRANT KN-FIND-019 LATER, stated concretely so this is a
      deferral and not a dismissal: BATCH-005 numbering the state-quantifier
      dependence as a formal heuristic with a paired experiment, running CTRL-810-A
      so the composition class is stated, and the trivial-ceiling boundary and the
      yield reframing surviving both — at which point the entry carries the same
      proof_status and the same honesty as EV-AES-004 and never a stronger basis.
