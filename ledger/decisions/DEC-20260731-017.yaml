      integral family. D-809-6 BINDS ON EVERY DOWNSTREAM USE: six of the eight
      rejections are MEMORY-DEPENDENT and unverifiable here, so NO_ADMISSIBLE_MEMBER
      IS CONDITIONAL ON UNVERIFIABLE RECOLLECTIONS AND IS NOT AN ESTABLISHED
      NON-EXISTENCE RESULT. Only OBJ-807-1 and OBJ-807-2 are rejected on structure
      alone. The producer's forward guidance is adopted: a set object that is not a
      function of the per-word marginals is an OD-2 object, and OD-2 is the
      productive move.
    THE_PRE_SCREEN: >-
      RETAINED AS AN INSTRUMENT AND REFORMED, NOT ABANDONED. It did real work: 4 of
      6 and 4 of 7 candidates were PURSUED, no IN_SCOPE_VACUOUS candidate was
