  structural_ruling:
    question: >-
      Is the campaign's pre-screen — the instrument built in BATCH-004 whose whole
      purpose is to decline work before effort — a sound instrument, and may
      Proposition 806-1 be carried beyond one interface?
    ruling: >-
      NO TO BOTH, ON DEMONSTRATED GROUNDS RATHER THAN ON JUDGEMENT.
      (1) THE SCREEN IS NOT SOUND AS WRITTEN, and its two defects point in opposite
      directions, which is why neither is a mere preference. RT-8: two screens
      frozen the same day under language declared identical assign n = 30 and n = 1
      to the same structural object, and the inconsistency KILLED THE ONE CANDIDATE
      THAT ATTACKED OD-4's ACTUAL QUESTION, whose remaining content is explicitly
      open. RT-9: the "no upper bound exhibited" rule reports a fact about the
      producer under a label that is a predicate on the candidate, which is a
      FATIGUE REPORT in the inventor protocol's own language. RT-11: the screen's
      advertised variable (iteration count) and its operative variable
      (layer-dependence) have come apart, so it decides almost nothing for this
      campaign's round-independent objects. RT-10: its threshold bounds available
      cipher interfaces while being applied to argument iterations, and under the
      tighter conversion it is TOO PERMISSIVE. THE ROOT CAUSE IS THE COORDINATOR'S
      OWN GUIDANCE, which stated the rule in terms of THE GRAPH rather than in
      terms of LAYER-DEPENDENCE (D-811-2). Reformed rather than abandoned; five
      requirements are ruled in the rationale and enacted in the BATCH-005 queue.
      (2) PROPOSITION 806-1 MAY NOT BE CARRIED BEYOND ONE INTERFACE. RT-3
      demonstrates by grep over committed bytes that the nonlinear layer between
      consecutive super-box interfaces is NOWHERE MODELLED, and both horns of the
      resulting dichotomy destroy the n-axis: with no nonlinear layer, Phi^n is a
      single affine map saturating at RT-2's ceiling and is not J^n; with one, pi
      composed with SB is not F-linear and the proposition GOVERNS NO INTERFACE
      AFTER THE FIRST. At n = 1 neither horn bites and the proposition stands.
    evidential_basis: >-
      Two independent adversarial sessions on a Git-verified snapshot. From
      TASK-20260801-810: RT-8 and RT-9 read from the two committed pre-screens
      against the inventor protocol's section 4 standard; RT-3 verified by grep
      over committed bytes; RT-1 by re-execution of the producer's own unmodified
      code with the recipe recorded; RT-2 by a one-line dimension count against the
      table's own entries. From TASK-20260801-809: U-809-1 located inside
      LEM-806-2, and the whole of Proposition 806-1 re-worked lemma by lemma with
      exhaustive recomputation in two analogues. From this Coordinator: the
      arithmetic corroboration of RT-1's eigenvector argument and RT-2's dimension
      count, both labelled CORRELATED and not independent; and the reading of
      DEC-20260731-014 that answers the red team's own flagged NR-9 dependency
      AGAINST the Coordinator.
    what_this_ruling_is_not: >-
      NOT a finding that Proposition 806-1 is wrong — it FOLLOWS, at one interface,
      on an independent re-derivation. NOT a closure of OD-4 as a lane, which is
      re-posed in Y with CAND-806-A's residual re-entering. NOT a defect charged to
      either producer for the screen, whose rule is the Coordinator's. NOT a claim
      that J = 2^24 is the global GF(2^8) minimum, which is UNRESOLVED. NOT an
      experimental refutation of the cost table's multiplicativity, since the
      direct composition was run by nobody at any scale. NOT a statement about AES
      at any round count.
    what_would_overturn_it: >-
      For (1): a record predating BATCH-004 that states the interface-counting rule
      in terms of layer-dependence rather than in terms of the graph, which would
      move the fault from the Coordinator to the producer — this Coordinator looked
      and found the opposite. For (2): CTRL-810-A outcome (iii), M-nonlinear
      tracking M-affine closely, which would materially weaken RT-3 and let the
      n-axis survive with a stated class caveat; or CTRL-810-A outcome (ii),
      |R^(n)| agreeing with the uncapped J^n anywhere at n >= 2, which the red team
      names as falsifying its own RT-2 and on which it says it would withdraw the
      objection. Either would be a wanted outcome.

  promotion_gates_status:
    engaged: true
    engaged_reason: >-
      ENGAGED FOR THE FIRST TIME IN THIS CAMPAIGN. TASK-20260801-806 advanced cost
      and asymptotic statements at more than one strength — Proposition 806-1,
      Corollary 806-2, and section 5.3's table in n with an explicit
      per-attempt-cost x inverse-success-probability product, a memory column, a
      meet-in-the-middle column and a parallelization claim — and the red team
      determined BRANCH A on exactly that basis. TASK-20260801-807 advanced none
      and its gates (1)-(3) are correctly not_engaged.
    gate_1_proof_decomposition: NOT_MET_AS_A_COST_MODEL_GATE
    gate_1_basis: >-
      Stands for the proposition ONLY and is DEGENERATE for the cost model.
      LEM-806-1..4 are genuinely single-responsibility and the Assembly is a
      correct finite minimisation the validator recomputed. Section 5.1 names an
      attempt, a per-attempt cost and a success probability and multiplies them —
      but the TABULATED column is the frontier column where p = 1 BY CONSTRUCTION,
      so the inverse-success factor is 1 and the bookkeeping does no work in the
      number actually used. Present and honest; not load-bearing.
    gate_2_numbered_heuristics: NOT_MET
    gate_2_basis: >-
      HEUR-806-3 and HEUR-806-4 carry no schedulable validation experiment and both
      are load-bearing; HEUR-806-4's failure alone puts column 2 in force where no
      barrier follows at any n <= 7. THREE UNNUMBERED CONDITIONAL DEPENDENCES, TWO
      OF THEM DISTINCT AND FOUND BY DIFFERENT REVIEWERS: U-809-1 (unrestricted
      state quantifier), RT-3 (nonlinear layer / F-linearity preservation along the
      composition), RT-4 (round-key obliviousness, on which p = 1 rests). RT-5 is a
      fourth and is UNRESOLVED. RT-6: HEUR-806-1 is numbered in the direction the
      model does NOT use, so the table is conditional on an unstated proposition
      RT-1 refutes at an exhibitable kernel. RT-7: HEUR-806-2's experiment tests the
      SATURATED form and cannot falsify column 3's UNSATURATED use. CREDIT:
      HEUR-806-1 and HEUR-806-2 are good specimens with genuinely falsifying,
      dispatchable experiments.
    gate_3_concrete_cost_table: NOT_MET
    gate_3_basis: >-
      Creditable content recorded in dispositions.SECTION_5_COST_TABLE. Not met
      because the central column's J = 2^32 is measured at six witnesses, is not
      established as a minimum, and is BEATEN by RT-1's kernel at 2^24; because
      RT-2 shows every n >= 2 entry exceeds the object's own frontier ceiling and
      the two decisive numbers are unattainable; because the affected-vs-safe
      statement names a window entirely past saturation; because no alternative
      baseline is costed; and because peak RSS was NOT MEASURED so every memory
      figure is modelled.
    gate_4_independent_review_and_red_team: NOT_SATISFIED
    gate_4_basis: >-
      BOTH HALVES WERE PERFORMED and neither is satisfied by anything the producer
      did. The gate is nevertheless NOT SATISFIED, and its independent-confirmation
      half is STRUCTURALLY UNSATISFIABLE under this harness: all five parties
      resolve to one model under inference-amendment 0137a051, so a validator
      CONCUR plus a red-team CONCUR is ONE DRAW FROM A CORRELATED PAIR. Absence of
      correlated blind spots cannot be certified by construction, and RT-3 is
      exactly the shape a shared prior produces. Recorded as UNSATISFIABLE rather
      than unattempted. NOT RE-SCOPED HERE.
    package_status: >-
      NO GATE PACKAGE STANDS. NOTHING MOVES BEYOND `analyzed`. A claim missing any
      gate may reach `analyzed`, NEVER `supported`, and this batch misses all four.
    scheduled_validation_experiment: >-
      REQUIRED AND NAMED, so that a conditional result is not left unpaired. The
      Coordinator contract requires a conditional result to be paired with a
      heuristic-validation experiment in the same or the FOLLOWING batch.
      CTRL-810-A — the saturating frontier census, both composition models, with
      ker(M+I) added to the GF(2^8) witness list, plus HEUR-806-1's own already
      specified GF(2^8) census as its secondary leg — IS that experiment, settles
      RT-1/RT-2/RT-3/RT-5, and is REQUIRED to be the FIRST producer item of
      BATCH-005 if BATCH-005 exists. It carries a NAMED INFRASTRUCTURE BLOCKER: its
      GF(2^8) legs need numpy or a small C program and NEITHER IS INSTALLED, which
      is infrastructure signal and not a mathematical constraint, and the BATCH-005
      queue must resolve it before declaring the task.

