  dispositions:
    PROPOSITION_806_1: >-
      CARRIED FORWARD AS A ONE-INTERFACE DERIVATION FACT ABOUT THE F-LINEAR
      ROUND-INDEPENDENT SUBCLASS, AND NOTHING MORE. It FOLLOWS: the validator
      worked LEM-806-1..4 in isolation, performed the Assembly its own way, and
      reproduced the minimum exhaustively over 78899 GF(2^4) subspaces and 527
      GF(2^2) subspaces, with the GF(2^8) intersection table, the minors and all
      three tightness witnesses recomputed. FIVE SCOPE CONDITIONS TRAVEL WITH EVERY
      CITATION AND NONE MAY BE DROPPED. (1) F-LINEAR pi ONLY: OD-4's class is
      arbitrary pi and R806-1 forbids quoting it as an OD-4 bound; section 6.1
      shows the counting route for arbitrary pi is BLOCKED, not merely unattempted.
      (2) ONE SUPER-BOX INTERFACE ONLY. Every multi-interface use is STRUCK pending
      CTRL-810-A: under RT-3 horn (b) the proposition GOVERNS NO INTERFACE AFTER
      THE FIRST, because pi composed with SubBytes is not F-linear and the proof
      uses F-linearity at LEM-806-2 and LEM-806-3; under horn (a) the composition
      is a single affine map and the n-axis has no cipher content. At n = 1 NEITHER
      HORN BITES, since Phi = ARK.MC.SR is one round's affine tail and contains no
      SubBytes, so the proposition ITSELF is untouched by RT-3. (3) IT IS
      L-INDEPENDENT AND IS THEREFORE NOT A COST INEQUALITY (D-809-4); the
      campaign's record of the yield is "an exact one-interface branching formula
      for a strictly linear subclass, plus a proof that OD-4's hoped-for inequality
      shape cannot exist", and NEVER "a cost inequality was obtained".
      (4) IT CARRIES AN UNNUMBERED CONDITIONAL DEPENDENCE, U-809-1: the
      unrestricted "for every state s" quantifier, inherited via LEM-806-2, absent
      from R806-1..7 and from every heuristic, and DEMONSTRATED RESTRICTABLE BY
      THIS BATCH'S OWN OTHER PRODUCER. Until it is numbered as HEUR-806-5 with a
      paired validation experiment, gate (2) fails on it and NO cost or barrier
      reading may rest on the proposition. (5) ITS OPERATIVE PROPERTY IS P — "no
      proper nonempty S has W_S contained in F^S" — NOW GENUINELY ISOLATED by
      VALIDATOR-SIB-1 and VALIDATOR-SIB-2, which are invertible, NOT
      block-decomposable, violate P alone and BOTH read min B = 1; the producer's
      stated isolation "M has no zero block" is OVER-STRONG BY ONE NOTCH (D-809-5),
      "no zero block" being sufficient to break the bound and not necessary. AES's
      M has all entries nonzero and satisfies P unconditionally, so the proposition
      is unaffected. THE PROPOSITION IS NOT PROMOTED AND IS NOT MADE OFFICIAL.
    COROLLARY_806_2: >-
      CARRIED FORWARD ONLY AS ARITHMETIC ON PROPOSITION 806-1, AND WITH ITS OWN
      COUNTER-WITNESS ATTACHED. L + Y <= 24 is an immediate rearrangement of
      B >= 2^8 with the trivial ceiling B <= 2^(32-L); its content beyond
      "B >= 256" is arithmetic and not new mathematics, and the producer says so
      itself. The red team's boundary remark is adopted: section 6.2's witness has
      L + Y = 31 > 24, so it is SIMULTANEOUSLY A WITNESS THAT COROLLARY 806-2 DOES
      NOT EXTEND PAST THE F-LINEAR CLASS, and the two statements must always be
      read together.
    OD_4: >-
      ANSWERED NO AS LITERALLY POSED, AT THE CLOSURE STANDARD, AND THE CLOSURE IS
      ACCEPTED. The Step-1/2/3 machinery does not force a B-L-n inequality; the
      named breaking step is Step 2's first sentence and it is the right step on an
      independent re-derivation; the two further failures (Step 2's union over
      varying confining sets, Step 3's non-transitivity) are also correct. THE
      TRIVIAL-CEILING OBSTRUCTION IS ACCEPTED AS A GENUINE NAMED OBSTRUCTION,
      attacked by the red team and NOT BROKEN, subject to D-809-3's phrasing
      correction (proved for STRICTLY increasing f). OD-4 IS NOT CLOSED AS A LANE:
      it is RE-POSED IN THE YIELD Y rather than in B, and CAND-806-A's remaining
      content — a bounded-index subgroup statement replacing Step 3's group closure
      — is an OPEN QUESTION that RE-ENTERS the candidate pool under RT-8.
    SECTION_5_COST_TABLE: >-
      STRUCK AS UNUSABLE, IN EITHER DIRECTION, AND MAY NOT BE CITED AS EVIDENCE OF
      ANYTHING. Its central column is BEATEN by an exhibitable GF(2^8) kernel at
      J = 2^24 (RT-1); every n >= 2 entry EXCEEDS ITS OWN OBJECT'S FRONTIER CEILING
      and the two numbers the whole reading turns on — 2^128 at n = 4 and the MITM
      2^112 at n = 7 — are above the largest ceiling 2^96 and are NOT ATTAINABLE
      (RT-2); the composition class is UNSTATED and on one horn voids the per-step
      factor entirely (RT-3); round-key knowledge is UNCHARGED and p = 1 rests on
      it (RT-4); intermediate-profile reachability is UNASSERTED (RT-5); two of its
      four heuristics are OPEN AND BLOCKING; its heuristics are numbered in a
      direction the model does not use (RT-6) and paired with an experiment that
      cannot falsify the use made of them (RT-7); and peak RSS was NOT MEASURED, so
      every memory figure is MODELLED. The producer's own posture — that the table
      may not be read as a barrier — is upheld and is now insufficient rather than
      sufficient: with RT-1 and RT-2 the table would not support a barrier reading
      EVEN IF HEUR-806-3 AND HEUR-806-4 CLOSED TOMORROW. Its creditable features
      (memory beside time, a disclosed MITM trade-off that weakens its own reading,
      parallelization, the 2^72 o(1) disclosure, six direction-flagged assumptions,
      an accurate affected-vs-safe list) are recorded as the standard a future cost
      package should meet, and as satisfying no gate.
    D_705_5_HOLE_ii: >-
      NARROWED AND RELOCATED, AND STILL OPEN. The named place is not where the
      restriction bites: the sweep of u_k survives in 87.5 % of admissible
      configurations and needs ONE FREE BYTE IN THE RIGHT PLACE, reproduced exactly
      by an independent from-scratch implementation and derived analytically two
      ways. The binding constraint is Step 2's RE-APPLICATION of Step 1, which
      needs a translation with all four coordinates nonzero realisable as an
      input-word difference and hence needs SOME INPUT WORD ENTIRELY FREE. THIS IS
      A DESCRIPTION OF A MEASURED FAMILY IN A GF(2^4) ANALOGUE, EXPLICITLY NOT A
      THEOREM AND NOT EXHAUSTIVELY CHARACTERISED: the closure fixpoint was
      re-executed by nobody and the red team re-executed none of 807's
      measurements. THE RESIDUAL IS REAL AND ITS PROMINENT INHABITANTS ARE ALREADY
      EXCLUDED: objects propagating only on state sets with no entirely-free input
      word include every delta-set shape tested, which are exactly the delta-sets
      of the integral and DS-MITM families. THE SHARP OPEN QUESTION: is "some input
      word entirely free" NECESSARY as well as sufficient? Decidable by exhaustive
      computation over all 2^16 patterns in the same analogue; DROPPED FOR BUDGET
      (DEV-807-4) and therefore UNMEASURED, NOT ANSWERED.
    TASK_20260801_801_SECTION_5: >-
      MECHANISM CORRECTION RECORDED; THE RECORD STANDS EXACTLY AS WRITTEN AND IS
      NOT EDITED, NOT SUPERSEDED AND NOT DEFECT-CHARGED. Its clause naming Step 2's
      sweep as consuming the full quantifier is FALSE AS STATED on the narrow
