  rationale:
    - >-
      THREE REVIEW VERDICTS ARE KEPT DISTINGUISHABLE AND ARE NOT AVERAGED INTO A
      BATCH GRADE. The validator issued no combined verdict by design and none is
      manufactured here; the red team's pass is a THIRD object and is not merged
      into either validator verdict. A sound derivation in one group does not
      validate a screen in the other, and the red team's MAJOR findings against
      the cost model do not touch the derivation the validator worked lemma by
      lemma. EV-AES-004 records them as separate observation groups with per-group
      scope statements.
    - >-
      WHAT THIS BATCH ACTUALLY PRODUCED, STATED PLAINLY: a clean, argued,
      independently re-derived NO to the campaign's only exponent-relevant
      question; an EXACT one-interface branching formula for a strictly smaller
      class than the one asked about, by a different machine, which FOLLOWS; a
      trivial-ceiling obstruction that the red team attacked and COULD NOT WALK
      PAST, showing OD-4's hoped-for inequality SHAPE cannot exist and that the
      question must be re-posed in the yield Y; an exhaustive quantifier
      computation that NARROWS AND RELOCATES D-705-5 hole (ii) and produces a
      mechanism correction to a committed record; an OD-3 screen returning
      NO_ADMISSIBLE_MEMBER conditional on unverifiable recollections; and A FIRST
      RED-TEAM PASS THAT VOIDED THE ONLY COST MODEL THE CAMPAIGN HAD. It produced
      NO cryptanalytic result and NO claim about AES at any round count, and zero
      cryptanalytic compute was spent on AES itself for the fourth consecutive
      batch. That is the honest headline and it is EV-AES-004's
      headline_non_result.
    - >-
      THE NEGATIVE IS THE RESULT, AND IT IS A REAL ONE. OD-4 as literally posed is
      answered NO: the Step-1/2/3 machinery does not force a B-L-n inequality. The
      breaking step is named — THE FIRST SENTENCE OF STEP 2 — and it is the RIGHT
      step on the validator's own re-derivation: PROP-701-I is an induction whose
      engine is that its conclusion type EQUALS its hypothesis type, Step 1
      consumes EQUALITY of pi-values and under B > 1 emits only B-CONFINEMENT
      which is strictly weaker for every B >= 2, so the feedback edge does not
      typecheck and the induction fails at its FIRST step INSIDE INTERFACE 1,
      before any traversal. Two further independent failures sit behind it and are
      also confirmed: Step 2's union is over DIFFERENT confining sets because
      R_j(x) varies with x, and Step 3's group closure fails because B-confinement
      is NOT TRANSITIVE — no equivalence, no group, no span, which the validator
      records as the deepest of the three and the reason no care at Step 2 rescues
      the machinery. This meets the inventor-protocol section 4 CLOSURE standard —
      named obstruction, argument, forward guidance that is specific and
      falsifiable — and NOT the fatigue standard, and it is recorded as a COMPLETE
      AND VALUABLE OUTCOME, exactly as the card said it would be.
    - >-
      THE ONE CLOSURE THE RED TEAM ATTACKED AND COULD NOT BREAK IS THE ONE THAT
      MATTERS MOST FOR DIRECTION. Section 6.2 derives that a single GF(2)-linear
      functional on >= 2 bytes gives |X| = 2, L = 31 and B = 2, hence
      B <= |X| = 2^(32-L) always. The red team's finding: THE CORE INEQUALITY IS
      NOT A MODELLING STEP — B is a cardinality of a subset of X, so it is an
      IDENTITY OF THE DEFINITION, AND NO CHOICE OF OBJECT CLASS EVADES IT. It
      reports this as a TESTED result rather than as untested agreement, which is
      the conduct this program asks for and which is why it counts for more than
      silence would. Consequence, adopted as the batch's main forward guidance:
      OD-4 MUST BE RE-POSED IN THE YIELD Y = log2|X| - log2 B, NOT IN B, because B
      alone admits a trivial small value at large L carrying zero information. Two
      boundary remarks travel with it: section 6.2's witness has L + Y = 31 > 24,
      so it is SIMULTANEOUSLY a witness that Corollary 806-2 does not extend past
      the F-linear class; and the closure rules out f increasing in L GLOBALLY, not
      on a restricted range, and rules out no bound in Y. D-809-3 attaches: the
      universal phrasing is proved only for STRICTLY increasing f and is one notch
      stronger than the argument.
    - >-
      PROPOSITION 806-1 FOLLOWS, AND THE SCOPE IT MAY BE CARRIED FORWARD IN IS
      NARROW AND IS FIXED HERE. The validator worked LEM-806-1 through LEM-806-4
      in isolation, performed the Assembly minimisation ITS OWN WAY from its own
      arithmetic taking no producer code or constant, recomputed
      dim(W_S cap F^S) = max(0, 2s-4) over GF(2^8) for all 16 subsets, recomputed
      69 minors with 0 singular, recomputed all three tightness witnesses, and
      reproduced the producer's exhaustive GF(2^4) table EXACTLY over 78899
      subspaces and the GF(2^2) table exactly over 527. THE BOUND FOLLOWS. The
      validator further notes the producer UNDERSTATES it: since the Assembly
      proves min exponent = 1 over ALL admissible (S, dim K) and the witnesses
      attain it, B >= q is the EXACT MINIMUM. And it rules the producer's framing
      HONEST and its scoping CORRECT — no step uses group growth, the (lambda,k)
      graph, transitivity of invariance, or more than one interface, verified by
      WORKING the proof rather than reading it, and no place in the package quotes
      the bound as an OD-4 bound.
      IT IS NOT A COST INEQUALITY IN THE CARD'S SENSE, AND THAT MUST NOT BE
      MIS-TRANSCRIBED. D-809-4 (medium): the card asked for a bound on B FOR A
      GIVEN ENTROPY LOSS, and Proposition 806-1's bound is INDEPENDENT OF L, so
      there is NO trade-off between L and B in it at all; Corollary 806-2 restores
      a trade-off SHAPE only by substituting a different quantity and is an
      immediate rearrangement of B >= 2^8 with the trivial ceiling. THE VALIDATOR'S
      FORMULATION IS ADOPTED VERBATIM AS THE CAMPAIGN'S RECORD OF WHAT THIS
      PACKAGE YIELDED: AN EXACT ONE-INTERFACE BRANCHING FORMULA FOR A STRICTLY
      LINEAR SUBCLASS, PLUS A PROOF THAT OD-4's HOPED-FOR INEQUALITY SHAPE CANNOT
      EXIST — AND NOT "A COST INEQUALITY WAS OBTAINED". No downstream record may
      use the second form.
    - >-
      RT-3 IS THE FINDING THAT FIXES HOW FAR PROPOSITION 806-1 MAY BE CARRIED, AND
      IT IS A DIFFERENT UNNUMBERED DEPENDENCE FROM THE VALIDATOR'S. Phi =
      ARK.MC.SR is PURELY AFFINE and the proposition is proved for ONE such Phi;
      section 5 then multiplies the per-interface factor across n consecutive
      super-box interfaces, while "SubBytes", "S-box", "sbox" and "nonlinear"
      appear ZERO TIMES in the report, verified by grep over the committed bytes.
      Either (a) no nonlinear layer is present, in which case Phi^n is a SINGLE
      AFFINE MAP that saturates at RT-2's ceiling and is not J^n and the n-axis has
      no cipher content; or (b) one is present, as it is between AES super-box
      interfaces, in which case pi composed with SB is not F-linear and
      PROPOSITION 806-1 GOVERNS NO INTERFACE AFTER THE FIRST, since its proof uses
      F-linearity at LEM-806-2 and LEM-806-3. NEITHER ALTERNATIVE IS STATED and
      HEUR-806-2 numbers only multiplicativity, not the class assumption horn (b)
      destroys. The red team records against its own convenience that the section 0
      disclaimer and R806-2 absorb SOME exposure but not this, because the defect
      is not "this is a model" but "THE MODEL'S PER-STEP FACTOR IS DERIVED IN A
      CLASS THE MODEL'S OWN COMPOSITION LEAVES". THE RULING FOLLOWS DIRECTLY AND IS
      RECORDED IN dispositions: Proposition 806-1 is carried forward AT ONE
      INTERFACE ONLY, and every multi-interface use of it is STRUCK pending
      CTRL-810-A. Note precisely what RT-3 does and does not reach: AT n = 1
      NEITHER HORN BITES, because Phi is exactly one round's affine tail and
      contains no SubBytes, so the proposition itself is untouched.
    - >-
      THE COST TABLE DOES NOT SURVIVE, AND IT WOULD NOT SURVIVE EVEN IF ITS TWO
      OPEN HEURISTICS CLOSED TOMORROW. RT-1 (MAJOR, DEMONSTRATED): a GF(2^8) kernel
      with joint branching J = 2^24 exists STRICTLY BELOW the central column's
      2^32, found by re-running THE PRODUCER'S OWN UNMODIFIED CODE on an input it
      did not try — rank drops iff Mv lies in span(v), i.e. iff v is a MixColumns
      eigenvector; M's only eigenvalue is 0x01, M + I is singular, and
      ker(M+I) = span(1,1,1,1) reads J = 2^24 in under a second. The red team
      additionally scanned all 1534 dim-1 kernels of support <= 2 and 3000 random
      full-support kernels, ALL reading 2^32: THE PRODUCER'S WITNESSES WERE
      STRUCTURED ALONG SUPPORT AND THE DISCRIMINATING AXIS IS EIGENVECTOR-NESS.
      This Coordinator independently corroborated the algebra — each row of the AES
      circulant (02,03,01,01) XOR-sums to 0x01, so M(1,1,1,1) = (1,1,1,1) and
      (1,1,1,1) lies in ker(M+I), while the witness e0 is not an eigenvector — and
      records that corroboration as COORDINATOR-SIDE AND CORRELATED, not as
      independent validation. With J = 2^24 the column crosses 2^128 at n ~ 5.33
      not 4 and the n = 7 MITM entry is 2^84 not 2^112.
      RT-2 (MAJOR, DEMONSTRATED): COLUMN 3 EXCEEDS ITS OWN OBJECT'S CEILING. The
      n-interface frontier lives in X^4 of F-dimension 4(4 - dim K), capped
      unconditionally at 2^96 / 2^64 / 2^32 for dim K = 1/2/3; the three witnesses
      generating J = 2^32 are exactly those three, so the n = 7 entry 2^224 AND the
      MITM 2^112 are both ABOVE THE LARGEST CEILING and are NOT ATTAINABLE. The
      producer flagged saturation in a heuristic's status and DID NOT CARRY THE
      FLAG INTO THE NUMBERS IT VOIDS: section 5.5's "weakly pressured at L = 16
      across n >= 4" names a window entirely past saturation, since at L = 16 the
      ceiling is reached at n = 2. NOTHING IN THE TABLE SUPPORTS "THE COST CROSSES
      2^128 AT n = 4".
      THE RED TEAM'S OWN HONESTY IS PRESERVED AT FULL STRENGTH: RT-1 CONFIRMS
      rather than falsifies HEUR-806-1 and does NOT establish 2^24 as a global
      minimum; RT-2 is a DIMENSION COUNT, not an experiment, and it names the
      outcome that would falsify its own objection. Independently of both, the
      producer itself states that the table may not be read as a barrier while
      HEUR-806-3 and HEUR-806-4 are open, and the red team concurs and goes
      further. THE TABLE IS STRUCK AS UNUSABLE IN EITHER DIRECTION.
    - >-
      THE F-1 MECHANISM CORRECTION: BOTH COMMITTED RECORDS ARE RIGHT,
      ASYMMETRICALLY, AND NEITHER IS EDITED. TASK-20260801-801 section 5 states
      that "both Step 1's hyperplane construction and Step 2's sweep of u_k over
      all of F consume the full quantifier, so the proof does not survive the
      restriction even partially". The independent ruling, adopted in full:
      (1) ON THE NARROW QUESTION — does u_k range over all of F — TASK-20260801-807
      IS RIGHT AND TASK-20260801-801 IS FALSE AS STATED. The validator reproduced
      807's measurement EXACTLY from its own arithmetic (2097152 configurations,
      reach sizes exactly {1,16}, histogram 262144/1835008, 57 measured against 57
      pre-registered) and DERIVED both headline numbers analytically two ways, so
      the agreement is not two programs sharing a bug. The sweep needs ONE FREE
      BYTE IN THE RIGHT PLACE.
      (2) ON THE WIDE QUESTION — does Step 2's CONCLUSION survive —
      TASK-20260801-801 IS RIGHT and 807 agrees in its own 2.5(2): Step 2 does two
      things in one sentence, and under restriction the union delivers invariance
      only on the M-image of a coordinate subspace of dimension 1 + |J|.
      (3) ON THE CONCLUSION "does not survive the restriction even partially"
      TASK-20260801-801 IS RIGHT, and 807's data support it MORE STRONGLY THAN
      801's OWN ARGUMENT DID: constancy is forced for only 2 of 13 state families
      and for NO delta-set at 1, 2, 4 or 8 active bytes.
      THEREFORE TASK-20260801-801 NAMED THE WRONG MECHANISM FOR A CORRECT
      CONCLUSION, and the load-bearing use of the full quantifier is Step 2's
      RE-APPLICATION of Step 1. RECORDED AS A MECHANISM CORRECTION AND NOT AS A
      DEFECT IN TASK-20260801-801's DISPOSITION: its "hole (ii) stands open,
      untouched" verdict is unaffected and nothing it concluded is overturned. THE
      COMMITTED RECORD STANDS EXACTLY AS WRITTEN AND IS NOT EDITED; the correction
      lives in EV-AES-004 and here. TASK-20260801-807's decision to record the
      contradiction rather than smooth it is correct conduct and is credited. The
      validator's caveat against its own ruling is preserved: the relocation is a
      description of a MEASURED FAMILY, explicitly not a theorem and not
      exhaustively characterised, the closure fixpoint was re-executed by NOBODY,
      and the red team re-executed NONE of 807's measurements — so it is
      WELL-EVIDENCED BUT NOT ESTABLISHED.
    - >-
      RT-8 AND RT-9 ARE UPHELD AS PRE-SCREEN DEFECTS, AND THE SOURCE OF RT-8 IS
      THIS COORDINATOR'S OWN PRIOR TEXT. RT-8 (MAJOR): the two sibling screens,
      frozen the same day under language declared identical, assign n = 30 and
      n = 1 to the same structural object. prescreen_od3.json froze BEFORE ANY WORK
      that for a ROUND-INDEPENDENT pi every graph-traversal step happens at the
      SAME single interface with the SAME pi, so n = 1, attributing Proposition
      801-1's 32 specifically to LAYER-DEPENDENCE. prescreen_od4.json killed
      CAND-806-A at n = 30 by reading the graph's forward DIAMETER as an INTERFACE
      COUNT — while OD-4's object is EXPLICITLY round-independent by the 806
      report's own section 2. 807's RULE IS RIGHT AND 806's n = 30 IS WRONG, and
      the R-5 ruling that supports it is adopted: the screen's own question_c
      measures consecutive SUPER-BOX INTERFACES, and for round-independent pi
      Steps 1-3 iterate over the INVARIANCE GROUP, not over successive
      applications of Phi. THE ASYMMETRY IS THE DIFFERENCE BETWEEN AN INDEX OVER A
      GROUP AND AN INDEX OVER TIME, and Proposition 801-1's 32 is legitimate for
      the opposite reason, because ITS pi is layer-dependent.
      THE RED TEAM FLAGGED A DEPENDENCY RATHER THAN CONCEALING IT (its NR-9): it
      did not read DEC-20260731-016, KN-FIND-018 or EV-AES-003 in full and said
      RT-8 would need revisiting if they contain a basis for the n = 30 reading
      that the screens do not quote. THIS COORDINATOR HAS READ THEM AND ANSWERS
      THE DEPENDENCY AGAINST ITSELF: DEC-20260731-014's forward guidance says "any
      future closure attempt built on SPREADING INVARIANCE THROUGH THE (lambda,k)
      GRAPH must produce a constant of at most about 7 interfaces", and it DOES NOT
      DISTINGUISH round-independent from layer-dependent traversal — it derives its
      constant from Proposition 801-1, whose pi IS layer-dependent. THE AMBIGUITY
      ORIGINATES IN THE COORDINATOR'S OWN GUIDANCE, which stated the rule in terms
      of THE GRAPH rather than in terms of LAYER-DEPENDENCE. That is recorded as
      D-811-2 (medium, coordinator-side), and RT-8 STANDS.
      MATERIALITY, AND IT IS NOT FULLY MOOT. CAND-806-A was the route to OD-4's
      hoped-for inequality. Its content was PARTLY recovered anyway, since section
      3 shows the induction breaks under B > 1 — but NOT WHOLLY: section 3.3
      route 2, "a bounded-index subgroup statement replacing the group closure", is
      PRECISELY CAND-806-A's remaining content, is explicitly left as a genuine
      open question, and was screened out at a constant its sibling says is 1.
      RT-9 (MAJOR): the "no upper bound exhibited" kill rule is defensible as
      BUDGET TRIAGE and is NOT defensible as an IN_SCOPE_VACUOUS verdict.
      IN_SCOPE_VACUOUS is a predicate on the CANDIDATE; "no upper bound exhibited"
      is a fact about THE PRODUCER'S TIME. Per inventor-protocol section 4 it names
      NO OBSTRUCTION and is, in the protocol's own language, A FATIGUE REPORT ABOUT
      THE SEARCH. Both mitigations are real and are credited — CAND-806-E was
      killed on BOTH grounds and CAND-B4 is carried forward as a named residual
      rather than as a closure — and the LABEL IS STILL WRONG: "3 of 7 killed" and
      "2 of 6 killed" ARE COUNTS THAT MIX A RULING WITH AN ABSTENTION.
      NEITHER PRODUCER DODGED. The red team states explicitly that 807 froze the
      n = 1 distinction before any derivation and before any code, anchored by a
      COMMITTED SHA-256 rather than an mtime, precisely so it could not be
      constructed afterwards, and it verified that ordering claim is anchored in
      committed bytes. THE DEFECT IS IN THE RULE, NOT IN ITS AUTHOR'S CONDUCT, and
      the rule is the Coordinator's.
    - >-
      WHAT THE SCREEN MUST BECOME, RULED HERE AND ENACTED IN THE BATCH-005 QUEUE
      RATHER THAN IN THIS RECORD. FIVE requirements, each traceable to a finding.
      (i) RENAME IT FOR WHAT IT DOES: it is a LAYER-DEPENDENCE SCREEN, not an
      iteration-count screen. RT-11 demonstrates that its advertised variable and
      its operative variable have come apart — every IN_SCOPE_VACUOUS verdict
      across both tasks tracks layer-dependence or unboundedness, and NO candidate
      was ever killed for taking many steps at one interface.
      (ii) ONE INTERFACE-COUNTING RULE, CAMPAIGN-WIDE, ADOPTING 807's: n counts
      consecutive SUPER-BOX INTERFACES over which the tracked object must survive;
      a traversal of the invariance group at a fixed interface with a fixed pi
      costs n = 1. DEC-20260731-014's graph-phrased guidance is SUPERSEDED on this
      point by the present decision.
      (iii) A DISTINCT VERDICT VALUE, DEFERRED_UNBOUNDED, kept OUT of any count of
      candidates the screen has RULED vacuous, so that no future record again
      reports an abstention as a ruling.
      (iv) n = 1 IS NOT A LICENCE. Thirty group-traversal steps at one interface is
      not thereby cheap, tractable or in scope — only not INTERFACE-vacuous. The
      screen was never a tractability proxy and must not be read as one now that
      its threshold binds on almost nothing; a SEPARATE, EXPLICIT tractability
      judgement is required alongside it.
      (v) THE ~7 THRESHOLD MUST BE RESTATED AGAINST THE QUANTITY IT ACTUALLY
      BOUNDS. RT-10: the screen asserts a fact about AVAILABLE CIPHER INTERFACES
      and applies it to THE ARGUMENT'S ITERATION COUNT, and RT-8 proves these
      differ. Both screens do check the tighter one-interface-per-super-box
      conversion and that check is sound and is credited; under it the in-scope
      budget is 3 and THE SCREEN IS TOO PERMISSIVE, NOT TOO STRICT, and the
      advertised margins are overstated by more than a factor of two.
      CONSEQUENCE FOR THE CANDIDATE POOL: CAND-806-A's residual — the bounded-index
      subgroup question — RE-ENTERS as a candidate rather than standing as a kill.
    - >-
      GATE (4)'s UNSATISFIABLE HALF IS RECORDED AS UNSATISFIABLE, NOT AS
      UNATTEMPTED, AND THE DIFFERENCE IS THE POINT. RT-13 is adopted. Gate (4) as
      written cannot be marked satisfied by TASK-20260801-809 plus
      TASK-20260801-810: producer, validator, red team and this Coordinator all
      resolve to one model under inference-amendment 0137a051, so A VALIDATOR
      CONCUR PLUS A RED-TEAM CONCUR IS ONE DRAW FROM A CORRELATED PAIR, NOT TWO
      DRAWS, and any promotion argument of the form "two reviewers agreed" IS
      INVALID HERE. Absence of correlated blind spots CANNOT be certified BY
      CONSTRUCTION, and RT-3 — SubBytes unmentioned in a report about n chained AES
      super-box interfaces — is exactly the shape a shared prior produces; that one
      reviewer caught it is weak counter-evidence at best.
      WHAT THE PAIR DID DELIVER IS REAL AND IS RECORDED AT FULL VALUE, because
      writing gate (4) off entirely would be as dishonest as claiming it satisfied:
      MODEL-FREE evidence integrity (eight digests verified twice, independently);
      MECHANICAL REPRODUCIBILITY THAT IS NOT VACUOUS, since RT-1 came from
      re-executing the producer's own code on an untried input and CHANGED A
      HEADLINE NUMBER; SESSION independence, which excludes carry-over of one
      chain of thought; and NAMED ADVERSARIAL COVERAGE with NINE unrun attacks
      enumerated, including Proposition 806-1's own proof, which the red team
      labels "an absence of attack, NOT A CLEARANCE".
      THE RED TEAM NAMED THREE HONEST OPTIONS WITHOUT CHOOSING AND THIS DECISION
      CHOOSES DELIBERATELY AND NARROWLY. Gate (4) is recorded as NOT SATISFIED with
      its independent-confirmation half marked STRUCTURALLY UNSATISFIABLE UNDER
      THIS HARNESS. THE GATE IS NOT RE-SCOPED HERE: gate (4) is a rule of
      agents/coordinator.md and AGENTS.md rule 12, and re-scoping a review
      requirement AFTER OBSERVING AN OUTCOME requires a versioned protocol
      amendment, which this decision does not enact — the same discipline
      DEC-20260731-014 applied to DEC-20260731-011's certification condition and
      which produced amendment 004. What IS ruled: NO promotion and NO transition
      toward `supported`, in this campaign or elsewhere in this program, may rest
      on gate (4) being satisfied by a validator-plus-red-team pair under one
      resolved model; and ROUTING A GENUINELY DIFFERENT BACKEND FOR AT LEAST ONE
      REVIEWER is the only route that makes gate (4) satisfiable and is named as
      the standing precondition for any future asymptotic promotion.
    - >-
      NO GATE PACKAGE STANDS, AND NOTHING MOVES BEYOND `analyzed`. Gate (1) stands
      for the proposition only and is DEGENERATE for the cost model, because the
      tabulated column is the frontier column where p = 1 BY CONSTRUCTION so the
      inverse-success factor does no work in the number used. Gate (2) DOES NOT
      STAND and now carries THREE unnumbered conditional dependences found by TWO
      REVIEWERS WHO FOUND DIFFERENT ONES — U-809-1 (the unrestricted state
      quantifier), RT-3 (the nonlinear layer and class preservation), RT-4
      (round-key obliviousness, on which p = 1 silently rests) — plus RT-5
      unresolved, plus RT-6 (the heuristic is numbered in the direction the model
      does NOT use) and RT-7 (its companion experiment cannot falsify the use made
      of it). Gate (3) DOES NOT STAND. Gate (4) is NOT SATISFIED. The producer
      requested NO promotion and asserted NO gate satisfied; the validator concurs
      with that posture; the red team recommends AGAINST any promotion resting on
      gate (4) and observes there is nothing here to promote in any case. ALL
      THREE ARE ADOPTED. No hypothesis record exists for this campaign, so nothing
      is transitioned; the gates are recorded per gate in EV-AES-004 and here so a
      later batch cannot quietly bypass them.
    - >-
      NO ADVERSE TRANSITION IS TAKEN, AND THE REFUTATION ARTIFACTS FOR THE
      ADVERSE-LOOKING ACTS ARE ALREADY COMMITTED. This decision weakens no
      hypothesis (none exists), rejects no scope, and closes no lane. NO
      reject_scoped of the round-independent single-word deterministic class is
      taken, FOR THE THIRD CONSECUTIVE BATCH: V-804-1 stands, no control yet
      ISOLATES the ingredient such a closure would negate for GATE-701-C v2, and
      TASK-20260801-807's null_3 — which DOES isolate strong connectivity for ITS
      OWN statistic, reproduced by the validator from its own edge rule — does not
      transfer, because ISOLATION IS A PROPERTY OF AN INSTRUMENT, NOT OF AN
      INGREDIENT. The validator audited every V-804-1 reference in BATCH-004 and
      found NOTHING READS null_3 AS A DISCHARGE.
      The two adverse-looking acts here are (i) STRIKING section 5's n-axis as
      unusable and (ii) OVERTURNING TASK-20260801-806's n = 30 screen verdict for
      CAND-806-A. Neither is a hypothesis rejection, and both are nevertheless
      licensed by CHECKABLE REFUTATION ARTIFACTS THAT PRECEDE THIS DECISION: RT-1's
      witness with its exact reproduction recipe against the producer's own
      committed code; RT-2's one-line dimension count against the table's own
      entries; RT-3's grep-verifiable omission over committed bytes; and
      prescreen_od3.json's n = 1 rule, frozen before any work and committed in the
      cc660597 snapshot. The first three are committed in the ISOLATED PREDECESSOR
      COMMIT that must precede this ledger commit; the fourth is in the producer
      snapshot. Their declared basis is `derivation`, matching EV-AES-004's
      proof_status, and none of them is an unreplicated empirical-only run.
    - >-
      THE BUDGET POSITION IS THE BINDING FACT OF THIS DECISION AND IS STATED
      RATHER THAN SMOOTHED. On the measured basis of
      protocol-amendment-GOAL-AES-001-003, 19458 of 20000 seconds are charged and
      ROUGHLY 542 REMAIN. BATCH-005 CANNOT BE DISPATCHED ON THAT: its minimum
      credible shape — a coordination act, one producer, a snapshot archive, one
      review and a ledger archive — is an order of magnitude larger, and amendment
      003's own `standing_limit` requires a further amendment when measured
      consumption approaches the ceiling, with the declared pause condition firing
      if the ceiling is reached without one. THE EXPECTATION BASIS IS ALSO GONE:
      the campaign's over-declaration series 2.51x -> 1.55x -> 1.28x has flattened
      to ~1.01x at the batch level (6350 declared against 6307 charged), with TWO
      INDIVIDUAL PRODUCER TASKS OVER their declarations. The BATCH-004 queue judged
      BATCHES the scarcer resource; THAT JUDGEMENT IS FALSIFIED BY MEASUREMENT —
      after this batch, SECONDS BIND FIRST. Two of six batches remain and both are
      unreachable without a budget act.
    - >-
      THE CAMPAIGN IS NOT PAUSED, AND THAT IS A RULING ON THE MERITS RATHER THAN A
      DEFAULT — BUT IT IS ONE DECISION AWAY FROM A PAUSE AND THIS RECORD SAYS SO.
      A pause on a committed rationale is legitimate and is not failure, and it was
      weighed seriously here. THE CASE FOR PAUSING IS REAL: four batches have
      produced no cryptanalytic result and no claim about AES; the only
      exponent-relevant question is now answered NO at the closure standard; the
      only cost model the campaign built has been voided by its first red-team
      pass; no gate package stands; gate (4)'s confirmation half is structurally
      unsatisfiable here; and continuing requires a THIRD budget act on a ceiling
      already raised once and re-based once, whose prior justification — that
      declarations ran far above measured cost — IS NOW EXHAUSTED BY MEASUREMENT.
      THE CASE AGAINST PAUSING IS STRONGER, ON TWO GROUNDS, AND IT PREVAILS.
      FIRST AND DECISIVE: THIS BATCH'S OWN RED TEAM DEMONSTRATED THAT THE CAMPAIGN
      SCREENED OUT ITS BEST REMAINING EXPONENT-RELEVANT CANDIDATE ON AN ERRONEOUS
      CONSTANT (RT-8), and the error traces to this Coordinator's own guidance
      (D-811-2). CAND-806-A's residual — a bounded-index subgroup statement
      replacing Step 3's group closure, which is exactly the type-stable invariant
      section 3.3 identifies as what a repair would need — is EXPLICITLY OPEN,
      NEVER ATTEMPTED BY ANYONE, and was killed at n = 30 under a rule its sibling
      screen says gives n = 1. Stopping now would CLOSE THE CAMPAIGN ON A
      DEMONSTRATED SCREENING ERROR, which is the premature-closure failure
      docs/inventor-protocol.md names as symmetric with overclaiming, in its
      sharpest available form: not a general reluctance to search, but a specific
      candidate wrongly discarded and known to be wrongly discarded.
      SECOND: three MAJOR red-team findings are settled by ONE bounded, fully
      specified control, CTRL-810-A, which is simultaneously HEUR-806-1's own
      already-scheduled validation experiment — and this Coordinator's contract
      requires a conditional result to be paired with heuristic validation in the
      same or the following batch. Leaving RT-1, RT-2, RT-3 and RT-5 unsettled
      while the package that provoked them stands committed is worse than leaving
      them unraised.
      NEITHER GROUND JUSTIFIES A CEILING RAISE BY ITSELF, AND THIS DECISION DOES
      NOT TAKE ONE. Raising a campaign budget ceiling after observing outcomes is a
      protocol act, not a Coordinator convenience, and is enacted through a
      versioned amendment with its own rationale that a red team can attack — the
      DEC-20260731-014 -> DEC-20260731-016 pattern. This decision RULES ON WHAT
      THAT AMENDMENT MUST CONTAIN and DEFERS ENACTING IT. If the amendment is
      declined, the declared pause condition fires and GOAL-AES-001 goes to
      `paused` — never to `completed`, which is unreachable in this harness
      regardless of outcome — with the narrowest supported result recorded and one
      concrete next action preserved.
    - >-
      NOTHING IN THIS BATCH IS UPGRADED IN KIND. A derivation is a DERIVATION FACT
      and an exhaustive toy enumeration is a COMPUTATION FACT; neither is empirical
      cryptanalytic evidence about AES and neither supports any claim about AES at
      any round count. GF(2^4) and GF(2^2) are ANALOGUES and the GF(2^2) analogue
      is additionally not MDS. Claim tier is toy throughout, ceilinged by
      RQ-AES-001 and GOAL-AES-001. No literature comparison, recalled baseline,
      sota_delta, bit-margin or extrapolation enters this decision or EV-AES-004 in
      any form; exactly one recollection appears anywhere in the batch, is marked
      unverified-from-memory at LOW recall confidence, is load-bearing nowhere, and
      its content was recomputed twice rather than relied on.

