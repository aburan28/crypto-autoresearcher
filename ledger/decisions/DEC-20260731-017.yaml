    OD_3: >-
      NO_ADMISSIBLE_MEMBER RECORDED, CONDITIONALLY, AND THE LANE IS NOT CLOSED.
      Eight candidates, eight recorded as rediscoveries, ZERO admitted — so the
      handoff's named serious defect (a candidate wrongly admitted) cannot arise,
