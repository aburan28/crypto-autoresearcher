  id_provenance: >-
    DEC-20260731-017 was RESERVED by DEC-20260731-016 and was explicitly NOT
    independently verified free at that writing. IT WAS VERIFIED FREE HERE by
    directory listing of ledger/decisions: the highest existing AES-campaign
    decision is DEC-20260731-016 and no DEC-20260731-017 exists on this tree.
    EV-AES-004 was verified free the same way (EV-AES-001, -002, -003 are the
