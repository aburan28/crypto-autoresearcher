  limitations:
    - >-
      Zero runs, zero seeds, zero curves, zero sampled points, zero timings. The
      package is a static derivation and every number in it is either an exact
      binomial identity or an estimate conditional on HEUR-001. No measurement
      of any kind occurred and no cryptographic-scale label attaches anywhere.
    - >-
      The rejection is SCOPED and is not a universal impossibility claim. It
      does not assert that a bounded last fall degree is impossible for the
      digit presentation, that no index-calculus route can beat rho over prime
      fields, or anything about presentations at d != 2 beyond the degree fact
      itself - which, being a property of S_{m+1}, does apply at every base d
      and to every presentation keeping S_{m+1} as a generator.
    - >-
      The validator did not audit cost_table.py line by line and did not
      re-derive ck-curves.yaml point by point; its F2 second pass is not blind
      and its pre-hashed first pass disagreed with the archive by 2.0 in the
      exponent. Both passes are preserved.
    - >-
      The Huang-Kosters-Yeo relation connecting HEUR-001's two clauses is
      carried as provenance recalled with verified_by null. Neither reviewer
      opened it and it backs nothing in this decision.
    - >-
      Judgement across this round is correlated: producer and both reviewers
      report the same model family with model_verified false and no adapter
      resolution record.
    - >-
      This decision was composed by a Coordinator subagent with no shell and no
      interpreter. It ran no code, computed no hash, and did not execute
      tools/check_review_independence.py or tools/validate_ledger.py. Every
      number above is quoted from a committed reviewer report or from a
      committed record.
    - >-
      This record and the hypothesis transition it licenses are unverified until
      the orchestrating session runs the strict YAML parse and
      tools/validate_ledger.py on the merged tree and the post-commit verifier
      accepts the ledger archive.
  next_actions:
    - >-
      THE ONE NEXT ACTION FOR THIS LANE. Re-emit the concrete-cost table under a
      NEW experiment id, with delta = m min(2^{m-1}, s) in BOTH slices and a
      FEASIBILITY GATE that refuses to price any cell whose row count
      Ncols(n, D_0 - delta) is zero, with the prior converted into the declared
      cost unit (or the whole table restated in group-operation equivalents),
      with the solver's own dense working set added to the memory column, and
      with the construction cost of S_{m+1} and of the reduced generator charged
      (a bound of binom(s, 2^{m-1})^m terms is exact arithmetic and costs
      nothing to include). It is zero-compute. A cost script that cannot
      represent an empty matrix will keep manufacturing cells.
    - >-
      RECORDS THE ORCHESTRATING SESSION MUST ALLOCATE IDENTIFIERS FOR - each is
      a SUPERSEDING record, never an edit, because run records and ledger
      records are immutable. (a) A superseding derivation record carrying the
      corrected cost table at generator degree m 2^{m-1} and the feasibility
      gate, replacing the m >= 3 cells of runs/STATIC-001/cost-table.yaml and
      the D_0 = 2 rows of thresholds.yaml. (b) An annotation of
      IDEA-20260830-84cdb7 claim (A) and H-PFDR-06fd60 (A)-(B) recording that
      the generator degree is m 2^{m-1} and that the "2m" is correct only at
      m = 2, citing KN-TECH-002, RUN-PFDR-5726af-htop and
      IDEA-20260903-e1e38b (D3). (c) A correction note recording the A2
      miscount (the execution report's "7 of 9" P5 zero-binomial count is 6 of 9
      in its own artifact and in the validator's recomputation) and the
      corrected interior-band formula. None of these is created by this
      decision, and TASK-20260904-e6b4dd allocated no identifiers.
    - >-
      DO NOT QUOTE THE FOUR SUB-RHO CELLS AGAIN. Any future artifact citing
      (256, m 5, D_0 4, omega 2), (256, m 5, D_0 4, omega 2.807),
      (256, m 5, D_0 6, omega 2) or (256, m 5, D_0 8, omega 2) must carry that
      they price a Macaulay matrix with zero rows and that at m = 5 the
      generator cannot be written down within the claimed total. The affected
      conditional scope is EMPTY for a reason internal to the presentation, not
      merely unmeasured.
    - >-
      CARRY THE DEGREE COLUMN INTO RQ-PFDR-ae2fba's decision table as
      KN-FIND-0618ab records it: the floor m 2^{m-1} at m >= 2 and the measured
      D_0(s) = 4 + floor(s/2) at m = 2. The cost table's "D_0 <= 6 at 256 bits
      with omega = 2" is exceeded from s = 6 on at m = 2 and is unreachable at
      m >= 3.
