  decision: reject_scoped
  decision_label: >-
    reject_scoped_the_m_ge_3_cells_and_all_D0_eq_2_rows_of_the_conditional_cost_table_on_an_archived_counterexample_certificate_for_the_generator_degree_and_move_H_PFDR_06fd60_specified_to_analyzed
  target_ids:
    - EXP-PFDR-c04716
    - H-PFDR-06fd60
    - EV-PFDR-f71d7f
    - RQ-PFDR-ae2fba
  rationale:
    - >-
      THE SCOPED REJECTION, and what exactly is rejected. Joint R1 BREAKS by
      derivation: the digit-substituted summation generator has reduced total
      degree m min(2^{m-1}, s) = m 2^{m-1} - 4, 12, 32, 80 at m = 2, 3, 4, 5 -
      and not the "2m (degree 2 in each x_k)" of H-PFDR-06fd60 statement (A).
      Consequently delta > D_0 at every cell of the frozen grid, and
      rows(D_0) = Ncols(n, D_0 - delta) = ZERO at all 54 cost-table cells and at
      every D_0 = 2 threshold row. Rejected in scope, and rejected as a claim
      rather than merely unsupported: the conditional table's assertion that the
      hybrid optimum flips to k* = 0 with cells below Pollard rho at
      m in {3, 4, 5}, and the four cells reported as beating rho, and the
      thresholds.yaml D_0 = 2 rows at every m. The rejection is INDEPENDENT OF
      HEUR-001 and waits on no measurement.
    - >-
      WHY reject_scoped rather than weaken, stated against the rule that governs
      it. docs/claims-and-verification.md permits an adverse transition only on
      the strongest checkable refutation artifact the result admits, and forbids
      reject_scoped on a single unreplicated empirical-only run. The artifact
      here is a COUNTEREXAMPLE CERTIFICATE (tier 1): S_4 has total degree 12 in
      the unknowns rather than 6, and S_5, S_6 have 32 and 80 rather than 8 and
      10 - an explicit instance on which the prediction fails, re-checkable in
      about 25 seconds by a deterministic standard-library script whose
      instrument carries its own known-answer control. It is corroborated by
      three independent routes: this program's own KN-TECH-002 (per-variable
      degree 2^{n-2}), EXP-PFDR-5726af's symbolic run at m = 3 (total degree 12,
      per-variable [4,4,4]) and that experiment's reviewer at m = 4 (deg S_5 =
      32, leading coefficient 1). The orchestrating Coordinator session
      confirmed the first two directly from the committed tree, independently of
      the reports. Nothing about this rests on a run count.
    - >-
      A SECOND, INDEPENDENT GROUND, recorded because it survives even if the
      first were disputed. Joint R2 BREAKS: granting a generator of degree delta
      and ignoring the degree error, the degree-D_0 Macaulay matrix has at most
      Ncols(n, D_0 - delta) rows against Ncols(n, D_0) columns, its corank stays
      above 2^27 at every headline cell against N_sol = O(1), and the deficiency
      does not fall to O(1) until D >= n + delta - 1. A bounded solve is
      available only through a closure whose degree is d_lf, and d_lf >= d_ff >=
      delta + 1 = 13 / 33 / 81 at m = 3 / 4 / 5 - which EXP-PFDR-cbdefb
      independently measures as exactly delta + 1 at its boundary cells. Joint
      R4 BREAKS on a third ground unconditional on HEUR-001, on D_0 and on
      omega: the generator's top-degree part alone has binom(s, 2^{m-1})^m =
      2^221.3 nonzero terms at (256, m 5, D_0 4, omega 2), exceeding that cell's
      entire claimed total of 2^108.76.
    - >-
      THE PROVES-TOO-MUCH CONTROL FIRED ON 3 OF 4 OBJECTS, and its strongest
      finding needs no degree measurement at all. Fed the DIRECT presentation -
      an object with a proven floor d_lf >= B = 2^47 from IDEA-20260808-afe4ce -
      the same arithmetic emits 12 sub-rho cells of 18 at 256 bits, the best at
      2^94.95 against rho's 2^127.83, i.e. BETTER than the digit presentation's
      own headline. The survival is not localised anywhere, because no step of
      the argument ever compares D_0 with any generator degree: D_0 enters only
      through Ncols(., D_0), and the cost primitive raises a COLUMN count to a
      matrix-multiplication exponent, so an empty matrix and a solving matrix of
      the same width are charged identically. The control did NOT fire at m = 2,
      where the object is right - the arithmetic is right where the object is
      right.
    - >-
      WHAT SURVIVES, recorded as carefully as what fell, and NOT rejected. Joint
      R3 HOLDS and joints V1-V3 HOLD. The null-slice reproduction of
      IDEA-20260808-da1428 survives the degree correction - C(k) strictly
      decreasing with argmin at the enumerative leaf and assembly slope exactly
      N^1, at all six fixture cells and both omega and at all 54 balanced table
      cells, WITH delta = m 2^{m-1}. The marginal-cost sign derivation of claim
      (C) is correct within the model, with the exact crossing 1-3 residual
      variables below the asymptotic formula. The interior band, after P5's
      formula slip is repaired, is 2^{n - (2 - 2 omega)(D_0 - m)} and is still
      exponential in n, so the qualitative claim stands. The m = 2 arithmetic is
      right, above rho by 2^40 to 2^137, and m = 2 is the only region where the
      priced matrix has any rows. And the cost bookkeeping charges TOTAL expected
      cost - both reviewers independently re-derived B^{m+1} = m! 2^m C N and
      T = 2 B^2 from B relations, per-target success probability B^m/(m! N) and
      2^m C per call, so the inverse success probability is genuinely carried in
      every tabulated number. The package's honesty is not in question; its
      object is.
    - >-
      THE HYPOTHESIS IS NOT REJECTED, and this is a deliberate refusal to
      overclaim in the adverse direction. The red team states, and this decision
      adopts, that it does NOT follow that a bounded last fall degree is
      impossible for the digit presentation - a D_0 = m 2^{m-1} + O(1) constant
      in s is excluded by no argument in this round - nor that the digit
      presentation is worse than the direct one, since its floor m 2^{m-1} does
      NOT grow with the factor base, unlike afe4ce's B, which is a real
      structural gain. H-PFDR-06fd60 moves specified -> ANALYZED, not rejected.
    - >-
      THE PROMOTION CEILING IS INDEPENDENTLY BINDING. H-PFDR-06fd60 carries an
      asymptotic-complexity claim (a conditional exponent), so under the four
      promotion gates of agents/coordinator.md it may not move toward supported
      at all here: gate 1 fails (no lemma decomposition survives the degree
      correction), gate 2 fails (HEUR-001 at the tabulated D_0 is excluded by
      the generator's own degree), gate 3 fails (the cost table prices an object
      with no rows, mixes field and group operation units, and understates the
      solver's working set by up to 2^39.9), and gate 4 is only now partly met.
      Analyzed is the ceiling and this decision reaches it from the adverse side.
    - >-
      LITERAL CRITERION FAILURES ARE RECORDED AS FAILURES AND NOTHING IS
      RE-SCORED. Item (3) is met under the contract's own listed hand values
      (max 0.1516) and under H-PFDR-06fd60 (D) (max 0.1884) and NOT met under
      IDEA-20260903-dcf857 (D) as a whole (+1.5966 at (256, m 4, D_0 6, omega
      2.807) against "about 2^150"). Prediction P3 holds at 54/54 under the
      contract's frozen C(k) and FAILS at 4 of 54 under the same model plus the
      enumeration-leaf charge frozen in the hypothesis's own assumptions, at
      n = 119, 110, 139 and 154 - so P3's "n = ms in the hundreds" does not
      excuse them, and the package reported the failing reading as anomaly A1
      rather than the flattering one. A re-scoring would need a versioned
      protocol_amendment, which this decision does not create.
    - >-
      THE RECORDED PRIOR WAS CONFIRMED, and where it was not, it was refined
      adversely rather than favourably. The coordinator_prior of
      TASK-20260904-2bb29d, frozen before any reviewer ran, predicted the
      generator-degree break with the exact numbers, the zero-row consequence,
      the m = 2 exception, the second row-count obstruction and the P5 formula
      slip, and all five occurred. Three adverse findings the prior did NOT
      contain are recorded: OBJ-4 (the generator cannot be written down at any
      m = 5 cell), OBJ-5 (the unit mismatch moves a FROZEN 256-bit threshold
      row), and the degenerate observation-collision design (the separator does
      not separate at 54 of 54 cells). A prior confirmed in this much detail is
      reported as confirmation and not as vindication: it is also the reason the
      round could not have been steered, since it was committed first.
