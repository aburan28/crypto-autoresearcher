coordinator_decision:
  id: DEC-20260731-016
  context: >-
    Approval of protocol-amendment-GOAL-AES-001-004 (v4 -> v5) at the opening of
    GOAL-AES-001 BATCH-004, on the committed BATCH-003 checkpoint (ledger archive
    a421f72bb16cd33e9a9c1cafca1b5e1096cf5313, goal checkpoint 613658c6).
    DEC-20260731-014 ruled DEC-20260731-011's certification condition in three
    parts and DELIBERATELY DID NOT ENACT the restatement, because changing a
    committed success criterion after observing outcomes requires a versioned
    protocol_amendment (agents/coordinator.md). This decision approves that
    amendment and nothing else. It approves NO experiment, promotes NO knowledge,
    changes NO hypothesis status, and asserts NOTHING about AES at any round
    count. BATCH-004's own results are not before it and are decided later, in the
    batch's ledger archive on EV-AES-004.
  decision: approve
  target_ids:
    - GOAL-AES-001
    - protocol-amendment-GOAL-AES-001-004
    - DEC-20260731-011
    - DEC-20260731-014
    - protocol-amendment-GOAL-AES-001-002

  id_provenance: >-
    DEC-20260731-016 was verified free by directory listing of ledger/decisions at
    authoring time (highest existing AES-campaign decision was DEC-20260731-015,
    the budget ruling; DEC-20260731-014 is the BATCH-003 batch decision).
    DEC-20260731-017 is RESERVED for the BATCH-004 ledger archive together with
    EV-AES-004 and — conditionally, only if promotion is warranted — KN-FIND-019;
    017 was NOT independently verified free at this writing and MUST be re-checked
    by the archiving task. If a concurrent branch has published any reserved ID by
    merge time, the collision is resolved by a CORR record — CORR-20260731-006 is
    the next free correction ID — and NEVER by editing a committed record (the
    CORR-20260731-005 precedent).

  rationale:
    - >-
      WHY THIS AMENDMENT GETS A DECISION RECORD OF ITS OWN, WHEN AMENDMENT 002
      DID NOT. The test applied to amendments 002 and 003 is whether the change
      alters WHAT THE CAMPAIGN IS AUTHORIZED TO DO. For 002 (an artifact
      provenance bookkeeping gate) and 003 (a budget accounting basis, with the
      ceiling unchanged) the answer was no, and both were folded into
      DEC-20260731-015 alongside a dispatch ruling that existed anyway. HERE THE
      ANSWER IS YES: amendment 004 restates a committed SUCCESS CRITERION and
      declares an entire escape class out of a certification threat model. That
      changes what a future batch may certify. An act of that kind is recorded as
      its own auditable object, with its own rationale, evidence refs and
      limitations, so that a red team has one record to attack rather than a
      clause inside a batch decision.
    - >-
      WHAT IS BEING APPROVED, STATED PLAINLY. The amendment replaces, PROSPECTIVELY
      FROM BATCH-004, DEC-20260731-011's single clause "H-1 and H-3 closed before
      any cryptanalytic measurement is certified against the reduced-round path"
      with three separately checkable conditions. C1: the closed scoring-core
      property, carried forward and upgraded from a once-established finding to a
      per-instrument-version obligation with a mandatory injected-failure run.
      C2: coverage closed BY CONSTRUCTION — the task set derived from the module
      under test's own declared parameter domain, with an empty-cell list that
      must be literally empty and an independent re-derivation of the domain — in
      place of the enumerated grid, which is refused. C3: the evasion class
      declared OUT of the certification threat model on the stated ground that the
      module under test is committed, readable and non-adversarial, with that
      declaration required verbatim in any certificate relying on it and with
      non-adversariality CHECKED by an independent reader against KN-FIND-018's
      enumerated channel list. Part B closes D-803-1 by stating the artifact
      provenance requirement per artifact CLASS.
    - >-
      THE EVIDENTIAL BASIS IS MEASURED, NOT ARGUED FROM FATIGUE. Five demonstrated
      false-green escapes across three repairs of one instrument (ER-6, ER-7, ER-8
      from producers; V-804-4 and V-804-5 from an independent validator in one
      sitting), each an existence demonstration reproducible from recorded
      commands, each faulted module confirmed wrong by direct ciphertext
      comparison BEFORE the control was run, two of the five live in the
      instrument as committed. The reason they recur is structural: each repair
      closes one cell of an open-ended product of axes or one channel of an
      open-ended observation set, against an adversary model strictly stronger
      than the instrument. Recorded at full strength in EV-AES-003 and KN-FIND-018
      and relied on here at exactly that strength and no more.
    - >-
      THE CENTRAL RISK IS THAT THIS IS A CRITERION REWRITTEN TO LET A RESULT
      THROUGH, AND IT IS ANSWERED ON A CHECKABLE GROUND RATHER THAN BY
      ASSERTION. THERE IS NO RESULT FOR IT TO LET THROUGH. Three batches have
      produced ZERO admissible candidate mechanisms — BATCH-002's ideation
      returned NO_ADMISSIBLE_NEXT_MECHANISM with 0 of 8 objects admitted, and
      BATCH-003's exponent-relevant task produced a theorem independently ruled
      IN-SCOPE VACUOUS — and no cryptanalytic measurement exists, is running, or
      is scheduled anywhere in the BATCH-004 queue this decision opens. The
      amendment is authored at the point of maximum distance from any result it
      could benefit. That is the only point at which such a restatement is
      credible, and it is why DEC-20260731-014 deferred it to here rather than
      taking it while BATCH-003's outcome was in view.
    - >-
      AND THE AMENDMENT IS NET STRONGER, NOT NET WEAKER, WHICH IS CHECKABLE FROM
      ITS OWN TEXT. C2 IS NOT MET BY ANY INSTRUMENT THAT EXISTS: the currently
      committed mutation_control_v3.py generates a hard-coded grid and fails C2 on
      V-804-4. C1 adds a per-version re-establishment duty that H-1 did not have.
      C3(c) adds an independent source-reading obligation that DEC-20260731-011
      did not impose. Exactly ONE component narrows what a certificate asserts —
      C3's declaration — and it is labelled as the narrowing rather than buried
      among the strengthenings. Nothing is grandfathered: no existing artifact
      becomes certified by this approval.
    - >-
      THE NARROWING IS FORCED BY MEASUREMENT AND IS RECORDED AT ITS TRUE STRENGTH.
      C3 rests on a REASONED JUDGEMENT — that an in-process instrument cannot
      bound an adversarial module — supported by five measured instances and a
      structural argument, and explicitly NOT a proof of impossibility. The
      strongest channel this campaign identified (a mutant reading the tasks JSON
      on sys.argv[2] and disabling its fault on exactly the tuples that will be
      compared, defeating any finite task set including a C2-compliant one) was
      NAMED AND NOT RUN and is not addressed by C2 or C3. That gap is stated in
      the amendment's own limitations rather than left for a reviewer to find.
    - >-
      DEC-20260731-011 IS NOT EDITED AND ITS CONDITION IS NOT BACK-DATED. It is an
      immutable committed record; its condition stands in the record as what was
      originally required and as UNDISCHARGED as written, and the amendment
      supersedes it PROSPECTIVELY, taking effect only when committed. The
      three-batch history of failing to meet it is preserved in EV-AES-001,
      EV-AES-002, EV-AES-003 and KN-FIND-018 and is not tidied away.
    - >-
      PART B CLOSES THE COORDINATOR'S OWN DRAFTING FAULT, IN THE RIGHT VEHICLE.
      D-803-1 is the per-artifact-CLASS ambiguity in amendment 002's base clause,
      which forced a dispatch-time ruling in TASK-20260801-803 that the
      TASK-20260801-804 validator then accepted on a basis it executed
      (EV-AES-003 Z-6) while recording that the ambiguity itself remained. It is
      settled here by enumerating four classes — source code, machine-readable
      manifest, prose report, ledger/coordination record — and, for prose reports,
      by declaring BOTH the in-text block and the digest-bound manifest pointer
      compliant with neither preferred. Settling it in a task card instead would
      have re-created the card-to-card divergence that caused D-704-1. Amendment
      002's own requirements are untouched; this is a clarification of reach, not
      an extension of obligation, and it is prospective from BATCH-004, so the
      BATCH-003 acceptance stands.
    - >-
      NO ADVERSE TRANSITION AND NO REFUTATION ARTIFACT ARE REQUIRED HERE. This
      decision weakens no hypothesis (none exists), rejects no scope, closes no
      lane, and makes no claim about AES. The refutation-artifact discipline of
      docs/claims-and-verification.md is nonetheless SATISFIED for the finding the
      amendment rests on: the five escape demonstrations are committed — ER-6,
      ER-7 and ER-8 in the producer snapshot e2f8facb, V-804-4 and V-804-5 in the
      validator package committed at 4a942290 — and KN-FIND-018 was promoted at
      proof_status `derivation` in the BATCH-003 ledger archive a421f72b, all of
      it BEFORE this decision, not after.

  evidence_refs:
    - EV-AES-003
    - DEC-20260731-014
    - DEC-20260731-011
    - DEC-20260731-013
    - DEC-20260731-015
    - KN-FIND-018
    - KN-FIND-017
    - coordination/goals/GOAL-AES-001/amendments/protocol-amendment-GOAL-AES-001-004.yaml
    - coordination/goals/GOAL-AES-001/amendments/protocol-amendment-GOAL-AES-001-002.yaml
    - coordination/goals/GOAL-AES-001/batches/BATCH-003/tasks/TASK-20260801-804/er6_closeout_review.md
    - coordination/goals/GOAL-AES-001/batches/BATCH-003/tasks/TASK-20260801-804/validation_report.yaml
    - coordination/goals/GOAL-AES-001/batches/BATCH-003/tasks/TASK-20260801-802/repair_receipt_v3.json
    - coordination/goals/GOAL-AES-001/batches/BATCH-003/tasks/TASK-20260801-802/repair_report_er6.md
    - "BATCH-003 ledger archive a421f72bb16cd33e9a9c1cafca1b5e1096cf5313"
    - "BATCH-003 knowledge/validator predecessor commit 4a942290"
    - "BATCH-003 producer snapshot commit e2f8facb040009e92e1000769efe9659ee60494b"
    - "inference-amendment commit 0137a051eb5828789eb267fa83c8278086578d4c"

  dispositions:
    protocol_amendment_GOAL_AES_001_004: >-
      APPROVED, v4 -> v5, PROSPECTIVE FROM BATCH-004 AND NEVER RETROACTIVE,
      confirmatory_status preserved. It takes effect ONLY WHEN COMMITTED; until
      the coordination commit lands, DEC-20260731-011's condition stands
      undischarged AS WRITTEN and is not treated as reinterpreted.
    DEC_20260731_011_certification_condition: >-
      SUPERSEDED PROSPECTIVELY by C1/C2/C3, not discharged and not edited. Its
      letter is recorded as unmet, in the same way DEC-20260731-013 handled
      D-701-1: discharged by substitution at a stated standard, with the letter
      recorded as unmet rather than back-dated.
    D_803_1: >-
      CLOSED by Part B, in the amendment rather than in a task card. The
      TASK-20260801-803 ruling and the TASK-20260801-804 acceptance of it both
      STAND for BATCH-003 on the validator's verified digest basis; Part B changes
      only what future cards must say.
    instrument_work: >-
      UNCHANGED AND STILL STOOD DOWN. This approval dispatches, schedules and
      authorizes NO mutation-control work. DEC-20260731-014's stand-down holds in
      full: no further repair of that instrument until a candidate mechanism
      exists that requires certification, at which point a C1/C2/C3-compliant
      instrument is BUILT BEFORE the measurement rather than patched after it.
    hypothesis_status_changes: >-
      NONE. No hypothesis record exists for GOAL-AES-001 and none is created.
    goal_status: >-
      GOAL-AES-001 remains `active`. No completion criterion is met, none is
      altered by this approval, and no pause condition is met. Under
      inference-amendment 0137a051 a three-distinct-model closure quorum remains
      unobtainable in this harness, so `completed` is unreachable regardless of
      outcome. NO ATTESTATION IS RECORDED.

  promotion_gates_status:
    engaged: false
    reason: >-
      NO asymptotic-complexity claim is advanced by this decision or by the
      amendment it approves. The four gates of agents/coordinator.md are NOT
      ENGAGED here. They are expected to become live in BATCH-004 if the OD-4 task
      produces a lower bound on the branching factor B — a COST INEQUALITY — and
      the BATCH-004 queue is written so that all four are addressed in the
      producing package rather than discovered late, with gate (4)'s red-team half
      scheduled as a task in the same batch. A claim missing any gate may reach
      `analyzed`, NEVER `supported`.

  limitations:
    - >-
      This decision asserts NOTHING about AES. It approves a certification
      standard and a provenance-recording clarification. Claim tier is toy /
      reduced-round, ceilinged by RQ-AES-001 and GOAL-AES-001.
    - >-
      Approving a standard is not evidence that the standard can be met. C2 has
      never been implemented and its achievability is untested.
    - >-
      The judgement underlying C3 is a reasoned judgement on five measured
      escapes, NOT a proof of impossibility; the ER-8-restore conjecture behind
      one of the five is unresolved rather than refuted, and the strongest evasion
      channel was named and not run.
    - >-
      No literature was consulted; every literature recollection anywhere in this
      campaign remains unverified-from-memory, and no literature statement enters
      this decision or the amendment in any form.
    - >-
      CROSS-MODEL INDEPENDENCE IS UNAVAILABLE. The BATCH-003 evidence this
      approval rests on was produced and reviewed by sessions resolving to the
      same model under inference-amendment 0137a051; independence is in SESSION
      and never in MODEL, and correlated agreement is the honest reading.
    - >-
      This record is authored before its own commit and cannot carry that commit's
      SHA. It is not durable, and the amendment is not in force, until the
      post-commit verifier accepts the BATCH-004 coordination commit.

  next_actions:
    - >-
      COMMIT protocol-amendment-GOAL-AES-001-004, this decision, the BATCH-004
      dispatch queue and its six handoff records in ONE isolated coordination
      commit BEFORE any BATCH-004 task runs — required, because the amendment's
      Part B is cited as a completion gate in the BATCH-004 producer and snapshot
      cards, and a gate uncommitted when the card is issued is exactly the
      retroactive enforcement this program refuses — then bind the amendment's
      `commit` field, register it in the GOAL-AES-001 `amendments` list and
      advance `current_batch_id`/`dispatch_queue_path` in a follow-on commit once
      the post-commit verifier accepts, exactly as BATCH-001, BATCH-002 and
      BATCH-003 did. Then dispatch BATCH-004 as queued. This decision does not
      itself open the batch; the batch is opened by that commit and the queue.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED, on a concrete ground rather than by omission. This is not an
      evidence-review decision: it reviews no run, assigns no evidence strength,
      and its `decision` is `approve` rather than `support` or `reject_scoped`, so
      the promotion trigger in agents/coordinator.md is not met. The finding this
      amendment enacts was ALREADY promoted, in the correct batch and on the
      correct basis: KN-FIND-018 was promoted by DEC-20260731-014 on EV-AES-003 at
      `replicated` strength and carries the five escapes, the structural reason,
      the three-part decomposition and the closed-property design. Promoting a
      second entry restating the same finding as a protocol rule would duplicate
      the corpus and inflate its apparent support. KN-FIND-018's own text already
      anticipates this amendment by name and records that the decomposition is a
      design recommendation and not an enacted protocol change; that sentence
      becomes stale on commit and is NOT edited — the correction, if a future
      session judges one is needed, is a superseding entry, never an overwrite.
      KN-FIND-019 is RESERVED for the BATCH-004 ledger archive and is deliberately
      left unallocated here.

  decided_by: coordinator
  decided_at: '2026-08-01'
