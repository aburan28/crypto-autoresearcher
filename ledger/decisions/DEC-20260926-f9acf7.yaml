coordinator_decision:
  id: DEC-20260926-f9acf7
  recorded_at: '2026-09-26'
  goal_id: GOAL-SSIQ-001
  question_id: RQ-SSIQ-9702af
  kind: protocol_amendment_approval
  mode: coordinate

  context: >-
    EXP-SSIQ-6916e8 v1 (H-SSIQ-a9df38; approval DEC-20260926-e05697; executor
    task TASK-20260926-7d20e4) ran its single authorised run RUN-SSIQ-81bd08,
    archived at 3ea7223b9 by snapshot TASK-20260926-73104c (commit reported by
    the dispatching session; this subagent has no shell and did not re-verify
    the receipt). At 21 of 22 primes every computed cell matched its
    pre-registered exact value: 904/904 valid primary lattices R = 1,
    462/462 sublattices R_sub = 1, 441/441 ideals [O : I] = n(I)^2, every
    computed control exact, M-CROSS = 0, check.py exit 0 (REPRODUCED). At
    p = 9223372036854775837 (tier M, 5 mod 8) PARI 2.15.4
    alginit(nfinit(y), [-2, -p]) raised "impossible inverse in dvmdii: 0."
    deterministically, and the driver had no route to a PARI algebra when
    alginit itself raises (D-1), so 64 PARI-side cells (42 of 946 primary
    lattices, 22 sublattices, 21 M-INDEX ideals, and that prime's controls)
    were not computed. The driver's tally labelled the run INCONCLUSIVE-NEAR
    because it counted uncomputed controls as failed (D-3). The user asked
    for phases 1-3 of this experiment to be run to completion. This decision
    approves protocol amendment AMD-20260926-f9acf7 (v1 -> v2) and opens
    executor task TASK-20260926-fba7e0 for one full re-run, RUN-SSIQ-004595.

  decision: approve

  decision_scope: >-
    Approves AMD-20260926-f9acf7 exactly as written (construction route
    ladder R1 -> R2 -> R3 with gate G-A2 when alginit raises; tally rule
    "not computed is never a mismatch"; one full 22-prime re-run under
    protocol version 2) and authorises exactly one run, RUN-SSIQ-004595.
    Adjudicates D-3 for RUN-SSIQ-81bd08 under version 1. Does NOT change any
    prediction, prime, control, count, success or falsification criterion;
    does NOT change the status of H-SSIQ-a9df38 (stays approved) or
    EXP-SSIQ-6916e8 (stays approved; specification v1 stays frozen); does
    NOT assert the lemma; does NOT review evidence or amend GOAL-SSIQ-001.

  target_ids:
    - EXP-SSIQ-6916e8
    - AMD-20260926-f9acf7
    - RUN-SSIQ-81bd08
    - RUN-SSIQ-004595
    - TASK-20260926-fba7e0
    - TASK-20260926-a44ae6
    - H-SSIQ-a9df38
    - RQ-SSIQ-9702af
    - GOAL-SSIQ-001

  authorization: >-
    Standing user authorization in AGENTS.md (experiments approved once the
    protocol is complete; no per-item user confirmation) plus the user's
    explicit 2026-09-26 request to run phases 1-3 of EXP-SSIQ-6916e8 to
    completion. The amendment is additive and was written before any
    version-2 run exists. Budget policy per CLAUDE.md and
    docs/research-budget-policy.md: time and CPU advisory; memory 4 GB,
    1 worker and the 3600 s watchdog are machine protection; the one-run
    count is scientific and is set by the amendment (C-5).

  run_validity_review:
    run: RUN-SSIQ-81bd08
    verdict: valid_incomplete
    checks:
      expected_run_count: >-
        PASS. One run planned (C-1 of TASK-20260926-7d20e4), one run
        directory, no retry (execution-report runs block; manifest).
      manifest_schema: >-
        PASS. The manifest carries the command, commit and dirty state (with
        the untracked-file note and run-time implementation sha256 values),
        environment and versions, parameters and seeds with their derivation,
        the inference block (fallback_used true with reason), stdout/stderr,
        raw results, validity and reason, timestamps and resources. D-9 (an
        empty gp_version_full in environment.json) does not make it
        schema-incomplete: the gp version string 2.15.4 and the binary sha256
        are recorded in the manifest. The v2 handoff requires the full string.
      seed_integrity: >-
        PASS. base_seed 20260926, the sha256 seed derivation is printed, and
        per-prime A4/A6 seeds are listed in raw-result.json prime_status
        (read for p = 9223372036854775837). setrand(1) precedes every alginit
        (D-6).
      raw_summary_agreement: >-
        PASS. raw-result.json counts (M_R 946 listed / 904 valid / 0 R != 1 /
        42 missing; M_SUB 484 / 462 / 0 / 22; M_INDEX 462 / 441 evaluated /
        0 mismatches; M_CROSS 0; controls_pass_counts C-TRD 21, C-NONMAX 21,
        C-NEAR 21, C-NOSCALE 420; fallback_primes []) agree with the manifest
        and the execution report. check.py recomputed 1514 lattices and
        exited 0.
      control_comparability: >-
        PASS at the 21 computed primes: every computed control used the same
        base order (A1 at all 21; no fallback) and returned its exact
        pre-registered value (read for C-NEAR at several primes, e.g.
        p = 2 det_P0 1/2, p = 3 det_P0 3/4). At p = 9223372036854775837 no
        control exists to compare.
      interpretation: >-
        Every computed cell is a valid exact measurement. The missing cells
        are a tool failure plus an underdetermined fallback (D-1, D-2):
        infrastructure signal, never mathematical evidence (AGENTS.md rule 3).
        Not returned to the executor as invalid; completed under the amended
        protocol by a new run instead.

  d3_adjudication: >-
    Under the version-1 contract's own definitions RUN-SSIQ-81bd08 carries
    INCONCLUSIVE-CONSTRUCTION (a case of the umbrella INCONCLUSIVE), blocking
    cells = the 64 PARI-side cells at p = 9223372036854775837. It does not
    carry INCONCLUSIVE-NEAR: that code is defined as a "C-NEAR mismatch", a
    mismatch needs a computed value, and C-NEAR was not computed at that
    prime while it matched exactly (p^2/4 and p/4) at all 21 computed
    primes. The stopping rule makes a prime with no valid base order
    INCONCLUSIVE-CONSTRUCTION. INVALID, F-NORM, F-SUB, F-INSTR and F-INFRA
    are not triggered (no computed ratio off, 0 R != 1, 0 index mismatches,
    M-CROSS 0, no infra event). SUCCESS fails on coverage of S1-S4 only. The
    raw-result.json string "INCONCLUSIVE-NEAR" is a derived-label defect,
    stays in the immutable record, and is not the contract's code. Full
    basis: AMD-20260926-f9acf7 d3_adjudication.

  deviation_rulings:
    - id: D-1
      ruling: >-
        A gap in the version-1 text as much as in the implementation:
        base_order_rule defined a fallback only when alginit succeeds, and
        "where possible" gave no route to a PARI algebra object. Resolved
        prospectively by AMD-20260926-f9acf7 fallback_rule. The scratch
        alginit(..., 0) observation is not a run and supplies no value.
    - id: D-2
      ruling: Tool failure, recorded; never evidence about the algebra or the lemma.
    - id: D-3
      ruling: See d3_adjudication. Fixed prospectively by AMD-20260926-f9acf7 tally_rule (C-4).
    - id: D-4
      ruling: Accepted; the contract allows the executor's documented construction, verified by C-ALG (e). Kept identical in v2 (C-6).
    - id: D-5
      ruling: Accepted as the literal reading; the index is measured. Kept identical in v2 so the reproducibility comparison is exact (C-6).
    - id: D-6
      ruling: Accepted, and made binding for every route by the amendment.
    - id: D-7
      ruling: Accepted; the precedence order is now declared by the amendment. The extra checks are tightenings.
    - id: D-8
      ruling: >-
        Accepted as disclosed. Development executions were outside the
        repository, used non-protocol inputs (apart from one p = 7 smoke test
        with non-protocol seeds) and supply no value.
    - id: D-9
      ruling: Not schema-incompleteness (see run_validity_review). The v2 handoff requires the full gp version string (captured from stderr if that is where gp prints it).
    - id: D-10
      ruling: >-
        Accepted as disclosed (Section 9 table generated from raw-result.json).
        The derivation note is read-only for the v2 task; its content is for
        the independent review.

  rationale:
    - >-
      COMPLETION IS CHEAP AND REMOVES THE ONLY BLOCKER. The v1 run took 15.5 s.
      Every blocking cell is at one prime and has an infrastructure cause.
      Leaving the experiment INCONCLUSIVE-CONSTRUCTION when a declared route
      probably exists would be premature closure of a cheap check.
    - >-
      THE ROUTE LADDER CAN ONLY ADD FAILURE OPPORTUNITIES. R2 (swapped
      generators, same algebra) tries to obtain PARI's own maximal order, so
      the A1 cell and the full two-instrument comparison can exist at that
      prime and SUCCESS stays reachable. R3 (maxord = 0 plus the frozen A2
      formula as base) lets A3-A6 and the controls run, all
      falsification-bearing. Gate G-A2 stops a non-maximal hand-written base
      from producing a false F-NORM, and at the one affected prime its input
      (A2 valid, R = 1) was already recorded, so it moves no outcome.
      Under R3 the A1 cell stays uncomputed and SUCCESS stays unreachable;
      the amendment says so rather than redefining A1.
    - >-
      FULL RE-RUN, NOT A ONE-PRIME PATCH. One raw-result.json, one code
      identity and one check.py pass over all 22 primes make the version-2
      outcome decidable from a single record, as S1-S7 require. The 21
      repeated primes cost seconds and add a determinism check against
      RUN-SSIQ-81bd08. They are not counted as replication.
    - >-
      THE LABEL FIX IS A DEFINITION, NOT A RESCUE. "Not computed" never
      passed and never failed. The fix keeps every uncomputed item blocking
      SUCCESS and routes it to INCONCLUSIVE-CONSTRUCTION or F-INFRA by cause.
    - >-
      TARGET PROFILE. This closure prunes the exponent-targeting search
      (DEC-20260926-e05697 rationale). Completing it is a small cost, and it
      displaces no exponent-targeting work.

  evidence_refs:
    - experiments/EXP-SSIQ-6916e8/specification.yaml
    - experiments/EXP-SSIQ-6916e8/amendments/AMD-20260926-f9acf7.yaml
    - experiments/EXP-SSIQ-6916e8/execution-report.yaml
    - experiments/EXP-SSIQ-6916e8/runs/RUN-SSIQ-81bd08/manifest.yaml
    - experiments/EXP-SSIQ-6916e8/runs/RUN-SSIQ-81bd08/raw-result.json
    - experiments/EXP-SSIQ-6916e8/implementation/driver.py (tally(), lines 952-1119; base-order selection, lines 558-602)
    - ledger/handoffs/TASK-20260926-7d20e4.yaml
    - ledger/decisions/DEC-20260926-e05697.yaml
    - ledger/hypotheses/H-SSIQ-a9df38.yaml

  limitations:
    - >-
      No evidence decision is made here. RUN-SSIQ-81bd08's computed values are
      valid measurements at 21 primes but have not been independently
      reviewed, and the derivation note is still pending review.
    - >-
      Nothing is known in advance about whether R2 or R3 succeeds at
      p = 9223372036854775837. If every route fails, the v2 outcome is again
      INCONCLUSIVE-CONSTRUCTION there, and that is a tool limit, not evidence.
    - >-
      Post-run amendment: the Coordinator saw the v1 outputs before writing
      it. The disclosure and the argument that no rule depends on a measured
      value are in AMD-20260926-f9acf7 pre_data_status.
    - >-
      The ID tokens were minted by the dispatching session. This subagent ran
      no allocator, validator, YAML parser or git command. Parseability and
      ledger validation are checked at commit time.
    - >-
      Inference fallback recorded on RUN-SSIQ-81bd08 (policy-resolved
      claude-sonnet-5, served claude-opus-5-5, runtime model: inherit, with
      the handoff's fallback_allowed false). The same runtime binding will
      apply to TASK-20260926-fba7e0. It is recorded, not waived, and it
      degrades no stated requirement.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Protocol amendment approval, not an evidence review. There is no
      support or reject_scoped transition. A KN-FIND is considered only at
      the evidence review after RUN-SSIQ-004595 and independent validation.

  next_actions:
