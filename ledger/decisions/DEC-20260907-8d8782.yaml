      a = 1/8 and a = 3/16 is ranked as worth the RANK 2 online follow-up
      specifically because it reopens a QUESTION about this mechanism at two
      previously untested operating points, not because it moves any
      exponent.
    - >-
      This experiment's own `review_note` recommended, but did not mandate, a
      second (red-team) reviewer for the original TASK-20260907-80e198 given
      its narrow scope, and v2's own amendment note extends that same
      "recommended but not mandatory" posture to the a = 1/8-only re-seal.
      No second reviewer was assigned to TASK-20260907-2db9aa; this absence
      is named here, not left implicit, exactly as DEC-20260907-9b1b02 named
      it for the prior task.
    - >-
      Now that all four cells of this a-grid carry a resolved verdict, the
      RANK 2 online-mechanism follow-up DEC-20260907-9b1b02 already named
      applies with equal force at BOTH confirmed-feasible operating points
