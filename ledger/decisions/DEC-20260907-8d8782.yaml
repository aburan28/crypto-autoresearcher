        one seed-level sign disagreement disclosed and judged as noise, not
        replicated by a second independent re-derivation from a third angle
        -- `strength: preliminary`, not `replicated`, per EV-ECDLP-6783b8's
        own `strength_note`. (3) None of EV-ECDLP-f6b3f5's own carried-forward
        open items (the S2_v2 magnitude confound, the missing permanent
        null-collapse fixture, the G3 N=2^30 disclosure mismatch) are touched
