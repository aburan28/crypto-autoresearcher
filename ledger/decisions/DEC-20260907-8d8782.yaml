      specification.v2.yaml's own `success_criterion` and
      `distinguishable_outcomes` are the ONLY criteria applied, exactly as
      written, per-cell, with no criterion changed after observing outcomes:
      S1 is read directly off the blind-vs-production comparison at a = 1/8,
      not composited into a whole-record score that would erase the
