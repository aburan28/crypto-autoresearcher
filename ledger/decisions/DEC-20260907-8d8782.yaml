        blind-and-production-agreeing verdict. OVERALL crossing bracket: per
        `success_criterion`'s OVERALL clause ("the crossing bracket is
        reported as the pair of adjacent a-grid values where the CONFIRMED
        (blind-and-production-agreeing) verdict changes from FEASIBLE to
        INFEASIBLE"), the crossing bracket is now CONFIRMED -- not merely
        reported, as EV-ECDLP-2e9680 and DEC-20260907-9b1b02 could only say
        pending this re-seal -- between a = 1/8 (confirmed feasible) and
        a = 3/16 (confirmed infeasible), at N = 2^24, r = 2, T_sel = T/2.
      what_this_does_and_does_not_change_about_completion_state: >-
        This decision does NOT authorize any new run under EXP-ECDLP-6ac801
        and does NOT amend or reopen its frozen contract (specification.v2.yaml
        stays exactly as approved and frozen). `blind_rederivation.v2_rerequirement_a_1_8`'s
        own scope was narrowly the a = 1/8 cell only, and that scope is now
        fully discharged: no further Stage A re-seal is required by this
        contract at any cell. This decision does NOT itself close or
        supersede EXP-ECDLP-6ac801 as a research direction, since v2's own
        `interpretation` bullet (added by the amendment) already anticipated
        exactly this outcome and states plainly that even an S1 result at
        a = 1/8 "would remain a CEILING-FEASIBILITY result only ... and would
        still require its own separate online RESEL-L follow-up ... before
        any hypothesis-status movement" -- so resolving the last open cell
        completes this contract's OWN measurement objective (locating and
        now CONFIRMING the crossing bracket) without triggering any further
        contractual obligation beyond the RANK 2 online follow-up already
        named by DEC-20260907-9b1b02 and carried forward below. No further
        ledger action on EXP-ECDLP-6ac801 itself is required by this
        decision beyond this archive.
      what_is_established_toy_tier: >-
        At N = 2^24, r = 2, T_sel = T/2 exactly, on the generic instrument:
        clause (C1) of H-ECDLP-37dc01 is now independently, blindly CONFIRMED
        G3-feasible at BOTH a = 1/16 (EV-ECDLP-2e9680) and a = 1/8 (this
