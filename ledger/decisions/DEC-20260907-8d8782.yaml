      premature-closure-symmetric-with-overclaiming principle, exactly as
      DEC-20260907-9b1b02 applied the same principle to a = 1/16 and a = 1/8
      in the prior batch.
    - >-
      Under the roadmap bias toward exponent-targeting mechanisms
      (CLAUDE.md), this experiment and its result remain a bounded,
      constant-factor, toy-scale ceiling measurement under KN-LIT-013: no
      exponent is claimed or approached, and per specification.v2.yaml's own
      `interpretation` this contract cannot license any exponent statement
