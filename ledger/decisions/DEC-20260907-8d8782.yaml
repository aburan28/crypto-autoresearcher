    EXP_ECDLP_6ac801:
      outcome: >-
        Per specification.v2.yaml `blind_rederivation.v2_rerequirement_a_1_8.resolution_rule`
        and `success_criterion`: a = 1/8 is now S1 CONFIRMED FEASIBLE (both
        readings agree on verdict). Combined with EV-ECDLP-2e9680's own
