        this T_sel under both methods. The crossing bracket between the
        confirmed-feasible and confirmed-infeasible region is now located,
        by two independent methods, exactly between a = 1/8 and a = 3/16.
      what_is_NOT_established: >-
        (1) The a = 1/8 CONFIRMED-FEASIBLE result, like a = 1/16's, is a
        CEILING-FEASIBILITY finding only, per the contract's own
        `interpretation`: it does not demonstrate that the online
        LOWER-bracket re-selection mechanism actually reaches that ceiling at
        any achievable batch size U. Zero online RESEL-L arms are run by
        this contract at any a. (2) The a = 1/8 result rests on a SINGLE
