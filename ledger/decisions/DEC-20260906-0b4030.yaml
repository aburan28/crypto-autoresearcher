coordinator_decision:
  id: DEC-20260906-0b4030
  recorded_at: '2026-09-06'
  context: >-
    RQ-RELN-61638a (learned structure discovery on the point-relation
    hypergraph of prime-field point decomposition) filed three drafted,
    unapproved experiment contracts this session: EXP-RELN-f202be (exact-
    enumeration dispersion battery, hypothesis H-RELN-41562a), EXP-RELN-82f487
    (inductive GNN/tree decomposability predictor, hypothesis H-RELN-10ad6b),
    and EXP-RELN-141a86 (symbolic-regression invariant extractor, hypothesis
    H-RELN-427bfd). All three were left at status review_required,
    approved_by null, execution_authorized false pending user confirmation,
    per docs/research-budget-policy.md and the design-experiment skill's own
    confirmation gate. The user then invoked the /run-experiment slash
    command with no EXP-ID. The orchestrating session recommended
    EXP-RELN-f202be as the first, cheapest, decisive contract (it supplies
    the exhaustive count-vector labels the other two consume), asked via
    AskUserQuestion which contract(s) to run, and the user answered "All
    three, in dependency order." This decision approves EXP-RELN-f202be only,
    as the first in that order; EXP-RELN-82f487 and EXP-RELN-141a86 each
    receive their own separate approval decision once their upstream inputs
    are available or their own dependency-order turn arrives.
  decision: approve
  target_ids:
    - EXP-RELN-f202be
    - H-RELN-41562a
  rationale:
    - >-
      The contract is fully specified per the design-experiment checklist:
      objective, inputs, curve-generation recipe with point-count
      certificates, both base-size and both sign conventions frozen relative
      to EXP-FB3-001's committed convention, a frozen predicate family,
      independent variables, primary and secondary metrics, a preregistered
      prediction with exact per-rung numbers, toy-scale scope statement,
      replication seeds, an advisory budget with per-run and total ceilings,
      per-stage budgets, stopping rules, invalidation rules, a decidable
      success/falsification criterion pair under which the pre-committed
      NULL outcome is itself a valid reportable result, positive/negative/
      inconclusive decision paths, required artifacts, artifact binding, and
      later review requirements. No field needed by tools/validate_ledger.py
      or the experiment template is null.
    - >-
      This experiment gates the other two RQ-RELN-61638a contracts: its
      exhaustive count vectors and per-cell dispersion summaries are the
      declared label source for EXP-RELN-82f487 and the declared data source
      for EXP-RELN-141a86. Running it first is the only order consistent
      with the user's own instruction ("in dependency order").
    - >-
      Existing user authorization to conduct this research satisfies the
      confirmation gate under docs/research-budget-policy.md ("Research cost
      estimates are advisory... require no repeated user approval") and the
      design-experiment skill's own text ("Existing user authorization to
      conduct this research satisfies confirmation; do not add routine
      budget approval cycles"). The user's /run-experiment invocation
      following an explicit recommendation, and the subsequent explicit
      choice "all three, in dependency order" via AskUserQuestion, are the
      confirmation events for this contract.
    - >-
      Toy scale only (N near 2^14 to 2^20); no ECDLP cost, speedup, or attack
      claim follows from either pre-committed outcome. Approval authorizes
      measurement, not a conclusion.
  evidence_refs:
    - ledger/proposals/IDEA-20260906-d1494b.yaml
    - ledger/hypotheses/H-RELN-41562a.yaml
    - knowledge/findings/KN-FIND-007.md
    - experiments/EXP-FB3-001/conservation.md
  limitations:
    - >-
      This decision authorizes execution of EXP-RELN-f202be only. It asserts
      nothing about the outcome (NULL or ALIVE per the frozen success
      criterion) and nothing about H-RELN-41562a's eventual status.
    - >-
      Promotion of H-RELN-41562a in either direction, and any knowledge
      promotion, is a separate Coordinator decision after the run executes
      and after the independent validator and red-team review named in the
      contract's later_review_requirements.
    - >-
      This decision does not approve EXP-RELN-82f487 or EXP-RELN-141a86; each
      requires its own coordinator_decision record before execution.
  next_actions:
    - Dispatch the executor per handoff TASK-20260906-16e62c against the now-approved specification.
    - >-
      After EXP-RELN-f202be completes, approve EXP-RELN-82f487 and
      EXP-RELN-141a86 in turn (each with its own decision record) and dispatch
      their execution, consuming this battery's committed run artifacts as
      declared in their contracts.
    - >-
      After execution, run an independent validator and red-team pass per the
      contract's later_review_requirements before any claim-changing review
      or hypothesis-status change.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Approval of an experiment contract is not an evidence-review decision;
      no run has executed yet and no result exists to promote or decline to
      promote.
  decided_by: coordinator
  decided_at: '2026-09-06'
