coordinator_decision:
  id: DEC-20260905-cebc4d
  recorded_at: '2026-09-05'
  context: >-
    Approval gate for frozen contract EXP-ECRANK-76a70d (GOAL-ECRANK-002
    RANK 2). The design closed as DESIGN-WITH-FINDINGS under
    DEC-20260905-145454 with the explicit mandate to present the frozen
    contract to the USER per design-experiment skill step 4; the
    coordinating session presented the design summary with findings 1, 2,
    3, and 6 engaged, plus the arm-C borderline and F6 power limits, and
    the user answered Approve for execution. This decision records that
    confirmation, marks the contract approved, and authorizes execution
    within the contract caps. It closes nothing, promotes nothing, and
    satisfies no completion criterion.
  decision: approve
  decision_label: contract_approved_for_execution_only
  decided_by: coordinator
  target_ids:
    - GOAL-ECRANK-002
    - BATCH-58df35
    - EXP-ECRANK-76a70d
    - H-ECRANK-ee6e0e
    - TASK-20260905-f615a7
  rationale:
    - >-
      User confirmation obtained after presentation of the design with
      findings engaged; the design completion gate held at presentation
      time (contract bytes unchanged since the design snapshot;
      approved_by null pre-approval; H-ECRANK-ee6e0e specified). The
      approval therefore executes the sanctioned status transition
      review_required to approved, setting approved_by to coordinator
      with this decision as ref. The spec amendment touches only the
      status/approved_by/approval-ref fields; all other bytes preserved.
    - >-
      Finding 1 engaged: q = 10^-3 is a DECLARED resolution floor, not a
      theorem-derived constant, frozen by pre-registration and movable
      only by amendment. Consequence: a null outcome bounds the rate at
      the declared floor; it does not bound it below the floor, and no
      outcome may be re-scored against a finer floor.
    - >-
      Finding 2 engaged: the wall budget assumes >= 2 x 10^4 exact
      Fraction ops/s while the idea's model implies up to 1.4 x 10^6.
      Consequence: the COUNTED-ops cap (10^8/arm, checkpointed every
      10^7) is the binding budget; a slow host yields a completed prefix
      plus an exhaustion report, and exhaustion is inert in both
      directions -- never a positive, never a negative.
    - >-
      Finding 3 engaged: the per-b cost (~7.2 x 10^3 ops) is the idea's
      estimate, not a measurement of this engine. Consequence: if the
      real cost exceeds the declared per-b cap, the arm completes a
      smaller prefix and reports it as such; the prefix is evidence
      about the completed portion only.
    - >-
      Finding 6 engaged: Hasse-Minkowski and Mazur are RECALLED pointers,
      never support (rule 9); the pipeline relies on the COMMITTED
      verifier implementations, and P0's near-rigorous label carries its
      rigor_note. Consequence: no outcome statement may lean on the
      recalled theorems; only verifier-accepted bytes count.
    - >-
      Arm C (n = 10, exponent 0) is borderline by design: a null there is
      a P3-relevant measurement, not an invalidation. F6 power is limited
      (4 constructed vs 32 null cells): it fires decisively only on large
      effects. Both are read as designed, not as defects discovered.
  evidence_refs:
    - ledger/decisions/DEC-20260905-145454.yaml
    - experiments/EXP-ECRANK-76a70d/specification.yaml
    - ledger/hypotheses/H-ECRANK-ee6e0e.yaml
    - coordination/goals/GOAL-ECRANK-002/batches/BATCH-ef0456/tasks/TASK-20260905-ccbf5c/design-notes.md
  limitations:
    - >-
      Provenance: internal. User confirmation was obtained in-session by
      the coordinating session and is recorded here, not as a separate
      artifact. The exact resolved model of the executing session will be
      recorded by the executor in its own manifests.
    - >-
      This approval authorizes execution within the contract caps only
      (8 enumerated runs, 7200 s wall per run, 8 GB, counted-ops caps
      binding, descent/PARI/network zero). It does not pre-judge the
      outcome: the derived negative branch stands, and any positive
      criterion outcome stays pending required independent review, which
      is currently unserviceable from this deployment (recorded
      separately if the outcome requires it).
    - >-
      C1 stays OPEN with the N1 external-witness candidate UNPROMOTED;
      C2 remains NOT MET; IMP-2 stands; no hypothesis status changes.
  next_actions:
    - >-
      TASK-20260905-f615a7 executes the approved contract exactly as
      written after this ledger archive verifies; no compute before.
    - >-
      TASK-20260905-6b4607 snapshot-archives the run package; TASK-20260905-3bcd97
      records the outcome via DEC-20260905-a5e07b with no promotion
      beyond servable tiers.
  knowledge_promotion:
    promoted: []
    not_warranted: An approval decision authorizes work; it establishes no finding.
