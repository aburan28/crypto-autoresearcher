coordinator_decision:
  id: DEC-20260805-bb162b
  context: 'GOAL-ECDLP-001 admission audit of IDEA-20260803-fa9839 (arity-threshold charged cost model),
    considered for proposed batch BATCH-156658. Declined on ROUTING, not on merit: the proposal''s
    question_id is RQ-ICEX-001, which GOAL-ECDLP-001 does not carry, and GOAL-ICEX-001''s objective
    is verbatim this deliverable. No batch was opened; no experiment ran. The GOAL-ECDLP-001 EXP-IT-001
    lane (frozen PA-IT-001-v3-rc45-repair-5) is untouched, unreprioritized and undelayed by this decision.'
  decision: pause
  target_ids:
  - IDEA-20260803-fa9839
  - GOAL-ECDLP-001
  - GOAL-ICEX-001
  - RQ-ICEX-001
  rationale: Routing decline, not a merit decline. IDEA-20260803-fa9839 carries question_id RQ-ICEX-001,
    which GOAL-ECDLP-001 does not list; GOAL-ICEX-001's objective ("one fully charged toy-scale index-calculus
    versus Pollard rho/BSGS exponent comparison for generic prime-field ECDLP") is verbatim this proposal's
    deliverable; and the proposal states it feeds GOAL-ICEX-001 and ranks SDEG/DREG/SIG. It also fails
    GOAL-ECDLP-001's own candidate admission bar, which requires complete descent, verification, multi-target,
    and BSGS accounting - four of seven stages the proposal explicitly omits. Decisively, GOAL-ICEX-001's
    next_action attaches a MANDATORY read (DEC-20260802-a51c82 / EV-MONO-a0a89c) whose 2(1 - 1/W_eff)
    per-fibre correction compounds as 2^(n-1) over F_{q^n} at exactly the N = q^n, m = n family the
    proposal uses for its baseline-reproduction gate; running it under GOAL-ECDLP-001 would strip
    that read from the one place it bites. Finally, GOAL-ECDLP-001 carries exactly one committed next_action
    (the frozen PA-IT-001-v3-rc45-repair-5 successor Executor batch) and this task may not edit the
    goal record, so opening the batch here would leave an unreferenced second active batch beside
    an unchanged single next action. The core algebra was independently re-derived and is CORRECT;
    four substantive defects were found and are attached to the successor.
  evidence_refs:
  - ledger/proposals/IDEA-20260803-fa9839.yaml
  - ledger/goals/GOAL-ECDLP-001/goal.yaml
  - ledger/goals/GOAL-ICEX-001.yaml
  - analysis/SSI-ECDLP-SYNTHESIS-20260803.md
  - knowledge/findings/KN-FIND-007.md
  - ledger/evidence/EV-IC-002.yaml
  - knowledge/open-problems/KN-OPEN-001.md
  - docs/target-result-profile.md
  limitations:
  - Claim ceiling toy. Pollard rho remains the ECDLP baseline; ordinary sota_delta is zero.
  - 'ROUTING DECLINE, NOT A MERIT REJECTION. The proposal''s core algebra was independently re-derived
    during the audit and is correct: the optimizer, T* = Theta((m! N D)^(2/(m+1))), the threshold
    d < (m-3)/4, and the 2/(n(n+1)) baseline-discrepancy identity all check.'
  - Four defects were found in the proposal and are recorded in CORR-20260805-4b91ca. They must be
    repaired before any goal admits it; two of them (the B* exponent and the memory row) would trip
    the proposal's own falsifier F3 as written.
  - This decision does NOT authorize GOAL-ICEX-001 to open a batch. GOAL-ICEX-001 remains non-executing
    under its own recorded next_action, which additionally attaches a mandatory read of DEC-20260802-a51c82.
  - No ECDLP cost, lower-bound, exponent, or breakthrough claim is made or moved.
  next_actions:
  - DO NOT open BATCH-156658 under GOAL-ECDLP-001. That goal's single next_action - the successor
    Executor batch under frozen PA-IT-001-v3-rc45-repair-5 with live CTRL-ANOMALOUS-TRACE1 and CTRL_NULL_IT_PLANT
    controls - is preserved unchanged, untouched, and undelayed by this decline.
  - Re-file IDEA-20260803-fa9839 for adjudication by GOAL-ICEX-001 (or parent GOAL-PATH-001) as a
    zero-compute, non-measuring analytic batch. That Coordinator decides whether ICEX's non-executing
    deferral, which is on MEASUREMENT, admits an analytic derivation - on ICEX's own record, preserving
    ICEX's own single next action.
  - Carry section 5 defects into the successor task card as mandatory repairs - (5.1) the 2(1 - 1/W_eff)
    per-fibre correction at the N = q^n baseline; (5.2) B* = N^((1+d)/(m+1)), not N^(1/(m+1)), wherever
    d > 0; (5.3) every threshold row carries B*(m, d) memory, not B*(m, 0); (5.4) pre-register the
    baseline gate as expected UNRUN and forbid every step-(6) artifact (threshold table, d_max rows,
    deferred-measurement ranking, m <= 3 INFEASIBLE-WITHIN-MODEL reading) under an unrun gate.
  - Promote this decision to ledger/decisions/DEC-20260805-<tok>.yaml at the next ledger archive of
    the adopting goal, minting the token with tools/allocate_id.py and --check. Until then it is a
    coordination record and not an official transition.
