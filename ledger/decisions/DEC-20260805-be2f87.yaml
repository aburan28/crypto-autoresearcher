coordinator_decision:
  id: DEC-20260805-be2f87
  context: >-
    GOAL-SSIQ-001 BATCH-002 closes. It ran the Red Team's own REC-1 — measure
    D1's predicted exponent against data this program did not generate — under a
    contract frozen 71 seconds before the first dataset request. The run
    returned INCONCLUSIVE, its primary metric is VOID by its own pre-registered
    null, and independent validation established that the frozen instrument
    could not have returned the supporting branch at any data. Recorded as
    EV-SSIQ-29fcbb, on TASK-20260805-79e700 ADMIT-WITH-CONDITIONS and
    TASK-20260805-538c72 CONFIRM-SCOPED.
    The batch failed at its primary question and succeeded at something else:
    it calibrated the instrument, explained why its null could not have passed,
    and priced the [35] cascade. Both are Coordinator errors caught by review,
    which is the second batch running for exactly that reason.
  decision: revise
  decision_note: >-
    revise, and the object to be revised is THE COORDINATOR'S CONTRACT, not the
    execution and not the hypothesis. The producer obtained external data,
    verified both anchors exactly, reproduced bit-identically, applied the
    frozen rule mechanically, and self-reported the bias that voids its own
    headline. Nothing in the execution needs revising. The frozen window does.
    Neither `support` nor `weaken` nor `reject_scoped` is available: a run whose
    instrument provably could not return one of its branches has produced no
    evidence about its hypothesis in either direction.
  target_ids:
    - GOAL-SSIQ-001
    - RQ-SSIQ-9702af
    - H-SSIQ-6e0748
    - EXP-SSIQ-4de240
    - EV-SSIQ-29fcbb
    - TASK-20260805-ac12ae
    - TASK-20260805-c89efb
    - TASK-20260805-79e700
    - TASK-20260805-538c72
  evidence_refs:
    - EV-SSIQ-29fcbb
    - EV-SSIQ-e43afd
  rationale:
    - id: D-1
      statement: >-
        THE CONTRACT COULD NOT HAVE CONFIRMED THE MODEL IT WAS WRITTEN TO
        CONFIRM, and this is established by control rather than argument. Two
        independent null ensembles — different lattice families, different code
        — agree to 0.005 that the frozen W-MAIN window returns ~1.14 on an
        object whose asymptotic exponent is 3/2 by construction, a bias 1.8x the
        decision rule's own tolerance. A rank-4 object with true alpha = 2
        returns 1.82. So SUPPORTS-D1 was unreachable at any data and REFUTES was
        borderline. The bias is saturation inside the retained window plus
        finite-T discreteness at T <= 45; a decile sweep never reaches 1.5, so
        no window choice would have rescued it. I WROTE THAT WINDOW, and I wrote
        a +-0.20 tolerance smaller than the instrument's own bias.
    - id: D-2
      statement: >-
        THE SAME ERROR AS BATCH-001, IN A NEW PLACE, AND IT IS NOW A PATTERN
        WORTH NAMING. In BATCH-001 the Coordinator named an obstruction that
        could not do the work asked of it (an upper bound cannot force a floor).
        Here the Coordinator specified an estimator that could not resolve the
        quantity asked of it. Both were asserted without the cheap calculation
        that would have refuted them; the Red Team notes the pinning argument
        was already in its own BATCH-001 report and in this repository. The
        general form — AN INSTRUMENT ASSERTED TO HAVE A CAPABILITY IT WAS NEVER
        CHECKED FOR — is now observed twice and is the candidate knowledge entry
        this campaign should promote when it can.
    - id: D-3
      statement: >-
        C-NULL COULD NOT HAVE PASSED, AND THAT IS A RESULT ABOUT D1, NOT A
        BROKEN CONTROL. The surrogate shares both endpoints with the real object
        (Hermite gives gamma_3 (p/4)^{1/3} = (p/2)^{1/3}, reproducing Theorem
        1.5's constant), so agreement in alpha, beta and c was structurally
        forced. The consequence is the sharpest thing in the batch: L1 IS CLOSED
        BY GENERICITY. That still meets the closure standard — a generic
        ceiling is a ceiling — but it removes any claim to arithmetic depth and
        locates the remaining opening precisely at N5, where a structurally
        different object could escape a generic bound. N5 rises in priority
        because of this, not despite it.
    - id: D-4
      statement: >-
        THE DATASET NEVER SAMPLES THE REGIME THE LEVER LIVES IN, which is the
        finding that retires this lane rather than repairing it. T = p^{1/4}
        sits at x in [0.44, 0.71] — deep in saturation — at every prime tested,
        against x ~ 2^{-21} at log2 p = 256. Discrimination at +-0.20 first
        becomes possible at log2 p >~ 22.5 and at +-0.05 at log2 p ~ 87. The
        Red Team's recommendation is therefore NOT to repair the estimator, and
        I accept it: a perfect fit at log2 p <= 18 still cannot validate an
        asymptotic, and the only outcome that could have reopened L1 (alpha = 2)
        is refutable at zero compute since it saturates at T ~ 11.6 while 119
        primes carry curves at T ~ 50.
    - id: D-5
      statement: >-
        THE PRE-COMMITTED REVERSION WAS HONOURED AND DID NOT FIRE, AND SO DID
        SUPPORTS-D1. Both trigger conditions were unmet and no clause was
        reinterpreted at the moment it cost something. Both halves are recorded
        together in EV-SSIQ-29fcbb boundaries, because stating only the first
        would let a later reader take a non-firing reversion for confirmation.
        L1 stays exactly where BATCH-001 left it: CLOSED-IN-SCOPE, single-pillar,
        derivation-tier, N5 open — unchanged, not strengthened.
    - id: D-6
      statement: >-
        THE CASCADE COSTS NOTHING IN EXPONENT AND THREE THINGS IN CONDITIONS. No
        1/4 condition changes, because p^{o(1)} cannot move an exponent, and the
        Red Team attacked for an exponent-carrying step and found none. So the
        goal is NOT rescoped to OneEnd: (log p)^{O(1)} of unassigned degree is
        exactly what an exponent claim tolerates. But three riders are now
        standing conditions this campaign did not previously carry: GRH enters
        at the Isogeny arrow; an unstated lambda binds EVERY future candidate,
        which must return log deg alpha = (log p)^{O(1)}; and concrete cost is
        NOT inheritable across the cascade, since its only explicit exponent
        (12) propagates to 2^96-2^192 at log2 p = 256 against a 2^{85.3}
        headline. GD-1 is superseded by the narrowed defect GD-3 recording
        exactly these three.
    - id: D-7
      statement: >-
        "CONDITIONAL ON HEURISTIC 1 ALONE" IS NOW WRONG FOR THE ISOGENY PROBLEM
        and right for OneEnd and EndRing. This campaign has been quoting it the
        wrong way. Corrected in the goal record here. The Red Team also names
        the worked example in docs/claims-and-verification.md, which uses this
        exact cascade, and its own BATCH-001 frontier row; both are outside this
        goal's write scope and are routed rather than edited, because a shared
        contract document is not corrected as a side effect of one goal's ledger
        archive.
    - id: D-8
      statement: >-
        THE REVIEWERS DISAGREE ABOUT THE UNSTATED c-TOLERANCE AND I DO NOT
        ADJUDICATE. Both reach C-NULL FAIL and M-ALPHA VOID; they differ on how
        robust that is to a tolerance the contract failed to fix (Red Team O22:
        load-bearing, since a seed-spread-scaled tolerance flips it; Validator:
        not load-bearing, having tested an independent surrogate that reproduces
        the fit more closely still). Recorded as a disagreement in
        EV-SSIQ-29fcbb O-6 rather than resolved by Coordinator fiat. The defect
        both agree on is the contract's silence, and that is what revise fixes.
    - id: D-9
      statement: >-
        WHAT THIS BATCH ACTUALLY BOUGHT, stated plainly because "INCONCLUSIVE"
        would otherwise read as wasted budget: an instrument calibration valid
        for every future fit on this data; a structural explanation of why the
        null could not pass, which converts a failed control into a result about
        D1; a measured statement that the accessible data cannot reach the
        lever's regime, which retires a lane instead of leaving it to consume
        later batches; a full cost reading of the [35] cascade with three new
        standing conditions; and an exact normalisation identity
        (N(1,p) = h(-4p)/2 at 5377/5377 primes) that the contract never asked
        for and that any future instrument can be checked against.
  limitations:
    - >-
      The primary question is UNDECIDED. D1's exponent is neither confirmed nor
      refuted, lever L1 is unchanged, and the campaign's model-independence
      confound is NOT resolved — this batch was the attempt to route around it
      and it did not land.
    - >-
      M-ALPHA is VOID and may not be cited as evidence about D1 in either
      direction by any record, now or later.
    - >-
      Sub-toy throughout (log2 p <= 18.0168), and the lever's regime is not
      sampled at all. Nothing transfers to cryptographic scale.
    - >-
      Concrete cost is not inheritable across the [35] cascade.
    - >-
      Nine Validator findings (F1 and F2 travelling) and fifteen Red Team
      objections (O21-O35, three HIGH) travel with EV-SSIQ-29fcbb. The Red
      Team's verdict becomes CHALLENGE if any of four named sentences appears in
      the archive; all four are explicitly barred in the evidence record's
      boundaries.
  next_actions:
    - >-
      SINGLE NEXT ACTION — open BATCH-003 on REC-3, the direct test of lever L4,
      which is the only lever whose ceiling meets this goal's target. Build the
      2-isogeny graph per prime over the exhaustive block (<= 1833 vertices)
      from the released Z-bases, and measure greedy descent on delta_E to the
      F_p locus AGAINST the undirected walk on the same graphs, reporting the
      difference of hitting-time exponents. It uses the released minima as a
      correctness oracle, which is what defeats the independence objection, and
      it answers the M-GRAD question this batch could not measure because the
      release carries no adjacency. It must carry the BATCH-002 calibration:
      any exponent estimated on this data inherits the ~ -0.36 window bias
      unless the estimator is shown not to.
    - >-
      NOT CHOSEN, WITH REVISIT CONDITIONS (AGENTS.md rule 9). (i) REPAIRING THE
      ESTIMATOR IS DELIBERATELY DECLINED, on the Red Team's argument and D-4: a
      perfect fit at log2 p <= 18 cannot validate an asymptotic, and the lane's
      only reopening outcome is refuted at zero compute. Revisit only if data at
      log2 p >~ 22.5 becomes available. (ii) REC-4, the zero-compute N5 scoping
      pass, which D-3 raises in priority since L1 is closed by genericity and
      N5 is where a structurally different object could escape a generic bound;
      schedule in BATCH-003 if budget allows, otherwise BATCH-004. (iii) REC-5,
      a Red Team pass on the next contract BEFORE freeze — accepted as standing
      practice from BATCH-003 onward, since D-2 shows the Coordinator has now
      twice frozen an instrument nobody checked. (iv) Routing the
      docs/claims-and-verification.md correction of D-7 to its owner.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Nothing promoted. EV-SSIQ-29fcbb is inconclusive on its primary question
      and the campaign cap stands at preliminary, below the replicated bar that
      docs/task-lifecycle.md step 9 requires. THREE CANDIDATES ARE NOW QUEUED
      rather than discarded, one of them new and, on the evidence of two
      batches, the most valuable thing this campaign has produced:
      (1) the BATCH-001 L1 ceiling; (2) the general pattern "an upper-bound
      instrument cannot establish a floor"; and (3) NEW — the generalisation
      D-2 names, that AN INSTRUMENT ASSERTED TO HAVE A CAPABILITY IT WAS NEVER
      CHECKED FOR is this program's recurring Coordinator failure mode, now
      observed twice in two batches, with the cheap check in both cases being a
      null object with a known answer. Candidate (3) also carries a concrete
      reusable artifact: run the frozen estimator on an object with the target
      exponent BEFORE freezing the contract. Promotion of all three waits on the
      same thing — evidence above preliminary, which needs model independence
      this harness cannot currently supply.
  decided_by: coordinator
  decided_at: '2026-08-05'
