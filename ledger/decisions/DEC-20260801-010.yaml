coordinator_decision:
  id: DEC-20260801-010
  title: >-
    Admit the 84 Autolab EXP-AL* import packages as archival evidence at claim_tier toy, and
    record the status transition that the port performed without one

  context: >-
    The Autolab port (port tag autolab-port-20260731, tool tools/port_autolab_experiments.py)
    created RQ-ALPF-001, RQ-ALBIN-001, RQ-ALISO-001 and RQ-ALECF-001, 84 hypotheses, 84
    experiment packages with one import run each, and four area evidence records EV-ALPF-001,
    EV-ALBIN-001, EV-ALISO-001 and EV-ALECF-001. Every one of those 84 hypotheses was written
    directly at `status: analyzed`. AGENTS.md requires a decision record with rationale and
    evidence references for a state transition, and none was filed, so the transition stood
    unauthorized between the port and this record. This decision supplies it and rules on what
    the imported packages may be used for.

  decision: approve
  decision_scope_note: >-
    `approve` here means the import packages are admitted as archival evidence in the form they
    now hold. It is NOT a scientific endorsement of any Autolab finding: the direction of all
    four evidence records is `neutral` and their claim_tier ceiling is `toy`. No hypothesis in
    this set is supported, weakened or rejected by this decision, because none of them was
    tested here -- each states only that an Autolab package can be archived as harness evidence,
    and the archive is what was checked.

  target_ids:
  - RQ-ALPF-001
  - RQ-ALBIN-001
  - RQ-ALISO-001
  - RQ-ALECF-001
  - EV-ALPF-001
  - EV-ALBIN-001
  - EV-ALISO-001
  - EV-ALECF-001

  evidence_refs:
  - EV-ALPF-001
  - EV-ALBIN-001
  - EV-ALISO-001
  - EV-ALECF-001

  rationale:
  - >-
    The archive claim is checkable and now checked. `python3 tools/port_autolab_experiments.py
    --verify` recomputes each package's artifact list, artifact count and per-file sha256 from
    the files the package actually ships and compares them against implementation.md,
    manifest.yaml and raw-result.json. It passes on all 84 packages. This is the only claim
    these hypotheses make, and it is verifiable from a fresh clone with no Autolab checkout.
  - >-
    The verification was adversarial before it passed. On the packages as first committed the
    same check failed on 61 of 84: implementation.md listed 21 artifacts that no longer exist in
    the repository, three packages cited a macOS AppleDouble stub in place of the real contract
    file they do ship, and 50 manifests overstated `copied_artifact_count`. The cause was that
    the porting tool recorded what it copied on the porting machine rather than what survived
    .gitignore into the archive.
  - >-
    Claim tier is bounded by what was verified, which is custody, not mathematics. Certificates
    are `kind: none` on every imported run and no run was re-executed here, so `proof_status` is
    `empirical_only`, `certificate_refs` is empty by construction, and `claim_tier: toy` is a
    hard ceiling. Autolab's own labels, including any that read stronger than toy, are preserved
    inside `source/` and are not promoted by this record.
  - >-
    No baseline was recomputed. Each analysis.md states this in place of the earlier text, which
    gestured at "Pollard rho / VW / Wesolowski-class isogeny cost" without computing any of
    them. Nothing in this set may be read as a measured margin over a baseline.

  limitations:
  - >-
    The source tree is not vendored. `inputs/refs` holds a documentation mirror only, so the
    pinned Autolab commit dca04ac33e9ffcfc51edb3ae7e7bd558b1962d95 cannot be resolved from this
    repository and re-running the port requires an external checkout via $AUTOLAB_ROOT. What a
    reviewer can check offline is the archive-to-record consistency, via --verify.
  - >-
    Findings are quoted, not adjudicated. The one-line finding on each package is lifted from
    the source result artifact; where the source recorded no narrative finding, the record says
    so rather than presenting a status flag as a result. Nine packages carry an explicit "no
    narrative finding recorded" statement.
  - >-
    The four evidence records each span an entire area, so their scalar `hypothesis_id` names
    only the first hypothesis; `hypothesis_ids` carries the complete linkage.
  - >-
    Eight Autolab bodies of work remain deferred rather than ported, listed in
    docs/autolab-port-inventory-20260731.md. They are inventoried, not archived, and nothing may
    cite them as harness evidence.

  next_actions:
  - >-
    Any scientific use of an EXP-AL* package requires a fresh in-harness experiment that
    re-executes the measurement with certificates. Citing an import run as support for a
    mathematical claim is out of scope for this decision.
  - >-
    Keep `tools/port_autolab_experiments.py --verify` green. It is covered by
    tools/test_port_autolab_experiments.py and wired into `make check-ledger`.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Nothing durable to promote. Evidence strength is `preliminary` and direction is `neutral`
      across all four records; the verified claim is that 84 historical packages were archived
      faithfully, which is custody metadata rather than a research finding. Promotion becomes
      appropriate only if a later in-harness experiment reproduces one of these measurements
      under certificate discipline.

  decided_by: coordinator
  decided_at: '2026-08-01'
