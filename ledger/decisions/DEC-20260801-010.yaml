        IS NOT WAIVED FOR A METHODOLOGICAL FINDING. A KN-FIND promoted from internal work
        requires `replicated` or `strong` evidence behind a `support` or `reject_scoped`
        decision; a pattern assembled from four batch-close records of ONE LANE, ONE PROGRAM and
        ONE MODEL is a sample of one lane, and the campaign has no base rate for how often a
        correctly-built instrument passes. Promoting it now would be exactly the fatigue-report
        failure docs/inventor-protocol.md section 4 names - a count of observations offered as a
        finding about the world. (2) THE CONFOUND IS UNCONTROLLED AND IT IS THE STANDING
        MODEL-INDEPENDENCE CAVEAT. Author and reviewer resolve to the SAME MODEL under this
        harness. An equally consistent explanation of five defects and five catches is that one
        model has a characteristic blind spot in the authoring role that the same model
        reliably finds in the adversarial role - which would be a finding about THIS HARNESS,
        not about pre-registration regimes, and this program cannot presently distinguish the
        two. Recording that confound is mandatory; ignoring it and promoting anyway is not
        available. (3) IT WOULD BE PROMOTED BY THE ONLY AGENT WHO CANNOT BE INDEPENDENT ABOUT
        IT - the Coordinator authored or approved every one of the four defective contracts, so
        a self-authored finding about the quality of one's own instruments needs an independent
        session at minimum. (4) NOTHING IS LOST BY WAITING. The pattern is recorded in full,
        with all four defect classes named and cited to their review artifacts, in this
        decision and in the goal record; it is already operational as PERTURB-MOVE-1 and AP-4;
        and a knowledge entry is not required for it to bind.
