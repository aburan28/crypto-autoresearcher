coordinator_decision:
  id: DEC-20260801-010
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-001
  batch_id: BATCH-025
  closes_batch_id: BATCH-024
  question_id: RQ-ECDLP-002
  decided_by: coordinator
  decided_at: '2026-08-01'
  decision: approve
  decision_scope: >-
    THIS RECORD DOES TWO THINGS AND NEITHER IS AN EVIDENCE-REVIEW DECISION. (1) It CLOSES
    BATCH-024 AS A ONE-CYCLE NON-EXECUTION by goal-record amendment, following the
    BATCH-014/BATCH-015 and BATCH-022/BATCH-023 precedent exactly - NO EVIDENCE RECORD IS
    FILED BECAUSE NO RUN EXISTS, and no hypothesis status moves in either direction.
    (2) It OPENS BATCH-025 on the BATCH-025 dispatch plan, the frozen contract
    EXP-LPF-001, the hypothesis H-LPF-001 at `specified` and the fourteen handoffs,
    approved AS A PLAN. IT AUTHORIZES NO RUN. The two run authorizations of BATCH-025 are
    CALIBRATION_AUTHORIZATION in the TASK-20260801-048 snapshot receipt and
    APPROVAL_DETERMINATION in the TASK-20260801-055 snapshot receipt, and neither is
    granted here. No experimental support of any kind is asserted anywhere below.
  target_ids:
    - GOAL-ECDLP-001
    - BATCH-024
    - BATCH-025
    - EXP-DEP-001
    - EXP-LPF-001
    - H-DEP-001
    - H-LPF-001
    - RQ-ECDLP-002

  # ==================================================================
  # PART I - THE BATCH-024 CLOSE
  # ==================================================================
  batch_024_close:
    outcome: NON_EXECUTION
    outcome_class: 'CONTRACT-DESIGN FAILURE CAUGHT BEFORE THE MEASUREMENT COMPUTE.'
    what_it_is_not: >-
      IT IS NOT A MATHEMATICAL RESULT ABOUT H-DEP-001, H-EQD-001, H-SMTH-001, H-DS-001 OR
      HEUR-DS-1 IN EITHER DIRECTION, AND IT IS NOT AN INFRASTRUCTURE FAILURE. Nothing
      timed out, nothing crashed and no budget was exhausted. An independent review found
      the frozen instrument incapable of measuring what it claimed, before any budget was
      spent on it. AGENTS.md rule 5 and rule 3 both apply and neither is stretched.
    procedure: >-
      RUN-DEP-001-measure IS NOT EXECUTED. Under the RC-24 one-cycle cap a REVISE at
      TASK-20260801-040 at any severity is NOT APPROVED and ends the measurement arm.
      TASK-20260801-041 recorded APPROVAL_DETERMINATION NOT APPROVED. TASK-20260801-042
      through TASK-20260801-046 are terminal `blocked` with that reason recorded on each
      card, which is the honest terminal state and not a bookkeeping lag. No evidence
      record is filed, EV-DEP-001 and EV-EQD-002 are NOT WRITTEN and their ids stay free,
      and the close is recorded by goal-record amendment at this batch's opening - the
      BATCH-014/015 and BATCH-022/023 precedent.
    hypothesis_status_effect: 'H-DEP-001 REMAINS `specified`. No hypothesis status moves. EV-EQD-001 is amended in NEITHER direction and is not edited.'
    reviewed_artifacts:
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-040/contract_review.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-040/attainability_check.md
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-040/anti_tuning_check.md
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-040/alternative_class_check.md
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/archives/TASK-20260801-041/snapshot_commit_receipt.json
    the_four_blocking_defects_recorded_precisely:
      - id: RTB-040-1
        finding: >-
          plant_copula(., ., 1.0, .) IS BIT-IDENTICALLY plant_comonotone. sqrt(max(0, 1 - 1))
          is exactly 0.0, so z2 = z1 exactly and the return value is sort(e2)[rank(e1)],
          which is plant_comonotone's body verbatim; verified elementwise on three
          independent seeds and independent of the noise stream. The frozen reading rule
          asserts the CONTRARY - that the anchor "is NOT the rho = 1.00 rung, it is a
          different object". Consequences - the calibration in fact measured the TOP RUNG of
          DEP-LADDER-RHO at 20/20 by both chi-squares at both cells, at threshold ratios
          703.5, 56.8, 690.9 and 57.7; branch D-3 requires those same statistics to FAIL on
          that same object and is therefore NOT REACHABLE; and D-3's mandatory
          counterexample certificate, which requires an object of maximal measured rank
          correlation with all four statistics below threshold, is UNOBTAINABLE.
          `ladder_rungs_executed: []` was true of the LOOP and false of the OBJECT, and a
          label-level check missed it.
      - id: RTB-040-2
        finding: >-
          STAT-KS1-E1 AND STAT-KS1-E2 ARE PROVABLY CONSTANT between a source arm and any
          plant arm - e_1 is bit-identical under every plant, and a KS statistic on e_2 is a
          function of the empirical distribution of e_2 only, which every plant preserves as
          a permutation of the same multiset. Verified bitwise across four families while
          STAT-CHI-16 moved by factors 24.9, 308.6, 1.005 and 1.119 on the same arms. So the
          effective certifying set is TWO statistics, not three, and the attainability
          argument cited those immobile statistics' non-detections as evidence ABOUT
          DEPENDENCE, which they cannot be.
      - id: RTB-040-3
        finding: >-
          TRAP-DISTRIBUTIONAL. THIS IS THE FINDING OF THE BATCH. In plant_cell (C2) and
          plant_block (C3) the permutation sigma is built from e_1 AND FRESH RANDOMNESS
          ONLY, NEVER FROM e_2. Under an e_1-independent e_2 the e_2 vector is exchangeable
          given e_1, so applying any e_2-independent sigma leaves the JOINT LAW EXACTLY
          UNCHANGED. C2 AND C3 ARE DEPENDENCE-DESTROYING AND CANNOT CREATE THE DEVIATION
          THEY CERTIFY AGAINST. Measured on 40 paired replicates through the driver's own
          statistics_of - C1 at rho = 0.05 shifts CHI-16/CHI-64 by +7.33/+1.96 and at
          rho = 1.0 by +10182/+2554, while C2 AT ITS TOP RUNG eps = 0.25 shifts +0.21/+0.16
          and C3 AT ITS TOP RUNG q = 1.00 shifts +0.15/+0.19 - indistinguishable from the
          null. The archived calibration measures the same bound on the real source, where
          the MAXIMALLY destructive member gives a K = 16 joint TV of 0.023457 / 0.023241,
          the multinomial noise floor. Consequently eps_det = NONE_ON_LADDER is forced BY
          CONSTRUCTION and D-4's mandated ratio eps_det/0.02 cannot be produced under any
          outcome; and D-1 has NO leg over the BLOCK ladder, so C3 was wholly unguarded
          while ALT-CLASS-DEP-1 contemplated certifying it.
      - id: RTB-040-4
        finding: >-
          D-5's second leg is SATISFIED ON ARCHIVED, NON-RE-RUNNABLE CALIBRATION DATA under
          the only admissible reading of the frozen text, and D-5 PRECEDES D-2, D-3 and D-4
          in the frozen precedence, so no achievable measurement lands in any substantive
          branch. Worse, the leg is an UNBANDED EXISTENTIAL over 20 replicates x 4
          statistics x 2 cells = 160 comparisons at a per-comparison level of
          2/201 = 0.00995, so IT FALSE-FIRES WITH PROBABILITY 0.798 ON A PERFECTLY CORRECT
          APPARATUS. That arithmetic uses only pre-datum quantities and was available before
          any calibration number existed.
    what_the_batch_got_right_recorded_because_a_close_is_not_a_verdict_on_the_workers: >-
      The literal DESIGN-TRAP-1 criterion PASSED - the reviewer derived the invariance
      statement independently, established the lattice fact that the K = 64 grid refines
      K = 16 exactly, built both trap plants, and found NO construction exactly invariant at
      either resolution. ATS-DEP-1 PASSED in isolation - the contract commit is a verified
      Git ancestor of the calibration commit, the spec diff across that boundary is empty,
      no run artifact existed at the freeze, and all eight thresholds, all eight secondary
      order statistics, every THR-DEP-REPRO and DEP-CAL count and every DIAG-DEP-RHO summary
      reproduce EXACTLY under independent recomputation. No branch was added, removed,
      merged, reordered or reworded. The certified class list was declared EMPTY and nothing
      implied otherwise. ALT-CLASS-DEP-1's U1 was restated in full and correctly. And the
      one place where post-calibration latitude existed, OPEN-RR-DEP-1-A, is the one place
      the freezing Coordinator explicitly declined to exercise it in either direction and
      routed to the review instead - WHICH IS WHY THE DEFECT SURFACED BEFORE THE BUDGET WAS
      SPENT.
    not_a_closure_of_the_lane: >-
      C1, the Gaussian-copula construction, IS SOUND - it genuinely creates dependence, its
      ladder is guarded by D-1's Spearman leg, and it has both calibration endpoints. A
      dependence-CREATING replacement for C2, choosing transposition targets using e_2 bins
      as well as e_1 bins so that sigma depends on e_2, is a concrete open design. C3 needs a
      D-1 leg and a calibration endpoint of its own. THE DEPENDENCE-POWER LANE IS NOT DEAD
      AND NOTHING HERE DECLARES IT SO; it is ranked behind the single next action and named
      in the forward guidance below.

  # ==================================================================
  # PART II - THE PATTERN. THE MOST DECISION-RELEVANT FACT IN THE CAMPAIGN
  # ==================================================================
  the_five_instrument_failure_pattern:
    id: PATTERN-INSTR-5
    headline: >-
      FIVE CONSECUTIVE INSTRUMENTS BUILT FOR THIS LANE HAVE BEEN FOUND INCAPABLE OF
      MEASURING WHAT THEY CLAIMED. This is now the most decision-relevant fact in the
      campaign and it is recorded as a finding rather than as a run of bad luck.
    the_five:
      - batch: BATCH-021
        instrument: 'the closed-form decision variable'
        defect: >-
          An object-free expectation - the decision variable was computed from a formula
          rather than from the object, so it could not have varied with the object it was
          meant to measure.
      - batch: BATCH-022
        instrument: 'the EXP-SMTH-001 thresholds'
        defect: >-
          Thresholds UNSATISFIABLE BY A CORRECT NULL, making four of six branches jointly
          unreachable. TAIL-DS-1 in particular passes with probability 1/e on a perfectly
          correct uniform sample, because n * p_ext at the sample maximum is asymptotically
          Exp(1).
      - batch: BATCH-023
        instrument: 'the EXP-EQD-001 power certificate'
        defect: >-
          Power certified against the WRONG ALTERNATIVE CLASS. The only plant on the frozen
          ladder moved the e_1 MARGINAL and returned e_2 unchanged, so a copula-type
          deviation of arbitrary magnitude was never excluded to any degree. The run was
          valid and the protocol was executed exactly; the certificate bounded half of what
          it appeared to.
      - batch: BATCH-024
        instrument: 'the EXP-DEP-001 dependence plants'
        defect: >-
          Two of three plant families DEPENDENCE-DESTROYING and structurally incapable of
          creating the deviation they certify against (TRAP-DISTRIBUTIONAL), two of three
          certifying statistics provably immobile, the top ladder rung bit-identical to the
          calibration anchor, and a precedence leg satisfied on non-re-runnable archived data
          with a 0.798 false-fire rate on a correct apparatus.
      - batch: 'the count itself'
        instrument: 'four instruments across four batches, plus BATCH-021 making five findings across five batches'
        defect: >-
          RECORDED FOR ACCURACY RATHER THAN FOR RHETORIC. The pattern is five findings across
          four consecutive instrument-building batches beginning at BATCH-021; the count of
          instruments is four and the count of distinct defect classes is five. No deliverable
          may inflate either number.
    what_the_pattern_IS: >-
      IT IS A REAL RESULT ABOUT THE METHOD, AND IT IS RECORDED AS ONE. EACH DEFECT WAS
      CAUGHT, NONE BY LUCK, AND ALL BY EXECUTING RATHER THAN REASONING - by an independent
      session recomputing every number from the raw arrays, running the driver's own
      functions on synthetic arms, and re-deriving structural claims from source instead of
      accepting the artifact's prose. The pre-registration regime plus a named-duty
      independent review with its own deliverable files has now caught four fatal design
      defects for a few minutes of CPU each, BEFORE any measurement budget was spent on them.
      That is the regime working, and the honest reading of a batch that ends in
      non-execution is that a cheap review replaced an expensive wrong answer.
    what_the_pattern_IS_NOT: >-
      IT IS NOT A RESULT ABOUT ECDLP. FIVE BATCHES OF INSTRUMENT-BUILDING HAVE PRODUCED NO
      MEASUREMENT OF THE QUANTITY THE CAMPAIGN'S EXPONENT CLAIMS ACTUALLY REST ON. No
      integer has been factored, no largest prime factor computed, no smoothness probability
      measured, at any scale, in twenty-four batches. A method result is not a mathematics
      result and this decision does not trade one for the other.
    the_operational_consequence_and_it_is_the_reason_BATCH_025_is_what_it_is: >-
      THE PATTERN CHANGES THE PRIORITISATION, NOT THE STANDARD. Each of the last four batches
      was a further step AWAY from the object - the input to the claim, then the instrument
      for the input, then the instrument for the instrument. Every step was individually
      well-argued and the composition was a drift. BATCH-025 STOPS THE REGRESS BY MEASURING
      THE OBJECT. The five process disciplines are carried forward in full and a sixth is
      added, because the disciplines are what caught the defects; what changes is the target,
      not the rigour.
    knowledge_candidate_judgement: 'See knowledge_promotion below. Filed as KN-CAND-BATCH024-A and NOT promoted at this decision, with the reason stated there.'

  # ==================================================================
  # PART III - WHY BATCH-025 IS THE SMOOTHNESS MEASUREMENT
  # ==================================================================
  context: >-
    BATCH-025 PAYS OPEN-BATCH023-A, THE OLDEST DEBT OF THIS GOAL. HEUR-DS-1 is a claim about
    B-SMOOTHNESS - that the probability an intermediate is B-smooth is within a constant
    factor of Dickman rho(u). NO EXPERIMENT IN THIS CAMPAIGN HAS FACTORED A SINGLE INTEGER.
    BATCH-022 tried and its contract failed review; BATCH-023 measured a load-bearing INPUT
    to the claim; BATCH-024 measured an INSTRUMENT for that input. EXP-LPF-001 samples genuine
    half-arity Semaev partial-map intermediates at the two toy cells, bounded by the frozen
    D = 2**32 and 2**40, FACTORS THEM, records the largest prime factor and the B-smoothness
    indicator of every sample, and compares the resulting distribution to the Dickman law.
  the_ordering_argument: >-
    THE COST OF DEFERRING THIS ONE MORE BATCH WAS WEIGHED AT THE BATCH-024 OPENING AND STATED
    THERE AS A REAL COST, ACCEPTED ONLY BECAUSE RT049-CTRL-1 WAS A BOUNDED CALIBRATION ARM
    OVER AN EXISTING VALIDATED APPARATUS. That justification is now spent - the apparatus in
    question turned out not to be measuring what it claimed, so the cheapness argument bought
    nothing. Deferring again would require a new reason and there is none. The dependence-power
    lane is not closed and is ranked behind this action with its concrete repair named.
  why_a_new_experiment_id_and_not_an_EXP_SMTH_001_amendment:
    ruling: 'EXP-LPF-001, A NEW ID, SUPERSEDING EXP-SMTH-001 BY ADDITION. EXP-SMTH-001 IS NOT EDITED, NOT AMENDED, NOT VERSIONED AND NOT RE-SCORED.'
    justification_against_the_immutability_rule: >-
      EXP-SMTH-001 is FROZEN, hash-bound, filed at `review_required`, NEVER APPROVED and
      NEVER RUN. Its fatal defect is a property of its FROZEN DECISION RULES - TAIL-DS-1 -
      and a defect in a frozen rule cannot be repaired inside the frozen file without
      destroying the only thing a freeze is for. AGENTS.md rule 4 and CLAUDE.md rule 2 leave
      exactly one admissible route: a new record under a new id that states what it takes
      over and what it changes. THE HARDER HALF OF THE ARGUMENT IS STATED RATHER THAN
      AVOIDED - when EXP-EQD-001 followed EXP-SMTH-001 the justification was that the
      MEASURED QUANTITY DIFFERED, and that justification is NOT available here, because
      EXP-LPF-001 measures exactly what EXP-SMTH-001 was built to measure. The individuating
      difference is the frozen decision apparatus - the tail rule, the null's role, the
      threshold source, the enumeration, the perturbation ladders and the branch structure -
      and an experiment is individuated by its frozen apparatus as much as by its object.
      Filing it as a control on EXP-DS-001 is independently barred by
      CTRL-RT047-MATCHED-NULL.budget.new_dependencies, which forbids summation-polynomial
      arithmetic in that lane.
    what_is_inherited_as_a_quotation_rather_than_rewritten: 'd_half, the D_formula, u_star_formula, constant_factor_c = 8, min_samples_per_bit_size, both Bsm ladders, the rho reference table and AP-1.'

  # ==================================================================
  # PART IV - RATIONALE FOR THE BATCH-025 DESIGN
  # ==================================================================
  rationale:
    - >-
      THE ABSOLUTE-VERSUS-RELATIVE DISTINCTION IS THE DESIGN, NOT A CAVEAT ON IT. HEUR-DS-1
      is an ABSOLUTE claim against a theoretical reference. A two-sample design is blind BY
      CONSTRUCTION to any deviation both arms share - ALT-CLASS-DEP-1's U1, established in
      this campaign and not hypothetical - so a two-sample comparison against uniform
      integers cannot decide it. ABS-REL-LPF-1 therefore splits the heuristic into its two
      literal limbs and measures them separately: LIMB B, the absolute limb, reads
      R(u) = p_hat(u)/rho(u) against the frozen band [1/8, 8] with rho THEORETICAL and never
      replaced by a sample; LIMB A, the relative limb, reads each certifying statistic against
      the MEASURED band of 200 uniform-integer replicates at the same n and X. The uniform arm
      is APPARATUS CALIBRATION AND NOT THE COMPARISON, and STAT-KS2-CAL is declared
      NON-CERTIFYING in advance so no branch can be satisfied by a two-sample agreement alone.
    - >-
      THE REFERENCE IS THEORETICAL AND THE THRESHOLD IS MEASURED, AND THAT SEPARATION IS THE
      REPAIR OF BATCH-022. The analytic law enters through the STATISTIC, where it belongs,
      because that is what makes the comparison absolute; the THRESHOLD is always a measured
      order statistic, because that is what makes the test attainable at a finite X. If the
      uniform arm itself leaves the [1/8, 8] band at a rung, LIMB B IS NOT DECIDABLE AT THAT
      RUNG BY THIS APPARATUS - reported as a statement about the apparatus and the reference,
      never as a result about the Semaev map. The cost of the measured band is declared as
      uncertified class V1 rather than hidden.
    - >-
      THE TAIL STATISTIC IS REBUILT FROM THE GROUND UP BECAUSE THE OLD ONE COULD NOT PASS.
      TAIL-DS-1 passes with probability 1/e = 0.3679 on a perfectly correct uniform sample,
      and at the toy X the asymptotic rho under-predicts deep-tail smoothness, pushing it
      lower still and in exactly the direction that would be misread as a Semaev finding.
      TAIL-LPF-1 replaces the single extreme order statistic with the TENTH largest Z_j,
      reads it against a two-sided MEASURED band with an exact pre-datum false-fire
      probability of 4/201 = 0.0199, and REQUIRES its attainability to be demonstrated in
      BOTH directions with measured numbers before the reading rule freezes - upward by the
      derivable-smooth control and downward by the top rung of the rough ladder. A missing
      demonstration strikes the statistic rather than carrying it.
    - >-
      ALL FOUR ESTABLISHED DISCIPLINES ARE CARRIED AND A FIFTH IS ADDED. ATTAINABILITY, with
      the argument in MEASURED numbers, every branch classified, checked as a named reviewer
      duty whose rejection is a REVISE, and extended by three clauses from the BATCH-024
      failure - no branch may key on a ledger status, no control leg may be an unbanded
      existential over many comparisons, and no branch may depend on a quantity the
      measurement arm cannot change. CALIBRATION-FIRST with ATS-LPF-1 hash-binding the
      threshold RULE before the numbers exist and hash-binding the DRIVER across the
      calibration/measurement boundary. DECISION-VARIABLE VARIATION with DECAY-LPF-1 as the
      named artifact tell. THE ALTERNATIVE-CLASS DECLARATION ALT-CLASS-LPF-1, naming S1, S2
      and S3 as certified and V1 through V7 as uncertified, verified against driver source.
    - >-
      THE FIFTH DISCIPLINE, PERTURB-MOVE-1, IS THE DIRECT LESSON OF BATCH-024 AND IT IS
      MANDATORY. EVERY PLANT OR PERTURBATION MUST BE DEMONSTRATED TO MOVE THE STATISTIC IT IS
      MEANT TO MOVE, BY MEASUREMENT AT EVERY RUNG IT CERTIFIES, NOT AT ENDPOINTS ONLY, written
      to a machine-readable table with one row per (family, rung, cell, statistic). At
      BATCH-024 the analogous control CTRL-DEP-MONO WENT UNEVALUATED AND THAT IS EXACTLY WHERE
      THE FAILURE HID - the endpoints that were measured belonged to the one sound family. A
      rung with no recorded movement is UNCERTIFIED and a family whose top rung shows no
      movement is STRUCK from the certified list rather than reported as low power. It costs
      nothing here because both plants replace samples with integers of KNOWN factorization.
    - >-
      BOTH DIRECTIONS ARE MEASURED, BECAUSE A ONE-SIDED INSTRUMENT REPORTED AS TWO-SIDED IS
      AP-3 IN A NEW COAT. Intermediates smoother than reference and rougher than reference are
      both departures from HEUR-DS-1; only the first would help an attacker; every band is
      two-sided and the smooth and rough perturbation ladders are both run at every rung.
    - >-
      THE ONE GENUINELY EXPENSIVE THING THIS CAMPAIGN HAS PROPOSED IS GATED RATHER THAN HOPED.
      Factoring 200 x 130816 x 2 integers is the binding cost. The plant ladders add NO
      factorization because they replace samples with integers of known factorization, and the
      driver must run a 10000-sample PILOT per cell, extrapolate, and ABORT BEFORE STARTING if
      the projection exceeds budget. AN ABORT AT THAT GATE IS A BUDGET EVENT AND IS REPORTED AS
      ONE - L-0 instrument signal, never a result, and never silently converted into a
      reduced-scope run by the Executor. Reducing R_CAL below 200 requires a Coordinator
      protocol_amendment.
    - >-
      EVERY FACTORIZATION IS RE-VERIFIED AT 100 PERCENT OF SAMPLES - each returned factor
      tested for primality and the product asserted equal to N - with the verification count
      archived. This is the certificate analogue required by docs/claims-and-verification.md in
      a lane that produces no solve certificate. A FACTORIZATION THIS EXPERIMENT DID NOT VERIFY
      IS NOT A MEASUREMENT, and a wrong factorization would silently poison every statistic.
    - >-
      ONE UNADJUDICATED READING FROM THREE BATCHES AGO IS ROUTED TO THE REVIEWER RATHER THAN
      INHERITED SILENTLY. EXP-SMTH-001 flagged the D_formula reading - that "D = 2**40" names
      the bits = 20 cell while D at bits = 16 is 2**32 - for its reviewer, and that review never
      completed. DREAD-LPF-1 carries the reading explicitly and TASK-20260801-054 must CONFIRM
      OR REJECT IT; a rejection is a REVISE.

  evidence_refs:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-040/contract_review.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-040/attainability_check.md
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-040/anti_tuning_check.md
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-040/alternative_class_check.md
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/archives/TASK-20260801-041/snapshot_commit_receipt.json
    - ledger/decisions/DEC-20260801-009.yaml
    - ledger/decisions/DEC-20260801-008.yaml
    - ledger/evidence/EV-EQD-001.yaml
    - ledger/hypotheses/H-DEP-001.yaml
    - experiments/EXP-DEP-001/specification.yaml
    - experiments/EXP-DEP-001/reading_rule.yaml
    - experiments/EXP-SMTH-001/specification.yaml
    - experiments/EXP-LPF-001/specification.yaml
    - ledger/hypotheses/H-LPF-001.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/dispatch_queue.json
  evidence_refs_note: >-
    NO NEW EMPIRICAL EVIDENCE IS CITED OR CREATED BY THIS DECISION. No run exists for
    EXP-LPF-001 and no run was executed for the EXP-DEP-001 measurement arm, so no evidence
    record is filed for either. Every citation above is to an already-committed artifact
    except the three BATCH-025 artifacts authored in this same opening, which are committed by
    TASK-20260801-048 and by the control-plane open commit.

  # ==================================================================
  # PART V - LIMITATIONS
  # ==================================================================
  limitations:
    - >-
      TOY TIER ONLY - field sizes 16 and 20 bits, D = 2**32 and 2**40. AGENTS.md rule 7
      applies with full force. No crypto-scale, medium-scale, asymptotic or affected-scheme
      claim under any branch; no scheme is affected and none is declared safe; all four
      promotion gates G1 through G4 remain OPEN.
    - >-
      A FAVOURABLE OUTCOME IS NOT A VALIDATION OF HEUR-DS-1, AND THIS IS THE MOST LIKELY
      OVERCLAIM AVAILABLE FROM THIS BATCH. HEUR-DS-1 is used in cost reasoning at cryptographic
      D; this measures its instance at toy D. Uncertified class V6 states the reason. What the
      batch does is make the heuristic falsifiable somewhere for the first time and supply the
      smallest rung of a validation ladder whose upper rungs do not yet exist.
    - >-
      DELIBERATELY NOT A REPLICATION. The same two curve instances are used so that this
      measurement and EV-EQD-001's are of the same 130816 objects. Nothing here can move
      anything toward `replicated` and RT049-CTRL-5 remains owed.
    - >-
      NO SEARCH, NO COST, NO TIMING DECISION VARIABLE, NO R, NO EXPONENT. S1_met, F1_met,
      F2_met and structure_gate_passed cannot be evaluated at all.
    - >-
      FORBIDDEN THROUGHOUT - `support` for H-LPF-001, H-SMTH-001, H-DS-001, H-EQD-001 or
      H-DEP-001; validation or refutation of HEUR-DS-1 above the toy tier in either direction;
      asymptotic promotion; `reject_scoped` and in particular reject_scoped-as-impossibility;
      dominated_by null; and equally any characterization of BATCH-021, BATCH-022, BATCH-023 or
      BATCH-024 as vacuous or worthless, which would be premature closure under
      docs/inventor-protocol.md section 4.
    - >-
      THE STANDING MODEL-INDEPENDENCE CAVEAT APPLIES UNCHANGED - author, executor, validator,
      reviewer, red team and coordinator all resolve to claude-opus-5, independence is
      PROCEDURAL and not model-level, model_verified is false everywhere, and NOTHING IN
      BATCH-025 IS ADMISSIBLE TOWARD THE AGENTS.md RULE 13 THREE-MODEL CLOSURE QUORUM.
