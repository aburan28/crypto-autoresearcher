  the_decision_stated_plainly: >-
    RUN-FROB-c27b95's interruption is diagnosed, honestly and without
    fabrication, as the SAME failure family that destroyed
    RUN-FROB-b91d47, RUN-FROB-9c4e81, RUN-FROB-e6c204, RUN-FROB-a91f4c,
    RUN-FROB-35c3b1, RUN-FROB-5fa3f0, RUN-FROB-0b1c8e, RUN-FROB-5490f1,
    RUN-FROB-16ecb6, RUN-FROB-f3e2a3, and RUN-FROB-39714f: a
    whole-environment/container restart external to any script's own
    control, external to any timeout wrapper (there was none this time
    either), and external to any code defect in
    driver-v2.py/checker-v2.py. This is the TWELFTH, CONSECUTIVE instance of
    the identical infrastructure failure family under the same,
    already-corrected source and launch procedure, launched correctly by the
    dispatching session every time. UNLIKE every prior restart in this lane,
    this one carries a genuine, unresolved ambiguity in its OWN survival
    duration, honestly disclosed rather than resolved by assumption: the
    process's last observed file write was at 06:41:08.183330Z (roots.jsonl.gz
    reaching 24241579 bytes), but the confirming reboot was not observed
    until 07:34:58Z, roughly 53 minutes later, and no telemetry from inside
    the destroyed environment survives to say whether the process died near
    06:41 (true interval ~3.5-4min, consistent with the existing range) or
    kept running silently with no further writes until the reboot (~53min,
    which would be both this lane's longest survival by a wide margin and a
    previously unobserved silent-hang sub-mode). This record does not pick
    one of these two readings and does not average or split the difference;
    it records the true interval for this twelfth point as GENUINELY
    UNKNOWN, bounded only by [~3.5min, ~53min]. This uncertainty is itself
    infrastructure/observability signal, never negative mathematical
    evidence about H-FROB-73df22 (AGENTS.md core rule 3 / CLAUDE.md rule 3),
    and this record does NOT condition its own authorization on either
    resolution of it. None of the twelve says anything about H-FROB-73df22.
    On that basis, this coordinator (1) makes no change to RUN-FROB-c27b95's
    directory -- it was already committed and pushed exactly as it stands
    (full, non-oversized roots.jsonl.gz, 24241579 bytes, sha256
    5c54c450458a97c5a0b51fe465d31dea0d6c040dd7fbb71e3090a5005beff80c, and the
    other six adapter/launch files, no execution-receipt.json) by the
    dispatching session prior to this engagement, and this record does not
    touch it again -- and (2) authorizes a fresh retry under a fresh,
    coordinator-proposed (NOT yet allocate_id.py-confirmed) run_id,
    RUN-FROB-b8e451, via a fresh trial-plan-stage0-v17.json, a fresh
    run-binding, and a fresh launch handoff to the Executor
    (TASK-20260921-802368), per the user's standing instruction to keep
    retrying automatically through this exact recurring failure mode.

  rationale:
    - >-
      TWELFTH, CONSECUTIVE INSTANCE OF THE SAME FAILURE FAMILY, STILL
      INFRASTRUCTURE/PROTOCOL SIGNAL, NEVER NEGATIVE MATHEMATICAL EVIDENCE,
      PER AGENTS.md CORE RULE 3 / CLAUDE.md RULE 3. RUN-FROB-c27b95 is not a
      new, distinct failure family; its resulting run-directory shape (real
      partial scientific output, no execution-receipt.json, entire process
      tree including the Python supervisor destroyed before any
      receipt-writing logic could run) matches every one of its eleven
      predecessors under driver-v2.py/checker-v2.py. Twelve-for-twelve
      launch attempts under driver-v2.py/checker-v2.py have now been killed
      by whole-environment restarts, all non-scientific, non-protocol
      infrastructure signal. None of RUN-FROB-c27b95, RUN-FROB-b91d47,
      RUN-FROB-9c4e81, RUN-FROB-e6c204, RUN-FROB-a91f4c, RUN-FROB-35c3b1,
      RUN-FROB-5fa3f0, RUN-FROB-0b1c8e, RUN-FROB-5490f1, RUN-FROB-16ecb6,
      RUN-FROB-f3e2a3, or RUN-FROB-39714f says anything about H-FROB-73df22,
      RQ-FROB-7d8dd4, or whether Frobenius structure moves the index-calculus
      exponent.
    - >-
      THE HONEST AMBIGUITY ITSELF, STATED PLAINLY, NOT RESOLVED BY
      ASSUMPTION. This twelfth restart is qualitatively different from the
      prior eleven in exactly one respect: for the first time, this lane
      cannot determine its own true survival duration, because the
      dispatching session's monitoring turns did not fire between the last
      observed write (06:41:08Z) and the confirmed reboot (07:34:58Z), a
      roughly 53-minute monitoring gap. This record explicitly declines to
      default to treating the interval as "~3.5-4min, consistent with
      history" merely because that reading is more convenient or more
      consistent with the existing characterization -- that would be
      resolving a genuine unknown by assumption, which AGENTS.md core rule 5
      (never fabricate) forbids as surely as inventing a number outright. It
      equally declines to assert the ~53min reading as fact, since the
      process could just as easily have died minutes after its last write
      and produced identical observable evidence (silence, followed by a
      restart at the next check). The honest statement is: this twelfth
      point's true interval lies somewhere in [~3.5min, ~53min], and which
      value it actually is CANNOT be recovered from the artifacts that
      survive a whole-environment restart. This record carries that interval
      forward as an explicit range, not a point estimate, distinct from the
      prior eleven honestly-known point values (20, 11, 9, 7, 4, 5, 37, 3.5,
      9, 15, 5 minutes). If the ~53min reading is correct, it would also be
      a previously unobserved failure SUB-MODE (a long silent hang preceding
      an abrupt restart) distinct from every prior abrupt-kill-while-
      actively-writing observation; this record flags that possibility
      honestly without asserting it as established, since a single
      ambiguous data point cannot establish a new sub-mode any more than it
      can establish a resolved duration.
    - >-
      NO FABRICATED RECEIPT, AND NO REDUNDANT PRESERVATION ACTION. This
      decision does NOT author an execution-receipt.json for RUN-FROB-c27b95,
      and does not construct, estimate, or infer one from the partial
      roots.jsonl.gz or from what a graceful interruption receipt would
      ordinarily contain. RUN-FROB-c27b95's directory was already committed
      and pushed exactly as found by the dispatching session, prior to this
      engagement, in commit 6f12cfedb -- this coordinator's own Glob confirms
      it still contains exactly seven entries (launch.json, command.txt,
      stdout.log, stderr.log, environment.json, tuples.jsonl.gz,
      roots.jsonl.gz) and no execution-receipt.json or other downstream
      adapter/checker artifact. Per AGENTS.md core rule 5, this record does
      not edit, complete, or backfill that directory in any way.
    - >-
      NO OVERSIZED-ARTIFACT HANDLING WAS NEEDED THIS TIME, AND NONE IS
      MANUFACTURED. RUN-FROB-c27b95's roots.jsonl.gz (24241579 bytes,
      reported_by_session) is well under GitHub's 100MiB per-file limit and
      was committed directly, like RUN-FROB-b91d47's (31843558 bytes) and
      unlike RUN-FROB-9c4e81's (151339023 bytes) or RUN-FROB-35c3b1's
      (486954627 bytes), both of which required a
      roots.jsonl.gz.oversized-artifact-pointer.json disclosure pointer.
      This coordinator's own Glob confirms no oversized-artifact-pointer.json
      exists in RUN-FROB-c27b95's directory. This is a difference in file
      size only, not a scientific or protocol difference.
    - >-
      THE RUNTIME LOCK BEING CITED REMAINS THE SAME, STILL-CURRENT, STILL-
      UNEDITED, LAUNCH-AUTHORIZED LOCK. This coordinator carries forward
      linux-runtime-lock-successor-20260914-c85f6a.json's content sha256
      (46d918a1a4b9d358df39f09a87d5221128cc1ce19cb62672bc35204785952eb5)
      unchanged from trial-plan-stage0-v16.json's and
      run-binding-stage0-v16-retry-20260921.json's own already-filled
      runtime_lock_sha256 fields (all agree, re-read directly in this
      engagement). Nothing about the runtime, its guards, or its
      authorization changes here; a twelfth whole-machine restart -- even
      one whose exact duration is ambiguous -- is not evidence the runtime
      lock's own guards were inadequate against a class of event (whole-
      machine restart) no per-process guard in that lock claims to protect
      against.
    - >-
      WATCHDOG SIZING RATIONALE REMAINS VALID, UNCHANGED EVEN UNDER THE
      AMBIGUOUS READING. Even under the longer, ~53-minute reading of this
      twelfth interval -- which would be this lane's longest survival to
      date, exceeding RUN-FROB-35c3b1's own ~37-minute record -- it remains
      far short of the 86400s watchdog ceiling, and RUN-FROB-c27b95 showed
      no confirmed sign of hanging even under that reading (only an absence
      of monitoring turns during the gap, not a confirmed absence of
      progress). 86400 seconds remains sized generously above the longest
      duration this lane can currently establish under either reading and
      remains a ceiling meant never to bind in the normal case, machine
      protection only per CLAUDE.md "Research budgets: progress first".
    - >-
      DIRECTION CHECK, unchanged from the whole DEC-20260909-bf5b48 ..
      DEC-20260921-2de531 chain. Stage0 is not itself exponent-moving; it is
      the correctness gate for H-FROB-73df22's two arms. No scientific claim
      of any kind is advanced by this admission/retry-authorization record.
      FROB is a declared ECC area (orchestration/research-priority.yaml line
      79), ranked ahead of non-ECC candidates at every selection point, with
      unlimited batch/wall-clock budget per AGENTS.md "ECC comes first."
    - >-
      BUDGET. Per CLAUDE.md "Research budgets: progress first" (2026-09-06):
      research cost estimates are advisory and require no repeated user
      approval; the Coordinator continues justified work within the
      authorized research scope. No 90-day stagnation review is active or
      warranted -- this lane has shown continuous documented progress across
      DEC-20260909-bf5b48 through DEC-20260921-2de531 and now this record,
      all within roughly two weeks, including twelve genuine, correctly-
      executing partial runs each destroyed only by infrastructure external
      to this program's own control. Authorizing a further retry after a
      twelfth, consecutive infrastructure-only interruption -- even one whose
      exact duration is ambiguous -- is exactly the kind of routine
      continuation CLAUDE.md's "progress first" instruction protects, not a
      new spending decision requiring fresh justification. This is
      additionally, and explicitly, covered by the user's own standing
      instruction, relayed by the dispatching session, to keep retrying
      automatically through this exact recurring failure mode -- stated
      multiple times already. This coordinator's role is to execute that
      instruction faithfully via a proper decision record, not to
      second-guess it. A whole-machine restart mid-run is squarely within
      "watchdog expiry checkpoints a task; it does not exhaust the
      campaign."
    - >-
      NA-4's INFRASTRUCTURE-DIAGNOSIS RECOMMENDATION REMAINS OUTSTANDING AND
      IS REAFFIRMED, NOT RE-OPENED AS A NEW GATE -- AND THIS TWELFTH,
      NEWLY-AMBIGUOUS INSTANCE MAKES IT MORE VALUABLE, NOT LESS.
      DEC-20260921-1988f5's own NA-4, reaffirmed by every intervening
      decision through DEC-20260921-2de531, recommended, non-blockingly,
      that the dispatching session open a dedicated infrastructure-diagnosis
      task once the five-for-five trigger DEC-20260921-fd5bf1 itself named
      was met. This record has not been told, and does not assume, that this
      diagnosis task has been opened, run, or completed. A TWELFTH
      consecutive instance -- now including a monitoring gap that leaves the
      interruption's own duration and possibly its failure sub-mode
      genuinely unknown -- is further, unambiguous reinforcement that this
      diagnosis remains worth pursuing, and specifically that any such
      diagnosis should also capture continuous (not just periodic)
      monitoring where feasible, so a future interruption's duration is not
      lost to a monitoring gap the way this one was. This record reaffirms
      the recommendation rather than re-litigating or escalating it into a
      new condition -- it still runs in PARALLEL with, and never blocks, the
      retry authorized here.
    - >-
      TWO DIVERGENT COUNTS, REPORTED HONESTLY AND SEPARATELY, CONSISTENT
      WITH THIS CHAIN'S OWN PRIOR NUMBERING. This lane has now seen TWELVE
      genuine launch-and-restart cycles under driver-v2.py/checker-v2.py
      (RUN-FROB-39714f through the current RUN-FROB-c27b95) and, counting
      RUN-FROB-2404fa (genuine but under the pre-fix driver.py) as this
      lane's first genuine launch overall, RUN-FROB-c27b95 is the THIRTEENTH
      genuine launch attempt overall -- one more than trial-plan-stage0-v16.json's
      own amendment.reason, which described its own subject (RUN-FROB-c27b95
      itself) as "the TWELFTH genuine launch attempt overall counting
      RUN-FROB-2404fa"; this record increments that same count by exactly
      one for the fresh run authorized here, RUN-FROB-b8e451, making it the
      FOURTEENTH genuine launch attempt overall by that same counting
      convention. Separately, this is the SEVENTH trial-plan VERSION minted
      since v11 (v11, v12 [never launched, wiring bugfix], v13, v14, v15,
      v16 [all four launched, ninth through twelfth restarts], and v17, this
      record's own authorization). This record does not collapse the
      launch-and-restart count and the trial-plan-version count into a
      single number in either direction, and does not count the v12
      non-launch as an additional restart or omit it from the record's own
      history.

