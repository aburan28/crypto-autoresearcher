      BATCH." That batch (the historical four-batch allocation: BATCH-001,
      BATCH-002, BATCH-003, BATCH-403f13) is now fully consumed, its one
      substantive open item (NC-3/NC-6) has been attempted and failed at
      infrastructure, and the goal's own PRE-COMMITMENT
      (pause_condition_watch, recorded BEFORE BATCH-403f13 ran) states: "After
      it, this goal moves to paused or closed_at_budget with the narrowest
      supported result recorded... never completed." Pause condition 2 ("The
      empirical calibration cannot be brought below the irreproducibility
      band within the campaign budget") was already triggered for criterion 1
      by DEC-20260802-48c72c and remains triggered; nothing in this batch
