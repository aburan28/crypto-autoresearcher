      makes no success claim and precisely names why continuation stopped
      (budget, not an external blocker or a pending mechanical step), per
      tools/validate_ledger.py's own documented distinction.
    resume_condition: >-
      NC-3/NC-6 (Heuristic 1's tail validation at the operating point,
      EXP-P13-NC36/specification.yaml, frozen -- NOT itself repaired or
      re-approved here) successfully executing to a determinate outcome
      (pass, fail, or an honestly-reported feasibility verdict) under a
      working isogeny-walk-capable execution environment, NOT another
      infrastructure failure, PLUS a new campaign_budget authorization
