  central_adjudication: >-
    THE UNDERLYING MEASUREMENT WORK OF BATCH-403f13 IS SOUND ON INDEPENDENT
    REVIEW AND IS RATIFIED HERE UNDER A TEMPLATE-CONFORMANT RECORD. THE PRIOR
    ARCHIVE ATTEMPT WAS PROCEDURALLY DEFECTIVE AND IS SUPERSEDED, NOT
    RATIFIED AS WRITTEN.
    (1) NC2d-PROPER (EXP-P13-NC2d, RUN-P13-NC2d-a): FC-4 does not fire at the
    operating ell range {47,101,151,211} (gap 0.0606 < 0.15); FC-2 does not
    fire (jackknife range [1.1260,1.1410] contained in [0.85,1.15]); no
    residual trend (b=0.0206 <= 0.10). This retires MECHANISM-INCONSISTENT on
    assumption L5 WITHIN THAT SCOPE, by measurement -- the one legitimate
    route DEC-20260802-48c72c itself specified. It does NOT lift the
    original FC-4 firing at ell in {3,5,7,11,13} (EXP-PEC-49c773), which
    stands as record.
    (2) NC2b-SLOPE (EXP-P13-NC2b, RUN-P13-NC2b-a): all 10 W-MID synthetic-
    slope recovery checks pass (worst error 0.0926 of a 0.75-bit tolerance),
    validating the estimator's sensitivity to a known non-zero exponent --
    power against assumption L1 that the flat NC2b-G1 null could not supply.
    It is NOT a test of L1 itself.
    (3) The bibliographic subtask retrieved all three named sources
    (Sutherland ANTS-X 2013, Santos-Costello-Shi, Adj et al.); the baseline
    constant k remains unquantified, requiring the Wesolowski paper body.
    (4) NC-3/NC-6 (Heuristic 1 tail validation) was attempted and FAILED AT
    INFRASTRUCTURE (empty Executor result). Per AGENTS.md rule 5 this is
    never evidence for or against Heuristic 1. It remains the single
    substantive item DEC-20260802-48c72c named as "the decisive remaining
    gap," now attempted exactly once, unsuccessfully, in this goal's entire
    budgeted history.
    Both items (1)-(2) were independently reviewed: Validator
    TASK-20260804-cf1ae3 (accept_with_qualifications, independently
    recomputing the pooled alpha/gap/jackknife arithmetic and the NC2b-SLOPE-
    G1 ten-check gate) and Red Team TASK-20260804-83d874
    (pass_with_constraints, confirming the Phi_ell measurements are real and
    raising six labelled objections, none an execution defect -- most
    materially RT-OBJ-B, RT-OBJ-A and RT-OBJ-F, carried into
    EV-WESO-ea9525.unresolved_confounds).
    NONE OF THIS WAS EVER OFFICIALLY, VALIDLY ADJUDICATED. DEC-20260804-e19a65
    used `decision: support_scoped`, outside templates/research-records.md's
    nine-value vocabulary; its claimed hypothesis-status transition to two
    strings H-WESO-001.yaml has never used was never applied to that record;
    ledger/goals/GOAL-P13-001.yaml was never advanced (no BATCH-403f13
    checkpoint, batches_consumed left at 3, status left `active`); the
    shipped KN-FIND-4e7a92/KN-FIND-d1c853 promote content ("C_corrected =
    phi(ell)*C_Phi_ell + C_walk"; "N_pairs ~ exp(H_1*n_walk)") that does not
    match what DEC-20260802-48c72c bindingly scheduled and does not visibly
    trace to the cited run; and EV-WESO-b6ceff itself uses non-vocabulary
    `direction`/`strength`/`claim_tier` values and cites an untraceable
    `recorded_by_task`. This decision repairs exactly those defects.

