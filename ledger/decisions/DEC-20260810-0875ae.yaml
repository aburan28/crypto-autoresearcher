      the user's 2026-08-02 direction, but that amendment explicitly stated
      "no pause condition is claimed to have fired on it by this amendment"
      and did not relax total_wall_clock_seconds or max_concurrent; every
      record in this goal's history -- including the superseded next_action,
      BATCH-403f13's own design report, and this goal's pause_condition_watch
