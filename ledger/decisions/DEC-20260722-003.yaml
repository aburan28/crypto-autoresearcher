    - coordination/goals/GOAL-MLKEM-001/batches/BATCH-001/tasks/TASK-20260722-204/red_team_report.yaml
  limitations:
    - This decision makes no empirical or cryptographic-scale claim.
    - It does not reject all structured or covariance-aware ML-KEM attacks.
    - Source access limitations leave LaMS composition details unresolved.
  next_actions:
    - >-
      Derive one exact carry-aware LaMS layer under negacyclic isometries,
      reduce its score to or separate it from rotated-vector prior art, and
      regenerate a corrected commit-pinned matched baseline before any code.
