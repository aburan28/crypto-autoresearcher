  decision: supersede

  decision_note: >-
    `supersede`, and in the narrow sense of RE-ESTABLISHING A DESTROYED RECORD
    UNDER A COLLISION-PROOF IDENTIFIER. This record supersedes the destroyed
    GOAL-DREG-001 BATCH-005 decision; it does NOT claim to BE that record, and it
    is not a re-adjudication on new evidence. The original content is recoverable
    at 4692de41f:ledger/decisions/DEC-20260731-014.yaml and this decision carries
    the SAME substantive adjudication, restated verbatim in substance below. It
    is NOT `expand` at the top level even though the adjudication it restores is
    to expand, because the operative act here is restoration and reconciliation,
    not the opening of new work: no batch is opened, no task is dispatched, and
    no budget is spent by this record. It is NOT `support` or `reject_scoped`,
    because no hypothesis status moves. It is NOT `revise`, because nothing is
    returned for rework. It does NOT supersede, contest, or touch
    ledger/decisions/DEC-20260731-014.yaml as it stands today - that path holds
    another campaign's valid GOAL-ECDLP-001 / BATCH-021 record, which is left
    exactly alone.

  target_ids:
    - GOAL-DREG-001
    - H-DREG-001
    - EV-DREG-008
    - BATCH-004
    - BATCH-005

  rationale:

    - id: D-1
      what: >-
        THE RESTORED ADJUDICATION, CARRIED FORWARD UNCHANGED IN SUBSTANCE:
        EXPAND AT LADDER SCOPE, NO H-DREG-001 STATUS CHANGE, CELL-ONLY
        STRUCTURAL PIN.
      why: >-
        The destroyed BATCH-005 decision recorded `expand` on the reasoning that
        the independent red-team PASS accepts support-aligned admission, set-hash
        rebuild match, and quarantine-coherent citation of deficit_genuine=17947
        at the frozen cell; that GOAL-DREG-001 completion still requires
        on-lattice n-ladder measurements, so this cell pin alone does NOT support
        and does NOT reject H-DREG-001 at ladder scope; that the next step is to
        expand to additional ladder cells and seeds under the same CTRL-B
        instrument, or to pause if PATH capacity prioritizes elsewhere; and that
        independence was weakened by authorized model fallback and a sibling
        pickle residual, with no d_reg theorem claimed. Nothing in the intervening
        record disturbs any of that, so it is restored as it stood rather than
        rewritten with hindsight.
      evidence: >-
        CORR-20260810-d018d2 destroyed_decision_recovered_content, recoverable at
        4692de41f:ledger/decisions/DEC-20260731-014.yaml; EV-DREG-008;
        RT-20260731-013.

    - id: D-2
      what: >-
        THE MEASUREMENT THIS ADJUDICATES, STATED AT ITS OWN SCOPE.
      why: >-
        EV-DREG-008 records CTRL-B at the frozen cell n=12, t=3, ti=0, seed=2026,
        D=6 with ctrl_b_admission_status=admitted, all_admission_metrics_pass,
        rank_null_restricted=156520 and deficit_genuine=17947 (=156520-138573),
        landing at the UPPER ENDPOINT of the preregistered bracket [1931, 17947];
        validity=completed_valid; strength preliminary; claim_tier toy; direction
        supports. EV-DREG-008 SURVIVES INTACT on origin/main and its digest
        matches the TASK-20260731-027 ledger receipt exactly, so the evidence
        this decision adjudicates is present and byte-bound even though the
        decision that adjudicated it was lost.
      evidence: ledger/evidence/EV-DREG-008.yaml; CORR-20260810-d018d2.

    - id: D-3
      what: >-
        THE INDEPENDENT REVIEW, WITH ITS FALLBACK QUALIFICATION STATED IN FULL
        AND NOT ROUNDED UP.
      why: >-
        Red-team RT-20260731-013 (TASK-20260731-026) returned verdict PASS in an
        INDEPENDENT SESSION. Its inference block records requested policy
        review-xhigh with fallback_used: true, resolved_model_id
        cursor-grok-4.5-high-fast, authorization_ref AMEND-PATH-001-001, and
        equivalence_to_requested_policy_claimed: false. THIS IS NOT AN
        UNQUALIFIED review-xhigh REVIEW and must never be described as one. The
        PASS is admitted at exactly the weight the report itself claims: it
        establishes that the receipt's admission of deficit_genuine=17947 is
        support-aligned and does not smuggle the quarantined raw formula, and it
        explicitly does not grant ledger promotion or an H-DREG-001 status
        change.
      evidence: >-
        coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-026/red_team_report.yaml

    - id: D-4
      what: >-
        THE BATCH-002 "RAW 17947 IS CONFOUNDED; GENUINE VALUE SOMEWHERE IN
        [1931, 17947]" NARRATIVE IS SUPERSEDED BY THE UPPER-ENDPOINT
        MEASUREMENT - EXACTLY AS EV-DREG-008 STATES AND NO FURTHER.
      why: >-
        BATCH-002 quarantined the raw sem-null D6 deficit as confounded, reasoned
        informally that most of it was a degree-6 support gap so the genuine
        signal would be O(10^3), and left the genuine value bracketed in
        [1931, 17947] pending CTRL-B. CTRL-B measured the upper endpoint. The
        superseding statement is the one EV-DREG-008 makes: the numerical
        equality is the UPPER-INTERVAL CASE rank(null | sem_support) = sr_pred -
        that is, the deleted degree-6 columns contributed zero rank - and it is
        NOT a re-citation of the confounded raw label. The formulas remain
        distinct: sr_pred - rank_sem stays quarantined_confounded as a formula;
        the admitted structural quantity is deficit_genuine =
        rank(null | sem_support) - 138573. What is superseded is BATCH-002's
        informal O(10^3) EXPECTATION, which the red team itself characterised as
        an upper-bound possibility envelope rather than a hard prediction. The
        quarantine of the raw formula is NOT lifted by this decision.
      evidence: >-
        EV-DREG-008 observations and unresolved_confounds; RT-20260731-013
        objection OBJ-013-1 (disposition: discharged for smuggling, open as
        coordinator narrative debt) and critical_anomaly_disposition
        equality_mechanism; GOAL-DREG-001 BATCH-002 checkpoint.

    - id: D-5
      what: >-
        THE CLAIM BOUNDARY, RESTATED AS A BOUNDARY AND NOT AS A HEADLINE.
      why: >-
        This is ONE TOY CELL at claim_tier toy. deficit_genuine=17947 is the
        support-aligned D6 structural number AT THE FROZEN CELL ONLY. It is NOT a
        d_reg theorem, NOT an n-ladder law, NOT a cross-n trend, NOT
        crypto-scale, and NOT an attack claim; no sub-rho statement follows and
        Pollard rho is unaffected. No rho or BSGS comparison is owed or licensed
        by a structural-number card. Evidence strength is preliminary and the
        direction `supports` is recorded at that strength, which is why no
        hypothesis status moves on it.
      evidence: >-
        EV-DREG-008 boundaries; RT-20260731-013 required_controls CTRL-013-LABEL
        and CTRL-013-SCOPE, narrowest_supported_statement, baseline_comparison;
        coordination/goals/GOAL-DREG-001/batches/BATCH-004/batch.yaml
        claim_boundary.

    - id: D-6
      what: >-
        THE GOAL HEAD IS RECONCILED IN THE SAME ACT, BECAUSE A STALE HEAD IS HOW
        A LOST DECISION STAYS LOST.
      why: >-
        The head of ledger/goals/GOAL-DREG-001.yaml stood at current_batch_id
        BATCH-003, updated_at "2026-07-27", latest_verified_commit bedd64c (a
        BATCH-002 producer snapshot from 2026-07-21), with checkpoints stopping
        at BATCH-003 and a next_action still directing monitoring of an external
        driver "since 14:39" and still asserting that the raw 17947 headline
        "stays QUARANTINED as confounded until" CTRL-B - which has since run,
        been red-teamed PASS, and produced EV-DREG-008. BATCH-004 (CTRL-B
        protocol design and authorization; EV-DREG-007, DEC-20260725-026) and
        BATCH-005 (CTRL-B execution) both completed with archive receipts on
        disk and neither had a checkpoint. This decision is archived together
        with surgical edits that advance current_batch_id and dispatch_queue_path
        to BATCH-005, set latest_verified_commit to the content-verified producer
        snapshot 2f7771fa0124cca31ef446fbec6aefc5b64a52d7, set updated_at to
        2026-08-10, replace the stale next_action with exactly one concrete next
        action, and APPEND (never alter) BATCH-004 and BATCH-005 checkpoints. The
        goal `status` stays `active` and no completion criterion is claimed.
      evidence: ledger/goals/GOAL-DREG-001.yaml; CORR-20260810-d018d2.

    - id: D-7
      what: >-
        WHAT IS STILL BROKEN AND IS NOT FIXED BY THIS RECORD.
      why: >-
        The BATCH-005 archive chain's CONTENT BINDING remains broken: 6 of 9
        paths declared by the TASK-20260731-025 snapshot receipt and 2 of 2
        review paths declared by the TASK-20260731-027 ledger receipt fail
        verification against their own declared paths, and every BATCH-004 and
        BATCH-005 receipt carries commit_sha: null and parent_sha: null. A
        coordinator decision cannot repair a receipt, and editing one in place is
        forbidden. TASK-20260810-13ff25 is recorded for a later session with the
        capability to do it, by SUPERSESSION only. Until that repair lands, the
        durable basis for this campaign's BATCH-005 claim is the content
        verification at 2f7771fa0124 reported in CORR-20260810-d018d2, not the
        receipts as they stand.
      evidence: CORR-20260810-d018d2; ledger/handoffs/TASK-20260810-13ff25.yaml.

  evidence_refs:
    - EV-DREG-008
    - coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-026/red_team_report.yaml
    - coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-026/falsification_review.md
