    ledger/decisions/DEC-20260731-014.yaml held that adjudication at digest
    6093f111f4b1f7eef4c5da8e067a9f8e8cb14984c1885cbdff88414ba1a0a81b as of commit
    4692de41f; commit 98fa35db1 wrote a different record at the same path for
    GOAL-ECDLP-001 BATCH-021; and merge 3b342d3c5 (2026-08-03) kept the
    GOAL-ECDLP-001 version, so the GOAL-DREG-001 BATCH-005 decision exists at NO
    path on origin/main. Separately, merge b1dfd9865 remapped this campaign's
    task identifiers (TASK-20260731-011 -> 016, 012 -> 025, review/ledger -> 026
    / 027), writing the artifacts to new paths with the embedded identifiers
    edited while the reissued receipts kept declaring the original digests. The
    MEASUREMENT ITSELF IS NOT IN DOUBT: all nine declared digests verify exactly
    against the pre-remap TASK-20260731-011 paths at the producer snapshot
