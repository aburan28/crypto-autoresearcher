    - >-
      CITE DEC-20260810-d62bc4, NEVER ledger/decisions/DEC-20260731-014.yaml, for
      the GOAL-DREG-001 BATCH-005 adjudication. That path holds another campaign's
      record and must not be edited, renamed, or reverted.
    - >-
      BEFORE THE ARCHIVE: fetch origin/main, MERGE it into this branch (never
      rebase - pushed evidence), run tools/validate_ledger.py and compare against
      the pre-write baseline, then stage ONLY the declared paths
      (ledger/corrections/CORR-20260810-d018d2.yaml,
      ledger/decisions/DEC-20260810-d62bc4.yaml,
      ledger/handoffs/TASK-20260810-13ff25.yaml,
      ledger/goals/GOAL-DREG-001.yaml), commit, push, and open or refresh a PR
