      NO HYPOTHESIS STATUS MOVES. H-DREG-001 is neither supported nor rejected by
      this decision, at ladder scope or any other. The single admitted cell does
      not discriminate the ladder question, and the shared-ledger status of
      H-DREG-001 is untouched.
    - >-
      SINGLE CELL, claim_tier toy, strength preliminary, ONE SEED. n=12, t=3,
      ti=0, seed=2026, D=6. No replication at this cell and no second cell exists.
      deficit_genuine is a structural rank quantity and is not d_reg.
    - >-
      THE INDEPENDENT REVIEW IS A QUALIFIED ONE. RT-20260731-013 ran under
      authorized fallback (requested review-xhigh, resolved
      cursor-grok-4.5-high-fast, AMEND-PATH-001-001,
      equivalence_to_requested_policy_claimed false). It did NOT re-execute the
      rank: its own FULL-RERANK check is NOT_PERFORMED and OBJ-013-4 records that
      an instrument bug saturating at sr_pred is NOT FALSIFIED, with a
      re-rank or single-column-deletion mutation named as the cheapest remaining
      discrimination. That residual is open.
    - >-
      RESIDUAL CONFOUND CARRIED FORWARD: the sibling-worktree null adjacency
      pickle was reused from outside the producer snapshot commit. RT-20260731-013
      OBJ-013-2 discharged it for confound reopening via hash and column-subset
      identity, but the pickle bytes are not inside the snapshot, so independence
      of rebuild-and-match is weakened rather than clean.
    - >-
      THE ARCHIVE CHAIN IS NOT REPAIRED BY THIS RECORD (D-7). Its content binding
      fails on origin/main and its receipts carry null commit and parent shas.
      TASK-20260810-13ff25 is recorded, not executed.
    - >-
      THIS SESSION HAS NO SHELL AND DISPATCHED NO REVIEW. No command was run, no
      hash computed, no commit made, and tools/validate_ledger.py was not run by
      this session. Every git fact is attributed to the dispatching session via
