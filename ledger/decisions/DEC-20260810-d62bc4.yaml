  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOTHING PROMOTED, and the mandatory-promotion rule is not triggered: it
      binds on `support` or `reject_scoped` over `replicated`/`strong` evidence,
      and this decision is `supersede` over evidence of strength `preliminary` at
      claim_tier `toy`. Concretely: EV-DREG-008 is a SINGLE UNREPLICATED CELL
      (n=12, t=3, ti=0, seed=2026, D=6, one seed) whose independent review
      explicitly did not re-execute the rank (RT-20260731-013 FULL-RERANK
      NOT_PERFORMED, OBJ-013-4 not falsified). A KN-FIND entry asserts a durable
      internal finding; a one-cell structural rank number that no second run and
      no second engine has reproduced is below that bar, and promoting it would
      put an unreplicated toy quantity into the corpus where later readers would
      meet it stripped of the quarantine and fallback qualifications that make it
      honest. REVISIT CONDITION: promote if and when the ladder expansion in
      next_actions produces replicated cross-n measurements, or if an independent
      re-rank raises this cell to `replicated`. Nothing is routed to KN-OPEN
      either: the open question here is already the goal's own completion
      criterion and is fully carried by GOAL-DREG-001 and RQ-DREG-001.
      knowledge/INDEX.md is generated and gitignored; no corpus entry is added or
      changed by this decision, so no rebuild is required by it and none was run -
      this session has no execute capability.

  inference_record: >-
    requested_policy coordinator-orchestration-code; resolved_model_id
