      n=12 is not that. No completion_quorum block is created, NO ATTESTATION IS
      RECORDED OR OBTAINED, and none may be synthesised from this decision later.
    - >-
      PROMOTION GATES G1-G4: NOT ENGAGED. This campaign advances no
      asymptotic-complexity claim in this record, so no gate is addressed and
      none is claimed as progress.
    - >-
      BUDGET: campaign maximum_batches is 6 and BATCH-005 is the fifth batch, so
      the budget is NOT exhausted. This record spends none of it - it opens no
      batch and authorizes no run.
    - >-
      THIS ADJUDICATION IS MADE ON origin/main's STATE ONLY. It reconciles the
      committed, published record and nothing else. Any statement here that a
      record or checkpoint is missing means ABSENT FROM origin/main, never "never
      written".
    - >-
      UNMERGED OFF-MAIN GOAL-HEAD WORK EXISTS and is not superseded by this
      decision. Per CORR-20260810-d018d2 off_main_work_not_lost, the local-only
      branch coordinator/goal-dreg-001-b3c2-b4 (head f459d902f, 2026-07-29, NO
      remote counterpart and NO open PR) already carries current_batch_id
      BATCH-005 and checkpoints BATCH-003-C2 / BATCH-004 / BATCH-005-FU1, and
      commit 32bbb2ada (2026-08-09) is reachable only from the mirror ref
      refs/mirror/EXP-DREG-001-CTRL-B-d9e70ed1. This reconciliation reached
      current_batch_id BATCH-005 independently and AGREES with that branch -
      corroboration, not coordination. If either is ever merged, the goal record
      will carry TWO SETS OF CHECKPOINTS FOR THE SAME BATCHES UNDER DIFFERENT
      IDENTIFIERS, and the records EV-DREG-3335b2, DEC-20260808-be2419,
      CORR-20260808-47d256 and DEC-GOAL-DREG-001-B005a will arrive with it. THE
      MERGE MUST BE RECONCILED BY SUPERSESSION, NEVER BY DELETING EITHER SET.
    - >-
      THE BATCH-005 LEDGER ARCHIVE MADE NO GOAL-HEAD TRANSITION. Its receipt
      listed GOAL-DREG-001 in record_ids and declared
      ledger/goals/GOAL-DREG-001.yaml at digest b5bebf73..., but that digest is
      the version committed at 24068f305 on 2026-07-27, four days BEFORE the
      CTRL-B run, and the file is byte-identical from there through origin/main.
      The archive bound bytes that were already stale. That is why this decision
      has to reconcile the head at all, and it is a reminder that naming a record
      in an archive receipt is not the same as transitioning it.
    - >-
      A STALE QUEUE STATE IS LIVE AND UNFIXED. TASK-20260727-N21-LEDGER-C1
      executed at 24068f305 on main, yet its BATCH-003 dispatch-queue entry still
      reads state queued, so a rendered plan would present a completed archive as
      ready work. No queue file is edited by this decision; it is carried as a
      verification sub-item on TASK-20260810-13ff25.

  next_actions:
