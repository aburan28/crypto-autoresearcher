coordinator_decision:
  id: DEC-20260825-5fa260
  title: Compile only the reviewed partial symmetric frontier and revise the broken producer view
  goal_id: GOAL-SYMF-c00fa1
  question_id: RQ-SYMF-5ab172
  batch_id: BATCH-303ce8
  decision: revise
  target_ids:
    - GOAL-SYMF-c00fa1
    - RQ-SYMF-5ab172
    - EV-SYMF-d46055
    - TASK-20260825-51dfe7
    - TASK-20260825-3da758
    - TASK-20260825-7d3441
    - TASK-20260825-ced8f2
    - TASK-20260825-30a080
    - TASK-20260825-bb6d5d
    - TASK-20260825-9eda3a
  context: >-
    Three producer shards and two immutable pre-review corrections were bound at
    snapshot commit 5fc23783d. The precommitted review plan assigned J1 to an
    independent Validator and J2/J3 plus blind SHA-1 re-derivation to an
    independent Red Team. Every joint returned breaks. The Coordinator therefore
    composes a conservative partial ledger rather than promoting the frozen
    67-row view or discarding the source-checked rows that held.
  rationale:
    - >-
      Revise is required because the reviewed artifact claim failed: the literal
      key permits cross-target dominance, several source fields are wrong or
      incomplete, and omitted incomparable rows prevent an as-of completeness
      claim.
    - >-
      Rejecting the entire acquisition would understate the evidence. All 67 rows
      satisfy the frozen field/null/provenance gate; 21 producer-frontier rows
      survived their applicable source checks and target-qualified dominance
      gate; nine additional rows survived source checks but keep frontier false.
    - >-
      Version 2 makes primitive, variant, and class part of the normative
      dominance domain. It does not mark the artificial larger-digest SHA-3 rows
      dominated by smaller-digest targets.
    - >-
      The coverage successor assigns all 399 required cells a terminal accounting
      state while preserving partial, routed, not-applicable, and bounded-search
      gaps. It makes no no-attack inference.
  review_composition:
    coordinator_prior: >-
      Expected transcription/completeness gaps, no practical full-round single-
      key AES recovery, a multi-row SHA-1 frontier, and reduced-round-only
      RIPEMD-160 ePrint 2026/1744.
    prior_outcome: upheld_and_made_concrete
    joints:
      J1_schema_and_comparison_key_separation:
        owner: TASK-20260825-bb6d5d
        verdict: breaks
      J2_primary_source_transcription:
        owner: TASK-20260825-9eda3a
        verdict: breaks
      J3_coverage_and_frontier_overclaim:
        owner: TASK-20260825-9eda3a
        verdict: breaks
    controls:
      flattened_SHA1_2^61: correctly_rejected
      RIPEMD160_42_of_80_as_full_break: correctly_rejected
      related_key_reduced_AES_as_full_single_key: correctly_rejected
    blindness: >-
      Sibling reports were mutually unread. The Red Team sealed SHA-1 re-
      derivation SHA-256 49a9c7c34c385fa0d1716c438f8674fc0a215c7d844e5304bef9efc155497fee
      before opening the legacy producer shard.
  evidence_refs:
    - ledger/evidence/EV-SYMF-d46055.yaml
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/archives/TASK-20260825-568663/snapshot-receipt.json
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/reviews/TASK-20260825-bb6d5d/validation-report.yaml
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/reviews/TASK-20260825-9eda3a/red-team-report.yaml
    - knowledge/frontiers/symmetric-cryptanalysis.yaml
    - knowledge/frontiers/symmetric-source-index.yaml
    - knowledge/frontiers/symmetric-frontier-schema.yaml
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/coverage-manifest.yaml
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This batch compiled reviewed frontier artifacts but minted no KN-* knowledge
      record. Promoting a path as though it were a knowledge identifier would
      violate the ledger schema. In particular, the frozen 67-row producer view,
      every disputed or individually unreviewed row, and any claim of literature
      completeness or attack reproduction remain unwarranted.
  compiled_artifacts:
    - path: knowledge/frontiers/symmetric-frontier-schema.yaml
      scope: Target-qualified version-2 comparison and dominance rules.
    - path: knowledge/frontiers/symmetric-cryptanalysis.yaml
      scope: 21 reviewed partial-frontier rows, nine source-checked frontier-unresolved baselines, and explicit pending/snapshot-only dispositions.
    - path: knowledge/frontiers/symmetric-source-index.yaml
      scope: Primary sources actually used by the canonical rows or their named corrections/additions.
    - path: coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/coverage-manifest.yaml
      scope: Terminal accounting for all 399 tier-1 family cells without completeness inference.
  exact_claim_boundaries:
    - The canonical ledger is partial and date-stamped, not exhaustive.
    - Canonical is_frontier=true means nondominated only inside the reviewed admitted corpus and exact target-qualified domain.
    - SHA-1 2^61.2 labels only theoretical identical-prefix collision work; no single SHA-1 scalar is authorized.
    - RIPEMD-160 2026/1744 remains 42/80 steps and does not break the full hash.
    - No practical full-round single-key AES key recovery is claimed or located by the bounded search.
  next_actions:
    - >-
      Create one immutable reviewed successor overlay that corrects the seven
      disputed producer rows, adds the omitted full-round SHA-1 long-message
      second-preimage and 12/13-round two-related-key AES-256 cells plus the
      four-round AES partial-key result kind, populates the retrieved SHA-2 cost
      vectors, and reruns version-2 target-qualified dominance before expanding
      the primitive backlog.
  limitations:
    - The successor has not been executed or reviewed in this batch.
    - Most coverage cells remain primary_source_partial or bounded-search gaps.
    - No attack implementation or certificate was independently reproduced.
  decided_by: coordinator
  decided_at: '2026-08-25'
