  decided_at: '2026-08-22'
  decided_by: coordinator

  id_provenance: >-
    THE ID WAS PRE-ALLOCATED, NOT MINTED HERE. The BATCH-006 queue entry for
    TASK-20260812-4177ac records `decision_id_note` -- "DEC-20260812-f56a44 and
    EV-DREG-ea5086 pre-allocated via python3 tools/allocate_id.py --next
    coordinator_decision/evidence --date 20260812 and verified free with
    --check". THE COORDINATOR SUBAGENT THAT WROTE THIS BODY HAS NO SHELL. It
    minted no identifier, ran no git command, no allocator, no validator, no
    renderer and no probe, and computed no digest. Every command output cited
    below is attributed at the point of use to the agent that ran it -- the
    validator (in its report) or the driving session -- and none is claimed as
    this subagent's.

  authority: >-
    ledger/handoffs/TASK-20260812-4177ac.yaml as committed, together with the
    `TASK-20260812-4177ac` entry in
    coordination/goals/GOAL-DREG-001/batches/BATCH-006/dispatch_queue.json.
    The two diverge on two of three declared artifact paths; that divergence is
    RAISED AS A DEFECT at PD-C2 below and is not silently resolved in either
    direction. The governing downstream condition is DC-7 of
    ledger/decisions/DEC-20260822-badc59.yaml, read here verbatim from the
    committed file and not from any paraphrase.

  what_this_record_is_and_why_it_carries_this_id:
    the_tension_stated_before_it_is_resolved: >-
      TASK-20260812-4177ac's committed title is "Ledger-archive the BATCH-006
      final-batch ranking decision DEC-20260812-f56a44" and its artifact_paths
      name ledger/decisions/DEC-20260812-f56a44.yaml. Its own committed
      constraint SC-6 says that on a REVISE or REJECT the task must "NOT file
      the decision as-is" and must instead "record the block and a scoped repair
      next_action instead of the lane dispatch". DC-7 of DEC-20260822-badc59
      restates the same rule and adds that "DEC-20260812-f56a44 MUST NOT BE
      FILED AS REVIEWED unless and until a verdict exists that supports filing
      it". THE VERDICT IS REVISE. So the id is reserved for a record the verdict
      forbids filing in the form the title anticipates.
    resolution: >-
      THIS RECORD IS FILED UNDER THAT ID AS THE BLOCK-AND-REPAIR RECORD, WITH
      `decision: revise`, AND IT IS NOT THE RANKING'S APPROVAL. The reasoning is
      in three steps and each is checkable. (1) SC-6 and DC-7 forbid one CONTENT
      -- filing the ranking as reviewed and approved -- and they positively
      REQUIRE another content, the block plus a scoped repair next_action.
      Neither clause forbids the id; both assume this task produces a committed
      Coordinator record, because a block that is not committed is not a block.
      (2) The only ledger decision path in this task's committed write_scope IS
      ledger/decisions/DEC-20260812-f56a44.yaml. Filing the block anywhere else
      would require an id this subagent cannot mint and a path outside the
      declared write_scope, which CORR-20260822-6ce623 correction_1 (ERROR 2)
      establishes is exactly the move an agent must not make -- a prompt or a
      circumstance can neither enlarge nor narrow a committed write_scope.
      (3) The id was allocated for "the Coordinator decision that disposes of the
      BATCH-006 final-batch ranking". A block-and-repair IS a disposition of that
      ranking. What the verdict changes is the disposition's direction, not which
      question the record answers.
    what_this_record_therefore_is_NOT: >-
      NOT an approval of the ranking, NOT a filing of the ranking as reviewed,
      NOT an authorization of item B, NOT an experiment approval, and NOT an
      evidence-quality upgrade. `execution_authorized` is false and the ranked
      winner remains unauthorized to run, exactly as it was before this act.
    if_a_later_reader_disagrees_with_this_placement: >-
      The remedy is a superseding record under a freshly minted id, never an
      edit of this one. This record is immutable from the moment it is committed
      (AGENTS.md rule 4, CLAUDE.md rule 2).

  context: >-
    BATCH-006 of GOAL-DREG-001 froze a final-batch ranking and a one-winner lane
    contract (TASK-20260812-f6df51, snapshotted by TASK-20260812-23e086 at commit
    1aa90d9c08d0b0ddb78f84283a6099942dffa85a, receipt content_verified) and
    commissioned exactly one independent Validator verdict on them
    (TASK-20260812-963ec3). That review-tier task was carried BLOCKED from
    2026-08-15 until DEC-20260822-badc59 ruling (b) found the block rested on a
    mistaken premise and authorized the dispatch under conditions DC-1..DC-8. The
    review has now returned as
    coordination/goals/GOAL-DREG-001/batches/BATCH-006/reviews/TASK-20260812-963ec3/review-report.yaml
    (report id VAL-20260822-001, recorded 2026-08-22). ITS TERMINAL VERDICT IS
    REVISE, its role-contract verdict is `failed` (not admissible as it stands),
    and `execution_authorized` is false. This record is the Coordinator act that
    DC-7 and SC-6 route that verdict into.

  decision: revise

  decision_scope: >-
    BLOCKS ONE DISPATCH AND COMMISSIONS ONE SCOPED REPAIR. It (1) accepts the
    Validator report as an admissible single review after the validity check
    recorded below; (2) BLOCKS the dispatch of ranked winner item B under
    coordination/goals/GOAL-DREG-001/batches/BATCH-006/tasks/TASK-20260812-f6df51/lane-contract.yaml
    as frozen; (3) declines to file the ranking as reviewed, per SC-6 and DC-7;
    (4) records the scoped repair below as the goal's next action, to be carried
    by a NEWLY MINTED task, never by editing either frozen artifact; and (5)
    supersedes BY REFERENCE, and in one word only, the phrase "the cheaper
    discriminating mutation" in DEC-20260810-da7513 NA-4 (see CF-2). It changes
    no hypothesis status, closes no batch, closes no goal, approves no
    experiment, authorizes no run, files no evidence and promotes no knowledge
    entry.

  verdict_binding:
    review_report_path: >-
      coordination/goals/GOAL-DREG-001/batches/BATCH-006/reviews/TASK-20260812-963ec3/review-report.yaml
    report_id: VAL-20260822-001
    task_id: TASK-20260812-963ec3
    terminal_verdict: REVISE
    role_contract_verdict: failed
    execution_authorized_in_the_report: false
    two_scales_kept_apart: >-
      The report states its own calibration and this Coordinator adopts it
      without flattening it. `review_report.verdict` REVISE is the committed
      card's PASS/REVISE/REJECT scale and is the terminal verdict the completion
      gate asked for. `validation_report.verdict` `failed` is agents/validator.md's
      scale and answers whether the artifact package is ADMISSIBLE AS IT STANDS.
      IT IS NOT REJECT, IT IS NOT `incomplete` (every assigned joint was
      completed) AND IT IS NOT `invalid` (both artifacts are well-formed and
      byte-verified). Nothing in this record may be cited as a REJECT.
    one_review_is_one_review: >-
      DC-8 IS HONOURED WITHOUT QUALIFICATION. This is a single validator opinion
      from a single session. It is not independent corroboration, not an
      attestation, not a quorum member, and no part of this record presents it as
      more than one reviewer's coverage and one reviewer's taste. No attestation
      was obtained by this Coordinator and none is recorded.

  review_validity_check:
    why_this_block_exists: >-
      The Coordinator must verify validity before interpreting a returned result
      (agents/coordinator.md responsibility 6). The object here is a review
      report rather than a run set, so the applicable checks are deliverable
      completeness, scope compliance, inference honesty, and self-consistency --
      not run count or seed integrity, which have no referent.
    deliverable_completeness: >-
      SATISFIED. The single declared deliverable exists at the single declared
      path. It addresses every item by ID (A, B, C), adjudicates Pareto honesty,
      reproduces the C2 terminal-state claim, and returns a terminal verdict on
      the lane contract -- which is the committed completion gate in full.
    scope_compliance: >-
      SATISFIED ON WRITE SCOPE. The report records one file written, inside the
      committed write_scope, and records that ranking.yaml and lane-contract.yaml
      were not modified (SC-4). The READ-scope divergence is a defect of the
      dispatch, not of the reviewer, and is carried at PD-V2 below.
    inference_honesty_under_DC_5: >-
      SATISFIED. The report declares requested_policy review-adversarial,
      reasoning_effort xhigh, effort_source the agent-file binding re-derived by
      the reviewer itself, fallback_used false, degraded_requirements empty,
      independent_session true, the originating agent named, and resolved_model_id
      claude-opus-5 with `model_verified` MARKED EXPLICITLY AS A SELF-REPORT AND
      NOT A PROBE RESULT. It records that Bedrock was not selected, configured,
      probed or contacted. That is exactly what DC-5 requires.
    self_consistency: >-
      SATISFIED. The report's findings, joints, per-item adjudications, control
      checks and repairs cross-reference each other by ID without contradiction,
      it separates confirmed positives from defects, and it records one variance
      (the snapshot receipt's own digest at the snapshot commit) as EXPLAINED and
      explicitly not a finding against the reviewed artifacts -- which is the
      expected consequence of the DC-1 self-referential re-hash route.
    what_this_check_does_not_certify: >-
      IT DOES NOT CERTIFY THE REPORT'S ARITHMETIC. This Coordinator has no shell
      and cannot re-run a hash, a git command or a recomputation, and several of
      the report's load-bearing quantities sit in BATCH-005 artifacts that are
      OUTSIDE THIS TASK'S COMMITTED READ_SCOPE. What was independently
      re-established here, from records inside read_scope, is recorded at CF-1,
      CF-2 and CF-3; everything else is accepted as the reviewer's measurement,
      attributed to it, and listed at `limitations`.
    conclusion: >-
      THE REPORT IS ADMISSIBLE AS ONE INDEPENDENT REVIEW. It is not returned to
      the reviewer and no defect in it is asserted.

  contamination_ruling:
    what_happened: >-
      PD-V1 and PD-V2, both self-reported by the reviewer at severity HIGH and
      both caused by the driving session. The dispatch prompt for
      TASK-20260812-963ec3 listed ledger/decisions/DEC-20260822-badc59.yaml and
      the review-plan artifact under "Read first", although DC-3 of that very
      decision forbids adding either to the task's read_scope and neither appears
      in the committed read_scope. The reviewer complied with the prompt, read the
      plan in one pass, and was thereby exposed to `review_plan.coordinator_prior`
      and its `expected_findings`.
    severity_adopted: >-
      HIGH, EXACTLY AS THE REVIEWER ASSIGNED IT, AND NOT DISCOUNTED. It is not
      discounted for having been self-reported -- self-report is the conduct this
      program wants and is not a mitigation of the error (CORR-20260822-6ce623
      `raised_by`). It is not discounted for having been caused by the driving
      session rather than by the reviewer; a control-plane error that spends a
      round's independence costs the same whoever made it.
    what_the_contamination_COSTS: >-
      IT COSTS THE INDEPENDENCE OF CONVERGENCE ON FOUR ITEMS, WHICH IS THE WHOLE
      POINT OF A PRE-RECORDED PRIOR (AGENTS.md "Review architecture", first
      obligation). For F-10 (unfilled Pareto fields on the winner's row), F-13
      (the independence clause), F-16 (the producer's unprobed inference block),
      and the survivals of items A and C, the reviewer's agreement with this
      Coordinator's expectation IS NOT EVIDENCE that an independent reviewer
      converged -- the expectation was in front of it. THOSE FOUR ARE DISCOUNTED
      AS CONVERGENCE and are cited nowhere in this record as independently
      confirmed. Where such a defect is nonetheless repaired below, the repair
      rests on the frozen artifact's OWN TEXT read by this Coordinator in this
      act, not on the reviewer's agreement -- see CF-4 for F-13.
    what_the_contamination_DOES_NOT_COST: >-
      IT DOES NOT COST CHECKABILITY, AND IT DOES NOT REACH THE BLOCKING CORE.
      Two distinct reasons. FIRST, the reviewer's `prior_overlap_disclosure`
      places F-1, F-2, F-3 and F-4 -- the entire blocking core -- and F-5, F-7,
      F-8, F-9, F-11, F-12, F-14, F-15 on the independently-derived list, and
      records that the core was derived from red_team_report.yaml,
      DEC-20260810-da7513 NA-4 and the 15-line committed chunk-coverage trail. A
      disclosure that names precisely which findings are affected is what lets a
      later reader discount precisely instead of discounting everything, and it
      is the reason this round is salvageable at all. SECOND, and independently of
      whom to believe about provenance, F-1, F-2 and F-5 rest on quantities and
      texts that a later reader can check from committed paths, and CF-1..CF-3
      below re-establish their load-bearing premises from records inside THIS
      task's read_scope without relying on the report. A contaminated reviewer can
      still hand you a checkable derivation; what it can no longer hand you is the
      fact of independent agreement.
    the_prior_was_partly_OVERTURNED_and_that_is_recorded_because_it_is_the_valuable_case: >-
      The reviewer records that the C2 reproduction was expected to be
      UNAVAILABLE and instead SUCCEEDED COMPLETELY, and that the terminal verdict
      rests on blocking findings no expectation it saw anticipated. A prior a
      review overturns is among the most informative results this program can
      produce and only counts if it was written down; it was written down, before
      the reviewer ran, and it was overturned in part. THIS COORDINATOR DID NOT
      READ THE REVIEW PLAN IN THIS ACT -- it is not in this task's read_scope and
      nothing here needs it; the overturn is taken from the report's own
      disclosure.
    net_ruling: >-
      THE ROUND IS ADMISSIBLE, THE BLOCK STANDS ON THE UNCONTAMINATED CORE, AND
      THE FOUR CONVERGENT ITEMS CARRY NO CONFIRMATORY WEIGHT. The correct
      accounting is not "discard the review" and not "treat it as clean"; it is
      to spend the discount exactly where the disclosure locates it.

  rationale:
    - >-
      CF-1. THE OBJECTION ITEM B CLAIMS TO ADDRESS IS ABOUT A SECOND ENGINE AND A
      CEILING, AND I VERIFIED THAT FROM MY OWN READ_SCOPE. ranking.yaml lines
      56-61 credit item B as "Cheapest remaining discrimination on rank honesty;
      addresses OBJ-013-4". ledger/decisions/DEC-20260810-da7513.yaml, which IS in
      this task's read_scope, carries OBJ-013-4 forward in its own words -- "rank
      not independently re-executed ... a second engine could still in principle
      expose an instrument artifact that saturates at sr_pred. NO FULL INDEPENDENT
      RE-RANK HAS BEEN PERFORMED BY ANYONE." The objection is therefore about
      whether a SECOND ENGINE reproduces the rank at the ceiling. This premise of
      the reviewer's F-1 is re-established here from a committed record, not taken
      on the report's word.
    - >-
      CF-2. NA-4 NAMES TWO FORMS, THE RANKING PICKS THE CHEAP ONE, AND THE WORD
      THAT LICENSED THE SWAP IS MINE, NOT THE PRODUCER'S. DEC-20260810-da7513 NA-4
      reads, verbatim and inside my read_scope -- "Two forms are named by the red
      team - re-rank the restricted adjacency end to end, or run the cheaper
      discriminating mutation -- load the restricted adjacency, delete one column
      from an early unit with k=width (e.g. column 0), re-run a short prefix rank,
      and REQUIRE rank_acc to drop by exactly 1 against the [committed trail]."
      Only the FIRST form puts a second engine against the ceiling that CF-1 shows
      OBJ-013-4 is about. THE CONFLATION BEGINS IN MY OWN PRIOR DECISION, in NA-4's
      phrase "the cheaper DISCRIMINATING mutation", and the ranking inherited it in
      good faith. That word is SUPERSEDED BY REFERENCE HERE, and only that word --
      the mutation discriminates PIVOT ACCOUNTING; it does not discriminate the
      sr_pred-saturation concern OBJ-013-4 states. DEC-20260810-da7513 is committed
      and immutable and is NOT EDITED; every other part of NA-4, including its
      status AVAILABLE_AND_UNEXECUTED and its cost figures quoted from the red-team
      report, stands unchanged.
    - >-
      CF-3. THE TWO FROZEN ARTIFACTS CONTRADICT EACH OTHER ON THE WINNER'S BINDING
      PREDICATE, AND I READ BOTH. lane-contract.yaml lines 13-18 say "pick an early
      unit whose width k equals THE MATRIX WIDTH (k=width, e.g. column 0 of the
      earliest unit)"; ranking.yaml line 129 says "delete one column from an early
      unit with k=width"; DEC-20260810-da7513 NA-4 says the same as ranking.yaml.
      Read literally, the lane contract's predicate asks for a unit as wide as the
      whole matrix, which the chunked trail cannot supply, so the operative
      artifact an executor would work from states a condition that cannot bind and
      routes straight to its own `no-bindable-unit` obstruction. The reviewer's F-5
      is confirmed on my own reading of both artifacts, and a discrepancy between
      two frozen artifacts on the definition of the thing being measured is a
      defect whichever side is right.
    - >-
      CF-4. THE LANE CONTRACT CONTAINS A SENTENCE THAT WOULD LICENSE AN UNREVIEWED
      RUN, AND THAT IS ESTABLISHED BY ITS OWN TEXT. lane-contract.yaml
      `independence_note` closes -- "The lane's executor run proceeds; its review
      does not fabricate" -- in the same breath as conceding that the required
      xhigh review "blocks until a distinct xhigh-servable backend resolves". The
      goal record says twice that item B has NOT been authorized to run, and the
      batch control plane says the same. THIS FINDING COINCIDES WITH A PRE-RECORDED
      EXPECTATION (F-13) AND THEREFORE CARRIES NO CONVERGENCE WEIGHT; it is
      recorded here on the sentence itself, which this Coordinator read in this act
      at the declared path, and the repair is warranted on that basis alone. Its
      factual premise about backend availability was true of the 2026-08-15 session
      and has since been superseded (DEC-20260822-badc59); that supersession does
      not repair the operative clause, which would have had the same effect
      whatever the premise.
    - >-
      CF-5. THE BLOCKING CORE IS ACCEPTED, AND IT SURVIVES MAXIMAL DISCOUNTING.
      F-1 (the winner cannot reach the objection it is credited with), F-2 (in the
      regime the binding predicate selects, the trivial oracle I(M) := ncols(M),
      which does no linear algebra and IS the pivot-accounting artifact under
      suspicion, passes the contract and is recorded CONFIRMED -- while extending
      out of that regime makes the honest answer a drop of 0, which the contract's
      own falsification limbs record as FALSIFYING), F-3 (the prefix length is
      unspecified, so the free parameter that decides which horn applies is chosen
      after the fact) and F-4 (no null-object arm at all -- a single integer and a
      verdict). All four are on the independently-derived list. THE DECISIVE POINT
      FOR THIS RULING IS THAT THE BLOCK DOES NOT DEPEND ON RESOLVING F-2's
      ARITHMETIC. Even if the identity rank_acc = j1 over units 1-13 were mis-stated
      -- and this Coordinator cannot check it, the trail being outside read_scope --
      F-3 blocks independently and is checkable by reading the contract alone: the
      contract nowhere fixes the unit index, the stopping column, the trail row
      compared against, or the deleted column index, so its "required prediction"
      has no determinate truth value before the executor picks them. A prediction
      whose truth value is set after the trail is seen is not a pre-registration in
      the sense that makes pre-registration worth anything, and CF-3 shows the one
      parameter it does state is stated two incompatible ways.
    - >-
      CF-6. THE CONTRACT'S FALSIFIERS POINT THE WRONG WAY, WHICH IS WORSE THAN
      LEAVING THEM OUT. lane-contract.yaml limbs (ii) and the trailing "or no drop"
      would record a correct instrument as falsified whenever the deleted column is
      dependent, or whenever the pass runs past the deficient boundary. Limb (i),
      routing an unbindable unit to an OBSTRUCTION rather than to a null on d_reg,
      is correct and is credited; so is the routing of stall, crash and enospc to
      failed_infrastructure with "never evidence" stated explicitly. THE DEFECT IS
      IN THE SCIENTIFIC FALSIFIER, NOT THE INFRASTRUCTURE ONES, and a mis-aimed
      falsifier is the mechanism by which an infrastructure or analyst-choice
      outcome gets written into the record as a result about the instrument.
    - >-
      CF-7. THE COST SIDE IS ASSERTED RATHER THAN DERIVED. F-7 (declared memory_gb
      2 against a measured peak RSS of 6.669 GiB for the same cell and instrument,
      a 3.3x overrun neither derived nor flagged), F-8 (executability asserted; the
      adjacency input named nowhere in the contract, absent from git, and reachable
      in the source run only by an absolute path in another worktree on an unmounted
      volume, with no regeneration step, no budget for one and no `input_unavailable`
      failure mode) and F-9 (the D6 un-chunked-instrument forbid, which is the very
      fact used to rank item C last, is not carried into the contract, which names
      no instrument and no mode). THE MEASUREMENTS BEHIND F-7 AND F-8 ARE THE
      REVIEWER'S AND ARE OUTSIDE THIS TASK'S READ_SCOPE; they are accepted as its
      measurement and attributed to it, not re-asserted as this Coordinator's. What
      is checkable from the contract alone, and is confirmed here, is the ABSENCE --
      the contract carries a memory figure with no derivation, names no input path,
      no regeneration procedure, no instrument, no mode and no forbid. F-8's
      observation that /Volumes/Volume is not mounted on the reviewing host today is
      an INFRASTRUCTURE OBSERVATION about that host and is NEVER evidence that the
      producer was wrong on 2026-08-15 and never a result about d_reg (AGENTS.md
      rule 5, CLAUDE.md rule 3); the finding is the contract's silence.
    - >-
      CF-8. PARETO HONESTY FAILS ON THE FRONTIER, AND SEPARATELY THE FRONTIER IS
      NOW STALE. F-10 and F-11 are DISCOUNTED AS CONVERGENCE in part (F-10 is on
      the overlap list) but the underlying facts are visible in the frozen bytes
      this Coordinator read -- zero of three rows carries a quantitative
      `sota_delta`, row B carries `dominated_by: null` AND `sota_delta: null`, and
      row A's `dominated_by: "A2"` names a sub-action of row A rather than a row of
      the frontier. The reviewer records, in the producer's favour, that it
      tabulated all three rows against all four axes and COULD NOT construct a row
      dominating B, so B's null is substantively right and the defect is that the
      licensing check is unrecorded. SEPARATELY, AND THIS IS THIS COORDINATOR'S OWN
      OBSERVATION RATHER THAN THE REVIEWER'S: row B's `evidence_value: high` was
      predicated on discriminating OBJ-013-4, and CF-1/CF-2 remove that predicate.
      Row C records `runnable_this_session -- n=15 >=3 seeds + null control` at
      `evidence_value: very_high`. ONCE ITEM B'S EVIDENCE VALUE IS RESTATED AS
      PIVOT-ACCOUNTING BOOKKEEPING ONLY, THE FRONTIER MAY HAVE A DIFFERENT WINNER,
      and the repair round must re-rank rather than repair the contract in place.
      That is a rerank trigger under agents/coordinator.md "Focus discipline", not
      an editorial note.
    - >-
      CF-9. ITEM A'S RECITAL REPRODUCED AND ITS BINDING STILL DOES NOT HOLD. The
      reviewer ran the exact command the card names and reports exit 0, with the C2
      terminal state matching PREREG-20260727-N21-C2 field by field -- done true,
      rank_acc 265950, pred 268674, next_col 778394, seed 2026, sem, 21/3/0/5,
      279048 x 778394, system_hash prefix agreeing -- plus a recomputed deficit_5 of
      2724 and an internal check the card did not ask for, the sum of npiv over 72
      carries equalling 265950. THE PREREG WAS COMMITTED AT 71.9% WITH done false,
      SO THIS IS A CONFIRMED PREDICTION AND NOT A POST-HOC OBSERVATION. THE
      SURVIVAL OF ITEM A's DISPOSITION IS ON THE CONVERGENCE LIST AND CARRIES NO
      CONFIRMATORY WEIGHT; THE REPRODUCTION ITSELF IS NOT -- it inverted the
      recorded expectation, which was that the never-pushed branch would be absent.
      Two limits stand nonetheless and are the substance of F-12. The branch tip is
      NOT an ancestor of origin/main and the path does not exist at HEAD, so the
      datum is still not committed evidence on the official line and the ranking's
      own disclosure to that effect is accurate; and the A2 disposition proposes to
      archive it "with the branch reference as its binding", which CLAUDE.md's
      concurrency doctrine forbids as a durable binding -- archive receipts bind to
      CONTENT first precisely so validity does not depend on ref reachability. The
      reviewer also records that PREREG-20260727-N21-C2 states its own durability
      condition, that the terminal datum is durable only after the snapshot task
      commits it AND AN INDEPENDENT VALIDATOR VERIFIES THE RECEIPT, and that the A2
      disposition drops that limb. A pre-registered condition is either honoured or
      knowingly waived with a recorded reason; it is not dropped.
    - >-
      CF-10. ITEM C's INFRA DISPOSITION IS THE PART OF THE RANKING THAT DOES THE
      HARD THING RIGHT, AND IT IS ON THE CONVERGENCE LIST. The reviewer checked it
      word for word against DEC-20260810-da7513 NA-5 and found the n=18 gap rung and
      the null first-fall stated as INFRA-LIMITED, never measured, with a named
      resume condition, and nowhere converted into a null, a screening or any
      statement about d_reg. That is the failure mode this class of disposition
      usually exhibits and it is absent. RECORDED AS SURVIVING, NOT AS
      INDEPENDENTLY CONFIRMED, because item C's survival is on the overlap list.
      Its Pareto row shares the frontier-wide defect at CF-8 and its standing is
      subject to the re-rank CF-8 requires.
    - >-
      CF-11. THIS IS NOT A NEGATIVE RESULT AND NOT A CLOSURE. No experiment ran, no
      run was executed, no measurement was made and no evidence record moved. The
      block is a defect in a CONTRACT, and a contract defect is not a fact about
      d_reg, about H-DREG-001, about rank honesty or about the instrument. OBJ-013-4
      REMAINS OPEN AND UNRESOLVED -- the reviewer says so explicitly and this record
      says so too; no full independent re-rank has been performed by anyone. A
      REVISE is not `reject_scoped` and this record makes no adverse transition of
      any kind, so no scoped rejection is being smuggled through a control-plane
      route.

  refutation_artifact:
    why_this_block_exists: >-
      agents/coordinator.md responsibility 12 requires the strongest checkable
      refutation artifact the result admits to be archived BEFORE a decision that
      relies on it. This decision is not adverse to any theory, so the gate is not
      strictly engaged; the block is filled anyway because the ruling DOES rely on
      a refutation, of the lane contract's discriminating power.
    basis: counterexample_certificate
    the_certificate: >-
      The null object I(M) := ncols(M) -- an oracle that performs no linear algebra
      whatsoever and is precisely the pivot-accounting artifact OBJ-013-4 posits --
