  context: >-
    /design-experiment, one contract, for IDEA-20261005-f1b0af. No
    hypothesis and no experiment on origin/main cites that idea. The
    branch design/frob-f1b0af-weight was created from origin/main at
    3575cc2705c200ffc0c0163c82548ab3335585ce and git merge origin/main
    reported already up to date.

    The field is F_343 = F_7[z] / (z^3 + 2). The object curve is
    y^2 = x^3 + 1 over F_7, with coordinate 3*z^2. The null curve is
    y^2 = x^3 + (z^2)*x + (2 + z + z^2) over F_343, with coordinate
    z^2. A design-session point-count census found both orders over
    F_343 equal to 324 and both traces equal to 20, with j-invariants
    0 and 1 + z. Both Frobenius orbits have size 3. The contract
    predicts that the object minimal-polynomial weight is strictly
    smaller. Equal or larger object weight is a negative. No degree-3
    coefficient vector was recorded while writing this decision. No
    exponent change is claimed.

    Protocol completeness: inputs, controls, independent variables, primary
    and secondary metrics, seeds, replication, budget, stopping rules,
    invalidation rules, success criterion, falsification criterion, and
    required artifacts are all non-null. Success is a weight gap of at
    least 1 and fails when the difference is 0 or negative.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - Both curves, both coordinates, the inequality, and the assignment of each observation to a reading are fixed before either degree-3 weight is recorded.
    - The minimality census, the degree test, the matched-order test, the j-tests, the instrument element 1, and the Frobenius self-check give the comparison a way to come back invalid.
    - Equal weights can occur, so success can fail.
    - No degree-3 coefficient vector was recorded while writing this decision.

  evidence_refs: []
  limitations:
