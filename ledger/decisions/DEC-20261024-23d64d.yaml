  rationale:
    - >-
      Collection first. I read every next_action and limitation of the ten
      round decisions that names the synthesis task or a wording fix, plus the
      evidence boundaries they cite (EV-CZLIFT-ad28f5 B-2 to B-7,
      EV-CZLIFT-f2a401 B-4/B-5, EV-CZLIFT-e9a7cf claim_tier_note), and listed
      them by target record. After deduplication (deduplication_note) they
      touch 11 records: the RQ, three observation decisions, two hypotheses,
      four experiment specifications and one frontier row.
    - >-
      Which deserve a correction. A fix gets a record when the target text is
      false or wider than committed evidence and a reader of that record
      could act on it: closure conditions (RQ decision_target), statements a
      later agent cites (observation decisions, hypothesis mechanisms,
      frontier row), and frozen texts whose rationale a designer may copy
      (ed8113 specification). Fixes to the same record are grouped
      (precedent CORR-20261023-4ffd7e); the RQ takes two records, one for its
      closure condition and one for the rest. Ten ids therefore cover 9 of the
      11 records; the two deferred specification fixes are the ones already
      fully disclosed in committed evidence and decision records and read by
      no tool.
    - >-
      Corrections, not supersession, for the RQ: the question, its branches
      and its goal link are unchanged; only clauses, scope descriptions, the
      H2 paraphrase and constraints were found wrong or incomplete. The
      user's H2 words are never altered; qualifiers sit beside them.
    - >-
      No status moves. Each hypothesis transition of the round rests on its
      own decision; the corrections restate text so that those transitions
      read correctly, and none changes a prediction or a frozen criterion. No
      criterion is changed after an outcome, so no protocol_amendment is
      needed.
    - >-
      The frontier-row correction is not treated as a rule-12 "contradiction
      of established evidence". It restores the row to its own source (the
      row cited only abstracts; the retrieved primary states a conditional
      asymptotic bound), and no ledger evidence is contradicted. A reviewer
      who reads it otherwise blocks the superseding row, not this record.
    - >-
      RQ closure is refused on the gate, not on argument: rule-12 review has
      not been commissioned, C1 has not run, and the E(K) scope is undecided.
      Refusing closure here is not premature closure's mirror image: the
      parts that are settled are recorded as findings already
      (KN-FIND-3c7e19, KN-FIND-7e2b94, KN-FIND-c71e5d), and the closure
      condition is now stated so that it can be met.
    - >-
      Next action. The exponent bias (docs/target-result-profile.md) favours
      the Fourier-mass exponent question, but a zero-run control that gates
      every random-rate reading, and that DEC-20261023-039ddf already
      specified, ranks ahead of designing new contracts on top of those
      readings. One action is kept on the goal; the rest are queued with
      their order.
    - >-
      Promotion gates (agents/coordinator.md) do not arise: no
      asymptotic-complexity claim moves. The counting bound's beyond-toy form
      is conditional on T1 to T4 and is stated as such everywhere it appears.
