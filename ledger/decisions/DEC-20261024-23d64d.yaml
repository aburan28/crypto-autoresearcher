  validity_basis: >-
    This synthesis re-opens no run. It relies on each round decision's own
    validity check: 2 of 2 planned trials, schema-complete manifests, seed
    integrity, raw/summary agreement and control comparability held for the
    eight admitted run sets, and failed for EXP-CZLIFT-7c8d73 and
    EXP-CZLIFT-8c50ea, which are inadmissible and are not evidence (their
    numbers remain observations of the code as written). No result of a
    returned run set is used below, and no missing result is estimated.

  h2_established_at_toy_tier:
    canonical_section:
      established: >-
        H2 clauses "Serre-Tate gives ... no canonical lift of points" and "a
        computable canonical section of E(Q_p) -> E(F_p) ... would be a full
        break". By DERIVATION uniform in p (p >= 5, prime n != p, any
        good-reduction Z_p-lift), not only at toy scope: the n-torsion section
        s_tor is the unique homomorphic section of reduction over <P>, costs
        at most 2(bits(n) + bits(p^k)) + 1 complete additions, the Smart
        (formal-logarithm) functional vanishes identically on it, and it
        carries the discrete-log relation isomorphically into E^(Q_p)[n],
        where it is no easier. So the "full break" clause is false under every
        reading in which "canonical" constrains the section and circular under
        the remaining one. The instruments agree with the derivation on 1116 of
        1116 pairs (p <= 600, n <= 613, k = 4) and on 576 of 576 pairs at
        10^4 <= p <= 10^5 (same-code). On the canonical j = 0 lift the
        Teichmuller section is Aut(E^)-equivariant, a structure already owned
        by rho with automorphism classes.
      rests_on: [DEC-20261023-36b4f0, EV-CZLIFT-ad28f5, KN-FIND-7e2b94, KN-TECH-73630e, DEC-20261023-9de83a, EV-CZLIFT-e9a7cf, CORR-20261023-c69e1c U3/U4/R2, CORR-20261024-bb36f5]
      not_established: >-
        Whether any coordinate or digit encoding of s_tor carries d. The only
        measurement (EXP-CZLIFT-1a3453) excludes, at preliminary strength, a
        single (additive character, character of Z/n) correlation above a
        per-record floor rho_min = 0.28..0.98 on 42 power-bearing records
        (53 <= p <= 571, 47 <= n <= 613); it cannot test digit 0, chirp,
        inverse or Legendre-bit leaks, and 30 of 72 records were blind. The
        exponent-relevant unknown is KN-OPEN-d3a6f0 (growth of the maximal
        Fourier mass with n against n^(-1/2) and the n^(-1/4) breakeven).
        "No choice of lift removes the noise" is not established (false for
        s_leak).
      not_established_rests_on: [DEC-20261023-2e7447, EV-CZLIFT-764f54, KN-OPEN-d3a6f0, KN-OPEN-3417fc, CORR-20261023-eeaec8]
    smart_and_the_canonical_lift:
      established: >-
        H2 clauses "Smart's anomalous attack is the one lifting attack that
        works" and "the residue in E^ depends on the chosen lift, so you get
        noise". On the 29 anomalous class-number-one CM curves with
        7 <= p <= 1373 (unramified lifts, precision p^8, three sections):
        Smart's precision-p^2 residue degenerates exactly on lifts with
        v_p(j(E^) - j_can) >= 2e (14,616 of 14,616 rows; 4608 of 4608 rows on
        41 curves at 10^4 <= p <= 10^5), i.e. on the canonical lift and every
        lift congruent to it to that order, and Smart recovers d on every row
        with v_p(j(E^) - j_can) < 2e. This is a Serre-Tate/Kummer theorem with
        prior art (Belding 2007, section 7); the runs calibrate it and are not
        a discovery. On degenerate lifts the next digit is consistent POOLED
        with the matching random-section null 1/(p+1) (z = +0.68, +0.02), not
        per cell. On non-anomalous curves the Smart ratio equals the
        tau-ratio for every section, no homomorphic section removes the
        noise, any section that removes it is a discrete-log oracle, and the
        three tested choice-free sections succeed at a rate consistent with
        1/p per arm and seed (detection floor 4.2x to 5.2x of 1/p).
      rests_on: [DEC-20261023-147f9f, EV-CZLIFT-712fe4, KN-FIND-3c7e19, CORR-20261023-1869c3, CORR-20261023-9f2176, DEC-20261023-9de83a, EV-CZLIFT-e9a7cf, DEC-20261023-36b4f0, EV-CZLIFT-ad28f5, CORR-20261023-c69e1c U1/U2/U4/R1/R4]
      not_established: >-
        The j = 0 threshold 2e = 6 (pinned only to (3, 6]); the 1/p rate at
        10^4 <= p <= 10^5 (zero successes, no power: upper bounds 8.7e-4 per
        anomalous row and 5.2e-3 per torsion-section row); partial leakage of
        d through the tau-ratio (exact-hit counting cannot see it; the
        numbered-heuristic successor of DEC-20261023-9de83a is not designed);
        an independent formal-series instrument for the degeneracy rule
        (EXP-CZLIFT-7c8d73 inadmissible, returned); and any "random rate"
        reading of an elliptic Smart-style statistic before the
        integral-multiple split (control C1 of DEC-20261023-039ddf). The
        clause "every non-canonical section recovers d at the random rate 1/p"
        is false as worded.
      not_established_rests_on: [DEC-20261023-147f9f limitations, DEC-20261023-9de83a, DEC-20261023-66af3b, DEC-20261023-039ddf, EV-CZLIFT-ad28f5 B-2/B-3, CORR-20261023-6e10a2 A3]
    global_lift_counting:
      established: >-
        H2 clause "lifting to E(Q) or E(K) fails ... points of height <= H
        number ~H^{r/2}". On the eight-curve minimal-conductor ladder (recalled
        ranks 0..7, naive height <= 3e5, p = 103..20011): the growth law
        N_E(H) ~ V_r (log H)^{r/2}/sqrt(Reg) holds (ratio 0.963 to 1.309,
        replicated; it is H^{r/2} only when H bounds the canonical,
        logarithmic height). "Reductions cover E(F_p) like uniform points" is
        contradicted as stated (post hoc calibrated nulls, both census lanes:
        1.0330 / 1.0333 and 1.0424 against uniform bands topping out at
        1.0041 and 1.0008 +- 0.0017), with a structured kernel-of-reduction
        height floor that works against relation finding. The obstruction is
        a fixed-rank COUNTING bound, not uniformity: reduction is a
        homomorphism, so half coverage of E(F_p) needs at least N_p/2
        distinct global points (Omega(p) against O(sqrt p) for rho), and any
        spread saves at most a factor 2 ln 2. On the 1977 record curves the
        counts in the named reduced minimal models are below the rank-7
        curve's, but that is model- and discriminant-dependent and rank-blind
        (weakened); it neither strengthens nor weakens the counting bound.
        The distinct-residue coverage instrument cannot fail upward
        (cap min(x,1)/(1 - e^-x)), shown independently on three experiments.
      rests_on: [DEC-20261023-26a6de, EV-CZLIFT-376eee, DEC-20261023-6931ab, EV-CZLIFT-b6fe48, DEC-20261023-fdc4af D7, CORR-20261023-6e10a2 A4, CORR-20261023-1cf8b3 S4/M2/M3, CORR-20261024-a7e0af, KN-TECH-5c41e7]
      not_established: >-
        Anything beyond toy scale except the conditional fixed-rank bound
        log H_half >= (sqrt(Reg) N_p/(2 V_r))^{2/r}(1 + o(1)) under transfer
        assumptions T1 to T4 (rank fixed independently of p; bounded c_E and
        height difference; image index <= 2; a fixed E/Q standing in for the
        attacker's p-dependent lift). Lifts whose rank grows like
        log p / log log p (the bound weakens once r >~ 34 at 2^128 and 60 at
        2^256). E(K) for any K: C5 untested (the twist union is not E(K)),
        and the degree-3 run set EXP-CZLIFT-8c50ea is inadmissible. "Rank is
        small" as the reason (the bound holds at every fixed rank). Height as
        attack cost. A reject_scoped of the uniformity clause (post hoc;
        awaits the pre-registered replication on disjoint curves and primes,
        and certificate packaging of the D3/D5 and translation instances).
      not_established_rests_on: [EV-CZLIFT-376eee transfer_assumptions/C4/C5, DEC-20261023-26a6de, DEC-20261023-6931ab, DEC-20261023-fdc4af]
    xedni:
      established: >-
        H2 clause "the xedni analysis ... die[s] on this", at the nearby
        object actually tested: r in {2, 3} points from the y != 0 sampler
        with distinct x, symmetric integer lifts, the zero-freedom Weierstrass
        fit, relation bound 6, eight primes 101..12809. The exact search found
        1 relation in 3200 trials (3.1e-4; a tangent coincidence at p = 101,
        packaged as a counterexample certificate), so the hypothesis' zero
        prediction failed and it is weakened; controls detected 48 of 48. The
        bounded count is pigeonhole-dominated (at most the mod-p
        bounded-relation rate, about (13^r - 1)/(2p)) and sits below the
        attacker's coefficient regime p^(1/r); it measures neither the xedni
        obstruction nor independence. JKSST 2000 (retrieved) bounds xedni
        success by C0/p only conditionally (Lang's height conjecture, Lemma
        4.1's assumption), vacuously at toy p, and reports frequent dependence
        at small discriminants; KR-IC-cd159a overstated it.
      rests_on: [DEC-20261023-488023, EV-CZLIFT-ee9b23, CORR-20261023-4ffd7e, CORR-20261024-b8d209, CORR-20261024-63d682, CORR-20261023-eeaec8 X1/X2]
      not_established: >-
        Anything about xedni proper (2 <= r <= 9, discriminant minimization,
        reverse-Mestre conditions), relation coefficients above 6, the literal
        all-points sampler, "independent" lifts (only an unbounded certificate
        could show it), index calculus on E(Q), or the Silverman-Suzuki and
        Huang-Kueh-Tan arguments (recalled pointers). That xedni "dies on" the
        counting ingredient is not established.
      not_established_rests_on: [DEC-20261023-488023, CORR-20261023-1cf8b3 S4, CORR-20261024-a7e0af M3/Q1]
    f_p_star_calibration:
      established: >-
        The G_m calibration of the section-and-ratio method (Z_p^* -> F_p^*,
        log_p(s(x)^{p-1}); 80 primes 50 < p < 2000, precision 4, 3200 pairs,
        smallest primitive root as frozen). The Teichmuller section is
        homomorphic and its functional vanishes (ratio never defined); the
        random-Hensel ratio is consistent with 1/p (3 of 3200 against 5.39;
        excluded only above 1.63x); the naive integer section exceeds 1/p
        (z = 7.65, 9.14) exactly on the pairs with g^d mod p^2 < p
        (Eisenstein's logarithmic property of the Fermat quotient), an
        archimedean no-carry effect with no discrete-log content beyond an
        O(log p) integer-logarithm check. H-CZLIFT-d37231 is rejected as posed
        in its naive-success and homomorphism-rate clauses (strong, by
        derivation, replicated on two seeds). Transfer, review-side only: an
        elliptic analogue exists at the integral multiples of a small global
        lift on a small-coefficient model (Siegel-finite, no leverage), so
        every elliptic Smart-style statistic must be split before it is read
        as a random rate.
      rests_on: [DEC-20261023-039ddf, EV-CZLIFT-f2a401, KN-FIND-c71e5d, CORR-20261024-abc5e2 B1/B2]
      not_established: >-
        The random-generator reading (review-side expected z 0.18 +- 1.21,
        untested by runs); any p-adic leakage; any elliptic statement beyond
        the review-side computation on two curves. The stated mechanism
        Hom(Z/(p-1), Z_p) = 0 is not refuted.
      not_established_rests_on: [EV-CZLIFT-f2a401 B-2/B-3/B-4, DEC-20261023-039ddf limitations]
    overall_not_established: >-
      No statement at cryptographic sizes or on a deployed curve; no medium-
      tier evidence for any CZLIFT clause (EXP-CZLIFT-f5e06c is toy); no
      attack, cost or speedup; no closure of any lane. Nothing in the round is
      a section family or global point family that exceeds a matched null with
      replicated significance, so branch (b) of RQ-CZLIFT-b9f765 is not
      triggered.

