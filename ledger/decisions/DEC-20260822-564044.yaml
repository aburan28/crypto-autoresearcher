coordinator_decision:
  id: DEC-20260822-564044
  context: >-
    Ledger archive and state-transition gate for BATCH-7e06d3 of GOAL-ECQ-001,
    the campaign that asked how high a Mordell-Weil rank OVER Q this program can
    certify from scratch and what exactly separates it from the world record.
    The batch produced a rank-8 rational elliptic surface over Q(t), a
    Mestre-Nagao sieve of its Q-rational specialisations, descent certification
    over Q, and a two-axis gap measurement (TASK-20260822-81141a), with the
    Mestre-style producer TASK-20260822-a7a9e8 -- commissioned under the paused
    GOAL-ECRANK-002 and carried forward by DEC-20260822-d9bf63 -- as an input.
    Producer output was frozen at snapshot commit b71f4668 by TASK-20260822-66bacf
    under binding conditions BC1-BC4, then attacked by two independent reviewers
    at review-adversarial / xhigh, blind to each other, on disjoint owned joints:
    the validator (joints 1 and 2, the proves-too-much control set and the blind
    re-derivation) and the red team (joints 3 and 4). Both returned on their own
    joints; nothing in the package reaches rank 31, so the review-breakthrough
    routing rule did not fire and both reviewers recorded that check before
    reviewing. This decision composes the round, adjudicates H-ECQ-cec3c4's
    three predictions, discharges the pre-registered nearby-object control that
    the deliverables never discharged, and decides GOAL-ECQ-001.
  decision: support
  target_ids:
  - H-ECQ-cec3c4
  - GOAL-ECQ-001
  - RQ-ECQ-80f23c

  rationale:

  - id: R1
    label: P1 CONFIRMED, and upgraded from a floor to an exact ceiling.
    text: >-
      The 8-point cubic pencil yields 8 sections with a nonsingular 8x8 height
      regulator: confirmed, and confirmed harder than asked. The validator
      recomputed the general-position audit exactly, showed the cubics system
      has kernel dimension 2 (a genuine pencil), verified the 9th base point by
      exact substitution AND by an independent Sylvester resultant establishing
      the base locus is exactly nine points, verified all 8 sections satisfy the
      family identically over Q(t) as polynomial identities, and then
      specialised at TEN t OF ITS OWN CHOOSING that the producer never tested:
      nine give full rank 8 with least eigenvalue between 1.30 and 5.74 at two
      precisions. The plan's breaking artifact -- a near-singular 8x8 regulator
      at multiple independent specialisations -- did not appear anywhere. Beyond
      the plan, the validator measured the discriminant to be SQUAREFREE of
      degree 12, so all 12 singular fibres are irreducible and Shioda-Tate makes
      8 the EXACT geometric Mordell-Weil rank. P1's "rank >= 8" is now
      "rank = 8, and 8 is the construction's ceiling", measured rather than
      asserted.

  - id: R2
    label: P2 MET at 12, and the 12 is EXACT rather than a lower bound.
    text: >-
      P2 predicted at least one curve over Q of certified rank >= 11. The
      pipeline delivered rank 12 at t = -65/22 with 20 exhibited points, 12
      independent. Both reviewers re-derived all 137 certified ranks with
      implementations sharing no code with the producer or with each other: 0
      points off curve, 0 rank mismatches, on 137/137, in both reports. The
      Silverman-inheritance attack -- the specific way this claim could have been
      hollow -- fails cleanly: on all 137 curves the first eight exhibited points
      ARE the specialised sections, so the rank-8 floor is re-exhibited on the
      specialised curve every time and never inherited. The point-free-bound
      attack fails cleanly: all 83 timed-out fibres claim exactly 8 and not one
      point more, and no curve claims a rank above the r_high beside it. The
      blind re-derivation then started from the a-invariants alone, before any
      producer file was opened, and PARI's own ellrank returned [12, 12] at two
      efforts with TWO DIFFERENT 12-point sets -- so rank E(Q) is EXACTLY 12,
      the producer's bound is sharp, and no better search could have beaten it.

  - id: R3
    label: P3 HELD, with a shortfall of 19 and both axes carrying numbers.
    text: >-
      Best certified rank 12 against the open target 31: shortfall 19. Axis 1,
      base rank over Q(t): 8 achieved and PROVEN to be the ceiling, against the
      roughly 18-20 the published records rest on (recalled literature, labelled
      background, not measured here) -- a scoped gap of 10 to 12. Axis 2, sieve
      volume: 97,640 specialisations scored at 1.028 ms each, 1,548 in the
      matched tier-2 box, 140 descents attempted on 137 distinct fibres, 84
      timeouts, 56 completed, 1,993.0 s total, 1.22 GB peak RSS. The red team
      grepped all four deliverables adversarially for framing that reads as
      progress toward the record and found none; the one place a volume-based
      extrapolation could have been smuggled in is the place the producer
      explicitly closes, by stating that more sieving of THIS surface cannot
      supply base rank. Rule 3 was honoured in substance and not merely cited:
      not one of the 137 curve records treats a timeout as a rank failure.

  - id: R4
    label: THE COORDINATOR'S RECORDED PRIOR ON THE SIEVE WAS WRONG, and this is
      recorded as an overturn rather than quietly dropped.
    text: >-
      The committed review plan pre-registered "if the producer reports a large
      sieve yield, that is the first thing to disbelieve". The red team attacked
      the measurement on the prior's behalf five ways and the measurement won
      all five. It rebuilt the tier-2 scoring from the published c4/c6
      polynomials with its own code and reproduced the top-60 in order with max
      score difference 0.0, reproduced the seeded control draw bit-for-bit from
      the same 1,548-element domain, and showed the arms are genuinely matched
      on alarm and point-search budget. The gap WIDENS under conditioning on
      descent completion (12/29 vs 0/25 at rank >= 11, Fisher p = 1.5e-4) and
      the MN arm had FEWER timeouts, so censoring cannot be inflating it; the
      censor is coefficient size (Spearman +0.765) and is essentially orthogonal
      to the score (-0.104). Then it ran a control the plan never asked for: the
      BOTTOM 20 of the same ordering at the same alarm returned max rank 8 and
      zero at rank >= 9 (p = 6.1e-8 vs the top arm) while the timeout rate
      stayed FLAT at 51.7/58.3/55.0% across the ordering -- a confound constant
      along the ordering cannot produce a monotone response along it. THE PRIOR
      IS OVERTURNED. The diagnosis is structural, not statistical, and it is the
      Coordinator's error to own: EV-ECRANK-b6c9b6 measured the statistic being
      asked for a 0 -> +5 excursion in the top 0.11% of 364,756 twists of
      RANK-0 curves at conductor ~1e11; here it is asked for +1..+3 in the top
      3.9% of a family whose EVERY member already has rank 8, at modest
      conductor. S(N) is a rank-EXCESS detector, and a fixed provably-capped
      base is what makes its variance the excess and nothing else. The prior
      over-generalised from twists to families. The earlier measurement stands
      unchanged within its own scope, and this one is claimed for this pencil
      only. On the validator's joints the prior was CONFIRMED, not overturned
      (P1 held; the certified rank landed inside the predicted 11-14 band), so
      "the reviewers concurred" and "the reviewers concurred with what the
      Coordinator already believed" stay distinguishable here.

  - id: R5
    label: OBJ-2 discharged -- the pre-registered nearby-object control, and the
      Pareto comparison the deliverables owed.
    text: >-
      H-ECQ-cec3c4's proof_search_map pre-registers TASK-20260822-a7a9e8 as the
      nearby object; a grep of all four deliverables for
      dominated_by|sota|a7a9e8|ECRANK-002|Mestre-style|baseline returns 0 hits.
      Under docs/inventor-protocol.md an unchecked null in dominated_by is a
      fabrication, and here there was no field at all. The comparison is
      therefore made in this decision and in EV-ECQ-0d142e OBS-9 / B-6, and it
      goes AGAINST the reviewed pipeline: on best certified rank over Q the
      Mestre route reports 13 against this pipeline's 12, at 1,218 s against
      1,993.0 s, with 29 rank-12 curves against one. The red team could only
      report the comparison as owed because the rank-13 figure sat under BC1;
      the validator's exhaustive re-certification of both rank-13 curves and all
      29 rank-12 curves closes that, so the comparison is adjudicated here
      rather than deferred. What the domination does not cover is recorded with
      equal weight: this pipeline's 12 is EXACT while the Mestre 13 is a lower
      bound with no upper bound obtainable at all (its own RUN-008: 31/31
      ellrank timeouts at a4 ~ 1e19, an infrastructure outcome deciding nothing
      either way), this pipeline's ceiling is a theorem, and the memory axis is
      incomplete because per-run memory was not reported for the Mestre route.
      Consequence, binding on every downstream record:
      best_certified_rank_over_Q_measured: 12 is a WITHIN-FAMILY MAXIMUM FOR
      THIS PENCIL and is never the program's best certified rank over Q.

  - id: R6
    label: OBJ-1 handled by citation, not by repair.
    text: >-
      gap_analysis.json's entire axis-1 block is string and integer literals
      hardcoded in cmd_assemble; nothing in it reads RUN-002, and the same file
      would be emitted verbatim had RUN-002 measured rank 6. The values appear
      true -- the RUN-002 regulator table says what the string says, and the red
      team's own independent bottom-arm descents returned rank 4 at t = 1 and
      rank 7 at t = 2, matching -- but the artifact does not bind them, and a
      field suffixed `_measured` that never touched a measurement is exactly the
      kind of thing this program must not launder into a ledger record. The
      producer's artifacts are immutable and were not edited. Instead
      EV-ECQ-0d142e cites RUN-ECQ-81141a-002 and qt_family.json, plus the
      validator's exact recomputation, for every axis-1 number, and forbids any
      downstream citation of axis_1_base_rank_over_Qt.achieved_measured. Axis 2
      is genuinely derived and is cited as such.

  - id: R7
    label: OBJ-8 accepted -- the closure sentence is narrowed by one quantifier.
    text: >-
      The hypothesis says this route "CANNOT reach 31". Shioda-Tate caps the
      BASE rank over Qbar(t) at 8; it caps nothing about the rank over Q of a
      specialisation, which is 8 + extra, and the only support for "extra stays
      small" is extra <= 4 over 56 completed descents of 140 attempted, in a
      1,548-fibre box drawn from a 97,640 domain -- a finite, 60%-censored
      window on an infinite fibration, while the published ladder is built from
      extra of order +10 to +12 on higher surfaces. Attacking the negative
      result as hard as the positive one is the red team's job and it found the
      one place the record over-reaches. The supported form, and the only one
      this program now asserts: THIS CONSTRUCTION CANNOT EXCEED BASE RANK 8 OVER
      QBAR(T) -- theorem; within the searched domain the largest excess was +4
      in 56 completed descents -- measurement, censored; together, 31 IS
      UNREACHABLE BY THIS SEARCH AS RUN, NOT PROVEN UNREACHABLE BY THIS SURFACE.

  - id: R8
    label: The evidence is admissible, and the binding conditions were real work.
    text: >-
      Validity was checked before interpretation. All seven declared snapshot
      paths reproduce their sha256 at b71f4668 for BOTH reviewers independently,
      so the content binding holds without relying on commit reachability. Seven
      run records carry command, environment, manifest, logs and raw result with
      explicit integer seeds. The certification harness returns the known answer
      on five objects whose answer is known -- 30 on the Alpoge-Howell fixture,
      1 on conductor 37, 0 on an empty support, 0 on torsion support including
      on a positive-rank curve, and 1 on a dependent triple -- and never more,
      so the numbers are not the scorer measuring itself. BC2 IS DISCHARGED:
      commit 78584ab8 is an ancestor of HEAD, the recovered untrimmed RUN-004
      raw result matches its recorded _original_bytes (35,039,973) and
      _original_record_count (34,740) exactly, and its content hash
      7855699d259275644b4d8ed56e6636c8cae6f838b88357287b1d1daaab8eb560 is now
      recorded, converting the recovery path into a content binding. BC3 IS NOT
      TRIGGERED. BC1 IS DISCHARGED FOR RUN-004 and was not ceremonial: both
      rank-13 curves are absent from the retained 300 records and present only
      in the untrimmed file, so the rank-13 verification was impossible against
      the working tree. BC1 IS NOT DISCHARGEABLE AS WRITTEN FOR RUN-007: no
      untrimmed RUN-007 exists in history and the file carries none of the trim
      bookkeeping the deviation note credits it with, so
      DEVIATION-immutability-trim.md's claim that RUN-007 received "the same
      treatment" is UNSUPPORTED BY THE ARTIFACT and this decision does not
      repeat it. No claim is at risk, because RUN-007's raw output is a
      four-number summary with no rank certificate and the validator's own
      re-certification of 156 pool curves is strictly stronger and independent
      of it. BC4 is satisfied with two corrections of fact: there are EIGHT run
      directories, not seven, and runs 005/006 are named 005-assemble and
      006-scrutiny.

  - id: R9
    label: Three orchestration errors, all found by the validator, all carried.
    text: >-
      (a) The validator was DISPATCHED UNDER THE WRONG IDENTIFIER,
      TASK-20260822-0de988, which belongs to BATCH-e0caa5 of the PAUSED
      GOAL-ECRANK-002; this batch's committed validator task is
      TASK-20260822-0a0041. The work is correct -- the validator independently
      confirmed its joints match 0a0041's committed plan -- but the label and
      the filing path are wrong, tools/check_review_independence.py would
      compose the report against the wrong plan, and TASK-20260822-0de988 in
      BATCH-e0caa5 REMAINS UNDISCHARGED so the paused goal still owes it. The
      file was deliberately NOT moved: renaming a committed artifact to hide a
      dispatch error is the overwrite habit this program has already paid for
      once. Every citation in this batch names the report at its ACTUAL path
      while recording which task it discharges. (b) A PARTIAL BLINDNESS BREAK
      caused by orchestrator commit messages that summarised one reviewer's
      findings while the other was still working in the same worktree; the
      ordering is checkable rather than asserted, because the copy of the
      validation report inside the exposing commit already carries its verdicts.
      Reusable rule adopted: while a blind round is live, a commit message says
      THAT an artifact landed, never WHAT it found. (c) A reviewer's in-flight
      deliverable was committed by another process, twice -- the third instance
      of the orchestration-layer pattern the snapshot receipt already recorded
      against itself and the first to touch a reviewer. All three are recorded
      as findings AGAINST THE ORCHESTRATION LAYER, not as defects in the work
      under review, and none of them moved a number.

  - id: R10
    label: Precision, denominators and labels are corrected in the ledger, never
      in the immutable artifacts.
    text: >-
      PF-1 is a uniform ~17-significant-digit divergence between the validator's
      and the producer's regulator determinants on every object compared; both
      computations are internally stable, the float64-roundtrip hypothesis was
      TESTED AND FALSIFIED, and the cause is unknown and was not guessed. No
      rank moves -- ranks are integers read off a ~115-order-of-magnitude
      eigenvalue split -- but EV-ECQ-0d142e quotes no determinant beyond 16
      significant digits, and the producer's "computed at 38 and 77 digits and
      required to agree" check is recorded as VACUOUS for the least_eigenvalue
      fields, which are IEEE doubles and identical at any two precisions by
      construction. Also corrected in the record and not in the artifacts: two
      mislabelled qt_family.json fields (the discriminant is stored for the
      (c4, c6)-invariant model, off by 6^12, which changes nothing in degree,
      squarefreeness or Shioda-Tate; and regulator_det_8x8 holds the r x r
      sub-determinant at the four exceptional t where the 8x8 determinant is
      exactly zero); the rate denominators that include never-descended fibres,
      so "1 in 140" is honestly "1 in 56"; assembled_from_runs naming RUN-005
      when every count comes from RUN-004; the assemble step's 0.0105 s standing
      where the campaign's 1,993.0 s belongs; and the fact that the headline 12
      was obtained under a 20 s alarm while the matched arms ran at 8 s with a
      maximum of 11.

  - id: R11
    label: C2 IS MET. C1 IS NOT, and nothing here is to be read as meeting it.
    text: >-
      C2 requires the best rank over Q this pipeline actually certifies, with a
      committed witness, together with a quantified gap on BOTH axes, as
      NUMBERS. All three are delivered. Witness: certified_curves.json at
      sha256 a342ff9c...3d15aee, committed at b71f4668, content-verified
      independently by both reviewers, carrying 20 exhibited points on
      y^2 = x^3 - 518228207838672723 x + 141005837549331272675978478 of which 12
      are independent -- and the rank is exactly 12, not merely at least 12.
      Axis 1 as a number: base rank over Q(t) = 8, measured and proven to be
      this construction's exact ceiling, against the ~18-20 the criterion itself
      names as the comparator; the number C2 asks this program to supply is 8,
      and it is bound to RUN-ECQ-81141a-002 and qt_family.json rather than to
      the unbound literals of OBJ-1. Axis 2 as numbers: 97,640 scored, 1,548 in
      the matched box, 140 descents attempted on 137 distinct fibres, 84
      timeouts, 56 completed, 1.028 ms/score, ~7.5 s/descent, 1,993.0 s total.
      C1 -- an explicit curve over Q with a committed certificate of rank >= 31
      -- IS NOT MET, was recorded from the outset as not expected of this
      pipeline, and remains OPEN as a world-record problem. THIS DECISION DOES
      NOT CLOSE ON C1 AND NO PART OF IT MAY BE READ AS PROGRESS TOWARD C1.

  hypothesis_transition:
    target: H-ECQ-cec3c4
    from: specified
    to: supported
    scope_of_the_transition: >-
      Clause 1 (rank 8 over Q(t)) is CONFIRMED and strengthened to an exact
      ceiling. Clause 2 (certifies rank >= 11 over Q within a bounded search) is
      MET at 12, and 12 is exact. Clause 3 is supported ONLY IN ITS NARROWED
      FORM per R7: the cap is on the base rank over Qbar(t), and 31 is
      unreachable by this search as run rather than proven unreachable by this
      surface. HEUR-1 (Mestre-Nagao ordering) is validated FOR THIS PENCIL ONLY,
      with a dose-response consistent with its BSD-flavoured random model
      (predicted per-rank shift 5.6095, observed first step +5.26) and a decay
      control at the bottom of the ordering; it contributed to no certified rank
      anywhere. The transition carries NO claim about rank over Q beyond the
      exhibited curves, and no asymptotic claim of any kind
      (asymptotic_claim is null, so the four promotion gates are not engaged).
    recorded_in: ledger/hypotheses/H-ECQ-cec3c4.yaml (status + status_note)

  goal_transition:
    target: GOAL-ECQ-001
    from: active
    to: completed
    criterion_met: C2
    criterion_not_met: C1
    basis: >-
      AGENTS.md rule 13 as currently suspended: a GOAL-* reaches completed on a
      committed Coordinator decision showing a declared completion criterion was
      met. The criterion met is C2 and its evidence is EV-ECQ-0d142e, which
      rests on artifacts content-bound at commit b71f4668 and on two independent
      adversarial reviews. NO completion_quorum block is recorded, because none
      was gathered; the three-model quorum is suspended and this closure rests
      on this decision and its cited evidence alone, which is the full weight
      that arrangement places on it. No attestation is claimed that was not
      obtained.
    why_closing_rather_than_continuing: >-
      The goal asked a question that has an answer, and it now has it, verified:
      the pipeline certifies 12, the base-rank axis is closed by a theorem, and
      the sieve-volume axis is measured. Keeping the goal open would keep it
      open toward C1, a world record its own objective declared out of reach --
      which is precisely the "quietly aims at 31" dishonesty RQ-ECQ-80f23c was
      written to avoid. Campaign budget remains (1 of 4 batches used, 3,211 s of
      21,600 s across both producers), and that is deliberately not treated as a
      reason to continue: the criteria are the contract, not the budget.
    residual_uncertainty_and_revisit_condition: >-
      Three named residuals leave this goal alive as successor work rather than
      as a reopening: CTRL-1 (re-descend the 66 timed-out tier-2 fibres at a
      120 s alarm and republish the efficiency rates with completed-descent
      denominators -- the single highest-value new measurement identified by
      this round, cost bounded by 66 x 120 s); CTRL-2 (replicate the whole
      matched-arm design on a SECOND 8-point configuration, since n = 1 family
      today); and the Mestre route's scan box (|n| <= 400, d <= 12), which its
      own producer names as the near-term limit and which was never widened
      within budget. REVISIT CONDITION, pre-declared: reopen or supersede
      GOAL-ECQ-001 if CTRL-1 raises the best certified rank of THIS pipeline
      above 12, or if any construction in this program certifies a rank over Q
      above 13 -- either event changes a number this goal published.

  pareto_and_baselines:
    external_baseline: >-
      Published ladder over Q: 28 (Elkies 2006), 29 (Elkies-Klagsbrun 2024), 30
      (Alpoge-Howell 2026); 31 OPEN. Certified here: 12. Shortfall 19. The
      producer cited the ladder as background and explicitly refused to launder
      the recalled base-rank figure into a measurement, which is the right call
      and is credited.
    internal_baseline: TASK-20260822-a7a9e8 (GOAL-ECRANK-002, paused; carried
      forward by DEC-20260822-d9bf63)
    dominated_by: >-
      TASK-20260822-a7a9e8 on the headline axis. Max certified rank over Q 13
      vs 12; 29 curves at rank 12 vs 1; 425 at rank 11 vs 12; wall clock 1,218 s
      vs 1,993.0 s. Both rank-13 curves and all 29 rank-12 curves were
      exhaustively re-certified by the validator, so this is adjudicated, not
      alleged.
    sota_delta: >-
      -1 rank against the program's own internal best (12 vs 13); -19 against
      the open target 31; -18 against the published record 30. Positive deltas
      this pipeline does hold and the Mestre route does not: an EXACT rank
      (unconditional r_high = 12) rather than a lower bound; a proven base-rank
      ceiling; and an affordable 2-descent regime in which certified rank equals
      r_low equals r_high on every completed descent.
    memory_axis: >-
      INCOMPLETE, and recorded as incomplete rather than estimated. 1.22 GB peak
      RSS is reported for this pipeline; the Mestre route reports no per-run
      memory.

  evidence_refs:
  - EV-ECQ-0d142e
  - EV-ECRANK-b6c9b6          # the prior this batch overturned FOR THIS OBJECT ONLY
  related_decisions:
  - DEC-20260822-d9bf63       # provenance of the carried-forward Mestre producer
  - DEC-20260822-5a5635       # the sibling decision whose finding this narrows
  review_refs:
  - coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/tasks/TASK-20260822-0de988/validation_report.yaml
  - coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/tasks/TASK-20260822-53748a/red_team_report.md
  - coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/archives/TASK-20260822-66bacf/receipt.yaml
  - coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/archives/TASK-20260822-2fa82a/receipt.yaml
  - coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/CORRECTION-review-dispatch-errors.md

  limitations:
  - >-
    RANK >= 31 OVER Q WAS NOT ACHIEVED AND REMAINS AN OPEN WORLD RECORD (record
    30, Alpoge-Howell 2026). Nothing in this decision approaches it, and C1 is
    not met.
  - >-
    12 is a within-family maximum for ONE pencil and is NOT the program's best
    certified rank over Q, which is 13 from the carried-forward Mestre route.
  - >-
    n = 1 family, one 8-point configuration, one seed, one arm size, one tier-2
    box, PARI 2.15.4 ellrank under 8 s and 20 s alarms. Every efficiency number
    is a property of this pencil; CTRL-2 is not run.
  - >-
    The headline 12 is censored at 60% (84 of 140 attempted descents timed out)
    and was obtained under a 20 s alarm while the matched arms ran at 8 s with a
    maximum of 11. Un-censoring can only raise ranks, so the published figures
    are lower bounds.
  - >-
    The axis-1 GAP (10 to 12) is a scoped estimate against a RECALLED literature
    figure labelled background; only the achieved side, 8, is measured. A
    recalled citation is a pointer, never support.
  - >-
    PF-1 is unexplained. It moves no rank, but no regulator determinant from
    this batch may be quoted beyond 16 significant digits.
  - >-
    No experiments/<EXP-ID>/specification.yaml exists for this work. The handoff
    plus the hypothesis are accepted ONCE as the protocol of record, on the
    validator's confirmation that both were committed before execution and carry
    every required field; this is not a precedent and a future rank campaign
    owes an EXP-* contract.
  - >-
    Snapshot open item O2 remains OPEN for the archive: only the seven declared
    producer paths are hash-bound; run directories, src/ and the deviation notes
    rest on durability commits. This is closed for the NUMBERS -- the archived
    pipeline.py provably differs from the executed one only by a no-op flag,
    aggregation code and argparse wiring, verified by recovering the original
    from c8a44009 and diffing -- and both hashes are recorded in this batch's
    ledger archive receipt.
  - >-
    Reviewer independence is imperfect and disclosed: a wrong-identifier
    dispatch, a partial blindness break through a commit message, and a
    reviewer's in-flight file committed by another process. The substantive
    independence holds and the ordering is checkable; the auditability does not,
    and that is recorded rather than cured.

  next_actions:
  - id: N1
    priority: 1
    action: >-
      SINGLE NEXT ACTION FOR THE GOAL RECORD. Open a successor goal for the
      best-certifiable-rank-over-Q lane under RQ-ECQ-80f23c, whose first batch
      widens the Mestre route's scan box beyond |n| <= 400, d <= 12 -- the limit
      its own producer names and never reached -- and runs CTRL-1 (re-descend
      the 66 timed-out tier-2 fibres at a 120 s alarm, republishing the
      efficiency rates with completed-descent denominators) as the paired
      hardening measurement. GOAL-ECQ-001 dispatches nothing further.
  - id: N2
    priority: 2
    action: >-
      Take the obstruction's resource reading seriously enough to mint a record
      for it: this pencil as a CHEAP, FULLY-DESCENDABLE CALIBRATION FIXTURE for
      Mestre-Nagao sieve design (N, threshold, arm size tuned at 1.028 ms/score
      and ~7.5 s/descent with ground truth available because ellrank closes),
      before those choices are spent on a K3 base where 2-descent is
      unaffordable. EV-ECQ-0d142e's obstruction.resource_check records
      spawned_ids as EMPTY because no such record exists yet; minting one closes
      that honestly.
  - id: N3
    priority: 2
    action: >-
      Discharge TASK-20260822-0de988 in BATCH-e0caa5, which the identifier
