  controls_and_limits:
    - Exact-only C-custody and C-cell criteria decide this diagnostic; C-cross-arm is confounded and P-monitor/P-planted are in-sample calibration.
    - Three separately planted B=475 m=2 systems, coset quadratic lift then random and small-x direct encodings, with no adaptive selection.
    - A synthetic monitor-null fault must fail closed before any scientific call.
    - Exact archived satisfying witnesses, polynomial roots, base membership, signed lifts and full target points are independently checked; contradictory no-solution output invalidates the instrument.
    - All raw requests, phase traces, stdout, stderr, present responses, receipt and tar bytes are retained, including censors and unattempted cells.
    - One worker, three scientific calls, 600 seconds per call, 2100 seconds total, sampled 8 GiB process-tree RSS, 8 GiB scratch and model cap 64.
    - Snapshot the run before two mutually blind reviewer sessions; the Validator owns custody and point identities, Red Team owns censor and inference boundaries, with a known-false control and blind rederivation.
