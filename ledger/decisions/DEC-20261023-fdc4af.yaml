  decision: pause
  decision_label: >-
    Run set returned to the Executor with concrete defects; the evidence review of
    H-CZLIFT-89e169 stops here. No evidence record is written. H-CZLIFT-89e169 stays approved.
  decision_scope: >-
    One action: the run set of EXP-CZLIFT-8c50ea is ruled inadmissible as evidence and returned.
    The value "pause" is used because it is the only value in both the template schema and the
    skill's transition list that stops a review without moving a claim. Here it pauses only the
    evidence review of H-CZLIFT-89e169 until a valid run set exists. The reason is invalidity,
    not low value. support and weaken are excluded by the skill's stop rule; replicate and expand
    presuppose admissible evidence; refine/revise are readings of the hypothesis, and this
    decision reads no result. The validator's specification-box recomputation (cubic gain 1.3830 /
    1.3721; coverage medians 1.0080 to 1.0089) is not a run record and is not adopted as a result.
    No hypothesis status moves. RQ-CZLIFT-b9f765 is not changed. GOAL-CZLIFT-1516d5 stays active.
    No run is authorized, nothing is promoted, and the recorded runs are not edited. The frozen v1
