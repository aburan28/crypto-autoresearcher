      - 'The growth tables N_K_at_hmax and N_Q_at_hmax and slope_K, as counts of K-points in the stated boxes. They omit genuine points (for example 37a1 27 recorded against 33 / 39 sealed).'
      - 'cubic_gain_median 1.2553 / 1.3077 and coverage_ratio_median 1.0078 / 1.0075, as the frozen quantities.'
      - 'The reading "small points ... reduce to E(F_p) at split primes like uniform points". The instrument cannot detect excess, and the statistic was not compared with a same-shape null.'
      - 'The claim_boundary "coordinate boxes 32 (d <= 4) and 24 (d <= 6)". d > 4 was never searched at H <= 24.'
      - 'Two independent trials. The second is a sub-computation of the first.'
    still_records: >-
      That the two trials ran under the frozen plan, with the receipts and numbers shown. Those numbers
      are reproduced exactly by validation as outputs of the code as written, and remain observations of
      that code only. DEC-20261009-44c288 is not edited; this field supersedes its use, not its text.
  rationale:
    - 'Validity before interpretation (coordinator contract, responsibility 6; skill step 2). Custody is exact and the producer code reruns to identical bytes. But the enumerated set is not the frozen box, the sealed blind count disagrees (37a1: 33/15 vs 27/15 main, 39/17 vs 27/15 replication), the replication is not an independent instance, and two metric definitions differ from the frozen ones.'
    - 'The validator states that on the specification''s definitions every success criterion still holds and no falsification condition triggers. That is a verification replay, not a run record. Adopting it would repair the run set in prose, which is forbidden. And because of D7 the coverage clauses would carry no support even if adopted. "Criterion met" here measures the instrument''s ceiling, not the hypothesis.'
    - 'The defects are implementation and specification errors (agents/executor.md failure semantics), not negative observations. Under AGENTS.md core rule 5 they say nothing against H-CZLIFT-89e169.'
    - 'A re-run of the same contract with only the code fixed would still leave unfalsifiable coverage clauses and a nested replication. A superseding contract is required, not a replication.'
    - 'No evidence record and no hypothesis transition: the skill stops at an invalid run set. No refutation artifact is sought, because no adverse call is made.'
