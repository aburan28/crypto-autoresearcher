  status_transitions: []
  validity_check:
    expected_run_count: '2 of 2 planned trials present (trial-plan.json), each output_validated, returncode 0, check_returncode 0; 2 of an advisory maximum of 4 runs used.'
    manifests_schema: 'complete for the required artifacts. Custody J1 holds: 9/9 execution-receipt hashes per run and 10/10 ledger-receipt hashes per run match (VAL-20261022-833f7f artifact_checks).'
    seed_integrity: 'deterministic enumeration with no seeds (replication.seeds []); the two trials are the two boxes.'
    raw_summary_agreement: 'raw-result.json equals the manifest metrics and stdout. All 78 (N_K, N_Q) pairs reproduce, but only under the code''s undeclared definition, not the specification''s.'
    control_comparability: 'FAILS. The replication instance is a strict sub-computation of the main trial. The 11a1 control can detect only over-acceptance. The checker''s re-run test (fresh <= recorded) cannot detect under-counting.'
    instrument_fidelity: 'FAILS. The enumerated set is not the frozen box; genuine K-points are dropped (J2), and the sealed blind count for 37a1 disagrees on both boxes (J3).'
    verdict: 'inadmissible: the recorded load-bearing quantities are not the frozen quantities, and the replication is not an independent instance.'
  defects:
    - id: D1
      kind: implementation_error
      where: harness/czlift_cubic.py:97, search_points (frozen sha256 d0b447824a023715cb4077b47e4ff280725d292fee693c10c6e577663be7f1ed)
      defect: >-
        The skip gcd(c0, c1, c2, d) != 1 drops genuine K-points whose x has a denominator at the ramified
        primes 2 and 3. Because x = alpha/d^2, a non-primitive (alpha, d) can be the only representation
        in the box. Example: 37a1, x = -theta/2, y = (theta^2 - 1)/2, alpha = -2 theta, d = 2. In the main
        box it drops 9 x-values (37a1 3, 5077a1 5, 234446a1 1), all non-rational.
      evidence: VAL-20261022-833f7f blind_rederivation (disagreement, hand_check, localisation); j2_borderline_output.json
    - id: D2
      kind: implementation_error
      where: harness/czlift_cubic.py:114, height()
      defect: >-
        height = max(|coords|, d^2) is not the specification's box (|coords(alpha)| <= hmax and d <= dmax,
        with no d^2 term). At H <= 24, d <= 4, so dmax = 6 is never reached. The d = 5 points are dropped
        (rational 9/25, 6/25, 21/25, -14/25, 24/25, and two non-rational on 37a1).
      evidence: VAL-20261022-833f7f metric_recomputations (dropped_points_replication)
    - id: D3
      kind: specification_error
      where: replication box (inputs.box.replication) under the implemented height
      defect: >-
        The replication run's counts_K, counts_Q and all 432 shared coverage cells are identical to the main
        run's at every shared H on all six curves. The replication is a strict sub-computation of the main
        trial, not an independent instance, so "a prediction counts only if it holds on both" was never
        tested.
      evidence: VAL-20261022-833f7f control_checks (replication)
    - id: D4
      kind: implementation_error
      where: experiments/EXP-CZLIFT-8c50ea/implementation/run.py:98 (coverage) and :103 (gain)
      defect: >-
        coverage_ratio_median takes ratios[len // 2], the upper of the two middle cells (+4.04e-5 and +5.05e-5
        against the statistical median). cubic_gain_median is sorted(...)[3] over all six curves, 11a1
        included, while H-CZLIFT-89e169 defines it over curves with N_Q >= 10. The two coincide numerically
        on these data, but the definition is not the frozen one.
      evidence: VAL-20261022-833f7f metric_recomputations
    - id: D5
      kind: specification_error
      where: undeclared analysis choices in run.py
      defect: >-
        The contract does not declare: the coverage-cell filter (n_points >= 20 and model_distinct <=
        0.9 N_p; without it, 504 and 432 cells), the cube root of 2 mod p used for reduction (the smallest
        of three; medians vary by up to 0.0009 across roots), which 12 split primes are used (every 8th of
        103 eligible), or the growth-slope fit (log N_K against log log H over H >= 4 with N_K >= 3).
      evidence: VAL-20261022-833f7f metric_recomputations (coverage_cells, split primes, slope_K)
    - id: D6
      kind: implementation_error
      where: experiments/EXP-CZLIFT-8c50ea/implementation/check.py:33
      defect: >-
        The checker imports the producer's driver and harness, so it is not independent. Its re-run test
        checks fresh <= recorded, which cannot detect under-reproduction. It re-verifies only sample points,
        so it cannot see dropped points.
      evidence: VAL-20261022-833f7f control_checks (invalidation rule)
    - id: D7
      kind: specification_error
      where: success criterion (coverage clauses) and decision_impact.on_negative
      defect: >-
        The coverage clauses cannot fail on the excess side. Because distinct <= n_points, a cell's ratio is
        at most n / (N_p (1 - (1 - 1/N_p)^n)), which is at most 1.3089 (main) and 1.2632 (replication). So
        frac_above_1p5 = 0 for every possible point set, and an all-injective median is only 1.00820 /
        1.00785, below the upper edge 1.2. Only a heavy collision deficit (median < 0.8) could move the
        criterion. The ceiling tends to 1 as p grows at fixed box. on_negative ("a coverage excess opens a
        larger-box follow-up") is unreachable. The lower edge of cubic_gain_median in [1, 4] is implied by
        the control N_K >= N_Q, so only the upper edge 4 tests anything.
      evidence: VAL-20261022-833f7f null_object_checks; DEC-20261023-26a6de rationale (same ceiling on EXP-CZLIFT-a255fc)
    - id: D8
      kind: specification_error
      where: control "11a1 must show no height dependence beyond its torsion" (PTM-1)
      defect: >-
        11a1 has no non-rational K-points in either box, so a search that drops genuine points leaves its
        count flat. The control can detect over-acceptance only and is structurally blind to D1 and D2.
        The rank of 11a1 over K is not determined, so the known-false conclusion holds only inside the
        tested boxes.
      evidence: VAL-20261022-833f7f proves_too_much (capability_note)
  superseding_contract_must:
    - 'Code fix (D1): enumerate the specification''s box exactly. Remove the primitivity skip. Deduplicate points by their exact x-value in K (a canonical reduced form), not by gcd of the representation. Add a regression test that recovers 37a1 x = -theta/2, theta^2 - theta/2 and -(theta + theta^2)/3, and the d = 5 points listed in VAL-20261022-833f7f.'
    - 'Height definition (D2): declare the height used for N_K(H) before running, and keep the box definition (|coords| <= hmax, d <= dmax) separate from the H ladder. Every declared dmax must be reachable at the declared hmax, and the manifest records the count of points with d = dmax.'
    - 'Independent replication box (D3): the replication instance uses a split-prime set disjoint from the main one and a box whose point set is not a subset of the main box (for example d in {5, 6} reachable). The manifest reports the count of points outside the main box, which must be > 0. Shared points and cells are reported, and the pre-registered prediction is evaluated on both instances separately.'
    - 'Metric definitions (D4, D5): coverage median is the statistical median (mean of the two middle values for an even count). cubic_gain_median is computed over curves with N_Q >= 10, as the hypothesis states. Declare the cell filter, the reduction root (all three degree-one primes, or one named rule), the split-prime selection rule and the growth-slope fit.'
    - 'Same-shape null (D7): replace the uncalibrated [0.8, 1.2] / 1.5 coverage bounds with a pre-registered comparison against a seeded same-shape uniform null. For each counted cell, draw n_points uniform samples from N_p (>= 1000 reps, declared seed). Report exact two-sided per-cell tails and the median''s position in the null band. Pre-register the kernel-floor structured null of DEC-20261023-26a6de as a second comparison. State in advance what the ratio should do as p grows.'
    - 'Criteria that cannot fail (D7): drop frac_above_1p5 < 0.05 and the 1.2 median edge, or replace them with bounds that some point set can violate, proved reachable in the contract. State that the gain lower edge 1 is implied by the control. Rewrite on_negative so that it names an outcome the instrument can produce.'
    - 'Control for under-counting (D8): add a positive control curve with known K-points of valuation -2 at a ramified prime (37a1 at x = -theta/2). The search must find every listed point. Keep 11a1 as the over-acceptance control.'
    - 'Independent checker (D6): it must not import run.py or harness/czlift_cubic.py. It enumerates the box with its own exact square test (two methods, as in VAL-20261022-833f7f), and its re-run test requires equality, not fresh <= recorded.'
    - 'Version and supersession: a new experiment id (or a v2 with a versioned amendment under experiments/EXP-CZLIFT-8c50ea/amendments/) that names EXP-CZLIFT-8c50ea v1 as superseded. Source hashes are re-frozen, and peak memory and library versions (sympy, PyYAML) are recorded. Approval requires tools/experiment_preapproval.py approvable: true.'
