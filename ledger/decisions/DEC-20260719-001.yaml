coordinator_decision:
  id: DEC-20260719-001
  context: >-
    EXP-SEMAEV-001 produced 12 valid, certificate-verified runs. The toy-scale
    S_3 decomposition Groebner cost met both predefined thresholds of
    H-SEMAEV-001 (max-degree proxy <= 6; wall time < 1.0s, flat over 8-12 bits).
  decision: expand
  target_ids: [H-SEMAEV-001, EXP-SEMAEV-001, RQ-ECDLP-001]
  rationale:
    - predefined success criterion met at toy scale (EV-SEMAEV-001)
    - a 3-point bit range and 2 seeds cannot establish a scaling trend
    - the cheap, stable toy behavior justifies a wider, better-replicated study
  evidence_refs: [EV-SEMAEV-001]
  limitations:
    - claim tier toy; no medium/crypto-scale inference is licensed
    - timings are sympy-bound and not a cost model vs. the rho baseline
  next_actions:
    - design EXP-SEMAEV-002 spanning wider bit sizes and factor-base sizes with
      more seeds; predefine decomposition-probability as a controlled metric
    - keep H-SEMAEV-001 at status analyzed pending replication before any
      "supported" claim
  decided_by: coordinator
  decided_at: '2026-07-19'
