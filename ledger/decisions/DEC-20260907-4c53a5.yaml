  rationale:
    - >-
      RANK 4 IS THE HIGHEST EXECUTABLE ITEM. RANK 1 is unapproved
      (EXP-ECDLP-6ac801 v3, `approved_by: null`). RANK 2 is blocked on that
      revision. RANK 3 is an amendment. Dispatching an unapproved contract
      would be a specification_error. Designing and approving this contract
      under the standing authorization is the ranked action that makes a
      `/run-experiment` start possible in this session.
    - >-
      a = 1/16 IS STILL OWED. EV-ECDLP-6783b8 `a_focus_note` (opened): "This
      record does NOT re-open or re-test a = 1/16 or a = 3/16". DEC-20260907-6d9427
      `cross_lane_state_discovered_at_archive_time` finding 2: "THE CELL THIS
      ROUND CALLS ITS SOLID RESULT STILL HAS NO INDEPENDENT READING OUTSIDE
      THIS BATCH." The primary cell of EXP-ECDLP-56117b is that owed reading,
      by an implementation forbidden from reading source_v2/, source_v3/, and
      EXP-ECDLP-6ac801/source/.
    - >-
      a = 1/8 IS A DISTRIBUTION, NOT A TALLY. DEC-20260907-6d9427 next_action
      RANK 1 (opened): "what is open at a = 1/8 is NOT 'which implementation
      is right about seed 2' ... THE SUCCESSOR'S a = 1/8 ARM MUST RAISE THE
      SEED COUNT -- 20 seeds, not 5 -- and report the margin distribution
      rather than a 4/5-versus-5/5 tally. Chasing seed 2 is chasing a label."
      Cell a8r2 therefore has no binary G3 threshold.
    - >-
      KNOWN-FALSE AND DECAY ARE IN THE SAME CONTRACT. EV-ECDLP-60e266
      (opened): exact top-T/2 basin share below STATIC(T) exact coverage in
      10 of 10 exactly enumerated seeds at a = 1/4. A PASS at a4r2 fires
      proves-too-much. Decay in r at both owed a-values on seeds {1..5} is
      the inventor-protocol control: signal must be non-increasing, FAIL by
      r = 8.
    - >-
      INDEPENDENCE IS THE LOAD-BEARING CONSTRAINT. EV-ECDLP-2e9680 records
      that EXP-ECDLP-6ac801's production arm imported source_v2/instrument.py.
      EV-ECDLP-6a4ebc IL-1 records that BATCH-8f3e86 STAGE 3B did the same.
      This contract forbids those paths, and forbids any existing
      instrument.py in the lineage. The G3 predicate is copied as text from
      v2_to_v3.yaml Section 3; the implementation is written from that text.
    - >-
      PROTOCOL IS COMPLETE. Controls, metrics, budgets, stopping and
      invalidation rules, success and falsification criteria, and 466 exact
      artifact paths are filled. proof_search_map.applicable is false with
      all four audits recorded as N/A: this is an empirical measurement, not
      a theorem. claim_tier is toy.

  limitations:
    - "TESTED CELLS ONLY, claim_tier toy: generic random-function instrument, N = 2^24, T = 256, T_sel = 128, a in {1/16, 1/8, 1/4}, r in {2, 4, 8}. No curve, no cryptographic N, no exponent."
    - "A CEILING, NOT A MECHANISM. Zero online arms run. TopShare(T_sel) is an oracle requiring exact basin sizes."
