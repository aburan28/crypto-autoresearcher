    - "R3 IS NOT DISCHARGED BY APPROVING THE CONTRACT THAT WOULD SUPPLY THE MISSING READING. Discharge is a later Coordinator act after a valid run set and independent review."
    - "NULL_T is out of scope. a = 3/16 is omitted to keep the grid finishable. N = 2^30 exact basins are forbidden (declared infeasible on 15 GB in v2_to_v3.yaml Section 10)."

