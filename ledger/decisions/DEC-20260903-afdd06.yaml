coordinator_decision:
  id: DEC-20260903-afdd06
  context: >-
    BATCH-b38667, GOAL-AES-003 / RQ-AES-003. TASK-20260903-92ade4
    (idea-generator, RANK 1 of DEC-20260903-be4472) produced a zero-arm design
    proposal for a pooled-exposure floor-magnitude adjudication (the "FM
    cascade"): a preregistered, five-branch decision rule reading the
    exposure-free rate ratio rho = lambda(4)/lambda(16) through the exact
    conditional binomial law of one pooled count given the pair's total,
    against a measured r=6 null-object comparator, under AMEND-1 and
    NARROW-1..5. Two independent, mutually blind reviewers each owned one
    joint of the review plan recorded in ledger/handoffs/TASK-20260903-92ade4.yaml:
    TASK-20260903-779393 owned J-P (the exposure-to-decision arithmetic and
    the decidability of the preregistered rule); TASK-20260903-4fdf77 owned
    J-S (what the rule licenses: scope, pooling assumptions, instrument
    custody, Pareto honesty, and the required proves-too-much control).
    This is the closing archive that composes both joints, promotes the
    design verbatim to IDEA-20260903-bd730d, and checkpoints GOAL-AES-003.
    It runs ALONE, after both reviews returned, per the task card's
    runs_alone discipline. This is a DESIGN REVIEW, not an evidence review:
    zero arms were run by the producer or by either reviewer against the
    committed instrument.

  decision: revise
  decision_rationale_for_verb: >-
    Neither "approve" (this record authorizes no experiment, arm, or
    execution batch) nor "reject_scoped"/"weaken" (nothing here is
    evidence about AES, and no hypothesis moves) fits. "revise" is used in
    its narrowest sense: the design is promoted to the ledger as a
    reviewed candidate, but a concrete, quantified gap in its
    FM-PLATEAU-CONSISTENT branch (successor requirements 2 and 3 below)
    must be closed before any future Coordinator decision may authorize
    execution of D-1, D-2, or any successor design derived from this IDEA
    that could compose an FM-PLATEAU-CONSISTENT sentence.

  target_ids:
    - IDEA-20260903-bd730d
    - TASK-20260903-92ade4
    - TASK-20260903-779393
    - TASK-20260903-4fdf77
    - DEC-20260903-be4472
    - GOAL-AES-003
    - RQ-AES-003

  rationale:
    - >-
      JOINT J-P (TASK-20260903-779393, validator, owning the
      exposure-to-decision arithmetic and rule decidability): VERDICT
      HOLDS. The validator performed a sealed blind re-derivation (fresh
      scipy code, never reading pooled-exposure-pricing.json until after
      the seal) of the exact Garwood CIs, the pooled exposure per design
      rung, the expected counts under each named alternative, and the
      discrimination power at the stated alpha; every quantity it could
      independently reconstruct matched the pricing file exactly or
      within immaterial tolerance, INCLUDING the pivotal
      n=3-fails/n=4-passes equivalence-resolution decision that justifies
      the recommended design D-2. It also confirmed, by direct logical
      argument rather than by restating the file's own claim, that the
      five floor-cascade branches are mutually exclusive, exhaustive,
      strictly ordered, domain-fixed pre-arm, and that every branch is
      reachable. ONE LOCALIZED, DISCLOSED-CATEGORY CORRECTION: the
      pricing file's arcsine (Cohen's-h) power-approximation is
      systematically optimistic by 2-5 percentage points at small-to-
      moderate n (worst at D-1's n=2, negligible by D-3/D-4), confirmed by
      the validator's own exact recomputation using the file's own
      constants. This is precisely the gap the pricing file's own caveat
      C3 flagged as provisional pending exact recomputation, and the
      correction does not change which design is recommended, does not
      flip any branch outcome, and if anything makes the design's own
      "honestly underpowered" self-assessment more accurate, not less.
    - >-
      JOINT J-S (TASK-20260903-4fdf77, red team, owning what the rule
      licenses): VERDICT BREAKS, NARROWLY. All four Coordinator-named
      proves-too-much objects (OBJ-1 through OBJ-4: the ramp-zero arm, the
      dead anchor, a synthetic analytic-null draw, and a synthetic
      still-decaying generator at the preregistered minimum detectable
      effect) route correctly under independent fresh-code re-derivation,
      and the design's own disclosure that OBJ-1/OBJ-2's correctness is
      carried by the admissibility gates rather than by the statistic is
      confirmed accurate. The red team then constructed a FIFTH object,
      OBJ-5, not named by the Coordinator's review plan: a bimodal
      seed-heterogeneity generator at k=4 (two arms Poisson(lo), two
      Poisson(hi), arithmetic mean unchanged) that passes every stated
      admissibility precondition P1-P5 and lies inside the design's own
      self-disclosed "20-50% seed-to-seed rate heterogeneity, not
      detectable at n=4" risk band (heuristic H1's honest_power_disclosure).
      By Monte Carlo (150,000 draws across three heterogeneity strengths),
      at a mild, entirely plausible 25% deviation the design's own
      homogeneity gate (FM-OVERDISPERSED) misses this object 84% of the
      time, and when missed the rule composes a licensed
      FM-PLATEAU-CONSISTENT sentence on data with no single governing rate
      about 16% of the time overall - three orders of magnitude above the
      design's own quantified false-plateau rate for the analogous
      DECAY-branch object (OBJ-4, 0.01%). This is exactly the class of
      break the Coordinator's review plan pre-declared as the J-S
      breaking_artifact ("a null object on which the rule returns a floor
      verdict").
    - >-
      SCOPE OF THE BREAK, AS THE RED TEAM ITSELF SCOPES IT AND AS THIS
      DECISION ADOPTS IT: the break is confined to the
      FM-PLATEAU-CONSISTENT branch's implicit single-rate guarantee. It
      does NOT touch the FM-DECAY-CONTINUES branch (independently
      confirmed to power 0.971, matching the design's own estimate within
      tolerance), the gates (P1-P5, G1-G4), the comparator branch
      (FM-COMPARATOR-INDISTINGUISHABLE), or the RANK-2/dominance
      reasoning (confirmed sound with one completeness gap, successor
      requirement 7). It does not mean the pooled-exposure route is dead,
      saturated, or should be abandoned.
    - >-
      COMPOSITION: because J-P holds (with a non-blocking correction) and
      J-S breaks narrowly on a scoped branch-level defect, THIS DESIGN IS
      PROMOTED TO THE LEDGER AS REVIEWED-WITH-AN-OPEN-DEFECT, NOT AS
      REVIEWED-CLEAN. IDEA-20260903-bd730d is promoted VERBATIM (content
      unchanged; only id, title, status and identifier-provenance metadata
      set, per the handoff's promotion discipline) precisely because the
      defect is not a flaw in the arithmetic or in the four
      Coordinator-named proves-too-much objects, but a gap in what the
      PLATEAU branch's admissibility preconditions guarantee under a risk
      the design itself already named but did not quantify for that
      branch. Editing the objection into the proposal's substantive
      content would misattribute a reviewer finding as the producer's own
      and would violate the promotion discipline; the finding belongs
      here and in the successor requirements below.
    - >-
      COORDINATOR'S RECORDED PRIOR (ledger/handoffs/TASK-20260903-92ade4.yaml
      review_plan.coordinator_prior): HELD, IN FULL, AND WAS NOT
      OVERTURNED. The prior's own stated overturn conditions were that
      the review find the separation cheap OR find floor-vs-null still
      open; neither occurred (floor-vs-null is confirmed already decided,
      consistent with prior point (1); the informative target is
      floor-vs-floor, and the finer separation the prior names, 17
      against 12 at 95%, is confirmed materially harder and costlier than
      the design's headline minimum-detectable-effect target, consistent
      with prior point (2) once read at the correct effect size). Prior
      point (4) (a measured null object would be required beyond the
      analytic comparator alone) is exactly what the design supplies.
      Prior point (5) (dominated_by would be the weakest field, RANK 2
      plausibly dominating for a different question) is confirmed by
      J-S's own Pareto challenge, which found dominated_by "substantively
      honest and well-argued on RANK 2" with only a completeness gap
      (successor requirement 7). PRIOR POINT (3) IS THE ONE MOST WORTH
      NAMING EXPLICITLY: "I expect the strongest temptation to be a slide
      toward a plateau or extinction sentence that the exposure cannot
      support... and I expect the red team to have to say so." OBJ-5 is
      precisely that: not a paraphrase risk (NARROW-1/NARROW-4 sentence
      audits both HOLD with no violation, per J-S's narrow_audit), but a
      constructed object showing the PLATEAU branch's own admissibility
      machinery under-protects against exactly the risk the design's own
      prose had already flagged as unmeasured. The review plan's own
      pre-declared J-S breaking_artifact ("a null object on which the
      rule returns a floor verdict") named this exact shape of break
      before either reviewer ran. This is the strongest form "prior held"
      can take: not mere agreement, but the anticipated failure mode
      materializing in a quantified, reproducible form.
    - >-
      SUCCESSOR REQUIREMENTS (TASK-20260903-4fdf77 red_team_report.yaml
      successor_requirements, cited by number, none restated in full):
      requirements 2 and 3 are ADOPTED AS BLOCKING - no future Coordinator
      decision may authorize execution of D-1, D-2, or any successor
      design derived from IDEA-20260903-bd730d that could compose an
      FM-PLATEAU-CONSISTENT sentence, until they are discharged.
      Requirements 1 and 6 are ADOPTED as cheap textual fixes to fold into
      the adopted preregistration text at the same time, at zero
      additional cost. Requirements 4, 5, 7 and 8 are ADOPTED as
      disclosure/completeness items for the same or a later producer
      pass; they do not block. None of the eight is rejected.
    - >-
      OFFICIAL STATUS: no hypothesis, experiment, or goal status moves;
      no evidence record is created (zero arms ran, on either side of the
      review); no completion criterion is met; no attestation or closure
      quorum is claimed; no execution batch is authorized by this
      decision. A successor execution batch (for D-0, D-1, D-2, or any
      revision) requires its own opening Coordinator decision and its own
      frozen contract, after the blocking successor requirements are
      discharged.

  evidence_refs:
    - coordination/goals/GOAL-AES-003/batches/BATCH-b38667/tasks/TASK-20260903-92ade4/design-proposal.yaml
    - coordination/goals/GOAL-AES-003/batches/BATCH-b38667/tasks/TASK-20260903-92ade4/pooled-exposure-pricing.json
    - coordination/goals/GOAL-AES-003/batches/BATCH-b38667/tasks/TASK-20260903-92ade4/preregistration-skeleton.md
    - coordination/goals/GOAL-AES-003/batches/BATCH-b38667/tasks/TASK-20260903-779393/validation_report.yaml
    - coordination/goals/GOAL-AES-003/batches/BATCH-b38667/tasks/TASK-20260903-4fdf77/red_team_report.yaml
    - ledger/handoffs/TASK-20260903-92ade4.yaml
    - ledger/evidence/EV-AES-868db1.yaml
    - ledger/evidence/EV-AES-ac5c12.yaml
    - ledger/corrections/CORR-20260903-d3cab5.yaml
    - ledger/decisions/DEC-20260903-be4472.yaml

  limitations:
    - >-
      Zero arms were run, by the producer or by either reviewer, against
      the committed instrument. Nothing in this decision validates a
      floor-magnitude claim, authorizes an experiment, or confirms the
      design would perform as priced if run - only that its priced
      arithmetic and rule structure are internally sound (J-P) modulo the
      disclosed correction, and that its licensing is sound (J-S) except
      for the scoped PLATEAU-branch gap.
    - >-
      J-S's OBJ-5 finding is a Monte Carlo characterization (150,000
      draws across three heterogeneity strengths), not yet the exact,
      closed-form bound successor requirement 2 asks for; the 16%
      unconditional figure is a reproducible estimate, not an exact
      derivation.
    - >-
      J-P did not exhaustively recompute every cell of the pricing file's
      required_event_totals or arms_per_point_required tables (about 30
      cells); it recomputed a representative, boundary-relevant subset
      (12 power cells, 3 equivalence-boundary cells, the branch-1
      threshold, and the declined retrospective route) and flagged that a
      successor adopting the remaining cells verbatim should recompute
      them exactly first.
    - >-
      The two reviews were produced under mutual blindness (neither
      reviewer read the other's report or the sibling task directory);
      this decision is the first point at which J-P and J-S are composed
      together, and it rests on reading both reports in full rather than
      on either reviewer's own scope statement alone.
    - >-
      The design's own largest disclosed control gap (the 256-byte
      random-bijection null at r=5, RANK 7) remains unbuilt; if a
      FM-PLATEAU-CONSISTENT sentence is ever composed under a revised
      design, it is still to be read artifact-first per the design's own
      artifact_signature_warning, and the plateau branch's licensing
      statement bars a structural reading without that further control.

  next_actions:
    - >-
      Before any Coordinator decision authorizes execution of D-1, D-2, or
      any successor design derived from IDEA-20260903-bd730d that could
      compose an FM-PLATEAU-CONSISTENT sentence, discharge
      TASK-20260903-4fdf77 successor requirements 2 and 3: an explicit,
      disclosed quantitative bound on the FM-PLATEAU-CONSISTENT
      false-positive rate under seed heterogeneity (phi = 1.0 to 2.0),
      analogous to the design's existing overdispersion_sensitivity table
      for the decay branch; and either a tightened Branch-4 admissibility
      conjunct (the dispersion index falling materially below its
      critical value, not merely failing to reject at alpha_H=0.01) or a
      specified raised arm count that bounds the heterogeneity risk.
    - >-
      Fold successor requirements 1 and 6 into the adopted preregistration
      text at the same time, at zero additional cost (extending RAT-3's
      verbatim-quotation discipline to branch "NOT licensed" prohibition
      text; naming the exact tail-construction convention for the exact
      two-sided conditional binomial test).
    - >-
      Requirements 4, 5, 7 and 8 accompany the same or a later producer
      pass; they do not block a successor revision task.
    - >-
      Dispatch the successor revision task via idea-generator against
      IDEA-20260903-bd730d, zero-arm, design-only (no experiment
      authorized), per the checkpointed GOAL-AES-003 next_action.
    - >-
      GOAL-AES-003 is checkpointed additively by this same archive,
      preserving exactly one next_action naming this successor revision
      as RANK 1, with ranks 2-8 of DEC-20260903-be4472 carried forward
      unchanged.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is a design review of an unexecuted, zero-arm measurement
      proposal, not an evidence-review decision: no arm ran on either
      side of the review, no EV-* record exists, and no hypothesis
      status moved. Nothing here reaches `replicated` or `strong`
      evidence strength eligible for a KN-FIND; the reviewed content is a
      preregistered decision rule and its priced arithmetic, not a
      durable empirical finding about AES. OBJ-5 (the heterogeneity-
      driven false-plateau construction) is itself a design-time Monte
      Carlo argument about an as-yet-unbuilt measurement's decision rule,
      not a finding about AES; it is carried forward as blocking
      successor requirements 2 and 3, not promoted to knowledge/findings/.

  procedure_deviations: []

  review_attestation_composed_from:
    - task_id: TASK-20260903-779393
      role: validator
      joint: J-P
      verdict: holds
    - task_id: TASK-20260903-4fdf77
      role: red-team
      joint: J-S
      verdict: breaks

  decided_by: coordinator
  decided_at: '2026-09-03'
  inference:
    requested_policy: coordinator-orchestration-code
    policy: coordinator-orchestration-code
  authorizes_nothing: >-
    This decision approves no experiment, arm, exposure increase, build
    change, status change, evidence record, knowledge promotion, or
    execution batch. It composes a design review and promotes a design
    proposal to the ledger with a stated open defect and blocking
    successor requirements.
