    relevant square classes, proof that the listed signed sums give all distinct generic
    roots, separability and branch locus, geometric versus arithmetic monodromy, special
    j-invariants and characteristic restrictions, what changes on the factor-base
    specialization, and independent proof review.

  decision: support
  decision_scope: >-
    SUPPORTED, SCOPED, AND EXPLICITLY NOT CLOSED.

    (1) The all-m monodromy claim is now a complete derivation rather than a sketch.
    The proof identifies the splitting field as K(E^{m-1}/Delta) and reads the group off
    the deck group of the fibre product of m-1 copies of x : E -> P^1. It holds in every
    characteristic and for every curve, and it gives arithmetic monodromy = geometric
    monodromy. Recorded as KN-FIND-a8990a Theorem A.

    (2) TWO ITEMS ON THE USER'S LIST WERE ANSWERED DIFFERENTLY THAN ASKED, and the
    difference is in the program's favour, so it is stated rather than glossed.
    "Independence of the relevant square classes" turned out NOT to need proving: the
    fibre-product formulation gives (Z/2)^{m-1} directly by Artin's theorem, which is
    why the theorem holds in characteristic 2 and 3 as well and does not depend on the
    Weierstrass model. And "all stated characteristic restrictions" shrank: the group
    theory needs none, only the Weierstrass-coordinate formulas do.

    (3) A NEW RESULT emerged that was not in the brief and is the sharpest thing in the
    package: the exact factorization dichotomy over F_q (KN-FIND-a8990a Theorem B). At
    every good specialization S_m(a_1,...,a_{m-1},T) is either totally split or a product
    of 2^{m-3} irreducible quadratics -- never a factor of degree >= 3, never a mixed
    type -- with the type a function of whether the m-1 x-fibres are simultaneously
    rational. Together with the discriminant corollary it also explains why m=3 is
    special: m=3 is the only arity at which disc_T S_m is a non-square, so the classical
    identity is the exception rather than the first case of a family.

    (4) THE PROOF-REVIEW REQUIREMENT IS NOT MET AND IS THE BLOCKER. No independent
    validator, no red team, and no human reader experienced in function fields or
    arithmetic geometry has reviewed the derivation. AGENTS.md rule 12 is not satisfied.
    The manuscript states this in its own text (section 9) rather than only in the
    ledger, so the defect travels with the document.

    (5) NOVELTY IS NOT ADJUDICATED. eprint.iacr.org returned HTTP 403 to every request
    from this environment, including Semaev's own preprint, so a large part of the
    relevant corpus was not inspected. The manuscript says so in section 9 and lists the
    specific sources a reader with access must check. No novelty claim is made here.

    (6) GOAL-MONO-001 STAYS `paused`. Its completion criterion (a) asks for a census
    result; this is a derivation. Deriving the answer is a stronger response to the
    mathematical question and is not a response to the criterion as written. The
    criterion should be rewritten before the goal is resumed, or the goal should be
    retired in favour of a successor with a criterion that a derivation can satisfy --
    but that is a decision for a properly constituted Coordinator, not for this session.

