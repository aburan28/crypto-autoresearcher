  rationale:
    - >-
      The gap in the prior sketch was identified and closed. KN-FIND-a1f3c2 inferred
      the faithful quotient from "sigma_all acts trivially" without showing sigma_all is
      the WHOLE kernel -- which is exactly the statement that the 2^{m-2} signed sums are
      generically distinct, and exactly the question an exceptional locus would answer
      negatively. The sketch therefore assumed away the question it answered. The missing
      lemma (properness of the preimage of E[2] under a surjective summation
      homomorphism) is supplied and holds for every curve, so the conclusion survives
      unchanged. CORR-20260807-652652 records this.
    - >-
      The reformulation is what makes the result robust rather than merely correct.
      Replacing "the m-1 quadratic extensions are independent" by "E^{m-1} ->
      (E/+-)^{m-1} is a fibre product of degree-2 Galois covers" removes the square-class
      computation, the Weierstrass model, and the characteristic restriction in one step.
    - >-
      The verification is discriminating, not confirmatory. 241643 good specializations
      obeyed the factorization law with zero exceptions, while two MATCHED null objects
      -- a random quartic, and the same S_4 resultant construction with the elliptic
      structure removed -- violated it at 86.3% and 51.1%. NULL-B is the important one:
      it isolates the elliptic group law, not the resultant shape, as the cause.
    - >-
      The exhaustive per-class identity is the strongest single check. Over 257061
      specializations in 5 cells, every Frobenius class satisfied
      S^k N^{n-k} + N^k S^{n-k} = #good + #degenerate with residual exactly 0. This tests
      the closed form and the branch-locus description simultaneously, with no fitted
      parameter and no sampling error.
    - >-
      The synthesis is a real negative result and should be presented as one. Generic-
      fibre arithmetic statistics and factor-base relation statistics are different
      objects: the first are the same for every curve (Theorem A) and the second live on
      a locus where the first are constant (Theorem C). Combined with conservation
      (KN-FIND-007) fixing mean yield, the design space narrows to coverage,
      multiplicity, relation rank, recognizability and solve cost.
    - >-
      The one thing a reader will suspect must be pre-empted in the paper, not the
      ledger. Complete splitting on the factor-base locus LOOKS like it trivializes
      relation search. It does not: it solves for the last coordinate given the other
      m-1, whereas relation search fixes the target and searches for the others. Section
      5.1 of the manuscript says this explicitly, and identifies the operational content
      as the standard "solve for the last variable" step.

