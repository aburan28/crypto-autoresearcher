  decided_at: '2026-08-07'

  context: >-
    The user directed a synthesis: combine the decomposition-yield conservation identity
    (KN-FIND-007), the m=3 discriminant identity and factor-base splitting observation
    (KN-FIND-c41ea9), and the all-m monodromy claim (KN-FIND-a1f3c2) into a single
    mathematical-cryptography manuscript, and bring the all-m theorem to submission
