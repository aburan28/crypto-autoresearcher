coordinator_decision:
  id: DEC-20260830-1fb2e3
  context: >-
    This Coordinator decision composes the independent Validator (J1) and
    Red Team (J2, J3) reviews of EXP-MONO-4c7479's execution: an exhaustive,
    toy-scale (p in {101,211}), dual-arm census testing H-MONO-0b3def's
    claim that the m=3 symmetric-base Semaev cover has geometric/arithmetic
    monodromy exactly D_4 = Z/2 wr S_2, uniformly in the curve, with an
    empty exceptional locus. It also resolves a stale-comparison artifact
    in the Executor's own reporting (DEV-1) and discloses a governance
    finding (a second and third out-of-band edit by the external identity
    "Cursor Agent" to a frozen, approved contract, this time mid-execution).
  decision: support
  decision_label: >-
    core_D4_claim_supported_toy_scale_HEUR_WREATH_3_falsified_scoped
  target_ids:
    - H-MONO-0b3def
    - EXP-MONO-4c7479
    - RQ-MONO-001
    - EV-MONO-7c216b
    - CORR-20260830-938af0
    - CORR-20260830-778068
    - IDEA-20260830-1a08f9
    - KN-FIND-a8990a
  rationale:
    - >-
      CORE CLAIM SUPPORTED, TOY SCALE. Stage 0 passed (exact symbolic
      identities, independently re-derived by the Validator). P1=0, P2=8,
      P3=1.000 exactly at every one of 6 (p,A,B) cells across ~164,000
      base points, independently reproduced with fresh code by the
      Validator over two full cells with zero mismatches. The random-
      quartic null control passed, licensing interpretation. Arm
      independence and the F_p^4 arithmetic the inert-regime 4-cycle
      realization requires were both independently verified correct by
      the Validator (including explicit construction and rejection of the
      plausible "F_p^2-conjugation substituted for genuine F_p^4
      Frobenius" bug). This is strong, toy-scale corroboration of
      H-MONO-0b3def's central claim (a)-(c): D_4 containment, uniform
      realization of all 8 permutations (empty exceptional locus, matching
      STEP 5's derivation-based prediction rather than merely failing to
      contradict it), and the per-instance S6 recipe.
    - >-
      DEV-1 (ORDERED-BASE CONTROL) RESOLVED, NOT A FALSIFIER. The
      Executor's own report flagged the control as failing to match the
      contract's forced value. Independent git forensics (this
      Coordinator, corroborated by the Validator's Finding F1) establish
      the Executor's run was built against specification text (post an
      undisclosed prior out-of-band edit, commit 5f0d0dec1) that already
      states the CORRECT forced value ("0 four-cycles, types in
      {1^4,2.1.1,2^2}") -- which the observed data satisfies exactly at
      every cell. The Executor's `matches_forced_value: false` compared
      against a superseded wording, most likely inherited unchanged from
      this Coordinator's own handoff (authored before the correction
      landed). Separately and independently, the Red Team re-derived from
      pure group theory that {1^4,2.1.1,2^2} IS the mathematically correct
      realizable set over the strict ordered base (Theorem B's "two-type"
      law governs a coarser, order-2 quotient object -- the degree-2
      T-polynomial's root pair -- not this finer, order-4, four-labelled-
      point object), and traced the original mis-citation to
      IDEA-20260830-1a08f9's own S5 section. This is now a corrected
      understanding recorded in EV-MONO-7c216b and CORR-20260830-938af0,
      not an open question.
    - >-
      HEUR-WREATH-3 FALSIFIED, SCOPED. The identity and sigma1_sigma2
      class densities deviated from their forced 1/8 values by up to
      ~10.2 binomial standard errors at 5 of 6 cells. The Red Team derived
      analytically (not merely observed) that this is a genuine,
      deterministic, curve-Frobenius-trace-driven effect of order
      p^{-1/2} (not the O(1/p) HEUR-WREATH-3 claims), verified sign- and
      magnitude-consistent (within 15-30%) against all 6 cells from
      independently computed curve traces. This falsifies HEUR-WREATH-3
      and triggers H-MONO-0b3def's own falsification_conditions item 5
      exactly as pre-registered. It does NOT touch D_4 containment, the
      exceptional-locus/all-8-permutations claim, the per-instance recipe,
      or the other three class densities (which are built from
      trace-cancelling combinations and correctly held within band) --
      the Red Team's derivation explains precisely why those three hold
      and these two do not, which is itself corroborating evidence that
      the mechanism is understood rather than merely observed.
    - >-
      DISPOSITION. H-MONO-0b3def's status moves to `supported`, SCOPED
      EXACTLY to: m=3, p in {101,211}, the 6 generic-ordinary curve cells
      tested, and claim components (a)-(c) (D_4 containment, uniform
      realization, per-instance recipe). This is a toy-scale corroboration
      of an already-argued derivation (STEP 1-5), not a new proof, and the
      hypothesis's own interpretation_limits (no ECDLP claim, no m>=4
      claim, no relation-rate claim) remain fully in force and unchanged.
      HEUR-WREATH-3 is separately marked `falsified_scoped` within
      H-MONO-0b3def's own heuristic_assumptions accounting (see the
      companion goal.yaml-independent hypothesis-field update below);
      HEUR-WREATH-1 and HEUR-WREATH-2 are UNCHANGED by this batch (this
      batch's scope did not stress-test them beyond what was already
      recorded).
    - >-
      GOVERNANCE FINDING RECORDED, NOT SILENTLY ABSORBED. Two out-of-band
      commits by "Cursor Agent <cursoragent@cursor.com>" (5f0d0dec1,
      a1269ac26) edited this frozen, approved contract during its
      execution window, without a task/decision reference or a versioned
      protocol_amendment -- the third such incident by this identity found
      in this session (the first, unrelated, is CORR-20260830-778068 under
      GOAL-ENDO-001). This Coordinator's own initial disclosure of this in
      the snapshot receipt was itself incomplete and factually wrong about
      which edit the Executor's run actually reflected; corrected in
      CORR-20260830-938af0. Both edits' mathematical content is
      independently verified correct by the Validator and Red Team's own
      from-scratch derivations, so the run's scientific validity is
      unaffected. This pattern (three out-of-band edits by one external
      identity across two unrelated goals in one session) is disclosed
      here as an operational fact for the user's attention, separate from
      and not diminishing the scientific finding above.
  evidence_refs:
    - EV-MONO-7c216b
    - experiments/EXP-MONO-4c7479/execution_report.yaml
    - experiments/EXP-MONO-4c7479/reviews/validator/validation-report.yaml
    - experiments/EXP-MONO-4c7479/reviews/red-team/red-team-report.yaml
    - coordination/tasks/TASK-20260830-8c214e/snapshot-receipt.json
    - CORR-20260830-938af0
    - knowledge/findings/KN-FIND-a8990a.md
  official_status_changes:
    goal_status_changed: false
    goal_status_after: paused
    hypothesis_status_changes:
      - hypothesis_id: H-MONO-0b3def
        prior_status: proposed
        new_status: supported
        scope: >-
          Scoped exactly to claim components (a)-(c) at m=3, p in
          {101,211}, the 6 tested generic-ordinary curve cells. Not a
          claim at any other scale, m-value, or curve class.
      - hypothesis_id: H-MONO-0b3def
        field: heuristic_assumptions[HEUR-WREATH-3].status
        prior_status: unvalidated
        new_status: falsified_scoped
        scope: >-
          Falsified for the identity and sigma1_sigma2 class densities at
          m=3, p in {101,211}; a mechanistic O(p^{-1/2}) cause is
          identified (curve-Frobenius-trace dependence of S(S-1) and
          N(N-1) individually). HEUR-WREATH-1 and HEUR-WREATH-2 unchanged.
    experiment_status_changes:
      - experiment_id: EXP-MONO-4c7479
        prior_status: approved
        new_status: completed
    resource_disposition_changed: false
    completion_criteria_met: []
    completion_criteria_note: >-
      RQ-MONO-001 and GOAL-MONO-001 are not closed or advanced by this
      decision; it resolves one hypothesis at toy scale only.
    implementation_authorized: false
    experiment_runs_authorized: 0
    scientific_interpretation_authorized: true
    scientific_interpretation_scope: >-
      Exactly the scoped support/falsification stated above; no ECDLP,
      relation-rate, or m>=4 claim.
    closure_authorized: false
    breakthrough_authorized: false
  disclosed_open_items:
    - id: OUT-OF-BAND-EDIT-PATTERN
      description: >-
        Three out-of-band edits by the git identity "Cursor Agent
        <cursoragent@cursor.com>" to frozen/approved artifacts found in
        this session, across two unrelated goals (GOAL-ENDO-001's
        predecessor drift; EXP-MONO-4c7479's specification, twice). All
        three edits' content was independently verified correct; none was
        reverted. No task/decision reference accompanies any of the three.
      carried_forward_to: >-
        User attention; a broader citation/edit-integrity sweep of this
        identity's other commits across the repository is a reasonable
        future action not performed here.
      does_not_block: >-
        nothing scientific; the evidence and decision above stand on
        independently re-derived, verified grounds regardless of this
        pattern's cause.
    - id: HEUR-WREATH-3-SUCCESSOR
      description: >-
        HEUR-WREATH-3 as originally stated (O(1/p) for all five class
        densities) is falsified; a corrected statement (O(1/p) for the
        three trace-cancelling classes, O(p^{-1/2}) via curve trace for
        the two others) is now understood mechanistically but not yet
        recorded as its own successor heuristic record.
      carried_forward_to: >-
        A future batch or knowledge-curation task should record the
        corrected HEUR-WREATH-3 statement, citing this decision and
        EV-MONO-7c216b, rather than leaving the correction only in
        evidence-record prose.
      does_not_block: the core D_4 claim's supported status
  procedure_deviations: []
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Pending: this toy-scale corroboration plus scoped heuristic
      falsification is a reasonable KN-FIND candidate (the D_4 group-
      theory derivation, the Theorem-B-quotient correction, and the
      curve-trace density-bias mechanism are each independently citable
