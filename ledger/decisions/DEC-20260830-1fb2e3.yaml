      pass rather than authored inline here, per this decision's own
      budget and scope.
  limitations:
    - >-
      Toy scale only (p in {101,211}, m=3, 6 generic-ordinary cells). No
      claim about cryptographic-scale p, m>=4, or other curve classes.
    - >-
      The J3 falsification is analytically derived and checked against 6
      data points, not fit across a genuine multi-point p-ladder (Stage 2
      at p=1009 remains out of scope and future work).
    - >-
      Both reviewers disclose an unresolved model-identity discrepancy
      (self-reported claude-sonnet-5 vs. this environment's static
      adapter resolution of anthropic:claude-opus-5 for review-
      adversarial/xhigh), neither probe-verified. Not resolved by this
      decision.
