    max_concurrent 1).
  status_transitions:
  - record: EXP-SEMBIN-24ec56
    to: approved
    approved_by: coordinator
  - record: EXP-SEMBIN-d9767f
    note: execution superseded by EXP-SEMBIN-24ec56; the specification keeps its bytes and status
  rationale:
  - One-cell trials make an interruption cost one cell, not a six-cell trial, and let every cell carry a watchdog
    sized to it.
  - Each one-cell trial carries its parent trial's seed, and run.py draws a cell's curves, V and targets from that
    seed alone, so the instances equal the parent plan's.
  - The success and falsification criteria now count only cells that no pilot and no interrupted run measured, which
    the prediction-provenance rule of docs/confound-control.md requires and which no threshold change accompanies.
  - The regime ratio log2(columns / z-free solutions) that leads-pilot4 found shared by every toy cell is recorded
    as a measured factor, so a toy refutation rate is not read across the regime change.
  evidence_refs: []
  limitations:
  - Toy scale (n <= 15, m <= 5); nothing about n = 131 or any deployed curve.
  - About 115 CPU hours expected; the run is kept inside an active session because idle containers restart.
  - Cells at >= 124,314 columns are probable censoring cells under the 6 GB cap; a censored cell is never negative.
  - check.py is producer-written; independent review precedes any status move.
