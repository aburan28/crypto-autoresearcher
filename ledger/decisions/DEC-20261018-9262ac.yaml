  context: 'EXP-SEMBIN-d9767f (approved by DEC-20261017-3fa9e1) lost its first trial RUN-SEMBIN-07f442 to a container
    restart at about 06:02 UTC on 2026-10-18, after about 9.7 h and with no execution receipt. Its frozen runbook
    step (14 h) and trial watchdogs (10 h) could not cover its own protocol in any case: the m=3 n=13 poly cell
    alone ran more than 8.6 h. The user chose reconciliation by one-cell trials (''do all options, especially 2'').
    This record approves the successor EXP-SEMBIN-24ec56, which runs the parent''s 36 cells as 36 one-cell trials
    with the parent seeds, and records the parent''s reconciliation.'
  decision: approve
  decision_scope: 'APPROVES EXP-SEMBIN-24ec56 at version 1 (36 one-cell trials, RUN-SEMBIN-024883..RUN-SEMBIN-fa6a48
    as listed under execution_dispatch) and authorizes execution through experiments/EXP-SEMBIN-24ec56/runbook.yaml
    (session RBS-SEMBIN-24ec56) under TASK-20261018-944ddb in lane BATCH-821a5d of GOAL-SEMBIN-5078bc. RECONCILES
    EXP-SEMBIN-d9767f: RUN-SEMBIN-07f442 and session RBS-SEMBIN-d9767f are preserved as an interrupted, non-evidence
    attempt; TASK-20261017-4ad232 and TASK-20261017-c6574f are cancelled; the amendment is experiments/EXP-SEMBIN-d9767f/amendments/AMD-EXP-SEMBIN-d9767f-20261018-successor.yaml.
    H-SEMBIN-106967 stays approved (pre-run). Asserts nothing about any hypothesis; authorizes no run outside the
    frozen plan.'
