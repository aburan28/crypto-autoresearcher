coordinator_decision:
  id: DEC-20260904-c42007
  context: >-
    GOAL-SCURVE-137bd9 (certificate-bearing SafeCurves parameter audit, NIST
    P-224) carries exactly one authorized next action, and this decision is it.
    BATCH-ef5b1e is closed. Its producer TASK-20260824-53ecc0 delivered a
    sourced parameter capsule, a falsifiable prioritized audit plan and a task
    report; TASK-20260824-4af491 snapshot-archived them at commit
    5c3bfe273070e0537a21ae5491fb028b7e5efa1e, content-verified. No task in that
    batch remains dispatchable and NO criterion cell has been adjudicated for
    P-224 or any other curve. The goal's next_action makes one thing a
    prerequisite of any successor batch decision -- a record of whether THIS
    environment can supply the execution capability the archived plan assumes,
    because that batch's producer had no shell, performed no arithmetic, and
    therefore left every numeric relation in the dossier as a transcription
    plus a pending check. That prerequisite is now discharged by demonstration
    rather than by assertion (see capability_prerequisite below), and both
    halves of the plan -- the stdlib measurement lanes and the blocking L0
    retrieval gate -- are shown executable in this runtime. This decision
    therefore rules on the single question the goal poses, namely whether to
    open a successor batch executing the archived plan's own first-ranked lane.

  decision: approve

  what_is_approved: >-
    OPENING BATCH-a40709 UNDER GOAL-SCURVE-137bd9, designed at
    coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/batch.yaml and
    scoped to the archived audit plan's own execution_order ranks 1 through 6 --
    L0 (the blocking criterion-definition gate), then L-EQ, L-FIELD, L-BASE,
    then the five near-free lanes L-BASE unlocks (L-LADDER, L-COMPLETE, L-IND,
    D3, D6), then L-RHO -- plus one gated comparison step and one independent
    claim-changing review round. The L0 carve-out is honoured exactly as the
    plan states it, and it is the load-bearing structural fact of the design.
    L0 is BLOCKING for COMPARISON only; measurement lanes MAY run before L0
    closes. The batch therefore runs L0 retrieval and the stdlib measurement
    lanes CONCURRENTLY and gates only the step that compares a measured
    quantity against a retrieved threshold.

  what_is_NOT_approved: >-
    NO EXPERIMENT CONTRACT IS APPROVED BY THIS DECISION AND NO RUN IS
    AUTHORIZED BY IT. The archived audit plan is a plan, not a frozen contract,
    and its own producer said so. The batch's first in-queue task authors a
    frozen experiment contract under an EXP identifier this session did not
    mint; approving that contract is a separate committed Coordinator decision
    and that gate is unchanged. This decision also approves no hypothesis
    status change (this goal has no hypothesis), no evidence record, no claim,
    and no criterion verdict of any kind.

  target_ids:
  - GOAL-SCURVE-137bd9
  - RQ-SCURVE-960dbd
  - BATCH-a40709
  - BATCH-ef5b1e
  - TASK-20260824-53ecc0
  - TASK-20260824-4af491

  capability_prerequisite:
    status: DISCHARGED BY DEMONSTRATION, NOT BY ASSERTION
    what_the_goal_required: >-
      The goal's next_action requires this decision to first record whether
      this environment can supply the execution capability the archived plan
      assumes. It does not require, and this decision does not claim, anything
      about the mathematics.
    who_measured_it: >-
      The orchestrating session, not this Coordinator subagent. This subagent
      has NO shell and NO command-execution tool -- it ran no arithmetic, no
      fetch, no git command and no tool in this repository. It is reading the
      committed capsule, the committed audit plan, the committed goal record
      and the finding at
      coordination/remediation/FINDING-20260904-scurve-execution-capability.md,
      and nothing else. Every capability statement below is a report of that
      finding, cited, not a measurement of my own.
    half_one_stdlib_arithmetic:
      demonstrated_on: NIST P-224, against the committed parameter capsule
      what_ran: >-
        Python integer arithmetic only -- no PARI, no gp, no cypari, no Sage,
        no network. The finding records that p equals 2^224 - 2^96 + 1; that p
        and n are probable prime under Miller-Rabin with 64 seeded rounds; that
        p mod 4 is 1, which the capsule had explicitly marked as still to be
        machine-checked in L-FIELD; that a equals p - 3; that G satisfies the
        curve equation mod p; that n times G is the point at infinity while
        (n-1) times G is finite, so the order of G is exactly n; the exact
        trace of Frobenius with Hasse holding; the twist order in both of its
        forms, agreeing, odd, with small factors below 200000 being 3^2 times
        11 times 47; that t^2 - 4p is negative; and that no k at most 100
        satisfies p^k congruent 1 mod n.
      what_it_establishes: >-
        THAT THE CAPABILITY EXISTS IN THIS RUNTIME, and that every
        transcription in the committed capsule which those checks can reach is
        correct. Arbitrary-precision integer arithmetic, the affine
        elliptic-curve group law, probabilistic primality testing and the
        Hasse, twist, discriminant and embedding derivations all ran here.
    half_two_network_retrieval_for_L0:
      demonstrated_on: the ten retrieval targets L0 names
      what_ran: >-
        All ten of L0's named targets returned HTTP 200 from this runtime --
        the index plus rho, transfer, disc, rigid, ladder, twist, complete, ind
        and verify. The index is 35670 bytes and carries the P-224 row.
      what_it_establishes: >-
        THAT L0'S STATED BLOCKER DOES NOT HOLD HERE. The producer of
        BATCH-ef5b1e recorded HTTP 502 on every attempt and a runtime refusal
        of archive.org; that was a true operational observation about ITS
        session and is not true of this one. The comparison step is therefore
        unblockable in principle, which is what makes a successor batch worth
        opening rather than merely worth wanting.
    what_this_does_NOT_establish:
    - >-
      PRIMALITY IS PROBABILISTIC. Miller-Rabin with 64 seeded rounds is
      overwhelming evidence and is not a proof. A primality CERTIFICATE (ECPP
      or Pocklington) for p or for n is OPEN AND UNATTEMPTED, is not in
      BATCH-a40709's scope, and is named there as separately provisioned.
    - >-
      PROVENANCE IS UNTOUCHED. The checks were internal consistency plus
      arithmetic against the committed capsule. Nobody re-retrieved the
      parameters from a primary source, so nothing says the capsule transcribed
      the right curve. The tuple still rests on RFC 5114 Section 2.5 (an
      authoritative restatement) plus one aggregator, and the primary clauses
      (FIPS 186-4 Appendix D.1.2.2, NIST SP 800-186, SEC 2 Section 2.5) were
      fetched but unreadable in the producer's container. OPEN AND UNATTEMPTED
      in this batch, named as separately provisioned.
    - >-
      THE EMBEDDING DEGREE IS ONLY BOUNDED AWAY FROM k AT MOST 100, NOT
      COMPUTED. The exact value needs the factorisation of n - 1. OPEN AND
      UNATTEMPTED.
    - >-
      TWIST SECURITY IS NOT ADJUDICATED. The small factors reported are
      reported as measured; the 64-digit cofactor is unfactored. OPEN AND
      UNATTEMPTED.
    - >-
      L0 IS NOT CLOSED. Reachability was probed. The eleven criterion
      definitions and their thresholds were NOT retrieved, NOT transcribed and
      NOT recorded. That is L0's actual deliverable and it belongs to a
      dispatched task with a declared write scope, which is rank 1 of the batch
      approved here. OPEN AND UNATTEMPTED.
    - >-
      NO CRITERION CELL IS ADJUDICATED, for P-224 or for any other curve.
      Nothing in the finding compares a measured quantity to a threshold, and
      the arithmetic half deliberately did not either.
    - >-
      NINETEEN OTHER SAFECURVES GOALS ARE UNCHECKED. The capability finding
      generalises to the environment; the RESULTS generalise to nothing, and
      this decision binds only GOAL-SCURVE-137bd9.
    per_session_caveat: >-
      CAPABILITY AND REACHABILITY ARE PER-SESSION, NOT PER-REPOSITORY, AND THE
      DESIGN TREATS THEM THAT WAY. Earlier on 2026-09-04, in GOAL-ECRANK-002
      BATCH-e0caa5, two producer tasks in ONE batch reported different
      toolchains -- one with cypari 2.5.6 and PARI 2.15.4, one with no gp, no
      cypari, no cypari2 and no Sage -- and the second could not attempt half
      its protocol. An HTTP 200 here is likewise not a promise to a later
      session. Pure-Python arithmetic needs no external library and is the safe
      assumption; anything needing PARI or the network is not. Every task in
      BATCH-a40709 therefore DECLARES whether it needs the network and whether
      it needs PARI, and the batch requires those declarations to be CHECKED AT
      DISPATCH rather than discovered mid-run. A missing capability halts that
      task as an impediment on a still-active goal; it is never a negative
      result about any curve.

  budget_examination:
    examined: true
    maximum_batches: >-
      null, i.e. UNBOUNDED, set by BUDGET-AMEND-20260828-750d51 on the user's
      explicit 2026-08-28 instruction to fund every goal (scope confirmed as
      all 47 active goals), recorded in DEC-20260828-750d51. The prior finite
      value of 5 is superseded.
    total_wall_clock_seconds: >-
      null, i.e. UNBOUNDED, by the same amendment; the prior value of 18000 is
      superseded, not spent.
    consequence: >-
      THE BUDGET IS NOT AN OBSTACLE TO OPENING THIS BATCH AND IS SAID SO
      EXPLICITLY RATHER THAN LEFT UNEXAMINED. No budget amendment is required
      to admit BATCH-a40709 and none is requested. Note that the archived audit
      plan's own prose still reasons against an 18000 s campaign ceiling (for
      example D5's deferral of the class number); that ceiling no longer binds,
      and the deferrals it justified are re-justified here on capability and
      ranking grounds instead, not carried over unexamined.
    what_unlimited_does_not_buy: >-
      UNLIMITED REMOVES THE BATCH CEILING, NOT THE DUTY TO RANK. Never dispatch
      a task that cannot be ranked ahead of doing nothing. This batch is ranked
      by the archived plan's own execution_order, which orders lanes by
      information gained per second with the blocking gate first and the two
      budget-dominating factorisations last, and BATCH-a40709 admits ranks 1
      through 6 and stops. max_concurrent stays at the goal head's committed
      value of 2; it is machine headroom, not a research budget, and is not
      raised here.

  rationale:
  - >-
    THE ONE PREREQUISITE THE GOAL NAMED IS DISCHARGED, AND IT WAS DISCHARGED
    THE WAY THE GOAL ASKED -- by recording whether the environment can supply
    the capability, with a worked demonstration behind the record rather than a
    claim. Both halves are shown: stdlib arithmetic for the measurement lanes
    and network retrieval for the L0 gate. A successor batch scoped to those
    two halves has no KNOWN blocker in this runtime, and saying so is the whole
    content of the prerequisite.
  - >-
    THE L0 CARVE-OUT MAKES A CONCURRENT BATCH CORRECT RATHER THAN MERELY
    CONVENIENT. The plan states that L0 is blocking -- no lane may be compared
    against any intake cell until L0 closes -- and in the same breath that
    measurement lanes MAY run before L0 and that only the COMPARISON step is
    gated. Designing the batch to run retrieval and measurement concurrently
    and to gate exactly one downstream task is therefore executing the plan as
    written, not relaxing it. It is also what makes the batch informative if L0
    fails at dispatch-time reachability -- the measurement half still returns
    certified quantities, and the shortfall is reported as the plan's own
    honest_limitation says it must be, as unmet completion criterion 4 and
    never disguised.
  - >-
    THE CHEAPEST VALID DISCRIMINATOR IS ADMITTED FIRST, WHICH IS THE PLAN'S OWN
    JUDGEMENT AND I AGREE WITH IT. L-EQ decides in milliseconds whether the
    tuple being audited is the tuple the retrieved sources specify. The one
    open reconciliation in the committed capsule -- the intake decimal for b
    against the retrieved hex -- is exactly this, and the capsule is explicit
    that its mod-9, mod-11 and magnitude agreement PROVES NOTHING. If that
    equality fails, the goal has been auditing a different curve than it thinks
    and every later lane is void; discovering that before any expensive work is
    the point of ranking it second.
  - >-
    THE RANK-5 BLOCK IS NEAR-FREE ON THE TARGET AND IS NOT NEAR-FREE ON ITS
    CONTROLS, AND THE BATCH SAYS SO RATHER THAN INHERITING THE PLAN'S
    SHORTHAND. Once L-BASE certifies the group order, L-LADDER, L-COMPLETE,
    L-IND, D3 and D6 convert one certified integer into five criterion
    measurements at negligible cost. Their CONTROLS are the real spend --
    retrieved positive-control curves that must actually exhibit a Montgomery
    or Edwards model on the identical code path, and same-shape null families
    at reduced field size whose reachability rates must be non-degenerate. The
    plan is emphatic that a checker reporting zero percent on the null is
    broken, and a batch that funded the target lanes but not their controls
    would be buying five measurements no reader should believe.
  - >-
    RANKS 7 THROUGH 11 ARE RANKED NEXT, NOT DEPRIORITIZED, AND EACH HAS A
    NAMED, CONCRETE ROUTE. L-TRANSFER (rank 7) is a bounded 10^6-multiplication
    pass that this runtime can serve, and it is held to the head of the
    successor queue rather than admitted here because it carries its own
    mandatory planted-positive instrument and a falsifier that routes to
    independent review-breakthrough scrutiny before any statement leaves this
    repository. L-RIGID and D8 (rank 8) are blocked on a retrieval this runtime
    has NOT been shown to serve -- PDF text extraction for the FIPS 186 and
    X9.62 generation procedure. L-DISC, D5, L-TWIST, D1 and D2 (ranks 9 and 10)
    are factorisation lanes and are placed outside a batch scoped to
    demonstrated capability. D7 (rank 11) is independent of everything and
    blocks nothing. None of this is a closure and nothing is declared
    impossible; every item is carried in the batch record as OPEN AND
    UNATTEMPTED with the capability it waits on named.
  - >-
    ADJUDICATION IS A CLAIM-CHANGING STEP AND IS TREATED AS ONE. The goal has
    gone through a whole batch with no criterion cell adjudicated, and the
    temptation on unblocking L0 is to let the measuring task also render the
    verdicts. The batch separates them -- measurement tasks may not compare,
    one gated task compares, and its dossier goes to an independent
    review-adversarial validator and red team at xhigh in independent sessions,
    sibling-blind, under a review plan written after the snapshot and before
    either reviewer runs. The Coordinator's prior is recorded at opening, in
    the batch record, so that a review overturning it is legible as a result
    rather than absorbed.
  - >-
    THREE DESIGN DEFECTS FOUND ELSEWHERE ON 2026-09-04 ARE DESIGNED AGAINST
    RATHER THAN REDISCOVERED. Every non-archive task in BATCH-a40709 is
    assigned exactly once to an IN-QUEUE archive task, because a batch whose
    archive is only a ledger commit is not representable in dispatch_queue.v1
    and is therefore undispatchable -- the defect recorded for GOAL-PATH-001
    BATCH-002 in
    coordination/remediation/FINDING-20260904-path-001-batch-002-undispatchable.md.
    No snapshot archive's depends_on names a reader of what it archives, which
    is why the batch carries several small archives instead of one large one.
    Every task carries a non-null wall-clock and memory budget, declares
    whether it needs the network and whether it needs PARI, and declares any
    pre-read seal in its artifact paths.
  - >-
    DIRECTION BIAS IS HONOURED WITHOUT PRETENDING TO IT. The canonical target
    profile asks for exponent-moving results on central hard problems. THIS
    BATCH MOVES NO EXPONENT AND CLAIMS NONE, and the archived plan says the
    same of itself in its own target_complexity block. What the profile does
    bind here is scope and cost honesty, and the batch is written to that. If
    any later batch under this goal proposes an asymptotic claim, all four
    promotion gates in agents/coordinator.md apply before it may move toward
    supported, and nothing here approaches them.

  evidence_refs:
  - >-
    ledger/goals/GOAL-SCURVE-137bd9/goal.yaml -- read in full; source of the
    commissioning next_action, the intake block, the completion criteria, the
    pause conditions, the standing always-run directive and the budget
    amendment.
  - >-
    coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-ef5b1e/tasks/TASK-20260824-53ecc0/audit-plan.yaml
    -- read in full; source of gate L0 and its blocking scope, the control
    bank, the eleven lanes, the eight diagnostics, the four numbered heuristics
    H1 to H4, and the execution_order ranking this batch executes.
  - >-
    coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-ef5b1e/tasks/TASK-20260824-53ecc0/parameter-capsule.yaml
    -- read in full; source of the retrieved tuple with per-field provenance,
    the retrieval log including its failures, the four open reconciliations and
    the explicit statement that the producer had no arbitrary-precision
    arithmetic tool.
  - >-
    coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-ef5b1e/tasks/TASK-20260824-53ecc0/task-report.yaml
    -- read in part; source of the proposed successor handoffs S1 through S5
    and of the open items OPEN-2 and OPEN-3.
  - >-
    coordination/remediation/FINDING-20260904-scurve-execution-capability.md --
    read in full INCLUDING its addendum; the sole basis for every capability
    statement in this decision, and the record that both establishes the two
    halves and enumerates what they do not establish.
  - >-
    coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-ef5b1e/batch.yaml and
    .../dispatch_queue.json -- read in full; source of the closed batch's shape
    and of the content-first archive binding at commit 5c3bfe273070.
  - >-
    coordination/remediation/FINDING-20260904-path-001-batch-002-undispatchable.md
    -- read in full; source of the in-queue archive-assignment constraint the
    batch design obeys.
  - >-
    ledger/decisions/DEC-20260828-750d51.yaml is cited by identifier via the
    goal head's budget_amendments block, which reproduces the authorization and
    the arithmetic; the decision file itself was not opened by this session.
  - >-
    NO EXPERIMENTAL EVIDENCE IS CITED BECAUSE NONE EXISTS UNDER THIS GOAL. No
    run record, no evidence record and no adjudicated criterion cell exists for
    NIST P-224 in this program. This is a batch-opening decision, not an
    evidence review.

  limitations:
  - >-
    ASSERTS NOTHING ABOUT WHETHER ANY CURVE IS SAFE OR UNSAFE. Arithmetic
    verification of a published parameter set is a TRANSCRIPTION CHECK, not a
    security evaluation. No criterion verdict is available to this decision, no
    cell is adjudicated by it, and no statement about NIST P-224's security,
    vulnerability, or freedom from vulnerability is made or implied.
  - >-
    THE CAPABILITY FINDING IS AN OBSERVATION ABOUT A SESSION, NOT A GUARANTEE.
    It was measured once, in one session, on one curve, and both the arithmetic
    and the reachability halves may differ in the session that runs
    BATCH-a40709. That is precisely why the batch requires per-task capability
    declarations checked at dispatch.
  - >-
    EVERY QUANTITY THE FINDING REPORTS IS A PROBABLE-PRIME-GRADE OR
    BOUNDED-GRADE RESULT WHERE IT SAYS SO. Nothing in this decision upgrades
    probable primality to primality, a bound on the embedding degree to a
    value, or partially factored small divisors to a factorisation.
  - >-
    THE PARAMETER TUPLE'S PRIMARY-SOURCE PROVENANCE REMAINS UNMET. Goal
    completion criterion 1 is met only in its authoritative reading, not its
    primary reading, and this decision does not change that; it names the gap
    as separately provisioned work.
  - >-
    THIS SUBAGENT HAS NO SHELL. It ran no arithmetic, no retrieval, no
    identifier allocation, no ledger validation and no git command, and it
    records none of those as having been run. Both identifiers used here were
    minted and verified free by the driving session before dispatch. Every
    clock value, commit sha, digest and path hash in both deliverables is null
    with its reason named; see provenance.unfilled_values_and_who_owes_them.
  - >-
    NOTHING HERE IS DURABLE RESEARCH STATE UNTIL COMMITTED, PUSHED AND
    ACCEPTED BY THE POST-COMMIT VERIFIER, AND THIS SESSION PERFORMED NONE OF
    THOSE. A record that exists only in a working tree or a local commit is
    unpublished, not evidence.
  - >-
    THE BATCH DESIGN IS A DESIGN, NOT A QUEUE. No dispatch queue, no task card
    and no handoff record is written by this decision, and no TASK, EXP or EV
    identifier is minted by it. A successor mints those and must re-check the
    design against the dispatcher before treating any slot as dispatchable.

  next_actions:
  - >-
    ONE NEXT ACTION FOR GOAL-SCURVE-137bd9, AND IT IS THE DRIVING SESSION'S --
    merge origin/main into the working branch (MERGE, NEVER REBASE), commit
    this decision together with
    coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/batch.yaml as an
    isolated ledger archive staging only those two declared paths, push, and
    open or refresh a PR against main naming DEC-20260904-c42007 and
    BATCH-a40709. A sync conflict inside an immutable record is never resolved
    by editing it -- it is a new superseding record under a new id.
  - >-
    THEN, AND ONLY AFTER THAT COMMIT IS VERIFIED -- mint the fourteen task
    identifiers the batch design names (python3 tools/allocate_id.py --next
    task --date YYYYMMDD --check, once per slot) plus one EXP identifier for
    the frozen contract, author the opening control plane as batch slot S0,
    render the dispatch queue, and REJECT the queue if any non-archive task is
    not assigned exactly once to an in-queue archive task.
  - >-
    BEFORE DISPATCHING SLOT S2 -- run the batch's declared dispatch-time
    capability checks and record their outcomes in the task receipt. A failed
    reachability check halts S2 as an impediment on a still-active goal and
    leaves the measurement lanes dispatchable; it is never a negative result
    and never licenses substituting a remembered threshold for a retrieved one.
  - >-
    NOT NOW, AND NAMED SO IT IS NOT LOST -- L-TRANSFER (rank 7) heads the
    successor batch's queue. L-RIGID and D8, the primary-clause reconciliation,
    the primality certificates, L-DISC with D5, L-TWIST with D1 and D2, D7 and
    the three-size H3 drift study are each OPEN AND UNATTEMPTED, are carried in
    BATCH-a40709's out_of_scope block with the capability each waits on, and
    are not closed, screened, tried or ruled out by this decision.

  goal_status_transition:
    from: active
    to: active
    changed: false
    reason: >-
      This decision opens a batch. No completion criterion is met or
      approached, no pause condition fires, and paused and blocked are not
      permitted statuses in any case. No completion_quorum block is created and
      NO ATTESTATION IS RECORDED, because none was obtained. The goal head's
      current_batch_id and dispatch_queue_path pointers, and its single
      next_action, are updated by the batch's own tasks as the batch record
      specifies -- not by this decision, which writes no goal record.

  hypothesis_status_transition:
    hypothesis_id: null
    hypothesis_id_note: >-
      GOAL-SCURVE-137bd9 has no hypothesis and this decision creates none.
      Retrieving criterion definitions and certifying arithmetic facts about a
      published parameter set are not hypothesis-testing acts about any
      mathematical object, and naming a hypothesis here would invite exactly
      the inference the work cannot support.
    changed: false

  claim_ceiling: >-
    analyzed AT BEST, NEVER supported, for every record BATCH-a40709 produces.
    No asymptotic-complexity claim is proposed, so the four promotion gates are
    not engaged and are certainly not met. An adjudicated criterion cell is a
    claim about a RETRIEVED DEFINITION and a MEASURED QUANTITY, scoped to both;
    agreement with an intake cell reproduces a preregistered comparison target
    and confirms no authority.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      THIS IS NOT AN EVIDENCE-REVIEW DECISION AND THERE IS NOTHING DURABLE TO
      PROMOTE. No run exists under this goal, no evidence record exists, no
      evidence strength has been assessed, and no criterion cell is
      adjudicated. The capability finding it rests on is an operational
      observation about one session, which AGENTS.md rule 3 forbids treating as
      a research result, so it is not a KN-FIND candidate either. The
      knowledge-promotion question is answered at the batch close, where a
      closed L0 plus certified rank-2-to-6 measurements would warrant a KN-FIND
      entry recording the per-cell certificate formats and the definition-
      sensitivity of the ladder, complete and ind criteria -- because those
      recur for every one of the twenty SafeCurves goals and for any later
      per-curve audit this program runs.

