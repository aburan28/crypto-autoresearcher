coordinator_decision:
  id: DEC-20260803-a5b9b1
  context: >-
    GOAL-MCE-001 BATCH-001 close. Two producers transcribed primary sources;
    two independent sessions reviewed the snapshot-committed packages.
    Validator TASK-20260803-409c5e: ADMIT_WITH_QUALIFICATIONS. Red team
    TASK-20260803-08e883: PARTIALLY UPHELD, with its objections aimed at the
    Coordinator's framing rather than at either producer.

    Both producer packages are admitted. Both reviews independently found the
    same defect in this goal's own committed records. This decision records
    the retractions rather than dropping them.
  decision: refine
  target_ids: [GOAL-MCE-001, RQ-MCE-e65b3c, EV-MCE-332f99]
  rationale:
    - id: D-1
      what: BOTH PRODUCER PACKAGES ARE ADMITTED.
      why: >-
        Snapshot integrity passed: both commits (6787c6e4, 4d801d94) are
        reachable from HEAD, carry the recorded parents, change exactly the
        declared paths, and all 9 recorded hashes recompute from the committed
        blobs. Re-acquisition: 26 sources, 25 hash matches, 0 unexplained
        mismatches, 0 fabrications; the five non-reproducible hashes each had
        their cause established mechanically (EV-MCE-332f99 O-10). The rate
        arithmetic was independently recomputed 5/5 in exact rationals, and the
        producer's 10/10 size-formula control independently re-ran at 10/10.
        The scope firewall HELD in both packages: every security-predicate hit
        is a quoted attributed source statement or a self-imposed prohibition.
    - id: D-2
      what: >-
        RETRACTED -- "the rate threshold is the whole question"
        (BATCH-001-OPENING section 4).
      why: >-
        Falsified by this batch's own primary text. arXiv:2304.14757 states
        verbatim that its attack "does not work at all when the alternant code
        has the additional structure of being a Goppa code", with Table 1
        carrying "(does not apply in the particular case of Goppa codes)". The
        decisive restriction is the CODE FAMILY, and Classic McEliece uses
        binary Goppa codes. The Coordinator asserted "genuinely confined to
        high rate" about a paper nobody had read, and built the batch's
        measurement plan on that axis. The red team's cheapest control was one
        grep over text already retrieved.
      also_wrong_typed: >-
        The same framing mis-types iacr:2024/1193: its Theorem 3 is stated in
        the DUAL rate and says "here we allow any R"; the 0.277 / 0.141
        thresholds are null-model conditions on a shortened code, not
        applicability bounds on the distinguisher.
    - id: D-3
      what: >-
        RETRACTED -- goal.yaml's claim that GOAL-HQC-001 and GOAL-SDITH-001
        "already bind to" a memory-charged ISD costing convention, and
        BATCH-001-OPENING section 5's flat "This goal binds to that
        convention".
      why: >-
        Contradicted by a committed ledger decision of the sibling goal.
        DEC-20260802-344883 D-6: "ISD-FC-2026 IS NOT ADOPTED... a usable draft,
        not a binding convention", and GOAL-HQC-001.next_action: "DO NOT bind
        GOAL-SDITH-001 to ISD-FC-2026." The validator established
        independently that ISD-FC-2026 exists, is complete, is independently
        reviewed and IS genuinely scheme-independent -- but is status
        `proposed`, and its declared binding scope names HQC and SDITH, not
        MCE. RQ-MCE-e65b3c.constraints and goal.yaml therefore both instructed
        an act that cannot currently be performed.
      severity: >-
        This is the THIRD occurrence of the error family recorded as a process
        finding in GOAL-HAWK-001 BATCH-001 and GOAL-HQC-001 BATCH-001, and the
        first in the POSITIVE direction: the prior two asserted a prior record
        was defective, this one asserted a prior record supports us. The
        Coordinator named that precedent twice in these handoffs and committed
        the error anyway. That is the finding.
      concrete_cost: >-
        TASK-20260803-f3aece read Esser-Bellini SEC Table 1 (three memory
        models x five parameter sets, p.10) and DELIBERATELY DECLINED to
        transcribe it, deferring to the non-existent binding. Transcribing a
        published table is not adopting a convention; it is the baseline half
        of BATCH-001-OPENING section 1's own justification, and it was
        available at zero retrieval cost.
    - id: D-4
      what: >-
        UPHELD -- KN-LIT-4c8135 states the boundary of arXiv:2304.14757 on the
        wrong axis.
      why: >-
        The entry mentions Goppa codes once, in the opposite direction, and
        frames the restriction as rate-scoped while presenting that scoping as
        "the whole content of its practical reading". The Goppa exclusion is
        absent. The entry was written by this Coordinator on 2026-08-03 and
        teaches itself as the program's exemplar of scope honesty while having
        the boundary wrong. NOT corrected in this decision: knowledge entries
        are immutable and are corrected by superseding, which is dispatched as
        a BATCH-002 task.
    - id: D-5
      what: >-
        UPHELD -- a tagging defect defeats RQ-MCE-e65b3c's "distinguisher is
        not break" constraint at the grep level, at prevalence 4 of 4.
      why: >-
        Among the 137 entries filed 2026-08-03: 36 tagged key-recovery, 4
        tagged distinguisher, 4 tagged BOTH, 0 tagged distinguisher-only. The
        four are KN-LIT-13a01d, 71d1a0, 7ee1a9, e37d4c. KN-LIT-13a01d carries
        key-recovery while its own body reads "It does not recover keys; it
        distinguishes" -- and it is the entry RQ-MCE-e65b3c names as the anchor
        of that very constraint. The producer reported a cautious 2 of 2 and
        explicitly refused to extrapolate; the red team measured the real
        prevalence.
    - id: D-6
      what: >-
        UPHELD -- BATCH-001-OPENING section 4 listed as unestablished something
        the program already held.
      why: >-
        It recorded "whether it touches binary Goppa codes at all" as unknown,
        but the ePrint page fetched during GATHER-20260803 on 2026-08-03 for
        citation verification carries the keyword line "McEliece scheme,
        Algebraic cryptanalysis, Binary Goppa codes". Unused held evidence, not
        caution. Cheapest control: record the Keywords line at verification
        time, at zero marginal network cost.
    - id: D-7
      what: >-
        UPHELD -- BATCH-001-OPENING section 2's danger framing is inverted.
      why: >-
        The 137 entries filed 2026-08-03 (118 citation_verified web, 19 false,
        every one stating the paper was not read) are the BEST-provenanced
        McEliece records in the corpus. 31 of the 32 pre-existing entries carry
        citation_verified read against the absent downloads/ tree, as does
        7459/7807 corpus-wide (KN-OPEN-3f7a21). The opening used the new
        entries' honesty as the reason for caution while treating the older
        entries as the reliable baseline.
    - id: D-8
      what: >-
        UPHELD -- "two live code-based goals" overstates. GOAL-SDITH-001 is
        status draft with current_batch_id null.
    - id: D-9
      what: NOT UPHELD, withdrawn by the red team itself.
      why: >-
        BATCH-001-OPENING section 3's use of KN-OPEN-3f7a21 claims only that
        pre-2026-08-03 `read` provenance is "unconfirmed", which is exactly
        what that record supports. Recorded because a withdrawn objection is
        part of the review's honesty record.
    - id: D-10
      what: >-
        OPEN -- divergent transcription standards inside one batch
        (validator Q2).
      why: >-
        TASK-20260803-f3aece silently glyph-normalised quoted material
        presented as verbatim while declaring zero [EXTRACTION-DAMAGED]
        markers; TASK-20260803-292b99 left raw (cid:NN) tokens visible and
        marked them. No number is affected. The convention must be fixed before
        the next transcription batch, not after.
    - id: D-11
      what: >-
        NOTHING IS CONCLUDED ABOUT CLASSIC McELIECE'S SECURITY.
      why: >-
        BATCH-001 transcribed sources. It ran no solver, designed no
        experiment, created no hypothesis, and computed no distance between the
        2026 attack regime and Classic McEliece's parameters -- because the
        left-hand side was never obtained. claim_tier stays toy and
        RQ-MCE-e65b3c's ceiling is unchanged.
  evidence_refs: [EV-MCE-332f99]
  limitations:
    - >-
      The primary target's body was NOT obtained. iacr:2026/1232's complexity
      claim is known only as a conjecture stated in its abstract, with no
      exponent and no formula, and its rate regime -- if it states one -- is
      unread.
    - >-
      Both reviews are independent sessions on ONE resolved model
      (claude-opus-5), identical to both producers and the Coordinator. NOT
      admissible toward an AGENTS.md rule 13 closure quorum. No
      completion_quorum block is written and no attestation may be synthesized
      from these reviews later.
    - >-
      PROMOTION GATES: none of G1-G4 is addressed. BATCH-001 advances no
      asymptotic-complexity claim of this program's own. Stated explicitly so
      it cannot be misread as gate progress.
    - >-
      1 of 6 campaign batches used. Both producers ran inside budget;
      runs_authorized was 0 and 0 runs were executed.
  next_actions:
    - >-
      EXACTLY ONE NEXT ACTION for the goal: open BATCH-002 as a single
      Coordinator correction task that supersedes the rate framing in all three
      places AT ONCE -- BATCH-001-OPENING section 4 (by superseding note),
      RQ-MCE-e65b3c.constraints, and KN-LIT-4c8135 (by a superseding knowledge
      entry) -- and corrects goal.yaml's "already bind to" against
      DEC-20260802-344883 D-6. The red team's argument for doing them together
      is decisive: it is one defect in three places, and fixing them separately
      lets BATCH-002 inherit whichever is fixed last.
    - >-
      In the same batch, supersede the four both-tagged entries (KN-LIT-13a01d,
      71d1a0, 7ee1a9, e37d4c) to remove key-recovery, so RQ-MCE-e65b3c's
      "distinguisher is not break" constraint is enforceable by grep.
    - >-
      Transcribe Esser-Bellini SEC Table 1, which D-3 shows was skipped for a
      reason that does not exist. It is a published table, not a convention
      adoption.
    - >-
      Settle the transcription convention (D-10) BEFORE the next transcription
      batch.
    - >-
      DO NOT re-attempt iacr:2026/1232's PDF by another route this batch. The
      403 is path-scoped and reproducible, bot-protection circumvention is
      forbidden, and AGENTS.md rule 5 makes a blocked route a recorded outcome
      rather than evidence.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOTHING PROMOTED, deliberately, for three separate reasons.

      (1) No KN-FIND: this program produced no internal result. It read
      sources. EV-MCE-332f99 is strength inconclusive, far below the
      replicated/strong bar that /curate-knowledge requires for a finding.

      (2) No KN-LIT filed, although both producers proposed entries: the
      specification family (proposals A-E from TASK-20260803-f3aece) is
      genuinely not held and SHOULD be filed -- but filing is deferred to
      BATCH-002 because a corpus entry is immutable once filed and this batch
      just demonstrated, twice, that this Coordinator's entries can carry the
      boundary on the wrong axis (D-4) and the wrong tags (D-5). Filing five
      more entries before the correction task lands would repeat the defect at
      scale. TASK-20260803-292b99 proposed zero new entries and correctly
      proposed that KN-LIT-7c4620 STAY citation_verified: web -- the abstract
      is not the paper, and a `read` flag there is the false confidence
      KN-OPEN-3f7a21 already cost this program.

      (3) No KN-TECH: still zero technique entries on ISD, still correctly so.
      A technique entry states applicability conditions and known limits, and
      D-2 is a live demonstration that this program does not yet know the
      applicability conditions in this area.
  decided_by: coordinator
  decided_at: '2026-08-03'
