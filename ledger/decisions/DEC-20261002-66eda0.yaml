      Standing user authorization of 2026-09-06 covers approval of the
      word-product check. The contract names the coefficient pair, the
      ratios, two routes, and a falsification criterion. It does not run
      a walk.
    - >-
      The products were computed in this session. That computation is not
      a run. The folded constant term is 348. The schoolbook ratio is
      33/14, which is 3/70 below 12/5. Fifteen percent of 90 is 27/2, not
      the written 14. Recalled cost notes in the proposal were not reopened
      as primary sources and do not back this approval beyond the integer
      identities recomputed here.
    - >-
      origin/main was already contained in this branch. origin/main was
      1259f52f445e2f6fa43c80d2a9ff790e99815d9b. HEAD at the merge check
      was 9c503741cc6f3fb0d5a3e8711de9586155c00493.
  evidence_refs:
