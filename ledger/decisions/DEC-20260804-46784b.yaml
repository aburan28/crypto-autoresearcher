  context: >-
    BATCH-098: k-way MITM analysis. Result: all k-way MITM approaches have cost
    O(N^{(k-1)/k}), minimized at k=2 = N^{1/2} (BSGS is optimal). All other
    non-decomposition families already closed.

  decision: confirm_hpseudo_only_path
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    **k-WAY MITM THEOREM**: For any k-part balanced scalar MITM, cost = O(N^{(k-1)/k}).
    Minimum at k=2 (BSGS), worse for all k≥3. BSGS is optimal among all k-way MITM.

    **COMPREHENSIVE BARRIER**: For prime-field ECDLP on cryptographic curves:
    - Decomposition (Semaev/index calculus): requires H-PSEUDO for sub-rho
    - k-way MITM: cost ≥ N^{1/2}, minimum at BSGS
    - Pohlig-Hellman: requires smooth N (prime N excluded)
    - MOV/FR: requires small embedding degree (excluded)
    - Anomalous: requires trace=1 (excluded)

    **FINAL CHARACTERIZATION after 98 batches**:
    H-PSEUDO is not merely the only IDENTIFIED path to sub-rho prime-field ECDLP —
    it is the ONLY LIVE PATH among all classical algorithm families. No other approach
    can beat Pollard rho for generic prime-field ECDLP.

    GOAL-ECDLP-001 stays active.

  exact_next_action: >-
    BATCH-099: Continue the loop. Fresh ideation attempt: is there a HYBRID approach
    combining MITM and decomposition that could beat both individually? Specifically:
    write k = a * N^{1/4} + b with a,b ∈ [N^{3/4}] × [N^{1/4}]. Decompose [b]G
    over a factor base of size N^{1/2}, then use BSGS for the remaining [a*N^{1/4}]G part.
    Does this give a hybrid algorithm with cost < N^{1/2}?

