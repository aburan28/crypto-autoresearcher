  amb_c3_n7_ruling:
    grounds_stated_before_deciding: >-
      Three grounds, stated before choosing and applied option by option in
      AMD-20261002-594eab ruling_grounds:
      - fidelity to C-3's intent: a negative control that proves a
        result-token change in a "missing" count is caught, at the step
        where it is planted;
      - harness honesty: each control is plantable exactly as written, with
        no free choice, and is checked mechanically before issue;
      - no weakening of any control.
      Speed and favourability were not criteria.
    ruling: >-
      OPT-3, by the additive amendment AMD-20261002-594eab (protocol v4 ->
      v5), APPROVED HERE.
      - N7 is corrected per OPT-1. It stays at step 13, the missing-key
        step, in the one line containing "job 3-b12-c0 ended: ", and changes
        "missing 1" to "missing 0". Locus and token class are kept; the
        direction follows the token the step carries.
      - N11 is added per OPT-2. It is placed at step 11, in the one line
        containing "job 3-b12-c1 ended: ", and changes "missing 0" to
        "missing 1".
      Both directions of a missing-count change are then shown detected, in
      a one-job and a two-job H8 tail. Every other control keeps the exact
      change the archived v4 run constructed. All 18 rows (B0, P1-P6,
      N1-N11) are fixed in protocol_amendment.control_table. A negative row
      now passes only if the comparison fails at exactly its planted step. A
      positive row passes only if every step passes.
    options_not_taken_alone: >-
      OPT-1 alone was adequate, but it leaves the C-3 direction (0 -> 1) of a
      missing-count change untested. OPT-2 alone moves N7 off the missing-key
      step and loses its locus. Neither is rejected on its merits; OPT-3
      keeps both.
    harness_consequence: >-
      A new harness file, experiments/EXP-PFDR-011cd0/amd-594eab/check_identity_v5.py,
      with a new sha256 and a fresh controls run before D-4 (C-4).
      check_identity_v4.py is archived and is never edited.
    other_defects_found_and_repaired:
      - "D-3: f3fa33 C-2 (ii) named 'completeness'; the archived JSON field is selection.completeness_table. The executor resolved this by a recorded reading. D-3 makes it exact."
      - "D-6: C-2 (iii) requires SX-31's stdout to be empty, but C-6 named no archived location for that stdout. D-6 adds amd-594eab/sx31-stdout.txt (and -2)."
      - "D-4 (1): C-4 (1) duplicated the order-step (a) hash table without saying whether one satisfies the other. D-4 (1) says it does when it covers the same paths in the same session, and adds the TASK-20261002-7e9e56 paths."
    unchanged: >-
