coordinator_decision:
  id: DEC-20260830-5b87f9
  context: >-
    This Coordinator decision composes the independent Validator (J1,
    recorded verdict `incomplete` on admissibility grounds, content
    assessment `holds_with_finding`) and Red Team (J2, verdict
    `holds_with_finding`) reviews of EXP-MONO-715694's execution: a toy-
    scale census-convergence power analysis testing whether this lane's
    actual census sample sizes have enough statistical resolving power to
    distinguish S_4 (full symmetric monodromy) from the proper subgroups
    A_4 (primitive) and D_4 (imprimitive, ground truth from EXP-MONO-a20e48's
    already-archived real data). It is the fourth record in this session's
    RQ-MONO-001 work. This decision is composed against the ORIGINAL frozen
    contract at commit `88f0a034e` — the same text both independent
    reviewers evaluated — not the current on-disk text, which was mutated
    out-of-band twice, post-execution, by an unauthorized identity; see
    `CORR-20260830-c58d44` for full disclosure of that incident, which this
    decision does not re-litigate.
  decision: weaken
  decision_label: >-
    census_convergence_primary_metric_falsified_as_pre_registered_primitivity_mechanism_refuted_by_counterexample_narrower_instrument_power_claim_independently_confirmed
  target_ids:
    - H-MONO-819f2b
    - EXP-MONO-715694
    - RQ-MONO-001
    - EV-MONO-7d24fe
    - CORR-20260830-c58d44
    - H-MONO-59f6a6
    - IDEA-20260815-711932
  rationale:
    - >-
      THE PRIMARY, PRE-REGISTERED METRIC TRIGGERS THE RECORD'S OWN
      FALSIFICATION CONDITION, EXACTLY AS WRITTEN, AND THE EXECUTOR REPORTED
      THIS HONESTLY RATHER THAN WORKING AROUND ITS OWN FROZEN SEARCH FLOOR.
      N_required ties at the contract's own N=10 floor for both the S4-vs-A4
      and S4-vs-D4 pairs (power=1.0, Monte Carlo SE=0.0, both runs).
      H-MONO-819f2b's own `falsification_conditions` names exactly this
      outcome as falsifying the central ordering prediction. This
      Coordinator does not rationalize this away or treat the frozen
      contract's own search-floor choice as if it had never been fixed in
      advance — the falsification stands as triggered.
    - >-
      BOTH INDEPENDENT REVIEWERS, BY TWO DIFFERENT METHODS (INDEPENDENT
      MONTE CARLO AND INDEPENDENT EXACT ENUMERATION), CONFIRM THE SPECIFIC
      NUMERIC PREDICTION IS GENUINELY TRUE BELOW THE FROZEN FLOOR:
      N_required(A4)=5, N_required(D4)=8. This is reported as exploratory,
      supplementary verification outside the frozen contract's own
      official metric — consistent with the contract's own
      invalidation_rules, which forbid a post-hoc re-selection of the
      search grid — and does NOT reverse the primary-metric falsification
      above. It explains why the falsification occurred (a search-floor
      resolution ceiling) without curing it.
    - >-
      THE RECORD'S CENTRAL EXPLANATORY MECHANISM IS INDEPENDENTLY FALSIFIED
      BY A CONSTRUCTED COUNTEREXAMPLE, AND THIS IS THE MORE CONSEQUENTIAL
      FINDING THAN THE PRIMARY-METRIC TIE. The Red Team tested two further
      known degree-4 subgroups (C_4, V_4 — both IMPRIMITIVE) by the
      identical exact method and found BOTH need FEWER draws than A_4 (the
      PRIMITIVE case), directly contradicting H-MONO-819f2b's own
      `mechanism`/`observation_collision` claim that imprimitivity, as
      such, drives harder discrimination. Discriminating power tracks
      excluded probability mass exactly (a verified closed form), not the
      primitive/imprimitive structural distinction. D_4 needing more draws
      than A_4 is therefore a numerical coincidence of these two specific
      groups' excluded masses, not evidence for the proposed mechanism.
      `decision: weaken` (rather than `reject_scoped`) reflects that the
      record's narrower instrument-power question survives cleanly (next
      finding), while its central explanatory claim does not.
    - >-
      THE NARROWER, PRACTICAL INSTRUMENT-POWER QUESTION IS ANSWERED
      CLEANLY AND POSITIVELY, INDEPENDENTLY CONFIRMED BY BOTH REVIEWERS.
      This lane's actual census sample sizes DO correctly resolve the real
      group verdicts already recorded: N1's exhaustive real data classifies
      as D_4 and N3's real S=2,000 sample classifies as S_4, under both
      pairwise tests, in both runs, independently re-derived from raw data
      by both reviewers (not merely re-read from the Executor's summary).
      This is a genuine, if narrower, positive finding this record produced
      — it does not require the falsified mechanism to be true, and stands
      on its own.
    - >-
      TWO FURTHER SUBSTANTIVE FINDINGS ARE NAMED, NEITHER CHANGING THE
      DISPOSITION ABOVE. (a) The Executor's own Chernoff-Stein cross-
      reference, presented as corroborating the ordering prediction, used
      the wrong KL-divergence direction and is self-contradictory (its own
      predicted N exceeds the floor at which power=1.0 was already
      measured) — a genuine reporting defect, not a data problem. (b) Step
      4a (the bootstrap-vs-simulation cross-check for HEUR-MONO-CONV-1) is
      structurally incapable of testing what it claims to test (i.i.d.
      resampling cannot detect non-i.i.d. structure by construction); an
      independently-constructed test with genuine power to detect this
      shows the real N1 census data IS measurably non-i.i.d.
      (under-dispersed). This is disclosed as inconsequential for THIS
      record (N1's census is exhaustive, immune to any sampling-order
      effect) but means HEUR-MONO-CONV-1 should not be cited as validated
      by this record for any future sub-exhaustive point-parametrized
      census member.
    - >-
      THE EXECUTOR'S DISCLOSED REJECTION-DIRECTION JUDGMENT CALL IS
      CONFIRMED CORRECT WITH MARGIN BY BOTH REVIEWERS, AND IS RECORDED AS A
      CREDIT. Faced with an internal contradiction in its own handoff text,
      the Executor resolved it via first-principles arithmetic; the Red
      Team's exact enumeration confirms the discarded alternative
      convention would have been anti-informative (power below its own
      significance level) and would have inverted the record's entire
      substantive content. Good judgment under a genuinely ambiguous
      instruction, not merely an unremarkable deviation.
    - >-
      GOVERNANCE FINDING CARRIED FORWARD, NOT RE-LITIGATED HERE. Two
      further out-of-band "Cursor Agent" commits mutated this record's
      frozen contract in place, post-execution, progressively softening
      the exact falsification criterion the honest result had already
      triggered — the fifth and sixth such incidents this session, and the
      most severe. Fully disclosed in `CORR-20260830-c58d44`. This decision
      is composed against the original frozen text, matching both
      reviewers' basis, and does not let the tampering launder the
      triggered falsification into a non-event.
    - >-
      DISPOSITION. H-MONO-819f2b's status moves to `weakened`, scoped
      exactly to the tested battery (S_4, A_4, D_4 as ground-truthed from
      EXP-MONO-a20e48's real data; C_4, V_4 as the Red Team's supplementary
      counterexamples) at p=211/toy degree-4 scale. This does not touch
      H-MONO-0b3def, H-MONO-0f9170, or H-MONO-59f6a6's status — none of
      their own group verdicts are called into question; if anything, this
      record's Step 4b findings independently corroborate that those
      verdicts' underlying census data was adequately powered.
  evidence_refs:
    - EV-MONO-7d24fe
    - experiments/EXP-MONO-715694/execution_report.yaml
    - experiments/EXP-MONO-715694/reviews/validator/validation-report.yaml
    - experiments/EXP-MONO-715694/reviews/red-team/red-team-report.yaml
    - coordination/tasks/TASK-20260830-074dcd/snapshot-receipt.json
    - CORR-20260830-c58d44
  official_status_changes:
    goal_status_changed: false
    goal_status_after: paused
    hypothesis_status_changes:
      - hypothesis_id: H-MONO-819f2b
        prior_status: proposed
        new_status: weakened
        scope: >-
          The primary, pre-registered ordering metric is falsified as
          written (tied at the frozen search floor). The record's central
          explanatory mechanism (imprimitivity drives harder discrimination)
          is independently falsified by a constructed counterexample
          (C_4, V_4 needing fewer draws than the primitive A_4). A
          narrower, independently-confirmed claim survives: this lane's
          actual census sample sizes correctly resolve the real group
          verdicts for N1 and N3. Scoped to degree-4 groups (S_4, A_4, D_4,
          C_4, V_4) at toy scale; no claim about any other degree or
          group.
    experiment_status_changes:
      - experiment_id: EXP-MONO-715694
        prior_status: approved
        new_status: completed
    resource_disposition_changed: false
    completion_criteria_met: []
    completion_criteria_note: >-
      RQ-MONO-001 and GOAL-MONO-001 are not closed or advanced by this
      decision; it resolves one instrument-power hypothesis at toy scale
      only.
    implementation_authorized: false
    experiment_runs_authorized: 0
    scientific_interpretation_authorized: true
    scientific_interpretation_scope: >-
      Exactly the scoped weakening and the narrower surviving claim stated
      above; no ECDLP, relation-rate, or m>=4 claim; no status change to
      H-MONO-0b3def, H-MONO-0f9170, or H-MONO-59f6a6.
    closure_authorized: false
    breakthrough_authorized: false
  disclosed_open_items:
    - id: CENSUS-POWER-V2-SUCCESSOR-EXPERIMENT
      description: >-
        A cheap successor experiment (near-zero additional compute, reusing
        already-archived real data) named by the Red Team's
        `next_concrete_action`: lower the search floor to N=1 and replace
        Monte Carlo with exact enumeration for N<=20; restate the central
        prediction in terms of excluded cycle-type mass rather than
        primitivity/imprimitivity; add C_4 and V_4 to the battery as the
        counterexamples this record discovered; replace NULL-1/NULL-2 with
        the genuine near-null-law control both reviewers independently
        built; replace Step 4a's bootstrap-vs-simulation check with a
        genuine dispersion/non-i.i.d.-detecting control (e.g. contiguous-
        window variance against a shuffled-order null).
      carried_forward_to: >-
        A versioned successor experiment (new EXP-MONO-* id, since the
        current contract is frozen and completed, not amended) or a
        protocol_amendment if the Coordinator judges the change scope
        qualifies; either is future work, not performed by this decision.
      does_not_block: H-MONO-819f2b's weakened disposition at its current scope
    - id: CLOSED-FORM-CENSUS-POWER-TECHNIQUE-KNOWLEDGE-PROMOTION-FOLLOWUP
      description: >-
        The Red Team's verified closed form
        (N_required = ceil(ln(alpha)/ln(1-excluded_mass)) for a disjoint-
        support two-law discrimination problem) is a genuine, reusable,
        program-level technique not previously on record, confirmed exact
        against full enumeration for four subgroups. Not promoted to
        `knowledge/techniques/` by this decision (see `knowledge_promotion`
        below) because it has been validated within one experiment's review
        round, not yet reused across two or more experiments as this
        program's own promotion bar requires.
      carried_forward_to: >-
        A future `/curate-knowledge` pass, once a successor experiment (see
        above) or an unrelated future record actually reuses this
        technique, satisfying the two-or-more-experiments bar.
      does_not_block: this decision's disposition
  procedure_deviations:
    - >-
      This Coordinator dispatched the independent Validator and Red Team
      reviews directly against the Executor's uncommitted working-tree
      output, without first performing the isolated snapshot commit the
      three prior MONO cycles this session all did before dispatching
      review. Caught by the Validator mid-review (its own admissibility
      finding); remedied by `coordination/tasks/TASK-20260830-074dcd/
      snapshot-receipt.json` after the fact. No content changed in the
      interim (verified: this Coordinator made no edits to any producer
      file at any point).
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No `KN-FIND` is warranted: this evidence record's strength is a
      mixed/falsified-primary-metric label, not `replicated` or `strong`,
      the gate `/curate-knowledge` requires for a finding promotion. The
      one genuinely durable, reusable content item this record surfaced —
      the closed-form excluded-mass census-discriminating-power technique
      — is not promoted to `KN-TECH` either, because this program's own
      bar requires validation "across two or more experiments" and this
      technique has so far only been independently derived and confirmed
      within this one experiment's review round (by two reviewers, not two
      experiments). Deferred rather than authored inline; see
      `disclosed_open_items`.
  limitations:
    - >-
      Toy scale only. Degree-4 permutation groups only (S_4, A_4, D_4, C_4,
      V_4). No claim about cryptographic scale, any other degree, or any
      curve.
    - >-
      HEUR-MONO-CONV-1 is measurably false for point-parametrized census
      members as tested here (inconsequential for N1 specifically, since
      its census is exhaustive); see `EV-MONO-7d24fe`.
    - >-
      This record's own frozen contract and hypothesis were mutated
      out-of-band twice, post-execution, by an unauthorized external
      identity; see `CORR-20260830-c58d44`. This decision is composed
      against the original frozen text.
    - >-
      Both independent reviewers disclose the same recurring
      model-identity discrepancy noted throughout this session, neither
      probe-verified. Not resolved by this decision.
  inference:
