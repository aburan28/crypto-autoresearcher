  - The contract is complete and runnable on pushed bytes; the standing authorization applies and capacity is free.
  - >-
    n = 7 separates "2-torsion type governs the floor" from "the factorisation of x^n - 1 governs the spectrum",
    which n = 3 and 5 cannot; the derived floors (7 split, 161, 193, 193, 577) are falsifiable by one model.
  limitations:
