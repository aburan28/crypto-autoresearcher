    inherited attestations, and append only actual new reads. No fabricated retrieval,
    source verification, model verification or clearing result.
  - The generator writes only its three declared task artifacts. Coordinator filing
    copies exact complete bodies into the 25 declared canonical proposal paths and
    records semantic equality, the bijection and effective coverage. No predecessor
    edits or registry redirects.
