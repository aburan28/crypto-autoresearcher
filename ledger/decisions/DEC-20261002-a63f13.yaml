    - id: R-SLOT
      subject: this batch's slot and claim rule
      ruling: >-
        BATCH-4708f7 holds SLOT 2 of GOAL-ECDLP2M-001's max_concurrent 3,
        counted in live claims across every queue of the goal. Queue
        max_concurrent 1. Before every claim: git fetch and
        research_dispatch.py --claims refs on every queue of the goal; claim
