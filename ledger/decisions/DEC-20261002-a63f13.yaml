    - id: R-FORM
      subject: >-
        The successor's record form -- a new experiment record superseding
        EXP-QSP-70b731, a protocol amendment, or an implementation-repair batch
        under the existing approval
      ruling: >-
        AN IMPLEMENTATION-REPAIR BATCH UNDER THE EXISTING PROTOCOL APPROVAL
        (DEC-20260920-2b276f), GATED BY A ZERO-RUN DESIGN ROUND, WITH AT MOST
        ONE CONDITIONAL VERSIONED PROTOCOL AMENDMENT RESTRICTED TO D-4 AND
        D-5. Not a new experiment record: EXP-QSP-d7df70 and H-QSP-a90237 are
        returned unused.
      reasons:
        - >-
          (1) The defects are the implementation's, not the contract's. Six
          of the eight items are discharged by the frozen specification
          exactly as written: D-1 by required_artifacts item 1 and
          invalidation rule 7 (a manifest with every AGENTS.md artifact-policy
          field); D-2 by certificate_semantics, M5, F_acct, required_artifacts
          item 3 and tail_checks item 3; D-3 by invalidation rules 3 and 4 and
          M5; D-6 by stages.stage_0 ("ZERO for the mathematical gate; no
          census code runs") and M9; D-7 and D-8 are information items. The
          validator located each in code (F-01 driver.py lines 436-456; F-02
          driver.py line 116; F-03 check.py lines 59-60 and i_indep.py lines
          83-84; F-06 driver.py lines 44-58, 139-196, 451), not in the
          specification. A repaired implementation closure under the frozen
          contract is therefore the proportionate remedy.
        - >-
          (2) The specification names the amendment as its own change
          mechanism ("Any change after this point requires a versioned
          protocol_amendment under experiments/EXP-QSP-70b731/amendments/"),
          and DEC-20261002-e0aa2b defect_return note repeats it. Two items may
          need it. D-4: the specification defines I_indep as resting on
          derivation (A) and "Used on ALL census cells", but on most Band-L
          cells the derivation-(A) degree bound looks infeasible to construct
          directly (R-ROUTE-PRIOR); if no derivation-(A)-faithful route
          exists there, the per-cell instrument route is a contract question,
          not a coding choice. D-5: the specification lists stage_5 (controls)
          after stage_compare while its stopping rules and controls C2 to C6
          are blocking; where the blocking fixtures run relative to the
          census is to be read from the text, and changed only by amendment.
          Neither is known until a design session reads the contract
          (DEC-20261002-5e691c R-QSP-SUCC remaining_uncertainty).
        - >-
          (3) A new experiment record is the wrong instrument here. The
          question (RQ-QSP-f9bbdb), the hypothesis (H-QSP-cd0c90), the
          measured quantity N_K(L), the cells, the candidate set, the
          preregistered prediction and the success and falsification criteria
          all stand; nothing in F-01 to F-14 touches them. A new EXP and H
          would fork an approved replication's lineage, duplicate its
          approval and its frozen prediction, and invite the prediction to be
          re-frozen after the owner session has seen outputs, which is the
          failure the amendment rule exists to prevent. The amendment route
          keeps the frozen prediction byte-identical and makes any change
          versioned, reviewed and visible.
        - >-
          (4) The amendment is restricted now, before any producer runs
          (R-AMEND-SCOPE), so that it can repair an instrument route or a
          stage order and nothing else. It is post-data in the sense that the
          owner session saw run outputs; it is written by parties who did not
          (R-READ), and it says so.
      revisit: >-
        If the design round finds the replication cannot be performed under
        the frozen contract plus an amendment inside R-AMEND-SCOPE (for
        example, if derivation (A) cannot be implemented on the bridge or on
        Band H, which would change what the replication measures), the
        design-round composer applies key K-new-record of
        REVIEW-QSP-D-20261002-4708f7: the lane closes at its ledger archive
        and a new-record design batch with freshly minted ids is ranked at
        that selection point. EXP-QSP-d7df70 and H-QSP-a90237 are not held
        for that contingency.

    - id: R-AMEND-SCOPE
      subject: what the conditional amendment may and may not change (fixed before any producer runs)
      ruling: >-
        The design card may write experiments/EXP-QSP-70b731/amendments/amendment-v2.yaml
        (a protocol_amendment, version 1 to 2, kind additive, approved_by
        null, its approval block naming DEC-20261002-6e68d8) ONLY IF it shows
        that D-4 or D-5 cannot be discharged within the frozen fields. MAY
        CHANGE: (A1) the I_indep route per census or calibration cell where
        derivation (A) is shown infeasible, naming the route used there, why
        it is independent of I_direct, and on which cells derivation (A)
        itself runs and is calibrated by C1 before Band H; (A2) the order in
        which stages and the blocking controls C2 to C6 run relative to the
        census stages; (A3) Stage 0 mechanics only if needed to make D-6
        executable. MAY ONLY TIGHTEN: invalidation rules, stopping rules,
        blind_from (extend only). MAY NOT CHANGE: preregistered_prediction,
        success_criterion, falsification_criterion, the definitions of M1 to
        M9, certificate_semantics, the candidate set, the cells, seeds,
        claim_tier, the field model, or any tolerance. The amendment states
        its pre_data_assessment (POST-DATA as to the owner session's
        exposure; written and reviewed by parties that read nothing under
        runs/), the consequence of each change for the meaning of S1 and the
        Band-H calibration, and its precedence over version 1. Approval is the
        act of DEC-20261002-6e68d8 only. An amendment outside this scope fires
        tripwire TQ-2 of REVIEW-QSP-D-20261002-4708f7.

    - id: R-WHO
      subject: who implements D-1 to D-8, in which order, and what comes first
      ruling: >-
        DESIGN FIRST, THEN TWO EXECUTORS, THEN A VALIDATION ROUND. (1) A fresh
        Coordinator /design-experiment session (TASK-20261002-c5d9e7, no
        shell) writes the repair design: the D-1 to D-8 discharge table with
        the specification clause each rests on; the per-cell instrument-route
        table from committed import-safe code (R-ROUTE-PRIOR); the control
        and stage ordering read from the text; executor work orders with the
        interface between I_indep and the runner; acceptance checks; and the
        conditional amendment. (2) Round 1 reviews the design at zero runs
        (REVIEW-QSP-D-20261002-4708f7) and DEC-20261002-6e68d8 composes it.
        (3) Only then, implementation is executor work, in two separate
        sessions: TASK-20261002-e0b22e writes I_indep from derivation (A)
        (D-4, the I_indep half of D-3) under the specification's blind_from
        and CI-1 to CI-4; TASK-20261002-b72830 then writes the runner, the
        manifest and certificate writers, accounting, the checker, Stage 0
        mechanics and the successor trial plan (D-1, D-2, the accounting half
        of D-3, D-5, D-6, D-7, D-8). (4) Round 2 validates the repair
        (REVIEW-QSP-R-20261002-4708f7) and DEC-20261002-0d2451 accepts or
        refuses the closure and plan. (5) Execution is a later batch with its
        own run card and execution approval; nothing here schedules it.
      reasons:
        - >-
          Implementation is executor work (agents/coordinator.md; the brief).
          Splitting I_indep from the runner answers F-04 at the level of
          authorship: the I_indep author never reads I_direct, the shared
          gf2_poly primitives or the previous i_indep.py, so C1 can no longer
          compare one algorithm with itself.
        - >-
          The design gate comes first because D-4 and D-5 may change what the
          executors must build; code written before that ruling may be
          wasted or, worse, may embed a route choice the contract does not
          permit, which is exactly how F-04 arose.
        - >-
          The QSP owner session (coordinator-qsp-run-20260921, wt-qsp-run)
          produced the closure under repair and holds no card of this batch,
          as producer, reviewer or composer (R-QSP-RETURN (4)).

    - id: R-CARRIED
      subject: carried conditions and Coordinator-fixed implementation conditions
      ruling: >-
        Carried verbatim in substance from DEC-20261002-e0aa2b
        carried_conditions: fresh run ids for every trial, none of the 16
        bound directories and none of the 20 run ids declared by any earlier
        EXP-QSP-70b731 plan reused or edited; the 14 invalid trials re-run,
        not carried; Linux execution (RLIMIT_AS); the specification's
        blind_from binds every implementer exactly as it bound the first;
        TW-C1 for any later evidence review. Fixed here for the
        implementation (CI-1 to CI-6): CI-1 the I_indep author reads no file
        of the current implementation closure (experiments/EXP-QSP-70b731/implementation/*.py)
        and imports nothing from it; CI-2 the new closure lives under
        experiments/EXP-QSP-70b731/implementation/r1/ (inside the directory
        required_artifacts names), never overwriting the eight bound files;
        CI-3 every census and calibration cell's I_indep route is selected in
        code by the cell's name from the approved route table, never by a
        threshold computed from the cell; CI-4 a failed root search raises or
        records a flag, never skips silently (F-11); CI-5 code runs under the
        interpreter actually present, /usr/local/bin/python3 = CPython
        3.11.15 (no random.binomialvariate), and the plan records that the
        execution host's interpreter is recorded per run; CI-6 unit and
        integration tests run only on synthetic cells whose field degree n is
        outside {4, 7, 11, 12, 13, 31, 131}, so no synthetic cell coincides
        with any cell the specification declares (stage 0, stage 1, C2 to C6
        and the census), and they mint no RUN id.

    - id: R-ROUTE-PRIOR
      subject: the Coordinator's reading of D-4's feasibility (a prior, from the frozen formula; not a run value)
      ruling: >-
        Design figure, arithmetic on the specification's own bound N_K(L) <=
        max(2^(n'-r), d^(q+1)) with n = 131 = q n' + r, unverified by any
        tool and recomputed by the design card and the blind card JD3. At
        d = 3, the smallest census degree, log2 of d^(q+1) is about 69.7 at
        n' = 3 (q = 43), 52.3 at n' = 4, 42.8 at n' = 5, 34.9 at n' = 6,
        30.1 at n' = 7, 26.9 at n' = 8, 23.8 at n' = 9, 22.2 at n' = 10, 19.0
        at n' = 11, 17.4 at n' = 12 and 13, and 15.8 at n' = 14; at d = 7 it
        is larger still. At the bridge (n' = 22, q = 5) it is at most about
        16.8 (d = 7), and on Band H at most about 11.2, 8.4 and 5.6. So a
        derivation-(A) route that builds the H polynomial densely is likely
        infeasible on most of Band L and feasible on the bridge and Band H,
        consistent with F-04 (derivation (A) ran only on d = 3 at n' = 12 to
        14). Whether a derivation-(A)-faithful route avoids the dense
        construction is the design card's question; this reading only sets
        the prior that the amendment's A1 clause is more likely needed than
        not, and it is not a ruling on the mathematics.

    - id: R-READ
      subject: excluded reads and run-file reads
      ruling: >-
        NO RUN-FILE READ IS LIFTED. No card of this batch needs run-file
