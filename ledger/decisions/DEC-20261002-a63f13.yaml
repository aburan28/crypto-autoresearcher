        validator report, which every card that needs them reads. The
        BATCH-2d2fa1 lift (DEC-20261002-86a7e0 R-READ-LIFT) ended with that
        lane and is not renewed. Excluded for every card and party:
        experiments/EXP-QSP-70b731/runs/; experiments/EXP-FROB-30006a/; the
        ref origin/cursor/semaev-2015-audit-program-5b8b; PR 1377; the branch
        cursor/ecdlp2m-revision-design-3d1a; the in-flight review and
        composition directories under BATCH-f6b7c5/ and BATCH-2e63c3/; every
        BATCH-ccfdc6 record; every path in the specification's blind_from.
        Added for every producer and reviewer of this batch, so that no
        instrument is seeded by prior numeric answers (the specification's
        stated purpose): ledger/evidence/EV-QSP-a6aa4b.yaml, the
        DEC-20260917-* decisions, and the QSP knowledge entries that carry
        EXP-QSP-33b442 counts (knowledge/findings/ and knowledge/techniques/
        entries naming EXP-QSP-33b442). A card's read_scope is widened only by
        a Coordinator decision.

    - id: R-TIER
      subject: review tier
      ruling: >-
        review-adversarial at xhigh for every review card of both rounds
        (validator for TASK-20261002-3b6a02, TASK-20261002-c81b2e and
        TASK-20261002-9c44a4; red-team for TASK-20261002-323713 and
        TASK-20261002-044e12), each in an independent session. No round
        reviews evidence, a claimed break, a closure result or a contradiction
        of validated evidence (AGENTS.md rule 12): the rounds review a repair
        design, an optional instrument-route and stage-order amendment that
        may not touch the prediction or the criteria (R-AMEND-SCOPE), and an
        implementation. TW-C1 stays carried: any later evidence review of
        EXP-QSP-70b731 output that could contradict EV-QSP-a6aa4b runs at
        review-breakthrough, max. The tier is never lowered; a card that
        cannot be served at xhigh is not dispatched and the impediment is
        recorded on the still-active goal.

    - id: R-SHAPE
      subject: one lane, sixteen cards, two rounds
      ruling: >-
        ONE LANE, SERIAL, queue max_concurrent 1. (1) TASK-20261002-66334f
        opening card, completed at writing (PD-1). (2) TASK-20261002-bbb1a1
        opening ledger archive. ROUND 1: (3) TASK-20261002-c5d9e7 repair
        design (fresh Coordinator, no shell, allowed_session_computations D-C1
        to D-C6); (4) TASK-20261002-f0f7e0 design snapshot; (5)
        TASK-20261002-3b6a02 validator JD1; (6) TASK-20261002-323713 red team
        JD2; (7) TASK-20261002-c81b2e blind validator JD3; (8)
        TASK-20261002-55bec1 composer writing DEC-20261002-6e68d8; (9)
        TASK-20261002-0abdcf design-round ledger archive. ROUND 2, only if
        DEC-20261002-6e68d8 applies K-design-accept: (10) TASK-20261002-e0b22e
        executor I_indep; (11) TASK-20261002-b72830 executor runner and plan;
        (12) TASK-20261002-da15a4 implementation snapshot; (13)
        TASK-20261002-9c44a4 validator JR1; (14) TASK-20261002-044e12 red team
