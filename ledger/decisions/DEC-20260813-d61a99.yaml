    - >-
      Snapshot-archive this opening as an isolated Coordinator commit of exactly
      ledger/goals/GOAL-ECDLP-001/goal.yaml,
      ledger/decisions/DEC-20260813-d61a99.yaml,
      ledger/handoffs/TASK-20260813-e183e6.yaml and
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-009b1b/, with a message
      naming DEC-20260813-d61a99 and BATCH-009b1b; then push the branch and open
      or refresh a PR against main naming those records.
    - >-
      Only after that archive verifies, dispatch TASK-20260813-4bee82 to the
      Executor, set its archived_by to the snapshot task that will commit the run
      artifacts, and record the dispatch.
    - >-
      Dispatch TASK-20260813-e183e6 only after the run artifacts are snapshotted,
      in an independent session under review-adversarial.
    - >-
      On receipt, verify validity BEFORE interpreting anything: expected run
      count, schema-complete manifests, seed integrity, raw/summary agreement,
      control comparability, null-object separation, and the class-completeness
      gate. An invalid or incomplete run set returns to the Executor with
