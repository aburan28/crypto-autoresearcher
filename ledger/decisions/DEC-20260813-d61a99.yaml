    - >-
      Reconcile the batch accounting as separate, scoped Coordinator work:
      classify the 146 batch directories against the 48 checkpoints, identify
      which represent real opened batches and which are artefacts of concurrent
      worktrees, remapped ids or abandoned control planes, and establish an
