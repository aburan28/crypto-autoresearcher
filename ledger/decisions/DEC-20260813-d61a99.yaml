  rationale:
    - >-
      THE AUTHORIZATION IS THE WHOLE BASIS OF THE RAISE. No result, no argument
      and no Coordinator judgement grants a batch here; the user named an exact
      value after being shown the exhausted budget and the unauditable counter,
      and this decision records that value and nothing beyond it. The nine prior
      entries under budget_amendments were each taken on the same footing, and
      this one follows their form deliberately so that an auditor can compare
      them line for line.
    - >-
      THE AMBIGUITY IS RECORDED, NOT RESOLVED BY ASSERTION. The honest statement
      about the superseded value 50 is that the evidence does not settle whether
      it was superseded-while-unconsumed or superseded-while-spent, so the
      maximum_batches_history entry says exactly that instead of picking one.
      Inventing a determination to make the entry resemble its neighbours would
      be the fabrication that list exists to prevent (AGENTS.md rule 9).
    - >-
      THE BATCH OPENED IS THE CHEAPEST ADMISSIBLE USE OF ONE UNIT OF HEADROOM.
      EXP-ISOU-2ac81f is already approved and frozen at version 1; its Executor
      handoff is already written and dispatch-ready; its budget is bounded and
      fully specified (600 s per run, 4 runs, 2 CPU-hours, 8 GB, 1 worker); and
      it discharges an audit debt an independent red team put on the record
      against obstruction 4 of a closure this program has already acted on
      (EV-ECDLP-b3e847). Opening this batch requires no new design work and
      spends no design budget.
    - >-
      THE REVIEW IS RESERVED BEFORE THE RUN, NOT AFTER IT. DEC-20260813-e0077d
      required a dependent independent Validator to exist before dispatch because
      the producer task is claim-relevant. TASK-20260813-e183e6 is written under
      review-adversarial in an independent session and is scoped to run
      integrity - receipts, certificates, controls, reproducibility bindings -
      explicitly NOT to re-running the experiment and NOT to interpreting it into
      a claim.
    - >-
      BATCH-080a9c IS CLOSED AND ITS RESIDUAL IS DEFERRED, NOT DROPPED. Its
      committed checkpoint records status closed, verdict REVISE, zero experiment
      runs. Its own next_action - one further zero-run static SYC successor -
      remains open on its own terms and is recorded as deferred in the goal head,
      so advancing the head to BATCH-009b1b suppresses no lead (AGENTS.md rule 9
      / CLAUDE.md rule 9) and preserves exactly one live next action.

  what_this_decision_does_not_do:
    - >-
      IT MEETS OR APPROACHES NO COMPLETION CRITERION OF GOAL-ECDLP-001.
      completion_criteria and pause_conditions are UNCHANGED and untouched, and
      the goal's status remains `active`.
    - >-
      NO HYPOTHESIS STATUS MOVES. H-ISOU-c5bfea remains `specified`; H-SYC-b854f4
      is untouched; every other hypothesis in this goal is untouched.
    - >-
      NO CLAIM TIER MOVES. No claim above toy tier is made or enabled, no
      exponent moves in either direction, no asymptotic or cost claim is made,
      and all four asymptotic-claim promotion gates remain OPEN.
    - >-
      NO CLOSURE QUORUM IS CLAIMED. A budget raise is not a completion
      attestation and this decision records none; no attestation of any kind is
      recorded here.
    - >-
      IT RECONCILES NO BATCH ACCOUNTING, retracts nothing, edits no prior note
      and supersedes no record. Every correction in the goal record is by
      supersession.
    - >-
      IT AUTHORIZES NO SECOND BATCH. Sixty is a ceiling, not a schedule;
      BATCH-009b1b is one batch and the next one is a separate decision.

  limitations:
    - >-
      THE HEADROOM IS UNAUDITABLE. Because the batch counter cannot be evaluated,
      "ten further batches" cannot be checked against consumption, and neither
      this decision nor any future one may assert a remaining balance until the
      accounting is reconciled.
    - >-
      HEAD INCONSISTENCY DISCLOSED, NOT REPAIRED. current_batch_id is advanced to
      BATCH-009b1b but dispatch_queue_path still points at
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-080a9c/dispatch_queue.v5.json,
      so the two head fields now name different batches - the condition
      dispatch_queue_path_note_at_batchab1946_open_20260809 warns about.
      Advancing it was outside this session's declared write instruction. The
      dispatching session must set it to
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-009b1b/dispatch_queue.json
      before dispatching, or record why not.
    - >-
      THE QUEUE AS WRITTEN CARRIES NO ARCHIVE CARDS. BATCH-009b1b's
      dispatch_queue.json contains exactly the two declared tasks. Both required
      Coordinator archives - a snapshot of the run artifacts BEFORE independent
      review, then a ledger archive AFTER it - are still mandatory and are not
      yet carded, and TASK-20260813-4bee82's `archived_by` remains null. This
      session had no allocator and could mint no further TASK ids. The queue will
      not render under tools/research_dispatch.py until those cards exist, and no
      result from this batch is durable or official until an archive commit is
      accepted by the post-commit verifier.
    - >-
      NO EXECUTION IS AUTHORIZED BY THE OPENING ITSELF. The Executor may not
      begin until the frozen contract, DEC-20260813-e0077d and
      TASK-20260813-4bee82 are in a verified commit. A message saying "approved"
      is not an approval.
    - >-
      NOTHING HERE IS DURABLE YET. This decision, the goal-record amendment and
      the BATCH-009b1b control plane are uncommitted; the authoring session has
      no shell, made no commit, wrote no receipt, ran no parser, validator,
      allocator or dispatcher, and asserts no sha and no timestamp beyond date
      precision.
    - >-
      COUNTS PARTLY SECOND-HAND. This session independently enumerated 48
      checkpoint files (naming only 47 DISTINCT batch ids, since BATCH-ef31ab
      carries both BATCH-ef31ab.yaml and BATCH-ef31ab-close-20260808.yaml) and 51
      batch directories CONTAINING a batch.yaml. The 146-directory count and the
      100/2 mismatch are recorded as reported measurements of this session, not
      as this session's own enumeration. That 146, 51 and 48 disagree is itself
      part of the unresolved condition.

