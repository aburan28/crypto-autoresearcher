coordinator_decision:
  id: DEC-20260813-d61a99
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-002
  question_id: RQ-ECDLP-002
  recorded_at: '2026-08-13'

  decision: approve

  decision_type_rationale: >-
    `approve` and nothing else. This decision records a USER-AUTHORIZED campaign
    budget amendment (BUDGET-AMEND-20260813-001, campaign_budget.maximum_batches
    50 -> 60) and opens the one batch that amendment authorizes (BATCH-009b1b),
    dispatching the already-approved frozen contract EXP-ISOU-2ac81f. It is not
    `support`, `weaken` or `reject_scoped`, because nothing has been measured and
    no evidence is scored here. It is not `expand`, because no new research lane
    is opened - the census was already approved by DEC-20260813-e0077d. It is not
    `pause`, because the amendment supplies headroom rather than exhausting it.
    It is not `supersede`, because no prior record is retracted or replaced.

  context: >-
    GOAL-ECDLP-001's declared batch ceiling stood at 50 and the campaign could
    not open another batch: a Coordinator may not self-grant a batch, and every
    prior closing Coordinator that refused to do so was correct. The user was
    shown this, was shown the accounting contradiction recorded below, was asked
    to name an exact value, and authorized one. The batch this amendment
    authorizes carries the EXP-ISOU-2ac81f complete-class ECDLP cost census on a
    P-256-SHAPED toy curve, approved and frozen at version 1 by
    DEC-20260813-e0077d, whose Executor handoff TASK-20260813-4bee82 was written
    dispatch-ready and deliberately NOT dispatched. That approval also required a
    dependent independent Validator to exist before dispatch; TASK-20260813-e183e6
    is that Validator and is written by this decision.

  user_authorization_verbatim: >-
    "maximum_batches: 50 → 60. Ten further batches authorized; a SIXTY-FIRST IS
    NOT."

  user_authorization_status: >-
    IT IS A USER AUTHORIZATION RECORDED BY THE COORDINATOR AND IT IS NOT A
    COORDINATOR SELF-GRANT. Given by the user in this session on 2026-08-13,
    after being shown that the batch budget was exhausted, that a Coordinator may
    not self-grant, and that the campaign's batch counter cannot currently be
    audited. The value is the user's own and is quoted above verbatim rather than
    paraphrased or extended. THE RAISE IS TO SIXTY EXACTLY: batches up to and
    including a SIXTIETH are authorized, A SIXTY-FIRST IS NOT, and a sixty-first
    requires its own budget amendment on its own explicit user authorization.
    Nothing here pre-authorizes one. The Coordinator still does not self-grant a
    batch and nothing in this decision weakens that rule.

  unresolved_batch_accounting: >-
    RECORDED AS UNRESOLVED AND NOT RECONCILED BY THIS DECISION. The campaign's
    batch counter cannot be evaluated from the committed record. Measured
    2026-08-13: 146 batch directories under
    coordination/goals/GOAL-ECDLP-001/batches/ against 48 checkpoint files under
    ledger/goals/GOAL-ECDLP-001/checkpoints/; 100 batch directories have NO
    checkpoint and 2 checkpoints have NO batch directory; the declared cap
    immediately before this amendment was 50, matching neither count; and the
    last auditable batches_consumed figure anywhere in the goal record is 13,
    from the BATCH-013 checkpoint. campaign_budget.total_wall_clock_seconds is
    already recorded in this goal as UNTRACKED and therefore UNEVALUABLE
    (INT-BATCH006-005), so the batch counter is now a SECOND unevaluable budget
    dimension and neither excuses the other. THIS DECISION MUST NOT BE READ AS
    EVIDENCE THAT EXACTLY FIFTY BATCHES WERE CONSUMED, or that any particular
    number was. WHETHER THE FIRST PAUSE CONDITION FIRED ON THE VALUE 50 IS
    UNDETERMINED AND IS LEFT UNDETERMINED: no firing is claimed and no absence of
    a firing is claimed. THE TEN-BATCH HEADROOM IS PROSPECTIVE AGAINST A COUNTER
    NOBODY CAN CURRENTLY AUDIT. THE USER WAS SHOWN THIS CONTRADICTION BEFORE
    AUTHORIZING AND AUTHORIZED ANYWAY; that is recorded as a fact about the
    authorization rather than smoothed away behind a clean number. Reconciling
    the directories against the checkpoints and establishing an auditable
    consumed-batch count remains SEPARATE Coordinator work that this decision
    neither performs nor authorizes anyone to skip.

  batch_count_measurement_correction: >-
    SUPERSEDING MEASUREMENT, RECORDED 2026-08-13 ALONGSIDE unresolved_batch_accounting
    ABOVE, WHICH IS PRESERVED VERBATIM AND NOT EDITED. The corrected enumeration
    is 51 batch directories CARRYING a batch.yaml, and 47 DISTINCT batch ids
    across 48 checkpoint files (BATCH-ef31ab carries both BATCH-ef31ab.yaml and
    BATCH-ef31ab-close-20260808.yaml). The superseded figure 146 counted every
    directory under batches/, including directories with no batch record at all,
    and OVERSTATED the number of batches; the dispatching session that reported it
    accepted this correction. The derived 100-with-no-checkpoint and
    2-with-no-directory figures were computed from the superseded 146 and are
    superseded with it; the corrected equivalents are NOT asserted here, because
    this session has no shell and did not compute them. WHAT THIS CORRECTION DOES
    NOT DO: IT DOES NOT RETROACTIVELY RESOLVE WHAT WAS CORRECTLY LEFT
    UNDETERMINED. 51 batch directories carrying a batch record against a cap of 50
    is the defensible figure and makes a firing of the first pause condition on
    the value 50 look clean rather than ambiguous, BUT LOOKING CLEAN IS NOT A
    DETERMINATION. No firing on 50 is claimed and no absence of one is claimed;
    whether 50 was superseded-while-unconsumed or superseded-while-spent remains
    unsettled. A directory carrying a batch record is not the same object as a
    consumed batch: many concurrent worktrees work this campaign, and directories
    can exist for batches opened and abandoned, remapped, or duplicated across
    lanes, none of which this session can distinguish without a shell. The counter
    remains UNEVALUABLE and reconciling it remains separate, open Coordinator
    work. Recorded in the goal record as
    campaign_budget.maximum_batches_count_measurement_correction_20260813.

  blocker_closures_20260813: >-
    BOTH BLOCKERS FLAGGED IN limitations BELOW WERE CLOSED LATER THE SAME DAY, ON
    IDS PRE-ALLOCATED AND VERIFIED FREE BY THE DISPATCHING SESSION. The limitation
    text is preserved verbatim and not edited; this field supersedes it.
    (1) OPEN-009B1B-HEAD-DISPATCH-QUEUE-PATH is CLOSED: the goal record's
    dispatch_queue_path is now
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-009b1b/dispatch_queue.json,
    with the superseded value preserved verbatim.
    (2) OPEN-009B1B-NO-ARCHIVE-CARDS is CLOSED: TASK-20260813-619d9c (snapshot,
    source_task_ids [TASK-20260813-4bee82]) and TASK-20260813-8a872d (ledger,
    source_task_ids [TASK-20260813-e183e6], declaring EV-ISOU-7c6405 and
    DEC-20260813-61e8a3) are carded in the queue with handoff envelopes in
    ledger/handoffs/, every non-archive task belongs to exactly one archive's
    source_task_ids, and each archive runs alone.
    EV-ISOU-7c6405 AND DEC-20260813-61e8a3 ARE DECLARED DESTINATIONS AND ARE
    DELIBERATELY UNWRITTEN; authoring them now would fabricate the result of an
    experiment nobody has run. CLAIM DISCIPLINE IS UNCHANGED by these closures:
    evidence remains capped at claim_tier toy, dominated_by Pollard rho at
    exponent 1/2, and no status or claim-tier movement occurs anywhere. ONE
    RESIDUAL IS DISCLOSED RATHER THAN REPAIRED: the queue card for
    TASK-20260813-4bee82 carries archived_by TASK-20260813-619d9c, but the
    COMMITTED handoff record ledger/handoffs/TASK-20260813-4bee82.yaml still
    carries archived_by null. That record is already committed and immutable
    (AGENTS.md rule 2) and its own archived_by_note reserves the assignment for
    the Coordinator AT DISPATCH, which has not happened; it was not edited here.
    The dispatching session sets it at dispatch, or directs otherwise.

