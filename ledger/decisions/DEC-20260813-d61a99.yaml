    - >-
      Keep BATCH-080a9c's deferred residual visible: its checkpoint's call for
      one further zero-run static SYC successor is deferred, not dropped, and
      needs its own batch when the head is next free.

  next_actions_status_20260813: >-
    THE FIRST TWO NEXT ACTIONS ARE DISCHARGED, later the same day and by the same
