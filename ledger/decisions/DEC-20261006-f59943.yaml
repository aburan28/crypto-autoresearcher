  context: >-
    /design-experiment, one contract, for IDEA-20261005-e211ac. No
    hypothesis and no experiment on this branch, which was created from
    origin/main, cites that idea. The question id on the idea is
    RQ-SSI-001. The branch design/ssi-e211ac-distance was created from
    origin/main at 3575cc2705c200ffc0c0163c82548ab3335585ce and git merge
    origin/main reported already up to date.

    The prime is p = 83. G_full is the simple supersingular 2-isogeny
    graph on the supersingular j-invariants in F_{83^2}. G_rat is the
    simple graph on the F_83-rational subset with edges only for kernels
    defined over F_83. The prediction is that the ratio of mean pairwise
    distances is at least 3/2. A strictly smaller defined ratio is a
    negative, so success can fail. No path-finding algorithm is claimed
    and the p^{1/4} and p^{1/3+o(1)} bounds are not changed.

    This session opened ledger/questions/RQ-SSI-001.yaml,
    knowledge/open-problems/KN-OPEN-013.md,
    knowledge/techniques/KN-TECH-055.md,
    knowledge/literature/KN-LIT-062.md,
    knowledge/open-problems/KN-OPEN-015.md, and
    knowledge/frontiers/ecdlp/generic-rho/KR-RHO-5b1c0a.yaml. It read
    IDEA-20261005-e211ac from commit efaa5e0b09 via git show and did not
    copy that file. A design-time Hasse-invariant count, not a distance,
    returned supersingular counts 2, 3, 5, 6, 7, and 8 at the primes
    11, 23, 47, 59, 71, and 83. That count names the prime. The executor
    recomputes it. No 2-isogeny and no distance were computed in this
    session. The approval is of the protocol.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, the lexicographic seed, replication,
    budget, stopping rules, invalidation rules, success criterion,
    falsification criterion, and required artifacts are all non-null.
    No field required for approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The assignment of each observation is fixed before any distance. A defined ratio strictly below 3/2 is a negative.
    - Two distance methods, the path-graph null, and the symmetry check give the ratio a way to come back invalid rather than as a false success.
    - Success is only the first assignment row, so success can fail.
    - The named prime is 83 and the named graphs are G_full and G_rat. The protocol does not claim an exponent.

  evidence_refs: []
  limitations:
    - Toy scope only: one prime, p = 83, and a graph whose vertex count is predicted to lie in 8 to 24. No transfer to a cryptographic prime.
    - The recalled Moore bound is a pointer for the heuristic. It is not the counter and it was not opened in a paper.
    - This decision authorizes a later run. It does not start one.

  next_actions:
