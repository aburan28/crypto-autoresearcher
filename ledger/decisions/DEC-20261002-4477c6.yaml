coordinator_decision:
  id: DEC-20261002-4477c6
  context: >-
    Design tick. IDEA-20260926-89886c is the first open ECC idea and is not
    designed. IDEA-20260915-3476de is next and is not designed.
    IDEA-20260926-b6cc43 is the following open idea, and only the Hamming-ball
    cardinalities are frozen.
  decision: approve
  target_ids:
    - IDEA-20260926-b6cc43
    - H-CERTBIN-09c438
    - EXP-CERTBIN-c7cdd2
  rationale:
    - >-
      DEC-20260926-901ea1 NA-4 says not to design the m = 3 pricing contract
      until NA-2's review returns. This session did not find that review.
      IDEA-20260926-89886c stays proposed and uncited by the hypothesis and
      the experiment.
    - >-
      IDEA-20260915-3476de stays undesigned. Its decisive Boolean-native arm
      needs BRiAl, which this session did not install.
    - >-
      Standing user authorization of 2026-09-06 covers approval of the
      cardinality check. The contract names the balls, the written-power
      sides, two routes, and a falsification criterion. It does not build
      a normal basis.
    - >-
      The binomials were expanded in this session. That expansion is not a
      run. The radius-6 ball has 6559349864 elements, strictly below 2^32.7.
      The radius-34 ball is strictly below 2^115, and the written exponent
      exceeds the true logarithm by more than 9.84 bits.
    - >-
      origin/main was already contained in HEAD. origin/main was
      f462195707b5f4ac424eea37a0058147a60df714.
  evidence_refs:
    - ledger/proposals/IDEA-20260926-b6cc43.yaml
    - ledger/decisions/DEC-20260926-901ea1.yaml
  limitations:
    - Approval authorises the count. It does not measure a decomposition cost.
    - The two skipped ideas remain open. Neither is closed by this decision.
  next_actions:
    - Dispatch TASK-20261002-1e56a3 after the TASK-20261002-fd380c receipt verifies.
    - Re-check DEC-20260926-901ea1 NA-2 before designing IDEA-20260926-89886c.
  knowledge_promotion:
    promoted: []
    not_warranted: Unrun counting contract. No finding to promote.
  decided_by: coordinator
  decided_at: '2026-10-02'
