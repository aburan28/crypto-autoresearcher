  limitations:
    - "FG-1 was not independently reviewed; Coordinator-verified only (UC-1). The pre-specified adversarial criterion mitigates but does not replace review."
    - "Implementation-independent, not answer-blind: the contract states the expected image and permits reading the prior manifests for C-1 targets."
    - "Two ~10-bit instances from one configuration family; instances held fixed by design, so no scale or family diversity was gained."
    - "The good-reduction / minimal-model premise still has no null object anywhere in this experiment line (UC-2, carried forward)."

  knowledge_promotion:
    promoted: [KN-FIND-1ba0fe]
    promotion_kind: confidence_raised_not_new_entry
    not_warranted: null
    detail: >-
      KN-FIND-1ba0fe's confidence moves from `preliminary` to
      `toy_scale_two_instances_reproduced_by_three_independent_implementations`.
      No new KN-FIND is minted: the finding itself is unchanged in substance,
      and what changed is the strength of the implementation-independence
      evidence behind it. The entry's existing refusal section is superseded
      additively by a new section recording the discharge, so a future reader
      sees both the refusal and its resolution in order.

  next_actions:
    - >-
      No further work is ranked on the D1 implementation-independence question.
      It is discharged; a fourth implementation would be make-work.
    - >-
      If this finding is ever to move beyond toy tier, the ranked next step is
      SCALE AND FAMILY diversity -- a larger p, a non-minimal model, or a
      supersingular / bad-reduction nearby object -- not more implementations.
      This is available but not dispatched; nothing currently makes it the
      highest-value use of budget for GOAL-ECDLP-001.
    - >-
      The two corpus-level defects identified by the BATCH-e8a3a7 red team
      remain routed and unopened: the undefined `replicated` threshold in
      docs/evidence-and-reproducibility.md, and the absence of `replicated`
      from the KN-FIND confidence vocabulary. This decision works correctly
      within the existing vocabulary rather than settling either question
      unilaterally.
    - >-
      Carry PD-3 forward: any future implementation touching Z/p^r elliptic
      arithmetic in this program must guard non-unit denominators explicitly.
      Silent wrong answers are the failure mode.

