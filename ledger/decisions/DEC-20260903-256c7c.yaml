coordinator_decision:
  id: DEC-20260903-256c7c
  recorded_at: '2026-09-03'

  target_ids:
    - GOAL-ECDLP-001
    - H-ECDLP-a40416
    - EXP-ECDLP-809375
    - KN-FIND-1ba0fe
    - EV-ECDLP-feb897

  decision: support
  decision_label: fg1_discharges_j2_common_mode_objection_confidence_raised_within_kn_find_vocabulary

  context: >-
    Disposes of BATCH-186b38 / RUN-ECDLP-809375-1 (FG-1), commissioned by
    DEC-20260903-9f1190 as the single item that would discharge the J2
    objection which broke the BATCH-e8a3a7 review round. Composed evidence is
    EV-ECDLP-feb897.

  disposition_one_line: >-
    FG-1 DISCHARGES J2. An implementation independent on all three required
    axes reproduces the D1 image on both instances, and control C-1 -- exact
    per-digit agreement on the unique order-n lift -- matched 8/8 digits of x
    and y on both. KN-FIND-1ba0fe's confidence is raised from `preliminary` to
    a precise descriptive compound in the KN-FIND house vocabulary; it is NOT
    set to `replicated`, which is an evidence-strength term with no standing
    in the KN-FIND confidence field.

  decision_scope: >-
    ACCEPTS that the J2 common-mode objection is discharged. J2's claim was
    that RUN-1 and RUN-2 share 266 of ~270 executable lines, so their
    agreement carries likelihood ratio 1 on whether the reported image is a
    property of the mathematics or of the one implementation both share. FG-1
    was designed against exactly that claim and satisfies it on all three
    contract axes (group-theoretic lift with no Hensel iteration; affine
    Z/p^r arithmetic rather than Jacobian; no reuse, affirmatively disclosed).
    Control C-1 is decisive in kind rather than degree: because the order-n
    prime-to-p torsion lift is UNIQUE, a differently-constructed lift either
    equals the recorded one exactly or one construction is wrong, and it
    matched all 8 base-p digits of both coordinates on both instances. THIS
    COORDINATOR INDEPENDENTLY REPRODUCED C-1 WITH A THIRD IMPLEMENTATION
    before accepting it, so three implementations now agree on the
    load-bearing object. ACCEPTS C-3's dose-response result, which upgrades
    the precision-artifact refutation from the indirect form ("the null lift
    differs") to the direct form ("the on-fibre value tracks r": 4->4, 8->8,
    12->12). RAISES KN-FIND-1ba0fe's confidence from `preliminary` to
    `toy_scale_two_instances_reproduced_by_three_independent_implementations`,
    a descriptive compound consistent with KN-FIND house style (the corpus
    already carries values such as
    `derivation_plus_two_independent_reviews_via_genuinely_different_methods_on_one_model`).
    It is deliberately NOT set to `replicated`: that term appears 0 times in
    81 KN-FIND confidence fields and 50 times in evidence `strength`, so it
    belongs on EV-ECDLP-feb897 -- where it is used -- and not here. This
    resolves the malformed-target defect J2 identified rather than working
    around it.

  what_this_decision_does_not_do:
    - >-
      It does NOT claim blindness. FG-1 is an independent IMPLEMENTATION of a
      stated construction, not a blind re-derivation: the frozen contract
      states the lift formula and the expected image, and the executor was
      permitted to read the prior manifests for the C-1 targets. The executor
      disclosed this unprompted and the boundary is carried into
      EV-ECDLP-feb897.
    - >-
      It does NOT rest on an independent review of FG-1, because there was
      none. FG-1 was Coordinator-verified only. Its force comes substantially
      from the discharging criterion having been pre-specified ADVERSARIALLY
      by the reviewer whose objection it discharges, before FG-1 existed. A
      future reviewer may revisit it; UC-1 of EV-ECDLP-feb897 records this.
    - >-
      It does NOT extend scale or family coverage. Instances were held fixed
      on purpose so the implementation was the only variable. That buys
      implementation independence and buys nothing about scale, curve family,
      or non-minimal models.
    - It does NOT reopen or weaken DEC-20260903-9f1190; that decision was correct on its own evidence and FG-1 is the successor it commissioned.
    - It does not change EXP-ECDLP-c373eb's frozen specification, and does not revisit PD-4 or PD-5 recorded against it.
    - It asserts no cryptanalytic improvement, attack, speedup, or breakthrough in any direction.

  non_claims:
    - >-
      Three agreeing implementations is not proof of correctness. It is strong
      evidence against a common-mode implementation error, which is the
      specific and only thing J2 objected to.
    - >-
      The confidence value raised here is descriptive, not a ranking. It says
      what was done -- two instances, three implementations, toy scale -- and
      makes no claim about where that sits relative to other findings.

  correction_recorded:
    id: CORR-INLINE-1
    subject: 'what the RUN-1 / RUN-2 null-lift control actually measured'
    finding: >-
      FG-1's C-3 sweep established that the null-lift family used by
      RUN-ECDLP-c373eb-1 and -2 (`raw_perturbation`, x0 = S.x + p^e) does NOT
      track the perturbation depth e: it reads {0,1} at every depth, because
      the naive integer-representative lift is already off-fibre at depth 1,
      so adding p^e for e >= 2 leaves depth at min(1,e) = 1. The alternative
      `canonical_offset` family does track e, reading {0, min(e,r)}.
    consequence: >-
      The prior runs' null control was VALID AT e=1 and did refute the
      precision-artifact premise as claimed -- that conclusion stands. But it
      was never a tunable dose-response instrument, and no record may cite it
      as one. The dose-response role is now filled properly by FG-1's C-3
      on-fibre-tracks-r result. Recorded as UC-3 on EV-ECDLP-feb897.
    disposition: >-
      This is a correction to an INTERPRETATION never formally asserted, not
      to a committed claim, so no CORR-* record is minted. Prior evidence
      records are not edited; they are immutable and were not wrong in what
      they stated.

  procedure_deviations_recorded:
    - id: PD-1
      severity: informational
      summary: >-
        The executor found that the null-lift instruction admits two
        non-equivalent readings and tabulated BOTH at every cell rather than
        selecting one after seeing results. This is the correct handling of an
        ambiguous instruction and is recorded as a credit, not a fault. The
        ambiguity was in the contract this Coordinator wrote.
    - id: PD-2
      severity: caught_pre_measurement
      summary: >-
        The executor's first implementation used a monolithic affine scalar
        ladder and raised on a non-unit denominator at r=12 -- its own guard
        correctly catching an intermediate [i]L with n|i leaving the affine
        chart. Repaired by staged evaluation; no record was produced from the
        failing code. THIS COORDINATOR INDEPENDENTLY REPRODUCED THIS EXACT
        FAILURE while verifying, confirming it as a genuine property of the
        construction rather than an executor error.
    - id: PD-3
      severity: hazard_recorded_for_future_implementers
      summary: >-
        Found in the Coordinator's OWN verification attempt, not the
        executor's: naive Jacobian formulas over Z/p^r SILENTLY RETURN A WRONG
        ANSWER -- no exception raised -- when H = U2-U1 is a zero divisor,
        i.e. for points congruent mod p but unequal, which is precisely what
        the [s]L ladder traverses. The Coordinator's first check produced
        wrong values for instance B with no error before a non-unit guard was
        added. Any future implementation in this line must guard H explicitly
        or use staged evaluation. This is the more dangerous sibling of PD-2,
        because PD-2 fails loudly and PD-3 fails silently.
    - id: PD-4
      severity: minor
      summary: >-
        DEV-4/DEV-5 from the run: sandbox blocked /usr/bin/time -l,
        contaminating stderr (re-executed unwrapped, byte-identical output,
        resources taken from a separate identical invocation and labelled);
        and a placeholder typed into code.specification_sha256 during drafting
        was replaced with the computed digest before finalising and disclosed
        rather than silently corrected. Both disclosed by the executor.

