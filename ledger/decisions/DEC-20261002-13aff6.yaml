coordinator_decision:
  id: DEC-20261002-13aff6
  context: >-
    Design tick. IDEA-20260926-89886c is the first open ECC idea and is not
    designed. IDEA-20260915-3476de is next and is not designed.
    IDEA-20260916-e6540d is the following open idea, and only the
    degree-cap accounting identities are frozen.
  decision: approve
  target_ids:
    - IDEA-20260916-e6540d
    - H-DREG-25816f
    - EXP-DREG-c1800d
  rationale:
    - >-
      DEC-20260926-901ea1 NA-4 says not to design the m = 3 pricing contract
      until NA-2's review returns. This session did not find that review.
      IDEA-20260926-89886c stays proposed and uncited by the hypothesis and
      the experiment.
    - >-
      IDEA-20260915-3476de stays undesigned. Its decisive Boolean-native arm
      needs BRiAl, which this session did not install. The closure of
      BATCH-a33cda in DEC-20260915-927eaa does not supply that engine.
    - >-
      Standing user authorization of 2026-09-06 covers approval of the
      accounting check. The contract names the five ladder cells, the
      constant sides, two routes, and a falsification criterion. It does
      not build a matrix.
    - >-
      The inequalities were computed in this session. That computation is
      not a run. sqrt(2/ln 2) is strictly above 16986/10000 and strictly
      below 16987/10000. At N = 24 the two-unit step is 331776 when
      omega = 2 and 191102976 when omega = 3. The written threshold
      figure 0.06 lies strictly below 2 to the power -12/5.
    - >-
      origin/main was already contained in HEAD. origin/main was
      5ea5ff661288cb3db3fea3e68bf370f1bb3aee0c.
  evidence_refs:
    - ledger/proposals/IDEA-20260916-e6540d.yaml
    - ledger/decisions/DEC-20260926-901ea1.yaml
  limitations:
    - Approval authorises the identities. It does not measure a yield.
    - The two skipped ideas remain open. Neither is closed by this decision.
  next_actions:
