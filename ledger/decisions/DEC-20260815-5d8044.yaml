  limitations:
    - 'Zero experiment runs. No measurement, curve, target, seed stream or fixture execution exists anywhere in this batch.'
    - 'Nothing in this decision is negative mathematical evidence about H-SYC-b854f4 or about ECDLP; every residual, cap overflow and provenance gap is apparatus signal (AGENTS.md rule 3).'
    - 'Toy 18-to-30-bit ladder only. No crypto-scale, asymptotic, multi-target, extension-field, quantum, transfer or live-key reading is supported by any figure cited here.'
    - 'The 179.20090585-bit threshold is arithmetic about a frozen symbolic expression at fixed capacity and fixed family size, never a scale statement, and may not be quoted without that qualifier.'
    - 'Pollard rho and standard BSGS remain the unchallenged baselines; this batch neither challenges nor approaches them.'
    - 'RT-OBJ-C and RT-OBJ-D establish only that the record closed a question it had not closed. Neither establishes that capacity 32 is adequate.'
    - 'Both independent reviews resolved to the same model, so the convergent defect carries a same-model discount.'
    - 'This decision binds to the bytes at dd84e57db95b66caa2e1445a79db309611deb06b and to nothing later.'
  next_actions:
    - >-
      Author ONE further zero-run static successor to EXP-SYC-75f7d2, by
      citation and supersession with no edit to any committed record, that
      (i) narrows C-HA2-1 from proved-not back to not-proved, or supplies an
      attainment witness and labels it as such; (ii) evaluates the record's own
      closed form min(1, 32768 * 2^(bits*(gamma_x - 1/3)) / 33) at the omitted
      preregistered gamma_x = 0/1 across all five ladder sizes, records 32/33 at
      bits 30 and the per-size crossing, and narrows C-HA2-3, C-HA2-4, B-R1, the
      success_criterion and the report summary to the gamma-qualified statement;
      (iii) corrects the 14-bit literal to 13; (iv) adds the missing setup-process
      term B_0 or the KAT-PEAK-F fixture that exposes its absence; and (v) records
      the seven-versus-eight shard choice as a reasoned deviation rather than
      literal conformance. Also record RT-OBJ-D's HA-3 route in the C-HA2-6 menu
      with its conditionality stated as plainly as ROUTE-A's. Item (d) stays open
      until a task holding cap-amendment authority disposes of it. Never dispatch
      implementation or experiment execution from this decision.
  knowledge_promotion:
