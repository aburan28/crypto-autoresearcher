  rationale:
    - >-
      CONVERGENT DEFECT, the batch's strongest evidential fact. VAL-A723AF-R2
      and RT-OBJ-A reached the same finding independently and without contact:
      clause C-HA2-1 infers worst-case INADEQUACY of capacity 32 from the UPPER
      bound X <= 8*(L-1) with no attainment witness, while the successor's
      other two item-(b) claims (C-HA2-2, C-HA2-3) do supply attaining laws.
      The immutable predecessor EXP-SYC-b11b38 phrased it correctly as "not
      proved ... in the worst-case sense"; the successor converted a correct
      not-proved into an incorrect proved-not. See EV-ECDLP-cb151c
      convergent_defect.
    - >-
      RT-OBJ-C, the sharpest finding, recomputed independently by the
      dispatching session and CONFIRMED EXACTLY. H-SYC-b854f4's test_boundary
      declares four preregistered coverage_gamma_values (0/1, 5/18, 3/10, 1/3);
      the record tabulates two and omits the hypothesis's own declared leading
      null 0/1. At gamma_x = 0/1, bits = 30, with the corrected family size
      m = 32768, the familywise first-moment bound is 32768 * 2^-10 / 33 =
      32/33 = 0.9696969697, NON-VACUOUS from HA-2 alone; and the covering arc
      length p = 2.959280e-05 is below 1/32768 = 3.051758e-05, so the covering
      construction FAILS its own stated hypothesis and the supremum there is
      32/33 rather than 1. The exact crossing gamma_x <= 1/3 - (15 - log2 33)/bits
      is negative at bits 18, 21, 24 and 27 and +0.00147980 at bits 30.
    - >-
      The record's own 98304 -> 32768 family-size correction OPENED that window
      and the blanket sentences were NOT re-checked after it, a point the red
      team made and the dispatching session confirmed: under m = 98304 the
      crossing is negative at every size, -0.05135228 at bits 30. This
      falsifies, at exactly one ladder point, C-HA2-4's "no reparameterisation
      inside the frozen ladder can rescue it", B-R1's "permanently", the
      specification success_criterion and the design-repair-report summary. It
      establishes nothing about capacity adequacy in fact.
    - >-
      RT-OBJ-D. The second moment the record says would require a NEW heuristic
      HA-2T is already numbered HA-3-subpolynomial-root-clustering in the same
      hypothesis record. The method ceiling was UNDER-reached, not over-claimed,
      and the frozen o(1) := 0 convention is load-bearing in both directions
      while the record deployed it only in the direction producing a negative.
    - >-
      RT-OBJ-F, blocking for item (c). The frozen system-peak formula
      max_t ( S + sum_j B_j ) has no term for the co-located setup process's
      private allocations, which the record's own time_base declares present,
      and budget.maximum_memory_gb = 2 is the host-level quantity the formula
      therefore fails to compute. Cheapest falsifier is one line, KAT-PEAK-F.
    - >-
      VAL-A723AF-R1, independently confirmed by the dispatching session: "8184
      needs 14 bits" is wrong, since 2^13 = 8192 >= 8184, so 13 suffice. The
      same check confirms 8*(L-1) = 504/1016/2040/4088/8184 and the excesses
      472/984/2008/4056/8152 are exact.
    - >-
      VAL-A723AF-R3. KAT-PEAK-D binds seven simultaneous shards, not the eight
      the frozen BATCH-080a9c blocker names, while claiming literal conformance.
      The 7+1 choice is defensible and improves discrimination; asserting
      literal conformance instead of recording a reasoned deviation is the
      defect.
    - >-
      WHAT SURVIVED, recorded as a clean integrity finding. Both reviews confirm
      the arithmetic core: all E[X] literals, the Markov bound with its
      attaining law, the covering construction AT THE TWO TABULATED SLICES, the
      closed forms, both thresholds 179.20090585 and 207.73023086, every cap
      figure, and all five KAT fixtures with their falsifiers. Neither review
      found a fabricated hash, an invented run, a fabricated timing or
      statistic, a raised cap, a dropped residual, or any crypto-scale, ECDLP or
      curve transfer reading.
    - >-
      Item (d) remains OPEN at exactly 3256009664, 3285369792 and 7132160 bytes
      under unchanged caps, with the larger 5405757888 alternative archive
      derivation disclosed alongside. It is closable only by a
      Coordinator-authorised cap amendment or scope reduction recorded as a
      versioned protocol_amendment, which this batch had no authority to make.
      Declining to close it was correct behaviour.
    - >-
      A DEFECT IN THIS PROGRAM'S OWN ARCHIVAL WORK is disclosed rather than
      hidden. Validator OBS-V1, confirmed: the snapshot receipt committed at
      dd84e57d retains the authoring Coordinator's prose fields
      path_sha256_state EMPTY_BY_CONSTRUCTION_NOT_BY_OMISSION, parent_sha_state
      NULL_BECAUSE_UNOBSERVED_NOT_BECAUSE_ABSENT and computed_by_this_session 0,
      while the committed file carries three real hashes and an observed
      parent_sha. The error is CONSERVATIVE, understating what is present, and
      non-blocking. The file is committed and immutable: it is recorded for
      supersession by a correction record and no edit to it is proposed.
    - >-
      AN INDEPENDENCE LIMITATION, stated plainly and not softened. Both reviews
      resolved to claude-opus-5. They are independent by SESSION but NOT by
      MODEL. The convergence in the first rationale item is therefore weaker
      evidence than cross-model convergence would be and must not be described
      as independent corroboration across models. The red team's own receipt
      notes that the PREDECESSOR's reviews ran on a different model family;
      this batch's did not, so a correlated-model failure mode common to both
      reviews cannot be excluded by this batch.
