  binding_rules_added_this_batch:
    BR_14: >-
      A REVIEWER'S OWN TASK CARD AND ITS OWN ASSIGNMENT DOCUMENT MUST NOT APPEAR IN
      `blindness.blind_from`. THE BLINDNESS BOUNDARY LISTS ONLY THE SIBLING'S CARD, ASSIGNMENT,
      REVIEW DIRECTORY AND CONSTRUCTIONS. A reviewer's own two documents belong in its
      `sources_read` and in no blind_from list, and a plan may not simultaneously order a reviewer
      to read a document and declare that document a blind_from prefix.
      BASIS: DEC-20260824-257f35 F-1, UPHELD IN FULL AGAINST THIS ROLE. Round 3's plan listed each
      reviewer's own two documents as blind_from prefixes while its own `blind_from_note` said
      they were "expected in its own sources_read" -- two statements a mechanical prefix match
      cannot both satisfy. HAD tools/check_review_independence.py RUN ITS LEAK TEST AGAINST
      `blindness.blind_from` RATHER THAN AGAINST `blind_rederivation.blind_from`, IT WOULD HAVE
      REPORTED A LEAK AGAINST A REVIEW THAT DID NOTHING WRONG, so the round's green PASS is partly
      an accident of which list the tool tests. It is the same class as BATCH-f8bf86's
      double-star-suffixed prefixes that no real path could match: BR-3 fixed the SYNTAX and BR-14
      fixes the SEMANTICS.
    BR_15: >-
      THIS BATCH RUNS AS A LANE ON ITS OWN BRANCH, AND EVERY SUBAGENT LAUNCH IS PRECEDED BY A
      PUBLISHED CLAIM AND FOLLOWED BY A PUBLISHED RELEASE. `tools/goal_lanes.py open-lane` once;
      `claim <queue> <TASK> --as <addr> --ttl-minutes N --publish` before each launch with the TTL
      sized to the task's declared budget plus review slack; `release ... --outcome
      completed|failed|abandoned --publish` on return; the claim epoch recorded in each task
      receipt. Start only Ready Tasks whose claim is null; on a same-task double claim THE LOWER
      EPOCH WINS and the other releases as `abandoned`. Archive commits exclude
      dispatch_queue.json and exclude claims/.
      BASIS: CORR-20260826-f170d2 AND docs/concurrent-goal-lanes.md. THE BATCH-145531 SNAPSHOT
      ARCHIVE SUFFERED A CONTENT BINDING DRIFT FROM A CONCURRENT WRITER ON A SHARED BRANCH: 34
      paths were bound at commit 8b602698a before either reviewer ran, a different session then
      pushed 16 commits to the same branch, one of which appended a regression test to
      tests/test_diffpath_depgraph.py -- one of the bound paths -- and research_dispatch.py
      correctly refused the archive on a content hash mismatch. The merge was clean; there was
      nothing to resolve by picking a side. The binding was superseded by a correction with the
      prior value preserved and the instrument independently re-verified byte-identical.
      WHAT IT DOES NOT CLAIM: a fresh branch does not make content_first binding sound in general.
      The unstated assumption -- that no third party edits an archived artifact between archive and
