  completion_criterion_4_what_this_batch_does_about_it:
    the_problem_stated_from_the_record: >-
      THE CRITERION HAS BEEN REFUSED TWICE AND BOTH REFUSALS WERE READ OFF THE JOINT VERDICTS.
      Round 2: the Validator ADMITTED on the joints it owned while the Red Team DID NOT, with
      three of six owned joints breaking and an explicit statement that the criterion was NOT ITS
      TO DECLARE. Round 3: neither session admits, validator 3 of 4 and red team 0 of 4.
      BUT "THIS JOINT BREAKS" AND "I DO NOT ADMIT THE RUN PACKAGE" ARE DIFFERENT STATEMENTS. A
      joint can break on THE SCOPE OF A CONCLUSION while the package's controls, provenance and
      absence of uncharged assumptions are all in order -- which is precisely what round 3
      measured, since every integer reproduced and every derivation was ruled sound against
      committed source while five joints broke on what the integers LICENSE.
    the_one_concrete_change: >-
      THE REVIEW PLAN REQUIRES EACH REVIEWER TO WRITE AN `admissibility_ruling` BLOCK, SEPARATE
      FROM ITS JOINT FINDINGS, ANSWERING THE CRITERION'S OWN FIVE CONJUNCTS ONE BY ONE --
      controls; certificates; census provenance; equivalence-generator verification status; and
      the absence of uncharged preprocessing, memory, oracle or randomness assumptions -- EACH AS
      ADMIT, DO NOT ADMIT, OR NOT IN MY SCOPE WITH THE REASON. The close then composes the overall
      admission FROM THOSE FIVE ANSWERS and never from the joint scalars or the batch shape.
    what_this_is_not_and_the_distinction_is_the_whole_point: >-
      IT IS NOT A CHANGE TO THE CRITERION AND IT IS NOT A LOWERING OF THE BAR, AND NO
      protocol_amendment IS REQUIRED because nothing about WHAT MUST BE TRUE has changed. The
      criterion's text is untouched; the joints are unchanged in kind; a `breaks` on an owned
      joint remains a break; and A REVIEWER MAY REFUSE ADMISSION ON ALL FIVE CONJUNCTS. What
      changes is that the round ASKS THE CRITERION'S OWN QUESTION DIRECTLY instead of inferring
      the answer from verdicts about something else. CUTTING JOINTS UNTIL NOTHING BREAKS WOULD
      SATISFY THE LETTER AND DESTROY IT, AND THIS IS NOT THAT.
    the_honest_expectation: >-
      THE CRITERION MAY WELL BE REFUSED A THIRD TIME AND THAT WOULD BE A RESULT, RECORDED AS ONE.
      SILENCE ON ANY CONJUNCT IS NOT AN ADMISSION AND READING IT AS ONE WOULD BE MANUFACTURING
      ONE. This opening asserts nothing about what the close will find.

