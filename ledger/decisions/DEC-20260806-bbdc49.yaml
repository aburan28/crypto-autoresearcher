coordinator_decision:
  id: DEC-20260806-bbdc49
  goal_id: GOAL-MLKEM-005
  batch_id: BATCH-5a4656
  recorded_by_task: TASK-20260806-04303a
  authorized_by: GOAL-MLKEM-005
  recorded_at: '2026-08-06'

  decision: weaken
  decision_label: >-
    B2-A's central claim -- that the repaired instrument advances C3 to where the real arm's P1/P2
    result is interpretable -- is RETRACTED: it independently, unknowingly reproduces a construction
    a sibling batch on this same goal had already formally refused as an adjudicator, for a reason
    both this batch's own reviewers and the sibling's own reviewers establish precisely. C3 remains
    UNMET. B2-B, B2-C and B2-D are UNAFFECTED and stand as genuine, if partial, contributions: C1's
    lane structure, a draft normative-gap finding, and a corrected literature-acquisition procedure.
    GOAL-MLKEM-005 REMAINS active; this decision closes neither the goal nor supersedes
    DEC-20260806-14ac13's still-outstanding next_actions.

  context: >-
    Batch dispatched from a stale read of DEC-20260805-4823db's next_actions, after this session's
    branch was restarted from a fresh `main` following a PR merge, without re-reading
    `ledger/goals/GOAL-MLKEM-005.yaml`'s live state. Two further Coordinator decisions
    (DEC-20260806-00deff, DEC-20260806-14ac13), produced by a separate lineage on this identical
    goal and already merged into that `main`, had superseded and then formally refused the exact
    instrument construction this batch's B2-A was dispatched to repair. Discovered by this batch's
    own independent red-team review (RT-20260806-1b95a1, objection O1) after the batch's four
    producers and its snapshot were already committed.

  coordinator_validity_check: >-
    Both reviews ran in independent sessions after the snapshot commit and neither committed its own
    artifacts. The validator independently re-derived B2-A's P3/P4/P5 from raw results.json (not
    report.md's tables) and confirmed all figures exact; it also independently confirmed the D-1
    construction-defect claim both empirically (a bit-for-bit JSON diff between the two preserved
    runs) and mathematically (re-deriving the QR-rescaling-invariance argument from first
    principles). The red team independently verified the parallel-lineage collision against git
    ancestry (`git merge-base --is-ancestor a2fdca0ed 0c02c832b`) and against a full-text grep of
    this batch's own dispatch queue and task directories for any citation of the superseding
    decisions (zero hits). The Coordinator re-verified both checks directly, and independently
    re-read DEC-20260806-00deff and DEC-20260806-14ac13 and EV-MLKEM-94c773 in full before writing
    this record; reviewer independence is procedural only, as in every prior batch of this campaign.

  what_is_weakened:
    - >-
      B2-A's headline claim, verbatim from the snapshot commit: "the real arm's P1/P2 result is
      READ AS INTERPRETABLE at this toy scale." This is withdrawn. The pre-registered branch logic
      that licensed it required P3 and P4 to hold and P5 to be consistent; P4 (an instrument-
      arithmetic check) is unaffected, but P3 -- the actual adjudicating gate -- is not a valid test
      of the object it claims to test. Per DEC-20260806-14ac13 / EV-MLKEM-94c773, on the identical
      construction: "P3 RETURNS ITS MAXIMUM POSSIBLE DEPARTURE ON Z^d... An ambient isometry INVERTS
      the verdict on one lattice: identity gives DEPARTURE at z=+465.48, DCT gives ANOMALY_BELOW_NULL
      at z=-17.98, and Haar gives AGREEMENT at z=-0.50." B2-A's coordinate-aligned (t=0) arm is that
      same extremal object; its 46.8-73.1 SE separation from the Haar arm is guaranteed by that
      choice of comparator and is not evidence about the BKZ-reduced basis.
    - >-
      P5, the pre-registered ~1/sqrt(beta) falsifier. It is computed from P3's signed shift as its
      "departure" metric, so it inherits P3's defect: a quantity guaranteed to be extremal at t=0
      regardless of lattice structure cannot license an inference about how that extremality decays
      with beta as if it were a lattice-structure signal. The measured direction-consistency (decay
      at both d=100 and d=140) is not retracted as a fact about the statistic's own behaviour, but it
      is not read as evidence about ML-KEM's underlying tail law.
    - >-
      "The frozen 4s gate failed... BECAUSE the demonstration has expected contrast exactly zero" --
      superseded language this batch inherited from BATCH-a51f91 and did not re-litigate, now doubly
      superseded: DEC-20260806-14ac13 additionally measures the "4 SE" gate style as a roughly
      0.2 percent test rather than the nominal 3e-5 (a factor of about 60), a defect this batch's own
      B2-A did not carry forward or correct because it declared its own, differently-derived
      SE-of-the-difference threshold. Recorded here so a future reader does not conflate the two
      distinct threshold-calibration defects across the two lineages.

  what_is_strengthened:
    - >-
      An independent, zero-cost demonstration (RT-20260806-1b95a1 O2) that P1/P2 -- the ONLY predicate
      that reads the real arm -- lack demonstrated power at the relevant magnitude: applying P1's own
      frozen 5% threshold to this batch's own already-committed unreduced-arm figures (a departure
      B2-A's own report.md calls "real, non-forced") scores it a PASS in 3 of 4 cells. This
      corroborates, by an entirely different route, DEC-20260806-00deff's earlier finding that P1/P2
      return identical verdicts on the null and real arms in all four cells. Two independent
      demonstrations, on two different data sets, now support the same conclusion: P1/P2 as currently
      specified cannot adjudicate C3 regardless of what sensitivity gate accompanies them.
    - >-
      B2-B's C1 lane split. Neither reviewer raises a material objection to the normative lane's zero
      bound (G <= log2(1) = 0, curvature-independent); the red team's O4 softens only the confidence
      qualifier for R20 specifically (SSH rekeying is textually unaddressed, not textually forbidden),
      which does not change the M=1 conclusion.
    - >-
      B2-C's normative-gap draft and B2-D's acquisition procedure. No material objection from either
      reviewer to either producer.
    - >-
      P4 (the Gaussian null-of-the-null) as a narrow, still-legitimate instrument-arithmetic check --
      independently re-derived and confirmed by the validator -- though its relevance is now smaller
      than the batch intended, since it was never a defense of P3 as an adjudicator and P3 is refused
      regardless of P4's outcome.

  goal_disposition:
    record: GOAL-MLKEM-005
    from: active
    to: active
    status_unchanged: true
    current_batch_id_unchanged: >-
      LEFT AS BATCH-a44d08, inherited from `main` and not overwritten by this record. BATCH-a44d08
      is the goal's actual furthest-progressed, still-open next step (opened by DEC-20260806-14ac13,
      partially executed on a separate unmerged branch as of this record's date) and this batch does
      not supersede or reset it.
    why_not_completed: >-
      C1 is at most partially met (the normative lane only); C3 remains unmet by this batch's own
      admission and by both its reviewers' explicit adjudication. The stop rule requires C1-C3 met.
      The red team states plainly: "The goal MAY NOT close under its own stop rule on the strength of
      this batch alone."
    why_not_closed_at_budget: >-
      Structurally impossible for this goal (maximum_batches and total_wall_clock_seconds are both
      null by design), unchanged from every prior record in this campaign.
    why_not_paused: >-
      No pause condition applies. The parallel-lineage collision is a process defect, not an
      infrastructure failure of the kind pause_conditions names, and none of pause_conditions'
      other three entries applies.
    non_terminal_conditions_live_this_batch: >-
      A candidate mechanism (B2-A's repaired sensitivity gate) is refuted as an adjudicator -- barred
      from closing or pausing the goal by GOAL-MLKEM-005's own non_terminal_conditions, and this
      record does not cite it that way.

  coordinator_error_corrections:
    - id: CE-1
      severity: material
      defect: >-
        Dispatched BATCH-5a4656's central producer to repair an instrument construction two further
        Coordinator decisions, already committed and merged before this batch was opened, had already
        superseded and then formally refused. Root cause: after a branch restart following a PR merge,
        this session re-merged and re-validated `main` but never re-read
        `ledger/goals/GOAL-MLKEM-005.yaml`'s live `current_batch_id`/`next_action`, instead designing
        the next batch from a remembered decision predating the restart.
      raised_by: RT-20260806-1b95a1 O1, independently verified by the Coordinator against git ancestry
      cost: >-
        A full batch of real BKZ-reduction compute (B2-A alone: ~14 minutes wall clock, 4 cells x 8
        bases) spent re-deriving a conclusion already on the record. B2-B/C/D were unaffected and
        remain a net positive contribution from the same batch.
      remedy: >-
        Before minting any new batch on any goal, re-read that goal's live `current_batch_id` and
        `next_action` from the committed record itself, not from session memory, even immediately
        after a successful merge and passing validator run -- a consistent tree does not imply the
        plan being executed is still current.
    - id: CE-2
      severity: minor
      defect: >-
        Snapshot commit 8a121df9 rounded B2-A's P3 range to "46.8-73.2 SE" (true max 73.14551..., which
        rounds to 73.1) and stated B2-D's hash-instability finding as settled fact ("in the TU/e
        repository's per-request serving") without the hedge B2-D's own receipt.json carries -- this
        sandboxed environment's own egress/TLS-interception proxy, through which every fetch was
        routed, has not been ruled out as an alternative source.
      raised_by: VAL-20260806-7b2a09 DEF-3 and DEF-2/DEF-4
      remedy: >-
        Corrected in EV-MLKEM-24d037: "46.8-73.1 SE"; the hash-instability attribution restated as
        "source unconfirmed -- the environment's own egress proxy has not been ruled out."

  design_findings_this_batch:
    - id: DF-1
      finding: >-
        A CONTROL'S PASS ON A SYNTHETIC EXTREME DOES NOT LICENSE READING A DIFFERENT PREDICATE'S PASS
        ON REAL DATA AS INTERPRETABLE. B2-A's pre-registered branch logic treated P3/P4/P5 passing as
        sufficient to read P1/P2's real-arm result. But P1/P2 are the only predicate that actually
        reads the real arm, and nothing about P3/P4/P5 passing establishes P1/P2 has power to detect
        anything -- this batch's own zero-cost demonstration (O2) shows it does not, at the relevant
        magnitude. A pre-registered branch structure is only as sound as the independence of what it
        licenses from what it tests.
      raised_by: RT-20260806-1b95a1 O2, generalized by the Coordinator from its specific finding
    - id: DF-2
      finding: >-
        RESTATED FROM THE SIBLING LINEAGE, NOW WITH A SECOND, INDEPENDENT CONFIRMATION: a statistic
        built by comparing against a coordinate-aligned reference frame is, in general, measuring
        frame orientation, not lattice structure, unless separately shown invariant under the
        transformations that preserve the lattice. This batch's B2-A reproduced the defect without
        awareness of the sibling lineage's AM-4 finding; that two independent construction attempts
        converged on the same flawed adjudication method from different starting points is itself
        evidence the failure mode is a natural one for this class of instrument, not a one-off error.
      owed: >-
        This is the SEVENTH instance of the pattern DEC-20260806-14ac13 names ("every one of them was
        scored where its own defect could not appear"), by that decision's own count of six plus this
        one. Belongs on a KN-TECH entry once a successor confirms it outside GOAL-MLKEM-005; rule 12
        is UNMET and UNWAIVED here.

  explicit_non_claims:
    - >-
      No ML-KEM break, no security claim in either direction. Session recovery, not key recovery.
    - >-
      This decision does not re-adjudicate anything DEC-20260806-14ac13 already decided about
      BATCH-436ddd or BATCH-f19c37; it defers to that record on the P3-refusal finding and cites it
      rather than re-deriving it.
    - >-
      "C1 partially met" is not "C1 met." The count-unstated deployment lane still has no bound, and
      whether a per-lane statement satisfies C1's text for the goal as a whole is left open, since C3
      is unmet regardless and the stop rule requires all of C1-C3.
    - >-
      A verified archive is not a result. This commit makes the batch's actual findings -- including
      its central retraction -- durable; it does not upgrade anything's strength or scope.

