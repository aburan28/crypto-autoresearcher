      - stack: BINSTD 1708 > 1717 (EXP-BINSTD-fdd2d9 run and review; dbca92 design)
        class: "split: dbca92 design part a, fdd2d9 part b"
        unit: U6
        wave: 2
        redundant: "experiments/EXP-BINSTD-dbca92/**, DEC-20261003-419f13, H-BINSTD-b334a6, IDEA-20261003-4f41d0 and the TASK-20261003-82801d queue: main holds its own versions, which it ran and reviewed (EV-BINSTD-56c2bc, DEC-20261003-95d6b8). The branch versions are earlier drafts of the same task and are preserved, not landed."
        unique: "fdd2d9 runs RUN-BINSTD-51ad99, -e55dcf (with certificate.yaml), implementation, stage0/1, trial plans, RESULTS.md, analysis.md, review plan, exec-admit amendment; DEC-20261003-6c2db4, -a0dec7; EV-BINSTD-1a0c8d; TASK-20261003-11b469, -c9329a, -29f20b, -5829a7"
        gate: "F1 and F2 on fdd2d9 specification.yaml and H-BINSTD-f9fa00 (M on #1717)"

  # ---------------------------------------------------------------------------
  # R2. Mechanism: TRANSPLANT. Legitimacy, authority, and the hypothesis question
  # ---------------------------------------------------------------------------
  R2_mechanism:
    why_not_merge_the_old_branches: >-
      A merge of main into these branches meets add/add conflicts inside
      immutable records on 13 PRs. Each can only be resolved by choosing one
      side's bytes, which AGENTS.md "Durable research commits" forbids. It also
      carries the 15 failing dispatch queues, the stack-ordering problem, and
      the eb9e5e cross-stack dependency along with it.
    transplant_definition: >-
      For each unit: one fresh branch cut from the then-current origin/main.
      It copies, byte-identical (git checkout <source_head> -- <path>), every
      path that (i) has status A in the source PR's three-dot diff against
      origin/main, (ii) does not exist on origin/main at the time of the copy,
      and (iii) passes the gates. It adds only the superseding records of the
      closed error map. It writes nothing at a path that exists on main.
    legitimacy: >-
      Immutability binds bytes and identifiers, not commit ancestry. Archive
      receipts bind content first; commit reachability is advisory (CLAUDE.md
      "Archive receipts bind to CONTENT first"). A byte-identical copy under
      the same path keeps every identifier and every sha256 a receipt
      declares. Source provenance is recorded per path: PR number, head sha,
      blob sha and sha256. The source PR refs remain fetchable after closure.
      Nothing is renamed, re-serialized or edited, so AGENTS.md rule 15 is not
      engaged.
    authoritative_version: >-
      MAIN. Where a path exists on main and differs on a branch, main's bytes
      are the official record. They were merged, validated, and are what every
      later main record was written against (e.g. H-BINSTD-5c4afb history
      includes DEC-20261003-d4ae67, which no 1686-chain branch carries). A
      branch version is an unpublished draft. Its extra content, typically
      status_history entries citing branch-only decisions, is a CLAIM that
      becomes official on main only through a main-side Coordinator decision
      after those decisions land. That is the standard state-transition route
      (AGENTS.md "Research states"). It does not pick a side in a conflict:
      main's bytes are untouched, the branch's bytes are preserved in full as
      provenance, and the transition is re-decided on landed evidence.
    hypothesis_collisions:
      rule: >-
        A colliding hypothesis (or experiment specification) is never landed
        and never merged textually. The branch blob is preserved under the
        provenance path. Then F3 (or F2 for M paths) classifies the difference.
      status_only_difference: >-
        The branch version equals main's version except for status,
        status_history entries and update bookkeeping. NO new hypothesis record
        is written. The decisions behind the branch-only entries land as their
        own files in the transplant. The repair session lists each pending
        transition in status-reconciliation.yaml. A later Coordinator decision
        (not the repair session) verifies the deciding decision's archive and
        appends the transition to main's record in its own ledger archive, or
        records why not.
      substantive_difference: >-
        Any other field differs (statement, mechanism, predictions,
        test_boundary, falsification_conditions, heuristic_assumptions,
        proof_search_map, asymptotic_claim, interpretation_limits). That is a
        genuine identifier collision: two hypotheses share one id. The repair
        session STOPS on that unit and reports the diff. Only the Coordinator
        authors the resolution, under a new decision.
      superseding_hypothesis_shape: >-
        Precedents: H-BINSTD-099d93 (lines 42-53), H-SSIQ-36e970,
        H-PFDR-cf8ca6. New id minted by the dispatcher (allocate_id --next
        hypothesis --area <AREA>, then --check). Fields of
        templates/research-records.md "Hypothesis", copied VERBATIM from the
        version that the landed runs actually executed against, as identified
        by F1 pins. Added fields: version (2), supersedes (the colliding id),
        and supersession_note. The note names the authoring decision, the
        source PR, head sha and blob sha256 of the copied version, the main
        blob sha256 it diverges from, and every landed record that cites the
        old id while meaning this version. status is set only to what landed,
        receipt-verified decisions support, and status_history entries each
        cite one such decision. The old record is not edited. Its status moves
        to superseded only by the authoring decision, and only if the program
        continues on the new version; otherwise both stand and the note says
        which records belong to which.
    experiment_directories_with_colliding_protocol: >-
      Where main holds an experiment's specification, implementation or trial
      plan and the branch's differs (M or add/add), branch paths under that
      experiment directory land only if F1 shows that every protocol sha256
      pinned by the branch's stage0 files and run receipts equals main's bytes,
      and F2 or F3 shows a status-only difference. Otherwise nothing under
      that directory lands from that unit. ffc4f4 and dbca92 are expected to
      fall here and are excluded by construction (R1).
    archive_receipts: >-
      A transplanted archive receipt (snapshot, ledger, tip or run-session
      receipt) is written at its live path only if every path it binds lands
      byte-identical or already exists on main byte-identical. Otherwise it is
      preserved as provenance only. The records it archived are listed as
      "archive not verifiable on main" and keep no more standing than G-6
      gives them.
    standing_of_landed_records: >-
      G-6, restated: landing is not endorsing. Each landed record keeps exactly
      the standing its own archive gives it. A decision whose archive receipt
      verifies on main, or is ratified by the later reconciliation decision,
      is official as recorded. Otherwise it is landed but unofficial, and the
      repair receipt says so per record.

  # ---------------------------------------------------------------------------
  # R3. Value arithmetic (rule 9) and ranking
  # ---------------------------------------------------------------------------
  R3_value:
    alternative_considered: >-
      Leave the branch evidence as PR artifacts, record that in the goal's
      impediments, and re-derive any decision-critical result on main through
      fresh, smaller tasks.
    finding_for_main_cited_units: >-
      NOT AVAILABLE for U1, U2, U3 and U4. Main's immutable records already
      cite the stranded IDs (main_side_facts.main_records_citing_branch_only_ids).
      A re-derivation mints new IDs, so those 31 ledger records and 5
      experiment directories would cite nonexistent records permanently.
      Among them are approved protocols whose stated basis is unpublished
      (EXP-CERTBIN-66e167 under DEC-20261003-fa8703; EXP-BINSTD-791e4c;
      EXP-BINSTD-81b161; EXP-BINSTD-dbca92). Landing is mandatory for
      referential integrity, not merely preferable.
    cost_comparison:
      transplant: >-
        Zero scientific runs. Read-only git for the T-0 facts. Byte copies of
        roughly 115 ledger records and 25 run directories over 8 units. About
        10 superseding manifests, 6 to 9 schema-supersession v2 records, and
        registry appends. One CI cycle or more per unit. Order of one to two
        Coordinator sessions.
      re_derivation: >-
        For the main-cited units alone: 14 run directories (U1 3, U2 4, U3 5,
        U4 0, plus the review rounds behind 9 decisions) re-executed and
        re-reviewed, yielding NEW evidence (new seeds) rather than the
        evidence main cites. Strictly more compute and reviewer time, and it
        still leaves the citations dangling.
    finding_for_uncited_units: >-
      For U5, U6 and U7 the runs exist and the defects have precedented
      superseding fixes. Transplant cost is a small fraction of re-execution,
      so landing ranks above re-derivation, subject to the F1 gate. If F1
      fails, re-derivation becomes the only clean route for that experiment,
      and the unit is returned to the Coordinator with that finding. U9 is
      the same arithmetic at lower scientific value (see deprioritization).
    ranking:
      - {rank: 1, unit: U1, why: "main-cited; 4 ledger records + 3 runs; both source PRs merge clean with main; only mapped defects (E1, E5)"}
      - {rank: 2, unit: U4, why: "main-cited; 1 decision + 5 handoffs, 0 runs; the stack is otherwise redundant, so four PRs close after it"}
      - {rank: 3, unit: U2, why: "main-cited by the widest set (dbca92 and 791e4c lineages); 18 ledger records + 4 runs; mapped defects E8, E9, E10"}
      - {rank: 4, unit: U3, why: "main-cited (81b161 lineage); 20 ledger records + 5 runs; carries the 9b18fc -> 4b846c dependency in one unit; defects E8 x2, E9 x2"}
      - {rank: 5, unit: U6, why: "uncited; a support decision on H-BINSTD-f9fa00 with certificate-bearing runs; 7 ledger records + 2 runs; gated F1/F2"}
      - {rank: 6, unit: U7, why: "uncited; expand decision on H-BINSTD-85e778; 3 ledger records + 2 runs; gated F1/F2/F5"}
      - {rank: 7, unit: U5, why: "uncited; most recent CERTBIN results (Stage 2 O-E-POLY recaptured per #1733 title); 29 ledger records + 7 runs; heaviest defect load; gated F1/F2"}
      - {rank: 8, unit: U9, why: "uncited; RSS-band memory instrument whose hypothesis states NO ATTACK and NO EXPONENT; 30 ledger records + 6 runs; includes the review of three ff5050 runs already on main"}
    wave_order_note: >-
      Wave 1 (U1, U4, U2, U3) is ordered by cost within equal value, because
      all four repair existing main citations. Wave 2 (U6, U7, U5) is ordered
      by cost, NOT value. Exponent relevance cannot be judged from PR titles,
      and no wave-2 unit may be dropped for cost. U5 is not deprioritized by
      being last in wave 2.
    deprioritization_U9:
      evidence: >-
        H-BINSTD-ce918e statement (main lines 54-65): heuristic validation of a
        memory instrument, "NO ATTACK; NO EXPONENT", toy cells n=17. Branch
        outcomes per PR titles: eb9e5e and 55feb5 inconclusive, 9001b3 O-SUPPORT
        then replicate (EV-BINSTD-c45564), a33de2 a designed but unrun
        replication. docs/target-result-profile.md ranks this below
        exponent-moving work.
      budget: Same transplant mechanism; marginal cost about 30 ledger records, 6 runs, 2 S3 handoffs, 2 S4 manifests, 2 or more queue relocations.
      test_boundary: n = 17 toy binary cells, l in {3, 4}, peak RSS via resource.getrusage, stdlib XOR-SAT pin (H-BINSTD-ce918e test_boundary).
      remaining_uncertainty: >-
        Whether the 9001b3 O-SUPPORT replicates (a33de2 is unrun). Also, the
        three ff5050 runs on main (RUN-BINSTD-6f3d5b, -c45fde, -f9a1d3) have
        their review only on #1682/#1688 (EV-BINSTD-0fed43).
      disposition: >-
        SCHEDULED, LAST. It is performed in TASK-20261005-34c6e8 after waves 1
        and 2 are each merged or stopped-with-report. It is not abandoned. If
        the session watchdog expires first, U9 stays named in the goal
        impediment and the C5 re-rank decides it.
      revisit_condition: >-
        The C5 re-rank, or earlier if any later decision needs ff5050's review
        (EV-BINSTD-0fed43) or the 9001b3 result on main.
    parked_U8:
      evidence: R1 row for 1691 > 1698 > 1705.
      remaining_uncertainty: Whether the Stage 2-3 runs (RUN-BINSTD-441e0e, -b2d17e) executed under an authorized amendment, or under unauthorized edits to frozen files.
      revisit_condition: >-
        F8 computed (read-only) by TASK-20261005-34c6e8 T-0 and returned. The
        Coordinator then decides between a superseding experiment record that
        carries the amended protocol under a new EXP id with the runs mapped to
        it, and re-derivation.
      not_negative_evidence: An archival defect says nothing about H-BINSTD-85e778.

  # ---------------------------------------------------------------------------
  # Transplant rules and the closed error map (bind TASK-20261005-34c6e8)
  # ---------------------------------------------------------------------------
  transplant_rules:
    - id: T-0
      rule: >-
        FACTS FIRST, READ-ONLY, per unit, written to
        coordination/archives/TASK-20261005-34c6e8/t0-facts.yaml before that
        unit's first write. (F0) Each source PR's head sha now, compared with
        the inventory; a moved head is re-listed. (F1) Protocol pins: every
        sha256 that the branch's stage0 files, launch.json,
        execution-receipt.json and manifests pin for a path that exists on main,
        compared with main's blob. (F2) For each M path: a field-level diff
        against main, classified status_only or substantive. (F3) For each
        add/add path: the same classification, plus whether main's text is an
        entry-wise prefix of the branch's. (F4) For each archive receipt among
        the unique paths: the bound paths and whether each lands
        byte-identical. (F5) For each path carried by more than one in-scope
        PR: blob identity across those PRs. (F6) The unique-path list with blob
        sha and sha256, and the excluded-path list with reasons.
    - id: T-1
      rule: >-
        SOURCE. Within a linear chain the source is the top PR of that chain in
        the unit. Across chains or forks (U3: 1689 and 1709; U9: 1688 and 1729;
        U7 against the 1698 fork), a path whose blobs differ is not written. It
        is preserved and the unit stops on it (SG-4).
    - id: T-2
      rule: >-
        NEVER WRITE AT A MAIN PATH. No transplant commit may modify or delete a
        path that exists on origin/main, except appends to
        tools/run_supersession_registry.yaml and
        tools/schema_supersession_registry.yaml (G-4). Check:
        `git diff --name-status --diff-filter=MD origin/main...HEAD` lists only
        those two files.
    - id: T-3
      rule: >-
        PROVENANCE. Every branch blob not written at its live path (collided,
        M, unparseable, relocated queue or receipt) is copied byte-identical to
        coordination/archives/TASK-20261005-34c6e8/provenance/PR-<n>/<original
        path>.blob. The .blob suffix keeps record parsers and identifier scans
        off a duplicate id. Its sha256 is recorded in the unit receipt.
    - id: T-4
      rule: >-
        SEQUENTIAL UNITS. Each unit branches from origin/main after the
        previous unit has merged, so the shared registries never conflict
        between transplant PRs. Branch name coordinator/transplant-34c6e8-<unit>.
        One PR per unit against main, with merge commits only, merged only on a
        head whose CI checks all concluded success or skipped, with no conflict
        and no open blocking thread. Never re-run or skip a check.
    - id: T-5
      rule: >-
        CLOSE SOURCE PRS after their unit merges, and only if every A path of
        the PR is now on main byte-identical or is listed in the provenance
        table with a reason. The close comment cites the transplant PR, this
        decision and the provenance paths. PRs of a stopped or parked unit stay
        open with a comment pointing to the stop report.
    - id: T-6
      rule: >-
        IDs only from the dispatcher (allocate_id --next, then --check), for
        any S2 KN-FIND, any S3 control task, or any superseding record. Never
        invented.
  closed_error_map:
    note: >-
      Applies to CI on transplant PR heads only. A line that maps to no entry
      stops the unit (SG-1). Precedents are those of DEC-20261005-040d37 S1 to
      S4.
    entries:
      - {id: E1, line: "<run>/manifest.yaml: expected top-level key 'run'", remedy: "040d37 S4 (manifest_v2 + run_supersession entry; companions only as byte copies), or S1 form (manifest_v3, v2 pinned as intermediate_record) when a v2 exists"}
      - {id: E2, line: "run.result.certificate.kind must be one of ...", remedy: "040d37 S1: manifest_v3 with kind none unless the run package holds a wrapper-reverified solve or relation certificate; v2 pinned as intermediate_record; the branch's registry entry pointing to v2 is NOT copied, and a new entry pointing to v3 is appended"}
      - {id: E3, line: "<manifest_v2>: invalid YAML ... / registered superseding run manifest declares run id None", remedy: "the unparseable v2 is not written at its live path (T-3 provenance); manifest_v3 built from archived bytes pins the provenance blob by path and sha256; one new registry entry; the branch's entry is not copied"}
      - {id: E4, line: "evidence|decision references unknown run|experiment|target X", remedy: "resolves when X is in the same unit or an earlier merged unit; if X is in no unit, STOP"}
      - {id: E5, line: "derived 'unknown run' lines whose run is fixed by E1 to E3 in the same unit", remedy: "none beyond E1 to E3"}
      - {id: E6, line: "decision lacks knowledge_promotion", remedy: "040d37 S2, schema-supersession v2 in ledger/corrections/schema-supersessions/<YYYYMMDD>/, promotion rule applied, KN-FIND id from the dispatcher if required"}
      - {id: E7, line: "review_plan.proves_too_much.objects is required", remedy: "040d37 S3 (case a or b, deviation disclosed). Any OTHER review_plan defect (claim_under_review, joints owner, attack plan or text) is NOT mapped: STOP"}
      - {id: E8, line: "IDEA citation provenance 'recalled' vs novelty_status / prior_art required / prior_art.nearest ref must resolve", remedy: "schema-supersession v2 of the IDEA: novelty_status set to unverified (the validator's own prescription); prior_art added with frontier_map knowledge/frontiers/ecdlp, rows_checked = KR rows the repair session actually read on the stated date, nearest >= 1 resolving entry or none_found_after; an unresolvable nearest entry moved verbatim into prior_art.searched; schema_supersession_note says 'prior_art composed post hoc on <date> by TASK-20261005-34c6e8 under DEC-20261005-fe9f9f; the idea was not compared before it was written'"}
      - {id: E9, line: "dispatch error or queue reference error naming a transplanted dispatch_queue.json or its archive task", remedy: "remove that queue (and receipts or claims under its directory that it governs) from the transplant branch's live paths, preserve as provenance (T-3); list the tasks whose queue state is not on main; no queue is edited"}
      - {id: E10, line: "kb SchemaSupersessionError: registry record N missing ['kind'] / validator 'failed without one normal error summary' on a branch schema-registry append", remedy: "a run-supersession-shaped entry found in a branch's tools/schema_supersession_registry.yaml is re-appended to tools/run_supersession_registry.yaml with identical field values; the schema-registry entry is not copied; source line range and blob sha recorded"}
      - {id: E11, line: "flat ff5050 manifests (U9 only)", remedy: "expected to clear on main's existing v2 registrations; if it does not, STOP"}
  stopping_gates:
    - {id: SG-1, gate: "any CI line on a transplant head outside E1 to E11: stop the unit, report the line verbatim"}
    - {id: SG-2, gate: "F1 pin mismatch for any run: nothing under that experiment directory lands; stop the unit"}
    - {id: SG-3, gate: "F2 or F3 substantive difference on a record that a landing record depends on: stop the unit; Coordinator authors the resolution (R2.hypothesis_collisions)"}
    - {id: SG-4, gate: "F5 blob mismatch across chains or forks for a path the unit needs: stop the unit"}
    - {id: SG-5, gate: "T-2 check lists any path other than the two registries: stop; nothing is pushed"}
    - {id: SG-6, gate: "a required KN-FIND or S3 control id is not yet minted: the unit waits; nothing is invented"}
    - {id: SG-7, gate: "a target path appears on origin/main between T-0 and the copy (another session landed it): redo T-0 for that unit"}
    - {id: SG-8, gate: "a live lane claim or bus notice shows another session working these PRs: stop before any write"}
    - {id: SG-9, gate: "watchdog expiry: checkpoint, never evidence; the next session resumes from t0-facts.yaml and unit receipts"}

