# =============================================================================
# DEC-20261005-fe9f9f -- REVISION of the stranded-evidence REPAIR SPECIFICATION
# (supersedes DEC-20261005-040d37 C2 additively; 040d37 is NOT edited).
#
# THE ONE THING TO TAKE AWAY: the stranded BINSTD/CERTBIN records are not an
# optional side-lane. Main ALREADY CITES them. 31 ledger records and 5
# experiment directories on main name decision, evidence, hypothesis or
# experiment IDs that exist only on draft PR branches #1680 to #1733 (e.g.
# EV-BINSTD-78ca0d approval_ref DEC-20261003-b240df; H-CERTBIN-c50454 and
# EXP-CERTBIN-66e167 cite EV-CERTBIN-db7f15 / DEC-20261003-34a65b). Re-deriving
# that evidence under new IDs cannot repair those citations, because the citing
# records are immutable. So the cited records must land, byte-identical, under
# their own IDs.
#
# Merging the old branches cannot do that without picking sides inside
# immutable records (add/add on H-BINSTD-ce918e, -5c4afb, -39a59f, -b334a6,
# H-CERTBIN-4d3853 and five EXP specifications). The mechanism is therefore a
# TRANSPLANT: fresh branches off main that copy ONLY paths absent on main,
# byte-identical, plus the precedented superseding records. A path that exists
# on main is never written; its branch bytes are preserved as provenance.
#
# Nothing here reviews, endorses or changes any evidence record, hypothesis
# status or claim. NOT EFFECTIVE until TASK-20261005-fb3d89 commits it and its
# receipt verifies.
# =============================================================================
