    preferred for three more, and ranked last for one; one stack is parked on a
    named fact. (R4) Successor card TASK-20261005-34c6e8 and archive card
    TASK-20261005-fb3d89. (R5) Shard GOAL-ECDLP2M-001 now, and record one
    impediment and one next action.

