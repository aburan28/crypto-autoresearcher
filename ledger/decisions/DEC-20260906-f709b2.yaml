        THIS ALSO DISCHARGES DEC-20260906-408595 PD-9 ON TWO OF ITS THREE HALVES:
        the pass confirmed all four clause texts against the file, the reviewer
        confirmed them again by `sed` and by its own splice, AND THIS COMPOSING
        COORDINATOR OPENED THE REDRAFT ITSELF for the first time in this chain (see
        procedure_deviations PD-14). PD-9's third half - confirmation by the ENACTING
        decision - remains owed.
      overstatement: >-
        CONFIRMED, NOTHING FOUND. No finding claims an effect the text does not
        carry; every finding needing a further decision names it. The strongest
        honesty signal in the package is AF-4, where the pass KILLED ITS OWN
        STRONGER FIRST FORMULATION after a committed artifact contradicted it and
        recorded the narrowing, and the reviewer verified the contradicting artifact
        at the lines cited.
      understatement_and_why_this_is_a_REFUTATION_and_not_a_caveat: >-
        F-J2-1. clause_4's `licensing` key BOTH GRANTS A LICENCE AND IMPOSES A
        FORECLOSURE in what would become contract text, and neither effect appears in
        `amendment.what_this_changes` (nine items, zero matches for `licen|foreclos`)
        nor anywhere in `amendment.blast_radius`, nor in any finding of the pass,
        whose A3 negative sweep enumerates four categories of foreclosure it did not
        find, none covering this one. THE REVIEW PLAN ENUMERATED "an act the text
        plainly effects that the pass missed, found by you" AS A BREAKING ARTIFACT OF
        THIS JOINT IN ADVANCE. One is present. THE COORDINATOR ADOPTS THE LITERAL
        READING AND RECORDS THE JOINT AS REFUTED. The reviewer expressly offered the
        Coordinator the softer reading - "a Coordinator composing the round may
        reasonably record it as a caveat instead" - and stated the choice rather than
        hiding it inside a token; TAKING THAT OFFER WOULD HAVE BEEN EXACTLY THE
        TEMPTATION THIS ROUND PRE-COMMITTED AGAINST, and it is refused. See
        the_temptation_i_felt.
      what_the_refutation_does_and_does_not_reach: >-
        It is a GAP IN THE PASS'S COVERAGE, NOT A DEFECT IN ANYTHING THE PASS
        ASSERTS: every one of its own assertions survives J2's anchoring and
        overstatement limbs intact. AND ITS REACH IS NARROWER THAN "no artifact names
        it": the Coordinator's own reading found that
        `amendment.constraint_compliance.constraint_iii` DOES state, in the record's
        own text, that the licensing statement "covers what an `off_curve` status
        licenses and forecloses". So the effect is DISCLOSED INSIDE THE RECORD,
        OUTSIDE ITS DECLARED EFFECT SET. That bounds the severity and removes
        nothing: the declared effect set still omits both limbs, the pass still
        missed both, and the enacting decision must still name them among the effects
        it enacts. See EV-SSI-0a57ab OBS-8.

    J3:
      joint: whether the pass's finding set is entailed by its own construction, its prompt, or the campaign record
      verdict: CONFIRMED WITH CAVEAT
      why: >-
        THE PROCEDURE DISCRIMINATES AND IT WAS SHOWN TO, NOT ASSERTED TO. The inert
        object returns ZERO act-findings from the producer, ZERO independently from
        the reviewer applying S1-S7 itself before opening the producer's file, and
