        internal-consistency finding. (ii) A4 IS THE THINNEST AXIS AND THE THINNESS
        IS REPORTED RATHER THAN LEFT INSIDE A COUNT OF FOUR: A4-2 duplicates AF-1 on
        a second axis, A4-3 leans on the carried-forward CF-27, A4-4 is a draft
        self-disclosure the pass classifies as one and rates informational, leaving
