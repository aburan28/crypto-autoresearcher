        internal-consistency finding with a downstream act consequence.

  # =======================================================================
  does_anything_here_block_enactment:
    answer: 'NO.'
    at_what_strength: >-
      STATED AT FULL STRENGTH AND NOT SOFTENED, AND SEPARATELY FROM THE VERDICTS SO
      IT CANNOT BE READ OUT OF THEM. The pass searched all four axes with a
      procedure written down before its results, ran it against five objects
      including two where its conclusions are known false, confirmed all four clause
      texts against the file, rebuilt the amended document itself, and VERIFIED FOUR
      BLAST-RADIUS LOCATORS INTO cost_model.py BY READING THAT NOBODY IN THE PREVIOUS
      ROUND WAS ABLE TO CHECK - all four correct. It found nothing that makes
      enacting the redraft unsafe. The independent review found nothing the pass
      asserts that its evidence does not support, and one thing the pass missed.
    what_that_does_not_mean: >-
      IT DOES NOT MEAN THE REDRAFT IS CORRECT, SAFE TO APPLY, OR THAT ENACTMENT IS
      APPROVED. Six things must be settled in the enacting decision's own text, one
      of the three the pass named (AF-3) is a check nobody in four rounds has been
      scoped to run, and the enacting act itself has been reviewed by no one. THE
      ROUND ESTABLISHES WHAT THE TEXT WOULD DO, NEVER WHETHER DOING IT IS RIGHT.

  # =======================================================================
  findings_by_what_they_change_about_enactability:
    the_headline_answer: >-
      NOTHING BLOCKS, FOR THE SECOND CONSECUTIVE ROUND AND NOW ON AN ADVERSARIAL
      READING RATHER THAN AN INTEGRITY REVIEW. What changed is that the enacting
      decision now has SIX named things it must do rather than five, and one of them
      was found by the reviewer and not by the pass.
    blocks_the_enactment_path: []
    blocks_note: >-
      EMPTY, AND EMPTY IS THE RESULT RATHER THAN AN ABSENCE OF EFFORT. It is the
      output of a procedure that fires on the object it was built for, does not fire
      on an object where its conclusions are known false, and kills four of its own
      eight candidates by checking.
    must_be_resolved_in_the_enacting_decision:
      - >-
        AF-1, THE VERSION TRANSITION NO CLAUSE EFFECTS. The enacting decision must
        state IN ITS OWN TEXT which of two positions it takes: (a) it performs the
        bump itself, names the exact bytes it changes, records that the ENACTED
        difference set is SIX rather than five, and RE-RUNS the committed structural
        diff against the ENACTED artifact rather than citing a five-difference result
