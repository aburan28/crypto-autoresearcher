        V-number, and the reviewer TESTED that rather than accepting it. The known-false
        attribution object returns the known-true answer: RT-6, RT-9(a) and RT-12 all
        UNRESOLVED, each re-checked at the file by both agents. The positive control
        fires with eleven results, so the procedure is not silent either.
      caveat: >-
        FOUR. (i) F-J3-1: AF-4's class label is too broad, because
        `clause_4.licensing_provisos_are_operative` is new in the redraft and absent
        from the twin. The direction is CONSERVATIVE - under-attributing to the
        instance - which is the opposite of the direction the failure signature calls
