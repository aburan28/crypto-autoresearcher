        reviewer's, of the same family, with blindness lifted.

    J2:
      joint: whether every act-finding is anchored in the redraft's own bytes at a named key path, and whether the pass overstates or understates
      verdict: REFUTED ON THE UNDERSTATEMENT LIMB ONLY; CONFIRMED ON ANCHORING AND ON OVERSTATEMENT
      anchoring: >-
        CONFIRMED AT 23 OF 23. Every quoted string resolves at the key path the
        finding names and is present there verbatim after whitespace normalisation;
        zero key-path breaks, zero misquotations. The reviewer opened every key path
