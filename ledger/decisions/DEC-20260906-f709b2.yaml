      does not clear.

    J1:
      joint: whether the pass attacked the redraft AS A PROPOSED ACT rather than re-attacking its integrity
      verdict: CONFIRMED WITH CAVEAT
      why: >-
        The round bought what it paid for. Nine of the pass's eleven results are act
        findings on the reviewer's own independent classification into the plan's
        four buckets, and NO AXIS RESTS ENTIRELY ON BUCKETS (b), (c) OR (d): A1 = 2
        act findings, A2 = 3, A3 = 2, A4 = 1 genuinely independent. THE STEER CHECK
