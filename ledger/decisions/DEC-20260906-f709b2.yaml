        named - it did not treat the draft as already in force.
      caveat: >-
        THREE, none blocking. (i) F-J1-1: AF-7 is labelled an ACT finding on A1 but
        clause_3's `operation` line never becomes contract text and the amendment
        applies correctly either way; THE COORDINATOR ADOPTS THE REVIEWER'S
        CLASSIFICATION - INTEGRITY WEARING AN ACT HEADER, WITH A REAL DOWNSTREAM ACT
