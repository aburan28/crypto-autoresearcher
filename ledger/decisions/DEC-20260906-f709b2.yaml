  # =======================================================================
  rationale:
    - >-
      THE MISSING PREREQUISITE IS NO LONGER MISSING. Since BATCH-79a0cb the campaign's
      only live enactment path has been blocked by the plain fact that nobody had read
      the redraft AS AN ACT. That reading now exists, is committed, is independently
      reviewed, and returned findings that are anchored in the record's own bytes at 23
      of 23 key paths. Whatever the enacting decision does next, it can no longer be
      said that the act was never examined.
    - >-
      THE ROUND'S CREDIBILITY RESTS ON WHAT WAS RUN AGAINST OBJECTS WHERE THE ANSWER WAS
      KNOWN IN ADVANCE. Two agents ran the same procedure on an inert object where a hit
      would have been a break, and both got zero; one of them then removed the gate the
      specificity depends on and still got zero. Four of eight candidate reader
      conclusions were killed by checking them against committed artifacts, including two
      the plan had pre-identified as breaks if raised. A procedure that survives that is
      not a procedure that fires on anything.
    - >-
      AND THE ROUND'S LIMITS REST ON THE SAME GROUND. Five of seven act findings survive
      on a record that cannot be enacted, which the producer states and labels; the shape
      of the finding set is entailed by the assignment; both agents had blindness lifted
      and are of one family in one session; and no object in this campaign holds act-ness
      TRUE while varying the text, so the procedure's ability to find the right findings
      on a DIFFERENT live act is untested. The findings that survive that discount are
      AF-2 and the A4 group, and the Coordinator weights them as the producer instructs.
    - >-
      THE REVIEW EARNED ITS PLACE BY REFUSING ITS OWN PROMPT. Told that an escalated
      question had been acted on, it looked for a committed record, found none, and
      recorded the item OUTSTANDING. That single act is better evidence about this
      round's independence than any concurrence in it, and it is why the dispatching
      session's defect is recorded against the dispatching session rather than absorbed.
    - >-
      THE ONE JOINT THAT IS REFUTED IS REFUTED BY A CRITERION WRITTEN BEFORE THE ROUND.
      F-J2-1 is a coverage gap and not an error, its severity is bounded by the record's
      own internal disclosure at constraint_iii, and it changes exactly one thing about
      the world: the enacting decision now has six things to settle instead of five.
      Recording it as a caveat would have been cheaper and would have moved a
      pre-registered criterion after the outcome was known.
    - >-
      TWO LONG-DEFERRED ACTS ARE PERFORMED RATHER THAN NAMED AGAIN. CF-19 was deferred
      four times, each time correctly, because each archive's enumerated path set
      excluded inputs/; this archive declared the path and the deferral ends. The
      knowledge promotion was warranted for the first time by the previous round and was
      not written only because both knowledge paths were outside that archive's set; this
      archive declared the entry path and wrote it, WITH ITS TWO KNOWN GAPS, because a
      technique promoted without its known gaps is the same defect one level up. A
      programme that defers by default has stopped choosing.
    - >-
      NOTHING IN THIS ROUND MEASURES ANYTHING ABOUT ANY ISOGENY PROBLEM, AND THE
      CAMPAIGN'S ONLY SUBSTANTIVE DEFECT REMAINS UNREPAIRED. specification.yaml:39-40 is
      still jointly satisfiable with its own control C4 only on the degenerate slice, it
      is still the governing document of an `approved` experiment, and this is the
      SEVENTH consecutive round in which it stays defective and unamended. CF-1 remains
      DISCHARGED ONLY IN PART. That cost was recorded in advance by
      the_enacting_decision_is_not_in_this_batch and is restated here rather than allowed
      to fade.

