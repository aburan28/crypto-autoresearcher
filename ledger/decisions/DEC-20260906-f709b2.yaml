        records that the contract governs at version 2 while reading `version: 1` and
        that every later reader must learn the version from a decision record. IT MAY
        NOT LEAVE THE CHOICE UNMADE. This is the single most consequential finding of
        the round on the producer's own ranking and on the Coordinator's.
      - >-
        AF-2, THE PREREQUISITE THAT NAMES AN ARTIFACT OF THE WRONG KIND. The enacting
        decision records WHICH artifact it treats as discharging
        `prerequisites_before_such_a_decision[1]`, that TASK-20260906-9f3e2a is a
        `ledger` archive and not a snapshot archive, that the pre-review commit
        9da258d0e is what actually placed the package under an independent reviewer,
        and that that commit carried none of the archival gates. It discharges the
        prerequisite's INTENT while recording that its LETTER names the wrong task.
        THE IMMUTABLE REDRAFT IS NOT EDITED; a successor record may correct the
        letter.
      - >-
        AF-3, THE TRANSITIVE POINTER THAT BECOMES THE CONTRACT'S ONLY SOURCE OF LAW.
        Before enacting, open
        coordination/goals/GOAL-SSI-001/batches/BATCH-2e6130/tasks/TASK-20260809-ef3e58/protocol_amendment.yaml
        and record (a) that the three key paths clause_2 names exist, (b) that
        record's own status and in_force fields, and (c) whether the law it states
        satisfies clause_2's three invariants. IT IS ONE FILE READ, it is the
        cheapest discriminating check available, and FOUR CONSECUTIVE ROUNDS HAVE
        PASSED IT BY ON SCOPE GROUNDS - including this composing Coordinator. It is
        promoted here to a PRECONDITION of the enacting batch (P-2).
      - >-
        AF-4's INTERVAL RULING. The enacting decision states expressly that clause_4's
        raw-output status requirement is PROSPECTIVE on implementations, that the one
        existing implementation is non-conforming from the instant of enactment and
        that this is accepted knowingly, and that clause_3's unsubjected
        `deviation_sign_note` binds reports written after enactment and may be
        satisfied by citing statuses already recorded in a committed coordination
        artifact. Two sentences close the interval question without touching a clause.
      - >-
        F-J2-1, NEW THIS ROUND AND FOUND BY THE REVIEW RATHER THAN BY THE PASS. The
        enacting decision NAMES clause_4's LICENCE and its FORECLOSURE limb
        explicitly among the effects it enacts, since the record's own declared effect
        set omits both. It may cite `constraint_compliance.constraint_iii` as the
        record's internal disclosure of them. IT MAY NOT thereby settle RT-4's
        licensing question, and it may not read clause_4 as lifting, narrowing or
        widening the standing citation prohibition, which
        `clause_4.relation_to_the_standing_citation_prohibition` denies.
      - >-
        RT-4's LICENSING QUESTION, STANDING AND UNCHANGED. Carrying the two provisos
        into clause_4's own text is what the redraft was ORDERED to do and is NOT a
        settlement of the enacting decision's question about that clause. This round
        supplies material (AF-4, F-J2-1) and no ruling.
    belongs_in_a_successor_record_and_does_not_block:
      - AF-5 - the prerequisite list omits the companion record its own reviewer_notes call necessary. One line in a successor record; the enacting decision should separately state whether the companion's EXISTENCE gates enactment (P-6).
      - AF-6 - clause_2's binding_effect forecloses the control-is-wrong repair branch. The pass records the cost and expressly does not assert the sentence is wrong; a successor may narrow it.
      - AF-7 - clause_3's operation line misstates its effect on C1's key count ("three keys" for one key carrying five sub-keys). One line in a successor record.
      - F-J1-1 - AF-7's axis label. Adopted by this decision; a successor record may carry the correction into the pass's own lineage, never by editing the immutable report.
      - F-J3-1 - AF-4's class label too broad, conservative direction. One `what_is_nevertheless_instance_level` line in a successor record.
      - F-J3-2 - the pass's steer self-claim overstated by one finding. One word in a successor record; the conclusion survives.
      - F-J4-1 - the control-plane "four weaknesses" count against a file that names five. CORRECTED BY THIS DECISION; the control-plane files are immutable and are not edited.
      - A4-1's RECOMMENDATION - at enactment, bind the ENACTED specification.yaml by sha256 and re-run the committed structural diff against it rather than citing a green control obtained on a document the control itself built. Folded into P-7 and into AF-1's disposition.
      - CF-25 (V-1, V-2, V-3) and CF-26 (V-4, V-5) - carried unchanged from DEC-20260906-408595 NA-3 and NA-4. NOT dispatched here; V-1 and V-2 TRAVEL WITH THE KNOWLEDGE PROMOTION, which is why the entry carries them.
    changes_nothing_about_enactability_and_is_recorded_as_changing_nothing:
      - A4-2 - "a green PC-1 means the amended contract is at version 2". This is AF-1 seen through the control and is not an independent result; the reviewer says so and the Coordinator records it as a duplicate rather than as a fifth A4 finding.
      - A4-3 - P2 and P3 are weaker discriminators than they read, because the frozen file already satisfies them and metrics[4] is ALSO a single-key mapping. This is CF-27, already committed; both agents reproduced it from their own parses rather than citing it, which is the right handling, and it changes nothing.
      - A4-4 - "a green PC-1 means clauses 2, 3 and 4 were checked". A DRAFT SELF-DISCLOSURE READ BACK, self-classified as one and rated informational. Correctly not inflated.
    disposed_of_by_this_decision:
      - F-J4-2 - see inference_and_impediment_disposition. The escalation is disposed of, IMP-1 is re-confirmed by its own named recheck and is NOT downgraded, and the CLAIM stays UN-PROMOTED.
    structural_prerequisites_which_are_not_findings:
      - >-
        THE ENACTMENT ITSELF HAS BEEN REVIEWED BY NOBODY. Every artifact of this
        batch is an INPUT to the enactment; none is a review OF it. That is the first
        of the three reasons DEC-20260906-6a620e gave for placing the enacting
        decision outside this batch, and it is unchanged by the round's outcome.
      - >-
        THE COMPANION RECORD FOR clause_3 AND clause_4 DOES NOT EXIST, and the
        redraft's own reviewer_notes say the two "should be enacted together".

  # =======================================================================
  the_temptation_i_felt:
    the_two_named_in_advance: >-
      review_plan.yaml element (8) pre-committed to both clean outcomes and named
      two symmetric temptations: to OVER-weight a minor finding so the round looks
      productive, and - new this round, because the enactment is now within reach -
      to UNDER-weight a finding that would delay it.
    which_one_i_felt: >-
      THE NEW ONE, AND AT ONE EXACT PLACE: J2. A REFUTED joint on the last
      prerequisite before the campaign's strongest act reads like a delay, and the
      reviewer had already written the escape hatch into its own report - that a
      composing Coordinator "may reasonably record it as a caveat instead". Taking
      that offer would have cost nothing visible and would have left the round
      reading as four carried joints. I DID NOT TAKE IT. The plan named this exact
      breaking artifact IN ADVANCE, one is present, and a joint that is refuted by a
      pre-registered criterion and then recorded as a caveat has had its criterion
      moved after the outcome was known - which is the protocol_amendment defect one
      level up.
    which_one_i_did_not_feel: >-
      THE OLD ONE. Inflation had no work to do this round: eleven results, six review
      findings, one refuted joint and one overturned prior element are more than
      enough to make the round look productive without help. I record that as a
      reason to distrust my J2 reasoning less, not more.
    the_third_pressure_neither_element_named: >-
      RECORDED BECAUSE IT WAS REAL. My launching prompt stated both agents' headline
      outcomes and six verification results before I read anything, including two
      confirmations of findings. THE PRESSURE THAT CREATES IS TO COMPOSE FROM THE
      SUMMARY RATHER THAN FROM THE PACKAGES. What I did about it: read both packages
      in full, and re-derive by my own reading the three claims I could reach without
      a shell - which is how the F-J2-1 narrowing at
      `constraint_compliance.constraint_iii` was found, and it is in neither agent's
      report nor in the prompt.

  # =======================================================================
  prior_versus_outcome:
    how_this_is_reported: >-
      ELEMENT BY ELEMENT ACROSS ALL EIGHT, WITH THE LOSSES STATED FIRST IN EACH. A
