  refutation_artifact:
    is_one_required_by_the_rules: >-
      NO. The refutation-artifact rule binds a decision that concludes a theory is wrong
      - `weaken`, `reject_scoped`, or a hypothesis moving to `rejected`. This decision is
      `revise`, concludes no theory wrong, weakens nothing, rejects nothing and moves no
      hypothesis. No `reject_scoped` is made anywhere, so the prohibition on
      `reject_scoped` from a single unreplicated empirical-only run has no object here.
    what_exists_anyway_and_why_it_is_recorded: >-
      ONE COORDINATOR PRIOR ELEMENT IS OVERTURNED AND ONE JOINT IS REFUTED, AND BOTH REST
      ON CHECKABLE OBJECTS RATHER THAN ON AN ARGUMENT. Element (5)'s overturn rests on the
      inert-object result, obtained three times by two agents and re-obtainable by anyone
      who applies S1-S7 to
      BATCH-60d6b9/tasks/TASK-20260906-0fbf69/run_provenance_attestation.yaml - though the
      scripts that produced it are unarchived, which is why the limb is declared
      `empirical_only` in EV-SSI-0a57ab. J2's refutation rests on committed BYTES at one
      key path and is decidable by a successor in two commands; the Coordinator re-read
      all nine `what_this_changes` items itself. RECORDING THE BASIS FOR AN OVERTURN THE
      RULES DO NOT REQUIRE ONE FOR IS CHEAP; DISCOVERING LATER THAT IT RESTED ON NOTHING
      IS NOT.
    what_no_artifact_here_supports: >-
      Any claim that the redraft is CORRECT, SAFE TO ENACT, or that enacting it is right;
      any claim about the incorporated law at BATCH-2e6130, which nobody has opened; and
      any claim about any isogeny problem in either direction.

