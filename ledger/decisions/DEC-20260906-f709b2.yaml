    J4:
      joint: whether the pass stayed inside what it may not do, and settled nothing reserved to the enacting decision
      verdict: CONFIRMED
      why: >-
        Carried item by item, and checked rather than accepted. (i) NOTHING APPROVED
        OR ENACTED; the redraft's three status fields are as committed and no status
        record moved. (ii) ALL FIVE RESERVED ITEMS UNSETTLED: CF-10's placement
        question left with the `travels with` authority limb expressly untouched; F-7
        checked and no change asked for; F-2/F-3 and CF-22 approached only far enough
        to state that evaluating the R3 warrant sentence's antecedent WOULD require a
        governed baseline-comparison sign, with the stronger claim left un-promoted;
        RT-6/RT-9(a)/RT-12 reported unresolved; and RT-4's licensing question left in
        terms - "THAT IS THE CARRYING, AND CARRYING IS NOT SETTLING". The reviewer
        looked specifically for a recommendation phrased as a ruling and found none.
        (iii) NEITHER PROHIBITION LIMB LIFTED, NARROWED OR WIDENED, and no governed
        value stated - verified by a mechanical scan of all three producer artifacts
        for decimal figures returning zero matches. (iv) cost_model.py READ AS TEXT
        BY BOTH AND EXECUTED BY NEITHER, with or without WESOVOW_RAW_PATH, and the
        producer disclosed a numeral-redacting filter over the PAPER_PAIRS range so
        no value reached its transcript. (v) NO FROZEN OR IMMUTABLE ARTIFACT EDITED.
        (vi) NO COMMITTED RECORD ASSERTED WRONG; the stronger claim is left
        UN-PROMOTED for want of a tier this environment cannot serve.
      two_control_plane_findings_attach_here_and_neither_is_a_defect_of_a_worker: >-
        F-J4-1 - batch.yaml and review_plan.yaml both say the redraft's
        `known_weaknesses_of_this_draft` "names four weaknesses" and it names FIVE.
        The producer counts five and is right; the Coordinator confirmed five at the
        file. Bucket (d) of the J1 classification is DEFINED by that count. A DEFECT
        OF THIS BATCH'S CONTROL PLANE, corrected here by successor record and never
        by editing the immutable redraft or the committed control plane. F-J4-2 - the
        producer's escalated inference-provenance divergence had NO COMMITTED
        DISPOSITION at the HEAD the reviewer named, and the reviewer recorded it
        OUTSTANDING rather than believing its launching prompt. IT IS DISPOSED OF
        HERE; see inference_and_impediment_disposition and procedure_deviations PD-4.

    the_producers_own_axis_verdicts_as_reported_not_as_composed:
      A1: BREAKS (AF-1, AF-3, AF-7)
      A2: BREAKS (AF-2, AF-5)
      A3: HOLDS WITH RECORDED COSTS (AF-4 and AF-6 are costs the record does not disclose, not defects in what it claims)
      A4: BREAKS (A4-1, A4-2)
      note: >-
        REPORTED, NOT ADOPTED AS A VERDICT ON ENACTABILITY, because the producer
        scoped `breaks` itself and stated that the Coordinator composes. On the
