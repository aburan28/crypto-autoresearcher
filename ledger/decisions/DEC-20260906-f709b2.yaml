    - TASK-20260906-dc4905
    - TASK-20260906-51fec3
    - TASK-20260906-918585
    - TASK-20260906-8f3ee7
    - EV-SSI-0a57ab
    - KN-TECH-f8ec55
    - GOAL-SSI-001

  # =======================================================================
  composed_verdicts:
    who_composed_them: >-
      THE COORDINATOR, IN THIS DECISION, PER JOINT. NEITHER AGENT RETURNED A
      WHOLE-CLAIM VERDICT AND THE COORDINATOR INHERITED NONE. The producer's
      `breaks` is scoped by its own text to its four axes and means "the record does
      not do everything it says it does", never "the amendment should not be
      enacted"; the reviewer's `breaks` is scoped to its four joints and means one
      pre-named breaking artifact is present at J2; the reviewer's `passed` is the
      admissibility token of agents/validator.md. A joint with no verdict is
      UNCOVERED and is never assumed to hold; none is uncovered.
    one_family_one_session_blindness_lifted: >-
      STATED HERE AND NOT ONLY IN THE LIMITATIONS, BECAUSE IT SCOPES EVERY VERDICT
      BELOW. ONE producer and ONE reviewer ran, of ONE model family, as subagents of
      ONE orchestrating session sharing one filesystem, with blindness DELIBERATELY
      LIFTED FOR BOTH BY NAME so each could check whether numbered findings were
      carried. NO CONCURRENCE OF THIS ROUND MAY BE PRESENTED AS AGREEMENT BETWEEN
