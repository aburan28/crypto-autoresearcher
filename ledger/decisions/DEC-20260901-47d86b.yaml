coordinator_decision:
  id: DEC-20260901-47d86b

  context: >-
    GOAL-AES-003 integrity-debt act by the dispatching Coordinator
    (session coordinator-aes003-1, 2026-09-01), discharging the RANK-1
    next_action written by DEC-20260901-bad1e5: BATCH-713991's
    outstanding integrity debt per DEC-20260804-73977c D-7/D-8.

    Facts verified by this session before deciding: (1) BATCH-713991's
    queue (coordination/goals/GOAL-AES-003/batches/BATCH-713991/dispatch_queue.json)
    fails the dispatcher: "completed archive task TASK-20260804-777cb6
    requires archive.commit_sha". (2) The snapshot commit 6ff55eacd
    exists, is an ancestor of HEAD, and changed the producer packages
    plus the 777cb6 receipt/manifest -- but its message does not name
    TASK-20260804-777cb6, so neither commit nor content_first binding
    can use it directly. (3) The original ledger commit 37c8a7024
    committed exactly four paths (ledger-receipt.json, DEC-20260804-73977c,
    EV-AES-048545, goal file); EV and DEC are therefore durably in the
    ledger. (4) THE DEBT RUNS DEEPER THAN RECORDED: the validator report
    (declared artifact of TASK-20260804-91d27e) and the red-team report
    (declared artifact of TASK-20260804-fa4906) exist in NO branch's
    history (git log --all over both paths is empty); both cards are
    state completed. The checkpoint outcome text's claim of a validator
    that "independently recomputed every count from raw receipts with
    zero disagreement" is therefore UNBOUND -- the same failure class
    D-8 recorded for the BATCH-b41ba9 repair session ("claimed written
    deliverables that did not exist on disk"). (5) D-7's dual-device
    stamp-gap repair WAS executed: BATCH-6fe3c2/tasks/TASK-20260806-7fcdf8
    holds budget_stamps.repaired.jsonl, completion-record.json and
    repair-report.md, but BATCH-6fe3c2's own ledger-archive debt
    (TASK-20260806-ccfd8b, DEC-20260806-435a43 missing) means those
    artifacts are also not ledger-archived.

  decision: open_batch_dispatch

  decision_scope: >-
    THIS DECISION OPENS BATCH-903b65 TO DISCHARGE BATCH-713991'S
    INTEGRITY DEBT AND NOTHING ELSE.

    It adopts the content_first archive binding mode (the dispatcher's
    opt-in mechanism for source packages committed before their archive
    task ran) for BOTH BATCH-713991 archive cards, via NEW binding
    commits whose messages carry the required IDs, because neither
    original commit's message names its archive task. It re-runs the
    missing independent reviews (validator and red-team) against the
    committed producer package rather than binding nonexistent reports:
    a review that never produced its artifact is not a review, and the
    ledger cannot cite one. It moves NO head field beyond what the
    binding ledger task records in the goal checkpoint (ledger_archive
    commit binding plus a supersession note); current_batch_id stays
    BATCH-7939d0 and dispatch_queue_path stays BATCH-7939d0's queue
    until a later research batch closes. It reopens NO finding of
    BATCH-713991 and asserts nothing new about S-box specificity.

  target_ids:
    - GOAL-AES-003
    - RQ-AES-003
    - BATCH-903b65
    - BATCH-713991
    - TASK-20260901-bcde48
    - TASK-20260901-bd46bd
    - TASK-20260901-59967f
    - TASK-20260804-777cb6
    - TASK-20260804-0e75d5
    - TASK-20260804-91d27e
    - TASK-20260804-fa4906
    - EV-AES-048545
    - DEC-20260804-73977c

  rationale:
    - >-
      The checkpoint's own merge_provenance_note names the repair:
      "A repair/supersession task for TASK-20260804-0e75d5 (the missing
      ledger-archive commit)". This batch is that task, expanded to
      cover what the investigation found beneath it: two review artifacts
      that never existed.
    - >-
      Re-running the reviews (rather than waiving them) is the only
      disposition consistent with core rule 10 (conclusions cite their
      supporting artifacts) and D-8's lesson. EV-AES-048545's claim
      boundary ("independence within {AES, uniform random bijection} is
      supported at toy tier") has stood unreviewed since 2026-08-04;
      giving it its first real bound review strengthens the ledger
      either way the reviews land.
    - >-
      content_first is the tool's sanctioned mechanism for exactly this
      shape (source packages committed before their archive task ran);
      it relaxes the one-commit-changed-all-paths requirement but NEVER
      relaxes byte binding -- every declared artifact hash is checked
      against HEAD, and a content mismatch stays fatal. The new binding
      commits carry the ID-in-message requirement the originals lack.
    - >-
      BATCH-6fe3c2's ledger debt (7fcdf8's repair artifacts not
      ledger-archived) is deliberately NOT in this batch: it is a
      separate queue on separate records. This batch READS the 7fcdf8
      artifacts (the validator rules on d7d0ec's completion status
      against them) but does not write BATCH-6fe3c2 records. A later
      decision schedules BATCH-6fe3c2's own discharge.

  dispatch_note: >-
    Queue authored at
    coordination/goals/GOAL-AES-003/batches/BATCH-903b65/dispatch_queue.json.
    Tasks: TASK-20260901-bcde48 (validator re-run, writes the declared
    artifact path BATCH-713991/tasks/TASK-20260804-91d27e/validation_report.yaml),
    TASK-20260901-bd46bd (red-team re-run, writes
    BATCH-713991/tasks/TASK-20260804-fa4906/red_team_report.yaml),
    TASK-20260901-59967f (terminal content_first binding ledger archive
    for both BATCH-713991 archive cards plus goal checkpoint binding;
    also the sole archiver of both reviewers' artifacts -- the planned
    snapshot task TASK-20260901-7f86cf was folded into it during queue
    authoring because the dispatcher assigns each non-archive task to
    exactly one archiver and nothing consumes the artifacts between the
    reviews and the binding; no task was dispatched before the change).
    The validator and red-team run concurrently (disjoint write scopes);
    the binding task is serial after both.

  knowledge_promotion:
