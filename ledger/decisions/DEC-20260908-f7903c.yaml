coordinator_decision:
  id: DEC-20260908-f7903c
  recorded_at: '2026-09-08'
  context: >-
    A second executor dispatch (re-run of TASK-20260908-788e3b under
    amendment v1) again refused to run EXP-RELN-715aa1 Stage 0. Amendment
    v1 (DEC-20260908-2c0366) had repaired the poisson_vs_exhaustive_cross_
    check control's CONSTRUCTION (replacing an uncomputable raw-c_D-vector
    comparison with moment comparisons computable from the committed
    EXP-FB3-001 `stats` fields), but the control's `expected` field still
    named the original Janson-bracket tolerance, itself uncomputable from
    those same committed fields -- an identical class of gap recurring one
    field over. The executor also flagged, correctly and as a non-blocking
    observation, that all 112 cells across the three named RUN-FB3-001
    files use one of 7 structured (non-random) geometries, with no plain
    matched-random-base cell among them, and asked the Coordinator to state
    whether structured geometries are in scope for the decidable
    falsification criterion.
  decision: amend
  target_ids:
    - EXP-RELN-715aa1
  rationale:
    - >-
      Approves protocol amendment v2
      (experiments/EXP-RELN-715aa1/amendments/v2.yaml), which supplies a
      pre-registered, standard normal-approximation (Wald) numeric
      tolerance for the four moment-based comparisons amendment v1 already
      established: mean vs. mu (SE = sqrt(mu/n_targets)), coverage vs.
      1-exp(-mu) (SE = sqrt(p(1-p)/n_targets)), index of dispersion vs. 1
      (SE = sqrt((1+2*mu)/(mu*n_targets)), from the asymptotic variance of
      a Poisson sample variance), each flagged as disagreement beyond 3 SE;
      and a tail check reporting r = n_targets * P[c >= max_count] under
      Poisson(mu), flagged as disagreement when r < 0.05. All four formulas
      and thresholds were independently re-derived and checked by the
      Coordinator before this decision, not merely copied from the
      executor's own recommendation.
    - >-
      The z = 3 SE multiplier is explicitly disclosed as ADAPTED from, not
      identical to, IDEA-20260906-86cd30's M2 convention ("3 Monte Carlo
      standard errors") for a different statistic and sampling model; the
      r < 0.05 tail threshold is a new convention with no closer precedent
      in this research thread. Both are stated here, before any Stage-0
      number is computed under either -- this is a pre-run scope
      correction, not a post-hoc adjustment, matching the pattern already
      established for amendment v1.
    - >-
      All 7 committed EXP-FB3-001 geometries remain in scope for the
      decidable criterion, unfiltered, exactly as the v0 contract's own
      "at every/any available cell" language specified -- Stage 0 measures
      and reports uniformly, including each cell's geometry label, and does
      not filter by or pre-judge structured-vs-random construction.
      Whether a structured-geometry disagreement should count against
      HEUR-RELN-H3-b26c06 (a claim about uniformly random B-subsets) is
      reserved for the Coordinator's later_review_requirements review, not
      decided here and not delegated to the executor.
    - >-
      Under the standing user authorization in AGENTS.md for
      Coordinator-ranked protocol maintenance, no per-amendment user
      approval is required.
  evidence_refs:
    - experiments/EXP-FB3-001/runs/RUN-FB3-001-N14/raw-result.json
    - experiments/EXP-RELN-715aa1/specification.yaml
    - experiments/EXP-RELN-715aa1/amendments/v1.yaml
    - experiments/EXP-RELN-715aa1/amendments/v2.yaml
    - ledger/decisions/DEC-20260908-2c0366.yaml
    - ledger/handoffs/TASK-20260908-788e3b.yaml
  limitations:
    - >-
      This decision does not itself produce or classify any Stage-0
      evidence; it only completes the protocol repair so a compliant run
      can proceed. The moment-based cross-check's own pass/fail outcome
      under these thresholds remains to be measured.
    - >-
      Does not authorize any new c_D-vector regeneration, any instrumented
      solver, or any policy-training work.
    - >-
      Does not itself decide whether structured-geometry disagreement
      counts against HEUR-RELN-H3-b26c06 -- that interpretive call is
      explicitly deferred to later_review_requirements review, per the
      amendment's degraded_scope_disclosure.
  next_actions:
    - >-
      Re-dispatch the executor against TASK-20260908-788e3b (unchanged) to
      run EXP-RELN-715aa1 Stage 0 under the v1+v2-amended contract. If a
      THIRD specification_error surfaces, escalate to the user rather than
      filing a third amendment reflexively -- two amendments to close two
      distinct, genuinely load-bearing gaps is normal protocol hygiene; a
      third on the same control would warrant checking whether the
      contract's overall design needs a full re-draft instead of
      incremental patches.
    - >-
      On return, run the contract's later_review_requirements before any
      claim-changing use, carrying both amendments' degraded_scope_
      disclosure qualifiers verbatim into any summary.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is a protocol-repair decision; no evidence has been produced
      yet.
  decided_by: coordinator
  decided_at: '2026-09-08'
