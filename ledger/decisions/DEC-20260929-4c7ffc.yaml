  rulings:
    - id: R-ACT
      subject: what this decision does
      ruling: >-
        Perform ranks 2 and 3 of DEC-20260929-1eded2 portfolio_ranking: open
        the version-3 revision design work of DEC-20260929-1f5fcb NA-1 (lane
        A) and DEC-20260929-8c3cb2 NA-1 (lane B) as one zero-run two-lane
        batch of fifteen cards, with both review plans written now.
    - id: R-SHAPE
      subject: one two-lane batch, and how it shares slots
      ruling: >-
        ONE TWO-LANE BATCH in the BATCH-361e02 shape: one opening card and
        its ledger archive, one producer, one snapshot, a review round, a
        composer and a ledger archive per lane. Reasons: one form, one tier,
        one plan shape for both lanes, proven end to end in BATCH-361e02; one
        opening archive. The queue declares max_concurrent 2, but the goal
        slot rule of DEC-20260929-1eded2 R-SLOT governs every claim: this
        session holds at most two live claims on the goal, so the batch runs
        its lanes in parallel only while BATCH-04a6be holds no live claim and
        has no Ready card, and otherwise one card at a time, lane A before
        lane B (DEC-20260929-1f5fcb CH-A; DEC-20260929-8c3cb2 SP-1), with the
        two batches alternating claim by claim when this session can hold
        only one. Lane A's cards carry higher priorities than lane B's at each
        stage so the dispatcher's order is lane A first. The lanes are
        independent after TASK-20260929-66826b: disjoint paths, separate
        plans, composers and ledger archives, so one lane's revise or
        impediment does not hold the other. The lane record closes when both
        lane archives have verified.
    - id: R-FORM
      subject: record form of version 3
      ruling: >-
        SUPERSEDING RECORD SETS IN BOTH LANES, the form whose receipts verified
        in BATCH-361e02 (both NA-1 texts permit it). Lane A:
        H-BINSTD-099d93 and EXP-BINSTD-8cb697 with supersedes H-BINSTD-7951d2
        and EXP-BINSTD-517186. Lane B: H-BINSTD-17cf9d and EXP-BINSTD-c9c8a2
        with supersedes H-BINSTD-de2808 and EXP-BINSTD-6f1e66. Each version-3
        record is complete in itself with a supersession note citing its
        composing decision. Version-1 and version-2 files are never edited:
        each snapshot hashes them against their receipts (version 2:
        TASK-20260929-36a146, TASK-20260929-36d781; version 1:
        TASK-20260928-7a6424, TASK-20260928-b933db), and a change is a
        tripwire (TA-3, TB-4). No status field of any version moves in this
        batch; version 3's approval fields and the superseded status of
        versions 1 and 2 advance only in an execution batch named by an
        approving composing decision.
    - id: R-TIER
      subject: review tier
      ruling: >-
        Both review rounds run at review-breakthrough at max, non-degradable
        (validator-breakthrough for the validator and blind cards,
        red-team-breakthrough for the red-team cards), because TW-01 and
        TW-02 of DEC-20260928-63addc still bind (each NA-1 says so). If a
        review card cannot be served at max it is not dispatched, the
        impediment is recorded on the still-active goal, and that lane's
        contract stays unapproved; the other lane continues. Lane A's J3 is
        owned by a fresh red team whose attack applies every invalidation,
        stopping and admission rule to the contract's own declared metrics
        and modal pattern and computes each gate's false-fail rate per cell
        regime, and PTM-A to PTM-D are carried (DEC-20260929-1f5fcb NA-1).
        Lane B's plan records a prior on which declared arms carry an exact
        component, adds the exact-content-only object PTM-E to its
        proves-too-much list, and applies the same rule sweep to its own
        controls (DEC-20260929-8c3cb2 NA-1).
    - id: R-BLIND-A
      subject: lane A's blind check (DEC-20260929-1f5fcb NA-1 lets this decision choose)
      ruling: >-
        CARRIED BY DIGEST, NOT RE-DISPATCHED. The blind re-derivation
        TASK-20260929-739a0c of BATCH-361e02 (rederivation-report.yaml sha256
        1fa3d4a954397e3ac10cc77107627a1cc1c4b8f7d356b965dd236f98581025a1;
        computations.json sha256
        640b7b1703a2add6218f119dd24ca80c8d3efa2f7cc5f60e41ba10fd48e657fb;
        bound by TASK-20260929-e85cfa at fc6cd4ecf131) is lane A's J5, and
        the named diff-check owner is the lane-A validator
        TASK-20260929-7fb81e (J1 item vi, D-CARRY), which compares version 3
        with the version-2 audit sheet and never reads the J5 report. Why.
        (1) No revision requirement of DEC-20260929-1f5fcb changes a constant,
        the committed m = 4 range or the Stage 0 arithmetic; the producer card
        forbids it and requires any change to be listed in constants_delta.
        (2) A new blind card would re-derive the same Q1 to Q7 from the same
        model definitions; the constants_delta mechanism adjusts a carried
        comparison exactly as it would a new one, so a fresh card adds no
        independence and costs one max-tier session. (3) The new load-bearing
        quantity of this revision, G1's false-fail rate per cell regime, is
        not a blind-card quantity, because its definition depends on the
        producer's chosen remedy; it is owned by the fresh red team's J3.
        What it costs, stated: if D-CARRY finds an uncovered change, the
        carried joint is inapplicable and the round cannot approve
        (K-carry-broken) until a fresh blind card runs in a successor.
    - id: R-BLIND-B
      subject: lane B's blind card
      ruling: >-
        A NEW BLIND CARD, TASK-20260929-9030f8, scoped as DEC-20260929-8c3cb2
        NA-1 permits to what version 3 changes and to what was never
        blind-checked: Q1 the sample table re-derived under the contract's own
        rule constant (S = 2 to the power ceil(log2(128 M^2)); the PD-B6
        lesson) with the orders it rests on; Q2 the exact-quotient purities of
        the declared arm families on the declared cells, the load-bearing
        quantity behind RR-1 and RR-2; Q3 the HEUR-B2 threshold table, which
        no blind check has re-derived. The card carries the contract's rules
        and definitions verbatim and no computed answer. The orders and the
        ideal-tree and gap tables, blind-confirmed in version 2, are carried
        by J1's D-CARRY-B.
    - id: R-PRODUCER-COMPUTE
      subject: mechanical computations the session may perform for a producer with no shell (DEC-20260929-8c3cb2 NA-1, PD-V4)
      ruling: >-
        Stated in advance on each producer card and limited to: (1) extracting
        each committed code block by the pinned method and computing its
        sha256; (2) a syntax check and an import-safety check of each block in
        a fresh interpreter; (3) running the Stage 0 code (lane A stage0_code;
        lane B CODE-S0) through its __main__ entry and relaying the output
        verbatim; (4) lane A only, running a committed Monte Carlo of the
        contract's abstract model (no curve, no oracle, no instrument) for
        the G1 calibration of R2-J3-2, output relayed verbatim; (5) lane B
        only, running the committed exact-quotient audit CODE-AUDIT, a
        deterministic enumeration of label classes against the 2E and 4E
        cosets on the declared toy cells that never computes the bucket gain,
        a shuffle, a null draw or any decision clause, and dry calls of the
        shuffle or sampler on synthetic data. Each computation's command and
        output are embedded in the audit sheet as design figures, never
        results. Nothing else is run, and no declared cell is measured.
    - id: R-SCRATCH
      subject: private scratch subdirectories
      ruling: >-
        Every reviewer and the blind re-deriver writes temporaries only in
        <session scratchpad>/BATCH-35bdda/<its TASK id>/. The five
        subdirectories (TASK-20260929-7fb81e, -810095, -8218e0, -8f2efa,
        -9030f8) were pre-created in this session's scratchpad by this
        Coordinator (DEC-20260929-1eded2 PD-5); a later session re-creates them
        under its own scratchpad before launch and names the path in the
        launch prompt. No reviewer lists the scratchpad root or a sibling.
        Scratch is not an artifact and is not archived.
    - id: R-PRIOR-REPORTS
      subject: who reads the earlier review reports
      ruling: >-
        The producers read their lane's version-1 and version-2 reports and
        worksheets, which they must discharge. The composers read them. The
        reviewers of this round do not; they attack from the composing
        decision's enumerated requirements and their own computations. The
        blind re-deriver reads none. The lane-A validator's D-CARRY reads the
        version-2 audit sheet, never the carried J5 report.
    - id: R-PRICING
      subject: budget quantities and framing
      ruling: >-
        CORR-20260928-4cb669: lane A's single-target comparator is the pinned
        D3 column (unrounded 11.010251 and 33.075936 where required), never
        D1; lane B's records use no D1, D2 or D3 quantity. Matched rho
        2^60.8090 (CORR-20260922-81aeab). Every per-orbit framing is
        conditional under CORR-20260925-649e25.
    - id: R-INDEPENDENCE
      subject: who runs what, exactly as each NA-1 names it
      ruling: >-
        Lane-A producer: a fresh Coordinator-role /design-experiment session
        that did not run TASK-20260929-1e739f, did not compose
        DEC-20260929-1f5fcb, DEC-20260928-cec92e or DEC-20260928-63addc, and
        did not author the new plan (DEC-20260929-1f5fcb NA-1), nor this
        decision; it is not the lane-B producer. Lane-B producer: a fresh
        Coordinator /design-experiment session that has not run
        TASK-20260929-291567, reviewed lane B of BATCH-d34db1 or BATCH-361e02,
        or composed DEC-20260928-9d9c47 or DEC-20260929-8c3cb2
        (DEC-20260929-8c3cb2 NA-1), nor authored this decision or either
        plan; it is not the lane-A producer. Lane-A J3 and J4: a fresh red
        team (DEC-20260929-1f5fcb NA-1) that reviewed no earlier lane-A round.
        Reviewers generally: independent sessions that did not author the
        contract, did not review the same lane in an earlier round, and are
        not a sibling's session; the blind re-deriver has read none of its
        plan's blind_from paths. Composers: fresh Coordinator sessions that
        did not run their lane's producer, did not compose their lane's
        earlier decisions or DEC-20260928-63addc, did not author this
        decision, DEC-20260929-1eded2 or either plan, and are neither a
        reviewer nor the other composer (DEC-20260929-8c3cb2 NA-1: a fresh
        composer). One model family serves every role by runtime inheritance;
        session independence is real, model independence is not claimed.
    - id: R-HEAD
      subject: goal-head edit
      ruling: >-
        Not written by this decision's card. The goal-head checkpoint for both
        batches of this pass, including one operative next_action for lane
        BATCH-35bdda, one open_batches entry and one amendment_history entry,
        is declared by TASK-20260929-00a9ff and bound by TASK-20260929-07e772
        (DEC-20260929-1eded2 R-HEAD), which runs before this decision's
        archive.
    - id: R-IDS
      subject: identifier use
      ruling: >-
        BATCH-35bdda is this batch. DEC-20260929-4c7ffc is this decision;
        DEC-20260929-54dcd8 and DEC-20260929-585602 are reserved for the
        composing decisions. The fifteen TASK ids are assigned in batch order
        under batch_structure. H-BINSTD-099d93 and EXP-BINSTD-8cb697 are
        reserved for lane A; H-BINSTD-17cf9d and EXP-BINSTD-c9c8a2 for lane B.
        Reserved ids are listed under identifiers_reserved and never in
        target_ids. Returned ids are listed in DEC-20260929-1eded2 R-IDS.

