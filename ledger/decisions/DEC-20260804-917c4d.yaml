coordinator_decision:
  id: DEC-20260804-917c4d
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-058
  recorded_by_task: TASK-20260804-046
  archived_by: TASK-20260804-046
  context: >-
    BATCH-058 ran RUN-OIFP-002 (amended EXP-OIFP-0ca0c9 v2) with large-class curves
    (class_size 174-558). MITM collisions found at 4 reps. Key finding: actual cost
    is O(C * sqrt(class_size)) with C ~ 40-90, not O(sqrt(class_size)) as predicted.
    The 3-isogeny volcano graph has slow mixing due to hierarchical structure.

  decision: continue_with_revision
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    H-OIFP-097d1a stays `specified`. The MITM is VALID (collisions found) but the
    birthday-paradox bound underestimates cost by C ~ 50-100. The key unknown is
    whether C grows with p. The hypothesis requires revision: replace O(p^{1/4})
    with O(C(p) * p^{1/4}) and investigate whether C = O(1), O(log p), or O(p^epsilon).

  rationale:
    - >-
      4 large-class reps collided at mean ratio 68.5 to sqrt(class_size). MITM is
      valid and functional.
    - >-
      Volcano structure creates bottlenecks: random walks on the 3-isogeny volcano
      (hierarchical graph) mix much more slowly than on a random regular expander.
      The measured C ~ 68.5 captures this mixing penalty.
    - >-
      Whether C is constant or grows with p is unknown and determines whether this
      is O(p^{1/4}) or something worse. At bits=21 (4 reps): C ~ 40-90. Need bits=40
      data to estimate the scaling.

  exact_next_action: >-
    Update H-OIFP-097d1a to reflect the volcano mixing constant. Design a scale-up
    experiment measuring the MITM mixing constant C(p) at bits={20, 24, 28} to
    determine whether C is constant or grows with p. If C = O(1): the OIFP MITM is
    genuinely O(p^{1/4}) with a large practical constant. If C grows: hypothesis weakened.
    Open BATCH-059 to run this scale-up experiment.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      The volcano mixing constant is a known qualitative property (Kohel 1996 volcano
      structure). The quantitative measurement C~68.5 at bits=21 is new but needs
      replication and scale-up before promotion.

  pareto_integrity:
    dominated_by: L[1/2] class group DLP for OIFP at large p; Pollard rho for ECDLP
    sota_delta: {time_exponent: not_applicable}
  claim_ceiling: toy
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-04'
