    whose shared Stage8 review plan produces27 current schema errors. Reserve review inputs were byte-unchanged
    by that integration.
  rationale:
  - Create three hash-pinned full schema replacements without editing any historical handoff or its shared plan.
    The required content already exists under alternate key names, so no new prior, ownership, result or review
    is invented.
  - Retain every original field and procedure deviation. The source explicitly declares same producer/reviewer session
    and lack of Git history; this repair does not grant independence or source-history verification and does not
    adopt its scientific conclusions.
  - This operational repair restores parseable canonical indexing and avoids exempting new failures in the validator
    baseline. No hypothesis, experiment or goal status is changed.
  - The priority is justified by a concrete full-ledger failure obstructing current reserve verification; three
    exact immutable replacements are the smallest complete repair.
