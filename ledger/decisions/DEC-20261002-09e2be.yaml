  # ---------------------------------------------------------------------------
  rationale:
    - id: R-J1
      text: >-
        J1 owns C8 alone. Under the frozen in-force text rule, a numeral in
        index text is a figure and the whole audit sheet is in force. Thirteen
        single-string items of the audit sheet's c8_sweep.entries restate 38
        index-calculus time figures with no memory figure in the item, and the
        reviewer shows the break survives the broader same-field reading too
        (J1-B1). The specification's proof_search_map.bottleneck gained a last
        sentence restating three time figures with memory named but not
        stated (J1-B2). The J2-D5 class of DEC-20261002-353743 is therefore not
        remedied and RV3-2 is undischarged. The hypothesis layers carry no
        WITHOUT figure, the in-force index is complete (J7), J2-D1 to J2-D4 are
        remedied, every A(571, m) log line prints its store, and every memory
        figure recomputes at its own point. The break is real and narrow, and
        it is the third consecutive round in which C8 breaks.
    - id: R-J2
      text: >-
        The specification's M7 lemma form is correct at every m and both k
        readings, every printed endpoint reproduces exactly, and P-S is scoped
        at every operative statement. One hypothesis sentence
        (version_4.interpretation_limits.entries[5]), the designated
        replacement of the version-3 sentence RV3-3 targeted, reads the
        attributed range without "above the cumulative crossover". Read
        literally it asserts a direction one degree outside what PTM-I
        supports; read charitably it still omits RV3-3's third clause where
        the in_force_index says the clause belongs, and rd6_search_corrected
        certifies a qualification the sentence lacks. Either way RV3-3 is
        undischarged at that location. It is the second consecutive round in
        which an M7 remedy reached some places and not all.
    - id: R-J3
      text: >-
        Route T is in place by rule; H5 is numbered with a falsifier and a
        validation pointer; E1, E2, H1 and H5 are word for word identical in
        the two files; the one-k rule refuses every other k and t; E1 and E2
        coincide exactly with H1's one-step tolerance and lower edge. O-J3-1
        shows that the random-model justification H5 cites is contradicted by
        the matched-shape null it names (from m = 10) and by Semaev's own
        standard-F4 pricing of system (5) (from m = 6 at D = 4), so every
        per-m reading routed through H5 rests on the block conjecture H1a
        alone, which the justification does not say. The plan's J3 breaking
        list does not contain this artifact and the keys are applied as
        written, so J3 holds and O-J3-1 is a material revision item (RV4-6).
    - id: R-J4
      text: >-
        Reachability per branch agrees with independent closed forms at every
        branch and every (k reading, P form) pair; every unreachable branch is
        marked; the K4 revisit restriction is rule text; PTM-G meets its
        signature. OBJ-RT-J4-1 is material: the closed forms fix the only
        reachable P-C branch, so execution adds custody and citability only
        for P-C, and claim (A) may be fixed by a zero-run read of committed
        records the reviewer could not open. The stated information value is
        overstated and the cost side of execution is not weighed (RV4-7).
    - id: R-J5
      text: >-
        IR-1's second sentence, carried since version 2, forbids any value
        read from any file, argument or record to be used as a term or
        multiplier of any cost formula. definitions.rho with IR-3 and Stage
        0, C-RHOCONV, and on one reading BR-1, require exactly that.
        DEC-20261002-353743 S-3 made the literal reading govern a frozen
        contract's operative validity and input rules and ruled the O-RT-01
        class breaking; each escape is a narrowing the text does not state.
        J5 breaks on it (RV4-4). Everything version 4 changed for J5 (RV3-4,
        RV3-5, RV3-12) holds, all 127 hunks map, nothing composed as holding
        regressed, C1 to C7 stay discharged.
    - id: R-J6
      text: >-
        MI-2 is declared with its basis checked at source, its consequence
        disclosed at 571, 283 and 359 under both k readings, its direction
        verified at every claim-(A) cell, and carried into H1, every threshold
        and both templates. The fixture passes as frozen under the in-force
        readings and under both P forms, so it does not identify MI-2, as
        version 4 states; the three named wrong readings fail. D-CARRY finds
        every J9 and J10 value version 4 carries value-identical to the frozen
        version-3 copy or covered by constants_delta.
    - id: R-J7
      text: >-
        Custody intact, all approval fields present, the in_force_index covers
        580 of 580 earlier-layer paths with correct statuses and resolving by
        paths, the block agrees with the contract field by field, every code
        block reproduces its pin and executes nothing on import, and no new
        validate_ledger error names these paths.
    - id: R-J8
      text: >-
        RV3-13 asked for pricing_conventions to be re-based on three correction
        records read at source. Item (3) cites CORR-20260925-649e25 for the
        reading that record supersedes (the record's corrected reading is
        conditional and per row, not "each"). The composer reads the plan's
        artifact "read-at-source statement false" as covering the statement's
        substance, as DEC-20261002-353743 S-3 did for C4's read-at-source limb,
        so J8 breaks (RV4-5). Operational effect is none; the defect is a
        citation of a correction record against its own correction. CD-16
        describes the change as content unchanged. No breaking UNOWNED item.
    - id: R-BLIND
      text: >-
        J9 agrees with version 4 on all eight Q1 rows and all six Q2 cells
        under its PF-1 labels, argmins and runner-ups included. J10 agrees
        under PF-1 on Q1-571, every QM figure and variable count compared, the
        cumulative crossover at 58 of 58 lines, and the PF-1 derived threshold
        items. J11 agrees with every newly frozen value it computed (NF-01 to
        NF-06, NF-08, NF-09, NF-12 to NF-18, and the computed parts of NF-07,
        NF-10 and NF-19), within tolerance, under matching labels; the only
        print difference is three one-decimal N5/60 ratios at exact half-way
        values, an undeclared tie rule rather than a value difference (CF-1).
        NF-11 and NF-20 to NF-25 and the contract-field parts of NF-01, NF-07,
        NF-10 and NF-19 are NOT BLIND-RE-DERIVED; non-blind reviewers checked
        them. The three blind threshold tables (J9, J10, J11) agree under PF-1
        wherever their definitions coincide; J10 and J11 agree at 232 of 232
        integer entries.
    - id: R-KEYS
      text: >-
        K-revise-defect fires (J1, J2, J5, J8; RV3-2, RV3-3, RV3-13). K-leak
        fires on J11's three BL-4 leaks from EXP-SEMBIN-992e73's specification
        (lines 144, 148-150, 156), which carry sister-run values, not values of
        any J11 quantity; NF-02(e), the nearest, is admitted only as
        attested-blind, and approval would not have depended on it. No other
        key fires: K-fixture (fixture passes), K-indeterminate (no
        same-label disagreement; every value-moving J11 Q0 item is either a
        declared choice, a reading the in-force text excludes, or a print
        convention), K-carry-broken (D-CARRY clean, tool passes both carried
        reports), K-duplicate, K-impediment, K-infra. No tripwire fired.
    - id: R-GATE
      text: >-
        Both gate files are present and bound; all 594 hit lines carry exactly
        one disposition (541 D4b, 53 D1); every D4 group basis was re-read and
        sixteen hits were opened at source and found correctly classified; two
        hits in AGENTS.md and the record template could not be reproduced at
        the current tree because those files changed after the grep's base
        commit, and are recorded as unverifiable. Two procedure findings
        (GF-1 a raw-hit count of 681 in the grep file against 682 in the
        receipt; GF-2 a whitelisted file carrying sister-run values outside the
        gate's remit) bear on no compared value. No gate defect is repaired by
        re-running a review.
    - id: R-STRUCTURAL
      text: >-
        Three defect classes recur. C8 has broken in the version-2, version-3
        and version-4 rounds, each time where the previous remedy did not
        reach, and this time not on the hypothesis layering, which DI-INDEX
        cleaned, but in the producer's own sweep and summary text. A remedy
        reaching one file but not its mirror has recurred twice (RD-6, RV3-3).
        Literal conflicts among operative rules have recurred twice (O-RT-01
        and O-RT-02, then IR-1 sentence 2). The common cause is the same
        content restated across four files and four layers and checked by
        hand. The remedy is structural: the superseding record form with a
        single-source rule, and three mechanical pre-review gates run before
        the snapshot (C8 sweep, mirrored-sentence identity, clause-by-clause
        literal trace). A same-form version 5 is not named.
    - id: R-DECISION-VALUE
      text: >-
        Overturn condition (3) of the prior is partly met (J4): for P-C the
        closed forms already fix the only branch a valid run can reach, and
        for P-A a zero-run read of committed records may do the same. The
        lane's next act therefore starts with that read, and its opening
        decision rules whether a version-5 contract and its execution rank
        above doing nothing before any further max-tier round is spent.
    - id: R-SCOPE
      text: >-
        Every conclusion here is about a zero-run design contract for Semaev
        2015's stage-1 model as frozen in EXP-SEMBIN-81dc96, evaluated in
        closed form at n = 571 and the claim-(A) degrees, omega 3 scored,
        under MI-1 and MI-2. Nothing here bears on the true solving degree,
        the 571 cell, or any curve, standard or deployed system. The defects
        are text, rule and record-form defects, not mathematical results.

  # ---------------------------------------------------------------------------
  rulings_on_relayed_items:
    - id: S-1
      subject: OBJ-RT-J5-1 reading (requested by TASK-20261002-ee63af)
      ruling: >-
        The literal reading governs (DEC-20261002-353743 S-3). IR-1 sentence 2
        as written conflicts with the rho column, C-RHOCONV and, on one
        reading, BR-1; route one, two or three each needs a narrowing the text
        does not state. J5 breaks. Remedy is the one-clause narrowing D-8
        FD-IR1 intended.
    - id: S-2
      subject: B-J8-1 alternative reading (disclosed by TASK-20261002-aeaf93)
      ruling: >-
        "Read-at-source statement false" covers substance, not only the fact
        of a read. J8 breaks. Had the attestation reading been taken, the
        decision would be unchanged (J1, J2 and J5 break independently).
    - id: S-3
      subject: B-J2-1, literal or charitable reading of "there" (disclosed by TASK-20261002-f19cfa)
      ruling: >-
        Under either reading RV3-3's third clause is absent at the location the
        in_force_index designates, so RV3-3 is undischarged there and J2
        breaks. The composer does not need to choose between the readings.
    - id: S-4
      subject: O-J3-1 and the J3 claim's "with its random-model justification"
      ruling: >-
        The keys apply the plan's frozen breaking_artifact list, which does not
        contain a self-contradicting justification. J3 holds; O-J3-1 is a
        material revision item (RV4-6) and a heuristic-validation item for the
        next round.
    - id: S-5
      subject: J11 Q0-02 (relation store) and Q0-09 (NF-05(c) wording)
      ruling: >-
        Not undeclared model choices. The in-force specification states the
        store as the log2 count of stored relations (2^k), which J11's ST-CNT
        matches everywhere; the literal "log2 k" wording stands only in the
        blind inputs and the worksheet's NF conventions. The in-force sentence
        "from m = 5 (MI-1) and m = 7 (ceiled)" on fixes the inclusive reading
        of NF-05(c). Both are wording findings (CF-2, CF-3).
    - id: S-6
      subject: TA-1 and the version-1 hypothesis bytes (noted by TASK-20261002-ccdc5f)
      ruling: >-
        Not fired. The listed words stand only in superseded version-1 fields
        whose bytes R-FORM requires to stay unchanged; they are indexed
        superseded and carry no in-force statement.

