coordinator_decision:
  id: DEC-20260802-9664c6
  decided_at: '2026-08-02'
  owner: coordinator
  decided_by: coordinator
  goal_id: GOAL-HQC-001
  batch_id: BATCH-002
  decision: refine
  target_ids: [GOAL-HQC-001, RQ-HQC-001, BATCH-002, EV-HQC-6fd5b1, CORR-20260802-3ae664]
  target: GOAL-HQC-001
  evidence_ids: [EV-HQC-6fd5b1]
  question_ids: [RQ-HQC-001]
  hypothesis_id: null
  hypothesis_status_change: none
  hypothesis_status_change_note: >-
    No hypothesis exists. active_hypothesis_ids was empty before and is empty
    after.

  disposition: refine
  disposition_rationale: >-
    'refine' again, and deliberately not 'expand'. The batch discharged its
    mandate and opened the design gate, but its own headline recommendation was
    defeated on review and two of its outputs need superseding corrections. The
    right next move is a narrower, better-aimed design, not a wider search. Not
    'support' or 'weaken': nothing about HQC was tested. Not 'pause': the gate
    that blocked this campaign from its first day is now open and four batches
    of budget remain.

  decisions:
    - id: D-1
      statement: >-
        RQ-HQC-001.constraints[0] IS DISCHARGED. Three primary sources are filed
        as KN-LIT entries at independently confirmed provenance levels.
        EXPERIMENT DESIGN IS UNBLOCKED for the first time in this campaign. This
        is the gate DEC-20260802-344883 D-1 recorded as only partly discharged,
        and the distinction between acquiring and FILING was the right one to
        have insisted on.
      basis: EV-HQC-6fd5b1 O-1; TASK-20260802-32250e duties 4 and 5; TASK-20260802-caddef duty 2
    - id: D-2
      statement: >-
        THE RS-S3 DEFECT IS THE SPECIFICATION'S, NOT THIS PROGRAM'S. The value
        49 is printed in the published HQC specification; its own definitions
        give 59 on four independent routes. The BATCH-001 transcription was
        faithful and its SOURCE-anomaly classification was correct.
        CORR-20260802-3ae664 corrects the specification's value and supersedes
        four of this program's records that said otherwise.
      basis: CORR-20260802-3ae664; five byte-identical re-acquisitions across four independent sessions
      and_critically: >-
        THE PUBLISHED DFR WAS NOT COMPUTED WITH 49. Tables 5 and 11 are
        consistent with 59. This is a documentation defect in a standardized
        algorithm's specification, NOT a defect in its security claim, and the
        BATCH-001 50.7-bit figure must never be cited as the latter.
    - id: D-3
      statement: >-
        THE A19 RETARGET IS REJECTED. The campaign is NOT redirected. A19's
        10.61 / 7.96 / 16.79 bits is arithmetically correct — independently
        verified against RMRS's own published Table 4 — but the bits are not
        VALUE: Theorem 6.1 evaluated with Prop 6.1.3's p_i misses SPEC Table 5's
        own DFR targets at all three levels while 6.1.4 clears at all three,
        Table 11's printed values are numerically 6.1.4's, and the
        specification's Changelog records that the improved Reed-Muller bound is
        what set the parameters. A19 IS A STALE CROSS-REFERENCE OF THE SAME
        FAMILY AS THE PRINTED 49, and resolving it moves ZERO published bits.
      basis: TASK-20260802-caddef objection O1 and duty 4
      disposition_of_a19: >-
        Filed as a documentation correction in the same family as the 49 —
        CORR-20260802-3ae664 part C — not as a research target.
      note_on_process: >-
        Verifying the numbers was necessary and NOT sufficient. The validator
        explicitly declined to recompute them and flagged A19 as only partly
        confirmed; the red team recomputed them, found them RIGHT, and defeated
        the recommendation anyway on what the numbers MEAN. A retarget accepted
        on arithmetic alone would have redirected this campaign onto a
        typographical inconsistency.
    - id: D-4
      statement: >-
        THE COORDINATOR MISREAD ITS OWN PRODUCER, and the retraction is recorded
        rather than quietly repaired. TASK-20260802-15971b made TWO
        recommendations: (a) retarget A17 to the joint moment mu_{delta_e+1}
        WITHIN THE SAME LANE, and (b) sequence A19 first. The Coordinator
        compressed these into "retargeting AWAY from A17" in the a4f56a receipt
        and commit 9baa7d87 — DROPPING THE PRIMARY RECOMMENDATION AND ELEVATING
        THE SECONDARY ONE, which review then defeated. The Coordinator also
        forwarded "A19 exceeds the conservatism budget", an incommensurable
        comparison, without challenging it.
      basis: TASK-20260802-caddef, claims-found-to-be-overreads
      consequence: >-
        Recommendation (a) IS ADOPTED and becomes this goal's next action.
        Recommendation (b) is rejected per D-3. The producer was right on its
        primary point and the Coordinator lost it in transmission.
    - id: D-5
      statement: >-
        THE A17 LANE KEEPS ITS STANDING, on a ground the batch did not start
        with. The producer's null control reported A17 as IMPLIED by A5 applied
        to disjoint blocks, which would have made it a redundant target. The red
        team found that implication HOLDS ONLY ON THE MODEL SPACE (M): on the
        true space (T) the producer's own section 2.1 declares A5's antecedent
        false, so the implication is VACUOUS there — and (T) is the space that
        matters. BATCH-001 objection O10's framing is NOT refuted.
      basis: TASK-20260802-caddef objection O3
      why_this_is_worth_recording: >-
        The null control fired against the batch's own interest, and then an
        independent session found the null control had been applied on the wrong
        space. Controls before belief, then controls on the control.
    - id: D-6
      statement: >-
        THE CENTRAL SCIENTIFIC RESULT OF THIS BATCH IS A NAMED OBSTRUCTION. The
        direction of A17's failure CANNOT BE SIGNED FROM THE PAGE: two
        mechanisms of opposite sign are both present, the distortion reduces to
        the joint moment mu_{delta_e+1} rather than to pairwise correlation, and
        mu_m is not determined by mu_2 — so SECOND-MOMENT DATA IS STRUCTURALLY
        INCAPABLE of signing it, and all published evidence is second-moment.
      basis: EV-HQC-6fd5b1 O-6; derivation independently recomputed by TASK-20260802-32250e
      why_this_matters: >-
        It converts "measure the DFR" from a preference into a necessity with a
        named obstruction, which is exactly the closure standard
        docs/inventor-protocol.md demands. It also tells the eventual experiment
        WHAT TO MEASURE — a high-order joint moment — rather than the pairwise
        correlation a naive design would have targeted.
    - id: D-7
      statement: >-
        A SECOND FLAG-WITHOUT-RESOLUTION IS NOW FROZEN IN THE IMMUTABLE CORPUS.
        KN-LIT-b9e1a8 item 3 records the 6.1.3/6.1.4 inconsistency without
        deriving its resolution — verbatim the failure mode this Coordinator
        faulted BATCH-001 for on the 49, committed by the very batch that was
        correcting it. The entry is immutable and is NOT edited;
        CORR-20260802-3ae664 part C supplies the resolution and binds to it.
      basis: TASK-20260802-caddef objection O2, confirmed by the Coordinator against the filed entry
      lesson_recorded_not_moralised: >-
        The deferral in DEC-20260802-344883 D-2 bought a correct RS-S3 and did
        not buy a clean entry. Filing gates should check for
        flag-without-resolution as a CLASS, not for the one instance already
        known.

  knowledge_promotion:
    promoted: [KN-LIT-b9e1a8, KN-LIT-1c9474, KN-LIT-4c1133]
    not_warranted: >-
      Three literature entries promoted — the deferral in DEC-20260802-344883
      is discharged. NO KN-FIND is promoted: this program still produced no
      internal result about HQC. The A17 obstruction (D-6) is a genuine internal
      derivation and is a KN-FIND CANDIDATE, but it is deliberately held until
      an independent session has checked the derivation on the true space (T)
      rather than only its arithmetic — the same discipline that just caught the
      A5-implication error. KN-OPEN-3f7a21 is unchanged.
  knowledge_promotion_detail:
    promoted:
      - id: KN-LIT-b9e1a8
        what: HQC specification, 22/08/2025, citation_verified read
        caveat: Item 3 flags the 6.1.3/6.1.4 inconsistency without resolving it; see D-7 and CORR-20260802-3ae664 part C.
      - id: KN-LIT-1c9474
        what: Aragon-Gaborit-Zemor, HQC-RMRS, arXiv:2005.10741, citation_verified read
      - id: KN-LIT-4c1133
        what: eprint 2026/461, citation_verified web, abstract only, out-of-declared-scope flag preserved
    held_back:
      - what: A KN-FIND for the A17 second-moment obstruction
        reason: >-
          Held, not refused. It is this program's first genuine internal
          derivation about HQC, and precisely for that reason it gets an
          independent check on the SPACE the derivation lives on before it
          enters the corpus. BATCH-002 has just demonstrated what happens when a
          space is not checked.
      - what: An upgrade to KN-LIT-2141
        reason: not_warranted, unchanged from DEC-20260802-344883 — Guo-Johansson still unread in full.

  promotion_gates_status: >-
    NONE OF G1-G4 ADDRESSED. BATCH-002 advances no asymptotic-complexity claim
    of this program's own.

  claim_tier_effect: none
  claim_tier_effect_note: >-
    Toy ceiling stands. The two documentation defects recorded in
    CORR-20260802-3ae664 are statements about the specification's text, not
    about HQC's security, and are scoped as such.

  closure_quorum_admissibility: NOT_ADMISSIBLE
  closure_quorum_note: >-
    Both reviews were independent sessions on ONE model (claude-opus-5,
    fallback_used true). AGENTS.md rule 13 requires pairwise-distinct
    resolved_model_id. No attestation recorded and none may be synthesized from
    these reviews.

  next_action: >-
    EXACTLY ONE NEXT ACTION: open BATCH-003 and DESIGN THE MEASUREMENT — the
    gate is open for the first time. Target the joint moment mu_{delta_e+1} of
    the inner-decoder failure indicators ON THE TRUE SPACE (T), which is
    TASK-20260802-15971b's own primary recommendation, recovered in D-4 after
    the Coordinator dropped it. The design must (i) measure a HIGH-ORDER JOINT
    MOMENT, not pairwise correlation, because D-6 establishes second-moment data
    cannot sign the direction; (ii) sample on space (T) with true fixed-weight
    x, y, r1, r2, e, never on the model space (M), because D-5 shows the two
    spaces are exactly where the A5/A17 reasoning diverges; (iii) carry a null
    object of the same shape per docs/inventor-protocol.md — the identical
    measurement on an i.i.d.-by-construction ensemble — since a joint-moment
    excess that fails to vanish on the null is an artifact; and (iv) state its
    reduced parameters and its extrapolation as numbered heuristics, with the
    claim-tier ceiling staying toy. DO NOT pursue A19: D-3 rejects it as a stale
    cross-reference worth zero published bits. Before dispatching, add a
    FLAG-WITHOUT-RESOLUTION CHECK to the filing gate per D-7.

  audit:
    considered_and_not_taken:
      - option: Accept the A19 retarget on the producer's recommendation
        why_not: >-
          Arithmetically right, strategically wrong. It would have redirected
          the campaign onto a typographical inconsistency worth zero published
          bits. The red team's O1 is the single most valuable output of this
          batch.
      - option: Treat the printed 49 as evidence of a defect in HQC's security claim
        why_not: >-
          Checked and false. Tables 5 and 11 are consistent with 59. Asserting
          otherwise would be exactly the overclaim rules 4 and 7 forbid, on a
          standardized algorithm.
      - option: Edit KN-LIT-b9e1a8 to add the missing resolution
        why_not: >-
          Corpus entries are immutable. CORR-20260802-3ae664 part C supersedes;
          it does not overwrite.
      - option: Promote the A17 obstruction as a KN-FIND now
        why_not: >-
          It is the program's first real internal derivation about HQC and it
          lives on a space distinction that has already caused one error this
          batch. It gets an independent check first.
      - option: Quietly fix the Coordinator's misreading of its own producer
        why_not: >-
          D-4 is recorded because the failure mode — compressing two
          recommendations into one and losing the primary — is the kind that
          repeats silently. This is the third batch running in which Coordinator
          claims were corrected by review.
  inference:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: claude-opus-5
    fallback_used: true
    model_verified: false
