  rationale:
    - >-
      THE PRE-DECLARED RULE DECIDES. PR-1..PR-5 were written before the premise
      check ran, and each holds on archived bytes. Approving is the rule's
      outcome, not a judgement call; refusing a draft whose declared readings
      all pass would be premature closure of the only route to the measured
      side of criterion C1.
    - >-
      THE PREMISE THAT MATTERED IS NOW CHECKED. The characterization left one
      premise open: that the substituted system is the written one. PR-1 shows
      it on all 72 archived inputs and, with the injectivity of the writer on
      reduced systems, shows that the substitution the check computed is the
      one solve() computes. So SSF clause (iv) catches mode B, and clause (ii)
      catches mode A, by the frozen classifier's own reasons.
    - >-
      CONDITIONS CLOSE WHAT THE READINGS COULD NOT SEE, WITHOUT CHANGING THE
      RULE. The observation-collision audit found that a seed-corrupted
      parametrisation could, in principle, lower a recorded solution set with
      no SSF clause (C-1..C-3). It cannot alter D. SC-3 measures it at zero
      solver cost before any spend and stops on any instance; SC-4 records it
      beside every repaired package; SJ-5 owns it. K, SF-1, the cap and the
      (d) branch are untouched.
    - >-
      STRICTNESS IS NOT LOOSENED. REG-1 compares recorded attempts with no
      tolerance, the exclusion list gains nothing, every attempt is preserved,
      and a failure that reproduces keeps its frozen class.
    - >-
      THE BIAS IS TOWARD THE DECIDABLE QUESTION. Criterion C1's measured side
      and KN-OPEN-9b4a2b need the v2 ladder and the 31-bit rung; this approval
      is the step that lets them run under a reproducibility regime.
    - >-
      NO SECURITY READING. Toy EcGFp5-shaped arithmetic with known scalars;
      nothing transfers to p = 2^64 - 2^32 + 1.

