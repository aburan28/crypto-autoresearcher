    audit_1_baseline: >-
      Not a proof-oriented claim; no bottleneck or exponent is claimed. The
      exact-baseline reproduction of the pipeline is REG-1 against the
      archived RUN-GFPN-ac4487 (SE-4, d-parsed per SF-4), unchanged.
    audit_2_observation_collision: >-
      Observable: "no SSF clause" on an attempt, taken by the design (SF-5
      consequence, draft lines 383-384) to mean that every field REG-1 or a
      cell records is correct. Collision search by reading
      v2_solver.rational_solutions (lines 441-470), for a seed-corrupted
      output that is ok-classified with no SSF clause yet records a different
      F_p-rational solution set:
      - C-1: a root r of the eliminating polynomial with den(r) = 0 is skipped
        silently (lines 455-457): no substitution failure, no reason.
      - C-2: a root whose parametrisation has the wrong arity is skipped
        (lines 466-468), recorded only in solution_info.arity_mismatch.
      - C-3: the root-to-point map is not checked to be injective; a wrong
        parametrisation that sends two roots to one true F_p point yields a
        duplicate entry that passes substitution, and the recorded set loses a
        solution. When msolve adds no linear form the last coordinate is the
        root itself (lines 464-465), so C-3 needs an added linear form.
      FINDING: a collision family exists in principle for the SOLUTION-SET
      field. It does NOT reach D: D is the printed quotient dimension
      (v2_driver.py lines 199-204), independent of the parsed solutions, and
      is printed before the seeded FGLM step (draft F-4, lines 232-237). None
      of C-1..C-3 is observed in the archived data (mode B's denominator
      agreed with the modal output, draft line 225), and none is measured
      either: the premise check records n_rational_solutions, not root counts
      (e.g. JSON lines 2967, 2980). At G1 any instance fails REG-1 (d-parsed
      compares solution sets as sets), a false gate failure and never a
      result. At cells it could lower recorded solutions for a target without
      changing D.
      SEPARATING CONDITION: SC-3 (a zero-solve development check that STOPS
      the stage on any instance, including over the 75 archived outputs of O)
      and SC-4 (a recorded, never-acted-on accounting of every ok-classified
      retained output in R2' and R2b'), with SJ-5 owning the joint.
    audit_3_quantifier_order: >-
      Claim as used: for every input x and every seed s, if the attempt on
      (x, s) is ok-classified then its recorded D equals D(x). The witness is
      the printed quotient dimension, which the source reading places before
      the time-seeded step (F-1, F-4) and which SE-2 (4) requires to agree
      across attempts whenever a re-solve occurs. The seed dependence allowed
      is only in the parametrisation, which D does not read. The claim for the
      solution set is weaker and is scoped by audit 2. No uniform claim over
      primes is made; transfer assumption (3) (draft line 639) says nothing is
      assumed about the rate at 262151, 16777291 or 1073741831.
    audit_4_method_ceiling_and_nearby_object: >-
      Not applicable: no method ceiling is claimed. The nearby-object control
      of the experiment (the norm-arm proves-too-much control and the c = 59
      comparison) is unchanged and stays with the review plan (SC-9).
    conclusion: >-
      Implementation may be approved. The collision family is a scope finding
      on the solution-set field, handled by SC-3, SC-4 and SJ-5 without
      changing any pre-declared rule. Passing these audits claims nothing
      beyond AGENTS.md core rules 6 and 10.

