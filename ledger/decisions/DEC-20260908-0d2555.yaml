coordinator_decision:
  id: DEC-20260908-0d2555
  decision: approve
  decided_by: coordinator
  decided_at: '2026-09-08'
  target_ids:
  - EXP-ECDLP-651b94
  - TASK-20260908-6a010d
  - TASK-20260908-8e93d0
  context: The fresh independent source-conformance review is archived at 89b2eefa8dafadc32a81673faf8446d0485fb94f.
    Approve a second immutable implementation correction under the unchanged specification and DEC-20260907-38017a.
  rationale:
  - Accept V-01 through V-08 on the exact worked static/mock defects recorded by TASK-20260907-2fd901. The independence
    audit passed for its one owned joint; no scientific run or hypothesis claim is at issue.
  - 'Rank completing this already approved implementation before adding speculative work: its launch path is currently
    impossible under ordinary source-snapshot then review-archive ancestry, and its frozen exploratory seeds, stopping
    and custody are incomplete. Each correction has a concrete counterexample or missing source path.'
  - Retain the finite 96 held-out decision panel and all original seeds/thresholds. Add the omitted exploratory
    stream without permitting tuning. No scientific amendment is made.
  - Standing user authorization already covers implementation. Require complete final-code regression within a fixed
    160-case allowance including reruns, followed by archive and independent review; this is not measurement authorization.
  accepted_findings:
  - id: V-01
    title: Frozen subgroup enumeration is not implemented by repeated addition
    required_correction: Enumerate O,G,2G,...,(r-1)G with one checked repeated-addition accumulator, retain the
      order/distinctness certificate, and keep the canonical sort only after the exact enumeration is complete.
  - id: V-02
    title: The prospective runner omits all eight frozen exploratory seeds
    required_correction: Add the exact 606300..606307 exploratory stream with separate custody and labels, prohibit
      its outputs from mutating any frozen choice, and keep the 96 held-out cells as the sole threshold decision
      panel.
  - id: V-03
    title: Named validity failure does not apply the frozen immediate stop rule
    required_correction: After durably recording the failed cell and certificates, raise a typed measurement-invalid
      stop that preserves the partial package and emits completed_invalid without scheduling another cell.
  - id: V-04
    title: Frozen secondary and per-diagnostic cost custody remains incomplete
    required_correction: Compute and serialize every named secondary statistic, instrument inversion/comparison
      counts, bracket each diagnostic with CPU/wall and memory observations, and bind those rows into raw-result.json,
      costs.csv, report.md and manifest metrics.
  - id: V-05
    title: Manifest UTC timestamps do not bracket the measured execution
    required_correction: Capture UTC and monotonic clocks together at pipeline entry, capture UTC/monotonic finish
      after the terminal outcome, and serialize that same bracket once into manifest timing and the report.
  - id: V-06
    title: A post-rename durability failure leaves a canonical final directory exposed
    required_correction: Give the post-rename durability boundary its own state transition. On failure, move the
      exposed final directory to the incomplete area with a typed receipt when possible, and never return a failure
      while a canonical final path remains visible without an explicit durable state.
  - id: V-07
    title: Review admission conflates reviewed source snapshot with executing archive HEAD
    required_correction: Bind separate reviewed_source_snapshot and executing_commit fields. Require the report
      to name the former, require the archive and former to be ancestors of the latter in the correct order, require
      HEAD to equal the latter, and compare the executing source bytes against the reviewed snapshot and lock hashes.
  - id: V-08
    title: Dense Cayley control work runs outside bounded guard checkpoints
    required_correction: Thread the guard callback through allocation, matrix construction, row/column and matrix-vector
      loops at a documented bounded stride, and durably record any partial control state before returning an operational
      incomplete outcome.
