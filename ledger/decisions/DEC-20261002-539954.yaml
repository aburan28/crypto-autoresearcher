  rationale:
  - >-
    COLLISION 1 IS RESOLVED BY KEEPING BATCH-aa267f's EXECUTED DESIGN AT THE
    CANONICAL PATH AND READING EVERY MAIN-LINEAGE CITATION THROUGH
    CORR-20261002-3628e2. experiments/EXP-ICINV-4d33aa/amendments/v3.yaml
    holds BATCH-aa267f's design (git blob e0f53b197008, sha256
    b14bc437e2d168e8db472c3c142f40e7ab6d18028fa2bfe5ae4a7c97859d0a99; filed
    2026-08-09, approved 2026-08-10, executed as RUN-ICINV-849d1d) and stays
    there. BATCH-de621d's design (git blob fe9e6a3bf88b, sha256
    e671f42cc3fe0972425a66265fa061cf55dc96b3a0c7bd0d301b591965596dc3; filed
    2026-08-10 by TASK-20260810-dca469, frozen, never executed) stays at
    amendments/v3-BATCH-de621d-unexecuted-alternate.yaml, where
    DEC-20260811-af68d1 put it. No file moves. CORR-20261002-3628e2 gives the
    reading rule and the full lists: the 34 main-lineage files (list A) and
    the main-side notes of GOAL-ENDO-001's goal head mean de621d's design and
    are read as the alternate path; the 41 branch-lineage files (list B) mean
    aa267f's design and need no mapping.
  - >-
    WHY THIS DIRECTION FOR COLLISION 1. (a) It is the option the user
    approved: "a correction record mapping the old citations to the preserved
    copy". (b) The only content-hash pin of either design anywhere on main,
    coordination/goals/GOAL-ENDO-001/batches/BATCH-de621d/reviews/validator/validation_report.yaml
    (artifact experiments/EXP-ICINV-4d33aa/amendments/v3.yaml, sha256
    e671f42c..., status verified; read by this Coordinator), ALREADY matches
    the alternate copy, so main's one byte-bound reference verifies against
    the preserved file under this reading and needs nothing new. aa267f's hash
    b14bc437... is pinned nowhere. (c) The other direction -- moving aa267f's
    design off the canonical path and putting de621d's back -- would leave
    every branch-lineage citation pointing at the wrong file, and those
    include 22 files of immutable run records under
    experiments/EXP-ICINV-4d33aa/runs/ (RUN-ICINV-849d1d, RUN-ICINV-476e12,
    RUN-ICINV-476e12-failed, RUN-ICINV-4bf6c8, RUN-ICINV-ff0806) and 6 under
    experiments/EXP-INSTR-36c8cf/runs/. Those cannot be edited; repairing
    them would need superseding records for RUN-ICINV-849d1d and its
    dependents. List A, by contrast, holds no run record of either
    experiment, and a reading rule in one correction serves all of it. (d) It
    keeps the arrangement DEC-20260811-af68d1 recorded on the branch, so no
    archive that already binds either file is disturbed.
  - >-
    COLLISION 2 IS RESOLVED BY RESTORING main's PACKAGE TO
    harness/exp_icinv_e0cd8f/ AND MOVING THE BRANCH'S MODULE, BYTE-IDENTICAL,
    TO harness/exp_icinv_e0cd8f_m3class.py. Performed by the top-level session
    under TASK-20261002-ca73d4 as pure renames (git mv; bytes unchanged):
    harness/exp_icinv_e0cd8f_sage_variant/{__init__.py, run_gate.py,
    sr1_support.sage} -> harness/exp_icinv_e0cd8f/ (sha256 9e2cc811...,
    a3a57a85..., 2387a5bb..., unchanged) and harness/exp_icinv_e0cd8f.py ->
    harness/exp_icinv_e0cd8f_m3class.py (sha256
    fc58d7d9e16e79317fe2743f1d8435f548bb441797a8a4f8796c35fb3b6cef32,
    unchanged). After it, the command main's s0 and s1 record, `python3 -m
    harness.exp_icinv_e0cd8f.run_gate`, resolves again, the package file
    paths their manifests pin exist again, and the EXP-GFPN-05ff43
    consumer-census paths (harness/exp_icinv_e0cd8f/run_gate.py,
    __init__.py; "MR-PIN: EXP-ICINV-e0cd8f harness") are valid again.
    RUN-ICINV-e0cd8f-m3class pins its module by sha256 (fc58d7d9...), which a
    byte-identical move preserves; what the move breaks is only its recorded
    PATH and invocation, and those are repaired additively by the superseding
    manifest experiments/EXP-ICINV-e0cd8f/runs/RUN-ICINV-e0cd8f-m3class/manifest_v2.yaml
    (registered in tools/run_supersession_registry.yaml) and by
    CORR-20261002-d1334b, which maps every branch-lineage citation of the
    module form. This is the option the user approved: "restoring main's
    package (renaming this branch's module and adding a superseding manifest
    for its run)".
  - >-
    THE MODULE IS KEPT BYTE-IDENTICAL, INCLUDING A COMMAND LITERAL THAT IS NOW
    STALE, ON PURPOSE. harness/exp_icinv_e0cd8f_m3class.py writes its own
    command line into each run's records from a literal at line 976
    (`command = (f"python3 -m harness.exp_icinv_e0cd8f --run-dir {run_dir} "
    ...`, read by this Coordinator). Editing it would change the sha256 that
    identifies the code that produced RUN-ICINV-e0cd8f-m3class. Consequence,
    recorded in CORR-20261002-d1334b: any future run of the relocated module
    records `python3 -m harness.exp_icinv_e0cd8f ...`, which after the
    restore names the package (which has no __main__ and cannot be run that
    way). Such a record is read through CORR-20261002-d1334b, or a future
    re-run uses a new, versioned file.
  - >-
    A CORRECTION OF THE SCOPE OF ONE SENTENCE IN DEC-20260929-ce2b7d, BY
    ADDITION; THAT DECISION IS NOT EDITED. Its collision rationale says: "NO
    RECORD ON THE BRANCH DOCUMENTS THIS RENAME OR GIVES ITS REASON". That is
    not accurate as written. (i) The branch's merge commit 92cf8fa9d5
    (2026-08-11 03:06:37Z, "Merge origin/main a third time ...") gives the
    reason and the destination in its commit message, quoted by the top-level
    session from git: "harness/exp_icinv_e0cd8f.py (this branch's module) vs.
    harness/exp_icinv_e0cd8f/ (the other session's Sage-based PACKAGE of the
    same name): not a git conflict (different paths) but a confirmed Python
    import-shadowing hazard -- empirically verified a same-named package
    always wins over a same-named module in the same directory. The incoming
    package is renamed to harness/exp_icinv_e0cd8f_sage_variant/ to remove the
    ambiguity; its own run manifests' sha256-pinned content is unaffected by
    the path rename." (ii) A LEDGER record on the branch also documents the
    move and its reason, though not its destination path: DEC-20260811-a3398a
    (read by this Coordinator) states that "the other session's
    execution_report.md and its harness/exp_icinv_e0cd8f/ PACKAGE (which would
    otherwise silently shadow this branch's own exp_icinv_e0cd8f.py MODULE
    under Python's import resolution -- verified empirically, a same-named
    package always wins over a same-named module in the same directory) are
    preserved in full at new, clearly-labelled paths." The accurate statement
    is therefore: no branch record names the consequence for main's s0/s1
    records; the reason was recorded in a ledger decision and in a git commit
    message, and the 2026-09-29 Coordinator did not find either. The commit
    message's claim that the pinned content is "unaffected" is true of bytes
    but missed that the s0 and s1 manifests also record the package's IMPORT
    PATH and FILE PATHS, which the move broke and this decision restores.
    Nothing in DEC-20260929-ce2b7d's own resolution turned on the sentence.
  - >-
    COLLISION 3 IS RESOLVED BY KEEPING TASK-20260811-d9d01e's REPORT AT THE
    CANONICAL PATH AND READING EVERY MAIN-LINEAGE CITATION THROUGH
    CORR-20261002-4378ca -- THE SAME REMEDY AS COLLISION 1, ON THE USER'S
    SECOND ANSWER ("Include it (Recommended)"). Found by reading while this
    decision was first drafted (the same DEC-20260811-a3398a passage says the
    other session's execution_report.md was preserved at a new path while the
    branch's own kept the canonical one), it was then verified with git by
    the top-level session against 84f27890be.
    coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/execution/EXP-ICINV-e0cd8f/execution_report.md
    held TASK-20260810-ab0a07's report (git blob aed1f5269a6a, sha256
    ebaad1ce5123fc7e4a2675d798f6d3c8cf337679a802c4a63f35074832f39447;
    RUN-ICINV-e0cd8f-s0/-s1, SR3 gate stop) at the merge base 3e12f4bb0 and
    at da7cc37acf^1, and since the #1493 merge (2026-09-29 20:11:53Z) holds
    TASK-20260811-d9d01e's report (git blob e6eb36b9cc01, sha256
    98b89c64cebbc05e7b96c8883faefaafdf9f52723d7aea80ea3faa0b92171e89;
    RUN-ICINV-e0cd8f-m3class). The ab0a07 report survives byte-identical at
    execution_report-TASK-20260810-ab0a07-infrastructure-stop.md, where the
    branch's merge commit 92cf8fa9d5 (2026-08-11 03:06:37Z) put it when it
    resolved an add/add conflict on the canonical path; the change reached
    main as a one-sided change in the three-way merge. No file moves.
    CORR-20261002-4378ca gives the reading rule and the full census of the
    10 files on main that contain the full path: the 6 main-lineage files
    (list A3) mean the ab0a07 report and are read as the alternate file; the
    4 branch-lineage files (list B3) mean the d9d01e report and need no
    mapping.
  - >-
    WHY THIS DIRECTION FOR COLLISION 3. (a) It is the option the user chose,
    described to them as "a third correction record mapping main-side
    citations of that path to the preserved report, the same remedy as the
    v3.yaml collision. Nothing moves and no file is edited." (b) Neither
    report's sha256 is pinned anywhere on main (top-level session, git), so
    no content binding is broken in either direction; the decisive checks
    are line references, and they favour this reading. This Coordinator read
    both files. CORR-20260810-7cf0e9 (list A3) corrects a figure at "line
    217" of the ab0a07 report, and lines 216-217 of the alternate file hold
    exactly that figure, while line 217 of the canonical file lies in its
    C-BACKEND section and the canonical file contains no "52.7". The ab0a07
    validation report's references to lines 32 and 277 likewise match the
    alternate file. (c) The other direction -- putting the ab0a07 report back
    at the canonical path -- would put every list-B3 citation on the wrong
    file, among them TASK-20260811-d9d01e's own artifact_paths entry and the
    branch's validation and red-team reports beside it, and would undo the
    arrangement DEC-20260811-a3398a recorded. List A3 holds no run record,
    and one reading rule serves all of it.
  - >-
    WHAT THIS DECISION DOES NOT DO. It adjudicates no science: it does not
    compare BATCH-aa267f's and BATCH-de621d's designs, does not say which SR3
    redesign should be the campaign's, and does not compare
    RUN-ICINV-e0cd8f-m3class with s0/s1 or with main's RUN-ICINV-geom-* runs.
    It moves no hypothesis, experiment, evidence, question or goal status,
    approves nothing and dispatches nothing. It re-executes no run: zero runs.
    It edits no existing record and deletes nothing: the moved files keep
    their bytes, every prior manifest and correction stays in place, the
    alternate v3 file stays, and both BATCH-d7e255 EXP-ICINV-e0cd8f execution
    reports stay where they are. It does NOT cause and does NOT repair the
    pre-existing defect of RUN-ICINV-e0cd8f-s0, whose manifest pins
    harness/exp_icinv_e0cd8f/run_gate.py at sha256
    16a4325f3c006583cf1237a56e9e99ac720c009ba6bf7acabe8f4e6ec20dc7dd, which
    the top-level session found does not match the committed file (a3a57a85...)
    under either path: s0 ran an earlier run_gate.py that was never committed.
    After the restore s0's recorded command resolves, but its run_gate.py pin
    still does not verify; that is a property of s0, unchanged here. It
    leaves DEC-20260929-ce2b7d's first three next_actions open and
    unaffected.

