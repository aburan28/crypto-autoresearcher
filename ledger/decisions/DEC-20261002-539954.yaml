  limitations:
  - >-
    This is an administrative record, not a research result. It reports no
    measurement, reviews no evidence, and its claim tier is n/a.
  - >-
    THE CITATION CLASSIFICATION IS MECHANICAL, AND EXACT ONLY ON THE TREE AT
    bbaf753d0b. A file was counted as citing the path when it contains both
    "amendments/v3.yaml" and "EXP-ICINV-4d33aa"; its lineage was read from
    git (present in da7cc37acf^1, in da7cc37acf^2, or both; and for files on
    both sides, the v3 blob in the tree of the commit that added the file).
    A citation added after bbaf753d0b is not covered and must name its file
    explicitly. A reference phrased without that string (for example "amendment
    v3" alone) is not enumerated, though the same lineage rule applies to it.
    This limitation, and the bbaf753d0b base, apply to collisions 1 and 2.
    Collision 3's census was taken separately, at 84f27890be, by the full-path
    string "execution/EXP-ICINV-e0cd8f/execution_report.md" (10 files); it is
    exact on that tree, does not enumerate bare-name or directory-level
    references (those found by reading are named in CORR-20261002-4378ca),
    and a citation added after 84f27890be must name its file explicitly.
  - >-
