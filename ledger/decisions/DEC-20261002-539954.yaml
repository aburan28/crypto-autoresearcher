  decision: supersede
  decision_type_rationale: >-
    Administrative, exactly as in DEC-20260929-ce2b7d. Not support, weaken,
    reject_scoped, replicate or expand: nothing was tested or measured. What it
    does is supersede, BY ADDING, the path reading of three sets of immutable
    records: three correction records state how citations are to be read, and
    one superseding run manifest records where the code of
    RUN-ICINV-e0cd8f-m3class now lives. No prior record is edited or
    deleted, and `supersede` here says nothing about the reliability of any
    run, evidence record or decision it touches.

