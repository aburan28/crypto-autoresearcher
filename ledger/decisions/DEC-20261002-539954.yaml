      citations to the preserved copy, plus restoring main's package (renaming
      this branch's module and adding a superseding manifest for its run)? Or
      would you rather leave them as they are?"
    user_answer_verbatim: "yes, open the follow-up PR"
    branch_choice: >-
      Asked separately where it should go, the user chose a new branch,
      claude/ecdlp-collision-followup (the session's designated branch carries
      PR #1607).
    second_question_asked_by_top_level_session: >-
