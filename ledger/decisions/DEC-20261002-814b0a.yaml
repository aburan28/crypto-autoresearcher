    - >-
      Standing user authorization of 2026-09-06 covers approval of the
      substitution check. The contract names the remainders, the weight,
      two routes, and a falsification criterion. It does not build a basis.
    - >-
      The products were expanded in this session. That computation is not a
      run. The invertible Boolean image is y0 + y0*y1. The source paper and
      the normal-basis note named in the proposal were not opened and do
      not back this approval.
    - >-
      origin/main was merged into this branch. origin/main was
      7b2f290ab6766c8a62838160351c8660335f88ba. The merge commit is
      696a62c8636880eb1fec39d417c5eea82048f01e. HEAD before the merge was
      aec43203be4b1f31c93a50ceb2c1455bd027d812.
  evidence_refs:
    - ledger/proposals/IDEA-20260922-99294c.yaml
    - ledger/decisions/DEC-20260926-901ea1.yaml
  limitations:
    - Approval authorises the arithmetic. It does not measure a solving degree.
    - The two skipped ideas remain open. Neither is closed by this decision.
  next_actions:
