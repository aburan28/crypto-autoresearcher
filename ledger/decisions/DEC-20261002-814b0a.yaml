coordinator_decision:
  id: DEC-20261002-814b0a
  context: >-
    Design tick. IDEA-20260926-89886c is the first open ECC idea and is not
    designed. IDEA-20260915-3476de is next and is not designed.
    IDEA-20260922-99294c is the following open idea, and only the two-bit
    basis-substitution arithmetic is frozen.
