  next_actions:
    - id: NA-1
      owner: coordinator
      action: >-
        Batch 5 first task, two seconds of numpy: make the RANDDIR arm's Y a
        DETERMINISTIC function of its X instead of an independent draw. The red
        team measures 12.1507. Confirm it on the program's own record.
      why: >-
        It closes the last live reading of the excess. If it separates, outcome
        A is dead alongside outcome B and no form of this observable survives.
    - id: NA-2
      owner: coordinator
      action: >-
        Then MEASURE WHAT THE HEURISTIC ACTUALLY ASSERTS: across-candidate score
        dependence. Nothing in four batches has attempted it. Include the
        FFT-bin candidate family, unmet since batch 3.
      why: >-
        It is the only quantity in this campaign whose value is not determined
        by construction, and it is the one KN-OPEN-016 asks about.
    - id: NA-3
      owner: coordinator
      action: >-
        Supersede KN-TECH-9d21c4 with a revision adding the fifth obligation
        (alternative exhaustiveness), turning obligation 3 into a criterion with
        a named comparator and threshold, and correcting the false novelty claim
        and the c4(8) reference.
    - id: NA-4
      owner: coordinator
      action: >-
        Archive raw vectors, and remove wall-clock truncation from any sampler
        whose output is an archived artifact.

  decided_by: coordinator
