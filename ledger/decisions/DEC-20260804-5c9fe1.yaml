coordinator_decision:
  id: DEC-20260804-5c9fe1
  goal_id: GOAL-MLKEM-004
  batch_id: BATCH-d3a45a
  recorded_by_task: TASK-20260804-d598fb
  authorized_by: DEC-20260803-4d4528
  recorded_at: '2026-08-04'

  decision: reject_scoped
  decision_label: >-
    Reject the row-permutation excess as an observable, in every form this
    campaign has used it. Redirect batch 5 to across-candidate dependence, which
    is what the heuristic asserts and what four batches have not measured.
  decision_vocabulary_note: >-
    `reject_scoped` applies to the OBSERVABLE, not to any batch's arithmetic.
    Every number reproduced. The statistic is sound and answers a question
    nobody asked.

  context: >-
    Batch 4 ran the check that named its own refutation in advance. It returned
    a third outcome neither branch anticipated: the matched valid-lattice family
    separates FOUR TIMES HARDER than the sieve. Both reviews then showed that
    outcome is forced as well, by a closed form computable with no scoring.

  coordinator_validity_check: >-
    Both reviews ran concurrently in independent sessions with nothing
    forwarded. Neither committed its own artifacts -- the batch-3 PD-3
    instruction was withdrawn and the standing no-commit rule restored. Both
    built the family the producer's design excluded, by different routes.

  what_is_rejected:
    - >-
      That the excess measures lattice membership. A family NOT in the lattice
      -- exact norm match to the sieve, random directions, but y a deterministic
      function of x -- separates at 12.1507, harder than any valid dual family
      measured. The producer's own null drew Gx and Gy INDEPENDENTLY
      (surrogate.py:685-688) and so differed from a dual family in two ways at
      once, which is why it read 1.0868.
    - >-
      That the excess measures sieving. One round of pair reduction on a
      non-sieve pool drops it 5.4311 -> 3.2439 at unchanged mean ||x||^2. The
      sieve's low value is a consequence of an operation, reproducible without a
      sieve.
    - >-
      That 1.27 against 5.43 is an unexplained observation worth a batch. It is
      excess = sqrt(1 + rho) for a rho measurable with NO SCORING, predicting
      1.3108/5.6880/5.9487 against measured 1.2937/5.4461/5.4298, and linear in
      N. The validator's independent first-order model predicts all five arms to
      2-10%.
    - >-
      That the norm mismatch was ever a live explanation. VAL_SIEVE_SUMS at
      362.5/258.1 separates at 1.2115 while MATCHED_LONG at 397.5/270.0
      separates at 5.3844 -- matched norms, 4.4x apart.

  what_survives:
    - >-
      Every measurement. The validator reproduced every printed digit of every
      arm with a scorer written from the definition and cross-checked against a
      literal no-formula evaluation to 7.8e-16.
    - >-
      MATCHED_BKZ is a valid dual family of the same lattice and disjoint from
      the sieve, verified directly rather than assumed: 0 violating in 2,032,675
      entries by int64 and exact bigint, empty intersection sign-canonically and
      raw, 72 dropped collisions reproduced.
    - >-
      The producer reporting C_NEITHER rather than choosing a nearest label when
      its frozen rule returned a verdict hostile to both named outcomes. That is
      the behaviour pre-registration exists to produce, and the validator notes
      it is also the strongest available evidence the rule was not written after
      the fact -- the one thing the unarchived v1 cannot attest.
    - >-
      T4 in full, including the correct resolution that
      statistic_reads_the_object must be recorded PER STATISTIC.

  coordinator_error_corrections:
    - id: CE-1
      title: >-
        I asserted a finding was novel when an archived reviewer had already
        reported it, and propagated the false novelty into a knowledge entry.
      raised_by: VAL-20260804-a84239 DEF-4
      what_i_wrote: >-
        Snapshot commit e8cc366e, my batch-4 card, and my report to the user all
        state that the iid shortfall had never been reported in three batches.
        The producer repeated it and KN-TECH-9d21c4 now contains it.
      why_it_is_wrong: >-
        RT-20260803-d2e23e section 3 reported 7.1x and 9.4x. It is in the
        archive I was citing.
      corrected_statement: >-
        The iid shortfall was first reported by RT-20260803-d2e23e in batch 3.
        Batch 4 quantified it with a closed form and identified its cause; it
        did not discover it.
      note: >-
        This is the second time in two batches I have written a decision or card
        premised on something an archived review already settled -- see
        DEC-20260803-81b778 CE and RT-20260804-37a8f2 OBJ-4, where I froze a
        two-outcome dichotomy that the batch-3 red team had refuted IN THE SAME
        FILE (its E3 measured 5.4349). The pattern is that I cite an archived
        review for one finding while not carrying its other findings forward.
      corrective_rule_adopted: >-
        Before writing a card or decision that calls anything new, unreported or
        undecided, grep the archived reviews of the two preceding batches for
        the quantity by NUMBER, not by name.

    - id: CE-2
      title: >-
        My snapshot commit message drew six conclusions after saying it drew
        none, and repeated a defect already named against me.
      raised_by: RT-20260804-37a8f2 OBJ-7
      what_i_wrote: >-
        Commit e8cc366e states "I draw no conclusion" and then contains six
        present-indicative conclusions, plus the 1.0-versus-c4(8) reference
        error.
      why_it_is_wrong: >-
        BATCH-c45baf OBJ-9 named this exact class one batch ago and I did not
        apply the fix. A repeat of an identified defect is worse than a new one.
      what_the_reviewers_did_not_find: >-
        Both searched for a security claim and found NONE, in this message or
        anywhere in the package.
      corrective_rule_adopted: >-
        Snapshot commit messages contain no sentence in the present indicative
        about what the numbers mean. Either the producer's own words in quotes,
        or nothing.

  process_defect_recorded:
    id: PD-4
    title: The harness requires review artifacts to sit uncommitted across a dispatch window.
    what_happened: >-
      The dispatcher requires an archive commit to CHANGE its declared source
      artifacts, so a review report must be uncommitted when the Coordinator
      archives it. That window is what destroyed both BATCH-c45baf reviews when
      the container was replaced. The batch-3 attempt to fix it by having
      reviewers commit their own files was refused three times and correctly:
      a reviewer committing its own work is a commit, not an archival.
    status: >-
      NOT FIXED, and deliberately not worked around a second time. The fix is a
      change to tools/research_dispatch.py -- allow an archive task to verify an
      already-committed source artifact BY HASH instead of requiring it in the
      diff -- which preserves Coordinator-owned archival, exact path sets and
      verifiable provenance while collapsing the exposure to seconds. It belongs
      in its own reviewed PR with tools/test_research_dispatch*.py extended, not
      in a Coordinator improvisation mid-campaign.

  explicit_non_claims:
    - No ML-KEM break. No attack implemented, run, or claimed. No speedup.
    - No security proof and no security claim in either direction.
    - No FIPS 203 parameter set affected or cleared. Toy scale, rule 4 in full.
    - >-
      The independence heuristic is NEITHER validated NOR refuted. Four batches
      in, nothing this campaign has measured tests it, and both batch-4
      reviewers say so explicitly.
    - No exponent moved, no cost reduced, no attack improved.

  official_status_changes:
    - record: EV-MLKEM-ba6c25
      from: null
      to: recorded
  official_status_changes_note: >-
    GOAL-MLKEM-004 remains `active` at batch 4 of 6. No other record changes
    status.

  knowledge_promotion:
    promote: true
    promoted:
      - KN-TECH-9d21c4
    rationale: >-
      Promoted as committed to in DEC-20260803-81b778, after three deferrals,
      and BOTH reviewers judged it a technique rather than a rationalisation.
      The red team confirms modes 1 and 2 have genuine prospective catches and
      supplied the first empirical confirmation of its sqrt(1 + 2Nb^2/k)
      algebra; the validator judges moves 1 and 3 applicable by a stranger.
    corrections_owed_and_recorded: >-
      THE ENTRY IS PROMOTED WITH ITS DEFECTS ON THE RECORD, not silently. Owed,
      per both reviews: (a) obligation 3, the sensitivity demonstration, is
      ADVICE NOT A CRITERION -- no threshold, no named comparator -- which is
      exactly how this batch's own DEF-7 happened, scoring sensitivity against
      the most separating arm (about 50x) where against the sieve it is 3.1x;
      (b) a FIFTH obligation is owed, alternative exhaustiveness, because
      batch 4 failed while executing step 4 impeccably -- it never asked whether
      its two named outcomes exhausted the space, and they did not; (c) the
      entry repeats CE-1's false novelty claim and INT-2's 1.0-versus-c4(8)
      reference error; (d) `confidence: verified_by_execution` and
      `source_refs` citing its own producing task are unearned. Batch 5's first
      knowledge action is a superseding revision fixing all four.

  ranking_rationale: >-
    Batch 5 CHANGES the observable rather than continuing or closing. Both
    reviewers converge. Closing would be premature under inventor-protocol
    section 4 -- the obstruction named is for ONE comparison, and the question
    the campaign exists to answer has never been tested. Continuing on the
    excess would replicate a construction-determined ordering, which is the
    exact failure the campaign's own new technique entry exists to prevent.

  limitations:
    - One instance. Every batch-4 arm is a single draw.
    - >-
      The build is not bit-reproducible from its recorded command -- `_sample()`
      truncates on wall clock. It IS reproducible from the transcript's realised
      counts, which the validator did bit-for-bit.
    - Raw vectors are not archived; both reviewers regenerated to check.
    - >-
      Pre-registration ordering is unable_to_check: surrogate.py v1 is
      unarchived and its hash and timestamp unattested.
    - >-
      Every participant across batches 1-4 resolves to claude-opus-5.
      Independence is procedural, not model-level.

  evidence_refs:
    - EV-MLKEM-ba6c25

  references_unchanged_by_this_decision:
    - EV-MLKEM-b43de0
    - EV-MLKEM-50901f
    - EV-MLKEM-da9e3b
    - EV-MLKEM-015
    - KN-OPEN-016
    - KN-TECH-14efa5

  target_ids:
