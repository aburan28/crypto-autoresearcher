        refused as fabrication under AGENTS.md rule 9.
        `invalid` rather than `failed` because the act occurred and its product
        is durable and demonstrably correct in substance; what is invalid is the
        RECEIPT, not the freeze. `invalid` rather than `cancelled` because the
        task was not withdrawn: it ran.
