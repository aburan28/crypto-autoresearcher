  resolved_snapshot_commit_discrepancy:
    status: RESOLVED. No supersession warranted. EV-MLDSA-faf2ec is NOT edited.
    the_discrepancy: >-
      EV-MLDSA-faf2ec records `snapshot_commit:
      8242344ce106e324e3f42e5b163061a251b7e9f9`, which is not the BATCH-001
      snapshot commit f44ffbad97856fc9170f89ce8684639427f1e1be named throughout
      this decision. The first pass of this reconciliation recorded that as an
      unreconciled item and refused to guess at it. The dispatching session then
      supplied three further verified git facts (F8-F10, from `git cat-file`,
      `git show`, `git branch -a --contains`, and per-path sha256), which resolve
      it. As with F1-F7, these are the dispatching session's direct observations,
      copied verbatim; this session still ran no commands.
    F8_object_exists_but_is_unreachable: >-
      Commit 8242344ce106e324e3f42e5b163061a251b7e9f9 EXISTS in this
      repository's object database (`git cat-file -t` returns "commit") but is
      UNREACHABLE from any ref: `git branch -a --contains` returns empty and it
      appears in no `git log --all`. It is a dangling object.
    F9_same_snapshot_act_different_parent: >-
      It is the SAME SNAPSHOT ACT as f44ffbad9, made on the working branch
      before integration. 8242344ce has parent
      8aca58a23644b2be4ebdd7a2d357957da26ae4fc; f44ffbad9 has parent
      1245602e1040f3dfcfea556fc52d0db2a0becb6a. Identical author
      ("Dispatch Test"), identical author date 2026-08-05 17:38:44 -0700,
      identical commit message, identical 6-file change set. Only the parent
      differs.
    F10_bytes_identical: >-
      All five declared producer artifacts are BYTE-IDENTICAL at 8242344ce and
      at f44ffbad9 (per-path sha256 compared pairwise; all five reported
      IDENTICAL), and they match the five sha256 values already recorded above
      under observed_commit_not_a_receipt.
    conclusion: >-
      The recorded sha is NOT a transcription error and is NOT evidence of a
      second, divergent snapshot. EV-MLDSA-faf2ec recorded the BRANCH-SIDE sha,
      which became unreachable when the branch was integrated. That is precisely
      the failure mode CLAUDE.md's Concurrency section documents — "every archive
      receipt records a branch commit_sha, and a squash merge replaces the branch
      with one new commit, so every recorded sha becomes unreachable" — and
      precisely why research_dispatch.py binds to CONTENT first, treating commit
      reachability as advisory while a content mismatch stays fatal. Under that
      content-first rule this archive is CONTENT-VERIFIED: the recorded sha is
      unreachable, the bytes are identical, so the binding holds on content.
      NO SUPERSEDING RECORD FOR EV-MLDSA-faf2ec IS WARRANTED, and the record is
      left unedited (as it must be: it is immutable).
    how_far_this_session_goes: >-
      Adopted as stated, without narrowing. Two boundaries are still worth
      naming, and neither weakens the conclusion. First, "same snapshot act on a
      pre-integration branch" is an inference from identical author, author date,
      message, change set, and content with a differing parent; it is the only
      reading those five agreements support, but it is a reading of observations
      rather than an observation. Second, F8-F10 describe THIS repository's
      object database, in which a dangling object can be garbage-collected at any
      time — which is the whole reason the content binding, not the sha, is what
      carries the archive.
    what_this_does_not_establish: >-
      Nothing about the CONTENT of the BATCH-001 literature package beyond what
      the two independent reviews already established, and nothing about the
      separate, unrelated d47e12/c60b84 archive-gate failures recorded above.
      Those remain permanently unsatisfiable for their own reasons (a receipt
      that was never written, and record ids that were never minted); this
      resolution does not repair them and does not make either task `completed`.

