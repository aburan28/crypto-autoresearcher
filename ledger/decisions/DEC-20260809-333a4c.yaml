    - >-
      DURABLE LESSON, replacing the follow-up this decision's first pass asked
      for (now answered by F8-F10): AN ARCHIVE RECEIPT THAT RECORDS ONLY A
      BRANCH-SIDE SHA BECOMES UNVERIFIABLE-BY-COMMIT ONCE THE BRANCH IS
      INTEGRATED. EV-MLDSA-faf2ec's snapshot_commit 8242344ce is now a dangling
      object reachable from no ref, and the only reason its archive still
      verifies is that the CONTENT is byte-identical. Every receipt must
      therefore carry per-path sha256, which is what actually saved this one, and
      a reader who finds an unreachable recorded sha should check content before
      concluding anything is wrong. Note the second-order cost this batch paid:
      TASK-20260805-d47e12 never wrote its snapshot-receipt.json at all, so the
      hashes that would have made its archive content-verifiable had to be
      recomputed four days later by a separate session and recorded in a decision
      record instead of a receipt.
