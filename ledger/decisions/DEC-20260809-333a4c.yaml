    corroboration_of_the_corpus_check: >-
      F11 independently corroborates this decision's knowledge_promotion finding.
      The same commit that carries the last decision also carries
      knowledge/findings/KN-FIND-720727.md, so DEC-20260805-64abe7's scheduled
