  rationale:
    - >-
      A queue that says `queued` for work that was committed on 2026-08-05 is
      not merely untidy: it is a coordination record that contradicts the commit
      history, and the next dispatcher to read it would either re-run committed
      work or treat a completed review chain as unstarted. TASK-20260807-dcfaee
      fixed one field and named the rest; this decision finishes that job with
      the git facts it lacked.
    - >-
      `completed` is unavailable for the two archive tasks as a matter of
      mechanism, not judgement: the dispatcher requires a completed archive's
      declared path set to equal its commit's changed path set, and both commits
      are immutable and diverge from their declarations. The only way to make
      them `completed` would be to write receipts now for commits made four days
      ago by other sessions, which AGENTS.md rule 9 forbids.
    - >-
      The two review tasks are `completed` because they genuinely delivered:
      downgrading a discharged independent review because a later reconciliation
      found a filename mismatch would misstate the batch's review integrity in
      the opposite direction, and would be its own form of dishonesty.
    - >-
      The 9f2d71 path mismatch is recorded rather than repaired. Editing
      artifact_paths to match what was produced converts a pre-declared contract
      into a post-hoc description and removes the only mechanism by which a
      declared-versus-delivered gap can ever be detected again.
    - >-
      The goal head pointed at BATCH-001 while three committed decisions had
      moved the goal through BATCH-66b482 and BATCH-214d98 and left it deferred.
      A stale head is how a campaign silently re-opens closed work; the head now
      states the deferral the last committed decision actually recorded.
    - >-
      Every superseded field is preserved. The prior next_action is retained in
      next_action_superseded, the queue's declarations (including the two
      unminted ids) are left unedited, and no ledger or knowledge record is
      modified. Corrections supersede; they never overwrite (AGENTS.md rule 4).

  evidence_refs:
    - EV-MLDSA-faf2ec
  evidence_refs_note: >-
    EV-MLDSA-faf2ec is cited for record identity and provenance only — it is the
    record the retired identifier EV-MLDSA-7e91a4 was supposed to be. This
    decision draws no inference from its contents and does not revisit its
    strength (preliminary), its claim_tier (literature_survey), or any
    conclusion resting on it.

  limitations:
    - >-
      This session ran NO experiment, re-ran NO run, and re-reviewed NO artifact.
      Nothing here is empirical evidence of any kind.
    - >-
      This session has no shell and no git access. Every sha, hash, date, and
      commit message above was computed by the dispatching session — F1-F7 at
      task start, then F8-F10 and F11 supplied mid-task in response to this
      record's own first pass — and copied verbatim; none was verified
      independently here, and none was reconstructed. An independent re-audit
      with shell access remains available and is the correct way to check this
      record.
    - >-
      NO ATTESTATION WAS OBTAINED and none is recorded. Nothing here is
      admissible toward goal closure for GOAL-MLDSA-001 or any other goal.
    - >-
      This decision asserts NOTHING about the security of ML-DSA, FIPS 204, MLWE,
      MSIS, or SelfTargetMSIS in either direction, and nothing about whether any
      published fault attack works. No hypothesis status changes, no claim tier
      moves, and RQ-MLDSA-001's toy/until-certified ceiling stands untouched.
    - >-
      The terminal states assigned here are coordination bookkeeping. They are
      not verdicts on the scientific quality of the work those tasks produced,
      and in particular `invalid` on the two archive tasks says nothing adverse
      about the BATCH-001 literature package or its two independent reviews.
    - >-
      Only BATCH-001's queue was reconciled, because it is the only committed
      queue file this goal has. The task-level records of BATCH-66b482 and
      BATCH-214d98 were not audited against their commits.

