  decision: supersede
  decision_label: >-
    Coordination-layer reconciliation for GOAL-MLDSA-001. Supersedes the stale
    BATCH-001 dispatch-queue task states and the stale goal-head fields;
    retires two declared-but-never-minted identifiers; records the BATCH-001
    snapshot and ledger archive-gate failures as permanently unsatisfiable
    BOOKKEEPING defects. No research conclusion, hypothesis status, claim tier,
    evidence strength, or knowledge entry changes.

  read_this_first: >-
    THE BATCH-001 ARCHIVE-GATE FAILURES RECORDED BELOW ARE BOOKKEEPING FAILURES.
    THEY ARE NOT A FINDING THAT THE REVIEWED CONTENT WAS UNFROZEN, MUTATED, OR
    CONTAMINATED, AND THEY DO NOT TAINT THE BATCH-001 LITERATURE PACKAGE OR THE
    TWO INDEPENDENT REVIEWS THAT READ IT. The opposite is demonstrated: the five
    declared producer artifacts are byte-identical at the snapshot commit
    f44ffbad9 and at HEAD (five sha256 values recorded under
    observed_commit_not_a_receipt below), and the review commit aa1567c2f has
    f44ffbad9 as its direct parent, so the reviewers demonstrably read the frozen
    object. What is missing is the RECEIPT ARTIFACT that would let the dispatcher
    verify that mechanically. The freeze worked materially; only its paperwork
    failed. Anyone reading the queue's terminal `invalid` states must read them
    as "this archive receipt can never be verified as declared", never as
    "this evidence is suspect".

  context: >-
    TASK-20260807-dcfaee reconciled exactly one BATCH-001 dispatch-queue field
    (TASK-20260805-a1c3f9 queued -> completed, commit cccf3e26e) and explicitly
    recommended two follow-ons it could not perform for lack of git access:
    reconciling the four remaining queue entries against the actual commit
    history, and a dedicated goal-head reconciliation before GOAL-MLDSA-001's
    next batch is opened. This decision performs both. This Coordinator session
    also has no shell: every commit sha, content hash, date, and commit message
    used here was computed and supplied by the dispatching session, is recorded
    verbatim, and nothing was reconstructed, estimated, or inferred. Where a
    needed git fact was not supplied, the item is left unreconciled and named
    under `unreconciled` rather than filled.

  queue_dispositions:
    TASK-20260805-d47e12:
      role: coordinator
      kind: snapshot archive of TASK-20260805-a1c3f9
      assigned_state: invalid
      justification: >-
        The commit act happened and materially froze the package, but the task's
        completion gate is PERMANENTLY UNSATISFIABLE, so `completed` is not
        available and would require asserting a receipt that does not exist. The
        dispatcher requires a completed archive's path_sha256 to cover exactly
