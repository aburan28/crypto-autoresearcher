  context: >-
    /design-experiment, one contract, for IDEA-20261005-474802. No
    hypothesis and no experiment on origin/main cites it. The branch
    design/drinf-474802-torsion was created from origin/main at
    579e6944aa25fab8af7dcead777c9d3078e2e73d and git merge origin/main
    reported already up to date.

    The contract counts distinct geometric roots of x + x^3 + x^9 and of
    x + x^3 over F_3, after those polynomials are expanded from the module
    laws. The pre-registered prediction is size 9 versus size 3. A
    different agreed size, while the degree-1 coefficient is 1 and the
    derivative is the constant 1, is a negative. An inseparable expansion
    is withdrawn. The F_9 root count is recorded and is not the metric.
    No characteristic polynomial is computed. No ECDLP exponent is claimed.

    This session opened knowledge/literature/KN-LIT-1515.md and
    knowledge/literature/KN-LIT-174.md. Both are title-level. The PDF
    paths named in KN-LIT-1515 are absent from this checkout. Drinfeld
    1974 was not opened and is not evidence for this approval.

    Protocol completeness: inputs, controls, independent variables, primary
    and secondary metrics, seeds, replication, budget, stopping rules,
    invalidation rules, success criterion, falsification criterion, and
    required artifacts are all non-null. Success is the pair of sizes 9
    and 3 and fails when an agreed separable count differs. No field
    required for approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading are fixed before any run.
    - The rank-1 control, the derivative check, and the agreement of two root counts give the size reading a way to come back withdrawn or invalid instead of a collapsed F_9 count.
    - A different agreed size is a negative, so success can fail.
    - No root was counted while writing this decision.

  evidence_refs: []
  limitations:
