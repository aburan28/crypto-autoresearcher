    independently reviewed by Validator TASK-20260804-cf1ae3
    (accept_with_qualifications) and Red Team TASK-20260804-83d874
    (pass_with_constraints). An archive attempt exists for that work
    (DEC-20260804-e19a65, EV-WESO-b6ceff, KN-FIND-4e7a92, KN-FIND-d1c853, all
    dated 2026-08-04) and is defective on seven independent grounds recorded by
