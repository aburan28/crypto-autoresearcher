  rationale:
    - >-
      A schema-invalid decision that narrates a status change its target record
      never received is not an official disposition of anything, however durable
      the commit that carries it. Correcting it by editing would violate AGENTS.md
      core rule 4; correcting it by supersession is the mechanism this programme
      already uses for every other correction, and it leaves the defective record
      readable beside its replacement.
    - >-
      The measurement work is left alone because it is sound on independent review
      and because re-running it would spend the goal's remaining capacity on
      already-decided questions - the duplicated-result failure mode
      agents/coordinator.md's decision checklist question 1 exists to prevent. The
      defect is in the archival layer, and only the archival layer is repaired.
    - >-
      The hypothesis stays `analyzed` because the four promotion gates are facts
      about committed artifacts, not preferences, and none of them moved. Retiring a
      label at one ell range is a narrowing of a qualification, not evidence for an
      asymptotic claim.
    - >-
      The goal is paused rather than closed at budget because the honest cause of
      stopping is a method ceiling plus an unmet infrastructure capability, not an
      exhausted budget, and because exactly one named, frozen, ready protocol
      remains. Naming a false cause would be as much a misstatement as claiming a
      false result.
    - >-
      The KN-FIND question is answered rather than deferred, because two entries
      currently sit in the corpus attributing content to a run that does not contain
      it. Leaving that unresolved for a fourth batch would let a caveated,
      unsourced formula be quoted as this programme's promoted knowledge.
    - >-
      Item (4) is carried forward as the single resume condition because an
      infrastructure failure is not a result. AGENTS.md core rule 5 forbids reading
      it as evidence against Heuristic 1, and nothing in this decision reads it as
      evidence for the convenience of closing the goal either.

