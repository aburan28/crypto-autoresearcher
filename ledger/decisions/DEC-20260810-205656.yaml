coordinator_decision:
  id: DEC-20260810-205656
  goal_id: GOAL-P13-001
  batch_id: BATCH-2abf22
  recorded_at: '2026-08-10'
  decided_at: '2026-08-10'
  decided_by: coordinator

  decision: supersede

  decision_note: >-
    `supersede` is the operative value and it is drawn from the nine-value
    vocabulary of templates/research-records.md (approve | revise | replicate |
    expand | support | weaken | reject_scoped | pause | supersede). The primary
    act of this decision is to replace a defective, schema-invalid, never-applied
    prior archive (DEC-20260804-e19a65 and EV-WESO-b6ceff) with a conformant one,
    WITHOUT editing either superseded record, exactly as AGENTS.md core rule 4
    requires.
    WHY NOT `support`: H-WESO-001 carries an asymptotic-complexity claim and its
    four promotion gates are unsatisfied by committed artifacts; gate 4 is
    unsatisfiable in this harness because review-breakthrough is non-degradable
    (DEC-20260802-8227b9 and DEC-20260802-48c72c promotion_gate_check, both still
    current). Nothing in BATCH-403f13 changes that.
    WHY NOT `revise`: the content revision is real but secondary. The record being
    replaced is not merely out of date, it is out of schema (defect D-2), narrates
    a transition that was never applied to its target record (D-3), and was
    produced by a task with no traceable authorization (D-6). A `revise` on top of
    it would leave a schema-invalid decision standing as the official disposition.
    WHY NOT `weaken` or `reject_scoped`: this decision makes no adverse
    mathematical call on any hypothesis. It withdraws an OVERSTATEMENT that was
    never applied, which is a records-integrity act rather than a refutation. No
    refutation artifact is therefore required or claimed, and none is manufactured
    (agents/coordinator.md responsibility 12; docs/claims-and-verification.md,
    "Refutation artifacts").
    WHY NOT `pause` AS THE FIELD VALUE, although this decision does move
    GOAL-P13-001 to `paused`: the terminal status is the EXECUTION of a
    pre-commitment already made and reviewed in DEC-20260802-48c72c
    (completion_criteria_assessment, pause_condition_watch), restated in
    ledger/goals/GOAL-P13-001.yaml closure_requirements and in BATCH-403f13's own
    dispatch_queue.json terminal_status_obligation. It is not a fresh research
    judgement competing with the supersession. Had the schema permitted two
    values, the second would be `pause`; the goal transition is recorded in full
    under goal_terminal_status below so nothing is hidden by the choice of one
    field value.

  supersedes:
    - id: DEC-20260804-e19a65
      kind: coordinator_decision
      path: ledger/decisions/DEC-20260804-e19a65.yaml
      not_edited: true
    - id: EV-WESO-b6ceff
      kind: evidence
      path: ledger/evidence/EV-WESO-b6ceff.yaml
      not_edited: true
      superseded_by_evidence: EV-WESO-d1a9d8
  supersession_mechanics: >-
    The two superseded records are IMMUTABLE, are outside this task's write scope,
    and are left byte-unmodified. No forward pointer (`superseded_by`) is written
    into them: the corpus-wide policy for forward pointers is unsettled
    (GOAL-MCE-001 DEC-20260808-a67816 D-9 and DEC-20260809-cb25a0 D-3), so the
    reference direction here is new-record-cites-old only. Their schema-supersession
    v2 copies under ledger/corrections/schema-supersessions/20260808/ were read and
    do NOT repair any defect below: the v2 decision still carries
    `decision: support_scoped`, the out-of-vocabulary value. That sweep was a
    mechanical corpus-wide schema pass and must not be cited as a repair of this
    archive.

  context: >-
    GOAL-P13-001 BATCH-403f13 executed, on 2026-08-05, the substance of the
    next_action DEC-20260802-48c72c NA-1 set: (1) NC2d-PROPER under frozen
    contract EXP-P13-NC2d, (2) NC2b-SLOPE under frozen contract EXP-P13-NC2b, and
