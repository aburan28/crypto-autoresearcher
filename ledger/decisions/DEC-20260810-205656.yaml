      git command.
    - >-
      Everything dispositioned here is scoped to ell in {47, 101, 151, 211} at
      p in {2^20, 2^30, 2^40} for NC2d, and to a zero-compute synthetic-slope test
      on 47 committed numbers for NC2b, in one pure-Python implementation pair.
      AGENTS.md core rule 7 applies: none of it is cryptographic-scale validation,
      and no result transfers to NIST parameter sets except as a model substitution
      under the eight mandatory attachments.
    - >-
      Heuristic 1 remains entirely unvalidated, so every conditional statement
      downstream of the frozen paper's theorem carries that condition undischarged.
      The pairing obligation of agents/coordinator.md - a conditional result must be
      paired with a heuristic-validation experiment in the same or the following
