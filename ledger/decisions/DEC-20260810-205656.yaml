      THE GIT FACTS IN THIS BLOCK ARE NOT THIS COORDINATOR'S OWN INSPECTION. The
      coordinator role has no run_commands under this runtime, so the durability
      and reachability check that AGENTS.md rule 7 and the content-first
      archive-receipt rule require was discharged by the orchestrating session and
      supplied verbatim in ledger/handoffs/TASK-20260810-5481f4.yaml under
      `durability_verification` and `defects_reverified`. They are cited here as
      that handoff's findings, at the commit it names, and are not restated as
      first-hand observation.
    verified_at_commit: 3cc95d80ddec1c2fb401ef817e76045c6e1ace78
    findings_as_reported:
      - "b7b3240b4266b85af1e0810831a66aa6e3300535 (executor snapshot for items (1)-(3)) reachable from origin/main"
      - "91b5428b1 (TASK-20260804-7cb2d2 contract-freeze snapshot) reachable from origin/main"
      - "49b4814c0 (both independent review reports, and the item-(4) infra-failure record) reachable from origin/main"
      - "133f7d47b93b96ce0a3ffc3f4a38b92ae794fd68 (the single commit introducing all four defective archive records) reachable from origin/main"
    consequence: >-
      The measurement work and its reviews ARE durable, so the branch of
      BATCH-8e1671's recommendation that applies is "author a proper superseding
      archive", not "re-run the measurement". Redispatching NC2d-PROPER, NC2b-SLOPE
      or the bibliographic subtask would duplicate already-reviewed science and is
      not dispatched (BATCH-2abf22 dispatch_queue.json not_dispatched[0]).
      DURABILITY SAYS NOTHING ABOUT CORRECTNESS: the seven defects are content
      defects and are unaffected by the records being reachable.

