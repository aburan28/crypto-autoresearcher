  official_disposition_of_batch_403f13:
    validity_pre_checks_performed_before_any_interpretation:
      expected_run_count: >-
        Two runs authorized and two executed and terminal (RUN-P13-NC2d-a exit code
        0 in 39.142 s of an 1800 s budget; RUN-P13-NC2b-a exit code 0 in 0.010 s),
        with the third authorized run (EXP-P13-NC36) not executed and recorded as
        failed_infrastructure rather than as a result.
      manifest_schema: >-
        RUN-P13-NC2d-a manifest.yaml carries code/commit, dirty-tree state and
        reason, environment, inputs with seeds, timing, result, validity,
        protocol_deviations (D-1 re-fetch with SHA-256 re-verification; D-2 p3
        medians from the committed 8-j run), non_claims_restated, scale_relevance
        and inference provenance. The declared dirty tree is disclosed and scoped
        ("task write scope is untracked at task launch; no tracked file was
        modified").
      seed_integrity: >-
        Four deterministic walk seeds (20260802001-4) carried from EXP-PEC-49c773;
        Cantor-Zassenhaus streams seeded on (ell, j_index); C-BASE-1 stream seeded
        on the prime bound. Phi_ell inputs re-fetched and SHA-256-verified against
        the hashes committed in RUN-PEC-49c773-a, so the polynomials are
        bit-identical to the prior run's.
      raw_summary_agreement: >-
        The Validator independently recomputed the pooled alpha, gap, jackknife,
        no-trend and the ten NC2b checks and reproduced them (CHK-2, CHK-3). ONE
        LABELLING DISAGREEMENT IS ON THE RECORD AND IS NOT ABSORBED: the jackknife
        interval is [1.1259982, 1.1409560] raw, rendered [1.1260, 1.1409] in the
        run manifest and [1.1260, 1.1410] in nc2d_results.json. No verdict moves on
        it; it is recorded because the archive, not prose, is the authority.
      control_comparability: >-
        The null arm is the same instrument at the same primes and the same ell
        grid, differing only in the object measured; C-PHI-VERIFY, C-BASE-PRIME and
        C-BASE-2 all pass in the manifest. For NC2b the "control" is a synthetic
        object with a KNOWN non-zero exponent built from the committed null series,
        which is precisely the property the flat null lacks.
      conclusion: >-
        The run set is VALID and ADMISSIBLE and is not returned to the Executor. No
        defect found by either reviewer is an execution defect. This restates the
        already-reviewed position; it is not a new review.
    what_is_established_within_scope: >-
      At ell in {47, 101, 151, 211} and p in {1048571, 1073741783, 1099511627563},
      under the frozen EXP-P13-NC2d estimator (OLS on log2(log2 p), ell fixed
      effects), pooled alpha_primary = 1.1321 and alpha_null = 1.0715, so the gap
      is 0.0606 against a pre-registered 0.15 and FC-4 DID NOT FIRE; the
      leave-one-ell-out range is contained in [0.85, 1.15] so FC-2 did not fire;
      and the no-trend check gives b = 0.0206 against a 0.10 threshold. The
      MECHANISM-INCONSISTENT designation on assumption L5 is therefore retired AT
      THIS ell RANGE AND AT THIS PRIME SCALE ONLY, by measurement, which
      DEC-20260802-48c72c adjudication E named as the only legitimate route.
      Separately, NC2b-SLOPE passes all ten W-MID checks at a worst recovery error
      of 0.0926 bits against a 0.75-bit tolerance, validating the INSTRUMENT's
      sensitivity to a known non-zero exponent. Every number here is restated from
      committed artifacts and attributed in EV-WESO-d1a9d8.
    what_is_expressly_NOT_established:
      - >-
        The prior FC-4 firing at ell in {3, 5, 7, 11, 13} in EXP-PEC-49c773
        (alpha_primary 1.1597, alpha_null 0.9935, gap 0.1662) STANDS AS RECORD and
        is not lifted. A post-hoc restriction of the ell-grid cannot lift a
        pre-registered falsifier (DEC-20260802-48c72c adjudication E, adopted here
        unchanged). Two ell ranges, two facts.
      - >-
        alpha = 1.1321 is 13 per cent above the theoretical L5 value of 1.0 and
        that excess is propagated into NO c-table row and NO margin row (Red Team
        RT-OBJ-B). Nothing here updates a c value, a bracket, or a margin.
      - >-
        The gap-versus-ell trend beyond ell = 211 is unmonitored (RT-OBJ-A): the
        per-ell gaps are 0.0270, 0.0381, 0.0894, 0.0877, so the two largest are
        about 59 per cent of the FC-4 threshold, and no control was pre-registered
        or executed for gap stability at larger ell.
      - >-
        NC2b validates instrument sensitivity, not assumption L1. The run's own
        non_claim says so and both reviewers endorse it; SP-12 and MA-7 of
        DEC-20260802-48c72c bind unchanged.
      - >-
        The baseline constant k is still unquantified: all three bibliographic
        sources were retrieved and none states it in its abstract, which the
        Validator records as the expected outcome for that scope.
      - >-
        Heuristic 1's tail at the operating point remains COMPLETELY UNTESTED.
      - >-
        Nothing in this batch is a cryptographic-scale measurement. AGENTS.md core
        rule 7 applies in full: the largest field is an 80-bit F_{p^2} at
        p = 1099511627563.
    reviews_relied_upon:
      validator: "TASK-20260804-cf1ae3, accept_with_qualifications, admissible: true, qualifications Q-1 (jackknife mislabelled '95% CI' in the handoff summary; the frozen spec defines it as the min/max of four leave-one-out estimates) and Q-2 (TASK-20260804-6519fa artifacts untracked and not in snapshot b7b3240b4)"
      red_team: "TASK-20260804-83d874, pass_with_constraints, objections RT-OBJ-A (gap-vs-ell trend unmonitored), RT-OBJ-B (alpha excess unpropagated), RT-OBJ-C (three primes per ell, one residual df; the simplified jackknife understates uncertainty), RT-OBJ-D (p3 cross-session leverage asymmetry), RT-OBJ-E (no pooled-gap CI), RT-OBJ-F (Heuristic 1 completely unvalidated)"
      review_side_analysis_is_not_run_evidence: >-
        SP-5 as extended by DEC-20260802-48c72c binds these reviews too. The Red
        Team's own supplementary estimates - notably RT-OBJ-C's remark that a
        proper 95 per cent CI with one residual degree of freedom would "likely
        span [0.95, 1.31] per individual ell" - are cited as REVIEW FINDINGS under
        their report ID and never as run evidence. They open and close no gate.
    no_further_independent_review_was_commissioned_for_this_reconciliation: >-
      This decision makes no new claim: it corrects a schema-invalid decision value,
      writes a status_history entry that was claimed but never applied (expected
      and actual transition: none), advances a stale goal head, and records a
      terminal status the goal's own closure_requirements pre-commit to. The
      measurement work it dispositions was already independently reviewed at
      BATCH-403f13. Under orchestration/model-policies.yaml routing_rules this is
      not a claimed breakthrough, not a proposed closure to `completed` (which is
      barred here), and not a contradiction of prior validated evidence, so
      review-breakthrough is not triggered - and it could not be claimed in any
      case, being non-degradable and unavailable in this harness. If a later
      reviewer judges the disposition itself needs independent review, that review
      supersedes this record on the merits rather than being blocked by it.

  status_transitions:
    - target: H-WESO-001
      from: analyzed
      to: analyzed
      transition: none
      rationale: >-
        No status change is supported and none is made. The claimed advance in
        DEC-20260804-e19a65 is withdrawn as unsupported (defect D-3). H-WESO-001
        carries an asymptotic-complexity claim, so agents/coordinator.md's four
        promotion gates bind any move toward `supported`: gate 1 (archived proof
        decomposition into single-responsibility lemmas) is unsatisfied by any
        committed artifact; gate 2 requires every conditional dependence to carry
        archived validation evidence or a scheduled validation experiment, and
        Heuristic 1 - the heuristic the theorem is conditional on - has now had
        FOUR batches without a successful validation run; gate 3's honest o(1)
        accounting for the paper's own asymptotic has not been produced; and gate 4
        requires an independent review-breakthrough pass at `max`, which is
        non-degradable and unavailable in this harness. Retiring
        MECHANISM-INCONSISTENT on L5 at the tested range newly satisfies none of
        them.
    - target: EXP-P13-NC2d
      from: approved
      to: approved
      transition: none
      judgement_without_a_field_write: >-
        THE EXPERIMENT LIFECYCLE JUDGEMENT IS `analyzed`; THE RECORD'S `status:`
        FIELD IS DELIBERATELY NOT MOVED, AND THIS DECISION DOES NOT CLAIM
        OTHERWISE. The contract was executed literally, independently reviewed, and
        is analyzed in substance. But experiments/EXP-P13-NC2d/specification.yaml is
        a FROZEN contract, is outside this task's write scope, and under its own
        freeze rule is not edited after its snapshot - so its committed field still
        reads `status: approved` and will continue to. Narrating a transition into a
        file this decision cannot write is exactly defect D-3, and repeating it here
        while correcting it there would be incoherent. The discrepancy is therefore
        NAMED rather than asserted away.
      pre_existing_instance_of_the_same_pattern: >-
        This is not new: DEC-20260802-48c72c recorded EXP-PEC-49c773 as moving
        approved -> analyzed, and that specification.yaml likewise still reads
        `status: approved`. Recorded here as an observation about the repository's
        convention, NOT repaired - repairing it would mean editing a frozen contract,
        which is worse than the inconsistency.
      substantive_note: >-
        The contract's one recorded weakness - three primes per ell, hence one
        residual degree of freedom, and a leave-one-ell-out procedure that averages
        per-ell alphas rather than refitting the pooled OLS (RT-OBJ-C) - is a defect
        of the contract this programme froze, not of the execution. Its remedy under
        the contract's own freeze rule is a superseding contract, never an edit.
    - target: EXP-P13-NC2b
      from: approved
      to: approved
      transition: none
      judgement_without_a_field_write: >-
