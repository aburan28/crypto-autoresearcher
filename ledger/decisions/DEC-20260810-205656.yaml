      It is recorded as the goal's resume condition instead, which is a promise to
      pay rather than payment.
    - >-
      Defect D-6's core instance is unrepairable: no handoff record can now be
      written for TASK-20260804-eacb99 without fabricating an authorization. The
      provenance gap is permanent and is recorded rather than closed.
    - >-
      Inference ran under the requested policy without fallback, but the
      reasoning-effort tier cannot be set or verified per task under this runtime
      and no probe can verify the resolved model identifier from this role. Both are
      recorded as UNVERIFIED rather than asserted as met. See inference_provenance.

