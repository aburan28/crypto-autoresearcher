  goal_terminal_status:
    goal_id: GOAL-P13-001
    from: active
    to: paused
    chosen_value: paused
    why_paused_and_not_closed_at_budget: >-
      BECAUSE NO BUDGET IS EXHAUSTED, AND SAYING OTHERWISE WOULD MISSTATE THE
      REASON THE GOAL IS STOPPING. campaign_budget.maximum_batches is null - the
      cap of 4 was REMOVED on the user's explicit direction of 2026-08-02 and is
      recorded in the goal as superseded, not consumed - so there is no batch cap
      to exhaust. On wall clock, the goal's authorized total is 21600 s and the
      executed measurement runs consume of the order of 1230 s of it
      (RUN-PEC-6be870-a 396 s, RUN-PEC-49c773-a 791.751 s, BATCH-403f13's executor
      task 42.0 s of a 3600 s task budget), i.e. under six per cent. The binding
      constraints are a METHOD CEILING on the c-calibration lane (recorded by
      DEC-20260802-48c72c: gamma = exponent(M) - 1 and M is at most schoolbook, and
      the residual width is dominated by L4, an unimplemented subroutine worth
      11.50-13.25 bits) and an INFRASTRUCTURE/CAPABILITY blocker on the one
      substantive open item. `closed_at_budget` would name a cause that did not
      occur and would imply there is nothing left to run, when in fact there is
      exactly one named, frozen, ready protocol left to run.
    why_not_completed: >-
      BARRED BY THE GOAL'S OWN closure_requirements AND BY THE NUMBERS. Completion
      criterion 1 requires an empirical per-entry cost calibration deciding the
      NIST-I margin with error below the irreproducibility band; DEC-20260802-48c72c
      assessed it NOT MET and additionally UNREACHABLE BY THIS METHOD within the
      remaining budget, with the defensible span 13.9429 to 16.6210 bits against
      bands of 2.2309 and 3.5133 bits. Nothing in BATCH-403f13 touches that
      arithmetic. The suspension of the three-model closure quorum (AGENTS.md rule
      13, CLAUDE.md rule 8) is irrelevant here: it removes a procedural gate on
      `completed`, not the substantive requirement that a declared criterion was
      actually met. No completion_quorum block is written and NO ATTESTATION IS
      RECORDED, because none was obtained.
    why_this_is_not_an_understatement: >-
      CLAUDE.md rule 8 forbids retiring under `paused` or `closed_at_budget` a goal
      that DID meet a criterion, in order to understate it. That manoeuvre is not in
      play: criterion 1 is genuinely unmet on the numbers. Criterion 2 (a
      Coordinator evidence record, decision and hypothesis-status update committed
      through a verified ledger archive) is NOT asserted met here either - this very
      decision is uncommitted at the time of writing, and a record in a working tree
      is not durable evidence. It becomes met only if the TASK-20260810-a291c2
      ledger archive is accepted by the post-commit verifier and pushed with an open
      PR against main naming these records.
    resume_condition: >-
      A SUCCESSFUL NC-3/NC-6 execution under the frozen contract
      experiments/EXP-P13-NC36/specification.yaml - Heuristic 1 tail validation at
      the operating point, feasibility gate FG-1 first - in an environment that can
      run the isogeny walk and collect j-invariant statistics. If FG-1 reports
      INFEASIBLE, that is an infrastructure/feasibility outcome and never evidence
      about Heuristic 1, and the goal stays paused on the same condition.
    what_pausing_does_not_assert: >-
      `paused` asserts NO success and closes NO question. It does not retire the
      lane: DEC-20260802-48c72c's carried controls NC2c, NC2f, NC2a-BAND and
      L2-WEIGHT remain named, costed and unspent, each with its own revisit
      condition, and this decision neither closes nor revives them. Per
      docs/inventor-protocol.md section 4, a claim that this lane is dead would need
      a named obstruction, an argument and forward guidance; no such claim is made
      here.

  knowledge_findings_disposition:
    question: >-
      What is the standing of knowledge/findings/KN-FIND-4e7a92.md and
      knowledge/findings/KN-FIND-d1c853.md, shipped by the defective 2026-08-04
      archive under source_decision: DEC-20260804-e19a65?
    verdict: WITHDRAWN-PENDING
    meaning_of_the_verdict: >-
      Both files remain in the corpus as immutable records and neither is edited or
      deleted - both are outside this task's write scope and AGENTS.md core rule 4
      forbids overwriting either way. What changes is their STANDING: as of this
      decision they may NOT be cited as this programme's promoted knowledge, and no
      downstream record may treat their formulas as carrying the `derivation`
      proof_status they declare. They are withdrawn PENDING either (a) a superseding
      KN-FIND that derives the claims from committed artifacts and states that
      derivation, or (b) a recorded withdrawal by a later ledger archive that
      carries knowledge/findings/ and knowledge/INDEX.md in its write scope.
    grounds_that_are_checkable_from_committed_artifacts:
      - id: G-1
        finding: >-
          CONTENT MISMATCH WITH A BINDING PRE-REGISTRATION.
          DEC-20260802-48c72c.knowledge_promotion fixed the promotable content in
          advance: the estimator lemma and pairing rule ("an intercept is only
          meaningful paired with the slope of the same fit of the same series over
          the same window; a slope-only calibration law reports ZERO overhead for
          an object carrying a large constant one"), proof_status `derivation`, two
          named instances, and explicitly "NOT any c value". Neither shipped entry
          promotes that claim. The pre-registration is restated identically in
          H-WESO-001.knowledge_promotion and in BATCH-403f13's own
          dispatch_queue.json kn_find_requirement, so the mismatch is with three
          committed statements of the same obligation, not one.
      - id: G-2
        finding: >-
          PROVENANCE NOT ESTABLISHED. Neither `C_corrected = phi(ell)*C_Phi_ell +
          C_walk` nor `N_pairs ~ exp(H_1 * n_walk)`, nor the terms phi(ell),
          C_walk or N_pairs, appears in RUN-P13-NC2d-a's raw-result or manifest, in
          RUN-P13-NC2b-a's, in the Validator's report, or in the Red Team's report -
          all of which describe an alpha-exponent p-scaling regression and a slope
          recovery check. BATCH-8e1671 recorded this after reading those artifacts
          and this decision re-confirms it against the same files. The entries cite
          EV-WESO-b6ceff as their `source_evidence`, and EV-WESO-b6ceff contains
          neither formula.
      - id: G-3
        finding: >-
          AN INTERNAL INCONSISTENCY WITH THE ARTIFACTS THE ENTRY ITSELF CITES.
          KN-FIND-4e7a92 defines phi(ell) as "ell - 1 (number of distinct roots of
          Phi_ell counted with multiplicity in the supersingular case)". The Red
          Team report it is downstream of records the opposite count for exactly
          this setting: "entries = ell+1 for every prime ell in the measurement.
          This is confirmed in the raw-result.json: n_distinct_roots = ell+1 or
          ell+2" (TASK-20260804-83d874, obj_4_constant_k). THIS IS NOT A CLAIM THAT
          THE FORMULA IS MATHEMATICALLY FALSE - this decision makes no such
          adjudication and commissions none - it is the record that the entry's own
          stated identification contradicts the committed artifact it rests on.
      - id: G-4
        finding: >-
          A RESTATEMENT OF HEURISTIC 1 THAT DOES NOT MATCH THE HYPOTHESIS RECORD.
          KN-FIND-d1c853 treats H_1 as a constant in `N_pairs ~ exp(H_1 * n_walk)`
          and says "under H_1, the probability that any given step produces a
          smooth-norm denominator is approximately P_0 = B_opt^{-1}". H-WESO-001's
          own statement of Heuristic 1 is a smoothness probability
          u^{-u(1+o(1))} with u = log(p/2)/(3 log B) - not a constant, and not
          B_opt^{-1}. The entry additionally offers as its cross-check an
          EV-WESO-001 observation about the reproduction of five concrete (time,
          memory) pairs, which bears on the paper's cost table and not on a pairing
          rule. Again: recorded as a provenance and consistency defect, not
          adjudicated as mathematically false.
    what_this_decision_does_not_do: >-
      It does not supersede the two entries with corrected ones, because it cannot:
      knowledge/findings/ and knowledge/INDEX.md are outside this task's write scope
      and outside the BATCH-2abf22 ledger-archive task's write scope, and the
      /curate-knowledge convention requires the entry and the regenerated index in
      the SAME ledger archive commit. Writing outside the declared scope would be a
      scope-expanding commit and an evidence-integrity failure under AGENTS.md rule
      7. Saying so plainly is the correct handling; shipping a half-promotion is not.
    re_declared_binding_obligation: >-
      THE COUNT, STATED EXACTLY RATHER THAN ROUNDED FOR RHETORIC. This is the
      FOURTH consecutive archive in which the SCHEDULED KN-FIND has not shipped -
      BATCH-002's, BATCH-003's (TASK-20260802-c1f7c8), BATCH-403f13's, and now
      BATCH-2abf22's (TASK-20260810-a291c2) - but the causes are not identical and
      are not merged here. In BATCH-002, BATCH-003 and BATCH-2abf22 the cause is
      the same TASK-CARD SCOPING OMISSION, three times: knowledge/findings/ and
      knowledge/INDEX.md were not in the archive task's write_scope. BATCH-403f13
      is DIFFERENT and worse: its ledger-archive card DID carry both paths in its
      declared write_scope and two entries DID ship, but with content that is
      neither the scheduled content nor traceable to the cited run - a content
      failure, not a scoping one. Neither cause is a research judgement.
      The obligation is re-declared, with its content
      unchanged from DEC-20260802-48c72c: the NEXT ledger archive opened against
      GOAL-P13-001 MUST carry knowledge/findings/ and knowledge/INDEX.md in its
      write_scope and name the KN-FIND in its archive.record_ids, and that KN-FIND
      must promote the estimator lemma and pairing rule at proof_status
      `derivation`, with the C-NULL counterexample and the A-3 absorption as its two
      instances, and NOT any c value. The KN-TECH candidate recorded alongside it
      (null-object control on an EXPLANATION rather than on a signal) remains a
      candidate and is not pre-approved here.

