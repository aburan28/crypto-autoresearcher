    it wrote, here and in the appended head keys, is a `>-` FOLDED BLOCK SCALAR,
    so a contained ": " is scalar content and cannot be read as a mapping. Plain
    scalars are single tokens with no ": ". Sequence items containing ": " are
    SINGLE-QUOTED, with internal double quotes only. Folded scalars join lines
    with spaces, so every line was written to read correctly WHEN FOLDED ONTO ONE
    LINE, and no sentence's negation is split across a line break -- the failure
    mode that made a sibling session read "NO ICEX" / "MEASUREMENT AUTHORIZED" as
