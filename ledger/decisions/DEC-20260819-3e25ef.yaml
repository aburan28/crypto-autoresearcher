coordinator_decision:
  id: DEC-20260819-3e25ef
  id_status: >-
    NOT ALLOCATED. This session holds NO shell and NO command-execution tool,
    so it did not and could not run tools/allocate_id.py. `DEC-20260819-3e25ef` is a
    LITERAL PLACEHOLDER and is not an identifier. NO IDENTIFIER IS INVENTED
    ANYWHERE IN THIS RECORD. The dispatching session must mint the real id with
    `python3 tools/allocate_id.py --next coordinator_decision --date 20260819`,
    confirm it with `--check`, substitute it for EVERY occurrence of
    `DEC-20260819-3e25ef` in this file AND in the restored goal head's
    head_regression_by_pr467_merge_restored_20260819 key, and rename this file
    to ledger/decisions/DEC-20260819-<tok>.yaml.
  filename_status: >-
    Written with a terminal `.pending` extension so it does NOT match
    tools/validate_ledger.py's `ledger/decisions/*.yaml` glob while it still
    carries an unallocated id. A record naming `DEC-20260819-3e25ef` must never be
    allowed to register as a decision id.
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-158345
  batch_id_note: >-
    Named as the batch the restored head points at. This decision did NOT open
    it: BATCH-158345 was opened 2026-08-17 under BUDGET-AMEND-20260817-001 and
    its control plane is already committed.
  evidence_id: null
  evidence_id_note: >-
    No evidence record is created or cited. This decision rests on committed
    coordination and operational records and on git measurements supplied by
    the dispatching session. It is not scientific evidence and supports no
    claim about ECDLP or any hypothesis in either direction.
  archive_kind: goal_head_reconciliation
  recorded_at: '2026-08-19'
  decision: reconcile_goal_head
  target_ids:
    - GOAL-ECDLP-001
    - BATCH-158345
    - BATCH-1800b3
  target_ids_note: >-
    Added by a follow-up commit on this same branch after the archiving session ran
    tools/validate_ledger.py FROM INSIDE THIS WORKTREE and it reported this record
    missing the schema-required field. The earlier run that reported OK was invoked by
    ABSOLUTE PATH to the primary checkout's copy of the script, which resolves its repo
    root from its own location and therefore validated the primary checkout, not this
    worktree. The record's substance is unchanged: this adds a required field that was
    omitted, and supersedes nothing.
  decision_label: >-
    goal_head_regression_by_merge_repaired_by_byte_exact_restore_from_committed_history_budget_not_consumed

  # ===================================================================
  # WHAT WAS ASKED, AND WHAT WAS ACTUALLY WRONG
  # ===================================================================
  context: >-
    This session was dispatched to advance GOAL-ECDLP-001 past the completed
    BATCH-1800b3 and to adjudicate a possible campaign-budget overrun, the
    latter raised from a count of 54 files under
    ledger/goals/GOAL-ECDLP-001/checkpoints/ against a parsed
    campaign_budget.maximum_batches of 50. BOTH PREMISES ARE ARTIFACTS OF ONE
    DEFECT. The mutable head ledger/goals/GOAL-ECDLP-001/goal.yaml was not
    stale: it was REGRESSED BY A MERGE on 2026-08-18, five days backwards,
    losing three committed user-authorized budget amendments, two goal status
    transitions, and the cursor. BATCH-1800b3 has not been the frontier since
    2026-08-13. The campaign's open batch is BATCH-158345, the 54th and last
    authorized, and not one of its five tasks has completed.

  # ===================================================================
  # THE REGRESSION
  # ===================================================================
  head_regression:
    mechanism: merge_of_a_five_day_old_branch_over_the_single_mutable_head
    merge_commit: e774585e9dad88a79e81161b03cc9f54b44b6df1
    pull_request: 467
    merged_branch: codex/ecdlp-b080-b180-reconcile-20260813
    merged_at: '2026-08-18T09:39:40-07:00'
    three_way_comparison_measured_by_the_dispatching_session:
      before_first_parent: 'current_batch_id BATCH-158345, maximum_batches 54, latest_verified_commit 3a3e923b9705, next_action 5530 chars'
      merged_in_branch: 'current_batch_id BATCH-1800b3, maximum_batches 50, latest_verified_commit 1723490b3962, next_action 920 chars'
      after_merge: 'byte-identical to the merged-in branch; the stale side taken wholesale, no conflict surfaced'
    still_live_on_main_when_found: >-
      The dispatching session measured `git log e774585e9dad..origin/main --
      ledger/goals/GOAL-ECDLP-001/goal.yaml` as EMPTY. Nothing had touched the
      head since the regressing merge, so this was not already repaired
      elsewhere and the repair is not redundant.
    provenance_of_those_measurements: >-
      ALL OF THE ABOVE ARE THE DISPATCHING SESSION'S GIT MEASUREMENTS, RECORDED
      AS RECEIVED. This Coordinator session ran no git command and verified none
      of them. What it did verify for itself, by reading files: the head's own
      contents, the write-once merge digests, the checkpoint shards, the
      BATCH-158345 control plane, and the recovered head body.
    independently_corroborated_by_this_session: >-
      The write-once merge digest coordination/events/main/e774585e9dad.yaml
      records, without needing git, `next_action_changed: true` with the
      next_action reverting to the BATCH-1800b3 text, and
      `latest_verified_commit: from 3a3e923b97056b6514601c78aaa941ad29b92778 to
      1723490b39621da5c60115ce41c31770712c369a`. The digest and the git
      measurement agree.
    what_survived_and_why: >-
      Every per-batch checkpoint under ledger/goals/GOAL-ECDLP-001/checkpoints/
      survived intact, BATCH-7d9b78.yaml included. That is exactly the sharding
      design CLAUDE.md prescribes working as intended: shards are write-once and
      one file per batch, so concurrent campaigns never contend for the same
      bytes. The mutable head is the one file every campaign writes, and it is
      the one thing that did not survive. THIS INCIDENT IS EVIDENCE FOR THE
      SHARDING RULE, NOT AGAINST IT.

  # ===================================================================
  # AN ERROR OF THIS SESSION'S OWN, NAMED RATHER THAN QUIETLY FIXED
  # ===================================================================
  self_correction_r10_scope_error:
    what_this_session_asserted: >-
      In its first disposition this session asserted that the text of
      BUDGET-AMEND-20260812-001, -20260815-001 and -20260817-001 "no longer
      exists anywhere under ledger/ in this tree", and built a whole disposition
      on it: it refused to restore the cap, left campaign_budget.maximum_batches
      visibly wrong at 50, and handed the restoration onward as a blocked
      obligation.
    what_is_actually_true: >-
      The claim as scoped to `ledger/` was TRUE. The inference drawn from it was
      FALSE. The amendments are quoted in committed records under
      `coordination/`: the dispatching session's
      `grep -rl BUDGET-AMEND-20260817-001 ledger/ coordination/` returns six
      files, including
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-158345/batch.yaml,
      that batch's dispatch_queue.json, and
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-4d7ae0/dispatch_queue.json.
      And the amendments' FULL canonical text was recoverable all along from the
      regressing merge's first parent, which is committed history.
    the_failure_named: >-
      THE SEARCH WAS CORRECT AND THE SEARCH SCOPE WAS WRONG, AND THE REPORT
      GENERALISED FROM THE SCOPE TO THE PROGRAM. This is the same class of
      failure as the ICEX inversion that R-10 was written for, in different
      dress: there, the search UNIT was wrong, because a line-scoped match cut a
      folded sentence in half and inverted it; here, the search SCOPE was wrong,
      because `ledger/` is not the program. R-10 requires recording the exact
      pattern, paths and match count, and this session did record them
      faithfully -- which is precisely why the error is legible now. RECORDING
      THE SEARCH DOES NOT VALIDATE THE SEARCH. The discipline R-10 asks for is
      to state the scope AND to treat a negative result as bounded by that
      scope, and the correct phrasing was "absent from ledger/", never "absent
      from the tree".
    the_standing_rule_this_goal_already_records: >-
      This goal's own head records the rule twice, from two prior incidents:
      "absence of a record in your working tree is never evidence of its absence
      in the program, and the number of trees you did read is not a bound on the
      number that exist." The corollary this session had to learn is narrower and
      sharper: absence under one SUBTREE is not absence in the tree.
    consequence_for_the_disposition: >-
      DECISIVE, AND IT REVERSES IT. The sole ground for refusing to restore the
      cap was that restoring it would require retyping a user authorization from
      memory, which would be fabrication. That ground EVAPORATES once the
      committed bytes are available. With them, restoring fabricates nothing,
      and the partial advance becomes the worse act.
    superseded_within_this_session: >-
      The first disposition (a three-field partial advance leaving
      maximum_batches at 50) is SUPERSEDED by this record, not retracted as
      wrong in its reasoning: on the facts then available it was the correct
      refusal, and refusing to re-author a lost user authorization remains
      correct. It is superseded because the facts changed, and it is recorded
      here rather than erased.

  # ===================================================================
  # THE BUDGET RULING
  # ===================================================================
  budget_ruling:
    question_as_posed: 'Is campaign_budget consumed, given 54 checkpoint files against a parsed maximum_batches of 50?'
    ruling: NOT_CONSUMED
    ruling_short: >-
      The budget is NOT exhausted, pause_conditions[0] does NOT fire, and the
      goal is NOT paused by this decision. The parsed value 50 was not the
      governing cap; it was a regressed field. THE GOVERNING CAP IS 54, and the
      54th and last authorized batch is open with no task completed.
    governing_amendment: BUDGET-AMEND-20260817-001
    governing_amendment_effect: 'campaign_budget.maximum_batches 53 -> 54'
    governing_amendment_source: >-
      Quoted from the goal record itself, budget_amendments entry
      BUDGET-AMEND-20260817-001, as recovered byte-exact from the first parent of
      the regressing merge. This is the amendment's own canonical text, not a
      secondary quotation.
    governing_amendment_authorization_quoted_verbatim: >-
      "FRESH EXPLICIT USER AUTHORIZATION: the user's 2026-08-17 instruction
      \"Continue GOAL-ECDLP-001\" / \"keep going\", recorded by the Coordinator
      at the BATCH-158345 opening. THIS IS A USER AUTHORIZATION RECORDED BY THE
      COORDINATOR. The Coordinator does not self-grant batches; this is recorded
      on the same basis as every prior amendment in this goal's history
      (BUDGET-AMEND-20260727-002/-004, -20260728-001/-002, -20260729-001..-004,
      -20260730-001, -20260812-001 and -20260815-001)."
    governing_amendment_arithmetic_quoted_verbatim: >-
      "As of this amendment, 53 checkpoint files exist under
      ledger/goals/GOAL-ECDLP-001/checkpoints/ (independently listed by the
      opening act). The 53rd (BATCH-7d9b78) fired the pause condition on the
      amended cap of 53. THE RAISE IS +1 IN VALUE AND +1 IN NEWLY-AUTHORIZED
      BATCHES: this single unit of value authorizes EXACTLY ONE new batch, the
      54th (BATCH-158345). A 55th batch is NOT authorized and requires its own
      amendment on its own explicit user authorization. No standing direction may
      be read as pre-authorizing a 55th batch."
    amendment_chain_restored:
      - 'BUDGET-AMEND-20260812-001: 50 -> 51'
      - 'BUDGET-AMEND-20260815-001: 51 -> 53'
      - 'BUDGET-AMEND-20260817-001: 53 -> 54'
    why_not_consumed: >-
      The cap authorizes batches up to and including the 54th. The 54th batch is
      BATCH-158345 and it is OPEN, not closed: it carries no checkpoint under
      ledger/goals/GOAL-ECDLP-001/checkpoints/, and its directory holds only
      batch.yaml, dispatch_queue.json and five task cards, with no archives, no
      reviews and no producer outputs. The dispatching session independently
      confirms its queue shows all five tasks queued. A budget whose last
      authorized unit is still in flight is not exhausted. Every prior firing of
      pause_conditions[0] in this goal's history fired on a CONSUMED value, never
      on an in-flight one, and this decision does not depart from that.
    the_54_file_count_addressed_directly: >-
      THE COUNT IS REAL AND IT IS NOT AN OVERRUN. The 54th file is
      BATCH-1800b3.yaml, and it landed on 2026-08-18 IN THE SAME PR 467 MERGE
      THAT REGRESSED THE HEAD, carrying a 2026-08-13 batch from a parallel
      branch. Before that merge the count was 53 -- exactly what
      DEC-20260817-e633b6 counted at the BATCH-7d9b78 close and exactly what
      BUDGET-AMEND-20260817-001 states in its own arithmetic. The file count did
      not rise because the campaign ran a batch; it rose because an old batch's
      checkpoint arrived late.
    counting_convention_not_adjudicated_here: >-
      This decision does NOT adjudicate the file-count convention and does not
      need to. BUDGET-AMEND-20260817-001 authorizes the last batch BY IDENTITY --
      "this single unit of value authorizes EXACTLY ONE new batch, the 54th
      (BATCH-158345)" -- so BATCH-158345 is authorized under either reading. This
      follows the precedent DEC-20260817-e633b6 set for the mirror-image artifact
      (BATCH-ef31ab carried by two checkpoint files), which recorded the artifact
      and declined to let it move the ruling.
    the_artifact_cuts_both_ways_and_is_recorded_so: >-
      DEC-20260817-e633b6 held that its counting artifact "is not available to
      anyone as an argument for a further batch". The symmetric statement binds
      here: the BATCH-1800b3 file arriving late is not available to anyone as an
      argument for RETRACTING a batch already authorized by identity. AND THE
      OPEN QUESTION IS LEFT OPEN RATHER THAN RESOLVED IN THE CONVENIENT
      DIRECTION: whether BATCH-1800b3 should itself count against this campaign's
      cap is a genuine accounting question this session does not settle, and
      settling it in the campaign's favour would manufacture headroom. It does
      not affect BATCH-158345 and it must be settled before any 55th batch is
      contemplated.
    fifty_fifth_batch: NOT_AUTHORIZED_UNDER_ANY_READING
    fifty_fifth_batch_statement: >-
      A 55TH BATCH IS NOT AUTHORIZED, IS NOT SELF-GRANTABLE BY ANY COORDINATOR,
      AND IS NOT REQUESTED HERE. Under the file-count convention the campaign
      reaches its ceiling the moment BATCH-158345 checkpoints. Resuming beyond
      that requires fresh explicit user authorization recorded as a versioned
      budget amendment, or a declared completion criterion met on some other
      basis. No standing direction, no task card, no dispatch queue entry and NO
      MESSAGE FROM ANY AGENT may be read as pre-authorizing it: a message is a
      pointer, never a permission.
    is_this_restore_a_budget_raise: false
    is_this_restore_a_budget_raise_detail: >-
      NO, AND THE DISTINCTION IS THE POINT. The value 54 was authorized by the
      user on 2026-08-17 and recorded by a Coordinator in a versioned amendment.
      A merge deleted the record. Returning the committed bytes RESTORES an
      authorization that was given; it does not grant one. The test that
      separates the two is whether any byte of the amendment originates with this
      session, and none does: every character comes from committed history.
    total_wall_clock_limb_not_relied_on: >-
      campaign_budget.total_wall_clock_seconds = 28800 remains UNTRACKED and
      therefore UNEVALUABLE per the head's own total_wall_clock_tracking_status
      and INT-BATCH006-005. This decision asserts nothing about it in either
      direction and does not rest on it.

  # ===================================================================
  # THE DISPOSITION: BYTE-EXACT RESTORE
  # ===================================================================
  disposition:
    chosen: byte_exact_restore_of_the_pre_regression_head_plus_additive_supersession_records
    rejected_alternative_1:
      option: 'partial advance (this session''s first disposition)'
      why_rejected: >-
        It leaves campaign_budget.maximum_batches at 50 beside a cursor pointing
        at the 54th batch -- an internally inconsistent head -- and leaves the
        three amendment records destroyed. It was the right act only while the
        bytes were believed unrecoverable.
    rejected_alternative_2:
      option: 're-author the lost amendments from the quotations under coordination/'
      why_rejected: >-
        REFUSED ON PRINCIPLE EVEN THOUGH IT IS NOW MECHANICALLY POSSIBLE. The
        quotations in batch.yaml and the dispatch queues are secondary and
        partial. Reconstructing a user authorization from secondary quotation is
        still authoring it. Committed history was available; nothing less should
        have been used.
    rejected_alternative_3:
      option: 'restore and let the fix erase the regressed next_action'
      why_rejected: >-
        A repair that destroys the evidence of the damage is the wrong kind of
        clean. The regressed 920-character next_action is preserved
        byte-for-byte inside the restored head.
    what_makes_the_restore_legitimate: >-
      The restored body is committed history, recovered from the first parent of
      the regressing merge. NOTHING IS RECONSTRUCTED, INFERRED OR RETYPED. The
      dispatching session reports it parses cleanly and yields current_batch_id
      BATCH-158345, maximum_batches 54, latest_verified_commit 3a3e923b9705 and a
      5530-character next_action; this session independently confirmed each of
      those five values by reading the recovered file directly.

  # ===================================================================
  # WHAT THIS SESSION DID, AND THE ONE STEP IT CANNOT DO
  # ===================================================================
  work_performed:
    file_prepared: RECOVERED-preregression-goal-head.yaml
    file_prepared_status: >-
      The recovered pre-regression body with FOUR additive keys appended at the
      end of the research_goal mapping. Everything above
      `head_regression_by_pr467_merge_restored_20260819` is the recovered body
      untouched; the appended keys are the only additions.
    keys_appended:
      - head_regression_by_pr467_merge_restored_20260819
      - prior_next_action_regressed_by_pr467_merge_superseded_20260819
      - prior_next_action_regressed_by_pr467_merge_superseded_20260819_note
      - head_regression_dropped_keys_20260819
      - known_defect_dispatch_queue_path_at_restore_20260819
    keys_appended_count_note: >-
      Five keys, listed above; the phrase "four additive keys" would be wrong.
      Two of them are a preserved scalar and its explanatory note.
    the_step_this_session_cannot_perform: >-
      THE FILE MOVE ITSELF. Placing the restored body at
      ledger/goals/GOAL-ECDLP-001/goal.yaml requires copying roughly 540 KB.
      This session has only Read/Write/Edit and would have to pull the whole
      body through its context and re-emit it. THAT IS A TRANSCRIPTION HAZARD
      AND IT WAS REFUSED: a single silent character change in a restored ledger
      record is worse than not restoring it, this session cannot compute a
      sha256 to detect such a change, and asserting a byte-exact restore it
      could not verify would be exactly the fabrication this whole decision
      exists to avoid. The move is a one-command shell operation and belongs to
      the session that has a shell.
    verification_the_dispatching_session_must_run: >-
      After the move, confirm the restored prefix is byte-identical to committed
      history -- e.g. diff `git show
      e774585e9dad88a79e81161b03cc9f54b44b6df1^:ledger/goals/GOAL-ECDLP-001/goal.yaml`
      against the restored file truncated to that length -- and confirm the only
      difference is the five appended keys. Note that the prepared file's sha256
      is NO LONGER bb220b81be2d71a8621c89c092974546004c37994a321b0f67dc7fb46e12fa67,
      because the append changed it intentionally; verify the PREFIX, not the
      whole-file digest.
    scaffolding_to_delete: >-
      RECOVERED-preregression-goal-head.yaml must be moved into place and then
      removed from the worktree, and must NOT be committed at the repo root.
      This session cannot delete files and did not.
    partial_advance_left_in_place_as_a_fallback: >-
      The three-field partial advance this session first wrote into
      ledger/goals/GOAL-ECDLP-001/goal.yaml is LEFT IN PLACE DELIBERATELY. The
      restore overwrites it wholesale, which is intended; the two must NOT be
      merged. It is retained only so that if the restore cannot be completed for
      any reason, the working tree still holds a head that is strictly better
      than the regressed one (correct cursor, correct latest_verified_commit,
      and a next_action that names the blocker) rather than falling back to the
      regression.

  restore_effects:
    file: ledger/goals/GOAL-ECDLP-001/goal.yaml
    field_changes_relative_to_the_regressed_head:
      - 'status: active -> active (UNCHANGED; the value coincided, no transition is performed or claimed)'
      - 'campaign_budget.maximum_batches: 50 -> 54'
      - 'budget_amendments: BUDGET-AMEND-20260812-001, -20260815-001, -20260817-001 RESTORED verbatim'
      - 'current_batch_id: BATCH-1800b3 -> BATCH-158345'
      - 'latest_verified_commit: 1723490b39621da5c60115ce41c31770712c369a -> 3a3e923b97056b6514601c78aaa941ad29b92778'
      - 'dispatch_queue_path: BATCH-1800b3 queue -> BATCH-7d9b78/dispatch_queue.v2.json (see known defect below)'
      - 'next_action: 920-char BATCH-1800b3 action -> 5530-char BATCH-158345 dispatch instruction'
      - 'the 2026-08-12 to 2026-08-17 status notes, pause_reason, cursor notes and prior_next_action chain: RESTORED'
    keys_dropped_by_the_restore:
      count: 7
      keys:
        - prior_current_batch_id_batch080a9c_closed_20260813
        - current_batch_id_note_at_batch1800b3_open_20260813
        - prior_dispatch_queue_path_batch080a9c_closed_20260813
        - dispatch_queue_path_note_batch1800b3_open_20260813
        - prior_latest_verified_commit_before_batch1800b3_open_20260813
        - latest_verified_commit_note_batch1800b3_open_20260813
        - prior_next_action_batch080a9c_closed_20260813
      is_anything_in_the_post_regression_head_worth_keeping:
        answer: >-
          ONE THING ONLY, AND IT IS KEPT: the regressed next_action, preserved
          byte-for-byte in the restored head so the regression stays auditable.
          Nothing else is.
        verified_how: >-
          Each dropped key was checked against the recovered body by an
          indentation-anchored key scan. All seven are head-level bookkeeping
          for BATCH-1800b3 that reached the head ONLY by the regressing merge
          and never existed on the main lineage. BATCH-080a9c's own bookkeeping
          is NOT among the losses: it is present in the recovered body at
          current_batch_id_note_at_batch080a9c_open_20260811 and
          prior_current_batch_id_before_batch080a9c_20260811.
        where_the_content_survives: >-
          The write-once shard
          ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-1800b3.yaml, which this
          session read in full (status closed, verdict PASS, recorded_by_task
          TASK-20260813-835873, DEC-20260813-520485, EV-ECDLP-c4c325) and which
          the restore cannot touch because it is a separate file; the ledger
          records DEC-20260813-173d38, DEC-20260813-520485, EV-ECDLP-c4c325 and
          CORR-20260813-d9f0fa; experiments/EXP-SEMAEV-a097b5/; and
          coordination/goals/GOAL-ECDLP-001/batches/BATCH-1800b3/. The regressed
          head also stays permanently readable in git history.
        why_not_copied_forward: >-
          Re-importing the BATCH-1800b3 head body into the restored head would
          partially re-perform the very regression this act repairs.
    known_defect_carried_not_introduced: >-
      dispatch_queue_path in the restored head reads
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-7d9b78/dispatch_queue.v2.json
      while next_action directs dispatch from
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-158345/dispatch_queue.json.
      This inconsistency is PRE-EXISTING in the pre-regression head: the
      BATCH-158345 opening act advanced current_batch_id and next_action and did
      not advance dispatch_queue_path. The restore neither creates nor cures it.
      The OPERATIVE queue is the one next_action names. Repairing the field is a
      separate Coordinator act, and it is flagged in the restored head.
  checkpoint_written: false
  checkpoint_note: >-
    NO checkpoint was written for BATCH-1800b3, because one ALREADY EXISTS at
    ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-1800b3.yaml and shards are
    WRITE-ONCE. It was read in full before this determination and was not
    modified. No checkpoint was written for BATCH-158345 either: that batch is
    open and no outcome exists to check point.

  # ===================================================================
  # RATIONALE
  # ===================================================================
  rationale:
    - >-
      A regressed head is not a stale head, and the difference decides the
      remedy. A stale head is advanced; a regressed head is RESTORED, because
      what it lost was not overtaken by later work but deleted by an unrelated
      merge, and the deleted content includes records of user authorizations
      that no later act can legitimately re-create.
    - >-
      Restoring from committed history fabricates nothing. That is the entire
      basis on which a Coordinator may return a budget value to 54 without that
      being a self-grant, and it is why the first disposition's refusal was
      correct on its facts and wrong once the bytes were available.
    - >-
      The successor was not invented and not chosen on judgement. BATCH-158345
      is named as the cursor by the recovered head itself, by its own committed
      batch.yaml, and by the independent PR 464 merge digest; it is the only
      batch in the lineage with a committed opening record and no closing
      checkpoint.
    - >-
      A budget overrun was alleged on a file count. Ruling on a count when the
      governing record is an amendment would have paused an active campaign on
      an arithmetic artifact created by the same merge that caused the
      regression.
    - >-
      Pausing was available and was refused, symmetrically with the refusal to
      raise: pause_conditions[0] fires on an EXHAUSTED budget, and the last
      authorized batch is in flight with no task completed. Pausing here would
      record a budget outcome the committed records do not support and would
      stop a lane DEC-20260817-e633b6 expressly declined to retire, because it
      has a concrete, cheap, fully specified successor scope and a live spawned
      candidate.

  # ===================================================================
  # NEXT ACTION
  # ===================================================================
  next_action_count: 1
  next_actions:
