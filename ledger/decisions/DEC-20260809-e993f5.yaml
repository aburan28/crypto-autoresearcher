  rationale:
    first_archive_invalidity: >-
      A self-neutral receipt must bind every frozen non-self path. Two false
      hashes make the 2b envelope invalid despite its correct parent, path set,
      report hash, and message coverage.
    false_queue_verification: >-
      The 594 queue hash map matches actual Git blobs but was never a
      receipt-to-Git comparison. Its full-verification assertion is false and
      has no retroactive repair effect.
    second_archive_invalidity: >-
      The d21 receipt correctly binds its evidence and decision but declares
      the 99df first-response digest for the report path where Git preserves a
      distinct 8d8 report. A failed precommit assertion was followed by a
      commit because the shell sequence was not fail-fast; that process defect
      is preserved and the archive is invalid.
    unavailable_bytes_boundary: >-
      The 99df first-response bytes were overwritten before archival. Only
      their digest and ordinary provenance remain; the bytes are not claimed
      preserved, parsed, or reconstructable. The committed 8d8 report is not
      treated as the receipt-named source.
    predecessor_content_rule: >-
      Predecessor records remain immutable historical content. Their factual
      lineage and unchanged REVISE account may be used only with both invalid
      envelopes and every mismatch prominently disclosed. Neither archive is
      verifier-accepted.
    technical_disposition: >-
      The e37e061a technical report remains byte-stable and authoritative.
      Cluster-rank seed domains, treatment sharing, traffic compilation,
      planted sampling, exact-quotient L semantics, and canonical on-curve
      charges are the exact blockers. REVISE is supported; PASS and REJECT are
      not.
    execution_authorization:
      granted: false
      experiment_design_authorized: false
      experiment_execution_authorized: false
      reason: >-
        The six blockers prevent a deterministic, lossless, independently
        reproducible experiment contract. No experiment or run is authorized.
