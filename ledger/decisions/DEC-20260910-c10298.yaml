    1.2692) sit more than an order of magnitude below the frozen
    exponent-+2 prediction (x100 per decade) at H <= 10^4 on the
    10^4-tuple sample (EV-ECRANK-d7e05f). The evidence record's
    unresolved_confounds item 1 names the two reconciliation routes
    (extended-H measurement under a new frozen contract, or a
    theoretical reading of the realized density), and its
    obstruction_note keeps the resource_check reading live (strong
    local obstruction / small-height scarcity). RANK 1 (the
    breakthrough-tier review of the UNPROMOTED C1-closure candidate of
    DEC-20260905-7adca0) remains gated by IMP-2: this session's
    adapter doctor --probe recheck (2026-09-10) found the anthropic
    backend unusable ($ANTHROPIC_API_KEY unset) and nothing else
    reaching max -- IMP-2 STANDS and is untouched here.
  design_time_facts: >
    EXACT FACTS read from the bound 73275e bytes at design time (the
    disclosed basis of the design refinement; each is verifiable at
    the frozen hashes and will be machine-re-verified by the contract's
    own R2 arm): (1) source/construct.py solve_n6 (lines 65-95)
    computes coefficients (A, B, C) from (b, dpat) alone and extracts
    the COMPLETE rational root set of ONE univariate quadratic --
    at most 2 candidates per tuple, with no H input; H appears only at
    the post-solve admission filter 'if h > H: near' (line 86), and
    every height-rejected root is recorded in the near-miss ledger
    with its exact height ('r_height_<h>'). (2) source-v2/
    construct_v2.py construct_arm_v2 passes H_top to solve_n6 and uses
    H_levels only for cumulative counting of the returned instances.
    (3) Committed R12 raw bytes: found 33, feasible_tuples 22, counts
    N_6^A {100:20, 1000:28, 10000:33}, N_6^B {100:26, 1000:33,
    10000:33}; committed R14 raw bytes: found 0, near_miss_total 0
    (the n=8 extended band is vacuous). CONSEQUENCE: per-tuple count
    growth in H is bounded by 2 by construction, the extended-H count
    N_6(H') for ANY H' is exactly computable from the committed bytes
    plus an H-independent build_instance recomputation, and a plain
    extended-H re-enumeration of the frozen pipeline is
    information-void beyond the recorded root heights.
  design_refinement_disclosure: >
    The N4 sketch named 'extended-H construct enumeration under both
    conventions, larger H range, pre-registered tail_check' OR a
    theoretical density analysis. Given the design-time facts above,
    this decision designs the equivalent decisive measurements instead
    of a vacuous re-enumeration: T1 machine-checked structural trace
    of the bound bytes (with a dynamic H = 10^4 vs 10^9
    double-invocation control on the three frozen blind-derivation
    tuples); T2 exact extended-height RE-ADMISSION from the committed
    near-miss ledger over bands 10^4..10^7 under both conventions
    (the only extended-H quantity the frozen pipeline can yield),
    with the pre-registered tail_check (P3: every decade ratio <= 4;
    ANY ratio >= 10 revives the scarcity reading and FALSIFIES the
    hypothesis's scarcity rejection); T3 theoretical density
    derivation locating HEUR-1's stated parameter space (the lineage's
    W'(b) / draw-side H^5 regime) against the construct arm's
    0-dimensional linear-g slice, with the proves-too-much control on
    the draw-side committed data where F1 fired; T4 the decade-ratio
    instrument calibration the v2 round's failed gates (b)/(c) left
    open, admitted FIRST. If T1's trace breaks (H participates in n=6
    candidate generation anywhere in the bound path), SR-3 stops the
    adjudication and the original extended-H enumeration sketch
    revives as the required versioned amendment path. This refinement
    narrows no scope and removes no route; it replaces a measurement
    proven information-void at design time with the measurements that
    decide the same question, and every branch remains pre-registered.
