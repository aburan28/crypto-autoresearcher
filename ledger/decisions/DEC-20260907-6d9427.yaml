  # =====================================================================
  # 5. ASYMPTOTIC PROMOTION GATES -- NOT ENGAGED, AND NAMED ANYWAY
  # =====================================================================
  asymptotic_promotion_gates:
    engaged_by_this_item: false
    why_not_engaged: >-
      NO ASYMPTOTIC-COMPLEXITY CLAIM IS MADE ANYWHERE IN THIS BATCH. claim_tier
      is TOY; the instrument is a generic keyed random function at N <= 2^24;
      there is no curve arm, no cryptographic N, no exponent, no theorem, no
      lemma decomposition and no numbered heuristic. Every conclusion is a
      CONSTANT-FACTOR statement under the Corrigan-Gibbs / Kogan
      S*T^2 = Omega~(eps*N) ceiling. The four gates of agents/coordinator.md are
      TRIGGERED BY an asymptotic claim; with no such claim they are not engaged,
      and the amendment's Section 9 says so in the same words.
    named_anyway_with_current_status: >-
      Recorded so a later reader asking "could this lane ever reach `supported`
      on an asymptotic claim?" gets an answer instead of silence. ALL FOUR ARE
      OPEN AND NONE IS PARTIALLY MET.
      GATE 1 -- archived proof decomposition into single-responsibility lemmas
      with per-attempt-cost x inverse-success-probability bookkeeping: OPEN. No
      proof, lemma or asymptotic argument exists in this lane; the Red Team
      recorded that there is no proof architecture to attack. Inverse success
      probability is currently and implicitly set to 1, which is itself
      uncharged.
      GATE 2 -- every conditional dependence stated as an explicit numbered
      heuristic with archived validation or a scheduled validation experiment:
      OPEN. There is no numbered heuristic in this batch to validate. The nearest
      candidate is the estimator-loss flatness of the obstruction's
      resource_check, which is NOT yet stated as a heuristic and is measured at
      exactly two T points; the T-sweep this decision orders is the experiment
      that would let it become one.
      GATE 3 -- concrete-cost table at standardized parameter sets with honest
      accounting of o(1) overhead, memory, time-memory tradeoffs and
      parallelization, optimistic assumptions flagged, and an affected-vs-safe
      scope statement: OPEN, and the Red Team's cost audit shows why it would
      currently FAIL: the largest uncharged cost is exact basin computation at
      Theta(N) time and memory -- Theta(2^256) at crypto scale, worse than the
      instance it would help solve -- and the online batch size U is uncharged
      entirely.
      GATE 4 -- independent review-adversarial plus a red-team pass on the cost
      model and heuristics: PARTIALLY EXERCISED FOR THIS BATCH ONLY and NOT
      transferable to any future asymptotic claim. This round did run an
      independent validator and an independent red team, and the red team did
      audit the cost model -- and it BROKE on J6.
    consequence: "A claim missing any gate may reach `analyzed`, never `supported`. This lane is at `analyzed` and this decision does not move it."

