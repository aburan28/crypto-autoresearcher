      THAT CEILING AT ANY BATCH SIZE U. ZERO ONLINE ARMS RAN. TopShare(T_sel) is
      an ORACLE requiring exact basin sizes, which no algorithm has.
      DEC-20260907-9b1b02 recorded this exact slide once already for
      EXP-ECDLP-6ac801, and the v3 amendment's Section 9 restates it; it is
      restated a third time here because it is the failure mode this lane is
      most likely to commit.
