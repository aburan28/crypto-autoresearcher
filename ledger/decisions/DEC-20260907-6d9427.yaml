# Coordinator decision closing GOAL-ECDLP-bbc21f / BATCH-8f3e86, and the
# archival act for the approval of EXP-ECDLP-612fb1's v3 amendment.
# Immutable. Corrections are new records, never edits to this one.
coordinator_decision:
  id: DEC-20260907-6d9427
  goal_id: GOAL-ECDLP-bbc21f
  batch_id: BATCH-8f3e86
  question_id: RQ-ECDLP-78dbc5
  experiment_id: EXP-ECDLP-612fb1

  context: >-
    BATCH-8f3e86 executed the v3 amendment to EXP-ECDLP-612fb1: eleven runs
    measuring the G3 ceiling-feasibility predicate at T_sel = floor(T/2) on the
    frozen v2 keyed-random-function instrument, at N = 2^20 (STAGE 3A
    replication anchor) and N = 2^24 with exact basins (STAGE 3B), plus a
    STAGE 3C aggregation. The batch was scoped to discharge five residuals left
    by EXP-ECDLP-6ac801 (DEC-20260907-9b1b02 / EV-ECDLP-2e9680): R1 an explicit
    weight formula plus a fresh re-seal of the blind re-derivation, R2 the
    first red-team pass ever run on this lead, R3 an independent reproduction
    of a = 1/16 from a third angle, R4 a fresh-run replication of the contested
    N = 2^20 a-scan, and R5 null and decay controls on the G3 margin itself.
    An Executor produced the package (TASK-20260907-aad514); a Coordinator
    snapshot committed it before review (TASK-20260907-7bf406); a Validator
    (TASK-20260907-b2a8ad, joints J1/J2/J3) and a Red Team
    (TASK-20260907-ee1ca7, joints J4/J5/J6) reviewed it in independent sessions,
    blind to each other, under a review_plan frozen before either ran. This
    task, TASK-20260907-33a736, composes those six joints and records the
    official disposition. It re-litigates neither report.

  decision: replicate
  decision_note: >-
    ONE VERB IS RECORDED IN THE SCHEMA FIELD AND IT IS `replicate`. Two other
    acts are carried in this record and are named explicitly rather than
    compounded into the verb: `amendment_approval_archival_act` below (the
    archival act for the v3 amendment's already-authored approval) and
    `red_team_diagnostic_archive_decision` below (the disposition of the Red
    Team's undeclared scratch/ directory). Neither is a research-state
    transition and neither is smuggled into `decision`.
  decision_rationale_for_verb: >-
    (i) NOT `support`. The round's ONLY genuinely independent reading of the
    load-bearing cells -- Validator joint J2's sealed blind re-derivation --
    DISAGREES with the producer on the SIGN at a = 1/8, seed 2 (-0.002952278
    against +0.005128205). And the third angle the batch was scoped to supply
    does not exist: STAGE 3B imports the same frozen source_v2/instrument.py
    that EXP-ECDLP-6ac801's production arm imported, so residual R3 is NOT
    discharged. Calling this `support` would rest a status move on corroboration
    the round did not produce.
    (ii) NOT `inconclusive`. The proves-too-much control did not fire (10 of 10
    known-false objects returned the required FAIL); a = 1/16 PASSES 5/5 with
    BOTH implementations agreeing on the verdict AND on all five per-seed signs;
    it survived a 20-seed extension (20/20 seeds positive, 15504/15504 draws
    PASS) and a halving-loss null the Red Team built and ran. That is a real,
    gate-cleared, control-survived measurement. Reading it as inconclusive would
    be premature closure, which docs/inventor-protocol.md treats as a failure
    mode SYMMETRIC WITH OVERCLAIMING -- and the Red Team, which attacked the
    result on four independent routes, explicitly does not recommend closing
    this lane and says a negative reading would be exactly that.
    (iii) NOT `weaken` and NOT `reject_scoped`. Nothing in this round weakens
    H-ECDLP-37dc01. No refutation artifact is owed and none is claimed; the
    `reject_scoped`-on-a-single-unreplicated-empirical-run prohibition is not
    reached because no rejection is proposed.
    (iv) `replicate` IS THE PRECISE VERB. What the round is missing is exactly
    replication by an implementation that is genuinely independent of
    source_v2/instrument.py: that single successor discharges R3, adjudicates
    the a = 1/8 sign disagreement between two implementations neither of which
    has been shown wrong, and -- carried in the same contract -- runs the T-sweep
    that tests the obstruction's asset reading. `replicate` names the next
    action rather than describing a mood about the result.

