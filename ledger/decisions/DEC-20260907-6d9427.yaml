    checked_before_interpreting: true
    expected_run_count: 11
    observed_completed_valid: 11
    completed_invalid: 0
    failed_infrastructure: 0
    manifests_schema_complete: "yes -- every manifest carries command, git commit, dirty-tree state, environment and dependency versions, all four seed streams, requested policy, backend, resolved model identifier, model_verified, reasoning effort, fallback_used, validity status and reason, timestamps, wall clock and peak RSS. Independently re-checked by the Validator."
