  # =====================================================================
  # 2. THE PER-JOINT COMPOSITION -- JOINTS ARE COMPOSED, NOT AVERAGED
  # =====================================================================
  joint_composition:
    principle: >-
      Each reviewer owned three joints and was blind to the other three, so
      neither could form a whole-claim verdict and neither did. A joint reported
      `breaks` is NOT outvoted by joints that hold. Below, each break is named
      together with what it breaks and what follows from it.
    J1_predicate_fidelity:
      owner: TASK-20260907-b2a8ad
      verdict: holds
      what_it_establishes: "source_v3/g3_predicate.py faithfully implements the amendment's Section 3, and the pool-evidence-only invariant holds AS INFORMATION FLOW -- audited clause by clause."
      sub_findings_carried_forward:
        F1: "The invariant is NOT ENFORCED BY CONSTRUCTION: `basins` is lexically in scope inside measure_cell and `_assert_evidence_only` is a length check. J1 still holds -- the flow was audited -- but the code does not make a violation impossible, and reading true basin size in the SELECTION path is a NAMED INVALIDATION RULE of this very amendment (it is the confound the 6ac801 a = 1/8 disagreement traced to). Carried as EV-ECDLP-6a4ebc UC-3."
        F2: "THE AMENDMENT'S TIE-BREAK CLAIM IS FALSE AS WRITTEN. It asserts w(d) ties are measure-zero; the Validator measured 75-85% of pool entries TIED, with ties STRADDLING THE SELECTION CUT. The conclusion nonetheless survives because 64 alternative tie-break streams flipped NO SIGN -- i.e. BY MEASURED HEADROOM, NOT BY THE ARGUMENT THE CONTRACT GAVE. That distinction is the finding. Carried as EV-ECDLP-6a4ebc UC-4; a successor amendment must correct the text."
    J2_blind_rederivation:
      owner: TASK-20260907-b2a8ad
      verdict: breaks
      what_it_breaks: >-
        The frozen agreement_criterion is explicit -- "Verdict and per-seed SIGN,
        never magnitude ... A verdict difference or a per-seed sign difference is
        a break" -- and its breaking_artifact names "a sealed per-seed margin
        SIGN differing at any of the ten (a, seed) pairs". ONE DOES: a = 1/8,
        seed 2, validator -0.002952278 against producer +0.005128205. It is not
        explained away here, because the plan's own constraint says not to.
      what_follows: >-
        The a = 1/8 PASS IS NOT ROBUST TO THE INSTRUMENT FAMILY, while the
        a = 1/16 PASS IS. Both readings still return G3 PASS at both a under the
        frozen >= 4-of-5 rule (validator 4/5, producer 5/5), so the VERDICT is
        not overturned -- but the validator's reading is the LESS FAVOURABLE one
        and its a = 1/8 seed-3 margin is +0.000260115, leaving the cell almost no
        headroom under a differently-drawn instrument. a = 1/8's honest label is
        RESOLVED AS TO ROOT CAUSE (the missing weight formula WAS the cause of
        the 6ac801 disagreement: this implementation returns 4/5, not the old
        1/5) AND MARGINAL AS TO VERDICT.
    J3_replication_anchor:
      owner: TASK-20260907-b2a8ad
      verdict: holds
      what_it_establishes: "STAGE 3A reproduces the committed N = 2^20 a-scan BITWISE -- 20 of 20 rows, maximum absolute difference exactly 0.0 -- with both sides read from run records rather than from the producer's own comparison table. R4 is discharged and the instrument-discrepancy invalidation rule is not triggered."
      what_it_cannot_establish: "ANYTHING ABOUT CORRECTNESS. source_v3/g3_predicate.py and source_v2/run_ascan.py import the same frozen source_v2/instrument.py, so bitwise agreement is FORCED. The Validator states this itself and declines to read it as corroboration. This Coordinator adopts that limit."
    J4_proves_too_much:
      owner: TASK-20260907-ee1ca7
      verdict: holds
      what_it_establishes: "The control PASSED and could not be made to fire on the frozen draw. 10 of 10 known-false objects returned the required G3 FAIL; the interpretation stopping condition was NOT engaged."
      material_limitation_measured_and_then_closed: >-
        The Section 6 set is WEAK: it detects a uniform additive upward bias only
        once that bias reaches 0.017737, while 0.005128 already manufactures the
        a = 1/8 PASS -- a BLIND BAND 2.46x THE PASS HEADROOM. (At a = 1/16 the
        band is [0.017437577, 0.017736971], width 0.000299394, just 1.7% of that
        cell's headroom: almost fully protected.) The Red Team then BUILT AND RAN
        a stronger object, NULL_T, firing at bias 0.000869 -- 5.9x SMALLER than
        the manufacturing bias -- under which BOTH blind bands are EMPTY. The
        claim survives a control materially stronger than the one the contract
        froze.
      open_objection_O2_adopted_by_this_decision: >-
        a = 3/16 at r = 2, N = 2^24 IS NOT DECISIVELY KNOWN-FALSE AT FIVE SEEDS.
        Over 20 seeds, 4 have margin >= 0; over all C(20,5) = 15504 five-seed
        draws, 16 return G3 PASS -- A MEASURED TYPE-I ERROR RATE OF 1.03e-3. The
        frozen draw's m(4) is -0.017737 but the MEDIAN draw's m(4) is -0.008719,
        so the contract froze a draw roughly TWICE as favourable to the control
        as a typical one. THIS IS A MEASUREMENT OF THE CONTROL'S TYPE-I ERROR AND
        NOT A FIRING: the frozen draw is governing and it returned 0/5, and the
        16 draws were found by MAXIMISING over 15504, which at a 1.0e-3 rate is
        exactly what one expects. CONSEQUENCE THIS DECISION DRAWS: no later
        reading may treat "a = 3/16 FAILS 0/5" as a SHARP SEPARATOR between
        feasible and infeasible a. The bias model's own stated limit also binds:
        a uniform additive bias is ONE model, and a bias varying with a is not
        covered by this analysis.
      what_survives_unchanged: "a = 1/4 returns 0 of 20 seeds positive and 0 of 15504 draws PASS. EV-ECDLP-60e266's standing obstruction is CORROBORATED at four times the seed count -- neither reopened nor weakened."
    J5_nulls_and_decay:
      owner: TASK-20260907-ee1ca7
      verdict: holds
      corrections_to_how_the_controls_had_been_read:
        NULL_A_scope: "THE 0.32-0.36 NULL RATIO IS THE a = 1/16 ROW ONLY. At a = 1/8 -- the load-bearing new cell -- it is 0.0651 at 2^20 and 0.0888 at 2^24, FOUR TO FIVE TIMES LOWER. NULL_A also tests only 'is w(d) better than an information-free selection', a LOW BAR, and is NOT a null for the SIGN of the margin."
        DECAY_power: "Decay destroys the sign (40/40 monotone, 0 failures) but ITS POWER IS WEAK: pools NEST and TopShare(T_sel) is BITWISE IDENTICAL across r, so r acts only on the comparator and monotonicity is close to STRUCTURALLY FORCED."
        NULL_B: "A GENUINE INVARIANCE -- I.numpy_select (a three-line numpy lexsort) and I.CountedSelector.select (a hand-written streaming selection) are materially different implementations and agree on 120/120 rows. Its scope is narrow: it cannot detect a SHARED CONCEPTUAL error."
      structural_gap_found_and_closed: >-
        Writing margin = ESTIMATOR loss - HALVING loss, ALL THREE DECLARED
        CONTROLS ACT ON THE ESTIMATOR LOSS AND NONE TOUCHES THE HALVING LOSS --
        which is what carries the a-dependence the claim is about. The Red Team
        built NULL_T to close it (replace only the basin SIZES with a uniform
        multinomial allocation of the measured mass, preserving rank order; null
        stream seed 900, prediction declared before running). NULL_T returns 0/5
        everywhere and the margin collapses +0.020565 -> -0.000626 at a = 1/16
        and +0.006933 -> -0.000869 at a = 1/8, with the halving loss collapsing
        0.0659 -> 0.00069 and 0.0922 -> 0.00092. ATTRIBUTION: BASIN-SIZE TAIL
        CONCENTRATION is what produces the PASS. The Red Team's own honest limit
        is adopted: the NULL_T FAIL is close to structurally forced, so its value
        is ATTRIBUTION, NOT DISCRIMINATION.
    J6_cost_scope_and_what_a_pass_licenses:
      owner: TASK-20260907-ee1ca7
      verdict: breaks
      what_it_breaks: >-
        THE FROZEN AMENDMENT'S RESIDUAL R3 -- NOT ANYTHING THE EXECUTOR DID. R3
        claims STAGE 3B has a different experiment identifier, a different
        random-function family, AND a different basin-closure implementation from
        either 6ac801 arm. EXACTLY ONE OF THE THREE IS TRUE (the identifier).
        Section 3 REQUIRES STAGE 3B to import source_v2/instrument.py unchanged,
        and EV-ECDLP-2e9680 records 6ac801's production arm reusing that same
        module -- experiments/EXP-ECDLP-6ac801/source/run_stageb.py puts
        source_v2/ on sys.path and does `import instrument as I`.
      what_follows: "R3 IS NOT DISCHARGED AND CANNOT BE DISCHARGED BY ANYTHING ALREADY IN THIS BATCH. The batch delivers R1, R2, R4 and R5 and does not deliver R3."
      pareto_and_cost_findings_adopted:
        dominated_by: "the Red Team did NOT write `dominated_by: null`. It recorded `not_applicable_stated_rather_than_null`, because THIS BATCH PRODUCES NO POINT ON THE ACHIEVABLE FRONTIER AT ALL: TopShare(T_sel) is an ORACLE and zero online arms ran. Frontier rows were checked explicitly rather than waved past."
        sota_delta: "0.000 on every achievable axis."
        ceiling_comparison: "judged AS A CEILING, a = 1/16 is 19.2% BELOW the ATTAINED a = 1/4 static table per unit walk length and 4.6% below per unit precomputation. It wins exactly ONE axis -- advice size -- by exactly 2x."
        largest_uncharged_cost: "finding the T_sel table requires EXACT BASINS: Theta(N) time and Theta(N) memory, i.e. Theta(2^256) at cryptographic scale -- WORSE THAN THE INSTANCE IT WOULD HELP SOLVE. Also uncharged: the online batch size U entirely, and inverse success probability implicitly set to 1."
    the_load_bearing_consequence_of_composing_them: >-
      READ THE TWO BREAKS TOGETHER, BECAUSE THEIR CONJUNCTION IS THE RESULT OF
      THIS BATCH. J6 establishes that STAGE 3B reduces to the same frozen
      instrument as the prior lane's production arm; J3 establishes that STAGE 3A
      does too. THEREFORE VALIDATOR J2 IS THE ONLY INDEPENDENT READING OF THESE
      CELLS IN THE ENTIRE ROUND -- and it is the reading that disagrees at
      a = 1/8, seed 2, with only +0.00026 of headroom at seed 3. Every strength
      and status judgement in this decision follows from that single sentence.
    convergence_that_is_real_corroboration: >-
      BOTH REVIEWERS REACHED THE R3 / STAGE-3B-INDEPENDENCE FINDING SEPARATELY.
      The Red Team reached it as its owned joint J6; the Validator reached it
      from its own J2 and J3 and DECLARED ADDRESSING IT AS A PROCEDURE DEVIATION
      because no frozen joint owned it. Both attest read_sibling_reports: false
      and blindness.lifted_for is [] on both sides. Mutual blindness makes that
      convergence corroboration rather than an echo, and it is the single
      strongest structural finding of the round.

  # =====================================================================
  # 3. ADJUDICATION OF THE PRE-RECORDED COORDINATOR PRIOR
  # =====================================================================
  prior_adjudication:
    where_the_prior_is_recorded: "ledger/handoffs/TASK-20260907-b2a8ad.yaml, review_plan.coordinator_prior -- written before any reviewer ran and before any other line of that plan."
    why_this_block_exists: >-
      AGENTS.md "Review architecture": "Three reviewers concurred" and "three
      reviewers concurred with what the Coordinator already believed" are
      different findings, and only a pre-recorded prior separates them. A prior
      the review overturns is one of the most informative results this program
      can produce and is unrecoverable if written afterwards. It is adjudicated
      here expectation by expectation, including where it was wrong.
    expectations:
      - id: P1
        expectation: "a = 1/16 to pass 5/5 at (N = 2^24, r = 2, T_sel = T/2)."
        outcome: CONFIRMED
        detail: "Producer 5/5 (margins +0.028603315, +0.023278654, +0.013718963, +0.017437577, +0.019787014). Validator J2's independent sealed re-derivation also 5/5, agreeing on the verdict AND on all five per-seed signs. Corroborated further by the Red Team's 20-seed extension: 20/20 seeds positive, 15504/15504 draws PASS."
        caveat_the_prior_did_not_carry: "the agreement is WEAK CORROBORATION, not strong, because J2's independence is CODE-independence and not EXPECTATION-independence -- the re-deriver had necessarily read the amendment, which quotes the prior lane's per-seed margins (contamination C1), and its own dispatching instruction carried producer-outcome information (contamination C2, which the plan did not anticipate)."
      - id: P2
        expectation: "a = 1/8 to pass at 4/5 or 5/5, because the prior attributed the 6ac801 sealed-level disagreement ENTIRELY to the missing weight formula that Section 3 now writes down."
        outcome: CONFIRMED AT VERDICT LEVEL, PARTIALLY OVERTURNED AT THE LEVEL THAT MATTERS
        detail: >-
          The verdict prediction was right: producer 5/5, validator 4/5, both
          inside the predicted band. The ATTRIBUTION was also substantially
          right: the fresh re-seal under the explicit w(d) formula returns 4/5,
          not the old blind 1/5, so the missing weight formula WAS the root cause
          of the 6ac801 disagreement. BUT THE PRIOR EXPECTED THE RE-SEAL TO
          "REPRODUCE PRODUCTION RATHER THAN THE OLD BLIND READING", AND IT DID
          NOT CLEANLY DO SO. It disagrees on the SIGN at seed 2 and leaves
          +0.000260115 of headroom at seed 3. The prior's own named
          strongest-signal-against-itself was "a fresh sealed blind re-derivation
          at a = 1/8 that AGAIN comes out infeasible". That did not happen at
          verdict level -- but a SEALED NEGATIVE DRAW at the same cell is a
          partial materialisation of it, and this decision reports it as such
          rather than banking the verdict and dropping the sign.
        correction_to_how_this_row_reads: >-
          TWO REFINEMENTS, BOTH RECORDED RATHER THAN ABSORBED, AND NEITHER
          CHANGES THIS ROW'S OUTCOME LABEL. (i) "DETERMINATE ... OPPOSITE
          PER-SEED SIGN" WAS TOO STRONG A WORDING and is corrected here: the
          instrument family is the implementer's choice under Section 3's
          reading P2, so the two "seed 2"s index different draws and the
          comparison is distributional, not seed-paired
          (EV-ECDLP-6a4ebc `j2_seed_pairing_caveat`). What is determinate is the
          Validator's own sealed sample, not a contradiction of a shared number.
          (ii) A SECOND INDEPENDENT READING FOUND ON origin/main AT ARCHIVE TIME
          (EV-ECDLP-6783b8) ALSO RETURNS 4/5 AT THIS CELL, which pushes P2
          further toward CONFIRMED at verdict level while leaving the
          "reproduce production cleanly" half exactly as overturned as it was --
          neither independent implementation returns 5/5.
      - id: P3
        expectation: "STAGE 3A to reproduce the committed a-scan margins essentially exactly -- to floating-point tolerance, not merely within CI."
        outcome: CONFIRMED, AND MORE EXACTLY THAN PREDICTED
        detail: "BITWISE identical, 20 of 20 rows, maximum absolute difference exactly 0.0. The prior's THIRD-and-least-likely break (an instrument discrepancy making STAGE 3B uninterpretable) DID NOT OCCUR."
        what_the_prior_did_not_foresee: "that this exactness would turn out to be STRUCTURALLY FORCED by a shared import and therefore worth nothing as corroboration. The prior treated STAGE 3A as an anchor; it is one, for wiring -- and only for wiring."
      - id: P4
        expectation: "DECAY_G3 to hold with 0/5 at r = 4 and r = 8 at every a."
        outcome: CONFIRMED
        detail: "0/5 at r = 4 and r = 8 at every a and both N; 40/40 per-seed rows monotone non-increasing AND strictly decreasing in r; 0 rows failing monotonicity; the non-decay invalidation rule was not triggered."
        caveat_the_prior_did_not_carry: "THE CONTROL'S POWER IS WEAK. Pools nest and TopShare(T_sel) is bitwise identical across r, so r acts only on the comparator and monotonicity is close to structurally forced. 40/40 is a weaker result than the count suggests, and the prior read it as stronger than it is."
      - id: P5
        expectation: "the proves-too-much objects a = 3/16 and a = 1/4 to FAIL."
        outcome: CONFIRMED
        detail: "Both FAIL. 10 of 10 known-false objects returned the required G3 FAIL; the interpretation stopping condition was NOT engaged; a = 3/16 at r = 2, N = 2^24 is 0/5 and a = 1/4 is 0/5."
      - id: P6
        expectation: "FIRST AND MOST LIKELY BREAK: a = 3/16 IS THIN, and if STAGE 3B returned it at 4/5 the control would have FIRED and every PASS in the batch would be uninterpretable."
        outcome: THE FEARED FIRING DID NOT HAPPEN; THE UNDERLYING WORRY WAS VINDICATED AND MADE QUANTITATIVE
        detail: >-
          a = 3/16 returned 0/5, not 4/5, so nothing became uninterpretable. But
          the prior's instinct that the cell was THIN was CORRECT and the Red
          Team converted it from an instinct into a NUMBER the prior could not
          have known: over 20 seeds 4 are positive, over 15504 five-seed draws
          16 return G3 PASS, a measured type-I error rate of 1.03e-3, and the
          frozen draw was roughly twice as favourable to the control as the
          median draw. The prior said it would "rather have that outcome than my
          prior"; what it got is the finer-grained version -- the control did not
          fire, and it is now known HOW OFTEN IT WOULD.
      - id: P7
        expectation: "SECOND: NULL_A_G3 IS THE CONTROL I AM LEAST ABLE TO PREDICT. Expected margin_null COMFORTABLY ABOVE margin. If margin_null sat CLOSE TO margin at a = 1/16 and a = 1/8, w(d) would carry little information at small a and a PASS would be a statement about a degenerate comparator -- and the prior committed IN ADVANCE that it would then NOT read a PASS as support."
        outcome: CONFIRMED ON ITS OWN TERMS, BUT THE PRIOR ASKED THE WRONG QUESTION
        detail: >-
          margin_null exceeded margin in 120 of 120 rows, with ratios 0.3599
          (a = 1/16, 2^24) and 0.0888 (a = 1/8, 2^24) -- margin_null is
          comfortably above margin, so the pre-registered failure condition did
          NOT trigger and the prior's stated commitment is not engaged. THE
          PRIOR'S ERROR IS ELSEWHERE AND THE RED TEAM FOUND IT: NULL_A TESTS ONLY
          "IS w(d) BETTER THAN AN INFORMATION-FREE SELECTION", WHICH IS A LOW
          BAR, AND IS NOT A NULL FOR THE SIGN OF THE MARGIN. Passing it was
          therefore never going to license what the prior wanted to read from it.
          A second correction the prior would have got wrong: the 0.32-0.36 band
          is THE a = 1/16 ROW ONLY; the load-bearing a = 1/8 cell sits four to
          five times lower.
      - id: P8
        expectation: "IMPLICIT AND UNSTATED, but load-bearing throughout the plan: that this batch WOULD supply the third independent angle R3 asks for -- the plan says so in the amendment's own words, 'a different experiment identifier, a different random-function family, a different basin-closure implementation'."
        outcome: OVERTURNED
        detail: >-
          THIS IS THE PRIOR'S LARGEST ERROR AND IT WAS NEVER ON ITS OWN LIST OF
          WAYS IT COULD BREAK. EXACTLY ONE OF THE THREE CLAIMED DIFFERENCES IS
          TRUE. Section 3 of the amendment REQUIRES STAGE 3B to import
          source_v2/instrument.py unchanged, which is the same module
          EV-ECDLP-2e9680 records 6ac801's production arm reusing. Two mutually
          blind reviewers reached this independently. The Executor flagged the
