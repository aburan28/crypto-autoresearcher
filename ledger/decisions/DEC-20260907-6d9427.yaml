  # =====================================================================
  # 10. RATIONALE, LIMITATIONS, NEXT ACTIONS
  # =====================================================================
  rationale:
    - "THE RUN SET IS VALID BEFORE ANYTHING IS INTERPRETED: 11 of 11 completed_valid, zero infrastructure failures, schema-complete manifests, seed integrity intact, 800 raw-vs-summary fields agreeing, all 120 margin/g3 cells and all 24 verdict rows independently recomputed by the Validator with zero mismatches, and one run reproduced byte-identically."
    - "THE PROVES-TOO-MUCH CONTROL DID NOT FIRE. 10 of 10 known-false objects returned the required G3 FAIL and the amendment's interpretation stopping condition was NOT engaged, so this batch's PASSes may be discussed at all. That gate is checked first and reported first, per the amendment's own ordering discipline."
    - "a = 1/16 AT r = 2, N = 2^24 IS THE ROUND'S SOLID RESULT: PASS 5/5, verdict and all five per-seed signs agreed by an independently written implementation, survived a proves-too-much control leaving a blind band 1.7% of the PASS headroom, survived a 20-seed extension at 20/20 and 15504/15504, and collapsed under a halving-loss null exactly as the stated mechanism predicts."
    - "a = 1/8 IS MARGINAL AND MUST NOT BE QUOTED BESIDE IT. The round's only independent reading returns 4/5, with one draw at -0.002952 and the next smallest at +0.00026, against the production arm's 5/5; the Red Team independently measured the cell as roughly FOUR TIMES less robust than a = 1/16 on two unrelated statistics (headroom 0.005128 vs 0.017438; NULL_A ratio 0.0888 vs 0.3599). Two mutually blind reviewers converging on 'a = 1/8 is much weaker than a = 1/16' from different measurements is itself a finding."
    - "R3 IS NOT DISCHARGED AND THIS IS WHAT DECIDES THE VERB. STAGE 3A and STAGE 3B both reduce to the same frozen instrument, so within this batch J2 is the only independent reading of these cells -- and it is the one that dissents at a draw. THIS BATCH SUPPLIED NO THIRD ANGLE AND WAS SCOPED TO. A concurrent lane on origin/main did supply an independent reading of the a = 1/8 cell (EV-ECDLP-6783b8), discovered at archive time and recorded under `cross_lane_state_discovered_at_archive_time`; it corroborates the verdict but is ANOTHER CONTRACT'S deliverable and does not discharge this one's."
    - "THE EFFECT IS NOW ATTRIBUTED, WHICH IS A GENUINE ADVANCE. The Red Team's NULL_T localises the PASS to BASIN-SIZE TAIL CONCENTRATION, and in doing so exposes that all three declared controls act on the estimator loss while none touches the halving loss -- the quantity carrying the a-dependence the claim is about."
    - "THE STANDING OBSTRUCTION IS CORROBORATED, NOT ERODED. a = 1/4 returns 0/20 seeds and 0/15504 draws, strengthening EV-ECDLP-60e266 at four times the seed count."
    - "PREMATURE CLOSURE IS REFUSED EXPLICITLY. The Red Team, which attacked the measured claim on four independent routes and could not break it, states that a negative reading of this batch would be premature closure. This decision agrees: the lane stays open and the verb names what is missing rather than pretending the round produced less than it did."
    - "AND OVERCLAIMING IS REFUSED SYMMETRICALLY. No hypothesis status moves, no KN-FIND is promoted, no asymptotic gate is invoked, and clause (C1) is reopened for RESTATEMENT AND TESTING at a = 1/16 -- never asserted."

  limitations:
    - "TESTED CELLS ONLY, claim tier TOY: frozen v2 splitmix64 keyed-random-function instrument with an independently keyed DP predicate, exact basins, N in {2^20, 2^24}, T in {64, 256}, T_sel = floor(T/2), a in {1/16, 1/8, 3/16, 1/4}, r in {2, 4, 8}, seeds {1..5}. No curve, no cryptographic N, no exponent."
    - "A CEILING, NOT A MECHANISM. Zero online arms ran. TopShare(T_sel) is an ORACLE requiring exact basin sizes. Nothing here says any online re-selection procedure attains the ceiling at any batch size U."
    - "NO POINT ON THE ACHIEVABLE FRONTIER IS PRODUCED. sota_delta 0.000 on every achievable axis; as a ceiling, a = 1/16 is 19.2% below the attained a = 1/4 static table per unit walk length and 4.6% below per unit precomputation, winning only advice size and only by 2x."
    - "THE LARGEST COST IS UNCHARGED AND FATAL AT SCALE AS THINGS STAND: exact basins are Theta(N) time and memory, Theta(2^256) at cryptographic scale -- worse than the instance the table would help solve. U is uncharged entirely and inverse success probability is implicitly 1."
    - "TWO POINTS ARE NOT A TREND. The N-dependence evidence is two points (pooled a = 1/8 margin +0.004724 at 2^20, +0.006933 at 2^24) and the estimator-loss flatness underpinning any transfer is measured at exactly two T values. Neither is read as a trend here."
    - "J2's INDEPENDENCE IS CODE-INDEPENDENCE, NOT EXPECTATION-INDEPENDENCE (contaminations C1, C2, C3). The a = 1/16 agreement is weak corroboration; the a = 1/8 divergence, produced against the pull of a known all-positive target, is the informative part."
    - "DECAY_G3 AND NULL_A ARE WEAKER CONTROLS THAN THEIR COUNTS SUGGEST -- decay because monotonicity is close to structurally forced, NULL_A because it tests a low bar and is not a null for the sign of the margin. NULL_T's FAIL is also close to structurally forced and is valuable for attribution, not discrimination."
    - "THE 1.03e-3 TYPE-I RATE, NULL_T AND THE BLIND-BAND ANALYSIS COME FROM RED-TEAM DIAGNOSTIC CODE, not from run records. They are archived by this decision so they are checkable, and they remain diagnostics: none is a declared control of the frozen contract."
    - "THE REVIEW TIER IS PROBE-UNVERIFIED. review-breakthrough / max was requested and dispatched in independent sessions with fallback_used false, but no adapter probe confirming the backend served it is on record for this round."
    - "THIS COORDINATOR PRODUCED NO MEASUREMENT. Every margin, verdict, control outcome and cost figure in this decision is read from a committed artifact -- the producer's execution report and run records, or one of the two reviewer reports -- and none was computed here. What this Coordinator did run is VERIFICATION ONLY, and only three things (PD-7): validate_ledger.py, check_review_independence.py, and the J2 seal digest/mtime check of PD-3. allocate_id.py --check and every git operation remain the driving session's, and the ledger receipt records which of them returned what."

