      of a realistically-selected T-entry table. If it does not, an S1/F1 claim at
      that cell is UNTESTABLE BEFORE ANY ALGORITHM RUNS (v2's frozen invalidation
      rule); if it does, the cell is merely NOT BLOCKED. On the tested cells the
      blocker is REMOVED at a = 1/16 (robustly) and MARGINALLY removed at a = 1/8
      (with a live sign disagreement), and it is CONFIRMED PRESENT at a = 3/16
