coordinator_decision:
  id: DEC-20260802-9bda5c
  id_remap_note: >-
    AUTHORED AS DEC-20260802-9bda5c AND REISSUED. The merge of origin/main at
    7c3cce2c brought main's own DEC-20260802-9bda5c, the GOAL-HAWK-001 BATCH-001
    close. Main published that identifier first, so under
    first-author-owns-the-ID it keeps it and this record is reissued under a
    random 6-hex suffix. Content is unchanged apart from the identifier.
    THIS IS THE FOURTH ID COLLISION THIS CAMPAIGN HAS HIT WITH MAIN, and it is
    the one that shows the fix is incomplete rather than absent. main #106
    replaced max+1 allocation with random 6-hex tokens minted through
    tools/allocate_id.py, which is the right repair. But the HAWK records were
    authored BEFORE that landed and still spent sequential ids, so they
    collided anyway. A allocator repair only takes effect for records minted
    after it; in-flight work authored against the old rule keeps colliding
    until it drains. See KN-FIND-030.
  context: >-
    GOAL-AES-003 BATCH-001 close. The batch built, ran and certified reduced-round
    AES attacks and distinguishers, then passed the package through an independent
    validator (TASK-20260802-907) and an independent red team (TASK-20260802-908)
    against the snapshot archived at 54ee869b. This decision rules on what the
    batch established, at what tier, and what happens next.
    THE BATCH RAN OUT OF ORDER AND THAT IS RECORDED, NOT HIDDEN. The producer
    artifacts were written and committed in ad-hoc commits before this batch had
    a dispatch queue or a snapshot archive. The queue and receipts bind them by
    hash after the fact. The cost is stated plainly in the snapshot receipt: for
    this batch the guarantee that a producer cannot revise artifacts after seeing
    a review rests on Git history rather than on the archive.
  decision: support
  target_ids:
    - GOAL-AES-003
    - RQ-AES-003
    - EV-AES-005
  evidence_refs:
    - EV-AES-005
    - CORR-20260802-003
    - CORR-20260802-007

  rationale:
    - >-
      RULING 1. RQ-AES-003 TARGET (a) IS MET AT r=5 AND ONLY AT r=5. A certified
      single-key AES-128 key recovery over the full unrestricted key space, cost
      MEASURED at 25.66 s, below the DEFINITIONAL exhaustive-search reference.
      The certificate was re-verified by a validator session on a key it generated
      itself, under an AES it wrote from FIPS-197 in-session sharing no code with
      the attack. The red team's audit of omitted end-to-end terms -- plaintext
      generation, memory traffic, the certificate check, CPU-vs-wall, and oracle
      transport charged at zero -- was accepted in full and the comparison still
      holds by roughly 28 orders of magnitude. Strength `replicated`, tier `toy`.
    - >-
      RULING 2. THE HIGHEST-VALUE CHECK IN THE BATCH WAS RUN AND THE RESULT
      SURVIVED IT. The batch's strongest structural claim would have collapsed
      entirely if the mod-8 residue were a counting artifact holding for any
      permutation. That hypothesis was tested directly and refuted
      deterministically by five independent null readings, including two
      random-permutation surrogates reading 4 and 4. A forced property reads 0
      with probability 1, so a single non-zero null refutes forcing outright. The
      result is not an artifact.
    - >-
      RULING 3, AND IT IS THE MOST CONSEQUENTIAL IN THIS DECISION. THE r=4 AND
      r=5 PROPERTIES ARE NOT AES-SPECIFIC, AND EVERY FUTURE DESCRIPTION OF THEM
      MUST SAY SO. They follow from round geometry alone -- any bijective S-box,
      any column-preserving mixing layer with no zero in the relevant entries,
      ShiftRows-style rotations, a full diagonal coset. The validator confirmed
      this BY EXECUTION: uniformly random bijective S-boxes reproduce both
      properties at 120/120 and 120/120 in its scaled analogue. The mandated
      description is "a derived deterministic property of any 5-round AES-SHAPED
      SPN, instantiated here on AES-128". These properties distinguish 5-round
      AES from a random permutation but carry NO information about the AES S-box.
      This is a RELABELLING, not a weakening: OBS-1 through OBS-4 stand exactly
      as measured. It was the single largest scoping gap in the package and no
      producer artifact stated it.
    - >-
      RULING 4. THE 4-ROUND LADDER AND THE 4-ROUND BIJECTION ARE ONE RESULT, NOT
      TWO. The validator proved the entailment: the ladder's plaintext set is a
      subset of the same coset and its ciphertext word is the same
      inverse-ShiftRows diagonal, so injectivity on the full coset forces zero
      collisions on every subset. The red team independently flagged the
      double-counting risk. Counting them separately in any summary is
      prohibited.
    - >-
      RULING 5. THE RED TEAM FOUND TWO REAL DEFECTS IN THE COORDINATOR'S OWN
      RECEIPTS AND BOTH ARE SUSTAINED. CORR-20260802-007 records that the r=5
      receipt was wrong in BOTH directions: it cited a 1-in-8 coincidence figure
      correct for one trial but not for six full-coset arms, understating the
      evidence, and it listed a random-permutation null under `controls_NOT_run`
      when that null had in fact been run. CORR-20260802-003 records that the r=6
      receipt read one of two artifacts and reported the one that failed.
      AN ERROR THAT UNDERSTATES EVIDENCE IS THE SAME CLASS OF DEFECT AS ONE THAT
      OVERSTATES IT, and a false claim that a control was not run is exactly the
      kind of statement a later batch would act on. Both receipts are immutable
      and were not edited.
    - >-
      RULING 6. TWO RED TEAM FINDINGS ARE ADJUDICATED NOT SUSTAINED, AND THE
      REASONS ARE RECORDED IN THE SAME DETAIL AS THE SUSTAINED ONES.
      (a) The claim that mode_attack7 reports as recovered four bytes it computed
      from its own input is NOT SUSTAINED. Read at sq.c:584-591, the reported
      bytes come from a candidate-survival search over the fold table; the true
      values are read separately for scoring only; and the program prints its own
      note "NOT a key recovery: K7 was given as input". The validator
      independently reached the same conclusion for attack5 by a different route,
      observing that survivor counts collapse to all-ones only after the second
      structure, which an echo cannot produce. What IS sustained from the same
      finding is that no WRONG-HINT null exists anywhere in the batch, so
      "isolates the correct byte" is not yet separated from "isolates a byte".
      (b) The claim that INDEPENDENT-VERIFICATION.json dismisses the result by
      recollection is NOT SUSTAINED. The quoted fragment omits the clause that
      follows it: the full sentence invokes DEC-20260731-019 ruling 3 by name and
      records the point as unadjudicable rather than as either promotion or
      dismissal. That is the compliant form, not a breach of it.
      A red team that overstates is corrected on the record exactly as a producer
      that overstates is. Neither correction reduces the standing of the rest of
      its report, which was accurate and which found defects nobody else did.
    - >-
      RULING 7. THE INSTRUMENT RISK IS CLOSED; THE PROTOCOL DEVIATION IS NOT.
      The validator found that after the void r=3 control, every surviving
      producer PR-A control predicted ZERO, so the instrument was never shown able
      to produce a correct large non-zero count -- a systematic undercount would
      have passed both. It then closed the gap itself, supplying both missing
      exact controls on its own implementation and matching the pre-registered
      predictions 9223372034707292160 and 36028794871480320 to the digit. The
      DEVIATION stands separately and is not repaired by that: VOID condition V1
      required execution to STOP when a PR-A control failed, and execution did not
      stop. Recorded against the protocol, not against the data.
    - >-
      RULING 8. THE 6-ROUND RECOVERY IS A NEGATIVE RESULT ABOUT ITS CONSTRUCTION
      AND IS LOGGED AS ONE. It works, under 12 hint bytes, at 69.39 s against
      roughly 25 s for exhaustive search over the same restricted residual.
      dominated_by: exhaustive search over the hinted residual. sota_delta:
      NEGATIVE. Per docs/inventor-protocol.md Pareto honesty it may never appear
      in a list of successes without that clause. The r=7 run is not a key
      recovery at all and carries no certificate.
    - >-
      RULING 9. THE YOYO OBJECTS ARE UNVALIDATED AND ARE NOT PROMOTED. The
      validator exhausted its budget before re-executing them and instructed
      explicitly that C11 not be treated as validated. Its read-only arithmetic
      check is consistent with the artifacts but is not replication. No claim in
      rulings 1-4 depends on them.
    - >-
      RULING 10. THE GOAL IS NOT CLOSED, AND THE BLOCKER IS NOT THE RESEARCH.
      RQ-AES-003 target (a) is met at r=5, which is a declared completion
      criterion. GOAL-AES-003 nevertheless stays `active`, because AGENTS.md
      rule 13 and CLAUDE.md rule 8 require three CONCUR attestations with
      pairwise-distinct resolved model IDs and this harness resolves every
      subagent to one model. The validator states this about itself unprompted:
      nothing in its report may count toward a quorum. A criterion met without
      the quorum does not close a goal. No attestation was obtained and none is
      recorded.

  limitations:
    - Toy tier. Nothing here is a statement about full-round or deployed AES.
    - >-
      No novelty assessment in either direction. No primary source is reachable
      from this environment, so a recollection may be used neither to promote nor
      to dismiss a result (DEC-20260731-019 ruling 3). This decision does not
      assert that any result here is new, and does not assert that any is known.
    - >-
      The comparison is to the DEFINITIONAL exhaustive-search reference only,
      which follows from key length and is checkable offline. It is not, and may
      not be presented as implying, a comparison to published cryptanalysis.
    - >-
      Replication is session-independent but NOT model-independent. Every session
      in this harness resolves to one model under standing basis 0137a051. That
      is why the strength is `replicated` and not `strong`.
    - >-
      The null residue distribution is not characterised; six readings refute
      forcing but cannot establish uniformity, and the validator declined to claim
      it.

  next_actions:
    - >-
      SINGLE NEXT ACTION: open GOAL-AES-003 BATCH-002 with the wrong-hint null as
      rank 1. It is the cheapest decisive measurement remaining and it tests the
      one thing neither reviewer could rule on: whether the hinted r=6 and r=7
      constructions isolate the CORRECT byte or merely A byte. Rank 2: three more
      random-permutation null arms at r=5 to characterise the null residue
      distribution rather than merely refute forcing. Rank 3: independent
      re-execution of the yoyo objects, which the validator named as the highest
      remaining value among the unvalidated. Rank 4: the non-singular
      zero-entry mixing-layer control, to test the derivation's stated dependence
      on the no-zero condition.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      DEFERRED TO BATCH-002, NOT REFUSED. The r=4/r=5 structural result is at
      `replicated` and is the strongest candidate this campaign has produced, so
      a KN-FIND entry is warranted on strength. It is deferred one batch for a
      substantive reason, not a procedural one: ruling 3 establishes that the
      correct subject of the finding is the AES-SHAPED SPN CLASS rather than
      AES-128, and the class boundary is not yet mapped -- the zero-entry
      mixing-layer control that would delimit it did not run because the
      validator's candidate matrix was singular. Promoting now would mint a
      durable entry whose title names the wrong object or whose scope is
      guessed. BATCH-002 rank 4 runs that control; the promotion follows it.
      This deferral is recorded with its evidence, its budget, its test boundary
      and its revisit condition as CLAUDE.md rule 9 requires.

  decided_by: coordinator
  decided_at: 2026-08-02
