  rationale:
    - >-
      The idea is an ECC-area open proposal at recommended_priority high whose
      positive outcome would be a first computational handle in a local-torsion
      cell and whose negative outcome is a measured obstruction; it claims no
      exponent move (target profile: stated honestly, not an exponent mover).
      Designing it is ranked work under the ECC-first rule. Its three exact
      identities make Stage 1 the best-calibrated gate set in the lane.
    - >-
      The protocol is complete: hypothesis has mechanism, predictions, test
      boundary, falsification, distinguishable outcomes, proof_search_map,
      derivation obligations, numbered heuristics with scheduled validation;
      experiment has pinned inputs, controls with pass criteria, metrics, seeds,
      budget, stopping and invalidation rules, success and falsification criteria,
      required artifacts. Standing authorization covers approval without
      per-idea user confirmation.
    - >-
      Proof-architecture gate (KN-TECH-080, coordinator contract): the idea
      proof_search_map was re-checked in coordination/design/TASK-20261002-70c7e2/
      proof-search-map-audit.yaml. The bottleneck is decision-changing, the
      baseline is reproduced as a fixture (trivial direction, anomalous panel),
      the quantifier order and method ceiling are explicit, and nearby-object and
      proves-too-much controls are specified before any tuning.
    - >-
      Three Coordinator findings are recorded and change no threshold: (1) the
      oddness delta(-P) = -delta(P) means the idea null is not parity matched, so
      Stage 2 must add an odd random-function null (bias of order sqrt(2) in
      spike ratio, hand derived, labelled); (2) the (C3) criterion needs the
      qualifier non-trivial direction (Sigma_triv = 0 although a_p = 1);
      (3) the idea minimal_test and falsification_conditions differ by a trend
      clause on the E-WHITE falsification rule, carried verbatim and flagged for
      an amendment before Stage 2.
    - >-
      Stage 0-1 are cheap (derivation plus minutes-to-hours of pure Python on
      toy curves) and decide whether the instrument is calibrated; Stage 2 is not
      approved because the census instrument is only a definition-level contract
      at the base commit and the null parity issue is open. Not approving Stage 2
      is a scheduling decision with a named successor, not a closure of the lead.
    - >-
      Pareto honesty: dominated_by n/a (no result claimed; frontier rows checked as
      listed); sota_delta zero on every axis; no exponent moves; any LEAD outcome
      is routed to independent review-breakthrough at max effort (AGENTS.md rule
      12) before any record states it.

