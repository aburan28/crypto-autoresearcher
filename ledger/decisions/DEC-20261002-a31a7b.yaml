    - (D) rests on two recalled inputs that no agent has opened; Belding (arXiv math/0703906) is known at abstract level only.
    - Instrument pins are literal (git blob id and sha256 for 12 files, computed by the dispatching session, byte-identical at bbaf753d0b and 612c321c08); the Executor re-records and compares before any gate. The Coordinator did not compute them itself (no shell).
    - Toy scale only (field_bits 10 to 16 at Stage 1); no transfer claim; claim_tier toy.
    - The census instrument is not implemented at the base commit; Stage 2 is not schedulable until it is.
    - goal_id is null because no GOAL-ECDLP-001 record exists on this tree.
    - A VOID or DEFERRED gate is never negative evidence about delta_KS.

