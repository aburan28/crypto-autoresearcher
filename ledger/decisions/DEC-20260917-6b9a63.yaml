  - >-
    THIS SESSION DID NOT RUN tools/check_review_independence.py ITSELF. The
    dispatching session ran it at base commit a9684369a and supplied the exit
    code and verbatim stdout quoted above; the Coordinator composed this record
    from that report and from committed artifacts. Recorded so a later reader
