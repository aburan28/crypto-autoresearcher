    from: analyzed
    to: superseded
    superseded_by: [H-QSP-3fe0ab, H-QSP-542cfa]
    basis: >-
      DEC-20260917-793ae2 decision_scope and NA-4. The record under review
      carried one hypothesis id over parts that the review round sent in
      opposite directions; `superseded` is the AGENTS.md state-line transition
      for a record replaced rather than promoted or knocked down.
    immutability: >-
      STATUS FIELD UPDATE ONLY, exactly as the first transition was. The text of
      H-QSP-5540d7 is not edited, so the seven substantive defects the round
      found in it -- (E)'s refuted stated reason, the missing n' < n clause, the
      degenerate case called an affine BINOMIAL of subfield/multiplicative type
      where for b != 0 it is an affine TRINOMIAL covered by neither cited
      result, the "over a field" wording where K must be finite, the r = 0
      vacuity stated only for the max form, the silently absorbed
      rational-lambda survivor, and H1's random_model_justification -- remain in
      the record as written and are repaired only in the superseding records. A
      status_history list is added so that moving status_changed_by to this
      decision does not erase DEC-20260917-793ae2's authorship of the first
      transition.
  - record: ledger/hypotheses/H-QSP-3fe0ab.yaml
    id: H-QSP-3fe0ab
    from: null
    to: analyzed
    basis: >-
      It inherits the state its parent reached and no more: EXP-QSP-33b442
      completed, passed the validity gate of CORR-20260917-8b80cc, and was
      reviewed by the round opened by TASK-20260917-43701b. `analyzed` is the
      honest position on the AGENTS.md state line.
    why_not_supported: >-
      TWO REASONS, EITHER SUFFICIENT, AND NEITHER IS A DOUBT ABOUT (A) OR (B).
      (i) AGENTS.md takes `replicate`, not `support`, on the first observation of
      a surprising or high-impact result, and PD-6 records that no independent
      replication invocation was spent. DEC-20260917-793ae2 judged that a fresh
      replication would buy nothing determinism does not already give -- Stages
      0, 1, 2, 3 and every control are exhaustive and seed-free, and the
      load-bearing n = 131 quantity was re-derived BLIND with exact agreement --
      and that judgement removes the case for dispatching `replicate`. IT DOES
      NOT MANUFACTURE THE CASE FOR `supported`.
      (ii) Promotion toward `supported` of an asymptotic or closure claim is not
      this record's job, BECAUSE THIS RECORD MAKES NO SUCH CLAIM: it claims no
      attack exponent, prices no algorithm and touches no curve. The four
      promotion gates of agents/coordinator.md govern asymptotic-complexity
      claims. Gate (2) in particular is N/A rather than failed: after (E) is
      split out there is no conditional dependence in H-QSP-3fe0ab at all, and
      H1 is carried there as a pointer with an empty validation list. The gates
      are neither satisfied nor evaded; they do not apply.
      WHAT IS TRUE IS SAID WITHOUT A STATUS WORD, in the record and in
      KN-FIND-0cbdf6: (A), (B) and (C) are SUPPORTED AT DERIVATION TIER ON THE
      TESTED SCOPE.
  - record: ledger/hypotheses/H-QSP-542cfa.yaml
    id: H-QSP-542cfa
    from: null
    to: specified
    basis: >-
      `specified` states that a mechanism, predictions, test boundary and
      falsification conditions exist and that nothing has been observed for THIS
      record. What was reviewed on 2026-09-17 was the parent's (E), and the
      review weakened it. The restatement has not itself been reviewed, no
      experiment bears on it, and H1's validation route (IDEA-20260916-b84e2d)
      is a proposal rather than a frozen contract.
    why_not_weakened_or_rejected: >-
      Both are terminal statuses asserting a verdict on the mechanism. The
      parent's (E) was weakened AS WRITTEN; its CONCLUSION was never refuted --
      no solver with kappa < (n-1)/n has been exhibited at any parameters, and
      EV-QSP-a6aa4b says so in terms ("no instance of a solver with
      kappa < 130/131 is exhibited -- the break is that nothing excludes one").
      Recording the restatement as already weakened would carry the parent's
      defect into a record that does not have it; recording it as rejected would
      assert a refutation nobody produced.

  rationale:
  - >-
    NA-1 IS RECORDED AS RUN, AND ITS OUTCOME IS A DISCLOSED LIMITATION RATHER
    THAN A REJECT. The dispatching session ran, at base commit a9684369a:
    `python3 tools/check_review_independence.py --plan
    ledger/handoffs/TASK-20260917-43701b.yaml --reports
    coordination/investigations/QSP-ECC2K130/tasks/TASK-20260917-34b637/report.md
    coordination/investigations/QSP-ECC2K130/tasks/TASK-20260917-52b4e6/report.md
    coordination/investigations/QSP-ECC2K130/tasks/TASK-20260917-5fa7d5/report.md`.
    EXIT 0. STDOUT VERBATIM: "no review_attestation blocks found in the given
    reports". THAT IS NOT A REJECT OF THE COMPOSITION AND IS NOT READ AS ONE --
    NA-1's own instruction is to stop only if the checker rejects, and it did
    not. It is also NOT a pass: the checker found nothing to parse, because the
    three reports carry no `review_attestation` YAML blocks. NA-1 further
    forbids editing a reviewer's attestation to make the check pass, and no
    reviewer report was touched.
    WHAT THIS MEANS FOR INDEPENDENCE, STATED EXACTLY. The round's independence
    stands where EV-QSP-a6aa4b already put it -- read_sibling_reports false on
    both adversarial reports, blind_from_respected true on the re-derivation,
    which read exactly two repository files and ran no git command -- and
    SUBJECT TO PROC-1, which converted blindness from a property of the round's
    SETUP into a property of three reviewers' RESTRAINT when the orchestrating
    session committed a completed sibling report to the shared branch mid-round.
    It is NOT machine-checked via attestation blocks and must not be described
    as if it were. EV-QSP-a6aa4b review_composition.independence_basis and
    DEC-20260917-793ae2 limitations already say the check had not been run;
    what changes here is only that it HAS now been run and returned nothing to
    check. That is a disclosure, not a promotion.
  - >-
    NA-4 ITEM (a), THE SPLIT ITSELF, IS THE LOAD-BEARING ACT. DEC-20260917-793ae2
    could not move (A)/(B)/(C) and (E) differently because they were parts of one
    record, and its decision_scope says so: "A record that carries a refuted
    closure reading cannot be moved toward `supported` as a package." Two records
    now exist, they are at different statuses, and either can move without the
    other. That is the whole content of this rationale item and it asserts
    nothing about the mathematics.
  - >-
    NA-4 ITEM (b) IS DISCHARGED WITH BOTH CONJUNCTS, NOT ONE. H-QSP-3fe0ab (B)
    now states n' < n explicitly and derives it from (i) cardinality, N_K(L)
    counts distinct roots IN K so N_K(L) <= |K| = p^n and the antecedent
    N_K(L) = p^{n'} forces n' <= n; TOGETHER WITH (ii) non-divisibility, (B)
    hypothesises that n' does not divide n and n' = n divides n, so n' != n.
    CARDINALITY ALONE IS NOT ENOUGH and the record says why, with the explicit
    object: n' = n with lambda = X gives L = X^{p^n} - X, a complete splitting at
    n' = n with q = 1, r = 0 and n/(n + n' - r) = 1/2 EXACTLY, so beta > 1/2
    fails at equality. EV-QSP-a6aa4b records that an earlier draft of this very
    clause asserted the one-conjunct version and withdraws it; the superseding
    record does not repeat it. The record also carries the external route --
    Definition 3.1 of KN-LIT-0a321c requires L | X^{q^n} - X, which supplies
    n' <= n from outside the derivation -- and the measured scale of the
    omission: over all 54356 pairs (n, n') with n' not dividing n,
    n/(n + n' - r) > 1/2 holds for 18614 and FAILS FOR 35742, every failing pair
    having q = 0 and n' >= 2n (TASK-20260917-34b637 via EV-QSP-a6aa4b).
  - >-
    NA-4 ITEMS (e) AND (f) ARE DISCHARGED AS CITATION AND COMPLETENESS REPAIRS,
    NEITHER OF WHICH TOUCHES A BOUND. (e) For b != 0 the degenerate case's
    M = X^{p^{n'-j}} - c'X - b' is an affine TRINOMIAL whose root set is a coset
    of an additive subgroup, covered by NEITHER Appendix C.2 of KN-LIT-0a321c NOR
    Proposition 6 of KN-LIT-4fe9d2 -- both of which are the multiplicative family
    X^{q^{n'}} - X^a, fitting only the b = 0 subcase -- and the bound follows
    from deg M ALONE, needing no classification; separately c' = c^{p^{-j}}
    requires K FINITE (Frobenius surjective), not merely "over a field". (f) The
    r = 0 vacuity now covers both forms: the MAX form is vacuous there because r
    enters the derivation in exactly one place and at r = 0 that exponent IS
    deg L, while the N <= deg D form is NOT automatically vacuous, since at
    d^{q+1} = p^{n'} leading terms can cancel and deg D < deg L. The record
    claims vacuity only where it holds. Both repairs come from EV-QSP-a6aa4b
    unresolved_confounds items 1 and 2, and the degenerate branch is
    independently confirmed outside the contract on 26 constructed instances and
    164 full-K degenerate lambda, every one attaining N = p^{n'-j} exactly and
    none splitting completely.
  - >-
    NA-4 ITEM (g) IS DISCHARGED TWICE, DIFFERENTLY, IN THE TWO RECORDS. In
    H-QSP-3fe0ab, H1 is NOT load-bearing and is demoted to a pointer entry with
    an empty supporting_results, an empty validation_experiment_ids and a
    falsification_condition that states in terms that no outcome of
    IDEA-20260916-b84e2d can move that record in either direction. In
    H-QSP-542cfa, where H1 IS load-bearing, its random_model_justification is
    rewritten honestly: Appendix A.1 of KN-LIT-0a321c says the eliminant degree
    is "bounded by M(E)" and that root-finding's cost "can be neglected in the
    overall complexity estimation", and Lemma 3.1 gives a big-O -- all UPPER
    bounds -- where H1 needs degree EXACTLY M(E) and cost AT LEAST M(E). The step
    that would bridge the gap is the BKK / generic-attainment statement that H1
    itself marks RECALLED, which AGENTS.md rule 9 bars from discharging
    supporting_results. supporting_results is therefore EMPTY, which is the
    accurate record rather than a defect to be filled. NOTHING HERE ASSERTS H1
    IS FALSE; what is established is that its support in the load-bearing
    direction is absent once `recalled` citations are honoured.
  - >-
    NA-4 ITEMS (c) AND (d) ARE DISCHARGED IN H-QSP-542cfa. (c) The "five times
    below Rojas' 4.876" comparison is WITHDRAWN and replaced by the robust
    sufficient condition: under H1, kappa >= (n-1)/n suffices to exclude a cheap
    solver at n' = n-1, which is the worst beta (B) admits (q = 1, r = 1, so
    beta >= n/(2n-2)), and alpha_beta > 1 requires kappa < 1/(2 beta_min) =
    (n-1)/n exactly. At n = 131 that is 130/131 = 0.9923664, from
    beta_min = 131/260 = 0.5038462 at n' = 130, by exact rational arithmetic. The
    record states that 4.876 is an UPPER bound in both frozen sources -- Euler-
    Petit Proposition 7, "currently majored by 4.876", and Huang Lemma 3.1's
    big-O -- and that excluding a cheap solver needs a LOWER bound, which is in
    neither. (d) Rational lambda are restored to the survivor list, (D)(ii) being
    WITHDRAWN AS STATED by the producer's own Stage 5 report; the parent's list
    named three survivors and absorbed the fourth silently.
  - >-
    THE KN-FIND IS NOW WRITEABLE AND IS WRITTEN, WHICH IS THE OTHER HALF OF
    NA-4's PURPOSE. knowledge/README.md binds a finding never to claim more than
    its evidence record's scoped claim. DEC-20260917-793ae2 deferred the finding
    because the scoped claim sat inside a record carrying a refuted (E) and an
    un-narrowed (B), so a finding authored then would have had to be superseded
    immediately. KN-FIND-0cbdf6 copies the BOUND HALF of that scoped claim and
    nothing else: the bound, the corollary with n' < n, 0 violations in 45436
    producer candidates and roughly 294400 independent ones at p in {2,3,5,7},
    the tightness at ratio exactly 1 at (7,3) and at odd p at (3,8,3) and
    (5,5,3), and the n = 131 maximum of 132 at n' = 33 attained by 4 of 244 and
    independently re-derived BLIND with exact agreement, a shortfall of 2^25.96
    against the 2^33 a complete splitter needs. It carries proof_status
    `derivation`, every boundary from EV-QSP-a6aa4b, and an explicit section on
    what it does not claim.
  - >-
    NOTHING IN THIS DECISION IS A CLOSURE, AND RULE 9 COMPLIANCE IS STATED
    EXPLICITLY BECAUSE THE RECORDS IT CREATES CARRY A SCOPED NEGATIVE. The QSP
    line stays open with four survivors: n' | n (at n = 131 only n' in {1, 131});
    correspondence shapes of conjugate degree >= 2 (IDEA-20260916-a17f43);
    factor bases that are not root sets of a single X^{p^{n'}} - lambda; and
    rational lambda. The evidence, budget, test boundary and remaining
    uncertainty are in EV-QSP-a6aa4b boundaries and obstruction.scope; the
    revisit conditions are DEC-20260917-793ae2's and are unchanged; the concrete
    successor is NA-5, which this decision ranks as the next Coordinator act.
    ECC budgets are unlimited (AGENTS.md "ECC comes first"), so nothing here is
    a budget closure and none was considered.
  - >-
    STANDING USER AUTHORIZATION. This decision is recorded under the standing
    user authorization of 2026-09-06 (AGENTS.md, "Standing user authorization
    for ideas and experiments"): the Coordinator selects ranked work and records
    it without asking the user to confirm each act. Authorization is permission
    to do the work; it asserts nothing about whether any hypothesis is true, and
    it does not relax the evidence rules, the promotion gates, or the
    requirement that this transition become official only when the archive
    commit is verified.

