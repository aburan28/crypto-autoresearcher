  scoped_claim_this_decision_authorizes: >-
    THIS DECISION AUTHORIZES NO NEW SCIENTIFIC CLAIM. Every scientific statement
    it relies on was authorized by DEC-20260917-793ae2 on the evidence of
    EV-QSP-a6aa4b, and this decision narrows rather than extends it.
    WHAT MAY NOW BE SAID, AND NOTHING BEYOND IT. Over the tested instances,
    parameters, instruments and budget -- p = 2 at (n, n') in {(11,6), (13,7),
    (7,3), (11,4), (13,5)} for every lambda of exact degree 2..7 (1260
    candidates); 1200 seeded K-coefficient draws at n = 11 and 13; the
    complete-splitting sweep over prime n in {7,...,31} with 2 <= n' <= 15,
    n' < n, n' not dividing n and 2 <= d <= 8 (42244 candidates); the n = 131
    census over F_2[z]/(z^131 + z^13 + z^2 + z + 1) at n' in {33, 44, 66} for
    every non-linearized F_2-coefficient lambda of exact degree 3..7 (732 rows,
    244 distinct lambda per cell); and, from independent review only, p in
    {3,5,7} at n <= 13 with n' <= 8 and degree 2..4 (291997 candidates) plus
    2400 K-coefficient draws at odd p -- NO lambda was observed with
    N_K(L) > max(d^{q+1}, p^{n'-r}), and NO completely splitting L with r >= 1
    was observed with beta < n/(n + n' - r). The largest ratio N/bound observed
    anywhere is exactly 1, attained at (7,3) by lambda = X^2 + X and at odd p by
    (3,8,3) and (5,5,3); the largest N at n = 131 is 132, against a ceiling of
    2401 and against the 2^33 a complete splitter at n' = 33 would require.
    THESE OBSERVATIONS DO NOT PROVE that (A) or (B) holds for every p, n, n' and
    lambda: the general statement rests on the derivation, which three
    independent sessions attacked at six named joints and did not break. They do
    not prove that all parameterizations fail, that all related representations
    fail, that no undiscovered structure exists, or that no future algorithm
    exploits the mechanism. They establish nothing about any deployed curve -- no
    curve, group or point was constructed anywhere in this contract -- and they
    move no attack exponent; rho on ECC2K-130 stands at 2^60.9 iterations
    (KN-LIT-096), untouched. RQ-QSP-f9bbdb decision target (a), an existence
    result at n' = 33, is answered NEGATIVELY ON THE 732 ENUMERATED CANDIDATES
    AND ON NOTHING ELSE.
    THE CLOSURE READING IS NOT AUTHORIZED IN ANY FORM. It is restated at
    H-QSP-542cfa at status `specified`, conditional on H1 and on a LOWER bound
    on kappa that no frozen source in this program supplies; its stated reason in
    the superseded record is refuted and the "five times below Rojas' 4.876"
    comparison is withdrawn. THE QSP LINE IS NOT CLOSED.

  limitations:
  - >-
    tools/check_review_independence.py RETURNED NOTHING TO CHECK. Exit 0 with
    "no review_attestation blocks found in the given reports" is not a machine
    confirmation of independence; the three reviewer reports carry no
    review_attestation blocks. Independence therefore rests exactly where
    EV-QSP-a6aa4b put it -- reviewer restraint, read_sibling_reports false,
    blind_from_respected true -- SUBJECT TO PROC-1, and must not be described as
    machine-checked. No reviewer report was edited to make the check parse.
  - >-
    THIS DECISION RE-LITIGATES NO VERDICT AND RE-VERIFIES NO NUMBER. Every
    figure it quotes is taken from EV-QSP-a6aa4b or DEC-20260917-793ae2. It
    inherits every boundary of that evidence record without exception: 720 of
    732 census rows single-instrument; 10 of 65 complete splitters on instrument
    I2 alone; the degeneracy control vacuous by construction; p != 2 evidence a
    REVIEW artifact and not a run of the experiment; no independent replication
    invocation spent (PD-6); K-coefficient lambda at n = 131 entirely untouched
    and degree capped at 7 there.
  - >-
    THE SUPERSEDING RECORDS ARE NOT THEMSELVES REVIEWED. H-QSP-3fe0ab is a
    narrowing of text that WAS reviewed, and every scientific clause in it is
    carried from H-QSP-5540d7 or from a finding of the round; but the narrowed
    wording has not been put in front of an independent reviewer, and
    H-QSP-542cfa is a new statement that has not been reviewed at all. That is
    why the first is at `analyzed` and the second at `specified`, and it is why
    NA-2 (the superseding review-plan card) stays open.
  - >-
    FIVE LEDGER-SCHEMA ERRORS ON RUN-QSP-33b442-S0 REMAIN STANDING DISCLOSED
    DEBT (missing command.txt, environment.json, stdout.log, stderr.log,
    raw-result.json on a stage that ran no program). They are named as known
    debt in the receipt of TASK-20260917-8cc9a3 as they were in
    TASK-20260917-26ffa2's, they are NOT suppressed, and
    tools/validate_ledger_baseline.txt stays untouched. Routed as NA-6(i), which
