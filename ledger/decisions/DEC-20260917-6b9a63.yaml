    placed by the session driving it, no content was authored or altered in the
    transcription -- the same test that accepted PROC-3 and the producer's PD-5.

  knowledge_promotion:
    promoted:
    - KN-FIND-0cbdf6
    not_warranted: null
    promoted_paths:
    - knowledge/findings/KN-FIND-0cbdf6.md
    rationale: >-
      THIS IS THE PROMOTION DEC-20260917-793ae2 DEFERRED, AND THE DEFERRAL'S OWN
      CONDITION IS NOW MET. That decision recorded the finding as clearly owed --
      "a fresh agent reading only knowledge/ and the ledger should be able to
      rediscover the twisted injection bound" -- and declined to write it for one
      concrete reason: knowledge/README.md binds a finding never to claim more
      than its evidence record's scoped claim, and the scoped claim then sat
      inside H-QSP-5540d7, whose (E) was refuted in its stated reason and whose
      (B) lacked the n' < n clause, so a finding authored at that moment would
      have baked in the un-narrowed statement and would have needed immediate
      supersession. NA-4 has now produced the narrowed record, and (A)/(B)/(C)
      live in H-QSP-3fe0ab, which carries no refuted closure. The finding can
      therefore copy the scoped bound without carrying the un-narrowed (E) with
      it, which is exactly what KN-FIND-0cbdf6 does.
      WHAT IT CONTAINS: the bound N_K(L) <= max(d^{q+1}, p^{n'-r}) whenever
      D != 0 and the corollary that complete splitters at r >= 1 have n' < n and
