  context: >-
    Portfolio continuation of RQ-QSP-f9bbdb / EXP-QSP-33b442, discharging next
    action NA-4 of DEC-20260917-793ae2. That decision recorded `weaken` on
    H-QSP-5540d7 and moved it to `analyzed`; its decision_scope states in terms
    that (A), (B) and (C) came out of the claim-changing review round supported
    at derivation tier while the closure reading (E) came out refuted in its
    STATED REASON, and that "splitting it is a superseding act, not a status
    change (NA-4)". This decision performs that split.
    It also discharges the deliberate deferral recorded in that decision's
    knowledge_promotion: a KN-FIND for (A)/(B)/(C) was declared owed and was NOT
    written, for one concrete reason -- knowledge/README.md binds a finding never
    to claim more than its evidence record's scoped claim, and the scoped claim
    then sat inside a hypothesis record whose (E) was refuted and whose (B)
    lacked the n' < n clause, so a finding authored at that moment would have
    baked in the un-narrowed statement and needed immediate supersession. The
    superseding record now exists and the finding rides this archive.
    STATE CHECKED. Branch cursor/qsp-h-supersede-3d0a; base commit a9684369a,
    which is origin/main after PR #1269 merged the D1/D2 run-package schema
    remediation, itself following PR #1267 which merged DEC-20260917-793ae2,
    EV-QSP-a6aa4b, the H-QSP-5540d7 status change, KN-OPEN-ac409f and
    KN-TECH-54c38e. NA-11 is therefore discharged and this decision does not
    re-open it.
    THIS DECISION RUNS NO EXPERIMENT AND COMMISSIONS NONE. It is a ledger act on
    committed artifacts: every figure quoted below is taken from
    EV-QSP-a6aa4b or DEC-20260917-793ae2 with its source named beside it, and
    no number is recomputed, estimated or repaired here.

  decision: supersede

  decision_scope: >-
    FOUR THINGS HAPPEN AND NO FIFTH.
    (1) H-QSP-5540d7 moves `analyzed` -> `superseded`, by a STATUS FIELD UPDATE
    ONLY. Its text is not patched; records are immutable and the second status
    change is recorded the same way the first was.
    (2) H-QSP-3fe0ab is created at `analyzed`, carrying claims (A), (B), (C) and
    (D) -- the twisted injection bound, the beta corollary, the relation to the
    published bounds and the priced generalisations -- with NA-4 items (b), (e),
    (f) and (g) applied and the closure reading removed.
    (3) H-QSP-542cfa is created at `specified`, carrying the restated closure
    reading alone, restricted to quasi-subfield polynomials in the sense of
    Definition 3.1 of KN-LIT-0a321c, led by the robust sufficient condition
    kappa >= (n-1)/n instead of the withdrawn "five times below Rojas' 4.876"
    comparison, with rational lambda restored to its survivor list and H1's
    support described honestly.
    (4) KN-FIND-0cbdf6 is promoted for the bound half only.
    NOTHING MOVES TO `supported`, NOTHING IS CLOSED, AND NO CLAIM IS MADE ABOUT
    ANY DEPLOYED CURVE. The QSP line stays open with four named survivors.
    `supersede` rather than `support` or `weaken`: the scientific verdicts were
    already recorded by DEC-20260917-793ae2 on the evidence of EV-QSP-a6aa4b,
    and this decision re-litigates none of them. What it does is structural --
    it puts two verdicts that point different ways into two records that can
    move independently -- and `supersede` is the transition that says exactly
    that.

