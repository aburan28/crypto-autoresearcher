  - >-
    PROC-6 CARRIES FORWARD AS AN OPERATIONAL CONSTRAINT, NOT A FINDING. On this
    runtime a subagent's write to a declared artifact path has been refused
    before (DEC-20260917-793ae2 PROC-6), deterministically at one path, while
    writes to knowledge/ paths in the same session succeeded; the mechanism was
    never determined and no rule about the runtime is asserted from four data
