coordinator_decision:
  id: DEC-20260904-8e51d7
  context: >-
    IDEA-20260903-81a943 and analysis/smallroot-reach/CLOSURE.md (merged to main on
    2026-09-03) close the windowed / rank-1 GAP lattice-describable factor-base family
    under tree elimination plus a Coppersmith-family small-root solver, with worst-case
    margin -0.0481 in the exponent at (m,w) = (4,2). That record's own third
    falsification_condition, and CLOSURE.md section 6 item 1, name the same live open
    edge: a rank-r >= 2 GAP substitution whose polytope could lift the reach past the
    demand curve. IDEA-20260808-c31f1c's invariance lemma covers rank 1 only -- an
    affine substitution in one variable is polytope-neutral -- while a rank-r
    substitution is LINEAR in r variables per slot, turning a degree-2 box axis into a
    group simplex and genuinely changing the Newton polytope. The comparison is
    controlled: |V| = B is unchanged, so the demand curve is unchanged (KN-FIND-007);
    prod(bounds) per slot = (B^{1/r})^r = B is unchanged, so the normalisation and the
    information ceiling eps = 1 are unchanged. One side fixed, one side moves. This
    decision converts that open edge into a hypothesis and a drafted, NOT approved,
    experiment contract.
  decision: expand
  target_ids:
    - H-PFDR-3c7d1e
    - EXP-PFDR-9b4f2a
    - IDEA-20260903-81a943
    - RQ-PFDR-ae2fba
  rationale:
    - >-
      The rank lever is the cheapest remaining discriminator in this family and it is
      the one the closing record itself nominates. The instrument that computes both
      sides already exists and is merged (tools/smallroot_reach.py, ten green tests,
      calibrated against Coppersmith's univariate theorem), so the marginal cost of
      deciding the successor is small relative to the size of the question.
    - >-
      The pre-registered prediction is DERIVED, not fitted, and is frozen in the
      contract before any run: from the centroid form eps = n^2/((n+1) sum_i c_i) with
      n = 3r and the continuous centroid 2/(r+1) of the group simplex
      {alpha in R^r_{>=0} : sum alpha <= 2}, eps_naive(r) = 3r(r+1)/(2(3r+1)), giving
      exactly 3/4 at r = 1 -- which must reproduce the committed full-box S_3 value and
      is therefore a calibration rather than a result -- and 9/7 at r = 2, 9/5 at r = 3.
      The S_4 analogue is r(r+1)/(4r+1). Both are recorded with their derivation and
      may only change through a versioned protocol_amendment.
    - >-
      The predicted r >= 2 values lie ABOVE the information-theoretic ceiling eps = 1.
      That is the whole reason a single-arm contract would be unacceptable. eps > 1
      does not mean the attack works; it means the Jochemsz-May polytope argument stops
      constraining the family, and eps -> 1 is precisely lattice density 1, the regime
      where low-density subset-sum lattice attacks are known to fail. A contract that
      reported "eps_available > eps_required, family alive" without measuring whether
      real LLL attains it would be an overclaim, and I refuse it. The contract
      therefore carries two arms and an explicit interpretation_guard binding every
      downstream statement, and its decision_rule makes Arm B -- planted-root recovery
      with real python-flint LLL, compared against the Jochemsz-May bound at the SAME
      finite multiplicity -- the decisive arm.
    - >-
      Both outcomes are informative and neither is assumed. Supply at or below demand
      for every tested rank EXTENDS the rank-1 closure to rank r <= 4, a strengthening.
      Supply above demand with Arm B confirming attainment opens a live attack lane and
      routes to independent review-breakthrough validation and a red team pass before
      any statement is made -- it is explicitly not a conclusion this contract may
      publish on its own output.
    - >-
      Controls were specified before the design was costed, each with the defect it
      catches: r = 1 calibration against three already-committed numbers (0.7500,
      0.8408, 0.4137), the univariate Coppersmith control that calibrates the empirical
      pipeline against a theorem rather than against itself, a random-polytope null at
      matched monomial count and degree profile, an algebraic-independence measurement
      that is the direct probe of the heuristic the whole reach rests on, a
      degenerate-GAP control that excludes any GAP with measured |V| < 0.9 B before
      aggregation, a fast-path/brute-force equivalence check on the group-graded
      Minkowski identity that makes r >= 2 computable at all, a support-realization
      check against coefficient cancellation, a B1/B2 coefficient-structure control,
      an explicit demand-invariance assertion, and an information-bound sentinel.
    - >-
      Approval is WITHHELD. Per /design-experiment step 4 the frozen contract is
      presented to the user for confirmation before status may become approved; the
      contract is drafted at status review_required with approved_by: null, no handoff
      has been written, and no compute may be spent against it. This decision approves
      no experiment.
  evidence_refs:
    - ledger/proposals/IDEA-20260903-81a943.yaml
    - ledger/proposals/IDEA-20260808-c31f1c.yaml
    - analysis/smallroot-reach/CLOSURE.md (sections 1, 2, 3, 5, 6)
    - tools/smallroot_reach.py
    - tests/test_smallroot_reach.py
    - ledger/questions/RQ-PFDR-ae2fba.yaml
    - ledger/hypotheses/H-PFDR-3c7d1e.yaml
    - experiments/EXP-PFDR-9b4f2a/specification.yaml
  limitations:
    - >-
      Nothing here is evidence. No run has been executed, no hypothesis status has
      moved, and no claim about rank-r GAPs is asserted. The pre-registered prediction
      is a prediction.
    - >-
      The contract is scoped to rank-r GAP factor bases, binary addition trees, S_3 and
      S_4 blocks, two declared substitution conventions, python-flint LLL at
      multiplicity t in {1,2}, log2 p in {24,32,40}, claim tier toy, exponents only. It
      says nothing about non-tree decomposition, non-Coppersmith lattice solvers,
      superpolynomial-dimension lattices (IDEA-20260808-e2315e), or prime-field ECDLP
      as a whole.
    - >-
      Attainment measured at toy p and small t is not claimed to transfer to
      cryptographic p, larger t, or BKZ. A failure to attain at toy scale is a scoped
      negative observation; a success would be a lead requiring escalation, not a
      result at scale.
    - >-
      dominated_by remains Pollard rho / van Oorschot-Wiener at exponent 1/2 and
      sota_delta remains zero on the attack axis. This contract makes no
      asymptotic-complexity claim, and no hypothesis may move toward supported on it;
      the four promotion gates are untouched and undischarged.
    - >-
      The Jochemsz-May and Coppersmith citations in the hypothesis are provenance
      recalled and support nothing: they function as calibration targets the instrument
      must hit, so an error in the recollection surfaces as a failed gate rather than as
      a silent wrong answer. No recalled source backs this decision.
  next_actions:
    - >-
      Top-level session: present experiments/EXP-PFDR-9b4f2a/specification.yaml to the
      user for confirmation. Draw explicit attention to the interpretation_guard, the
      decision_rule branch 4, and the frozen preregistered_prediction, since those are
      what the user is being asked to freeze.
    - >-
      On user confirmation ONLY: the Coordinator records a separate decision setting
      EXP-PFDR-9b4f2a status: approved with approved_by: coordinator, and writes the
      executor handoff (TASK-*) with objective, constraints, deliverables by exact
      artifact path, inference policy executor-implementation, budget
      (3600 s per run, 8 GB, 24 runs, 12 CPU-hours), and the completion gate = all
      calibration gates C1, C2, C6, C7, C9 passing plus every required artifact present.
      No budget field may be left null.
    - >-
      Before the snapshot archive: git fetch origin and merge origin/main into the
      working branch (merge, never rebase); re-run tools/validate_ledger.py; then a
      single snapshot archive staging exactly
      ledger/hypotheses/H-PFDR-3c7d1e.yaml,
      experiments/EXP-PFDR-9b4f2a/specification.yaml,
      experiments/EXP-PFDR-9b4f2a/amendments/.gitkeep,
      experiments/EXP-PFDR-9b4f2a/runs/.gitkeep and
      ledger/decisions/DEC-20260904-8e51d7.yaml; push the branch and open or refresh a
      PR against main naming H-PFDR-3c7d1e, EXP-PFDR-9b4f2a and DEC-20260904-8e51d7. A
      contract that exists only in a local commit is unpublished, not frozen.
    - >-
      Do NOT dispatch the executor until the post-commit verifier accepts the snapshot
      archive receipt and the user has confirmed the contract.
    - >-
      If the user declines or amends: the amendment is a new contract version drafted
      before approval, not an edit after it; record the reason and re-present.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is a design decision, not an evidence review. No run has executed, no
      evidence record exists, and no durable claim results. Promotion is reconsidered
      only at /review-evidence on EXP-PFDR-9b4f2a, where a support or reject_scoped
      decision on replicated or strong evidence would require a KN-FIND entry and a
      regenerated knowledge/INDEX.md in the same ledger archive commit.
  decided_by: coordinator
  decided_at: '2026-09-04'
