coordinator_decision:
  id: DEC-20260908-94664e
  decision: approve
  decided_by: coordinator
  decided_at: '2026-09-08'
  target_ids:
  - EXP-ECDLP-651b94
  - TASK-20260908-111152
  - TASK-20260908-c446f1
  context: Archive 06c42d77322a8a4f20101e10015faba99a7dce1f preserves the fresh second spectral implementation review.
    Authorize an additive third correction of exact source TASK-20260908-6a010d under the unchanged scientific specification
    and existing amendment.
  rationale:
  - Accept S2-01 through S2-08 as source-level repair requirements, not scientific evidence or an admission-valid
    PASS. Findings identify frozen tuple, typed failures, custody, genuine review admission and resource-guard conformance
    defects.
  - The reviewer disclosed one invocation of the future-run command token with both admission and pipeline fully
    mocked, contrary to its literal handoff. Preserve that procedure deviation. No scientific function or real launch
    was executed. Its reproduced/static source observations are useful repair leads; a fresh fully compliant independent
    review of corrected code remains required.
  - Generic memory search and required operating-skill reads are also disclosed in the archived report. No sibling
    report was read. Do not present the report as procedurally flawless.
  - Rank completing a concrete already-approved runner above adding more unimplemented ideas. Preserve all seeds,
    counts, algorithms, thresholds, scientific scope and source history.
  - A snapshot receipt committed inside the snapshot cannot contain its own commit hash. Therefore S2-06 is resolved
    using an externally signed authority binding to the real archive commit and exact queue archive record, with
    the in-snapshot receipt binding its parent and source files. Verify both against Git; never demand a commit
    self-reference or treat an all-zero asserted commit as authority.
  - Standing authorization covers this zero-science implementation correction and fixed mock regression. It does
    not authorize launch.
  accepted_findings:
  - id: S2-01
    title: The relabel-control RNG violates the frozen control-stream tuple
    required_correction: Use the frozen control tuple (p,A,B,r,0,0,0) for the relabel bijection; retain actual u
      only in the shuffle-arm streams.
  - id: S2-02
    title: Unavailable fixtures and implementation exceptions are mislabeled as completed invalid data
    required_correction: Add a typed incomplete-fixture outcome mapped to inconclusive and map unexpected implementation
      exceptions to failed_implementation while preserving partial custody.
  - id: S2-03
    title: Canonical report and per-control diagnostic custody remain incomplete
    required_correction: Meter the relabel table/control, constant-O census and mutated verifier; serialize their
      rows everywhere required; derive report coverage from sink contents and include actual secondary/cost values
      rather than the frozen seed-list length.
  - id: S2-04
    title: Failed publication-failure annotation is reported as annotated_final
    required_correction: Track receipt creation and durability separately; return annotated_final only after the
      receipt file and containing directory are durably confirmed, otherwise use an explicit unretained state and
      prevent the final path from being mistaken for a complete run where possible.
  - id: S2-05
    title: Run path and identifier admission do not enforce canonical allocation custody
    required_correction: Enforce the allocated RUN-ECDLP-<six-lowercase-hex> form, bind the canonical experiment
      run root in authority, and reject any different resolved path before scientific work begins.
  - id: S2-06
    title: Review admission accepts a forged minimal PASS report and a false archive receipt commit
    required_correction: Validate the complete review attestation and inference envelope against the precommitted
      plan, and verify the archive receipt's task, commit, parent, exact path set and hashes against Git before
      accepting PASS.
  - id: S2-07
    title: Missing process-group rows are accepted as a zero-byte RSS measurement
    required_correction: Require at least the current process row and a valid matching group row; treat no matches
      or malformed measurement rows as InfrastructureStop.
  - id: S2-08
    title: Cancellation and RSS progress coverage remains incomplete outside the repaired Cayley loops
    required_correction: Thread Guard.check through every long table/relabel/shuffle loop and pass on_progress through
      the Fourier phase. Record all outer and inner indices needed to identify each persisted dense-loop boundary.
