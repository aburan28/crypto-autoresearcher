  rationale:
    - >-
      WHY APPROVE. N-CONV resolves the decision-changing uncertainty named in
      DEC-20260924-e61f3b NA-2 and EV-CERTBIN-4a9d2f TA-7. It states
      positive, negative and inconclusive next decisions (attention_contract).
      It cannot be satisfied trivially, because both E-TENSOR and E-LINEAR are
      falsifiable by the frozen counts. It costs hours of compute and no new
      curve.
    - >-
      WHY THE LADDER. N-CONV alone separates "S_3's quadratic part" from "S_3's
      lower-degree part". The N-ELL144 and null rungs are proves-too-much
      objects for a tensor reading. N-CONVL and N-CONV17 split the
      lower-degree part and the cokernel at negligible extra cost. The
      verdicts on them are secondary by rule (NC-DR-9).
    - >-
      WHY 144. One unsatisfiable draw per archived x_R ties every system to an
      RC-1 target. It gives CP95 bounds within about 0.025 of the extremes
      (design arithmetic, recomputed exactly in the trial plan's power table),
      which separates the frozen thresholds from the S_3 reference 386/386
      and the 0/62 nulls.
    - >-
      TARGET-PROFILE HONESTY. Toy tier, sota_delta zero, oracle A and parallel
      rho dominate; no cost claim. Item (A) is exponent-adjacent only through
      item (B) at larger n. A TENSOR verdict would locate the
      structure that an n = 19 persistence question must track.
    - >-
      CLOSURE DISCIPLINE. Nothing here closes a lane. A LINEAR verdict narrows
      a mechanism reading; it rejects nothing. Any future reject_scoped on
      this basis needs review-breakthrough at max first.

