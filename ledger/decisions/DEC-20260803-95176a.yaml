    named_obstruction: >-
      The sub-Poisson deficit is established but its mechanism is unidentified and
      the null family it is measured against omits the cross-cell dependence the
      physical process has. Occupancy and score position are perfectly confounded
      by this design, and the second file's level anomaly has the opposite sign,
      so two mechanisms are already required and none is named.
    forward_guidance: >-
      Test against a JOINT null that carries cross-cell dependence before treating
      the deficit as a property of the data rather than of the independence
      assumption. Break the occupancy/position confound as far as the two files
      allow. Quote the effective design size of every regression coefficient.

