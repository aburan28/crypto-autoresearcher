  decision: refine
  decision_label: floor_rejection_survives_at_per_cell_resolution_mechanism_unidentified_intercept_framing_struck

  context: >-
    BATCH-017 ran the check the BATCH-016 red team specified: the per-cell
    occupancy regression, at 301 and 496 cells instead of three terciles, with
    every coefficient's null distribution measured under BATCH-015's own N1 and
    N2 generators. It carried a live counterfactual -- a floor-member-consistent
    slope would have REINSTATED the floor as a reference point and reversed a
    BATCH-016 blocking objection -- and the producer was instructed to state that
    outcome plainly if it occurred. It did not occur. The batch also ran an
    independent validation, because BATCH-015 went to ledger on one investigation
    plus one validation and BATCH-016 then corrected it.

  execution_provenance: >-
    Attempt 1 of TASK-20260803-f7a12c reported completion and was destroyed by a
    session container reset before any snapshot commit, leaving no artifact.
    AGENTS.md rule 5: that loss is not mathematical evidence in either direction.
    AGENTS.md rule 9: its reported numbers have no archived artifact behind them
    and are cited nowhere in EV-MLKEM-890e2a or here. Attempt 2 was dispatched
    without being told them. Recorded as AMEND-BATCH-017-001, which also records
    the Coordinator's one contract addition, the degree-sensitivity requirement.

  central_adjudication: >-
    THE FINDING SURVIVES THE SHARPER INSTRUMENT, AND THE SHARPER INSTRUMENT TURNS
    OUT TO BE LESS SHARP THAN ITS NAME. BATCH-016 rejected the counting floor as
    a reference point on a tercile slope; at full per-cell resolution that
    rejection holds, and it now rests on things terciles could not show -- the
    deficit is concentrated in the 164 cells where the floor moves the reference
    by at most 2 percent (z = -2.91 and -2.86), it is monotone across four
    occupancy quartiles in the direction the floor member forbids, it survives
    restriction to below-mean leverage, and it appears in the RAW INCREMENTS WITH
    NO RATE MODEL AT ALL. The floor-attaining member is rejected JOINTLY at every
    degree examined. But three of the package's framings are struck, and the most
    important strike is the one the Coordinator added the degree control to catch
    and then nearly misread in the opposite direction: the single degree whose
    marginal slope appeared to reinstate the floor in fact rejects it HARDEST,
    because a marginal coefficient is not a test of a joint prediction. And the
    slope itself is a 33-effective-cell statistic of 301 -- this program's
    signature failure mode, nominal sample size quoted for effective, recurring in
    a new place four batches after it retired the whole-band statistic for exactly
    that. `refine`: the conclusion is kept and strengthened, three framings and one
    mechanism claim are struck, and two new bindings are issued.

  what_survives:
    - >-
      The n=43 mid-band sub-Poisson deficit is STRUCTURAL at per-cell resolution
      and is NOT a tercile-binning artifact. 164 cells at occupancy below 0.02
      read mean t = 0.6811 against 0.9959 +/- 0.1084 (N1) and 0.9995 +/- 0.1114
      (N2); leverage-restricted 0.7215 on 145 cells; quartile gradient 0.973,
      0.835, 0.778, 0.621; model-free detrended var/mean 0.453, 0.561, 0.660 on
      the last 25, 50 and 100 cells against 1.
    - >-
      The floor-attaining member is rejected JOINTLY at every degree examined,
      including degree 2. BATCH-016's rejection of the floor as a reference point
      therefore stands, and EV-MLKEM-ee220e W-4 is CONFIRMED rather than
      superseded. The handoff's counterfactual did not occur and is reported as
      not having occurred.
    - >-
      The degree choice is not researcher degrees of freedom. BATCH-014's archived
      forward-deviance criterion at chi^2_{1,0.95} selected degree 5 and degree 3
      before this question existed, and it actively rejects degree 2 for n=43 by a
      deviance drop of 96.6 against a 3.841 threshold.

  what_is_struck:
    - >-
      "The deficit sits in the INTERCEPT, occupancy-independent, at -2.3 sd under
      BOTH nulls." STRUCK. intercept = phi - slope * xbar identically, so
      E[intercept] = 1 under both nulls is an identity of the regressor origin and
      "under both" carries no more information than "under one". Confirmed by the
      Coordinator to 0.00e+00 at seven degrees, with floor = 1 - xbar to 1.11e-16.
      The intercept is numerically phi shifted by 0.016 and its z is WEAKER than
      the archived phi z it restates.
    - >-
      The NOVELTY of that framing. BATCH-016's objections.md section 3b already
      reported the low-occupancy deficit directly at -2.55 sd below both nulls,
      with the sentence "The deficit is entirely inside the cells where the floor
      correction is 0.5 %". Verified by grep. The intercept is a weaker
      restatement by extrapolation of a measurement already in the archive.
    - >-
      "n=43 at degree 2 is consistent with the floor-attaining member." STRUCK AND
      INVERTED. Slope-only. Jointly, degree 2 rejects the floor member hardest:
      validator D^2 = 27.97 at 0/400 against degree 5's 13.62 at 1/400;
      Coordinator, by an independent (slope, phi) route with its own sampler and
      seed, 28.23 at 0/400 against 12.07 at 1/400. phi at degree 2 is an EXCESS at
      +4.45 sd.
    - >-
      "n=50 at every degree >= 4 is consistent with the floor-attaining member."
      STRUCK as a file-level statement. n=50's phi is an EXCESS at +2.1 to +2.3 sd
      ABOVE the floor member, its low-occupancy subset reads +0.46 sd, and a joint
      test rejects the floor member there too.
    - >-
      "Occupancy-independent level shift" and "occupancy-graded effect" as
      MECHANISMS. Occupancy is near-monotone in the score index (3 non-monotone
      steps in 300; 0 in 495), so occupancy and smooth score-position effects are
      perfectly confounded by this design. The surviving statement is narrower:
      THE DEFICIT LIVES WHERE THE FLOOR IS INOPERATIVE AND IS THEREFORE NOT A
      FLOOR EFFECT.
    - >-
      The package's stated REASON that the OLS standard error is unusable. It is
      not chiefly fit-induced dependence: the refit changes the calibrated sd by
      at most 4 percent. The measured ratio 0.469 to 1.405 is essentially
      sqrt(Var_null(t)/s2_observed), i.e. heteroscedasticity and kurtosis. The
      refusal to quote the OLS SE was right; the reason given for it was wrong.

  weighing_of_the_review: >-
    Accepted in full. This is the most consequential validation this goal has
    received and it earned its budget three times over.
    (1) D-3 IS THE ONE THAT MATTERS AND IT REVERSES A READING I WAS ABOUT TO MAKE.
    I added the degree-sensitivity requirement under AMEND-BATCH-017-001 precisely
    to stop a verdict resting on an inherited degree, and the sweep came back
    looking as though it had destabilised the conclusion. The validator showed the
    destabilisation was an artifact of reading a marginal coefficient as a test of
    a joint prediction, and that the apparent rescue row is the strongest
    rejection in the sweep. My own control nearly produced the opposite of the
    right answer, and only a joint test recovered it.
    (2) D-1 IS AN ALGEBRAIC IDENTITY THE WHOLE PACKAGE MISSED, INCLUDING ME. I
    dispatched the validator with the intercept as priority question 1 because I
    judged it the claim I was most likely to over-read; that judgement was right
    and the answer was worse than I expected -- not merely over-read but
    information-free as stated.
    (3) D-6 IS CORROBORATION IN THE STRICT SENSE. I computed the participation
    ratio and the deletion diagnostic before reading the validator and
    deliberately did not tell it, so that agreement would mean something. Both
    parties independently obtained 33.0 and 73.4.
    (4) D-2 INDICTS MY BATCH DESIGN, NOT ONLY THE PRODUCER'S FRAMING. Section 3b
    was in the archive I told the producer to read, and I did not point at it.
    (5) D-10 IS MINE OUTRIGHT. I froze a three-path artifact contract that made it
    impossible for the producer to archive stdout, stderr or a machine-readable
    resource receipt, and then the package failed AGENTS.md's artifact policy for
    exactly that reason. Fixed by widening the declared list, not by the producer.
    (6) D-8 IS AN INHERITED DEFECT WORTH MORE THAN ITS SEVERITY LABEL. BATCH-015's
    N1 "Poisson" generator is a rounded Gaussian for lambda >= 30, covering 205 of
    301 cells. It is immaterial here at under 0.5 percent, but it is undisclosed
    in two packages and propagates to anything reusing that module.
    (7) THE VALIDATOR REPORTED THAT n=50 REJECTS THE FLOOR MEMBER TOO, WHICH CUTS
    IN THE PACKAGE'S FAVOUR, while simultaneously destroying the package's own
    n=50 sentence. Reporting both directions is the conduct this harness wants.

  hypothesis_status_changes: []
  hypothesis_status_note: >-
    No hypothesis moves. A sub-Poisson dispersion deficit on one toy-dimension
    file, with an unidentified mechanism, a contrary second file, and a null
    family that omits the cross-cell dependence the physical process has, carries
    no transition in either direction.

  rule_12_status: >-
    UNMET AND UNWAIVED. Nothing here changes EV-MLKEM-011, EV-MLKEM-013 or
    EV-MLKEM-017; KN-FIND-031 stays withdrawn.

  binding_instructions_for_this_goal:
    - >-
      NO PER-CELL REGRESSION COEFFICIENT WITHOUT ITS EFFECTIVE DESIGN SIZE. Report
      the participation ratio 1/sum(w^2) of the information weights beside any
      slope, and do not describe a regression as having the resolution of its cell
      count until that number is quoted. n=43's slope has 33 effective cells of
      301 and flips sign when 5 of them are dropped. This is the eighth binding
      and it is the same lesson as the second: BATCH-013 retired the whole-band
      statistic for carrying O(1) effective degrees of freedom against 1803 rows,
      and this program has now made that error twice in five batches.
    - >-
      A MARGINAL COEFFICIENT IS NOT A TEST OF A JOINT PREDICTION. The floor member
      predicts the PAIR (slope, intercept) = (-1, +1); testing the slope alone
      inverted the verdict on an entire row of the degree sweep. Any null that
      predicts more than one coefficient is tested jointly or not at all.
    - >-
      BEFORE CALLING A RESULT NEW, GREP THE PRIOR BATCH'S OWN REPORT FOR IT. W-5's
      intercept "surprise" was in BATCH-016 section 3b at a stronger |z|. This
      applies to the Coordinator writing handoffs as much as to producers.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      `refine` on `preliminary` evidence fails the gate, which needs `support` or
      `reject_scoped` at `replicated` or `strong`. Two transferable candidates are
      named here so the next batch inherits them rather than rediscovering them:
      first, that a regression's nominal cell count can overstate its effective
      design size by an order of magnitude, with the participation ratio of the
      information weights as the diagnostic and a deletion test as the confirmation;
      second, that testing a multi-coefficient null through one marginal coefficient
      can invert the verdict, as it did here on the one degree that appeared to
      rescue the floor member. Neither is promotable on one execution plus one
      validation, and promoting a methodological rule about premature belief on a
      single unreplicated pass would be the error the rule describes.
    promote: false

  non_claims:
    - ML-KEM is not broken. Nothing here bears on ML-KEM security in either direction.
    - KN-OPEN-016 remains open.
    - >-
      Approximation 4.9 is NOT validated and NOT refuted by this batch. This batch
      measured the dispersion of the archived counting process, not the model.
    - >-
      The MECHANISM of the sub-Poisson deficit is NOT identified. Occupancy and
      score position are perfectly confounded by this design.
    - >-
      "Below the floor" means below a floor computed under an independence
      assumption the physical process does not satisfy. Neither null carries
      cross-cell dependence.
    - No asymptotic claim advanced. No closure quorum asserted.

  next_actions:
    - >-
      BATCH-018, zero new sampling: build the JOINT null and re-test the
      low-occupancy deficit against it. The validator named the gap precisely --
      N2 is the PER-CELL minimum-variance member, not the joint one, and neither
      N1 nor N2 carries any cross-cell dependence, while the physical process
      couples cells within an iteration. A sub-Poisson deficit measured against a
      null that assumes independence across cells is exactly what cross-cell
      negative dependence would produce, so the deficit may be a property of the
      null family rather than of the data. Resample WHOLE ITERATIONS -- a
      multinomial allocation across cells preserving each iteration's total --
      and re-run the 164-cell low-occupancy test and the model-free detrended
      var/mean against it. Pair it with the one identification move this design
      allows: n=43 and n=50 map occupancy onto score position differently (max
      occupancy 0.739 against 0.227), so cells matched on POSITION but differing
      in OCCUPANCY across the two files partially break the confound that W-8
      records. Widen the declared artifact list to include stdout, stderr and a
      machine-readable resource receipt, closing D-10. Require an independent
      validation in the same batch.

