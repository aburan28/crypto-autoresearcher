  status_judgement:
    ruling: >-
      GOAL-MLDSA-001 remains `active`. No declared pause_condition is met.
    per_condition:
      - condition: >-
          "The six-batch campaign budget is exhausted without an admissible
          next mechanism."
        met: false
        reason: >-
          Three batches have run (BATCH-001, BATCH-66b482, BATCH-214d98) against
          maximum_batches 6, and an admissible next mechanism exists that is
          blocked on PROCESS rather than on anything: the Kosuge & Xagawa
          candidate (ASIACRYPT 2025 / ePrint 2025/904), classified
          "content-ready, process not source verification", and the
          KN-LIT-4dadec citation_verified partial -> read upgrade, classified
          "process only". Both are recorded in
          coordination/goals/GOAL-MLDSA-001/batches/BATCH-001/tasks/TASK-20260807-dcfaee/reconciliation.md
          sections 2(b), 6a and its summary table.
      - condition: >-
          "Neither the FIPS 204 text nor the primary fault-security proof can be
          obtained under the network policy after the declared
          source-preference order is exhausted."
        met: false
        reason: >-
          This condition is conjunctive and requires BOTH to be unobtainable.
          Both were in fact obtained at least in part: FIPS 204 is filed at
          KN-LIT-4dadec and its full 65-page text was subsequently read (the
          basis of the pending partial -> read upgrade), and the primary
          fault-security proof KN-LIT-3907 was identified as ePrint 2023/246 and
          its abstract read from the primary page (DEC-20260805-64abe7). Only
          the 2023/246 PDF full text is blocked.
      - condition: >-
          "The decisive computation exceeds the declared campaign budget after
          cheaper falsification gates are exhausted."
        met: false
        reason: >-
          No decisive computation has been attempted or costed. Lane A stopped
          on source access, not on compute cost (DEC-20260805-79d745).
      - condition: >-
          "A definitive infrastructure, authentication, or dependency blocker
          prevents the next approved task."
        met: false
        reason: >-
          This is the closest condition and the one that would justify `paused`,
          so it gets the most careful answer. The ePrint 2023/246 HTTP 403 IS a
          definitive-looking infrastructure blocker, and under AGENTS.md rule 5
          it is infrastructure signal and never evidence about the CMA-to-NMA
          tightness factor. But it blocks LANE A's next task, not "the next
          approved task" of the goal: the two process-blocked filing items above
          need no access to 2023/246 at all. A goal with an unblocked,
          admissible, already-identified next action is not blocked, and
          recording it as `paused` would understate it -- which AGENTS.md's
          goal-status discipline names as its own failure mode, symmetric with
          overclaiming.
    interaction_with_dec_20260805_79d745:
      ruling: >-
        DEC-20260805-79d745's "No new batch authorized under this constraint"
        is read as scoped to the constraint it names -- ePrint 2023/246 PDF
        access, i.e. Lane A / EXP-MLDSA-3f7ab2 -- and NOT as a blanket freeze on
        the goal. A literature-filing batch that touches neither 2023/246 nor
        Lane A does not run under that constraint and is therefore not covered
        by that refusal.
      disclosure: >-
        That is an interpretive Coordinator ruling made here, not a self-evident
        reading of the record, and it is recorded as such so a reviewer can
        contest it on the merits. Lane A itself stays DEFERRED, exactly as
        DEC-20260805-79d745 left it; nothing in this decision lifts that
        deferral, resumes EXP-MLDSA-3f7ab2, or changes H-MLDSA-d1e509's
        inconclusive status.

  orphaned_commit_provenance:
    finding_id: D5
    severity: disclosed_provenance_no_impact_on_conclusions
    headline: >-
      The two commit pointers recorded inside BATCH-001's own ledger records are
      NOT mis-transcriptions and were NOT errors. They were CORRECT when
      written. A later rebase replayed the branch, rewrote the commits, and
      ORPHANED the originals, so the recorded shas became unreachable from
      origin/main while their content survived byte-identical on the replayed
      chain. This is the one finding here that is a real process failure rather
      than a clerical one, and it is a failure of the rebase, not of the records
      that faithfully cited what existed at the time.
    provenance_note: >-
      Established by the dispatching session on 2026-08-10 in a second
      git-enabled verification round, requested by this task and supplied to it
      as given fact. This task has no shell and re-derived none of it.
    recorded_pointers:
      - record: EV-MLDSA-faf2ec
        field: snapshot_commit
        recorded_sha: '8242344ce106e324e3f42e5b163061a251b7e9f9'
        reachable_equivalent: 'f44ffbad97856fc9170f89ce8684639427f1e1be'
        recorded_commit_is_real: true
        recorded_commit_subject: >-
          snapshot(TASK-20260805-d47e12): GOAL-MLDSA-001 BATCH-001
          lit-acquisition -- 5 proposed KN-LIT, FIPS-204 distinct from
          KN-LIT-056
        recorded_commit_committed_at: '2026-08-05T17:38:44-07:00'
        recorded_commit_parent: '8aca58a23'
        ancestor_of_origin_main: false
      - record: DEC-20260805-0d59ff
        field: context ("Reviews at 4f080b385")
        recorded_sha: '4f080b385'
        reachable_equivalent: 'aa1567c2fe7bc75ec4284b1523e7d7cc5882b96b'
        recorded_commit_is_real: true
        recorded_commit_subject: >-
          coord: GOAL-MLDSA-001 BATCH-001 reviews VAL-5b8a06(accept_qual)
          RT-9f2d71(pass_constraints)
        recorded_commit_committed_at: '2026-08-05T17:48:40-07:00'
        recorded_commit_parent: '8242344ce'
        ancestor_of_origin_main: false
    evidence_that_this_was_a_rebase:
      - >-
        Both recorded commits exist and both are NOT-ancestor of origin/main,
        verified with `git merge-base --is-ancestor`. They are orphaned, not
        imaginary.
      - >-
        The orphaned pair chains to itself exactly as the live pair does:
        8aca58a23 -> 8242344ce (snapshot) -> 4f080b385 (reviews), mirroring
        1245602e1 -> f44ffbad9 (snapshot) -> aa1567c2f (reviews). The
        snapshot-before-review ordering holds on BOTH chains.
      - >-
        The three commits on main (f44ffbad9, aa1567c2f, c37bb2c9d) all carry
        the IDENTICAL committer timestamp 2026-08-05T17:52:11-07:00, which is
        the signature of a replay rather than of three separately authored
        commits. The orphaned originals carry distinct, earlier, plausibly
        spaced timestamps (17:38:44 and 17:48:40).
      - >-
        8242344ce changed EXACTLY the same 6 paths as f44ffbad9, and 4f080b385
        changed EXACTLY the same 3 paths as aa1567c2f.
      - >-
        Blob-level identity was checked, not just path identity:
