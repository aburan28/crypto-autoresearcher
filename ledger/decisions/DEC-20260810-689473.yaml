          recorded_in: GOAL-MLDSA-001.latest_verified_commit (set by this decision)
          scope: BATCH-214d98 ledger archive
          ancestor_of_origin_main: true
          verdict: reachable_no_action_needed
      why_the_scoping_matters: >-
        BATCH-66b482's review pointer being reachable is a real tightening, not
        merely a loose end closed. It bounds the damage: the rebase rewrote the
        BATCH-001 chain and stopped there, so this goal has exactly two
        unresolvable recorded shas and both are mapped above. Without the check
        the honest position would have been that an unknown number of this
        goal's pointers might be orphaned.
    what_was_not_checked: >-
      Whether a pre-rebase equivalent of the BATCH-001 ledger commit c37bb2c9d
      exists was not reported to this task and is NOT asserted either way. No
      pointer outside the four counted above was examined, and nothing is
      claimed about any of them in either direction.
    why_this_matters: >-
      This is precisely the failure mode AGENTS.md "Durable research commits"
      forbids by name -- "Rebasing a branch that carries pushed run records is
      forbidden: it rewrites the commits those records were archived in, and a
      run receipt whose commit no longer exists is not reproducible" -- and that
      CLAUDE.md records as having already cost five goals unresolvable
      latest_verified_commit values (CORR-20260802-a1f151). GOAL-MLDSA-001's
      BATCH-001 is another instance. The rule is not advisory and the cost here
      is concrete: two committed, immutable ledger records now cite shas that no
      reader can resolve from origin/main without this decision.
    impact_on_batch_001_conclusions: >-
      NONE. CLAIMS ARE NOT WEAKENED. CLAUDE.md binds archive receipts to CONTENT
      first and treats commit reachability as advisory: when a commit cannot be
      reached, the declared hashes are verified against the tree and the archive
      is reported as content-verified. Here the content check is as strong as it
      gets -- identical blob shas across the two chains -- so BATCH-001's
      artifacts are fully content-verifiable and were reviewed against exactly
      the bytes that are on main today. EV-MLDSA-faf2ec, DEC-20260805-0d59ff and
      the five filed KN-LIT entries stand unchanged and unqualified. Nothing in
      this finding reopens any BATCH-001 conclusion.
    handling: >-
      EV-MLDSA-faf2ec and DEC-20260805-0d59ff are committed, immutable, and NOT
      WRONG, so they are neither edited nor superseded and no `correction`
      record is warranted: a correction record asserts a prior value was
      incorrect, and these were correct when written. The remedy is exactly this
      disclosure -- the recorded sha and its reachable equivalent recorded side
      by side in a durable decision, so any future reader can resolve either
      pointer. That mapping is the deliverable, not a repair.

