    corroborates_d1: >-
      8242344ce did NOT contain snapshot-receipt.json either. D1 therefore
      stands on BOTH chains: the receipt was never written, and the rebase did
      not eat it. This forecloses the otherwise natural hypothesis that D1 is an
      artifact of the same rebase.
    blast_radius_checked_and_counted:
      summary: >-
        FOUR pointers were checked with git. TWO are orphaned. The rebase was
        SCOPED to the BATCH-001 chain and did not orphan this goal's other
        recorded pointers. This is a counted result over the four pointers
        actually checked and is NOT generalized to any pointer nobody checked.
      pointers_checked:
        - pointer: '8242344ce106e324e3f42e5b163061a251b7e9f9'
          recorded_in: EV-MLDSA-faf2ec.snapshot_commit
          scope: BATCH-001 snapshot
          ancestor_of_origin_main: false
          verdict: orphaned
        - pointer: '4f080b385'
          recorded_in: DEC-20260805-0d59ff.context
          scope: BATCH-001 reviews
          ancestor_of_origin_main: false
          verdict: orphaned
        - pointer: '31bc801c6'
          recorded_in: DEC-20260805-4843d6.context
          scope: BATCH-66b482 reviews
