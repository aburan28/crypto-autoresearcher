coordinator_decision:
  id: DEC-20260810-689473
  goal_id: GOAL-MLDSA-001
  batch_id: BATCH-001
  recorded_at: '2026-08-10'

  decision: reconcile_bookkeeping_and_goal_head
  decision_label: >-
    GOAL-MLDSA-001 BATCH-001 archival bookkeeping reconciled against verified
    commit history, and the GOAL-MLDSA-001 goal head un-staled. The BATCH-001
    archival chain DID execute in the correct order as three isolated commits;
    four declaration-versus-reality deviations are enumerated below, two of
    them permanent. The root cause of three days of stale queue and goal-head
    state is D4: the ledger-archive task card omitted dispatch_queue.json from
    its scope. Both archive task cards are marked `invalid` because `completed`
    is provably unreachable for them under any honest declaration. BATCH-001's
    research chain -- EV-MLDSA-faf2ec, DEC-20260805-0d59ff, and the five filed
    KN-LIT entries -- is UNAFFECTED and is not reopened. GOAL-MLDSA-001 stays
    `active`; no declared pause_condition is met.

  context: >-
    TASK-20260807-dcfaee reconciled exactly one dispatch-queue field
    (TASK-20260805-a1c3f9 queued -> completed) and then explicitly deferred two
    things its tool surface could not do: reconciling the four remaining queue
    entries against actual commit history, and reconciling the goal head. It
    recorded both as recommendations rather than fabricating hashes, which is
    the correct refusal under AGENTS.md rule 9. This decision discharges both
    deferrals. It is bookkeeping and disposition only: it creates no hypothesis,
    runs no experiment, files no knowledge entry, changes no hypothesis status,
    and makes no assessment of ML-DSA, MLWE, MSIS, or SelfTargetMSIS in either
    direction. Authorising task: TASK-20260810-56605e (ledger/handoffs/).

