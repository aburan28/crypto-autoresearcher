          BATCH-214d98 is the goal's most recent batch.
      latest_verified_commit:
        from: null
        to: '7ef705ca51c5861a14461085967413209a7934da'
        reason: >-
          The goal's latest committed ledger archive, verified reachable from
          origin/main by the dispatching session on 2026-08-10, committed
          2026-08-05T20:03:31-07:00, subject "ledger: GOAL-MLDSA-001 --
          DEC-20260805-79d745 Lane A deferred (PDF blocked); KN-FIND-720727
          Shin+Jendral outside formal model; pivot to GOAL-HAWK-001". The field
          held null even though three ledger archives had landed.
      next_action:
        from: >-
          "BATCH-001 is queued and dispatch-ready ... Run TASK-20260805-a1c3f9
          ... and the ledger archive (TASK-20260805-c60b84) that records
          EV-MLDSA-7e91a4 and DEC-20260805-3d5f82"
        to: >-
          One concrete action: open a single scoped literature-filing batch for
          the two PROCESS-blocked items, with the Lane A deferral and the
          blocked item (c) named as exclusions. Full text is in the goal record.
        reason: >-
          The prior text was flatly contradicted by committed state on three
          counts: it described a completed batch as queued and dispatch-ready;
          it directed a session to run TASK-20260805-a1c3f9, which had already
          completed and been reviewed; and it named two record IDs
          (EV-MLDSA-7e91a4, DEC-20260805-3d5f82) that were never minted. Any
          session waking on this goal would have been sent to redo BATCH-001.
      next_action_superseded:
        change: >-
          Converted from a single mapping to an append-only list, oldest first,
          each entry keeping the original prior_text/reason shape. The
          2026-08-05 supersession is preserved verbatim rather than being
          overwritten by the 2026-08-10 one; a goal head that records only its
          most recent supersession loses the history the field exists to keep.
      updated_at:
        from: '2026-08-05'
        to: '2026-08-10'
    fields_deliberately_not_changed:
      status: >-
        Left `active`. See status_judgement below.
      dispatch_queue_path: >-
        Left pointing at
        coordination/goals/GOAL-MLDSA-001/batches/BATCH-001/dispatch_queue.json.
        It is outside this task's declared write scope for the goal record
        (four named fields plus next_action_superseded), and there is no
        alternative queue to point it at: BATCH-66b482 and BATCH-214d98 have no
        dispatch_queue.json in the tree, and the next batch's queue does not
