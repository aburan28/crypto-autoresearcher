  ordering_fact: >-
    The parent chain 1245602e1 -> f44ffbad9 -> aa1567c2f -> c37bb2c9d is itself
    the proof of ordering: the snapshot commit is the parent of the reviews
    commit, and the reviews commit is the parent of the ledger commit. The
    snapshot therefore preceded independent review, and independent review
    preceded the ledger archive. AGENTS.md "Durable research commits" -- freeze
    the producer package before a reviewer reads it, then commit the ledger
    after the reviews -- was MATERIALLY HONOURED by BATCH-001, in three
    isolated commits, not one. This is the single most important finding of
    this reconciliation, because it is what separates a bookkeeping defect from
    an evidence-integrity failure. What follows are defects in the DECLARATIONS
    about those commits, not in the discipline the commits implemented.

  deviations:
    D1:
      severity: permanent_uncorrectable
      task_id: TASK-20260805-d47e12
      finding: >-
        The declared artifact
        coordination/goals/GOAL-MLDSA-001/batches/BATCH-001/archives/TASK-20260805-d47e12/snapshot-receipt.json
        was never written and is absent from commit f44ffbad9. The
        BATCH-001/archives/ directory does not exist in the working tree at all.
      why_uncorrectable: >-
        That task card's own constraint required the receipt to be committed
        INSIDE the commit it describes (which is also why it correctly carries
        commit_sha: null). Commit f44ffbad9 is immutable, so the receipt can
        never be placed inside the commit it was contracted to describe.
        Writing it now, into a later commit, would produce a document that
        looks like a snapshot receipt and is not one.
      disposition: >-
        Not repaired. TASK-20260805-d47e12 set to `invalid` in
        dispatch_queue.json. `invalid` is the honest terminal state for a task
        whose declared deliverable can no longer be produced; it says nothing
        about the snapshot commit, which is valid, ordered, and exact-scoped.
      corroborated_by: >-
        D5 (orphaned_commit_provenance). The pre-rebase original of the
        snapshot commit, 8242344ce, did not contain snapshot-receipt.json
        either. The receipt was never written on EITHER chain, so D1 is a
        genuine omission and not an artifact of the rebase that orphaned those
        commits. The disposition above is unchanged by that check; it is
        strengthened by it.
    D2:
      severity: clerical_corrected
      task_id: TASK-20260805-a1c3f9
      finding: >-
        The task card's artifact_paths declared 5 files; commit f44ffbad9
        committed 6, the extra being the task's own receipt.yaml. The
        declaration was under-inclusive of what was actually archived.
      disposition: >-
        Corrected in dispatch_queue.json: receipt.yaml appended to
        TASK-20260805-a1c3f9's artifact_paths so the declaration matches the
        committed set. The task's state remains `completed`, as
        TASK-20260807-dcfaee already set it.
    D3:
      severity: clerical_corrected
      task_id: TASK-20260805-9f2d71
      finding: >-
        The task card's artifact_paths declared
        reviews/TASK-20260805-9f2d71/red_team_report.md. What commit aa1567c2f
        actually contains is red_team_report.yaml (different extension) PLUS
        falsification_review.md (undeclared). The red-team task produced two
        artifacts in a different format from the one declared.
      disposition: >-
        Corrected in dispatch_queue.json: red_team_report.md replaced by
        red_team_report.yaml and falsification_review.md. This is a naming and
        completeness correction to a declaration; it does not touch either
        committed artifact, and neither review verdict changes
        (validator accept_with_qualifications, red team pass_with_constraints,
        both as recorded in EV-MLDSA-faf2ec and in the aa1567c2f subject line).
    D4:
      severity: permanent_uncorrectable
      task_id: TASK-20260805-c60b84
      is_root_cause: true
      finding: >-
        Four separate declaration failures in one card. (i) The declared
        artifact archives/TASK-20260805-c60b84/ledger-receipt.json was never
        written and is absent from commit c37bb2c9d. (ii) The card's planned
        record IDs EV-MLDSA-7e91a4 and DEC-20260805-3d5f82 were NEVER MINTED;
        the archive actually recorded EV-MLDSA-faf2ec and DEC-20260805-0d59ff.
        (iii) Commit c37bb2c9d committed five knowledge/literature/KN-LIT-*.md
        files that were outside the card's declared artifact_paths -- a
        scope expansion that the card's own constraint anticipated and required
        be handled by amending write_scope/artifact_paths FIRST, which did not
        happen. (iv) The card OMITTED
        coordination/goals/GOAL-MLDSA-001/batches/BATCH-001/dispatch_queue.json
        from its artifact_paths even though it appears in its write_scope and
        its deliverables list ("dispatch_queue.json at its terminal state").
      root_cause_finding: >-
        (iv) is the root cause of everything TASK-20260807-dcfaee was convened
        to fix. Because the terminal queue state was never staged in the ledger
        archive, every downstream entry still read `queued` three days after
        the work completed, which in turn made BATCH-001 look dispatch-ready to
        every session that read the queue, which is the same reason the goal
        head still pointed at BATCH-001. One omitted path in one declared
        artifact list produced three days of contradiction between the
        coordination records and committed reality.
      why_uncorrectable: >-
        Same immutability argument as D1 for (i). For (ii), AGENTS.md rule 15
        forbids the repair anyone would reach for first: EV-MLDSA-7e91a4 and
        DEC-20260805-3d5f82 must NOT be retroactively minted to match the plan,
        and the real records EV-MLDSA-faf2ec / DEC-20260805-0d59ff must NOT be
        remapped to match the card. The plan was superseded by reality; the
        real records stand and the card is the thing that is wrong.
      disposition: >-
        Not repaired. TASK-20260805-c60b84 set to `invalid` in
        dispatch_queue.json. Its archive.record_ids are left holding the two
        never-minted planned IDs EXACTLY as written, unfilled and uncorrected,
        because that list is the historical record of what was planned, and
        because a non-completed archive block is not a verified one. Readers are
        directed to this decision for the mapping planned -> actual.

  tested_reachability:
    provenance_note: >-
      These are RESULTS of runs of tools/research_dispatch.py performed by the
      dispatching session on 2026-08-10, supplied to this task as given fact.
      They are not predictions and this task did not run the dispatcher itself.
    candidate_a_accepted:
      description: >-
        Reviews TASK-20260805-5b8a06 and TASK-20260805-9f2d71 set to
        `completed`, the D2 and D3 artifact_paths corrections applied, and BOTH
        archive tasks (TASK-20260805-d47e12, TASK-20260805-c60b84) set to
        `invalid`.
      result: >-
        Dispatcher exits 0. All five tasks terminal. Zero ready, zero deferred.
        This is the configuration written to dispatch_queue.json by this task.
    candidate_b_rejected:
      description: >-
        TASK-20260805-d47e12 set to `completed` with the real
        commit_sha/parent_sha/path_sha256 filled in and the never-written
        snapshot-receipt.json dropped from artifact_paths.
      result: >-
        REJECTED: "tasks[1].artifact_paths must be a nonempty text list".
    candidate_c_rejected:
      description: >-
        The never-written receipt KEPT in artifact_paths while the task is
        marked `completed`.
      result: >-
        REJECTED: the commit fails the exact-scope check -- the declared
        receipt is missing from the commit and the undeclared receipt.yaml is
        present in it.
    conclusion: >-
      `completed` is UNREACHABLE for both BATCH-001 archive tasks under any
      honest declaration: dropping the missing receipt empties a list the
      schema requires to be nonempty, and keeping it fails exact-scope
      verification against the immutable commit. `invalid` is therefore not a
      judgement call dressed up as one, it is the only terminal state the
      tooling and the truth jointly permit. Recorded here as a TESTED fact so
      that a future session does not spend a second reconciliation task
      rediscovering it.

  what_is_unaffected: >-
    BATCH-001's research chain is sound and is NOT reopened by this decision.
    The producer package was frozen before review (f44ffbad9), two independent
    reviews were committed against that frozen package (aa1567c2f), and the
    evidence, decision, and knowledge entries were committed after those
    reviews (c37bb2c9d). Specifically unaffected and still standing:
    EV-MLDSA-faf2ec (strength preliminary, claim_tier literature_survey,
    proof_status empirical_only); DEC-20260805-0d59ff and its three red-team
    gate rulings; and the five filed literature entries KN-LIT-180ad5,
    KN-LIT-340675, KN-LIT-4dadec, KN-LIT-4f3b80, KN-LIT-8ce0b5. Marking two
    coordination task cards `invalid` for missing receipts is a statement about
    those cards, not about the artifacts they failed to describe. No claim
    tier moves, no hypothesis status changes, and RQ-MLDSA-001's
    toy/until-certified ceiling stands untouched. The orphaned commit pointers
    in D5 do not qualify any of this either: the orphaned and live chains hold
    byte-identical blobs, so the reviewers read exactly the bytes that are on
    main today, and the archive is content-verified in CLAUDE.md's sense even
    though two recorded shas are no longer reachable.

