    not_warranted: >-
      No KN-TECH entry is minted at this close. The rank pre-screen
      control (F-2's cheapest fix) is a screening idea, untested as a fix;
      the primitive-dependent mask mechanism (F-3) is measured but not
      independently re-derived -- the paused red team owns the
