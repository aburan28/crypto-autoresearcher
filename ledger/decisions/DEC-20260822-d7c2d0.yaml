  goal_id: GOAL-MD5-001
  batch_id: BATCH-ebac02
  question_id: RQ-MDFIVE-6870c1
  recorded_at: '2026-08-22'
  recorded_by_task: TASK-20260822-554f6d
  opening_decision: DEC-20260822-85784e
  parent_close: DEC-20260822-40bf14
  decision: close_batch_with_composed_review
  decision_label: >-
    CLOSE BATCH-ebac02 (batch 6 of 7) with the review round composed as
    recorded: validator joints V1-V4 all PASSED (V1 via the scoped
    completion pass TASK-20260822-7f5ed3, 7600/7600 exact integer
    agreement); red team FAILED (infrastructure) with the tier PAUSED per
    the committed amendment, its joints R1-R3, the proves-too-much controls,
    and the blind re-derivation UNEXECUTED and named as such. Routing
    answer: CONSTRUCTION, primitive-dependent. No hypothesis status change
    (H-MDFIVE-0ca596 remains `weakened` as set at DEC-20260822-40bf14).
    Claim ceiling for every batch-6 record: `analyzed`, never `supported`.
    Batch 7 (the final batch) is GATED on the red-team resume or an explicit
    operator decision to accept the pause.
  batch_state: closed
  target_ids:
    - H-MDFIVE-0ca596
    - RQ-MDFIVE-6870c1
    - EXP-MDFIVE-8f0fe3
    - EV-MDFIVE-b0def7
  context: >-
    Batch 6 existed to answer, BEFORE ANY CONSTRUCTION REDESIGN, which of
    three cheap-to-expensive objects is the binding defect for the batch-5
    negative: the SEED (cheap re-draw), the CRITERION (cheap, RC-3), or the
    CONSTRUCTION (expensive). Phase 1 delivered the RC-1 fixed-word-seed
    distribution (100 seeds per primitive, 32-bit and 12-bit resolution,
    plus the CTL-PO5 raw candidate count) and the corrected RC-4 static
    (y XOR z) mask check under all eight binding terms (a)-(h) of
    DEC-20260822-40bf14 next_actions item 3, snapshotted by the
    TASK-20260822-b325fe content_first receipt (commit 55e316276), and
    reviewed under the pre-committed review-plan-87c429.yaml.
  rationale:
    - id: F-1
      finding: >-
        COMPOSED ROUND, joint by joint. V1 (mechanical replication):
        INCOMPLETE in VAL-20260822-40389d solely on the cold re-run -- the
        session's run_command calls all sent the command argument as a
        JSON-array string (a glm-5.2 wire-format quirk), were rejected
        unjournaled, and consumed the first run's entire step budget; the
        runtime now coerces that shape (commit 3e23db8d8, regression
        tested). The scoped successor TASK-20260822-7f5ed3 (same policy,
        same backend, independent session, 25 steps, 224.483 s) re-executed
        the frozen driver (sha256 4aa7b6f0... verified against the snapshot
        receipt) in four fresh processes and matched ALL 7600 compared
        per-seed integers exactly, zero mismatches: V1 PASSED. The
        internal-consistency verification of the original report (summary
        recomputation from per-seed raw, batch-5 seed reproduction 9/4,
        determinism double-run) stands as the report's own V1 substance.
        V2 (artifact/seed/manifest integrity): PASSED -- all six run
        directories complete, code_path_fingerprint present in all six
        manifests (the batch-5 IR-8 defect is fixed), armed deadlines,
        100 seeds per primitive, snapshot commit verified reachable with
        the expected parent. V3 (criterion compliance, terms a-h): PASSED
        -- all seven applicable terms verified from source and raw
        artifacts, not from the report's self-assessment. V4 (scope
        discipline): PASSED -- no construction redesign (BASE_PARAMS =
        R1_SEP10 verbatim), MD5 arm parameter-symmetric, ceiling held at
        analyzed, zero quarantined reads. R1, R2, R3, the proves-too-much
        controls, and the blind re-derivation of the injectivity threshold:
        UNEXECUTED (F-4).
      evidence_refs:
        - coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/reviews/TASK-20260822-40389d/validation-report.yaml
        - coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/reviews/TASK-20260822-7f5ed3/validation-report-v1.yaml
        - coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/reviews/TASK-20260822-7f5ed3/comparison-result.json
    - id: F-2
      finding: >-
        ROUTING ANSWER: CONSTRUCTION, primitive-dependent. SEED is
        REFUTED for MD4 at the 12-bit dimension: 1 of 100 seeds meets the
        declared injectivity threshold (12 of 16), the maximum observed is
        15, and the derived GF(2) rank of the four single-bit toggle
        vectors is <= 1 for 48 of 100 seeds (17 of 100 rank 0) -- a seed
        re-draw cannot buy back rank that the construction's window does
        not carry. CRITERION is NOT the binding object: it was applied at
        both resolutions with the pre-declared eps (0.25) and it is
        discriminating correctly -- MD5 reaches 16/16 at 32 bits for all
        100 seeds, so the threshold is not miscalibrated, it is detecting
        real structure where the structure exists. CONSTRUCTION is the
        binding defect, scoped by primitive: for MD4 the 12-bit forward
        window is structurally rank-deficient under the batch-5
        construction (consistent with the RC-4 mask mechanism, which
        adjudicated 605 departures with 73 of 400 positions
        carry-rescued/cancelled); for MD5 the forward distinctness is NOT
        the binding obstruction (65 of 100 seeds at the 12-bit threshold,
        median 13, rank 4 at 32 bits for all 100) -- MD5's binding
        obstruction sits at the raw candidate-count dimension (CTL-PO5
        median 12 against a healthy expectation of order 1; 52 of 100
        seeds at or above the declared ceiling 4). The cheapest identified
        fix is a rank pre-screen of candidate (component, window) pairs --
        screening for windows whose toggle vectors span, before any
        split-point search -- and it is a screening control, not yet a
        tested fix.
      evidence_refs:
        - EV-MDFIVE-b0def7 (O-1, O-2, O-5)
        - coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/tasks/TASK-20260822-767bb1/execution-report.yaml (routing_answer block)
        - coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/tasks/TASK-20260822-767bb1/derived-analysis-b6.json
    - id: F-3
      finding: >-
        COORDINATOR PRIOR VS OUTCOME, recorded per the review architecture
        (the prior is in review-plan-87c429.yaml, written before any
        reviewer ran). The prior expected the 12-bit forward distribution
        to concentrate at the low end on BOTH primitives -- the F-
        multiplexer mask kills the free word's varying bits, not the seed
        choice -- and declared the falsifier: >= 50% of seeds at the
        threshold on either primitive flips the routing to SEED. OUTCOME:
        the prior is CONFIRMED for MD4 (1% at threshold) and OVERTURNED
        for MD5 (65% at threshold, median 13). A prior the review
        overturns is a first-class result: the mask mechanism does not
        act uniformly across the MD4/MD5 pair, and the mechanism story
        (which of the two batch-5 candidate mechanisms explains the
        collapse) must be re-scoped as primitive-dependent before batch 7
        spends its budget on a construction change. The routing answer
        survives the overturn because it is scoped per primitive; the
        mechanism is not yet scoped.
      evidence_refs:
        - coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/review-plan/review-plan-87c429.yaml (coordinator_prior)
        - EV-MDFIVE-b0def7 (O-1, O-2)
    - id: F-4
      finding: >-
        RED TEAM FAILED (infrastructure); the tier is PAUSED, and this
        close composes a round with a named unexecuted half. api_direct
        refuses the role by design (web_search capability requirement);
        codex_cli has no review-adversarial binding (a binding is an
        operator assertion and none was minted); claude_code has no
        credentials. The committed amendment
        (inference-amendment-TASK-20260822-87c429.yaml, commit aae8cbddc)
        authorized the opencode-subagent route on zai/glm-5.2 with the
        depth gap recorded. That dispatch ran 16 protocol-conform steps
        (the session record shows the blind re-derivation discipline
        observed: frozen criterion read first, the sweep module avoided
        until after) and died on its final synthesis turn -- the opencode
        zai provider limit.output=32000 truncated the turn (final step:
        32000 reasoning + 1 output tokens, finish reason 'length'),
        yielding an empty final message, an empty task_result, and no
        report file. Per the amendment's own fallback clause the review
        is recorded FAILED (infrastructure) and the red-team tier is
        PAUSED -- not substituted, not downgraded further, not retried on
        the degraded route by this Coordinator. CONSEQUENCES, stated
        rather than absorbed: (1) joints R1-R3 (interpretation, cost
        model, scope), the proves-too-much controls, and the blind
        re-derivation of the injectivity threshold are UNEXECUTED; (2) the
        threshold 12/16 at eps=0.25 therefore rests on the frozen
        contract's declaration plus V3's verification of its application,
        without the independent re-derivation the round assigned to the
        red team; (3) EV-MDFIVE-b0def7's strength is `single_run`, not
        `replicated`, for exactly this reason; (4) the routing answer is a
        recommendation at the `analyzed` ceiling, and batch 7's expensive
        option (construction change) is gated on the resume below. RESUME
        CONDITIONS, any one: (a) a claude_code runtime with credentials
        providing web_search and verified max reasoning; (b) a codex_cli
        API-mode binding for review-adversarial minted by the operator;
        (c) a NEW committed amendment authorizing a further opencode
        attempt only after the operator verifies/raises the zai output
        limit and the depth configuration -- this Coordinator does not
        self-authorize a retry on a route whose failure it did not cause.
      evidence_refs:
        - coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/inference-amendment-TASK-20260822-87c429.yaml
        - coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/dispatch_queue.json (87c429 entry, state_update_20260822b)
        - opencode session record ses_fd312f1bfffeVEE3hM5eUALESE (16 steps; final step-finish reason 'length', 32000 reasoning tokens)
    - id: F-5
      finding: >-
        EXECUTOR SUBSTITUTION ADJUDICATED: ACCEPTED AS A RECORDED DEVIATION,
        not as conformance. The validator flagged it correctly: the
        handoff carried degraded_allowed: false, and phase 1 was performed
        by the driving Coordinator session after three executor-subagent
        dispatches returned empty task_results with zero bytes written.
        Grounds for acceptance: (1) the failure mode is an infrastructure
        failure of the subagent runtime, and AGENTS.md rule 5 makes such a
        failure non-evidentiary about the measurements; (2) the frozen
        contract was honored verbatim -- construction, seed schedule,
        gates, deadlines, controls, and write scope were all executed as
        written, and V2/V3/V4 verified that from the artifacts rather than
        from the report's self-assessment; (3) every deviation is disclosed
        in the execution report (DEV-1 through DEV-5, including the RC-4
        trace-model correction and its regeneration); (4) the
        independence safeguard the substitution could have compromised is
        intact and was in fact exercised: the review ran in separate
        sessions on the declared policy, sibling-blind, with attested
        reads; (5) the measurements are deterministic pure computation
        under the declared seeds, and the independent cold re-run
        reproduced every integer (F-1). What is NOT accepted: that the
        substitution is costless. The process deviation is recorded with
        its cost -- a batch's producer and its reviewer-supervisor were the
        same session, and the only thing between that shape and a
        self-certified batch was the review itself. The three subagent
        dispatch failures (plus the fourth, the red-team's, F-4) are an
        infrastructure finding about this deployment's subagent runtime,
        recorded here so the next Coordinator does not re-discover it by
        burning dispatches.
      evidence_refs:
        - coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/tasks/TASK-20260822-767bb1/execution-report.yaml (DEV-1, DEV-4)
        - coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/reviews/TASK-20260822-40389d/validation-report.yaml (limitations block)
    - id: F-6
      finding: >-
        PROVENANCE CORRECTION OF VAL-20260822-40389d, recorded rather than
        silently absorbed. The original report's inference block states
        the session was "a Claude Code session" and that the resolved
        model was "NOT RESOLVED THROUGH THE ADAPTER". Both are wrong: the
        runner log header and runtime-resume1/inference-receipt.json
        record review-adversarial -> zai:glm-5.2 (effort xhigh -> wire
        max) on the api_direct runtime, with the independent-session
        requirement satisfied. The model self-described its own
        deployment incorrectly; the authoritative record is the runner's,
        and this decision carries it. The V2-V4 verdicts, the V1
        internal-consistency substance, and the attestation block
        (read_sibling_reports: false; blindness_respected: true; no
        quarantined reads) do not depend on the mis-described block and
        stand as written. The successor report (VAL-20260822-7f5ed3) was
        instructed to quote the probe output rather than self-describe,
        and does.
      evidence_refs:
        - coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/reviews/TASK-20260822-40389d/runtime-resume1/inference-receipt.json
        - /Volumes/SSD990/llm/tmp/opencode/b6-reviews/run-40389d-resume1.log (runner header line)
        - coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/reviews/TASK-20260822-7f5ed3/validation-report-v1.yaml
    - id: F-7
      finding: >-
        BUDGET AND COST. Batch 6 declared 3000 s. Measured model wall-
        clock: validator first run 303.793 s (step-budget exhausted on the
        run_command retries that F-1 names), validator resume 398.671 s
        (completed), V1 completion 224.483 s (completed): 926.947 s of
        review compute, all within the batch ceiling. The sweep itself
        cost under 1 s per run (100 seeds, pure Python, stdlib). The
        red-team opencode attempt consumed subagent session time with no
        report produced; that cost is infrastructure waste, recorded, not
        charged to the hypothesis. Campaign authorization stands at the
        18000 s user-authorized total (DEC-20260822-85784e); batch 7
        (the final batch) retains its budget.
      evidence_refs:
        - coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/batch.yaml (budget_accounting)
        - the runner logs cited in F-1/F-4
    - id: F-8
      finding: >-
        EXPERIMENT RECORD COMPILED AT CLOSE; MANIFEST ID MAPPED, NOT
        REMAPPED. The batch-6 opening froze the phase-1 contract in the
        task card and handoff but filed no ledger experiment record; the
        executor chose the id EXP-MDFIVE-b6-phase1 at run time and it is
        baked into six sha256-bound immutable manifests (the
        TASK-20260822-b325fe snapshot receipt). Two constraints meet:
        (1) that suffix is not a well-formed ledger suffix (not 6-hex, not
        legacy 3-digit), so tools/validate_ledger.py rejects it by
        pattern and no conforming ledger record can carry it; (2) renaming
        the manifest reference would remap ids bound by a completed
        archive (AGENTS.md rule 15: a last resort, not a repair, and here
        not even that -- the bound content is not reconcilable after the
        fact). The ruling: the experiment is recorded under the minted id
        EXP-MDFIVE-8f0fe3 (allocate_id.py --check-verified), its
        specification names the manifest id under manifest_experiment_id
        as the explicit one-way mapping, and the EV and this decision
        reference the minted id with the mapping disclosed. No bound record
        is renamed; the cost of the gap (a dual-name period for one
        experiment, resolvable only by reading the mapping) is recorded
        here and on the goal head so the next opening does not repeat it:
        an experiment record with a minted id is filed at opening, BEFORE
        any run manifest may name an experiment.
      evidence_refs:
        - experiments/EXP-MDFIVE-8f0fe3/specification.yaml (compilation_note, manifest_experiment_id)
        - coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/archives/TASK-20260822-b325fe/snapshot-receipt.json
  evidence_refs:
