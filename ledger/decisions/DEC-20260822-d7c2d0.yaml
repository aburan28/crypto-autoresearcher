      The round is composed with its red-team half unexecuted (F-4); the
      routing answer and the mechanism story are recommendations at the
      `analyzed` ceiling pending the R-joints and the blind re-derivation,
      and every record citing them inherits that ceiling.
    - >-
      The derived GF(2) rank quantities (EV-MDFIVE-b0def7 O-5) and the
      HEUR-H3 counts (O-6) carry no new random draws and were
      cross-checked by an independent naive computation (0 mismatches
