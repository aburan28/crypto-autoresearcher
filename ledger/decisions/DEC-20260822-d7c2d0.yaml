      primitive-dependent) is the input to batch 7's expensive option,
      and spending that option on a recommendation its own review round
      did not finish is exactly the failure mode the red team exists to
      catch.
    - >-
      REQUIRED OF THE DRIVING SESSION AT THIS ARCHIVE -- run
      `python3 tools/check_review_independence.py --batch
      coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02` and record its
