      and refresh PR #509 naming DEC-20260822-d7c2d0, EV-MDFIVE-b0def7,
      BATCH-ebac02, and every TASK-20260822-* id including 7f5ed3.
    - >-
      NOT DONE AND NOT TO BE SILENTLY DROPPED -- carried forward from
