    - >-
      The null object's backward channel is structurally degenerate
      (O-3); RC-5 is validated on the forward channel only, and a
      successor null object with a non-degenerate backward channel is the
      named improvement if backward distinctness becomes load-bearing.
    - >-
      The quarantined payload was never read by any batch task; its
      integrity rests on the snapshot receipt's pre-freeze hash and the
      non-reading attestations, by design of the isolation clause. The
      validator's inability to re-hash it (tooling) is recorded in the
      report and does not alter that design.
  knowledge_promotion:
