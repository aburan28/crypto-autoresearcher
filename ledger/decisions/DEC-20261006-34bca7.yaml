coordinator_decision:
  id: DEC-20261006-34bca7
  context: >-
    Design-experiment gate for the top-ranked open ECC idea
    IDEA-20261005-447d82 ('Exact r-1 and r+1 Cheon divisor split on
    y^2=x^3+x+1 over F_10007', question RQ-AUXIN-f8d8c0, prio=high in
    `python3 tools/ecc_priority.py --open-ideas`; ECC-first ordering
    applies). The proposal, question, schemas, and both cited knowledge
    notes were read before designing. Fresh random-suffix IDs were minted
    and --check verified: H-AUXIN-db3163, EXP-AUXIN-3b16d3,
    DEC-20261006-34bca7, TASK-20261006-38e130, TASK-20261006-96e75e.
  decision: approve
  target_ids:
    - IDEA-20261005-447d82
    - H-AUXIN-db3163
    - EXP-AUXIN-3b16d3
  rationale:
    - >-
      Standing user authorization of 2026-09-06 ('all is approved') is the
      user-approval basis for this protocol approval. Protocol readiness
      remains a Coordinator responsibility and is discharged below.
    - >-
      The frozen contract is complete: exact source paths (proposal,
      hypothesis, question, KN-LIT-90e34c, KN-TECH-0f24d0), three controls
      (divisor-free null r_null with the d=2 ratio < 1.25 gate;
      reconstruction product checks with exact inter-implementation
      agreement; wrong-integer N±1 vs r±1 control), independent variables,
      primary/secondary metrics (N, r, cofactor, both factorizations from
      both implementations, d_minus, d_plus, B_minus, B_plus, B_rho, pinned
      ratio, null ratio, r_null), deterministic replication (two code-
      independent factorization paths, no random sampling; seeds not
      applicable with reason stated), advisory time/CPU estimates with a
      binding maximum_runs: 1, stopping and invalidation rules, a success
      criterion (pinned ratio >= 2 with null ratio < 1.25 and exact
      reconstruction), falsification criteria from the proposal, and
      required artifacts. No required field is null; status approved is
      therefore permitted.
    - >-
      The hypothesis carries the proposal's proof_search_map faithfully
      (not_applicable_reason for measurement work plus bottleneck, baseline,
      collision, quantifier, and ceiling audits), obstruction-free by
      construction (no negative lane-closure is claimed), and
      dominated_by/sota_delta honesty (ordinary discrete-log exponent
      delta 0). Every citation carries provenance with verified_by.
    - >-
      Scope is exact integer measurement at toy scale (r under 20 bits):
      no break, no protocol finding, no transfer to deployed curves, no
      Cheon execution, no auxiliary-point supply. The question's gates
      (DEC-20260802-204 acquisition gate; census is not a vulnerability
      finding) are restated in the contract's invalidation rules.
  evidence_refs:
    - ledger/proposals/IDEA-20261005-447d82.yaml
    - ledger/hypotheses/H-AUXIN-db3163.yaml
    - experiments/EXP-AUXIN-3b16d3/specification.yaml
    - ledger/questions/RQ-AUXIN-f8d8c0.yaml
    - knowledge/literature/KN-LIT-90e34c.md
    - knowledge/techniques/KN-TECH-0f24d0.md
  limitations:
    - Approval authorises the integer measurement only. It asserts nothing about Cheon's algorithm, any protocol, or any deployed curve.
    - The log-factor omission cancels in the ratio by construction; it certifies no implementation's operation count.
    - No run exists under this contract; approval is not evidence.
  next_actions:
    - Archive H-AUXIN-db3163, EXP-AUXIN-3b16d3, DEC-20261006-34bca7, TASK-20261006-38e130 in the snapshot commit (top-level session), then dispatch TASK-20261006-38e130; do not run trials from this design task.
    - Executor report under TASK-20261006-38e130 is owned by archival task TASK-20261006-96e75e.
  knowledge_promotion:
    promoted: []
    not_warranted: Unrun measurement contract. No finding to promote.
  decided_by: coordinator
  decided_at: '2026-10-06'
