  next_actions:
    - id: NA-1
      owner: coordinator
      action: >-
        Batch 3 first task, before anything else, is the CHEAPEST VALIDATING
        CHECK the red team named: emit the 9 replicate instances' (x, y) -- one
        re-run of an existing script -- and repeat the row-permutation null on
        them. Roughly ten minutes of numpy, no sieve. EITHER OUTCOME LICENSES
        THE SAME REDESIGN, which is precisely why it is the check to run first.
    - id: NA-2
      owner: coordinator
      action: >-
        Then adopt the successor design the producer named in wellposedness.md
