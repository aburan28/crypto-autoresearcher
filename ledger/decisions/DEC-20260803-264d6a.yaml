coordinator_decision:
  id: DEC-20260803-264d6a
  goal_id: GOAL-MLKEM-004
  batch_id: BATCH-f75059
  recorded_by_task: TASK-20260803-e60ce1
  authorized_by: DEC-20260803-4d4528
  recorded_at: '2026-08-03'

  decision: revise
  decision_label: >-
    Refute the batch's blindness conclusion and the Coordinator's restatement
    of it, narrow the impossibility result to the harness, record the
    campaign's first positive separation at exactly one unreplicated
    computation, and redirect batch 3 to the design the producer itself named.
  decision_vocabulary_note: >-
    `revise` and not `weaken`: a central conclusion of the batch is overturned
    in the OPTIMISTIC direction, and the batch's own headline is narrowed. The
    package's data survives intact; its interpretation does not.

  context: >-
    Batch 2 of 6 was dispatched to make the comparison against MATZOV.Nf
    well-posed after batch 1's reviews showed a naive residual would be
    meaningless. It delivered a real instrument rebuild, ten known-answer
    controls, per-group error bars, and an impossibility argument. Both reviews
    then overturned two of its three headline conclusions.

  coordinator_validity_check: >-
    Both reviews ran concurrently in independent sessions with nothing
    forwarded between them, and both reproduced the certificate and KA-6 from
    the archive rather than from the transcript. The Coordinator authored no
    interpretive note during the review window.

  what_is_revised:
    - >-
      THE INSTRUMENT IS NOT BLIND. The batch concluded, and the Coordinator
      restated, that the headline observable cannot distinguish the sieve
      database from any vector family of the same lengths. The red team
      identified why that could not have been tested: NULL-V's statistic is
      mean_i cos(2 pi x_i . e / q), the correct-secret score, WHICH CONTAINS NO
      y. Lattice membership is exactly y = A^T x mod q, so a statistic that
      never reads y cannot depend on it except through ||x||, which the
      surrogate matches by construction.
    - >-
      Running the null on statistics that DO read y separates them.
      Row-permutation surrogate, preserving both multisets and every column
      marginal and removing only the pairing: near-miss sd ratio 0.142888
      against 0.105408 +/- 0.000991 (+35.6%, about 38 surrogate sd), and
      correct minus best-of-8 near-miss 0.001522 against 0.001761 +/- 0.000011
      (-13.6%, about 22 sd). The excess does not decay as 1/sqrt(N) over
      N' = 500 to 17,919 while the surrogate's does.
    - >-
      P1's IMPOSSIBILITY RESULT IS NARROWED TO THE HARNESS. R1 is forced by the
      run; R2 is a free design choice -- compare.py:372-379 is literally
      `if k==0 and k==25`. R1 alone admits the tuple (35, 0, 0, ., ., 60) with
      Nf = 2.978518720180076, which the producer's own section 5 uses. Honest
      scope: any design that sieves the full m+n dual lattice AND scores at
      least one candidate not equal to s. Nothing here bears on KN-OPEN-016.
    - >-
      The reported 1015x ambiguity in N_pred is manufactured: 8 of 12 grid
      cells violate the identity that proves emptiness. Over consistent cells
      it is 1.38x.
    - >-
      Ingredient-2 uniform precision: 1.00 +/- 0.05, not "0.2%".

  what_survives_unchanged:
    - >-
      Every datum. The certificate re-derives exactly (447,975 entries, 0
      violations, by each reviewer's own integer arithmetic), a_x and a_y match
      to all printed digits, KA-6 reproduces independently at
      log2(rop) = 115.50989392, and NULL-V itself reproduces at 0.34%.
    - >-
      The rebuild was real, answering batch 1's RT OBJ-9.
    - >-
      P1b's ten known-answer controls, including the callable-identity check
      the predecessor campaign argued about for four batches and never covered.
    - >-
      D1 as Sheppard's correction: principled, zero free parameters, verified
      independently by both reviewers. The producer was right and my suspicion
      that it might be fitted was wrong.
    - >-
      The producer's refusal to manufacture a tuple, and its refusal to license
      the length sub-comparison as a departure. Both were the right calls.

  coordinator_error_corrections:

    - id: CE-1
      title: >-
        I asserted blindness as a universal in an immutable commit message. It
        is false, and it is my fourth such overclaim in this program.
      raised_by: RT-20260803-dc7568
      what_i_wrote: >-
        Snapshot commit e08462ac reads "PAC-1 STANDS UNREFUTED and is the most
        consequential thing in the package: the headline observable CANNOT
        distinguish the sieve database from any vector family of the same
        lengths. The design cannot yet see what the campaign wants to see."
      why_it_is_wrong: >-
        Both sentences are universals drawn from ONE statistic, ONE surrogate
        and ONE instance, and the statistic in question cannot read y at all.
        The row-permutation null separates real from surrogate on the
        statistics that do.
      corrected_statement: >-
        NULL-V's statistic does not read y, so it cannot test blindness with
        respect to lattice membership. On statistics that do read y, the real
        database and its length-matched surrogate differ by +35.6% and -13.6%
        on the two reported quantities, and the difference does not decay as
        1/sqrt(N).
      pattern_note: >-
        FOURTH OVERCLAIM IN AN IMMUTABLE COMMIT MESSAGE: BATCH-010, then
        1cd863b1, then 8cc51677, now e08462ac. All four caught by red team,
        none by me. This one is the first in the PESSIMISTIC direction, and
        docs/inventor-protocol.md treats that as symmetric: had it stood, it
        would have argued away the only positive signal this campaign has
        produced. The direction changes nothing about the severity.
      corrective_rule_adopted: >-
        A Coordinator commit message may restate a producer's conclusion only
        with the producer's own scope qualifiers attached. Where the producer
        writes "PAC-1 stands unrefuted" against a named statistic, the commit
        message names that statistic or says nothing.

  process_defect_recorded:
    id: PD-2
    title: >-
      The PD-1 corrective rule was followed and was not sufficient.
    what_happened: >-
      DEC-20260803-d810d0 PD-1 required every null to NAME the object whose
      removal it tests, after batch 1's null could not fail. Batch 2's nulls
      each named their removed object in results.json. NULL-V still could not
      fail with respect to three of the four objects it named, because its
      STATISTIC could not observe them.
    the_lesson: >-
      Naming the removed object is necessary and not sufficient. The rule must
      be: state the object removed AND demonstrate that the statistic is
      sensitive to that object, by exhibiting a case where the statistic
      changes when the object does. A null whose statistic is blind to what it
      removes is indistinguishable from a null that removes nothing.
    corrective_rule_adopted: >-
      Batch 3 cards require, for every null: the object removed, the statistic
      used, and a sensitivity demonstration for that pair.

  reviewer_disagreement_recorded:
    subject: whether EV-MLKEM-da9e3b should be superseded
    validator_position: >-
      Both batch-1 corrections UPHELD. OBS-6's z was mis-specified -- a
      one-in-nine event scored as one-in-a-hundred, P = 0.1020 against the
      exchangeable 1/9 = 0.1111 -- and OBS-4's "~20%" is an unlabelled upper
      bound with the true ratio at least 70x, though OBS-4's second clause
      ("does not shrink with N") survives.
    red_team_position: >-
      "Do not supersede EV-MLKEM-da9e3b." It reproduced both corrections (null
      rank 4.949 +/- 2.653 of 9, P(rank = 9) = 0.108 against 1/9 = 0.111) and
      judges that OBS-6 and OBS-4 AS WRITTEN remain true -- they are explained,
      not overturned.
    coordinator_resolution: >-
      NOT SUPERSEDED. The two positions agree on every number and differ only
      on what an observation record asserts. OBS-6 recorded an observed event
      ("9 of 9") and attached a statistic to it; the event is real and the
      statistic was mis-specified. A record whose observation is true and whose
      attached statistic is wrong is corrected by a later record saying so --
      which is INT-3 of EV-MLKEM-50901f -- not by superseding the observation.
      Superseding would also destroy the audit trail of exactly the kind of
      error the program most needs to see itself make.

  explicit_non_claims:
    - No ML-KEM break. No attack implemented, run, or claimed. No speedup.
    - No security proof and no security claim in either direction.
    - >-
      No FIPS 203 parameter set affected or cleared. dim 60, q = 127 is toy
      scale and rule 4 applies in full.
    - >-
      The independence heuristic is NOT shown to fail. The separation is one
      unreplicated computation on one instance.
    - >-
      Nothing here bears on KN-OPEN-016. The impossibility result is about this
      harness's design choices, not about MATZOV.Nf's domain.
    - >-
      This design's corner is the corner the estimator's optimiser never
      selects: at its own ML-KEM-512 optimum the term this design cannot test
      equals 2685.7 = 2^11.39.

  official_status_changes:
    - record: EV-MLKEM-50901f
      from: null
      to: recorded
  official_status_changes_note: >-
    GOAL-MLKEM-004 remains `active` at batch 2 of 6. EV-MLKEM-da9e3b is NOT
    superseded. No other record changes status.

  knowledge_promotion:
    promote: false
    promoted: []
    not_warranted: >-
      NOT WARRANTED, and the strongest candidate is now clearly identified: a
      KN-TECH on null-object sufficiency -- "name the object removed, name the
      statistic, and demonstrate the statistic is sensitive to that object" --
      which two consecutive batches have now failed in two different ways
      (batch 1's null could not fail; batch 2's named its object and used a
      statistic blind to it). It is deferred one batch deliberately: the rule
      should be promoted after batch 3 shows it survives contact with a design
      built under it, not on the strength of two failures. The separation
      finding is far too weak to promote -- one unreplicated computation, one
      instance, toy scale. The two promotions inherited as OWED from
      GOAL-MLKEM-003 remain rule-12 blocked.

  ranking_rationale: >-
    Batch 3 CHANGES the design rather than continuing or abandoning it. Both
    reviewers converge on this and the producer named the successor itself in
    wellposedness.md section 6. Continuing would re-measure a corner the
    optimiser never selects, where the term of interest is identically 1;
    abandoning would discard the campaign's only positive signal one check
    before it is either replicated or killed.

  limitations:
    - >-
      The central new finding is ONE unreplicated reviewer computation on ONE
      instance. Its replication is the first task of batch 3 and costs about
      ten minutes.
    - >-
      Every participant in batches 1 and 2 -- both producers, all four
      reviewers -- resolved to claude-opus-5. Independence is procedural, not
      model-level. The validator flags this as mattering most for the P1
      modelling judgement, where a genuinely independent check is outstanding.

