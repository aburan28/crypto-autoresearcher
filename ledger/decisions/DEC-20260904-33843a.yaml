coordinator_decision:
  id: DEC-20260904-33843a
  recorded_at: '2026-09-04'
  goal_id: GOAL-AES-003
  question_id: RQ-AES-003
  batch_id: BATCH-e479db
  decision: open_batch
  decision_rationale_for_verb: >-
    "open_batch" is the verb for admitting a bounded, fully-specified batch of
    work against a ranked next action. This decision admits the SCOPED
    SUCCESSOR REVISION round named by GOAL-AES-003's current next_action (as
    revised by DEC-20260903-afdd06's closing archive of BATCH-b38667). It is
    NOT "approve": no experiment, arm, exposure, or execution is authorized.
    The round is design-only, zero-arm, exactly as BATCH-b38667 was.

  context: >-
    BATCH-b38667 (PR #718, ledger archive b5c8abc37, merged to main at
    7044fd3a5) promoted the pooled-exposure floor-magnitude adjudication
    design to IDEA-20260903-bd730d with decision "revise": the
    FM-PLATEAU-CONSISTENT branch carries a quantified gap that must be closed
    before any Coordinator decision may authorize execution of D-1, D-2, or
    any successor design that could compose an FM-PLATEAU-CONSISTENT
    sentence. Joint J-S (TASK-20260903-4fdf77, red team, verdict "breaks" on
    the self-constructed heterogeneity object OBJ-5) left eight successor
    requirements; DEC-20260903-afdd06 and the goal head's revised RANK 1 name
    requirements 2 and 3 as BLOCKING, fold requirements 1 and 6 in at zero
    additional cost, and list 4, 5, 7 and 8 as disclosure/completeness items
    for the same or a later pass.

  target_ids:
    - GOAL-AES-003
    - RQ-AES-003
    - IDEA-20260903-bd730d
    - DEC-20260903-afdd06
    - TASK-20260903-4fdf77
    - BATCH-e479db

  decision_summary: >-
    Open BATCH-e479db: a five-task, zero-arm, design-only round in which the
    idea-generator produces a SCOPED SUCCESSOR REVISION of the FM-cascade
    design (promoted as IDEA-20260904-06c396 after independent review),
    discharging successor requirements 2 and 3 and folding in 1 and 6, with
    4, 5, 7 and 8 carried as disclosure items on the same pass. Independent
    validation (joint J-R1) and red team (joint J-R2) run blind and mutual,
    under the review plan recorded in ledger/handoffs/TASK-20260904-30f2f7.yaml.

  binding_requirements_forwarded:
    blocking:
      - "SR-2: an explicit, disclosed quantitative bound on the FM-PLATEAU-CONSISTENT false-positive rate under seed heterogeneity phi = 1.0 to 2.0, analogous to the existing overdispersion_sensitivity table for the decay branch, before the design is adopted for execution (OBJ-5)."
      - "SR-3: either (a) a tightened, explicit secondary conjunct to Branch 4 requiring the dispersion index to fall materially below its critical value (not merely fail to reject at alpha_H = 0.01), or (b) a raised n specifically to bound heterogeneity risk, before any PLATEAU-CONSISTENT sentence composed under this design is treated as more than provisional."
    folded_at_zero_cost:
      - "SR-1: extend the RAT-3 verbatim-quotation discipline to also cover each branch's NOT-licensed prohibition text for any downstream record composing a fired branch's outcome sentence (NARROW-AUDIT-6)."
      - "SR-6: name the exact tail-construction convention (minimum-likelihood, matching scipy.stats.binomtest's default, versus equal-tail) for the exact two-sided conditional binomial test of pi = 0.5 in the adopted preregistration text."
    disclosure_same_or_later_pass:
      - "SR-4: name G4's use of the committed k=16 reading's exact Garwood lower bound as a disclosed third use of the five committed readings (POOL-3)."
      - "SR-5: per-arm or periodic build-identity and KAT re-verification checkpoints for any design running substantially more arms or longer wall-clock than any predecessor batch (POOL-4)."
      - "SR-7: price the cheapest same-pair alternative (n=1: one new arm at k=4, one at k=16) as its own explicit dominated_by row for the actual k=4/k=16 pair, and state the sufficient design-specific argument that the per-point dispersion index has zero residual degrees of freedom at n=1 so the homogeneity gate cannot be computed at all."
      - "SR-8: resolve or delete the orphaned count_threshold_at_n_6_lambda_op_1: 15 entry in pooled-exposure-pricing.json's branch_thresholds block."

  standing_constraints_carried:
    - AMEND-1 gate verbatim from DEC-20260901-6f9de3 binds every analysis-bearing receipt the revised design would produce.
    - NARROW-1 through NARROW-5 verbatim from DEC-20260902-7ad3d9 and DEC-20260903-be4472 bind every sentence in the revision.
    - RAT-3 (with the SR-1 extension) binds the preregistration text.
    - Zero arms, zero compute against the instrument; design-only. Toy tier only per RQ-AES-003 R7.
    - Realized readings remain h(4)=17/21, h(8)=13/18, h(16)=12 at 2^30 trials, cell (1,1), r=5, PIN-T0; Garwood CI for 17 is [9.903, 27.219] per CORR-20260903-d3cab5.

  budget_accounting: >-
    Total 5400 s = producer 1600 + snapshot archive 500 + independent
    validation 1400 + red team 1000 + ledger archive 900, sized exactly from
    the per-role lines of GOAL-AES-003 campaign_budget.sizing_basis with no
    cushion. The compute component is zero and is reported separately per the
    goal's C4 discipline. Campaign budget is unbounded (maximum_batches:
    null, total_wall_clock_seconds: null); max_concurrent is set to 3, the
    environment-sized value used by BATCH-b38667 on this host.

  lane_note: >-
    BATCH-b38667's lane (coordinator-aes003-2) still shows open in
    goal_lanes; its batch ledger is on main as of 7044fd3a5. BATCH-e479db is
    opened as its own lane on branch aes003-fm-revision-20260904 with its own
    PR; it edits the goal head only additively inside its own ledger archive.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Batch-opening decision. No evidence review, no EV-* record, no
      hypothesis status moved; nothing here reaches evidence strength
      eligible for a KN-FIND.
  decided_by: coordinator
  decided_at: '2026-09-04'

  authorizes_nothing: >-
    This decision opens a design-revision round. It authorizes no experiment,
