    run and the run completed in 766 s of a 2400 s budget, exit 0, with all
    writes confined to the task directory (git-verified).
  findings:
    - id: F-1
      title: round complete; independence holds as claimed
      body: >-
        Every joint of review-plan-87c429.yaml now has an executed verdict:
        V1-V4 (TASK-20260822-40389d + TASK-20260822-7f5ed3, all PASSED) and
        R1-R3 + blind re-derivation (TASK-20260823-80125f, all OVERTURNED,
        failure signature triggered). The new report carries a
        review_attestation (task_id, complete read list, explicit
        non-reading of both validator report directories and the quarantine,
        PHASE 1/PHASE 2 ordering attestation). check_review_independence.py
        output archived at
        coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/archives/check_review_independence-post-redteam-20260823.txt:
        10 findings, all format-level and pre-existing (plan uses owner:
        rather than assigned_to: for its 7 joints; proves_too_much_objects:
        rather than proves_too_much.objects; the two validator reports lack
        the review_attestation.task_id subfield) -- none concerns the new
        red-team report, which the checker finds clean. Ownership of every
        joint is declared in the pre-committed plan and each assigned
        reviewer attested to its reads; the plan is not edited (it predates
        all runs; the batch-5 machine-readable schema remains the stated
        fix for future plans). No escalation trigger fired: no
        fingerprint mismatch, no short seed list (100 per primitive, as
        declared).
    - id: F-2
      title: blind re-derivation AGREES
      body: >-
        Working only from the frozen criterion statement
        (DEC-20260822-40bf14 next_actions 3(a)), the declared constants
        (eps = 0.25, k_gate = 4) and the RFC 1320/1321 scope, the red team
        independently derived the injectivity threshold 12 at BOTH 32-bit
        and window/12-bit resolution, agreeing exactly with the frozen
        quantity (manifest injectivity_threshold = 12). Ordering audited in
        the transcript: blind-rederivation.yaml written at item #35, first
        command touching any blind_from path at item #51. Two
        self-disclosed deviations (RT-PD-1: a targeted read of the frozen
        EXP-MDFIVE-8f0fe3 specification lines to resolve the numeric
        eps/k the brief left symbolic -- not a blind_from artifact; RT-PD-2:
        the initial decision-file read printed more of
        DEC-20260822-40bf14 than item 3(a) -- no numeric threshold
        exposed) are recorded in the report and accepted as immaterial to
        the arithmetic.
    - id: F-3
      title: routing answer DEC-20260822-d7c2d0 F-2 SUPERSEDED (void)
      body: >-
        The frozen failure signature is triggered. Whole-object criterion
        (distinct >= 12 applied to the declared object, i.e. both channels)
        flags the known-good RC-5 null: null-MD4 backward is 1/16 at both
        32-bit and 12-bit on 100/100 seeds and null-MD5 backward is 1/16 at
        12-bit on 100/100 seeds (Coordinator-verified from the archived
        raw-result.json of both null runs), while the null's forward channel
        is 16/16 throughout -- so the plan's control language ("known
        non-collapse; must pass the criterion") and term (h)'s pairing do
        not hold for the whole object, and a forward-only statement remains
        admissible but cannot support whole-construction routing. In
        addition, R2's causal predictor breaks (F-4), so the construction
        attribution itself is unsupported. The CONSTRUCTION routing answer
        filed at close is therefore void as a routing conclusion. What
        stands: the bounded forward-channel observations -- primary MD4
        forward 12-bit passes 1/100 (exact 95% interval
        [0.000253, 0.0545]); primary MD5 forward 12-bit passes 65/100
        (exact 95% interval [0.5482, 0.7427]); null forward 16/16 on
        100/100 both primitives; the MD5 CTL-PO5 candidate-count anomaly
        (52/100 at or above ceiling 4, median 12 vs ~1 healthy) -- all
        deterministic, V1-reproduced exactly, and used as-is by the
        adjudication. No hypothesis status, observation, or evidence record
        is altered; only the routing inference is superseded, by reference,
        in DEC-20260822-d7c2d0 (immutable).
    - id: F-4
      title: RC-4 mask-survival argument is NOT a general predictor (R2 OVERTURNED)
      body: >-
        The driver's RC-4 block is a modeled carry-free first-order mask
        trace, not a measurement of multi-bit survival. The claimed image
        bound 2^(surviving basis directions) is contradicted by the raw
        data on 20/100 primary MD4 seeds (Coordinator-verified count from
        the archived raw); most sharply seed 20260886: surviving bits
        [0,1,2], claimed bound 8, measured 15 distinct values at both 32-bit
        and 12-bit (Coordinator-verified). The mask-alone argument does not
        reproduce the ANOM-1 S=9 known verdict without adding step-10 word
        consumption and tuple-position pass-through, and CTL-PO5(b)
        (bits survive the mask, collapse anyway, 8-vs-4) confirms the check
        is necessary-not-sufficient. The RC-4 mechanism attribution carried
        in DEC-20260822-d7c2d0 F-2/F-3 and held at DEC-20260822-40bf14
        F-10 is not sustained as a mechanism claim; the linearization may
        remain a heuristic with a scope label, nothing more.
    - id: F-5
      title: pre-registered falsification trigger met on MD5; prior OVERTURNED; routing rule not honored (Coordinator process finding)
      body: >-
        The review plan's falsifiable prediction, recorded before any
        reviewer ran, states that if >= 50% of the >= 100 seeds reach the
        declared 12-bit threshold on EITHER primitive, the routing answer
        flips to SEED and the prior is overturned. The MD5 limb measured
        65/100 with the exact two-sided 95% interval [0.5482, 0.7427]
        wholly above 0.5 (two-sided exact binomial p = 0.00352 against
        p = 0.5). The close (DEC-20260822-d7c2d0 F-2/F-3) recorded the MD5
        prior-limb overturn as a first-class result but filed
        CONSTRUCTION anyway, on post-hoc candidate-count reasoning; a
        primitive-specific routing rule would have required a prospective
        amendment and cannot be substituted after acquisition. The
        review architecture exists to surface exactly this: a prior the
        review overturns is one of the most informative results the program
        can produce. It is recorded here as (i) the empirical result
        (MD4 below the switch, 1/100, interval far below 0.5; MD5 above it)
        and (ii) a Coordinator process finding: the pre-registered
        EITHER-primitive rule was subordinated to post-hoc reasoning at
        close. Future closes that depart from a pre-registered rule must do
        so only by a prospective amendment recorded before acquisition.
    - id: F-6
      title: cost-model defects (R3 OVERTURNED)
      body: >-
        (i) The 120 s per-run deadline is toothless: measured wall times are
        0.124-0.155 s per production run, so a 10x slowdown (<= 1.55 s)
        would not trip it; enforcement is per-seed polling (checks before
        and after each seed), not a preemptive timer; measure_seed_null has
        no deadline check at all; term (f)'s "armed" language overstates
        enforcement. (ii) The execution report's wrapper_measured_wall_
        seconds (0.095516 / 0.101473 / 0.083694 / 0.089513, sum 0.370196 s)
        do not reconcile with the snapshot-frozen manifests'
        measured_wall_seconds (0.135911 / 0.154608 / 0.134568 / 0.124504,
        sum 0.549591 s) -- the manifests are the frozen record and the
        report's exact cost figures are stale relative to them; the broad
        "sub-second" cost statement stands on the measured values either
        way. (iii) Granularity: at the observed 65/100 the n=100 conclusion
        is robust, but at an observed 60/100 the exact 95% lower bound is
        0.4972 (inconclusive); the first multiple-of-ten sample size whose
        lower bound exceeds 0.5 at an observed 0.60 is n=110 (66/110) --
        the scoped recommendation if the MD5 fraction is near 0.60.
    - id: F-7
      title: runtime and session provenance
      body: >-
        The red team ran on the codex_cli runtime under the operator-minted
        binding (runtime-binding-TASK-20260823-80125f.yaml): policy
        review-adversarial resolved via the openai backend binding to
        gpt-5.6-sol at xhigh; ChatGPT Pro auth, provider openai, not
        Bedrock (rule 16 clean). model_verified at the backend level
        (doctor --probe 2026-08-23, archived); the session state-row level
        is UNAVAILABLE in codex-cli 0.149.0 (exec threads do not persist
        here -- the repo's session probe fail-closed with state_row_missing
        and its failed receipt is archived), so the session-level model
        attestation rests on the hash-bound launch argv plus the backend
        probe, with the gap disclosed in the binding, this decision, and
        the report's inference block. Run: thread 01a03036-e8cd-7763-88b7-
        c44ffd6834b4, 153 items, 39 command executions, exit 0, 766 s wall
        (budget 2400 s), usage 4,862,359 input / 35,532 output / 14,988
        reasoning tokens; transcript, stderr, report, re-derivation and
        analysis script hash-bound in run-receipt.json; write scope
        git-verified (task directory only).
    - id: F-8
      title: hypothesis status and evidence strength unchanged
      body: >-
        H-MDFIVE-0ca596 remains `weakened` as set at
        DEC-20260822-40bf14: the voided routing answer is a directional
        inference, not a hypothesis status, and the measured weakening
        (and its V1-reproduced observations) stands. Evidence strength for
        the phase-1 distributions remains single_run: the red team
        verified the criterion thresholds, the raw per-seed integers, and
        the control objects, but did not re-derive the distributions from
        scratch; the named promotion trigger (independent from-scratch
        recomputation of the distributions) remains open. The injectivity
        THRESHOLD quantity is now independently re-derived with agreement
        (F-2), which is recorded as such but does not change the strength
        of the distribution measurements.
    - id: F-9
      title: batch-7 gate LIFTED with binding constraint
      body: >-
        The single next action recorded at DEC-20260822-d7c2d0 (resume the
        red-team tier) is discharged: the tier was resumed under the
        operator-minted codex_cli binding and the round is complete.
        Batch 7 (final batch) may be planned, subject to this binding
        constraint, which no batch-7 record may waive: NO routing answer
        (seed vs criterion vs construction) may be filed until (a) the
        criterion is explicitly re-scoped to the forward channel -- the
        channel of the construction's declared injectivity -- with the
        null's backward-channel degeneracy documented as a property of the
        control object rather than absorbed silently, and the plan's
        control language reconciled with term (h); (b) the RC-4 predictor
        is repaired (carry-aware model or measured survival) or demoted to
        a scope-labeled heuristic; (c) the pre-registered flip rule is
        re-applied to the re-scoped criterion and the routing answer filed
        per the rule as written (on the current forward-scoped numbers the
        MD5 limb routes to SEED; the candidate-count anomaly is then a
        measured follow-up question, not a routing input); and (d) any
        departure from a pre-registered rule is a prospective amendment
        recorded before acquisition (F-5(ii)).
