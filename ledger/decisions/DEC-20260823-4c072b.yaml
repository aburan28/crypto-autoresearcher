  decision: compose_completed_review_round_and_supersede_routing_answer
  decision_label: >-
    COMPOSE THE NOW-COMPLETE ROUND 1 OF review-plan-87c429.yaml and SUPERSEDE,
    by reference, the routing answer recorded in DEC-20260822-d7c2d0 F-2. The
    red-team resume TASK-20260823-80125f (codex_cli, gpt-5.6-sol at xhigh,
    operator-minted binding runtime-binding-TASK-20260823-80125f) executed the
    previously unexecuted joints R1-R3, the proves-too-much controls, and the
    blind re-derivation, and found all three R joints OVERTURNED with the
    frozen failure signature TRIGGERED. The routing answer
    "CONSTRUCTION, primitive-dependent" is therefore VOID as recorded: the
    whole-object criterion also flags the known-good RC-5 null (backward
    channel 1/16 on 100/100 seeds, MD4 both resolutions and MD5 12-bit,
    Coordinator-verified from the archived raw), and the RC-4 mask-survival
    predictor is contradicted by the raw MD4 data. The pre-registered
    Coordinator prior's falsification trigger was met on the MD5 limb (65/100
    at the 12-bit threshold, exact 95% interval [0.548, 0.743] excluding
    0.5) and the filed CONSTRUCTION answer did not honor the pre-registered
    EITHER-primitive flip -- recorded as a first-class result and as a
    Coordinator process finding. The bounded forward-channel observations
    stand (deterministic, V1-reproduced 7600/7600, blind re-derivation
    agreeing at 12/12). Batch 6 remains closed; the batch-7 gate is LIFTED
    with the binding constraint that no routing answer may be filed until the
    criterion is re-scoped and its control repaired.
  batch_state: closed
