  limitations:
  - >-
    The session-level model attestation for the red-team run rests on the
    launch argv and the backend probe, not on an independent state row
    (codex-cli 0.149.0 exec-thread persistence defect; disclosed in the
    runtime binding). The run's own JSONL transcript contains no model
    identifier. No record claims a stronger attestation than this.
  - >-
    The red team's RT-PD-1 deviation (reading the frozen EXP-MDFIVE-8f0fe3
    specification for the numeric eps/k during PHASE 1) is accepted as
    immaterial: the specification is a frozen contract, not a blind_from
    artifact, and no threshold value could have been read from it without
    the declared constants already being the batch's own.
  - >-
    The voided routing answer does not void the observations. The forward-
    channel distributions, the null degeneracy, the MD5 candidate-count
    anomaly, and the determinism record all stand as recorded in
    EV-MDFIVE-b0def7 and the archived run records.
  - >-
    The backward-channel degeneracy of the null object (1/16 on all seeds)
    was disclosed in the execution report and known at close; what the
    round establishes is that the pre-registered control language did not
    anticipate it, so the control as written cannot certify whole-object
    routing. The fix is a re-scoped criterion and control (F-9(a)), not a
    re-run.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No KN-TECH entry is minted. The RC-4 linearization's failure mode
      (carry/higher-order terms activating basis directions that are
      unchanged at the origin; bound contradicted on 20/100 seeds) is a
      candidate technique-negative entry, but it awaits a repaired
      carry-aware model or a second independent construction showing the
      same failure before promotion; filing a negative now would
      pre-empt the batch-7 repair it motivates.
  next_actions:
  - >-
    PLAN BATCH 7 (final batch) under the F-9 binding constraint: re-scope
    the criterion to the forward channel with the null's backward
    degeneracy documented; repair or demote the RC-4 predictor; re-apply
    the pre-registered flip rule to the re-scoped criterion and file the
    routing answer per the rule as written; treat the MD5 candidate-count
    anomaly as a measured follow-up. Any rule departure is a prospective
    amendment.
  decided_by: coordinator
