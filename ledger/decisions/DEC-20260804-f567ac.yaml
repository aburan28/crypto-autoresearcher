  context: >-
    BATCH-086: Diagonal correlation approach doesn't improve O(p^{3/4}) bound.
    However: MAGCS conjecture identified — a PRECISE algebraic formulation that,
    if proved, would give H-PSEUDO with C = O(p^epsilon).

  decision: advance_magcs_as_new_direction
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    **MAGCS CONJECTURE** (Mixed Additive-Group Character Sum):
    For T = N-torsion point with e_N(G, T) = ζ_N (Weil pairing generator):
    |Σ_{P∈E(F_p)} e^{2πi a*x(P)/p} · e_N(P, [k]T)| = O(p^{1/2+ε})

    Key insight: e_N(P, [k]T) = e^{2πi k*DL(P)/N} IS an algebraic rational function
    of P when T is the N-torsion companion (Weil pairing is algebraic/rational over F_{p^2}).
    This CONVERTS the DL character into an algebraic character — avoiding the
    DL circularity obstruction!

    If MAGCS holds: H-PSEUDO follows with C = O(p^{ε}) via Cauchy-Schwarz.
    This would be a THEOREM (not just empirical) bounding the Semaev yield.

    **Why MAGCS might be provable**:
    1. The Weil pairing e_N(P, [k]T) is a rational function of P over F_{p^2}
    2. The sum Σ_{P∈E(F_p)} ψ(x(P)) * e_N(P, [k]T) is a mixed sum over F_p-points
       with one F_p-character (additive in x) and one F_{p^2}-algebraic factor (Weil pairing)
    3. "Frobenius-twist" character sums of this type are studied in the Katz-Sarnak framework
    4. The Tate pairing (which IS defined over F_p) might allow direct F_p-bound

    **The remaining gap**: The Weil pairing T lives in E[N](F_{p^2}) \ E[N](F_p) for
    generic curves (the N-torsion companion is typically not F_p-rational). The sum
    involves a character defined over F_{p^2} but summed over F_p-points. This is a
    "level-k" structure not covered by elementary Weil, but potentially by Katz-Sarnak
    or Gelfand-Graev theory.

    GOAL-ECDLP-001 stays active. MAGCS is a HIGH-PRIORITY open problem.

  magcs_formulation:
    conjecture: >-
      For E/F_p ordinary, prime-order N, generator G, and T = N-torsion companion
      with e_N(G,T) = ζ_N (N-th root of unity over F_{p^2}):
      max_{a∈F_p*, k∈Z/N*} |Σ_{P∈E(F_p)} e^{2πi a*x(P)/p} · e_N(P,[k]T)|^2
      = O(p^{1+2ε}) for some ε > 0
    implication: >-
      MAGCS → H-PSEUDO with C = O(p^ε) (exponent matching empirical ~0.079)
    proof_path: >-
      Either (a) Tate pairing reformulation over F_p directly, or
      (b) Katz-Sarnak ℓ-adic character sum for Frobenius-twist structure

  exact_next_action: >-
    BATCH-087: Mathematical analysis of whether the Tate pairing can be used to
    reformulate MAGCS over F_p (avoiding the F_{p^2} extension). The Tate pairing:
    t_N: E(F_p)[N] × E(F_p)/[N]E(F_p) → F_p*/(F_p*)^N
    is defined over F_p. If T_F_p = some F_p-rational N-torsion-related object gives
    e_{Tate}(G, T_F_p) related to χ_k, then the MAGCS sum is over F_p entirely,
    and Weil/Katz might give the O(sqrt(p)) bound directly.

