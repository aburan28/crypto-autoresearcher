        AMD-EXP-GFPN-05ff43-20260924-readbackcover is derived, not minted.
      reserved_by_name_not_written: >-
        - TASK-20260924-53026a: the approval act's card on the draft.
        - DEC-20260924-650068: the approval decision on the draft.
        - TASK-20260924-833cde: the approval act's ledger archive.
        Further ids (the r4 stage and its archive, the r4 run cards and
        archives, the review-chain successors) are minted for the approval
        act by the dispatching session.
      pool_unused: >-
        TASK-20260924-79e7a6, TASK-20260924-4b4239, DEC-20260924-1fe9d1,
        DEC-20260924-8770bf, CORR-20260924-69e564, EV-GFPN-62d69f and
        EV-GFPN-703b6b are NOT used and are reported unused, never reassigned
        silently.
      retired_unused: >-
        TASK-20260924-c62839, TASK-20260924-7f5f5f, TASK-20260924-22918e (R-6)
        and the 38 run ids of R-5.
      not_used: >-
        Act 4's RQ-7 spares and Act 7's failed-gate reservations (can no
        longer occur); every id declared in the BATCH-e409ca queue.
    R-10_goal:
