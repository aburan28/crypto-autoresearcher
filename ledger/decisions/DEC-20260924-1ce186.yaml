  rationale:
    - >-
      THE PRE-DECLARED COMPLETION GATE DECIDES. The card said, before R2''
      ran, that a package whose checker fails is not read as evidence. G4's
      checker fails. A gate built on it is not established. Reading the
      admission fields alone would have admitted 34 packages on a package the
      card itself excludes.
    - >-
      THE FAILURE IS A RECORDING GAP, AND THE REPAIR IS RECORDING. The
      frozen controls command drops the per-child records the collector and
      SC-4 read, and 8 read-backs are recorded nowhere. Waiving the checker
      item or changing the frozen checker would hide exactly that. Recording
      at the wrappers, widening the collector's and SC-4's sources, and
      admitting on the checker verdict fix all three gaps without touching a
      frozen byte or a scientific rule.
    - >-
      THE ROOT CAUSE IS AN UNEXERCISED COMMAND. The r3 stage disclosed that
      DV-7 could not exercise `controls` or `anchor-identity`; the gate was
      their first run. DV-18 runs both once in development before the next
      gate, which is the cheapest way to prevent the same class of surprise.
    - >-
      THE LANE STAYS OPEN. Nothing measured D; the obstruction is a missing
      record in one command path. The next action is a zero-solve census that
      tests the repair's premises across every command before another stage
      is spent. Closing or parking the lane would be premature closure of C1's
      measured side (KN-OPEN-9b4a2b).
    - >-
      NO SECURITY READING. Toy EcGFp5-shaped arithmetic with known scalars;
      nothing transfers to p = 2^64 - 2^32 + 1.

