      target: >-
        The v2 ladder cells at n = m = 5 (KN-OPEN-9b4a2b; goal criterion C1's
        measured side) and the 31-bit rung, under a gate every package of
        which passes its completion-gate checker.
      chosen: >-
        A DRAFT additive amendment,
        AMD-EXP-GFPN-05ff43-20260924-readbackcover, at
        experiments/EXP-GFPN-05ff43/amendments/v2_addendum_readbackcover.yaml,
        status draft, approved_by null, bound by TASK-20260924-9c617a's
        receipt (addendum_sha256), and decided by a later, separate act
        (reserved TASK-20260924-53026a, DEC-20260924-650068; ledger archive
        reserved TASK-20260924-833cde) on archived bytes.
      key_parameters: >-
        - RB-1: every S-1 / S-2 attempt's read-back pair and threads recorded
          in its solver-events.json attempt record, copied from the frozen
          function's returned result; records only.
        - RB-2: the manifest lists built from raw-result.json, child/*.meta.json
          and the RB-1 records, with per-source accounting and a named list of
          evidenced children lacking a read-back.
        - RB-3: SC-4 enumerates attempts from the event records too; every
          wrapped attempt without a row is named.
        - RB-4: the gate admits only when each gate package's completion-gate
          checker exits 0 (and the controls_a1 image's, for a1 packages).
        - RB-5: DV-1..DV-17 re-run on r4 code, plus DV-18: `controls` and
          `anchor-identity` run once each in development through the r4 entry
          and wrapper, with the frozen checker required to pass.
        - RB-6: new r4 paths, 42 fresh ids, ten bound hashes, 162 retired ids
          refused, 6 + 42 = 48 packages over ten plans.
        - RB-7: value classes (epsilon, K-2 derivative, V-4 consumer at E2).
        - RB-8: a launch form that captures the wrapper's exit status.
        - Every scientific rule, frozen byte, flag, argv, K, cap, REG-1 item,
          exclusion, watchdog and envelope value UNCHANGED.
      why_this_is_the_smallest_correct_repair: >-
        - A code change is unavoidable: the 8 solves' read-backs exist only in
          the result solve() returns to the S-1 wrapper, so they are recorded
          only if the wrapper records them (RB-1). A collector-only fix (RB-2
          alone) would make the frozen checker's non-empty test pass on the
          builder read-backs and hide the solves' gap (option RE).
        - A frozen-protocol change needs an amendment and a separate
          approval; the wrapper changes, so REG-1 neutrality must be shown on
          the new layer's own G1; a gate mixing layers has no single protocol
          version. The whole gate costs about 300 s (option RD).
        - DV-18 closes the root cause: the two gate commands DV-7 could not
          exercise are exercised once before any gate package.
      census_precedes_approval: >-
        YES. The zero-run, zero-solve read-back census TASK-20260924-bf5724,
        archived by TASK-20260924-a01341, precedes the approval act, as the
        launch census, premise check and consumer census preceded theirs
        (DEC-20260924-bea197 R-4). It answers, before another stage is spent,
        whether any other command's capped children miss every read-back
        source (RBR-1), whether the SC-4 gap is confined to `controls`
        (RBR-2), and whether another admission predicate has R-7's gap
        (RBR-3). It is cheap (static, no solver); its readings are fixed in
        the draft now.
      routes_not_taken: >-
        - Rule the gate passed (waiver after the outcome): rejected (R-1).
        - Amend the frozen checker for the controls kind: rejected; the gap is
          in recording, so the fix is recording.
        - Re-run G4 alone, or the whole gate, under the r3 layer: impossible
          (R3P-2: no gate package is re-run; no contingency id for a gate
          package) and pointless (the same code yields the same empty list).
        - Close or park the lane: rejected. The impediment is a recording gap
          in one command path; closing C1's measured side on it would be
          premature closure. The goal stays active (AGENTS.md "Goals are never
          paused").
      coordinator_preview_not_evidence: >-
        This act's reading suggests that the other v2 commands (fixture,
        fixture4, build, cells) carry per-solve records in raw-result.json,
        since G1 and G2 passed the checker and DV-7's world-A toy packages of
        those kinds passed it (implementation-v2-r3.md lines 548-555). This is
        a preview that shapes the census's expected answer; it is not the
        census and is not relied on.
    R-8_evidence_preservation:
      ruling: >-
        NOTHING FURTHER TO PRESERVE. Every output of R2'' (800 run files and
        the report) is committed by phase B (dd1034553). The Executor's scratch
        files (report lines 7457-7459) are transient and are not evidence;
        every value they carried that matters (checker outputs, accounting,
        REG-1 output) is quoted verbatim in the report and the receipt.
