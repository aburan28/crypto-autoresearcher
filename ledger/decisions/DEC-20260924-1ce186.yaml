  rulings:
    R-1_the_repaired_gate:
      ruling: >-
        NOT ESTABLISHED. The r3 gate of protocol 2-r3 did not pass. No
        post-gate package of trial-plan-v2-r3.json and no package of
        trial-plan-v2-a1-r3.json is admitted.
      readings_weighed:
        literal_RQ''-7_and_R-7_fields: >-
          MET on the recorded fields (F5). They are necessary, not sufficient:
          they are read from a package the same card declares not to be
          evidence when its checker fails.
        completion_gate_checker_failure: >-
          DECISIVE. TASK-20260924-4351ac completion_gate (line 359): "the r3
          checker passes on every package, or the package is recorded with the
          checker's failure verbatim and is not read as evidence". G4's
          checker exits 1 (reproduced by the dispatching session). A gate is
          a claim that its packages passed; a package that is not evidence
          cannot carry it.
        AC-1_and_R3P-5: >-
          AGREE with the completion gate. AC-1 (DEC-20260923-e788a1 lines
          200-214) and R3P-5 (card lines 153-164) require every child's cap
          "set in the child and read back with getrlimit into each manifest".
          G4's manifest records none of 19; 8 are recorded nowhere.
        R3P-2_and_CC-3: >-
          R3P-2 (card lines 127-130) foresees a frozen-checker failure of a
          gate package, attributable to the callgrind child, as a gate failure
          at which "the lineage STOPS". CC-3 itself does NOT apply: G4 has no
          callgrind child (report line 6384; manifest lines 403-409), and its
          failing item is not attributable to a callgrind entry of V-3, which
          is empty. By consumercover V-4 (lines 366-370) the verdict is then
          read "as frozen": the package fails its checker.
        recording_gap_not_envelope_breach: >-
          ACCEPTED as to cause (R-2), and it bears on the CLASS of the failure,
          not on whether the gate passed. The envelope is not in doubt for the
          11 builders (recorded) and is shown for the 8 solves only by frozen
          code. A missing record is not a pass.
      why_not_the_other_reading: >-
        Ruling the gate passed would waive a frozen checker item after seeing
        the outcome, admit 23 post-gate and 11 addendum packages on a package
        the card declares not evidence, and rest on 8 read-backs no file
        records. That is a changed success criterion without an amendment
        (AGENTS.md core rule 3; agents/coordinator.md prohibitions). The
        stricter reading changes no criterion: it reads two texts committed
        before R2'' ran together (CORR-20260924-2a9fc7).
      scope: >-
        This ruling concerns protocol 2-r3's gate only, on the committed
        packages RUN-GFPN-f6a21a, -902222, -f5412a and -bfe956, msolve 0.6.5
        at -t 1, valgrind 3.22.0, the phase-A-bound r3 layer and the 10 GiB
        child cap. G1, G2, G3 and REG-1 stand as valid records: the r3 layer
        reproduced RUN-GFPN-ac4487 at 4111 under d-parsed REG-1, and passed
        the fixture at 16777291 and the anchor identity at 16777291 (n = 5,
        m = 4). They are development-grade records of the pipeline and never
        evidence about D. Nothing transfers to any n = 5 cell, to 262151, to
        1073741831 or to p = 2^64 - 2^32 + 1.
      what_it_says_and_does_not: >-
        It says the r3 layer cannot establish its gate as delivered, because
        one gate command's per-child records do not reach the manifest or the
        SC-4 accounting. It says nothing about D, the quotient, the
        degenerate-symmetrization identity, the orbit-lifting verifier or the
        known-scalar controls (whose 45 checks are recorded and not read), and
        nothing about H-GFPN-9a29be or HEUR-GFPN-DFLAT.
    R-2_classification_of_G4:
      reading: >-
        IMPLEMENTATION_ERROR (recording), as the Executor classified it
        (report lines 6521-6530), with the scope correction of
        CORR-20260924-ec044e. The recorded run_status completed_valid and
        gate_pass true are left exactly as written; the classification is of
        the checker failure, recorded here and in the correction.
      basis: >-
        The protocol requires each child's read-back in each manifest (AC-1;
        R3P-5; R3P-9); the package's recorded content does not implement that
        for the controls command. The cause is in code the layer controls:
        the r3 collector reads only raw-result.json keys (r3_run_wrapper.py
        lines 510-511), and the frozen controls command writes no per-child
        record there. The builder read-backs equal the requested cap; the
        solves' cap is enforced by the frozen refusal logic.
      stated_plainly: >-
        It is NOT an envelope breach; NOT a CC-3 envelope outcome at S-3; NOT
        a control failure (45 / 45 recorded); and NEVER a mathematical result
        about the quotient, D, HEUR-GFPN-DFLAT or H-GFPN-9a29be.
