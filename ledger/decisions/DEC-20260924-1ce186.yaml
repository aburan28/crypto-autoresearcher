        REG-1). The rule omits the completion-gate checker verdict, which the
        same card makes decisive for evidence. Recorded in
        CORR-20260924-2a9fc7, which states the stricter reading from this
        decision on. The r3 wrapper is phase-A bound and is not edited.
      consequence_for_r3: >-
        None further: TASK-20260924-4351ac is failed (R-5), every unused r3 id
        is retired (R-5), and no session may invoke
        implementation-v2-r3/r3_run_wrapper.py again for any id. The Executor
        was right not to launch or dry-run RUN-GFPN-596fb2.
      consequence_for_the_successor: >-
        The draft's RB-4 puts the checker verdict into admission code; RBR-3
        has the census list every other admission predicate and what it reads.
