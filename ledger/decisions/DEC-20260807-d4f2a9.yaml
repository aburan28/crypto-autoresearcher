coordinator_decision:
  id: DEC-20260807-d4f2a9
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-d8bb19
  recorded_by_task: TASK-20260807-d8bb19-coordinator
  archived_by: null
  decided_by: coordinator
  decided_at: '2026-08-07'

  context: >-
    BATCH-d8bb19 dispatched the Idea Generator to propose successor directions for H-IT-001
    after it was weakened by DEC-20260804-2fae6a (Tate isogeny theorem blocks ordinary
    F_p-isogeny transfer to anomalous/MOV/Weil-descent endpoints). The idea generator produced
    three proposals, each identifying a distinct obstruction to isogeny-transfer mechanisms:
    (1) IDEA-20260807-15f103 (smooth-conductor descent, DIR-3), (2) IDEA-20260807-ecdde8
    (extension-field isogeny bridge, DIR-2), (3) IDEA-20260807-0afbab (within-class DLP
    uniformity, DIR-3). All three conclude that no viable isogeny-transfer mechanism exists
    for generic prime-field curves. Independent reviewer returned PASS, validator returned
    FAIL on procedural defects (now corrected), and red team returned conditional PASS with
    one significant objection: within-class uniformity is empirical, not proven.

  decision: reject_scoped
  decision_vocabulary_note: >-
    reject_scoped means: the specific mechanism tested (isogeny transfer via ordinary
    F_p-isogenies, extension-field isogenies, or within-class transfer to special families
    or weaker curves from generic prime-field curves) is ruled out by structural obstructions
    at the MECHANISM level. This does NOT mean ECDLP is easy, isogeny-based attacks are
    impossible in general, or that all isogeny-related research is dead. It means the stated
    isogeny-transfer mechanisms cannot work for generic curves. Non-isogeny approaches
    (index calculus, relation collection, etc.) remain open.

  decision_scope: >-
    H-IT-001 is moved from `weakened` to `rejected_scoped` at the full isogeny-transfer scope:
    ordinary F_p-isogenies, extension-field isogenies, and within-class transfer mechanisms
    connecting a generic non-special curve to any special family or weaker curve. The scope
    of rejection is exactly: all isogeny-transfer approaches for generic prime-field ECDLP.
    Supersingular isogenies, non-isogeny approaches, and curves over extension fields are out
    of scope of this decision. SG-ECDLP-002 is closed scoped to the three proven obstructions
    (Tate theorem, surface-weakness gap, isogeny-finding cost), with within-class uniformity
    held as unverified pending the toy-scale test in IDEA-20260807-0afbab. GOAL-ECDLP-001
    remains `active`. Research effort should redirect to non-isogeny approaches for ECDLP.

  target_ids:
    - GOAL-ECDLP-001
    - H-IT-001
    - SG-ECDLP-002
    - BATCH-d8bb19
    - IDEA-20260807-15f103
    - IDEA-20260807-ecdde8
    - IDEA-20260807-0afbab
    - EV-ECDLP-b3e847

  evidence_ids:
    - EV-ECDLP-b3e847

  rationale:
    - >-
      Tate isogeny theorem (unconditional): two ordinary elliptic curves over F_p are
      F_p-isogenous if and only if they have the same trace of Frobenius. All three special
      families named in H-IT-001 (anomalous, MOV, Weil-descent) are isogeny-class invariants.
      No ordinary F_p-isogeny path can connect a generic non-special curve to any of these
      families. This obstruction is unconditional and proven.
    - >-
      Surface-weakness gap (IDEA-20260807-15f103): Within an ordinary isogeny class, the
      surface curve has no known DLP weakness for generic discriminant D = t^2 - 4p. The GLV
      endomorphism has norm ~ sqrt(|D|) ~ sqrt(p), giving 2D Pollard rho cost N^{1/2} = same
      as standard rho. No exponent improvement. The mechanism collapses to Pollard rho for
      generic curves. This obstruction is proven (no known weakness exists).
    - >-
      Isogeny-finding cost (IDEA-20260807-ecdde8): Over extension fields F_{p^k} with k > 1,
      the cost of finding an F_{p^k}-isogeny between arbitrary curves is Omega(p^{k/2}) for
      any known algorithm, matching or exceeding Pollard rho before any special-curve saving
      is applied. For k >= 1, the mechanism costs Omega(p^{k/2}) >= Omega(p^{1/2}) = rho.
      This obstruction is based on robust heuristics (random-graph hitting-time) and is
      conservative (actual cost likely L_{p^k}(1/2) >> p^{k/2}).
    - >-
      Within-class uniformity (IDEA-20260807-0afbab): All curves in an ordinary isogeny class
      share the same group order N, embedding degree, CM discriminant, and GHS profile. All
      known DLP algorithms key on these trace-determined parameters, so no curve in the class
      has lower DLP complexity than any other. This obstruction is empirical ("no known
      algorithm depends on j"), not proven. However, it is consistent with obstructions 1-3
      and strengthens the conclusion.
    - >-
      Independent reviewer (TASK-20260807-d8bb19-reviewer) confirmed all three proposals are
      structurally sound and the recommendation to close SG-ECDLP-002 is justified. The
      reviewer notes that the reference document inputs/refs/research/ISO_GOAL_isogenous_weak_curve.md
      provides independent confirmation: "No curve F_p-isogenous to P-256 or P-224 has a
      meaningfully easier ECDLP than the base curve."
    - >-
      Red team (TASK-20260807-d8bb19-redteam) confirmed closure is directionally correct but
      premature by one evidentiary step: within-class uniformity is empirical, not proven.
      The red team recommends scoping the closure to the three proven obstructions. This
      decision adopts that recommendation.
    - >-
      All successor directions (DIR-2, DIR-3) identified in DEC-20260804-2fae6a have been
      explored and found blocked. H-IT-001 should transition from weakened to rejected_scoped.
      The isogeny-transfer research lane (SG-ECDLP-002) is closed. Research effort should
      redirect to non-isogeny approaches for ECDLP.

  h_it_001_transition:
    from: weakened
    to: rejected_scoped
    scope: >-
      All isogeny-transfer approaches for generic prime-field ECDLP: ordinary F_p-isogenies,
      extension-field isogenies, and within-class transfer mechanisms connecting a generic
      non-special curve to any special family or weaker curve. Mechanism ruled out by four
      obstructions: (1) Tate theorem (unconditional), (2) surface-weakness gap (proven),
      (3) isogeny-finding cost (robust heuristic), (4) within-class uniformity (empirical).
    surviving_open_questions:
      - >-
        Supersingular isogeny paths (whether they can provide a sub-rho bridge; out of scope
        of this decision)
      - >-
        Isogeny-graph spectral methods (exploiting spectral properties of the isogeny graph
        itself rather than using the graph as a bridge; residual open direction noted by
        red team objection R4)
      - >-
        Non-isogeny approaches for ECDLP (index calculus, relation collection, etc.; out of
        scope of this decision)

  sg_ecdlp_002_transition:
    from: active
    to: closed
    scope: >-
      SG-ECDLP-002 is closed scoped to the three proven obstructions (Tate theorem,
      surface-weakness gap, isogeny-finding cost). Within-class uniformity is held as
      unverified pending the toy-scale test in IDEA-20260807-0afbab. The closure is based
      on theoretical analysis and known mathematics, not experimental confirmation. The
      toy-scale tests in the three proposals remain available for future validation if
      desired.
    closure_reason: >-
      No viable isogeny-transfer mechanism exists for generic prime-field ECDLP. All
      successor directions (DIR-2, DIR-3) have been explored and found blocked by structural
      obstructions. The isogeny-transfer approach is structurally infeasible.

  exact_next_action: >-
    Redirect research effort to non-isogeny approaches for ECDLP. Open a new sub-goal under
    GOAL-ECDLP-001 for a different ECDLP attack vector (e.g., index calculus, relation
    collection, or a novel approach not yet explored). The toy-scale tests in the three
    proposals (IDEA-20260807-{15f103,ecdde8,0afbab}) remain available for future validation
    if desired, but are not required for the closure decision.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No KN-FIND entry is promoted by this decision. The four obstructions are applications
      of known mathematics (Tate theorem, GLV analysis, isogeny-finding cost heuristics,
      isogeny-class invariants), not new discoveries. The evidence strength is preliminary
      (theoretical analysis without experimental confirmation). The owed promotion from
      DEC-20260804-2fae6a (Tate isogeny theorem applied to ECDLP ordinary-isogeny transfer
      obstruction) is addressed in the analysis file experiments/SG-ECDLP-002/analysis.md
      and the evidence record EV-ECDLP-b3e847, but does not warrant a separate KN-FIND entry
      at this time. If the toy-scale tests are run and confirm the obstructions, the evidence
      strength would upgrade to replicated and a KN-FIND promotion would be warranted.
    not_warranted_reason: >-
      Evidence strength is preliminary (theoretical, not experimental). The four obstructions
      are applications of known mathematics, not new discoveries. A KN-FIND promotion would
      be warranted if the toy-scale tests are run and confirm the obstructions (upgrading
      evidence strength to replicated).

  pareto_integrity:
