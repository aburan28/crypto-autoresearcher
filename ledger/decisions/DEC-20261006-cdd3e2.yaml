  context: >-
    /design-experiment, one contract. IDEA-20261006-4b8f91 is on
    origin/design/mlkem-0e9abf-isometry and is not on origin/main. The
    question is RQ-SDEG-001. No hypothesis or experiment on origin/main
    cites that full id. The branch design/sdeg-4b8f91 was created from
    origin/main and git merge origin/main reported already up to date.

    The contract freezes primes 31, 61, and 127, cardinalities 4, 6,
    and 8, two ordinary curves per prime, eight factor-base draws per
    cell, grevlex, and the integer I = d_solve(127, 8) - d_solve(127, 4)
    on pooled lower medians of sixteen degrees. Success is I >= 1.
    The concrete negative is a finished I = 0. A finished I < 0 is the
    same directional failure. No Groebner basis was computed in this
    session and no degree was recorded.

    This session opened KR-IC-5a43e5, the summation-polynomial row, and
    the explicit S_3 polynomial in
    coordination/reviews/pfdr-battery-20260904/reviews/TASK-20260904-642cf5/v1_blind_rederive.py.
    It also opened KR-RHO-cd86f5, KR-RHO-755e35, KR-RHO-898783,
    KR-RHO-46c2c6, KR-RHO-7d93f6, KR-RHO-6239aa, KR-RHO-fb88e6,
    KR-IC-955fd6, and KR-IC-f5c584 while screening proposals. Those
    rows are not the increment of 1.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. Success fails
    when a finished increment is 0 or negative against a matching
    audit cell. No field required for approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - A finished increment of 0 is reachable as a recorded outcome, so success is not automatic.
    - The support-matched random arm, the two-curve flag, the comparator curve, and the audit-cell recompute are the instrument controls.
    - An incomplete cell is not scored as an increment of 0.
    - This session did not compute a degree and did not claim that the exponent moves.

  evidence_refs: []
  limitations:
    - The measurement covers three toy primes and three cardinalities. It does not transfer to cryptographic primes or to B growing like p to the one-third.
    - A pattern in solving degree is not a change in rho cost.
    - An audit mismatch or a missing degree transcript is an instrument failure and is not an increment of 0.
    - A timeout is failed_infrastructure and is not a mathematical negative.
    - This decision authorizes a later execution. It does not start one.
    - This decision does not edit a goal head.

  next_actions:
