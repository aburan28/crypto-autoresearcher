coordinator_decision:
  id: DEC-20260730-004
  context: >-
    User policy directive: no goals are to be paused. GOAL-CRYPTO-001 was set to
    status=paused by DEC-20260724-014 after BATCH-012 because the declared
    twelve-batch campaign budget was exhausted without an admissible next
    mechanism (EV-CRYPTO-012; red-team CONFIRM FINAL_NO_CANDIDATE over the
    enumerated finite checked set). Pause as a campaign disposition is
    rejected; the laboratory / literature disposition in EV-CRYPTO-012 /
    DEC-20260724-014 is otherwise unchanged.
  decision: rescind_pause
  target_ids:
    - GOAL-CRYPTO-001
    - DEC-20260724-014
  rescinds:
    decision_id: DEC-20260724-014
    rescinded_fields:
      - goal_disposition.status=paused
      - pause as terminal campaign disposition for declared budget exhaustion
    preserved_from_DEC-20260724-014:
      - FINAL_NO_CANDIDATE over the BATCH-012 enumerated finite checked set
      - no recognized >96-bit certificate-verified solve
      - no fully charged matched-rho advantage
      - no crypto-tier evidence or promoted KN-FIND
      - zero curve execution in BATCH-012
      - claim_tier toy / strength preliminary on EV-CRYPTO-012
  rationale:
    - >-
      User directive forbids pause as a disposition for active campaign work.
      Declared budget exhaustion blocks further batches under the prior
      maximum_batches=12 ceiling; it does not authorize status=paused under
      the user policy.
    - >-
      DEC-20260724-014's research adjudication stands: BATCH-012 coverage
      repair and candidate screen produced no admissible next mechanism;
      completion criteria remain unmet. Those findings are not reopened or
      recharacterized as cryptanalytic success.
    - >-
      GOAL-CRYPTO-001 returns to status=active. Coordinator authorizes a
      one-batch campaign-budget amendment (maximum_batches 12→13) solely to
      open the next admissible discovery/readiness literature screen as
      BATCH-013. No curve compute, breakthrough claim, or crypto-tier
      promotion is authorized by this disposition-only amendment.
    - >-
      Fabricating a candidate, certificate, or matched-rho advantage remains
      forbidden. Completion still requires the goal's published criteria and
      any applicable three-model closure quorum.
  evidence_refs:
    - EV-CRYPTO-012
    - DEC-20260724-014
    - coordination/goals/GOAL-CRYPTO-001/batches/BATCH-012/tasks/TASK-20260724-915/red_team_report.yaml
  limitations:
    - Does not mark GOAL-CRYPTO-001 completed.
    - Does not invent an admissible ECDLP mechanism, certificate, or advantage.
    - Does not reopen or amend BATCH-001..BATCH-012 findings.
    - Does not authorize curve execution, key recovery, relation campaigns, or
      operational attack code.
    - Budget amendment is exactly one additional discovery/readiness batch
      (BATCH-013); further extension requires a later Coordinator decision.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Disposition-only Coordinator amendment under user pause policy; no new
      cryptanalytic finding beyond EV-CRYPTO-012 / DEC-20260724-014.
  goal_disposition:
    status: active
    prior_status: paused
    prior_decision_id: DEC-20260724-014
    campaign_budget_amendment:
      maximum_batches_from: 12
      maximum_batches_to: 13
      authorized_next_batch: BATCH-013
    completion_blocked_on: >-
      Admissible primary-source or externally supplied formal mechanism for
      ordinary large-prime-order E(F_p) that passes discovery and
      experiment-readiness gates, followed by certificate-verified >96-bit
      advantage work and independent Validator/Red Team / crypto-tier ledger
      promotion per GOAL-CRYPTO-001 completion_criteria.
    note: >-
      Pause disposition of DEC-20260724-014 is rescinded. Goal remains active
      until completion criteria are met with required reviews and ledger
      archive, or until a future Coordinator decision under an explicit
      user-authorized terminal disposition other than pause.
  next_actions:
    - >-
      Open BATCH-013 under the one-batch budget amendment (maximum_batches=13):
      run a discovery/readiness literature screen for newly retrieved primary
      sources or externally supplied formal mechanisms on ordinary
      large-prime-order E(F_p), with quoted source semantics and a
      field-by-field fingerprint showing a falsifiable gain outside prior
      CRYPTO routes; require every readiness cost and certificate field before
      any curve work. Resume from BATCH-012 FINAL_NO_CANDIDATE checkpoint
      (EV-CRYPTO-012). Do not claim crypto-tier breakthrough from literature
      alone. Do not fabricate candidates.
  decided_by: coordinator
  decided_at: '2026-07-30'
