  rationale:
    - A missing module on the host is an infrastructure fault, not evidence about H-BINSTD-336a46 or HEUR-H1 (AGENTS.md core rule 3 and 5). No result, label or measurement exists from the attempt, so rerunning is not a favourable-outcome rerun and does not select among outcomes.
    - >-
      The supervisor never reuses a run directory (tools/experiment_execution.py execute_trial creates it exclusively), so RUN-BINSTD-367c7a is spent. Under trial-plan-v2.json its trial is needs_reconciliation (the receipt status is not output_validated) and stages 1 and 2 depend on it, so v2 cannot proceed. docs/experiment-execution.md requires a retry to use a new immutable run id with explicit additive authorization after confirming the prior worker is no longer active, retaining the stable trial identity and the original seed and parameters, and to distinguish retries from new replications. This is a retry: trial id stage0-n19-n23-freeze, catalog seed 202610033364 (fixed in the frozen run.py), argv, memory and sources are unchanged.
    - >-
      The supervisor reads queue and task_id from the plan, so a retry needs a successor plan naming a new queue and executor card. Same additive route and shapes as DEC-20261004-de863c, and the same shapes as the SATIC/GRUMPY repairs (DEC-20261004-51f151, DEC-20261004-b782ca): successor plan with an amendment block, disjoint single-task queue with executor and snapshot cards, full artifact coverage. The immutable records (plan v2, queue 8b2acb, handoff 8b2acb, DEC-20261004-de863c, the claim and release) are left unedited.
    - >-
      Artifact coverage was derived from the frozen driver, not copied from v2. tools/experiment_execution.py authorize() requires the 8 supervisor-generated files plus the trial's artifacts (manifest.yaml, raw-result.json) per run: 10 paths per run. Beyond them run.py writes stage0/preregistered-predictions.json and stage0/v-catalog.json (lines 431-432), stage1/panels.json and stage1/control-table.json and RESULTS.md (lines 587, 607, 645), and stage2/null-results.json (line 813, only when Stage-1 is O-SUPPORT; RESULTS.md is also unlinked and rewritten at lines 815-840). Stage 1 reads stage0/v-catalog.json and stage0/preregistered-predictions.json (lines 525-526); stage 2 reads stage1/panels.json, stage1/control-table.json and stage0/preregistered-predictions.json (lines 729-731); check.py reads the stage0 and stage1 files and stage2/null-results.json (lines 79-161). Stages 1 and 2 therefore depend on files written by stage 0 and 1 of the SAME plan execution, and all six non-run outputs are declared in the new queue: 36 artifact paths in total.
    - >-
      The planned stage-0 trial's argv passes experiments/EXP-BINSTD-791e4c/trial-plan-v1.json as --trial-plan, as in v1 and v2. run.py main() only checks that this path is a file (lines 891-894). It is kept as-is: changing it would change the frozen argv. The execution binding, not the argv, names the launched plan (trial-plan-v3.json).
    - The write-once driver (write_json and write_text refuse to overwrite) writes the stage outputs outside the run directories. Because the failed attempt wrote none, v3 is not blocked by an existing file. This is the reason the retry is safe now and a reminder that a failure AFTER stage-0's outputs are written would block any same-path retry and force a different successor design.
