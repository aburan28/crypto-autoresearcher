coordinator_decision:
  id: DEC-20260809-e4f385
  goal_id: GOAL-SSI-001
  batch_id: BATCH-5a886c
  recorded_by_task: TASK-20260809-feffca
  archived_by: TASK-20260809-feffca
  context: >-
    BATCH-5a886c opened an additive v7 successor to EXP-SSI-8fbe66 after the
    BATCH-b47cd5 Validator and Red Team found the v6 finite contract incomplete.
    Fresh independent Validator and Red Team sessions reviewed the immutable
    v7 snapshot. Neither executed an experiment or diagnostic.
  decision: refine
  decision_scope: >-
    Retain EXP-SSI-e29417 as a materially improved but still incomplete design
    candidate and open a canonicalization successor. This decision does not
    freeze the contract, authorize execution, change hypothesis or experiment
    status, or make any SSI, SQIsign, attack, security, novelty, or exponent claim.
  target_ids: [IDEA-20260806-9c2f80, EXP-SSI-8fbe66, EXP-SSI-e29417, GOAL-SSI-001]
  evidence_ids: [EV-SSI-08a98f]
  review_ids: [VAL-20260809-f3ef91, RT-20260809-9e3c34]
  review_task_ids: [TASK-20260809-f3ef91, TASK-20260809-9e3c34]
  snapshot_commit: 88e25821911863fe52e46980a0bd8ef40d552876
  queue_binding_commit: a1a30ef4b
  rationale:
    design_progress: >-
      The v7 successor adds direct predecessor provenance, explicit helper slot
      and probe intent, owner-set and target-domain index intent, larger bounded
      integers, finite outcomes, certificate availability, full-stream replay,
      finite C-pair reference, and synthetic rational-reference clauses. Both
      reviews confirm these as design improvements only.
    independent_validation: >-
      Validator VAL-20260809-f3ef91 returned incomplete with
      DISSENT_ON_FREEZE_AND_EXECUTION_READINESS. It verified v7's direct
      predecessor binding and major repairs, then recorded unresolved precedence,
      schema, physical helper/index, counter coverage, finite accounting,
      certificate, HNF/output, replay/null, C-pair, and synthetic defects.
    independent_red_team: >-
      Red Team RT-20260809-9e3c34 returned
      DISSENT_ON_FREEZE_AND_EXECUTION_READINESS. It independently found that
      v1/v6 and v1.1/v2 clauses conflict, and that helper, order/query, counter,
      finite cost, certificate, output, replay/null, pair, and synthetic bytes
      remain non-recomputable.
    execution_authorization:
      granted: false
      reason: >-
        v7 is not one canonical byte-level schema and still lacks complete
        helper/index payloads, bounded field coverage, finite accounting operands,
        certificate/HNF/output path, and replay/null/calibration semantics. No
        execution task may be opened from this decision.
    claim_boundary: >-
      No measurement, run, attack, security, exponent, novelty, hypothesis
      transition, or goal completion follows from either review.
  official_research_state_changed: false
  hypothesis_status_transition: none
  experiment_status_transition:
    - id: EXP-SSI-e29417
      from: review_required
      to: review_required
      note: >-
        The v7 successor remains review_required, unfrozen,
        execution_authorized:false, evidence_eligible:false, and approved_by
        null. EXP-SSI-8fbe66 and all earlier predecessors remain immutable.
  asymptotic_promotion_gates:
    gate_1_proof_decomposition: open
    gate_2_numbered_heuristics: open
    gate_3_concrete_cost_table: open
    gate_4_independent_review_and_red_team: >-
      Completed only as an execution-blocking design review; all scientific
      promotion gates remain open.
  next_actions:
    - >-
      Open an additive canonicalization successor to EXP-SSI-e29417 with one
      authoritative schema namespace and explicit precedence that removes or
      supersedes all conflicting v1/v6 clauses; bind legacy-schema compatibility
      and an INCUMBENT-FOE-v1 source artifact.
    - >-
      Close the single physical layouts for C-HELPER, ORDER-MANIFEST, and the
      target/selection query index, including all pointer, payload, digest,
      selection, owner-set, memory, and byte-count operands.
    - >-
      Close every bounded wire field, finite builder/terminal/padding rule,
      setup/event FOE sum, certificate/HNF/output path, replay/null/pair gate,
      and synthetic per-cell rational reference. Snapshot before fresh
      independent review.
    - >-
      Keep EXP-SSI-e29417, EXP-SSI-8fbe66, and all SSI advice-frontier
      experiments unapproved, unfrozen, and unexecuted.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This batch measured nothing and promotes no technique, theorem, attack,
      exponent, security conclusion, or knowledge item.
  claim_ceiling: >-
    The strongest true statement is that EXP-SSI-e29417 materially improves the
    physical-contract design but remains non-canonical, execution-unauthorized,
    and underdefined. This is not evidence about the SSI problem or any deployed
    security level.
  decided_by:
    task: TASK-20260809-feffca
    role: coordinator
    policy: coordinator-orchestration-code
  decided_at: '2026-08-09'
