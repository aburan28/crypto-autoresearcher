      CONFIRMED GENUINE-PROGRESS WINDOW AND BY FAR THE WIDEST DETECTION GAP IN
      THIS LANE'S HISTORY, VARYING INDEPENDENTLY OF EACH OTHER. RUN-FROB-7b3e6d's
      last confirmed write (2026-09-22T04:54:33.616931793Z, roots.jsonl.gz at
      15583656 bytes) establishes a floor of at least 4m39s of genuine
