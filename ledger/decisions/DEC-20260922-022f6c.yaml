      Python supervisor destroyed before any receipt-writing logic could run)
      matches every one of its eighteen predecessors under
      driver-v2.py/checker-v2.py in kind, though not in output size. Nineteen-
      for-nineteen launch attempts under that source have now been killed by
      whole-environment restarts, all non-scientific, non-protocol
      infrastructure signal. None of RUN-FROB-7b3e6d or any predecessor says
      anything about H-FROB-73df22, RQ-FROB-7d8dd4, or whether Frobenius
      structure moves the index-calculus exponent.
    - >-
