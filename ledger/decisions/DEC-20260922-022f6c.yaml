      restarts' own confirmed floors (both approximately 3h02m), noted only as
      an observation of high variability, not a trend or regression. The gap
      itself (last write to confirmed reboot, ~9h10m33s) is BY FAR the widest
      disclosed in this lane's history, more than double the eighteenth
      restart's own previous-widest ~3h12m56s gap, so this nineteenth point's
