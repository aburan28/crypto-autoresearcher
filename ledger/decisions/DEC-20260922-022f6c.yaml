      INFRASTRUCTURE/PROTOCOL SIGNAL, NEVER NEGATIVE MATHEMATICAL EVIDENCE,
      PER AGENTS.md CORE RULE 3 / CLAUDE.md RULE 3. RUN-FROB-7b3e6d's
      resulting run-directory shape (real, partial scientific output --
      15583656 bytes of roots.jsonl.gz, committed DIRECTLY since it is under
      GitHub's 100MiB limit, unlike the eighteenth restart's own
      2443452479-byte output which required the oversized-artifact-pointer.json
