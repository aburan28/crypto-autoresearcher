  rationale:
  - The losses are infrastructure (host reclaimed while idle); docs/experiment-execution.md allows a retry under
    a new run id with additive authorization, keeping trial identity, seed and parameters.
  - Each retry carries its trial's seed, so it measures the instances the killed attempt would have measured.
  - Retries are once each and final whatever their outcome, so no outcome is rerun until it looks favourable.
