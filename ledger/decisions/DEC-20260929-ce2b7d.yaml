coordinator_decision:
  id: DEC-20260929-ce2b7d
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-74ebef
  recorded_at: '2026-09-29'

  context: >-
    Written while merging origin/main (5043409632, 2026-09-29) into
    claude/ecdlp-endomorphism-analysis-4m2w3z, the branch that carried
    BATCH-74ebef, at the user's direction. PR #1493 was opened first, as a
    draft, with the two conflicts documented and unresolved because AGENTS.md
    forbids resolving a shared-record conflict by picking a side; the user then
    asked for this reconciliation. The branch last synced with origin/main on
    2026-08-11 (merge base 3e12f4bb0, the merge of PR #335). origin/main was
    11,689 commits ahead and the branch 46 ahead (36 non-merge). The merge-base
    overlap check (git diff --name-only against the actual merge base, not HEAD)
    found 2 paths changed on both sides, out of 52,172 changed on main and 238
    on the branch, and both are textual conflicts:
    ledger/goals/GOAL-ENDO-001/goal.yaml and
    tools/run_supersession_registry.yaml. A block-level three-way comparison of
    goal.yaml (base, branch, main) then showed that only THREE fields were
    changed by both sides -- the scalar goal-head fields current_batch_id,
    latest_verified_commit and next_action -- and that everything else in the
    file was one-sided or additive. This decision records how each was
    resolved and why the resolution settles no question this Coordinator has no
    basis to settle.

  decision: supersede
  decision_type_rationale: >-
    Not support, weaken, reject_scoped, replicate or expand: nothing was tested
    or measured, so there is no outcome to score in either direction. Not
    refine or pause: it narrows no question and stops nothing. What it does is
    supersede, as the goal's head, this branch's own three scalar head values
    with origin/main's, retain every superseded value verbatim, and record the
    batch those values named as a checkpoint. `supersede` is administrative
    here and says nothing about the reliability of BATCH-74ebef's results,
    which stand at the tiers their own decisions record.

  target_ids:
  - GOAL-ENDO-001
  - BATCH-74ebef
  - BATCH-d7e255
  - BATCH-e59907
  - EXP-ICINV-4d33aa
  - EXP-CANL-96b0ad
  - EXP-ICINV-e0cd8f
  - EXP-INSTR-36c8cf
  - H-ICINV-6c7920
  - H-ICINV-d5e351
  - H-CANL-e59a06
  - DEC-20260810-d82c61
  - DEC-20260811-af68d1
  - ledger/goals/GOAL-ENDO-001/goal.yaml
  - ledger/goals/GOAL-ENDO-001/checkpoints/BATCH-74ebef.yaml
  - tools/run_supersession_registry.yaml

  rationale:
  - >-
    origin/main's THREE SCALAR HEAD VALUES STAY, BECAUSE A HEAD NAMES ONE
    CURRENT VALUE AND THIS COORDINATOR CANNOT SHOW THE BRANCH'S IS MORE
    CURRENT. current_batch_id, latest_verified_commit and next_action each hold
    exactly one value. origin/main's are seven weeks newer than the branch's
    and follow 285 commits touching GOAL-ENDO-001's ledger and coordination
    paths that the branch never saw (BATCH-e59907 and the JINV gate-repair and
    custody-recovery batches before it). Keeping the branch's values would
    assert that a state last edited on 2026-08-11 is the goal's present state;
    keeping neither is not possible in a file that parses. This is the same
    outcome a mechanical three-way merge gives for a field only one side
    changed, extended to the three fields both changed by the one rule that
    does not require this Coordinator to judge the science: the newer,
    independently-verified head is authoritative for scheduling.
  - >-
    NOTHING THE BRANCH WROTE WAS DELETED, WHICH IS WHAT KEEPS THIS FROM BEING
    "PICKING A SIDE" (AGENTS.md rule 4: corrections supersede, never
    overwrite). The branch's next_action is retained verbatim, 226 lines, under
    next_action_note_20260811_endo_analysis_branch_head_superseded. Its
    current_batch_id (BATCH-74ebef) and latest_verified_commit
    (9480acde8168bb3c67cd7ea65b66d26db389ca9d, a commit on origin/main that the
    branch merged in on 2026-08-11) are recorded in
    current_batch_id_note_20260929_endo_analysis_branch_head and
    latest_verified_commit_note_20260929_endo_analysis_branch_head. Every other
    block from either side of goal.yaml is kept verbatim: this branch's ten
    dated notes, and all 82 of main's blocks. dispatch_queue_path was changed
    only on origin/main and follows it; it was never a conflict.
  - >-
    TWO DUPLICATE KEYS ON THE BRANCH'S SIDE WERE HANDLED WITHOUT LOSING TEXT.
    The branch's goal.yaml carried two mapping keys twice, which PyYAML reads
    silently as last-wins. next_action_note_20260807_batch_cb71b5_superseded
    appeared twice, byte-identical to the one copy origin/main carries, so the
    redundant copy was collapsed. next_action_note_20260810_merge_hazard
    appeared twice with DIFFERENT text: origin/main's original and a longer
    2026-08-11 edition the branch had appended under the same key. Both are
    retained; the longer one now sits under
    next_action_note_20260810_merge_hazard_branch_edition. The branch's
    earlier edit of dispatch_queue_path_note_20260810_batch_d7e255 and
    latest_verified_commit_note (origin/main carries the older text of both)
    applies as an ordinary one-sided change.
  - >-
    THE SUPERSESSION REGISTRY CONFLICT WAS A PURE DOUBLE-APPEND. Both sides
    appended at end of file. The merged file keeps origin/main's 86 records and
    the branch's one (RUN-CANL-78b8bd's manifest_v2 supersession): 87 records,
    no duplicate run_id, every record from both sides present.
  - >-
    WHAT ORIGIN/MAIN DID IN PARALLEL ON THE SAME EXPERIMENTS, STATED AS FACT
    AND NOT ADJUDICATED. EXP-INSTR-36c8cf: origin/main carries amendments v4
    through v12 and runs RUN-INSTR-36c8cf-phaseA-2a5cd1 and
    RUN-INSTR-36c8cf-phaseA-v2-57ca9a (30 main-side paths since the merge
    base); this branch's analysis chain (DEC-20260811-a4c7ec, -aed346,
    -45583f, -133fbe; EV-INSTR-600710, EV-INSTR-acb893) was written against
    amendments v1 to v3 only. EXP-ICINV-e0cd8f: origin/main carries 65 new
    paths including runs RUN-ICINV-geom-gates, -geom-m3, -geom-m3-v2,
    -geom-m4, -geom-m4-v2 and -geom-m4-v3, while this branch's
    RUN-ICINV-e0cd8f-m3class (verdict CLASS-VARYING; EV-ICINV-8afb64;
    DEC-20260811-a3398a; KN-FIND-ddd982) is a separate record set from the
    same contract. EXP-ICINV-4d33aa and EXP-CANL-96b0ad: origin/main changed
    nothing (0 paths). This decision does not compare either side's science
    with the other's.
  - >-
    TWO HYPOTHESIS STATUSES ARRIVE ON MAIN WITH THIS BRANCH, AND THEIR
    CURRENCY IS NOT ESTABLISHED HERE. H-ICINV-6c7920 (rejected_scoped,
    DEC-20260810-cc6577, EV-ENDO-eb58c4) and H-ICINV-d5e351 (refined_scoped,
    DEC-20260811-a3398a, EV-ICINV-8afb64) are files origin/main never changed,
    so they merge as one-sided changes. Each status was recorded by its own
    decision on the evidence available on 2026-08-10 and 2026-08-11 and stands
    at that scope. Whether origin/main's later EXP-ICINV-e0cd8f geometry runs
    bear on H-ICINV-d5e351, or on H-ICINV-6c7920's scope, is not evaluated here
    and is named as a next action rather than assumed either way.
  - >-
    THIS BRANCH'S `pause` DECISIONS ARE DECISION-LEVEL, NOT GOAL STATUS.
    DEC-20260810-d82c61, DEC-20260811-af68d1, DEC-20260811-45583f and
    DEC-20260811-a4c7ec each pause a specific dispatch or amendment. GOAL-ENDO-001
    is `active` and stays `active`; origin/main's rule that a goal is never
    paused (AGENTS.md "Goals are never paused") is about goal status and is not
    engaged. That rule also says a live impediment belongs under `impediments`
    on the goal head; this decision does not add one, because whether any
    of the branch's pauses is still live against origin/main's own state is
    precisely what it does not establish.
  - >-
    BATCH-74ebef IS CLOSED HERE, AND THE CLOSURE IS ADMINISTRATIVE. It had no
    goal-level record other than the goal.yaml head that conflicted, so
    origin/main's head would otherwise have erased it from the goal's own
    account. ledger/goals/GOAL-ENDO-001/checkpoints/BATCH-74ebef.yaml records
    it, with counts re-derived from the tree, its own reviews, and the open
    items it leaves. Every handoff on the branch has a committed execution
    report or snapshot, so no task of the batch is left mid-flight in committed
    state. The branch also carries work under BATCH-d7e255's label (five
    decisions, three evidence records, four handoffs, five run directories, six
    review reports and KN-FIND-ddd982); BATCH-d7e255's own checkpoint is
    write-once, predates it, and is unchanged, so that work is listed in the
    BATCH-74ebef checkpoint rather than edited into another batch's record.
  - >-
    WHAT THIS DECISION DOES NOT DO. It moves no hypothesis or goal status and
    approves no experiment. It authorizes no dispatch, deprioritizes and closes
    no lead (AGENTS.md rule 9), and re-verifies no sha beyond git merge-base
    --is-ancestor of the two heads it names. It adjudicates neither side's
    science and does not decide whether any carried-forward item is still worth
    doing.

  evidence_refs:
  - ledger/goals/GOAL-ENDO-001/goal.yaml
  - ledger/goals/GOAL-ENDO-001/checkpoints/BATCH-74ebef.yaml
  - tools/run_supersession_registry.yaml
  - ledger/decisions/DEC-20260810-d82c61.yaml
  - ledger/decisions/DEC-20260811-af68d1.yaml
  - docs/concurrent-goal-lanes.md

  limitations:
  - >-
    This is a ledger reconciliation, not a research result. It reports no
    measurement, reviews no evidence, and its claim tier is n/a.
  - >-
    The figures above come from git on 2026-09-29 and are re-derivable:
    11,689 and 46 from git rev-list --count HEAD..origin/main and
    origin/main..HEAD before the merge; 52,172 and 238 and the overlap of 2 from
    git diff --name-only --no-renames against the merge base 3e12f4bb0; 285 from
    git log 3e12f4bb0..origin/main -- ledger/goals/GOAL-ENDO-001
    coordination/goals/GOAL-ENDO-001. The line-preservation check on the merged
    goal.yaml (every line of origin/main's version present and in order, except
    the updated_at value and the older text of the two notes this branch had
    itself edited; every line of the branch's version present, except the four
    superseded scalar or opener lines, the updated_at line, the collapsed
    duplicate block and one renamed key line) was run by this Coordinator and
    not by an independent session.
  - >-
    This Coordinator compared goal.yaml structurally and did not read
    origin/main's roughly 3,000 lines of goal-head notes end to end. The claim
    that origin/main's head is authoritative rests on its newer date, its
    commit count and its consistent scalar values, not on a reading of every
    note.
  - >-
    The merged tree was validated with origin/main's own tools; those results
    are recorded on PR #1493, not here. The branch's records were written under
    a validator seven weeks older than main's.
  - >-
    No independent review was commissioned. The resolution is mechanical and
    checkable, and a reviewer can re-run the same block-level comparison
    against the three stage versions of the file from the merge commit.

  next_actions:
  - >-
    A Coordinator ranking, against origin/main's own goal head, of the items
    this branch leaves open. Named, not decided: N13 (randomized factor-base arm
    for EXP-ICINV-4d33aa, needing a versioned amendment), N14 (amendment v4 for
    the SR3 gate's false-pass rate, drafted at
    experiments/EXP-ICINV-4d33aa/amendments/v4.yaml and unapproved) and N15
    (version wiring in harness/run_fullgroup.py), all from DEC-20260810-cc6577;
    EXP-CANL-96b0ad amendment v2 (four required fixes, drafted at
    experiments/EXP-CANL-96b0ad/amendments/v2.yaml and unapproved); and the two
    conditions of DEC-20260811-133fbe, which were written against amendment v3
    of EXP-INSTR-36c8cf and are not shown to apply to origin/main's v4 to v12.
  - >-
    If any of those is still live, open it as a lane (docs/concurrent-goal-lanes.md)
    and let its own ledger archive edit the goal head additively, rather than
    reviving the branch's superseded next_action.
  - >-
    Check H-ICINV-6c7920 and H-ICINV-d5e351 against origin/main's later
    EXP-ICINV-e0cd8f runs before treating either status as current.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is an administrative reconciliation of a goal head and a registry. It
      reports no measurement, reviews no evidence and states no reusable
      technique.

  decided_by: coordinator
  decided_at: '2026-09-29'

  inference:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: null
    reasoning_effort: null
    fallback_used: true
    fallback_reason: >-
      This Claude Code harness cannot resolve the policy aliases in
      orchestration/model-policies.yaml; every alias falls back to the one model
      the session runs on. That model's identifier is not written into this
      repository artifact because the session's instructions bar it; it is
      recorded as absent, not guessed, and nothing is silently substituted
      (AGENTS.md rule 11).
    degraded_allowed: false
    degraded_requirements: []
    model_verified: false
