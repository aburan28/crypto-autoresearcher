  rationale:
  - The archived review gives exact counterexamples to assignment-only calibration andfinite log-p/log-N equivalence,andidentifies
    an overbroad sibling binding. Accept those scoped findings; they are not observations against ECDLP hypotheses.
  - The fixed SHA comparison remains useful as a reproducible finite rank andcandidate filter. Rather than assert
    an unverified random-oracle property as a fact,declare the actual rank descriptive andname the missing assumptions/proof
    boundary explicitly. Allnumeric gates andscientific questions remain active.
  - The1e6502 combined-family maximum stays a finite descriptive comparator with its local member/precision/cell
    domains; no false joint-probability claim is imported from its sibling.
  - Preserve every previously checked curve,counter,certificate,bootstrap,pair,member,count,control,threshold andresource
    definition. Resolve every affected cross-reference in full successors before data.
  - Standing approval permits this complete definition work without another user confirmation; no scientific execution,implementation
    orhypothesis transition is approved.
  accepted_definition_choices:
    EXP-ECDLP-184fc4:
    - Retain the exact fixed SHA schedule and every numeric candidate threshold. Call p_joint a deterministic descriptive
      comparison rank for actual execution; do not claim assignment exchangeability alone gives probability calibration.
    - State the additional joint-law/random-sampler assumptions that an inferential calibration would require,explicitly
      unadopted/unverified for actual SHA here. A future calibrated claim requires a separately specified model
      andproof; no new random draws ordata are introduced.
    - Keep the same rank1/65 candidate filter andall original observables,controls andscope. This is removal of
      an unsupported inference claim,not abandonment of the scientific lead.
    EXP-ECDLP-1e6502:
    - Bind only exact generic spectrum identities andthe finite-null order-statistic/tie/zero-dispersion subfields
      from the new184fc4 sibling; no family-specific567/42block is inherited.
    - Keep all102/136member,36cell,precision-specific stream andraw spectrum counts local. Explicitly define the
      existing combined family maximum over eligible(member,precision,cell)entries andthe64corresponding reference
      maxima,with p_joint descriptive asabove. No new member,null,cell,seed,threshold orcalibrated across-precision
      claim.
    EXP-ECDLP-2c3d20:
    - Use natural log(p) for the original primary sigma_center slope,both observed andevery matched null,over allsevenrungs.
      Keep the existing floor,rank/effect/replication conditions andseparate scalar OR route.
    - Do not substitute ln(N). Any retained ln(N) output must be separately named descriptive andcannot influence
      the original primary candidate. Do not introduce new data ordiscard any prior raw output.
