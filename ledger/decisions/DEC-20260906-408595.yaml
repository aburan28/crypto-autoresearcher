  # =======================================================================
  inference_provenance_ruling:
    escalated_by: TASK-20260906-0fbf69 (CF-9), runtime_session_receipt.yaml -> inference. The redraft producer's receipt records the identical divergence.
    the_question_as_asked: >-
      `python3 -m orchestration.adapter resolve --role executor` returns
      "executor-implementation -> anthropic:claude-sonnet-5 (effort=medium)" while
      the runtime self-reports a different model identifier. Is that a fallback
      under `fallback_allowed: false`?
    ruling: NO. It is not a fallback, and no violation is recorded against either producer.
    reasoning:
      - >-
        A FALLBACK REQUIRES A BINDING TO HAVE BEEN IN FORCE AND DEPARTED FROM. None
        was in force. `AUTORESEARCH_POLICY`, `AUTORESEARCH_BACKEND` and
        `ANTHROPIC_API_KEY` are ALL ABSENT from the process environment, verified by
        the dispatching session with `env` at dispatch time. The session was not
        launched via `python3 -m orchestration.adapter env`, so the adapter's output
        is the committed BINDING TARGET for that policy and NOT a statement about
        what served the subagent.
      - >-
        CONFLATING THOSE TWO IS A NAMED, ALREADY-ADJUDICATED DEFECT CLASS OF THIS
        PROGRAM: PRODUCER-POLICY-RESOLUTION-BINDING, recorded at CORR-20260815-092c9f
        correction_1, whose root cause is stated there as an archive-receipt author
        conflating the committed binding's target for a policy with the model that
        actually served the authoring session. CF-9 DID NOT COMMIT THAT DEFECT: it
        held `adapter_resolution` and `runtime_self_report` in separate blocks, set
        `model_verified: false`, ran no probe and recorded none, and ESCALATED rather
        than deciding. That is exactly correct under that correction and under its
        handoff constraint.
      - >-
        WHAT DOES BIND PER SUBAGENT UNDER THIS RUNTIME IS REASONING EFFORT, and it
        AGREED: requested `medium`, carried `medium`. CLAUDE.md's model policy note
        states that per-role MODEL selection under claude_code is process-level while
        EFFORT is the one part expressed per agent file. The model axis was therefore
        never bound for those sessions by construction; the effort axis was bound and
        honoured.
    what_this_ruling_does_not_do:
      - >-
        IT CERTIFIES NO MODEL IDENTITY. Which model served TASK-20260906-0fbf69 or
        TASK-20260906-ee372e remains UNVERIFIED - `model_verified: false`, NO PROBE
        RUN - and NO SUCCESSOR MAY READ THIS RULING AS ESTABLISHING A MODEL IDENTITY.
        A self-report read from a system prompt is a self-report, not a measurement,
        and both producers labelled it as one.
      - >-
        It does not extend to any round LAUNCHED UNDER `adapter env`. There a
        divergence would be a real fallback and `fallback_allowed: false` would bite.
      - >-
        It lifts nothing about the citation prohibition, moves no status, and
        touches no mathematical claim in either direction.
    bearing_on_the_rounds_findings: >-
      NONE, AND THIS IS WHY THE RULING WAS NOT URGENT. Every load-bearing CF-9 claim
      is git-derived and deterministic and is re-runnable from committed bytes by
      any successor on any model, so its validity does not depend on which model
      produced it. The dispatching session independently re-ran the blob-digest
      comparison, the blob enumeration, the introducing-commit identification, the
      absence of the experiment path at run 1's recorded commit, and the null
      object's digest, and reports each reproduced exactly; the REVIEWER re-ran
      three of the same checks and reports the same. Neither report is a substitute
      for the other and both are recorded.
    why_it_was_withheld_from_the_reviewer: >-
      DELIBERATELY, SO IT COULD NOT CONTAMINATE THE REVIEWER'S INDEPENDENT J4. The
      reviewer was told only that a divergence existed and was unresolved, recorded
      it as PENDING, expressly declined to express a view, and verified the
      divergence blocks itself rather than taking them from its prompt. Recorded as
      procedure_deviations PD-13, because a withheld ruling is a channel too.

  # =======================================================================
  rationale:
    - >-
      THE ONE BLOCKING FINDING OF THE PREVIOUS ROUND IS DISCHARGED, AND IT WAS
      DISCHARGED IN BOTH ITS LIMBS. RT-1's first limb was two spaces on eight
      continuation lines; its REAL content was the second limb - that an amendment
      replacing text in a machine-readable contract had no control that the result
      still loads. Both are done: the redrafted clause splices and parses, verified
      by an independent session with a committed script, and THE CONTROL NOW EXISTS,
      is committed, is re-runnable, and has been shown able to FAIL on five named
      negative objects including the one it would have been most embarrassing to
      pass on.
    - >-
      THE CONTROL WAS TESTED THE WAY CF-21 REQUIRES AND IT SURVIVED. AC-1's recorded
      defect was a pass ENTAILED BY ITS OWN CONSTRUCTION. The reviewer asked the same
      question of this control by running it rather than by reading it: on the
      unamended frozen file, three of its four assertions pass BECAUSE of the file's
      pre-existing shape - the entailment is real and is present - and the fourth
      fires. A control that discriminates only through one assertion is a narrower
      instrument than a green result suggests, and V-2 shows exactly where the
      narrowness lies. Recording both halves is what makes this a result rather than
      a reassurance.
    - >-
      THE REDRAFT CARRIES WHAT IT WAS ORDERED TO CARRY AND DOES NOT WIDEN, CHECKED
      MECHANICALLY IN BOTH DIRECTIONS. Completeness was checked against the ordering
      record's OWN WORDS, item by item, with the ordered phrases extracted and
      matched against the redraft's bytes. Non-widening was checked by flattening
      BOTH records into full key-path maps and comparing them BEFORE reading the
      redraft's own enumeration - which is how V-3 was found, and V-3's importance is
      precisely that it does NOT overturn non-widening.
    - >-
      CF-9 IS DISCHARGED AT ITS OWN STRENGTH AND THE HOLDING IS OVER. It was held
      twice with a scheduling reason that expired on its own terms, and BATCH-79a0cb
      recorded in advance that a third holding would read as deprioritization without
      a recorded reason. It was not held a third time. What it returned is exactly
      what an honest provenance procedure returns on a repository like this one: one
      run UNATTESTABLE, one PARTIALLY_ATTESTED with its decisive limb ATTESTED, and a
      null object that returns a THIRD answer so the procedure is not one that can
      only say no. DISCHARGING CF-9 LIFTS NO PROHIBITION BY ITSELF; it removes AT
      MOST ONE of several standing grounds.
    - >-
      AN UNATTESTABLE LIMB IS NEVER NEGATIVE MATHEMATICAL EVIDENCE. It is an
      infrastructure fact about what bytes a repository can recover, and it says
      nothing about the model, the contract, either run's results, or any isogeny
      problem in either direction. A `dirty_tree: true` run is not thereby invalid
      and this round adjudicates neither run's evidential status.
    - >-
      THE ROUND'S CREDIBILITY RESTS ON WHAT WAS EXECUTED, NOT ON WHAT WAS ARGUED.
      Two committed scripts, ten spliced objects, five declared negative objects plus
      the reviewer's own variants, a duplicate-key scan, a whole-document structural
      diff, a flattened key-path diff of two records, and three git checks re-run
      from scratch. That is why a round with no blocking finding can be recorded as a
      complete result rather than as a failure to find one.
    - >-
      AND ITS LIMITS REST ON THE SAME GROUND. ONE reviewer, of ONE model family, in
      ONE session, with blindness DELIBERATELY LIFTED, reviewing packages written by
      sessions of the same family under a launching prompt that named the trap and
      enumerated the negative objects. The mechanical results survive that discount
      because anyone can re-run them; THE JUDGEMENTS DO NOT, and this decision does
      not pretend otherwise.

