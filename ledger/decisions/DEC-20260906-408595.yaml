  citation_boundary:
    retained_verbatim: >-
      The `P=512` crossover value and its `w=2^80` sign are **NOT citation-eligible**.
      This task does not lift that prohibition. Only a committed Coordinator decision
      on independently reviewed evidence can lift it.
    predicate_extension_verbatim: >-
      In addition to the retained sentence, a row of any EXP-WESOVOW-001
      reconciliation is NOT citation-eligible when either (a) the two anchors
      disagree in the SIGN of the baseline comparison at that row, or (b) the
      smaller |margin| across the two anchors at that row is below that field size's
      anchor gap |Delta log2 T_full + Delta log2 M / 2|.
    ruling: RETAINED IN FULL, BOTH LIMBS. NOT LIFTED, NOT NARROWED, NOT WIDENED.
    this_is_the_fifth_consecutive_round_in_which_the_lift_was_available: >-
      DEC-20260904-166ab5, DEC-20260904-4c81b6, DEC-20260905-5f5592,
      DEC-20260905-3b8e94, and now this decision. THAT REPETITION IS ITSELF A REASON
