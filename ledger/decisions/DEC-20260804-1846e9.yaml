  id: DEC-20260804-1846e9
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-085
  recorded_by_task: TASK-20260804-110
  archived_by: TASK-20260804-111
  context: >-
    BATCH-085: Shparlinski ECCG approach for H-PSEUDO analyzed. DL circularity recurs.
    However: a RIGOROUS (non-circular) upper bound of O(p^{3/4} log p) was obtained.

  decision: partial_progress_record_and_advance
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    The Shparlinski/Weil-correlation method gives a RIGOROUS (non-circular) bound:
    |hat{1_F}(k)| = O(p^{3/4} log p)

    This is the FIRST non-circular upper bound on the H-PSEUDO character sum.
    It is rigorous but not tight:
    - Rigorous bound: |hat| = O(p^{3/4} log p) → C ≤ O(p^{1/4}/sqrt(B_frac))
    - H-PSEUDO target: |hat| = O(C * sqrt(B)) → C ~ p^{0.079}
    - Empirical value: C ~ p^{0.079} (much smaller than p^{1/4})

    The gap between rigorous bound and empirical value: factor of p^{0.171} at our scales.
    Closing this gap would prove H-PSEUDO; the argument currently reduces to H-PSEUDO itself.

    THIS IS GENUINE PARTIAL PROGRESS: The first rigorous (non-circular) bound
    establishes that C = O(p^{1/4} / sqrt(B_frac)), which is weaker than H-PSEUDO
    but is a theorem rather than an assumption.

    KN-FIND-e7a3b1 should be updated: now 7 methods tried (Shparlinski added),
    with a partial rigorous bound achieved.

    GOAL-ECDLP-001 stays active.

  first_rigorous_bound: >-
    |hat{1_F}(k)| = O(p^{3/4} log p) (Weil-correlation method via Shparlinski)
    Equivalent: C(p) = O(p^{1/4} log p / sqrt(B)) = O(p^{1/4} / sqrt(B_frac))
    At B_frac=0.05, p=2^256: C ≤ O((2^256)^{1/4}/0.22) = O(2^{64}/0.22) >> empirical p^{0.079}
    The rigorous bound does NOT imply negligible yield error at crypto scale (O(p^{1/4}) too large).

  exact_next_action: >-
    BATCH-086: Check whether the Weil-correlation method can be improved by using
    DIAGONAL CORRELATIONS specifically (h such that P + [h]G and P are simultaneously
    "small-x"). For diagonal h, the correlation T_{a,h} might be bounded tighter than
    the generic O(p^{1/2}) Weil bound, giving a better overall constant.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Rigorous bound (p^{3/4}) is too loose for practical implications.
      Update KN-FIND-e7a3b1 to mention the Shparlinski method and partial progress.

  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2
    sota_delta: {time_exponent: not_applicable}
  claim_ceiling: theoretical
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-04'
