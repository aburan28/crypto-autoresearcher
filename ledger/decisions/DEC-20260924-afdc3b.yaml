  disposition:
    outcome: revise
    approve_considered: >-
      REJECTED. CN-1's reading admits no conditioned approval: "If any other
      reachable classified site exists, this draft is NOT approvable as
      written, and the approval act orders a successor draft that covers every
      site" (lines 499-501). The readings "never license an approval with a
      changed rule" (lines 565-566). Approving with a condition that treats
      the callgrind site as exempt, or that adds a callgrind disposition, would
      be exactly that: a rule the approved text does not contain.
    route: >-
      A SUCCESSOR DRAFT THAT COVERS EVERY SITE, not Route B.
      - The healthresolve Route B (declare the health site out of scope) is
        the declared fallback only if CN-2 (iii) fails (lines 585-587). CN-2
        (iii) holds, so the health site stays wrapped by HR-3 exactly as
        drafted.
      - For the callgrind site, an analogous "declare it out of scope" route
        would narrow CLASSIFIED right after the census applied it. The
        successor rejects that (launchcover option CB).
      - The successor covers the callgrind site by an explicit disposition,
        with no new function replacement and no change to any criterion.
    successor_draft:
      id: AMD-EXP-GFPN-05ff43-20260924-launchcover
      path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_launchcover.yaml
      status: draft (approved_by null, approval_decision null)
      key_parameters: >-
        - It incorporates by reference the healthresolve text at
          ccb55334...291a70d: HR-1..HR-8 unchanged; HR-9 with DV-11 replaced
          and DV-17 added; HR-10 with R-1 binding SEVEN hashes; HR-11 with the
          CG-1 vocabulary; HR-13; the options, transfer assumptions,
          authorization and non_claims.
        - CG-1: the three sites S-1..S-3 and five unreachable entries, each
          with a disposition.
        - CG-2: the callgrind site is never re-solved (SE-2 (6) unchanged).
        - CG-3: the r3 wrapper RECORDS, for each callgrind child, its log
          hashes and log-visible SSF indicators in solver-events.json, and
          triggers nothing.
        - CG-4: REG-1 and X1..X17 are unchanged. A REG-1 difference in
          callgrind fields is a STOP, never evidence, and no exclusion is
          added after it.
        - CG-5: DV-17 runs the frozen callgrind_instructions R = 10 times per
          RUN-GFPN-ac4487 reference entry at distinct clock seconds. It PASSES
          iff every REG-1-compared field equals the archived reference, and
          otherwise it is a STOP.
        - CG-6: DV-11 is amended again, with a static list equal to CG-1 and a
          dynamic count per site.
        - CG-7: seven hashes and the repair block.
        - CG-8: the sequencing.
        - CG-9: the conditions carried from this decision's CN-2, CN-3 and
          CN-4 rulings.
        - Its readings LP-5, LP-1, LP-2, LP-3 and LP-4 are computed by the
          zero-run premise check TASK-20260924-159c1b.
        - The declared successor route if its readings or DV-17 fail is option
          CD: a further replacement of v2_solver.callgrind_instructions that
          re-measures on a log-visible indicator.
      why_a_premise_check_precedes_approval: >-
        The disposition rests on code facts that no archived check has
        computed:
        - the pass-through of callgrind_timeout by the wrapper;
        - the persistence of the callgrind logs;
        - the complete set of readers of instructions_callgrind;
        - the parse fields CG-3 uses;
        - the exact reference DV-17 compares against.
        This act read several of these facts itself (citations). A Coordinator
        reading of launch paths is precisely what failed twice
        (CORR-20260924-5b83a1, CORR-20260924-432f43). The check is cheap
        (Python, no solver) and its readings are fixed now.
    healthresolve_draft_status: >-
      It stays a draft forever: status draft, approved_by null, bytes
      unchanged. It never took effect, and no package ran under its labels.
      Its text has authority only as the successor incorporates it.

