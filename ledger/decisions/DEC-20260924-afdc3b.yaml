  rationale:
    - >-
      THE READINGS DID THEIR JOB. A census fixed before it ran found, at zero
      solver cost, a classified site that the draft expected to be
      unclassified. The alternative was to approve a remedy whose own
      completeness condition was false.
    - >-
      THE DEFINITION GOVERNS, NOT THE EXPECTATION. The draft defined
      CLASSIFIED broadly so that no site could hide behind a narrow sense of
      the word. Reading its parenthesis as an exemption would reintroduce the
      narrow sense after the census applied the broad one.
      CORR-20260924-432f43 records the presumption.
    - >-
      THE HEALTH-SITE REMEDY IS SOUND AND IS KEPT. CN-2 (i), (ii), (iii) and
      (vi) hold. The successor incorporates HR-1..HR-8 unchanged, and the
      health site is not re-litigated.
    - >-
      THE CALLGRIND SITE IS COVERED BY MEASUREMENT, NOT BY REDEFINITION OR
      EXCLUSION. The re-solve rule cannot see an SSF event at that site
      (output removed unread). Excluding its fields would weaken a reviewed
      comparison. DV-17 tests the exposure directly at the only inputs where
      it can stop the lineage, before a stage is spent on G1. CG-3 records
      any log-visible event.
    - >-
      THE BIAS IS TOWARD THE DECIDABLE QUESTION. Criterion C1's measured side
      and KN-OPEN-9b4a2b need the v2 ladder and the 31-bit rung. A
      protocol-coverage finding is not a reason to abandon them (AGENTS.md
      "Research-direction integrity"). The successor route is concrete: one
      zero-run check, then the approval act.
    - >-
      NO SECURITY READING. Toy EcGFp5-shaped arithmetic with known scalars;
      nothing transfers to p = 2^64 - 2^32 + 1.

