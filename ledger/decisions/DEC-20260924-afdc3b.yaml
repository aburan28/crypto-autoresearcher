        - HOST SCANS and PACKAGE QUERIES (v2_common.py lines 129-136) go to
          environment or envelope records only. dpkg-query does not execute
          msolve. NO ACTION.
        - The BUILDER (v2_driver.py line 101) is classified: it defines the
          solved systems. Its seeds are declared and deterministic, and its
          clock dependence is only through its timeout, whose expiry is an
          infrastructure outcome. REG-1 (a) compares its .ms products byte
          for byte. NO ACTION.
        - The SAGE COMPARATOR (line 650) is classified: it feeds the
          anchor-identity gate. Its seeds are declared
          (random.Random('TASK-20260923-58953e:K4a:%d' % p);
          set_random_seed(20260923 + p)). alarm(240) around E.order() (k4a
          lines 156-158) makes one gate input depend on wall time through a
          timeout. DISCLOSED. A failure attributable to it is an
          infrastructure outcome, never evidence, and a new decision rules on
          it (bea197 R-5 (3), extended; successor CG-9 (f)).
        - CALLGRIND_ANNOTATE (v2_solver.py line 533) is uncapped, with a
          600 s timeout and a PATH lookup. It feeds f4_core_function and
          f4_core_note, which REG-1 compares. It is PART OF THE CALLGRIND
          SITE'S DISPOSITION. The r3 DV-1 records its resolved path, and
          DV-17 exercises it (CG-5, CG-9 (f)).
        - VALGRIND (v2_solver.py line 517) is the callgrind site (R-CG).
        - GP CURVE_FACTS (a1_pari.py line 96) is classified by check (b). The
          script sets no random seed (census.md line 550). DISCLOSED. Nothing
          is assumed about gp's internal random state, and the r3 DV-1
          dynamic trace records the gp child (CG-9 (f)).
        - The GP VERSION PROBE (a1_pari.py line 121) and the wrapper's
          git / sh / version probes go to environment records and preflight
          refusals only. NO ACTION.
        - The DRIVER LAUNCH (r2_run_wrapper.py line 437; no timeout, LAUNCH
          RULE) and the CHECKER (r2_check_run.py line 254) are the command
          itself and the frozen checker verdict. NO ACTION.
      result: Every other child launch is ruled. None bars a successor, and each needed disclosure is carried into it.

