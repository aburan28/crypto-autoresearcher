    R-CG_the_callgrind_classification:
      question: >-
        Is the callgrind launch CLASSIFIED under the draft's own definition,
        given the REG-1-compared non-cost fields?
      ruling: >-
        YES, on two independent clauses of the definition "A launch is
        CLASSIFIED if its output or log enters v2_solver.classify_solve, any
        pass / fail check, a gate, an outcome class, or any recorded result
        field other than a cost measurement (wall, cpu or instruction
        counts)" (lines 462-465).
        (1) RECORDED NON-COST FIELDS. The launch's exit status and the profile
            derived from its callgrind output are recorded in
            res["instructions_callgrind"] as child.outcome, child.returncode,
            reason (on a non-ok child), f4_core_function and f4_core_note
            (v2_solver.py lines 519-547). v2_driver copies them into fixture
            and cell target rows (lines 358-360, 1174-1180). None is a wall,
            cpu or instruction count. method and label are constants, and
            child.rlimit_as_child_getrlimit is the cap read-back. They are
            recorded non-cost fields too, but they do not depend on the
            launch's output.
        (2) A PASS / FAIL CHECK AND A GATE. REG-1 (b) compares every G1
            fixture target entry with RUN-GFPN-ac4487 minus X1..X17
            (r2_reg1.py lines 256-262). X14-X17 exclude only
            child.wall_seconds, child.peak_vm_bytes, instructions_user and
            f4_core_inclusive_Ir (reg1-exclusion-list.json lines 35-42). A
            difference in any other callgrind field fails REG-1, and R-7
            refuses every package after G1 unless REG-1 passes
            (r2_run_wrapper.py lines 21-24, 221-225). fixture_core passes a
            callgrind_timeout on every fixture solve (v2_driver.py lines 313,
            358).
        Both readings were verified by this act in the code, not only in the
        census (citations). The census's own words agree (census.md lines
        320-336). The draft's expectation was a presumption carried from
        SE-2 (6)'s narrow sense of "never classified". CORR-20260924-432f43
        records it.
      seed_sensitivity_question: >-
        Could a seed-sensitive failure in the callgrind child, which re-runs
        msolve on the same input under the same clock seeding, change a
        REG-1-compared field?
      seed_sensitivity_ruling: >-
        NOT EXCLUDED BY ANY ARCHIVED ARTIFACT. The mechanism is narrow, and the
        consequence is a false REG-1 STOP, never a wrong recorded value.
        - The callgrind child runs the primary msolve argv, except the output
          path (v2_driver.py lines 165, 209), at a LATER clock second than the
          recorded attempt. Its FGLM therefore draws an independent seed
          (DEC-20260923-d670c6 CR-4: FGLM seeds rand() with time(0)). Ordinary
          seed variation changes output bytes (characterization.md lines
          136, 206-224).
        - An SSF event does not by itself change child.outcome,
          child.returncode or reason. classify_solve returns the child outcome
          unchanged for a non-ok child (v2_solver.py lines 490-491), so every
          SF-1 clause presupposes a child that exited ok. The callgrind
          child's msolve output is removed unread (v2_driver.py lines
          210-213), so no SSF classification can arise at this site.
        - It COULD change a compared field by three routes:
          (a) f4_core_function, if an FGLM-side change made a function whose
              name contains "f4" outrank ???:core_f4 in inclusive Ir. All 36
              archived reference values are ???:core_f4 [libneogb-0.6.5.so]
              (raw-result.json lines 747-7062, by search). The entry read in
              full has 746548497 of 821725387 Ir in core_f4 (lines 732-748).
          (b) a seed-dependent run length reaching callgrind_timeout (1800 s
              at m3) or the 10 GiB cap. That entry's callgrind wall time is
              3.815 s (line 736).
          (c) callgrind_annotate's 600 s timeout or error text (v2_solver.py
              lines 533, 545-547). That is clock or environment, not seed.
          The archived margins make (a) and (b) look unlikely at G1. That is
          an inference, not a measurement.
        - In cells the callgrind fields are recorded and no check reads them
          (census.md line 311; v2_scoring reads no instructions_callgrind key,
          by search). There a seed effect would alter only an auxiliary
          recorded field, never D, an outcome or a gate.
        The successor therefore pre-measures the compared fields at the exact
        REG-1 reference inputs across distinct clock seconds (DV-17), and
        records any log-visible SSF event at the site (CG-3). It keeps REG-1
        and the exclusion list unchanged. A callgrind-field REG-1 failure
        stops the lineage; it is never evidence.
