      scratchpad under the same guard, with the same read-only git children
      and no solver child (line 619). Their outputs are superseded development
      artifacts and not evidence. The readings rest only on the as-run script,
      which is archived (32b9ab59...fcbce76).
    D-3_read_order: >-
      ACCEPTED. The card ordered reading the draft, decision, corrections and
      card first. The first executable integrity comparison preceded any
      frozen source read, and the script repeated the full check before any
      reading (line 620-623).
    D-4_git_children: >-
