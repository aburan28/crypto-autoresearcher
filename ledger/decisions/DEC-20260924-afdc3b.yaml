    D-1_first_launch_never_started: >-
      ACCEPTED. The /usr/bin/time wrapper binary does not exist on the host.
      The first invocation exited 127 before the script started, and wrote
      nothing (census.md line 618). No child of any kind ran. Wall time comes
      from UTC stamps, and no memory reading exists. That is acceptable for a
      static census: memory was never at risk and nothing depends on it.
