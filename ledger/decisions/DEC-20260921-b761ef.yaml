coordinator_decision:
  id: DEC-20260921-b761ef
  recorded_at: '2026-09-21'
  goal_id: GOAL-ECDLP2M-001
  question_id: RQ-QSP-f9bbdb
  batch_ids:
    - BATCH-1faf6f
  kind: execution_admission
  mode: single_experiment

  context: >-
    GOAL-ECDLP2M-001's next_action (after DEC-20260920-2b276f and the
    TASK-20260920-ba16af / TASK-20260920-e869a1 snapshot at
    1b27d6d82a312aeb7947fcc3d5412b46b4261a7f) directs "Invoke /run
    EXP-QSP-70b731." The dispatching session attempted this and found an
    infrastructure gap: experiments/EXP-QSP-70b731/trial-plan.json (frozen,
    approved_by DEC-20260920-2b276f) has task_id: "TASK-20260920-ba16af"
    baked in, and that task is COMPLETED with kind
    implement_and_trial_plan / budget.maximum_runs: 0. Read directly,
    tools/experiment_execution.py's authorize() requires plan["task_id"] to
    resolve, via research_dispatch.py --claims refs against plan["queue"],
    to a dispatched task with role executor, state running, a LIVE claim,
    and a handoff execution binding {mode: experiments, kind: run,
    experiment_id: EXP-QSP-70b731, trial_plan: <the exact plan path>,
    trial_plan_sha256: <its sha256>, approved_by: DEC-20260920-2b276f}, with
    budget.maximum_runs not 0. TASK-20260920-ba16af satisfies none of this
    (wrong kind, zero-run, closed lane) and no existing claim can ever
    authorize execution against the current trial-plan.json. This mirrors
    the class of infrastructure gap DEC-20260914-8374d8 first resolved for
    EXP-FROB-d8aa37's own stage0 retries via a disjoint single-task queue and
    a fresh task_id/run_id pair, applied here to a FIRST execution rather
    than a retry of an interrupted one.

  decision: approve

  decision_scope: >-
    Approves opening a NEW disjoint execution-admission queue and a NEW
    additive-amendment trial plan (trial-plan-v2.json) scoped to exactly the
    six first_wave trials of EXP-QSP-70b731 (stage0-hand-gate through
    stage2-bandL-n6), under a fresh task_id (TASK-20260921-7e4592) and a
    dependent snapshot-archive task (TASK-20260921-d0b9d1). Does NOT itself
    authorize the underlying science beyond what DEC-20260920-2b276f already
    authorized (implementation + Stage measurement under the frozen
    contract's own terms; no attack, no DL recovery, no curve/group/point/key
    construction). Does NOT change H-QSP-cd0c90's status. Does NOT assert any
    Band-L agreement result -- no trial has been executed by this decision.
    Does NOT reopen or edit trial-plan.json (v1, still frozen at
    task_id TASK-20260920-ba16af) or BATCH-1faf6f's own completed
    dispatch_queue.json. Does NOT authorize Stage 2 n'=7..14, Stage 3 bridge,
    Stage 4 Band H, Stage COMPARE, or Stage 5 -- those remain gated behind
    their own successor trial-plan-vN.json / task_id / queue, dispatched
    after this wave's snapshot and independent review.

  target_ids:
    - EXP-QSP-70b731
    - H-QSP-cd0c90
    - TASK-20260920-ba16af
    - TASK-20260920-e869a1
    - TASK-20260921-7e4592
    - TASK-20260921-d0b9d1
    - BATCH-1faf6f
    - GOAL-ECDLP2M-001
    - RQ-QSP-f9bbdb
    - DEC-20260920-2b276f

  authorization: >-
    DEC-20260920-2b276f already approved EXP-QSP-70b731 under standing user
    authorization of 2026-09-06 for "implementation and Stage measurement as
    this contract defines." This decision does not re-approve the science; it
    approves the INFRASTRUCTURE (new task_id, new versioned trial plan, new
    disjoint queue) needed to actually invoke the execution that approval
    already covers, exactly as DEC-20260914-8374d8 did for EXP-FROB-d8aa37's
    first stage0 admission and its retry siblings.

  admission_defect_identified:
    tool: tools/experiment_execution.py, function authorize() (~lines 249-312)
    defect: >-
      plan["task_id"] must resolve through research_dispatch.py --claims refs
      against plan["queue"] to a role:executor, state:running task with a
      LIVE claim and an EXACT handoff.execution binding, with
      budget.maximum_runs != 0. The frozen trial-plan.json's task_id
      (TASK-20260920-ba16af) is COMPLETED, kind implement_and_trial_plan,
      budget.maximum_runs 0 -- it can never satisfy these checks. No existing
      claim, however constructed, can authorize execution against that
      trial-plan.json without editing a frozen record (forbidden).
    remedy: >-
      An additive-amendment trial plan (trial-plan-v2.json) binding a FRESH
      task_id and a FRESH disjoint queue, with a handoff whose budget is
      non-zero and whose execution block will (once the dispatching session
      fills the real trial_plan_sha256) satisfy authorize() exactly.

  new_infrastructure:
    trial_plan:
      path: experiments/EXP-QSP-70b731/trial-plan-v2.json
      relationship_to_v1: >-
        Additive amendment. trial-plan.json (v1) remains frozen, committed,
        and untouched at task_id TASK-20260920-ba16af. trial-plan-v2.json is
        a NEW frozen:true file, scoped to exactly the six first_wave trials,
        with byte-identical argv/check_argv/artifacts/memory_mb/watchdog/
        depends_on/run_id fields for those six; only task_id, queue, and the
        scope_note differ.
      status: drafted by the coordinator, then finalized and committed by the
        dispatching session. specification_sha256 and source_sha256 entries
        are copied unchanged from the committed v1 plan (same
        specification.yaml, same implementation/ files); the file's OWN
        sha256 (071ac06b3a2f34095e684129361e06ad4abca154fcfd90ca14bc1d34a344f40b)
        was computed by the dispatching session via `sha256sum` and filled
        into the handoff's execution.trial_plan_sha256.
    queue:
      path: coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-1faf6f/execute-first-wave-TASK-20260921-7e4592/dispatch_queue.json
      relationship_to_batch_queue: >-
        Disjoint from, and does not edit or reopen,
        coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-1faf6f/dispatch_queue.json
        (TASK-20260920-ba16af there stays completed, untouched). Same
        disjoint-single-task-chain pattern DEC-20260914-8374d8 and its
        EXP-FROB-d8aa37 retry-queue siblings established.
      tasks:
        - id: TASK-20260921-7e4592
          role: executor
          purpose: execute the six first_wave trials via
            tools/experiment_execution.py run --plan trial-plan-v2.json
          budget.maximum_runs: 6
        - id: TASK-20260921-d0b9d1
          role: coordinator
          purpose: content_at_commit snapshot archive of the six run
            directories, depends_on TASK-20260921-7e4592, bound as
            archived_by on the run task
    handoffs:
      - ledger/handoffs/TASK-20260921-7e4592.yaml
      - ledger/handoffs/TASK-20260921-d0b9d1.yaml

  review_scoping_decision: >-
    TASK-20260921-7e4592 sets review_required: false. This is a deliberate
    Coordinator scoping choice, not a claim that this data is non-claim-
    bearing: it defers composition of a scientific conclusion, not review
    itself. AGENTS.md's dynamic-dispatch rule that a claim-relevant producer
    "must set review_required: true and have a dependent Reviewer, Validator,
    or Red Team task" binds the decision that would CHANGE H-QSP-cd0c90's
    status -- that decision does not exist yet, is explicitly out of scope
    for this admission decision, and is REQUIRED as the next ranked task
    after the snapshot archive. This mirrors TASK-20260920-ba16af's own
    review_required: false (there because zero-run; here because the
    downstream claim-changing decision is deliberately not yet being made)
    and matches EXP-QSP-70b731's own success_criterion text, which already
    anticipates a headline "PENDING INDEPENDENT REVIEW" rather than settled
    at execution time.

  rationale:
    - >-
      GOAL-ECDLP2M-001's committed next_action directs /run EXP-QSP-70b731;
      the only blocker is an infrastructure defect in how the frozen
      trial-plan.json's task_id binds to authorize(), not any defect in the
      approved science or the implementation TASK-20260920-ba16af produced.
    - >-
      The remedy follows an established, already-reviewed-in-practice
      pattern in this repository (EXP-FROB-d8aa37's disjoint single-task
      admission/retry queues under DEC-20260914-8374d8 and its DEC-20260921-*
      siblings): a fresh task_id, a fresh disjoint queue, and an additive
      (never edited) versioned trial plan.
    - >-
      Scoping to first_wave (Stage 0 hand-gate through Stage 2 Band L n'=6)
      keeps this admission's claim surface small and its artifact_paths
      exact and enumerable, and lets a follow-up wave repeat the same pattern
      after this one's own snapshot and review, rather than committing this
      admission to authorizing all twenty declared trials -- including
      hours-class Band H cells -- in one uninterruptible adapter invocation
      (tools/experiment_execution.py's run_plan() executes every trial in
      plan["trials"] whose dependencies are satisfied, in one call, so the
      trial COUNT in the plan file is the real scope boundary, not merely a
      budget number).
    - >-
      No existing claim, execution, or hypothesis-status fact changes by this
      decision alone; it only makes the six first_wave trials DISPATCHABLE
      once the dispatching session completes the items listed under
      `blocking_preconditions_for_dispatching_session` below.

  blocking_preconditions_for_dispatching_session: >-
    This decision authorizes admission infrastructure whose bytes were
    drafted by a coordinator session with NO shell, git, or hashing tool
    access. Before TASK-20260921-7e4592 or TASK-20260921-d0b9d1 may be
    claimed or dispatched, the session that does have those tools must:
    (1) verify TASK-20260921-7e4592, TASK-20260921-d0b9d1, and this
    decision's own id DEC-20260921-b761ef with `python3 tools/allocate_id.py
    --check <id>` each, renaming every cross-reference on collision before
    any commit; (2) compute the real sha256 of the final committed
    experiments/EXP-QSP-70b731/trial-plan-v2.json and replace
    PENDING_SHA256_COMPUTATION_BY_DISPATCHING_SESSION with it in BOTH
    ledger/handoffs/TASK-20260921-7e4592.yaml's execution.trial_plan_sha256
    and the inline copy inside the new dispatch_queue.json, keeping them
    identical; (3) fill TASK-20260921-d0b9d1's archive.commit_sha /
    parent_sha / path_sha256 from real git output once the run+snapshot
    actually happens (not before); (4) run `python3 tools/validate_ledger.py`
    and a dry `python3 tools/research_dispatch.py <new queue path>
    --repo-root . --claims refs --now <ISO8601>` against the merged tree
    before dispatch, and resolve any reported defect rather than proceeding
    past it; (5) commit, push, and open a PR against main naming
    DEC-20260921-b761ef, TASK-20260921-7e4592, TASK-20260921-d0b9d1,
    trial-plan-v2.json, and the new queue file, per AGENTS.md "Branch and PR
    discipline" -- none of these records are durable evidence until then.
    Steps (1)-(2) are hard correctness preconditions: authorize() fails
    closed on either being wrong (it blocks launch, never causes an
    unauthorized one), so failing to complete them is safe but non-functional,
    never unsafe.

  evidence_refs:
    - ledger/decisions/DEC-20260920-2b276f.yaml
    - experiments/EXP-QSP-70b731/specification.yaml
    - experiments/EXP-QSP-70b731/trial-plan.json
    - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-1faf6f/dispatch_queue.json
    - tools/experiment_execution.py
    - coordination/frobenius/BATCH-2f8435/admission/run-binding-stage0-v10-retry-20260921.json
    - coordination/frobenius/BATCH-2f8435/stage0-v10-retry-TASK-20260921-5286e8/dispatch_queue.json
    - ledger/decisions/DEC-20260914-8374d8.yaml

