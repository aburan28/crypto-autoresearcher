coordinator_decision:
  id: DEC-20260803-52a750
  goal_id: GOAL-MLKEM-003
  batch_id: BATCH-013
  evidence_id: EV-MLKEM-0cf1df
  recorded_by_task: TASK-20260803-cd1b85
  archive_kind: ledger
  recorded_at: '2026-08-03'
  decision: refine
  decision_label: positive_finding_survives_narrowed_whole_band_statistic_retired

  context: >-
    BATCH-013 existed to close a scrutiny asymmetry: four adverse batches each
    received a red team, while BATCH-012, which corrected three of them, received
    a validator only. TASK-20260803-b214b1 returned pass_with_constraints after
    writing three implementations from scratch.

  central_adjudication: >-
    THE FINDING SURVIVES AND THE HEADLINE DOES NOT, AND THE SEPARATION IS CLEAN.
    At matched parameter count the exact region measure fits about twice as well
    as the surrogate, and 98.6 and 90.8 percent of that improvement lands on
    rows where the counting floor is negligible -- so it is not a tail artifact
    and rests on no floor protocol. That is a real result and it is now backed by
    five independent implementations. But "fits the whole band at 1.06-1.13x the
    counting-noise floor" is uninterpretable: that statistic carries fewer than
    two effective degrees of freedom, so a perfect model's ratio has a sampling
    sd of about 57 percent, and it attenuates the measurable misfit 1147-fold to
    the point where a model perfect on every measurable row would read 0.769x.
    The program has been quoting three significant figures on a quantity whose
    one sigma is about half its value. `refine`: keep the comparison, retire the
    statistic.

  what_survives:
    - >-
      The exact region measure fits strictly better than the Gaussian-Phi
      surrogate at MATCHED parameter count -- 0.3556 against 0.7055 (n=43) and
      0.3172 against 0.6969 (n=50), factors of 1.98x and 2.20x -- with 98.6 and
      90.8 percent of the improvement on C >= 1000 rows where the floor is
      negligible. On those rows the misfit falls 64.7x to 23.9x and REMAINS
      UNCLOSED.

  what_is_struck:
    - >-
      "Fits the whole band at 1.06-1.13x the counting-noise floor", and every
      variant: "at the floor", "CLOSED", and ANOM-4's "below its floor". ANOM-4
      was never an anomaly; the statistic cannot resolve it.
    - >-
      The unqualified "the misfit was the surrogate's, not Approximation 4.9's",
      and the phrase "corrects three batches". Both survive only in the
      matched-parameter, measurable-rows form.
    - >-
      D-2's n=50 leg, now measured rather than expected: 139.1x at p = 16 against
      the grid edge's 217.8x.

  weighing_of_the_red_team: >-
    Accepted in full, and it did the job the batch was created for.
    (1) O-1 IS THE OBJECTION THAT MATTERS AND IT INDICTS A NUMBER I ARCHIVED. I
    recorded 1.06-1.13x as a corrected, careful figure one batch ago. The red team
    computed the effective degrees of freedom from the validator's own covariance
    and found 1.55 and 1.51. The Coordinator confirmed 1/sqrt(2*dof) = 0.57. The
    entire D-1 debate, which I treated as a substantive correction, is a wording
    correction on an uninterpretable statistic.
    (2) O-2 IS THE CLEANEST PIECE OF WORK IN THIS GOAL SO FAR: an exact identity
    showing 1147-fold attenuation, plus a controlled null in which the surrogate
    the C >= 1000 statistic rejects at 64.7x is indistinguishable from the exact
    model on low-count rows. That is the inventor protocol's null-object
    obligation met properly rather than gestured at.
    (3) S-6 IS RECORDED PROMINENTLY BECAUSE IT REFUTES MY OWN SUGGESTED ATTACK.
    I proposed in the handoff that a single fitted scale might rescue almost any
    monotone shape. It cannot: null one-parameter monotone families score 4.86x
    to 56.9x. Four further attacks failed and are recorded so no successor
    re-runs them. A red team that reports its failed attacks is more useful than
    one that reports only its successes.
    (4) O-9 AND THE M3 s-CURVE RESULT BOTH CUT IN THE PACKAGE'S FAVOUR and were
    reported anyway: the beta_sieve premise is dischargeable from page26, which
    killed the red team's sharpest planned attack, and s = 0.94 gives 18.82x
    against the published 20.12x.
    (5) O-7 IS AN UNCOMFORTABLE AND CORRECT OBSERVATION: EV-MLKEM-2e668d had
    already struck the whole-band argument and corrected the attribution one batch
    earlier, so part of what I archived in BATCH-012 as new correction was
    re-litigation.
    (6) O-4 / S-11 IS REPORTED AS INCONCLUSIVE, NOT AS EVIDENCE. Two attempts at
    a deep-tail dispersion test disagree in opposite directions and the red team
    declined to lean on either.

  hypothesis_status_changes: []
  hypothesis_status_note: >-
    No hypothesis moves. A better-fitting model with an unclosed 23.9x misfit on
    the measurable rows, on two toy curves under a fitted normalisation, carries
    no transition in either direction.

  rule_12_status: >-
    UNMET AND UNWAIVED. Nothing here changes EV-MLKEM-011, EV-MLKEM-013 or
    EV-MLKEM-017; KN-FIND-031 stays withdrawn.

  binding_instruction_for_this_goal: >-
    STOP QUOTING WHOLE-BAND RATIOS. Every future record in GOAL-MLKEM-003 reports
    the C >= 1000 comparison, or states its effective degrees of freedom beside
    any whole-band number it insists on quoting. A statistic that scores a
    perfect model at 0.769x and carries 1.5 effective degrees of freedom is not a
    measurement, and this program has now built two batches of conclusions on it.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      `refine` on `preliminary` evidence fails the gate. The transferable
      candidate is now sharper than it was one batch ago -- a goodness-of-fit
      statistic dominated by rows at the counting floor can attenuate real misfit
      by three orders of magnitude while reading near 1, and the diagnostic is its
      effective degrees of freedom under the correct residual covariance -- but it
      rests on a single adversarial pass with no independent validation of the
      dof computation or the attenuation identity, and S-11 leaves an open
      control. Promoting a methodological rule about premature belief on one
      unreplicated pass would be the error the rule itself describes.
    promote: false

  non_claims:
    - ML-KEM is not broken.
    - KN-OPEN-016 remains open.
    - >-
      Approximation 4.9 is NOT validated. A better-fitting model with a 23.9x
      unclosed misfit on the measurable rows is not a validated one.
    - No asymptotic claim advanced. No closure quorum asserted.

  next_actions:
    - >-
      BATCH-014, zero new sampling: run the red team's named control C1 -- a
      properly constructed deep-tail Poisson dispersion test with a local smooth
      rate, leverage correction, windows binned to expected count >= 10, and phi
      reported with its own standard deviation. S-11 records two attempts that
      disagree in opposite directions, and this decides whether ANY absolute
      reading in the deep tail, favourable or adverse, is interpretable. Pair it
      with an independent validation of O-1's dof computation and O-2's
      attenuation identity, since the decision to retire the whole-band statistic
      now rests on both and neither has been checked by a second party.

