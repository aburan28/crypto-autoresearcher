  rationale:
    - >-
      THE FIVE RUN DIRECTORIES BELONG IN staged_not_in_binding_set, AND THE REASON
      IS THE ARCHIVE SUBSET RULE READ FROM BOTH SIDES. tools/research_dispatch.py
      requires an archive's path_sha256 to be a subset of the archiving task's own
      artifact_paths union its source tasks'; the 35 run files are in neither set, so
      binding them directly would break the rule that DEC-20260824-af6d5c G7 found
      could not be satisfied retroactively. AND THEY WERE KEPT OUT ON PURPOSE AT
      OPENING: a COMPLETED archive must cover every declared source artifact, so
      declaring the files of a GATED run would make the snapshot unable to complete
      whenever that run CORRECTLY does not execute -- trading a real failure mode for
      a fake one. The binding set is therefore the 16 opening artifacts, the 8
      producer artifacts and this receipt: 25 paths.
    - >-
      SUPERSEDING `rationale` ITEM 2 OF THE PRE-MINT BODY, WHICH READ THAT THE BR-7
      MECHANISM CLOSED G7 "STRUCTURALLY" AND THAT THE DIGEST HALF WAS "NOT VERIFIED BY
      ANYONE". THAT IS NO LONGER TRUE AND THE CORRECTION IS THE POINT.
      G7 IS NOW DISCHARGED IN BOTH HALVES, AND EACH HALF IS ATTRIBUTED TO THE SESSION
      THAT DID IT. THE STRUCTURAL HALF, verified BY READING by this Coordinator:
      run-index.json IS in the binding set and carries a sha256 entry for every file of
      every executed run -- 35 keys against exactly the 35 files present across the five
      run directories, no surplus, no shortfall, no run directory unindexed. THE DIGEST
      HALF, MEASURED BY THE DRIVING SESSION, which has a shell: all 35 recomputed from
      the tree at 35 match / 0 mismatch / 0 missing. The runs are therefore content-bound
      by an artifact that is itself bound by path_sha256, which is exactly what the
      mechanism was designed at opening to achieve.
      THE INTERVAL IN WHICH THE GAP WAS REAL IS RECORDED RATHER THAN ERASED. Between
      this receipt's first draft and the driving session's measurement, the run
      directories were bound by a POINTER WHOSE TARGETS WERE UNCHECKED, and the receipt
      said so and named it OWED rather than reporting the mechanism as closed on the
      strength of a key count. That restraint was the right call: G7 existed in round 1
      precisely because a binding that looked complete on paper was not complete in the
      tree, and claiming closure from a key count would have repeated that error in a
      new place.
    - >-
      THE ROUND'S BLIND RE-DERIVATION IS DECLARED UNSATISFIABLE AND REPLACED, RATHER
      THAN DECLARED AND SILENTLY BROKEN. tools/check_review_independence.py's leak
      test is ORDER-BLIND: it flags any blind_from prefix appearing anywhere in the
      re-deriver's sources_read. Every path that could carry the producer's value for
      any candidate quantity is a path the Validator MUST read to discharge its seven
      joints. A declared re-derivation would therefore produce either a guaranteed
      checker FAIL on a reviewer who did nothing wrong, or an incomplete sources_read
      -- a dishonest attestation, which is far worse than no re-derivation. BR-5's own
      consequence clause licenses required:false explicitly. WHAT REPLACES IT KEEPS
      THE WHOLE SUBSTANCE -- derive first, then read, then compare -- and drops only
      the mechanical checkability, WHICH IS THE PART THAT DID NOT WORK IN ROUND 1
      ANYWAY: that round's leak detector could not fire at all, because every
      blind_from entry it carried was a glob or a prose phrase that no real path can
      match, and the only thing that caught contamination was the re-deriver's own
      honest boolean. This round asks for that boolean directly and says what it rests
      on.
    - >-
      THE PRIOR IS SPLIT AND THE RESIDUAL IS DISCLOSED RATHER THAN CLAIMED AWAY. The
      item-by-item P-1..P-5 and a round-2 addendum written after the package existed
      are sealed at a path outside both reviewers' declared read_scope and named as a
      literal blind_from prefix. But P-1..P-5 are ALREADY COMMITTED inside batch.yaml,
      which IS in both read scopes, and this program supersedes rather than
      overwrites, so they cannot be removed. THE SEAL IS THEREFORE PARTIAL. Claiming
      otherwise would be the manufacture of an independence property this round does
      not have, which is the failure the checker exists to prevent. The close must
      discount reviewer concurrence with the prior's mechanism accordingly, and batch
      3's opening should reference the prior by path instead of embedding it.
    - >-
      THIRTEEN JOINTS, EACH OWNED EXACTLY ONCE, AND THE ONE ADDED JOINT IS THE ONE
      THAT COULD MAKE THE HEADLINE EMPTY WITHOUT ANY INTEGER IN IT BEING WRONG. J13
      asks whether "the strengthened suite detects the deletion of the component
      family (d) perturbs" is a power result or a restatement of the construction. A
      control that detects exactly the component it perturbs may measure nothing
      beyond its own construction. THAT IS THIS BATCH'S O5 SHAPE, ONE LEVEL UP, and
      the Coordinator who designed family (d) and approved the contract is the reader
      least able to decide it -- which is precisely why it goes to the adversary and
      not to the plan's author. It is separated from J8 so that it cannot be absorbed
      into a proves-too-much verdict and disappear.
    - >-
      NO BUDGET IS RAISED FOR THE ADDED JOINT AND THE COST IS STATED IN ADVANCE. The
      Red Team's 600 s stands and the batch's declared 3480 s stands; a Coordinator
      does not self-grant a ceiling. J13 shares its evidentiary base with J8, which is
      why it was added rather than traded. DEC-20260824-af6d5c PD-4 is recorded
      against this role for asking a review for more than its budget bought and
      writing a priority order instead of raising it, so the disclosure is made in the
      assignment document itself rather than discovered in the reports. If J13 is not
      reached, the close records it as an UNMEASURED JOINT and never as an admission.
    - >-
      THE PROVES-TOO-MUCH OBJECT LIST GAINS ONE CANDIDATE THE OPENING DID NOT HAVE,
      AND IT IS STILL A FLOOR. An adjudicator that reads the message difference on one
      primitive and is blind to it on the other would be blind to the primary datum of
      a differential characteristic on half the census while remaining fully sighted on
      the other half. Whether that candidate is live is a question about the package
      the Red Team must answer for itself. THE LIST REMAINS A FLOOR AND NOT A CEILING,
      AND IF THE RED TEAM RETURNS ONLY OBJECTS THE PLAN SUPPLIED, THE CLOSE RECORDS
      THE PASS AS BOUNDED BY THE PLAN'S IMAGINATION rather than treating the list's
      exhaustion as coverage. O5 was added by a reviewer, was not on round 1's list,
      and became constructible only after reading the committed source.
    - >-
      THE ARCHIVE DISCLOSES A PRODUCER INTERPRETATION IT DOES NOT ADJUDICATE, AND
      HANDS IT TO THE REVIEW. CTL-FROZEN's criterion set is defined by the contract as
      every file under harness/diffpath/ plus two named files; the package excludes the
      contract's own single new module from that set and reports its digest separately,
      on a stated ground, and it is not among the four deviations the producer
      declared. An archive that noticed this and said nothing would be hiding it; an
      archive that ruled on it would be reviewing. It is disclosed in the receipt and
      assigned as part of J7, with the reading that favours the producer recorded
      alongside for symmetry.
    - >-
      NOTHING HERE CLAIMS ANY PATH IS NEW, CLAIMS ANY CRYPTANALYTIC IMPROVEMENT,
      ACQUIRES ANY SOURCE, RUNS ANY SEARCH OR REPAIRS THE INSTRUMENT. A PASSING
      CONTROL IS NOT AN IMPROVEMENT. The MD5 lane is BLOCKED, NOT CLOSED, with
      AMD-20260824-DIFFP-ACQ-1 in force and Tier B's named unblocking route intact.

  limitations:
    - >-
      THIS DECISION'S AUTHOR HAS NO SHELL. It ran no command, computed no hash,
      executed no code, minted no identifier and made no commit. Neither
      tools/validate_ledger.py nor tools/research_dispatch.py nor any git command was
      run by it, and no output of theirs is recorded anywhere as if it were. Every
      scalar it binds is either a structural fact established by reading, a value
      measured by the driving session and attributed to it, or a value quoted from a
      committed producer artifact and marked unverified. THAT REMAINS TRUE OF THE
      MEASUREMENTS NOW RECORDED AS PASSING: they are the driving session's, and this
      record does not restate them as its own.
    - >-
      SUPERSEDING `limitations` ITEM 2 OF THE PRE-MINT BODY, WHICH READ THAT THE
      SNAPSHOT ARCHIVE WAS INCOMPLETE -- 25 null digests, no merge base, no
      research_dispatch run, a summary rather than a transcript from validate_ledger,
      and the digest recomputations OWED. ALL OF THAT WAS DISCHARGED BEFORE FILING and
      the honest limitation is now narrower and different.
      WHAT PASSED, ALL MEASURED BY THE DRIVING SESSION: origin/main e45861af5395dd6bf7fada25dc518f00c2343554
      with an identical merge-base and `git merge origin/main` returning "Already up to
      date." with no conflict, so no superseding record was required and NOTHING WAS
      REBASED; validate_ledger.py exit 0 with "OK: validated 7158 records, no new
      violations"; research_dispatch.py exit 0 with an EMPTY transcript, recorded as an
      empty string rather than as null because the tool is silent on success and the
      distinction between "ran and said nothing" and "was never run" is the whole point
      of recording it; CTL-FROZEN at 13/13 against the pre-run set AND 13/13 against the
      post-run set, verified separately against the tree rather than through the
      producer's own comparison field; the 35 run files at 35/35; and 24 of 24 binding
      digests measured, 0 missing.
      WHAT IS STILL LIMITED, AND IT IS REAL. (a) The commit does not exist yet: this
      record is filed alongside an archive whose commit_sha and parent_sha are still
      null, and a record that exists only in a local commit is UNPUBLISHED, so neither
      reviewer may be dispatched until the commit exists, is verified AND IS PUSHED.
      (b) The 24 digests were measured at head 92afffb03ed0442a0457ae8842b6650c57357109,
      not at the head that will parent the snapshot commit; content_first binding makes
      that harmless in principle, but the digests are stale if any bound path moved
      since, and confirming they did not is a live obligation on the driving session.
      (c) The 25th path is this archive's own receipt, which cannot bind itself; it
      carries a non-hex sentinel in the receipt and its true digest is measured last
      into the sidecar, so the archive binds 24 by digest and 25 by declaration, and
      those two counts are reported separately and never summed.
    - >-
      SUPERSEDING `limitations` ITEM 3 OF THE PRE-MINT BODY, WHICH NAMED THE AN-1
      MODULE DIGEST AS THE SINGLE HIGHEST-RISK UNVERIFIED ITEM. IT IS NO LONGER
      UNVERIFIED AND IT PASSED.
      The producer disclosed (AN-1) that a concurrent session committed its files while
      it ran and that an earlier commit's copy of the contract's single new module was
      one line behind the executed source. THE DRIVING SESSION MEASURED
      sha256(harness/diffpath/controlpower.py) ON THE MERGED TREE AS
      953398c4bc92fc1075817987976e9c9582c2756f13eff3f68a357d87355646b7, identical to the
      source pinned in all five run manifests, AND RE-MEASURED IT AFTER THE MERGE rather
      than carrying an earlier value forward. THE SNAPSHOT THEREFORE BINDS THE EXACT
      BYTES THE FIVE RUNS EXECUTED, and a reviewer's cold re-run is against the same
      object the producer measured.
      THE RISK IS RECORDED AS HAVING BEEN REAL. Had it failed, it would have been
      INFRASTRUCTURE SIGNAL and a STOP -- never a mathematical finding and never
      something to archive over -- and every measurement in the package would have been
      uninterpretable through no fault of the producer. It is named here because an
      archive that reports only the passing outcome teaches nothing about why the gate
      existed.
    - >-
      THE ROUND HAS NO MECHANICALLY CHECKABLE INDEPENDENCE PROPERTY beyond the
      declared read_scope boundaries and the sibling-report leak test. The ordered
      cold derivation rests on each reviewer's honesty about read order, which no tool
      in this repository can verify.
    - >-
      COMPLETION CRITERION 4 IS REACHABLE BY THIS SHAPE AND IS NOT MET BY IT. It
      requires that BOTH independent sessions ADMIT the package -- the close's
      determination on the reports it actually receives, never read off the presence
      of two task ids in a queue. A `breaks` on a joint a reviewer owns is not an
      admission on that joint.
    - >-
      CLAIM CEILING `analyzed`, NEVER `supported`. Three of CLAUDE.md's four
      supported-promotion gates are structurally unmet by a batch of this kind and the
      fourth is not attempted. Two reviewers do not raise a ceiling set by that.
    - >-
      TWO OF THIS ROUND'S OWN DOCUMENTS SHIPPED UNPARSEABLE AND A MECHANICAL SWEEP
      FOUND THREE MORE HAZARDS THE PARSE ERRORS HAD MASKED -- including TWO SILENT
      `: ` CORRUPTIONS inside `deliverable.must_contain` list items that parse
      successfully and turn a required-deliverable string into a single-key mapping
      with no error at all. All five were quoting-only defects, all were fixed before
      either reviewer was dispatched, and no wording moved. THE REASON THEY SHIPPED IS
      NOT CARELESSNESS A RULE CAN FIX: nothing in CI parse-gates `coordination/**`.
      check_merge_hygiene.py gates `ledger/**.yaml` and `experiments/*/specification.yaml`
      and checks `.json` only under `coordination/`, so every review plan, assignment,
      execution report and reviewer report in this program is unparse-gated; the
      driving session measured 33 of 2128 coordination YAML files repo-wide currently
      unparseable, including a red-team report and GOAL-MD5-001's BCP-2.yaml. That
      measurement is the driving session's and is not restated here as this
      Coordinator's. THIS IS THE SECOND CONSECUTIVE COORDINATOR ROUND TO SHIP
      UNPARSEABLE YAML AND THE ONLY THING THAT CAUGHT IT EITHER TIME WAS A HUMAN-SCALE
      HABIT -- the driving session parsing every file before committing it. Recorded
      in full in the snapshot receipt under
      `harness_finding_coordination_yaml_is_not_parse_gated` and as PDV-8 in the
      review plan. It is an INFRASTRUCTURE FINDING and is not evidence about anything
      mathematical.
    - >-
      THE REVIEW-PLAN DOCUMENTS ARE NOT artifact_paths OF ANY TASK IN THIS BATCH'S
      QUEUE and therefore cannot be bound by path_sha256 by either archive. That is
      the G7 shape recurring for review-plan artifacts, and THIS FILED DECISION IS
      ITSELF IN THE SAME POSITION: ledger/decisions/DEC-20260824-e238c1.yaml did not
      exist when the queue was authored and is not a declared artifact_path either.
      This round handles all of them with an isolated subject-line-only commit and a
      disclosure at the ledger archive; batch 3 must declare the plan's paths at
      opening, because retrofitting is structurally impossible.
    - >-
      A WRITE_SCOPE EXTENSION IS DISCLOSED RATHER THAN ABSORBED. TASK-20260824-7175d9's
      declared write_scope is its archive directory only, and this record is under
      ledger/decisions/. The extension follows from this engagement carrying the
      review-plan handoff as well as the archive, and from the binding obligation that
      every Coordinator decision be persisted as a coordinator_decision record in
      ledger/decisions/. Leaving a decision unfiled to respect a scope written before
      the second half of the engagement existed would breach the stronger rule. The
      queue's own precedent is TASK-20260824-b7efbf, which carried `ledger/decisions`
      in write_scope for its opening pass.

