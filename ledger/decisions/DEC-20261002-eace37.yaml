coordinator_decision:
  id: DEC-20261002-eace37
  context: >-
    Design tick. IDEA-20260926-89886c is the first open ECC idea and is not
    designed. IDEA-20260915-3476de is next and is not designed.
    IDEA-20260923-c2a85f is the following open idea, and only the cover
    counts and the band products are frozen.
