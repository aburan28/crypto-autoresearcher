  # --------------------------------------------------------------------------
  # ADVERSARIAL READING OF THE DRAFT (the eight questions of the act card)
  # --------------------------------------------------------------------------
  adversarial_review:
    Q1_PA_values_and_read_back:
      finding: >-
        JUSTIFIED, WITH TWO TESTABILITY GAPS (RC-2).
        - Envelope: parisizemax 536870912 is half of driver_rss_limit_bytes
          1073741824 (trial-plan-v2.json line 85). PARI's stack beyond
          parisize is reserved address space and becomes resident only when
          touched, so the worst resident case is 512 MiB of stack plus the
          driver's recorded 70-75 MB (draft lines 264-270). The v2 code's own
          pre-launch check (v2_solver.py lines 149-159, DRIVER_RSS_LIMIT line
          45) still refuses a child launch above 1 GiB, so an exceedance is
          recorded as refused_to_start, never silently absorbed. DV-2's VmHWM
          bound of 805306368 B leaves 256 MiB of margin. Child launches fork
          the driver and then exec; the reserved range does not survive exec,
          so the 10 GiB child cap is unaffected.
        - Read-back: v2_common.py line 253 constructs a FRESH cypari2.Pari()
          on every call. Whether that constructor re-applies a default stack
          size is a property of the installed cypari2, which this act cannot
          check. The draft's read-back through a fresh handle (lines 288-297)
          is exactly the right test, and trigger (iii) (lines 305-307) routes
          a failure to P-B. Two gaps: (a) the read-back is taken once; the v2
          code may construct a second handle later in the same process, so
          idempotence of construction is not shown; (b) the exit read-back is
          required to EQUAL the configured parisize, but whether PARI's
          `default(parisize)` reports the requested size or the current,
          grown size after a large computation is not pinned. If it reports
          the grown size, DV-2 would fail on a non-trigger condition and stop
          R1 spuriously (PS-9), or the checker would fail a valid package.
          Both are fixed by RC-2, decided in R1 before any run.
    Q2_PB_trigger_outcome_independence:
      finding: >-
        HOLDS. The trigger (lines 299-313) reads only DV-2: group-order
        computations of the fixture curves (parameters), read-backs and
        VmHWM, reproduced once in a fresh process. It is decided in R1 and
        written into the plans before phase A (finality, lines 348-351). "No
        ladder, cell or fixture system solve bears on the trigger." The only
        value compared is N at (4111, n = 3) = 69477519282, a parameter
        already recorded by RUN-GFPN-ac4487, not an outcome of any
        measurement. A fault in the layer's own code does not trigger P-B.
        RC-5 strengthens DV-2's correctness check without touching the
        trigger.
    Q3_redirection_behaviour_neutrality:
      finding: >-
        DEFECT FOUND, CARRIED AS CONDITION RC-3. "Redirect only the listed
        module constants" (lines 377-391) is not sufficient as listed, for
        three reasons read from the frozen code:
        (1) a1_common.redirect_v2 binds its default
            `task_id=TASK_ID_RUNS` at DEFINITION time (a1_common.py line 90),
            and a1_driver.py line 30 and a1_check_run.py line 30 call it at
            IMPORT time. Redirecting a1_common.TASK_ID_RUNS therefore does not
            reach v2_common.TASK_ID in an addendum process: it is set to
            TASK-20260923-6c7f55 whenever a1_driver is imported, contrary to
            the draft's own rule that 6c7f55 never appear on a repaired
            artifact (lines 216-217).
        (2) In an addendum process v2_common.PLAN_PATH must be the a1-r1
            plan, because v2_driver.cmd_build / cmd_cells read their package
            through it (a1_driver.py lines 6-9). The draft's list maps
            v2_common.PLAN_PATH to trial-plan-v2-r1.json without saying that
            this is the v2 entry's value only; applied in the a1 entry it
            would break the a1 drivers.
        (3) Importing a1_check_run in a process redirects v2_common.PLAN_PATH
            globally (line 30), so a single-process r1 checker that runs
            v2_check_run on v2 packages and a1_check_run on addendum packages
            would check v2 packages against the a1-r1 plan
            (v2_check_run.py lines 41-45).
        The draft's catch-all (lines 387-391: any other redirection that
        re-points a task id, plan or receipt is permitted if listed with old
        and new values) already permits the fix, and PS-5's checker (lines
        617-618) and DV-7 would likely catch (1). The defect is therefore
        one of explicitness and ordering, not of design: a condition, not a
        revision. With RC-3 the drivers' behaviour is unchanged except for
        module constants that name plans, receipts, run ids, task ids and
        protocol labels, and the PARI stack ceiling.
    Q4_REG1_definition:
      finding: >-
        WELL DEFINED, WITH ONE STRENGTHENING (RC-6) AND ONE DURABILITY NOTE
        (RC-7). The exclusion list is declared in R1 by reading
        RUN-GFPN-ac4487's archived bytes and the v2 code, before any repaired
        run, is bound by phase A through implementation-v2-r1.md, and its
        sha256 is recorded in every later manifest (lines 507-517). It may
        never exclude k, x_R, relation, beta, lam, u_values, relation_mod_T,
        D, solutions, verified or lifted_points, and the reference bytes are
        verified against the TASK-20260923-0fa03f post-run receipt first.
        Fixture streams are keyed by fixed labels (v2_common.py lines 4-14;
        v2_driver.py lines 309 and 316), and the fixture build does not use
        the /tmp cache (v2_driver.py line 118; to_cache is set only in the
        ladder build, line 962). The residual risk is hidden process-level
        non-determinism (for example string-hash iteration order), which
        would make REG-1 fail for a reason unrelated to the repair. The
        draft names that reading honestly (lines 530-532); RC-6 exposes it in
        R1 at toy scale, before any spend.
    Q5_plan_derivation_and_inverse_map:
      finding: >-
        TESTABLE ONLY ONCE THE KEY SET AND ORDER OF OPERATIONS ARE FIXED
        (RC-4). For trial-plan-v2-r1.json the declared metadata keys are
        listed (lines 413-419). For trial-plan-v2-a1-r1.json they are not
        (lines 425-438 say "derived the same way"), and that plan already
        carries a `v2_ids_never_reused` list of the 31 v2 ids
        (trial-plan-v2-a1.json lines 81-113): a literal "replace every old v2
        id by its image" would rewrite it into the 31 r1 ids and lose the
        retired set unless another key carries it. The equality is
        mechanically checkable once the Executor declares the exact key paths
        per plan before writing either plan, and the union map is applied as
        a whole-token bijection.
    Q6_ids_and_ceiling:
      finding: >-
        HOLDS. 31 (27 planned + 4 contingency; trial-plan-v2.json lines 15-17)
        plus 11 (9 planned + 2 contingency; trial-plan-v2-a1.json lines 26-27)
        = 42 new ids. Existing packages: 2 (RUN-GFPN-ac4487, RUN-GFPN-3377f1).
        2 + 42 = 44 of the shared 48 (DC-7 A-7; DEC-20260923-8b2dbf AA-5 (e)).
        The 40 unused v2 and v2-a1 ids are retired by DEC-20260923-c1fb69
        R-1 (4) and refused by R-2, so they can never produce a package. The
        wrapper's R-11 counts directories under all four plans. DV-10 checks
        each bare id with --check against the v1, v2 and v2-a1 lists.
    Q7_DV_coverage:
      finding: >-
        COVERS EVERY IN-PROCESS PARI CALL AT EVERY FIELD, WITH ONE
        STRENGTHENING (RC-5). The frozen code has exactly three in-process
        calls, all v2_common.curve_order_pari (v2_driver.py lines 308, 542,
        771; confirmed by this act's search, and nothing in
        implementation-v2-a1/ uses cypari2). They meet three (p', n, curve)
        points: (4111, 3, fixture_n3(4111)) from G1 and G4; (16777291, 3,
        fixture_n3(16777291)) from G2; (4111, 4, fixture_n4) from the F-4
        package (square_analogue_n4.json field line: GF(4111^4)). DV-2 names
        all three. DV-1 must independently establish that no in-process call
        is reached at a ladder prime. DV-3 is the right negative control at
        the one point that failed. Gap: DV-2's correctness test at 16777291
        and at n = 4 is only "[N]G = O and two repetitions agree", which a
        multiple of the order also passes; RC-5 adds the Hasse interval and
        an independent-route cross-check.
    Q8_RS_sequencing:
      finding: >-
        COMPLETE AS TO STAGE ORDER; THE QUEUE MECHANICS ARE LEFT IMPLICIT.
        RS-0..RS-9 (lines 759-825) fix the blind-to-outcome order (both r1
        plans hash-bound at phase A before any repaired run; REG-1 before any
        spend at 16777291; aggregate_a1 after phase B). Missing and supplied
        by RC-9: the queue revisions that lift `blocked` states and append
        run directories; the lane moves (close-lane BATCH-6b1c29, open-lane
        BATCH-e409ca); the Coordinator decision that records the R2b packages
        not_attempted if the repaired gate fails, and what then happens to
        the review chain.

  proof_search_map_audit:
    applicability: >-
      NOT REQUIRED for this kind, as the draft states (lines 889-897) and as
      agents/coordinator.md "Proof-oriented dispatch gate" scopes it. This is
      an engineering repair of execution. It changes no mechanism,
      observable, quantifier order, method ceiling or nearby object. The
      section 8 audits of DEC-20260923-e788a1 and DEC-20260923-8b2dbf
      (proof_search_map_audit, lines 207-345 there) stand unchanged. The one
