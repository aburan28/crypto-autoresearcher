  limitations:
    - >-
      No shell. Every fact is read from committed files. Commit acceptance,
      lane state, host state and the BATCH-6b1c29 revision's validation are
      the dispatching session's reports. Neither queue has been run through
      research_dispatch.py or validate_dispatch_reference.py by this act.
    - >-
      Whether cypari2's constructor preserves a configured stack, whether
      PARI reports a grown parisize, and whether 512 MiB suffices at
      GF(16777291^3) inside the driver limit are properties of the installed
      libraries that this act cannot check. RC-2 and DV-2 decide them in R1,
      before any run; P-B covers the adverse case; if both branches fail,
      R1 stops and that is an impediment, never evidence.
    - >-
      The RC-3 defect is read from the code, not observed. It is fixed by a
      condition whose read-back (RC-3 (d)) and toy check (RC-3 (f)) will show
      in R1 whether it was sufficient.
    - >-
      The Sage comparator (anchor identity, G3) runs PARI-backed code in a
      capped child at a configuration this repair does not set; DV-1 flags
      it. A G3 failure for that reason would be an implementation signal at
      the gate, never a result, and would cost a new decision.
    - >-
      Scope: EcGFp5-shaped and EcGFp5-model TOY curves over F_{p'}[z]/(z^n -
      c) at the v2 and v2-a1 ladder primes, n = 3 and n = 4 fixtures at 4111
      and 16777291, known-scalar, msolve 0.6.5 -t 1, a 10 GiB child
      RLIMIT_AS. Nothing here is a measurement, and nothing transfers to
      p = 2^64 - 2^32 + 1.

