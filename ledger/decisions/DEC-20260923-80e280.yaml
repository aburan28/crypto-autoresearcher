      (audit 1 in spirit): the repaired pipeline must reproduce the archived
      4111 fixture before it is trusted at 16777291.

  # --------------------------------------------------------------------------
  # CONDITIONS
  # --------------------------------------------------------------------------
  conditions:
    - id: RC-1
      name: binding and authority
      text: >-
        Every repair task computes, before writing any file, the sha256 of
        v2_addendum_paristack.yaml
        (856fdc1d7b71da0cd9073634066dcb2a9a66d69cd10adf4ff5a738f2618390c7),
        v1_to_v2_reanchor_and_arm_iii.yaml
        (e02d4976a5e773b9eee95aa4c376d6154e9c0a9da4e6c6118ed58748054924d3)
        and v2_addendum_rung31.yaml
        (2c5e052468e37111023dd116706149fb05d691e7188e26ae1e2c069bad792d0c),
        and refuses on any other value. The paristack file's in-file
        `status: draft` is expected (in_file_status_note). Repaired v2
        packages record protocol_version "2-r1"; repaired addendum packages
        record "2-a1-r1". The r1 wrapper's R-1 binds these three values.
    - id: RC-2
      name: P-A read-back semantics and idempotence (makes PS-1 read_back testable)
      text: >-
        (a) START read-back: after configuring, the entry constructs a fresh
            cypari2.Pari() handle, reads default(parisize) and
            default(parisizemax), then constructs a SECOND fresh handle and
            reads both again. Both readings must equal 67108864 and
            536870912 exactly; otherwise the entry exits before any command
            (refusal recorded, never a result). A mismatch here is trigger
            (iii) when reproduced in DV-2.
        (b) EXIT read-back: parisizemax must equal 536870912 exactly.
            parisize must equal 67108864, UNLESS DV-2 has established on
            this host that PARI's default(parisize) reports the current
            (grown) stack size after a computation, in which case the
            accepted range is 67108864 <= parisize <= 536870912. Which
            semantics holds is established by DV-2 in stage R1 (reading
            before and after the (16777291, 3) call), written into
            implementation-v2-r1.md with the evidence, bound by phase A, and
            applied unchanged by the r1 checker. Establishing the semantics
            is NOT a P-B trigger and never stops R1 by itself.
        (c) pari-stack.json also records the cypari2 version
            (importlib.metadata) and the PARI library version, and whether
            the configuring call was made before the first import of any v2
            or v2-a1 module (it must be).
        No other value of parisize or parisizemax may be used.
    - id: RC-3
      name: redirection order, per-entry mapping, read-back and isolation (the defect found)
      text: >-
        (a) v2 ENTRY: set v2_common.PLAN_PATH to trial-plan-v2-r1.json and
            v2_common.TASK_ID to TASK-20260923-3aa31e after importing
            v2_common and before importing v2_driver.
        (b) a1 ENTRY: set the listed a1_common constants (PLAN_A1_PATH,
            V2_PLAN_PATH, RECEIPT_V2_PHASE_B, V2_GATE_PACKAGES, TASK_ID_RUNS
            = TASK-20260923-292052, PROTOCOL_VERSION = "2-a1-r1") BEFORE
            importing a1_driver, because a1_driver.py line 30 calls
            redirect_v2() at import. AFTER importing a1_driver, set
            v2_common.TASK_ID to TASK-20260923-292052, because redirect_v2's
            default task_id is bound at definition (a1_common.py line 90)
            and so sets TASK-20260923-6c7f55. In the a1 entry
            v2_common.PLAN_PATH is left as redirect_v2 sets it (the
            redirected PLAN_A1_PATH, i.e. trial-plan-v2-a1-r1.json) and is
            never set to trial-plan-v2-r1.json. The draft's list entry
            "v2_common.PLAN_PATH -> trial-plan-v2-r1.json" applies to the v2
            entry only.
        (c) These are the only additions to the draft's list, and each is
            permitted by its catch-all (lines 387-391). Each is listed in
            implementation-v2-r1.md with its old value, new value, entry and
            reason.
        (d) READ-BACK: after all imports and immediately before dispatch,
            each entry reads every redirected attribute back from its module
            (v2_common.PLAN_PATH, v2_common.TASK_ID and, in the a1 entry,
            every listed a1_common constant) and exits before any command
            unless each equals its r1 value. The read-back is written into
            pari-stack.json under `redirections` and copied into the
            manifest. No new file name is introduced.
        (e) ISOLATION: the r1 checker, the REG-1 comparator and any tool that
            applies v2 checks and a1 checks evaluates them in SEPARATE
            processes (or re-applies and re-reads the (a)/(b) values before
            each package), so that importing a1_check_run (line 30) can never
            redirect a v2 package's check.
        (f) DV-6 adds: an entry whose redirection read-back does not match
            (refused, exit 2, nothing written). DV-7's toy integration
            asserts that no toy artifact of either entry carries
            TASK-20260923-cd932c or TASK-20260923-6c7f55.
    - id: RC-4
      name: plan derivation made mechanically testable (PS-3, DV-5)
      text: >-
        (a) Union map M = id_map_v2 (31 entries) plus id_map_a1 (11 entries):
            42 entries, a bijection, every image a newly minted id, no image
            equal to any v1, v2 or v2-a1 id, and no preimage outside the 31 +
            11 frozen ids.
        (b) Before writing either plan, the Executor records in
            implementation-v2-r1.md, for EACH plan, the exact list of
            declared metadata key paths (JSON-pointer form) that are added or
            changed. The list is confined to the PS-3 categories (lines
            413-419 and 434-436): protocol label, task ids (task_id,
            written_by_task), archived_by, the `repair` block,
            gate.regression, id_map(s), never-reused and retired id lists,
            and a ceiling note.
        (c) Equality procedure, identical in the plan writer and in DV-5:
            delete the declared key paths from the r1 plan; replace every
            JSON string value that equals, or contains as a whole token
            matching RUN-GFPN-[0-9a-f]{6}, an image of M by its preimage;
            serialize both sides as canonical JSON (sort_keys, separators
            (',', ':'), ensure_ascii false); require byte equality with
            the frozen plan (trial-plan-v2.json sha256 16f33e39...4e16;
            trial-plan-v2-a1.json sha256 2a788720...5ac6).
        (d) In trial-plan-v2-a1-r1.json the pre-existing
            `v2_ids_never_reused` is mapped like every other field (its
            image lists the 31 r1 v2 ids, the ids the a1-r1 plan must never
            reuse). The 31 frozen v2 ids and the 11 frozen v2-a1 ids are
            carried under ADDED declared keys (for example v2_ids_retired,
            a1_ids_retired, or retired_ids), so no retired id is lost.
        (e) DV-5 performs (c) with its own code path in the development
            checks (it does not call the writer's comparison function), and
            both outputs are recorded.
    - id: RC-5
      name: DV-2 correctness strengthened (group orders)
      text: >-
        At each DV-2 point, N must in addition (i) lie in the Hasse interval
        |N - (q + 1)| <= 2 sqrt(q) (checked in integers), and (ii) satisfy
        [N]P = O for a second point P drawn from a declared development
        stream (for example random.Random('2026092002:v2r1:dv2:<p>:<n>')),
        besides the package basepoint. Under P-A, N at (16777291, 3) and
        (4111, 4) is also computed by /usr/bin/gp in a capped child (RLIMIT_AS
        10737418240 read back with getrlimit; a1_pari.py's stack defaults)
        and must agree with the in-process value. These are parameter checks,
        not results. A disagreement stops R1 for a Coordinator decision; it
        is not a P-B trigger.
    - id: RC-6
      name: REG-1 determinism probe before any spend
      text: >-
        DV-7's "REG-1 on two toy runs of the same toy package" runs the two
        toy runs in two separate processes with DIFFERENT PYTHONHASHSEED
        values (recorded). If any field REG-1 compares differs between them,
        stage R1 STOPS and returns: the pipeline is not deterministic at toy
        scale, REG-1 could not be read, and fixing it is out of this repair's
        scope. The exclusion list (PS-4 (e)) may not be widened to absorb
        such a difference in any field it may never exclude. The r1 wrapper
        does not set PYTHONHASHSEED for packages (RUN-GFPN-ac4487 ran without
        it), so G1 inherits the same condition as the reference.
    - id: RC-7
      name: REG-1 durability
      text: >-
        The REG-1 comparator's complete output (per compared file and field,
        the exclusion list's sha256, and the verdict) is quoted verbatim in
        execution-report-v2-r1.yaml on EVERY outcome, including a REG-1
        failure that leaves no G2 package, and phase B of
        TASK-20260923-b53550 binds that report. From G2 on it is also in
        every manifest (gate.regression_REG-1), as the draft requires.
    - id: RC-8
      name: phase-B receipt format for aggregate_a1
      text: >-
        TASK-20260923-b53550's post-run-receipt.json records path_sha256 as a
        mapping of repository-relative path to lowercase sha256 (or a list of
        {path, sha256}), which a1_common.receipt_paths reads (a1_common.py
        lines 117-122), and it covers every repaired v2 file that
        aggregate_a1 reads (a1_driver.py phase_b_check, lines 257-273).
        DV-7's toy integration runs aggregate_a1 against a synthetic receipt
        of that exact form and records status "verified".
    - id: RC-9
      name: SEQUENCING, BINDING ON THE DISPATCHER (restates PS-8 RS-1..RS-9 with queue and lane mechanics)
      text: >-
        Normative, and binding on the SESSION THAT DISPATCHES (AGENTS.md
        "Dispatch preconditions bind the DISPATCHER") in addition to each
        card's own preconditions. Every archive runs ALONE. RQ-4, RQ-6 and
        RQ-9 never overlap each other or any other solver-running process
        (EC-10; AC-6). Each producer runs under a lane claimed on the
        BATCH-e409ca queue and is released on return.
      sequence:
        - id: RQ-1
          step: This decision and its cards are ledger-archived by TASK-20260923-8d9ccb.
          condition: >-
            Before that commit, tools/research_dispatch.py and
            tools/validate_dispatch_reference.py pass on
            coordination/goals/GOAL-GFPN-380702/batches/BATCH-e409ca/dispatch_queue.json.
            After it, the post-commit verifier accepts it, the branch is
            pushed and draft PR #1391 (or its successor) is refreshed.
        - id: RQ-2
          step: Queue and lane bookkeeping, as separate commits.
          condition: >-
            (1) A BATCH-e409ca revision marks TASK-20260923-8d9ccb completed
                with commit_sha, parent_sha and full path_sha256;
                research_dispatch.py passes with the repository verifier.
            (2) The BATCH-6b1c29 revision of `batch_6b1c29_revision_authorized`
                below is appended; both tools pass.
            (3) `python3 tools/goal_lanes.py close-lane GOAL-GFPN-380702
                BATCH-6b1c29 --outcome superseded --decision
                DEC-20260923-80e280 ...` and `python3 tools/goal_lanes.py
                open-lane GOAL-GFPN-380702 BATCH-e409ca --queue
                coordination/goals/GOAL-GFPN-380702/batches/BATCH-e409ca/dispatch_queue.json
                --decision DEC-20260923-80e280 ...`, both published.
        - id: RQ-3
          step: Stage R1 under TASK-20260923-a681f9 (zero runs).
          condition: >-
            Only after RQ-2 in full, with the lane claimed `--as executor`
            after `git fetch` and `tools/goal_lanes.py lanes
            GOAL-GFPN-380702`, AC-1 preconditions reported, machine quiet.
        - id: RQ-4
          step: Phase A of TASK-20260923-b53550.
          condition: >-
            Alone, after R1 returns completed and releases its claim. Then a
            BATCH-e409ca revision records phase A, appends the bound
            implementation-v2-r1/ files to TASK-20260923-a681f9's
