        - id: RQ-8
          step: Stage R2b under TASK-20260923-292052, then TASK-20260923-befe48.
          condition: >-
            R2b reads the repaired v2 packages from their phase-B bytes
            (RC-8). befe48 runs alone after R2b returns (any outcome) and
            releases its claim, then its completing revision.
        - id: RQ-9
          step: Review.
          condition: >-
            The review-plan act (reserved TASK-20260923-387ca1) writes the
            review_plan FIRST, with its recorded prior, owning every joint
            of RC-12, and is ledger-archived (reserved TASK-20260923-53e1fe,
            DEC-20260923-a82492) before any reviewer runs. No
            evidence-review decision precedes the reports.
    - id: RC-10
      name: envelope, lane, machine quiet, launch rule
      text: >-
        DEC-20260923-e788a1 AC-1..AC-6 apply to every R1 development check
        and every R2 and R2b package exactly as to v2: child RLIMIT_AS
        10737418240 set in the child and read back with getrlimit (a child
        that cannot set it refuses to start); driver RSS at most 1 GiB; one
