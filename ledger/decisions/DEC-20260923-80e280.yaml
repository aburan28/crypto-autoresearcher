  rationale:
    - >-
      THE REPAIR IS MINIMAL, ADDITIVE AND STRICTER. One configuration of the
      process the v2 code runs in (P-A), a pre-declared fallback on a
      checkable infrastructure trigger (P-B), and only the identifiers and
      pointers the frozen wrappers make unavoidable. Every arm, cell,
      threshold, stream, watchdog, envelope value and reading rule is
      unchanged (draft `unchanged`, lines 836-860), and the gate gains REG-1.
    - >-
      THE FIX IS CHOSEN ON THE FAILURE'S MECHANISM, NOT ON ANY OUTCOME. No
      repaired package exists. Both r1 plans are hash-bound at phase A before
      any repaired measurement, and the v2-a1 run set was already fixed
      before any v2 measurement (DEC-20260923-034ba0 R-5).
    - >-
      WHY CONDITIONS AND NOT A REVISION. The one defect (RC-3) is an ordering
      and explicitness gap inside a clause whose catch-all already permits
      the fix, and whose own checker and toy integration would probably have
      caught it. RC-2, RC-4 and RC-8 make declared checks testable; RC-5 and
      RC-6 strengthen development checks before any spend; RC-9 makes
      sequencing binding where no card can carry it. Returning the draft
      would cost a round trip and change nothing a condition cannot carry.
    - >-
      THE BIAS IS TOWARD THE DECIDABLE QUESTION. Criterion C1's measured side
      and KN-OPEN-9b4a2b need the v2-a1 ladder. Abandoning it after an
      implementation-class failure would steer away from a decidable
      question for no scientific reason (AGENTS.md "Research-direction
      integrity").
    - >-
      NO SECURITY READING. Toy EcGFp5-shaped arithmetic at p' <= 1073741831
      with known scalars. Nothing transfers to p = 2^64 - 2^32 + 1 except
      under HEUR-GFPN-DFLAT as frozen.

