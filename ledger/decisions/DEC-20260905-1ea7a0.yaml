  coordinator_prior: >-
    RECORDED BEFORE ANY REVIEWER RUNS. What I expect this round to find:
    (1) The producer's per-arm false-positive budget priced against
    0.171940 should be straightforward arithmetic (worst-case bound times
    arm count, plus the decay-branch 0.018883 FM-OVERDISPERSED price), and
    I expect J-D1 to confirm it - UNLESS the design tries to budget
    plateau-consistent sentences per family rather than per arm, which
    would understate the worst case; that is the arithmetic error I would
    look for first. (2) I expect J-D2 to demand that the stopping rules be
    tied explicitly to the five-branch decision outcomes (which branch
    verdicts end the batch early, which require completion), because a
    design that lets the operator stop after a favorable plateau reading
    reintroduces exactly the optional-stopping bias NARROW-2 exists to
    forbid; if the design already binds stopping to the cascade, this
    expectation is confirmed; if it leaves stopping discretionary, J-D2
    should BREAK or require a REVISE. (3) I expect both reviewers to
    confirm the R5-3 declared-reliance statement resolves AC-1/AC-2: if
    the design declares NON-reliance on the skeleton and pricing JSON as
    binding verbatim-standing text (the natural choice - the design record
    itself carries the binding text), both conditions stay dormant; if the
    design adopts either document verbatim, the reviewers should require
    AC-1/AC-2 closed FIRST. (4) I expect no prohibited sentence anywhere
    in the design's outcome-to-sentence map (extinction, completion,
    cliff-at-4, whole-curve, plateau-safe-for-all-phi, count-verdict-at-
    k=8), because the candidate's licensing was just audited clean; any
    such sentence appearing in the execution design would mean the
    producer smuggled scope the candidate does not have, and is a
    BREAKS-level finding. A review that confirms all four points is less
    informative than one that overturns any; the prior exists so the
    difference is measurable.

  review_plan:
    joints:
      - joint: J-D1
        owner: TASK-20260905-0a79ec
        role: validator
        scope: >-
          Execution-design arithmetic and completeness audit: re-derive the
          per-arm false-positive budget (R5-2) in fresh sealed code;
          verify exposure/arm-count/cost arithmetic against the candidate's
          priced tables; verify seeds are deterministic and declared;
          verify every bound-carrying sentence carries the R5-1 priced-
          semantics scope statement; verify the R5-3 declared-reliance
          statement exists and matches the design's actual reliance; verify
          budget feasibility (wall clock, memory) against the goal's
          sizing basis. Blind to the red-team report.
        worked_attack_plan: >-
          Where I think it breaks: the FP budget may be priced per family
          rather than per arm (understating the worst case); the exposure
          arithmetic may reuse the superseded arcsine sizing (0.977)
          instead of the corrected exact values (0.952538 written order);
          the seed declaration may leave reseeding discretionary.
      - joint: J-D2
        owner: TASK-20260905-fbff7d
        role: red-team
        scope: >-
          Licensing and stopping-rule audit of the execution design:
          enumerate every sentence each possible measurement outcome would
          license and test each against NARROW-1..5, RAT-3/4/5-with-SR-1,
          and the R5 conditions; attack the stopping rules for
          optional-stopping bias (can the operator stop after a favorable
          reading?); verify the design declares reliance per R5-3 and rule
          AC-1/AC-2 dormant-or-active accordingly; search for prohibited
          sentences (extinction, completion, cliff-at-4, whole-curve,
          plateau-safe-for-all-phi, count-verdict-at-k=8). Blind to the
          validator report.
        worked_attack_plan: >-
          Where I think it breaks: discretionary early stopping after a
          plateau-consistent reading; a margin-zone outcome mapped to a
          sentence stronger than FM-UNRESOLVED; an outcome map that treats
          absence of decay as plateau evidence (proving too much where the
          homogeneous null is known to produce it).
    blindness:
      within_round: >-
        The two reviewers may not read each other's reports; each attests
        what it read.
      lifted_for: []
    proves_too_much_control: >-
      J-D2 runs the outcome map against the known-false objects inherited
      from J-R2/J-G2: the homogeneous-null OBJ-4 and the analytic-null-mean
      heterogeneous object - the design's outcome-to-sentence map must
      route their would-be readings away from FM-PLATEAU-CONSISTENT.
    blind_rederivation: >-
      J-D1 re-derives the FP budget from the bound statements
      (0.171940 range-wide; 0.018883 decay-branch price) and the design's
      declared arm count alone, never from the producer's arithmetic.

