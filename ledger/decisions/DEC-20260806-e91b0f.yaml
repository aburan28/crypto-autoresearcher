  context: >-
    BATCH-a83850 attempted to repair EXP-ICEX-146ff5 as successor
    EXP-ICEX-2f9337, per DEC-20260806-8f7e4f's next_action, but resolved
    homing FIRST as instructed. TASK-20260806-cfb90c found revisit condition
    R-D of DEC-20260805-bb162b unsatisfiable within its own write_scope and
    correctly stopped before writing any specification. The independent red
    team (TASK-20260806-fb3cd5, review-adversarial, independent session)
    confirmed the STOP verdict on its own reading of R-D, substantially
    strengthened the audit trail, surfaced a directly relevant concurrent
    decision from GOAL-ICEX-001's own Coordinator (BATCH-641950), and
    identified one fabricated claim within its own report -- which the
    dispatcher independently verified as false and excluded before this
    decision incorporated anything from that review.

  decision: route_to_GOAL-ICEX-001

  decision_scope: >-
    This decision governs the homing of one proposal lineage. IT DECIDES
    NOTHING ABOUT PRIME-FIELD ECDLP. No hypothesis status moves; H-STR-002
    and every other live hypothesis under this goal keep their current
    status. No contract is authorized to execute under GOAL-ECDLP-001.

  target_ids:
    - IDEA-20260803-fa9839
    - EXP-ICEX-146ff5

  evidence_ids:
    - EV-ICEX-82d77c

  rationale:
    disposition_basis: >-
      Under the two-clause conjunctive reading of R-D (charge all five
      GOAL-ECDLP-001.objective admission-bar terms AND mint a new IDEA-*
      record for the resulting "different and much larger proposal"), which
      both TASK-20260806-cfb90c and TASK-20260806-fb3cd5 independently adopt
      as better-supported and which two PRIOR independent records
      (BATCH-9c41dd's red-team finding F-14, and
      DEC-20260806-8f7e4f.rationale.routing_unresolved.finding) already read
      the same way, R-D's second clause is unmet. No proposal filed to date
      satisfies it -- confirmed by an exhaustive check across all ten
      IDEA-20260806-* records and all five RQ-ICEX-001-tagged
      IDEA-20260805-* records, none of which is a charged successor to
      IDEA-20260803-fa9839.
    interpretive_ambiguity_recorded_not_resolved: >-
      R-D's text is genuinely ambiguous at the program level. This batch's
      OWN dispatch_queue.json and TASK-20260806-cfb90c's own constraints
      never instructed minting an IDEA-* record -- implying the dispatching
      session (this session, at batch open) may have read R-D as
      satisfiable by cost-completeness alone. That is a design defect in
      THIS batch, owned by the dispatcher, not by the producer who correctly
      stopped inside the write_scope it was actually given. Under the
      two-clause reading, no task with that write_scope could EVER have
      satisfied R-D regardless of repair quality. This decision does not
      resolve which reading is correct; only DEC-20260805-bb162b's
      Coordinator, or a superseding decision on that record, has that
      authority.
    routing_does_not_unblock_execution: >-
      "Route to GOAL-ICEX-001" must not be read as resolving anything.
      GOAL-ICEX-001's own Coordinator, in BATCH-641950/SCOPE-DECISION.md
      (arrived via merge during this batch, already an ancestor of the
      reviewed snapshot), independently finds that goal barred from opening
      any execution batch today, pending four resume conditions R-1..R-4.
      Three are now satisfied by THIS SESSION'S OWN PRIOR WORK: R-1
      (BATCH-9c41dd snapshot TASK-20260806-fb85f5 committed, verified at
      f3d3b7e6), R-2 (independent red-team TASK-20260806-7e7ce3 returned),
      R-3 (BATCH-9c41dd ledger archive TASK-20260806-636e61 committed
      DEC-20260806-8f7e4f and EV-ICEX-2be32e, verified at 8ac66ac6). R-4 --
      a session with write access to ledger/goals/GOAL-ICEX-001.yaml issuing
      a separate Coordinator ledger authorization -- is NOT satisfied and is
      outside every write_scope in this batch. The honest statement,
      adopted verbatim from the reviewer: this proposal presently has no
      goal that can execute it.
    fabricated_finding_rejected: >-
      TASK-20260806-fb3cd5's report claimed commit 9d3a51ce is a "duplicate"
      merged from a different branch/PR (icex-641950-4cwbrq, PR #193) and
      that it diffs a byte-identical homing_decision.md. The dispatcher
      independently verified this is FALSE: 9d3a51ce's parent is db72f14c,
      this session's own commit opening this batch, authored by this
      session, not merged from elsewhere; a full-history git blob-hash search
      (every commit reachable from every ref) found the homing_decision.md
      blob occurring EXACTLY ONCE in the entire repository. This finding is
      EXCLUDED from the evidence record and from this decision. The
      reviewer's underlying, separable point -- that the dispatcher's own
      re-verification in a preservation commit is not equivalent to an
      independent red-team session, and commit-message wording claiming
      "verified independently" should not conflate the two -- is accepted
      and is corrected in this decision's own wording accordingly.

  next_actions:
    - >-
      TWO CONCRETE UNBLOCKING ACTIONS EXIST, NEITHER YET DISPATCHED.
      (a) Dispatch an idea-generator task, zero-compute, to mint the
      successor IDEA-* record R-D's second clause requires -- charging all
      five admission-bar terms this session's repair work already
      identified (charged descent, relation rank, verification, multi-target
      accounting, BSGS row beside rho). This would ALSO moot the routing
      question on either textual reading, since a new record satisfying R-D
      cost-completeness could be re-presented to GOAL-ECDLP-001 directly.
      (b) A session with write access to ledger/goals/GOAL-ICEX-001.yaml and
      ledger/decisions/ issues that goal's own R-4 Coordinator ledger
      authorization -- now unblocked, since R-1/R-2/R-3 are satisfied by
      this session's own prior work. This is GOAL-ICEX-001's Coordinator
      action, not this goal's, and is not taken by this decision.
    - >-
      SINGLE NEXT ACTION FOR GOAL-ECDLP-001: none of the above is dispatched
      under this goal. GOAL-ECDLP-001 continues its own active work
      unaffected by this proposal's homing status.
    - >-
      Record for whoever next opens a GOAL-ECDLP-001 batch touching this
      lane: do not re-dispatch a coordinator-only repair task against this
      proposal without first chaining an idea-generator task ahead of it,
      per the design gap this decision records as the dispatcher's own.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This batch adjudicated homing. Nothing was measured, no contract
      exists, and no evidence record above claim_tier not_applicable was
      produced. The control-cannot-fail methodological pattern flagged in
      DEC-20260806-a00a28 is not re-invoked here; this batch's defect class
      (a fabricated review finding, caught by direct verification) is a
      distinct integrity concern, noted but not yet a corpus-level KN-FIND
      candidate on one instance.

  claim_ceiling: >-
    Nothing in this batch may be cited as evidence about prime-field ECDLP,
    index calculus, or any solving degree. No contract exists under
    GOAL-ECDLP-001 for this proposal lineage, and none is authorized. The
    proposal is homed, provisionally, at GOAL-ICEX-001, which cannot itself
    execute it today.

