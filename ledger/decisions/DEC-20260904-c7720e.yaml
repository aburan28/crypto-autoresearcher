coordinator_decision:
  id: DEC-20260904-c7720e
  context: >-
    EXP-DREG-620b15 was drafted 2026-08-25 and never approved, frozen, or
    executed (status review_required, approved_by null, frozen false, runs/
    holds only .gitkeep, amendments/ empty). Its v1 budget declared memory_gb
    24, wall_clock_seconds 7200 per run, total_cpu_hours 16.0, maximum_runs 40,
    and specified n as an OPEN-ENDED LADDER RULE with the numbers explicitly
    unfixed. GOAL-DREG-001's next_action records this lane's most recent
    dispatch (TASK-20260828-955d56, n=15 D=6) returning ALL 6 required
    (seed, arm) runs failed_infrastructure/resource_exhaustion with ZERO ranks,
    at measured prepare-phase peak RSS 11.73 GiB (sem) / 12.22 GiB (null),
    seed 2026, before the rank-loop kernel was invoked. The maintainer, asked
    directly on 2026-09-04, ruled "revise before approve" (DEC-20260904-726129,
    ruling 1). This record files the revision that ruling directed.
  decision: revise
  target_ids:
    - EXP-DREG-620b15
    - H-DREG-91be14
    - IDEA-20260801-002
    - RQ-DREG-001
    - GOAL-DREG-001
  rationale:
    - >-
      REVISION, NOT AMENDMENT, AND THIS IS THE CHEAP MOMENT. Nothing has
      executed against the contract, so there is no frozen protocol to amend and
      no run whose comparability an edit could break. Once approved, the
      identical change would require a recorded protocol_amendment.
    - >-
      THE V1 BUDGET COULD NOT BE SERVED. Approving memory_gb 24 on a host whose
      only recorded completed_valid run in this lane measured 6.669 GiB peak RSS
      under a declared 8 GiB budget, and whose only attempt above that returned
      11.73/12.22 GiB with zero ranks, authorises a run whose return is
      failed_infrastructure. AGENTS.md rule 5 / CLAUDE.md rule 3 make that never
      evidence in either direction: it spends the approval gate and buys nothing.
    - >-
      THE CELLS HAD TO CHANGE, NOT ONLY THE CAP. A ladder that runs until it
      exceeds a cap does not yield a smaller result at the cap; it yields an
      infrastructure stop at the rung where it stopped. v2 replaces the ladder
      rule with an enumerated cell_list in three declared classes and adds a
      STAGE 0B zero-rank-work construction-and-footprint precompute: a cell is
      either cleared before any linear algebra or declared out of envelope with
      its predicted figure. v1's "stop the ladder at the first rung exceeding
      the memory budget" rule is WITHDRAWN.
    - >-
      THE CHEAP REFUTATION NOW RUNS FIRST AND CAN END THE CONTRACT. GATE A runs
      the direct F4/F5-style solve alone, ascending n, seed 2026, 600 s hard cap
      per cell. If no cell returns a completed solve, the contract terminates at
      STAGE 1A and its deliverable is that fact -- which is the contract's own
      falsification criterion ("No overlap n existing at all ... no d_reg-hat
      may be reported"). Maximum spend on a contract that dies there: <= 4,200 s
      CPU, <= 7 runs, <= 8 GiB. Control C7 makes the gate itself checkable:
      STAGE 2/3/4 artifacts existing without a populated GATE A table
      invalidate the run.
    - >-
      LARGEST SERVABLE CELL, STATED WITH ITS REASON: n = 9, D <= 8, full column
      set, with the 20-draw ensemble in the same run. Its column count at the
      degree ceiling (sum_{i<=8} C(18,i) = 106,762) is 0.61x the 174,035-column
      set this lane carried to completed_valid at 6.669 GiB; the ensemble runs
      sequentially so it multiplies time, not memory; and n = 10 jumps to
      600,370 columns, 3.45x ABOVE that anchor. n = 6, 10, 11 are
      precompute-gated at 6.0 GiB (25% headroom under the cap) rather than
      declared either way, because the anchor is cross-instrument and coarse.
      n >= 12 is OUT OF SCOPE and never attempted (n = 12 needs
      sum_{i<=9} C(24,i) = 2,579,130 columns, 14.8x the anchor; n = 15 has
      already measured 11.73/12.22 GiB in the prepare phase alone), with a named
      successor condition.
    - >-
      NO SCIENTIFIC CONTENT WAS WEAKENED. All six v1 controls survive at full
      strength, the ensemble stays at 20 draws, the +2 stability margin, the
      frozen 3-consecutive-rung departure rule, every falsification criterion
      and every invalidation rule are unchanged, and claim tier stays toy. The
      ladder was deliberately sized to the measured arm PLUS its 21-pass
      ensemble, not the measured arm alone: sizing to the arm alone would have
      bought one more rung by making "departure" unmeasurable at the rung where
      it matters.
    - >-
      EVERY CONTROL NOW NAMES A REAL FAILING INPUT, per DEC-20260904-166ab5's
      ruling that a control state the input that makes it fail ON A REAL ANCHOR.
      C1: n=9 seed 2026, solve returns 6 and the pass returns 5 or 7. C2: a draw
      whose support-pattern sha256 differs from the measured system's, or 20
      byte-identical draws (zero spread). C3: identical d_reg-hat AND per-degree
      rank vector at every reached rung. C4: shift 1 at n=7 and 2 at n=9. C5:
      largest computed degree 6 with stable degree 6. C6: a manifest reporting
      n=9 reached with peak_rss_bytes null. C7: STAGE 2+ artifacts with no GATE
      A table.
    - >-
      THE BUDGET NOW RECONCILES INSTEAD OF BEING ASSERTED. total_cpu_hours 15.0
      is the sum of six enumerated stage reservations
      (600 + 3600 + 7200 + 29700 + 6300 + 6300 = 53,700 s = 14.92 h) and
      maximum_runs 31 is their run count. The STAGE 4 control reservation is
      RING-FENCED: an extra rung is never funded out of a control. Per-run wall
      clock 7200 -> 3300 matches the turn budget; the 600 s foreground cap makes
      checkpoint-and-resume a required instrument property rather than an
      assumption. memory_gb 8 is the program's own declared floor.
    - >-
      THE OLD NUMBERS ARE PRESERVED, NOT OVERWRITTEN, in
      revision_record.budget_before_v1_verbatim,
      revision_record.cells_before_v1_verbatim and
      budget.superseded_v1_budget, with the trigger recorded as the maintainer
      ruling of 2026-09-04.
    - >-
      INDEPENDENTLY RE-DERIVED BY THE COMMITTING SESSION BEFORE FILING, because
      the designing session had no shell and its figures were arithmetic it
      could not execute. Recomputed and confirmed: sum_{i<=8} C(18,i) = 106,762;
      sum_{i<=8} C(22,i) = 600,370; sum_{i<=9} C(24,i) = 2,579,130; the ratios
      0.61x / 3.45x / 14.8x against the 174,035-column anchor; and the budget
      reconciliation 53,700 s = 14.92 h with 1+6+4+9+7+4 = 31 runs. Confirmed
      present in committed records rather than recalled: the 11.73/12.22 GiB
      figures (ledger/goals/GOAL-DREG-001.yaml) and the 6.669 GiB peak-RSS
      anchor (ledger/decisions/DEC-20260812-f56a44.yaml), and every path in
      evidence_refs. tools/validate_ledger.py was run over the tree by the
      committing session and reported no errors; the designing session correctly
      recorded that IT had not run it.
  evidence_refs:
    - experiments/EXP-DREG-620b15/specification.yaml
    - ledger/hypotheses/H-DREG-91be14.yaml
    - ledger/proposals/IDEA-20260801-002.yaml
    - ledger/goals/GOAL-DREG-001.yaml
    - ledger/decisions/DEC-20260828-653923.yaml
    - ledger/decisions/DEC-20260812-f56a44.yaml
    - ledger/decisions/DEC-20260904-166ab5.yaml
    - ledger/decisions/DEC-20260904-726129.yaml
    - coordination/goals/GOAL-DREG-001/batches/BATCH-006/tasks/TASK-20260827-765027/lane-contract.yaml
    - experiments/EXP-DREG-004/specification.yaml
    - ledger/evidence/EV-SIG-006.yaml
    - templates/research-records.md
    - src/semaev_tree.py
  limitations:
    - >-
      THIS IS NOT AN APPROVAL. status review_required, approved_by null, frozen
      false, execution_authorized false, evidence_eligible false. No handoff was
      written, no Executor dispatched, no run executed, no evidence created, no
      hypothesis status changed. H-DREG-91be14 stays `proposed`; GOAL-DREG-001
      stays `active`.
    - >-
      THE CONTRACT CANNOT CONTRIBUTE TO GOAL-DREG-001's COMPLETION CRITERION
      (n in {12,15,18}). It declares n >= 12 out of scope and never attempts it.
      v1 could not reach those rungs either -- it would have discovered that by
      spending an approval and returning failed_infrastructure.
    - >-
      PRINCIPAL SCIENTIFIC COST, STATED NOT HIDDEN: on the unconditional ladder
      {7,8,9} the frozen departure rule has ZERO MARGIN -- DEPARTURE requires all
      three rungs to diverge consistently, and one rung inside the spread forces
      INCONCLUSIVE. A-priori, INCONCLUSIVE is the most likely verdict. The rule
      was not narrowed to compensate.
    - >-
      Precompute-gated rungs n = 10, 11 run seed 2026 only. Any value there is
      labelled single-seed and may not be presented as replicated.
    - >-
      The 6.669 / 11.73 / 12.22 GiB figures come from a DIFFERENT instrument
      (EXP-DREG-004's restricted-adjacency pass). They bound the HOST, not this
      pivot-degree pass. That is why n = 10/11 are gated on this instrument's own
      precompute and why every reach must be reported with measured peak RSS.
    - >-
      The cell_list column counts are ARITHMETIC on sum_{i<=D} C(N,i),
      recomputable by any reader, and are labelled as arithmetic -- not
      measurements, not memory predictions. Column count is a proxy for memory,
      not a model of it; the 0.61x ratio is a reason to attempt n = 9, never a
      guarantee it fits.
    - >-
      TWO REQUIRED INSTRUMENT PROPERTIES ARE ASSERTED BY v2 AND NOT YET
      CONFIRMED: checkpoint-and-resume finer than 600 s, and a standalone
      zero-rank-work footprint-precompute entry point. Neither was read out of
      src/semaev_tree.py by the designing session or by this one. If either is
      absent, v2 re-creates v1's defect in a different place, so confirming them
      is a precondition of any approval decision and not part of this revision.
  next_actions:
    - >-
      BEFORE ANY APPROVAL DECISION: read src/semaev_tree.py and confirm the two
      instrument properties named in the last limitation actually exist. This is
      a code-reading task, not a run, and it is the cheapest thing that can
      refute the revision.
    - >-
      THE APPROVAL DECISION IS A SEPARATE COMMITTED DECISION AND THE
      MAINTAINER'S GATE. Approve for what v2 can deliver -- a terminating,
      <= 4,200 s answer to whether ANY overlap n exists on this host, plus a
      validated instrument and a small measured gap sequence if one does -- or
      decline. Do not approve expecting the completion criterion.
    - >-
      IF APPROVED, DISPATCH STAGE 0B + GATE A ALONE FIRST, as a bounded Executor
      task, and take the branch decision on GATE A's completion table before
      funding any of STAGE 1B-5. That is what putting the cheap refutation first
      buys, and it is lost if the whole contract is dispatched in one card.
    - >-
      CARRIED FORWARD, NOT DISPATCHED: the n in {12,15,18} rungs remain reachable
      only under the successor condition recorded in
      cell_list.out_of_scope_never_attempted -- a MEASURED >= 32 GiB service of
      this pass on some host, or an out-of-core/sparse instrument whose measured
      peak RSS at n = 10 is <= 6 GiB -- and each requires a NEW EXP id, never an
      amendment to this contract.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      The promotion rule fires only for `support` or `reject_scoped` on
      `replicated`/`strong` evidence. This is `revise` on an UNAPPROVED,
      UNEXECUTED contract; no evidence record exists, no run exists, and no
      finding is established. Promoting anything here would present a budget
      revision as a research result.
  decided_by: coordinator
  decided_at: '2026-09-04'
