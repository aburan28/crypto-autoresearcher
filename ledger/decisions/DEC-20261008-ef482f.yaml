        cannot_decide, which the prior did not foresee.
      - PC-NULL-R (ii) "weak but not strictly tautological": OVERTURNED.
        (ii) is informative against single-arm departures. The algebraic
        zero-sum of the numerators does not make it degenerate, because zbar
        moves through the unequal denominators.

