      routing: informative -> no change
      ruling: PC-NULL-R unchanged (AMD A-8). The red team owns criterion (i)'s near-degeneracy and (ii)'s blindness to common mode as one joint in the review round.
    Q3_fixture_tooling: consistent; see V-9
    prior_vs_result: >-
      DEC-20261008-8cb005 recorded these priors:
      - PDI-2 "admissible", at about 0.7: matched.
      - the other PDIs follows or admissible, PDI-4 and PDI-6 least sure:
