        the uncalibrated model mean. EXP-PFDR-0b3699 writes the undefined
        symbol mbar_j (EF-36). PDI-9 uses the calibrated null mean
        rho1_hat_b x mu_model(j), which is A-TAIL's model mean rescaled to
        this experiment's calibration. The list is secondary and never
        gating.
      ruling: >-
        PDI-9 is admissible and carried (AMD A-7). The review round reports
        the list under both means. Per the pre-committed routing, PF-2 is
        recorded against 8a6b8a: an open detail resolved without a stop. It
        is minor, because the quantity is a non-gating list.
