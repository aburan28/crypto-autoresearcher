coordinator_decision:
  id: DEC-20260922-0397f8
  context: >-
    Design approval for the single-edge rank-profile test of RQ-DREG-d7b6d6.
    Standing user authorization of 2026-09-06. This decision does not assert
    that H-DREG-1d0e5d is true.
  decision: approve
  target_ids:
    - H-DREG-1d0e5d
    - EXP-DREG-dd668d
    - IDEA-20260922-9d808c
    - RQ-DREG-d7b6d6
  rationale:
    - >-
      IDEA-20260922-9d808c is the first justified experiment. A later class
      census is unreadable if linear substitutions move the rank profile.
    - >-
      The contract freezes the char-2 ordinary model, the degree-2 kernel, the
      boolean Macaulay definition, D_max = 4, seed 20260922, and a finite list
      of outcome labels. Success and falsification are decidable from the
      primary difference.
    - >-
      It does not rerun the m=3 prime-field screen closed by DEC-20260716-003,
      and it does not treat a timeout as an exploded degree.
    - >-
      Budget fields that are null are advisory under docs/research-budget-policy.md.
      maximum_memory_gb 4 and maximum_runs 1 are machine protection and the
      scientific sample count.
  evidence_refs: []
  limitations:
    - Approval is protocol completeness, not evidence.
    - One toy edge. No exponent claim.
  next_actions:
    - >-
      Execute EXP-DREG-dd668d under TASK-20260922-4a49b0 after this snapshot
      commit is on the branch. Do not launch the census, the three-arm control,
      or the graph comparison in that same run.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      An approval of an unexecuted protocol creates no finding. Nothing is
      promoted.
  decided_by: coordinator
  decided_at: '2026-09-22'
  user_authorization: >-
    AGENTS.md standing authorization, 2026-09-06, that complete idea and
    experiment protocols are approved without a further user confirmation.
