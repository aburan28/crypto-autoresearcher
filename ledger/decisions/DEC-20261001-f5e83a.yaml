coordinator_decision:
  id: DEC-20261001-f5e83a
  recorded_at: '2026-10-01'
  decided_at: '2026-10-01'
  decided_by: coordinator
  recorded_by: coordinator
  goal_ids: [GOAL-RELN-001, GOAL-ICEX-001]
  archived_by: TASK-20261001-0d9c23
  prior_decisions:
    - DEC-20261001-7fa9f9 (RELN review round; NA-1/NA-2)
    - DEC-20261001-9e675e (ICEX review round; NA-1/NA-2)
  inference:
    policy: coordinator-orchestration-code
    resolved_model_id: unknown (Cursor runtime; top-level session on its inherited model)
    fallback_used: true
    fallback_reason: Cursor runtime does not expose the resolved model identifier.

  decision: open_batches
  decision_label: >-
    CLOSE BATCH-229ce4 (RELN) and BATCH-227e0d (ICEX) as checkpoints. CONVERT
    both goal records to the sharded layout. OPEN design batches BATCH-9fba5a
    (RELN) and BATCH-454f85 (ICEX), one coordinator design task each. RULE that
    both successors are new contracts, not amendments. No runs; no approval.

  target_ids:
    - GOAL-RELN-001
    - GOAL-ICEX-001
    - BATCH-229ce4
    - BATCH-227e0d
    - BATCH-9fba5a
    - BATCH-454f85
    - TASK-20261001-5a45b1
    - TASK-20261001-8caa47
    - TASK-20261001-768475
    - TASK-20261001-3bcf4a
    - TASK-20261001-0d9c23
    - TASK-20261001-704851
    - EXP-ICEX-fa2b37

  reserved_ids:
    note: Minted and checked free with tools/allocate_id.py; the design tasks write these records. Not targets until they exist.
    ids: [EXP-RELN-dc761f, H-RELN-940f14, EXP-ICEX-153c34, H-ICEX-6ca21f]

  ranking:
    ecc_first: >-
      RELN and ICEX are declared ECC areas (tools/ecc_priority.py). Both goals
      are active with unlimited budgets; both have a committed next action
      from a reviewed decision, which outranks re-generating ideas.
    obstruction_registry_read: >-
      tools/obstruction_registry.py --unexamined lists one entry,
      EV-AES-abf3dc (non-ECC; not a candidate for these goals). The two
      obstructions recorded today (EV-RELN-3c9a24, EV-ICEX-16e3ec) carry
      examined resource checks, and each names the successor ranked here.
    rank_1:
      task: TASK-20261001-768475 (ICEX matched-L non-enumerative membership)
      why: >-
        The ICEX obstruction is quantitative and localised: every stage except
        membership is on model, so one measurement (membership cost per success
        at matched L) decides whether the index-calculus route on these
        fixtures can approach rho at all. Competitive threshold about
        sqrt(q)/(L+27) units per success against 50-306 rho solves now. This is
        the exponent-relevant question.
    rank_2:
      task: TASK-20261001-5a45b1 (RELN short-cycle enrichment successor)
      why: >-
        The RELN statistic was the wrong instrument; the hypothesis is untested.
        A statistic not fixed by (|E|, |V|, c) against the same rewire null is
        the smallest change that can test it.
    concurrency: >-
      Both are design-only (no runs), with disjoint write scopes, so they run
      concurrently; max_concurrent 1 per batch.

  rulings:
    - id: R-1
      ruling: >-
        RELN successor is a new experiment EXP-RELN-dc761f under a new
        hypothesis H-RELN-940f14 (parent H-RELN-4d092c). The change of
        statistic, budget design and certificate domain is more than an
        additive amendment can carry without obscuring what v4 froze.
    - id: R-2
      ruling: >-
        ICEX successor is a new experiment EXP-ICEX-153c34 under a new
        hypothesis H-ICEX-6ca21f (parent H-ICEX-d8e858). EXP-ICEX-fa2b37 stays
        as approved and is not amended: its object (public-scalar Semaev
        decomposition at arities 3-5) differs from the matched-fixture
        membership measurement. The successor may reuse its backend design and
        must cite it.
    - id: R-3
      ruling: >-
        Goal records GOAL-RELN-001 and GOAL-ICEX-001 are converted to the
        sharded layout (tools/shard_goal.py). Previous next_action and
        current_batch_id values are preserved under dated *_superseded_20261001
        keys on the head.

  transitions_not_made:
    - record: H-RELN-4d092c
      note: Stays approved (DEC-20261001-7fa9f9).
    - record: H-ICEX-d8e858
      note: Stays approved (DEC-20261001-9e675e).
    - record: EXP-RELN-dc761f
      note: Not yet written. A designed contract stays approved_by null until a separate committed approval decision.
    - record: EXP-ICEX-153c34
      note: Not yet written. Same rule.

  rationale: >-
    Each review round ended with a reviewed next action. Doing those next is
    the highest-ranked work on both goals, and both are design steps whose
    failure modes (an under-powered analysis, a statistic fixed by its null)
    were found in this round. Both design cards therefore require the
    proves-too-much control at realistic noise before any approval.

  knowledge_promotion:
    promoted: []
    not_warranted: Batch-opening decision; it records no result.
