  rulings:
    - id: R-1
      subject: AMB-1 (IC-2 j = 0 generator)
      ruling: >-
        Change the prime, never the b-loop (AMD-20260929-1de84f C-1). A prime
        drawn from the unchanged j0 stream is skipped, and the same stream
        continues, when it equals the prime already selected for a
        lower-index curve at the same bits, or when none of its six twists
        y^2 = x^3 + g^i (g = primitive_root(p), i = 0..5) passes the frozen
        order certification on one point drawn from the separate stream
        _seeded_rng("crypto_autoresearcher.index_calculus.curve.j0.twistcheck",
        bits, seed, p). The frozen b-loop then runs unchanged on the surviving
        prime. The check is exact, not probabilistic (the six classes exhaust
        the b-loop's group orders, and the frozen certification on any finite
        point decides prime order), so the generator terminates on every cell
        and a cell whose first prime already worked returns the frozen curve.
      why_this_option: >-
        Of the executor's options, "continue the same stream to the next
        prime with a prime-order twist" is taken, made exact and
        deterministic; "bound the b-draws" was rejected because a bound can
        skip a prime that has a prime-order twist with small but nonzero
        probability and so depends on an arbitrary constant. Keeping p = 1
        (mod 3), j0_filter, certified prime order, the 3 | d coset base, three
        matched random bases of equal size, the census target stream and rho
        on the same curves preserves the j0 panel's role as the
        formal-coincidence positive control, PC-2 on 35 (rung, curve) units,
        G6, and the matched-random comparison. The distinct-prime rule was
        added because the frozen streams already drew one prime twice at 16
        bits; without it two of the 35 units could be the same field, which
        weakens the unit count PC-2's z uses. It is pre-data and applies to
        the j0 panel only; the frozen main panel is not amended.
    - id: R-2
      subject: AMB-2 (a base too small to reach k in census mode)
      ruling: >-
        Classification (C-3): an instance whose solve returns without a gate
        failure but stops at the solver's attempt limit without determining k
        is failed_infrastructure (status_reason attempt_limit_without_k), is
        retained with all its columns and harvest block, and does not stop
        the run. This applies to every census panel, arm, mode and cell, not
        only (14, 4, 5). It is never negative evidence. Analysis (C-4): a
        structured arm whose base size differs from its matched random arms'
        size (possible only through the max(4, .) floor) has that curve
        dropped from its A1 cell, together with its matched randoms, and from
        A3, A4 and A7, whatever the instance status, with reason
        unmatched_size; failed_infrastructure instances are dropped as A1
        already drops failed ones and excluded from A3, A4, A6 and A7. R15
        lists every excluded instance and every cell with fewer than five
        curves. The cell itself runs as frozen in both modes; no size floor
        and no skip.
      why: >-
        At (14, 4, 5) the subgroup arm has 1 point against 4 in its matched
        randoms, so the kappa comparison there is unmatched by construction,
        whatever the instance does; the version-1 invalidation rules (I-1..I-6)
        do not include an attempt-limit stop, so classifying it invalid and
        stopping the run was an implementation choice outside the contract.
        Recording and excluding follows the rule that an infeasible or
        exhausted instance is never evidence, and avoids both adaptive
        skipping and changing the arm's defining coset at one cell.
    - id: R-3
      subject: re-execution of R01-R09 on the amended build
      ruling: >-
        Not required, on an explicit evidence standard (C-2): E-1 byte
        identity of factor_base.py, tails.py, decompose.py, solver.py,
        harvest.py and every unchanged engine and results file; E-2 and E-3
        an AST-level per-function diff showing changes only in the named j0
        and census functions of curve.py and __main__.py; E-4 a static call
        graph showing that no changed or added function is reachable from the
        sweep subcommand; E-5 R01 re-run on the amended build as R01a. If any
        condition fails, R02-R09 are re-run as R02a-R09a before R10, and a
        G1/G2 failure there follows version 1's stopping rule.
      why: >-
        G1 and G2 test the sweep path; under E-1..E-4 every function that path
        executes is identical on both builds, and determinism (I-5) carries the
        gates over. The census subcommand that R10-R14 use was never covered
        by G1 or G2 on either build, so re-running R02-R09 would not check the
        changed code; R01a and G4-G7 on every panel instance do. Machine time
        was not a reason either way.
    - id: R-4
      subject: the executor's recorded deviations
      ruling: >-
        Material and ruled: the j0 target-log rule is ratified as protocol
        text (C-5, k = Random("target|bits|c|0").randrange(1, N), the main
        panel's rule); the poisson_mean formulas are ratified as the
        H-PFDR-4765e4 HEUR-4765e4-H1 specification_of_means (C-6); the
        per-instance watchdog must be in force for R10-R14 through the census
        subcommand's default (D-1); the RLIMIT_AS proxy for the RSS cap is
        accepted with ru_maxrss recorded on any memory stop (D-2);
        analyze_census.py is pinned by sha256 before R10 (C-7). Accepted as
        recorded: the extra census-row keys, --instance-watchdog and --quiet,
        known_log cap-unavailable handling, the scan-level recorder (G5
        identity exact), harvest time inside seconds fields, the cumulative
        worker RSS high-water mark (to be labelled), the SS-store layout, the
        venv interpreter, the post-processing wrappers, the pre-R01 SS-store
        memory reductions and the skipped msolve tests (C-8 D-1..D-15). Not
        ruled here: the EXP-PFDR-7c8bf2 unfiltered-rho de-duplication and the
        other Stage 0 deviations, which belong to the Stage 0 review
        (TASK-20260929-69b7c5 J5) because Stage 0 is complete and any change
        now would be post-data.
    - id: R-5
      subject: pre-data status of the amendment
      ruling: >-
        PRE-DATA for every quantity R10-R15 measure, recorded in
