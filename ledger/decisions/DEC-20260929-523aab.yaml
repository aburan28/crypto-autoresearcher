  rationale:
    - >-
      Both ambiguities are defects of contract text, not of data: AMB-1 is a
      property of j = 0 curves the generator text did not anticipate, and
      AMB-2 is a design-floor corner the classification text did not cover.
      An additive, pre-data amendment is the only route that keeps the frozen
      specification and every archived run intact.
    - >-
      Every change is chosen to preserve the controls it touches: PC-2 and G6
      keep their definitions and unit count; the matched-random comparison is
      protected by excluding, not repairing, the one unmatched cell.
    - >-
      Infeasible and exhausted instances are recorded and excluded, never
      read as evidence (AGENTS.md core rule 5), and the rule is general, so
      it cannot be applied selectively after outcomes are seen.
    - >-
      The re-run standard is a checkable certificate rather than an argument
      in prose: byte identity, AST-level function identity, a call-graph
      separation and a fresh test run. A failed certificate triggers the
      re-run automatically.
    - >-
      Target profile (docs/target-result-profile.md): the census's structural
      branch is the only exponent-relevant reading in this lane; unblocking it
      with its dynamic-range controls intact is the highest-value next step
      on RQ-PFDR-ae2fba. The Stage 0 review runs beside it because its
      outcome meets a falsification condition and must be reviewed before any
      reading, and it costs the census nothing.

