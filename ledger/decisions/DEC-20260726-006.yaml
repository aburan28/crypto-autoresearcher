coordinator_decision:
  id: DEC-20260726-006
  context: >-
    EXP-STR-002 (13 runs at 8-12 bit j=0 curves) tested H-STR-002: does a
    phi-invariant factor base induce lower displacement rank than random?
    Result: phi_alpha < rand_alpha in 4/4 cases (3x reduction at B=27),
    density penalty ~1.0 (no collection cost increase). However, alpha = B/3
    not O(1), and the structured solve is not cheaper until B > 200.
  decision: support
  target_ids:
    - H-STR-002
    - EXP-STR-002
  rationale:
    - >-
      phi_alpha < rand_alpha in 4/4 cases, with a 3x reduction at B=27 (9 vs
      27). The endomorphism-invariant factor base does induce measurable
      block structure, unlike the failed AP approach (alpha ~ B).
    - >-
      Density penalty ~1.0: the phi-orbit constraint does NOT reduce the
      relation hit rate. This is the key advantage over the AP approach,
      which had 17.5x-4128x penalty.
    - >-
      support is chosen over inconclusive because the direction is clear
      (4/4 cases, 3x reduction, no penalty) and the mechanism is confirmed
      (phi-invariance gives partial block-circulant structure).
    - >-
      support is at preliminary strength because: (1) only 2 meaningful data
      points; (2) alpha = O(B/3) not O(1) as predicted — the structure is
      partial; (3) the structured solve is not cheaper at B=27 (needs B>200);
      (4) 16/20-bit instances were not generated.
    - >-
      The alpha = B/3 result suggests the phi-orbit closure is imperfect: some
      phi-shifted relations have summands outside F. A larger factor base or
      a stricter orbit construction might improve this toward O(1).
  evidence_refs:
    - EV-STR-002
    - EV-STR-001
  limitations:
    - Only 2 meaningful data points (B=6, B=27)
    - alpha = O(B/3) not O(1); partial block-circulant structure
    - Structured solve not cheaper until B > 200
    - 16/20-bit instances not generated (slow BSGS + factoring)
    - Toy scale only; j=0 curves only
  next_actions:
    - >-
      To upgrade to replicated/strong: (1) generate 16/20-bit j=0 instances
      with a faster point-count; (2) test B=50-200 to see if the structured
      solve becomes cheaper; (3) investigate why alpha = B/3 not O(1) — is
      the phi-orbit closure imperfect, or is the displacement rank definition
      too conservative?
    - >-
      To investigate the O(1) vs O(B/3) gap: try a stricter factor base
      construction where ALL phi-shifted summands are guaranteed in F (e.g.,
      only keep relations where all 3 orbit members are present).
    - >-
      If not pursuing: H-STR-002 is supported at preliminary strength. The
      endomorphism-invariant factor base gives 3x displacement rank reduction
      with no density penalty, but the structured solve crossover is at B>200.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      EV-STR-002 is preliminary (2 data points, partial structure, no cost
      advantage yet). The 3x alpha reduction with no density penalty is a
      structural signal, not a proven LA advantage. No KN-FIND until the
      structured solve is shown to be cheaper at a tested B.
  decided_by: coordinator
  decided_at: "2026-07-26T19:15:00-07:00"
