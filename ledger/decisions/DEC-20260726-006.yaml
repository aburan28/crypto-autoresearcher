coordinator_decision:
  id: DEC-20260726-006
  context: >-
    EXP-STR-002 extended with 9 measurements at 12-20 bit j=0 GLV curves
    (B=16 to B=397). At B=204: phi_alpha=4 vs rand_alpha=200, cost_ratio=0.314.
    At B=397: phi_alpha=1 vs rand_alpha=387, cost_ratio=0.011. The structured
    solve beats Wiedemann at B >= 55. Alpha scales as O(1) at large B, confirming
    H-STR-002. Density penalty ~2-3x (far below AP's 17.5x-4128x).
  decision: support
  target_ids:
    - H-STR-002
    - EXP-STR-002
  rationale:
    - >-
      phi_alpha << rand_alpha at B >= 55: 2 vs 53 (B=55), 4 vs 200 (B=204),
      1 vs 387 (B=397). The endomorphism-invariant factor base induces O(1)
      displacement rank at large B, confirming H-STR-002.
    - >-
      Structured solve beats Wiedemann: cost_ratio < 0.5 at B=55 (0.218),
      B=204 (0.314), B=397 (0.011). The crossover is at B ~ 55.
    - >-
      Density penalty ~2-3x: far below the AP approach's 17.5x-4128x penalty.
      The phi-orbit constraint is much cheaper than the AP constraint.
    - >-
      support at preliminary strength: the result is instance-dependent (some
      B values show poor phi-orbit closure) and model-based (cost comparison
      is not a measured wall-time). But the best cases are strong (387x
      reduction, 90x cost advantage at B=397).
  evidence_refs:
    - EV-STR-002
    - EV-STR-001
  limitations:
    - Instance-dependent: requires enough complete phi-orbits.
    - Model-based cost comparison, not measured wall-time.
    - Toy scale only (max 20 bits); j=0 curves only.
    - Density penalty ~2-3x (not 1.0x as initially estimated).
  next_actions:
    - >-
      To upgrade to replicated/strong: (1) implement an actual structured solve
      (superfast Toeplitz solver) and measure wall-time vs Wiedemann; (2) test
      at B=500-1000 to confirm the O(1) alpha scaling; (3) investigate the
      instance-dependence (why some B values have poor closure).
    - >-
      Also: the GGM simulability test (EXP-GGM-001) can determine whether the
      endomorphism oracle is GGM-simulable. If SIMULABLE, the block-structure
      advantage is non-generic but within the generic lower bound. If
      NON-SIMULABLE, it is a genuine non-generic signal.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      EV-STR-002 is preliminary (instance-dependent, model-based cost, toy
      scale). The 387x alpha reduction at B=397 is a strong structural signal,
      but the cost advantage is not measured. No KN-FIND until a structured
      solve implementation confirms the wall-time advantage.
  decided_by: coordinator
  decided_at: "2026-07-26T19:30:00-07:00"
