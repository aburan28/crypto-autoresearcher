        owner's own note, C7), so V2 reports a schema non-conformance on every
        directory. P3 (moderate): at least one directory is an infrastructure
        failure with no scientific output (the owner's note on
        RUN-QSP-cec70a) and one is an unfinished attempt (RUN-QSP-715b58);
        both are classified infrastructure or incomplete, never negative. P4
        (weak): where a receipt exists, its plan_sha256 matches the run2 plan
        file, seeds match the plan, and raw and summary agree. P5 (weak): the
        files reached main by a merge whose commit the inventory identifies,
        without any QSP archive. A prior the validator overturns is recorded
        by the composer as such.
    - id: R-KEYS
      subject: the composer's keys, fixed before the validator runs
      ruling: >-
        DEC-20261002-e0aa2b classifies each directory of the bound set,
        adopting the validator's per-check results, as one of
        valid_observation, infrastructure_failure, incomplete_attempt,
        invalid (defects listed) or not_checkable (reason). It then classifies
        the set. K-COMPLETE: every trial of a plan lineage that covers the
        specification's trial set is valid. K-PARTIAL: the present valid
        trials are a proper subset. K-INVALID: a defect (seed, raw/summary,
        plan-hash binding or source-hash closure) touches every present
        scientific trial. K-NOT-CHECKABLE: a check needed for the set cannot
        be run, and what is needed is named. Next actions by key: K-COMPLETE
        names an evidence-review batch with its own review plan (TW-C1);
        K-PARTIAL names, ranked, (i) execution of the missing trials under an
        approved binding, stating that BATCH-2c4a9c's snapshot needs a scoped
        successor excluding the bound set (R-BIND (7)), (ii) whether the
        frozen specification permits any staged analysis of the present
        subset, read from the specification and never assumed, and (iii) the
        disposition of the manifest-schema non-conformance (an accepted,
        disclosed non-conformance or a successor implementation version) as
        its own Coordinator act; K-INVALID returns named defects to
        execution; K-NOT-CHECKABLE names what is needed. In every case the
        decision may recommend closing QSP lane records, never closes or edits
        one, writes no EV record, moves no status, and reads nothing about
        H-QSP-cd0c90. A timeout, crash, expired claim or infrastructure
        failure is never negative evidence.
    - id: R-OUTCOME
      subject: outcome discipline inside the chain
      ruling: >-
        The validator's report states validity per check and per directory;
        it quotes a run value only where a check needs it (for example a
        raw/summary mismatch) and never states whether any trial supports,
        weakens or contradicts H-QSP-cd0c90 or EV-QSP-a6aa4b. The composer
        does the same. No card, note, receipt, commit message, PR text or bus
        message of this batch states a scientific result. TW-C1: if the set
        is later reviewed as evidence and could contradict EV-QSP-a6aa4b's
        validated headline, that evidence review runs at review-breakthrough
        at max (AGENTS.md rule 12); this chain does not make that reading.
    - id: R-INDEPENDENCE
      subject: who runs what
      ruling: >-
        The validator is an independent review-adversarial session that did
        not author this decision, is not the session that produced the runs
        (coordinator-qsp-run-20260921, session wt-qsp-run), did not perform
        the inventory or snapshot, and is not the composer. The composer is a
        fresh Coordinator session that did not author this decision, is not
        the validator, and did not produce the runs. The inventory and
        snapshot are mechanical session acts. One model family serves every
        role by runtime inheritance; session independence is real, model
        independence is not claimed.
    - id: R-OTHER-LANES
      subject: everything else on the goal
      ruling: >-
        No QSP record is touched, claimed or closed: not BATCH-1faf6f,
        BATCH-2c4a9c, -9dbda3, -ed05f2 or -ee209c, their queues, handoffs,
        claims or lane records. No BATCH-f435ab, BATCH-35bdda, BATCH-ccfdc6
        or BATCH-b67954 path is read or written by any card of this batch.
        The standing order of DEC-20260929-7257b2 and DEC-20260929-54dcd8 is
        unchanged except that slot 1 is now occupied by this lane (R-SLOT).
    - id: R-HEAD
      subject: goal-head edit
      ruling: >-
        ledger/goals/GOAL-ECDLP2M-001.yaml is edited additively only, in the
        standing form of DEC-20261002-0983f2 R-HEAD: one operative next_action
