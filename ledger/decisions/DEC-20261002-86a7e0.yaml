        content_first, runs alone. (5) TASK-20261002-7eb899 validator,
        review-adversarial at xhigh, independent session. (6)
        TASK-20261002-84621d composer, a fresh Coordinator session writing
        DEC-20261002-e0aa2b. (7) TASK-20261002-9a734c ledger archive,
        content_at_commit, runs alone, closes the lane. Why an inventory card:
        research_dispatch.py binds only artifact_paths of an archive's own
        non-archive source tasks in the same queue (lines 905-948), so the
        existing files must be declared by a card of this queue; a mechanical
        inventory is the cheapest such card and records the name-level
        custody facts (declarers, introducing commits, plan mapping) durably.
        The supersession needs no archive of its own: it is a ruling of this
        decision, effective at TASK-20261002-5e1246's verification. This is
        the six-card shape of DEC-20260928-65c6d7 R-CUSTODY plus the inventory
        card, inside the "six or seven" of DEC-20260929-01ea31 R-CUSTODY.
