        -7faa1b, -d10c74 or -ef2490 is present; or any path lies outside a
        RUN-QSP-* directory. These are the session's own NA-3 counts; a
        difference means runs/ changed since the render. No file is opened.
        The handoff record of TASK-20261002-345dbd states the rule; the queue
        entry is authoritative for the list.
