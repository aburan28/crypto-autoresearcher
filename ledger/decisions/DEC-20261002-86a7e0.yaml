      subject: the chain
      ruling: >-
        SEVEN CARDS, SERIAL, max_concurrent 1. (1) TASK-20261002-0e76e7
        opening card, completed at writing (PD-1). (2) TASK-20261002-230174
        opening ledger archive, content_at_commit, runs alone, after R-ENUM.
        (3) TASK-20261002-345dbd custody inventory, a zero-run coordinator
        card performed mechanically by the top-level session, review_required
        true; it writes run-inventory.json and declares the bound set (R-ENUM)
