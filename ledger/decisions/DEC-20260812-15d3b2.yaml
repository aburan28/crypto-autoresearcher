coordinator_decision:
  id: DEC-20260812-15d3b2

  context: >-
    BATCH-9e3584's two independent reviews were dispatched a second time and returned.
    The four producers are unchanged and their 28 artifacts remain committed at
    c034ef38; the two wave-2 reviewers re-verified that snapshot, its notarization chain
    in both directions, and every Coordinator git claim in
    COORDINATOR-ADJUDICATION-20260811.md, and the Validator returned `passed`. WHILE
    VERIFYING ITS OWN DEPENDENCY, THE WAVE-2 VALIDATOR FOUND (finding F-7) AND THE
    DISPATCHING SESSION INDEPENDENTLY CONFIRMED THAT THE SAME TWO TASK CARDS HAD ALREADY
    BEEN EXECUTED ON AN UNMERGED BRANCH. origin/claude/ml-kem-solution-ckdxmg (tip
    86ac7f72e) is pushed, is NOT merged into origin/main, and already carries: a
    DIFFERENT validation_report.yaml at
    .../BATCH-9e3584/reviews/TASK-20260809-3f1dc4/; a DIFFERENT red_team_report.md plus
    21 probe files at .../reviews/TASK-20260809-444fe7/; and a COMPLETED ledger archive
    TASK-20260809-60f9cc (commit 5004932a9) creating ledger/evidence/EV-MLKEM-9346bb.yaml,
    ledger/decisions/DEC-20260809-afe29b.yaml and knowledge/findings/KN-FIND-2a35aa.md,
    with all five tasks in its queue reading `state: completed`. In that chain
    DEC-20260809-afe29b records `decision: revise`, states R-OUT-1 STANDS, amends the
    frozen instrument via AM-15/AM-16, and holds claim tier toy. SO ONE PRODUCER SNAPSHOT
    NOW HAS TWO INDEPENDENT REVIEW WAVES AND, ON MERGE, WILL HAVE TWO EVIDENCE RECORDS
    AND TWO COORDINATOR DECISIONS. This decision adjudicates that collision and records
    what the second wave measured. It does not adjudicate the first wave, which it has
    not read.

  decision: revise

  target_ids:
  - GOAL-MLKEM-005
  - BATCH-9e3584
  - EV-MLKEM-e45478
  - TASK-20260812-da8c3b
  - TASK-20260812-aadafd
  - TASK-20260809-3f1dc4
  - TASK-20260809-444fe7
  - TASK-20260809-60f9cc

  # ==================================================================
  # THE COLLISION AND ITS MECHANISM
  # ==================================================================
  collision:
    what_collided:
    - >-
      TWO EXECUTIONS OF ONE TASK CARD. TASK-20260809-3f1dc4 (validator) and
      TASK-20260809-444fe7 (red team) were each executed twice, by four different
      sessions, against the same committed producer snapshot c034ef38. Both wave-2
      sessions were told by the continuation queue in this worktree that both cards were
      `queued`; on the concurrent branch both read `completed`, with a completed_note
      dated 2026-08-11. Neither wave-2 session could see the other branch's queue.
    - >-
      TWO SETS OF BYTES CONTENDING FOR TWO PATHS.
      .../BATCH-9e3584/reviews/TASK-20260809-3f1dc4/validation_report.yaml and
      .../reviews/TASK-20260809-444fe7/red_team_report.md exist with DIFFERENT content on
      the concurrent branch, committed at 5004932a9.
    - >-
      TWO RECORDS CONTENDING FOR TWO RESERVED LEDGER IDENTIFIERS. EV-MLKEM-9346bb and
      DEC-20260809-afe29b are already bound on the concurrent branch. Writing this wave's
      evidence and decision under those identifiers would create two different immutable
      records under one id -- exactly what AGENTS.md rules 14 and 15 exist to prevent,
      discovered at merge time when neither can be renamed.
    mechanism_stated_precisely: >-
      TWO INDEPENDENT DEFECTS COMBINED, AND THEY ARE NOT THE SAME DEFECT. FIRST, AND
      PRIMARY: A RESERVED IDENTIFIER HELD IN A SHARED MUTABLE COORDINATION RECORD IS A
      SINGLE-WRITER RESOURCE HANDED TO EVERY WORKER THAT READS THAT RECORD.
      EV-MLKEM-9346bb and DEC-20260809-afe29b were minted ONCE, correctly and randomly,
      on 2026-08-09, and written into TASK-20260809-60f9cc's artifact_paths and
      archive.record_ids so that the batch would plan at all. From that moment they were
      not free identifiers awaiting allocation; they were a reservation, and every branch
      inheriting that queue inherited an instruction to use them. Rule 14's random
      6-hex tokens prevent two workers from independently minting the same id; they do
      NOTHING about two workers correctly executing the same reservation. That is a
      structural gap in the concurrency model, not a mistake by either session. SECOND,
      AND COMPOUNDING: `tools/allocate_id.py --check` REPORTED BOTH IDENTIFIERS FREE FROM
      THIS WORKTREE, because it scans the working tree and never other refs. So the one
      mechanical guard a Coordinator would reach for actively confirmed the wrong answer.
      The wave-2 Validator names both halves in F-7 and I adopt its account; the
      dispatching session independently confirmed the branch state with git plumbing.
    what_is_NOT_the_mechanism: >-
      Recorded because the wrong lesson is easy to draw here. This is not a random-token
      collision, not a `max+1` allocation, not an agent inventing an identifier, and not
      a failure of either wave-2 reviewer, both of whom did exactly what their cards
      required. Nor is it a defect of the concurrent branch, whose ledger archive the
      wave-2 Validator reports checking and finding CONFORMING ON ITS OWN TERMS: its
      declared set of 27 paths equals its commit's change set exactly, 0 extra and 0
      missing. Two correct executions of one instruction produced two correct records.

  # ==================================================================
  # THE RULING
  # ==================================================================
  ruling:
    what_this_wave_IS:
    - >-
      A SECOND, GENUINELY INDEPENDENT REVIEW WAVE OVER ONE PRODUCER SNAPSHOT, formed
      without reference to the first. The wave-2 Validator states that it discovered the
      other chain only at the end, while re-checking its own dependency's ancestry, that
      its verification was complete before the discovery, and that IT DID NOT OPEN THE
      OTHER VALIDATION REPORT -- it read only that blob's git metadata. The wave-2 Red
      Team reports no awareness of it at all. The dispatching session states it did not
      read the other branch's report bodies before these reviews ran. I have not read them
      either. THE VALUE OF THE SECOND WAVE IS EXACTLY THAT IT WAS FORMED WITHOUT REFERENCE
      TO THE FIRST, and that value is destroyed by any attempt to harmonise the two now.
    - >-
      ADMISSIBLE EVIDENCE, recorded as EV-MLKEM-e45478, scoped to what those two sessions
      measured. I verified validity before interpreting: expected run counts,
      schema-complete manifests, seed integrity, raw/summary agreement and control
      comparability are all recorded in that record's validity_verification block, along
      with two recorded minor manifest gaps and one infrastructure limitation.
    - >-
      A DUPLICATE EXECUTION OF TWO TASK CARDS, said plainly and not smoothed. The report
      bodies name TASK-20260809-3f1dc4 and TASK-20260809-444fe7 because those are the
      cards they executed. That text is TRUE and is not rewritten. What changed is where
      the bytes live.
    what_this_wave_is_NOT:
    - >-
      IT IS NOT A RESCORING, SUPERSESSION, ENDORSEMENT OR CONTRADICTION OF
      EV-MLKEM-9346bb, DEC-20260809-afe29b OR KN-FIND-2a35aa. Those three records are not
      on main, this session has not read their contents, and NO CONCLUSION HERE IS FORMED
      AGAINST OR IN SUPPORT OF THEM. That EV-MLKEM-9346bb and DEC-20260809-afe29b are not
      cited in this decision's evidence_refs is deliberate: a record I have not read is
      not evidence for anything I decide.
    - >-
      IT IS NOT A SECOND MODEL-LEVEL INDEPENDENCE BUDGET. All four reviewer sessions
      across both waves resolve to the same model. AGENTS.md rule 12 remains UNMET AND
      UNWAIVED in this goal. Two waves is two procedural samples of one model's judgement,
      and presenting it as more would be the exact over-read this program keeps recording
      against itself.
    - >-
      IT IS NOT AN ADJUDICATION OF ANY PRODUCER OUTCOME ROW ON MAIN. R-OUT-1 is neither
      admitted nor refused by this decision. What EV-MLKEM-e45478 records is that the
      G-VAR refusal is conditional on the frozen family, that the closure over the gate's
      refusal side was never demonstrated, and that Section B's single reported value does
      not survive replication as stated. Those are findings about instruments, at claim
      tier toy, and the concurrent chain reached its own adjudication of the same
      producers which I neither confirm nor deny.
    - >-
      IT DOES NOT TOUCH ledger/goals/GOAL-MLKEM-005.yaml. See branch_disposition below.
      The goal's next action is CARRIED IN THIS RECORD for the merger to apply.
    - >-
      IT DOES NOT PAUSE, CLOSE OR COMPLETE GOAL-MLKEM-005. The goal's pause_conditions are
      INFRASTRUCTURE-ONLY plus a user request; a coordination collision between two
      branches whose bytes are all intact, whose reviews all returned, and whose science is
      untouched is not one of them. A duplicate execution, an uncommitted artifact set and
      a queue that must be superseded are listed in this goal's non_terminal_conditions in
      substance if not in those words, and none may be cited in a decision that closes it.

  branch_disposition:
    ruling: ADDITIVE-ONLY. THIS BRANCH ADDS FILES AND MODIFIES NONE.
    files_this_branch_adds:
    - ledger/evidence/EV-MLKEM-e45478.yaml
    - ledger/decisions/DEC-20260812-15d3b2.yaml
    - coordination/goals/GOAL-MLKEM-005/batches/BATCH-9e3584/reviews-wave2/WAVE2-COORDINATOR-RECONCILIATION.md
    - the 30 review artifacts under .../BATCH-9e3584/reviews-wave2/ (1 validation report;
      1 red-team report; 28 probe files)
    - the wave-2 ledger archive's own receipt, at a path owned by a newly minted task id
    files_this_branch_must_NOT_modify:
    - >-
      ledger/goals/GOAL-MLKEM-005.yaml. THIS IS THE MOST IMPORTANT LINE IN THIS RECORD
      AFTER THE COLLISION RULING. The concurrent branch's ledger archive already edits
      that file. It is the one ledger file every campaign writes, CLAUDE.md records it as
      a standing conflict source, and an edit here would create a second unresolvable
      conflict on top of the identifier one -- for no gain, since the only thing the edit
      would carry is a next_action, which travels perfectly well inside this record. I
      considered editing it and REFUSE, and the refusal has a cost I state rather than
      hide: until the merger applies goal_next_action_to_apply below, the committed goal
      record will not name this wave, so a reader of the goal record alone will not know
      this branch exists. That cost is paid by this decision being cited in the merge
      commit and in the PR that carries it, and it is smaller than an unresolvable
      conflict in the record that steers the campaign.
    - >-
      ledger/evidence/EV-MLKEM-9346bb.yaml, ledger/decisions/DEC-20260809-afe29b.yaml,
      knowledge/findings/KN-FIND-2a35aa.md, and anything under
      .../BATCH-9e3584/reviews/. All exist with different content on the concurrent
      branch. Writing any of them here manufactures a conflict between two immutable
      records.
    - >-
      coordination/goals/GOAL-MLKEM-005/batches/BATCH-9e3584/dispatch_queue_continuation.json.
      The concurrent branch's 86ac7f72e already rewrote it (the wave-2 Validator reports
      13 insertions and 87 deletions against this worktree's copy). The wave-2 dispatch
      state goes in a NEW file at a new path instead, so the branch stays additive.
    - >-
      knowledge/INDEX.md. Generated and .gitignore'd; not written, not regenerated, not
      staged.
    - >-
      Any shard conversion of the goal record. tools/shard_goal.py is NOT run: a
      flat-file-to-directory conversion is itself a structural conflict against the
      concurrent branch, on top of everything else.

  # ==================================================================
  # RATIONALE
  # ==================================================================
  rationale:
  - >-
    THE COLLISION IS A COORDINATION FAILURE AND NOT AN EVIDENCE FAILURE, AND THE TWO MUST
    NOT BE CONFLATED. Every byte is intact. The producer snapshot is committed and
    content-verified 30 for 30 -- now by two more independent sessions, each checking the
    blobs at the declared commits and not merely the working tree. Both wave-2 reviews
    ran to completion inside budget. What went wrong is that a mutable coordination record
    handed one reservation to two workers. AGENTS.md states in terms that the dispatch
    queue "is a coordination record, not evidence"; the same distinction that let the
    2026-08-11 adjudication refuse to pause the goal applies here, and I apply it the same
    way.
  - >-
    THE INSTRUMENT REQUIRED BY AGENTS.md RULE 4 FOR A CONFLICT INSIDE AN IMMUTABLE
    ARTIFACT IS A NEW RECORD UNDER A NEW ID, NEVER AN EDIT THAT PICKS A SIDE. Applying
    that rule mechanically gives this branch's whole shape: fresh task slots
    (TASK-20260812-da8c3b, TASK-20260812-aadafd), fresh ledger identifiers
    (EV-MLKEM-e45478, DEC-20260812-15d3b2), fresh paths (reviews-wave2/), and not one byte
    written to a path the other branch occupies. The wave-2 Validator reached the same
    prescription independently in F-7 and in its own what_would_change_this_verdict field.
  - >-
    THE REPORTS' OWN TEXT IS NOT REWRITTEN, AND THAT IS THE POINT RATHER THAN AN
    OVERSIGHT. Both reports internally name the cards they executed and declare
    artifact_paths under the old directories. Editing that text to make the record tidier
    would erase the fact that a duplicate execution occurred, which is the single most
    useful thing this batch teaches. The stale path declarations are recorded as a mapping
    in EV-MLKEM-e45478.review_artifacts.path_mapping and in the reconciliation note, and
    the archive declares the paths where the bytes actually are.
  - >-
    THE SECOND WAVE IS WORTH ARCHIVING ON ITS MERITS, INDEPENDENTLY OF THE COLLISION. It
    produced four controls the batch did not contain -- a nearby family that flips G-VAR
    from 38 of 38 to 0 of 38, a perturbation of relative size about 1e-10 that G-VAR
    admits while it walks both relevance clauses, effect-free 8x4 null tables for two
    statistics that had none, and the centered ladder Section C2 deferred -- plus an
    8-replicate dispersion estimate for a statistic reported from a single draw, plus an
    independently seeded null family. Three of those bound a headline and one vindicates a
    producer against the reviewer's own prior. Discarding this wave because it collided
    would discard measurements, which no coordination defect justifies.
  - >-
    THE VALIDATOR'S `passed` IS ADMITTED AT EXACTLY ITS STATED MEANING AND NOT ONE STEP
    FURTHER. It means the four producer receipts are admissible evidence; the reviewer
    itself states it adjudicates no outcome row, retires nothing, rescores nothing and
    bears on nothing about ML-KEM. Its seven findings are defects of reporting,
    disclosure, citation hygiene and coordination, and the reviewer reports verifying
    individually that not one of them moves a number, a threshold or a verdict -- with the
    single material numeric correction, F-1's 4.87x to 31.03x, recorded as a binding
    boundary so the false range cannot be re-cited.
  - >-
    THE ADVERSE FINDINGS ARE CREDITED BECAUSE BOTH REVIEWERS AUDITED THEIR OWN
    COULD-NOT-FAIL ARRANGEMENTS AND BOTH REPORTED AGAINST THEMSELVES. The Red Team's audit
    fired three times against its own thesis -- Section C2's diagnosis is right, Section
    B's substantive verdict survives, and every Coordinator git claim it could check is
    true -- and it disclosed post-hoc provenance for two of seven probes in the probes'
    own docstrings. The Validator named in advance the six outcomes that would have forced
    `failed` and reports none occurring, and secured the other direction with a negative
    control its own instrument cleanly refuses. That conduct is why RT-R1, RT-R3, RT-B1
    and RT-C1a/b are recorded as findings rather than discounted as an adversary's framing.
  - >-
    fpylll'S ABSENCE IN BOTH SESSIONS IS INFRASTRUCTURE SIGNAL AND IS RECORDED AS COVERAGE
    LOST, NEVER AS COUNTEREVIDENCE. lam1n and hkz were not independently re-derived by
    either reviewer, so the reduction-dependent rows of this batch rest on the producer
    plus a review measurement from a previous batch. Both reviewers price the fix at one
    install plus about 20 s of reduction at d <= 40 and both name it the cheapest unclosed
    check in the wave. Nothing is inferred from the gap in either direction.
  - >-
    NO OFFICIAL TRANSITION IS MADE FROM UNCOMMITTED ARTIFACTS. At the moment this record is
    written the 30 wave-2 review artifacts, this decision and EV-MLKEM-e45478 are all
    uncommitted -- PD-4 in its sharpest recorded form, since a DIFFERENT review set is
    already committed at the paths these were originally declared at. Nothing here is
    durable or official until the wave-2 ledger archive commits it, the post-commit
    verifier accepts it, and the branch is pushed with a PR against main naming every new
    record.

  # ==================================================================
  # RECONCILIATION: THE CONCRETE ACTION FOR WHOEVER MERGES THESE CHAINS
  # ==================================================================
  reconciliation_action_for_the_merger:
    principle: >-
      BOTH CHAINS ARE VALID AND NEITHER IS DELETED, RENAMED OR EDITED. After merge, main
      carries two evidence records and two Coordinator decisions over one producer
      snapshot, plus two review waves and one knowledge entry. That is the honest state
      and it must be visible rather than smoothed into one.
    ordered_steps:
    - >-
      1. MERGE, NEVER REBASE, IN BOTH DIRECTIONS. Both branches carry pushed archive
      commits whose receipts bind by content; a rebase makes recorded shas unreachable.
      Merge origin/main into each branch, run tools/validate_ledger.py on each merged
      tree, and require merge commits on main (squash and rebase merging disabled in
      repository settings, per CLAUDE.md).
    - >-
      2. EXPECT NO FILE-LEVEL CONFLICT EXCEPT WHERE THE OTHER BRANCH TOUCHES SHARED FILES.
      This branch modifies nothing. The concurrent branch modifies
      ledger/goals/GOAL-MLKEM-005.yaml and dispatch_queue_continuation.json; those are its
      edits to carry, and this branch contests neither.
    - >-
      3. DO NOT RUN TASK-20260809-60f9cc ON THIS BRANCH, EVER. It is already `completed`
      against commit 5004932a9 on the concurrent branch, so a second execution is a third
      instance of this same collision. Independently, as declared in this worktree's
      continuation queue it owns four artifact_paths and names sources
      [TASK-20260809-3f1dc4, TASK-20260809-444fe7], whose artifact_paths point at two
      files that DO NOT EXIST here -- so its expected binding set would name two absent
      paths and omit all 30 present ones, reproducing defect D3 exactly. The wave-2
      archive is a NEW task under a NEWLY MINTED handoff id; see next_actions step 1.
    - >-
      4. DO NOT RE-MINT EV-MLKEM-9346bb OR DEC-20260809-afe29b ANYWHERE. They are bound on
      the concurrent branch. This chain uses EV-MLKEM-e45478 and DEC-20260812-15d3b2 and
      claims no share of the reservation.
    - >-
      5. THE COMPARISON OF THE TWO WAVES IS A NEW COORDINATOR DECISION UNDER A NEW ID, MADE
      AFTER THE MERGE BY A SESSION THAT HAS READ BOTH. It must state, at minimum: which
      findings the two waves reached in common (a genuine two-sample agreement of one
      model, and worth having as that and not more); which are unique to each; whether the
      two waves' verdicts agree; and whether DEC-20260809-afe29b's "R-OUT-1 STANDS" and its
      AM-15/AM-16 amendments survive contact with this wave's RT-R1 (the G-VAR refusal is
      conditional on the frozen family) and RT-R3 (only the PASS side was shown vacuous).
      IT SUPERSEDES BY REFERENCE AND EDITS NOTHING. If it concludes that one wave's reading
      is wrong, the instrument is a superseding record, never a correction to either.
      THIS COMPARISON IS THE SINGLE MOST INFORMATIVE THING ANYONE CAN DO WITH THESE TWO
      CHAINS, and it is deliberately not attempted here, because a Coordinator who has read
      only one wave cannot make it and a wave-2 formed with reference to wave-1 would not
      have been worth comparing.
    - >-
      6. ONE batch_log ENTRY FOR BATCH-9e3584, NOT TWO, naming BOTH decisions, BOTH
      evidence records, both review waves and both snapshot commits, written by the
      merger's superseding decision. Two entries for one batch would misrepresent the batch
      as two.
    - >-
      7. PRESERVE EXACTLY ONE next_action ON THE GOAL RECORD. Apply
      goal_next_action_to_apply below if the merger endorses this chain's reading, or the
      concurrent chain's if it endorses that one, or a synthesis under its own new
      decision -- but exactly one, and never both appended.
    - >-
      8. FILE THE TWO MECHANISM DEFECTS. (a) A reserved identifier in a shared mutable
      coordination record is a single-writer resource handed to N workers; the plausible
      fixes are to bind the reservation to the branch that will execute it, or to mint the
      ledger identifiers AT ARCHIVE TIME rather than at queue-drafting time, which requires
      tools/research_dispatch.py to stop rejecting a ledger archive that owns no path under
      ledger/evidence and ledger/decisions until it runs. (b) `tools/allocate_id.py --check`
      answers from the working tree only and reported both reserved identifiers FREE, so
      the one mechanical guard confirmed the wrong answer; the plausible fix is to consult
      all refs, or at minimum to print that its answer is worktree-scoped. Both need their
      own program-defect identifiers, which this session cannot mint (no shell), and both
      are prospective: NEITHER MAY BE USED TO RETRO-VALIDATE OR INVALIDATE EITHER CHAIN.

  goal_next_action_to_apply:
    note: >-
      CARRIED HERE FOR THE MERGER TO APPLY TO ledger/goals/GOAL-MLKEM-005.yaml. This branch
      does not write the goal record. Exactly one next action, as the goal record requires.
    text: >-
      RECONCILE THE TWO BATCH-9e3584 REVIEW CHAINS FIRST, THEN RE-SCORE G-VAR ON THE FIBRE
      FAMILY BEFORE ANY SUCCESSOR SPENDS COMPUTE ON CANDIDATE OBSERVABLES. Step one is a
      new Coordinator decision, made after merging origin/claude/ml-kem-solution-ckdxmg and
      this chain into main by a session that has read BOTH review waves, comparing
      EV-MLKEM-9346bb / DEC-20260809-afe29b / KN-FIND-2a35aa against EV-MLKEM-e45478 /
      DEC-20260812-15d3b2, stating which findings are common and which are unique, and
      superseding by reference without editing either. Step two, gated on step one and
      dispatched as the successor batch's lead: RE-SCORE G-VAR ON A FAMILY CONSTRUCTED TO
      HOLD EACH CANDIDATE'S OWN DECLARED ARGUMENT FIXED -- the fibre condition named in
      RT-R1 -- and record the result as a versioned amendment to the G-VAR clause. The
      wave-2 Red Team's probe_gvar_family.py is the working template and it costs 0.24 s
      per candidate at d <= 140 with no reduction. UNTIL THAT CLAUSE IS RESTATED, NO
      "REPAIRED GATE" MAY BE BUILT ON G-VAR, AND NO ADMISSIBILITY CLAIM MAY BE MADE FROM A
      GATE WHOSE REFUSAL SIDE HAS ALSO NEVER BEEN TESTED. Pre-register in the same batch,
      behind that lead and structurally gated so they cannot displace it, the two cheap
      items this wave leaves owed: the FALSE-REFUSAL CONTROL (one observable informative by
      construction and structurally refused -- e.g. a statistic over the leading k raw-GSO
      log-norms, which depends on A and k but takes no beta argument, minutes of numpy, one
      QR per basis, no reduction), and an fpylll-EQUIPPED replication of the L7/L8 arm,
      which is the cheapest unclosed check in this wave at one install plus about 20 s of
      reduction at d <= 40. BINDING CARRIES INTO THAT BATCH: claim tier stays TOY; AM-10
      through AM-14 of DEC-20260808-05b684 and their carries are in force and not
      re-litigated; AM-3 IS NOT RETIRED; BATCH-a44d08 is NOT rescored in any respect; the
      BATCH-cbe023 non-citable carries stand unchanged; and "a factor of 6 to 31" is
      corrected to 4.87x to 31.03x and the false range may not be re-cited.
    single_next_action_check: >-
      This is ONE action with a gating precondition, not two. The reconciliation is not
      separable from the science step, because a successor that re-scores G-VAR without
      knowing whether the concurrent chain's AM-15/AM-16 already amended the clause would
      be amending an instrument twice under two identifiers -- the same collision one level
      up.

  # ==================================================================
  # EVIDENCE
  # ==================================================================
  evidence_refs:
  - ledger/evidence/EV-MLKEM-e45478.yaml
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-9e3584/reviews-wave2/TASK-20260812-da8c3b/validation_report.yaml
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-9e3584/reviews-wave2/TASK-20260812-aadafd/red_team_report.md
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-9e3584/reviews-wave2/TASK-20260812-aadafd/probes/
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-9e3584/reviews-wave2/WAVE2-COORDINATOR-RECONCILIATION.md
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-9e3584/COORDINATOR-ADJUDICATION-20260811.md
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-9e3584/archives/TASK-20260809-91cf76/COORDINATOR-DEFECT.md
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-9e3584/archives/TASK-20260809-4d928d/COORDINATOR-DEFECT.md
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-9e3584/tasks/TASK-20260809-4011dd/prereg.md
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-9e3584/dispatch_queue_continuation.json
  - ledger/decisions/DEC-20260808-05b684.yaml
  - ledger/evidence/EV-MLKEM-9b8f7f.yaml
  evidence_refs_note: >-
    DELIBERATELY ABSENT: ledger/evidence/EV-MLKEM-9346bb.yaml,
    ledger/decisions/DEC-20260809-afe29b.yaml and knowledge/findings/KN-FIND-2a35aa.md.
    They exist only on origin/claude/ml-kem-solution-ckdxmg, this session has not read
    their contents, and a record I have not read is not evidence for anything I decide.
    They are NAMED throughout this decision as objects to be reconciled, which is a
    different thing from being cited as grounds. The probes/ directory is listed as a
    directory here for readability; the archive must declare all 28 probe paths expanded,
    one per entry.

  # ==================================================================
  # LIMITATIONS
  # ==================================================================
  limitations:
  - >-
    CLAIM TIER TOY, UNCONDITIONALLY. Nothing in this decision or in EV-MLKEM-e45478 bears
    on ML-KEM security, on any FIPS 203 parameter set, on any attack cost, or on any cost
    model. No number is transported to beta = 606, d = 1420, or any other parameter set by
    extrapolation, by analogy, or by any other route.
  - >-
    I RAN NO GIT COMMAND, NO PRODUCER CODE AND NO PROBE. I hold no shell in this session.
