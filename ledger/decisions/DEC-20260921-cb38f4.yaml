  the_decision_stated_plainly: >-
    RUN-FROB-a91f4c's interruption is diagnosed, honestly and without
    fabrication, as the SAME failure mode that destroyed RUN-FROB-39714f,
    RUN-FROB-f3e2a3, RUN-FROB-16ecb6, RUN-FROB-5490f1, RUN-FROB-0b1c8e,
    RUN-FROB-5fa3f0, and RUN-FROB-35c3b1: a whole-environment/container
    restart external to any script's own control, external to any timeout
    wrapper (there was none this time either), and external to any code
    defect in driver-v2.py/checker-v2.py. This is now the EIGHTH,
    CONSECUTIVE instance of the identical infrastructure failure mode under
    the same, already-corrected source and launch procedure, launched
    correctly by the dispatching session every time. Unlike RUN-FROB-35c3b1
    (this lane's longest-surviving attempt, ~37 minutes), RUN-FROB-a91f4c
    survived only approximately 3-4 minutes -- back down near the shorter
    end of this lane's observed range. The full observed interval sequence
    is now ~20, 11, 9, 7, 4, 5, 37, and now ~3.5 minutes. DEC-20260921-4c0016
    already corrected the framing carried by its own predecessors to
    "highly variable, ranging at least ~4-37 minutes, no confirmed upper
    bound or distributional shape" once the seventh point broke a
    previously-stated 4-20 minute range by nearly 2x. This eighth point does
    NOT repeat that pattern of range-breaking: it sits close to, and
    marginally below, the previously observed low end (~4 minutes), and is
    consistent with, not a further correction of, DEC-20260921-4c0016's own
    "highly variable" framing. This coordinator does not manufacture a new,
    more-precise-sounding distributional claim from this eighth point --
    doing so in either direction (declaring the range "confirmed" now that
    a point fell inside it, or declaring a new narrower band) would overstate
    what eight points from an externally-imposed, uncontrolled restart
    process can support. The honest statement this record makes is: the
    restart interval remains HIGHLY VARIABLE, observed so far in
    approximately the 3.5-to-37-minute range, and reading all eight points in
    sequence (20, 11, 9, 7, 4, 5, 37, 3.5) shows NO EVIDENCE of any monotonic
    trend in either direction -- the sequence falls for five consecutive
    points, then rises for two, then falls again. This is consistent with
    noise around a wide, currently-uncharacterized distribution and gives no
    basis to prefer "shrinking," "growing," "stabilizing," or any other
    directional narrative. Like all eight interruptions themselves, this
    characterization -- however stated -- remains infrastructure signal,
    never negative mathematical evidence (AGENTS.md core rule 3 / CLAUDE.md
    rule 3), and this record does NOT condition its own authorization on any
    reading of it. None of the eight says anything about H-FROB-73df22. On
    that basis, this coordinator (1) preserves RUN-FROB-a91f4c's directory
    exactly as it stands -- its real partial roots.jsonl.gz (28383898 bytes,
    sha256 a6ce8e6527a104f663eacedbb66aa7e6473508305ad5340e149eeb68953d75d0)
    and the three further hashed files, the three confirmed-empty files
    (stderr.log, stdout.log, tuples.jsonl.gz), with no execution-receipt.json
    authored for it, because the absence of one IS the honest record of what
    happened, not a gap to be papered over -- and (2) authorizes a fresh
    retry under a fresh, coordinator-proposed (NOT yet allocate_id.py-
    confirmed) run_id, RUN-FROB-e6c204, via a fresh trial-plan-stage0-v12.json,
    a fresh run-binding, and a fresh launch handoff to the Executor
    (TASK-20260921-b18586), per the user's standing instruction to keep
    retrying automatically through this exact failure mode.

  rationale:
    - >-
      EIGHTH, CONSECUTIVE INSTANCE OF THE SAME FAILURE MODE, STILL
      INFRASTRUCTURE/PROTOCOL SIGNAL, NEVER NEGATIVE MATHEMATICAL EVIDENCE,
      PER AGENTS.md CORE RULE 3 / CLAUDE.md RULE 3. RUN-FROB-a91f4c is not a
      new, distinct failure mode; it is a REPEAT of RUN-FROB-39714f's,
      RUN-FROB-f3e2a3's, RUN-FROB-16ecb6's, RUN-FROB-5490f1's,
      RUN-FROB-0b1c8e's, RUN-FROB-5fa3f0's, and RUN-FROB-35c3b1's own
      whole-environment-restart mode -- entire process tree destroyed,
      including the Python supervisor that would have written
      execution-receipt.json, before that supervisor's own
      completion/receipt-writing logic could run at all. This is the TENTH
      interruption overall in this lane's history and the EIGHTH consecutive
      occurrence of the identical infrastructure failure mode under the
      same, already-corrected source and launch procedure. Eight-for-eight
      launch attempts under driver-v2.py/checker-v2.py have now been killed
      by whole-environment restarts, all non-scientific, non-protocol
      infrastructure signal. None of RUN-FROB-a91f4c, RUN-FROB-35c3b1,
      RUN-FROB-5fa3f0, RUN-FROB-0b1c8e, RUN-FROB-5490f1, RUN-FROB-16ecb6,
      RUN-FROB-f3e2a3, or RUN-FROB-39714f says anything about H-FROB-73df22,
      RQ-FROB-7d8dd4, or whether Frobenius structure moves the index-calculus
      exponent.
    - >-
      HONEST, DELIBERATELY UNCHANGED CHARACTERIZATION OF THE INTERVAL
      SEQUENCE -- THIS POINT DOES NOT FORCE A THIRD RE-FIT. DEC-20260921-4c0016
      corrected its own predecessor's "noisy/stochastic, roughly 4-20 minute"
      framing to "highly variable, at least ~4-37 minutes, no confirmed upper
      bound or distributional shape" once the seventh point (~37min) broke
      that range's upper bound by nearly 2x. This eighth point (~3.5min) is
      different in kind from the seventh: it does not break either bound of
      the already-corrected framing dramatically -- it sits close to, and
      only marginally below, the low end already observed (~4min, from
      RUN-FROB-0b1c8e). Faced with a data point that is CONSISTENT with the
      immediately preceding honest characterization rather than one that
      falsifies it, this record does not manufacture a new, falsely-precise
      claim in either direction. It would be equally dishonest to declare the
      "~4-37 minute" range now "confirmed" (eight points, drawn from a
      process this lane has no control over, still cannot establish a
      confirmed distributional shape or upper bound) as it would be to
      declare a new, narrower pattern. The honest statement, on eight points
      (~20, 11, 9, 7, 4, 5, 37, 3.5 minutes), is: the restart interval
      remains HIGHLY VARIABLE, observed so far in roughly the 3.5-to-37-minute
      range (a small, honest widening of the low end by about half a minute,
      nothing like the seventh point's near-doubling of the upper bound),
      and READING THE FULL SEQUENCE IN ORDER SHOWS NO EVIDENCE OF ANY
      MONOTONIC TREND: five consecutive falls, then two rises, then a fall
      again. This directly supports "noisy, non-monotonic" over any
      directional narrative (shrinking, growing, or stabilizing), and this
      record states exactly that and no more. This correction changes no
      authorization in this record: like the eight interruptions themselves,
      the interval sequence, under any of its framings, remains
      infrastructure signal only, never negative mathematical evidence, and
      this record does not condition RUN-FROB-e6c204's authorization on any
      reading of it.
    - >-
      NO FABRICATED RECEIPT. This decision does NOT author an
      execution-receipt.json for RUN-FROB-a91f4c, and does not construct,
      estimate, or infer one from the partial roots.jsonl.gz or from what a
      graceful interruption receipt would ordinarily contain. Per AGENTS.md
      core rule 5 ("Never fabricate commands, outputs, timings, statistics,
      citations, or runs. Missing data stays missing and is reported as
      such."), the honest record of RUN-FROB-a91f4c is exactly what is on
      disk: real partial output (roots.jsonl.gz, 28383898 bytes, sha256
      a6ce8e6527a104f663eacedbb66aa7e6473508305ad5340e149eeb68953d75d0),
      three further hashed adapter/launch files (command.txt,
      environment.json, launch.json), three confirmed-empty files
      (stderr.log, stdout.log, tuples.jsonl.gz -- all the well-known
      empty-file sha256), and a documented absence of every downstream
      adapter/checker artifact, because the process that would have produced
      them was destroyed before it could run. RUN-FROB-a91f4c's directory, as
      it stands right now, is preserved as-is by this decision. No file
      within it is edited, completed, or backfilled by this record.
    - >-
      THE RUNTIME LOCK BEING CITED REMAINS THE SAME, STILL-CURRENT, STILL-
      UNEDITED, LAUNCH-AUTHORIZED LOCK. This coordinator independently
      re-read linux-runtime-lock-successor-20260914-c85f6a.json in full in
      this engagement and reconfirms scientific_launch_authorized: true and
      its content sha256
      46d918a1a4b9d358df39f09a87d5221128cc1ce19cb62672bc35204785952eb5,
      cross-checked against trial-plan-stage0-v11.json's own and
      run-binding-stage0-v11-retry-20260921.json's own already-filled
      runtime_lock_sha256 fields (all agree). Nothing about the runtime, its
      guards, or its authorization changes here; an eighth whole-machine
      restart is not evidence the runtime lock's own guards were inadequate
      -- the failure is again a whole-machine restart, a class of event no
      per-process guard in linux-runtime-lock-successor-20260914-c85f6a.json
      claims to protect against, and this record does not construct a new
      claim that it does.
    - >-
      WATCHDOG SIZING RATIONALE REMAINS VALID, UNCHANGED. No run in this
      lane has ever shown signs of hanging or needing a shorter or longer
      watchdog; all ten interruptions observed to date have each been
      either an instant application-level error, an external interruption
      from this lane's own now-corrected tooling, or (eight times now) an
      infrastructure restart external to any process's own control -- never
      a hang. RUN-FROB-a91f4c itself was still progressing normally (its
      roots.jsonl.gz was real and growing) at the moment it was destroyed,
      at ~3-4 minutes -- far short of the 86400s watchdog ceiling. 86400
      seconds remains sized generously above the only real duration signal
      available and remains a ceiling meant never to bind in the normal
      case, machine protection only per CLAUDE.md "Research budgets: progress
      first."
    - >-
      DIRECTION CHECK, unchanged from the whole DEC-20260909-bf5b48 ..
      DEC-20260921-4c0016 chain. Stage0 is not itself exponent-moving; it is
      the correctness gate for H-FROB-73df22's two arms. No scientific claim
      of any kind is advanced by this admission/retry-authorization record.
      FROB is a declared ECC area (orchestration/research-priority.yaml line
      79), ranked ahead of non-ECC candidates at every selection point, with
      unlimited batch/wall-clock budget per AGENTS.md "ECC comes first."
    - >-
      BUDGET. Per CLAUDE.md "Research budgets: progress first" (2026-09-06):
      research cost estimates are advisory and require no repeated user
      approval; the Coordinator continues justified work within the
      authorized research scope. No 90-day stagnation review is active or
      warranted -- this lane has shown continuous documented progress across
      DEC-20260909-bf5b48 through DEC-20260921-4c0016 and now this record,
      all within roughly two weeks, including eight genuine, correctly-
      executing partial runs each destroyed only by infrastructure external
      to this program's own control. Authorizing a further retry after an
      eighth, consecutive infrastructure-only interruption is exactly the
      kind of routine continuation CLAUDE.md's "progress first" instruction
      protects, not a new spending decision requiring fresh justification.
      This is additionally, and explicitly, covered by the user's own
      standing instruction, relayed by the dispatching session, to keep
      retrying automatically through this exact recurring failure mode --
      stated multiple times already. This coordinator's role is to execute
      that instruction faithfully via a proper decision record, not to
      second-guess it. A whole-machine restart mid-run is squarely within
      "watchdog expiry checkpoints a task; it does not exhaust the
      campaign."
    - >-
      NON-BLOCKING DIAGNOSTIC OBSERVATION -- ORCHESTRATING SESSION'S OWN
      CONTEXT RESETS, REPORTED_BY_SESSION, NOT INDEPENDENTLY CONFIRMED. The
      dispatching session has additionally reported, for this record's own
      awareness, that its own top-level orchestrating session has itself
      observed apparent working-directory/environment context resets (via
      its own harness system messages) at approximately the same moments as
      several of these trial-environment restarts, including one instance
      between a PR merge and the next claim+launch where no trial was
      running at that exact moment. This coordinator has no means to verify
      this independently -- it has no visibility into the orchestrating
      session's own harness state, no shell, and did not itself observe any
      restart. This is recorded honestly as a PLAUSIBLE DIAGNOSTIC CLUE
      (consistent with the trial subprocess and the orchestrating session
      sharing the same underlying host/VM being restarted), explicitly NOT
      asserted as a confirmed root cause, and does not change this record's
      diagnosis of RUN-FROB-a91f4c's interruption as infrastructure signal
      only, nor does it add, weaken, or condition any launch authorization
      here. It is folded into NA-4's outstanding, non-blocking
      infrastructure-diagnosis recommendation below as further input for
      that future investigation, not as a new gate.
    - >-
      NA-4's INFRASTRUCTURE-DIAGNOSIS RECOMMENDATION REMAINS OUTSTANDING AND
      IS REAFFIRMED, NOT RE-OPENED AS A NEW GATE. DEC-20260921-1988f5's own
      NA-4, reaffirmed by DEC-20260921-0ddc5f and DEC-20260921-4c0016,
      recommended, non-blockingly, that the dispatching session open a
      dedicated infrastructure-diagnosis task once the five-for-five trigger
      DEC-20260921-fd5bf1 itself named was met. This record has not been
      told, and does not assume, that this diagnosis task has been opened,
      run, or completed; nothing in the materials reviewed for this record
      reports its status. An eighth consecutive instance of the identical
      failure mode -- now including the orchestrating session's own reported
      context-reset observation above -- is further, unambiguous
      reinforcement that this diagnosis remains worth pursuing, and this
      record reaffirms it rather than re-litigating or escalating it into a
      new condition -- it still runs in PARALLEL with, and never blocks, the
      retry authorized here.

