  required_proof_controls:
    first_mutation: >-
      Instantiate RT-226-C1: preprocess known constant encodings, retain exact
      recognition state, discard handle objects, and decide whether every
      retained record still contributes to P. If not, construct the
      success-set violation of equation (1); if yes, serialize the definition.
    advice_state: >-
      Require external advice independent of the random injection and count
      every retained encoding/equality-recognition record in P, or add
      preprocessing-query and advice-state terms and redo the coupling.
    symbolic_game:
      - Fix a symbolic transcript and its coins independently of alpha.
      - Enumerate equality and raw-encoding-dependent branches.
      - Form the exact union of collision roots and output-agreement roots.
      - Require an oracle-issued output handle or add an encoding-guess term.
    cost_boundary:
      - Retain the q_g+1 online-label boundary in preprocessing cross terms.
      - Split rebuild-each-attempt from reuse-once retry rows.
      - Use not_applicable for non-ECDLP-solver SOTA fields.
      - Record peak memory and data/query movement separately.
      - Recompute Pareto dominance piecewise.
