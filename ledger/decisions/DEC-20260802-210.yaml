  rationale:
    - >-
      RT-226-F1 is a proof-model defect, not an experiment result: charging
      advice in C_pre cannot validate a success inequality with no advice term,
      so the theorem must be repaired by definitional closure before retention.
    - >-
      The standard-model reconstruction (affine closure, fixed transcript,
      q_g+1 boundary, exact root union, degree-d bound, truncation) survived
      RT-226, so one bounded proof-repair successor is cheaper than any
      experiment and decides whether the constant-excess candidate survives.
    - >-
      The Pareto schema defects (RT-226-R1..R5) are deterministic and
      correctable in the same repair.
    - >-
      Cheon auxiliary-input DLP and generalized nonlinear-target generic
      hardness are prior art, so repairing this package cannot establish
      novelty or a breakthrough.
