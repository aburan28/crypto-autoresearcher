coordinator_decision:
  id: DEC-20260828-5a3566
  recorded_at: '2026-08-28'

  target_ids:
    - DEC-20260828-5a3566
    - GOAL-HAWK-001
    - BUDGET-AMEND-20260828-5a3566

  decision: expand
  decision_label: fund_all_active_goals_standing_always_run_by_user_authorization

  context: >-
    On 2026-08-28, after a weekly findings summary that named several goals
    stalled or capped on budget, the user gave the direct instruction "Fund
    every goal". Asked to pin the scope among (a) the budget-stalled goals
    only, (b) all active goals, or (c) every goal record, the user selected
    "All 47 active goals". This decision is one of 47 identical-in-form
    records, one per goal active on origin/main at commit 49f2868f2, and
    follows the per-goal precedent DEC-20260828-f65ce9 (GOAL-ECDLP-001,
    "always run and no batch limits"). At the time of this decision GOAL-
    HAWK-001 carried status active with campaign_budget.maximum_batches = 7
    and total_wall_clock_seconds = 10800; current_batch_id BATCH-d44912. On
    this record: both fields held finite values.

  user_authorization: >-
    RECORDED BY THE COORDINATOR, NOT A SELF-GRANT. Verbatim user instruction,
    2026-08-28: "Fund every goal"; scope selection, verbatim: "All 47 active
    goals". Operative parts: (1) NO BUDGET STOP --
    campaign_budget.maximum_batches and
    campaign_budget.total_wall_clock_seconds are set to null, the schema's own
    unbounded representation; (2) ALWAYS RUN -- GOAL-HAWK-001 is a standing
    goal, kept active and never paused, closed_at_budget, or retired on budget
    grounds. The Coordinator records this authorization; it is the user's.

  decision_scope: >-
    STRICTLY, on ledger/goals/GOAL-HAWK-001.yaml:
    campaign_budget.maximum_batches (7 -> null) and
    campaign_budget.total_wall_clock_seconds (10800 -> null), each with an
    adjacent status note naming this amendment; one budget_amendments entry
    (BUDGET-AMEND-20260828-5a3566); the standing_directive_always_run_20260828
    field (added only if absent); and updated_at. NOTHING ELSE MOVES:
    max_concurrent, every completion criterion, every pause condition's non-
    budget clauses, the entire next_action text (deliberately NOT superseded,
    unlike the ECDLP-001 precedent, so that every scientific admission gate
    remains verbatim), current_batch_id custody, active_hypothesis_ids, every
    hypothesis status, claim tier, checkpoint, evidence record, and every
    prior budget amendment or status note. The status value stays active, so
    no status_value_history entry is added.

  standing_directive: >-
    (1) NO BUDGET STOP: with both budget fields null, the budget clause of any
    pause condition can no longer fire, and no further budget amendment is
    ever required to admit a batch. (2) ALWAYS RUN: on each harness wake the
    goal is servable and is kept active; it is never paused, closed_at_budget,
    or retired on budget grounds. (3) SCIENTIFIC GATES ARE UNCHANGED: funding
    removes budget as a stop condition; it does not remove any admission gate,
    review requirement, falsification criterion, or completion criterion, all
    of which stand as written in the goal record. A candidate's failure to
    meet a gate is recorded as not-intake-ready and never treated as
    mathematical evidence. (4) POLICY-RESOLUTION BLOCKS DO NOT PAUSE THE GOAL:
    where a required exact model policy cannot be resolved and fallback is
    forbidden, only the specific claim-level work requiring that policy is
    blocked; the campaign continues on resolvable work (DEC-20260822-badc59
    precedent). (5) DURATION: the directive stands until the user withdraws
    it, a completion criterion is met, or the goal is closed by a fresh
    Coordinator decision on its own evidence.

  what_this_decision_does_not_do:
    - It does not open any batch, authorize any run, dispatch any task, or select this goal ahead of any other; goal ordering on wake is unchanged except that budget can no longer exclude it.
    - It does not move any hypothesis status, claim tier, completion criterion, or result, and it reframes no quarantined, confounded, or infrastructure-failed finding.
    - It does not edit or retract any prior budget amendment, status note, or accounting note; superseded finite values remain recorded verbatim beside the new null.
    - It does not reopen any goal that is not active (paused, blocked, closed_at_budget, completed, draft records are untouched by this and its 46 sibling decisions).

  non_claims:
    - An uncapped campaign is not a stronger result and supplies no reason to admit a candidate that fails a frozen gate.
    - No asymptotic-complexity claim is advanced and no promotion gate is engaged.
    - Removing a wall-clock ceiling does not assert that any previously recorded wall-clock accounting was satisfied, unevaluable, or exceeded; those notes stand as written.

  evidence_refs: []

  limitations:
    - This decision authorizes no research, experiment, run, or batch opening. It changes the named fields on exactly one goal record and nothing else.
    - The standing directive binds Coordinator selection and pause behaviour only; it confers no authority on any subagent and cannot be cited to waive a review requirement, an admission gate, or a falsification criterion.
    - Because it was applied uniformly to 47 goals in one session, it carries no per-goal scientific rationale; any goal whose next_action already names a non-budget blocker (a human input, an unresolvable policy, an unmet gate) remains blocked on that item exactly as before.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      An administrative budget uncap and standing selection directive for one
      goal; no empirical or theoretical evidence is produced or reviewed by
      this decision.

  next_actions:
    - Project the amendment on ledger/goals/GOAL-HAWK-001.yaml as described in decision_scope.
    - On the next harness wake, treat GOAL-HAWK-001 as budget-unbounded; open a batch only when its existing next_action gate is met by a concrete candidate.

  decided_by: coordinator
  decided_at: '2026-08-28'
  decision_authority: >-
    The authority to uncap the budget and make the goal standing is the
    user's, exercised by direct instruction this session ("Fund every goal",
    scope "All 47 active goals"). The Coordinator recorded this authorization;
    it did not make it.

  inference_provenance:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: claude-sonnet-5
    model_verified: false
    fallback_used: false
    fallback_reason: null
    degraded_requirements: []
