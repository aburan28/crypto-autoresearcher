  recorded_by_task: TASK-20260804-162
  archived_by: TASK-20260804-164
  context: >-
    BATCH-110: Stock-take + BKK speedup measurement. BKK factor-2 gives ~1.7x practical
    speedup in Semaev relation collection. GOAL-ECDLP-001 after 110 batches.

  decision: advance_constant_improvement_track
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    PARALLEL TRACK OPENED: Semaev constant optimization.

    The BKK insight gives a MEASURABLE PRACTICAL IMPROVEMENT:
    - Checking B/2 factor-base pairs per target gives 86% of full yield with 2x speedup
    - Net practical speedup: ~1.72x in relation collection
    - Improvement to constant c: ~19% reduction

    This is a legitimate contribution: the FIRST empirically verified practical speedup
    for Semaev index calculus from the BKK analysis. Not exponent-moving, but real.

    110-BATCH OVERALL STATUS:
    GOAL-ECDLP-001 has produced:
    1. Near-complete characterization of prime-field ECDLP attack complexity
    2. H-PSEUDO as the exact condition for sub-rho (proved theorem via Betti-Yield)
    3. First rigorous O(p^{3/4}) non-circular bound on H-PSEUDO character sum
    4. H-PSEUDO proved for k=2 MOV curves (Katz-Sarnak)
    5. Empirical H-PSEUDO support: C ~ p^{0.079}
    6. FIRST PRACTICAL SPEEDUP: BKK gives ~1.7x in Semaev relation collection
    7. 10 new KN-FIND items

    GOAL-ECDLP-001 stays active.

  exact_next_action: >-
    BATCH-111: Scale up the BKK speedup measurement to p=4001 (larger prime) to
    confirm the ~1.7x improvement persists. Also: test whether the sparse-resultant
    approach (using B/2 pairs) works correctly in the FULL index calculus (not just
    relation collection) — specifically, does using B/2 give enough relations to solve
    for all factor-base discrete logs?

  knowledge_promotion:
    promoted: []
    not_warranted: Preliminary measurement at p=1009 only.

  pareto_integrity:
    dominated_by: Standard Semaev at exp(c*sqrt(log N*log log N)) / 1.7 (constant improvement)
    sota_delta:
      time_exponent: not_applicable
      note: ~1.7x constant factor improvement (BKK), not exponent change.

  claim_ceiling: toy
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-04'
