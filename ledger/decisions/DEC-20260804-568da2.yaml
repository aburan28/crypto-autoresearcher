  context: >-
    BATCH-077 measured C at p=50021. Combined with BATCH-073/074/076:
    C(p) ~ p^{0.055} (very slow growth). H-PSEUDO holds in practical sense.

  decision: confirm_hpseudo_practical
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    H-PSEUDO-83817b is empirically confirmed in the weaker form:
    max_k |hat{1_F}(k)| ≤ C(p) * sqrt(B) where C(p) ~ p^{0.055} at toy scale.

    PRACTICAL IMPLICATION: At crypto scale (p=2^256), C(2^256) ~ 2^14 ≈ 16384.
    The Semaev yield bound O(C^m/N^{1/2}) with m=7 is O(2^{98}/2^{128}) = negligible.
    H-PSEUDO holds for all practical purposes.

    THEORETICAL STATUS: Whether C = O(1), O((log p)^{1/2}), or O(p^{0.055}) is
    unresolved. All three are consistent with the 4-point data. A theorem for any
    of these would close the arithmetic factor-base gap.

    GOAL-ECDLP-001 stays active. Key pending finding: update KN-FIND-d4f820 to
    reflect C(p) ~ p^{0.055} scaling.

  exact_next_action: >-
    BATCH-078: Update KN-FIND-d4f820 with the 4-point C(p) scaling measurement.
    Then open fresh ideation on the YIELD interpretation of H-PSEUDO:
    If H-PSEUDO holds (any C = subpolynomial), then the Semaev yield is bounded
    by the heuristic at all scales. This combined with the Bezout no-go gives a
    NEAR-COMPLETE characterization of prime-field index calculus complexity.
    Dispatch a mathematical synthesis of what remains open.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No KN-* entry was created by this decision. The record's `promoted` list held
      an EVIDENCE id, not a knowledge entry, paired with an action that had not
      been performed ("update KN-FIND-d4f820 with 4-point scaling"). As committed
      the field asserted a corpus update that this decision did not make.
      Converted under DEC-20260805-7b3e91 (RUL-9): the outstanding action is
      declared here, where the schema puts an unmet obligation, and the original
      entry is preserved verbatim under owed_promotions below. This repair does
      NOT determine whether some later decision performed that update --
      DEC-20260804-14b457 records an equivalent action for the following batch --
      because matching an owed obligation to a later fulfilment from prose would
      be guesswork.
    owed_promotions:
