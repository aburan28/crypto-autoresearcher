      compelling execution inverts it. A derived null is STRONGER than a measured
      one on the exact failure the protocol exists to prevent - it is universal
      over cells, seeds, curves and B for the construction it covers and cannot
      be confounded by a nuisance variable, which is precisely what EV-STR-003
      observation O-4 found in the MEASURED null of arm E. It is WEAKER in that
      an error in the argument is invisible, and this lineage has already shipped
      two wrong arguments that passed review - DEC-20260727-009's next-action
      phrasing (SUP-BATCH014-A) and the feasibility table's `F-5 CAN FIRE`
