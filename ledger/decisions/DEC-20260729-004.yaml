  DEC_20260727_009_prohibition:
    the_prohibition: >-
      `Whether phi_alpha is an artifact of the row-insertion rule is OPEN and may
      be asserted in neither direction by any downstream record.`
    ruling: >-
      THE RULING DOES NOT CROSS IT. THE RESERVED KN-FIND-010 SENTENCE DOES. Both
      halves are recorded, as the red team requires.
    why_the_distinction_holds: >-
      `phi_alpha` names the quantity produced by the AS-COMMITTED pipeline, whose
      append block skips an emission when the shifted row is all-zero or already
      present. A skip desynchronises triple boundaries from sigma-block
      boundaries, and D-6's entire argument fails the moment one emission is
      skipped, so the row computation is simply not available there. The
      derivation therefore reaches a DIFFERENT INSTRUMENT from the one the
      prohibition names.
    the_empirical_confirmation_that_the_two_are_genuinely_different: >-
      THIS IS NOT A FORMAL DODGE. EXP-STR-003 arm E is the FILTERED version of
      arm E-prime and measured alpha = 11, 1, 0, 29 where the derivation gives at
      most 1 for the unfiltered version. The filtered and unfiltered instruments
      demonstrably behave differently, by a factor of at least 29 at one archived
      instance. That is the strongest available evidence that the derivation
      cannot be extended across the filter, and it is the reason the prohibition
      survives untouched.
    where_the_crossing_would_occur_and_is_therefore_prevented: >-
      IN THE RESERVED BOUNDARY SENTENCE, WHICH DROPS THE UNCONDITIONALITY
      QUALIFIER. A reader applying it to EV-STR-002 and EV-STR-003 would conclude
      that phi_alpha IS an artifact of the row-insertion rule, which is precisely
      the prohibited assertion. THE PROHIBITION IS CROSSED BY AN OMITTED ADVERB
      IN AN ARTIFACT RESERVED FOR PROMOTION, NOT BY THE RULING. KN-FIND-010 is
      not created, the corrected wording is carried at B-11, and the prohibition
      is restated here beside it.
    consequence_for_the_instrument_question: >-
      THE INSTRUMENT QUESTION FOR THE AS-COMMITTED FILTERED CLOSURE REMAINS OPEN
      AND IS ASSERTED IN NEITHER DIRECTION BY THIS DECISION OR BY ANY BATCH-014
      RECORD. EXP-STR-003 left it open; this batch leaves it open too, about a
      different instrument from the one it adjudicates.

