    N8: >-
      Nothing in this report is evidence about H-STR-002. It establishes that a
      derivation reproduces and that an archive chain is intact. No measurement of
      alpha, of any misalignment set, or of any cost exists anywhere in this batch,
      and no record may assert one.
    the_validators_own_limitations_carried: >-
      Its numeric confirmations are SYNTHETIC INDEX-ONLY CHECKS ON INVENTED ROWS
      run outside the repository; they confirm an argument about code behaviour
      and ARE NOT MEASUREMENTS AND NOT EVIDENCE ABOUT ANY HYPOTHESIS. Its curve
