coordinator_decision:
  id: DEC-20260729-004
  batch_id: BATCH-014
  goal_id: GOAL-ECDLP-001
  archived_by: TASK-20260729-048
  decided_by: coordinator
  decided_at: '2026-07-29'
  decided_at_precision: >-
    DATE ONLY. The session recording this decision has no shell, no interpreter,
    no git and no clock access. It fabricates no wall-clock time, no commit
    identifier, no hash, no verdict and no measurement. Every commit identifier
    appearing below is TRANSCRIBED from a committed receipt or from an
    independent review report that states it verified it against Git, and is
    labelled as transcribed rather than verified here.

  context: >-
    BATCH-014 was opened to dispatch DEFER-BATCH009-001's EXP-STR-004
    replication and nothing else - the two-arm B-sweep of arm A-prime (the
    phi-invariant factor base with the line-303/304 dedup and zero filter
    disabled) and arm E-prime (a phi-free positional closure that emits each
    sigma-orbit once and never suppresses) at fourteen named toy cells. The
    contract, its derivation note and its feasibility table were frozen and
    snapshot-committed before any review read them. The independent
    pre-execution review returned REVISE with three blocking objections, and the
    committed TASK-20260729-043 receipt records the Coordinator determination
    NOT APPROVED together with the finding that NO REACHABLE OUTCOME OF
    EXP-STR-004 AS FROZEN SUPPORTS H-STR-002. QUEUE-AMEND-20260729-005 then
    ruled, before any measurement existed anywhere in this repository, that the
    permitted amendment cycle would not be opened, that TASK-20260729-044 and
    TASK-20260729-045 are stood down with zero curve compute, and that the
    batch's product is a derivation about the instrument rather than a
    measurement. Two independent non-originating reviews were re-pointed at that
    ruling. This decision carries the ruling into the ledger, adopts both
    reviews, and records what BATCH-014 does and does not establish.

  what_BATCH_014_IS_and_what_it_is_NOT:
    what_it_is: >-
      A BOUNDED NON-EXECUTION CARRYING A DERIVED FINDING. The derivation is the
      result; the non-execution is that derivation's consequence, and it is
      recorded in that order rather than the other way round.
    it_is_NOT_a_batch_failure: >-
      execution_gate.amendment_cycle_cap reserves the `batch failure`
      disposition for a SECOND REVISE after a permitted amendment cycle. NO
      CYCLE WAS OPENED AND NONE WAS CONSUMED. No file under
      experiments/EXP-STR-004/amendments/ was authored, that path was never
      added to any declared commit set, and the frozen specification and
      derivation note were not edited, not amended and not superseded.
    it_is_NOT_infrastructure_signal: >-
      NOTHING FAILED. No timeout, no crash, no memory or disk exhaustion, no
      missing Sage binary and no implementation failure occurred, because
      nothing was executed. The one measured hazard in the design - the O-2
      target-supply hazard - was measured by the dispatching session before the
      ruling and does not fire on these instances, and TASK-20260729-046
      re-derived every figure of that pre-flight exactly and independently. See
      B-8 for what the measurement does and does not clear.
    it_is_NOT_a_negative_mathematical_result_about_H_STR_002: >-
      H-STR-002's mechanism is untouched and is not in doubt. phi is an
      automorphism, phi(R) is a genuine relation whenever R is and F is
      phi-invariant, and the closed system really is C_3-equivariant. No arm of
      EXP-STR-004 would have tested any of that, and nothing here asserts it in
      either direction.
    it_is_NOT_a_rejection_of_the_contract_or_a_finding_that_it_is_unrunnable: >-
      The independent pre-execution reviewer called it by a wide margin the most
      disciplined contract in this lineage, its derivation reproduces exactly,
      and its arithmetic was confirmed cell by cell. The defect is not
      concealment and not sloppiness: the design cannot reach the outcome it was
      built to test.

  decision: refine

  decision_label_source: >-
    docs/task-lifecycle.md section 9. `refine` there means improve the mechanism
    or experiment. That is exactly what is decided: the experiment must be
    redesigned, because a derivation obtained BEFORE any data shows that the
    instrument it measures cannot bear on the claim it was built to test.

  decision_label_justified_against_every_alternative:
    support: >-
      NOT AVAILABLE. Nothing supports anything. No run exists, no evidence
      record exists, no evidence strength is assignable, and no cost path
      exists.
    weaken: >-
      REJECTED. `weaken` would imply new evidence lowering confidence in
      H-STR-002. There is no evidence, and H-STR-002 is ALREADY `weakened` on
      DEC-20260727-009's grounds, which are untouched here. Re-weakening a
      hypothesis on a derivation about an instrument would misdescribe both the
      basis and the object.
    reject_scoped: >-
      UNAVAILABLE ON H-STR-002 AND UNAVAILABLE ON THE NARROW DIAGNOSTICITY
      PROPOSITION. See B-6 and reject_scoped_availability below. Both
      independent reviews concur without reservation.
    inconclusive: >-
      REJECTED AS UNDERSTATING, AND THE REASON IS RECORDED RATHER THAN ASSERTED.
      `inconclusive` is the required outcome where evidence cannot discriminate
      between explanations. Here there is no evidence at all, and the thing that
      IS established - that the measured quantity is fixed by the closure
      convention - is not an inability to discriminate between explanations but
      a derived property of the instrument. Recording `inconclusive` overall
      would also leave DEC-20260727-009's R1, R2 and R3 silent and would let a
      future reader re-derive `supported` from the same unreproducible record.
      NOTE THE ONE PLACE WHERE `inconclusive` DOES BIND AND IS RECORDED: the
      INSTRUMENT QUESTION for the AS-COMMITTED FILTERED closure - whether
      `phi_alpha` is an artifact of the row-insertion rule - remains OPEN and is
      asserted in neither direction. See B-3 and DEC_20260727_009_prohibition.
    pause: >-
      REJECTED as misdescribing which thing is exhausted. The expected
      information gain of the SUCCESSOR design is not low; only that of THIS
      design is.
    replicate: >-
      REJECTED. There is no result to replicate. DEFER-BATCH009-001's
      replication obligation is NOT discharged and is re-scoped rather than
      satisfied; see B-5.
    expand: >-
      REJECTED. There is no measured range to expand.
    approve_or_revise_the_contract: >-
      NOT TAKEN. The TASK-20260729-043 determination of NOT APPROVED is not
      reversed; it stands as recorded. `revise` in the template vocabulary would
      imply the contract is to be repaired and re-reviewed inside this batch,
      which is precisely what the ruling declines to do and what B-1 grounds.
    agents_md_rule_12_does_not_fire_on_this_label: >-
      Both reviews rule that AGENTS.md rule 12 does NOT fire on a `refine`
      decision: redesigning an experiment because a pre-data derivation shows
      the instrument cannot bear on the claim is neither a breakthrough, nor a
      closure result, nor a contradiction of established evidence. No exponent
      moves, no lane closes, no obstruction theorem is claimed and no evidence
      record is contradicted. WHERE RULE 12 WOULD FIRE, THE CLAIM IS NOT MADE:
      on a `reject_scoped` on the narrow diagnosticity proposition, and on
      promotion of the reserved KN-FIND-010 boundary sentence in its present
      wording. `review-breakthrough` at `max` is UNAVAILABLE on this branch and
      may not be degraded, SO NEITHER CLAIM IS MADE HERE.

