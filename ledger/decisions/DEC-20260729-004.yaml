      set of cardinality at least 4 and a RANK of at most 2. DEC-20260727-009
      remains an immutable committed record and stands in the ledger as written.
      EXP-STR-004's P-2 REFUSED to pre-register that number and pre-registered
      the SET it counts; that refusal was correct and is the reason the error was
      catchable. AGENTS.md rule 12 does NOT fire on this supersession: it
      corrects a phrasing in a decision's next-action field, changes no measured
      number, no evidence record and no disposition, and is recorded as a
      supersession rather than as a refutation of DEC-20260727-009 as a whole.
    SUP-BATCH014-B: >-
