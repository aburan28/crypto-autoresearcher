        ALL THREE ARE ADOPTED, NOT OUTVOTED AND NOT SMOOTHED. The first is
        adopted as the finding of B-3 and supersedes the ruling's stated central
        reason on the merits. The second is adopted as the binding conditionality
        declaration of B-2 and enlarges R-7. The third is adopted as the
        falsification condition of this decision's single next action: IF THE
        PROBE FAILS, THIS RULING'S BASIS IS DEFECTIVE IN SUBSTANCE AND A
        SUCCESSOR MUST REOPEN IT ON THE MERITS.

