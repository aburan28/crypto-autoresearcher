    premature_closure_ruling: >-
      NOT PREMATURE CLOSURE UNDER docs/inventor-protocol.md, AND THE DERIVED NULL
      IS SOUNDER IN KIND AND WEAKER IN WARRANT. The closure standard - named
      obstruction, argument, forward guidance - is met, and this is expressly not
