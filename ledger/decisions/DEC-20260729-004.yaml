  # ==================================================================
  # B-5  DEFER-BATCH009-001 - RULED ON IN ITS OWN FIELD
  # ==================================================================
  B-5_DEFER_BATCH009_001_ruling:
    ruling: NOT DISCHARGED
    ruling_text: >-
      DEFER-BATCH009-001 IS NOT DISCHARGED. It survives intact, unretracted, and
      it continues to bind any transition of H-STR-002 in either direction.
      Discharge is a PROCEDURAL FACT established by artifacts and receipts and
      IS NOT ITSELF A RESULT; the queue states the condition in terms - the
      obligation is discharged only when EXP-STR-004 is executed,
      snapshot-committed under its own run ids, independently reviewed and
      ledger-archived, and the post-commit verifier accepts those commits. NONE
      OF THAT HAPPENED. No run exists, no run identifier was created, no run
      package was produced and TASK-20260729-045 committed nothing.
    receipts_named: >-
      The receipts that carry the batch's actual archive chain are
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-014/archives/TASK-20260729-041/snapshot_commit_receipt.json
      (the frozen contract, its derivation note and the feasibility table) and
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-014/archives/TASK-20260729-043/snapshot_commit_receipt.json
      (the pre-execution review and the APPROVAL_DETERMINATION of NOT APPROVED,
      authorized_to_execute false). THERE IS NO TASK-20260729-045 RECEIPT AND
      NONE IS ASSERTED.
    and_it_is_RE_SCOPED_on_two_grounds:
      ground_1_the_artifact_class_premise_is_spent: >-
        The obligation was created because DEC-20260727-009's `weaken` rested on
        an `empirical_only` basis, and that record gives as its stated reason
        that NO DERIVATION NOTE WAS ARCHIVED and that the argument existed only
        inside review reports. That reason is now spent: a derivation note is
        archived, its exact-rank strengthening is archived, and the derivation
        has been independently reproduced four further times, twice from the
        primary source file. The artifact-class ground for demanding a
        REPLICATION OF THE DISPLACEMENT-RANK MEASUREMENT is therefore gone.
      ground_2_the_named_instrument_cannot_serve_the_obligation: >-
        The obligation exists to license a transition of H-STR-002 in either
        direction. Executing an experiment whose measured quantity is fixed by
        the closure convention would mark the obligation DISCHARGED as a
        procedural fact while serving none of its purpose, and would let a
        future session record that the replication was performed. That is worse
        than recording plainly that the named instrument cannot serve the
        obligation.
      the_re_scoping: >-
        THE OBLIGATION IS RE-SCOPED TO AN END-TO-END COST EXPERIMENT OF THE
        SHAPE RECORDED AT B-7, PRECEDED BY THE COMMITTED-CODE PROBE RECORDED AS
        THIS DECISION'S SINGLE NEXT ACTION. It remains MANDATORY before any
        transition of H-STR-002 in either direction.
      no_new_deferral_identifier_is_created_and_the_reason_is_recorded: >-
        The amendment permits a successor to record this re-scoping under a NEW
        deferral identifier ONLY AFTER CHECKING IT FREE WITH
        tools/allocate_id.py, stopping and reporting on a collision and never
        renaming. THIS SESSION HAS NO SHELL AND RAN NO ALLOCATOR, SO IT CREATES
        NO NEW IDENTIFIER AND THE RE-SCOPING IS RECORDED UNDER THE EXISTING
        DEFER-BATCH009-001. A successor doing otherwise must note SUP-BATCH014-E
        first: the allocator's coverage is basename-and-parent-directory only
        and excludes coordination/, so for any identifier class it does not
        index, a `free` verdict from it is a null result and a CONTENT-LEVEL
        search is required.

  # ==================================================================
  # B-6  H-STR-002 DOES NOT MOVE
  # ==================================================================
  B-6_H_STR_002_non_transition:
    ruling: >-
      H-STR-002 STAYS `weakened`. IT DOES NOT MOVE ON THIS BATCH'S RECORD.
      ledger/hypotheses/H-STR-002.yaml IS NOT STAGED, NOT EDITED AND NOT IN ANY
      DECLARED COMMIT SET OF THIS ARCHIVE, and no QUEUE-AMEND adding it was
      recorded or is needed, because the transition it would carry does not
      exist. Its status_history is untouched; a future transition appends to it
      by supersession and never by overwrite.
    ground_1_why_not_stronger: >-
      `reject_scoped` and `rejected` are UNAVAILABLE. No instance is exhibited
      on which the mechanism fails; the mechanism is a one-line consequence of
      phi being an automorphism and is not in doubt; the derivation refutes the
      DIAGNOSTICITY OF AN INSTRUMENT and not a mathematical claim of the
      hypothesis; and there is no run set at all, let alone a replicated one.
      agents/coordinator.md forbids reject_scoped on a single unreplicated
      empirical-only run set, and this is WEAKER than that case, not stronger.
    ground_2_why_not_weaker_or_different: >-
      `inconclusive` as a hypothesis status would UNDERSTATE the record.
      DEC-20260727-009's R1 artifact failure, R2 one-variable comparison at 4 of
      4, and R3 absence of any cost path all stand unretracted and none is
      touched here. Recording `inconclusive` would let a future reader re-derive
      `supported` from the same unreproducible record.
    ground_3_what_actually_changes_and_where_it_is_recorded: >-
      NOT THE STATUS, BUT THE SET OF THINGS THAT CAN MOVE IT. The
      displacement-rank instrument is now derivationally shown to be incapable
      of moving H-STR-002 in either direction on this construction, so the route
      back runs exclusively through an end-to-end cost experiment. That
      narrowing is recorded HERE, in this decision, rather than in the
      hypothesis file, so that the declared commit set equals the committed set
      and no status edit is implied by a path appearing in a commit.
    ground_4_the_binding_constraint_is_honoured: >-
      This ruling grounds the NON-transition explicitly, which is what the
      standing constraint requires of any movement of H-STR-002 on this batch's
      own record. Nothing is moved, so nothing is grounded away.
    reject_scoped_availability_ruled_on_by_the_red_team_and_adopted:
      on_H_STR_002: >-
        NOT AVAILABLE, on three independent grounds. (i) docs/task-lifecycle.md
        section 9 defines reject_scoped as valid evidence contradicting the
        exact tested prediction; there is NO evidence, valid or otherwise - zero
        runs exist. (ii) DEC-20260727-009 already ruled reject_scoped FORBIDDEN
        on a strictly stronger record - twenty committed runs under a contract
        frozen before execution, independently reproduced - so a fortiori it is
        unavailable on zero runs. (iii) MOST IMPORTANTLY, THE DERIVATION DOES
        NOT CONTRADICT THE PREDICTION: the bound limb is SATISFIED. What fails
        is the comparative limb, and it fails against a null the derivation
        itself constructs. NOT-DISCRIMINATING IS NOT CONTRADICTED, and
        converting the one into the other is exactly how a bounded instrument
        ablation becomes an impossibility claim.
      on_the_narrow_diagnosticity_proposition: >-
        NOT AVAILABLE EITHER, on two grounds. (i) VOCABULARY: the section 9
        labels attach to a hypothesis or an experiment under Coordinator review,
        and `a displacement rank measured on a shift-closed row list is evidence
        of phi-invariance of the factor base` is a free-floating instrument
        proposition with no ledger identifier, no mechanism block, no test
        boundary and no falsification criteria; inventing an object to reject
        would be worse than leaving it unlabelled. (ii) ARTIFACT CLASS: even
        granting the object, the strongest artifact archived is a DERIVATION,
        rank 2 of three, and no counterexample certificate exists or can exist
        without execution. Under this program's own precedent a derivation
        supports a SCOPED NARROWING RECORDED IN A DECISION, not a rejection.
        AND AGENTS.md RULE 12 WOULD FIRE ON IT - it would settle in one
        direction a question DEC-20260727-009 committed as OPEN -
        `review-breakthrough` at `max` is unavailable on this branch and may not
        be degraded, THEREFORE THE CLAIM IS NOT MADE.

  # ==================================================================
  # B-7  THE SUCCESSOR EXPERIMENT AND ITS PRE-REGISTERED CEILING
  # ==================================================================
  B-7_the_successor_experiment:
    status: >-
      DESCRIBED AS A SPECIFICATION TARGET FOR A SUCCESSOR BATCH. IT IS NOT
      APPROVED, NOT FROZEN, NOT SCHEDULED AND NOT AUTHORIZED BY THIS DECISION. A
      fifteenth batch requires its own budget amendment on explicit user
      authorization and is not self-granted here.
    S_1_assemble_an_actual_linear_system: >-
      Collect relations WITH their right-hand sides. _collect_relations returns
      bare 0/1 incidence rows and never records the target's scalar multiple,
      which is DEC-20260727-009 R3 and is unrepaired: no linear system with a
      right-hand side has ever been assembled in this lineage. The
      target-sequence replay that recovers k per row is written out verbatim in
      objection O-3(a) of the TASK-20260729-042 review and must be DECLARED as a
      reimplementation of committed control flow, never performed silently.
    S_2_use_the_C_3_structure_directly_instead_of_measuring_a_rank: >-
      With F a union of whole phi-orbits and the relation multiset closed under
      phi, the system decomposes over the three eigenspaces of the order-3
      permutation, which is available at all four archived instances since 3
      divides n - 1 at each. Measure per-block rank, per-block solve cost, and
      whether A DISCRETE LOGARITHM IS ACTUALLY RECOVERED, packaged as a solution
      certificate that independent code re-checks. THE RED TEAM SUPPLIES A
      BETTER REASON FOR S-2 THAN THE ONE ORIGINALLY GIVEN AND IT IS ADOPTED: not
      that rank-measuring is inconvenient, but that THE RANK HAS NO SOLVER
      ATTACHED TO IT - see RT-CM-1 under B-10.
    S_3_matched_controls_this_lineage_has_never_had: >-
      The same B on a random factor base with a matched relation budget, AND a
      matched baseline on the same instances. GAP CORRECTED ON THE RED TEAM'S
      OBJECTION: the baseline must be rho WITH THE AUTOMORPHISM
      (Wiener-Zuccherato; Duursma-Gaudry-Morain; Gallant-Lambert-Vanstone),
      which already takes the sqrt(3) speedup on the rho side, and NOT plain
      Pollard rho. A successor baselining against plain rho would credit the
      C_3 structure with a saving the published specialized baseline already
      has. EV-STR-003's boundary that NO ARCHIVED BASELINE EXISTS AT THE TWO
      LARGER INSTANCES is open and unrepaired, and RC-7 has been declared
      inapplicable rather than answered.
    S_4_measure_the_density_penalty_honestly: >-
      Relations per unit work for the phi-invariant factor base against random
      at matched B, which is H-STR-002's second assumption and which nothing has
      tested. ANY RECORD TOUCHING THE RELATION-DENSITY PENALTY QUOTES THE WHOLE
      EV-STR-001 RANGE 17.5x TO 4128.6x, WHICH GROWS WITH SIZE AND
      SUPERLINEARLY IN m, AND NEVER 17.5x ALONE. NOTHING IN BATCH-014 MEASURES
      ANY DENSITY PENALTY.
    S_5_pre_register_the_honest_ceiling_before_any_measurement: >-
      CARRIED FORWARD VERBATIM AND WITH ITS ATTRIBUTION ON ITS FACE, per the red
      team's RT35-7: DEC-20260727-009's third limitation and its R5 record that
      an honest structural ceiling for exact C_3-equivariance is a factor r = 3
      - three blocks of size B/3 against Wiedemann's 2B^2 - and that this is the
      classical automorphism-quotient saving of Wiener-Zuccherato and
      Duursma-Gaudry-Morain, ALREADY THE PUBLISHED SPECIALIZED BASELINE. THAT
      SENTENCE IS DEC-20260727-009's AND IS QUOTED AS SUCH; IT IS NOT BATCH-014's
      OWN ARITHMETIC AND IS NOT A COST CLAIM OF THIS BATCH, WHICH MEASURES AND
      DERIVES NO COST OF ANY KIND. Note that RT-CM-1 states the same ceiling
      against a DENSE baseline while S-5 states it against Wiedemann's, both
      giving factor 3 against their own baseline, and the successor must NAME
      WHICH BASELINE IT MEANS. UNDER docs/target-result-profile.md RULE A1 A
      CONSTANT FACTOR IS NOT TARGET-CLASS, so even a fully successful S-1 to S-4
      confirms a constant factor and moves no exponent.
    S_6_ADDED_ON_THE_RED_TEAMS_OBJECTION_memory_beside_time: >-
      RT-CM-4 is OPEN and records that memory is absent on both sides. Measure
      MEMORY BESIDE TIME ON BOTH SIDES and report a time-memory interpolation,
      so that a memory-constrained baseline can be checked for dominance.
    S_7_ADDED_ON_THE_RED_TEAMS_OBJECTION_total_expected_cost: >-
      PER-ATTEMPT COST IS NOT TOTAL EXPECTED COST. DEC-20260727-009 R3 archives
      the phi arm's rank deficiency as 4, 6, 30 and 67 against the control's 0,
      0, 0 and 1. A rank-deficient block system needs more relations, so the
      success probability of one assembled system is below 1 and the honest
      quantity is per-attempt cost times inverse success probability.
      PRE-REGISTER THAT THE DEFICIENCY d(B) MUST BE o(B/3) FOR THE FACTOR-3
      SAVING TO SURVIVE AT ALL, AND MEASURE d(B) ALONG THE LADDER. The archived
      four points are an adverse prior, recorded before the successor is
      designed rather than discovered inside it.
    what_the_ceiling_must_ALSO_say: >-
      RT-CM-3, also OPEN, measures relation collection at 7.0x, 6.1x, 20.6x and
      78.7x the ENTIRE modelled linear algebra at B = 27, 55, 204 and 397, with
      the ratio growing in B, so even a perfect factor-3 linear-algebra saving is
      invisible at every size this lineage has ever reached. THE SUCCESSOR'S
      PRE-REGISTERED CEILING SHOULD BE THAT STRONGER STATEMENT, NOT THE
      LINEAR-ALGEBRA-ONLY ONE. RT-CM-6's unit caveat applies and the gaps
      survive it.
    the_direction_level_statement_in_the_form_the_red_team_requires: >-
      NO MECHANISM FOR THE SUPER-CONSTANT LIMB OF H-STR-002 - the claimed
      B/(alpha^2 log B) linear-algebra saving - HAS BEEN EXHIBITED IN THIS
      LINEAGE; WHETHER ONE EXISTS IS OPEN AND IS ASSERTED IN NEITHER DIRECTION.
      The block-circulant displacement-rank story was the proposed mechanism,
      and the derivation shows that on the only construction anyone has measured,
      the low displacement rank is imposed by closing the row list under the
      shift and is reproduced exactly by a construction with zero endomorphism
      content. A successor that wants the target-class limb owes a MECHANISM for
      a super-constant saving from a rank-3 automorphism, not another
      measurement of alpha. THIS IS ROADMAP GUIDANCE RECORDED FOR THE GOAL AND
      IS NOT A CLOSURE OF THE LANE: no obstruction theorem is claimed, and the
      lane is closed by nothing here.

