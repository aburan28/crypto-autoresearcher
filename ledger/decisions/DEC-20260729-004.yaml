        large separation. The correct reason is stronger and different - ALPHA ON
        A CLOSURE-GENERATED ROW LIST IS A FUNCTION OF THE CLOSURE CONVENTION IN
        BOTH ARMS, THE CONVENTION IS A FREE PARAMETER OF THE EXPERIMENT, AND IT
        DETERMINES THE SIGN OF THE REPORTED SEPARATION. An instrument like that
        cannot be repaired by an amendment and cannot be rescued by running it,
        which is why the conclusion survives the loss of its stated reason.
      second_dissent: >-
        I DISSENT FROM THE CLAIM THAT THE ARM E-PRIME LIMB IS UNCONDITIONAL. It
        is conditional on a base-row supply that nothing has measured and on a
        driver that nobody has written. The ruling explicitly rests on that limb
