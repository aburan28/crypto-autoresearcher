      DEVIATION'S LIMIT: not one criterion, threshold, cell set, predicted set,
      verdict branch or disposition of EXP-STR-004 is moved by it, and the
      frozen files are not edited, not amended and not superseded.
    what_the_gate_still_binds_and_is_restated: >-
      NON-EXECUTION IS NEVER RECORDED AS A RESULT, and a timeout, crash,
      resource exhaustion, disk exhaustion, missing Sage binary or
      implementation failure is INFRASTRUCTURE SIGNAL and is never a negative
      mathematical result. NONE OF THOSE OCCURRED. The batch's product is a
      derivation and the non-execution is that derivation's consequence.
    the_O_2_pre_flight_clears_one_limb_only: >-
      ADOPTED FROM THE RED TEAM (RT35-D4, RT35-CNI-3) AND RECORDED BESIDE THE
      MEASUREMENT RATHER THAN AFTER IT. The dispatching session's pre-flight
      measured the DISTINCT-TARGET limb of O-2 and TASK-20260729-046 re-derived
      every figure of it exactly and independently: CURVE-J12S1 gives p 2293,
      n 733, derived seed 100, c 100, gcd(100, 732) = 4 and a distinct-target
      bound of 183 against a maximum required R_base of 66 at B = 193;
      CURVE-J16S3 gives p 42013, n 41617, derived seed 300, c 300,
      gcd(300, 41616) = 12 and a bound of 3468. The validator STRENGTHENED it:
      because _collect_relations dedups on the target x-coordinate rather than
      on k, and x(kP) = x((n-k)P), the distinct-k bound could in principle have
      over-counted usable targets by up to a factor of two - and it does not
      here, the realised sequence giving 183 DISTINCT TARGET X-COORDINATES for
      CURVE-J12S1, equal to the k-bound, with a margin over R_base of 2.77x. THE
      NARROWING THAT BINDS: the gcd bound governs the supply of distinct
      TARGETS, while a base row exists only where a target also DECOMPOSES. The
      pre-flight shows that O-2 DOES NOT FIRE; it does not show that R_base(B)
      base rows are obtainable at every cell. The -043 receipt's phrase `Every
      cell including the top rungs is runnable` is stronger than a gcd check can
      establish and must be read as `no cell is target-starved`. THE HAZARD IS
      HALF CLEARED, and the unmeasured half is exactly the supply condition
      declared at B-2 and probed by this decision's single next action. Both
      the pre-flight and the validator's re-derivation are FEASIBILITY CHECKS
      WITH NO RUN ID AND NO MANIFEST AND MAY NOT BE CITED ANYWHERE AS
      MEASUREMENTS OR AS EVIDENCE ABOUT ANY HYPOTHESIS.

