  # ==================================================================
  # RATIONALE
  # ==================================================================
  rationale:
    - >-
      R-1 THE MEASURED QUANTITY IS FIXED BY THE CLOSURE, NOT BY THE ENDOMORPHISM,
      AND THIS IS DERIVED RATHER THAN ARGUED. The rows arising from complete
      triples are scalar multiples of the single vector e_3q and the one
      remaining row is orthogonal to that coordinate, so alpha is at most 2 for
      arm A-prime and at most 1 for arm E-prime at every declared cell and, by
      the same argument, at every B with B mod 3 in {0, 1} for this construction.
      Five independent derivations agree, two of them from the primary source
      file, and one of them confirmed the closed-form displacement matrix
      ENTRYWISE against the committed rank routine on synthetic rows.
    - >-
      R-2 THE ARM WITH ZERO ENDOMORPHISM CONTENT SATISFIES THE SAME BOUND, SO THE
      HEADLINE FALSIFIER CANNOT DISCRIMINATE. RESTATED ON THE RED TEAM'S
      OBJECTION AND THE COMPARATIVE PHRASING WITHDRAWN: what is derived is that
      BOTH ARMS SATISFY alpha <= 3 AT EVERY DECLARED CELL, and at the seven
      residue-zero cells alpha = 0 EXACTLY for both. It is NOT derived that
      either arm satisfies the bound `more strongly` than the other; the derived
      quantities are upper bounds and the realised values can invert cell by
      cell. A criterion that a null object satisfies identically carries no
      information, so F-5 cannot discriminate and no outcome of it is support.
    - >-
      R-3 THE CONTRACT'S success_criterion CONTRADICTS ITS OWN BINDING READING OF
      F-4, and the binding reading is the derived one because D-6's residue-zero
      argument uses nothing about the base rows or the factor base. The
      contradiction is not repairable by text: repairing it deletes the last
      outcome the contract claimed could support the hypothesis.
    - >-
      R-4 EVERY CANDIDATE REPLACEMENT STATISTIC WAS ENUMERATED AND NONE SURVIVES.
      Four candidates in the ruling and four more from the red team - eight in
      all, each named with its reason. One is trivialised, several measure
      uncontested premises or the committed builder's truncation, one collapses
      into another, and one is a cost quantity the contract forbids and the
      successor must measure.
    - >-
      R-5 AN AMENDMENT THAT MANUFACTURED A SUPPORTING OUTCOME AFTER THE ORIGINAL
      DESIGN WAS SHOWN UNABLE TO REACH ONE WOULD FAIL THE DIRECTION TEST THIS
      CAMPAIGN ADOPTED and would violate DEC-20260727-009's `two arms and nothing
      else`, which RULE-BATCH014-SCOPE ruled constrains the arms.
    - >-
      R-6 EXECUTING WOULD HAVE DISCHARGED DEFER-BATCH009-001 PROCEDURALLY WHILE
      SERVING NONE OF ITS PURPOSE, and would have left on the record a
      favourable-looking ladder of alphas in {0, 1, 2} against a hypothesis
      predicting alpha at most 3 independent of B. DEC-20260726-006 is this
      program's own precedent for what happens to such a table.
    - >-
      R-7 CONCEDED AGAINST THIS DECISION AND RECORDED AGAINST IT RATHER THAN IN
      ITS FAVOUR, AND ENLARGED BY BOTH REVIEWS. THE PRICE IS REAL. Executing
      would have tested the derivation against a sharp pre-registered equality,
      would have checked D-3 at B = 192 and B = 193 where it is unverified, would
      have measured the base-row supply on which the arm E-prime limb is now
      declared conditional, and would have produced a COUNTEREXAMPLE CERTIFICATE
      - the strongest refutation-artifact class, unavailable without execution -
      had the derivation been wrong. THAT CHECK IS NOT PERFORMED AND IS NOT
      REPLACED. The nearest archived neighbour of arm E-prime, EXP-STR-003 arm E
      with two booleans enabled, MEASURED 11, 1, 0, 29, and the 29-to-1 swing
      attributed to those two booleans has never been checked on a machine
      (F-8). The single next action exists to convert as much of this price as a
      probe can reach into a discharged obligation; the residue - driver fidelity
      for a driver that has never been written - is not reachable by any probe
      and is declared rather than dissolved.
    - >-
      R-8 THE NARROWED GROUND, ADOPTED FROM THE RED TEAM AS THIS DECISION'S
      PRIMARY REASON. The ruling's stated ground answers whether an amendment
      could create support; the disposition answers whether to execute, and route
      (a) needs no amendment at all. THE GROUND THAT SURVIVES IS THAT EXECUTION'S
      ONLY DISCRIMINATING POWER OVER THE DERIVATION IS THE POWER TO DETECT A
      DRIVER BUG, and the two committed-code facts a run would settle are
      reachable for seconds without twenty-eight curve runs at the last
      authorized batch.
    - >-
      R-9 THE INSTRUMENT IS WORSE THAN VACUOUS: ITS VERDICT IS SET BY A FREE
      CHOICE OF NULL CONVENTION. Three defensible nulls give alpha of order B,
      about 2B/3, and at most 1 on the same instance, and under two of the three
      H-STR-002's first prediction reads as CONFIRMED WITH A LARGE SEPARATION.
      Nothing in the mathematics of the curve selects among them. A FAVOURABLE
      LADDER IS A PROPERTY OF THE CLOSURE CONVENTION AND SO IS AN UNFAVOURABLE
      ONE. This is the strongest reason on the record and it points away from
      rescue rather than toward it.

