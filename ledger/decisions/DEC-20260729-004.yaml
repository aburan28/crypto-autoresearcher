  # ==================================================================
  # B-1  THE RULING AND ITS BASIS
  # ==================================================================
  B-1_the_ruling_and_its_basis:
    the_ruling: >-
      NO AMENDMENT TO EXP-STR-004 AS FROZEN CAN MAKE IT CAPABLE OF SUPPORTING
      H-STR-002. The one permitted amendment cycle was not opened and not
      consumed; TASK-20260729-044 and TASK-20260729-045 are stood down; 7500
      declared seconds and all 28 declared run identifiers are released unspent;
      zero curve compute was performed in this batch.
    the_ruling_was_recorded_before_its_consequence: >-
      DELIBERATELY. It was written and committed before any re-pointed card ran,
      before this decision existed, and while no EXP-STR-004 measurement existed
      anywhere in this repository, so that it is an ACT ON THE RECORD with its
      own stated basis rather than something a later reader infers from the fact
      that no run happened. Both independent reviews verified the pre-data
      property against Git at the head they reviewed.
    THE_GROUND_THIS_DECISION_ADOPTS_AS_PRIMARY_AND_IT_IS_THE_NARROWED_ONE: >-
      NOT `no amendment can create a supporting outcome`. That statement is
      true, and it answers a question the disposition does not turn on: the
      amendment's title question is CAN AN AMENDMENT MAKE THIS DESIGN CAPABLE OF
      SUPPORT, while the disposition answers SHOULD THIS BE EXECUTED, and route
      (a) - recording the reviewer's three discharge-condition texts verbatim
      and approving - requires no amendment, edits no frozen file, consumes no
      cycle, adds no arm and adds no statistic, so the direction test and the
      `two arms and nothing else` constraint do not reach it at all. That gap is
      the red team's F-11 and RT35-4, and it is ADOPTED. THE GROUND THAT
      SURVIVES ADVERSARIAL PRESSURE AND IS ADOPTED AS THIS DECISION'S PRIMARY
      REASON IS: THE ONLY DISCRIMINATING POWER EXECUTION WOULD HAVE OVER THE
      DERIVATION IS THE POWER TO DETECT A DRIVER BUG. Arm E-prime's bound
      follows from the CONTRACT'S OWN DEFINITION of arm E-prime's closure
      together with sigma cubed being the identity; arm A-prime's follows from
      the same plus D-3 and D-4(b). A driver that implements the specification
      reproduces both bounds by construction, so a run can contradict the
      derivation only if the driver departs from the specification or if the
      builder or the collector fails to supply what D-3 and the square branch
      assume. Twenty-eight curve runs at the last authorized batch is an
      expensive software test, and the two COMMITTED-CODE facts it would settle
      are reachable for seconds without it.
    the_case_FOR_executing_is_carried_at_full_strength_and_answered_rather_than_omitted:
      F_1_to_F_7_as_recorded_in_the_amendment: >-
        Seven items were recorded for running and answered there: F-1 the
        blocking objections are text and derivation rather than measurement and
        route (a) needs no edit; F-2 the one measured hazard is cleared; F-3
        objection O-1 sharpens the experiment by turning the residue-one cells
        from bounded into predicted, so a measured alpha of 3 or more at any
        cell would be a counterexample certificate; F-4 the derivation has
        unverified conditional limbs and only execution checks them; F-5 this
        program has already shipped a confident derivation-flavoured claim that
        was provably wrong; F-6 DEFER-BATCH009-001 is discharged only by
        execution; F-7 a non-execution bequeaths rather than removes the
        problem. THE RED TEAM RULED THAT THREE OF THE SEVEN ARE ANSWERED
        CORRECTLY AND COMPLETELY (F-1, F-3, F-7), TWO BY PROCEDURE THE
        COORDINATOR HAS ALREADY SHOWN IT CAN VARY (F-6 AND THE RC-14 GATE), AND
        TWO TOO QUICKLY (F-2, F-4).
      F_8_ADOPTED_AND_IT_IS_THE_STRONGEST_ITEM_FOR_EXECUTING: >-
        THE IMMEDIATE PREDECESSOR OF ARM E-PRIME MEASURED 29, AND THE RULING DID
        NOT RECORD IT. Arm E-prime is not a new construction: EXP-STR-003 arm E
        is the identical random factor base, the identical base row list and the
        identical POSITIONAL sigma-orbit closure, appended only when the shifted
        row is nonzero and not already present - mirroring, term for term, the
        filter and dedup at harness/endomorphism_la.py lines 303-304. THAT ARM
        MEASURED alpha = 11, 1, 0, 29 across its four instances, as
        DEC-20260727-009's instrument_question_disposition archives. The ruling
        asserts that the same arm, with those two boolean conditions deleted, is
        derivably alpha at most 1 at every declared cell and every B. THAT IS A
        SWING FROM A MEASURED 29 TO A DERIVED 1 ATTRIBUTED ENTIRELY TO TWO
        BOOLEANS, AND IT HAS NEVER BEEN CHECKED ON A MACHINE. The derivation
        explains the difference - a single suppressed emission shifts the phase
        of the whole downstream stream, so triple boundaries stop coinciding
        with sigma-block boundaries (D-5, and EV-STR-003 observation O-4) - but
        THAT EXPLANATION IS ITSELF THE UNCHECKED STEP. A measured alpha(E-prime)
        of 2 or more at any declared cell would have been a COUNTEREXAMPLE
        CERTIFICATE, the strongest refutation-artifact class, against the exact
        limb the ruling rests on. IT IS ADOPTED IN THREE PLACES AND IS NOT
        ANSWERED AWAY: it is the archived counter-number that forces the
        unconditionality qualifier into the reserved boundary sentence (B-11),
        it is the empirical demonstration that the filtered and unfiltered
        instruments genuinely differ and therefore that DEC-20260727-009's
        standing prohibition survives untouched (B-3), and it is part of the
        price recorded against this ruling (R-7 as enlarged).
      F_9_ADOPTED_IN_FULL_AND_IT_CORRECTS_THIS_RULINGS_OWN_BASIS_STATEMENT: >-
        THE ARM E-PRIME LIMB IS NOT UNCONDITIONAL, AND THE RULING'S SENTENCE
        SAYING IT IS, IS FALSE AS WRITTEN. See B-2 conditionality, which is the
        binding declaration.
      F_10_ADOPTED_AS_A_REAL_COST_AND_IT_DOES_NOT_CARRY: >-
        The marginal cost of executing was zero and the option expires. 7500
        seconds and 28 run identifiers were already budgeted with no alternative
        use; campaign_budget.maximum_batches = 14 is consumed at this close; so
        the derivation may go permanently unchecked against a machine and the
        option to check it cannot be repurchased from inside the program. THAT
        IS TRUE AND IT IS RECORDED AS A COST. It does not carry, for the reason
        the red team gives against its own argument: the two committed-code
        facts the ladder would establish are reachable for a rounding error of
        the released budget by the probe recorded as this decision's single next
        action, and the residual - driver fidelity - is a software-test question
        rather than a research question.
      F_11_ADOPTED: >-
        See THE_GROUND_THIS_DECISION_ADOPTS_AS_PRIMARY above. The stated ground
        and the decided question came apart, and this decision records the
        narrowed ground rather than the original one.
    where_the_case_FOR_was_itself_overstated_and_it_cuts_against_running: >-
      F-2's `THE ONE MEASURED HAZARD IS CLEARED` and `the infrastructure is
      specified and paid for` clear ONE OF TWO LIMBS. See B-8.
      the_O_2_pre_flight_clears_one_limb_only. F-4's live content is narrower
      than the ladder: it is that D-3 is unverified at B = 192 and B = 193,
      which needs no ladder, no driver, no closure, no relation and no alpha.
    the_conclusion_survives_the_loss_of_three_of_its_stated_grounds: >-
      RECORDED PLAINLY. The red team broke three of the ruling's stated grounds
      (RT35-D1, RT35-D2, RT35-D4), dissented from its central reason, and could
      not break its conclusion. This decision adopts the narrowed ground, adopts
      every defect, and records the dissents verbatim rather than smoothing
      them.

  # ==================================================================
  # B-2  THE DERIVATION, ITS ARTIFACT CLASS, ITS SCOPE, ITS CONDITIONS
  # ==================================================================
  B-2_the_derivation:
    statement: >-
      For both declared arms of EXP-STR-004, on the committed
      harness/endomorphism_la.py, with the closure applied UNCONDITIONALLY and
      the SQUARE branch of _measure_displacement_rank taken, the displacement
      matrix satisfies D[i][j] = M[i][j] - M[sigma(i)][sigma(j)]. At a cell with
      B mod 3 = 1, writing q = B // 3 and c = r_j[3q], its rows are exactly
      D[3j] = c e_3q, D[3j+1] = 0, D[3j+2] = minus c e_3q, and
      D[3q] = r_q - sigma-inverse . r_q, whose 3q coordinate vanishes because
      sigma fixes 3q. The rows arising from complete triples lie in the
      one-dimensional span of e_3q and the single orphan row, orthogonal to that
      coordinate, contributes at most one more. Hence
      alpha(A-prime) = [exists j < q with r_j[3q] = 1] + [sigma . r_q != r_q],
      in the set {0, 1, 2}; alpha(E-prime) = [sigma . r'_q != r'_q], in the set
      {0, 1}; and alpha = 0 exactly for both arms at every cell with
      B mod 3 = 0.
    proof_status: derivation
    proof_status_note: >-
      RANK 2 OF THREE under docs/claims-and-verification.md, below a
      counterexample certificate and above a declared `empirical_only` basis. IT
      IS NEVER `proved`. It is an argument about the behaviour of committed
      Python functions on declared parameter cells, not a theorem about ECDLP,
      and it is not machine-checked. A COUNTEREXAMPLE CERTIFICATE IS NOT
      AVAILABLE AND CANNOT BE MADE AVAILABLE WITHOUT EXECUTION; that is recorded
      as the stand-down's price and not as a tie.
    proof_refs:
      - >-
        experiments/EXP-STR-004/derivation_note.md, sections D-1 to D-7, with
        D-8 items 1 to 8 declaring what it does not reach. Snapshot-committed by
        TASK-20260729-041 at the commit that receipt records as
        7c9aa579a44305afd9a8c967bc408f88fb8f48da. THE NOTE STOPS ONE STEP SHORT
        OF THE RANK and its own D-8 item 1 says so.
      - >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-014/reviews/TASK-20260729-042/derivation_check.md
        section 6.2, and objection O-1 of the accompanying contract_review.yaml
        in the same directory. Snapshot-committed by TASK-20260729-043 at the
        commit that receipt records as
        0cea73f9f63d9fe45d5559afcc7b14efd6d6a9d8. THE EXACT-RANK RESULT THE
        RULING TURNS ON LIVES HERE AND NOT IN THE NOTE, so this decision cites
        BOTH artifacts.
    citation_form: >-
      THE TASK-20260729-042 REVIEW IS CITED BY PATH AND TASK ID ONLY, never by
      report id, because its report identifier is the subject of a recorded
      defect. See SUP-BATCH014-C and SUP-BATCH014-D.
    ordering_rule_satisfied_by_commit_order_not_by_argument: >-
      Both artifacts precede this decision in the commit graph, and both reviews
      independently confirmed at the head they reviewed that neither
      ledger/evidence/EV-STR-004.yaml nor ledger/decisions/DEC-20260729-004.yaml
      nor any EXP-STR-004 run path existed. docs/claims-and-verification.md's
      requirement that the refutation artifact be archived BEFORE the decision
      relying on it is therefore met as a checkable property of commit order.
      The commit identifiers above are transcribed from committed receipts;
      TASK-20260729-046 reports that it re-derived five of five recorded path
      SHA-256 values from the Git blobs at those commits and that the chain is
      linear and reachable from HEAD, and TASK-20260729-047 reports
      independently that both commits exist, are ancestors of HEAD, and that the
      derivation-note and contract-review blobs are byte-identical at those
      commits and at HEAD. THIS SESSION VERIFIED NEITHER AND CLAIMS NEITHER.
    how_many_independent_derivations_now_exist: >-
      FIVE, AND THE COUNT IS A COUNT WHOSE MEMBERS ARE NAMED. (1) The contract
      author's derivation note, D-1 to D-7, which stops short of the rank. (2)
      The TASK-20260729-042 reviewer, non-originating, which re-derived from the
      committed source before reading the note and then computed the rows and
      the exact rank. (3) The Coordinator session that recorded
      QUEUE-AMEND-20260729-005, by hand from the source text QUOTED IN THOSE
      ARTIFACTS. (4) TASK-20260729-046, written from harness/endomorphism_la.py
      before opening any prior analysis, reproducing all four displacement rows
      and BOTH EXACT RANKS, and then confirming them numerically by invoking the
      COMMITTED rank routine on synthetic row lists, where the predicted
      displacement matrix matched the actual M[i][j] - M[sigma(i)][sigma(j)]
      ENTRY BY ENTRY and not merely in rank. (5) TASK-20260729-047, from the
      PRIMARY FILE read directly rather than through any quotation, checked
      twice in two equivalent sign conventions. ALL FIVE AGREE AND THERE IS NO
      DISAGREEMENT TO REPORT.
    what_remains_correlated_among_them_and_is_irreducible: >-
      ADOPTED FROM THE RED TEAM AND RECORDED AGAINST THIS DECISION. Derivations
      1, 2 and 3 shared a transcription channel, which derivations 4 and 5
      closed by deriving from the primary file. What no further derivation can
      close is that ALL FIVE SHARE THE SAME READING OF WHAT A DRIVER THAT DOES
      NOT EXIST WILL DO. That residual is reducible only by execution or by
      declaring the limb conditional. THIS DECISION DECLARES IT CONDITIONAL.
    conditionality_declared_rather_than_discovered:
      arm_A_prime_limb: >-
        CONDITIONAL ON D-3 - the hypothesis that
        _build_phi_invariant_factor_base returns a list of length exactly B
        whose complete blocks satisfy F[3j+k] = zeta3^k F[3j]. D-3 IS UNVERIFIED
        AT B = 192 AND B = 193, where the builder returns a SHORT list if it
        cannot find enough whole orbits inside its trial bound
        (harness/endomorphism_la.py line 95). NO RECORD OF THIS BATCH MAY TREAT
        D-3 AS ESTABLISHED. It was deliberately not verified by either review.
      arm_E_prime_limb_conditionality_1_SUPPLY: >-
        CONDITIONAL ON A BASE-ROW SUPPLY OF AT LEAST R_base(B) - 1 AT EVERY
        CELL, AND THIS IS RECORDED AS A CORRECTION TO THE RULING'S OWN BASIS
        STATEMENT (RT35-D1, F-9). The derivation is of the SQUARE branch, taken
        only when the emitted row count is at least the column count. In the
        RECTANGULAR branch the returned quantity is rank(M Z - M), whose rows
        are sigma . M[i] - M[i] over the whole emitted list - two independent
        per base row for a sigma-closed list - so the measured quantity
        generically becomes Theta(B) rather than at most 1. TASK-20260729-046
        independently recomputed R_base(B) = (B+2)//3 + 1 across the fourteen
        cells as 5, 6, 9, 10, 17, 18, 33, 34, 65, 66, 33, 34, 5, 6 and confirms
        rows_final minus B is 3 at every residue-zero cell and 5 at every
        residue-one cell, so all fourteen take the square branch ABSENT A
        SHORTFALL OF TWO OR MORE BASE ROWS. NOTHING HAS MEASURED THAT SUPPLY AT
        ANY CELL FOR EITHER ARM.
      arm_E_prime_limb_conditionality_2_DRIVER_FIDELITY: >-
        CONDITIONAL ON A DRIVER THAT DOES NOT EXIST IN THE COMMITTED HARNESS.
        Arm E-prime's closure - emit r, sigma . r and sigma squared . r
        unconditionally - appears nowhere in harness/endomorphism_la.py, and arm
        A-prime's closure is the committed block WITH TWO CONDITIONS DELETED,
        which is also not committed code. derivation_note.md D-8 item 4 already
        declares that limb CONDITIONAL, and the ruling dropped that declaration
        at the exact point it leaned on the limb. THE AMENDMENT'S L-2 - `THIS IS
        A DERIVATION ABOUT COMMITTED PYTHON FUNCTIONS ON DECLARED PARAMETER
        CELLS` - IS INACCURATE FOR THE CLOSURE LIMB OF BOTH ARMS AND IS
        CORRECTED HERE. The only contract checks of driver fidelity, IV-8 and
        IV-10, fire only on execution.
      the_two_reviews_converge_on_the_same_two_preconditions: >-
        TASK-20260729-046 names them P1 and P2 and shows both are LOAD-BEARING
        rather than cosmetic on the same committed code: feeding B-1 rows, which
        breaks P1 and takes the rectangular branch, raised alpha from 1 to 8, 10
        and 14 at B = 13, 16 and 22; deleting ONE row from an early triple,
        which breaks P2, raised it from 1 to 8, 10 and 14 at the same sizes.
        TASK-20260729-047 names the same two as supply and driver fidelity.
        P2 is discharged FOR ARM E-PRIME by CTRL-2 by construction - but `by
        construction` means by the contract's declared closure, which is
        precisely the driver that has never been written, so the declaration
        above is the honest form and is the one that binds.
    the_independence_of_the_E_prime_limb_from_D_3_is_RULED_ON_AND_IS_STRENGTHENED: >-
      TASK-20260729-046 rules that the arm E-prime limb IS independent of D-3,
      by three routes: textual, since arm E-prime calls
      _build_random_factor_base and never the phi-invariant builder, so D-3's
      hypothesis has no subject there; structural, since the derivation uses
      only sigma as built from the column count alone, the closure being
      unconditional and positional, and the square-branch identity, and no step
      names a factor-base entry; and numeric, the last computed WITH NO FACTOR
      BASE IN EXISTENCE AT ALL, sigma having been applied positionally to
      arbitrary random 0/1 vectors. It STRENGTHENS the statement to
      alpha(E-prime) at most (column count mod 3), hence at most 2, FOR EVERY
      COLUMN COUNT AND WHATEVER THE FACTOR BASE IS AND WHATEVER ITS LENGTH -
      offered as a derivation, never as a proof. So even a SHORT random factor
      base leaves alpha(E-prime) at O(1) and leaves the non-discrimination
      reading intact. THE E-PRIME LIMB THEREFORE DOES NOT INHERIT D-3'S
      UNVERIFIED STATUS; IT INHERITS THE SUPPLY AND DRIVER CONDITIONS DECLARED
      ABOVE INSTEAD.
    scope_of_the_derivation_stated_and_bounded:
      - >-
        Scoped to THE TWO DECLARED CLOSURE CONVENTIONS of EXP-STR-004, on the
        committed harness, at B mod 3 in {0, 1}, with the closure applied
        UNCONDITIONALLY and the square branch taken.
      - >-
        IT SAYS NOTHING ABOUT THE AS-COMMITTED FILTERED CLOSURE with the
        line-303 and line-304 zero filter and dedup ENABLED, which is what
        EXP-STR-002 and EXP-STR-003 actually ran. There the emitted stream is
        not a clean concatenation of triples and the analysis does not apply.
      - >-
        IT SAYS NOTHING ABOUT B mod 3 = 2. No declared cell has it, and
        TASK-20260729-046 measured alpha(A-prime) of 3 and 4 and alpha(E-prime)
        of 2 on the same committed function at B = 8, 11 and 14, so the
        contract's residue-two exclusion is NECESSARY rather than merely
        cautious.
      - >-
        IT SAYS NOTHING ABOUT H-STR-002's MECHANISM, which is untouched and not
        in doubt, and NOTHING about its cost claim, which nothing in this
        lineage has ever measured.
      - >-
        The phrase `at every B with B mod 3 in {0, 1} for this construction` is
        AN ALGEBRAIC IDENTITY ON A ROW LIST AND NOT A MEASUREMENT CLAIM BEYOND
        THE DECLARED CELLS. It licenses no statement about B > 193, about
        field_bits > 16, about j != 0 curves, about generic curves, about
        m > 3, or about medium or cryptographic scale. THIS QUALIFIER IS
        RECORDED AT THE RED TEAM'S REQUEST because a reader scanning for
        `every B` will not otherwise distinguish the two.
      - >-
        IT IS NOT A MACHINE-CHECKED PROOF AND NOT A UNIVERSAL IMPOSSIBILITY
        CLAIM.
    the_wording_narrowing_the_validator_supplies: >-
      ADOPTED. The informal paraphrase that EVERY tail-induced row lies in the
      one-dimensional span of e_3q and therefore alpha is at most 2 ELIDES THE
      SECOND GENERATOR: D[3q] is generally NOT in the span of e_3q. The correct
      statement, which is what the two committed artifacts both actually write,
      is that THE ROWS ARISING FROM COMPLETE TRIPLES lie in that span and the
      single orphan row, orthogonal to the 3q coordinate, contributes at most
      one more. THE COMMITTED ARTIFACTS ARE CORRECT AS WRITTEN AND NEED NO
      CHANGE; only the informal paraphrase was loose, and the correct form is
      the one used in this record.

  # ==================================================================
  # B-3  THE VACUITY FINDING ON H-STR-002's FIRST PREDICTION
  # ==================================================================
  B-3_the_vacuity_finding_on_H_STR_002s_first_prediction:
    the_prediction: >-
      H-STR-002's first prediction reads: alpha at most r = 3 for phi-invariant
      factor bases AT ALL TESTED B, CLEARLY BELOW the random-baseline alpha of
      order B and the AP-baseline alpha of order B from EV-STR-001.
    the_bound_limb_is_SATISFIED_and_satisfied_VACUOUSLY: >-
      By the derivation, alpha(A-prime) is at most 2 and alpha(E-prime) at most
      1 at every declared cell, so the numerical bound of 3 holds - AND IT HOLDS
      FOR REASONS HAVING NOTHING TO DO WITH THE ENDOMORPHISM. It is imposed by
      closing the row list under the very operator with respect to which the
      rank is then measured, and it is reproduced exactly by an arm with ZERO
      ENDOMORPHISM CONTENT. At the seven residue-zero cells it is alpha = 0
      EXACTLY for BOTH arms, for a reason - the coincidence of triple boundaries
      with sigma-block boundaries - that mentions neither phi nor the curve.
    the_comparative_limb_FAILS_AGAINST_A_MATCHED_CONTROL: >-
      Under a MATCHED closure the phi-free arm does not have alpha of order B;
      it has alpha at most 1. The alpha of order B baseline the prediction cites
      arose from measuring RAW, UNCLOSED rows. So the separation the prediction
      asserts against a matched control is NOT EXHIBITED BY THIS INSTRUMENT.
    the_binding_prohibition: >-
      NO LOW MEASURED alpha ON A SHIFT-CLOSED ROW LIST MAY EVER BE CITED AS
      CONFIRMING H-STR-002's FIRST PREDICTION, and no such alpha may be
      substituted into H-STR-002's cost model. A favourable ladder of alphas in
      {0, 1, 2} against a hypothesis predicting alpha at most 3 independent of B
      would be a property of the closure convention, not of the endomorphism.
      This is recorded BEFORE any such table can exist, and after this ruling no
      such table exists at all. DEC-20260726-006 is this program's own precedent
      for an instrument measurement being recorded as a mechanism result.
    and_the_converse_is_ALSO_not_evidence: >-
      ADOPTED FROM THE RED TEAM. An UNFAVOURABLE ladder would not be evidence
      against H-STR-002 either: under the derivation, alpha above 2 at any cell
      means the driver, the builder or the collector failed. BOTH DIRECTIONS ARE
      INSTRUMENT FINDINGS, and that symmetry is the definition of a
      non-diagnostic instrument. It is the honest content of this batch.
    THE_FINDING_THAT_SETTLES_IT_IN_THE_OPPOSITE_DIRECTION_FROM_RESCUE:
      title: >-
        THE VERDICT IS SET BY A FREE CHOICE OF NULL CONVENTION, IN BOTH
        DIRECTIONS. This is the red team's sharpest finding, it is stronger than
        the ruling's own reason, and it is ADOPTED.
      the_computation: >-
        Arm E-prime's closure is a POSITIONAL permutation while arm A-prime's is
        the committed MULTIPLICATIVE map, and the frozen specification declares
        that mismatch itself. Consider instead the other defensible null, which
        the specification names and discards - the committed MULTIPLICATIVE
        closure with the filter off, applied to a RANDOM factor base. The
        specification asserts that a random factor base is almost never closed
        under multiplication by zeta3 and that the closure would emit empty rows
        at every cell. Running the same square-branch row computation on the
        resulting stream gives D[3j] = r'_j, D[3j+1] = 0,
        D[3j+2] = minus sigma-inverse . r'_j and
        D[3q] = r'_q - sigma-inverse . r'_q, whose rank is generically
        2q = 2(B-1)/3, that is Theta(B) AND NOT O(1).
      the_consequence: >-
        THREE DEFENSIBLE NULL CONVENTIONS GIVE THREE DIFFERENT ANSWERS ON THE
        SAME INSTANCE. No closure gives alpha of order B, which is the
        EV-STR-001 baseline the prediction actually cites; the committed
        multiplicative closure with the filter off gives about 2B/3; the
        positional sigma closure gives at most 1. UNDER TWO OF THE THREE,
        H-STR-002's FIRST PREDICTION READS AS CONFIRMED WITH A LARGE
        SEPARATION. Under the third it reads as vacuous. NOTHING IN THE
        MATHEMATICS OF THE CURVE SELECTS AMONG THEM.
      why_this_STRENGTHENS_the_stand_down_rather_than_breaking_it: >-
        It makes the instrument WORSE than vacuous. The ruling's stated reason
        was that the criterion carries no information because a null object
        satisfies it identically. The stronger and more accurate statement is
        that alpha on a closure-generated row list is A FUNCTION OF THE CLOSURE
        CONVENTION IN BOTH ARMS, the convention is A FREE PARAMETER OF THE
        EXPERIMENT, and it DETERMINES THE SIGN OF THE REPORTED SEPARATION. An
        instrument whose verdict is chosen by the experimenter's convention
        cannot be repaired by an amendment and cannot be rescued by running it.
      what_it_does_NOT_license: >-
        IT DOES NOT LICENSE RUNNING THE MULTIPLICATIVE NULL, and none is
        authorized. That arm appends literal all-zero rows, its Theta(B) is an
        artifact of counting zero rows as rows, it is degenerate exactly as the
        specification says, and it would be a THIRD ARM, which
        DEC-20260727-009's `two arms and nothing else` forbids and which
        RULE-BATCH014-SCOPE ruled constrains the arms.
    the_control_is_matched_exactly_where_it_is_uninformative: >-
      ADOPTED FROM THE RED TEAM as a cleaner statement of the instrument's
      problem than `the null satisfies the bound`. At the seven residue-one
      cells the two arms differ in TWO variables - the factor base AND the
      closure index map - which the frozen specification declares in advance. At
      the seven residue-zero cells the closures DO coincide as index maps and
      the control IS matched - and there the derivation gives alpha = 0 exactly
      for BOTH arms. SO THE CONTROL IS MATCHED EXACTLY WHERE IT IS UNINFORMATIVE
      AND UNMATCHED EXACTLY WHERE A DIFFERENCE COULD HAVE APPEARED.
    what_is_NOT_asserted_here: >-
      NOTHING ABOUT THE MECHANISM, in either direction. NOTHING about the cost
      claim: no time, no memory, no operation count, no density penalty and no
      baseline is derived or measured anywhere in this batch. RT-CM-1 through
      RT-CM-6 REMAIN OPEN AND UNTOUCHED, and all four asymptotic-claim promotion
      gates remain OPEN.

