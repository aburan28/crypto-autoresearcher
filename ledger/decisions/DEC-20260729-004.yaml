  validator_narrowings_adopted_verbatim:
    source: >-
      VAL-20260729-003, TASK-20260729-046,
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-014/reviews/TASK-20260729-046/validation_report.yaml
      and recount_note.md. ALL EIGHT ARE ADOPTED VERBATIM, NOT PARAPHRASED, AND
