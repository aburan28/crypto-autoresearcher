    N1: >-
      The displacement-row derivation is confirmed by a fourth independent
      session and it holds under two named preconditions rather than
      unconditionally. It requires that the square branch of
      _measure_displacement_rank is entered, which needs at least as many rows as
      columns, and it requires that the measured rows are exactly a concatenation
      of ordered closure triples aligned to row indices 3j, 3j+1, 3j+2. Breaking
      either precondition raises the measured rank from 1 to between 8 and 14 on
      the same code. Both preconditions are named in the frozen contract and
      neither depends on D-3.
    N2: >-
      The bounds alpha(A-prime) at most 2 and alpha(E-prime) at most 1 are
      statements about cells with B mod 3 = 1. They do not extend to B mod 3 = 2,
      where an independent check of the same committed function returned
      alpha(A-prime) of 3 and 4 and alpha(E-prime) of 2. No declared cell has
      B mod 3 = 2, so the contract's scope restriction is correct and necessary
      rather than merely cautious.
    N3: >-
      The arm E-prime limb of the derivation is independent of D-3, and in the
      stronger form alpha(E-prime) is at most the column count modulo 3, hence at
      most 2, whatever the factor base is and whatever its length. The
      non-discrimination finding therefore does not inherit D-3's unverified
      status. D-3 itself remains unverified at B = 192 and B = 193 and no record
      of this batch may treat it as established.
    N4: >-
      The result of tools/allocate_id.py on an RT identifier is a null result.
      The tool matches identifiers against file names only, its search globs
      exclude the coordination tree where every review report lives, and RT is
      absent from its prefix table, so it cannot detect an RT collision under the
      current layout. Every statement in this batch that an RT identifier was
      searched free or reported free is unsupported by that tool and must be read
      as an unverified assertion. Adjudicating SUP-BATCH014-C requires a
      content-level search, which this report performed and records.
    N5: >-
      The TASK-20260729-042 review keeps report id RT-20260729-034, which is the
      id it declares in both of its files and the id the queue and the goal record
      reserve for it. The TASK-20260729-043 receipt's verdict_source of
      RT-20260729-036 is a mis-citation in an immutable record and is corrected by
      supersession rather than by edit. RT-20260729-036 is borne by no authored
      report and must never be issued to one, since it now names the -042 review
      inside a committed receipt; the next report identifier in this lineage is
      RT-20260729-037 or above.
    N6: >-
      The O-2 pre-flight is confirmed exactly, including the derived seeds, the
      multipliers, both gcd values and both distinct-target bounds, and this
      session additionally confirms that the distinct target x-coordinate count
      equals the distinct-k bound of 183 for CURVE-J12S1 rather than being halved
