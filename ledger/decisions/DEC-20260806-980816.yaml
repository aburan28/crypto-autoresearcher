coordinator_decision:
  id: DEC-20260806-980816
  decided_by: coordinator
  decided_at: '2026-08-06'
  decision: refine
  target_ids:
  - GOAL-HQC-001
  - EXP-HQC-982268
  - H-HQC-18d1b4
  - EV-HQC-7e4b28
  context: BATCH-c5703d produced a proposed v2 amendment repairing the four defects EV-HQC-75c05b recorded,
    then had it reviewed by an independent validator (TASK-20260806-301f68, ADMIT WITH REQUIRED CORRECTIONS)
    and red team (TASK-20260806-42c153). The snapshot was committed and verified BEFORE either reviewer
    was dispatched, restoring the ordering BATCH-6fddee inverted.
  rationale:
  - 'THE AMENDMENT IS NOT ADMITTED, AND THE REASON IS NOT ITS DIRECTION BUT ITS ARTIFACT. Both reviews
    independently reach the same shape: the repair is right in approach and unusable as encoded. Admitting
    it would put a rule into force whose transcribed constants realize 0.610 / 0.419 / 0.551 percent size
    at k=2 against a declared [0.002,0.004] gate -- a rule that fails its own acceptance test, in the
    artifact that governs execution.'
  - VF-1 IS DECISIVE ON ITS OWN. Five-decimal rounding truncates 4.8-8.6 percent off half-widths of order
    1e-5 bits. The calibration is correct; the encoding of it is not; and only the encoding runs. This
    is the exact class of defect the batch existed to remove, reappearing one level down.
  - VF-3 IS DECISIVE INDEPENDENTLY. PS-A carries no q-sensitivity rows at all, its 3*SE(q-hat)/q-hat is
    3.33 percent against 0.06-0.12 percent elsewhere, and at plus/minus 3 SE its k=2 and k=3 cells leave
    the acceptance band. Those two cells are precisely what the amended success criterion funds, so the
    amendment is untested exactly where it is load-bearing.
  - THE NEW PRIMARY CONTROL IS BLIND TO THREE ADVERTISED DEFECTS, FOR A STRUCTURAL REASON. The red team
    injected eight variants into the real instrument over 400,000 trials and CTRL-POSHOM missed off-by-one
    truncation, an interleaved block partition, and a last-block window read one coordinate early -- all
    listed on its catch side. The ring-shift invariance that FORCES the null also protects every shift-equivariant
    defect. Relisting will not fix that; a control with a different invariance is needed for that defect
    class.
  - THE RULE IS CALIBRATED FOR THE NULL IT WAS FIT ON. The red team exhibited a law at total variation
    8.9e-5 from the calibration binomial on which log2 A_16 is identically 0. Size at the calibration
    point is necessary and is now established; size in a neighbourhood of it is not, and the falsification
    criterion needs the latter.
  - WHAT IS ESTABLISHED IS GENUINELY ESTABLISHED, AND THE BATCH IS NOT A FAILURE. R1 replicates under
    an independent re-implementation; the binomial equivalence is exactly true; R3 is confirmed in full
    with an honest negative answer; R4's arithmetic is exact and PS-R3 dominates PS-R1 on both resolution
    and cost; and R5 now actually passes because the validator ran the gate the producer had only specified.
    Three of five repairs are sound.
  - 'A CORRECTION THIS PROGRAM OWES ITSELF: the OBJ-3 dispute is agreement, not correction. The earlier
    red team''s 5.4x is a variance ratio; the producer''s 1.78-2.33x are SD ratios and square into that
    range. The producer''s diagnosis (wrong q, not wrong formula) is a real refinement worth keeping.
    The Coordinator''s own interim batch report repeated the "correction" framing without checking units
    and is corrected here and in EV-HQC-7e4b28.'
  evidence_refs:
  - EV-HQC-7e4b28
  - EV-HQC-75c05b
  - RUN-HQC-982268-STAGEA-a
  - coordination/goals/GOAL-HQC-001/batches/BATCH-c5703d/reviews/TASK-20260806-301f68/validation_report.yaml
  - coordination/goals/GOAL-HQC-001/batches/BATCH-c5703d/reviews/TASK-20260806-42c153/red_team_report.md
  limitations:
  - NO statement about HQC, its decoding-failure rate, assumption A17 or A5, or any standardized parameter
    set. Claim tier stays toy.
  - H-HQC-18d1b4 UNCHANGED at proposed. No measurement arm has ever run under this contract.
  - experiments/EXP-HQC-982268/specification.yaml is NOT amended by this decision. The v2 amendment remains
    a proposal.
  - The CTRL-ORACLE pass has zero slack at its 40-cell coverage floor.
  - The red team exceeded its wall-clock authorization by about 40 percent and disclosed it. The findings
    stand on their artifacts; the breach is recorded and the next card sizes review budgets from these
    measured actuals rather than from estimates.
  - None of the four asymptotic-complexity promotion gates is engaged; none is claimed.
  knowledge_promotion:
    promoted: []
    not_warranted: 'Strength is preliminary and the subject remains one contract''s apparatus. Two generalizable
      lessons are now sharp enough to be worth a KN-TECH once seen on a second instrument: (i) an invariance
      strong enough to FORCE a control''s null value also blinds that control to every defect respecting
      the same invariance -- CTRL-BS and CTRL-POSHOM are two instances of one pattern; (ii) a calibrated
      decision rule can be defeated by the transcription precision of its own constants. Recorded as the
      reason rather than deferred silently.'
  next_actions:
  - 'BATCH-8, scoped and small: (a) fix VF-1 by binding the rule to its generating procedure and seed,
    or transcribing at >=7 decimals, and re-measure the size OF THE TRANSCRIBED CONSTANTS; (b) fix VF-3
    by running q-sensitivity at every reported k and making PS-A robust across plus/minus 3 SE, or dropping
    PS-A from criterion (iv); (c) correct CTRL-POSHOM''s advertised detection list to what the injection
    test actually showed, and either add a control with a different invariance for the shift-equivariant
    class or record that class as an accepted blind spot.'
  - 'Rule on OPEN-8 explicitly: authorize k=2 as a Stage-B cell under the frozen interval, rather than
    leaving a primary measurement derivable from a diagnostics-only authorization.'
  - Then, and only then, dispatch the measurement on PS-R3 at T=1e7 (4,852 core-seconds, MDE80 0.092 bits)
    -- the set both the cost model and the review independently identify as dominant.
  - Report remaining campaign budget honestly at that point. If PS-R3 no longer fits, PAUSE on the declared
    pause condition with the shortfall named -- a budget outcome, never evidence about HQC.
