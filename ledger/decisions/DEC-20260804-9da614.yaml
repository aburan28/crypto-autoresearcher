coordinator_decision:
  id: DEC-20260804-9da614
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-070
  recorded_by_task: TASK-20260804-079
  archived_by: TASK-20260804-080
  context: >-
    BATCH-070 extended Semaev yield measurement to m=4. Pattern consistent with m=2,3:
    no systematic super-heuristic yield. H-YIELD-001 has accumulated three negative
    measurements (m=2,3,4) across p=1009..9001.

  decision: weaken_h_yield
  target_ids: [GOAL-ECDLP-001, H-YIELD-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5). GOAL-ECDLP-001 is the goal id this
    record's own goal_id field declares. H-YIELD-001 is named by the record's own
    structured state_changed_fields entry, "H-YIELD-001.status: specified ->
    weakened", and by its h_yield_001_transition block; it is included because the
    record itself, not this repair, identified it as the transitioned target. No
    other id was lifted from the prose.

  decision_scope: >-
    H-YIELD-001 moves from `specified` to `weakened` at the following scoped claim:
    "m-fold Semaev decomposition yield EXCEEDS B^m/(m!N) for m in {2,3,4} at
    prime-field curves with p ∈ {1009, 4001, 9001}."
    Three independent measurements all show ratio ≤ 1.0 at p=4001 and p=9001.
    The small-p ratio > 1.0 at p=1009 is consistent with known finite-field corrections.

    WHAT REMAINS OPEN: Super-heuristic yield for m≥5, for larger primes, or for
    specifically structured factor bases (non-uniform x-coordinate distribution).
    H-PSEUDO is still not proved or disproved.

    GOAL-ECDLP-001 stays active.

  h_yield_001_transition:
    from: specified
    to: weakened
    scope: >-
      m in {2,3,4} at p in {1009, 4001, 9001}. Yield ≤ heuristic for p≥4001.
      Scoped negative: does not close m≥5 or larger primes or structured FB.

  exact_next_action: >-
    BATCH-071: Consolidate all negative yield evidence, update the boundary map,
    and check if H-YIELD-001 weakening triggers any cascade on other hypotheses.
    Then continue with fresh ideation targeting any direction not yet explored
    (e.g., m=5 yield, or new structural ingredient from external literature).

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Weakened at toy scale m=2..4 only. Need m≥5 and larger primes for full picture.

  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2
    sota_delta: {time_exponent: not_applicable}
  claim_ceiling: toy
  official_research_state_changed: true
  state_changed_fields: ["H-YIELD-001.status: specified -> weakened"]
  decided_by: coordinator
  decided_at: '2026-08-04'
