  rationale:
    - >-
      M-1..M-3 ARE COMPLETE AND CORRECT AS DRAFTED. Each names the frozen
      clause it supersedes, with line numbers (supersedes_fields, lines
      91-133). Each gives its reason and budget impact, and none loosens a
      criterion that could have been met. M-1 removes a rate measurement that
      tests nothing the hypothesis states. M-2 turns silent reclassification
      into flagged outcomes behind a blocking completeness control. M-3 is a
      clarification of a frozen branch.
    - >-
      F-1 IS REAL, AND IT IS A HYPOTHESIS-LEVEL DEFECT. The design act was
      right not to amend it by experiment amendment. Swapping in a different
      observable without correcting the heuristic would restate the heuristic
      by another route (the draft cites AMD-EXP-SEMBIN-4fa22c-20260921-lemma4
      on this point). The correction is filed first. The restated object then
      goes into a draft that a later decision approves on archived bytes.
    - >-
      THE KNOWN M-FACTORIAL MIS-ANCHOR IS CARRIED, NOT FIXED. The draft's
      option (a) notes that, under any square-subsystem reading, the frozen
      "raw <= 8^4 = 2^12" (specification line 269) has the same m!-type
      mis-anchor as 05ff43's K7: S4 ~ 8^4 is the Bezout number of total degree
      8 in 4 variables, and raw ~ 4! 8^4 ~ 2^16.6 is the box mixed volume.
      The F3 ratio threshold 2^3 survives. This is the Coordinator's
      derivation and is unreviewed. It is passed to the v3 design through
      CORR-20260923-5d5724 as a constraint, and it is not scored here.
    - >-
      WHAT THIS COSTS AND WHAT IT DOES NOT. C2's (queries, work) pair for
      both curves is delayed until v3 is approved and the run completes. The
      delay is bounded by the 05ff43 v2 window, which the host would impose
      anyway. The rate, query and instruction outputs are not given up, and
      option (b) stays open as a recorded fallback (f1_disposition).
      Evidence: the frozen texts above, the TASK-20260923-64faac receipt's
      spot-checks, and object A (TASK-20260923-404bf9). Test boundary: nothing
      was run for this decision. Revisit condition: the v3 approval decision,
      or a record that the v3 design found no approvable object. Successor:
      /run EXP-GFPN-659e34 under a superseding executor card.

