    - >-
      Nothing was run. The F-1 finding is structural (an overdetermined
      system on random targets). It rests on the frozen texts and on the v1
      m = 4 observation of a different experiment that shares the driver
      (0/20, D undefined). It is not a measurement of this contract.
    - >-
