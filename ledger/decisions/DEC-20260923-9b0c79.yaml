  in_file_status_note: >-
    The amendment file keeps `status: draft` and `approved_by: null`. It is
    hash-bound and not edited. Its approval_note (lines 44-48) makes a
    committed decision the approving act and requires that decision to
    dispose of F-1. Both are done here. An in-file approved status is not
    required.
  run_authorized: false
  run_authorized_note: >-
    NOT AUTHORIZED. The amendment's rulings_consequence (lines 336-344) makes
    /run conditional on three things: M-1..M-3 approved (done), F-1 disposed
    of (done, by option (a), whose second half is not yet written), and the
    driver and object-A control confirmed in the run plan (BC-1, BC-2). Under
