  context: >-
    DEC-20260923-d86ff2 held /run EXP-GFPN-659e34 pending TASK-20260923-aa277e's
    ruling on two things: its arm (iii), which is the same norm construction
    as 05ff43's (CORR-20260923-064d0d), and its reused m = 4 driver's two
    silent loss paths (object A, red team TASK-20260923-404bf9). The design
    act ruled that a companion amendment is needed (05ff43 draft
    rulings.DC-8) and drafted it. The design act also FOUND AND FLAGGED F-1:
    the cost ladder measures "the FGLM ideal degree D_4 per arm ... on 20
    random X_r per cell without requiring success" (659e34 specification
    lines 80-85, 141). But the descended n = 5, m = 4 system is overdetermined
    (5 equations in 4 unknowns; JV lines 678-680), so on a random X_r its
    ideal is generically the unit ideal and D_4 is undefined. The v1 m = 4
    random cells of 05ff43 recorded exactly this: 0/20, D undefined
    (implementation.md lines 251-255). The dispatcher verified that citation
    and the 659e34 lines (TASK-20260923-64faac receipt).

  judgement_of_M_clauses:
    M-1: >-
      APPROVED. Arm (iii) as built is the norm construction (H-GFPN-3366ea
      lines 69-75; CORR-20260923-064d0d). It is kept on the cost ladder as
      `torsion_S4_norm`, a labelled negative control whose group is
      (Z/2)^4 x| S_4 of order 384, never 192. Its signature is checked
      structurally: the 495-monomial support, and a per-round F4 shape
      identical to S4's on the same X_r. Neither needs D_4. It is dropped
      from the rate ladder, as DEC-20260923-d86ff2 permits. Its rate is a
      property of the norm construction, and about 192 p' expected attempts
      would meet the frozen cap of 8 x 24 p' (specification line 147).
      TASK-20260921-838c4a's gate "arms (i)(ii)(iii) attempted on
      EcGFp5-shaped cells" (line 165) is read as met by the cost-ladder
      negative control. H-GFPN-3366ea's torsion prediction (at least 2^2 below
      S4) is untested by this contract until a genuine quotient arm is added
      (F-4).
    M-2: >-
      APPROVED. It adds three things: explicit outcome classes
      (positive_dimensional and degenerate_parametrisation are never
      non-decompositions and are excluded from the rate's numerator and
      denominator); back-substitution of every parsed solution; and an
      independent meet-in-the-middle decomposability check on every flagged
      attempt. The object-A completeness control stays BLOCKING before the
      rate ladder, with both PASS conditions: the verified count on 1400
      targets inside [4, 21], and zero silent misses on the 324-target
      completeness set. These repair the two loss paths object A found
      (295/324 recovered at p' = 11). They are the same rule as 05ff43 R-5.
    M-3: >-
      APPROVED. The DC-4 cost-unit declaration applies:
      - no F_{p'} operation counter exists for msolve;
      - executed instructions are reported as a work proxy, never converted;
      - the nnz/reduction bracket is not a bound;
      - construction, [r]X and lifting are charged identically in every arm;
      - inversion is priced at 2.57 multiplications (Pornin lines 521-523,
        verified in this act).
      The frozen work formula's C_pdp4 branch is therefore unavailable, and
      its D_4-band fallback falls under F-1.

  # --------------------------------------------------------------------------
  # F-1 DISPOSITION
  # --------------------------------------------------------------------------
  f1_disposition:
    option: a
    what_is_done_now: >-
      CORR-20260923-5d5724 is recorded on H-GFPN-3366ea. It corrects the
      heuristic's premise, which is false as written: the random_model_justification
      (lines 212-218) calls D_4,A "a combinatorial invariant of (n, m, A)",
      which fails for an overdetermined system on random targets. It records
      that HEUR-GFPN-DFLAT4 as stated (lines 206-211) is NOT EVALUABLE on the
      frozen cost ladder. It can neither pass nor fail, and a flatness figure
      computed from unit-ideal or decomposition-count degrees is vacuous and is
      never recorded as heur_dflat4_pass true. The correction names the
      constraints any restatement must meet and the candidate objects. It
      does NOT choose the new object.
    what_is_owed: >-
      A v2 -> v3 amendment of EXP-GFPN-659e34 that restates the D_4 observable
      and HEUR-GFPN-DFLAT4's object. It is designed by a zero-run design card
      that a later coordination act mints, drafted, archived by snapshot, and
      approved by a separate Coordinator decision that reads the archived
      bytes. Designing is not approving. The same draft must also dispose of:
      - F-2: jv_system_shape_anchor's "<= 329 generators" passes vacuously on
        a random X_r whose reduced basis is {1}. Strengthen it additively, for
        example with the system-and-trace identity of 05ff43 rulings.DC-5 at a
        prime where msolve -g 1 does not crash (not p' = 65551;
        CORR-20260923-1e2e67).
      - F-3: subgroup concentration (red team OOS-5). Specify a check, or
        record the limitation with its scope.
      - The work-projection formula once C_pdp4 and the D_4 band are both
        unavailable: a declared replacement, or projected_work stays null
        with the reason recorded.
      - Whether to add the genuine (Z/2)^3 x| S_4 quotient arm on the
        rescaled base (F-4). Only if 05ff43 v2 fixtures F-1..F-3 have passed
        by then; otherwise F-4 is carried forward.
    why_a_not_b: >-
      (1) The correction is warranted whatever the run mode. An approved
      hypothesis should not keep a heuristic whose stated justification is
      false for its own object, and whose flatness test would come out
      vacuous (0 = 0, or undefined). That is exactly the kind of result that
      is later read as a pass.
      (2) Option (b) knowingly spends the cost ladder (at least 3 primes x 4
      shapes x the applicable arms x 20 X_r) on a primary metric that is
      undefined by construction. It emits a projection that cannot give goal
      criterion C2's work figure. Its surviving outputs (|F|, queries, the
      rate and instruction counts) are not lost under (a); they are only
      sequenced.
      (3) Option (a) costs nothing on the goal's critical path. EXP-GFPN-659e34
      cannot run while 05ff43 v2's solver cells run (one solver process at a
      time), and 05ff43 v2 is the goal's next action. Its committed
      implementation-v2 is also the repaired M-2 driver 659e34 reuses. The v3
      design is zero-run Coordinator work that can proceed during that window
      (goal max_concurrent 2 permits a design task beside a solver lane).
      (4) The candidate replacement that follows JV most directly is F4-trace
      invariance of the full overdetermined system across the ladder. JV rely
      on it when they reuse one precomputed pair list at 16, 25 and 32 bits
      (JV lines 706-710). Choosing between it and a square-subsystem degree
      is a design choice with scoring consequences. It belongs in an archived
      draft, not in this approval.
    rejected_alternative_b_recorded: >-
      (b) is not chosen, and it stays available. If the v3 design fails to
      produce an approvable object, a later decision may authorize a run
      under (b) mechanics: every D_4-dependent output not_applicable with
      reason d4_undefined_on_random_targets, and projected_work null. That
      run would still measure |F|, the query count, HEUR-GFPN-RATE4 and
      per-attempt instruction counts. That decision would record why (a)
      failed.

  conditions:
    - id: BC-1
      name: the reused driver
      text: >-
        The m = 4 driver reused by 659e34 is the committed EXP-GFPN-05ff43 v2
