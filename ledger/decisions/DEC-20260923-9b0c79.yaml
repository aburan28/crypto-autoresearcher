      name: object-A control in the run plan
      text: >-
        The object-A completeness control (M-2) is listed in 659e34's trial
        plan as a blocking step before any rate-ladder cell. The red team's
        harness deviations are re-declared if reused.
    - id: BC-3
      name: no vacuous pass
      text: >-
        Neither jv_system_shape_anchor on a reduced basis {1} nor any D_4
        flatness figure computed from undefined or unit-ideal degrees is ever
        recorded as a pass. They are recorded not_applicable, with reason
        d4_undefined_on_random_targets or anchor_vacuous_on_unit_ideal, until
        v3 replaces them.
    - id: BC-4
      name: machine protection at dispatch
      text: >-
        TASK-20260921-838c4a carries budget memory_gb 16, which exceeds this
        host's roughly 15.7 GiB of physical RAM with no swap. That card is
        immutable and not edited. /run EXP-GFPN-659e34 is dispatched only
        under a superseding executor card, minted by the decision that approves
        v3. That card carries the machine-protection envelope of
        DEC-20260923-e788a1 AC-1 (a 10 GiB child RLIMIT_AS read back per
        child, one solver at a time, a task envelope of at most 11 GiB) or a
        recorded larger host. It must also bind v2 and v3 by sha256.
    - id: BC-5
      name: sequencing
      text: >-
        659e34 never runs concurrently with an EXP-GFPN-05ff43 v2 solver cell,
        or with any other solver process on the host.

