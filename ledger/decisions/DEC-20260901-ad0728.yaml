coordinator_decision:
  id: DEC-20260901-ad0728

  context: >-
    GOAL-AES-003 batch-opening act by the dispatching Coordinator (session
    coordinator-aes003-1, 2026-09-01). DEC-20260901-182c3d's RANK 1 named a
    repaired-census successor proposal for IDEA-20260901-ec54fe, whose Stage 0
    fired F1 in BATCH-803af6 (EV-AES-64750e OBS-B803-1: the record's census
    object was a derivation defect; the archived anchor object is sound; the
    harness pair-difference map in the affine limit is the identity). The
    idea-generator round produced IDEA-20260901-04606c (committed 3314672e9),
    which adopts the producer's route (i) -- the identity-map census object
    A_{r,S,j} = P_j (D_r M_r) Pi_A, provably reducing symbol-for-symbol to the
    sound archived anchor object at the anchor cell -- and installs the exact
    check that voided the first object as Gate 0, firing before any census
    cell is read.

  decision: open_batch

  decision_scope: >-
    THIS DECISION SELECTS IDEA-20260901-04606c AS THE RANK-1 SUCCESSOR AND
    OPENS BATCH-fe0bdc TO EXECUTE IT.

    It opens coordination/goals/GOAL-AES-003/batches/BATCH-fe0bdc/dispatch_queue.json
    on branch aes003-batchfe0bdc-20260901 with one producer (Gate 0, the
    Stage 0/0.5 census + keyed bridge, and the single 2^30 fixture arm at the
    r=6 death-round cell per the record), snapshot, validator, and ledger
    archive cards. The goal head moves to BATCH-fe0bdc ONLY in the ledger
    archive commit after validation (BATCH-803af6 pattern), not here. It
    promotes NO knowledge and asserts NOTHING about AES beyond what the
    preregistered decision rules of IDEA-20260901-04606c return.

  target_ids:
    - GOAL-AES-003
    - RQ-AES-003
    - BATCH-fe0bdc
    - IDEA-20260901-04606c
    - IDEA-20260901-ec54fe
    - EV-AES-64750e
    - DEC-20260901-182c3d
    - DEC-20260901-b6b959
    - EV-AES-048545

  outcome: >-
    SELECTION: IDEA-20260901-04606c is dispatched as the sole producer of
    BATCH-fe0bdc. The proposal is the direct repair named by DEC-20260901-182c3d
    RANK 1, derived from the validated F1 localization, carries a blocking
    Gate-0 anchor check (the failure mode that killed its predecessor is its
    first gate), keeps Stage 0/1 scope (seconds of GF(2) algebra plus one
    2^30 arm), and its decision rule maps outcomes to the live successor
    ladder: a MISMATCH-ALIVE verdict (skeleton flat at all r while AES dies
    at r=6) hands the residual carrier to IDEA-20260901-bcb117; a defect
    verdict halts under rule 5 with no mechanism conclusion.

  rationale:
    - >-
      The proposal's census object provably reduces to the archived anchor
      object (ranks 32,0,0,0, P=1.0) at the anchor cell; the idea-generator
      verified the reduction numerically in a throwaway port before writing.
      Gate 0 makes the voided-object failure mode impossible to repeat
      silently.
    - >-
      Cost is minimal (the record asks 3600 s and <=6 runs, one producer
      slot); the fixture arm is the campaign's decisive exposure and runs
      only if Gate 0 and the census table pass. This is the cheapest
      remaining probe of the geometry-driven vs nonlinearity-driven
      dichotomy.
    - >-
      Route (ii) from the F1 localization (one-sided keep-mask statistic)
      was rejected as the census object by the proposal because it does not
      reduce to the archived anchor object; it is retained in the record as
      a future statistic candidate. Recorded here so the rejection is
      auditable, not silent.

  next_action: >-
    EXECUTE BATCH-fe0bdc per its queue: producer TASK-20260901-f5d3a4, then
    snapshot, independent validator, and ledger archive (EV-AES-ec53f1 /
    DEC-20260901-3150f0). On the producer's verdict the ledger archive
    moves the goal head and rewrites next_action along the record's
    decision rule: MISMATCH-ALIVE -> rank IDEA-20260901-bcb117
    (nonlinearity dilution) next with the residual carrier as its input;
    defect verdict -> no mechanism conclusion, return to idea generation;
    census-table mismatch -> repair or reject the object per F3. The
    remaining ladder from DEC-20260901-182c3d (02f7c4 B1-B3, 69912d, decay
    design, BATCH-6fe3c2 debt) stays ranked behind this batch's outcome.

  evidence_refs:
    - ledger/evidence/EV-AES-64750e.yaml
    - ledger/proposals/IDEA-20260901-04606c.yaml
    - ledger/decisions/DEC-20260901-182c3d.yaml
    - ledger/decisions/DEC-20260901-b6b959.yaml
    - ledger/evidence/EV-AES-048545.yaml

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED. Batch-opening act: selects a proposal and opens a
      dispatch queue. Produces no durable research claim and promotes
      nothing to knowledge/findings/.

