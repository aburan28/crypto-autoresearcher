  the_decision_stated_plainly: >-
    RUN-FROB-0b1c8e's interruption is diagnosed, honestly and without
    fabrication, as the SAME failure mode that destroyed RUN-FROB-39714f,
    RUN-FROB-f3e2a3, RUN-FROB-16ecb6, and RUN-FROB-5490f1: a
    whole-environment/container restart external to any script's own
    control, external to any timeout wrapper (there was none this time
    either), and external to any code defect in driver-v2.py/checker-v2.py.
    This is now an OBSERVED, SHARPLY WORSENING RECURRING PATTERN -- five
    consecutive launch attempts under the corrected source
    (driver-v2.py/checker-v2.py), launched correctly by the dispatching
    session every time, have each been killed by an independent
    whole-environment restart before any execution-receipt.json could be
    written, at a strictly shrinking sequence of intervals (~20 minutes,
    then ~11 minutes, then ~9 minutes, then ~7 minutes, now ~4 minutes).
    This shrinking-interval pattern is recorded here as a material, sharply
    worsening observation -- now stronger, on five points, than the
    four-point trend recorded in DEC-20260921-fd5bf1 -- because it is a real
    fact pattern relevant to anyone reading this lane's history later. It
    remains, like the five interruptions themselves, infrastructure signal,
    never negative mathematical evidence (AGENTS.md core rule 5 / CLAUDE.md
    rule 3), and this record does NOT condition its own authorization on it:
    the user has reaffirmed the standing instruction to keep retrying
    automatically through this exact failure mode twice, most recently after
    being shown this exact shrinking-interval pattern directly, and this
    coordinator's role is to execute that instruction faithfully via a
    proper decision record, not to second-guess it. All five instances
    remain non-scientific, non-protocol infrastructure signal; none says
    anything about H-FROB-73df22. On that basis, this coordinator (1)
    preserves RUN-FROB-0b1c8e's directory exactly as it stands -- its real
    partial roots.jsonl.gz (27415701 bytes) and the three further hashed
    files, the three confirmed-empty files (stderr.log, stdout.log,
    tuples.jsonl.gz), with no execution-receipt.json authored for it,
    because the absence of one IS the honest record of what happened, not a
    gap to be papered over -- and (2) authorizes a fresh retry under a
    fresh, pre-minted run_id, RUN-FROB-5fa3f0, via a fresh
    trial-plan-stage0-v9.json, a fresh run-binding, and a fresh launch
    handoff to the Executor (TASK-20260921-88ba0f), per the user's standing
    instruction to keep retrying automatically through this exact failure
    mode. (3) SEPARATELY, and NOT as a condition on (2): this record honors
    DEC-20260921-fd5bf1's own forward commitment (its NA-4) that a
    five-for-five recurrence of this identical failure mode "strongly
    warrants an explicit Coordinator operational-reliability assessment of
    the underlying platform and/or a checkpoint/resumable redesign of the
    trial." That five-for-five condition is now met. This record therefore
    recommends, as a concrete next action for the dispatching session (see
    next_actions, NA-4 below) -- run in PARALLEL with, and never blocking,
    RUN-FROB-5fa3f0's retry -- that a dedicated, non-scientific
    infrastructure-diagnosis task be opened: capturing whatever
    platform-level signal is available (e.g. dmesg/journalctl/orchestrator
    health-check logs, container lifecycle/eviction records, OOM-killer
    activity) around each of the five restart timestamps, to move this lane
    from "infrastructure signal, cause unknown" toward an actual diagnosis
    or a checkpoint/resumable redesign that would let a restart preserve
    partial progress instead of discarding it. This is a genuine escalation
    of the observation this lane has carried forward as non-blocking prose
    since DEC-20260921-54b637; five-for-five at an interval that has now
    fallen to ~4 minutes is the trigger point the prior record itself named,
    and this coordinator's role is to act on its own predecessor's stated
    trigger, not merely repeat the flag a sixth time.

  rationale:
    - >-
      FIFTH, CONSECUTIVE INSTANCE OF THE SAME FAILURE MODE, STILL
      INFRASTRUCTURE/PROTOCOL SIGNAL, NEVER NEGATIVE MATHEMATICAL EVIDENCE,
      PER AGENTS.md CORE RULE 5 / CLAUDE.md RULE 3. RUN-FROB-0b1c8e is not a
      new, seventh failure mode; it is a REPEAT of RUN-FROB-39714f's,
      RUN-FROB-f3e2a3's, RUN-FROB-16ecb6's, and RUN-FROB-5490f1's own
      whole-environment-restart mode -- entire process tree destroyed,
      including the Python supervisor that would have written
      execution-receipt.json, before that supervisor's own
      completion/receipt-writing logic could run at all. This is the
      SEVENTH interruption overall in this lane's history and the FIFTH
      consecutive occurrence of the identical infrastructure failure mode
      under the same, already-corrected source and launch procedure.
      Five-for-five launch attempts under driver-v2.py/checker-v2.py have
      now been killed by whole-environment restarts, all non-scientific,
      non-protocol infrastructure signal. Neither RUN-FROB-0b1c8e,
      RUN-FROB-5490f1, RUN-FROB-16ecb6, RUN-FROB-f3e2a3, nor
      RUN-FROB-39714f says anything about H-FROB-73df22, RQ-FROB-7d8dd4, or
      whether Frobenius structure moves the index-calculus exponent.
    - >-
      NO FABRICATED RECEIPT. This decision does NOT author an
      execution-receipt.json for RUN-FROB-0b1c8e, and does not construct,
      estimate, or infer one from the partial roots.jsonl.gz or from what a
      graceful interruption receipt would ordinarily contain. Per AGENTS.md
      core rule 5 ("Never fabricate commands, outputs, timings, statistics,
      citations, or runs. Missing data stays missing and is reported as
      such."), the honest record of RUN-FROB-0b1c8e is exactly what is on
      disk: real partial output (roots.jsonl.gz, 27415701 bytes), three
      further hashed adapter/launch files (command.txt, environment.json,
      launch.json), three confirmed-empty files (stderr.log, stdout.log,
      tuples.jsonl.gz -- all the well-known empty-file sha256), and a
      documented absence of every downstream adapter/checker artifact,
      because the process that would have produced them was destroyed before
      it could run. RUN-FROB-0b1c8e's directory, as it stands right now, is
      preserved as-is by this decision. No file within it is edited,
      completed, or backfilled by this record.
    - >-
      THE RUNTIME LOCK BEING CITED REMAINS THE SAME, STILL-CURRENT, STILL-
      UNEDITED, LAUNCH-AUTHORIZED LOCK. This coordinator independently
      re-read linux-runtime-lock-successor-20260914-c85f6a.json in full in
      this engagement and reconfirms scientific_launch_authorized: true and
      its content sha256
      46d918a1a4b9d358df39f09a87d5221128cc1ce19cb62672bc35204785952eb5,
      cross-checked against trial-plan-stage0-v8.json's own already-filled
      runtime_lock_sha256 field (both agree). Nothing about the runtime, its
      guards, or its authorization changes here; a fifth whole-machine
      restart is not evidence the runtime lock's own guards were inadequate
      -- the failure is again a whole-machine restart, a class of event no
      per-process guard in linux-runtime-lock-successor-20260914-c85f6a.json
      claims to protect against, and this record does not construct a new
      claim that it does.
    - >-
      WATCHDOG SIZING RATIONALE REMAINS VALID, UNCHANGED. No run in this
      lane has ever shown signs of hanging or needing a shorter or longer
      watchdog; all seven interruptions observed to date have each been
      either an instant application-level error, an external interruption
      from this lane's own now-corrected tooling, or (five times now) an
      infrastructure restart external to any process's own control -- never
      a hang. 86400 seconds remains sized generously above the only real
      duration signal available and remains a ceiling meant never to bind in
      the normal case, machine protection only per CLAUDE.md "Research
      budgets: progress first."
    - >-
      DIRECTION CHECK, unchanged from the whole DEC-20260909-bf5b48 ..
      DEC-20260921-fd5bf1 chain. Stage0 is not itself exponent-moving; it is
      the correctness gate for H-FROB-73df22's two arms. No scientific claim
      of any kind is advanced by this admission/retry-authorization record.
      FROB is a declared ECC area (orchestration/research-priority.yaml line
      79), ranked ahead of non-ECC candidates at every selection point, with
      unlimited batch/wall-clock budget per AGENTS.md "ECC comes first."
    - >-
      BUDGET. Per CLAUDE.md "Research budgets: progress first" (2026-09-06):
      research cost estimates are advisory and require no repeated user
      approval; the Coordinator continues justified work within the
      authorized research scope. No 90-day stagnation review is active or
      warranted -- this lane has shown continuous documented progress across
      DEC-20260909-bf5b48 through DEC-20260921-fd5bf1 and now this record,
      all within roughly two weeks, including five genuine, correctly-
      executing partial runs each destroyed only by infrastructure external
      to this program's own control. Authorizing a further retry after a
      fifth, consecutive infrastructure-only interruption is exactly the
      kind of routine continuation CLAUDE.md's "progress first" instruction
      protects, not a new spending decision requiring fresh justification.
      This is additionally, and explicitly, covered by the user's own
      standing instruction, relayed by the dispatching session, to keep
      retrying automatically through this exact recurring failure mode --
      stated TWICE now, most recently after being shown the shrinking-
      interval pattern directly. This coordinator's role is to execute that
      instruction faithfully via a proper decision record, not to
      second-guess it. A whole-machine restart mid-run is squarely within
      "watchdog expiry checkpoints a task; it does not exhaust the
      campaign."
    - >-
      FIVE-FOR-FIVE TRIGGER MET -- ESCALATED FROM OBSERVATION TO A CONCRETE
      RECOMMENDED NEXT ACTION, STILL NOT A BASIS FOR WITHHOLDING
      AUTHORIZATION. Five consecutive launch attempts under the identical
      corrected source and identical launch procedure have now been killed
      by the identical infrastructure failure mode, at a strictly shrinking
      sequence of intervals: roughly 20, 11, 9, 7, and now 4 minutes. This
      is materially stronger than the four-point trend flagged in
      DEC-20260921-fd5bf1, and DEC-20260921-fd5bf1's own NA-4 already named
      "five-for-five" as the point at which this coordinator should treat
      the pattern as "strongly warranting an explicit Coordinator
      operational-reliability assessment of the underlying platform and/or a
      checkpoint/resumable redesign of the trial." That condition is now
      met. This decision therefore does two distinct things with two
      distinct statuses: it authorizes RUN-FROB-5fa3f0 unconditionally, per
      the user's twice-reaffirmed standing instruction, exactly as its four
      predecessors did; and it separately, non-blockingly, recommends (NA-4)
      that the dispatching session open a dedicated infrastructure-diagnosis
      task, to run in parallel with the retry, not gating it. Continuing to
      only restate the observation a sixth time without ever acting on the
      trigger condition the coordinator itself set would itself become a
      failure to pursue a plausible lead in good faith (AGENTS.md core rule
      9) -- not about H-FROB-73df22, but about the operational reliability
      of the platform this whole lane depends on. Recommending, not
      mandating or blocking, is the correct instrument here: this
      coordinator has no shell and cannot itself run diagnostics, and the
      user's standing instruction to keep retrying automatically is
      unambiguous and freshly reaffirmed, so this decision does not
      override it.

