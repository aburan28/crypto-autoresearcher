coordinator_decision:
  id: DEC-20260921-1988f5
  decided_by: coordinator
  decided_at: '2026-09-21'

  context: >-
    Continuation of the EXP-FROB-d8aa37 stage0 launch lane, immediately
    following DEC-20260921-fd5bf1's diagnosis of RUN-FROB-5490f1's
    interruption (FOURTH, CONSECUTIVE whole-environment/container restart)
    and its authorization of trial-plan-stage0-v8.json under a fresh run_id,
    RUN-FROB-0b1c8e. The dispatching session claimed TASK-20260921-166063 and
    launched RUN-FROB-0b1c8e correctly -- correct PATH, genuinely
    backgrounded, no external tool-call-duration timeout wrapper.
    RUN-FROB-0b1c8e was ALSO interrupted, by the exact same failure mode: a
    FIFTH, consecutive whole-environment restart, independently confirmed by
    the dispatching session via /proc/uptime showing the machine had been up
    only ~12.24 seconds when checked. This time it happened even faster: only
    ~4 minutes after launch (versus ~20 minutes for the first restart, ~11
    minutes for the second, ~9 minutes for the third, ~7 minutes for the
    fourth). Same signature as before: the entire process tree, including the
    Python supervisor itself, was destroyed mid-run, before any
    execution-receipt.json could be written. TASK-20260921-166063's claim
    (which held RUN-FROB-0b1c8e's write_scope) has already been released as
    failed with this same disclosure by the dispatching session.
    This coordinator has no shell and cannot independently recompute any
    hash, re-check process state, or re-read /proc/uptime; the five cited
    hashes (command.txt, environment.json, launch.json, roots.jsonl.gz, and
    the well-known empty-file hash shared by stderr.log/stdout.log/
    tuples.jsonl.gz) and the uptime reading are accepted as
    reported_by_session (see verification block below). This coordinator DID
    independently verify, by listing experiments/EXP-FROB-d8aa37/runs/
    RUN-FROB-0b1c8e/ directly with its own Glob tool in this engagement, that
    it contains exactly seven entries -- launch.json, command.txt,
    stdout.log, stderr.log, environment.json, tuples.jsonl.gz,
    roots.jsonl.gz -- and that NO execution-receipt.json, manifest.yaml,
    raw-result.json, fixtures.json, metrics.json, certificates.json,
    report.md, check.stdout.log, or check.stderr.log exists at that path.
    This is not trusted from the requesting account; it is this
    coordinator's own read of the actual committed working tree, identical
    in method to the equivalent checks this coordinator ran on
    RUN-FROB-5490f1's directory in DEC-20260921-fd5bf1, on RUN-FROB-16ecb6's
    directory in DEC-20260921-54b637, on RUN-FROB-f3e2a3's directory in
    DEC-20260921-77e8bc, and on RUN-FROB-39714f's directory in
    DEC-20260919-eb9f07.
    This coordinator also independently re-read
    coordination/frobenius/BATCH-2f8435/admission/linux-runtime-lock-successor-20260914-c85f6a.json
    in full: it still shows scientific_launch_authorized: true, unedited,
    with the lock file's own content sha256
    46d918a1a4b9d358df39f09a87d5221128cc1ce19cb62672bc35204785952eb5 (the
    lock contains no internal self-hash field; this is the file's own
    content hash, computed externally) cross-corroborated by this
    coordinator against trial-plan-stage0-v8.json's own already-committed
    runtime_lock_sha256 field, which cites the identical value. This
    coordinator also re-read DEC-20260921-fd5bf1, trial-plan-stage0-v8.json,
    run-binding-stage0-v8-retry-20260921.json, and TASK-20260921-166063.yaml
    in full as the immediate predecessor records and templates for this
    record's own amendment.

