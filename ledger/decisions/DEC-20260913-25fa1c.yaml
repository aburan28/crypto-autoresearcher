  citations:
    - ref: KN-LIT-fa346d
      provenance: retrieved
      claim: >
        This program's read record of ePrint 2015/310, written from the frozen
        full text: the chained S_3 construction of Section 3, Assumption 1
        (d_F4 <= 4) in Section 4.4, the weaker Assumption 2 (d_F4 =
        o(sqrt(n/ln n))) in Section 4.6, the yield model of Section 4.3 including
        eq. (11), the two-stage balance of eqs. (15)-(17) with c ~ 1.6986, Tables
        1-3, and the Section 4.5.2 four-curve conclusion.
      verified_by: >
        coordinator, 2026-09-13; read inputs/SEMAEV-2015-310/paper_fulltext.md in
        full and independently recomputed the Table 3 columns and the balance
        m* ~ sqrt(2 ln 2 n / ln n) before opening either goal
    - ref: KN-LIT-e77232
      provenance: internal
      claim: >
        The ePrint comment thread: Galbraith's memory objection at n = 571,
        m = 12; Semaev's sparse recount in reply; Semaev's own 2015-04-20 note of
        possibly redundant degree-5/6/7 steps at the end of his n = 40, m = 2
        runs; and Kosters' 2015-05-02 report of step degree 5 at n = 45,
        m = t = 2 at 126 GB and an unfinished n = 25, m = t = 3 run at 111 GB.
        This is the record that makes the definitional question (a) concrete
        rather than pedantic.
      verified_by: coordinator, 2026-09-13; read the corpus record in full
    - ref: KN-TECH-006
      provenance: internal
      claim: >
        Fixes the baseline these goals must charge against: van Oorschot-Wiener
        parallel collision search with distinguished points, ~0.886*sqrt(q) group
        operations serial, ~sqrt(q)/M wall-clock on M processors, small
        per-processor memory, and the program convention that a claimed
        improvement must beat the fully-charged PARALLEL cost rather than an
        idealized serial count.
      verified_by: >
        coordinator, 2026-09-13; read knowledge/techniques/KN-TECH-006.md and
        knowledge/literature/KN-LIT-012.md in full. KN-LIT-012 records that the
        primary paper's full text was not re-read, so the constant 0.886 and the
        near-linear speedup are relayed and the latter rests on the usual
        random-walk heuristic.
    - ref: KN-LIT-7607
      provenance: internal
      claim: >
        Huang-Kosters-Yeo introduce the last fall degree, argue that
        subexponential ECDLP claims depend on the first fall degree assumption,
        and construct a summation-based Weil descent system in which that
        assumption is unlikely to hold. The corpus record carries a standing
        consequence for this program: no proposal may claim as new either that
        Weil-descended Semaev systems violate the semi-regular prediction or that
        the resulting degree deficit is bounded in system size, without citing
        this entry and KN-LIT-7605 and stating what it adds. Both goals inherit
        that constraint.
      verified_by: >
        coordinator, 2026-09-13; read knowledge/literature/KN-LIT-7607.md in
        full. The paper itself was not opened and the record is marked confidence
        `reported`.
  limitations:
    - >
      This decision opens questions. It asserts nothing about whether Assumption
      1 holds, whether the 2^{1.6986 sqrt(n ln n)} bound is correct, or whether
      any binary curve is affected. The paper's mathematics is not challenged
      here and no result of this program contradicts it.
    - >
      Reading a paper and recomputing its published arithmetic is not
      independent verification of that arithmetic. The Table 3 recomputation
      behind this decision reproduced the paper's own formulas; where it did not
      reproduce a printed value the discrepancy is recorded as an ambiguity in
      the formulas' reading (k as n/m versus ceil(n/m)), NOT as an error in the
      paper, and resolving it is assigned to EXP-SEMBIN-81dc96 rather than
      asserted here.
    - >
      The retrieval index was unavailable in this session, so the novelty screen
      behind these goals was grep plus directed reading only. Absence of a hit is
      not evidence that something was not tried. That limit already produced one
      recorded miss: three sources the ideation lane marked `recalled` were in the
      corpus all along.
    - >
      No goal opened here may be marked completed on this decision. Each
      criterion requires its own committed decision carrying a measurement or a
      derivation with its scope stated.
  next_actions:
    - >
      Approve the frozen protocols under standing user authorization once
      complete; that is a separate decision (DEC-20260913-ebd639), because
      opening a question and approving a protocol against it are different acts
