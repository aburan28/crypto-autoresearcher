    experiment_status_changed: false
    area_declared: SEMBIN
  rationale:
    - >
      ECC comes first and its budget is unlimited (AGENTS.md, user instruction
      2026-09-04). SEMBIN is declared as an ECC area in
      orchestration/research-priority.yaml and is read through
      tools/ecc_priority.py, never inferred from the identifier prefix. Both goals
      therefore carry maximum_batches: null and total_wall_clock_seconds: null.
      max_concurrent stays at 2, which is machine headroom and not a research
      budget.
    - >
      TWO goals, not one, because the two lanes have different failure modes and
      would corrupt each other's ranking inside one queue. GOAL-SEMBIN-5078bc
      audits: it measures a published quantity and can only confirm, bound, or
      fail to reach the paper's cells. GOAL-SEMBIN-cbf422 develops the
      construction forward and can produce a variant the paper does not contain.
      An audit lane that also owns the mechanism work will always rank the cheap
      confirmatory measurement first, because it is cheap; separating them keeps
      the forward work from being crowded out by its own audit.
    - >
      THREE questions because the yield model is independent of both lanes.
      RQ-SEMBIN-ade131 asks whether eq. (11) states realized decomposition yield
      or an upper bound on it, and that question inherits no degree assumption at
      all -- it is answered by counting, not by solving. Filing it under the audit
      goal for execution while keeping it a separate question preserves that
      independence; a yield result must stay usable whatever happens to
      Assumption 1.
    - >
      The three open problems were written BEFORE the goals, from the frozen text,
      so the completion criteria could be stated against them rather than against
      whatever the first measurement happened to produce. Each criterion is
      satisfiable by either answer -- a stated map between d_F4 and the
      Macaulay-rank D closes the first criterion whether the two turn out to be
      the same quantity or provably different -- and unreached cells count as
      satisfying it when listed with their impediment. This is deliberate: a
      criterion only one outcome can meet is a criterion that pressures the
      measurement.
    - >
      Both goals record that tooling readiness, design intake, and an assembled
      ideation batch satisfy NO completion criterion. That clause exists because
      an unlimited ECC budget is the strongest invitation to make-work this
      program has, and the honest failure mode here is a campaign that reports
      progress in records authored rather than in quantities measured.
