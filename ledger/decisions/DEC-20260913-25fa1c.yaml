  decision_label: open_SEMBIN_area_two_goals_three_questions_on_frozen_semaev_2015
  context: >
    Semaev, "New algorithm for the discrete logarithm problem on elliptic curves"
    (ePrint 2015/310) proposes replacing the single high-degree summation
    polynomial S_{m+1} of point decomposition with a CHAIN of S_3 blocks linked by
    auxiliary variables, and concludes -- conditionally on its Assumption 1, that
    the maximal F4 step degree d_F4 is at most 4 -- an ECDLP running time of
    2^{c sqrt(n ln n)} with c = 2/(2 ln 2)^{1/2} ~ 1.6986 on E(F_{2^n}) for prime
    n, and that this "performs better than Pollard's" on the FIPS PUB 186-4 binary
    curves above roughly n > 310. The paper is now frozen in this repository at
    inputs/SEMAEV-2015-310/ with sha256 sidecars on both the PDF and the extracted
    text, read into KN-LIT-fa346d, and abstracted as a technique in
    KN-TECH-b18366.
    Reading it produced three findings that this program can act on and that the
    paper itself leaves open, each recorded as an open problem before any goal was
    opened:
    (a) KN-OPEN-d218ec -- Assumption 1's own quantity is not pinned down. Section
    4.4 defines d_F4 as the maximal total degree occurring before a Groebner basis
    is computed, which is not the first fall degree, not the degree of regularity,
    and not the Macaulay-rank statistic GOAL-DREG-001 has been measuring. The
    Semaev/Kosters exchange in KN-LIT-e77232 (degree 4 versus degree 5 at n = 45)
    is partly a dispute about which quantity is meant and whether non-productive
    steps count.
    (b) KN-OPEN-86e7e1 -- the comparison against Pollard rho is TIME AGAINST TIME.
    Table 3 and Section 4.5.2 carry no memory column, while the algorithm's
    relation store is exponential in k and the baseline this program charges
    against (KN-TECH-006, KN-LIT-012) is van Oorschot-Wiener PARALLEL rho with
    distinguished points and small per-processor memory. Galbraith raised the
    memory objection in the ePrint thread and it was answered with a sparse
    recount, not with a table.
    (c) KN-OPEN-94f456 -- Section 3 step 3 declines the short-chain regime t < m,
    saying the solving time "drops dramatically" and the trade "may be positive",
    on the stated ground that it "does not affect the asymptotical running time
    estimates". That ground is correct about the exponent and silent about the
    crossover n, which is exactly what the FIPS claim turns on.
    None of these is an objection to the paper's mathematics. Each is a question
    the paper's own text leaves answerable.
