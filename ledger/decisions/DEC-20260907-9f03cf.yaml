coordinator_decision:
  id: DEC-20260907-9f03cf
  recorded_at: '2026-09-07'
  context: >-
    EXP-RELN-82f487's Stage 0 (leak audit) and one measurement cell (rung
    N ~ 2^14, curve_seed 101, base_seed 201, training_seed 301, sigma =
    1/8, all arms/classes/regimes) completed. EV-RELN-cc045d records the
    result: reproduction fixtures exact, the Z/N-interval positive control
    passes, the label-permutation null and canary show no leak, but
    E/random-matched and Z/N-random disagree beyond tolerance for feature
    regime F1 / model class gnn -- one of the contract's own blocking
    stopping rules (pipeline fault). Independently, a single rung cannot
    fit the required multi-rung decay slope regardless of that gate.
  decision: inconclusive
  target_ids:
    - EXP-RELN-82f487
    - H-RELN-10ad6b
    - EV-RELN-cc045d
  rationale:
    - >-
      The frozen contract's own falsification_criterion and
      decision_paths.inconclusive name a pipeline fault as an inconclusive
      outcome, never evidence for or against the hypothesis (AGENTS.md
      rule 3 extends to this class of instrument defect). `inconclusive`
      is the only decision consistent with the contract's own decision
      tree.
    - >-
      H-RELN-10ad6b's status remains proposed. No claim is made about the
      GNN, the tree baseline, or representation-decidable structure at any
      scale.
    - >-
      The pipeline-fault gate is scoped exactly to what was measured:
      regime F1 combined with the hand-written GNN implementation, at one
      curve/seed combination. It is not generalized to the other three
      class/regime combinations, which agreed within band, nor
      extrapolated to unrun cells.
  evidence_refs:
    - EV-RELN-cc045d
    - experiments/EXP-RELN-82f487/runs/RUN-RELN-82f487-N14-sigma8-seed1/stage4_analysis.json
    - experiments/EXP-RELN-82f487/runs/implementation.md
  limitations:
    - >-
      This decision does not diagnose the F1/gnn disagreement (genuine
      defect, single-seed fluctuation, or an artifact of the hand-written
      model substitution recorded in implementation.md); EV-RELN-cc045d's
      unresolved_confounds names the concrete follow-up that would
      discriminate this, left for a future task rather than performed
      here.
    - >-
      This decision does not touch EXP-RELN-141a86 (still executing,
      separately handled).
    - >-
      Independent validator and red-team review, per the contract's
      later_review_requirements, has not occurred and is not owed on an
      inconclusive result with no claim attached, but would be required
      before any future claim-changing use of a repeat of this cell.
  next_actions:
    - >-
      Optionally, in a later task: repeat this exact cell at a second base
      seed / training seed, or audit the F1 feature construction and the
      E/random / Z/N-random samplers, to discriminate a genuine pipeline
      defect from a single-seed fluctuation before trusting further cells
      of EXP-RELN-82f487.
    - >-
      Continue tracking EXP-RELN-141a86 (symbolic regression), the third
      RQ-RELN-61638a contract, to completion.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      An inconclusive decision driven by a pipeline-fault gate on a single
      cell does not meet the replicated/strong bar for knowledge
      promotion.
  decided_by: coordinator
  decided_at: '2026-09-07'
