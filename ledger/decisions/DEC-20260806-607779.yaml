  amendment_disposition:
    AM-3:
      status: >-
        RETAINED, NOT RETIRED. The gate returned INADMISSIBLE under its own frozen
        clause and that verdict stands as recorded; it is NOT a demonstration that
        the gate cannot fire, because in three of four cells no violation of any size
        was presented to it. The declared 0.096 family-wise false-failure bound is
        correctly derived, was declared before any datum existed, is free of every
        run-supplied quantity, and both reviews confirmed the derivation and that all
        48 realized epsilon_i are non-negative. Repaired by AM-6 below.
    AM-4:
      status: >-
        RETAINED AND ANSWERED IN THE NEGATIVE FOR THIS STATISTIC FAMILY. E_I, V, m3
        and D are all REFUSED as adjudicators, joining P3. The obstruction is named
        (AM4-OBS-1). AM-4 is escalated from a post-hoc review criterion to a
        pre-registration gate by AM-8 below.
    AM-5:
      status: >-
        THE REPLACEMENT OBSERVABLE IS NOT YET ADMISSIBLE. AM-5 correctly withdrew
        D_A(beta_2)/D_A(beta_1) and correctly named the matched-V cross-family
        comparison as F-A1's replacement; the comparison itself is sound in
        conception and its instrument is not. It is BLOCKED pending AM-7 below and
        may not be scored again until its null calibration exists.
    AM-1_grid:
