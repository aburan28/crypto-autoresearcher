  amendments:
  - id: AM-6
    supersedes: prereg 3.5's positive-control specification (BATCH-a44d08 only)
    binds: every successor pre-registration in GOAL-MLKEM-005
    requirement: >-
      A mandatory positive control is admissible only if the injection it applies
      actually creates the condition the gate is meant to flag. Concretely: (a) the
      injected quantity must make the target step INCREASING by construction, or the
      step must be selected where the true Delta is approximately zero, and the
      report must print the post-injection Delta so a reader can check it fired on a
      real violation; (b) the step-selection rule MUST NOT maximise the quantity in
      which the injection is denominated -- data-independent is not the same as
      defect-independent, and prereg 3.5's argmax-SE_diff rule was the former and not
      the latter; (c) preferred over both, because it is strictly stronger, cheaper
      and lottery-free: report c_min(i) = 1 + (t_crit*SE_step_i - Delta_i)/SE_diff(t_i)
      at EVERY step of every cell, which is closed-form arithmetic on already-recorded
      values and which the Red Team computed in 0.09 s.
    prohibition: >-
      The Red Team's per-step c_min table and its bootstrap, and the Validator's
      post-injection Delta recomputation, are REVIEW MEASUREMENTS and may not be
      cited as a rescoring of BATCH-a44d08's frozen INADMISSIBLE verdict, which
      stands as the output of the frozen rule. They are cited only as the ground for
      this amendment.
  - id: AM-7
    supersedes: nothing; specifies the SE and the calibration for AM-5's replacement observable
    binds: every cross-family comparison of a tail order statistic in GOAL-MLKEM-005
    requirement: >-
      No falsifier comparing a tail quantile across frame families may be frozen
      again until all three hold. (1) THE SE MUST CONTAIN THE VARIANCE THAT DOMINATES
      IT: any frame family with a coordinate support must be replicated over
      independent supports and the between-support dispersion added to the SE --
      measured here at 2.5x to 3.2x the entire reported SE -- and the error pool must
      be replicated over at least 3 independent draws per cell, since D is one order
      statistic of a single shared pool and the frozen SE sees none of that pool's
      own sampling error. (2) A PRE-REGISTERED NULL-OBJECT CALIBRATION IS MANDATORY
      BEFORE BELIEF, per docs/inventor-protocol.md: two frame families genuinely
      exchangeable at matched V, replicated enough to ESTIMATE a false-falsification
      rate rather than to observe one, with the estimated rate declared beside the
      nominal level. (3) A relative-effect floor must be set above the null's own
      median relative difference; the frozen 5% bar sits below a null median of 8.4%
      to 9.0% and therefore does no work.
    consequence_for_the_record: >-
      Until (1)-(3) are satisfied, Section C's proposition is UNCALIBRATED in both
      directions. No successor may cite "L2 tail sufficiency falsified" or "L2 tail
      sufficiency consistent" from BATCH-a44d08, and no successor may cite its eight
      non-firing pairs as upper bounds.
  - id: AM-8
    supersedes: nothing; escalates AM-4 from a review criterion to a pre-registration gate
    binds: every candidate observable proposed in GOAL-MLKEM-005
    requirement: >-
      Before any observable is frozen in this goal, its pre-registration must report
      the AM-4 triple on it -- ambient isometry B -> BH, row permutation, and
      unimodular B -> UB -- on at least one test lattice plus Z^d in its identity
      basis, together with (where the observable is defined on a q-ary construction)
      a q-sweep down to q = 1 and a rank sweep of the off-diagonal block. An
      observable whose value is unchanged from q = 3329 to q = 1 is not measuring the
      q-ary construction, and an observable whose verdict changes across
      lattice-preserving presentations is REFUSED as an adjudicator regardless of how
      well it separates. This costs under three seconds and would have caught Section
      A's E_I arm before dispatch; it has now refused five statistics.
    preferred_outcome_restated: >-
      "NO ADMISSIBLE PREDICATE EXISTS, HERE IS THE OBSTRUCTION" remains preferred
      over a plausible predicate accepted on plausibility (AM-4's own note and
      docs/inventor-protocol.md section 4). AM4-OBS-1 is the candidate obstruction
      and is a measured argument, not a theorem; a successor either exhibits an
      observable that is not a function of diag(QQ^T) in the standard basis and
      clears the triple, or archives the obstruction with the argument that no such
      observable in this family can.
  - id: AM-9
    supersedes: nothing; a nomenclature rule
    binds: every successor record in GOAL-MLKEM-005
    requirement: >-
      fpylll's `k` in IntegerMatrix.random(d,"qary",k=...,q=...) counts the Q-SCALED
      rows, i.e. |K_q|, and NOT the identity-block size |K_I| that this goal's
      pre-registrations denote by k. The two coincide only at k = d/2, which is why
      no committed record could distinguish them. Every successor record states which
      convention it uses. No committed number in this goal changes, because every
      committed generator call is at k = d/2.
    provenance: >-
      Established by integer inspection of the generator's entries, not by a
      statistic (report_k.md section 3; Red Team RT-X2).

  what_is_not_decided:
    note: >-
      Recorded as explicitly as what IS decided, because an unstated non-decision is
      how a scoped result becomes an unscoped one two batches later.
    items:
    - >-
      WHETHER D DEPENDS ON THE FRAME ONLY THROUGH V AT THE 2^-10 QUANTILE:
      INCONCLUSIVE, in both directions. Not falsified, not consistent, no valid upper
      bound. The instrument that was to decide it fires on true nulls at rates one to
      two orders above its declared level. Nothing in this batch shows the effect is
      absent either: the d140_b40 pair fires on 4 of 4 fresh error samples, which is
      consistent with a real configuration-dependent offset AND with the null, which
      also produces persistent per-configuration offsets.
    - >-
      WHETHER L2's SECOND-ORDER DERIVATION IS AFFECTED: NO, AND IT IS NOT TOUCHED.
      Var(e^T P e) = 2*beta + (mu_4 - 3)(V + beta^2/d) is a function of V alone; that
      is established and this batch neither supports nor contradicts it.
    - >-
      WHETHER THE AM-3 GATE HAS USABLE POWER: UNDEMONSTRATED, NOT DISPROVED. Do not
      cite BATCH-a44d08 as showing the gate cannot fire.
    - >-
      WHETHER M-K OR M-D IS THE CORRECT SPILL MECHANISM FOR ANY LATTICE: NOT DECIDED
      AND NOT DECIDABLE BY E_I. What is decided is narrower: the E_I observable
      cannot separate them, because it is min(rank(A_S),beta)/beta + O(q^-2) for any
      basis of that shape and returns M-K's curve on Z^d. M-D is refuted as a claim
      about THIS basis presentation, algebraically.
    - >-
      WHETHER ANY AM-4-ADMISSIBLE STATISTIC EXISTS FOR THIS QUESTION: OPEN. Five
      statistics are refused; AM4-OBS-1 names an obstruction and does not prove one.
    - >-
      ANYTHING ABOUT ML-KEM, FIPS 203, ANY PARAMETER SET, ANY ATTACK COST, OR C1.
      Claim tier TOY, unconditionally, and no number here transports.
    - >-
      ANY REDUCED ARM. No reviewer ran LLL, BKZ or any new reduction, so Section A's
      A-lll arm and every reduced-arm figure quoted in this batch are checked for
      internal consistency only.

