coordinator_decision:
  id: DEC-20260806-607779
  decided_by: coordinator
  decided_at: '2026-08-08'
  decided_at_note: >-
    The identifier was pre-assigned by the BATCH-a44d08 dispatch queue on
    2026-08-06 and carries that date; the decision was made on 2026-08-08 and
    `decided_at` records the true date rather than the identifier's. No identifier
    was minted by this task.

  decision: refine
  decision_type_rationale: >-
    `refine` and not `inconclusive`, `weaken`, `reject_scoped` or `support`, and the
    choice is load-bearing. NOT `support`: nothing in the batch supports any
    proposition about lattices, and its one durable positive -- the confinement
    boundary at beta <= k -- deflates on review to an algebraic property of the
    frozen basis presentation that returns the same curve on Z^d. NOT `weaken` or
    `reject_scoped`: no theory was tested by an instrument this batch showed to be
    working, so there is nothing to weaken or reject; in particular Section C's
    falsifier fired on true nulls at 5 of 7 and 17 of 20, so `reject_scoped` on it
    would be a rejection resting on an uncalibrated measurement, which
    docs/claims-and-verification.md forbids outright. NOT `inconclusive` for the
    batch as a whole, because that would understate it: Sections A and B produced
    definite, independently reproduced findings at their own narrow scope, and the
    AM-4 result is definite about the statistic family. `inconclusive` IS the right
    word for exactly one proposition and is recorded as such under
    what_is_not_decided. What the batch licenses is a set of instrument amendments
    binding on successors and a redirected lead task -- which is `refine`.

  target_ids:
  - GOAL-MLKEM-005
  - EV-MLKEM-cd9878
  - DEC-20260806-14ac13

  context: >-
    BATCH-a44d08 executed DEC-20260806-14ac13 under the notarized frozen contract
    TASK-20260806-843c40/prereg.md (sha256 8d00ca3f...a2a6c80, notarized in commit
    9cb2d3e28 before any producer was dispatched). Three producers ran: Section A,
    the k != d/2 discriminating test that five records across four batches had
    deferred; Section B, the AM-1 graded family re-scored under the AM-3 replacement
    gate; Section C, the matched-V cross-family comparison AM-5 named as F-A1's
    replacement. All twelve producer artifacts were snapshot-committed at
    7700090428ae7f8b5dbaaf7bb54a7a253c53fae8 before either review read them. An
    independent Validator (TASK-20260806-7418bc) returned verdict `failed`, scoped:
    notarization, artifact integrity and reproducibility pass strongly, Sections A
    and B are admissible with recorded narrowings, and Section C's falsification is
    not admissible. An independent Red Team (TASK-20260806-e43218) reached the same
    place on Section C by a different route and added a cross-cutting AM-4 result.
    This decision records what survived, what did not, what is explicitly NOT
    decided, and what binds the successor. IT MOVES NO HYPOTHESIS STATUS, DISCHARGES
    NO COMPLETION CRITERION, CLOSES NO LANE, AND CHANGES NO GOAL STATUS.

  inference_record_verbatim: >-
    requested_policy coordinator-orchestration-code; under the Claude Code runtime
    per CLAUDE.md per-role model selection is process-level and subagents keep
    model: inherit, so the resolved model is the session model; fallback_used:
    false; model_verified: false (no adapter probe receipt for this session).

  rationale:
  - >-
    THE HEADLINE THAT WAS DEFERRED FIVE TIMES IS NOW ANSWERED, AND THE ANSWER IS
    SMALLER AND FIRMER THAN THE HEADLINE. Section A ran the frozen rule exactly and
    returned NEITHER in all four cells: on the E_I arm M-K survives 36 of 36 points
    and M-D is falsified at 36 of 36; on the V arm M-D is falsified at 32 of 32
    discriminating points and M-K at 22 of 32. The Validator reproduced every count
    and every per-point decision from an implementation written from the
    pre-registration WITHOUT reading the producer's measurement code, at max
    deviation exactly 0.0 over 576 values. But the E_I half is not a measurement.
    The Red Team derived E_I(beta) = (1/beta) sum_i s_i^2/(s_i^2+1) over the
    singular values of A_S in closed form, reproduced the measured values to twelve
    significant figures from svd(A_S) alone, confirmed the implied q^-2 scaling over
    three decades, showed the identical curve is returned at q = 1 where the lattice
    is Z^d, and showed that forcing rank(A) = 10 moves the boundary to beta = 10 and
    not to k = 30. The Validator reached the same deflation independently by a
    q-sweep it added itself: at the frozen q = 3329 the E_I curve is pinned to
    min(1,k/beta) to 1e-7 by the presentation, so M-D was refutable by algebra
    before any datum of this batch existed. THE NARROW STATEMENT I ADOPT: the tail
    GSO window of the unreduced q-ary presentation lies in the identity block and
    the confinement boundary tracks k and never d-k, this is an algebraic
    consequence of B = [[I_k,A],[0,qI]] with A of full rank and entries of order q,
    confirmed numerically at four (d,k) cells whose mirrored pairs could have
    detected a size or index-position effect and did not -- and the E_I arm
    therefore cannot separate the two spill mechanisms and never could. What was
    free to fail and did is the V arm: M-K's generic-spread clause is refuted at
    +20% to +33% in the spill window, and that is the section's real content.
  - >-
    SECTION B IS INADMISSIBLE BY ITS OWN FROZEN CLAUSE, AND THE CLAUSE FIRED FOR A
    REASON ITS OWN RATIONALE DOES NOT COVER. The mandatory positive control did not
    return AM3-FAIL at c = 6 in three of four cells, so prereg 3.5 declares the AM-3
    gate INADMISSIBLE and that is the run's result, with the four PARTIAL readings
    correctly WITHHELD. The clause's stated rationale is "a gate that cannot flag a
    violation 1.5 times the width its own design calls detectable is not a
    criterion". That is not what happened. The Validator recomputed the
    post-injection Delta at c = 6 and found it STILL NEGATIVE in all three failing
    cells (-0.0257, -0.0348, -0.0079), so no monotonicity violation of any size was
    ever presented to the gate, and a monotonicity gate that declines to flag a net
    decrease is behaving correctly; the one cell whose selected step was near-flat
    presented a genuine +2.4 SE_diff increase and fired at c = 3. The Red Team
    derived the control's outcome in closed form -- c_min(i) = 1 + (t_crit*SE_step_i
    - Delta_i)/SE_diff(t_i), reproducing the frozen c = 3/none/none/none exactly --
    and showed the identical injection fires at c <= 6 at 6, 7, 9 and 7 of the 12
    steps, with P(INADMISSIBLE) = 0.997 under the frozen argmax-SE_diff lottery. THE
    DEFECT IS IN THE CONTROL, NOT IN THE GATE, AND IT IS AGAIN MINE: I approved
    prereg 3.5, whose step-selection rule maximises the very quantity the injection
    is denominated in. AM-3 IS NOT RETIRED ON THIS EVIDENCE. Its declared 0.096
    false-failure bound is correctly derived, was declared before any datum existed,
    and is mechanically free of every run-supplied quantity; its power is
    undemonstrated, not disproved. Retiring a gate whose only demonstrated failure
    is a defect in its own positive control would be premature closure in the exact
    sense docs/inventor-protocol.md section 4 names, and the Red Team asked for that
    restraint in writing.
  - >-
    SECTION C IS UNCALIBRATED, AND "L2 TAIL-SUFFICIENCY FALSIFIED" IS NOT RECORDED
    AS A RESULT ANYWHERE. This is the decision's most consequential refusal and it
    rests on TWO INDEPENDENT NULLS BUILT BY TWO INDEPENDENT REVIEWERS USING
    DIFFERENT CONSTRUCTIONS. The Validator built TL versus TL', the same two-level
    frame with its support translated by 2 beta: V and m3 agree to 7.1e-15 and under
    an exchangeable CBD law the two are the same object up to a coordinate
    permutation, so "D depends on V alone" is TRUE BY CONSTRUCTION -- and the frozen
    criterion exceeds its |t| bar at 7 of 7 scored targets and both bars at 5 of 7,
    with |t| reaching 27.6 and a null relative difference of 21.05%, LARGER than the
    17.48% the d100_b40 pair was falsified on. Resampling the shared error pool
    flips that scored pair's sign: +17.5%, -6.2%, +29.6%, -5.4%, -11.3%. The Red
    Team, with a different null -- two TL families on independent random ambient
    supports at identical u_j -- found 17 of 20 and 13 of 20 disjoint null pairs are
    false falsifications with median null |t| about 11, 24.6%/25.2% under the null
    structure that mirrors the real comparison against a declared per-pair level of
    0.0083, and the fragile pair failing to falsify on two of three fresh error
    samples (|t| = 1.700, 10.630, 3.375). The mechanism is agreed and was disclosed
    first by the producer itself (deviation 6): D is ONE order statistic of a SINGLE
    SHARED 2^20 pool, the frozen SE is a between-frame dispersion over 8 frames
    sharing that pool, and it omits the dominant variance -- the Red Team measures
    the omitted between-support sd at 2.5x to 3.2x the ENTIRE reported SE, and finds
    a fourth unnamed could-not-fail arrangement underneath it: vmatch.py's tl_frame
    is deterministic on one fixed coordinate support, so all 8 TL draws share it.
    THE ADMISSIBLE READING IS UNCALIBRATED: neither falsified nor consistent nor a
    valid upper bound, and the eight non-firing pairs' detection floors are void for
    the same reason. Section B does NOT share this defect and I record the asymmetry
    rather than tarring both: 60 statistics over 5 independent pools stay at or
    below -0.47 against a +4.207 threshold, because Section B compares two frames on
    the same path at adjacent t where the pool offset is common-mode.
  - >-
    THE CROSS-CUTTING RESULT IS THE BATCH'S MOST CONSEQUENTIAL, AND IT IS ABOUT THE
    GOAL AND NOT ABOUT THE BATCH. Under AM-4, none of these statistics is a lattice
    invariant. An ambient isometry B -> BH on one lattice sends E_I from 1.000000 to
    0.501690 = k/d -- the Haar value, which falsifies BOTH spill mechanisms -- moves
    V by 38.6x and m3 by 232x, and FLIPS THE SIGN OF D (+0.053166 -> -0.000495). A
    ROW PERMUTATION, unimodular and the same lattice, moves D by 13.3%, above
    Section C's own 5% "practically meaningful" floor. Every derived quantity in
    Section B inherits D's failure. All three producers correctly disclaimed AM-4
    adjudication in advance, so this is not a contract violation; it is the measured
    answer to the fourth next_action of DEC-20260806-14ac13, which asked whether an
    AM-4-admissible statistic exists. The obstruction has a name and I record it as
    a named finding in EV-MLKEM-cd9878: AM4-OBS-1, THE STANDARD-BASIS DIAGONAL
    OBSTRUCTION -- every observable proposed anywhere in this goal is a function of
    diag(QQ^T) in the standard basis, and diag is exactly what B -> BH destroys;
    the degree-1 alternative W = sum_{a<=k} P_aa - beta*k/d that EV-MLKEM-94c773
    recorded as evidence that "the space is not empty" is an affine function of the
    same diagonal and dies for the same reason. This threatens the statistic family
    the goal has been built on across four batches, so it gets its own successor
    action rather than a line in a summary. Scope, stated exactly: the AM-4 table is
    ONE red-team session on its own frames at one (d,beta,k); only V's
    non-invariance is corroborated across batches. AM4-OBS-1 is an argument about
    the form of the observables, not a theorem that no admissible statistic exists.
  - >-
    A CORRECTION OF MY OWN, RECORDED BY SUPERSESSION AND NOT BY EDITING. The
    committed snapshot receipt at archives/TASK-20260806-f4d678/snapshot-receipt.json
    (inside commit 7700090428) states the Section A E_I departure as "beta =
    30/70/45/105 for k = 30/70/40/100". That mixes two conventions and the Validator
    caught it (F-4). k is a grid point in all four cells and E_I(k) = 0.999024 /
    0.998672 / 0.999945 / 0.999990, so under a 1e-4 registration threshold the two
    d = 100 cells register departure at beta = k while the two d = 140 cells
    register only at the next grid point. THE CORRECT STATEMENT IS THAT DEPARTURE IS
    AT beta = k IN ALL FOUR CELLS, i.e. 30/70/40/100; stated consistently under the
    other convention it is 35/75/45/105. The substantive claim -- the boundary
    tracks k and never d-k -- is confirmed, twice, from results_k.json and from an
    independent regeneration from seeds. A second error of the same kind is
    corrected with it: the receipt's "at misses as small as +0.78%" describes a point
    that is NOT falsified; the falsifying misses run +2.86% to +32.94%, with the
    largest surviving residual at +1.87%. BOTH ERRORS ARE THE HARNESS-DRIVING
    COORDINATOR'S -- they are in the receipt's `coordinator_verification` summary,
    which I wrote -- AND NEITHER ORIGINATES IN A PRODUCER REPORT. report_k.md prints
    the values themselves and makes no "departs at" claim. The receipt is immutable
    and committed and is NOT edited; the corrections live in
    EV-MLKEM-cd9878.receipt_correction_by_supersession, which this decision cites,
    and no CORR-* identifier was minted because this task's identifiers were
    pre-assigned by the dispatch queue.
  - >-
    THE PRODUCERS WERE RIGHT AND WERE UNDER-WEIGHTED, INCLUDING BY ME. Every defect
    the two reviews demonstrated had already been named by the producer that carried
    it: Section A's O-1 against its own V tolerance, Section B's A-5/O-1 that the
    control's step selection and injection scale are coupled through SE_diff, and
    Section C's deviations 6 and 7 -- that the frozen SE is a between-frame
    dispersion over one shared error pool, and that no null calibration of the
    falsifier exists. All three ran the frozen specification exactly as written
    where they disagreed with it, as prereg 5.5 requires, disclosed a dimensional
    error in the frozen block-swap null, disclosed that prereg 4.3 step 5 is
    factually wrong for (140,30), refused to round 2.22e-16 to 0.0, marked their own
    post-hoc computations uncitable, and flagged a wrong prose sentence inside their
    own immutable JSON without editing it. The Validator records this as a
    commendation load-bearing for its verdict. I record it as the reason the failures
    in this batch are failures of the frozen design -- which is mine -- and not of
    the bench.
  - >-
    THE PATTERN NOW HAS AN EIGHTH INSTANCE AND THE EIGHTH IS OF A NEW KIND.
    DEC-20260806-14ac13 recorded six instances of one failure mode: a check scored
    in the one arrangement where its own defect cannot appear. Section A's E_I arm is
    the seventh -- it can only sit at one of two algebraic extremes and the frozen
    construction forces the upper one. Section B is the eighth, AND IT IS THE FIRST
    IN WHICH THE CONTROL RATHER THAN THE STATISTIC IS THE OBJECT WITH THE INVISIBLE
    DEFECT: the pre-registration named two could-not-fail forms, both of the shape
    "the gate cannot fire", and did not name the mirror, "a positive control that
    cannot pass", which is the one it ran in. Section C adds a fourth unnamed
    arrangement of its own (the fixed TL coordinate support). The methodological
    lesson is now sharp enough to be worth a knowledge entry and is scheduled as
    one; it is not promoted in this archive, for the reasons in
    knowledge_promotion.

