  rationale:
    - >-
      Keys applied as frozen. The plan fixed approve-or-revise before the object
      existed; three of four reviewed joints broke on pre-declared or stated
      joint claims, and J5 reports a value-changing reading. Approval is
      therefore unavailable, whatever the merits of the parts that hold.
    - >-
      Defects to be fixed by the revision, each with the joint and artifact that
      found it. D-1 (J1-iv, C1): add Certicom 79, 89 and 359 (ECC2-79, ECC2-89,
      ECC2K-358, ECC2-353) to P-A's metric, Stage 5 and C1's discharge, with r
      and h from Appendix A of inputs/CERTICOM-CHALLENGE-2009/; pre-register how
      an UNRESOLVED row is read; make Stage 0 check coverage against the
      primary input, not presence only. D-2 (J1 O-J1-2 and J4 PTM-C-SLICE):
      pin the coherent row BR-1 imports (cofactor-1, label-unseparated, degree
      bound 4, named storage readings) and extend C-BR1 to refuse a mis-sliced
      or time-only import. D-3 (J2-v, C8): put the memory figure beside every
      time figure at the thirteen locations of computations.json c8_scan,
      including the hypothesis record and every off-D figure.
    - >-
      D-4 (J3, C3): add M7 (block-size exponent above D = 4) and M8 (the
      optimising m under H2) to L-INT and correct M5's stated direction for
      in-domain omega; then EITHER carry M5 and M7 as explicit readings (S_sp and
      S_hyb or better) with D* reported as the envelope over all readings, OR
      restrict every D* sentence, the decision mapping and any threshold handed
      to GOAL-SEMBIN-fcb7a2 to the dense, fixed-omega, block-size-n model at
      m = 12; and hand any threshold as D*(m) over m, not at one m. D-5 (J3,
      C6): restate H1 over a range of n that includes the toy ladder or number
      the transfer assumption separately (H1-Q); reconcile H1's falsification
      condition with the VOID rules (H1-V); label the in-contract validation as
      instrument consistency (H1-C); support or relabel the lower bracket edge
      (H1-L); add the extrapolation-span ratio RQ-NISTBIN-06157b requires to the
      D* sentence (H1-S); number the first-fall-to-solving-degree bridge (H2-U)
      and give H2 its n and k arguments (H2-N). D-6 (J3 OMEGA-CTRL): gate the
      nearby-object control at every omega at which D* is scored, or score P-C
      at omega 3 only; use the least convenient known-truth Certicom degree in
      G4.
    - >-
      D-7 (J5 Q0-01 under K-indeterminate, C2): state the k-rounding reading as
      a numbered model-identification choice with its textual basis (the paper
      defines k = ceil(n/m) and evaluates its Section 4.5.2 optimisation at
      k = n/m), disclose that it moves the fixture value by about 11.2 bits and
      m* from 12 to 15, state that F1 identifies the frozen instrument's
      reading rather than a model determined by the published text, and carry
      the choice into H1 and into the per-m threshold of D-4. The rho column
      (C1's arithmetic) needs no change: J1 and blind J5 agree with it.
    - >-
      D-8 (J4 non-breaking objections, carried because the revision reopens the
      same files): key RT-4 to a pre-registered expectation table
      (RT4-CERTAIN); narrow IR-1 to "no recorded degree enters the D axis or any
      cost formula" with the two row selectors listed (FD-IR1); pin IR-2's
      solving-degree convention to Semaev's d_F4 reading (FD-CONV) and remove
      H2's latent first-fall route (FD-H2); define E2 with the every-m
      quantifier and the model scope (S-13); scope the "deciding measurement"
      wording, define "plausible", say whether the omega = 2.0 block counts, and
      give K4's deprioritisation a revisit condition (S-10, CLAUDE.md rule 9);
      make Stage 8 read "outside output_templates" (S-9); apply R-X3 to the
      claim-(A) token and the forbidden list (S-12); drop the "whole margin on
      one integer" framing (S-3, S-4). D-9 (J1 O-J1-3): cite DEC-20260918-4b7e21
      as the governing ruling on the fixture target's status. D-10 (X-2): state
      what the run adds beyond the closed forms that fix P-C's class once F1
      passes.
    - >-
      What holds and is carried forward unchanged unless a defect above forces
      it: the corrected rho column; the C2 fixture's identification, tolerance
      and PASS as frozen (two disjoint paths); the fixture target's provenance
      use; the stage order; every approval field; C4 source reads; C5
      discipline; L-EXT, L-MON, L-SPREAD, L-ARG inside the model; all four
      proves-too-much controls; R2 boundaries; routing of every E1, E2 and cell
      verdict to review-breakthrough at max.
    - >-
      Target profile. Nothing here moves an exponent. The contract is a
      zero-solver derivation whose value is to make a conditional cost's
      dependence on one integer explicit; the revision makes that dependence
      honest about model uncertainty (D-4, D-7), which is the concrete-cost
      honesty docs/target-result-profile.md asks for.

