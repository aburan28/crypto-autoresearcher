  rulings:
    - id: R-JOINTS
      subject: per-joint composition (worksheet joint_table)
      ruling: >-
        J1 BREAKS (claim (A) not re-evaluated at every Certicom degree; C1 not
        discharged). J2 BREAKS (C8: time figures without memory figures). J3
        BREAKS (D-dependent multipliers M5 and M7 held constant in the D*
        bracket). J4 HOLDS. J5: Q1 agrees on all four curves; Q2 agrees under
        the taken reading and is reading-dependent (see R-J5). Every joint is
        owned and attested; none is unowned, shared or unattested. Each break is
        a protocol, disclosure or model-interface defect in the design
        documents: none is a mathematical result about the cost model's value,
        about any curve, or about any cell (CA-9).
      j1_breaking_artifact_note: >-
        The plan's J1 breaking_artifact list does not enumerate an omitted
        degree. The joint's stated claim ("Claim (A) is re-evaluated against that
        column at every FIPS, Certicom and Oakley degree") is false, and the
        plan's own attack (iv) found it. A joint whose stated claim fails breaks.
        The composer confirmed the four challenge names in the contract's named
        Certicom input and the frozen degree set in the hypothesis by text
        search, and the red team, blind to J1, found the 359 omission
        independently (X-1). Accepting the break tightens a key; nothing is
        relaxed.
    - id: R-J5
      subject: CA-4, J5 against J1 and the contract, value by value, before any key
      ruling: >-
        Q1 (tolerance 0.01 bit; exact on bit length and k): contract 279.7471,
        284.8257, 136.2534, 140.8257 for K-571, B-571, K-283, B-283; J5 and J1
        both 279.74707460, 284.82574806, 136.25341894, 140.82574806; bit lengths
        570, 570, 281, 282 and k 571, 1, 283, 1 exact in both. AGREE; no
        undetermined choice for Q1. Q2 (tolerance 5.0e-4 bit, exact on m):
        contract target 186.307 at m* 12 under the frozen instrument's unceiled
        k = n/m, omega 3.0. J5 under its taken reading (k = n/m, omega 3):
        186.30695179 at m 12, within tolerance, m exact. J5 under the
        co-admissible literal reading (k = ceil(n/m), the paper's definition of
        k): 175.1383 at m 15, 11.169 bits away. J1 records the same ceiled
        value at m* 15 (J1-ii). There is no implementation disagreement: the two
        implementations agree on every reading both evaluated. The divergence is
        a reading of the published model, which the contract resolves by naming
        the instrument's reading without stating it as a model-identification
        choice.
      keys: >-
        K-fixture does NOT fire: J1 reports the fixture passing as frozen, and
        J5's taken-reading Q2 is within tolerance with exact m. The
        reading-dependent divergence is the case K-indeterminate is written for,
        so K-indeterminate FIRES, on C2 and not C1 (Q1 is determined and J1 =
        J5). J5's Q0-02 (omega) is also reported as value-changing; it arises
        because blind-inputs.yaml's Q2 definition did not pin omega (PD-C2)
        while the contract pins 3.0 and the paper evaluates only at 3. Its
        bearing on D*(omega) is carried by J3's OMEGA-CTRL finding. Q0-05
        (cofactor) is non-admissible by J5's own account.
    - id: R-KEYS
      subject: composition keys applied as written (CA-7)
      ruling: >-
        K-approve NOT met. K-revise-defect APPLIED (J1, J2, J3). K-indeterminate
        APPLIED (C2). K-fixture, K-duplicate, K-infra and every tripwire effect
        NOT applicable: the fixture passes; no D_solve surface exists or is in
        flight on GOAL-SEMBIN-fcb7a2 (producer C4, J2-iii); every joint ran to a
        verdict (J5's abandoned sympy.n_order attempt was a timeout, replaced;
        infrastructure, not a result); TA-1 to TA-4 not fired per all three
        reports. No key is relaxed and no protocol_amendment is needed.
    - id: R-LEAK
      subject: J5 LEAK-1, EXPOSURE-2 and procedure deviation PD-1 (BL-4 not halted)
      ruling: >-
        LEAK-1 is real and plan-side (PD-C1): the whitelisted Semaev text prints
        the paper's own value of the Q2 model at n = 571 in Table 3, and the
        whitelisted source_record prose states the optimising m. J5 attests it
        located the table by caption and row label and never read the value.
        BL-4 is triggered by finding a value; J5 stopped before any value, so its
        deviation is accepted as disclosed. The Q2 per-reading VALUES are
        admitted as blind on J5's attestation (not independently checkable:
        blind-history UNCHECKABLE). The taken-reading SELECTION and its argmin
        m = 12 are NOT blind (EXPOSURE-2); they count as arithmetic
        corroboration only, not as independent evidence that the published text
        selects the contract's reading. The transition does not depend on this
        ruling: if J5's Q2 section were set aside, K-revise-defect still applies
        on J1-J3 and K-indeterminate still applies on Q0-01, which is quoted
        source text and is corroborated by J1-ii's independent ceiled-reading
        value.
    - id: R-X3
      subject: red team X-3, whether a claim-(A) LIVE count at D = 4 is inside TA-1's allowance
      ruling: >-
        A claim-(A) class count at D = 4 and one omega, in the frozen cost model,
        is required by DEC-20260924-99ce20 C1 and is inside TA-1's allowance only
        as a count of model classes at one parameter point, never as a cell
        status. Because LIVE is the program's cell-status word, the revision uses
        a model-scoped class token (or qualifies every use) and adds unscoped
        "live" and "decides" to the forbidden list (D-8).
    - id: R-DISCLOSURES
      subject: other reviewer procedure deviations and disclosures
      ruling: >-
        Each is ruled in the worksheet (deviation_and_disclosure_rulings) and
        accepted as disclosed: red team PD-1 (PTM-D object substituted by
        witness A, because the plan's literal object is absent from the record;
        PD-C3), PD-2 (PTM-B degree declared before evaluation), PD-3 (per-solve
        formula values printed, no margin or D*; not TA-1), PD-4 (a SEMBIN figure
        taken as quoted); validator 6fbd0d's disclosed reads (custody git
        history, commit TITLES naming lane-B records with no lane-B file opened,
        the cursor ref string seen inside an in-scope file); J5 LEAK-1b,
        EXPOSURE-3, NOT-A-LEAK-4, PD-2 to PD-4. None changes a joint verdict.
        J5 PF-1 and J1 O-J2-2 (the FIPS source_record prose labels the PDF's
        sha256 with the text file's prefix) are an input-provenance recording
        defect, not a mathematical result; routed to NA-4.
    - id: R-PRIOR
      subject: CA-5, the recorded prior against the outcome (plan PD-R1, informed prior)
      ruling: >-
        Prior overall: approve about 0.25; most likely revise on C3 or C2.
        Outcome: revise on C1, C8, C3/C6 and C2. The modal prediction held, and
        the prior's ranking of J3 as the likeliest break held (M5 and M7 are the
        D-dependent multipliers it anticipated). The prior was WRONG on where J1
        and J2 would break: J1's fixture identification, tolerance and
        provenance all hold and J1 broke on degree coverage; J2 broke on C8, not
        C4 or C5. On J5 the anticipated mechanism, an underdetermined published
        model, occurred on the k-rounding axis rather than the solving-cost axis;
        overturn condition (2) was not met. The rho column agrees, and because
        the prior is informed (PD-R1), the independent confirmation is J5's
        blind agreement, not J1's concurrence. Table in the worksheet.
    - id: R-NA7
      subject: DEC-20260924-99ce20 NA-7, re-rank of HOLD-A to HOLD-G at this selection point
      ruling: >-
        ORDER UNCHANGED. Official order after re-rank: HOLD-A (ranks 5-6,
        IDEA-20260922-af7396, IDEA-20260922-70a67c), HOLD-B (7-8,
        IDEA-20260922-1a081a, IDEA-20260922-c07598), HOLD-C (9-10,
        IDEA-20260922-c48e7d, IDEA-20260922-40003d), HOLD-D (11,
        IDEA-20260922-6cf862), HOLD-E (12, IDEA-20260922-29b1c5), HOLD-F (13-14,
        IDEA-20260922-6028ed, IDEA-20260922-818b73), HOLD-G (15,
        IDEA-20260922-77bf31). Lane B's composing decision DEC-20260924-286589
        cites this ruling by id.
      per_hold:
        - hold: HOLD-A
          change: none in rank. It stays the next NEW design unit on GOAL-ECDLP2M-001.
          reason: >-
            Lane A composes revise, not withdrawal (K-duplicate did not fire), so
            HOLD-A's "takes its slot" clause does not trigger. No lane-A finding
            bears on the Oakley pair's evidence, test boundary or uncertainty
            (J1 confirms the Oakley degree set of claim (A) complete against the
            primary input). The lane-A revision is the continuation of the rank-1
            selection S1, which already ranks above every hold, and is this
            decision's first next action.
          dispatch_conditions: >-
            Unchanged and restated: F-2 of DEC-20260924-99ce20 (the dangling
            IDEA-20260922-684291 and IDEA-20260922-2caba8 citations) resolved
            first (DEC-20260924-f0a9c7 rank 7); a free slot within the goal's
            max_concurrent 3; review-breakthrough at max (tripwire T3).
        - hold: HOLD-B
          change: none.
          reason: Its revisit condition is S2's composing decision (lane B). No lane-A finding bears on it.
        - hold: HOLD-C
          change: none in rank; revisit condition narrowed.
          reason: >-
            Its revisit ("S2's census certificate is snapshot-archived, or the
            next selection point, whichever first") fires at this selection
            point. It stays at ranks 9-10 because its census is authored once in
            S2 (DEP-3) and S2 has not composed within this session's knowledge
            (no lane-B path read); designing it now would design around an
            input still under review. Revisit moves to DEC-20260924-286589
            becoming official, or the next selection point after it. Lane A's
            J1 and blind J5 corroborate the corrected K-571 column its design
            must use (its A7 deviation), which changes no rank.
        - hold: HOLD-D
          change: none.
          reason: Revisit at this selection point; no lane-A finding bears on its five-row emptiness certificate. Stays queued.
        - hold: HOLD-E
          change: none.
          reason: Revisit at this selection point for Stage 0-1; no lane-A finding bears on it. Stays queued.
        - hold: HOLD-F
          change: none in rank; one design condition ADDED.
          reason: >-
            Lane A's J1 finding (Certicom binary degrees 79, 89 and 359 omitted
            from a degree list inherited from EXP-SEMBIN-992e73) bears on any
            reachability-table carrier whose row set is seeded from that list.
            ADDED CONDITION: when HOLD-F is designed, its row set is reconciled
