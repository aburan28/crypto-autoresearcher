coordinator_decision:
  id: DEC-20260830-04169a
  recorded_at: '2026-08-30'

  target_ids:
    - GOAL-ECDLP-001
    - H-CREP-001
    - EXP-CREP-001

  decision: revise
  decision_label: ecdlp_per_task_budget_removal_and_g2_g8_gate_wording_amendment

  context: >-
    This session, on the user's explicit 2026-08-30 instruction ("please
    make sure to remove the budgets for things. it is hindering the
    efforts here"), removed per-task wall_clock_seconds/memory_gb caps
    from GOAL-ECDLP-001 dispatch-queue handoffs going forward. Separately,
    after GOAL-ECDLP-001's thirteen consecutive non-batch pre-admission
    trigger-search rounds (seven through thirteen) converged on exactly
    two failure modes across four disjoint literatures without a third
    mode ever appearing, the Coordinator opened a bounded, zero-experiment
    gate-calibration and framing-revisit review (TASK-20260830-1e385f,
    idea-generator; archived by TASK-20260830-443b92, coordinator). That
    review (a) proposed corrected wording for the frozen pre-admission
    gate's G2 and G8 items, and (b) constructed a structural argument
    attempting to explain the two-failure-mode convergence, subjecting it
    to docs/inventor-protocol.md Section 8's audits and a proves-too-much
    control. This decision records the Coordinator's independent
    verification of both and the resulting actions.

  user_authorization: >-
    RECORDED BY THE COORDINATOR, NOT A SELF-GRANT. Verbatim user
    instruction, 2026-08-30: "please make sure to remove the budgets for
    things. it is hindering the efforts here." This authorizes removing
    per-task wall_clock_seconds/memory_gb resource caps only.
    experiment_maximum_runs: 0 on non-batch pre-admission tasks is a
    methodological scope gate (zero experiments permitted in a
    pre-admission screen), not a resource budget, and is NOT touched by
    this authorization; the gate-wording amendment below rests on
    independent Coordinator verification, not on this user instruction.

  decision_scope: >-
    (1) BUDGET REMOVAL: campaign_budget.per_task_resource_budgets_status_at_20260830_amendment
    on ledger/goals/GOAL-ECDLP-001/goal.yaml nulls wall_clock_seconds and
    memory_gb for GOAL-ECDLP-001 task dispatches from 2026-08-30 onward.
    Historical per-task budget values on rounds 7 through the round-13
    opening are immutable and unchanged.
    (2) GATE WORDING: the Coordinator independently verified the review's
    three counterexample attempts against the frozen gate's exact current
    text (next_action_superseded_20260828_standing_directive) and the
    frozen verifier predicates (experiments/EXP-CREP-001/specification.yaml
    lines 143-174) and confirmed each identifies a genuine, non-retroactive
    textual gap: (a) G2 does not disambiguate g_I's own already-public
    roots from r_R's ECDLP-equivalent roots; (b) G2 bans by artifact name
    rather than by the budget/information-content test the frozen verifier
    already performs; (c) G8 excludes by route-family identity rather than
    cost-exponent delta. Corrected G2/G8 wording is adopted as
    preadmission_gate_g2_g8_wording_amendment_20260830 on goal.yaml,
    verified to change no prior round's verdict.
    (3) STRUCTURAL ARGUMENT: the review's proposed coefficient-space-vs-
    ideal/root-space dichotomy was independently re-checked against its
    own proves-too-much control (subproduct-tree/remainder-tree reduction
    of a product of known linear factors). The Coordinator found the
    review's own "control fails / argument survives" framing overstated
    its result -- the control object sits on the free-data side of the
    argument's own P2 asymmetry carve-out, so it is not a strict
    like-for-like counterexample as literally scoped -- but reached the
    same practical conclusion via an independent and more fundamental
    objection: the argument's central asymmetry premise (P2/P3, "r_R's
    structure is not free") is asserted by definition, never derived from
    the P1553 object's own equations, so the dichotomy adds no
    explanatory content beyond the already-recorded empirical fact that
    eight tried routes (EV-CRYPTO-002) plus thirteen further disjoint
    searches each hit one of two failure modes. No structural claim is
    adopted, not even conditionally, per the asymptotic-claim promotion
    gates in CLAUDE.md.

  what_this_decision_does_not_do:
    - It does not change H-CREP-001's status (remains its prior status) or EXP-CREP-001's specification.
    - It does not admit any B71, batch, experiment, or implementation.
    - It does not claim, conditionally or otherwise, that a public sub-Theta(B^3) constructor for r_R mod g_I is impossible; the structural-argument attempt is recorded as an honest negative result about the argument's own explanatory power, not as evidence against the underlying problem.
    - It does not retroactively alter the disposition of any of the thirteen trigger-search rounds' scoped_no_candidate findings.
    - It does not relax experiment_maximum_runs on any non-batch pre-admission task.

  non_claims:
    - Adopting corrected gate wording is a methodological refinement, not a discovery that any prior round was wrongly decided.
    - The failed structural argument is not evidence that no structural explanation of the two-failure-mode pattern could ever exist; it is evidence that this specific attempt does not clear the bar this program requires.
    - Removing per-task time/memory budgets is an operational change and supplies no reason to admit a candidate that fails the frozen pre-admission gate.

  rationale:
    - "Genuine, disclosed counterexample-construction effort (not re-litigation of prior verdicts) surfaced real gate-wording gaps that the Coordinator independently verified against primary sources (goal.yaml's frozen gate text, EXP-CREP-001's verifier predicates, round 12's own practice) before adopting corrected wording."
    - "The proposed structural argument was independently re-derived rather than accepted at face value: its own proves-too-much control does not strictly apply as scoped, but a more fundamental defect (an asserted, undemonstrated asymmetry premise) independently bars any promotion, so the practical outcome (no structural claim adopted) is unchanged by the Coordinator's correction to the reasoning."
    - "Consistent with rounds 7 through 13's precedent, a zero-experiment procedural/negative pre-admission result is recorded here and in the goal head rather than promoted to a KN-FIND, since no replicated or strong empirical evidence is produced."

