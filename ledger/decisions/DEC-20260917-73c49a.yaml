coordinator_decision:
  id: DEC-20260917-73c49a
  context: >-
    Design-experiment stage of the quasi-subfield / ECC2K-130 line
    (RQ-QSP-f9bbdb), branch claude/ecc2k-130-quasi-subfield-poly-nhcj1f,
    2026-09-17. The idea-generator's TASK-20260916-a93a2a filed four proposals
    on this question; a pre-compute audit (analysis/qsp-ecc2k130/explore/,
    section-8 of docs/inventor-protocol.md, ANALYSIS AND NOT EVIDENCE) ranked
    IDEA-20260916-5c9d6e first, on the ground that its mathematics is the
    load-bearing item and survived every numerical check the audit could run.
    This session drafted the hypothesis H-QSP-5540d7 from that proposal --
    sharpening the sum bound d^{q+1} + p^{n'-r} to the max bound
    max(d^{q+1}, p^{n'-r}), the corollary from beta >= n(n'-1)/(n'(n+n'-r)) to
    the exact beta >= n/(n+n'-r), and the degenerate case to the full
    characterisation lambda = c X^{p^j} + b with L = M^{p^j} -- and froze the
    experiment contract EXP-QSP-33b442 at version 1 to test it. This decision
    approves that contract for execution and nothing else. It does not assert
    that H-QSP-5540d7 is true, does not move its status past `specified`, and
    creates no evidence.
  decision: approve
  target_ids:
    - H-QSP-5540d7
    - EXP-QSP-33b442
  rationale:
    - >-
      APPROVAL BASIS. AGENTS.md "Standing user authorization for ideas and
      experiments" (user instruction of 2026-09-06: "all is approved.
      ideas/experiments should be always approved") is standing authorization
      for experiment design and execution in this program. The Coordinator does
      not ask the user to confirm a frozen protocol and did not ask here. What
      remains the Coordinator's responsibility, and what this decision records,
      is PROTOCOL READINESS: an incomplete protocol is completed or records its
      concrete technical impediment; it never waits for user approval.
    - >-
      COMPLETENESS CHECK PERFORMED, FIELD BY FIELD. Every field of
      experiments/EXP-QSP-33b442/specification.yaml was read and confirmed
      NON-NULL before this decision was written. Named explicitly: `id`,
      `hypothesis_id` (= H-QSP-5540d7, which exists at
      ledger/hypotheses/H-QSP-5540d7.yaml with status `specified`), `version`
      (= 1), `title`, `status` (= approved), `status_note` (cites this decision
      and the standing authorization), `source_proposal` (= IDEA-20260916-5c9d6e,
      which exists), `objective`, `class`, `inputs` (code_reuse, field_models,
      instruments I1/I2/I3 and degenerate_detection, and the six stage blocks
      stage_0 through stage_5, each with cells, candidates, instruments and
      recorded quantities), `controls` (six, C1-C6, each with name, role and
      detail), `independent_variables` (seven), `metrics.primary` (M1-M4) and
      `metrics.secondary` (M5-M10), `heuristic_under_test` (= H2) with
      `heuristic_under_test_note` scoping H1 out, `preregistered_prediction`
      with all three sub-fields `quantity`, `formula` and `source` filled,
      `scale_relevance.tier` / `.justification` / `.correspondence` (the last
      filled rather than left null, because no sampling correspondence is used
      and that fact is itself the content), `tail_checks` (five), `replication`
      with `seeds` (base_seed, two named stream families, and the explicit
      statement that Stages 0/1/2/3 are seed-free and exhaustive) and
      `independent_instances`, `budget` with `enforcement: advisory` and all
      five numeric fields plus a note, `stopping_rules` (seven),
      `invalidation_rules` (eight), `success_criterion`,
      `falsification_criterion`, `required_artifacts` (eleven),
      `measured_vs_modeled`, `claim_tier_note`, `drafting_provenance`,
      `assigned_to` (= executor) and `approved_by` (= coordinator). The two
      approval-gate fields that tools/validate_ledger.py checks on an
      `approved` contract -- `success_criterion` and `falsification_criterion`
      -- are both present and both decidable from the listed metrics alone.
    - >-
      THE SUCCESS CRITERION ADMITS A NEGATIVE OUTCOME, CHECKED. Success is the
      conjunction S1-S5 over M1, M2, M3, M6 and the Stage 0 / certificate gates;
      each conjunct is a comparison of a metric this contract produces against a
      number fixed before any run. The falsification branches F0-F6 are stated
      in the same terms, with F1 (a certified candidate above the bound) and F2
      (a complete splitter below the corollary) each split into a WEAKEN branch
      (the sum form, or the conservative corollary, survives) and a
      REJECT-IN-SCOPE branch. F1 at n = 131 with a re-verified root list would
      simultaneously answer decision target (a) of RQ-QSP-f9bbdb POSITIVELY,
      i.e. the contract is built so that the outcome contradicting the
      program's current reading is the one it most wants to find. F5 (instrument
      disagreement) and F6 (timeout, crash, memory cap, budget) are classified
      as run-invalidity and infrastructure respectively, never as mathematical
      evidence, per AGENTS.md rule 3.
    - >-
      CONTROLS ARE REAL AND TWO OF THEM ARE KNOWN-FALSE OBJECTS. C1 is the
      r = 0 subfield cell (12, 6, lambda = X) where the conclusion of (B) is
      KNOWN FALSE (Diem's family splits completely at d = 1): the argument must
      go vacuous there and the instrument must return the forced 64. C2, C3 and
      C4 force 8, 32768 and 4 on published objects (Type 2 at n = 7 and n = 31,
      the Theorem 1 equality case) and two of them are the tightness slices
      where the bound must be ATTAINED. C5 is a 1200-draw random null object
      under the same ceiling and the same instruments. C6 decides the
      linearized slice by an INDEPENDENT procedure (Proposition 2 of
      KN-LIT-4fe9d2), so that slice is cross-checked rather than self-reported.
      A contract whose proves-too-much objects are only symbolic was not
      accepted: every one of them runs through the same instrument that
      produces every other count.
    - >-
      THE PRE-COMPUTE AUDIT IS QUARANTINED AS CONTEXT. The exact values
      pre-registered in `preregistered_prediction.formula` (the per-cell
      ratios, the 65 complete splitters at four (n, n') cells, the n = 131
      histograms and the four N = 132 candidates at n' = 33) come from
      analysis/qsp-ecc2k130/explore/README.md, an analysis note explicitly
      marked "not evidence". The contract states in three places -- inputs.
      code_reuse, measured_vs_modeled, and an invalidation rule -- that the
      analysis JSONs are CONTEXT, may not be copied into runs/, and that a
      number read out of them rather than reproduced is a violation of
      AGENTS.md core rule 5. Pre-registering the audit's values makes the run a
      genuine independent re-computation with a declared expected answer, which
      is stronger than a blind re-run: a mismatch is then a localisable
      discrepancy between two implementations rather than a silent correction.
      The audit's own disclosed defect (the gf2rc.c parser overflow that
      invalidated an a = 18 cell, corrected 2026-09-17) is exactly why the
      re-computation is required rather than cited.
    - >-
      THE SHARPENINGS THIS SESSION INTRODUCED ARE FLAGGED, NOT SMUGGLED. Two
      statements in H-QSP-5540d7 are the drafting agent's and are NOT in
      IDEA-20260916-5c9d6e as filed: the MAX form of the bound (in place of the
      proposal's sum form d^{q+1} + p^{n'-r}) and the EXACT corollary
      beta >= n/(n + n' - r) (in place of the proposal's conservative
      n(n' - 1)/(n'(n + n' - r))), together with the fuller degenerate-case
      characterisation. Both are pre-registered in the contract so the
      experiment TESTS them rather than assuming them, and Stage 2 checks every
      complete splitter against BOTH thresholds so that a failure of the max
      form which the sum form survives is recorded as a WEAKEN rather than a
      rejection. A reviewer must treat these two as this program's claims, not
      as the proposal's.
    - >-
      ONE DRAFTING AMBIGUITY RESOLVED BY A STATED ASSUMPTION. The design task
      named beta >= n(n' - 1)/(n'(n + n' - r)) as "the EXACT corollary" while
      H-QSP-5540d7 (B) names n/(n + n' - r) as exact and the former as the
      conservative fallback. The contract computes and reports BOTH for every
      complete splitter and evaluates the success criterion on the STRONGER
      (n/(n + n' - r)), whose satisfaction entails the other. No reading is lost
      and the stricter test is the one that gates success; this is recorded in
      inputs.stage_2.thresholds.
    - >-
      SCOPE AND TIER SET BEFORE EXECUTION, NOT AFTER. The contract fixes
      scale_relevance at tier `toy` while stating why the BOUND needs no
      transfer assumption at all (it is derived for every p, n, n', lambda) and
      why the n = 131 cells are exact certified counts at the target parameter
      rather than extrapolated toy evidence; it declares the two unlicensed
      transfers (p = 2 to general p, which goes by derivation only; and the 732
      certified lambda versus every other lambda at those n', which the
      derivation covers and no list does). It also declares in advance
      (claim_tier_note) that a supported outcome is a CLOSURE OF A RESEARCH LINE
      UNDER A STATED COST MODEL and therefore routes the promoting review to
      `review-breakthrough` at `max` under AGENTS.md rule 12, with the
      `review_plan` written by the Coordinator on the REVIEW handoff and
      deliberately not pre-written by the producer's own contract.
    - >-
      BUDGET IS COMPLETE AND NO FIELD IS NULL. enforcement `advisory`,
      wall_clock_seconds_per_run 7200, total_cpu_hours 4, maximum_memory_gb 4
      (machine protection, a real limit), maximum_runs 6, maximum_workers 1,
      plus a note distinguishing the advisory time estimates from the real
      memory and concurrency limits per CLAUDE.md's 2026-09-06 research-budget
      instruction. This Coordinator would have rejected its own handoff had any
      budget field been null.
    - >-
      DISPATCH IS ORDERED, NOT IMMEDIATE. The executor handoff
      TASK-20260917-892420 is written but is NOT dispatchable until the snapshot
      archive TASK-20260917-0ef594 has committed this contract, this decision
      and the hypothesis and the post-commit verifier has accepted them: an
      official transition from uncommitted artifacts is forbidden (AGENTS.md
      rule 7), and an executor reading a specification that exists only in a
      dirty worktree is reading an unfrozen contract.
  evidence_refs:
    - >-
      CONTEXT, NOT EVIDENCE -- inputs/HUANG-2020-JMC-QSP/paper_fulltext.md and
      knowledge/literature/KN-LIT-0a321c.md (Section 3.1, Lemma 4.1 with its
      Appendix A.2 proof, Appendix A.1 for M(E), Lemma C.2 and Appendix C.2,
      Section 5's open items). A frozen paper is the baseline this record must
      reproduce and improve on; it is not evidence for this program's claim.
    - >-
      CONTEXT, NOT EVIDENCE -- inputs/EULER-PETIT-2019-QSP/paper_fulltext.md and
      knowledge/literature/KN-LIT-4fe9d2.md (Definition 2 and beta, Theorem 1
      and its equality case, Proposition 2, Proposition 5 Types 1/1bis/2,
      Proposition 6, Proposition 8 and Remark 1). Same standing: it supplies the
      tightness slices, the independent linearized decision procedure, and the
      cost interface of H1.
    - >-
      CONTEXT, EXPLICITLY NOT EVIDENCE -- analysis/qsp-ecc2k130/explore/README.md
      and its JSONs. A section-8 pre-compute audit run outside the harness with
      no contract and no manifests. It is the source of the pre-registered exact
      values and of the ranking that put IDEA-20260916-5c9d6e first; NO
      statement in it may be cited as evidence for or against H-QSP-5540d7, and
      EXP-QSP-33b442 exists precisely to re-produce its numbers under the
      harness with certificates.
    - >-
      LEDGER CONTEXT -- ledger/proposals/IDEA-20260916-5c9d6e.yaml (the source
      proposal), ledger/hypotheses/H-QSP-5540d7.yaml (the hypothesis under
      test), ledger/questions/RQ-QSP-f9bbdb.yaml (the question and its decision
      targets (a), (b), (c)), ledger/corrections/CORR-20260916-8d0b81.yaml (the
      corrected M(E) exponent and the inverted premise (4), for the
      F_2-coefficient slice), ledger/handoffs/TASK-20260916-a93a2a.yaml (the
      ideation session) and ledger/handoffs/TASK-20260916-523cab.yaml (the
      snapshot archive of the inputs).
    - >-
      NO EMPIRICAL EVIDENCE RECORD IS CITED, BECAUSE NONE EXISTS. There is no
      EV-QSP-* record, no run of EXP-QSP-33b442, and no result. This is an
      approval decision; its evidentiary basis is the completeness of the
      contract, not any measurement.
  limitations:
    - >-
      DERIVATION TIER, AND ONLY THAT. Even a fully successful run supports
      H-QSP-5540d7 at DERIVATION tier (docs/claims-and-verification.md): a
      checkable argument plus certificate-bearing counts at toy n and at
      n = 131. It is not a machine-verified proof, and the program has not
      verified the argument's novelty against the wider finite-field literature
      (the McGuire-Mueller pointer arXiv:1905.11755 was read as an ABSTRACT
      ONLY and supports nothing).
    - >-
      THE COST-MODEL SCOPING ASSUMPTION. The closure reading (E) -- "no such
      factor base beats generic algorithms" -- holds only UNDER H1, the
      Proposition 8 / M(E) cost model of the two frozen papers. H1 is NOT tested
      by this experiment and cannot be: its validation route
      (IDEA-20260916-b84e2d) is blocked by a recorded engine impediment (no
      Groebner or resultant engine in the container). A solver whose per-attempt
      cost does not grow with d is not excluded by (E); it is constrained only
      by (A), which bounds |F| and needs no cost model. Any report of this work
      that states the closure without stating H1 is overclaiming.
    - >-
      REVIEW-BREAKTHROUGH IS REQUIRED BEFORE ANY PROMOTION. A closure of a
      research line is a rule-12 claim: independent `review-breakthrough` at
      `max` effort, undegradable, in its own session, with a Coordinator-written
      review_plan. Until that review returns, H-QSP-5540d7 may reach `analyzed`
      at most; it may not reach `supported` on this contract's runs alone, no
      KN-FIND may be promoted from it, and no synthesis statement about the QSP
      line may be published.
    - >-
      SCOPE OF WHAT A RUN CERTIFIES. p = 2 in every numerical cell; the Stage 3
      census certifies exactly 732 named polynomials at three n' values at
      n = 131 and nothing else by enumeration; everything else at n = 131 is
      arithmetic on the corollary. The rational-lambda extension (D)(ii) and the
      isogeny-L reading (D)(iii) remain conjectural regardless of outcome, and
      n' | n (Diem's subfield family) is untouched by construction.
    - >-
      NO ATTACK, NO EXPONENT, NO DEPLOYED CURVE. Nothing in this contract runs
      against a curve or a key, and no outcome of it moves any ECDLP cost
      exponent. rho at 2^60.9 on ECC2K-130 (KN-LIT-096) is unaffected either way.
    - >-
      APPROVAL IS NOT VALIDATION. Under the standing authorization, approving
      work asserts nothing about the truth of its hypothesis or the validity of
      its future results, and rewrites no historical record.
  next_actions:
    - >-
      1. ARCHIVE FIRST. Execute the snapshot archive TASK-20260917-0ef594 ALONE
      in the shared worktree (no concurrent writer), staging exactly its eight
      declared artifact paths, after fetching origin/main and merging it into
      claude/ecc2k-130-quasi-subfield-poly-nhcj1f (merge, never rebase); record
      the base commit and merge outcome in the receipt. Then push the branch and
      open or refresh a PR against main naming the new records H-QSP-5540d7,
      EXP-QSP-33b442, DEC-20260917-73c49a, TASK-20260917-892420 and
      TASK-20260917-0ef594. A record that exists only in a local commit is
      unpublished, not durable evidence.
    - >-
      2. DISPATCH ONLY AFTER THE VERIFIER ACCEPTS. Dispatch
      TASK-20260917-892420 to the `executor` (policy executor-implementation,
      reasoning_effort medium, no fallback, no degradation) ONLY once the
      post-commit verifier has accepted the archive commit and the declared
      path_sha256 values match the tree. Do not dispatch on a message, a
      promise, or a dirty worktree.
    - >-
      3. ARCHIVE THE RUN OUTPUT SEPARATELY. When the Executor returns, open a
      NEW Coordinator snapshot-archive task for
      experiments/EXP-QSP-33b442/implementation/, runs/ and
      execution-report.yaml, before any reviewer reads them. TASK-20260917-0ef594
      archives the CONTRACT, not the output.
    - >-
      4. VALIDITY BEFORE INTERPRETATION. On return, check the run set for
      validity before reading a single number: expected stage and candidate
      counts (1260 Stage 1 candidates, 1200 Stage 1b draws, 732 Stage 3
      candidates, 400 Stage 4 draws), schema-complete manifests per the AGENTS.md
      artifact policy, seed integrity on the two seeded arms, raw/summary
      agreement, forced-fixture agreement (64, 8, 32768, 4), and certificate
      re-verification at n = 131. An invalid or incomplete run set goes back to
      the Executor with the concrete defects listed; it is not evidence.
    - >-
      5. OPEN THE REVIEW ROUND WITH A REVIEW PLAN. If the run is valid, write a
      review handoff carrying a `review_plan` (claim under review as its
      producer stated it, the Coordinator's recorded prior, one owner per joint
      with a worked attack plan, mutual blindness, the proves-too-much objects
      including n' | n and Type 2 at n = 127, and a blind re-derivation of the
      degree of D from the statement alone) and route it to
      `review-breakthrough` at `max` in an independent session per AGENTS.md
      rule 12. Do NOT downgrade the tier if it cannot be served: the claim stays
      un-promoted and the line stays active.
    - >-
      6. LEAVE H1 SCHEDULED, NOT ASSUMED. Keep IDEA-20260916-b84e2d's engine
      impediment recorded and revisit it as the validation route for H1; the
      closure reading (E) stays conditional until it is designed and run.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Not an evidence-review decision: this approves a contract before any run
      exists, so there is no evidence of any strength, no durable claim, and
      nothing to promote to knowledge/findings/. A KN-FIND becomes possible only
      after a valid run AND the rule-12 `review-breakthrough` round.
  decided_by: coordinator
  decided_at: '2026-09-17'
