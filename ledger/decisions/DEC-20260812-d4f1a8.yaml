coordinator_decision:
  id: DEC-20260812-d4f1a8
  context: >-
    The user explicitly authorized, this session (via AskUserQuestion, after
    the Coordinator clarified scope with the user), a GOAL-ECDLP-001-SCOPED
    budget-ceiling extension: raise campaign_budget.maximum_batches by
    exactly fifty batches on GOAL-ECDLP-001 alone, from 51 to 101. This
    authorization is SEPARATE FROM, LATER THAN, AND LARGER THAN the
    program-wide +1 raise recorded earlier this session in
    BUDGET-AMEND-20260812-001 / DEC-20260812-f30c6e; the two are not the same
    authorization and this record does not conflate them. This decision
    records that separate authorization and the resulting single,
    goal-scoped administrative act, continuing the same amendment pattern
    (inline dated status note, maximum_batches_history entry,
    budget_amendments entry) already used by BUDGET-AMEND-20260812-001 and
    by every prior maximum_batches raise on this goal. It is a further
    instance of the "separate decision, on explicit user authorization" that
    GOAL-ECDLP-001's own record states THE COORDINATOR DOES NOT SELF-GRANT.
  decision: approve
  decision_vocabulary_note: >-
    approve means approve the batch-ceiling raise itself
    (campaign_budget.maximum_batches: 51 -> 101 on GOAL-ECDLP-001 alone) as a
    bounded administrative act on explicit user authorization. It does not
    approve any experiment, does not open any new batch, does not change any
    hypothesis status, claim tier, completion criterion or pause condition,
    and does not reactivate any goal that is not already `active`. It does
    not touch, amend, retract or reinterpret BUDGET-AMEND-20260812-001 or
    DEC-20260812-f30c6e.
  decision_scope: >-
    STRICTLY campaign_budget.maximum_batches on GOAL-ECDLP-001 alone: 51 ->
    101. No other campaign_budget field (total_wall_clock_seconds,
    max_concurrent, accounting_basis) moves. No claim_tier_ceiling,
    completion_criteria, pause_conditions, objective_and_scope,
    active_hypothesis_ids, or hypothesis status moves on GOAL-ECDLP-001 or
    on any other goal. No batch is opened, no run is authorized, and no
    Executor task is dispatched by this decision. GOAL-SSI-001,
    GOAL-SSIQ-001 and GOAL-ENDO-001 are explicitly NOT in scope: each
    carries campaign_budget.maximum_batches: null (unbounded), the user was
    asked whether to convert any of the three to a finite cap, and the user
    chose to leave all three uncapped as-is. Nothing on those three records
    is changed by this decision.
  target_ids:
    - GOAL-ECDLP-001
  amendments_recorded:
    - goal_id: GOAL-ECDLP-001
      field: campaign_budget.maximum_batches
      prior_value: 51
      new_value: 101
      record: BUDGET-AMEND-20260812-002 (in ledger/goals/GOAL-ECDLP-001/goal.yaml budget_amendments:)
  explicitly_skipped:
    - goal_ids: [GOAL-SSI-001, GOAL-SSIQ-001, GOAL-ENDO-001]
      reason: >-
        campaign_budget.maximum_batches is already null (unbounded) on each
        of these three. The user was explicitly asked whether to convert any
        of them to a finite cap as part of clarifying the scope of this
        authorization, and chose to leave all three uncapped. There is
        nothing for a ceiling raise to do to an unbounded budget; amending a
        null ceiling would be a fabricated action with no operative content.
        No field on any of these three records is touched by this decision.
  rationale:
    - >-
      The user gave this authorization explicitly via AskUserQuestion this
      session (2026-08-12), after the Coordinator asked a clarifying
      question about scope, and the authorization as confirmed was scoped
      to "raise campaign_budget.maximum_batches by exactly fifty on
      GOAL-ECDLP-001 alone" and nothing else. This is a separate, later, and
      larger authorization than the program-wide +1 raise recorded earlier
      the same session in DEC-20260812-f30c6e / BUDGET-AMEND-20260812-001,
      and this record does not treat the two as one authorization or one
      decision.
    - >-
      That is the exact basis GOAL-ECDLP-001's own record already requires
      in writing before the Coordinator may raise its batch ceiling: "THE
      COORDINATOR DOES NOT SELF-GRANT ONE." This decision records that
      authorization explicitly and cites it rather than assuming it,
      consistent with prior practice on this ledger (BUDGET-AMEND-20260727-001..-004,
      -20260728-001/-002, -20260729-001..-004, -20260730-001, and
      BUDGET-AMEND-20260812-001), each a batch-ceiling raise recorded as a
      scoped campaign_budget_ceiling amendment that touches maximum_batches
      alone.
    - >-
      GOAL-SSI-001, GOAL-SSIQ-001 and GOAL-ENDO-001 are excluded because the
      user, on being asked, chose to leave them uncapped (null); there is
      nothing for a ceiling raise to do to an unbounded budget, and
      converting an uncapped goal to a finite cap without the user's
      direction would be an unrequested and unexplained scope change
      smuggled in as a budget act.
  evidence_refs: []
  limitations:
    - >-
      This decision authorizes no research, no experiment, no run, and no
      batch opening. It changes exactly one integer field on one goal record
      and nothing else. GOAL-ECDLP-001's next actual batch still requires
      its own separate dispatch decision under its existing scope,
      completion criteria, and review requirements.
    - >-
      Raising a batch ceiling is not evidence that GOAL-ECDLP-001's
      remaining work is more tractable, more likely to succeed, or closer to
      a completion criterion; none of that is asserted here. No hypothesis
      status moves, no claim tier moves, and no exponent moves in either
      direction. All four asymptotic-claim promotion gates remain open.
    - >-
      GOAL-ECDLP-001's total_wall_clock_seconds = 28800 remains untracked
      and therefore unevaluable per total_wall_clock_tracking_status and
      INT-BATCH006-005; this decision does not raise, extend, waive, or
      claim satisfaction of that figure, and is unaffected by it.
    - >-
      This decision is distinct from, and must not be read as amending,
      superseding, or being covered by, DEC-20260812-f30c6e. That record
      authorized a uniform +1 raise across fourteen active finite-cap goals
      including GOAL-ECDLP-001 (50 -> 51). This record authorizes a further,
      separate, GOAL-ECDLP-001-only +50 raise (51 -> 101), on a distinct and
      later user authorization obtained in the same session.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Administrative budget-ceiling amendment; no empirical or theoretical
      evidence is produced or reviewed by this decision.
  next_actions:
    - >-
      No batch is authorized to open by this decision alone. GOAL-ECDLP-001's
      next batch remains gated on its own existing next_action, scope
      ruling, and any still-open budget/wall-clock constraint (e.g.
      total_wall_clock_seconds remains untracked/unevaluable per
      INT-BATCH006-005 and is unaffected by this decision).
    - >-
      The orchestrating session must run
      `python3 tools/allocate_id.py --check DEC-20260812-d4f1a8` (and
      equivalent freedom/collision checks on BUDGET-AMEND-20260812-002)
      before this record is treated as committed, since this drafting
      session has no Bash/shell tool to run that check itself. If either ID
      is found to collide, this record and the corresponding goal-file
      amendment must be superseded with a freshly minted ID rather than
      edited in place.
    - >-
      Run `tools/validate_ledger.py` before commit to confirm schema
      conformance of both the amended goal file and this decision record.
  decided_by: coordinator
  decided_at: '2026-08-12'
