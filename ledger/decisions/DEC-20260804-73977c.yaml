    not_warranted: >-
      EV-AES-048545 is toy-tier scope evidence. The boundary question is now
      resolved (NO nonlinearity required, D-6), but the finding is a negative
      scope result on a toy SPN with no asymptotic claim and no adjudicable
      reference; promotion to knowledge is deferred until the RANK-1 repair
      lands and the batch closes with its claims committed.
  decided_by: coordinator
