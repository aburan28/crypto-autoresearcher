  rationale:
  - The frozen final archive handoff names the four reviewer outputs as
    inputs/read scope and promises to bind them, but omits their paths from
    its own write scope and has no declared intermediate snapshot receipt.
  - Adding the four reviewer paths to final artifact_paths would give the
    same artifacts two queue owners and fail research_dispatch validation.
    A prospective write-scope extension lets the final archive commit their
    exact source bytes while preserving reviewer artifact ownership.
  - The final handoff's uncommitted reviewer-file inputs would make its
    committed-and-pushed pre-dispatch input gate circular. The two published
    matching releases are committed inputs; reviewer files remain source
    artifacts for the snapshot and later composition.
  - The Validator release was generated from the detached checkout's actual
    files by goal_lanes, copied byte-identically to the branch and published
    as a single-file commit. That transport did not import or interpret the
    blind report. Both process releases precede durable reviewer snapshots.
  ranking:
  - priority: 1
    action: Archive and push the four exact correction content paths and a
      separate content-at-commit receipt; verify the successor selector.
  - priority: 2
    action: Claim TASK-20261019-6398fb under the corrected queue; copy only
      the two Validator outputs into its declared branch paths, match all
      four reviewer files to their releases, then commit and verify a
      four-file snapshot and separate snapshot receipt before comparison.
  - priority: 3
    action: After snapshot verification, compose independent evidence,
      decisions and required visuals under the frozen scientific scope.
