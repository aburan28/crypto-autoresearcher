  decision_scope: >-
    Publish a prospective side queue for the still-unclaimed final archive.
    Its reviewer output source files enter the final archive's write scope
    for a four-file snapshot, while remaining owned as artifacts by their
    respective reviewer tasks. The final archive gains a declared snapshot
    receipt. Both matching completed releases, already committed and pushed,
    replace uncommitted reviewer output files as pre-dispatch handoff inputs.
    No report is interpreted or scientific status changed by this decision.
  evidence_refs:
  - coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-5bfb57/claims/TASK-20261019-02a5c2.1.release.json
  - coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-5bfb57/claims/TASK-20261019-bb87e3.1.release.json
