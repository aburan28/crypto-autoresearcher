        ulimit, nice, taskset or wrapper script). Exhausting an envelope, a
        watchdog or the SF-2 (c) / HR-6 cap is an infrastructure outcome and a
        checkpoint, never evidence about D. Run ceilings: r4 stage 0, R2-r4
        31, R2b-r4 11; at most 48 packages in the lineage over the ten plans
        (6 existing + 42 reserved). NO attack, NO unknown-scalar solve, NO
        deployed-curve instance, NO wall-time extrapolation, NO use of any
        retired id (162), NO msolve, valgrind, callgrind_annotate, gp or Sage
