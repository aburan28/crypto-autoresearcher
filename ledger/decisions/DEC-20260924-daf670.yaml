  rationale:
    - >-
      THE INCORPORATED READINGS DECIDE, AND THEY HELD. RFR-1..RFR-4 were
      written before any of the five reviews. This review, run by a fresh
      context blind to the author's decision and prior, attacked every launch
      kind on every child path, ran a known-answer control that re-found every
      earlier break including the last one (CX-A), and found no fail-open and
      no planned-basis refusal. The readings' approval branch is the one the
      files support.
    - >-
      THE NEAREST-OBJECT CONTROL LOCATES THE REPAIR. Under attcount CX-A
      PASSes; under launchkind it FAILs; with the single equality of RJ-1 (b)
      weakened to "at most" it PASSes again (review 253-259, 1282). The
      repair's effect is attributable to the clause written for it.
    - >-
      FAIL-CLOSED FINDINGS ARE NOT BARS, AND THEY ARE NOT LEFT AS TRAPS. Seven
      of eight findings would stop the stage under an unfavourable reading of
      the draft's own words. Each is given the reading the text's words and
      the lineage's conventions support, tested against every prohibition of
      what_the_readings_cannot_do; where a check could be kept stronger it is
      (LKA-7 closes the stored-reference residual; LKA-10 fails any path
      outside the run directory).
    - >-
      THE ENUMERATION HAD A FLOOR. Twelve calls of one frozen function, six
      in production, all six bound to a detector written independently of
      the recorder; a seventh kind FAILs at run time and STOPs at stage time.
      The path enumerations that did not converge (KN-TECH-79d6b9) were not
      repeated.
    - >-
      AN APPROVAL IS NOT A RESULT. No r4 code exists; DV-18 and DV-11 on the
      delivered code are the next tests, and every stop there goes to a new
      decision with FD, IE and the callgrind detector as named revisits. THE
      LANE STAYS OPEN: nothing measured D. NO SECURITY READING: toy
      EcGFp5-shaped arithmetic with known scalars; nothing transfers to p =
      2^64 - 2^32 + 1.

