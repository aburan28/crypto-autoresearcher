      them" (os.execv, os.fork, os.read, os._exit). So "a function the frozen
      solve, run_system, callgrind_instructions, child_job or curve_facts
      calls" is read transitively down to process primitives as v2_solver
      sees them, excluding v2_solver.run_child, the RL-1 recorder, and every
      function the recorder or the SE-3 / HR-3 wrappers themselves are. The
      (28) / (29) os.open stand-in, resolved at call time in the child only,
      is admitted. The readings permit it: this is the reading under which
      the stated purpose holds; it forbids more than the direct-call reading
      admits at the recorder's slot and removes no check.
    FC-4: >-
      NOT A BAR (review 914-926). DECISION: THE SEMANTIC READING, WITH THE
      RL-1 RECORDER AS THE ONE PERMITTED CALLER, CHECKED BY A LOAD SCAN
      (LKA-7). RJ-4 (c)'s parenthetical method ("by ast; every call through
      the module attribute V.run_child or the module global run_child")
      attaches to the production call sites; the clause "no r4 function
      calls run_child" carries no method and, read semantically, covers calls
      through any reference. Read literally it would STOP on the recorder,
      which RL-1 (a) requires to call the ORIGINAL run_child: a literal
      conflict between texts of the kind VA-6 resolved. Resolved: no r4
      function OTHER THAN the RL-1 launch recorder calls the frozen run_child
      by any reference; DV-18 (h) checks it by listing every load of the
      frozen object in the r4 tree (attribute loads of v2_solver.run_child,
      global name loads, from-imports, getattr) and requiring each to lie in
      the RL-1 installation and the captured reference to be called only
      inside the recorder. The readings permit it: relative to the syntactic
      method, nothing is excluded (the recorder's call is not a syntactic
      match), and the stored-reference residual the finding names is closed
      (the review's cheapest mutation, 1265-1267); a failure can only STOP.
    FC-5: >-
      NOT A BAR (review 927-936). DECISION: RB-7'S CONSUMER LIST READ WITH THE
      CONSUMERS THE INCORPORATING TEXTS NAME (LKA-8). Each draft of the chain
      writes "only what is replaced or added" and names its own consumer and
      class: attcount RI-1 (a) (i) and (ii) (RI-5 (b): the counts are
      epsilon, effect E2 through RF-3 (a)) and launchkind RJ-1 (b) (RJ-1 (d):
      class epsilon; RB-1 (e) epsilon, VC-1 (b)). RB-7's "the consumers named
      here" therefore reads as RB-7's list extended by those named
      consumers; any OTHER r4 consumer of an RB-1 value at E1-E4 is a DV-11
      STOP, unchanged. The readings permit it: VC-1 (b) allows an E1-E4
      reader of an epsilon value as a consistency check, which both are; the
      DV-11 stop for every unnamed consumer is kept.
    FC-6: >-
      NOT A BAR (review 937-945; LJ-6 782-801). DECISION: READING K (LKA-9).
      RJ-1 (a)'s normative text, written before the review, states that
      callgrind_result_present "is a presence bit of one top-level key of the
      returned result: it reads no value inside res["instructions_callgrind"],
      no CG-3 field value and no callgrind-site record or count; VA-6 (c) and
      CC-5 are unchanged" (launchkind 282-285). consumercover's definitions
      make the key a field of the S-1 SITE RECORD ("every key solve() sets",
      541-542), and its ACCESS MODES classify a read by the record it touches
      (m1, a literal key); the S-3 SITE RECORD is the mapping stored UNDER the
      key (544-546), none of whose fields is read. Reading D ("derived from
      the existence of the S-3 site record") would read a membership test on
      the S-1 record as a derived value of the S-3 record; the text of RJ-1
      (a) excludes it. Under K, RB-1 (e) is an epsilon S-1 value (RB-7) and
      RJ-1 (b) an epsilon consistency reader (VC-1 (b)). The readings permit
      it: VA-6 (c) and CC-5 are unchanged and still STOP any r4 read of a
      CG-3 field, a V-5 record or a callgrind-site count at E1-E4; LKA-9 fixes
      the implementation to a membership test so DV-11 can check it. The
      revisit condition of DEC-20260924-babd04 (the callgrind detector) is
      NOT MET: the review found RB-1 (e) is not a CG-3 field read (782-801);
      see disposition.callgrind_detector_revisit.
    FC-7: >-
      NOT A BAR (review 946-955). DECISION: READING R, STRICT (LKA-10). The
      stdout forms of RJ-1 (b), RJ-3 and RJ-4 (a) / (b) are written relative
      to the package, as RI-1 (a) and (b), RH-1 and RL-3 write theirs, and
      every earlier review of the lineage applied the relative reading to
      those forms (94cc33, be2daf, and this review's listing checks, 1077);
      reading L (literal comparison of a relative form with an absolute
      recorded path) has never been the lineage's reading of that form and
      would make every launch record UNKNOWN-KIND. R is made strict: a
      recorded stdout_path is relativized ONLY by removing the exact prefix
      "<run directory>/", where the run directory is the path the package
      records for itself (GFPN_RUN_DIR; command.txt line 2); a stdout_path
      without that prefix, or relativizing to none of the six forms, is an
      UNKNOWN-KIND GAP and FAILs. The readings permit it: PASS is not widened
      relative to the lineage's established reading of the same relative
      forms (RI-1, RH-1, RL-3), and the strict prefix rule adds a FAIL for
      any path outside the run directory.
    FC-8: >-
      NOT A BAR; COSTS NOTHING (review 956-968). A raise-path launch record
      may carry no argv (RK-1 (b) copies five fields; RL-1 (c) copies argv as
      the returned record carries it), so pari/<tag>.gp or
      child/<tag>.spec.json becomes a recorder gap; and gp_script raising
      after open() leaves a script with no launch. Each adds a gap only to a
      package that already FAILs (a raise ends the package). RECORDED. RJ-2's
      WHY statement is corrected (CORR-20260924-19154c item 4).

