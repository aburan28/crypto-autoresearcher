coordinator_decision:
  id: DEC-20260804-3b4258
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-060
  recorded_by_task: TASK-20260804-051
  archived_by: TASK-20260804-052
  context: >-
    BATCH-060 performed the H-GGM-001 simulability test for four augmented ECDLP
    oracles. Two oracles (C: incidence, D: endomorphism) are SIMULABLE by the GGM;
    two (A: first-jet, B: elliptic net) are NON-SIMULABLE but provide no sub-birthday
    advantage. H-GGM-001 advances from specified to analyzed.

  decision: support_scoped
  decision_vocabulary_note: >-
    support_scoped means: H-GGM-001's mechanism (the simulability test) correctly
    classified the four oracles. The test IS sound: SIMULABLE verdicts close at
    exponent 1/2, NON-SIMULABLE verdicts identify encoding-dependent information.
    This is a theoretical support at the claim boundary (mathematical argument,
    not empirical measurement). Scope: the four specific oracles tested; other
    augmented oracles require individual analysis.

  decision_scope: >-
    H-GGM-001 moves from `specified` to `analyzed`.
    Oracle C (incidence) and Oracle D (endomorphism images): CLOSED at exponent 1/2
    by the Shoup GGM lower bound. No further computation required for these oracle classes.
    Oracle A (first-jet) and Oracle B (elliptic net): NON-SIMULABLE but provide no
    sub-birthday advantage (A is privately computable = equivalent to DLP oracle;
    B is encoding-dependent = no k-recovery below DLP). GOAL-ECDLP-001 stays active.

  target_ids:
    - GOAL-ECDLP-001
    - H-GGM-001
    - BATCH-060
    - EV-GGM-79e710
    - KN-OPEN-005

  evidence_ids: [EV-GGM-79e710]

  rationale:
    - >-
      Oracle C (incidence): simulable by group operations + equality tests (m group
      ops per query). Shoup lower bound applies. Incidence-based index calculus is
      closed at exponent 1/2 by theorem.
    - >-
      Oracle D (endomorphism images): simulable for prime-order curves with End_{F_p}(E)=Z.
      Every phi=[m] is computable by m group ops. Shoup lower bound applies.
    - >-
      Oracle A (first-jet): non-simulable via [k]*(omega)=k*omega but privately
      computable (requires k). Equivalent to DLP oracle; no public advantage.
    - >-
      Oracle B (elliptic net): non-simulable but extracting k requires standard DLP.
      The Somos recurrence encodes k but provides no sub-birthday shortcut.

  h_ggm_001_transition:
    from: specified
    to: analyzed
    scope: >-
      Four oracles tested: incidence (SIMULABLE/closed), endomorphism (SIMULABLE/closed),
      first-jet (NON-SIMULABLE/privately-computable), elliptic-net (NON-SIMULABLE/no-shortcut).
      Other oracles (new proposal types) require separate analysis.

  exact_next_action: >-
    KN-OPEN-005 is partially addressed: incidence and endomorphism classes are now closed
    by theorem. The first-jet (Oracle A) being privately-computable is itself an important
    structural finding. The next open question in KN-OPEN-005 is: is there ANY publicly
    computable, non-simulable augmented oracle for prime-field ECDLP? This would be a
    breakthrough. Fresh ideation targeting this question is the next action for GOAL-ECDLP-001.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No KN-* entry was created by this decision. The record's `promoted` list held
      a placeholder id for a promotion that was OWED but never made, which made the
      record assert the opposite of the truth -- that the corpus had been updated.
      Converted under DEC-20260805-7b3e91 (RUL-9): the obligation is declared here,
      where the schema puts an unmet obligation, and every word of the original
      entry is preserved verbatim under owed_promotions below. Nothing was deleted.
    owed_promotions:
      - id: pending_kn_find_ggm_closure
        note: >-
          The simulability closure of Oracle C (incidence) and Oracle D (endomorphism)
          warrants promotion to KN-FIND: "For prime-order prime-field ECDLP, the incidence
          oracle and endomorphism-images oracle are GGM-simulable; the Shoup lower bound
          closes these oracle classes at exponent 1/2 by theorem."
  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2 for all simulable oracle classes
    sota_delta: {time_exponent: not_applicable, memory_exponent: not_applicable, data_or_query_exponent: not_applicable}
  claim_ceiling: theoretical
  official_research_state_changed: true
  state_changed_fields: ["H-GGM-001.status: specified -> analyzed"]
  decided_by: coordinator
  decided_at: '2026-08-04'
