coordinator_decision:
  id: DEC-20260803-147e9d
  context: >-
    GOAL-AES-003 BATCH-007 close. Two producers ran the ranked shape: rank 1
    attempted to explain the one unexplained fact this campaign had found -- that
    at r <= 4 exactly three of four plaintext words are preserved on every trial
    and the never-preserved index tracks the active word -- and rank 2 replicated
    the 27 RC-8 draws in an independent implementation. The package was bound by
    a dispatcher-verified snapshot archive at 1a0ad198 (200 declared paths) and
    reviewed by one independent validator, which was asked to work the algebra
    itself rather than check that the argument's predictions matched.
  decision: support_with_scope_reduction
  target_ids: [RQ-AES-003, GOAL-AES-003, EV-AES-a47618]

  rationale:
    - >-
      THE DERIVATION FOLLOWS, AND IT WAS CHECKED THE ONLY WAY THAT COULD HAVE
      CAUGHT IT IF IT DID NOT. The producer flagged that its own verifier was
      "independent in implementation but not in specification" -- both read the
      word geometry from the same index formula, so a wrong convention would have
      agreed with itself 24 out of 24 times. The validator discharged exactly
      that caveat: it wrote two instruments, one of which DERIVES the word
      geometry from ShiftRows itself, pinned both to the FIPS-197 C.1
      known-answer vector in both directions before testing any structural claim,
      and only then reworked every step. Agreement between an argument and its
      own predictions is what a lucky-but-invalid derivation looks like when the
      conclusion happens to be true; that is not what happened here.
    - >-
      THE BATCH'S PRINCIPAL RESULT IS THAT IT REMOVES ONE OF THIS CAMPAIGN'S
      RESULTS, AND THAT IS WHY IT IS SUPPORTED. At r <= 4 the statistic is 1.0 by
      theorem: not a statistic, blind to the swap mask given a nontrivial swap,
      and its "excess 2^30" is the arithmetic ceiling of the ratio rather than a
      magnitude. A campaign that can convert its own headline into a triviality,
      on its own initiative, with the derivation checked by someone who rebuilt
      the geometry from the specification, is working correctly. The
      inventor-protocol names premature closure and overclaiming as symmetric
      failures; this is the overclaiming side being retired at its source.
    - >-
      THE VALIDATOR FOUND A COUNTEREXAMPLE TO THE PREDICTIONS THE PROPOSITION WAS
      SHIPPED WITH, NOT MERELY A WORDING DEFECT. Two stated justifications are
      wrong -- L1's second sentence reverses the pullback direction, and Step 1's
      stopping criterion should be "contains no full column" rather than "meets
      all four columns" -- and the witness separating those two criteria is
      smask = 15, where the conclusion holds at EVERY round count. P5 and N5 as
      written are therefore false and need the smask 1..14 restriction the
      proposition itself carries. Neither error is load-bearing: all four uses of
      L1 take the correct direction. Recorded in full rather than smoothed over,
      because the wrong sentence is precisely the one a reader checking the
      argument would trip on.
    - >-
      THE SCOPE REDUCTION IN THIS DECISION'S VERDICT IS THE HONEST READING OF
      WHAT WAS PROVED. The derivation shows that ITS OWN TECHNIQUE stops at
      r = 5, not that the phenomenon does. The phenomenon's failure at r = 5 is
      measured. Support is therefore recorded for the proposition at r <= 4 with
      smask in 1..14, and explicitly NOT for any claim that r = 5 is understood.
    - >-
      RC-8 REPLICATED EXACTLY AND THEN COST THE CAMPAIGN A RANKED NEXT ACTION.
      All 27 draws agree field-by-field from the raw files with zero mismatches
      and byte-identical S-box tables, and the bound 0.784700038857546 was
      recomputed independently. But the validator also computed something nobody
      had: the SUPREMUM of that bound at 27 draws is 0.05^(1/27) = 0.89498, so
      the 0.90 criterion was unreachable at that sample size under ANY outcome.
      This campaign's "missed by two draws" conflated a confidence bound with a
      distance, and its rank 3 next action would have spent two draws to land on
      0.798439 -- a figure already on record -- while its stated purpose stayed
      32 draws away. The Coordinator recomputed all four figures by bisection on
      the exact binomial tail before adopting any of them.

  evidence_refs:
    - EV-AES-a47618
    - CORR-20260803-4e91da
    - CORR-20260803-2cefa6

  what_this_decision_does_not_do:
    - >-
      It does not assert that the r <= 4 phenomenon is understood at r = 5, or
      that any distinguisher exists at any round count.
    - >-
      It does not promote anything to the knowledge corpus. See below.
    - >-
      It does not advance any closure criterion. No model independence exists
      under standing basis 0137a051eb5828789eb267fa83c8278086578d4c.

  review_coverage_shortfall:
    what: >-
      BATCH-007 CARRIED ONE REVIEWER, NOT TWO. Every other adopted batch in this
      campaign carried an independent validator AND an independent red team.
    why_it_matters_here_specifically: >-
      The findings the validator returned -- a false absence claim, a
      counterexample to the shipped predictions, and an arithmetically
      unreachable target that had been ranked as two draws away -- are exactly
      the class an adversarial reader is dispatched to find. That one reviewer
      found three of them is a reason to think a second would have found more,
      not a reason to think the batch is clean.
    disposition: >-
      Recorded as a limitation on EV-AES-a47618's strength (set to moderate, not
      strong) rather than repaired retroactively. A red team pass over
      Proposition 1 is available as a future action and is NOT ranked ahead of
      the live measurement questions, because the proposition's content has
      already been reworked from the specification by an independent party.

  the_absence_claim_pattern:
    what: >-
      THREE FALSE STATE-OF-THE-EVIDENCE CLAIMS IN TWO DAYS, ALL CAUGHT ONLY BY
      SOMEONE GOING TO LOOK. CORR-20260803-c92db5: the PRP null said never
      measured, refuted by arm_A3. CORR-20260803-7d41c8: RC-9 said never run,
      refuted by BATCH-006 A2-R4-K1 at the exact paired parameters.
      CORR-20260803-4e91da: a target said to be two draws away that no number of
      draws at that sample size could reach. A fourth, in the opposite direction,
      is recorded in this batch: the producer listed "any r=5 arm at an amask
      other than 1" as an open gap while seven such arms exist in directories it
      names itself.
    why_the_machinery_does_not_catch_these: >-
      Reproducing a measurement cannot test an assertion that a DIFFERENT
      measurement is missing, or that a target is near. Every one of these
      survived every reproduction check in the campaign, because none of them is
      a number that another run can disagree with.
    binding_rule_going_forward: >-
      An absence claim must cite the directories actually searched, and a
      distance-to-target claim must state the target's reachability at the sample
      size in hand. Both are now conditions on Coordinator batch objectives and
      on reviewer reports, and this decision is the record that they bind.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED, AND THE REASON IS NOT CAUTION. Proposition 1 is a genuine
      derived result that outlives its batch, and it is the strongest candidate
      this campaign has produced. It is held back for one specific reason: the
      predictions it shipped with are FALSE AS WRITTEN at smask = 15, and the
      correct scope statement -- r <= 4, smask in 1..14, with "contains no full
      column" as the stopping criterion rather than "meets all four columns" --
      has been on record for less than one batch and has been checked by exactly
      one independent party. A knowledge entry is the wrong place to first assert
      a scope that was wrong in its previous written form. Promote after either a
      red team pass over the proposition or one further independent rederivation
      of the corrected scope, and record what changed.

  next_actions:
    - >-
      SINGLE NEXT ACTION: GOAL-AES-003 BATCH-009, rank 1 = an inventor-protocol
      section 3 NULL OBJECT for the r = 5 statistic -- a random bijection in
      place of the reduced-round cipher, at amask = 1, matched trials. This is
      the one round count where the question is live: r <= 4 is a certainty by
      theorem and r >= 6 reads at the null, so every open interpretive question
      in this campaign now sits at r = 5. The campaign has never run a null
      object of the right SHAPE for it -- amask = 15 is another point of the same
      deterministic family, and a drawn-S-box arm is a POSITIVE control because
      H1 uses only bijectivity. Rank 2: a second r = 5 arm at amask = 1, dropped
      on budget by this batch's validator and named by it. Rank 3: a red team
      pass over the corrected Proposition 1 scope, which is also the gate on
      promoting it to the knowledge corpus.

  next_action_struck:
    what: >-
      The prior rank 3 -- "draw two further RC-8 instances; two ALIVE outcomes
      would carry the preserving-fraction bound to the 0.90 the criterion asks
      for" -- IS STRUCK AS ARITHMETICALLY INCAPABLE OF ITS STATED PURPOSE.
    why: >-
      Two further ALIVE draws give 27 of 29 and a bound of 0.798439, which is the
      pooled figure already on record. Reaching 0.90 while carrying the two
      observed failures requires n = 61, i.e. 34 further draws. Deleting it
      silently would have been the wrong disposal; it is struck on the record
      with the arithmetic that kills it, per CORR-20260803-4e91da.
    is_the_underlying_question_abandoned: >-
      NO, AND THIS IS RECORDED SO THAT STRIKING THE ACTION IS NOT READ AS
      DROPPING THE LEAD. The preserving-fraction question stays open with a
      stated revisit condition: it becomes worth 34 further draws only if the
      r = 5 null object returns a result that makes the preserving fraction
      decision-relevant. Until then the bound stands at 0.7847 with its sample
      size and its two Poisson-conjunct failures on the record, and no claim is
      made at 0.90 in either direction.

  budget_accounting:
    producers_declared_seconds: 10800
    snapshot_declared_seconds: 900
    validation_declared_seconds: 5400
    note: >-
      GOAL-AES-003's wall-clock ceilings are null by
      protocol-amendment-GOAL-AES-003-002, which was granted on user direction
      and whose own text states that the justification is the target and not the
      evidence. max_concurrent remained 3 and was not relaxed by that amendment.
      No producer in this batch was degraded by concurrent load.

  limitations:
    - Nothing here is a statement about full-round or deployed AES, and no comparison to published cryptanalysis is made in either direction.
    - Toy tier throughout; r in 1..8, one machine, 2^24 to 2^31 trials.
    - Session and implementation independence only; NO model independence under standing basis 0137a051eb5828789eb267fa83c8278086578d4c, so nothing in this batch counts toward a closure quorum.
    - One reviewer, not two.
    - The r = 5 break is measured, not derived.

  decided_by: coordinator
  decided_at: 2026-08-03

  inference:
    policy: coordinator-orchestration-code
    requested_policy: coordinator-orchestration-code
    resolved_model: claude-opus-5
    fallback_used: true
    model_verified: false
    standing_basis: 0137a051eb5828789eb267fa83c8278086578d4c
