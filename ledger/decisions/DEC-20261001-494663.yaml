  validity_check_before_interpreting:
    expected_run_count: >-
      Zero runs by design. The F1 bounded recomputation is 75 single-key jobs
      as declared and hashed before the first ran (VR resolve/commands.yaml,
      n_jobs 75, n_rs1_keys 73), i.e. one job per (panel, bits, curve, m) of
