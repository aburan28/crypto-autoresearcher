      VALID. The round's artifacts are admissible and are interpreted below.
      Nothing goes back to the executor (RD-5 and RD-6 do not apply).

  composition:
    method: >-
      Joint by joint, as the plan prescribes. Each reviewer's verdict is read on
      the joints it owns. Neither offered a whole-claim verdict, and none is
      imputed. The load-bearing claims were checked against archived output
      files (EV-PFDR-d90ccd composition_by_joint verified_against): solve
      reality, reproduction, the A7 comparison, the firing and alternative
      counts, the F5 recount, the F7 slopes and kappas, the nulls, the
      aggregate cells, the proves-too-much counts and the checker line. Some
      statements are taken from a report without an output-file check: the
      F4 and F5 code traces, X_cmp <= 2*S_3, and the dispersion indices of
      HC-1. Each is identified as such there, and where possible it is
      corroborated across the two independent reports.
    joints:
      F1: HOLDS (validator). 73 of 73 firing instances are real solves; none capped; every row reproduces; the producer's A7 counted no capped instance.
      F2: HOLDS (validator). Blind sealed A7 bit-identical on all 136 listed ratios; firing set order-invariant; r_rank, r_rank1, r_rel and formal r_distinct each give 0 firings; c = 1 and S_search fire on plain-engine census rows.
      F3: >-
        BREAKS (red team), where the plan predicted. S_3, N, c = 2 and 1/2 are
        engine-faithful; r_frozen is the lemma's step-(ii) pair count, not its
        step-(iii) relation count; step (v) is read per row; A7 is applied on
        two premise-violating arms. c = 1 proves too much.
      F4: >-
        HOLDS (red team). No uncharged key enters a harvested group or match;
        X_cmp <= 2*S_3 on every row. The plan's X_total over-count drops 3 of
        73 firings. This composition does not read that as the plan's second F4
        breaking artifact, because X_total charges never-compared inputs and
        the exact count changes no firing (PD-4 below).
      F5: HOLDS (validator). The SS pair-counter defect touches pair counts only; star rows complete, single-centred on the oldest member; nothing A7 or any F2 alternative uses is affected.
      F6: >-
        BREAKS (red team). The per-instance predicate is not calibrated to the
        floor: NULL-P expects 30.27 generic on-mode firings (P(>= 21) = 0.971),
        and the exactly generic replica expects 14.995 against 17 observed at
        12..24 bits (P = 0.334). The aggregate the lemma bounds is >= 1 on
        every premise-holding cell (lowest calibrated 99% lower end 1.373).
      F7: >-
        BREAKS (validator), by the plan's own breaking artifact. m = 4 small_x
        on-mode ratio slope under r_rank -0.01491, calibrated [-0.0242,
        -0.0053]; level 2.10-3.63; same sign on both random m = 4 bases.
      proves_too_much: >-
        BREAKS (red team); the failure signature is met. Under A7's r the
        per-instance predicate fires on rho (38 of 145, the design-evaluated
        generic rate), on the exactly generic replica (2.0-2.3% at m = 4, 5)
        and on random arms (1.41%, equal to structured 1.42%). r_rank proves
        too little on known_log; c = 1 proves too much on the plain engine;
        X_total and aggregate T pass both sides.
    cross_joint_reading: >-
      F6 with F7 (this Coordinator's identity, EV-PFDR-d90ccd
      cross_joint_reading). ratio_rank^2 = ratio_frozen^2 * (r_frozen/r_rank)
      exactly, and the fitted slopes add: -0.033838 + 0.5*(0.040822 -
      0.002959) = -0.014907, F7's slope. So the r_rank decline is the harvested
      pair count approaching the X^2/N collision budget (per-rung aggregate T
      under r_frozen at m = 4 on mode 1.115 at 30 bits and 1.128 at 32 bits,
      99% lower ends 1.070 and 1.089) plus half the multiplicity growth. Under
      the lemma in aggregate this cannot continue as a power law. Whether the
      lemma holds for an adaptive, truncating engine (DN D3) is open.
    composite: >-
      The 73 firing rows are real, faithfully recorded and faithfully computed
      (F1, F2, F5). They do not constitute a contradiction of the generic
      floor: 52 are premise violations by construction (F3 premise audit,
      PTM-1), and 21 are the calibrated null rate of a per-row predicate
      applied to a compound pair count (F3, F6, proves_too_much). The engine's
      charging is faithful (F3, F4). The "accounting error" of the filing is
      in A7's conventions: the pair unit of r, the per-row reading, and the
      application on premise-violating arms. The aggregate the lemma bounds
      holds on every premise-holding cell. One joint, F7, turned up an
      unanticipated finite-range trend toward the floor at m = 4 harvest-on,
      which the cross-joint identity attributes to the harvest approaching
      the collision budget, but which 12..32-bit data cannot settle.
    pd2_checker_confirmation: >-
      CONFIRMED. The archived checker output
      (coordination/review/pfdr-twfloor-20261001/independence-check.txt, exit 1)
      reports exactly one problem: re-deriver TASK-20260929-fd1a9f read 5
      blind_from paths. Plan PD-2 anticipated exactly this line. From the
      validator's checks/read-log.txt, all five reads are POST-SEAL: the SEAL
      line (sha256 7e5adc578d2b...8326, 20:46:39Z) precedes entries 028
      (RUN-PFDR-1b78f7-analysis/analysis.json, 20:47:01Z), 029
      (stage-r/analysis.json, 20:47:27Z), 031 (__main__.py, 20:49:20Z), 032
      (solver.py) and 034 (harvest.py, 20:49:20Z); entries 001-027 open no
      blind_from path; the pre-seal scripts reference none of those paths, and
      only the post-seal compare_producer.py references analysis.json
      (checked by search). The attestation lists the same five paths after its
      SEAL marker. Seal custody passed (96d1e8 check e). The checker is
      order-blind (PRR-3), which is why the line appears; DEC-20260929-bbb3a9
      NA-13 (an order-aware checker) remains open and is held for the user.

  tripwire_routing_applied:
    TW-BREAK: >-
      NOT FIRED. Its conditions are conjunctive, and none of the decisive ones
      holds: under the independent-relation count r_rank no instance on any
      arm falls below 1.0 (minimum 1.112; on premise-holding generic arms 1.256
      on random, 1.242 on structured; 1.54 over m = 4 on mode), and no
      aggregate is violated beyond calibrated error (r_frozen pooled lower ends
      >= 1.373; m = 4 per-rung lower ends >= 1.070; r_rank pooled 2.43-9.20).
      Solves are verified (F1). There is therefore no input to record under
      TW-BREAK and no rule-12 sub-composition to open.
    TW-SCOPE: >-
      Applied to every statement here and in EV-PFDR-d90ccd. No deployed-curve
      implication, no universal impossibility, no exponent below rho's: the
      only exponent read is the m = 4 harvest-on S_3 exponent 0.6076, above
      1/2, and nothing is extrapolated beyond 32 bits.
    TW-FLOOR: resolved by this composition (no contradiction); the firing set stands as recorded and is not re-scored.

  hypothesis_readings_applied:
    RD-1: >-
      APPLIES. Its three conditions hold: the generic firings vanish under
      r_rank (21 -> 0), F6 shows the per-instance predicate miscalibrated, and
      the aggregate lemma statistic is not violated. Consequences as written:
      (a) H-PFDR-0cc7e8's prediction (i) and falsification condition 1 are
      restated as an aggregate, calibrated statement by a superseding
      hypothesis record (refine) at NA-10, decided in DEC-20261001-3fbaff;
      (b) EXP-PFDR-1b78f7 gets an additive protocol_amendment adding the
      corrected floor reading beside the frozen A7, labelled post hoc, never
      re-scoring it. Item (b) is NOT written by this act (PD-6; NA-2), so
      EV-PFDR-1faf10's withheld floor-relative readings stay withheld until it
      is archived.
    RD-2: >-
      APPLIES. The 35 known_log and 17 j0_coset firings are premise violations
      (formal rank B - 1 and 2B/3 on every instance) and are not evidence
      against H-PFDR-0cc7e8, whose assumption 2 excludes them. They are recorded
      as the floor screen's positive control, with the qualification
      (red team OBJ-5) that the screen sees them only through the premise audit
      or an r_frozen-based aggregate; r_rank alone loses them.
    RD-3: >-
      DOES NOT APPLY. F4 holds and F3 finds c = 2 engine-faithful; X_cmp <=
      2*S_3 exactly, so A7's charging convention needs no X_total or c
      correction.
    RD-4: does not apply (TW-BREAK not met).
    RD-5: does not apply (F1 holds on all 73).
    RD-6: does not apply (nothing blocked; the only retention limit, six census SS rows above 24 bits, enters no reading).
    RD-7: >-
      CONDITION NOT MET. F7 found the plan's operational "sub-floor trend"
      (negative beyond calibrated error under r_rank), not "no trend" or "cannot
      decide". The plan has no reading for "F7 breaks while TW-BREAK does not
      fire" (PD-5). Ruling: prediction (2)'s floor-attainability framing stays
      WITHHELD (not read as consistent with floor attainability, and never as
      an exponent below rho's); prediction (2) "met, not falsified" stands as
      its frozen, non-floor-relative criterion; F7 is recorded as an open
      observation with the follow-up of NA-3.

  prior_comparison: >-
    Recorded in full in EV-PFDR-d90ccd analysis CMP-1..CMP-3. In short,
    against the carried-over DEC-20260929-bbb3a9 NA-3 prior, items (a), (b)
    and (c) are CONFIRMED (premise violations; the r convention and the
    per-instance expectation-bound fluctuation, which turn out to be one
    mechanism). Item (d), the (2) exponent gap as lower-order terms plus r and
    |F| accounting (about 0.8), is NOT CONFIRMED: under r_rank the gap does not
    track r/|F| and the slope is negative beyond calibrated error. Against the
    refinement, (1) and (2) are CONFIRMED and sharpened by the derivation note
    (D4, D5, D6). E1 is the outcome. E2 is refuted and refined (no free-input
    term is needed). E3-E5 were not found. The overall about-0.85 "no
    contradiction" is CONFIRMED. OVERTURNED or unanticipated: F7 (the
    operational 0.05 branch occurred); the rho rate (0.26 against the prior's
    0.55, because rho.py keys on the full point); r_rank proving too little on
    known_log; and the m = 4 r_frozen aggregate narrowing to about 1.1 at
    30-32 bits. Concurrence is discounted per plan PD-1: the prior was written
    after reading the firing keys, the prior composition and two lines of the
    Stage 0 record. The F7 overturn and the r_rank/known_log result are the
    round's informative results.

  rationale:
    - >-
      Why revise. The decision-bearing content of the round is that A7's
      floor reading, as frozen, uses a per-row predicate on a pair count over
      all arms. That reading is not what the lemma licenses (derivation note
      DN-575e80-F6, archived before this act), and it proves too much on
      known-false objects. The engine, the solves and the arithmetic are sound.
      What changes is the convention through which the floor is read: an
      additive A7 amendment of EXP-PFDR-1b78f7 (NA-2) and the restated
      hypothesis clauses (DEC-20261001-3fbaff). Nothing frozen is re-scored.
    - >-
      Why not inconclusive. The evidence discriminates on the question the
      round was opened for. Contradiction against convention artifact is
      resolved by verified solves, a bit-identical blind recomputation, a
      premise audit, calibrated nulls and five proves-too-much objects. F7 is
      undecided, and it is recorded as an open observation; it does not make
      the filing's question undecided.
    - >-
      Why no status change here, and no weaken or reject_scoped. The plan
      fixed that this round changes no status ("In every case this round
      changes no status"), and the reassessment is NA-10, decided separately
      in DEC-20261001-3fbaff on the same archived evidence. Nothing here is an
      adverse reading of a mechanism. A single, empirical-only run set could
      not support reject_scoped anyway (plan ceiling).
    - >-
      Why F7 does not trigger TW-BREAK. TW-BREAK requires a sub-floor READING
      on premise-holding arms with an independent-relation r AND an aggregate
      violated beyond calibrated error. F7 is a declining ratio that stays at
      2.10-3.63, the aggregate is above 1, and the cross-joint identity locates
      the decline in the approach of the r_frozen aggregate toward 1. Routing
      F7 to TW-BREAK would read a trend as a violation.
    - >-
      Exponent bias (docs/target-result-profile.md). The floor is the
      admission gate every structured proposal of this line must beat by a
      non-generic step. This round makes that gate usable as a screen in its
      corrected form: aggregate, calibrated, premise-audited, r_rank beside
      r_frozen. The F7 question (whether an adaptive harvesting engine can
      beat the generic floor in aggregate at larger N) is a generic-engine
      question above rho, not an exponent lever. It is ranked below the
      exponent-targeting relation-level census (EXP-PFDR-011cd0), whose
      dispatch this round unblocks (DEC-20261001-e9e7e6).

  scoped_claim: >-
    On EXP-PFDR-1b78f7's R10-R14 and R16 rows (generated prime-order curves at
    12..32 bits; known_log and j0 12..24; crypto_autoresearcher.index_calculus
    mitm at 66d6eab71, min_fill, default arity; m = 3, 4, 5; five curves per
    rung), the 73 sub-0.9 A7 instances are real solves, faithfully recorded and
    faithfully computed, and they do not constitute a contradiction of the
    generic collision floor S >= (1/2)*sqrt(r*N). 52 lie on arms whose floor
    premise is false by construction. 21 match the calibrated null rate of a
    per-row predicate applied to A7's compound pair count. The engine's S_3
    charging (table included, two encodings per unit) is faithful, and the
    aggregate the lemma bounds is >= 1 on every premise-holding cell. At m = 4
    harvest-on the ratio to the r_rank floor declines over 12..32 bits beyond
    calibrated error while staying >= 2.10 on small_x; its meaning beyond 32
    bits is undetermined. Evidence EV-PFDR-d90ccd (preliminary, toy); runs
    RUN-PFDR-1b78f7-census-m3/-m4/-m5, -j0, -rho, -analysis, -stage-r; reviews
    TASK-20260929-fd1a9f and TASK-20260929-575e80.

