  rationale:
    - The finite prediction is decidable by a complete scan with a count of zero as a concrete negative.
    - The checker independently re-enumerates the eligible integers and verifies factors, prefixes, cofactors, predicates, and controls.
    - The design consumes one of the two open approval slots for GOAL-SSIQ-001.
    - The executor handoff is written and undispatched; a later run requires the dispatcher and archival gates.
