  rationale:
    - >-
      R-1. THE INDEPENDENT VALIDATOR VERDICT IS ADMISSIBLE AND PASSES ON
      EVERY OWNED JOINT. review-report.yaml (VAL-20260828-001) records
      `verdict: passed`, a fresh independent session with no prior context
      on TASK-20260828-955d56, and did not read the producer's conclusion in
      advance (`read_sibling_reports: false`). All five owned joints
      (J1..J5) independently HOLD, with J1 backed by locating the measured
      RSS figures in three sources independent of the manifest's own prose
      (live process stdout, raw JSON side channel, and source-level
      confirmation of the measurement method), and J3 going beyond a
      field-level grep to read the executed source code and confirm neither
      attempted process (seed 2026, sem or null) ever calls the rank kernel.
    - >-
      R-2. THE VALIDATOR INDEPENDENTLY RECOMPUTED ALL SEVEN DECLARED
      DIGESTS AND ALL MATCHED. `archived_snapshot_verified.hash_recomputation`
      recomputes sha256 for execution-report.md and all 6 run_manifest.yaml
      files against the declared digests: all seven read `result: MATCH`.
      The snapshot commit b46cf30e3c020901447496f3d891ceec248abae4 is
      confirmed reachable from HEAD by direct `git merge-base --is-ancestor`
      check. The receipt is content-verified, not merely asserted.
    - >-
      R-3. THE COMPLETION-CRITERION DISPOSITION IS MECHANICALLY CORRECT, NOT
      A JUDGEMENT CALL. lane-contract.yaml `binding_predicate` clause (d)
      requires `validity=completed_valid ... for every one of the 6 required
      runs`; all 6 run_manifest.yaml files read `validity: failed_infrastructure`
      (independently grepped by the Validator, J4). The conjunctive
      predicate therefore fails regardless of clauses (a)/(b)/(c)/(e); each
      manifest's own `counts_toward_completion_criterion: value: false`
      cites exactly this clause.
    - >-
      R-4. NO RANK VALUE APPEARS ANYWHERE, AND NO d_reg CONCLUSION IS
      SMUGGLED IN EITHER DIRECTION. The Validator confirmed (J3, going
      beyond field-level absence to source-level and process-log-level
      evidence for the two attempted processes) that neither script that
      actually ran ever invoked the rank kernel, and (J5) that every place
      a d_reg-adjacent statement could appear in the report is explicitly
      hedged as an infrastructure stop, "not a negative result about d_reg
      (AGENTS.md rule 5)." This decision inherits that same discipline: it
      asserts nothing about d_reg, H-DREG-001, or the sub-rho scenario.
    - >-
      R-5. THE INFRASTRUCTURE FINDING (MEMORY FLOOR TOO LOW FOR THIS CELL)
      IS ITSELF A MEASURED, RECOMPUTED FIGURE, NOT AN ESTIMATE. The
      Validator's `metric_recomputations` independently recomputed the
      monomial-space counts (sum_{d=0}^{6} C(30,d) = 768,212, matching the
      report's cited figure exactly and matching `null_ncols=768212` in the
      raw result), the scale ratio (4.041x, matching "~4.04x"), and the
      over-budget percentages (46.6% sem, 52.75% null, matching the report's
      "~47%"/"~53%"). This decision's recommendation to revise the memory
      floor upward for a future attempt rests on these independently
      recomputed figures, not on the executor's unverified prose.

