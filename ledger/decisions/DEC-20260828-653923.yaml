  authority: >-
    ledger/decisions/DEC-20260827-b588e7.yaml `execution_authorization`
    authorized item C1's dispatch as the next wave of the BATCH-006 repair
    track. That dispatch ran as TASK-20260828-955d56 (Executor), and its
    execution-report.md is the report this decision closes out, on the
    independent Validator verdict at TASK-20260828-c7c3a9 (report
    VAL-20260828-001, terminal `verdict: passed`, all five owned joints
    J1..J5 HOLD).

  context: >-
    Item C1 (n=15 completion-criterion ladder rung: 3 seeds x {sem,
    semi-regular-null-matched control}, D=6, chunked_block_m4ri instrument)
    was dispatched under
    coordination/goals/GOAL-DREG-001/batches/BATCH-006/tasks/TASK-20260827-765027/lane-contract.yaml
    as TASK-20260828-955d56. Its execution-report.md
    (coordination/goals/GOAL-DREG-001/batches/BATCH-006/tasks/TASK-20260828-955d56/execution-report.md)
    reports that NONE of the 6 required (seed, arm) runs reached
    `validity=completed_valid`: all 6 are `failed_infrastructure` /
    `resource_exhaustion`. The measured root cause is a prepare-phase peak
    RSS of 11.73 GiB (sem arm) and 12.22 GiB (null arm), both at seed 2026,
    against the lane-contract's `memory_gb: 8` budget floor -- 46.6% and
    52.75% over budget respectively -- reached before the rank-loop kernel
    (`chunked_block_m4ri` / `process_subchunk`) was ever invoked. No rank was
    computed for any (seed, arm) pair. Seeds 2027/2028 are disclosed as
    structural inference (identical seed-independent `nb`/`eq_degs_hist`
    across all 3 seeds), not independent measurement, in each affected run
    manifest.
    The independent Validator review
    (coordination/goals/GOAL-DREG-001/batches/BATCH-006/reviews/TASK-20260828-c7c3a9/review-report.yaml,
    report VAL-20260828-001) returned terminal verdict `passed`, with all
    five owned joints (J1: the measured RSS figures are real, not fabricated
    or extrapolated; J2: seeds 2027/2028 are honestly disclosed as
    structural inference, not silently upgraded to measurement; J3: no rank
    value appears anywhere as a claimed result; J4: the completion-criterion
    disposition is mechanically correct under lane-contract.yaml's
    binding_predicate; J5: the report does not smuggle in a d_reg conclusion
    in either direction) independently HOLDING. Hash recomputation on all 7
    declared digests (execution-report.md + 6 run_manifest.yaml files)
    MATCHED. Snapshot commit b46cf30e3c020901447496f3d891ceec248abae4
    confirmed reachable from HEAD.

  decision: pause

  decision_scope: >-
    THIS RECORD CLOSES OUT ONE EXECUTOR DISPATCH (TASK-20260828-955d56) AS A
    CLEAN INFRASTRUCTURE STOP ON ITEM C1, AND ITSELF DECIDES NOTHING ABOUT
    d_reg. It (1) accepts the Validator's PASS verdict on the execution
    report as admissible confirmation that the report is honest and
    accurate; (2) records, as a mechanical readout of lane-contract.yaml's
    own `binding_predicate` clause (d) ("validity=completed_valid for every
    one of the 6 required runs"), that the n=15 D=6 rung does NOT count
    toward GOAL-DREG-001's completion criterion, because 0 of 6 required
    runs reached `completed_valid`; (3) is a PAUSE-FLAVORED / INFRASTRUCTURE
    disposition on THIS SPECIFIC DISPATCH ATTEMPT, not a scientific
    `reject_scoped` or `weaken` on H-DREG-001 or on d_reg -- no rank was
    measured, so AGENTS.md rule 5 (a timeout, crash, or implementation
    failure is infrastructure signal, never a negative mathematical result)
    applies directly and no mathematical conclusion is drawn in either
    direction; and (4) does NOT file `ledger/evidence/EV-DREG-e278ab.yaml`
    (see `evidence_disposition` below). This decision changes no hypothesis
    status, closes no batch, closes no goal, and promotes no knowledge
    entry.

  evidence_disposition: >-
    `EV-DREG-e278ab` STAYS RESERVED AND UNSPENT. Per this task's own
    committed handoff constraint, an `EV-*` record requires an evidence
    basis -- a measurement, however partial, that supports, weakens, or is
    neutral toward a hypothesis. A wholly `failed_infrastructure` outcome
    with zero admissible ranks supplies none: `evidence.observations` would
    have nothing to hold, `evidence.direction` has no computed quantity to
    be `supports | weakens | contradicts | neutral` ABOUT (the underlying
    rank was never computed for any of the 6 required runs), and filing an
    `EV-*` record here would assert a measurement that does not exist. This
    mirrors the EV-DREG-ea5086 precedent recorded under DEC-20260812-f56a44,
    where a reserved evidence id was likewise left unspent rather than filed
    against a non-measurement. `certificate.kind: none` is set in every one
    of the 6 run manifests, consistent with this disposition. No `EV-*`
    record is created, moved, or cited as new scientific evidence by this
    act; `scientific_effect: none`.

  infrastructure_finding_and_retry_condition: >-
    THE LOAD-BEARING FINDING OF THIS DECISION IS AN INFRASTRUCTURE ONE, NOT
    A SCIENTIFIC ONE: n=15 at D=6 needs materially more memory for adjacency
    (Macaulay row/column) construction alone than the `memory_gb: 8` floor
    the BATCH-006 lane contract inherited from the much smaller n=12 cell,
    whose own `memory_gb: 8` floor was itself sized from n=12's COMBINED
    prepare+rank peak of 6.67 GiB (coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-016/run_manifest.yaml),
    not from any n=15 prepare-phase measurement. TASK-20260828-955d56's
    measured figures -- 11.73 GiB (sem) / 12.22 GiB (null) for PREPARE ALONE
    at seed 2026, before the rank-loop kernel's own additional footprint is
    ever added -- are the executor's own real, measured numbers, independently
    located by the Validator in three places (live stdout, raw JSON side
    channel, and source-level confirmation of the measurement method) and
    order-of-magnitude sanity-checked against the n=12 reference (J1 of
    VAL-20260828-001).
    RECOMMENDATION, NOT A NEW BUDGET SET BY THIS ACT: these measured figures
    support raising a future lane contract's `memory_gb` floor for this cell
    to something materially higher than 8 -- the executor's own analysis
    (execution-report.md "Anomalies and deviations" item 2) suggests the
    rank-computation phase, never reached and not itself measured here,
    would likely need substantially more still, "likely tens of GiB," so a
    modest raise to 16-20 GiB is offered here as the recommendation the
    PREPARE-PHASE measurement alone supports, explicitly NOT as a
    pre-registered budget for a specific future dispatch and explicitly NOT
    covering the unmeasured rank-phase requirement. Setting a new lane
    contract's exact budget is a future Coordinator ranking act (a fresh
    lane-contract.yaml under a newly minted task), not performed by this
    decision. An algorithmic alternative -- a streaming/sparse-adjacency
    construction avoiding the full in-memory Python row/colidx
    representation -- is named by the executor's own assessment as a second
    possible route and is likewise not decided here.

