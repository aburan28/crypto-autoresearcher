  id_provenance: >-
    DEC-20260828-653923 was pre-allocated and verified free by the driving
    session before this task (TASK-20260828-9e7481) was dispatched. THIS
    SUBAGENT HAS NO SHELL and minted nothing; the id is used exactly as
