coordinator_decision:
  id: DEC-20260802-011
  closes: [DEC-20260802-001, DEC-20260802-008, DEC-20260802-009, DEC-20260802-010]
  context: >-
    Closing record for the PR-87 ledger repair track. It transcribes the measured
    outcome at 7c7872e4 so the re-anchored baseline header is checkable against a
    committed record rather than a commit message, states what the green result
    does and does not certify, and carries forward the residual obligations. It
    reviews no run set and creates no evidence.
  decision: synthesize
  target_ids:
    - VALIDATOR-BASELINE-PR87
    - LEDGER-ROOT-RELOCATION-PR87
    - CLAIM-TIER-VOCABULARY-GAP
    - CORR-20260802-014
    - CORR-20260802-015
    - CORR-20260802-016
  measured_outcome:
    commit: 7c7872e4
    validator: >-
      Exits 0. "OK: validated 2452 records, no new violations".
      test_repository_validator_indexes_legacy_and_knowledge_records passes.
    baseline:
      total_entries_N: 2246
      added_M: 1108
      removed: 0
      pre_image_entries: 1138
      arithmetic_check: 1138 + 1108 = 2246, consistent
      reported_error_lines: 1110
      set_collapse: >-
        2 lines. EV-SIG-008 cites RUN-EXP-SIG-008-q and -r twice each, so two
        identical error strings collapse in a set. M was computed as a set
        difference against the pre-image, not as a subtraction from 1138. The
        duplicate citations were preserved verbatim through the relocation rather
        than de-duplicated, which is why they surface here; recorded so a later
        reader comparing reported lines to baseline entries finds the two-line gap
        already explained.
      no_baseline_total: 2248
      no_baseline_check: 2248 lines with the same 2 collapsing to 2246, all suppressed
    category_table:
      C1_pre_current_schema_run_manifests: 680
      C2_colliding_run_ids: 235
      C3_citations_of_nonregistering_runs_or_experiments: 70
      C4_evidence_missing_direction_strength: 35
      C5_knowledge_frontmatter_pending_curation: 82
      C6_id_area_tokens_containing_digits: 4
      C7_outside_current_schema_vocabulary: 2
      sum: 1108
    exclusion_3:
      snapshot: tools/prerelocation_error_snapshot.txt
      taken_at: 2225c24d (parent of the relocation commit)
      snapshot_lines: 2307
      relocated_record_lines_tested: 36
      admitted: 36
      blocked: 0
      basis: >-
        Set membership against the snapshot under each record's pre-relocation
        path. No line was admitted on an argument about intent. The line that
        halted the operation is admitted because its identical message appears
        under ledger/DEC-20260727-002.yaml.
    verification_conditions:
      validator_exit_zero: true
      second_update_baseline_byte_identical: true
      no_baseline_still_reports_full_debt: true
      pre_image_recoverable_from_parent: true
    sweeps:
      sweep_1_unrecognised_claim_tier: 29
      sweep_1_breakdown:
        theory: 17
        laboratory_implementation_conformance: 6
        toy_measurement: 5
        theoretical: 1
      sweep_1_with_run_ids: 7    # EV-MLKEM-005..010, EV-P13-001
      sweep_2_vacuous_ceiling_on_recognised_tier: 26
      evidence_records_with_ceiling_actually_evaluated: 8
      register: ledger/registers/unevidenced-records.yaml
      register_population: 55
    test_suite:
      failed: 1
      passed: 568
      skipped: 2
      subtests_passed: 1108
      failure: tests/test_runner.py::RunnerTests::test_detached_descendants_are_charged_for_wall_cpu_and_memory (resource='cpu')
      attribution: >-
        Reported to fail identically on clean origin/main and to have passed in
        the GitHub CI run that opened this work. Accepted as container CPU
        accounting, not a repository defect, and not attributable to this track.
  rationale:
    - >-
      THE ARITHMETIC RECONCILES AT EVERY JOINT AND THAT IS THE POINT. 1138 + 1108
      = 2246 entries; 2248 raw lines with two collapsing; the category table sums
      to 1108; 36 of 36 relocated-record lines admitted by set membership against
      a snapshot committed at the named parent commit. A re-baseline is a counting
      operation, and this one can be recounted by a stranger from committed
      artifacts. That property, not the green tick, is what makes the operation
      defensible.
    - >-
      ONE BOOKKEEPING DISCREPANCY, NOT AN INTEGRITY ONE. DEC-20260802-009 defined
      C6 as covering five records — RQ-PMA4-001, H-PMA4-001, EXP-PMA4-001,
      H-P13-001, EV-P13-001 — and the header text I authored names all five. The
      measured C6 count is 4. The cause is that check_experiment emits a different
      message for a malformed experiment id ("bad experiment id ...") and returns,
      rather than the "ID ... does not match ... format" string the other four
      produce. The total reconciles, so no line is lost or hidden; but a reader
      comparing the header's record list against its count will find a mismatch,
      and headers that do not survive that comparison are how documentation stops
      being trusted. Fix it: recount C6 as 5 by moving EXP-PMA4-001's line into it,
      decrement whichever category currently carries that line, keep the total at
      1108, and update the BASELINE_HEADER constant. The entries themselves do not
      change, so this is a header-only diff and a second --update-baseline must
      still be byte-identical.
    - >-
      SWEEP 2 IS THE MOST IMPORTANT NUMBER IN THIS ENTIRE TRACK AND IT IS BURIED.
      Eight. Eight evidence records in the whole ledger have their claim-tier
      ceiling actually evaluated. 26 declare a valid tier but cite only runs
      carrying neither field_bits nor field_bit_size, so every run is filtered and
      the check is skipped; 29 more declare a tier the vocabulary does not
      recognise, so it is skipped there too. EV-MLKEM-011 through -016 each declare
      `medium` — a tier above toy — on a single such run, entirely unchecked. The
      ceiling is the mechanical guard against AGENTS.md rule 7, the rule that
      toy-curve evidence is never presented as crypto-scale validation. For most of
      this ledger that guard has never run. It emits no error, so no baseline and
      no error list would ever have revealed it; it was found only because the
      sweep was ordered. This finding matters more than every line of the
      re-baseline that surrounds it.
    - >-
      THE FAIL-OPEN PATTERN IS THE GENERALIZABLE LESSON. Both sweeps are the same
      shape: a guard that resolves its input with a lookup that returns None on an
      unexpected value, and a conditional that treats None as "skip" rather than
      "object". TIER_ORDER.get(claim_tier) and tier_of_run() both fail open. A gate
      that fails open on unfamiliar input is indistinguishable from an absent gate
      except that it produces the reassuring appearance of coverage. Any future
      check in this repository should fail closed, or emit an explicit
      unrecognised-input error; that is now a standing design requirement, and the
      taxonomy decision must apply it rather than merely extending the enum.
    - >-
      THE TEST-FIXTURE REGRESSION IS A REAL FINDING AND WAS HANDLED CORRECTLY.
      tools/test_allocate_id.py pinned DEC-20260727-003 as a live root-level
      record, so an AUTHORIZED ledger relocation broke a test of an unrelated tool.
      Re-anchoring it to the frozen inventory, whose contents another test holds by
      hash, is the right fix: fixtures should pin immutable artifacts, not live
      ledger state. But this one was found by breakage rather than by search, which
      means others may exist. A sweep for tools and tests that pin live ledger
      record IDs is owed.
    - >-
      TWO REPORTED FAILURES WERE MEASUREMENT ERROR AND THE TESTS WERE RIGHT. The
      SGCP failures came from launching the suite against a dirty tree and
      committing mid-run; the assertions that fired were tree_clean_before_launch
      and implementation.git_commit == HEAD, which is precisely what they exist to
      catch. They pass on a clean tree. Recorded because a test that fails for the
      right reason is evidence the harness works, and because this is the second
      time in this track that an unverified observation was self-corrected on
      challenge — which is the process operating as intended, not a deficiency.
    - >-
      WHAT GREEN CI DOES NOT CERTIFY, STATED PLAINLY. It certifies that 2246
      declared error lines are declared and that no NEW violation is present. It
      does not certify that any run is reproducible: 680 entries record manifests
      with no commit, no command, or no artifacts. It does not certify that
      evidence citations resolve: 70 entries record references to runs and
      experiments that do not register. It does not certify that any claim tier is
      bounded: 55 records sit under a standing prohibition and only 8 ceilings are
      enforced. It does not certify that 35 evidence records say anything at all —
      they lack direction and strength. The repository is now honest about its
      debt. It is not out of debt, and no reader should take exit 0 as saying
      otherwise.
    - >-
      NOTHING IN THIS TRACK IS A RESEARCH RESULT. No hypothesis status changed. No
      evidence strength, direction, confidence, or proof_status was assigned by any
      agent. No ID pattern was widened, no immutability gate was relaxed, no run
      artifact was modified, and no knowledge entry was promoted. The PMA4 and P13
      series, EV-P13-001's proof_status and EXP-MLKEM-004's approver were left
      untouched by decision, not by omission. Nothing here asserts anything about
      ECDLP, about any hypothesis in this ledger, or at cryptographic scale.
  evidence_refs:
    - tools/validate_ledger.py
    - tools/validate_ledger_baseline.txt
    - tools/prerelocation_error_snapshot.txt
    - tools/duplicate_run_ids.yaml
    - tools/test_duplicate_run_ids.py
    - ledger/registers/unevidenced-records.yaml
    - ledger/corrections/CORR-20260802-014.yaml
    - ledger/corrections/CORR-20260802-015.yaml
    - ledger/corrections/CORR-20260802-016.yaml
    - ledger/decisions/DEC-20260802-001.yaml
    - ledger/decisions/DEC-20260802-008.yaml
    - ledger/decisions/DEC-20260802-009.yaml
    - ledger/decisions/DEC-20260802-010.yaml
  limitations:
    - >-
      This Coordinator executed no command in this track. Every figure above is
      transcribed from the executing session's reports. Those reports reconciled on
      every challenge, and one earlier report was false and was corrected; the
      figures are recorded as reported, not as independently verified by me.
    - >-
      The suite result is from one container. The single failure is accepted as
      environmental on the reported basis that it reproduces on clean origin/main
      and passed in CI, but that attribution rests on the report. CI on the PR is
      the authority, not a local run.
    - >-
      Baselining removes lines from the default output. It repairs nothing. Every
      one of the 1108 added entries corresponds to a live defect that is still
      present in the tree.
    - >-
      The 55-record register discloses two gaps; it closes neither. Until the
      taxonomy decision lands, those records have no enforced ceiling.
    - >-
      A derived figure worth confirming rather than assuming: the reported tier
      census (toy 72, medium 6, crypto 2 = 80 recognised) minus sweep 2's 26 minus
      the 8 evaluated leaves roughly 46 recognised-tier evidence records citing no
      runs at all. Whether an evidence record with an empty run_ids list is
      legitimate for its type, or is a further silent gap, is unanswered. It is
      arithmetic on reported numbers, not a measurement.
  next_actions:
    - >-
      1. Header-only amendment: recount C6 as 5 by moving EXP-PMA4-001's "bad
      experiment id" line into it, decrement the category currently carrying it,
      keep the total at 1108, update the BASELINE_HEADER constant, and confirm a
      second --update-baseline is still byte-identical.
    - >-
      2. Confirm the suite on CI for the PR, not locally. If
      test_detached_descendants_are_charged_for_wall_cpu_and_memory fails there
      too, it is not environmental and returns as a defect.
    - >-
      3. Open the claim-tier taxonomy decision with the scope set in
      DEC-20260802-010 next_action 6, plus this requirement added by sweep 2: the
      resolution must make the ceiling FAIL CLOSED. Extending the enum without
      changing the None-means-skip behaviour would leave the next unfamiliar value
      silently unchecked, which is the defect, not the vocabulary.
    - >-
      4. Answer the open question in limitations: count evidence records with a
      recognised claim_tier and an empty or absent run_ids list, and decide whether
      that is legitimate per record type or a third silent gap. Report the count
      even if zero.
    - >-
      5. Sweep tools/ and tests/ for other fixtures pinning live ledger record IDs,
      following the tools/test_allocate_id.py precedent. Re-anchor any found to
      immutable artifacts. Report the count even if zero.
    - >-
      6. Carry forward, unchanged and still open: the four repair paths in
      CORR-20260802-014 (EXP-GPS-001 contract and manifests, a schema-conformant
      superseding EV-SIG-007, EV-DREG-004's explicit CONT enumeration, and locating
      or declaring-missing EV-GPS-002/EXP-GPS-002); the C5 curation task; the
      proof_status vocabulary decision for conditional_on_heuristic; the
      experiment-qualification of colliding run-ID citations; and the Coordinator
      evidence review of EV-XEDN-002..006.
    - >-
      7. Do not treat this track as licence for a second re-anchoring. The
      only-ever-removed invariant is live again from 7c7872e4. A later addition is a
      contract violation, and the next person who finds 1000 red lines should
      repair or disclose them, not repeat this.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Not an evidence-review decision. It reviews no run set, changes no hypothesis
      status, and produces no durable research claim about ECDLP or any hypothesis
      in this ledger. The one genuinely reusable finding — that a guard resolving
      its input with a lookup that returns None, under a conditional treating None
      as "skip", fails open and produces the appearance of coverage without the
      substance — is methodological rather than mathematical. Whether the knowledge
      corpus should carry instrument-design findings of that kind is a scope
      question for the curator, and is referred to the taxonomy decision rather
      than settled here by asserting a promotion.
  decided_by: coordinator
  decided_at: "2026-08-02"
