  - The successful fixed-prompt probe verified a fresh independent Validator
    session at review-adversarial, gpt-6-sol, xhigh, provider openai, without
    fallback, degradation or effort cap. Its exact thread differs from the
    Coordinator and Red Team threads.
  - The first probe used the wrong backend key and failed with
    model_policy_mismatch before launch; it grants no reviewer admission.
  - A detached checkout at Red Team release commit 05bbf1d20b excludes the
    uncommitted Red Team report and attestation. That observation supports
    peer blindness but does not attest the Validator's later reading behavior.
  - The Red Team's completed release at 05bbf1d20b binds both of its output
    hashes. Its substantive report remains unread pending the blind review.
  - The successful receipt verifies only its exact session. Copying it
    preserves bytes and the hash of its original private path; it is neither
    a new probe nor global backend verification.
