coordinator_decision:
  id: DEC-20260918-7e0865
  recorded_at: '2026-09-18'
  goal_id: GOAL-ECDLP2M-001
  question_id: RQ-QSP-f9bbdb
  batch_id: BATCH-93320c
  kind: goal_activation_and_batch_opening

  context: >-
    AN ORPHANED CAMPAIGN AND AN UNOPENED GOAL, ESTABLISHED BY AUDIT IN THIS
    SESSION AND FIXED HERE. The whole of RQ-QSP-f9bbdb -- the hypotheses
    H-QSP-411d8f, H-QSP-5540d7 and H-QSP-645a07; the experiments EXP-QSP-33b442
    (7 runs) and EXP-QSP-82a906 (5 runs); the evidence record EV-QSP-a6aa4b; and
    five DEC-20260917-* decisions including the evidence-review transition
    DEC-20260917-793ae2 -- ran under NO goal and NO batch. The question record
    itself anticipated this archive: its `related.goal_note` states that
    GOAL-ECDLP2M-001 "is still a draft with no dispatch queue" and that the
    question "will be attached to that goal's question_ids by the Coordinator
    ledger archive that activates it. It is not attached here because a goal head
    is edited only through a Coordinator ledger archive."
    Meanwhile GOAL-ECDLP2M-001 had sat `status: draft` since 2026-09-07 with
    `question_ids: []`, no batch and no dispatch queue, while its own objective
    names in terms "summation-polynomial point decomposition and index calculus",
    "Frobenius-orbit and subfield-orbit relation generation" and "normal-basis
    versus polynomial-basis representation effects" -- the exact scope of the
    orphaned campaign.
    RQ-QSP-f9bbdb and RQ-FROB-7d8dd4 are both declared ECC areas in
    orchestration/research-priority.yaml (read via tools/ecc_priority.py), so
    both carry unlimited campaign budget and are selected before all others at
    every selection point -- and both were attached to no goal.
    THIS SESSION HAD NO SHELL. No command was run, no identifier was minted by
    this agent, and every identifier used below was verified free with
    `tools/allocate_id.py --check` by the dispatching session before this record
    was authored.

  decision: approve

  decision_scope: >-
    THIS DECISION IS CUSTODIAL AND ORGANISATIONAL. IT ASSERTS NO SCIENTIFIC
    CLAIM, AND THAT IS THE WHOLE OF ITS SCOPE. It activates a goal, opens a
    batch, adopts an in-flight campaign into that goal's custody, files two
    unverified derivation proposals, and writes two handoff cards. It changes
    no hypothesis status, no experiment status and no evidence record; it
    re-approves nothing; it discharges no completion criterion of
    GOAL-ECDLP2M-001, all of which require measurements this goal has not taken.
    `approve` is the transition because what is being approved is the opening of
    a batch and the filing of two proposals and two zero-run task cards -- not a
    protocol, not a claim, and not a promotion. No other value on the AGENTS.md
    decision line fits an organisational act, and stretching `support` or
    `expand` to cover it would misreport it as scientific.

  target_ids:
    - GOAL-ECDLP2M-001
    - BATCH-93320c
    - RQ-QSP-f9bbdb
    - IDEA-20260918-6c07e1
    - IDEA-20260918-9abf42
    - TASK-20260918-190055
    - TASK-20260918-53664e

  authorization: >-
    The standing user authorization of 2026-09-06 recorded in AGENTS.md
    ("Standing user authorization for ideas and experiments": "all is approved.
    ideas/experiments should be always approved"), which directs the Coordinator
    to select ranked work and record approval as soon as a contract is complete,
    without asking the user to select or confirm each item. The user additionally
    approved this batch explicitly in session on 2026-09-18. Neither
    authorization asserts that any hypothesis here is true or that any result is
    validated, and neither substitutes for a frozen contract: TASK-20260918-53664e
    DESIGNS a contract and does not approve one.

  actions_taken:
    - id: AC-1
      what: >-
        GOAL-ECDLP2M-001 activated: status draft -> active, question_ids
        [] -> [RQ-QSP-f9bbdb], current_batch_id and dispatch_queue_path set to
        BATCH-93320c and its queue path.
      why: >-
        A campaign with no goal has no ranked queue, no checkpoint and no place
        to carry its next action except inside a decision's next_actions list,
        where the harness does not look when selecting work. Activation is what
        makes RQ-QSP-f9bbdb visible at a goal head.
    - id: AC-2
      what: >-
        BATCH-93320c opened with two cards, both at maximum_runs 0:
        TASK-20260918-190055 (adversarial review of the two proposals below) and
        TASK-20260918-53664e (design of IDEA-20260916-3f7a1c into a frozen
        independent-replication contract).
      why: >-
        Both are ranked ahead of doing nothing and neither spends the machine.
        Unlimited ECC budget removes the batch ceiling, not the duty to rank
        (AGENTS.md "ECC comes first"); the ranking is recorded in the goal's
        amended next_action.
    - id: AC-3
      what: >-
        Custodial adoption of the in-flight QSP campaign, recorded in the goal's
        `adoption_note`.
      why: >-
        The work exists, is committed, and had no owner. Adoption gives it one.
      what_it_does_not_do: >-
        Changes no status, claim or evidence of any adopted record. In
        particular it does not re-open, ratify, extend or narrow
        DEC-20260917-793ae2's scoped negative, which stands exactly as written:
        RQ-QSP-f9bbdb decision target (a) is answered negatively "ON THE 732
        ENUMERATED CANDIDATES AND ON NOTHING ELSE". Every adopted record is
        immutable and was not edited.
    - id: AC-4
      what: >-
        RQ-FROB-7d8dd4 recorded on the goal head as a CANDIDATE adoption with a
        concrete recheck, and NOT adopted.
      why: >-
        It is a declared ECC area, it is inside this goal's scope, and it is
        attached to no goal -- so it is real ranked work. But other sessions hold
        active FROB experiments, and putting a second owner on a line another
        lane is running risks a collision in shared state
        (docs/concurrent-goal-lanes.md). The recheck names exactly what to run
        before this goal's second batch.
    - id: AC-5
      what: >-
        Two derivation proposals filed: IDEA-20260918-6c07e1 (under
        RQ-QSP-f9bbdb) and IDEA-20260918-9abf42 (under RQ-FROB-7d8dd4). Both
        `status: proposed`, `novelty_status: unverified`, `proposed_by:
        coordinator`.
      why: >-
        Both are one-line arguments that are either right or clearly wrong, both
        carry explicit baseline-reproduction checks against published
        classifications, and both cost nothing to state and little to attack.
      what_it_does_not_do: >-
        A proposal is not a result. Neither has been reviewed, neither may be
        cited as support for anything, and no record in this archive rests on
        either. IDEA-20260918-9abf42 being filed under RQ-FROB-7d8dd4 is a
        proposal on that question and is NOT an ownership claim over it (AC-4).
    - id: AC-6
      what: >-
        The GHS/Weil-descent scoping amendment prefixed additively to the goal's
        next_action, and one operative next action set.
      why: >-
        At n = 131 the extension degree is prime, so the GHS family -- which
        needs a proper subfield to descend to -- does not reach the target. The
        control therefore tests the instrument rather than a candidate attack,
        and saying so is a statement about the target, not a new result. The
        2026-09-07 text is preserved verbatim; a frozen wording is amended
        additively and never rewritten.

  rationale:
    - >-
      THE DEFECT IS ORGANISATIONAL AND IS FIXED ORGANISATIONALLY. Nothing about
      the QSP campaign's science is in question here and nothing about it is
      touched. What was wrong is that twelve runs, three hypotheses, one
      evidence record and five decisions had no owning goal, so no selection
      point could see them and no goal head carried their next action. That is
      repaired by attaching them to the goal whose objective already described
      them, and by nothing else.
    - >-
      ECC PRIORITY MAKES THIS THE FIRST THING TO FIX, NOT A TIDY-UP.
      RQ-QSP-f9bbdb and RQ-FROB-7d8dd4 are declared ECC areas with unlimited
      budget and are selected before all others at every selection point. Two
      ECC questions attached to no goal is not a bookkeeping blemish: it is two
      top-priority lines invisible to the ranking that is supposed to pick them
      first.
    - >-
      THE OPERATIVE ACTION IS RANKED ON THE CAMPAIGN'S OWN DISCLOSED WEAKNESS.
      EV-QSP-a6aa4b states that 720 of 732 census rows at n = 131 (98.4%) are
      single-instrument and that its re-verifier "cannot detect a missing one";
      DEC-20260917-793ae2 records that no independent replication invocation was
      ever spent (PD-6). A single-instrument census is precisely what
      replication from the producer's own artifacts cannot check, and the
      campaign's headline negative rests on it. IDEA-20260916-3f7a1c has sat at
      `status: proposed` since 2026-09-16 and was never designed -- its census
      content was absorbed into EXP-QSP-33b442 Stage 3 while the proposal itself
      was never converted -- so designing it is both the highest-value and the
      cheapest available move.
    - >-
      THE TWO PROPOSALS ARE FILED, NOT BELIEVED, AND THEY GO STRAIGHT TO AN
      ADVERSARY. Each claims to extend a recorded negative far beyond its stated
      scope at zero compute, which is exactly the shape of a claim that must be
      attacked before anything cites it. TASK-20260918-190055 exists so that no
      decision ever rests on an unreviewed one-line argument of the
      Coordinator's own authorship. The self-review hazard is named explicitly
      in that card: the proposer and the dispatcher are the same role.
    - >-
      WHY NOT ADOPT RQ-FROB-7d8dd4 TOO, WEIGHED HONESTLY. For adoption: it is a
      declared ECC area, squarely in scope, orphaned, and IDEA-20260918-9abf42
      argues that the FROB and QSP lines share one algebraic object. Against:
      other sessions hold active FROB experiments; adoption writes question_ids
      on a goal head while another lane may be doing the same for the same
      question, and an immutable record with two owners cannot be cleanly
      undone. The cost of waiting one batch is small and stated; the cost of
      colliding is not recoverable. Recorded as a candidate with a checkable
      recheck rather than dropped, so it cannot be lost.
    - >-
      NOTHING HERE IS A CLOSURE AND NOTHING IS ABANDONED. The 2026-09-07
      next_action (EXP-ECDLP2M-001) is retained verbatim and ranked second, with
      its evidence, boundary, remaining uncertainty and revisit condition
      recorded on the goal head (AGENTS.md "Research-direction integrity"). The
      GHS/Weil-descent control is retained as an instrument check and is not
      struck. The QSP line is not closed and, per DEC-20260917-793ae2's own
      revisit_conditions, must not be reported as closed.

  evidence_refs:
    - RQ-QSP-f9bbdb
    - RQ-FROB-7d8dd4
    - DEC-20260917-793ae2
    - EV-QSP-a6aa4b
    - H-QSP-645a07
    - H-QSP-5540d7
    - H-QSP-411d8f
    - EXP-QSP-33b442
    - EXP-QSP-82a906
    - IDEA-20260916-3f7a1c
    - ledger/goals/GOAL-ECDLP2M-001.yaml
    - orchestration/research-priority.yaml
  evidence_refs_note: >-
    THESE ARE THE RECORDS THIS DECISION READS, NOT EVIDENCE FOR A SCIENTIFIC
    CLAIM -- there is no scientific claim here to support. H-QSP-645a07 is cited
    because its injection/degree bound is what governs the "splits almost
    completely" regime that IDEA-20260918-6c07e1 explicitly does NOT reach, and a
    reader of that proposal must be able to find it. EV-QSP-a6aa4b and
    DEC-20260917-793ae2 are cited for the single-instrument disclosure and the
    scoped negative that rank the operative next action.

  scoped_claim_this_decision_authorizes: >-
    NONE. This decision authorizes no claim. It authorizes a goal to be active,
    a batch to be open, two proposals to exist at `status: proposed` with
    `novelty_status: unverified`, and two zero-run task cards to be written. The
    only assertions it makes about the world are bookkeeping ones: that the
    listed records existed under no goal, and that they now have one.

  limitations:
    - >-
      NO SCIENTIFIC CLAIM IS ASSERTED, SUPPORTED OR WITHDRAWN. No hypothesis
      status moves. No experiment status moves. No evidence record is created,
      amended or re-read.
    - >-
      NO COMPLETION CRITERION OF GOAL-ECDLP2M-001 IS MET, and none was met
      before this archive. All seven require measurements on multiple binary
      field sizes and independent curves; this goal has taken none. Activating a
      goal, opening a batch and adopting a campaign are not progress against any
      criterion, exactly as authoring and approving were not under
      GOAL-SEMBIN-fcb7a2 (CORR-20260916-402547).
    - >-
      THE TWO PROPOSALS ARE UNREVIEWED AND UNVERIFIED. Both carry
      `novelty_status: unverified`. Their arithmetic was checked by this
      Coordinator only, by hand, with no shell -- which is exactly the
      circumstance in which an arithmetic inference of a Coordinator's was
      overturned once already (DEC-20260917-793ae2 prior_calibration,
      "A COORDINATOR ARITHMETIC INFERENCE OVERTURNED"). Neither may be cited as
      support for anything until TASK-20260918-190055 returns.
    - >-
      A SELF-REVIEW HAZARD IS PRESENT AND DECLARED. Both proposals are
      `proposed_by: coordinator` and the review that will attack them is
      dispatched by the coordinator. The mitigation is that
      TASK-20260918-190055 goes to red-team in an independent session at
      review-adversarial, with the falsification routes and the mandatory
      non-exclusion check written into the card BEFORE any reviewer runs, and
      with the Coordinator's prior recorded in the card's review_plan. That is a
      mitigation, not a cure.
    - >-
      THE REVIEW ROUND HAS ONE REVIEWER, SO ITS JOINTS ARE NOT INDEPENDENTLY
      OWNED. AGENTS.md "Review architecture" buys coverage by giving each joint
      exactly one owner across several reviewers; here one reviewer owns all
      joints, so the round buys adversarial attention but not cross-joint
      independence. Stated rather than absorbed. The round is not
      claim-changing: no status can move on its verdict without a further
      Coordinator decision.
    - >-
      RQ-FROB-7d8dd4 REMAINS ORPHANED after this archive. That is a deliberate,
      recorded deferral with a recheck (AC-4), not a resolution.
    - >-
      THIS DECISION IS NOT OFFICIAL UNTIL ITS LEDGER ARCHIVE IS COMMITTED, THE
      BRANCH IS PUSHED, A PR NAMES THE NEW RECORDS, AND THE POST-COMMIT VERIFIER
      ACCEPTS THE COMMIT (AGENTS.md rule 7; CLAUDE.md "Every archive that adds
      new records ... must be pushed to a branch that has an open PR").
    - >-
      NO DISPATCH QUEUE FILE EXISTS YET at the path this archive writes into the
      goal head. `dispatch_plan.{json,md}` are gitignored and rebuilt on demand,
      but the QUEUE itself
      (coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-93320c/dispatch_queue.json)
      is a real file that the dispatching session must author from the two cards
      before either is launched. Until it exists, BATCH-93320c is open on the
      goal head and has nothing to render. This is named as NA-2 rather than
      implied.

  preliminary_non_evidential_indication: >-
    RECORDED UNDER AGENTS.md CORE RULE 9, WHICH FORBIDS PRESENTING ANYTHING
    UNRUN, UNFROZEN OR UNCERTIFIED AS A RESULT. In the course of the audit that
    produced this decision, this session computed an n = 131 census in a
    scratchpad OUTSIDE the experiment harness. It used no frozen contract, it
    produced no RUN record, it produced no certificates, and it was not
    independently reviewed. What it indicated: agreement with RUN-QSP-33b442-S3
    at n' = 33 (maximum |V| = 132, attained by the same four polynomials
    X^7+X^2, X^7+X^5+1, X^7+X^6+X^3+X^2 and X^7+X^6+X^5+X^4+X^3+X+1), plus
    coverage of n' = 3..14, where the maximum seen was 133 at n' = 8.
    THIS IS NOT EVIDENCE. It carries no run record and no certificate, it
    confers no claim, it is not entered as a measurement anywhere in this
    archive, no RUN record is created for it, and NO RECORD'S CLAIM RESTS ON IT.
    It is recorded for exactly one purpose: it is part of why
    TASK-20260918-53664e is the operative next action, since an
    outside-the-harness reproduction is not a replication and the only thing
    that can settle a single-instrument census is a second instrument under a
    frozen contract. Anyone tempted to cite the numbers above should cite
    RUN-QSP-33b442-S3 for n' = 33 and nothing at all for n' = 3..14, which no
    committed run has covered.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NONE, AND THE REASON IS EXPLICIT RATHER THAN BLANK. This decision is
      custodial and organisational: it is not an evidence-review decision, it is
      neither `support` nor `reject_scoped`, it rests on no evidence record of
      strength `replicated` or `strong`, and it produces no durable claim a
      corpus entry could carry. The two proposals filed with it are UNVERIFIED
      DERIVATIONS AWAITING REVIEW (TASK-20260918-190055); promoting either to
      knowledge/findings/ now would record as durable a one-line argument that
      no independent agent has yet attacked, which is the exact failure
      knowledge/README.md's scope rule exists to prevent.
      THE OWED FINDING OF THE ADOPTED CAMPAIGN IS NOT THIS DECISION'S TO WRITE
      AND IS NOT FORGOTTEN: DEC-20260917-793ae2's knowledge_promotion records a
      deliberate deferral of a KN-FIND for the twisted injection bound until
      NA-4 supersedes H-QSP-5540d7 into a narrowed record. That deferral stands,
      it belongs to the QSP lane, and adopting the campaign does not transfer it
      here or discharge it.
      IF TASK-20260918-190055 RETURNS `holds` ON EITHER PROPOSAL, the promotion
      question is reopened by the decision that composes that verdict -- not by
      this one.

