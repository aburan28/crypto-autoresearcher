  claim_boundary:
    ceiling: unverified ideation only
    allowed:
      - Read-only retrieval and direct current-tree screening for each producer.
      - Fifteen schema-complete proposal records and their required screening/report artifacts.
    prohibited:
      - Experiment, hypothesis, implementation, run, evidence, or claim production.
      - Hypothesis-status or research-direction promotion.
      - Novelty, prior-art, security-impact, or asymptotic-improvement claim absent separately supporting evidence.
      - Retrieval-index ingestion, mutation, or deletion.
  proposal_requirements:
    - Every proposal states a proof_search_map, target complexity, heuristic assumptions and validation plan, controls, falsification criteria, Pareto dominated_by, and quantitative sota_delta.
    - Primary literature must actually be checked before novelty is stated; an absent retrieval result is not novelty evidence.
    - An unchecked Pareto relation remains explicit uncertainty and is not represented as an unsupported null.
