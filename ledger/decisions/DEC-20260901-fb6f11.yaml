coordinator_decision:
  id: DEC-20260901-fb6f11

  context: >-
    GOAL-AES-003 batch-opening act by the dispatching Coordinator
    (session coordinator-aes003-1, 2026-09-01). DEC-20260901-c3d261
    closed BATCH-ace664 with RANK 1 = a shape-only reduced-Stage-1
    design proposal for the ramp-shape question (IDEA-20260901-363851
    C3): does the hit-count excess itself decay jointly with S-box
    dilution along the frozen nested family S_k? IDEA-20260901-582ea9
    was authored and filed on main (PR #687): a shape-only hit-count
    design at fixed r=5 over the minimal informative k-subset
    {0,1,2,8,16} (k=0/k=16 blocking anchors, k=1 primary joint, k=2
    step confirmation, k=8 midpoint sentinel), with an exhaustive
    ordered SH cascade repairing a verified overlap defect in the
    frozen 363851 wording, dead/ramp-zero anchors analyzed before any
    interior reading, and per-point Garwood sensitivity floors. The
    proposal surfaces one BLOCKING precondition: the certified build
    refuses interior S_k arms until the co-varied SubWord schedule
    convention is pinned (the Stage-1 question flagged as DEV-4 by the
    BATCH-2f12ac producer). The proposal names PIN-T0 (SubWord uses
    TPOS[0]: identity schedule at k=0, AES schedule at all k >= 1) as
    the unique pin keeping BOTH committed endpoints receipt-exact and
    proves interior readings identical under the two endpoint-preserving
    candidate pins.

  decision: open_batch

  decision_scope: >-
    THIS DECISION OPENS BATCH-7b798d, ADOPTS PIN-T0 AS THE BINDING
    SCHEDULE PIN, AND DISPATCHES ITS QUEUE. It does NOT move
    current_batch_id (that happens in the closing ledger archive), does
    NOT spend Stages 1a/1b of IDEA-20260901-363851 as written there
    (the carrier ramp stays gated), does NOT reopen the closed X lane,
    does NOT budget k=4/k=12 refinement points or any second seed, and
    does NOT assert any outcome. It authorizes execution of
    IDEA-20260901-582ea9 under its preregistered ordered SH cascade,
    with validator and red-team review before ledger recording.

  pin_adopted:
    id: PIN-T0
    statement: >-
      SubWord uses TPOS[0], the table at the FIRST position of the
      frozen order. Result: identity schedule at k=0 (both pins agree
      there only under the no-interior convention), AES schedule at
      every k >= 1. Rationale: the unique pin under which BOTH
      committed endpoints (k=0 identity seat, k=16 AES seat) remain
      receipt-exact; interior readings proven pin-invariant across the
      two endpoint-preserving candidate pins by the proposal. Adopted
      by the Coordinator per IDEA-20260901-582ea9 schedule_pin block;
      this discharges the DEV-4 Stage-1 question from BATCH-2f12ac for
      this batch only. Any other pin or schedule convention requires a
      new Coordinator decision.

  target_ids:
    - GOAL-AES-003
    - RQ-AES-003
    - BATCH-7b798d
    - IDEA-20260901-582ea9
    - TASK-20260901-706b1d
    - TASK-20260901-56ecb6
    - TASK-20260901-c2b265
    - TASK-20260901-da1368
    - TASK-20260901-87a39b
    - TASK-20260901-6b1a7f
    - TASK-20260901-1b8932
    - EV-AES-f2da41
    - DEC-20260901-6f9de3
    - DEC-20260901-c3d261
    - EV-AES-896ef2

  outcome: >-
    Batch opened. Producer TASK-20260901-706b1d executes S0 (KAT pins,
    table-freeze re-verification, Gate-0x rebuild, r=6 dead anchor,
    k=0 ramp-zero anchor) and halts the in-batch flow on
    SH-GATE-FAIL/SH-F6/SH-ANCHOR-FAIL; snapshot TASK-20260901-56ecb6
    binds the S0 package before S1 is admitted. Producer
    TASK-20260901-c2b265 reads the S0 outcome FIRST and refuses
    interior arms if a halt branch fired; otherwise executes S1
    (k=16 re-seat analyzed first, then k=1/k=2/k=8, determinism
    double, digest/source-diff audit) and composes the shape verdict
    under the ordered SH cascade; snapshot TASK-20260901-da1368 binds
    the S1 package. Validator TASK-20260901-87a39b and red-team
    TASK-20260901-6b1a7f run blind to each other after both
    snapshots; ledger TASK-20260901-1b8932 is the sole archiver of
    both review packages and records EV-AES-f2da41/DEC-20260901-6f9de3.

  rationale:
    - >-
      RANK 1 of DEC-20260901-c3d261 is exactly this design. It is
      shape-only by construction (hit-count excess, no X statistic, no
      rho-exclusion, no carrier observable), repairs the verified
      cascade-overlap defect in the frozen 363851 wording, and carries
      per-point power with an honest non-detection obstruction for
      within-residual-band trends.
    - >-
      PIN-T0 is adopted because the proposal proves it is the unique
      endpoint-preserving pin and that interior readings are
      pin-invariant across the two candidate pins; refusing it would
      strand RANK 1 with no executable interior surface. Adoption is
      scoped to this batch.
    - >-
      The batch is bounded by the proposal's binding baseline (~4 h
      across two producers; cap 16200 s total; max 8 runs per
      producer); every stage boundary is a stopping point with a
      committed reading (rule 5).
    - >-
      A claim-changing outcome (SH-GRADUAL survival-under-dilution,
      SH-STEP fragility, SH-DEAD extinction, or any F3/F5/F6
      indictment) gets both validator and red-team before ledger
      recording; the coordinator prior is recorded below before any
      reviewer runs.

  review_plan:
    prior: >-
      I expect gates/anchors/KATs to survive and the k=16 re-seat to
      land in band [6,30]. The uncertain joint is the k=1 primary
      reading: either SH-DEAD (h<=5 at all interior points: the count
      excess dies with dilution), SH-STEP/SHAPE-FLAT (h(1),h(2)<=40:
      excess persists nearly undiminished), or SH-GRADUAL/SHAPE-DECAY
      (h(1)>=100, band non-rising: excess decays gradually). Where I
      think it can break: the widened interior surface as hidden
      perturbation of the sealed verdict instruments, the pinned
      schedule change misattributed to dilution, finite-comparator
      excess at small hit counts, or cascade composition when readings
      land in the 41-99 ambiguity band (pre-declared SH-OTHER-RESIDUAL,
      never smoothed).
    joints:
      - joint: arithmetic/gates/instrument perturbation/pin adoption
        owner: validator
        attack_plan: >-
          Re-derive per-point hit counts, excess ratios, and Garwood
          CIs blind; verify Gate-0x rebuild identity under the
          extended allowed-diff list (PIN-T0 interior widening only),
          anchor-first ordering (dead anchor before any alive reading;
          k=0 before interior; k=16 first within S1), KAT/determinism/
          digest gates, hit_overflow=0, snapshot hashes for BOTH
          producer packages, and that the source diff consists only of
          the pinned interior-surface widening and pin-label fields.
      - joint: interpretation/scope/power/cascade language
        owner: red-team
        attack_plan: >-
          Attack whether the shape verdict is scoped to the tested
          k-subset {0,1,2,8,16} at cell (1,1) r=5; whether SH-DEAD
          extinction language stays inside the measured sensitivity
          floors (lambda_80~8.0, lambda_95~10.5 per point); whether
          any verdict leaks back into the closed X lane or carrier
          claims; whether the precedence cascade still overlaps after
          the repair; and whether PIN-T0 adoption itself perturbs any
          sealed-reading comparison.
    blindness:
      declared: true
      lifted_for: null
    proves_too_much: >-
      The r=6 dead anchor (F6 tripwire) and the k=0 ramp-zero anchor
      (F3) are the built-in proves-too-much controls; red team must
      also check the statistic against prior sealed dead arms where
      available.
    blind_rederivation:
      required: true
      blind_from: producer implementation and run report; validator derives from proposal, pin statement, and committed receipts only.

  next_action: >-
    Execute the queue. On SH-GRADUAL: excess decays jointly with
    dilution; claim-changing review, then design successor for the
    decay rate. On SH-STEP/SHAPE-FLAT: excess survives dilution nearly
    undiminished; fragility successor. On SH-DEAD: count excess dies
    with dilution within tested floors; scoped closure of the shape
    question with obstruction record. On SH-OTHER-*: named successor,
    no verdict. On SH-GATE-FAIL/SH-F6/SH-ANCHOR-FAIL/SH-RESEAT-FAIL:
    halt/indictment per cascade; invalid_measurement or boundary
    falsifier, never a shape reading.

  evidence_refs:
    - ledger/proposals/IDEA-20260901-582ea9.yaml
    - ledger/decisions/DEC-20260901-c3d261.yaml
    - ledger/evidence/EV-AES-896ef2.yaml

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Batch-opening, PIN-T0 adoption, and queue dispatch create no
      scientific result suitable for knowledge promotion.

