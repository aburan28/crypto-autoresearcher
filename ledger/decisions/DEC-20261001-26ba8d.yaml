coordinator_decision:
  id: DEC-20261001-26ba8d
  recorded_at: '2026-10-01'
  decided_at: '2026-10-01'
  decided_by: coordinator
  recorded_by: coordinator
  goal_ids: [GOAL-ICEX-001]
  archived_by: TASK-20261001-936bf2
  prior_decisions:
    - DEC-20261001-36e4fa (approves EXP-ICEX-153c34 / H-ICEX-6ca21f; NA-1, NA-2, R-2)
  inference:
    policy: coordinator-orchestration-code
    resolved_model_id: unknown (Cursor runtime; top-level session on its inherited model)
    fallback_used: true
    fallback_reason: Cursor runtime does not expose the resolved model identifier.

  decision: open_batch
  decision_label: >-
    CLOSE BATCH-454f85 (design + approval) as a checkpoint. OPEN BATCH-0318fb:
    one executor task implements the EXP-ICEX-153c34 backend and runs the S0
    gates G0-1..G0-6 only, then a snapshot archive. No protocol-labelled draw;
    execution stays unadmitted.

  target_ids:
    - GOAL-ICEX-001
    - BATCH-454f85
    - BATCH-0318fb
    - EXP-ICEX-153c34
    - H-ICEX-6ca21f
    - TASK-20261001-111ecc
    - TASK-20261001-936bf2
    - TASK-20261001-4862b6
    - TASK-20261001-212de0

  ranking:
    ecc_first: ICEX is a declared ECC area (tools/ecc_priority.py); budget unlimited.
    obstruction_registry_read: >-
      tools/obstruction_registry.py --unexamined lists one entry, EV-AES-abf3dc
      (non-ECC; not a candidate here). EV-ICEX-16e3ec carries an examined
      resource check naming this successor.
    rank_1:
      task: TASK-20261001-4862b6
      why: >-
        DEC-20261001-36e4fa NA-1 is the goal's committed next action. The
        approved measurement cannot be admitted without an implementation and
        passed S0 gates, and gate G0-4 is also the recheck for IMP-1
        (Buchberger feasibility at L >= 7), so this one task reduces both the
        implementation uncertainty and the main feasibility impediment.

  rulings:
    - id: R-1
      ruling: >-
        The executor card carries DEC-20261001-36e4fa R-2 in full: 8 GiB RSS
        watchdog, single worker, and fail-closed C-7 readings (15-min load <= 14,
        / >= 5 GiB free, repository volume >= 20 GiB free) at launch and between
        gates. Dispatch itself waits for C-7.
    - id: R-2
      ruling: >-
        S0 only. The driver must refuse charged or protocol-labelled runs unless
        given an admission decision whose execution_admission.currently_admitted
        is true and whose target_ids include EXP-ICEX-153c34. Admission is
        DEC-20261001-36e4fa NA-2: an implementation audit after this snapshot,
        then a separate decision.

  transitions_not_made:
    - record: EXP-ICEX-153c34
      note: Stays approved; execution_admission.currently_admitted stays false.
    - record: H-ICEX-6ca21f
      note: Stays approved.

  rationale: >-
    The approved contract is complete; the remaining gap before any measurement
    is code that passes the contract's own identity, oracle-agreement,
    reproduction and counter checks. Running those gates now, on non-frozen
    smoke curves, costs about two CPU-hours (advisory) and leaves the frozen
    streams untouched.

  knowledge_promotion:
    promoted: []
    not_warranted: Batch-opening decision; it records no result.
