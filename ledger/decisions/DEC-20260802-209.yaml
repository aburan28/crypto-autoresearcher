coordinator_decision:
  id: DEC-20260802-209
  batch_id: BATCH-034
  recorded_by_task: TASK-20260802-228
  archived_by: TASK-20260802-229
  context: >-
    Synthesis of the frozen BATCH-034 proof-only producer package and the
    independently archived RT-20260802-226 Red Team review. The batch tested
    the single B033-S1 repair authorized by DEC-20260802-208; it executed no
    experiment and produced no ordinary-input ECDLP algorithm.
  decision: revise
  disposition: REVISE
  target_ids:
    - BATCH-034
    - H-IT-001
    - GOAL-ECDLP-001

  rationale:
    - >-
      Adopt RT-20260802-226 on the merits. RT-226-F1 refutes the producer's
      Eq. (1) as written because P counts resident handle records while the
      model permits injection-dependent encoding recognizers or fingerprints
      outside P. A preprocessing table can recognize Q=cG and emit c^d G; a
      full table reaches success one with one online scalar multiplication.
      Merely charging C_pre does not repair the probability inequality.
    - >-
      Separate that theorem defect from the narrow statement that survives:
      in a random-encoding generic model where external advice is independent
      of the random injection and every retained encoding/equality-recognition
      record is counted and charged, the capped collision/root argument gives
      the producer's bound; only constant excess over d/N forces
      Omega(sqrt(N)) fully charged work. This is a conditional known-style
      generic lower bound, not an achieved ECDLP algorithm.
    - >-
      Preserve RT-215-C1 and the d=N/2 output-G obstruction. The producer may
      output the oracle-issued G, obtaining success 1/2 at constant producer
      cost without an informative producer collision, while a separate sound
      generic-DLP verifier can recover alpha and accept exactly when
      alpha^d=1. Thus constant correctness alone cannot yield a uniform rho
      lower bound.
    - >-
      Preserve the independent cost and Pareto corrections: rebuild retries
      cost (C_pre+online)/s, one-instance reuse costs C_pre+online/s, and B
      instances have the separately charged reuse exponent stated by RT-226-R1.
      Fresh challenges are not retries for one fixed ECDLP instance; verifier
      cost is separate; necessary lower-bound profiles are not achieved
      algorithms.
    - >-
      Cheon DLP with auxiliary input and generic nonlinear-target hardness are
      known prior art. The repaired standard-model statement has value as
      model hygiene, but another proof-only polishing batch has ordinary-ECDLP
      SOTA delta zero and is dominated in scientific value by a bounded attempt
      at the unresolved non-generic acquisition interface.
    - >-
      Select one exponent-first successor: a concrete certified algebraic
      correspondence lane that either constructs, with all costs charged, the
      auxiliary point needed for a sub-rho total algorithm, or returns a named
      affine-action/degree obstruction with forward guidance. This selection
      is a research priority, not evidence that such a construction exists.

  evidence_refs:
    - ledger/decisions/DEC-20260802-206.yaml
    - ledger/decisions/DEC-20260802-208.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-034/archives/TASK-20260802-225/snapshot_commit_receipt.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-034/archives/TASK-20260802-227/snapshot_commit_receipt.json
