  synthesis:
    independent_verdict_adopted: RT-20260802-226
    package_verdict: REVISE
    theorem_as_written: REVISE
    complete_cost_accounting: REVISE
    pareto_accounting: REVISE
    prior_art_and_scope: PASS
    as_written_defect:
      id: RT-226-F1
      statement: >-
        Eq. (1) omits injection-dependent preprocessing recognizers/advice from
        its root/collision mass. P cannot mean only objects named handles while
        other retained encoding or equality-recognition records remain usable.
      repair_boundary: >-
        Require all external advice to be independent of the random injection
        and count every retained encoding/equality-recognition record in P, or
        add explicit preprocessing-label/advice terms and redo the coupling.
        This repair is not performed by this decision.
    narrow_surviving_statement: >-
      For prime r, N=r-1, alpha uniform in F_r*, d dividing N, output restricted
      to an oracle-issued point, external advice independent of the random
      injection, and every retained recognition record counted and charged,
      the capped standard random-encoding argument can bound success by root
      mass plus transcript collisions. Constant excess above d/N then implies
      Omega(sqrt(N)) charged work. No unconditional or ordinary-input solver
      claim follows.
    preserved_obstructions:
      - id: RT-215-C1
        effect: >-
          Producer-certificate reasoning cannot infer an informative producer
          collision from successful verification; R=G is the direct witness.
      - id: output-G-d-half
        effect: >-
          At d=N/2, outputting G succeeds with probability 1/2 at constant
          producer cost, blocking a uniform constant-correctness lower bound.
    accounting_corrections:
      rebuild_each_attempt: (C_pre + online) / s
      reuse_once: C_pre + online / s
      across_B_instances_exponent: max(max(p - b, 0), beta + x)
      fixed_instance_rule: Fresh challenges are not retries for one fixed ECDLP instance.
      verifier_rule: Verifier work is separate and must be charged where used.
    pareto_interpretation:
      root_mass_output_G:
        ecdlp_solver: false
        ordinary_sota_comparison_admissible: false
        time_improvement: not_applicable
        memory_improvement: not_applicable
        data_query_improvement: not_applicable
      collision_boundary_profiles:
        classification: formal_necessary_lower_bound_profiles
        achieved_algorithms: false
        rule: >-
          Do not attach algorithmic time or dominance claims without an actual
          construction realizing the profile.
    prior_art:
      - Cheon auxiliary-input discrete logarithm
      - generic nonlinear-target hardness

  decision_integrity:
    comparison_scope: >-
      Compare immediate cost, expected information gain, dependency risk,
      scientific value, and Pareto effect against the target-result profile.
    responsible_provenance:
      record: DEC-20260802-209
      role: coordinator
      task_id: TASK-20260802-228
      resolved_model_id: gpt-5.6-sol
    candidates:
      - id: A
        candidate: One more proof-only advice-model repair.
        evidence:
          - RT-226-F1 gives the exact missing advice/recognition term.
          - RT-226-R1 through RT-226-R5 give the exact cost, retry, Pareto, and parameter repairs.
          - The narrow standard-model statement survives conditionally.
        rationale: >-
          This is low-cost model hygiene, but it yields no ordinary-input
          algorithm, repeats a known-style generic-hardness lane, and cannot
          change the Pollard exponent.
        pareto_effect:
          ordinary_time_exponent_delta: 0
          ordinary_memory_exponent_delta: 0
          ordinary_data_query_exponent_delta: 0
          dominated_by: >-
            Candidate B on exponent-targeting scientific value and potential
            decision impact; not on immediate proof-writing cost.
        action: deprioritized_not_closed
        unresolved_scope: >-
          A schema-clean formal theorem with all injection-dependent
          recognition state charged has not been written or independently
          reviewed.
        revisit_condition: >-
          Reopen exactly this repair when the lemma becomes a declared
          dependency of a concrete ordinary-input acquisition construction,
          or when a formal generic-bound knowledge item is explicitly
          prioritized and budgeted.
        provenance:
          producer_task: TASK-20260802-224
          independent_review: RT-20260802-226
          coordinator_record: DEC-20260802-209
      - id: B
        candidate: >-
          Bounded concrete EI-213-04 certified nonlinear-correspondence lane
          for acquiring a Cheon-form auxiliary point from an ordinary ECDLP
          instance.
        tracked_object: >-
          A bounded-description-degree algebraic correspondence C_d contained
          in E x E, with a checkable graph certificate linking Q=[alpha]G to
          Z=[alpha^d]G for d dividing r-1 and d near sqrt(r-1).
        source_order_r_type: >-
          Ordinary prime-order elliptic-curve subgroup <G> of E(F_q), with
          public input (E, r, G, Q=[alpha]G) and no auxiliary alpha-dependent
          preprocessing.
        target_order_r_type: >-
          The same explicit subgroup <G>, with certified output
          Z=[alpha^d]G; subgroup membership and the correspondence certificate
          must be verifiable without knowing alpha.
        hidden_scalar_operation: alpha maps to alpha^d.
        evidence:
          - DEC-20260802-206 leaves ordinary acquisition unresolved.
          - EI-213-04 is a typed but uninstantiated nonlinear-correspondence interface.
          - Cheon's downstream auxiliary-input algorithm is known prior art and supplies a concrete conversion target, not novelty.
          - The affine-action theorem for elliptic-curve morphisms/isogenies is the cheapest nearby-object control to test before construction spend.
        rationale: >-
          This attacks the unresolved structural bottleneck directly. It has
          higher dependency risk than A, but is the only candidate of the two
          that could move the fully charged exponent below one half.
        pareto_effect:
          current_ordinary_time_exponent_delta: 0
          current_ordinary_memory_exponent_delta: 0
          current_ordinary_data_query_exponent_delta: 0
          prospective_threshold: >-
            Construction plus single-instance evaluation, certificate
            verification, memory, data, inverse success, and the known
            downstream auxiliary-input solve must have total exponent < 1/2.
          dominated_by: null
          frontier_check: >-
            Selected as a research question, not an achieved result. It is not
            entered on the algorithmic frontier; therefore no achieved-row
            dominance claim is made.
        action: selected_as_only_successor
        provenance:
          escape_interface: EI-213-04
          predecessor_decisions:
            - DEC-20260802-206
            - DEC-20260802-208
          independent_review: RT-20260802-226
          coordinator_record: DEC-20260802-209

  selected_successor:
    id: B034-S1
    candidate_id: B
    objective: >-
      Determine whether one explicitly represented, bounded-description-degree
      certified correspondence C_d can acquire Z=[alpha^d]G from the ordinary
      instance Q=[alpha]G with fully charged total exponent below 1/2, or
      derive a named obstruction and forward guidance within that exact class.
    boundary:
      parameter_family: >-
        Prime subgroup orders r for which d divides r-1 and
        d=r^(1/2+o(1)); the exact admissible family and uniformity range must be
        stated before derivation.
      included:
        - one concrete correspondence representation and certificate semantics
        - exact source and target subgroup encodings
        - the operation realizing alpha to alpha^d
        - single-instance construction and preprocessing cost
        - evaluation, data/query, memory, and verification cost
        - inverse-success and retry/reuse accounting
        - downstream auxiliary-input solve cost under matched accounting
      excluded:
        - broad screening of EI-213-01, EI-213-04, and EI-213-07
        - implementation or experiment before the algebraic control is resolved
        - amortizing alpha-dependent setup across unrelated instances
        - novelty, SOTA, support, closure, or breakthrough claims
    cheapest_falsification_control: >-
      First prove or refute, for the chosen representation, whether the
      elliptic-curve morphism/isogeny structure forces affine action on the
      hidden scalar. If a genuinely multivalued correspondence escapes that
      control, bound its description degree, branch count, setup, certificate,
      and evaluation costs before treating it as an acquisition mechanism.
    success_gate: >-
      A checkable construction and proof architecture whose fully charged
      single-instance acquisition plus downstream solve has exponent <1/2.
    negative_gate: >-
      A named affine-action, degree-growth, setup, or certificate obstruction
      proved for the exact representation class, plus forward guidance naming
      the next class not covered. A screen count is not closure.
    budgets:
      experiments: 0
      implementations: 0
      proof_candidates: 1
      tracked_objects: 1
    current_evidence_status: unverified_research_question

  official_status_effects:
    goal:
