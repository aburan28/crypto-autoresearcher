  approved_scope:
    curve: Certified ordinary binary curve over GF(2^61) with a 60-bit prime-order subgroup.
    arity: m=8 by seven chained S3 equations; direct S8 is outside the trial.
    bases: Target-blind weighted k11 and equal-column local-random control, each B=316 projected columns.
    targets: Eight common public subgroup targets, four raw cofactor channels per target.
    calls: Two separately planted positive controls, then at most 64 fixed natural calls after the positive gate.
    limits: One CryptoMiniSat thread; 300 seconds, sampled 8 GiB RSS and 64 primary models per call; 25,200-second cross-stage call-admission allowance.
    outputs: Two fixed RUN IDs with 13 exact raw and supervisor files each, including complete calls.tar.gz and calls-manifest.json.
    inference: A certified finite-panel point relation is an instrument observation; solver-reported UNSAT without proof, timeout and resource stop are unvalidated or censored.
