    - >-
      The queue declares exact raw-file custody and a separate independent
      blind schedule derivation. The full reviewer remains blocked until raw
      and blind snapshots and a later exact-path run-report archive exist.
      Partial raw output takes a separately committed failure-provenance
      branch; the normal 26-file snapshot cannot be completed from a subset.
    - >-
      The implementation-tier route is explicit because no linted pilot
      runbook exists. The supervisor's admission and independent checker
      remain mandatory. The pilot makes no whole-pipeline or rho claim.
