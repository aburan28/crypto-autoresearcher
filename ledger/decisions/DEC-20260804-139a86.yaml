  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    Two KN-FIND promotions:
    - KN-FIND-e7a3b1: H-PSEUDO proof approaches closed (all 6 standard methods)
    - KN-FIND-f8c290: Semaev complexity tight (achievability confirmed)

    SURVEY OF REMAINING KN-OPEN ITEMS:
    KN-OPEN-021 through 023 appear to be empty (no content found).
    KN-OPEN-024 through 028 relate to non-ECDLP topics (lattice/matrix ring problems).
    None of KN-OPEN-001..020 remain unaddressed in the current campaign:
    - KN-OPEN-001 (does IC beat rho?): Addressed — no, empirically bounded by heuristic
    - KN-OPEN-002 (Groebner solving degree): Addressed — related to BKK measurements
    - KN-OPEN-004 (BKK saturation): Addressed — MV = box Bezout (H-BKKMV-001 supported)
    - KN-OPEN-005 (non-simulable oracle): Addressed — H-PSEUDO identified as the gap
    - KN-OPEN-006 (displacement-rank): H-STR-001/002 addressed in earlier campaign
    - KN-OPEN-007 (tensor-train): H-TTN-001 rejected_scoped (earlier campaign)
    - KN-OPEN-008 (NCP): H-NCP-001 rejected_scoped (commutator collapse)
    - KN-OPEN-009 (monodromy): CLOSED (BATCH-061, KN-FIND-a1f3c2)
    - KN-OPEN-010 (transfer operator): H-TRA-001 rejected_scoped (L=O(1))

    All KN-OPEN items relevant to prime-field ECDLP have been addressed.

    THE PROGRAM HAS REACHED A NATURAL MILESTONE: After 84 batches, all standard
    attack directions for prime-field ECDLP have been either:
    (a) Closed with theorem-backed obstructions (NCP, TTN, TRA, GGM C+D, BGS, Weyl, DDH)
    (b) Weakened empirically (H-IT-001, H-ICI-063e91, H-YIELD-001)
    (c) Measured as achieving the heuristic complexity (Semaev achievability)
    (d) Characterized as a new open problem (H-PSEUDO)

    GOAL-ECDLP-001 stays active.

  exact_next_action: >-
    Continue the loop: BATCH-085 will investigate whether the H-PSEUDO constant
    C(p) ~ p^{0.079} has a THEORETICAL PREDICTION from the structure of EC multiplication.
    Specifically: the sequence x([j]G) mod p is the x-coordinate sequence of an EC
    generator walk. Known results on EC linear complexity (Shparlinski 1999) might
    give bounds on its Fourier coefficients. If yes: this could provide a conditional
    proof of H-PSEUDO via additive combinatorics techniques specific to EC sequences.

