        separate proposal-revision record. IDEA-20260922-153a90 is a
        consolidated member of IDEA-20260922-1b16d7 (DEC-20260924-99ce20 rank
        24), so its reduced closure section travels inside R1's record and
        153a90 is cited, not superseded. THE SEVENTH ITEM IS REMOVED:
        IDEA-20260922-29b1c5 (R-OVERLAP). CLOSING: a fresh Coordinator session
        composes DEC-20260929-7257b2 from the two reading notes and the six
