  rulings:
    - id: R-ACT
      subject: what this pass does
      ruling: >-
        Perform the selection point that DEC-20260929-1f5fcb NA-4 and
        DEC-20260929-8c3cb2 SP-1, SP-2 and NA-3 defer to the next pass with
        both composing decisions on main. Rank every candidate for the free
        slots against doing nothing (portfolio_ranking), ECC first. Open the
        two ranked batches that fit the two free slots: BATCH-04a6be by this
        decision and BATCH-35bdda by DEC-20260929-4c7ffc. Record the rank,
        reason and revisit condition of everything not opened.
    - id: R-ORDER
      subject: the conflicting slot orders of DEC-20260929-1f5fcb (CH-A, CH-B) and DEC-20260929-8c3cb2 (SP-1)
      ruling: >-
        THE TWO ORDERS ARE RECONCILED, AND THE 63addc NA-3 COMMITMENT BINDS.
        What conflicts. CH-A gives the first slot freed by lane A of
        BATCH-361e02 to the S1 version-3 revision batch and moves NA-3 behind
        it (CH-B); SP-1 keeps NA-3 on the first freed slot, "not deferred a
        third time", with the S2 version-3 revision ranked immediately behind
        it. Both were composed in parallel, neither reading the other. Fact
        that dissolves most of the conflict: both lane slots freed at once,
        when PR 1489 merged and the lane closed, so at this fetch there are
        two free slots beside the held custody slot, not one. Reading the two
        rulings together on that fact: the lane-A slot goes to the S1 revision
        (CH-A), and the second freed slot goes to NA-3 (SP-1; CH-B places NA-3
        on the first slot that frees after the custody slot and the lane-A
        revision hold theirs, which is this one). The S2 revision is ranked
        immediately after NA-3 (SP-1) and rides as the second lane of the S1
        revision batch, behind lane A inside it, taking parallel capacity only
        when NA-3 is not using its slot (DEC-20260929-4c7ffc R-SHAPE). The
        residual conflict is only the tie-break when this session can hold
        one live claim and not two (another session's claim on the goal, see
        R-SLOT). Ruled: the two batches then alternate claim by claim,
        BATCH-04a6be first. Why the SP-1 commitment still binds. Its reason
        was that NA-3 had been deferred at two selection points
        (DEC-20260928-9d9c47, DEC-20260928-cec92e CH-2) on the ground that the
        revisions come first, and that deferring it again without a new
        reason would starve a ranked item (AGENTS.md "Research-direction
        integrity"). No new reason exists: the only argument for deferring it
        again is CH-A's, that the S1 revision yields more information per
        unit of effort, which is the same ground already used twice, and
        CH-A's own revisit clause concedes the slot to NA-3 when the revision
        cannot take it. NA-3 is also cheap (two reading cards and four
        revision cards, zero runs, no review round) and clears two
        design_after holds carrying tripwires T2 and T4 of DEC-20260924-99ce20.
        Why lane A is not starved by alternation. Lane A holds its own slot
        whenever this session may hold two claims; alternation applies only
        under contention, so neither batch waits behind the other's whole
        chain.
      revisit: >-
        Each lane archive verification of BATCH-35bdda and the closing archive
        of BATCH-04a6be; earlier if a slot frees or another session's claim
        goes live.
    - id: R-SLOT
      subject: slots under DEC-20260928-157d40 R-SLOT, DEC-20260928-65c6d7 R-SLOT and DEC-20260929-01ea31 R-SLOT
      ruling: >-
        campaign_budget.max_concurrent 3 counts live claims across every queue
        of the goal. Session-verified live claims at this fetch: 0 of 3. Slot
        1 stays held for the EXP-QSP-70b731 custody successor (R-CUSTODY). As
        in DEC-20260929-01ea31 R-SLOT, a live claim of another session
        (BATCH-ccfdc6, a QSP lane or any other) occupies the held slot first
        and displaces nothing of this pass. Slot 2 goes to BATCH-04a6be
        (queue max_concurrent 1); slot 3 goes to BATCH-35bdda (queue
        max_concurrent 2, whose second claim may use slot 2 only while
        BATCH-04a6be holds no live claim). STANDING CLAIM RULE for every card
        of both batches. Before every claim the session runs git fetch and
        research_dispatch.py --claims refs on every queue of the goal, and
        claims only if (i) the goal-wide live count is at most 2 and (ii) this
        session holds at most one other live claim on the goal. So this
        session never holds more than two claims and never takes the held
        slot. When this session can hold only one claim (another session has
        one live), the batches alternate claim by claim, BATCH-04a6be first
        (R-ORDER); inside BATCH-35bdda lane A goes before lane B. When two
        other-session claims are live, this session waits. Archives run alone:
        no two archive cards of this session run at once, and each stages
        only its declared paths.
    - id: R-CCFDC6
      subject: does the open BATCH-ccfdc6 execution lane occupy a slot
      ruling: >-
        NO, NOT AT THIS FETCH. It holds no live claim, and slots are counted
        in live claims (DEC-20260928-157d40 R-SLOT); open lanes whose Ready
        cards are unclaimed (the four QSP run lanes, BATCH-1faf6f) have never
        been counted at any selection point of this goal. When its owning
        session claims a card, that claim occupies the held slot 1 first and
        displaces nothing of this pass; a second other-session claim makes
        this session's batches wait (R-SLOT). The lane is another session's
        and its /run is that session's or /run's, never this skill's; this
        session touches no BATCH-ccfdc6 record. Observed, not acted on: (a)
        the opening brief describes its Ready card as a /run card, but the
        queue, read by search for ids, titles and states only, holds the
        queued opening archive TASK-20260930-57951a, the wiring executor
        TASK-20260930-606126 and the wiring snapshot TASK-20260930-590bc1,
        with /run named as the act after that snapshot, not as a card; (b) the
        needs-repair finding (DEC-20260930-8de5ba declared by two tasks) is
        that session's to resolve by a superseding record, and is sent to it
        as a pointer (NA-2 a). Neither observation changes the ruling.
      recheck: Every claim, by the R-SLOT rule.
    - id: R-CUSTODY
      subject: the EXP-QSP-70b731 custody successor (DEC-20260929-01ea31 R-CUSTODY)
      ruling: >-
        KEPT ON SLOT 1, NOT OPENED. The facts that ruled it unopenable have not
        changed: FINDING-QSP-DOUBLE-DECLARATION stands (the queued BATCH-2c4a9c
        chain still declares the run files), coordinator-qsp-run-20260921 has
