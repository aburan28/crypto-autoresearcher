        and reads the bus for a reply. Earlier if a QSP claim goes live (then
        it waits and is rechecked) or coordinator-qsp-run-20260921 answers.
    - id: R-SHAPE
      subject: two batches, not one or three
      ruling: >-
        TWO BATCHES. BATCH-04a6be carries NA-3 alone; BATCH-35bdda carries the
        S1 and S2 version-3 revisions as two lanes in the BATCH-361e02 shape
        (DEC-20260929-4c7ffc). Reasons. (1) NA-3 is a different kind of batch:
        idea-generator reading and revision cards with snapshot archives and a
        closing selection decision, no review round and no approval key, so
        coupling it to the revision lanes' lane record and plans would keep
        one lane record open on unrelated work. (2) The two revision lanes
        share one form, one tier and one plan shape, and BATCH-361e02 ran that
        shape end to end with every receipt verified. (3) Two slots, two
        batches: no batch is opened without a slot (DEC-20260928-63addc NA-1
        slot precondition; agents/coordinator.md focus discipline). (4) The
        third batch id would serve only the NISTBIN revision, which has no
        slot (R-NISTBIN). Identifier arithmetic: this pass uses 2 BATCH, 5 DEC
        (two opening, three reserved), 2 H, 2 EXP, 28 TASK and 6 IDEA, and
        returns 1 BATCH, 2 DEC, 12 TASK and 1 IDEA (R-IDS).
    - id: R-NA3-CONTENT
      subject: the content of the NA-3 batch, fixed by DEC-20260928-63addc na3_disposition and na4_disposition
      ruling: >-
        READING LANE FIRST, as NA-3 states, two idea-generator cards under
        research-deep, zero runs, each with its own snapshot archive: (a) the
        Maurer-Menezes-Teske body (IACR ePrint 2001/084; LMS J. Comput. Math. 5
        (2002) 127-174) read at source and recorded with provenance retrieved,
        answering whether its body settles IDEA-20260922-d11575's 25
        derived-empty and 20 open cells and stating the Hess obligation
        (clears HOLD-H if done; tripwire T2 routes any later design); (b)
        Gorla-Massierer (arXiv:1405.1059, IACR ePrint 2014/318) read at source
        with provenance retrieved, pricing IDEA-20260922-8278db's per-trial
        cost at arity 10 to 22 only as far as the source allows (clears HOLD-L
        if done; tripwire T4). Each writes a reading note under its task
