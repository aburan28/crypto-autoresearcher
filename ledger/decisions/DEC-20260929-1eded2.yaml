      subject: hold rulings at this selection point (DEC-20260929-1f5fcb NA-4; DEC-20260929-8c3cb2 SP-2 and NA-3; DEC-20260925-41f6dc R-HOLDS and NA-4; DEC-20260925-a84b16 R-HOLDS and NA-3)
