        proposal. REVISION LANE, four idea-generator cards under research-deep,
        zero runs, one shared snapshot archive, content fixed by
        na3_disposition: R1 IDEA-20260922-1b16d7 carrying
        IDEA-20260922-153a90's reduced closure section (HOLD-K, T5); R2
        IDEA-20260922-e3048d (HOLD-O); R3 IDEA-20260922-c2bbe6 (HOLD-Q, with
        IDEA-20260926-1db0e8 as its dominated_by input, HOLD-X12); R4
        IDEA-20260922-7ab503, -2a3771 and -493606 (HOLD-R, HOLD-S, HOLD-T)
        re-entered through IDEA-20260906-a77711's equivariance. RECORD FORM:
        each revised record is a NEW superseding proposal carrying
        supersedes naming its original (the ledger's precedent, for example
