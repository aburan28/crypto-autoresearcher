  ranking:
    selected: ENDRING-ADAPTIVE-ONEEND-COVERAGE
    rationale: >-
      BATCH-12e6aa selected this exact continuation after every submitted
      public sampler failed to cover the adaptively generated bounded-OneEnd
      queries used by the Page--Wesolowski reconstruction. EigenX/CEST still
      lacks the correctly directed O5 reduction and its decryption behavior
      factors through one evaluator. A new encryption wrapper would therefore
      repeat a known upstream gap. The selected zero-run proof/construction
      batch has higher information value: it can either produce a typed
      adaptive bridge, isolate a scoped obstruction, or show that this route
      cannot connect the existing transcript to complete EndRing without
      changing the construction.
    alternatives:
      - id: EIGENX-WRAPPER-REVISION
        rank: lower_blocked_by_upstream_reduction
        reason: >-
          Changing ciphertext syntax before O5 challenge embedding and
          extraction are typed cannot establish an EndRing dependency.
      - id: CEST-XFER-KI-ONLY-COMPLETION
        rank: lower_changes_requested_assumption
        reason: >-
          A conditional theorem under CEST-XFER-KI may be auditable but is not
          an EndRing theorem and may not be relabeled as one.
      - id: TOY-IMPLEMENTATION
        rank: lower_not_decision_changing
        reason: >-
          The accepted-key algebra is already explicit; toy agreement would
          not repair the adaptive coverage or complete-ring extraction gap.
  exact_uncertainty: >-
    Determine whether a public-only polynomial interface can answer every
    bounded-OneEnd query in the exact adaptive transcript of the sourced
    EndRing reconstruction, or compile a weaker declared sampler law into that
    interface without changing its quantifiers. Then determine whether this
    supplies any correctly directed chain from an EigenX IND attacker to a
    complete EndRing solution, rather than only the reverse attack route.
  batch_contract:
