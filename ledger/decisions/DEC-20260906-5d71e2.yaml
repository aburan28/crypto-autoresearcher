coordinator_decision:
  id: DEC-20260906-5d71e2
  recorded_at: '2026-09-06'
  context: >-
    Repair of one of the six administrative blocks DEC-20260807-5adc24 opened
    (decision: pause) on 2026-08-07. That decision found ledger/handoffs/
    TASK-20260727-013.yaml (EXP-MLKEM-008) carries `authorized_by:
    "DEC-20260727-002"`, a real decision about an entirely different goal and
    batch (GOAL-ECDLP-001's BATCH-009 campaign-budget extension,
    TASK-20260727-002 through -006). This session independently re-read
    DEC-20260727-002 in full and confirmed zero occurrences of EXP-MLKEM-008,
    H-MLKEM-008, IDEA-20260722-003, or GOAL-MLKEM-001. A repository-wide
    grep of ledger/decisions/ for "EXP-MLKEM-008" and "H-MLKEM-008" returns
    only DEC-20260807-5adc24 itself. OPTION A applies: no real prior
    Coordinator approval exists under any citation. UNLIKE the other three
    fabricated-citation experiments, this session's fresh review of the
    underlying record chain surfaced a SECOND, independent, substantive
    defect that the citation repair alone does not fix: EXP-MLKEM-008's own
    `goal_id` is GOAL-MLKEM-001 (confirmed in both the frozen specification
    and TASK-20260727-013's own `goal_id` field), and ledger/goals/
    GOAL-MLKEM-001.yaml shows that goal was already `closed_at_budget` on
    2026-07-24 -- THREE DAYS BEFORE EXP-MLKEM-008's own `approved_at:
    2026-07-27` -- under DEC-20260724-019, with `batches_used: 6` equal to
    `batches_authorized: 6`, `primary_objective_met: false`, and a `next_action`
    stating verbatim "None under this goal... no seventh batch is
    authorized. Continuation requires a new goal record whose objective
    matches defensive ML-KEM implementation conformance rather than ML-KEM
    cryptanalysis...". No Coordinator decision reopening GOAL-MLKEM-001, no
    budget amendment to it, and no new goal record covering this specific
    laboratory side-channel leakage-budget measurement was found anywhere in
    ledger/decisions/ or ledger/goals/ (GOAL-MLKEM-002 through -005 exist but
    cover, respectively, comparison-conformance timing defects, core-SVP
    margin costing, dual-sieve independence measurement, and best-of-M
    ciphertext-selection mechanism search -- none is this side-channel
    trace-cost track). Per this program's rules, an exhausted campaign budget
    is a hard stop on spending that requires its own committed Coordinator
    budget decision before more work is admitted; that decision was never
    made for this experiment.
  decision: pause
  decision_label: >-
    citation_defect_repaired_but_a_second_independent_administrative_defect
    blocks_approval_pending_a_goal_budget_decision
  target_ids:
    - EXP-MLKEM-008
    - H-MLKEM-008
    - TASK-20260727-013
    - GOAL-MLKEM-001
    - DEC-20260724-019
    - DEC-20260807-5adc24
  rationale:
    - >-
      RE-VERIFICATION OF THE ORIGINAL DEFECT. DEC-20260727-002 was read in
      full and confirmed unrelated to EXP-MLKEM-008, exactly as
      DEC-20260807-5adc24 found. This part of the repair is Option A: no
      real approval exists under any citation.
    - >-
      THE FRESH REVIEW FOUND A SEPARATE, GENUINE DEFECT IN THE CONTRACT'S
      ADMINISTRATIVE STANDING, NOT MERELY IN ITS CITATION. GOAL-MLKEM-001's
      own committed record states its campaign was `closed_at_budget` on
      2026-07-24 with its primary (cryptanalytic-mechanism) objective UNMET,
      and its own next_action explicitly requires "a new goal record" for
      continuation into defensive-conformance work -- it does not merely
      request a budget top-up, it names a scope mismatch (cryptanalysis vs.
      conformance) as the reason a NEW goal, not a reopened one, is the
      correct vehicle. EXP-MLKEM-008 is dated three days after that closure
      and still carries goal_id GOAL-MLKEM-001. This is exactly the failure
      this program's rules exist to catch: "An exhausted budget is still a
      hard stop on spending... The next batch requires a committed
      Coordinator budget decision with a recorded rationale."
    - >-
      NOT TREATED AS A REASON TO DISBELIEVE THE SCIENCE. H-MLKEM-008's
      contract itself is well-built on its own terms: a stage-0 availability
      preflight refuses to substitute synthetic data for a missing physical
      rig (explicitly checked against the local knowledge corpus, which was
      confirmed to hold no pinnable ML-KEM-on-Cortex-M4 trace corpus);
      CTRL-SHUFFLED-LABELS, CTRL-IID-SYNTHETIC-ORACLE, CTRL-BURST-REPLAY,
      CTRL-KEY-HOLDOUT, and CTRL-ACQUISITION-SANITY together form a
      genuinely adversarial control suite; claim_tier is correctly bounded
      to laboratory-implementation-conformance with explicit prohibitions on
      any exploit, attack, or deployed-system framing. This decision does
      NOT reject the science and does NOT find the frozen specification
      itself defective in design.
    - >-
      WHY `pause`, NOT `approve` OR `reject_scoped`. Approving now would
      authorize dispatch under a goal record that this program's own
      committed decision (DEC-20260724-019) says is closed with its
      objective unmet and that requires a new goal record before
      continuation -- exactly the kind of budget-discipline violation
      CLAUDE.md and AGENTS.md forbid a Coordinator from committing.
      `reject_scoped` would misrepresent an administrative/budget gap as a
      scientific finding about H-MLKEM-008, which nothing here tests or
      falsifies. `pause` is the correct verb: this is a hold, not a
      rejection of the mechanism, and the block is on WHERE and UNDER WHAT
      BUDGET this work is dispatched, not on whether it should ever run.
    - >-
      SCOPE-FIT NOTE ALREADY CARRIED BY THE HYPOTHESIS ITSELF. H-MLKEM-008's
      own interpretation_limits already flag that RQ-MLKEM-001 targets
      algorithmic cryptanalysis mechanisms while this hypothesis is a
      side-channel defensive measurement, admitted only under a stretched
      reading of the question's method line. That known tension, combined
      with the goal's own explicit closure-and-scope-mismatch finding,
      corroborates rather than merely coincides with this decision's
      conclusion that a fresh, correctly-scoped goal record is the right
      vehicle rather than reactivating GOAL-MLKEM-001 as-is.
  evidence_refs:
    - ledger/decisions/DEC-20260807-5adc24.yaml
    - ledger/decisions/DEC-20260727-002.yaml
    - ledger/decisions/DEC-20260724-019.yaml
    - ledger/goals/GOAL-MLKEM-001.yaml
    - ledger/goals/GOAL-MLKEM-002.yaml
    - ledger/goals/GOAL-MLKEM-003.yaml
    - ledger/goals/GOAL-MLKEM-004.yaml
    - ledger/goals/GOAL-MLKEM-005.yaml
    - ledger/hypotheses/H-MLKEM-008.yaml
    - ledger/proposals/IDEA-20260722-003.yaml
    - experiments/EXP-MLKEM-008/specification.yaml
    - ledger/handoffs/TASK-20260727-013.yaml
  limitations:
    - >-
      This decision does not itself create the new goal record (or the
      budget-amendment decision reopening GOAL-MLKEM-001) that would clear
      this hold; that is future Coordinator work requiring its own
      deliberate act with a recorded rationale, per CLAUDE.md's prohibition
      on quietly raising a budget to keep a campaign turning.
    - >-
      This decision does not assert that GOAL-MLKEM-002 through -005 are
      wrong homes for this work -- only that none of their stated objectives,
      as committed, actually covers laboratory side-channel trace-cost
      leakage-budget measurement, so none can be silently substituted as the
      authorizing goal without its own Coordinator act.
    - >-
      This decision makes no scientific finding about H-MLKEM-008. Nothing
      here measures or tests the hypothesis's soft-oracle prediction claim;
      the pause is entirely administrative (an unauthorized budget/goal
      dispatch, layered on the previously found fabricated citation).
    - >-
      This is a stronger finding than the parallel decisions for
      EXP-HZM-001, EXP-SEMAEV-002, EXP-PMA-001, EXP-JMV-001, and
      EXP-JMV-004: those five had only the citation defect and are approved
      by their own decisions in this repair batch. EXP-MLKEM-008 alone
      carries this second, independent goal-budget defect and therefore does
      not follow the same disposition.
    - >-
      Does not edit experiments/EXP-MLKEM-008/specification.yaml (status
      remains `paused`, now for two independently-stated reasons) or
      ledger/goals/GOAL-MLKEM-001.yaml; this session's write_scope is
      ledger/decisions/ and ledger/corrections/ only.
  next_actions:
    - >-
      Before EXP-MLKEM-008 can be approved, a Coordinator must EITHER (a)
      author a new goal record whose objective actually matches laboratory
      side-channel leakage-budget measurement on protected ML-KEM
      implementations (as GOAL-MLKEM-001's own closure decision required for
      any continuation), and reassign this experiment's goal_id to it, OR
      (b) issue an explicit, reasoned budget-amendment decision reopening
      GOAL-MLKEM-001 with a stated new batch allocation, addressing why its
      already-recorded primary-objective-unmet closure and cryptanalysis-vs-
      conformance scope mismatch do not bar this specific side-channel work.
      Reassigning goal_id in the frozen specification, if that path is
      chosen, is itself a versioned successor action, never an in-place edit.
    - >-
      Only after (a) or (b) is committed should a future Coordinator revisit
      EXP-MLKEM-008's scientific merits (which this decision found otherwise
      sound) for a fresh approve/revise decision under this repair effort's
      standard, citing the resolved goal-budget question explicitly.
    - >-
      This decision does not authorize dispatch of TASK-20260727-013 or any
      successor handoff under any citation, including this decision itself,
      until (a) or (b) above is resolved.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Administrative pause decision; no run exists, no evidence record is
      reviewed, and no scientific finding is made about H-MLKEM-008.
  decided_by: coordinator
  decided_at: '2026-09-06'
  inference:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
