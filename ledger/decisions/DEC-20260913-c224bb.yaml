        None of these is evidence about anything (core rule 5). The three tasks'
        objectives are unchanged; only their execution was cut.

  model_fallback_authorization:
    what: >-
      Handoffs dispatched or re-dispatched after this decision MAY set
      inference.fallback_allowed: true and be served by a first-party model, PROVIDED
      the model meets every requirement of the handoff's policy (executor-implementation
      at medium; review-adversarial at xhigh with an independent session). Each such
      manifest or attestation records requested_policy, resolved_model_id,
      fallback_used: true and the reason "bound backend claude-fable-5-1-thinking at
      usage limit; user cycle resets 2026-10-12".
    what_not: >-
      review-breakthrough (max, degradable: false) is NOT covered: no first-party model
      reaches max, and substituting a lesser tier for it is the silent downgrade the
      policy layer forbids. That round stays blocked under IMP-SEMBIN-REVIEW-MAX with
      the claim un-promoted.
    user_preference_note: >-
      The user directed "Use fable" for subagents. This decision departs from that
      preference for a cheap, reversible executor run and one re-queued validator,
      because the alternative is a full stop of the campaign until 2026-10-12; the
      departure is recorded here and in every affected manifest, and the user can
      revert it by instruction. A run produced under fallback can be repeated on the
      preferred backend later; nothing here is irreversible.

  rationale:
    - >-
      WHY THIS IDEA FIRST. EV-SEMBIN-d40877 left one open attribution -- "a property of
      the x-coordinate window", mechanism unnamed -- and DEC-20260913-3b51c8 named the
      successor as a hypothesis about that window's clustering. IDEA-20260913-cedd2f
      supplies a candidate that is a theorem given two textbook facts, predicts the
      measured f_dispersion (0.797-0.819 vs 0.79-0.82) and variance/mean (1.45-1.52 vs
      1.46-1.52) at the measured means with zero fitted parameters, predicts the
      observed b-independence and the random-subspace null, and is decided per target
      by an integer. Under docs/inventor-protocol.md this is exactly a cheap
      pre-compute falsification check, and under AGENTS.md "ECC comes first" an open
      ECC idea is designed rather than shelved.
    - >-
      WHY IT IS RE-ANALYSIS AND NOT NEW ENUMERATION. per-R-counts.json retains R_x per
      target; the split costs one trace per target. The two odd-n cells are the only
      new compute and are sized inside the EXP-SEMBIN-354a75 code's demonstrated reach.
    - >-
      WHY THE STOPS ARE IMPEDIMENTS. A backend refusing to serve is machine protection,
      not a result; recording it as such and re-queueing is what "goals are never
      paused" requires. The temptation this creates -- dispatching make-work to keep
      the loop turning -- is answered by the ranking above: rank 1 was ranked ahead of
      doing nothing on its own merits before the stops occurred.
    - >-
      WHY NOT COMMIT THE DRAFT GOAL RECORD. It states that EXP-SEMBIN-4fa22c is
      approved by DEC-20260913-4f44a7 and that TASK-20260913-60a066 is DISPATCHED;
      neither record exists. Committing it would be a fabrication under core rule 5
      by inheritance. Retaining it uncommitted loses nothing and asserts nothing.

  evidence_refs:
    - IDEA-20260913-cedd2f
    - EV-SEMBIN-d40877
    - DEC-20260913-3b51c8
