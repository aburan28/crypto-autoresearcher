    - RUN-SEMBIN-251fd3

  official_transitions:
    IDEA-20260913-cedd2f:
      from: proposed
      to: proposed
      basis: >-
        Status unchanged (a proposal keeps `proposed` when a hypothesis takes it up;
        the hypothesis and experiment reference it). Recorded here as INTAKE: the
        proposal is the sole deliverable of an interrupted task and is taken as filed,
        complete, and unedited by the Coordinator.
    H-SEMBIN-83a856:
      from: proposed
      to: specified
      basis: Frozen contract EXP-SEMBIN-911efe approved below.
    EXP-SEMBIN-911efe:
      from: draft
      to: approved
      basis: >-
        Protocol complete: controls (reconstruction, algebraic selftest, null object,
        two known-false splits, matched null with an explicit unavailable branch,
        nearby-object odd-n cells), metrics, advisory budget, stopping and
        invalidation rules, required artifacts, dependencies (none), inference policy
        and Coordinator prior all present. Standing user authorization of 2026-09-06
        cited. Approval asserts protocol completeness, not truth.

  dispatch_ranking:
    - rank: 1
      task: TASK-20260913-1d3db7
      what: executor, EXP-SEMBIN-911efe (RUN-SEMBIN-8be036)
      why: >-
        The decisive quantity is one deterministic integer computable from committed
        artifacts with one trace per target; the mechanism reproduces four
        independently measured figures with no free parameter; it is the successor
        DEC-20260913-3b51c8 named; and it adds a parity condition to Nagao's coset
        construction that bears on H-SEMBIN-c59e50 and H-SEMBIN-4a80f3 before their
        results are read. Cheapest and highest-value open ECC work in the portfolio.
    - rank: 2
      task: TASK-20260913-7ca970
      what: validator, J4/J5 of REVIEW-SEMBIN-20260913-run2 (re-queued)
      why: >-
        Composes the EXP-SEMBIN-92724f half of a round whose other half is already in
        the ledger (DEC-20260913-3b51c8). Its first attempt wrote nothing and is an
        infrastructure stop under core rule 5.
    - rank: 3
      task: TASK-20260913-3b91d0
      what: validator (review-adversarial), ordinary review of RUN-SEMBIN-251fd3
      why: >-
        Servable at xhigh. Needs its review_plan written first (Coordinator prior
        before any reviewer runs); NOT dispatched by this decision. The
        review-breakthrough round the run's escalation flag requires is blocked by
        IMP-SEMBIN-REVIEW-MAX and is not substituted for.
    - rank: 4
      task: successor to TASK-20260913-74b33c
      what: complete the Nagao Proposition 5 design (H-SEMBIN-a7e721, EXP-SEMBIN-4fa22c, BATCH-efea59 queue)
      why: >-
        The draft goal record on disk describes records that do not exist and a task
        as DISPATCHED that was never queued; committing it as-is would put false
        statements in the ledger. It is retained UNCOMMITTED in the working tree and
        must be completed or re-authored by a successor coordinator task that also
        corrects those statements. GOAL-SEMBIN-fcb7a2 is a reserved identifier
        referenced by IDEA-20260913-cedd2f goal_ids; that pointer resolves when the
        goal record lands.
    - rank: 5
      task: successor to TASK-20260913-335d65
      what: resume Nagao ideation (proposals 2..N)
      why: One proposal was filed of the several requested; the rest is unranked until the first is tested.

  infrastructure_stops:
    - task: TASK-20260913-7ca970
      cause: model usage limit (backend stop), 2026-09-13T20:26Z
      artifacts_written: none
      disposition: lane released failed_infrastructure; task re-queued unchanged
    - task: TASK-20260913-74b33c
      cause: model usage limit (backend stop)
      artifacts_written: >-
        coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-efea59/TASK-20260913-74b33c/
        (bench_rank.py/.txt, budget.py/.txt, size_macaulay.py, sizing.txt);
        ledger/goals/GOAL-SEMBIN-fcb7a2/goal.yaml (draft, describes unauthored records)
      disposition: >-
        sizing artifacts committed under this archive as the task's partial
        deliverable; goal.yaml deliberately NOT committed (see dispatch_ranking rank 4)
    - task: TASK-20260913-335d65
      cause: model usage limit (backend stop)
      artifacts_written: ledger/proposals/IDEA-20260913-cedd2f.yaml (complete)
      disposition: proposal committed and taken up; task recorded partial
