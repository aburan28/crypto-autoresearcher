    - >-
      WHY THIS SHAPE. The round has one claim with two polarities of exposure and three kinds of defect (an elimination that leaves the ideal, a missing product, a definitional mismatch).
      A reviewer that reads the code cannot independently re-derive; one that does not read it cannot audit the code. Two sessions, each owning what it can own without compromise, is the
      minimum that covers both.
    - >-
