  design_decisions:
    - id: D-1
      what: One joint round, two reviewer sessions, at most two concurrent.
      why: >-
        DEC-20261004-df2986 NA-1 asks for ONE round of both runs together. GOAL-SEMBIN-5078bc campaign_budget.max_concurrent is 2 (machine headroom, not a research budget), which the
        two sessions exactly fill. Memory caps are 3 GB (validator, small-N scratch only) and 10 GB (blind lane, window-scale closures) on a host of about 15 GB.
    - id: D-2
      what: The blind re-derivation is a SEPARATE SESSION from the validator, and it is the red-team-role session.
      why: >-
        The validator must read the producer's code, notes and records to do its integrity and code joints (W4 to W10); the blind lane's blind_from must contain exactly those paths, and
        tools/check_review_independence.py fails a re-deriver whose sources_read touch blind_from. One session cannot be both. The blind lane is given to the red-team role because its work is
        an adversarial independent re-implementation (red-team responsibility 4: the cheapest counterexample, mutation or control that separates an implementation artifact from a signal); the
        validator.md blind-re-derivation section describes the discipline, which the red-team card restates in full. Role-to-policy is the same (review-adversarial). Cost, stated plainly: the
        round has no red-team session that reads the producer's code; the producer-code mutation work is the validator's (joints W4, W5), the independent-implementation work is the red team's.
    - id: D-3
      what: The re-derived quantity is the closure quantity on ALL TWELVE window systems, in cost order, with UNREACHED declared, not only n = 40..42.
      why: >-
        A structural fact about the verdict rule decides what a re-derivation can test. With W' the closure computed with a missing product, W the true closure and I the ideal, W' is contained
        in W, which is contained in I, so std(W') >= std(W) >= |V|. A missing product can therefore only turn a true "sufficient" into a recorded "insufficient", never the reverse: a recorded
        "sufficient" depends on soundness (no out-of-ideal row) and a recorded "insufficient" depends on soundness AND completeness (no missing product). The producer's two cross-checks share
        product generation and cannot see completeness. A re-derivation restricted to the smallest window instances would therefore test soundness and the statement of the quantity but could not
        detect a missing product in the instances whose recorded verdict has the insufficient polarity, which are the larger ones. The quantity therefore covers all twelve; the heavy tier is
        declared UNREACHED rather than skipped if it does not finish. The dispatching session's suggestion of n = 40..42 is kept as the cheap first tiers, not as the whole quantity. The card does
        not tell the blind lane which instances carry which polarity.
    - id: D-4
      what: The plan is carried by path (PD-2), with every joint and attack plan copied verbatim onto the card of its owner.
      why: >-
        The prior must not be in a card a reviewer reads (AGENTS.md "Review architecture": the prior is recorded first and its value is that it is recorded; its value as an independent
        comparison is lost if the reviewers see it). The validator tooling loads plans by path.
    - id: D-5
      what: STANDARD TIER (review-adversarial at xhigh), fallback_allowed false, degraded_allowed false, independent_session_required true on both cards.
      why: >-
        AGENTS.md rule 12 and the routing rule unrecoverable-result-review apply to a claimed breakthrough, a proposed closed transition, or a contradiction of prior validated evidence. This round
        asserts none of them: it reviews an instrument's validity for two runs, closes no lane or goal, and contradicts no validated evidence record. Admissibility of a run is a critical-result review,
        which is review-adversarial. The non-degradable semantics of review-breakthrough are left intact: this decision does not run a lower tier in place of that one, because no claim here requires it,
        and the plan records that any later weaken, reject_scoped, rejected, closure or contradiction of a published or validated record is a separate claim needing review-breakthrough at max in its own
        independent session (IMP-SEMBIN-REVIEW-MAX stays as recorded; the CLAIM, not the campaign, stays un-promoted if that tier cannot be served).
    - id: D-6
      what: proves_too_much objects are built by the blind lane from the statement of the quantity, with the validator's producer-code variants as attack plans inside W4 and W5.
      why: >-
        The control must not inherit a producer defect, so its owner is the lane with no producer code. The objects are a missing-product mutant family, bulk and sparse corruption mutants of the
        elimination step, and known-sufficient and known-insufficient controls for the verdict rule, against the producer's soundness argument (two routines agree, evaluation check at one zero
        clean, structural check clean, hence sound). The failure signature is stated so the control can fail in either direction: the argument must NOT flag a missing-product mutant (the
        confirmed blind spot), the evaluation check MUST flag bulk corruption and MUST stay clean on a one-zero-vanishing row, and the verdict rule MUST separate the two controls.
    - id: D-7
      what: Blind hygiene by a no-history sandbox for the blind lane; blind-history tool check declared UNCHECKABLE.
      why: >-
        The run-package commit message of RUN-SEMBIN-5ed13e states verdict labels and measured values (TASK-20261004-342564 receipt, commit_provenance), and it is reachable history; a blind agent
        with git log in a repository checkout can read it (CORR-20260905-547849 precedent). History cannot be rewritten. The blind lane is therefore launched from a plain directory containing its card,
        the twelve .ms files and an out/ directory (TASK-20261004-095926 DP-5). The plan declares no protected hashes (the plan author could not compute them) so the tool reports UNCHECKABLE, not a pass.
    - id: D-8
      what: The Coordinator, not a reviewer, compares the blind lane's values with the recorded ones.
      why: >-
        The blind lane is never shown the recorded values (that would end its blindness). After both reports are archived the Coordinator compares them through the validator's independent recomputation
        of the table (W8), and localises a disagreement to one of three implementations: the statement of the quantity (checked by the validator's W5 (1)), closure.c with M4RI as run, or the lane.

