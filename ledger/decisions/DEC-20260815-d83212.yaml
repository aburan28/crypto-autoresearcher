      Author one fresh maximum-runs-zero static successor that (a) corrects
      item D by citing
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-68ea16/tasks/TASK-20260811-cb5d76/physical-frontier-compiler.yaml's
      archive_hashing_mount_state_scaling section, supplying the 5-row
