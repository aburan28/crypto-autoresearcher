  context: >
    A parallel session (lane address coordinator-ecrank-3, worktree
    /Volumes/SSD990/llm/tmp/opencode/ecrank-n1-wt, branch ecrank-n1-20260905)
    opened a duplicate approval-and-execution lane for the same frozen
    contract. All facts below are read from committed state on origin/main:
    (1) commit 1583217a1 (2026-09-06T08:23:13-07:00) recorded
    DEC-20260905-eb1df9, a second user-confirmed approval of
    EXP-ECRANK-76a70d, in parallel with the canonical approval
    DEC-20260905-2d466e (BATCH-832f3d, user-confirmed "Approve as frozen
    (Recommended)", merged via PR #780), and opened BATCH-90fabf with a
    4-task chain executor -> snapshot -> validator -> ledger at
    max_concurrent 1, and committed the four lane handoffs
    (TASK-20260905-20625b / -54bcbf / -47742c / -556783) each missing the
    required top-level handoff wrapper. (2) That executor (TASK-20260905-54bcbf) ran to
    completion and its package was snapshot-committed at 36f429bea and bound
    at fc822bd8d under its own task directory (a different implementation,
    engine.py/run_all.py, from the canonical lane's run_arm.py suite).
    (3) The lane's validator (TASK-20260905-47742c) was claimed at
    2026-09-06T17:38:04Z and released at 17:40:15Z with outcome failed,
    empty artifact_sha256, and no report; its ledger task
    (TASK-20260905-556783) never ran and was still queued. (4)
    DEC-20260905-eb1df9 is malformed YAML (unquoted colon-space in the plain
    scalar of approval_scope item 1, line 53 column 65) and has been failing
    tools/validate_ledger.py on every branch that merged origin/main since
    1583217a1. (5) The lane's queued states had never been backfilled from
    the release records.
  ruling: >
    BATCH-90fabf is CLOSED AS A DUPLICATE, DEAD LANE. (i) Its run package
    has no evidentiary standing: the review chain is broken (validator
    released failed with no report), it was approved under the malformed and
    now-superseded DEC-20260905-eb1df9, and it was never ledger-archived;
    per the program's evidence rules an unreviewed run package supports no
    claim. The package is preserved as immutable committed history and is
    not deleted or rewritten. (ii) Queue states are backfilled from the
    release records and the lane is closed: TASK-20260905-54bcbf ->
    completed (release 564c7d92e), TASK-20260905-47742c -> failed (release
    68937ec82, no artifacts), TASK-20260905-556783 -> cancelled (void: it
    would have ledger-archived an unreviewed package under a malformed
    approval). (iii) DEC-20260905-eb1df9 and the four lane handoffs are repaired by the
    sanctioned schema-supersession mechanism, not an edit: replacements under
    ledger/corrections/schema-supersessions/20260906/ (the decision replacement
    preserves the original content verbatim under the canonical wrapper with one
    syntactic correction and four flagged schema-conformance fields; the three
    pure handoff wraps are content-identical; the 47742c wrap voids its
    pre-schema review_plan block -- that review round never ran -- and preserves
    it verbatim in the replacement header), all five pairs hash-pinned in
    tools/schema_supersession_registry.yaml; the original files are untouched. (iv) The canonical approval of
    EXP-ECRANK-76a70d remains DEC-20260905-2d466e, and the canonical
    executed-and-reviewed record of the contract remains this batch's
    DEC-20260906-7448cf / EV-ECRANK-8b35bb. Nothing in this decision
    re-approves, re-scopes, or re-runs the duplicate lane's work.
  unexpected_observation_recorded: >
    Per rule 8, recorded without standing: the duplicate lane's unreviewed
    run package reports the same core result as the reviewed record -- zero
    constructed instances on all arms (per_b_rate 0.0 at n = 6/8/10 in its
    results/summary.json), F1 firing on the n = 8 declared sample, IV-1
    passing (known-false totals 7 and 9 as expected), and bit-for-bit
    arm-B determinism (its results/observations.md). An independent
    implementation agreeing with EV-ECRANK-8b35bb is a useful cross-check,
    but it carries no evidentiary weight: broken review chain, superseded
    approval, different op-counting convention (its arm-B counter read
    7.104e7 against 8,683,560 under the canonical implementation). Nothing
    in this decision or in EV-ECRANK-8b35bb relies on it, and it may not be
    cited as evidence until an independent review round validates it.
