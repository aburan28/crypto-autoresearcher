coordinator_decision:
  id: DEC-20260907-b5d987
  recorded_at: '2026-09-07'
  context: >-
    EXP-RELN-141a86 executed Stage 0b through Stage 0d after the verified
    Stage 0a archive. EV-RELN-b3c6ef records the result: every recovery
    control's closed-form target matched real data exactly (zero
    residual), but the Stage-0c gate additionally requires the exhaustive-
    grammar engine to REDISCOVER each expression by blind structural
    search, and three of five controls (INV-1, INV-7, INV-8, all over
    6-leaf packs at complexity 9-11) could not complete that search within
    this session's memory budget -- terminated as resource_exhaustion,
    never a negative result. Stage-0d's independent zero-compute check
    passed cleanly. Per the contract's own stopping_rules, Stage 1 and
    Stage 2 correctly did not run.
  decision: inconclusive
  target_ids:
    - EXP-RELN-141a86
    - H-RELN-427bfd
    - EV-RELN-b3c6ef
  rationale:
    - >-
      The contract's own decision_paths.negative names this outcome
      exactly: "Coordinator records instrument failure with the failing
      control, the recovery complexity achieved and the engine; the
      hypothesis stays untested; a successor contract with a repaired
      grammar or engine is designed under a new experiment ID; no null or
      alive verdict is reported." `inconclusive` (this repo's evidence
      schema does not carry a separate `instrument_failure` direction) is
      the decision that best matches that outcome without asserting a
      verdict the run did not reach.
    - >-
      H-RELN-427bfd's status remains proposed. None of the 19 candidate
      invariants change status; the two closest to being tested (INV-A4,
      INV-A6) PASSED both numerically and structurally and are the
      cleanest positive result of this run, but the contract's success
      criterion requires all five recovery controls before any E-arm
      verdict is meaningful, so this alone does not authorize Stage 1.
    - >-
      The resource_exhaustion is scoped precisely: three specific targets,
      one specific host memory ceiling, one specific (brute-force)
      enumeration strategy. It is not read as evidence that the targets
      are unrecoverable, only that this run's engine and budget did not
      recover them.
  evidence_refs:
    - EV-RELN-b3c6ef
    - experiments/EXP-RELN-141a86/runs/RUN-RELN-141a86-stage0bcde/recovery-controls.json
    - experiments/EXP-RELN-141a86/runs/RUN-RELN-141a86-stage0bcde/p2-delta-null-check.json
  limitations:
    - >-
      This decision does not attempt to repair the grammar engine's
      exhaustive-search performance; that is named as the concrete next
      action, not performed here.
    - >-
      Independent validator and red-team review, per the contract's
      later_review_requirements, is not owed on an inconclusive result
      with no candidate-list verdict, but would be required before any
      future Stage-1 output backs a claim.
    - This decision does not touch EXP-RELN-f202be or EXP-RELN-82f487.
  next_actions:
    - >-
      Design a successor Stage-0c attempt (same run directory namespace,
      a fresh RUN-ID) with either a memory-bounded/pruned enumeration
      order or a longer time budget, targeting specifically INV-1, INV-7,
      and INV-8's structural recovery; the two grammar_engine.py bugfixes
      already made in this run should be preserved.
    - >-
      RQ-RELN-61638a's three planned contracts (EXP-RELN-f202be,
      EXP-RELN-82f487, EXP-RELN-141a86) have now each returned a result
      (inconclusive, inconclusive, instrument failure respectively); no
      further contract dispatch is pending unless the user requests a
      repair pass on any of the three named follow-ups.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Instrument failure with no candidate-list verdict does not meet the
      replicated/strong bar for knowledge promotion.
  decided_by: coordinator
  decided_at: '2026-09-07'
