coordinator_decision:
  id: DEC-20260727-009
  supersedes: DEC-20260726-006
  supersedes_note: >-
    `supersedes` is a local extension of the templates/research-records.md
    coordinator_decision schema, used here exactly as DEC-20260727-008 disposed of
    DEC-20260726-005. DEC-20260726-006 is NOT edited: it is an immutable committed
    record, it stands in the ledger as written, and it is corrected by
    CORR-20260727-007 and superseded by this decision.

  context: >-
    BATCH-007 opened as a bounded artifact-integrity batch over EV-STR-002, the
    evidence record underwriting the `support` verdict DEC-20260726-006 on
    H-STR-002. Four independent non-originating reviews have now reported. (1)
    TASK-20260727-013's census, validated PASS by TASK-20260727-016 over 247
    refs, all reflog history, 20 stashes and 47,983 objects, settles that no run
    record for B = 55, 204 or 397 exists anywhere in this repository - every
    headline quantity of DEC-20260726-006 rests on nine "inline" measurements
    with no artifacts - and adds finding V-NEW-1: EV-STR-002 and DEC-20260726-006
    were REWRITTEN IN PLACE in commit 5de2db97, 93 minutes after being archived in
    a325d824, in a commit that added no run record. (2) TASK-20260727-017 then
    asserted OBS-1/RT-OBJ-1: that `phi_alpha` measures row-insertion bookkeeping
    rather than phi-invariance, on the strength of an arm-E probe scoring 0, 1, 0,
    1. That adjudication rested on unarchived scratchpad scripts that no record
    may cite, so the Coordinator froze EXP-STR-003 (contract committed at
    92268c9e BEFORE execution, run package at c79e3a8d, 20/20 runs valid) to
    measure it under contract instead. (3) EXP-STR-003 FALSIFIED that probe: arm E
    measured 11, 1, 0, 29 against a pre-registration of 0, 1, 0, 1, so criterion
    F1 fired at B = 27 and B = 397. Per the frozen contract this is binding -
    OBS-1/RT-OBJ-1's comparative limb is withdrawn, this decision may not rest on
    it, and the as-committed metric is UNADJUDICATED, not refuted. S2, S3 and S4
    all held. (4) TASK-20260727-023 validated the run package PASS by writing
    independent measurement code from the frozen spec and reproducing every cell,
    and TASK-20260727-024 adjudicated the falsification and recommended `weaken`
    on grounds that are explicitly NOT the instrument-confound premise. This
    decision disposes of DEC-20260726-006 and H-STR-002 on those grounds.

  decision: weaken

  target_ids:
    - H-STR-002
    - DEC-20260726-006
    - EV-STR-002
    - EXP-STR-002
    - EXP-STR-003

  transitions:
    - record: H-STR-002
      from: supported
      to: weakened
      basis: this decision
    - record: DEC-20260726-006
      from: standing support verdict
      to: superseded by DEC-20260727-009
    - record: EV-STR-002
      from: preliminary support evidence with run_ids empty
      to: >-
        corrected by CORR-20260727-007 and superseded as the evidentiary basis of
        the claim by EV-STR-003, which binds 20 exact EXP-STR-003 run identifiers
        and 13 exact EXP-STR-002 run identifiers. EV-STR-002 is not edited.

  what_this_decision_does_NOT_rest_on: >-
    IT DOES NOT REST ON THE INSTRUMENT-CONFOUND PREMISE, and the reason is
    recorded prominently because taking that route is precisely how this batch
    went wrong once already. The premise "phi_alpha is an artifact of the
    row-insertion rule, therefore DEC-20260726-006 fails" is UNADJUDICATED after
    F1 fired: the frozen contract fixed that consequence in advance, and reasoning
    from a claim whose own pre-registered falsifier fired would repeat, in a new
    record, exactly the defect this batch exists to correct. No rationale item
    below uses it. Specifically: nothing here rests on arm E, on the F1 firing, on
    OBS-1, on RT-OBJ-1's comparative limb, or on any scratchpad probe. RT-OBJ-1 is
    admitted ONLY in its rescoped derivational form (alpha is bounded by the count
    of positions where the emitted row list departs from a clean sigma-orbit
    concatenation - criterion S3, held 4 of 4 with equality at 3 of 4), and even
    that limb is load-bearing for nothing below.

  nothing_was_fabricated: >-
    RECORDED PROMINENTLY, AND FIRST. The inline measurements behind EV-STR-002
    were really performed. EXP-STR-003 arm A reproduces phi_alpha 9, 2, 4, 1 at
    B = 27, 55, 204, 397 EXACTLY, 4 of 4, and misaligned_row_count 9, 5, 4, 1
    exactly; CTRL-8 agrees with the one overlapping committed record
    (RUN-STR-phi-b12-s1-m2) on all five compared fields; and DEC-20260726-006's
    cost_ratio 0.011 is exact arithmetic on (alpha = 1, B = 397). Whatever else is
    wrong here, the phi-column numbers were computed, not invented. No record in
    this batch alleges fabrication, no finding of intent is made anywhere, and any
    downstream reading of this decision as an accusation is wrong. What failed is
    the BOOKKEEPING AROUND real measurements, the STATED PROVENANCE of half of
    them, the REPRODUCTION of the other half of the headline pairs, and the
    INFERENCE the record drew from them.

  rationale:
    - id: R1
      title: ARTIFACTS. The evidentiary basis of the support verdict is absent from the repository.
      text: >-
        Five independent limbs, each checkable. (i) EV-STR-002 carries
        `run_ids: []` against AGENTS.md rule 10 while asserting a basis of "13
        committed runs + 9 extended measurements (inline)". (ii) No run record for
        B = 55, 204 or 397 exists in any local branch, remote-tracking branch,
        tag, stash, reflog entry or anywhere in the object database, reachable or
        not - settled by TASK-20260727-016 across 247 refs and 47,983 objects,
        with the single stated qualification that remote-tracking refs are as of a
        fetch 45 minutes before the snapshot. Eleven of the twelve artifact-policy
        items are wholly absent for all nine measurements, and zero of the six
        artifacts EXP-STR-002's own specification requires per run exist for any of
        them. (iii) The claimed producing path is FALSIFIED at two of the four
        headline instances: under frozen criterion S4, measured at 4 of 4 with
        committed run records, the committed `main()` raises IndexError at
        harness/endomorphism_la.py:451 with exit code 1 and writes no record
        whenever B mod 3 != 0 - which is exactly B = 55 and B = 397 - and
        completes at both B mod 3 == 0 instances. (iv) HALF the headline numbers
        do not reproduce: rand_alpha 53, 200, 387 measures 54, 201, 382 in
        EXP-STR-003 arm C, and 52, 199, 387 under the phi-shift measurement of the
        same rows, so the recorded values match neither committed computation, 3
        of 3. (v) Both records were rewritten IN PLACE in 5de2db97, 93 minutes
        after archival, in a commit that added no run record, replacing text that
        said the 16/20-bit instances were too slow to generate. R1 is an
        evidence-integrity failure, not a mathematical one, and it is stated as
        such.
    - id: R2
      title: THE ONE-VARIABLE COMPARISON. Phi-invariance of the factor base does not move the metric.
      text: >-
        Archived, measured under a contract frozen before execution, independently
        re-derived, and involving neither arm E nor F1. Under a COMMON phi shift
        operator, the same collection rule and the same no-append convention,
        changing only the factor base: arm B (phi-invariant F) gives alpha = 27,
        52, 197, 386 and arm C's phi-shift measurement of its own random-F rows
        gives 27, 52, 199, 387. The differences are 0, 0, 2 and 1 on values of
        order B, at 4 of 4. EV-STR-002's inference sentence is
        "endomorphism-invariant factor bases induce O(1) displacement rank"; on
        these four toy instances the factor base induces nothing. The appended
        rows do, and they do so BY CONSTRUCTION - closing a row list under sigma
        makes the matrix sigma-equivariant, which is a derivation rather than a
        measurement. This is the one-variable ablation EXP-STR-002's own
        specification declared at lines 36-39 and never implemented. Held at
        `weaken` rather than more, because H-STR-002's falsification condition
        FC-1 is ambiguous as drafted - met at 4 of 4 on the natural reading of
        "relation collection", not met on the defender's reading in which
        collection includes the orbit closure - and the Coordinator does not
        resolve a drafting ambiguity in the direction that suits the transition.
    - id: R3
      title: NO COST PATH. There is no system, no solve, and no archived baseline where it matters.
      text: >-
        `_collect_relations` builds rows as bare 0/1 incidence vectors and never
        records the target's scalar multiple, so no linear system with a
        right-hand side has ever been assembled - not in EXP-STR-002, not in
        EXP-STR-003. Measured rank deficiency B - rank_M of the phi arm's own row
        list is 4, 6, 30 and 67 at B = 27, 55, 204 and 397: at the headline
        instance the system is 67 short of full rank, and no solve is available
        from it at any tested instance. Arm E - the construction the contract
        itself calls mathematically worthless - has rank deficiency 0, 0, 0, 1.
        There is no committed rho or BSGS baseline at n = 41617 or n = 158071, the
        two instances carrying the headline claims. DEC-20260726-006's cost
        comparison therefore prices two models of solving a system that was never
        assembled, against no archived end-to-end baseline, at the parameters
        where the claim was made. R3 is an ABSENCE, not a refutation, and is
        weighted as such.
    - id: R4
      title: A status must not outlive its evidence.
      text: >-
        R1 is an evidence-integrity failure, R2 is a measured 4-of-4 contradiction
        of the evidence record's own inference sentence under a one-variable
        comparison, and R3 is a structural absence. None of the three, alone or
        together, shows the MECHANISM is wrong, and none licenses rejection. What
        they jointly show is that `supported` has no surviving basis. The
        transition is therefore the strongest the archived, replicable evidence
        supports and the weakest that is honest.
    - id: R5
      title: The only reproducible effect is a known constant factor, and it is not target-class.
      text: >-
        Across all four instances the phi arm needs a factor of about 3 fewer
        relation-collection searches per relation row than the random arm:
        searches per row 0.692/1.811, 0.364/1.154, 0.383/1.136 and 0.770/2.466,
        i.e. ratios 2.62x, 3.17x, 2.97x and 3.20x. That is r = 3, the classical
        automorphism-quotient saving already quantified in the literature
        (Wiener-Zuccherato and Duursma-Gaudry-Morain for rho at sqrt(r); the
        factor-r factor-base quotient and r-fold block decomposition for index
        calculus). It is the real, reproducible, archived effect in this line of
        work, it appears in relation collection and not in displacement rank, it
        is a CONSTANT FACTOR, and it is therefore not target-class under the
        governing dispatch bias. The claimed super-constant B/(alpha^2 log B)
        linear-algebra saving is exactly the part that is not supported.

  instrument_question_disposition:
    verdict: UNADJUDICATED
    text: >-
      Recorded plainly, as the frozen contract requires and as the Coordinator
      would record it even if it were inconvenient. EXP-STR-003's mechanical
      verdict is `obs1_falsified`: F1 fired at I1 and I4 because arm E measured
      11, 1, 0, 29 against a pre-registration of 0, 1, 0, 1. OBS-1 and RT-OBJ-1's
      comparative limb are WITHDRAWN and are not restated in any form. That
      falsification must NOT be read as vindication of the instrument, and this
      decision does not read it that way: the contract's own consequence is
      "UNADJUDICATED rather than refuted"; TASK-20260727-024 established that arm
      E as frozen was a valid EXISTENCE control and a MIS-SPECIFIED COMPARATIVE
      one, diverging by closure convention on an uncontrolled nuisance variable
      rather than by endomorphism content; and the contract's own `mixed` branch,
      whose disposition is `inconclusive`, is unreachable by construction
      (S_i = not F_i) even though the measured S1 pattern is literally mixed - it
      held at I2 and I3 and failed at I1 and I4. Whether `phi_alpha` is an
      artifact of the row-insertion rule is OPEN and may be asserted in neither
      direction by any downstream record.

  alternatives_considered:
    replicate: >-
      REJECTED as the disposition, though replication is required going forward.
      TASK-20260727-023 already performed the strongest available replication of
      EXP-STR-003 - independently written measurement code reproducing all 16
      primary cells, all 16 alternate-shift cells and every secondary quantity
      with zero disagreements - so there is nothing left to re-execute there. And
      EXP-STR-003 replicates an INSTRUMENT: no arm of it measures H-STR-002's
      mechanism, so no amount of re-running it could confirm or replicate the
      hypothesis. Re-running EXP-STR-002 at B = 55/204/397 for artifacts alone was
      considered and rejected for the reason the red team gave: it would first
      require repairing the line-451 IndexError, which is a code change to the
      object of measurement requiring a recorded amendment, and it would buy
      archival hygiene at zero epistemic progress. Replication remains a standing
      REQUIREMENT before any transition back toward `supported`, per
      docs/claims-and-verification.md.
    inconclusive: >-
      REJECTED as UNDERSTATING. It would be the right call if the only finding
      were the UNADJUDICATED instrument question - and on that question alone this
      record does say `inconclusive`, in
      instrument_question_disposition above. It is not the only finding: R1 is a
      documented artifact failure validated PASS by an exhaustive independent
      search, and R2 is a measured 4-of-4 contradiction of the evidence record's
      own inference sentence under a one-variable comparison. Recording
      `inconclusive` overall would leave the ledger silent about both and would
      let a future reader re-derive `supported` from the same unreproducible
      record.
    reject_scoped: >-
      FORBIDDEN, and the Coordinator concurs without reservation. No instance is
      exhibited on which H-STR-002's mechanism fails. The mechanism is a one-line
      consequence of phi being an automorphism: for a phi-invariant factor base
      phi(R) is a genuine relation whenever R is, and the closed system really is
      C_3-equivariant. The strongest refutation artifact actually archived is
      `empirical_only` and the design is four instances with one realisation per
      cell, which under docs/claims-and-verification.md takes `weaken` plus
      replication and never a scoped rejection. Rejecting here would convert a
      bounded instrument ablation into an impossibility claim.
    correction_without_status_change: >-
      REJECTED as INSUFFICIENT, though necessary. CORR-20260727-007 repairs the
      record of the missing artifacts and the in-place rewrite, and it is issued
      in this same archive. It would leave H-STR-002 `supported` on an evidence
      record whose extended rows have no artifacts anywhere, whose stated
      producing path crashes at half its headline instances, whose random-arm
      numbers do not reproduce, and whose inference sentence is contradicted at 4
      of 4 by the one-variable comparison. The correction is part of this
      disposition; it is not a substitute for it.
    support_or_expand: >-
      NOT AVAILABLE. There is no surviving archived basis for `supported`, and
      none of the four promotion gates is satisfied (see promotion_gates below).

  evidence_refs:
    - EV-STR-003
    - EV-STR-002
    - CORR-20260727-007
    - CORR-20260727-005
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-007/tasks/TASK-20260727-013/census_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-007/reviews/TASK-20260727-016/validation_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-007/reviews/TASK-20260727-017/red_team_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-007/reviews/TASK-20260727-017/adversarial_notes.md
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-007/reviews/TASK-20260727-023/validation_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-007/reviews/TASK-20260727-024/red_team_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-007/reviews/TASK-20260727-024/adversarial_notes.md
    - experiments/EXP-STR-003/specification.yaml
    - experiments/EXP-STR-003/results/ablation_summary.json
    - RUN-STR-003-{A,B,C,D,E}-{b12s1,b12s2,b16s3,b20s3} (20 committed run records, enumerated in EV-STR-003.run_ids)

  refutation_artifact:
    strongest_class_archived: empirical_only
    what_it_is: >-
      Twenty committed run records under a contract frozen before execution, whose
      every measured cell was independently re-derived from separately written
      code, plus arithmetic over them and over the committed EXP-STR-002 records.
      R1, R2 and R3 each reduce to those artifacts.
    strongest_class_the_result_admits: derivation
    why_not_claimed: >-
      No derivation note is archived. The argument that alpha counts phase breaks
      in the emission stream - from the square-branch identity
      D[i][j] = M[i][j] - M[sigma(i)][sigma(j)], the append rule at lines 292-304
      and the `xs[:B]` truncation - is self-contained and checkable, but it exists
      only inside review reports, and docs/claims-and-verification.md requires a
      refutation artifact to be produced and snapshot-committed BEFORE the
      decision that relies on it. This decision therefore does not rely on it, and
      declares `empirical_only` rather than claiming a derivation it has not
      archived. An undeclared basis would be the failure; the lack of a proof is
      not.
    counterexample_certificate: >-
      NOT AVAILABLE. Every EXP-STR-003 run record carries certificate
      {kind: none}; no arm claims a solve, a decomposition or any statement a
      verifier could independently re-check.

  promotion_gates:
    status: >-
      All four gates for an asymptotic-complexity claim remain OPEN. H-STR-002 may
      not transition toward `supported` while any is open, and this decision moves
      it away from `supported`, not toward it.
    gate_1_proof_decomposition: >-
      OPEN. No archived proof decomposed into single-responsibility lemmas exists
      for the claimed B/(alpha^2 log B) linear-algebra saving, and no main theorem
      assembles per-attempt cost times inverse success probability. Nothing in
      this line of work computes total expected cost that way; success probability
      is effectively set to 1 while no instance has produced a solvable system.
    gate_2_numbered_heuristics_with_validation: >-
      OPEN. H-STR-002's assumptions are prose, not numbered formally stated
      heuristics, and none carries a random-model justification (rigorous bound
      plus classical distribution theorem) or a falsification condition with a
      validation plan. "alpha = O(1) at large B" is asserted from four toy points
      that are not monotone (9, 2, 4, 1).
    gate_3_concrete_cost_honesty: >-
      OPEN. There is no concrete-cost table at standardized parameter sets, no
      memory term on either side, no time-memory tradeoff, no parallelization
      accounting, no disclosure of what hides in o(1)/polylog cofactors, and no
      affected-versus-safe scope statement. RT-CM-1 through RT-CM-6 are UNTOUCHED
      by EXP-STR-003 - which excludes cost by contract - and must not be described
      as settled, tested or addressed by this decision or by any record citing it.
    gate_4_independent_review_and_red_team: >-
      PARTIALLY EXERCISED AND STILL OPEN for a promotion. Four independent
      non-originating reviews reported in this batch and two of them are red-team
      passes, but none reviewed a cost model or a set of heuristics, because
      neither exists in archived form. All four sessions disclose
      `model_verified: false` (the orchestration adapter is absent on this branch)
      and none claims equivalence to the requested review-xhigh policy.

  limitations:
    - >-
      TOY TIER, FOUR INSTANCES. Everything decided here is scoped to four
      deterministically generated j=0 (CM discriminant -3) prime-field curves with
      p = 1 mod 3, p <= 631843 (12, 12, 16 and 20 field bits), n <= 158071 (about
      17.3 bits), B = ceil(isqrt(n)) in {27, 55, 204, 397}, arity m = 2 only, one
      realisation per cell, one solver path (harness/semaev.py::_find_decomposition
      for collection and the committed `_measure_displacement_rank` for the
      metric), one stack (Python 3.13.1, numpy 2.4.0, sympy 1.14.0, macOS arm64)
      and a 20-run, 132.595-second budget. The cross-referenced EXP-STR-002 set is
      narrower still: 8 and 12 bits, B in {2, 6, 27}. Nothing extends to arity
      m = 3, to B > 397, to j != 0 curves, to generic curves, to medium or
      cryptographic scale, or to index calculus in general.
    - >-
      NOT A CRYPTANALYTIC RESULT. Nothing in this decision attacks, weakens or
      speeds up any cryptosystem; it is not an attack improvement, not a closure,
      not an impossibility claim, and no asymptotic exponent moves in either
      direction. The one reproducible effect is a known constant factor (R5).
    - >-
      THE MECHANISM IS UNTESTED, NOT REFUTED. No arm of EXP-STR-003 measures
      whether a phi-invariant factor base yields an equivariant relation system.
      That claim is a one-line consequence of phi being an automorphism and is not
      in doubt; what is unsupported is the conversion of that equivariance into a
      super-constant linear-algebra saving. An honest structural ceiling for exact
      C_3-equivariance is a factor r = 3 (three blocks of size B/3 against
      Wiedemann's 2B^2), which is available at all four instances since 3 divides
      n - 1 at each - and which no arm tested.
    - >-
      THE INSTRUMENT QUESTION IS OPEN in both directions (see
      instrument_question_disposition). No downstream record may call `phi_alpha`
      an artifact, and none may call it validated.
    - >-
      EVIDENCE-INTEGRITY GAPS CARRIED FORWARD, NOT REPAIRED: EV-STR-002,
      EV-IC-001 and EV-GGM-001 still carry `run_ids: []` under AGENTS.md rule 10
      (INT-BATCH006-009); the archive-receipt ordering defect INT-BATCH007-T /
      AMEND-2026-07-27-D is unrepaired repository-wide, so no archive task in this
      repository can be marked completed and pass `verify_archive`; no executor
      task receipt exists for TASK-20260727-021, so two disclosed dress rehearsals
      are recorded in no artifact; and the BATCH-005 coordination artifacts remain
      absent. None of these is a mathematical result and none may be closed by
      fabricating a hash.
    - >-
      This decision is not official until the TASK-20260727-018 ledger commit is
      made and the dispatcher's post-commit verifier accepts the receipt. The
      authoring session had no shell and no git access; every commit identifier it
      records was transcribed from independent sessions that verified it against
      git, and none was invented.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No KN-FIND is warranted and none is created. The promotion rule fires on a
      `support` or `reject_scoped` decision backed by `replicated` or `strong`
      evidence; this decision is `weaken` and EV-STR-003 is `preliminary` by its
      own declared basis (four instances, one realisation per cell, one host and
      one stack). More substantively, there is no durable research boundary to
      promote: R1 is an evidence-integrity fact about this repository rather than
      about ECDLP; R2 is a bounded toy-scale negative on four instances that
      closes exactly those instances; R3 is an absence; the instrument question is
      UNADJUDICATED; and the one reproducible mathematical effect - the factor
      r = 3 in relation collection (R5) - is already the published specialized
      baseline, so recording it as an internal finding would add nothing to the
      corpus. Routing the open question to a KN-OPEN entry was considered and
      deferred rather than done: this card declares no path under knowledge/, and
      adding one would require a queue amendment before the commit for a record
      whose content would restate UC-1 of EV-STR-003 without adding to it. If the
      successor experiment settles the instrument question, that is the point at
      which a KN-FIND or KN-OPEN becomes warranted.

  next_actions:
    - >-
      ONE ACTION. On explicit user authorization of an EIGHTH batch -
      campaign_budget.maximum_batches = 7 is now CONSUMED, so no further batch may
      be opened without it - freeze and dispatch EXP-STR-004 under a NEW
      experiment id, with a derivation note written and snapshot-committed BEFORE
      execution, carrying two arms and nothing else: arm A-prime, the as-committed
      phi arm with the line-303/304 dedup and zero-filter disabled so shifted rows
      are appended unconditionally, which makes the sharp pass/fail prediction
      alpha = 0 exactly at every instance with B mod 3 == 0 and alpha equal to the
      number of rows touching the truncated tail otherwise; and arm E-prime, a
      phi-free closure that emits each sigma-orbit once and never suppresses,
      which isolates closure convention from endomorphism content and converts the
      diagnosis of why arm E diverged into evidence. Both arms must control the
      nuisance variable that F1 fired on by matching base-row budgets and
      reporting alpha conditional on suppression count, must record sha256 of the
      factor base and of the final row list per cell so an alpha is checkable
      without re-execution, and must be evaluated only against criteria frozen
      before execution. This experiment is the replication that a `weaken` on an
      `empirical_only` basis requires before any transition of H-STR-002 in either
      direction; it does NOT gate the BATCH-007 archive, because this decision
      rests on grounds independent of the instrument question.

  decided_by: coordinator
  decided_at: "2026-07-27T23:30:00-07:00"
  archived_by: TASK-20260727-018
