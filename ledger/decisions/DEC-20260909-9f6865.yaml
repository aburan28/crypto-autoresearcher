    "implementation_changes": {
      "order": {
        "id": "fields_first_custom_grevlex_v1",
        "mathematical_effect": "Exact generator permutation only; the generated ideal and finite root/covariance question remain unchanged. No measured speedup is asserted.",
        "canonical_layout": "Keep build_ideal and rebuild_ideal output and serialized equation records in E(3 Semaev),D(3*m domain),F(m*d field) order. Preserve all covariance positional indices and exact lex-solver input.",
        "ordered_view": "Only custom grevlex calls receive F then E then D. Within every block preserve original order. With d=V.dimension and f=3+3*m, permutation new-to-canonical is [f,...,f+m*d-1,0,...,f-1]; record its inverse. Retain zero and duplicate generator positions.",
        "validation": "Independently validate permutation length/bijection, coefficient-for-coefficient equality against canonical generators and inverse recovery. Never drop or pre-reduce generators, change monomial/variable order, add Buchberger criteria, interreduce the basis, prune pairs or change oldest-applicable reduction.",
        "driver_location": "Pass the separate ordered view at the calibration solve closure custom buchberger call. All field/curve/domain/root/lift/covariance/lex construction is unchanged.",
        "checker_location": "Keep canonical rebuild_ideal/check_covariance and lex inputs unchanged; independently derive the same ordered view for independent_buchberger, never trust only producer permutation metadata.",
        "trace_metadata": "Preserve every existing Buchberger record and full polynomial/multiplier/witness content. Initial_basis.generator denotes insertion-position index in the declared ordered view; calibration.grevlex records order_id, permutation, inverse and canonical-generator digest so canonical identity is recoverable.",
        "cache": "Keep equation_key as digest of the unchanged canonical ideal record. Calibration cache lookup key is (order_id,equation_key); keep exact old LRU capacity65536 and +/-R identical-equation reuse semantics. Cached final result retains its original derivation trace count/bytes, while each outer calibration record separately records trace_records_emitted=0 and trace_bytes_emitted=0 on a hit.",
        "cost_boundary": "This order can change pair indices, basis evolution, complete trace, operational d_solve and costs. None is a theoretical regularity/first-fall claim. Any comparative cost statement requires complete matched coverage and separately disclosed runtime/implementation differences."
      },
      "checker_memory": {
        "id": "exact_streamed_trace_comparison_v1",
        "separate_change": true,
        "justification": "The predecessor checker retains both producer trace and independently generated trace as lists for a calibration target. Streaming removes whole-trace retention while preserving exact comparison; it is a separately declared memory/verification-order change, not an effect attributable to generator order.",
        "producer_trace": "Continue writing every complete Buchberger record in order to the deterministic gzip stream. No dropping, sampling, digest-only substitution or compression-policy weakening. Add per-derivation emitted record/byte counts to final grevlex metadata and per-target actual emitted counts to calibration wrapper metadata.",
        "cursor": "Extend the canonical Cursor to retain only one pending raw LF-terminated decompressed line and its parsed record. Preserve canonical JSON byte check, gzip/stream integrity and line counting. Expose a consume operation that returns this exact raw line/record and clears both pending slots. Existing nontrace consumers keep their semantics.",
        "cache_miss_algorithm": "Determine cache hit/miss from (order_id,equation_key) BEFORE consuming a trace. On a miss, independently run the declared Buchberger arithmetic using an on_emit callback or iterator. For every expected record, consume exactly one actual buchberger record from the same cell/target, require exact canonical raw UTF8+LF byte equality and complete parsed-record equality, and increment expected/consumed record and byte counts. Retain only current actual/expected records, counters and the mathematical state needed for the final basis.",
        "boundary_check": "After independent emission ends, the next unread record must be calibration, not another buchberger or EOF. Then parse calibration, compare complete final grevlex basis/degree/order/permutation/count/byte metadata, perform the unchanged exact lex and finite-root checks, and compare all remaining target identities/lifts. An early calibration/EOF is a missing trace; an extra buchberger is surplus. No scanning past mismatches to resynchronize.",
        "cache_hit_algorithm": "A cache hit must have NO intervening buchberger record. The next record is calibration with exact cached final result, same order/equation key, cache_hit true, emitted record/byte counts0 and full per-target root/lift checks. A hit neither reruns independent Buchberger nor accepts a duplicated trace. Preserve eviction behavior and distinguish cached derivation totals from actual per-target emitted counts.",
        "memory_bound": "No producer or independent whole-trace list, generator materialization, trace-containing cache or equivalent accumulation. At most one pending actual and one expected record, their transient parsed/serialized representations, counters and necessary basis/ideal/cache state. This is a bound on retained trace records, not a guarantee that all other mathematics or a single huge record fits8GiB. Existing memory guard remains unchanged and failures are explicit.",
        "comparison_order": "Independent grevlex generation occurs while consuming its trace; the later lex/final-result comparisons retain identical mathematical requirements. This checker execution-order change and its costs must be identified separately from the driver generator-order change.",
        "fixed_nonstage_tests": [
          "Use a fixed nonstage F2 polynomial-system trace with at least three distinct records. Compare legacy list comparison and new streamed comparison on the SAME declared order, requiring identical full record bytes, counts, final basis/normal forms and complete finite roots.",
          "Reject canonical-content corruption at first, middle and last expected record, wrong cell/target context, adjacent-record swap and duplication.",
          "Reject missing first/middle/last record, surplus record, premature calibration, unexpected record type, missing calibration boundary, EOF and a truncated final line.",
          "Reject noncanonical JSON bytes even when parsed JSON values match; reject truncated/corrupt gzip framing or extra trailing stream records.",
          "Verify cache miss followed by equivalent +/-R cache hit: no emitted trace or recomputation on hit, exact cached final result and zero emitted-count metadata; reject a duplicated trace at a hit, wrong order key or changed cached result.",
          "Check unchanged canonical ideal/covariance records, variable order, both-direction generator membership and complete roots on fixed nonstage fixtures. No q8/n3 stage0 constructors or target measurements during preparation."
        ],
        "interpretation": "Passing preparation tests establishes bounded implementation properties only. Any future total run/checker improvement reflects BOTH declared changes unless a separately admitted isolating comparison exists.",
