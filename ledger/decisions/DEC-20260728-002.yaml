coordinator_decision:
  id: DEC-20260728-002
  id_allocation_note: >-
    Verified free across the UNION of both ledger namespaces per the binding allocation rule in
    DEC-20260727-005 rationale item 10. Root ledger/*.yaml holds no DEC-20260728-* record; typed
    ledger/decisions/ holds no DEC-20260728-* record; a repository-wide search for the string
    DEC-20260728 returns no match. Allocated strictly above the union maximum on a new date. The
    executing session must reconfirm at HEAD before staging and STOP rather than shift the
    allocation if it is taken.

  context: >-
    THIS RECORD EXISTS BECAUSE ITS ABSENCE IS THE DEFECT BATCH-009 DOCUMENTED. origin/main
    executed EXP-GGM-001 into nine run directories, recorded evidence, moved a hypothesis to
    supported and promoted a knowledge finding, while experiments/EXP-GGM-001/specification.yaml
    still read status review_required with approved_by null and NO APPROVE DECISION EXISTED
    ANYWHERE IN ledger/decisions. ESC-20260727-001 section A ruled that archive not a valid
    official state transition on exactly that ground; DEC-20260727-007 recorded it as a process
    finding independent of the substantive one. The AGENTS.md experiment lifecycle is
    draft -> review_required -> approved -> running, and "approved" is a Coordinator act that
    leaves a record or it did not happen. EXP-RT1476-001 version 1 is therefore APPROVED HERE,
    EXPLICITLY, WITH approved_by SET, BEFORE ANY EXECUTION TASK IS DISPATCHED. No run may begin
    until this decision is committed and its commit verified.
  decision: approve
  identifier_renumber_note: >-
    IDENTIFIER REPAIR APPLIED UNDER CORR-20260728-001, AFTER THIS DECISION WAS PUBLISHED AT
    e1847fc8. EXP-RT1476-001 and H-RT1476-001 were malformed - tools/validate_ledger.py requires
    a letters-only area code and RT1476 has digits - so the experiment never registered and this
    decision's target_ids dangled. target_ids and approval.experiment_id are edited to the
    renumbered ids. approval.specification_path is DELIBERATELY UNCHANGED: the storage directory
    experiments/EXP-RT1476-001/ keeps its published name, because the validator never compares a
    directory name to an experiment id while a rename would move 189 hash-bound run files and
    break the path lists in two committed archive receipts. THE APPROVAL ITSELF IS UNCHANGED AND
    IS NOT RE-GRANTED: version 1 of the same frozen contract, approved 2026-07-28, still
    authorizes no further execution.
  target_ids:
    - EXP-SUBRES-001
    - H-SUBRES-001
    - TASK-20260728-001

  approval:
    experiment_id: EXP-SUBRES-001
    experiment_id_as_published: EXP-RT1476-001
    version: 1
    specification_path: experiments/EXP-RT1476-001/specification.yaml
    status_transition: 'review_required -> approved'
    approved_by: coordinator
    approved_at: '2026-07-28'
    execution_authorized_for: 'TASK-20260728-001 only, at the parameters, controls, budget and stopping rules frozen in version 1'
    execution_not_authorized_for: >-
      Any other experiment, any other version of this experiment, any parameter outside the
      frozen set, any field size above 24 bits, EXP-GGM-001 version 1 (forbidden by
      DEC-20260727-007), and any live key, deployed system or private target.
    precondition_binding: >-
      Execution may begin only after the BATCH-010 opening snapshot commit carrying this
      decision and the frozen specification has been made on parent e77ca6a4 and ACCEPTED by
      the post-commit verifier. An experiment approved by an uncommitted decision is an
      experiment approved by nothing.

  rationale:
    - >-
      WHAT IS BEING APPROVED, IN ONE SENTENCE. A meter: a bounded measurement of two exponents -
      the growth exponent of the backward 3-sum state of the serial-S3 2|3 split of S5, and the
      growth exponent of counted GF(p) operations on the certified-relation subset only - on
      randomly sampled ordinary prime-order curves over F_p for p in {1009, 65521, 16769023},
      three seeds each, with both controls the frozen contract requires.
    - >-
      THE PROTOCOL IS COMPLETE UNDER agents/coordinator.md RESPONSIBILITY 4 AND AGENTS.md CORE
      RULE 3. It defines controls (CTRL-POS planted-low-degree factor base, CTRL-NEG random
      dense chain), metrics with the SUCCESS-subset restriction stated in the metric definition
      itself, budgets (7200 s total, 900 s per run, 4 GB, 27 runs), four stopping rules, seven
      invalidation rules, a success criterion, a falsification criterion, a pre-registered
      three-way landing, and the required artifacts - all fixed BEFORE execution and all
      committed in the same archive as this approval.
    - >-
      THE INHERITED CONTRACT'S INTERNAL CONTRADICTION IS RULED NOW, NOT LATER. Contract A1
      writes one symbol beta for two different exponents and its criteria overlap: "beta < 3/2
      (ideally < 0.3)" as success against "beta >= 0.3 at any size" as falsification makes the
      band [0.3, 1.5) simultaneously a success and a falsification. The specification separates
      beta_deg (gate 0.3, the RT-1476-SUBRES-A1 gate of record) from beta_ops (gate 3/2, the
      red team's quantity), gives each its own threshold, and pre-registers the intermediate
      band as its own reportable outcome. This is done BEFORE any data exists and it makes the
      gate strictly HARDER, since the alpha < 3/2 reading now requires both. It is therefore a
      pre-registration clarification, not a criterion change; had it been done after seeing the
      numbers it would have required a versioned protocol_amendment and this decision says so
      in advance so that no later session can mistake one for the other.
    - >-
      THE RED-TEAM AMENDMENT IS BINDING AND IS BUILT INTO THE METRIC, NOT BOLTED ON. The fit is
      on ops_success - operations spent on queries that produced an INDEPENDENTLY VERIFIED
      relation certificate - because early abort helps only the non-relation fraction while the
      alpha claim must hold on the relation-producing fraction. The aggregate counter ops_all is
      also reported, so the excluded abort speedup is auditable rather than merely excluded.
      This was the objection that would otherwise have sunk the result after the fact.
    - >-
      THE ANTI-TAUTOLOGY RULE IS THE DIRECT LESSON OF BATCH-009 AND IS MADE BINDING HERE. No
      threshold, expected value or verdict may be visible to the measuring code path; the module
      emits measurements only, every per-run gate value is written into raw-result.json, and the
      threshold comparison happens afterwards in analysis and again independently in the
      Validator's own recomputation from the raw files. EXP-GGM-001's reported 4/4 control gate
      compared two string literals held in the same source file, returned 4/4 on every possible
      execution, and appeared in no run artifact. That failure mode is designed out, not merely
      warned against.
    - >-
      THE POSITIVE CONTROL IS A REAL, SHARP, BIDIRECTIONAL GATE. Planting the factor base as the
      x-coordinates of {[i]P : i = 1..L} on a prime-order curve makes the reachable 3-sum index
      set an interval of size at most 6L - 3, so the planted backward state is Theta(q^{1/5}) -
      exponent about 0.2 against the generic 0.6, a threefold exponent drop that is known to be
      there. If the meter reports beta_deg >= 0.3 on that control, the meter cannot see a
      collapse of that magnitude and therefore CANNOT CERTIFY THE ABSENCE OF ONE on the main arm
      either. INVALID-4 makes that consequence binding in BOTH directions, which is what stops
      an adverse main-arm reading from being accepted on a broken instrument.
    - >-
      THE ENVIRONMENT DEVIATION IS RECORDED, NOT HIDDEN, AND ITS CONSEQUENCE IS SPLIT METRIC BY
      METRIC. Sage is not available; the contract's .sage reproduction command cannot be run;
      the port is Python 3 with sympy and numpy over GF(p) on the in-repo harness. SURVIVING
      METRICS: backward_state_support_size (exact, by enumeration over at most 21952 triples, no
      CAS at all), deg_u of the backward eliminant (a property of the system over GF(p), not of
      the CAS), PRS step count (intrinsic to the input pair conditional on a declared PRS
      variant), and ops_success (implementation-independent up to the algorithm IF AND ONLY IF it
      is a real instrumented integer over a hand-written GF(p) layer). NOT SURVIVING: WALL-CLOCK,
      which is not comparable to a Sage run and may never fit beta_ops or support any cost claim;
      and the COLLINS/BROWN COEFFICIENT BIT-SIZE CHECK, which is vacuous over GF(p) where every
      coefficient is bounded by ceil(log2 p) bits by construction - it is recorded
      not_applicable_over_GF_p with a declared substitute that carries no conclusion, and the
      contract's "coefficient blow-up" failure mode is recorded UNTESTED rather than absent.
    - >-
      THE PRIOR IS ADVERSE AND IS IN THE SPECIFICATION. Red team: beta_ops -> 3/2 from above.
      Generic count: beta_deg = 0.6, twice the gate. This experiment is expected to fail. It is
      approved because a gate held open on a prior for 29+ runs is worse than a gate closed on a
      measurement, and because the adverse prior is written down in advance so that an adverse
      result cannot later be re-described as a surprise, an artifact of the port, or a reason to
      relax the criterion.
    - >-
      WHAT THIS APPROVAL DOES NOT APPROVE. It does not approve a claim, an interpretation, a
      status change, or a successor experiment. It authorizes ONE bounded execution of ONE frozen
      protocol by ONE task. The evidence record, the strength, the claim tier and any hypothesis
      transition are separate acts on separate records, made only after TASK-20260728-003's
      independent validation, and they are constrained in advance: maximum claim tier toy,
      maximum strength preliminary on this run set, no move to supported, and no reject_scoped on
      a single unreplicated empirical-only run set.
    - >-
      THE MISSING DESIGN REVIEW IS NAMED AS A WEAKNESS RATHER THAN ARGUED AWAY. No independent
      pre-execution review of this specification exists. BATCH-006 spent a whole batch on two
      such reviews of EXP-GGM-001 and it still never ran; BATCH-009 spent another on paper. The
      trade taken here - approve a meter now, review it independently in the same batch before
      any evidence record - is a judgement, is recorded as one in the specification's
      review_history, and a later reviewer is entitled to disagree with it. The compensating
      control is that TASK-20260728-003 must return a DESIGN-adequacy finding as well as an
      integrity finding, and that no evidence record may be written before it does.

  evidence_refs:
    - experiments/EXP-RT1476-001/specification.yaml
    - ledger/hypotheses/H-RT1476-001.yaml
    - inputs/idea_generation_20260718_batch2.md
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/redteam/TASK-20260727-003/barrier_verdict.yaml
    - ledger/decisions/DEC-20260727-007.yaml
    - docs/claims-and-verification.md
  evidence_note: >-
    These are the DESIGN inputs to an approval, not evidence about the hypothesis. No run set,
    no measurement and no experiment result is cited, because none exists: EXP-RT1476-001 has
    never executed. inputs/idea_generation_20260718_batch2.md is cited at lines 1286-1319 for the
    frozen contract and 1388-1397 for the red-team amendment. The BATCH-009 barrier verdict is
    cited only for its explicit statement that RT-1476-SUBRES-A1 is neither closed nor opened by
    it; it is NOT support for H-RT1476-001. DEC-20260727-007 is cited for the process defect this
    decision exists to avoid repeating.

  limitations:
    - >-
      NOTHING IN THIS DECISION IS EVIDENCE FOR OR AGAINST ECDLP HARDNESS, prime-field ECDLP,
      index calculus, Semaev decomposition, or KN-OPEN-001. Approving an experiment asserts
      nothing about its outcome.
    - >-
      MAXIMUM CLAIM TIER toy, MECHANICALLY, from a maximum field size of 24 bits
      (16769023 < 2^24). Unreachable above by this protocol at any outcome. A 24-bit field is
      not a small version of a 256-bit curve for these purposes; it is a different regime in
      which the factor base has 28 elements and the entire backward state is enumerable.
    - >-
      THE FIT HAS THREE POINTS spanning log q from about 6.9 to about 16.6. Three points cannot
      distinguish a power law from a logarithmic correction or a slowly turning curve, and no
      confidence interval derived from them may be reported as if it were one. Every fitted
      slope must be accompanied by its pairwise slopes and by the raw counts.
    - >-
      THE APPROVED PROTOCOL MAY STILL PROVE UNIMPLEMENTABLE. The eliminant/PRS leg at L = 28 may
      blow up in sympy. That is why backward_state_support_size, which needs no CAS at all, is a
      primary metric: the experiment can still return its most robust number if the CAS leg times
      out. A timeout there is infrastructure signal under AGENTS.md rule 5 and is never a
      negative mathematical result. If the protocol cannot be implemented as frozen, STOP-4
      requires the Executor to stop and report the obstruction rather than improvise a different
      measurement under this experiment id.
    - >-
      NO INDEPENDENT PRE-EXECUTION DESIGN REVIEW EXISTS. Named above and in the specification's
      review_history as a deliberate, contestable trade.
    - >-
      APPROVAL IS NOT DURABLE UNTIL COMMITTED. This authoring session has no shell and no clock;
      it ran no git command, computed no SHA-256, made no commit and staged nothing, and it
      asserts that no commit happened. Until the post-commit verifier accepts the BATCH-010
      opening commit on parent e77ca6a4, EXP-RT1476-001 is not approved in any durable sense and
      TASK-20260728-001 must not be dispatched.

  next_actions:
    - >-
      Commit this decision together with experiments/EXP-RT1476-001/specification.yaml,
      ledger/hypotheses/H-RT1476-001.yaml, ledger/decisions/DEC-20260728-001.yaml, the four
      TASK-20260728 handoffs and the BATCH-010 batch record and queue, as the single BATCH-010
      opening snapshot on parent e77ca6a4; verify it; and only then dispatch TASK-20260728-001.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is not an evidence-review decision. It approves a protocol; it reviews no run set,
      cites no measurement, and produces no durable claim about ECDLP. There is nothing to
      promote because nothing has been observed. A KN-FIND becomes available only if a later
      evidence-review decision on this experiment reaches support or reject_scoped on evidence of
      strength replicated or strong - and this run set is capped at preliminary, so that gate
      cannot be reached by BATCH-010 alone.

  decided_by: coordinator
  decided_at: '2026-07-28'
  decided_at_precision: >-
    Date only. This authoring session has no clock access and does not fabricate a wall-clock
    time. The committing session may record the exact commit time in the archive receipt.
