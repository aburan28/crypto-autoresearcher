  verification_limits:
  - >-
    NO SHELL WAS AVAILABLE TO THE AUTHORING SESSION. It ran no git command: no commit
    was resolved, no parent verified, no branch compared against origin/main, no
    post-commit verifier invoked, and no file hashed. Every hash quoted in this record
    is DECLARED by a committed receipt and was not recomputed by that session - WITH
    ONE EXPLICIT EXCEPTION, CD-1, RECORDED IN THE NEXT BULLET.
  - >-
    CD-1'S VERIFICATION LIMIT IS DISCHARGED, AND BY A DIFFERENT SESSION. After this
    record was drafted, the DISPATCHING session - which does have a shell - ran
    `shasum -a 256 ledger/decisions/DEC-20260731-014.yaml` and
    `git log --oneline --follow -- ledger/decisions/DEC-20260731-014.yaml`, and
    supplied the results now recorded in
    CD-1.mechanism_verified_by_dispatching_session. THE HASH MISMATCH AND THE
    THREE-LANE COLLISION ARE THEREFORE VERIFIED FACTS, NOT INFERENCES, and CD-1's
    earlier hedge is superseded in place by that subfield. PROVENANCE IS STATED
    PRECISELY BECAUSE IT MATTERS: the authoring session did not run these commands and
    could not have; it records them as established by the dispatching session, which
    is a division of labour, not an independent replication. Neither session re-ran the
    other's check, and no third party has confirmed either output. Everything else in
    this record remains bounded by the bullet above.
  - >-
    The fork base origin/main = 3cc95d80d, the claim that GOAL-ECDLP-001 is driven
    from a branch with open PR #297, and the commit dates b1dfd9865 / a913de1b2 for
    the DREG BATCH-004 and BATCH-005 directories were reported to this session by its
    dispatcher and are NOT independently verified here. They are recorded as reported,
    and no conclusion above rests on them alone.
  - >-
