coordinator_decision:
  id: DEC-20260810-2f92d8
  decided_at: '2026-08-10'
  decided_by: coordinator
  goal_id: GOAL-PATH-001
  batch_id: BATCH-002
  question_ids: [RQ-DREG-001, RQ-ICEX-001, RQ-SDEG-001, RQ-RELN-001, RQ-ECDLP-002]

  decision: supersede
  decision_note: >-
    supersede is the template vocabulary token. WHAT IS SUPERSEDED IS A GOAL HEAD,
    NOT A RESULT. Two defects in GOAL-PATH-001 are repaired here: (1) its
    batch_checkpoints list ends at BATCH-001 although BATCH-002 was decided on
    2026-08-02 by DEC-20260802-505759 and its authorized child checkpoint was
    verified by DEC-20260802-a51c82, and (2) its next_action still poses the
    three-way choice that DEC-20260802-505759 already consumed, and mis-attributes
    its own trigger evidence. The prioritization content below re-makes the choice
    now that DEC-20260802-505759's stated reopening condition is met. NOTHING IS
    APPROVED FOR EXECUTION BY THIS RECORD: no experiment, no run, no measurement
    batch, and no compute. The only work it authorizes is one coordinator-only,
    zero-run reconciliation task, TASK-20260810-9e7f4c.

  target_ids:
  - GOAL-PATH-001
  - GOAL-DREG-001
  - TASK-20260810-9e7f4c

  context: >-
    GOAL-PATH-001's next_action has read, since 2026-07-31, as an open three-way
    choice - expand the DREG ladder under CTRL-B, admit the ECDLP executable seal,
    or prioritize other Tier-1 measurement. DEC-20260802-505759 (goal_id
    GOAL-PATH-001, batch_id BATCH-002) made that choice on 2026-08-02, selecting
    prioritize_other_tier1_measurement and authorizing the GOAL-MONO-001 m=3 census
    EXP-MONO-4b50b6 as GOAL-MONO-001 BATCH-003. Its own next_action states that
    PATH's next prioritization choice "reopens only after that checkpoint is
    verified". That checkpoint is verified: DEC-20260802-a51c82 dispositioned the
    census (decision support, evidence EV-MONO-a0a89c), and
    ledger/goals/GOAL-MONO-001/checkpoints/BATCH-003.yaml records the closed batch.
    Yet GOAL-PATH-001 carries no BATCH-002 checkpoint and its head still reads as if
    the choice were unmade. This record reconciles the head and re-makes the choice.
    THIS IS A COORDINATOR-ONLY SESSION. No executor, validator, red-team or
    idea-generator ran, and none of the work below is described as executed.

  the_reopened_choice:
    selected: expand_dreg_ladder_under_ctrl_b
    selected_label: option_a
    concretely: >-
      GOAL-DREG-001's on-lattice ladder under the admitted CTRL-B instrument is
      designated the DIRECTION of the next GOAL-PATH-001 batch. It is NOT opened
      here. The single authorized step is TASK-20260810-9e7f4c, which reconciles
      GOAL-DREG-001's mutable head against its committed BATCH-004 and BATCH-005
      archives and against its own remaining campaign budget, and returns a
      recommendation. A DREG measurement batch requires a LATER Coordinator decision
      carrying non-null wall-clock and memory budgets. Nothing about d_reg,
      deficit_genuine, ECDLP hardness, or any exponent is asserted or predicted here
      in either direction.
    why_a_and_not_the_other_two:
    - id: W-1
      text: >-
        IT IS THE ONLY OPTION A PATH PRIORITIZATION CAN ACT ON, WHICH IS EXACTLY
        WHAT DEC-20260802-505759 PREDICTED WHEN IT RESERVED (a) AS "THE STANDING
        ALTERNATIVE FOR THE NEXT PATH BATCH". Option (b) is forbidden by the target
        goal's own committed authorization; option (c) has no reachable target left.
        See what_is_not_chosen_and_why for each, with its rule-9 fields.
    - id: W-2
      text: >-
        DREG IS THE CHILD GOAL NEAREST A COMMITTED SCOPED CLOSURE, WHICH IS PATH'S
        SECOND COMPLETION CRITERION ARM. GOAL-DREG-001's criterion asks for a
        committed Coordinator decision on H-DREG-001 (support, weaken, or
        reject_scoped) backed by full-column-rank d_reg or gap(n) measurements across
        the n-ladder with the semi-regular null control. Its committed checkpoints
        already record two batch decisions at disposition weaken, and EV-DREG-008
        records an admitted CTRL-B structural measurement at n=12 D=6. The remaining
        distance to a committed scoped closure is smaller here than for any other
        Tier 0-2 child.
    - id: W-3
      text: >-
        ITS INSTRUMENT IS ALREADY FROZEN AND ALREADY REVIEWED, so the direction
        consumes no new protocol-design capacity. DEC-20260725-026 recorded an
        independent red-team PASS (RT-20260725-703) on the repaired CTRL-B protocol
        and explicitly admitted "a later executor batch to run chunked block-m4ri
        CTRL-B under a fresh write_scope"; EV-DREG-008 records the first such cell as
        admitted with an independent red-team PASS (RT-20260731-013).
    - id: W-4
      text: >-
        THE HONEST COUNTERWEIGHT, RECORDED WITH THE CHOICE RATHER THAN AFTER IT. This
        direction is a NEGATIVE-CONTROL lane, not an exponent-moving one.
        GOAL-DREG-001's own BATCH-001 checkpoint records a crypto-scale generic
        baseline of t=7, n=161 giving Grobner 2^1194 against rho 2^80.5, and its
        BATCH-002 checkpoint records the measured direction as wrong-sign,
        "reinforces the negative control; opens no attack". Under
        docs/target-result-profile.md this lane targets no exponent. It is selected
        because closing it with scoped evidence is what PATH can actually finish,
        NOT because it is the most ambitious thing on the roadmap. That tension is
        recorded, not resolved, and it is a reason to keep the lane bounded.
    - id: W-5
      text: >-
        IT IS THE CHEAPEST OPTION TO START AND THE EASIEST TO STOP. The authorized
        first step spends zero compute and touches no experiment: it reads committed
        records and returns a recommendation. If that reconciliation shows the
        remaining budget cannot carry a decision-grade ladder increment, the correct
        output is a scoped criterion amendment or a budget request, not a run.

  what_is_not_chosen_and_why:
    ecdlp_executable_seal:
      label: option_b
      status: NOT_CHOSEN_NOT_ABANDONED
      evidence: >-
        GOAL-ECDLP-001 (ledger/goals/GOAL-ECDLP-001/goal.yaml) is status active at
        current_batch_id BATCH-ae8019 with latest_verified_commit
        80f2d3f2304ee090185705c8fd87007ec6e5d356. Its next_action directs a
        seven-task design-repair chain closing five blocking findings
        (REV-GAP-REPRESENTATION-007, REV-CANONICAL-SCHEDULE-008,
        REV-RESOURCE-CONSUMER-009, REV-PACKAGE-FINALIZATION-010,
        REV-MUTATION-LAYER-011) under DEC-20260809-d5ff80, and ends: "No
        implementation, execution, run, evidence promotion, ECDLP claim, status
        transition, or goal completion is authorized."
      why_not: >-
        ADMITTING THE SEAL WOULD CONTRADICT THE TARGET GOAL'S OWN COMMITTED
        AUTHORIZATION, and a PATH prioritization cannot overrule it - the blocker is
        a design-readiness review verdict, not a scheduling preference. Separately,
        DEC-20260802-505759 already recorded that the campaign is driven from another
        worktree; the briefing to this session states it is currently driven from a
        different branch with open PR #297, WHICH THIS SESSION COULD NOT VERIFY (see
        verification_limits). Either ground alone is sufficient; the first is
        established from committed records here.
      budget: >-
        Not spent and not reserved. No GOAL-PATH-001 batch, wall clock, or memory is
        committed to this option by this decision.
      test_boundary: >-
        Untouched. No ECDLP design, implementation, run, or claim is advanced,
        weakened, or evaluated here, and no statement is made about whether the five
        blocking findings are closable.
      remaining_uncertainty: >-
        Whether the design-repair chain closes the five findings, and whether the
        seal is admissible at all, is entirely open and is GOAL-ECDLP-001's to
        determine. Nothing here predicts either outcome.
      revisit_condition: >-
        Revisit when GOAL-ECDLP-001 commits a decision that lifts its own
        no-implementation bar - concretely, a committed Coordinator decision
        recording experiment_design_approved true for the successor design, together
        with a merged archive reachable from main. PATH re-scores option (b) against
        (a) at its next prioritization batch after that, without prejudice.
    prioritize_other_tier1_measurement:
      label: option_c
      status: NOT_CHOSEN_NO_REACHABLE_TARGET_REMAINS
      evidence: >-
        This is the option CONSUMED on 2026-08-02 by DEC-20260802-505759, and the
        target it selected is now spent. GOAL-MONO-001 is status paused with
        paused_because "CAMPAIGN BUDGET EXHAUSTED, not blocked. maximum_batches is 3
        and BATCH-003 is the third", and its next_action is a re-scoping question
        that explicitly forbids commissioning an m >= 4 census before that question
        is answered. GOAL-SDEG-001's next_action defers activation "until ECDLP
        verifier-hash and precommit residuals clear under a separate ledger
        authorization; no runs now", and EV-SDEG-001 records the residuals as
        hard-gated with unresolved_confounds naming "ECDLP
        independent_verifier_artifact_sha256 and related residuals". GOAL-RELN-001's
        next_action defers "until activation residuals clear AND PATH prioritizes an
        admitted RELN executor batch".
      why_not: >-
        NONE OF THE THREE TIER-1/TIER-2 TARGETS IS UNBLOCKED BY A PATH PRIORITIZATION
        ALONE. MONO needs a fresh budget grant AND an answer to its own re-scoping
        question, and DEC-20260802-a51c82 N-1 states the instrument question that
        must be answered first. SDEG's gate is an artifact set owned by
        GOAL-ECDLP-001. RELN's gate is a CONJUNCTION - one conjunct (PATH prioritizes
        an admitted RELN executor batch) is in PATH's authority, the other
        (activation residuals) is not - so a PATH prioritization is necessary but not
        sufficient for RELN, and issuing it alone would produce an authorized batch
        that still cannot lawfully run.
      budget: >-
        Not spent. GOAL-MONO-001 has zero batches remaining under maximum_batches 3.
        GOAL-SDEG-001 and GOAL-ICEX-001 carry maximum_batches null (cap removed
        2026-08-02 on explicit user direction, recorded on each goal); GOAL-RELN-001
        carries maximum_batches 3 with current_batch_id BATCH-001. No batch of any
        of them is opened or reserved here.
      test_boundary: >-
        Untouched. No monodromy, solving-degree, or relation-rate quantity is
        measured, predicted, or re-read. DEC-20260802-a51c82's scoped readings stand
        exactly as committed, including that the m=3 slice is the DEGENERATE slice
        and that nothing about m >= 4 is closed.
      remaining_uncertainty: >-
        Large and explicitly open. Whether a statistic exists that discriminates ON
        the factor-base sublocus (DEC-20260802-a51c82 N-1) is unknown; whether the
        ECDLP-owned activation residuals will clear is unknown; whether RELN's
        P(decomp) audit is affordable once unblocked is unknown.
      revisit_condition: >-
        Three distinct triggers, any one of which reopens option (c) at the next PATH
        prioritization batch. (i) MONO: a committed answer to DEC-20260802-a51c82 N-1
        identifying a sublocus-discriminating statistic, or a scoped no-go for the
        relation-rate half of KN-OPEN-009 - either of which then justifies a fresh
        budget grant request. (ii) SDEG: a committed GOAL-ECDLP-001 record setting the
        verifier-hash / fixtures / sealed-schedule residuals that EV-SDEG-001 lists as
        unset. (iii) RELN: the same activation-residual clearance, at which point
        PATH's own conjunct can be satisfied immediately, since RELN's protocol
        already carries an independent red-team PASS (DEC-20260725-017).

  structural_finding:
    id: SF-1
    statement: >-
      PATH'S PRIMARY COMPLETION ROUTE CURRENTLY HAS A SINGLE UPSTREAM GATE OUTSIDE
      PATH'S AUTHORITY. GOAL-PATH-001's first completion criterion routes through
      GOAL-ICEX-001. GOAL-ICEX-001 will not execute "until charged SDEG/MONO/RELN
      measurement packages exist", and EV-ICEX-001's unresolved_confounds state that
      activation is "blocked until measured G4-G6 feed packages, sealed schedules,
      verifier pin, and ECDLP residuals / separate ledger auth clear". Of those three
      feeds, SDEG is gated on an artifact set owned by GOAL-ECDLP-001 and RELN is
      gated on activation residuals it does not itself own. GOAL-ECDLP-001 is not a
      child PATH can unblock by prioritizing it: it is in a design-repair loop under
      its own committed decision DEC-20260809-d5ff80, which forbids implementation
      and execution. THEREFORE A PATH PRIORITIZATION DECISION - INCLUDING THIS ONE -
      CANNOT MOVE THE PRIMARY ROUTE AT ALL, AND SAYING SO IS THE MOST USEFUL CONTENT
      OF THIS RECORD.
    consequence: >-
      PATH's actionable progress is on its SECOND completion-criterion arm: committed
      scoped closures/decisions for Tier 0-2 children. Option (a) is selected on that
      basis. This is a statement about authority and dependency structure, NOT a
      claim that the primary route is dead, and NOT a closure of GOAL-ICEX-001.
    what_would_falsify_it: >-
      Any committed record showing (i) an SDEG or RELN measurement package that does
      not depend on the ECDLP-owned artifact set, or (ii) a GOAL-ECDLP-001 decision
      setting those residuals, or (iii) an ICEX-native path to its completion
      criterion that does not require all three feeds. Any of these makes the primary
      route movable again and should be recorded as superseding SF-1.
    scope_caveats:
    - >-
      RELN's own head says "activation residuals" WITHOUT naming GOAL-ECDLP-001 as
      the owner. The identification of that set with the ECDLP-owned one rests on
      DEC-20260725-017's next_action, which names "ECDLP activation residuals" as the
      PATH-level item, and on EV-SDEG-001, which names them explicitly for SDEG. IT IS
      NOT STATED WITH EQUAL EXPLICITNESS IN RELN'S OWN RECORD, and is recorded here as
      an inference from those two records rather than as RELN's own text.
    - >-
      SF-1 describes the state of committed records read in this worktree on
      2026-08-10 at fork base origin/main = 3cc95d80d (base as reported to this
      session; not independently verified here). It is not a permanent property of
      the goal graph.

  citation_and_reconciliation_defects_found:
  - id: CD-1
    severity: blocking_for_any_dreg_batch
    statement: >-
      GOAL-PATH-001's superseded next_action attributes the DREG CTRL-B cell PASS to
      "DEC-20260731-014, deficit_genuine=17947 at n=12 D=6", and DEC-20260802-505759
      repeats it as "DEC-20260731-014 pinned a CTRL-B cell PASS at n=12 D=6". THE
      COMMITTED CONTENT AT ledger/decisions/DEC-20260731-014.yaml IS A GOAL-ECDLP-001
      BATCH-021 DECISION about EXP-DS-001 / H-DS-001 residual control-theater repair.
      It contains no DREG, CTRL-B, n=12, D=6, or deficit content of any kind. The
      citation does not resolve against the file it names.
    what_the_measurement_actually_rests_on: >-
      EV-DREG-008, which records TASK-20260731-016 executing chunked CTRL-B at the
      frozen cell n=12, t=3, ti=0, seed=2026, D=6 under protocol TASK-20260725-701 /
      DEC-20260725-026, with ctrl_b_admission_status admitted,
      rank_null_restricted=156520, deficit_genuine=17947 inside the preregistered
      bracket [1931, 17947], validity completed_valid, and independent red-team
      RT-20260731-013 PASS. THE MEASUREMENT IS ON RECORD; ONLY THE DECISION-ID
      CITATION IS DEFECTIVE.
    mechanism_verified_by_dispatching_session: >-
      VERIFIED, NOT INFERRED. This subfield replaces the authoring session's hedge
      "likely_mechanism_not_asserted_as_fact", which said the hash mismatch could not
      be asserted because no shell was available. THE DISPATCHING SESSION RAN THE
      COMMANDS AND DISCHARGED THAT LIMIT; the results are recorded here as verified by
      that session, not by the authoring session's own tool surface. See
      verification_limits for the exact division of what each session established.
      HASH MISMATCH, CONFIRMED. `shasum -a 256
      ledger/decisions/DEC-20260731-014.yaml` returns
      20f9353438399a7cf959c9742d2527600e166e54af3aafb3c28b93630cc5c253. The BATCH-005
      ledger receipt at
      coordination/goals/GOAL-DREG-001/batches/BATCH-005/archives/TASK-20260731-027/ledger-receipt.json
      declares record_ids [EV-DREG-008, DEC-20260731-014, GOAL-DREG-001] and, for that
      same path, the sha256
      6093f111f4b1f7eef4c5da8e067a9f8e8cb14984c1885cbdff88414ba1a0a81b. THE TWO VALUES
      DIFFER. The DREG BATCH-005 receipt therefore binds a content hash that the file
      at that path does not have and, on the history below, never had.
      AT LEAST THREE LANES MINTED THE SAME IDENTIFIER. `git log --oneline --follow --
      ledger/decisions/DEC-20260731-014.yaml`, run by the dispatching session, shows:
      98fa35db1 "research: TASK-20260731-055 snapshot TASK-20260731-054 EXP-DS-001
      PA-DS-001-v2-ctrl-theater-repair DEC-20260731-014
      CTRL-RT025-PLANT-INDEPENDENT CTRL-RT025-RHO-CALIB
      CTRL-RT025-NULL-SPLIT-COMPOSITION GOAL-ECDLP-001 BATCH-021", which is the
      content currently at the path; a421f72bb "ledger: close GOAL-AES-001 BATCH-003 —
      EV-AES-003, DEC-20260731-014 (revise)", A THIRD LANE, GOAL-AES-001, THAT NEITHER
      SESSION HAD IDENTIFIED BEFORE THIS CHECK; and 3b342d3c5 "Merge origin/main into
      codex/reconcile-ecdlp-b30". Together with the DREG BATCH-005 receipt, which
      expects a fourth content hash matched by none of them, the records show the
      legacy three-digit identifier DEC-20260731-014 minted concurrently by at least
      the DREG, ECDLP and AES-001 lanes for DIFFERENT decisions. That is exactly the
      collision failure mode CLAUDE.md's "Concurrency: many agents, many worktrees"
      section describes and that AGENTS.md rule 14 and tools/allocate_id.py exist to
      prevent: every lane asked committed state for the next free number, got the same
      answer, and the collision surfaced only at merge, when all of them were already
      immutable.
    what_is_deliberately_not_asserted: >-
      NO LANE IS NAMED AS THE RIGHTFUL OWNER OF THE IDENTIFIER, and NONE OF THE THREE
      DECISIONS IS CALLED INVALID. What the records show is that one identifier carries
      three different contents across lanes and that one receipt's hash binding does
      not match the file it names. Which decision, if any, keeps the identifier is a
      question for the lane owners under rule 15, not for this record.
      THE DREG CTRL-B MEASUREMENT IS NOT CALLED INTO QUESTION BY ANY OF THIS.
      EV-DREG-008 stands on its own certificate_refs and its independent red-team PASS;
      only the decision-ID citation and the receipt's hash binding are defective.
    required_handling: >-
      AGENTS.md rule 15 applies and forbids a remap: DEC-20260731-014 appears in a
      completed archive's binding fields (record_ids and artifact_sha256 of the
      BATCH-005 ledger receipt). The repair is a SUPERSEDING record under a new id,
      authored by the lane owner, never a rename and never an edit of any of the
      colliding files. THE VERIFIED THREE-LANE SCOPE MAKES THE REPAIR BROADER THAN CD-1
      FIRST SCOPED: the GOAL-AES-001 lane is exposed too, through a421f72bb, and its
      owner must be notified so that lane can decide its own handling. TASK-20260810-9e7f4c'S
      SCOPE IS NOT WIDENED BY THIS: it remains diagnose-and-propose, and the AES-001
      exposure is a finding it must SURFACE in its D4 deliverable, not work it performs.
      No supersession, notification, or cross-lane edit is authorized by this decision.
  - id: CD-2
    severity: blocking_for_any_dreg_batch
    statement: >-
      GOAL-DREG-001's head is stale against its own committed archives.
      ledger/goals/GOAL-DREG-001.yaml carries current_batch_id BATCH-003, updated_at
      2026-07-27, a checkpoints list ending at BATCH-003, and a next_action directing
      the reader to "open BATCH-004 CTRL-B ... the raw 17947 headline stays
      QUARANTINED as confounded until then". Committed state has moved past all of
      that: BATCH-004 archived EV-DREG-007 and DEC-20260725-026 (CTRL-B protocol
      repair, red-team PASS), and BATCH-005 archived EV-DREG-008 (the CTRL-B
      measurement). A session resuming GOAL-DREG-001 from its head alone would
      re-commission work that is already archived.
    correction_to_the_briefing_this_session_received: >-
      The briefing stated that GOAL-DREG-001 has "batch_checkpoints EMPTY". THE FIELD
      IS NAMED checkpoints, NOT batch_checkpoints, AND IT IS NOT EMPTY: it holds
      BATCH-001, BATCH-002 and BATCH-003 entries. The staleness is real but it is a
      three-batch lag, not an absent log.
  - id: CD-3
    severity: advisory
    statement: >-
      Both DREG archive receipts read in this worktree record commit_sha null and
      verification.status "pending_post_commit"
      (BATCH-004/archives/TASK-20260725-704/ledger-receipt.json and
      BATCH-005/archives/TASK-20260731-027/ledger-receipt.json). This session did not
      run the post-commit verifier and did not resolve any commit, so it does NOT
      assert that those archives are unverified - only that their own receipt files do
      not record a verification. Per CLAUDE.md, receipts bind to content first; the
      declared path_sha256 maps are the durable binding and were not recomputed here.
  - id: CD-4
    severity: advisory
    statement: >-
      GOAL-PATH-001 BATCH-002 produced no PATH-owned coordination directory: the only
      directory under coordination/goals/GOAL-PATH-001/batches/ that resolves in this
      worktree is BATCH-001. BATCH-002's artifacts are the two decision records and
      GOAL-MONO-001 BATCH-003's archives. The goal's dispatch_queue_path is therefore
      LEFT POINTING AT BATCH-001 rather than retargeted at a path that does not
      exist, and the BATCH-002 checkpoint says so.

  what_this_decision_does_not_do:
  - It approves no experiment and freezes no protocol.
  - >-
    It opens no batch of GOAL-DREG-001 and grants it no wall-clock, memory, or run
