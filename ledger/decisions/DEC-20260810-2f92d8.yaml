  claim_boundaries:
  - >-
    THIS DECISION ASSERTS NO MATHEMATICAL RESULT IN EITHER DIRECTION. No d_reg,
    deficit, rank, monodromy, relation-rate, exponent, or ECDLP statement is made,
    strengthened, or weakened. No claim tier moves; nothing here rises above the toy
