  - >-
    It does not close, complete, or pause GOAL-PATH-001, and it does not retract,
    weaken, or re-read any prior decision. DEC-20260802-505759 and DEC-20260802-a51c82
    stand exactly as committed.
  - >-
    It performs no supersession of DEC-20260731-014 and mints no identifier beyond the
