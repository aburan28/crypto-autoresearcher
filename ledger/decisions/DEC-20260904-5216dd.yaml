coordinator_decision:
  id: DEC-20260904-5216dd

  context: >-
    GOAL-SCURVE-137bd9 / BATCH-a40709 poses exactly one question to this
    Coordinator: is the frozen experiment contract EXP-SCURVE-3f87f6 approved
    for execution, or not? DEC-20260904-c42007 approved OPENING the batch and
    states in what_is_NOT_approved that it approves NO experiment contract and
    NO run. S0 (TASK-20260904-f0a889) authored the contract at approved_by
    null; S1 (TASK-20260904-850ff6) snapshot-archived it at commit
    b012132b234bd4bcc5d6ef774c548528a5a7294c and its receipt says in terms that
    archiving a contract is not approving one. Both slots, and the driving
    session, recorded the missing approval as an open item (S0 report section 5
    item 6; S1 receipt open_items OI-4). The queue therefore holds S2
    (TASK-20260904-8e3d66) and S3 (TASK-20260904-90ac09) at state blocked with
    a gate_note naming this gate as the ONLY thing holding them: their snapshot
    dependency TASK-20260904-850ff6 is complete, so the archival gate is
    discharged. This decision releases them, under conditions, and rules on the
    contract for the batch's other two producer slots as well.

  decision: approve

  # ===================================================================
  # WHAT IS APPROVED
  # ===================================================================
  what_is_approved: >-
    EXP-SCURVE-3f87f6, AS THE PROTOCOL GOVERNING THE FOUR PRODUCER SLOTS OF
    BATCH-a40709 -- S2 (TASK-20260904-8e3d66), S3 (TASK-20260904-90ac09), S5
    (TASK-20260904-7efb23) and S7 (TASK-20260904-ad952c) -- for the in-scope
    lanes named in coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/batch.yaml
    in_scope_lanes ranks 1 through 6 (L0; L-EQ, L-FIELD, L-BASE; L-LADDER,
    L-COMPLETE, L-IND, D3, D6; L-RHO) plus the single gated comparison step.
    THE APPROVED OBJECT IS A DIGEST, NOT A FILENAME: the contract as committed
    at b012132b234bd4bcc5d6ef774c548528a5a7294c with content sha256
    0069b16e39b5a23f1535fa214f72ea1e49deb37ebbfcd678a0d62f56ac43c3d8, as
    recorded in the S1 snapshot receipt and in the queue's archive block for
    TASK-20260904-850ff6. Those bytes are the repaired bytes (see
    contract_pedigree.parse_defect). A different byte sequence at that path is
    not what this decision approves.
    The approval is WHOLE, not a named subset of slots: I found no defect that
    lands on one producer and spares another, and withholding approval from a
    slot I have no specific objection to would manufacture a second gate with
    no discriminating question attached to it. The conditions below are
    per-slot; the approval is not.

  what_is_NOT_approved: >-
    NO RUN IS AUTHORIZED UNTIL THE CONDITIONS THAT GATE ITS SLOT ARE
    DISCHARGED, and the conditions are checkable before a run starts rather
    than judged afterwards. This decision approves NO criterion verdict, NO
    adjudication of any of the eleven cells, NO evidence record, NO hypothesis
    (this goal has none and this decision creates none), NO knowledge
    promotion, and NO goal status change. It admits NO item from batch.yaml
    out_of_scope (OOS-1 through OOS-8), each of which stays OPEN AND
    UNATTEMPTED. It does not approve, ratify, or excuse the four
    batch.yaml/queue divergences recorded below -- it requires the superseding
    record they are owed. It raises NO claim ceiling: see claim_ceiling.
    IT ALSO APPROVES NO EDIT TO EXP-SCURVE-3f87f6. The contract is immutable
    and hash-bound; a needed change is a superseding contract under a new EXP
    identifier, never an edit.

  target_ids:
  - GOAL-SCURVE-137bd9
  - RQ-SCURVE-960dbd
  - BATCH-a40709
  - EXP-SCURVE-3f87f6
  - TASK-20260904-8e3d66
  - TASK-20260904-90ac09
  - TASK-20260904-7efb23
  - TASK-20260904-ad952c
  - TASK-20260904-f0a889
  - TASK-20260904-850ff6
  - DEC-20260904-c42007

  # ===================================================================
  # THE APPROVAL CARRIER -- the structural problem this ruling had to solve
  # ===================================================================
  approval_carrier:
    problem: >-
      THE CONTRACT CANNOT RECORD ITS OWN APPROVAL, AND THAT IS NOT A DEFECT TO
      BE EDITED AWAY. experiments/EXP-SCURVE-3f87f6/specification.yaml is bound
      by path_sha256 in a COMPLETED archive (TASK-20260904-850ff6,
      0069b16e39b5a23f1535fa214f72ea1e49deb37ebbfcd678a0d62f56ac43c3d8). Setting
      status to approved and approved_by to this decision would change those
      bytes, and the S1 receipt states that a content mismatch on any bound path
      is fatal to the archive. AGENTS.md rule 2 (immutability) and rule 15
      (never break a completed archive's binding fields) both forbid the edit.
    ruling: >-
      THE APPROVAL LIVES IN THIS RECORD, AND THE CONTRACT FILE STAYS BYTE
      IDENTICAL AT status draft, approved_by null, FOREVER. This is the
      formulation the program already uses: AGENTS.md and the S1 receipt both
      define an approval as A FROZEN CONTRACT AT A DECLARED PATH PLUS A
      COMMITTED COORDINATOR DECISION. Neither requires the contract file to
      assert its own approval, and the file asserting it would be the weaker
      artifact anyway -- a self-declared approval inside the approved object.
    precedent_cited: >-
      harness/run_kerfield_stage0_v3.py writes "approved_by_decision":
      DECISION_ID into its run manifest and its result record. Carrying the
      approving DECISION id in the run manifest, rather than in the contract, is
      the established pattern in this repository. Read by me from that file; not
      executed.
    cost_stated_plainly: >-
      A READER WHO CHECKS ONLY THE CONTRACT FILE WILL CONCLUDE NO APPROVAL
      EXISTS, PERMANENTLY. Its status_note and approved_by_note say approved_by
      "stays null until a separate committed Coordinator decision approves this
      contract", which a reader may fairly read as promising the field would be
      filled. It will not be. That misreading is the price of immutability and
      it is paid deliberately, not hidden: condition C-2 puts the pointer where
      a reader will actually be standing -- the queue gate_notes and every run
      record produced under this contract.
    what_is_still_not_an_approval: >-
      Not this decision uncommitted. Not a message, in-session or on the bus.
      Not a task card, a dispatch instruction, or a queue state change. An
      Executor that cannot find BOTH the frozen contract at
      experiments/EXP-SCURVE-3f87f6/specification.yaml AND this decision
      committed and verifier-accepted refuses to run, whatever it is told.

  # ===================================================================
  # CONDITIONS -- every one checkable BEFORE the run it gates
  # ===================================================================
  conditions:

  - id: C-1
    gates: [S2, S3, S5, S7]
    condition: >-
      CONTENT IDENTITY. Confirm that the working-tree bytes of
      experiments/EXP-SCURVE-3f87f6/specification.yaml hash to
      0069b16e39b5a23f1535fa214f72ea1e49deb37ebbfcd678a0d62f56ac43c3d8 before
      any producer is dispatched.
    why: >-
      I READ THE WORKING TREE, NOT THE COMMITTED BLOB. I hold no hashing tool
      and no git. My whole-file review below is therefore a review of the
      working-tree copy, while what I approve is a digest. If the two differ,
      my review does not cover the approved object and this approval does not
      attach. This is the same limit S1 disclosed for its own reading.
    how_checked: >-
      git show b012132b2:experiments/EXP-SCURVE-3f87f6/specification.yaml |
      sha256sum, compared against sha256sum of the working-tree file.
    on_failure: >-
      NO PRODUCER IS DISPATCHED. The divergence is recorded as a new record and
      returns here for a fresh ruling on whichever bytes are actually present.

  - id: C-2
    gates: [S2, S3, S5, S7]
    condition: >-
      THE APPROVAL POINTER IS PLACED WHERE A READER STANDS. (a) The queue
      entries for TASK-20260904-8e3d66 and TASK-20260904-90ac09 move from
      blocked to queued and their gate_note is rewritten to cite
      DEC-20260904-5216dd as the approval, stating that the contract file's own
      approved_by remains null by immutability and that this is expected rather
      than an oversight. (b) Every run record and task report produced under
      this contract by S2, S3, S5 and S7 carries approved_by_decision:
      DEC-20260904-5216dd.
    why: >-
      The queue is the artifact a dispatched agent actually reads, and it is
      the one artifact here that is deliberately NOT hash-bound and IS edited on
      every ordinary transition -- so it is the correct home for a pointer.
      Without (a), the gate_note keeps asserting that the approving decision
      does not exist, which will be false.
    how_checked: read the queue; read each producer's run record.
    note: >-
      This is an ordinary queue advance, not a divergence from batch.yaml.

  - id: C-3
    gates: [S2, S3, S5, S7]
    condition: >-
      TREE HEALTH AND PUBLICATION. Merge origin/main into the working branch
      (MERGE, NEVER REBASE), then on the merged tree carrying this decision run
      tools/validate_ledger.py and tools/research_dispatch.py against
      coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/dispatch_queue.json,
      record both outcomes, push the branch, and open or refresh the PR against
      main naming DEC-20260904-5216dd, BATCH-a40709 and EXP-SCURVE-3f87f6.
    why: >-
      This decision introduces a new DEC record, so the push-and-PR duty
      applies: a record that exists only in a local commit is unpublished, not
      durable evidence, and an unpublished approval approves nothing. The
      validator run is not ceremonial -- it is the only machine check that this
      approval does not itself break the ledger.
    how_checked: the recorded exit status and output of both tools.
    predicted_outcome_recorded_before_the_run: >-
      I EXPECT BOTH TO PASS, and I record the expectation so that a failure is
      legible as a result rather than absorbed. Basis, read from source and NOT
      executed by me: tools/validate_ledger.py REQUIRED["experiment"] demands
      hypothesis_id, and DOCUMENTED_NULL_OK maps hypothesis_id to
      hypothesis_id_note -- which this contract carries -- so its null is
      excused by name; and check_experiment's approved-contract clause (null
      success_criterion, falsification_criterion or approved_by) fires only when
      status == "approved", which this file does not say and will never say.
      tools/research_dispatch.py contains no occurrence of the string
      approved_by, so releasing the two slots is not gated on that field there
      either. IF EITHER TOOL REJECTS, I WAS WRONG and no producer runs.

  - id: C-4
    gates: [S2, S3, S5, S7, S11, S12]
    condition: >-
      THE DISPATCH-TIME CAPABILITY CHECKS ARE ACTUALLY RUN AND THEIR OUTCOMES
      RECORDED IN THE TASK RECEIPT -- CAP-1 before S2, CAP-2 before S3, S5 and
      S7, CAP-3 before S11 and S12, as batch.yaml capability_contract declares
      and as the contract's capability_declarations.dispatch_time_checks
      records.
    why: >-
      CAPABILITY IS PER-SESSION, NEVER PER-REPOSITORY, and this approval must
      not be read as assuming one. Two producer tasks in ONE batch of
      GOAL-ECRANK-002 reported different toolchains on 2026-09-04 and the
      second could not attempt half its protocol. Nothing about this approval
      is owed a capability check -- CAP-1 and CAP-2 are dispatch-time checks,
      not approval prerequisites, and none has been run or is recorded as run
      by anyone. What an approval CAN do is require the check, and this one
      does. A CARD IS A POINTER, NOT A CHECK: S0 correctly recorded (report
      section 5 item 3) that the cards and the contract name all four checks
      while the checks themselves remain owed.
    on_failure: >-
      As batch.yaml already rules. A failed CAP-1 halts S2 as an IMPEDIMENT on
      a still-active goal and leaves the measurement slots dispatchable; a
      failed CAP-2 means the slot is NOT run and NOT reported as attempted; a
      failed CAP-3 blocks the CLAIM, not the campaign, with no substitution and
      no downgrade. Each is an operational observation and NEVER negative
      mathematical evidence.

  - id: C-5
    gates: [S3, S5]
    condition: >-
      THE CAPSULE SEAL GETS A COMPARAND. Before S3 and before S5, their queue
      entries must name
      coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-ef5b1e/tasks/TASK-20260824-4af491/snapshot-receipt.json
      as the binding comparand for the parameter capsule, and require the slot
      to compute the sha256 of the capsule it read and compare it against the
      value that receipt records for
      .../TASK-20260824-53ecc0/parameter-capsule.yaml, recording both values
      and the comparison.
    why: >-
      THIS IS THE ONE NULL IN THE CONTRACT THAT COSTS SOMETHING OPERATIONAL.
      inputs.capsule_sha256 is null by capability, and the contract's answer --
      "each measurement slot records the sha256 of the capsule IT read" -- gives
      the slot a self-report with nothing to compare it against. INV-9 voids a
      producer that reads an input not bound by path_sha256 in the receipt that
      governs it, so without a named comparand INV-9 is undischargeable for the
      single input the whole batch measures, and L-EQ's exact equality would be
      computed against unverified bytes. That is precisely the
      transcription-reported-as-measurement defect this batch exists to remove.
    why_it_is_satisfiable_and_cheap: >-
      THE BINDING ALREADY EXISTS; ONLY THE POINTER WAS MISSING. I read
      TASK-20260824-4af491/snapshot-receipt.json and it records, under
      path_sha256, a full 64-hex digest for the capsule path --
      5125d93cd35476075c15bec668bbef6a3021ac7c3bd23e92f7ba53307b68ecc2 -- at
      commit 5c3bfe273070e0537a21ae5491fb028b7e5efa1e, with base_checked
      origin/main e3ddd700fad and a verification block asserting commit
      reachability, declared-path equality and blob-hash match. The receipt is
      inside S3's and S5's declared read_scope
      (.../batches/BATCH-ef5b1e). The contract's null is therefore an omitted
      POINTER, not an absent binding, and this condition costs one line of
      queue text.
    disclosed_inconsistency: >-
      RECORDED RATHER THAN SMOOTHED. That receipt's own task record,
      .../BATCH-ef5b1e/tasks/TASK-20260824-4af491/task.yaml, still reads state:
      queued with archive.commit_sha null, parent_sha null, path_sha256 {} and
      record_ids [] -- a stale queue-side record sitting beside a completed
      receipt and a goal head (latest_verified_commit 5c3bfe273070) that calls
      the binding content-verified. I did not reconcile it and it is not mine
      to edit. It does not block: the receipt carries the digests and the goal
      head records the verification. It is named so a later reader does not
      discover it as a surprise, and it is a second reason the digest must be
      RE-CHECKED at dispatch rather than trusted from a self-report.

  - id: C-6
    gates: [S3, S5, S7, S9, S11, S12]
    condition: >-
      THE OWED SUPERSEDING RECORD IS COMMITTED, AND IT COVERS FOUR DIVERGENCES,
      NOT THREE. One new DEC identifier (allocate_id.py --next decision, then
      --check), recording that on each of the four items below batch.yaml
      governs and the queue/contract text is superseded in PLACEMENT or WORDING
      and not in FORCE. D-4 must be committed before S3 runs; D-1 and D-2 before
      S5, S7, S9, S11 and S12 run; D-3 concerns S0, which is complete, and is
      recorded for the archive rather than to gate anything.
    divergences:
    - id: D-1
      what: >-
        batch.yaml requires S5, S7, S9, S11 and S12 to declare their pre-read
        seals in artifact_paths; the queue declares them in read_scope and in
        the constraint text.
      status_before_this_decision: reported by S0 (report section 5 item 1) and by S1 (OI-1 divergence_a); unrecorded
      assessment: >-
        The queue's placement is the only one representable, because
        dispatch_queue.v1 gives every artifact path exactly one owning task and
        those receipts are owned by S4, S6, S8 and S10. The FORCE of the seal is
        not in dispute.
    - id: D-2
      what: >-
        S11 and S12 depends_on is [S7, S8, S10] in the queue where batch.yaml
        gives [S10].
      status_before_this_decision: reported by S0 (section 5 item 2) and by S1 (OI-1 divergence_b); unrecorded
      assessment: >-
        Order-preserving; S10 already requires S7 and S8 transitively, and
        nothing changes about what either reviewer may read.
    - id: D-3
      what: >-
        dispatch_queue.json was removed from S0's artifact_paths and
        handoff.artifact_paths after the S1 archive.
      status_before_this_decision: >-
        reported by the driving session in the queue's own artifact_paths_note,
        with prior_artifact_paths preserved verbatim; unrecorded as a decision
      assessment: >-
        Two committed rules genuinely pull opposite ways: research_dispatch.py
        requires a completed archive's path_sha256 to cover every source
        artifact, while CLAUDE.md's concurrency contract excludes the queue from
        archive commits because it is edited on every transition (it had already
        advanced at 7a7c87866). The repair keeps the queue in S0's write_scope
        and content-verified at b012132b2, which preserves what binding was for.
        Reported by the party that made it, with the pre-repair list retained --
        which is the behaviour the program wants.
    - id: D-4
      what: >-
        THE CONTROL CTRL-CONSTRUCTED-RANDOMPOINT HAS TWO DIFFERENT PASS
        CONDITIONS. batch.yaml slot S3 says the random point is one "the
        on-curve check must reject it"; the contract's CTRL-CONSTRUCTED-RANDOMPOINT
        must_do says "the on-curve check MUST ACCEPT it only if it is on the
        curve; a checker that accepts a random pair has no resolving power", and
        the queue's S3 constraint carries the contract's wording, not
        batch.yaml's.
      status_before_this_decision: >-
        NOT PREVIOUSLY REPORTED BY ANY SLOT. Found by this Coordinator while
        reading the contract against batch.yaml for this ruling. S0, S1 and the
        driving session each enumerated divergences and none names this one.
      assessment: >-
        MATERIAL BUT NOT DAMAGING, AND THE CONTRACT'S VERSION IS THE BETTER ONE.
        This is a HARD GATE whose failure voids L-BASE, so the two files
        disagreeing about when it fires is not cosmetic. batch.yaml's "must
        reject" is not a theorem -- a uniformly random coordinate pair lies on
        the curve with probability O(1/p), so "must reject" is true with
        overwhelming probability and false as a deterministic requirement; the
        contract's formulation is the one a correct implementation can satisfy
        unconditionally. In practice the two produce the same observable outcome
        on any pair that is not on the curve, which is why this does not warrant
        refusing the contract. But batch.yaml governs, and a disagreement
        between batch.yaml and a downstream artifact is a superseding record,
        never an edit to either file.
      why_it_gates_s3: >-
        S3 owns this control. If S3 runs before the record exists, its control
        outcome is recorded against a pass condition that its own governing file
        does not state, and a reviewer would be right to call the control
        non-conforming.

  - id: C-7
    gates: [S3, S5]
    condition: >-
      THE PREDICTION LEAK IS DISCLOSED, AND THE DISCLOSURE IS IN THE QUEUE
      BEFORE DISPATCH. S3's and S5's handoff constraints must state that the
      archived audit plan supplied to them in inputs contains per-lane
      quantitative_prediction blocks carrying the expected values for their own
      lanes, and must require each slot to record in its report which prediction
      blocks it read, at what point relative to computing its own quantities.
      Removing audit-plan.yaml from S3's and S5's inputs entirely is the
      stronger option and is available to the driving session -- neither slot
      needs it, since both take their lane specifications from the contract's
      metrics block -- but it is not mandated here.
    why: >-
      THE CONTRACT'S NO-LEAK DESIGN IS DEFEATED ONE LAYER UP, AND NOBODY HAS
      RECORDED IT. The contract deliberately restates no parameter value, no
      prior verdict and no expected value, and its preregistered_prediction is a
      POINTER so that "a producer never reads a predicted value". I verified the
      contract honours that: reading all 790 lines I found no parameter, residue,
      order, cofactor, count or expected value for the audited curve. But the
      queue hands S3 and S5 the audit plan itself, and that file's per-lane
      quantitative_prediction blocks state the answers outright -- including,
      for L-EQ, a literal decimal integer asserted equal to the retrieved hex,
      which is the exact reconciliation L-EQ exists to decide. A producer handed
      that can transcribe rather than compute.
    why_it_is_a_condition_and_not_a_refusal: >-
      IT IS NOT THE CONTRACT'S DEFECT -- the contract is clean, and batch.yaml
      does not enumerate S3's inputs, so this is a queue-level choice in a file
      that is editable by design. Preregistration is also not the same as
      blinding: nothing in this program requires a producer to be blind to a
      frozen prediction. And the backstops are real: the contract's
      source_code_rule makes the exact producing source an artifact, INV-3
      invalidates any quantity that does not reproduce by re-running that source
      against the capsule whose sha256 the slot recorded, and batch.yaml's
      review architecture requires a BLIND re-derivation with the producer's
      implementation and report in blind_from.
    why_it_matters_anyway: >-
      THE LEAK BIASES TOWARD THE PRIOR, AND THE FALSIFYING OUTCOME IS THE
      INFORMATIVE ONE. The Coordinator prior recorded at opening holds P-2
      STRONG -- that L-EQ's equality holds. If it holds, the leak cost little.
      If it FAILS, that is the major result about intake and provenance that
      this batch's second-ranked lane exists to find in millisecond-cost work,
      and a producer that has already read the asserted equality is the least
      likely instrument to find it. Cheap disclosure now is worth more than an
      argument about it later.

  - id: C-8
    gates: [S11, S12]
    condition: >-
      THE S9 REVIEW PLAN EXTENDS THE BLIND RE-DERIVATION TO L-EQ'S EXACT
      EQUALITY, in addition to the derived group order and cofactor that
      batch.yaml review_architecture already names, with S3's implementation,
      notes and report listed in blind_from, and with audit-plan.yaml listed in
      blind_from as well.
    why: >-
      C-7 leaves a residual risk that only a blind re-derivation can see:
      recomputing from the producer's own artifacts reproduces a
      wrong-but-self-consistent implementation faithfully, and re-reading the
      prediction reproduces a transcription faithfully. L-EQ is the batch's
      cheapest and most load-bearing discriminator and it is the lane the leak
      touches most directly. Naming audit-plan.yaml in blind_from is the part
      that makes this bite.
    how_checked: >-
      read the S9 review plan before either reviewer runs, and
      tools/check_review_independence.py, which refuses a re-deriver whose
      declared sources intersect its blind_from.

  # ===================================================================
  # WHAT I ACTUALLY CHECKED, AND WHAT I COULD NOT
  # ===================================================================
  contract_review:
    method: >-
      I read experiments/EXP-SCURVE-3f87f6/specification.yaml in full (790
      lines, working-tree copy) against batch.yaml, DEC-20260904-c42007, the
      dispatch queue, the S0 report including its driving-session addendum, the
      S1 snapshot receipt, AGENTS.md, docs/claims-and-verification.md,
      docs/evidence-and-reproducibility.md, templates/research-records.md and
      agents/coordinator.md. I RAN NOTHING. I hold no shell, no hashing tool,
      no parser, no clock, no git and no network in this invocation.

    findings_that_support_approval:
    - >-
      BUDGETS ARE FAITHFUL COPIES, NOT INVENTIONS. All fourteen per-slot
      wall-clock ceilings in the contract equal batch.yaml budget_accounting
      split_across_slots exactly (S0 900, S1 900, S2 1800, S3 1200, S4 900, S5
      1800, S6 900, S7 1200, S8 900, S9 600, S10 900, S11 900, S12 900, S13
      1200), and they sum to the declared 15000. maximum_runs 64 equals the sum
      of the four producer slots' committed queue budgets, which I checked
      against the queue itself: S2 12, S3 20, S5 20, S7 12. maximum_memory_gb 4
      is the largest per-slot ceiling and matches S5; max_concurrent 2 is the
      goal head's committed value and is not raised. maximum_workers is 1, so no
      parallel determinism claim is made or needed.
    - >-
      BOTH TEMPLATE BUDGET FLOORS ARE ADDRESSED WHERE THE TEMPLATE REQUIRES,
      in the objective. Every slot meets the 600 s per-run floor (S9 is 600
      exactly and runs no computation); the 8 GB memory floor is not met and the
      contract says so and says why, citing the committed batch design rather
      than a measurement.
    - >-
      THE CONTRACT HONOURS ITS OWN parameter_handling_rule. Reading all 790
      lines I found no parameter value, residue, group order, cofactor, count,
      marginal or expected value for the audited curve anywhere in it. It is in
      fact cleaner than batch.yaml, which does leak expected values in S3's and
      S5's deliverable text (a specific j-invariant disposition, a specific
      automorphism count for a control curve). Those are batch.yaml's, not the
      contract's, and the control-curve one is benign -- a positive control is
      defined by its known answer.
    - >-
      THE LANE-TO-SLOT ASSIGNMENT AND THE REQUIRED ARTIFACT PATHS MATCH THE
      QUEUE. L0 to S2, L-EQ/L-FIELD/L-BASE to S3, the rank-5 block plus L-RHO to
      S5, COMPARISON to S7; and required_artifacts lists exactly the five, four,
      five and four paths the queue gives those slots as artifact_paths.
    - >-
      THE CONTROL ARCHITECTURE IS A HARD-GATE ARCHITECTURE AND SAYS SO.
      control_ordering_rule puts guarding controls on the identical code path
      BEFORE any target output from the lane they guard is interpreted; INV-1
      makes a non-firing positive control produce NO INTERPRETABLE OUTPUT rather
      than a weak result; INV-2 makes a zero-percent null a BROKEN CHECKER that
      voids its lanes. control_cost_honesty states that near-free applies to the
      target and not to the controls. This is "controls before belief" written
      as an enforceable ordering rather than as an aspiration.
    - >-
      THE SCOPE LIMITS ARE THE RIGHT ONES AND ARE STATED AS LIMITS.
      scale_relevance declares the null family runs at ONE reduced field size
      and licenses a statement about instrument resolving power ONLY, never a
      distributional placement of any statistic about the audited curve;
      transfer to any other curve is declared NONE, with the specific warning
      that the Hasse-interval uniqueness argument depends on a regime hypothesis
      that must be re-checked. CTRL-COST-CALIBRATION is DECLARED ABSENT with its
      reason (the honest positive control for a cost formula needs a solver, and
      no solver is run) rather than quietly omitted.
    - >-
      THE FALSIFICATION CRITERION FALSIFIES THE INSTRUMENT, NOT THE CURVE, and
      the success criterion is that the protocol RAN AS SPECIFIED AND ITS
      OUTPUTS ARE CHECKABLE -- explicitly not that any particular value came
      out, with a lane that reports itself not measured, with a reason, counted
      as satisfying it. That is the shape that makes a pre-registered contract
      un-fittable to its own results, and it is the single strongest reason to
      approve this one.
    - >-
      THE ELEVEN INVALIDATION RULES ARE FIXED BEFORE ANY MEASUREMENT EXISTS and
      cover the failure modes that actually threaten this batch: instrument
      failure (INV-1, INV-2), non-reproducibility from committed source (INV-3),
      an unauthorised comparison (INV-4), a recalled threshold entering a
      comparison (INV-5), the intake/source conflict (INV-6, routed as an
      IMPEDIMENT on a still-active goal and explicitly a result about provenance
      and about no curve's security), the uniqueness argument's regime
      hypothesis (INV-7), a retrieved definition differing from a recalled one
      (INV-8, invalidating the comparison step and not the measurement), a broken
      pre-read seal (INV-9), an unavailable declared capability (INV-10, with the
      unservable review tier blocking the CLAIM and not the campaign), and
      bedrock (INV-11).

    the_four_nulls_ruled_on_individually:
    - field: provenance.frozen_at
      ruling: ACCEPTABLE, NOT TO BE FILLED BEFORE A RUN
      reason: >-
        Null by capability under DEC-20260903-9c3e26 ruling_1: the authoring
        session could not read a clock and an estimated stamp is
        indistinguishable from a real one. Nothing in the protocol depends on
        it. Its factual content -- when these bytes became frozen -- is carried
        better by the archive commit b012132b2 and its digest than a
        self-reported stamp ever would be. Filling it now is impossible anyway
        without editing an immutable file.
    - field: inputs.capsule_sha256
      ruling: >-
        ACCEPTABLE IN THE CONTRACT, BUT IT COSTS SOMETHING OPERATIONAL AND THE
        COST IS PAID BY CONDITION C-5
      reason: >-
        See C-5. The binding exists in a committed prior receipt; only the
        pointer was missing, and a pointer can be supplied in the queue without
        touching the frozen file. This is the only null of the four that I would
        have refused over if the binding had not already existed.
    - field: budget.total_cpu_hours
      ruling: ACCEPTABLE, NOT TO BE FILLED
      reason: >-
        The batch design declares wall clock and memory per slot and no CPU-hour
        ceiling, so there was nothing to copy and inventing one would have been
        fabrication. More to the point the budget is NOT unbounded: with
        maximum_workers 1 and a declared batch total of 15000 wall-clock
        seconds, CPU consumption is bounded above by 15000 CPU-seconds. I state
        that as arithmetic on two declared ceilings, not as a measurement of
        anything. My role's prohibition is on unbounded exploration without a
        resource budget; this is bounded four ways (per-slot wall clock, memory,
        maximum_runs, max_concurrent) and the campaign budget is separately
        unlimited by BUDGET-AMEND-20260828-750d51, so no budget decision is
        owed here and none is made.
    - field: tail_checks (empty) and preregistered_prediction (a pointer)
      ruling: ACCEPTABLE, AND THE POINTER IS THE BETTER DESIGN -- POINTER VERIFIED
      reason: >-
        Empty tail_checks is structural: a tail check presupposes a
        distributional comparison that no in-scope lane makes, and the null
        family is an instrument check rather than a reference distribution.
        Adding one would import the comparison the contract forbids. On the
        pointer: I VERIFIED IT RESOLVES rather than accepting it. Every in-scope
        lane has a quantitative_prediction block in the archived
        audit-plan.yaml, which is bound by the BATCH-ef5b1e snapshot receipt --
        L-FIELD, L-EQ, L-BASE, L-RHO, L-LADDER, L-COMPLETE, L-IND, D3 and D6 all
        carry one. Had that pointer dangled, this batch would have had NO
        preregistration and I would have refused. Note that verifying it is also
        what surfaced the leak in C-7: the blocks resolve, and they contain the
        answers.

    the_parse_defect_and_what_it_implies:
      the_fact_as_supplied: >-
        ATTRIBUTED TO THE DRIVING SESSION, NOT VERIFIED BY ME. Its addendum A2
        records that the contract did not parse as YAML when S0 returned it --
        four plain multi-line scalars whose continuation line sat at the same
        indent column as its key -- that it indented four continuation lines
        (173, 245, 246, 257) two spaces deeper and nothing else, and that the
        repair is content-preserving: 790 lines before and after, identical after
        stripping leading whitespace from every line, a diff of 4 lines each
        differing only in leading spaces. I ran no parser and no diff.
      what_it_implies: >-
        THE HONEST INFERENCE IS NARROW AND I WILL NOT WIDEN IT. It establishes
        that a role with no parser cannot discharge a parse gate, which was
        already the standing finding, and that S0 correctly declined to claim a
        parse it had not obtained. It does NOT establish that S0's semantic
        content is unreliable: a misindented continuation line is a
        capability artifact of authoring 790 lines of YAML without a parser, not
        a reasoning error, and the driving session's proof that the repair
        touched only whitespace means the semantic content I reviewed is the
        semantic content S0 wrote.
      what_it_nonetheless_licensed_me_to_do: >-
        It is the reason I read all 790 lines against batch.yaml line by line
        rather than spot-checking, and that reading found the fourth divergence
        (D-4) that three prior slots enumerating divergences had missed. One
        undetected defect reaching a frozen artifact is a fair prior that a
        second is present; the correct response is a closer read, which I
        performed, and an honest statement that ONE closer read by a correlated
        model is weak assurance, which is the next block.

    what_i_could_not_check:
    - >-
      THAT THE BYTES I READ ARE THE BYTES I APPROVED. No hashing tool. Condition
      C-1 exists for exactly this and gates every slot.
    - >-
      THAT THE CONTRACT PARSES. No parser. The driving session reports it does,
      post-repair, and reports approved_by confirmed null by reading the PARSED
      object rather than the text. Recorded as its statement, credited to it.
    - >-
      COMMIT REACHABILITY, PARENTAGE, THE MERGE BASE, THE MERGE OUTCOME OR THE
      PR STATE. No git. The S1 receipt leaves its own completion gate 2 NOT
      DISCHARGED for the same reason (OI-6, OI-7, OI-9) and the queue's archive
      block records the driving session's verification of the digests and
      parentage. Those remain owed; C-3 restates them for this decision's own
      commit.
    - >-
      ANY DIGEST, TIMING, DISPATCHER FIGURE OR ARITHMETIC RESULT. Every such
      value in this record is either read from a committed file (and attributed
      to it) or supplied by the driving session (and attributed to it). I
      computed none of them.

  # ===================================================================
  # MODEL INDEPENDENCE
  # ===================================================================
  model_independence:
    state: ZERO, AND IT IS WORSE NOW THAN WHEN S1 RECORDED IT
    fact: >-
      S0, S1, the driving session and THIS COORDINATOR all report resolved model
      claude-opus-5 with model_verified false. The S1 receipt already flagged
      that its agreement with S0 and the driving session is ONE DRAW FROM A
      CORRELATED SET AND NOT CORROBORATION. My review adds a fourth draw from
      the same set, so the count of agreeing readers has risen and the
      independence has not.
    what_it_costs_this_decision: >-
      MY WHOLE-FILE REVIEW IS NOT INDEPENDENT VERIFICATION OF S0'S AUTHORING,
      AND MUST NOT BE CITED AS SUCH. A defect that is invisible to this model is
      invisible to every reader this batch has had so far -- S0 authored, S1
      archived, the driving session repaired, and I approved, all on one model.
      That is the honest ceiling of the assurance behind this approval. Concretely
      it means my "no parameter value appears in 790 lines" and "the lane-to-slot
      map matches" findings are one reader's careful reading, not a checked fact.
    what_i_did_about_it: >-
      I LEANED THE CONDITIONS ON MACHINE-CHECKABLE GATES RATHER THAN ON READER
      AGREEMENT. C-1 is a digest comparison, C-3 is two tools' exit status, C-5
      is a digest comparison against a prior committed receipt, C-8 is a blind
      re-derivation whose blind_from is enforced by
      tools/check_review_independence.py. None of those cares how many
      correlated readers agreed.
    when_independence_actually_arrives: >-
      NOT UNTIL S11 AND S12 -- review-adversarial at xhigh, in INDEPENDENT
      SESSIONS, sibling-blind -- and those run after S7, i.e. after every
      producer. This batch therefore spends its entire producer phase without an
      independent reader. That is a property of the batch design, which I am not
      re-opening here; it is recorded so that a later reader knows the exposure
      was seen and priced rather than missed. CAP-3 must be run before them and
      an unservable review tier blocks the CLAIM, not the campaign.

  # ===================================================================
  # RATIONALE
  # ===================================================================
  rationale:
  - >-
    THE CONTRACT DOES THE ONE THING A FROZEN CONTRACT EXISTS TO DO: it fixes
    what will be measured, what would invalidate a measurement, and what artifact
    each lane must leave behind, BEFORE any measurement exists to be fitted to.
    Its metrics define quantities as WHAT IS COMPUTED and never as an expected
    value; its success criterion is that the protocol ran and its outputs are
    checkable, not that any particular value came out; and a lane reporting
    itself not measured, with a reason, satisfies it. A contract with those three
    properties cannot be retrofitted to its own results, which is the property I
    am actually approving.
  - >-
    ITS UNUSUAL PEDIGREE IS DISCLOSED, AND DISCLOSURE IS THE BEHAVIOUR THE
    PROGRAM WANTS, NOT A REASON TO WITHHOLD APPROVAL. Every null carries its
    reason in the same block; the author stated plainly that it had no shell, no
    digest tool and no clock and recorded none of those as run; the preregistered
    prediction is a pointer specifically so a producer never reads a predicted
    value; tail_checks is empty for a stated structural reason. I ruled on each
    null individually rather than approving the disclosure as a whole, and three
    of the four cost nothing operational while the fourth is repaired by C-5
    without touching the file.
  - >-
    THE THREE OPEN DIVERGENCES DO NOT ARGUE FOR REFUSAL, THEY ARGUE FOR AN ORDER
    OF OPERATIONS, AND I IMPOSED ONE. None of D-1, D-2 or D-3 touches what S2
    retrieves or what S3 computes: D-1 concerns seal PLACEMENT for S5, S7, S9,
    S11 and S12 with the seal's force undisputed; D-2 is an order-preserving
    dependency superset for the two reviewers; D-3 concerns S0, which is
    complete. So the superseding record they are owed gates the slots they touch
    and gates neither S2 nor S3. That split is what lets the time-sensitive
    retrieval gate release first without anyone pretending the record is not
    owed. The fourth divergence I found myself, D-4, DOES touch S3, and it gates
    S3 accordingly.
  - >-
    THE CHEAPEST VALID DISCRIMINATOR SHOULD NOT WAIT ON PAPERWORK IT DOES NOT
    DEPEND ON. L-EQ decides in milliseconds whether the tuple this goal has been
    auditing is the tuple the retrieved sources specify, and if it fails, every
    later lane in this batch and the next is void. Holding it behind a record
    about seal placement for slots that have not been authored would be
    expensive caution pointed at the wrong risk.
  - >-
    APPROVING IS NOT THE CONVENIENT ANSWER HERE AND I WANT THAT ON THE RECORD.
    Refusing would have been cheaper for me: it commits to nothing, cannot be
    shown wrong by any run, and would have read as rigour. But the contract's
    defects are of a kind that a superseding contract would not fix -- a null
    clock cannot be filled by a new EXP identifier, a missing digest pointer
    belongs in the queue rather than in the protocol, and the divergences are
    between batch.yaml and the queue rather than inside the contract at all.
    Minting a second EXP identifier for a byte-identical protocol in order to
    flip a status field would create two contracts for one protocol, leave the
    archive binding the first, and buy nothing. The one thing refusal WOULD have
    bought -- a chance to remove the audit-plan leak from the producers' inputs --
    is bought more cheaply by C-7, in the editable file where the leak actually
    lives.
  - >-
    NOTHING HERE MOVES AN EXPONENT AND NOTHING HERE CLAIMS TO. The program's
    direction bias toward exponent-targeting mechanisms is honoured by saying so
    rather than by pretending otherwise: this batch is a transcription-check and
    retrieval protocol, D3's discounted cost is disclosed in the contract itself
    as a constant-factor diagnostic that can never move an exponent, and L-RHO is
    one formula evaluation with no solver run and every idealisation listed. No
    asymptotic-complexity claim is proposed, so the four promotion gates in
    agents/coordinator.md are NOT ENGAGED and are certainly not met. What the
    profile does bind here is scope and cost honesty, and the contract is
    written to that.

  # ===================================================================
  # HOW A READER CAN SHOW THIS DECISION WAS WRONG
  # ===================================================================
  falsifiers_of_this_approval:
  - id: F-1
    check: >-
      Recompute sha256 of experiments/EXP-SCURVE-3f87f6/specification.yaml. If
      the working tree does not hash to
      0069b16e39b5a23f1535fa214f72ea1e49deb37ebbfcd678a0d62f56ac43c3d8, my
      review covered a different object than my approval names.
  - id: F-2
    check: >-
      Run tools/validate_ledger.py on the merged tree. If it rejects
      EXP-SCURVE-3f87f6 for a null hypothesis_id, a null approved_by, or
      anything else, my C-3 prediction was wrong and this approval was premature.
      I read the source and did not run it.
  - id: F-3
    check: >-
      Grep tools/research_dispatch.py and harness/runner.py for an approval
      requirement on the contract file. If any tool refuses to dispatch or run a
      contract whose approved_by is null, my approval_carrier ruling is
      unworkable and the correct answer becomes a superseding contract under a
      new EXP identifier. I established only that the string approved_by does not
      occur in tools/research_dispatch.py.
  - id: F-4
    check: >-
      Open
      coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-ef5b1e/tasks/TASK-20260824-4af491/snapshot-receipt.json.
      If it does not record a sha256 for
      .../TASK-20260824-53ecc0/parameter-capsule.yaml, C-5 is unsatisfiable,
      INV-9 is undischargeable for the batch's single measured input, and I
      should have refused over inputs.capsule_sha256 being null.
  - id: F-5
    check: >-
      Grep audit-plan.yaml for quantitative_prediction. If any in-scope lane
      (L0, L-EQ, L-FIELD, L-BASE, L-LADDER, L-COMPLETE, L-IND, D3, D6, L-RHO)
      lacks one, the contract's preregistered_prediction is a dangling pointer,
      this batch has no preregistration, and approval was wrong.
  - id: F-6
    check: >-
      Compare the contract's fourteen per_slot_ceilings_wall_clock_seconds and
      its maximum_runs 64 against batch.yaml split_across_slots and the queue's
      four producer budgets. If any disagrees, my "budgets are faithful copies"
      finding is wrong and the contract invented a ceiling.
  - id: F-7
    check: >-
      Read all 790 lines for a P-224 parameter value, residue, group order,
      cofactor, count or expected value. Finding one falsifies my
      parameter_handling_rule finding and means the contract hands its
      measurement slots an answer.
  - id: F-8
    check: >-
      Compare the contract's lanes against batch.yaml out_of_scope OOS-1 through
      OOS-8. If the contract admits any of them, this approval exceeded the batch
      the opening decision authorised.
  - id: F-9
    check: >-
      Read batch.yaml against the contract and the queue for a FIFTH divergence
      beyond D-1 through D-4. Finding one shows my enumeration is incomplete --
      which, given that three prior slots each enumerated divergences and each
      missed D-4, is the falsifier I consider most likely to fire.

