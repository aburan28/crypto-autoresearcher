  # ===================================================================
  # LIMITATIONS
  # ===================================================================
  limitations:
  - >-
    THIS DECISION ASSERTS NOTHING ABOUT WHETHER ANY CURVE IS SAFE OR UNSAFE, AND
    ADJUDICATES NO CRITERION CELL. Arithmetic verification of a published
    parameter set is a TRANSCRIPTION CHECK, not a security evaluation. I
    adjudicated no cell, and I am not permitted to; only S7 may compare, once,
    after L0 closes, and its dossier goes to independent review before anything
    is official.
  - >-
    APPROVING A PROTOCOL IS NOT PREDICTING ITS RESULT. Nothing here says L0 will
    close, that L-EQ's equality holds, that any control will fire, or that any
    cell will adjudicate. The Coordinator prior on those questions was recorded
    at opening in batch.yaml and is not restated, revised or strengthened here;
    S9 must carry it forward VERBATIM.
  - >-
    I RAN NOTHING. No shell, no arithmetic tool, no hashing, no parser, no git,
    no network, no clock, no tools/allocate_id.py, no tools/validate_ledger.py,
    no tools/research_dispatch.py, no search_knowledge query. Every digest,
    commit sha, parse result, diff, line count and dispatcher figure appearing
    above is attributed at its point of use to the party that produced it. I
    minted no identifier: DEC-20260904-5216dd was pre-minted and verified free by
    the driving session before this task was dispatched.
  - >-
    THE KNOWLEDGE INDEX WAS NOT QUERIED. The batch's knowledge-retrieval
    obligation binds a PRODUCER asserting that a quantity for this curve has or
    has not already been computed in this program. This decision makes no such
    assertion and computes nothing. NO ABSENCE, NOVELTY OR NON-NOVELTY INFERENCE
    OF ANY KIND IS LICENSED BY THIS RECORD.
  - >-
    ZERO MODEL INDEPENDENCE. See model_independence. Four correlated readers,
    one model, model_verified false throughout. This approval rests on one
    careful reading and on machine-checkable conditions, not on agreement.
  - >-
    THE FOUR DIVERGENCES ARE RECORDED HERE BUT NOT SUPERSEDED HERE. This
    decision has no authority to edit batch.yaml or the queue's text on a
    governed disagreement, and it does not. C-6 requires the superseding record
    under a NEW DEC identifier that this decision does not mint.
  - >-
    NOTHING HERE IS DURABLE UNTIL COMMITTED, PUSHED AND ACCEPTED BY THE
    POST-COMMIT VERIFIER, AND THIS SESSION PERFORMED NONE OF THOSE. Until then
    this file is an authored opinion, S2 and S3 stay blocked, and an Executor
    that reads it in a working tree must refuse. An approval that exists only in
    a local commit is unpublished, not an approval.
  - >-
    SCOPE. Every conclusion this batch may reach is scoped to the curve labelled
    NIST P-224, to the parameters in the committed capsule at the digest C-5
    requires be verified, to pure-Python integer arithmetic, to this runtime and
    to the declared budget, and transfers to no other curve without re-running.
    Nineteen other SafeCurves goals are untouched by this decision.

