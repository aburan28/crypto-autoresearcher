    scope: "Bounded zero-run ideation, independent review, archival preparation, and publication within GOAL-SSI-2fa82a; no scientific trial or scheme-security claim."
  ranking:
    selected_uncertainty: >-
      Whether the unique degree-D=2^a map f:E->C satisfying f(P)=X when
      N>4D can be reconstructed, or only evaluated at U,V, in bit-polynomial
      time in lambda=log D from exactly O=End(E), E,C,P,X,D,N without a hidden
      Hom anchor, connecting isogeny, target frame/action, per-instance advice,
      or exponential preprocessing.
    why_now: >-
      It consumes the single recorded OBL-CSTAR-TRANSPORT-1 continuation and
      tests the narrow algorithmic gap left by BATCH-066c3b: uniqueness of the
      calibrated map did not provide a construction or evaluator. It ranks
      ahead of another broad PKE mechanism search because either a complete
      evaluator would unlock the retained actual-message decoder, or a scoped
      cost/collision diagnosis would localize the next missing lemma.
    positive_next_decision: "Submit at most one complete typed evaluator route to independent review and only then consider a separately approved implementation design."
    negative_next_decision: "Retain the exact failed route and measured symbolic obstruction without closing EndRing PKE; rerank a different construction ingredient."
    inconclusive_next_decision: "Carry forward one named missing theorem or interface with an explicit falsifier; do not repeat the same formulation automatically."
    excluded_peripheral_work: "No new PKE family, parameter proposal, implementation, trial, deployment claim, generic EndRing attack, M1/P2 route, or mutation of the three active audit hypotheses."
  rationale:
    - >-
      The packet is one mechanism with three mandatory views: orbit
      rational/Padé interpolation, recursive bidirectional 2-isogeny-chain
      lifting, and quaternion/ideal selection with exact calibrated map
      realization. These are controls on the same missing evaluator, not three
      unrelated scheme proposals.
    - >-
      Standard dense rational-map output and interpolation must charge explicit
      O(D)-scale coefficients/data/work unless a compressed evaluator theorem
      is actually supplied. That output-size argument is representation-scoped
      and is forbidden from ruling out an evaluator that returns only f(U),f(V).
    - >-
      Chain lifting must price the non-backtracking branches, graph collisions,
      meet-in-the-middle memory, and any locally checkable predicate. Endpoint
      and one-column consistency may prune only where a typed local test is
      given; no universal exponential lower bound is pre-authorized.
    - >-
      An ideal route must return and evaluate the exact normalized map to C
      carrying P to X. An ideal class, equivalent codomain, right order,
      abstract Hom module, or uniqueness statement is not the calibrated map.
    - >-
      The sublinear/transposed challenge is kept genuinely open: since its
      output is only two target points, dense-output size alone cannot refute
      it. The producer must either give an executable theorem/algorithm or
      expose the exact missing interface without declaring impossibility.
    - >-
      J1/J2 belong to a fresh blind validator and J3/J4/J5 to a fresh red team.
      The review plan freezes the Coordinator prior, ownership, controls, and
      blind re-derivation before any producer dispatch.
