coordinator_decision:
  id: DEC-20260806-bba4bf
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-e26b68
  recorded_by_task: TASK-20260806-688acb
  archived_by: TASK-20260806-688acb
  supercedes_records: [DEC-20260806-26c0e8]
  context: >-
    BATCH-e26b68 independent adversarial review (TASK-20260806-688acb,
    review-adversarial / xhigh, independent session) of the corridor-emptiness
    and geometric-cost-model findings recorded in DEC-20260806-26c0e8 and
    AMEND-EXP-MTBK-306bdb-001. Reviewer verdict: CONCUR_WITH_OBJECTIONS. The
    conclusion that no rescue-window rescues a finite K* holds, but the
    derivation as recorded is not self-consistent, and the run manifests had a
    provenance defect. This record accepts the review, corrects the cached
    derivation, and scopes the surviving promotion.

  decision: accept_review_and_correct_corridor_derivation
  target_ids: [GOAL-ECDLP-001, EXP-MTBK-306bdb, H-MTBK-001]
  target_ids_basis: >-
    Acts on the EXP-MTBK-306bdb protocol and its DECs; re-scopes the falsifiable
    corridor statement. H-MTBK-001 remains 'proposed' with no status change;
    the rescue-window clause in its falsification criteria is superseded by the
    corrected corridor statement recorded here.

  findings:
    - id: F1
      claim: corridor-model-conflation
      statement: >-
        Independent re-derivation (fresh, not re-read of the record) confirms
        the reviewer: the recorded corridor-emptiness bound is self-inconsistent.
        The hypothesis's own rescue-window model requires t_std < (m+1)/2,
        i.e. beta*B^(m-1) < sqrt(N); that model yields N < ((m+1)/2)^(2m/(m-2)):
        64 / 39 / 39 for m = 3 / 4 / 5, and the corridor IS empty at all planned
        toy sizes. But AMEND-001's written inequality used beta*(B/2)^(m-1) <
        sqrt(N), which yields N < (2^(m-2)(m+1))^(2m/(m-2)): about 262144 /
        160000 / 398000, and a NONEMPTY corridor at N in {1045, 5.2e4, 1e5} for
        m = 3. The amendment's written 'empty' verdict therefore did not follow
        from its own written condition.
      evidence: >-
        AMEND-EXP-MTBK-306bdb-001 analytical_derivation.corridor_emptiness;
        TASK-20260806-688acb review_report.yaml finding A.
      resolution: >-
        Corrected statement: under the hypothesis's own window (t_std_median <
        (m+1)/2, beta*B^(m-1) < sqrt(N)), the corridor is empty at all planned
        sizes, for all m in {3,4,5}. The historical AMEND-001 wrote (B/2)^(m-1),
        a different window, under which the corridor is NOT empty; that written
        window is superseded to match the hypothesis's own. The quantitative
        emptiness claim is restored to the hypothesis-model form and is verified
        numerically (corridor probe, m=3/4/5, N in {64, 1e3, 1e5, 5.2e4, 1e9}).
    - id: F2
      claim: measured-ratios
      statement: >-
        Reviewer independently confirms from RUN-MTBK-306bdb-cellgrid/result.json:
        mean descent ratio 1.0546, mean relation ratio 1.4056; no m=4,5 cell
        reaches 0.9*2^(m-1) (7.2/14.4); the only near-sweep cells are m=3 b=0.4
        (relation channel only): (p=1009,B=16) ratio 4.00 and (p=569,B=13) ratio
        3.35. The specific probe numbers cited in AMEND-001 probe_details
        (149/123 checks, 4251/3856) are from unarchived probes and are not
        re-computed anywhere; they are reported here only as probe-level evidence,
        not as corroborated run numbers.
      evidence: RUN-MTBK-306bdb-cellgrid/result.json (36 cells); review_report F2.
    - id: F3
      claim: rescue-falsified-empirically
      statement: >-
        The N=1045, B=16, m=3 cell (b=0.4, seeds 1/2, p=1009) lies inside the
        corrected rescue-window band (window: decomposable B >= 10.15 and
        constrained B <= 16.08 under the amended-written model); there the
        measured descent full-check ratio is 1.3716 / 1.4568, i.e. BKK does NOT
        rescue the descent channel (ratio > 1, baseline displaced), and the
        relation ratio is 4.00 = exactly the sweep domain ratio, not a rescue.
        So the rescue prediction is falsified empirically at the very cell the
        catch-it-bad version says should rescue. The corridor-emptiness argument
        is therefore not the only obstacle; the empirical ratio directly
        contradicts the rescue prediction.
      evidence: cell-grid result.json cells m3/b0.4/seed1,2.
    - id: F4
      claim: provenance-defect
      statement: >-
        Reviewer F-3: RUN-MTBK-306bdb-cellgrid manifest result.sha256
        (f5ae28b7...) did not equal the actual raw-result.json hash
        (17159730...); code.commit 089ff7158 is the dirty-tree base (the driver
        was uncommitted at run time); command.txt/deps/metrics were loose. The
        same hash defect affected the smoke manifest. Data internally consistent;
        manifest binding was not.
      evidence: review_report.yaml C.
      resolution: >-
        Fixed: both manifests re-canonicalized with result.sha256 equal to the
        raw artifact bytes; code driver_sha256 pinned (cellgrid 089c19...; smoke
        6ecb50...); worktree-base commit and dirty flag recorded. Verify at
        commit; correction committed in the same batch.
    - id: F5
      claim: cheapest-falsification
      statement: >-
        Review proposes the cheapest decisive falsification: FR-1 is already in
        the data (the existing N=1045/B=16/m=3 cell is a live window candidate
        and its ratio contradicts the rescue), and FR-2 (N=27, m=3, B=3 under
        the corrected window) decides the maximal-window case. Neither run
        required before record; both are cheap follow-ups.
      evidence: review_report D.

  decisions:
    - id: D1
      subject: corridor-derivation
      action: supersede_claim
      detail: >-
        The corridor-emptiness statement in DEC-20260806-26c0e8 / AMEND-001, as
        written with the (B/2)^(m-1) window, is SUPERSEDED. The surviving,
        corrected statement is in hypothesis-model form: under t_std < (m+1)/2
        (beta*B^(m-1) < sqrt(N)) the corridor is empty at all planned toy sizes
        (64/39/39). H-MTBK-001 falsification_criteria's rescue-window clause is
        superseded by this record; no rescue-window cell is claimed.
    - id: D2
      subject: promotion
      action: promote_scoped
      detail: >-
        The geometric first-success cost model (descent channel ~ N/B per
        target) is granted review-backed evidence standing, scoped to the toy
        naive-enumeration descent, grounded in cellgrid mean ratios and probe
        numbers with the probe-level caveat. The corridor-emptiness quantitative
        bound is NOT promoted until the corrected hypothesis-model window is
        re-verified in a run (FR-2). The empirical rescue-falsification at the
        (B=16, m=3) cell is granted evidence standing that the toy-scale rescue
        prediction is falsified. The actual KN-* corpus entries are declared as
        owed_promotions (pending KN-FIND records) per the ledger schema; no
        fabricated record id is claimed.
    - id: D3
      subject: provenance
      action: corrected
      detail: >-
        Run-manifest binding corrected (result.sha256 == raw bytes; driver_sha256
        pinned). Committed in this batch as a manifest-corrected revision per
        the validator's run-scheme. The smoke run's committed result is
        unchanged.
    - id: D4
      subject: followup
      action: dispatched
      detail: >-
        Budget a follow-up research task for FR-2 (N=27, m=3, B=3 maximal-cad
        window run) to settle the maximal window empirically, and suggest a
        full-sweep (memorized relation table) variant of the descent that would
        re-test the BKK theorem's own-cost window directly.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This decision corrects and re-scopes claims; it does not itself mint a
      KN-* record. The geometric-cost model and the empirical window-cell
      falsification are granted review-backed evidence standing by D2/D3 but the
      corpus entry is OWED, not yet written (no new KN-FIND id exists). No
      fabricated id is claimed; the obligations are declared below.
    promoted_caveat: >-
      KN-FIND-982fdf (C_t-minimality, theorem-tier) is retained; this decision
      does not demote it, and it remains a combinatorial statement about
      exhaustive sweeps.
  owed_promotions:
    - id: pending_kn_find_geometric_descent_model
      note: >-
        Geometric first-success descent model T ~ N/B per target for naive
        ordered enumeration at toy scale, both std and BKK enumerators
        (cellgrid mean descent ratio 1.055, probe 149/123 checks at
        N/B=228). Review-surviving (F2) with probe caveat.
    - id: pending_kn_find_windowcell_falsification
      note: "Toy-scale rescue of an infinite K* by BKK is falsified at the live window cell (B=16, nCell 1045, m=3): measured descent full-check ratio 1.37-1.46 (>1), relation ratio 4.00."
  pareto_integrity:
    dominated_by: Pollard rho family (multi-target) at exponent 1/2
    sota_delta: none
  claim_ceiling: corrected (rescue-window overreach replaced by testable ratio)
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-06'

  files_changed:
    - experiments/EXP-MTBK-306bdb/runs/RUN-MTBK-306bdb-cellgrid/manifest.yaml
    - experiments/EXP-MTBK-306bdb/runs/RUN-MTBK-306bdb-smoke/manifest.yaml