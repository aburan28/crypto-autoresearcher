      Consume-only off-slice census of RUN-ECDLP-5cad48-S2OC.
      Off-slice gap is G_exact / M_eff minus max_pi_c.
      Record whether every cell is off-slice-positive and
      whether the miss is unique in that property. No new
      label rebuild.
    dominated:
