      - rerun of EXP-ECDLP-56ee42
      - approval of EXP-ECDLP-3930b1
      - CAND-D2-A
      - designing an unrelated open ECC idea to keep the loop turning
    sota_delta: >-
      Not a complexity claim. The selected act makes
      off-slice max pair-rate an official property of
      the four archived occupancy cells.
    dominated_by: null

