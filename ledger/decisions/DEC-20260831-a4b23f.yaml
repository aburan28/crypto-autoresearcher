coordinator_decision:
  id: DEC-20260831-a4b23f
  context: >-
    This Coordinator decision composes the independent Validator (J1,
    `passed`/`breaks`) and Red Team (J2,
    `holds_with_findings_that_sharpen_and_partially_qualify_the_disposition`)
    reviews of EXP-MONO-670aa6's execution: a corrected-calibration
    replication of H-MONO-663fb4's K3/K4 discriminating test, itself the
    named next_action of DEC-20260830-891d39 after EXP-MONO-c819ba's
    escalated finding was retracted. Both reviewers independently confirmed
    and sharpened this Coordinator's own pre-review finding
    (CORR-20260831-d15d36) that the run's declared primary test had zero
    statistical power by design and that its enrichment comparison is
    compromised. This decision adopts both reviewers' converged
    disposition, including the Red Team's refinement of the "K3/K4
    remains open" characterization.
  decision: revise
  decision_label: >-
    identities_and_dual_path_on_100_cells_confirmed_declared_primary_test_had_zero_statistical_power_by_construction_enrichment_comparison_compromised_k3_k4_remains_open_properly_powered_successor_named
  target_ids:
    - H-MONO-663fb4
    - EXP-MONO-670aa6
    - RQ-MONO-001
    - EV-MONO-849355
    - CORR-20260831-d15d36
    - CORR-20260831-9e3b12
    - knowledge/techniques/KN-TECH-95a42b.md
    - knowledge/techniques/KN-TECH-7745e6.md

  hypothesis_status_before: partially_supported_instrument_uncalibrated
  hypothesis_status_after: partially_supported_instrument_uncalibrated
  hypothesis_status_after_note: >-
    UNCHANGED. This experiment's failure is design-level (zero statistical
    power), not a new reading of H-MONO-663fb4's mechanism; nothing here
    moves the hypothesis toward or away from support. The status set by
    DEC-20260830-891d39 already anticipates exactly this kind of
    instrument-level uncertainty and remains the accurate label pending a
    properly powered test.

  experiment_status_before: approved
  experiment_status_after: completed
  experiment_status_after_note: >-
    Completed with its declared primary metric uninterpretable by design,
    disclosed prominently rather than reported as a clean pass. Per
    AGENTS.md rule 3 analogue, this is a design/instrument-level outcome,
    never negative (or positive) mathematical evidence about H-MONO-663fb4.

  official_status_changes:
    goal_status_changed: false
    goal_status_after: paused
    hypothesis_status_changes: []
    experiment_status_changes:
      - experiment_id: EXP-MONO-670aa6
        from: approved
        to: completed
    resource_disposition_changed: false
    completion_criteria_met: []
    implementation_authorized: false
    experiment_runs_authorized: 0
    scientific_interpretation_authorized: true
    closure_authorized: false
    breakthrough_authorized: false

  rationale:
    - >-
      STAGE 0 AND THE DUAL-PATH CHECK ON THE 100 REAL-ARM CELLS HOLD,
      CONFIRMED BY BOTH REVIEWERS. Fixture identities exact; route-1/
      route-2 agreement <1e-9. The Red Team's scope correction is adopted:
      this validity claim covers the 100 real-arm cells specifically, not
      the full >20,000-draw computation the p-value machinery depends on
      (a disclosed validation-coverage gap, not a demonstrated bug --
      the Red Team's own supplementary 120-draw check found no actual
      disagreement).
    - >-
      THE DECLARED PRIMARY TEST HAD ZERO STATISTICAL POWER BY
      CONSTRUCTION, CONFIRMED EXACTLY AND INDEPENDENTLY BY BOTH REVIEWERS
      VIA DISJOINT METHODS. At n=200 null draws, the permutation p-value
      floor (1/201) exceeds every declared family's Holm-Bonferroni
      threshold (alpha/m, m in 49-100) by 5-10x -- an unconditional
      arithmetic fact, not a data-dependent judgment call. Both reviewers
      independently re-derived this from first principles and confirmed
      the archived data's actual minimum p-value lands exactly on the
      theoretical floor. This directly falsifies this contract's own
      `approval_requirements` assertion that the null-object gate
      "genuinely can trigger" -- a requirement this Coordinator's own
      approval asserted without the arithmetic check that would have
      caught it, a process finding taken seriously below.
    - >-
      THE PANEL-INDEPENDENCE DEFECT IS SHARPER THAN THIS COORDINATOR'S
      OWN DISCLOSURE, AND A SECOND, INDEPENDENT CONTAMINATION WAS FOUND.
      Both reviewers confirmed, by re-running the frozen implementation
      directly, that 100% (not "many") of matched curve_ordinal pairs
      share an identical prime, B coefficient, and acceptance index; the
      Validator additionally found 58% of the realized j0 panel is
      forced-supersingular, an independent and previously-unquantified
      threat to the same comparison. The Red Team's practical assessment
      -- that the qualitative "no enrichment" reading is unlikely to
      reverse, though the numeric p-values are not citable as formally
      valid -- is adopted as the working characterization pending a
      properly reconstructed panel.
    - >-
      "K3/K4 REMAINS OPEN" IS RETAINED, WITH THE RED TEAM'S REFINEMENT
      ADOPTED VERBATIM IN PLACE OF THIS COORDINATOR'S OWN ORIGINAL
      "ZERO DISCRIMINATING INFORMATION" PHRASING. The declared procedure's
      power is genuinely zero; the archived data's information content is
      not exactly zero. Three independent, non-floor-limited readings --
      the Red Team's own exploratory Fisher-combined reanalysis of this
      run's data, EXP-MONO-c819ba's 254-curve enrichment test, and that
      review's z-score reanalysis -- lean mildly, non-conclusively,
      toward no exceptional locus. This is accepted as informative context
      for ranking, explicitly NOT as pre-registered evidence (per this
      contract's own invalidation_rules), and changes no status here.
    - >-
      A CHEAP CANDIDATE FIX IS NAMED, NOT ADOPTED HERE: pre-registering a
      Fisher-combined, per-family panel-level statistic alongside (never
      instead of) a per-curve test sidesteps the floor-vs-threshold
      problem entirely, since it applies no per-test correction. This
      belongs in a properly designed successor contract's frozen text,
      not retrofitted onto this completed run.
    - >-
      A CROSS-CUTTING FINDING IS DISCLOSED, NOT RE-ADJUDICATED: the same
      floor-vs-threshold arithmetic is present, unremarked, in
      EXP-MONO-c819ba's own already-closed Red Team review's "Bonferroni
      over 96 = 1.000" sentence. This does not reopen EV-MONO-b84b24 or
      DEC-20260830-891d39 -- that record's conclusion rests on four other,
      non-floor-limited lines of evidence -- and is instead filed as a
      dated addendum to knowledge/techniques/KN-TECH-7745e6.md, per the
      Red Team's own recommended disposition (it is not authorized to
      write ledger corrections itself; AGENTS.md rule 1).
    - >-
      A GENUINE COORDINATOR-LEVEL PROCESS FINDING IS ACCEPTED, NOT
      DEFLECTED: this contract's own `approval_requirements` asserted a
      condition (the gate can genuinely trigger) that was unsatisfiable by
      construction and was not checked before this Coordinator's own
      approval. The remedy -- compute floor vs. alpha/m for every declared
      correction family at design time, before any draw -- is now
      documented as knowledge/techniques/KN-TECH-95a42b.md and is adopted
      as a mandatory pre-approval check for any future experiment
      declaring a permutation-test-plus-multiple-comparison design in
      this program.

  next_action: >-
    Design and dispatch a properly re-derived successor K3/K4 contract
    (NOT the out-of-band-edited text of the current on-disk
    specification.yaml, which is disclosed but not authorized), applying:
    (1) the design-time floor-vs-threshold check (KN-TECH-95a42b) for
    every declared correction family, both statistics, before approval;
    (2) a pre-registered Fisher-combined panel-level statistic as a SECOND
    primary metric alongside the per-curve Holm test; (3) a `family`
    discriminator threaded through EVERY seed call site (prime, curve-a,
    curve-b, null-subset, null-object-pick), verified by a direct
    extraction-and-comparison script before approval, not by inspection
    alone; (4) an extended dual-path control covering a random sample of
    null and null-object draws, with persisted and thresholded
    route2_max_round_residual/route2_max_imag_residual diagnostics; (5) a
    legacy sub-panel guaranteed to realize >=2 subgroup-capable curves, or
    an explicit statement relying on a named prior experiment's positive
    control instead; (6) explicit separation of the j0 family into
    ordinary and supersingular sub-arms, or an ordinary-curve admission
    rule stated and verified in the frozen text itself, not merely
    disclosed as an implementation deviation.

  knowledge_promotion:
    promoted: [KN-TECH-95a42b]
    promotion_note: >-
      New knowledge-technique entry, checked non-duplicative of
      knowledge/techniques/ and knowledge/findings/ (nearest relative,
      KN-FIND-031, documents a different lane's related but distinct
      "empirical floor = resolution limit, not a distribution property"
      finding; cross-referenced, not duplicated). Documents the
      permutation-p-value-floor-vs-Holm-Bonferroni-threshold design-time
      check, independently confirmed by both reviewers as the root cause
      of this experiment's zero statistical power, and cross-links
      KN-TECH-7745e6 as a distinct, complementary calibration check.
      A dated addendum was also appended to KN-TECH-7745e6.md itself
      (2026-08-31), disclosing that its own worked Bonferroni example was
      independently found, by this cycle's Red Team, to have been
      guaranteed non-significant by the identical arithmetic -- filed as
      a documentation completeness note, not a retraction of that entry's
      own (still-valid) conclusion.
    not_promoted_reason: null

  procedure_deviations:
    - >-
      None from the review_plan itself: both reviews dispatched
      concurrently, post-snapshot, with disjoint joints (Validator =
      J1-correctness, Red Team = J2-adversarial), both attest
      read_sibling_reports: false, and both were explicitly instructed to
      blindly re-derive the two named defects from raw data/source before
      reading this Coordinator's own CORR-20260831-d15d36 prose -- both
      confirm having done so.
    - >-
      GOVERNANCE FINDING, DISCLOSED: this is the ELEVENTH out-of-band
      "Cursor Agent" commit this session (CORR-20260831-d15d36), the
      first where two of its named defects were independently re-derived
      and confirmed by this Coordinator (and subsequently by both
      reviewers) rather than merely disclosed as plausible. The edit is
      NOT adopted as an authorized protocol amendment; this decision and
      EV-MONO-849355 are composed against the run as actually executed
      (frozen text at commit 9e0e460e3), per this session's established
      practice.
    - >-
      A distinct, disclosed documentation hazard, confirmed by the
      Validator (OTHER-FINDING-4) and named by the Red Team as a required
      control: the currently-committed specification.yaml at HEAD is the
      post-tampering text and does not describe what RUN-MONO-670aa6-1/2
      actually executed against; only git history and CORR-20260831-d15d36
      resolve this. Not remediated here, per the "never revert, always
      disclose" policy; named as a required control for the successor
      contract instead (a machine-readable pointer at the top of any
      future specification.yaml).
    - >-
      A TWELFTH out-of-band commit landed during this ledger archive's
      own pre-commit merge, editing implementation/{conv.py,
      run_experiment.py} to persist exactly the artifact-completeness
      gaps both reviews independently flagged. Disclosed in
      CORR-20260831-9e3b12; content-benign to this decision (the
      already-archived RUN-MONO-670aa6-1/2 raw-result.json files are
      immutable and unaffected); not adopted or reverted.

  limitations:
    - >-
      This decision does not itself design or run the named successor
      contract; it authorizes and specifies the next action only.
    - >-
      The Red Team's exploratory Fisher-combined reanalysis and its
      "leans mildly toward no exceptional locus" characterization are
      informative context, explicitly not pre-registered evidence, and
      must not be cited as establishing a controlled-null finding for
      H-MONO-663fb4.
    - >-
      Model-correlation confound: both reviewers this round resolved to
      claude-sonnet-5, matching this Coordinator and the experiment's own
      author. Both reviews explicitly disclose this and argue their
      independent, pre-reading re-derivation -- which found the defects
      WORSE than claimed, not milder -- is evidence against rubber-
      stamping rather than for it; this Coordinator concurs but notes the
      confound is not eliminated.
    - >-
      This decision does not reopen or adjudicate EV-MONO-b84b24 or
      DEC-20260830-891d39; the cross-cutting Bonferroni-arithmetic finding
      against that record's cited technique entry is filed as a dated
      addendum only, per the Red Team's own recommended, narrower
      disposition.

  reviewed_by: [validator-mono-670aa6, red-team-mono-670aa6]
  decided_by: coordinator
  decided_at: '2026-08-31'
  inference:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
