  context: >-
    BATCH-121's two analyses (TASK-20260805-004 oracle/H-PSEUDO,
    TASK-20260805-005 doubling-oracle closure + multi-target BKK) were
    committed under DEC-20260805-364e9e WITHOUT any independent reviewer,
    validator, or red-team pass. BATCH-e0ccb2 is the review-only audit that
    discharged that obligation. Three independent review-adversarial sessions
    examined the immutable BATCH-121 documents and the DEC dispositions; this
    decision confirms or supersedes each disposition on those findings, with
    one evidence reference. NO experiment ran and no claim is promoted.

  central_adjudication: >-
    THE BATCH-121 HEADLINE CLOSURE IS BROKEN, AND THE PROGRAM CAUGHT IT AT
    REVIEW WHEN IT SHOULD HAVE CAUGHT IT AT BATCH TIME. Every disposition of
    DEC-20260805-364e9e is now adjudicated on the review record:

    1. IDEA-20260805-58b638 "CLOSED as rejected — barrier confirmed, simulable
       oracle, no sub-rho path" — SUPERSEDED, INVALID. The closure rests on two
       premises, both false: (i) O_D is NOT GGM-simulable — a single halving
       query O_D([2^-1]Q) = x(Q) recovers the target x-coordinate in one call,
       so O_D is ALGEBRAICALLY EQUIVALENT to the x-coordinate oracle, which the
       companion document (TASK-20260805-004) itself classifies NON-SIMULABLE
       Tier-3 and sub-rho-enabling; and (ii) the document's own doubling
       closed-form is wrong (printed form disagrees at 3/475 — validator — or
       6/950 — reviewer — affine points on the test curve; correct form
       (x^4-2a·x^2+a^2-8b·x)/(4(x^3+a·x+b)) matches all). The "barrier
       confirmed" conclusion and its ord_q(2) chain reasoning are void. The
       correct statement is: O_D ≡ x-oracle, so its sub-rho power reduces to
       the OPEN x-oracle-alone question and nothing more.

    2. IDEA-20260805-62ef74 "DISPATCH for formal theorem work (corrected
       biconditional; C_t minimality; ECCG unification)" — CONFIRMED in
       substance, with two amendments: the "UNCONDITIONALLY" label on
       L[1/2, sqrt(2)] ~ 2^61.7 is rescinded (the arithmetic is right at
       2^61.85, but the claim is heuristic-conditional, and the DEC's
       "UNCONDITIONALLY" wording must not survive); and the biconditional is
       treated as a disjunction-with-o(1)-leaf to PROVE, not as an established
       iff. C_t Tier-3 classification PASSES.

    3. IDEA-20260805-0cd03f "APPROVED for experiment design (multi-target
       BKK)" — CONFIRMED with exact-arithmetic corrections: K*(BKK)=96 is
       right; K*(standard)=2000 (doc's 2001 is an IEEE-float ceil artifact:
       200/0.1=2000.0000000000005); one cell (m=4: 126 vs 125) is the same
       artifact. EV-SEMAEV-7f7d22 must be pre-registered against exact
       rational arithmetic with the linear-algebra and memory terms included;
       the "provable" label is downgraded to a model assumption (theorem
       KN-FIND-c7d31e's speedup is for the membership predicate, not the beta
       transfer).

    The dispositions that survive do so on the reviewers' independent
    computations, not on the DEC's own as-committed text. All three sessions
    converged independently: this is a confirmed audit result, not a
    re-packaging of one reviewer.

  what_survives:
    - >-
      IDEA-20260805-62ef74 as a research action: formalize the corrected
      H-PSEUDO biconditional and prove or kill the o(1) branch; prove C_t
      minimality as a standalone lemma. The orientation fix (holding =
      pseudorandom = AT-heuristic yield; chain-complex sub-rho requires
      FAILURE) is CORRECT, consistent with H-PSEUDO-83817b.
    - >-
      IDEA-20260805-0cd03f as an experiment-design action: K* formulas, rescue
      region t in [1,(m+1)/2), and the 96-cell number all verify.
      EV-SEMAEV-7f7d22 remains correctly reserved and bound by BATCH-122.
    - >-
      C_t / encoding-oracle NON-SIMULABILITY (Tier 3) classification from the
      BATCH-060 control.
    - >-
      The BATCH-121 committed artifacts as immutable historical records (they
      are superseded in disposition, not retracted or edited).

  what_is_struck_or_superseded:
    - >-
      "IDEA-58b638 CLOSED as rejected (barrier confirmed; simulable;
      ord_N(2)=Omega(sqrt(N)); no sub-rho path)" — SUPERSEDED. Premises
      (simulability, barrier confirmed, no-sub-rho) all fail; see adjudication
      item 1.
    - >-
      "Semaev IC is sub-rho (L[1/2, sqrt(2)] ≈ 2^61.68 << 2^128) in GGM+C_t
      UNCONDITIONALLY" — SUPERSEDED as stated. The arithmetic is fine; the
      claim is heuristic-conditional on smoothness, yield formalization, and
      factor-base construction (unconsidered).
    - >-
      The closure document's "verified at all affine points" statement —
      STRUCK. The printed formula is wrong; the verification claim as printed
      does not hold.
    - >-
      The implied GGM-simulable realization for O_D — struck. O_D carries the
      encoding (x-coordinate) observable, so it is non-simulable Tier-3, not
      GGM-simulable.

  weighing_of_the_review: >-
    Accepted in full. Each role that attacked the halving-query point from an
    independent angle reached the same mathematical fact; two roles additionally
    computed the doubling-formula mismatch independently on the document's own
    test curve (validator 3/475; reviewer 6/950 — different point counts, same
    conclusion). The red-team also refined the Pareto honesty blocks
    (dominated_by/sota_delta in DEC-364e9e are honest; the overclaim wording
    lives in the derived findings, not the Pareto block). The two ledger gaps
    (KN-FIND-9d2f56 wording not updated; dangling DEC-20260804-384a4a
    reference) are accepted as bookkeeping defects to repair by successor
    records, not by editing the immutable originals.

  hypothesis_status_changes: []
  hypothesis_status_note: >-
    No hypothesis moves. This is an audit batch: nothing about the sub-rho
    question, the x-oracle alone, or the doubling oracle is established in
    either direction by the corrections above. RQ-ECDLP-002 remains active;
    H-STR-002 remains weakened per prior decisions; no status transition is
    performed beyond the idea-level disposition corrections recorded in this
    decision.

  rule_12_status: >-
    NOT INVOKED. No breakthrough, closure, or contradiction of validated
    evidence is claimed; EV-ECDLP-4c1e8b is a plain independent-review audit.
    A contradiction between two committed BATCH-121 documents (O_D
    simulability) was surfaced by the reviews, but it is adjudicated here as a
    superseding decision over committed analyses, not as a claimable
    contradiction between validated evidence records.

  knowledge_promotion:
