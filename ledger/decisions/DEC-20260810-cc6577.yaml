coordinator_decision:
  id: DEC-20260810-cc6577
  context: >-
    EXP-ICINV-4d33aa version 3 (protocol_amendment v3, dispatched by
    TASK-20260810-3c448e) executed and terminated `OUTCOME-C` --
    `RUN-ICINV-849d1d` -- the first outcome state this experiment has
    reached in three protocol versions (v1 and v2 both terminated INVALID
    at admissibility gates, per DEC-20260809-de11f9). Two independent
    reviews (a Validator re-deriving every numbered check, a Red Team
    challenging the interpretation) were dispatched before this decision
    was written, per this campaign's standing practice for consequential
    results. Both returned `passed_with_findings`-equivalent verdicts:
    `OUTCOME-C` is mechanically correct, but its evidentiary weight is
    materially narrower than the execution report's own framing conveyed.
    This decision, and the accompanying correction (CORR-20260810-a4c123)
    and evidence record (EV-ENDO-eb58c4), are written to that narrower
    standard.
  decision: reject_scoped
  target_ids:
  - GOAL-ENDO-001
  - BATCH-74ebef
  - EXP-ICINV-4d33aa
  - H-ICINV-6c7920
  - RQ-ICINV-475b5e
  - EV-ENDO-10109d
  - CORR-20260807-d78e2f
  rationale:
  - >-
    TERMINAL STATE OUTCOME-C, INDEPENDENTLY RE-DERIVED THREE TIMES (this
    Coordinator, a Validator, a Red Team), NOT ACCEPTED ON THE EXECUTOR'S
    REPORT ALONE. `aggregate_persistence: PERSISTS` (2 of 3 primes, p=6007
    dissenting), `stratification_verdict: NEGATIVE` (`S_prime_positive`
    False at all three primes). Applying `specification.yaml`'s
    `frozen_decision_rule` to these inputs by hand independently confirms
    `state_4_OUTCOME_C_neither` is the only state that fires. This
    discharges falsification condition F-i/F-ii of H-ICINV-6c7920: the
    coverage/r mechanism this hypothesis proposes as the explanation for
    EV-ENDO-10109d's over-dispersion does not survive a certified
    full-group sampler test built specifically to detect it.
  - >-
    THIS IS THE DIRECT, PRE-COMMITTED ANSWER TO CORR-20260807-d78e2f's
    NAMED CONFOUND, NOT AN ORTHOGONAL RESULT. That correction identified
    the committed sampler's coverage gap (r=3 curves reach only half their
    group) as a mechanism "of exactly the right shape" to manufacture
    EV-ENDO-10109d's entire over-dispersion finding, and its own
    `required_action` pre-committed to a superseding evidence record once
    EXP-ICINV-4d33aa reported an outcome, stating which. `EV-ENDO-eb58c4`
    is that superseding record, discharging the obligation two versions
    and three days after it was named as due.
  - >-
    INDEPENDENT REVIEW FOUND THE EVIDENTIARY WEIGHT NARROWER THAN THE
    EXECUTION REPORT CONVEYED, AND THIS DECISION IS CALIBRATED TO THE
    NARROWER READING. Full findings in CORR-20260810-a4c123, independently
    spot-checked by this Coordinator before being accepted: (1) zero of the
    three primes in the reported majority represent measurement taken
    after the gate redesign that was not already knowable from records
    predating it -- even p=2003, the run framed as "closest to blind",
    reproduces bit-for-bit a version-1 measurement disclosed in amendment
    v2.yaml's own text three days before v3 existed; (2) the redesigned
    SR3 gate has a 44.3-45.0% false-pass rate under a genuine null at the
    sample sizes used here, a 40-50x weakening of the literal check it
    replaced, so `gate_passed: True` at p=6007 certifies far less than a
    flat reading suggests; (3) reassuringly, the aggregate PERSISTS
    verdict does not depend on the weakly-admitted prime -- discarding
    p=6007 (both the engineered leg and the sole dissent) leaves p=2003
    and p=4001 agreeing 2-for-2 without it; (4) every version-3 run's own
    `manifest.yaml` misidentifies its contract version (a real, previously
    undisclosed code defect, does not corrupt the terminal-state
    computation).
  - >-
    A NEW, QUANTITATIVELY SUBSTANTIAL, PREVIOUSLY UNDISCLOSED CANDIDATE
    CAUSE WAS FOUND BY THE RED TEAM AND INDEPENDENTLY CONFIRMED BY THIS
    COORDINATOR WITH A FRESH RE-ANALYSIS OF ALREADY-COLLECTED DATA (zero
    new runs). Regressing pooled variance ratio against measured density
    at every prime, in both the pre-existing Arm A0 baseline and this
    run's Arm B: R^2 = 0.50-0.93. The SAME already-computed r-split
    explanatory power (`VR_within/VR_pooled`, the contract's own S2 check)
    is approximately 0% (-0.7% to 0.8%) at every prime. "Density-independent",
    used throughout this campaign since EV-ENDO-10109d, is retracted as a
    description of this phenomenon; "does not decay to 1 at high density"
    is the accurate, narrower substitute. `factor_base_fixed_size`'s
    deterministic first-liftable-x construction is named as the leading
    untested candidate cause, distinct from both saturation (eliminated)
    and sampler coverage (eliminated by this run).
  - >-
    `reject_scoped`, NOT A BROADER REJECTION, BECAUSE ONLY THE SPECIFIC
    COVERAGE/r CAUSAL CLAIM IS REFUTED. EV-ENDO-10109d's own over-dispersion
    observation is not rejected -- it PERSISTS under a harder test than it
    had previously faced, and is, on this narrow point, more firmly
    established than before this run, even as the campaign's leading
    candidate explanation for it is eliminated and no replacement is yet
    in hand. H-ICINV-6c7920's Stage 1 coverage-certificate finding (r
    exactly fixes coverage fraction) is UNTOUCHED by this run and remains
    a correct, exact, certified fact; what fails is the causal step from
    that fact to EV-ENDO-10109d's variance excess.
  evidence_refs:
  - ledger/evidence/EV-ENDO-eb58c4.yaml
  - ledger/corrections/CORR-20260810-a4c123.yaml
  - experiments/EXP-ICINV-4d33aa/runs/RUN-ICINV-849d1d/decision-rule-evaluation.json
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-74ebef/execution/EXP-ICINV-4d33aa-v3/execution_report.md
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-74ebef/execution/EXP-ICINV-4d33aa-v3/validation_report.md
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-74ebef/execution/EXP-ICINV-4d33aa-v3/redteam_report.md
  limitations:
  - >-
    This Coordinator independently re-derived the terminal state, spot-
    checked the F1 bit-identity claim (a fresh diff of the two runs'
    baseline-reproduction.json), spot-checked the F2 manifest defect (a
    fresh grep), and independently reproduced the density-vs-r explanatory
    contrast (a fresh regression against already-committed rows). It did
    NOT independently re-derive the Validator's A8 cross-check bisection,
    the A9 sha256 recomputations, or the Red Team's exact false-pass-rate
    integral (the regularized incomplete gamma function calculation) --
    these are cited from the two reports as their own independently
    obtained results, cross-checked against each other where they overlap
    (both reports independently confirm F1's timeline and the A9 audit
    table), not re-verified a third time from first principles by this
    Coordinator.
  - >-
    The density-vs-r regression in EV-ENDO-eb58c4's observations is a free
    re-analysis, not a new, independently designed and controlled
    experiment; it names a candidate, it does not test one, and it has not
    itself been through independent review.
  - >-
    Toy scale throughout (p in {2003, 4001, 6007}), `claim_tier: toy`.
    `sota_delta` is zero; nothing here is an attack-cost claim in any
    direction, and r remains provably irrelevant to the ECDLP in the
    prime-order subgroup (KN-TECH-030).
  next_actions:
  - >-
    N13 (new, HIGH PRIORITY). Investigate the density-linked candidate
    cause named above: a randomized (not first-liftable-x) factor-base
    construction, matched in size at each density, as one additional cheap
    arm on the existing classes/seeds/target-counts. This requires a
    versioned protocol_amendment (v4, or a fresh experiment contract, a
    Coordinator drafting decision) before any dispatch -- not undertaken
    by this decision.
  - >-
    N14 (new, BLOCKING on any further EXP-ICINV-4d33aa dispatch). A
    protocol_amendment v4 must redesign SR3's admissibility gate to
    disclose its own false-pass probability under NULL-B's true-null model
    at every row, and should consider whether a tighter confidence level
    or an equivalence-test formulation restores discriminating power
    without reintroducing the literal-band defect v3 fixed. No further
    version-3 dispatch is authorized until this lands.
  - >-
    N15 (new, code fix, blocking on further v3-path dispatch).
    `harness/run_fullgroup.py:write_run_package` must wire
    `HANDOFF_ID_V3`/`CONTRACT_VERSION_V3`/`AMENDMENT_PATH_V3` through (or
    take an explicit version parameter) so run manifests self-identify
    correctly.
  - >-
    N7 and N11 (carried, untouched by this batch). Full list in
    DEC-20260808-3312cc.next_actions, DEC-20260809-4081cc.next_actions, and
    DEC-20260809-de11f9.next_actions; N7 itself was corrected and
    discharged by CORR-20260810-6e4fa7 / H-CANL-e59a06 / EXP-CANL-96b0ad
    earlier in this same batch.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      The mechanism-elimination is `preliminary` strength on evidence this
      decision's own rationale characterises as weaker than its execution
      report conveyed; promoting it now would launder a narrow-margin,
      independently-caveated result into the corpus as settled. The
      density-linked candidate cause is a re-analysis, not a tested
      finding, and is even further from promotion-ready. Revisit after N13
      (density arm) and N14 (gate v4) both land.
  decided_by: coordinator
  decided_at: '2026-08-10'
  inference:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: claude-sonnet-5
    reasoning_effort: null
    fallback_used: true
