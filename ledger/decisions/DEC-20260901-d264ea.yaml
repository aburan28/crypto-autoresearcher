  # =====================================================================
  # PER-ITEM DISPOSITION. HOLDS | REVISED | REMAINS OPEN, EACH CITING THE
  # REPORT FINDING THAT SUPPORTS IT.
  # =====================================================================
  item_dispositions:
    - item: ITEM 1 — protocol-amendment-GOAL-AES-002-004 (TASK-20260901-e045b8)
      disposition: REMAINS OPEN
      disposition_detail: >-
        The amendment is ACCEPTED AS A COMMITTED RECORD and is NOT withdrawn,
        edited or superseded by this decision; what is NOT accepted is its
        `scope_of_amendment` claim to close AMB-5 and AMB-6. Four
        constructions exhibit two readers, each conforming to 004's own
        clauses, reaching opposite verdicts: OBJ-1 (MEDIUM_HIGH, no
        precedence rule between A-2 and A-3(i), attack Q), OBJ-2 (HIGH, A-2's
        intensional consumption test versus its extensional "that is" gloss,
        attacks P and P'), OBJ-3 (MEDIUM_HIGH, no rule for a data-dependent
        early-aborted evaluation, attack S), OBJ-4 (MEDIUM, nothing
        individuates a "stage", attack H). AMB-5 and AMB-6 are therefore NOT
        closed and a margin resting on any of these four shapes is not
        adjudicable under CM-1 as amended.
      what_nonetheless_holds: >-
        VAL J3 verdict `holds`, and it is not a formality: the validator
        re-derived the Gap B proves-too-much control on the m=0 definitional
        reference to BUNDLED independently and found it FORCED, checked the
        double-charging absurdity it guards, executed clauses A-1/A-2/A-3
        and the rejected candidate rule as code over six inputs (AMD-004
        total, single-valued and implementation-invariant on all six; the
        rejected rule neither), and confirmed amendments 001/002/003 and CM-1
        BYTE-UNCHANGED by sha256 at the opening commit and at HEAD. HELD-4
        finds A-3(ii) tight against the on-the-fly-table attack and calls it
        the strongest text in the amendment; HELD-1 finds no break in the
        over-correction direction; HELD-2 finds the supersession confined as
        claimed (`git diff` of -003 between df9f89135 and the snapshot is
        EMPTY). Clause A-1's invariance-under-implementation-technique gain
        is real and closes AMB-5's fused T-table case. BOTH FINDINGS ARE TRUE
        AT ONCE AND NEITHER CANCELS THE OTHER: applying a rule to the cases
        its author chose and searching for cases the rule does not determine
        are different tests.
      severity_ordering: OBJ-2 (HIGH) > OBJ-1, OBJ-3 (MEDIUM_HIGH) > OBJ-4 (MEDIUM) > OBJ-5, OBJ-6 (LOW)
      cited_findings: [OBJ-1, OBJ-2, OBJ-3, OBJ-4, OBJ-5, OBJ-6, HELD-1, HELD-2, HELD-4, VAL J3, AMB-5, AMB-6, L4, L5]
    - item: ITEM 2 — BLK-1 alternative fix (TASK-20260901-eb81f4)
      disposition: HOLDS
      disposition_detail: >-
        VAL J1 verdict `holds`, method `reproduced_in_isolated_worktree`, and
        the discharge is genuine rather than a byte-comparison: the
        discriminating probe shows the fix flips exactly the three
        key_recovery cases and nothing else, the null-object control shows
        all four bad-kind variants (including the near-miss typo
        "key-recovery") still emit the protected literal BYTE-EXACT under
        both modules, the regression cases are untouched, the explanatory
        control shows zero existing run manifests declare
        `certificate.kind: key_recovery` so byte-identical whole-repo output
        is PREDICTED rather than the signature of a dead path, and the
        counterfactual reword independently measures the producer's stated
        cost (1210 -> 1098 suppression, exactly 112 fewer; 116 = 4 + 112
        errors; 112 baseline lines end in the protected literal). The
        declared patch equals the committed diff (110 lines, zero hunks) and
        the full error-line SETS agree pre and post.
      what_it_does_not_establish: >-
        IT DOES NOT CLOSE BLK-1, AND THIS DECISION DOES NOT CLOSE IT EITHER.
        The validator declines closure explicitly
        (`blk1_closure_statement`), and the executor names the gap in its own
        SC-9 list: tools/cairn_bridge.py has no key_recovery checker, the
        two-implementation independent verifier that
        protocol-amendment-GOAL-AES-002-001 demands is not implemented in
        harness/runner.py, and check_run enforces no structure on key_bits,
        rounds, statement.pairs or statement.key. A conforming run may now
        RECORD `kind: key_recovery`; nothing yet re-verifies such a
        certificate. PAUSE CONDITION P3 REMAINS LIVE.
      accepted_costs: >-
        The rejection message now under-enumerates the accepted vocabulary,
        deliberately, so the 112 grandfathered baseline entries keep matching;
        disclosed in three committed places and judged adequate and correctly
        located by the validator. Two residual costs the producer did not name
        are carried forward as OI-6 of EV-AES-5283c8.
      cited_findings: [VAL J1, VAL control_checks null_object/negative/regression/discrimination/explanatory/counterfactual, OBS-E3858F-2]
    - item: ITEM 3 — C2 paired-validation design v2 (TASK-20260901-6afe39)
      disposition: REVISED — DEFECT 1's REPAIR HOLDS, A NEW SYMMETRIC HOLE IS OPEN, DESIGN REMAINS UNAPPROVED
      disposition_detail: >-
        DEFECT 1's byte-identical-state_0 repair HOLDS on two independent
        methods: the validator re-implemented S1 and S2 from the v2 text
        alone and traced 24 cases (byte-identical state_0 and K, K' on all
        24; S2 draw count exactly 2R; no S1/S2 sub-seed collision over 1200
        indices), also confirming that v1's defect was real as written and
        probing for an undeclared fifth stream on the plaintext term (VAL
        J4); the red team traced the construction independently and found no
        failing case (HELD-3). DEFECT 2's repair is REAL BUT UNDER-BOUND
        (OBJ-8): the CONVERGED [5, R] window is borrowed from a
        generous-to-the-treatment falsification margin rather than derived
        from the null object, so a four-round ARM-NULL anomaly passes every
        binding rule and routes to "CH-1 HOLDS", and v2 saw the case and made
        the only check that would catch it non-binding without entering it in
        its own open-items list. AND THE REPAIR IS SYMMETRIC-BLIND (OBJ-7,
        MEDIUM_HIGH): GATE-PAIRSYNC and GATE-ROUND0 verify S1, the stream
        just fixed, and NOTHING verifies S2 — the 2R replacement round keys
        that CONSTITUTE the null — so the worked implementation fault F
        silently substitutes a common-round-key null for the specified
        independent-round-key null and passes the KAT, GATE-ROUND0,
        GATE-PAIRSYNC Layers A and B, ARM-ANCHOR, rules 1a/1b and rule 4,
        with the run declared interpretable. The DEFECT 1 fix additionally
        makes GATE-ROUND0's ARM-NULL half degenerate, which v2 did not note
        when carrying that gate forward "UNCHANGED FROM v1".
      why_the_mechanical_pass_does_not_reach_it: >-
        VAL J4's cell-(iv) trace is correct and exhaustive — an ARM-NULL-only
        excess does route to NULL-CONTROL-ONLY FAILURE and to rule 4 — and it
        cannot reach OBJ-7, because fault F produces NO excess: two distinct
        states driven through the same round function still diffuse. This is
        the general shape of this batch: mechanical reproduction verifies
        that the specified machinery does what it says; it does not search
        for the case the machinery does not cover.
      status: NOT APPROVED FOR DISPATCH, unchanged from DEC-20260901-1fc2f5. RC-4 and RC-5 are required before any future approval could rest on this design.
      cited_findings: [VAL J4, HELD-3, OBJ-7, OBJ-8, RC-4, RC-5]
    - item: ITEM 4 — BATCH-286bcd opening binding supplement (TASK-20260901-d88346)
      disposition: HOLDS — F-VAL4c225b-1 DISCHARGED AS DESCRIBED
      disposition_detail: >-
        VAL J2 verdict `holds`, method `full_independent_recomputation`: the
        card asked for a sample and the validator recomputed ALL 44 declared
        sha256 values from git blobs — 44 of 44 agreed, MISMATCHES 0 — plus
        all 22 `identical_at_head` booleans and all 22 receipt cross-checks.
        The declared 22-path set is SET-EQUAL to `git show --name-status`
        output, and the 22 / 2 previously pinned / 20 newly bound split is
        independently confirmed. Supporting claims spot-reproduced exactly
        (5 commits, 86/42 numstat; a2073bbbf an ancestor of HEAD and
        2c1aebf21 not; the d10bc6 receipt blob hashing identically at
        a2073bbbf and HEAD).
      stated_limit: >-
        The supplement is a DESCRIPTIVE record: no mechanism was built to
        make tools/research_dispatch.py consume it, and it deliberately does
        not widen any completed archive's declared scope — retroactive
        widening is the breakage class BATCH-2b0fd1's DEF-3 already cost this
        campaign. F-VAL4c225b-1 is discharged in the sense the finding
        stated, not converted into a new machine check.
      cited_findings: [VAL J2, F-VAL4c225b-1]

  # =====================================================================
  # RATIONALE.
  # =====================================================================
  rationale:
    - >-
      THE HEADLINE IS A PATTERN, NOT A TALLY, AND IT IS WHAT THIS BATCH
      PRODUCED. Round one broke -003 because "independent" was undefined;
      -004 defines it and the break RELOCATES inside the definition, to the
      intensional/extensional split between A-2's consumption test and its
      own "that is" gloss (OBJ-2). Round one broke -003 because "genuinely
      distinct computational acts" was under-determined; -004 replaces it
      with a full-evaluation test and the break RELOCATES to the word
      "stage", which nothing in -004 individuates (OBJ-4), and to the
      unstated status of a data-dependent early-aborted evaluation (OBJ-3).
      TWO ROUNDS OF SPECIFICATION REPAIR HAVE NOW FAILED THE SAME WAY. Two
      structural facts stop this being a coincidence of severity. (i) OBJ-2
      is HIGH and requires NO DISHONEST DESCRIPTION — attack P' is a
      complete, honest, fully A-4-compliant specification of the same attack
      written in pulled-back form from the start — so clause A-4, which 004's
      own limitation L4 nominates as its defence at exactly this point and
      invites a red team to attack, is STRUCTURALLY INCAPABLE of catching it:
      a disclosure duty cannot reach a case where nothing is concealed, and
      it cannot resolve a precedence gap in the rule doing the reading.
      (ii) OBJ-3 escapes 004's own proves-too-much check PROVABLY: the m=0
      definitional reference has no stored partial state to abort against and
      must finish the encryption before any ciphertext byte exists, so attack
      S's construction is unavailable there, the reference still classifies
      as BUNDLED under both readings, and the check 004 did perform cannot
      reach the case. The red team's proof-architecture challenge locates the
      asymmetry that produced this: 004 ran a proves-too-much control and
      recorded a rejected draft (B-0) for clause B-1, and ran no analogous
      control anywhere on A-1..A-4 — and two of the three J1 breaks are in
      the A block. The check the amendment already knows how to run is the
      check it did not run where it was most needed.
    - >-
      THE MECHANICAL PASS AND THE ADVERSARIAL BREAK ARE BOTH TRUE AND ARE
      RECORDED TOGETHER, NOT MERGED. The validator passed all four joints on
      real work: an isolated-worktree re-run with full error-SET comparison
      plus discriminating and null-object controls on BLK-1 (J1), all 44
      binding hashes recomputed (J2), the m=0 proves-too-much check
      re-derived and the A-clause verdict table executed as code (J3), and
      the C2 v2 seed derivation re-implemented over 24 traced cases (J4).
      The red team broke both of amendment 004's blocks. These do not
      contradict each other because they are different measurements, and the
      validator says so itself: J3's own limitation records that a rule that
      forces a verdict can still force a WRONG one, and OBS-E3858F-3 records
      that it deliberately discharged every joint by mechanical reproduction
      rather than by re-argument. Suppressing either half would misdescribe
      the batch — the first half is why ITEM 2 and ITEM 4 are accepted, the
      second is why ITEM 1 is not.
    - >-
      THE TOOLING AND ARCHIVE REPAIRS ARE ACCEPTED ON THEIR MERITS, AND
      NEITHER IS INFLATED. ITEM 2 is a working fix, not a no-op, with its
      cost measured rather than asserted and disclosed in three committed
      places; it does NOT close BLK-1, because the verification machinery a
      key_recovery certificate would need does not exist, and neither
      producer nor reviewer claimed otherwise. ITEM 4 discharges
      F-VAL4c225b-1 exactly as that finding stated it, with every declared
      hash independently recomputed, and it remains a descriptive record
      rather than a new machine check. Accepting a bookkeeping repair as a
      bookkeeping repair is the whole of what is claimed here.
    - >-
      THE C2 DESIGN IS CLOSER AND STILL NOT APPROVABLE, AND THE REASON IS
      INSTRUCTIVE RATHER THAN INCREMENTAL. The repair that made the paired
      arms genuinely comparable also concentrated all run-time verification
      on the stream it repaired, leaving the stream that CONSTITUTES the null
      unguarded (OBJ-7) — a null control nothing verifies is exactly the
      failure `docs/inventor-protocol.md` section 3 exists to prevent, since
      the run would report a null that nulls out while measuring a different
      generating process. Coupled with a convergence window chosen for
      cross-arm symmetry with a falsification threshold rather than from the
      null object's own behaviour (OBJ-8), the design as it stands can return
      "CH-1 HOLDS" from a run whose control was never the specified control.
      RC-4 and RC-5 are both zero-compute and both are required before any
      future approval.
    - >-
      AN INTEGRITY DEFECT RECURRED INSIDE THE BATCH CONVENED TO REPAIR ONE,
      AND IS SUPERSEDED RATHER THAN PATCHED. OBS-E3858F-1 found two
      hash-pinned archival receipts edited in place after archiving. This
      Coordinator's own two instances — receipts committed with the literal
      'PENDING' in 21 of 22 and 16 of 17 non-self slots, then filled in by
      in-place edit — are recorded in CORR-20260901-2b9724, archived
      alongside this decision, which supersedes their path_sha256 content by
      carrying the authoritative per-commit digests and edits neither file
      again. The binding itself is sound: all 39 authoritative values
      re-verified against their own archive commits with zero mismatches, and
      the validator independently confirms all 17 snapshot pins verify
      byte-exactly at the bound commit and that the observation changes none
      of its four verdicts. The unrelated instance by another session
      (a4942d229) is named and NOT adjudicated here.
    - >-
      THE EVIDENCE-QUALITY LIMIT IS STATED AS A LIMITATION ON THE EVIDENCE,
      NOT AS A FOOTNOTE. Model independence across this batch is ZERO
      (OBS-E3858F-3): the four producers, the archiving Coordinator and BOTH
      reviewers all resolved to claude-opus-5, against a claude-sonnet-5
      binding for executor-implementation, and this interpreting Coordinator
      is the same model again. Session independence was supplied and attested
      on both sides; model independence was not, is not claimed, and cannot
      be obtained in this harness under standing basis 0137a051. WHERE THE
      TWO REPORTS AGREE, THAT IS ONE DRAW FROM A CORRELATED PAIR. The
      consequence is asymmetric and both directions are recorded: the
      validator's verdicts are mechanical reproductions from committed bytes,
      which a correlated reviewer can still perform validly; the red team's
      four breaks are one reader's post-hoc constructions, and the fact that
      a second session again found breaks is NOT evidence that the text is
      objectively breakable at that rate. That asymmetry is the direct reason
      the single next action below is a measurement rather than another
      draft.

