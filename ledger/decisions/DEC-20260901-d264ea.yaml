      protocol-amendment-GOAL-AES-002-005 against the frozen panel,
      incorporating RC-1 (the specification-rewriting invariance check, which
      is the A-clause analogue of the proves-too-much control 004 ran only
      for B-1), RC-2 (an explicit precedence sentence between A-2 and A-3,
      and A-3(i)'s antecedent extended to element (d) input bytes) and RC-3
      (bind "full evaluation" to the CHARGED EXPECTED COST and individuate a
      stage OPERATIONALLY as any point where the candidate count strictly
      decreases), and re-run 004's own m=0 proves-too-much check against both
      revised clauses; (iv) re-run the frozen panel against the -005 text and
      publish the third column. All of it is zero-compute: one task card, one
      frozen panel file, three verdict tables.

  next_action_rationale: >-
    THE ALTERNATIVE WAS WEIGHED AND REJECTED, AND THE REASONING IS RECORDED
    RATHER THAN ASSERTED. The obvious action is to write amendment 005
    directly: the repair text for all four breaks already exists in the red
    team's `repair_direction_offered_not_concluded` fields and RC-1..RC-3,
    it is cheap, and it would produce a visibly improved artifact this batch.
    IT IS REJECTED AS THE PRIMARY ACT FOR THREE REASONS. (1) IT IS THE MOVE
    THAT HAS NOW FAILED TWICE, BY THE SAME MECHANISM. -003 and -004 were both
    written the same way — the author picks the cases, closes them, and ships
    — and both closed their named cases and relocated the ambiguity to a term
    the new text does not determine. A third draft under the same procedure
    has no property that would stop it failing the third time, and this
    decision would have no way to tell whether it had. (2) THE AMENDMENT'S
    OPERATIVE CLAIM HAS NEVER BEEN MEASURED. What -003, -004 and any -005
    each assert is "two conforming readers reach the same verdict", and every
    round to date has established the failure of that claim by a single
    reader inventing a case afterwards — which, as the red team states
    plainly, is a fatigue report about the reader rather than a measurement
    of the rule. The disagreement RATE of -004 is unknown; so is -003's; so,
    therefore, is whether -004 bought anything at all. (3) THE NULL-OBJECT
    CONTROL IS WHAT MAKES IT A MEASUREMENT RATHER THAN A SECOND OPINION, and
    it is the only proposed control in either report that can answer (2).
    Running the SAME frozen panel against -003's superseded text is
    "controls before belief" applied to an argument instead of a measurement:
    if two readers disagree just as much on -003 as on -004, then -004 bought
    nothing and the apparent improvement is a property of who wrote the
    examples. That is a result this campaign cannot currently obtain any
    other way, and it is decision-changing in both directions — a low
    disagreement rate on -004 relative to -003 would license writing -005 as
    an ordinary repair, while equal rates would mean the repair-by-amendment
    procedure itself, not any particular clause, is what needs replacing.
    PRE-FREEZING IS THE ACTIVE INGREDIENT, NOT READER INDEPENDENCE, and this
    must not be overstated: under the correlated-pair limitation a second
    reader of the same model family is one draw, not two, and the panel's
    verdict tables must be reported as such. What the panel removes is the
    SELECTION effect — the author choosing the examples the rule handles —
    which currently dominates and which no amount of care in drafting -005
    would remove. COST, STATED PLAINLY: this delays the repair text by one
    task; RC-6 alone repairs none of OBJ-1..OBJ-4, which is why step (iii)
    is inside the same action rather than deferred; and a panel of 8-10 items
    is small enough that its disagreement rate carries wide uncertainty,
    which the verdict tables must state rather than imply. ORDERING IS
    LOAD-BEARING: authoring the amendment first and the panel afterwards
    reproduces exactly the selection effect that has now produced two rounds
    of post-hoc breaks, so the panel is frozen and hashed BEFORE -005's text
    is written, and the -003 column is published whatever it shows.

