    changed: false
    reason: >-
      GOAL-AES-002 has no active hypothesis and this decision creates none. A
      protocol amendment, a validator-tooling repair, an unexecuted
      experiment design and an archive-coverage supplement are not
      hypothesis-testing acts.

  goal_status_transition:
    from: active
    to: active
    changed: false
    reason: >-
      This decision closes BATCH-241d37's evidence-review step, not
      GOAL-AES-002. No completion criterion (C1-C5) is met or approached, no
      completion_quorum block is created, and no attestation is recorded —
      none was obtained, and recording one that was not obtained is
      forbidden. A scoped repair-and-follow-on next action is the correct
      disposition of a batch whose independent reviews found concrete,
      repairable defects rather than a closable success or a closable
      failure. The goal record's checkpoint is a SEPARATE following commit
      and is not written by this task.

  batch_disposition: >-
    BATCH-241d37's FOUR ITEMS ARE COMPLETE, REVIEWED AND ARCHIVED FOR THE
    SCOPE THEY WERE OPENED TO EXECUTE. The batch is not reopened and no
    further task is dispatched under its own dispatch_queue_path by this
    decision. The repairs named below belong to a FOLLOW-UP batch under
    GOAL-AES-002. A specification repair that did not hold ends this task,
    not the larger goal.

  asymptotic_promotion_gates:
    status_all: OPEN
    note: >-
      No asymptotic or concrete cost claim exists under this goal. This
      decision moves none of the four promotion gates and creates no claim
      that could approach them.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NO SUPPORT OR REJECT_SCOPED DECISION ON REPLICATED OR STRONG EVIDENCE
      IS AVAILABLE. This decision is `revise`, and EV-AES-5283c8's strength
      is `anecdotal`: a single unreplicated batch over instruments this
      campaign authored, with ZERO model independence across producers,
      archiver and both reviewers (OBS-E3858F-3), so the agreement between
      the two reports is one draw from a correlated pair. THE CANDIDATE
      DURABLE FINDING IS NAMED RATHER THAN QUIETLY DROPPED: "two successive
      specification repairs closed their named case and relocated the
      ambiguity to a newly-undetermined term, and each amendment's own stated
      defence was structurally incapable of catching the relocation" is a
      genuinely reusable lesson about repair-by-amendment. It is NOT promoted
      because it rests on two single-reader draws from one model, constructed
      post hoc, and the measurement that would qualify it — RC-6's
      pre-registered panel with the -003 null-object control, which is
      exactly this decision's single next action — has not been made.
      Promoting it now would encode as a finding the very claim the next
      action exists to measure, which is the failure mode
      docs/inventor-protocol.md section 3 names. REVISIT CONDITION, CONCRETE:
      once the RC-6 verdict table exists for -003 and -004 side by side, a
      KN-FIND on repair-by-relocation is warranted if the disagreement rates
      support it, and a KN-OPEN recording the unresolved determinacy question
      is warranted if they do not. Nothing else in this batch rises above
      bookkeeping about campaign instruments.

  # =====================================================================
  # LIMITATIONS.
  # =====================================================================
  limitations:
    - >-
      THIS DECISION ASSERTS NOTHING ABOUT AES AT ANY ROUND COUNT, in either
      direction. It creates no hypothesis, promotes no knowledge, satisfies
      no promotion gate, records no attestation, states no margin, makes no
      comparison against the published state of the art (SC-6), cites no
      recalled literature figure as authority (SC-5), and supports no claim
      at any tier. The claim ceiling is SPECIFICATION, TOOLING AND ARCHIVE
      REPAIR ONLY.
    - >-
      MODEL INDEPENDENCE IS ZERO ACROSS THIS BATCH AND EXTENDS TO THIS
      DECISION. Producers, archiver, both reviewers and this interpreting
      Coordinator all resolve to claude-opus-5. The two reports' agreement is
      ONE DRAW FROM A CORRELATED PAIR, not two independent confirmations, and
      no attestation of multi-model agreement is recorded anywhere.
    - >-
      THE FOUR AMENDMENT-004 BREAKS ARE SINGLE-READER, POST-HOC
      CONSTRUCTIONS. They are scoped to the exact clauses and constructions
      named and do NOT establish that 004's text is unrepairable, that
      further ambiguities exist, or that ambiguity is intrinsic to this
      repair programme. Symmetrically, HELD-1, HELD-2 and HELD-4 certify that
      the attempted attacks in those directions failed, never that none
      exists.
    - >-
      BLK-1 REMAINS OPEN AND PAUSE CONDITION P3 REMAINS LIVE. The tooling now
      accepts a `key_recovery` certificate kind; the two-implementation
      independent verifier and the cairn re-verification path for that kind
      do not exist. No conforming run may yet claim a key recovery in any
      sense that survives re-verification.
    - >-
      THE C2 DESIGN IS NOT APPROVED FOR DISPATCH, HAS PRODUCED NO DATA, AND
      ITS VERIFIED PROPERTY IS A PROPERTY OF THE DESIGN TEXT. Byte-identical
      state_0 was verified in the validator's re-implementation of the
      specified derivation, not in any executor's future code.
    - >-
      ONE VALIDATOR SUB-CLAIM IS UNVERIFIABLE AND IS NOT TREATED AS PASSED:
      that this Coordinator's pre-archive edit to C2 v2 touched only
      `experiment.controls`. No committed pre-edit version exists to diff
      against; what is verified is that the restored list equals v1's five
      items verbatim and that the authoring text survives verbatim in
      `controls_restored_note`.
    - >-
      DEF-CM1-CLOCK RECURS AND IS NOT RULED ON BY THIS DECISION. SC-1's stamp
      duty is unsatisfiable by construction for a Coordinator subagent under
      this harness, which has no command-execution tool, and SC-10 forbids
      inventing the values; both TASK-20260901-e045b8 and this task recorded
      null clock fields with the reason. A ruling is owed and is carried
      forward as an open item, not folded into the single next action.
    - >-
      NEITHER REVIEW PERFORMED KNOWLEDGE-CORPUS RETRIEVAL — no
