  id: DEC-20260901-d264ea
  goal_id: GOAL-AES-002
  question_id: RQ-AES-002
  batch_id: BATCH-241d37
  recorded_by_task: TASK-20260901-03be43

  context: >-
    BATCH-241d37 was opened to execute DEC-20260901-1fc2f5's four named next
    actions and no more: (1) file protocol-amendment-GOAL-AES-002-004 closing
    the two narrower CM-1 reading gaps RT-20260901-1af5d9 established against
    amendment 003; (2) find and verify a genuinely DIFFERENT fix for BLK-1,
    the specified one having been confirmed by two independent sessions to
    desynchronize 112 baseline-suppressed tools/validate_ledger.py errors;
    (3) author a superseding v2 of candidate C2's paired-validation design,
    repairing the seed_policy/ARM-NULL contradiction and the decay-check
    labelling gap; (4) resolve validator finding F-VAL4c225b-1 by hash-binding
    the 20 BATCH-286bcd opening files that were committed but never
    individually pinned. All four items were produced, snapshot-committed at
    ee80ce45691a791638a614c441d0904775cea142 before review, and then reviewed
    by two mutually blind independent sessions: VAL-20260901-e3858f
    (validator, TASK-20260901-e3858f) and RT-20260901-3ad5d2 (red team,
    TASK-20260901-3ad5d2), each attesting that it did not read the other.
    This decision disposes of that package. Evidence record EV-AES-5283c8 is
    committed alongside it, together with both review reports and
    CORR-20260901-2b9724, in the same isolated ledger archive.

  decision_scope: >-
    DISPOSES OF BATCH-241d37's FOUR ITEMS AND ITS TWO INDEPENDENT REVIEWS,
    AND NOTHING MORE. This decision creates no hypothesis, approves no
    experiment and no cryptanalytic measurement, does NOT approve the C2
    design (v1 or v2) for dispatch, does NOT declare BLK-1 closed, changes no
    hypothesis status, changes no GOAL-AES-002 status (the goal stays
    `active`), records no completion_quorum block and no attestation, and
    ASSERTS NOTHING ABOUT AES AT ANY ROUND COUNT IN EITHER DIRECTION. It
    edits no committed record: amendment 004, amendment 003, CM-1 and C2 v1
    all stand byte-unchanged, and every repair named below is a future
    superseding record under a new id, never an edit.

  decision: revise
  decision_note: >-
    `revise` because the package splits cleanly and neither half may be
    suppressed by the other. Two of the four items — the BLK-1 tooling fix
    and the archive binding supplement — HOLD under independent mechanical
    reproduction and are accepted. The specification repair does NOT hold on
    independent adversarial reading, and the C2 design repair holds in the
    defect it targeted while opening a symmetric new one. That is a package
    requiring a further, differently-shaped repair round, not a `support`,
    not a `reject_scoped`, and not a `pause`: nothing here closes a lane,
    nothing here measures a cipher, and every open item has a concrete named
    successor. The itemised dispositions, the single next action and the
    carried-forward open items below carry the content; the one word does
    not.

  target_ids:
    - GOAL-AES-002
    - RQ-AES-002
    - BATCH-241d37
    - EV-AES-5283c8
