coordinator_decision:
  id: DEC-20260801-002
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-030
  recorded_by_task: TASK-20260801-147
  context: >-
    BATCH-030 was the gated repair/rerun of EXP-IT-001 v3 (SG-ECDLP-002 /
    IDEA-20260731-008, hypothesis H-IT-001) mandated by DEC-20260731-036 after
    RUN-IT-001-bounded-toy was reclassified failed_infrastructure. The rerun
    RUN-IT-001-rerun was produced by TASK-20260801-143 under the frozen
    specification.v3.yaml plus repair overlay PA-IT-001-v3-rc30-repair-1-to-7
    (RC-30 admission gate FIX-1..FIX-7), snapshot-archived alone at
    TASK-20260801-144 commit 62055d296, then independently reviewed by Validator
    VAL-20260801-145 (TASK-20260801-145) and Red Team RT-20260801-146
    (TASK-20260801-146). Both reviewers converged independently: the mechanics
    are clean and every number recomputes, but the two positive controls do not
    hold under the frozen ledger — the planted-path control passes only under an
    unamended C_special_MOV formula substitution applied to an embedding-
    degree-1 (non-anomalous) endpoint (frozen-formula recomputation gives
    R_xfer=2.08 >= 0.7 -> spec F2 harness void), and the null-plant
    recomputation is not independently verifiable (empty edge ledger; null gate
    never ran).
  decision: inconclusive
  decision_vocabulary_note: >-
    inconclusive here means the data do not discriminate between explanations
    because the run is not an admissible transfer-gate measurement: both
    validating controls fail under the frozen ledger, so the all-zero sub-rho
    readings are uninterpretable as a gate result. This is NOT a null result,
    NOT negative evidence against H-IT-001, NOT reject_scoped, and NOT weaken.
    Unlike DEC-20260731-036, the run itself is NOT reclassified: it is a
    mechanically valid toy run whose only admissible content is a toy-tier
    density upper bound for the three fixed fields. The interpretation is
    restricted, not the run.
  decision_scope: >-
    Official disposition of RUN-IT-001-rerun and of BATCH-030. The Executor's
    completed_valid status stands for the run as a toy density-measurement
    package. The run is NOT admissible as a transfer-gate measurement and
    provides no sub-rho / HEUR-ISO-1 / generic-safety evidence in either
    direction. RATE-ISO-1 fails by the letter, so S1 is not met. H-IT-001 stays
    specified (unchanged transition). No support, no weaken, no reject_scoped,
    no lane-death claim for SG-ECDLP-001 / SG-ECDLP-002, no HEUR-ISO-1
    adjudication, no promotion. Claim ceiling toy. A further gated repair is the
    single next action (see next_actions).
  target_ids:
  - H-IT-001
  - EXP-IT-001
  - EV-IT-002
  - RUN-IT-001-rerun
  - GOAL-ECDLP-001
  - BATCH-030
  - VAL-20260801-145
  - RT-20260801-146
  evidence_ids:
  - EV-IT-002
  evidence_refs:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-030/reviews/TASK-20260801-145/validation_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-030/reviews/TASK-20260801-145/receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-030/reviews/TASK-20260801-146/red_team_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-030/reviews/TASK-20260801-146/objections.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-030/reviews/TASK-20260801-146/receipt.json
  - ledger/evidence/EV-IT-002.yaml
  - ledger/evidence/EV-IT-001.yaml
  - experiments/EXP-IT-001/specification.v3.yaml
  - experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc30-repair-1-to-7.yaml
  - experiments/EXP-IT-001/runs/RUN-IT-001-rerun/manifest.json
  - experiments/EXP-IT-001/results/transfer_gate_report.json
  - experiments/EXP-IT-001/results/null_it_isogeny_transfer_report.json
  - snapshot 62055d2965fb54fc648c76b1eb48e24aafd8b2a8
  hypothesis_status_transition:
    hypothesis_id: H-IT-001
    from: specified
    to: specified
    changed: false
    reason: >-
      The BATCH-030 rerun produced real density measurements but its two
      validating controls fail under the frozen ledger: the planted-path control
      passes only under an unamended C_special_MOV formula substitution applied
      to a non-anomalous endpoint (frozen-formula recomputation R_xfer=2.08 >=
      0.7 -> spec F2 harness void), and the null-plant recomputation is not
      independently verifiable (empty edge ledger; null gate never run). The run
      is therefore NOT an admissible transfer-gate measurement and provides no
      evidence for or against H-IT-001; status unchanged (specified). The
      censored zeros are not negative evidence. HEUR-ISO-1 is unmeasured.
  h_ds_001_status:
    hypothesis_id: H-DS-001
    from: analyzed
    to: analyzed
    changed: false
    reason: >-
      BATCH-030 disposition only; nothing in this run touches H-DS-001. S1_met
      must NOT be computed from rate_iso_1_* or rho_special fields of this
      package (RT-146-O5 / RT-130-O3 discipline). RATE-ISO-1 fails by the
      letter; record S1 as not met, never as a H-DS-001 result.
  asymptotic_promotion_gates:
    status_all: OPEN
  run_status_reclassification: null
  run_status_note: >-
    No reclassification of RUN-IT-001-rerun (differs from RUN-IT-001-bounded-toy
    in DEC-20260731-036). The run stands completed_valid as a toy
    density-measurement package; the restriction is on interpretation only.
  concrete_run_defects_for_rerun:
  - >-
    RT-146-O1 / VAL D-1 (critical, control): C_special_MOV substituted in code
    (ceil(k*log2(p)) = 22) without an amendment authorizing an MOV-formula
    change, applied to an embedding-degree-1 endpoint (not the anomalous family
    FIX-4 scopes). Frozen-formula recomputation: C_special=1284,
    R_xfer=(9+1284+40)/641.609=2.08 >= 0.7 -> recovered=false -> spec F2
    (harness void). The substitution also charges only the Miller-loop
    (pairing evaluation) cost while the MOV attack's dominant term is the field
    DLP (~2*sqrt(N*) ~ 1448 ops) — the RT-130-O4 model-inversion defect class.
  - >-
    RT-146-O2 / VAL D-2 (critical, discrimination): recovery certificate is a
    direct BSGS solve (solve_by_bsgs_toy = P.discrete_log(Q)) with no isogeny
    evaluation; the planted 2-hop walk returned to the special start
    (endpoint_j=1416 == start_special_j), so the recovered path [1416 -> 480976]
    is a 1-hop edge between two special curves. The control would pass on ANY
    graph with two adjacent special marks; it does not discriminate transfer
    capability.
  - >-
    RT-146-O3 / VAL D-3 (major, null): CTRL-NULL-PACKAGING-GATE skipped on all
    21 cells (R_null=null); CTRL_NULL_IT_PLANT edge_ledger=[] so recomputation
    independence is unverifiable (C_path_recomputed=729 echoes a search count).
    The plant control and the null gate never validated the transfer cost path.
  - >-
    RT-146-O4 / VAL D-6 (major, cost/Pareto): no sieve/construction cost for the
    special set, no per-attempt x inverse-success accounting (only a
    deterministic-only disclaimer), no time-memory tradeoff row, and no
    dominated_by / quantitative sota_delta in any deliverable (inventor-protocol
    honesty failure). Honest sota_delta is negative: transfer cannot beat rho
    for the only family found (k=1 MOV) by construction.
  - >-
    RT-146-O5 / VAL D-5 (major, scope): rho_special=0 exact only for two fixed
    20/24-bit primes; 28-bit value is a 50k-sample CI upper bound ~ 6e-5, not an
    exact zero; HEUR-ISO-1 unmeasured (0 uncensored samples, degenerate F_hit);
    RATE-ISO-1 fails by the letter, so S1 is not met.
  - >-
    RT-146-O6/O7 / VAL D-7/D-8 (minor/informational): H_min_heur=1 != n_hops_
    planted=2; endpoint_j inconsistency; rho baseline is a proxy (1/8 BSGS baby
    table scaled x8, ratio constant across all cells); wall_budget 7200 vs 10800
    divergence; implementation/ directory untracked and outside the snapshot
    (reproducibility binding gap).
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No durable finding results from BATCH-030. The run produced toy-tier
      density upper bounds (rho_special=0 at 20/24 bits exact for two fixed
      primes; ~<6e-5 at 28 bits) but its two validating controls fail under the
      frozen ledger, so no sub-rho, transfer-gate, HEUR-ISO-1, or generic-safety
      finding is admissible in either direction. Promoting any R_xfer,
      rate_iso_1, or rho_special value as a finding would be a fabrication from
      censorship placeholders and non-validating controls (AGENTS.md rule 9 /
      rule 5). The density upper bound is a pre-registered measurement inside the
      already-registered EXP-IT-001 program, not a novel corpus finding; the
      correct artifact is a further gated repair task.
  forbid:
  - sub-rho_claim
  - support_H_IT_001
  - S1_met
  - lane_death
  - asymptotic_promotion
  - launder_into_H_DS_001
  - exact_zero_density_law
  - transfer_gate_admissible
  rationale:
  - >-
    VAL-20260801-145 NOT_SUPPORTED with the mechanics PASS and the controls FAIL:
    FIX-1/FIX-2/FIX-6/FIX-7 PASS; every numeric claim recomputes with 0
    mismatches; archive binding verified. But FIX-3 (planted-path control) fails
    under the frozen ledger (unamended C_special_MOV substitution, family outside
    FIX-4 scope -> R_xfer=2.08 >= 0.7 -> spec F2 harness void) and FIX-5
    (null-plant recomputation) is not independently verifiable (empty edge
    ledger, null gate never run). Verdict: NOT_SUPPORTED as a transfer-gate
    measurement; SUPPORTED only as a toy-tier density-measurement package.
  - >-
    RT-20260801-146 BLOCKING x2 + MAJOR x3: (O1) the planted control passes only
    via an unamended cost-formula substitution applied to the wrong family —
    under the frozen ledger it FAILS (2.08 >= 0.7 -> F2); (O2) the certificate is
    a direct BSGS solve on a special instance — the control is trivially passable
    on any graph; (O3) the null-object gate never ran and plant_detected=true is
    packaging arithmetic over an empty ledger; (O4) no dominated_by / sota_delta
    and the honest sota_delta is negative; (O5) rho_special=0 is a fixed-p
    Poisson-scale upper bound, not an impossibility, and HEUR-ISO-1 is unmeasured.
  - >-
    This decision differs from DEC-20260731-036 in kind: that run crashed in
    infrastructure (reclassified failed_infrastructure, no measurement at all);
    this run executed correctly and produced real toy density measurements, so it
    is not reclassified. What fails is the transfer-gate INTERPRETATION, and that
    failure is decisive: no sub-rho reading from this package is admissible.
  - >-
    AGENTS.md rule 6: negative evidence closes only the exact tested scope. Here
    even that does not apply: the all-zero readings are censorship placeholders
    over empty special sets, not measured gates. The narrowest supported
    statement is the toy-tier density upper bound for the three fixed fields.
  - >-
    H-IT-001 remains specified: the rerun is not an admissible measurement for or
    against it; HEUR-ISO-1 is unmeasured; the censored zeros must not be
    interpreted as negative evidence or lane death. A further gated repair is
    required before any admissible H-IT-001 evidence can exist.
  - >-
    knowledge_promotion not_warranted: non-validating controls plus censorship
    placeholders yield no durable finding; the correct artifact is a gated
    repair task, not a corpus entry.
  limitations:
  - Toy claim ceiling only; EV-IT-002 asserts nothing about crypto-scale behavior
    or about any asymptotic exponent.
  - The 28-bit rho_special=0 is a 50,000-class sample estimate (95% CI upper
    bound ~ 6e-5), not an exact zero; it must not be quoted as a density law.
  - All unplanted R_xfer values are censorship lower bounds over empty special
    sets; they carry no measured transfer content.
  - The unamended C_special_MOV substitution is an infrastructure/amendment
    defect of the fix plumbing; its repair is a precondition for any future
    admissible H-IT-001 evidence, not evidence itself.
  - Validator and Red Team review sessions resolved to
    opencode/deepseek-v4-flash-free with review-adversarial not attainable on
    this backend, recorded honestly and not a basis for this disposition.
  next_actions:
  - >-
    Exact next action: Coordinator issues a second gated repair task for
    EXP-IT-001 v3 (RUN-IT-001-*) under a NEW amendment that fixes, concretely:
    (1) C_special_MOV stays the frozen formula ceil(0.886*sqrt(p^k)) UNLESS a
    formally approved amendment recalibrates it with a field-DLP-inclusive cost
    (charged term ~ 2*sqrt(N*) at k=1) AND re-derives the planted-path control on
    an actually ANOMALOUS (trace-1) curve — never an embedding-degree-1 endpoint;
    (2) a genuine transfer control whose recovery certificate actually evaluates
    an isogeny pullback on a NON-special instance (or an explicit declared
    direct-solve proxy labeled non-transfer), with the planted walk forced to end
    at a NON-special j; (3) one live null-gate run pushing a synthetic
    certificate-bearing sub-0.7 claim through CTRL-NULL-PACKAGING-GATE plus a
    persisted raw edge ledger for CTRL-NULL-IT-PLANT; (4) dominated_by + a
    quantitative sota_delta in every deliverable per inventor protocol (values
    already determined by the artifacts: rho dominates the transfer idea in time
    and memory at toy; expected cost unbounded at rho=0); (5) a density scan over
    a bits window whose p admits N* | p^k - 1 (k >= 2) or a trace-1 class, with
    95% CI bounds on any sampled density, and (6) the implementation code
    archived inside the snapshot. RUN-IT-001-rerun stands completed_valid as a
    toy density-measurement package (EV-IT-002); H-IT-001 stays specified; claim
    ceiling toy; no promotion; no lane-death claim. Regenerate the dispatch plan
    after this ledger commit and admit the next Executor only after this archive
    verifies.
  - >-
    Follow-up (separate ledger commit): GOAL-ECDLP-001 next_action bind for the
    IT lane, acknowledging the BATCH-030 disposition (inconclusive, run stands as
    density package, transfer-gate interpretation void) and the second gated
    repair as the single next action.
