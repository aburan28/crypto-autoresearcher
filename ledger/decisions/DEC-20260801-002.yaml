coordinator_decision:
  id: DEC-20260801-002
  context: >-
    BATCH-020 / GOAL-ECDLP-001. TASK-20260731-044 (Executor,
    RUN-DS-001-ctrl-unplanted) is complete and produced all 11 declared
    artifacts with no commit, correctly. TASK-20260731-045 is the Coordinator
    snapshot that archives that package before the TASK-20260731-046 validator
    and TASK-20260731-047 red-team sessions read it. Its declared commit set
    listed 12 paths - the 11 Executor artifacts plus the TASK-20260731-045
    receipt - and omitted the two files the Executor wrote under its authorized
    write_scope entry experiments/EXP-DS-001/implementation:
    ds001_ctrl_unplanted.py (new control driver) and implementation.md (control
    appendix appended, nothing rewritten). The run's own command.txt invokes
    ds001_ctrl_unplanted.py and manifest.json references it at code.driver,
    code.driver_sha256 and code.command/argv, which is why the Executor recorded
    code.commit 4e62780c6a141d629c0b51becef3ebe920e7f154 with dirty true. This
    decision amends the declared commit set to 14 paths before the commit is
    made. It is bookkeeping for reproducibility only.
  decision: approve
  target_ids:
    - TASK-20260731-045
    - TASK-20260731-044
    - RUN-DS-001-ctrl-unplanted
    - EXP-DS-001
    - BATCH-020
    - GOAL-ECDLP-001
    - QUEUE-AMEND-20260801-002
  rationale:
    - >-
      A snapshot exists to make a run package immutable and reproducible before
      independent review. Staging only the original 12 paths would attest a
      package whose exact-command artifact points at a file absent from the
      repository at that commit - the defect tools/validate_ledger.py already
      reports 90 times elsewhere here as "run.code.command missing (not
      reproducible)". The EXP-DS-001 / GOAL-ECDLP-001 chain is currently free of
      validator errors and this keeps it so.
    - >-
      AGENTS.md "Durable research commits" requires every produced artifact to
      be assigned to exactly one archival task. Before this amendment the two
      implementation files were assigned to none, so the omission was a gap in
      the archival assignment, not a deliberate exclusion.
    - >-
      Nothing unauthorized is legitimized after the fact. Both files were
      written inside TASK-20260731-044's already-authorized write_scope entry
      experiments/EXP-DS-001/implementation, which is unchanged, and both were
      disclosed by the Executor under
      supporting_files_written_in_write_scope_beyond_declared_artifacts with
      PD-6 recording that ds001_ctrl_unplanted.py is additive and the
      pre-existing ds001_driver.py was not modified (corroborated by manifest
      code.shared_backend_module_modified false). No write scope is widened and
      no permission is granted.
    - >-
      The competing consideration is real and is why this is an amendment rather
      than a wider commit: tools/research_dispatch.py verifies that a completed
      archive task's commit changed exactly its expected paths, so declaration
      and commit must agree. Amending the declaration before committing is
      legitimate; quietly committing paths outside the declared set would be a
      scope-expanding archive and an evidence-integrity failure.
    - >-
      Amending declared_commit_sets alone would have been insufficient and is
      the one place this decision goes beyond the literal instruction that
      created it. research_dispatch.py never reads declared_commit_sets; it
      computes an archive task's expected scope as archive_task.artifact_paths
      union source_task.artifact_paths. The same two paths were therefore added
      to TASK-20260731-044.artifact_paths so declaration and verifier agree at
      14. TASK-20260731-044's handoff block - objective, constraints,
      deliverables, handoff artifact_paths, completion gate, budget, inference -
      is left exactly as the Executor received it, so this changes an archival
      declaration and not a producer's contract or success criterion.
    - >-
      Scope is deliberately minimal. No task state, priority, dependency,
      read/write scope, budget, or next_action changes; TASK-20260731-045
      remains queued and 046/047/048 remain queued.
  evidence_refs:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-020/dispatch_queue.json
    - >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-020/QUEUE-AMEND-20260801-002.md
    - >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-020/tasks/TASK-20260731-044/execution_report.yaml
    - experiments/EXP-DS-001/runs/RUN-DS-001-ctrl-unplanted/command.txt
    - experiments/EXP-DS-001/runs/RUN-DS-001-ctrl-unplanted/manifest.json
    - experiments/EXP-DS-001/implementation/ds001_ctrl_unplanted.py
    - experiments/EXP-DS-001/implementation/implementation.md
    - tools/research_dispatch.py
    - DEC-20260801-001
  limitations:
    - >-
      Bookkeeping only. This decision interprets no result. The metrics in
      raw-result.json, summary.json, R_cell.json, null_control_report.json and
      live_plant_report.json are not read, relied on, or ruled on here; R,
      R_null, the R-1 label and planted_bug_detected are for TASK-20260731-046
      and TASK-20260731-047 to check and TASK-20260731-048 to rule on.
    - >-
      No hypothesis, evidence record, evidence strength, claim tier, or goal
      status moves. H-DS-001, H-IC-001, H-STR-002, EV-DS-*, GOAL-ECDLP-001.yaml,
      FAEST and XEDN are untouched, as are specification*.yaml, controls/,
      amendments/, the run package, the results and the execution report. The
      BATCH-020 toy claim ceiling and the four open asymptotic promotion gates
      are unchanged.
    - >-
      This Coordinator had no shell access. The defect, the untracked/modified
      status of the two implementation files, and the assertion that only those
      two are missing were git-verified by the dispatching session and read by
      this Coordinator from the artifacts (command.txt, manifest.json,
      execution_report.yaml PD-6). ds001_driver.py and verify_certificates.py
      are excluded on that basis and on PD-6; if either is in fact untracked or
      modified at commit time, stop and file a superseding amendment rather than
      staging it under this decision.
    - >-
      Not durable until committed and verified. The amendment takes effect only
      when the dispatching session commits it in the control-plane commit and
      tools/research_dispatch.py accepts the TASK-20260731-045 archive receipt
      against Git. A record in a local commit only is unpublished.
    - >-
      Adding ds001_ctrl_unplanted.py to the snapshot makes the driver auditable
      at the reviewed commit; it does not by itself make the run reproducible.
      manifest code.dirty remains true and the recorded code.commit predates
      this snapshot. Reproducibility of the run is a question for
      TASK-20260731-046, which should assess whether the driver blob committed
      here matches the recorded driver_sha256
      3ee4f68f4da6d7732e8d904243bd469d42c3bca527fa0c470e6216bfb9031d05.
  next_actions:
    - >-
      Dispatching session commits QUEUE-AMEND-20260801-002.md,
      DEC-20260801-002.yaml and the amended dispatch_queue.json in the
      control-plane commit, outside any archive declared set, then executes
      TASK-20260731-045 staging exactly the 14 amended paths.
    - >-
      Push the branch and refresh the PR naming DEC-20260801-002 and
      QUEUE-AMEND-20260801-002.
    - >-
      After the commit, re-run tools/research_dispatch.py on the BATCH-020 queue
      and confirm the TASK-20260731-045 archive verifies with 14 changed paths;
      if it reports missing or extra paths, report the concrete defect and file
      a superseding amendment rather than editing the receipt.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Not an evidence-review decision. No run is interpreted, no evidence record
      is created or revised, and no evidence strength is asserted; this is a
      pre-commit archival-scope amendment with no durable mathematical content
      to promote.
  decided_by: coordinator
  decided_at: '2026-08-01'
