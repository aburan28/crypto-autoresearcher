      JUDGED, ON THE MERITS, TO MERIT DISCRETIONARY PROMOTION -- the mandatory trigger is
      explicitly not met (this decision is `revise`, not `support`/`reject_scoped` on
      `replicated`/`strong` evidence about any hypothesis; no hypothesis is adjudicated here at
      all). I CONSIDERED THE CANDIDATE FINDING EXPLICITLY, NOT ASSUMED EITHER WAY, per item 5's
      own instruction. THE CANDIDATE: the convergent finding that PREREG-5 2.2 Branch A's own
      fidelity-matching mandate -- which fixed KN-FIND-7de6b6's reduction-QUALITY confound --
      creates a NEW, previously undiagnosed confound once the matched algorithm is
      exhaustive-enumeration-based: near-perfect agreement becomes close to a mathematical
      certainty for ANY two correctly-converged HKZ-quality implementations, REGARDLESS of
      genuine code-level independence, so a two-route comparison can still fail to test what it
      is nominally designed to catch (a bug shared at the common definitional-formula or
      library-kernel level) EVEN AFTER both code-sharing (KN-FIND-9b5df0's concern) AND
      fidelity-mismatch (KN-FIND-7de6b6's concern) are genuinely ruled out. GROUNDS FOR
      PROMOTION, assessed against this goal's own established bar (DEC-20260813-1aae44 section
      10's grounds for KN-FIND-7de6b6, extended here rather than merely copied): (1)
      CONVERGENT -- reached independently by both reviews, working blind to each other's write
      scope, via genuinely different supporting methods (the Validator's bit-identical
      raw-GSO-norm reproduction via a from-scratch reimplementation of both routes; the Red
      Team's same-code-rerun null baseline plus a third, independently-structured
      implementation). (2) DURABLE -- the mathematical argument (exhaustive, pruning=0
      enumeration to a fixed point provably computes a genuine lattice invariant, so agreement
      is near-certain once both routes reach it, independent of code provenance) does not
      depend on how hkz's own still-open question (whether a shared-kernel defect exists)
      eventually resolves. (3) GENERALIZES BEYOND THIS GOAL -- any two-route independence test
      whose OWN fidelity-matching requirement forces convergence to a canonical, essentially-
      unique invariant of the object under test has this same limitation: passing such a test
      demonstrates the absence of WRAPPER-level defects (the class the test was built to catch)
      but says structurally little about a defect in code the two routes are licensed, or
      required, to share. THIS IS DISTINCT FROM KN-FIND-7de6b6, which is about detecting a
      fidelity MISMATCH (a lower-fidelity route disagreeing because it under-reduces); this
      finding is about a confound that SURVIVES EVEN PERFECT FIDELITY MATCHING -- the natural
      next entry in the same family, anticipated by KN-FIND-7de6b6's own section 6 item 1
      ("declare, in advance, what comparable fidelity means") but not fully covered by it: even
      a correctly fidelity-matched test can still be confounded, by a DIFFERENT mechanism, once
      fidelity-matching itself forces near-canonical convergence. I HOLD NO IDENTIFIER FOR THIS
      FINDING -- only EV-MLKEM-f65f00 and DEC-20260813-894568 were minted for this batch. Per
      this goal's own established pattern (DEC-20260813-1aae44 section 10, which faced the
