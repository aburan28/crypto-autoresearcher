  - KN-FIND-d29ece

  # ==================================================================
  # 1. VALIDITY BEFORE INTERPRETATION
  # ==================================================================
  run_set_validity:
    ruling: >-
      THE RUN SET IS VALID AND ADMISSIBLE AS EVIDENCE FOR THE PARTS NAMED admissible_now IN
      EV-MLKEM-f65f00. The Validator's own verdict is `passed` (not `incomplete`) -- checked
      before interpretation, not taken on that word alone; the Red Team independently confirms
      "the mechanical arithmetic is correct."
    expected_run_count: >-
      ONE lead producer, ONE measurement invocation (measure_hkz_indep.py, 8.376 s of a 3600 s
      hard cap). Both reviews independently confirm no invocation is omitted, no cell was NOT
      COMPUTED, and no reduction above d=40 occurred anywhere.
    schema_complete_manifests: >-
      CONFIRMED BY THE VALIDATOR (ART-1, ART-2) AND INDEPENDENTLY BY THE RED TEAM ("Commit
      verification" section). The snapshot commit (3d3f5fde552f1a4783616a624f602917719701e8, 9
      declared paths) passes change-set equality at 9/9, 0 extra, 0 missing, verified by BOTH
      reviews independently running git plumbing themselves, including recomputing all 8
      producer-artifact path hashes from the git object database against the receipt's own
      path_sha256 map. run_manifest.yaml declares schema crypto.autoresearch.run_manifest.v1
      with all required blocks present.
    seed_integrity: >-
      CONFIRMED BY BOTH REVIEWS (Validator ART-3; Red Team's own independent confirmation). The
      basis-construction seed formula (numpy.random.default_rng([1,d,k,i])) is the SAME frozen
      formula PREREG-5 2.2 point 3 licenses, independently exercised by the Validator's own
      probes to reproduce bit-identical numbers (RECOMP-4). fpylll's LLL/BKZ/Enumeration are
      deterministic given the input basis; no other randomness anywhere in this run, confirmed
      directly by the Red Team's own same-code-rerun null control (delta=0.0 in 48/48 cases).
    raw_summary_agreement: >-
      CONFIRMED FOR THE MACHINE-READABLE RECORD, AT EVERY ONE OF THE 6 COVERED CELLS. Both
      reviews independently re-derived route_p_values directly from results_relvar.json's own
      G_REL1.hkz block (Validator RECOMP-2, 48/48 bases; Red Team section 5, Third target) and
      confirm results_hkz_indep.json's per-cell arrays match. hkz_indep_writeup.md's summary
      table matches the raw JSON exactly at every cell (Validator ART-4).
    control_comparability: >-
      CONFIRMED, AND STRENGTHENED BY BOTH REVIEWS' OWN BUILT CONTROLS. The Validator built a
      from-scratch reimplementation of BOTH routes' reduction algorithms (importing neither
      committed script) and reproduced bit-identical raw HKZ-reduced Gram-Schmidt norms at 21
      of 48 (cell, basis) pairs, isolating the entire measured D_route'' to a downstream
      logdet-formula choice. The Red Team built a same-code-rerun null-control (48/48, zero
      execution noise) and a third, independently-structured implementation (different fpylll
      driver, descending sweep order) that converges to ROUTE-P's archived value bit-for-bit at
      the one basis it computed correctly. Both controls converge independently on the central
      finding -- see EV-MLKEM-f65f00.hkz_discharge_corrected_citable_wording.
    infrastructure_separation: >-
      No infrastructure failure, crash or missing dependency invalidates any part of this
      batch. fpylll's AVAILABILITY (the opposite infrastructure signal from BATCH-6e08fe) is
      confirmed live and independently by the lead, the Validator, and the Red Team, in three
      separate sessions, never treated as a positive mathematical result in itself -- it is the
      precondition Branch A required, correctly re-verified per PREREG-5 section 1's own
      instruction rather than trusted from a prior session's report.

  # ==================================================================
  # ITEM 1 -- THE TERMINATION BRANCH AND THE CORRECTED CITABLE WORDING
  # ==================================================================
  ruling_1_termination_branch_and_corrected_wording: >-
    T-HKZINDEP-CONFIRMED FIRED CORRECTLY AND MECHANICALLY. Both independent reviews confirm
    this by re-deriving it from the raw route_p_values/route_ii_values arrays with no producer
    import: COVERED=6/6, ALL-SURVIVE=true (VERDICT''=EXCEEDS at every cell,
    D_route''=1.776e-15 uniformly, s_c^fib 0.0038-0.0239), no -PARTIAL suffix warranted. Neither
    review disputes the branch call; both state this explicitly. THE CORRECTED, NARROWED
    CITABLE WORDING -- required because both reviews independently found PREREG-5 2.6's own
    default license text ("exactly as lam1n's discharged") overstates what the measurement
    establishes -- is frozen in EV-MLKEM-f65f00.hkz_discharge_corrected_citable_wording and
    MUST travel with any future citation of this discharge. I adapted it directly from the
    Validator's own termination_branch_check.what_this_branch_may_and_may_not_be_cited_for and
    the Red Team's own narrowest_supported_statement, verified against both reports' cited
    evidence, rather than inventing new phrasing -- matching this goal's own established
    convention (EV-MLKEM-5aa471.hkz_qualification_citable_wording used the identical method one
    batch back). This correction is NOT optional: both reviews independently required it, via
    genuinely different built controls (Validator: a from-scratch dual-route reimplementation
    establishing bit-identical raw GSO norms and isolating D_route'' to a logdet-formula
    artifact; Red Team: a same-code-rerun null baseline plus a third, differently-structured
    implementation), and the convergence across different methods is what makes this finding
    ACTIONABLE rather than merely suggestive, exactly the shape DEC-20260813-1aae44 named for
    hkz's own prior qualification.

  # ==================================================================
  # ITEM 2 -- THE REVISIT CONDITION
  # ==================================================================
  ruling_2_revisit_condition: >-
    PREREG-5 2.8's two arms were read fresh against the actual data, not assumed. ARM 1 ("D_route'
    staying at or near machine epsilon" -> discharge) IS THE ARM THIS BATCH'S DATA SATISFIES,
    literally and unambiguously: D_route''=1.776e-15 at every one of 6/6 covered cells, thirteen
    orders of magnitude below the smallest s_c^fib (0.0038). ARM 2 ("D_route' still growing
    toward s_c^fib's scale") is not merely unsatisfied -- the measured direction is the opposite.
    hkz's status THEREFORE MOVES TO T-INDVERIFY-CONFIRMED-equivalent for these 6 cells,
    superseding the "neither confirmed nor flagged" status DEC-20260813-1aae44 left it in --
    this is what PREREG-5 2.6 already operationalized as T-HKZINDEP-CONFIRMED, and it fired.
    DOES THE CORRECTED, NARROWED READING FROM ITEM 1 CHANGE WHAT THIS DISCHARGE IS WORTH? IT
    CHANGES THE MEASURE OF ITS STRENGTH BUT NOT WHICH ARM FIRED OR WHETHER THE STATUS MOVES. I
    reasoned this through rather than defaulting to either extreme (full weight or none), stated
    in full in EV-MLKEM-f65f00.revisit_condition_ruling: lam1n's discharge (BATCH-6e08fe) rests
    on lambda_1 being an exact, algorithm-independent invariant, so agreement is evidence against
    code-sharing REGARDLESS of reduction-quality matching. hkz's agreement here is evidence of a
    narrower kind -- near-certain specifically BECAUSE PREREG-5's own fidelity-matching mandate
    forces exhaustive enumeration to convergence, making the GSO-tail profile an essentially
    unique invariant only ONCE fidelity is matched (as BATCH-6e08fe's own LLL-quality 0.015-0.223
    result shows it is NOT at unmatched fidelity). THE RIGHT THING HAS BEEN DISCHARGED -- hkz's
    status DOES genuinely improve to T-INDVERIFY-CONFIRMED-equivalent, because that is precisely
    and only what arm 1's antecedent, satisfied here, licenses under PREREG-5's own frozen text
    -- but it must be recorded with the item-1 scope correction travelling in the same sentence,
    not with the bare "exactly as lam1n's" framing, and not with an invented weaker label (PREREG-5's
    frozen text licenses no such label, and minting one here would itself be an unauthorized
    amendment to a frozen termination clause I have no authority to make outside a superseding
    pre-registration).

  # ==================================================================
  # ITEM 3 -- THE DECLARED THIRD-ATTEMPT BOUNDARY
  # ==================================================================
  ruling_3_third_attempt_boundary: >-
    THE BOUNDARY IS SATISFIED FOR THE ORDINARY ROUTE-P-vs-ROUTE-I'' COMPARISON DESIGN: no
    fourth iteration of THIS SAME measurement -- a fifth-generation ROUTE-I''' re-attempting the
    identical comparison -- is licensed for hkz, regardless of the narrower diagnostic scope
    ruled on in items 1-2. Full reasoning in EV-MLKEM-f65f00.third_attempt_boundary_ruling,
    part (a): the boundary's purpose was to prevent open-ended re-running of this comparison
    once the tooling question was resolved; tooling WAS resolved (fpylll confirmed available in
    three independent sessions), a genuinely HKZ-quality route WAS built, and the measurement
    reached its designed terminal state. A fourth iteration would not learn anything new -- both
    reviews' own controls (a same-code rerun showing zero execution noise; a third,
    differently-structured implementation converging to the same quantized precision) already
    demonstrate what a fourth iteration would show, by the same mathematical argument that
    motivates item 1's correction.
    A DIFFERENTLY-DESIGNED MUTATION-TESTING CONTROL IS NOT BARRED, AND IS JUDGED WARRANTED ON
    THE MERITS. Both reviews propose injecting a known defect into a COPY of the shared
    basis-construction/definitional code and confirming D_route'' actually catches it, arguing
    this is not a "fourth iteration of the same measurement" because it tests a different thing
    (instrument power against a specific failure mode, not a repeat comparison). I DID NOT
    ADOPT THIS ARGUMENT BY CITATION -- I extended PREREG-5 2.7's own three-part repair-bar test
    to this specific question independently, per EV-MLKEM-f65f00.third_attempt_boundary_ruling
    part (b): (1) it specifies no new criterion, clause, gate, or working assumption over any
    candidate; (2) it measures a GENUINELY DIFFERENT OBJECT -- instrument calibration against a
    known ground truth, not a repeat of "does ROUTE-I'' agree with ROUTE-P," a positive control
    of the kind docs/inventor-protocol.md section 3 already requires elsewhere in this
    campaign's conventions and was never actually built for this D_route mechanism; (3) its
    outcome is a statement about the instrument's own power, not a re-score of hkz's
    admissibility or a repaired gate's pass/fail. THE TEST IS SATISFIED, matching the pattern
    used three times before in this lineage (PREREG-3 3.6, PREREG-4 2.7, DEC-20260813-1aae44
    section 4, PREREG-5 2.7). I agree with both reviews' conclusion on independently re-derived
    grounds. See ruling_7 and next_actions.

  # ==================================================================
  # ITEM 4 -- THE FALSE "REUSED IDENTICALLY" CLAIM (RT-9)
  # ==================================================================
  ruling_4_logdet_correction: >-
    STATED PLAINLY, AS A FACTUAL CORRECTION THE COMMITTED RECORD OWES, NOT A PREFERENCE. The
    producer's Independence Declaration states ROUTE-P's logdet formula "is REUSED IDENTICALLY"
    as the closed form (d-k)*log(q). This is checkably false: ROUTE-P's actual, as-run hkz
    computation (measure_relvar.py:564,569-570) uses the EMPIRICAL, GSO-summed
    logdet=0.5*sum(log(r)) from hkz_profile, never the closed form (which computes a DIFFERENT
    candidate, X_null, elsewhere in the same file). The Red Team quantified this exactly: for
    L9 (d=30,k=9) the two logdet estimates differ by 9.47e-16, contributing EXACTLY
    8.881784e-16 = 2^-50 to the resulting hkz value -- one of the exact two nonzero deviation
    magnitudes found throughout the producer's own reported per-basis arrays. Full text and
    the per-lattice table in EV-MLKEM-f65f00.logdet_correction, which this record adopts as the
    committed correction: the two routes deliberately substitute a different, though
    mathematically-equivalent-in-exact-arithmetic but numerically distinct logdet estimator --
    not identical reuse -- and this substitution is credited as one concrete, quantified
    source of D_route'', not attributed to unspecified summation-order rounding alone. This
    changes no number, VERDICT'', or the termination branch.

  # ==================================================================
  # ITEM 5 -- KNOWLEDGE PROMOTION, RULED IN SECTION 10 BELOW
  # ==================================================================
  ruling_5_knowledge_promotion_pointer: >-
    See knowledge_promotion below. Judged, on the merits, to WARRANT promotion -- a KN-FIND-*
    identifier was requested from the Coordinator's principal per this goal's own established
    pattern (DEC-20260813-1aae44 section 10), since none was reserved at batch open.

  # ==================================================================
  # ITEM 6 -- THE TWO MINOR/MODERATE FINDINGS, CARRIED AT FULL WEIGHT
  # ==================================================================
  ruling_6_minor_findings: >-
    RT-10 (MODERATE) and RT-11 (MINOR) are carried at full weight in
    EV-MLKEM-f65f00.carried_findings, per this goal's established practice, and neither affects
    any ruling above. RT-10: the producer's characterization of the uniform D_route'' as
    generic "floating-point summation-order rounding" understates how structured the pattern
    actually is -- all 48 comparisons quantize EXCLUSIVELY to {0, 2^-50, 2^-49}, the signature
    of a small, fixed set of deterministic bit-level causes (of which item 4's logdet mechanism
    is now one, positively identified), not diffuse noise; this narrows the offered explanation
    without alleging concealment, since the producer's own report already discloses the pattern
    as unanticipated. RT-11: the Red Team's own third-implementation probe exhibited an
    unresolved, basis-specific anomaly at hkz/L7_b5 basis i=0, explicitly recorded as a probable
    bug in the Red Team's own bookkeeping, not a finding about the producer, per AGENTS.md
    rules 5 and 8.

  # ==================================================================
  # ITEM 7 -- WHY THIS IS NOT A FURTHER CONSECUTIVE GATE/CRITERION REPAIR
  # ==================================================================
  ruling_7_repair_bar_ruling: >-
    RE-DERIVED, NOT MERELY CITED, EXTENDING PREREG-5 2.7'S OWN THREE-PART TEST A FOURTH TIME TO
    THIS DECISION'S OWN ACTS (the corrected citable wording, the revisit-condition ruling, the
    third-attempt-boundary ruling, and the commissioning of a mutation-testing control),
    matching the pattern DEC-20260813-1aae44 section 4 used for its own close. (1) THIS
    DECISION SPECIFIES NO CRITERION, CLAUSE, GATE OR THRESHOLD: the corrected citable wording
    narrows what an ALREADY-FIRED branch's ALREADY-WRITTEN default license may be cited as
    establishing; the revisit-condition ruling decides whether an ALREADY-DECLARED consequent
    fires on ALREADY-COLLECTED evidence; the third-attempt-boundary ruling decides whether an
    ALREADY-DECLARED boundary applies and whether a DIFFERENTLY-DESIGNED control is barred by
    it -- none creates a rule any future candidate would be scored against, and none touches
    A-1 or any admissibility gate. (2) THIS DECISION RE-VERIFIES MEASUREMENTS ALREADY MADE
    (BATCH-fbb639's original hkz comparison, PREREG-5's own re-run of the independence question)
    rather than measuring a new class of object; the mutation-testing control it licenses (but
    does not itself run) measures a GENUINELY DIFFERENT OBJECT (instrument calibration, not a
    repeat comparison), per ruling_3's own independent re-derivation. (3) ITS OUTCOME IS A
    VERIFICATION/CORRECTION RESULT ABOUT PRIOR MEASUREMENTS' CITABLE SCOPE, NOT A REPAIRED
    GATE'S PASS/FAIL: it touches no A-1 sub-clause, extends none, replaces none, and licenses no
    new claim about any lattice beyond citing an EXISTING BATCH-fbb639 verdict with a corrected
    scope. THE SEVEN-CONSECUTIVE-INSTRUMENT-BATCH COUNT REMAINS SEVEN, unaffected by
    BATCH-a6fab5's own measurement or by this decision, for the identical structural reason
    PREREG-3 3.6, PREREG-4 2.7, DEC-20260813-1aae44 section 4 and PREREG-5 2.7 each
    independently gave. Neither review contests this.

  # ==================================================================
  # RATIONALE
  # ==================================================================
  rationale:
  - >-
    THE BATCH DISCHARGED ITS PREDECESSOR'S SINGLE NEXT ACTION IN FULL. It built the ONE thing
    DEC-20260813-1aae44 named as decisive -- a genuinely HKZ-quality, non-code-shared route for
    hkz -- and both reviews independently confirm it IS genuinely HKZ-quality and non-code-
    shared, by direct code-body comparison plus a structural class-identity argument
    (fpylll.fplll.bkz.BKZReduction vs. fpylll.algorithms.bkz.BKZReduction, confirmed distinct
    via inspect.signature).
  - >-
    THE HARD CALL IS THE SAME SHAPE AS DEC-20260813-1aae44's OWN HARD CALL, TWO LEVELS FURTHER
    IN. That decision found T-INDVERIFY-ARTIFACT fired correctly for hkz but its default
    MEANS-text (code-sharing) overstated what the batch's evidence supported (reduction-quality
    mismatch). This decision finds the SAME structure one level further: T-HKZINDEP-CONFIRMED
    fired correctly for hkz, but its default license text ("exactly as lam1n's discharged")
    overstates what THIS batch's own convergent evidence supports (real power against
    wrapper-level defects, near-zero power against a shared-kernel/definitional-formula
    defect). Recording the corrected wording, rather than letting the default license stand, is
    deliberate for the identical reason: the informal reading a future citation would reach for
    is not the one this batch's evidence supports.
  - >-
    THE REVISIT-CONDITION AND THIRD-ATTEMPT-BOUNDARY RULINGS ARE THE MOST CONSEQUENTIAL CALLS
    IN THIS DECISION, AND BOTH WERE REASONED THROUGH RATHER THAN DEFAULTED. For the revisit
    condition, I did not simply apply the frozen text's arm 1 mechanically without asking
    whether the corrected scope changes its worth -- I found it does not change WHICH status
    fires (the frozen text's own arm 1 antecedent is satisfied, and no lesser label is mine to
    invent), but it does change how that status must be recorded. For the third-attempt
    boundary, I did not treat "T-HKZINDEP-CONFIRMED fired, therefore no more attempts of any
    kind" as automatic, nor did I treat the narrower scope as automatically re-opening a fourth
    iteration of the SAME measurement -- I distinguished the ordinary comparison (barred by the
    boundary) from a structurally different instrument-calibration control (not barred),
    independently re-deriving PREREG-5 2.7's own test rather than adopting either review's
    argument by citation.
  - >-
    THE CONVERGENCE IS WHAT MAKES THE CENTRAL FINDING ACTIONABLE RATHER THAN SUGGESTIVE. Two
    reviewers, working from the same frozen text without reading each other's write scope,
    independently reached the "fidelity-matching forces near-certain agreement" conclusion by
    genuinely different supporting methods -- a from-scratch dual-route reimplementation
    isolating the residual to a logdet-formula artifact; a same-code-rerun null baseline plus a
    third, differently-structured implementation. Neither review's finding borrows the other's
    warrant.
  - >-
    THE ADVERSE ITEMS ARE CARRIED RATHER THAN BURIED. The false "REUSED IDENTICALLY" claim, the
    quantization-signature finding, and the Red Team's own probe anomaly are all recorded at
    full weight, none smoothed into a `passed` verdict's silence.
  - >-
    WHAT THIS BATCH IS NOT ALLOWED TO BUY, STATED SO NO LATER READER HAS TO INFER IT. It buys
    no admissibility claim about any lattice, no statement about ML-KEM, no closure of the
    admissibility-gate lane, no declaration that any C3 candidate is safe, no rescoring of any
    prior batch, and no retirement of AM-3.

  # ==================================================================
  # WHAT DOES NOT CHANGE
  # ==================================================================
  binding_carries_restated_and_not_re_litigated:
  - CLAIM TIER STAYS TOY, UNCONDITIONALLY. No number transports to beta = 606, d = 1420 or any
    FIPS 203 parameter set by extrapolation, analogy or any other route.
  - AM-3 IS NOT RETIRED. AM-10 through AM-18 and their carries are in force. BATCH-a44d08,
    BATCH-4ed139, BATCH-9e3584, BATCH-cbe023, BATCH-6b6e78, BATCH-fbb639 and BATCH-6e08fe are
    NOT RESCORED OR REVALIDATED in any respect by anything in this batch.
  - NEITHER SUB-6x COUNT IS CITABLE. "A factor of 6 to 31" is FALSE; the citable range is
    4.87x to 31.03x. "Genuinely cross-platform" is NOT citable.
  - KN-FIND-7d098b, KN-FIND-9d44b4, KN-FIND-9b5df0 AND KN-FIND-7de6b6 ARE CITED, not restated
    as new anywhere in this batch or this record.
  - lam1n's T-INDVERIFY-CONFIRMED discharge (BATCH-6e08fe) is NOT reopened, re-scored or
    revisited by anything in this decision; lam1n was out of scope for this batch (PREREG-5
    section 0).
  - T-C3LANE-OPEN-PARTIAL and T-INDVERIFY-ARTIFACT-PARTIAL close no lane and are EXPLICITLY
    NOT retroactively changed by anything in this decision. This batch closes, pauses and
    completes nothing.
  - >-
    RULE 12 IS UNMET AND UNWAIVED, AND THIS DECISION DOES NOT EXEMPT ITSELF FROM THE STANDARD
    IT APPLIES TO THE PRODUCER OR TO hkz'S CENTRAL FINDING. Both reviews of THIS batch are two
    SESSIONS ON ONE MODEL and, per both reviews' own measured records, the same sandboxed
    execution recipe as the producer -- the Red Team's own disclosure states this is "very
    likely the SAME container/host as the producer." The irony is named rather than left
    implicit, exactly as EV-MLKEM-5aa471 and EV-MLKEM-965a37 named it for their own reviews.
  - THE SPLIT-PRODUCER NOTARIZATION PATTERN IS RETAINED UNCHANGED, having now worked nine
    times and been verified in both directions by independent sessions each time.
    knowledge/INDEX.md must NOT be written, regenerated or staged.

  # ==================================================================
