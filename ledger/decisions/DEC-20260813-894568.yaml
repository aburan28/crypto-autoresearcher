coordinator_decision:
  id: DEC-20260813-894568

  context: >-
    BATCH-a6fab5 of GOAL-MLKEM-005 discharged DEC-20260813-1aae44's single next_action against
    PREREG-5, the frozen pre-registration notarized alone at commit
    9d59d1e8e2e5656c65fc8a7fb23ace359044e755 by TASK-20260813-d63082 (zero producer artifacts).
    PREREG-5 commissioned exactly one measurement: a GENUINELY HKZ-QUALITY (not LLL-quality)
    independent ROUTE-I'' for hkz at L7/L9/L11, using the SAME frozen ROUTE-P values and the
    SAME PREREG-3 3.3 comparison formula, at the SAME 6 currently-covered hkz cells --
    explicitly declared as the THIRD dedicated attempt at hkz's independent-verification
    question, with a boundary against a fourth if this attempt also failed to reach genuine
    HKZ-quality independence. The lead producer TASK-20260813-c0ec71 found fpylll genuinely
    available in its own session (independently re-verified, per PREREG-5 section 1's own
    instruction, rather than trusted from the dispatching session's out-of-band check), took
    Branch A (fpylll's own public reduction/enumeration API), and reported
    D_route''=1.7763568394002505e-15 (binary64 machine epsilon) UNIFORMLY at all 6 covered
    cells, VERDICT''=EXCEEDS at 6/6, ALL-SURVIVE=true, firing T-HKZINDEP-CONFIRMED with no
    -PARTIAL suffix -- snapshot-committed at 3d3f5fde552f1a4783616a624f602917719701e8 by
    TASK-20260813-861a58 (9 declared paths). TWO INDEPENDENT REVIEWS RETURNED: Validator
    TASK-20260813-968dc8 (VAL-20260813-968dc8), verdict `passed`; Red Team TASK-20260813-5b09b0
    (RT-20260813-5b09b0), two MAJOR objections (RT-8, RT-9) plus one MODERATE (RT-10) and one
    MINOR (RT-11), stating explicitly the branch fires correctly and it is "not arguing to
    reopen or reverse the branch call." BOTH REVIEWS, INDEPENDENTLY AND VIA GENUINELY DIFFERENT
    METHODS, CONVERGE ON A MAJOR FINDING THAT NARROWS WHAT THE BRANCH'S DEFAULT LICENSE TEXT
    MAY BE CITED AS ESTABLISHING, WITHOUT DISPUTING THE BRANCH CALL ITSELF. This decision is
    that batch's official close.
    CLAIM TIER TOY, UNCONDITIONALLY: nothing here bears on ML-KEM security, on any FIPS 203
    parameter set, on any attack cost, or on any cost model.

  decision: revise

  decision_note: >-
    `revise` is the ACTION -- the evidence record is committed with the termination branch
    read exactly as fired, the discharge's default MEANS-text corrected and narrowed per the
    convergent review finding, a factual correction to the producer's Independence Declaration
    entered, the revisit condition and the third-attempt boundary both ruled on explicitly, and
    the successor's single next action specified -- and it is NOT a verdict on any proposition
    about a lattice. NOTHING IS `support`ed, `weaken`ed OR `reject_scoped` HERE; no hypothesis
    status moves and none is named (EV-MLKEM-f65f00.hypothesis_id is null, by design). `approve`
    would understate the work this decision does: it would treat the Validator's `passed`
    verdict and PREREG-5's own default license text for T-HKZINDEP-CONFIRMED as sufficient on
    their own, when both reviews' own convergent central finding shows that default text
    overstates what the data establishes -- exactly the situation DEC-20260813-1aae44 itself
    resolved with `revise` rather than `approve` for hkz's T-INDVERIFY-ARTIFACT-PARTIAL one
    level back. `reject_scoped` would be forbidden even if it applied: no hypothesis is being
    adjudicated and this is a single, unreplicated (model-correlated) batch, and AGENTS.md
    forbids `reject_scoped` on a single unreplicated empirical-only run in any case (this
    record's strength is `replicated` for its central findings, not empirical_only, but the
    prohibition's logic -- do not treat one model-correlated batch as sufficient for the
    strongest negative verdict -- applies with equal force here, and no negative verdict about
    any lattice is being reached regardless). `pause` is unavailable for the same reasons prior
    decisions in this goal gave: GOAL-MLKEM-005's pause_conditions are INFRASTRUCTURE-ONLY plus
    a user request, and nothing here is either. THIS BATCH CLOSES, PAUSES AND COMPLETES
    NOTHING. T-HKZINDEP-CONFIRMED closes no lane by itself -- PREREG-5 2.6 is explicit its
    FORBIDS list includes closing, pausing or completing GOAL-MLKEM-005. T-C3LANE-OPEN-PARTIAL
    and T-INDVERIFY-ARTIFACT-PARTIAL are EXPLICITLY NOT retroactively changed by anything in
    this decision, exactly as PREREG-5 states throughout.

  target_ids:
  - GOAL-MLKEM-005
  - BATCH-a6fab5
  - EV-MLKEM-f65f00
  - TASK-20260813-94e686
  - TASK-20260813-d63082
  - TASK-20260813-c0ec71
  - TASK-20260813-861a58
  - TASK-20260813-968dc8
  - TASK-20260813-5b09b0
