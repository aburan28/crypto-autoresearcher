    - >-
      C-INDEP IS ENFORCED BY ATTESTATION AND DECLARATION, NOT BY A MECHANISM.
      Nothing in this harness can prove a session did not read a file; DP-7 is
      a dispatcher attestation and READ_DECLARATION.json is the executor's own
