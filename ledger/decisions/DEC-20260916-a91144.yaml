coordinator_decision:
  id: DEC-20260916-a91144
  batch_id: BATCH-94168f
  goal_id: GOAL-ICPERF-e6b6a4
  supersedes: null
  supersedes_note: >-
    Supersedes nothing. DEC-20260916-3c0cf5 stands entirely as written; this
    decision discharges the SECOND of its next_actions ("mint an executor TASK
    for EXP-ICPERF-2f2e40 with archived_by bound to a snapshot card BEFORE it
    is dispatched") and partially discharges item U7 of the write-once
    checkpoint shard ledger/goals/GOAL-ICPERF-e6b6a4/checkpoints/BATCH-94168f.yaml,
    which is immutable and is NOT edited. That shard remains historically
    accurate for the moment of the design snapshot; this record supplies what
    followed. No new checkpoint shard is due: the checkpoint duty attaches to a
    LEDGER archive, and all three archives in this batch are SNAPSHOT archives.

  context: >-
    A portfolio pass established that GOAL-ICPERF-e6b6a4 has NO executable work
    queued: `goal_portfolio_health.py` reports Ready (0);
    `newest_experiments.py` returns six experiments all at
    `needs_implementation_or_plan`; and of the nine approved experiments with
    runnable code, every one already carries at least one run, so none is an
    unexecuted approved contract. Exactly one approved contract has NO code:
    EXP-ICPERF-2f2e40 (approved_by DEC-20260916-3c0cf5, assigned_to executor,
    `code: null`, directory containing only specification.yaml). Its
    `required_artifacts` demand experiments/EXP-ICPERF-2f2e40/code/ with a
    recorded sha256 per file and the executor's read declaration for C-INDEP.
    DEC-20260916-3c0cf5 itself recorded why it was not dispatchable: "NO
    EXECUTOR HANDOFF EXISTS ... approving a protocol and dispatching it are
    different acts, and the dispatch preconditions of AGENTS.md cannot even be
    stated on a card that does not exist." Four pre-allocated, --check-verified
    identifiers were supplied to close that gap. This decision writes the
    cards. It DISPATCHES NOTHING, launches nothing, implements nothing, commits
    nothing, and changes no status.

  decision: approve
  decision_scope_note: >-
    `approve` names the operative act: the three task cards below are approved
    as written and enter the BATCH-94168f queue. A reader who takes `approve`
    to mean that anything ran, that EXP-ICPERF-2f2e40 was dispatched, or that
    any hypothesis moved has read the verdict and not the record. This is
    /coordinate, which ranks, approves, dispatches non-execution work and
    archives, and which NEVER launches a scientific trial. EXP-ICPERF-2f2e40
    remains `approved`; EXP-ICPERF-61c136 and EXP-ICPERF-42ef30 remain `draft`
    at approved_by null; H-ICPERF-afe62e, H-ICPERF-81de5c and H-ICPERF-f08b1e
    are untouched; GOAL-ICPERF-e6b6a4 remains `active`.

  target_ids:
    - BATCH-94168f
    - EXP-ICPERF-2f2e40
    - TASK-20260916-3355fc
    - TASK-20260916-2c4679
    - TASK-20260916-8d493b

  # -------------------------------------------------------------------
  # THE RANKING: WHY THIS ACT AND NOT ANOTHER
  # -------------------------------------------------------------------
  ranking:
    method: >-
      ECC first (AGENTS.md "ECC comes first"; GOAL-ICPERF-e6b6a4 is a declared
      ECC area), then expected information gain per unit of work THIS LANE can
      actually do, then unblocking power, then disjointness from the concurrent
      lane. Unlimited budget removes the batch ceiling and NOT the duty to
      rank; no task here is dispatched that cannot be ranked ahead of doing
      nothing.
    selected:
      rank: 1
      act: >-
        Write the executor implement-and-run card for EXP-ICPERF-2f2e40, plus
        the archival cards that own its deliverables and the dispatch package.
      why_first: >-
        FOUR REASONS, ANY TWO OF WHICH WOULD SUFFICE. (a) It is the ONLY
        approved contract in the portfolio with no run and no code: every other
        approved runnable contract already has at least one run, so this is the
        single place where a card converts an approval into an observation
        rather than duplicating one. (b) It UNBLOCKS the most: four other
        ranked ICPERF ideas (0d8e90, 3119c9, eee7e4, 8fe0ef) name its sampler
        or its table as the source of their certified-U/S targets or their
        yield ground truth, and EXP-ICPERF-61c136's approval precondition AP-1
        is literally the independent acceptance of this contract's output. (c)
        It is DISPATCHABLE: it needs no Groebner engine (the table IS the UNSAT
        certificate), it is disjoint from BATCH-a33cda on write scope and
        software, and its primary metrics are load-invariant counts. (d) It is
        the standing instruction of two prior decisions (DEC-20260915-428a17
        next_actions; DEC-20260916-3c0cf5 next_actions item 2).
      what_it_costs_if_wrong: >-
        This run becomes the certificate basis for every later ICPERF
        point-decomposition measurement. A counting or convention defect here
        propagates into evidence that looks sound. That is why C-RECON runs
        before any new cell, why C-CERT-EMIT is the one hard stop, and why the
        executor card is built around C-INDEP rather than around throughput.
    rejected_alternatives:
      - alternative: Dispatch one of the nine approved experiments that already has runs, for a replication.
        why_not: >-
          None was ranked for replication by any committed decision, and
          "Ready (0)" is not a reason to manufacture work. AGENTS.md: never
          dispatch a task you cannot rank ahead of doing nothing; an active
          goal whose every route is impeded is reported as impeded. This goal's
          route is not impeded.
      - alternative: Approve EXP-ICPERF-61c136 or EXP-ICPERF-42ef30 to create more runnable work.
        why_not: >-
          Both carry enumerated, substantive approval preconditions.
          61c136's AP-1 is that its instances DO NOT EXIST -- they are
          2f2e40's deliverable, and the gate is on INDEPENDENT ACCEPTANCE
          rather than delivery because a wrongly labelled U instance is
          satisfiable, returns few conflicts, and thereby FAKES the L4
          sub-exhaustive signal the experiment exists to look for. 42ef30's
          AP-2 is IMP-1. Approving either to fill a queue would be exactly the
          make-work an unlimited budget invites.
      - alternative: Write the review round now, using the spare identifier as a reviewer card.
        why_not: >-
          See `review_plan_deferral` below. J2 must be BLIND and J1/J3 must not
          be, so they cannot be one reviewer; one spare identifier cannot buy a
          round whose joints are each singly owned, and a round that assigns
          two joints to one reviewer measures shared taste rather than
          coverage. The spare is used instead for an archival task that is
          genuinely required and whose absence would leave four ledger records
          with no archival owner.
      - alternative: Open work on BATCH-a33cda, where the live activity is.
        why_not: >-
          Not this lane's. TASK-20260915-abf147 holds an unreleased claim there
          and that batch's queue, claims, goal head and review tree are
          explicitly not_in_scope for every card written here.

  # -------------------------------------------------------------------
  # WHAT WAS WRITTEN
  # -------------------------------------------------------------------
  cards_written:
