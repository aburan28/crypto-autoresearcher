      path: ledger/handoffs/TASK-20260916-3355fc.yaml
      to: executor
      kind: implement_and_run
      state: written_not_dispatched
      owns: experiments/EXP-ICPERF-2f2e40/code/, experiments/EXP-ICPERF-2f2e40/runs/, coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-94168f/tasks/TASK-20260916-3355fc/
      archived_by: TASK-20260916-2c4679
      budget: 28800 s / 4 GB / maximum_runs 1
      preconditions: DP-1 .. DP-9, all binding the DISPATCHER
    - id: TASK-20260916-2c4679
      path: ledger/handoffs/TASK-20260916-2c4679.yaml
      to: coordinator
      kind: archive (snapshot)
      state: queued
      owns: the producer snapshot of 3355fc's three subtrees, before any reviewer reads them
      archived_by: TASK-20260916-2c4679 (self, for its own receipt)
      budget: 2700 s / 2 GB / maximum_runs 0
      depends_on: TASK-20260916-3355fc
    - id: TASK-20260916-8d493b
      path: ledger/handoffs/TASK-20260916-8d493b.yaml
      to: coordinator
      kind: archive (snapshot)
      state: queued
      owns: the dispatch package -- this decision and the three cards -- committed BEFORE the executor is launched
      archived_by: TASK-20260916-8d493b (self)
      budget: 1800 s / 2 GB / maximum_runs 0
      depends_on: TASK-20260916-ec9948
  spare_identifier_disposition: >-
    TASK-20260916-8d493b WAS OFFERED AS A SPARE AND IS USED, for a distinct
    archival task rather than as a placeholder. It is genuinely required:
    TASK-20260916-ec9948 is immutable with nine frozen artifact_paths and
    cannot be widened; TASK-20260916-2c4679 runs AFTER the executor and so
    cannot make the executor's own card durable BEFORE it is launched. Without
    8d493b, this decision and the two other cards would have no archival owner,
    and the executor would be dispatched from uncommitted records -- the exact
    remedy-disclosed-as-correction that AGENTS.md forbids treating as
    compliance.

  # -------------------------------------------------------------------
  # RATIONALE
  # -------------------------------------------------------------------
  rationale:
    - id: R-CINDEP
      claim: >-
        The executor card is built around C-INDEP, and C-INDEP is enforced by a
        FRESH SESSION plus an enumerated forbidden-path list plus a written
        read declaration, because nothing weaker can discharge it.
      reasons: >-
        EXP-ICPERF-2f2e40's sharpest named failure is that the new enumerator
        is wrong IN THE SAME WAY as the existing one -- a shared field
        representation, a shared bit-order convention, a shared trace/side
        reading. If that happens, C-RECON's 60/60 status agreement, its 30/30
        certificate preimages and its 45/1/21 root split all pass, confirming a
        shared error; every certified-U and certified-S instance the sampler
        emits inherits it; and every downstream ICPERF certificate carries it
        silently. This is the failure mode validation CANNOT see, because
        validation recomputes from the producer's own artifacts and reproduces
        a wrong-but-self-consistent implementation faithfully (AGENTS.md
        "Review architecture", blind re-derivation). An enumerator written by a
        session that has read the instrument is not a second implementation; it
        is the same program written twice, and C-RECON then proves nothing.
      what_the_card_therefore_requires: >-
        (1) `inference.independent_session_required: true` and DP-7: a FRESH
        session, newly launched for this card, whose transcript contains no
        prior turn opening a forbidden path and which is not a session that
        ran, reviewed, repaired or archived any BATCH-a33cda or BATCH-51e2aa
        ICPERF instrument task, with the dispatcher ATTESTING freshness in the
        launch record. (2) The five file names of C-INDEP resolved to SEVEN
        EXACT PATHS, because `binec.py` and `convert.py` each exist twice.
        (3) DP-8: no forbidden content may reach the session as quoted or
        summarised text -- a leaked function body voids independence exactly as
        a Read does and leaves no trace in the declaration. (4)
        READ_DECLARATION.json naming every path read, with explicit
        `forbidden_paths_read`, `advised_paths_read`, `convention_derived_from`
        and `convention_frozen_before_baseline_read`. (5) The convention frozen
        from the shipped instance files and the curve equation BEFORE any
        C-RECON baseline is opened, because the baselines are serialized field
        elements and a convention read off them is a convention inherited by
        another route -- which would make C-KF-CONVENTION a test of the
        executor's agreement with itself.
      the_line_the_card_draws: >-
        READING DATA IS NOT READING CODE. C-RECON REQUIRES reading the five
        committed baseline artifacts and report.md -- they are the reference
        values, and a comparison you may not read is not a comparison. What is
        forbidden is val_gf2n.py, the program that produced them. Likewise AR-2
        requires DRIVING the vendored Weil_descent program; invoking a program
        is not reading its source, and if it cannot be driven without reading
        the source that is an AR-2 refusal with its reason recorded, not a
        licence to read.
      what_is_not_claimed: >-
        Independence here is of the IMPLEMENTATION, not of the EXPECTATION. The
        contract's preregistered_prediction states the target numbers (30/30,
        21 mixed, 45/1/21, 60/60, ratio 1.000) and C-RECON is a declared
        reproduction, so the executor necessarily knows them. The card says so
        rather than pretending otherwise, and imposes the obligation that
        follows: report the number the code produces, never the number
        expected, and on a difference stop at the contract's stopping rule
        instead of debugging toward the expectation.
    - id: R-PRECONDITIONS
      claim: >-
        Every precondition on all three cards is addressed to the DISPATCHER
        and is stated in a block separate from the agent-facing constraints,
        because the two readers are not the same reader.
      reasons: >-
        AGENTS.md "Dispatch preconditions bind the DISPATCHER, not the agent"
        was added after a violation by a session on THIS GOAL: on 2026-09-15 a
        Coordinator read TASK-20260915-532164's objective, constraints and
        completion gate, skipped its dispatch_preconditions, and launched with
        `archived_by` still null and no lane claimed, against a precondition
        that said so in terms. The violation was caught by the agent that had
        been dispatched, not by the dispatcher (CORR-20260915-6708e4). The
        three standing preconditions -- archived_by bound, declared inputs
        committed and pushed, a lane claimed -- appear on every card here and
        are waived by none of them. `archived_by` on the executor card is bound
        to TASK-20260916-2c4679 AT THE MOMENT THE CARD IS WRITTEN, not later:
        binding it afterwards is a remedy disclosed as a correction, and a
        precondition is not waived by the work turning out fine.
    - id: R-ORDERING
      claim: >-
        One archival task owns each artifact set, archives run ALONE and
        strictly in sequence, and the sequence is ec9948 -> 8d493b -> dispatch
        3355fc -> 2c4679 -> review -> a ledger archive this lane cannot yet name.
      reasons: >-
        A snapshot archive precedes independent review; a ledger archive
        follows it and precedes a state transition. 8d493b exists because the
        executor may not be launched from uncommitted cards and ec9948 is
        immutable; 2c4679 exists because a reviewer may not read bytes nobody
        has frozen. The card RECORD and the card's DELIVERABLES may have
        different archival owners -- each has exactly one -- and both are named
        explicitly on every card (`archived_by`, `this_record_archived_by`) so
        no record is doubly owned and none is unowned.
      one_disclosed_overlap: >-
        Three archival cards in this batch each ALSO-STAGE the one evolving
        coordination file (the dispatch queue), which is not hash-bound as an
        artifact_path for the fixed-point reason TASK-20260915-1942e2 recorded.
        That is an overlap in the staging set and not a concurrency hazard,
        because archive commits run alone and in sequence. Recorded here rather
        than left for a reader to trip over.
    - id: R-RESOURCE
      claim: >-
        The resource posture is stated explicitly rather than assumed, and the
        binding constraint runs the OPPOSITE way from the obvious one.
      reasons: >-
        EXP-ICPERF-2f2e40 needs NO quiet host: every primary metric is a COUNT
        (table entries, distinct x-coordinates, root classes, agreement counts,
        decomposable fractions, completeness ratios), counts are invariant
        under load, the contract makes NO timing claim, and no wall-clock
        number it produces may enter a boundary-table cell or any ratio. The
        stated cost of that design decision: this run contributes NOTHING to
        the seconds-valued columns of RQ-ICPERF-94c86e, which stay owed to
        batches that can hold the machine quiet. BUT this run drives WDSat and
        CryptoMiniSat thousands of times and builds multi-million-entry tables,
        so it CONTRIBUTES load that would contaminate a concurrent TIMING
        measurement on BATCH-a33cda, whose `max_concurrent_basis` requires a
        quiet host at load average below 0.5 -- and that contamination would be
        invisible in THIS run's artifacts. Hence DP-6 on the executor card: no
        BATCH-a33cda timing task may hold a live claim at launch. A validator
        or blind re-derivation claim is compatible; its verdicts are counts and
        readings.
      concurrency_reading: >-
        As of 2026-09-16T08:28Z, live claims on GOAL-ICPERF-e6b6a4:
        TASK-20260915-abf147 (BATCH-a33cda, validator, blind Groebner
        re-derivation joint R6, claimed 08:28:48Z, expires 12:28:48Z) -- ONE.
        TASK-20260915-3f4b52 was RELEASED `completed` at 08:15:58Z and is NOT
        live. TASK-20260915-4f4027 epoch 2 was released. `max_concurrent` is 2,
        so one slot is free for BATCH-94168f. THIS IS A READING AND NOT A
        RESERVATION: re-derive it at dispatch time with `git fetch` and
        `tools/research_dispatch.py --claims refs`, because visibility is fetch
        and collisions resolve by lowest epoch.
    - id: R-BUDGET
      claim: >-
        No budget field on any of the three cards is null, and each field means
        a different kind of thing.
      reasons: >-
        `maximum_runs` is a HARD SCIENTIFIC CONSTRAINT taken verbatim from the
        frozen contract (1 for the executor -- one run DIRECTORY, not one
        invocation) or from the nature of the task (0 for both archives: an
        archival card must never be the card that reruns what it archives).
        `memory_gb` is machine protection with a stated binding term.
        `wall_clock_seconds` on the executor card is an EXPLICITLY JUSTIFIED
        PROCESS WATCHDOG, not a research budget: routine estimates are advisory
        under CLAUDE.md's research-budget policy, the contract sets
        `executor_wall_clock_seconds` null on purpose, AND its stopping rules
        already define the behaviour at expiry, so a watchdog is what the
        contract expects rather than an addition to it. Watchdog expiry
        CHECKPOINTS the task -- stop, keep every completed table and the
        partial results.jsonl, run the reduction, record which phases finished
        -- and does not exhaust the campaign, does not require another user
        budget approval, and is categorically not evidence. The ECC campaign
        budget fields (maximum_batches null, total_wall_clock_seconds null) are
        not touched by this decision.
    - id: R-CONTRACT-DIVERGENCE
      claim: >-
        The executor card sets `independent_session_required: true` where the
        frozen contract's own inference block reads false. This is a disclosed
        strengthening of the DISPATCH ENVELOPE and is NOT a protocol amendment.
      reasons: >-
        The contract's field is the experiment's inference requirement; the
        card's is the dispatch envelope's, and it is the mechanism by which
        C-INDEP -- a control the contract FROZE -- is actually discharged on
        this runtime. It alters no control, metric, budget, stopping rule,
        invalidation rule or success criterion, so it relaxes nothing and the
        frozen contract is NOT edited. A genuine protocol change would be an
        additive `protocol_amendment` record authored by the Coordinator, which
        this is not. It is recorded here and on the card rather than left for a
        reader to notice, because a card silently stricter than its contract is
        still a divergence and an undisclosed one is how protocols drift.
    - id: R-D6
      claim: >-
        Bus message MSG-20260916-a27f8d does NOT bear on EXP-ICPERF-2f2e40's
        validity, and three things from it transfer anyway.
      reasons: >-
        D6 is an additive, UNACCEPTED amendment to
        experiments/EXP-ICPERF-e21835/code/bench.py (the poll loop's
        time.sleep replaced by a bounded p.wait()), which redefines `wall_s`
        for fast children and makes a hash recomputation against
        RUN-ICPERF-a4a24b's manifests fail BY DESIGN rather than by defect
        (CORR-20260916-d51133). EXP-ICPERF-2f2e40 reads no file under
        EXP-ICPERF-e21835, uses no Groebner engine, inherits no timing
        quantity, makes no timing claim, and its own instrument does not yet
        exist. NOTHING IN THIS CONTRACT PINS e21835 BYTES, so there is nothing
        here to re-pin, and the message's reviewer instruction ("review against
        code.commit 2bfdc65b, not the tree") is addressed to
        TASK-20260915-3f4b52 and TASK-20260915-abf147 on the other lane. The
        judgement is recorded either way rather than left implicit, because
        "high priority, addressed to all" plus "does not apply" is a
        conclusion, not a non-answer.
      what_transfers: >-
        (1) PIN THE COMMIT, NOT THE TREE. The general lesson applies at zero
        cost to this contract's own inputs, which live under
        coordination/review/icperf-20260913-66fd51/ and
        inputs/TRIMOSKA-ECICB-2024/ and could in principle change the same way;
        hence the executor card's `input_pinning_rule`, requiring the read
        commit AND a sha256 per file for the eight C-RECON / evidence artifacts
        and UPSTREAM_SHA256SUMS.txt, so a later byte change reads as a change
        rather than as an integrity defect in this run. (2) NEVER EDIT A
        COMMITTED RECORD TO ADD A SCHEMA FIELD; SUPERSEDE IT
        (CORR-20260916-5166fe records a session that edited an immutable
        epoch-1 manifest and made a completed archive permanently
        unverifiable). Carried into the executor card's constraints. (3) Two of
        C-INDEP's seven forbidden paths live in the e21835 code tree that is
        actively churning under another session -- one more reason for DP-7's
        fresh session and for not_in_scope.
      what_a_message_is: >-
        A POINTER, NEVER A PERMISSION AND NEVER EVIDENCE. This decision cites
        the message as coordination traffic and rests on the committed records
        it refs (CORR-20260916-d51133, CORR-20260916-5166fe), not on the
        message text.
    - id: R-EXECUTOR-SCOPE
      claim: >-
        The executor implements AND runs. It does not interpret, does not
        evaluate the hypothesis, does not compose evidence, does not change any
        status, and does not commit.
      reasons: >-
        The separation is what makes the numbers usable: an executor that
        interprets its own output has fused observation and conclusion, which
        is core rule 1. The card says so four times in four places (objective,
        `what_this_card_does_not_authorize`, constraints, completion_gate)
        because that is the instruction most often eroded under time pressure.
        It also states that a timeout, crash, OOM, watchdog stop, refused
        admission or unfinished all-solutions run is an INFRASTRUCTURE OUTCOME
        -- never negative mathematical evidence, never evidence that an
        instance is unsatisfiable, never a completeness failure -- and that
        every claimed decomposition is re-verified with GF(2^n) arithmetic
        INDEPENDENT of the solver, a solver's SAT answer never being the
        certificate.

  # -------------------------------------------------------------------
  # REVIEW
  # -------------------------------------------------------------------
  review_plan_deferral:
    deferred: true
    what_is_owed: >-
      EXP-ICPERF-2f2e40 sets `review_required: true` and is a claim-relevant
      producer whose output becomes the certificate basis for every later
      ICPERF point-decomposition measurement. An independent round IS owed
      before any evidence record is composed from it, and its `review_plan`
      must be written BEFORE ANY REVIEWER RUNS.
    what_the_plan_must_own:
      - claim_under_review stated as the EXECUTOR stated it, not as the Coordinator would restate it.
      - coordinator_prior on each joint, recorded before any report returns.
      - 'J1: the C-RECON reproduction against EV-ICPERF-390707 joint V1, count by count.'
      - 'J2: D2''s per-family M1/M2 mixed-root split -- BLIND re-derivation from the statement of the count and the parameters alone, with blind_from naming experiments/EXP-ICPERF-2f2e40/code/ and the run''s recon/ and root_classes.json. D2 is this Coordinator''s own derivation, compared against exactly one observed number (21), and a total of 21 reached with M2 > 0 would match the recorded number while falsifying D2.'
      - 'J3: the certified-U/S sampler''s certificate arithmetic.'
      - 'J4, WHICH NO PRIOR RECORD NAMED: verification of C-INDEP ITSELF -- read READ_DECLARATION.json, CODE_SHA256.json and the dispatcher''s freshness attestation, and judge whether the independence C-RECON rests on was actually obtained. Without J4 the round would take the independence claim on trust, which is the one thing a round about a shared-error failure mode must not do.'
      - blindness.mutual true; a proves_too_much control naming objects where the conclusion is known false; blind_rederivation required for the D2 count.
    why_not_written_now: >-
      J2 is BLIND and J1/J3 are not, so they cannot be the same reviewer, and
      J4 reads the artifacts J2 must not. A compliant plan needs at least two
      and preferably three reviewer TASK identifiers. This lane was allocated
      ONE spare, which TASK-20260916-8d493b uses for a required archival task.
      Writing a plan that assigns two joints to one reviewer, or that leaves a
      joint unowned, would produce a round whose agreement measures shared
      taste rather than coverage -- the exact defect the plan exists to
      prevent. THE IDENTIFIER SHORTFALL IS THE BLOCKER, it is recorded as such,
      and it is cheap to clear.
    what_would_clear_it: >-
      Three `handoff` identifiers (`python3 tools/allocate_id.py --next handoff
      --date YYYYMMDD`, each `--check`ed) plus one for the eventual ledger
      archive. This is not an impediment on the goal: it blocks a review round
      that cannot begin until a producer has run, and the producer has not run.

