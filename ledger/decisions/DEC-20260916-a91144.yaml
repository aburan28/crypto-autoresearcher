    - ledger/goals/GOAL-ICPERF-e6b6a4/checkpoints/BATCH-94168f.yaml
    - ledger/goals/GOAL-ICPERF-e6b6a4/goal.yaml
    - coordination/goals/GOAL-ICPERF-e6b6a4/lanes/BATCH-94168f.lane.json
    - coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-94168f/dispatch_queue.json
    - coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-a33cda/claims/TASK-20260915-3f4b52.1.release.json
    - coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-a33cda/claims/TASK-20260915-abf147.1.claim.json
    - coordination/bus/messages/MSG-20260916-a27f8d.yaml
