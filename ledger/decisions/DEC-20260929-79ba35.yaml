coordinator_decision:
  id: DEC-20260929-79ba35
  id_provenance: >-
    Pre-minted and --check verified by the top-level session together with
    IDEA-20260929-0238ee, H-SEMBIN-934774, EXP-SEMBIN-e76704,
    TASK-20260929-9dbd8a, RUN-SEMBIN-79996f and the reserved
    EV-SEMBIN-c71cad. This Coordinator holds no shell and minted nothing.
  recorded_at: '2026-09-29'
  decided_at: '2026-09-29'
  decided_by: coordinator
  goal_id: GOAL-SEMBIN-fcb7a2
  question_ids:
    - RQ-SEMBIN-9e8f82
  standing_authorization: >-
    AGENTS.md "Standing user authorization for ideas and experiments" (user,
    2026-09-06: "all is approved. ideas/experiments should be always
    approved"), and the user's in-session direction of 2026-09-29 ("please
    do the next steps"), relayed by the top-level session, to freeze the
    exploratory D_ff separation finding into a frozen experiment and bring it
    into the ledger. Approval here is permission to run a complete protocol;
    it asserts nothing about the hypothesis and validates no result.

  decision: approve
  decision_label: >-
    Approve EXP-SEMBIN-e76704 version 1 (status approved, approved_by
    coordinator) for one execution of the frozen runner as RUN-SEMBIN-79996f,
    and approve H-SEMBIN-934774 as well-formed and worth testing. Dispatch
    TASK-20260929-9dbd8a to the executor once the pre-launch snapshot of the
    contract and src/ is committed.

  context: >-
    On 2026-09-27 the top-level session ran exploratory scripts (now preserved
    at experiments/EXP-SEMBIN-e76704/development/exploratory-20260927/) that
    exhibited an invertible F_2-recombination raising the reduced
    (definition #4) first fall degree of a Weil-descended Semaev S_3 system
    from 2 to 3 at (n, n') = (6, 3), with exhaustive counts over GL_5(F_2),
    a Semaev negative at (4, 2) and a separating degree-matched null at
    (4, 2). This addresses the recommended first target of KN-OPEN-7f0511
    item (A) for the reduced definition only. Those scripts imported the
    instrument from a scratchpad path, so the numbers are not citable. A
    frozen runner (src/run_separation.py) now hard-codes the exploratory
    values as PRED, runs controls C1/C2 and scores itself. No run of it
    exists. No evidence record exists; EV-SEMBIN-c71cad is reserved.

  protocol_readiness:
    checked_against: templates/research-records.md "Experiment" block
    fields_non_null_or_explicitly_not_applicable: >-
      id, hypothesis_id, version, title, status, objective, inputs, controls,
      independent_variables, metrics.primary, metrics.secondary,
      heuristic_under_test (explicit not_applicable), preregistered_prediction
      (quantity, formula, source), scale_relevance (tier toy, justification,
      correspondence explicit not_applicable), tail_checks (explicit
      not_applicable entry), replication (seeds, independent_instances),
      budget (all six fields non-null), stopping_rules, invalidation_rules,
      success_criterion, falsification_criterion, required_artifacts,
      assigned_to, approved_by.
    source_pinning: >-
      sha256 of the four src/*.py files recorded in the specification, as
      computed by the top-level session on 2026-09-29 (this Coordinator has no
      shell and did not compute them). The session reports src/ and
      development/ committed and pushed at 2db2dda9f9.
    proof_search_map: >-
      not_applicable_reason set on H-SEMBIN-934774 and IDEA-20260929-0238ee:
      an empirical/computational replication of exact counts, no theorem,
      bound or reduction claimed, so the KN-TECH-080 proof-oriented gate does
      not apply.
    target_profile: >-
      Not exponent-moving (docs/target-result-profile.md). Admitted as a
      near-zero-cost instrument/definition audit under a published
      polynomial-time claim, on explicit user direction; it displaces no
      exponent-targeting ECC work because it needs one single-threaded
      process and no new implementation.

  target_ids:
    - IDEA-20260929-0238ee
    - H-SEMBIN-934774
    - EXP-SEMBIN-e76704
    - TASK-20260929-9dbd8a
    - RQ-SEMBIN-9e8f82
  identifiers_reserved:
    - {id: RUN-SEMBIN-79996f, note: run id the executor uses; the directory must not exist before launch}
    - {id: EV-SEMBIN-c71cad, note: reserved for the later evidence record; not created by this decision}
    - {id: TASK-20260929-e3eed9, note: post-run snapshot archive of the run directory; minted and checked by the session on 2026-09-29; no record written yet}

  rationale:
    - >-
      The protocol is complete: every template field is non-null or
      explicitly not_applicable, the launcher and outputs are exact, source
      files are hash-pinned, the success and falsification criteria are
      mechanical (the runner's own verdict block), and infrastructure failure
      is separated from evidence by exit code and by SR-2 / IR-1..IR-5.
    - >-
      The uncertainty reduced is narrow and real: whether the exploratory
      counts are reproduced by committed code whose identity is fixed by
      hash. The exploratory scripts ran against scratchpad copies of the
      instrument, so the finding cannot be cited until this run exists.
    - >-
      The design already contains its own controls-before-belief: T3 is a
      Semaev cell that must NOT separate, T4 is a degree-matched null that
      exploration found DOES separate (so the claim is scoped as generic,
      not descent-specific), C1 cross-checks the fast kernel against the
      original instrument, and T1 checks the load-bearing witness by the
      original instrument rather than the fast one.
    - >-
      The predictions are honestly labelled as derived from the exploratory
      run of the same code (preregistered_prediction.source). This
      experiment confirms computation, not a blind prediction, and its
      evidence strength ceiling will be set with that in mind.
    - >-
      Cost is negligible against the program: one pure-Python process, no
      new code, a 24-hour machine-protection watchdog and a 4 GB ceiling.

  evidence_refs:
    - knowledge/open-problems/KN-OPEN-7f0511.md (read in full; item (A) resolution criterion)
    - ledger/questions/RQ-SEMBIN-9e8f82.yaml (read in full)
    - experiments/EXP-SEMBIN-e76704/src/run_separation.py (read in full; PRED, C1, C2, T1-T4, scoring, exit codes)
    - experiments/EXP-SEMBIN-e76704/src/ffd_semaev.py, recomb_search.py, fastfall.py (read in full)
    - experiments/EXP-SEMBIN-e76704/development/exploratory-20260927/control_results.json (T2 counts and witness)
    - experiments/EXP-SEMBIN-e76704/development/exploratory-20260927/nullcontrol_results.json and nullcontrol.log (T3, T4, and the not-automatic cells)
    - experiments/EXP-SEMBIN-e76704/development/exploratory-20260927/recomb2_results.json (slow-instrument cell table; T3 downward 5,376)
    - experiments/EXP-SEMBIN-e76704/development/exploratory-20260927/{recomb2,control,nullcontrol,diagnose}.py (read in full)
    - ledger/proposals/IDEA-20260916-4b7c1e.yaml (lines 280-430; parent proposal of the M-recombination search)
    - ledger/hypotheses/H-SEMBIN-a7e721.yaml (lines 1-60; the Lemma 4 LINK 2 status)
    - templates/research-records.md; tools/validate_ledger.py (required fields, run schema, cross-reference checks)
  evidence_refs_note: >-
    The T1 new_falls values [0, 1, 15] / [0, 0, 10] and the witness degree
    vectors are the top-level session's report of diagnose.py console output;
    no file preserving that output exists. They are recorded as secondary,
    unscored expected values only.

  limitations:
    - >-
      Not independent pre-registration; a pass shows reproducibility of a
      computation, not the success of a blind prediction.
    - >-
      Toy tier (N <= 6); nothing about asymptotics, n-growth, cryptographic
      parameters, subexponentiality, or whether D_ff^max is bounded.
    - >-
      Reduced definition #4 only; the Lemma 4 gap (unproved in 2015/984,
      literal form false per H-SEMBIN-a7e721) blocks transfer to the true
      degree and Nagao's D_ff^max is stated over definition #1.
    - >-
      C1 compares two implementations of one definition on the identity only;
      a shared definitional error is invisible to it. A blind re-derivation of
      the T1 witness from the statement of the quantity is the check that can
      see one (next_actions NA-4).
    - >-
      The runner's downward counter is partial (skips M with a fall at the
      identity degree), and x_R is not written to results.json.
    - >-
      This Coordinator has no shell: it ran no command, did not parse the
      written YAML, did not run tools/validate_ledger.py, and did not compute
      the source hashes (session-reported). The session runs the validator on
      these files (NA-1).
    - One model family serves every role by runtime inheritance; session independence is real, model independence is not claimed.

  next_actions:
    - id: NA-1
      first_next_action: true
      role: top-level session (dispatcher)
      text: >-
        Parse the four written records and run python3 tools/validate_ledger.py,
        fixing any error attributable to them by editing these uncommitted
        records (never tools). The frozen src/ and development/ files are
        already committed and pushed at 2db2dda9f9 (session report,
        2026-09-29) and are not re-staged or rewritten; confirm their sha256
        at HEAD still equal the specification's inputs.source_files. Then
        commit ALONE, staging exactly
        experiments/EXP-SEMBIN-e76704/specification.yaml,
        ledger/proposals/IDEA-20260929-0238ee.yaml,
        ledger/hypotheses/H-SEMBIN-934774.yaml, this decision and
        ledger/handoffs/TASK-20260929-9dbd8a.yaml, with every record id in the
        commit message; verify the receipt, merge origin/main (merge, never
        rebase), push and open or refresh the PR against main naming the
        records. Until that commit verifies, the approval is unofficial and the
        executor may not launch.
    - id: NA-2
      role: executor, via TASK-20260929-9dbd8a
      text: >-
        After NA-1 verifies, run the launcher once from a clean checkout of the
        approved commit and write the run record; return without interpreting.
    - id: NA-3
      role: coordinator
      text: >-
        Snapshot-archive the run directory alone as TASK-20260929-e3eed9 (the
        archival task named in TASK-20260929-9dbd8a archived_by; id minted by
        the session), push, then write a review_plan and
        dispatch an independent validator (review-adversarial, xhigh,
        independent session) owning: run validity (IR-1..IR-5, hash agreement,
        raw/summary agreement between results.json and raw-result.json and
        the log), and the verdict transcription.
    - id: NA-4
      role: coordinator
      text: >-
        In the same review round, dispatch a blind re-derivation of the T1
        witness (d'_ff(I) = 2 and d'_ff(M) = 3 at (6, 3), M = [1, 2, 4, 8, 26])
        from the statement of definition #4 and the system construction only,
        with blind_from naming src/recomb_search.py, src/fastfall.py and the
        run outputs; this is the one check that can see a definitional error
        C1 cannot.
    - id: NA-5
      role: coordinator
      text: >-
        After review, write EV-SEMBIN-c71cad (claim_tier toy, proof_status
        empirical_only unless the blind re-derivation supplies a checkable
        certificate of the witness) and an evidence decision scoped as above,
        filling knowledge_promotion; then checkpoint GOAL-SEMBIN-fcb7a2 with
        exactly one next action. A failed replication is recorded as such and
        does not close KN-OPEN-7f0511 (A); an infrastructure failure is
        re-attempted under SR-2.
    - id: NA-6
      role: coordinator (later ranking)
      text: >-
        Separate, not approved here: whether the separation persists or grows
        with n and in chained systems, and whether it appears for the true
        definition #3. Each is a new proposal and a new approval.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Approval decision; no evidence record is reviewed and no result exists
      yet. Promotion is decided at the evidence review of EV-SEMBIN-c71cad.

  inference:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    served_by: claude-opus-5-5
    served_by_note: >-
      Claude Code subagent with model inherit; identifier as reported by the
      runtime, not probe-verified.
    fallback_used: true
    fallback_reason: runtime inheritance, backend substitution only
    degraded_allowed: false
    model_verified: false
    amazon_bedrock: not selected, not configured, not probed, not contacted, not used

  runs_launched: 0
  status_transitions:
    - {record: EXP-SEMBIN-e76704, from: none, to: approved}
    - {record: H-SEMBIN-934774, from: none, to: approved}
  official_until: >-
    Not official until the NA-1 snapshot commit is verified against Git and
    pushed to a branch with an open PR against main.
  asserts_nothing_about: >-
    Whether D_ff^max is bounded for any descent system; the true first fall
