coordinator_decision:
  id: DEC-20260727-008
  context: >-
    GOAL-ECDLP-001 BATCH-006, the final batch under
    campaign_budget.maximum_batches = 6. BATCH-006 was opened to test the
    confound EV-IC-001 records in its own boundaries block against the support
    verdict DEC-20260726-005 on H-IC-001. The control experiment EXP-IC-002 was
    frozen (TASK-20260727-001), independently reviewed and returned REVISE with
    five blocking objections (TASK-20260727-004 / RT-20260727-001), amended once
    to version 2 with confirmatory_status exploratory_only (TASK-20260727-010),
    re-reviewed in a second, different non-originating session and returned
    REVISE again with four blocking objections (TASK-20260727-012 /
    RT-20260727-002). Execution (TASK-20260727-005) was never authorized and
    never occurred. Both reviewers independently concluded that the four run
    arms could not change the conclusion, because the conclusion is already
    fixed by arithmetic over committed EXP-IC-001 run records. On explicit user
    direction of 2026-07-27 the Coordinator stopped amending and ledger-archived
    the derivation. EV-IC-002 records that derivation; this decision disposes of
    H-IC-001.
  decision: weaken
  target_ids:
    - H-IC-001
    - DEC-20260726-005
    - EV-IC-001
    - EXP-IC-001
    - EXP-IC-002
    - GOAL-ECDLP-001
  status_transition:
    record: ledger/hypotheses/H-IC-001.yaml
    from: supported
    to: weakened
    authority: >-
      AGENTS.md - only the Coordinator may change the official status of a
      hypothesis, and the transition must be accompanied by a decision record
      with rationale and evidence references. This is that record.

  rationale:
    - id: R1
      title: The support verdict's stated ground is not a confirmatory result
      detail: >-
        DEC-20260726-005 rationale item 1 is "The revised (v3) success criterion
        is MET: 4/4". EXP-IC-001/analysis.md lines 51-54 record, BEFORE the
        amendment existed, that the v2 criterion was NOT met and "The result is
        inconclusive". experiments/EXP-IC-001/amendments/v2_to_v3.yaml then
        revised the criterion, citing the observed 4/13 and 4/4 numbers in its
        own reason field, and recorded confirmatory_status: preserved. Under
        docs/task-lifecycle.md section 5 an outcome-driven revision is
        exploratory and cannot be evaluated against the original confirmatory
        criterion. Corrected by CORR-20260727-006. Independently, the
        replacement criterion is near-tautological: K* is finite exactly when
        sqrt(N) > T_desc_gops + T_verify with T_verify = 2 group operations,
        while the criterion conditions on sqrt(N) > T_desc_gops, so it can fail
        only inside a two-group-operation window against a T_desc_gops of about
        32,000; the narrowest actual margin is 23,982. The reported 4/4 is
        arithmetic, not measurement. (EV-IC-002 OBS-5; finding 4.)
    - id: R2
      title: The per-target cost compared against sqrt(N) is the cost of one failed attempt
      detail: >-
        Across all 500 committed runs at field_bits >= 20 - which contains every
        instance with N >= 1e9 and all four instances DEC-20260726-005 rests on
        - there are ZERO decompositions. T_desc_gops is therefore the cost of
        one decomposition ATTEMPT. H-IC-001's own cost model charges the same
        operation WITH yield inside S_rel = (N/B)*T_desc and WITHOUT yield
        inside K*(T_desc + T_verify); the two are inconsistent and, in the
        decision-bearing regime, the per-target term is the wrong one. This is
        the per-attempt-cost-versus-total-expected-cost error, derived from
        H-IC-001's own assumptions with no new run. (EV-IC-002 OBS-3;
        findings 1 and 2.)
    - id: R3
      title: The crossover fails from committed data, uncharged, against the correct multi-target baselines
      detail: >-
        EXP-IC-001 compared a K-target amortization claim against single-target
        algorithms only. Against the exhaustive discrete-log table,
        S_rel/N = T_desc_gops/B = 32021/14 = 2287 at 36-bit seed 2 (range
        1908-4142 over all 34 instances), so the index-calculus precomputation
        alone exceeds exhaustive enumeration of the entire group by about three
        orders of magnitude, with per-target cost about 32,023 operations
        against O(1). Against the S*T^2 = Theta~(N) frontier at S = T = N^(1/3)
        (KN-LIT-013, KN-TECH-005), the denominator N^(1/3) - T_desc - T_verify
        is strictly negative at ALL 34 instances, so k_star_vs_frontier =
        infinity everywhere, UNCHARGED, with T_desc frozen at EXP-IC-001's own
        value. Exact integer cube roots at the four headline instances are
        3232, 2281, 1515 and 2589 against T_desc_gops of 32021, 30110, 35014
        and 33191, i.e. factors of 9.91, 13.20, 23.11 and 12.82. The 3232-vs-3240
        and 2589-vs-2590 disagreements in the prior record are adjudicated by
        exact integer multiplication in EV-IC-002 OBS-4. (Findings 3 and 6.)
    - id: R4
      title: The experiment designed to settle this was reviewed REVISE twice and never ran
      detail: >-
        RT-20260727-001 found five blocking objections, the decisive one an
        EXECUTION defect: as frozen, CTRL-G plus stopping rule 4 halt the
        primary arm at instance 1 of 34. RT-20260727-002 re-reviewed the amended
        contract and found four more, including that on the R3-repaired metric
        the design's own falsification criterion F3 FIRES (SC4 Spearman 0.8143
        < 0.90) and SC1 clause 2 fails by 2.6% (2.0524 vs 2.0), both determinate
        from committed data before any run. It also reconstructed every primary
        and secondary metric of the primary arm read-only and reported that the
        runs would have added artifact durability and two integrity controls,
        not a new mathematical fact. There is therefore no measured replacement
        for the failed accounting, and no basis for asserting a negative that no
        executed experiment supports. (Finding 6; EV-IC-002 OBS-7.)
    - id: R5
      title: Why weaken and not reject_scoped
      detail: >-
        H-IC-001's own declared falsification condition is "K* = infinity for
        ALL tested instances where sqrt(N) > T_desc_gops". On the committed
        numbers, against the matched Pollard rho baseline EXP-IC-001 itself
        declared, T_desc_gops < sqrt(N) at 4 of 34 instances and K* is finite at
        all four. That falsification condition is NOT met. To reject_scoped I
        would have to substitute the multi-target baseline for rho AFTER
        observing the outcome and then declare the hypothesis refuted against
        the substituted criterion - which is precisely the criterion-after-
        outcome defect this batch exists to correct (docs/task-lifecycle.md
        section 5, CORR-20260727-006), and would require a versioned
        protocol_amendment that the user has directed me not to write. Further,
        the coordinator contract forbids reject_scoped on a single unreplicated
        empirical-only basis and prescribes weaken plus replication; here there
        is no executed run at all, only a derivation. weaken records exactly
        what is established - that the support verdict's basis fails on three
        independent grounds - without asserting more than the artifacts carry.
    - id: R6
      title: Why not inconclusive
      detail: >-
        The evidence discriminates cleanly on the question actually asked. It is
        not ambiguous whether the v3 criterion was outcome-selected (the
        amendment says so in its own reason field), whether the decision-bearing
        runs contain successful decompositions (they contain none in 500 runs),
        or whether K* is finite against the multi-target baselines (it is
        infinite at all 34 instances by closed-form arithmetic). What is absent
        is a MEASURED replacement accounting, and that absence bounds how far
        the adverse conclusion may go - it does not make the adverse conclusion
        undecidable.
    - id: R7
      title: Observations that run against this decision, weighed and recorded
      detail: >-
        Three point the other way and are recorded in EV-IC-002 OBS-8 rather
        than omitted. (a) The trivial-versus-non-trivial Groebner comparison
        favours H-IC-001: medians 0.040484 s over 306 trivial solves against
        0.038775 s over 34 non-trivial, ratio 0.958, which retires one of
        EV-IC-001's three recorded confounds in H-IC-001's favour. (b) Heuristic
        H2 deviates ANTI-conservatively at 2 of the 4 headline instances
        (z = +3.97, +2.93), making the true yield larger than the counting model
        predicts - though by 1.2x-1.4x against roughly seven orders of magnitude
        at stake. (c) H-IC-001 never claimed a cryptanalytic advantage; it
        declares itself implementation-bound, and DEC-20260726-005's own
        next_actions already record K* at 3e8-5e8 with "no practical advantage
        at toy scale". None of the three touches R1, R2 or R3, which is why the
        verdict is weaken rather than no change.

  evidence_refs:
    - EV-IC-002
    - EV-IC-001
    - CORR-20260727-005
    - CORR-20260727-006
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-006/reviews/TASK-20260727-004/review_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-006/reviews/TASK-20260727-004/adversarial_notes.md
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-006/reviews/TASK-20260727-012/review_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-006/reviews/TASK-20260727-012/adversarial_notes.md
    - experiments/EXP-IC-001/runs/*/raw-result.json
    - experiments/EXP-IC-002/specification.yaml
    - experiments/EXP-IC-002/amendments/v1_to_v2.yaml

  refutation_artifact:
    class: derivation_note
    ladder_position: >-
      docs/claims-and-verification.md ranks counterexample certificate, then
      derivation note, then declared empirical_only. No counterexample
      certificate exists or is applicable: nothing here exhibits a solve or a
      relation contradicting H-IC-001. The strongest checkable artifact this
      result admits is a derivation note, and TWO exist, written by two
      independent non-originating review sessions from the committed run
      records, each stating its method well enough to be re-run.
    archived_before_this_decision_is_official: >-
      Both derivation notes and their adversarial companions are staged in the
      SAME isolated ledger commit as this record. The decision is not official
      until the dispatcher's post-commit verifier accepts that commit, so the
      artifacts are durable at the moment the transition takes effect and not
      after it.
    coordinator_independent_check: >-
      The Coordinator additionally re-derived the decomposition census in this
      session as a fourth independent reading, by enumerating every
      experiments/EXP-IC-001/runs/*/raw-result.json containing
      "decomposition_found": true and recovering the same 68 identifiers with
      the same per-instance distribution, and re-checked the exact integer cube
      roots by multiplication. No prior party's number is taken on trust in R3.

  protocol_amendment_disclosure: >-
    EXP-IC-002 was amended once, to version 2, with confirmatory_status
    exploratory_only (docs/task-lifecycle.md section 5), and the amendment
    declared falsifier F2 unreachable at N >= 1e9 BEFORE any execution. Because
    the experiment was never executed, no SC1-SC4 or F1-F4 outcome exists as a
    run result and none is reported here as a satisfied confirmatory
    pre-registered criterion. Where a criterion outcome IS stated - SC4 = 0.8143
    firing F3, SC1 clause 2 = 2.0524 - it is stated as a pre-execution
    derivation by RT-20260727-002 over committed records, and as a reason the
    design could not have decided what it was dispatched to decide.

  limitations:
    - >-
      SCOPE. B = 14, m = 2, the 34 committed EXP-IC-001 toy instances on 8-36
      bit prime fields with N from 5 to 33,766,959,953 (about 35 bits), 10
      deterministic targets per instance, one solver stack (sympy 1.14.0
      Buchberger versus Python Pollard rho, Python 3.13.1, macOS arm64), and
      EXP-IC-001's own calibration. Nothing outside that scope is decided.
    - >-
      NO ASYMPTOTIC EXPONENT MOVES in either direction. This is a scope
      correction to one ledger claim about one toy configuration. It is not an
      ECDLP result, not a cryptanalytic improvement, not a closure, not an
      impossibility result, and not evidence about index calculus in general, at
      other (B, m), with other solvers, or at any deployed parameter size. A
      review pass, a snapshot and a ledger archive make work durable; they do
      not upgrade evidence strength or scope.
    - >-
      Not target-class in either direction under the governing rule quoted in
      goal integrity note INT-BATCH006-002. docs/target-result-profile.md does
      not exist in this tree and is not cited as present.
    - >-
      NO MEASURED REPLACEMENT EXISTS. EXP-IC-002 never ran, so the yield-charged
      descent cost was never measured inside a run wrapper with certificates.
      Every adverse quantity here is derivation over committed records.
    - >-
      Heuristics H3 (s3_eval filter completeness) and H4 (the wall-time to
      group-operation calibration) are untested inside any run. H3 is proved on
      paper and clean in a read-only probe at all 34 instances; H4's committed
      2.66x spread moves the uncharged crossover threshold in N by about 7.1x.
    - >-
      Several adverse quantities are single-derivation (EV-IC-002
      replication_map): the SC4 Spearman, the |S| measurements, the CTRL-I probe
      and the H2 z-scores each rest on one non-originating session. The three
      grounds this decision rests on (R1, R2, R3) do not.
    - >-
      Both review sessions ran on a claude-opus-5 fallback under the Claude Code
      runtime and both explicitly declined to claim equivalence to the requested
      review-xhigh policy (GPT-5.6 Sol, xhigh), which that runtime cannot serve.
      RT-20260727-002 further records that
      `python3 -m orchestration.adapter doctor --probe` was not run, so its
      resolved model identifier is unverified configuration. Recorded as
      unverified rather than asserted.
    - >-
      Provenance gaps inherited and not repaired here: the BATCH-005
      coordination artifacts are absent (INT-BATCH006-001), the BATCH-004
      archive receipts carry null commit identifiers (INT-BATCH006-010), and
      TASK-20260727-003's snapshot receipt is untracked (INT-BATCH006-012).
      These are evidence-integrity gaps, not mathematical results.

  what_this_decision_does_NOT_do:
    - >-
      It does not touch H-STR-002's status, DEC-20260726-006 or EV-STR-002.
      EV-STR-002 records the parallel confound "All Groebner solves on trivial
      ideals (no decompositions at B >= 27)" and that census has NOT been run.
      That confound is untouched, open, and carried to a future batch as
      DEFER-BATCH006-001. Nothing in EV-IC-002 or in this record is evidence
      about H-STR-002 in either direction.
    - >-
      It does not touch H-GGM-001, EV-GGM-001 or DEC-20260726-007.
    - >-
      It does not authorize execution of EXP-IC-002 or of any successor. Both
      independent reviews withheld execution authorization and neither is
      overridden here; EXP-IC-002 is closed unexecuted rather than approved.
    - >-
      It advances no asymptotic-complexity claim toward supported. All four
      promotion gates remain open: (1) no proof decomposition into
      single-responsibility lemmas with per-attempt cost x inverse success
      probability bookkeeping is archived - this batch DIAGNOSES that
      bookkeeping failure in H-IC-001 but does not supply the decomposition;
      (2) conditional dependences are only now numbered (H1 false as stated, H2
      deviating, H3 untested in-run, H4 previously unnumbered) and none has
      archived in-run validation evidence or a scheduled validation experiment;
      (3) no concrete-cost table at standardized parameter sets exists - the
      closed-form comparisons here are at 8-36 bit toy instances with no o(1),
      memory or parallelization accounting on the index-calculus side at all;
      (4) independent review-xhigh review returned REVISE twice, not PASS, and
      both sessions ran on a disclosed fallback with equivalence explicitly not
      claimed.

  next_actions:
    - >-
      ONE ACTION. Fold the BATCH-006 checkpoint into ledger/goals/
      GOAL-ECDLP-001.yaml, set status paused under the declared pause condition
      "the 28800-second or six-batch campaign budget is exhausted without
      meeting a positive completion criterion" (maximum_batches = 6 is now
      consumed), and preserve exactly one resume action there: on explicit user
      authorization of a seventh batch, open BATCH-007 with a single read-only
      Executor task that censuses metrics.decomposition_found,
      metrics.is_trivial_ideal and certificate.kind across every committed
      experiments/EXP-STR-002/runs/*/raw-result.json, per (B, seed) instance, to
      test EV-STR-002's parallel "no decompositions at B >= 27" confound by the
      same method that settled this one. DEFER-BATCH006-001's own resume
      condition names this decision as its trigger, and by elimination the
      EV-STR-002 confound is now the more load-bearing of the two: this decision
      disposes of the EV-IC-001 confound and leaves the EV-STR-002 one the only
      unexamined support verdict resting on runs in which the mechanism never
      fired.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No KN-FIND is created. The promotion gate requires a KN-FIND on a support
      or reject_scoped decision backed by replicated or strong evidence; this
      decision is WEAKEN, so the gate does not fire. Beyond the letter of the
      gate, no durable corpus entry is warranted on the merits: the durable
      content here is (a) a scope correction to one ledger claim about one toy
      parameterization, which belongs in ledger/corrections/ where
      CORR-20260727-005 and CORR-20260727-006 now record it, and (b) an
      arithmetic observation - that a fixed-B index calculus whose
      precomputation is charged (N/B)*T_desc loses to exhaustive enumeration by
      T_desc/B and to the N^(1/3) preprocessing frontier - which is a
      restatement of KN-LIT-013 and KN-TECH-005 applied to one configuration,
      not a new finding. Promoting a toy-tier negative about B = 14, m = 2
      under one solver stack would put a durable entry in the corpus that says
      less than the entries already there. The open unknowns this batch
      crystallized (multi-target rho absent from KN-LIT-012 / KN-TECH-006; the
      EV-STR-002 census never run) are routed as the single next action and as
      unresolved_confounds in EV-IC-002 rather than as KN-OPEN entries, because
      opening KN entries is not authorized within an exhausted campaign budget
      whose one remaining action is a pause.
      Note also knowledge corpus staleness recorded elsewhere in this program:
      knowledge/findings/ is empty and several KN-OPEN entries contradict closed
      results, so novelty and coverage screening should be done against ledger/,
      not against knowledge/. Repairing that is out of scope for this archive.

  decided_by: coordinator
  decided_at: "2026-07-27T00:00:00-07:00"
  decided_under: >-
    Explicit user direction of 2026-07-27 to stop amending EXP-IC-002 and ledger
    archive the derivation. Recorded as user authorization, not as a
    self-authorized scope or budget change.
  recorded_by_task: TASK-20260727-009
