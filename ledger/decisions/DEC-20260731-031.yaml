    - coordination/goals/GOAL-AES-001/amendments/protocol-amendment-GOAL-AES-001-004.yaml
    - coordination/goals/GOAL-AES-001/amendments/protocol-amendment-GOAL-AES-001-005.yaml
    - >-
      tools/validate_ledger.py check_run certificate vocabulary
