    - "inference-amendment commit 0137a051eb5828789eb267fa83c8278086578d4c"

  dispositions:
    RQ_AES_002: >-
      CREATED and `active`. Scope, threat models, claim_tier_ceiling R1-R7,
      motivation, decision target, provenance and constraints as written. Its
      claim_tier_ceiling is the operative text of rulings 1-6 and governs every
      record produced under it.
    GOAL_AES_002: >-
      CREATED and `active`, bound to RQ-AES-002. Three batches, 22500 measured
      seconds, max_concurrent 3 shared across both AES goals. Accounting basis
      and the amendment-005 Part B clock convention C1-C6 ADOPTED BY EXPLICIT
      REFERENCE at creation, with coordination acts charged from BATCH-001.
      Five completion criteria (C1 certified key recovery, C2 conditional
      construction reaching `analyzed`, C3 scoped barrier statement, C4 review
      admission, C5 durable archive) and six explicit non-completion criteria.
      Six pause conditions including P2 (admissible object classes exhausted,
      which asserts nothing about AES) and P5 (success that cannot be
      adjudicated here pauses rather than closes). Exactly one next action.
    RQ_AES_001_and_GOAL_AES_001: >-
      UNTOUCHED. See ruling 13. No field of either record is edited by this
      decision.
    hypothesis_status_changes: >-
      NONE. No hypothesis record exists for GOAL-AES-002 and none is created.
    BLK_1: >-
      OPEN and named. First ranked item of GOAL-AES-002's next action; blocks
      any card that could produce a solve until an approved amendment and the
      corresponding validator change are COMMITTED.

  promotion_gates_status:
    engaged: false
    reason: >-
      NO asymptotic-complexity claim is advanced by this decision, because no
      claim of any kind is advanced. The four gates in agents/coordinator.md are
      recorded here so a later batch cannot bypass them: (1) archived proof
      decomposition into single-responsibility lemmas with the main theorem
      assembling them under explicit per-attempt-cost x
      inverse-success-probability bookkeeping; (2) every conditional dependence
      stated as an explicit numbered heuristic with archived validation evidence
      or a scheduled validation experiment; (3) a concrete-cost table at
      AES-128/192/256 with honest accounting of overhead hidden in o(1) terms,
      memory, time-memory tradeoffs and parallelization, optimistic assumptions
      flagged, and an explicit affected-vs-safe scope statement; (4) independent
      review-breakthrough review per AGENTS.md rule 12 plus a red-team pass on
      the cost model and heuristics. A claim missing any gate may reach
      `analyzed`, never `supported` — and ruling 8 records that in THIS
      environment no cost claim can exceed `analyzed` even with all four,
      because the scale at which it would be tested is unreachable.
      A CONDITIONAL RESULT MUST BE PAIRED with a heuristic-validation experiment
      in the same or the following batch, per the Coordinator contract; with
      three batches total, that pairing obligation is a hard scheduling
      constraint on BATCH-002 and is named in the goal's next action shape.

  limitations:
    - >-
      THIS DECISION ASSERTS NOTHING ABOUT AES, at any round count, in any threat
      model. It creates two records and takes scoping rulings. No distinguisher,
      no key recovery, no speedup, no measured structural excess and no barrier
      statement is asserted or implied.
    - >-
      THE HONEST EXPECTATION IS THAT THIS CAMPAIGN FINDS NO BREAK. The prior
      against a full-round result is overwhelming and is stated in RQ-AES-002's
      motivation rather than discovered later. Opening the question is a refusal
      to close prematurely, not a prediction of success.
    - >-
      THE BICLIQUE FIGURES, THE ATTACK-FAMILY LIST AND THE EXISTENCE OF
      RELATED-KEY RESULTS ON AES-192/256 CITED IN THESE RECORDS ARE ALL RECALLED
      FROM MEMORY AND ALL UNVERIFIED. They are recorded so their status is
      explicit and are usable as neither authority nor comparison. Novelty
      against the external literature is UNRESOLVABLE in this environment, in
      both directions.
    - >-
      THE THROUGHPUT AND CEILING FIGURES A READER MIGHT WANT HERE ARE NOT GIVEN,
      BECAUSE THEY HAVE NOT BEEN MEASURED. This Coordinator's order-of-magnitude
      expectation — roughly 2^38 to 2^40 AES evaluations in a single budgeted
      task with a working AES-NI C path, and roughly 2^28 to 2^30 in pure Python
      — IS AN UNMEASURED SIZING, NOT A MEASUREMENT, and is stated only to
      motivate rank 3 of the next action. It must be replaced by the measured
      receipt before any card relies on it (AGENTS.md rule 9).
    - >-
      TWO COMMITTED RECORDS OF THIS PROGRAM CONTRADICT EACH OTHER ABOUT THE C
      TOOLCHAIN — RQ-AES-001's constraints record gcc 13.3.0 with -maes as
      available, while GOAL-AES-001's next_action records that a GF(2^8) census
      leg is blocked because neither numpy nor a small C program is installed.
      THIS DECISION DOES NOT RESOLVE THE CONTRADICTION BY ASSERTION and neither
      record is edited. It is resolved by MEASUREMENT in rank 3 of the next
      action, and until then no budget may depend on the answer.
    - >-
      BLK-1 MEANS THIS GOAL'S FIRST COMPLETION CRITERION IS CURRENTLY
      UNEXPRESSIBLE by a conforming run record. That is an infrastructure fact
      about this repository, not a mathematical one, and it is the first item of
      the next action.
    - >-
      CROSS-MODEL INDEPENDENCE IS UNAVAILABLE campaign-wide under
      inference-amendment 0137a051, `model_verified` is false throughout, and
      `python3 -m orchestration.adapter doctor --probe` has not been run for
      this goal. Every agreement obtainable in this campaign is CORRELATED
      confirmation. `completed` is unreachable; no attestation is recorded.
    - >-
      THESE THREE RECORDS ARE UNCOMMITTED AT THE TIME OF WRITING AND ARE
      THEREFORE NOT YET DURABLE (AGENTS.md "Durable research commits"). They
      must be committed in an ISOLATED OPENING COORDINATION COMMIT, the branch
      pushed, and a PR opened or refreshed against `main` naming RQ-AES-002,
      GOAL-AES-002 and DEC-20260731-031. A record that exists only in a local
      commit is unpublished, and no batch may be dispatched against it until the
      post-commit verifier accepts it. That commit is NOT a ledger archive of a
      reviewed result and does not advance GOAL-AES-002's
      latest_verified_commit.
    - >-
      ID PROVENANCE. RQ-AES-002, GOAL-AES-002 and DEC-20260731-031 were verified
      free by directory listing at authoring time (highest existing:
      RQ-AES-001, GOAL-AES-001, DEC-20260731-018). If a concurrent branch has
      published any of them by merge time, the collision is resolved by a CORR
      record under a new id, NEVER by editing a committed record and never by
      resolving a sync conflict inside one.

