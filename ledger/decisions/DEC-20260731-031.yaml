coordinator_decision:
  id: DEC-20260731-031
  context: >-
    A NEW RESEARCH DIRECTIVE was set by the user: find a novel FULL-ROUND AES
    break faster than the state-of-the-art published cryptanalysis. That target
    is outside GOAL-AES-001's declared scope — RQ-AES-001's claim_tier_ceiling
    reads "Toy tier only, and reduced-round only... no result from this question
    may be reported as a claim about full-round AES", and its scope block lists
    full-round AES-128/192/256 under round_counts_out_of_scope — so it cannot be
    executed by widening that question without retroactively lifting a ceiling
    under which four batches of reviewed evidence (EV-AES-001..004) and two
    knowledge entries (KN-FIND-017, KN-FIND-018) were produced. This decision
    therefore OPENS A SEPARATE QUESTION AND GOAL, RQ-AES-002 and GOAL-AES-002,
    and takes the scoping rulings that make the directive executable and
    honestly bounded in this environment. It reviews no evidence, creates no
    hypothesis, and asserts NOTHING ABOUT AES AT ANY ROUND COUNT.
    Its central act is a ruling on ADJUDICABILITY: the directive's comparison
    ("faster than the state-of-the-art published cryptanalysis") is NOT
    adjudicable in this environment, while a reformulated comparison against the
    DEFINITIONAL exhaustive-key-search reference IS. That ruling, its symmetric
    prohibition, and the conditions under which the stronger comparison would
    become adjudicable are written into RQ-AES-002's claim_tier_ceiling and
    GOAL-AES-002's completion criteria so that no future batch can quietly
    convert one into the other.
  decision: approve
  target_ids:
    - RQ-AES-002
    - GOAL-AES-002

  rationale:
    - >-
      RULING 1 — THE REFORMULATION IS ADOPTED, AND SHARPENED. Exhaustive key
      search is a DEFINITIONAL reference, not a literature one: for a k-bit key
      in the single-key model with enough known pairs to make the key unique,
      the search costs 2^(k-1) full AES-k evaluations in expectation and 2^k in
      the worst case, with negligible memory, about two known pairs of data, and
      success probability 1. That statement follows from the key length and the
      definition of the cipher and requires no document. "Materially cheaper
      than exhaustive search, charged end to end" is therefore CHECKABLE HERE.
      TWO SHARPENINGS THIS COORDINATOR ADDS, WITHOUT WHICH THE REFORMULATION IS
      NOT ACTUALLY ADJUDICABLE. (a) THE UNIT AND THE SUCCESS CONVENTION MUST BE
      FIXED IN ADVANCE. Most fake speedups live in charging attack work in S-box
      lookups or "operations" while charging the reference in full encryptions,
      or in comparing an average-case attack against a worst-case reference —
      which manufactures a factor of 2, and a factor of 2 is INSIDE the margin
      any plausible result here would have. (b) THE COMPARISON IS A PARETO
      COMPARISON, NOT A SCALAR. The reference needs about two known plaintexts
      and negligible memory; an attack needing 2^60 chosen plaintexts or 2^80
      memory is not "faster" on one number. RQ-AES-002 therefore makes cost
      model CM-1 — unit, success convention, success-probability normalisation,
      data, memory, precomputation-and-verification — a COMMITTED, FROZEN,
      INDEPENDENTLY REVIEWED ARTIFACT REQUIRED BEFORE ANY MEASUREMENT. A margin
      stated before CM-1 is frozen is not evidence; it is an unadjudicated
      number.
    - >-
      RULING 2 — THE PUBLISHED STATE OF THE ART IS UNADJUDICABLE HERE, AND THIS
      IS ESTABLISHED, NOT ASSUMED. csrc.nist.gov, eprint.iacr.org and arxiv.org
      are unreachable under this harness's network policy; WebFetch of primary
      cryptographic sources fails; WebSearch returns secondary reporting only.
      RQ-AES-001's provenance block records this, all four EV-AES records repeat
      it, and DEC-20260731-011 ENACTED it program-wide by STRIKING CAND-601-B's
      sota_delta and every recalled-baseline comparison — on the reasoning that
      a margin against a recalled figure carrying recall uncertainty is
      unadjudicable REGARDLESS of how the experiment resolves, and that carrying
      it as an open question would let an unverifiable comparison ride into a
      later record. That reasoning applies here a fortiori: the directive's
      comparison IS the unverifiable one. This Coordinator recalls the best
      published single-key attacks on full AES as biclique key recovery at
      roughly 2^126.1 / 2^189.7 / 2^254.4 for AES-128/192/256, about a factor of
      4 below exhaustive search. THAT RECOLLECTION IS UNVERIFIED, IS RECORDED
      ONLY SO ITS STATUS IS EXPLICIT, AND IS NOT CITED AS AUTHORITY ANYWHERE.
    - >-
      RULING 3 — THE PROHIBITION IS SYMMETRIC, AND THIS IS THE HALF MOST LIKELY
      TO BE FORGOTTEN. No record under RQ-AES-002 may say "this beats the state
      of the art". EQUALLY, no record may say "this falls short of the state of
      the art", "this is only the known biclique margin", or "this is not worth
      pursuing because the published attacks are already better". Using an
      unverified recollection to DISMISS a result is the same fabrication under
      AGENTS.md rule 9 as using it to PROMOTE one, and it is additionally the
      premature-closure failure mode CLAUDE.md and docs/inventor-protocol.md
      name as symmetric with overclaiming. A campaign that may not overclaim
      against the frontier also may not screen against it.
    - >-
      RULING 4 — THE UNDETERMINED REGION IS NAMED AS UNDETERMINED RATHER THAN
      GUESSED. A result that beat exhaustive search under CM-1 but by a margin
      comparable to the recalled biclique margin would have GENUINELY
      UNDETERMINED STATUS in this environment: whether it is a major result or a
      rediscovery cannot be decided here. The correct handling is TWO SEPARATE
      VERDICTS that are never merged — a determinate verdict on the definitional
      question, and `inconclusive` on the state-of-the-art question, per the
      Coordinator contract's rule that when the evidence cannot discriminate
      between explanations the decision is `inconclusive` and says so plainly.
    - >-
      RULING 5 — THE ANTI-LAUNDERING CLAUSE IS MADE STRUCTURAL, NOT
      ASPIRATIONAL. RQ-AES-002 claim_tier_ceiling R5 requires that any record
      stating a margin, ANYWHERE, name the reference as exhaustive key search
      under CM-1 and declare the state-of-the-art comparison unadjudicable IN
      THE SAME SENTENCE; that transcribing one as the other in a headline,
      evidence record, decision, synthesis, status line, cross-reference,
      knowledge entry, PR title or commit message is a CLAIM-TIER VIOLATION
      handled exactly as docs/claims-and-verification.md handles dropping a
      conditional qualifier; and that under docs/inventor-protocol.md section 5
      every deliverable sets `dominated_by` to an explicit
      unresolvable-in-this-environment string and NEVER to `null`, because
      `null` asserts the Pareto frontier was checked row by row and here it
      cannot be — an unchecked null being a fabrication under AGENTS.md rule 5.
      GOAL-AES-002's completion criteria carry the same restriction, and a
      margin against the published frontier is listed among the explicit
      NON-completion criteria.
    - >-
      RULING 6 — WHAT WOULD LIFT THE RESTRICTION IS NAMED, SO IT CAN BE LIFTED
      BY EVIDENCE RATHER THAN BY ARGUMENT. Any one of: (i) network policy
      permits a primary source, which is then READ, HASHED AND FROZEN under
      `inputs/<ID>/paper_fulltext.md` with recorded provenance, exactly as
      `inputs/P13-WESOLOWSKI-2026/` already is in this repository; (ii) the
      primary text is SUPPLIED INTO THE REPOSITORY by the user or the
      dispatching session as a frozen input with recorded provenance — the
      practically reachable route here, since a human-supplied document is a
      source in a way a model recollection is not; or (iii) the baseline attack
      is RE-DERIVED, IMPLEMENTED AND COST-COUNTED FROM FIRST PRINCIPLES inside
      this repository under CM-1 and independently reviewed — which establishes
      a baseline THIS CAMPAIGN BUILT, not the published one, and any comparison
      against it must say so. EXPLICITLY INSUFFICIENT: WebSearch secondary
      reporting; an encyclopedia summary; a second agent recalling the same
      figure, since under inference-amendment 0137a051 cross-model independence
      is unavailable campaign-wide and two agreeing recollections are ONE draw
      from a correlated pair; or this Coordinator's recollection restated with
      more confidence.
    - >-
      RULING 7 — THE PRIOR IS STATED PLAINLY AND THE QUESTION IS STILL OPENED.
      Full-round AES has resisted more than two decades of concentrated global
      cryptanalysis by specialists with resources incomparably larger than this
      harness has, and the best recalled single-key results are marginal
      constant-factor improvements rather than exponent movers. Nothing about
      four cores, no GPU, no MILP or SAT solver, no numpy and no reachable
      literature makes this a better place to find such an attack. RQ-AES-002's
      motivation says so in those words and names the honest expected
      deliverable as the object enumeration plus at most one or two scoped
      barrier statements — NOT the break. The question is nevertheless OPENED
      rather than DECLINED because CLAUDE.md and docs/inventor-protocol.md
      section 4 treat premature closure as a failure mode SYMMETRIC WITH
      OVERCLAIMING, because "this space is mined" is a hypothesis about the
      search whose honest status is `unverified`, and because the incident that
      motivated the inventor protocol (KN-LIT-7594) is a model declining AES
      cryptanalysis on saturation grounds immediately before improving a
      best-known attack. THE TWO FACTS ARE HELD PROCEDURALLY: object-first
      generation with the families declared off-limits as the primary lens, the
      lossy-projection test before compute, null controls with a round-count
      decay check before belief, matched-reference accounting under CM-1,
      certificates re-verified under two independent implementations, and a
      ceiling that makes the laundering step a recorded violation rather than an
      available shortcut.
    - >-
      RULING 8 — THE ONE ASYMMETRY THAT MAKES THIS QUESTION EXECUTABLE AT ALL,
      AND THE LIMIT OF WHAT IT BUYS. AES key recovery, like ECDLP, is in NP:
      finding a key is believed hard, CHECKING one costs a single AES
      encryption. So the single positive outcome this question could produce is
      CHEAPLY AND INDEPENDENTLY VERIFIABLE AT FULL CRYPTOGRAPHIC SCALE even
      though no search at that scale is possible here, and `crypto` tier is
      admissible through exactly that gate: a recovered key reproducing the
      exact target ciphertexts under BOTH pycryptodome and the openssl CLI,
      re-verified by the run wrapper with the attack code excluded. THE LIMIT,
      STATED BECAUSE IT IS EASY TO MISS: a certificate proves a claimed SOLVE is
      real on the instance solved; it does NOT validate the COST MODEL that
      predicts the attack's cost at scale, and this environment cannot execute
      at the scale where a full-round cost claim would be tested. Therefore any
      cost claim under this question is capped at `analyzed` and may never reach
      `supported` here — the four promotion gates of agents/coordinator.md apply
      in full, and gate (4)'s independent-confirmation half was already recorded
      as structurally unsatisfiable under this harness in DEC-20260731-017.
    - >-
      RULING 9 — SCOPE ON THE MERITS. IN SCOPE AND COMPLETING: single-key
      full-round AES-128/192/256 at 10/12/14 rounds. IN SCOPE BUT NEVER
      COMPLETING: related-key, known-key and chosen-key models, admissible as
      objects of study only, with the weaker threat model stated IN THE SAME
      SENTENCE as any result, everywhere it appears — related-key results on
      AES-192/256 are recalled to exist, are unverified here, and are NOT breaks
      of single-key AES. OUT OF SCOPE ENTIRELY: side-channel, fault and
      implementation attacks, because they can trivially "beat exhaustive
      search" while saying nothing about the cipher, which would make the
      decision target meaningless; quantum attacks, because no quantum resource
      exists here and the definitional reference is the classical one; and
      attacks on AES-derived constructions rather than on the block cipher.
      Reduced-round runs are admissible ONLY as validation-ladder instruments
      for a full-round mechanism, carry `toy` tier, and any reduced-round
      FINDING is cross-filed under RQ-AES-001's ceiling rather than asserted
      here.
    - >-
      RULING 10 — WHAT THE ENVELOPE PERMITS AND FORECLOSES, RULED ONCE SO IT IS
      NOT REDISCOVERED PER CANDIDATE. PERMITS: object-first generation and the
      lossy-projection test, which cost NO compute and are the highest-value
      activity available; structural and algebraic derivation with exhaustive
      enumeration in GF(2^8), GF(2^4) and GF(2^2) analogues; reduced-round
      measurement against the pinned FIPS-197 ground truth; null-object controls
      at those scales; proof decomposition, numbered heuristics and
      concrete-cost tables, which are paper work; and cheap full-scale
      verification of any claimed key recovery. FORECLOSES: any exhaustive or
      near-exhaustive key search; any mechanism whose cheapest falsification
      gate needs MILP or SAT, which removes the automated division-property,
      differential and linear search methodology essentially in its entirety;
      dense GF(2) linear algebra at large dimension without numpy or a C
      implementation; memory-heavy meet-in-the-middle or biclique tables beyond
      15 GB; large-data statistical distinguishers; and validation of any cost
      claim at the scale where it would matter. THE CONSEQUENCE, STATED AGAINST
      THIS CAMPAIGN'S OWN INTEREST: A FULL-ROUND BREAK WILL NOT BE FOUND HERE BY
      COMPUTATION. If one is found at all it will be STRUCTURAL — an argument on
      paper, validated only at reduced scale and in analogues — and its
      verification at scale needs resources this environment does not have.
    - >-
      RULING 11 — A NAMED INFRASTRUCTURE BLOCKER, FOUND WHILE SCOPING AND
      RECORDED RATHER THAN LEFT FOR A PRODUCER TO HIT. BLK-1: the certificate
      vocabulary in docs/claims-and-verification.md admits only
      `discrete_log | decomposition | none`, and `check_run` in
      tools/validate_ledger.py raises an error on any other `kind`. AN AES
      KEY-RECOVERY CERTIFICATE THEREFORE CANNOT CURRENTLY BE EMITTED BY A
      CONFORMING RUN RECORD — the exact artifact this goal's first completion
      criterion requires. Resolving it needs a versioned protocol amendment
      adding a `key_recovery` kind together with the corresponding validator
      change, authored, approved and COMMITTED BEFORE any card is issued that
      could produce a solve, because a gate uncommitted when the card is issued
      is the retroactive enforcement this program refuses. It is an
      infrastructure blocker, never a negative mathematical result (AGENTS.md
      rule 5), and it is the first ranked item of GOAL-AES-002's next action.
    - >-
      RULING 12 — BUDGET SIZED DOWN DELIBERATELY, AND THE ARGUMENT AGAINST IT
      RECORDED. GOAL-AES-002 opens at THREE batches and 22500 measured seconds,
      sized bottom-up from GOAL-AES-001's measured per-role actuals at or near
      each role's observed maximum with no cushion, per
      protocol-amendment-GOAL-AES-001-005 Part A's sizing discipline adopted at
      the opening rather than after three budget acts. THREE, NOT SIX: this
      target's prior is worse than GOAL-AES-001's, and that campaign opened at
      six against a prior already stated as overwhelming, took three budget
      acts, and four batches in had produced no claim about AES. Sizing a new
      campaign to its ambition is the exact failure amendment 005 named against
      itself. A FOURTH BATCH REQUIRES A VERSIONED AMENDMENT ON THE MERITS OF
      WHAT THE FIRST THREE PRODUCED. The counter-argument is recorded in the
      goal's own `what_a_red_team_should_attack_here`: three batches may be too
      few to reach any cryptanalysis at all, since BATCH-001 is largely
      protocol. That is intended — if three batches produce only protocol and an
      enumeration, the correct outcome is `paused` with that recorded, not a
      fourth batch taken on momentum.
    - >-
      RULING 13 — GOAL-AES-001 IS NOT TOUCHED. This decision does not pause,
      close, supersede, re-scope, re-budget or reprioritize GOAL-AES-001; does
      not alter RQ-AES-001's claim_tier_ceiling in any respect; does not change
      the status, strength, tier or scope of EV-AES-001..004; and does not
      re-read KN-FIND-017 or KN-FIND-018 as full-round statements. GOAL-AES-001
      remains `active` at BATCH-004 with its single next action (draft, commit
      and dispatch the BATCH-005 queue) intact and its standing research
      constraints intact. Prior derivations may be cited under RQ-AES-002 as
      INPUTS carrying their original scope verbatim: Proposition 806-1 only at
      one super-box interface, for the F-linear subclass, never as a cost
      inequality and never with U-809-1 dropped; PROP-701-I and Proposition
      801-1 withheld and not citable as established. RESOURCE CONTENTION IS
      RULED ON: max_concurrent 3 is a cap ACROSS BOTH AES GOALS, not 3 each, and
      neither campaign's budget may be charged for the other's work.
    - >-
      RULING 14 — `completed` IS UNREACHABLE AND THAT IS RECORDED AT THE OPENING
      RATHER THAN DISCOVERED AT THE CLOSE. Under AGENTS.md rule 13 and CLAUDE.md
      rule 8 a goal closes only on three CONCUR attestations with pairwise
      distinct resolved_model_id. Under inference-amendment-TASK-20260731-602
      (commit 0137a051) every role in this harness resolves to the same model,
      so a validator CONCUR plus a red-team CONCUR is ONE DRAW FROM A CORRELATED
      PAIR, NOT TWO. No completion_quorum block is created and NO ATTESTATION IS
      RECORDED. If a completion criterion is met without the quorum, the honest
      transition is `paused` with the narrowest supported result recorded —
      never `completed`, and never `closed_at_budget` used to retire a goal that
      DID meet a criterion. Pause condition P5 makes this operative for the case
      that matters: a candidate full-round break surviving internal review
      PAUSES the goal at `analyzed` pending external adjudication rather than
      closing it, because the one thing this environment cannot do is compare
      against the published frontier.

