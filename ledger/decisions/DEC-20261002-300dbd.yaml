  f7b_reading: >-
    Under DEC-20261002-0df88e's outcome rule, evaluated by the executor on
    the TRUNCATED 26..28 segment (2 rungs, n = 400): the segment slope of
    log2 T_frozen vs log2 N at m = 4 on-mode is -0.015255, calibrated 99%
    [-0.023746, -0.006771]; it EXCLUDES the archived 12..24 slope (-0.038062,
    calibrated [-0.041782, -0.034385]) and EXCLUDES 0. NARROWEST SUPPORTED
    SENTENCE: the generic harvest-on approach to the floor BENDS above 24
    bits -- the 26..28 segment slope is shallower than the 12..24 slope
    beyond both calibrated intervals -- while still declining beyond
    calibrated error; the flattening-versus-crossing discrimination remains
    UNRESOLVED at 26..28. THE RULE'S LETTER AND WHY THE READING IS NARROWER:
    the FLAT branch fired by its letter (the interval excludes the 12..24
    slope), but that branch was written for a 4-rung 26..32 segment and its
    "flattening supported" conclusion does not follow from a 2-rung segment
    whose interval also excludes 0; the honest reading is BENDING CONFIRMED,
    FLATTENING UNRESOLVED. Supporting observations, all from the archived
    package: per-rung T m4 frozen b26 1.2400 [0.9720, 1.4901] and b28 1.1712
    [0.9440, 1.3479] (both straddle 1; no rung interval excludes 1 from
    below; no CROSS); m5 frozen b26 1.903, b28 1.840; measured T sits ABOVE
    the naive 12..24-slope projection at b26 (1.0063x) and b28 (1.0232x) --
    flattening-shaped context, not the discriminator; the rungs 30 and 32
    were stopped by the PRE-REGISTERED 2.5e9-byte RSS machine-protection stop
    (the archived construction's encoding store is O(B^2), ~2.3-4.0 KB per
    encoding; ~2.74 GB at B = 151), the stop stands as recorded, n was never
    changed, rung 32 was never attempted; m = 5 ran under the power rule's
    >= 50% condition (21118.4 s remaining at the decision), its rungs 26/28
    completed, its rung 30 hit the same stop. The executor's recorded defects
    stand as recorded (report.md section 6), including the analysis attempt-1
    IndexError (fixed, both attempts retained, no quantity changed).

  successor_pricing: >-
    (b-prime) -- the equivalence-controlled memory-streaming completion of
    the SAME pre-registered segment -- is priced FIRST: it is pure
    computation (no engine import, no RUN id, outputs < 50 MB, wall clock
    within a day at one process), it closes the exact discriminator the
    outcome rule was written for (the full 26..32 segment slope at 4 rungs,
    which the 2-rung truncation could not support), and the archived
    construction's limit was MEMORY, not time (the b28 rung completed 200/200
    in 177.8 s at 2.31 GB; the store, not the draw volume, hit the cap).
    (c) -- harvest-on m = 4 engine rows above 32 bits with certified solves --
    stays priced behind it exactly as DEC-20261001-494663 NA-3 orders ((c)
    only if (a)-(b) leave the question open): the engine's OWN 30..32
    aggregates already sit above 1 with headroom (r_frozen T 1.115 at 30
    bits, 99% [1.070, 1.161]; 1.128 at 32 bits, 99% [1.089, 1.182];
    EV-PFDR-d90ccd cross_joint_reading), so (c)'s marginal value over a
    completed (b-prime) is the engine-specific component above 32 bits, and
    its cost is a full engine campaign -- priced at the rerank after
    (b-prime) returns, not now.

  b_prime_rule_fixed_before_data: >-
    FIXED HERE, BEFORE ANY (b-prime) DATA EXISTS. OBJECT: rungs 30 and 32
    only (26 and 28 are committed at 1eb4d6b52a and are READ, never
    regenerated); n = 200 per (m, rung) cell per the carried power rule; m =
    4 on-mode primary, m = 5 on-mode only if >= 50% of the wall clock remains
    after the m = 4 rungs (the carried condition, decision recorded with
    numbers). CONSTRUCTION: a memory-streaming pair counter whose pair
    counting, row fields, stop and mode semantics are IDENTICAL to the
    archived construction, storing only what the pair counting needs per
    encoding (a compact x-key record) instead of the full encoding objects
    -- the O(B^2) full-encoding store is the one declared memory defect
    being repaired, and NOTHING ELSE in the construction changes.
    EQUIVALENCE CONTROL (before any new rung): the streaming construction,
    at the SAME seeds, must reproduce the COMMITTED 26..28 rows of
    coordination/tasks/TASK-20261002-a8bbd8/out/replica_rows.jsonl
    bit-exactly on every field except `seconds` (the F7(b) fidelity-check
    pattern, now against the committed rows); all_exact_match = true is the
    gate; any mismatch is a defect -- locate it, ONE rerun of the control is
    permitted, and if it still mismatches the task STOPS with the defect
    recorded, no new rung is generated, and nothing is self-interpreted.
    OUTCOME RULE: carried VERBATIM from DEC-20261002-0df88e, now applied to
    the FULL 26..32 segment (4 rungs): FLAT (the 26..32 calibrated interval
    excludes the archived 12..24 slope), CONT (overlaps the 12..24 slope AND
    excludes 0), AMBIG (overlaps both), CROSS (any rung's calibrated 99% T
    interval excludes 1 from below -- FLAGGED, never self-interpreted); the
    T-point tripwire and the narrowest-sentence discipline unchanged; the
    naive-continuation context (measured/projection ratios per rung)
    reported beside the discriminator, labelled context, not the
    discriminator. MACHINE PROTECTION: the 2.5e9-byte RSS stop and the
    one-process rule stay (the streaming construction is expected to sit far
    below them; a stop is blocked, never a finding); wall clock 21600 s;
    outputs < 50 MB; the host disk stays near full -- check df before each
    rung batch.

  coordinator_prior: >-
    Recorded before the (b-prime) data exists, marked NOT INDEPENDENT
    (informed by F7(a)'s branch (i), F7(b)'s bend, and the engine's own
    30..32 headroom in EV-PFDR-d90ccd): this Coordinator expects the full
    26..32 segment slope to stay shallower than the 12..24 slope with no
    rung interval excluding 1 from below (an FLAT-or-AMBIG outcome with the
    T-points at or above 1), and the measured/projection ratios to keep
    rising. WHAT WOULD OVERTURN IT: any rung interval excluding 1 from
    below (CROSS -- the lemma failing for adaptive engines in the
    aggregate; routes to review-breakthrough untouched), or a full-segment
    slope consistent with the 12..24 rate (CONT -- the bend was a 2-rung
    artifact), which would push the projected crossing back to ~34..36 bits
    and price (c) immediately.

