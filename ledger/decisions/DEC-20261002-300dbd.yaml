  approval_scope_note: >-
    This approval asserts nothing about the floor beyond what F7(a) and
    F7(b) already support. It repairs one declared memory defect of the
    replica construction under a bit-exact equivalence gate, completes a
    segment whose rule was fixed before any of its data existed, and changes
    no hypothesis status.

  rationale:
    - >-
      Why the reading is narrower than the rule's letter. The FLAT branch was
      written for a 4-rung segment; the RSS stop left 2 rungs. A 2-rung
      weighted-OLS slope that excludes both the old rate and 0 supports
      BENDING, not flattening; recording the letter (FLAT) as if it settled
      flattening would overstate a thin segment -- the exact failure the
      target profile's scope honesty forbids.
    - >-
      Why (b-prime) and why the equivalence gate. The archived construction's
      limit was its full-encoding store, not its draw volume: a streaming
      pair counter with identical counting semantics removes the O(B^2)
      memory without touching the stochastic content, and the bit-exact
      control at 26..28 proves the identity on data before any new rung
      trusts it. This is the cheapest act that can settle the discriminator
      the outcome rule was written for.
    - >-
      Why the outcome rule carries verbatim. It was fixed before any (b)
      data existed; completing the segment it was written for is the same
      approved act, not a new design decision. Re-fixing it now, after
      seeing 26..28, would be a post hoc rule change -- exactly what the
      pre-registration discipline forbids.
    - >-
      Machine protection. The RSS stop and one-process rule stay even
      though the streaming construction should sit far below them: a cap
      that is never expected to bind is still a cap. The host disk is at
      100% (~5 GiB free); outputs are bounded and df is checked before each
      rung batch.
    - >-
      Exponent bias (docs/target-result-profile.md). HEUR-cf8ca6-H3 is the
      floor's open derivation step and OQ-F7 is its open question; the
      full-segment slope at 4 rungs is the cheapest evidence that can move
      on the generic process's path above 24 bits, ahead of any spend on
      engine rows above 32 bits.

