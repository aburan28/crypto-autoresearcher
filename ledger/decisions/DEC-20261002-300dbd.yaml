        pre-registered outcome reading.
      bounds: >-
        Wall clock 21600 s; RSS stop 2.5e9 bytes per process; one computation
        process at a time; >= 6 GB MemAvailable at launch; outputs < 50 MB
        under the task directory; no RUN id; nothing under experiments/; no
        import or execution of anything under
        src/crypto_autoresearcher/index_calculus; rungs in ascending order
