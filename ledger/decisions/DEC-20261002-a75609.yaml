  composition:
    rule: >-
      CA4-3 and CA4-9. Each joint is read against the plan's own
      breaking_artifact list and given one composed disposition naming the key
      applied. Verdicts are not counted, keys are applied as written, and no
      breaking list is widened or narrowed after reading.
    joints:
      - joint: J1
        owner: TASK-20261002-ab21d1
        attested: true
        disposition: holds
        key_applied: none triggered (the K-approve J1 and D-CARRY conditions are met)
        basis: >-
          140 of 140 Stage 0 DESIGN comparisons pass against the validator's
          own 60-digit values from text definitions. The column is within
          8.0e-7 bit, windows within 0.005 bit, critical g within 3.3e-4 and
          envelope edges within 0.0035 bit on the exact committed grid at
          k = 1, 2, 3. The L = 1 print is model-evaluated and can fail. D1 is
          nowhere a budget. R3-J1-1 is discharged. Minor D-J1-1 (an inherited
          "upper edges at most 0.01 bit" clause, not uniform near closure) and
          D-J1-2 (per-attempt input generation, 1 to 262 group operations at
          n = 131, uncharged and unlisted as a hidden cofactor) are carried as
          R4-J1-1 and R4-J1-2.
      - joint: J2
        owner: TASK-20261002-ab21d1
        attested: true
        disposition: holds
        key_applied: none triggered
        basis: >-
          Both code blocks extract by two routes to extracted_sha256 and
          execute nothing on import. The AST diff equals code_delta function by
          function. T_kappa and T_rho are in gate_tests and G1 (a) and outside
          COVERAGE_TESTS. IR-6 names TASK-20261002-c21ce2. Cells and arms are
          selected by name. 184 traced self-test cases never reach NEGATIVE.
          C-4, C-5 and C-6 are byte-identical on re-run. Every approval field
          is present, approved_by is null and supersedes is present. No
          earlier-version file changed, and memory stands beside every time
          figure. Minor D-J2-1 (the audit sheet says S1b names the c21ce2
          digest; S1b names none) is carried as R4-J2-1. J2 verifies that the
          code is what the text says; J3-D1 is in what the text's cell model
          says, so J2 holding is consistent with J3 breaking.
      - joint: J3
        owner: TASK-20261002-aba8f9
        attested: true
        disposition: breaks
        key_applied: K-revise-defect
        basis: >-
          J3-D1 matches two listed artifacts. The composer checked its core
          argument by hand against the contract's own statements (worksheet
          section_5). A block-{1,3} relation pairs a coset-1 point P_i with the
          coset-3 point -P_j, so each row is L_i - L_j, every cycle has sign
          product +1, and adding a constant on a component preserves every
          row. No ordinary column of the block is determined. The committed
          FullVectorElim confirms it on synthetic coset-forced rows (0 of 256
          determined, 200 of 200 runs). Under the cell's own algebra,
          BIN-KOB-19's T_delta, AM1 and AM2 fail in 100 percent of runs at
          balance without defect columns, and the cell is non-PASS in 11.1 to
          69.85 percent with one to three defect columns. H1-POSITIVE, POSITIVE
          and H1-NEGATIVE-YIELD are unreachable on the declared cells without
          defect columns. The NEGATIVE route would then fire on BIN-ORD-19's
          single-cell false-fail (about 1 percent) instead of a two-cell
          product (design figure about 0.0007), manufacturing a falsification
          of H1 from a design premise.
        what_holds: >-
          The false-pass sweep is present and complete. The reviewer's own
          table, written before the producer's was opened, has 580 flagged
          configurations, none POSITIVE, and the reported-only items are
          honestly demoted. The seam is closed in code and text. The coset
          factor enters every prediction the same way. No rule voids or
          reroutes P1 under the contract model. Every admitted free-sign
          composition is at or below 3.225 percent per-cell non-PASS. The
          no-reuse null is separated in every simulated arm. R3-J3-3, R3-J3-4
          and R3-J3-5 are discharged, RC-3 is answered and J3-O7 adopted.
          Moderate J3-D2 (an unstated INCOMPLETE risk of about 11.5 percent on
          BIN-KOB-19 under the contract's own multinomial coset model) and
          minor J3-D3 (no completeness check on a binary cell's gated test set)
          are carried.
        uncertainty: >-
          The real BIN-KOB-19 defect-column census and the I4 sign convention
          for a class with representative O are unknown (no curve may be built
          in review). The defect-column analysis uses two RECALLED binary-curve
          formulas; the core balance argument uses none. The argument is made
          for m = 2 only. The reviewer did not extend it to m >= 3, where
          mixed-sign rows exist, and did not examine the deployed relation
          systems.
      - joint: J4
        owner: TASK-20261002-6084fa
        attested: true
        disposition: holds
        key_applied: none triggered
        basis: >-
          229 keyword sentences classified; none is an outcome (TA-1 not
          fired). The column-value and matched-advice c-ranges agree with an
          own 50-digit route and with dry calls of committed stage0 to 1e-14,
          within their stated two-decimal rounding. R3-J4-1 is present in all
          seven places. Conventions travel with the column, and the per-orbit
          framing is conditional. The R-SRC digests reproduce on 2026-10-02,
          and the CGK and BL statements used read as cited. PTM-A and PTM-B
          meet their signatures.
        sd_2_ruling: >-
          J4-D1 is NOT scored as breaking (session disclosure SD-2). Five
          holds-below bounds overstate the exact roots by 0.0002 to 0.0054 in
          c, and read literally they match the artifact "a TW-01 or
          matched-advice clause stated for a range of c it does not hold on".
          DEC-20260929-54dcd8 applied the identical artifact text to the
          identical case ("about 2.01" against the exact 2.0046) and ruled the
          clause holding on its stated range. Applying the same frozen text the
          same way is consistency, not relaxation (CA4-9). The other four are
          of the same kind: R3-J4-1's own required "about" figures, under 0.004
          bit wide, under a c-independent routing rule. The one figure stated
          without "about" (H statement_note "1.60" at B_cap(16), exact
          1.595768) is the closest to a literal break and is carried as a
          required correction (R4-J4-2). The ruling is not outcome-determinative,
          because J3 breaks.
      - joint: J5
        owner: TASK-20260929-739a0c (carried by digest)
        attested: true
        disposition: applicable to version 4 and in agreement within tolerance on every compared quantity
        key_applied: K-carry-broken not triggered; K-indeterminate not triggered; the K-approve J5 condition is met
        basis: See d_carry_and_carried_j5. The inconclusive attestation is the card's designed verdict and every Q0 to Q7 output was delivered, so K-infra does not apply.
    unowned_or_unattested_joints: none
    k_infra: not applied to any joint
    k_impediment: not engaged (every cited primary source is reachable; the contract records no impediment)
    composite_reading: >-
      What stands. The deployed Stage 0 arithmetic stands on two routes, one
      blind, now carried to version 4 by a clean diff: the column, identity, LA
      term, m = 5 window, m = 4 slices and envelope, L = 1 ties and rho
