  decision: revise
  decision_label: >-
    Revise under composition key K-revise-defect. J3, the joint on the decision
    table, breaks on two artifacts the plan listed before the object existed:
    "a gate with a false-fail rate above 5 percent under the true model at a
    declared regime" and "a declared outcome no data can reach". The defect is
    J3-D1. On BIN-KOB-19 the contract itself states E/G = Z/4, coset blocks
    {0}, {2} and {1, 3}, and decomposition legs in cosets c and -c. Then at
    m = 2 every relation inside the paired block {1, 3} reads L_i - L_j, the
    block's signed graph is balanced, and none of its ordinary columns is
    determined. Yet cell_model predicts the free-sign determined fraction
    0.797 there, AR-COSET's cycle-excess floor assumes free signs, and the C-4
    calibration draws free signs. A committed-code counterexample determines 0
    of 256 block columns in 200 of 200 runs. BIN-KOB-19 is then non-PASS with
    probability 1 without defect columns (11 to 70 percent with one to
    three), and POSITIVE and H1-NEGATIVE-YIELD are unreachable on the declared
    cells. Everything else holds. J1, J2 and J4 hold. D-CARRY is clean, so the
    carried J5 applies, and it agrees on every compared quantity. The
    false-pass sweep is present and clean: 580 flagged configurations, none
    POSITIVE. Every proves-too-much control meets its signature, no tripwire
    fired, no ICPERF objection is on the bus, and every required item has a
    clause. The contract is not approved. J3-D1 is a protocol-design defect of
    an unapproved contract's toy validation cell at m = 2. It is not a
    mathematical result about any deployed curve, oracle, algorithm or
    heuristic (CA4-11).

