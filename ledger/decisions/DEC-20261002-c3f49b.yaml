    TA-1 erred conservatively) [SS m 4 P0 inputs estimated at 22-24 bits;
    TA-1 assumed, not verified by P0]; and the harness conjunction gives a
    false FAIL, not a false PASS. Reshaped: the "one cell misses its target"
    expectation (0.5) appears as small_x TT4 meeting target by X_rel but not
    by its bound. Unanticipated: about-97.5% intervals, PC-NULL's blindness to
    dispersion, the -2/s U-to-engine bias, F-7. Concurrence is discounted per
    plan PD-1: the prior was written after reading the outcome summary
    (CR-045, CR-046, CR-209 to CR-211).

  # ---------------------------------------------------------------------------
  decision_class:
    class: weaken
    of_what: >-
      The STRUCTURAL BRANCH of H-PFDR-2765d2: the non-null alternative that
      the x-structured bases yield a relation-level excess kappa_rel at or
      above the lever's target, which carries the hypothesis's
      exponent-targeting asymptotic_claim (conditional on kappa_rel ~
      N^delta). The record's own falsification condition names exactly this
      reading for O-NULL-BOUNDED (CR-180).
    cell_scope:
      weakened_20_cells: >-
        Criterion: one-sided upper bound at or below target AND achieved
        X_rel at or below target. Cells: subgroup, small_x and dickson at
        TT3, TT5, SS3, SS4 [SS m 4 P0 inputs
        estimated at 22-24 bits; TA-1 assumed, not verified by P0], SS5 and
        TB3; subgroup and dickson at TT4 (CR-147 to CR-167 except CR-151).
      wording_note_dickson_SS4: >-
        Included, because its upper bound 0.9985 is below target; read as "no
        excess detected", never as kappa_rel < 1 (CR-136, CR-171).
      scoped_out: >-
        small_x TT4: INCONCLUSIVE at the target level (upper bound 1.1711 >
        1.15; signed one-sided 1.1587 > 1.15; CR-135, CR-170). No transition
        for this cell. Successor: the confirmatory replication RC-1 (NA-3).
    evidence: >-
      EV-PFDR-ad6274 (preliminary, toy, empirical_only); runs
      RUN-PFDR-011cd0-table, -search, -srch-check, -calibrate, -analysis;
      reviews TASK-20261002-0114ff and TASK-20261002-87ffc4.
    test_boundary: >-
      Generated prime-order curves (c = 10 .. 10+n-1) at 30 and 32 bits
      pooled; this mitm engine (default arity (m+1)//2, min_fill) at the
      EXP-PFDR-011cd0 build; m = 3, 4, 5; TT and TB over the full table, SS at
      X_fix = 20*isqrt(N); the three named bases against matched random
      triples; the experiment's machine-protection limits (CR-054, CR-184,
      CR-185).
    remaining_uncertainty: >-
      (1) small_x TT4 (chance against a small_x-specific excess, concentrated
      in the 32-bit rung; CR-173); (2) growth with N: kappa_rel ~ N^delta is
      untested by a two-rung band; (3) other x-defined families, arities and
      engines; TB at m = 4, 5; the unharvested TS and search-vs-base
      coincidences; (4) an informative but solve-useless excess (not
      exercised); (5) single run set, one producer session: no independent
      replication yet.
    why_weaken: >-
      The evidence discriminates on the question this transition turns on:
      for 20 cells a conservative calibrated bound excludes a target-size
      excess, the procedure is shown not to prove too much, and the
      sensitivity is validated under real noise. The frozen next_decision
      names weaken plus a scheduled independent replication as the strongest
      admissible transition (CR-176), and docs/claims-and-verification.md
      requires exactly that for a single unreplicated empirical-only adverse
      reading. Taking less than the ceiling for small_x TT4 is not a change of
      success criterion: the frozen text sets a maximum, and this decision
      declines to read one cell's sensitivity as a bound (no
      protocol_amendment is needed; the frozen reading "small_x TT4 meets the
      target by X_rel" stands as recorded).
    why_not_reject_scoped: >-
      A single-run, empirical-only census supports no reject_scoped (plan
      ceiling, CR-041; spec next_decision, CR-176). No closure is made.
    why_not_support: >-
      The hypothesis carries an asymptotic claim; promotion gates 1 (proof
      decomposition of the asymptotic claim) and 3 (concrete-cost table) are
      unmet and gate 2 is partial, so the plan fixed the ceiling at analyzed
      (CR-039, CR-181). Support of the null statement on first observation
      would also outrun a single unreplicated run set.
    why_not_inconclusive: >-
      Inconclusive applies to small_x TT4 and is recorded for that cell. For
      the other 20 cells the bounds discriminate; calling the whole round
      inconclusive would understate a reviewed measurement, the mirror image
      of overclaiming.
    why_not_replicate_alone: >-
      Replication IS scheduled (NA-3), but as the companion the weaken
      requires, not instead of it: withholding the bounded reading on 20
      cells until replication would leave a reviewed result unrecorded.

  scoped_claim: >-
    On generated prime-order curves E/F_p at 30-32 bits (fresh seeds c >= 10,
    subgroup_prime_filter([3,4,5], 0.15)), with the
    crypto_autoresearcher.index_calculus mitm engine at default table arity
    and min_fill, m = 3, 4, 5, for the subgroup, small_x and dickson bases
    against matched random bases: no FAM-1 cell's relation-level excess
    crossed the calibrated family-wise threshold (t* 2.849); in 20 of the 21
    cells a conservative one-sided bound excludes kappa_rel >= 1.15 (TT, SS)
    or >= 1.5 (TB m 3), with achieved detection limits X_rel TT3 1.02, TT4
    1.11, TT5 1.05, SS3 1.03, SS4 1.03 [SS m 4 P0 inputs estimated at 22-24
    bits; TA-1 assumed, not verified by P0], SS5 1.05, TB3 1.27; small_x TT4
    (kappa_rel 1.097, upper bound 1.171) does not exclude a target-size
    excess. CARRY-1 excludes, on 100 fresh 28-bit curves, the relation-level
    kappa 1.196 seen at the EXP-PFDR-1b78f7 discovery cell. No heuristic of
    H-PFDR-2765d2 is refuted at this scale. Evidence EV-PFDR-ad6274
    (preliminary, toy, empirical_only); single unreplicated run set; nothing
    about larger N, growth with N, other bases or engines, or deployed curves
    (CR-129, CR-130, CR-135, CR-147 to CR-167, CR-168, CR-178, CR-202).

  # ---------------------------------------------------------------------------
  na8_ruling_L1:
    question: DEC-20261001-56f873 NA-8 -- may EV-PFDR-1faf10's refutation of HEUR-4765e4-H1 and HEUR-0cc7e8-H1 AS STATED cite L1 at derivation tier? (CR-191, CR-192)
    ruling: >-
      YES, scoped. J2 found L1 correct within the uniform model U for N prime,
      with a complete four-step proof, verified by exact enumeration on toys
      and applicable to the engine's TT and TB stored sets (CR-084). Its
      corollary C1 (pair-count dispersion D_P = (1 - 1/N) sum M_r^2 / sum
      M_r >= 1, with equality only if every multiplicity is 1, and the lattice
      form) is the derivation-tier reason that a Poisson law for PAIR counts
      fails on uniformly random bases (CR-183). Therefore the refutation of
      HEUR-4765e4-H1 and HEUR-0cc7e8-H1 as stated -- the Poisson shape of
      per-class PAIR counts -- may cite L1 C1 at derivation tier for TT and TB
      under U, with the wording fixes L1-W1 (TB on the bipartite pair set),
      L1-W2 (moments exact for the representations off the null event) and
      A-Q3 (the engine's distinct-x base is not U; the U-to-engine transfer is
      HEUR-2765d2-H4, with a derived -2/s pair first-moment bias; CR-085). It
      stays labelled "derivation", never "proved"
      (docs/claims-and-verification.md). It does NOT extend to SS (L3 is a
      sketch; SS stays empirical_only), to the first-moment clauses of those
      heuristics, or to any floor-relative clause. The derivation artifacts
      are ledger/hypotheses/H-PFDR-2765d2.yaml lemmas L1 (committed) and the
      red team's step-by-step check attacks/j2/proof-check.yaml (fa1154-bound,
      CR-013).
    effect: >-
      This record is the new record NA-8 asks for; EV-PFDR-1faf10 is not
      edited. No status changes: the H-PFDR-4765e4 and H-PFDR-0cc7e8
      status-field writes stay held for the user (DEC-20260929-bbb3a9 NA-9,
      DEC-20261001-3fbaff NA-3), and H-PFDR-0cc7e8's reassessment still waits
      on the TW-FLOOR round (DEC-20260929-bbb3a9 NA-10). Any later record that
      relies on the derivation tier cites this ruling.

  target_result_profile_check:
    required: false
    reason: The decision is weaken, not support or expand. Answered briefly for the record.
    answers:
      heuristics_explicit_numbered: yes (HEUR-2765d2-H1a, H1b, H1c, H2, H3, H4, H5); none refuted at 30-32 bits; H3 untested for TT4 and TB3
      random_model_justification_transfers: L1 transfers to the engine's table with the H4 caveat (-2/s); H2's justification is recalled and outside the proven range
      validation_scale_and_transfer: toy (<= 32 bits); no transfer asserted; TA-1 (design only) failed conservatively [SS m 4 P0 inputs estimated at 22-24 bits; TA-1 assumed, not verified by P0]
      overheads_and_memory: not costed (no cost claim; promotion gate 3 unmet)
      per_attempt_cost_times_inverse_success: not applicable (no complexity claim advanced)
      corollaries_via_reductions: none (reduction_chain empty)
      affected_vs_safe_scope: none claimed (TW-SCOPE); Pollard rho and BSGS unaffected
      exponent_bias_note: >-
        The structural branch is this line's only exponent-targeting
        mechanism. A constant kappa_rel at 30-32 bits cannot move the
        engine's exponent; only growth kappa_rel ~ N^delta could, and a
        two-rung band cannot measure delta. The successor design is asked to
        say whether a growth read is feasible (TASK-20261002-33047e), so that
        the weaken does not stand in for an untested exponent question.

  rationale:
    - >-
      Validity first: the package was ruled valid and its validity was
      re-attacked with independent code (J1, J5, J7); the round's seal,
      blindness and archive are verified before any reading.
    - >-
      Composition, not voting: each verdict is read on its owner's joints.
      The single break (J6) is a scoping break, accepted and applied.
    - >-
      The weaken is bound-based on 20 cells, scoped exactly to the tested
      curves, sizes, engine and arms, and paired with a scheduled independent
      replication; it is not a closure and makes no statement about N beyond
      32 bits.
    - >-
      Research-direction integrity (AGENTS.md rule 9): the one open signal
      (small_x TT4) is carved out, not averaged away, and gets a dedicated,
      pre-registered confirmatory design with a base mutation that can
      separate chance from a small_x-specific excess; the exponent question
      (growth with N) is named as untested rather than implied closed.
    - >-
      Symmetric skepticism: no reject_scoped from one empirical-only run; no
      support for an asymptotic claim missing promotion gates.

