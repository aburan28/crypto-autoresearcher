  # ---------------------------------------------------------------------------
  rulings:
    - id: R-ACT
      subject: what this pass does and in what order
      ruling: >-
        Rank the acts available to this session (portfolio_ranking); perform
        rank 1 by opening BATCH-361e02 with sixteen cards, both review plans
        written now, and the additive goal-head checkpoint; rule on the shape
        (R-SHAPE), the slot (R-SLOT) and the custody successor (R-CUSTODY);
        apply DEC-20260928-9d9c47 NA-3 at this selection point (R-SELECTION).
        Every deliverable is an ordinary Coordinator act under standing
        authorization; none waits for the user.
    - id: R-SHAPE
      subject: one two-lane batch or two single-lane batches
      ruling: >-
        ONE TWO-LANE BATCH, BATCH-361e02, in the shape of BATCH-d34db1: one
        BATCH, one opening DEC, two composing DECs, sixteen cards,
        max_concurrent 2. Reasons. (1) Identifier arithmetic: the pool is 2
        BATCH, 6 DEC and 24 TASK. The two-lane shape uses 1, 3 and 16 and
        leaves 1 BATCH, 3 DEC and 8 TASK, which covers the custody successor's
        six-card, two-DEC, one-BATCH chain whenever it opens (R-CUSTODY
        precondition 1). Two single-lane batches use 2 BATCH, 4 DEC and 18 TASK
        (each needs its own opening card and opening archive) and leave no
        BATCH, so the custody successor could not open on this pool at all. (2)
        One opening archive and one goal-head checkpoint rather than two: the
        goal head is the one file every lane of this goal writes, and one
        additive edit halves the conflict surface (DEC-20260925-89573b R-FORM
        rationale). (3) The lanes stay independent after TASK-20260929-1aa52d
        exactly as in BATCH-d34db1: disjoint paths, separate plans, separate
        composers and separate ledger archives, so one lane's revise or
        impediment does not hold the other. (4) The shape is proven: BATCH-d34db1
        ran it end to end with every receipt verified. Cost stated: one lane
        record covers both lanes and closes only when both archives verify; a
        stalled lane keeps the record open, which is visible and harmless.
        The opening brief already sits in the BATCH-361e02 directory; no file
        moves.
    - id: R-SLOT
      subject: slots under DEC-20260928-65c6d7 R-SLOT
      ruling: >-
        campaign_budget.max_concurrent 3 counts live claims across every
        queue of the goal (DEC-20260928-157d40 R-SLOT). Session-verified live
        claims at this fetch: 0 of 3. Slot 1 stays held for the EXP-QSP-70b731
        custody successor, which is not displaced (R-CUSTODY). This batch takes
        slots 2 and 3, which are exactly the lane-A slot freed when
        TASK-20260928-649630 verified (DEC-20260928-cec92e CH-1) and the lane-B
        slot freed when TASK-20260928-4b00da verified (DEC-20260928-9d9c47
        slot_freed_by_this_lane), and opens with max_concurrent 2: lane A and
        lane B run in parallel. Standing rule, unchanged from
        DEC-20260928-65c6d7: before every claim the session re-fetches and
        re-counts across every queue of the goal, including the BATCH-b67954
        queue on its branch, and waits while the live count is 3; one live QSP
        or b67954 claim occupies the held slot and does not displace this
        batch; a second one makes this batch effectively serial by the wait
        rule, lane A before lane B, with no queue edit. If at
        TASK-20260929-1aa52d's fetch only one slot is free beside the held one,
        the session records that in the completion record and claims one card
        at a time.
    - id: R-CUSTODY
      subject: the EXP-QSP-70b731 custody successor (DEC-20260928-65c6d7 R-CUSTODY and rank 2)
      ruling: >-
        NOT OPENED IN THIS PASS. It stays the next act on this goal, holds
        slot 1, and is not displaced. Precondition by precondition, as
        DEC-20260928-65c6d7 R-CUSTODY lists them: (1) ids: satisfiable, since
        this act leaves 8 TASK, 3 DEC and 1 BATCH unused (R-SHAPE), although
        this decision returns them rather than reserving them (R-IDS); (2) git
        fetch immediately before opening: met at the brief; (3) no live QSP
        claim: met at the brief; (4) the QSP branch head inspected again:
        8164cc5b96, unchanged since 2026-09-21; (5) the NA-2 bus pointer on the
        bus with its MSG id recorded: MSG-20260928-663de2, no reply; (6) its own
        opening decision as a separate act, with a snapshot card declaring the
        run files and a validator reading them. Precondition (6) cannot be met
        honestly in this pass, for two reasons, the first new. (a)
        FINDING-QSP-DOUBLE-DECLARATION below: the queued BATCH-2c4a9c run card
        TASK-20260921-9f84a3 already declares the EXP-QSP-70b731 run files as
        its artifact_paths, owned by the queued, unbound snapshot
        TASK-20260921-1a4c29. A successor snapshot declaring the same files
        would give them a second archival owner, which the archive discipline
        refuses (AGENTS.md "Durable research commits": every run receipt is
        assigned to exactly one archival task), unless an explicit binding
        supersession of exactly those paths is decided first, in the shape of
        DEC-20260921-f0e100, which superseded only a plan-to-task binding. That
        supersession touches another session's queue, and whether the
        dispatcher and validate_ledger accept a later queue re-declaring those
        paths is a shell question no one has tested. (b) The successor's
        validator must read experiments/EXP-QSP-70b731/runs/, which this
        pass's brief excludes on every card; lifting that exclusion for one
        validator card is a scoped ruling that belongs in the custody opening
        decision itself, with the ownership question answered, not bolted onto
        this batch. Neither reason is a ruling on the runs. RECHECK: the next
        /coordinate pass with a shell, after the session has performed NA-3
        (a read-only ownership render of the four QSP queues against the file
        names under runs/, and whether the tools refuse a double declaration).
        That pass opens the successor with its own opening decision, which
        rules on the binding supersession and lifts the runs/ exclusion for
        its validator card only, with ids minted then (six TASK or seven if the
        supersession needs its own archive, two DEC, one BATCH). Earlier if
        coordinator-qsp-run-20260921 answers, or a QSP claim goes live (then it
        waits and is rechecked). Asserts nothing about the runs' count,
        validity, completeness or outcome.
    - id: R-LANES
      subject: lane structure
      ruling: >-
        Two disjoint lanes in one batch on one branch and one PR
        (docs/concurrent-goal-lanes.md). Lane A owns H-BINSTD-7951d2,
        experiments/EXP-BINSTD-517186/, its design, review and composition
        directories, REVIEW-BINSTD-A-20260929-361e02 and DEC-20260929-1f5fcb;
        lane B owns H-BINSTD-de2808, experiments/EXP-BINSTD-6f1e66/, its
        directories, REVIEW-BINSTD-B-20260929-361e02 and DEC-20260929-8c3cb2.
        No lane-A card reads a lane-B path of this batch or of BATCH-d34db1,
        and vice versa. After TASK-20260929-1aa52d the lanes are independent;
        each closes on its own lane archive, and the lane record BATCH-361e02
        closes when both have verified.
    - id: R-FORM
      subject: record form of version 2
      ruling: >-
        SUPERSEDING RECORD SETS IN BOTH LANES. Lane A: H-BINSTD-7951d2 and
        EXP-BINSTD-517186 with supersedes H-BINSTD-6e4713 and
        EXP-BINSTD-532d7f, as DEC-20260928-cec92e NA-1 requires. Lane B:
        H-BINSTD-de2808 and EXP-BINSTD-6f1e66 with supersedes H-BINSTD-0126fe
        and EXP-BINSTD-de9678; DEC-20260928-9d9c47 NA-1 permits either this or
        additive amendments under experiments/EXP-BINSTD-de9678/amendments/,
