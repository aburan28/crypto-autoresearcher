        composing decision. The supersedes field follows the ledger's
        existing precedent (for example H-QSP-645a07, H-AUXIN-6db354,
        EXP-SSI-8fbe66).
    - id: R-TIER
      subject: review tier
      ruling: >-
        Both review rounds run at review-breakthrough at max, non-degradable
        (validator-breakthrough for the validator and blind cards,
        red-team-breakthrough for the red-team cards), because TW-01 and TW-02
        of DEC-20260928-63addc still bind (each NA-1 says so). If a review card
        cannot be served at max it is not dispatched, the impediment is
        recorded on the still-active goal, and that lane's contract stays
        unapproved; the other lane continues. Lane A's plan owns a joint on the
        decision table itself (J3), carries the three proves-too-much controls
        plus the no-reuse null (PTM-A to PTM-D), and a blind card with the
        contract's own constants as exact forms, the unrounded comparator
        inputs and the m = 4 envelope (DEC-20260928-cec92e NA-1 and PD-C3).
        Lane B's plan records a prior about the estimator's finite-sample
        behaviour, adds PTM-D (the repaired shuffle fed an exact filter and a
        planted marginal-only filter), and a blind card re-deriving the
        repriced sample sizes per (cell, M) from S at or above about
        100 x M^2 with the orders and admissibility they rest on
        (DEC-20260928-9d9c47 NA-1).
    - id: R-SCRATCH
      subject: private scratch subdirectories
      ruling: >-
        Every reviewer and blind re-deriver writes temporaries only in
