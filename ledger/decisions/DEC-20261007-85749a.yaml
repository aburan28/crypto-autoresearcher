  context: >-
    One cycle of design-experiment plus propose-ideas.
    IDEA-20261006-38a54f is on origin/design/volc-b4c2bf-root and is
    not on origin/main. The question is RQ-TORS-8c7b79. No hypothesis
    or experiment on origin/main cites that full idea id. The branch
    design/tors-38a54f was created from origin/main at
    6834a4329e614f1255062e88ccafc18de776d929. The copied proposal
    bytes are blob 647bf9f9e0bcd491859d1e273c07a973d6177934 and parsed
    as YAML without a quote change. The prediction is that the
    symmetric difference of the factor-degree multisets of psi_5 at
    [1]P and at [2]P is exactly 0, and that the shifted symmetric
    difference is at least 1 when the x-coordinates differ.

    A run-aware count on origin/main, using the first top-level
    status and goal_id in each specification that names
    GOAL-ENDO-001, together with git ls-tree of experiments/*/runs
    and ignoring .gitkeep, gives 10 approved contracts and
    approved_unrun=2. The two with no run are EXP-TORS-77e641 and
    EXP-VOLC-3fee23. The cap in tools/portfolio_kpis.py is 3, so
    headroom is 1. check_approval_capacity would not reject an
    approving decision. This decision does not name any contract
    under supersedes_experiments or withdraws_experiments. The
    working tree omits experiment run trees, so portfolio_kpis.py
    --capacity on that tree is not the figure used here.

    The missing driver is a program that enumerates the factor-degree
    multisets. experiments/EXP-ECTD-001/driver/divpoly.py builds
    coefficient lists and does not factor them.
    experiments/EXP-ECTD-9e4248/driver/divpoly_ext.py extends the
    recursion index and does not compare k = 1 with k = 2. A search
    of origin/main for the phrases "shifted_symmetric_difference" and
    "degree_multiset_k1" under *.py and *.sage returned no path.
    There is no trial-plan.json. The only file under runs/ is
    .gitkeep.

    Success is the source idea's prediction. The concrete negative
    is an unshifted symmetric difference of at least 1, with the
    identical-build, eligible-point, shift, and ordinary checks
    passed. No polynomial was factored in this session. The same
    pass files IDEA-20261007-9e4433, IDEA-20261007-ee2836, and
    IDEA-20261007-d3f3d7 and does not design them. Proposals on
    origin/main and the idea files on pull requests 1971 and 1970
    were read before those three claims were written. The
    idea-generator was not dispatched. The coordinator wrote the
    three records in this pass.

  rationale:
    - The standing authorization covers a complete runnable protocol. This one has no psi_5 factor-degree comparison, so it is not approved.
    - check_approval_capacity would not reject an approving decision. GOAL-ENDO-001 has approved_unrun=2 against cap 3. This decision names that check and does not force approved, because the driver is missing.
    - The missing driver is the F_13 comparison of unshifted and shifted factor-degree multisets of psi_5 on y^2 = x^3 + 2x + 3, including the least eligible point and the group-law double. No program on origin/main evaluates that pair of symmetric differences.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - An unshifted symmetric difference of at least 1, with the checks passed, is reachable as a recorded outcome, so success is not automatic.
    - Identical builds, an eligible point, a separating shift, the twist null, and the ordinary nonsingular check are the controls.
    - A blind shift control is not relabeled as an unshifted difference of at least 1.
    - This session did not factor psi_5 and did not claim that the exponent 1/2 moves.
    - No run id was minted. The replication plan does not name a future run slot while the trial plan is unfrozen.

  evidence_refs: []
  limitations:
