coordinator_decision:
  id: DEC-20260804-fec1e8
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-053
  recorded_by_task: TASK-20260804-025
  archived_by: TASK-20260804-025
  context: >-
    BATCH-053 mathematical analysis of IDEA-b6624c (ordinary isogeny MITM)
    found two independent blocking points and established a systematic pattern
    across all SG-ECDLP-002 isogeny-based directions.

  decision: close_scoped_advance_lane

  decision_scope: >-
    IDEA-b6624c (ordinary isogeny MITM) is blocked at two independent points:
    (1) STARTING-POINT: the backward walk requires a second curve encoding k,
        but scalar multiplication acts on points (not curves), so no such curve
        can be constructed from (E, G, Q) without already knowing k.
    (2) KEY-RECOVERY: same h(D)<<N obstruction as IDEA-e88120 — any map Z/N ->
        Cl(O_K) has kernel ~sqrt(p), leaving a Pollard-rho-equivalent residual.

    Pattern across all SG-ECDLP-002 isogeny-based directions (batches 047-053):
    Every direction tried reduces to the same SCALAR-DOMAIN MISMATCH: the ECDLP
    scalar k lives in Z/N (order N ~ p) while all known isogeny-related algebraic
    structures (class group Cl(O_K), isogeny class) have order at most h(D) ~ sqrt(p).
    Any information transfer from ECDLP to class group loses >= sqrt(p) bits,
    yielding a residual O(sqrt(N)) search = Pollard rho.

    SG-ECDLP-002 (isogeny-based ordinary ECDLP reduction) is PAUSED at the
    scalar-domain mismatch obstruction with a named successor condition:
    "Resume when a mechanism is proposed that connects the ECDLP scalar (in Z/N,
    order N~p) to a computational structure of order > sqrt(p) — e.g., a group
    of order N itself — that admits subexponential DLP."

    GOAL-ECDLP-001 remains ACTIVE. Pivot to non-isogeny ECDLP directions.

  target_ids:
    - GOAL-ECDLP-001
    - SG-ECDLP-002
    - BATCH-053
    - IDEA-20260804-b6624c
    - H-IT-001
    - H-ICI-063e91

  rationale:
    - >-
      Starting-point obstruction (BATCH-053 Audit 1): the ECDLP backward walk
      has no well-defined starting curve. Scalar multiplication acts on points,
      not on curves. This is not an engineering gap; it is a category mismatch.
    - >-
      Key-recovery obstruction (BATCH-053 Audit 2): same as IDEA-e88120 — any
      group homomorphism Z/N -> Cl(O_K) has kernel size N/h(D) ~ sqrt(p), leaving
      O(sqrt(N)) residual search = Pollard rho.
    - >-
      Systematic pattern (batches 047-053): Tate theorem (H-IT-001), h(D)<<N
      class group mismatch (IDEA-e88120), Elkies ell augmentation ≈ random map
      (H-ICI-063e91), isogeny cycle endomorphism = End(E)=Z for generic curves,
      MITM blocked at starting point. All five independent directions meet the
      same obstruction: the ECDLP scalar has order N~p while isogeny structures
      have order at most sqrt(p).
    - >-
      Wesolowski analogy (BATCH-053 Audit 4): Wesolowski's p^{1/3} solves the
      ISOGENY FINDING PROBLEM (both curves given as input). The ECDLP has only
      one curve plus a group element, making the Wesolowski approach inapplicable.
      This is not a barrier to Wesolowski's result; it confirms it solves a
      different (but related) problem.

  sg_ecdlp_002_transition:
    from: active
    to: paused
    named_obstruction: >-
      SCALAR-DOMAIN MISMATCH: ECDLP scalar k in Z/N (order N~p); all ordinary
      isogeny-related algebraic structures have order at most h(D) ~ sqrt(p).
      Any information transfer from ECDLP to these structures loses >= sqrt(p) bits.
    named_successor_condition: >-
      Propose a mechanism connecting the ECDLP scalar (in Z/N, order N~p) to a
      computational structure of order > sqrt(p) that admits subexponential DLP.
      Example that would reopen: a group G of order N itself with G != E(F_p)
      but related to E via isogenies, where DLP in G is subexponential.

  exact_next_action: >-
    PIVOT to non-isogeny ECDLP reduction directions for GOAL-ECDLP-001.
    Open BATCH-054 with fresh ideation for GOAL-ECDLP-001 targeting:
    (A) Index calculus structure improvements (Semaev summation polynomial,
        Diem-Kochinke, Joux-Vitse decomposition attacks) — approaches that
        do NOT require isogeny-based transfer;
    (B) Lattice-based DLP acceleration on E(F_p) for specific curve classes
        where a NEW structural ingredient (not isogeny-class-based) applies;
    (C) Any mechanism from the broader literature that the program has not yet
        examined, checking against the knowledge corpus via search_knowledge.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No KN-* entry was created by this decision. The record's `promoted` list held
      a placeholder id for a promotion that was OWED but never made, which made the
      record assert the opposite of the truth -- that the corpus had been updated.
      Converted under DEC-20260805-7b3e91 (RUL-9): the obligation is declared here,
      where the schema puts an unmet obligation, and every word of the original
      entry is preserved verbatim under owed_promotions below. Nothing was deleted.
    owed_promotions:
      - id: pending_kn_find_scalar_domain
        note: >-
          The SCALAR-DOMAIN MISMATCH obstruction is a publishable negative result.
          Promote to KN-FIND after formal write-up: "Ordinary isogeny-based
          approaches to prime-field ECDLP reduce to Pollard rho due to the
          scalar-domain mismatch (Z/N order N vs Cl(O_K) order sqrt(p))."

  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2
    sota_delta: {time_exponent: not_applicable, memory_exponent: not_applicable, data_or_query_exponent: not_applicable}
  claim_ceiling: theoretical
  official_research_state_changed: true
  state_changed_fields: ["SG-ECDLP-002.status: active -> paused"]
  decided_by: coordinator
  decided_at: '2026-08-04'
