  context: >-
    /design-experiment, one contract, for IDEA-20261005-0aecda. No
    hypothesis and no experiment on origin/main cites that idea. The
    proposal file is absent from origin/main. It was read from
    origin/design/drinf-474802-torsion and copied byte for byte. Its
    question id is RQ-HYPER-7ca025. The branch
    design/hyper-0aecda-cantor was created from origin/main at
    3575cc2705c200ffc0c0163c82548ab3335585ce and git merge origin/main
    reported already up to date.

    The contract measures one Cantor doubling on the sextic
    y^2 = (x^2 + 1)(x^2 + x + 2)(x^2 + 2) over F_11 and one rejection
    on the quintic y^2 = (x^2 + x + 2)(x^2 + 2)(x - 1) over F_11.
    It is not a restatement of the Richelot formula agreement
    EXP-HYPER-d81a41 and not a restatement of the Prym-dimension
    experiment EXP-HYPER-6d92f8. The pre-registered prediction is that
    doubling sends (x^2 + 1, 0) to zero on the sextic and that the
    degree-5 null rejects that input. Failure of either half is a
    negative. The nontorsion control (x, 2) doubling to zero is also a
    negative. No attack and no exponent improvement are claimed.

    This session expanded the named products over F_11. The sextic
    checksum is x^6 + x^5 + 5x^4 + 3x^3 + 8x^2 + 2x + 4. The quintic
    checksum is x^5 + 3x^3 + 9x^2 + 2x + 7. Both are squarefree. That
    expansion is not a Cantor run. The markdown notes KN-LIT-1371 and
    KN-LIT-921 were opened. Their PDFs were not opened.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, seeds, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. Success is the
    indicator triple 1, 1, 0 and fails when either half of the
    prediction fails. No field required for approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading are fixed before any executor run.
    - Failure of either half is reachable, so success is not automatic.
    - The degree-5 null is a same-shape input on which acceptance is a negative rather than an infrastructure failure.
    - The nontorsion divisor gives the order-2 reading a way to fail when every tested divisor doubles to zero.
    - Two acceptance implementations and a checksum give the run a way to come back invalid when the arithmetic splits.
    - This session did not run Cantor doubling and did not claim an ECDLP exponent improvement.

  evidence_refs: []
  limitations:
    - The measurement covers one sextic and one quintic over F_11. It is not a theorem about every genus-2 Jacobian.
    - A zero class here is not a (2,2)-kernel count and not a Prym dimension.
    - KN-LIT-1371 and KN-LIT-921 remain abstract-level notes. Their PDFs were not opened, and no formula was taken from them.
    - This decision authorizes a later execution. It does not start one. It does not move an ECDLP exponent.

  next_actions:
