coordinator_decision:
  id: DEC-20260914-37e0d9
  context: >-
    EXP-FROB-d8aa37 stage0 has exactly one mandatory trial (stage0-q8-n3-complete,
    RUN-FROB-2404fa) carried by the scientific handoff TASK-20260909-ece919 in
    BATCH-2f8435, approved by DEC-20260909-bf5b48. The frozen sources, the frozen
    specification-stage0-v2.yaml and the frozen trial-plan-stage0-v2.json are in
    place and mutually hash-bound; the dispatcher lists the scientific task as a
    Ready Task with state queued and the epoch-1 claim by
    executor-frob-stage0-2404fa expired on 2026-09-11T02:25:07Z. The SOLE
    remaining blocker is that no scientific runtime exists: the pinned Modal
    runtime in coordination/frobenius/BATCH-2f8435/admission/linux-runtime-lock.json
    carries scientific_launch_authorized false, and its 86400-second lifecycle
    lease, acquired 2026-09-10T02:17:34Z, expired around 2026-09-11, taking the
    sandbox sb-V5LqNGVIrrwLuNTxAaMX5Z and its custody volume
    vo-RZu567qFVyfjg5aibyMFqC with it. This decision does not launch, approve or
    re-approve the trial. It declares the existing runtime lock superseded FOR
    LAUNCH PURPOSES ONLY by a successor lock that does not yet exist, specifies
    that successor completely so it can be cut mechanically the moment a runtime
    exists, and dispatches the bounded zero-run provisioning task
    TASK-20260914-861bb9 to produce it.
  decision: supersede
  target_ids:
    - EXP-FROB-d8aa37
    - RUN-FROB-2404fa
    - TASK-20260909-ece919
    - TASK-20260914-861bb9
    - BATCH-2f8435
    - RQ-FROB-7d8dd4
    - H-FROB-73df22

  rationale:
    - >-
      RANKED FINDING, AND WHY THIS RANKS AHEAD OF DOING NOTHING. FROB is an ECC
      area, declared once in orchestration/research-priority.yaml (ecc_areas
      entry "FROB   # Frobenius exploitation in subfield-curve index calculus",
      added 2026-09-06 with the other user-named targets) and read through
      tools/ecc_priority.py, which classifies area FROB as ECC. AGENTS.md "ECC
      comes first, and its budget is unlimited" therefore puts this work ahead of
      every non-ECC candidate at this selection point. Ranking is still owed on
      the merits and is given here: the stage0 trial is fully specified, frozen,
      single-trial, deterministic in scope and has exactly one unmet
      precondition, which is infrastructure rather than science. The cheapest
      action that changes the next decision is therefore not more design work and
      not another experiment - it is provisioning one Linux Sage 10.9 runtime and
      re-cutting the admission lock. That is a bounded, zero-scientific-run task
      with a checkable completion gate, and it converts a stalled Ready Task into
      a launchable one. Doing nothing leaves an approved ECC experiment
      indefinitely blocked on an expired cloud lease, which is the exact
      make-work-versus-impediment failure AGENTS.md "Goals are never paused"
      warns about in its inverse form.
    - >-
      DIRECTION CHECK against docs/target-result-profile.md. Stage0 is not itself
      exponent-moving and is not presented as such. It is the correctness gate
      for H-FROB-73df22's two arms, and arm B is the exponent-targeting arm: the
      B3 prediction is a slope of log(total charged cost) against log q, object
      versus null, with a predicted gap 2/(n(n-1)) resting on the splitting of
      the Weil restriction of a subfield curve as E x T_n. Arm A predicts NO
      degree drop and is a falsification arm. Stage0 resolves the signed-point
      versus x-only fiber question that both arms depend on. Unblocking it is
      therefore prerequisite to the only part of this lane that could move an
      exponent, and the exponent claim itself remains entirely unmade here.
    - >-
      STANDING AUTHORIZATION. AGENTS.md "Standing user authorization for ideas
      and experiments" (user instruction 2026-09-06, verbatim "all is approved.
      ideas/experiments should be always approved") means no user confirmation is
      sought for this dispatch, and DEC-20260909-bf5b48 already carries the
      experiment approval and its own standing_authorization note. What the
      standing authorization does NOT do is supply a runtime or waive an
      admission guard: DEC-20260909-bf5b48's admission block states plainly that
      "Before scientific launch parent pins actual Linux image digest,
      mount/source snapshot identity, resolved sage/python executable
      paths/hashes, versions and successful guard/process-group/import probes. No
      imagined runtime availability, no memory-guard weakening and no restart of
      other work is authorized by this record." This decision operates strictly
      inside that sentence.
    - >-
      THE EXPIRED LEASE IS INFRASTRUCTURE SIGNAL, NOT EVIDENCE. AGENTS.md core
      rule 5 and CLAUDE.md rule 3 apply: the loss of sb-V5LqNGVIrrwLuNTxAaMX5Z
      and vo-RZu567qFVyfjg5aibyMFqC says nothing whatsoever about
      H-FROB-73df22, about RQ-FROB-7d8dd4, or about whether Frobenius structure
      moves the index-calculus exponent. No hypothesis status moves here;
      H-FROB-73df22 stays `proposed`. No experiment status moves here;
      EXP-FROB-d8aa37 stays `approved` with execution_authorized true and zero
      runs recorded.
    - >-
      A SUCCESSOR LOCK IS REQUIRED RATHER THAN AN EDIT. The existing lock is an
      immutable admission artifact whose declared sha256 is pinned by
      run-binding.json (runtime_lock_sha256
      b85bd404150f49eab1a483661cd62eb9afff0f0d8e9f0522f7c7f4e0bc53d7b8). Editing
      it would silently invalidate that binding and rewrite the recorded history
      of a probe that really happened on a runtime that no longer exists. Under
      AGENTS.md core rule 4 a correction supersedes and never overwrites, so the
      repair is a NEW lock file and a NEW binding file, both specified below.

