  lane_homing:
    finding: >-
      RQ-FROB-7d8dd4 is an ORPHANED ECC LANE. It is `active` and owned by the
      coordinator, it has a hypothesis (H-FROB-73df22, `proposed`), a frozen
      approved experiment (EXP-FROB-d8aa37) and a live batch (BATCH-2f8435), but
      no persistent goal carries it. The operational cost is concrete and is
      visible in this very decision: there is no head on which to record an
      impediment, no next_action to preserve across archives, and no checkpoint
      target after a ledger archive.
    no_goal_created_here: >-
      Deliberate. The /coordinate skill permits creating a GOAL-* only on
      explicit user request, and the user has not requested one. No identifier
      was minted for a goal, and none may be minted from this record.
    recommended_home: GOAL-ECDLP2M-001
    recommendation_rationale: >-
      GOAL-ECDLP2M-001 ("Characteristic-2 ECDLP index-calculus and descent search
      over binary extension fields") is the correct owner on scope, and names
      this exact mechanism family in its own objective and scope fields:
      "Frobenius and subfield orbit structure", "GHS / Weil descent and
      restriction of scalars", "trace-zero and restriction-of-scalars
      representations", and end-to-end charging of "relation probability,
      decomposition cost, Groebner/SAT/elimination cost, linear algebra, descent,
      preprocessing, memory, and verification" against generic rho. That is
      RQ-FROB-7d8dd4's decision target almost verbatim, and the stage0 cell
      (q = 8, n = 3, i.e. F_(2^9)) sits squarely inside its field family. Its
      question_ids is empty, so adopting RQ-FROB-7d8dd4 is additive and collides
      with nothing.
    two_disclosed_defects_in_that_recommendation:
      - >-
        GOAL-ECDLP2M-001 is `status: draft`, not active. Attaching the question
        therefore requires a separate Coordinator ledger archive that both adds
        RQ-FROB-7d8dd4 to question_ids and moves the goal draft -> active. THIS
        DECISION DOES NEITHER: it changes no goal status and edits no goal
        record. The recommendation is a ranked proposal for that archive, not the
        attachment itself.
      - >-
        Scope coverage is partial. GOAL-ECDLP2M-001 is binary-extension-field
        only, while RQ-FROB-7d8dd4's ladder also carries odd-characteristic
        subfield cells (q = 31, 127, 509 at n = 3 and q = 11, 19, 29 at n = 5).
        The adopting archive must either scope the adoption to the binary arm and
        record the odd-characteristic arm as unhoused, or widen the goal
        explicitly. Silently filing the whole RQ under a binary-only goal would
        mis-scope it.
    alternatives_considered_and_declined:
      - >-
        GOAL-ICEX-001 (active, "Charged toy index-calculus exponent vs rho").
        Closest METHOD match in the portfolio - fully charged toy index calculus
        against rho with certificates - but declined on scope and on state. Its
        RQ-ICEX-001 is generic PRIME-FIELD ECDLP, whereas RQ-FROB-7d8dd4 states
        in terms that "Nothing here bears on prime-field curves or on
        GOAL-ECDLP-001". Its head also carries a standing hold ("NO ICEX
        MEASUREMENT AUTHORIZED", conjunctive on unmet SDEG/MONO/RELN packages),
        so attaching here would import an unrelated hold onto a lane whose only
        blocker is a runtime.
      - >-
        GOAL-CRYPTO-001 (active, "Reproducible cryptographically relevant ECDLP
        breakthrough search"). Declined: its objective is a recognized
        cryptographic-size PRIME-FIELD curve, and RQ-FROB-7d8dd4 is toy-scale,
        subfield, and explicitly bars deployed Koblitz and sect-family
        parameters as instances.
      - >-
        GOAL-SEMBIN-cbf422 / GOAL-SEMBIN-5078bc (active, binary-field Semaev).
        Declined: both are bound to the specific chained-S_3 construction of
        Semaev 2015 (ePrint 2015/310) and its four unrevisited choices. Subfield
        Frobenius orbit structure is a different mechanism family, and filing
        FROB there would blur two audits that must stay separable.
    interim_disposition: >-
      Until a goal adopts the lane, IMP-1 above is its impediment of record and
      next_actions NA-4 of this decision is its single preserved next action.

