        current_runtime_observation.scientific_runtime_ready is false.
      - >-
        run-binding.json: runtime_lock_sha256 is
        b85bd404150f49eab1a483661cd62eb9afff0f0d8e9f0522f7c7f4e0bc53d7b8;
        source_snapshot_commit 02c58ea5cc3efd98f69dc25c61c5feed34f5f04d;
        pre_binding_commit 47112d40dc9963e7ee9f585de97aa6cf66043be1; four
        launch_conditions; scientific_runs 0.
      - >-
        trial-plan-stage0-v2.json: frozen true, one trial
