    - ledger/decisions/DEC-20260909-bf5b48.yaml
    - ledger/handoffs/TASK-20260909-ece919.yaml
    - ledger/questions/RQ-FROB-7d8dd4.yaml
    - ledger/hypotheses/H-FROB-73df22.yaml
    - ledger/corrections/CORR-20260802-a1f151.yaml
    - experiments/EXP-FROB-d8aa37/specification-stage0-v2.yaml
    - experiments/EXP-FROB-d8aa37/trial-plan-stage0-v2.json
    - experiments/EXP-FROB-d8aa37/stage0/dependencies.json
    - coordination/frobenius/BATCH-2f8435/admission/linux-runtime-lock.json
    - coordination/frobenius/BATCH-2f8435/admission/run-binding.json
    - coordination/frobenius/BATCH-2f8435/admission/stage0-admission.json
    - coordination/frobenius/BATCH-2f8435/dispatch_queue.json
    - orchestration/research-priority.yaml

  verification:
    attribution_note: >-
      HONEST ATTRIBUTION, per AGENTS.md core rule 9. This Coordinator subagent
      holds no shell. It did not recompute any sha256, did not run
      tools/research_dispatch.py, tools/validate_ledger.py, tools/ecc_priority.py
      or tools/allocate_id.py, and did not probe any runtime. Every item below is
      marked either `read_by_coordinator` (this agent opened the file and read
      the stated field) or `reported_by_session` (the top-level session ran the
      command and reported the result; this agent recorded it as a report, not as
      its own measurement).
    read_by_coordinator:
      - >-
        linux-runtime-lock.json: runtime_identity.scientific_launch_authorized is
        false; runtime_identity.scientific_runs is 0; scientific_runs_at_lock is
        0; sandbox_id sb-V5LqNGVIrrwLuNTxAaMX5Z; image_id
        im-LSkIqr2r5VLiLOYqIJKzhg; base_oci_image
        sagemath/sagemath@sha256:2401ffa8e9fc85c7ea17d3649bde5958b4dbf0858b3e504098c4102720151711;
        volume_id vo-RZu567qFVyfjg5aibyMFqC mounted at /workspace;
        created_at 2026-09-10T02:17:34.306929+00:00 with
        lifecycle_timeout_seconds 86400 and process_policy.lifecycle_lease_seconds
        86400. 86400 seconds from that acquisition elapses on 2026-09-11; today is
        2026-09-14, so the lease is expired by roughly three days.
      - >-
        dependencies.json: scientific_runtime_verified is false;
        runtime_lock_requirements carries exactly four entries, reproduced
