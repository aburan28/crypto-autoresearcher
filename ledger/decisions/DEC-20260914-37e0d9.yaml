      - >-
        orchestration/research-priority.yaml lists FROB in ecc_areas.
        RQ-FROB-7d8dd4.goal_ids is the empty list, H-FROB-73df22.goal_ids is
        null and its status is `proposed`, and a search of ledger/goals for
        RQ-FROB-7d8dd4, H-FROB-73df22 and EXP-FROB-d8aa37 returns no file.
    reported_by_session:
      - >-
        Frozen-source integrity: driver.py, checker.py, dependencies.json,
        implementation-report.json, and specification-stage0-v2.yaml hash-match
        the values recorded in trial-plan-stage0-v2.json and run-binding.json
        exactly, and the BATCH-2f8435 coordination tree and
        experiments/EXP-FROB-d8aa37/ are tracked and clean at HEAD bc6a1441b.
      - >-
        tools/research_dispatch.py --claims refs lists TASK-20260909-ece919 as a
        Ready Task with claim state queued_scope_free, the epoch-1 claim by
        executor-frob-stage0-2404fa having expired at 2026-09-11T02:25:07Z, and
        reports all 11 dispatch gates passing.
      - >-
        LEDGER POSTURE MEASURED TODAY, 2026-09-14, at HEAD bc6a1441b:
        tools/validate_ledger.py exits FAIL with 20 errors, NONE of them in the
