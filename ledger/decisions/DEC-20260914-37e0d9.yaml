  correction_of_an_earlier_reading_in_this_session:
    what_was_wrongly_treated_as_a_gate: >-
      Earlier in this session, the fact that the lock's source_snapshot_commit
      02c58ea5cc3efd98f69dc25c61c5feed34f5f04d and checked_public_head
      47112d40dc9963e7ee9f585de97aa6cf66043be1 are not ancestors of HEAD was read
      as a second launch blocker. THAT READING WAS WRONG AND IS CORRECTED HERE
      RATHER THAN QUIETLY DROPPED.
    why_it_is_not_a_gate: >-
      CLAUDE.md "Concurrency: many agents, many worktrees" states that archive
      receipts bind to CONTENT first: research_dispatch.py verifies path_sha256
      and treats commit reachability as advisory, verifying the declared hashes
      against the tree and reporting the archive as content-verified when a
      commit cannot be reached. The dispatch plan for this batch reports exactly
      that - "Archives verified on CONTENT only ... commit 02c58ea5cc3e is not an
      ancestor of HEAD (6 path hashes verified) ... expected state after a squash
      merge; see ledger/corrections/CORR-20260802-a1f151.yaml". A content
      mismatch would still be fatal; none is reported.
    root_cause_on_the_record: >-
      CORR-20260802-a1f151 documents the mechanism: a squash merge replaces a
      branch with one new commit, so every recorded branch sha becomes
      unreachable and every recorded parent becomes wrong, while every
      path_sha256 still matches the bytes. Its own words: "The receipts are not
      falsified - they were true when written - but they STOP VERIFYING the
      moment the branch merges", and "the BINDING TO CONTENT SURVIVES; what is
      destroyed is the binding to a verifiable commit."
    consequence: >-
      Commit reachability of 02c58ea5 / 47112d40 is NOT a precondition of launch
      and must not be re-raised as one. The successor artifacts specified below
      nonetheless record the ACTUAL commit the successor source_check observes,
      because a fresh check must report what it actually saw rather than inherit
      a stale value.

  superseded_for_launch_purposes_only:
    superseded_artifact: coordination/frobenius/BATCH-2f8435/admission/linux-runtime-lock.json
    superseded_artifact_sha256_as_pinned_by_run_binding: b85bd404150f49eab1a483661cd62eb9afff0f0d8e9f0522f7c7f4e0bc53d7b8
    scope_of_supersession: >-
      LAUNCH AUTHORITY ONLY. The existing lock remains an immutable, valid and
      unretracted record of the probes that were genuinely performed on
      sb-V5LqNGVIrrwLuNTxAaMX5Z on 2026-09-10, including its prior_probe_events
      list and its honest statement that aggregate RSS was never independently
      measured. It is not edited, not rewritten and not withdrawn as history.
      What it can no longer do is authorize a launch, for two independent
      reasons: it says so itself (scientific_launch_authorized false), and the
      runtime it pins no longer exists.
    successor_status: >-
      THE SUCCESSOR LOCK DOES NOT YET EXIST. This decision supersedes an existing
      artifact in favour of one that has not been written, which is deliberate
      and is stated plainly so no reader mistakes this record for authorization.
      Until the successor lock and the successor run-binding exist, are
      content-verified and are committed, stage0 is not launchable and
      TASK-20260909-ece919 stays queued.

  successor_lock_specification:
    purpose: >-
      Complete and mechanical. Every item below can be filled the moment a
      runtime exists, and nothing below may be filled before one does.
    file: coordination/frobenius/BATCH-2f8435/admission/linux-runtime-lock-successor-20260914-861bb9.json
    schema: frobenius.stage0.linux_runtime_lock.v1
    requirements_verbatim:
      note: >-
        The four entries of dependencies.json.runtime_lock_requirements,
        reproduced character for character. The successor lock discharges all
        four with actual observed values.
      items:
        - Actual Linux image digest and aggregate-memory protections
        - Actual Sage/Python resolved executable paths, SHA256 and versions
        - Successful adapter-compatible process-group and 8192 MiB RLIMIT_AS probes
        - Exact source/specification/trial-plan and claim binding before the sole future trial
    fields_the_successor_must_carry:
      identity_and_authority:
        - schema, set to frobenius.stage0.linux_runtime_lock.v1
        - recorded_at, the actual UTC instant the successor lock is written
        - authority, which is DEC-20260909-bf5b48 (the experiment approval) and DEC-20260914-37e0d9 (this successor admission decision)
        - experiment_id EXP-FROB-d8aa37, task_id TASK-20260909-ece919, run_id RUN-FROB-2404fa
        - scientific_runs_at_lock, which must be 0
        - >-
          supersedes, naming
          coordination/frobenius/BATCH-2f8435/admission/linux-runtime-lock.json
          and its pinned sha256
          b85bd404150f49eab1a483661cd62eb9afff0f0d8e9f0522f7c7f4e0bc53d7b8, with
          the reason recorded as expired lifecycle lease and destroyed sandbox /
          custody volume - an infrastructure fact, not a scientific one
      runtime_identity:
        - created_at of the new sandbox, as reported by the provider
        - sandbox_id of the new sandbox
        - image_id of the derived image actually used
        - >-
          base_oci_image, which must be exactly
          sagemath/sagemath@sha256:2401ffa8e9fc85c7ea17d3649bde5958b4dbf0858b3e504098c4102720151711;
          a different digest is a different runtime and requires a Coordinator
          decision before it may be locked
        - app_id, if the provider exposes one; null with a reason if it does not
        - volume_id and volume_name of the new custody volume
        - >-
          image_recipe, which must remain exactly the three declared steps -
          "pinned base OCI image", "USER root", "apt_install git python3-yaml" -
          with no package installation after the lock, per the existing lock's
          image_identity_boundary
        - configured_cpu and configured_memory_mib_min_max, the latter [8192, 8192]
        - lifecycle_timeout_seconds, the actual configured lease
        - scientific_runs, which must be 0 at lock time
        - >-
          scientific_launch_authorized, which is the field that must read true in
          the successor and which may be set true ONLY when every probe below
          returned the required value on the actual runtime
        - >-
          launch_authorization_expires_at, an explicit UTC instant equal to
          created_at plus lifecycle_timeout_seconds. THIS FIELD IS NEW AND IS
          REQUIRED. The present impediment exists precisely because the old lock
          stated a lease duration but no expiry instant, so an authorization that
          had already lapsed still read as current. A launch attempted after this
          instant is unauthorized and needs a further successor lock.
      probe:
        - sandbox_id, exit_code, stdout, stderr from the actual probe process
        - >-
          the probe stdout must report, as measured values: os and machine;
          python_version; python_path, python_path_realpath, python_path_sha256;
          sage_path, sage_path_realpath, sage_path_sha256; git_path,
          git_path_realpath, git_path_sha256; git_version; the yaml module
          version, path and sha256; the supervisor interpreter version,
          executable and executable sha256; and scientific_runs 0
        - >-
          guard_probe, a child process reporting sage_version (which must be
          "10.9"), pid, pgid establishing a real POSIX process group, and rlimit_as
          as the pair [8589934592, 8589934592]
        - >-
          cgroup readback of /sys/fs/cgroup/memory.max and /sys/fs/cgroup/cpu.max,
          recording the actual value or the actual error, never an assumed one
      source_check:
        - sandbox_id, exit_code, stdout, stderr from the actual in-sandbox check
        - repo path (/workspace/repo) and scientific_runs 0
        - >-
          source_sha256 for the four frozen sources - stage0/driver.py,
          stage0/checker.py, stage0/dependencies.json,
          stage0/implementation-report.json - recomputed inside the runtime and
          compared against
          d9e2d5945c44d90094aab05bcac1b303365a3e97d02ec6d230457a8aa1494410,
          d5a7427325e8ff0bed9f0871e088d0fc9626bc8cfdecf5235f16827c0bd315c2,
          1527cf1391b9a93e9961245c6484db1da9d9f43567e9eb2e15f4bcfdfb3a6f2d and
          200648b90f45e2a8cbcfe8fbcae84a52c447aa8264ff71d336da7b115a76f0e6
          respectively; any mismatch aborts the lock
        - >-
          specification_sha256, compared against
          209ee3e2803bb07f9e191b577ecb9452888bc2d5e8e589820f92bd162c56d9ed, and
          plan_sha256, compared against
          c67c6cd5d96065cdcd0d63e19a98f9d815a99f2ffff00e2ae11cd98314bcb8e1
        - head, the ACTUAL commit the in-runtime checkout resolves, and tracked_diff, the actual porcelain output
        - adapter_status, the actual adapter output showing required 1, output_validated 0, remaining 1, planned 1, measurement_complete false
      source_snapshot_commit_and_checked_public_head:
        - >-
          source_snapshot_commit and checked_public_head recorded as ACTUALLY
          OBSERVED by the successor source_check. They must not be copied from
          02c58ea5cc3efd98f69dc25c61c5feed34f5f04d or
          47112d40dc9963e7ee9f585de97aa6cf66043be1. Per the correction block
          above, their ancestry relative to any later HEAD is advisory and is not
          a gate; what is required is that they be true of the runtime that will
          execute.
      image_identity_boundary:
        - >-
          a prose statement of the same boundary the existing lock draws: the base
          OCI digest pins the Sage filesystem, the derived provider image id is
          not an OCI digest, and no package installation is permitted after the
          lock
      aggregate_memory_guard:
        - configured provider memory min/max, which must be [8192, 8192]
        - >-
          measurement, an honest statement of what was and was not independently
          measured. The existing lock's honesty here is the standard to meet, not
          to improve on rhetorically: it recorded that cgroup files were not
          exposed and that aggregate RSS was not independently measured. If the
          new runtime exposes cgroup limits, record the read value; if it does
          not, say so in the same terms.
      per_process_guard:
        - >-
          the observed child soft/hard RLIMIT_AS, which must be
          [8589934592, 8589934592], recorded with the same explicit caveat that a
          per-process limit is not advertised as aggregate RSS protection
      process_policy:
        - scientific_workers, which must be 1
        - driver_and_checker, sequential adapter-managed process groups
        - detached_children_allowed, which must be false
        - supervisor, the actual resolved supervisor interpreter path
        - argv_prefix, which must be "sage -python", matching the frozen trial plan argv
        - lifecycle_lease_seconds, the actual lease
        - >-
          lease_boundary, restating that the lease is an owned cloud runtime
          lifecycle rather than a changed scientific sample or a watchdog, and
          that infrastructure expiry before completion preserves available
          artifacts and is classified as an operational interruption with no
          hypothesis conclusion and no same-ID retry
      custody:
        - volume_id of the new custody volume
        - mount, which must be /workspace, and repo, which must be /workspace/repo
        - >-
          output_root, which must be
          /workspace/repo/experiments/EXP-FROB-d8aa37/runs/RUN-FROB-2404fa
        - >-
          retrieval, restating the rule that exact existing bytes are retrieved
          while the sandbox is alive, all remote and local sha256 compared, then
          archived, with failures preserved and missing files never synthesized
      executor_runtime_provenance:
        - >-
          requested policy executor-implementation, the configured and resolved
          model identifiers, model_verified, fallback_used and
          degraded_requirements, recorded truthfully. An unexposed serving
          identity is recorded as null with a provenance note, exactly as the
          existing lock does; it is never guessed.
      prior_probe_events:
        - >-
          a list of the probe attempts actually made during provisioning, each
          with its kind and scientific_runs 0, in the style of the existing
          lock's six entries. Failed attempts are retained, not pruned.
    successor_run_binding:
      file: coordination/frobenius/BATCH-2f8435/admission/run-binding-successor-20260914-861bb9.json
      why_required: >-
        run-binding.json pins runtime_lock_sha256
        b85bd404150f49eab1a483661cd62eb9afff0f0d8e9f0522f7c7f4e0bc53d7b8. A new
        lock file has a different sha256 by construction, so the existing binding
        cannot bind it and must not be edited to try. A successor binding is
        therefore required alongside the successor lock.
      must_carry:
        - schema frobenius.stage0.derived_execution_binding.v1
        - authority DEC-20260909-bf5b48 and DEC-20260914-37e0d9
        - task_id TASK-20260909-ece919, experiment_id EXP-FROB-d8aa37
        - >-
          runtime_lock_sha256 equal to the sha256 of the successor lock file as
          actually written, and runtime_lock naming that successor path
        - >-
          supersedes, naming
          coordination/frobenius/BATCH-2f8435/admission/run-binding.json and
          stating that the earlier binding is preserved unedited
        - >-
          plan_sha256 c67c6cd5d96065cdcd0d63e19a98f9d815a99f2ffff00e2ae11cd98314bcb8e1,
          specification_sha256
          209ee3e2803bb07f9e191b577ecb9452888bc2d5e8e589820f92bd162c56d9ed, and
          the same four source_sha256 entries, re-verified rather than copied
        - >-
          canonical_initial_handoff naming ledger/handoffs/TASK-20260909-ece919.yaml
          with sha256 2e3b6508d18b705cec54d9abe1f0e9f256596a8f5e2a1307cd17f3799d46c887
