  outcome: >-
    MIXED OUTCOME, both arms independently validated with zero
    discrepancies:

    (i) ARM 1 (ec54fe Stage 0): F1 FIRES -- the idea record's census
    object T = M5^-1 Z_{CW[0]} M5 is a derivation defect and all its
    readings are void. The archived anchor object reproduces exactly
    under fresh code (ranks 32,0,0,0; D5*M5 = I128 both directions;
    q0^q1 = p0^p1 and W = 4-|A| on 100% of keyed trials), while the
    record's census object ranks 32,32,32,32 with P(W>=1) = 2^-32,
    contradicting the required anchor values; the producer halted at
    run 1 per the record's own blocking rule, before any non-anchor
    cell and before the fixture arm. Divergence localized to the
    proposal's P1 (the harness pair-difference map in the affine limit
    is the identity; the zero-mask census object describes no
    instrument quantity). Per rule 5 this is NOT evidence against the
    affine-skeleton mechanism -- the mechanism question is untouched.

    (ii) ARM 2 (02f7c4 B4): C4 PASS with a preregistered vacuous-power
    disclosure. Signed W>=1 delta (OFF - ON) = 0 = trivial-trial count
    exactly on both arms at full 2^30 (AES r=5: hits 14 on both builds,
    identical committed indices; fresh-key SipRound-Feistel null object:
    hit [1, 270788492] on both builds); trial-by-trial set identity
    verified. Bonus integrity result: the ENABLED builds reproduce the
    committed immutable receipts L1-AES-R5-P30 (14 hits) and
    M1-FF-P30 (1 hit) field-exact, and the build-pair diff is exactly
    one #define line -- the exclusion logic changes no count at the
    tested exposure and its arithmetic is verified by signed delta,
    not code reading alone. The nonzero-delta path of C4 is vacuous at
    2^30 (expected T ~ 0.25/arm, zero realized) and is disclosed, not
    absorbed.

    Composed with EV-AES-5478a0 and its predecessors: the five
    substitute/geometry exclusions stand (arm 2 reconfirmed the hit
    counts they rest on), the pipeline's exclusion logic is now
    audit-verified in the zero regime, and the geometry-driven route to
    the mechanism question needs a REPAIRED census object before its
    next probe.

  rationale:
    - >-
      Both arms returned their preregistered outcomes under their own
      decision rules; the validator independently reproduced every
      number from raw data (anchor rank sets in fresh sparse GF(2)
      code, B4 deltas trial-by-trial from raw receipts, receipt
      reproduction field-exact); the close is the mechanical recording
      of committed results, not a new judgement.
    - >-
      The F1 arm is recorded as invalid_measurement / derivation defect
      per the idea record's own classification and rule 5: a halt
      caused by a defect in the proposal's derived object is not
      evidence against the mechanism the object was meant to probe.
      The producer's localization supplies the repair route
      (identity-map census or redefined one-sided statistic), which the
      next_action schedules as a successor proposal rather than ad-hoc
      improvisation (inventor protocol).
    - >-
      The B4 arm is recorded as a pipeline-defence result only. Its
      power over the nonzero-delta path is vacuous at 2^30 by
      construction (zero trivial trials realized); that disclosure is
      carried in EV-AES-64750e's strength_basis and unresolved
      confounds, not absorbed.

  next_action: >-
    RANK 1: A REPAIRED-CENSUS SUCCESSOR PROPOSAL for IDEA-20260901-ec54fe.
    Stage 0's F1 outcome supplies a concrete repair route (producer
    localization: the harness pair-difference map in the affine limit is
    the identity, so the census must be rebuilt on the identity-map
    object or a redefined one-sided statistic; the keep-mask variant is
    also void at the anchor). Per the inventor protocol this must be a
    NEW falsifiable proposal (mechanism, predictions, test boundary,
    falsification criteria, preregistered anchor check) dispatched
    through idea-generator, not an ad-hoc edit of the voided object; the
    idea record and EV-AES-64750e OBS-B803-1 are its inputs. RANK 2:
    IDEA-20260901-02f7c4 battery arms B1-B3 (the remaining pipeline
    defences), now that B4 verified the exclusion arithmetic; B1-B3 were
    deferred by DEC-20260901-b6b959, not abandoned. RANK 3:
    IDEA-20260901-69912d (layer autopsy) -- its stage 0 consumes the
    census output and therefore WAITS for the repaired census from
    RANK 1. RANK 4: IDEA-20260901-bcb117 (nonlinearity dilution ramp),
    same dependency on a working census. RANK 5: the decay-specific
    design (much larger exposure on low-r variants) if flat absence vs
    slow decay within the RC-D family ever needs distinguishing
    (EV-AES-5478a0 confound 2). RANK 6: BATCH-6fe3c2's ledger-archive
    debt (TASK-20260806-ccfd8b, DEC-20260806-435a43 missing), separate
