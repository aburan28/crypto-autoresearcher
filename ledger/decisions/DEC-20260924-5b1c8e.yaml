      W_4 qualifier of the primary metric is not certificate-backed (R-8). The
      two checks that can see a wrong-but-self-consistent implementation are
      the author-independent verifier and the blind re-derivation; both are
      load-bearing here.
    - >-
      JOINT DESIGN. Admissibility: J1 (verifier), J2, J3 (validator), J6
      (comparator). Recomputation: J4 (validator). Reading: J7, J8, J10 and
      the proves-too-much control J9 (red team). The blind re-derivation J5 is
      a separate session with the widest blind_from. Each joint has exactly
      one owner. The verifier and the re-deriver are separate sessions because
      the verifier must read the claimed refutations and the re-deriver must
      not.
    - >-
      TIER. Review-adversarial with the plan's tripwire. Nothing here closes a
      lane; E-G is a competing explanation inside C1, not a hypothesis record,
      so no reject_scoped is in view.
    - >-
      TARGET-PROFILE HONESTY. Toy tier, sota_delta zero, oracle A and parallel
      rho dominate. The round is sized to the decisions it feeds (NA-5's n = 19
      gate and the CERTBIN rerank), not to any cost claim.
    - >-
      CONCURRENCY (machine protection). Reviewers are capped at 3 GB each. If
      another CERTBIN executor (EXP-CERTBIN-3f06d1 or EXP-CERTBIN-a58c63) is
      still running, run at most two of the four first-wave reviewers at once,
