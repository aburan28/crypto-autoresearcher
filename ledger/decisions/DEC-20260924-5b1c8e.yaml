    - id: R-4
      concerns: Deviations 5 and 6 (C-VERIFIER construction agreement computed by the verifier from the engine's E_hex; negative controls built from one closure/set kind).
      ruling: >-
        DOES NOT VOID. It WEAKENS C-VERIFIER, which is exactly why J1 exists:
        J1 builds its own negative controls for every (closure, set) kind and
        its own construction.
    - id: R-5
      concerns: >-
        Deviation 7 (oracles written fresh rather than copied), deviation 8 (W_5
        selection on engine-reported outcomes), deviation 9 (checkpoint skip),
        the development runs outside the repository, and EX-10 (same author for
        engine and verifier).
      ruling: NONE VOIDS THE RUN. Each is owned by a joint and limits it as stated.
      basis_and_limits:
        - >-
          Oracles (dev 7): the copy permission covered four modules only, so
          writing oracles fresh was the permitted path. Their correctness
          rests on C-ORACLE comparing against ARCHIVED s and stratum (J2
          checks the comparison is against archived values) and on J5's two
          routes to s.
        - >-
          W_5 selection (dev 8): the selection rule is deterministic given
          outcomes; J3 checks mechanically that it equals the selection the
          verified outcomes imply.
        - >-
          Development runs: they exposed a few instance outcomes to the
          executor before the official run. Sets, thresholds, decision rules
          and the closure definition are frozen by the specification, so no
          selection or threshold could move; the post-dev code changes are
          disclosed (manifest writer, negative-control caching, self-test
          coverage). The scratch outputs are not archived and not readable by
          any reviewer; the ordering is unauditable from archived bytes and is
          mitigated, not eliminated, by J3 and by J5's full-U62 re-derivation.
          Archiving them now would widen a write scope after the fact.
        - >-
          Same author (EX-10): disclosed as required. The run's own
          verification is code-independent only; the author-independent
          verification is J1.
    - id: R-6
      concerns: E-1 and the 265ae64 manifest_v2 supersession.
      ruling: >-
        RATIFY THE CONTENT and BIND BY HASH. The supersession is additive and,
        per its registry note, changes schema keys only (run.code.commit,
        run.code.dirty, run.code.command, result.certificate.kind none). It was
        announced in the e27f93 receipt E-1 and committed in the next commit
        (265ae64), which no receipt covers. TASK-20260924-a4f217 binds
        manifest_v2.yaml and tools/run_supersession_registry.yaml by sha256
        under prior_commit_bindings without re-staging them, and asserts that
        manifest_v2.yaml's sha256 equals the registry's superseding_sha256 and
        that manifest.yaml equals the e27f93 receipt.
      limits:
        - >-
          result.certificate.kind none is the schema's value for "no DLP or
          decomposition certificate"; it does not deny the refutation
          certificates, which are verified separately (J1). An evidence record
          must not read it as "uncertified".
        - If J3's YAML-level diff finds any other changed key, the ratification lapses and a superseding supersession is written; the file is never edited.
    - id: R-7
      concerns: E-2 and E-3.
      ruling: >-
        DOES NOT VOID OR LIMIT. implementation.md and the dirty-tree bytes are
        bound by the e27f93 receipt's path_sha256, which is the content-first
        binding. implementation.md is PRODUCER NARRATIVE written after phase 7;
        reviewers weigh it as such, and it is in the blind re-deriver's
        blind_from.
    - id: R-8
      concerns: >-
        A DESIGN GAP IN THE FROZEN CERTIFICATE FORMAT, found by this
        Coordinator while writing the plan. The contract is this
        Coordinator's own (DEC-20260924-8e2f47).
      finding: >-
        The specification's certificate is a flat set C of pairs (mu, k) with
        sum mu*f_k = 1. For a W_4 refutation, the back-traced multipliers
        carry the pushed variables, so C proves unsatisfiability and
        membership of 1 in rowspace(M_{2 + max deg mu}), but NOT that the
        derivation stays inside W_4 (every intermediate of degree <= 4). At
        D = 4, W^(1) is contained in rowspace(M_5) (v_j * mu * f_k =
        (v_j mu) * f_k in B, deg(v_j mu) <= 3), so a W_4 refutation reached at
        iteration 1 has a certificate indistinguishable from an M_5
        certificate. MR1 counts "VERIFIED certificate for 1 in W_4": the
        VERIFIED part is certificate-backed; the W_4 part rests on the
        engine. RC1-DR-1 (E-A against E-G) is a statement about W_4.
      ruling: >-
        NO PROTOCOL AMENDMENT (none may be written after data). MR1 and
        RC1-DR-1 are recomputed exactly as frozen (J4). The review adds
        degree-disciplined W-certificates as VERIFICATION artifacts: the blind
        re-deriver emits one for every instance it finds refuted at W_4 (J5),
        and the comparator checks each (J6). The evidence record states, per
        the composition rule, on which instances MR1 is W_4-certified and on
        which it is engine-reported. Any successor contract that counts W_D
        refutations requires a straight-line (DAG) certificate with a degree
        bound per node, as the specification already permitted as a fallback.
      proof_status: derivation, written in the review plan (prior on J7 (a)); checked by J7. Not yet reviewed.
    - id: R-9
      concerns: >-
        Whether the two anomalies are joints in their own right: (A) the M_5
        refutations of the null sets together with their W_4 = M_4 fixpoint
        behaviour (implementation.md "Unexpected or noteworthy observations",
        bullet 4); (B) the first-iteration pattern of W_4 on U62 (bullet 1)
        and its certificate degree (bullet 3).
      ruling: BOTH ARE JOINTS. (B) is J7; (A) is J8. Neither is folded into the scope joint J10.
      basis:
        - >-
          (B) is where the only non-certified part of the primary metric lives
          (R-8): a W_4 engine that silently computed a larger closure would
          show exactly the pattern that bullets 1 and 3 record.
          It also carries the mechanism question E-A was written to answer
          (does ell alone explain it). A joint with a worked substitution
          attack can break it; a scope reading cannot.
        - >-
          (A) decides two things no other joint owns: whether the nulls are
          like-for-like controls under every closure (RC1-DR-4's premise), and
          whether the D <= 5 label of RC1-DR-2 carries any S_3-specific
          content, which is the premise of DEC-20260923-f25b97 NA-5. The null
          sets' W_4 = M_4 behaviour is also the in-run evidence that the
          engine's W_4 is not a disguised M_5; that evidence deserves an owner
          who can attack it.
        - >-
          Neither anomaly is evidence yet. Both are preserved as recorded
          (agents/coordinator.md prohibitions) and assigned before any reviewer
          runs.
    - id: R-10
      concerns: Blind re-derivation scope and outcome hygiene.
      ruling: >-
        The re-derivation covers all 62 U62 instances (the specification's
        minimum is 10) plus 35 controls (review plan PD-R4), from inputs
        extracted by a rule fixed in the plan before extraction. Protected
        literals are supplied OUT OF BAND in this Coordinator's return message
        and never written to any file; TASK-20260924-a4f217 writes only their
        sha256.
      false_positive_rule: >-
        PRE-AUTHORIZED, mechanical. A --blind-history match of a protected
        literal is a FALSE POSITIVE, and cannot carry an RC-1 outcome, iff
        EVERY matching commit either (a) is an ancestor of
        ec215577869db85c5cae7980ae230349c257ea29, the HEAD at every executor
        invocation (implementation.md) (git merge-base
        --is-ancestor), so it predates every RC-1 output; or (b) touches no
        path whose name contains "CERTBIN" or "certbin" (git show
        --name-only). The archive then removes that item from the protected
        set, records it under blind_phase_hygiene.removed as {label, commits,
        by: "DEC-20260924-5b1c8e R-10"} (never the value or its digest),
        re-runs the check, and proceeds. Any other match is a STOP: the
        re-deriver does not run on that history until the Coordinator
        decides. This avoids a CORR-20260923-7c14d9-style correction for an
        innocent collision and keeps a real leak fatal. Because a removal's
        commit list can let a reader infer the value, the hygiene file is in
        the re-deriver's blind_from.

  rationale:
    - >-
      WHY A FULL ROUND. The primary verdicts are exact and every primary count
      sits at a floor or ceiling, so agreement between the run and its own
