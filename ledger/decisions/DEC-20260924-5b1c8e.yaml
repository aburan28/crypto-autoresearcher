  rulings:
    - id: R-1
      concerns: Deviation 1. Semi-naive W_D iteration, claimed exact.
      ruling: DOES NOT VOID. Accepted as disclosed, not as correct. Owned by J2.
      basis: >-
        The Coordinator's own reading of the argument agrees with the claim
        (review plan, prior on J2): the rows whose low-degree lead is new at
        iteration k, as they stood at k, have distinct leading monomials across
        all k and so form a basis of W^(i) cap B_{<=D-1}; products of older
        ones were added earlier; iteration 1 is identical under both rules by
        construction. W_D is a least fixpoint, so "1 in W_D" does not depend on
        the iteration schedule at all; only the per-iteration records could.
      limits:
