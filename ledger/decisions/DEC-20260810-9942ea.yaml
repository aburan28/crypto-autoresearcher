    be dishonest for the DEC prefix even where it is unchecked. They are
    reserved, not targeted, and an unused reservation is not a retracted claim.
    (ii) The ten TASK identifiers are also absent, because their ledger handoff
    records under ledger/handoffs/ are written by a SECOND PASS and do not exist
