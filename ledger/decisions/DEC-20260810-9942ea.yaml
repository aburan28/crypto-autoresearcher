    - TASK-20260810-23e0ea
    - TASK-20260810-b9d956
    - TASK-20260810-ccfeb4

  what_is_approved:
    - >-
      RANK 1, first in time because the ordering cannot be recovered later:
      TASK-20260810-26d0d5 authors BCP-1, the frozen blind-calibration scoring
      protocol, and TASK-20260810-927ab5 commits it BEFORE either producer runs.
    - >-
      RANK 2: TASK-20260810-3e0793 pins TWO independent RFC 1321 implementations
      and validates BOTH against the published test vectors, the second existing
      so that a collision certificate can be re-verified by code that did not
