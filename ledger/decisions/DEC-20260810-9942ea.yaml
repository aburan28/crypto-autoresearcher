    - >-
      RANK 3: TASK-20260810-bde128 acquires the preimage literature and one
      published MD5 collision path in primary text, files them as KN-LIT at
      stated provenance levels with the path payload quarantined under BCP-1's
      marker, and settles against text the apparent error RQ-MDFIVE-6870c1 flags
      in its own provenance block.
    - >-
      The standard chain: three isolated snapshot archives, an independent
      validation pass, an independent red-team pass whose target is BCP-1 itself,
      and exactly one isolated ledger archive carrying EV-MDFIVE-1d470b and
      DEC-20260810-1163ec.
    - >-
      Batch wall clock 3300 s, split line by line across the ten tasks and
      summing to 3300 exactly, at max_concurrent 2.

  what_is_expressly_not_approved:
    - >-
      THE BLIND CALIBRATION SEARCH ITSELF. It is not in this batch under any
      budget, because its protocol is not committed until this batch commits it,
      and a gate uncommitted when its card is issued is retroactive enforcement.
    - any collision generation, identical-prefix or chosen-prefix
    - any preimage, MITM or biclique work, any method-ceiling or obstruction statement
    - the MD4 control, which belongs to the ceiling audit and not to this gate
    - any change to campaign_budget, which is a separate decision on its own merits

  # ===================================================================
  # RULING 1. THE CONTAMINATION FIREWALL, AND WHY RANK 1 OUTRANKS RANK 3.
  # ===================================================================
  ruling_1_contamination_firewall:
    the_conflict: >-
      RQ-MDFIVE-6870c1 contains two constraints that pull against each other, and
      naming the tension now is better than discovering it mid-campaign.
      Constraint 1 requires a published MD5 collision path to be FILED AS KN-LIT
      before any experiment is designed. Constraint 3 requires the calibration to
      be scored BLIND and rules a consuming run `invalid`. A KN-LIT entry is
      corpus material reachable by search_knowledge. Discharging constraint 1 in
      the obvious way therefore makes constraint 3 unfalsifiable after the fact,
      because no later evidence can distinguish rediscovery from retrieval.
    why_ordering_is_the_whole_argument: >-
      BLINDNESS IS A PROPERTY OF THE INFORMATION STATE AT RUN TIME, AND
      INFORMATION STATES ARE MONOTONE. A corpus can gain the published path; it
      can never un-learn it. So a protocol written after the acquisition cannot
      restore the prior state - it can only ASSERT blindness, and an assertion
      that no evidence could contradict is not a protocol. Concretely: it is
      BCP-1 that defines the quarantine marker TASK-20260810-bde128 must apply,
      so in the other order the entry is filed unmarked and the marker has
      nothing to attach to. This is why TASK-20260810-3e0793 and
      TASK-20260810-bde128 depend on TASK-20260810-927ab5, the SNAPSHOT, rather
      than on TASK-20260810-26d0d5, the authoring task: the requirement is that
      BCP-1 be COMMITTED, not merely written.
    what_the_firewall_must_contain:
      - >-
        SPLIT THE ENTRY FROM ITS PAYLOAD. The collision-path KN-LIT entry carries
        bibliography, provenance level and what the source claims, and no path
        data - no differential characteristic, no message-block values, no
        colliding pair. That is corpus-safe and is what the acquisition gate
        actually needs.
      - >-
        QUARANTINE THE PAYLOAD at coordination/goals/GOAL-MD5-001/quarantine/,
        referenced from the KN-LIT entry BY SHA256 ONLY, with BCP-1 declaring that
        path excluded from corpus staging.
      - >-
        PRE-REGISTER THE ANSWER AS A DIGEST, NEVER AS THE ANSWER. A digest scores
        a result without carrying one, so the scoring artifact is not itself a
        leak.
      - >-
        GIVE THE SOLVER A CLOSED, HASH-MANIFESTED INPUT SET whose complete sha256
        manifest is recorded in the run manifest.
    what_is_checked_versus_what_is_merely_declared: >-
      THE HONEST ANSWER IS THAT READ-SCOPE ALONE IS NOT SUFFICIENT, and BCP-1 must
      say so rather than imply otherwise. A task card's read_scope is a
      Coordinator declaration that no runtime here enforces for READS - AGENTS.md
      records that api_direct refuses writes outside scope and restricts
      commands, and says nothing equivalent about reads, and this runtime enforces
      neither. A reader auditing a finished run cannot tell from read_scope
      whether a file was opened. The closed input manifest is the one element that
      is CHECKED rather than asserted: it either contains the quarantined digest
      or it does not. The quarantine marker is a declaration plus a digest, not
      an access control, and is recorded as such.
    invalidity_conditions_bcp_1_must_enumerate:
      - >-
        no input manifest, or one that does not cover every file the solver could
        read
      - >-
        the quarantined payload's digest appears in the input manifest - this is
        consumption, and it is `invalid` rather than a weaker pass
      - >-
        any declared-before-run field - encoding, solver identity and version,
        seed, wall-clock ceiling - absent, or altered after the run began
      - >-
        the encoding was authored in a session that had read the quarantined
        payload, per the required encoding-provenance declaration
    residual_risk_that_cannot_be_eliminated: >-
      MODEL PRIOR KNOWLEDGE, AND IT IS IRREDUCIBLE IN THIS PROGRAM. Published MD5
      collision paths have been in the public record for two decades and are
      therefore in the training data of any model this harness can resolve. The
      contaminated channel is the model's parameters, and no read scope, input
      manifest, quarantine marker or file-system arrangement reaches it. THE
      CONSEQUENCE IS AN EVIDENTIAL ASYMMETRY THAT MUST BE CARRIED RATHER THAN
      SOLVED: a calibration FAILURE is a clean statement about the instrument,
      since recall could only have helped, while a calibration SUCCESS is
      confounded by prior exposure and can never be fully de-confounded here.
      That is an independent reason the goal's own completion criterion is right
      to call the failure outcome the more important one. The only discriminator
      available is a null-object control in the sense of
      docs/inventor-protocol.md - the identical instrument, at the identical
      budget, against a shape-matched MD5 variant with permuted round constants or
      message schedule, where structure is nearly preserved and recall is
      worthless. BCP-1 specifies that control. This batch does not run it and
      claims nothing from it, and TASK-20260810-b9d956 is directed to attack
      whether the control is informative at all or whether permuting the
      constants also destroys the structure the search needs.

  # ===================================================================
  # RULING 2. CLAIM CEILING.
  # ===================================================================
  ruling_2_claim_ceiling: >-
    protocol_freeze_implementation_pin_and_literature_acquisition_only. This
    batch freezes a scoring protocol, pins and test-vector-validates two
    implementations, and files literature. RQ-MDFIVE-6870c1's claim_tier_ceiling
    already rules that instrument-calibration results carry NO CRYPTANALYTIC
    CONTENT AT ALL; this batch does not even reach a calibration result. No
    collision certificate, no preimage statement, no complexity figure, no method
    ceiling, no obstruction, and no comparison against any published result in
    either direction is in scope. The throughput datum TASK-20260810-3e0793
    produces is an engineering measurement of this machine under this toolchain
    and is expressly not a prediction of attack cost.

  # ===================================================================
  # RULING 3. THE CAMPAIGN BUDGET. OBSERVED, NOT CHANGED.
  # ===================================================================
  ruling_3_campaign_budget_observation:
    action_taken: >-
      NONE. campaign_budget stays exactly as committed - maximum_batches 6,
      total_wall_clock_seconds 10800, max_concurrent 3. This is an observation
      recorded for the decision that will have to adjudicate it.
    judgement: >-
      INADEQUATE FOR THE COMPLETION CRITERIA AS WRITTEN, AND NOT MARGINALLY SO.
      This batch contains zero cryptanalysis and still draws 3300 s - 30.6% of
      the entire campaign - and it is structurally the cheapest kind of batch this
      goal will run. That leaves 7500 s for five batches which must together
      carry a blind characteristic search, an identical-prefix collision, a
      CHOSEN-PREFIX collision, the MITM ceiling audit and the MD4 control, each
      with its own reviews and archives. Split evenly that is 1500 s per batch to
      cover coordination, one producer, two reviews and an archive; in this batch
      the non-producer lines alone are 2400 of 3300 s. The compute residual per
      later batch is a few hundred seconds.
    the_structural_argument_behind_it: >-
      STATED WITHOUT QUOTING ANY LITERATURE FIGURE, because no cost figure for any
      of these attacks has been read in primary text by this program and quoting a
      recalled one as authority would be fabrication in either direction. Three
      orderings hold by construction and need no citation. (i) Generating a
      collision by EXECUTING a published path is strictly cheaper than
      REDISCOVERING that path by automated search, since the second must find what
      the first is handed. (ii) A chosen-prefix collision is strictly more
      expensive than an identical-prefix one, since it must additionally reconcile
      two arbitrary prefixes through a birthday phase and multiple near-collision
      blocks. (iii) The goal's first completion criterion asks for the EXPENSIVE
      member of ordering (i) and its second asks for BOTH members of ordering
      (ii). The budget is consistent with having been sized against the cheap
      readings of both.
    the_deeper_point: >-
      ADEQUACY IS CURRENTLY UNDEFINED RATHER THAN MERELY DISPUTED, because the
      charging convention is not fixed. Under authoring-inclusive session-elapsed
      charging, which this program's AES lane uses, 10800 s is roughly three
      coordinator sessions and cannot cover six batches with reviews at all. Under
      compute-only charging it is more plausible, but then coordination is
      uncharged and 10800 s is not a real ceiling. Fixing that convention is one
      of BCP-1's required elements in this batch, which is what turns this
      observation into something a later decision can actually adjudicate.
    what_would_have_to_change_named_but_not_enacted:
      - >-
        Raise total_wall_clock_seconds against a MEASURED sizing basis.
        TASK-20260810-3e0793 produces the first such datum - hash throughput on
        the pinned implementations.
      - >-
        Or split completion criterion 1 into its two genuinely different asks -
        "execute a published path to a literal pair" and "rediscover a path blind"
        - and decide explicitly which the campaign buys. They differ by orders of
        magnitude and are currently one bullet.
      - >-
        Or accept at campaign close that the chosen-prefix criterion is OPEN AND
        UNATTEMPTED and record it as such. Under AGENTS.md rules 5 and 8 that is
        an honest outcome; recording it as tested or as negative would not be.
    why_not_acted_on_here: >-
      A budget change is a decision on its own merits and needs the throughput
      datum this batch has not yet produced. Amending it now would replace one
      declared number with another declared number and call the second one
      evidence.

  # ===================================================================
  # RULING 4. WHAT THE FIVE DEPENDENT GOALS ARE ACTUALLY WAITING FOR.
  # ===================================================================
  ruling_4_dependent_goals:
    what_the_goal_head_says: >-
      GOAL-MD5-001 next_action states that this goal runs first in the 2026-08-09
      symmetric set and the others WAIT ON ITS FIRST BATCH, and its
      non_duplication block makes this goal the owner of instrument calibration
      for the whole symmetric lane.
    the_dependency_stated_concretely: >-
      NARROWER THAN "WAIT FOR MD5", AND WORTH STATING EXACTLY SO THAT FIVE
      CAMPAIGNS ARE NOT BLOCKED LONGER THAN THE EVIDENCE REQUIRES. What the
      dependent goals need from THIS batch is BCP-1 - the scoring protocol, the
      charging convention, the certificate format and the invalidity conditions -
      because those are what make any calibration claim checkable. What they need
      from a LATER batch is the calibration verdict itself. The two are separable.
      GOAL-SHA2-001, GOAL-SHA3-001, GOAL-BLAKE-001, GOAL-ASCON-001 and
      GOAL-SIMSPK-001 are unblocked for protocol and setup work once
      TASK-20260810-927ab5 commits BCP-1, and remain blocked from asserting
      anything ABOUT THEIR INSTRUMENT until the calibration verdict exists.
    what_this_decision_does_not_do_to_them: >-
      It changes no status, budget, scope, priority or next_action of any of those
      five goals, or of GOAL-SHA1-001 or GOAL-RSA-001, and it is not itself the
      act that rewrites GOAL-MD5-001's own head. BCP-1's charging convention is
      authored in a form those goals CAN adopt and binds none of them; adoption is
      each goal's own Coordinator decision. GOAL-MD5-001's second completion
      criterion names GOAL-SHA1-001 and GOAL-RSA-001 as sharing that convention,
      and this decision treats that as a DESIGN REQUIREMENT ON BCP-1, not as an
      assertion that either goal has adopted anything.

  rationale:
    - >-
      A DRAFT GOAL WITH NO BATCH IS NOT A NEUTRAL STATE, and this one blocks five
      others by its own head's declaration. Opening it in the ranked shape that
      head specifies is the action it asks for, taken without re-scoping,
      re-budgeting or re-ranking anything.
    - >-
      THE ORDER IS FORCED, NOT PREFERRED. The blindness requirement is only
      enforceable against an information state that has not yet been
      contaminated, and RANK 3 contaminates it deliberately. Any other ordering
      makes the campaign's central requirement unfalsifiable, and an
      unfalsifiable requirement is worse than an absent one because it looks like
      a safeguard.
    - >-
      TWO IMPLEMENTATIONS IS A REQUIREMENT, NOT A LUXURY. RQ-MDFIVE-6870c1 makes
      independent re-verification part of what a collision certificate IS. A
      certificate re-verified by the code that produced it is not re-verified,
      and two builds of one source are not two implementations - which is why the
      validator is directed to challenge the independence claim concretely rather
      than inherit it.
    - >-
      THE RED TEAM IS POINTED AT BCP-1 ITSELF AND NOT AT MD5. A protocol that
      fails before any calibration runs costs one review; the same protocol
      failing afterwards invalidates the calibration and everything five
      dependent goals priced on it. The cheap version of that discovery is the
      valuable one.
    - >-
      max_concurrent IS 2 RATHER THAN THE CAMPAIGN'S 3 BECAUSE ONLY TWO TASKS ARE
      MEANT TO RUN TOGETHER. TASK-20260810-b9d956 becomes eligible once BCP-1 is
      committed and could otherwise be scheduled alongside the producers; the cap
      is what prevents that. Declaring headroom a batch does not intend to use
      misreports the queue.
    - >-
      NOTHING IN THIS BATCH CAN PRODUCE AN OVERCLAIM ABOUT MD5, BY CONSTRUCTION.
      No task runs a search, generates a collision, or touches a preimage method.
      The one measurement admitted is a hash throughput, declared in advance as an
      engineering datum about this machine.
    - >-
      PREMATURE CLOSURE IS A FAILURE MODE SYMMETRIC WITH OVERCLAIMING. The
      standing view that MD5 is exhausted is, under docs/inventor-protocol.md, a
      hypothesis about the search rather than a fact about the primitive. This
      batch neither adopts it nor argues against it; it builds the instrument that
      would let a later batch say something checkable either way.

  evidence_refs:
    - ledger/goals/GOAL-MD5-001.yaml
    - ledger/questions/RQ-MDFIVE-6870c1.yaml
    - coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/batch.yaml
    - coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/dispatch_queue.json
    - AGENTS.md
    - docs/claims-and-verification.md
    - docs/inventor-protocol.md
    - coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/dispatch_queue.json

  evidence_refs_note: >-
    EVERY ENTRY IS CITED FOR WHAT IT IS. No run record, evidence record or
    knowledge entry supports any conclusion here, because this decision draws
    none. The GOAL-AES-002 queue is cited ONLY as a render-verified structural
    template for the dispatch-queue schema; nothing about AES, its cost model,
    its findings or its claims is relied on, adopted, or referenced in substance.
    RQ-MDFIVE-6870c1 is cited for its constraints and claim ceiling, which bind
    this batch; its `provenance` block is cited only as the description of an
    UNVERIFIED web-search excerpt, and no figure in it - the ~2^123.4 preimage
    complexity, the paper titles, or the excerpt calling the 2009 result the
    first practical preimage attack - is used here as authority in either
    direction. The RQ's own flag that "first practical preimage attack" is an
    APPARENT ERROR is preserved unchanged and is left for TASK-20260810-bde128 to
    settle against primary text.

  hypothesis_status_transition:
    hypothesis_id: null
    changed: false
    reason: >-
      GOAL-MD5-001 has no active hypothesis and this act creates none. A gate
      batch that freezes a protocol and pins an implementation produces no
      falsifiable claim about MD5 and must not be dressed as one.

  goal_status_transition:
    from: draft
    to: draft
    changed: false
    reason: >-
      Opening a batch is not a status change, and this act deliberately does not
      touch ledger/goals/GOAL-MD5-001.yaml at all - its status is still `draft`,
      its current_batch_id still null, its dispatch_queue_path still null and its
      next_action unchanged. Binding the head to BATCH-46254b is a SECOND PASS,
      together with the ten handoff records and the task cards. Recorded here so
      the omission is a declared boundary rather than something a later reader
      discovers.

  asymptotic_promotion_gates:
    status_all: OPEN
    note: >-
      No asymptotic or concrete cost claim exists under this goal, so all four
      gates of agents/coordinator.md are open and untouched. This decision moves
      none of them and creates no claim that could approach them.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NO EVIDENCE WAS REVIEWED. This is a batch-opening decision, not an
      evidence-review decision: no EV-* record exists for this goal, no producer
      has run, no independent report exists, and no `support` or `reject_scoped`
      determination on `replicated` or `strong` evidence is available. Creating a
      KN-FIND here would promote a plan. Noted separately because it is easy to
      confuse: the KN-LIT entries TASK-20260810-bde128 will file are corpus
      ACQUISITION, not promotion of an internal finding, and they do not satisfy
      this field. The closing decision DEC-20260810-1163ec fills it again on what
      the two independent reports actually support.

  limitations:
    - >-
      THIS DECISION ASSERTS NOTHING ABOUT MD5. It creates no hypothesis, promotes
      no knowledge, satisfies no promotion gate, records no attestation, and
      supports no claim at any tier.
    - >-
      THE FIREWALL IS PARTLY DECLARATION AND THAT IS STATED RATHER THAN HIDDEN.
      Read-scope is not enforced for reads by any runtime here; the quarantine
      marker is a declaration plus a digest and not an access control; and
      whether corpus staging can actually exclude the quarantine directory is
      NOT KNOWN TO THIS DECISION and is assigned to TASK-20260810-23e0ea to
      determine. If it cannot, the honest record is that the firewall is
      declaration-only at that layer, and that answer must not be softened.
    - >-
      MODEL PRIOR KNOWLEDGE IS IRREDUCIBLE AND MAKES A SUCCESSFUL CALIBRATION
      PERMANENTLY CONFOUNDED IN THIS PROGRAM. The null-object control is a
      discriminator, not a solution, and TASK-20260810-b9d956 is directed to
      attack whether it discriminates at all.
    - >-
      EVERY BUDGET FIGURE IN THIS BATCH IS A DECLARATION AND NONE IS A
      MEASUREMENT. This goal has never run a task, so it has no measured duration
      for any role, and no figure was transcribed from another campaign's actuals
      either. A task reaching its declared ceiling HALTS, and that halt is
      infrastructure signal, never a negative mathematical result.
    - >-
      THE CAMPAIGN BUDGET IS JUDGED INADEQUATE AND IS NEVERTHELESS UNCHANGED.
      The campaign may reach its sixth batch without a chosen-prefix collision or
      a blind rediscovery. If it does, the correct outcome is `paused` with those
      criteria recorded OPEN AND UNATTEMPTED, not a seventh batch taken on
      momentum and not a criterion quietly reinterpreted downward.
    - >-
      NO KNOWLEDGE RETRIEVAL WAS PERFORMED BY THIS ACT. The session had no Bash
      and no retrieval MCP tool. NO absence, novelty, prior-non-testing or
      saturation inference follows (AGENTS.md knowledge retrieval policy).
      TASK-20260810-bde128 must attempt retrieval itself and record the outcome.
    - >-
      NO GIT OPERATION WAS PERFORMED AND NO COMMIT EXISTS FOR THIS ACT. Every
      archive block in the queue carries commit_sha null, parent_sha null and an
      empty path_sha256, to be backfilled only from observation. Until
      TASK-20260810-fc23ce commits and pushes, this decision and the batch it
      opens are UNPUBLISHED and are not durable evidence.
    - >-
      NO IDENTIFIER WAS MINTED OR CHECKED IN THIS SESSION, which had no Bash.
      Every identifier used was pre-allocated and verified free outside it. One
      consequence is visible in the queue: TASK-20260810-bde128's KN-LIT
      identifiers could not be pre-declared in artifact_paths and are instead
      enumerated in its kn-lit-manifest.json, which TASK-20260810-5c819b is
      directed to stage and to fold into its receipt's record_ids.
    - >-
      CROSS-MODEL INDEPENDENCE IS NOT CLAIMED. TASK-20260810-23e0ea and
      TASK-20260810-b9d956 supply SESSION independence only, and neither verdict
      may be recorded as an attestation.

  next_actions:
    - >-
      Second pass: write the ten ledger handoff records under ledger/handoffs/
      and the BATCH-46254b task cards, then bind ledger/goals/GOAL-MD5-001.yaml to
      BATCH-46254b and its queue path with exactly one next_action. That head
      rewrite should state the dependency concretely - the five symmetric goals
      are unblocked for protocol and setup work when BCP-1 commits under
      TASK-20260810-927ab5, and remain blocked from any claim about their
      instrument until the calibration verdict exists in a later batch.
    - >-
      Then dispatch TASK-20260810-fc23ce to commit and push this opening control
      plane, and open a PR against main naming GOAL-MD5-001, BATCH-46254b and
      DEC-20260810-9942ea.
    - >-
      Then dispatch TASK-20260810-26d0d5 (BCP-1) and snapshot it under
      TASK-20260810-927ab5 BEFORE either producer runs - the dependency on the
      snapshot rather than on the authoring task is the firewall itself.
    - >-
      Then run TASK-20260810-3e0793 and TASK-20260810-bde128 concurrently at
      max_concurrent 2, snapshot both under TASK-20260810-5c819b, take the two
      independent reviews, and close with the single ledger archive
      TASK-20260810-ccfeb4 carrying EV-MDFIVE-1d470b and DEC-20260810-1163ec.

  decided_by: coordinator
  decided_at: '2026-08-10'

  inference_provenance:
