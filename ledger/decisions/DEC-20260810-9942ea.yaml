  decision_scope: >-
    OPENS THE FIRST BATCH OF GOAL-MD5-001 AND APPROVES ITS RANKED SHAPE. NOTHING
    MORE. This decision reviews no evidence, creates no hypothesis, approves no
    experiment, authorizes no search, and asserts nothing whatsoever about MD5 -
    no collision, no preimage, no complexity, no method ceiling, no obstruction.
    It does not change the goal's status, which remains `draft`, and it does not
    alter campaign_budget. It touches no record of GOAL-SHA1-001, GOAL-SHA2-001,
    GOAL-SHA3-001, GOAL-BLAKE-001, GOAL-ASCON-001, GOAL-SIMSPK-001 or
    GOAL-RSA-001.

  context: >-
    GOAL-MD5-001 was created 2026-08-09 with status `draft`, current_batch_id
    null, dispatch_queue_path null and latest_verified_commit null, and has never
    opened a batch. Its next_action states that it RUNS FIRST IN THE 2026-08-09
    SYMMETRIC SET AND THE OTHERS WAIT ON ITS FIRST BATCH. RQ-MDFIVE-6870c1
    imposes two hard preconditions before any experiment may be designed - the
    preimage papers and one published collision path filed as KN-LIT at stated
    provenance levels, and an RFC 1321 implementation pinned and validated
