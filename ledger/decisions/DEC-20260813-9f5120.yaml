      controls and admit one additive repair. REVISE followed by one v12
      successor, a new content-first snapshot, and a fresh independent review
      is proportionate; REJECT would discard verified progress and APPROVE
      would silently overrule material evidence.
    - >-
      This decision is neutral static protocol governance only. It produces no
      experimental, mathematical, performance, scientific, curve, JINV, ECDLP,
      closure, or breakthrough evidence and changes no official status.

