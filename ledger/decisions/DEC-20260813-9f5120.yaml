      preservation, all enumerated matrices, convergence, and payload
      preservation remain positive within their exact frozen scopes and are
      not weakened or discarded by this decision.
    - >-
      The enumerated built-in malformed cells do not prove the stronger
      every-malformed-public-control quantifier. Stateful subclasses expose a
      time-of-check/time-of-use acceptance bypass and process side effect, and
      lazy nested diagnostics expose a raw-exception path with no final
      adjudication.
    - >-
