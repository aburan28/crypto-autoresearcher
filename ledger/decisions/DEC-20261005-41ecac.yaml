  context: >-
    DEC-20261005-dbb0d2 left the active goal with one exact obligation: design
    a Route-C-style C-star whose public projection supports ordinary public
    encryption while an explicit operation derived from evaluable End(E)
    supplies recipient-only message recovery. The prior A/B/C packet and
    independent review identify endpoint collision, public fixed-rank
    decoding, public full-action recovery, an absent EndRing-to-Hom operation,
    reduction-direction reversal, and unresolved source overlap as the cheap
    gates. This decision approves a bounded theory protocol that attacks those
    defects before implementation or experimentation.
  standing_authorization: >-
    AGENTS.md standing user authorization covers idea intake and complete
    protocol execution within this goal. No further user confirmation is
    required after the preparation archive is committed, pushed, and verified.
    Approval is permission to run the frozen tasks, not evidence that any
    candidate, reduction, novelty claim, or security claim is valid.
  rationale:
    - >-
      The producer is bounded to at most three public-projection families and
      at most one fully typed finalist. It must otherwise return route-specific
      failures and one mathematical obligation; this avoids both open-ended
      ideation and premature universal closure.
    - >-
      The six required producer artifacts separate complete syntax,
      SecretLift's concrete algorithm, attack gates, source comparison, and
      provenance. Zero runs and no implementation are appropriate because the
      current uncertainty is definitional and reduction-theoretic.
    - >-
      The blind Validator owns projection/correctness/message separation and
      reduction direction from a producer-free statement. It explicitly tests
      constant projections, public inverse projections, and standard EC
      ElGamal whose scalar is deterministically derived from EndRing, preventing
      an EndRing label from substituting for a security reduction.
    - >-
      The Red Team owns producer-specific public evaluability, concrete
      SecretLift/public-recovery attacks, and primary-source nonduplication. It
      must independently retrieve or hash-check load-bearing sources and scope
      every result to the definitions actually reviewed.
    - >-
      Review ownership is frozen as J1/J2 versus J3/J4/J5, every plan joint is
      serialized as `Jx -- statement`, siblings remain mutually blind, and the
      composer must run the unmodified independence checker before composing.
      No post-result label projection is authorized or expected.
    - >-
      Snapshot-before-review and final-ledger-after-composition custody are
      fully assigned. The final archive may keep the goal active with exactly
      one continuation, but may create no scientific record or launch a
      successor.
  protocol_boundary:
    scientific_runs: 0
    implementation_runs: 0
    maximum_projection_families: 3
    maximum_finalists: 1
    max_concurrent: 2
    first_eligible_task_after_preparation_archive: TASK-20261005-47d13a
    launch_authorized_now: false
  evidence_refs:
