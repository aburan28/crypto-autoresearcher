  limitations:
    - No C-star candidate has yet been produced or reviewed.
    - No reduction from a PKE adversary to EndRing has been supplied.
    - An EndRing solver yielding a secret key or decryption only upper-bounds breaking by EndRing and does not establish semantic security from EndRing.
    - Novelty remains unverified until the independent source review completes.
    - No security, correctness, efficiency, practicality, post-quantum, deployment, or universal impossibility claim is made.
