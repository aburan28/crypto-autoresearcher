coordinator_decision:
  id: DEC-20260802-505759
  decided_at: '2026-08-02'
  decided_by: coordinator
  goal_id: GOAL-PATH-001
  batch_id: BATCH-002
  question_ids: [RQ-MONO-001, RQ-ICEX-001, RQ-ECDLP-002]
  evidence_ids: [EV-MONO-002, EV-ICEX-001]
  decision: approve
  decision_note: >-
    approve is the template vocabulary token. What is approved is the
    GOAL-MONO-001 census executor; the prioritization content below is the
    reasoning that selects it over the two alternatives GOAL-PATH-001's
    next_action offered.
  target_ids: [GOAL-PATH-001, GOAL-MONO-001, EXP-MONO-4b50b6]

  context: >-
    The user asked this session to launch the research harness on "index
    calculus for ecdlp". Every goal in that chain was self-deferred by its own
    recorded next_action, and three of the four deferred explicitly to
    GOAL-PATH-001's pending prioritization choice:

      GOAL-ICEX-001  "remain non-executing until charged SDEG/MONO/RELN
                      measurement packages exist ... No ICEX measurement
                      authorized."
      GOAL-SDEG-001  "Defer activation/executor until ECDLP verifier-hash and
                      precommit residuals clear ... no runs now."
      GOAL-MONO-001  "Defer census executor until PATH prioritizes ICEX feed
                      data; no census authorized now."
      GOAL-RELN-001  "Defer measurement until activation residuals clear and
                      PATH prioritizes an admitted RELN executor batch."

    GOAL-PATH-001's own next_action is the unresolved three-way choice: "expand
    DREG ladder under CTRL-B, admit ECDLP executable seal, or prioritize other
    Tier-1 measurement - exactly one next batch when capacity opens." Capacity
    opened and the user named the area. THIS RECORD MAKES THAT CHOICE.

  the_choice:
    selected: prioritize_other_tier1_measurement
    concretely: >-
      Authorize the GOAL-MONO-001 m=3 Semaev-cover census executor, under the
      already-frozen and already-red-team-PASSed protocol
      MONO-m3-census-1.1.0-repair-cm-gate, as GOAL-MONO-001 BATCH-003.
    why_mono_and_not_the_other_two:
      - >-
        MONO IS THE ONLY CHILD WHOSE SOLE RECORDED BLOCKER IS THIS DECISION.
        Its next_action names exactly one precondition - "until PATH prioritizes
        ICEX feed data" - and nothing else. SDEG additionally requires the
        GOAL-ECDLP-001 verifier-hash and precommit residuals to clear; RELN
        additionally requires activation residuals to clear. Neither of those is
        in this session's reach, and neither is unblocked by a PATH decision
        alone. Choosing MONO is not a preference among equals; it is the only
        one this decision can actually unblock.
      - >-
        Its protocol is already frozen at review_only_freeze with an independent
        red-team PASS (RT-20260725-707, EV-MONO-002). No new protocol design is
        needed, so the authorization consumes review capacity that was already
        spent, and the executor runs a specification it did not write.
      - >-
        Its declared compute is low (protocol estimate 7200s wall clock at toy
        primes; actual 13.755s) and it feeds GOAL-ICEX-001's relation-rate
        numerator directly, which is the Tier-2 bottleneck ICEX names.
    what_is_NOT_chosen_and_why:
      dreg_ladder_expansion: >-
        DEC-20260731-014 pinned a CTRL-B cell PASS at n=12 D=6. Expanding the
        ladder is a larger compute commitment against a question that is already
        pinned at one cell, and it does not unblock the ICEX chain the user named.
        NOT ABANDONED - it remains the standing alternative for the next PATH batch.
      ecdlp_executable_seal: >-
        GOAL-ECDLP-001's BATCH-024+ archive commits are reachable only from
        origin/codex/ecdlp-breakthrough-20260801-main2, which is 76 commits ahead
        of this branch and already at BATCH-025. Admitting the seal from here
        would fork a campaign that another worktree is actively driving. NOT
        ABANDONED - it is the wrong worktree, not the wrong idea.

  authorization_granted:
    to: GOAL-MONO-001, BATCH-003, executor role
    scope: >-
      Execute MONO-m3-census-1.1.0-repair-cm-gate exactly as frozen, at the
      pinned primes 211/431/809/1601, master seed 20260725, 30000 samples per
      curve, window W=4, with the CM exception screen under CTRL-CM-ADMISSION.
      This is the "separate Coordinator ledger authorization" the protocol's
      executor_gate_when_authorized requires and which the protocol card
      explicitly could not grant itself.
    experiment_id: EXP-MONO-4b50b6
    write_scope_granted:
      - experiments/EXP-MONO-4b50b6
      - coordination/goals/GOAL-MONO-001/batches/BATCH-003
    forbidden:
      - Editing the frozen protocol. Parameters are pinned; the executor obeys them.
      - >-
        Emitting FULL_MONODROMY_BARRIER_TOY without the CM hard gate
        (CTRL-CM-GATE-FULL: >=8 scored ordinary CM curves, zero reverified CM
        exceptions).
      - Any crypto-scale reading. Claim-tier ceiling stays toy.
      - Any hypothesis or goal status change from the executor task.

  provenance_repair_in_this_batch: >-
    GOAL-PATH-001's latest_verified_commit was 9f80eebbef2df9a521a9cce8da66391cfcb63e73,
    which DOES NOT RESOLVE in this repository. A driver resuming the
    index-calculus chain could not verify the checkpoint it was building on.
    Rebound by CORR-20260802-7787de in the same batch, which is why this decision
    is admissible as a checkpoint at all.

  claim_boundaries:
    - >-
      THIS DECISION AUTHORIZES A MEASUREMENT. IT ASSERTS NO MATHEMATICAL RESULT.
      No cycle-type statistic, monodromy statement, relation rate, or ECDLP claim
      is made here in either direction.
    - Claim-tier ceiling for everything it authorizes stays toy.
    - >-
      No hypothesis status changes. GOAL-PATH-001 and GOAL-MONO-001 both keep
      active_hypothesis_ids empty.
    - >-
      Prioritizing MONO deprioritizes nothing permanently. Both alternatives
      above record their evidence, their boundary, and the concrete condition
      under which they return, per AGENTS.md rule 9.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      not_warranted - this is a scheduling and authorization decision. It
      produces no measurement and therefore nothing promotable. The census it
      authorizes is reviewed and dispositioned separately in DEC-20260802-a51c82.

  next_action: >-
    Open GOAL-MONO-001 BATCH-003, run the authorized census, snapshot-archive the
    run package, obtain independent Validator and Red Team review, and close the
    batch with a Coordinator evidence and decision pair. GOAL-PATH-001's own next
    prioritization choice reopens only after that checkpoint is verified.

  admissible_toward_closure_quorum: false
  is_not_a_cryptanalytic_result: true
  changes_no_hypothesis_status: true
