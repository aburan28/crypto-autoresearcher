  context: >-
    /design-experiment, one contract, for IDEA-20261005-2f5c3f. No
    hypothesis and no experiment on origin/main cites it. The branch
    design/ssi-2f5c3f-cartier was created from origin/main at
    868ae268ecb73447ff161d98207af77de4932640 and git merge origin/main
    reported already up to date.

    The contract measures Cartier-Manin ranks of y^2 = f for monic
    squarefree quintics f over F_5. The prediction is the set {0, 1, 2}.
    Rank 2 matches Newton p-rank 2, rank 0 occurs only on Newton p-rank 0,
    and both ranks 0 and 1 occur on Newton p-rank 0. A missing rank, or a
    failed separation row, is a negative, so success can fail. No
    isogeny-path algorithm is claimed.

    This session opened ledger/questions/RQ-SSI-001.yaml,
    knowledge/literature/KN-LIT-948.md,
    knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml, and
    knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml. It read
    IDEA-20261005-2f5c3f from origin/design/cycle-20261005-domain via the
    GitHub contents API and did not copy that file. The Yui sentence stays
    provenance recalled. It is not evidence for this approval. The
    approval is of the protocol.

    Protocol completeness: inputs, controls, independent variables, primary
    and secondary metrics, the base-5 seed, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification criterion,
    and required artifacts are all non-null. No field required for approval
    was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The assignment of each observation is fixed before any run. A missing rank, or a rank that fails a separation row, is a negative.
    - The elliptic mismatch counts, the squareful sentinel, and the integral Newton check give the census a way to come back invalid rather than as a false rank set.
    - Success is only the first assignment row, so success can fail.
    - No quintic was enumerated while writing this decision.

  evidence_refs: []
  limitations:
    - Toy scope only: F_5 and odd-degree genus-2 models. No transfer to a cryptographic prime.
    - The matrix index is the one frozen in the specification. It is part of the instrument.
    - A positive elliptic mismatch count does not falsify the surface prediction. It rejects the index.
    - This decision authorizes a later run. It does not start one.
    - The recalled Yui sentence is not support.

