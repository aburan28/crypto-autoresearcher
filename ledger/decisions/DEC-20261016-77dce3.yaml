    - experiments/EXP-ENDO-7494e7/runs/RUN-ENDO-795989/raw-result.json
    - experiments/EXP-ENDO-0e622b/specification.yaml
    - experiments/EXP-ENDO-0e622b/implementation/run.py
    - experiments/EXP-ENDO-0e622b/implementation/check.py
    - harness/endosweep/isoglv.py
    - tests/test_isoglv.py
  runnable_condition: >-
    Approval requires tools/newest_experiments.py --experiment
    EXP-ENDO-0e622b to report execution_state ready, with
    experiments/EXP-ENDO-0e622b/trial-plan.json present and the
    trial_plan_sha256 of TASK-20261016-1b6023 filled in from it, and
    tests/test_isoglv.py passing. The source rows
    experiments/EXP-ENDO-25ad84/runs/RUN-ENDO-d7cb69/raw-result.json must be
    committed with sha256
    0576225d496168485a8c30d5d460edab1ab969e7cd3a4d7850e43406a65282da. The
    dispatching session confirms all three before committing this record.
  limitations:
    - All figures are modelled counts in curvesweep's M_eq = M + S model. The claim tier is modelled, and no timing or ECDLP claim is possible from this run.
    - The scope is the nine named curves, ell <= 13, depth 2, at most 64 nodes, at most 12 cheaper-class candidates, build_limit 3 and build_seconds 900, as in EXP-ENDO-7494e7.
    - The prediction was written after RUN-ENDO-795989 and the validator's derivation were observed. A match confirms the instrument reproduces the derivation; it is a replication of a deterministic computation, not an independent sample, and it adds no new curves or classes.
    - The six population positives are four isogeny classes. Heuristics H1-H3 of IDEA-20261016-15a6fc are not validated here.
    - This decision does not launch the executor and changes no hypothesis status.
  next_actions:
    - The executor runs experiments/EXP-ENDO-0e622b/trial-plan.json once under TASK-20261016-1b6023 and records observations only; then the snapshot TASK-20261016-85eb9e archives the frozen package alone, before independent validation and an evidence review of EXP-ENDO-0e622b.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Approval of a protocol is not a result. No evidence record is created
      here.
