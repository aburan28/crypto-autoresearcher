    multiplication cost, not an attack cost. No result of EXP-ENDO-0e622b
    changes an ECDLP claim of that goal.
  archived_by: TASK-20261016-85eb9e
  mode: design_experiment_approved
  standing_authorization: >-
    The standing user authorization in AGENTS.md (user instruction,
    2026-09-06: "all is approved. ideas/experiments should be always
    approved") is the user-approval basis. The Coordinator checked the
    controls, the metrics, the stopping and invalidation rules, the artifact
    paths, the budget, that the success and falsification criteria are the
    ones frozen in EXP-ENDO-7494e7, and that the corrected prediction is
    recorded in the specification before the run.
  decision: approve
  decision_label: >-
    Approve the frozen runnable contract EXP-ENDO-0e622b for one modelled
    run, RUN-ENDO-f461e9, as the replication of H-ENDO-f58749 ordered by
    DEC-20261016-4f3a1a. H-ENDO-f58749 stays analyzed.
  replicates: EXP-ENDO-7494e7 / RUN-ENDO-795989 (EV-ENDO-7628a0)
  target_ids:
    - H-ENDO-f58749
    - EXP-ENDO-0e622b
    - RUN-ENDO-f461e9
    - TASK-20261016-1b6023
    - TASK-20261016-85eb9e
    - DEC-20261016-4f3a1a
    - CORR-20261016-ac9fc8
  context: >-
    DEC-20261016-4f3a1a decided replicate on EXP-ENDO-7494e7: the frozen
    success criterion of H-ENDO-f58749 is met on RUN-ENDO-795989 and still met
    under CORR-20261016-ac9fc8, but the deciding one-shot column omitted a
    29-32 M_eq input-format term (the neighbour chain's first step was priced
    on an affine input, though the route hands it a Jacobian point). Its
    first-ranked follow-up was to fix the pricing and re-run under a new
    frozen contract and run id with the corrected prediction recorded first.
    harness/endosweep/isoglv.py now has input_format_cost(order, path),
    stored as combined.input_format and added to both one-shot gains, with
    unit tests pinned to the validator's A4 derivation. The launcher of
    EXP-ENDO-0e622b differs from EXP-ENDO-7494e7's only in its ids; check.py
    additionally fails any combined route without the term.
  rationale:
    - >-
      It executes the replicate condition of DEC-20261016-4f3a1a. The
      corrected one-shot gains now rest on a written derivation; this run
      turns them into a run record from the instrument, which the evidence
      review needs before any move toward support, and which the timed bench
      needs to freeze its prediction.
    - >-
      The contract is maximally comparable with RUN-ENDO-795989: same frozen
      arguments, seed, source rows (sha256 0576225d...), curve set, controls
      and cost model. The only intended difference is the input-format term,
      so any other difference is an instrument alert, which the specification
      states before data.
    - >-
      The prediction is quantitative and recorded first: persistent
      combined_vs_glv_on_E exactly as RUN-ENDO-795989 (GOST +5.955 %, mnt3
      +11.033 %, mnt5 +11.302 %, Tom-384 +11.844 %); one-shot within 0.02
      points of GOST +2.20 %, mnt3 +5.78 %, mnt5 +7.55 %, Tom-384 +9.46 %;
      input_format M_eq 32, 29, 32, 29, and 0 on the ascent control; the
      same combined nodes; controls as before.
    - >-
      The success and falsification criteria are the ones frozen in
      EXP-ENDO-7494e7, unchanged; no criterion is relaxed or tightened after
      observing RUN-ENDO-795989.
    - >-
      It is cheap (RUN-ENDO-795989 took 74.7 s; watchdog 3 h, 2 GB, one run).
      This is a constant-factor, known-scalar question; it is admitted as the
      replication of an analyzed hypothesis and does not displace
      exponent-targeting work.
    - The approval covers the driver, the checker, the instrument change, the trial plan and the executor card.
  evidence_refs:
    - ledger/decisions/DEC-20261016-4f3a1a.yaml
    - ledger/corrections/CORR-20261016-ac9fc8.yaml
    - ledger/evidence/EV-ENDO-7628a0.yaml
    - ledger/hypotheses/H-ENDO-f58749.yaml
    - experiments/EXP-ENDO-7494e7/specification.yaml
