coordinator_decision:
  id: DEC-20261005-165cdc
  context: >-
    Third design tick on 2026-10-05. origin/main was fetched and
    this branch was created at 92a3d5047cbbc343439c84fdb23db6ad3d79ae8a.
    EXP-SSI-f08a63 and EXP-SSI-e502f5 already contract the two
    undesigned SSI audits. IDEA-20261004-31991f is an open ECC
    proposal whose only contract, H-GFPN-d3c9a1, checks integers
    and states that no curve is enumerated.
  decision: approve
  target_ids:
    - IDEA-20261004-31991f
    - H-GFPN-d48ae1
    - EXP-GFPN-8da8d4
  rationale:
    - >-
      GFPN is an ECC area. The side lemma is the statement in the
      proposal. This contract evaluates it on y^2 = x^3 + x at
      primes 7, 11, and 19.
    - >-
      A design-session enumeration, not a run, produced the side
      sets and the rational-sum counts 48, 120, and 360, with 0
      violations. Both addition laws must recompute them.
    - >-
      Standing user authorization of 2026-09-06 covers approval.
      Inputs, controls, metrics, six runs, stopping rules,
      invalidation rules, the success criterion, and the
      falsification criterion are filled.
    - >-
      H-GFPN-d3c9a1 is not edited. The papers and known-result
      rows named in the proposal were not reopened.
  evidence_refs: []
  limitations:
    - n = 1 and one curve model. No Gaudry exponent is claimed.
    - The model has the rational point (0, 0). A curve with no rational 2-torsion is outside this contract.
  next_actions:
    - >-
      Snapshot-archive this contract. Do not launch
      TASK-20261005-38b6ed until the receipt verifies.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Approval of an unrun contract. No finding is promoted.
  decided_by: coordinator
  decided_at: '2026-10-05'
