coordinator_decision:
  id: DEC-20260809-186c86
  decided_by: coordinator
  decided_at: '2026-08-11'
  decision: refine
  decision_vocabulary_note: '"refine" continues this campaign''s established disposition vocabulary
    (DEC-20260802-344883, -9664c6, -d94a64, DEC-20260806-46a8f3, -cf5102, -0995d5, -9a4551, DEC-20260809-46e85c
    all use it). Against templates/research-records.md''s enumeration
    (approve|revise|replicate|expand|support|weaken|reject_scoped|pause|supersede) this decision is closest
    to a REVISE: it corrects DEC-20260809-46e85c''s own branch-application question (which of A/B/C/D/E,
    or the exponent-supersession clause, actually governs this batch''s numbers) rather than approving a
    new frozen protocol or moving H-HQC-18d1b4''s status. No hypothesis status changes; no experiment
    contract is amended; one bounded follow-on task is named directionally, to be separately designed and
    approved in its own batch, consistent with this campaign''s established pattern.'
  target_ids:
  - GOAL-HQC-001
  - EXP-HQC-982268
  - H-HQC-18d1b4
  - EV-HQC-3a0372
  - DEC-20260809-46e85c
  context: 'DEC-20260809-46e85c pre-registered a decision rule with five named branches (A DETECTED, B
    NULL WITH STATED MDE, C1/C2 STILL AMBIGUOUS, D INVALID/INFRASTRUCTURE, E ANOMALY) plus a SECONDARY,
    outcome-independent check: the SE-versus-trial-count exponent must lie in [0.4, 0.6] to be consistent
    with the derivation''s 1/sqrt(T) assumption, and if it falls outside that band this SUPERSEDES branches
    A/B/C, refuting the derivation''s own modeling assumption and requiring a scaling-characterization task
    before any further T-sizing. TASK-20260809-a79e4f ran both pre-registered stages (EV-HQC-3a0372).
    TASK-20260809-603dc5 (Validator, verdict passed/ADMIT) and TASK-20260809-47a5ec (Red Team, verdict
    ADMIT) both independently reviewed it under xhigh effort, independent sessions, and both reproduced
    every reported statistic exactly -- the Validator via its own from-scratch driver, the Red Team via a
    full re-execution of the actual committed script on a third environment plus its own from-scratch
    jackknife. Both reviewers, independently and without conferring, identify the SAME central finding:
    the raw stage-2 numbers (z=1.2985, diff=0.1148) numerically satisfy Branch C1''s stated conditions, but
    the independently-reproduced SE-vs-T exponent (0.3186) falls outside [0.4, 0.6], and the pre-registered
    rule''s own text states this supersedes C1. This decision applies that supersession, adjudicates
    EV-HQC-3a0372, and files the KN-TECH entry DEC-20260809-46e85c''s knowledge_promotion held pending
    exactly this batch''s SE-ratio replication result.'
  rationale:
  - 'THE PRE-REGISTERED RULE IS APPLIED IN ITS OWN STATED ORDER. Branch D (invalid/infrastructure) does not
    fire: the determinism gate passed, D2/D3 report zero violations across both stages, stage 2 achieved its
    full planned T2 with no truncation, and the batch used 10.295 of 400 authorized core-seconds -- all
    independently reproduced by both reviewers (EV-HQC-3a0372 O7). Branch E (stage-1 sign anomaly) does not
    fire: both stage-1 shards are positive, neither individually significant (EV-HQC-3a0372 O7).'
  - 'THE RAW STAGE-2 NUMBERS NUMERICALLY SATISFY BRANCH C1, BUT THIS IS NOT THE OUTCOME. At the primary,
    pre-registered evaluation (stage 2, k=m=17): |z|=1.2985 < 1.96, so Branch A (detection) does not fire.
    |diff| + 1.96*SE = 0.2881 >= 0.19, so Branch B (calibrated null) does not fire. |diff|=0.1148 >= 0.10
    with sign consistent with stage 1''s pooled sign -- by the raw arithmetic ALONE, Branch C1 (one further
    matched-pair extension sized for delta=|diff| at z=2.80, capped at 2.0e5 trials) is satisfied. BOTH
    reviewers flag, independently, that a naive reading would stop here and dispatch a C1-style extension
    (EV-HQC-3a0372 O8; the Red Team states this is "the single most important thing for the next
    Coordinator decision to get right" and that applying C1 without addressing the supersession clause
    "would misapply the rule it is bound by").'
  - 'THE SE-VS-T EXPONENT SUPERSESSION CLAUSE FIRES INSTEAD, ON INDEPENDENTLY-REPRODUCED NUMBERS. The
    fitted exponent (SE ~ T^-exponent) is 0.3186 (executor), independently re-derived to 0.31862351594872185
    by the Validator from its OWN regenerated SE values (not read from the executor''s output), and
    independently re-confirmed by the Red Team''s full re-execution of the actual committed script on a
    THIRD machine/OS/Python/numpy combination distinct from both the pilot''s and the executor''s. All three
    figures agree to the digits shown. This is OUTSIDE the pre-registered [0.4, 0.6] band DEC-20260809-46e85c
    declared in advance as consistent with the derivation''s 1/sqrt(T) assumption, and its own text states
    plainly: "IF IT FALLS OUTSIDE THAT BAND, that supersedes branches A/B/C: the derivation''s own modeling
    assumption is refuted, every required-T figure in EV-HQC-dd85c1 O5 is downgraded to resting on a
    refuted assumption, and the next action is a scaling-characterization task before any further sizing."
    Both reviewers state this is a real, correctly-computed anomaly, not an arithmetic or reporting error
    (EV-HQC-3a0372 O6, O8). THIS DECISION THEREFORE APPLIES THE EXPONENT-SUPERSESSION OUTCOME, NOT BRANCH
    A, B, C1, C2, D, OR E.'
  - 'THE SUPERSESSION IS WEIGHED, NOT TAKEN AS A SETTLED SCALING LAW. Both reviewers independently flag
    that the 3-point fit has fewer independent degrees of freedom than it appears: the T=5,000 and
    T=10,000 points are two different aggregations of the SAME 10,000 underlying trials (stage 1), and only
    the T=T2=20,000 point (stage 2, fresh shards) is a genuinely disjoint draw. The Red Team additionally
    surfaces, for the first time, ~14x per-shard SE heterogeneity at fixed T=5,000 across stage 2''s four
    fresh shards -- a plausible, not yet established, contributor to the sub-1/sqrt(T) exponent
    (EV-HQC-3a0372 O9, O10). This does NOT make the supersession trigger spurious -- it fired on
    correctly-computed, pre-registered, independently-reproduced numbers, exactly as the rule specifies --
    but it means the follow-on scaling-characterization task must use independent (non-nested) samples per
    T level and report a confidence interval on the exponent, not treat 0.3186 as a precisely-estimated
    scaling law. This qualification is carried into next_actions below, per both reviewers'' explicit
    recommendation.'
  - 'THE SE-RATIO REPLICATION RELEASE CONDITION FIRES ON ITS "CONSISTENT" BRANCH, INDEPENDENTLY OF THE
    EXPONENT FINDING. DEC-20260809-46e85c''s knowledge_promotion held one KN-TECH entry pending this
    batch''s stage-1 measurement of the paired/unpaired SE ratio at k=17 on the pilot''s own shards
    5000/6000, with an explicit binary release condition: "consistent with the Red Team''s 2.78x" files the
    replicated power-deficit lesson; "materially inconsistent" files the non-replication lesson instead.
    Four independently-measured ratios now exist: 2.902 (shard 5000), 3.224 (shard 6000), 3.117 (stage-1
    pooled), 3.769 (stage-2 pooled) -- all within the same order of magnitude and direction as 2.78x, and
    all independently re-verified exactly by both reviewers (EV-HQC-3a0372 O5). This is CONSISTENT, not
    materially inconsistent: a genuine, non-exact-digit replication is exactly what a quantity carrying its
    own sampling variance should produce, and an exact-decimal match would itself have been the suspicious
    outcome. THE REPLICATED POWER-DEDICIT LESSON IS THE APPLICABLE FRAMING, and is filed as KN-TECH-7dd14f
    (see knowledge_promotion below), independently of and unaffected by the exponent-supersession finding
    above, which bears on a DIFFERENT question (the required-T derivation''s scaling assumption) from the
    one this release condition was written to test (whether the SE-ratio power-deficit figure itself
    replicates across shards).'
  - 'BOTH REVIEWS RETURNED ADMIT, INDEPENDENTLY, AT xhigh EFFORT. The Validator (TASK-20260809-603dc5)
    recomputed diff/SE/z at 5 k-values for both stages from raw data generated by its own driver, matching
    to full float precision, and confirmed the stage-2 sizing rule is structurally incapable of using
    stage-2 data. The Red Team (TASK-20260809-47a5ec) independently re-executed the ACTUAL committed script
    end-to-end on a third environment and separately reimplemented the jackknife from scratch, matching the
    committed record exactly by both methods, and additionally proved by code inspection that the crossed
    (matched-pair) stage-1 arms cannot have drawn new entropy. Neither review found a defect that
    disqualifies the artifacts, and both flag the same interpretive risk (premature Branch C1 application)
    this decision addresses. This is treated as MECHANICALLY SOUND per both reviewers'' own explicit
    judgement.'
  - 'THE CAMPAIGN''S STANDING OBJECTION IS NOT RETIRED. DEC-20260809-46e85c states this objection (no batch
    in this campaign has ever produced a fired cell from a known-present real-sampler defect) is retired
    only if Branch A fires. It did not. Recorded plainly rather than left ambiguous, per AGENTS.md rule 9:
    this is a legitimate reason to keep investing in the matched-pair design (z has risen across five
    independent measurements of this cell, from -0.466 to +1.298, sign stable and positive since the
    Validator''s probe), not a reason to treat the objection as answered (EV-HQC-3a0372 O11).'
  - 'BUDGET IS DEBITED WITH A STATED CONVENTION, FOR THE FIRST TIME IN THIS CAMPAIGN''S RECORD. This
    batch''s measured spend is 10.295 core-seconds / 9.439 wall-clock seconds (run_manifest.yaml, sum of
    stage 1 [3.73 / 3.337] and stage 2 [6.565 / 6.102]; independently corroborated by the Red Team''s own
    re-execution at a comparable ~10.3 core-seconds). CONVENTION STATED: total_wall_clock_seconds tracks
    EXECUTOR PRODUCER SPEND ONLY -- the wall-clock time of actual sampler/estimator pipeline invocations --
    consistent with every prior batch_checkpoints[].budget_used entry in GOAL-HQC-001.yaml, none of which
    has ever included review-task or coordinator-archive-task wall-clock in the figure debited against the
    10,800-second total. Applying that convention: debiting this batch''s 9.439 measured wall-clock seconds
    against the last-cited remaining balance (roughly 4,973 seconds, BATCH-2ecaa1''s checkpoint figure,
    carried forward by reanalysis_report.md section 0 and by every subsequent checkpoint without a shown
    subtraction) yields an updated remaining balance of roughly 4,963.6 seconds (4,973 - 9.439). THIS IS
    THE FIRST TIME ANY LEDGER ARCHIVE IN THIS CAMPAIGN HAS PERFORMED AND SHOWN AN EXPLICIT SUBTRACTION
    against the running total rather than repeating a bare estimate -- the recurring problem
    DEC-20260806-9a4551 and DEC-20260809-46e85c both flagged. What is NOT done here: the base figure itself
    (4,973) is not independently re-derived from first principles by summing every batch''s actual producer
    spend since BATCH-2ecaa1''s close; doing so is out of scope for this archive task and is flagged, not
    resolved, in limitations below.'
  - 'CLAIM TIER STAYS TOY; H-HQC-18d1b4 DOES NOT MOVE. Nothing in this batch bears on HQC''s IND-CCA
    security, its decoding-failure rate, assumption A17 or A5, or any standardized parameter set. Eight
    consecutive batches of instrument-trust, feasibility, pilot, reanalysis and now matched-pair-measurement
    work have not moved H-HQC-18d1b4, and this decision does not move it either.'
  evidence_refs:
  - EV-HQC-3a0372
  - EV-HQC-dd85c1
  - DEC-20260809-46e85c
  - coordination/goals/GOAL-HQC-001/batches/BATCH-412513/tasks/TASK-20260809-a79e4f/matched_pair_report.md
  - coordination/goals/GOAL-HQC-001/batches/BATCH-412513/tasks/TASK-20260809-a79e4f/run_manifest.yaml
  - coordination/goals/GOAL-HQC-001/batches/BATCH-412513/reviews/TASK-20260809-603dc5/validation_report.yaml
  - coordination/goals/GOAL-HQC-001/batches/BATCH-412513/reviews/TASK-20260809-47a5ec/red_team_report.md
  limitations:
  - 'THE EXPONENT ESTIMATE (0.3186) IS A FIRST-LOOK ANOMALY ON A WEAKLY-INDEPENDENT 3-POINT FIT, NOT A
    SETTLED SCALING LAW. Two of three fitted points are non-independent slicings of one 10,000-trial pool
    (EV-HQC-3a0372 O9), and stage 2''s own shard-level SE heterogeneity (~14x at fixed T, O10) is an
    uncontrolled candidate confound. The supersession trigger is not in doubt on the pre-registered rule''s
    own terms -- it fired on correctly-computed, independently-reproduced numbers, and the rule does not
    condition its trigger on the fit''s degrees of freedom -- but the follow-on task must use independent
    (non-nested) samples per T level and report a confidence interval, not repeat this fit''s design.'
  - 'THE V1 POSITIVE-CONTROL COMMITMENT''S STATUS UNDER THIS OUTCOME IS AN OPEN SEQUENCING QUESTION,
    DELIBERATELY NOT RESOLVED HERE EITHER WAY. DEC-20260809-46e85c committed, "to ensure sequencing cannot
    become indefinite deferral," that V1 is dispatched in the immediately following batch specifically
    "under pre-registered branches B and C2," and is unnecessary only under branch A. This batch''s outcome
    is neither A, B, nor C2 -- it is the exponent-supersession outcome, which that text does not name. This
    decision does NOT authorize a V1 dispatch (it is not among this batch''s bounded deliverables and no
    task card for it exists) and does NOT treat the commitment as retired or as automatically triggered
    either. It is carried forward explicitly as an open question for the Coordinator decision that closes
    the scaling-characterization task named in next_actions to resolve -- whether V1 runs before, after, or
    concurrently with that task -- rather than left to lapse silently, per AGENTS.md rule 9''s prohibition
    on deprioritizing a committed lead without recording the reason and a revisit condition.'
  - 'NO POSITIVE CONTROL EXISTS ANYWHERE IN THIS CAMPAIGN''S REAL-SAMPLER DETECTION CHAIN (carried forward,
    unresolved). Every null this campaign has reported through the decode_blocks-level chain remains
    uncalibrated in the controls-before-belief sense of docs/inventor-protocol.md.'
  - 'THE WALL-CLOCK ACCOUNTING BASE FIGURE IS STILL NOT INDEPENDENTLY RE-DERIVED. This decision debits its
    own measured spend against the last-cited remaining balance and states the convention used (see
    rationale), but the base figure (roughly 4,973 seconds) is inherited from BATCH-2ecaa1''s checkpoint and
    has never been independently reconciled by summing every batch''s actual spend since. Flagged again,
    not resolved, consistent with every prior decision that has named this gap.'
  - 'NEITHER REVIEW IS QUORUM-ADMISSIBLE. Both TASK-20260809-603dc5 and TASK-20260809-47a5ec ran as
    independent sessions under this harness'' single resolved backend; AGENTS.md rule 13''s three-model
    closure quorum is SUSPENDED under this harness (CLAUDE.md rule 8), so this is not a blocking limitation
    for any transition made here, but no attestation is recorded because none was sought or obtainable, and
    none is implied.'
  - 'NONE OF THE FOUR ASYMPTOTIC-COMPLEXITY PROMOTION GATES IS ENGAGED, ADDRESSED, OR CLAIMED. This program
    advances no asymptotic-complexity claim of its own in this decision.'
  - 'NO CLOSURE QUORUM. GOAL-HQC-001 is not being closed, no completion criterion is met or approached, and
    no completion_quorum block is written or implied.'
  knowledge_promotion:
    promoted:
    - KN-TECH-7dd14f
    not_warranted: 'NO KN-FIND IS PROMOTED, AND NONE IS WARRANTED: nothing in this batch is a measurement
      about HQC''s IND-CCA security, its decoding-failure rate, assumption A17 or A5, or any standardized
      parameter set (H-HQC-18d1b4 is untouched, per rationale above). The promoted entry is correctly a
      KN-TECH (methodological/instrument-design lesson), exactly the class DEC-20260809-46e85c anticipated
      for this release condition. It states the replicated power-deficit lesson (matched-pair vs.
      between-shard SE ratio, corrected required-trials factor 5.0x-7.7x at k=m=17, and the irreversibility
      point) -- the "consistent" branch of the release condition, on the four independently-verified SE
      ratios in EV-HQC-3a0372 O5. It explicitly flags, as a caveat rather than a second lesson, that this
      batch''s SAME data independently falsified the derivation''s 1/sqrt(T) scaling assumption on its own
      pre-registered terms (EV-HQC-3a0372 O6, O8) -- so the corrected power-deficit factor should be read as
      a validated SE-RATIO finding at the trial counts actually measured, not yet as a validated required-T
      MULTIPLIER at whatever T a full-scale run would use, pending the scaling-characterization task named
      in next_actions. Also carried forward, unchanged and still held: the four-instance control-blindness
      pattern (KN-TECH candidate held since BATCH-4b8ad3) and the planted-arm plateau lesson (held since
      BATCH-f8050e) -- neither is engaged by this batch and neither is promoted or further deferred here.'
  next_actions:
  - 'EXACTLY ONE PRIMARY NEXT ACTION, MATCHING THE EXPONENT-SUPERSESSION OUTCOME: design and dispatch a
    SCALING-CHARACTERIZATION TASK before any further T-sizing decision reuses DEC-20260809-46e85c''s
    required-T derivation or EV-HQC-dd85c1 O5''s figures. Per both reviewers'' explicit, convergent
    recommendation: measure the matched-pair jackknife SE at k=m=17 (and a small number of other k) at
    SEVERAL trial counts using INDEPENDENT, NON-NESTED samples at each T level (i.e., not two different
    aggregations of one shared trial pool, the specific defect in this batch''s own 3-point fit), fit the
    SE-vs-T exponent with a reported confidence interval rather than a bare point estimate, and separately
    characterize the per-shard SE heterogeneity at fixed T (0.019 to 0.271 across this batch''s stage-2
    shards) as a candidate contributor before trusting pooled-SE asymptotics at this estimator''s
    nonlinearity for any future sizing decision. This is NOT a further matched-pair extension sized under
    Branch C1''s rule (delta = observed |diff| at z=2.80, capped at 2.0e5 trials) -- that rule''s own
    validity is exactly what is in question, per the supersession this decision applies.'
  - 'THE V1 POSITIVE-CONTROL COMMITMENT IS CARRIED FORWARD, UNRESOLVED, NOT SCHEDULED BY THIS DECISION.
    See limitations above: DEC-20260809-46e85c''s binding "immediately following batch" commitment is
    textually tied to branches B and C2, neither of which fired here. The Coordinator decision that closes
    the scaling-characterization task above must explicitly resolve whether V1 runs before, after, or
    alongside it -- this decision deliberately does not pre-judge that question, to avoid silently retiring
    or silently triggering a commitment its own pre-registered text does not address for this outcome.'
  - 'THE HELD KN-TECH ENTRY IS FILED IN THIS SAME COMMIT (KN-TECH-7dd14f), with knowledge/INDEX.md
    regenerated. Per DEC-20260809-46e85c''s own text, the hold does not renew a second time, and it has now
    been discharged.'
  - 'DELIBERATELY NOT SCHEDULED, unchanged and for the same reason as in DEC-20260806-2947ba, -46a8f3,
    -cf5102, -0995d5, -1ac8fa, -9a4551 and -46e85c: completion criterion 1''s missing extrapolation,
    PS-R3''s second reviewer, and the remaining named harness repairs. Also carried forward, lowest
    priority and still unresolved: BATCH-4b8ad3''s run-count discrepancy (2 vs. 3 executions).'
