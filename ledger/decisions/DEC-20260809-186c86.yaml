    (approve|revise|replicate|expand|support|weaken|reject_scoped|pause|supersede), this decision is
    an APPROVE of nothing new (no successor task is dispatched by this record; ID allocation for the
    next task is out of this Coordinator session''s reach, see next_actions) combined with a REVISE
