  knowledge_promotion:
    promoted:
    - KN-TECH-00f082
    promoted_note: 'RESOLVED. KN-TECH-00f082 minted via `python3 tools/allocate_id.py --next tech`
      (rejected: --next has no "tech" type; the driving session instead generated a random 6-hex token
      and confirmed it well-formed and free across the identifier union with `--check`, per this
      program''s established KN-* convention -- no ID_PATTERNS entry constrains KN-* well-formedness).
      Filed at knowledge/techniques/KN-TECH-00f082.md, title "Matched-pair vs. between-shard SE ratio
      replicates within a fixed shard pool, not shown scale-invariant across a shard change -- and why
      a 3-point sizing sweep cannot tell the difference", in the same commit as this ledger archive, per
      DEC-20260809-46e85c''s knowledge_promotion release condition ("Either way an entry is filed at the
      next ledger archive; the hold does not renew a second time"), satisfied by this batch (rationale
      item 6: consistent, per the condition''s literal scope, with a material scale-dependence caveat
      carried into the same entry). knowledge/INDEX.md regenerated via
      tools/build_knowledge_index.py in the same commit. The filed entry states (1) the replicated
      like-for-like required-trials factor (matched-pair design roughly 7.7x-10.4x cheaper in required
      trials than between-shard at k=m=17, corroborating EV-HQC-dd85c1 O6''s corrected 7.74x figure,
      independently measured on two different shards than the original probe), (2) the irreversibility
      point (a between-shard design cannot be re-paired after the fact once its two arms are drawn from
      disjoint PRNG shards -- EV-HQC-dd85c1 O2 -- so the design choice between matched-pair and
      between-shard is made once, before any data exists), and (3) the sharper, newly-measured lesson:
      that same ratio, and the SE-vs-T scaling law any required-T derivation extrapolates it through,
      hold within a fixed/similar shard pool and have NOT been shown to hold -- and show active
      evidence of NOT holding -- across a shard change, because a sizing sweep that changes shard
      identity at every trial-count point cannot separate "the scaling law is wrong" from "this
      estimator''s variance is shard-heterogeneous." General lesson: never extrapolate a design-power
      ratio measured at one (T, shard) pair to size a much larger experiment via an assumed scaling law
      unless that law has itself been validated in the regime being extrapolated into, with shard
      identity held fixed across the validating sweep.'
  next_actions:
  - 'EXACTLY ONE NEXT ACTION, NOT YET DISPATCHED: a scaling-characterization task, per
    DEC-20260809-46e85c''s exponent-supersession clause ("the next action is a scaling-characterization
    task before any further sizing"), scoped to separate the trial-count/shard-identity confound
    EV-HQC-3a0372 O8 surfaced. DESIGN (adopting the Red Team''s named counterexample): repeat the
    T=20,000 matched-pair extension on shards 5000 and 6000 THEMSELVES (new, disjoint trial ranges from
    those already used by TASK-20260809-a79e4f, i.e. genuinely new sampling, not a reconstruction) at
    k=m=17 and the same k=2..26 range, using the same reused stage_a.py/measure.py and the same
    matched-pair jackknife construction. If the resulting SE tracks 1/sqrt(T) from the existing
    (5,000; 10,000) points on those shards (i.e. lands near 0.068-0.070), the alpha=1.47 anomaly is a
    property of shards 8001/8002 specifically and the KN-TECH entry above stands as filed. If it
    collapses the same way stage 2 did, the 1/sqrt(T) refutation is real and general, and a follow-up
    ledger archive must revise every required-T figure in EV-HQC-dd85c1 O5 and correct the KN-TECH
    entry filed here (by superseding record, never by edit). ADD, as a standing invariant for this and
    every future task in this family: the free structural check F[:, 0:n_e-1] bit-identical between
    the defected and undefected decode of the same trial on the same shard (Red Team, EV-HQC-3a0372
    O11), covering the crossed/fresh arms the current determinism gate does not reach. BEFORE
    DISPATCH the driving session must allocate a new BATCH-* id and this task''s handoff/review/archive
    chain ids with tools/allocate_id.py --next, exactly as DEC-20260809-46e85c''s own review_chain_pending
    block did for BATCH-412513 -- this Coordinator session has no shell and cannot do so itself.'
  - 'V1''S POSITIVE-CONTROL PILOT REMAINS SEQUENCED, NOT SHELVED, AND NOW FOLLOWS THE
