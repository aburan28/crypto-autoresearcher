  rationale:
  - 'THE PRE-REGISTERED RULE IS APPLIED EXACTLY AS FROZEN, NOT AS CONVENIENT. Per DEC-20260809-46e85c''s
    stated evaluation order: BRANCH D (invalid/infrastructure) does NOT fire -- the determinism gate
    PASSED bit-identically (independently reproduced by the Validator from a separately-written
    driver), D2/D3 are 0/8 arms, no truncation, no crash, both runs well inside authorized budget.
    BRANCH E (sign anomaly) does NOT fire -- stage 1''s two shards agree in sign (+0.1018, +0.0108) and
    neither individually clears |z|>=1.96, independently re-derived by the Red Team. THE
    SE-VS-TRIAL-COUNT EXPONENT CHECK, evaluated next per that decision''s own explicit ordering,
    yields alpha = 1.4704932987763473, OUTSIDE the pre-registered [0.4, 0.6] consistency band --
    independently reproduced to the same value by the Validator (alpha=1.470493) and to 1.46996 by the
    Red Team (difference attributable to floating-point precision only). Per DEC-20260809-46e85c''s
    own frozen text, THIS SUPERSEDES BRANCHES A/B/C: no A/B/C branch is evaluated or applied to this
    result, whatever stage 2''s z/diff/interval would otherwise indicate (EV-HQC-3a0372 O5-O7).'
  - 'WHAT THIS PRE-EMPTS IS MADE EXPLICIT SO IT IS NOT LOST. Un-superseded, stage 2''s own numbers at
    k=17 (|z|=0.619 < 1.96; |diff|+1.96*SE = 0.04618 < 0.19) would satisfy Branch B''s literal condition
    -- a clean, TIGHT scoped null, tighter than this campaign''s own pre-run target. This decision does
    NOT report that null. The pre-registered exponent check exists precisely to withhold a conclusion
    that would otherwise look decisive but rests on a required-T derivation (EV-HQC-dd85c1 O5) whose
    own scaling assumption this same batch has now put in question. Per AGENTS.md rule 4 (conclusions
    scoped to what was actually tested) and rule 9 (no steering toward a convenient reading), this
    decision states plainly: NO branch A/B/C conclusion is drawn from this batch, by design, and this
    is the correct application of the frozen rule, not an evasion of an inconvenient near-null.'
  - 'THE EXPONENT-SUPERSESSION CLAUSE NAMES ITS OWN NEXT ACTION, AND THAT NAMED ACTION IS APPLIED IN
    PLACE OF V1. DEC-20260809-46e85c''s text for exactly this outcome states: "the derivation''s own
    modeling assumption is refuted, every required-T figure in EV-HQC-dd85c1 O5 is downgraded to
    resting on a refuted assumption, and the next action is a scaling-characterization task before any
    further sizing." This is the most specific instruction in DEC-20260809-46e85c covering this exact
    outcome, more specific than that decision''s rationale sentence ("V1 is dispatched in the
    immediately following batch... unless branch A fires... No other outcome defers it"), which was
    written to prevent V1 becoming an indefinitely deferred abstraction under branches B/C/D/E, not to
    override its own later-stated, more specific exponent-supersession instruction. This decision
    resolves the tension in favor of the specific clause: the next dispatched task is a
    scaling-characterization task, not V1, on the reasoning that a positive-control pilot is
    pointless to prioritize ahead of first knowing whether THIS instrument''s own sizing arithmetic is
    trustworthy at the trial counts a positive control would also need. V1 remains sequenced, not
    shelved, and is still owed by this campaign''s standing commitment; it follows the
    scaling-characterization task rather than preceding it.'
  - 'THE SCALING-CHARACTERIZATION TASK MUST BE SCOPED TO SEPARATE THE CONFOUND THIS BATCH SURFACED, NOT
    RE-RUN THE SAME DESIGN AT A FOURTH TRIAL COUNT. Both independent reviewers, without conferring,
    converge on the same decomposition: the alpha=1.47 exponent is not a uniform deviation from
    1/sqrt(T) across the three measured points. The 5,000->10,000 step (same shards 5000/6000, pooled,
    zero new entropy) gives local exponent 0.507 -- essentially exact 1/sqrt(T) consistency. 100% of
    the aggregate deviation is concentrated in the 10,000->20,000 step, which simultaneously
    introduces fresh shards 8001/8002 -- a confound between trial count and shard identity that a
    3-point, different-shards-per-point design cannot resolve by construction (EV-HQC-3a0372 O8). The
    Red Team''s named, cheap, discriminating experiment -- repeat the T=20,000 extension on shards
    5000/6000 themselves, new disjoint trial ranges, rather than fresh shards -- is adopted as the
    scaling-characterization task''s design. If the resulting SE tracks 1/sqrt(T) from the existing
    points, the anomaly is shard-specific, not a general refutation of the scaling assumption, and the
    KN-TECH entry filed below is not weakened by that outcome; if it collapses the same way stage 2
    did, the refutation is real and general. Either outcome is informative and neither is presumed
    here.'
  - 'THE PRE-RUN "~0.140 EXPECTED" COMPARISON THAT FRAMED STAGE 1''S SE AS ANOMALOUS WAS BUILT ON AN
    EXTERNAL BASELINE, AND THIS CORRECTS THAT FRAMING WITHOUT CHANGING THE FIRED BRANCH. The Red
    Team traced the "~0.140 expected" figure in design.md/DEC-20260809-46e85c''s own rationale to the
    BATCH-2ecaa1 Red Team''s external, single-shard Probe 2 (shard 424242), not to this task''s own
    shards. This task''s own two shards individually measure SE=0.1251 and SE=0.1499 at the same
    T=5,000 -- already 24-37% below that external figure. Against the correct within-task baseline
    (mean 0.1375), stage 1''s pooled SE (0.0968) is almost exactly the 1/sqrt(T) prediction (0.0972):
    NOT anomalous. The genuinely anomalous number in this batch is stage 2''s SE (0.0179), not stage
    1''s. The exponent computed over all three points (1.470) is unaffected by this correction -- it is
    a fact about the fitted OLS line regardless of which point is "expected" or "surprising" -- but the
    KN-TECH entry and any future scaling-characterization design must cite within-task baselines, not
    external probes, going forward.'
  - 'THE SE-RATIO REPLICATION QUESTION, SCOPED EXACTLY AS DEC-20260809-46e85c''s RELEASE CONDITION
    ASKS IT, RESOLVES "CONSISTENT" -- WITH A MATERIAL SCALE-DEPENDENCE CAVEAT THAT MUST NOT BE
    DROPPED. The release condition asks specifically about "stage 1''s measured SE ratio at k=17 on
    shards 5000 and 6000" against the Red Team''s 2.78x. Measured: per-shard 2.902x and 3.224x, pooled
    3.148x -- a 4%-16% relative gap, which the Red Team itself (the author of the original 2.78x
    figure, reviewing independently) characterizes as "plausible sampling variation for a ratio-of-
    jackknife-SDs statistic built from only 200 pseudo-values" and a genuine replication at matched
    scale. On the literal terms the release condition poses, this is CONSISTENT. BUT the same ratio at
    stage 2''s fresh, larger-T shards (15.514x pooled, 9.8x-16.4x per shard) is 3.5x-5.9x LARGER, not a
    replication at that scale. Reporting only the "consistent" half would materially misstate what was
    found (AGENTS.md rule 9); the KN-TECH entry filed below states both: the ratio replicates at
    matched T-scale and shard-similarity to the original probe, and has NOT been shown to be a
    scale-invariant design constant once trial count and shard identity vary together -- the same
    confound named in rationale item 4.'
  - 'THE CROSSED-ARM EMPIRICAL VERIFICATION GAP THE HANDOFF ASKED THE RED TEAM TO CHECK IS REAL AND
    UNCLOSED, BUT DOES NOT RETROACTIVELY INVALIDATE THIS BATCH''S REPORTED NUMBERS. The determinism
    gate covers only the two GATE arms against pilot_results.json; the two CROSSED stage-1 arms and
    all four stage-2 arms'' "zero new entropy" claim rests on a code-level argument about CTRStream''s
    keying (confirmed correct by the Red Team''s own direct trace of stage_a.py) plus, for every arm,
    the Validator''s independent bit-for-bit regeneration from a separately-written driver -- which is
    itself a strong empirical check, though not the specific structural F[:, 0:n_e-1] assertion the
    Red Team names as the free, decisive test. That specific check was not run. It is named as a
    standing invariant for the next task in this family (next_actions below), not treated as a defect
    requiring this batch to be discarded or re-run: the Validator''s full independent regeneration
    already supplies strong, though not identical, evidence for the same claim.'
  - 'THE STANDING OBJECTION IS NOT RETIRED. This is the eighth batch in this campaign''s real-sampler
    detection chain and the first in which any non-default branch of a pre-registered decision rule
    fired on valid, non-infrastructure, non-anomalous data (the exponent supersession) -- a genuine
    step, recorded as such. But Branch A (positive detection, |z|>=1.96) has still never fired: stage
    2''s z at k=17 is 0.619. The Red Team''s BATCH-2ecaa1 standing objection -- that this chain has
    never produced a fired cell from a known-present defect -- is explicitly not retired by this batch,
    and this decision does not claim otherwise.'
