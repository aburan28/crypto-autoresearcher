  context: 'This is the closing ledger archive for BATCH-412513''s single executor task,
    TASK-20260809-a79e4f (two-stage matched-pair measurement at the V3/decode_blocks injection
    point), reviewed by TASK-20260809-603dc5 (Validator, verdict passed / ADMIT) and TASK-20260809-47a5ec
