    further sizing"), which this decision applies literally in place of V1. Recorded here rather than
    left to be inferred, because DEC-20260809-46e85c''s rationale (not its next_actions branch text)
    also states "No other outcome defers it [V1]" -- a tension between that rationale sentence and the
    more specific, later-stated exponent-supersession clause in the SAME decision. This decision
    resolves that tension in favor of the more specific clause (see rationale item 3 and limitations).'
