  decision_scope: >-
    Classify the second 63-bit prime-field 27-cell attempt at its recorded
    boundary. Six planted controls are time-censored at their individual
    300-second caps; the first natural cell has an RSS-monitor infrastructure
    fault and no response; twenty natural cells were not attempted. The
    independent checker rejected the unbounded no-response monitor state.
    This is an infrastructure/invalid-output run disposition, not a
    factor-base ranking or a mathematical negative result.
