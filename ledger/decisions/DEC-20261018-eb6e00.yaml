  ranking:
  - priority: 1
    action: >-
      Have an Executor implement and test a race-safe, fail-closed RSS monitor
      and phase telemetry, then prepare a small m=2 planted-positive diagnostic
      packet. This separates monitor failure from expensive or stalled solver
      phases at lower cost than another 27-cell run. The packet must be frozen,
      independently checked, preapproved, and assigned a fresh experiment and
      run ID before any scientific execution.
    reason: >-
      A monitor-only retry would reproduce six known 300-second censored
      positives without explaining them; no valid natural comparison can be
      interpreted before both issues are addressed.
  - priority: 2
    action: >-
      After the diagnostic, design an arity-specific solver/formulation path
      for prime m=2..8. Keep direct S8 for seven summands and direct S9 versus
      chained S3 for eight summands as separate, bounded comparisons.
    reason: >-
      The current panel did not measure any intermediate Groebner degree or
      natural relation; an arity ladder needs evidence before scaling.
  - priority: 3
    action: >-
      Continue independently scoped full-width Koblitz and ordinary-binary
      baseline work under GOAL-ICPERF-e6b6a4, with complete IC phases and
      matched rho retained as the end-to-end acceptance criterion.
    reason: A prime pilot cannot substitute for the other curve families.
