  interpretation:
  - A planted satisfying input paired with a timeout remains a censored
    bounded-feasibility control, not an UNSAT certificate or evidence that
    the factor base cannot represent the target.
  - The monitor exception and checker refusal diagnose an instrument and
    output-validation path. The process-lifecycle cause is unisolated.
  - Zero returned certificates in this invalid-output attempt is not an
    estimate of natural relation yield; twenty natural cells have no call.
  - Sparse input support has not been linked to observed Groebner degree,
    intermediate matrix density, or complete end-to-end work.
