      Stage 7 cells S7-T2-P16777213 and
      S7-T1-P16777213. C2 only:
      Berlekamp-Massey on k in
      increasing-v order, plus T1 NULL-2
      shuffle seed 20260908. k-order
      1,2,...,20 is forbidden. Hard gate
      is fixture_pass, not T2 low L.
      T2 C2 high L is class inadequacy.
      A C2 miss is not H1 closure.
      Budget, artifacts, and replication
      are in this filing.
    - >-
      execution_authorized_stages stay
      [0, 1, 2, 3, 4, 5, 6, 7, 8].
      Authorizing Stage 9 in the same act as
      first filing the text would skip the
      completeness check.

