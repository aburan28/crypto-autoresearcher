  # ---------------------------------------------------------------------------
  # Composition. Each reviewer owns its joint. No verdict is a vote.
  # ---------------------------------------------------------------------------
  composition:
    - joint: JV-1 -- construction-charged algebra and its domain
      owner: TASK-20261001-0e7f53
      report: coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261001-0e7f53/validation_report.yaml
      verdict: breaks, narrowly, on one clause ("FILL = s d is a LOWER bound")
      receipt_verdict: passed
      load_bearing_findings:
        - >-
          The driver computes the header block exactly. An independent header
          model, written before code/v2/ was opened, matches on 2,609,280 cells
          (max |diff| 0.0). The same harness flags M1 to M4 on 15.6% to 100% of
          cells. All 3600 argmin rows and all 240 cell-count rows match. The
          rebuild is byte-identical, and 49 of 49 digests match.
        - >-
          FILL counts ordered tuples. A distinct-sum table is ~log2 s! cheaper
          (1 to 15.30 bits) with identical success. In domain, no total moves by
          1 bit or more (max 0.968). The minimum margin is +15.857 (n = 97).
          The sub-rho count stays 0 under every variant.
        - >-
          Either correction alone (C-1 FILL, or C-2 CALLS >= 0) removes every v1
          sub-rho cell. Removing both gives 19,434 cells.
        - >-
          No precomputation or multi-instance reading of the v2 rows wins. With
          everything else free, the per-target descent is >= VOW + 0.675 bits.
          Prior item (c) does not fire.
        - >-
          The E-2 gaps localise to the d grid. Real-d minima reproduce E-2
          within 0.006 bit.
    - joint: JV-2 -- failure power of C-IMPL-GATE
      owner: TASK-20261001-b2c916
      report: coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261001-b2c916/red_team_report.yaml
      verdict: breaks
      load_bearing_findings:
        - >-
          Six wrong drivers (W1, W2, W3, W4, W5, W7) pass (a)-(e) with C-3
          silent. They move E-2 margins by 0.16 to 19.3 bits, and change no
          primary sub-rho count. The missed classes are off-grid d, the domain
          predicate, the enumerator, the shared input and the baseline column.
          Prior item (a) FIRED.
        - >-
          The committed numbers are NOT impugned. The committed driver passes
          the red team's independent gate (b+, f, g, h) over 1,741,320 cells
          (4.26e-14 bit), and its counter passes a planted-cell control.
        - RC-1 to RC-5 proposed (ruled in R3).
    - joint: proves-too-much control
      owner: TASK-20261001-b2c916
      report: coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261001-b2c916/red_team_report.yaml
      verdict: holds (the declared failure signature did not fire)
      load_bearing_finding: >-
        Real oracles on genus g >= 4/5 Jacobians and on F_q^* keep their
        sub-rho cells with the construction charge (Harley's 2 - 2/(g+1)
        reproduced exactly). The generic oracles find none on any object. Prior
        item (b) does not fire. The generic negative is object-independent, so
        it carries no binary-curve-specific content.
    - joint: JV-3 -- scope and language
      owner: TASK-20261001-6a4d08
      report: coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261001-6a4d08/validation_report.yaml
      verdict: breaks
      receipt_verdict: failed (language only; every number matches raw-result.json)
      load_bearing_finding: >-
        None of the three texts states the generic-class conditional or names
        an open non-generic route, although the specification's claim_ceiling,
        CORR-20261001-a38d14 C12 and DEC-20261001-5c9e7a R6 bind them to. T6
        overstates margins by up to 76.8 bits against the file's own X-5. Twelve
        corrected wordings were supplied, and CORR-20261002-e58c3a carries them.
        Five of the six checklist items hold.
    - joint: blind re-derivation of the per-degree minimum and margin
      owner: TASK-20261001-f39c27
      reports:
        - coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261001-f39c27/validation_report.yaml
        - coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261001-f39c27/comparison.txt
      verdict: >-
        holds for the producer's declared-grid quantity, which is reproduced
        bit-exactly. On the real-d quantity in the task statement it breaks at
        four degrees, by the grid effect.
      receipt_verdict: incomplete, for read scope only
      blind_from_respected: true
      load_bearing_findings:
        - >-
          The objective and the exclusion rule are identical to 6e-14. The grid
          minima are reproduced with |diff| 0.0 and identical (m, s, d). The
          real-d values match E-2 within 0.006 bit. The n = 571 argmin is a
          grid artifact.
        - >-
          A structural bound gives margin > 0.67 bits for every (m, s, d, N):
          the zero is a theorem of the model, not a tally.
        - >-
          p > 1 holds at every optimum (log2 p 17.3 to 46.5). This is a shared,
          unvalidated modelling assumption. Imposing p <= 1 raises margins by
          5.3 to 18.1 bits.
      read_scope_gap_resolved_by: >-
        JV-1's artifact checks (manifest, command, dirty tree, determinism,
        digests, gate outputs) cover exactly the receipt-integrity items this
        task was blinded from. The composed round therefore has no uncovered
        integrity item.

  convergence: >-
    THREE INDEPENDENT IMPLEMENTATIONS AGREE WITH THE DRIVER ON THE WHOLE GRID:
    JV-1's header model, the blind sealed objective, and the red team's
    jv2_gate_plus. None shares code with the driver. Two of them were written
    before the driver was read. THREE REPORTS LOCALISE THE E-2 GAPS TO THE 0.25
    GRID, each by a different route: JV-1 by golden-section real-d minima, f39c27
    by a sealed real-d scan, and the red team by holding the driver fixed and
    refining d. TWO REPORTS INDEPENDENTLY FLAG THE DOMAIN EDGE AS LOAD-BEARING:
    red team OBJ-2 (CALLS == PROBE - FILL at even m) and f39c27 A3 (p > 1 at
    every optimum).
    INDEPENDENCE CAVEAT: these are independent SESSIONS of one model family.
    Every attestation reports claude-opus-5-5. JV-1 and JV-3 record
    fallback_used: true, and the red team and f39c27 record false, for the
    same runtime situation (PD-11).
  comparison_with_coordinator_prior: >-
    The prior was recorded in TASK-20261001-41f6b3 before any v2 code existed.
    It said explicitly that it was not independent of the previous round. It
    expected E-1 to E-4 to hold, and named (c) as the live overturning route.
    OUTCOME: E-1, E-3 and E-4 held, and E-2 held as a continuous-d quantity.
    (a) FIRED: the replacement gate repeats A1's failure in a new place (six
    wrong drivers pass).
    (b) did not fire.
    (c), the one I called live, did NOT fire on the v2 rows. JV-1 showed that
    the per-target descent alone is >= VOW + 0.675 bits with everything else
    free.
    (d) fired literally at four degrees. It localised to no named
    implementation, but to the d grid, which my own amendment froze while my
    plan's blind-rederivation quantity said "real d" (PD-4).
    NOT ANTICIPATED at all: FILL is an over-charge, and the plan's "FILL is a
    LOWER bound" was my wording.
    So the prior was overturned twice, in (a) and (d), and in both places the
    defect was in Coordinator-authored machinery (the gate's self-test design;
    the grid/real-d mismatch). It was not in the producer's arithmetic. That is
    recorded because it is where the next amendment must look.

  # ---------------------------------------------------------------------------
  # Rulings.
  # ---------------------------------------------------------------------------
  rulings:
    - id: R1
      question: Is RUN-SEMBIN-be48b7 admissible, and may an EV record be written?
      ruling: >-
        YES, AS AN IMPLEMENTATION-FIDELITY FIXTURE, AND ONLY AS THAT.
        EV-SEMBIN-b6d042 is written: type theoretical, direction neutral,
        strength replicated (computational), proof_status derivation,
        claim_tier crypto (parameter labels, nothing instantiated; cost-model
        tier heuristic_estimate). It carries the generic-class conditional and
        the open non-generic routes in its inference, and is quotable only with
        CORR-20261002-e58c3a's wording.
      validity_checklist:
        expected_run_count: 1 present, 1 expected, no retry (JV-1)
        schema_complete_manifest: >-
          yes. Command, commit, dirty flag and environment are recorded, and
          the manifest sha256 matches artifact-digests (JV-1, JV-3).
        seed_integrity: seedless and deterministic; the rebuild is byte-identical (JV-1)
        raw_summary_agreement: 3600/3600 rows and 240/240 counts exact (JV-1 R2, R3); text read-backs match (JV-3)
        control_comparability: >-
          VOW and PUB columns are correct and separated (JV-3; f39c27 K5). The
          FREE control shows the accounting can produce sub-rho cells (JV-1 R3).
        snapshot_binding: >-
          Content-bound: 49/49 digests, and the changed paths equal the declared
          set. The commit message and the missing receipt deviate from the card
          (PD-3; CORR K7).
      why_not_inadmissible: >-
        None of the three breaks touches the receipt's numbers relative to its
        protocol. JV-1's break is a specification over-count in the
        Coordinator-authored header, in the conservative direction, with every
        count unchanged. JV-2's break is gate POWER. The committed numbers pass
        an independent gate with the missing separators. JV-3's break is
        language, and it is repaired by correction. Ruling the receipt
        inadmissible would discard the program's only fixture of this model for
        defects that are all additive to repair.
      what_it_may_not_be_used_for: >-
        As support for H-SEMBIN-8e7ae3 (A2; exploratory_only). As a lower bound
        on any cost (K13). As evidence about any non-generic oracle, any curve,
        or GOAL-SEMBIN-5078bc criterion 4. As a constant-level statement about
        generic algorithms outside the model (K14).

    - id: R2
      question: JV-1's FILL break. Is a rerun or a re-scoring needed?
      ruling: >-
        NO RERUN. The finding is accepted in full and recorded in
        CORR-20261002-e58c3a K13 and EV-SEMBIN-b6d042 O-4. The v2 TOTALs are
        upper bounds on the construction-charged cost of their own oracle, and
        no record may quote them as lower bounds. The reviewer already computed
        every variant that could change a count (distinct FILL, budget on
        distinct entries, favourable constants, exact multiset yields), and none
        does. A rerun would buy one number the round already holds.
        Distinct-entry FILL is item AM-4 of the ordered amendment (R3).

    - id: R3
      question: JV-2's gate break and RC-1 to RC-5. Is an amendment needed now?
      ruling: >-
        ADOPTION IS ORDERED. THE AMENDMENT IS NOT WRITTEN NOW, BECAUSE NOTHING
        IS PENDING THAT IT WOULD GOVERN. No further run of EXP-SEMBIN-04ec3c is
        planned or needed. The red team says so ("No rerun of RUN-SEMBIN-be48b7
        is needed for this joint"), and R2 agrees. The committed numbers are
        independently established, so writing an amendment for a run nobody
        will launch would be a frozen protocol with no object.
        BINDING ORDER: no run of EXP-SEMBIN-04ec3c, and no experiment that
        reuses experiments/EXP-SEMBIN-04ec3c/code/v2/model_v2.py,
        gate_v2.py or run_v2.py, may be approved until an additive
        protocol_amendment under experiments/EXP-SEMBIN-04ec3c/amendments/
        (or the reusing experiment's own amendments/) adopts the following.
        AM-1 = RC-1: the four checks of jv2_gate_plus.py as STOPPING,
        written from the header block with no shared code, grid, enumerator or
        input. These are (b+) closed forms for all seven returned fields on
        every cell of the gate's own grid; (f) emitted-cell-set equality; (g) N
        from an independently parsed, probable-prime r; (h) the VOW and PUB
        columns.
        AM-2 = RC-2: W1, W2, W3, W4, W5 and W7 added to the (e) self-test as
        M5 to M10.
        AM-3 = RC-3: the planted-cell counter control as standing.
        AM-4 (from JV-1): FILL and the store budget on the distinct-entry
        count binom(2^d + s - 1, s), or both reported side by side with the
        ordered count labelled an upper bound.
        AM-5 = RC-4: minima reported on the protocol grid AND at real d (or a
        fine grid), and any expectation compared on the same grid.
        AM-6 (from JV-1 L-4): C-DEGENERATE-M flags |F| < m.
        AM-7 (from JV-1): memory in bits beside entries.
        AM-8 = RC-5: the proves-too-much objects as a standing regression
        (Harley exponents exact; generic cells about 1 bit above the analytic
        floor), non-stopping.
        The same order binds the HEUR-HARVEST-FV harness by analogy (R11): any
        gate there is written from the statement, with no shared code, and with
        designed power against each defect class JV-2 names.
      trigger: >-
        The first Coordinator decision that proposes approving a run under this
        driver or gate writes the amendment, with a minted id, before approval.
        That decision cites this ruling.

    - id: R4
      question: JV-1's exploratory EXT crossing of BLopt by 0.567 bits. Is it a break or an escalation?
      ruling: >-
        NEITHER. (1) EXT is the reviewer's own construction, outside the v2
        oracle laws, and is not a v2 row. (2) Algebraically it is randomised
        baby-step giant-step: a generic algorithm, not index calculus. (3) The
        0.567-bit gap is the constant ratio between randomised BSGS (2 sqrt(TN))
        and Bernstein-Lange's optimised amortisation formula (2.96 sqrt(TN)) as
        the reviewer derived it from the KN-LIT-7cc07f anchor. Against
        Kuhn-Struik, the correct amortised comparator with unconstrained memory,
        EXT loses by +0.50. That constant is marked "not re-verified" in
        KN-LIT-f47b10. (4) Against BL at matched advice size it loses by at
        least 23 bits. Nothing proposes a sub-rho or exponent-moving
        decomposition oracle, so rule 12 and DEC-20261001-5c9e7a R3
        mandatory_revisit are not engaged. Residual: the two constants are
        unverified at source. That is a low-rank curation item, and no record
        relies on the 0.50.

    - id: R5
      question: JV-3's language break.
      ruling: >-
        ACCEPTED. CORR-20261002-e58c3a K1 to K12 apply the twelve wordings,
        with one narrowing (K14) of the "corollary of Shoup" sentence to
        exponent level. K15 corrects "(e) gate power: pass", K16 records two
        completeness gaps, and K7 records the snapshot-commit deviation. No
        producer artifact, manifest or commit is edited. JV-3 O2 is also
        adopted: an EV restatement says "the model's three generic-class laws"
        and rests the generic-class conclusion on Shoup/Wagner, not on
        MITM_CAPPED's law.

    - id: R6
      question: The blind re-derivation, and prior item (d).
      ruling: >-
        The E-2 disagreements are RESOLVED AS A GRID EFFECT. Three routes reach
        the same localisation (convergence). Under AMD-20261001-e61f2b
        (what_this_does_not_change: "the d grid ... of v1") the protocol
        quantity IS the 0.25-grid minimum, and the driver computes it exactly.
        E-2 and the blind task statement are continuous-d quantities. The
        disagreement_rule's "localised to one of three named implementations"
        could not be satisfied as written, because the mismatch is in the
        protocol definition, which I authored (PD-4). Reported figures carry
        both values (CORR K10). f39c27's "incomplete" verdict reflects read
        scope only, and JV-1 covers that scope (composition).

    - id: R7
      question: Hypothesis and experiment status.
      ruling: >-
        H-SEMBIN-8e7ae3: specified -> ANALYZED, its binding ceiling
        (DEC-20260928-7c3d91). It goes no higher.
        EXP-SEMBIN-04ec3c: approved -> ANALYZED. Its v2 run is completed,
        reviewed and admitted (R1).
      reasons:
        - >-
          DEC-20261001-5c9e7a next_actions licensed exactly this: "on admissible
          evidence, move H-SEMBIN-8e7ae3 no higher than `analyzed`". Admissible
          evidence now exists, and the round on it is composed.
        - >-
          `analyzed` carries no direction. EV-SEMBIN-b6d042 is neutral, so the
          move records that the hypothesis's test has been run and read. It
          does not record that the hypothesis stands. The statement's mechanism,
          the m-independence clause of its prediction 1, and HEUR-GENERIC-MSUM
          remain withdrawn or contradicted as DEC-20261001-5c9e7a R6 recorded.
        - >-
          The intermediate states approved and running are passed through,
          not skipped. DEC-20260928-7c3d91 deliberately records approval on the
          EXPERIMENT, and the experiment was approved, ran and is analyzed. A
          hypothesis status that trailed it would read as "untested", which is
          false.
        - >-
          Not weakened or rejected: the conclusion is not contradicted, and no
          adverse refutation artifact exists or is sought. Not superseded yet:
          H-SEMBIN-c7e1d4 is not filed (R9). The next move is to `superseded`,
          by the decision composing REVIEW-SEMBIN-20261002-c7e1d4.
      how_recorded: >-
        By READ-THROUGH, the pattern DEC-20261001-5c9e7a R6 used for
        HEUR-GENERIC-MSUM. ledger/hypotheses/H-SEMBIN-8e7ae3.yaml and
        experiments/EXP-SEMBIN-04ec3c/specification.yaml are NOT edited, on the
        instruction that records are immutable. Their `status` fields keep
        reading `specified` and `approved`, and this decision is the
        authoritative state (official_transitions). The cost is that tooling
        reading the files understates by two lifecycle steps, which is the
        conservative direction. Disclosed as PD-12.

    - id: R8
      question: TASK-20261001-9b3e70 DERIVATION.md section 2.5. The literal (C-yes) trigger fired. Is review-breakthrough at max convened?
      ruling: >-
        NOT CONVENED. It is recorded as a trigger-wording collision of the
        DEC-20261001-5c9e7a PD-7 kind (PD-6 here). The residual is assigned to a
        red-team joint, and the trigger is re-worded for every future card.
      reasons:
        - >-
          The governing text is DEC-20261001-5c9e7a R3 mandatory_revisit (i):
          "a sub-rho or exponent-moving decomposition oracle on a binary curve,
          including IDEA-20260930-4b7d1e outcome (C-yes)". "(C-yes)" was
          included because it was then read as voiding P3, i.e. as sub-rho.
          The operative condition is sub-rho or exponent-moving. The candidate
          is neither. Its own record says sub_rho: no; exponent_moving: no;
          novelty_status: known.
        - >-
          Witness (i), PCS batched harvesting, is NOT a decomposition oracle.
          Its distinguished-point store depends on Q. It is the 1999 algorithm
          DEC-20261001-5c9e7a already read (J3 O2; AMD X-6). Its best
          constructed cell at n = 131 is +7.17 bits ABOVE the VOW column
          (scratch arithmetic, which reproduces J3's figure). It fires the
          trigger only because the trigger's two thresholds, per-relation
          sqrt(l) and T M vs |F| l / 4, are not generic invariants:
          amortisation alone crosses the per-relation line (DERIVATION.md
          section 2.3).
        - >-
          Witness (ii), a dense-regime strict hybrid, is a derivation sketch
          with NO numbers, because the producer stopped as the card required.
          It proposes nothing.
        - >-
          AGENTS.md rule 12 binds on a claim PROPOSED as a break, a closure or
          a contradiction of validated evidence. None is proposed. Nothing is
          downgraded: no claim that needs the max tier is being moved by a
          lower one, and the tier remains mandatory the moment a
          record proposes what it exists for (below).
      residual_uncertainty_and_where_it_goes: >-
        Two gaps are real and are NOT closed by this ruling. (1) Cor. 1 bounds
        generic algorithms only at Omega(sqrt l) with an unspecified constant.
        It does not by itself exclude a generic harvester below the VOW column
        at CONSTANT level (DERIVATION.md section 3.4 item 1). (2) The
        dense-regime hybrid numbers (coupon correction; DERIVATION.md section
        2.4) were never derived. Both are assigned as joint JR-2 of
        REVIEW-SEMBIN-20261002-c7e1d4 (red team, TASK-20261002-46ba70). Its
        breaking artifact is any generic harvesting configuration whose
        fill-charged total for K = |F| relations, LA included, falls below the
        VOW column at a listed degree. If JR-2 produces one,
        review-breakthrough at max is MANDATORY, non-degradable, in its own
        independent session, after the IMP-SEMBIN-REVIEW-MAX recheck. If max
        cannot be served, the claim stays un-promoted.
      trigger_reworded_for_future_cards: >-
        From this decision on, a (C-yes)-type escalation trigger is stated on
        generic invariants, never on per-relation sqrt(l) or on T M against
        |F| l. A record is rule-12 material when it proposes, at any listed
        degree, (a) a harvester whose total cost for the relations it needs
        (fill charged, linear algebra included) is below the VOW column; or (b)
        an exponent below 1/2 in T against c sqrt(K l), or below the T^2 M ~
        K^2 l frontier, for a harvester OUTSIDE the generic class.
      effect_on_P3_and_IDEA_4b7d1e: >-
        No further withdrawal of P3 beyond DEC-20261001-5c9e7a R6. Voiding it
        needs a sub-rho cell, and none is proposed. IDEA-20260930-4b7d1e's
        inference "(C-yes) => P3 void" is invalid as stated. Its claim (B),
        "per relation >= min(sqrt l, l/coverage)", is read as holding only in
        the sparse regime (DERIVATION.md section 2.4). That reading is
        unreviewed, and JR-2 checks it. The idea record is not edited.

    - id: R9
      question: File H-SEMBIN-c7e1d4 and HEUR-HARVEST-FV now?
      ruling: >-
        NOT NOW. A REVIEW ROUND IS PLANNED FIRST, AS THE PRIOR DECISION
        COMMITTED. TASK-20261001-9b3e70's review_plan_note binds: "If the
        Coordinator later proposes to commit D4 and move H-SEMBIN-8e7ae3 to
        `superseded`, that decision first writes a review plan for D1-D4." The
        plan REVIEW-SEMBIN-20261002-c7e1d4 is written now, on
        TASK-20261002-c13d8e, and its two reviewer cards (TASK-20261002-9e27f4,
        TASK-20261002-46ba70) are written now. They are committed by
        TASK-20261002-31c9d7 BEFORE either reviewer is dispatched. Whether to
        file is decided by the decision that composes that round.
      why_review_before_filing:
        - >-
          The generic layer's interface (COR-GEN, conditions G1 to G4) adapts
          Dai's reduction to negation- and lambda-closed lists, and includes a
          "non-trivial relation" form. The author marks both "mine, derivation,
          unreviewed". The draft's statement rests on them (SD-2).
        - >-
          The draft's mechanism sentence ("The v1 sub-rho cells existed only
          because the fill was not charged") is narrowed by CORR-20261002-e58c3a
          K4. Either correction alone removes them. The superseding record must
          not carry the unnarrowed form.
        - >-
          The draft's dominated_by quotes E-2 margins "(+16.54 ... +42.70)".
          These now have an admissible receipt, with the grid and FILL caveats
          (EV-SEMBIN-b6d042 O-4, O-5).
        - >-
          The §2.5 residual (R8) belongs to the same round.
      heur_harvest_fv: >-
        The names HEUR-HARVEST-FV-1 (distributional) and HEUR-HARVEST-FV-2
        (algorithmic, fill charged) are RESERVED with that numbering. They are
        not adopted, and they enter the ledger only inside H-SEMBIN-c7e1d4's
        heuristic_assumptions, if and when that record is filed. Their
        validation is scheduled now (R11), as promotion gate 2 and the
        dispatch-bias rule require for any conditional result.

    - id: R10
      question: The four KN-OPEN candidate texts (DERIVATION.md section 5, OPEN-A to OPEN-D).
      ruling: >-
        NOT FILED NOW. They are assigned as joint JR-4 of
        REVIEW-SEMBIN-20261002-c7e1d4 (validator), which checks precision and
        non-duplication. The composing decision files each candidate that
        passes, following /curate-knowledge conventions.
      reasons:
        - >-
          Duplication risk is concrete. KN-OPEN-d218ec (Assumption 1 and d_F4),
          KN-OPEN-002 (prime-field solving degree), KN-OPEN-7f0511 (Nagao's
          first-fall definition), KN-OPEN-3c8f51 and KN-OPEN-046735 sit near
          OPEN-B. KN-OPEN-5e3dd0 (an algebraic membership description for a
          Frobenius-stable orbit-union factor base) sits near OPEN-D. Their
          titles were read here, not their bodies.
        - >-
          They are single-session text. OPEN-C's "relations <~ T|F|/l + T^2/l"
          is the author's unreviewed sketch.
      priority_note: >-
        Under docs/target-result-profile.md, OPEN-A (approximate
        characteristic-2 x-filters) and OPEN-B (FFDA-type solving degree) are
        the only places in this lane where an exponent can move. OPEN-C cannot
        move one, and OPEN-D has no named candidate. Once JR-4 confirms OPEN-A
        is precise and not a duplicate, its toy ladder (J3 RC5: bucket gain
        against j with a SHA null and Tr(x) as positive control) is ranked
        AHEAD of any further generic-family bookkeeping. This is the
        exponent-targeting bias applied. It is not a closure of the generic
        family, which is complete, at sota_delta 0, rather than closed.

    - id: R11
      question: Heuristic-validation pairing for the conditional restatement.
      ruling: >-
        TASK-20261002-a84e65 IS CARDED: a zero-run design of the
        HEUR-HARVEST-FV-1(a) toy statistic, V1 of heuristic-restatement.md
        section 5. It counts the non-trivial two-sum coincidence count N_2 of
        F_V against a closure-matched random-list null, with an
        arithmetic-progression positive control, at toy n in {31, 37, 41, 43,
        47}. It draws on no other heuristic, costs seconds per cell, and is
        the cheapest discriminator the restatement offers. Its contract may not
        be APPROVED until (i) H-SEMBIN-c7e1d4, or a superseding record carrying
        HEUR-HARVEST-FV-1, is filed, and (ii) JR-3's verdict on the
        heuristic's formal statement is composed. A changed statement is a
        re-draft before approval, never an amendment after.
        The design is snapshot-archived by TASK-20261002-5f0b2c, which is bound
        before dispatch.

