    - >-
      AN ADMISSIBLE FIXTURE IS WORTH HAVING EVEN WHEN ITS CONCLUSION WAS KNOWN.
      DEC-20261001-5c9e7a R5 bought this run for exactly three things: an
      admissible receipt, a gate-power result, and a frozen fixture. The first
      and third are delivered. The second is delivered NEGATIVELY: the gate's
      self-test is shown to lack power. That is the more useful answer, because
      it says what the next gate must contain.
    - >-
      THREE BREAKS, ZERO COUNT CHANGES, ZERO RERUNS. Each break was checked for
      whether it could move the zero, and the reviewer who found it computed
      that it does not (JV-1 under every FILL, budget and yield variant; JV-2
      in every completed wrong run; JV-3 on read-backs). Repairing each by an
      additive record, rather than a rerun, is proportional.
    - >-
      THE DEFECTS WERE IN THE COORDINATOR'S MACHINERY. Both overturned prior
      items, (a) and (d), and the unanticipated FILL finding sit in text I
      wrote: the gate's self-test design, the grid/real-d mismatch, and "FILL is
      a lower bound". They are recorded as mine, because the next amendment is
      mine too.
    - >-
      THE (C-yes) RULING FOLLOWS THE OPERATIVE CONDITION, NOT THE WORDING, AND
      KEEPS THE RESIDUAL OPEN. Convening max on an algorithm 7 bits above rho
      would spend the tier on a known method. Ignoring the residual would leave
      the constant-level gap of Cor. 1 unexamined. Both errors are avoided by
      assigning the residual to an adversarial joint with a concrete breaking
      artifact that re-arms the tier automatically.
    - >-
      THE VALUE OF THIS LANE NOW LIES OUTSIDE IT. The generic family is
      complete at sota_delta 0. The restatement and its heuristic are worth
      filing because they make the family's numbers VALIDATABLE, which
      HEUR-GENERIC-MSUM never was. The exponent stakes are OPEN-A and OPEN-B,
      and R10 ranks them accordingly.

