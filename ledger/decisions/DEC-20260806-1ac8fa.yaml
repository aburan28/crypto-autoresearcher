coordinator_decision:
  id: DEC-20260806-1ac8fa
  decided_by: coordinator
  decided_at: '2026-08-06'
  decision: expand
  target_ids:
  - GOAL-HQC-001
  - EXP-HQC-982268
  - H-HQC-18d1b4
  - EV-HQC-bfb257
  context: "BATCH-a5c525 dispatched DEC-20260806-0995d5's next_action, scoped conservatively per its own
    instruction: a cost model and small calibration benchmark for a real-sampler defect-injection
    experiment, NOT the experiment itself. TASK-20260806-77443e built it; TASK-20260806-f238a2
    snapshotted it before either review; TASK-20260806-069687 (Validator) and TASK-20260806-e13ecc (Red
    Team) reviewed it independently and in parallel, both offering a recommendation rather than a
    decision. This decision makes the go/no-go call and closes the batch on their reports plus
    EV-HQC-bfb257."
  decision_label: partial_go_pilot_scale_only_real_sampler_injection
  rationale:
  - 'GO, AT PILOT SCALE ONLY -- NOT THE EXECUTOR''S FULL T_req-SCALE RUN, AND NOT A PAUSE. Both reviewers
    ADMIT the cost model. Both independently confirm PS-R3-scale (139-392 core-seconds) is affordable
    against the roughly 4,978 seconds remaining, robust to which of the two disclosed throughput figures
    is used. The mechanical injection point requires no new machinery. This is the first genuinely
    tractable path this six-batch campaign has toward exercising the actual code OPEN-6 is concerned
    with, after three control-arm generations that structurally could not.'
  - 'THE RED TEAM''S NARROWER FRAMING IS ADOPTED OVER THE EXECUTOR''S. The executor recommended committing
    directly to the full T_req-scale run (roughly 305,000 trials per its own derivation). The Red Team
    named two reasons this is premature: the cost estimate has never been corroborated against an
    actual defect-injected run (both throughput figures were measured on the UNDEFECTED pipeline), and
    the required-T calculation carries forward a detection-rate assumption already shown, in
    EV-HQC-163374, to be a toy-scale artifact rather than a transferable figure. A cheap PILOT that
    tests mechanical soundness and any measurable signal, before committing to the full run, is the more
    disciplined use of budget -- consistent with how every prior batch in this campaign has been scoped
    (Stage A before the full PS-R3 measurement in BATCH-6fddee/0a65c0; V1 before V2 before V3).'
  - 'A STOPPING RULE IS PRE-COMMITTED, ADOPTING THE RED TEAM''S PROPOSAL EXPLICITLY RATHER THAN LEAVING IT
    IMPLICIT. If the pilot succeeds cleanly (defect mechanically injectable, self-checks pass, a
    measurable signal or a clean null is obtained without requiring structural redesign), the next batch
    scales to the full T_req run. If the pilot instead reveals the injection needs a structural redesign
    -- the same category of finding that forced V1 to become V2 -- the next action is NOT an automatic
    rebuild. It is a PAUSE REVIEW against this goal''s own declared pause_conditions, weighing the
    Red Team''s named case (six batches of instrument-trust work, zero progress on the goal''s other two
    completion criteria, standardized parameters confirmed infeasible by roughly 38-39 orders of
    magnitude) on its merits at that point, with fresh numbers rather than today''s.'
  - 'THE VALIDATOR''S CORRECTION IS APPLIED, NOT JUST NOTED: the PS-R5 cost-table defect (a throughput
    figure mixed into a cost-in-core-seconds cell) is recorded here as ~1,717 core-seconds, a single
    value, not a range. This does not change today''s decision -- PS-R5 was already MARGINAL and is not
    in scope for the pilot -- but it corrects the record for whichever batch eventually revisits
    standardized-parameter feasibility.'
  - 'A CANDIDATE KNOWLEDGE-PROMOTION SIGNAL IS NAMED, NOT PROMOTED. The Validator''s three targeted probes
    (measurement-order reversal, decode_blocks isolation, steady-state repetition) that resolved the
    executor''s disclosed throughput discrepancy are a genuine methodological contribution --
    demonstrating that a single microbenchmark can be off by ~2.8x from interpreter warm-up effects alone,
    and that reproducing a discrepancy with independent code is not the same as explaining it. This is
    held per knowledge_promotion below rather than promoted from one instance.'
  evidence_refs:
  - EV-HQC-bfb257
  - EV-HQC-163374
  - EV-HQC-9a30d3
  - EV-HQC-db1fd9
  - EV-HQC-b71230
  - coordination/goals/GOAL-HQC-001/batches/BATCH-a5c525/reviews/TASK-20260806-069687/validation_report.yaml
  - coordination/goals/GOAL-HQC-001/batches/BATCH-a5c525/reviews/TASK-20260806-e13ecc/red_team_report.md
  limitations:
  - NO statement about HQC, its decoding-failure rate, assumption A17 or A5, or any standardized
    parameter set. Claim tier stays toy. This decision authorizes a PILOT, not a claim.
  - H-HQC-18d1b4 UNCHANGED at proposed. No measurement of HQC has occurred in four consecutive batches of
    instrument-trust and feasibility work.
  - experiments/EXP-HQC-982268/specification.yaml is not amended by this decision. A real-sampler pilot,
    if it succeeds, will require its own protocol amendment or new experiment record before a full run is
    authorized -- this decision does not pre-authorize that.
  - None of the four asymptotic-complexity promotion gates is engaged; none is claimed.
  - "Standardized-parameter feasibility remains as characterized: PS-A's true k=m=16 astronomically
    infeasible, PS-A k=3 and PS-R1 k=m=16 not affordable at current budget (2-5x over), PS-R5 marginal
    (35-45 percent of remaining budget). None of these is authorized by this decision."
  knowledge_promotion:
    promoted: []
    not_warranted: 'The microbenchmark-discrepancy-resolution methodology (order-reversal, component
      isolation, steady-state repetition to distinguish warm-up artifacts from genuine cost asymmetry) is
      a real, generalizable technique candidate, but is held pending a second instance outside this one
      cost-model task -- one demonstrated resolution is a data point, not yet a technique. No KN-FIND:
      this batch measured feasibility, not HQC.'
  next_actions:
  - "Dispatch a PILOT real-sampler defect-injection task, explicitly bounded smaller than the executor's
    full T_req-scale recommendation: inject the V1/V3-class boundary-index-shift defect (off-by-one
    truncation or last-block-window-read-early, the same shape all three control arms tested) at one of
    the four mechanically-confirmed locations in stage_a.py, at a small trial count (low thousands, enough
    to confirm the injection is mechanically sound and self-checks behave correctly, NOT enough to
    constitute the full statistically-powered result), and report whether ANY measurable signal or a
    clean null is obtained, plus the actual defect-injected throughput (finally corroborating or revising
    the cost model's undefected-pipeline benchmarks)."
  - "PRE-COMMITTED STOPPING RULE, BINDING ON THE NEXT BATCH'S LEDGER ARCHIVE: if the pilot succeeds cleanly
    (no structural redesign needed), scale to the full T_req run (roughly 305,000 trials, 139-392
    core-seconds per this batch's model, to be re-benchmarked against the pilot's own actuals) in the
    batch after that. If the pilot reveals a structural-redesign need, the next action is a PAUSE REVIEW
    against GOAL-HQC-001's declared pause_conditions -- not an automatic V2-style rebuild -- weighing the
    Red Team's named case with that point's actual findings."
  - "Only after a real-sampler result (pilot or full) is obtained should the remaining resume-plan items
    from DEC-20260806-2947ba be attempted: the missing extrapolation to standardized parameters, PS-R3's
    second independent reviewer, and the remaining named harness repairs."
  - "Carry forward, lowest priority: the unreconciled run-count discrepancy from the V1 arm (BATCH-4b8ad3)
    remains unresolved."
