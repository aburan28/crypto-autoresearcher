coordinator_decision:
  id: DEC-20260803-f2d3a4
  goal_id: GOAL-MLKEM-003
  batch_id: BATCH-012
  recorded_at: '2026-08-03'
  decision: pause
  decision_label: paused_on_declared_infrastructure_blocker_provider_session_limit

  context: >-
    DEC-20260803-2e82d5 opened BATCH-012 to run the red team's C3 check: replace
    the Gaussian-Phi surrogate's K*v^p by the exact region measure from (4.10),
    (4.11) and (4.24) at alpha=2, refit, and score against the closed-form
    counting-noise floor -- the first time the program would test the object it
    has been naming since BATCH-009. The producer TASK-20260803-b762a1
    terminated on a provider session limit ("resets 6:10am UTC") before writing
    any artifact.

  pause_condition_triggered: >-
    "A definitive infrastructure, authentication, or dependency blocker prevents
    the next approved task." This is a declared pause condition on
    GOAL-MLKEM-003 and it is the one that fired.

  why_this_is_a_blocker_and_not_a_hiccup: >-
    This is the SECOND task in this goal killed by the same provider session
    limit. The first was TASK-20260802-08f428, BATCH-009's independent
    validation, whose receipt is committed at 08ff4302 and which was repaired by
    the successor TASK-20260803-bc8c1f. That repair was correct because the limit
    had reset by then. Here the limit is live with a fixed reset at 06:10 UTC.
    Dispatching a successor now would spend the goal's next task on a call that
    fails the same way, and would put a second empty failure receipt in the
    record for no information gain. One occurrence is noise; two in the same goal
    against a limit with a known reset is a blocker, and the honest response is
    to stop and say so rather than to keep dispatching into it.

  what_this_pause_asserts: >-
    NOTHING ABOUT THE RESEARCH. AGENTS.md rule 5 governs: a provider session
    limit is an infrastructure fact and is not evidence about the C3 check in
    either direction. It says nothing about whether the exact region measure
    would fit better than the surrogate, and nothing about ML-KEM.

  what_stands_unchanged:
    - >-
      EV-MLKEM-2e668d and DEC-20260803-2e82d5. The BATCH-011 findings stand
      exactly as committed: the misspecification conclusion survives narrowed on
      the count>=1000 sub-band evidence (16.5x and 24.8x the counting floor), the
      "0.426 rather than 0" argument is struck, the attribution to Approximation
      4.9's family is struck, and the object under test has still never been
      instantiated.
    - >-
      EV-MLKEM-019, EV-MLKEM-eac95b, EV-MLKEM-017 and every earlier record.
    - >-
      Rule 12 remains UNMET and UNWAIVED. EV-MLKEM-011, EV-MLKEM-013 and
      EV-MLKEM-017 keep their status; KN-FIND-031 stays withdrawn; the
      KN-FIND-012 restatement and KN-FIND-014 withdrawal remain owed.

  goal_status_transition:
    from: active
    to: paused
    reason: declared_infrastructure_blocker_provider_session_limit

  resume_action: >-
    After the provider limit resets, dispatch a SUCCESSOR to TASK-20260803-b762a1
    under a new identifier -- never a retry of the failed id, which keeps its
    failed state and its receipt -- carrying the unchanged C3 objective: replace
    K*v^p by the exact region measure from (4.10), (4.11) and (4.24) at alpha=2,
    refit, and score against the closed-form counting-noise floor (0.3406 bits
    for n=43, 0.3276 for n=50) from the outset rather than against zero. Carry an
    independent validation of that counting-floor computation in the same batch,
    since every current conclusion rests on it and it has had none. The remaining
    BATCH-012 tasks TASK-20260803-5b602c, -bddfa7 and -b1f24c stay queued and are
    repointed to the successor.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      A pause on an infrastructure blocker establishes nothing and produced no
      measurement. There is nothing to promote.
    promote: false

  non_claims:
    - ML-KEM is not broken.
    - KN-OPEN-016 remains open.
    - >-
      Approximation 4.9 is neither validated nor refuted, and this pause changes
      nothing about that; the C3 check that would have tested it did not run.
    - >-
      The pause is not a closure, not a completion, and not a negative result. No
      completion criterion was met.
    - No closure quorum is asserted or sought.

  references:
