  official_transitions:
    H-SEMBIN-4a80f3:
      from: approved
      to: weakened
      basis: >-
        Of six preregistered predictions: P3 (C2, memory-charged: Nagao above vOW at
        ALL five labels for ALL three omega, no crossover below n = 571) FAILS in the
        charged model at n = 571 under the coherent memory reading for omega in
        {2.376, 2.807} at every bound-B-satisfying grid C_0 and for omega = 3.0 at
        C_0 >= 10 (EV-SEMBIN-f4408c O-6; validated N4 for the arithmetic and B1 at the
        review-breakthrough tier for the reading), so C2's own falsification criterion
        -- a memory-charging crossover below n = 571 at committed omega and defensible
        C_0 -- is met and has received the independent max-tier review the criterion
        itself demanded. P1's growth orders HOLD (O-2) but its inference that Theorem
        1's exponent "is not the stated one" is reading-dependent and its
        non-polynomiality reading is refuted (O-11, O-12, validated B2). P4 (C3)
        FAILS over the defensible C_0 range as worded (5.25-13.41 bits against a
        46-bit omega spread) and holds only over the undeclared full range (O-1). P2,
        P5 (as adjudicated in PD-K) and P6 HOLD. `weakened` rather than `rejected`
        because the hypothesis's headline -- Theorem 1 has no concrete consequence for
        any standardised binary curve -- is untouched and every reviewer restates it
        as a conclusion; because the tested scope is a charged closed form under
        premises this program cannot measure (rule 6, IMP-SEMBIN-ENGINE); and because
        every falsifying margin (2.1-45.9 bits) is inside one degree of solving-degree
        slack (52-67 bits) and, at omega >= 2.807, inside 2^{23.2} of unquantified
        Lemma-2 constant (O-7). `weakened` rather than `inconclusive` because three
        preregistered predictions failed as written and the failures were validated at
        the tier the contract required; hiding that behind `inconclusive` would leave
        the ledger reading as if "memory is where it dies" had survived contact with
        the arithmetic. Rather than `supported` for the same reason.
    EXP-SEMBIN-db9bc3:
      from: approved
      to: analyzed
      basis: >-
        Evidence record EV-SEMBIN-f4408c written and archived under this decision.
        The contract head was left at `approved` when RUN-SEMBIN-251fd3 was archived
        by TASK-20260913-a10007; `running` and `completed` status_history entries are
        recorded on the head under this archive so that the transition is reachable,
        following DEC-20260913-2386b5's pattern for EXP-SEMBIN-92724f.

  confirmed_priors:
    - joint: N1
      prior: >-
        "I EXPECT N1 TO HOLD ON THE ARITHMETIC AND TO SURFACE TWO PRODUCER CHOICES THE
        CONTRACT DID NOT MAKE ... at most 1 under eps = 0.01 or a 0.5-bit tolerance ...
        the (n = 20, k = 2) structured-V z = 2.09 to be the one chance cell in 28."
      finding: >-
        Confirmed, and sharper than expected: eps = 0.01 moves nothing at all; the
        alternative conditioning moves nothing because the two definitions agree to
        6e-5 bits from C_0 = 4 upward; the enumeration matches exactly. The validator
        added the non-monotonicity of bound B in C_0 (monotone closure) and the pooled
        z-score's variance imprecision, neither of which the prior anticipated and
        neither of which changes a value.
      by: TASK-20260913-3b91d0
    - joint: N3
      prior: >-
        "I EXPECT N3 TO HOLD ... ARM M's nulls equal columns T4 and T5 BY CONSTRUCTION
        ... PD-4's tolerance policy to be UNVERIFIABLE from committed history."
      finding: >-
        Confirmed on every point. The validator added that 26 of 107 gate cells exceed
        the literal 1e-3 (the contract defect adjudicated in PD-K) and that the two
        driver executions redefined two control flags, not only labels.
      by: TASK-20260913-3b91d0
    - joint: N4
      prior: >-
        "I EXPECT THE ARITHMETIC TO HOLD to rounding at every recomputed cell, the
        flag counts 242 / 180 / 120 to be reproducible ... T6 ... below 65 bits against
        a time column above 140."
      finding: >-
        Confirmed to 1.9e-9 bits over 320 cells; counts reproduce under the validator's
        own bound-B; largest T6 in the 120 is 63.5 bits against a smallest time of
        136.4, and max(T6 - time) = -87.2. The prior's mechanism sentence for the
        non-monotone crossovers ("T4 grows with m at fixed slack") is imprecise, as is
        the producer's: the phenomenon is the ceiling saw-tooth in the yield slack.
      by: TASK-20260913-3b91d0
    - joint: B1
      prior: >-
        "I EXPECT B1 TO HOLD AS ARITHMETIC AND TO SUPPORT NO CLAIM ABOUT ANY CURVE, and
        I expect the max reviewer to find that the FROZEN-WIDTH MEMORY READING IS THE
        WEAK JOINT ... the flags at n = 409 do not survive a defensible memory model;
        the flags at n = 571 survive it under omega <= 2.807 but sit within the absorbed
        constant; the flags at omega = 2.376 rest on an omega no implementation reaches
        ... 'first fall degree assumption' as granted is the STRONG version."
      finding: >-
        Confirmed on every point named, with two sharpenings the prior did not
        contain: dense width^2 is the CEILING of the coherent memory readings (T x M
        = r^omega D^2 is monotone in the row count r), so no memory model can rescue
        P3 at n = 571 -- only the constants and the grant can -- and cheaper coherent
        readings would restore the n = 409 flags; and omega = 3.0 also survives at
        C_0 >= 10 (4.3-13.1 bits), which "omega <= 2.807" understated. The prior's
        what_would_change_my_mind ("a defect in the charging that erases the n = 571
        flags under the dense reading too") is answered: there is none within the
        model as stated.
      by: TASK-20260913-f6652f
    - joint: blind_rederivation
      prior: >-
        "I EXPECT AGREEMENT to within 0.1 bits at cell A under the ceil-m reading, and
        I EXPECT A LOAD-BEARING AMBIGUITY TO SURFACE IN T4 at cell B: HEUR-2 ... does
        not say whether the expectation is taken of the product or of its logarithm,
        and the two readings differ at exactly the bound-B-violating cells."
      finding: >-
        Confirmed. Agreement to 0.01 bits at both cells under the producer's
        conventions, which the re-deriver reached independently as one of its
        enumerated readings; the T4 ambiguity at cell B is 20.2 bits across the
        readings (and 3.3 at cell A, mostly the rounding of m), plus a +inf branch the
        prior did not anticipate (unconditional expectation of a logarithm). The
        re-deriver also surfaced that time_only has no interior Pareto minimum and
        that vOW memory is in bits against Nagao memory in field elements -- both
        determined by the statement, neither described by its labels.
      by: TASK-20260913-7fb774
  refuted_priors:
    - joint: N2
      prior: >-
        "WHERE I THINK IT BREAKS: the producer charges area_time_AT and
        time_memory_product identically ... If EXP-SEMBIN-f4a17b's committed AT
        definition charges processor area beside store memory, AT != T x M ... I expect
        the difference to be a small constant (a few bits at most)."
      finding: >-
        Refuted as a break and confirmed as a hold: the committed AT definition models
        no processor area and says so ("identical to the product here because no
        separate area term is modelled"), so AT and T x M are bit-identical by
        definition and the > 3-bit break condition could never fire. The counterfactual
        with processor area (+1.0 to +9.1 bits to vOW at n = 571) runs AGAINST Nagao
        and would create more flags, not fewer. The prior misremembered the committed
        definition. The validator also found the plan's N2(3) mislabelled its source
        (PD-J). Partly overturned; the joint holds.
      by: TASK-20260913-3b91d0
    - joint: B2
      prior: >-
        "I EXPECT B2 TO HOLD ... On the SECOND READING (cosets chosen after testing) I
        expect the reviewer to find that Nagao's text does not settle it ... C1 is
        reading-dependent and HEUR-1 formalises the fixed-coset reading only."
      finding: >-
        The conclusions hold (polynomial; 8 omega + 2 up to polylog; trigger (b)
        correctly not fired; searched reading dissolves both bounds; C1
        reading-dependent; no published result contradicted). The reading of the TEXT
        is partly overturned: Section 7 and Algorithm 2 fix the v_i by disjointness
        alone and remedy both failure modes by "choose suitable constant C_0", so the
        fixed-coset reading is the text's own and searching is a repair the text
        permits but does not describe. A third reading the plan did not name --
        over-provision m by a constant factor with cosets fixed -- leaves only bound
        A binding and keeps the stated exponent 8 omega + 1 up to polylog. C1's
        "not a constant" conclusion survives two of three readings; its exponent
        conclusion depends on which is taken.
      by: TASK-20260913-f6652f
    - joint: contract_prior_on_ARM_C
      prior: >-
        The Coordinator's prior at contract approval (DEC-20260913-d02263; EXP-SEMBIN-db9bc3
        coordinator_prior) that ARM C would force C_0 = Omega(log n) AND that Theorem 1
        would then be non-polynomial as stated.
      finding: >-
        First half confirmed (bound B is Theta(log n) under the fixed-coset reading);
        second half REFUTED in every reading (O-11): under bound B the decompose cost is
        Theta(n^{8 omega + 2} / polylog), polynomial. Recorded by the producer as
        overturned and confirmed so at the review-breakthrough tier.
      by: TASK-20260913-f6652f

  procedure_deviations:
    - id: PD-I
      what: >-
        INFRASTRUCTURE HISTORY OF THE ROUND. Attempt 1 of all three reviewer tasks was
        dispatched at ~23:55Z 2026-09-13 in the background; the VM was suspended at the
        end of the Coordinator's turn and the sessions produced nothing visible by
        12:21Z 2026-09-14 (3b91d0 had written one scratch file at 23:57Z). The
        Coordinator released the three lane claims as failed_infrastructure and
        re-claimed them for attempt 2 (epoch 2), then dispatched attempt 2 in the
        FOREGROUND at ~12:55Z. Evidence on disk shows the attempt-1 sessions had been
        RESUMED by the runtime when the VM resumed and were live in the same write
        scopes: 3b91d0/scratch/ carries scripts with mtimes 12:28-12:52Z (before
        attempt 2 began), which attempt 2's report describes as its own and ran at
        12:57Z; 7fb774's write scope already held a rederivation.md and
        rederived-values.json (mtimes 12:39 / 12:43Z) when attempt 2 arrived, which
        attempt 2 moved UNREAD to preexisting-unread/ (its A-0); and the attempt-2
        Task call for f6652f returned a backend usage-limit stop while a session of the
        same task completed report.md and attestation.yaml at 13:34Z describing itself
        as attempt 2 with "an earlier incarnation of attempt 2 cut after writing
        scratch scripts". WHAT THIS DOES AND DOES NOT TOUCH. Every incarnation ran the
        same handoff under the same constraints (same read scope, same blindness, same
        sibling prohibition), so no incarnation had access another lacked and the
        independence checker's PASS is not undermined; the blind task's attempt-1
        outputs are an unattested SECOND blind derivation, quarantined and not used in
        the comparison; the ordinary task's attempt-2 report is internally consistent
        and every figure in it is reproduced by a script on disk. What is lost is
        exact provenance of which incarnation wrote which byte for 3b91d0's scratch
        and for f6652f, and the "attempt: 2" fields in those attestations are the
        sessions' self-description rather than a Coordinator-verified count. The lane
        release notes (cf2591fd6, 268f245f8, 9f9f47dbf) were written before the
        Coordinator noticed the resumed sessions and record the picture as it appeared
        at release; this entry supersedes them on that point. RULE FOR THE NEXT ROUND:
        a backgrounded subagent is not dead until its write scope has been quiet for a
        checked interval; re-claiming a lane before that, and re-dispatching into the
        same write scope, is what produced this. Dispatch reviewers in the foreground,
        or give a retry its own attempt subdirectory.
    - id: PD-J
      what: >-
        The review plan's N2(3) told the validator to match the time-only vOW charge
        against "CORR-20260913-53739b's vow_time_log2"; that record carries no vOW
        figure. The committed source is COST-SEMBIN-8d123b parameter_sets, which the
        validator found and checked against (2.1e-5 bits). Plan mislabel, same species
        as DEC-20260913-74e208 PD-1, at far smaller stakes; the run is untouched.
    - id: PD-K
      what: >-
        ADJUDICATION of the run's PD-4 (gate tolerance). The frozen contract declares
        "tolerance: 1e-3 bits per cell" and invalidates ARMS N, K, P, M, I if ARM R
        fails beyond it; 26 of 107 committed targets are printed to one or two
        decimals, so a 1e-3 check against them can pass only by luck, and all 26
        reproduce to within half a unit of their printed precision (worst 0.048 bits at
        a one-decimal target); the 1e-3 class is clean at 0.00086 bits worst. Ruling:
        the frozen tolerance is finer than the information content of the targets the
        same contract names, which is a contract-wording defect of the same class as
        DEC-20260913-2386b5 PD-H; the producer's per-precision tolerance is the only
        reading under which ARM R tests anything at those cells; ARM R is ACCEPTED as
        passed and the invalidation rule is NOT triggered. The producer's claim that
        the widened tolerance was "declared in code before the arm ran" is
        UNVERIFIABLE from committed history and is recorded as unverifiable, not as
        verified; what is verifiable is that exec-1 (the earliest retained artifact)
        already carried the identical policy. The successor contract states every
        gate tolerance at the printed precision of its target.
    - id: PD-L
      what: >-
        The plan's proves_too_much object was run with the producer's code by the
        breakthrough reviewer, by the plan's own instruction (the object IS the
        producer's charging at m = 2, 3). Recorded so that nobody reads the control as
        an independent re-implementation; the independent re-implementations are the
        3,840-value and 320-cell recomputations in the same report and in N4.
    - id: PD-M
      what: >-
        The blind re-deriver did not open the two optional in-scope sources
        (inputs/SEMAEV-2015-310 and COST-SEMBIN-8d123b) on the reasoning that the cost
        table would have put a neighbouring producer's figures before a blind
        derivation; and it saw the NAMES of the sibling task directories in the
        session's opening git summary without opening them. Both are disclosed in its
        attestation (sources_in_scope_not_opened, incidental_exposure_disclosed). The
        Coordinator weighs the directory names as carrying no Nagao figure and no
        direction of any margin, and composes the blind comparison with that recorded.
    - id: PD-N
      what: >-
        3b91d0 discloses that inline one-off inspections, if counted as script runs,
        exceed the handoff's maximum_runs of 20; the preserved scripts number 13. All
        arithmetic is log2-domain and the budget was cost protection, not a scientific
        sample count; accepted, recorded.

  rationale:
    - >-
      WHAT THE ROUND SETTLES. The surface is what the artifacts say (EV-SEMBIN-f4408c
      O-1), the baseline is charged at its own Pareto minimum symmetrically (O-3), the
      gate and controls hold (O-4), ARM C's bounds re-derive and are robust (O-2), and
      a blind re-derivation agrees with the producer to 0.01 bits under the producer's
      conventions (O-5). The arithmetic is not in question anywhere; the whole
      decision is about what it means.
    - >-
      WHAT THE FLAG MEANS. 81 of the 120 flagged cells -- every n = 409 cell -- exist
      only by charging a D^omega elimination with Theta(D) memory, which no algorithm
      has (O-6). 39 survive the coherent reading, all at n = 571, with margins of
      2.1-45.9 bits; the coherent reading is the ceiling of its family, so no memory
      model erases them, and no attack-side omitted term (all >= 85 bits away), no
      unit convention (deepens them) and no defect in the charging does either (O-9,
      O-10). What erases every one of them is one degree of solving-degree slack above
      the granted d_F = 4; what erases every omega >= 2.807 survivor is an absorbed
      Lemma-2 constant of 2^{23.2} (O-7). The flags are therefore a CONSEQUENCE of
      the strong first-fall-degree grant (O-8), disclosed as such, not an artifact --
      and not a result about an algorithm anyone has run.
    - >-
      WHY `weakened`. The hypothesis said memory is where Nagao's bound dies at every
      FIPS label. In the charged model it does not die at n = 571; it dies at n <= 409
      and sits 2-46 bits below vOW at 571 under the coherent reading, conditional on
      the grant. That is C2's own falsification criterion firing, reviewed at the tier
      the criterion demanded. A hypothesis whose central mechanism claim fails at the
      label it was most about, whose C1 inference to the exponent is
      reading-dependent, and whose C3 spread claim fails over the range it named, is
      weakened. It is not rejected: its headline about curves stands, the scope closed
      is a conditional closed form (rule 6), and the falsifying margins are inside the
      model's own unquantified constants -- the review says so in every relevant
      section and this decision carries it in the same sentence as the transition.
    - >-
      WHY NOT `inconclusive`. The evidence is not ambiguous about what the closed form
      does; it is precise about it to 1e-9 bits and validated three ways. It is
      ambiguous only about what the closed form bears on, and that ambiguity is
      named, measured (52-67 bits of one degree; 2^{10.6}-2^{46} of constant) and
      attached to every figure. Recording `inconclusive` would let "memory is where
      it dies" stand in the ledger as untested when it was tested and failed.
    - >-
      WHAT THIS DECISION SAYS ABOUT CURVES: NOTHING. Every reviewer states, as a
      conclusion with its table, that no row of the surviving-flag list is a statement
      about B-571, K-571 or any curve; the algorithm costed has not been run at any n
      by anyone in this program; the only curve-specific refinement examined
      (Koblitz automorphisms, O-9) moves the comparison AWAY from Nagao. The contract's
      required scope statement is discharged as a conclusion, not a reassurance.
    - >-
      ON IMP-SEMBIN-REVIEW-MAX. The impediment's own recheck returned on 2026-09-13
      (plan impediment_recheck_recorded_here) and the review-breakthrough round WAS
      served at max, non-degraded, in an independent session; the claim-changing
      composition above rests on it. The same condition then RECURRED for one
      incarnation of the same task on 2026-09-14 (PD-I) without preventing the
      round's completion. The impediment is recorded on the goal head as CLEARED FOR
      THIS ROUND with the recurrence noted, not deleted: the next max-tier dispatch
      runs the recheck first, and a stop mid-task re-queues the task and leaves its
      claim un-promoted (AGENTS.md "Goals are never paused" guarantee 2), exactly as
      before.

  next_actions:
    - >-
      The successor is a MEASUREMENT, not another closed form: the solving degree
      (or a Lemma-2 constant) of Nagao's EQS4(m, R) at the largest (n, C_0) an engine
      can reach, with the d_F = 4 versus >= 5 outcome scored against ARM K's
      predicted 52-67-bit product rise. This is IMP-SEMBIN-ENGINE's clears_when and
      DEC-20260913-74e208 dispatch rank 4 (the GF(2) degree-4 closure predicate); it
      is now also the only thing that can decide whether the 39 surviving cells mean
      anything. Ranked ECC work; not dispatched by this decision; designed via
      /design-experiment when the engine exists.
    - >-
      Carry three method items into the successor contract, in writing: (i) every
      gate tolerance stated at the printed precision of its target (PD-K); (ii) T4's
      expectation convention and HEUR-1 parametrisation stated in the hypothesis's
      HEUR-2 text, since they are worth 20 bits at C_0 = 3 (O-5); (iii) memory
      charged as the coherent partner of the time charge (r x D elimination: time
      r^{omega - 1} D, memory r D), with the row count r a declared parameter rather
      than an implicit reading (O-6).
    - >-
      If C3 is to be revisited, declare the upper end of the defensible C_0 range:
      the model's dense margin keeps moving to C_0 ~ 32 (O-10), and a spread over an
      undeclared range is not a deliverable.
    - >-
      Nagao proposals 2..N in the ideation lane (RQ-SEMBIN-9e8f82) are ranked against
      this: the closed-form lane is exhausted at the precision the grants allow, and
      a proposal that re-costs Theorem 1 without a measured degree is dominated by
      this record.
    - >-
      Put the resumed-session lesson (PD-I) into the dispatch procedure: check a
      write scope for recent writes before releasing a lane as failed_infrastructure,
      and give retries their own attempt subdirectory.

