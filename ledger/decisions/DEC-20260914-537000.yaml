  recorded_at: '2026-09-14'
  decided_at: '2026-09-14'
  decided_by: coordinator
  recorded_by_task: TASK-20260913-c81e44
  archived_by: TASK-20260913-c81e44
  goal_id: GOAL-SEMBIN-5078bc
  batch_id: BATCH-9d649f
  decision: weaken
  decision_label: >-
    Compose REVIEW-SEMBIN-20260913-251fd3 (N1-N4, blind re-derivation, B1, B2 and the
    proves-too-much control) on RUN-SEMBIN-251fd3 of EXP-SEMBIN-db9bc3, the Nagao
    costing. H-SEMBIN-4a80f3 moves approved -> weakened in the charged model: its
    memory claim C2 is falsified at n = 571 under the coherent memory reading and the
    falsification survived a review-breakthrough session at max effort, non-degraded;
    its C1 inference to non-polynomiality is refuted in every reading of Nagao's text;
    its C3 spread claim fails over the defensible C_0 range as worded. Record that
    every surviving margin sits inside the model's own unquantified constants and one
    degree of solving-degree slack, that 81 of the 120 flagged cells -- every n = 409
    flag -- are an artifact of an incoherent memory pairing, and that nothing here
    bears on any curve. Confirm three Coordinator priors, record two partly overturned
    and one refuted. Adjudicate the gate-tolerance contract defect and the
    infrastructure history of the round. Record the IMP-SEMBIN-REVIEW-MAX recheck
    outcome on the goal head additively. Promote nothing. Name the successor.

  context: >-
    RUN-SEMBIN-251fd3 (log2-domain closed forms over the declared grid plus ARM C's
    exact enumeration at n <= 20; 5.58 s CPU, 119.6 MB peak) was snapshot-archived by
    TASK-20260913-a10007 in commit a2cdafc67 before any reviewer ran. It returned
    completed_valid with the contract's escalation trigger (a) RAISED (242 cells with
    the charged Nagao closed form below vOW's Pareto minimum under a memory-charging
    metric at a FIPS label; 120 with committed omega and bound-B-satisfying C_0). The
    review plan for the round was written and committed (391ec7eba) with the
    Coordinator's prior per joint before any reviewer was dispatched, and stated the
    blind re-derivation's quantity symbolically AND numerically with expected values
    withheld (DEC-20260913-74e208 PD-1/PD-2). Three independent sessions ran:
    TASK-20260913-3b91d0 (N1-N4, review-adversarial xhigh), TASK-20260913-7fb774
    (blind re-derivation, review-adversarial xhigh) and TASK-20260913-f6652f (B1, B2,
    proves-too-much, review-breakthrough max, non-degraded). All returned;
    tools/check_review_independence.py PASSES on the three attestations. The
    Coordinator compared the blind values against the producer's only after
    7fb774's report was on disk. This decision is written by the Coordinator session
    that also wrote the plan; the independence it rests on is the reviewers'.

  target_ids:
