  citations_note: >-
    The literature the breakthrough reviewer names on the first-fall-degree versus
    solving-degree gap (Petit-Quisquater 2012; Kosters-Yeo 2015; Galbraith-Gaudry 2016),
    on iterative linear algebra (Wiedemann; Lanczos), on the Coppersmith-Winograd constant
    and on the Koblitz Frobenius speed-up (Wiener-Zuccherato 1998;
    Gallant-Lambert-Vanstone 2000) is marked `recalled` in its report and is NOT cited
    here: a remembered source may not back a decision (AGENTS.md rule 9). Nothing in the
    transition depends on any of it. Retrieving Kosters-Yeo and Petit-Quisquater is
    cheap and is the first thing a reader of the grant statement (O-8) should do.

  limitations:
    - >-
      NOTHING IN THIS DECISION IS A STATEMENT ABOUT THE SECURITY OF ANY CURVE AT ANY
      PARAMETER, IN EITHER DIRECTION.
    - >-
      Every figure is conditional on Proposition 5 and the STRONG first-fall-degree
      assumption, HEUR-1 and HEUR-2, none of which is measured here or measurable on
