    - No hypothesis status, scientific claim, or goal status changes.
    - EXP-PFDR-782085 and EXP-PFDR-25057c are not approved by this decision.
    - Unresolved definition interfaces are reported as unmeasured, never assumed.
    - Schema correction views preserve unrelated historical meanings and grant no new authority.
