coordinator_decision:
  id: DEC-20260811-a4c7ec
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-d7e255
  recorded_at: '2026-08-11'

  context: >-
    experiments/EXP-INSTR-36c8cf/amendments/v2.yaml (filed by BATCH-d7e255,
    recorded by DEC-20260810-5aeeaa) is a protocol_amendment extending a
    seed ladder for the SR3 v3 reference-sampling characterisation from
    12/24/48 seeds to 96/192/384/768/1536, after the stability rule (E3)
    failed at both tested rungs. The amendment's own text names two
    required validations before it may be approved (V1: re-derive the
    noise arithmetic and adjudicate HEUR-INSTR-4 against a competing
    heavy-tail explanation; V2: red-team the freeze-question argument for
    E6/E7) and states plainly: "A DISSENT FROM EITHER BLOCKS APPROVAL...
    it stands until a new Coordinator decision supersedes it on the
    merits." This branch dispatched both, as fresh, independent
    review-adversarial sessions, since neither had been run before this
    branch merged in visibility of the amendment. Both are now complete
    and committed (validation_v1_report.md; validation_v2_redteam_report.md).

  decision: pause

  target_ids:
  - GOAL-ENDO-001
  - BATCH-d7e255
  - EXP-INSTR-36c8cf
  - H-INSTR-444c7b
  - RQ-INSTR-f8faa0
  - experiments/EXP-INSTR-36c8cf/amendments/v2.yaml
  - RUN-INSTR-36c8cf-phaseA-v2-57ca9a

  rationale:
  - >-
    AMENDMENT V2 IS NOT APPROVED. V2 (red-team) returned a
    `qualified_dissent_repairs_required_before_approval` verdict, and the
    amendment's own text makes a dissent from either required validation
    dispositive regardless of the other's verdict. This decision does not
    override that rule; it records the dissent's substance and what
    resolves it, per that same rule ("stands until a new Coordinator
    decision supersedes it on the merits").
  - >-
    V1's OWN VERDICT IS "INCONCLUSIVE," NOT A CLEARING PASS EITHER. Every
    number in the amendment's competing_explanation_not_excluded analysis
    was independently reproduced exactly from the run's raw per-seed
    variance ratios. Additional checks V1 ran beyond the amendment's own
    text (pooled skewness across all thirteen rows, full-distribution
    rung-to-rung comparison) lean mildly against the heavy-tail
    explanation without excluding it. This means the amendment's own
    stated automatic-withdrawal trigger ("if V1 returns the heavy-tail
    explanation, withdraw") is not activated -- but "inconclusive" was
    never sufficient for approval on its own; V2's independent dissent is
    what actually decides this record's outcome.
  - >-
    V2's CENTRAL FINDING IS STRUCTURAL, NOT STYLISTIC, AND THIS
    COORDINATOR FINDS IT PERSUASIVE ON READING BOTH REPORTS TOGETHER: the
    stability rule (E3) that T2 uses to accept a rung is satisfied by
    BOTH live explanations -- HEUR-INSTR-4 (ordinary noise) and
    competing_explanation_not_excluded (heavy-tailed but finite-variance)
    -- given enough seeds, because the 1/(2*sqrt(n_prev)) shrinkage law
    V2 traces to DEC-20260810-5aeeaa's own arithmetic is a general
    finite-variance consistency fact, not a Gaussian-specific one. The
    only mechanism that could discriminate the two explanations is the
    E9 D1/D2 diagnostic, and D2 explicitly gates nothing. So the
    amendment's central claim -- that reaching the terminal rung without
    firing F4 would validate HEUR-INSTR-4 over the alternative -- does
    not follow from the mechanism as specified. V2's own framing is
    exactly right: this does NOT mean the ladder extension is invalid in
    the way the [1.3, 3.6] band-widening defect was invalid (V2
    independently confirmed the four freeze-question conditions all
    hold, and the mechanism is genuinely different in kind); it means
    the ACCEPTANCE LOGIC layered on top of that mechanism needs repair
    before a rung it accepts can be trusted to mean what the amendment
    says it means.
  - >-
    A SEPARATE, CONCRETE, INDEPENDENTLY-CHECKABLE FINDING: V2's own
    recomputation of the amendment's reachability_and_cost_derived_not_measured
    table (p_all13(n_prev) for n_prev in {12,24,48,96,192,384,768}) found
    two of five entries off by 36-40x from their own labelled transition,
    landing close to the value belonging to the NEXT transition, with the
    96->192 entry missing entirely -- the same "value belongs to the next
    doubling" error class DEC-20260810-5aeeaa itself already caught and
    corrected in a different input to that same decision, recurring here
    apparently uncaught one level downstream. This does not overturn the
    terminal-rung figure (V2 confirms the 768->1536 entry, 93%, is
    correct), but it means the table cannot currently be relied on for
    the intermediate rungs, and nobody was tasked with re-deriving it
    before this review.
  - >-
    A DIRECT TEXTUAL SELF-CONTRADICTION, MINOR BUT REAL: change E6's own
    `what_this_does_not_change` states in full caps "IT CHANGES NO
    ACCEPTANCE REGION," and the very next block in the same file discloses
    a ~0.5% permissive-direction widening from the undisclosed-but-real
    c4(n) sample-standard-deviation bias. V2 independently verified the
    c4(n) arithmetic itself is correct; the problem is the absolute claim
    two paragraphs earlier, not the disclosed effect.
  - >-
    V2 explicitly and repeatedly distinguishes what it found from a
    rejection of the underlying idea: "None of R1-R5 requires abandoning
    the extension or reopening E6/E7's basic mechanism; all are repairs
    to the acceptance and reporting logic." This Coordinator reads both
    reports as consistent with that framing and adopts it: the seed-
    ladder extension itself, and its four freeze-question conditions
    (unchanged acceptance region in the sense that matters, no visible
    datum to fit toward, filed before its data exists, deterministic and
    terminating), survive this review. What does not survive as written
    is treating an E3-only pass as sufficient validation.
  - >-
    THIS COORDINATOR DID NOT INDEPENDENTLY RE-VERIFY V2's ARITHMETIC-ERROR
    CLAIM (the 36-40x reachability-table discrepancy) TO THE SAME DEPTH
    THIS SESSION HAS APPLIED TO MORE CONSEQUENTIAL FINDINGS ELSEWHERE
    THIS BATCH (e.g. the EXP-ICINV-e0cd8f elimination-polynomial
    identity, independently re-derived from scratch before being relied
    upon). That deeper re-verification is not required to reach today's
    decision: V2's dissent alone is dispositive under the amendment's own
    rule regardless of whether every sub-finding within it is confirmed,
    and R2's own required repair (independently re-deriving the full
    table) is the correct place for that arithmetic to be pinned down
    conclusively, not a second read by this Coordinator today. Named
    explicitly as a limitation rather than silently assumed away.
  - >-
    NEITHER RUN-INSTR-36c8cf-phaseA-v2-57ca9a NOR
    RUN-INSTR-36c8cf-phaseA-2a5cd1 IS TOUCHED. Both stand exactly as
    committed (AGENTS.md rules 2 and 4); this decision adjudicates only
    the FILED, UNAPPROVED amendment built on top of the first run's data.
  - >-
    DOWNSTREAM CONSEQUENCES, STATED PLAINLY SO NO READER INFERS MORE THAN
    IS DECIDED. EXP-ICINV-4d33aa's own SR3 v3 lane (the BATCH-de621d
    design specifically, which this characterisation instrument serves)
    remains PAUSED; nothing here unpauses it, and amendment v2's own text
    already stated it would not regardless of outcome. EXP-JINV-bd141d
    and EXP-VOLC-9f5571 remain BLOCKED under GOAL-ENDO-001 criterion C4,
    since this instrument has not delivered an accepted, trustworthy
    characterisation. No hypothesis status changes: H-INSTR-444c7b,
    H-ICINV-d5e351 and H-ICINV-6c7920 all stay exactly as they are.

  evidence_refs:
  - experiments/EXP-INSTR-36c8cf/amendments/v2.yaml
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/execution/EXP-INSTR-36c8cf/validation_v1_report.md
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/execution/EXP-INSTR-36c8cf/validation_v2_redteam_report.md
  - ledger/decisions/DEC-20260810-5aeeaa.yaml
  - experiments/EXP-INSTR-36c8cf/runs/RUN-INSTR-36c8cf-phaseA-v2-57ca9a/sr3v3-reference-sampling.json

  limitations:
  - >-
    This decision does not itself run R3/R4 (the zero-marginal-cost
    jackknife exceedance reanalysis, the exceedance/stability-failure
    correlation test, or the Student-t null-object simulation) that V2
    names as the cheapest path to actually discriminating HEUR-INSTR-4
    from the competing explanation. They are named as the concrete next
    step, not performed here, to keep this decision scoped to adjudicating
    the completed review rather than opening a third round of analysis
    before recording what two independent reviews already established.
  - >-
    This Coordinator is not the session that filed amendment v2 or ran
    Phase A; all context is read from committed records and the two
    review reports, consistent with this campaign's multi-Coordinator
    architecture.
  - Toy scale throughout; claim_tier toy; sota_delta zero; no measurement is reported by this decision itself.

  next_actions:
  - >-
    A v3 amendment to EXP-INSTR-36c8cf (ordinal 3), addressing R1-R5 from
    the red-team report, is required before this amendment's line of
    repair may be approved: (R1) bind E9's D1/D2 diagnostics into the T2
    acceptance condition, or relabel an E3-only pass as provisional;
    (R2) independently re-derive the reachability table in full,
    restoring the missing 96->192 entry and correcting or explaining the
    24->48 and 48->96 entries; (R3) run the jackknife exceedance-rate
    reanalysis and the exceedance/stability-failure correlation test on
    already-collected data; (R4) run the Student-t(df=5) null-object
    simulation through the identical E2/E3/T1/T2/T3 pipeline and report
    whether it also reaches accepted_rung; (R5) correct the "changes NO
    acceptance region" overclaim and state the compounding of the three
    permissive-direction effects together. Not drafted by this decision.
  - >-
    R3 and R4 specifically are zero-marginal-cost reanalyses of data
    already on disk (per V2's own framing) and are the cheapest, fastest
    path to an actual A-vs-B verdict -- cheaper than any further seed
    collection. A future session picking this up should prefer running
    them before extending the ladder itself.
  - >-
    This decision does not touch, and is not affected by, this branch's
    own separately-flagged and still-open items: the three-way SR3-gate
    design fork (DEC-20260810-d82c61, DEC-20260811-af68d1), or the
    pending approvals of EXP-ICINV-4d33aa amendment v4 and
    EXP-CANL-96b0ad amendment v2.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      The structural finding (a convergence-style stopping rule can be
      satisfied by both a null and its alternative when both share the
      same finite-variance asymptotic shrinkage rate, so passing the
      stopping rule alone does not discriminate them) is a real
      methodological point, but it is specific to this gate's exact
      construction and is fully captured in the cited review report and
      this decision's own rationale; a standalone corpus entry is not
      warranted until or unless a v3 amendment's repair is itself
      reviewed and the pattern recurs elsewhere in this campaign.

  decided_by: coordinator
  decided_at: '2026-08-11'

