coordinator_decision:
  id: DEC-20260727-013
  context: 'EXP-GPS-002: freeze-minus-one support-syzygy law (GPS-2) decisive test'
  decision: hypothesis_supported_scoped
  target_ids:
  - GPS-2
  - H-SIG-001
  rationale:
  - 'P1 DECISIVE PASS: the FULL-support (old/T11-style, 100% of C(24,<=6) = 190,051 cols)
    null at n=12 D6 seed 2 ranks EXACTLY sr_pred = 156,520 (deficit 0, kernel 26,792, rankK6
    = 26,792 == kernel, extra_6 = 0; determinism control: kill-redo of a staircase unit produced
    identical k = 14,761).'
  - 'Consequence: the EXP-SIG-008 column-matched null collapse (149,410, deficit 7,110) is
    COLUMN-SET-DEPENDENT — induced by the N1 censoring pattern (16,018 missing degree-6 columns),
    not an intrinsic below-freeze failure of semi-regularity. The freeze theory''s validity
    below freeze stands; at D = freeze−1, support censoring induces syzygies in generic systems
    on the censored support.'
  - 'The D6 baseline is therefore REPAIRABLE: genuine D6 cascade content at n=12 = sem-minus-null
    excess 10,840 (= 17,950 − 7,110), with the 7,110 now accounted as support-induced. The
    residual_6 = 2,722 value becomes interpretable against the validated full-support baseline.'
  - 'P2 DECIDED: n=9 N1 D5 seed 2 extra = 368 (not 369): the exact integer is seed-dependent
    by 1 (369/369 at seed 1); magnitude stable (support-induced share 40.5% vs 40.6% of sem''s
    909 deficit). New on record: sem n=9 D5 rankK = 935, extra = 910, N1 |V| = 0 at seed 2.'
  - 'Scope: supported for the tested family at n in {9,12} at the freeze−1 degree; the general
    law (any n, rate band [0.23, 0.90] per missing top-slice column) remains open — bracket
    cell n=15 (D6 clean / D7 defective) is the named confirmation.'
  evidence_refs:
  - ledger/EV-GPS-002.yaml
  - experiments/EXP-GPS-002/analysis.md
  - experiments/EXP-SIG-008/RESULTS.md
  limitations:
  - Seed-dependence of the exact extra at n=9 means the law is quantitative in magnitude,
    not exact integer, across seeds.
  - Which support property of the censoring pattern sets the rate (7,110 at N1-D6 vs 368 at
    N1-D5) is unexplained — flagged open.
  next_actions:
  - Run the n=15 bracket confirmation (D6 column-matched null clean, D7 defective) when a
    compute window opens (gated; ~30 invocations).
  - 'Use the repaired baseline: future D6 cascade claims must decompose sem deficit into support-induced
    (null-measurable) + genuine (sem-minus-null) shares.'
  decided_by: coordinator
  decided_at: '2026-07-27'
  reissued_from_frozen_root_record:
    source_path: ledger/DEC-20260727-003.yaml
    historical_id: DEC-20260727-003
    reason: The root-level record and ledger/decisions/DEC-20260727-003.yaml are different
      decisions that spent the same id. The published canonical record keeps it; this reissue
      carries the root record's content forward under a free id. Recorded in CORR-20260802-003
      and in legacy_ledger_inventory.remapped_ids.
    correction_id: CORR-20260802-003
  knowledge_promotion:
    promoted: []
    not_warranted: Reissue of a frozen historical record for identifier hygiene only. It re-scores
      nothing and promotes nothing; the original decision's promotion state is unchanged.
