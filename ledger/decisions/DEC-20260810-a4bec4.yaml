coordinator_decision:
  id: DEC-20260810-a4bec4
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-d7e255

  context: >-
    OPENING DECISION FOR GOAL-ENDO-001 BATCH-d7e255. It does three things and
    nothing else: it opens the batch, it approves four experiment contracts
    (EXP-ICINV-e0cd8f, EXP-JINV-bd141d, EXP-VOLC-9f5571, EXP-INSTR-36c8cf) with
    their four paired `specified` hypotheses (H-ICINV-d5e351, H-JINV-5a0b9e,
    H-VOLC-dff1f8, H-INSTR-444c7b), and it records the user's selection of the
    SR3 gate replacement for EXP-ICINV-4d33aa together with that selection's
    cost.

    WHAT THIS BATCH FORMALISES. The four contracts bind to
    analysis/endomorphism-isogeny-decomposition/MATCHED-ORDER-DESIGN.md, a design
    proposal in the campaign's analysis directory. That document is not a ledger
    record and asserts no result; every figure it marks as derived in its own
    session has no run record, no manifest and no independent verification, and
    each contract re-derives what it uses under an immutable run record with a
    PREMISE-FAILED terminal state on disagreement. NOTHING IN THIS BATCH HAS BEEN
    EXECUTED. No run exists for any of the four contracts.

    THE DESIGN'S CENTRAL MOVE, IN ONE SENTENCE. Every between-class result this
    campaign has produced was voided by the #E confound, and its between-class
    detector NULL-C was shown to be a between-class MEAN detector with power 1.00
    at a 0.9% shift; writing N = p + 1 - t gives D = (t - 2)^2 - 4N, so fixing N
    and sweeping t (with p = N + t - 1 prime) produces a family in which every
    class has the SAME group order while D, D_0 and f sweep freely -- the
    confound vanishes identically instead of being modelled.

    THE DESIGN'S SECOND MOVE. Within a single class the campaign's committed
    cost proxy cannot move, because the harness builds the ideal
    < S_3, f_V(x1), f_V(x2) > in which the two membership polynomials already
    generate a zero-dimensional radical ideal of degree |V|^2 in shape position:
    the solving degree is pinned by |V|, not by the curve. That is why the
    committed S_3 monomial-support drop of 13 -> 9 at j = 0 -- exact and
    hand-verified -- moved Groebner time by only -0.44%, with gb_size for
    j = 1728 moving the wrong way at +3.41%. EXP-ICINV-e0cd8f removes f_V from
    the ideal, which is what makes the measured object a functional of the curve
    at all, and by the same argument makes its result non-transferable to solving
    time in the deployed formulation.

  decision: approve

  target_ids:
    - GOAL-ENDO-001
    - BATCH-d7e255
    - H-ICINV-d5e351
    - EXP-ICINV-e0cd8f
    - RQ-ICINV-475b5e
    - H-JINV-5a0b9e
    - EXP-JINV-bd141d
    - RQ-JINV-8fc13a
    - H-VOLC-dff1f8
    - EXP-VOLC-9f5571
    - RQ-VOLC-f6253b
    - H-INSTR-444c7b
    - EXP-INSTR-36c8cf
    - RQ-INSTR-f8faa0
    - EXP-ICINV-4d33aa

  rationale:
    - >-
      APPROVAL SCOPE, STATED FIRST SO IT CANNOT BE READ WIDER THAN IT IS. This
      decision approves four experiment CONTRACTS. It does not dispatch a run, it
      does not license compute, and it does not move any hypothesis status. Each
      contract still needs its own handoff record with non-null budget fields and
      a completion gate (AGENTS.md "Required handoff envelope"). The four new
      hypotheses are `specified` and stay there until executed, independently
      reviewed evidence exists.
    - >-
      NO PRE-EXISTING HYPOTHESIS STATUS IS CHANGED BY THIS DECISION. H-ENDO-001
      remains `approved` and is USED as the admissibility filter -- every
      endomorphism acts as a scalar on a prime-order subgroup, so adding
      endomorphisms adds coordinates and no congruence -- and is not retested.
      H-STR-002 remains `weakened` and DEFER-BATCH009-001 remains OPEN and
      UNRETRACTED; pause condition P2 is respected because no contract in this
      batch constructs an equivariant factor base or tests any phi-stable
      structure, so none of them bears on H-STR-002 in either direction.
      H-ICINV-6c7920 remains `specified` and is neither presumed true nor
      presumed false: the three curve-side contracts simply decline to reuse the
      sampler it disputes, which is a different act from adjudicating it.
      KN-FIND-b7e091's generic-group closure of the incidence and
      endomorphism-image oracle classes is treated as BINDING and extended, not
      revisited.
    - >-
      C1 (EXP-ICINV-e0cd8f) IS APPROVED AS THE BATCH'S FIRST AND CHEAPEST
      CONTRACT AND IS NOT BLOCKED BY ANYTHING IN IT. It computes exact symbolic
      invariants of the f_V-free Semaev Jacobian ideal on all 138 curves of the
      already-enumerated, Hurwitz-certified class at p = 4001, t = 30,
      D = -59 * 16^2: S_3 and S_4 monomial support, singular locus and its
      dimension, graded Betti table and Castelnuovo-Mumford regularity, and the
      degree and factorisation type of the elimination polynomial. It draws no
      target, computes no statistic, uses no null object and produces no p-value,
      so GOAL-ENDO-001 criterion C4 -- which governs instruments that ESTIMATE --
      does not apply to it and EXP-INSTR-36c8cf does not block it. It is also
      independent of the SR3 gate for the same reason. Per T3 both outcomes are
      decisive: constancy across the class closes the d_reg axis with a NAMED
      obstruction, variation hands the campaign min_{E' ~ E} C(E') and promotes
      C2 and C3.
    - >-
      C1 CARRIES A REAL INFRASTRUCTURE RISK AND THE CONTRACT SAYS SO. The
      campaign's harness is pure Python over sympy and computes no Betti tables;
      the contract requires a declared computer-algebra backend plus a second
      independent backend for a cross-check subsample, and states that absence of
      a working backend is a TERMINAL INFRASTRUCTURE STOP under AGENTS.md rule 5
      -- never a mathematical result and never evidence that an invariant is
      constant. The contract also FIXES the grading, because a Betti table is
      undefined without one and the design document did not name it.
    - >-
      C2 (EXP-JINV-bd141d) IS APPROVED FOR THE BETWEEN-CLASS ARMS ONLY. The
      |D_0| arm measures relation density against |D_0| across the 51
      conductor-1 classes of the N = 19507 family -- 46 distinct fundamental
      discriminants, |D_0| from 1299 to 78027, group order identical by
      construction. The |Aut| arm is the t = 211, p = 19717, D = -3 * 107^2
      class, where |Aut| separates from |D_0| INSIDE one class: 1 crater vertex
      at j = 0 with |Aut| = 6 against 36 floor vertices with |Aut| = 2, same N,
      same p, same t. Across classes |Aut| = 6 and |D_0| = 3 are perfectly
      confounded and can never be separated; this is the only place in this
      program where they separate. gcd(107, 19507) = 1 with N prime, so T1
      transport carries the ECDLP between the arms WITH THE SAME k. The two arms
      are reported separately and are NEVER pooled.
    - >-
      C2'S DEURING CAVEAT IS CARRIED FORWARD AS A BINDING CONSTRAINT. Class sizes
      are class numbers of orders; for D_0 in {-3, -4} the Deuring correspondence
      weights j = 0 by 1/3 and j = 1728 by 1/2, so the authority on the exact
      vertex count of the t = 211 class is the campaign's own Hurwitz-Kronecker
      enumeration, not the class-number formula and not the design document. The
      contract requires the enumerated count to be reported independently and a
      discrepancy to be reported as a finding about the enumeration.
    - >-
      C2'S |Aut| ARM HAS A DERIVED RESOLUTION CEILING AND THE CONTRACT STATES IT
      BEFORE EXECUTION. The crater has ONE vertex, so under a permutation of the
      37 class members the smallest attainable one-sided p-value is
      1/37 = 0.02703, attained only at a strict extreme. The arm can never
      distinguish a large effect from a moderate one; it is reported as a rank
      and an exact permutation probability, never as a difference of means and
      never with a confidence interval on n = 1.
    - >-
      C3 (EXP-VOLC-9f5571) IS APPROVED FOR THE WITHIN-CLASS LEVEL ARM AND THE T5
      GATE, WITH FIVE MANDATORY CONTROLS EACH DISCHARGING A NAMED COMMITTED
      FAILURE. (1) targets_B, the certified full-group sampler, is required and
      targets_uniform is prohibited -- H-ICINV-6c7920 holds that the campaign's
      entire reported over-dispersion is a targets_uniform artifact because that
      sampler's support is the cyclic subgroup <G> and on r = 3 curves the
      estimand is uniform on at most half the group; the contract must not and
      does not presume that hypothesis true or false, it simply does not reuse
      the disputed sampler. (2) Every measurement is stratified on
      r = #{x in F_p : x^3 + a x + b = 0} and the strata are reported. (3) The
      volcano is built by VELU isogenies, not by two_torsion_x_count: the
      committed "volcano level" WAS the 2-torsion count -- the two functions are
      character-for-character the same expression -- and it resolved 2 of 5
      levels, reporting {1: 72, 3: 66} where 66 is levels 0-3 pooled. (4) The
      factor-base density is swept and the saturated row is never run alone: the
      committed over-dispersion decays 2.037 -> 0.930 as density falls
      0.5306 -> 0.0234 and the m = 3 operating density is 1/m! ~ 0.167. (5) The
      T5 gate is evaluated and reported, with the walk length as a DISTRIBUTION
      OVER SEEDS and never a point estimate.
    - >-
      C3 IS APPROVED WITH ITS IDENTIFIABILITY CEILING DECLARED IN ADVANCE. Within
      a class every regressor is a function of the single integer f_E, so the
      effective sample size of a level regression is the number of LEVELS and the
      maximal-order level is always the smallest. In the N = 19507 family the
      conductor arm is depth 1, so the level axis is a crater-versus-floor
      contrast and nothing deeper, and on the f = 107 class the crater has ONE
      vertex. Depth greater than 1 is UNTESTED by this contract and the named
      successor is a matched-order family with greater depth. Declaring this
      before execution is what prevents a null from later being reported as
      though the design had power it never had.
    - >-
      T5 IS BINDING AND C3 CARRIES IT: A VARIANCE RESULT IS NOT AN ATTACK. A
      minimiser is admitted only if goodness is common enough to hit by random
      walk or is decided by a LOCAL test evaluable at each step. Both branches
      are directly measurable on the 37-vertex t = 211 class -- the crater
      fraction is exactly 1/(enumerated class size), and the candidate local test
      is the count of F_p-rational 107-isogenies, MEASURED exhaustively on every
      vertex rather than assumed from the textbook. A LEVEL-EFFECT verdict paired
      with a T5 `neither` verdict is not an attack and the contract forbids
      reporting it as one.
    - >-
      C4 (EXP-INSTR-36c8cf) IS APPROVED AND IS BLOCKING FOR C2 AND C3 UNDER
      GOAL-ENDO-001 CRITERION C4, AND NOT BLOCKING FOR C1. It characterises every
      statistic C2 and C3 rely on in BOTH directions -- planted-signal detection
      and matched-null rejection -- at the ACTUAL geometry of use, because the
      campaign's own detection-bound table shows the chi-square floor moving from
      variance-ratio 1.250 at n = 138 to 3.668 at n = 3 and power therefore does
      not transfer across geometries. NULL-C is DISQUALIFIED for any within-class
      contrast by its own committed characterisation as a between-class mean
      detector with power 1.00 at a 0.9% shift; that disqualification is
      inherited, not re-litigated, and its admissibility for the between-class
      matched-order contrast is a separate question answered afresh.
    - >-
      THE SR3 GATE REPLACEMENT IS RECORDED AS A USER DECISION, NOT AS THIS
      COORDINATOR'S INFERENCE. From the three candidates named in
      DEC-20260809-de11f9, THE USER SELECTED: REPLACE LITERAL BAND MEMBERSHIP
      WITH A STATISTICAL COMPARISON AGAINST THE REFERENCE RUN'S OWN SAMPLING
      UNCERTAINTY. The substance of that replacement is carried by
      EXP-INSTR-36c8cf, which delivers the reference run's per-density-row
      empirical sampling distribution, its declared central interval, its width
      as a function of seed count, and a self-consistency check.
    - >-
      THE COST OF THAT SELECTION IS RECORDED HONESTLY AND IS NOT MINIMISED. The
      redesigned gate CANNOT BE EVALUATED until the reference run's
      per-density-row sampling variance has been characterised. That
      characterisation does not exist today. Producing it is additional work, and
      it DELAYS the successor run of EXP-ICINV-4d33aa and, through the C4 block,
      EXP-JINV-bd141d and EXP-VOLC-9f5571, relative to the cheaper option of
      restricting the gate to interior rows. THE USER'S RATIONALE FOR PREFERRING
      THIS OPTION OVER THE CHEAPER ONE IS NOT KNOWN TO THIS RECORD AND IS
      THEREFORE NOT STATED, RECONSTRUCTED OR INVENTED. Recording a choice and its
      cost without a rationale is the honest form here; supplying a plausible
      rationale would be fabrication.
    - >-
      WHY THE OLD GATE IS BEING REPLACED, ON THE COMMITTED RECORD. Independent
      review established that the frozen [1.3, 3.6] band IS THE OUTWARD-ROUNDED
      HULL OF THE COMMITTED ROWS IT GATES -- floor slack 0.020397, ceiling slack
      0.011900 -- so the acceptance region was fitted to the data it gates with
      under 2% margin, and legitimate sampling variation is expected to cross it
      (EXP-ICINV-4d33aa amendment v2, post_review_notes A5). 1.3 is a hull edge,
      not an independent threshold. The replacement is a repair of that defect
      and is not a relaxation: the no-widening rule is explicit in
      EXP-INSTR-36c8cf, and a failed self-consistency check stops the work rather
      than moving the interval.
    - >-
      WHAT THE TWO PRIOR TERMINATIONS DO AND DO NOT MEAN, RESTATED BECAUSE THIS
      DECISION TOUCHES THE GATE THEY FIRED ON. EXP-ICINV-4d33aa terminated
      INVALID twice, at version 1 and at version 2, and BOTH TERMINATIONS WERE
      ADMISSIBILITY FAILURES IN THE GATE. Per the Coordinator's own independent
      check recorded in DEC-20260809-de11f9, THEY BEAR ON NEITHER H-ICINV-6c7920
      NOR EV-ENDO-10109d. A run that never reached an outcome state decides
      nothing (AGENTS.md rule 5). Redesigning the gate is not a re-adjudication
      of either record, and no reader may infer from this decision that anything
      has been decided about the campaign's headline finding.
    - >-
      CLAIM DISCIPLINE ACROSS ALL FOUR CONTRACTS, APPLIED UNIFORMLY.
      claim_tier: toy on every contract. NO ATTACK, NO EXPONENT, NO SPEEDUP.
      sota_delta: ZERO on every axis. dominated_by: parallel Pollard rho with
      distinguished points at 0.886 sqrt(N) group operations and O(1) memory
      (KN-TECH-001, KN-TECH-006), and on CM curves its automorphism-discounted
      variant (KN-TECH-018) -- under which any factor at or below sqrt(6) ~ 2.449
      is BASELINE CALIBRATION, recorded as such and never as an attack. Every
      conclusion is scoped to the tested curves, parameters, solver and budget
      (AGENTS.md rule 4) and cites the experiment, run and evidence IDs
      supporting it (rule 6). Pause condition P3 is wired into C2 and C3 as an
      explicit stopping rule.
    - >-
      EVERY PREREGISTERED PREDICTION IS FIXED NOW AND FALSIFIABLE, AND WHERE THE
      DESIGN DOCUMENT GIVES NO NUMBER, NONE IS INVENTED. Two predictions are
      DERIVED and exact and are recorded so that observing them cannot later be
      presented as a finding: C1's S_3 monomial support is 13 on all 138 curves
      because T4 forces D_0 = -59 and hence a_i != 0 != b_i; and C2's |Aut| arm
      has a smallest attainable one-sided permutation p-value of 1/37 = 0.02703.
      Everywhere else the prediction is qualitative and the admissible threshold
      is the detection floor EXP-INSTR-36c8cf measures at the actual geometry.
      Notably, the campaign's own standing predictions are the NULLS here:
      DECOMPOSITION.md section 5 prediction 1 (yield depends on N and factor-base
      size only) is the null of C2's |D_0| arm, and prediction 2 (no effect by
      volcano level) is the null of C3's level arm.
    - >-
      SEQUENCING. C1 first: cheapest, deterministic, unblocked, and decisive both
      ways. Then C4's non-geometry-specific work (the NULL-C reproduction gate
      and the SR3 v3 reference characterisation) in parallel with Stage 1 of C2
      and C3, since C4's geometry-specific controls need the real geometries that
      those Stage 1 gates produce. Then C4's geometry-specific controls. Only
      then are C2's and C3's verdicts readable. This is a dependency, not a
      preference, and the dispatching handoffs must express it as one.

