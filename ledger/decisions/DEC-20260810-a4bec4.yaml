  limitations:
    - >-
      NOTHING IN THIS BATCH HAS BEEN EXECUTED. No run exists for any of the four
      contracts, no measurement is recorded anywhere in this decision or in the
      records it approves, and every number quoted is either read from a
      committed record (and cited to it) or derived from an elementary identity
      (and marked as derived). No completion criterion of GOAL-ENDO-001 is
      claimed to be met by this decision; C1, C2, C3 and C4 all remain open.
    - >-
      DEC-20260809-de11f9 IS CITED BUT IS NOT PRESENT IN THIS WORKTREE. A
      repository-wide search of this branch finds the identifier only in
      MATCHED-ORDER-DESIGN.md, which cites it as committed. The most likely
      explanation is that the record is on origin/main and this branch has not
      merged it; this Coordinator has no shell in this session and could not
      fetch to confirm. THE SESSION DRIVING THIS COORDINATOR MUST FETCH
      origin/main AND MERGE IT INTO THIS BRANCH BEFORE THE LEDGER ARCHIVE, and
      must verify that DEC-20260809-de11f9 exists and says what this decision
      attributes to it -- the three named SR3 candidates, and the independent
      check that both terminations bear on neither H-ICINV-6c7920 nor
      EV-ENDO-10109d. If it does not, this decision must be superseded rather
      than edited.
    - >-
      THE MATCHED-ORDER FAMILY IS UNVERIFIED. The N = 19507 inventory -- 59
      classes, 51 at f = 1, 46 distinct D_0, |D_0| from 1299 to 78027, conductor
      arm {1, 3, 107}, and the t = 211 class with 1 crater and 36 floor vertices
      -- is derived in the design session by a script with no run record, no
      manifest and no independent verification. C2 and C3 each re-derive it under
      an immutable run record with a PREMISE-FAILED terminal state on
      disagreement, and no decision rule in either contract may depend on those
      figures until that run exists.
    - >-
      C2 IS UNREPLICATED BY CONSTRUCTION. The design document's own standard for
      calling a |D_0| trend real requires reproduction at a SECOND matched N,
      which this batch does not budget. Any positive finding from C2 is therefore
      capped at `preliminary` regardless of apparent size, and the cap is set
      here, before execution, so it cannot be argued away afterwards.
    - >-
      p IS A RESIDUAL COVARIATE IN THE MATCHED-ORDER DESIGN. Fixing N does not
      fix p, since p = N + t - 1, and p and D_0 are linked through t. C2 requires
      the statistic to be reported against p as well as against |D_0|; a trend
      equally explained by p is not attributable to the endomorphism ring and the
      record must say so.
    - >-
      C3's WITHIN-CLASS DEPTH IS 1. The conductor arm of the N = 19507 family
      supports a crater-versus-floor contrast and nothing deeper, and the
      f = 107 crater has one vertex. The only deep volcano the campaign has
      enumerated is at p = 4001 and is used in C3 solely as a gate on the Velu
      construction, not as a measurement. Depth greater than 1 remains untested
      and is the named successor.
    - >-
      C1's RESULT DOES NOT TRANSFER TO SOLVING TIME. Removing f_V is what makes
      the measured object a functional of the curve, and by exactly the same
      argument it is what makes the result non-transferable to the f_V-bearing
      formulation the harness actually runs. A regularity difference in C1 is not
      a predicted Groebner speedup; the committed -0.44% / -0.67% pair is the
      standing demonstration that large exact changes in S_3 do not move that
      cost functional.
    - >-
      C1 MAY BE STOPPED BY INFRASTRUCTURE. A computer-algebra backend capable of
      minimal free resolutions is required and the campaign does not have one
      wired into its harness. Absence of one is a terminal infrastructure stop
      under AGENTS.md rule 5, reported as such, and it is NEVER evidence that an
      invariant is constant.
    - >-
      ALL FOUR BUDGETS ARE COORDINATOR-SET. MATCHED-ORDER-DESIGN.md states no
      budget for E1, E2, E3 or E4. The wall-clock, CPU, memory and run-count
      figures in the four contracts bound the tasks; they are not derived from
      any measurement, and exhausting one is a budget event reported as such and
      never as a null result, an unreachable T5 verdict, or a passed control.
    - >-
      THE SR3 v3 AMENDMENT FILE DOES NOT YET EXIST. EXP-INSTR-36c8cf carries the
      SUBSTANCE of the redesign; the formal versioned file
      experiments/EXP-ICINV-4d33aa/amendments/v3.yaml is a separate Coordinator
      act, named in next_actions, and is required before any successor run of
      EXP-ICINV-4d33aa is dispatched. Amendment v2's change A6 also still binds:
      no version-2 or later run may be dispatched until run manifests pin the
      hash of every source file they execute.
    - >-
      NO ATTESTATION AND NO CLOSURE QUORUM IS GATHERED, CLAIMED OR RECORDED BY
      THIS DECISION, and none is required, since nothing here closes a goal.
    - >-
      THIS COORDINATOR HAS NO SHELL IN THIS SESSION. It could not run
      tools/allocate_id.py --check, tools/validate_ledger.py, or any git command.
      All identifiers used were pre-allocated and pre-verified by the dispatching
      session. The YAML written here has not been machine-parsed by this
      Coordinator, and the driving session must validate it and run the branch
      sync before the archive.

