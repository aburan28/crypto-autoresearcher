coordinator_decision:
  id: DEC-20260811-aed346
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-d7e255
  recorded_at: '2026-08-11'

  context: >-
    DEC-20260811-a4c7ec adjudicated EXP-INSTR-36c8cf amendment v2 as not
    approved, on V2's (RT-20260811-35ab34) qualified dissent, and named R3
    (jackknife exceedance reanalysis) and R4 (a Student-t(df=5) null-object
    control through the identical E1/E2/E3 pipeline) as the cheapest, fastest
    next step -- both zero-marginal-cost reanalyses of data already on disk.
    This branch dispatched TASK-20260811-bc336d to execute them, snapshotted
    the result (RUN-INSTR-r3r4-nullobj-d3efd7), and dispatched a fresh
    Validator and the same Red Team that filed RT-20260811-35ab34 to review
    it independently. Both are now complete and committed in this Coordinator
    session's read (VAL-20260811-bc336d, verdict passed; RT-20260811-cb3211,
    explicitly not dissenting). This Coordinator independently re-derived a
    further subset of the numbers by hand (the fb=12 jackknife exceedance,
    the Fisher's-exact p-value, a from-scratch reproduction of R4 replication
    0, and the Gaussian arm's own 12.6%-at-maximum-exceedance figure) before
    either review returned, and again after, to confirm both reviews'
    headline claims independently rather than relaying them.

  decision: refine

  target_ids:
  - GOAL-ENDO-001
  - BATCH-d7e255
  - EXP-INSTR-36c8cf
  - H-INSTR-444c7b
  - RQ-INSTR-f8faa0
  - TASK-20260811-bc336d
  - RUN-INSTR-r3r4-nullobj-d3efd7
  - EV-INSTR-600710
  - VAL-20260811-bc336d
  - RT-20260811-cb3211
  - RT-20260811-35ab34
  - DEC-20260811-a4c7ec
  - experiments/EXP-INSTR-36c8cf/amendments/v2.yaml

  rationale:
  - >-
    R3 AND R4 TAUGHT SOMETHING REAL, PRECISELY CONFIRMING A PRE-REGISTERED
    PREDICTION. RT-20260811-35ab34's own counterexample_or_mutation, filed
    before this run existed, predicted a simulated Student-t(df=5) ladder
    would "also eventually satisfy E3... within the declared 8-rung ladder."
    It does: 94/500 = 18.8% of independent replications (95% CI approx
    [15.4%, 22.2%]), against 485/500 = 97.0% (95% CI approx [95.5%, 98.5%])
    for a matched-shape Gaussian control. This is not a post-hoc
    rationalisation of an ambiguous result; it is a pre-declared prediction,
    tested, and confirmed, at the accept-rate level -- the sharpest and most
    defensible number this run produced, agreed on by the executor, an
    independent Validator (full-record recomputation plus a 12-replication
    spread spot-check), an independent Red Team, and this Coordinator's own
    from-scratch reproduction.
  - >-
    BUT THIS COORDINATOR DOES NOT ADOPT THE RUN'S OWN "26/26 EXCEEDANCES,
    ALWAYS" FRAMING AT FACE VALUE, BECAUSE BOTH INDEPENDENT REVIEWS -- BY TWO
    DIFFERENT METHODS -- SHOW IT IS A WEAKER SIGNAL THAN A FIRST READING
    SUGGESTS. The Validator's from-scratch 5000-trial-per-rung Monte Carlo
    shows the true per-side in-sample exceedance probability for Student-t(5)
    is already ~99.7-99.8% at n=768 and ~100% at n=1536, so the observed
    constant is close to what that probability implies, not a surprising
    separate signal; and it further shows the GAUSSIAN arm's own per-side
    probability is also high (~96%) at n=1536, though not saturated. The Red
    Team's independent, and this Coordinator's separately re-verified,
    finding sharpens this into a concrete number: 61/485 = 12.6% of the
    GAUSSIAN arm's own ACCEPTED replications also hit the literal maximum
    (26/26), with mean exceedance 21.6/26 even when not maximal. A rule that
    rejected on "exceed_total == 26" would misfire against the well-behaved
    arm roughly one time in eight. This Coordinator's synthesis: the
    exceedance-count diagnostic carries real signal in AGGREGATE INCIDENCE
    RATE (100% vs 12.6% is still a meaningful, 8-fold contrast) but is not
    the clean binary separator the unqualified "26/26 always" framing
    invites a reader to assume, and required repair R1 (binding D1/D2 into
    T2's acceptance condition) is not solved merely by thresholding this
    specific proxy at its observed maximum. The accept-by-rung-8 fraction,
    not the exceedance count, is this run's sharper discriminator.
  - >-
    TWO FRAMING CORRECTIONS FROM THE RED TEAM ARE ADOPTED IN FULL, BOTH
    INDEPENDENTLY VERIFIABLE AND NEITHER CHANGING A REPORTED NUMBER. First:
    the "matched-variance, apples-to-apples" language used in the task
    handoff and execution report is inert -- interval_for_rung,
    stability_check and the exceedance check are all exactly invariant under
    positive affine transforms, proved analytically (mean +/- z*sd and a
    RELATIVE half-width change both cancel a location/scale substitution) and
    confirmed empirically by the Red Team's own byte-identical re-run of the
    first 50 replications at loc=0, scale=1. Only distribution SHAPE and
    sample size drive every outcome in this run; the per-row scale matching
    did no comparability work and future citations of this run should not
    imply otherwise. Second: the Validator independently flagged that R3/R4's
    exceedance metric (the single row extreme per side, 0 or 1, capping at
    26) is a narrower proxy than amendment v2's own D2 text (change E9),
    which defines the diagnostic as the FULL COUNT of per-seed ratios outside
    the interval. This was disclosed by the executor, not hidden, but is
    worth carrying forward explicitly: a future v3 amendment implementing R1
    against the LITERAL D2 definition may see a different (plausibly
    sharper, since it uses more information per row) signal than this run's
    proxy shows.
  - >-
    NEITHER REVIEW DISSENTS. The Validator's verdict is passed (an
    admissible, correctly-executed, faithfully-scoped statistical receipt).
    The Red Team's own words: "None of this blocks anything -- this run
    authorizes nothing and I am not dissenting from a claim this run does
    not make." Every objection filed by either review is about HOW the
    numbers should be cited going forward, not about WHETHER they are
    correct; this Coordinator independently re-checked the two most
    consequential new claims (the Gaussian arm's 12.6%-at-maximum figure, and
    the affine-invariance of the pipeline) directly from raw data and confirms
    both.
  - >-
    WHAT THIS DOES AND DOES NOT ESTABLISH, STATED PLAINLY. It establishes
    that the amendment's CURRENT, unrepaired acceptance rule (E3/T2 alone)
    admits at least one concrete, plausible, finite-variance heavy-tailed
    alternative at a non-negligible rate (18.8%) at the declared terminal
    rung -- strengthening, with a real number rather than an analytical
    argument alone, RT-20260811-35ab34's F1 dissent. It does NOT establish
    that HEUR-INSTR-4 is false (V1's own charge -- is the real p=4001 data
    itself Gaussian or heavy-tailed -- remains inconclusive and is untouched
    by this run, which tests a SYNTHETIC alternative, not the real data's
    own shape). It does NOT, by itself, tell a reader whether 18.8% is
    "too high" to trust the gate, because no acceptable false-accept-rate
    target has ever been pre-declared anywhere in this campaign -- that gap
    is R2(i), still open, and this run's number is context for it, not a
    substitute.
  - >-
    DECISION: refine, not support, weaken, reject_scoped, or a fresh pause.
    This is the same vocabulary this campaign used for DEC-20260811-a3398a
    and echoes DEC-20260811-a4c7ec's own pause: a result taught something
    real (a quantified, three-ways-independently-verified false-accept rate,
    plus two now-corrected framing risks) but the underlying design -- here,
    the amendment's acceptance rule, not an experiment's interpretation --
    needs repair before further reliance. `pause` was the right word for
    DEC-20260811-a4c7ec because nothing had yet been measured beyond the
    dissent itself; `refine` is the right word here because this batch of
    work is itself the kind of repair-input DEC-20260811-a4c7ec asked for,
    and it changes what a v3 amendment should contain, not merely that one
    is required.

  evidence_refs:
  - EV-INSTR-600710
  - RUN-INSTR-r3r4-nullobj-d3efd7
  - experiments/EXP-INSTR-36c8cf/runs/RUN-INSTR-r3r4-nullobj-d3efd7/jackknife-exceedance.json
  - experiments/EXP-INSTR-36c8cf/runs/RUN-INSTR-r3r4-nullobj-d3efd7/r4-student-t5-nullobject.json
  - experiments/EXP-INSTR-36c8cf/runs/RUN-INSTR-r3r4-nullobj-d3efd7/r4-gaussian-calibration-optional.json
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/execution/EXP-INSTR-36c8cf/execution_report_r3r4.md
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/execution/EXP-INSTR-36c8cf/validation_r3r4_report.md
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/execution/EXP-INSTR-36c8cf/redteam_r3r4_report.md
  - RT-20260811-35ab34

  limitations:
  - >-
    This decision does not itself draft a v3 amendment. It records what a v3
    amendment now needs beyond DEC-20260811-a4c7ec's original R1-R5: correct
    the "matched-variance/apples-to-apples" framing (state plainly that only
    distribution shape and sample size drove this run's outcomes), surface
    the Gaussian arm's own 12.6%-at-maximum figure wherever the Student-t
    arm's "26/26 always" is cited, and design R1's binding rule around the
    accept-by-rung-8 signal (or the literal, full-count D2 definition) rather
    than a fixed threshold on the single-extreme exceedance proxy this run
    used.
  - >-
    This decision does not run a swept family of alternatives (only df=5 was
    tested) and does not supply R2(i)'s missing pre-declared false-accept
    threshold. Both are named as required, not performed here, consistent
    with keeping this decision scoped to adjudicating the completed review
    rather than opening a fourth round of analysis before recording what two
    independent reviews already established.
  - >-
    This Coordinator's own independent re-verification, both before and
    after the two reviews, covered the most consequential new claims (the
    Gaussian-arm 12.6% figure, the affine-invariance argument, a
    from-scratch R4 replication-0 reproduction, the R3a jackknife and R3b
    Fisher's-exact numbers) but did not re-run the Validator's full
    5000-trial Monte Carlo or re-spot-check all 12 of its R4 replications;
    that depth of check was performed once, by the Validator, and is taken
    on its word at that point, consistent with proportional independent
    verification (AGENTS.md rule 9) rather than duplicating a review that
    already reproduced the claim from scratch with different code.
  - Toy scale throughout; claim_tier toy; sota_delta zero; no measurement beyond what EV-INSTR-600710 already scopes is asserted by this decision itself.

  next_actions:
  - >-
    A v3 amendment to EXP-INSTR-36c8cf, addressing DEC-20260811-a4c7ec's
    original R1-R5 AND this decision's two additional framing corrections, is
    still required before amendment v2's line of repair may be approved. Not
    drafted here.
  - >-
    R1's mechanism specifically should be designed against the accept-by-
    rung-8 signal and/or the LITERAL D2 definition (full per-seed exceedance
    count, not the single-extreme proxy this run used), not a fixed threshold
    on the proxy metric this run reports -- per this decision's own rationale
    on why "exceed_total==26" would misfire against the Gaussian arm ~12.6%
    of the time.
  - >-
    R2(i) (a pre-declared, campaign-level acceptable false-accept-rate
    target) remains the single most valuable missing piece: without it,
    18.8% has no stated bar to clear or fail, in either direction. A future
    session should prioritise stating that target before extending R4's
    single-alternative test into a swept family, since the target determines
    how much sweeping is even worth doing.
  - >-
    This decision does not touch, and is not affected by, this branch's own
    separately-flagged and still-open items: the three-way SR3-gate design
    fork (DEC-20260810-d82c61, DEC-20260811-af68d1), or the pending approvals
    of EXP-ICINV-4d33aa amendment v4 and EXP-CANL-96b0ad amendment v2.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      The methodological pattern surfaced here (a stopping rule's asymptotic
      validity does not bound its finite-sample discriminating power against
      a plausible alternative; a diagnostic that always fires under the
      alternative can still fire non-trivially under the null, so aggregate
      incidence rate and a clean per-instance rule are different claims) is
      real and potentially reusable elsewhere in this campaign, but it is
      fully captured in RT-20260811-35ab34, RT-20260811-cb3211, VAL-20260811-
      bc336d and this record's own rationale. A standalone knowledge-corpus
      entry is not warranted until or unless a v3 amendment's repair is
      itself reviewed and this exact pattern recurs in a different
      instrument, consistent with DEC-20260811-a4c7ec's own reasoning for
      the same lane.

