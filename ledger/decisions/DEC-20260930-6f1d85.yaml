  post_hoc_disclosure: >-
    The amendment postdates the committed report (snapshot a1a070493457)
    and its composition (DEC-20260930-8553d4). Its author read both before
    writing any key. Three disciplines were applied. Each key has a
    principled basis that would apply to any report. Where principle was
    balanced, the conservative option was chosen. And each key's effect on
    the committed report is recorded separately. Two keys could favour
    adoption in FUTURE rounds relative to a stricter alternative: K1 (route
    independence from J4) and K3 (sub-threshold overreach as a cure
    condition rather than a DISSENT). Both say so and meet the higher bar,
    because the line each relies on was pre-registered (C-2; J2's
    breaking_artifact) and each adds restrictions. On the committed report,
    no key and no rejected alternative changes whether a route is adopted.

  settlements:
    - key: K1 (gap 1)
      rule: >-
        Route (c) requires J1, J2 and J3; route (a) requires J4. A route is
        adopted only if every joint it requires composes as CONCUR. Any
        DISSENT (B-D), wording defect (B-W) or not-established status (N-E) on
        such a joint blocks the route, so a DISSENT on J2 or on J3 blocks
        route (c). A DISSENT on a joint the route does not require does not
        block it (C-2), unless the DISSENT's grounds condemn a record or text
        that the adoption would rest on or would write. Every DISSENT is
        carried by reference, and nothing it denies may be asserted. A
        DISSENT persists until a Coordinator decision supersedes it on the
        merits, citing a fresh rule-12 review of the cured object.
      basis: >-
        templates/research-records.md defines joints as "the load-bearing
        steps: if one fails, the claim fails". Criterion (c) says "scoped",
        and J3's attack plan asks "Is the no-go scoped (J2)?". The criteria
        are disjunctive, which is where C-2 comes from. AGENTS.md says "A
        single DISSENT blocks closure ... stands until ... superseded on the
        merits".
      rejected: >-
        J1-alone (C-2 read as sufficient): it favours adoption, contradicts
        the load-bearing definition and empties "scoped". Whole-goal (any
        DISSENT blocks every route): it contradicts the pre-registered C-2
        and the disjunctive criterion, and it would make no difference on
        the committed report.
      effect_on_committed_report: >-
        Route (c) is blocked on J1 (B-W), J2 (B-D) and J3 (B-D). Route (a) is
        blocked on J4 (B-D). The J4 grounds do not reach the route-(c)
        object, but a route-(c) adoption may never assert criterion (a) or
        full monodromy on the ordered base. The outcome is unchanged.
    - key: K2 (gap 2; optional, settled prospectively)
      rule: >-
        INCONCLUSIVE on a joint the route requires composes as N-E. It blocks
        adoption, it is not a DISSENT and not negative evidence, and the
        route remains open. The cure is a fresh rule-12 review of that joint.
      basis: >-
        Conjunctive joints; AGENTS.md "Reachable is not automatic"; core
        rules 5 and 6; C-8.
      rejected: >-
        As CONCUR, because it would adopt on an unestablished step. As
        DISSENT, because it would read absence of support as a negative.
      effect_on_committed_report: None. No joint is INCONCLUSIVE.
    - key: K3 (gap 3)
      rule: >-
        A J2 overreach finding that falls short of the breaking artifact does
        not change J2's verdict. It is a blocking cure condition on any
        adopting decision. Each finding must be answered by a committed
        narrowing, cited by finding id. A narrowing of a record's own
        directive must be an earlier committed correction record. The
        narrowing must be carried into the goal head, the C-4 supersession
        and any knowledge text. If a finding is left unanswered, J2 composes
        as B-W. Staleness in the underclaim direction stays under C-7.
      basis: >-
        J2's purpose ("close ONLY the instrument form"). Closure is the
        strongest claim. C-6's pattern of a correction carried in the
        wording. Precedent: DEC-20260810-2f86db D-2, and
        DEC-20260930-8553d4 CU-2 and CU-3.
      rejected: >-
        Ignoring the finding, because it would carry known overreach into a
        closure. Treating it as DISSENT, because that overrides the reviewer's
        classification and the pre-registered threshold (C-1).
      effect_on_committed_report: >-
        Moot, because J2 is B-D on O-1. O-2 is answered (D-2, CU-2) and O-3
        is answered (CU-3). O-4 is not answered by any committed record, so
        it is a condition on any future adopting decision.
    - key: K4 (gap 4, including SC-2 versus C-6)
      rule: >-
        The proves-too-much control and the blind re-derivation are
        instruments, not joints. Their findings compose under the joint whose
        breaking artifact they reach, and they never carry a verdict of their
        own. A failed control on the argument under review reaches J1 (object
        1) or J2 clause 3 (object 2). It composes as B-D if the reviewer
        DISSENTs, and as N-E if the reviewer CONCURs without addressing it. A
        disagreeing re-derivation must be localised first. Carve-outs are read
        as written and are not extended by analogy after the outcome. A
        correction that literally meets a breaking clause outside every
        carve-out composes as B-W under a CONCUR. It is cured only by a
        committed record carrying the corrected statement, reviewed under
        rule 12, and never by the composer's own wording.
      basis: >-
        Pre-registration discipline (agents/coordinator.md Prohibitions). C-6
        names only distinctness. The frozen J1 text states "cardinality
        deg_T S_m = 2^{m-2}", which SC-2 shows is false for the affine
        degree on S_{m-1} = 0. Precedent for not re-scoring forward:
        CORR-20260904-33fbf3 (M3 not rescued by a post-hoc null) and
        EXP-ECRANK-73275e amendment v2 ("NEVER re-scored").
      rejected: >-
        The purposive reading, under which SC-2 is scope and J1 composes as
        CONCUR. It is mathematically reasonable, but it widens a
        pre-registered carve-out after the fact in the direction of
        adoption, on analogy alone. Relabelling J1 as DISSENT, because that
        breaches C-1.
      effect_on_committed_report: >-
        J1 is B-W on SC-2. Its verdict as reported stays CONCUR, and the
        substance (splitting, sign-set membership, trivial Frobenius) is
        affirmed. SC-1 is scope under C-6. The control passes for D-1, and the
        D-5 failure is under J2. The cure is CU-6 (scope = CU-1) plus CU-7,
        both already in the sequence. The route outcome is unchanged.
    - key: K5 (binding scope)
      rule: >-
        K1-K4 bind every future composition of this report. They are also the
        default, pre-review keys of every successor route-(c) or route-(a)
        review round on GOAL-MONO-001, CU-7 included. A key may be relaxed
        only by an amendment committed before that round's reviewer
        launches. A successor plan must name, per route, the joints it
        requires, must state per-joint carve-outs (including degenerate
        subloci), and must list any unstated composition question, with N-E
        as the default.
      effect_on_committed_report: none beyond K1-K4.

  recomposition_assessment:
    could_recomposition_adopt_a_route_now: false
    reasoning: >-
      Under plan+A01, route (c) is blocked on J1, J2 and J3 and,
