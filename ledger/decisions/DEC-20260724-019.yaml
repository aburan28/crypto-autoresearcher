coordinator_decision:
  id: DEC-20260724-019
  remapped_from: DEC-20260724-008
  remapping_note: >-
    Canonical copy of the frozen ML-KEM record after its ID collided with an
    independently archived canonical record on main. Body unchanged apart
    from remap metadata and cross-references retargeted to the remapped IDs
    (see CORR-20260724-004).
  context: >-
    GOAL-MLKEM-001 BATCH-006 execution, independent validation, and independent
    red team of EXP-MLKEM-003 (hardened multi-class ML-KEM comparison-conformance
    gate applied across wolfSSL pre-fix, wolfSSL post-fix, and liboqs 0.12.0)
    under Cursor Grok 4.5 after verified run-package snapshot e487652. This is
    the sixth and final batch of the declared six-batch campaign budget.
  decision: inconclusive_scoped
  target_ids:
    - H-MLKEM-003
    - EXP-MLKEM-003
    - GOAL-MLKEM-001
  outcome_classification_adjudication:
    executor_reported: isolated_to_audited_commits
    official: generator_hardening_insufficient
    authority: >-
      The validator declined to settle the class and referred it to the
      coordinator under Q-OUTCOME-PRECEDENCE-TENSION; the red team reached
      generator_hardening_insufficient independently as its most damaging
      finding (OBJ-RT003-002, severity critical, changes_outcome_class true).
      The coordinator read the frozen text and the raw arrays directly before
      deciding.
    reasoning: >-
      The frozen specification defines generator_hardening_insufficient as the
      case where G2, G3, and G4 produce no finding that G1 did not already
      produce, on any target including the positive control, and ranks that class
      above isolated_to_audited_commits in the precedence list. RUN-MLKEM-012
      records G2_minus_G1 and G3_minus_G1 as empty lists, the validator
      recomputed both as empty from the raw per-index tables, and G4 cannot
      contribute a comparison-omission finding by protocol construction. The
      antecedent is satisfied exactly. The executor's contrary justification —
      a flag asserting that G2 and G3 added discriminating power because they
      also detected the known region — contradicts the specification's own
      definition of the metric, which counts only findings G1 did not produce.
      Rediscovery is not marginal information.
  rationale:
    - >-
      The run package is admissible. The validator returned
      accept_with_qualifications with zero hash mismatches across all 50 archived
      paths, confirmed the snapshot and its parent are reachable from HEAD,
      recomputed the positive-control silent set and the class marginals
      independently from raw data with no discrepancy, and recorded no blockers.
    - >-
      The experiment genuinely answered three of the five objections it inherited
      from BATCH-005. OBJ-001 is answered: decapsulation-boundary tables exist
      separately from primitive tables, and the 94 pre-fix AVX2 accepts are a
      strict message-stable subset of the silent set rather than universal
      acceptance. OBJ-003 is answered within qemu scope: both NEON backends carry
      Algorithm 18 evidence, so no verdict rests on direct-symbol probing alone.
      OBJ-004 is answered: seed-1 encapsulation key, ciphertext, and shared
      secret bytes are archived per parameter set with digests that the validator
      recomputed.
    - >-
      Two objections are restated rather than answered, and this is what decides
      the batch. OBJ-002, the charge that the post-fix null was an artifact of a
      single-byte generator, returns in a sharper form: the widened generator was
      built, run, and produced no marginal finding anywhere, so the null it
      yielded is exactly as narrow as the null it was meant to strengthen.
      OBJ-005 returns as rebranding: the NIST ACVP prompt and expectedResults
      pair was downloaded and then not used, while the anchor actually applied is
      liboqs's own in-tree projection, carrying an ACVP-derived name and a strong
      grade. For liboqs that means an implementation validated against vectors
      shipped inside itself.
    - >-
      The isolation observation is real and is retained as scoped measurement:
      no reproducible silent index and no equal-length decapsulation accept
      appeared on any wolfSSL post-fix backend or on liboqs 0.12.0 under the
      grids executed. It is not promoted to the isolation outcome class, and it
      must not be quoted as evidence that optimized ML-KEM comparison code is
      systemically clean. The red team's representativeness objection stands:
      liboqs's AVX2 verify is length-parameterized and structurally completes all
      vector blocks plus a remainder, so it does not stress the fixed-bound
      hand-written tail mechanism that produced the wolfSSL defect, and no
      implementation that does stress it was ever attempted.
    - >-
      The coordinator accepts responsibility for a specification defect. Because
      the marginal-information class was ranked above the target conclusion, and
      because the inherited positive control was already fully visible to the
      single-byte class — EV-MLKEM-005 records the whole 32-byte omission as G1
      detectable — the widened generator had essentially no room to produce a
      marginal finding on the control, while any genuinely new finding elsewhere
      would have triggered the higher systemic class. The isolation outcome was
      therefore close to unreachable the moment the contract was frozen, and that
      was determinable at design time from evidence already in hand. The protocol
      authored under TASK-20260724-233 is at fault, not its execution.
    - >-
      Two artifact-integrity defects recur from BATCH-005 and are now a pattern
      rather than an incident: run wall-clock excludes library build work, and
      recorded commands for three of four runs are descriptive summaries rather
      than exact argv. The validator marked those three command.txt artifacts
      fail. An undeclared reinterpretation of the mutation cap from per target
      and parameter set to per class is also recorded. None of these fabricate a
      measurement, and none is a mathematical result, but together they mean the
      package does not meet the AGENTS.md exact-command bar and future execution
      tasks in this program must treat that bar as a completion gate rather than
      a qualification.
    - >-
      H-MLKEM-003 is inconclusive. Its detection conjunct held, its isolation
      conjunct was observed but not licensed at the strength the hypothesis
      demanded, and its hardening premise failed the protocol's own
      discrimination gate. Nothing was mathematically falsified and no scope was
      closed, so this is neither a rejection nor a weakening.
  evidence_refs:
    - EV-MLKEM-006
    - coordination/goals/GOAL-MLKEM-001/batches/BATCH-006/tasks/TASK-20260724-237/validation_report.yaml
    - coordination/goals/GOAL-MLKEM-001/batches/BATCH-006/tasks/TASK-20260724-238/red_team_report.yaml
    - experiments/EXP-MLKEM-003/execution-report.yaml
  limitations:
    - No attack, oracle, exploitation path, or key recovery was built, and none is authorized.
    - Nothing here bears on MLWE hardness or passive ML-KEM security.
    - No release is approved and no library outside the audited wolfSSL commits and liboqs 0.12.0 at f4b96220 is characterized.
    - The cross-implementation null covers one implementation, on a combined rather than per-class grid, with malformed-length behavior never observed at its API.
    - NEON evidence is qemu-aarch64 only; native aarch64 silicon remains untested and NEON malformed-length behavior was never measured.
    - Stage resource accounting is incomplete because manifest wall times exclude build work.
  hypothesis_status_record:
    H-MLKEM-003: inconclusive
    prior_status: specified
    note: >-
      File ledger/hypotheses/H-MLKEM-003.yaml is not rewritten in this ledger
      archive because BATCH-006 artifact ownership remains with
      TASK-20260724-233; this decision is the official status binding.
  knowledge_promotion:
    promoted:
      - KN-TECH-054
    rationale: >-
      One transferable lesson is worth keeping, and it is methodological rather
      than cryptographic: an outcome-precedence list that ranks a
      "your instrument added nothing" class above the conclusion you are trying
      to reach is self-defeating unless the positive control contains a component
      invisible to the baseline generator class. That failure mode is
      independently reconstructible from the committed artifacts, was reached by
      two independent reviewers, and applies to any differential-conformance
      protocol, so it is promoted as a technique entry. Nothing is promoted as a
      finding: the isolation observation did not attain its outcome class, the
      cross-implementation null rests on one unrepresentative implementation,
      and KN-FIND-001 already records what EXP-MLKEM-002 established. No
      correction record is emitted, because no prior ledger or corpus claim is
      contradicted — KN-FIND-001 and EV-MLKEM-005 are scoped to the single-byte
      gate and remain accurate.
  campaign_disposition:
    status: closed_at_budget
    batches_used: 6
    batches_authorized: 6
    completion_criteria_met: []
    completion_criteria_not_met:
      - >-
        No mechanism was specified with reproducible evidence and a fully charged
        attack estimate that materially improves a matched baseline for any
        standardized ML-KEM parameter set. The campaign never reached a
        cryptanalytic mechanism; it converged on defensive implementation
        conformance, which is a different subject and cannot satisfy this
        criterion at any evidence strength.
      - >-
        Independent Reviewer and Red Team sessions did verify scope and the
        absence of uncharged costs, but there was no novel cryptanalytic claim
        for them to verify novelty or correctness of.
    criterion_met:
      - >-
        Coordinator evidence, decision, and the warranted knowledge entry are
        committed through verified ledger archives for every batch. This is the
        procedural criterion and it holds; it does not substitute for the
        substantive ones.
    honest_summary: >-
      GOAL-MLKEM-001 set out to find algorithmic mechanisms that could materially
      reduce the cost of attacking ML-KEM. It did not find one, and it did not
      come close. What it produced instead is a validated defensive artifact —
      a byte-complete differential conformance gate that discriminates incomplete
      ML-KEM re-encryption comparisons at fix boundaries, recorded in
      KN-FIND-001 — plus, in this final batch, a null about that gate's own
      hardening. The campaign closes at its declared budget with its primary
      objective unmet. That is the accurate accounting and it should not be
      presented as a partial success against the stated goal.
  next_actions:
    - >-
      Close GOAL-MLKEM-001 at its six-batch budget with its primary objective
      unmet, and open no seventh batch under this goal record. Any continuation
      requires a new goal whose objective matches what this line of work actually
      is — defensive ML-KEM implementation conformance rather than ML-KEM
      cryptanalysis — and whose first experiment fixes the two defects this batch
      exposed: a positive control containing a component invisible to the
      single-byte generator, so the hardening question is decidable at all, and a
      second implementation with fixed-bound hand-written assembly comparison
      tails, so the isolation question is asked of code that could actually fail.
  decided_by: coordinator
  decided_at: '2026-07-24'
