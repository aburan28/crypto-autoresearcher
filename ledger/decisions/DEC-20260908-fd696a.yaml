  context: Implement all five S3 spectral source-conformance repairs in a new immutable six-file package and preserve
    all earlier V/S2 fixes.
  rationale:
  - Accept S3-01 through S3-05 as reproduced source-conformance requirements. The independent suite used68fixedcases:55holds
    and13failedconformanceassertions,with0errors/timeouts/reruns and0scientificwork. A nonzero checker exit here
    identifies implementation defects; the review task completed validly.
  - Complete the existing ranked spectral runner before adding unimplemented reserve ideas. Preserve all seeds,counts,algorithms,statistical
    thresholds and scientific scope.
  - The review correctly disclosed failed host RLIMIT_AS installation and actual RSS below50MB. This is not successful
    hard-limit enforcement or a mathematical result.
  - Review authentication must follow the real queue plus write-once claim/release representation. Do not invent
    a flattened task claim field that actual governed artifacts do not contain,or confuse the Coordinator claim-holder
    session with the independently dispatched reviewer session.
  - Standing authorization approves source repair and fixed regressions only. No key,signature,lock,run allocation,measurement
    or launch admission is supplied.
  accepted_findings:
  - id: S3-01
    title: Review admission still accepts incomplete, contradictory, and unbound review authority
    required_correction: Locate the review task in the external authority queue; require its completed state, validator
      role, exact review-adversarial/xhigh envelope, claim owner/session/epoch and declared output paths. Require
      the standard attestation fields and exact owned joint/verdict, bind them to the precommitted plan and task,
      and require the archive path set to contain every declared review output.
  - id: S3-02
    title: A failed parent-directory fsync is silently reported as durable quarantine
    required_correction: Treat runs-parent fsync as part of quarantine completion. If it fails, retain an explicit
      parent_directory_fsync_failed field and a non-durable state; do not set quarantine_complete or state=quarantined.
  - id: S3-03
    title: A failed scalar certificate does not apply the frozen immediate-stop rule
    required_correction: Persist the failing certificate, terminate that census immediately, preserve a typed partial
      invalid-cell record, and propagate MeasurementInvalidStop before any later start, arm, control or cell is
      scheduled.
  - id: S3-04
    title: Interrupted collision diagnostics and per-diagnostic memory observations remain unretained
    required_correction: Meter coordinate and each null census through a failure-retaining wrapper, and record start/end
      or peak process-group RSS for every named diagnostic without substituting estimates. Keep completed and interrupted
      rows distinct and avoid serializing successful rows twice as partial records.
  - id: S3-05
    title: Long-loop guard probes still lack durable progress and artifact assembly has no machine guard
    required_correction: Thread on_progress through subgroup, collision and coordinate partition loops; persist
      every relevant outer/inner coordinate before Guard.check. Extend the guard through bounded artifact construction
      and publication or use chunked guarded serialization, retaining a typed operational failure state.
  approved_correction_boundaries:
  - Copy exactly TASK-20260908-111152 source (snapshot1cf7cc7004); preserve its accepted V01-V08/S2-01..08 behavior
    and all frozen scientific definitions.
  - For S3-01 bind the actual review task,state,role,inference,standard attestation and plan-owned joint/verdict,complete
    declared output set,and authenticated claim/release provenance from the external authority queue and actual
    Git blobs. Check source/read/archive/claim hashes and ancestry; refuse missing or contradictory fields. Preserve
    the distinction between control-plane claim holder and native reviewer provenance.
  - For S3-02 parent runs-directory fsync is part of quarantine durability; preserve a failure reason and non-durable
    state rather than claiming completed quarantine.
  - For S3-03 persist a failed scalar certificate and partial invalid-cell state,then raise the typed stop before
    another start,arm,control orcell. Retention must precede propagation.
  - For S3-04 meter coordinate/null collision diagnostics through failure-retaining wrappers and record actual per-diagnostic
    process-group memory observations along with CPU/wall,including interruption; avoid duplicate partial/success
    rows. Unavailable telemetry is an operational stop,not an invented number.
  - For S3-05 persist outer/inner progress before guard probes in subgroup,collision,coordinate and every long artifact
    path. Keep cancellation/RSS enforcement through bounded assembly andpublication,with truthful failure custody
    and lifecycle timestamps.
  - Use lower-level fixed synthetic/mock helpers and temporary synthetic Git/artifact fixtures. Never invoke a scientific
    or future-run entrypoint,including with mocked admission. The scope permits transient test files only in an
    owned temporary directory cleaned before sealing; every final output remains one of the six declared files.
