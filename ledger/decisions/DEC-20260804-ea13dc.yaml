coordinator_decision:
  id: DEC-20260804-ea13dc
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-052
  recorded_by_task: TASK-20260804-022
  archived_by: TASK-20260804-022
  context: >-
    BATCH-052 produced three proposals for SG-ECDLP-002: IDEA-ea13dc (isogeny cycle
    endomorphism, expected closure), IDEA-b6624c (ordinary isogeny MITM analogue of
    Wesolowski, novel conditional), IDEA-3d35ab (cross-field pairing attack, expected
    closure). Two are closure directions; one (IDEA-b6624c) is the most novel and
    potentially target-class conditional on key recovery.

  decision: admit_prioritized
  decision_scope: >-
    Admit IDEA-b6624c (ordinary isogeny MITM) as high priority — this is the
    analogue of Wesolowski's p^{1/3} result and the most promising direction for
    a target-class result. Admit IDEA-ea13dc and IDEA-3d35ab as medium/low priority
    closure directions that should be formally established. No hypothesis status
    change. GOAL stays active.

  target_ids:
    - GOAL-ECDLP-001
    - SG-ECDLP-002
    - BATCH-052
    - IDEA-20260804-ea13dc
    - IDEA-20260804-b6624c
    - IDEA-20260804-3d35ab

  rationale:
    - >-
      IDEA-b6624c is the closest analogue to Wesolowski's supersingular p^{1/3}
      result for ordinary curves. The MITM collision on the isogeny graph is
      guaranteed at O(p^{1/3}) cost (birthday paradox on h(D)~p^{1/2} nodes with
      p^{1/6} samples). The ONLY remaining question is key recovery from the class
      group collision. This is the CORE open problem for ordinary ECDLP sub-rho.
    - >-
      IDEA-ea13dc: expected to produce a formal closure proof that generic
      prime-field curves have no non-trivial endomorphisms from isogeny cycles.
      A clean negative result worth having.
    - >-
      IDEA-3d35ab: expected to produce a formal circularity argument for
      cross-field pairing attacks. Also a clean closure.

  proposal_dispositions:
    - id: IDEA-20260804-b6624c
      disposition: admitted
      priority: high
      next_step: >-
        Dispatch a mathematical analysis task (research-deep, max effort) to complete
        the proof_search_map audits for IDEA-b6624c: (1) literature search for prior
        ordinary isogeny MITM proposals; (2) implement the MITM collision at bits=20
        as a BASELINE to confirm the collision cost; (3) formalize the key-recovery
        problem as a separate well-defined problem; (4) determine whether the
        key-recovery problem has any known sub-rho algorithm.
    - id: IDEA-20260804-ea13dc
      disposition: admitted
      priority: medium
      next_step: >-
        Dispatch a mathematical analysis to confirm End_{F_p}(E) = Z for generic
        prime-order curves (confirm the CM theory theorem as a closure).
    - id: IDEA-20260804-3d35ab
      disposition: admitted
      priority: low
      next_step: >-
        Mathematical analysis to formalize the circularity barrier for cross-field
        pairing attacks. Close this direction with a named obstruction.

  exact_next_action: >-
    Open BATCH-053 with one high-priority task: mathematical analysis of IDEA-b6624c
    (ordinary isogeny MITM key-recovery problem). Complete the four proof_search_map
    audits, implement the MITM collision at bits=20 to confirm the p^{1/3} collision
    cost baseline, and formally define the key-recovery problem as a standalone
    hypothesis (H-MITM-*). If the key-recovery problem is resolved: design an
    experiment. If it is blocked: name the obstruction and pivot to the next direction.

  knowledge_promotion:
    promoted: []
    not_warranted: Proposals not yet validated.
  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2 (conditional improvement if key recovery solved)
    sota_delta: {time_exponent: conditional, memory_exponent: not_applicable, data_or_query_exponent: not_applicable}
  claim_ceiling: theoretical
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-04'
