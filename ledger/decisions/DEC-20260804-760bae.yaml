coordinator_decision:
  id: DEC-20260804-760bae
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-049
  recorded_by_task: TASK-20260804-007
  archived_by: TASK-20260804-007
  context: >-
    BATCH-049 produced four proposals for revised SG-ECDLP-002 mechanisms
    (TASK-20260804-006) after H-IT-001 was weakened for ordinary-isogeny
    mechanisms by DEC-20260804-2fae6a. Proposals were authored by the Coordinator
    session under the idea-generator role contract after the idea-generator
    subagent returned empty twice (disclosed in provenance.yaml).

  decision: admit_prioritized
  decision_scope: >-
    Admit IDEA-027a00 and IDEA-e88120 as high-priority proposals for hypothesis
    specification and experiment design. Defer IDEA-d9ba63 (known-in-substance).
    Retire IDEA-dac413 (known attack, not a new direction). No hypothesis status
    change. GOAL stays active.

  target_ids:
    - GOAL-ECDLP-001
    - SG-ECDLP-002
    - BATCH-049
    - IDEA-20260804-dac413
    - IDEA-20260804-d9ba63
    - IDEA-20260804-027a00
    - IDEA-20260804-e88120

  rationale:
    - >-
      IDEA-dac413 (quadratic twist co-attack): This is the known "twist anomalous"
      attack (Smart/Satoh-Araki extended to twists). novelty_status = known.
      Standard curve selection explicitly excludes trace ∈ {0, ±1, ±sqrt(p)}.
      Not a new research direction; retire.
    - >-
      IDEA-d9ba63 (volcano-surface endomorphism descent): GLV with class-number-1
      CM is known in substance (GLV 2001, GLS 2009). Gives at most constant-factor
      improvement (~1.32x). Not target-class for generic prime-field curves.
      Defer pending a NEW mechanism that uses the volcano beyond GLV.
    - >-
      IDEA-027a00 (Semaev factor base orbit enlargement): Novel. If ordinary
      2-isogeny preimages of the factor base provide density amplification beyond
      a constant factor, this could change the index-calculus asymptotic. The
      proof_search_map audits are present (observation collision, baseline
      reproduction, quantifier-order statement, method ceiling). The null-object
      control (random map vs isogeny) is well-defined. Minimum discriminating
      test is cheap (bits=20, < 5 seconds). Admit as H-027a00 candidate.
    - >-
      IDEA-e88120 (class group DLP reduction): Potentially target-class conditional
      on (a) a valid reduction from ECDLP to Cl(O_K) DLP and (b) L[1/2] class
      group algorithms for |D| ~ p. The proof_search_map identifies the exact
      open question (is there a circular reduction?). The closest known work is
      Galbraith-Smart 1999 and the CSIDH literature; neither establishes the
      reduction for ordinary prime-field curves. Admit as H-e88120 candidate
      with mandatory proof_search_map completion before any Executor dispatch.

  proposal_dispositions:
    - id: IDEA-20260804-dac413
      disposition: retired
      reason: Known attack (twist-anomalous = Smart extended to twists). novelty_status = known.
    - id: IDEA-20260804-d9ba63
      disposition: deferred
      reason: >-
        GLV known in substance. Constant-factor only. Defer until a mechanism
        using the volcano structure beyond GLV is proposed.
    - id: IDEA-20260804-027a00
      disposition: admitted
      priority: high
      next_step: >-
        Dispatch Coordinator to specify a hypothesis H-027a00 from this proposal
        and design a frozen experiment contract EXP-027a00 with the density
        amplification test. Proof_search_map audits must be verified before freeze.
    - id: IDEA-20260804-e88120
      disposition: admitted
      priority: high
      next_step: >-
        Dispatch a mathematical analysis task to complete the proof_search_map
        audits for IDEA-e88120: (1) verify no known efficient reduction from ECDLP
        to Cl(O_K) DLP exists (literature search); (2) state the quantifier-order
        claim precisely; (3) determine the method ceiling. Only after audits
        complete should a hypothesis be specified and experiment designed.

  exact_next_action: >-
    Open BATCH-050: dispatch two parallel tasks — (A) mathematical audit of
    IDEA-e88120 proof_search_map (literature search for existing ECDLP -> class
    group DLP reduction; confirm it is novel); (B) hypothesis specification and
    experiment design for IDEA-027a00 (Semaev factor base orbit enlargement with
    the density amplification test). Both tasks run concurrently; each has its
    own write_scope and archival task.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Proposals are speculative. No validated finding to promote yet.
  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2 (no admitted proposal has verified sub-rho claim)
    sota_delta:
      time_exponent: not_applicable
      memory_exponent: not_applicable
      data_or_query_exponent: not_applicable
  claim_ceiling: theoretical
  official_research_state_changed: false
  asymptotic_promotion_gates:
    proof_decomposition: open
    numbered_heuristics_validated: open
    concrete_cost_table: open
    independent_review_xhigh_and_red_team: open
  decided_by: coordinator
  decided_at: '2026-08-04'
