    independent_review_path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-56187a/reviews/TASK-20260808-1da4a9/review-report.yaml
    independent_review_sha256: 29b0237e4c4be6fcd1cd9a0e6aef23ab8f57cd2499f28a09bcdd50c6f9e61bca
  rationale:
    estimator_and_bridge_repair: >-
      The direct marginal log-link has the correct finite-design target and
      the matched-mean construction exactly exposes polynomial clustering.
      These proposal-level facts preserve the lane but supply no treatment
      observation or speedup.
    execution_authorization:
      granted: false
      reason: >-
        The coverage contract undercounts three eta values and lacks complete
        reference and seed bindings, control selected-pair and candidate work
        exceeds the declared traffic/archive caps when charged, and the
        unequal-pair isomorphism fixture is not reproducibly specified.
    statistics_obligation: >-
      Freeze eta-specific pseudo-true targets or narrow calibration to eta=0,
      then state exact thresholds, seed domains, 50325504 refits when all eta
      values remain, and recomputed S2 CPU, wall, throughput, and summaries.
    control_and_budget_obligation: >-
      Enumerate selected-pair, hash, join, equality, verification, candidate,
      archive, communication, workspace, wall, and CPU rows for every selector
      control and treatment; specify and charge every unequal-pair fixture.
  proposal_disposition:
    status: proposed
    action: preserve_pending_versioned_revision
    novelty_status: unverified
    dominated_by: >-
      No measured gamma_s exists. The proposal's own fully charged rho
      comparison requires gamma_s>5/18, so no Pareto improvement is established.
  cheapest_falsification_control: >-
    First repair the design contract, then decode and analyze only the two
    deterministic matched-mean root streams. Requiring exact recovery of equal
    means and the planted 1/3 clustering/Boolean-success separation is cheaper
    and more discriminating than curve generation or full selector controls.
  next_actions:
    - >-
      Author a versioned replacement whose deterministic schedule compiler
      freezes all eta coverage cells and enumerates every operation, traffic
      event, retained record, and byte for treatment and all controls.
    - >-
      Add the exact unequal-isomorphism generator and noncollision fixture,
      preserve the repaired marginal estimator and matched-mean bridge, then
      snapshot the replacement and obtain a new independent
      review-adversarial verdict before any experiment contract or approval.
  restart_condition: >-
    A new non-overlapping batch may reopen this successor only when both next
    actions are satisfied. User direction to continue authorizes repair work;
    it does not waive mathematical, cost, review, or evidence gates.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is design-review evidence with no experiment, theorem, or validated
      cryptanalytic improvement.
  claim_ceiling: >-
    A materially improved low-prior proposal exists, its marginal estimator
    and matched-mean bridge are independently checked, and three remaining
    design blockers are precisely recorded. No attack, speedup, security
    impact, crypto-scale result, or breakthrough is supported.
  official_research_state_changed: true
  official_state_change: >-
