  context: >-
    BATCH-56187a produced one versioned repair of IDEA-20260808-2fabbc,
    snapshot-committed its exact proposal and producer report, and obtained a
    distinct xhigh native Codex Validator review. The verdict is REVISE: the
    central marginal estimator and matched-mean bridge repair pass, but the
    eta-aware coverage schedule, full selector-control resource accounting,
    and unequal-isomorphism negative fixture remain blocking.
  decision_scope: >-
    This decision governs only whether IDEA-20260808-9d6677 advances to an
    experiment-design task. It decides nothing about the truth of prime-field
    ECDLP security, moves no hypothesis or research-question status, and does
    not close the broader Boolean-success lane or GOAL-ECDLP-001.
  target_ids:
    - GOAL-ECDLP-001
    - BATCH-56187a
    - IDEA-20260808-9d6677
  evidence_ids:
    - EV-ECDLP-48bf90
  source_snapshot_commits:
