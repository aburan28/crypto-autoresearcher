  review_disposition:
    review_id: RT-20260802-215
    verdict: REVISE
    adopted: true
    critical_finding:
      id: RT-215-C1
      title: certificate_verifier_collision_omission
      disposition: sustained
      effect: >-
        Lemma 6, its statistical formula, PO-213-08, and any inference of an
        acquisition-only exponent lower bound from that lemma are invalid as
        written. A producer may emit R=G without an informative producer
        collision while a perfectly sound ordinary-generic verifier performs
        its own DLP collisions and accepts on the d instances alpha^d=1.
      forbidden_retention:
        - certificate_bearing_lower_bound_as_written
        - producer_only_collision_bound_with_verifier_work_omitted
        - proof_complete_label
    additional_repairs:
      - id: RT-215-C2
        requirement: >-
          Use a fixed symbolic transcript independent of alpha and include raw
          encoding branches and every collision root relevant to the game.
      - id: RT-215-C3
        requirement: >-
          Retain P*(q_g+1)+(q_g+1)^2=Omega(N), or define q to include Q, and
          charge preprocessing construction, P/K, accesses, comparisons, and
          peak memory separately.
      - id: RT-215-C4
        requirement: >-
          Require an oracle-issued output handle or add an encoding-guess term;
          bound and charge every certificate scalar, handle, bit, access, and
          verification operation.
      - id: RT-215-C5
        requirement: >-
          Charge the tower family description, level materialization, setup-law
          certification, target-group Cheon operations, order/factorization
          data, certificate length, soundness, inverse success, memory, and data
          movement.
      - id: RT-215-C6
        requirement: >-
          Recompute dominance piecewise and use not_applicable rather than zero
          for ordinary deltas of ordinary-inadmissible rows.
  component_dispositions:
    - id: B033-C1
      component: affine_formal_label_closure
      disposition: retain_narrow_observation
      finding: >-
        In the declared random-encoding ordinary generic interface, addition,
        inversion, and disclosed-scalar multiplication preserve formal labels
        a+bX before an informative collision.
      claim_ceiling: >-
        This algebraic span observation is not by itself a complete adaptive,
        certificate-bearing, or expected-work lower bound.
    - id: B033-C2
      component: producer_output_agreement_bound
      disposition: revise_to_proof_obligation
      narrow_candidate: >-
        Subject to a fixed symbolic lazy-sampling game and an oracle-issued-
        output convention, a producer-output argument may bound correctness by
        ((P+1)L+binom(L,2)+rho_f)/(r-1).
      required_repairs:
        - Formalize the alpha-independent symbolic transcript and root union.
        - State whether L counts Q and every online producer label.
        - Add an encoding-guess term if output strings need not be oracle-issued.
        - Keep arbitrary certificate data out of this producer-output lemma.
        - Receive new independent review before any theorem is retained.
      status: unverified_pending_repair
    - id: B033-C3
      component: lemma_6_and_PO_213_08
      disposition: not_retained_false_as_written
      evidence: RT-215-C1
      repair_boundary: >-
        Either derive producer correctness from a repaired output-agreement
        lemma, or include all verifier labels and collisions and state only a
        combined producer-plus-verifier work conclusion.
    - id: B033-C4
      component: ordinary_generic_acquisition_composition
      disposition: retain_only_as_conditional_repair_target
      finding: >-
        If the corrected producer-output bound is proved, constant producer
        correctness with charged single-instance preprocessing yields
        P*(q_g+1)+(q_g+1)^2=Omega(N) and Omega(sqrt(N)) work. Only then does
        composition with known Cheon DLPwAI restore ordinary exponent 1/2.
      current_claim: not_proof_complete
    - id: B033-C5
      component: cheon_auxiliary_input_route
      disposition: retain_as_known_prior_art_baseline
      input: G, alpha*G, alpha^d*G
      time: O(sqrt((r-1)/d)+sqrt(d))
      balanced_time_exponent: 0.25
      ordinary_input_supplies_alpha_power_point: false
      novelty: known_prior_art
    - id: B033-C6
      component: graded_bilinear_tower
      disposition: retain_typed_conditional_oracle_interface_only
      finding: >-
        Under the stated graded bilinear axioms, addition chains can create a
        same-group Cheon triple T_d, alpha*T_d, alpha^d*T_d in O(log d) map
        calls. This call count is not a construction, setup, data, target-group,
        certificate, verification, memory, or expected-cost bound.
      concrete_ordinary_elliptic_curve_tower: not_supplied
      ordinary_ECDLP_effect: none_established
    - id: B033-C7
      component: tower_setup_boundary
      disposition: unresolved_cost_gate
      finding: >-
        At balanced d=N^(1/2+o(1)), an explicit Theta(d) setup or accessed data
        has exponent 1/2 and eliminates a strict sub-rho time gain. Reaching
        level d alone does not rule out a uniform succinct family, but no such
        family is instantiated here.
    - id: B033-C8
      component: ordinary_ECDLP_SOTA_claim
      disposition: not_authorized
      finding: >-
        No repaired proof, concrete non-generic construction, experiment, or
        complete sub-rho cost bound changes the ordinary Pollard frontier.
