  rationale:
    - >-
      RT-215-C1 is a direct counterexample, so Coordinator synthesis cannot
      repair or silently narrow Lemma 6 in prose and cannot retain it as proved.
    - >-
      The affine-label span and output-agreement route remain worth a bounded
      proof repair, but the exact symbolic game, output convention, q_g+1 terms,
      and verifier boundary must be explicit before interpretation.
    - >-
      Cheon's downstream exponent improvement belongs to an augmented-input
      problem; the ordinary instance still lacks alpha^d*G.
    - >-
      The tower exposes the algebraic kind of interface that would multiply
      hidden scalars, but symbolic call complexity without a concrete uniform
      construction and full costs cannot change an ordinary-ECDLP claim.
    - >-
      Further certificate or Pareto prose without the cheapest proof mutation
      would not reduce the decisive uncertainty.
