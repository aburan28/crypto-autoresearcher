coordinator_decision:
  id: DEC-20260804-1762a4
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-073
  recorded_by_task: TASK-20260804-086
  archived_by: TASK-20260804-087
  context: >-
    BATCH-073 empirically measured max_k |hat{1_F}(k)| / sqrt(B) at p=1009..4001.
    Result: C ≈ 2.7-3.1 (no systematic growth with p at toy scale).

  decision: support_hpseudo_empirically
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    H-PSEUDO has EMPIRICAL SUPPORT at toy scale (p=1009..4001): constant C ≈ 3
    shows no growth with p across tested range. This is positive evidence that
    H-PSEUDO may be true.

    WHAT THIS ESTABLISHES: At toy scale, the DL Fourier character sum is bounded
    by ~3*sqrt(B) for k=1..300. This is consistent with H-PSEUDO being true with
    constant C ≈ 3. Combined with the yield measurements (yield ≤ heuristic at
    p≥4001), the picture is internally consistent: C=3 explains why yield errors
    are O(3^m/N^{1/2}) ≈ negligible at p=4001.

    WHAT THIS DOES NOT ESTABLISH: (1) Full k-range bound (only k=1..300 tested).
    (2) Scaling to crypto scale (p=2^256). (3) A proof of H-PSEUDO.

    H-PSEUDO remains an open problem but is now empirically supported at toy scale.

    KNOWLEDGE PROMOTION: Promote the empirical C ≈ 3 result to KN-FIND.
    This is the first measurement of the H-PSEUDO character sum constant.

    GOAL-ECDLP-001 stays active.

  exact_next_action: >-
    BATCH-074: (A) Extend C measurement to full k range (k=1..N) at p=1009 to
    confirm C ≈ 3 holds at all k. (B) Promote the H-PSEUDO C≈3 finding to KN-FIND.
    (C) Propose a hypothesis H-PSEUDO-001 at `specified` with the formal claim
    C = O(1) (constant C, no growth with p or B).

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No KN-* entry was created by this decision. The record's `promoted` list held
      a placeholder id for a promotion that was OWED but never made, which made the
      record assert the opposite of the truth -- that the corpus had been updated.
      Converted under DEC-20260805-7b3e91 (RUL-9): the obligation is declared here,
      where the schema puts an unmet obligation, and every word of the original
      entry is preserved verbatim under owed_promotions below. Nothing was deleted.
    owed_promotions:
      - id: pending_kn_find_hpseudo_c3
        note: >-
          Empirical H-PSEUDO constant: C = max|hat_1F(k)| / sqrt(B) ≈ 3 at
          p=1009..4001, k=1..300. No growth with p. First measurement of the
          H-PSEUDO character sum constant.

  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2 (H-PSEUDO empirically supported, not proved)
    sota_delta: {time_exponent: not_applicable}
  claim_ceiling: toy
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-04'
