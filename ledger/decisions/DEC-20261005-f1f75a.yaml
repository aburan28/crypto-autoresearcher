coordinator_decision:
  id: DEC-20261005-f1f75a
  context: >-
    Design tick on 2026-10-05. origin/main was fetched and this
    branch was created at 7ab85b985a. IDEA-20261004-e4c461 had only
    H-SSI-89db95, which checks the integers 2 and 1 and does not
    build a graph. The label-transport claim had no curve contract.
  decision: approve
  target_ids:
    - IDEA-20261004-e4c461
    - H-SSI-07fa48
    - EXP-SSI-c34de8
  rationale:
    - >-
      SSI is an ECC area. The contract enumerates depth-two walks
      on the Phi_2 graph of the supersingular sets at primes
      7, 11, and 19.
    - >-
      A design-session count, not a run, gave ambiguous starts
      0, 2, 2 and conflicting walk pairs 0, 3, 8. Both Phi_2
      formulas must recompute them.
    - >-
      Standing user authorization of 2026-09-06 covers approval.
      The protocol fields required before dispatch are filled.
    - >-
      H-SSI-89db95 is not edited. The papers named in the proposal
      were not reopened.
  evidence_refs: []
  limitations:
    - The graph is the F_p Phi_2 relation on at most two vertices.
    - No CSIDH action and no PKE impossibility claim.
    - Approval authorizes six deterministic runs. It does not assert the counts.
  next_actions:
    - >-
      Snapshot-archive this contract. Do not launch
      TASK-20261005-940155 until the receipt verifies.
  knowledge_promotion:
    promoted: []
    not_warranted: Approval of an unrun contract. No finding is promoted.
  decided_by: coordinator
  decided_at: '2026-10-05'
