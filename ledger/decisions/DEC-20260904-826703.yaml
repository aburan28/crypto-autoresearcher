coordinator_decision:
  id: DEC-20260904-826703
  context: >-
    EXP-MONO-8ec0e5 has now resource-exhausted TWICE: RUN-MONO-8ec0e5-1
    under the unmodified O(p)-per-pair Z-determination (863.6s, 91 primes,
    to p=641), and RUN-MONO-8ec0e5-2 under protocol_amendment v1_to_v2's
    verified-correct fast O(log p) splitting test (884.8s, 108 primes, to
    p=751) -- a real, SR-A1-confirmed 1.55x throughput improvement, but
    far short of completing the declared [101,2000] range (278 primes)
    within the unchanged 900s budget. No independent review has been
    dispatched for either run, since neither produced a scientific claim
    to review (both are pure resource_exhaustion outcomes, AGENTS.md
    rule 3 -- not evidence for or against H-MONO-dd666a).
  decision: revise
  decision_label: >-
    joint_h_plus_h_minus_bivariate_test_remains_unresolved_after_two_resource_exhaustions_recorded_as_a_named_impediment_not_a_pause_effort_redirected_to_other_open_ranq_mono_001_work
  target_ids:
    - H-MONO-dd666a
    - H-MONO-1297d7
    - EXP-MONO-8ec0e5
    - RQ-MONO-001
    - GOAL-MONO-001

  hypothesis_status_before: proposed
  hypothesis_status_after: search_infeasible_at_declared_budget_pending_faster_enumeration_design
  hypothesis_status_after_note: >-
    H-MONO-dd666a's own two-sided prediction remains untested, not
    falsified and not confirmed -- the search that would test it has not
    yet reached a qualifying curve or exhausted the declared range under
    either implementation tried. A precise cost estimate now exists: at
    RUN-MONO-8ec0e5-2's own measured throughput (25,073.9 pairs/sec
    post-gate), completing the full declared range (359,646,974 total
    (A,B) pairs across 278 primes, computed exactly by the Coordinator)
    would take approximately 14,233 seconds (~3.95 hours) -- a real,
    disclosed number, not a guess, and far beyond any single approved run
    budget in this program to date. This status name is deliberately
    specific (not merely "inconclusive") so a future session immediately
    understands why: the BLOCKER is search performance, not a scientific
    ambiguity, and the exact next step is named in `next_action`.

  experiment_status_before: approved
  experiment_status_after: completed

  official_status_changes:
    goal_status_changed: false
    goal_status_after: active
    hypothesis_status_changes:
      - hypothesis_id: H-MONO-dd666a
        from: proposed
        to: search_infeasible_at_declared_budget_pending_faster_enumeration_design
    experiment_status_changes:
      - experiment_id: EXP-MONO-8ec0e5
        from: approved
        to: completed
    resource_disposition_changed: false
    completion_criteria_met: []
    implementation_authorized: false
    experiment_runs_authorized: 0
    scientific_interpretation_authorized: false
    closure_authorized: false
    breakthrough_authorized: false

  claim_tier: toy
  scope_statement: >-
    No scientific claim is made by this decision. Both runs are
    infrastructure-class outcomes (AGENTS.md rule 3). This decision
    records only: (a) the exact measured performance characteristics of
    two search implementations, (b) an exact extrapolated cost to
    complete the declared range, and (c) a disposition (impediment, not
    pause) for the sub-thread going forward.

  rationale:
    - >-
      TWO RESOURCE_EXHAUSTIONS WITH A REAL, VERIFIED SPEEDUP BETWEEN THEM
      IS A GENUINE ENGINEERING FINDING, NOT A REASON TO KEEP THROWING MORE
      OF THE SAME AT THE PROBLEM: the amendment's own fast splitting test
      is independently confirmed CORRECT (SR-A1 gate, 0 disagreements over
      496,102 pairs) -- the failure mode is purely a Python-level
      constant-factor cost problem, not a design or correctness defect.
      Per this program's own established discipline (recorded explicitly
      in CORR-20260904-b9f9c1's own "comparator degeneracy" naming),
      naming a recurring or persistent obstacle plainly is itself a
      finding, distinct from either abandoning the question or endlessly
      re-attempting the same class of fix.
    - >-
      A THIRD ATTEMPT AT THE SAME CLASS OF FIX (further Python-level
      micro-optimization of the same per-pair check) IS UNLIKELY TO CLOSE
      A ~4-HOUR GAP: the measured 1.55x speedup from a real O(p)->O(log p)
      complexity change suggests the remaining bottleneck is Python
      interpreter overhead itself, not algorithmic structure -- a further
      fix would need to either (a) reduce the NUMBER of (A,B) pairs
      actually enumerated (e.g. generating candidates directly by root
      pairs, since every genuine Z=3 curve corresponds to exactly one
      unordered pair of free roots via r3=-(r1+r2) mod p, eliminating the
      ~83% of non-singular pairs that don't split at all rather than
      merely making the per-pair check for them cheaper), which requires
      a NEW declared search order and its own amendment, reviewed
      properly rather than rushed; or (b) move the inner loop out of pure
      Python (e.g. a compiled extension), a larger engineering investment
      not undertaken lightly mid-session. Both are legitimate future
      options, named in `next_action`, neither attempted here.
    - >-
      RECORDING AN IMPEDIMENT, NOT PAUSING THE GOAL: per AGENTS.md rule 10
      ("Goals are never paused... A campaign that meets an impediment
      stays active and records it under impediments with
      what_is_blocked, clears_when, and a recheck"), GOAL-MONO-001 is NOT
      paused by this decision. This specific sub-thread (the joint
      h_+>=1/h_->=1 bivariate completion of the D3 closed form) is
      recorded as blocked; the goal itself, and RQ-MONO-001's own other
      open threads, remain active and this session's own effort is
      redirected to them rather than continuing to sink cycles into one
      stubborn performance problem when the underlying scientific
      question (does linearity hold jointly) is a valuable but
      non-load-bearing completion of an ALREADY-PROMOTED result
      (KN-FIND-edd62c, unaffected by any of this).
    - >-
      NO REVIEW WAS DISPATCHED FOR EITHER RUN, AND THAT IS CORRECT, NOT AN
      OMISSION: per this program's own review architecture, independent
      Validator/Red-Team review exists to adversarially check a
      SCIENTIFIC CLAIM. Neither run makes one -- both are pure
      infrastructure outcomes. Dispatching a review round over "did the
      script correctly report that it ran out of time" would spend real
      review budget on a claim nobody is at risk of over-believing.

  next_action: >-
    MEDIUM PRIORITY (not urgent -- KN-FIND-edd62c's own promoted result is
    unaffected and this is a completion, not a correction): when this
    sub-thread is next picked up, design a NEW experiment (its own
    hypothesis ID, its own protocol amendment or fresh specification) that
    enumerates Z=3 candidates DIRECTLY by choosing an unordered pair of
    distinct roots {r1, r2} in F_p (with r3 := -(r1+r2) mod p, all three
    required distinct and nonzero-sum-consistent), computing
    A = r1 r2 + r1 r3 + r2 r3 and B = -r1 r2 r3 in O(1) per candidate --
    this generates ONLY genuine Z=3 curves, eliminating the ~83% of
    non-singular (A,B) pairs that do not split at all, with no split test
    needed at all. This requires its own NEWLY DECLARED search order
    (root-pair ascending, not (A,B) ascending), disclosed and reviewed as
    a fresh, explicit design choice (not a quiet reuse of the old order)
    per this program's own discipline against post-hoc search-order
    gaming. In the meantime, redirect effort under GOAL-MONO-001 /
    RQ-MONO-001 to other open backlog items (per /research-status or
    /deep-research if the ready queue is empty).

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No scientific finding exists in these two runs to promote --
      infrastructure outcomes carry no evidentiary content (AGENTS.md
      rule 3). KN-FIND-edd62c's own already-promoted scope (the h_-,
      h_+=0 slice) is entirely unaffected and requires no revision.

  procedure_deviations:
    - >-
      The dispatched Executor session for RUN-MONO-8ec0e5-2 experienced a
      self-disclosed process-management incident (a duplicate concurrent
      invocation, fully reconciled before archiving -- see
      runs/RUN-MONO-8ec0e5-2/manifest.yaml and implementation.md's
      ADDENDUM (v2) section) and ended its own session twice without
      completing its report; the Coordinator independently confirmed
      (via `lsof` and `ps -p <pid> -o etime,%cpu`) that the underlying
      computation had genuinely run to completion before completing the
      run's manifest.yaml directly from the produced artifacts. No
      scientific content is affected.

  limitations:
    - >-
      H-MONO-dd666a's own falsification condition remains untested. This
      decision resolves nothing about whether the additive D3 form
      survives in the joint (h_+, h_-) regime -- it only resolves how to
      proceed given the search-performance obstacle encountered twice.
    - >-
      The ~4-hour cost estimate is an extrapolation from measured
      throughput on primes up to 751; larger primes in the declared range
      (up to 2000) likely cost MORE per pair on average (since the
      per-pair cost of both the fast test and the cubic_roots fallback
      still grows with p), so 14,233s is likely an UNDERESTIMATE of the
      true remaining cost, not an overestimate -- disclosed here so a
      future session does not treat it as a tight bound.

  reviewed_by: []
  decided_by: coordinator
  decided_at: '2026-09-04'
  inference:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
