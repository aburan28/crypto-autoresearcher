  rationale:
    - >-
      JOINT J-G1 (validator): VERDICT HOLDS_WITH_FINDINGS, all five checks
      PASS. (1) The 0.171940 false-plateau bound is CONFIRMED RANGE-WIDE:
      a 102-point exact sweep of phi in [1.0, 2.0] shows the false-positive
      rate strictly decreasing everywhere, worst case attained at phi = 1.0
      (where the M-PH object degenerates to the homogeneous truth), so over
      strictly heterogeneous phi > 1 the bound is a supremum approached as
      phi -> 1+ (0.1718971 at phi = 1.001). (2) The '11-17% disclosed
      residual' is CONFIRMED as [0.114124, 0.171940]: the statistical
      region probability 0.190179310825 splits exactly into tight-rule plus
      blocked components at every grid phi, grand accounting closes to
      1.000000000000, and ZERO boundary-cell mass exists at any decision
      boundary - no double-counting, nothing dropped. (3) The plateau mass
      is BIT-IDENTICAL under both cascade conventions (written order with
      Branch H first; Branches-1-5-only conditional), structurally forced
      by disjointness of the margin and gate intervals; conventions differ
      only in non-plateau routing. (4) The SR-2 heterogeneity-bound
      quantities all reproduce to every reported digit in a third
      independent fresh implementation, with oracle-verified p-values and
      exact non-central chi-square gaps. (5) Every condition of
      DEC-20260904-5427fa's execution_gate_statement has a concrete
      decision procedure as written. Six findings, ALL non-load-bearing
      for the gate decision: attainment-point semantics at phi = 1.0 (F1);
      an own-code crash disclosure closed from run-2 data (F2); a
      zero-effect tie-rule sensitivity (F3); rho map-factor lineage (F4);
      two gate-statement HARDENING notes (F5: a future authorization
      should declare explicitly whether it relies on the skeleton/pricing
      as binding text, and the RT2-SR-5 ruling should state the priced
      semantics it adopts); configuration-invariance extension (C9) not
      re-derived, outside named scope (F6). Runs 3/3; zero arms.
    - >-
      JOINT J-G2 (red-team, reserved re-review): VERDICT PASS with one new
      finding. All four RT2-SR-1..4 remedies independently verified
      landed: 14 diff paths, zero substantive drift, verbatim blocks
      byte-faithful with exactly the three restored glyphs, no new
      licensing surface, no prohibited sentence. The proves-too-much
      re-run is clean: NO control object reaches FM-PLATEAU-CONSISTENT
      under the corrected cascade; key values reproduced exactly to six
      digits in fresh code (OBJ-4 decay power 0.952538, OBJ-5B comparator
      0.989349 -> 0.884236, OBJ-5A bound 0.171940/0.186556, the 2.133e-77
      OBJ-5B plateau ceiling), MC grid within ~1 SE. AC-1 and AC-2 both
      dormant this round (nothing adopted); AC-1's defect persists in the
      untouched skeleton and activates on any verbatim adoption. Disclosed
      deviation: 3 scripts, 7 total executions (4 scoped bug-fix re-runs
      of RUN-1).
    - >-
      RT2-F6 (NEW FINDING FROM J-G2, class DISCLOSE): exact enumeration of
      a one-outlier fixed-effect equal-mean configuration BREAKS THE
      ARGUMENT behind the class-wide bound extension - its gate-catch at
      phi = 2.0 deviates +0.0101 from the bimodal construction, exceeding
      the disclosed C9 gap (0.0063). The bound's CONCLUSION survives
      numerically: every probed configuration's false-positive rate is at
      most 0.1595, well under 0.171940. What breaks is the generality of
      the extension argument, not the bound on the calibration family and
      the probed configurations.
    - >-
      PRIOR COMPARISON against DEC-20260904-1525b3 (recorded before any
      reviewer ran): POINT 1 CONFIRMED WITH NUANCE - the bound is
      range-wide as expected, but attained at phi = 1.0 (degenerate
      homogeneous limit), a supremum over strictly heterogeneous phi rather
      than an interior worst case; and the residual range is confirmed
      exactly [0.114124, 0.171940]. POINT 2 CONFIRMED - SR-2 arithmetic
      re-derives at gate scope and the gate statement is checkable as
      written. POINT 3 CONFIRMED - no scope creep from the corrections; no
      prohibited sentence; all five proves-too-much objects still route
      correctly. POINT 4 CONFIRMED - AC-1/AC-2 dormant this round. The
      prior was NOT overturned on any point; the informative additions
      came from where it was silent: RT2-F6's broken extension argument
      and the phi = 1.0 attainment semantics.

  rt2_sr5_ruling: >-
    RT2-SR-5 IS RULED. The Coordinator ADOPTS option (i) of the recorded
    prior: the disclosed 0.171940 range-wide false-plateau bound on the
    OBJ-5A calibration family (supremum attained at the phi = 1.0
    degenerate limit; residual range [0.114124, 0.171940] exactly as
    disclosed) is an ACCEPTABLE STANDING PRICE for bound-carrying
    FM-PLATEAU-CONSISTENT sentences, SUBJECT TO THREE CONDITIONS:
    (R5-1) PRICED SEMANTICS (adopting J-G1 F5): every bound-carrying
    sentence must state that 0.171940 is certified over the OBJ-5A
    calibration family and the probed configurations, NOT as a theorem for
    all equal-mean configurations - RT2-F6 showed the class-wide extension
    ARGUMENT fails on a one-outlier fixed-effect equal-mean configuration
    even though its conclusion survives numerically. Any broader scope
    requires the extension argument repaired first. (R5-2) PER-ARM
    FALSE-POSITIVE BUDGET: any execution design composing plateau-consistent
    sentences must carry an explicit per-arm false-positive budget priced
    against the 0.171940 worst case, committed before arms. (R5-3)
    DECLARED RELIANCE (adopting J-G1 F5): any authorization decision must
    declare explicitly whether it relies on preregistration-skeleton.md or
    pooled-exposure-pricing-v2.json as binding verbatim-standing text; if
    it does, AC-1/AC-2 activate and must be closed first.

  successor_requirements:
    - "RT3-SR-1 (REVISE, for any execution design): carry the priced-semantics scope statement of R5-1 in every bound-carrying sentence."
    - "RT3-SR-2 (REVISE, for any execution design): commit a per-arm false-positive budget against 0.171940 before arms (R5-2)."
    - "RT3-SR-3 (DISCLOSE): RT2-F6 recorded on the candidate's ledger lineage - the class-wide extension argument is broken on one-outlier fixed-effect equal-mean configurations; the bound's conclusion survives on the calibration family and all probed configurations (max probed FP 0.1595)."
    - "RT3-SR-4 (REVISE, conditional): if a future batch seeks the bound for ALL equal-mean configurations, repair the extension argument (or replace it with exact enumeration over the configuration class) before claiming it."
    - "AC-1/AC-2 carried unchanged: dormant now; activate on verbatim adoption of the skeleton or binding-text treatment of the pricing JSON (R5-3)."

