coordinator_decision:
  id: DEC-20260811-133fbe
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-d7e255
  recorded_at: '2026-08-11'

  context: >-
    DEC-20260811-45583f paused DEC-20260810-00ee9d's own second next_action
    (dispatching a real successor SR3 v3 characterisation run against the
    concurrently-approved amendments/v3.yaml) because it was not known
    whether v3's own repair (change E11's D3/D4/D5 diagnostic) would catch
    the kind of alternative EV-INSTR-600710 already demonstrated slips past
    v3's unchanged T2 acceptance rule 18.8% of the time, and named a
    concrete, cheap empirical check as the path to clearing it. That check
    ran across two dispatched tasks (TASK-20260811-409237,
    TASK-20260811-c5a4d5), was independently verified at every stage by this
    Coordinator, a Validator (VAL-20260811-1045a7) and a Red Team, each
    performing at least one full from-scratch reproduction, and is recorded
    in EV-INSTR-acb893. This decision adjudicates the outcome.

  decision: refine

  what_clears_and_what_does_not_stated_first: >-
    THE PRIMARY STRUCTURAL QUESTION DEC-20260811-45583f'S RATIONALE POSED IS
    ANSWERED, FOR THE TESTED ALTERNATIVE: does T2's own first-pass-wins rule
    foreclose D5's recurrence check by accepting too early? NO -- the
    Student-t(df=5) alternative never accepts before rung 7, leaving >= 4
    rungs of D3/D4 data available in all 94 accepted replications, and D5
    fires within that window in 94/94 (100%) of them. THAT SPECIFIC PAUSE
    CONDITION IS CLEARED. But this decision does NOT fully lift
    DEC-20260811-45583f's pause into an unconditional authorization, because
    the evidence assembled also shows the underlying structural risk is
    real (3/485 of the Gaussian arm's own accepted replications land at the
    bare 2-rung minimum window) and that amendment v3's own text
    overstates D5's calibration ("1-in-100 to 1-in-300" vs. an actual ~1-in-
    50 as implemented). A successor SR3 v3 characterisation run MAY be
    dispatched, but ONLY under the two conditions in next_actions below,
    which are the narrow, cheap, already-specified corrections the evidence
    itself points to -- not a new open-ended review round.

  target_ids:
  - GOAL-ENDO-001
  - BATCH-d7e255
  - EXP-INSTR-36c8cf
  - H-INSTR-444c7b
  - RQ-INSTR-f8faa0
  - DEC-20260811-45583f
  - DEC-20260810-00ee9d
  - EV-INSTR-acb893
  - EV-INSTR-600710
  - RUN-INSTR-d5check-b8faf7
  - RUN-INSTR-d5check-gaussian-d7a937
  - experiments/EXP-INSTR-36c8cf/amendments/v3.yaml

  rationale:
  - >-
    THE EVIDENCE IS UNUSUALLY WELL-CORROBORATED FOR A TOY-SCALE INSTRUMENT
    FINDING. The Student-t headline (94/94) and the Gaussian-arm headline
    (21/485, as-implemented) were each independently reproduced by this
    Coordinator, a Validator, and a Red Team -- four total independent
    reproductions of the Gaussian figure alone, two of which self-corrected a
    real bug (numpy SeedSequence.spawn() statefulness) before converging
    exactly. The corrected-calibration figure (~1.65%) was independently
    reproduced twice more (Red Team ad hoc, then a formally committed run),
    differing by one count out of 485 -- ordinary Monte-Carlo-threshold
    noise between independently-seeded calibrations, not a substantive
    disagreement, and this Coordinator independently confirmed that
    assessment is plausible given the two runs' differing p99 threshold
    values.
  - >-
    THE DISCRIMINATING CONTRAST IS REAL AND SUBSTANTIALLY BETTER THAN THE
    PRIOR DIAGNOSTIC. 100% vs. 4.33% (or 1.65%, properly calibrated) is a
    roughly 23x-to-60x contrast, a material improvement over EV-INSTR-600710's
    own D1/D2 diagnostic (100% vs. 12.6%, roughly 8x). This is genuine,
    verified, positive evidence that the concurrent session's E11 repair,
    reached via a completely independent review chain from this branch's own,
    is methodologically sound in substance even though this branch's V2
    (RT-20260811-35ab34) and the concurrent session's V2 (RT-20260810-b12e04)
    never compared notes.
  - >-
    THE RESIDUAL RISK IS NAMED, NOT SPECULATIVE. The Gaussian arm's OWN
    committed data (r4-gaussian-calibration-optional.json, already on disk
    before this decision) shows 3 of 485 accepted replications land at rung
    5 -- the bare 2-rung window D5's recurrence check needs. None of those 3
    happened to fire D5 in this finite sample, but the mechanism that would
    prevent a 2-of-2 coincidence at that minimal window does not exist in
    E11's design as specified. This is exactly the failure mode
    DEC-20260811-45583f's rationale worried about, empirically confirmed
    present (if not yet triggered) in this campaign's own data, and it is
    not addressed merely by observing that ONE tested alternative happens
    not to trigger it.
  - >-
    THE CALIBRATION DEFECT, ONCE NAMED, IS CHEAP TO CARRY FORWARD AND
    IMPROVES THE DIAGNOSTIC. Recalibrating D4 to the actual D3 statistic
    (the LOO z-score of whichever point is more extreme by absolute
    deviation, not the sample maximum alone) is a documentation-and-threshold
    change, not a redesign, verified twice to leave the Student-t detection
    rate exactly unchanged at 100% while roughly halving-to-thirding the
    Gaussian-arm false-fire rate. There is no reason to defer adopting it.
  - >-
    THIS DECISION FOLLOWS THE RED TEAM'S OWN EXPLICIT RECOMMENDATION
    ("neither a full clear nor a blanket reaffirmation... clear the PRIMARY
    structural concern specifically... require the D4 recalibration...
    keep the SECONDARY next_action live") almost verbatim, because this
    Coordinator, independently reviewing the same evidence, reaches the same
    conclusion for the same reasons.
  - >-
    CLAIM DISCIPLINE, applied uniformly. claim_tier toy throughout. No
    attack, no exponent, no speedup; sota_delta zero on every axis. Nothing
    here makes or adjudicates any curve-side, within-class, or between-class
    claim, and nothing here moves H-INSTR-444c7b's status.

  evidence_refs:
  - EV-INSTR-acb893
  - RUN-INSTR-d5check-b8faf7
  - RUN-INSTR-d5check-gaussian-d7a937
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/execution/EXP-INSTR-36c8cf/execution_report_d5check.md
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/execution/EXP-INSTR-36c8cf/execution_report_d5check_gaussian.md

  limitations:
  - >-
    This decision does not itself draft the documentation correction to
    amendments/v3.yaml's "1-in-100 to 1-in-300" text, nor the dispatch
    envelope language required by next_actions below. Both are named as
    required, not performed here.
  - >-
    Only two alternatives (Student-t df=5, Gaussian) at one seed each were
    tested. This decision's conditional clearance is scoped to that evidence
    and does not claim E11 would catch an arbitrary heavy-tailed alternative,
    nor does it claim the 3/485 early-accept risk is bounded at any specific
    rate for alternatives other than the two tested.
  - >-
    This Coordinator's own independent verification (direct re-tally of raw
    per-replication JSON for both variants, faithfulness-gate spot confirmation,
    sanity-check of the 7-vs-8 discrepancy's plausibility) did not extend to
    re-deriving the Red Team's or Validator's own Monte Carlo false-positive-
    rate figures (1.97%, 1.946%-2.029%) from scratch a further time;
    two independent reproductions of that specific number already exist and
    a third by this Coordinator was judged disproportionate.
  - Toy scale throughout; claim_tier toy; sota_delta zero; no new measurement is asserted by this decision itself.

  next_actions:
  - >-
    CONDITION 1, REQUIRED BEFORE DISPATCH. A documentation-only correction to
    experiments/EXP-INSTR-36c8cf/amendments/v3.yaml's own D5 text (or a
    superseding note, per this campaign's correction discipline): replace
    "roughly 1-in-100 to 1-in-300 under the null" with the measured figures
    (~1-in-50 per-rung-per-row as implemented; the corrected-calibration
    variant reduces the replication-level Gaussian-arm false-fire rate to
    ~1.65% from ~4.33%), and recalibrate D4 to the LOO z-score of the actual
    D3 statistic (whichever point is more extreme by absolute deviation) for
    any successor run, rather than the sample-maximum-only calibration
    RUN-INSTR-d5check-b8faf7 and RUN-INSTR-d5check-gaussian-d7a937's Variant
    1 used. Not drafted by this decision.
  - >-
    CONDITION 2, REQUIRED IN THE SUCCESSOR RUN'S OWN DISPATCH ENVELOPE. The
    handoff authorizing the successor SR3 v3 characterisation run must state
    explicitly: if that run's own accepted_rung, when and if T2 fires, is
    earlier than rung 6 (i.e. fewer than 3 rungs of D3/D4 data exist for
    fb=18/fb=22 by the time T2 stops the run), the acceptance must be
    recorded as PROVISIONAL and escalated to the Coordinator before
    EXP-ICINV-4d33aa's SR3 v3 gate may consume it -- rather than treated as
    an unconditional pass. This directly closes the residual risk named in
    this decision's own rationale for exactly the cases where it could
    matter, without requiring a full v4 amendment cycle before any forward
    progress is possible.
  - >-
    SECONDARY, KEPT EXPLICITLY LIVE, NOT DROPPED. A v4 amendment binding a
    diagnostic into T2's OWN accept condition directly (the original R1
    recommendation of RT-20260811-35ab34/DEC-20260811-a4c7ec), rather than
    relying on E11's parallel escalation path, remains a live, recommended
    further improvement -- named, not mandated, and not a precondition for
    the successor run this decision now authorizes subject to Conditions 1
    and 2.
  - >-
    R2(i) (a pre-declared, campaign-level acceptable false-accept-rate
    target) remains the single most valuable missing piece, carried forward
    unchanged from DEC-20260811-aed346 and RT-20260811-cb3211's own required
    controls. Not supplied here.
  - >-
    Carried forward unchanged from DEC-20260811-45583f and DEC-20260810-00ee9d:
    blockers B1 and B2; EXP-ICINV-4d33aa stays paused; EXP-JINV-bd141d and
    EXP-VOLC-9f5571 stay blocked on criterion C4 (a successor run being
    dispatchable does not itself discharge C4 -- it must still execute,
    yield an accepted interval, and pass whatever review a resulting
    accepted_rung requires); the three-way SR3-gate design fork remains
    open; the pending EXP-ICINV-4d33aa amendment v4 and EXP-CANL-96b0ad
    amendment v2 approvals are untouched.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Same reasoning as EV-INSTR-acb893's own knowledge_promotion field: a
      real, reusable methodological pattern (a diagnostic added to fix one
      blind spot can carry its own quantifiable miscalibration; the fix is
      cheaply testable by direct Monte Carlo before adoption) exists here,
      but is not yet promoted pending the corrected calibration's actual
      adoption into a frozen contract and independent review in that
      context.

  decided_by: coordinator
  decided_at: '2026-08-11'

  inference:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: claude-sonnet-5
    reasoning_effort: null
    fallback_used: true
    fallback_reason: >-
      This Claude Code harness cannot resolve the policy aliases in
      orchestration/model-policies.yaml; every alias falls back to the one
      model the session runs on. Recorded, never silently substituted
      (AGENTS.md rule 11).
    degraded_allowed: false
    degraded_requirements: []
    model_verified: false
    model_verified_reason: No adapter probe receipt exists for this session.
