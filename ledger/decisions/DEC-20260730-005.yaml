coordinator_decision:
  id: DEC-20260730-005
  reserved_alias_note: >-
    BATCH-003 design reserved DEC-20260724-018, but that ID was later occupied
    on main by a remapped GOAL-MLKEM-001 record (CORR-20260724-004 lineage).
    This decision then used DEC-20260730-001, which main subsequently assigned
    to a GOAL-XEDN-003 record. Per CORR-20260730-002 this decision uses the
    next free id DEC-20260730-005; content is unchanged from the
    DEC-20260730-001 form archived under BATCH-003 receipt TASK-20260724-937.
  context: >-
    GOAL-MLKEM-002 BATCH-003 execution, independent validation, and independent
    red team of EXP-MLKEM-006 (true library-path / call-site interposition
    adequacy control; strict fixed-bound re-check) under Cursor Grok after
    verified run-package snapshot 658f9e53.
  decision: weaken_refine
  target_ids:
    - H-MLKEM-006
    - EXP-MLKEM-006
    - GOAL-MLKEM-002
  outcome_classification_adjudication:
    executor_reported: second_impl_unavailable
    validator_supported_executor_class: true
    red_team_preferred: synthetic_control_inadequate
    official: synthetic_control_inadequate
    goal_criterion_2_disposition: second_impl_unavailable
    criterion_used_laboratory_optional: widened_optimized_compare
    authority: >-
      Validator admitted the run package (accept_with_qualifications, 92/92
      hash match) and would keep second_impl_unavailable if CTRL pass were
      granted. Red team revise (RT-20260724-005) lands fatal objections that
      the implemented INTERPOSE_COMPARE path is probe-local tautology
      (OBJ-RT006-001/002) and therefore synthetic_control_inadequate under
      frozen EXP-006 precedence. Coordinator adopts the red-team package
      class while retaining empty-neighborhood criterion-2 disposition as
      scoped bookkeeping.
  rationale:
    - >-
      The run package is admissible as an immutable laboratory record
      (accept_with_qualifications; snapshot 658f9e53; exact argv; four
      terminal runs; failed attempts archived).
    - >-
      The adequacy repair claimed by H-MLKEM-006 / option (1) is not admitted:
      under -DINTERPOSE_COMPARE, substantive-probe library_cmp never invokes
      mlkem_cmp*, so instrument power remains a probe-local multiplicity
      construction (OBJ-RT006-001 recurrence of OBJ-RT005-001 in different
      packaging). Official package class is therefore
      synthetic_control_inadequate.
    - >-
      Strict fixed-bound preference order was re-checked empty;
      goal_criterion_2_disposition=second_impl_unavailable stands as honest
      GOAL completion criterion 2 bookkeeping and must not be erased. Optional
      widened PQClean measurement is laboratory continuity only and must not
      paraphrase EV-MLKEM-008 as H-MLKEM-004 support or criterion 2
      (OBJ-RT006-003).
    - >-
      H-MLKEM-006 is weakened within this laboratory boundary. GOAL-MLKEM-002
      remains active: completion criteria are not met. claim_tier stays
      laboratory_implementation_conformance (OBJ-RT006-005).
  evidence_refs:
    - EV-MLKEM-009
    - coordination/goals/GOAL-MLKEM-002/batches/BATCH-003/tasks/TASK-20260724-935/validation_report.yaml
    - coordination/goals/GOAL-MLKEM-002/batches/BATCH-003/tasks/TASK-20260724-936/red_team_report.yaml
    - experiments/EXP-MLKEM-006/execution-report.yaml
  limitations:
    - No attack, oracle, exploitation path, or key recovery was built, and none is authorized.
    - Nothing here bears on MLWE hardness or passive ML-KEM security.
    - No release is approved and no library is characterized as systemically clean.
    - True link-time wrap onto library archive compare symbols was not demonstrated.
    - Isolation under the strict fixed-bound-tail mechanism class was not tested.
  hypothesis_status_record:
    H-MLKEM-006: weakened_adequacy_repair_not_admitted
    prior_status: specified
    note: >-
      File ledger/hypotheses/H-MLKEM-006.yaml is not rewritten in this ledger
      archive because design ownership remains with TASK-20260724-931; this
      decision is the official status binding.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Batch yields a scoped instrument-adequacy failure mode and empty
      fixed-bound neighborhood disposition, not a reusable corpus finding
      beyond KN-TECH-030 / KN-FIND-001. Objections drive BATCH-004 rather than
      a new KN-FIND/KN-TECH entry.
  next_actions:
    - >-
      Open BATCH-004 (final campaign batch) to either (1) implement true
      GNU ld -Wl,--wrap=mlkem_cmp{,_avx2,_neon} on linux/amd64 substantive
      probes so library symbols are actually invoked and re-score
      CTRL-TRUE-LIBRARY-PATH-INTERPOSITION without probe-local bypass, or
      (2) explicitly rewrite GOAL-MLKEM-002 completion criteria with recorded
      rationale after three empty/failed adequacy-or-neighborhood attempts —
      without paraphrasing EV-MLKEM-008/009 as H-MLKEM-004 support
      (EV-MLKEM-009, OBJ-RT006-001..005).
  decided_by: coordinator
  decided_at: '2026-07-30'
