coordinator_decision:
  id: DEC-20260724-018
  remapped_from: DEC-20260724-007
  remapping_note: >-
    Canonical copy of the frozen ML-KEM record after its ID collided with an
    independently archived canonical record on main. Body unchanged apart
    from remap metadata and cross-references retargeted to the remapped IDs
    (see CORR-20260724-004).
  context: >-
    GOAL-MLKEM-001 BATCH-005 execution, independent validation, and independent
    red team of EXP-MLKEM-002 (direct comparison-primitive conformance audit on
    exact pre-fix and post-fix wolfSSL ML-KEM commits) under Cursor Grok 4.5
    after verified run-package snapshot 28608fb.
  decision: support
  target_ids:
    - H-MLKEM-002
    - EXP-MLKEM-002
    - GOAL-MLKEM-001
  rationale:
    - >-
      Validator admits the four-run package (accept_with_qualifications, zero
      hash mismatches across 39 archived paths, all seven controls pass, four
      reported quantities independently re-derived from raw per-index tables).
    - >-
      Red team could not falsify the outcome. The fabrication objection against
      the inherited ORS-025 and ORS-026 premises is defeated: both incomplete
      comparisons are present at v5.9.1-stable and repaired at v5.9.2-stable,
      confirmed independently by the executor, the validator, the red team, and
      the coordinator reading the assembly, and corroborated by the public CVE
      records.
    - >-
      The generator proved itself before it was trusted: the deliberately
      truncated negative harness was flagged with exactly its omitted ranges, so
      the post-fix null is a measured null rather than an untested one.
    - >-
      outcome_classification suite_is_discriminating stands under the frozen
      precedence, and H-MLKEM-002 is supported within the laboratory boundary of
      the two audited commits, the attested backends, three parameter sets, two
      seeds, and the single-byte xor generator.
    - >-
      Five red-team objections survive as scope limits and are binding on all
      future language about this result: primitive silence is not universal
      Algorithm-18 accept (43 of 64 pre-fix AVX2 pairs accepted); the post-fix
      zero-disagreement result is generator-scoped and does not prove comparison
      correctness; the probe calls optimized symbols directly and NEON was never
      attested at the Algorithm-18 boundary or on native silicon; exact
      ciphertext blobs are not archived; and the conformance anchor is the
      weakest one the protocol accepts.
    - >-
      Official hypothesis status for this batch is recorded here and in the goal
      checkpoint as analyzed/supported_within_laboratory_boundary. The
      H-MLKEM-002.yaml file remains owned by TASK-20260724-226 artifact scope in
      BATCH-005; a follow-up exclusive status commit may sync the file.
  evidence_refs:
    - EV-MLKEM-005
    - coordination/goals/GOAL-MLKEM-001/batches/BATCH-005/tasks/TASK-20260724-230/validation_report.yaml
    - coordination/goals/GOAL-MLKEM-001/batches/BATCH-005/tasks/TASK-20260724-231/red_team_report.yaml
    - experiments/EXP-MLKEM-002/execution-report.yaml
  limitations:
    - No attack, oracle, exploitation path, or key recovery was built, and none is authorized.
    - Nothing here bears on MLWE hardness or passive ML-KEM security.
    - No release is approved and no library outside the two audited wolfSSL commits is characterized.
    - Vendor-reported exploitation figures in ORS-025 remain uncorroborated by this program and must keep their vendor label.
    - Stage resource accounting is incomplete because manifest wall times exclude build work.
  ors_entry_disposition:
    ORS-025: >-
      No correction required. Presence, affected-version window, PR reference,
      and the 1536-of-1568 byte omission are independently corroborated. The
      approximately 350-query and approximately 98 percent figures stay labeled
      vendor/CNA-reported and were deliberately not re-tested.
    ORS-026: >-
      No correction required. The half-input description matches both the vendor
      record and the measured silent cardinalities. Mechanism clarification, now
      recorded in experiments/EXP-MLKEM-002/analysis/premise_verdicts.yaml and
      KN-FIND-001: the defect is a horizontal-reduction fault (ins versus ext),
      not a half-length loop bound. No prior claim is contradicted, so no
      correction record is emitted.
  next_actions:
    - >-
      Open BATCH-006, the final batch of the six-batch campaign budget, to
      specify and run EXP-MLKEM-003: harden the validated conformance gate
      against its own surviving objections by adding a multi-class generator
      (multi-byte, alignment and lane, and malformed-length cases), a strong
      named conformance anchor, and Decapsulate-path dispatch attestation
      including a NEON integration sample, then apply the hardened gate to at
      least one additional open-source ML-KEM comparison implementation to test
      whether the incomplete-comparison class is isolated to the audited wolfSSL
      commits or systemic across optimized backends.
  hypothesis_status_record:
    H-MLKEM-002: supported_within_laboratory_boundary
    prior_status: specified
    note: >-
      File ledger/hypotheses/H-MLKEM-002.yaml not rewritten in this ledger
      archive because BATCH-005 artifact ownership remains with
      TASK-20260724-226; this decision is the official status binding.
  knowledge_promotion:
    promoted:
      - KN-FIND-001
    rationale: >-
      The result is deterministic, source-verified, independently validated,
      independently red-teamed, externally corroborated, and reusable as a
      defensive gate. It is promoted as an internal finding with its scope limits
      attached. It is not promoted as a technique entry, because the gate has
      been validated in exactly one experiment and its multi-class generator is
      still unbuilt.
  decided_by: coordinator
  decided_at: '2026-07-24'
