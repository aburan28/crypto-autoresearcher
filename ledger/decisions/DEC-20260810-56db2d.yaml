  limitations:
    - >-
      NO MEASUREMENT SUPPORTS ANY INSTRUMENT CLAIM HERE, BECAUSE THE ONLY RUN IS
      INVALID. Zero SR3 v3 data exists. Not one detection floor and not one
      matched-null false-positive rate has been measured at any geometry. Every
      number in this decision is either read from a committed record and cited to
      it, decided by the user and recorded as such, set by this Coordinator and
      marked COORDINATOR-SET, or derived by exact arithmetic from those and marked
      derived.
    - >-
      THE G1 REPAIR WAS MADE WITH THE SR1 DATA IN VIEW. That is not true of G2 and
      the two must not be read as equally frozen. The mitigation -- select no
      construction, add no new threshold, adopt the Executor's pre-declared
      tolerance, remove the unreproducible rows -- reduces the exposure but does
      not eliminate it, and a reader preferring another rule has every raw number
      in nullc-reproduction.json.
    - >-
      THE delta > 0 ROWS OF THE PUBLISHED NULL-C PROFILE ARE NOW PERMANENTLY
      UNREPRODUCIBLE. No committed record contains the construction or the seeds
      that produced them, and no later contract can make them a reproduction
      target. What is lost is the ability to check that a control harness
      reproduces NULL-C's published POWER, as opposed to its published null
      behaviour and its published data binding, which do reproduce. That
      diminishes the SR1 gate and the diminution is recorded, not argued away.
    - >-
      HEUR-INSTR-3, THE GAUSSIAN TAIL RULE, IS AN ASSUMPTION AT PRECISELY THE
      COVERAGE WHERE SUCH ASSUMPTIONS ARE WEAKEST, and it is unvalidated because
      no sampling distribution exists. It is declared as a numbered heuristic with
      a validation route rather than absorbed silently, but a run that passes SR3
      v3 under a badly non-Gaussian tail would be passing a gate whose realised
      coverage is not the declared one.
    - >-
      TWO PARAMETERS ARE STILL UNDECLARED BY DESIGN, AND THEY BLOCK REAL WORK. B1
      leaves the T5 walk-kernel planting cell unexecutable and BLOCKS the T5
      reachability conclusion of EXP-VOLC-9f5571. B2 leaves every per-density-row
      Phase B cell unenumerable and BLOCKS every arm verdict of EXP-JINV-bd141d
      and EXP-VOLC-9f5571 under criterion C4. Both correctives require amendments
      to contracts, filed before their data exists, and neither is scheduled by
      this decision.
    - >-
      THE SEED RUNGS 12 / 24 / 48 ARE SET AGAINST NO COST MEASUREMENT. No per-seed
      cost for the SR3 v3 characterisation has ever been measured, because the
      characterisation has never run. If the budget is reached before rung 3 that
      is a budget event under AGENTS.md rule 5, reported as such, with the
      remaining cells not_measured -- never a pass.
    - >-
