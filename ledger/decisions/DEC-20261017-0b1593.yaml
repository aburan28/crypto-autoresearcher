  context: >-
    Design-approval cycle on addendum G of the special-prime battery under
    GOAL-ECDLP-001 / RQ-ECDLP-002: four hypotheses filed 2026-10-09 from
    IDEA-20261009-57140c (G1), IDEA-20261009-64a1c0 (G2), IDEA-20261010-478721
