    launcher.command and assigned_to executor. approved_by reads
    DEC-20261017-0b1593 and approved_at reads 2026-10-17 in the probed bytes.

  rationale:
    - ECC first (AGENTS.md "ECC comes first"): all four contracts sit on GOAL-ECDLP-001 / RQ-ECDLP-002 and are the ranked ECC work of this session; no non-ECC task is considered ahead of them.
    - The standing authorization already covers a complete and approvable protocol, so no per-contract user confirmation was requested; the user's direction of 2026-10-11 removed the capacity cap, and the remaining condition (runnable, attested by the probe on the exact prospective bytes) is met for all four.
    - Each contract is complete and runnable in the sense of "Approval is bounded by execution": committed launcher, frozen single-trial plan with run id, executor card, queue entry and lawful lane, with the probe's accepted bytes hashed above so dispatch can verify the installed files.
    - Each contract has an independent checker and the named cheapest-falsification controls inside the run (abelian and random-split fields for G1; matched random prime and supersingular control for G2; random g, t^d - c and Q arms for G3; keyed-hash and size-based subsets with exact enumeration at c <= 17 for G4), so a null cannot be read without its control row and a signal cannot be read without its nearby-object comparison.
    - Each hypothesis names its reachable alive condition before any run (R(H) >= 1 with the control below 1; a pre-registered arm test rejecting with controls passing; a gamma excess > 0.2 across >= 3 primes; a closure ratio outside its band with the hash control inside), so support is not automatic and weakening has a stated trigger.
    - The battery is toy tier by construction; the expected outcomes are nulls that support H-ECDLP-bd1572's heuristics in exact tested scope, and the review plan's decision rules forbid breakthrough, speedup, attack or closure language from any reading of it.
    - The two design-time corrections (G2 identity, P-384 shape) were caught by the contracts' own controls before approval, which is evidence that the controls bind, and are recorded in the superseding and correction records rather than by editing merged ones.

  evidence_refs: []

  limitations:
    - Toy primes only (Mersenne 2^13 - 1 to 2^61 - 1 and Solinas f(2^k) at k in 4..12); no cost at any deployed size is measured or extrapolated and no deployed prime or curve is lifted or attacked.
    - No rank computation or 2-descent over K is available in the container; the rank arms of EXP-ECDLP-84af7b and EXP-ECDLP-4c6a09 report proven non-torsion new points or are reported as skipped, never rank.
    - The PARI cross-checks (CTRL-RANK0 ellrank over Q, nfdisc) are absent in the run because the launchers build without the pari feature; the run records them as absent and the design-time verification with the feature on is not a substitute inside the run.
    - The m = 8 density of EXP-ECDLP-ad27ad is dropped from the frozen instances and is not authorized here; adding it is a versioned amendment, not a dispatch option.
    - Several structural ingredients remain provenance recalled (Washington, Mazur, Solinas, Brent-Montgomery-te Riele, Huang-Kueh-Tan); this approval does not upgrade them.
    - Nothing here is evidence. No contract has run; a run becomes evidence only after its snapshot archive, both independent reviews and the evidence-review decision DEC-20261017-7ec9cc are committed and the post-commit verifier accepts them.
    - A timeout, crash, checker exit other than 0 or resource exhaustion in any approved run is failed_infrastructure and is not a value of any metric.
    - This decision authorizes later executions (one invocation each, the trial plan's single trial). It does not start one and does not dispatch any executor card.

  next_actions:
    - After the TASK-20261017-cd388e archive is merged to main and python3 tools/newest_experiments.py --experiment <EXP-ID> --json reports execution_state ready for each contract, dispatch via /run in priority order, each from a session other than the one that wrote this decision and each in its own worktree, with the installed specification, trial plan, queue and handoff bytes matching the hashes in preapproval above - TASK-20261017-2cc75e (EXP-ECDLP-84af7b, RUN-ECDLP-18d26b); TASK-20261017-2b5c50 (EXP-ECDLP-8cc60d, RUN-ECDLP-2ac930); TASK-20261017-8fa281 (EXP-ECDLP-4c6a09, RUN-ECDLP-e89532); TASK-20261017-b40e99 (EXP-ECDLP-ad27ad, RUN-ECDLP-a5281a).
    - Then TASK-20261017-dac0a6 snapshot archive of the four run records alone; then TASK-20261017-881c1b (validator) and TASK-20261017-543a78 (red-team) in independent sessions, blind from each other per the frozen review plan; then TASK-20261017-94b6a7 ledger archive writing the evidence-review decision DEC-20261017-7ec9cc with its knowledge_promotion filled and python3 tools/check_review_independence.py --batch run before the round is treated as complete.
    - A hash mismatch at dispatch, a probe or newest_experiments disagreement, or a CTRL failure in a run stops that contract and is recorded additively; it is never repaired in a frozen file.
    - Not authorized by this decision - no attack, speedup, closure or breakthrough reading of any result; no m = 8 cell for EXP-ECDLP-ad27ad; no lift of any deployed prime; no second invocation of any trial plan; no official status change beyond proposed -> specified for the four hypotheses.

