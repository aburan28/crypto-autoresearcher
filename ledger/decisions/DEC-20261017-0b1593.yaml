    each with one contract at claim_tier toy. The lane file for BATCH-769f82
    is already committed and pushed; this decision and the rest of the packet
    are archived by TASK-20261017-cd388e.

    Runnability. Each contract is implemented (EXP-ECDLP-84af7b: Rust g1
    binary on the nfield library; EXP-ECDLP-4c6a09: Rust g3 binary on the
    same library; EXP-ECDLP-8cc60d and EXP-ECDLP-ad27ad: pure Python 3
    standard library), smoke-tested at reduced size with byte-identical
    replay and no run record written, and paired with an independent checker
    (check.py sharing no code with run.py) that fails every tamper test run
    at design time to the docs/subversion-resistance-20261010.md standard.
    The deterministic G1 cells of the Rust port reproduce the counts of the
    earlier Python prototype. The Rust launchers build --locked without the
    optional pari feature, so the CTRL-RANK0 (ellrank over Q) and nfdisc
    cross-checks are recorded as absent in the run; both were exercised at
    design time with the feature on. Each trial plan holds a single trial
    with a frozen run id (table above).

    Probe. tools/experiment_preapproval.py reported approvable: true with
    empty blockers for all four packets at source_ref
    origin/claude/coordinate-20261017 (hashes in preapproval above). The
    probe requires an integer goal lane cap above the number of open lanes;
    GOAL-ECDLP-001 carried campaign_budget.max_concurrent 2 beside 16 open
    lanes dated 2026-09-07 to 2026-09-09, so commit 4f3d39ad62 raised it
    additively 2 -> 32 with the previous value and reason preserved on the
    goal record. Nothing was closed to make the lane lawful.

    Corrections already on record, cited not repeated. G2: the source
    proposal's identity k = ord_l(2)/gcd(ord_l(2), c) is false and was caught
    by the design-session identity control; the corrected statement is in
    the H-ECDLP-281dd6 header and IDEA-20261009-64a1c0 was corrected before
    merge. G3: the P-384 shape sign error in IDEA-20261009-b6d31b was caught
    by the runner's CTRL-SHAPE check after that proposal merged, so
    IDEA-20261010-478721 supersedes it and CORR-20261010-218281 records the
    defect; H-ECDLP-4da36f derives from the superseding proposal.

    Backlog. Approved-unrun on this goal becomes 9 + 4 = 13; under the
    2026-10-11 amendment this is reported by tools/portfolio_kpis.py for
    prioritization only and blocks nothing.

    Protocol completeness. Each approved specification carries non-null
    controls, metrics, preregistered predictions, replication seeds, an
    advisory budget (wall_clock_seconds_per_run 14400 / 7200 / 14400 / 7200;
    total_cpu_hours 60 / 3 / 80 / 2; maximum_runs 12 / 6 / 12 / 6 in the
    order 84af7b, 8cc60d, 4c6a09, ad27ad), stopping and invalidation rules,
