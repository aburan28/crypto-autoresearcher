coordinator_decision:
  id: DEC-20260731-009
  context: >-
    Attempted harness launch of the FAEST campaign (GOAL-FAEST-001,
    RQ-FAEST-001) on 2026-07-31. Both GOAL-FAEST-001.next_action and the
    RQ-FAEST-001 constraints gate all ideation and experiment design on
    obtaining primary Round-3 FAEST sources and filing them as KN-LIT
    entries. A source-acquisition probe ran the declared source-preference
    order (NIST CSRC -> faest.info -> IACR eprint -> GitHub reference
    implementation) and exhausted it: csrc.nist.gov, faest.info, and
    eprint.iacr.org all failed with proxy CONNECT 403 (policy denial,
    recorded as recentRelayFailures kind connect_rejected at
    2026-07-31T16:09:55-56Z) and with HTTP 403 through the separate
    WebFetch path; this session's GitHub API scope is bound to
    aburan28/crypto-autoresearcher, and direct fetches of the FAEST
    reference repositories returned 403. WebSearch returned only
    journalistic coverage of the 2026-05-14 NIST Round-3 announcement, no
    primary specification text. No FAEST material exists in inputs/ and no
    FAEST KN-LIT entry exists. No batch was opened, no dispatch queue was
    created, no worker ran, and no experiment was designed.
  decision: pause
  target_ids:
    - GOAL-FAEST-001
  rationale:
    - >-
      Pause condition #2 of GOAL-FAEST-001 is met exactly as written: no
      Round-3 FAEST specification or reference implementation can be
      obtained under the network policy after the declared
      source-preference order is exhausted. All four tiers were attempted
      and all four failed.
    - >-
      RQ-FAEST-001 forbids designing any experiment until the relevant
      primary sources are filed as KN-LIT entries. Secondary reporting
      obtained via WebSearch therefore cannot unblock ideation, so
      proceeding to /propose-ideas would violate the question's own
      constraints.
    - >-
      This is an acquisition/infrastructure blocker. Under AGENTS.md rule
      3 it is not evidence for or against any mathematical claim about
      FAEST. No hypothesis was created, no evidence record exists, and no
      claim tier was asserted; RQ-FAEST-001 remains active.
    - >-
      paused is the correct status rather than blocked or cancelled: the
      goal asserts no success, needs no completion quorum (AGENTS.md,
      "Goal closure quorum"), and has exactly one concrete, externally
      satisfiable resume action.
  evidence_refs:
    - coordination/goals/GOAL-FAEST-001/source-acquisition-probe-20260731.md
    - ledger/goals/GOAL-FAEST-001.yaml
    - ledger/questions/RQ-FAEST-001.yaml
  limitations:
    - >-
      Nothing here bears on FAEST's security, its claimed security
      category, the tightness of any link in its claim chain (VOLEitH
      soundness, Fiat-Shamir/grinding trade-off, QROM reduction slack,
      algebraic attacks on the AES constraint system), or AES one-wayness.
    - >-
      Nothing here establishes that the research question is intractable
      or not worth pursuing; only that its primary inputs are unavailable
      under the current network and repository-scope policy.
    - >-
      The probe records only the source-preference order actually
      attempted on 2026-07-31 through the agent proxy, the WebFetch tool,
      WebSearch, and the GitHub binding. No other acquisition channel was
      tested and none is claimed.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No research evidence was produced. The record is an infrastructure
      acquisition blocker, not a durable claim about FAEST or about any
      technique, so no KN-FIND, KN-TECH, or KN-LIT entry is warranted.
  goal_disposition:
    status: paused
    pause_condition_applied: >-
      No Round-3 FAEST specification or reference implementation can be
      obtained under the network policy after the declared
      source-preference order is exhausted.
    batches_opened: 0
    workers_dispatched: 0
    quorum:
      quorum_satisfied: false
      reason: >-
        Not applicable. paused asserts no success and requires no closure
        quorum.
  next_actions:
    - >-
      Single resume action for GOAL-FAEST-001: vendor the Round-3 FAEST
      specification bundle into inputs/FAEST-R3-2026/, or obtain
      network-policy allowlisting for csrc.nist.gov, faest.info, and
      eprint.iacr.org, or widen this session's GitHub scope to the FAEST
      reference repositories; then file the acquired primary sources as
      KN-LIT entries; only then run /propose-ideas RQ-FAEST-001
      object-first. The matched AES baseline cost must be written down
      before any experiment is designed.
  decided_by: coordinator
  decided_at: '2026-07-31'
