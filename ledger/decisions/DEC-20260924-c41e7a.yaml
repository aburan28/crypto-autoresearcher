  rulings:
    - id: R-1
      concerns: Issue (1), PREFIX versus COLUMN; issue (7), the uncovered case.
      ruling: >-
        First-match rule R0 MATCH, R1 PREFIX (only when the REFERENCE's trace
        is the shorter), R2 EXTRA-PIVOT, R3 COLUMN (with prefix_flag when the
        target's trace is the shorter), R4 ZERO-PIVOT, R5 ROW-ORDER, R6
        UNCLASSIFIED (unreachable; a C-CLASS failure). E3 success = R3 at the
        target's own first non-pivot column.
      basis: >-
        At l = 5, an unsat reference pivots every column (C-RANKB). For s = 1
        and s = 2, the dominant satisfiable cases, S_3's symmetry puts the
        standard monomials at the last columns. The COLUMN/PREFIX overlap is
        therefore exactly what C3 predicts, and a PREFIX-first reading would
        count every such target against E3. E3 asks about the state at the
        divergence, which is how Lemma 2B classifies. H-CERTBIN-b20d4e's
        TRACE STATE says, before any data, that COLUMN "for a satisfiable
        target at l = 5 ... is a standard monomial". E3 remains falsifiable
        through ZERO-PIVOT and ROW-ORDER. The direction favours reachability
        of "E3 HOLDS" and is disclosed. The rejected reading is reported as a
        non-decisional sensitivity. AMD ruling_1_classification.
    - id: R-2
      concerns: Issue (2), C-REPLAYB and INV-5; and K_B, which has the same defect.
      ruling: >-
        C-REPLAYB (v2) fails only on identities a correct implementation must
        satisfy: guided = own on matched targets; the replay outcome equals
        proposition R's prediction from the two op logs; and each attributed
        reference zero is verified by the independent determinant module.
        INV-5 (v2) voids DB-3, DB-4 and DB-11 only on such a failure or a
        C-BREAK failure. Predicted, verified schedule invalidity is recorded
        as reference data ("X-ZERO REFERENCE"). K_B uses the T_strict-guided
        computation, which is HEUR-CERTBIN-TS2B's own e_k.
      basis: >-
        Lemma 2B's "identical state" means identical rational functions, not
        identical zero patterns. A reference coincidental zero at an unused
        row i > p_k keeps T_strict matched and changes X_k, so the replay is
        schedule-invalid on almost every target. The same zero at i < p_k is
        ROW-ORDER, and at a skipped column it is EXTRA-PIVOT. Under TS2B's
        own model such zeros are not rare. DB-3 and DB-11 never read the
        replay. AMD ruling_2_replay, proposition_R.
    - id: R-3
      concerns: Issue (3), F-SAT has no stop at l = 5.
      ruling: >-
        Scans stop at N kept or at exhaustion of the enumerated eligible
        population (F-SAT and F-PLANT). The E3 arm is the union by x_R. SR-3
        flags per arm ("POPULATION CEILING"), and that flag does not use run
        2. DB-5 is underpowered only if the pooled distinct arm is below 100,
        and DB-7 then reads NOT EVALUABLE. Exact P_sat comes from the
        enumeration.
      threshold_statement: >-
        NO preregistered threshold changes. Verdict readings are clarified
        only in AMD C-9 (i)-(iv). Arm power does change: the pooled E3 arm at
        l = 5 is bounded by the cell's finite satisfiable population, below
        the 400 or 200 the sample_size_justification assumed. That sentence
        is superseded as a statement of fact. The enumeration value is
        provenance only, and the rule does not use it.
    - id: R-4
      concerns: Issue (4), C-TR.
      ruling: >-
        Restated to x in x(E), with x(2E) decided by a point test. The literal
        v1 count is reported. The consequence is unchanged (data only).
      basis: The halving criterion concerns points. A twist abscissa has no point on E.
    - id: R-5
      concerns: Issue (5), modal scope.
      ruling: >-
        The modal applies per family to every family with an unsat-arm
        retention statistic. This is the Stage-1 rule's own "per family and
        D". It affects secondary verdicts only, and it moves them toward
        GENERIC STABILITY (disclosed).
    - id: R-6
      concerns: Issue (6), probe stream.
      ruling: >-
        S_probe as a SINGLE PCG64 stream consumed in cell order c = 1..4, then
        U1..U3, at most 10 draws per reference. This departs from the
        executor's per-cell re-seed, because seed_rule says "none is
        re-seeded".
    - id: R-7
      concerns: Minor items I-7..I-15.
      ruling: >-
        DB-4's K_B(cell) is the SUM over unsat references (equal to 3 x the
        mean with a full reference set). C-DELTA and C-RANKB keep their
        curve-algebra failure scope, and are also computed on F-NULLB and
        F-AFFB with a null-scoped consequence (a tightening). The pilot's
        S_selftest B at n = 19 is affirmed as C-PILOT's reading. The rest are
        recorded as executor readings in the trial plan and checked in review.
        Any that touch a count, fails_if, decision input or threshold must
        come back. (Superseded within the window by R-11: all five are now
        ruled.)
    - id: R-8
      concerns: Fold-in C, exposed frozen seeds.
      ruling: >-
        Retire and replace all 18 exposed version-1 seeds (2026092420105,
        2026092420106 and 2026092420c08..c11 for c = 1..4) by old + 10000,
        and keep every other seed. Adopt a dev-seed discipline (below 10^6,
        never a version-2 seed, listed in the manifest). AMD C-14, C-15.
      basis: >-
        2026092420105 was drawn with its frozen routine and bound, and its
        first up to 10 values fed K_B counts the executor read, so blindness
        fails directly. Skipping draws is forbidden by seed_rule. The other
        17 share raw PCG64 words with inspected dev outcomes, and the
        protocol contains no argument that different bounded-integer
        transforms of one word are independent. Neither claim survives
        keeping any of them, and re-seeding costs nothing before data. The
        rule is fixed arithmetic, declared before any draw under it, and
        collides with no reported dev seed.
    - id: R-9
      concerns: C-PILOT after the exposure.
      ruling: >-
        C-PILOT is recorded as FAILED pre-run, and its specified consequence
        applies: C_std at every cell, with the deviation reported, not a
        void. The real pilot still runs outcome-blind to record timings.
        AMD C-16.
      basis: >-
        Its fails_if names "a frozen stream is drawn before the decision",
        which happened. Treating the re-seeding as erasing the failure was
        considered and rejected, because it would use an amendment to escape
        a pre-registered consequence.
    - id: R-10
      concerns: Fold-in D, the value 254.
      ruling: >-
        Withdrawn as population provenance. It excluded a dev F-S3 set drawn
        from the retired seed 2026092420308. It fed no rule. |E_PLANT| is
        computed in the run, and whether F-PLANT fills 200 at (17, 5) is
        unverified; C-8 covers both outcomes. The 63 and the 32,933 are
        confirmed as pure counts. AMD C-24.
    - id: R-11
      concerns: Fold-in A and B.
      ruling: >-
        A(a) confirmed, with the V x V route kept as an independent second
        enumeration (a mismatch triggers INV-3) (C-17). A(b) confirmed; a
        test disagreement voids only the F-RANDX x(2E) split (C-18). F-AFFB
        rule confirmed, with the added exclusion of F-S3 target x_R from
        fillers, and stream 01 is read as one logged sequence per cell
        (C-19). F-AFF, F-RANDX, C-BREAK, C-DET/C-REV and the PS0' D are
        confirmed as written (C-19 to C-23). None changes a count, a
        threshold or a decision-rule input. C-17 adds a failure route.
    - id: R-12
      concerns: Blindness and confirmatory status after the fold-in.
      ruling: >-
        confirmatory_status stays preserved for the frozen draws. The prior's
        "no Stage-2 output has been seen" is read as true of frozen outputs
        only, and its probabilities are not updated. Pre-registered
        fallback: if the review finds ruling 1 was a genuine fork between
        two readings that both test C3, DB-5 and DB-7 at l = 5 become
        exploratory_only. AMD C-25.

  readiness: >-
    AMD-20260924-3a9f06 is complete. It states the version change; the
    reason; a pre-data status with its provenance, and the condition that
    status rests on; a basis constraint excluding dev values from every
    ruling; twenty-six numbered changes, each naming its target clause; one
    new control (C-CLASS) and one new invalidation rule (INV-10); replaced
    C-REPLAYB, INV-5 and C-TR, each with a real failure condition; an
    exposure ledger and a seed-replacement table; direction disclosures;
    confirmatory_status with its basis and fallback; affected_runs; review
    obligations; and a closed fold-in record. No threshold, budget, success
    or falsification criterion moves. Eighteen seeds are replaced by a
    fixed rule (C-14). The count schedule is fixed to C_std by C-PILOT's own
    pre-registered consequence (C-16).

  rationale:
    - >-
      WHY AMEND RATHER THAN LET THE EXECUTOR CHOOSE. (1), (5), (6) and (7)
      are readings on which a primary or secondary verdict turns. (1) flips
      DB-7 at the decisive cell. A reading chosen by the implementation after
      it has seen dev values is exactly the "no threshold is added after
      data" failure the attention_contract forbids. Only a pre-data
      Coordinator ruling fixes it.
    - >-
      WHY NOW. The executor is holding. No frozen stream is drawn. Every
      change is text plus derivation on committed constants. docs/task-
      lifecycle.md requires a versioned protocol_amendment for any change to
      a frozen protocol, and this is written before any outcome of this
      experiment exists.
    - >-
      THE FAILURE-CONDITION BALANCE. Nothing that could catch a real defect
      was removed without a replacement that catches the same defect: guided
      = own, replay = prediction, attribution verified, C-CLASS, and C-RANKB
      computed on the nulls. What was removed is the route by which a
      property of a reference point voided decision rules that never read the
      replay.
    - >-
      A PRE-DATA FINDING WORTH CARRYING FORWARD, stated as derivation only.
      Under HEUR-CERTBIN-TS2B's own model, reference coincidental zeros at
      unused rows are expected, not exceptional. A strict T_ops (fixed-X)
      replay is therefore likely schedule-invalid for most reference choices
      at these sizes, and a GPU replay design would need masking. The run
      measures this (C-REPLAYB v2 (d), T_ops retention); nothing is concluded
      here.

