  decision: approve
  decision_label: >-
    APPROVE AMD-20260924-3a9f06 as protocol version 2 of EXP-CERTBIN-a58c63,
    effective when TASK-20260924-7d2b95's receipt verifies. RULE on the
    executor's pre-data issues (1)-(7): the divergence classification becomes
    a total first-match rule in which the COLUMN state wins over trace shape,
    with a new EXTRA-PIVOT type. C-REPLAYB and INV-5 are replaced so that a
    reference's coincidental zero cannot void DB-3, DB-4 or DB-11, while a
    genuine implementation defect still does. K_B is computed by the
    T_strict-guided computation from a single S_probe stream. The F-SAT and
    F-PLANT scans terminate at the cell's finite population, and the E3 arm
    is deduplicated by x_R. C-TR is restated to x(E). The modal reference is
    taken per family. FOLD-IN (window now CLOSED): the executor's reply
    showed that 18 frozen version-1 seeds were instantiated in dev under a
    "frozen + 7" scheme. RE-SEED all 18 by the fixed rule old + 10000 and
    keep every other seed. RECORD C-PILOT as failed pre-run, and apply its
    own consequence (C_std at every cell). WITHDRAW the value 254 as
    population provenance. CONFIRM the E_SAT and x(2E) alignments, the
    F-AFFB reference rule (with one addition) and the handling of F-AFF,
    F-RANDX, C-BREAK, C-DET/C-REV and the PS0' D.

