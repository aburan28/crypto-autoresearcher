        the prediction, carry the stop. It did not re-run DV-11 or edit
        anything. That is the behaviour the contract requires. The stop is an
        impediment for this decision and is never evidence.
      what_it_says_and_does_not: >-
        It says the approved protocol cannot be implemented as written for the
        2-a1 plan. It says nothing about D, the quotient, msolve's behaviour at
        p' = 1073741831, or the health check's outcome, which was never
        executed in this stage (implementation-v2-r2.md lines 755-757).
    R-2_the_defect_and_the_coverage_of_earlier_records:
      defect: >-
        D-1 (PROTOCOL SCOPE). SE-2's scope is "every call of v2_driver.solve"
        (solverevent lines 237-240); SE-3's requirement is "every classified
        msolve launch" (lines 305-308). For the 2-a1 plan these differ by the
        a1_health.run_system launch (a1_health.py line 147, classified at line
        182), reached from controls-a1 (a1_driver.py line 129). The single
        permitted replacement cannot satisfy SE-3. D-2 (CARD). Card ST-1
        (TASK-20260923-de3a7d lines 155-158) forbids any further replacement,
        so the combination made the stop certain from committed code at
        approval time.
      under_coverage_ruled: >-
        YES, earlier records under-covered msolve launch paths:
        - the characterization's call-site list (summary.json lines 942-999)
          and per-kind bound (lines 1001-1011, 1021-1027, 1100) counted solve()
          call sites only; its controls_a1 bound (2) omits up to 4 health
          launches, so S_ub is 3214, not 3210 (no reading changes: CR-2's K
          stays 2, recorded and never adopted; the approved K = 5 is by
          declaration, seedresolve SF-3);
        - PR-3 (iii), as the premise check computed it (premise-check.md lines
          216-225) and DEC-20260924-15a77a applied it (lines 437-455), is
          correct for its question (solve() call sites) but was the only
          launch-path check, and it cannot show that solve() is the only
          classified site;
        - the SE-3 scope in the solverevent draft, incorporated unchanged by
          the seedresolve draft (lines 76-84), presumes it;
        - the presumption began in Act 5 (DEC-20260923-582d6b lines 339-342).
        The frozen plan's own package text names a1_health.py (F2), so the
        path was visible to every act that read the plan.
      correction: >-
        WARRANTED AND WRITTEN: CORR-20260924-5b83a1, item 1 (the SE-3
        presumption, with the corrected site list), item 2 (the controls_a1
        bound 2 -> 6, subtotal 802 -> 806, S_ub 3210 -> 3214) and item 3 (a
        reading note on PR-3 (iii)'s scope and on DEC-20260924-15a77a's
        conclusion). No record is edited. The seedresolve and solverevent
        drafts, summary.json, premise-check.md and DEC-20260924-15a77a stay
        byte-identical, and no approved rule text changes.
    R-3_the_remedy:
      chosen: >-
        A DRAFT additive addendum, AMD-EXP-GFPN-05ff43-20260924-healthresolve,
        at experiments/EXP-GFPN-05ff43/amendments/v2_addendum_healthresolve.yaml,
        status draft, approved_by null, archived by TASK-20260924-bc10a8, and
        decided by a later, separate act (reserved TASK-20260924-71ccd9,
        DEC-20260924-afdc3b) on archived bytes.
      key_parameters: >-
        - HR-1: the SAME bounded re-solve rule (SSF signature, K = 5, 2 s
          spacing, SF-2 (c) cap, consistency, SE-2 (6) never-clauses, SC-11)
          applies to every call of a1_health.run_system while an r3 command
          runs.
        - HR-2: the SSF signature read on the frozen result's
          v2_outcome_class / v2_outcome_reason (the frozen classifier's own
          output), and clause (v) on the log text as a1_health.py lines
          157-162 build it.
        - HR-3: ONE further in-process replacement, a1_health.run_system, in
          the a1 entry after `import a1_driver`, calling the original function
          object; read back before any command; the complete permitted set is
          v2_driver.solve, a1_health.run_system and (P-B only)
          v2_common.curve_order_pari.
        - HR-4..HR-6: attempts, renames, consistency and the cap at the
          health site, the cap reading a1_health.DEV_TIMEOUT_S (1800 s).
        - HR-7: the frozen A1-7 (b) re-draw and AA-3 (b) reinvocation are
          unchanged and act on recorded results; their consequence is
          disclosed before any run.
        - HR-8: one solver-events.json, events labelled per site.
        - HR-9: DV-1..DV-15 re-run on the delivered r3 code, DV-1 complete,
          DV-11 amended to equal the census and to count both wrappers, and a
          new forced-path check DV-16 (a)-(e) at the health site.
        - HR-10: r3 layer, plans and 42 fresh ids in new paths; R-1 binds six
          hashes; the ceiling counts eight plans; 44 of 48.
        - HR-12: the approval act applies CN-5, CN-1, CN-2, CN-3 and CN-4 to
          the archived census, in that order.
        - msolve binary, flags and argv, every health-check seed, pattern,
          expected D and pass predicate UNCHANGED.
      why_this_route: >-
        - It keeps one solver signature under one regime across the whole
          lineage, which is the purpose the approved rule states
          (seedresolve lines 21-31, 281-292). Leaving the health site outside
          would leave the addendum's blocking gate dependent on the clock
          second of an FGLM seed.
        - It reuses the frozen classifier's output, so no classification is
          written anew, and every frozen byte, flag, seed and predicate stays.
        - It is the same granularity as SE-3: one module attribute, read back
          before any command. a1_health.run resolves run_system through its
          module globals at call time (lines 234, 237, 241, 244); CN-2 (iii)
          confirms it before approval.
      routes_not_taken: >-
        - B, declare the health site out of SE-2's scope and amend DV-11:
          held as the declared fallback if CN-2 (iii) fails. It treats one
          signature two ways; the frozen re-draw changes the system rather
          than re-solving it; a false check (d) failure blocks the whole
          addendum; and it rewrites DV-11's criterion right after DV-11
          failed.
        - C, replace v2_solver.run_child: rejected; it sits below the
          classifier and would wrap gb_only, callgrind and non-solver children,
          all excluded by SE-2 (6).
        - Editing a1_health.py, dropping check (d), or running unchanged:
          rejected (frozen byte; changes an approved blocking control; DV-11
          would stop again).
      why_not_rule_under_the_existing_approval: >-
        ST-1 and SE-3 permit exactly one replacement, and the re-solve changes
        when a health result is recorded as degenerate_parametrisation. That is
        a protocol change: it needs an amendment and a separate approval.
    R-4_the_census_precedes_approval:
      ruling: >-
        YES. The zero-run, zero-solve census TASK-20260924-1039eb, archived by
        TASK-20260924-c65bfb, precedes the approval act, as the premise check
        preceded Act 7. It lists EVERY msolve launch site in implementation/,
        implementation-v2/, implementation-v2-a1/, implementation-v2-r1/,
        implementation-v2-r2/ and every file they execute or import from
        outside them (the Sage comparator k4a_anchor_system.py and the k5k7
        scratch that v2_common names, v2_common.py lines 36-40), with
        classification and reachability from the successor plans' commands
        (CN-1); confirms the health-path facts HR-2..HR-4 rest on, with a
        no-solver .ms round trip of the four health systems (CN-2); and lists
        every PARI, gp, Sage and other child launch (CN-3, CN-4).
      why: >-
        The stop happened because four successive acts checked `solve(` call
        sites and never checked launch sites. A census that is cheap (Python,
        no solver, no package) closes that gap for the whole lineage before
        another stage is spent. Its readings are fixed in the draft now, so it
        cannot be read to fit an outcome. If it finds another classified
        reachable site, the draft is not approvable as written and a successor
        draft covers every site (CN-1).
      coordinator_preview_not_evidence: >-
        This act's own search of the implementation-v2*/ Python files for
        msolve_argv(, run_child(, MSOLVE, subprocess and Popen found the
        launches at v2_driver.py lines 101 (builder), 165-166 (solve), 209
        (callgrind) and 650 (Sage comparator); v2_solver.py line 517
        (valgrind) and 533 (callgrind_annotate); a1_health.py 144-147;
        a1_pari.py 96 and 121 (gp); and wrapper, dev-check and toy harness
        launches. No other msolve launch appeared. This is a preview that
        shapes the census's expected answer; it is not the census and is
        not relied on.
    R-5_the_DV-1_Sage_PARI_default:
      ruling: >-
        ACCEPTED AS FLAGGED; NOT A DEFECT OF THIS LINEAGE; NOT FIXED HERE.
        The Sage comparator child that anchor-identity starts (v2_driver.py
        line 650; v2_common.py lines 39-40) runs at Sage's library default
        PARI stack, parisize 8000000 and parisizemax 1073741824 (DV-1 probe;
        implementation-v2-r2.md line 1099). The paristack addendum places the
        Sage comparator out of scope (lines 393-398) and says a child-side
        PARI use left at a library default is FLAGGED, "not fixed here", and
        "does not by itself stop" the stage (lines 651-657). Stage R1 recorded
        the same flag (DEC-20260923-582d6b F5 and RD-10).
      reason: >-
        The in-process overflow that stopped v2 (RUN-GFPN-3377f1) had
        parisizemax equal to parisize (8003584), so the stack could not grow.
        The Sage child's parisizemax of 1 GiB lets its stack grow to 1 GiB,
        inside the 10 GiB child cap. The same default is therefore not the
        same risk. It is a disclosed exposure, not an observed failure.
      conditions: >-
        (1) The census CN-3 lists the comparator with its stack values and
            every (p', degree) at which anchor-identity reaches it (the gate
            package of trial-plan-v2.json order 3, p' = 16777291, n = 5).
        (2) The r3 stage's complete DV-1 records the probe again.
        (3) A Sage-side PARI failure in the anchor-identity package is an
            infrastructure or implementation outcome under the frozen
            classification, never evidence; a new Coordinator decision rules
            on it, and any fix is a separate draft.
