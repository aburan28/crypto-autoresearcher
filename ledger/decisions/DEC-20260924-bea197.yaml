      ruling: >-
        NOT COMPLETE, contrary to the claim release note ("DV-1 complete with a
        flagged Sage PARI default", line 24). Card ST-7 requires DV-1 of
        paristack PS-6 "COMPLETE" (TASK-20260923-de3a7d lines 287-288). PS-6
