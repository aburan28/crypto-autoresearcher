  rationale:
    - >-
      THE STOP RULE DID ITS JOB. It exposed, before any spend, a launch path
      the re-solve rule could not reach, on the addendum's blocking gate. The
      alternative was a gate whose outcome could depend on the clock second of
      an FGLM seed.
    - >-
      THE DEFECT IS OURS, AND IT IS RECORDED. Four successive acts checked
      solve() call sites and presumed they were the classified launch sites.
      CORR-20260924-5b83a1 says so, and the census checks launch sites
      directly before the next approval.
    - >-
      THE REMEDY EXTENDS THE APPROVED RULE; IT DOES NOT CHANGE IT. K, the
      signature, the spacing, the cap, the consistency checks and the
      recording are carried unchanged to the one further site, and every
      frozen byte, flag, seed and pass predicate stays.
    - >-
      THE FIX IS CHOSEN ON CODE, NOT ON ANY OUTCOME. No repaired package and
      no health-check result at the ladder prime exist. The census's readings
      are fixed before it runs.
    - >-
      THE BIAS IS TOWARD THE DECIDABLE QUESTION. Criterion C1's measured side
      and KN-OPEN-9b4a2b need the v2 ladder and the 31-bit rung. A
      development stop is not a reason to abandon them (AGENTS.md
      "Research-direction integrity"); the successor route is concrete and
      costs one zero-run check before the next stage.
    - >-
      NO SECURITY READING. Toy EcGFp5-shaped arithmetic with known scalars;
      nothing transfers to p = 2^64 - 2^32 + 1.

