  rulings:
    R-1_the_STOP:
      reading_under_ST-8: >-
        CORRECT, AND FINAL FOR STAGE r2. SE-3 (solverevent lines 305-308, as
        incorporated by seedresolve line 78) requires that every classified
        msolve launch pass through the wrapper, and SE-9 (lines 449-457) and
