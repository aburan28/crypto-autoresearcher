        641-645). DV-7 did not run. The r2 DV-1 code performs the static
        search, a hand-written call graph and the Sage probe only
        (r2_devchecks_more.py lines 35-93), and the note records no DV-1
        outcome or inventory section: DV-1 appears only in the file table
