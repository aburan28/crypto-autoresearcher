coordinator_decision:
  id: DEC-20261002-1a2f39
  context: >-
    Design tick. IDEA-20260926-89886c is the first open ECC idea and is not
    designed. IDEA-20260915-3476de is next and is not designed.
    IDEA-20260922-96289a is the following open idea, and only the lag-1
    gates on toy series are frozen.
  decision: approve
  target_ids:
    - IDEA-20260922-96289a
    - H-DREG-6f667e
    - EXP-DREG-72a5a9
  rationale:
    - >-
      DEC-20260926-901ea1 NA-4 says not to design the m = 3 pricing contract
      until NA-2's review returns. This session did not find that review.
      IDEA-20260926-89886c stays proposed and uncited by the hypothesis and
      the experiment.
    - >-
      IDEA-20260915-3476de stays undesigned. Its decisive Boolean-native arm
      needs BRiAl, which this session did not install. The closure of
      BATCH-a33cda in DEC-20260915-927eaa does not supply that engine.
    - >-
      Standing user authorization of 2026-09-06 covers approval of the
      lag-1 check. The contract names the three series, the five pair
      counts, two routes, and a falsification criterion. It does not
      walk a graph.
    - >-
      The ratios were computed in this session. That computation is not a
      run. The level ratio is 1/4 and the alternating ratio is -3/4. The
      constant series is undefined. The eight-pair threshold is strictly
      above 707/1000 and strictly below 708/1000. Seven pairs stay
      unmeasured.
    - >-
      origin/main was already contained in HEAD. origin/main was
      5ea5ff661288cb3db3fea3e68bf370f1bb3aee0c.
  evidence_refs:
    - ledger/proposals/IDEA-20260922-96289a.yaml
    - ledger/decisions/DEC-20260926-901ea1.yaml
  limitations:
    - Approval authorises the gates. It does not measure a walk.
    - The two skipped ideas remain open. Neither is closed by this decision.
  next_actions:
    - Dispatch TASK-20261002-a1cc30 after the TASK-20261002-c00a6e receipt verifies.
    - Re-check DEC-20260926-901ea1 NA-2 before designing IDEA-20260926-89886c.
  knowledge_promotion:
