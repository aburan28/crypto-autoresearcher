  limitations:
    - >-
      NONE OF THE THREE REVIEWS IS THE AGENTS.md RULE-12 INDEPENDENT REVIEW THIS CHAIN
      STILL LACKS. Each is one session, one model pass, dispatched by the same top-level
      session whose work it reviews (fresh context, adversarially briefed, but not a
      structurally independent second backend or a human referee). The red-team report's
      own required_controls section says this explicitly for CORR-20260807-652652, and it
      applies with equal force to the other two corrections and to the proof review.
    - >-
      WHAT REMAINS FOR A COORDINATOR, undone by this record on purpose: (1) decide
      whether to ratify, amend, or roll back the unauthorized `status` changes on
      H-SMON-db677d (supported_scoped) and H-FBST-c8a080 (confirmed_scoped) -- this
      record fixed their cross-reference LISTS but did not touch their status fields,
      since changing a status is exactly the rule-1 action only a Coordinator may take,
      and reverting it unilaterally would repeat the violation in the opposite direction;
      (2) decide whether EXP-HPSC-74991c, EXP-SMON-32339c, EXP-FBST-190234, and
      EXP-KDUAL-8f0b69 retroactively merit approval given the validator's `passed`
      verdicts, or require re-execution under a proper task card; (3) commission the
      structurally independent rule-12 review (a different resolved model per the
      model-policy note, not a second alias falling back to the same backend) that all
      three reviews name as still missing before any "CLOSED" disposition is reasserted.
    - >-
      Two numeric items remain genuinely unresolved pending SageMath: the
      `matzov(params)` direct comparison against MATZOV-2022's headline (137.5/193.5/
      257.8), which would determine whether CORR-20260807-169c13's residual was an
      object-naming confusion or a real reproduction gap; and EXP-KDUAL-8f0b69's
      secondary metrics generally. Neither was attempted here; SageMath remains
      unavailable in this environment, confirmed again during this review round.
    - >-
      No new run was executed as PART of this decision beyond the correlation scan
      (EV-FBST-019dbd, which reuses already-collected data) -- this record is a synthesis
      and correction pass, not a new experimental result.

  next_actions:
