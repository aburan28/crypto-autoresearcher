  rationale:
    - >-
      Commissioning independent review, rather than continuing to file more unreviewed
      work, was the highest-value action available: every record filed on this branch
      before this point named the same gap, and closing even part of it converts a
      standing disclosure into settled fact where the reviews agree, and into a specific,
      fixable defect where they do not.
    - >-
      The proof review's method is what makes its PASS verdicts worth something: it did
      not trust the manuscript's own risk assessment, and instead re-derived from
      scratch the two characteristic-free invariant-theory facts (tensor-invariants
      commuting with products; Frac(A^G) = Frac(A)^G) that Lemma 2.3 needs, and
      independently confirmed the topological, reducedness-insensitive nature of the
      generic-point argument Lemma 3.2 needs. A review that had merely read the proof and
      agreed would be worth much less than one that rebuilt the load-bearing lemmas
      itself and could not break them.
    - >-
      The validator's from-scratch re-execution (not just hash verification) is what
      makes its `passed` verdicts meaningful: every one of the five runs reproduced its
      committed output byte-for-byte under independent re-execution, including a live
      network re-fetch of third-party source for KDUAL. A receipt that only checks hashes
      cannot catch a determinism failure; one that re-runs the code can and did not find
      one.
    - >-
      The red-team's dual_hybrid/matzov finding is the single most consequential item in
      this batch: it identifies that this session's own prior correction
      (CORR-20260807-169c13) mischaracterized an unresolved residual as "the live
      question in the lattice lane" while comparing the wrong object. Catching one's own
      correction being wrong, via a review commissioned for exactly that purpose, is the
      argument for having commissioned it.
    - >-
      The asymptotic-dominance argument was not accepted on the red-team report's
      say-so: it was independently re-derived and checked numerically by this session
      (the ratio of the yield-error exponent to the complexity-class exponent, for
      m(N) ~ sqrt(ln N / ln ln N) and any fixed positive power-law exponent, grows
      without bound as N -> infinity) before being recorded as a correction. This
      distinction -- verifying a review's finding rather than merely relaying it --
      matters exactly because this whole batch exists to raise the bar above
      self-reported, unverified claims.

