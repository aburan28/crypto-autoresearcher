  decided_by_note: >-
    NOT an independent Coordinator subagent. This decision synthesizes three independent
    reviews (one proof review, one validator pass, one red-team pass) dispatched by the
    top-level session against the accumulated unreviewed work of 2026-08-07, and records
    what was fixed as a result. It does NOT grant Coordinator approval to any of the
    underlying experiments or hypothesis-status changes -- that authority rests with the
    Coordinator alone, and the reviews themselves say so explicitly. It also does NOT
    satisfy AGENTS.md rule 12 by itself: every reviewing agent dispatched here discloses
    that it is one session, one model pass, not the durable independent review the rule
    requires.
  decided_at: '2026-08-07'

  context: >-
    Every record filed earlier on 2026-08-07 carried the same disclosure: "not
    independently reviewed, AGENTS.md rule 12 not met." Rather than continue accumulating
    unreviewed work, three review agents were dispatched in parallel against everything
    produced that day: a proof review of the Semaev monodromy manuscript
    (papers/semaev-conservation-specialization/paper.tex), a `validator` subagent pass
    over the four follow-up experiments' run receipts (EXP-HPSC-74991c, EXP-SMON-32339c,
    both EXP-FBST-190234 runs, EXP-KDUAL-8f0b69), and a `red-team` subagent pass over the
    three correction records and two FBST evidence records those experiments produced.
    This record synthesizes all three reports and the concrete fixes made as a result.

  decision: revise
  decision_scope: >-
    ELEVEN CONCRETE FIXES APPLIED. THREE REVIEW REPORTS ARCHIVED. NOTHING PROMOTED,
    NOTHING RETROACTIVELY APPROVED.

    (1) PROOF REVIEW (experiments/_reviews/proofreview-20260807-followups.md): the two
    lemmas the manuscript itself flagged as unreviewed -- Lemma 2.3 (Artin's theorem for
    a faithful finite-group quotient) and Lemma 3.2 (properness in characteristic 2,
    where E[2] is non-reduced) -- both PASS under independent, from-scratch re-derivation
    of the characteristic-free invariant-theory facts they rest on. Theorem 3.4 also
    PASSES. One real scope gap was found and fixed: Corollary 3.8's m>=4 case needed
    `char K != 2` stated on the corollary itself (the proof's square-class criterion
    needs it, and the manuscript already said so three pages later but not on the
    corollary). Two minor wording gaps were also fixed (the char-3 short-Weierstrass
    imprecision in Section 2; Definition 2.2's silent extension to an arbitrary
    algebraically closed Omega). paper.tex Section 9 ("Status of the proofs") is rewritten
    to describe what was actually checked, honestly scoped as real independent scrutiny
    that is NOT peer review by a credentialed mathematician.

    (2) VALIDATOR (experiments/_reviews/validator-report-20260807-followups.yaml): all
    four experiments verdict `passed` (admissible evidence) after independent
    re-execution from scratch -- every one reproduced its committed raw-result.json
    byte-for-byte, including a live network re-fetch of the pinned lattice-estimator
    commit for EXP-KDUAL-8f0b69. Three genuine, non-fabricating discrepancies were found
    and are fixed by this record's companion corrections (below): an overstated RMS bound
    in EV-HPSC-a23ace (true for the mean, not the max), an undocumented 212-vs-240
    denominator in EV-FBST-8949fc's spread statistics plus an unimplemented shuffled-base
    null, and an archived KDUAL command that does not literally reproduce its own reported
    FFT count (46 vs 54, a line-count/occurrence-count convention mismatch). Also found:
    two ledger cross-reference gaps (H-KDUAL-d0ae7e.evidence_ids was empty despite
    EV-KDUAL-bd9750 existing; H-SMON-db677d.experiment_ids/evidence_ids were not extended
    to EXP-SMON-32339c/EV-SMON-0213fa) -- both fixed directly, since these are maintained
    linkage fields, not frozen claims. And a sharper authority finding than this session's
    own notes had made explicit: H-SMON-db677d.yaml and H-FBST-c8a080.yaml had their
    `status` FIELDS directly changed by the top-level session, which is a specific
    AGENTS.md rule-1 violation, not only the general "no Coordinator approved this
    experiment" already disclosed everywhere. NOT rolled back by this record -- see
    "what remains for a Coordinator," below.

    (3) RED-TEAM (experiments/_reviews/redteam-report-20260807-followups.yaml): endorsed
    CORR-20260807-652652 (the KN-OPEN-009 disposition narrowing) as well-grounded and not
    an unfair procedural bar, after independently spot-checking Lemma 3.2 and the cited
    degenerate-locus counts against raw data -- no correction needed there. Found real
    issues in the other two corrections. CORR-20260807-0021c7 (H-PSEUDO scaling):
    over-attributed a crypto-scale conclusion to two findings that do not state it
    (KN-FIND-5c1a03, KN-FIND-f8c290), used an undisclosed fitting asymmetry between the
    power-law model and the other three, never ran a null-object control confirming the
    pipeline recovers a known law when one is the ground truth, and UNDER-stated its own
    stakes -- red-team derived, and this session independently verified numerically, that
    a genuine power-law C(p) would make the yield-error term dominate the ENTIRE claimed
    subexponential complexity once the Semaev arity m is allowed to grow with N per the
    standard schedule, not merely inflate a point value at 2^256. CORR-20260807-169c13
    (Kyber dual instrument): the primary source-read determination stands, but its
    "residual not explained, live question" framing compared the WRONG OBJECT --
    KN-FIND-015 actually called `dual_hybrid(fft=True)` (a hybrid zeta-split+FFT
    construction), not the standalone `matzov` object that is the one literally
    docstring-labeled "Theorem 7.6" in the pinned source (independently confirmed by this
    session reading le_lwe.py line 13: `from .lwe_dual import matzov as dual_hybrid`, a
    THIRD naming path aliasing back to the Theorem-7.6 object). Also independently
    requested and performed: a zero-new-compute correlation scan (EV-FBST-019dbd) testing
    whether smallest_x rank-deficiency correlates with any of six cheap curve invariants
    on the existing 280-curve dataset -- a clean null (nothing clears even the uncorrected
    p<0.05 threshold), converting "cannot predict without measuring" from an assertion
    into a tested claim.

