          meets. An adjudication of a real characteristic would be the first
          artifact in this goal with a downstream consumer, and it would be
          unfalsifiable in precisely the way P-1's zero would have been without a
          scanner positive control. Acquisition also does not become cheaper by
          waiting one batch, whereas the verdict it produces becomes trustworthy.
          Sequenced into the same batch behind ranks 1 and 2.
