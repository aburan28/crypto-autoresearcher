coordinator_decision:
  id: DEC-20260824-af6d5c
  title: >-
    Close BATCH-f8bf86 on the composed round-1 ruling: WEAKEN the reading that
    batch 1's controls validate the adjudicator, on a measured control-power
    obstruction (2 of 5 key ablations detected); the instrument is not shown
    wrong and the arithmetic is sound; claim ceiling stays `analyzed`; one next
    action -- measure the null's power before batch 2 acquires anything
  goal_id: GOAL-DIFFP-84d641
  question_id: RQ-DIFFP-a5c483
  batch_id: BATCH-f8bf86
  experiment_id: EXP-DIFFP-fe894e
  round: 1

  context: >-
    BATCH-f8bf86 is GOAL-DIFFP-84d641's first batch. It built the three things
    the goal declares a novelty claim is unfalsifiable without -- a
    machine-readable census, a DECLARED equivalence relation with per-generator
    verification, and a verifier that adjudicates a candidate against the census
    -- and ran their controls, spending 80.748 s of wrapper-measured compute
    across six charged runs inside 960 s of ceilings. The opening decision
    DEC-20260824-4f74cd approved EXP-DIFFP-fe894e and the restriction-only
    acquisition amendment AMD-20260824-DIFFP-ACQ-1. A snapshot archive
    (TASK-20260824-be7bbc) fixed 34 paths by content, and a review plan written
    before either reviewer ran assigned seven joints across two sibling-blind
    independent sessions: J1-J4 to the Validator (TASK-20260824-c40847), J5-J7
    plus four proves-too-much objects and one blind re-derivation to the Red Team
    (TASK-20260824-3bd362). Both reviewers are terminal. This decision composes
    their two reports into ONE ruling at the exact tested scope, scores the
    Coordinator's pre-registered prior item by item, and closes the batch.
    THE PRODUCER COMPOSED NO VERDICT AND CONCEDED MOST OF ITS OWN LIMITS IN
    ADVANCE -- `data_quality: limited`, "NOTHING HERE ESTABLISHES THAT THE NULL
    WAS HARD", and an explicit refusal of the transfer assumption. That is the
    correct behaviour and is recorded as such. It also means agreeing with the
    producer's text was never going to be a review result; what the round was for
    was the questions the producer did not answer, and it answered them.

  decision: weaken
  decision_label_reasoning: >-
    `revise` WAS CONSIDERED AND REJECTED AS TOO SOFT, AND THE REASONING IS
    RECORDED RATHER THAN LEFT IMPLICIT. Five named instrument defects do want
    concrete edits (OBJ-3, OBJ-4, OBJ-5, OBJ-8, OBJ-10 / VD-3, VD-4), so `revise`
    is defensible on the operational content. But what actually changed in this
    round is not the tidiness of an implementation: it is THE STRENGTH OF A CLAIM.
    Before the round, "CTL-PLANT 96/96 and CTL-NULL 0/3000" read as evidence that
    the adjudicator discriminates and that GOAL-DIFFP-84d641 completion criterion
    1 was met. After it, the same two integers are measured to be exactly what an
    adjudicator blind to the primary datum of a differential characteristic
    scores, and two of the four verified generators are measured to emit no orbit
    image, so the criterion's own recall clause is not met as its words state it.
    That is an adverse transition on an evidential claim, and `weaken` is its
    name. Choosing `revise` would let the label understate the finding and would
    also evade the obstruction gate, which `weaken` triggers and which this
    decision discharges with a measured quantity rather than prose.
    `reject_scoped` IS FORBIDDEN HERE AND IS NOT TAKEN. The refuting measurements
    are single-session and unreplicated review-side computation
    (EV-DIFFP-b878aa UC-2), and docs/claims-and-verification.md forbids
    `reject_scoped` on that basis: the route is `weaken` plus replication, and the
    replication is this decision's one next action. Nothing is rejected in any
    case -- on every object for which a known answer could be constructed, the
    adjudicator gave that answer.
    `support` IS NOT AVAILABLE and the review plan said so in advance: no
    replication exists, the instrument was validated only on a synthetic shadow
    census, and three of CLAUDE.md's four supported-promotion gates are
    structurally unmet by a batch of this kind.
    `pause` IS NOT TAKEN. No pause_condition of GOAL-DIFFP-84d641 is met: the
    campaign budget is not exhausted (1 of 6 batches spent), a primary source has
    not been shown unobtainable, the equivalence DOES have a verified generating
    set, no batch turned out to be solver validation, and no infrastructure
    blocker exists. A failing control ends a task, not this goal.

  target_ids:
    - EV-DIFFP-b878aa
    - EXP-DIFFP-fe894e
    - RQ-DIFFP-a5c483
    - GOAL-DIFFP-84d641
    - BATCH-f8bf86
    - TASK-20260824-c6625a
    - TASK-20260824-873dc9
    - TASK-20260824-c40847
    - TASK-20260824-3bd362
    - TASK-20260824-b03556

  evidence_refs:
    - EV-DIFFP-b878aa
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/reviews/TASK-20260824-c40847/validation-report.yaml
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/reviews/TASK-20260824-3bd362/red-team-report.yaml
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/reviews/TASK-20260824-3bd362/blind-rederivation.yaml
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/review-plan/review-plan-f8bf86.yaml
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/archives/TASK-20260824-be7bbc/snapshot-receipt.json
    - DEC-20260824-4f74cd

  # ======================================================================
  rationale:
    - >-
      THE RUN SET IS VALID AND IS EVIDENCE, AND THAT WAS CHECKED BEFORE ANY
      INTERPRETATION. Six expected runs and six exist with no undeclared one; all
      six manifests schema-complete with the literal experiment id, a
      code_path_fingerprint and an armed deadline; the seven declared seeds
      byte-identical in every manifest with no eighth key; 34/34 snapshot binding
      digests matching at three separate references and 148/148 manifest module
      digests matching the tree; 48/48 exact agreement in cold re-runs by an
      independent session. Nothing failed, nothing timed out, nothing crashed. No
      infrastructure signal is being reported as a mathematical result anywhere in
      this decision, in either direction.
    - >-
      THE LOAD-BEARING RESULT IS THE RED TEAM'S PROVES-TOO-MUCH CONTROL, AND IT
      IS STATED AS THE HEADLINE BECAUSE IT IS ONE. An adjudicator whose canonical
      key CANNOT SEE THE MESSAGE DIFFERENCE AT ALL -- the identical package with
      one tuple element removed from serialize() -- scores CTL-PLANT 96/96 and
      CTL-NULL 0/3000, IDENTICAL TO THE HONEST ONE TO THE DIGIT. So the argument
      "the controls passed, therefore the adjudicator discriminates" goes through
      unchanged on an object where its conclusion is known false. The batch's
      control suite cannot distinguish the delivered instrument from one blind to
      the primary datum of a differential characteristic.
    - >-
      THE HONEST REPLACEMENT FOR "0 OF 3000" IS "2 OF 5 ABLATIONS DETECTED".
      Measured across six rows at the declared seeds: the suite detects the
      deletion of step_delta (6 false positives) and total collapse (3000); it
      does NOT detect the deletion of the message difference, the deletion of
      in_linearized_code, or both deleted at once. That is the null's power stated
      as a power rather than as an outcome, and it is the number this decision's
      obstruction records.
    - >-
      THE MECHANISM IS ISOLATED, WHICH IS WHY THE REFUTATION BASIS IS
      `derivation` AND NOT `empirical_only`. Membership is EXACT canonical-key
      equality -- a dict lookup, not a threshold -- so the acceptance region is a
      single point in every retained component and unbounded in every dropped one.
      A uniform draw is separated by whichever retained component it happens to be
      furthest from, and here that is always step_delta. NO DECLARED NULL DRAW IS
      EVER BUILT TO AGREE WITH A CENSUS ENTRY EVERYWHERE EXCEPT THE MESSAGE
      DIFFERENCE, so no declared draw ever tests whether the message difference is
      in the key. The argument's conclusion is about the key; its evidence is
      about one component of the key; the gap is invisible in 0/3000 and visible
      in one line of the ablation battery.
    - >-
      THE POSITIVE CONTROL IS WEAKER THAN ITS FRACTION READS TOO, ON A SECOND AND
      INDEPENDENT AXIS. For 64 of CTL-PLANT's 96 attempts -- every SHA-1 E1 image
      with step_start in 1..8 -- the strict membership key DOES NOT READ THE
      CANDIDATE'S DECLARED DV: align_E1 discards it and recomputes it from the
      seed window, so a one-bit mutation of the declared message difference still
      adjudicates MEMBER (VD-3). In permissive mode, act_E2_rotate at b=0 rebuilds
      step_delta from the untouched signed form, so a one-bit step_delta mutation
      still adjudicates MEMBER on SHA-1 objects (VD-4). The instrument silently
      normalises a contradiction between two fields of a candidate instead of
      rejecting or flagging it, and no artifact of this batch tells a reader that.
    - >-
      HALF THE STRICT GROUP DOES NO OBSERVABLE WORK, AND EVERY FUTURE COVERING
      NUMBER INHERITS IT. {E4} emits 0 orbit images, {E5} emits 0, and E5 can
      affect no membership verdict at all because the condition set is outside the
      key and `"E5" in gens` is read nowhere canonical() can reach. E4's only
      effect on the key is deletion of signed_representation, so it can loosen
      membership but never test it. The strict group is nominally {E1,E3,E4,E5};
      the group that does observable work is {E1,E3} plus one key-component
      deletion. That must appear wherever the strict group is quoted.
    - >-
      AND THE INSTRUMENT IS NOT SHOWN TO BE WRONG, WHICH THE COMPOSITION REFUSES
      TO LOSE UNDER THREE `breaks`. On every object for which a known answer could
      be constructed it gave that answer, including THREE TWO-SIDED known answers
      a degenerate adjudicator cannot meet: four E2-rotation images (strict
      NON-MEMBER and permissive MEMBER on all four), two E6-reindexed images (both
      primitives, both sides), and the E4 boundary object (MEMBER with E4 in
      force, NON-MEMBER with E4 removed). The SHA-0 nearby object separates on the
      path content and not merely on the in_linearized_code flag, which is the
      stronger of the two possible outcomes. Eleven of fifteen one-bit mutants
      correctly return NON-MEMBER. Both reviewers say this explicitly and this
      decision adopts it: J5's `breaks` is a finding about A CONTROL'S POWER, not
      a finding that the adjudicator is wrong.
    - >-
      THE MEASURED ZERO SURVIVED THE ONE TEST NOBODY HAD RUN. The corpus scanner
      fires on all five of its predicates individually and on three planted
      positives end-to-end across three schemas and two suffixes, while correctly
      declining a mentions-only decoy and never opening a file under the
      quarantine prefix; an independent enumeration reproduces 9337 files, 6
      candidates, 0 carrying path data. `readable = 0` is a CORPUS fact, not a
      SCANNER fact. Its honest scope is five textual schemas in five suffixes
      under two roots -- not "the corpus contains no path data".
    - >-
      THE FIREWALL HELD AS CONTENT, BY SEARCH AND NOT BY ATTESTATION. Zero
      8-hex-digit word tokens in any of the 73 committed batch files; no table of
      any kind; the quarantined entry present only as an id, a citation string, a
      path and one whole-file sha256; non-reading verified from the code rather
      than the prose; and the network boundary verified per call from the
      retrieval log (2 WebSearch, 0 WebFetch, 0 URLs followed, nothing retained
      beyond bibliographic metadata). Neither escalation trigger fires and NO
      cross-goal contamination finding is reported to GOAL-MD5-001. This is the
      joint whose failure would have damaged a goal that is not this one, and it
      was reached rather than dropped for budget.
    - >-
      TWO DEFECTIVE INTEGERS EXIST AND ONE OF THEM PROPAGATED INTO MY OWN
      ARTIFACTS BEFORE ANYONE RECOMPUTED IT. That is the concrete cost of quoting
      a producer scalar instead of recomputing it, and it is recorded against the
      Coordinator, not against the Executor: the 5583 in the snapshot receipt's
      gate G5 and in the review plan's J4 step (3) are MY inheritances of a
      producer summary figure. Both are superseded by reference below, never
      edited.
    - >-
      NO PATH IS CLAIMED NEW, FOR EITHER PRIMITIVE, AT ANY TIER; NO CRYPTANALYTIC
      IMPROVEMENT OF ANY KIND IS CLAIMED; AND A PASSING CONTROL IS NOT AN
      IMPROVEMENT. No search over the difference space was run (IR-8), no
      collision was attempted, no complexity figure or extrapolation appears
      anywhere in the package, and with a readable census of zero entries a
      NON-MEMBER verdict carries no information about the literature at all. Both
      reviewers searched for novelty language and for cost projections and found
      none.

  # ======================================================================
  composed_ruling:
    rule: >-
      A blinded reviewer's verdict covers only the joints it owns. The scalar
      `verdict` in each attestation is a LOSSY ROLLUP required by
      tools/check_review_independence.py's one-verdict-per-reviewer schema and is
      never composed in place of the per-joint map. Neither reviewer composed a
      whole-claim verdict; neither was asked to; neither saw the other's report.
    per_joint:
      J1: {owner: TASK-20260824-c40847, composed: breaks, scope: "second clause only -- two summary-versus-raw defects, the plan's own declared threshold; the cold-re-run clause holds at 48/48"}
      J2: {owner: TASK-20260824-c40847, composed: holds, scope: "and it closes the snapshot receipt's binding gap by measurement, 148/148"}
      J3: {owner: TASK-20260824-c40847, composed: breaks, scope: "tautology charge does NOT stick (8 from-statement images all MEMBER); capacity-to-fail and coverage DO break"}
      J4: {owner: TASK-20260824-c40847, composed: holds, scope: "with the scanner's scope narrowed by its own owner; closes receipt gate G5"}
      J5: {owner: TASK-20260824-3bd362, composed: breaks, scope: "decisively; the round's load-bearing result; a finding about a CONTROL'S POWER, not that the adjudicator is wrong"}
      J6: {owner: TASK-20260824-3bd362, composed: breaks, scope: "both errors on disjoint axes plus an unanticipated third; net direction not determinable"}
      J7: {owner: TASK-20260824-3bd362, composed: holds, scope: "established by search rather than attestation; reached rather than dropped for budget"}
      proves_too_much: {owner: TASK-20260824-3bd362, composed: "THE ARGUMENT PROVES TOO MUCH -- fails correctly on O1-O4, survives on O5 (the delta_m-blind adjudicator), where its conclusion is known false"}
      blind_rederivation: {owner: TASK-20260824-3bd362, composed: "NOT BLIND; void as an independence instrument; its localisations stand as ordinary findings"}
    tally_is_not_the_ruling: >-
      Four breaks and three holds is not the result and this decision does not
      report it as one. The result is that the two joints that decide what the
      package MEANS (J3 capacity-to-fail, J5 control power) both break in the same
      direction and by the same mechanism, while every joint about whether the
      package IS WHAT IT SAYS IT IS (J2, J4, J7) holds. An instrument that is
      exactly what it claims to be, whose controls do not measure what they are
      read as measuring, is a specific and actionable state -- and it is not the
      state a tally conveys.

  # ======================================================================
  prior_scoring:
    discipline: >-
      SCORED ITEM BY ITEM AND NOT RETRO-FITTED. The opening prior stands unedited
      in batch.yaml `coordinator_prior_recorded_at_opening` and was carried
      forward VERBATIM into the review plan before any report returned. A prior
      that survives contact is worth little; one that is overturned is the most
      informative thing a pre-registration produces, and the overturns below are
      recorded as first-class findings rather than absorbed. NOT ONE WORD OF THE
      PRIOR IS EDITED HERE.
    headline: >-
      THE PRIOR WAS OVERTURNED IN BOTH DIRECTIONS, WHICH IS THE MOST USEFUL SHAPE
      AND THE LEAST FLATTERING. TWO CLAUSES I PREDICTED SAFE FAILED: J1's "no
      OTHER integer disagreement" (VD-2 exists) and J3's "a single-bit mutation of
      an image correctly adjudicates NON-MEMBER" (VD-3 and VD-4 exist). TWO BREAKS
      I PREDICTED LIKELY HELD: J2(g), the fallback test runner, which matches a
      real pytest at 34 = 34; and J4(1), the scanner positive control, which fires
      on every predicate. A prior wrong in both directions is not a wash -- it
      says the model I was reasoning from was mis-specified in a particular way,
      and the way is legible: I was watching the INFRASTRUCTURE (does the test
      runner lie, does the scanner silently fail) and the failures were in the
      SEMANTICS (does the key read the field the report names).
    P-1:
      predicted: >-
        STRONG. The readable census will be EMPTY for both primitives, held
        weakly because an exact hit on a prediction of zero is also what a scanner
        that silently found nothing produces.
      outcome: CONFIRMED AS LITERALLY STATED, AND THE STATED WORRY IS DISCHARGED.
      detail: >-
        readable_md5 = 0 and readable_sha1 = 0, reproduced by an independent
        enumeration (9337 / 6 / 0, 4/4 agreement) and, for the first time,
        supported by a positive control on the instrument that produced it. The
        self-doubt I recorded was the right doubt and it was answerable; nobody
        had answered it because nobody had tried.
      refinement_the_prior_did_not_contain: >-
        The zero is scoped to five textual path-data schemas in five file
        suffixes under two roots. P-1 is confirmed exactly as written; it is NOT
        evidence for the wider proposition, and a later record reading it wider
        would be reading it wider than it was measured.
    P-2:
      predicted: >-
        MODERATE. E1, E3, E4 verify; E2 splits (expansion commutes, step function
        does not); E6 verifies; E5 is excluded for budget, not for falsity.
      outcome: MIXED, AND THE PRIOR IS FURTHER OVERTURNED BY THIS ROUND ON A POINT IT DID NOT CONTEMPLATE.
      detail: >-
        Already scored at plan time: E1/E3/E4 verified as predicted; E2's
        two-part split landed exactly where I said, which is the one place my
        prior was specific and right; and TWO PREDICTIONS FAILED IN OPPOSITE
        DIRECTIONS -- I predicted E6 verifies and it is EXCLUDED, and I predicted
        E5 would be excluded for budget and it VERIFIED. Neither error was in the
        direction I was watching.
      new_overturn_from_this_round: >-
        THE PREMISE UNDER P-2 IS ALSO WRONG, AND THIS IS THE PART WORTH HAVING.
        P-2 treats "VERIFIED" as though it meant "does work in the equivalence".
        Measured: E4 and E5 are VERIFIED and emit NO orbit image; E5 can affect no
        membership verdict at all; E4 can only delete a key component. So my
        prediction about E5 was wrong in one direction at plan time and wrong in a
        second, deeper way now -- getting E5 "right" as VERIFIED would still have
        told me nothing about whether it does anything.
    P-3:
      predicted: >-
        STRONG on the outcome (CTL-PLANT 100% recall, CTL-NULL zero strict false
        positives) AND EXPLICITLY LABELLED "THE PREDICTION I TRUST LEAST AS
        EVIDENCE", with the specific expectation that CTL-NULL family (b) --
        uniform draws from INSIDE the linearized code -- is where a false positive
        would appear if anywhere.
      outcome: >-
        OUTCOME AS PREDICTED, MEANING OVERTURNED, AND THE ONE SPECIFIC MECHANISM I
        NAMED IS REVERSED.
      detail: >-
        96/96 and 0/3000 exactly as predicted, and the prediction was worth
        nothing, exactly as I said in advance it might be. The honest replacement
        is 2 of 5 ablations detected. AND MY NAMED FAMILY IS BACKWARDS: family (b)
        is measurably the WEAKEST of the three -- uniform over 2**512 codewords
        against 8 targets, achievable probability <= 8/2**512, 0/1000 partial
        matches. Family (a) is the ONLY family with measurable structure: 6 of
        1000 draws matched a planted message difference exactly, because every
        planted MD5 entry carries a weight-1 difference and the draw space is 512
        positions. I pointed the reviewer at the wrong family and it went and
        measured all three.
      credit_where_it_is_due_to_the_prior: >-
        The instruction "the reviewer that attacks the null's DIFFICULTY rather
        than its OUTCOME is doing the more useful work" is the sentence that
        produced this round's headline. The prior was right about what to attack
        and wrong about where it would give.
    P-4:
      predicted: WEAK. CTL-OBS direction (i) finds ZERO collisions in the declared bounded slice, held weakly because absence in a small slice is close to uninformative.
      outcome: AS PREDICTED (0 collisions in 1024 objects), STILL WEAK, AND NOW WEAK FOR A MECHANICAL REASON RATHER THAN A CAUTIOUS ONE.
      detail: >-
        The producer correctly marked direction (i) `required_to_be_zero: false`.
        The Red Team supplies what the prior only gestured at: the slice was
        INDEPENDENT RANDOM PAIRS, a population in which a coarse collision is
        hopeless, so 0/1024 is a controlled null aimed away from the phenomenon.
        Re-aimed at MANY WITNESSES OF THE SAME MESSAGE DIFFERENCE, its collision
        rate is precisely the missing magnitude of J6's coarse direction. My weak
        prior was right; it was right about a measurement that was pointed in the
        wrong direction.
    P-5:
      predicted: >-
        STRONG, and explicitly a prediction about this program rather than about
        the mathematics. The binding constraint on this whole goal will turn out to
        be ACQUISITION, not search and not solver quality.
      outcome: UNCHANGED AND CORROBORATED, AND DELIBERATELY NOT ALLOWED TO GENERATE THE ROADMAP.
      detail: >-
        J7 corroborates it independently: 8 tier-labelled acquisition gaps, 1 hard
        refusal, 0 readable, and the single highest-value gap (SHA-1 DV
        classification) is Tier C and unblocked. Nothing in either reviewer's
        joints bears against it.
      the_tension_I_am_naming_rather_than_smoothing: >-
        P-5 IS A CLAIM ABOUT THE CAMPAIGN'S BINDING CONSTRAINT. IT IS NOT A CLAIM
        THAT ACQUISITION IS THE NEXT ACTION, AND THIS ROUND SHOWS IT IS NOT.
        Acquiring a published path first would hand the newly acquired object to
        an instrument whose control suite is measured not to see the primary datum
        of a differential characteristic -- and that verdict would be the first
        artifact in this goal with a downstream consumer. A strongly-held prior
        that happens to point at a plausible next step is exactly where a
        coordinator stops reasoning; recorded so that it is visible that I did not.
    review_round_prior:
      one_sentence_predicted: >-
        "I EXPECT BOTH REVIEWS TO CONFIRM THE ARITHMETIC AND TO BREAK THE
        CONTROLS' MEANING ... so the honest composed verdict is `analyzed` with the
        instrument UNVALIDATED as an instrument, not merely unvalidated against
        published paths."
      outcome: CORRECT IN SHAPE, UNDERSTATED IN DEGREE, AND WRONG IN EVERY MECHANISM IT NAMED.
      item_by_item:
        J1: >-
          FAILED. I predicted exactly one transcription defect and "no OTHER
          integer disagreement", and staked a stated consequence on it. There are
          two. By my own rule my confidence in every unchecked integer should
          drop; the Validator tempers that precisely and I adopt its tempering --
          89 fields were checked mechanically, not sampled, 87 agree, and the
          unchecked remainder is small and mostly prose.
        J2: >-
          PREDICTED BREAK THAT HELD. I named (g), the pytest-absent fallback
          runner, as the cheapest way for this package to look tested and not be.
          It was measured against a real pytest on an interpreter the producer
          never had: 34 = 34. The suspicion was worth raising and is now closed.
        J3: >-
          SPLIT. The half I called "my sharpest new prediction" -- that
          from-statement images still adjudicate MEMBER, so the shared-code defect
          is latent not active -- is CONFIRMED on eight objects. The other half --
          "a single-bit mutation of an image correctly adjudicates NON-MEMBER" --
          FAILED, and I had written that if either half failed "the instrument is
          in worse shape than `limited`". I stand by that consequence.
        J4: >-
          PREDICTED BREAK THAT HELD. I wrote "I genuinely do not know whether the
          scanner would fire on a seeded positive, and neither does anyone,
          because nobody has tried." Somebody has now tried and it fires.
        J5: >-
          RIGHT VERDICT, WRONG MECHANISM, TWICE. (a) I predicted family (a)'s
          probability is indistinguishable from zero -- confirmed in outcome, but
          it FACTORS, and one factor is 1/64 and was reached 6 times; that
          factorisation is the only reason the null has any power at all and is
          what makes the ablation battery constructible. (b) I predicted family
          (c)'s 1000 draws are excluded by ONE BOOLEAN before any path content is
          compared -- descriptively confirmed, MECHANICALLY REFUTED: forcing the
          flag True leaves the verdict unchanged and deleting the flag entirely
          leaves CTL-NULL at 0/3000, so the boolean is redundant, not decisive.
          "A third of CTL-NULL was a boolean check" UNDERSTATES the problem: a
          third of CTL-NULL was decided by a component whose absence the control
          cannot even detect. (c) I predicted family (b) is the only family with
          structure -- REVERSED.
        J6: >-
          CONFIRMED, AND THERE IS A THIRD ERROR I DID NOT ANTICIPATE. I predicted
          both errors present on different axes and not cancelling; measured, with
          the fine direction quantified EXACTLY at 32k rather than bounded. The
          unanticipated third: serialize() drops `step_start` whenever E1 is in
          the generator set with NO PRIMITIVE GUARD, so the MD5 key loses the step
          extent to a generator declared for SHA-1 only -- absorbing an axis the
          declaration explicitly says is never absorbed.
        J7: >-
          CONFIRMED, AND THE COMFORT IS NOW EARNED RATHER THAN ASSUMED. I held
          this prediction "with the least comfort of any in this plan" and asked
          for it to be searched for rather than attested. It was searched for.
        blind_rederivation: >-
          RIGHT ABOUT SHA-1, INCOMPLETE ABOUT MD5, AND THE PREDICTION ITSELF IS
          WHY THE RE-DERIVATION IS NOT BLIND. SHA-1 localised exactly as predicted
          to the shift set, the three missing images being precisely the backward
          shifts. MD5 localised somewhere the prior did not look. AND THE PRIOR
          WAS INSIDE ITS OWN blind_from LIST, INSIDE A DOCUMENT THE REVIEWER WAS
          ORDERED TO READ FIRST. See procedure_deviations PD-2.
      what_would_have_overturned_it_wholesale: >-
        DID NOT FIRE. No code_path_fingerprint mismatches the tree, no seed is
        outside the seven declared, no undeclared run exists. The batch closes on a
        research finding, not on an infrastructure finding.

  # ======================================================================
  independence_ruling:
    finding: >-
      THE ROUND'S INDEPENDENCE IS COMPROMISED IN ONE DIRECTION, AND THE FAULT IS
      THE DRIVING SESSION'S -- NOT EITHER REVIEWER'S. The commit at bd9d62886
      carried the Validator's report with its FINDINGS AND THEIR MECHANISMS in the
      message body (the J1-J4 verdicts; 2094/2089; 5583/3103 with its two-hop
      propagation; VD-3's align_E1 with the 64-of-96 figure; VD-4's b=0; the
