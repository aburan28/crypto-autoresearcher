          named route to the one number that would make the equivalence's net
          error direction determinable, and every covering number this goal ever
          reports inherits that direction. It loses only on ordering: it measures a
          property of the EQUIVALENCE, and rank 1 measures whether the apparatus
          that would validate any such measurement can detect anything at all.
