    ruling: >-
      NONE OF THE 9 IS A REPORT DEFECT, AND NONE IS A SUBSTANTIVE INDEPENDENCE
      FAILURE. A nonzero exit is neither silently treated as a violation nor
      silently treated as nothing.
    itemised:
      - count: 7
        problem: "'<reviewer> does not claim joint '<...>' in joints_owned', once per joint"
        cause: >-
          FORMAT, NOT SUBSTANCE. The checker derives each joint's NAME from
          `entry.get("joint")` (line 136), which in this plan is the joint's
          entire multi-sentence statement paragraph, and then demands that whole
          paragraph appear verbatim in the reviewer's `joints_owned` list (line
          154). The plan's `joints[*]` carry no short `id` field, while the plan's
          own `unowned_joints_check` keys them [J1..J7] and both reviewers'
          attestations use those short keys. Every joint IS owned, by exactly one
          reviewer, and both attestations say so.
        durable_fix: >-
          Round 2's review plan gives every joint an explicit short `id: J1..Jn`
          alongside its statement, and reviewers list those ids. Alternatively the
          checker reads a short id when present and falls back to the paragraph.
          The plan change is cheaper and is adopted; the checker change is offered
          to whoever owns tools/.
      - count: 1
        problem: "proves_too_much.failure_signature is empty"
        cause: >-
          FORMAT, AND THE PLAN'S PLACEMENT IS THE BETTER ONE. The checker reads a
          single TOP-LEVEL `proves_too_much.failure_signature` (line 189); this
          plan places a `failure_signature` inside EACH of its four objects,
          because a known-false object's failure signature is a property of that
          object and a single shared one would be vacuous. Four signatures exist,
          all specific, and all four were run against.
        durable_fix: >-
          The checker should accept per-object signatures. Until it does, round 2
          may carry a top-level roll-up in addition to the per-object ones.
      - count: 1
        problem: "TASK-20260824-3bd362: blind_from_respected must be explicitly true for a re-derivation task"
        cause: >-
          SUBSTANTIVE BUT PRE-DECLARED AND SELF-REPORTED, AND IT IS THE HARNESS'S
          FAULT AND MINE, NOT THE REVIEWER'S. `blind_from_respected: false` is
          correct and honest: a blind_from path WAS read before sealing -- the
          plan's own coordinator_prior item, which sits INSIDE the document the
          plan orders the reviewer to read first. See procedure_deviations PD-2.
    and_the_leak_detector_never_fired:
      finding: >-
        RECORDED AS A HARNESS FINDING, BECAUSE IT IS THE MOST IMPORTANT LINE IN
        THIS BLOCK AND IT PRODUCED NO OUTPUT AT ALL. The checker's actual leak
        test (lines 216-217) matches a `sources_read` entry against a `blind_from`
        entry LITERALLY: `r == b or r.startswith(b.rstrip("/") + "/")`. Against
        `blind_from: harness/diffpath/**`, `rstrip("/")` leaves the `**` in place,
        so the tested prefix is the literal string `harness/diffpath/**/` and the
        reviewer's `harness/diffpath/adjudicator.py` cannot match it. Glob
        patterns are not expanded. Two further `blind_from` entries in this plan
        are English prose describing document sections, which can never match a
        path by construction. SO THE CHECKER WOULD NOT HAVE DETECTED A LEAK EVEN
        HAD ONE OCCURRED THROUGH EVERY PATH IT NAMES.
      what_actually_surfaced_the_contamination: >-
        THE RE-DERIVER'S OWN HONEST BOOLEAN, and its unprompted narrative
        disclosure. Not the tool. A round whose independence rests on a
        self-reported boolean has exactly the assurance of that boolean and no
        more, and this decision does not claim more.
      it_is_not_evidence_about_anything_mathematical: >-
        STATED EXPLICITLY: this is an infrastructure finding about a checking
        tool. It is not evidence about MD5, SHA-1, the adjudicator, the census or
        the equivalence, in any direction.
      durable_fix_offered: >-
        Expand glob patterns in `blind_from` before prefix-matching (fnmatch or
        pathlib match), and reject non-path `blind_from` entries at plan-validation
        time so a prose entry cannot silently be a no-op. Offered to whoever owns
        tools/; not executed here, because this session has no shell and tools/ is
        outside its write scope.

