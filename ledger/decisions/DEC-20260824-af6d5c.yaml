    not_warranted: >-
      NOT WARRANTED THIS BATCH, FOR THREE CONCRETE REASONS, AND WITH THE SUCCESSOR
      NAMED SO THIS IS A DEFERRAL AND NOT A QUIET DROP.
      (1) THE ENTRY THE TASK CARD ANTICIPATED IS THE ONE THIS ROUND REFUTED. The
      card and GOAL-DIFFP-84d641's fifth completion criterion both say "a working
      adjudicator with BOTH CONTROLS PASSING warrants a KN-TECH entry recording
      the census schema, the per-generator verification status and the two
      controls". Both controls did pass, and this round measures that their
      passing does not mean what the sentence assumes: the suite detects 2 of 5
      key-component ablations, an adjudicator blind to the message difference
      scores identically, two of the four "verified generators" emit no orbit
      image and one can affect no verdict at all. Promoting that entry now would
      make the artefactual argument DURABLE and would propagate it to every
      primitive this program later asks "is this new" about -- which is precisely
      the reuse the criterion wants and precisely why it must be right first.
      (2) THE PROMOTION RULE IS NOT MET. This program promotes a KN-FIND on
      `support` or `reject_scoped` backed by `replicated` or `strong` evidence.
      This decision is `weaken` and EV-DIFFP-b878aa carries `preliminary`, because
      the load-bearing measurements are single-session, unreplicated, and were run
      without a run record (EV-DIFFP-b878aa UC-2).
      (3) THIS TASK MAY MINT NO IDENTIFIER. TASK-20260824-b03556 holds exactly two
      pre-allocated ids, EV-DIFFP-b878aa and DEC-20260824-af6d5c, and mints
      nothing else; the session has no shell and cannot run tools/allocate_id.py,
      so a KN-TECH or KN-FIND id could only be guessed, and a guessed identifier
      in a corpus keyed by identifier is worse than a deferred entry.
    what_the_entry_must_contain_when_it_is_written: >-
      NAMED NOW, WHILE THE OBJECT IS STILL LOADED, SO THE DEFERRAL COSTS NOTHING.
      The warranted entry is a KN-TECH on ADJUDICATION AND CONTROL POWER, and its
      content is: the census schema with its three never-summed counts and the
      separate shadow population; the per-generator verification status TOGETHER
      WITH each generator's ORBIT ACTION (the images it emits, or "none, and why")
      -- the field whose absence made the blind re-derivation underivable from the
      declaration; the two controls AND the ablation battery that measures what
      they can detect; the two-sided known-answer decoy design (an image under an
      EXCLUDED generator must be NON-MEMBER under strict and MEMBER under
      permissive), which is the strongest structural property this instrument has;
      and the standing warning that in an exact-key adjudicator a reported distance
      is not a margin. It is written when the family-(d) control and the ablation
      battery have run under charged runs, i.e. at the close of the next batch.
