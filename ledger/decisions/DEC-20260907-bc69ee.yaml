    asked whether to invest that compute, amend the gate to accept 4-of-5,
    or stop; the user chose to invest the compute.
  decision: expand
  target_ids:
    - EXP-RELN-141a86
    - H-RELN-427bfd
  rationale:
    - >-
      The frozen contract's Stage-0c gate requires all five recovery
      controls; the user chose to clear it as written rather than amend
      it, so no protocol_amendment is needed -- only a longer-running
      dispatch of the same, already-validated method (targeted
      minimality with per-level checkpointing, proven to survive a hard
      kill in RUN-RELN-141a86-stage0c-minimality).
    - >-
      Given the estimated 12-14 hour duration, this is dispatched as a
      DETACHED background process that survives this session's own turn
      boundaries (and, so far as achievable, a container restart, via the
      already-proven checkpoint durability), with a scheduled check-in
      rather than a live wait. Both DEC-20260907-2a3727's original design
      and this decision retain the same non-negotiable constraint: no
      subagent may unilaterally proceed to Stage 1 even if this control
      also clears -- that remains a Coordinator act after this run
      returns.
  evidence_refs:
    - EV-RELN-ed92ff
    - experiments/EXP-RELN-141a86/runs/RUN-RELN-141a86-stage0c-minimality/checkpoint-INV-7_p_exist.json
  limitations:
    - >-
      This decision does not guarantee the job completes in the estimated
      window; the extrapolation in EV-RELN-ed92ff is from partial data
      (levels 1-8) and may be inaccurate. A checkpoint-based resume is
      available if the job is interrupted (by a wall-clock cap, a
      container restart, or anything else) before completion.
    - >-
      This decision does not itself authorize Stage 1; even a clean 5-of-5
      pass on this control still requires its own Coordinator review of
      the combined result before Stage 1 is dispatched.
  next_actions:
    - >-
      Dispatch a detached, checkpointed enumeration of complexity level 9
      on the enum_xclass_signed_m2 pack for INV-7 p_exist, per handoff
      TASK-20260907-8e0165, with a check-in scheduled for roughly 15 hours
