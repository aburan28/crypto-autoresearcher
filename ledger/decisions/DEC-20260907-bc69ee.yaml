    - >-
      On completion (or on the scheduled check-in, whichever comes first),
      read the final checkpoint/result, and if it clears, bring the
      complete 5-of-5 recovery-control table back to the Coordinator for
      the Stage-1 authorization decision.
  knowledge_promotion:
