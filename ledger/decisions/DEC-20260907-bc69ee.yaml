  recorded_at: '2026-09-07'
  context: >-
    EV-RELN-ed92ff recorded 4 of 5 Stage-0c recovery controls passed for
    EXP-RELN-141a86, with INV-7 p_exist (canonical complexity 11) the sole
    remaining open control, diagnosed at approximately 12-14 hours to
