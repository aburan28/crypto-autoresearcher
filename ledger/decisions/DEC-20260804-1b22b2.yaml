  archived_by: TASK-20260804-074
  context: >-
    BATCH-067 analyzed whether the Weil bound implies a yield upper bound for Semaev
    arithmetic factor bases. Conclusion: DL circularity blocks the direct approach.

  decision: close_weil_bound_identify_h_pseudo
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    The Weil bound direction for yield upper bound is BLOCKED by DL circularity:
    the character sum bounding the yield involves DL(P) (the discrete log of P),
    which is the unknown quantity ECDLP asks to compute. The Weil bound cannot be
    applied without a circular assumption on the pseudorandomness of DL(P).

    IDENTIFIED BREAKTHROUGH CONDITION: The H-PSEUDO assumption (DL values of
    small-x points are pseudorandom in Z/N with |hat{1_S}(k)| ≤ C*sqrt(B)) would
    allow proving the yield bound. But H-PSEUDO cannot be proved by classical
    exponential-sum machinery — it would require a new technique for bounding
    the distribution of ECDLP solutions for structured inputs.

    The program has reached the THEORETICAL BOUNDARY of current techniques:
    - Proved: algebraic FB → Bezout no-go
    - Empirical: arithmetic FB → yield ≈ heuristic
    - Blocked: proving the arithmetic FB yield bound requires H-PSEUDO
    - H-PSEUDO is essentially equivalent to proving aspects of ECDLP hardness

    This is NOT a failure — it is a precise characterization of the remaining gap.

  h_pseudo_statement: >-
    H-PSEUDO: For F = {P ∈ E(F_p) : x(P) < t} (factor base with threshold t ~ B*p/N),
    the Fourier coefficients of the indicator function 1_F on Z/N satisfy:
    |hat{1_F}(k)| = |Σ_{P ∈ F} e^{2πi k*DL(P)/N}| ≤ C * sqrt(B)
    for all k ≠ 0 mod N and some universal constant C.
    Under H-PSEUDO: Semaev yield satisfies r(T) ≤ B^2/N + O(B/sqrt(N)) (tight around heuristic).

  naming_obstruction: DL_circularity_obstruction

  exact_next_action: >-
    BATCH-068: Final synthesis and PR. Record the complete theoretical boundary map
    of prime-field ECDLP attack directions as a SYNTHESIS document. The key finding:
    the gap between "empirically no sub-rho" and "proved no sub-rho" reduces exactly
    to H-PSEUDO (pseudorandomness of ECDLP solutions for structured inputs). This is
    a precise, falsifiable formulation of the remaining gap. Push PR with all work.

