coordinator_decision:
  id: DEC-20260726-004
  context: >-
    Spec-update task under DEC-20260726-001 next_actions. Produced version 2 of
    EXP-JMV-001 and EXP-JMV-004 specifications, and ruled on three questions raised by
    post-verdict scouting work (corrected c_pi conductor definition in cpi_audit.py; the
    integer-arithmetic Koblitz control; K-233/K-283 exact agreement; K-163 row inconsistency).
    Write scope was experiments/EXP-JMV-001/ and EXP-JMV-004/ only, so this record could not
    be persisted by the same task.
  decision: approve
  target_ids: [EXP-JMV-001, EXP-JMV-004]
  rationale:
    - >-
      Coordinator independently verified the conductor correction, the Koblitz Frobenius/Lucas
      construction, the K-163 derived trace (cross-checked against the recurrence mod 7, 8, 9),
      c_pi(K-163) = 1824026374634505274957943, and 86110311 = 3*7*367*11173. The K-233/K-283
      exact-match claims were NOT independently re-derived and remain scouting.
    - >-
      RULING 1: C1 still gates and is now STRONGER. K-163 shows a measured, nonzero digit-level
      defect rate in the transcription artifact (1 of 3 fully checkable rows). All residual
      uncertainty in the P-256 claim is transcription uncertainty; the arithmetic half is
      certain. The write-up's claim that the K-row match 'raises confidence in the P-256 result
      correspondingly' is OVERRULED.
    - >-
      RULING 2: K-163 is NOT a second finding of the same class. Its cause is internal to our
      artifact (a one-digit edit repairs it to exact consistency), so it is a C1 CONTROL RESULT,
      not a Figure 1 claim. It enters the DEC-20260726-003 gate only if C1 shows the source
      prints 86110311, and then as ONE joint claim with P-256, never as two replications. If C1
      passes, K-163 is the stronger certificate and becomes the headline row.
    - >-
      RULING 3: narrow to 10 attempted rows (5 NIST prime + 5 Koblitz); retain 7 binary rows by
      name as not_attempted. The row inventory is a controlled quantity under C1b. The correct
      reason is absence of input-validation and CM controls, not absence of arithmetic.
    - >-
      Corrected premise: 'c_pi is 81-285 bits so it factors completely' is false for K-409
      (~95-bit residual) and K-571 (~263-bit residual). Verification of a COMPLETE claimed
      factorization needs no factoring; those two rows have none and stay censored, level counts
      included.
  evidence_refs:
    - >-
      NONE. Nothing has been executed under a run record. cpi_audit.py output is SCOUTING per
      DEC-20260726-003 part D. No EV-* record exists for this suite.
  limitations:
    - This decision approves specification text only. No run, no evidence, no finding, no promotion.
    - >-
      The K-233/K-283 exact matches are unverified by the Coordinator and must be established by
      the run, not inherited.
    - >-
      DEC-20260726-003 part D remains in force: the Figure 1 and K-163 observations stay labelled
      SCOUTING in every document until the four-step gate completes.
  next_actions:
    - >-
      Persist this record as ledger/decisions/DEC-20260726-004.yaml and snapshot-commit it
      together with the two version 2 specs, touching only those declared paths. Nothing runs
      before that commit is verified.
    - >-
      Then dispatch EXP-JMV-004 branch (a) to the executor. Then EXP-JMV-001. Not concurrently in
      one worktree.
    - >-
      Issue a separate handoff (write scope: research/JMV2005_experiment_suite_20260726.md ONLY)
      fixing the stale c_pi definition at line 69, the overruled confidence sentence at line 110,
      the GOAL-ECDLP-001 attachment in the Sec. 3 heading, and the 'verified, un-reviewed'
      phrasing.
    - >-
      Reserve the C1 reviewer (must not have produced the transcription) and the independent run
      validator now, before either run reports.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No evidence record exists and nothing has been executed. This is a specification and
      ruling decision, not an evidence review, so there is no observation of any strength to
      promote. Promotion becomes possible only after reviewed, validated runs clear the
      DEC-20260726-003 four-step gate.
  decided_by: coordinator
  decided_at: "2026-07-26"
  persistence_note: >-
    Authored by the coordinator during the spec-update task, whose write scope was
    experiments/EXP-JMV-001/ and experiments/EXP-JMV-004/ only. Transcribed verbatim to this
    path by the top-level session so the ruling is durable; content is the coordinator's, not
    the session's. The doc-repair next_action listed above was carried out by the session on
    2026-07-26 in research/JMV2005_experiment_suite_20260726.md.
