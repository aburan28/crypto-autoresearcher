coordinator_decision:
  id: DEC-20260726-004
  context: >-
    Verified TASK-20260726-002 snapshot and independent TASK-20260726-003
    review of the H-IC-001 + EXP-IC-001 experiment design are complete. The
    review terminal verdict is REVISE with 5 blocking objections. No experiment
    was authorized or executed.
  decision: revise
  target_ids:
    - GOAL-ECDLP-001
    - BATCH-004
    - H-IC-001
    - EXP-IC-001
    - TASK-20260726-001
    - TASK-20260726-003
  rationale:
    - >-
      The core K* finiteness measurement (T_desc vs sqrt(N) at 28-36 bits) is
      sound and should be preserved.
    - >-
      REVISE is required because: (1) the rho calibration counts only walk
      steps, not all group ops, causing severe overhead bias at small bit
      sizes; (2) the S_rel heuristic overestimates by factor B (should be
      (N/B^{m-1})*T_desc for m=2); (3) the S*T^2 >= N frontier comparison is
      tautological given the incorrect S_rel; (4) S_rel is never measured
      empirically.
    - >-
      The repairs are specific: fix the calibration (count all group ops or
      time only the walk phase), correct S_rel to (N/B^{m-1})*T_desc or measure
      directly at 8-12 bits, and either make the frontier comparison empirical
      or drop it and focus on K* finiteness only.
    - >-
      GOAL-ECDLP-001 remains active with 2 batches remaining after this one.
  evidence_refs:
    - EV-ECDLP-006
  limitations:
    - No experiment or implementation was authorized or executed.
    - Review used an auditable glm-5p2 fallback; equivalence to review-xhigh not claimed.
    - The wall-time-to-group-op conversion is inherently implementation-bound.
  next_actions:
    - >-
      Repair EXP-IC-001 per the 5 blocking objections: (1) fix rho calibration
      to count all group operations or time only the walk phase; (2) correct
      S_rel to (N/B^{m-1})*T_desc or measure S_rel directly at 8-12 bits where
      decompositions exist; (3) drop the tautological S*T^2 frontier comparison
      or make it empirical; (4) preserve the K* finiteness measurement at
      28-36 bits; (5) re-review the repaired specification.
    - >-
      If the repair passes independent re-review, authorize execution of
      EXP-IC-001 as BATCH-005.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      EV-ECDLP-006 is preliminary theoretical review evidence over an
      experiment-design package. The review verdict is REVISE (not a proven
      result), and no durable content exists until the repaired protocol
      passes re-review and execution.
  decided_by: coordinator
  decided_at: "2026-07-26T12:30:00-07:00"
