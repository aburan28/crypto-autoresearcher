coordinator_decision:
  id: DEC-20260812-03fa10
  goal_id: GOAL-ARGON-001
  batch_id: BATCH-614f1d
  recorded_at: '2026-08-12'

  decision: supersede
  decision_type_rationale: >-
    Not support/weaken/reject_scoped: nothing has been tested (this batch
    authorized zero runs), so there is no tested Argon2 result to score in
    either direction. Not expand: nothing new is being admitted to
    /design-experiment by this decision; the surviving formalization still
    needs a formal IDEA-* ledger record minted before that can happen (see
    next_actions and limitations). Not approve/replicate/pause/revise alone:
    the single word that names the most consequential, state-changing act
    this decision performs is `supersede` -- ruling that
    TASK-20260809-4e04eb's proposal content supersedes IDEA-20260809-a915ea's
    for RQ-ARGON-141710 going forward -- so that is the recorded decision
    type, with the correction, the calibration-design ruling, and the
    follow-up handoff recorded as accompanying, separately-justified actions
    within the same reconciliation.

  context: >-
    GOAL-ARGON-001's next_action (set by DEC-20260809-8732e6, BATCH-09d69e)
    required, before any /design-experiment step: (1) reconciling
    TASK-20260809-4e04eb's DAG-structure proposal against all nine
    pre-existing RQ-ARGON-141710 sibling proposals; (2) correcting
    IDEA-20260809-a915ea's factually false dominated_by field; (3) retrying
    RFC 9106 acquisition via a raw-HTTP-capable route; (4) deciding the
    calibration design a future frozen experiment should adopt. This
    decision, opened as BATCH-614f1d, discharges all four. This Coordinator
    session has no Bash tool, so item (3) is discharged by WRITING (not
    executing) a follow-up Executor handoff, per this task's own explicit
    constraint.

  # =====================================================================
  # ITEM 1 -- RECONCILIATION ACROSS ALL NINE SIBLING PROPOSALS
  # =====================================================================
  reconciliation_ruling:
    method: >-
      All nine RQ-ARGON-141710 sibling proposals
      (IDEA-20260809-{a915ea,ac5947,ac98b5,b17238,b9e9cc,bcf891,bf5139,
      c059a7,c13b8b}) were read in full by this Coordinator, joined on
      question_id (not body-text grep, correcting the producer's original
      dedup-method defect that both independent reviews flagged), together
      with TASK-20260809-4e04eb's proposal.md, receipt.yaml, EV-ARGON-209ece,
      the Validator and Red Team reports, and DEC-20260809-8732e6.
    vs_a915ea:
      ruling: SUPERSEDE
      reasoning: >-
        Both records make the identical core claim -- build the actual
        Argon2 memory-access DAG at recommended parameters and measure
        whether its depth-robustness-relevant structure differs from an
        idealized/asymptotic comparator, rather than bounding the family
        asymptotically. 4e04eb is strictly more rigorous on every axis
        a915ea specifies: an explicit three-step mechanism vs. a general
        claim with no stated causal chain; a quantitative, two-tier
        falsification criterion (rho <= 0.5 confirms at every tested pair,
        rho >= 0.8 falsifies at any tested pair, [0.5,0.8) reported as
        partial) vs. no stated threshold of any kind; a genuine matched
        null-object control (G_unif, identical chain edges and window sizes,
        differing only in the within-window selection rule) vs. an
        undefined comparison to "the asymptotic argument"; a per-claim
        RECALLED-vs-verified ledger (Sec.3, C1-C7) independently spot-check
        confirmed accurate against the actual RFC 9106 text by the Validator
        vs. a915ea's own flat "RFC 9106 -- REQUIRED READ, NOT YET READ"; and
        an honest, hedged dominated_by vs. a915ea's now-confirmed-false one
        (CORR-20260812-1f7c9a). 4e04eb's own text already claims this
        supersession in content ("supersedes a915ea in content depth"), and
        both independent reviewers corroborate the content quality without
        finding it wanting on the merits (Validator: passed/
        pass_with_qualifications on internal consistency, mechanism,
        prediction, falsification, RFC-access honesty; Red Team: genuinely
        falsifiable, no escape hatch, no scope creep). This is a
        content-quality determination within this Coordinator's authority
        (AGENTS.md: "Only the Coordinator may change the official status of
        a hypothesis or research direction").
      scope_caveat: >-
        a915ea's claim text nominally covers "fixed (t, m, p)" without
        restricting itself to a single lane, while 4e04eb explicitly scopes
        to p=1 (Sec.5, a stated conservative simplification: cross-lane
        edges can only add bridging routes, never remove them). This is NOT
        read as blocking full supersession, because a915ea's own
        `minimal_test` field never actually commits to a multi-lane
        construction either ("Build the DAG for the data-independent
        variant at small (t, m)..."), so a915ea's own specified minimal
        content is no broader than 4e04eb's. The genuinely multi-lane-
        specific mechanism (lane-synchronization effects at p>1) is a
        915ea's downstream sibling IDEA-20260809-b9e9cc, not a915ea itself --
        nothing in a915ea's own actually-specified content is lost by this
        supersession.
      consequence_for_b9e9cc: >-
        b9e9cc's "SINGLE-LANE ANCHOR" falsification control currently
        requires its own p=1 measurements to "match those of
        IDEA-20260809-a915ea exactly." Once 4e04eb's content is formally
        filed as a ledger IDEA-* record (a future step, no ID currently
        allocated for it -- see limitations), b9e9cc's anchor should be
        re-pointed at that record instead of at a915ea. Named as forward
        guidance; b9e9cc itself is not edited by this decision and its
        content is otherwise sound and unaffected.
    vs_ac5947:
      ruling: STAND_ALONGSIDE
      reasoning: >-
        Not a competing formalization of the same claim. ac5947 is class
        `algorithm` (implements the published tradeoff attack; measures the
        achieved (computation, memory) reduction against an honest
        baseline); 4e04eb is class `measurement` like a915ea (graph
        topology only; explicitly "NO ATTACK," §5/§9 disclaim any
        algorithmic-complexity or attack-cost claim). ac5947's own mechanism
        field names a915ea by ID as the graph object it consumes
        ("recompute the rest on demand using the graph structure from
        IDEA-20260809-a915ea"). Once 4e04eb's content becomes the surviving
        record per the ruling above, ac5947's dependency should be
        understood as resting on 4e04eb's more specific, null-controlled,
        RFC-verified DAG construction rather than a915ea's unsourced sketch
        -- a strictly stronger foundation, not a conflicting one. No content
        in either record duplicates the other. Sequential, feeding
        relationship preserved and strengthened, not merged.
    vs_remaining_seven:
      ruling: STAND_ALONGSIDE (all seven; no edits, no status change)
      reasoning: >-
        ac98b5 (frontier boundary), b17238 (three-variant tradeoff/leakage
        comparison), and bf5139 (hardware-aware AT cost model) are all
        downstream of ac5947 -- attack-cost-consuming records structurally
        unaffected by a measurement-only reconciliation. c059a7 (ratio
        surface) and c13b8b (queryable artifact) are downstream of "the
        whole goal" and likewise unaffected. bcf891 (calibration control) is
        addressed separately and in depth under item 4 below -- it stands
        alongside as a precondition/dependency, not a competing
        formalization, and is not merged or superseded. b9e9cc (parallelism/
        lane effect) is the one sibling requiring a forward note (its
        SINGLE-LANE ANCHOR control), covered above under vs_a915ea. None of
        the six not otherwise discussed propose the same core claim as
        4e04eb (graph-topology-only, null-controlled, single-lane
        depth-robustness ratio), so none require supersession or merging.

  # =====================================================================
  # ITEM 2 -- a915ea DOMINATED_BY CORRECTION
  # =====================================================================
  dominated_by_correction: >-
    Filed as CORR-20260812-1f7c9a, correcting IDEA-20260809-a915ea's
    dominated_by field by reference (a915ea itself is not edited, per
    AGENTS.md rule 4's immutability). Independently re-verified a third
    time by this Coordinator directly (Glob confirmed all eight KN-LIT files
    exist under knowledge/literature/; two read in full -- KN-LIT-3385,
    KN-LIT-494 -- confirming they are genuinely memory-hard-function-related,
    not index artifacts) before accepting the producer's and Validator's
    prior confirmations. See CORR-20260812-1f7c9a for the full correction.

  # =====================================================================
  # ITEM 3 -- RFC 9106 ACQUISITION (WRITTEN, NOT EXECUTED)
  # =====================================================================
  rfc9106_followup: >-
    TASK-20260812-273630 is written as a follow-up handoff directing the
    Executor to fetch RFC 9106 via raw HTTP (curl or equivalent) -- the
    route TASK-20260809-28c68e's Validator demonstrated works in this
    environment where WebFetch/WebSearch does not -- and to file it as a
    KN-LIT primary source once obtained. This item is explicitly NOT marked
    done: the handoff is written and dispatch-ready, but this Coordinator
    session has no Bash tool and did not and cannot execute it. RFC 9106
    remains unfiled as a formal primary source; every algorithm-level detail
    this goal relies on stays RECALLED, independently spot-check-confirmed
    but not yet a program-filed citation.

  # =====================================================================
  # ITEM 4 -- CALIBRATION DESIGN FOR ANY FUTURE FROZEN EXPERIMENT
  # =====================================================================
  calibration_design_ruling: >-
    ADOPT IDEA-20260809-bcf891's independent-known-family calibration design
    in place of, or in addition to, the self-referential small-q exact/ILP
    cross-check sketched in TASK-20260809-4e04eb's proposal.md Sec.6 step 6
    (inherited unchanged from a915ea's own weaker calibration gap). bcf891
    validates the SAME measurement pipeline against graphs with
    INDEPENDENTLY KNOWN depth-robustness properties (a proven depth-robust
    family and a deliberately shallow family), bounding the greedy
    eps-depth-reducing-set heuristic's error in both directions BEFORE any
    Argon2-graph number is trusted. This is strictly stronger than
    cross-checking greedy vs. exact/ILP only on the two graphs already under
    test (G_real, G_unif), which bounds only "how much do THESE two graphs
    differ between greedy and exact," not "is the greedy heuristic
    systematically biased in a direction that corrupts every reported rho."
    Both independent reviewers converged on this same recommendation without
    prompting: the Validator's unresolved_confounds names it explicitly
    ("Whether comparing against known-depth-robust/known-shallow calibration
    families ... changes confidence in any future rho measurement is
    untested"), and the Red Team's required_controls goes further, sketching
    the concrete adoption plan (run bcf891's two reference families at the
    same small q used for the self-referential cross-check, BEFORE building
    the real Argon2 topology, since it is strictly cheaper -- no
    G-evaluations, no RFC 9106 read required). This is also directly
    required by CLAUDE.md's dispatch-bias rule: "Dispatch a conditional
    result only paired with a heuristic-validation experiment in the same or
    the following batch." 4e04eb's mechanism already names validation routes
    for its two numbered heuristics (H1, H2), but the measurement PIPELINE's
    own correctness (the greedy heuristic itself) has no independent
    validation without bcf891's calibration -- it is not optional polish,
    it is the pipeline-correctness precondition the target-result-profile
    rule requires before any rho result is dispatched as informative.
    Binding on whichever future /design-experiment step operationalizes the
    surviving formalization: freeze bcf891's calibration as a REQUIRED
    precondition experiment or control, not an optional add-on.

  evidence_refs:
    - EV-ARGON-209ece

  target_ids:
    - GOAL-ARGON-001
    - RQ-ARGON-141710
    - TASK-20260809-4e04eb
    - IDEA-20260809-a915ea
    - IDEA-20260809-ac5947
    - IDEA-20260809-ac98b5
    - IDEA-20260809-b17238
    - IDEA-20260809-b9e9cc
    - IDEA-20260809-bcf891
    - IDEA-20260809-bf5139
    - IDEA-20260809-c059a7
    - IDEA-20260809-c13b8b
    - CORR-20260812-1f7c9a
    - TASK-20260812-273630
    - TASK-20260812-e46d24
    - BATCH-614f1d
    - DEC-20260809-8732e6

  rationale:
    - >-
      Rule 15 (AGENTS.md) and this Coordinator's own decision-checklist
      duty to answer "what exact uncertainty will this reduce" before
      acting: the uncertainty this batch reduces is whether the program
      carries two independent, non-identical treatments of "measure the DAG
      first" with no reconciliation (a915ea's original sketch and 4e04eb's
      more rigorous reformalization). Ruling supersession explicitly,
      citing the specific rigor deltas, removes that ambiguity without
      editing any immutable record.
    - >-
      Both independent reviews (Validator TASK-20260809-28c68e, Red Team
      TASK-20260809-a0f79c) reached the same substantive conclusions this
      decision now formalizes: that 4e04eb's content is admissible and adds
      real rigor over a915ea specifically, that it does not resolve its
      relationship to ac5947/bcf891 on its own, and that bcf891's
      calibration is the stronger control. This decision does not invent a
      new determination; it makes the determination both reviews explicitly
      deferred to the Coordinator.
    - >-
      Correcting a915ea's dominated_by field by reference (rather than
      leaving a known-false claim standing) is required by AGENTS.md rule 5
      (no fabricated claims) and the inventor protocol's Pareto-honesty
      duty, independently of any supersession ruling -- the correction
      stands on its own regardless of a915ea's future status.

  limitations:
    - >-
      No new ledger IDEA-* record was minted for TASK-20260809-4e04eb's
      content in this decision. This Coordinator has no allocated ID for
      one (the task's constraints permit only TASK-20260812-e46d24,
      DEC-20260812-03fa10, CORR-20260812-1f7c9a, and TASK-20260812-273630).
      The supersession ruling above governs which content is authoritative
      going forward; formally promoting 4e04eb's proposal into an IDEA-*
      ledger record (with its own freshly-stated dominated_by, per proposal.md
      Sec.11) remains a separate, not-yet-executed step, named in
      next_actions.
    - >-
      IDEA-20260809-ac98b5, -b17238, -b9e9cc, -bcf891, -bf5139, -c059a7, and
      -c13b8b are not edited by this decision; only a915ea's dominated_by
      field is corrected (CORR-20260812-1f7c9a), by reference, and no other
      sibling's content is altered.
    - >-
      RFC 9106 remains unfetched and unfiled as a KN-LIT primary source;
      TASK-20260812-273630 is written, not executed, per this task's
      explicit budget constraint (no Bash tool available to this Coordinator
      session).
    - No hypothesis or experiment status changes; GOAL-ARGON-001's active_hypothesis_ids remains empty.
    - >-
      This decision, its correction record, and its two handoffs are NOT
      YET COMMITTED. Per this task's explicit instruction, no commit is
      performed here; a Coordinator snapshot-then-ledger archive is a
      required separate step before any of this reconciliation is durable
      or official (AGENTS.md "Durable research commits").

  next_actions:
    - >-
      Mint a new IDEA-* ledger record (via `tools/allocate_id.py --next
      idea --area ARGON`, then `--check` before use) that formally files
      TASK-20260809-4e04eb's proposal.md content as the surviving,
      superseding RQ-ARGON-141710 record, with its own freshly-stated
      dominated_by (proposal.md Sec.11's honest hedge, not a915ea's
      corrected text inherited uncritically).
    - >-
      Once that record exists, re-point IDEA-20260809-b9e9cc's SINGLE-LANE
      ANCHOR falsification control at it instead of at a915ea.
    - >-
      When a frozen /design-experiment step is designed for this
      hypothesis, freeze bcf891's independent-known-family calibration as a
      REQUIRED precondition control in the same or the following batch, per
      calibration_design_ruling above.
    - >-
      Dispatch TASK-20260812-273630 to the Executor: fetch RFC 9106 via
      curl/raw HTTP and file it as a KN-LIT primary source, before any
      frozen experiment reads RFC 9106 as verified rather than RECALLED.
    - >-
      Commit this batch's records (this decision, CORR-20260812-1f7c9a,
      both handoffs, the updated goal head, and the BATCH-614f1d task
      card/receipt) via the standard Coordinator snapshot-then-ledger
      archive sequence; this task does not commit.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No experiment has run under this goal (runs_authorized: 0 throughout
      both BATCH-09d69e and BATCH-614f1d) and no evidence record of strength
      `replicated` or `strong` exists to promote from. This decision is a
      reconciliation-and-scheduling determination over existing proposals,
      not a tested finding about Argon2; EV-ARGON-209ece (the only evidence
      record this decision cites) is itself `preliminary` strength, below
      the promotion floor.

