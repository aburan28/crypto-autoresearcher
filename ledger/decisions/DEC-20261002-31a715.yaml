  process_finding:
    blame: none
    finding: >-
      Both passes followed the documented visibility rules. CLAUDE.md and AGENTS.md direct a
      session to fetch and read origin/main, the merge digest, lane files, claims across refs
      (research_dispatch.py --claims refs) and the bus. None of these surfaces a revision that
      sits only in an unmerged PR branch's diff, and a dispatch-card revision writes no claim of
      its own. PR #1515's epoch-4 release was visible to the 2026-10-02 pass and was recorded
      there. Its outcome `abandoned` and its note concern the attempted /run, not the card
      revision committed minutes earlier, so the claims overlay could not reveal the revision.
      PR #1607's revision was likewise invisible to PR #1515, which came first. The duplication
      came from a gap in what the rules make visible, not from a rule being skipped.
    secondary_fact: >-
      DEC-20261001-4076d1 revised the queue by hand rather than through build_queue.py as NA-3
      specified, and it stated why (card_revision.method: "build_queue.py is one-shot and was
      NOT re-run (header forbids overwrite of recorded state)"). As a result, main's builder no
      longer reproduced main's queue until Part A encoded the hand edit. Recorded so a later
      reader knows why PR #1515's blocks are encoded verbatim. No fault is assigned, and the
      hand edit's content is authoritative.
    recommendation_only: >-
      One cheap check before revising any dispatch card: list the open PRs whose diff touches the
      same dispatch_queue.json or its build_queue.py (for example `gh api
      repos/<owner>/<repo>/pulls` and then each PR's `/files`), and read any match before
      writing. This is a RECOMMENDATION, not a rule. Adopting it would mean a change to the
      coordinate skill or AGENTS.md under its own record. This decision does not make that change.

  rationale:
    - >-
      The user directed the shape of the reconciliation (authority to PR #1515; keep this
      branch's work only where it adds checks; a new decision explaining the overlap). This
      record applies that direction item by item, and every item is checkable against
      build_queue.py.
    - >-
      Keeping restatements would not change what the executor must do, but it would double the
      surface on which two wordings of one requirement can drift. Dropping them costs nothing
      the card needs, because every dropped entry quoted a requirement the 2026-10-01 entries
      bind by reference to the same amendment, which is in read_scope.
    - >-
      The kept entries each close a real gap: the side-naming rule, the second-witness and
      no-expected-outcome rules, a disclosure the reviewers can see, and a hard stop against
      out-of-band material. Each is a requirement that, missing at run time, cannot be supplied
      afterwards from the M-3 series or the report.
    - >-
      A card defect and its repair are not mathematical results. Nothing here is evidence about
      Lemma 4, Proposition 5, Assumption 1, any d_F or d'_F value, or any curve.
