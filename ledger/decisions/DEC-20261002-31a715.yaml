  s1reason_ruling:
    ruling: >-
      AMD-EXP-SEMBIN-4fa22c-20261002-s1reason STANDS as a committed protocol amendment, and its
      annotation, printed verbatim directly after S-1's frozen sentence, IS THE FORM THE S-1
      TENSION DISCLOSURE REQUIRED BY DEC-20261001-4076d1 TAKES. The disposition of the S-1 flag
      is DEC-20261001-4076d1's: S-1 stands as frozen, the tension is disclosed, the criterion is
      not amended. The two records are not rival dispositions. One rules what must happen; the
      other fixes the words in which it happens and makes them visible to reviewers. The
      executor may add, after the annotation and in its own words, anything the disclosure
      requires that the annotation omits, and never edits the annotation (card, K-IN-5).
    reasons_from_DEC_20261001_4076d1:
      - >-
        Its ruling requires the executor to satisfy S-1 "exactly as written ... (including the
        reason text)". The amendment's what_is_unchanged keeps S-1's sentence "exactly as
        frozen" and its verdict "PASS or FAIL on that frozen text and on nothing else".
      - >-
        Its disclosure has two parts: the reason's premise "is recorded refuted at the
        contract's declared equality convention by L-1 / EV-SEMBIN-1ca3c8", and S-1's
        conclusion "also rests on DC-1's structural-blindness argument, which L-1 does not
        touch". The annotation states the first ("Its premise is recorded REFUTED as a universal
        statement at this contract's declared equality convention ... (... L-1;
        EV-SEMBIN-1ca3c8)") and the second ("This report's statement that it cannot refute
        Proposition 5 is also the content of design constraint DC-1, which does not cite Lemma
        4").
      - >-
        It forbids "a rewrite of S-1" and "a soft annotation that replaces S-1's frozen
        wording". The amendment rewrites nothing and replaces nothing. It prints after the
        frozen sentence, and its absence is "a defect against this amendment", "NOT turned into
        an S-1 FAIL".
      - >-
        Its "Does not create a protocol_amendment" (what_this_does_not_do) describes its own act.
        It does not forbid a later amendment. Its preference_basis reads DEC-20260928-3f71c4
        NA-3 as preferring "stands frozen with tension disclosed". NA-3's text, read here, names
        the two routes as alternatives without ranking them. Nothing in this ruling turns on that
        reading, because the two routes are combined here rather than chosen between.
    reasons_from_AMD_EXP_SEMBIN_4fa22c_20261002_s1reason:
      - >-
        It changes no verdict rule, criterion, arm, metric, control, stopping rule, budget or
        maximum_runs (does_not_rewrite_note). So it cannot conflict with a ruling that S-1
        stands frozen.
      - >-
        Each sentence of the annotation is sourced to a committed record
        (sources_of_each_sentence_in_the_annotation), and its what_this_clause_does_not_assert
        "does not decide whether S-1's conclusion survives without its printed reason", which is
        the same restraint as DEC-20261001-4076d1's "Does not evaluate whether S-1's conclusion
        survives its reason beyond requiring the disclosure".
      - >-
        It puts the disclosure where the reviewers of REVIEW-SEMBIN-20260916-cbb416 read, which
        is experiments/EXP-SEMBIN-4fa22c/ and not the executor card (its why_this_amendment_exists;
        DEC-20261002-4242bd R-2). A disclosure that lives only on the card binds the executor and
        no one else. That is the check this branch adds, and why K-CO-8 and K-CG-6 are kept.
    one_wording_difference_named: >-
      DEC-20261001-4076d1 says DC-1's argument is one "which L-1 does not touch". The annotation
      says DC-1 "does not cite Lemma 4". Since L-1 is a statement about Lemma 4, the second
      implies the first, but the words differ. Under the authority ruling the 2026-10-01 wording
      governs, and the card already lets the executor add that clause in its own words after the
      annotation. Recorded, not resolved further here.
    asserts_nothing_about: >-
      Whether S-1's conclusion survives without its printed reason, Lemma 4, Proposition 5, any
      d_F or d'_F value, or any curve. Tension T-1 of AMD-EXP-SEMBIN-4fa22c-20260921-lemma4 is
      untouched.

