  resume_condition_disposition:
    applied_exactly_as_written: >-
      THE CONDITION IS APPLIED AS WRITTEN AND IS NOT WIDENED, NARROWED OR RE-READ.
      Carried verbatim from DEC-20260729-002 NA-1: "If the replicated mean is
      within about 0.14 SEM of zero, the shift is recorded as chance and closed.
      If it reproduces above about +0.25 SEM, the driver, the numpy build and the
      platform become the objects of the next control. NO CONCLUSION ABOUT THE
      PROCESS IS DRAWN FROM IT EITHER WAY, and no conclusion about decomposition
      yield is drawn from it in any case."
    branch_selected: >-
      BRANCH 2, AND IT IS ARITHMETIC. Under PDC-14's recorded unit convention -
      0.14 and 0.25 in the units of the z_sem statistic itself, not multiples of
      the 0.1466905 standard error of the 48-tuple mean - the realised
      0.3336976784 is above +0.25 and selects the second branch.
    the_unassigned_interval_was_not_exercised: >-
      The realised value does not fall in the interval between about 0.14 and
      about 0.25 SEM that NEITHER branch names, so the pre-committed
      inconclusive-region clause was not exercised. It was correctly pre-committed
      before the number existed, at BND-5 and in the contract's own
      resume-condition block, and had the value landed there this record would have
      said so plainly and recorded the outcome as INCONCLUSIVE ON THE SHIFT rather
      than assigning it to the nearer branch. That the clause did not fire is
      recorded so the honest pre-commitment is on the record either way.
    the_branch_2_consequence_in_NA_1s_own_words_and_no_stronger: >-
      THE DRIVER, THE NUMPY BUILD AND THE PLATFORM BECOME THE OBJECTS OF THE NEXT
      CONTROL. That is the whole of the pre-registered consequence and this record
      writes nothing stronger. The controls that would discharge it are named -
      RC-38-A, K independent master seeds through the same driver, and RC-38-B, a
      different bit-generator family - and BOTH ARE DELIBERATELY NOT REQUESTED,
      because neither clears RULE-BATCH013-SCOPE. Under that ruling this lineage is
      closed to further replication and control-on-a-control batches regardless of
      outcome, so branch 2's "next control" is NAMED AND FORECLOSED rather than
      scheduled, and that is recorded plainly rather than left to be discovered.
    what_is_not_concluded: >-
      NO CONCLUSION ABOUT THE PROCESS IS DRAWN FROM THE REPLICATED STATISTIC IN
      EITHER DIRECTION, and no conclusion about decomposition yield is drawn from
      it in any case. NO RECORD PRODUCED BY THIS BATCH SAYS THAT THE SHIFT IS A
      PROPERTY OF THE RECORDED DRIVER, BUILD OR PLATFORM.
    probability_of_the_realised_branch_recorded_beside_it: >-
      RECORDED BECAUSE IT CUTS AGAINST THE STRONGER READING. The BATCH-013
      observation feasibility table puts P(branch 2) at about 0.044 under a centred
      replication, and RT31-9 corrects that to about 0.06 under the package's own
      declared centre of about +0.03. A BRANCH THAT FIRES ABOUT ONE TIME IN TWENTY
      UNDER THE NULL CANNOT CARRY A TERMINAL POSITIVE ATTRIBUTION. Realising it is
      at most weak evidence.

  the_ruling_on_what_the_shift_is:
    ruling: >-
      IT IS NOT ESTABLISHED AS ANYTHING. On the committed record it is a SECOND
      UPPER-TAIL DRAW of a statistic whose null this program has now calibrated
      twice, and NO LOCUS FOR A DETERMINISTIC COMPONENT SURVIVES INSPECTION. The
      disposition is `inconclusive` on the mechanism and CLOSED on the chase.
    the_sentence_this_decision_writes: >-
      The replicated 48-tuple z_sem mean of 0.3336976784 is an upper-tail draw of a
      statistic whose expectation under the specified process is bounded above by
      about 0.04 by derivation and whose fixed-bins-offset alternative is excluded
      by this batch's own high-precision block; no locus for a deterministic
      component has been identified, none is asserted, and this lineage is closed.
    the_case_for_a_real_deterministic_offset_stated_first_and_not_softened: >-
      BECAUSE IT IS THE STRONGER-LOOKING SIDE. Two draws under disjoint master
      seeds both land about 2.2 design standard errors above the expectation the
      committed package itself declares. The BATCH-012 validator's 400-repetition
      Monte Carlo of the whole design put the first at P = 0.0100 plus or minus
      0.0050. The declared second-order biases account for at most 0.0895 SEM and
      realised 0.02638 SEM on average, an order of magnitude short. PP-1 removes
      variation among three interpreter builds and two numpy versions from the
      candidate list. On those facts a fixed additive component is the natural
      reading, and if it existed it would be a term nobody in this lineage has
      derived.
    ground_1_the_agreement_argument_is_empty_and_it_was_the_coordinators_own: >-
      ADOPTED IN FULL AND RECORDED AGAINST THIS PROGRAM RATHER THAN IN ITS FAVOUR.
      Under a fixed-offset hypothesis and under the chance hypothesis alike the two
      draws come from the same law, so they agree within their combined error with
      the same probability and THE LIKELIHOOD RATIO CONTRIBUTED BY THE DIFFERENCE
      OF THE TWO MEANS IS APPROXIMATELY 1. Agreement is not evidence here. ALL THE
      EVIDENTIAL CONTENT IS IN THE LEVEL, and the level is ONE fresh one-sided
      excursion at about p = 0.017. The sentence that made the opposite argument is
      in the Coordinator's own TASK-20260729-036 receipt and is superseded at
      SUP-BATCH013-B.
    ground_2_the_first_observation_is_selected_and_the_two_p_values_may_not_be_multiplied: >-
      The statistic was a POST-HOC TAIL-CHECK OBSERVATION of EXP-YIELD-002,
      outside all four of that contract's criteria, noticed because it was extreme,
      from a menu that also held the z_sd mean, n_neg, three tail counts, the
      maximum, the per-arity means and the delta_z vector. MULTIPLYING 0.010 BY
      0.017 AND REPORTING 1.7e-4 WOULD TREAT A SELECTED STATISTIC AS IF IT HAD BEEN
      NAMED IN ADVANCE, and no honest joint probability is computed here.
    ground_3_the_mathematics_cannot_host_a_term_of_this_size_and_that_is_a_derivation: >-
      For P-REPAIRED the exact mean M = N - (1 - s/N)[(N-1)(1-2/N)^(C_red/2) +
      (1-1/N)^(C_red/2)] is a theorem, re-derived three times in this lineage and
      not disputed. Then E[z_sem] = (M - P_pred) E[1/sem_rep] + E[(mu_rep -
      M)/sem_rep]. The first term is bounded by the committed package's own
      declared envelope at at most 0.0801 in SEM units at any of the 48 tuples and
      0.0262 on average, with the Jensen factor at most 1 + 3/(4 n_rep) and so at
      most 1.0083 here. The second is the classical skewness bias of the one-sample
      t statistic, -gamma_1/(2 sqrt(n_rep)) + O(1/n_rep); the distinct-bin count is
      left-skewed at these parameters so the term is POSITIVE, at most 0.088 at the
      most extreme tuple T-18-2-B34 and 0.012 averaged over the 48. THE TOTAL
      EXPECTATION IS OF ORDER +0.04, AND THERE IS NO THIRD ANALYTIC TERM AVAILABLE
      TO CARRY +0.30. This reproduces, independently and at greater generality, the
      finding RT-20260729-021 recorded at RT21-6.
    ground_4_the_last_code_locus_is_excluded_by_this_batchs_own_committed_data: >-
      AND NOBODY HAD READ IT. A defect producing a FIXED OFFSET IN BINS scales in
      SEM units as sqrt(n_rep)/sd, so an offset large enough to give about +0.31
      SEM at the primary schedule must give between +2.5 and +5.6 SEM at 10,000
      replicates at the ten block tuples. PDC-9 expressly preserves that quantity -
      the deviation of the REPAIRED leg from the EXACT ANALYTIC MEAN in
      standard-error units - as recomputable from OM-8 and OM-9, and it is NOT the
      prohibited repaired-minus-as-recorded difference column. The ten realised
      values are 0.501, -0.393, -0.686, 1.305, 1.224, -0.682, -0.723, 0.781, 0.096
      and 1.829, mean 0.325 and sd 0.941 as RT-20260729-031 computed them. The
      dispatching Coordinator session recomputed all ten independently from the
      committed rows, reproduced them exactly, and obtained a mean of +0.3251
      against a null standard error of 0.3162, that is 1/sqrt(10) for ten
      standardized deviations - ABOUT 1.0 STANDARD ERROR FROM ZERO, CONSISTENT WITH
      ZERO AND DECISIVELY INCONSISTENT WITH A FIXED BINS OFFSET. The same control
      was run by RT-20260729-021 on the committed EXP-YIELD-002 block; this batch
      reproduced it on a block that is no longer a deliberately selected all-m = 3
      subset, with DEV-4 repaired and the legs independently seeded.
    the_two_limbs_are_not_symmetric_and_the_bases_differ: >-
      THE MATHEMATICS LIMB IS CLOSED BY DERIVATION. THE CODE LIMB IS CLOSED
      EMPIRICALLY, for any defect of the fixed-bins-offset kind, by the package's
      own ten-tuple 10,000-replicate block. THE BUILD LIMB IS NARROWED BY PP-1 AND
      NOT CLOSED. The declaration of which basis carries which limb is recorded in
      EV-ECDLP-010's `proof_status_declaration`, and misdeclaring either would be
      the undeclared-basis failure.
    the_residue_named_because_naming_it_is_the_job: >-
      WHAT IS NOT CLOSED ON THE COMMITTED RECORD IS A DEFECT PROPORTIONAL TO
      sem_rep - one producing the same offset in SEM units at 100 replicates and at
      10,000. NO SUCH DEFECT HAS BEEN NAMED, NO MECHANISM FOR ONE HAS BEEN
      PROPOSED, AND THIS RECORD PROPOSES NONE. It is UNEXCLUDED, not excluded.
      RT31-3's residue - a property shared by every tested numpy version - is
      likewise unexcluded. THAT NO DETERMINISTIC COMPONENT HAS BEEN LOCATED IS NOT
      A PROOF THAT NONE EXISTS, nothing here is an impossibility claim, and a later
      session that finds a mechanism is not contradicting this record.
    the_separating_control_is_named_and_not_requested: >-
      RC-38-A IS THE ONE DISCRIMINATING CONTROL, IT CANNOT COME OUT AMBIGUOUS, AND
      IT IS DELIBERATELY NOT REQUESTED. It would re-execute the primary 48-tuple
      arm under K fresh pairwise-disjoint master seeds changing NOTHING ELSE and
      report the empirical distribution of the 48-tuple z_sem mean - its centre,
      its sd, and the empirical exceedance probabilities at 0.3336976784 and at
      0.3610236850 - and at K = 120 it is a few minutes of curve-free wall clock.
      IT DOES NOT CLEAR RULE-BATCH013-SCOPE's BAR, which closes this lineage to
      replication and control-on-a-control batches regardless of outcome and
      reserves exactly one item as able to justify a batch. If it is ever run it
      belongs as a SUBORDINATE CALIBRATION ARM of a DEFER-BATCH013-001 batch and
      NEVER as the primary subject of a batch of its own.

  the_dissent_recorded_and_not_smoothed:
    who: RT-20260729-031, TASK-20260729-038, the independent red-team session.
    from_what: >-
      FROM THE STOPPING RULE'S REASONING AND NOT FROM ITS CONCLUSION. The red team
      accepts the foreclosure of RC-38-A and RC-38-B on the evidence, states that
      the acceptance is REASONED RATHER THAN COMPLIANT, and would not accept it if
      the question were open.
    the_dissent_verbatim: >-
      "I record one dissent from the stopping rule's reasoning rather than its
      conclusion: the rule justifies closure by FIAT, and closure is in fact
      justified by EVIDENCE. Those are different, and a rule that would have closed
      the question equally firmly had the evidence pointed the other way is not the
      reason the question is closed."
    coordinator_disposition: >-
      THE DISSENT IS ACCEPTED AS CORRECT AND IS NOT ANSWERED AWAY, NOT SOFTENED
      AND NOT RECORDED AS OUTVOTED. It is right about this Coordinator's own
      ruling. RULE-BATCH013-SCOPE was recorded in the opening commit before any
      outcome was known, precisely so that a favourable or an awkward result could
      not reopen it, and that pre-commitment is exactly what makes it a FIAT
      closure: it would have bound identically had the evidence pointed the other
      way. THIS RECORD THEREFORE STATES THE OPERATIVE GROUND EXPLICITLY. The chase
      is closed BECAUSE THE EVIDENCE CLOSES IT - the exact process mean is a
      theorem, the residual expectation is bounded above by about 0.04 by a
      derivation any session can re-run, and the package's own ten-tuple
      10,000-replicate block excludes a fixed bins-level offset. The rule's
      independent foreclosure is recorded as a SEPARATE AND WEAKER GROUND that
      binds regardless, and it is not the reason.
    what_the_dissent_does_not_do: >-
      It does not block this decision, and it is not a DISSENT within the meaning
      of AGENTS.md's goal-closure quorum, which is not in play: no completion
      criterion is met, no closure is sought, and NO CLOSURE QUORUM IS CLAIMED OR
      CLAIMABLE.

  red_team_objection_dispositions:
    disposition_statement: >-
      ALL ELEVEN OBJECTIONS ARE DISPOSITIONED AND NONE IS SILENTLY DROPPED. The
      three BLOCKING items and the three MAJOR items are ADOPTED IN FULL, because
      on the merits every one of them is correct and three of them correct
      statements this Coordinator had already propagated into immutable artifacts.
      The four MINOR and one INFORMATIONAL items are each accepted with the action
      each implies. All four required controls are dispositioned below.
    RT31-1:
      severity: BLOCKING
      disposition: ADOPTED IN FULL
      finding: >-
        The BATCH-013 queue WIDENED branch 2 of the pre-registered resume
        condition. DEC-20260729-002 NA-1 names the OBJECTS OF A FUTURE CONTROL;
        the queue's stopping rule restates the same branch as a POSITIVE
        ATTRIBUTION recorded as a TERMINAL FINDING. Those are different statements.
      why_the_widened_form_is_now_unwritable: >-
        Its BUILD limb is contradicted by PP-1 INSIDE THIS BATCH. Its DRIVER limb
        is unsupported and is in fact contradicted by the high-precision block. Its
        PLATFORM limb was never tested and BND-3 forbids claiming it. And its
        disjunction - chance or driver-build-platform - OMITS THE OPTION THE
        EVIDENCE ACTUALLY SUPPORTS, an upper-tail draw of a correctly calibrated
        null. The widening was recorded before the outcome and is not alleged to be
        outcome-driven; it is nonetheless unwritable.
      action: >-
        THE SENTENCE IS NOT WRITTEN. This decision records the branch-2 consequence
        in NA-1's OWN WORDS and no stronger, at
        resume_condition_disposition.the_branch_2_consequence_in_NA_1s_own_words_and_no_stronger,
        and supersedes the queue's stronger restatement ON THIS POINT ONLY at
        SUP-BATCH013-F. The rest of RULE-BATCH013-SCOPE, including its stopping
        rule, is carried into this ledger unchanged.
    RT31-2:
      severity: BLOCKING
      disposition: ADOPTED IN FULL
      finding: >-
        The subject line of commit 6921e716 states a DISPOSITION that ST-4 reserved
        for TASK-20260729-037, TASK-20260729-038 and this decision, while the body
        of the same message states that the run package states no disposition and
        neither does the message. THE MESSAGE CONTRADICTS ITSELF, and the subject
        line is the part a reader sees first and a log renders alone.
      scope_of_the_fault: >-
        THE RUN PACKAGE IS CLEAN. All eleven committed artifacts observe ST-4;
        results.json and summary.json carry explicit
        `resume_condition_not_applied_here` and ST-4 no-interpretation blocks and
        write no branch. The fault is the Coordinator's, in the commit message and
        at one remove in the TASK-20260729-036 receipt.
      action: >-
        Immutable and therefore SUPERSEDED, NEVER EDITED. See SUP-BATCH013-A. The
        committed z_sem mean is an OBSERVATION; the disposition is taken here and
        nowhere earlier.
    RT31-3:
      severity: MAJOR
      disposition: ADOPTED IN FULL
      finding: >-
        `The interpreter build and the numpy version are EXCLUDED as sources of the
        shift` is stronger than PP-1 establishes, and stronger in exactly the
