  scope_ruling_carried_into_the_ledger:
    id: INT-BATCH013-K
    why_it_is_here: >-
      RULE-BATCH013-SCOPE IS A COORDINATOR DECISION AND IS RECORDED AS ONE. It was
      recorded in the BATCH-013 opening commit, BEFORE any outcome was known,
      precisely so that a favourable or an awkward RC-21A result could not reopen it.
      UNTIL IT IS CARRIED HERE IT IS A COORDINATION RECORD AND NOT A LEDGER DECISION;
      IT IS CARRIED HERE.
    the_ruling: >-
      BATCH-013 IS RC-21A ALONE. NO SECOND TRACK WAS OPENED.
    the_concern_accepted_and_not_argued_away: >-
      STATED FIRST AND NOT SOFTENED, AS THE QUEUE STATES IT. BATCH-011 measured a
      census that VOIDED. BATCH-012 built one contract, amended it TWICE including a
      declared deviation from a pre-registered execution gate, and ran a curve-free
      simulation certifying the CONTROL. Neither moved the yield question and
      neither moved a hypothesis. BATCH-013 IS THEREFORE THE THIRD CONSECUTIVE BATCH
      OF INSTRUMENT MAINTENANCE, and that is recorded as a COST of the ruling rather
      than as a feature of it.
    the_ground_on_which_a_second_track_was_refused: >-
      G-1 THE BEST CANDIDATE DOES NOT FIT AND SAYING IT FITS WOULD BE THE
      FABRICATION: DEFER-BATCH009-001's EXP-STR-004 replication is the only carried
      obligation in this ledger that can move the goal's sole active hypothesis, and
      it has NO contract in experiments/ and an unresolved SageMath-dependent solver
      question, so it would require a freeze, a pre-execution review, an execution
      and two post-execution reviews of its own - the whole nine-card shape a second
      time - and could return infrastructure signal rather than a measurement and
      burn the batch. IT IS RANKED FIRST FOR THE SUCCESSOR BATCH, NOT DISCARDED.
      G-2 THE CANDIDATES THAT DO FIT WOULD NOT DISCHARGE THE CONCERN:
      DEFER-BATCH012-002 and DEFER-BATCH012-003 are cheap and genuinely outside this
      lineage, and both are SCREENS; adding either would have produced a fourth batch
      that moves no hypothesis and no exponent while doubling the failure surface,
      and filling capacity with a screen because a screen is what fits is inventing a
      direction to fill capacity, which agents/coordinator.md forbids.
      G-3 THE MEASURED FAILURE RATE OF A TWO-TRACK BATCH IN THIS PROGRAM: BATCH-012
      carried ONE track and still needed THREE pre-execution reviews, TWO versioned
      amendment cycles and a declared deviation from its own cycle cap, inside a
      budget the user raised BY EXACTLY ONE.
      G-4 THE ARCHIVAL DISCIPLINE IS THE OTHER HALF OF G-3: a second track adds two
      more serialized snapshot commits, each a place where a BATCH-010-class
      declared-versus-committed mismatch happens.
      G-5 WHAT MADE THE REPLICATION WORTH THE BATCH, WITHOUT INFLATION: not its
      evidential weight, which was near zero by design, but that RT-20260729-021
      conditioned its own reading of the shift on it; that this program has already
      been burned by exactly that failure twice; and that it cost fifteen seconds and
      zero curve compute.
    the_stopping_rule_binding_and_recorded_before_the_outcome_was_known: >-
      BATCH-013 IS THE LAST BATCH THIS LINEAGE MAY CONSUME FOR A REPLICATION OR A
      CONTROL-ON-A-CONTROL, UNDER EITHER BRANCH OF THE RESUME CONDITION AND
      REGARDLESS OF OUTCOME. The +0.3610 aggregate z_sem shift is CLOSED at the close
      of BATCH-013. RC-21B is discharged as committed. RC-21C's residual independent
      re-derivation, RC-F, and the duplicated VAL-20260729-001 identifier are carried
      as DEFECTS and MAY NOT be cited as grounds for a further batch in this lineage.
      THE ONE ITEM THAT MAY STILL JUSTIFY A BATCH is DEFER-BATCH013-001, and only as
      a PRIMARY subject and never as a rider; if the batch after BATCH-013 does not
      dispatch it, this lineage is CLOSED FOR GOOD and no later batch may reopen it on
      instrument grounds. RC-B is NOT in the replication class: it requires curve
      compute and measures FRESH cells, and it is ranked with the yield lane as
      DEFER-BATCH012-001.
      ABSOLUTE BOUND: NO BATCH AFTER BATCH-014 MAY BE JUSTIFIED BY THIS LINEAGE UNDER
      ANY READING.
    what_the_successor_batch_must_do: >-
      EXACTLY ONE OF THREE THINGS, AND IT MUST SAY WHICH. (i) DISPATCH THE EXP-STR-004
      REPLICATION OF DEFER-BATCH009-001, the only carried obligation that can move
      the goal's sole active hypothesis, WITH AN EXPLICIT SOLVER-AVAILABILITY CHECK
      BEFORE THE FREEZE so that an absent computer-algebra dependency is caught as
      INFRASTRUCTURE and never as a result. (ii) DISPATCH A FRESH-CELL YIELD
      EXPERIMENT UNDER RC-G - new curves per size or new sizes, with the repaired null
      pre-registered before they are measured - which is the only construction that
      can make a yield test confirmatory. (iii) RECORD PLAINLY THAT THE GOAL HAS NO
      AUDITABLE NEXT ACTION INSIDE ITS BUDGET AND PAUSE ON pause_condition 4.
      INSTRUMENT MAINTENANCE IS NOT AMONG THE OPTIONS.
    the_lineage_closure_stated_explicitly: >-
      UNDER RULE-BATCH013-SCOPE THIS WAS THE LAST REPLICATION-OR-CONTROL-ON-A-CONTROL
      BATCH IN THE EXP-YIELD INSTRUMENT LINEAGE, AND THAT LINEAGE IS NOW CLOSED TO
      FURTHER INSTRUMENT WORK. The evidence closes it and the rule forecloses it; the
      two grounds are recorded separately and the dissent at
      `the_dissent_recorded_and_not_smoothed` states which is operative.

  carried_defects_not_repaired_by_this_batch:
    statement: >-
      CARRIED EXPLICITLY SO THEY DO NOT GO SILENT. None of these is repaired by
      BATCH-013 except where a REPAIR IS NAMED, none is retracted, and NONE MAY BE
      DESCRIBED ANYWHERE AS FIXED.
    RT21-1: >-
      THE C-20 POWER SENTENCE IS FALSE AS TO ITS FIVE-PER-CENT CLAUSE AND MAY NEVER
      BE QUOTED UNACCOMPANIED BY THE RT-20260729-021 CORRECTION. IT IS NOT QUOTED
      ANYWHERE IN THIS RECORD OR IN EV-ECDLP-010, and the EXP-YIELD-003 contract
      correctly does not reproduce it and creates no new clause making a sentence
      mandatory on downstream records. What is true, carried from DEC-20260729-002:
      the design detects a uniform shortfall of 5 per cent of T with probability
      about 0.9999 and of 4 per cent with probability about 0.99, is blind below
      about 1.5 per cent of T, and is blind to any shortfall not proportional to T.
      ITS ORIGIN IS THE CARDINALITY-NOT-IDENTITY FAILURE, and PRED-ID EXTENDED now
      binds a successor's own power, sensitivity, count and magnitude statements -
      AND FAILED AGAIN THIS BATCH, in the Coordinator's own receipt (SUP-BATCH013-C).
      RC-21C's residual independent re-derivation of the corrected detection curve
      remains an UNARCHIVED PROBE and is undischarged; it may NOT be cited as grounds
      for a further batch in this lineage.
    RT21-8_and_DEV-4: >-
      THE HIGH-PRECISION DIFFERENCE COLUMN OF THE COMMITTED EXP-YIELD-002 PACKAGE
      REMAINS UNUSABLE AS A CONFIRMATION OR A DISCONFIRMATION OF T, FOREVER, AND NO
      RECORD MAY QUOTE IT AS EITHER. Its two legs share a per-tuple seed under the
      DEV-4 contract defect and its error bar is quantified nowhere. THE REPAIR
      LANDED IN EXP-YIELD-003 AND IN NOTHING ELSE: the arm labels are extended to
      HIGHPREC-REPAIRED and HIGHPREC-ASRECORDED, verified independently at all ten
      block tuples before the first draw, so the EXP-YIELD-003 column now has a
      quantifiable error bar. THE COMMITTED EXP-YIELD-002 COLUMN IS IMMUTABLE AND IS
      NOT REPAIRED BY THIS.
    O_4_component_d: >-
      UNTOUCHED AND STILL UNARCHIVED AS A CENSUS-FACING CLAIM. What this batch adds
      is arithmetic about two pre-marking rules INSIDE THE SIMULATION and settles the
      mean-level gap in closed form; the claim that the correct null pre-marks the
      bins a cancelling multiset reaches DETERMINISTICALLY is a modelling claim about
      the census and is untested by anything committed. C-13 makes no claim about the
