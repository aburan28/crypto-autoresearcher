  decision: inconclusive
  decision_vocabulary_note: >-
    `inconclusive` IS TAKEN FROM THE docs/task-lifecycle.md SECTION 9 TRANSITION
    VOCABULARY, which this card's completion gate L2 names as governing, and it is
    the one transition label this record records. Section 9 defines it as "data do
    not discriminate explanations", and that is exactly and only what happened.
    THE CHOICE IS JUSTIFIED AGAINST EVERY ALTERNATIVE.
    NOT `support`: EXP-YIELD-003 carries NO pre-registered prediction and NO
    success criterion on its primary quantity, so there is no scoped prediction
    for evidence to support, and recording `support` would manufacture one. The
    run's own integrity passing is ADMISSIBILITY, verified before interpretation,
    and is not a transition.
    NOT `weaken` and NOT `reject_scoped`: both presuppose a hypothesis or a tested
    prediction to move, and none exists here - `heuristic_under_test` and
    `hypothesis_id` are null in the frozen contract. Both are independently
    forbidden on a single unreplicated empirical-only run set, and RT-20260729-031
    pre-stated for the realised branch that a `weaken` label would imply a
    hypothesis exists to weaken and none does.
    NOT `replicate`: this decision dispatches nothing, and the replication that
    would matter - RC-38-A, the measurement of the null's own centre - is named
    and DELIBERATELY NOT REQUESTED under RULE-BATCH013-SCOPE.
    NOT `expand`, NOT `refine`: no broader instance set and no mechanism
    improvement is authorized by this record.
    NOT `pause` AS A LANE DECISION: the GOAL record separately moves to `paused`
    on its own budget terms in the same checkpoint, which is a budget transition
    and not a judgement about this evidence.
    RT-20260729-031 PRE-STATED THE LABEL FOR THE REALISED BRANCH AS
    `inconclusive`, NOT AS ANYTHING STRONGER, and specifically not as a finding
    that the shift is a property of the driver-build-platform combination, and it
    recorded that pre-statement as pre-stated with its basis checked: neither
    DEC-20260729-003 nor EV-ECDLP-010 existed at the HEAD it reviewed. THIS
    DECISION ADOPTS THAT LABEL.
  decision_scope: >-
