  AMB_2_ratification:
    what_is_ratified: >-
      RATIFIED EXPLICITLY BY THE COORDINATOR, AS RT31-7 AND N-4 BOTH REQUIRE, AND
      NOT LEFT STANDING AS AN EXECUTOR READING. The reading is that a threshold the
      contract ITSELF MANDATES as a reporting rule - the tail counts of |z_sem|
      above 1, above 2 and above 3 required by `tail_checks`, and the count n_neg
      required by OM-6 - is REQUIRED EXECUTION OF THE MANDATING CLAUSE and does NOT
      fire IV-6.
    grounds: >-
      THREE, EACH SUFFICIENT. FIRST, IV-6 read literally is SELF-INVALIDATING: it
      would forbid the contract's own metrics section, OM-6 being DEFINED as a count
      over a strict inequality, so no execution could satisfy both clauses, and a
      rule that no execution can satisfy is not the rule. SECOND, PDC-1 supplies the
      governing principle even though it does not supply the enumeration, and its
      structure transfers a fortiori to a clause of identical shape whose mandate
      sits in the contract's own reporting requirements. THIRD, IV-6 is a
      SCOPE-BREACH rule whose enumerated targets are all OUTSIDE the contract's
      declared scope, while the tail counts are inside it, named and mandated, and
      the contract expressly disclaims any test, firing or p-value on them.
    the_authority_defect_named_rather_than_cured_by_the_ratification: >-
      THE EXECUTOR'S READING WAS THE RIGHT CALL AND THE WRONG AUTHORITY. The PDC
      binding statement says so in its own words, citing D-2: A CONDITION RECORDED
      AFTER THE FACT IS NOT A CONDITION. AMB-2 is an Executor-adopted EXTENSION of a
      pre-dispatch condition, recorded after dispatch. Declaring it and naming its
      blast radius rather than applying it silently was exactly the ST-3 discipline
      that found DEV-4, and it is credited as such. THIS RATIFICATION IS ON THE
      MERITS AND CONFERS NO RETROSPECTIVE PRE-DISPATCH AUTHORITY; the drafting gap
      in PDC-1 is closed here, prospectively, by the Coordinator, and a successor
      contract must enumerate the mandated reporting thresholds in its own carve-out
      rather than rely on an Executor reading.
    the_validators_addition_recorded_with_it_N_5: >-
      THE BLAST-RADIUS STATEMENT IS CORRECT ON THE DATA AND UNDERSTATES THE
      PROCEDURE. Confirmed on the data: OM-5 is a mean, a sample standard deviation
      and a standard error with NO comparison operator anywhere in its derivation,
      recomputed as such by the validator to bit equality, and the tail counts and
      n_neg are terminal leaves that no other quantity in any of the seven artifacts
      reads. THE CORRECTION: AN ADVERSE RULING WOULD FIRE IV-6, WHOSE OWN
      CONSEQUENCE CLAUSE INVALIDATES THE RUN - not merely those counts. That branch
      does not arise given this ratification, and NO LATER RECORD MAY ADOPT THE
      SOFTER SENTENCE.

  PDC_15_disposition:
    ruling: >-
      QUOTED-FIGURE IMPRECISION IN THE CONDITION'S OWN DESCRIPTIVE ARITHMETIC. THE
      RUN VIOLATED NOTHING; THE CONDITION IS DEFECTIVE.
    the_arithmetic: >-
      Recomputed independently at 60-digit precision by VAL-20260729-002 and at
      50-digit precision by RT-20260729-031, the exact expectation
      (|S_(m-2)|/N)[(N-1)(1-2/N)^(C_red/2) + (1-1/N)^(C_red/2)] differs from the
      quoted T by AT MOST 3.230158e-05, attained at T-12-2-B62; the next largest is
      7.358e-06 at T-14-2-B118 and the remaining eight are at or below 1.939e-06.
      The Executor's realised figure 3.2302e-05 is CORRECT. `better than 3.2e-5` is
      therefore FALSE AS STATED and `better than 3.24e-5` is TRUE.
    why_the_run_violated_nothing: >-
      |E - T| is DETERMINED arithmetic on committed integer constants N, C_red and
      |S_(m-2)|; no seed, no draw, no replicate count and no executor action can
      move it, and A CONDITION THE RUN CANNOT INFLUENCE CANNOT BE VIOLATED BY THE
      RUN. PDC-15's operative obligations - the SYMMETRIC prohibition on quoting the
      difference column as a confirmation OR a disconfirmation of T, and the
      requirement that any record reporting the column state the exact expectation
      formula - are both discharged. The Executor carried the immutable condition
      text verbatim beside the per-tuple numbers, altered nothing, and handed the
      exceedance to the reviewers.
    it_is_the_RT21_1_genus_for_the_third_time: >-
      A HAND-DERIVED NUMERAL, FROZEN INTO AN IMMUTABLE GOVERNING TEXT, SURVIVING AN
      INDEPENDENT REVIEW, AND FALSE - after C-20 and after the observation
      feasibility table's rank-4 sentence. The defective object is the CONDITION,
      whose numeral was hand-derived by the pre-execution reviewer and truncated
      downward instead of rounded upward. PDC-15's SUBSTANCE is unaffected and is
      correct: the agreement is ARITHMETIC AND NOT EVIDENCE, and the symmetric
      prohibition stands unchanged.
    action: SUPERSEDED, NOT REPAIRED. See SUP-BATCH013-E and narrowing N-3.

  O_4_component_d_disposition:
    ruling: >-
      ORTHOGONAL. A replicated offset does NOT bear on EV-ECDLP-008 observation O-4
      component (d), and (d)'s MEAN-LEVEL content is closed-form arithmetic that
      needs no experiment at all.
    the_arithmetic_adopted_from_RT31_8: >-
      Writing A = (1-2/N)^(C_red/2) and C = (1-1/N)^(C_red/2): at m = 2, where the
      structurally exact pre-marked set is {bin 0}, the exact mean under the
      structurally exact rule EXCEEDS the uniform-subset mean by ((N-1)/N)(C - A);
      at m = 3, where the structurally exact set is B/2 whole antipodal pairs closed
      under negation, it FALLS SHORT by (B/N)(C - A). Evaluated at the 48 declared
      tuples in SEM units, the m = 2 gap runs from +0.00527 to +0.08605 with mean
      +0.02974 and the m = 3 gap runs from -0.000435 to -0.00000073 with mean
      -0.0000769; the maximum over all 48 is 0.08605 at T-12-2-B46 and the overall
      mean is +0.01794.
    consequence_1_it_cannot_explain_the_shift: >-
      Component (d) contributes at most 0.086 SEM at any single tuple and 0.018 SEM
      to the 48-tuple mean, AN ORDER OF MAGNITUDE SHORT OF +0.30, and AT m = 3 IT
      HAS THE WRONG SIGN. The question a replicated offset asks and the question (d)
      asks DO NOT TOUCH.
    consequence_2_the_declared_envelope_is_confirmed_correct_and_tight: >-
      The committed 0.0895 SEM envelope is CONFIRMED AS CORRECT AND TIGHT by this
      arithmetic, with realised maximum 0.08605 against it.
    consequence_3_the_mean_level_content_no_longer_needs_compute: >-
      THE MEAN-LEVEL CONTENT OF DEFER-BATCH013-001 IS SETTLED BY THE TWO
      EXPRESSIONS ABOVE AND BY NO EXPERIMENT. A 10^4-replicate two-leg run over 48
      tuples would buy a Monte Carlo estimate of a number already available in
      closed form to full precision.
    what_this_does_not_settle_stated_so_the_ruling_is_not_overread: >-
      THE ARITHMETIC SETTLES THE GAP BETWEEN TWO SPECIFIED PRE-MARKING RULES INSIDE
      THE SIMULATION. IT DOES NOT SETTLE O-4 COMPONENT (d)'s CENSUS-FACING CLAIM -
      that the correct null pre-marks the bins a cancelling multiset reaches
      DETERMINISTICALLY - which is a modelling claim about the CENSUS and not about
      the simulator. THAT CLAIM REMAINS UNTOUCHED AND UNARCHIVED, exactly as the
      BATCH-013 queue records, as EV-ECDLP-009 observation O-12 records, and as this
      batch's ceiling requires. It also does not settle the SECOND-MOMENT effect, on
      which C-13 makes no claim; RT-20260729-031's observation that the
      second-moment effect is of the same O(s/N) scale with s/N at most 0.0055 across
      the declared set is recorded AS THE RED TEAM'S REASONING and is not upgraded
      into a measurement.
    basis: >-
      DERIVATION, archived in RT-20260729-031 and in falsification_review.md section
      7, both committed at 0ec6c6ad, one commit before this record. It is not a
      product of this run and it is not a standalone archived derivation note; that
