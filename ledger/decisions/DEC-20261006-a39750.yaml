coordinator_decision:
  id: DEC-20261006-a39750
  context: >-
    The user requested active testing of P-192 isogenics and explicitly asked
    to continue beyond the earlier bounded census.  A new protocol is required
    because archive PR #1942 freezes a different experiment and source PR
    #1507 currently supplies only the native certificate-oriented norm core.
  decision: approve
  execution_authorized: false
  target_ids:
    - RQ-SCURVE-42f1a3
    - IDEA-20261006-767793
    - H-SCURVE-ec34c4
    - EXP-SCURVE-1a8daf
  rationale:
    - >-
      Centered principal norms target class relations directly and are
      materially different from a blind isogeny BFS or the prior L<=2^48 word
      census.
    - >-
      The two-base design permits broader relation collection but requires
      exact cancellation to ell<=4093 before maps, preventing expensive edges
      from being treated as free.
    - >-
      Search membership is deterministic and independent of Q32 timing;
      algebra, map, subgroup, endpoint, and payoff certificates are separate
      gates.
    - >-
      Eight planned run roles and their order are frozen as pending labels.
      Canonical RUN IDs are allocated and rechecked only at dispatch.  A fresh
      Coordinator dispatch decision remains mandatory after missing native
      components and every admission artifact are committed and reviewed.
  evidence_refs:
    - ledger/questions/RQ-SCURVE-42f1a3.yaml
    - ledger/proposals/IDEA-20261006-767793.yaml
    - ledger/hypotheses/H-SCURVE-ec34c4.yaml
    - experiments/EXP-SCURVE-1a8daf/specification.yaml
    - research/p192-weighted-cm-20261006/run-family.yaml
    - research/p192-weighted-cm-20261006/REPORT.md
    - https://github.com/aburan28/crypto/pull/1507
    - https://github.com/aburan28/crypto-autoresearcher/pull/1942
  limitations:
    - Approval freezes a prospective protocol; it is not permission or a receipt for scientific execution.
    - No relation search, timing measurement, map census, ECDLP recovery, or replication has run.
    - The reviewed native source does not yet implement every required stage.
    - A null is meaningful only after every frozen shell and downstream applicable gate completes.
    - No knowledge finding or weak-curve assertion is warranted now.
  next_actions:
    - Implement and review the missing segmented sieve, recombination, optimizer, map, instrumentation, and independent verifier units in the native repository.
    - Freeze and approve the exact candidate consumer and matched generic DLP walk before the functional holdout role.
    - Hash-bind the final source and protocol commits and pass every admission control without scientific search data.
    - Commit a fresh dispatch decision naming exact clean revisions before creating any run manifest.
    - Allocate and recheck eight fresh canonical RUN IDs, then execute the frozen roles sequentially only through the supervised run entry point; archive immutable outputs and obtain independent replay before interpreting them.
  knowledge_promotion:
    promoted: []
    not_warranted: All runs are pending and there is no scientific result to promote.
  decided_by: coordinator
  decided_at: '2026-10-06'
