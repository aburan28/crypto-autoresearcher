  rationale:
    - >-
      THE DRAFT'S OWN READING DECIDES. RBR-1 was written before the census,
      and it says what a child without a source means: not approvable as
      written, and a successor adds recording at that child. The census found
      one such child on every anchor-identity run and seven builder
      instances on failure or refusal branches.
    - >-
      FAILURE BRANCHES ARE WHERE THE RECORD MATTERS. A read-back matters most
      for a child that timed out or exhausted memory: it shows the child ran
      under the cap. A repair that records only the ok branch would leave the
      ladder's memory-exhaustion outcomes (a planned possibility at n = 5)
      without the record AC-1 requires.
    - >-
      RECORD AT THE ONE FUNCTION EVERY CHILD GOES THROUGH. Three censuses in
      this lane each found one more site that a per-site design had missed.
      v2_solver.run_child is the only reachable frozen function that sets
      RLIMIT_AS in a child (census md 121-126); recording there covers every
      capped child by construction, closes L-1, and is one replacement, not
      seven.
    - >-
      A CHEAP CENSUS BEFORE AN EXPENSIVE STAGE. The successor adds a function
      replacement and an admission rule; whether they reach every site and
      refuse no planned path are code facts, checked statically at zero runs
      before another stage is spent.
    - >-
      THE LANE STAYS OPEN. Nothing measured D. The obstruction is recording
      coverage in a layer not yet written. Closing C1's measured side
      (KN-OPEN-9b4a2b) on it would be premature closure.
    - >-
      NO SECURITY READING. Toy EcGFp5-shaped arithmetic with known scalars;
      nothing transfers to p = 2^64 - 2^32 + 1.

  scope: >-
    This decision concerns the readbackcover draft's approvability only. Its
    readings rest on the archived census, a static reading of the frozen
    implementation-v2/ and implementation-v2-a1/ trees, the phase-A-bound r3
    layer and both r3 plans at dd1034553 bytes, and the four r3 gate packages
    (msolve 0.6.5 at -t 1, valgrind 3.22.0, the 10 GiB child cap), toy
    EcGFp5-shaped inputs with known scalars at 4111 and 16777291. Nothing here
    is a measurement of D. Nothing transfers to 262151, 1073741831 or
    p = 2^64 - 2^32 + 1.

  remaining_uncertainty:
    - >-
      Whether the successor's run_child replacement intercepts every reachable
      call site and captures a pair on every branch that creates a child. This
      act's reading of the call forms says yes; the successor census
      establishes it (RLR-1, RLR-2).
    - >-
      Whether the frozen checker exits 0 on every correctly recorded outcome a
      dependent package's frozen logic acts on (for example an m = 5 cell
      recorded not_measured). If not, RL-4 as worded could refuse a planned
      path, and the successor is not approvable as written (RLR-4 (b)).
    - >-
      Whether controls-a1 can run once in a development world without a
      frozen-byte edit (RLR-7).
    - >-
      The census's method limits L-1..L-5 and its hand-read dispositions
      (D-4). L-5 in particular: controls-a1, fixture4, build, cells and the
      aggregates have never run under r3.

