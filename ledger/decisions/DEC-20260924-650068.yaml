    RBR-1_every_capped_child_has_a_source:
      draft_text: >-
        "READING: approvable as written ONLY IF, for EVERY capped child the
        census finds reachable from ANY command of either r3 plan (...), at
        least one read-back source exists under RB-1 and RB-2 as worded. A
        reachable capped child with NO source under these words makes the
        draft NOT approvable as written; a successor draft adds recording at
        that child. NOT A BAR: a child whose read-back is found in two
        sources; the census's static-method limits it names." (lines 396-407)
      definitions_text: >-
        CAPPED CHILD: a process launched through the frozen v2_solver.run_child
        (or any other frozen function that sets RLIMIT_AS in a child),
        reachable from a command of either r3 plan. READ-BACK SOURCE: a place
        the RB-2 collector reads (raw-result.json by key name;
        child/*.meta.json; a solver-events.json attempt record written under
        RB-1 from a frozen function's RETURNED result) that carries its
        getrlimit pair. (lines 373-382)
      archived_values: >-
        md 101-318; receipt 132-403.
        - run_child is the only reachable frozen function that sets RLIMIT_AS
          in a child; 6 reachable call sites (md 114-126).
        - ok branch: every reachable capped child other than I-10 has at
          least one source (md 290-291; receipt line 247
          children_with_no_source_on_ok_branch []).
        - failure / refusal branches with NO source (receipt 133-246):
          I-11 ctl_identity_n3 (no_meta); I-12 ctl_raw_random,
          ctl_raw_planted (no_meta); I-13 ctl_identity_n5_m3 / m4 (no_meta);
          I-14 ctl_raw_n5_m3 / m4 (no_meta); I-15 ctl_S3, ctl_S3_rescaled,
          ctl_torsion_S3_rq, ctl_torsion_S3_norm (refused_meta and no_meta);
          I-20 grid_<arm>_t<i> of cells in both plans (refused_meta and
          no_meta); I-25 ctl_a1_torsion_S3_rq, ctl_a1_S3_rescaled
          (refused_meta and no_meta). Each is marked launched_at_run_time
          true. On those branches the pair exists only in the run_child
          record, which the caller discards or stores under a key the
          collection does not read (md 280-282).
        - I-10 anchor_comparator_system (v2_driver.py:711, gb_only): source
          only under RB-1 read to cover pass-through calls (receipt 248-260;
          md 270-279). In RUN-GFPN-f5412a it is the one of 7 evidenced capped
          children whose read-back reaches no source (md 433).
        - static-method limits named: L-1..L-5 (md 301-315).
      R-RB1-I-10: >-
        NO SOURCE UNDER RB-1 AS WORDED. RULED ON THE DRAFT'S OWN WORDS, NOT
        ON A READING CHOSEN AFTER THE CENSUS.
        (1) RB-1 records "EVERY attempt of EVERY wrapped call at S-1
            (v2_driver.solve, SE-3 wrapper)" (lines 199-201). It does not say
            that a gb_only call is a wrapped call, and it names attempt
            records, which the r3 layer writes only for the bounded rule.
        (2) The same draft's RBR-2 (lines 410-415) and RB-3 (lines 245-253)
            use "wrapped" for the calls whose attempts SC-4 enumerates, and
            the census, applying those words, classes anchor-identity 693 and
            711 as "not a wrapped call" (md 339). The r3 layer counts
            pass-through calls apart from wrapped_calls (r3_resolve.py 253,
            382-387; RUN-GFPN-f5412a records wrapped_calls 0 and passthrough
            5; md 274-277).
        (3) Read consistently within the draft, I-10 has no source. The wider
            reading ("wrapped" = every call that reaches the SE-3 entry) is
            possible, but the draft does not state it (the census says so,
            md 278-279). Adopting it in this act would pick, after the
            census, the one reading that makes the draft pass. That is the
            post-hoc change the draft forbids (lines 440-444).
        (4) RESULT: I-10 is a reachable capped child with NO source under
            RB-1 and RB-2 as worded. It is launched in EVERY anchor-identity
            run (md 271-273). It alone makes the draft not approvable as
            written.
        (5) The successor states the wider reading as normative text (RL-2),
            so the question is settled by archived words, not by this act.
      R-RB1-failure_and_refusal_branches: >-
        NO SOURCE ON THOSE BRANCHES, AND THEY ARE NOT STATIC-METHOD LIMITS.
        (1) The reading is per capped child: every capped child the census
            finds reachable must have at least one source "under RB-1 and
            RB-2 as worded". A capped child is a process; which branch it
            ends in is a run-time fact. A child that ends on no_meta or
            refused_meta has NO source under the draft's words, so for that
            child the condition fails. The ok-branch source of the same call
            site does not record that child's read-back.
        (2) The draft's NOT A BAR covers "the census's static-method limits it
            names". The census names L-1..L-5 as limits (md 301-315). The
            branch dispositions of I-11..I-15, I-20 and I-25 are not among
            them: they are listed as FINDINGS (md 280-289; receipt
            children_with_no_source), established from the frozen code at
            cited lines (the pair is in the run_child record, v2_solver.py
            227, and the caller drops it). A limit is something the method
            could not determine; these the method did determine.
        (3) L-3 says which branch occurs is a run-time fact and that the
            refused_meta branches of I-20 and I-25 are "not expected" (md
            307-310). Not expected is not impossible, and L-3 does not reach
            the no_meta branches at all. no_meta includes timeout,
            memory_exhausted, crash and nonzero exit (md 177-179), which are
            ordinary outcomes: the v1 run of this experiment recorded 6
            failed/resource_exhaustion and 5 failed/infrastructure_error
            packages (goal checkpoint_20260923; CORR-20260923-d4220b). I-20
            is the grid builder of the ladder cells, where memory exhaustion
            at the 10 GiB cap is a planned possibility. A child that exhausts
            memory is exactly the child whose recorded cap separates an
            envelope outcome from a host failure (AC-1).
        (4) RESULT: I-11, I-12, I-13, I-14 (no_meta), I-15, I-20 and I-25
            (refused_meta and no_meta) are reachable capped children with NO
            source on those branches, under RB-1 and RB-2 as worded. Each
            independently makes the draft not approvable as written.
        (5) NOT A BAR, and ruled so: L-1 (a frozen function that raises after
            its child ran returns nothing to copy), L-2 (the ERR setrlimit
            branch takes no pair), L-4 (grandchildren) and L-5 (commands
            never run under r3; dispositions static only). They are named
            method limits. The successor's launch-level recording closes L-1
            as well, records L-2 as "absent" with its reason, and leaves L-4
            and L-5 declared.
      R-RB1-ok_branch_sources_only_under_RB-1_or_meta: >-
        Recorded, not a bar. On the ok branch the 8 controls solves (I-16..I-18),
        the S-2 health solves (I-24) and the 2 controls-a1 solves (I-26) have
        a source only under RB-1; I-02 (ok), I-11..I-15, I-20 and I-25 only
        under RB-2 (b) (md 293-299). A single source satisfies the reading.
      result: >-
        FAILS. I-10 (every branch it is launched on, under RB-1 as worded) and
        I-11..I-15, I-20, I-25 (on their failure or refusal branches) have no
        read-back source. By the draft's own reading it is NOT APPROVABLE AS
        WRITTEN, and "a successor draft adds recording at that child".

    RBR-2_sc4_coverage:
      draft_text: >-
        "READING: approvable as written ONLY IF every wrapped S-1 and S-2 call
        the census finds reachable from any command is enumerable by RB-3 as
        worded (its attempts are written to solver-events.json attempt
        records by RB-1), so that no recorded ok attempt with a retained
        output can lack an SC-4 row." (lines 408-415)
      archived_values: >-
        md 320-358; receipt 404-457. 11 wrapped sites; not enumerated today:
        controls v2_driver.py 786, 787, 841 and controls-a1 a1_driver.py:166;
        not enumerable under RB-1 + RB-3 as worded: none; unclassified: none.
        anchor-identity 693 and 711 are gb_only pass-through and excluded from
        SC-4 by the `-g` argv (r3_check_run.py 136).
      application: >-
        Every wrapped call is enumerable under RB-1 + RB-3 as worded. The
        pass-through calls are not wrapped calls in the draft's vocabulary and
        carry `-g`, which the carried SC-4 selection excludes; they are not
        SC-4 rows under any reading. The census's limit (an attempt whose
        frozen function raises returns no result; md 356-358) cannot produce a
        recorded ok attempt, so it is not a gap in this reading.
      finding_carried: >-
        The SC-4 gap of the r3 enumeration is NOT confined to `controls`: the
        frozen controls-a1 command (a1_driver.py:166; 2 calls) has the same
        gap and has never run (md 351-354). RB-3 as worded closes it. The
        successor adds controls-a1 to DV-18 (RL-6 (e)), because the lesson of
        G4 is that a command first run at its gate fails on a recording path
        nobody exercised.
      result: HOLDS.

    RBR-3_admission_predicates:
      draft_text: >-
        "READING: approvable as written ONLY IF, of the admission predicates
        the census lists in r3_run_wrapper.py (R-1..R-13, with what each
        reads), every predicate that admits a package on the recorded result
        of ANOTHER package is either RB-4 (gate packages; the controls_a1
        image) or reads no recorded result that a completion-gate checker can
        contradict. A further predicate that admits on another package's
        recorded status without its checker verdict makes the draft NOT
        approvable as written." (lines 416-426)
      archived_values: >-
        md 360-410; receipt 458-468. Predicates reading another package's
        record: R-7 (gate packages' run_status / gate_pass; REG-1 of G1; the
        controls_a1 image), R-8 (existence of runs/<req>/manifest.yaml; no
        field read), R-12 (the replaced package's failure_class, which no
        checker item reads: token counts 0 / 0 / 0). No predicate other than
        R-7 admits on another package's run_status or gate_pass.
      R-RB3-R-8: >-
        NOT A BAR AS WORDED. R-8 reads the existence of a file, not a recorded
        result; every checker opens that file and none disputes its existence.
        Within the gate it orders G2..G4 after their predecessors; RB-4 then
        requires each gate package's checker verdict before any post-gate
        package.
      R-RB3-R-12: >-
        NOT A BAR AS WORDED. R-12 admits a REPLACEMENT run of the replaced
        package, not a package that relies on its result, and the field it
        reads (failure_class) is read by no checker item, so no checker
        verdict can contradict it. Contingency use still requires a
        Coordinator R-12 ruling as before.
      coordinator_observation_driver_level_reads: >-
        NOT A CENSUS RESULT UNDER RBR-3; NOT OUTCOME-DETERMINATIVE. The census
        lists, outside RBR-3's scope, driver-level reads of another package's
        record (md 389-395): cells read the build package's polynomials and
