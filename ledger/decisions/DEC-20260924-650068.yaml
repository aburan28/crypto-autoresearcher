    new_census_ruling: >-
      A ZERO-RUN SUCCESSOR CENSUS IS NEEDED, unlike DEC-20260924-e6638d's
      no-new-census ruling. The successor adds a function replacement
      (v2_solver.run_child) and an admission rule over driver-level reads.
      Whether the replacement intercepts every reachable call site, whether
      run_child returns a record carrying the pair on every branch that
      creates a child, whether any planned basis outcome fails the checker by
      design, and whether controls-a1 can run in a development world are
      code facts the archived census did not establish. This act read the
      call forms (every reachable caller uses `V.run_child` or, inside
      v2_solver, the module global `run_child`; v2_driver.py 101, 166, 650;
      v2_solver.py 517; a1_health.py 147; a1_pari.py 96) and run_child's
      return paths (v2_solver.py 149-232: "never raises for child failures";
      the pair is set at line 227 once the child reports OK). That is a
      PREVIEW that shapes the census's expected answer; it is not the census
      and is not relied on.
