    remaining named harness repairs. Also carried forward, lowest priority: BATCH-4b8ad3's unresolved
    run-count discrepancy (2 vs. 3 executions), and the four_shard_exponent_report.md Section 6(b)
    minor prose correction named above.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      HELD, NOT FILED AT THIS ARCHIVE -- for the same reason this campaign has held every candidate
      lesson in this task family so far (BATCH-0e126d's own knowledge_promotion; BATCH-2ecaa1's named
      failure mode, "promoting before testing the lesson's own consequence would be premature"). TWO
      genuine candidate KN-TECH lessons are visible here: (1) a fixed-batch-count jackknife design
      (N_JACK_BATCHES held constant while T varies) silently confounds any SE-vs-T scaling exponent
      with the absolute batch-size regime, unless T-points are chosen to hold batch size fixed or the
      regime is deliberately varied independently of whatever else the exponent is meant to isolate
      (e.g. shard identity here); (2) a two-point (zero-degree-of-freedom) local-exponent diagnostic
      cannot be read directionally, in either sign or magnitude, without an independent empirical
      estimate of its own sampling variance -- a generalizable warning about the entire local-exponent
      technique this task family invented at TASK-20260814-8bbdd2 and reused here. NEITHER lesson's
      consequence is yet confirmed: (1) requires the cross-regime experiment named in next_actions to
      show the confound actually explains (or fails to explain) the observed sign pattern; (2)
      requires the null-object control named in next_actions to show the diagnostic actually behaves
      as unreliably as the crude n=4 illustration suggests, or does not. Filing either now would
      repeat this campaign's own named failure mode verbatim. Promotion is deferred to the ledger
      archive that closes the confound-breaking-design-plus-null-object-control follow-up task named
      in next_actions, which either confirms one or both lessons with real discriminating evidence or
      narrows them. Separately, unchanged and unpromoted: the four-instance control-blindness pattern
      (held since BATCH-4b8ad3), the planted-arm plateau lesson (held since BATCH-f8050e), and the
      per-shard-heterogeneity/pooling-convention candidates held at BATCH-0e126d's checkpoint, now
      superseded in framing (not in existence) by the sharper batch-size-confound candidate above.
      KN-TECH-00f082 stands exactly as filed; no correction record is filed for it.
