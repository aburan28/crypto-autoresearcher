  limitations:
  - >-
    THIS TASK CARRIED NO PRE-REGISTERED BINARY PASS/FAIL RULE TO APPLY, UNLIKE DEC-20260809-186c86 --
    the completed table and IVW comparison are interpreted honestly against DEC-20260809-186c86's
    original framing and the two reviews, not against any frozen numeric threshold this batch itself
    declared in advance.
  - >-
    THE O7 BATCH-SIZE/TRANSITION-REGIME CONFOUND (rationale item b) IS EVIDENCED FROM COMMITTED DATA
    (a demonstrated, exact collinearity across the four measurements this family has ever made) BUT
    ITS CONSEQUENCE IS NOT YET TESTED. Whether local-exponent sign actually tracks transition regime
    rather than shard identity requires the cross-regime experiment named in next_actions, which has
    not been run. This decision treats the confound as a genuine, well-evidenced alternative
    explanation competing with the two named in DEC-20260809-186c86, not as a settled refutation of
    either.
  - >-
    THE O6 DIAGNOSTIC-RELIABILITY FINDING RESTS ON AN EXPLICITLY INFORMAL n=4 ILLUSTRATION, NOT A
    CALIBRATED STATISTICAL TEST OF THE 2-POINT LOCAL EXPONENT'S TRUE SAMPLING DISTRIBUTION. The
    null-object control named in next_actions is what would make this rigorous; until it runs, "the
    diagnostic is too noisy to adjudicate anything" is itself a reasoned inference from a crude
    calculation, correctly labeled as such by both this decision and the Red Team.
  - >-
    THE POOLING-CONVENTION ASYMMETRY (EV-HQC-469c08 O8) REMAINS COMPLETELY UNTESTED, TWO BATCHES
    RUNNING. This batch's Part B answered an adjacent, narrower question; the actual asymmetry
    (arithmetic-mean-of-separate-SEs vs. pooled-of-data) has never been isolated from genuine
    trial-count scaling in any fit run in this family.
  - >-
    THE ADAPTED DISJOINTNESS PROOF'S GENUINE RESIDUAL GAP (same-process, not cross-process, Step 2)
    IS NAMED HERE FOR THE FIRST TIME WITH PRECISION BUT NOT CLOSED. Neither reviewer found an
    exploited bug; the structural vulnerability is real and applies to any future reuse of this
    pattern on shards lacking a persisted raw array.
  - >-
    THIS COORDINATOR SESSION HAS NO SHELL. It cannot run tools/allocate_id.py to mint task/batch ids
    for the confound-breaking-design-plus-null-object-control task named in next_actions -- the same
    constraint every prior closing decision in this campaign has recorded for itself. The driving
    session must allocate these before dispatch, as it did for EV-HQC-927899 and this decision's own
    id.
  - >-
    BUDGET DEBIT CONVENTION IS STATED BUT NOT A FULL HISTORICAL RECONCILIATION, unchanged in status
    from every prior checkpoint in this campaign. See the goal-head checkpoint for the exact figure
    and the convention applied.
  - >-
    NONE OF THE FOUR ASYMPTOTIC-COMPLEXITY PROMOTION GATES IS ENGAGED OR CLAIMED. This program
    advances no asymptotic-complexity claim of its own here.
  - >-
    NO CLOSURE QUORUM AND NO ATTESTATIONS. GOAL-HQC-001 is not being closed, no completion criterion
    is met or approached, and no completion_quorum block is written or implied.
  next_actions:
  - >-
    EXACTLY ONE NEXT TASK, NOT YET DISPATCHED (IDs to be allocated by the driving session): a
    confound-breaking design that tests at least one shard from each existing pair (5000 or 6000;
    8001 or 8002) at the OTHER pair's trial-count/batch-size transition regime, on a fresh, disjoint
    trial range, PLUS a null-object control on the 2-point local-exponent diagnostic itself (a
    known-flat parametric object under the same matched-pair machinery, or repeated disjoint draws at
    a fixed (shard, transition) pair to empirically estimate the diagnostic's own sampling variance) --
    the Red Team's own named next_concrete_action and required_controls, adopted in the priority order
    it gave, because this is the cheapest available design that could actually discriminate among
    "shard-specific," "general estimator heterogeneity," and the newly named "batch-size/
    transition-regime" explanations, rather than adding a fifth or sixth single-shard exponent to a
    design already shown (this batch) to be too scattered and too confounded to adjudicate anything
    on its own.
  - >-
    IN THE SAME OR A FOLLOWING TASK IN THIS FAMILY, if this pattern is reused on shards lacking a
    persisted raw array: correct design.md's stated example of the adapted disjointness proof's
    residual risk to name the genuine same-process-vs-cross-process gap (not numpy RNG/platform
    drift, which this batch's Red Team confirmed is not mechanistically live for CTRStream's pure
    SHA-256 construction).
  - >-
    V1'S POSITIVE-CONTROL PILOT REMAINS SEQUENCED, NOT SHELVED, but is DEFERRED AGAIN and now follows
    the confound-breaking design and null-object control named above, per rationale item "V1's
    positive-control pilot" above.
  - >-
    CHECKPOINT GOAL-HQC-001'S HEAD, debiting this batch's MEASURED 94.020 wall-clock seconds (94.171
    core-seconds) against campaign_budget.total_wall_clock_seconds, using the SAME convention this
