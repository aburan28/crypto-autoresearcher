    checkpoint), giving roughly 4,814.08 of 10,800 seconds remaining. Not a full historical
    reconciliation, per the goal-head checkpoint's own stated scope.
  - >-
    DELIBERATELY NOT SCHEDULED, unchanged and for the same reason as every prior batch in this
