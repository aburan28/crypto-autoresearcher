  context: >-
    This is the closing ledger archive for BATCH-174014's single executor task, TASK-20260815-e61cca
    (Part A -- the discard-prefix, single-shard-only local exponent for shards 8001/8002 individually,
    on a new disjoint T=20,000 draw per shard; Part B -- an IVW pooling alternative on already-committed
    data), reviewed by TASK-20260815-dbb70b (Validator, verdict passed / ADMIT / MECHANICALLY_SOUND,
    which independently re-derived the entire pipeline from scratch and reproduced every statistic to
    bit-identity, and rendered the required judgment that the adapted two-step disjointness proof is
    adequate but genuinely weaker than the direct check used on shards 5000/6000) and TASK-20260815-907c66
    (Red Team, contests no reported number, but names a decisive new confound -- see rationale). This
    decision applies DEC-20260814-3f429d's next_actions exactly as dispatched, records the completed
    four-shard table and the IVW comparison honestly, and checkpoints GOAL-HQC-001.
  rationale:
  - >-
    (a) DOES THE PRE-REGISTERED SHARD-SPECIFIC-VS-GENERAL QUESTION GET ANY CLOSER TO RESOLUTION FROM
    THIS BATCH? NO -- AND THE HONEST READING IS THAT IT WAS UNDER-SPECIFIED FROM THE START, NOT MERELY
    STILL OPEN. This task ran exactly as designed and passed every one of its own pre-registered
    validity gates (EV-HQC-927899 O2), so the new numbers are genuine: shard 8001 alone local exponent
    -0.2682495157085447, shard 8002 alone -0.8662355237627483, completing the table to
    5000=+2.836, 6000=+1.402, 8001=-0.268, 8002=-0.866 -- a full sign flip across the two shard pairs
    (EV-HQC-927899 O3-O4). But the completed table does not turn the prior directional lean into
    confound-free evidence for either "shard-specific" or "general heterogeneity"; it actively
    undermines the premise that this diagnostic can adjudicate the question at all. A two-point
    log-log slope carries zero internal degrees of freedom, and even a crude, explicitly-flagged-as-
    informal n=4 treatment of the four exponents (mean 0.776, sample SD 1.6755, naive t(df=3) 95% CI
    [-1.890, 3.442]) cannot reject "the true common exponent is 0.5 and everything else is sampling
    noise in a very noisy 2-point statistic" (EV-HQC-927899 O6, Red Team). The Red Team is explicit,
    and I concur: this is not a sharper discriminator than the two-shard version DEC-20260814-3f429d
    read as a directional lean -- it is a demonstration that the diagnostic itself has never been
    calibrated against known noise, and that omission is now load-bearing for every interpretation
    this task family has offered so far.
  - >-
    (b) THE BATCH-SIZE/TRIAL-COUNT-TRANSITION CONFOUND, AND WHAT IT MEANS FOR EVERY PRIOR CONCLUSION
    IN THIS TASK FAMILY -- THIS IS THE CENTERPIECE OF THIS BATCH'S FINDING, NOT A FOOTNOTE TO IT.
    N_JACK_BATCHES=200 is fixed throughout this entire task family (confirmed by direct code read,
    stage_a.py line 89), so every jackknife batch's trial count is T/200, doubling at every T-step
    this family has ever measured. Shards 5000 and 6000 -- BOTH tested at the T=5,000->10,000
    transition (batch size 25->50) -- BOTH show a positive local exponent (SE decreased). Shards 8001
    and 8002 -- BOTH tested at the T=10,000->20,000 transition (batch size 50->100) -- BOTH show a
    negative local exponent (SE increased). No shard in this campaign has EVER been tested at the
    other pair's transition regime: shard identity and transition regime are 100% collinear in the
    data collected so far (EV-HQC-927899 O7, Red Team). This is a genuine, previously unnamed, directly
    falsifiable THIRD explanation, distinct from both of DEC-20260809-186c86's named categories and
    requiring no appeal to shard identity of any kind. Its consequence for EVERY prior "directional
    lean" statement this task family has made (DEC-20260814-3f429d rationale item 3; EV-HQC-469c08 O6-
    O7's "evidence consistent with general shard-to-shard estimator heterogeneity") is this: those
    statements were already correctly hedged as a directional lean, not confound-free evidence, and
    this decision does not retract them on that basis -- but they were reached without this confound
    on the table at all, and cannot currently be distinguished from "the batch-size/absolute-T regime,
    not shard identity in either sense, drives this diagnostic's sign and magnitude." Until the
    cross-regime test named below is run, "general estimator/shard heterogeneity" should not be
    carried forward as the leading candidate explanation for the sign-flipping pattern; it is one of
    at least three live, currently indistinguishable candidates (shard-specific, general shard
    heterogeneity, batch-size/transition-regime), and the third was not considered by any decision in
    this family before this one.
  - >-
    (c) LIMITATIONS. This finding rests on exactly four single-shard-only local-exponent measurements
    (two per transition regime), the same small-n limitation the diagnostic itself has now been shown
    to carry (rationale item a) -- the confound is well-evidenced as a structural fact about the
    design (100% collinearity is a fact about which cells were sampled, not itself subject to sampling
    noise), but WHETHER breaking it actually explains the sign flip is untested and requires the
    cross-regime experiment named in next_actions. The pooling-convention asymmetry EV-HQC-469c08 O8
    named remains untested by this batch's IVW check, which answers a narrower, adjacent question
    (concatenated-pooling vs. IVW-pooling on the SAME trial count) rather than O8's actual asymmetry
    (arithmetic-mean-of-separate-SEs vs. pooled-of-data across DIFFERENT fit points) (EV-HQC-927899
    O9, Red Team). The adapted disjointness proof's own named residual-risk mechanism (numpy RNG
    drift) is not mechanistically plausible -- the Red Team traced CTRStream directly and confirmed it
    is a pure SHA-256 counter-mode construction with no numpy.random dependency -- but the genuine,
    more precise gap (a same-process, not cross-process, comparison in Step 2) is real, disclosed here
    for the first time with precision, and not closed by either review, though neither reviewer found
    an actually-exploited bug (EV-HQC-927899 O8). Both Validator and Red Team independently confirm the
    two-step disjointness proof and F-invariant PASS and are adequate-but-weaker validity gates for
    this task's new data; this is not a Branch-D-style non-result.
  - >-
    (d) NEXT ACTIONS -- AN ACTUAL JUDGMENT CALL, NOT A DEFERRAL. I adopt BOTH of the Red Team's ranked
    recommendations, in the priority order it named, because the batch-size confound is the single
    most parsimonious and cheapest-to-test alternative currently on the table, and because the
    diagnostic-reliability finding (rationale item a) means no further data collected in this
    family's existing pattern (extend each shard's own historical starting point) can be trusted
    without first knowing whether the diagnostic's own noise floor and this confound explain the
    observed pattern. EXACTLY ONE NEXT TASK, NOT YET DISPATCHED: (1) THE CONFOUND-BREAKING DESIGN --
    run the same discard-prefix technique on at least one of shards 5000/6000 at a fresh, disjoint
    T=10,000-per-shard baseline to T=20,000-per-shard new-tail transition (mirroring 8001/8002's
    regime), and on at least one of shards 8001/8002 at a fresh, disjoint T=5,000 to T=10,000
    transition (mirroring 5000/6000's regime); (2) A NULL-OBJECT CONTROL on the 2-point local-exponent
    diagnostic itself -- either a known-flat parametric construction (e.g. adapting measure.py's
    "A_k=1 is a theorem" object to the paired-SE estimator) or repeated disjoint draws at a fixed
    (shard, transition) pair, to obtain an empirical handle on the diagnostic's own sampling variance.
    The Red Team's own text explicitly allows folding (2) into (1)'s replication; the driving session
    should decide the exact task shape when it allocates IDs. This is STRICTLY MORE INFORMATIVE than a
    fifth or sixth single-shard exponent computed at each shard's own historically-confounded
    transition, which I judge to have reached DIMINISHING RETURNS FOR MORE OF THE SAME DESIGN --
    concurring explicitly with the Red Team on this point -- while declining to declare the broader
    single-shard-exponent line of investigation saturated, since a concrete, cheap, previously
    unconsidered design (the cross-regime test) has not yet been run and doing so is not premature
    closure under docs/inventor-protocol.md Section 4.
  - >-
    V1'S POSITIVE-CONTROL PILOT REMAINS SEQUENCED, NOT SHELVED, BUT IS DEFERRED AGAIN, and now follows
    the confound-breaking design and null-object control named above, on the SAME reasoning
    DEC-20260809-46e85c originally used and DEC-20260814-3f429d already applied once -- which applies
    MORE strongly now, not less. This batch did not resolve either open question DEC-20260814-3f429d
    deferred V1 behind (per-shard heterogeneity, pooling-convention asymmetry); it surfaced a THIRD,
    more fundamental uncertainty about whether this instrument family's own SE-vs-T scaling
    measurements mean what they have been read to mean at all, given the newly demonstrated
    batch-size confound and the diagnostic's uncalibrated noise floor. Committing to V1 before either
    is resolved risks sizing or interpreting a positive control through sizing arithmetic this whole
    task family exists to check, and that arithmetic is now MORE in question than it was at
    DEC-20260814-3f429d's checkpoint, not less.
  - >-
    THE MINOR CORRECTIONS THE RED TEAM NAMED (design.md Section 3's disjointness-proof residual-risk
    mechanism should name the same-process-vs-cross-process gap rather than numpy RNG drift;
    four_shard_exponent_report.md Section 6(b)'s "consistently at or below 1... at every k" overstates
    a ratio that is marginally above 1 at k=2-7 for the 8001/8002 pair) are recorded here rather than
    corrected in the frozen producer artifacts, consistent with this campaign's established handling
    of such findings (e.g. the O10 documentation-accuracy pattern) -- both are low priority, disclosed,
    non-blocking, and carried forward for the next task in this family that reuses this pattern.
  - >-
    H-HQC-18d1b4 IS UNCHANGED AND REMAINS PROPOSED. Nothing in EV-HQC-927899 bears on the hypothesis in
    either direction: this batch's findings concern a scaling-characterization instrument's own
    diagnostic reliability and a newly named confound in its design, not the V3 defect's propagation
    to k=17. Claim tier stays TOY throughout.
  - >-
    KN-TECH-00f082 IS UNTOUCHED BY THIS BATCH. Its content (the matched-pair-vs-between-shard
    power-deficit lesson) is unrelated to this batch's findings; neither its filed text nor its
    falsification/narrowing condition is engaged here.
  - >-
    VALIDATOR AND RED TEAM BOTH ADMIT THE MEASUREMENT AND THE RECOMPUTATION. Validator verdict:
    passed / ADMIT / MECHANICALLY_SOUND, every declared artifact present and hash-bound to the
    snapshot, every derived statistic reproduced to full double-precision exactness from
    independently regenerated raw data, plus the required, non-optional judgment that the adapted
    disjointness proof is an adequate (not equivalent) substitute for the direct check. Red Team:
    contests no reported number; its objections and its centerpiece confound finding concern what the
    numbers mean, not their soundness or honesty.
