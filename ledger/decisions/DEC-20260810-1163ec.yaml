  decision: close_batch
  decision_label: batch_46254b_closed_gate_package_accepted_with_defects_bcp1_guarantee_partial

  context: >-
    BATCH-46254b was the gate batch of GOAL-MD5-001 under claim ceiling
    protocol_freeze_implementation_pin_and_literature_acquisition_only. It
    froze the blind-calibration protocol (BCP-1, committed in origin/main at
    f5087686e/d5fc2117d), pinned two genuinely independent MD5
    implementations (TASK-20260810-3e0793), filed the preimage literature and
    one published MD5 collision path with the path payload quarantined under
    BCP-1 (TASK-20260810-bde128), and obtained two independent reviews: an
    adversarial red team on BCP-1 (TASK-20260810-b9d956, under the pre-committed
    review plan) and an independent validator on the gate package
    (TASK-20260810-23e0ea). This decision closes the batch. It records only
    what the two independent reports support, and nothing about MD5.

  findings:
    - id: F-1
      text: >-
        VALIDATION: passed_with_defects. All five substantive checks passed
        (RFC 1321 vectors re-run 7/7 for both implementations with
        cross-agreement; independence ESTABLISHED for the pinned pair by the
        validator's own library and type inspection; throughput PARTIAL with
        IMPL-3 unmeasured as a named open item; KN-LIT provenance levels all
        match what the records support; firewall INTACT and structurally
        ENFORCEABLE in the committed tree). Defect dispositions follow in F-2.
    - id: F-2
      text: >-
        DEFECT DISPOSITIONS (validator's four, none invalidating):
        DEFECT-1 (minor, input_bytes recorded as 1073741824 where the actual
        total is 1048576000; the throughput figure is computed correctly from
        the actual total) — recorded against the TASK-20260810-3e0793
        artifacts; the pin remains valid for the independence determination;
        correction belongs in a superseding record if the pin is reused, not
        an edit (the artifacts are committed).
        DEFECT-2 (minor, IMPL-2 empty-string digest absent from the
        test-vector report; a 100MB-zeros throughput field sits in the vector
        entry) — recorded as a documentation gap; does not affect the pinned
        pair (IMPL-1/IMPL-3), for which the validator re-ran every vector.
        DEFECT-3 (moderate, TASK-20260810-bde128 ran ~2855 s against a 450 s
        declared ceiling and did not halt at it — an SC-7 violation,
        self-disclosed by the producer) — accepted as a budget outcome about a
        solver (SC-4, core rule 5): never evidence about MD5. Dispatch lesson
        recorded: network-dependent acquisition tasks need either a larger
        declared ceiling or an explicit pre-dispatch amendment; a 450 s
        ceiling is wrong for this class of task.
        DEFECT-4 (minor, BCP-1 cites the staging-rules variable as
        "STAGING_RULES" at lines 262-268; actual name RULES, range 262-269) —
        BCP-1 is immutable once committed; the inaccuracy is carried to BCP-2
        (see F-4); the substance (enforceable exclusion) was verified by the
        validator against the real code.
    - id: F-3
      text: >-
        RED TEAM RESULT, RECORDED AS THE RESULT (not smoothed into a pass):
        BCP-1's blindness guarantee is PARTIAL — real for what it checks
        (ordering, hash intersection, certificate intent), declared for what
        it cannot check (input-manifest completeness, encoding provenance,
        read_scope), and ceremonial for the one channel no file-system rule
        reaches (model parametric prior knowledge). All five named attack
        surfaces succeeded (J1-J5). The named obstruction is MODEL PARAMETRIC
        PRIOR KNOWLEDGE: published MD5 collision paths are in the training
        data of any model this harness can resolve; the contaminated channel
        is the model's parameters, not the repository's file system; and the
        only available discriminator (the null-object control) does not
        separate partial-structure-recall from genuine search. The
        residual-risk concession is judged sound in the failure direction and
        TOO OPTIMISTIC in the success direction: a confounded success can be
        recorded as an unqualified REDISCOVERY-eligible pass.
    - id: F-4
      text: >-
        PROTOCOL CONSEQUENCE: no blind calibration run is dispatchable under
        BCP-1. The top-ranked amendment (J3) is that the canonical
        serialization of pre_registered_expected_answer_digest is undefined —
        four serializations of the same payload yield four digests, so the
        INV-7 pre-dispatch gate is undecidable as written. BCP-1 therefore
        stands FROZEN AND SUPERSEDED-IN-WAITING: a fix is a superseding
        protocol record under a new id (BCP-2) in a later batch, never an
        edit. BCP-2 must at minimum: (a) pin exactly one byte-for-byte
        canonical serialization for the pre-registered digest; (b) implement
        the md5_collision_pair certificate kind in harness/runner.py with the
        two-implementation independence rule before any run dispatches;
        (c) give the null-object comparison a named tolerance and baseline;
        (d) carry the confounding caveat into the evidence record for any
        success; (e) make wall_seconds wrapper-measured rather than
        caller-reported; (f) correct the DEFECT-4 staging-rules reference.
        Manifest-completeness controls and two-session encoding-provenance
        checks may be deferred as declared limitations with the cost named.
    - id: F-5
      text: >-
        COORDINATOR DISPOSITION OF THE b9d956 BLIND_FROM BREACH (the
        reviewer self-attested it): the red team read BCP-1's self_report
        section (lines 651-673, on the blind_from list) before performing the
        blind re-derivation; that section contains budget/timing/scope notes
        with no predicate content (a reviewer can re-verify this against the
        committed file). The rederivation itself cites sections (b) and (c)
        verbatim and its A/B/C tests are mechanically reproducible from the
        committed protocol text. Disposition: the round is ACCEPTED; the
        rederivation joint's independence is DOWNGRADED from blind to
        informed; its result is not load-bearing for the PARTIAL verdict,
        which rests on the five owned joints; no targeted re-derivation is
        commissioned now. If a later batch wishes to cite the blind control
        as clean, a fresh re-derivation task must be dispatched and pass
        tools/check_review_independence.py with no source intersection.
    - id: F-6
      text: >-
        OBJECT C CERTIFICATE PART: UNTESTED, not closed — the
        md5_collision_pair kind does not exist in harness/runner.py's
        _verify() and a genuine collision is infeasible within the review
        budget. This independently confirms BCP-2 amendment (b) as a
        pre-dispatch requirement, not an optimization.
    - id: F-7
      text: >-
        THE RQ's flagged apparent error (the excerpt calling the 2009 result
        "the first PRACTICAL preimage attack") is carried forward EXACTLY as
        TASK-20260810-bde128 found it: UNSETTLED, with reason (Sasaki-Aoki
        2009 primary text unobtainable under the network policy; not settled
        by recollection). Every figure not obtained in primary text remains
        marked unverified.
    - id: F-8
      text: >-
        THE BLIND CALIBRATION SEARCH is OPEN AND UNATTEMPTED in BATCH-46254b:
        excluded by design of this batch's scope, not tried and failed. It
        opens in a later batch, rides its null-object control, and is
        dispatchable only after BCP-2 is frozen.

