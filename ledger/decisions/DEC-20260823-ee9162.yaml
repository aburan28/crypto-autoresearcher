coordinator_decision:
  id: DEC-20260823-ee9162
  context: >-
    Evidence review and official state transition for GOAL-ECQ-002 BATCH-541940,
    the third of four budgeted batches. The batch tested H-ECQ-8b600d - that the
    SELECTION VARIABLE was wrong rather than merely the family, and that
    searching TUPLE space at fixed construction beats searching PARAMETER space
    at fixed tuple. One producer (TASK-20260823-416e78, 13 runs) was snapshotted
    at b6e071e03 by TASK-20260823-1f16e5 and then reviewed by two agents blind to
    each other under a review plan committed before any producer ran: a validator
    (TASK-20260823-e96bb6, joints J1 and J2, verdict FAILED) and a red team
    (TASK-20260823-33a825, joints J3 and J4, J3 breaks_in_part, J4 breaks). This
    decision composes those two reports, adjudicates every objection, judges C1'
    and C2 separately, records the Coordinator's own errors, settles the batch's
    open items, and sets exactly one next action.
    THE HEADLINE IS THE NEGATIVE AND IT IS NOT SOFTENED ANYWHERE BELOW: NO CELL
    WAS TAKEN, ON ANY METRIC, AT ANY THRESHOLD, AND C1' IS NOT MET.

  decision: support
  decision_verb_scope: >-
    READ THIS BEFORE READING THE VERB. `support` names the DIRECTION OF THE
    EVIDENCE on H-ECQ-8b600d's selection-variable claim within the tested scope.
    IT DOES NOT SET THE HYPOTHESIS STATUS TO `supported` and it asserts nothing
    whatever about the campaign's target. The hypothesis moves proposed ->
    analyzed and no further; the reasons it may not move further are R5. A reader
    who takes this verb for a claim that the campaign succeeded has read it
    exactly backwards: the campaign's own criterion, C1', is not met, and the
    intermediate benchmark this program set for itself was missed by +7.4447.

  target_ids:
  - H-ECQ-8b600d
  - GOAL-ECQ-002
  - BATCH-541940
  - EV-ECQ-8ee697

  hypothesis_status_change:
    hypothesis_id: H-ECQ-8b600d
    from: proposed
    to: analyzed
    authority: >-
      Coordinator, per AGENTS.md "Research states". The hypothesis record is
      immutable and is not edited; this decision is the committed record of the
      transition.

  rationale:

  - id: R1
    statement: >-
      NO CELL WAS TAKEN AND C1' IS NOT MET, AND NOTHING HERE APPROACHES IT. The
      best curve this program exhibited at certified rank >= 12 has minimal-model
      naive height 86.77369390941135, against a frozen r >= 12 cell of
      69.33884136527462 (gap +17.4349) and a published construction-class best of
      79.32867457792244 (gap +7.4447). Recomputing the best certified curve per
      threshold from the 5092-curve certified set against a frontier re-derived
      from the frozen snapshot gives cell_taken false on every row. The breadth of
      the negative is stated in the narrower form the red team required: NO CELL
      AT THE TWELVE THRESHOLDS WHERE THIS BATCH CERTIFIED A CURVE, AND NO CURVE AT
      ALL AT THRESHOLDS 13 TO 30. Nothing was submitted, no ICARM endpoint was
      contacted, and the live board was not re-read. A NEAR-MISS IS NOT A RECORD,
      AND NEITHER +7.4447 NOR +17.4349 IS A NEAR-MISS.

  - id: R2
    statement: >-
      THE RUN SET IS VALID AND WAS VERIFIED BEFORE ANYTHING HERE WAS
      INTERPRETED, AND THE VALIDATOR'S FAILED VERDICT IS A CLAIM-LAYER FAILURE
      RATHER THAN A MEASUREMENT-INTEGRITY ONE. Expected run count: 13 of 80,
      contiguous, each with the full six-file record. Manifest schema: complete on
      all 13. Seed integrity: 20260823 in every manifest and every raw result, with
      the exhaustive enumeration reproduced from the stated procedure alone. Raw /
      summary agreement: exact on every recomputable metric; the three
      CONTRADICTED metrics are contradictions of report PROSE by the producer's own
      deliverable. Control comparability: nine validator controls and five red-team
      controls, with the null-object control split and the exclusion asymmetry
      adjudicated at R4. The known-invalid RUN-002 is quarantined COMPLETELY, and
      that was verified rather than assumed. One check failed - 462 attempted
      families dropped with no tuple and no reason - and the validator itself
      established the exclusion is mathematically correct. NO RUN GOES BACK TO THE
      EXECUTOR.
      THIS DECISION AND EV-ECQ-8ee697 ARE THE SUPERSEDING RECORD THE VALIDATOR'S
      `remedy` FIELD REQUIRES: F1, F2 and F3 are corrected against the artifact at
      R4, the per-family search coverage behind the section 2 negative is reported
      at R1 and EV-ECQ-8ee697 OBS-11 and B-2, and the null object for the envelope
      law is cited as validator control C1 at EV-ECQ-8ee697 OBS-5. With this record
      committed, report.md sections 2, 3 and 5 may be cited ONLY as superseded,
      with the corrections attached, and never as the mechanism for anything.

  - id: R3
    statement: >-
      WHAT SURVIVES, INDEPENDENTLY RE-DERIVED RATHER THAN MERELY REPORTED.
      (a) The negative itself is correctly established for the tested scope.
      (b) 86.77369390941135 at certified rank >= 12 was confirmed twice
      independently, on a model the validator PROVED globally minimal, with the
      rank certified in exact arithmetic against four positive board-curve controls
      and three negative controls, stable across four values of l.
      (c) THE TUPLE LEVER IS REAL AND IS NOT A SIZE ARTIFACT: at fixed coefficient
      content the envelope still spans 90 to 120 log units, and the scaling
      quotient that could have manufactured the spread was measured and cleared.
      (d) Every one of the 13391 admissible families carries a multiplicative fibre
      at T = infinity of type I_4 or I_6, capping THIS CONSTRUCTION at 15 rather
      than the generic elliptic-K3 18.
      (e) Ceilings ARE computed per family from its own fibre configuration, the
      generic bound is never read, 13391 of 13391 recompute, and the identity
      ceiling == 18 - sum(m_v - 1) holds on all 13391. THE BATCH-da59ec F1 ERROR IS
      GENUINELY FIXED and that is the cleanest methodological win of the round.
      (f) THE FLAT ARM OF THE HEIGHT LAW PASSES A NULL-OBJECT CONTROL AND IS
      SPECIFIC TO THE CONSTRUCTION, while the steep arm fails one - which is the
      correct polarity, since the surviving half is the half the hypothesis's lever
      rests on.
      (g) THE HYPOTHESIS'S OWN STRONGEST CLAIM - that the envelope minimum is
      governed by the flat-arm intercept - REGRESSES AT R^2 = 0.7732 over n = 13391.
      THE PRODUCER LEFT THAT UNMEASURED AND THE VALIDATOR MEASURED IT. IT IS THE
      BATCH'S BEST POSITIVE RESULT AND IT IS NOT IN report.md. It is recorded here
      as a named finding rather than buried in a list, and it is UNREPLICATED, on
      one implementation, with no run record; its replication is a declared
      component of N1.

  - id: R4
    statement: >-
      WHAT DOES NOT SURVIVE. Each is recorded as SUPERSEDED BY THE REVIEW, never
      quietly dropped; the underlying records are immutable and are not edited.
      (a) "None of the 46 ceiling->=12 families produced a certified rank-12 fibre
      inside the searched T-box" is FALSE. Eight did, producing twelve such fibres,
      including the report's own headline curve. The report contradicts itself. The
      true statement is that no rank-12 fibre was found BELOW 79.32867457792244.
      (b) The section 3 stratification table's fibre column. It is sum(m_v - 1) + 1
      computed, not read, and is mislabelled for 99.64 percent of rows; no family
      has I_8, I_10, I_12 or I_14. Both reviewers found this independently and a
      third re-derivation from the deliverable shows the data carries no
      at-infinity field to read at all. The table's NUMERIC columns survive intact;
      only the mechanism attached to them is wrong.
      (c) "Ceiling stratification explains far more variance than content."
      Backwards by about seven times: content R^2 = 0.19165243721035774, ceiling
      one-way eta^2 = 0.02798. With content and class size matched, every
      high-ceiling class sits at or below the size-matched generic minimum and the
      fitted ceiling coefficient has the OPPOSITE SIGN to the claimed mechanism.
      (d) THE REQUIRED NULL. k = 0 is NOT a null object - it retains roughly half
      the construction's rank, against a matched random-curve null that produced
      zero of 79 curves at rank >= 3 - so the 12-sections-versus-0 contrast WAS
      NEVER TESTED. Two rungs lost over half their intended sample with no
      disclosure and the lost families were persisted nowhere. The "8 sections buy
      as much as 12" reading is UNSUPPORTED, and the sentence that the rank at the
      envelope minima is largely not coming from the construction's sections is
      exactly backwards.
      (e) The r >= 3, 4 and 5 entry at 29.7728 is FROZEN BOARD CURVE id 108
      REDISCOVERED. best_candidates.json flags it correctly; report.md does not say
      so anywhere, and neither did the Coordinator's own multimetric table, which
      listed it as "our best".
      (f) Every "class X produced no rank-12 fibre" statement is scoped to 37.0
      percent coverage of the load-bearing 46 families, 19.8 percent of the
      ceiling-13 class and 8.5 percent of the ceiling-15 class, with six families
      never searched at all, 2114 fibres unsearched, and three runs stopped by wall
      clock. INFRASTRUCTURE OUTCOMES ARE NEVER NEGATIVE MATHEMATICAL EVIDENCE
      (AGENTS.md rule 5) and none is read as one here.

  - id: R5
    statement: >-
      H-ECQ-8b600d MOVES proposed -> analyzed, AND NO FURTHER. WHY IT MOVES AT ALL:
      it was tested against a committed protocol, NEITHER of its declared
      falsification clauses fired, and its central pre-registered comparative
      prediction was confirmed by 22.73 log units - 86.77369390941135 at certified
      rank >= 12 against the generic-rank-selected family's 109.5051651866501
      (EV-ECQ-cbc837 OBS-1) - with the new figure re-derived four times by three
      agents. Recording only the corrections while suppressing that would be its own
      distortion and is refused.
      WHY IT MAY NOT REACH `supported`, and each of these is checkable and none is
      a matter of taste: (i) the mechanism the hypothesis names is REFINED rather
      than confirmed - the tuple moves the envelope through the flat-arm intercept
      (R^2 = 0.7732), not through the coefficient-content statistic the hypothesis
      identifies as the intercept (R^2 = 0.19); (ii) that intercept result is
      UNREPLICATED, on one implementation, with no run record; (iii) the required
      null of the hypothesis's own `required_null` field has still not been run,
      because the rung intended to supply it is not a null object; (iv) the load-
      bearing negative sits at 37 percent coverage; and (v) three load-bearing
      statements of the producer's narrative are false against its own deliverable.
      WHY IT IS NOT WEAKENED OR REJECTED: no falsification clause fired, the lever
      survived the cheapest attack designed to kill it, and the hypothesis's own
      text declares that failing to reach 69.339 is not falsifying. Weakening it on
      a missed benchmark the hypothesis pre-declared as "the informative negative"
      rather than as a falsifier would be reading the record against its own terms.
      `reject_scoped` is additionally forbidden here: the batch supplies no
      refutation artifact, and a scoped rejection on a single unreplicated
      empirical-only result is prohibited outright.

  - id: R6
    statement: >-
      C1' IS JUDGED SEPARATELY AND IS NOT MET. Its four conditions were considered
      independently and THE NUMBERS FAIL FIRST, so the rest are moot but are
      recorded because a criterion whose later conditions are never examined is a
      criterion nobody has tested. (1) FIRST EXHIBITED BY THIS PROGRAM: two of the
      5092 certified curves are on the frozen board (ids 108 and 162), one of which
      the report presented as its own; the rest are not in the snapshot. (2) NOT
      OBTAINABLE BY LOOKUP: NO CREMONA CHECK WAS PERFORMED ANYWHERE IN THIS BATCH,
      and C1' names Cremona's tables explicitly. (3) TAKES A PRE-DECLARED CELL
      AGAINST THE FROZEN FRONTIER: FAILS, by +17.4349 at the one cell H-ECQ-8b600d
      pre-declared, and by no less than +5.4548 on any of the twelve comparable
      rows. (4) AGAINST THE LIVE BOARD RE-READ AT SUBMISSION: not applicable,
      nothing was submitted - correctly, since nothing was eligible. The
      ICARM-verifier clause is separately under-served: the run record carries
      pari_ellrank_r_low = pari_ellrank_r_high = 12, a descent-based determination
      which is the single most relevant field for that clause, and the
      submission-format deliverable drops it.

  - id: R7
    statement: >-
      C2 IS JUDGED SEPARATELY, IS ALREADY MET BY DEC-20260823-51726e WITH FOUR
      RECORDED QUALIFICATIONS, AND IS NEITHER RE-LITIGATED NOR STRENGTHENED HERE.
      Nothing in this batch tested it. Its four qualifications stand unchanged
      (delivered by a reviewer rather than the commissioned producer; a lower bound
      that is also that method's own ceiling; derivation-tier and unreplicated with
      no archived exhibited-point certificate; and closing nothing about C1 or C1').
      Its two standing debts are UNPAID for a third batch: the exhibited-point
      certificate for rank E(Q(T)) >= 11 is still unarchived, and MESTRE-1991-QT11's
      exact Shioda-Tate ceiling has still not been recomputed from its own fibre
      configuration. R3(d) bears on the second without substituting for it: every
      admissible family of this construction is capped at 15, which is consistent
      with that recomputation and is not it.
      NEITHER CRITERION IS CLOSED BY IMPLICATION FROM THE OTHER, IN EITHER
      DIRECTION.

  - id: R8
    statement: >-
      THE MEASURED OBSTRUCTION IS A DENSITY-AND-RATE STATEMENT, NOT A CLOSED
      LEVER, AND IT IS NOT THE OBSTRUCTION THE REPORT NAMES. Stated as a quantity
      with a value and a scope, per the closure standard: (i) in an exhaustive
      census of admissible canonical tuples of spread <= 74, only 90 of 13077
      (0.688 percent) have Shioda-Tate ceiling >= 13, and across all strata exactly
      ONE ceiling->=13 family has log P2 below 5, two below 6 and twelve below 7,
      with min log P2 4.9652 and median 8.0488; (ii) among 296 searched
      ceiling->=13 fibres below h = 80, zero reached rank 12 and four reached rank
      11, against a measured P(rank >= 12) of 0.002 at h in [80, 90], 0.006 at
      [90, 100] and 0.044 at [100, 120] - at 296 draws a rate of 0.002 predicts 0.6
      successes, SO THE SUB-80 ZERO IS CONSISTENT WITH THE RATE AND IS NOT
      INFORMATIVE ABOUT IT; (iii) the construction's own cap is 15.
      THE UNTESTED REGION IS HIGH CEILING AT LOW CONTENT, and the reason it is
      untested is that it is nearly unpopulated in the census enumerated so far -
      one family below log P2 = 5 in 13077. THAT IS A QUANTITY, AND IT REPLACES THE
      ADJECTIVE. This campaign has twice been re-aimed on the word "soft" with no
      quantity behind it; the successor batch inherits a number instead.
      FORWARD GUIDANCE, which the closure standard requires and which this
      obstruction supplies: change WHAT IS ENUMERATED rather than searching the same
      census harder, using the free squarefree-discriminant pre-filter the
      obstruction itself hands over - one resultant on a degree-20 polynomial,
      cheaper than a single one of the 73 height evaluations it replaces, cutting
      the exhaustive measurement set from 13077 to 90.

  - id: R9
    statement: >-
      COORDINATOR ERRORS, RECORDED BECAUSE THE PROGRAM'S AUDIT TRAIL IS WORTH MORE
      THAN THIS ROLE'S RECORD LOOKING CLEAN. (a) THE MULTIMETRIC TABLE LISTED A
      REDISCOVERED BOARD CURVE AS "OUR BEST" at r >= 5, and its "closest approach
      anywhere, +0.60 on log conductor" is therefore the board's own curve found
      again rather than this program's approach. Both reviewers caught it unaided
      and the Coordinator did not apply its own standing precaution to its own
      table. The r >= 2 row (25.4297) has NOT had the same check and may not be
      quoted until it does. (b) THE FALSE "none of the 46" CLAIM WAS RELAYED TO THE
      USER AS THOUGH IT WERE A RESULT and has since been corrected to the user; the
      correction is recorded here because a correction that lives only in a
      conversation is not a correction. (c) A FALSTINGS FALSE POSITIVE WAS GENERATED
      AND THEN KILLED BY ITS OWN AUTHOR - Faltings 2.284 against the r >= 10 cell
      2.511 - and it is recorded rather than buried: the convention reproduces the
      board's published value for 156 of 156 curves with disc > 0 and 0 of 133 with
      disc < 0, the candidate has disc < 0 and its incumbent disc > 0, so the
      incumbent side was right and the candidate side was not, which is exactly how
      a spurious record claim gets made. (d) NO EXP-* CONTRACT EXISTS FOR THIS
      CAMPAIGN, for the FOURTH consecutive batch, after DEC-20260823-51726e and
      DEC-20260823-839fc6 each made it a declared component of the action the next
      batch was executing. Charged to the Coordinator. (e) THE PRIOR RECORD THAT
      THE DISPATCHER'S COMPLETED-ARCHIVE CHECK IS UNSATISFIABLE UNDER DURABILITY
      COMMITS IS WRONG AND IS SUPERSEDED HERE. binding_mode content_first is the
      SUPPORTED path, not a workaround: CLAUDE.md binds archive receipts to CONTENT
      first and treats commit reachability as advisory, and this batch's snapshot
      archive passed under it with all 100 declared digits verified against the
      tree and the commit real, reachable and carrying its declared parent. The
      note carried in ledger/goals/GOAL-ECQ-002/goal.yaml
      latest_verified_commit_note and in CORRECTION-archive-completed-verification.md
      is superseded by reference and must not be repeated. Those records are
      immutable and are not edited.

  - id: R10
    statement: >-
      THE THREE RECORDED PRIORS, JUDGED AS THE REVIEWERS GAVE THEM, INCLUDING THE
      ONE THAT VINDICATES THE COORDINATOR. Recording only the corrections would be
      its own distortion.
      P1 (tuple choice moves the envelope substantially) - RIGHT, BY MORE THAN
      PREDICTED, AND NOT A DESIGNED ARTIFACT. Raw spread 220.26041937735616, and
      the size-artifact hypothesis is refused by the data: at essentially fixed
      coefficient content the envelope still spans 90 to 120 log units with IQR 25
      to 34, and the exact scaling symmetry that could have manufactured spread was
      quotiented soundly and the quotient measured to be information-preserving.
      The red team states explicitly that the measurement was not designed to
      satisfy the prior. This was the prior most at risk, it predicted success, and
      it held.
      P2 (best tuple lands near 79 and does not reach the r >= 12 cell) - HELD.
      Best at certified rank 12 is 86.7737, above both 79.32867457792244 and
      69.33884136527462. No cell is claimed, so the review-breakthrough escalation
      is not triggered.
      P3 (the required null shows clearly higher envelopes) - HELD AT THE BOTTOM
      RUNG ONLY, AND FOR A SMALLER RANK CONTRAST THAN SUPPOSED. k = 0 is worse by
      +25.95 log units of adjusted mean residual with a clean interval
      [+21.18, +30.63], so the premise does not collapse and P3's `if_contradicted`
      branch IS NOT TRIGGERED AND MUST NOT BE REPORTED AS TRIGGERED. But the ladder
      is not monotone (k = 4 is better than k = 6, +21.56 with CI [+8.59, +32.78]),
      and the bottom rung retains roughly half the construction's rank, so "rank
      buys something" is demonstrated for the step from about 11 to about 5 and is
      UNTESTED for the step to 0.

  - id: R11
    statement: >-
      O-BATCH-DOCS-UNBOUND IS SETTLED FOR THE CAMPAIGN, AND WHAT WAS ACTUALLY
      MISSING WAS THE MECHANISM RATHER THAN THE RULE. The rule already existed:
      DEC-20260823-839fc6 R11(a) settled that batch-level Coordinator documents ARE
      content-bound, and that the binding archive is the batch's LEDGER archive.
      IT WAS NOT HONOURED THIS ROUND, and the reason is that the ledger archival
      task's declared artifact_paths in dispatch_queue.json listed four paths and
      named none of the batch-level documents, so the role bound by the rule had no
      declared slot in which to honour it. SETTLED, in three parts.
      (a) THE RULE, restated and unchanged: review_plan.yaml, every CORRECTION-*.md
      and COORDINATOR-*.md at batch level, and the orchestrator digest supply files
      are content-bound by that batch's ledger archive receipt. dispatch_queue.json
      is excluded because the dispatcher writes into it after the commit;
      dispatch_plan.* are generated and gitignored.
      (b) THE MECHANISM, which is new and is the part that failed: a batch's ledger
      archival task must LIST those documents in its dispatch_queue.json
      artifact_paths at queue-creation time, and the orchestrating session must
      supply their digests alongside the review digests. A rule with no declared
      slot is not enforceable by the role it binds.
      (c) THIS BATCH: the receipt for TASK-20260823-bd5f2f declares them and the
      orchestrating session is asked to supply their digests. If the
      verify-and-commit gate refuses the superset, it must record the two held-back
      COORDINATOR documents as UNBOUND rather than silently dropping them, and the
      item stays open for a third time as an archive-integrity defect rather than a
      paperwork one.

  - id: R12
    statement: >-
      THE REVIEW PLAN AGAIN OMITTED A proves_too_much CONTROL AND A
      blind_rederivation DECLARATION, for the second consecutive batch, and both
      reviewers supplied them unprompted anyway. The validator ran a proves-too-much
      control on the ceiling code against an object whose conclusion is known
      (Mestre's published tuple A, rank >= 11 over Q(T), assigned ceiling 15 -
      consistent, where a ceiling below 11 would have falsified it) and declared a
      blind re-derivation. The red team ran a proves-too-much control it was not
      assigned, on the section 3 mechanism applied to its own ceiling-11 row, and
      found the mechanism already fails inside its own table; and it declared its
      blind re-derivation HONESTLY AS NOT FULLY BLIND, since it had read surface.py
      and measure.py before writing its own implementation. OBTAINING THE SUBSTANCE
      BY THE REVIEWERS' OWN DISCIPLINE IS NOT A PROCEDURE. A Coordinator failure,
      recorded, binding on the next batch's plan. What the round DID do right is
      recorded with equal weight: the plan was committed before any producer ran,
      carried three priors and a pre-committed disbelief list, and assigned one
      owner per joint, and both reviewers attested to reading no sibling artifact.

  - id: R13
    statement: >-
      THE COORDINATOR'S OWN DISBELIEF THRESHOLD WAS MIS-SPECIFIED AND IS CORRECTED
      HERE SO THE NEXT REVIEW PLAN INHERITS THE CORRECTED FORM. P1 instructed
      reviewers to disbelieve "ANY REPORTED ENVELOPE BELOW 79.329". That compares a
      rank-UNCONDITIONED envelope minimum against a rank-12 board record: followed
      literally it flags 1489 non-events, and the 25.43 minimum is a rank-2 curve
      that beats nothing, since the r >= 1 cell sits at 11.6136 and the r >= 2 cell
      at 13.5255. THE CORRECTED TARGET IS "ANY REPORTED HEIGHT BELOW THE FROZEN
      FRONTIER VALUE AT THE CERTIFIED RANK CLAIMED", AND THAT TARGET HAS ZERO HITS.
      The red team held the Coordinator to this and is right. The SECOND HALF of
      the same instruction - "check it is not simply a board curve rediscovered" -
      DID fire, on a real case at ranks 3 to 5, and was surfaced by neither the
      producer nor the Coordinator. The precaution was well founded; the threshold
      in it was not.

  - id: R14
    statement: >-
      THE TWO REMAINING SNAPSHOT-RECEIPT OBSERVATIONS ARE CLOSED AS IMMATERIAL,
      WITH THEIR RESIDUALS NAMED. NEITHER WAS ADJUDICATED BY EITHER REVIEWER and
      that is stated rather than glossed. O-RUN-012-013-IDENTICAL: runs 012 and 013
      share command.txt and raw-result.json byte for byte, the latter equal to the
      declared deliverable, while their manifests and stdout differ; the innocent
      reading is a deterministic deliverable rebuild reproducing byte-identically,
      which is a reproducibility datum in the batch's favour, and the deliverable's
      content is independently verified regardless because all 30 of its rows were
      recomputed. O-RUN-009-STREAMS: run 009 has an empty stdout and a non-empty
      stderr, a complete six-file record, a non-empty raw result, and carries no
      deliverable number and no timeout claim; any infrastructure event there would
      be infrastructure signal and never negative mathematical evidence. CLOSED.
      RESIDUALS: no manifest records which stream the harness routes diagnostics
      to, and NO MANIFEST ANYWHERE CARRIES supersedes / superseded_by for a third
      consecutive batch, so a reader of RUN-002's manifest alone still sees
      completed_valid on a known-invalid run.

  - id: R15
    statement: >-
      ARTIFACT-SIZE POLICY, DECIDED HERE RATHER THAN LEFT TO BE SET SILENTLY BY AN
      ARCHIVE. This batch committed 343984576 bytes (328.0 MiB) across 100 files,
      with three files above 44 MB (75, 75 and 59 MB) and three more above 2 MB.
      NOTHING IS DONE RETROACTIVELY AND NOTHING IS REWRITTEN: the blobs are already
      in pushed history and in every clone, so compressing them now would shrink
      nothing while breaking digests two blind reviewers read at a fixed sha, and
      rewriting history over pushed run records is forbidden outright. The only
      cost-free moment to act was before the producer wrote, and it has passed.
      THE FORWARD RULE, binding from the next producer handoff onward:
      (a) every producer handoff carries an explicit artifact_size_budget field
      beside its wall-clock, memory and run budgets;
      (b) the declared default is a committed per-batch producer artifact total of
      at most 25 MiB with no single committed file above 5 MiB;
      (c) a handoff may exceed either figure only by declaring the exception and
      its reason in the same field before the producer runs;
      (d) raw scans that would exceed it are reduced AT SOURCE - emit per-family
      summary rows rather than per-fibre dumps - or retained out of band with their
      sha256, row count and exact regeneration command recorded in the run record;
      (e) what is never capped: manifest.yaml, command.txt, environment.json,
      stdout.log, stderr.log and a machine-readable summary of results. The
      artifact policy's required contents are not negotiable against size;
      (f) the Coordinator refuses its own handoff if artifact_size_budget is null,
      exactly as it already must for a null wall-clock or run budget.
      The figures in (b) are a declared default chosen so that this batch's three
      declared deliverables would have passed while its three raw dumps would have
      required an exception; they are not a measured optimum and a later decision
      may revise them on evidence.

  - id: R16
    statement: >-
      THE THREE REMAINING VALIDATOR FINDINGS, EACH WITH A DISPOSITION.
      F6, 462 families dropped with no per-family record: THE EXCLUSION IS
      MATHEMATICALLY CORRECT and the validator established that independently -
      all 248 missing admissible tuples at spread <= 56 have -16(4A^3 + 27B^2)
      identically zero in T and carry no elliptic surface. What is missing is the
      coverage record, which is an artifact-policy and rule-8 defect. REMEDY,
      binding on the next producer: persist EVERY attempted row with a status and a
      reason; never let a dropped row fall into an arithmetic difference between
      "attempted" and "measured".
      F7, the benchmark 79.329 is a rounded transcription of 79.32867457792244
      rounded in the direction that makes it easier to beat: immaterial against a
      +7.4447 miss, and recorded because it is exactly the class of number the
      review plan's own pre-committed disbelief names. THE EXACT VALUE
      79.32867457792244 IS USED THROUGHOUT THIS DECISION AND EV-ECQ-8ee697, and the
