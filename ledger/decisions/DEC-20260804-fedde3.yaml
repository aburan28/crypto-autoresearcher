  context: >-
    BATCH-103: Worst-k analysis. x([k_max]G) distributed generically. EC excess
    roughness is global, not localized. No algebraic handle for H-PSEUDO proof.

  decision: record_and_continue
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    The worst DFT frequency k_max has [k_max]G with x-coordinate distributed
    uniformly across [0,p-1] — not near the factor base. The excess C_EC > C_random
    is a global property of the EC multiplication sequence.

    COMPREHENSIVE H-PSEUDO PICTURE after BATCH-103:
    1. C_EC ~ p^{0.079} (growing slowly, much larger than random at large p)
    2. C_EC > C_random (EC sequences less flat than random bijections)
    3. Worst-k is generic (no algebraic structure at [k_max]G)
    4. 9 proof approaches closed
    5. H-PSEUDO proved for k=2 MOV curves only

    The EC group law creates a specific global correlation structure that makes
    the small-x indicator less Fourier-flat than a random bijection. This correlation
    has no simple algebraic description (the worst k has no special structure).

    GOAL-ECDLP-001 stays active.

  exact_next_action: >-
    BATCH-104: Pivot to a fundamentally different approach — instead of proving H-PSEUDO,
    try to find a COUNTER-EXAMPLE. If H-PSEUDO is false for some specific EC curve and
    prime, this would be a major finding (potentially showing sub-rho ECDLP is achievable).
    Search systematically: for which (p, E, B_frac) does C(p, E) take its maximum value?
    Is the maximum bounded by some function of p, or can it grow arbitrarily for
    adversarially chosen curves?

  knowledge_promotion:
