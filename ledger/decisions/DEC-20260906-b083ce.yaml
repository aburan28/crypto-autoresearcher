coordinator_decision:
  id: DEC-20260906-b083ce
  recorded_at: '2026-09-06'
  context: >-
    Repair of one of the six administrative blocks DEC-20260807-5adc24 opened
    (decision: pause) on 2026-08-07. That decision found EXP-JMV-001 (version
    2, no separate handoff record exists in ledger/handoffs/ for this
    experiment -- unlike the four fabricated-citation experiments, it was
    never dispatched to an Executor at all) carries, inside its own frozen
    specification.yaml, `approved_under: "DEC-20260726-001 ... and
    DEC-20260726-003"`. Both cited decisions exist as real, committed files.
    This session independently read both in full: DEC-20260726-001 (decision:
    pause) concerns EXP-FCP-001, a fixed-curve preprocessing pilot under
    RQ-ECDLP-001, and DEC-20260726-003 (decision: weaken) concerns
    EXP-FCP-002/EXP-FCP-003 and H-FCP-001. Neither mentions JMV,
    arXiv:math/0411378, H-JMV-001, H-JMV-002, or RQ-JMV-001 anywhere. A
    repository-wide grep for "JMV" across every file in ledger/decisions/
    returns zero hits. OPTION A applies: no real prior Coordinator approval
    for EXP-JMV-001 exists anywhere, under any citation. This decision
    re-runs the approval act with a genuine, checkable Coordinator review,
    citing itself.
  decision: approve
  target_ids:
    - EXP-JMV-001
    - H-JMV-001
    - RQ-JMV-001
    - DEC-20260807-5adc24
  rationale:
    - >-
      RE-VERIFICATION. DEC-20260726-001 and DEC-20260726-003 were each read
      in full and confirmed to be FCP-lineage records with zero JMV content,
      exactly as DEC-20260807-5adc24 found. A repository-wide grep for "JMV"
      across ledger/decisions/ returns nothing. No real approval exists
      under any identifier.
    - >-
      A BROADER RELATED DEFECT WAS FOUND AND IS RECORDED, NOT REPAIRED HERE.
      ledger/questions/RQ-JMV-001.yaml itself carries `admitted_by:
      DEC-20260726-001` and lists EXP-JMV-001/EXP-JMV-004 as
      `approved_experiments... of DEC-20260726-001` -- the SAME false
      citation, in the same record class DEC-20260807-5adc24 was written to
      repair, but on the research-question record rather than the
      experiment or a handoff. This decision does not edit RQ-JMV-001 (out
      of this session's write_scope and out of the six-experiment repair
      this decision is part of) but names the defect explicitly so it is not
      mistaken for a citation this decision's approval depends on: this
      decision's approval rests on its OWN fresh review below, never on
      RQ-JMV-001's fabricated citation.
    - >-
      FRESH SCIENTIFIC REVIEW. H-JMV-001 makes a narrow, well-bounded claim
      about a transcription discrepancy in a published table, with an
      unusually rigorous internal control structure: control C1 gates every
      conclusion on independent review of the held transcription BEFORE any
      erratum language may be used, and the contract's own invalidation_rules
      forbid the words "verified", "confirmed", or "finding" before that gate
      completes. This is exactly the discipline docs/claims-and-verification.md
      requires for a claimed error in external, non-program work.
    - >-
      CONTROLS. CTRL-ORDER-PRIME and CTRL-ORDER-KOBLITZ independently verify
      curve order before using it (the Koblitz control DERIVES the order
      from an integer Lucas recurrence, strictly stronger than trusting the
      published n); CTRL-CM-KOBLITZ and CTRL-HASSE are exact
      self-consistency checks; CTRL-FIG1-ROWCHECK requires primality AND
      maximality checks, not merely a product identity, before any row may
      be reported as reproducing or contradicting the source. Every
      contradicted row requires a machine-checkable counterexample
      certificate independently re-verified by code sharing nothing with the
      run script -- satisfying docs/claims-and-verification.md's refutation-
      artifact standard before any adverse claim about a published paper is
      recorded.
    - >-
      CLAIM-TIER AND SCOPE DISCIPLINE. claim_boundary explicitly disclaims
      any statement about dlog difficulty, Theorem 1.1, Corollary 1.2, or
      GRH; the contract forbids attaching this work to GOAL-ECDLP-001 or
      GOAL-CRYPTO-001, from which RQ-JMV-001 is deliberately detached, and
      forbids emitting a CORR- record for any Figure 1 discrepancy (per
      DEC-20260726-003's real, if misattributed-elsewhere, part A/B/C
      framework this record itself describes accurately).
    - >-
      RESOURCE FIT. RQ-JMV-001 is a standalone track (goal_attachment: NONE,
      by explicit structural design, not merely budgetary) with its own
      small, bounded budget (2 CPU-hours / 10 runs total across EXP-JMV-001
      and EXP-JMV-004 branch (a); this experiment alone is capped at 1
      CPU-hour, 5 runs, 4GB). It consumes no goal campaign budget, so no
      GOAL-MLKEM-001-style budget-closure conflict arises here.
    - >-
      A LATER-DESIGNED, NOT-YET-APPROVED SUCCESSOR IS RELEVANT CONTEXT, NOT
      A BLOCKER. H-JMV-71b222 / EXP-JMV-80e0c7 (designed 2026-08-25, status
      `review_required`, `approved_by: null`) exists specifically to
      double-transcription-verify the load-bearing inputs H-JMV-001 and
      H-JMV-002 declare unverified. This does not defeat approval of
      EXP-JMV-001: EXP-JMV-001's own C1/C1b controls already gate every
      conclusion on an equivalent independent-reviewer check, and its
      underlying arithmetic (recomputing t, d_pi, and the conductor from
      PUBLISHED NIST/IETF curve constants) does not depend on what JMV's
      Figure 1 turns out to say -- only the per-row "reproduces Figure 1"
      verdict does, and that verdict is already correctly gated. Running
      EXP-JMV-001 does not risk wasted compute even if EXP-JMV-80e0c7 is
      run later or first.
    - >-
      No defect was found in the contract's design, controls, budget, or
      scope beyond the fabricated citation this decision repairs.
  evidence_refs:
    - ledger/decisions/DEC-20260807-5adc24.yaml
    - ledger/decisions/DEC-20260726-001.yaml
    - ledger/decisions/DEC-20260726-003.yaml
