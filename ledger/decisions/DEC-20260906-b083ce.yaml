  limitations:
    - >-
      This decision approves the SCIENCE and repairs the administrative
      provenance gap only. It does not edit
      experiments/EXP-JMV-001/specification.yaml (status currently `paused`
      per the 2026-08-08 status_enactment_note) and does not flip any
      execution-authorization flag or dispatch an Executor; this session's
      write_scope is ledger/decisions/ and ledger/corrections/ only.
    - >-
      RQ-JMV-001's own `admitted_by` and `approved_experiments` fields
      remain, as committed, citing DEC-20260726-001 -- a false citation of
      the same class this repair effort exists to fix. This decision does
      NOT correct that record (it is not one of the six target contracts
      this repair effort covers, and editing it is outside this session's
      write_scope and outside its authorized task). A future Coordinator
      session should author a CORR- record for RQ-JMV-001 naming this
      finding; it is recorded here as an explicit next_action so it is not
      lost.
    - >-
      UNLIKE THE OTHER FIVE EXPERIMENTS IN THIS REPAIR EFFORT, no
      ledger/handoffs/ record was ever filed for EXP-JMV-001's dispatch, so
      there is no false `authorized_by` field to leave visibly uncorrected
