    continued running silently with no further roots.jsonl.gz writes until
    the confirmed reboot (a genuine run duration as long as ~45.3min). No
    telemetry survives a whole-environment restart by definition. This record
    states this plainly as genuinely unknown, bounded only by [~2.9min,
    ~45.3min], rather than manufacturing either narrative.
    THIS RECORD ALSO STATES PLAINLY that run duration and detection-gap size
    vary INDEPENDENTLY of each other across this lane's history, and that
    this sixteenth restart is itself the clearest demonstration of that
    independence to date: the fifteenth restart (RUN-FROB-d05e7a) combined a
    LONG confirmed duration (~44.8min floor) with a SHORT gap (~5min), giving
    a NARROW ambiguity range [~44.8min, ~49.8min]; this sixteenth restart
