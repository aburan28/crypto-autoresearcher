  the_decision_stated_plainly: >-
    RUN-FROB-5fa3f0's interruption is diagnosed, honestly and without
    fabrication, as the SAME failure mode that destroyed RUN-FROB-39714f,
    RUN-FROB-f3e2a3, RUN-FROB-16ecb6, RUN-FROB-5490f1, and RUN-FROB-0b1c8e: a
    whole-environment/container restart external to any script's own
    control, external to any timeout wrapper (there was none this time
    either), and external to any code defect in driver-v2.py/checker-v2.py.
    This is now the SIXTH, CONSECUTIVE instance of the identical
    infrastructure failure mode under the same, already-corrected source and
    launch procedure, launched correctly by the dispatching session every
    time. The full observed interval sequence is ~20min, ~11min, ~9min,
    ~7min, ~4min, ~5min. This record records that sequence honestly and
    corrects the framing carried forward in the two immediately preceding
    decisions: through five points the interval had looked strictly
    shrinking, and this record's own predecessors said so; the sixth point
    (~5min, longer than the fifth's ~4min) breaks that monotonic pattern.
    The interval is better characterized as noisy/stochastic, falling
    roughly in a 4-20 minute range, than as a deterministic countdown toward
    zero. This corrected characterization is recorded here because it is the
    true fact pattern, not because it changes what this record authorizes --
    it remains, like all six interruptions themselves, infrastructure
    signal, never negative mathematical evidence (AGENTS.md core rule 5 /
    CLAUDE.md rule 3), and this record does NOT condition its own
    authorization on any reading of the interval sequence, shrinking,
    noisy, or otherwise. The user has reaffirmed the standing instruction to
    keep retrying automatically through this exact failure mode twice
    already, and this coordinator's role is to execute that instruction
    faithfully via a proper decision record, not to second-guess it. All six
    instances remain non-scientific, non-protocol infrastructure signal;
    none says anything about H-FROB-73df22. On that basis, this coordinator
    (1) preserves RUN-FROB-5fa3f0's directory exactly as it stands -- its
    real partial roots.jsonl.gz (34530589 bytes) and the three further
    hashed files, the three confirmed-empty files (stderr.log, stdout.log,
    tuples.jsonl.gz), with no execution-receipt.json authored for it,
    because the absence of one IS the honest record of what happened, not a
    gap to be papered over -- and (2) authorizes a fresh retry under a
    fresh, pre-minted run_id, RUN-FROB-35c3b1, via a fresh
    trial-plan-stage0-v10.json, a fresh run-binding, and a fresh launch
    handoff to the Executor (TASK-20260921-5286e8), per the user's standing
    instruction to keep retrying automatically through this exact failure
    mode.

  rationale:
    - >-
      SIXTH, CONSECUTIVE INSTANCE OF THE SAME FAILURE MODE, STILL
      INFRASTRUCTURE/PROTOCOL SIGNAL, NEVER NEGATIVE MATHEMATICAL EVIDENCE,
      PER AGENTS.md CORE RULE 5 / CLAUDE.md RULE 3. RUN-FROB-5fa3f0 is not a
      new, eighth failure mode; it is a REPEAT of RUN-FROB-39714f's,
      RUN-FROB-f3e2a3's, RUN-FROB-16ecb6's, RUN-FROB-5490f1's, and
      RUN-FROB-0b1c8e's own whole-environment-restart mode -- entire process
      tree destroyed, including the Python supervisor that would have
      written execution-receipt.json, before that supervisor's own
      completion/receipt-writing logic could run at all. This is the EIGHTH
      interruption overall in this lane's history and the SIXTH consecutive
      occurrence of the identical infrastructure failure mode under the
      same, already-corrected source and launch procedure. Six-for-six
      launch attempts under driver-v2.py/checker-v2.py have now been killed
      by whole-environment restarts, all non-scientific, non-protocol
      infrastructure signal. Neither RUN-FROB-5fa3f0, RUN-FROB-0b1c8e,
      RUN-FROB-5490f1, RUN-FROB-16ecb6, RUN-FROB-f3e2a3, nor RUN-FROB-39714f
      says anything about H-FROB-73df22, RQ-FROB-7d8dd4, or whether
      Frobenius structure moves the index-calculus exponent.
    - >-
      CORRECTED CHARACTERIZATION OF THE INTERVAL SEQUENCE, RECORDED HONESTLY
      RATHER THAN CARRIED FORWARD BY DEFAULT. DEC-20260921-fd5bf1 and
      DEC-20260921-1988f5 each characterized the observed restart interval as
      "strictly shrinking" / "sharply worsening" on four and five points
      respectively (~20, 11, 9, 7min, then ~20, 11, 9, 7, 4min). The sixth
      point (~5min) is longer than the fifth (~4min), so a strictly
      monotonic-shrinking description is no longer accurate as of this
      record. This decision records the corrected, honest characterization:
      the six observed intervals (~20, 11, 9, 7, 4, 5 minutes) are better
      described as a noisy/stochastic restart interval in roughly a 4-20
      minute range than as a deterministic countdown. This correction is
      made because AGENTS.md core rule 5 and core rule 9 both require an
      honest fact pattern, not a favorable one, and because a reader relying
      on this lane's history to plan future mitigation (e.g. any
      checkpoint/resumable redesign, or any monitoring-cadence tuning) needs
      the true shape of the distribution, not an extrapolation that the
      newest data point has already falsified. This correction changes no
      authorization in this record: like the six interruptions themselves,
      the interval sequence, under either the old or the corrected framing,
      remains infrastructure signal only, never negative mathematical
      evidence, and this record does not condition RUN-FROB-35c3b1's
      authorization on any reading of it.
    - >-
      NO FABRICATED RECEIPT. This decision does NOT author an
      execution-receipt.json for RUN-FROB-5fa3f0, and does not construct,
      estimate, or infer one from the partial roots.jsonl.gz or from what a
      graceful interruption receipt would ordinarily contain. Per AGENTS.md
      core rule 5 ("Never fabricate commands, outputs, timings, statistics,
      citations, or runs. Missing data stays missing and is reported as
      such."), the honest record of RUN-FROB-5fa3f0 is exactly what is on
      disk: real partial output (roots.jsonl.gz, 34530589 bytes), three
      further hashed adapter/launch files (command.txt, environment.json,
      launch.json), three confirmed-empty files (stderr.log, stdout.log,
      tuples.jsonl.gz -- all the well-known empty-file sha256), and a
      documented absence of every downstream adapter/checker artifact,
      because the process that would have produced them was destroyed before
      it could run. RUN-FROB-5fa3f0's directory, as it stands right now, is
      preserved as-is by this decision. No file within it is edited,
      completed, or backfilled by this record.
    - >-
      THE RUNTIME LOCK BEING CITED REMAINS THE SAME, STILL-CURRENT, STILL-
      UNEDITED, LAUNCH-AUTHORIZED LOCK. This coordinator independently
      re-read linux-runtime-lock-successor-20260914-c85f6a.json in full in
      this engagement and reconfirms scientific_launch_authorized: true and
      its content sha256
      46d918a1a4b9d358df39f09a87d5221128cc1ce19cb62672bc35204785952eb5,
      cross-checked against trial-plan-stage0-v9.json's own and
      run-binding-stage0-v9-retry-20260921.json's own already-filled
      runtime_lock_sha256 fields (all agree). Nothing about the runtime, its
      guards, or its authorization changes here; a sixth whole-machine
      restart is not evidence the runtime lock's own guards were inadequate
      -- the failure is again a whole-machine restart, a class of event no
      per-process guard in linux-runtime-lock-successor-20260914-c85f6a.json
      claims to protect against, and this record does not construct a new
      claim that it does.
    - >-
      WATCHDOG SIZING RATIONALE REMAINS VALID, UNCHANGED. No run in this
      lane has ever shown signs of hanging or needing a shorter or longer
      watchdog; all eight interruptions observed to date have each been
      either an instant application-level error, an external interruption
      from this lane's own now-corrected tooling, or (six times now) an
      infrastructure restart external to any process's own control -- never
      a hang. 86400 seconds remains sized generously above the only real
      duration signal available and remains a ceiling meant never to bind in
      the normal case, machine protection only per CLAUDE.md "Research
      budgets: progress first."
    - >-
      DIRECTION CHECK, unchanged from the whole DEC-20260909-bf5b48 ..
      DEC-20260921-1988f5 chain. Stage0 is not itself exponent-moving; it is
      the correctness gate for H-FROB-73df22's two arms. No scientific claim
      of any kind is advanced by this admission/retry-authorization record.
      FROB is a declared ECC area (orchestration/research-priority.yaml line
      79), ranked ahead of non-ECC candidates at every selection point, with
      unlimited batch/wall-clock budget per AGENTS.md "ECC comes first."
    - >-
      BUDGET. Per CLAUDE.md "Research budgets: progress first" (2026-09-06):
      research cost estimates are advisory and require no repeated user
      approval; the Coordinator continues justified work within the
      authorized research scope. No 90-day stagnation review is active or
      warranted -- this lane has shown continuous documented progress across
      DEC-20260909-bf5b48 through DEC-20260921-1988f5 and now this record,
      all within roughly two weeks, including six genuine, correctly-
      executing partial runs each destroyed only by infrastructure external
      to this program's own control. Authorizing a further retry after a
      sixth, consecutive infrastructure-only interruption is exactly the
      kind of routine continuation CLAUDE.md's "progress first" instruction
      protects, not a new spending decision requiring fresh justification.
      This is additionally, and explicitly, covered by the user's own
      standing instruction, relayed by the dispatching session, to keep
      retrying automatically through this exact recurring failure mode --
      stated TWICE already. This coordinator's role is to execute that
      instruction faithfully via a proper decision record, not to
      second-guess it. A whole-machine restart mid-run is squarely within
      "watchdog expiry checkpoints a task; it does not exhaust the
      campaign."
    - >-
      NA-4's INFRASTRUCTURE-DIAGNOSIS RECOMMENDATION REMAINS OUTSTANDING AND
      IS REAFFIRMED, NOT RE-OPENED AS A NEW GATE. DEC-20260921-1988f5's own
      NA-4 recommended, non-blockingly, that the dispatching session open a
      dedicated infrastructure-diagnosis task once the five-for-five trigger
      DEC-20260921-fd5bf1 itself named was met. This record has not been
      told, and does not assume, that this diagnosis task has been opened,
      run, or completed; nothing in the materials reviewed for this record
      reports its status. A sixth consecutive instance of the identical
      failure mode is further, unambiguous reinforcement that this
      diagnosis remains worth pursuing, and this record reaffirms
      DEC-20260921-1988f5's NA-4 rather than re-litigating or escalating it
      into a new condition -- it still runs in PARALLEL with, and never
      blocks, the retry authorized here.

