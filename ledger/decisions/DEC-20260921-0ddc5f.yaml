coordinator_decision:
  id: DEC-20260921-0ddc5f
  decided_by: coordinator
  decided_at: '2026-09-21'

  context: >-
    Continuation of the EXP-FROB-d8aa37 stage0 launch lane, immediately
    following DEC-20260921-1988f5's diagnosis of RUN-FROB-0b1c8e's
    interruption (FIFTH, CONSECUTIVE whole-environment restart) and its
    authorization of trial-plan-stage0-v9.json under a fresh run_id,
    RUN-FROB-5fa3f0. The dispatching session claimed TASK-20260921-88ba0f
    and launched RUN-FROB-5fa3f0 correctly -- correct PATH, genuinely
    backgrounded, no external tool-call-duration timeout wrapper.
    RUN-FROB-5fa3f0 was ALSO interrupted, by the exact same failure mode: a
    SIXTH, consecutive whole-environment restart, independently confirmed by
    the dispatching session via /proc/uptime showing the machine had been up
    only ~10.75 seconds when checked. This one lasted approximately 5
    minutes -- notably LONGER than the fifth (~4 minutes), breaking what had
    looked, through five points, like a strictly shrinking interval pattern.
    The full interval sequence across all six attempts under
    driver-v2.py/checker-v2.py is now: ~20min, ~11min, ~9min, ~7min, ~4min,
    ~5min. This record corrects the characterization carried in
    DEC-20260921-fd5bf1 and DEC-20260921-1988f5 ("sharply shrinking",
    "strictly shrinking"): with the sixth data point in hand, that framing is
    no longer supported. The honest characterization is a noisy/stochastic
    restart interval in roughly a 4-20 minute range, not a deterministic,
    monotonically-shrinking countdown toward zero. Same failure signature
    each time: the entire process tree, including
    tools/experiment_execution.py's own supervisor, destroyed mid-run,
    before any execution-receipt.json could be written.
    TASK-20260921-88ba0f's claim (which held RUN-FROB-5fa3f0's write_scope)
    has already been released as failed with this same disclosure by the
    dispatching session.
    This coordinator has no shell and cannot independently recompute any
    hash, re-check process state, or re-read /proc/uptime; the cited hashes
    (command.txt, environment.json, launch.json, roots.jsonl.gz, and the
    well-known empty-file hash shared by stderr.log/stdout.log/
    tuples.jsonl.gz) and the uptime reading are accepted as
    reported_by_session (see verification block below). This coordinator DID
    independently verify, by listing experiments/EXP-FROB-d8aa37/runs/
    RUN-FROB-5fa3f0/ directly with its own Glob tool in this engagement, that
    it contains exactly seven entries -- launch.json, command.txt,
    stdout.log, stderr.log, environment.json, tuples.jsonl.gz,
    roots.jsonl.gz -- and that NO execution-receipt.json, manifest.yaml,
    raw-result.json, fixtures.json, metrics.json, certificates.json,
    report.md, check.stdout.log, or check.stderr.log exists at that path.
    This is not trusted from the requesting account; it is this
    coordinator's own read of the actual committed working tree, identical
    in method to the equivalent checks this coordinator ran on
    RUN-FROB-0b1c8e's directory in DEC-20260921-1988f5, on RUN-FROB-5490f1's
    directory in DEC-20260921-fd5bf1, on RUN-FROB-16ecb6's directory in
    DEC-20260921-54b637, on RUN-FROB-f3e2a3's directory in
    DEC-20260921-77e8bc, and on RUN-FROB-39714f's directory in
    DEC-20260919-eb9f07.
    This coordinator also independently re-read
    coordination/frobenius/BATCH-2f8435/admission/linux-runtime-lock-successor-20260914-c85f6a.json
    in full: it still shows scientific_launch_authorized: true, unedited,
    with the lock file's own content sha256
    46d918a1a4b9d358df39f09a87d5221128cc1ce19cb62672bc35204785952eb5 (the
    lock contains no internal self-hash field; this is the file's own
    content hash, computed externally) cross-corroborated by this
    coordinator against trial-plan-stage0-v9.json's own already-committed
    runtime_lock_sha256 field and run-binding-stage0-v9-retry-20260921.json's
    own already-committed runtime_lock_sha256 field, both of which cite the
    identical value. This coordinator also re-read DEC-20260921-1988f5,
    trial-plan-stage0-v9.json, run-binding-stage0-v9-retry-20260921.json, and
    TASK-20260921-88ba0f.yaml in full as the immediate predecessor records
    and templates for this record's own amendment.

