coordinator_decision:
  id: DEC-20260805-364e9e
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-121
  recorded_by_task: TASK-20260805-006
  archived_by: TASK-20260805-006
  context: >-
    BATCH-121 ran two analysis tracks on proposals from BATCH-120:
    (A) TASK-20260805-004: comparison-oracle GGM ↔ H-PSEUDO characterization (IDEA-62ef74)
    (B) TASK-20260805-005: doubling-oracle closure (IDEA-58b638) + multi-target BKK crossover (IDEA-0cd03f)

  findings:
    TASK-20260805-004 (oracle_hpseudo_analysis.md):
      - Semaev IC is sub-rho (L[1/2, sqrt(2)] ≈ 2^61.7 << 2^128) in GGM+C_t UNCONDITIONALLY.
      - H-PSEUDO failure shifts the L[1/2,c] constant downward only; cannot reach
        polynomial time. Max failure restricts IC to a subgroup (fraction 1/k* of targets).
      - C_t is NON-SIMULABLE (Tier 3, encoding-dependent), same class as elliptic-net oracle.
      - IDEA-62ef74 has two defects: (1) H-PSEUDO condition is INVERTED — H-PSEUDO holding
        means yield AT heuristic, not above; chain-complex sub-rho requires H-PSEUDO to FAIL.
        (2) "Sub-rho" conflated: algorithmic sub-rho holds unconditionally; chain-complex
        sub-rho (β1 < sqrt(N)) requires above-heuristic yield.
      - Corrected biconditional: ∃F [chain-complex C_R^F sub-rho] ↔ ∃F [H-PSEUDO fails for F]
        (KN-FIND-9d2f56 with the oracle layer; C_t does not alter which F have above-heuristic
        yield).
    TASK-20260805-005 (closure_and_multi_target.md):
      - Doubling oracle O_D(P) = x([2]P) is a rational function of x(P) alone (y-sign
        cancels); GGM-simulable. ord_q(2) ≥ sqrt(q) verified on 5 curves at p=1009.
        IDEA-58b638 barrier CONFIRMED → status rejected.
      - Multi-target BKK: K*(BKK) = ⌈s·β/(1−t·β)⌉ with β = 2/(m+1). Crossover shrinks by
        factor ~2/(m+1). Critical regime: BKK RESCUES instances with T_desc ∈ [sqrt(N),
        (m+1)/2 · sqrt(N)) that standard IC cannot touch (t ∈ [1, (m+1)/2)). At m=5,
        s=200, t=0.9: K* drops 2001 → 96. Asymptotic per-target speedup 1/(t·β) for large k.
        Mechanism algebraically sound → ready for experiment design.

  decisions:
    - 'IDEA-20260805-58b638 (doubling oracle): CLOSED as rejected. Barrier confirmed:
      simulable oracle, ord_N(2) = Ω(sqrt(N)). No sub-rho path. '
    - 'IDEA-20260805-62ef74 (comparison oracle ↔ H-PSEUDO): DISPATCH for formal theorem
      work on the corrected biconditional: C_t minimality + chain-complex iff. The ECCG
      unification (C_t queries on {[j]G}) is the cleanest original insight and is correct. '
    - 'IDEA-20260805-0cd03f (multi-target BKK): APPROVED for experiment design. K*(BKK)
      formula verified; critical regime where BKK rescues t ∈ [1, (m+1)/2) is the
      principal new capability. EV-SEMAEV-7f7d22 reserved for this track. '
    - 'H-PSEUDO orientation correction recorded: H-PSEUDO HOLDING → yield AT heuristic
      (pseudorandom DLs); chain-complex sub-rho requires H-PSEUDO FAILURE. KN-FIND-9d2f56
      Corollary restated accordingly. This does not change H-PSEUDO-83817b status
      (open), only the interpretation direction used in DEC-20260804-384a4a. '

  decision_scope: >-
    These decisions apply only to the oracle/multi-target analysis tracks within
    GOAL-ECDLP-001. No hypothesis state machine transitions performed beyond the
    IDEA-58b638 closure (idea-level record, not hypothesis-level). KN-FIND-9d2f56
    corollary orientation is a clarification, not a retraction.

  exact_next_action: >-
    BATCH-122:
    (A) Design experiment EV-SEMAEV-7f7d22 (multi-target BKK) — validate K*(BKK) at
        toy scale: 5 curves, k ∈ {2,5,10,25}, m ∈ {3,4,5}, measure crossover vs theory.
    (B) Formalize corrected Claim C (C_t minimality as weakest order-based non-simulable
        oracle) as a standalone lemma — mathematical writeup, no compute required.

  knowledge_promotion: not_warranted
  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2
    sota_delta: {time_exponent: not_applicable, constant_factor: not_applicable}
  claim_ceiling: theoretical
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-05'
