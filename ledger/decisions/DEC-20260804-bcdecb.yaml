coordinator_decision:
  id: DEC-20260804-bcdecb
  goal_id: GOAL-MLKEM-004
  batch_id: BATCH-e87ab3
  batch_number: 6
  recorded_at: '2026-08-04'

  decision: close_at_budget
  target_ids: [GOAL-MLKEM-004]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. THIS FILLS A SCHEMA SLOT ONLY. It does not revive,
    endorse or adjudicate this record's closure of GOAL-MLKEM-004, which is
    disputed: CORR-20260805-527ffc records that main's DEC-20260805-0b3e11 /
    EV-MLKEM-2cd08b closed the same goal on a disjoint lineage and is currently
    live, while this decision and EV-MLKEM-4a9cfe are reachable only through that
    correction. The adjudication is open and is not made here.
  decision_label: >-
    GOAL-MLKEM-004 closes at its 6-batch budget. The campaign's final
    discriminating result is: bgj1_sieve shows excess cross-run T_N variance
    in QEMU (ratio≈1.39, p=0.001); gauss_sieve on the same instance does not
    (within-group ratio≈0.96, p≈0.52). The excess variance is bgj1-specific
    and is not evidence for the Ducas-Pulles algorithm-independent independence
    violation. The named obstruction is: native x86_64 hardware not available
    in this session; the bgj1 QEMU emulation artifact hypothesis cannot be
    definitively ruled out without it.

  context: >-
    BATCH-e87ab3 (batch 6 of 6): 50 gauss_sieve runs. Validator:
    accept_with_qualifications (CHK-2 confirmed within-group arithmetic; Q-1
    receipt SHA corrected). Red team: blocking_objections on N-variability
    confound (r(N,T_N)=0.820; OBJ-1); within-group chi-squared tests show
    no excess variance (p≈0.52 for both N classes; OBJ-2). Reviews at
    7a1ded779.

  evidence_refs:
    - EV-MLKEM-4a9cfe
    - EV-MLKEM-bdbfba
    - EV-MLKEM-d8f627
    - EV-MLKEM-da9e3b

  what_the_campaign_closes_on:
    named_obstruction: >-
      The test of the MATZOV.Nf independence assumption requires native x86_64
      hardware for a definitive result. All bgj1 measurements were obtained in
      Docker linux/amd64 via QEMU on Apple Silicon. The bgj1 excess variance
      (ratio≈1.39, p=0.001, n=150) is real within that environment but cannot
      be attributed to genuine sieve-vector correlation rather than bgj1-
      specific QEMU emulation of AVX2/SIMD code paths, because gauss_sieve on
      the same instance shows no corresponding excess.

    what_the_campaign_produced:
      - >-
        CTRL-RT-4c confirmed: estimator.lwe_dual.MATZOV.Nf is reachable and
        callable — verified in batch 2, after 12 batches of GOAL-MLKEM-003
        never covering it.
      - >-
        bgj1_sieve excess variance (ratio≈1.39, p=0.001, n=150) in QEMU is
        reproducible and passes RC-3 (no sequential QEMU state leakage). It is
        real within the QEMU environment.
      - >-
        gauss_sieve shows no corresponding excess (within-group ratio≈0.96,
        p≈0.52) — establishing that the bgj1 excess is algorithm-specific.
      - >-
        The test design for measuring the independence assumption is validated:
        the paired test, within-group conditioning, and RC-3 cross-run test
        are a coherent protocol for future native-hardware runs.
      - >-
        KN-TECH-14efa5 instrument (passagemath + fpylll + g6k) confirmed
        functional and reproducible across 6 batches.

    premature_closure_disclaimed: >-
      This closure is not premature. The six-batch budget is exhausted. The
      bgj1-specific vs algorithm-independent question is answered within the
      QEMU environment (bgj1-specific). The remaining uncertainty (QEMU vs
      genuine) requires native hardware. A seventh batch in QEMU would not
      resolve it. The named obstruction is stated plainly.

    successor_if_native_hardware_available: >-
      Run bgj1_sieve and gauss_sieve on the same instance on native Linux
      x86_64 (not QEMU). The scripts are committed and ready
      (BATCH-e87ab3/tasks/TASK-20260804-478b74/gauss_test.py,
       BATCH-1be68e/tasks/TASK-20260804-cbf6e2/paired_test.py,
       BATCH-68471b/tasks/TASK-20260804-52cc2b/variance_test_b3.py).
      Run time ~17 min for 50 bgj1 runs + ~17 min for 50 gauss runs.
      If bgj1 ratio>1 natively and gauss ratio≈1 natively, the mechanism
      is confirmed. If both ≈1 natively, QEMU was the source. Either result
      resolves KN-OPEN-016.

  completion_criteria_assessment:
    criterion_1_measured_distribution: >-
      NOT MET. No sieve-calibrated security estimate was produced. The campaign
      measured T_N distributions but could not compare against MATZOV.Nf under
      conditions free of QEMU confound. The calibration half of criterion 1
      remains unachieved.
    criterion_2_validator_red_team: >-
      Partially met: validators and red teams admitted the run packages across
      batches. However, the QEMU confound means the red teams could not admit
      the final interpretation. Criterion 2 as a standalone procedural check
      is satisfied; as a criterion for the underlying mathematical question it
      is not.
    criterion_3_ledger_archive: >-
      Met by this archive. Procedural only.

  hypothesis_status_changes: []

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No finding. The campaign's result is a named obstruction and a
      bgj1-specific observation that requires native hardware to interpret.
      Rule 12 UNMET and UNWAIVED. The bgj1 excess variance in QEMU does not
      rise to a promotable finding without native hardware confirmation.

  decided_by: coordinator
  decided_at: '2026-08-04'

  inference_provenance:
    requested_policy: coordinator-archive
    resolved_model_id: amazon-bedrock/us.anthropic.claude-sonnet-4-6
    fallback_used: true
    model_verified: false
