  decision: weaken
  decision_rationale_for_verb: >-
    The verb applies to H-ECDLP-37dc01 through EV-ECDLP-60e266 and is the
    only verb the frozen contract, the reviews and the handoff's own rule
    set admit. NOT `support`: S1 is NOT met at either N nor on the curve
    (difference CI-separated below zero: -0.064 [-0.080, -0.049] at 2^24,
    -0.076 [-0.083, -0.068] at 2^30, -0.049 [-0.071, -0.029] on
    TOY-P24-1ca86fe9187c), S2's positive clause is not met, and J3 is
    BROKEN. NOT `reject_scoped`: forbidden on a single unreplicated run set
    (handoff; docs/claims-and-verification.md), and F1's letter
    ("rho_T(16T) > 0.85 with CI") is not met either (0.619 [0.584, 0.663]
    and 0.632 [0.607, 0.648]) although F1's other formulation
    ("CI-separated below STATIC(T) at U = 16T") is -- the contract joins
    two non-equivalent statements with "equivalently" and the outcome falls
    in a cell it did not name. NOT `inconclusive`: the CIs do not straddle;
    the red team's not_licensed list names "inconclusive" explicitly. NOT
    `invalid_run_set` for 612fb1: every invalidation rule was checked and
    none fired (J1 all PASS; rule 5 clean; no exceedance; certificates
    19850/19850). `weaken` is therefore the verb: claim (C1) of
    H-ECDLP-37dc01 is contradicted with CI at the pre-registered effect
    size, and the strongest checkable refutation artifact the result
    admits -- the red team's disjointness DERIVATION from the exact basins
    (top-T/2 share < STATIC(T) exact coverage in 10/10 seeds; ORACLE(T/2)
    < STATIC(T) in 5/5) -- is archived (snapshot 840df8a5 carries the run
    summaries it is read from; the worked files are bound in this ledger
    commit) and cited as proof_status derivation / proof_refs on
    EV-ECDLP-60e266 before this decision. The verb carries the amendment
    and replication it requires (RANK 1 below): the hypothesis reaches
    `analyzed`, never `weakened`, from one batch. For EXP-ECDLP-869870 the
    disposition inside this decision is `invalid_run_set` at N >= 2^24
    (fixture gate failure, contract rule 3), which is an outcome, not a
    verb: no hypothesis direction, the repair successor named under RANK
    2. Recorded plainly: the Coordinator's prior expected S1-S4 to pass
    with rho_T(8T) near 0.51 and the break, if any, to appear in J1
    bookkeeping; the review OVERTURNED that prior on J3 and left J1 clean.
