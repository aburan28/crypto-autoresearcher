      mixer, keys and code) and for every recomputation in J1/J3/J4 (own
      group law, own scripts). No conclusion here rests on two records
      merely agreeing; every number was recomputed from raw records by at
      least one reviewer under its own code.
    fallbacks_recorded: >-
      Both reviewers requested review-adversarial (binding claude-opus-5 at
      xhigh) and were answered by claude-fable-5-1 at xhigh: recorded
      fallbacks, effort not lowered, degraded_allowed false honoured. Both
      executors requested executor-implementation (binding claude-sonnet-5)
      and were answered by claude-fable-5-1: recorded, fallback_used false
      by their own manifests since the capability contract was met. This
      authorship: coordinator-orchestration-code (binding claude-opus-5)
      answered by claude-fable-5-1, fallback recorded below.

  disposition_per_contract:
    EXP_ECDLP_612fb1:
      outcome: S1 NOT met (CI-separated below at both N and on the curve); F1 NOT met by its letter (rho_T(16T) 0.62 / 0.63, not > 0.85) while its CI-separation clause IS met; S2 not met as written (NULL-A clause) with rule 5 clean and bit-identity holding; S3, S4, S5, S6 met; control (m) holds for STATIC(T) and RESEL-L(T/2)
      contract_cell: >-
        The contract names cells for S1-S6 met, for S1-S4 met with S5-S6
        not, for F1 (rho > 0.85), for F2-F4 (invalid), for gate failure and
        for "neither S1 nor F1 met (CI straddles) -> inconclusive". The
        actual outcome -- S1 failed with CI, F1's threshold not reached,
        CIs separated -- is in none of them. Per the handoff's rule the
        Coordinator decides `weaken` with the amendment it requires, and
        does NOT transition on S1/F1.
      what_is_established_toy_tier: >-
        The honest constant: at a = 1/4, r = 2, k = 4 the LOWER-bracket
        re-selected table reaches a static table of 0.65-0.69 T (steady
        state; 0.75-0.77 on the RQ's cumulative epsilon) with CIs excluding
        1.0, bounded below by the oracle floor about 0.55, paying 2.6 T
        (capped) to 8.9 T (uncapped) entries of working storage, 2-6%
        re-selection integer operations and an early-batch penalty of
        0.13-0.15, with no cumulative break-even within 16T; at fixed
        advice T the re-selected table equals the r = 8 static table (6.3x
        the precomputation) at lower online walk cost. Under
        RQ-ECDLP-78dbc5's fewer_DP definition this is a TRADEOFF POINT on
        the (P, S, L, epsilon, U) frontier, not an improvement. The
        mechanism clauses (convergence toward the exact oracle, r-shrinkage,
        phi decay, clean nulls) are supported at toy scale within this
        batch.
      amendment_required_before_any_further_run: >-
        A versioned protocol_amendment (v2) of EXP-ECDLP-612fb1 under
        experiments/EXP-ECDLP-612fb1/amendments/, never an edit of the
        frozen v1, carrying: (a) a CEILING-FEASIBILITY GATE G3 from the
        exact basins before any re-selected arm is interpreted -- exact
        top-T_sel share >= STATIC(T) exact coverage (or ORACLE(T_sel)
        eps_ss >= STATIC(T) eps_ss) in at least 4 of 5 seeds; its failure
        makes S1 UNTESTABLE at that (a, r, T_sel), never negative; zero
        extra compute; (b) an S1 NON-VACUITY GUARD -- STATIC(T) eps_ss >= 0.5
        and CI-separated above RHO by >= 0.30, tolerance stated relative
        (5% of the STATIC(T) - RHO gap), rho_T CI excluding 1.0 and
        uncensored on the T_sel grid; U_ss/U* margins relative likewise;
        (c) S2 RESTATED as the null's expected sign -- one-sided: NULL-A
        gain not CI-separated above zero and <= 0.5 x the RESEL-L gain at
        every round, with the null's own perturbation recorded; (d) the
        HEADLINE QUANTITY restated as T_resel/T_static at fixed success
        WITH S_peak CHARGED, reported as the frontier tuple (T_sel/T,
        S_peak/T, P/sqrt(NT), L, eps_ss, eps_cum, U, early penalty) with
        rho_ORACLE beside rho_T on every exact cell and rho_cum beside
        rho_ss, U* stated explicitly when unreachable; (e) HEUR-BLT-7 stated
        with the admitted-walk count in place of U k p_s; (f) the pool cap
        applied per admitted target or per round before admission so that
        CAP(2T)'s S_peak is 2 T; (g) fit_cutoff None mapped to G1 FAIL and
        the two bijection seeds (red team src/pipeline_perm, results/j4_perm)
        kept as a permanent negative fixture; (h) the a-scan of
        ORACLE(T/2) - STATIC(T) on 2^20 exact basins (seconds per cell) run
        FIRST to locate any (a, r) at which a fixed-advice T/2 claim is
        feasible, and (C6) replaced by the ordering prediction
        rho_ORACLE(a = 1/4) < rho_ORACLE(a = 1/2) with rho_T(a) tracking it.
        Executed runs are never re-scored under v2.
    EXP_ECDLP_869870:
      outcome: invalid_run_set at N >= 2^24 (fixture gate FAIL, rule 3); 2^20 and 2^22 report-only; no V or M verdict scored
      what_it_licenses: >-
        Nothing about H-ECDLP-3550b8. It licenses the design of the repair:
        the 2^30 gate passes as measured on all fourteen numbers; the
        headline cell passes at 2^24 but is band-edge under re-keying
        (J2-F1); the miss is one cost cell by 0.0005 and four
        precomputation cells by 14.6-20.9%, part of which the contract's
        own (B4) note predicted as the model's O(theta) form. The
        instrument's receipts are clean, so the successor is a RE-KEYED
        2^24 fixture cell (>= 8 keys per instrument, murmur3 and splitmix64
        as the validator ran) under a versioned amendment that either
        states the O(theta) correction before comparing at 2^24 or gates at
        2^30 (theta = 1/512), reports the capped-mass fraction beside any
        2^20 fixture, fits the N-drift trend on 2^22-2^24, and re-states
        the survival-slope band against the finite-theta Borel value under
        the declared estimator. Only after V1 passes can V2-V5 and M1-M5 be
        scored and the constants become citable.
      defects_returned_to_executor: >-
        None that invalidate a receipt. Carried as amendment/report items:
        record that RUN-001..019 executed earlier versions of the pinned
        files with the additive change and the validator's reproduction
        (J1-F2); evaluate and record the gate in its own run record before
        launching the next stage (J1-F1); label the walk projection (top
        bits vs mod N) and the cycle_mass definition in the amendment
        (J1-F4).

  rationale:
    - >-
      The frozen contracts are the ONLY criteria, applied as written: S1
      fails with CI at both generic N and on the curve; F1's numeric
      threshold is not met; the outcome is in a cell the contract did not
      name; no invalidation rule fired for 612fb1; rule 3 fired for 869870.
      No criterion was changed after observing outcomes; the amendment is
      versioned and prospective.
    - >-
      Before the adverse verb, the strongest checkable refutation artifact
      was secured and archived: the disjointness derivation on exactly
      enumerated basins (proof_status derivation on EV-ECDLP-60e266), read
      from the snapshot-committed run summaries of RUN-013..017 and
      RUN-001..005 and worked in the red team's j3_disjointness.json and
      j3_oracle_floor.json. It is exact for the tested seeds and claims
      nothing beyond them.
    - >-
      reject_scoped is forbidden on a single unreplicated run set and would
      in any case overstate: the mechanism is supported, only the
      pre-registered headline (T/2 reaches T) is contradicted, and that
      headline rested on an equality of two constants inside their own
      error bars (C_max(1/8) = 0.2716 vs p_static 0.27 measured 0.289),
      which the red team rightly calls "not a prediction".
    - >-
      The Coordinator's prior was overturned on J3 and the review was
      informative precisely because the prior was written first
      (AGENTS.md "Review architecture"); recording the overturn plainly is
      the point of the prior.
    - >-
      Independence: check_review_independence.py PASS, mutual blindness
      respected, the validator's seal verified; model independence absent
      and disclosed; every reviewer number recomputed under independent
      code.
    - >-
      Goal criteria are judged honestly below: C1 and C3 are met by
      EV-ECDLP-60e266 on the verified commit of this archive (C1 in the
      negative direction; C3's obstruction measured over the tested scope
      only); C2 is NOT met because the instrument is not validated (V1
      failed). The goal stays active with one next action.
    - >-
      Under the roadmap bias toward exponent-targeting mechanisms this
      lane remains what DEC-20260906-2b1387 said it was: a bounded
      constant-factor measurement under KN-LIT-013 that has now narrowed
      the constant's known range (advice ratio 0.65-0.69 at S_peak
      2.6-8.9 T; oracle floor 0.55). ECC priority keeps it ranked ahead of
      doing nothing; the amendment-and-rerun is cheap (minutes of compute)
      and decision-changing for RQ-ECDLP-78dbc5's fewer_DP question.
