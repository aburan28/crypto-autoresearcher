  review_composition:
    plan: ledger/handoffs/TASK-20260906-7ec3ea.yaml review_plan (byte-identical on TASK-20260906-90e7cf's handoff), written before any run
    independence_check: PASS (tools/check_review_independence.py, run by the orchestrating session; 2 reports; joints J1-J4 each owned by exactly one attesting reviewer; read_sibling_reports false on both; no blind_from source read before the seal; proves-too-much controls declared and run)
    prior_recorded: >-
      S1-S4 pass at both 2^24 and 2^30 with rho_T(8T) near 0.51 inside
      [0.45, 0.65]; exact top-T share at 2^20 inside G1's band; the 1.79
      fixture reproduces within 0.10 at 2^24 with about 0.3 probability of
      one 869870 cell (most likely N/T = 1) missing by an O(theta)
      residual; the most likely GENUINE failure a bookkeeping one found by
      J1; NULL-A not expected to show a gain, possibly slightly below
      static; J2 to agree at seed-spread level; J3 to find S_peak the
      weakest point with CAP(2T)/CAP(4T) the frontier-honest cells; the
      proves-too-much objects to behave.
    J1:
      owner: TASK-20260906-7ec3ea
      verdict: HOLDS_WITH_FINDINGS
      against_prior: >-
        OVERTURNED in the reassuring direction: the Coordinator expected the
        break, if any, here (LOWER-bracket admission, restart and pool-bit
        charging); every check (i)-(x) PASSED and the admission identity is
        exact. Findings J1-F1..F6 are all not_load_bearing: gate verdicts
        produced after gated stages ran (labelling correct), pinned source
        hashes differing from the archived source (reproduction verified),
        RHO raw 'solved' counting collisions (never quoted as solves),
        declared readings of under-specified rules, the RUN-016 companion
        outside the snapshot, and observations.
    J2:
      owner: TASK-20260906-7ec3ea
      verdict: HOLDS_WITH_FINDINGS
      against_prior: >-
        HELD: the sealed values agree with both executors at the seed-spread
        level and never per seed (top-T share t in [-0.51, +0.10]; 2^24
        fixture t -0.70). J2-F1 is LOAD-BEARING for EXP-ECDLP-869870's V1
        only: every instrument of the class lies 0.06-0.11 below 1.79 at
        theta = 1/128 and the (1/4, 2) 2^24 cell is band-edge under the
        0.10 tolerance (murmur3 primary fails by 0.009, splitmix64 and both
        executors pass by 0.005-0.02). J2-F3 confirms the prior on the
        distinct-DP procedure and cap charging. The prior's "one cell,
        most likely N/T = 1" was wrong about which cell.
    J3:
      owner: TASK-20260906-90e7cf
      verdict: BROKEN
      against_prior: >-
        OVERTURNED, and this is the batch's most informative output. The
        prior expected S1 to pass and the weakness to be S_peak. The red
        team found (F-J3-1, load-bearing) that the pre-registered claim was
        infeasible by disjointness at a = 1/4 -- the exact top-T/2 share is
        below STATIC(T)'s exact coverage in 10/10 seeds, the same argument
        the contract used to predict failure at a = 1/2 -- with the oracle
        floor rho_ORACLE about 0.55 above the model 0.51; (F-J3-2) "fewer
        stored DPs" survives on no cell once working storage at the online
        site counts (the smallest, CAP(2T,T/2), holds 2.6 T against
        STATIC(T)'s 1 T); (F-J3-3) the RQ's epsilon is cumulative, where
        rho_T is 0.75-0.77 and U* unreachable; (F-J3-4) the r_eff formula
        overcounts admitted evidence 1.7x, the gain is batch evidence
        legitimately charged to L and equals the r = 8 static table's
        selection quality at r = 2 precomputation; (F-J3-5) the LOWER
        bracket admits no unknown-log entry (pool hook, 0 failures); (F-J3-6)
        the mechanism converges toward the oracle as HEUR-BLT-7 says. The
        S_peak part of the prior held and was stronger than expected.
    J4:
      owner: TASK-20260906-90e7cf
      verdict: BROKEN (narrow, criterion named)
      against_prior: >-
        PARTLY OVERTURNED: the composite argument fails on all three
        known-false objects as required (G1, fixture and S3 fail on the
        bijections; the a = 1/2 differential and NULL-A behave), but S1
        ALONE and U_ss/U* go through on the affine-xorshift bijection
        where every table is at 3-5% (F-J4-1: absolute tolerance, no
        non-vacuity guard); S2's positive form is unsatisfiable by NULL-A's
        design (F-J4-2); the a = 1/2 differential does not discriminate
        because the same inequality holds at a = 1/4 (F-J4-3); the
        snapshot analysis.py crashes rather than reporting G1 FAILED on a
        no-tail object (F-J4-4). None changes THIS record's outcome; all
        four are amendment items before any positive outcome under
        EXP-ECDLP-612fb1 could be evidence.
    blindness: mutual, lifted_for empty, respected; the red team discloses that one `git status --porcelain` printed the NAMES of nine untracked validator files (no content read; not used); the validator listed no red-team path
    model_independence: >-
      NOT OBTAINED, as both reviewers attest: both executor packages, both
      reviewers and this authorship self-report resolved_model_id
      claude-fable-5-1 (model_verified false everywhere). SESSION
      independence holds (fresh sessions; neither reviewer authored or ran
