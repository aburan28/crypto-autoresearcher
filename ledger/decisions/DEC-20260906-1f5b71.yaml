  limitations:
    - >-
      claim_tier toy: generic keyed random function at N <= 2^30 and one
      toy curve per contract at p about 2^24. No cryptographic N, no
      deployed curve, no scheme named; transfer beyond the tested grid is
      an assumption, never a result.
    - >-
      Constant-factor under KN-LIT-013 by construction; no exponent moves
      and none is claimed; the four asymptotic promotion gates are not
      engaged.
    - >-
      Single batch: strength preliminary on EV-ECDLP-60e266 (one
      implementation, 5 + 5 + 3 seeds); the amendment-and-rerun is the
      owed replication; no hypothesis reaches `weakened` or `supported`
      here.
    - >-
      Model independence between producers and reviewers was not obtained
      (all claude-fable-5-1, self-reported, unverified); session and
      implementation independence were.
    - >-
      The obstruction on EV-ECDLP-60e266 is measured at a = 1/4, r = 2 on
      the tested instrument class and closes nothing beyond that scope;
      RQ-ECDLP-78dbc5 is not closed (its decision_target says a negative
      batch narrows the constant's range and does not close the question).
    - >-
      EXP-ECDLP-869870's constants are NOT citable: V1 failed and every
      downstream number carries the rule-3 label; the 2^30 pass licenses
