  rationale:
    - >-
      THE CERTIFIED VALUES ARE REPLICATED. The validator's instrument shares
      no code with the producer and uses no PARI in verification. It
      re-derived every value in N1 from the archived certificates, with 2715
      rigidity witnesses. The dispatcher's PARI re-checks agree. This is an
      independent reproduction of the values, so EV-GFPN-ba8e4d carries
      strength `replicated` with proof_status `certificate`, scoped to those
      values.
    - >-
      THE AUDIT TABLE AS AN INSTRUMENT DOES NOT DO WHAT THE CONTRACT SAYS.
      - Its PASS labels mean "computed with a certificate".
      - It cannot emit FAIL for a non-reproducing self-report, so the frozen
        falsification criterion is unreachable by construction.
      - It reports a wrong embedding degree on a supersingular curve, because
        it uses an uncertified n and an order routine that never checks
        Fermat.
      - Its rigidity row is not tied to the audited curve.
      - Its control is a literal for a separate script that shares no code
        with it.
      The frozen success criterion is met only literally, and it is met
      equally by every known-false object. A `support` would rest on the
      reviewers' recomputation, not on this experiment's instrument, and it
      would certify a table shown to pass known-false curves.
    - >-
      THE HYPOTHESIS OVER-PROMISED COVERAGE. Prediction 1 asks for all
      SafeCurves-style criteria. The frozen contract declared nine metrics,
      and the audit decided or partly decided 5 of 11 SafeCurves criteria. The
      most relevant transfer criterion for an F_{p^5} curve (Weil descent /
      GHS / Diem covers at n = 5) is outside this contract; it belongs to
      IDEA-20260920-10547b and goal C3. This is a design mismatch between
      hypothesis and contract. It is not evidence against the curves.
    - >-
      HENCE REFINE, AND NOT WEAKEN. Nothing adverse to the hypothesis's
      substantive claim was found: the certificates regenerate, and the one
      self-report mismatch is the "first-class finding" the hypothesis
      anticipated. No adverse transition is made, so no refutation artifact is
      required. For the record, the strongest checkable artifacts the
      reviewers produced are:
      - counterexample objects A-C, as literal-only variant diffs with their
        outputs, against the INSTRUMENT, not the hypothesis;
      - the forged-certificate counterexample against gfpn_arith.verify_ecpp;
      - for the conductor, the dispatcher's PARI coredisc plus the
        Coordinator's parity derivation.
      Refine means that H-GFPN-ee4d45 is carried forward as N1, with the
      unexamined criteria named, and that no support of any restatement is
      recorded until the audit pipeline passes objects A-D as acceptance
      fixtures and has a real instrument control.
    - >-
      THE PRIOR, READ HONESTLY. The modal prior (0.65) expected "every numeric
      row certified; control weaker than intended but no row depends; one
      frozen-rule mismatch; scoped support". The numeric content matched
      except the conductor. The prior was wrong about the instrument: three of
      four known-false objects pass rows they must fail, against a prior of
      0.35. It was also wrong about J4's procedural ambiguity (none) and about
      where the overreading lies (in the hypothesis's prediction 1 and in
      IDEA-20260920-63a902, not in the goal or question). Those overturns are
      what move the decision from the modal "scoped support" to refine.
      Agreements with the prior are weak evidence; each rests here on a
      reviewer-built artifact, not on the agreement.
    - >-
      NO CLOSURE, BREAK OR CONTRADICTION. Nothing here closes a research line,
      contradicts independently validated evidence, or claims a break or
      speedup on a real curve. review-breakthrough is not required. The
      audit's scope sentence is explicit that no system may cite it as
      evidence of SafeCurves conformance or of 128-bit security.
    - >-
      REVISIT TRIGGERS OF DEC-20260921-683a85 KEYED ON THIS AUDIT.
      - IDEA-20260920-10547b ("reranked to design_now immediately if ... the
        audit reports a 2-torsion field structure ... that differs from the
        design-note reading"): NOT FIRED. The audit examines 2-torsion only
        over F_{p^5}, where EcGFp5 has one rational 2-torsion point (as the
        paper states) and EcMasFp5 has prime order. The trigger's non-firing
        is not evidence about cover susceptibility, since Frobenius orbits
        over F_p were not computed (red team J6).
      - IDEA-20260920-68b279 (rho lane, "if the figure-provenance table reads
        the design note's 2^142 unit as something the V3 arithmetic cannot
        convert"): NOT EVALUABLE. The table records no unit at all (red team
        F-J5-4). The hold stands on its other trigger, which is also unmet.

