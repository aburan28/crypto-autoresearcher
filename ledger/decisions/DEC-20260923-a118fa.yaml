  decision_label: >-
    REFINE H-GFPN-ee4d45 to the narrowed statement N1 of EV-GFPN-ba8e4d.
    N1 covers the two named curves over F_p[z]/(z^5 - 3),
    p = 2^64 - 2^32 + 1, and consists of:
    - certificate-bearing, independently re-derived values for the order and
      cofactor, the MOV embedding degree, the CM discriminant (conductor 1 for
      both curves), the twist factorisation and twist rho cost (120.6583 and
      101.9321 bits), and rigidity of both published searches with a witness
      for every predecessor;
    - one non-reproducing self-report: EcMasFp5's "323 bits", which
      recomputes to 322.
    Not supported as stated: prediction 1 ("all SafeCurves-style criteria
    decided") is not met, the table's PASS labels pass known-false curves, and
    the frozen instrument control was not performed. Not weakened: nothing
    contradicts the values or the certificate-regeneration mechanism. Evidence
    strength replicated, for the values only. Nothing bears on attack cost,
    142, covers or any 128-bit claim.

