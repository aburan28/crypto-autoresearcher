coordinator_decision:
  id: DEC-20260806-8c33bf
  decided_by: coordinator
  decided_at: '2026-08-06'
  decision: refine
  target_ids:
  - GOAL-MLKEM-005
  - EV-MLKEM-94f036
  context: BATCH-436ddd ran B2-A, the only task DEC-20260805-4823db identifies as able to discharge a
    completion criterion, and had it reviewed by an independent validator (ADMIT) and red team. The snapshot
    preceded both reviews. This decision closes the batch.
  rationale:
  - 'THE BATCH DID ITS JOB AND THE JOB REVEALED A DEEPER PROBLEM. The sensitivity demonstration is now
    real: a 46.6-75.9 SE dynamic range with G1 clearing by 11.9-19.3x and G2 not firing anywhere. That
    is exactly what the superseded demonstration could not do. It then failed G3 on a grid this program
    froze too coarsely, and the executor recorded the failure as it fell rather than reclassifying it
    -- which the validator confirmed was correct under all three defensible readings of the PARTIAL clause.'
  - 'THE HEADLINE FINDING DID NOT SURVIVE REVIEW, AND THE CORRECTION IS EXACT RATHER THAN RHETORICAL.
    B2-A reported the departure "absent below gate" after reduction. The red team observed that the estimated
    statistic is a deterministic scalar of the tail frame and computed it with zero error draws on 16
    bases: the excess is +0.1863 (+10.2 sd, 16 of 16) for LLL at d=100, +0.4386 (+16.6 sd, 16 of 16) at
    d=140, and +0.1400 (+9.9 sd, 16 of 16) for BKZ-30 at d=140. REDUCTION SUPPRESSES BY 15-50x AND DOES
    NOT ZERO. An absence was an upper bound.'
  - 'BOTH READINGS THIS COORDINATOR PUT TO THE RED TEAM WERE WRONG, AND THE THIRD IS THE ANSWER. It is
    a basis-PRESENTATION property AND the instrument is blind to the residual: detection floor V ~ 2.2
    against residuals of 0.14-0.44, needing roughly 1000 frames per arm against 8 run. Every "absent"
    verdict this lane produces is an upper bound and must be written as one.'
  - THE MECHANISM WAS FALSE AND THE FALSIFIER WAS THE WRONG NULL. The tail window carries 0.00000 of its
    energy in the q*I block and 1.00000 in the complementary I_k block; the claimed boundary is right
    only by the coincidence k = d/2. And a zero-free-parameter geometry model predicts D(60)/D(30) = 1.544
    at d=140 and the d=100 reversal, so the growth was predictable before the run and the pre-registered
    1/sqrt(beta) law should never have been the null. "The falsifier fired, therefore artifact" does not
    follow.
  - 'C3 IS NOT DISCHARGED, FOR A REASON THAT OUTLIVES THIS BATCH. Even a VALID demonstration would not
    have discharged it: P1 and P2 return IDENTICAL verdicts on the null arm and the real arm in all four
    cells, so the adjudication predicate cannot discriminate -- which is the same objection C3 itself
    raises against reporting only E[R]. A repaired grid alone will not fix this.'
  - 'THIS IS NOT A NULL BATCH AND MUST NOT BE RETIRED AS ONE. The validator recorded the symmetric warning
    explicitly, and it is adopted here: citing "C3 unmet" to pause or retire would invoke non-terminal
    conditions the goal record bars by name. The obstruction changed KIND -- from a control that could
    not fail, to a misplaced grid plus a non-discriminating predicate.'
  - TWO REPAIRS REQUIRE A COORDINATOR DECISION BECAUSE NO EXECUTOR CAN MAKE THEM. The seven t values are
    frozen in DEC-20260805-4823db next_actions, so the grid cannot be changed from inside a task card;
    and the P1/P2 adjudication is the goal's own predicate. Both are named in next_actions.
  evidence_refs:
  - EV-MLKEM-94f036
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-436ddd/reviews/TASK-20260806-06439b/validation_report.yaml
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-436ddd/reviews/TASK-20260806-fc0966/red_team_report.md
  limitations:
  - NO statement about ML-KEM security or any FIPS 203 parameter set. Claim tier TOY.
  - No hypothesis status moves; the real arm was measured and not interpreted.
  - The exact-V correction is a derivation about the tail frame computed by the red team, not a new sampled
    measurement.
  - The residual is established as nonzero AND below this instrument's floor. Neither "vanishes under
    reduction" nor "detectable in reduced bases" is supported.
  - 'HARNESS GAP OWNED BY THIS COORDINATOR: the pre-registration freeze is self-reported. The snapshot
    correctly preceded the reviews but followed the run, so nothing externally notarizes that the pre-registration
    predated the measurement. Splitting the producer -- freeze, snapshot, measure -- is the fix, and it
    is not this batch''s to make.'
  - THE BATCH CARD ASSERTED A BKZ CACHE THAT DID NOT EXIST. That was this Coordinator's error, carried
    from the prior batch's ephemeral scratchpad path. The executor recomputed 32 of 32 reductions and
    verified them at max deviation 0.0 rather than failing.
  - None of the four asymptotic-complexity promotion gates is engaged; none is claimed.
  knowledge_promotion:
    promoted: []
    not_warranted: 'Strength is preliminary and the durable content is a correction to one lane''s instrument,
      not a claim about lattices or ML-KEM. Two items are close to promotable and belong to a successor
      once seen a second time: (i) a statistic that is a DETERMINISTIC scalar of the object should be
      computed exactly rather than estimated with error draws -- the red team turned a 16-basis exact
      computation into a refutation of a sampled "absence" at zero cost, which is a general move; (ii)
      an instrument that reports "absent below gate" without stating its detection floor converts an upper
      bound into a negative result, and this program has now done that twice.'
  next_actions:
  - 'COORDINATOR DECISION REQUIRED, AND IT IS THE BLOCKING ITEM: amend the frozen t grid in DEC-20260805-4823db
    so it BRACKETS the family''s own range-midpoint t = 1/(d+1) (0.0099 at d=100, 0.0071 at d=140) rather
    than starting 5-7x past it, and make G3 tie-tolerant. No executor can do this; the values are frozen
    in a committed decision.'
  - 'SECOND COORDINATOR DECISION, AND THE ONE NOT PREVIOUSLY NAMED: replace the P1/P2 adjudication with
    a predicate that DISCRIMINATES. It currently returns identical verdicts on null and real arms in all
    four cells, so a repaired grid alone still will not discharge C3.'
  - 'State every "absent" verdict in this lane as an UPPER BOUND with its detection floor. The exact residuals
    are known: 0.1863 / 0.4386 / 0.1400 against a floor of V ~ 2.2.'
  - 'Run the discriminating test for the block geometry that the executor named and did not evaluate:
    any k != d/2, which separates the refuted q*I story from the I_k confinement the red team measured.'
  - 'Fix the harness: split the producer so a pre-registration is snapshot-notarized BEFORE the measurement
    it governs, and correct the batch-card claim that a BKZ cache exists -- record that the seeds, not
    the scratchpad, are the reproducible artifact.'
