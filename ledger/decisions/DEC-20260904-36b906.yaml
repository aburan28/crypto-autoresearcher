  limitations:
    - >-
      ONE SHAPE. Nothing here touches the s-axis, the solving degree, yield,
      cost or the ECDLP, and the contract says so.
    - >-
      THE RESULT IS NOT ABOUT ELLIPTIC CURVES (see rationale item 3). This is
      recorded as a limitation as well as in the claim, because it is the single
      easiest sentence for a downstream reader to get wrong.
    - >-
      Criterion (2) is not met as written, and no criterion is re-scored.
    - >-
      The null_support arm cannot be rebuilt from the package (only the mixed
      RNG seed is stored), so its 200 draws per prime were checked for internal
      consistency and seed distinctness but NOT independently recomputed. The
      positive-control and secondary-direct ranks and the syzygy_dim /
      deficit_series columns were likewise not independently recomputed.
    - >-
      The nominal 40 draws per cell realise 31 / 30 / 29 distinct (A, B, x_R)
      triples, so the honest exact Clopper-Pearson upper limit at 4099 is
      0.1122, ABOVE criterion (4)'s own 0.1 threshold. Criterion (4) is still
      met as written because the frozen text requires the RATE (0.0000) below
      0.1, but the interval must not be quoted as if it were below 0.1.
    - >-
      "40 of 40 paired" is a pairing of SEED LABELS: no (A, B, x_R) triple and
      no null RNG seed is shared between the 64-bit and 256-bit cells.
    - >-
      The contract's PRIMARY frozen-fixture route is not executable in either
      direction, because fd901a and EXP-PFDR-5726af derive DIFFERENT instances
      from the same seed labels. No cross-contract same-instance agreement may
      be claimed from this package.
    - >-
      Ten inference sub-fields required by the Minimum run manifest are absent
      from all six manifests, caused by the disclosed D9 harness defect; the
      content survives under inputs.parameters. No measured quantity depends on
      them.
    - >-
      CTRL-POSITIVE-P-DEPENDENCE has no dynamic range on the axis it gates
      (d_ff = B + 2 is a function of B alone). Instrument p-sensitivity is
      discharged instead by the reviewer's meter run at p = 2 and p = 3.
    - >-
      Correlated judgement: producer and both reviewers report the same model
      family with model_verified false.
    - >-
      This decision was composed by a Coordinator subagent with no shell and no
      interpreter; it ran no code and executed neither
      tools/check_review_independence.py nor tools/validate_ledger.py. It is
      unverified until the orchestrating session does so and the post-commit
      verifier accepts the archive.
  next_actions:
    - >-
      THE ONE NEXT ACTION FOR THIS LANE. Run RT-C1 and RT-C2 as a single
      sub-minute addendum under a NEW experiment id before any further cell of
      this battery is read as calibration: one INTEGER instance reduced modulo
      the ladder p = 3..199, 4099, 2^64 - 59 and the P-256 prime (the only
      version of the sweep that tests the specialization claim), and the METER
      itself on the (2,2,3) construction at p = 2 and p = 3 (the fixed-shape
      p-sensitivity check CTRL-POSITIVE-P-DEPENDENCE cannot provide). Record
      |Z(S~)| per draw as a first-class metric and replace the "small-p artifact
      budget" handed to EXP-PFDR-20ee58 and EXP-PFDR-cbdefb with the per-draw
      STRUCTURAL criterion |Z(S~)| >= 16, computable in 64 field evaluations per
      draw. Scripts and outputs for all of it are already committed in the
      reviewer's directory and can be re-run verbatim.
    - >-
      RECORDS THE ORCHESTRATING SESSION MUST ALLOCATE IDENTIFIERS FOR - each a
      SUPERSEDING record, never an edit. (a) An annotation of H-PFDR-09e1b0 and
      IDEA-20260903-26aa81 replacing the maximal-minor-PRODUCT Schwartz-Zippel
      bound with Stage 0's single-minor form, since the product form is vacuous
      at the tested primes. (b) An annotation replacing
      stage0-derivation.md section 4's entry-content check with the integer
      invariant factors (16), (16, 16), (16) of the top blocks. (c) An
      annotation restating CTRL-CONFOUNDERS-NAMED (i) as conditional on
      |Z(S~)| < 16 and recording the point-set determination as the scope of the
      observable. (d) A correction note recording that frozen criterion (2)'s
      65 / 129 is a transcription of a degree of regularity and that the correct
      first fall is B + 2. None is created by this decision.
    - >-
      DO NOT LET THE ARTIFACT BUDGET TRAVEL AS A MEASUREMENT. Both sibling
      experiments consumed criterion (4)'s "0 of 40, interval [0, 0.0881]" as a
      pass threshold. It is a DERIVED BOUND at coarseness 0.088 on an event set
      that is empty at the prime it names, and a threshold no plausible artifact
      rate could exceed discriminates nothing. Label it a derived bound wherever
      it is cited.
