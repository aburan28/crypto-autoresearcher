  context: >-
    Evidence review of EXP-PFDR-fd901a (the p-independence calibration for
    H-PFDR-09e1b0, six runs at p in {4099, 16411, 2^64 - 59, the NIST P-256
    prime}, one digit shape (m, d, s) = (2, 2, 3), 722 recorded draws),
