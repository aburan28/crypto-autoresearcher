  decision: support
  decision_label: >-
    support_the_fixed_shape_p_independence_claim_of_H_PFDR_09e1b0_at_derivation_strength_scoped_to_the_2_2_3_digit_map_and_explicitly_not_to_summation_polynomials_curves_or_the_ECDLP_and_move_specified_to_analyzed
  target_ids:
    - EXP-PFDR-fd901a
    - H-PFDR-09e1b0
    - EV-PFDR-acc71a
    - RQ-PFDR-ae2fba
  rationale:
    - >-
      WHAT IS SUPPORTED, stated at the scope the surviving evidence covers and
      no wider. The hypothesis's title claim - at fixed digit shape the graded
      Macaulay invariants of the prime-field digit-presented decomposition
      system are p-independent above a small threshold prime, because the system
      is the specialization of one integer matrix family, and the p-sweep is
      pipeline calibration - is CORRECT, and the round establishes it more
      strongly than the run set did: it is DERIVABLE, with explicit witnesses.
      top_rank(D) = sum_{j+k=D-4} r_1(j) r_2(k) = [1, 2, 1], the integer top
      blocks have invariant factors (16), (16, 16), (16) so 2 is the ONLY
      content prime, full_rank = [1, 6, 15] unless S~ has at least 64, 32, 16
      zeros on the 64-point cube, and the threshold is p_0 = 3. The
      one-integer-instance ladder - which is what "specialization of one integer
      matrix family" actually MEANS - was executed by the red team and passes at
      every prime in {3, 5, ..., 199, 4099, 2^64 - 59, P-256}, deviating only at
      2.
    - >-
      THE SUPPORT SURVIVES THIS EXPERIMENT'S OWN ADVERSE FINDINGS, and each is
      checked against it individually rather than in aggregate. R2 BREAKS on the
      INFORMATION CONTENT of the sweep - the whole recorded vector was forced
      before the run, so criteria (3) and (5) could fail only by an instrument
      fault and criterion (4)'s interval bounds an event set that is EMPTY at
      the prime it names. That is not adverse to the claim; it is the claim
      being right, and the hypothesis's own title already calls the sweep
      calibration. R4 BREAKS on what the observable is a FUNCTION OF - full_rank
      is determined by the zero set alone and top_rank by the fixed integer top
      form alone - which narrows the scope and is carried in the supported
      statement below rather than set aside. Neither break touches
      p-independence at fixed shape.
    - >-
      THE SCOPE LIMIT IS PART OF THE SUPPORTED CLAIM, not a caveat attached to
      it. Mutation M2 - the parameter-free integer top form 16 Q_1 Q_2 with
      randomised sub-top coefficients, containing NO elliptic curve, NO target,
      NO planted decomposition and no Semaev polynomial beyond its top monomial
      - reproduces the recorded Semaev profile [(0,0),(1,1),(6,2),(15,1)] with
      d_ff = 5 and fall_dim [0,0,4,14] in 40 of 40 draws at each of the three
      primes; mutation M1 (same zero set, random coefficients on the same
      support) reproduces the NULL arm's profile exactly, 40/40 at each prime;
      and the singular non-curve cubic reproduces the Semaev arm at every prime
      by construction (identical top form, |Z| = 2, verified 40/40 per prime).
      THEREFORE THIS RESULT IS NOT A STATEMENT ABOUT SUMMATION POLYNOMIALS,
      ELLIPTIC CURVES OR THE ECDLP. It is a statement about a fixed integer
      degree-4 form and a zero-set threshold, and every downstream sentence must
      read "any generator with this integer top form behaves thus" rather than
      "the Semaev system at (2,2,3) behaves thus". A support that could not be
      stated this narrowly and stay true would have been a replicate or a
      weaken; this one can.
    - >-
      THE RECEIPT IS ADMISSIBLE ON EVERY VALIDATION JOINT. 36 of 36 sidecar
      digests recompute; one run_experiment.py hash across all six manifests;
      2^64 - 59 confirmed prime with no prime in (2^64 - 59, 2^64) under the
      reviewer's own 12-base Miller-Rabin; the meter self-test re-run at "52
      passed"; every count, interval and difference in analysis.md recomputed
      from the raw records alone by a script that never opened analysis.json;
      245 of 245 draws reproduced by an independent elimination at all three
      primes including all five NIST P-256 named draws; and 276 planted
      certificates re-verified with 0 failures under an implementation sharing
      no code with the producer's.
    - >-
      THREE STATED GROUNDS OF THE RECORD ARE FALSE AS WRITTEN AND ARE CORRECTED
      HERE RATHER THAN SOFTENED. (a) The committed records define P_D as the
      PRODUCT of the nonzero maximal minors, giving deg(P_D) <= 4.79e15 at
      D = 6, so the quoted Schwartz-Zippel bound is VACUOUS at p = 4099 and
      p = 16411 - the very primes criterion (4) is about; the usable constant
      30/4099 is Stage 0's single-minor refinement, which is correct and is not
      in the ledger record. (b) stage0-derivation.md section 4 computes content
      primes as the gcd of the ENTRIES and concludes "no odd prime divides any
      entry's content", which cannot exclude odd content primes - the
      proves-too-much object W_{1,3} over F_3 is a matrix of entry content 2
      whose rank drops at p = 3. (c) "only generator-level rank profiles are
      read; no ideal-level invariant appears" is false; four of the five
      reported invariants are point-set quantities and the confound is
      neutralised only by planting pinning |Z(S~)| = 2. The CONCLUSION each was
      meant to support is now on a strictly better footing - the reviewer's
      invariant-factor computation is a sharper instrument than the entry-content
      check it replaces - and three superseding annotations are owed.
    - >-
      CRITERION (2) FAILED AS WRITTEN AND THE INSTRUMENT IS UNCHARGED. The
      measured positive-control first fall is 66 and 130 against the frozen 65
      and 129, in 6 of 6 draws at each prime, under the contract's own d_ff
      definition. R3 establishes by an independent syzygy derivation that the
      contract's d_ff MUST return B + 2 - the top forms (x_1^2 x_2^2, x_1^B,
      x_2^B) have lcm syzygies at B + 2, B + 2 and 2B - and that the frozen
      B + 1 is IDEA-20260808-093497's degree of REGULARITY transcribed into a
      prediction about a FIRST FALL. The frozen integers were therefore
      unsatisfiable by any instance. The reading was RECORDED, not substituted:
      analyze.py keeps the frozen values and emits both comparisons, and the
      specification is byte-identical to its approving commit. No criterion is
      re-scored by this decision; that needs a versioned protocol_amendment.
    - >-
      TWO HEURISTICS ARE EXPLICITLY NOT ADVANCED. HEUR-001 (rank-drop density
      c_D/p) is NEITHER SUPPORTED NOR TESTED here: for the Semaev arm a drop
      requires at least 16 zeros of S~ on 64 cube points, a codimension-at-least-14
      coincidence, so the true rate at p = 4099 is 0 - exhaustively, on the whole
      x_R axis, for 19,992 curves - rather than c/p, and 0 of 40 cannot
      discriminate c/p from p^{-14}. The arm where a c/p law is real and
      measurable is the support-matched null's top_rank at D = 5, whose rates the
      reviewer measured on the ladder p = 5, 7, 11, 13, 101, 4099 as 0.2800,
      0.1835, 0.1035, 0.0935, 0.0130, 0.0005 with 2000 draws per rung. HEUR-002
      failed by exactly its pre-registered integers, but M2 shows those integers
      are a constant of the digit map rather than Semaev-specific structure, so
      no status of IDEA-20260731-009 or its HEUR-FF-1 changes.
    - >-
      THE PRIOR WAS CONFIRMED AND SHARPENED, AND ITS EXPECTED EVIDENCE LABEL WAS
      REFINED. Every substantive expectation of the coordinator_prior of
      TASK-20260904-4c0d7d held; two were sharpened (the only content prime is
      2, not "2 and 3"; the rank-drop locus is EMPTY rather than thin). What the
      round refined is the prior's own proposed label "replicated (three primes,
      two independent engines)": three primes are three evaluations of a forced
      integer and the second engine covers only p in {4099, 65537}, both far
      above p_0 = 3, so it is a cross-implementation check of one forced value.
      The evidence record therefore records replication OF THE MEASUREMENT by
      four independent implementations and states explicitly that nothing on the
      p-axis is an independent test.
    - >-
      NO CRYPTOGRAPHIC-SCALE LABEL. The mechanical tier rule of
      docs/claims-and-verification.md would derive "crypto" from the P-256 field
      size; that would misdescribe a 64-column exact rank costing 3.25 s and
      62 MB whose value was forced before the run. The contract's own toy tier
      is kept with the field size disclosed, which is exactly the red team's
      requested fix. "Reached the P-256 prime" must never become "validated at
      cryptographic scale".
