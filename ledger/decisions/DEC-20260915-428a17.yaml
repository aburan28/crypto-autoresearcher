coordinator_decision:
  id: DEC-20260915-428a17
  context: >-
    Opening BATCH-a33cda on GOAL-ICPERF-e6b6a4 (ECC area ICPERF; campaign budget
    unlimited by policy; ECC-first). BATCH-51e2aa closed on 2026-09-15 with
    EV-ICPERF-390707 and DEC-20260915-87360d: H-ICPERF-cc4847 is `weakened`,
    EXP-ICPERF-66fd51 is `analyzed` and deliberately not `archived`, and the
    goal head's `next_action` carries the review's own five-item ranking of
    batch 2's work. This decision opens the batch on item (1) of that ranking,
    records the architectural choice the frozen contract forces, discharges the
    successor-hypothesis debt H-ICPERF-cc4847 records, drafts the row contract
    that will consume the repaired instrument, and approves the one protocol
    that is complete. Zero runs are performed by this decision.
  decision: approve
  target_ids:
    - BATCH-a33cda
    - EXP-ICPERF-e21835
    - H-ICPERF-2c57cc
    - EXP-ICPERF-13f001
    - GOAL-ICPERF-e6b6a4
  ranking:
    method: >-
      The goal head's `next_action`, written by the composition of
      BATCH-51e2aa's review (DEC-20260915-87360d), is the authority for what
      this batch opens. It ranked five items. This decision opens item (1) and
      states, for each of the other four, why it is behind item (1) rather than
      dropped -- because a deprioritization must name its evidence, its test
      boundary and its revisit condition (AGENTS.md "Research-direction
      integrity").
    opened:
      - rank: 1
        item: >-
          REPAIR THE INSTRUMENT, as one scoped executor task
          (EXP-ICPERF-e21835, TASK-20260915-4f4027), with independent
          acceptance in the same batch.
        why_first: >-
          It is the only reason two of six engine columns are empty, and the
          cost of NOT doing it first is measured rather than estimated:
          RUN-ICPERF-305ca3 spent an eight-hour executor budget and returned a
          zero Groebner column for two independent instrument reasons, one of
          which (the emitted-script parse error, D1) no memory limit could have
          rescued. Every other ranked item either consumes the same instrument
          or produces a number the same reduction would report. Running any of
          them first risks reproducing that outcome at greater cost.
        payoff_is_measured_not_hoped_for: >-
          EV-ICPERF-390707 joint V2: Singular slimgb computed the n15l5-1-S
          basis in 167.4 s and Macaulay2 F4 in 49.97 s, agreeing on gb_size =
          43, maxdeg = 2, non-unit. The Groebner column is reachable on this
          host inside the contracted budget and was not measured.
      - rank: 1b
        item: >-
          The successor hypothesis H-ICPERF-2c57cc and the row contract
          EXP-ICPERF-13f001 (drafted, NOT approved).
        why_here: >-
          Not a separate research choice: a debt and a consumer. H-ICPERF-cc4847
          `superseding_restatement_owed` requires two wordings to be restated in
          a NEW record, and this batch re-measures quantities those wordings
          govern (the Groebner column P2/Q2 and the P3c/Q3c ratios), so the
          restatement cannot wait. The row contract exists so the repair has a
          declared consumer and its acceptance criteria have a purpose; it stays
          `draft` at `approved_by: null` with five explicit approval
          preconditions.
    deferred_with_reasons:
      - rank: 2
        item: >-
          IDEA-20260915-3f1964, the exhaustive side-classified V^3 table,
          inheriting the reviewer's enumeration.
        why_behind: >-
          It is the strongest of the four deferred items and the closest to
          ready: the enumeration already exists as validator artifacts
          (v1_decomp_search_*.json), already covers all 60 instances, and
          already agrees with the solvers 60/60. It is behind item (1) for one
          reason only -- it is INDEPENDENT of the repair, so nothing is lost by
          ordering it second, whereas anything that consumes the instrument is
          blocked by it. It is not blocked, not diminished, and not closed.
        revisit_condition: >-
          Open it as the next batch, or as a second lane on this goal, as soon as
          BATCH-a33cda's executor task is dispatched -- it shares no write scope
          with this batch and could run concurrently if machine headroom allowed,
          which it does not (see `max_concurrent_basis`).
        test_boundary_untouched: >-
          Nothing in this batch measures or bears on the side-classified V^3
          table beyond what EV-ICPERF-390707 already recorded.
      - rank: 3
        item: >-
          Settle, with no solver, why the 30 shipped U targets contain one
          decomposable target where the measured fractions predict 5.57
          (P(X <= 1) = 0.0148): regenerate U targets at a recorded seed.
        why_behind: >-
          It is cheap and it is genuinely open, but it changes no column of the
          boundary table; it changes what the sentence "U instance" is allowed to
          mean. Until it is done, every U-instance statement in this goal is
          scoped to 30 specific shipped files, and H-ICPERF-2c57cc's
          `assumptions` says so in terms. That scoping is an adequate holding
          position; a wrong instrument is not.
        revisit_condition: >-
          Before any claim quantified over "U instances" as a population rather
          than as 30 files. H-ICPERF-2c57cc makes no such claim.
      - rank: 4
        item: >-
          Separate structure from variable order -- IDEA-20260915-7ef636's
          2x2-plus-planted-core null.
        why_behind: >-
          This is the item this decision is most careful about, because deferring
          it could be mistaken for burying the previous round's most informative
          result. It is not deferred by weakening the finding: the finding is
          APPLIED, immediately and in full. H-ICPERF-2c57cc's Q6 DROPS the
          mechanism attribution outright, its `mechanism` section states why in
          full and names IDEA-20260915-7ef636 as the design that could recover
          it, and EXP-ICPERF-13f001 CH-7 removes the attribution from the row's
          reported prediction. What is deferred is the new 2x2 experiment, and
          only because it needs the same quiet machine and the same repaired
          reduction that item (1) delivers.
        revisit_condition: >-
          Design it in the batch that follows this one, or in a second lane; it
          is ranked work under AGENTS.md ECC instruction 3 (an open ECC idea is
          designed, not shelved).
        what_remains_open_explicitly: >-
          Whether WDSat's advantage on the descended system is a property of the
          descended structure, of the emitted variable order, or of both. This
          goal currently has measured evidence for the ORDER half only (Q3a/b/c)
          and none for structure.
      - rank: 5
        item: >-
          Build the generic-baseline column by MEASURING rho and BSGS on these
          groups and this host.
        why_behind: >-
          It is a different column of the same row and does not need this
          instrument at all, so it is a legitimate candidate for a parallel lane
          rather than a successor. It is behind item (1) on machine headroom: it
          is a timing measurement and cannot share a host with a timing
          benchmark. Its own corrections are already recorded (carry sqrt(n) not
          sqrt(2n); use r not #E; n = 15 is unusable for an asymptotic constant
          at ~7 equivalence classes -- EV-ICPERF-390707 joint V6).
        revisit_condition: >-
          When no ICPERF lane holds the machine quiet, or as the batch after the
          row runs. GOAL-ICPERF-e6b6a4's first completion criterion requires it,
          so it cannot be dropped.
    not_ranked_because_not_ours:
      - item: >-
          H-ICPERF-5f038b (`specified`) and EXP-ICPERF-025a52 (v2, `draft`,
          `approved_by: null`) -- the descent-as-a-DAG sharing-ratio lane, with
          CORR-20260915-6708e4 recording a dispatch-precondition violation
          against it, DEC-20260915-674299 as its design decision and
          DEC-20260915-674299's successor DEC-20260915-d8d413 (merged to main as
          851c19411, read here through the merge digest) as its current state:
          `revise`, approval WITHHELD.
        why: >-
          Another session drives that lane, from its own branch, and this
          decision records what is checkable rather than asserting a concurrency
          it cannot observe: EXP-ICPERF-025a52 is `draft` at `approved_by: null`
          with approval explicitly withheld by DEC-20260915-d8d413,
          `tools/goal_lanes.py lanes GOAL-ICPERF-e6b6a4` records no lane, and no
          bus message addressed this batch. So that lane may resume, or not, at
          any point during BATCH-a33cda without this session being told --
          which is the ordinary condition of this repository and the reason
          BATCH-a33cda is built DISJOINT from it either way: no task in this
          queue reads or writes
          ledger/hypotheses/H-ICPERF-5f038b.yaml,
          experiments/EXP-ICPERF-025a52/, or
          coordination/goals/GOAL-ICPERF-e6b6a4/tasks/TASK-20260915-532164/, and
          no record here supersedes, cites as support, or changes the status of
          anything in it. The two lanes share only the goal head, which each
          edits additively inside its own ledger archive
          (docs/concurrent-goal-lanes.md).
  rationale:
    - id: R-ARCH
      claim: >-
        The repair lands as (a) A SUCCESSOR EXPERIMENT CONTRACT WITH ITS OWN CODE
        TREE (EXP-ICPERF-e21835), not as (b) an additive amendment to
        EXP-ICPERF-66fd51 with a versioned code directory.
      reasons: >-
        (1) THE CHANGES ARE NOT ADDITIVE TO THE PROTOCOL. Replacing RLIMIT_AS
        with a resident-set watchdog and moving the ceiling from 6 GB to 8 GiB
        changes `budget.enforcement` and `budget.maximum_memory_gb` -- two
        frozen scientific parameters, not two absent ones. An amendment that
        changes the KIND and the VALUE of a declared resource limit is a
        protocol rewrite wearing an amendment's clothes, and AGENTS.md's
        amendment rule is explicitly additive.
        (2) A CONTRACT WITH TWO CODE TREES CANNOT SAY WHICH RUN USED WHICH.
        EXP-ICPERF-66fd51 `inputs.code` names the four files under
        experiments/EXP-ICPERF-66fd51/code/, and both existing run manifests
        point there. That field is frozen and cannot be edited to name a
        `code_v2/`, so every later reader would have to compose the
        specification with an amendment to learn which bytes produced which row.
        (3) THE FROZEN BYTES ARE THE EVIDENCE FOR THE DEFECT CLAIMS.
        TASK-20260913-f8bdec hash-binds all four files (binding_mode
        content_at_commit). They are the object EV-ICPERF-390707 reported on;
        editing them in place would destroy it, and putting a second tree beside
        them under one contract invites exactly that later.
        (4) THE PHASE STRUCTURE IS INHERITED BY REFERENCE, SO NOTHING IS
        DUPLICATED EXCEPT FILES.
      cost_accepted: >-
        Two copies of binec.py now exist, and a future fix to the curve
        arithmetic must be applied twice or the divergence recorded. That cost is
        stated in both contracts' `interpretation_limits` and its resolution is
        already named in GOAL-ICPERF-e6b6a4 objective (2): promotion into tools/
        after a validator has run the code. This acceptance is that validator
        pass.
      what_is_not_done: >-
        EXP-ICPERF-66fd51 stays `analyzed`, its four code files stay
        byte-identical, its two run packages and its retained aborted launch are
        untouched, and its summary.json files are never regenerated -- the
        repaired reduction writes side-by-side output under the new contract
        (control C-NOWRITE, joint R5).
    - id: R-DEBT
      claim: >-
        The successor hypothesis H-ICPERF-2c57cc is owed by this batch and is
        written now, at `specified`.
      reasons: >-
        H-ICPERF-cc4847 `superseding_restatement_owed` requires two wordings to
        be restated in a NEW record and never by editing that frozen one. This
        batch re-measures quantities those wordings govern: the acceptance
        re-measures the Groebner column that P2 predicts about, and the repaired
        reduction recomputes the P3c ratios and the P5/P6 verdicts. Even as an
        instrument check that is enough to owe the restatement. Both are
        discharged: Q1 reads "a valid decomposition ON E OR ON ITS QUADRATIC
        TWIST, with the side RECORDED"; Q6 DROPS the mechanism attribution and
        `mechanism` names IDEA-20260915-7ef636's 2x2-plus-planted-core design as
        the route that could recover it, since the null-object comparison alone
        provably cannot (EV-ICPERF-390707 proves_too_much object 2, FAILED).
      what_it_does_not_do: >-
        It does not reinstate any clause. Q2 and Q5's Groebner clause are carried
        UNCHANGED because they were unmeasured, not refuted (AGENTS.md core rule
        5), and Q3/Q4 are carried unchanged because they were supported.
    - id: R-REVIEW
      claim: >-
        The repair is a claim-relevant producer (`review_required: true`) and
        gets two independent validator sessions plus a ledger archive in this
        same batch, under a review plan written before either runs.
      reasons: >-
        The acceptance gates two things -- whether EXP-ICPERF-13f001 is approved
        (its AP-1) and whether the Groebner column is declared measurable on this
        host -- and both are claim-changing. It also has a specific precedent
        against self-checking: in BATCH-51e2aa a producer's own summary reported
        three predictions as holding that were partly unevaluated, and it took an
        independent reduction to find it. TWO reviewers rather than one because
        the load-bearing quantity needs a BLIND re-derivation and the reviewer
        who audits the converter's diff cannot also be blind to the converter.
        The single most useful thing about the existing gb_size = 43 agreement is
        also its weakness: Macaulay2 F4 and Singular slimgb read two files
        emitted by ONE converter, so their agreement cannot detect a converter
        defect. R6 can.
    - id: R-APPROVE
      claim: >-
        EXP-ICPERF-e21835 is APPROVED and EXP-ICPERF-13f001 is NOT.
      reasons: >-
        Standing user authorization (AGENTS.md, 2026-09-06) already covers idea
        intake, experiment design and approval, so no user confirmation is
        sought for either. What separates them is PROTOCOL COMPLETENESS, which is
        the Coordinator's responsibility: EXP-ICPERF-e21835 has its controls,
        metrics, budgets, stopping rules, invalidation rules, artifact paths,
        dependencies, inference policy and a pre-registered acceptance table, so
        it is approved. EXP-ICPERF-13f001 has five named gaps (AP-1 to AP-5),
        three of them substantive -- the slimgb configuration does not exist, the
        side classifier does not exist, and its per-engine plan sizes cannot be
        sized until the accepted instrument's Groebner behaviour is measured. An
        incomplete protocol is completed or records its impediment; it never
        waits for a user.
      approval_does_not_assert: >-
        That either hypothesis is true, that the repair will pass its own
        acceptance, or that the Groebner column will be measurable at l = 6.
    - id: R-SCOPE
      claim: >-
        The repair is confined to the four defects the goal head names, plus one
        non-gating reporting item the closing decision named, and three
        candidate improvements are explicitly EXCLUDED with reasons.
      reasons: >-
        D1-D4 are the four measured defects. D5 (per-engine solver statistics for
        the pure-CNF engines) is included because DEC-20260915-87360d
        next_actions named it and because it lives in the same file as D2 and D4,
        so deferring it would mean touching bench.py twice; it is NON-GATING, and
        acceptance requires either the counters or a recorded reason per engine.
        Excluded, each recorded in EXP-ICPERF-e21835
        `defects_deliberately_not_repaired`: the null objects' constant-term
        mismatch (a change to the CONTROL, which belongs to the row contract's
        control design as C-NULL2 so that two null families can be compared
        rather than one silently replacing the other); flagging the degenerate
        n15l5-8-S (a reporting decision about the row, declared as CH-6); and the
        Singular slimgb configuration (an engine addition is a protocol change to
        the row, declared as AP-2 and ranked in next_actions).
    - id: R-LIMITS
      claim: >-
        The acceptance is designed to be able to FAIL, and its failure modes are
        pre-registered as reference values another agent measured first.
      reasons: >-
        Every value in EXP-ICPERF-e21835 `preregistered_prediction` comes from
        EV-ICPERF-390707, composed before this contract was written, so none of
        it can be fitted to the repair's output. The proves-too-much control runs
        the acceptance procedure against the UNREPAIRED tree, where every
        criterion must fail in its defect's specific way: an acceptance that
        passes the instrument it is supposed to reject has measured nothing.
  evidence_refs:
    - EV-ICPERF-390707
    - DEC-20260915-87360d
    - coordination/review/icperf-20260913-66fd51/TASK-20260913-6c5729/report.md
    - coordination/review/icperf-20260915-a33cda/review-plan.yaml
    - coordination/review/icperf-20260913-66fd51/TASK-20260915-195b0c/report.md
    - coordination/review/icperf-20260913-66fd51/TASK-20260913-6c5729/artifacts/v3_reduce.json
    - coordination/review/icperf-20260913-66fd51/TASK-20260915-195b0c/artifacts/m2_reportfix.diff
    - experiments/EXP-ICPERF-66fd51/specification.yaml
    - experiments/EXP-ICPERF-66fd51/runs/RUN-ICPERF-c9590f/ABORTED.md
    - ledger/hypotheses/H-ICPERF-cc4847.yaml
    - ledger/goals/GOAL-ICPERF-e6b6a4/goal.yaml
    - ledger/proposals/IDEA-20260915-3f1964.yaml
    - ledger/proposals/IDEA-20260915-7ef636.yaml
  evidence_refs_provenance: >-
    All `internal`: every reference above is a record or artifact committed in
    this repository and read by this Coordinator session in the course of writing
    this decision. No external citation is made and nothing is cited as
    `recalled`.
  limitations:
    - >-
      This decision performs ZERO runs and measures nothing. Every number it
      quotes was measured by another agent and is cited, not re-derived.
    - >-
      Three of the four defects under repair are in code this Coordinator wrote,
      and this Coordinator wrote the review plan and will compose the round. That
      concentration is disclosed in the review plan's `blindness` block as the
      round's principal weakness and is only partly mitigated -- by the executor
      rather than the Coordinator writing the repair, and by joint R6's blindness
      on the one load-bearing quantity.
    - >-
      The acceptance rests on ONE instance (n15l5-1-S) for the Groebner path. A
      repair accepted there could still fail at l = 6, where F4 may not finish at
      all. This is stated in EXP-ICPERF-e21835 `replication` and is the reason
      EXP-ICPERF-13f001's budget expects l = 6 Groebner rows to be censored.
    - >-
      The 8 GiB resident-set limit is a LIMIT, not a measurement of what F4
      needs. EV-ICPERF-390707 joint V2 measured that an equivalent 6 GiB RSS cap
      would also kill the n15l5 Groebner row -- honestly, which the 6 GB
      RLIMIT_AS did not. A row the new watchdog kills is a budget stop with its
      limit recorded and is never negative evidence.
    - >-
      Nothing here bears on RQ-ICPERF-94c86e's decision target. An instrument
      acceptance moves no column of the boundary table; it makes one column
      recordable.
    - >-
      BATCH-51e2aa has no goal checkpoint shard under
      ledger/goals/GOAL-ICPERF-e6b6a4/checkpoints/. That is a disclosed gap in
      the previous batch's archive, not repaired here (writing a checkpoint for a
      batch whose ledger archive already completed would leave it owned by no
      archival task). BATCH-a33cda's checkpoint is declared as an artifact of
      this batch's ledger archive, TASK-20260915-efa91b.
  next_actions:
    - >-
      DISPATCH TASK-20260915-4f4027 (executor, EXP-ICPERF-e21835) after
      TASK-20260915-6d72a0 has committed and pushed the design records. The
      dispatcher -- not the executor -- must first satisfy the three standing
      dispatch preconditions (AGENTS.md "Dispatch preconditions bind the
      DISPATCHER"): `archived_by` bound (it is: TASK-20260915-7da7f1), declared
      inputs committed and pushed, and a lane claimed with the machine quiet.
    - >-
      Then TASK-20260915-7da7f1 (snapshot), then TASK-20260915-3f4b52 and
      TASK-20260915-abf147 (independent validators, serialized on machine
      headroom), then TASK-20260915-efa91b (ledger archive: EV-ICPERF-433fa5,
      DEC-20260915-927eaa, the goal checkpoint, and the status transitions the
      acceptance supports).
    - >-
      OWED IMPLEMENTATION, ranked and not lost: the Singular `slimgb`
      configuration (EXP-ICPERF-13f001 AP-2) and the side-classified verifier
      (AP-3). Both are protocol additions to the row rather than defect repairs
      and belong to a task in the batch that approves EXP-ICPERF-13f001.
    - >-
      Rank IDEA-20260915-3f1964 (the exhaustive side-classified V^3 table) for
      the next batch or a second lane; it shares no write scope with this batch
      and is blocked only on machine headroom.
    - >-
      Design IDEA-20260915-7ef636's 2x2-plus-planted-core null as the successor
      that can recover the structure-versus-variable-order attribution
      H-ICPERF-2c57cc deliberately drops.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is a batch-opening and protocol-approval decision, not an
      evidence-review decision: it composes no evidence record and assigns no
      evidence strength, so no finding is available to promote. The
      knowledge-promotion gate applies at this batch's CLOSING decision
      (DEC-20260915-927eaa over EV-ICPERF-433fa5), where the honest expectation
      is also `not_warranted` -- an instrument acceptance is a fitness statement
      about this repository's own harness, not a durable claim about elliptic
      curves, and knowledge/findings/ is not where a working instrument belongs.
      If the round instead finds that the shared converter emits the wrong ideal
      (joint R6 disagreeing), THAT would be a durable finding about a
      reimplementation hazard and would be promoted.
  decided_by: coordinator
  decided_at: '2026-09-15'
  batch_id: BATCH-a33cda
  authorization_basis: >-
    Standing user authorization, AGENTS.md 2026-09-06 ("all is approved.
    ideas/experiments should be always approved"). No user selection or
    confirmation was sought for any idea, protocol or approval in this batch.
    ECC budget policy (AGENTS.md "ECC comes first"): GOAL-ICPERF-e6b6a4's
    `campaign_budget.maximum_batches` and `.total_wall_clock_seconds` remain
    null; `max_concurrent` is machine headroom and is set to 1 for this batch.
