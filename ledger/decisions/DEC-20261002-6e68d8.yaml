      evidence: worksheet step_4; rederivation-report.yaml Q1 to Q3; repair-design D-C3, D-C4

    - id: R-JD2
      subject: JD2 composed (order attestation read first, CD-5)
      ruling: >-
        BREAKS. Order respected: v0 own route table at 12:43:13Z before the
        design and amendment were opened. O-3 alone breaks the joint and the
        PTM-D3 failure signature: AC-7 as specified (trace without operand
        provenance) admits I_direct in two disguises (D3b, D3c) on 184 of 184
        synthetic rows each, and S-BERL's own Q rows contradict the
        independence text rule; it uses no timing. O-1 breaks attack (ii) on
        the design's own 30-day criterion: derivation (A) measured inside CI-5
        and the 8 GiB ceiling within the horizon on the substituted groups
        (12, 5) and (13, 5); contention (SP-3) can only lengthen measured
        times, so O-1 is conservative. O-2 (the engine WO-I-1 permits is
        slower than model E, putting (11, 4) and (14, 5) beyond the horizon)
        is adopted as a cost-model and engine-declaration defect and is not
        relied on alone. What holds is recorded: A1 necessary on at least
        2664 rows; amendment inside R-AMEND-SCOPE in kind; POST-DATA honest;
        S1 and calibration consequences substantially honest; S-BERL
        independent as an algorithm; CI-1, CI-3, CI-4 hold; D-5 holds;
        PTM-D2 met.
      evidence: red-team-report.yaml verdict, order_attestation, jd2, ptm_d2, ptm_d3, objections O-1 to O-9

    - id: R-JD1
      subject: JD1 composed
      ruling: >-
        BREAKS at three places, each with a constructed input. BA-1: a
        terminal failed record without raw-result.json fails check_run and no
        acceptance check catches it (D-1, D-8). BA-2: certificate files named
