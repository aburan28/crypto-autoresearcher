    - id: R-AMD
      subject: amendment-v2.yaml (AMD-20261002-1303c4); R-AMEND-SCOPE classification; the AMD id (CD-13)
      ruling: >-
        REFUSED. Classification: inside R-AMEND-SCOPE in kind, A1 only (route
