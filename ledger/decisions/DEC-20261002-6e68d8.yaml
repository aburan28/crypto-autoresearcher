        K-DESIGN-REVISE. Its conditions hold three times over: JD1 breaks,
        JD2 breaks, TQ-3 fired. K-design-accept fails on JD1, JD2, PTM-D3 and
        TQ-3. K-indeterminate does not apply (JD3 agrees). K-infra does not
