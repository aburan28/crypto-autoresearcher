        with replacement, so the work orders fail the design's own
        bookkeeping by construction; K-coefficient naming undefined (D-2,
        D-3 accounting). BA-3: the M9 read-set rule matches strings without a
        canonical form, so ordinary path forms of a blind_from entry return
        blind_from_respected true and AC-11 never samples them (D-6); the
        composer adopts JD1's R-2 pointer that AC-16 (CC-4, JD2-owned)
        inherits the same rule. Holds: every item has a verified clause and a
        check that can fail; check_run-clean on completed and killed records;
        no census-code path in Stage 0; no run-id reuse; PTM-D1 met.
      evidence: validation-report.yaml jd1 BA-1 to BA-3, attack_ii, attack_iv, discharge_coverage, ptm_d1, SO-1 to SO-8, R-1 to R-3

    - id: R-TRIPWIRES
      subject: TQ-1 to TQ-5 (CD-7)
      ruling: >-
        TQ-3 FIRED by self-report: the producer's PD-1 (mental evaluation of
        lambda o lambda and H for one Stage-0 lambda at (4, 3); inspection of
        C4's H) and reviewer 323713's RTD-1 and RTD-2 (hand expansion of H
        for a Stage-0 lambda and for C2 at (7, 3)). Each computes an H
        polynomial on a declared cell, which TQ-3 names. Effect applied:
        K-design-revise, no acceptance (already forced by JD1 and JD2).
        Materiality: no value exists in any file, message or artifact, so no
        artifact is seeded; neither session may author the Stage-0 hand note
        or hold a card that executes or checks Stage 0, C2 or C4 values, and
        neither does. A reviewer's TQ-3 event does not void its joint (only
        TQ-1 does); JD2's findings rest on synthetic cells and stand. NOT
        FIRED: RTD-3 (stopped before computing anything); JD1 PN-2 and JD3
        (bound-formula arithmetic and candidate counting, which the plan
        directs, not in TQ-3's list); JD2 timings on random synthetic
        polynomials (no declared cell). TQ-1, TQ-2, TQ-4 and TQ-5 not fired
        (worksheet step_6).
      evidence: repair-design procedure_deviations PD-1; red-team-report.yaml tripwire_self_reports; validation-report.yaml referred_to_composer R-1, procedure_notes PN-1, PN-2

    - id: R-DISCHARGE
      subject: discharge check (plan composition.discharge_check)
      ruling: >-
        Every D-item, carried condition, CI item and R-AMEND-SCOPE maps to a
        named clause; no item fails for want of a clause. Discharge is
