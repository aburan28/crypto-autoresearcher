  context: >-
    ADJUDICATION OF THE TWO INDEPENDENT REVIEWS DEC-20260810-5aeeaa RESERVED
    ON experiments/EXP-INSTR-36c8cf/amendments/v2.yaml (filed
    `filed_pending_independent_validation_NOT_APPROVED`). V1
    (VAL-20260810-eddc0c) re-derived the nested-ladder noise arithmetic and
    the skewness/tail-weight behaviour of the SR3 v3 characterisation's raw
    per-seed data and returned INCONCLUSIVE on HEUR-INSTR-4 (ordinary
    sampling noise) versus the competing heavy-tail explanation, with a
    material methodological finding that the in-sample D2 exceedance
    diagnostic amendment v2 proposes for rungs 4-8 self-masks exactly the
    kind of single-point tail excess it is meant to detect. V2
    (RT-20260810-b12e04) red-teamed the freeze question, attacked changes E6
    and E7 and the T1-T4 termination mechanism directly, could not break it,
    and registered one narrow, documentation-curable DISSENT limited to
    DEC-20260810-5aeeaa's own gloss of condition (b), which a targeted search
    of the committed record shows to be checkably false. Per
    DEC-20260810-5aeeaa.what_would_clear_it and
    amendments/v2.yaml.validation_required_before_approval, "A DISSENT FROM
    EITHER BLOCKS APPROVAL. It is not outvoted; it stands until a new
    Coordinator decision supersedes it on the merits." Outright approval of
    amendment v2 as filed was therefore not available to this session; this
    decision adjudicates both reviews, supersedes the dissented claim on the
    merits, and approves a new amendment (v3) that corrects the record and
    binds V1's diagnostic finding as a condition of the ladder extension it
    governs.

  decision: revise

  decision_scope: >-
    Scoped to the protocol of EXP-INSTR-36c8cf and to a single, narrow
    supersession of one clause of DEC-20260810-5aeeaa's own text, by
    reference, and to nothing else. This decision does NOT edit
    DEC-20260810-5aeeaa.yaml, amendments/v2.yaml, or specification.yaml; all
    three remain on disk exactly as committed and immutable. It files and
    APPROVES experiments/EXP-INSTR-36c8cf/amendments/v3.yaml, which
    authorizes a successor run of the SR3 v3 characterisation subject to its
    own fresh handoff. It does not touch EXP-ICINV-4d33aa: RQ-ICINV-475b5e
    REMAINS PAUSED for that experiment, its own amendments/v3.yaml remains
    unwritten and is additionally blocked by finding F-V1.4
    (VAL-20260810-48202a), and nothing here unpauses that lane. It does not
    lift blockers B1 or B2, does not move any hypothesis status, does not
    discharge criterion C4, and edits no other committed record.

  validity_check_performed_before_any_interpretation: >-
    Both review reports were checked for validity before their conclusions
    were adopted, not accepted on their own say-so. Both reports' own
    `snapshot_read` / `snapshot_integrity_check` sections confirm commit
    60060084d is an ancestor of the branch head and that every artifact cited
    (sr3v3-reference-sampling.json, sr3v3-interval-stability.json,
    manifest.yaml, raw-result.json, DEC-20260810-5aeeaa.yaml, amendments/v1.yaml
    and v2.yaml) is byte-identical between that snapshot and the working
    tree, hash-verified path by path. V1's independence_statement and
    session_and_model_independence confirm a fresh session that did not
    author the run, the decision, or either amendment, resolving to
    claude-sonnet-5 against DEC-20260810-5aeeaa's own claude-opus-5 -- model
    independence, not merely session independence. V2's
    independence_and_provenance confirms the same for its own session,
    disjoint from V1's (V2 never opened V1's review directory). Both reports
    disclose zero new run execution and zero compute consumed against any
    experiment's budget (no_compute_authorized_note honoured). This
    Coordinator additionally re-checked, independently of both reports' own
    stated conclusions and before adopting either: (i) that
    RUN-ICINV-fg-primary-v2-p4001 exists at the reviewed snapshot, carries
    `status: completed_valid`, no `SUPERSEDED.yaml` marker, and its
    `command.txt` names `exp_icinv.targets_uniform`, confirming V2's OBJ-1
    exactly; (ii) V1's exceedance recomputation (fb=11: 3.3358 vs 3.2614;
    fb=22: 4.8231 vs 4.5123) and leave-one-out figures (in-sample z 3.556,
    LOO mean 3.1257, LOO sd 0.4024, LOO z 4.218, LOO upper endpoint 4.2889)
    reproduce exactly from the raw sr3v3-reference-sampling.json; (iii) V1's
    F-3 finding that DEC-20260810-5aeeaa's own reachability figures at
    24->48 and 48->96 do not reproduce under its own stated model (recomputed
    2.98e-06 and 1.64e-04 respectively, against DEC's stated 1.2e-4 and
    0.006, roughly 37-40x off), and that 96->192 (5.79e-3) is silently absent
    from DEC's list, while the other three transitions (192->384, 384->768,
    768->1536) match exactly. NO DEFECT IS RETURNED TO EITHER REVIEWER. Both
    reports are complete, schema-complete, internally consistent, and are
    evidence of what they report; both verdicts (V1 INCONCLUSIVE, V2
    CONDITIONAL-WITH-NARROW-DISSENT) are interpreted as returned.

  adjudication_of_v1_and_v2:
    v1_did_not_trigger_mandatory_withdrawal: >-
      amendments/v2.yaml.validation_required_before_approval states plainly:
      "IF IT RETURNS THE HEAVY-TAIL EXPLANATION, THIS AMENDMENT MUST BE
      WITHDRAWN RATHER THAN APPROVED." V1's own verdict field states
      `verdict_on_explanation_A_vs_B: INCONCLUSIVE`, and V1's own
      dissent_statement is explicit that "this report does not return
      Explanation B, so the explicit trigger... is not met by the letter of
      this verdict." Twelve of thirteen rows are unremarkable and consistent
      with ordinary sampling noise, matching DEC-20260810-5aeeaa's own prior
      probability estimates almost exactly; the fb=11 exceedance is
      explained by an already-disclosed, ordinary mechanism (cross-row
      correlation from one seed's shared target/curve draw, independently
      confirmed by that seed's elevated z-score at seven of thirteen other
      rows). Withdrawal is therefore not mandatory. Extension is not,
      however, unconditionally clean either.
    v1_material_finding_is_accepted_and_bound_in_rather_than_argued_away: >-
      V1's F-4 and F-5 findings are accepted as material and are not
      dismissed. The fb=22 exceedance is row-localized (unremarkable, |z| <
      1.1, at all twelve other rows for the same seed, ruling out a
      globally-hot-seed account for this specific point) and, under a
      leave-one-out recomputation calibrated against a disclosed, seeded,
      20000-trial Monte Carlo null of identical shape, is a 4.22 sigma
      outlier against the row's other 47 draws -- materially more extreme
      than the 3.56 sigma the in-sample check the contract currently relies
      on reports, because the in-sample check lets the outlier inflate its
      own denominator (V1's own worked demonstration: excluding the outlier
      drops sd_sample_n_minus_1 from 0.4675 to 0.4024, about 16%). Calibrated
      significance is borderline (~1-in-22 for a single row after a 13-row
      Bonferroni correction) -- not decisive for Explanation B, but not
      dismissible as ordinary noise either. V1's own successor_action for
      F-4 is explicit: "add a leave-one-out or externally-referenced tail
      check at minimum for fb=18 and fb=22" BEFORE treating a future
      "interval stabilised" reading (rungs 4-8) as dispositive. THIS
      COORDINATOR ADOPTS THAT RECOMMENDATION AS A BINDING CONDITION OF THE
      LADDER EXTENSION, in amendments/v3.yaml changes E11 (leave-one-out
      diagnostic D3 plus a freshly-calibrated Monte Carlo null D4 at every
      future rung, for all thirteen rows) and E12 (report the accepted
      interval's absolute half-width, per V2's F-01). This is the two-step
      process's intended output, not a workaround of it: a Coordinator-set
      diagnostic gap found by independent review, before compute is
      authorized on a design that has it.
    v2_dissent_is_narrow_and_is_superseded_here_on_the_merits: >-
      V2 registered exactly one item at dissent severity: DEC-20260810-5aeeaa's
      absolute phrasing of condition (b) ("no candidate arm value has been
      observed by anyone") is FALSE, falsified by a specific, named,
      already-committed run (RUN-ICINV-fg-primary-v2-p4001), independently
      confirmed by this Coordinator (see
      validity_check_performed_before_any_interpretation above). V2 is
      explicit that this dissent is "CURABLE by a documentation correction
      naming the found run and arguing its limited relevance, not by
      withdrawing the amendment or redesigning E6/E7" and that it does NOT
      extend to amendments/v2.yaml's own narrower wording of the same
      condition (accurate) or to the T1-T4 mechanism itself, which V2
      affirmatively attempted to break and could not
      (overall_disposition_on_the_freeze_question: CONDITIONAL, not
      REJECTED). THIS DECISION PERFORMS THAT CURE: DEC-20260810-5aeeaa's
      condition (b) claim is superseded BY REFERENCE (its text stands
      exactly as committed; it is not edited), and the correction --
      disclosing RUN-ICINV-fg-primary-v2-p4001's existence and status, and
      stating explicitly why its targets_uniform sampler and the unresolved
      H-ICINV-6c7920 dispute make it an unreliable, not nonexistent, anchor
      -- is written into experiments/EXP-INSTR-36c8cf/amendments/v3.yaml
      change E10, IN THE SAME LEDGER ARCHIVE AS THIS DECISION, not deferred
      to a later record. The dissent is therefore superseded on the merits,
      exactly as DEC-20260810-5aeeaa's own rule requires, and does not stand
      unresolved.
    v2_non_dissenting_findings_disposed_of: >-
      OBJ-2 / F-02 (no independent terminal-rung selection criterion
      independent of the friendly-hypothesis reachability arithmetic): named
      as minor and non-dissenting by V2 itself; not remedied by redesigning
      T1 here (T1 stays 1536, unchanged, per amendments/v3.yaml
      unchanged_and_still_frozen), because changing a frozen number now,
      informed by having seen this objection, would itself be exactly the
      kind of data-adjacent tinkering this campaign's discipline forbids.
      Recorded as forward guidance for any FUTURE ladder of this shape
      (V2's own RC-2), not adopted as a requirement on this one. OBJ-3 / F-04
      (amendment v1's own change G3 received the lighter approve-on-filing
      review track reserved for user decisions, though G3 was
      Coordinator-decided): a genuine process observation about this
      campaign's history that this decision cannot retroactively fix and
      does not attempt to; V2's own RC-3 recommends codifying the
      reachability-repair pattern as a standing requirement in
      docs/claims-and-verification.md or AGENTS.md, which is forwarded below
      as a recommendation and is NOT mandated by this decision (outside a
      single Coordinator decision's authority to impose campaign-wide
      policy unilaterally).

  why_v3_is_approved_on_filing_rather_than_filed_unapproved: >-
    THE CAMPAIGN'S OWN PRECEDENT, APPLIED RATHER THAN SET ASIDE.
    amendments/v2.yaml was filed unapproved because its repair was
    Coordinator-set and rested on an attribution (HEUR-INSTR-4 over the
    heavy-tail explanation) a validator could overturn. That attribution has
    now been independently tested and was NOT overturned (V1 did not return
    the heavy-tail explanation), and the mechanism it depends on (T1-T4) was
    independently attacked and held. Amendment v3's three changes are not a
    further Coordinator repair resting on an unreviewed attribution: E10
    documents a fact V2 itself found, searched for, and verified against the
    committed record; E11 adopts V1's OWN recommended diagnostic, framed by
    V1 itself as a condition on the extension rather than a reason to
    withdraw it; E12 adopts V2's own minor finding verbatim. None of the
    three moves the acceptance region and none makes the gate easier to
    pass -- E11 and E12 make a future "stabilised" reading MORE scrutinised,
    the opposite direction from a hull-fit. Approving this package directly
    is therefore not "doing in one step what the two-step exists to
    prevent"; it is exactly what an independent two-step review is supposed
    to produce when it returns "proceed, with this condition" rather than
    either a clean pass or a clean refutation.

  reachability_arithmetic_correction_recorded_plainly: >-
    V1 independently recomputed DEC-20260810-5aeeaa's own reachability
    figures under DEC's own stated model and found an arithmetic defect at
    two of six future-facing transitions: 24->48 recomputes to 2.98e-06
    (DEC states 1.2e-04, ~40x off) and 48->96 recomputes to 1.64e-04 (DEC
    states 6.0e-03, ~37x off); the 96->192 transition (5.79e-03) is silently
    absent from DEC's list entirely. The other three transitions (192->384:
    9.47e-02, 384->768: 5.13e-01, 768->1536: 9.30e-01) match DEC's stated
    values exactly. THIS DOES NOT CHANGE DEC-20260810-5aeeaa's QUALITATIVE
    CONCLUSION -- the corrected 24->48 figure makes "effectively unreachable
    at 48 seeds by construction" more true, not less. ANY FUTURE CITATION OF
    THESE FIGURES SHOULD USE V1's recomputed values (2.98e-06 / 1.64e-04 /
    5.79e-03 / 9.47e-02 / 5.13e-01 / 9.30e-01), not DEC-20260810-5aeeaa's
    original text, which is not edited and stands as committed with this
    correction recorded by reference in amendments/v3.yaml
    reachability_and_cost_figures_corrected_by_reference. This does not bear
    on HEUR-INSTR-4 versus the heavy-tail explanation, which is a self-
    consistency check within Explanation A, not a test of A against B.

