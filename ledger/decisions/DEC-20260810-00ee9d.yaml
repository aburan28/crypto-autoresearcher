    - >-
      STANDING CONSTRAINTS, none moved by this decision. H-INSTR-444c7b stays
      `specified`. H-ICINV-d5e351 stays `specified`. H-ICINV-6c7920 stays
      `specified`, neither presumed true nor false. H-ENDO-001 remains
      `approved`, used as the admissibility filter, not retested. H-STR-002
