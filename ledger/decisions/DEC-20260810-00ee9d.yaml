  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED NOW, FOR A CONCRETE REASON, WITH A NAMED REVISIT
      CONDITION RATHER THAN A CLOSED DOOR. This decision is `revise`, not
      `support` or `reject_scoped` on a hypothesis, and creates no evidence
      record; the promotion gate (a `support`/`reject_scoped` decision on
      `replicated` or `strong` evidence) does not fire. On the substance,
      two candidates were weighed and both are premature. (1) V1's
      self-masking finding -- that an in-sample mean +/- z*sd exceedance
      check systematically under-states the tail excess of a point that is
      itself part of the fitted sample, and that a leave-one-out or
      externally-referenced check is needed to see it -- is methodologically
      real, reusable across this campaign's other in-sample gates, and
      exactly the kind of thing knowledge/techniques/ exists to hold. It
      rests, however, on ONE unreplicated run, at ONE prime, ONE geometry,
      and its own calibration is BORDERLINE (~1-in-22 after correction) --
      suggestive, not established. It is also not yet independently
      red-teamed as a technique in its own right (V2's mandate was scoped to
      the freeze question, not to V1's diagnostic). Promoting it now would
      promote an unreviewed, unreplicated methodological claim into the
      corpus on the strength of a single validator's read. (2) V2's process
      finding -- that a Coordinator-set parameter (amendment v1 change G3)
