# =============================================================================
# DEC-20260926-ec2847 -- APPROVAL of EXP-WESO-9e2d6d (v1, frozen) and
# specification of H-WESO-516558 from IDEA-20260926-4a496f, under the
# standing user authorization. Heuristic-validation class. Opens executor
# card TASK-20260926-41c7e7. Moves H-WESO-516558 proposed -> specified ->
# approved. Moves no other hypothesis, goal or experiment. Launches nothing.
# Makes no security claim. Archived by TASK-20260926-b8e6be.
# =============================================================================
coordinator_decision:
  id: DEC-20260926-ec2847
  recorded_at: '2026-09-26'
  decided_at: '2026-09-26'
  decided_by: coordinator
  kind: experiment_approval
  archived_by: TASK-20260926-b8e6be
  question_id: RQ-WESO-8aff57
  goal_context: [GOAL-P13-001, GOAL-SSIQ-001, GOAL-SSI-001]

  decision: approve
  decision_label: >-
    APPROVED WITH CONDITIONS AC-1..AC-8. EXP-WESO-9e2d6d version 1 is frozen as
    written at experiments/EXP-WESO-9e2d6d/specification.yaml. H-WESO-516558 is
    specified and approved. TASK-20260926-41c7e7 (executor) is authorized to be
    dispatched once DP-1..DP-5 hold. Approval asserts nothing about whether
    Heuristic 1 or the sampler hypothesis is true.

  target_ids:
    - EXP-WESO-9e2d6d
    - H-WESO-516558
    - HEUR-WESO-516558-1
    - HEUR-WESO-516558-2
    - TASK-20260926-41c7e7
    - TASK-20260926-b8e6be
    - IDEA-20260926-4a496f
    - RUN-WESO-aa2237
    - RUN-WESO-f37773
    - RUN-WESO-e65afd
    - RUN-WESO-0b4b33
    - EXP-P13-NC36

  user_authorization: >-
    AGENTS.md "Standing user authorization for ideas and experiments" (user,
    2026-09-06: "all is approved. ideas/experiments should be always
    approved"), and the user's explicit request in this session to run
    ideate -> design -> run -> review on this target. User authorization is
    satisfied. What this decision certifies is protocol readiness.

  context: >-
    - IDEA-20260926-4a496f (committed 8339062db, draft PR #1447) proposes
      testing Heuristic 1 of inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
      (line 69) with the source's own Section 4.2 Deuring method, staged
      A -> B -> C -> D, with a sampler control the source does not report.
    - No Heuristic-1 measurement has ever completed in this program.
      EXP-P13-NC36 / RUN-P13-NC36-a stopped at FG-1 INFEASIBLE (pure-Python
      isogeny chains, about 14.4 s per step); that is an infrastructure
      outcome and never evidence (AGENTS.md core rule 5).
    - Every conditional result in GOAL-P13-001, GOAL-SSIQ-001 (SC-1) and
      GOAL-SSI-001 inherits Heuristic 1; agents/coordinator.md requires a
      paired heuristic-validation experiment.
    - External context relayed by the dispatching session (not read by this
      act): Delgado, arXiv 2609.22018v1 (18 Sep 2026, unrefereed), claims the
      p^{1/3+o(1)} OneEnd result without Heuristic 1, routing around it rather
      than proving or refuting it.

  # --------------------------------------------------------------------------
  # PROTOCOL COMPLETENESS (approval refused if any required field were null)
  # --------------------------------------------------------------------------
  protocol_completeness:
    heuristic_stated_exactly: PRESENT -- HEUR-WESO-516558-1 verbatim with quantifiers, distribution and interpolated theorems (1.4, 1.5); HEUR-WESO-516558-2 (mixing) numbered and relied on only after Stage B measures it.
    preregistered_prediction_and_source: PRESENT -- PRED-1 rho(u), u = ln(p/2)/(3 ln B), from source Figure 1 caption line 254 and tail checks lines 250-252; PRED-2 size-matched; rho implementation validation V-RHO-1..3.
    scale_access: PRESENT -- Deuring correspondence (source line 244), checked by I-1; per-stage tiers; transfer assumptions TA-1..TA-3.
    sample_size_justification: PRESENT -- derived from the smallest admissible tail probability (N * rho(u) >= 30; factor-2 deficit resolvable at 99%); N = 10^5 matches the source at NIST-I.
    comparison_metric_and_tail_checks: PRESENT -- PM-1..PM-5; TC-1..TC-4.
    controls: PRESENT -- NULL-1 (size-matched uniform integers) and NULL-2 (maximal-size uniform integers) synthetic nulls; PC-1, PC-2, PC-3 sampler positive controls; SEED-1, SEED-2 seed independence; SCALE (4 toy + 3 medium + 1 crypto prime); START-1/2; KS-1; I-1/A-1/A-2/C-2 exact anchors; CLS-1; DET-1.
    independent_variables: PRESENT
    seeds_and_replication: PRESENT -- 23 named master seeds; SHA-256 counter-mode per-draw seeds stored per sample; replicate halves; reproduction spot-check.
    budget: PRESENT -- every field set (wall_clock_seconds_per_run 259200; per-stage watchdogs; total_cpu_hours 48 advisory; maximum_memory_gb 8; maximum_runs 4; maximum_workers 4 after DET-1). Handoff budget wall_clock_seconds 604800, memory_gb 8, maximum_runs 4 -- none null.
    stopping_and_invalidation_rules: PRESENT -- SR-1..SR-9; IV-1..IV-7; invalid_prime_rule.
    success_and_falsification_criteria: PRESENT and DECIDABLE -- success, FC-H1, FC-S, FC-VOID and inconclusive defined from pre-declared metrics; both a supporting and an adverse outcome are reachable.
    required_artifacts: PRESENT -- per-run manifest (seeds, gp/python/numpy/sympy/mpmath versions, commit/dirty, command, timings, resources, validity, inference), raw outputs, per-sample records, execution_report.
    dependencies: PRESENT -- PARI/GP 2.15.4 at /usr/bin/gp, declared as NOT provisioned by the repository, version recorded per manifest.
    inference_policy: PRESENT -- executor-implementation, no fallback, no degradation.
    result: COMPLETE. No required field is null; approval is not refused.

  proof_search_map_gate:
    note: agents/coordinator.md "Proof-oriented dispatch gate" / KN-TECH-080, applied although this is a measurement.
    bottleneck_and_baseline: PASS -- sampler law named as the bottleneck; baseline reproduced exactly by the WISDE slice (I-1, A-1, A-2) before sampling.
    observation_collision: PASS -- biased-vs-mixed sampler collision identified and separated by Stage B and PC-1..PC-3; the residual (tail-confined bias invisible in the toy delta marginal) is declared as a method limit.
    quantifier_order: PASS -- the sampler measure is inside the quantifier; c_hat and k_C are fixed by Stage B before any smoothness value is read.
    method_ceiling_and_nearby_object: PASS -- ceiling stated (tested primes only; no o(1) statement); known-biased samplers must be detected.
    separate_obligations: PASS -- correctness, interface, baseline, runtime, success_probability and scope obligations listed separately.

  # --------------------------------------------------------------------------
  # RULINGS
  # --------------------------------------------------------------------------
  rulings:
    R-1_NC36_object: >-
      Reading two committed texts: EXP-P13-NC36's heuristic_1_statement.informal
      (specification.yaml lines 93-98) and NC-3 procedure (lines 167-175)
      describe the smoothness of random fixed-length isogeny CHAINS from
      j = 1728; frozen Heuristic 1 (source line 69) concerns ONE integer per
      curve, delta(E). The Coordinator rules that EXP-WESO-9e2d6d is a
      successor in METHOD AND OBJECT, not a repair or re-approval of NC36.
      NC36, RUN-P13-NC36-a and H-WESO-001 are unchanged (immutable); NC36's
      INFEASIBLE remains an infrastructure outcome. This ruling makes no claim
      about what NC36's authors intended.
    R-2_WISDE_route: >-
      The WISDE bytes are not in the repository (EXP-SSIQ-4de240 committed
      only their per-file SHA-256 values). DECIDED: primary route is re-fetch
      of the four declared files via raw.githubusercontent.com with exact hash
      equality to the committed values; fallback FB-A (self-generated
      exhaustive ideal-class enumeration in PARI) only on the declared
      trigger, with its independence cost (I-1 unavailable for that prime)
      declared in advance. Not left open.
    R-3_claim_tier_caps: >-
      Stages A/B toy. Stage C capped at `medium` for all three primes (the
      128-bit prime is not a recognized parameter set). Stage D is the only
      crypto-scale row, scoped to 5*2^248 - 1, and exists only if FG-D passes.
    R-4_infeasible_is_infrastructure: >-
      An INFEASIBLE FG-D, any watchdog expiry, crash, fetch failure or
      implementation failure is an infrastructure outcome and never evidence
      about Heuristic 1 or the sampler (AGENTS.md core rules 5 and 9).
    R-5_adverse_outcome_ceiling: >-
      FC-H1 on this single, unreplicated, empirical run may support at most
      `weaken` plus a replication task; `reject_scoped` on it is forbidden.
      Its refutation basis would be proof_status empirical_only with the
      per-sample factorisation records as the checkable artifact.
    R-6_Delgado_context: >-
      Delgado (arXiv 2609.22018v1; unrefereed; relayed by the dispatching
      session, not read by this act) is recorded as context only. (1) If it
      holds up, Heuristic 1 is no longer load-bearing for the p^{1/3}
      exponent, and this experiment's value is the empirical status of the
      heuristic as literally stated plus the sampler-validity question; the
      stakes are stated that way and not overstated. (2) GOAL-P13-001.yaml
      line 451 lists, under pause_conditions, "Heuristic 1 is refuted or
      proven by external work, making further internal controls moot." As
      relayed, Delgado neither refutes nor proves Heuristic 1 (it routes
      around it), so on its words it does not meet that condition; it is
      noted as a candidate trigger for a GOAL-P13-001 review PENDING
      VERIFICATION, not as settled. (3) No interpretation, criterion or
      priority in this decision relies on Delgado being correct. The
      scientific test is unchanged. No KN-LIT is created here (outside this
      act's write scope; the dispatching session handles curation).
    R-7_priority: >-
      Approved now despite R-6 because (a) the heuristic is still literally
      inherited by committed conditional results in three goals; (b) the
      sampler question bears on the source's own unreported Section 4.2
      method and on any future Deuring-sampled measurement in this program
      (e.g. H-WESO-9dc201's open direction); (c) the compute is small (about
      48 CPU hours advisory) and the implementation is reusable. Designing and
      approving this is not a reprioritization of any goal.

  run_set_validity:
    expected_run_count: >-
      Four runs at most, one per stage, ids pre-allocated (RUN-WESO-aa2237,
      RUN-WESO-f37773, RUN-WESO-e65afd, RUN-WESO-0b4b33). No run exists at
      approval.
    control_comparability: >-
      Nulls, replicate halves and arms share the prime, the code and the
      per-draw seed derivation of the main arm; PC-2 and PC-3 are drawn by the
      same sampler code with only the declared variation.

  # --------------------------------------------------------------------------
  # CONDITIONS
  # --------------------------------------------------------------------------
  conditions:
    - id: AC-1
      text: The specification is frozen at its archived bytes (TASK-20260926-b8e6be receipt). The Executor refuses on a hash mismatch. Any change is a versioned protocol_amendment approved by a new Coordinator decision.
    - id: AC-2
      text: Stages run strictly A, B, C, D, one at a time, each as its own run with its pre-allocated id; gates are applied mechanically as frozen; a gate stop ends the card's execution at that stage.
    - id: AC-3
      text: PARI/GP 2.15.x must be present and recorded; its absence or a different major/minor version is an infrastructure stop (SR-7), never evidence.
    - id: AC-4
      text: Resource limits are machine protection only (4 workers after DET-1, 8 GB, 1 GB per gp process, per-stage watchdogs as checkpoints). Advisory time and CPU figures do not stop routine work (docs/research-budget-policy.md).
    - id: AC-5
      text: No smoothness statistic is computed before a prime's sampling completes; N is fixed; partial samples after a watchdog are preserved but not analysed as a smaller N.
    - id: AC-6
      text: The Coordinator writes a review_plan (prior recorded first) before dispatching independent review; the red team owns the sampler-mixing and null-model joints, the validator owns run-set validity and the blind recomputation of the criteria from per-sample records.
    - id: AC-7
      text: Claim tiers are capped as R-3; no evidence record may assert above them; Stage D is a separate crypto-tier row.
    - id: AC-8
      text: No goal record is edited by this decision or its card. Any GOAL-P13-001 or GOAL-SSIQ-001 consequence (including R-6 (2)) is a separate, later Coordinator decision.

  attention_contract:
    decisive_evidence: >-
      gate_G_B verdict (sampler law) and, if passed, the FC-H1 / success
      pattern across the three Stage-C primes; Stage D as a separate
      crypto-tier row.
    inconclusive_decision: >-
      If the verdict is inconclusive, the next decision is a targeted
      replication at the primes and cells named, not a re-scoring.
    local_ambiguity_rule: >-
      Routine ambiguities in implementation (realization of the sampler, rho
      method) are resolved by the Executor within the specification's words
      and recorded in implementation.md; anything touching a threshold, grid,
      seed or criterion is returned as a proposed amendment.
    peripheral_exclusions:
      - testing the H-WESO-9dc201 size law (reported descriptively only)
      - any cost-model or algorithm run
      - NIST-V (p = 27*2^500 - 1)
    rerank_trigger: >-
      Completion or stop of the card; verification (or failure) of Delgado
      arXiv 2609.22018v1 by a committed literature record.

  evidence_refs:
    - ledger/proposals/IDEA-20260926-4a496f.yaml
    - inputs/P13-WESOLOWSKI-2026/paper_fulltext.md (lines 65-83, 242-254)
