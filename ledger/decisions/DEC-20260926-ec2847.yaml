    - experiments/EXP-SSIQ-4de240/runs/RUN-SSIQ-4de240-a/command.txt (cache_dir_note -- bytes not committed)
    - ledger/hypotheses/H-WESO-001.yaml
    - ledger/hypotheses/H-WESO-9dc201.yaml
    - ledger/goals/GOAL-P13-001.yaml (line 451, pause_conditions)
    - docs/claims-and-verification.md (claim tiers, lines 112-127)

  citations:
    - ref: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
      provenance: internal
      claim: Heuristic 1 verbatim (line 69); Theorems 1.4, 1.5 (lines 77, 81); Section 4.2 method, prediction curve rho(u) with u = log(p/2)/(3x), and tail checks (lines 244-254).
      verified_by: coordinator, this act, 2026-09-26 (lines read directly)
    - ref: arXiv 2609.22018v1 (Delgado)
      provenance: retrieved
      claim: Claims OneEnd in p^{1/3} exp(O(sqrt(log p log log p))) time and memory without Heuristic 1 (its Theorem 1.1 / 5.3), via squarefree smooth degrees, a Chenu-Smith count and a collision bound (its Theorem 3.5). Unrefereed.
      verified_by: dispatching top-level session, 2026-09-26 (relayed by message; this act did not read the paper; nothing here relies on it)

  limitations:
    - The approval certifies protocol readiness only; no hypothesis is supported or weakened by it.
    - Mixing is validated at p <= 20011 on the delta marginal and on the type law at the two smallest primes; transfer to 64-250 bits is an extrapolation partly checked at scale by KS-1 and START-2, which have limited tail power (N = 2*10^4).
    - A bias confined to the smooth tail and invisible in the toy delta marginal is not excluded by the design (declared residual observation collision).
    - The o(1) of Heuristic 1 is untestable by any finite experiment; the test is of the source's own finite-p operational form.
    - PARI/GP is installed in this session, not provisioned by the repository; a future session must reinstall it for reproduction.
    - The Stage-C prime rule (smallest p = 3 mod 4 above 2^b) samples one prime per size (TA-2).

