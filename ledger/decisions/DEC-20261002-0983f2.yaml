        session would lose. (3) A new blind card is required (R-BLIND).
        Ownership is in the plan: RD-1 J1, RD-2/RD-3/RD-9 J2, RD-4 J8,
        RD-5/RD-6 J4, RD-7 J6, RD-8 J3.
    - id: R-BLIND
      subject: the blind re-derivation (41f6dc NA-1 and PF-2)
      ruling: >-
        CARRY J9 AND ADD A NEW BLIND CARD. (a) J9 of BATCH-b67954
        (TASK-20260925-a43591; rederivation-report.yaml 070f64da...,
        computations.json fb5bffe2..., bound by TASK-20260925-a9c531) is
