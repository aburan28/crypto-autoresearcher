        sub-session is never the producer, a reviewer or the composer.
    - id: R-PRODUCER-COMPUTE
      subject: computations the session may run for a producer with no shell (stated in advance)
      ruling: >-
        Stated on the producer card and limited to: C-1 extract each committed
        code block by the pinned method and compute its sha256; C-2 a syntax
        check and an import-safety check of each block in a fresh interpreter
        (importing executes nothing); C-3 run the committed Stage-0 coverage
        code through its __main__ entry against the primary inputs, read-only,
        and its omission self-test on in-memory copies of the row list, and
        relay the output verbatim; C-4 run committed closed-form design-figure
        code of the contract's abstract model (memory columns from variable
        counts, the k-reading comparison, any threshold table version 3
        freezes, the M7-reading comparison) that imports neither
        joint_balance.py nor anything under experiments/*/runs/, instantiates
        no curve and runs no solver, and relay its output verbatim. Each
        command and output is embedded in the audit sheet as a design figure,
        never a result. Nothing else is run.
    - id: R-XCERTBIN
      subject: X-CERTBIN applied against the primary input (DEC-20260925-89573b R-TRIGGERS; routed here by 41f6dc R-HOLDS and NA-1)
      ruling: >-
        APPLIED; IT DOES NOT FIRE. Method: this agent searched every
        experiments/EXP-CERTBIN-*/specification*.yaml (060020, 3f06d1, 4e92d7,
        a58c63, ddfe75, e94b27) for Certicom curve labels and for the
        inputs/CERTICOM-CHALLENGE-2009/ path. EXP-CERTBIN-ddfe75 and
        EXP-CERTBIN-060020, the two contracts X-CERTBIN names, freeze no
        Certicom-row parameter; their curves are toy cells at n = 17 and
        n = 19. The only Certicom label in any CERTBIN specification is
        EXP-CERTBIN-4e92d7 line 71, a rho work figure at ECC2K-130 inside a
        dominated_by sentence, cited through KN-LIT-096. That is not an m, a,
        b, h or r, and it is not a value D-1 uses. EXP-NISTBIN-451dfa reads
        every Certicom parameter from Appendix A of the primary input and its
        C-RHOCONV target from inputs/BAILEY-2009-541-ECC2K130/. Neither lane
        adopts the other's value. The producer card and J1 carry the rule
        forward: every Certicom parameter from Appendix A only.
      revisit: Any CERTBIN contract versioned or newly approved before DEC-20261002-353743 composes; the composer re-applies it then.
