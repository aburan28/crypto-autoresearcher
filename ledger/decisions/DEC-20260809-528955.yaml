coordinator_decision:
  id: DEC-20260809-528955
  goal_id: GOAL-AES-001
  batch_id: BATCH-005
  recorded_by_task: null
  recorded_by_task_note: >-
    NULL AND HONESTLY SO. protocol-amendment-GOAL-AES-001-005 Part A rules that
    from BATCH-005 every coordination act is dispatched as a queue task with a
    declared budget. This act was NOT so dispatched, because the BATCH-005 queue
    does not exist yet and this decision is the reason it was not drafted. The
    act is therefore an out-of-queue coordination act of exactly the kind the
    amendment's `coordination_act_undercount_fixed_prospectively` clause names,
    and it is charged at zero for the same reason every prior one was: no
    dispatcher observed it and inventing a duration would be fabrication under
    AGENTS.md core rule 9. See `budget_accounting_note` below.

  context: >-
    A scheduled coordinator-only harness run selected GOAL-AES-001 to discharge
    its single recorded next_action: DRAFT, COMMIT AND DISPATCH THE BATCH-005
    QUEUE in the ranked shape that next_action says DEC-20260731-030 binds on its
    author. Reading DEC-20260731-030 to draft against it found a
    GOAL-ECDLP-001 BATCH-026 record, not the GOAL-AES-001 pause-or-continue
    decision the goal record names. Blob-level verification across four commits
    established that all eight of DEC-20260731-025..032 — the entire AES decision
    block published by PR #96 under the CORR-20260731-007 remap — were replaced
    on main by GOAL-ECDLP-001 records in PR #118 (fdf3a9fba, 2026-08-02, diff
    status `M` on every one of the eight). The AES records are recoverable at
    commit e19dd974a and are not reachable from main's tree. The full finding,
    its verification commands, and the reader rule are recorded in
    CORR-20260809-b1c790. THE BATCH-005 QUEUE WAS NOT DRAFTED IN THIS SESSION.

  decision: revise

  decision_scope: >-
    This decision revises ONE FIELD of ONE GOAL RECORD: GOAL-AES-001's
    `next_action`. It changes no hypothesis status, approves no experiment,
    freezes no contract, promotes no claim, moves no goal status, and asserts
    nothing about AES at any round count or about ECDLP. GOAL-AES-001 remains
    `active`. It does not pause the campaign: the pause condition in
    budget_accounting.standing_limit is triggered by measured consumption
    approaching 34500 s without a further amendment, and nothing here bears on
    that.

  target_ids:
    - GOAL-AES-001
    - BATCH-005
    - CORR-20260809-b1c790
    - DEC-20260731-030
    - DEC-20260731-025
    - DEC-20260731-026
    - DEC-20260731-027
    - DEC-20260731-028
    - DEC-20260731-029
    - DEC-20260731-031
    - DEC-20260731-032
    - GOAL-AES-002
    - GOAL-AES-003
    - protocol-amendment-GOAL-AES-001-005

  evidence_ids: []
  evidence_ids_note: >-
    EMPTY AND CORRECTLY SO. This decision reviews no experimental evidence and
    creates none. Its factual basis is git object state, cited in
    `evidence_refs` and re-runnable from the commands recorded in
    CORR-20260809-b1c790.verification. Listing EV-AES-* here would misrepresent a
    metadata finding as an evidence review.

  evidence_refs:
    - "CORR-20260809-b1c790 (the integrity finding, with per-path verification)"
    - "CORR-20260731-007 (the remap whose target range this correction reports as occupied)"
    - "CORR-20260731-008 (the first occurrence of the same failure on the same block)"
    - "git a042c5b18 / e19dd974a / fdf3a9fba / 07232da80 / d2b1587a2"
    - "origin/main b31a3f47ff0bdcdf379d52c1fb54e7efe6a38d5a"

  hypothesis_status_transition: null
  hypothesis_status_transition_note: >-
    NONE. No hypothesis of this campaign is touched. H-AES-* statuses are exactly
    what they were before this record.

  rationale:
    - >-
      DRAFTING BATCH-005 THIS SESSION WOULD HAVE BOUND NEW WORK TO A CITATION
      THAT RESOLVES TO ANOTHER CAMPAIGN'S RECORD. The displaced DEC-20260731-030
      is itself the decision that refused to draft a queue against
      an unwritten amendment, on the stated ground that "a queue drafted against
      a number that does not exist is drafted against nothing". Drafting against
      an identifier that resolves to the wrong record is the same fault, and
      declining it is consistency with the campaign's own prior ruling rather
      than new caution.
    - >-
      THE RESEARCH IS NOT BLOCKED AND MUST NOT BE TREATED AS BLOCKED. The
      complete ranked shape of BATCH-005 — rank 1 CAND-806-A's bounded-index
      subgroup residual, rank 2 CTRL-810-A's saturating frontier census under
      both composition models, rank 3 the layer-dependence pre-screen reform,
      rank 4 D-705-5 hole (i) admitted only if a slot remains — is carried in
      full by GOAL-AES-001's own `next_action`, which is committed, reachable on
      main, and unambiguous. The queue can be drafted honestly against the goal
      record plus the reader rule in CORR-20260809-b1c790, and that is what the
      revised next_action directs. Nothing is deferred, dropped, downgraded, or
      re-ranked by this decision.
    - >-
      AGENTS.md rule 15 forbids treating a third remap as the obvious repair.
      DEC-20260731-025..032 appear in the binding fields of completed archives on
      BOTH sides — the GOAL-AES-001 BATCH-002/003/004 dispatch queues and the
      GOAL-AES-003 BATCH-001 queue on one, EXP-DS-001's amendments, controls,
      runs and results on the other. The interim state is therefore the reader
      rule (Option B in the correction), with republication (Option A) left open
      and named, not silently foreclosed.
    - >-
      RECORDING THE LOSS IS WORTH MORE THAN THE BATCH THIS SESSION DID NOT DRAFT.
      Undetected, the next session to act on GOAL-AES-001 repeats this
      investigation from scratch, and the one after that repeats it again. The
      campaign's continuation at `active` rather than `paused` rests on an
      approval whose record main cannot currently serve; a reader is entitled to
      know that before relying on it.
    - >-
      THE WIDER EXPOSURE IS REPORTED RATHER THAN QUIETLY SCOPED AWAY. PR #118
      carries diff status `M` on 22 decision paths, only eight of which are the
      AES block. No loss is claimed for the other fourteen because none was
      verified; the audit is named as an open item with no result assumed.

  limitations:
    - >-
      NO INDEPENDENT REVIEW WAS OBTAINED. This was a coordinator-only scheduled
      run that did not dispatch a validator, reviewer, or red team. The
      blob-level facts are mechanically re-runnable by any reader from the
      recorded commands; the JUDGEMENT that Option B is the right interim state
      is a single coordinator's and has not been challenged.
    - >-
      THE REPAIR IS NOT PERFORMED. The eight AES decision records remain
      unreachable from main's tree after this decision exactly as before it. What
      changes is that the condition is recorded, cited, and readable.
    - >-
      THE FOURTEEN NON-AES PATHS MODIFIED BY fdf3a9fba ARE UNAUDITED. It is not
      known whether any of them displaced a distinct record. Do not read this
      decision as evidence that they did, or that they did not.
    - >-
      NO ATTESTATION IS RECORDED AND NO CLOSURE IS CLAIMED. This decision is not
      part of any completion quorum for any goal.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Nothing here is a durable research claim. The allocator failure this record
      instances is ALREADY promoted at knowledge/findings/KN-FIND-030.md, and a
      third instance of a finding that is already recorded, and whose structural
      fix (AGENTS.md rule 14 random tokens) is already adopted, adds an
      occurrence rather than a claim. If the audit of the fourteen unaudited
      paths establishes that displacement is systemic rather than confined to two
      campaigns, THAT would be a promotion candidate and should be reconsidered
      then.

  budget_accounting_note: >-
    NO WALL-CLOCK FIGURE IS CHARGED TO GOAL-AES-001 BY THIS RECORD AND NONE IS
    INVENTED. protocol-amendment-GOAL-AES-001-005 Part A itemizes a 700 s
    queue-and-handoff drafting act for BATCH-005; THAT ACT WAS NOT PERFORMED, so
    that line is unconsumed and remains available to the session that drafts the
    queue. This decision was an out-of-queue coordination act with no
    dispatcher-observed duration, which is the historical under-count the
    amendment closed prospectively and explicitly declined to reconstruct
    retroactively. charged_to_date stays at 19458 and is not edited by this
    record. The understatement is real, is the amendment's own acknowledged
    condition, and is restated here rather than smoothed.

  next_actions:
    - >-
      EXACTLY ONE: DRAFT, COMMIT AND DISPATCH THE GOAL-AES-001 BATCH-005 QUEUE in
      the ranked shape carried by GOAL-AES-001's `next_action`, CITING THE GOAL
      RECORD AND CORR-20260809-b1c790 AS THE BINDING AUTHORITY. A citation of
      DEC-20260731-030 in that queue must carry the reader-rule qualifier from
      the correction — naming the recovery commit e19dd974a — or must be replaced
      by the goal record's own text. Every other constraint on BATCH-005 is
      unchanged: the 34500 s ceiling, the Part B C2 stamp duty with a computed
      binding_stop_utc committed as an artifact, the Part B C4 authoring-inclusive
      declaration basis with compute reported separately, the Part C covering-
      manifest clause and the closed four-name case-insensitive class vocabulary,
      the four ranks in their recorded order, ranks 1 and 2 dispatched
      concurrently under max_concurrent 3, and BATCH-005 as the second-to-last
      batch and the last that may open new research questions.
    - >-
      SEPARATELY AND NOT BLOCKING THE ABOVE: obtain independent review of the
      Option A / Option B choice in CORR-20260809-b1c790, and audit the fourteen
      non-AES decision paths modified by fdf3a9fba. Both require a session that
      can dispatch a validator or red team; neither is a GOAL-AES-001 batch task
      and neither consumes this campaign's budget.

  decided_by: coordinator
  decided_at: "2026-08-09"

