coordinator_decision:
  id: DEC-20260813-c60bba

  context: >-
    BATCH-6b6e78 of GOAL-MLKEM-005 ran one bounded lead producer (TASK-20260813-2ce014)
    against PREREG-2, the frozen pre-registration notarized alone at commit
    60ac819982793e8ed402bc3b2f4b7ad1b1824f92 by TASK-20260813-502381 in a commit containing
    ZERO producer artifacts, and snapshot-committed at 4e466c6bf221ea002fe84311baccdb816081a8cd
    by TASK-20260813-48240d. PREREG-2 states A-1 -- the finite-precision fibre assumption
    AM-18(a) requires -- as a numbered assumption with five falsifiers (FC-1, FC-2a, FC-2b,
    FC-3a, FC-3b), before specifying any replacement dispersion criterion, exactly as
    DEC-20260812-781961's AM-18 requires. TWO INDEPENDENT REVIEWS RETURNED: Validator
    TASK-20260813-59c321 (VAL-20260813-59c321), verdict `incomplete` -- THE FIRST
    NON-`passed` VALIDATOR VERDICT OF THIS GOAL'S RECENT HISTORY, and this decision follows
    that split exactly rather than rounding it up or down; and Red Team TASK-20260813-85e343
    (RT-20260813-85e343), fourteen objections, five built probes, which states plainly "THE
    BRANCH IS CORRECT AND I DO NOT CONTEST IT" and does not contest it anywhere in its
    report. THE FROZEN TERMINATION CLAUSE OF PREREG-2 SECTION 7 FIRED T-A1-FALSIFIED,
    REPORTED WITH THE SECTION 7.6 SUFFIX AS T-A1-FALSIFIED-PARTIAL, AND BOTH REVIEWS CONFIRM
    IT INDEPENDENTLY FROM THE FROZEN TEXT. This decision is that batch's official close.
    CLAIM TIER TOY, UNCONDITIONALLY: nothing here bears on ML-KEM security, on any FIPS 203
    parameter set, on any attack cost, or on any cost model.

  decision: revise

  decision_note: >-
    `revise` is the ACTION -- the evidence record is committed with a verdict-aware
    admissibility split, two required corrections are ordered (not executed here; both are
    superseding-record acts and no re-run is required for either), and the successor's
    single next action is specified -- and it is NOT a verdict on any proposition about a
    lattice. NOTHING IS `support`ed, `weaken`ed OR `reject_scoped` HERE, no hypothesis
    status moves and none is named, and no refutation artifact is owed for a transition that
    is not made. `approve` would treat the Validator's `incomplete` verdict as `passed`,
    which it explicitly is not. `reject_scoped` on this record would be forbidden even if it
    applied: this is a single, unreplicated (model-correlated) empirical batch, and
    `reject_scoped` on such a batch is barred by AGENTS.md's evidence rules regardless.
    `pause` is unavailable: GOAL-MLKEM-005's pause_conditions are INFRASTRUCTURE-ONLY plus a
    user request, and an instrument outcome, a scoped negative and an exhausted batch are
    all listed in its non_terminal_conditions and may not be cited in a decision that closes,
    pauses or completes it. THIS BATCH CLOSES, PAUSES AND COMPLETES NOTHING.
    T-A1-FALSIFIED-PARTIAL CLOSES NO LANE BY ITSELF -- PREREG-2 7.3's FORBIDS list is
    explicit that this branch forbids "specifying any dispersion criterion, fibre clause or
    gate resting on A-1" and "proceeding to C3 behind any gate," and licenses only "the
    specification of a SUCCESSOR ASSUMPTION -- not a criterion -- subject in full to 7.5's
    repair bar." No closure standard of docs/inventor-protocol.md section 4 is triggered by
    an instrument falsification, and none is claimed here.

  target_ids:
  - GOAL-MLKEM-005
  - BATCH-6b6e78
  - EV-MLKEM-4ba196
  - TASK-20260813-25cb95
  - TASK-20260813-502381
  - TASK-20260813-2ce014
  - TASK-20260813-48240d
  - TASK-20260813-59c321
  - TASK-20260813-85e343

  # ==================================================================
  # 1. VALIDITY BEFORE INTERPRETATION
  # ==================================================================
  run_set_validity:
    ruling: >-
      THE RUN SET IS VALID AND ADMISSIBLE AS EVIDENCE FOR THE PARTS NAMED admissible_now IN
      EV-MLKEM-4ba196, AND NOT YET ADMISSIBLE FOR THE TWO PARTS NAMED
      not_admissible_until_superseded. This is the Validator's own `incomplete` split, not a
      rounding by me. Checked before interpretation.
    expected_run_count: >-
      ONE lead producer, one declared measurement run within its 600 s cap (26.947 s used),
      plus one required re-run of an already-archived BATCH-4ed139 probe (0.405 s,
      unmodified from its committed path, required by PREREG-2 obligation (b)). Both
      completed; both reviews independently confirm the run-accounting enumeration (AM-18(f))
      is complete and no invocation is omitted.
    schema_complete_manifests: >-
      CONFIRMED BY THE VALIDATOR (AC-1 through AC-13) AND INDEPENDENTLY BY THE RED TEAM
      (section 1, "every producer artifact I read was read COMMITTED"). Both archives --
      the notarization (60ac81998, 3 paths) and the lead snapshot (4e466c6bf, 11 paths) --
      pass change-set equality at 3/3 and 11/11 with 0 extra and 0 missing, verified by BOTH
      reviews independently running git plumbing themselves. Durable command.txt, stdout.log
      and stderr.log exist; 0 paths inside a folded YAML scalar (Validator swept and ruled 5
      false-positive flags); the exact runnable command including resource caps is recorded;
      git revision and dirty-tree state recorded with an itemized reason (only the task's own
      declared artifacts untracked, no tracked file modified).
    seed_integrity: >-
      CONFIRMED BY BOTH REVIEWS. Both rebuilt every fibre family from the declared seeds
      independently -- the Validator importing NO producer module, the Red Team building
      with numpy alone -- and both report agreement with the committed values at every cell
      they checked (Validator: 480 of 480 binary64 route values bit-identical; Red Team:
      the 1,416/49-block headline reproduces exactly through the imported committed
      var_f_from_cells).
    raw_summary_agreement: >-
      CONFIRMED FOR THE MACHINE-READABLE RECORD, WITH ONE MATERIAL EXCEPTION AND ONE
      RECORD-INTEGRITY EXCEPTION, BOTH NAMED. The Validator's MR-0 reproduces
      results_a1.json from the committed measure_a1.py at the recorded revision with ZERO
      non-timing differences across 379,149 shared leaves. THE ONE MATERIAL DISAGREEMENT:
      the headline count of 1,416 changing VAR-F cells is NOT reproducible from PREREG-2's
      frozen text alone under the record's own declared binary32 route provenance -- it is
      1,313 there, and 1,416 only under the one undeclared choice measure_a1.py actually
      makes (Validator F-1, Red Team O-5, independently). THE ONE RECORD-INTEGRITY
      DISAGREEMENT: report_a1.md's own account of its P-A12a correction is false against the
      committed JSON (Validator F-2, and independently confirmed by me; see EV-MLKEM-4ba196
      finding_1_narrative_correction). Neither disagreement invalidates the run set: every
      falsifier firing, every certified class and the termination branch are unaffected by
      both, and both are ordered as required corrections below (RC-1, RC-2) rather than
      treated as invalidating.
    control_comparability: >-
      CONFIRMED, AND STRENGTHENED BY BOTH REVIEWS' OWN BUILT NULLS. The per-candidate fibre
      guard P-G2 held (Validator: 210 guard records, 0 violations, independently re-run; Red
      Team did not contest it). Both reviews additionally built objects PREREG-2 never names
      to test the instrument's discriminating power directly (Validator's X_indexnoise,
      X_dk, X_rowsum; Red Team's X_lin, X_par), which is the null-object-control discipline
      docs/inventor-protocol.md section 3 requires and is the basis of the scope-limit
      finding below.
    infrastructure_separation: >-
      The 114 uncovered cell evaluations (X_gso_k | RG_cholesky_of_gram at binary32,
      LinAlgError "Matrix is not positive definite") are numerical/infrastructure signal
      under AGENTS.md rule 5, independently reproduced by the Red Team at the same 114
      cells and traced to a determinate binary32 representation fact (the Gram's largest
      entry exceeds 2**24 at all 10 lattices) knowable before the run rather than a host
      failure. Neither review found any branch of PREREG-2 section 7 reached through a
      timeout, crash or missing dependency.

  # ==================================================================
  # 2. THE BRANCH THAT FIRED, AND WHAT IT MEANS
  # ==================================================================
  termination_branch:
    branch: T-A1-FALSIFIED, reported with the PREREG-2 7.6 suffix as T-A1-FALSIFIED-PARTIAL.
    read_off: >-
      R3-OUT-1 and R3-OUT-2 under R3-OUT-V's precedence, and nowhere else (PREREG-2 7). Step
      1: R3-OUT-V (VOID) does not fire -- P-G2 held at 210 of 210 checks, re-derived
      independently by the Validator. Step 2: T-UNSTATABLE does not fire -- FC-1 fired for
      the raw-GSO class ALONE, not for every in-scope class, and R6_exact terminates for
      every determinant-only instance; PREREG-2 7.2 requires failure on EVERY class. Step 3:
      T-A1-FALSIFIED fires because FC-1 (one class of two), FC-2a (153 cells), FC-3a (868,
      or 867 under the Validator's alternate reading of the F-1 ambiguity -- unaffected
      either way) and FC-3b (354 cells) all fired at covered cells, each independently
      sufficient under PREREG-2 1.2. Step 4: coverage is not full (114 declared cell
      evaluations uncovered), so the -PARTIAL suffix of 7.6 applies. BOTH REVIEWS RE-DERIVED
      ALL FOUR STEPS INDEPENDENTLY AND CONFIRM THE SAME BRANCH; the Red Team states it does
      not contest the branch and that it is "ROBUST TO EVERY OBJECTION" its own report
      raises -- setting FC-1 aside entirely, FC-2a, FC-3a and FC-3b each independently still
      fire it.
    the_clause_quoted_verbatim_from_prereg_2_7_3: >-
      "FIRES WHEN: any of FC-1 (for some but not all classes), FC-2a, FC-2b, FC-3a, FC-3b
      fires at any covered cell, route or candidate. MEANS: A-1 as stated is false at the
      declared precisions, routes, families and candidates. It does not mean that no
      finite-precision meaning exists; it means this one does not survive."
    what_it_licenses_quoted_verbatim: >-
      "a decision recording exactly which sub-clause failed, at which cells and routes, and
      for which certified class, and the specification of a SUCCESSOR ASSUMPTION -- not a
      criterion -- subject in full to 7.5's six-part repair bar and its absolute bar on an
      eighth consecutive gate repair without a committed decision that first records why the
      C3 lane cannot be entered instead."
    what_it_forbids_quoted_verbatim_and_honoured_in_full:
    - specifying any dispersion criterion, fibre clause or gate resting on A-1
    - proceeding to C3 behind any gate
    - presenting the falsification as evidence about any lattice, any observable's
      admissibility, or any proposition in this goal -- IT IS AN INSTRUMENT OUTCOME
    - reading a failure caused by a missing dependency, a timeout, a crash or the declared
      R7 cap at d > 40 as a falsifier at all. NONE OF THE FALSIFIERS THAT FIRED WAS CAUSED
      BY ANY OF THOSE, and both reviews verified that independently.
    - closing, pausing or completing GOAL-MLKEM-005

  # ==================================================================
  # 3. THE NARRATIVE CORRECTION -- READ THIS BEFORE READING ANY EARLIER
  #    COMMIT MESSAGE IN THIS BATCH
  # ==================================================================
  narrative_correction:
    what_the_prior_commit_message_said: >-
      The parent harness session's commit message for TASK-20260813-48240d (the lead's
      snapshot archive, 4e466c6bf221ea002fe84311baccdb816081a8cd) repeated the producer's own
      report_a1.md claim: "the automated P-A12a register line in results_a1.json is
      mis-scored HELD; corrected to FALSIFIED ... with THE JSON LEFT UNEDITED."
    what_is_actually_true: >-
      THAT CLAIM IS FALSE AGAINST THE COMMITTED ARTIFACT. I independently confirmed this
      myself by reading the committed results_a1.json directly:
      PREDICTION_REGISTER.items["P-A12a"].OUTCOME reads "FALSIFIED", not "HELD" -- the
      string "HELD" never occurs against P-A12a in the file. The Validator's finding F-2
      reaches the same conclusion independently (re-running the committed measure_a1.py
      unmodified reproduces FALSIFIED; the scorer's own code cannot produce HELD on this
      data, because it filters the full, untruncated 153-entry FC-2a list). P-A12a's
      committed OUTCOME is, and always was, FALSIFIED.
    what_this_is_and_is_not: >-
      This is a correction of a DESCRIPTION, never of a MEASUREMENT. The producer's own
      self-report about its own artifact was inaccurate -- a record-integrity issue in
      report_a1.md and its anomaly log, which then propagated, uncorrected, into the
      TASK-20260813-48240d commit message. THE SUBSTANTIVE SCIENTIFIC VALUE WAS CORRECT
      THROUGHOUT: P-A12a is genuinely FALSIFIED at 22 cells (X_null 12, rdet 10, route
      R2_QR_of_BT), confirmed independently by both reviews and by me. Only the NARRATIVE
      ABOUT THE ARTIFACT was wrong.
    what_is_not_edited: >-
      The immutable commit 4e466c6bf and its message ARE NOT EDITED -- they are history,
      exactly as AGENTS.md rule 2 and rule 5 require. This decision, and the evidence record
      EV-MLKEM-4ba196 it cites (finding_1_narrative_correction), are the correction: a reader
      who saw only the commit message and never opened the ledger is corrected here. The
      full ruling, with the Validator's benign-explanation hypothesis offered and NOT
      asserted as fact, is in EV-MLKEM-4ba196.finding_1_narrative_correction.
    required_action: RC-2 in required_corrections below.

  # ==================================================================
  # 4. THE HEADLINE-COUNT CORRECTION
  # ==================================================================
  headline_count_correction:
    what_was_measured: >-
      The Validator's blind re-implementation from PREREG-2's frozen text alone gives 1,313
      changing VAR-F cells, not the producer's committed 1,416. Under the producer's own
      (undocumented) resolution of a genuine ambiguity in PREREG-2 2.6 -- how a
      binary64-declared route generalizes to binary32 -- the Validator reproduces 1,416
      EXACTLY, including every by-candidate and by-family split. THE DISCREPANCY IS A
      SPECIFICATION GAP IN PREREG-2, root-caused precisely: the committed sources form the
      Gram in exact int64 and cast ONCE; measure_a1.py accumulates the R4 Gram AT THE
      WORKING PRECISION, the opposite of what its own route_provenance field declares. This
      was INVISIBLE to the producer's own "480/480 bit-identical" check because at binary64
      both forms are bit-identical (every Gram entry is an integer below 2**53) -- the check
      could not fail on the one axis that mattered.
    what_is_unchanged: >-
      49 of 330 blocks; route R2's contribution of exactly 20; zero contribution from R0,
      R1, R3, R5, RQ, RG; every certified class; every falsifier firing and non-firing
      including FC-2a exactly 153 and FC-3b exactly 354; both precision_degenerate readings;
      the joint K-interval and its emptiness; all three F0 readings at binary64; and THE
      TERMINATION BRANCH.
    what_is_changed_and_not_yet_citable: >-
      the count 1,416 itself, its three decompositions, FC-3a's exact split (868 vs 867),
      the R4 binary32 K-interval endpoints, and the "6 of 38" binary32 diagnostic. MARKED
      NOT ADMISSIBLE UNTIL SUPERSEDED, per the Validator's own required correction RC-1.
    required_action: RC-1 in required_corrections below. NO RE-RUN IS REQUIRED -- this is a
      specification-and-bookkeeping fix.

  # ==================================================================
  # 5. OBJ-1, RULED: THE MOST CONSEQUENTIAL ITEM IN THE BATCH
  # ==================================================================
  obj_1_ruling: >-
    By the triangle inequality, P-GRAM's 1e-10 tolerance requires the two committed float64
    routes (RQ, RG) to agree to 2e-10. At L2, L5, L8, L10 and L12 they disagree by up to
    3.0015e-09 -- so NO REAL NUMBER WHATEVER can satisfy P-GRAM at those five lattices, not
    merely no exact route (Validator RULING-OBJ-1; Red Team O-1, independently measured and
    agreeing to five significant figures). FC-1's firing for the raw-GSO class is THEREFORE
    AN ARTEFACT OF AN UNREACHABLE TOLERANCE, not a property of the class, and NOT evidence
    against PREREG-2 2.9's derivation, which both reviews independently verify correct as
    mathematics (Validator MR-3, exact rational arithmetic including Sylvester's identity as
    an independent second computation; Red Team O-13, an independent implementation using a
    different determinant method and an independent Gram-Schmidt check). RECORDED AS A
    SPECIFICATION DEFECT IN PREREG-2 2.9's TOLERANCE, repairable only by a superseding
    record. IT DOES NOT CHANGE THE BRANCH: FC-2a, FC-3a and FC-3b each fire independently and
    each is independently sufficient. It changes what may be SAID about FC-1's meaning --
    that its firing records a property of route RG's Cholesky and an infeasible tolerance,
    never a decidability failure for the raw-GSO class -- not the outcome it contributes to.

  # ==================================================================
  # 6. OBJ-2, RULED
  # ==================================================================
  obj_2_ruling: >-
    The frozen (non-strict) precision_degenerate reading is CONFIRMED CORRECT AND
    CONSERVATIVE (Validator RULING-OBJ-2): the strict reading is not a test, because A-1.2's
    strict-decrease criterion would be falsified at R0/R1/R3's degenerate cells before any
    measurement, by construction. But its existence means 4,788 of 12,426 covered cells
    (38.5 percent, on three of six float routes) are VACUOUS for A-1.2 under the frozen
    rule -- FC-2a in fact fired only on route R2. A successor citing "A-1.2 was tested at
    12,426 cells" OVERSTATES by 4,788; this scope correction is recorded so it travels with
    any future citation. The Red Team independently notes a compounding, one-sided defect in
    the exemption (all 153 FC-2a firings have rho(binary32) exactly 0, which the exemption
    -- worded around rho(binary64) == 0 -- does not address); recorded as a further
    specification note for a successor repairing 1.3, not as a change to this batch's
    branch or scoring.

  # ==================================================================
  # 7. THE SCOPE-LIMIT FINDING -- CONVERGENT ACROSS BOTH REVIEWS
  # ==================================================================
  scope_limit_finding: >-
    T-A1-FALSIFIED SURVIVES ON A-1.2: 153 FC-2a firings are on the CERTIFIED-CONSTANT class,
    which contains real candidates (X_null, rdet, X_parfree), and FC-2a alone is
    independently sufficient. BUT A-1.3 IS UNTESTED ON ANY OBJECT THAT READS THE INSTANCE:
    all 868 FC-3a and 354 FC-3b firings come exclusively from the null object X_hash, which
    PREREG-2 2.8 itself says carries no lattice information. Both reviews built the proof of
    this INDEPENDENTLY, with different objects: the Validator constructed X_indexnoise,
    which reads the basis INDEX ALONE and not one entry of any basis, and found it scores
    IDENTICALLY to a real-reading blind null (X_rowsum); the Red Team constructed X_lin and
    X_par, certified exactly non-constant at 30/30 fibres, with Pearson correlation to the
    lattice observable of -0.0045/-0.0178 against a must-pass control of +1.0000 --
    provably not lattice invariants. "Certified NON-CONSTANT on the fibre" therefore carries
    NO information about whether an object reads the instance. Record this as the batch's
    CENTRAL FINDING: NOT that A-1 is false in general, but that its A-1.3 sub-clause was
    never tested this batch where it would matter -- on an object that both reads the
    instance and is certified. It compounds directly with OBJ-1: OBJ-1's unreachable P-GRAM
    tolerance is what left X_gso_k UNCERTIFIED and the certified-NON-CONSTANT class empty of
    any real-object candidate. Full record: EV-MLKEM-4ba196.scope_limit_finding.

  # ==================================================================
  # 8. RATIONALE
  # ==================================================================
  rationale:
  - >-
    THE BATCH DID EXACTLY WHAT A PRE-REGISTERED INSTRUMENT BATCH IS FOR, AND THE ANSWER IS
    NEGATIVE, WITH A DEFECT IN THE RECEIPT THAT MUST NOT BE ROUNDED AWAY. The three-way
    termination clause was frozen and notarized before any measurement existed, in a commit
    verified in both directions by both reviews, and the branch that fired is the branch the
    frozen text fires. The Validator's `incomplete` verdict is the correct verdict for this
    situation and is honoured exactly: not `passed`, because two specific committed
    statements (the headline count, the P-A12a narrative) do not hold as written; not
    `failed`, because neither defect is a fabrication, a hash mismatch, a scope violation or
    a change to the branch, and the run is the most reproducible this goal has produced
    (379,149 shared leaves, zero non-timing differences).
  - >-
    THE HARD CALL IS THE NARRATIVE CORRECTION, AND IT IS MADE ON THE EVIDENCE RATHER THAN ON
    THE PRIOR COMMIT MESSAGE. A prior archival commit message repeated a producer claim about
    its own artifact that the committed artifact itself contradicts. That commit is immutable
    and is not touched; this decision and its cited evidence record are the correction a later
    reader needs. Recording it as its own numbered item, rather than folding it silently into
    the headline-count finding, is deliberate: the two defects are independent (one is a
    specification gap producing a genuinely ambiguous number; the other is a false statement
    about an unambiguous field), and conflating them would understate the second.
  - >-
    THE CONVERGENCE IS WHAT MAKES THE SCOPE-LIMIT FINDING ACTIONABLE RATHER THAN SUGGESTIVE.
    Two reviewers, working from the same frozen text without reading each other's write
    scope, independently built structurally different objects (an index-only functional; two
    non-digest linear/counting functionals) that both satisfy A-1.3 while provably carrying
    no lattice information. That convergence, plus its direct causal link to OBJ-1's
    unreachable tolerance, is what elevates it above a single-session observation.
  - >-
    THE ADVERSE ITEMS ARE CARRIED RATHER THAN BURIED. F-1 (the headline count), F-2 (the
    P-A12a narrative), the 114-cell coverage gap, and the compounding one-sided exemption gap
    the Red Team names in O-4(iii) are all recorded at full weight, none is smoothed into a
    `passed` verdict, and both required corrections are ordered explicitly rather than
    deferred indefinitely.
  - >-
    WHAT THIS BATCH IS NOT ALLOWED TO BUY, STATED SO NO LATER READER HAS TO INFER IT. It buys
    no admissibility claim about any lattice, no statement about ML-KEM, no lane closure, no
    rescoring of any prior batch, and no retirement of AM-3. Seven consecutive instrument
    batches is a real cost and this decision does not repair it by calling the eighth a
    result.

  # ==================================================================
  # 9. WHAT DOES NOT CHANGE
  # ==================================================================
  binding_carries_restated_and_not_re_litigated:
  - CLAIM TIER STAYS TOY, UNCONDITIONALLY. No number transports to beta = 606, d = 1420 or
    any FIPS 203 parameter set by extrapolation, analogy or any other route.
  - AM-3 IS NOT RETIRED. AM-10 through AM-18 and their carries are in force.
  - BATCH-a44d08 IS NOT RESCORED IN ANY RESPECT and its Section C verdict and detection
    floors remain VOID IN BOTH DIRECTIONS.
  - AM4-OBS-1 is cited ONLY through KN-FIND-f38a89. AM-9 binds (fpylll's k counts the
    q-scaled rows, not the identity block).
  - THE G-VAR REFUSAL IS CITED ONLY AS CONDITIONAL ON THE FROZEN FAMILY F0.
  - >-
    RULE 12 IS UNMET AND UNWAIVED, AND IS STRONGER HERE THAN IN THE PRIOR BATCH: both
    reviews of this batch AND the producer resolve to ONE MODEL on ONE HOST (the Red Team's
    own O-11). This is not "two sessions on one model reviewing a different producer"; it is
    producer-and-reviewer on one model, and neither review is presented as model-level or
    environmental corroboration anywhere in this decision or in EV-MLKEM-4ba196.
  - NEITHER SUB-6x COUNT IS CITABLE (carried from DEC-20260812-781961 section 4). "A factor
    of 6 to 31" is FALSE; the citable range is 4.87x to 31.03x. "Genuinely cross-platform" is
    NOT citable; the citable form is a portability result across three textually distinct
    implementations with fpylll pinned at 0.6.4.
  - NO HYPOTHESIS STATUS MOVES. THE GOAL IS NOT CLOSED, PAUSED OR COMPLETED, and none of an
    instrument outcome, a scoped negative, an exhausted batch or a defective coordination
    record may be cited in a decision that closes it.
  - THE SPLIT-PRODUCER NOTARIZATION PATTERN IS RETAINED UNCHANGED, having now worked six
    times and been verified in both directions by independent sessions each time.
    knowledge/INDEX.md must NOT be written, regenerated or staged.

  # ==================================================================
  # 10. ARCHIVAL NOTE -- THE 17 MB PROBE ARTIFACT
  # ==================================================================
  archival_note: >-
    The Validator's repro_results_a1.json (17,202,122 bytes, the independent re-run behind
    MR-0's reproducibility comparison) is DELIBERATELY DROPPED from this ledger archive's
    declared set rather than committed. It is a near-duplicate of the already-committed
    results_a1.json (17,202,361 bytes, committed at 4e466c6bf under
    TASK-20260813-2ce014/results_a1.json), differing only in 44 wall-clock leaves and 2
    working-tree-state keys; committing a second near-identical 17 MB blob would roughly
    double this batch's repository footprint for no new information the validation_report.yaml
    text does not already state (the full comparison method, leaf counts and the finding
    itself are recorded there and ARE committed). CONSEQUENCE, STATED PLAINLY: MR-0's
    comparison becomes SINGLE-SOURCE AND UNREPRODUCIBLE FROM THE ARCHIVE -- a future auditor
    cannot diff the Validator's exact JSON against the committed one byte-for-byte without
    re-running measure_a1.py themselves at commit 040a52a8c00bbdcb92790e2c3f12e5617d95db43.
    It remains fully re-executable: the command, environment and revision are recorded in
    the Validator's probes/command.txt, which IS committed. All other probe scripts and their
    (non-bulk) JSON outputs listed in both review reports' artifact_paths sections ARE
    committed in full, per the G-1 extension the dispatch queue requires.

  # ==================================================================
  # 11. EVIDENCE
  # ==================================================================
  evidence_refs:
  - ledger/evidence/EV-MLKEM-4ba196.yaml
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-6b6e78/reviews/TASK-20260813-59c321/validation_report.yaml
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-6b6e78/reviews/TASK-20260813-85e343/red_team_report.md
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-6b6e78/tasks/TASK-20260813-25cb95/prereg.md
