  held_for_user:
    - id: HU-1 to HU-4
      text: Unchanged and not acted on.
    - id: HU-5
      text: >-
        NEW. Does "Approval is bounded by execution" (the approval-capacity
        cap) apply to a decision that approves an amendment and continuation
        of an already-approved contract which has runs? The case is
        EXP-PFDR-0b3699: approved 2026-10-02, three runs, RA-04 to RA-06
        pending. The validator counts it because the decision kind is approve
        and the target is an approved EXP. It excludes the target itself from
        the backlog only because the target has runs.
        Options:
        (a) Recommended. The cap is for contracts with no runs. A maintainer
            scopes check_approval_capacity so that it fires only when an
            approved-here target has no runs. This is a change to the shared
            tools/validate_ledger.py, made or authorised by the user. Then
            TASK-20261008-6f12b8 re-runs exactly as written, and the five
            drafts are committed unchanged.
        (b) The user directs that such acts be recorded under decision kind
            `revise`. The Coordinator then writes a superseding decision, a
            superseding amendment and superseding cards (new ids), with
            disclosure. That costs another ledger round.
        (c) The cap applies. The continuation waits until area:PFDR holds
            fewer than three approved-unrun contracts, by other lanes running
            or retiring their own contracts on their own evidence. The ten
            contracts are listed in this decision.
        Not available without the user: retiring other lanes' contracts, and
        any shared-tool change.

  rationale:
    - The act's substance falls outside the rule's purpose, but inside its letter. Resolving that gap is a rule-owner question, not something this Coordinator should decide by changing labels.
    - Retiring contracts that belong to other hypotheses would be closure without evidence, which rule 9 forbids.
    - Pausing loses nothing. The run package and the adjudication are committed, the drafts are preserved, and no measurement is waiting.
  evidence_refs:
    - tools/validate_ledger.py check_approval_capacity (lines 2715-2832)
    - AGENTS.md "Approval is bounded by execution"
    - ledger/decisions/DEC-20261008-ef482f.yaml (draft; uncommitted)
    - experiments/EXP-PFDR-0b3699/specification.yaml (approval_decision, approved_at)
    - ledger/decisions/DEC-20261002-{1efb1f,88c731,4f2d28,c546a1,fb5717}.yaml (precedent decision kind)
    - experiments/EXP-PFDR-{01cdc8,38fb8e,4846fc,4a5f8d,59409e,6ecd2e,81e7c2,8aaad8,9244f4,fd1ae2}/specification.yaml (owning hypotheses)
  limitations:
    - This Coordinator ran no command. The list of ten contracts is the top-level session's report of the validator's count. Their ownership was read from each specification's hypothesis_id only.
    - Which sessions are active on those ten contracts was not checked.
