      - experiments/EXP-PFDR-0b3699/amendments/AMD-20261008-9c080d.yaml
      - ledger/handoffs/TASK-20261008-9456e8.yaml
      - ledger/handoffs/TASK-20261008-398fce.yaml
      - ledger/handoffs/TASK-20261008-6f12b8.yaml

  order_of_operations:
    - {step: 1, who: top-level session, what: "Check (j) of this decision's reference_table (HC-01 to HC-15), read-only, to scratch. Any MISS: stop."}
    - {step: 2, who: top-level session, what: "Run TASK-20261008-d0966e ALONE (ledger archive of this decision and the two new cards, under clause H-5). Verify, push, refresh PR #2008."}
    - {step: 3, who: top-level session, what: "Run TASK-20261008-125902 ALONE (copy the five drafts to .held copies and snapshot-archive the copies, under clause H-5). Verify, push, refresh PR #2008."}
