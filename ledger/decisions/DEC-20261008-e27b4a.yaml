# =============================================================================
# DEC-20261008-e27b4a -- Coordinator ruling on the STOP of
# TASK-20261008-6f12b8. tools/validate_ledger.py check_approval_capacity
# refuses DEC-20261008-ef482f: area:PFDR holds 10 approved contracts with no
# run; the cap is 3.
# RULING: PAUSE this lane's continuation, and route the scope question to
# the user (HU-5).
#   - In substance, DEC-20261008-ef482f approves an amendment and a
#     continuation of EXP-PFDR-0b3699, a contract approved on 2026-10-02 that
#     already has three runs. It approves no new contract and adds nothing
#     to the unrun backlog.
#   - It is NOT relabelled. Five earlier amendment-and-continuation acts on
#     this line used `decision: approve`, so changing the label now, after
#     the gate fired, would be gate-driven.
#   - No contract is retired. None of the ten belongs to this lane's
#     hypothesis (H-PFDR-2765d2); retiring any would touch other lanes' work.
#   - The five drafts stay UNCOMMITTED, UNEDITED and NOT OFFICIAL:
#     DEC-20261008-ef482f, AMD-20261008-9c080d and the cards 9456e8, 398fce
#     and 6f12b8. Byte-identical copies are preserved in a non-ledger
#     location (TASK-20261008-125902) so the container does not lose them.
# No status changes. No shared tool or config file is written.
# =============================================================================
coordinator_decision:
  id: DEC-20261008-e27b4a
  id_provenance: >-
    Minted by the top-level session with tools/allocate_id.py and confirmed
    free with --check, together with TASK-20261008-d0966e (the spares
    AMD-20261008-1d902d and TASK-20261008-125902 were supplied earlier). The
    Coordinator has no shell and minted no identifier.
  recorded_at: '2026-10-08'
  decided_at: '2026-10-08'
  decided_by: coordinator
  archived_by: TASK-20261008-d0966e
  goal_id: null
  batch_id: null
  question_id: RQ-PFDR-ae2fba
  hypothesis_id: H-PFDR-2765d2
  experiment_id: EXP-PFDR-0b3699
  review_plan_id: null
  authorised_by:
    - TASK-20261008-6f12b8 constraints (a validate error naming an artifact_path is a STOP; the Coordinator rules)
    - AGENTS.md "Approval is bounded by execution" (HC-04, HC-05)
  decision: pause
  decision_label: continuation_of_EXP-PFDR-0b3699_paused_on_approval_capacity_gate__not_relabelled__no_retirement_of_other_lanes_contracts__scope_question_routed_to_user_HU5__drafts_preserved_unofficial
  target_ids:
    - DEC-20261008-ef482f
    - AMD-20261008-9c080d
    - TASK-20261008-9456e8
    - TASK-20261008-398fce
    - TASK-20261008-6f12b8
    - EXP-PFDR-0b3699
    - H-PFDR-2765d2
    - RQ-PFDR-ae2fba
  target_ids_note: >-
    DEC-20261008-ef482f, AMD-20261008-9c080d and the three cards are
    uncommitted drafts, named here so the pause binds them. They are not
    official records. If a resolution check requires every target to
    resolve to a committed record, they are named in the same way under
    held_drafts below.

  context: >-
    Check (j) of DEC-20261008-ef482f passed twice (44 rows, 0 MISS), every
    custody check passed, and git status showed exactly the five records.
    The validate step then reported, naming ledger/decisions/DEC-20261008-ef482f.yaml:
    "approval capacity: area:PFDR already holds 10 approved contract(s) with
    no run (cap 3); run or supersede one before approving EXP-PFDR-0b3699".
    The rule, check_approval_capacity, applies to any decision with id date
    20261007 or later whose decision is in APPROVE_DECISIONS and whose
    target is an approved EXP (HC-01 to HC-03). EXP-PFDR-0b3699 itself is
    excluded from the backlog because it has runs. The rule still fires,
    because the decision approves and its target is an approved
    experiment. Nothing was staged or committed.

  determination:
    substance_of_the_act: >-
      DEC-20261008-ef482f approves an additive protocol amendment
      (AMD-20261008-9c080d) and a continuation executor for RA-04 to RA-06 of
      EXP-PFDR-0b3699. That contract was approved by DEC-20261002-e7f8c9 on
      2026-10-02, before the rule's enforcement date (HC-08), and it has
      three completed runs (HC-09). The act moves no contract into approved
      status. It turns an approved contract into further runs, which is what
      the capacity rule exists to encourage. The rule's own text: "approving
      a 1,138th does not reduce any uncertainty"; the governing clause:
      contracts "that have never run".
    why_not_relabelled: >-
      The decision kind `approve` matches this line's established usage for
      exactly this kind of act: DEC-20261002-1efb1f, -88c731, -4f2d28,
      -c546a1 and -fb5717 all use `approve` for amendment-and-continuation
      acts on EXP-PFDR-011cd0 (HC-10). A more precise kind (`revise`) is
      defensible in the abstract. Adopting it now, after the gate fired and
      to pass the gate, would be a gate-driven relabel. The top-level
      session's instruction and AGENTS.md rule 9 (good faith) both rule that
      out. Even if relabelled, AMD-20261008-9c080d names
      DEC-20261008-ef482f as its approval_decision, and
      TASK-20261008-9456e8's AUTHORITY clause requires that decision to read
      "approve". A relabel would therefore cascade into a superseding
      amendment and superseding cards.
    why_no_retirement: >-
      The ten approved-unrun area:PFDR contracts belong to other hypotheses:
      H-PFDR-aa86d0, 6b8c0f, 2beb62, a21e55, bb9a37, 80b6fb, 0bc09b, 870647,
      2d78b6 and 621852. None of them is this lane's H-PFDR-2765d2 (HC-11,
      HC-12). EXP-PFDR-81e7c2 shares RQ-PFDR-ae2fba but is H-PFDR-0bc09b's
      contract. Retiring any of them to free capacity for this lane would
      close another lane's approved work without the evidence a closure
      needs (rule 9; the closure gate). Releasing seven or more under
      supersedes_experiments or withdraws_experiments would also be a false
      statement. So none is retired, and the list goes to the user.
    what_the_gate_does_get_right: >-
      The area:PFDR backlog of 10 approved-unrun contracts is real and above
      the cap. It is a portfolio problem for the PFDR lanes and for the
      user. This decision does not dispute it; it only declines to resolve
      it by closing other lanes' work.

  ruling:
    - id: R-1
      text: >-
        PAUSE the EXP-PFDR-0b3699 continuation. This is a scheduling
        impediment on this lane, not a goal status (goal_id null); nothing
        becomes paused or blocked on a GOAL record. It is not evidence and
        not negative evidence about H-PFDR-2765d2.
    - id: R-2
      text: >-
        TASK-20261008-6f12b8 does not re-run, and TASK-20261008-9456e8 is not
        dispatched, until HU-5 is answered and a Coordinator decision records
        the route. The five drafts remain uncommitted, unedited and NOT
        OFFICIAL at their paths:
        - ledger/decisions/DEC-20261008-ef482f.yaml
        - experiments/EXP-PFDR-0b3699/amendments/AMD-20261008-9c080d.yaml
        - ledger/handoffs/TASK-20261008-9456e8.yaml
        - ledger/handoffs/TASK-20261008-398fce.yaml
        - ledger/handoffs/TASK-20261008-6f12b8.yaml
        Their rulings carry no authority until committed: the validity
        verdict, the PDI and PC-NULL-R rulings, and the approval. The
        reasoning is preserved for reuse.
    - id: R-3
      text: >-
        PRESERVATION WITHOUT OFFICIAL STANDING. TASK-20261008-125902 copies
        the five drafts byte-for-byte to
        coordination/design/TASK-20261008-125902/held-drafts/<original
        repository-relative path>.held and snapshot-archives the copies. The
        .held suffix keeps them out of every record-discovery and
        parse glob. They are design drafts held for a user ruling, never
        records, and are cited by nothing as authority. The originals stay
        in place, untracked.
    - id: R-4
      text: >-
        HU-5 goes to the user, with options and consequences (held_for_user).
        The Coordinator's recommendation is option (a). It is a
        recommendation only.

  governing_clause_for_TASK-20261008-6f12b8:
    text: >-
      Clause P-6F (DEC-20261008-e27b4a). TASK-20261008-6f12b8 is suspended:
      it may not be re-run, in part or whole, until a committed Coordinator
      decision names the route chosen under HU-5. Its card is unchanged. When
      it is re-run, its git-status check additionally admits exactly the
      untracked paths that decision names (none are expected besides those
      it lists today).

  governing_clause_for_other_archives:
    text: >-
      Clause H-5 (DEC-20261008-e27b4a). While the five drafts sit untracked at
      their paths, any archive task of this lane whose git-status check
      requires an exact set admits exactly these five paths in addition to
      its own. Each must have the sha256 the TASK-20261008-d0966e receipt
      records under held_drafts. None of them may be staged. A changed hash
      or any other extra path is a STOP. This clause binds
      TASK-20261008-d0966e and TASK-20261008-125902 below.

  held_drafts:
    note: the sha256 of each draft is recorded by TASK-20261008-d0966e at run time (held_drafts) and re-verified by TASK-20261008-125902 against its copies
    paths:
