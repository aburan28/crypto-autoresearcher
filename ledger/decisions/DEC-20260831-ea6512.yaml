coordinator_decision:
  id: DEC-20260831-ea6512

  context: >-
    Follow-up to DEC-20260831-5cf890 (same session, coordinator-aes003-1,
    2026-08-31). That decision queued TASK-20260805-d408ac and
    TASK-20260810-724383 in the BATCH-015 queue, claimed both, and launched
    two executor subagents in one message. BOTH LAUNCHES FAILED before any
    work with the identical backend error: "Subagent failed ... Insufficient
    balance or no resource package. Please recharge."

    This is the same failure the 2026-08-30 bus messages MSG-20260830-b1afc9
    and MSG-20260830-591a44 reported from another session; the adapter probe
    (`python3 -m orchestration.adapter doctor --probe`) had reported zai as
    serving glm-5.2, so the probe passes while real launches fail on balance.
    opencode.json binds all five subagent roles to zai/glm-5.2. No executor
    work happened, no artifacts were written, no measurements exist, and
    both claims were released as failed on branch aes003-batch015-20260831
    (releases published f46d7ea57 and ed0bb19fa) with the failure recorded
    as infrastructure.

  decision: infrastructure_stop

  decision_scope: >-
    THIS DECISION RECORDS AN INFRASTRUCTURE STOP AND NOTHING ELSE.

    It moves NO head field, NO hypothesis, NO claim tier, NO batch state.
    Both queued cards (TASK-20260805-d408ac, TASK-20260810-724383) remain
    queued and dispatcher-Ready; the queue amendment of DEC-20260831-5cf890
    stands unchanged. It asserts NOTHING about AES or about the mathematics
    of any open question. A backend balance failure is not evidence against
    any hypothesis (AGENTS.md rule 5), and nothing in this record may be
    transcribed as a research result.

  target_ids:
    - GOAL-AES-003
    - BATCH-015
    - TASK-20260805-d408ac
    - TASK-20260810-724383
    - DEC-20260831-5cf890
    - MSG-20260830-b1afc9
    - MSG-20260830-591a44

  head_disposition: >-
    THE HEAD IS NOT MOVED. current_batch_id stays BATCH-014,
    dispatch_queue_path stays
    coordination/goals/GOAL-AES-003/batches/BATCH-009/dispatch_queue.json,
    latest_verified_commit stays
    0f86463eb0eb4eca7c28a0bba2d7b4864d863832. The DEC-20260810-0c0946
    successor condition is neither satisfied nor advanced by this record.

  rationale:
    - >-
      Both launches failed before any tool call with an account-balance
      error from the zai backend; the failure mode is identical to the
      2026-08-30 reports, so the bus messages are now confirmed by direct
      reproduction rather than hearsay.
    - >-
      The adapter probe passing while launches fail means `doctor --probe`
      does not test billing state; this is recorded so future sessions do
      not treat a green probe as clearance to dispatch.
    - >-
      No silent rebind: switching the subagent bindings in opencode.json
      away from zai/glm-5.2 is a model-binding change that requires an
      explicit user-facing decision (recharge vs rebind) and, if rebind, a
      recorded inference amendment verifying the new backend satisfies
      executor-implementation and review policies. This decision takes
      neither step.

  evidence_refs:
    - id: DEC-20260831-5cf890
      role: dispatch_decision_whose_launches_failed
    - id: MSG-20260830-b1afc9
      role: prior_infra_stop_report_now_reproduced
    - id: MSG-20260830-591a44
      role: prior_infra_stop_report_now_reproduced

  evidence_refs_note: >-
    Bus messages are coordination traffic, not evidence; they are cited as
    the prior reports this stop reproduces. The launch failures themselves
    are recorded in the two claim release files published at f46d7ea57 and
    ed0bb19fa on branch aes003-batch015-20260831.

  limitations:
    - >-
      This session cannot dispatch ANY subagent task until a permitted
      backend with balance is bound (zai recharged, or an approved rebind
      to another permitted runtime such as openai). Coordinator-level
      bookkeeping that runs in this direct session remains possible.
    - >-
      Claim TTLs have been closed by the failed releases; a later dispatch
      re-claims from scratch.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED. An infrastructure failure produces no durable research
      claim. The one operational lesson (adapter probe does not test
      billing balance) is recorded here and in the next_actions, not
      promoted to knowledge.

  next_actions:
    - >-
      USER DECISION REQUIRED: recharge the zai account balance, or approve a
      recorded rebind of the opencode subagent bindings to a permitted
      backend that satisfies the role policies (doctor --probe plus one real
      launch to confirm before any batch dispatch resumes). Bedrock remains
      prohibited in every case (AGENTS.md rule 16).
    - >-
      On backend restoration: re-claim TASK-20260805-d408ac and
      TASK-20260810-724383 from the unchanged BATCH-015 queue and re-dispatch
      both executor tasks exactly as DEC-20260831-5cf890 specified.
    - >-
      Until then: GOAL-AES-003 BATCH-015 is blocked on infrastructure, not
      on research; no session should record this blockage as a research
      outcome or re-rank the batch because of it.

  decided_by: coordinator
  decided_at: '2026-08-31'

  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
