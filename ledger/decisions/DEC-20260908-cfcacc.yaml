  context: Independent Tate implementation NEEDS_CORRECTION and blind statement-level PASS are archived at ef9ba9a303209894d7735ed8d4de6072fd1e5b55.
    Authorize an immutable corrected implementation only.
  rationale:
  - Accept the exact worked implementation defects, including k=1 linear Rabin rejection, false final-suite completeness,
    open public mappings, missing fixed-prefix workload and alternation, incomplete cell costs/coverage, partial-outcome
    classification, provenance and signed admission gaps.
  - Retain the blind mathematical PASS only for its assigned character/reduction/cost/quantifier statements. It
    supplies no implementation or launch approval. The review-independence audit passes both owned joints.
  - The implementation reviewer read the necessary runtime predecessor outside the incomplete input scope and disclosed
    this. Include it explicitly in this successor; preserve the original deviation and reports. The blind derivation
    commit-as-epoch label remains disclosed by its snapshot receipt.
  - 'Modify the review request to enforce historical wall/CPU limits: current progress-first policy supersedes ordinary
    research-spending caps. Enforce memory/concurrency/cancellation and justified watchdogs and measure actual wall/CPU,
    preserving operational incomplete outcomes.'
  - Prioritize correction of a concrete approved calibration with reproduced implementation defects over adding
    new speculative designs. Standing authorization covers this work without further user confirmation.
  accepted_corrections:
  - Implement the k=1 Fp branch or reduce X modulo the degree-one modulus in the Rabin comparison; add an explicit
    irreducible-linear regression.
  - Replace the public-input substring blacklist with a closed typed schema validated recursively in both parent
    and evaluator entrypoint, and route the dishonest-label control through the actual boundary.
  - Precompute one q=64 label list per fixture/seed, use its first element for q=1 and replay that fixed workload
    across actual arm-order alternation.
  - Produce per-cell/per-seed/per-q/per-block measured costs and medians; charge complete shared selection, field/T/chiG
    setup, table setup, per-query work, reconstruction, final verification and required operation/memory/byte metrics
    without double counting.
  - Execute and gate on exactly eight selected cells, both seeds, all controls and the mandatory calibration before
    a completed status is possible.
  - Preserve rejected fixture/T/point attempts and partial completed cells progressively; classify unavailable fixtures
    and bounded search exhaustion as partial/inconclusive.
  - Enforce 8GiB process-group memory and one worker, explicit cancellation/signal checkpoints and justified process
    watchdogs, including terminating the whole evaluator process group. Routine stage/total wall and CPU estimates
    remain advisory under current policy; measure them, do not reinstate research spending caps.
  - Bind the signed lock to the implementation approval, entire transitive source closure, exact verified runtime
    with Bedrock refusal, run id, implementation commit and dirty state; use safe exclusive temporary files.
  - Emit a lifecycle-valid manifest with exact command, commit/dirty/source provenance, complete timestamps/resources/metrics
    and canonical statuses.
  - Add the runtime predecessor to the successor review handoff inputs, source_bindings and queue read_scope. Update
    the final tests and commission a new bounded independent review after the corrected implementation is snapshotted.
