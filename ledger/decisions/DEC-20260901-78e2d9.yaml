coordinator_decision:
  id: DEC-20260901-78e2d9

  context: >-
    GOAL-AES-003 batch-opening act by the dispatching Coordinator (session
    coordinator-aes003-1, 2026-09-01). DEC-20260901-079719's RANK 1 named
    the nonlinearity dilution ramp as a NEW falsifiable proposal through
    idea-generator, with the filed bcb117 record as input and the red
    team's J5 control (one r=5 AES arm logging per-trial wt(e)) as the
    first ramp point. The idea-generator round produced
    IDEA-20260901-363851 (committed 35a9c7280): a repaired ramp design --
    frozen nested position dilution S_k (AES table at k of 16 byte
    positions, identity elsewhere, pinned row-major order; points k in
    {0,1,2,4,8,12,16}), per-trial byte weight wt(e) of the candidate
    carrier e = (q0^q1)^(p0^p1) as the carrier statistic, a staged
    structure (Stage 0 = J5 carrier arm + Gate-0 receipt reproduction +
    r=6 known-dead reference + controls; Stages 1a/1b = ramp points),
    and preregistered two-hypothesis predictions with an exact
    one-sided exchangeability test.

  decision: open_batch

  decision_scope: >-
    THIS DECISION SELECTS IDEA-20260901-363851 AND OPENS BATCH-2f12ac TO
    EXECUTE ITS STAGE 0 ONLY.

    It opens coordination/goals/GOAL-AES-003/batches/BATCH-2f12ac/dispatch_queue.json
    on branch aes003-batch2f12ac-20260901 with one producer (Stage 0:
    ~7 runs per the record -- KAT pins, table-freeze digests, Gate 0
    logging-ON receipt reproduction of L1-AES-R5-P30 which doubles as
    the J5 carrier arm + perturbation check, the r=6 known-dead
    reference, determinism double, digest re-verify), snapshot,
    validator, and ledger archive cards. Stages 1a/1b are NOT in this
    batch; they open only on Stage 0's decision rule. The goal head
    moves to BATCH-2f12ac ONLY in the ledger archive commit after
    validation. It promotes NO knowledge and asserts NOTHING beyond
    what the record's preregistered Stage-0 decision rule returns.

  target_ids:
    - GOAL-AES-003
    - RQ-AES-003
    - BATCH-2f12ac
    - IDEA-20260901-363851
    - IDEA-20260901-bcb117
    - DEC-20260901-079719
    - EV-AES-b2910a
    - EV-AES-ec53f1
    - TASK-20260901-31bac8

  outcome: >-
    SELECTION: IDEA-20260901-363851 Stage 0 is dispatched as the sole
    producer of BATCH-2f12ac. Stage 0 is the gate for the whole ramp:
    its Gate 0 requires the logging-ON worker to reproduce the committed
    L1-AES-R5-P30 receipt field-by-field (14 hits, identical indices),
    which simultaneously validates the per-trial wt(e) logging as
    non-perturbing, executes the red team's J5 control (the first
    measurement of e under a nonlinear S-box), and anchors the r=6
    known-dead reference (band <=8, tripwire >=9 -> halt + escalate).
    Any Gate-0 or F3/F4 failure voids the ramp before any ramp point is
    spent (rule 5; blocking falsifiers F1-F6 as recorded).

  rationale:
    - >-
      The proposal repairs bcb117 exactly as DEC-20260901-079719
      required: a concrete frozen dilution family, a preregistered
      carrier statistic with two-hypothesis predictions, the campaign's
      now-standard integrity gates, staged budget honesty, an
      obstruction block with resource_check, and Pareto fields.
    - >-
      Stage 0 alone is ~7 runs / 1.5-2 h, within the campaign's
      single-producer precedent; Stages 1a/1b (5 runs each) are staged
      behind its decision rule so no ramp point is spent if the
      instrument or the carrier statistic fails its own gates.
    - >-
      The carrier question (does the r=5 excess decay WITH a measurable
      carrier signature) is the direct successor of the sealed verdict:
      EV-AES-b2910a established that death tracks nonlinearity within
      the tested subclass; this ramp asks whether the decay is carried
      by e.

  next_action: >-
    EXECUTE BATCH-2f12ac per its queue: producer TASK-20260901-7e0b71
    (Stage 0), then snapshot, independent validator, and ledger archive
    (EV-AES-732f71 / DEC-20260901-d46348). The ledger archive rewrites
    next_action on Stage 0's decision rule: Gate-0 pass + carrier
    signal at t=1 -> open Stage 1a as the next batch; S0-DEAD or
    SHAPE-ONLY (F1) -> carrier reading falsified, return to idea
    generation with the measured obstruction; any blocking gate failure
    -> halt with no ramp spend. A claim-changing outcome (F6 tripwire
    or carrier falsification of the sealed verdict) gets a post-hoc
    red-team card before ledger recording, per the BATCH-fe0bdc
    precedent. The remaining ladder from DEC-20260901-079719 (69912d,
    02f7c4 B1-B3, 256-byte control, decay design, BATCH-6fe3c2 debt)
    stays ranked behind this batch's outcome.

  evidence_refs:
