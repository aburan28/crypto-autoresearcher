coordinator_decision:
  id: DEC-20260904-732cbe
  context: >-
    Adjudicates a duplicate-contract bookkeeping gap that both affected
    records themselves flagged, stated first in their own text, and
    explicitly requested a Coordinator resolve: H-MONO-d36283 (added
    2026-08-25, status `proposed`) and its paired EXP-MONO-ccc068 (status
    `review_required`, never approved, `execution_authorized: false`) are
    a second, independently-drafted hypothesis/contract pair on the SAME
    parent proposal, IDEA-20260805-a9a95d, as H-MONO-663fb4 and
    EXP-MONO-c819ba. Both pairs' own duplication_note fields state this
    was created by two concurrent sessions independently drafting from the
    same proposal (this program's own dispatching identifiers, not a
    deliberate replication design) and that neither may be approved until
    a Coordinator supersedes one or withdraws one. This has sat unresolved
    for ten days (2026-08-25 to 2026-09-04) while H-MONO-663fb4's own pair
    proceeded through a full, independent resolution cycle (five decision
    records, four evidence records, reaching
    `supported_scoped_k3_k4_controlled_null_fisher_sensitivity_open`).
  decision: withdraw
  decision_label: >-
    duplicate_contract_pair_withdrawn_in_favor_of_the_already_resolved_sibling_no_compute_spent_on_the_withdrawn_pair
  target_ids:
    - H-MONO-d36283
    - EXP-MONO-ccc068
    - H-MONO-663fb4
    - EXP-MONO-c819ba
    - IDEA-20260805-a9a95d
    - RQ-MONO-001

  hypothesis_status_before: proposed
  hypothesis_status_after: withdrawn_duplicate_of_h_mono_663fb4
  hypothesis_status_after_note: >-
    H-MONO-d36283 is withdrawn as a duplicate, not evaluated on its own
    merits and not weakened or refuted -- its own substantive content
    (the exact Fourier-analytic mean/variance identity I1-I3/M1-M2, the
    relocation argument P3/M3, and the pre-registered [0.7,1.4]/[0.85,1.15]
    prediction bands) is, on direct comparison, essentially verbatim
    identical to H-MONO-663fb4's own statement -- both drafted independently
    from the same parent proposal IDEA-20260805-a9a95d. H-MONO-663fb4
    already carries the full, independently-reviewed resolution of this
    exact question. No scientific content is lost: anything H-MONO-d36283
    could have tested, H-MONO-663fb4's own already-completed cycle already
    tested.

  experiment_status_before: review_required
  experiment_status_after: withdrawn_duplicate_never_executed

  official_status_changes:
    goal_status_changed: false
    goal_status_after: paused
    hypothesis_status_changes:
      - hypothesis_id: H-MONO-d36283
        from: proposed
        to: withdrawn_duplicate_of_h_mono_663fb4
    experiment_status_changes:
      - experiment_id: EXP-MONO-ccc068
        from: review_required
        to: withdrawn_duplicate_never_executed
    resource_disposition_changed: false
    completion_criteria_met: []
    implementation_authorized: false
    experiment_runs_authorized: 0
    scientific_interpretation_authorized: false
    closure_authorized: false
    breakthrough_authorized: false

  claim_tier: not_applicable
  scope_statement: >-
    This is a bookkeeping adjudication, not a scientific finding. It makes
    no claim about RQ-MONO-001, KN-OPEN-009, or any curve/factor-base
    property. EXP-MONO-ccc068 was never approved and never executed --
    zero compute is discarded by this withdrawal.

  rationale:
    - >-
      BOTH RECORDS EXPLICITLY REQUESTED THIS ADJUDICATION IN THEIR OWN
      TEXT, STATED FIRST: this is not a Coordinator judgment call invented
      after the fact; it is discharging an already-declared, already-
      described obligation that a prior dispatching session correctly
      flagged but that no session had yet acted on.
    - >-
      DIRECT TEXTUAL COMPARISON CONFIRMS GENUINE DUPLICATION, NOT MERELY
      A SHARED PARENT: H-MONO-d36283's (M1)-(M4) and H-MONO-663fb4's
      (I1)-(I3)/(P1)-(P3) state the same exact identity, the same
      Parseval bound, the same relocation argument, and the same numeric
      prediction bands ([0.7,1.4] for Var ratio, [0.85,1.15] for C/F
      ratio) at the same arities (m in {1,2,3,4}). This is not a case
      where adjudication might reasonably have gone the other way.
    - >-
      WITHDRAWING RATHER THAN SUPERSEDING PRESERVES THE CORRECT RECORD OF
      WHICH PAIR ACTUALLY DID THE WORK: H-MONO-663fb4/EXP-MONO-c819ba
      executed, was independently reviewed, and reached a scoped-supported
      status through real compute and real review. H-MONO-d36283/
      EXP-MONO-ccc068 never executed. "Withdrawn duplicate" accurately
      states that this pair contributed no independent evidence, rather
      than "superseded," which could misleadingly suggest it once carried
      standing content that a later record improved upon.
    - >-
      ZERO COMPUTE OR REVIEW BUDGET IS LOST: EXP-MONO-ccc068's own
      execution_authorized field was already false; withdrawing it
      prevents a future session from spending a full experiment-plus-
      review cycle re-answering an already-answered question, which is
      the entire point of resolving this now rather than leaving it
      to be rediscovered.

  next_action: >-
    None required for this pair. RQ-MONO-001's remaining live thread is
    GOAL-MONO-001's own top-level next_action (the m=3 collapse check D-5:
    whether the S_3 symmetry transports OBS-1 to
    disc_{x2} S_3(x1,x2,T0) = 16 f(x1) f(T0) -- unverified, and stated as
    gating any further harness work on that goal's own direction-swap
    line), separately from this MONO/character-bias sub-thread, which is
    now fully resolved across H-MONO-45183a (supported_scoped),
    H-MONO-663fb4 (supported_scoped, this pair's own already-completed
    resolution), H-MONO-59f6a6/H-MONO-0f9170/H-MONO-0b3def (supported),
    H-MONO-40aca5/H-MONO-819f2b (weakened), and H-MONO-1d50ac (refuted at
    tested scale, closed this session).

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      A bookkeeping withdrawal promotes nothing; H-MONO-663fb4's own
      already-completed cycle is the record carrying any knowledge-
      promotion content for this question.

  procedure_deviations: []

  limitations:
    - >-
      This decision does not re-evaluate H-MONO-663fb4's own resolution;
      it is cited as already-settled context.
    - >-
      Does not address GOAL-MONO-001's own separate, still-open
      direction-swap line (the D-5 collapse check); that remains a
      distinct, unresolved item in this lane.

  reviewed_by: []
  decided_by: coordinator
  decided_at: '2026-09-04'
  inference:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
