  prior_comparison: >-
    Recorded in full in EV-PFDR-1faf10 analysis CMP-6. In short, J1-J5 and J8
    came out as expected. J6 was expected in direction but came out larger in
    size. J7 and two proves-too-much priors were OVERTURNED: the mechanism is
    the counting unit, not structured-arm dispersion; the known-null arms
    excurse more often than the structured ones; and Stage R is not near its
    nominal false-replication rate. F-J1-1, F-J3-1 and the exposure confound
    were unanticipated. The prior's overall line was "a valid, correctly
    computed, weakly powered screen, supporting no closure stronger than the
    planted-excess sensitivity and no structural excess". It is confirmed,
    and sharpened: the screen's statistic is miscalibrated in pair units,
    not merely underpowered. Concurrence is discounted per PD-1: the prior
    was written after reading the structural parts of the producer's report.

  rationale:
    - >-
      Why not reject_scoped (closing lead 2). The frozen O-NULL reading names
      "the measured band" as its obstruction record. The review shows that
      band is miscalibrated (J6, J7, PTM). What survives is a
      detection-limited non-detection from a single run set, empirical_only.
      The plan's ceiling ("a single-run, empirical-only census supports no
      reject_scoped") and docs/claims-and-verification.md both forbid a
      scoped rejection here. The lane stays open with a named successor
      (NA-5) and a revisit condition, per AGENTS.md "Research-direction
      integrity".
    - >-
      Why not support. The hypothesis carries an asymptotic claim. The four
      promotion gates are unmet (no proof decomposition, H2 untested for
      rate, H1 refuted as stated, no concrete-cost table), and the plan fixed
      the ceiling at analyzed. Its pair-unit clauses also failed.
    - >-
      Why not weaken. The pre-registered failures are H1's Poisson KS,
      prediction 4 for TT, H3's rank clause, and the band's calibration. All
      of them localise to one declared specification convention, the pair
      counting unit. They appear equally on arms whose kappa is 1 by
      definition. Weakening the hypothesis would read a unit mismatch as
      evidence against the mechanism: the structured bases are claimed to
      carry no non-generic excess of distinct relations, and nothing here
      contradicts that. The honest transition restates the hypothesis in the
      unit its mechanism is about.
    - >-
      Why not inconclusive. The evidence DOES discriminate on the question
      the decision turns on. The known-null and relation-level controls show
      that the pair-unit statistic manufactures excursions and that the
      pair-unit heuristics fail on random arms. That determines the next
      action: restate and re-test in relation units. It is not "the data
      cannot tell".
    - >-
      Why refine. REFINE means: supersede H-PFDR-4765e4's pair-unit
      formulations with relation-unit ones. That covers clause (B)'s band,
      prediction 4, HEUR-4765e4-H1 (first moment and a compound law), and H3.
      The null is calibrated on the random arms' measured dispersion, with an
      in-design known-null arm. The re-test is the relation-level census of
      NA-5. The mechanism and the source proposal are unchanged. The generic
      readings (1a) and (2) are kept as recorded.
    - >-
      Exponent bias (docs/target-result-profile.md). The structural branch
      is the only exponent-targeting part of this line: kappa ~ N^delta would
      move the exponent to (1+beta-delta)/2. The generic branch is a constant
      factor at odd m, plus an even-m engine change that stays above rho. The
      follow-up (NA-5) is ranked above the generic even-m work (NA-12) for
      that reason. Its prior is the null, and it is justified by closing the
      detection gap honestly rather than by a positive signal.

  scoped_claim: >-
    On generated prime-order curves E/F_p at 12..32 bits (known_log and j0
    12..24), with the crypto_autoresearcher.index_calculus mitm engine
    (min_fill, default table arity) at m = 3, 4, 5, five curves per rung plus
    five fresh curves per excursion cell, and a fixed attempt budget A_fix =
    |F_sub|, the following holds. No replicated excursion of the frozen census
    statistic, and no calibrated structural excess, was observed for the
    subgroup, dickson and small_x bases against matched random bases in
    classes TT and SS. Excesses of pair-level kappa >= 1.5 (TT m 3), 2.0
    (TT m 5), 1.25 (SS m 3 and m 4) and 2.0 (SS m 5) at 30-32 bits would have
    been detected with probability >= 0.5. Smaller excesses, TT at m = 4 and
    TB are not excluded. The four R15 excursions are the count a
    dispersion-calibrated null produces and are not evidence of structure.
    The HEUR-4765e4-H1 Poisson form is refuted for pair counts in six (class,
    m), while the collision model's mean is not refuted for TT|3, TT|5 and
    SS|3-5. Harvesting lowered S_3 to solution by >= 1.3 at every base and
    rung >= 24 bits at m = 3, 5. The m = 4 small_x harvest-on S_3 exponent is
    0.6076 (nominal 95% interval 0.601-0.614, which undercovers). These are
    S_3-count statements only, on solves certified in-process. Evidence
    EV-PFDR-1faf10 (preliminary, toy); runs RUN-PFDR-1b78f7-census-m3/-m4/-m5,
    -j0, -rho, -analysis, -stage-r; reviews TASK-20260929-accb8e and
    TASK-20260929-f29c96.

