        dispersion-calibrated simulation before the structured arms are
        read; (c) exposure-matched SS, at a fixed number of formally distinct
        encodings rather than attempts; (d) retention of every row needed
        for the relation recount in every family cell (no saturation cut
        where a cell can enter the family); (e) the cell family and its
        resolution rule declared before data, not decided from the random
        counts; (f) fresh curve seeds beyond 0..9; (g) curves per rung sized
        by a pre-registered PTM-3-style power analysis, targeting relation-
        level kappa <= 1.15 at P >= 0.5 at 30-32 bits for TT and SS at m =
        3, 4, 5, TT m = 4 included (unresolved here). The red team's ten-curve
        subgroup TT m 3 28-bit design is the minimum cell and not the whole
        design. (h) it is built on the OBJ-5-fixed SS counter (NA-7); (i) k
        archived per solve with a disjoint kP = Q verifier (NA-8); (j) seed-
        averaged or >= 20000-replicate bootstraps, and intervals calibrated
        at the design's n (J5), with a design-evaluated A2 null slope in
        place of "interval above 0" (MC-6); (k) toy scale, <= 32 bits, one
        engine, unless the design argues otherwise. Rank: SECOND, after NA-3
        (NA-3's r-accounting reading may change the relation definition).
