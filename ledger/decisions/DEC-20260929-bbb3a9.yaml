        design-evaluated value. The firing rows are routed, unread, to a
        separate review-breakthrough round (NA-3). "(2) met, not falsified"
        stands as its frozen criterion, which is not floor-relative.
      TW-ALIVE: not fired. The composition therefore interprets.
      TW-SCOPE: applied to every statement in EV-PFDR-1faf10 and here.
    stage0_P7c_note: >-
      The plan's composition text asks that the Stage 0 P7(c) dispersion
      observation (EV-PFDR-cf6ee5 OBS-11) be read beside A6. EV-PFDR-cf6ee5 is
      not yet archived (TASK-20260929-091c3a is with the user), so it is not
