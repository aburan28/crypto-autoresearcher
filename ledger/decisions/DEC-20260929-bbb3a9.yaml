  composition:
    method: >-
      Joint by joint, as the plan prescribes. Each reviewer's verdict is read
      on the joints it owns and nowhere else. Neither reviewer offered a
      whole-claim verdict, and none is imputed to either.
    joints:
      J1: >-
        HOLDS (validator). Package, bindings, checksums, manifests, seeds,
        cells, G1-G3, C-1 (exhaustive six-twist counts), C-2 (own AST and call
        graph), BI-1 and IE-1 all hold. Finding F-J1-1 is ACCEPTED: the
        solve-certificate gap is a property of the frozen design, and it
        departs from the program's certificate discipline
        (docs/claims-and-verification.md). It does not invalidate this run
        set, which matches its frozen contract. It caps every solve-dependent
        reading at the in-process flag (NA-8).
      J2: >-
        HOLDS (validator). The sealed blind canonical sets equal merged/ and
        the R12, R14 and R16 roots record for record. F-J2-1 is accepted as a
        binding-record gap only. R16's root rows are outside view-map-stage-r
        but are bound by merge-report, checksums, manifest and receipt, and
        they equal the blind set.
      J3: >-
        HOLDS (validator). Every outcome id, excursion-list entry, Stage R
        reading, PC-1/PC-2 verdict, (1a)/(1b)/(2) reading and TW-FLOOR key
        set agrees, and so does every deterministic kappa and z in all 297 A1
        cells. 4116 of 4174 deterministic comparisons are exact. The other 58
        localise to conventions the text leaves open, and each was reproduced
        under the producer's convention. None moves a decision. That matches
        the prior's expected failure locus without a break. F-J3-1 is
        accepted (NA-7).
      J4: >-
        HOLDS (validator). R15 and R16 analysis outputs are byte-identical. The
        merge re-runs are byte-identical, including the three canonical files
        written by the pre-DEV-A script. The two re-executed census jobs
        reproduce exactly, and 91 of 91 raw-to-summary checks agree.
      J5: >-
        BREAKS (validator), as the prior expected. Every frozen interval
        procedure covers 0.864-0.916 against a nominal 0.95. The
        (n-1)/n deflation derivation explains most of the shortfall. This
        independently confirms the Stage 0 red team's measurement
        (TASK-20260929-69b7c5, sealed at dc61c5e1e), which the validator did
        not read. It bounds the wording of every interval statement, and no
        decision in this run set flips.
      J6: >-
        BREAKS (red team). The four excursions are the expected count of a
        null calibrated on the random arms' own dispersion: E 3.5-4.5,
        P(>= 4) 0.47-0.66. Stage R's false-replication rate is 0.6-5.6% per
        cell and 7-8% over four cells, against 0.135% nominal. Every
        bootstrap decision element and every A1, A4 and Stage R quantity is
        seed- and order-robust. "(1b) not met" is a point reading whose
        interval straddles the threshold. The six H1 rejections are not
        multiplicity. They refute the Poisson shape of PAIR counts. The first
        moment matches within 2% for four of the six rejected (class, m)
        (TT|3, TT|5, SS|4, SS|5), and also for the non-rejected SS|3. It is
        9-20% low for TB|3 and TT|4.
      J7: >-
        BREAKS (red team), and it overturns the prior's mechanism. The
        declared conventions are applied as written and select on no outcome.
        But the excursion list is a property of the pair counting unit and
        of the pair-unit Poisson variance floor. In distinct relations 0 of
        133 computable cells excurse. The structured arms are not more
        dispersed than the random arms. Exposure is a second, smaller
        confound (about half of dickson SS m 4 26b). SS at stop gives a
        different excursion set.
      J8: >-
        HOLDS (red team). DEV-A post-dates R15 and pre-dates every R16 row, and
        no edited line reads a measured value. The pre-DEV-A fixture outputs
        are byte-identical to post-DEV-A. DEV-B changed exactly one checksums
        entry per location. DEV-C shadows nothing. DEV-D is one interpreter
        and one numpy build throughout.
      proves_too_much: >-
        BREAKS (red team); the failure signature is met. The random arms read
        as structured excurse at 5.8% (19 of 329), more often than the
        structured arms at 3.6%. Stage R on R16's random arms gives 3 of 12
        |z| > 3. PTM-3 sets the detection limit X per (class, m) at 30-32
        bits: TT m 3 1.5; TT m 4 none at kappa <= 5; TT m 5 2.0; SS m 3 1.25;
        SS m 4 1.25; SS m 5 2.0. Any closure is limited to kappa >= X (pair
        units), and none is decided here.
    composite: >-
      The run set is a valid, reproducible and faithfully computed execution
      of protocol v3 (J1-J4, J8). Its structural census statistic does not
      measure what the hypothesis needs. It counts pairs, each distinct
      relation appears as several dependent pairs, and a Poisson floor in
      pair units calibrates it. So its excursions are null-expected (J6, PTM),
      and they vanish in relation units (J7). Its intervals undercover (J5).
      No calibrated structural excess was seen, and the non-detection is
      bounded by X. The same unit mismatch explains three failures of the
      hypothesis as formally stated: the H1 Poisson KS, prediction 4 for TT
      and H3. All three occur on random arms too. The generic readings (1a)
      and (2) stand as S_3-count statements, with no speedup statement
      without F-COST-1's terms.
    pd2_checker_confirmation: >-
      CONFIRMED. The archived checker output
      (coordination/review/pfdr-1b78f7-20260929/independence-check.txt, exit
      1) reports exactly one problem: re-deriver TASK-20260929-accb8e read 42
      blind_from paths. Plan entry PD-2 anticipated exactly this line. Every
      one of the 42 reads is listed after the seal in the attestation
      (sealed_at 08:02:39Z; 884 pre-seal read-log entries, 0 hitting
      blind_from). They were commissioned by the card for J1, J2b, the J3
      comparison and J4. Seal custody passed (TASK-20260929-d9bf1b check (d)).
      No other independence problem was reported. This Coordinator did not run
      the checker; it reads the archived output.
    tripwire_routing_applied:
      TW-FLOOR: >-
        FIRED in both the validator's blind predicate and the producer's flag,
        with equal key sets: 73 on-mode instances, 0 census-mode. Every
        floor-relative reading is withheld from this composition. That
        includes A7, any reading against the EXP-PFDR-7c8bf2 floor fits, and,
