    promoted: []
    not_warranted: >-
      No KN-FIND. The decision is refine on preliminary evidence, so
      promotion is not required, and no scoped positive or negative finding
      is durable yet. The structural non-detection is detection-limited and
      unreplicated, and it has a scheduled successor (NA-5), so a KN-OPEN is
      not opened either. One KN-TECH IS WARRANTED but cannot be created by
      this act. Knowledge entries are .md files, which this subagent cannot
      write and the top-level session will not write on its behalf. It is
      therefore pending a user decision (NA-11), not declined.
    pending:
      - kind: KN-TECH
        id: to be minted (tools/allocate_id.py) when written
        basis: >-
          Two independent measurements plus a derivation. The EXP-PFDR-7c8bf2
          Stage 0 red team (TASK-20260929-69b7c5, sealed at dc61c5e1e)
          measured it first. The EXP-PFDR-1b78f7 validator J5
          (TASK-20260929-accb8e) re-measured it with its own code, blind to
          the Stage 0 material. This meets the plan's condition that a KN-TECH
          is "considered only if J5 independently confirms it".
        would_contain: >-
          Title: small-sample undercoverage of stratified percentile bootstrap
          intervals at five units per stratum. Statement: resampling n units
          with replacement within a stratum deflates the bootstrap SE by
          sqrt((n-1)/n), which is 0.894 at n = 5. A nominal 95% percentile
          interval on a linear statistic then behaves like +-1.75 SE, with
          predicted coverage 0.909-0.920 (J5 c derivation, labelled
          derivation). Measured coverage: stats.bootstrap_slope 0.887-0.909
          (11x5 and 7x5 designs, Gaussian and t3); stats.fit_exponent
          0.913-0.916; paired delta bootstrap 0.903-0.909; the ratio-and-log
          curve-index bootstrap (A2) 0.864-0.875, with a one-sided false
          "above 0" rate of 0.070 against 0.025. Scope: synthetic designs
          matching EXP-PFDR-1b78f7 and EXP-PFDR-7c8bf2 (five curves per rung,
          7 or 11 rungs); the absolute tail figures depend on residual scale.
          Remedy: seed-averaged or >= 20000 replicates for Monte Carlo error
          (a separate issue); a (n/(n-1)) variance correction or t-based
          intervals; calibration by simulation at the design's n before any
          "interval excludes" reading. proof_status: derivation for the
          deflation factor, empirical for the measured coverages. Sources:
          EV-PFDR-1faf10 OBS-9, the validator's
          calibration/coverage-tables.yaml, and the Stage 0 red team report.

