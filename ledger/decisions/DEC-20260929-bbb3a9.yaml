    - id: NA-3
      role: coordinator (later act; ids minted then; TASK-20260929-fd1a9f unused)
      text: >-
        OPEN THE TW-FLOOR ROUND. It is a separate claim-changing review at
        review-breakthrough (max), filed as "a claimed contradiction of a
        generic lower bound or an accounting error" (spec TW-FLOOR; plan
        tripwire_routing). Its review_plan is written before any reviewer
        runs, on a fresh plan card, with two fresh reviewer sessions
        (validator-breakthrough, red-team-breakthrough) and a snapshot archive
        card bound before dispatch. The Coordinator composing it reads no A7
        value before the reports return.
        EXPOSURE DISCLOSURE for the prior below: this Coordinator has read
        the 73 firing KEYS (panel, bits, curve, m, arm, mode) and the red
        team's MC-6 m = 4 comparator figures (design-evaluated floor-model
        exponent 0.621/0.629 against the observed 0.6076). It has read no A7
        value and no floor ratio.
        PRIOR, recorded now: (a) known_log, 35 of 35 on-mode instances fire.
        The floor's premise (base logs are independent unknowns, H-PFDR-0cc7e8
        assumption 2) is false by construction for F_j = jP. Below-floor rows
        there are expected. P(they evidence a contradiction of the generic
        floor) is about 0. These rows are the round's natural proves-too-much
        object: the floor argument must NOT go through on them. (b) j0_coset,
        17 of 35 fire. Automorphism-formal relations partly violate the
        premise, and r likely counts formal or dependent rows. P(premise or
        accounting) is about 0.9. (c) The 21 generic-arm instances (m = 4 and
        5, 14 on random arms), with 0 census-mode firings overall. The
        leading explanation, about 0.6, is A7's on-mode r convention
        ("relations + harvested rows fed before the stop"). It counts
        multiply-counted and dependent harvested pair rows (EV-PFDR-1faf10
        OBS-3) and 2-target SS rows as if each were an independent relation,
        which inflates r against the floor's premise. Next, about 0.25, is a
        per-instance fluctuation below an EXPECTATION bound (the floor bounds
        E[r]; the predicate is per instance). Next, about 0.1, is a genuine
        defect in the lemma, its constants or the S_3 charging, which is
        H-PFDR-0cc7e8 falsification condition 1 in substance. Last, about
        0.05, is a solve or certificate error (F-J1-1). (d) The (2) exponent
        lying below the design-evaluated floor-model exponent is, at about
        0.8, finite-range lower-order terms plus the same r and |F|
        accounting, not a sub-floor engine.
        DESIGN CONSTRAINTS for the plan: joints for (i) solve reality of the
        firing instances, via an independent kP = Q check with k archived,
        either as a review-scoped bounded re-execution of the firing
        instances with a disjoint checker (no RUN id, chosen by rule, memory
        guarded) or as a separately approved certification run (F-J1-1);
        (ii) a blind re-derivation of the A7 ratio from rows under the frozen
        r and named alternatives (distinct relations, informative rank,
        k-determining rows, census-mode r); (iii) a floor-premise audit per
        arm; (iv) an S_3 charging audit, covering every encoding the harvest
        compares and F-COST-1's uncharged terms; (v) the expected number of
        sub-0.9 instances under the floor held as an expectation with the
        measured r dispersion; (vi) the (2) exponent comparison.
        Proves-too-much objects: known_log (the floor must fail), the rho
        panel, the census-mode instances, and a synthetic generic-group
        simulation with uniform logs. Routing: an accounting error leads to
        an additive protocol_amendment of A7's convention (never a silent
        re-score) and the H-PFDR-0cc7e8 reassessment of NA-10. A surviving
        contradiction is H-PFDR-0cc7e8 falsification condition 1 and goes to
        its own composition under AGENTS.md rule 12. Rank: FIRST among the
        open items of this line.
