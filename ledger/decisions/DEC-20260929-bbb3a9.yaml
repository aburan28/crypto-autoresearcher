    - id: NA-5
      role: coordinator (later act; WARRANTED, not designed here)
      text: >-
        FOLLOW-UP EXPERIMENT: a relation-level structural census, the
        successor of lead 2. Design constraints, all fixed before any data:
        (a) the primary statistic counts distinct normalised relations per
        instance, with the normalisation written out, and the same unit is
        used for resolution and variance; (b) an in-design known-null arm (a
        fourth random base per family, scored with the identical statistic
