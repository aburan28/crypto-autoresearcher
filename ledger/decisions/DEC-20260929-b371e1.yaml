  decision: approve
  decision_label: >-
    APPROVE THE COMPLETE FROZEN CONTRACT EXP-ECDLP-64fa3d v1 and authorize the
    zero-trial plan-authoring task TASK-20260929-9c9f99. Execution of the frozen
    trial graph is authorized only after that task is snapshot-archived, the run
    card TASK-20260929-402d5b is authored with the plan's execution binding, the
    run paths and a published claim.

  context: >-
    DEC-20260929-821525 selected IDEA-20260923-9e4b71 (rank 1 of 15 open ECDLP
    proposals). This decision converts it into H-ECDLP-4b54a2 and the frozen
    specification experiments/EXP-ECDLP-64fa3d/specification.yaml. The idea's own
    Step 0 and Step 1 (symbolic re-derivation and an exact shift-lattice
    calculation, seconds of CPU) are kept as the experiment; its Step 2
    (planted-root LLL at p near 2^40, 2^64, 2^96) and Step 3 (end-to-end toy run)
    are NOT part of it and are owed only as a conditional successor, because they
    validate heuristics (HEUR-1, HEUR-2) that matter only if the verdict is
    ALIVE. While designing the calculator, the Coordinator found by hand that the
    committed instrument's determinant bookkeeping (convention TOOL) is probably
    wrong for n >= 2 (FINDING-TOOL-CONVENTION in DEC-20260929-821525), so the
    contract audits the convention first, computes every supply number under BOTH
    conventions, and freezes a rule for which one decides.

  design_decisions:
    - id: DD-1
      subject: what the experiment measures
      ruling: >-
        The verdict is decided by exact integer shift-lattice exponent sums
        (A, B, C_HG) of a frozen family JS(t; order), by the exact rational
        polygon of D5 including the information ceiling, and by the frozen
        two-point Richardson extrapolation with a three-point consistency check
        (D6). No sampling enters the verdict. The alive and dead margins are
        e <= 0.98 and e >= 1.02 in the exponent of p in S T^2, generic line e = 1.
    - id: DD-2
      subject: convention audit before decision
      ruling: >-
        Convention HG (Howgrave-Graham det(L) < p^{tN}) is the decision
        convention if and only if the gating controls K1-HG, K2-HG and the exact
        explicit-lattice audit K3a pass; otherwise the run is VOID_CALIBRATION.
        Convention TOOL is reported beside it, audit-only, and can never become
        the decision convention, so no post-hoc switch is possible. This is the
        pre-registered answer to the question the audit raises: I do not know
        which convention the committed tool's authors intended; I know that at
        n = 1, d = 2, t = 1 the explicit three-dimensional lattice has
        det = p^2 X^3, which makes the Howgrave-Graham reach 1/3 and not the
        tool's 2/3.
    - id: DD-3
      subject: what a DEAD verdict may claim
      ruling: >-
        Finite-t regions are lower bounds on lattice capacity and no rigorous
        upper bound is available, so DEAD_IN_FAMILY closes ONLY the frozen family
        (supports of 13 and 9 monomials, two graded lexicographic orders, t <= 8,
        symmetric windows, convention HG). An inconsistent extrapolation gives
        DEAD_AT_TESTED_T_ONLY with no closure claim. This satisfies the closure
        standard's scope rule: the obstruction is never claimed over a wider scope
        than it is measured.
    - id: DD-4
      subject: heuristic-validation pairing (agents/coordinator.md)
      ruling: >-
        A conditional result must be paired with a heuristic-validation experiment
        in the same or the following batch. The only conditional result this
        experiment can produce is an ALIVE verdict, conditional on HEUR-1 (yield)
        and HEUR-2 (lattice independence). Pairing is therefore SCHEDULED, not
        waived: on ALIVE_FINITE or ALIVE_EXTRAPOLATED the following batch must
        contain (a) a yield-enumeration experiment for HEUR-1 (exact enumeration at
        p in {2^20, 2^24, 2^28}, three curves each, 10^4 uniform targets per
        (beta, gamma) cell on a 4 x 3 grid, Poisson comparison and tail check,
        transfer to cryptographic p stated as an assumption) and (b) a
        planted-root LLL experiment for HEUR-2 on the coupled system at p near
        2^40, 2^64, 2^96 with 50 instances per cell and outward decay control, and
        where feasible (c) a toy end-to-end proof-of-concept. A DEAD, NEAR or VOID
        verdict issues no conditional claim, so no pairing is owed; NEAR names (b)
        as its successor. HEUR-1 and HEUR-2 have no validation experiment id yet,
        and the hypothesis records that plainly; it caps the hypothesis below
        supported.
    - id: DD-5
      subject: run-plan shape (the 2026-09-27 stall)
      ruling: >-
        The supervisor demands run identifiers inside the plan and the run paths
        inside the executing task's artifact_paths, while run identifiers must not
        be pre-reserved. These are reconciled by a two-stage shape. TASK-20260929-9c9f99
        (executor, zero scientific trials) implements the driver, an independent
        checker and the calculator, mints eight run identifiers at plan-authoring
        time with the allocator and origin-ref absence checks, and freezes the
        trial plan; its completion gate is the supervisor's own status command
        accepting the plan with the exact coverage counts. TASK-20260929-402d5b
        (reserved run card, authored by the Coordinator only after the plan is
        snapshot-archived) carries the execution binding, the run paths and
        maximum_runs 8. No RUN identifier appears in any record written today.
    - id: DD-6
      subject: plan schema
      ruling: >-
        The checkout's tools/experiment_execution.py accepts only
        crypto.autoresearch.trial_plan.v1. The dispatch asked for v2. The contract
        and the handoff bind "the string the committed tool accepts, read at the
        executor's HEAD" and require it to be recorded; v2 is not invented
        (FINDING-SCHEMA-V2).
    - id: DD-7
      subject: RQ-ECDLP-78dbc5 claim boundary
      ruling: >-
        RQ-ECDLP-78dbc5 admits toy computation and symbolic S T^2 models. The
        contract is exact exponent arithmetic on polynomial supports, generates no
        curve group and computes no discrete logarithm, so no scope decision beyond
        this one is needed. The question's decision_target that a super-constant
        claim name its non-generic structure and reconcile with KN-LIT-013 is met by
        the hypothesis statement (structure: summation-polynomial small-root
        decomposition; reconciliation: it is a non-generic algorithm and is compared
        against the generic line e = 1). Binding to GOAL-ECDLP-bbc21f is not made
        because that goal states that no exponent is targeted.

  protocol_completeness_check:
    result: COMPLETE, nothing null that the approval depends on.
    fields:
      objective: specification.objective
      inputs: definitions D1 to D7 and the trial_graph
      controls: K1, K2, K3a (gating), R-TOOL-repro, C-GEN, C-NULL, C-ELIM, C-BASE, C-INFO, K3b (non-gating)
      independent_variables: specification.independent_variables
      metrics: specification.metrics (primary and secondary)
      preregistered_prediction: PRED-1 to PRED-5 with source and PRIOR-DIRECTIONAL, written before any run
      scale_relevance: toy, with transfer assumptions HEUR-1 to HEUR-4 named
      seeds_and_replication: SHA256 streams frozen; two coefficient draws, two orders, second independent implementation, blind re-derivation in the run card
      budget: memory 8 GiB, runs 8, workers 1, advisory otherwise (docs/research-budget-policy.md)
      stopping_rules: four, including memory checkpointing as resource_exhaustion
      invalidation_rules: seven
      success_criterion: decidable from the verdict of decision_rules
      falsification_criterion: decidable from the verdict and the gating controls
      required_artifacts: seven implementation paths plus the per-run set
      write_scope: implementation directory, plan, runs directory
    rules_check:
      possible_negative_outcome: >-
        Yes: DEAD_IN_FAMILY and DEAD_AT_TESTED_T_ONLY falsify or fail to support
        the claim; VOID_CALIBRATION voids it. The Coordinator prior is DEAD with
        probability at least 0.97.
      codomain_naming: >-
        Every forced value, gate and criterion states the polynomial system, the
        convention, the order, the multiplicity and the exponent codomain in the
        same string (D5, D7, decision_rules, success_criterion). Where a value
        differs between conventions (e.g. 1/3 versus 2/3 at n = 2, d = 2) both are
        stated with their convention. No sentence switches codomain.
      proof_search_map: present and non-null in H-ECDLP-4b54a2, including baseline slice, observation collision, quantifier order, method ceiling and nearby-object controls, per KN-TECH-080.
      target_result_profile_check: >-
        Exponent-targeting (S T^2 exponent against the generic line), conditional
        on explicit numbered heuristics, pre-registered predictions with sources,
        honest costing (hidden_cofactor names the O(1/t) loss and LLL dimension),
        toy tier only. The scoped-closure outcome is the expected one, and is
        recorded as such rather than as a positive.

  rulings_on_the_idea_as_filed:
    kept: >-
      The demand derivation (I') and (III) (re-derived here by hand: eliminating G
      with G >= 0 and beta > (1 + 2G)/(2m - 1) gives eps_req_pre(m, w) with the
      optimum at G = 0, beta = 1/(2m - 1); the six table values check), the (3, 1)
      threshold kappa > 8/5, the nine-monomial support of the root block (expanded
      by hand: c^2 on y^2 and x3^2, -2c^2 - 2a on y x3, -2c on y^2 x3 and y x3^2,
      -2ac - 4b on y and x3, a^2 - 4bc constant, 1 on y^2 x3^2), and the
      baseline, nearby-object and null controls.
    changed:
      - >-
        The idea's Step 1 uses "prod X_i^{s_i} < p^{s_p}" with the committed
        tool's s_p. The contract computes both that and the Howgrave-Graham slack
        and lets calibration decide (DD-2). The idea's control "a calculator that
        puts m = 2 strictly below the generic line is suspect" is superseded: under
        HG the m = 2 slice reads 1/3 per equation against a demand of 2/3, which
        is a convention finding, not an instrument fault, and the contract says so.
      - >-
        The idea's prediction band kappa_joint in [1.50, 1.60] belongs to the tool
        convention; it is recorded as the generator's reading and PRIOR-DIRECTIONAL
        covers the Coordinator's.
    deferred: >-
      Steps 2 and 3 of the idea (planted-root LLL of the coupled system, yield
      enumeration, end-to-end toy run) become the conditional successor of DD-4.
    unread_or_unverified: >-
      The claim that the shift-set family attains the tool's 0.840814 or any other
      value has not been recomputed; nothing about the committed numbers is
      asserted beyond the hand derivations named above.

  review_routing:
    policy_mapping_fixed_now: >-
      The run card's evidence round is routed by the verdict class, fixed before
      any run so that it cannot be chosen after the fact: ALIVE_FINITE,
      ALIVE_EXTRAPOLATED (a claimed break) and DEAD_IN_FAMILY (a closure result)
      go to review-breakthrough at max effort, which cannot be degraded; VOID,
      NEAR_THRESHOLD and DEAD_AT_TESTED_T_ONLY go to review-adversarial. An
      unservable review-breakthrough leaves the claim un-promoted and the goal
      active; it is never downgraded.
    review_plan_requirements: >-
      The run card carries a review_plan written first with the Coordinator's
      prior (PRIOR-DIRECTIONAL), owned joints (the HG criterion and the exact
      determinants; the shift family and triangularity; the demand derivation; the
      extrapolation and verdict rules), a proves-too-much control naming the
      TOOL convention at n = 2, d = 1 (conclusion known false: reach 4/3 above the
      information bound; the argument must show the violation there and not under
      HG), and a blind re-derivation of (A, B, C_HG) for the joint system at
      t <= 3 from the statement of D3 alone, blind from driver.py, jsfamily.py and
      the run outputs.

