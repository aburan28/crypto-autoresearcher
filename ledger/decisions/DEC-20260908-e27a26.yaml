    - It does not treat an H3 miss as failed_infrastructure.
    - It does not treat an H3 miss as H1 closure.
    - It does not run the D=round(N^{1/2}) 10^4-walk KS.
    - It does not hunt a new cell.
    - It does not use a shared D that is not round(N^{1/2}) on each cell.
    - It does not permit re-running C1, C2, C3, the Stage 10 walk, the Stage 12 three-arm C4, Stage 13 fishing-1000, the Stage 14 D=20 KS, or the Stage 15 D=256 KS as a Stage 16 measurement.
