  findings_by_what_they_change_about_enactability:
    why_this_block_exists: >-
      THE RECORDED PRIOR SAID IN ADVANCE THAT THE COMPOSING COORDINATOR WOULD BE
      TEMPTED TO OVER-WEIGHT A MINOR FINDING TO MAKE THE ROUND LOOK PRODUCTIVE, and
      required each finding to be classified by what it changes about
