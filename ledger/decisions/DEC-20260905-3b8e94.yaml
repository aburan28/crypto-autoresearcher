  citation_boundary:
    status: >-
      RETAINED IN FULL, BOTH LIMBS, BY THIS DECISION AND BY NOTHING ELSE. NOT
      LIFTED, NOT NARROWED, NOT WIDENED. THIS IS THE FOURTH CONSECUTIVE ROUND IN
      WHICH THE LIFT WAS AVAILABLE AND WAS DECLINED.
    retained_verbatim: >-
      The `P=512` crossover value and its `w=2^80` sign are **NOT citation-eligible**.
      This task does not lift that prohibition. Only a committed Coordinator decision
      on independently reviewed evidence can lift it.
    predicate_extension_verbatim: >-
      In addition to the retained sentence, a row of any EXP-WESOVOW-001
      reconciliation is NOT citation-eligible when either (a) the two anchors disagree
      in the SIGN of the baseline comparison at that row, or (b) the smaller |margin|
      across the two anchors at that row is below that field size's anchor gap |Delta
      log2 T_full + Delta log2 M / 2|.
    why_not_lifted: >-
      REASONED FOR THIS ROUND, NOT INHERITED FROM THE PREVIOUS THREE. (a) NOTHING
      THIS ROUND PRODUCED BEARS ON EITHER LIMB. No crossover, anchor, margin, sign
      or speedup was measured, derived, recomputed or tabulated by anyone; no run
      record was read; cost_model.py was never executed. (b) THIS ROUND PRODUCES A
      NEW GROUND FOR RETENTION THAT DID NOT EXIST BEFORE: RT-2 establishes that the
      adopted monotonicity route is CONDITIONAL ON A > 0, which IS the per-row
      baseline-comparison sign the retained sentence governs, and that discharging
      that conditional into a statement about the contract's actual rows would
      require computing exactly the governed quantity. A lift would therefore be
      consumed immediately by an argument that is itself now known to be missing
      two premises. (c) EVERY PRIOR GROUND SURVIVES UNTOUCHED: the anchor is still
      recorded off_curve at three of five field sizes and nobody re-verified that
      status this round either; resolving power is still unestablished for the
      RECONCILIATION procedure (CF-7's remainder); the overhead c is still a free
      knob; and both runs still carry `dirty_tree: true` unattested (CF-9, and this
      decision dispatches it). (d) The red team RECOMMENDED no change to either
      limb and recorded that it has no evidence bearing on a lift; A RECOMMENDATION
      IS NOT A DECISION, and this decision adopts it on the grounds above.
    machine_flag: >-
