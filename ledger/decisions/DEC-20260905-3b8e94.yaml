      does not block); NOTHING.
    RT-1: >-
      BLOCKS. MATERIAL, AND IT IS THE ONLY BLOCKING FINDING OF THIS ROUND.
      clause_1's replacement_text_in_full does not parse when spliced over
      specification.yaml:39-40, so the draft cannot be applied mechanically as
      written and an enacting party would have to silently reflow `exact`
