  rationale:
    - >-
      THE NAMED PRECONDITION IS NOW SUPPLIED, AND SUPPLYING IT IS NOT APPROVING THE
      AMENDMENT. BATCH-752ef2 recorded in advance that running one reviewer left the
      RC-6 argument checked once and named a red-team pass on the draft as the
      precondition for approving it; DEC-20260905-5f5592 adopted that as the single
      next research action; this batch ran it. WHAT THAT BUYS IS EXACTLY ONE THING:
      the enactment path is no longer blocked on a missing review. It is now blocked
      on RT-1, which is smaller and concrete.
    - >-
      RT-1 IS MATERIAL AND IT CHANGES ENACTABILITY, AND THE CLAUSE THAT MATTERS
      MOST IS THE LAST ONE. The one clause carrying the actual repair is the one
      clause whose replacement text does not parse when spliced over
      specification.yaml:39-40. It was demonstrated mechanically, not by eye - the
      draft loaded with yaml.safe_load, the exact 584 bytes spliced, the result
      parsed, two distinct parse errors reported for the two candidate indentations
      - and it was INDEPENDENTLY RE-PERFORMED by the orchestrating session, which
      reports the same 9 content lines, the same 8 continuation lines, the same
      ParserError as drafted, and a well-formed 7-element metrics list after the
      two-space reflow. NOTHING ABOUT THE DEFECT, THE SCOPE, THE SATISFYING SET,
      THE WITNESS OR ANY CLAUSE'S SUBSTANCE IS OVERTURNED. But the amendment cannot
      be applied mechanically as drafted, AND THE CHECK THAT WOULD HAVE CAUGHT IT -
      parse the amended contract and report that experiment.metrics still has 7
      items with metrics[5] a single-key mapping - IS THE ONE CONTROL THIS
      AMENDMENT LACKS. An amendment that replaces text in a machine-readable
      contract has no control that the result still loads. That last sentence is
      the finding's real content and it generalizes to every future amendment of a
      YAML contract in this program.
    - >-
      R3 IS REFUTED, AND WHAT IT REFUTES IS A ROUTE THIS PROGRAM ADOPTED. C3's
      second clause entails C4 - re-derived by the red team from the file's own
      text and written down before it opened any report, which is the ONE place in
      this round where agreement is genuinely independent - so the package's `C3
      forces the same satisfying set independently of C4` is false as stated and
      invites a reader to count one source as two. DEC-20260905-5f5592 replaced
      that with the monotonicity route, and THAT ROUTE HAD BEEN CHECKED BY NOBODY.
      Checked, it returns CONTRADICTION on the satisfiable synthetic and on the
      degenerate witness - two objects of this batch's own proves-too-much control
      where the conclusion is KNOWN FALSE in advance. Repaired, it needs C3's
      second clause at w = M (which is C4 in disguise) and the omitted `capped by
      M` premise, after which its exclusion region {A > 0 and 2A <= log2 M} is a
      STRICT SUBSET of the producer's and R x {0} survives - verified rather than
      assumed. THE DECISION'S CONCLUSION HOLDS AND ITS STATED DERIVATION DOES NOT,
      and it is recorded that way. Note also that the route's antecedent A > 0 IS
      the prohibited baseline-comparison sign; the red team said instantiating it
      would require that quantity and correctly never evaluated it.
    - >-
      R2 CLOSED THE F-1 QUESTION BY EXERCISE RATHER THAN BY READING, WHICH IS THE
      GENERAL REMEDY CF-13 NAMES, APPLIED BY AN AGENT THAT DID NOT OWN THE FIX. 23
      patterns across three vocabularies, all 23 exercised through the module's own
      entry points, 22 fired, exactly ONE dead - AC-4 index 7 at
      amendment_controls.py:242, the already-known F-1, and the only pattern
      anywhere carrying an uppercase literal, with its non-redundancy checked
      rather than assumed. THE F-1 CLASS IS A CLASS OF ONE. New at R2 and not
      previously known: AC-1's pass region over a 144-shape sweep is exactly
      {alpha = 1, delta = 0}, which is precisely how AC-1's own input is
      constructed, SO ITS PASS IS ENTAILED BY ITS OWN CONSTRUCTION - while the
      package's own report answers `is_the_pass_entailed_by_its_own_construction`
      with `NO` and then demonstrates that the ENGINE discriminates, which is a
      different question. The same report answers the identical question for AC-2
      with an exemplary `PARTIALLY YES`. The two answers should have matched.
    - >-
      THE ROUND IS NOT PURELY RE-CONFIRMATION, AND IT IS ALSO NOT INDEPENDENT, AND
      THE HONEST SUMMARY IS A MIXED ONE. The red team wrote its own reading of
      lines 39-40 to an out-of-repository file (self-reported sha256 f9633878...)
      before opening the first report, reached the same satisfying set R x {0} with
      witness log2 M = 0 - and needs SCALE-FREENESS for that route, EXPLICITLY
      DECLINING to claim a premise-free derivation and expressly not repeating the
      first reviewer's stronger claim, having searched for such a route and failed
      to construct one. Eight of its findings were not raised by the first report.
      AGAINST THAT: its blindness was DELIBERATELY LIFTED, its agreement with F-1,
      F-3 and F-7 is anchored on the report it was given (sole exception: the
      C3-clause-2-entails-C4 entailment, which it wrote down first), and the round
      is SESSION-INDEPENDENT AND NOT MODEL-INDEPENDENT - one backend resolves, the
      adapter and the self-report agree at claude-opus-5 with `model_verified:
