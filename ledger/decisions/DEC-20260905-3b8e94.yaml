    RT-11: >-
      NOTHING ABOUT ENACTABILITY, AND EVERYTHING ABOUT HOW MUCH THIS ROUND IS
      WORTH. It is a property of the round: agreement on F-1, F-3 and F-7 is
      anchored on the first report. It is recorded as a LIMITATION of EV-SSI-1a95bc
