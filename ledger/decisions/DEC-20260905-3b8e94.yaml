    the_all_holds_question_answered_directly: >-
      THIS WAS NOT AN ALL-HOLDS ROUND WITH NO BLOCKING FINDING, SO THE
      PRE-COMMITMENT TO TREAT THAT OUTCOME AS COMPLETE WAS NOT PUT UNDER LOAD IN
