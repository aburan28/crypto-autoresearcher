  decision_scope: >
    SCOPED support: supports the existence half of M-B (prescribed
    construction) at n=6 at the tested scope at replicated strength. It does
    NOT support HEUR-1's construction-side count law (branch TENSION-REAL
    selected; the law stands unvalidated with a recorded scoped tension),
    says nothing at n=8 beyond a completed in-cap zero on the disclosed
    integer sub-lattice, and licenses no transfer beyond toy tier.
  context: >
    Coordinator composition of REVIEW-PLAN-BATCH-2f2b56 over the
    BATCH-e3cf55 v2 replication round of EXP-ECRANK-73275e (amendment
    sha256 6f61031861c9...847d, DEC-20260908-614199; snapshot commit
    796eed5fa06ac369f592175b55395d5853329dfa, parent
    9a8403c650c4192a91f40353712fb76338a64694). Three independent reviews
    returned under the plan: blind re-derivation TASK-20260909-9e06b1
    (verdict holds; derivation frozen at b8a0b94128bab02ea68cd8e0f5127f56b4ec6c7d
    before any producer read), validator TASK-20260909-868163 (J2 holds,
    10/10 PASS), red team TASK-20260909-b56824 (J3 breaks). The
    Coordinator's pre-recorded prior expected: blind derivation to match the
    five recorded instance entries; all 33 certificates to survive exact
    recheck; the R14 completed zero to stand with F3_n8 not firing; and the
    IV-1C [6,6,7,7,7,7,7,6] shortfalls to localize to the instrument
    boundary (60 committed good primes, all below the 1500 bound). Items
    1-3 confirmed; item 4 was OVERTURNED -- the red team's exact algebra
    plus a 400-prime enlargement shows the shortfalls are genuine
    dependencies (Q-rank 6 plateau at b_index 0, 1, 7; control tuple reaches
    7). A prior the review overturned in part; retained verbatim in the
    plan's coordinator_prior per the review architecture.
    PARALLEL-ROUND DISCOVERY AT COMPOSITION: main already carried a
    COMPLETED prior review round over the same execution -- BATCH-8fa16f
    (blind holds, validator holds, red-team scoped holds; composed as
    DEC-20260909-b61396 / EV-ECRANK-039664 / analysis-v2-review.md;
    decision support, bounded; statuses deliberately unchanged, that
    archive's write scope carrying no status file) -- whose ledger-side
    commits were ancestral to this branch when its review plan was frozen.
    The duplicate was missed at batch opening because the goal-head
    next_action text in the base was stale; it is recorded here as a
    coordination finding, and this composition reconciles the two rounds
    explicitly rather than ignoring either.
  target_ids:
  - EXP-ECRANK-73275e
  - H-ECRANK-36d8d7
  - GOAL-ECRANK-002
  - EV-ECRANK-d7e05f
  rationale:
    - >
      The replicate instruction of DEC-20260908-d361ab (N2) is discharged:
      fresh seeds, pre-registered dual-convention HEUR-1 reconciliation, and
      the amended controls all executed in-cap. R12 (seed 760906) found 33
      certified instances over the declared 10^4 b-tuples; certificates
      33/33 PASS; n_classes {3:33}; R13 replayed bit-identically (IV-2R).
      Every certificate was exactly recomputed by the validator from
      recorded instance fields, and five instance entries across three
      frozen (b,d) pairs (b_index 649, 1299, 4995) were blind re-derived
      from the mechanism statement alone -- frozen at b8a0b94128 BEFORE any
      producer read -- with exact agreement on every field (r vectors,
      r_heights, h_A/h_B, s, deg_s, memberships).
    - >
      The v1 detection-path gap (red-team J4a of BATCH-24d356) is closed at
      the planted scope: R10 recovered 9/9 planted ELLIPTIC n=6 instances
      (IV-3R(a)); the pre-registered upgrade clause lifts the R12/R14 count
      readings from lower bounds to MEASURED at the tested scope. Gates
      (b)/(c) failed as recorded and void only the planted-height
      calibration reading, exactly per the amendment clause.
    - >
      Why support at replicated strength lands the hypothesis at replicated
      and NOT supported: (i) the replication is same-machine and
      same-runtime (disclosed in every manifest) -- it tests seed
      sensitivity and determinism, not machine-dependent behavior, and the
      red team broke the machine-independent reading explicitly; (ii) the
      hypothesis bundles HEUR-1, whose construction-side count law this
      round measured with a scoped tension more than an order of magnitude
      below prediction (TENSION-REAL) -- unresolved; (iii) the n=8
      existence question is unresolved (completed in-cap zero on the
      disclosed integer sub-lattice; F3_n8 did not fire; the full rational
      lattice is unmeasured). A supported transition would first require
      N4/N5 resolution below. The scoped positive is recorded at claim
      tier toy; C1 stays OPEN and UNPROMOTED.
    - >
      RECONCILIATION WITH DEC-20260909-b61396 (prior round BATCH-8fa16f):
      that decision recorded bounded support and left every status
      unchanged, by its own declared write scope; its rationale itself
      describes the v2 round as "a replicated toy-scope existence and
      control observation relative to v1" and lists the unresolved items
      (same-machine limitation, failed calibration reading, HEUR-1
      tension, unmeasured rational lattice, limited certifier) as
      requiring a fresh additive protocol for BROADER readings. This
      decision makes the analyzed -> replicated transition because (i)
      the replicate instruction of DEC-20260908-d361ab N2 -- "fresh
      seeds, independent machine/runtime WHERE POSSIBLE" -- is
      discharged, the where-possible clause being unattainable and
      disclosed; (ii) this round's verification is strictly deeper at
      every joint (geometric blind re-derivation with five exact
      instance matches vs a gate truth table; 33/33 certificate
      recomputation vs three spot checks; independent re-hashing of the
      replay identity; exact IV-1C algebra under prime enlargement vs
      the preserved-but-untested instrument-boundary statement); and
      (iii) every unresolved item the prior round named is carried here
      as an explicit qualification blocking supported and defining
      N4-N6 -- nothing is absorbed. The two decisions conflict in no
      finding; both are immutable and a reviewer may compare them. The
      duplicate opening of two review batches for one execution is a
      coordination finding (adjudications.parallel_round_8fa16f),
      categorically not evidence about the science.
    - >
      N2R branch selection: TENSION-REAL. Convention A decade ratios [1.4,
      1.1785714285714286] (two-decade 1.65); convention B [1.2692307692307692,
      1.0] (two-decade 1.2692307692307692); the frozen exponent-+2
      prediction is x100 per decade. CONV-RESOLVED is excluded by the
      recorded data (both conventions far below); MIXED has no supporting
      pattern. This is NOT a large-scale refutation of HEUR-1: toy tier,
      H <= 10^4, count points of 20-33 instances, asymptotic regime
      unmeasured; F2_n6 did not fire from ratios alone. The tension is now
      a MEASURED dual-convention quantity with blind-verified arithmetic --
      and its resource_check reading is live: realized density orders of
      magnitude below a Schinzel-type prediction at small H is exactly the
      hypothesis of a strong local-obstruction / small-height scarcity
      reading, which N4 can decide.
    - >
      IV-1C adjudication UPDATE (supersedes the reading in
      DEC-20260908-d361ab rationale item 3 insofar as it attributed the n=8
      shortfalls wholly to the F_l prime bound): the graded
      CERTIFIER_LIMITED outcome stands as non-voiding exactly per the
      amendment text, but the red team's exact derivation shows the three
      shortfall tuples (b_index 0, 1, 7) plateau at certified total 6 for
      every l in {2,3,5,7,11,13} under a 400-prime enlargement while the
      control tuple reaches 7 -- genuine dependencies, Q-rank 6, NOT a
      prime-bound artifact. The ladder no-op itself remains an instrument
      fact (60 good primes all < 1500). The explicit second Q-relation
      vector is not exhibited (bounded search over budget; defective SNF
      kernel routine) -- the plateau is strong evidence, not the relation.
      Intersection with the M4 ceiling / EV-ECRANK-6695dc "ceilings 7 and 9
      attained exactly" reading is an open reconciliation item (N5), not
      asserted either way.
    - >
      R14 adjudication: the completed in-cap zero (1,503,696,145 < 2.0e9
      counted ops; found 0, feasible 0, near_miss_total 0) is a completed
      measurement on the disclosed integer (a,b) box -- neither evidence of
      absence on the full rational lattice (where HEUR-1 itself predicts
      H^1 abundance) nor evidence of nothing in the tested box. F3_n8 does
      not fire. The n=6 zero-control arm (R9 IV-1R PASS; degenerate conic
      rejection with nonzero x^2 coefficients) and the null arm (R15 IV-4R
      PASS; 0 solutions, no_real_root 64/64) behave as the amended contract
      requires. PD-V2-1 (attempt-1 check fix) satisfies IV-6; attempt 1
      preserved; no result re-scored.
    - >
      Validator integrity: 10/10 PASS including snapshot-receipt hash
      verification (62/62 content paths; commit/parent against git
      objects), verbatim N2R predicates matching the frozen source-v2
      lines, independent re-hashing of the R13/R12 identity, R10 clause and
      upgrade_clause text confirmation, R14 ledger verification, and
      manifest conformance (nested run schema, independence disclosure,
      recorded provenance). OBS-1 (run_v2.py modified mid-sequence;
      R9/R10/R11/R15-a1 pin pre-fix c0eb13a0, R12-R15-final pin 583b0b42)
      is a non-binding reproducibility caveat -- run_v2.py is not in
      bound_source_hashes.
    - >
      C1 stays OPEN and UNPROMOTED; IMP-2 (review-breakthrough at max,
      never degraded) still gates the C1-closure candidate of
      DEC-20260905-7adca0. No breakthrough, closure, or
      established-evidence contradiction is proposed by this batch, so no
      review-breakthrough gate is engaged. This decision changes one
      hypothesis status and promotes no claim beyond toy tier.
  adjudications:
    n2r_branch: >
      TENSION-REAL selected (see rationale). Recorded as the official
      branch selection under the pre-registered N2R branch logic of the
      v2 amendment; CONV-RESOLVED and MIXED rejected on the recorded data.
    iv1c_correction: >
      The v2 round's working interpretation (shortfalls as prime-set
      artifact) is CORRECTED by J3's exact algebra: genuine dependencies at
      three of eight d=(1..1) n=8 control tuples (Q-rank 6 plateau across
      all tested l under 400-prime enlargement). The graded
      CERTIFIER_LIMITED outcome remains non-voiding per the amendment text;
      the correction changes the interpretation, not the run statuses or
      the contract.
    f3_n8: >
      Does NOT fire: a completed in-cap zero with an empty near-miss ledger
      is not the recorded infeasibility pattern F3 names (validator
      confirmed against the amendment text). The n=8 question stays open
      with N5 as the concrete successor.
    parallel_round_8fa16f: >
      COORDINATION FINDING (not evidence, not a defect in either round's
      records): two review batches were opened over the BATCH-e3cf55
      execution -- BATCH-8fa16f by the coordinator-portfolio-20260908 lane
