      deeper joints plus the IV-1C correction. Every required_preservation
      item of BATCH-8fa16f is honoured in the composed records. Tooling
      feedback recorded: freeze-time duplicate-batch detection (a check of
      main's coordination tree for a review batch bound to the same
      snapshot receipt) is the fix; the immutable prior records are not
