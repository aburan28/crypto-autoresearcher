  rationale:
    - >-
      INDEPENDENT REDERIVATION WORKED EXACTLY AS DESIGNED: a genuinely
      blind-first second derivation (own construction reading, own
      1555-curve brute-force validation, comparison to the Red Team's
      report only afterward) confirmed one formula exactly and found a
      real, precisely-located, small error in the other -- a textbook
      demonstration of why this program requires independent rederivation
      before DETERMINISTIC-tier promotion rather than accepting one
      party's own self-validation, however extensive.
    - >-
      THE ERROR FOUND CHANGES NO CONCLUSION, WHICH IS ITSELF INFORMATIVE:
      cell 1 remains exactly degenerate (the error affects both curves
      identically); cell 2's corrected exact effect differs from the
      original by 5e-8, same sign, same magnitude order. This is the
      difference between "the derivation had an error" and "the
      conclusion was wrong" -- this record is careful to keep those
      distinct, per this lane's own standing discipline against either
      overclaiming or overcorrecting.
    - >-
      THE PANEL-CORROBORATION WITHDRAWAL IS ACCEPTED IN FULL, EVEN THOUGH
      IT REMOVES A FINDING THIS COORDINATOR HAD RECENTLY CITED: this is
      precisely why EV-MONO-9c760b hedged that finding as "provisional
      pending partition" rather than adopting it outright, and precisely
      why DEC-20260904-d79f75 named the clean re-analysis as a required
      next action rather than an optional one. A result that only holds
      before a known data-quality defect is removed is not evidence; the
      Executor's own independent reproduction of the contamination count
      (exact match to the Red Team's 64/100, 58-distinct figures, via its
      own rebuild of the archived construction code) makes this
      withdrawal solid, not merely plausible.
    - >-
      THE se_deviation ASYMMETRY'S PERSISTENCE ON THE CLEAN SUBSET IS
      ACCEPTED AS QUALITATIVE SUPPORT FOR THE #E[4]-EXPLANATION, DISTINCT
      FROM THE WITHDRAWN POOLED-RATIO CORROBORATION: these are different
      statistics on the same clean data: the pooled ratio's confidence
      interval no longer excludes 1 (no significant net direction), while
      the se_deviation split (comparing observed rates to Part B's own
      approximate closed form specifically) still shows the CM group
      running systematically higher than the ordinary group by a
      comparable margin post-decontamination -- consistent with a real
      but small systematic bias in the approximate closed form, exactly
      as the exact-formula explanation predicts, even though it is not
      independently significant as a pooled ratio at this sample size.
    - >-
      THE EXECUTOR'S HONEST DISCLOSURE OF AN UNRECONCILED NUMERICAL
      DISCREPANCY (unable to exactly reproduce the "-0.002/+0.293" figures
      despite trying several plausible variants) IS ACCEPTED AS GOOD
      PRACTICE, NOT AS A DEFECT IN THE TASK: per this lane's own standing
      discipline, an honest "I could not reconcile this" is preferred over
      a silently-massaged match, and it does not affect the qualitative
      persistence finding, which held under every variant tried.

  next_action: >-
    LOW PRIORITY, NOT URGENT: commission one more independent rederivation
    of the corrected group-uniform closed form (the rederiving Validator's
    own recommendation) before citing it at DETERMINISTIC tier; this
    Coordinator judges the remaining uncertainty (bounded at <=0.1%,
    already understood in cause and direction) does not warrant immediate
    dispatch given diminishing returns, and defers it to a future cycle or
    to whichever session next needs to cite the group-uniform formula
    formally. The TRANSVERSAL formula and the (N,tau,#E[4]) qualitative
    completion (endomorphism ring enters only via #E[4], bounded effect,
    opposite-signed from any measured "signal" in this chain) may be cited
    now at DETERMINISTIC tier via /curate-knowledge, scoped exactly as
    DEC-20260904-d79f75's own next_action (1) specified. This closes the
    H-MONO-1d50ac research cycle; RQ-MONO-001's backlog should be
    consulted for the next hypothesis to pursue in this lane.

