  claim_tier: mixed_deterministic_for_the_confirmed_transversal_formula_pending_one_more_check_for_group_uniform_toy_for_all_sampled_measurements
  scope_statement: >-
    Unchanged from DEC-20260904-d79f75; additionally, any future citation
    of RUN-MONO-cb905d-1's Part B panel as corroborating evidence must use
    the clean-subset figures (ratio 1.0096, CI [0.9824,1.0376], including
