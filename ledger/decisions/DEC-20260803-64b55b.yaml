coordinator_decision:
  id: DEC-20260803-64b55b
  goal_id: GOAL-MLKEM-003
  batch_id: BATCH-012
  recorded_by_task: TASK-20260803-00739e
  authorized_by: DEC-20260803-c7a1a3
  recorded_at: '2026-08-03'

  decision: weaken
  decision_label: >-
    Weaken ANOM-3 to unfalsified-and-unstable, decline to record it as a
    finding, and retire GOAL-MLKEM-003 as closed_at_budget with a named
    obstruction and a named successor.
  decision_vocabulary_note: >-
    `weaken` refers to this program's own ANOM-3 reading. It is not a statement
    about ML-KEM, whose security is untouched in either direction by this
    campaign.

  context: >-
    BATCH-012 was the last batch of a twelve-batch campaign extended by
    DEC-20260803-c7a1a3. It ran five reserve checks named by the BATCH-011
    reviews and left unrun (S1 Sage reference, S2 box widening, S3 null object,
    S4 extended decay, S5 per-attack c*), then took two independent reviews on
    snapshot 1cd863b1. The producer package is honest and arithmetically
    correct: 20 of 24 claims fully reproduced by the validator, all eight
    artifacts hash-identical across four independent locations, and the producer
    declined to draw the conclusion the campaign was positioned to want.

  coordinator_validity_check: >-
    Both reviews ran to completion in independent sessions and neither was shown
    the other's findings. The Coordinator authored no interpretive note during
    the review window -- the BATCH-011 process defect recorded in
    DEC-20260803-85adf8 is not repeated. Two Coordinator scouting results were
    put under contract as claims to CHECK rather than results to reproduce, and
    both turned out to be wrong (see coordinator_error_corrections).

  what_is_weakened:
    - >-
      ANOM-3's internal comparison -- that estimator.lwe_dual.matzov is cheaper
      than estimator.lwe_primal.primal_bdd by 0.543432 / 4.592472 / 8.387943
      bits under RC.MATZOV -- is recorded as MERELY UNFALSIFIED and demonstrably
      unstable. It is NOT recorded as a finding at any parameter set.
    - >-
      The three probes run against it (S2 box, S3 frame, S4 sample count) are
      recorded as non-corroborating: all three hold the LWE parameters fixed at
      the three Kyber sets, and none varies the parameter the quantity is a
      function of.
    - >-
      S2 specifically is recorded as structurally incapable of falsifying: its
      scanned beta bands lie entirely below both incumbents, neither of which
      was evaluated.

  what_is_not_weakened_and_is_explicitly_kept:
    - >-
      S1's instrument result stands and is the campaign's one durable asset. The
      Sage reference gap is CLOSED: passagemath-standard 10.8.7 was obtained
      where apt and sagemath-standard both failed, the shim was verified off
      sys.path from inside the interpreter, and the pinned estimator reproduces
      primal_bdd exactly and matzov to 0.0 / 3.9379e-09 / 0.0 bits. The validator
      re-derived all six values to floating-point equality. Archived sagemath
      10.9 primal_bdd values match the passagemath run exactly.
    - >-
      The callable-identity fact stands: estimator/lwe.py:13 binds the public
      LWE.dual_hybrid name to class MATZOV, while EV-MLKEM-015's
      reproduce_estimates.py imported the module-level dual_hybrid (class
      DualHybrid). It is a verified fact about the archive. It is NOT acted on
      here.
    - >-
      S4's two corrections to the BATCH-011 red team stand: Kyber-768 does flip,
      at delta ~19.67, and the earlier 2.3732 was linear interpolation rather
      than re-optimisation.
    - >-
      S5's per-attack discipline stands, and the CE-1 defect is not repeated.

  why_not_support: >-
    Because the quantity has no stable value. The red team's OBJ-1 swept n on
    the fixed Kyber shape and measured margins of -1.4213 / -0.7651 / +0.8232 /
    +3.0376 / +4.5925 / +7.0194 / +8.3879 / +13.0893 / +17.8816 bits at n =
    256/384/512/640/768/896/1024/1280/1536: monotone, roughly linear, no
    flattening, and changing SIGN between n=384 and n=512 -- inside ML-KEM's own
    family. Kyber's three sets are three samples from a function that crosses
    zero 60-130 dimensions below Kyber-512. Separately, OBJ-2 shows the two
    sides are not costed in one frame (the dual side receives free short vectors
    from GJ21.short_vectors and drops an admitted O() at lwe_dual.py:551; 99.94%
    of matzov's Kyber-768 cost is T_sample, so the machinery under dispute
    carries the modelling risk and 0.00093 bits of the cost), and OBJ-3 shows
    only the primal side is amplified to a success probability. An ordering
    claim between a truncated model and an untruncated one, at 0.5-bit
    resolution, is not supportable -- least of all at Kyber-512, whose entire
    margin is 0.543432 bits, smaller than the margin's own variation across one
    128-step in n.

  why_not_reject_scoped: >-
    The numbers are real and reproduce under two arithmetic backends and three
    independent sessions. Rejecting them outright would misstate what was found.
    The correct record is that a real, reproducible difference between two
    estimator functions at three points does not license the inference the
    campaign was drawing from it.

  goal_disposition:
    status_set: closed_at_budget
    status_rejected: completed
    budget: batch 12 of maximum_batches 12 under DEC-20260803-c7a1a3; exhausted.
    completion_criteria_assessment:
      - criterion: 1
        text_clause_at_issue: >-
          "calibrated by measured sieve behaviour at reduced dimensions"
        met: false
        reason: >-
          No sieve was ever measured by this campaign. G6K was blocked in
          BATCH-003 and BATCH-005 and never became available; every quantity
          produced in twelve batches is estimator arithmetic. The producer,
          both reviewers and every evidence record say so. This clause is
          unambiguous and unmet.
      - criterion: 2
        text_clause_at_issue: >-
          "Independent Validator and Red Team sessions admit the run package,
          verifying ... the absence of uncharged preprocessing, memory, oracle,
          or randomness assumptions"
        met: false
        reason: >-
          The red team verified the PRESENCE of exactly the class of assumption
          this clause requires to be absent: OBJ-2 (the dual side receives short
          vectors free under GJ21.short_vectors) and OBJ-3 (only the primal side
          is amplified to a success probability). Its verdict is
          `blocking_objections`, not an admission of the claim. The package is
          admitted as an artifact; the criterion asks for more than that.
      - criterion: 3
        met: true
        reason: >-
          Satisfied by this archive. It is procedural -- any archived batch
          satisfies it -- and cannot carry a completion on its own.
    rationale: >-
      tools/validate_ledger.py defines closed_at_budget as asserting that the
      budget ran out WITHOUT a completion criterion being met, making no success
      claim. That is exactly this campaign's position. `completed` would assert
      that an independently re-derived, measurement-calibrated, memory-charged
      estimate was produced. It was not, and recording otherwise would be a
      false success claim on the program's strongest available status.
    anti_understatement_check: >-
      AGENTS.md forbids retiring a goal that DID meet a criterion as
      closed_at_budget in order to dodge the closure quorum. That incentive does
      not exist here: the quorum is SUSPENDED under the current contract
      (GOAL_CLOSURE_QUORUM_REQUIRED = False), so closed_at_budget avoids nothing
      and costs nothing. The choice rests on the criteria alone. The campaign's
      substantive result -- the named obstruction -- is recorded at full weight
      in EV-MLKEM-af61e7 and in findings below, not diminished by the status.
    completion_quorum: >-
      Not applicable. closed_at_budget makes no success claim and requires no
      quorum, and the three-model quorum is suspended in any case. No
      attestation was sought and none is recorded. Recording an attestation not
      obtained is forbidden and none appears here.

  disagreement_with_reviewer_recorded:
    reviewer: RT-20260803-f55e34
    reviewer_position: >-
      "CLOSE, and close it as a completed goal rather than as a budget
      exhaustion", on the ground that docs/inventor-protocol.md section 4 is
      satisfied -- a named obstruction, an argument, and forward guidance, none
      of which is "we tried and got tired". Its next_concrete_action states
      explicitly: "do not retire the goal as closed_at_budget -- it met a
      declared criterion and understating it is its own contract violation."
    coordinator_position: >-
      I adopt the red team's substantive analysis in full and decline its status
      recommendation. Section 4 of the inventor protocol governs whether closure
      is PREMATURE; this closure is not premature and I record that it is not.
      What `completed` asserts in this ledger is narrower and different: that a
      declared completion criterion was met. Criterion 1 requires calibration by
      measured sieve behaviour, which never happened, and criterion 2 requires
      reviewers to verify the ABSENCE of uncharged assumptions, whose presence
      the red team itself established. Reading criterion 3 alone as sufficient
      would make every archived batch a completed goal.
    why_this_is_not_understatement: >-
      closed_at_budget understates nothing about the FINDINGS. The obstruction
      result is recorded as the campaign's principal output, the successor is
      named and endorsed, and premature closure is expressly disclaimed below.
      What the status declines to assert is that the goal's declared deliverable
      was produced. It was not.
    remaining_disagreement: >-
      Genuine and unresolved. A reader who holds that "met a declared criterion"
      should be read as "produced a result that meets the inventor protocol's
      closure standard" would reach `completed` on this same record. Both
      readings are preserved here rather than one being written out.

  findings_the_campaign_closes_on:
    named_obstruction: >-
      The campaign's instrument cannot answer the campaign's question. Every
      quantity it produces is a difference of two estimator outputs, one of
      which explicitly drops an unbounded O() (estimator/lwe_dual.py:551) on the
      term that sets its own block size, receives its short vectors free
      (GJ21.short_vectors, estimator/reduction.py:863), and is not amplified to
      a success probability while the other is. Neither function was intended to
      be differenced at 0.5-bit resolution. This is a method ceiling: it does
      not reach the headline under any tuning. It is a statement about the
      problem, not about the search.
    what_the_campaign_actually_produced:
      - >-
        A validated Sage-free estimator harness with an exact known-answer
        control, unblocking a campaign that had been blocked on tooling three
        times -- and, in this final batch, a real Sage reference that closes the
        control's own gap.
      - >-
        Three of this program's own findings corrected or withdrawn:
        KN-FIND-014's k_fft asymmetry shown to be an artifact of an unused loop
        index; EV-MLKEM-011's coverage statistic shown to be a counting-
        resolution artifact; EV-MLKEM-015's dual-versus-primal inference shown
        to name a different callable than the one its conclusion needs.
      - >-
        A demonstration that the apparent sub-NIST undercuts are artifacts of
        free-memory accounting, robust across every perturbation tried including
        an 18-case enumeration falsifier.
      - >-
        The obstruction above, which is the reason no thirteenth batch of the
        same kind is worth running.
    premature_closure_explicitly_disclaimed: >-
      docs/inventor-protocol.md treats declining to search because a target
      looks saturated as a failure mode symmetric with overclaiming. This
      closure is not that. The obstruction is named, argued from three
      independent checkable facts, and paired with a successor that is
      endorsed rather than gestured at. The four controls the red team named
      (CTRL-RT-1 through CTRL-RT-4) total under 30 minutes of compute and none
      can change the disposition: CTRL-RT-2 only reallocates the margin between
      two components that both sit on the truncated side, and CTRL-RT-4 is
      harness hygiene that should have existed in BATCH-008. They belong in the
      successor's setup, not in a thirteenth batch.

  coordinator_error_corrections:

    - id: CE-1
      title: >-
        I propagated a mislabelled delta into the immutable snapshot commit
        message 1cd863b1.
      raised_by: VAL-20260803-1a074b D-1
      what_i_wrote: >-
        Commit 1cd863b1 reads "matzov reproduces at 196.36624335005874 and
        262.3356800074737 against the shim's 196.366243354 and 262.3356800075 --
        deltas 3.94e-09 and 2.63e-11".
      why_it_is_wrong: >-
        196.366243354 and 262.3356800075 are ANCHOR_MATZOV's ROUNDED PUBLISHED
        values, not shim outputs, so the quoted deltas are Sage-versus-anchor,
        not Sage-versus-shim. True shim-versus-Sage deltas are 0.0 / 3.9379e-09
        / 0.0. I took results.json's `comparison_vs_shim.shim_anchor` at its
        field name instead of reading what it holds, and report.md stated it
        correctly all along.
      corrected_values: >-
        Kyber-512 0.0, Kyber-768 3.9379e-09, Kyber-1024 0.0; primal_bdd exact at
        all three.
      direction_of_the_error: >-
        Conservative. It UNDERSTATES the agreement, reporting a nonzero
        Kyber-1024 delta where the true delta is exactly zero. Unlike the
        BATCH-010 overclaim it does not flatter any conclusion of mine. It is
        recorded with the same weight regardless.

    - id: CE-2
      title: >-
        The same commit message asserts an unqualified artifact-tell clearance.
      raised_by: RT-20260803-f55e34 OBJ-6
      what_i_wrote: >-
        "S4 decays on all three parameter sets under full re-optimisation, so
        the inventor-protocol artifact tell is not triggered."
      why_it_is_wrong: >-
        report.md names the axis ("under N-inflation"); my commit message
        dropped it, turning an axis-scoped observation into a clearance of the
        package. The tell DOES fire on the n-sweep axis (OBJ-1) and NULL-2 points
        the same way on the frame axis. The red team records this as the only
        security-claim-shaped sentence it found across all five artifacts.
      corrected_statement: >-
        The N-inflation artifact tell is not triggered; the n-sweep tell FIRES,
        see RT-20260803-f55e34 OBJ-1.
      note: >-
        Same class as the BATCH-010 snapshot overclaim, smaller in size. Second
        occurrence of this specific failure -- a Coordinator commit message
        stating more than the artifact it archives.

    - id: CE-3
      title: >-
        My informal 1701-point box scan could not have contained either
        incumbent, and I nearly wrote it up as a result.
      raised_by: TASK-20260803-69f3cd S2; VAL-20260803-1a074b
      what_i_did: >-
        Before BATCH-012 I ran a 1701-point scan (beta +/-40 step 4, k_enum and
        k_fft 0-40 step 5) and obtained "+0.000000 bits improvement" at
        Kyber-768 and Kyber-1024.
      why_it_is_wrong: >-
        The k_fft range 0-40 excludes the incumbent k_fft of 60 (Kyber-768) and
        120 (Kyber-1024). The scan could not have found the optimum it claimed
        to confirm. Its null result was guaranteed by its coverage.
      what_prevented_the_error_from_entering_the_record: >-
        I put it into the BATCH-012 producer card as "a claim to CHECK, not a
        result to reproduce" rather than writing a Coordinator note, and the
        producer found the defect. Had I written the note, this would be a third
        unreviewed Coordinator claim in an immutable artifact. The BATCH-011
        corrective rule worked.

    - id: CE-4
      title: >-
        I reported Sage as unobtainable in this environment. It was obtainable.
      raised_by: TASK-20260803-69f3cd S1
      what_i_wrote: >-
        That there was no binary, no apt candidate, and a failing pip source
        build, and therefore that 196.3662433540 and 262.3356800075 would remain
        unverified against real Sage.
      why_it_is_wrong: >-
        All three negative findings reproduce and remain true, but they were not
        exhaustive: `pip install passagemath-standard` (binary wheels) works.
        The conclusion I drew from three failures was that the space was
        searched; it was not.
      what_prevented_the_error_from_entering_the_record: >-
        The same mechanism as CE-3 -- I put S1 under contract as an honest
        attempt rather than recording my own negative as a rule-5 result. The
        producer tried a fourth route.
      note: >-
        Twice in one batch my scouting was wrong in the direction that would
        have closed off work. That is the pattern the BATCH-011 reviews flagged
        and it is recorded here rather than left as a private lesson.

  correction_mechanism: >-
    Commits 1cd863b1 and its message are immutable and are NOT edited. CE-1 and
    CE-2 are corrected by supersession: this decision is the correction of
    record, in the same way DEC-20260803-85adf8 superseded the BATCH-011
    Coordinator note rather than editing it.

  process_defect_unreviewed_coordinator_note: >-
    None this batch. The BATCH-011 defect -- a Coordinator note authored while
    its reviewers were down, supplying both an answer and a verdict -- did not
    recur. The corrective rule adopted in DEC-20260803-85adf8 was followed: two
    Coordinator readings (CE-3, CE-4) were dispatched as questions in the
    producer card and both turned out to be wrong, and no interpretive note was
    authored during the review window. Nothing was forwarded between the two
    concurrent reviewers.

  other_coordinator_defects_recorded:
    - >-
      I recorded the snapshot receipt's own path_sha256 from its post-binding
      content rather than its content at the snapshot commit, and the
      dispatcher's verifier rejected the archive. Correctly. Fixed by rehashing
      all nine paths from the committed blobs. No record was published on the
      bad hash.

  explicit_non_claims:
    - No ML-KEM break. No attack on ML-KEM was implemented, run, or claimed.
    - >-
      No security proof, and no security claim in either direction. A raised or
      lowered estimate is neither.
    - >-
      No FIPS 203 parameter set is affected or cleared, and no NIST category
      claim is made.
    - >-
      ANOM-3 is not recorded as a finding, at any parameter set, on any
      evidence.
    - >-
      EV-MLKEM-015 is unchanged. Four independent reviews across two batches
      have judged its `inference` field mistaken about a different callable, and
      all four declined to act. Rule 12 is UNMET and UNWAIVED.
    - >-
      KN-OPEN-016's actual question is NOT closed by this decision and is not
      claimed to be answered by twelve batches of work.
    - >-
      certificate.kind: none. Nothing was solved, no relation was produced, and
      there is nothing for a run wrapper to re-verify.

  refutation_artifact_accounting: >-
    The refuting artifacts are RT-20260803-f55e34 (OBJ-1 n-sweep, OBJ-2 frame
    asymmetry, OBJ-3 success-probability asymmetry, OBJ-4 NULL-1 executed) and
    VAL-20260803-1a074b (D-6 the missing null, D-2/D-3/D-7 characterisation).
    All are archived at the paths declared in this batch's ledger receipt.

  official_status_changes:
    - record: GOAL-MLKEM-003
      from: active
      to: closed_at_budget
    - record: EV-MLKEM-af61e7
      from: null
      to: recorded
  official_status_changes_note: >-
    No other record changes status. Specifically unchanged: EV-MLKEM-011, 013,
    015, 017, 018, 019, 020, 021 and every KN-* entry.

  knowledge_promotion:
    promote: false
    promoted: []
    warranted: false
    not_warranted: >-
      The two promotions this campaign owes -- the KN-FIND-012 restatement and
      the KN-FIND-014 withdrawal -- are rule-12 routed and rule 12 is UNMET and
      UNWAIVED, so they cannot be executed here and remain OWED. A third
      candidate, a KN-TECH on callable-identity discipline, was proposed
      independently by both BATCH-011 reviewers and is now supported by a fourth
      batch of evidence; it is also rule-12 routed. Promoting the obstruction
      finding itself would be premature: it rests on one unreplicated n-sweep.
    carried_to: >-
      The successor goal below inherits all three as opening work, and inherits
      the rule-12 blocker with them.

  ranking_rationale: >-
    Closing beats a thirteenth batch because the three facts that block the
    conclusion are each checkable in minutes and none of them is a search
    failure. A further batch of the same kind produces a more precise number of
    the same unusable sort. Closing also beats leaving the goal active with the
    budget exhausted, which would misrepresent an ended campaign as a running
    one.

  limitations:
    - >-
      OBJ-1, the finding this closure turns on, is a single red-team computation
      reproduced by no second party. It was cheap (~4 minutes) and is stated
      precisely enough to check, but this decision rests on unreplicated work
      and says so.
    - >-
      The null object of the right shape was executed only by a reviewer as its
      own control, never by a contracted producer with an independent check.
    - >-
      Upstream sagemath 10.9 remains unobtainable; S1's reference is a
      redistribution.

  evidence_refs:
    - EV-MLKEM-af61e7
  evidence_ref_note: >-
    EV-MLKEM-af61e7 is the sole evidence record of BATCH-012 and carries the
    narrowest supported statement adopted verbatim from the red team.

  references_unchanged_by_this_decision:
    - EV-MLKEM-011
    - EV-MLKEM-013
    - EV-MLKEM-015
    - EV-MLKEM-017
    - EV-MLKEM-018
    - EV-MLKEM-019
    - EV-MLKEM-020
    - EV-MLKEM-021
    - KN-FIND-012
    - KN-FIND-014
    - KN-OPEN-016

  target_ids:
    - GOAL-MLKEM-003

  next_actions:
    - id: NA-1
      owner: user
      action: >-
        Decide whether to open the successor goal. It is NOT opened by this
        decision -- opening a new campaign is not within a closing decision's
        authority.
      successor_question: >-
        KN-OPEN-016's actual question: does the dual-sieve attack work as
        costed? Untouched by twelve batches, not closed by this decision, and
        not reachable through the estimator at all. It needs the score
        distribution of sieve-produced dual vectors MEASURED -- a different
        instrument and a different goal.
      first_two_setup_tasks: >-
        CTRL-RT-2 (reprice the dual side with short_vectors_simple to size how
        much of the margin the free-sieve accounting explains) and CTRL-RT-4
        (put a known-answer control on estimator.lwe_dual.matzov, the callable
        this campaign argued about for four batches and never covered). Both
        under 30 minutes; both are setup, not research.
    - id: NA-2
      owner: user
      action: >-
        Rule 12 remains the standing blocker. Two knowledge promotions and one
        KN-TECH proposal are OWED and cannot be executed until a
        `review-breakthrough` at policy `max` with `degradable: false` is
        available, which needs a second backend or a provisioned model.

  decided_by: coordinator
  decided_at: '2026-08-03'

  inference_provenance:
    requested_policy: coordinator-decision
    fallback_used: false
    note: >-
      Single-runtime session. Both reviews resolved under their own policies in
      independent sessions; see the review records for their inference blocks.
