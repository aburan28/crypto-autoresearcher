  disposition:
    outcome: revise
    approve_considered: >-
      REJECTED. The LP-2 reading admits no conditioned approval: "a
      discrepancy in (i), (ii), (iii) or (iv) makes this draft NOT approvable
      as written" (lines 642-644), and the readings "never license an approval
      with a changed rule, which would need a new draft" (lines 664-669).
      Approving with a condition that adds a reading for the checker path, or
      that restates (iv), would be exactly that. LP-1, strictly read, points
      the same way.
    route: >-
      A SUCCESSOR DRAFT THAT CLOSES THE CLASS, not launchcover option CD.
      - The LP-2 reading allows "a successor draft, route D or another"
        (lines 643-644). Option CD's verdict names it the declared route "if
        LP-2 (i)-(iv) fails" (lines 711-715). CD was weighed on its merits
        against the defect found and is NOT ADOPTED for it: CD re-measures the
        callgrind child on a log-visible SSF indicator; the defect is a
        reader of the child's cap read-back, which is not a function of
        msolve's clock seed. CD would add a third in-process replacement and
        still leave the checker path undeclared. Its other two triggers (a
        DV-17 STOP; a REG-1 callgrind-field difference coinciding with a CG-3
        indicator) are carried unchanged (consumercover option UB).
      - Adding one row for the checker (option UE) is rejected: it repeats the
        one-reader-per-act pattern (CORR-20260924-e78b7a cause).
      - Excluding the callgrind read-back from the manifest or the checker
        (option UC) is rejected: it changes frozen code and removes a
        machine-protection check right after a reader of it was found.
    dispatcher_observation_ruling: >-
      ADOPTED, and made the organising principle of the successor. The
      dispatching session observed that each of the last three acts found one
      more reader or launcher of solver-child fields, and asked whether the
      successor's pre-approval check should enumerate EVERY consumer of EVERY
      field of every solver-child record, generic collectors and checkers
      included, across all trees and every lineage's wrappers and checkers.
      Ruled:
      - YES for the three classified msolve sites, as a BAR (CU-2): every
        field of every S-1, S-2 and S-3 child record, and every value derived
        from one followed to a fixpoint, by eight access modes, across
        implementation/ (v1), -v2, -a1, -r1 and -r2, generated-code strings,
        and every repository tool under tools/, harness/ and orchestration/
        that reads a run package.
      - YES for every other child record (builder, gp, Sage, version probes,
        host scans), as INFORMATIONAL (CU-4), as CN-4 was. The exposure this
        lineage defends is msolve-specific (clock-seeded FGLM; SSF), and
        those launches were already ruled under CN-4 with disclosures (CG-9).
        A gating input among them that depends on the clock or an unseeded
        random state and is not already disclosed is recorded and ruled.
      - And the successor's dispositions are stated PER DERIVED VALUE
        (consumercover CC-2 V-1..V-6), so that a newly found reader of an
        already-disposed value is covered by construction and cannot by
        itself fail the draft. Only an UNCOVERED GATING reader bars. This is
        what turns "find the next reader" into "show there is no uncovered
        gating reader".
    successor_draft:
      id: AMD-EXP-GFPN-05ff43-20260924-consumercover
      path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_consumercover.yaml
      status: draft (approved_by null, approval_decision null)
      key_parameters: >-
        - It incorporates the launchcover text at c27ffe5c...f447 (and
          through it healthresolve at ccb55334...291a70d): CG-2, CG-3, CG-4,
          CG-5 (DV-17 unchanged), CG-6, CG-7, CG-9, the options, transfer
          assumptions, authorization and non_claims.
        - CC-1: every census.json field of S-1..S-3 and U-1..U-5 stated,
          including S-3's static command list and its argument-level actual
          set (fixture; cells with m = 4).
        - CC-2: consumer dispositions per derived value: the S-1 / S-2 class
          rule (alpha: reads the wrapper's returned result; beta: reads the
          recorded attempt's files; the frozen-body exception), and for S-3
          the values V-1..V-6 with rows K-1..K-5.
        - CC-3: a pre-declared reading of a frozen-checker failure on the
          callgrind child's read-back: an envelope outcome at S-3, handled by
          the frozen rules; a STOP in any gate package; never evidence; no
          change to wrapper, checker or exclusions.
        - CC-4: CG-3 also records whether the callgrind read-back equals the
          requested cap, and records an absent squarefree_degree as "absent".
        - CC-5: DV-11's static part checks the r3 layer's consumers against
          CC-2, and forbids r3 imports from -r1/ and v1.
        - CC-6: EIGHT bound hashes. CC-7: sequencing. CC-8: conditions from
          this decision.
        - Readings CU-5, CU-1 (strict, unstated = unequal), CU-2 (the consumer
          census; bars only on an uncovered gating consumer or an incomplete
          census) and CU-4 (informational).
      why_a_census_precedes_approval: >-
        Three Coordinator inventories of launch and read paths were each
        incomplete (CORR-20260924-5b83a1, CORR-20260924-432f43,
        CORR-20260924-e78b7a). A name search over a record's own keys cannot
        see generic collectors or derived values. The census is cheap (Python,
        no solver), its readings are fixed now, and it tests the one claim
        the successor cannot check by reading: that no gating consumer is
        uncovered.
