  rationale:
    - >-
      THE READINGS DID THEIR JOB AGAIN. A premise check fixed before it ran
      found, at zero solver cost, a gating reader the draft said did not
      exist. The alternative was to approve a disposition whose own premise
      was false and meet the checker path, undeclared, in a gate package.
    - >-
      THE CLASS, NOT THE INSTANCE. Three acts found one more reader or
      launcher each. Adding the checker as a fourth row would invite a fifth
      act. Disposing of derived values as classes, and censusing every access
      mode before approval, converts the open-ended search into one bounded,
      pre-declared check whose only bar is an uncovered gating reader.
    - >-
      THE CALLGRIND DISPOSITION IS KEPT. LP-2 (i), (ii), (iii), (v), (vi) and
      (vii) hold: the child runs only after an ok recorded attempt, its logs
      persist, the parse fields exist, and the 36-entry reference is clean.
      DV-17 is unchanged. Only the reader inventory was wrong.
    - >-
      FROZEN CODE STAYS FROZEN. The checker's cap check is correct machine
      protection; the successor gives it a pre-declared reading rather than a
      change, an exclusion or a tolerance.
    - >-
      THE BIAS IS TOWARD THE DECIDABLE QUESTION. Criterion C1's measured side
      and KN-OPEN-9b4a2b need the v2 ladder and the 31-bit rung. A
      protocol-coverage finding is not a reason to abandon them (AGENTS.md
      "Research-direction integrity"). The successor route is concrete: one
      zero-run census, then the approval act.
    - >-
      NO SECURITY READING. Toy EcGFp5-shaped arithmetic with known scalars;
      nothing transfers to p = 2^64 - 2^32 + 1.

