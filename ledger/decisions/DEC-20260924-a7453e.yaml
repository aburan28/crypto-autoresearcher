          minus the r1 exclusions, as r2_reg1.compare does (verified by this
          act, lines 150-184). RULED: A LITERAL DISCREPANCY with the statement
          (an r1 function other than r2_reg1.compare reads the record). It is
          a gating comparator only in the RETIRED r1 lineage, so it is
          immaterial to r3 execution if no r3 path imports it; the successor
          forbids that import (CC-5) and its census checks reachability.
