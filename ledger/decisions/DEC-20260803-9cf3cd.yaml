coordinator_decision:
  id: DEC-20260803-9cf3cd
  decided_at: '2026-08-03'
  decided_by: coordinator
  decision: inconclusive
  target_ids: [EXP-SMTH-71b1b0, RUN-SMTH-71b1b0-001, EV-SMTH-bea84b, H-SMTH-001]
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-038
  question_id: RQ-ECDLP-002
  supersedes_nothing: true

  summary: >-
    BATCH-038 performed the owed direct B-smoothness measurement, OPEN-BATCH023-A.
    The frozen predicate was met at both field sizes. THE RESULT IS RECORDED AS
    INCONCLUSIVE, because the Red Team's null-object control - not contained in
    the frozen contract - shows the identical predicate also passes on an
    OFF-CURVE factor base. The instrument does not discriminate the curve
    structure the hypothesis is about, so meeting the predicate carries no
    information about HEUR-DS-1.

  why_not_support: >-
    Three independent reasons, any one sufficient. (1) The null-object control:
    512 elements with x**3+a*x+b a quadratic non-residue, same p/a/b, same
    INT-1, same ENC-B, against this run's own committed null arrays, passes the
    whole predicate at both sizes. (2) H-SMTH-001.interpretation_limits states
    "A pass is `replicate`, never `support`". (3) ENC-B is a bijection onto
    exactly the null's support, so the test is an equidistribution test for
    (e1,e2) in F_p**2 and cannot see the Semaev structure. The frozen contract's
    own `SUPPORT_AT_TOY_SCALE` disposition label is NOT adopted; recorded as a
    contract defect in CORR-20260803-5fbba1.

  why_not_weakened_or_rejected: >-
    A non-discriminating instrument produces no evidence in EITHER direction. A
    degenerate control or a blind statistic is never negative mathematical
    evidence, exactly as a timeout is not. HEUR-DS-1 is untouched by this run.

  hypothesis_status_transition:
    hypothesis_id: H-SMTH-001
    from: specified
    to: analyzed
    rationale: >-
      The experiment ran to completion, was archived, and was independently
      reviewed twice. That is `analyzed`. It is NOT `replicated`, NOT
      `supported`, NOT `weakened`. The hypothesis remains open and untested in
      substance, because the instrument built to test it was shown not to
      discriminate.

  evidence_eligibility_gate_closed_here:
    issue: >-
      EXP-SMTH-71b1b0 carries `evidence_eligible: false`. DEC-20260803-155a86
      addressed only `execution_authorized` and left this standing. Raised by
      RT-20260803-51fb7d, which required it be closed before any EV-* record
      cites this run.
    ruling: >-
      CLOSED. EV-SMTH-bea84b may cite RUN-SMTH-71b1b0-001. The mechanism is the
      one RT-20260803-51fb7d ruled SUFFICIENT: an external committed decision
      may supply a STATUS or ELIGIBILITY fact about a frozen contract, and may
      NEVER supply a measured quantity, metric, threshold, control, criterion,
      budget or ceiling. `evidence_eligible` is an eligibility status, squarely
      inside that boundary. The contract is not edited.

  review_findings_adopted:
    - VAL-20260803-d2df58 terminal verdict `passed`; receipt admissible,
      supports no ECDLP claim and authorizes no promotion. Digest, budget,
      citability, metric conformance, null-before-treatment ordering and
      pre-flight ordering all verified by independent recomputation, including
      rebuilding validate_ledger's index and confirming RUN-SMTH-71b1b0-001 is
      in ctx.ids while RUN-IT-001-bounded-toy is not.
    - CTRL-ENCA-POWER ruled ADMISSIBLE-WITH-SCOPE-NOTE and found DEGENERATE by
      both reviewers independently. Binding scope note recorded in
      CORR-20260803-5fbba1 and in EV-SMTH-bea84b.boundaries.
    - OBS-RHO2-TRANSCRIPTION ruled ACCEPTABLE; both threshold values round to
      the frozen 0.006404 so the gate cannot move. The Coordinator's own
      mischaracterization of this in the b72b120a archive receipt is corrected
      in CORR-20260803-5fbba1.
    - Authorization under DEC-20260803-155a86 ruled SUFFICIENT by
      RT-20260803-51fb7d, with the boundary quoted above.
    - Supersession-receipt damage (CORR-20260803-a1c41e defect 2) confirmed to
      affect provenance only. The Red Team recomputed each frozen threshold
      from declared inputs - 1.63*sqrt(2/130816) = 0.0063734, max(0.05,
      1.63/sqrt(130816)) = 0.05, 100*rho(6)/rho(2) = 0.0064038 - so no threshold
      depends on the unverifiable digest.

  coordinator_conduct_ruled_on:
    in_place_repair_of_an_unparseable_record: >-
      ACCEPTABLE, narrowly, per RT-20260803-51fb7d, which verified the
      d1b6952c version genuinely raises ScannerError and that the diff is
      punctuation only. There was no parseable record to supersede.
    the_defect_the_coordinator_missed: >-
      The same false hygiene assertion sits in DEC-20260803-155a86, a committed
      decision that may not be edited. The Coordinator repaired the cheap
      instances and left the binding one. Remedied by CORR-20260803-a6420d.
    validator_disclosed_deviation: >-
      VAL-20260803-d2df58 re-executed the driver into session scratch OUTSIDE
      the repository, citing no datum, to exercise the reproducibility pointer
      rather than assert it, and disclosed it unprompted. RULING: NOT a breach.
      `maximum_runs: 1` binds evidence-producing contract-scale runs into the
      run package, not every invocation of the code by an independent reviewer
      writing outside the repository. Verification that re-executes is stronger
      than verification that reads, and disclosing it was correct. No datum from
      that reproduction enters any record.

  next_action: >-
    Open BATCH-039 with a DISCRIMINATION-FIRST successor contract. It must (1)
    include the off-curve null-object control as a BLOCKING control, so any
    instrument that cannot separate on-curve from off-curve fails before it
    reports anything; (2) replace the unweighted sup-norm with per-rung
    two-proportion tests, which RT-20260803-51fb7d measured as 6-30x sharper on
    the ALREADY COMMITTED arrays for zero new factorization; and (3) state a
    real power target at the rungs that matter, since KS2's tolerated ratio
    degrades to 6.45x at u=5 and 60.6x at u=6 - blind exactly where a Dickman
    early-abort accounting lives.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Nothing is promoted to the knowledge corpus. The measurement is a
      controlled null: the instrument was shown non-discriminating, so there is
      no established result about HEUR-DS-1 to promote. The methodological
      lesson - that ENC-B's bijection onto the null's support makes the test an
      equidistribution test blind to the curve structure - is a real finding,
      but it is single-run and reviewer-derived, and it belongs in a KN-FIND
      entry only after BATCH-039's discrimination control either reproduces it
      or supersedes it. Promoting it now would be promoting one unreplicated
      reviewer computation.

  claim_ceiling: >-
    TOY TIER. bits in {16,20}, |FB| = 512, m = 4, INT-1, ENC-B, one curve per
    field size, one seed, one host, one unreplicated run. No cost saving, no
    exponent, no early-abort accounting, no crypto-scale validity, no
    consequence for any deployed scheme. Neither a passing validator, nor a
    verified snapshot, nor a met predicate upgrades the strength or scope of
    this evidence.
