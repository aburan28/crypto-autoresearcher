  rationale:
    - >-
      v1_stage1_protocol reuses frozen
      Stage 0 cells S0-C13, S0-C17, S0-C19,
      S0-C37. Perturbations are P10, P01,
      P11. Digit convention is
      d(F)=((F-(F mod p))/p) mod p.
      Certificate kind none. Hard gate is
      fixture_pass (BASE-vs-BASE zero,
      n-1 sections, F scaling invariance
      on every arm). relative_sensitivity_pass
      is not a gate.
    - >-
      Canonicality cannot be certified by
      this protocol. IDEA-20260905-4dca34
      and H-ECDLP-e9d9bb A1 require an
      inconclusive comparison in that
      case. P-S1-DIGIT stays untested.
      The disclosed tightening is
      P-S1-RELATIVE.
    - >-
      Required fields are present:
      combining_rule, artifacts, stopping
      and invalidation rules, replication,
      budget, certificate kind none, and
      the tightening note. Completeness
      is not authorization. Stage 1 stays
      unauthorized.

