coordinator_decision:
  id: DEC-20261002-b5f912
  context: >-
    Design tick. IDEA-20260926-89886c is the first open ECC idea and is not
    designed. IDEA-20260915-3476de is next and is not designed.
    IDEA-20260926-c98e92 is the following open idea, and only the
    exchange-rate products are frozen.
  decision: approve
  target_ids:
    - IDEA-20260926-c98e92
    - H-ICPERF-16cf38
    - EXP-ICPERF-047c2d
  rationale:
    - >-
      DEC-20260926-901ea1 NA-4 says not to design the m = 3 pricing contract
      until NA-2's review returns. This session did not find that review.
      IDEA-20260926-89886c stays proposed and uncited by the hypothesis and
      the experiment.
    - >-
      IDEA-20260915-3476de stays undesigned. Its decisive Boolean-native arm
      needs BRiAl, which this session did not install. The closure of
      BATCH-a33cda in DEC-20260915-927eaa does not supply that engine.
    - >-
      Standing user authorization of 2026-09-06 covers approval of the
      product check. The contract names the matrix shape, the three cells,
      two routes, and a falsification criterion. It does not count a
      closure.
    - >-
      The products were computed in this session. That computation is not
      a run. The column product is 547185664, which is 2814336 below
      550000000. A Machin partial sum puts the circle constant strictly
      above 102400/32603, so the square root is strictly above 160. The
      written ratio 71/10 is below 28631/4009.
    - >-
      origin/main was already contained in this branch. origin/main was
      6a9d34f3b6f6ef0f502aa4b558ad2ff0cead20df. HEAD at the merge check
      was 6b977787838c07e3d52829075df4ed8bf2b2ddf3.
  evidence_refs:
    - ledger/proposals/IDEA-20260926-c98e92.yaml
    - ledger/decisions/DEC-20260926-901ea1.yaml
  limitations:
    - Approval authorises the arithmetic. It does not measure an exchange rate.
    - The two skipped ideas remain open. Neither is closed by this decision.
  next_actions:
    - Dispatch TASK-20261002-632fcb after the TASK-20261002-2241ae receipt verifies.
    - Re-check DEC-20260926-901ea1 NA-2 before designing IDEA-20260926-89886c.
  knowledge_promotion:
    promoted: []
    not_warranted: Unrun product contract. No finding to promote.
  decided_by: coordinator
  decided_at: '2026-10-02'
