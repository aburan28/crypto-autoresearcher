  ruling:
    - >-
      Leave original producer TASK-20261001-762c5f unreleased and its
      historical queue row nonterminal; leave TASK-20261001-e8b6f6
      incomplete with no snapshot receipt. Do not rerun the producer,
      backfill a claim/release, amend either old card, or alter any of
