    - >-
      Open a write-once 6-row BATCH-aa389e queue revision at
      coordination/goals/GOAL-SCURVE-48e06c/batches/BATCH-aa389e/dispatch_queue.custody-20261011.json.
      Preserve the four historical rows and their task definitions,
      except set original producer and original snapshot rows blocked
      with explicit integrity notes; keep their downstream validation
      rows blocked. Add Coordinator nonarchive TASK-20261011-e1f957 as
      queued with no dependencies and sole Ready task. Add Coordinator
      archive TASK-20261011-071e47 as queued, directly depending on
      e1f957 and naming it as its sole archive source. Every nonarchive
      row has exactly one archive owner; no historical task is projected
      completed. Validate this queue with research_dispatch.py
      --ready-only before any claim.
    - >-
      Write a same-batch lane-path addendum at
      coordination/goals/GOAL-SCURVE-48e06c/lanes/BATCH-aa389e.queue-revision-20261011.json.
      Bind the old lane and queue hashes and the new queue hash. The old
      .lane.json and queue remain immutable; use the new queue path
      explicitly for research_dispatch.py and goal_lanes.py. Claims
      share the batch's claims/ directory.
    - >-
      TASK-20261011-e1f957 is a zero-trial custody-verification producer.
      It independently inventories exactly the ten added paths in the
      source commit, compares blob IDs, SHA-256 and sizes to HEAD, checks
      four raw HTML hashes against source-binding.yaml, and writes only
      verification-report.json under its own new task directory. Its
      report explicitly records the absent old producer release,
      incomplete old snapshot and undeclared task.yaml. It does not
      certify C4, controls, safety or transfer. A real completed release
      for e1f957, with its report hash, is required before its archive.
    - >-
      TASK-20261011-071e47 is the only archive owner of e1f957. After
      that task's completed release, verify its one exact report file,
      land it durably if needed, and write a content-first snapshot
      receipt. Bind the report's source commit, SHA-256 and current bytes,
      plus its ten read-only source bindings; its own receipt commit
      changes only snapshot-receipt.json. The committed SCURVE verifier
      must pass after that commit. This does not complete old e8b6f6.
    - >-
      First archive this correction, decision, three new handoffs,
      queue revision, lane-path addendum and
      tools/verify_scurve_l5_content_first_custody.py as one eight-path
      packet under TASK-20261011-591ec0. Verify and push that packet,
      open or refresh a ready PR and stop. A later authorized coordinate
      turn may claim e1f957 and then 071e47 in order on the same branch.
    - >-
      No old producer completion or scientific claim is inferred. The
      existing validator TASK-20261001-efba92 remains blocked until a
      separate Coordinator ruling on producer completion and review
      dependencies after the custody receipt verifies.
  rationale:
    - >-
      A new nonarchive verification producer has a genuine, checkable
      deliverable and can earn its own completed release. That gives its
      archive a lawful direct dependency without falsely completing
      the old producer.
    - >-
      Content-first binding preserves the existing ten-path producer
      commit and records task.yaml as an undeclared extra. It avoids a
      cosmetic recommit of immutable files and keeps the missing old
      release visible.
    - >-
      The revised queue admits a procedural integrity task only.
      Independent scientific validation still needs a later reviewed
      route; file custody is not certificate acceptance.
