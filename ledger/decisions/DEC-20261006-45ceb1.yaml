  context: >-
    /design-experiment plus /propose-ideas, one cycle. IDEA-20261006-5b154f
    is on origin/design/ectd-e7ad98-conductor and is not on origin/main.
    The question is RQ-VOLC-f6253b. No hypothesis or experiment on
    origin/main cites that full id. The branch design/volc-5b154f was
    created from origin/main at
    c18e5cc0a77aaca439f92b4d796a0023ad926969 and the merge of
    origin/main was already up to date. The copied proposal bytes
    hash to blob e6c2b8b220b38071c451128e9edf256bb6c1f02b.

    The contract freezes the ten primes from 23 through 61 and level
    7. Success is the source idea's prediction that G is at least 1.
    The concrete negative is that the instrument checks pass and G is
    0. No j-line was factored in this session.

    This session opened KR-RHO-755e35, KR-RHO-0528e7, KR-RHO-13bf67,
    KR-RHO-53c89f, the vendored phi_j_7 table, and its parser. Those
    records are not a measurement of G. The model-from-j formula was
    checked to reproduce every residue j on every prime in the box.
    That check is not a value of G.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. Success fails
    when G is 0 under the stated instrument conditions, and it is also
    not confirmed when the polynomial pin fails.

    The same pass files three proposals and does not design them:
    IDEA-20261006-f71af5, IDEA-20261006-622d5a, and
    IDEA-20261006-4e7025.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - G=0, with the instrument checks passed, is reachable as a recorded outcome, so success is not automatic.
    - The polynomial pin, two-sided roots, distinct-root recount, supersingular exclusion, and the shared point count on the first scored edge are the instrument controls.
    - An instrument failure is not relabeled as G=0, and a supersingular gap is not added into G.
    - This session did not factor a j-line and did not claim that an exponent moves.

  evidence_refs: []
  limitations:
    - The measurement covers ten primes at most 61. It does not transfer to a larger field.
    - A nonzero G does not lower the generic exponent 1/2 and does not recover a discrete logarithm.
    - A polynomial-pin failure, a j-model mismatch, and unequal point counts on a scored edge are not the negative.
    - An instrument failure is not a value of G.
    - A timeout is failed_infrastructure and is not a mathematical negative.
    - The level-11 count on three primes is recorded beside G and does not choose the reading row.
    - This decision authorizes a later execution. It does not start one.
    - This decision does not edit a goal head.
    - The three new proposals are not hypotheses and are not approved experiments.

