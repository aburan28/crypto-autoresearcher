# =============================================================================
# DEC-20261005-8d23bb -- MEMORY-FLOOR REVISION for the GOAL-DREG-001 item C1
# retry (n=15 completion-criterion rung, D=6): the lane-contract budget's
# memory_gb floor rises from 8 to 16 GiB, and the retry is carded as the
# fresh lane-contract task TASK-20261005-821d86. This is option (a) of the
# three options DEC-20260828-653923 named after item C1's execution came back
# wholly failed_infrastructure: "(a) retry C1 with a materially higher memory
# floor under a fresh lane-contract task".
#
# THE MEASUREMENT THAT DECIDES. The n=15 executor (TASK-20260828-955d56)
# measured prepare-phase peak RSS 11.73 GiB (seed arm) and 12.22 GiB (null
# arm) before the rank-loop kernel was ever invoked -- 46.6% / 52.75% above
# the lane contract's memory_gb: 8 floor (GOAL-DREG-001 goal head,
# TASK-20260827-765027 lane-contract.yaml line 103, which itself warned the
# n=12-derived floor was "a floor, not a ceiling guaranteed sufficient"). All
# 6 required (seed, arm) runs are failed_infrastructure / resource_exhaustion;
# 0 of 6 reached validity=completed_valid. No rank was obtained at n=15.
# This is machine protection working as designed, never negative evidence
# against H-DREG-001 (AGENTS.md rules 3 and 5; DEC-20260828-653923).
#
# WHAT THIS DECISION IS NOT. It does not weaken the evidence bar (item C1's
# full-column-rank / Hilbert-function / q-to-s collapse admissibility rules are
# unchanged), does not rescore the quarantined n=12 raw 17947 headline, and
# does not touch the n=18 rung or the semi-regular null control. It sizes a
# budget so the already-designed measurement can actually run.
# =============================================================================
coordinator_decision:
