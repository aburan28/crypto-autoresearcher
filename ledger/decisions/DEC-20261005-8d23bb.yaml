  archived_by: TASK-20261005-821d86
  archived_by_note: >-
    Effective when TASK-20261005-821d86's final ledger archive commits this
    decision and its receipt verifies. The card is WRITTEN, NOT DISPATCHED;
    dispatch additionally waits on the C-7 machine-quiet gate like every
    memory-heavy lane on this host.
  goal_id: GOAL-DREG-001
  question_ids: [RQ-DREG-001]
  mode: protocol_amendment
  base_checked: cd8f6d7c28
  base_sync: >-
    git fetch origin; authored on a sparse worktree branched from origin/main
    at cd8f6d7c28 (ledger/, coordination/, tools/ checked out).
  standing_authorization:
    - DEC-20260906 standing user authorization (budgets are advisory; machine
      protection limits remain binding and are sized to protect the host).
  decision: amend_budget
  decision_label: >-
    RE-FLOOR ITEM C1. The n=15 lane contract's machine-protection memory floor
    rises 8 -> 16 GiB (2x the largest measured prepare-phase RSS 12.22 GiB,
    headroom for the rank-loop kernel that never ran), and the retry is carded
    as TASK-20261005-821d86 with every scientific constraint of the original
    lane contract inherited verbatim.
  target_ids:
    - GOAL-DREG-001
    - TASK-20260827-765027
    - TASK-20260828-955d56
    - TASK-20261005-821d86
  budget_revision:
    field: lane_contract.exact_budget.memory_gb
    prior_value: 8
    new_value: 16
    basis: >-
      Measured, not estimated: prepare-phase peak RSS 11.73 GiB (seed) /
      12.22 GiB (null) at n=15, seed 2026, from TASK-20260828-955d56's run
      manifests; the rank-loop kernel was never reached, so its RSS is
      unmeasured. 16 GiB gives ~31% headroom over the largest measured phase
      and is single-worker (the retry's own watchdog caps RSS at 16 GiB and
      checkpoints rather than OOMs, per the lane contract's escalation rule).
    other_fields: >-
      wall_clock_seconds_per_turn 3300, per_invocation_cap_seconds 300, and
      wall_clock_floor_total_seconds 13789.26 are inherited unchanged from
      TASK-20260827-765027's lane contract; the n=12-derived floor stays a
      floor.
  rationale:
    - >-
      THE RUNG IS LOAD-BEARING. Item C1 is the n=15 completion-criterion
      rung of GOAL-DREG-001's on-lattice d_reg ladder (n in {12, 15, 18}),
      the boolean-Semaev degree-of-regularity axis that feeds the Semaev/
      Groebner cost picture the index-calculus program prices. It is blocked
      only by a budget that the first execution proved too small.
    - >-
      THE MEASUREMENT, NOT THE PROTOCOL, FAILED. All 6 runs failed before the
      rank loop; 0 reached completed_valid. The admissibility rules
      (full-column exact ranks, graded pivot-degree Hilbert function, q-to-s
      collapse; subset-column corokes are artifacts, h012 finding iv) are
      inherited, not relaxed.
    - >-
      MACHINE PROTECTION IS SIZED, NOT RATIONED. 16 GiB single-worker on this
      48 GiB host is headroom, not extravagance; the retry still waits on the
      C-7 machine-quiet gate like every memory-heavy lane.
  limitations:
    - >-
      This decision authorizes a retry, not a result. A second
      failed_infrastructure outcome (e.g. the rank loop's own RSS exceeding 16
      GiB) is again machine protection, never evidence against H-DREG-001,
      and returns to the Coordinator for the next re-floor or a rung change.
    - >-
      H-DREG-001 stays `inconclusive` (DEC-20260717-002) until the ladder's
      committed decision on the merits; nothing here moves it.
  evidence_refs:
    - ledger/goals/GOAL-DREG-001.yaml
    - coordination/goals/GOAL-DREG-001/batches/BATCH-006/tasks/TASK-20260827-765027/lane-contract.yaml
    - ledger/decisions/DEC-20260828-653923.yaml
  next_actions:
