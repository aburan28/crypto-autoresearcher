coordinator_decision:
  id: DEC-20260731-021
  context: >-
    GOAL-FAEST-001 BATCH-001 expansion (campaign open): expand the RQ-FAEST-001
    idea pool with three new proposals targeting the lanes BATCH-001 left
    undeveloped. TASK-20260731-007 produced IDEA-20260731-004..006 plus an
    expansion ideation report under verified snapshot 0e6befda (parent
    eb2a5abb, exactly five declared paths, all four SHA-256s verified).
    Independent red-team TASK-20260731-009 (review-adversarial,
    independent_session: true, resolved model
    opencode/deepseek-v4-flash-free) returned ADMIT on all three ideas with
    zero fatal objections and eleven nonfatal objections (OBJ-4-1..4,
    OBJ-5-1..3, OBJ-6-1..4). Evidence EV-FAEST-002.
  decision: admit_ideation_to_experiment_design
  target_ids:
    - IDEA-20260731-004
    - IDEA-20260731-005
    - IDEA-20260731-006
    - GOAL-FAEST-001
    - RQ-FAEST-001
    - TASK-20260731-007
    - TASK-20260731-009
    - EV-FAEST-002
  rationale:
    - >-
      All three expansion IDEA records are schema-complete, name an exact
      attack object (never 'attack FAEST'), carry the matched AES-128 baseline
      (2^126.1 biclique; Grover 2^64 for the quantum side of IDEA-004 and -006)
      under one cost convention, and include falsification conditions with
      deployed-parameter re-derivation gates and toy-tier labeling per AGENTS.md
      rule 7. Independent review passed all six checks with no fatal objection.
    - >-
      The expansion closes exactly the undeveloped lanes declared in
      EV-FAEST-001: the QROM extractor-loss link (IDEA-004), the algebraic
      constraint-system link under partial openings (IDEA-005), and the
      Even-Mansour OWF baseline that the 001..003 records had explicitly left
      unestablished (IDEA-006). The RQ-FAEST-001 target list is now covered
      by admitted proposals.
    - >-
      The eleven nonfatal objections are accepted as scope refinements for the
      BATCH-002 design contracts. The most consequential: the QROM
      reconstruction must charge the quantum-grinding term (Grover-on-salt
      ~2^{kappa/2} vs classical 2^kappa) explicitly (OBJ-4-1); the algebraic
      barrier's confirmation side is near-vacuous so the design must carry the
      falsification-direction content and the per-S-box scale control
      (OBJ-5-1); the EM baseline sits at exactly 2^n with zero slack and the
      design should probe the toy P's ANF degree / differential profile rather
      than rely on the inversion-cost ratio (OBJ-6-1, OBJ-6-2).
    - >-
      Independence was achieved: the review ran in a separate session with an
      independent_session_required handoff and no shared lineage with the
      producer; receipt validity, mathematical interpretation, baseline
      comparison, novelty, falsifiability/controls, and Pareto honesty were
      treated as separate checks.
    - >-
      No hypothesis, experiment, run, or certificate was created in the
      expansion; this decision admits proposals to experiment design only. No
      claim about FAEST's deployed security is made or implied.
  evidence_refs:
    - EV-FAEST-002
    - ledger/proposals/IDEA-20260731-004.yaml
    - ledger/proposals/IDEA-20260731-005.yaml
    - ledger/proposals/IDEA-20260731-006.yaml
    - coordination/goals/GOAL-FAEST-001/batches/BATCH-001/archives/TASK-20260731-008/snapshot-receipt.json
    - coordination/goals/GOAL-FAEST-001/batches/BATCH-001/tasks/TASK-20260731-007/ideation_report_expansion.md
    - coordination/goals/GOAL-FAEST-001/batches/BATCH-001/tasks/TASK-20260731-009/review_report.yaml
    - coordination/goals/GOAL-FAEST-001/batches/BATCH-001/tasks/TASK-20260731-009/objections.md
    - ledger/decisions/DEC-20260731-020.yaml
    - ledger/evidence/EV-FAEST-001.yaml
  limitations:
    - The admitted ideas are measurement/barrier lanes, not attack mechanisms; none claims a breakthrough.
    - All deployed-parameter statements are placeholders until the spec PDF-text blocker (RSF-5) is resolved.
    - The one-pair OWF data-budget caveat (RSF-1) must be carried into every matched-baseline block before any barrier wording is used.
    - Toy-scale falsification, if it fires, is toy-tier until re-derived at deployed parameters.
    - IDEA-20260731-004's reconstruction depends on filing and reading the 2026 Renyi-divergence retightening work (unfiled); IDEA-20260731-005/006 depend on pinning the constraint family / OWF definition from spec v2.0 or faest-ref.
  next_actions:
    - >-
      Open BATCH-002 as a single design gate (unchanged from DEC-20260731-020):
      resolve RSF-5 by extracting or pinning the deployed parameters (exact
      consistency-check equation, degree, (kappa, tau), field, LeafCommit/bAVC
      modes, and the faest_em_* OWF definition) from spec v2.0 section-security
      text / eprint 2023/996 full text, or by adopting a pinned faest-ref
      commit as ground truth; apply RSF-1..5 and the eleven OBJ-4..6-*
      refinements to the six admitted IDEA records; then design experiment
      contracts for the highest-priority ideas (IDEA-20260731-019, -002, -004,
      or -006, per re-derivation outcome). Do not exceed the remaining five
      batches of the campaign budget.
  hypothesis_status_record:
    note: >-
      No H-FAEST-* hypothesis file was created. The six IDEA records
      (20260731-001..006) remain at proposal stage until BATCH-002 designs and
      approves frozen experiment contracts. GOAL-FAEST-001 remains active; no
      completion criterion is met.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No technique or finding promotion is warranted from the expansion: the
      ideas are proposals and no result was established.
  decided_by: coordinator
  decided_at: '2026-07-31'
