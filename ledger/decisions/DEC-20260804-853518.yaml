  context: >-
    BATCH-076 extended H-PSEUDO measurement to p=4001 and p=9001. C grows slowly:
    p=1009→3.0, p=4001→3.5, p=9001→3.7. Possible O(log p) growth.

  decision: update_hpseudo_revise_constant
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    H-PSEUDO-83817b requires revision: the constant C may be O(log p) rather than O(1).
    The weaker form (C = O(log p)) is still empirically supported and still implies
    Semaev yield ≤ heuristic + negligible error at crypto scale.

    H-PSEUDO-83817b revised from "C = universal constant" to "C = O(log p) at toy scale."
    This is a weakened but still interesting statement.

    The yield implications are unchanged: even with C = O(log p), the Semaev yield
    bound holds for practical purposes.

    GOAL-ECDLP-001 stays active.

  exact_next_action: >-
    BATCH-077: Measure C at p=50021 (bits≈16) to distinguish O(1) from O(log p).
    If C≈4.0 at p=50021: consistent with O(log p) (log(50021)/log(9001)≈1.16 × 3.7≈4.3).
    If C≈3.7 at p=50021: C is approaching a constant (O(1)).
    This 1-2 extra data point would resolve the O(1) vs O(log p) question.

