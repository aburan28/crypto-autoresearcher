    reason: Durable matched-cost finding on Kyber dual vs primal under MATZOV costing
      and the non-reproduction of Carrier/MATZOV-2022 dual headlines by the public
      lattice-estimator instrument.
    knowledge_id: KN-FIND-015
    promote: true
