  rationale: 'RUN-MLKEM-015-001 supports all four H-MLKEM-014 conjuncts under pinned
    MATZOV / ADPS16 instruments: dual_hybrid does not beat primal_bdd; published Carrier
    and MATZOV-2022 dual headlines undercut the public dual instrument by 4–16 bits;
    primal_bdd under MATZOV still sits below NIST classical cutoffs on every Kyber
    set; core-SVP control matches Kyber.py. That is a real narrowing of KN-OPEN-016,
    but it is not a target-class break of ML-KEM and it does not settle Carrier''s
    polar-decoding repair. The correct next move is refine: promote the scoped finding,
    then design EXP-MLKEM-010 to either re-derive Carrier Table 5.1 / App. C costs
    from primary text or falsify the polar-decoder heuristic at dimensions where prediction
    is checkable — whichever is feasible under network/source constraints.'
