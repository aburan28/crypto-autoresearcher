coordinator_decision:
  id: DEC-20260814-404d63
  recorded_at: '2026-08-14'

  decision: expand
  decision_label: program_wide_campaign_batch_cap_removed_by_user_authorization

  context: >-
    This session (2026-08-14), while resuming the research harness on branch
    claude/dreg-linear-law, the coordinator found that origin/main had advanced
    with DEC-20260812-f30c6e / BUDGET-AMEND-20260812-001, a user-authorized
    program-wide amendment raising campaign_budget.maximum_batches by EXACTLY ONE
    (+1) on every active goal with a finite cap. Concurrently the local working
    tree carried an uncommitted, un-spanned attempt at a mass uncap: roughly
    fifty-seven goal records setting maximum_batches to null with no single
    Coordinator decision authorizing it. The coordinator flagged that un-spanned
    mass as an integrity concern and asked the user how to resolve the
    null-versus-plus-one divergence. The user's explicit instruction was "all
    should be set to null." That instruction is the sole authorizing basis for
    this record. It is the "separate decision, on explicit user authorization"
    that ledger/goals/GOAL-ECDLP-001/goal.yaml's own BUDGET-AMEND entries state
    THE COORDINATOR DOES NOT SELF-GRANT; this record is that authorization, made
    explicit and cited rather than assumed. THIS SUPERSEDES DEC-20260812-f30c6e,
    whose +1 result is itself superseded and now recorded as the prior_value
    column below. Neither decision is retroactively rewritten; this record is
    the new operative state.

  user_authorization: >-
    RECORDED BY THE COORDINATOR, NOT A SELF-GRANT. The user directly instructed,
    this session, that all campaign_budget.maximum_batches be set to null. The
    basis offered to the user named, by reference, that origin/main already held a
    narrower user-authorized amendment (DEC-20260812-f30c6e, +1 per active
    finite-cap goal, including GOAL-DREG-001, GOAL-ARGON-001, GOAL-ECTD-001,
    GOAL-ECDLP-001, GOAL-MCE-001 and ten others) and that the local un-spanned
    "56 edits" were the null state. The user chose the null state for every goal.
    That choice, and only that choice, authorizes the acts below.

  decision_scope: >-
    STRICTLY campaign_budget.maximum_batches, set to null (the schema's own
    unbounded representation; templates/research-records.md "Persistent research
    goal"), on every goal record in ledger/goals/. No other campaign_budget field
    moves: total_wall_clock_seconds, max_concurrent, and accounting_basis are
    unchanged on every goal. No claim_tier_ceiling, completion_criteria,
    pause_conditions, objective_and_scope, active_hypothesis_ids, or hypothesis
    status moves on any goal. No batch is opened by this decision, no run is
    authorized, and no Executor task is dispatched by this decision. NO GOAL
    STATUS CHANGES: draft, active, completed, closed_at_budget, and paused goals
    keep their exact status. Setting a null cap on a non-active goal does not
    reactivate it; a closed_at_budget goal (GOAL-MLKEM-001/003/004, GOAL-P13-001,
    GOAL-FIND-001, GOAL-ICLIFT-001, GOAL-XEDN-001/002/003) stays closed because
    that status is a field this decision does not touch, not because its cap
    still binds. Reactivating any of those requires its own explicit decision.

  supersedes:
     - DEC-20260812-f30c6e
     - BUDGET-AMEND-20260812-001
  supersedion_basis: >-
    DEC-20260812-f30c6e set maximum_batches to a finite +1 value (e.g. ECDLP 50
    -> 51, ECTD 8 -> 9). This record sets the same fields to null. null strictly
    dominates the +1 result: any batch count that +1 admitted is admitted by null,
    and more. The +1 decision records and its per-goal amendment records
    (maximum_batches_amendment_20260812, BUDGET-AMEND-20260812-001) remain
    present and immutable as the history that produced the finite state that this
    record replaces; they are not deleted or edited. A null ceiling makes a
    further "+1" amendment a no-op with no operative content, so no successor
    amendment record is minted for the goals that DEC-20260812-f30c6e already
    amended.

  acts_performed:
     - kind: bulk_uncap_all_goals
       field: campaign_budget.maximum_batches
       from: finite (per goal; values and their +1 successors as recorded in
         DEC-20260812-f30c6e and the working tree)
       to: null
       record: this decision
       projection: uniform replacement of the maximum_batches field value with
         null on every ledger/goals/ record whose value is not already null
     - kind: conflict_resolution_of_merge
       note: >-
         Merging origin/main into claude/dreg-linear-law conflicts on the
         maximum_batches field of GOAL-ARGON-001, GOAL-ECTD-001, and
         GOAL-ECDLP-001/goal.yaml precisely because main carries the finite +1
         state and the local tree carries the null state. Per AGENTS.md the
         conflict is NOT resolved by picking one side and editing the field
         in place; it is resolved by this superseding decision, and the merge
         resolution takes the null (authoritative) value on exactly those three
         fields while main's other 85 commits merge unchanged.

  already_null_no_action:
     - >-
       Goals already at null prior to this act carry no operative change:
       GOAL-AES-003, GOAL-ARGON-001, GOAL-HQC-001, GOAL-ICEX-001,
       GOAL-MLKEM-005, GOAL-P13-001, GOAL-SDEG-001, GOAL-SIG-001,
       GOAL-ENDO-001, GOAL-SSI-001, GOAL-SSIQ-001, and the goal heads already
       projected to null by prior amendments. They are listed for completeness;
       the projection is a no-op on them.

