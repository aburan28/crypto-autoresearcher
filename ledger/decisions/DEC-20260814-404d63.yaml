  note_target_columns: >-
    Parenthetical values record the pre-amendment cap, the DEC-20260812-f30c6e
    +1 successor where that goal was in its target list, and the goal status so
    the uncap can be audited without reopening each record. The operative act is
    uniform: maximum_batches := null. Status is never moved.

  rationale:
     - >-
      The user gave this instruction explicitly this session, and it is the exact
      basis multiple goal records already require in writing before the
      Coordinator may raise a batch ceiling ("THE COORDINATOR DOES NOT SELF-GRANT
      ONE"). The authorization to move maximum_batches is the user's; the
      Coordinator only records it.
     - >-
      null is the schema-documented unbounded representation; setting maximum_batches
      to null is the program's own "let the campaign run until a real
      completion or pause condition" state, not an invented convention.
     - >-
      A bulk uncap is recorded as ONE spanning decision rather than per-goal,
      because it is one administrative act with one authorization basis; this
      mirrors BUDGET-AMEND-20260812-001's own program-wide shape. Per-goal
      history fields already present in each record are preserved, not deleted.
     - >-
      Status changes are explicitly out of scope: a closed_at_budget, completed,
      or paused goal is not reactivated by its cap going null, and reactivating
      one is a separate decision.

  what_this_decision_does_not_do:
     - >-
      It does not open any batch, authorize any run, or dispatch any Executor
      task. Each goal's next batch still requires its own dispatch decision under
      its existing scope, completion criteria, and review requirements.
     - >-
      It does not move any hypothesis status, claim tier, completion criterion,
      pause condition, total_wall_clock_seconds, or max_concurrent.
     - >-
      It does not reframe any quarantined or confounded result. GOAL-DREG-001's
      raw 17947 headline stays quarantined as support-confounded and H-DREG-001
      stays inconclusive; removing a batch cap changes how long the campaign may
      run, not what any result means.
     - >-
      It does not reassert GOAL-MLKEM-001/003/004, GOAL-P13-001, GOAL-FIND-001,
      GOAL-ICLIFT-001, or GOAL-XEDN-001/002/003 as active; their status fields
      are untouched.

  non_claims:
     - A longer or un-batched campaign is not a stronger result.
     - No asymptotic-complexity claim is advanced and no promotion gate is engaged.
     - Removing a batch cap supplies no reason to keep going absent a ranked,
       justified next task (coordinate-research-goal skill, "When a batch has
       nothing ready").

  evidence_refs: []

  limitations:
     - >-
      This decision authorizes no research, experiment, run, or batch opening. It
      changes exactly one field, maximum_batches, on every goal record to null
      and nothing else.
     - Removing or enlarging a batch ceiling is not evidence that any
      campaign's remaining work is more tractable, more likely to succeed, or
      closer to a completion criterion; none of that is asserted here.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      An administrative program-wide budget-ceiling uncap; no empirical or
      theoretical evidence is produced or reviewed by this decision.

  next_actions:
     - >-
      Project maximum_batches := null on every ledger/goals/ record that is not
      already null (the target_finite_caps_projected_to_null list above),
      preserving each record's existing maximum_batches-history / amendment
      fields, and resolve the three merge conflicts (GOAL-ARGON-001,
      GOAL-ECTD-001, GOAL-ECDLP-001/goal.yaml) to the null value that this
      decision makes authoritative, merging origin/main otherwise unchanged.
     - >-
      Re-open and drive the in-flight GOAL-DREG-001 BATCH-006 and
      GOAL-ECDLP-001 BATCH-080a9c control planes now that the merge gate is clear.
     - >-
      No batch is authorized to open by this decision alone.

  decided_by: coordinator
  decided_at: '2026-08-14'
  decision_authority: >-
    The authority to set or raise the batch cap is the user's, exercised in this
    session through a direct instruction ("all should be set to null"). The
    user was shown that origin/main already held a narrower user-authorized +1
    amendment and that the local null state was un-spanned; the user chose the
    null state for every goal. The Coordinator recorded this authorization; it
    did not make it.

