  rationale:
    - >-
      THE CENSUS CLOSED THE SEARCH. Earlier acts each found one more reader
      because each check looked for one kind of reader. This census
      enumerated every consumer by eight access modes to a fixpoint, and what
      it found is not a new reader of a disposed value but two value classes
      the draft never disposed of at value level. That is a finite, named
      gap, fixed by adding dispositions, not by another search.
    - >-
      THE READING BINDS EVEN WHEN THE GAP IS HARMLESS. The 14 consumers are
      an integrity hash invariant to field values and the approved wrapper's
      own mechanism. The draft pre-declared that only an uncovered gating
      reader bars, and these are uncovered as written. Approving anyway would
      change the rule after seeing the outcome.
    - >-
      NO NEW CENSUS. The successor changes no code and removes no
      disposition, so the archived census's enumeration carries over. The
      approval act checks 14 named rows and a monotonicity claim by reading.
      A second census would re-find the same rows at the cost of a session.
    - >-
      VALUE LEVEL, AGAIN AND PROPERLY. The successor disposes of the event
      record and of integrity hashes as values, which also covers readers the
      census's M-7 limit hides (r2_check_run.py lines 205, 207-212).
    - >-
      THE BIAS IS TOWARD THE DECIDABLE QUESTION. Criterion C1's measured side
      and KN-OPEN-9b4a2b need the v2 ladder and the 31-bit rung. A coverage
      finding is not a reason to abandon them (AGENTS.md "Research-direction
      integrity"). The route to them is one Coordinator act on archived bytes,
      then the r3 stage.
    - >-
      NO SECURITY READING. Toy EcGFp5-shaped arithmetic with known scalars;
      nothing transfers to p = 2^64 - 2^32 + 1.

