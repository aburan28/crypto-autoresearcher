        it removes none. So every row the census found covered or in class
        stays so (monotone), and only the 14 rows need a new disposition,
        which the successor names row by row (VC-2).
      - The approval act can check those three facts by reading: VC-2 against
        census.md lines 396-398, 419 and 429-438; the successor text against
        consumercover CC-2; and "no code change" by the archive's git check
        (VR-5). The successor pre-declares exactly these as VR-5, VR-1 and
        VR-2.
      - Where the census's method is weakest (M-7, control dependence), the
        successor does not rely on enumeration at all: gamma, epsilon, V-7
        and alpha are value-level. For r3 code, which does not exist yet,
        DV-11's static check follows control dependence (VC-3).
      A new census would be needed only if a successor changed code or the
      consumer set. This one does neither.
