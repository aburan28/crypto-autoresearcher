        55.6049, 47.7685, 42.2786, 35.1642 bits per the validator and blind
        re-deriver), states that no verdict changes (the m = 3 subgroup floor
        is still +6.776 bits above rho 2^60.8090), and pins the three m = 4
        budget quantities: D1 the floor-to-rho gap 2^-4.41 (quoted), D2 the
        producer's per-target budget 2^+5.71 (quoted; validator +5.726, blind
        +5.73), D3 the re-optimised per-attempt budget 2^+11.01 (quoted; equal
        to IDEA-20260926-4b65e3's capped column at m = 4). CORR-20260928-5d81df
        (record_type claim, on EV-ICPERF-10c5fc) relabels strength from
        replicated to preliminary FOR THE COST CLAIMS, leaves the derivation
        tier unaffected (proof_status derivation; J1-J3 hold), keeps direction
        weakens and the obstruction block, and names the two unbound numbers:
        the solver_11 amortisation shares 0.12 % / 0.07 % and the degree-2
        vanishing-ideal base case 6967 / 140400 / 8647. NEITHER CORRECTION
        CHANGES A VERDICT: every ECC2K-130 arity conclusion of the finding
        stands under both ambients, and every downstream record that quoted
        D1 as a budget keeps its conclusion (validator wrong_quantity_records
        net). KN-FIND-aa2efc stays in the corpus; its promotion rested on a
        derivation this review has now independently validated, and any
        further re-examination of its promotion bar is a later act citing
        these reports. The definition pin is folded into CORR-20260928-4cb669
        rather than written as a third record: it changes no record's
        verdict, and a per-record correction on each downstream quoter
        (IDEA-20260926-89886c, -b6cc43, -4b65e3, the analysis files and the
        review YAMLs) would be many records for one definition;
        CORR-20260928-ab20cd is therefore RETURNED UNUSED. The ranking card
        carries the pin as a constraint instead, so no design inherits the
        conflation.
