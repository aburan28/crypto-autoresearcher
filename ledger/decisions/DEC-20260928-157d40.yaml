      Corrections before designs. The validator pass found the ambient and
      the definition that every m >= 4 proposal in the pool prices against;
      writing the corrections first, and binding the ranking card to the
      pinned quantities, means no design inherits the conflation
      (validator J2 wrong_quantity_records).
    - >-
      Rank before design. Thirty-three or more open ECC proposals were filed
      in two rounds across six questions and three goals, with visible
      overlaps against the 36 already ranked; designing the first-listed one
      would likely duplicate or inherit a defect. A read-only ranking is the
      cheapest act that converts the pool into ranked /design-experiment
      work, as rule 11 requires, and the same card carries the HOLD-A to
      HOLD-G re-rank the 26 reviews now inform.
    - >-
