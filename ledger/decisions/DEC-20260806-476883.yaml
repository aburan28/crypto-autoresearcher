coordinator_decision:
  id: DEC-20260806-476883
  decided_by: coordinator
  decided_at: '2026-08-06'
  decision: refine
  target_ids:
  - GOAL-HQC-001
  - EXP-HQC-982268
  - H-HQC-18d1b4
  - EV-HQC-d7d79d
  context: "BATCH-3bd1f4 dispatched DEC-20260806-d9d395's next_action item 1: two cheap, no-new-sampling
    reliability checks on the block-dilution formula, before scoping a global-injection pilot around its
    ~1.38e5 required-T projection. TASK-20260806-66e3c3 ran both checks; TASK-20260806-9c206d snapshotted
    them before either review; TASK-20260806-b6b2f9 (Validator) and TASK-20260806-248cb2 (Red Team)
    reviewed independently and in parallel. This decision closes the batch and corrects the prior batch's
    headline claim on their reports plus EV-HQC-d7d79d."
  decision_label: relative_advantage_confirmed_absolute_cost_reopened_measure_directly
  rationale:
  - 'THE "GLOBAL INJECTION CHEAPER THAN BASELINE" CLAIM FROM DEC-20260806-d9d395 IS RETRACTED AS AN
    ABSOLUTE FIGURE, NAMED PLAINLY RATHER THAN QUIETLY REVISED. The Red Team propagated the more reliable
    (large-T) dataset''s bracket-term estimate through the identical, already-validated dilution formula
    and obtained a required T of 4.257e5 for global injection -- MORE expensive than the specification''s
    own undefected T_req of 3.09e5, not less. The prior batch''s 1.38e5 figure came from a smaller
    dataset whose disagreement with the larger one the Validator has now shown is explained by ordinary
    sampling noise, not error -- but that does not make the smaller dataset''s point estimate the right
    one to trust for a decision.'
  - 'WHAT SURVIVES, CONFIRMED ALGEBRAICALLY BY THE VALIDATOR: the RATIO between single-block and global
    injection cost (exactly n_e-squared = 3136) is independent of which bracket-term estimate is used,
    because both required-T figures share the identical disputed term and differ only by a
    dilution-geometry prefactor that carries no empirical uncertainty. Global injection remains, with
    confidence, roughly 3,000 times more cost-effective than single-block injection. This is a genuine,
    robust finding and the reason this campaign should still pursue global injection next -- just not
    with the specific absolute cost figure the prior batch reported.'
  - 'THE PRINCIPLED RESPONSE TO A 1.38e5-TO-4.26e5 UNCERTAINTY BAND IS TO MEASURE, NOT TO KEEP DERIVING.
    Both figures, and even the top of the disclosed range, correspond to core-second costs in the LOW
    HUNDREDS (roughly 69 to 213 core-seconds at the campaign''s established ~2,000 trials/core-second
    throughput) -- trivial against the campaign''s remaining budget. There is no budget reason to keep
    refining the projection with further derivation; the cheapest way to resolve the bracket-term
    uncertainty is to actually run a global injection and measure it directly, which this campaign has
    never done at any scale.'
  - 'THE OUTSTANDING SE-EXTRAPOLATION CHECK IS NOT RE-DISPATCHED SEPARATELY. The Red Team correctly caught
    that this batch''s "Check 2" silently substituted a narrower arithmetic-only check for the
    SE(T) ~ 1/sqrt(T) extrapolation actually requested. Rather than spend another full batch cycle closing
    that specific gap in isolation, this decision folds it into the global-injection pilot itself: a real
    pilot run at multiple sub-scales will directly demonstrate the SE-scaling behavior empirically, which
    is strictly more informative than a further derivation-only check.'
  - "THE VALIDATOR'S ANTI-CORRELATION SIGN ARGUMENT IS NOTED BUT NOT ACTED ON. It offers a plausible
    reason the true value might sit nearer the cheaper end of the range, but it is explicitly a heuristic,
    not a derivation, and this decision does not use it to justify sizing a pilot optimistically. The
    pilot below is sized to be informative across the full disclosed range, not just the favorable end."
  evidence_refs:
  - EV-HQC-d7d79d
  - EV-HQC-036d4b
  - EV-HQC-67a6ec
  - EV-HQC-bfb257
  - EV-HQC-163374
  - EV-HQC-9a30d3
  - EV-HQC-db1fd9
  - EV-HQC-b71230
  - coordination/goals/GOAL-HQC-001/batches/BATCH-3bd1f4/reviews/TASK-20260806-b6b2f9/validation_report.yaml
  - coordination/goals/GOAL-HQC-001/batches/BATCH-3bd1f4/reviews/TASK-20260806-248cb2/red_team_report.md
  limitations:
  - NO statement about HQC, its decoding-failure rate, assumption A17 or A5, or any standardized
    parameter set. Claim tier stays toy.
  - H-HQC-18d1b4 UNCHANGED at proposed. Seven consecutive batches of instrument-trust, feasibility, and
    derivation work have not moved it.
  - experiments/EXP-HQC-982268/specification.yaml is not amended by this decision. The global-injection
    pilot named below is not yet scoped in detail; that is the next batch's task.
  - None of the four asymptotic-complexity promotion gates is engaged; none is claimed.
  - "The relative (n_e-squared) advantage of global over single-block injection is confirmed to the extent
    the shared dilution formula itself is correct; it does not by itself establish that global injection
    at ANY scale would actually detect a real defect if HQC's real sampler contained one -- that remains
    to be measured."
  knowledge_promotion:
    promoted: []
    not_warranted: 'The exact-cancellation structure of the required-T ratio (n_e-squared, independent of
      the disputed approximation term) is a clean, reusable result for reasoning about dilution in
      aggregate k-way statistics generally, not just this instrument. Held pending an actual
      global-injection measurement to confirm the projection''s practical relevance, per this program''s
      standing discipline against promoting derivations before they are exercised against real data. No
      KN-FIND: nothing was measured about HQC.'
  next_actions:
  - "Design and dispatch a GLOBAL (V1-class, all-56-block off-by-one truncation) real-sampler injection
    pilot -- this campaign's first actual measurement at this injection point, at any scale. Size it to be
    informative across the full disclosed uncertainty range (1.38e5 to 4.26e5 projected required T), not
    optimistically at the lower end: run at multiple sub-scales (e.g. a diagnostic tier well below 1.38e5
    to confirm mechanical soundness cheaply, then a tier at or above 4.26e5 if the diagnostic tier is
    clean) so the pilot itself supplies the SE(T) ~ 1/sqrt(T) empirical evidence the outstanding check
    would have derived, folding that gap into direct measurement rather than further derivation."
  - "Apply every lesson this campaign's prior real-sampler batches already established: matched-pair
    comparison design from the start (not a weaker between-shard design), sha256-pinned reuse of
    decode_blocks/CTRStream/fixed_weight_support/ring_mul_sparse and measure.py's estimator, fail-closed
    self-checks demonstrated with a deliberate-mismatch dry run, and an honest, consistent execution
    count."
  - "Only after a global-injection measurement is in hand should the remaining resume-plan items from
    DEC-20260806-2947ba be attempted: the missing extrapolation to standardized parameters, PS-R3's
    second independent reviewer, and the remaining named harness repairs."
  - "Carry forward, lowest priority: the unreconciled run-count discrepancy from the V1 arm (BATCH-4b8ad3)
    remains unresolved."
