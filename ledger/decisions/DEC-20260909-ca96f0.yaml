  # =======================================================================
  the_defect_in_full:
    what_happened: >-
      The P-2 and P-3 cards each mandate a digit scan over the producer's own
      three artifacts, classifying every maximal decimal digit run into a CLOSED
      SIX-CATEGORY LIST - a line number, an identifier, a date, a version, a
      declared shape count, or a digest fragment - and each card states that a
      run that does not classify is a leak and a stop. BOTH SCANS FOUND EVERY
      RUN, ENUMERATED EACH WITH ARTIFACT, LINE AND COLUMN, AND ACCOUNTED FOR
      EACH BY A DECLARED CHECKABLE RULE. Both report ZERO UNACCOUNTED RUNS, both
      exercised the OBJ-E synthetic leak probe and report IT FIRED ON BOTH LIMBS,
      and both report ZERO independent decimal-limb matches over the artifacts.
      NEITHER SCAN FOUND A LEAK. What they found is that the closed list CANNOT
      NAME several categories of run that the same cards MANDATE: the published
      field-size locator label used as the presence-boolean key the P-2 card
      expressly requires and expressly permits (one occurrence, recorded answer
      `false`); column positions, required by the cards' own "say where it sits"
      reporting rule; recorded commands and exit codes; mandated verbatim
      quotation spans; byte lengths; resolution facts. P-3 counted sixteen such
      runs, declared NO STOP, stated the literal counter-reading fairly against
      its own disposition, refused to relabel any run to obtain a green scan,
      and invited overrule. P-2 counted ten such runs plus two boundary families,
      declared `outcome: STOP` ON THE LITERAL READING, said in terms that the
      stop is "ON A DEFECT OF THE CLOSED CLASSIFICATION LIST, NOT ON A LEAK",
      halted, and wrote nothing further.
    why_the_two_dispositions_diverged: >-
      The card text supports both readings. The purpose of the stop - catching a
      digit run that CANNOT BE ACCOUNTED FOR, because such a run may be leaked
      content - did not fire in either package. The letter - a run that does not
      classify into the closed list is a stop - fires on runs the card itself
      requires. Neither producer is wrong; the control plane is defective, and
      the producers' refusal to force runs into unfitting categories is why the
      defect is visible at all. That refusal is recorded here as CORRECT
      BEHAVIOUR: a classification moved to make a red instrument green has
      stopped being a check.

  # =======================================================================
  rulings:
    R1_both_verdicts_read: >-
      The card's precondition "both leak-scan verdicts read" is SATISFIED. This
      session read both reports directly at their committed paths, including
      both disposition sections, the enumerated unnameable-run families, and
      both OBJ-E positive-control sections.
    R2_no_leak_finding: >-
      On the leak question the scans are unanimous and their positive controls
      fired: zero unaccounted digit runs in either package, OBJ-E fired on both
      limbs in both scans, zero independent decimal-limb matches. NO LEAK WAS
      FOUND BY EITHER SCAN, and nothing in either report suggests one. The
      governed-value citation prohibition was not violated by either package on
      its own report; the reviewer re-checks this at J4 and this ruling does not
      prejudge that joint.
    R3_the_stop_phrase_ruled: >-
      "UNCLASSIFIABLE DIGIT RUN" in the dispatch_precondition of
      TASK-20260906-28e6de, and "does not classify" in the leak-scan mandates of
      the P-2 and P-3 cards, are ruled to mean A RUN THAT CANNOT BE ACCOUNTED
      FOR - no declared, checkable rule explains it - and NOT a run that is
      fully accounted for but cannot be NAMED by the closed six-category list.
      Grounds: (a) the stop exists to catch possible leaked content, and an
      accounted-for run enumerated with artifact, line and column under a
      declared rule is the opposite of that; (b) the literal reading makes a
      compliant artifact IMPOSSIBLE, because the same cards mandate the very
      runs the list cannot name - the presence-boolean key carrying the
      published locator label is required by the P-2 card and permitted by it in
      the same breath - so on the literal reading the card forbids what it
      requires, and a control that cannot be satisfied is a defect, not a
      control; (c) P-3's report states this disposition, states the literal
      counter-reading fairly against it, and invites overrule, and this
      Coordinator ADOPTS IT. CONSEQUENCE: P-2's `outcome: STOP` IS DISPOSED AS A
      CONTROL-PLANE DEFECT FINDING - which is what its own text says it is - AND
      NOT AS A LEAK STOP, and the dispatch precondition "both leak-scan verdicts
      read and clean" is SATISFIED on the reading recorded here: read, done;
      clean, no leak found, no unaccounted run, positive controls fired. THE
      REVIEW MAY BE DISPATCHED.
    R4_control_plane_defect_recorded_as_CF_30: >-
      NEW CARRIED FINDING CF-30, origin this decision: the closed digit-run
      classification list of the BATCH-1fa3fb producer cards has no category for
      several run classes its own cards mandate. Repair route: SUCCESSOR cards
      and control planes name categories for - resolution facts; recorded
      commands and exit codes; mandated verbatim quotation spans; a published
      locator label used as a card-mandated key; sibling locators such as column
      positions; byte lengths - adopting both producers'
      RECOMMENDATION_NOT_A_DECISION. The committed cards, queue, batch.yaml and
      review_plan.yaml of BATCH-1fa3fb are IMMUTABLE AND ARE NOT EDITED; the
      repair travels by successor record in the NA-3/NA-4 stream. CF-30 is
      carried forward, recorded, and not dispatched, with its origin named, so
      that not dispatching cannot evaporate into silence.
    R5_the_reviewer_is_not_bound_by_this_decision: >-
      review_plan.yaml IS THE REVIEWER'S AND GOVERNS. Its J4 sentence - any
      digit run that does not classify is a leak and is a stop - is applied by
      the reviewer on its own terms; the reviewer re-runs the digit scan itself,
      may classify under the closed list as written, may report the literal
      reading as a finding on its own joints, and may disagree with every
      ruling here. This decision is a committed record in the reviewer's read
      scope, not an instruction. It unblocks dispatch and prejudges no joint
      J1-J5; the whole-round composition belongs to TASK-20260906-f62e26.
