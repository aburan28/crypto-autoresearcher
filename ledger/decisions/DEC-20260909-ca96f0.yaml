      not recorded and is not inferred. If it stopped on the precondition, that
      was the card's required behaviour and this decision is the answer it was
      waiting for.
    R7_nothing_else_moves: >-
      No status transition of any kind occurs by this decision. The citation
      prohibition and its predicate extension are RETAINED VERBATIM AND NOT
