    - >-
      CHECK THE MINTED IDS BEFORE COMMITTING. Run "python3
      tools/allocate_id.py --check CORR-20260819-7c4e19" and "--check
      DEC-20260819-3fb8a2". Both were drawn by a session with no shell and
