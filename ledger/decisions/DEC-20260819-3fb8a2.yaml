    - ledger/decisions/DEC-20260802-a51c82.yaml
    - ledger/decisions/DEC-20260805-bb162b.yaml
    - ledger/decisions/DEC-20260810-2f92d8.yaml
    - ledger/corrections/CORR-20260731-005.yaml
    - coordination/goals/GOAL-ICEX-001/batches/BATCH-001/dispatch_queue.json
    - coordination/goals/GOAL-ICEX-001/batches/BATCH-001/archives/TASK-20260731-024/ledger-receipt.json
    - coordination/goals/GOAL-ICEX-001/batches/BATCH-641950/SCOPE-DECISION.md
    - tools/research_dispatch.py
  limitations:
    - >-
      NO GIT COMMAND WAS RUN AND NO HASH WAS COMPUTED. This session has no
      shell or Bash tool. Every claim about commit e948de55, about which paths
      a commit changed, and about whether a declared SHA-256 matches file bytes
      is reported as it appears in committed artifacts, never as an independent
      verification. The dossier's dispatcher error output is likewise
      reproduced, not re-run.
    - >-
      The dispatcher's missing/extra diagnosis is explained here by
      CORR-20260731-005 as the most parsimonious account consistent with every
      artifact read. It is not proven: proving it requires reading commit
      e948de55, which this session could not do.
    - >-
      GOAL-FAEST-001 sub-class (A), GOAL-AES-001 TASK-20260801-808 and
      GOAL-MCE-001 C-2 were NOT examined. The dossier's "four confirmed
      instances - a systemic pattern" is neither adopted nor refuted here; on
      what was checked, ICEX and SIG trace to one documented remap event rather
      than to two independent drifts.
    - >-
      No YAML or JSON parse was executed by this session. See
      parse_verification below; this is a declared gap, not a silent one.
    - >-
      This decision is written to the working tree and is not committed. Under
      AGENTS.md rule 7 and agents/coordinator.md it is not durable, not
      official, and not evidence until an archival commit is made and the
      post-commit verifier accepts it. Nothing in it may be cited as an
      official transition before then.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is a records-integrity and authorization-audit decision. No
      experiment ran, no run record exists, no evidence record was produced,
      and the decision is neither support nor reject_scoped on replicated or
      strong evidence. Nothing here is a durable finding about ECDLP, index
      calculus, or any cryptographic system. The reusable lesson - that a
      load-bearing negation can be lost by citing a single line of a folded
      YAML block scalar - is a harness observation; if it is to become corpus
      it belongs to whichever campaign owns the correlated-blind-spot review
      that produced R-10, not to GOAL-ICEX-001, and it needs a second
      independent instance before it is worth a KN entry.
  claim_ceiling: >-
    None claimed. No cryptographic, algorithmic, asymptotic or empirical claim
    of any kind is made. sota_delta is zero on every axis; Pollard rho at
    c_rho*sqrt(N) remains the ECDLP baseline and is untouched by this record.
    All four asymptotic promotion gates in agents/coordinator.md remain OPEN
    and none is attempted.
  next_actions:
    - >-
      REBIND, DO NOT EDIT. The GOAL-ICEX-001 BATCH-001 governing decision must
      be recovered and reissued under a fresh identifier minted with
      tools/allocate_id.py, by a session that has a shell: read
      ledger/decisions/DEC-20260731-003.yaml as it stood at commit
