      CORR-20260819-7c4e19.
    - >-
      PARSE BEFORE COMMITTING. Run yaml.safe_load over
      ledger/corrections/CORR-20260819-7c4e19.yaml and
      ledger/decisions/DEC-20260819-3fb8a2.yaml, and
      tools/validate_ledger.py over the tree. This session could not execute
