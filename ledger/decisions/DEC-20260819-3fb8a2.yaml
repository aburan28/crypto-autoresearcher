    - >-
      AUDIT THE THREE UNCHECKED INSTANCES SEPARATELY - GOAL-FAEST-001
      TASK-20260731-013, GOAL-AES-001 TASK-20260801-808, GOAL-MCE-001 C-2 -
      before any record asserts a systemic four-instance pattern. Check each
      against CORR-20260731-005 and against any other committed correction
      first: on the two instances checked here, what looked like drift was a
      documented remap.
    - >-
      DO NOT PAUSE GOAL-ICEX-001 ON THIS AUDIT. If a future Coordinator wishes
      to pause it, the live ground is pause_condition 2 assessed against
      current committed state including GOAL-ECDLP-001 BATCH-9c41dd's outcome -
      not the authorization defect alleged by the dossier, which does not
