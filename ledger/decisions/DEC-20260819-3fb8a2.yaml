coordinator_decision:
  id: DEC-20260819-3fb8a2
  goal_id: GOAL-ICEX-001
  batch_id: BATCH-001
  question_ids:
    - RQ-ICEX-001
  recorded_at: '2026-08-19'
  context: >-
    A Coordinator subagent was dispatched to audit and dispose of a "confirmed
    authorization defect" in GOAL-ICEX-001, described in
    ICEX-DOSSIER-READ-ME-FIRST.md on branch
    claude/icex-001-authorization-audit-20260819, and instructed to treat that
    dossier as a hypothesis and re-verify every load-bearing claim by a
    different method. On re-verification the central claim is inverted and two
    of its supporting findings are wrong on the artifacts. The goal head does
    not assert that ICEX measurement is authorized; it asserts that it is not.
    A real but different defect exists: the identifier that
    CORR-20260731-005 assigned to the GOAL-ICEX-001 BATCH-001 ledger decision
    was later re-occupied by an unrelated GOAL-ECDLP-001 record, so that
    decision is currently unreachable by ID, and its archive was never
    post-commit verified. Findings and exact searches are archived in
    CORR-20260819-7c4e19.
  decision: supersede
  decision_vocabulary_note: >-
    supersede here means CORR-20260819-7c4e19 supersedes the dossier's
    diagnosis of GOAL-ICEX-001 as the program's operative account of this
    defect. It supersedes NO ledger record - not DEC-20260731-015, not
    EV-ICEX-001, not CORR-20260731-005, none of which is edited or invalidated
    by this decision. It changes no goal status, no hypothesis status, no claim
    tier, and no experiment approval, and it authorizes no ICEX measurement.
  decision_scope: >-
    Scoped to the authorization question the dossier raised about
    GOAL-ICEX-001 and to the archival integrity of BATCH-001 TASK-20260731-024.
    It decides nothing about RQ-ICEX-001 on the merits, nothing about
    EXP-ICEX-146ff5 or H-ICEX-9e54c2, nothing about whether prime-field index
    calculus can beat rho, and nothing about GOAL-SIG-001, GOAL-FAEST-001,
    GOAL-AES-001 or GOAL-MCE-001 beyond the single consistency check recorded
    as S9 in the correction.
  target_ids:
    - GOAL-ICEX-001
    - CORR-20260819-7c4e19
    - CORR-20260731-005
    - DEC-20260731-015
    - EV-ICEX-001
    - TASK-20260731-024
    - BATCH-001
    - ICEX-AUTHORIZATION-DEFECT-DIAGNOSIS-20260819
  authorization_finding:
    question: Does any committed record authorize ICEX measurement?
    answer: >-
      No, and none is supposed to. This is a correctly recorded deliberate
      non-authorization, not a missing record. EV-ICEX-001 inference requires
      "a separate Coordinator ledger authorization" before implementation or
      measurement; its observations record that "present-tense non-authorization"
      survived independent red team RT-20260731-023 and that "No ICEX
      measurement or solver campaign was executed";
      BATCH-641950/SCOPE-DECISION.md R-4 records that the separate
      authorization "has never been issued"; and
      experiments/EXP-ICEX-146ff5/specification.yaml carries
      execution_authorization.granted false. GOAL-ICEX-001's own next_action
      says "remain non-executing" and "NO ICEX MEASUREMENT AUTHORIZED". Five
      artifacts agree with each other and with the goal head.
    what_is_actually_missing: >-
      Not an authorization. The GOAL-ICEX-001 BATCH-001 governing decision -
      the record that adopted the review-only protocol PASS and withheld
      measurement authorization - is unreachable by identifier. See
      CORR-20260819-7c4e19 findings N2 and N3.
  goal_status_determination:
    status_before: active
    status_after: active
    changed: false
    recommendation_evaluated: >-
      The dossier recommended paused. Evaluated independently and declined.
    grounds:
      - >-
        The premise fails. paused was recommended because an active goal "must
        not keep running on an authorization that does not exist". ICEX is not
        running. BATCH-641950/SCOPE-DECISION.md section 6 records zero budget
        consumed against total_wall_clock_seconds 43200, with no Executor,
        Validator or Red Team session dispatched. There is no execution to
        stop and no authorization claim to withdraw.
      - >-
        active with a non-executing next_action is the state the committed
        records describe, and it is load-bearing. GOAL-ICEX-001's next_action
        carries the MONO feed supersession mandatory read and the
        2*(1 - 1/W_eff) formula correction from DEC-20260802-a51c82. Its
        feed_supersession block exists, in its own words, "because the
        refutation previously lived only in execution-report prose, where a
        driver resuming this goal would never have seen it." Moving the goal to
        paused on a mistaken premise risks demoting the record a resuming
        driver is required to read.
      - >-
        A prior Coordinator declined this closure on the record and the
        grounds have not changed. DEC-20260810-2f92d8 states its finding is
        "NOT a closure of GOAL-ICEX-001" and names three live routes.
        DEC-20260805-bb162b states "This decision does NOT authorize
        GOAL-ICEX-001 to open a batch. GOAL-ICEX-001 remains non-executing".
        Neither moved the status, both for reasons unrelated to the alleged
        defect.
      - >-
        The one ground on which paused could be argued - pause_condition 2,
        "Prerequisites remain without auditable next action beyond campaign
        budget" - was already assessed as FIRED for a specific batch question
        in BATCH-641950/SCOPE-DECISION.md section 2, and that same record
        deliberately set goal_status_change none and left the goal active. This
        session did not re-verify the current prerequisite state (the outcomes
        of GOAL-ECDLP-001 BATCH-9c41dd, DEC-20260806-8f7e4f and EV-ICEX-2be32e
        were not audited here), so it has no basis to fire that condition now
        and will not fire it on a premise it just refuted.
      - >-
        AGENTS.md rule 9 requires any deprioritization to record its evidence,
        budget, test boundary, remaining uncertainty and a revisit condition. A
        pause justified by a defect that does not exist would satisfy none of
        them honestly. Refusing to close on evidence that supports closing is
        the mirror failure, and is not what is happening here: the evidence
        does not support closing.
    open_question_left_explicitly_open: >-
      Whether pause_condition 2 has in fact fired on current committed state is
      NOT decided by this record. It is a live question, it requires an audit
      of BATCH-9c41dd's outcome that this session did not perform, and a future
      Coordinator may reach paused on that basis without contradicting this
      decision.
  rationale:
    - >-
      The claim under audit was inverted by a line-scoped read. next_action on
      ledger/goals/GOAL-ICEX-001.yaml is a folded block scalar spanning lines
      56-71; the words "NO ICEX" terminate line 58 and "MEASUREMENT AUTHORIZED"
      begins line 59. Citing ":59" quotes an authorization out of a
      non-authorization. Reading the record whole rather than by line refutes
      it immediately.
    - >-
      The receipt finding queried a key the schema does not define. The ledger
      receipt is crypto.autoresearch.archive_receipt.v1 and has no path_sha256
      key; its binding field is artifact_sha256, populated with five SHA-256
      values. The binding tools/research_dispatch.py actually consumes is the
      dispatch queue's archive.path_sha256, populated with six. The two agree
      on all five shared paths. "Nothing was ever content-bound" is false in
      exactly the direction that matters: the hashes exist and were never
      checked.
    - >-
      The declared-ID change is an authorized supersession, not silent drift.
      CORR-20260731-005 is a committed correction recording a merge-collision
      remap of the tier-path campaign's decisions to DEC-20260731-013..015,
      naming GOAL-ICEX-001, DEC-20260731-015 and EV-ICEX-001 in its
      reference_updates. The dispatcher's missing/extra complaint is the
      expected residue of a remap that cannot reach into a pushed commit.
    - >-
      The real defect is that the remap target was re-occupied and never
      re-corrected. DEC-20260731-013 is GOAL-ECTD-001; -014 and -015 are
      GOAL-ECDLP-001 BATCH-021. Zero of the 40 DEC-20260731-*.yaml files
      mention ICEX or index calculus. The ICEX BATCH-001 decision has no
      reachable identifier, though its content is pinned by SHA-256
      05627e11dac0014ec866683d349942d07682f0a3d1f9e2a0a68917a2e3beeebc in two
      independent committed artifacts.
    - >-
      A secondary real defect: the archive was never post-commit verified. The
      receipt records commit_sha null and verification.status
      pending_post_commit while the queue records commit e948de55. Under
      AGENTS.md rule 7 that transition was never made official.
    - >-
      Recording the refutation is the higher-value output here. A correction
      that repaired a non-existent authorization defect would have consumed the
      one repair this goal gets, left the ID orphan and the unverified archive
      in place, and paused a goal that has spent zero budget - while creating a
      committed record asserting that ICEX once claimed an authorization it
      never claimed.
  evidence_refs:
    - ledger/corrections/CORR-20260819-7c4e19.yaml
    - ledger/goals/GOAL-ICEX-001.yaml
    - ledger/evidence/EV-ICEX-001.yaml
