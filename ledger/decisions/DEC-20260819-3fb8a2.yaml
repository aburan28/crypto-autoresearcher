      05627e11dac0014ec866683d349942d07682f0a3d1f9e2a0a68917a2e3beeebc, and
      reissue it under a new DEC id with a correction binding old to new. Do
      NOT overwrite ledger/decisions/DEC-20260731-015.yaml, which now belongs
      to GOAL-ECDLP-001 BATCH-021, and do NOT edit the BATCH-001 dispatch
      queue's declared IDs to make the dispatcher render.
    - >-
      Then, and only then, update the citation in GOAL-ICEX-001.next_action
      from DEC-20260731-015 to the reissued id, as a superseding write that
      preserves the existing sentence including its negation and its MONO
