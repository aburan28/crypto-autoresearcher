  limitations:
    - >-
      NO EXECUTOR RUN IS AUTHORIZED. No experiment is approved, designed, or
      frozen; no hypothesis exists to move; no claim tier changes.
    - >-
      This decision asserts NOTHING about FAEST's security, its claimed
      category, or any link of its claim chain. The FAEST claim ceiling is
      unchanged, and every BATCH-001 boundary in EV-FAEST-001 and EV-FAEST-002
      remains in force, including that toy-scale measurements, if later
      designed, are toy-tier and can never be presented as crypto-scale
      validation (AGENTS.md rule 7).
    - >-
      The deployed FAEST parameters remain UNPINNED. Every deployed-parameter
      number in the six IDEA records is still an unverified placeholder, and
      scope fixes RSF-1..5 and the eleven refinements OBJ-4-1..4, OBJ-5-1..3,
      OBJ-6-1..4 remain PENDING application to those records.
    - >-
      RSF-5 may be unresolvable. Neither route is pre-judged; KN-LIT-7619
      establishes repository metadata only, and both routes met HTTP 403 in the
      2026-07-31 probe.
    - >-
      NO DISPATCH QUEUE IS AUTHORED AND NO WORKER IS DISPATCHED BY THIS
      DECISION. BATCH-0ed590 is opened as a control-plane record only; the queue
      and its handoffs must be authored by the next session before anything runs.
    - >-
      The merge-commit mechanism behind defect 1 (da6f4fdaf, and the goal_id
      values of DEC-20260731-018..020 on main) was verified from git history by
      the driving session and is relayed here; this Coordinator has no shell and
      did not re-run those commands. The record-content facts about
      DEC-20260731-020 and DEC-20260731-021 were read directly.
    - >-
      Model independence is unavailable in this session: one backend serves
      every policy alias, so nothing here carries cross-model corroboration, and
      no attestation, review verdict, or independent-review claim is recorded by
      this decision.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED, AND THE REASON IS CONCRETE. This is a citation-integrity
      and control-plane act: it produces no new research evidence, cites no run,
      creates no EV-* record, and rests on no experiment. The two evidence
      records it cites (EV-FAEST-001, EV-FAEST-002) are `preliminary`
      literature/theoretical ideation outcomes -- below the `replicated`/`strong`
      threshold that would oblige a KN-FIND -- and this decision is neither a
      `support` nor a `reject_scoped`. The one corpus defect surfaced here
      (KN-LIT-7619's cross-reference to KN-LIT-7637 for the FAEST team roster)
      is recorded in CORR-20260810-fd5a0e as needing a /curate-knowledge
      SUCCESSOR entry, which is a separate curation act under a separate task
      and must not be performed as an inline edit to an immutable entry.
  next_actions:
    - >-
      AUTHOR THE BATCH-0ed590 DISPATCH QUEUE AND ITS HANDOFFS, THEN DISPATCH THE
      DESIGN GATE. The queue must be written before anything runs; this decision
      authors none. Write
      coordination/goals/GOAL-FAEST-001/batches/BATCH-0ed590/dispatch_queue.json
      with a declared max_concurrent within the campaign cap of 3, one handoff
      record per card under ledger/handoffs/ with no null budget field, and
      exactly one archival task per artifact set (snapshot archives alone before
      independent review, ledger archive alone after).
    - >-
      THE GATE'S FIRST DUTY IS RSF-5, ATTEMPTED ON BOTH DECLARED ROUTES: route A
      (spec v2.0 section-security text / eprint 2023/996 full text) and route B
      (a pinned faest-ref commit from KN-LIT-7619, recording the exact commit
      built from). It must pin the consistency-check equation and degree,
      (kappa, tau), the field, the LeafCommit/bAVC modes, and the faest_em_* OWF
      definition, or report failure. IF BOTH ROUTES FAIL IT STOPS AND RETURNS AN
      ACQUISITION BLOCKER for a Coordinator ruling against pause condition #2 --
      it does not guess a parameter and it reports nothing about FAEST.
    - >-
      ONLY IF RSF-5 RESOLVES: apply scope fixes RSF-1..5 and the eleven
      refinements OBJ-4-1..4, OBJ-5-1..3, OBJ-6-1..4 to the six admitted IDEA
      records (IDEA-20260731-019, -002, -003, -004, -005, -006), then design
      frozen experiment contracts for the highest-priority ideas per the
      re-derivation outcome, as DEC-20260731-021 next_actions[0] directs. No
      contract may be frozen against placeholder parameters.
    - >-
      A /curate-knowledge successor is owed for KN-LIT-7619's cross-reference
      "(the FAEST team; see KN-LIT-7637 for the 12-member roster)", which
      resolves to an unrelated report. It is a separate curation task under a
      separate handoff. KN-LIT-7619 MUST NOT be edited inline.
    - >-
      Carry forward unchanged: the toy claim ceiling; that no hypothesis status
      moved and no H-FAEST-* record exists; that four of six campaign batches
      remain after BATCH-0ed590; and that a blocked fetch is infrastructure
      signal, never evidence about FAEST.
