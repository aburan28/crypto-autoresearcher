    - coordination/goals/GOAL-FAEST-001/batches/BATCH-0ed590/batch.yaml
  evidence_refs_note: >-
    ledger/decisions/DEC-20260731-020.yaml is cited AS THE COLLIDED RECORD --
    the artifact whose content demonstrates the mis-citation -- and NOT as
    evidence about FAEST, which it contains none of. Every other path was read
    directly at base commit 7df1972a4. No new evidence record is created by this
    decision and none of the two cited EV records is edited or re-scored.
  rsf5_resolution_routes:
    route_a_primary_text:
      description: >-
        Obtain and read the FAEST specification v2.0 section-security text
        and/or the eprint 2023/996 full text, and pin from it the exact deployed
        parameters: the consistency-check equation and its degree, (kappa, tau),
        the field, the LeafCommit/bAVC modes, and the faest_em_* OWF definition
        (widths, key split, P instantiation).
      known_obstacles: >-
        The spec v2.0 PDF body text was NOT extractable by BATCH-001's sources
        task -- EV-FAEST-001 records that content claims were attributed to the
        official resources page, not to a reading of the PDF -- and the
        2026-07-31 probe recorded faest.info and eprint.iacr.org at HTTP 403.
        Additionally verified in this session: a case-insensitive search for
        "faest" across knowledge/literature/ returns exactly three files
        (KN-LIT-7619, -7620, -7638), so NO KN-LIT entry for the specification
        exists in this corpus under any identifier. The gate must therefore
        re-attempt acquisition; it cannot read a filed entry that is not there.
      status: unattempted_in_this_batch_and_not_pre_judged
    route_b_pinned_faest_ref_commit:
      description: >-
        Adopt a pinned faest-ref commit as ground truth and extract the deployed
        parameters from the C source, recording the exact commit built from.
        DEC-20260731-021 names this route explicitly.
      material_verified_present: >-
        KN-LIT-7619 pins main HEAD 2a2c36d96f8e6d2b7acda341741892099e8c5cc1
        (2026-07-24) and version 2.0.5 at
        55b52681b4d962df9f55f4e403a68bca98b10d37 (2026-07-02), lists the twelve
        parameter variants including the faest_em_* Even-Mansour set, and names
        the relevant sources (aes.c/h, bavc.c/h, fields.c/h, vole.c/h, owf.c/h).
      honest_limit: >-
        KN-LIT-7619 records repository METADATA fetched 2026-07-31 (rendered
        repo page plus the commits atom feed) and states plainly that code
        contents were not fetched or audited and no source checksums were
        computed. It does NOT establish that the C source text is fetchable now.
        The 2026-07-31 probe recorded faest-sign GitHub repos at HTTP 403.
      status: unattempted_in_this_batch_and_not_pre_judged
    stop_condition_if_both_routes_fail: >-
      THE GATE RETURNS THE FAILURE AS AN ACQUISITION BLOCKER AND STOPS. It does
      not substitute a guessed parameter, does not design a contract against
      placeholders, and does not report the failure as a finding about FAEST. A
      double-route failure is pause-condition-#2 material for the Coordinator to
      rule on in a successor decision, and under AGENTS.md rule 5 / CLAUDE.md
      core rule 3 it is infrastructure signal, never negative mathematical
      evidence.
