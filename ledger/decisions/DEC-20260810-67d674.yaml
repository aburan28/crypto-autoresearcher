coordinator_decision:
  id: DEC-20260810-67d674
  goal_id: GOAL-FAEST-001
  batch_id: BATCH-0ed590
  recorded_by_task: TASK-20260810-0feb81
  context: >-
    GOAL-FAEST-001 is active with BATCH-001 genuinely finished: all ten tasks in
    coordination/goals/GOAL-FAEST-001/batches/BATCH-001/dispatch_queue.json
    (TASK-20260731-005..010, -012..015, max_concurrent 2) are at state
    completed. The goal has been stalled since 2026-07-31 on a next_action whose
    cited authority does not resolve. Two citation defects, both verified
    against the committed tree at base commit 7df1972a4 and recorded in full in
    CORR-20260810-fd5a0e: (1) the goal head's next_action and
    batch_checkpoints[0].decision_id both cite DEC-20260731-020 as the BATCH-001
    closing decision, but that file is a GOAL-ECDLP-001 record (goal_id
    GOAL-ECDLP-001, batch_id BATCH-024, recorded_by_task TASK-20260731-081,
    decision approve, context SG-ECDLP-002 / IDEA-20260731-008 / H-IT-001 /
    EXP-IT-001) with no FAEST content -- the genuine FAEST record is
    DEC-20260731-021, whose context opens "GOAL-FAEST-001 BATCH-001 expansion
    (campaign open)" and whose next_actions[0] carries the BATCH-002 design-gate
    instruction the goal head paraphrases, including the same stale
    cross-reference verbatim; (2) batch_checkpoints[0].outcome credits
    KN-LIT-7637 among the FAEST primary sources filed by BATCH-001, but
    KN-LIT-7637 is "Ten Advances in Mathematics and Theoretical Computer
    Science" (OpenAI, added 2026-08-01), with zero case-insensitive matches for
    "faest" in the file. This decision fixes the citation basis and opens the
    next batch on it. It is a control-plane act; it asserts nothing about FAEST.
  decision: supersede
  decision_vocabulary_note: >-
    `supersede` HERE MEANS EXACTLY TWO THINGS: correcting a citation basis by
    reference, and opening a design gate. IT IS NOT an approval of any Executor
    run; NOT an admission of any idea to experiment design beyond what
    DEC-20260731-021 already admitted; NOT a freeze or approval of any
    experiment contract; NOT a hypothesis status change (GOAL-FAEST-001 has no
    H-FAEST-* record and none is created); NOT a claim-tier movement; NOT an
    evidence promotion; and NOT an assertion of any kind about FAEST's security,
    its claimed NIST category, or the tightness of any link in its claim chain.
    Nothing is renamed, remapped, or edited: DEC-20260731-020 remains a valid,
    untouched GOAL-ECDLP-001 record and DEC-20260731-021, DEC-20260731-009 and
    DEC-20260731-010 are untouched as records. What is superseded is a set of
    CITATIONS, not any record.
  decision_scope: >-
    (a) DEC-20260731-021 is adopted as the authoritative BATCH-001 closing
    decision for GOAL-FAEST-001, superseding by reference the DEC-20260731-020
    citation in the goal head's next_action, the same citation in
    batch_checkpoints[0].decision_id, and the identical stale cross-reference
    inside DEC-20260731-021's own next_actions[0]. (b) The BATCH-001
    checkpoint's primary-source list is narrowed to KN-LIT-7619, KN-LIT-7620 and
    KN-LIT-7638; the KN-LIT-7637 credit is withdrawn. (c) BATCH-0ed590 opens as
    a single design gate. Nothing else in the campaign moves.
  target_ids:
    - GOAL-FAEST-001
    - RQ-FAEST-001
    - BATCH-0ed590
    - BATCH-001
    - DEC-20260731-021
    - DEC-20260731-020
    - CORR-20260810-fd5a0e
    - TASK-20260810-0feb81
    - EV-FAEST-001
    - EV-FAEST-002
    - IDEA-20260731-019
    - IDEA-20260731-002
    - IDEA-20260731-003
    - IDEA-20260731-004
    - IDEA-20260731-005
    - IDEA-20260731-006
  batch_id_form_note: >-
    BATCH-0ed590 IS THE BATCH THAT DEC-20260731-021 next_actions[0] AND THE GOAL
    HEAD REFER TO AS "BATCH-002". Those instructions were written before
    random-token identifiers were mandatory. AGENTS.md rule 14 forbids any NEW
    record using the legacy three-digit form, so the instruction recorded as
    "BATCH-002" is fulfilled under the identifier BATCH-0ed590, allocated with
    tools/allocate_id.py and verified free before use. No directory, record, or
    receipt is renamed by this: no BATCH-002 was ever created under this goal,
    so there is nothing to remap and AGENTS.md rule 15 is not engaged.
  rationale:
    - >-
      CITATION INTEGRITY IS A BINDING RULE, NOT HOUSEKEEPING. AGENTS.md rule 10
      requires every conclusion to cite the records that support it. A goal head
      whose closing decision resolves to another campaign's record cannot
      support the batch it authorises, and every downstream FAEST record would
      inherit the broken basis. The defect is verified by direct read, not
      inferred: DEC-20260731-020 carries goal_id GOAL-ECDLP-001 and contains no
      FAEST content, while DEC-20260731-021 carries the FAEST context, the
      FAEST target_ids, and the very instruction the goal head paraphrases.
    - >-
      THE FIX IS BY REFERENCE BECAUSE RULE 15 FORBIDS THE ALTERNATIVE. The
      defect originated in an identifier remap at merge commit da6f4fdaf ("remap
      PR DEC-009..012 to DEC-018..021"), which moved this campaign's decisions
      into a range GOAL-ECDLP-001 already occupied. Repairing a remap with a
      second remap would break the archives that bind the current paths.
      DEC-20260731-020 stays exactly where and what it is; CORR-20260810-fd5a0e
      and this decision are the durable gloss.
    - >-
      THE KN-LIT-7637 CREDIT IS WITHDRAWN ON A VERIFIED READ, AND THE
      CHECKPOINT IS NARROWED RATHER THAN EMPTIED. KN-LIT-7637 is an OpenAI
      technical report with no FAEST content and an `added` date of 2026-08-01,
      one day AFTER the 2026-07-31 filing the checkpoint credits it in. The
      three genuine sources KN-LIT-7619, KN-LIT-7620 and KN-LIT-7638 are filed,
      carry citation_verified: true, and were confirmed present at base commit
      7df1972a4. BATCH-001's source foundation therefore stands, with one fewer
      entry than it claimed.
    - >-
      THE CAMPAIGN IS OTHERWISE READY TO PROCEED AND HAS BEEN BLOCKED ONLY BY
      THIS. All ten BATCH-001 tasks are completed, six IDEA records are admitted
      and present in ledger/proposals/, and the single declared gating
      dependency named by both EV-FAEST-001 and EV-FAEST-002 is RSF-5. Leaving
      an active goal parked on an unresolvable citation, when the underlying
      work is finished and the successor is declared, is the steering failure
      AGENTS.md "Research-direction integrity" exists to prevent.
    - >-
      RSF-5 GETS TWO DECLARED ROUTES BECAUSE DEC-20260731-021 DECLARED TWO, AND
      THE SECOND HAS VERIFIED MATERIAL. That record's next_actions[0] names
      "spec v2.0 section-security text / eprint 2023/996 full text, or ... a
      pinned faest-ref commit as ground truth". Route B is not hypothetical:
      KN-LIT-7619 pins faest-ref main HEAD
      2a2c36d96f8e6d2b7acda341741892099e8c5cc1 (2026-07-24) and version 2.0.5 at
      55b52681b4d962df9f55f4e403a68bca98b10d37 (2026-07-02), and lists the
      twelve parameter variants (faest_128f/s, 192f/s, 256f/s and the
      Even-Mansour faest_em_* set) plus the source layout (aes.c/h, bavc.c/h,
      fields.c/h, vole.c/h, owf.c/h, instances.c/h, universal_hashing.c/h,
      random_oracle.c/h, utils.c/h, meson.build).
    - >-
      BUT ROUTE B IS NOT PRE-JUDGED, AND THE GATE MAY FAIL. KN-LIT-7619's own
      "Limits" section records that its citation_verified: true covers "the
      repository's existence, identity, license, layout, and HEAD/version as
      observed on 2026-07-31 via the rendered page and atom feed" and that "Code
      contents were not fetched or audited". It establishes repository METADATA,
      not that the C source text is fetchable now. Whether the parameters can
      actually be extracted is precisely what BATCH-0ed590 must determine.
    - >-
      A DOUBLE-ROUTE FAILURE IS AN ACQUISITION BLOCKER, NOT A RESULT. If both
      routes fail the gate returns that as pause-condition-#2 material for the
      Coordinator to rule on. Under AGENTS.md rule 5 and CLAUDE.md core rule 3 a
      blocked fetch, a timeout, or a network refusal is infrastructure signal
      and is NEVER negative mathematical evidence about FAEST in either
      direction.
    - >-
      THE SOURCE-ACQUISITION BLOCKER ONCE HELD AND IS NOW CLEARED, AND BOTH
      FACTS ARE CARRIED. Pause condition #2 DID hold on 2026-07-31: the probe at
      coordination/goals/GOAL-FAEST-001/source-acquisition-probe-20260731.md
      records the full declared preference order exhausted (NIST CSRC,
      faest.info and eprint.iacr.org all 403; faest-sign GitHub repos 403;
      GitHub API scoped to aburan28/crypto-autoresearcher only). It was
      subsequently cleared by the filing of KN-LIT-7619, KN-LIT-7620 and
      KN-LIT-7638. This decision neither re-asserts a cleared blocker nor erases
      that it once held.
