  limitations:
    - >-
      Toy tier only (fields 18-24 bits; degrees 17-29; r <= 2^24). No
      statement at medium or cryptographic sizes, no exponent claim, no
      index-calculus claim, no speedup over the generic floor, no wall-clock
      claim (all measured runs L0; counts are the result).
    - >-
      The koblitz "advance" must be quoted with its scope every time: a
      constant-level, toy-scale fact about the reference walk's fixed set-up.
      Dropping the scope would be a claim-tier violation.
    - >-
      The prime "trade" is not a ranking. bsgs.negation and rho.negation are
      incomparable on the two deciding axes; the frontier now carries both.
    - >-
      Strength preliminary: one epoch, one host class. The KN-FIND promoted
      here carries confidence `reported` and the same proof_status
      (empirical_only) and strength as its evidence records; it is to be
      superseded, not edited, when epoch 2 or a cross-host replay lands.
    - >-
