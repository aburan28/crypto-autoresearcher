  rationale:
    - >-
      Both verdicts are admissible on every rule the protocol names: audit
      ok with zero problems, 288/288 replays reproduced, 4 sizes with 24
      verified runs each, spec_matches true, incumbent fresh measurement
      inside its recorded interval (prime 1.406 [1.270, 1.531] vs recorded
      1.466 [1.278, 1.653]; koblitz 16.886 [9.156, 25.275] vs recorded
      16.794 [9.107, 25.310]), A/A control exactly 1. Neither is
      inadmissible, so AGENTS.md rule 3 is not engaged and the verdicts are
      evidence (EV-BND-4b8a88 OBS-6/7, EV-BND-bf659a OBS-6/7).
    - >-
      Every prediction of H-BND-3b83a3 is met as the challenge's own
      acceptance rule scores it: P1 ops better and memory worse with
      intervals excluding 1 (trade); P2 ops and memory both better with
      intervals excluding 1 and the move located in setup (incumbent setup
      share 0.713 vs candidate 0.356, paired setup ratio 0.163); P3
      exponent_moved false in both. Direction supports on both records.
    - >-
      The prime trade is the textbook time-memory trade: bsgs.negation
      buys 0.825 of rho.negation's operations with a 0.50 sqrt r table
      against the walk's 0.03 sqrt r. It is a new Pareto point on the
      prime-toy frontier and nothing more; it does not dominate rho.negation,
      and in the rebuilt frontier the prime-toy ops leader remains the
      earlier calibration bsgs.negation bound ECBND1he8163c29cc39 (1.100
      [0.978, 1.225]), with which the new bound ties.
    - >-
      The koblitz advance is a CONSTANT-level statement at toy scale about
      the reference, not about the method: the strong lock-step walk's 32-lane
      set-up is a fixed charge that is 71 % of its total when sqrt r is a
      few hundred, and the lean tuned walk pays 36 %. Both fitted exponents
      (0.126 and 0.229) carry the fixed-cost signature, not a law. It says
      nothing about rho.signed_frobenius_strong at medium scale, where the
      sealed bound ECBND1h05a2ea918f3c measures it at 1.089 [0.927, 1.261] x
      floor over degrees 41-61 and no verdict exists.
    - >-
      Strength is preliminary, not replicated: one epoch, one session, one
      host class per challenge, and the audit ran on the same machine
      (docs/bounds-and-frontiers.md section 2 ladder). The seed replication
      within each session (96 pairs, 3 rounds, 4 curves) and the agreement
      of each incumbent's fresh figure with a bound measured in an earlier
      session on a different binary and env class are real corroboration,
      but they are not the second epoch or the other host class the ladder
      names.
    - >-
      The frontier in the measuring repository moved to ECFR1h8b45b672c283
      on these verdicts; this ledger adopts the two sealed bound figures as
      measured known-results rows (KR-RHO-cd0049, KR-RHO-1c2928) at toy tier
      so that ideation positions against measured constants rather than
      against numbers nobody measured. A measured row never outranks a
      proven one and never crosses a tier.

