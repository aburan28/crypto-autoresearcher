      because the orchestrator's hash listing used a wrong filename; the
      record's content was read directly at the commit.
    - >-
      The merge of branch bounds-medium-seeds into main (PR #1431) and the
      46-bound count of the rebuilt frontier are the orchestrating session's
      and lane report's statements respectively; this decision binds to the
      commit sha and the frontier id and sha256, which were read directly.
    - >-
      No independent validator or red-team pass ran on these two records;
      the Coordinator's own validity check (context above) is the only
