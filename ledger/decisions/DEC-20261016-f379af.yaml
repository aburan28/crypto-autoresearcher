  mode: evidence_review
  decision: support
  decision_label: >-
    Support H-ENDO-c9f324 (approved -> analyzed -> supported) at the
    measured single-host tier, for other/BADA55-VPR-224 on this host with
    bench.c at cc -O2 -march=native only. Strength preliminary; the
    independent-runner replication is the named next step.
  target_ids:
    - H-ENDO-c9f324
    - EXP-ENDO-33a1ee
    - EV-ENDO-118b3a
    - RUN-ENDO-bc1b14
    - CORR-20261016-37897c
    - RQ-ENDO-476761
    - IDEA-20261016-15a6fc
  context: >-
    RUN-ENDO-bc1b14 is the single frozen timed run of four arms (A0 E, A1
    persistent, A2 one-shot, A3 A/A) on other/BADA55-VPR-224, the only
    RUN-ENDO-d7cb69 positive with no GLV competitor, and on the
    P-256-neighbour positive control. It was snapshot-archived by
    TASK-20261016-8a9451 (6033c3f08) and passed independent validation
    TASK-20261016-35d324. The validator found one provenance defect (the
    recorded cc string) and visible but symmetric host contention.
  validity: >-
    Valid and complete: 1 of 1 runs, 64 points x 41 repetitions x 4 arms per
    curve, correctness true on both curves and recomputed 512/512, bootstrap
    replayed exactly and re-derived independently, inputs re-checked, code
    audited (EV-ENDO-118b3a validity_check). The cc-string defect is
    recorded in CORR-20261016-37897c and changes no value.
  gate_outcomes:
    correctness: pass (both curves)
    AA_target: 'pass: 0.9989 [0.9923, 1.0101] contains 1, within [0.95, 1.05]'
    AA_control: 'pass: 1.0002 [0.9864, 1.0060] contains 1, within [0.95, 1.05]'
    positive_control: 'pass: control A1/A0 upper bound 0.9316 < 1'
  rationale:
    - >-
      The frozen gate_resolution releases the target inference: correctness,
      both A/A gates and the positive control pass.
    - >-
      The frozen success criterion is met: target A2/A0 = 0.9693, 95 % CI
      [0.9647, 0.9767], upper bound below 1. Persistent A1/A0 = 0.9324
      [0.9220, 0.9423]. The falsification and inconclusive branches do not
      apply. No criterion was relaxed or tightened.
    - >-
      Contention bursts (17/41 and 19/41 repetitions, 1.2-1.9x) are spread
      evenly across arms and rotation slots, show no drift, and dropping them
      leaves every gate outcome and interval side unchanged (validator B4).
      They are a limitation of the host, not a confound of the arm contrast.
    - >-
      The frozen decision_impact.on_positive reads "Record that the
      model-change arm is supported at the measured tier for
      other/BADA55-VPR-224, this host, bench.c and cc -O2 -march=native only."
      The hypothesis statement is itself scoped to "the same implementation
      ... on the same host". Support is applied in exactly that scope. The
      result was predicted (a positive saving below the modelled one), is a
      small constant-factor known-scalar effect, and is not surprising or
      high-impact, so the replicate-first rule for surprising results does
      not override the frozen branch.
    - >-
      Strength stays preliminary: one curve, one host, one compiler, an
      untuned generic A0, unreplicated.
  evidence_refs:
    - ledger/evidence/EV-ENDO-118b3a.yaml
    - ledger/corrections/CORR-20261016-37897c.yaml
    - experiments/EXP-ENDO-33a1ee/analysis.md
