    - experiments/EXP-ENDO-33a1ee/runs/RUN-ENDO-bc1b14/target/timings.json
    - experiments/EXP-ENDO-33a1ee/runs/RUN-ENDO-bc1b14/control/summary.json
    - experiments/EXP-ENDO-33a1ee/runs/RUN-ENDO-bc1b14/control/timings.json
    - experiments/EXP-ENDO-33a1ee/archive/TASK-20261016-8a9451.receipt.yaml
    - experiments/EXP-ENDO-33a1ee/reports/run-20261016T1955Z/report.typ
  scoped_claim: >-
    On other/BADA55-VPR-224, on one shared KVM host (Intel Xeon 2.80 GHz,
    4 vCPU), in harness/endosweep/isobench/bench.c (4-limb CIOS, S = M)
    compiled with cc 13.3.0 -O2 -march=native, one-shot variable-base k*P
    routed through the 5·5-isogenous neighbour's a = -3 model takes 0.9693
    (95 % CI 0.9647 to 0.9767) of the time of k*P on E with E's generic-a
    doubling, a 3.07 % saving; the persistent form takes 0.9324 (0.9220 to
    0.9423). 64 paired inputs, 41 repetitions. The modelled savings were
    11.44 % and 15.21 %. No other curve, host, compiler or implementation;
    no fixed-base, constant-time or ECDLP statement; wall time is not a
    measured bound.
  limitations:
    - One shared host without pinning or isolation; contention visible (symmetric).
    - Generic CIOS arithmetic and an untuned A0; a tuned E-side implementation could narrow the gap.
    - One curve; BADA55-VPR-224 is a published demonstration curve, not a deployed standard (recalled pointer, not relied on).
    - The prediction and the A/A margin were written with the smoke values in view (disclosed); the criteria are interval-sign criteria.
    - Correctness checked on repetition-0 outputs.
    - Heuristics H1-H3 of IDEA-20261016-15a6fc are not validated; the route cost of H3 is embedded in A2, not isolated.
  procedure_deviations:
    - >-
      No review_plan was written before TASK-20261016-35d324 ran; the
      Coordinator prior is the frozen specification's preregistered
      prediction and gate_resolution. One validator covered both runs. The
      session should run check_review_independence.py and record the output
      in the archive receipt.
  progress_fidelity: >-
    Not triggered. docs/progress-fidelity.md covers cryptanalytic speedups,
    ECDLP work-factor reductions and attack-level improvements; this is a
    constructive known-scalar arithmetic measurement. If a reviewer reads it
    otherwise, a claims/*.json record is added in a separate change. This
    record is not edited.
  next_actions:
    - >-
      Ranked follow-ups for this lane, recommended and not approved here
      (common ranking with DEC-20261016-5752c0 and DEC-20261016-4f3a1a): (1)
      fix isoglv's one-shot pricing and re-run the combined screen; (2) a
      timed bench of the combined route on other/Tom-384 against GLV on E;
      (3) the ecbench independent-runner replication of this experiment, with
      core pinning and isolation, frozen as a new contract. Item (3) is the
      frozen on_positive next step. It ranks third because it can only
      harden a narrow claim on a non-deployed demonstration curve. Items (1)
      and (2) decide whether the combined route, which applies to four
      classes, survives at all.
    - >-
      If (3) reproduces the one-shot interval below 1, promote a KN-FIND
      scoped to the replicated hosts at that review.
  knowledge_promotion:
