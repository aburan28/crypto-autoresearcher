    null_fields: []
    result: complete

  rationale:
    - >-
      Stage 0 is the calibration the census needs: kappa is read as an excess
      over the generic collision count, and this experiment fixes, on
      committed data, whether the engine actually sits on that floor (odd m)
      and by how much it sits above it (even m).
    - >-
      Zero new compute and zero risk to immutable records: the committed files
      are read, never written; no solver module runs (invalidation I-3).
    - >-
      Double counting is excluded by construction: the min_index twin files
      re-solve the same instances and enter only as an exact consistency check,
      never as fitted points.
    - >-
      The generator's predictions and falsification conditions are adopted
      verbatim; where its point windows and interval-based falsification can
      disagree at toy scale, the outcome table says in advance how the
      disagreement is recorded (OUT-SLOPE-INTERVAL) and forbids a
      reject_scoped reading on this single, empirical-only re-read.
    - >-
      Direction of the program: this is a screen, not a lever. It prices every
      structured proposal in the RQ-PFDR-ae2fba lane against an explicit
      generic bound, which is the exponent-level question the target profile
      asks about. It is recorded as exactly that.

