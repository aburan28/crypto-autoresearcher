    re-read of committed rows with its own falsification conditions (a
    below-floor row, an odd-m slope interval excluding 0, an even-m interval
    excluding 1/(2m)), while the census needs new code, a regression gate and
    new cells. So two hypothesis/experiment pairs were written; this decision
    covers the Stage 0 pair. The committed rows (README sections 3-5) report
    mitm S_3 exponents 0.66-0.67, 0.75, 0.60, 0.68, 0.58 at m = 3..7 and 0.92|F|
    relations at m = 3; the generator's back-of-envelope ratios from 32-bit
    medians are about 1.5-1.7 (m = 3), 3.3 (m = 5), 6.9 (m = 7), 27 (m = 4),
    25 (m = 6), which the experiment recomputes per row.

