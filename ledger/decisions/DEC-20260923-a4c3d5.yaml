      relaxed, and none could be without a protocol_amendment.
    - >-
      CA-8 and core rule 5. Every break is an instrument, custody, tool,
      provenance or labelling defect. So the response is revise, never weaken
      or reject. Nothing about any hypothesis is refuted.
    - >-
      The strong parts of the design are kept for the revision. They are the
      three determinate construction recipes, the typed costs confirmed
      against both source versions, the descriptive-bin design with a frozen
      null arm, the stage order, the certificate route, and proves-too-much
