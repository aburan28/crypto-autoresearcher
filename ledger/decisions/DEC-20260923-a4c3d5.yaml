# =============================================================================
# DEC-20260923-a4c3d5 -- GOAL-AUXIN-a93442: compose REVIEW-AUXIN-20260923-09aadd
# (five joints, three owners) on AMD-EXP-AUXIN-7e2e3d-20260923-d1d10.
#
# THE RULING IN ONE PARAGRAPH. The amendment is REFUSED; decision REVISE. Its
# three construction-control recipes are fully determinate: a structurally
# blind re-derivation agreed with the validator on every value both computed.
# Its typed costs match both retrieved versions of Cheon's paper, and every
# proves-too-much object meets its failure signature. But J1 breaks on tool,
# instrument-text, pin-determinacy and custody defects. J5 breaks on a labelling
# rule that mandates a same-unit sentence the sources contradict, and on
# over-scoped sentences. K-indeterminate fires on choice points the text leaves
# open outside those three recipes. K-hypothesis fires, so the typed successor
# H-AUXIN-6db354 and the unit correction CORR-20260923-f5f060 are filed here.
# Every break is an instrument, custody, tool, provenance or labelling defect.
# None is a mathematical result and none is evidence about any curve.
#
# OUTCOME DISCIPLINE. No census value, minimising divisor, escalated-curve list,
# BATCH-ba0b0d reviewer finding value or control integer appears here. The
# reports carry the integers; they are cited by id and path.
# =============================================================================
coordinator_decision:
  id: DEC-20260923-a4c3d5
  id_provenance: >-
    Minted and reserved by the top-level session in DEC-20260923-bd46e6 with
    tools/allocate_id.py --next and --check. This agent holds no shell.
  recorded_at: '2026-09-23'
  decided_at: '2026-09-23'
  decided_by: coordinator
  goal_id: GOAL-AUXIN-a93442
  batch_id: BATCH-09aadd
  question_id: RQ-AUXIN-f8d8c0
  task_id: TASK-20260923-d80a73
  owned_by_archive_task: TASK-20260923-b9fee8
  archived_by: TASK-20260923-b9fee8
  review_plan_id: REVIEW-AUXIN-20260923-09aadd
  opened_by_decision: DEC-20260923-bd46e6
  queue_revision: >-
    BATCH-09aadd-rev-1, committed at 5a80f16e6c BEFORE any file of this
    composition was written. It adds ledger/hypotheses/H-AUXIN-6db354.yaml and
    ledger/corrections/CORR-20260923-f5f060.yaml to TASK-20260923-d80a73's
    write_scope and artifact_paths, and both ids to TASK-20260923-b9fee8
    archive.record_ids. The dispatcher still passes 11/11 gates after it, as
    the session reports.

  decision: revise
  decision_label: >-
    REFUSE AMD-EXP-AUXIN-7e2e3d-20260923-d1d10. It is not approved and
    authorizes nothing. Return to protocol design: a NEW additive amendment
    under the typed successor hypothesis H-AUXIN-6db354, discharging every
    defect listed in undischarged_defects, reviewed under a new plan written
    first. No run. No status transition of any existing record.
  amendment_ruling:
    amendment_id: AMD-EXP-AUXIN-7e2e3d-20260923-d1d10
    amendment_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260923-d1d10.yaml
    ruling: refused
    standing_authorization_note: >-
      The AGENTS.md standing user authorization makes user approval
      unnecessary. It does not make an incomplete or defective protocol
      approvable. Protocol readiness is a Coordinator duty, and the composition
      keys K-revise-defect and K-indeterminate apply.
    amendment_file_not_edited: >-
      The amendment and its design report are immutable and are not edited.
      Their approval block reads review_required, and per its own
      approved_if_and_only_if the amendment is not approved under this
      decision.

  context: >-
    DEC-20260923-ce06a6 ruled RUN-AUXIN-fd1edc invalid as evidence and returned
    the lane to protocol design with defects D1 to D10. DEC-20260923-bd46e6
    opened BATCH-09aadd and froze REVIEW-AUXIN-20260923-09aadd before the
    amendment existed. The producer TASK-20260923-5a2cbc wrote the amendment
    and its design report. They were snapshot-bound by TASK-20260923-5ff07e.
    Three independent reviews returned. The validator TASK-20260923-c78ddf
    (VAL-20260923-c3c90c) owns J1 and J3. The red team TASK-20260923-635c5c
    (RT-20260923-38bbbf) owns J2 and J5. The blind re-deriver
    TASK-20260923-edaa75 (rederivation-report) owns J4. TASK-20260923-e45db2
    sealed all six report files. This decision is the composition,
    TASK-20260923-d80a73, run in a Coordinator session that did not run
    TASK-20260923-5a2cbc (CA-11).

  # ---------------------------------------------------------------------------
  # 0. GATE CHECKS BEFORE COMPOSING (CA-2, CA-3). All are the top-level
  #    session's reported tool outputs; this agent holds no shell.
  # ---------------------------------------------------------------------------
  gate_checks_session_output:
    check_review_independence: >-
      `python3 tools/check_review_independence.py --plan
      coordination/review/auxin-20260923-09aadd/review-plan.yaml --reports
      coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-09aadd/reviews/`
      PASS. Three reports; every joint owned and attested; blindness
      respected; controls declared.
    blind_history: >-
      --blind-history against BATCH-ba0b0d (12 protected values) PASS on the
      exact dispatch ref of TASK-20260923-edaa75, 932461ef53, before that task
      was dispatched. It also passed on every later HEAD, including 43c00335ae.
      The same check against BATCH-458763 (11 values) passes.
    amendment_token_check: >-
      Before J4 was dispatched, every token of the amendment and of the design
      report was hashed against both batches' protected digests, with 0 hits.
      Every token of all six review files was hashed the same way, also with 0
      hits.
    seal_CA3: >-
      All six review files match
      coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-09aadd/seal/review-seal.yaml
      byte for byte (sha256). No mismatch, so composition is not voided.
    mechanical_J3_J4_integer_parse: >-
      The session parsed the 19 control integers that both J3 and J4 report
      for C-PLANT-M, C-PLANT-P and C-INERT, and found all 19 equal. One pair is
      equal through notation only: J3 writes C-INERT's w0 as a power of two,
      and J4 writes it in decimal.
    custody: >-
      research_dispatch.py exits 0 with 11/11 gates. The opening archive
      verifies on 16 path hashes at 2e5f01b59e, and the design snapshot on 3
      path hashes. origin/main 39b5913c87 was merged at 240bcc4bb4 before the
      claim and touches no path of this batch. validate_ledger.py reports 94
      errors, the pre-existing baseline, none attributable to this batch.
    object_custody_in_reports: >-
      Both reviewers who read the producer files hashed them against
      TASK-20260923-5ff07e's path_sha256 and report a match (VAL custody_VA1;
      RT custody_RA1).

  reviewer_disclosed_out_of_scope_reads:
    weighed: >-
      (a) The validator saw commit subject lines of TASK-20260923-edaa75 (two
      subjects, no file content), and ran git show on the producer commits for
      custody. (b) The red team's repository-wide grep -rl for its own report
      id scanned sibling directories and displayed nothing. It read the
      BATCH-ba0b0d red-team report lines holding the PTM-2 construction, which
      PTM-A requires. It also read tools/allocate_id.py and the orchestration
      adapter. (c) The producer disclosed reading BATCH-ba0b0d red-team lines
      beyond the construction. It used only the construction form, and C-INERT
      has a fresh start. (d) The blind re-deriver read only its six whitelisted
      paths and ran no git command.
    ruling: >-
      None of these reaches J4's inputs or carries a control integer between
      reviewers. The check tool passes. They do not change any composition
      below.

  # ---------------------------------------------------------------------------
  # 1. TRIPWIRES (CA-6). Ruled before composing.
  # ---------------------------------------------------------------------------
  tripwire_ruling:
    fired: none
    basis: >-
      VAL-20260923-c3c90c records T1, T2 and T3 not fired, with reasons.
      RT-20260923-38bbbf records the same after a keyword sweep of both
      producer files. The rederivation report asserts no cost as attainable and
      no closure. This Coordinator read the amendment and design report in
      full and concurs. The BN254-r disambiguation names a parameter source
      only. Typed exponents are declared as leading expressions, not
      attainable costs. The design report's reference to practically
      unreachable inertness restates CORR-20260923-5c5a23 S3 and asserts no
      new closure. Composition proceeds under review-adversarial.

  # ---------------------------------------------------------------------------
  # 2. J3 VERSUS J4, VALUE BY VALUE (CA-4), done before any key is applied.
  # ---------------------------------------------------------------------------
  j3_j4_comparison:
    sources: >-
      J3: VAL-20260923-c3c90c J3.attack_i_controls_built and
      computations.json gates_output (TASK-20260923-c78ddf). J4:
      rederivation-report.yaml Q0 to Q3 (TASK-20260923-edaa75). Integers are
      not reproduced here; both files carry them.
    tolerances: >-
      Plan blind_rederivation.agreement_tolerance: Q1 exact integers, Q2 exact
      categorical values, Q3 within 0.01 bit on log2 of each cost.
    Q1_integers: >-
      AGREE. This Coordinator read both files and checked each pair itself.
      All 19 named integers of C-PLANT-M (9), C-PLANT-P (6) and C-INERT (4) are
      equal, confirming the session's mechanical parse. The six search counts
      (d1, d2 and u for C-PLANT-M; d and w for C-PLANT-P; w for C-INERT) are
      also equal under the convention "integers stepped, including the
      accepted one". J3 declares that convention, and J4 reports it among
      three conventions (its Q0-4).
    Q2_classifications: >-
      AGREE on all six branches. Status is EXACT on both sides; J4 reaches this
      under its Q0-2 reading (a). Bin, boundary_flag, reported minimiser, full
      tie set and number of divisors enumerated are equal on every branch. The
      minus-branch tie on C-PLANT-M resolves to the same smaller member on
      both sides, as definitions.minimiser_and_ties requires. Depths agree to
      every digit both report.
    Q3_typed_costs: >-
      AGREE, far inside tolerance. The typed exponent at the minimiser agrees
      to at least 50 significant digits on all six branches (J3
      computations.json gates_output e against J4 Q2 e_b_at_minimiser). The r
      values are identical, so the log2 of each cost differs by far less than
      0.01 bit. log2(2d) agrees on the three plus branches. e minus F agrees
      on every branch.
    C_FIELD: >-
      NOT COMPARABLE AS INTEGERS. J3 built both cases from the source files,
      with one representation choice on case 2, reported under J1 as choice
      C3. J4 could not derive either integer from the amendment text alone,
      because the recipe is a reference to files outside the text (Q0-1). The
      categorical outcome agrees: both sides report rejected, reason
      field_prime, before any factoring.
    choices_reported: |-
      J3 reports one open choice in its control section: the C-FIELD case 2
      representation. J4 reports twelve choice points, Q0-1 to Q0-12. Their
      effect on Q values is as follows.
      - Q0-1 blocks the C-FIELD integers.
      - Q0-2 makes the control status depend on the frozen budget.
      - Q0-3 leaves the confounder check on controls dependent on Stage P
        values.
      - Q0-4 is the candidate-count convention.
      - Q0-7 leaves open whether the tie tolerance is relative in e or in T.
      - Q0-8 leaves open whether the boundary tolerance is absolute or
        relative.
      - Q0-9 is the gate evaluation mode, where one gate margin lies below the
        path-agreement tolerance.
      - Q0-10 leaves open whether the null arm counts as a control.
      - Q0-5, Q0-6, Q0-11 and Q0-12 affect only work, certificate artifacts
        or presentation.
      J4 records that none of them changes a Q1, Q2 or Q3 value for the three
      construction controls.
    comparison_result: >-
      Exact agreement on every value both implementations computed. Choices
      the text left open are reported by both. Under the plan's key
      K-indeterminate, the second fact alone makes the decision revise on D5,
      whichever implementation looks right.
    what_the_agreement_does_not_cover: >-
      No control has a BOUND branch, so J3/J4 agreement says nothing about the
      D3 BOUND rules (RT-20260923-38bbbf X2, O9). It also says nothing about
      the run pipeline's blind factorization. Both reviewers ran PARI factor()
      on the controls only as an emulation.

  # ---------------------------------------------------------------------------
  # 3. COMPOSED DISPOSITION PER JOINT (CA-1, CA-7). Keys applied as written.
  # ---------------------------------------------------------------------------
  joints:
    - joint: J1 (pins, factoring, certificates, custody, additivity; D1, D6, D7, D8, D10)
      owner: TASK-20260923-c78ddf
      reviewer_verdict: breaks
      composed_disposition: breaks
      key_applied: K-revise-defect
      basis: |-
        The plan's J1 breaking artifacts are met on several counts.
        - D6 and D6/tools: the declared GMP-ECM and PARI/GP are absent from
          the environment (F-J1-1). The admission clause asks for a version
          command GMP-ECM does not answer (F-J1-2). The ECM curve count per
          level is read from a table the text does not index (F-J1-3).
        - D1: the parse rule does not determine an integer from the
          sp800-186 spans without choices C1 to C3, and line numbering and
          HTML-to-text conversion are undeclared (C5, C6; F-J1-9). The
          BLS12-381-r literal locator fails against the latest retrievable
          revision of its named source (block name and family parameter).
        - D8: the snapshot clause leaves imports from outside
          implementation/d1d10/ unbound (F-J1-7).
        D7 holds: a certificate was produced and checked by a library-free
        verifier, and tamper cases were rejected. D10 holds: both frozen files
        are byte-identical across the producer and snapshot commits.
      K_infra_not_applied: >-
        K-infra covers a joint the reviewer could not run. The validator ran
        every J1 step, installing both tools under scratch. So the joint is
        composed as breaks, not inconclusive.
      CA8_statement: >-
        Every J1 break is a tool, instrument-text, pin-determinacy, custody or
        provenance defect. None is a mathematical result, none is negative
        evidence about any curve, and none bears on the typed costs. The tool
        absence (F-J1-1) is a provisioning matter for any later executor
        environment, not a fault in the amendment's mathematics.
    - joint: J2 (typed costs and predicate; D2, D3)
      owner: TASK-20260923-635c5c
      reviewer_verdict: holds
      composed_disposition: holds
      key_applied: >-
        None breaks on J2. It satisfies its part of K-approve, but K-approve
        cannot apply to the round because other keys fire.
      basis: >-
        Both typed leading expressions and both input models match Cheon 2006
        Theorems 1 and 2 (IACR archive copy) and the 2010 author manuscript
        term by term. Both were retrieved and read by TASK-20260923-635c5c. The
        reopen condition of CORR-20260923-187ea3 is not met. Toy evaluations
        agree with hand values. The D3 rules return text-determined values on
        every constructed unfactored and r + 1 witness row. No
        frozen-expression plus value can enter a cost column.
      carried_non_breaking: >-
        O9 (no in-run BOUND control; RC1), O10 (several composite parts), O11
        (bin-clause precedence at 3/4), O12 (ERH and generator conditions not
        carried), O13 (memory not tabulated), and O14 (cite Theorem 2, not the
        2006 abstract). The amendment's D2 provenance field says the 2010
        version was read by no one; TASK-20260923-635c5c has now read it.
    - joint: J3 (calibration and control constructibility; D4, D5)
      owner: TASK-20260923-c78ddf
      reviewer_verdict: holds
      composed_disposition: >-
        holds on D4 and on the three construction recipes. The joint falls
        under K-indeterminate through its reported C-FIELD choice.
      key_applied: K-indeterminate
      basis: >-
        All three construction controls were built from the text with no
        choice. Each lies inside its windows, satisfies its acceptance rule,
        has exactly B bits and carries verified certificates. The planted
        r + 1 divisor has the declared size and is the T_plus minimiser.
        Escalate semantics are removed, no threshold's location depends on a
        deployed-row outcome, the null arm is frozen and read by no rule, and
        stages C and N precede D. K-indeterminate names "either reports a
        choice the text left open", and J3 reports the C-FIELD case 2
        representation choice. Minor findings F-J3-1 (sentences conflicting
        with N3) and F-J3-2 (incomplete threshold inventory) are carried. So
        is the precision sensitivity of the C-PLANT-P lower gate (also J4
        Q0-9).
    - joint: J4 (blind determinacy of the control recipes)
      owner: TASK-20260923-edaa75
      reviewer_verdict: inconclusive (by design, BL-5; comparison forbidden to the re-deriver)
      composed_disposition: >-
        agrees with J3 on every Q1, Q2 and Q3 value both computed (see
        j3_j4_comparison). Indeterminate by key, because the re-deriver
        reports choice points the text left open, including C-FIELD integers
        not derivable from the text.
      key_applied: K-indeterminate
      K_infra_not_applied: >-
        The re-deriver ran to completion. Its "inconclusive" is the
        by-design verdict of a blind task that may not compare, and
        composition supplies the comparison. It is not a joint the reviewer
        could not run.
    - joint: J5 (labelling, scope, proves-too-much; D9)
      owner: TASK-20260923-635c5c
      reviewer_verdict: breaks
      composed_disposition: breaks
      key_applied: K-revise-defect
      basis: |-
        change.D9_labelling.rule mandates, in every run artifact and citing
        record, an annotation that the rho column is "in the same
        group-operation unit" as the typed exponents. Both retrieved source
        versions state the typed costs with a factor the table drops. That is
        an unlabelled unit claim, the plan's J5 breaking artifact (O1/S1). Its
        origin is CORR-20260923-5c5a23 S4, corrected by CORR-20260923-f5f060
        in this act. Further findings, each against its sentence:
        - S3/O3: the plus-branch secondary metric is unlabelled.
        - S2/O2: the control-transfer sentence is over-scoped.
        - S4/O4: the design-report sentence on control coverage at the
          largest sizes is refuted by a constructed counterexample.
        - S5/O5: the null-measurement scope is extended beyond 256 bits.
        - S6 to S8 (O6 to O8): three sentences are imprecise.
        PTM-A to PTM-D all meet their failure signatures in the rules
        themselves: the inert construction is not flagged, the field prime is
        rejected before factoring, no category is read as curve-specific on
        random primes, and no plus cost above sqrt(r) prices below it.
      CA8_statement: >-
        A labelling and scope defect in text. It is not a mathematical result
        and says nothing about any curve.

  unowned_or_unattested_joints: >-
    None. Five joints, three owners, all attested (checker PASS).

  # ---------------------------------------------------------------------------
  # 4. K-HYPOTHESIS.
  # ---------------------------------------------------------------------------
  hypothesis_ruling:
    key_applied: K-hypothesis
    trigger: >-
      The design report's hypothesis_restatement_proposal finds that the
      H-AUXIN-66e6fd statement cannot be typed without changing it. The red
      team concurs (RT-20260923-38bbbf X3), resting on its J2 comparison, which
      holds: the single E(r) applies the r - 1 expression to both branches,
      while both source versions cost r + 1 with a linear d term and 2d powers.
    records_filed_by_this_decision:
      - id: H-AUXIN-6db354
        path: ledger/hypotheses/H-AUXIN-6db354.yaml
        what: >-
          The typed successor, status proposed. It has two separate branch
          exponents with their input models and the cost-unit statement, and
          asserts no dichotomy and no threshold. Its falsification conditions
          do not depend on a particular amendment. It is approved only with a
          future approved revised protocol.
      - id: CORR-20260923-f5f060
        path: ledger/corrections/CORR-20260923-f5f060.yaml
        what: >-
          Supersedes, additively, the unit phrase of CORR-20260923-5c5a23 S4
          (the reading of completion criterion 1). Without it, S4 would bind a
          revised design to the sentence J5 found defective.
    H_AUXIN_66e6fd: >-
      Additive status_note only, pointing to H-AUXIN-6db354. No existing key or
      value changed. Its status stays approved, as the card requires. The note
      records that no new run on the lane is authorized before a revised
      protocol is approved. Any formal status transition of that record is
      left to a later decision.
    ids_and_scope: >-
      Both ids were minted by the top-level session and declared by queue
      revision BATCH-09aadd-rev-1 (5a80f16e6c) before either file was written.

  # ---------------------------------------------------------------------------
  # 5. EVERY UNDISCHARGED DEFECT, by joint and breaking artifact.
  # ---------------------------------------------------------------------------
  undischarged_defects:
    - defect: D1
      joint: J1
      artifacts: VAL-20260923-c3c90c F-J1-9 and choices C1, C2, C3, C5, C6
      what: >-
        The pin parse rule does not fix which printed representation to use,
        and does not cover backslash continuations, expressions with lost
        superscripts or signs, or interleaved page furniture. It does not fix
        a line-terminator convention for line numbers (also RT X1). It does not
        declare the text form archived for an HTML source.
    - defect: D1
      joint: J1
      artifacts: VAL-20260923-c3c90c J1 BLS12-381-r locator_result
      what: >-
        The literal locator (block name and family parameter name) fails
        against the latest retrievable revision of its named source. A literal
        executor reaches locator_failure, and a non-literal one makes an
        undeclared choice. The source is time-dependent.
    - defect: D1
      joint: J1
      artifacts: VAL-20260923-c3c90c F-J1-6
      what: >-
        The rows pinned from derived .txt files have no step verifying digits
        against the authoritative PDF that the repository's source record
        names.
    - defect: D1
      joint: J1 (J5 PTM-B survival location)
      artifacts: VAL-20260923-c3c90c F-J1-10; RT-20260923-38bbbf O15 and RC3
      what: >-
        C-FIELD is self-referential and tests only the equality clause, which
        is the sole separator on cofactor-1 rows. The text does not say how
        multiple rejection reasons are recorded or in what order clauses are
        evaluated. A mutation check with the equality clause disabled is
        required.
    - defect: D5
      joint: J3, J4 (K-indeterminate)
      artifacts: rederivation-report Q0-1; VAL-20260923-c3c90c J3 C-FIELD case_2
      what: >-
        The C-FIELD integers are defined only by reference to files outside the
        amendment text, and case 2 needs a representation choice. The recipe
        must be determinate from the governing text.
    - defect: D5
      joint: J4 (K-indeterminate)
      artifacts: rederivation-report Q0-2, Q0-3, Q0-4, Q0-7, Q0-8, Q0-9, Q0-10 (and Q0-5, Q0-6, Q0-11, Q0-12 for completeness)
      what: |-
        Each item needs a declared convention.
        - Q0-2: control status under the budget.
        - Q0-3: the scope of the confounder check on controls.
        - Q0-4: the candidate-count convention.
        - Q0-7: whether the tie tolerance is relative in e or in T.
        - Q0-8: whether the boundary tolerance is absolute or relative.
        - Q0-9: the gate evaluation mode for a lower gate with no tolerance.
        - Q0-10: whether the null arm is a declared control.
        The other four affect work, certificate artifacts or presentation only,
        and are listed so that the next text closes them or declares them
        immaterial.
    - defect: D6
      joint: J1
      artifacts: VAL-20260923-c3c90c F-J1-1
      what: >-
        The declared GMP-ECM and PARI/GP are absent from the environment
        reviewed. This is a provisioning defect (CA-8), to be resolved before
        any executor card by an environment that passes admission. It is not a
        text defect and not a result.
    - defect: D6
      joint: J1
      artifacts: VAL-20260923-c3c90c F-J1-2, F-J1-3
      what: >-
        The admission item asks for a GMP-ECM version by commands that do not
        report it. The F3 curves per B1 level are read from a -v table over
        several factor sizes whose column the text does not fix, so the
        schedule is not determined.
    - defect: D6
      joint: J1
      artifacts: VAL-20260923-c3c90c F-J1-4, F-J1-5
      what: >-
        Seconds are not recorded per cofactor when an integer has several
        composite parts. Budget measurement and the F2 timeout mechanism are
        ambiguous when PARI runs in-process.
    - defect: D8
      joint: J1
      artifacts: VAL-20260923-c3c90c F-J1-7, F-J1-8
      what: >-
        Nothing forbids the run from importing modules outside
        implementation/d1d10/, which the snapshot would leave unbound. No rule
        requires comparing the snapshot-bound d1d10/ bytes with the launch
        commit.
    - defect: D9
      joint: J5
      artifacts: RT-20260923-38bbbf O1/S1 (decisive), X4
      what: >-
        The mandated same-unit annotation of the rho column. It is replaced by
        the unit statement of CORR-20260923-f5f060.
    - defect: D9
      joint: J5
      artifacts: RT-20260923-38bbbf O3/S3
      what: >-
        The plus-branch value of the secondary metric "largest divisor not
        exceeding isqrt(r)" is unlabelled arithmetic, not a Theorem-2 quantity.
        Label it or report it on the minus branch only.
    - defect: scope (D9 family)
      joint: J5
      artifacts: RT-20260923-38bbbf O2/S2, O4/S4, O5/S5, O6/S6, O7/S7, O8/S8
      what: |-
        The following sentences must be narrowed, withdrawn or made precise.
