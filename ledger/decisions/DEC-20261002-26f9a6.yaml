coordinator_decision:
  id: DEC-20261002-26f9a6
  context: >-
    Design tick. IDEA-20260926-89886c is the first open ECC idea and is not
    designed. IDEA-20260915-3476de is next and is not designed.
    IDEA-20260926-cafcf1 is the following open idea, and only the
    abscissa-threshold arithmetic is frozen.
  decision: approve
  target_ids:
    - IDEA-20260926-cafcf1
    - H-BINSTD-fd9d0e
    - EXP-BINSTD-3c1175
  rationale:
    - >-
      DEC-20260926-901ea1 NA-4 says not to design the m = 3 pricing contract
      until NA-2's review returns. This session did not find that review.
      IDEA-20260926-89886c stays proposed and uncited by the hypothesis and
      the experiment.
    - >-
      IDEA-20260915-3476de stays undesigned. Its decisive Boolean-native arm
      needs BRiAl, which this session did not install. The closure of
      BATCH-a33cda in DEC-20260915-927eaa does not supply that engine.
    - >-
      Standing user authorization of 2026-09-06 covers approval of the
      threshold check. The contract names the cutoff 66, the point count 8,
      two routes, and a falsification criterion. It does not sample a
      subspace.
    - >-
      The products and the points were computed in this session. That
      computation is not a run. Twice 65 is 130 and the four-element curve
      has 8 points. The Weil bound named in the proposal was not opened and
      does not back this approval.
    - >-
      origin/main was already contained in this branch. origin/main was
      b91f61700a897748a107c7dd3f08f4294df2cfc7. HEAD at the merge check was
      a5357bb1cab5846ab52935dee63892435204baf8.
  evidence_refs:
    - ledger/proposals/IDEA-20260926-cafcf1.yaml
    - ledger/decisions/DEC-20260926-901ea1.yaml
  limitations:
    - Approval authorises the arithmetic. It does not measure a density.
    - The two skipped ideas remain open. Neither is closed by this decision.
  next_actions:
    - Dispatch TASK-20261002-ed976a after the TASK-20261002-c46094 receipt verifies.
    - Re-check DEC-20260926-901ea1 NA-2 before designing IDEA-20260926-89886c.
  knowledge_promotion:
