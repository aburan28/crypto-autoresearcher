  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT AN EVIDENCE-REVIEW DECISION AND NO DURABLE SCIENTIFIC CLAIM RESULTS.
      There is no EV-* record in scope, zero scientific runs exist for
      EXP-FROB-d8aa37, and the subject matter is runtime admission machinery. The
      one transferable operational lesson -- that a declarative provider-level
      memory ceiling is not the same guarantee as an OS-level per-process
      RLIMIT_AS, and that a runtime-identity report's prose summary can cite a
      value no retained raw log actually corroborates -- is captured where it can
      act (this record's own open items and TASK-20260914-c85f6a's completion
      gate), not as a KN-FIND, per AGENTS.md core rule 5's prohibition on
      promoting an infrastructure/process finding as a mathematical one.

  decided_by: coordinator
  decided_at: '2026-09-14'
