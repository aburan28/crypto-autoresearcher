coordinator_decision:
  id: DEC-20260916-88ac73
  decided_by: coordinator
  decided_at: '2026-09-16'
  decision: >-
    ADOPT THE TRUE-DEGREE READING OF NAGAO 2015/984 PROPOSITION 5, RE-FOUND THE BOTH-CONSEQUENCES
    REPORTING RULE ON IT, AND RECORD FOUR DESIGN CONSTRAINTS THAT THE EQS4 DEGREE INSTRUMENT MUST
    SATISFY BEFORE ITS CONTRACT IS FROZEN — one of which rules out the instrument's most natural
    reading of its own purpose.

    GOAL-SEMBIN-fcb7a2 stays `active` with no open batch. No hypothesis status moves; the goal still
    has no hypothesis. Nothing is measured here.
  scope: >-
    A reading of frozen text and its consequences for a contract not yet written. Binds
    GOAL-SEMBIN-fcb7a2's design work. Asserts nothing about any elliptic curve, any index calculus
    cost, or the truth of Proposition 5.
  target_ids:
    - GOAL-SEMBIN-fcb7a2
    - DEC-20260915-94855e
    - DEC-20260913-8d19e5
  target_ids_note: >-
    H-SEMBIN-a7e721 and EXP-SEMBIN-4fa22c are deliberately NOT listed. They are reserved identifiers
    with no records behind them, and validate_ledger.py is right to refuse a decision that targets a
    record which does not exist. The four design constraints below bind whoever authors them — they are
    named in next_actions rank 1 and in the goal head's reserved_identifiers, which is where a pointer
    to an unwritten record belongs.
  context: >-
    DEC-20260915-94855e opened this goal and ranked, first, an independent blind read of the question
    "does Proposition 5 bound the true d_F or the fake d'_F", explicitly because one reader — the
    Coordinator — had settled it and that is not an independent review. That read is done, on
    `review-adversarial` at `xhigh` in an independent session, barred from the six records that had
    already answered. It OVERTURNED the Coordinator's conclusion: the text does determine the referent,
    and it is the TRUE d_F. CORR-20260916-96f47d carries the full account, including the argument the
    Coordinator missed and why the way it read the paper made that predictable.

    Ranking that read ahead of freezing any contract is vindicated by what it returned. Three of its
    four design constraints below could not have been discovered from the goal's own framing, and one
    of them invalidates the instrument's most natural purpose. Freezing a contract first and
    discovering them afterwards would have required a protocol amendment against measurements already
    taken.
  rationale: >-
    ON THE READING. The referent is the true d_F of Definition 5 applied to EQS4 = G ∪ S_fe with the
    field equations inside the generating set, at a stated confidence near 0.85-0.9. Three independent
    grounds, of which the second alone would have settled it: the paper writes "Fake" every time it
    means d'_F and omits it in Proposition 5; Proposition 5 feeds Proposition 6's exponent 4w through
    Lemma 2 and Assumption 1, both written in d_F, so the bounded quantity must be d_F or Proposition 6
    does not follow; and Lemma 6 — statement in d_F, proof bounding d'_F and converting by Lemma 4 —
    shows that a d_F statement proved through a d'_F bound is this paper's convention rather than a
    symptom of indeterminacy. Adopted as OPERATIVE, not certain: the residual is authorial intent and
    is recorded under limitations.

    ON THE RULE. DEC-20260915-94855e required every reported d'_F to carry both consequences, because
    the referent was thought undetermined. The premise is superseded and THE RULE IS RETAINED, with its
    basis restated: the operative reading is now primary and the alternative is a recorded ~0.1-0.15
    residual, not a co-equal branch. Reporting both remains free and stays mandatory, because the
    directions genuinely differ under the two readings and a report that silently assumes one is
    unreadable by anyone who holds the other. A reader must be able to see which reading a number was
    interpreted under.

    ON WHAT A MEASUREMENT CAN DO. Under the operative reading a measured d'_F > 4 does not refute
    Proposition 5 — Lemma 4 runs d_F <= d'_F, so d_F <= 4 < d'_F is consistent — but it does refute the
    paper's ONLY justification at that instance, leaving the proposition unproven there. That is the
    campaign's realistic target and it is worth having: an exponent-bearing published bound whose sole
    justification is borrowed, converted by an unproven lemma, and transferred by a footnote that omits
    the proof. A measured d'_F <= 4 confirms at that instance, conditional on Lemma 4 and instance-level
    only.
  design_constraints_binding_on_EXP_SEMBIN_4fa22c:
    - id: DC-1
      constraint: >-
        THE INSTRUMENT MAY NOT CLAIM TO BOUND d_F FROM BELOW, AND MAY NOT BE DESCRIBED AS ABLE TO REFUTE
        PROPOSITION 5. A Boolean-ring Macaulay computation is structurally unable to exhibit d_F > 4:
        degree drops produced purely by X^2 -> X count toward d_F and are invisible to d'_F, so the
        instrument never sees the falls that can make d_F small. The contract states this as a capability
        limit in its own success criteria, not as a caveat in an interpretation section.
      why_it_is_load_bearing: >-
        This is the constraint that would have been discovered after the fact. The goal's framing
        described a "Proposition 5 matched-pair test", and the natural design is an instrument whose
        headline outcome is a refutation. That outcome is unreachable by construction, and a contract
        frozen without knowing it would have had a success criterion no run could satisfy.
      verified: >-
        Mechanism and witness rechecked by the Coordinator at
        coordination/review/sembin-20260916-propquant/coordinator-recheck.py.
    - id: DC-2
      constraint: >-
        THE INSTRUMENT DECLARES ITS CONVENTION ON CONDITION (1) AND ON TRIVIAL FALLS, IN THE FROZEN
        CONTRACT, BEFORE ANY RUN. Condition (1) of both definitions reads ">= dF" in the frozen text
        (:401, :439) and Definition 6's conditions name dF rather than d'F. Under a literal ">=" both
        quantities degenerate — a zero-dimensional system with a unique F_2 solution has linear ideal
        elements, so the literal d_F would be <= 2 and Assumption 1 false outright — so the contract
        must state that it computes the equality form, and say so as a declared interpretation of an
        ambiguous source rather than as an obvious reading.
      also: >-
        Neither definition excludes trivial Koszul falls. With S_fe inside, g = (X_j^2 + X_j) on a cubic
        f and h_j = f + 1 on the field equation give degree-5 products summing to X_j^2 + X_j, so the
        literal true d_F of ANY cubic system ∪ S_fe at p = 2 is <= 5 and Proposition 5's bound of 4 sits
        one degree below a trivial ceiling. The contract declares whether trivial falls count and how
        they are excluded, since an instrument that admits them measures the ceiling and not the system.
      verified: Rechecked by the Coordinator, same artifact.
    - id: DC-3
      constraint: >-
        THE INSTANCE INCLUDES THE COSET SHIFTS v_i. EQS4 differs from EQS2 exactly by them (Definition 8
        :713, footnote 1 :285-290). An instrument that descends S3 without the shifts is measuring EQS2
        and must not report against Proposition 5. The shifts are part of the instance, never a
        deviation, and the contract fixes them in its input specification.
    - id: DC-4
      constraint: >-
        THE GENERATORS ARE THE REDUCED DEGREE-3 DESCENTS. Definition 3 defines F↓ with `mod S_fe` (:262)
        and the paper notes that at p = 2 degree-3 polynomials can be taken (:274). The representative is
        irrelevant to d'_F and NOT irrelevant to d_F, since d_F measures degree before reduction, so the
        contract fixes the representative rather than leaving it to an implementation.
  completion_criteria_status:
    criterion_1_both_consequences_rule: >-
      IN FORCE, with its basis restated by this decision. Not yet exercised: no measurement exists.
    criterion_2_hypothesis_and_contract: >-
      NOT MET. H-SEMBIN-a7e721 and EXP-SEMBIN-4fa22c remain reserved identifiers with no records. They
      are now designable, which they were not before this read, and they are ranked first below.
    criterion_3_measurement: >-
      NOT MET, and its scope is now narrower than the goal's opening framing: the reachable result is a
      statement about the paper's justification, never a refutation of Proposition 5 (DC-1).
    criterion_4_upstream_papers_read: >-
      MET by DEC-20260913-8d19e5, unchanged. One residual read is now identified as decision-relevant
      rather than background: whether the upstream Lemma 3 supports the INSIDE form of Lemma 4.
  limitations:
    - >-
      THE OPERATIVE READING IS ONE INDEPENDENT READER'S, AT ~0.85-0.9, PLUS THE COORDINATOR'S OVERTURNED
      READING. Two readers is not a settled question. What makes it adoptable rather than merely newer is
      that its second ground is a structural argument any reader can check in four line-quotes, and that
      the Coordinator verified its three hand-algebra claims independently. The residual is authorial
      intent, which this text cannot supply.
    - >-
      THE COORDINATOR'S RECHECK IS A RECHECK, NOT A BLIND RE-DERIVATION. The claims and their witnesses
      were read from the report before the arithmetic was redone, so agreement is weaker evidence than a
      blind re-derivation would have been. The one place it is stronger than the report is the Lemma 4
      counterexample, where the degree-2 search was made exhaustive over all 31 nonzero coefficient
      choices rather than checked at the reported witness.
    - >-
      AN EXTRACTION LIMIT IS UNRESOLVED. Whether ">= dF" in the two definitions is in the PDF or is a
      lost prime glyph is not determinable from the frozen text. DC-2 makes the instrument declare its
      convention, which is a way of proceeding honestly under the ambiguity rather than a resolution of it.
    - >-
      LEMMA 4's INSIDE FORM IS NOT PROVEN HERE. Its literal form is verified FALSE; the inside form holds
      in every instance checked and is asserted by the paper on the strength of a lemma proven elsewhere.
      Every confirmation direction in criterion 1 is conditional on it, and that condition must appear in
      any record that reports a confirmation.
  deliberately_not_targeted:
    - what: >-
        A review-tier pre-authorization for a future d'_F result. DEC-20260915-94855e observed that if the
        fake-degree reading were correct, such a result would contradict a published proposition and require
        `review-breakthrough` at `max` under core rule 12.
      why_not: >-
        The corrected reading makes a d'_F > 4 result a refutation of the paper's JUSTIFICATION, not of
        Proposition 5, which is a weaker claim class. It would be convenient to record that the tier is
        therefore `review-adversarial`, AND THAT IS EXACTLY THE SHAPE OF A SILENT DOWNGRADE — deciding in
        advance that a result not yet obtained deserves a cheaper review. The tier is set by what a result
        actually claims, at the time it claims it. A result presented as contradicting Proposition 5 still
        requires `review-breakthrough` at `max`, undegradable, whatever this decision says about what the
        instrument can reach.
    - what: The attribution question about the coset-typed factor base.
      why_not: >-
        Discharged separately under its own goal by CORR-20260916-273589, which is where H-SEMBIN-c59e50
        lives.
  next_actions:
    - rank: 1
      action: >-
        AUTHOR H-SEMBIN-a7e721 AND FREEZE EXP-SEMBIN-4fa22c, with DC-1 through DC-4 written into the
        contract's success criteria rather than its prose. The hypothesis states the mechanism (the
        justification chain Proposition 5 rests on: a borrowed Semaev fake bound, converted by an unproven
        Lemma 4, transferred to EQS4 by a footnote that omits the proof), its predictions, its test
        boundary, and its falsification conditions — with DC-1 fixing the boundary as a claim about the
        justification and never about the proposition.
      zero_compute: false
      note: >-
        Designing is not approving. The contract sits at `approved_by: null` until a committed Coordinator
        decision approves it under the standing user authorization, once the protocol is complete.
    - rank: 2
      action: >-
        READ NAGAO 2013/549's LEMMA 3 AND SEMAEV 2015/310 for the two residuals: whether the upstream
        Lemma 3 supports the INSIDE form of Lemma 4, and what Semaev's argument actually delivers as
        against what his statement says. Both are already frozen in `inputs/` with sha256 sidecars, and the
        blind reader was barred from both by design. Zero compute.
      zero_compute: true
      note: >-
        Ranked behind (1) rather than ahead because neither answer can change DC-1, which is the constraint
        that shapes the contract. They bear on how conditional a confirmation is, which the contract can
        record as a dependency.
    - rank: 3
      action: >-
        Carry the four-quantity distinction to the other lanes measuring a degree. IDEA-20260913-449d2b
        exists for it and is better motivated than when proposed: Nagao's d_F, Nagao's d'_F, Semaev's
        d_F4, and a Macaulay-rank statistic are four different numbers, and DC-2 shows that even "d'_F" is
        under-determined until a convention is declared.
      zero_compute: true
  what_this_decision_does_not_assert:
    - >-
      NOT that Proposition 5 is false, or unproven in general. Its justification in THIS paper is borrowed,
      converted by an unproven lemma and transferred by a footnote omitting the proof; one of the two
      upstream sources is frozen and unread.
    - >-
      NOT that the operative reading is certain. It is one independent reader at ~0.85-0.9 against the
      Coordinator's overturned reading, adopted because its grounds are checkable, with the residual recorded.
    - >-
      NOT a measurement, and no evidence about any curve, any index calculus cost, or any point
      decomposition. Nothing in this decision was computed beyond toy hand algebra on five variables.
    - >-
      NOT an approval of any experiment, and not a hypothesis status change. GOAL-SEMBIN-fcb7a2 has no
      hypothesis and no open batch.
    - >-
      NOT a lowering of any review bar. See deliberately_not_targeted: the tier of a future review is set by
      what that result claims, not by this decision's view of what the instrument can reach.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Nothing here is validated internal evidence. The reading is a textual finding at stated confidence and
      the three algebra results are toy hand checks; both belong to this decision and its correction, not to
      the corpus. Two candidates are named for later promotion IF a read confirms them: that Lemma 4's
      literal form is false (a checkable defect in a published lemma, currently supported by one exhaustive
      toy counterexample), and that the true first fall degree of a cubic system ∪ S_fe at p = 2 has a
      trivial ceiling of 5. Promoting either now would give a corpus entry more authority than a toy
      counterexample earns.
  evidence_refs:
    - coordination/review/sembin-20260916-propquant/report.md
    - coordination/review/sembin-20260916-propquant/coordinator-recheck.py
    - coordination/review/sembin-20260916-propquant/coordinator-recheck.out
    - CORR-20260916-96f47d
    - DEC-20260913-8d19e5
    - DEC-20260915-94855e
  evidence_refs_note: >-
    NONE OF THESE IS A RUN RECORD, AND THIS DECISION CITES NO MEASUREMENT because there is none. The report
    and the recheck are a textual audit and toy hand algebra respectively; they are cited as what they are.
  citations:
    - claim: >-
        The referent of Proposition 5, the three grounds, the inequality direction, and both evidential
        directions of a fake measurement.
      source: coordination/review/sembin-20260916-propquant/report.md, over inputs/NAGAO-2015-984/paper_fulltext.md
      provenance: retrieved
      verified_by: >-
        The blind auditor, which read the frozen text under a handoff barring it from the six records that
        had already answered; and the Coordinator, which re-read the Lemma 6 proof passage :580-583 and
        Proposition 6 :731-742 directly.
    - claim: >-
        DC-1's mechanism, the Lemma 4 counterexample, and the trivial Koszul ceiling.
      source: coordination/review/sembin-20260916-propquant/coordinator-recheck.out
      provenance: internal
      verified_by: >-
        coordinator, this session, by reimplementing the F_2 arithmetic from scratch with exponents
        preserved and making the degree-2 search exhaustive.
    - claim: That Lemma 3 is proved upstream while d_F <= d'_F appears in neither upstream paper.
      source: ledger/decisions/DEC-20260913-8d19e5.yaml
      provenance: internal
      verified_by: coordinator, this session.
