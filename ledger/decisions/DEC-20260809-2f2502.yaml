coordinator_decision:
  id: DEC-20260809-2f2502
  goal_id: GOAL-SSI-001
  batch_id: BATCH-0a1b85
  recorded_by_task: TASK-20260809-da4760
  archived_by: TASK-20260809-da4760
  context: >-
    BATCH-0a1b85 opened an additive successor to EXP-SSI-fe3f76 after the
    predecessor review identified eight residual design defects. Fresh
    independent Validator and Red Team sessions reviewed the immutable
    EXP-SSI-8e589d snapshot. Neither executed an experiment or diagnostic.
  decision: refine
  decision_scope: >-
    Retain EXP-SSI-8e589d as a materially improved design candidate and open a
    further additive clarification. This decision does not freeze the
    contract, authorize execution, change hypothesis or experiment status, or
    make any SSI, SQIsign, attack, security, novelty, or exponent claim.
  target_ids: [IDEA-20260806-9c2f80, EXP-SSI-fe3f76, EXP-SSI-8e589d, GOAL-SSI-001]
  evidence_ids: [EV-SSI-3b03d8]
  review_ids: [VAL-20260809-90ebd6, RT-20260809-a35dda]
  review_task_ids: [TASK-20260809-90ebd6, TASK-20260809-a35dda]
  snapshot_commit: 59f0700234c94ac5eb211e01f03ba517f247e9a7
  rationale:
    design_progress: >-
      The successor repairs exact source-prime labeling, vertex-field bytes,
      finite L_steps, typed branch separation, finite control declarations,
      C statistic formulas, and the explicit non-SSI boundary. Both reviews
      confirm these as design improvements without treating them as observations.
    independent_validation: >-
      Validator TASK-20260809-90ebd6 returned incomplete with
      DISSENT_ON_FREEZE_AND_EXECUTION_READINESS and identified thirteen
      unresolved finite-contract defects.
    independent_red_team: >-
      Red Team TASK-20260809-a35dda returned DISSENT on freeze and execution
      readiness, including two direct byte-width undercounts and additional
      serialization, overflow, manifest, path/output, replay, null, and
      synthetic-protocol objections. It concurred only with the additive
      design-only and no-execution boundary.
    execution_authorization:
      granted: false
      reason: >-
        Direct b_order and b_index arithmetic contradictions remain, together
        with unresolved canonical bytes, cryptographic-scale counts, manifest
        setup, index occupancy, restart/FOE, output/access, branch-null,
        replay, C-pair, and synthetic-walk semantics. No execution task may be
        opened from this decision.
    claim_boundary: >-
      No measurement, run, attack, security, exponent, novelty, hypothesis
      transition, or goal completion follows from either review.
  official_research_state_changed: false
  hypothesis_status_transition: none
  experiment_status_transition:
    - id: EXP-SSI-8e589d
      from: review_required
      to: review_required
      note: >-
        The successor remains review_required, unfrozen,
        execution_authorized:false, evidence_eligible:false, and approved_by
        null. The predecessor remains immutable.
  asymptotic_promotion_gates:
    gate_1_proof_decomposition: open
    gate_2_numbered_heuristics: open
    gate_3_concrete_cost_table: open
    gate_4_independent_review_and_red_team: >-
      Completed only as an execution-blocking design review; all scientific
      promotion gates remain open.
  next_actions:
    - >-
      Open an additive clarification correcting both width equations and
      freezing all integer/string framing, symbolic versus materialized
      cryptographic-scale counts, manifest/setup cost, index occupancy, HNF
      canonicalization, restart/FOE/break-even semantics, and output-producing
      B/C paths.
    - >-
      Freeze branch-specific null construction, shuffled payload validity,
      identical paired replay traces, C-pair permutation/calibration, and the
      synthetic graph kernel/CDF aggregation. Snapshot before fresh independent
      Validator and Red Team review.
    - >-
      Keep EXP-SSI-8e589d, EXP-SSI-fe3f76, EXP-SSI-1d0f36, and all SSI
      advice-frontier experiments unapproved, unfrozen, and unexecuted.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This batch measured nothing and promotes no technique, theorem, attack,
      exponent, security conclusion, or knowledge item.
  claim_ceiling: >-
    The strongest true statement is that EXP-SSI-8e589d is an additive,
    materially improved, execution-unauthorized design refinement that remains
    underdefined for freeze and execution. This is not evidence about the SSI
    problem or any deployed security level.
  decided_by:
    task: TASK-20260809-da4760
    role: coordinator
    policy: coordinator-orchestration-code
  decided_at: '2026-08-09'
