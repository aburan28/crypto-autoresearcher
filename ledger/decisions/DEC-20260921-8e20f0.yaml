    coordination/frobenius/BATCH-2f8435/stage0-v21-retry-TASK-20260921-9edcfe/dispatch_queue.json)
    was admitted under that authorization and launched genuinely at
    2026-09-21T16:40:15.063084Z. RUN-FROB-6d29ae ran with confirmed genuine
    progress -- a growing roots.jsonl.gz, last observed write at
