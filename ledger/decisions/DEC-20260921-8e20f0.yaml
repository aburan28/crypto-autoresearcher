    THIS COORDINATOR INDEPENDENTLY READ, IN FULL, VIA ITS OWN Read TOOL IN
    THIS ENGAGEMENT: DEC-20260921-8aa5cf.yaml (this record's own immediate
    predecessor and structural template);
    coordination/infrastructure/frob-d8aa37-restart-diagnosis-20260921/findings.md
    (committed in 547176a1f, produced in direct response to DEC-20260921-8aa5cf's
    NA-4 escalation); experiments/EXP-FROB-d8aa37/trial-plan-stage0-v21.json;
    coordination/frobenius/BATCH-2f8435/admission/run-binding-stage0-v21-retry-20260921.json;
    ledger/handoffs/TASK-20260921-9edcfe.yaml;
    coordination/frobenius/BATCH-2f8435/stage0-v21-retry-TASK-20260921-9edcfe/dispatch_queue.json;
    coordination/frobenius/BATCH-2f8435/stage0-v21-retry-TASK-20260921-9edcfe/claims/TASK-20260921-9edcfe.1.release.json;
    and
    experiments/EXP-FROB-d8aa37/runs/RUN-FROB-6d29ae/roots.jsonl.gz.oversized-artifact-pointer.json.
    This coordinator has no shell/git access and could not run `git show` on
    commits 547176a1f or c615466fc directly; it instead read the resulting
    committed file contents at HEAD directly, which is the strongest evidence
    available to it, and treats the commit SHAs themselves as
    reported_by_session (see verification block).
    THIS COORDINATOR ENGAGES WITH NA-4'S PRECONDITION ON ITS MERITS RATHER
    THAN RESTATING IT AN EIGHTEENTH TIME. findings.md reports three findings
    from a check run immediately after detecting the seventeenth restart: (1)
    STRUCTURAL: no forensic log (dmesg/journalctl/wtmp) survives any restart
    in this environment by construction -- journalctl reports no journal
    files and no systemd-journald process runs at all; dmesg carries only the
    current boot's own ~2.5s of messages; wtmp has not been updated since
    2026-02-17. This is disclosed as a structural property of the container's
    provisioning, not a one-off access failure, and directly answers why
    retrospective OOM/eviction/preemption diagnosis at each of the seventeen
    historical restart timestamps was never obtainable and will not become
    obtainable under this same configuration -- this is disclosure (b) for
    that specific piece of NA-4's ask, honestly and concretely stated. (2)
    MECHANISTIC: on the fresh boot, /proc/1/cmdline shows PID 1 itself is the
    Firecracker init handoff process with a fresh start time matching the
    boot -- the whole microVM, init included, is recreated on each restart.
    An in-guest OOM-killer ordinarily targets the highest-scoring process and
    leaves the container's own init running; it does not restart init itself.
    This is the signature of an external, platform-level microVM restart, not
    an in-guest resource-exhaustion kill of the Sage process. (3) STATIC
    CONFIGURATION: free -h and /proc/meminfo on the fresh boot show ~16GB
    total, ~15GB available, 0B swap; /sys/fs/cgroup/memory/memory.limit_in_bytes
    reads effectively unbounded; no cgroup-level OOM accounting is present.
    With ~16GB total and no visible cap near 8GB, the trial's declared
    memory_mb=8192 leaves roughly half the container's total memory as
    headroom under its own static configuration -- nothing in the container's
    static memory configuration makes memory_mb=8192 structurally tight
    against a hard limit. findings.md's own stated conclusion: the obtainable
    evidence is MORE CONSISTENT WITH an external, platform-driven
    whole-environment restart than with an in-guest OOM-kill triggered by the
    trial's own memory_mb=8192 Sage footprint -- NOT PROVEN WITH CERTAINTY,
    because no direct telemetry survives any of the seventeen historical
    restarts to confirm the proximate trigger, and that gap is structural to
    this environment, not a one-time omission.
    THIS COORDINATOR FINDS THIS SUFFICIENT TO SATISFY NA-4'S PRECONDITION. The
    precondition asked for either (a) findings specifically addressing whether
    memory_mb=8192 is a plausible proximate cause, or (b) an explicit,
    concrete disclosure of why such findings could not be obtained. findings.md
    supplies both, for the two different obtainable/unobtainable parts of the
    ask: it directly and honestly answers the memory question with the
    strongest evidence available in this environment (Findings 2 and 3,
    pointing away from memory_mb=8192 as a plausible proximate cause and
    toward an external platform-driven cause), and it separately, honestly,
    and concretely discloses (Finding 1) why full historical
    forensic-log reconstruction is categorically unobtainable here rather
    than merely not-yet-done. This is not a mechanical restatement of NA-4 --
    it is the actual diagnostic engagement NA-4 asked for, performed once,
    honestly bounded by what this environment can and cannot produce.

