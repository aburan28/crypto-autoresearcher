  the_decision_stated_plainly: >-
    RUN-FROB-6d29ae's interruption is diagnosed, honestly and without
    fabrication, as the SAME failure family that destroyed all sixteen of its
    predecessors under driver-v2.py/checker-v2.py: a whole-environment restart
    external to any script's own control, external to any timeout wrapper
    (there was none this time either), and external to any code defect in
    driver-v2.py/checker-v2.py. This is the SEVENTEENTH, CONSECUTIVE instance
    of the identical infrastructure failure family under the same,
    already-corrected source and launch procedure. Its own survival duration
    is honestly ambiguous rather than resolved by assumption: a confirmed
    floor of at least 3h01m55s (the LONGEST confirmed-genuine floor in this
    lane's history) and an upper bound of approximately 4h58m55s if the
    process continued silently until the confirmed reboot, separated by a
    ~1h57m00s monitoring gap (the second-widest disclosed in this lane's
    history). This record does not resolve that ambiguity by assumption. This
    uncertainty is itself infrastructure/observability signal, never negative
    mathematical evidence about H-FROB-73df22 (AGENTS.md core rule 3 /
    CLAUDE.md rule 3).
    Separately and centrally: DEC-20260921-8aa5cf's NA-4 evidentiary
    precondition on this exact authorization is SATISFIED by
    coordination/infrastructure/frob-d8aa37-restart-diagnosis-20260921/findings.md
    (committed 547176a1f), for the reasons stated in full in the context block
    above -- this coordinator independently read that finding, engaged with it
    on its merits rather than mechanically restating NA-4 an eighteenth time,
    and judges it sufficient: it directly answers the memory_mb=8192 question
    with the best evidence obtainable (pointing away from an in-guest
    memory-exhaustion cause), and it concretely, honestly discloses why full
    historical forensic reconstruction is structurally unobtainable in this
    environment rather than merely undone.
    On that basis, this coordinator (1) makes no change to RUN-FROB-6d29ae's
    directory -- already committed and pushed exactly as found (commit
    c615466fc), including the oversized-artifact-pointer.json disclosure for
    its 1596868606-byte roots.jsonl.gz -- and (2) authorizes a fresh retry
    under a fresh, coordinator-proposed (NOT yet allocate_id.py-confirmed) run_id,
    RUN-FROB-4b8e05, via a fresh trial-plan-stage0-v22.json, a fresh
    run-binding, and a fresh launch handoff to the Executor
    (TASK-20260921-9b3836), per the user's standing instruction to keep
    retrying automatically through this exact recurring failure mode -- and
    (3) does NOT install a further blocking evidentiary precondition on the
    NEXT authorization beyond this one. NA-4, as escalated by DEC-20260921-8aa5cf,
    is CLOSED, satisfied, effective immediately. This coordinator instead
    records one new, explicitly NON-BLOCKING, forward-looking recommendation
    (NA-4-successor, below) targeting the actual remaining cost of this
    failure mode -- hours of confirmed genuine progress lost on every
    restart, most starkly this seventeenth one's own >=3h01m55s -- rather than
    its cause, which findings.md has now addressed as far as this environment
    permits.

  rationale:
    - >-
      SEVENTEENTH, CONSECUTIVE INSTANCE OF THE SAME FAILURE FAMILY, STILL
      INFRASTRUCTURE/PROTOCOL SIGNAL, NEVER NEGATIVE MATHEMATICAL EVIDENCE,
      PER AGENTS.md CORE RULE 3 / CLAUDE.md RULE 3. RUN-FROB-6d29ae's
      resulting run-directory shape (real, partial scientific output --
      1596868606 bytes of roots.jsonl.gz, disclosed via the
      oversized-artifact-pointer.json pattern since it exceeds GitHub's
      100MiB limit and git-lfs is unavailable -- no execution-receipt.json,
      entire process tree including the Python supervisor destroyed before
      any receipt-writing logic could run) matches every one of its sixteen
      predecessors under driver-v2.py/checker-v2.py. Seventeen-for-seventeen
      launch attempts under that source have now been killed by
      whole-environment restarts, all non-scientific, non-protocol
      infrastructure signal. None of RUN-FROB-6d29ae or any predecessor says
      anything about H-FROB-73df22, RQ-FROB-7d8dd4, or whether Frobenius
      structure moves the index-calculus exponent.
    - >-
      THIS SEVENTEENTH RESTART'S OWN NOTABLE FEATURE: BY FAR THE LONGEST
      CONFIRMED GENUINE PROGRESS WINDOW IN THIS LANE'S HISTORY. RUN-FROB-6d29ae's
      last confirmed write (2026-09-21T19:42:10.476772923Z, roots.jsonl.gz at
      1596868606 bytes) establishes a floor of at least 3h01m55s of genuine
      progress, exceeding even the thirteenth restart's own previously
      longest-disclosed lower bound. The gap itself (last write to confirmed
      reboot, ~1h57m00s) is the second-widest disclosed in this lane's
      history, after only the thirteenth's own ~2h12m gap, so this
      seventeenth point's true interval cannot be narrowed below
      [~3h01m55s, ~4h58m55s]. This record explicitly declines to assume
      either bound as fact and carries the range forward honestly, consistent
      with this lane's established practice for the twelfth through sixteenth
      restarts.
    - >-
      NA-4'S EVIDENTIARY PRECONDITION IS SATISFIED, ON ITS MERITS, NOT BY
      MECHANICAL RESTATEMENT. See the context block above for the full
      engagement with findings.md's three findings and its own stated
      conclusion. This coordinator independently judges: (i) the memory
      question DEC-20260921-8aa5cf's NA-4 specifically asked about is
      answered with the best evidence obtainable in this environment, and
      that evidence points away from memory_mb=8192 as a plausible proximate
      cause (no cgroup cap near 8GB, ~15GB headroom at boot, and -- more
      importantly -- the whole-microVM PID-1-respawn signature is
      inconsistent with an in-guest OOM-kill, which ordinarily leaves init
      running); (ii) the residual inability to confirm this with certainty is
      honestly and concretely disclosed as structural (no journald process,
      no persistent dmesg, no wtmp updates across any restart in this
      environment, by construction) rather than as an access failure that
      further effort could close; (iii) this is exactly what NA-4 asked the
      dispatching session to supply -- either the findings or a concrete
      disclosure of why they could not be obtained -- and findings.md supplies
      both, for the two different parts of that ask that are and are not
      obtainable here. This coordinator does not require a further diagnosis
      cycle before authorizing this eighteenth genuine launch attempt.
    - >-
      OVERSIZED-ARTIFACT HANDLING WAS NEEDED THIS TIME, UNLIKE THE SIXTEENTH
      RESTART. RUN-FROB-6d29ae's roots.jsonl.gz (1596868606 bytes, ~1.6GB)
      exceeds GitHub's 100MiB per-file limit; git-lfs is not installed in this
      execution environment, so LFS tracking could not be configured either.
      This was disclosed via the established
      roots.jsonl.gz.oversized-artifact-pointer.json pattern (size_bytes,
      sha256, last_modified_local, reason_not_committed, lfs_available_in_this_environment
      all recorded), consistent with RUN-FROB-d05e7a's (fifteenth restart),
      RUN-FROB-9c4e81's, RUN-FROB-b8e451's, and RUN-FROB-35c3b1's own
      precedent. This is a difference in file size only, not a scientific or
      protocol difference, and roughly correlates with this run's own
      exceptionally long confirmed duration floor (>=3h01m55s), consistent
      with, but not proof of, the driver producing output at a roughly steady
      rate.
    - >-
      THE RUNTIME LOCK BEING CITED REMAINS THE SAME, STILL-CURRENT, STILL-
      UNEDITED, LAUNCH-AUTHORIZED LOCK. This coordinator carries forward
      linux-runtime-lock-successor-20260914-c85f6a.json's content sha256
      (46d918a1a4b9d358df39f09a87d5221128cc1ce19cb62672bc35204785952eb5)
      unchanged from trial-plan-stage0-v21.json's and
      run-binding-stage0-v21-retry-20260921.json's own already-filled
      runtime_lock_sha256 fields (all agree, re-read directly in this
      engagement). Nothing about the runtime, its guards, or its
      authorization changes here; a seventeenth whole-machine restart is not
      evidence the runtime lock's own guards were inadequate against a class
      of event (whole-machine restart) no per-process guard in that lock
      claims to protect against.
    - >-
      WATCHDOG AND MEMORY SIZING RATIONALE REMAIN VALID, UNCHANGED, AND ARE
      NOT REVISED BY THIS RECORD DESPITE findings.md. This record considered,
      and declines, reducing memory_mb below 8192 as a speculative mitigation:
      findings.md's own evidence affirmatively points AWAY from memory
      pressure as the proximate cause (no cgroup cap near 8GB, ~15GB headroom
      at boot, PID-1-respawn signature inconsistent with an in-guest kill), so
      lowering memory_mb now would be an unmotivated protocol change not
      supported by the evidence just obtained, and would itself require a
      justified additive amendment this record does not have grounds for. The
      86400s (24h) watchdog ceiling remains sized generously above the
      longest duration this lane can currently establish under any reading --
      even this seventeenth restart's own upper (~4h58m55s) bound, this
      lane's own new longest, remains far short of it -- and remains machine
      protection only per CLAUDE.md "Research budgets: progress first".
    - >-
      DIRECTION CHECK, unchanged from the whole DEC-20260909-bf5b48 ..
      DEC-20260921-8aa5cf chain. Stage0 is not itself exponent-moving; it is
      the correctness gate for H-FROB-73df22's two arms. No scientific claim
      of any kind is advanced by this admission/retry-authorization record.
      FROB is a declared ECC area (orchestration/research-priority.yaml),
      ranked ahead of non-ECC candidates at every selection point, with
      unlimited batch/wall-clock budget per AGENTS.md "ECC comes first."
    - >-
      BUDGET. Per CLAUDE.md "Research budgets: progress first" (2026-09-06):
      research cost estimates are advisory and require no repeated user
      approval; the Coordinator continues justified work within the
      authorized research scope. No 90-day stagnation review is active or
      warranted. Authorizing a further retry after a seventeenth, consecutive
      infrastructure-only interruption, now with its own evidentiary
      precondition satisfied, is exactly the kind of routine continuation
      CLAUDE.md's "progress first" instruction protects. This is additionally
      covered by the user's own standing instruction to keep retrying
      automatically through this exact recurring failure mode. A whole-machine
      restart mid-run is squarely within "watchdog expiry checkpoints a task;
      it does not exhaust the campaign."
    - >-
      NA-4 IS CLOSED, NOT RE-ESCALATED, AND NO NEW BLOCKING PRECONDITION IS
      INSTALLED ON THE NEXT RETRY. Having found NA-4's own evidentiary
      precondition satisfied on its merits, this coordinator explicitly
      declines to manufacture a further blocking condition on the next
      authorization merely to appear rigorous -- doing so, with the diagnostic
      question findings.md was asked now answered as far as this environment
