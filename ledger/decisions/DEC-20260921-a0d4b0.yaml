  rationale:
    - >-
      FIFTEENTH, CONSECUTIVE INSTANCE OF THE SAME FAILURE FAMILY, STILL
      INFRASTRUCTURE/PROTOCOL SIGNAL, NEVER NEGATIVE MATHEMATICAL EVIDENCE,
      PER AGENTS.md CORE RULE 3 / CLAUDE.md RULE 3. RUN-FROB-d05e7a's
      resulting run-directory shape (real, partial scientific output --
      348529626 bytes of roots.jsonl.gz, disclosed via the
      oversized-artifact-pointer.json pattern since it exceeds GitHub's
      100MiB limit -- no execution-receipt.json, entire process tree
      including the Python supervisor destroyed before any receipt-writing
      logic could run) matches every one of its fourteen predecessors under
      driver-v2.py/checker-v2.py. Fifteen-for-fifteen launch attempts under
      that source have now been killed by whole-environment restarts, all
      non-scientific, non-protocol infrastructure signal. None of
      RUN-FROB-d05e7a or any predecessor says anything about H-FROB-73df22,
      RQ-FROB-7d8dd4, or whether Frobenius structure moves the index-calculus
      exponent.
    - >-
      THE HONEST AMBIGUITY ITSELF, STATED PLAINLY, NOT RESOLVED BY
      ASSUMPTION -- AND ITS OWN NOTABLE FEATURE: THE SECOND-LONGEST GENUINE
      RUN IN THIS LANE'S HISTORY, NOT A CONTINUATION OF EITHER THE
      THIRTEENTH RESTART'S HOURS-SCALE OUTLIER OR THE FOURTEENTH RESTART'S
      SHORT REVERSION. RUN-FROB-d05e7a's last confirmed write
      (15:11:09.896063Z, roots.jsonl.gz at 348529626 bytes) establishes a
      floor of ~44.8min of genuine progress. The gap itself (last write to
      confirmed reboot, ~5min) is smaller than the fourteenth restart's own
      ~12-minute gap and both the twelfth's own ~53-minute gap and the
      thirteenth's own ~2h12m gap, so this fifteenth point's true interval
      cannot be narrowed below [~44.8min, ~49.8min]. This record explicitly
      declines to assume the process died promptly after its last write (the
      lower bound) merely because that is the more conservative reading, and
      equally declines to assert the ~49.8min upper bound as fact. The
      honest statement is: this fifteenth point's true interval lies
      somewhere in [~44.8min, ~49.8min], and which value it actually is
      CANNOT be recovered from the artifacts that survive a
      whole-environment restart. This record states plainly, per explicit
      instruction and its own independent reading of the full interval
      sequence, that three consecutive restarts (thirteenth, fourteenth,
      fifteenth) landing at wildly different scales -- hours, minutes, tens
      of minutes -- is itself the evidence for irreducible variability, not
      a pattern to extrapolate from. This record does NOT treat the
      fifteenth restart's own longer duration as a step back toward the
      thirteenth's own scale, does NOT treat it as a "regression" from the
      fourteenth's short duration, and continues to treat restart timing as
      highly variable with NO CONFIRMED TREND in either direction.
    - >-
      NO FABRICATED RECEIPT, AND NO REDUNDANT PRESERVATION ACTION. This
      decision does NOT author an execution-receipt.json for RUN-FROB-d05e7a,
      and does not construct, estimate, or infer one from the partial
      roots.jsonl.gz or from what a graceful interruption receipt would
      ordinarily contain. RUN-FROB-d05e7a's directory was already committed
      and pushed exactly as found by the dispatching session, prior to this
      engagement, in commit ec4894d22 -- this coordinator did not itself
      re-list that directory via its own tools in this engagement (it has no
      shell and did not run an additional Glob against it beyond the
      identifier-collision sweep below), and accepts its exact 7-entry shape
      (command.txt, environment.json, launch.json,
      roots.jsonl.gz.oversized-artifact-pointer.json, stdout.log, stderr.log,
      tuples.jsonl.gz, no execution-receipt.json) as reported_by_session per
      the dispatching session's own disclosure. Per AGENTS.md core rule 5,
      this record does not edit, complete, or backfill that directory in any
      way, and does not touch the run directory's exclusive-create run_id
      semantics (RUN-FROB-d05e7a is spent and cannot be reused).
    - >-
      OVERSIZED-ARTIFACT HANDLING WAS NEEDED AGAIN THIS TIME, AND THIS
      RECORD DOES NOT MANUFACTURE ANYTHING BEYOND WHAT WAS ALREADY DONE.
      RUN-FROB-d05e7a's roots.jsonl.gz (348529626 bytes, ~348.5MB,
      reported_by_session) exceeds GitHub's 100MiB per-file limit and was
      disclosed via the oversized-artifact-pointer.json pattern, like
      RUN-FROB-b8e451's (~2.48GB), RUN-FROB-9c4e81's (151339023 bytes), and
      RUN-FROB-35c3b1's (486954627 bytes), unlike RUN-FROB-a749d2's
      (13713775 bytes, committed directly). This is a difference in file
      size only, not a scientific or protocol difference, and roughly
      correlates with this run's own longer genuine duration (~44.8-49.8min
      vs. RUN-FROB-a749d2's ~4.5-16.5min), consistent with, but not proof of,
      the driver producing output at a roughly steady rate.
    - >-
      THE RUNTIME LOCK BEING CITED REMAINS THE SAME, STILL-CURRENT, STILL-
      UNEDITED, LAUNCH-AUTHORIZED LOCK. This coordinator carries forward
      linux-runtime-lock-successor-20260914-c85f6a.json's content sha256
      (46d918a1a4b9d358df39f09a87d5221128cc1ce19cb62672bc35204785952eb5)
      unchanged from trial-plan-stage0-v19.json's and
      run-binding-stage0-v19-retry-20260921.json's own already-filled
      runtime_lock_sha256 fields (all agree, re-read directly in this
      engagement). Nothing about the runtime, its guards, or its
      authorization changes here; a fifteenth whole-machine restart -- even
      one whose exact duration is ambiguous -- is not evidence the runtime
      lock's own guards were inadequate against a class of event
      (whole-machine restart) no per-process guard in that lock claims to
      protect against.
    - >-
      WATCHDOG SIZING RATIONALE REMAINS VALID, UNCHANGED. Even under the
      longest reading this lane has ever observed (the thirteenth restart's
      own ~5h21m upper bound), the duration remains far short of the 86400s
      (24h) watchdog ceiling; this fifteenth restart's own [~44.8min,
      ~49.8min] interval is trivially far shorter still. 86400 seconds
      remains sized generously above the longest duration this lane can
      currently establish under any reading and remains a ceiling meant never
      to bind in the normal case, machine protection only per CLAUDE.md
      "Research budgets: progress first".
    - >-
      DIRECTION CHECK, unchanged from the whole DEC-20260909-bf5b48 ..
      DEC-20260921-475cd5 chain. Stage0 is not itself exponent-moving; it is
      the correctness gate for H-FROB-73df22's two arms. No scientific claim
