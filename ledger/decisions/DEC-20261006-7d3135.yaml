  context: >-
    /design-experiment, one contract, for IDEA-20261005-bd02d9. No
    hypothesis and no experiment on origin/main cited that idea at the
    start of this session. The branch design/ntru-bd02d9-fatigue was
    created from origin/main at
    579e6944aa25fab8af7dcead777c9d3078e2e73d and git merge origin/main
    reported already up to date.

    The contract is a control at n=64, dimension 128. It asks whether a
    pre-registered z-shape, together with a vector in the secret span,
    appears on ternary NTRU at q=1024 and not at q=32, and not on a
    cyclotomic ideal, a non-NTRU module lattice, or a matched random
    q-ary lattice. Cell P is a planted non-NTRU dense sublattice so a
    silent detector cannot be scored as absence of the transition.

    The observation that assigns the result to the NTRU dense-sublattice
    line is secret-tied z-shape on N+ only, with that same predicate
    silent on I, M, R, and N-. The observation that would show the same
    transition on a non-NTRU lattice is z-shape equal to 1 on I, M, or R.
    A log-unit certificate is KN-TECH-046 and is excluded. A
    coefficient-isometry bit discount is KN-OPEN-026 and is excluded.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, seeds, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification criterion,
    and required artifacts are all non-null. Success is one assignment
    row and fails on three other reachable rows. No field required for
    approval was left null. No lattice was reduced while writing this
    decision.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a line are fixed before any run.
    - Cell P gives the detector a way to be inconclusive instead of converting a dead instrument into a negative result.
    - A z-shape on I, M, or R falsifies specificity without any attack claim.
    - The class-group line and the isometry line are named exclusions, not extra success conditions.

  evidence_refs: []
  limitations:
