coordinator_decision:
  id: DEC-20260805-0041a6
  context: >-
    GOAL-AES-003 BATCH-012 close. A single-constant load-factor change to
    rc8probe_ideal.c's hash table let comparison B (BATCH-009's cipher-
    substitution finding, tested on an independent instrument since BATCH-011)
    reach 2^25 trials within its 8 GB budget, up from 2^24. Both arms still
    read zero hits. The package was bound by a dispatcher-verified snapshot
    archive at commit 9c25b534 and reviewed by one independent validator,
    verdict passed.
  decision: exhaust_lever_reroute
  target_ids: [RQ-AES-003, GOAL-AES-003, EV-AES-837cd8]

  rationale:
    - >-
      THIS BATCH REMOVES AN AMBIGUITY RATHER THAN PRODUCING A NEW FINDING, AND
      THAT IS ITS VALUE. BATCH-011's null at 2^24 could not distinguish "the
      excess is absent under cipher substitution" from "the exposure never
      reached a level where a memory-permitted instrument could tell." This
      batch removes the second possibility for one further doubling: 2^25
      completed in full at 6.293 GB measured peak RSS, comfortably inside
      budget, and the result is still zero hits. The null is now attributable
      to statistical power alone at this exposure -- correctly stated as
      P(0 hits | true effect at BATCH-009's measured rate) ~ e^-0.4375 ~ 0.65,
      which does not distinguish the hypotheses either.
    - >-
      THE EQUIVALENCE CLAIM WAS VERIFIED MECHANISTICALLY, NOT MERELY BY OUTPUT
      MATCHING, AND THIS IS THE STANDARD FUTURE INSTRUMENT CHANGES IN THIS
      CAMPAIGN SHOULD MEET. The validator read the actual probe/forward/
      inverse functions and confirmed the changed parameter affects only
      which hash bucket a linear probe starts at, never which stored value is
      returned -- so output invariance under the change follows from the
      code's structure, and the byte-identical equivalence-check files are a
      consequence of that structure rather than a coincidence that happened
      to hold at this particular trial count. Prior equivalence proofs in
      this campaign (BATCH-008, BATCH-009, BATCH-011) established bit-exact
      reproduction empirically; this is the first to also establish WHY it
      must hold.
    - >-
      THE LEVER'S CEILING IS NOW A COMPUTED FACT, NOT AN ASSUMPTION CARRIED
      FORWARD FROM BATCH-011's DECISION TEXT. The dom/rng pair-storage arrays
      cost 32 bytes per realised pair regardless of the index load factor;
      at 2^26 trials that alone is 8.590 GB, exceeding an 8 GB budget before
      any index-table byte is counted. Recomputed independently against the
      actual malloc call sites, not read off a prior estimate. Per the
      binding constraint on this batch's own ledger archive card, this lever
      is NOT ranked a third time.
    - >-
      TWO DISTINCT "EXPECTED COUNT" QUANTITIES IN THE RAW DATA WERE CHECKED
      FOR CONFLATION AND FOUND CLEAN. The instrument's own
      null_expectation_analytic field (0.03125, the standard 4*2^-32*trials
      formula) and the campaign's empirically-calibrated expectation (0.4375,
      from BATCH-009's measured rate) are different numbers answering
      different questions, and neither the producer's nor the validator's
      report conflates them.

  evidence_refs:
    - EV-AES-837cd8
    - EV-AES-acddd0
    - EV-AES-e4c091

  what_this_decision_does_not_do:
    - It does not claim BATCH-009's cipher-substitution finding is corroborated or refuted on an independent instrument; that remains open at every exposure reached so far.
    - It does not rank a further load-factor tuning attempt; the arithmetic in EV-AES-837cd8 OBS-B12-5 forecloses that lever.
    - It does not advance any closure criterion; no model independence exists under standing basis 0137a051eb5828789eb267fa83c8278086578d4c.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED. This batch is an infrastructure/power finding, not a
      result about the r=5 excess. The mechanistic equivalence-verification
      methodology (reading the probe function's actual behavior rather than
      trusting matched outputs) is a genuine candidate technique, but as with
      BATCH-011's instrument-independence methodology, one demonstrated
      instance is premature to promote without a second application.

  next_actions:
    - >-
      SINGLE NEXT ACTION: GOAL-AES-003 BATCH-013, rank 1 = DEPRIORITIZE
      further pursuit of an independent-instrument corroboration for the
      cipher-substitution mechanism specifically, and instead run RC-C
      (DEC-20260805-a9dade rank 2, still unrun after three batches): the
      five-minute recomputation of OBS-B8-7's S-box-specificity percentile
      using all five available AES data points (14, 14, 8, ~13.5, 12) rather
      than the two BATCH-008 used. This is named as rank 1 not because it is
      more important than the cipher-substitution question, but because it
      is cheap, unrun, and does not require the engineering investment the
      cipher-substitution question now does. Rank 2: RC-D (still unrun) -- a
      second, differently-constructed null object (a keyed PRP that is not
      an oracle) to test whether BATCH-009's OUTCOME-A depends on idealness
      specifically (residual limitation U4); this can proceed independently
      of the memory-architecture problem named below. Rank 3, EXPLICITLY
      DEFERRED RATHER THAN RANKED: an O(1)-memory-per-query ideal-permutation
      construction (e.g. a Feistel or Thorp-shuffle-style keyed permutation
      evaluated directly rather than stored in a pair table) capable of
      reaching a decisive exposure (order 2^30) for the cipher-substitution
      comparison. This is real engineering work, not a cheap follow-on, and
      is deferred until ranks 1-2 are exhausted or a specific reason emerges
      to prioritize it sooner.

  budget_accounting:
    producer_declared_seconds: 3600
    producer_consumed_seconds: 676
    note: >-
      Well inside budget. The task was a single-constant change plus one
      re-run, exactly as scoped.

  limitations:
    - Nothing here is a statement about full-round or deployed AES, and no comparison to published cryptanalysis is made in either direction.
    - Toy tier; one probe geometry, one machine, trials at 2^25.
    - Session and implementation independence only; NO model independence, so nothing counts toward a closure quorum.
    - No red team reviewed this batch.
    - The cipher-substitution mechanism remains uncorroborated by any independent instrument at a decisive exposure.

  decided_by: coordinator
  decided_at: 2026-08-05

  inference:
    policy: coordinator-orchestration-code
    requested_policy: coordinator-orchestration-code
    resolved_model: claude-sonnet-5
    fallback_used: true
    model_verified: false
    standing_basis: 0137a051eb5828789eb267fa83c8278086578d4c
