  decision: revise
  decision_label: pairproduct_telescoping_derivation_accepted_with_corrected_scope

  context: >-
    Closes TASK-20260830-dc8d38's independent review of TASK-20260830-e30c67
    (idea-generator), the internal derivation dispatched by DEC-20260830-04169a
    to determine whether H-CREP-001's pair-product generators telescope like
    a product of known linear factors under polynomial multiplication. The
    archiving Coordinator independently opened and read the actual cited
    source files -- experiments/EXP-CREP-001/instances/generate_instances.py,
    experiments/EXP-CREP-001/verifier/check_representation.py,
    experiments/EXP-CREP-001/packages/build_packages.py, and
    ROUTE-04-multipoint-evaluation/package.json -- rather than trusting the
    producer's summary, and confirmed every mechanical claim exactly, with
    line-level citations recorded in
    preadmission_pairproduct_telescoping_derivation_terminal_note_20260830
    on ledger/goals/GOAL-ECDLP-001/goal.yaml.

  decision_scope: >-
    ACCEPTS, with one corrected scope boundary, the derivation's finding
    that the eight frozen EXP-CREP-001 routes, AS BUILT, are held to a
    Theta(B^3) online cost floor by a directly-verified absent
    decomposition in their shared fold-in step (build_chart_index bundles
    all five decks' raw occurrence lists into one flat node; only the
    decks-0/1 pair has a dedicated compact pairwise object,
    load_pair_product_generators; materialize_resultant_coefficients is a
    single non-decomposed atomic edge, identical across all seven
    non-oracle routes via the shared build_expansion_route() builder, at
    cost/output exponent exactly 3). This floor is mechanically forced by
    the verifier's own max-aggregation rule (check_representation.py's
    check_V6, matching build_packages.py's aggregate_certificate formula
    exactly) rather than by any assumption about r_R's algebraic
    structure -- independently hand-traced against ROUTE-04's own edge
    list (online edge outputs [3,1,1,1,1], online node sizes [3,1,1,1],
    max = 3, matching its declared online.workspace_exponent_in_B). This
    is the first internally mechanism-derived explanation, across
    fourteen prior analytical rounds (thirteen trigger-search rounds plus
    the gate/framing review), for why EXP-CREP-001's ROUTE-04/ROUTE-07
    measured Theta(B^3) instead of the quasi-linear cost the classical
    subproduct-tree/remainder-tree technique achieves for a generic
    product of known linear factors.
    CORRECTED SCOPE, explicitly narrower than the bare outcome_found label
    in isolation could suggest: what is proven is that the EIGHT FROZEN,
    AS-BUILT ROUTES are held to this floor by an absent decomposition this
    Coordinator independently verified is genuinely absent from their
    code. This is NOT a proof that the complete-chart intersection
    system's fold-in of decks 2, 3, and 4 admits NO decomposition under
    any possible construction -- that broader question remains open and
    is unaddressed by anything in H-CREP-001 or the eight frozen routes,
    confirmed by this Coordinator's own independent re-check of
    PREPROCESSING_KINDS and build_chart_index (no combination rule for
    any deck pair beyond decks 0/1 exists anywhere in the frozen record).
    The proves-too-much control against the classical subproduct-
    tree/known-linear-factors nearby object (Theta(log D) decomposition
    levels with every node reduced modulo the smaller modulus, a
    directly-inspectable structural fact, not an asserted premise) is
    independently confirmed to genuinely DERIVE the asymmetry from the
    actual code inspected, correcting the specific defect (an asserted
    rather than derived premise) found in the prior round's
    coefficient-space-versus-ideal/root-space dichotomy attempt.

  what_this_decision_does_not_do:
    - It does not change H-CREP-001's status (remains approved).
    - It does not change EXP-CREP-001's specification (remains frozen, unmodified).
    - It does not admit any B71, batch, experiment, or implementation.
    - It does not claim that no decomposed alternative for decks 2-4's fold-in can exist; that question is recorded as an open problem (KN-OPEN-7f424d), not closed.
    - It does not establish or move toward any asymptotic-complexity claim about ECDLP itself; the four promotion gates in CLAUDE.md remain entirely undischarged and are not engaged by this decision.

  non_claims:
    - This is not evidence that a public sub-Theta(B^3) constructor for r_R mod g_I is impossible in general; it explains why the eight SPECIFIC frozen routes hit that floor, mechanically, not why every conceivable route must.
    - Finding a genuine, code-verified obstruction in the as-built routes is not itself progress toward or against solving H-CREP-001's underlying problem; it sharpens exactly where the open question now lives (decks 2-4's fold-in decomposition).
    - 'Mechanism-derived does not mean machine-checked -- this is a careful, source-verified analytical derivation by two independent Coordinator-role sessions (the review''s own producer and this decision''s archiving Coordinator), not a formal proof.'

  rationale:
    - "Every mechanical claim (generator structure, vocabulary asymmetry, atomic-edge sharing, max-aggregation formula, ROUTE-04 arithmetic) was independently re-verified by the archiving Coordinator by directly opening and reading the cited source files and reproducing the arithmetic from raw data, not by trusting the producer's summary -- all confirmed exactly, none contradicted."
    - "The proves-too-much control was scrutinized most carefully of all, since this exact check failed in the prior round: it now rests on a directly-inspectable structural fact (decomposition-level count) rather than an asserted premise, genuinely correcting the prior defect."
    - "The scope of what is proven (the eight as-built routes) versus what remains open (whether any decomposition can ever exist for decks 2-4) is stated precisely in the producer's own artifacts and is preserved, not widened, by this decision -- the corrected framing prevents the bare outcome label from being read as a broader impossibility claim than what was actually shown."

