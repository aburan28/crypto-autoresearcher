  limitations:
    - "This is a zero-compute analytical/code-reading verification, not a machine-checked proof or an executed experiment; H-CREP-001's claim tier is unaffected."
    - "The scope-narrowing correction in this decision applies to how the finding is read and cited going forward; it does not retroactively alter the producer's own artifacts, which already stated the narrower scope in their own detail fields."
    - "Whether an interleaved, modulus-reduced combination rule for a second deck pair (e.g. decks 2-3) could exist and telescope is the single largest open question this decision surfaces, and is deliberately not answered here."

