    - TASK-20260913-c60ffd

  context: >-
    IDEA-20260913-31457a proposes the full-rational-2-torsion descent label as
    the missing positive control for coordinate-dependent Stage 0
    instruments. The design preserves its exact p=23 anchors but repairs the
    proposal's control weakness: random labels are judged by a registered
    empirical-null threshold rather than equality to an expectation, and all
    known-false/tail gates are driven by payload mutations and assembled
    outputs. A planted homomorphism and a fibre-preserving non-homomorphic
    relabeling separate native multiplication from image-size/zero-fibre
    observables. The coarsening ladder has two strictly positive improper
    interiors and distinct exact/constant zero endpoints.

  decision_scope:
    hypothesis_status_after_design: specified
    approved_experiment: EXP-ECDLP-08f99d
    authorized_stage: 0
    maximum_runs: 1
    run_id: RUN-ECDLP-b1abd8
    certificate_kind: none
    claim_ceiling: stage0_positive_control_fixture_only
    stage1_authorized: false
    stage2_authorized: false
    executor_handoff: TASK-20260913-67db19
    executor_dispatchable_now: false
    snapshot_required_first: TASK-20260913-165671
    ledger_archive_required_first: TASK-20260913-c60ffd
    hypothesis_truth_asserted: false
    hypothesis_status_changed_to_approved_or_running: false
    experiment_executed: false

  rationale:
    - >-
      PROTOCOL COMPLETENESS. The frozen contract contains exact inputs,
      controls, independent variables, metrics, seed/replication strategy,
      bounded resources, stopping/invalidation rules, decidable success and
      falsification criteria, required artifacts, measured-versus-modeled
      separation and a pre-run review plan.
    - >-
      CONTROL POWER. RUN-ECDLP-1bef8f-S0 showed that clean expected labels are
      not enough: tautological/static controls can validate themselves. This
      contract requires the same public evaluator to consume mutated payloads,
      derives all gates from assembled outputs, and injects values that must
      move each gate in a registered direction.
    - >-
      NULL DISCIPLINE. The matched null fixes 200 exact seed streams and one
      integer violation statistic. Its decision threshold is a frozen lower
      order statistic of the realized null distribution. No equality to a
      balls-in-bins expectation is an admission gate.
    - >-
      IDENTIFIABILITY. The non-homomorphic phi(k mod 4) control has the same
      image size and zero fibre-propagation violations as the planted quotient
      but positive native-law violations. Thus the design cannot infer label
      multiplication from the coarse observable.
    - >-
      EXACT SCOPE. Stage 0 is one exhaustive p=23 fixture only. It measures no
      c or timing, performs no attack, and licenses no transfer. H2 is carried
      exactly but remains untested in unauthorized Stage 1.
    - >-
      HONEST ECDLP ACCOUNTING. KN-TECH-030 establishes that the displayed
      2-primary gain is already Pohlig-Hellman. The established exponent gain
      is 0 and there is no prime-order attack lens.
    - >-
      PRIOR-RECORD BOUNDARIES. H-TORS-9851f8 supports odd-order triviality.
      IDEA-20260806-c5d183 supplies the composite-order nearby-object control.
      KN-FIND-ffe1df's headline closure is withdrawn and is not support; only
      exact Theorem C is cited as an exact-only boundary.
    - >-
      STANDING AUTHORIZATION. AGENTS.md records the user's 2026-09-06
      instruction that ideas and experiments are always approved once the
      protocol is complete. User confirmation is not an outstanding gate.
      Approval authorizes work and asserts no truth.

  evidence_refs:
    - ledger/proposals/IDEA-20260913-31457a.yaml
    - ledger/hypotheses/H-ECDLP-3a73d1.yaml
    - experiments/EXP-ECDLP-08f99d/specification.yaml
    - ledger/hypotheses/H-TORS-9851f8.yaml
    - knowledge/techniques/KN-TECH-030.md
    - ledger/proposals/IDEA-20260806-c5d183.yaml
    - knowledge/findings/KN-FIND-ffe1df.md
    - >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-e5c603/review_plan_s0_08f99d.yaml
    - >-
      experiments/EXP-ECDLP-1bef8f/amendments/CORR-20260913-a3ffdb-stage0.yaml

  limitations:
    - >-
      This is a design and authorization decision, not evidence. No run exists
      and no result is predicted as observed.
    - >-
      H-ECDLP-3a73d1 remains specified. Approval of EXP-ECDLP-08f99d does not
      approve or support the hypothesis.
    - >-
      Stage 0 can conclude only fixture/instrument validity at p=23. It cannot
      support a universal 2-descent theorem, a pruning cost, a timing claim,
      a prime-order statement beyond cited exact mathematics, or any attack.
    - >-
      Full rational 2-torsion and composite group order are structured-family
      preconditions. No cryptographic or standardized-curve transfer is licensed.
    - >-
      Stage 1 and Stage 2 remain specified but unauthorized and require later
      additive decisions.
    - >-
      Future same-session review, if used, must record independent_session
      false and cannot be described as independent corroboration.
    - >-
      This authorization is unpublished and not dispatchable until both
      declared archive receipts verify and the branch is pushed with an open
      PR against main.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Design approval only. No run, evidence record, replicated result or
      durable new finding exists.

  next_actions:
