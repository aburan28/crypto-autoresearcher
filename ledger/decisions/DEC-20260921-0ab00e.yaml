  the_decision_stated_plainly: >-
    RUN-FROB-b8e451's interruption is diagnosed, honestly and without
    fabrication, as the SAME failure family that destroyed RUN-FROB-c27b95,
    RUN-FROB-b91d47, RUN-FROB-9c4e81, RUN-FROB-e6c204, RUN-FROB-a91f4c,
    RUN-FROB-35c3b1, RUN-FROB-5fa3f0, RUN-FROB-0b1c8e, RUN-FROB-5490f1,
    RUN-FROB-16ecb6, RUN-FROB-f3e2a3, and RUN-FROB-39714f: a
    whole-environment/container restart external to any script's own
    control, external to any timeout wrapper (there was none this time
    either), and external to any code defect in
    driver-v2.py/checker-v2.py. This is the THIRTEENTH, CONSECUTIVE instance
    of the identical infrastructure failure family under the same,
    already-corrected source and launch procedure, launched correctly by the
    dispatching session every time. Its own survival duration is, like the
    twelfth restart's, honestly ambiguous rather than resolved by assumption:
    the last observed file write was at 11:07:09.846723Z, but the confirming
    reboot was not observed until 13:19:21Z, a gap of roughly 2h12m -- larger
    than the twelfth restart's own ~53-minute gap. This record does not pick
    one of the two readings this gap admits and does not average or split
    the difference; it records the true interval as GENUINELY UNKNOWN,
    bounded only by [~3h09m, ~5h21m]. EITHER bound is already, by a wide
    margin, this lane's longest survival to date (prior record ~37 minutes,
    RUN-FROB-35c3b1) -- a fact recorded plainly, without asserting a trend
    from one data point and without asserting anything about the
    interruption mechanism having changed. This uncertainty is itself
    infrastructure/observability signal, never negative mathematical
    evidence about H-FROB-73df22 (AGENTS.md core rule 3 / CLAUDE.md rule 3),
    and this record does NOT condition its own authorization on either
    resolution of it. None of the thirteen says anything about H-FROB-73df22.
    On that basis, this coordinator (1) makes no change to RUN-FROB-b8e451's
    directory -- it was already committed and pushed exactly as it stands
    (the oversized-artifact-pointer.json for the 2.48GB roots.jsonl.gz, and
    the other six adapter/launch files, no execution-receipt.json) by the
    dispatching session prior to this engagement, and this record does not
    touch it again -- and (2) authorizes a fresh retry under a fresh,
    coordinator-proposed (NOT yet allocate_id.py-confirmed) run_id,
    RUN-FROB-a749d2, via a fresh trial-plan-stage0-v18.json, a fresh
    run-binding, and a fresh launch handoff to the Executor
    (TASK-20260921-7ef651), per the user's standing instruction to keep
    retrying automatically through this exact recurring failure mode.

  rationale:
    - >-
      THIRTEENTH, CONSECUTIVE INSTANCE OF THE SAME FAILURE FAMILY, STILL
      INFRASTRUCTURE/PROTOCOL SIGNAL, NEVER NEGATIVE MATHEMATICAL EVIDENCE,
      PER AGENTS.md CORE RULE 3 / CLAUDE.md RULE 3. RUN-FROB-b8e451's
      resulting run-directory shape (real, substantial partial scientific
      output -- 2.48GB of roots.jsonl.gz, this lane's largest by a wide
      margin -- no execution-receipt.json, entire process tree including the
      Python supervisor destroyed before any receipt-writing logic could
      run) matches every one of its twelve predecessors under
      driver-v2.py/checker-v2.py. Thirteen-for-thirteen launch attempts under
      that source have now been killed by whole-environment restarts, all
      non-scientific, non-protocol infrastructure signal. None of
      RUN-FROB-b8e451 or any predecessor says anything about H-FROB-73df22,
      RQ-FROB-7d8dd4, or whether Frobenius structure moves the index-calculus
      exponent.
    - >-
      THE HONEST AMBIGUITY ITSELF, STATED PLAINLY, NOT RESOLVED BY
      ASSUMPTION -- AND ITS OWN NOTABLE FEATURE: UNLIKE THE TWELFTH RESTART,
      THIS ONE'S CONFIRMED-WRITES DURATION ALONE ALREADY SETS A NEW RECORD.
      RUN-FROB-b8e451's last confirmed write (11:07:09.846723Z, roots.jsonl.gz
      at 2481963056 bytes) already establishes a floor of ~3h09m of genuine
      progress -- roughly five times the prior confirmed record of ~37
      minutes (RUN-FROB-35c3b1) -- independent of how the monitoring-gap
      ambiguity resolves. The gap itself (last write to confirmed reboot,
      ~2h12m) is larger than the twelfth restart's own ~53-minute gap, so
      this thirteenth point's true interval cannot be narrowed below
      [~3h09m, ~5h21m]. This record explicitly declines to assume the
      process died promptly after its last write (the lower bound) merely
      because that is the more conservative reading, and equally declines to
      assert the ~5h21m upper bound as fact. The honest statement is: this
      thirteenth point's true interval lies somewhere in [~3h09m, ~5h21m],
      and which value it actually is CANNOT be recovered from the artifacts
      that survive a whole-environment restart. Both bounds are already a
      dramatic, unprecedented improvement over every prior attempt in this
      lane; this record states that fact plainly without overinterpreting a
      single data point as evidence the underlying restart cause has
      changed, improved, or become better understood -- nothing about the
      interruption mechanism itself is understood any differently than
      before.
    - >-
      NO FABRICATED RECEIPT, AND NO REDUNDANT PRESERVATION ACTION. This
      decision does NOT author an execution-receipt.json for RUN-FROB-b8e451,
      and does not construct, estimate, or infer one from the partial
      roots.jsonl.gz or from what a graceful interruption receipt would
      ordinarily contain. RUN-FROB-b8e451's directory was already committed
      and pushed exactly as found by the dispatching session, prior to this
      engagement, in commit a12601a25 -- this coordinator's own Glob confirms
      the working tree holds the seven committed entries (launch.json,
      command.txt, stdout.log, stderr.log, environment.json, tuples.jsonl.gz,
      roots.jsonl.gz.oversized-artifact-pointer.json) plus the raw,
      uncommitted roots.jsonl.gz itself, and no execution-receipt.json or
      other downstream adapter/checker artifact. Per AGENTS.md core rule 5,
      this record does not edit, complete, or backfill that directory in any
      way, and does not touch the run directory's exclusive-create
      run_id semantics (RUN-FROB-b8e451 is spent and cannot be reused).
    - >-
      OVERSIZED-ARTIFACT HANDLING WAS NEEDED THIS TIME, AND THIS RECORD DOES
      NOT MANUFACTURE ANYTHING BEYOND WHAT WAS ALREADY DONE. RUN-FROB-b8e451's
      roots.jsonl.gz (2481963056 bytes, ~2.48GB, reported_by_session) exceeds
      GitHub's 100MiB per-file limit, so it was committed via the
      oversized-artifact-pointer.json disclosure pattern established for
      RUN-FROB-9c4e81 (151339023 bytes) and RUN-FROB-35c3b1 (486954627
      bytes), rather than committed directly like RUN-FROB-b91d47's or
      RUN-FROB-c27b95's. This is a difference in file size only, not a
      scientific or protocol difference, and (given this is by far this
      lane's largest observed roots.jsonl.gz) is itself further,
      non-scientific confirmation that the run made unusually deep genuine
      progress before being interrupted.
    - >-
      THE RUNTIME LOCK BEING CITED REMAINS THE SAME, STILL-CURRENT, STILL-
      UNEDITED, LAUNCH-AUTHORIZED LOCK. This coordinator carries forward
      linux-runtime-lock-successor-20260914-c85f6a.json's content sha256
      (46d918a1a4b9d358df39f09a87d5221128cc1ce19cb62672bc35204785952eb5)
      unchanged from trial-plan-stage0-v17.json's and
      run-binding-stage0-v17-retry-20260921.json's own already-filled
      runtime_lock_sha256 fields (all agree, re-read directly in this
      engagement). Nothing about the runtime, its guards, or its
      authorization changes here; a thirteenth whole-machine restart -- even
      one whose exact duration is ambiguous, and even one that ran far
      longer than any predecessor -- is not evidence the runtime lock's own
      guards were inadequate against a class of event (whole-machine
      restart) no per-process guard in that lock claims to protect against.
    - >-
      WATCHDOG SIZING RATIONALE REMAINS VALID, UNCHANGED EVEN UNDER THE
      LONGER READING. Even under the longer, ~5h21m reading of this
      thirteenth interval -- by far this lane's longest survival to date
      under either bound -- it remains far short of the 86400s (24h)
      watchdog ceiling, and RUN-FROB-b8e451 showed no confirmed sign of
      hanging (only an absence of monitoring turns during the gap, not a
      confirmed absence of progress). 86400 seconds remains sized generously
      above the longest duration this lane can currently establish under
      either reading and remains a ceiling meant never to bind in the normal
      case, machine protection only per CLAUDE.md "Research budgets:
      progress first".
    - >-
      DIRECTION CHECK, unchanged from the whole DEC-20260909-bf5b48 ..
      DEC-20260921-64977d chain. Stage0 is not itself exponent-moving; it is
      the correctness gate for H-FROB-73df22's two arms. No scientific claim
      of any kind is advanced by this admission/retry-authorization record.
      FROB is a declared ECC area (orchestration/research-priority.yaml),
      ranked ahead of non-ECC candidates at every selection point, with
      unlimited batch/wall-clock budget per AGENTS.md "ECC comes first."
    - >-
      BUDGET. Per CLAUDE.md "Research budgets: progress first" (2026-09-06):
      research cost estimates are advisory and require no repeated user
      approval; the Coordinator continues justified work within the
      authorized research scope. No 90-day stagnation review is active or
      warranted -- this lane has shown continuous documented progress across
      DEC-20260909-bf5b48 through DEC-20260921-64977d and now this record,
      all within roughly two weeks, including thirteen genuine,
      correctly-executing partial runs, each destroyed only by
      infrastructure external to this program's own control, and the most
      recent of which ran roughly five times longer than any predecessor
      before being interrupted -- itself consistent with "documented
      progress" rather than stagnation, however that single data point is
      eventually read. Authorizing a further retry after a thirteenth,
      consecutive infrastructure-only interruption is exactly the kind of
      routine continuation CLAUDE.md's "progress first" instruction
      protects, not a new spending decision requiring fresh justification.
      This is additionally, and explicitly, covered by the user's own
      standing instruction, relayed by the dispatching session, to keep
      retrying automatically through this exact recurring failure mode --
      stated multiple times already. This coordinator's role is to execute
      that instruction faithfully via a proper decision record, not to
      second-guess it. A whole-machine restart mid-run is squarely within
      "watchdog expiry checkpoints a task; it does not exhaust the
      campaign."
    - >-
      NA-4's INFRASTRUCTURE-DIAGNOSIS RECOMMENDATION REMAINS OUTSTANDING AND
      IS REAFFIRMED, NOT RE-OPENED AS A NEW GATE -- AND ITS VALUE IS NOW
      HIGHER STILL. DEC-20260921-1988f5's own NA-4, reaffirmed by every
      intervening decision through DEC-20260921-64977d, recommended,
      non-blockingly, that the dispatching session open a dedicated
      infrastructure-diagnosis task. This record has not been told, and does
      not assume, that this diagnosis task has been opened, run, or
      completed. A THIRTEENTH consecutive instance -- now including a
      monitoring gap even larger than the twelfth's, and a run that survived
      roughly five times longer than any predecessor before being
      interrupted -- is further, unambiguous reinforcement that this
      diagnosis remains worth pursuing: specifically, whether the underlying
      restart cadence itself is lengthening (which a single ambiguous data
      point cannot establish, but which is exactly the kind of question a
      platform-level diagnosis could answer with dmesg/journalctl/eviction
      logs that this coordinator has no access to), and that any such
      diagnosis should also capture continuous (not just periodic)
      monitoring where feasible, so a future interruption's duration is not
      lost to a monitoring gap the way this one and the twelfth restart's
      both were. This record reaffirms the recommendation rather than
      re-litigating or escalating it into a new condition -- it still runs in
      PARALLEL with, and never blocks, the retry authorized here.
    - >-
      TWO DIVERGENT COUNTS, REPORTED HONESTLY AND SEPARATELY, CONSISTENT WITH
      THIS CHAIN'S OWN PRIOR NUMBERING. This lane has now seen THIRTEEN
      genuine launch-and-restart cycles under driver-v2.py/checker-v2.py
      (RUN-FROB-39714f through the current RUN-FROB-b8e451) and, counting
      RUN-FROB-2404fa (genuine but under the pre-fix driver.py) as this
      lane's first genuine launch overall, RUN-FROB-b8e451 is the FOURTEENTH
      genuine launch attempt overall; this record's own authorization,
      RUN-FROB-a749d2, is the FIFTEENTH genuine launch attempt overall by
      that same counting convention. Separately, this is the EIGHTH
      trial-plan VERSION minted since v11 (v11, v12 [never launched, wiring
      bugfix], v13, v14, v15, v16, v17 [all six launched, ninth through
      thirteenth restarts], and v18, this record's own authorization). This
      record does not collapse the launch-and-restart count and the
      trial-plan-version count into a single number in either direction, and
      does not count the v12 non-launch as an additional restart or omit it
      from the record's own history.

