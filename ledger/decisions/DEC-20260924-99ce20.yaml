  # ---------------------------------------------------------------------------
  selected:
    - id: S1
      idea_id: IDEA-20260922-7d6d43
      question_id: RQ-NISTBIN-06157b
      scope: >-
        Parts 1-2 only. The sensitivity surface cost_571(D_solve, omega) is
        reconciled to EXP-SEMBIN-992e73's exact block_n4w model at D_solve = 4, and
        the zero locus D*(omega) is read only after that reconciliation. The 283
        proves-too-much control is included. Part 3, the true U-4-discharged
        solving-degree measurement, is NOT designed here. Under R2 it is SEMBIN and
        SDEG work, routed to GOAL-SEMBIN-fcb7a2 as a pointer.
      decision_it_changes: >-
        How the reachability table records the program's single below-rho
        index-calculus cell (B-571/K-571, EXP-SEMBIN-992e73, conditional on
        Assumption 1). Either it is recorded as a conditional computed_cost with a
        named cliff edge D*(omega) in the exact model, against the corrected rho
        column, or it stays an unqualified point estimate. The outcome also fixes
        the threshold GOAL-SEMBIN-fcb7a2's true-solving-degree measurement must be
        read against, and so whether that measurement is ranked decision-critical
        for the 571 cell. Positive next decision if D* sits well above any
        plausible true degree: the cell stays conditional and Part 3 is not
        prioritised on its account. Negative next decision if D* sits in the low
        teens: Part 3 becomes the deciding measurement and is pointed to its owner
        as such. If the reconciliation fails, the illustrative D* is withdrawn and
        only the exact model is used.
      proof_search_map_status:
        bottleneck_decision_changing: present
        baseline_reproduction: >-
          PRESENT BUT DEFECTIVE IN SUBSTANCE. The record's baseline quotes the naive
          571 rho column 2^285.5, which folds in no negation, Frobenius or constant
          saving. The reconciliation of the illustrative surface to 186.31 at
          D = 4 is planned but not done. The DESIGN CARD MUST SUPPLY THE MISSING
          AUDIT BEFORE APPROVAL (design_conditions C1-C2).
        observation_collision: present (fake d'_F read as the true D_solve is the named collision)
        quantifier_order: present (the cliff is derived, the crossing is measured)
        method_ceiling_nearby_object_control: >-
          Present. The 283 proves-too-much control and a random-system null are
          named. The 283 control quotes the naive 2^141.5 and must also move to the
          corrected column.
        strictness_and_interfaces: >-
          No strict improvement is claimed. The interface between the illustrative
          XL surface and the block_n4w model is a separate proof obligation in the
          design (condition C3).
      gate_ruling: >-
        Selected under the card's second branch: the design card supplies the
        defective baseline audit first, as a frozen regression fixture that must
        pass before approval.
      r2_owner: >-
        RQ-NISTBIN-06157b for the 571 family cell. The surface is arithmetic over
        SEMBIN's published numbers, not a re-measurement. Part 3 belongs to SEMBIN
        and SDEG.
      design_conditions:
        - id: C1
          text: >-
            Replace the rho column by the corrected matched-rho convention of
            CORR-20260922-81aeab, sqrt(pi r/(4k)), with k the curve's own Frobenius
            class order (k = 1 on B-curves). 571 values K-571 279.75 and B-571
            284.83 (the session's check, and this record's own arithmetic, which
            gives 284.5 - 0.175 - 4.579 and 285.0 - 0.175). K-283 and B-283 are
            re-derived in the design from primary parameters. Claim (A), exactly
            one cell below rho, is re-evaluated against the corrected column at
            every FIPS, Certicom and Oakley degree.
        - id: C2
          text: >-
            Freeze a regression fixture. The reconciled surface must reproduce
            EXP-SEMBIN-992e73's 571 row, log2 index-calculus cost 186.31 at
            D_solve = 4, inside that experiment's exact block_n4w model and within a
            tolerance the contract states before execution. The margin is quoted
            against both corrected rows. No D* is read before the fixture passes.
        - id: C3
          text: >-
            State the illustrative-to-block_n4w interface as its own lemma (KN-TECH-080
            interface preservation), with the multipliers the illustrative model
            omits named individually.
        - id: C4
          text: >-
            Read at source before writing the per-instance discharge requirement or
            relying on the coherent baseline: KN-FIND-936151, EV-SEMBIN-1ca3c8,
            H-SEMBIN-97ea23 and EXP-SEMBIN-992e73 RESULTS. The proposal records that
            it did not read the first three directly. Read the GOAL-SEMBIN-fcb7a2
            head and confirm that no D_solve sensitivity surface exists or is in
            flight there. If one is, stop and report instead of designing a
            duplicate.
        - id: C5
          text: >-
            The proposal's session-computed figures (margins at D = 4, 12 and 20;
            D* about 12 to 20) have no archived artifact. The contract recomputes
            them and never cites them as results.
        - id: C6
          text: >-
            Number the heuristics. H1 is the XL/block cost model, validated inside
            the contract by the C2 reconciliation and the 283 control. H2 is the
            D_solve(m) growth law, validated by Part 3 under GOAL-SEMBIN-fcb7a2 and
            scheduled as that pointer. This is the heuristic-validation pairing the
            dispatch bias requires. The random-system null belongs with Part 3.
        - id: C7
          text: >-
            Pre-register routing. Any result reading as E1 (index calculus below rho
            at 571 at the true degree), E2 (the 571 cell closed), or any verdict on
            the 571 cell is reviewed at review-breakthrough at max. Parts 1-2 can at
            most state D*(omega) in the reconciled model, assuming H1. They cannot
            open or close the cell.
        - id: C8
          text: >-
            Keep the memory disclosure (Macaulay matrix about binom(nvar, D_solve)
            rows) beside every time figure. Excluded reads: experiments/EXP-FROB-30006a/,
            experiments/EXP-QSP-70b731/runs/, the cursor/semaev ref and PR #1377.
            Zero runs in the design batch.
    - id: S2
      idea_id: IDEA-20260922-261004
      question_id: RQ-BINSTD-b6f698
      absorbs:
        - idea_id: IDEA-20260922-b19793
          as: >-
            A section deriving that the F_r[Z/n]-module structure collapses to the
            single lambda-eigenblock of size about |V|/n, because n divides r - 1.
            This is the same saving as the orbit quotient, not a second one
            (report check A8).
        - idea_id: IDEA-20260922-dacfc2
          as: >-
            The derived quotient-memory column |V|/k. Its measured K/B memory
            comparison is NISTBIN-owned under R2 and is not designed. Its toy
            degrees n = 29 and 37 host no nontrivial stable subspace (A10).
      scope: >-
        Part 1: deployed arithmetic. The ord_n(2) census and stable-dimension sets at
        n = 131, 163, 233, 283, 409, 571, and the k | r - 1 verdict at the eleven
        standardized subfield and Koblitz rows from primary parameters. Part 2 is
        restricted to the per-conjugate-family rank readout (raw,
        orbit-quotient and ker-g-module bases) with orbit-length histograms,
        planted-rank controls, the null object and the non-stable-subspace
        proves-too-much control. The n = 17 reproduction cell of KN-OPEN-095df5
        runs first. EXCLUDED: H-261004-1 (assembled-matrix rank growth, RELN's
        relation-yield quantity) and Part 3 (full-pipeline charged cost, FROB and
        RELN), both pending their owners' concurrence.
      decision_it_changes: >-
        Whether every Frobenius-row relation-yield column in RQ-BINSTD-b6f698's
        reachability table is recorded in the per-orbit unit, one relation per
        solve rather than k. That moves each Koblitz and subfield index-calculus
        margin by log2 k bits against the attacker (7.86 on K-233, 3.46 on
        c2pnb176v1 per the record's sota_delta). It also decides on which
        standardized rows the Frobenius accounting may be stated at all (census and
        k | r - 1). It gates 1a081a's C3 sign and c48e7d's Saving-B column.
        Positive next decision if raw rank k and quotient rank 1 hold on every
        relation: the table adopts the per-orbit unit and rank 7 onward is re-read.
        Negative if any quotient rank exceeds 1: the factor-k linear-algebra gain is
        in question and goes to review. If k does not divide r - 1 at any row, that
        row's parameters or the structural claim are wrong and everything downstream
        stops until it is resolved.
      proof_search_map_status:
        bottleneck_decision_changing: present
        baseline_reproduction: >-
          Present. The n = 17 cell (r = 65587, lambda = 17184) from KN-OPEN-095df5
          is the reproduction fixture. The rho convention H-261004-2 divides by
          sqrt(2k), a deviation covered by CORR-20260922-0d365e. The design applies
          the correction.
        observation_collision: present (the orbit-length histogram separates a module collapse from short-orbit artefacts)
        quantifier_order: present (for all relations; one counterexample refutes)
        method_ceiling_nearby_object_control: present (two blocking controls, the k = 1 null curve and a non-stable subspace)
        strictness_and_interfaces: >-
          With Part 3 excluded, no end-to-end strictness claim is made, and the
          design says so. The raw-to-quotient change of coordinates is a stated
          interface obligation already in the record.
      gate_ruling: All four audits present with substance; selected under the card's first branch.
      r2_owner: >-
        RQ-BINSTD-b6f698 for the rank certificate, the table column and the
        structural census (R2: structural-emptiness certificates are BINSTD's).
        Relation-yield measurement is RELN's; the decomposition mechanism is FROB's.
      heuristic_note: >-
        The scoped claims carry no heuristic (the record's H-261004-0), so no
        conditional result is dispatched and no validation pairing is owed. The one
        heuristic, H-261004-1, is excluded from scope.
      design_conditions:
        - id: C1
          text: >-
            Toy degrees. The positive arm uses n in {17, 23, 31, 41}, where
            ord_n(2) < n - 1 (report check A12, confirmed here: 8, 11, 5, 20). The
            forced-negative arm uses n in {19, 29, 37}, where ord_n(2) = n - 1 and
            Part 2 must find nothing to measure. Exclude cells with |V| < 4n from the
            disjointness reading. Use two curves with different r at each n.
        - id: C2
          text: >-
            Replace H-261004-2 with the corrected convention sqrt(pi r/(4k)) per
            CORR-20260922-0d365e, and restate the net-gap claim so that rho falls by
            sqrt(n), not sqrt(2n).
        - id: C3
          text: >-
            The ord_n(2) census is authored ONCE, here, as a structural certificate
            under RQ-BINSTD-b6f698 (R2). IDEA-20260922-c48e7d cites it rather than
            re-deriving it. See departure DEP-3.
        - id: C4
          text: >-
            Attempt to read eprint 2020/1315 (GGMP) Lemma 3.3 at source and record
            its provenance as retrieved. If it cannot be reached, record the
            impediment and keep claim (C) scoped to KN-OPEN-095df5's relay. KN-LIT-796
            is abstract-level only.
        - id: C5
          text: >-
            Re-derive r for the five c2pnb curves, ECC2K-130 and K-163 to K-571 from
            their primary standards. The analysis/binstd-curve-audit dump is a
            cross-check, not the source. Zero runs in the design batch.

