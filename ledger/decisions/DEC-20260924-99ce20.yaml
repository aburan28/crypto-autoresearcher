  merged_cluster_survivors:
    rule: >-
      DEC-20260924-4f8a03 R2. BINSTD owns the reachability table and
      structural-emptiness certificates. CERTBIN, NISTBIN and OAKLEY own measured
      decomposition cost on their own families. Mechanism owners (SEMBIN, QSP,
      ICPERF, FROB, SDEG/DREG, RELN) keep their quantities. A consolidated member's
      record is not edited; it stays proposed and citable, and its content travels
