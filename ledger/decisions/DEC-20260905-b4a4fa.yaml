  producer_output_summary: >
    The filed mechanism (M0-M6, grounded step by step in the committed
    construct_highrank.py / twist_family.py machinery): force s(a_i) = d_i *
    square for several chosen squarefree d_i at once via an interpolant
    delta with s(b_i) = delta(b_i) * g(b_i)^2 = d_i * g(b_i)^2 at the
    prescribed points; class membership is an INPUT, points are evaluations
    once (b, r) solves the quadratic system. Parameter count (run-1
    verified): n free b's + (n-1) projective r's - (n-5) quadratic
    conditions = an (n+4)-dimensional family for every n >= 6. Multi-class
    forcing SURVIVES the degrees-of-freedom arithmetic at n = 8 (4 classes
    x 2 points, density exponent +1), is borderline at n = 10 (exponent 0),
    and meets an honestly named ELLIPTICITY WALL past n = 10 (Mestre's own
    closed form gives deg s = n/2 - 1, elliptic only for n <= 10; HEUR-1
    counting density H^(5 - n/2), H^-11 at n = 32), with the route past the
    wall (construction seeds + committed exact-square-test scan) flagged
    UNPRICED and falsifiable (P3/F6). Five numbered predictions each with
    its own falsifier; frozen test boundary with four controls (known-false
    d = 1; null-object scan; blind kernel re-derivation; degeneracy filter
    -- the last learned from run 1's instructive constant s = 4096
    instance); six falsification conditions; two numbered heuristics with
    random-model justification; novelty_status unverified (no recalled
    citation backs a novelty claim).
  prior_comparison: >
    Pointwise against the five-point prior in DEC-20260905-9e3e06. Point
    (a), THE DOMINATION OBJECTION -- OVERTURNED ON ITS PREMISE, at proposal
    tier: the prior expected that simultaneous conditions MULTIPLY the
    degrees of the polynomial identities required; the producer's arithmetic
    (run-1 verified) shows the degree premise FALSE in this formulation --
    s stays quartic, delta has degree <= n-1, every added condition is
    degree 2 at any n; only the COUNT of conditions grows (n-5, linearly).
    And the per-class baseline is shown to produce a DIFFERENT OBJECT: 4-5
    distinct curves with one populated class each, whose per-curve k = 3
    totals need descents measured-blocked at constructed-curve scale
    (31/31 ellrank timeouts, obstruction O-07 of the committed record), so
    its cost on the target axis is effectively infinite, not lower; joint
    forcing costs ~10^8-10^10 exact operations against ~50 ms for an object
    the k = 3 total cannot use. This is exactly the informative direction a
    pre-recorded prior exists to capture: the Coordinator's expected
    breakage point was the wrong one. The overturning is a PROPOSAL-TIER
    argument -- its correctness is a prediction of the record, to be tested
    at the design/experiment gates, not an established fact. Point (b),
    PARAMETER COUNT -- CONFIRMED as engaged, and my degrees-of-freedom
    concern materialized not as the collapse I guessed but as a NAMED WALL:
    explicit count with the ellipticity wall past n = 10 and the density
    decay H^(5 - n/2) recorded honestly, wall-crossing route flagged
    unpriced. Point (c), PARETO HONESTY -- CONFIRMED: dominated_by null set
    only after an 8-row x time/memory/data/queries/certificate-kind table
    (notes.md section 3; rows: committed k = 3 fixture total 20; per-class
    Mestre baseline; Mestre-13 over Q; degree-32 exact; degree-64 exact;
    twist-search ceiling; 01cbc5 ladder; external degree-1 witness); no row
    weakly better on all axes; the honest converse (row 1 dominates the
    first-experiment target on axis A alone) recorded IN the record, not
    hidden; sota_delta quantitative across axes A-D (axis B: descent-free
    k = 3 total 0 -> >= 8, delta +8, a new axis value; axis C: classes by
    construction 1 -> 4, +3). Point (d), BY CONSTRUCTION NOT BY DESCENT --
    CONFIRMED: points are evaluations of the forcing identity; r_low is
    never computed (the min(r_low, #pts) convention bypassed); the only
    search is the Diophantine system and an exact-square-test scan --
    categorically not descents, with the honest note that HEUR-1 failure
    would grow the cost objection without inheriting the descent obstacle.
    Point (e), FATIGUE-REPORT GUARD -- CONFIRMED: the record is not a
    restatement of the red-team paragraph; it carries mechanism, numbered
    predictions with falsifiers, a frozen boundary with controls, six
    falsification conditions, and numbered heuristics with random-model
    justification.
