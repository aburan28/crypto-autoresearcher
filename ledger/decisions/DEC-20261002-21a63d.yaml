      reasons:
        - >-
          (1) The rule that governs is already written, and it anticipated
          this case by name. DEC-20261002-f61a75 R-ORDER is the later of the
          two orders and was written with DEC-20260929-585602 in view as an
          in-flight composer. Its clause (4) says that if that composer gives
          the slot its lane frees "to anything but U-HOLDH (for example its
          own lane's next revision), it records the new reason and the cost of
          deferring U-HOLDH a second time, and the next selection point
          reconciles; absent that record, U-HOLDH takes the slot".
          DEC-20260929-585602 recorded a reason (SPC-2) but no cost of
          deferring U-HOLDH, because its composer did not read
          DEC-20261002-f61a75 or DEC-20260929-7257b2 (its PD-C2). Its own SPC-2
          revisit asks the next selection point to reconcile "in the R-ORDER
          manner". The default of R-ORDER (4) therefore applies unless this
          pass finds a reason on the merits to override it. It does not, as
          (2) to (4) state.
        - >-
          (2) SPC-2's reasons, read one by one, are not new against U-HOLDH.
          (a) "K-revise-defect names a revision design card in a new batch as
          the first next action" is exactly the case R-ORDER (4) gives as its
          example ("its own lane's next revision"). (b) "Lane B is rank 2 of
          the official ranking and holds the only exponent-relevant lead
          branch of this round" ranks lane B inside its own review round. On
          the target profile U-HOLDH is the one ranked candidate whose
          mechanism is exponent-shaped on deployed (legacy ANSI) rows
          (DEC-20260929-7257b2 rank 3; IDEA-20260922-d11575 target_complexity
          states the exponent on l in the c = 4k lane as the known
          composite-degree phenomenon, with memory charged). S2's lead branch
          is a ceiling read on toy cells by an instrument that has not yet
          passed review (DEC-20260929-585602 RV-9 deletes a pre-written
          "exponent-relevant only in the counterfactual sense" sentence). The
          exponent bias therefore does not favour lane B over U-HOLDH. (c)
          "Every remedy is enumerated and zero-compute" makes waiting cheap,
          not urgent: RV-1 to RV-15 are committed by TASK-20260929-afdc95 and
          do not decay. (d) "The NISTBIN item is already open" removes a
          competitor, not U-HOLDH.
        - >-
          (3) U-HOLDH has been passed over twice since it cleared:
          DEC-20260929-7257b2 R-SLOT-CLOSE gave slot 2 to the NISTBIN
          revision, and DEC-20261002-f61a75 R-SLOT-1 gave slot 1 to the S1
          version-4 revision, with a deprioritization record whose revisit
          reads "that slot goes to U-HOLDH (R-ORDER). U-HOLDH may not be
          deferred again without a new reason recorded with its cost". A
          third pass-over on a ground R-ORDER already anticipated would
          breach the ranking bar ("no ranked item deferred again without a
          new reason") and the good-faith rule (CLAUDE.md rule 9).
        - >-
          (4) Precedent points the same way. DEC-20260929-1eded2 R-ORDER
          (lane A before lane B under contention) is the manner SPC-2 itself
          names; lane A's version-4 revision took slot 1 by an order fixed
          before its outcome, and lane B's revision now takes a place in the
          order by the same mechanism rather than by its own composer's
          assignment of its own slot.
        - >-
          (5) This ruling does NOT rest on any view of S2's merit or of the
          quality of DEC-20260929-585602. That decision's approval ruling
          (EXP-BINSTD-c9c8a2 not approved; RV-1 to RV-15) is untouched and is
          the content the lane-B version-4 designer will discharge. Only its
          scheduling clause SPC-2 is reconciled.
      deprioritization_record:
        item: >-
          LANE-B-V4, the zero-run lane-B (S2) version-4 revision design batch
          of DEC-20260929-585602 NA-1 (IDEA-20260926-136bd3 with
          IDEA-20260926-d06324 under RQ-BINSTD-b6f698; superseding
          H-BINSTD-17cf9d and EXP-BINSTD-c9c8a2; RV-1 to RV-15; C1 to C8;
          TW-02 at review-breakthrough at max)
        evidence: >-
          DEC-20260929-585602 (decision revise under K-revise-defect; J2, J3
          and J4 break; TB-4 fired; RV-1 to RV-15; NA-1; SPC-2; PD-C2), bound
          by TASK-20260929-afdc95; DEC-20261002-f61a75 R-ORDER and R-SLOT-1;
          DEC-20260929-7257b2 rank 3.
        budget: >-
          None spent on version 4. The version-3 round spent three max-tier
          review sessions and one composer session (DEC-20260929-585602
          rule_9_records). Version 4 is a zero-run design batch at
          review-breakthrough at max; advisory estimates only
          (docs/research-budget-policy.md).
        test_boundary: >-
          A zero-run contract review of toy-cell instruments. Nothing about
          any curve, filter or k-list cost; no declared arm has been measured.
        remaining_uncertainty: >-
          Whether a version 4 discharges RV-1 to RV-15 (in particular RV-1,
