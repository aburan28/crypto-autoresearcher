  rulings:
    - id: R-SLOT-3
      subject: >-
        The slot BATCH-35bdda's closure frees, claimed by DEC-20261002-f61a75
        R-ORDER (U-HOLDH) and by DEC-20260929-585602 NA-1 and SPC-2 (the
        lane-B version-4 revision design batch)
      ruling: >-
        SLOT 3 GOES TO U-HOLDH, opened here as BATCH-2e63c3.
        DEC-20260929-585602 SPC-2 is reconciled and not applied. The lane-B
        version-4 revision is not opened at this pass; it is placed in the
        standing order after QSP-SUCC (R-ORDER-2), with the rule-9 record
