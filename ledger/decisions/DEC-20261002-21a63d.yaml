          resolving floor), and what any declared arm reads.
        cost_of_waiting: >-
          Two goal-slot releases: the next freed slot goes to QSP-SUCC
          (R-ORDER-2 (2)), the one after to LANE-B-V4. The lanes that can
          release are BATCH-f6b7c5 (slot 1; composer DEC-20261002-a75609),
          BATCH-f435ab (slot 2; composer DEC-20261002-353743) and BATCH-2e63c3
          (slot 3; composer DEC-20261002-c9ec6b). The first two are in their
          review rounds. No time estimate is stated; none exists that would
