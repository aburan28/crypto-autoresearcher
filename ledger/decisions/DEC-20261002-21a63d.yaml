    - id: R-PRODUCER-COMPUTE
      subject: computations the session may run for a producer with no shell (stated in advance)
      ruling: >-
        Stated on the producer card as allowed_session_computations C-1 to
        C-8 and limited to them: C-1 extract each committed code block by the
        pinned method and compute its sha256; C-2 syntax and import-safety
        check of each block in a fresh interpreter; C-3 run stage0_code
        through its __main__ entry (parameter parse, the census of period, m,
        g and Theorem-1 condition on all fifty (row, divisor) cells of the
        five deployed rows, the declared fixtures and controls on published
        or synthetic non-cell curves, the MMT Table 3 diff, matched rho) and
        relay its output verbatim; C-4 run the committed cost-table generator
        (design figures, parametrised by the H-DL-2 constant range) and relay
        its output; C-5 run the committed null false-fire calibration of
        every stopping, invalidation and admission rule on synthetic inputs;
        C-6 run the committed end-to-end dry call of the decision code over
        the full declared (cell, arm, lane) name grid with planted synthetic
        inputs; C-7 admissibility arithmetic of each declared toy cell
        (orders over the subfield and the extension by the Weil recursion,
        factorisation, gcd(l', h)) and nothing else on a declared toy cell;
        C-8 run openssl ecparam for the five deployed rows and the declared
        prime-degree control rows and relay the output verbatim. Synthetic
        groups and dry-call curves must not coincide with the group of any
        declared cell at any field size. Each command and output is embedded
        in the audit sheet as a design figure, never a result. Nothing else
        is run: no toy curve the contract declares is constructed beyond
        C-7, no point of order l' is built, no trace sum, cover, divisor
        sample or relation is computed on a declared cell, no driver is
        written or executed, and nothing imports anything under
        experiments/*/runs/.
      why_the_deployed_census_is_allowed: >-
        The census of the five deployed rows is the baseline-reproduction
        fixture DC-H2 requires (KN-TECH-080 audit 1): its values are published
        in MMT Table 3 and transcribed in the committed reading note, and it
        is arithmetic on published coefficients inside F_(2^16). It is a
        design figure of the same kind as S1's Stage 0 column. The experiment's
        measured quantities live on toy cells, and those are what TH-3
        protects.

    - id: R-INDEPENDENCE
      subject: who runs what
      ruling: >-
        Producer: a fresh Coordinator-role /design-experiment session that
        did not author DEC-20260924-99ce20, DEC-20260929-7257b2,
        DEC-20260928-63addc, this decision or the plan, did not run
        TASK-20260929-0be49c, TASK-20260929-0e2d93 or TASK-20260929-5e14da,
        and is not a producer, reviewer or composer of any other lane in
        flight. Reviewers: independent sessions that did not author the
        contract or the reading note, are not each other's session, and are
        not reviewers of BATCH-f6b7c5 or BATCH-f435ab. Blind re-deriver: as
        the reviewers, and has read none of the plan's blind_from paths.
        Composer: a fresh Coordinator session that did not run the producer,
        did not author this decision or the plan, and is not a reviewer. One
        model family serves every role by runtime inheritance; session
        independence is real, model independence is not claimed.

    - id: R-PRIOR-READS
      subject: what each party reads of earlier work
      ruling: >-
        The producer, the validator, both red teams and the composer read the
        committed reading note of TASK-20260929-0be49c (its Table 3
        transcription is the baseline fixture) and the two proposals. The
        blind re-deriver reads none of them. No card reads a BATCH-f6b7c5 or
        BATCH-f435ab review or composition path. The BATCH-35bdda review
        reports are committed and readable, but no card of this batch needs
        them and none is listed.

    - id: R-LESSONS
      subject: procedure lessons carried into the cards and the plan (opening brief section 6; DEC-20260929-585602 RV-1 to RV-6, RV-15 and prior_versus_outcome)
      ruling: >-
        (1) Concurrent and serial reviewers: every reviewer launch prompt is
        stored verbatim in the plan (launch_prompts) now, before any producer
        or reviewer runs; the session uses it unchanged and never
        paraphrases a returned report, or plan text as modified by a returned
        report, into a later prompt (RV-15). (2) Producer computations: a dry
        call or design computation on any group that coincides with a
        declared cell's group, at any field size, fires TH-3; C-7 is the only
        computation permitted on a declared toy cell (RV-6). (3) Producer
        YAML: prose containing ": " is written in folded block scalars; the
        session parses every returned file before the snapshot and reports,
        never repairs, a parse failure. (4) Scratch discipline: no session
        exports or copies a whole git tree into scratch; reviewers check out
        only the declared paths they need, at the snapshot commit. (5)
        Pre-gate digests: the snapshot records each producer file's
        whole-file sha256 as its first act. (6) Stopping and invalidation
        rules: the producer computes each rule's false-fire rate under the
        contract's own null in committed code (C-5), and the J3 owner
        recomputes it before reading the producer's table. (7) Declared arms
        and cells are identified by role in code, never by a parameter that
        varies with the cell, and an end-to-end dry call (C-6) shows each
        reaches its declared outcomes. (8) A degeneracy audit of every
        declared (cell, arm, lane) by a stated rule from parameter arithmetic.
        (9) Git refs are read from origin/<branch>, never FETCH_HEAD.

    - id: R-SCRATCH
      subject: private scratch subdirectories
      ruling: >-
        The session creates <session scratchpad>/BATCH-2e63c3/<TASK id>/ for
        TASK-20261002-9f9ce5 (its own computations C-1 to C-8 for the
        producer), TASK-20261002-b8360c, TASK-20261002-2214e9,
        TASK-20261002-17bf2f and TASK-20261002-8d288b before each launch and
        names the path in the launch prompt. No reviewer lists the scratchpad
        root or a sibling. Scratch is not an artifact and is not archived.

    - id: R-CONTINUATION
      subject: killed sessions (DEC-20260925-89573b R-CONTINUATION, carried)
      ruling: >-
        Carried unchanged. Every producer, reviewer and composer writes a
        complete skeleton first and fills it section by section; a killed
        session is continued on the SAME card by a fresh session of the same
        role, tier and policy that meets the card's independence conditions,
        works only from the card's own partial files and declared inputs,
        redoes any incomplete joint from scratch, and discloses the
        continuation. Twice killed without progress: the session stops the
        card and a later Coordinator decision splits it. A kill or an HTTP
        429 interruption is infrastructure, never evidence.

    - id: R-SLOT
