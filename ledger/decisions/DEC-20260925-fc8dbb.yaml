      block 8's own touched_by_admitdev_difference is limited to the reading
      pointer already covered by the ADR-1 reading above).
    DEV-5: 'ACCEPTED (the AD-4/vendor word never written in the review, manually confirmed by re-read; TASK-20260925-82235d dispatcher_observations independently confirms exactly 1 hit per review file, consistent with the inference block''s one permitted occurrence, CGA-6).'

