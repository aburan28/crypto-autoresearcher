      RDL-1 is declared, verbatim, in the r5 stage card and in the R2-r5 run
      card (both written by this act). AD-1 (d2) is never implemented,
      referenced as a live check, or treated as met by any r5 or r5-a1
      artifact.
    AKA-2_eighteen_hashes: >-
      Every r5 and r5-a1 plan's `repair` block names EIGHTEEN amendment
      hashes (the seventeen of DEC-20260924-daf670 bound_hashes plus
      admitdev's own addendum_sha256
      a286d7456499f107180241a745aa3b753a5ec2d09f44d32dfa36db0dbe6deb38), with
      RB-1..RJ-8, AD-1..AD-5 (with (d2) marked DELETED, RDL-1 residual),
