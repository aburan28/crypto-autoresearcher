  rationale:
    - >-
      THE PRE-DECLARED ALTERNATIVE DID EXACTLY WHAT IT WAS FOR. The draft
      named, before any review ran, the one predicate whose unsatisfiability
      would not sink the whole draft, and what to do about it. The review
      found precisely that predicate broken, by independent re-derivation
      against the raw preserved bundle, not by reading the draft's own
      prediction. Applying the alternative now is not inventing a reading
      after an outcome; it is exercising a fixed-in-advance branch on a
      finding the review reached blind to this decision.
    - >-
      THE REFUSAL HALF IS KEPT, RESTORING WHAT RB-5 (d) WAS FOR. AD-1 (d1)
      exercises RB-4's refusal on the checker verdict, on a real development
      package, with a working discriminant, independently confirmed against
      the raw bundle record. That is the one thing the r4 stage's stop showed
      the delivered code CAN do; deleting only the admitting half does not
      remove it.
    - >-
      NOTHING PRODUCTION CHANGES. Every reading applied here (ADR-1's two
      reading-dependent items included) removes no check; RB-4 and RL-4
      themselves are unchanged; the admitting branch's real exercise is
      simply deferred to where it was always going to happen anyway -- the
      r5 gate -- with the fail-closed / impediment rule already in force for
      any wrongful refusal there.
    - >-
      THE BIAS IS TOWARD THE DECIDABLE QUESTION. Criterion C1's measured side
      needs the v2 ladder and the 31-bit rung. Approving on the archived
      review, rather than waiting for a fourth draft, is the route that does
      not add another zero-run cycle for a predicate the draft itself already
      answered in advance (AGENTS.md "Research-direction integrity").
    - >-
      NO SECURITY READING. Toy EcGFp5-shaped arithmetic with known scalars;
      nothing transfers to p = 2^64 - 2^32 + 1, 262151, 16777291 or
      1073741831 cells not yet run.

