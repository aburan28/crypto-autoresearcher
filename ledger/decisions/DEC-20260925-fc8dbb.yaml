    ADR-1_satisfiability:
      order: 3
      verdict: >-
        BREAKS ON EXACTLY ONE PREDICATE, AD-1 (d2) (i); THE DRAFT'S OWN
        PRE-DECLARED ALTERNATIVE APPLIES TO THAT ONE PREDICATE.
      ruling: >-
        Per ADR-1's own text: "A predicate named unsatisfiable makes the draft
        NOT APPROVABLE AS WRITTEN, except (d2), for which the pre-declared
        alternative of AD-1 applies." The review's AJ1_satisfiability_sweep
        names exactly one break: AD1_d2_i_admitting_branch, in
        unsatisfiable_predicates, with the conjunction of texts quoted (RB-4 +
        RG-3 (d), incorporated UNCHANGED by admitdev's own `changes.unchanged`
        + the zero-run constraint CRA-1/R4S-12 + AD-1 (d2) (i)'s own words),
        and its own remedy_named_by_the_draft_itself field quoting the SAME
        pre-declared-alternative paragraph this decision applies. No OTHER
        predicate is named unsatisfiable: the sweep's predicate_table covers
        eight blocks (DV-1..DV-17 as a block; DV-18 (a)/(b)/(e) with RF-4/RB-5
        (c)/RL-6 (c')/(e); AD-1 (d1) the refusal branch; AD-1 (d2) the
        admitting branch -- the one break; the RH-5 (d) order rule; the toy-G2
        SSF D-5 predicate; the RK-4 (e) (i) (1)-(18),(23) items; the remaining
        extended DV-18 items as a group), and every one of the other seven
        either HOLDS with a feasibility witness or is READING-DEPENDENT.
        THIS ACT RECORDS, per ADR-1's own bar test ("a reading-dependent
        predicate is not a bar if the approving act records, before any r5
        stage runs, a reading that removes no check"), the following two
        readings, BOTH ALREADY IN FORCE and REMOVING NO CHECK:
        (i) DV18abe_RG3d_development_reading: RG-3 (d)'s development reading
            of "the r4 [r5] checks pass" (already the object of a prior
            Coordinator approval, DEC-20260924-844896, carried unchanged by
            admitdev's own `changes.unchanged`) is the reading in force for
            DV-18 (a)/(b)/(e); the literal base rule it replaces is not
            applied. This removes no check: RG-3 (d) still requires the r5
            checker to fail EXACTLY the three named REG-1 items and no other;
            it narrows nothing further.
        (ii) toy_G2_SSF_expected_failure_D5: VA-4's "the checker on every toy
             package" is read, as it has been read without incident across
             the r3 AND r4 stages (two independent deliveries, both showing
             the identical persistent SSF signature at p' = 1039), as "the
             checker RUNS on every toy package", not "every toy package's own
             solve PASSES"; a toy package's own persistent, reproducible
             solver-level SSF signature is not an unexpected refusal under
             this reading and does not STOP the stage. This removes no check:
             every toy package's checker STILL runs, every recorder,
             attribution, count and detector check STILL applies to it, and
             the toy G2's own persistent-SSF status is disclosed as a
             development observation, never as a pass. This decision notes
             the review's own required_control (a future review should
             re-derive whether the FIRST occurrence across the two stages
             should have been promoted to a numbered rule) as unresolved
             but NOT a bar: it is carried forward under remaining_uncertainty
             below, not decided here, because r5S-7 does not read differently
             from r3S/r4S on this point and no check is removed by carrying
             the same practice forward a third time.
        Item (5) of the RK-4 (e) coherent-copy table (the F-4/G1 refusal
        differential), which AD-1 (d2)'s own text names as its suggested
        witness, is UNCHANGED and stays in scope of the r5 DV-18 (it is a
        refusal-differential test, not an admission test, per the review's
        own witness_search finding; it is not part of what is deleted).
    ADR-2_discrimination:
      order: 4
      verdict: HOLDS
      ruling: >-
        The review's AJ2_discrimination independently re-derives, from the
        texts alone, that W-IGNORE (a wrapper whose RB-4 (b) admits whenever
        RB-4 (a) holds, ignoring the checker's exit status) fails BOTH AD-1
        (d1) (ii) and AD-1 (d2) (ii) (it would wrongly ADMIT on the
        read-back-emptied copy in each, where a REFUSAL is required), and that
        W-STRICT (a wrapper that refuses every later package) fails AD-1 (d2)
        (i) AS WORDED (it can never ADMIT, which (d2) (i) requires), "a
        wrapper is judged against the STATED requirement, not against whether
        that requirement's premise can occur" -- language this decision
        adopts explicitly: DELETING (d2) under the pre-declared alternative
        does not retroactively make W-STRICT's failure of (d2) (i)
        inapplicable to the historical review record; it simply means (d2)
        (i) is no longer a live check the r5 stage runs. The discrimination
        finding stands as a property of the DRAFT AS REVIEWED, which is the
        artifact this reading evaluates. The review additionally
        cross-checked the delivered r4_run_wrapper.py's r7_gate_packages AS
        TEXT and confirmed it implements neither W-IGNORE nor W-STRICT,
        grounding the discrimination premise in real code behaviour, not only
        the amendment's prose. HOLDS, independently re-derived.
    ADR-3_neutrality:
      order: 5
      verdict: HOLDS
      ruling: >-
        The review's AJ3_neutrality finds that AD-1 (development worlds only,
        never a gate package, result or comparison basis), AD-2 (procedural
        stage conduct after a STOP), AD-3 (administrative: paths, id minting,
        hash and ceiling counts, no verdict logic), AD-4 (one inference-block
        metadata key, content unchanged, selecting no provider) and AD-5
        ((a) report-only note disclosure; (b) a restriction that can only
        REMOVE a class of unintended interference, never add one) touch no
        production predicate, verdict, admission, computed or recorded value,
        frozen byte, argv or envelope. RFR-1 (no fail-open) and RFR-2 (no
        planned-basis refusal), applied to the difference, name nothing new.
        O-1 (the r4 note's ESRCH/exec observation): the review independently
        derives, from v2_solver.py read as text and childend RGL-1's callback
        ordering guarantee, that a child which reaches the exec-bound go-byte
        wait is GUARANTEED to have already had the RG-1 callback's counter
        opened, so a planned, legitimate exec outcome cannot FAIL via the
        ESRCH/undetermined route; O-1 is NOT a planned-basis refusal. The
        RL-5 read-back load (r4_recorder.py line 475) lies within "the RL-1
        installation" as LKA-7 (b) words it: both the RL-1 capture load
        (install(), line 447) and the RL-5 read-back load (readback(), line
        475) are defined in the SAME file implementing RL-1 end to end, and
        the LKA-7 closure scan found no third load. HOLDS.
    ADR-4_reissue_consistency:
      order: 6
      verdict: HOLDS
      ruling: >-
        The review's AJ4_reissue_consistency confirms, on independent
        re-derivation: EIGHTEEN amendment hashes (the seventeen verified
        byte-for-byte in CRA-2b plus admitdev's own sha256 verified in
        CRA-2a); 204 retired ids (124 + 38 + 42, arithmetic PASS, the
        42-entry minted-run-ids.txt independently confirmed 42/42 distinct by
        `sort -u`); 6 existing packages (all six directories confirmed to
        exist by listing); 48 over TWELVE plans (6 + 42 = 48 arithmetic PASS,
        "twelve" internally consistent with the lineage's own stated
        progression, RB-6 (e)'s "TEN plans" for r4 plus two for r5); TEN
        forbidden task ids (cross-checked against the card's own CRA-8 list,
        count and membership consistent with AD-3 (d)'s stated extension of
        an eight-id base by two). ONE DISCLOSED SCOPE LIMIT: the 204-id
        duplicate-freedom check is count-verified (124+38+42=204,
        arithmetic PASS) but NOT independently re-derived by extracting and
        pairwise-comparing the full id lists from the two decision files that
        state them (both are 1000+-line files without the lists as a single
        grep-able block). THIS ACT RULES THE LIMIT ACCEPTABLE, for three
        independent, convergent reasons, none of which alone would suffice:
        (1) the id-MINTING process itself (`tools/allocate_id.py --next run
        --area GFPN` with `--check`) draws WITHOUT scanning state and is
        --checked against every prior set before any file names an id (the r4
        stage's own note records 42/42 checks with 0 occurrences against ALL
        prior sets at 04:01-04:02Z, the exact mechanism the r5 stage will
        re-run for its own 42 ids); (2) DV-6's own exhaustive sweep refuses
        every one of 217 ids (162 retired + 42 frozen + 42 r3 + v1 ids at the
        time of the r4 stage; 204 retired for r5) with an id-class reason,
        which is a SECOND, independent mechanical check of the same
        no-duplicate property, run by the stage itself rather than assumed by
        this act; (3) the CONSEQUENCE of an undetected duplicate is bounded
        and self-revealing: `allocate_id.py --check` and the wrapper's own R-2
        refusal would themselves refuse a re-used id at MINT TIME or at
        WRAPPER-DRY-RUN TIME, before any r5 file names it, so a residual
        duplicate in the 204-id historical list (never itself reused, only
        ever checked-against) cannot silently enter a NEW record; the risk
        this scope limit leaves open is a FALSE REFUSAL (a spurious
        "duplicate" block on a genuinely fresh id, caught immediately and
        loudly by the mint step) rather than a silent collision. HOLDS on
        every count; the disclosed limit is ACCEPTED, not waived: it remains
        recorded as-is, under remaining_uncertainty, for a future review with
        more budget (the review's own required_controls second item).

  # --------------------------------------------------------------------------
  # THE PRE-DECLARED ALTERNATIVE
  # --------------------------------------------------------------------------
