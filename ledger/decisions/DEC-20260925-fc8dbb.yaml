    what_is_deleted: "AD-1 (d2), the admitting branch, in its entirety (both (d2)(i) and (d2)(ii)). AD-1 (d1), the refusal branch, is NEVER deleted and is approved as written."
    RDL-1_exact_wording: >-
      "RB-4's and RL-4's admitting branch on a real gate set is first
      exercised at the r5 gate; a wrongful refusal there is fail-closed, an
      impediment for a Coordinator decision, never evidence."
    where_declared: >-
      Here, and verbatim in the r5 stage card (TASK-20260925-a16f78,
      RDL-1_residual field) and in the R2-r5 run card (TASK-20260925-480d02,
      R5P-2 and completion_gate), which is where RDL-1 is first exercised in
      practice.
    what_this_is_not: >-
      Not a finding that RB-4's admitting branch is defective, wrong, or will
      refuse wrongly. Not a change to RB-4, RL-4 or any production predicate,
      which are explicitly UNCHANGED (admitdev `changes.unchanged`). Not
      evidence about D, the quotient, H-GFPN-9a29be or HEUR-GFPN-DFLAT.

