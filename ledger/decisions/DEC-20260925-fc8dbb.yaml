    DEV-1: 'ACCEPTED, methodological note only (the -mindepth 1 find trap); the underlying fact (54 run directories) is confirmed and unaffected.'
    DEV-2: 'ACCEPTED (DEC-20260924-e52eec read at 1-815 plus bound_hashes only; the unread remainder is not the normative content CRA-9 required and no verdict here depends on it).'
    DEV-3: 'ACCEPTED under ADR-4 above (the duplicate-freedom scope limit), for the three convergent reasons stated there.'
    DEV-4: >-
      ACCEPTED, disclosed as the weakest evidentiary tier the review used
      (32+ sub-items reported as a feasibility-witness group rather than
      independently re-derived); the review's own required_controls names
      this as a candidate for a future review with more budget. Not a bar:
