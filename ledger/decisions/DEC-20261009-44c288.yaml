      reading: 'The Teichmuller section is homomorphic and log_p-vanishing on every pair, and the random-digit Hensel
        section''s ratio equals d at the 1/p rate (|z| < 1) on both seeds. The NAIVE integer section FAILS the frozen
        criterion on both seeds (z = 7.65 and 9.14): its ratio equals d on 0.81 and 1.25 percent of pairs against
        a 1/p reference of 0.13 and 0.21 percent.'
      unexpected_observation: 'Of the 33 naive-section successes on 3200 pairs, 24 are exactly the pairs with g^d
        < p (every such pair succeeds), and the remaining 9 sit at the random rate (about 5 expected): the integer
        representative of g^d mod p is the integer g^d itself when no reduction occurs, and the Fermat-quotient
        functional is additive on integers, so the ratio is exactly d there. This is the integer section being multiplicative
        below p, not a p-adic effect; it has no elliptic analogue because point addition always reduces. The hypothesis
        clause on the naive section is falsified as posed; a successor should exclude the sub-p range or state the
        naive section''s partial multiplicativity.'
      claim_boundary: 40 primes below 2000, precision 4; primitive roots are small, so the sub-p range is about
        log_g(p) values of d.
