coordinator_decision:
  id: DEC-20260921-e21d6a
  context: >-
    User request (direct chat, confirmed through two rounds of
    AskUserQuestion after the Coordinator disclosed the exact tradeoffs) to
    collect genuinely new trials on EXP-ECDLP-e36df2 / H-ECDLP-09125b
    beyond its already-decided scope: new curves/primes extending the
    tested set beyond the original six curves, explicitly accepting that
    this overrides specification.yaml v1's frozen budget.maximum_runs=25
    (already at 28 committed runs) and requires a formal protocol
    amendment. H-ECDLP-09125b is fully decided (DEC-20260912-2a626b:
    support, strong) and that decision is not reopened by anything in this
    record. This decision approves the protocol amendment, authors the new
    sibling hypothesis it requires, and dispatches the execution task; no
    new evidence has been reviewed at this step.
  decision: approve
  target_ids:
    - EXP-ECDLP-e36df2
    - H-ECDLP-c48f2a
    - TASK-20260921-9b17e4
  rationale:
    - >-
      A. Amendment vs. reopening the closed hypothesis: H-ECDLP-09125b's
      success_criterion/falsification_criterion (joint alpha=0.01,
      effect>=3 Poisson bar) was pre-registered against a FIXED 24-instance
      set (later extended only by a pre-planned mu0_target=40 sensitivity
      check on an already-included curve, never by adding new curves) and
      is already fully adjudicated. Pooling a new curve's data into that
      closed statistic now would be undisclosed post-hoc dredging on an
      already-decided test, regardless of the new data's outcome. The
      honest construction is therefore a NEW sibling hypothesis
      (H-ECDLP-c48f2a), derived from the same instrument/idea
      (IDEA-20260911-2dd68d / IDEA-20260905-dacf4f) but carrying its own,
      separately pre-registered statistic over exactly its own 4 new
      instances, scoped `confirmatory_status: exploratory_only` in the
      amendment record. H-ECDLP-09125b's own status/status_note is left
      completely UNTOUCHED (not even an additive annotation): it is a
      fully decided, independently re-verified, immutable ledger record,
      and AGENTS.md rule 2 treats ledger records as immutable outright;
      the new hypothesis and amendment cite it (`derived_from_hypothesis`,
      `refs`), which is sufficient for any later reader to discover this
      extension by searching citations of H-ECDLP-09125b, without risking
      an edit to a record whose exact byte content was already
      independently blind-rederived and matched during its own review.
    - >-
      B. Curve count and selection: exactly ONE new curve, per the user's
      own precedented suggestion (this experiment's own prior addition of
      one engineered positive-control curve) and because a single,
      well-justified addition is the minimal design that answers the
      user's request without manufacturing an arbitrary large batch with
      no stated rationale. Selected via the IDENTICAL seeded search
      procedure and criteria as the original six curves (curves.py-style
      `_candidate_curves`/`_find_primes_for_curve`), under a NEW seed
      (20260921 -- today's date, distinct from the two already used,
      20260905 and 20260911) so it is not a duplicate selection, with an
      explicit avoid-set of all six existing curves' (A,B,x0,y0) keys as a
      belt-and-suspenders check. Unlike the engineered positive control,
      this new curve is NOT hand-picked for any coincidence -- it is a
      genuinely searched instance, per the user's explicit framing
      ("new curves/primes... extending the tested set").
    - >-
      C. Budget: maximum_runs raised from 25 to 32 (28 already-committed
      runs, unaffected, plus exactly 4 new runs -- one per reduction prime
      of the single new curve, matching this experiment's own established
      4-primes-per-curve pattern). total_cpu_hours raised from 6 to 12,
      conservatively estimated from orchestrate_manifest_summary.json's
      actually-measured 31226.33s (~8.68 hours) across the 28 existing
      runs -- which the v1 driver processed as 7 curve-level jobs (all 4
      primes of a curve share one m-ladder), the six main curves costing
      319s-7781s each -- plus ~10800s (3 hours) for one more curve-level
      job of the same design at the observed per-curve maximum scaled to
      the top of the prime range, rounded up.
      Both figures are itemized from measured per-curve cost, not arbitrary
      round numbers, per specification.yaml's own `enforcement: advisory`
      and CLAUDE.md's "Research budgets: progress first". GOAL-ECDLP-001
      is a declared ECC area (orchestration/research-priority.yaml,
      confirmed via tools/ecc_priority.py's declared set, not inferred
      from the identifier prefix), whose own campaign-level
      maximum_batches/total_wall_clock_seconds are already unbounded under
      that policy; this experiment-level budget bump is a genuine cost
      estimate for calibration and is not itself subject to, or a
      circumvention of, the ECC-unlimited rule (which binds GOAL-level
      fields, not this experiment's own advisory figures).
    - >-
      D. H-ECDLP-09125b's own record: left untouched, per A above. This is
      the more conservative of the two options offered (additive
      annotation vs. leaving it untouched) because H-ECDLP-09125b's
      status_note is itself an artifact of an independent blind
      rederivation already performed and matched exactly; adding even an
      additive pointer risks inviting a future editor to treat the record
      as "still open for annotation" rather than closed. The new
      hypothesis and amendment record both cite H-ECDLP-09125b explicitly
      (`derived_from_hypothesis`, `refs`), which is the discovery path a
      reviewer needs and does not require touching the immutable record.
    - >-
      E. Honesty of the `reason` field: the protocol_amendment's `reason`
      states plainly that this extension is driven by an explicit,
      twice-confirmed user request for supplementary data collection, NOT
      by any scientific concern, defect, or confound found in the closed
      v1 evidence. No post-hoc scientific rationale is invented; this
      matches the user's own explicit instruction to state the reason
      honestly.
    - >-
      F. Scope discipline: this decision approves a prospective protocol
      amendment and dispatches a new execution task; it reviews no
      evidence and changes no hypothesis's decided status. It does not
      constitute or foreshadow a verdict on H-ECDLP-c48f2a, which remains
      `status: proposed` pending the executor's runs and a subsequent,
      separate evidence-review decision.
  evidence_refs: []
  limitations:
    - >-
      This decision authorizes data collection; it makes no claim about
      what that data will show. H-ECDLP-c48f2a's own record states
      explicitly that a single, unreplicated 4-instance run set cannot
      itself support a program-level conclusion beyond "consistent with,
      or an open confound against, chance at this one additional curve".
    - >-
      predecessor_sha256 for specification.yaml (byte-identity check) was
      not computed by this authoring session, which has no shell/hash
      tool; the committing session must verify
      `git diff -- experiments/EXP-ECDLP-e36df2/specification.yaml` is
      empty before treating this amendment as durable, and may append the
      computed hash to the amendment record additively.
    - >-
      Identifier freedom for H-ECDLP-c48f2a, TASK-20260921-9b17e4, and this
      decision's own id was checked by this authoring session via
      Glob/Grep path-component search across the repository (no path
      anywhere already carries any of these three tokens), NOT by
      executing `tools/allocate_id.py` directly (this authoring session
      has no Bash/execute tool). The committing session should run
      `python3 tools/allocate_id.py --check <id>` for all three before or
      immediately after the commit to obtain the tool's own formal
      confirmation.
    - >-
      GOAL-ECDLP-001's own goal-record checkpoint (next_action, batch
      pointer) is NOT updated by this decision; this dispatch does not
      complete a batch or review evidence, so no goal checkpoint is due
      yet. The next goal checkpoint should occur after
      TASK-20260921-9b17e4's results are reviewed.
  next_actions:
    - >-
      Executor runs TASK-20260921-9b17e4 (select the new curve, freeze its
      4 primes, run RUN-ECDLP-e36df2-029..032, produce
      pooled-summary-new-curve-c6.json and design_note_v2_addendum.md).
    - >-
      Coordinator performs an isolated snapshot archive of the new
      artifacts once the executor completes, before any independent
      review, per this program's snapshot-then-review-then-ledger-archive
      discipline.
    - >-
      Coordinator dispatches independent validator/red-team review of
      H-ECDLP-c48f2a's own new 4-instance evidence (a fresh, separate
      review round from the one that already closed H-ECDLP-09125b).
    - >-
      Coordinator records a new evidence record (EV-ECDLP-*) and a
      separate coordinator_decision for H-ECDLP-c48f2a's own verdict,
      filling knowledge_promotion per the usual gate (a `support` or
      `reject_scoped`-strength outcome on `replicated`/`strong` evidence
      promotes a KN-FIND; a single unreplicated run set reaching a
      falsified-looking reading is decided `weaken` plus a replication
      recommendation, per AGENTS.md, never `reject_scoped` outright).
    - >-
      This decision's own committing session must run
      `python3 tools/validate_ledger.py` and
      `python3 tools/check_merge_hygiene.py --base origin/main`, verify
      `tools/allocate_id.py --check` on the three newly minted ids, fill
      in the specification.yaml sha256 noted in `limitations` above, and
      commit on the current branch before any of the above next actions
      proceed.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is a prospective dispatch decision (protocol amendment approval
      plus task handoff), not an evidence-review decision: no evidence has
      been collected or reviewed against H-ECDLP-c48f2a yet, so no finding
      is promotable at this step. Knowledge promotion will be revisited in
      the future coordinator_decision that reviews TASK-20260921-9b17e4's
      resulting evidence.
  decided_by: coordinator
  decided_at: '2026-09-21'
