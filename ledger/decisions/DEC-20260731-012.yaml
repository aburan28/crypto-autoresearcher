coordinator_decision:
  id: DEC-20260731-012
  # DEC-20260731-004 is RESERVED for the TASK-20260731-706 ledger archive and is
  # deliberately not consumed here. This record is the PLANNING decision that
  # opens BATCH-002; DEC-20260731-004 will be the EVIDENCE-REVIEW decision that
  # closes it.
  context: >-
    Opening GOAL-AES-001 BATCH-002 on the committed DEC-20260731-011 checkpoint
    (producer snapshot 0185c0ff, ledger archive eb72cac7, goal checkpoint
    7fb1a658). Six task cards TASK-20260731-701..706 and their handoffs were
    authored to implement the goal's next_action exactly and in its stated rank
    order, and were validated against the dispatcher's structural rules — first
    by Coordinator inspection of tools/research_dispatch.py, then independently by
    the dispatching session, which reports `python3 tools/research_dispatch.py`
    exiting 0 with all 10 dispatch gates passing and ready tasks
    701/702/703. Dispatch was initially BLOCKED on a campaign-budget shortfall
    that the Coordinator declined to absorb by shrinking the work; the user ruled
    on the shortfall and amended the ceiling, and this decision records the
    resolved state. NO research state changed and NOTHING here asserts anything
    about AES.
  decision: approve
  # `approve` on the merits: this is the approval of a bounded dispatch plan under
  # a now-sufficient budget. It is NOT `revise` (the plan is unchanged from what
  # was authored — no task was cut, rescoped, or re-ranked), and it is no longer
  # `inconclusive`: the drafted inconclusive verdict recorded a live budget
  # blocker, and that blocker has been resolved by an explicit ruling rather than
  # by reinterpretation.
  target_ids:
    - GOAL-AES-001
    - RQ-AES-001
    - TASK-20260731-701
    - TASK-20260731-702
    - TASK-20260731-703
    - TASK-20260731-704
    - TASK-20260731-705
    - TASK-20260731-706

  rationale:
    - >-
      BATCH-002 IMPLEMENTS DEC-20260731-011'S NEXT ACTION EXACTLY, in its stated
      rank order and with its stated exclusions. (1) TASK-20260731-701
      (idea-generator, priority 100) carries two deliverables: a STANDALONE
      derivation note with its own verification script, archiving the two durable
      negative facts recomputed in BATCH-001, plus object-first ideation on the
      retained residual — cross-column / super-box-level objects at the 2-round
      32-bit super-box where ShiftRows sits on the outside, the only
      exponent-relevant lane BATCH-001 left open.
      (2) TASK-20260731-702 (executor, 95) repairs harness defects H-1 and H-3,
      with H-2 recorded and not repaired, in its own BATCH-002 directory,
      superseding rather than overwriting per the immutability rule.
      (3) TASK-20260731-703 (executor, 90) runs GATE-601-B ONLY, limited to its
      three self-contained yields. GATE-601-A is NOT dispatched: CAND-601-A is
      repair-before-run.
    - >-
      THE ORDERING OF THE DERIVATION NOTE IS THE STRUCTURAL POINT OF THIS BATCH,
      not a formality. DEC-20260731-011 withheld promotion of the two negative
      facts precisely because docs/claims-and-verification.md ("Refutation
      artifacts") requires the checkable artifact to be archived BEFORE the
      decision that relies on it, and those facts then lived only inside a
      validation report riding in the same commit. BATCH-002 fixes that by
      construction: the note is written in 701, committed in the 704 SNAPSHOT,
      independently reviewed in 705, and only then promoted to KN-FIND-012 in the
      706 LEDGER archive — and 706 is instructed NOT to write the KN-FIND at all
      if the validator does not return the note as fit for standalone promotion,
      recording a concrete `not_warranted` reason instead.
    - >-
      THE STRUCK CAND-601-B CLAIMS ARE FENCED AT BOTH ENDS. TASK-20260731-703 is
      forbidden to state or imply ANY comparison against literature, published
      work, best-known attacks, or a state of the art — no sota_delta, no
      bit-margin, no 8-bit extrapolation, no crossover prediction — and the
      original GATE-601-B PASS/FAIL escalation criterion is explicitly withdrawn
      because its escalation leg depends on the struck extrapolation. The only
      baseline is the one the task implements. TASK-20260731-705 is separately
      tasked to audit all three artifacts for any reappearance and report it as a
      scope violation of DEC-20260731-011.
    - >-
      THE INFERENCE-BLOCK GAP IS REPAIRED PROSPECTIVELY AT DISPATCH, as
      DEC-20260731-011 committed to. Every producer handoff and every producer
      completion gate requires a filled inference block (policy,
      requested_policy, ACTUAL resolved model, fallback_used, model_verified)
      naming inference-amendment commit 0137a051 as the standing basis, and
      TASK-20260731-704 is instructed to REFUSE TO SNAPSHOT a producer whose
      artifact lacks one, returning the task as incomplete with the defect named.
      An unobserved resolved model is recorded as `unrecorded`, never guessed
      (AGENTS.md rule 9). This closes EV-AES-001 defect D-1 forward rather than
      retroactively.
    - >-
      THE BUDGET BLOCKER WAS REAL AND WAS NOT ABSORBED. The honest cost of the
      plan is 9300 s (701: 2400, 702: 1500, 703: 2700, 704: 300, 705: 1800, 706:
      600) against 2700 s remaining under the original 10800 s ceiling — a
      shortfall of 6600 s, roughly 3.4x. Shrinking task budgets to fit that
      ceiling would have been a scope reduction disguised as planning, and the
      Coordinator declared the real numbers, marked the queue not-dispatchable,
      and referred the ceiling question upward instead. That referral was the
      decision; absorbing it silently would have been the failure.
    - >-
      THE RULING RESOLVED IT AS A CALIBRATION DEFECT, AND THE MEASURED EVIDENCE
      SUPPORTS THAT FRAMING. The dispatching session independently reproduced the
      budget arithmetic and measured BATCH-001's actual consumption at
      approximately 3231 s wall clock (601 ~682, 602 ~890, 603 ~179, 604 ~1071,
      605 ~409) against 8100 s declared — declared budgets running at roughly 2.5x
      measured time. The campaign was being exhausted by conservative ceilings,
      not by spent work: 75% of the nominal budget would have been consumed by a
      batch that spent 30% of it. The user amended
      campaign_budget.total_wall_clock_seconds from 10800 to 20000 to cover the
      full plan, with all six tasks approved as ranked and TASK-20260731-703 NOT
      cut. Recorded as protocol-amendment-GOAL-AES-001-001.
    - >-
      THE AMENDMENT WIDENS A CEILING AND NOTHING ELSE. maximum_batches (6) and
      max_concurrent (3) are UNCHANGED. Scope, claim tier (toy / reduced-round),
      completion criteria, pause conditions, authority, and the independent-review
      chain are all UNCHANGED. It was decided before any BATCH-002 task ran and
      therefore before any BATCH-002 outcome could be observed, so
      confirmatory_status is preserved and this is not the criterion-after-outcome
      change the Coordinator contract forbids.
    - >-
      NO EXEMPTION IS BOUGHT WITH THE HEADROOM. 20000 s covers BATCH-001's
      declared 8100 plus BATCH-002's declared 9300 with ~2600 s of headroom for a
      possible BATCH-003, and a FURTHER AMENDMENT IS REQUIRED BEYOND THAT.
      Reaching the ceiling without one triggers the declared pause condition; it
      does not authorize a silent overrun, and an overrun is not a research
      result. The 2.5x ratio is a reason to calibrate future DECLARATIONS toward
      measured time, not a licence to inflate them.

  evidence_refs:
    - DEC-20260731-011
    - EV-AES-001
    - ledger/goals/GOAL-AES-001.yaml
    - coordination/goals/GOAL-AES-001/amendments/protocol-amendment-GOAL-AES-001-001.yaml
    - coordination/goals/GOAL-AES-001/batches/BATCH-002/dispatch_queue.json
    - ledger/handoffs/TASK-20260731-701.yaml
    - ledger/handoffs/TASK-20260731-702.yaml
    - ledger/handoffs/TASK-20260731-703.yaml
    - ledger/handoffs/TASK-20260731-704.yaml
    - ledger/handoffs/TASK-20260731-705.yaml
    - ledger/handoffs/TASK-20260731-706.yaml
    - coordination/goals/GOAL-AES-001/batches/BATCH-001/dispatch_queue.json
    - coordination/goals/GOAL-AES-001/batches/BATCH-001/inference-amendment-TASK-20260731-602.yaml
    - "BATCH-001 producer snapshot commit 0185c0ff2d3878101d8f6cf5bdef48906ffb197b"
    - "BATCH-001 ledger archive commit eb72cac7667e60a15a311a1c0d3d2137e79d186b"
    - "BATCH-001 goal checkpoint commit 7fb1a658"
    - >-
      Dispatcher-relayed verification of the BATCH-002 queue: `python3
      tools/research_dispatch.py` exits 0, all 10 dispatch gates pass, ready tasks
      701/702/703.
    - >-
      Dispatcher-measured BATCH-001 wall clock: 601 ~682 s, 602 ~890 s, 603 ~179 s,
      604 ~1071 s, 605 ~409 s; ~3231 s total against 8100 s declared.

  dispositions:
    batch_002_queue: >-
      APPROVED as authored and as ranked. Six tasks, all `queued`, max_concurrent
      3, total declared budget 9300 s. No task cut, rescoped, or re-ranked by this
      decision.
    campaign_budget: >-
      AMENDED 10800 -> 20000 s by protocol-amendment-GOAL-AES-001-001 on the user
      ruling. maximum_batches 6 and max_concurrent 3 unchanged. A further
      amendment is required beyond 20000.
    gate_601_a: >-
      NOT DISPATCHED, unchanged from DEC-20260731-011. CAND-601-A remains
      premise-undermined and repair-before-run. No task in BATCH-002 may run,
      partially run, or compute its statistic.
    cand_601_b_struck_claims: >-
      REMAIN STRUCK. The strike is enforced at dispatch in TASK-20260731-703's
      constraints and completion gate, and audited in TASK-20260731-705.
    hypothesis_status_changes: >-
      NONE. No hypothesis record exists for GOAL-AES-001 and none is created by
      this decision.
    knowledge_promotion_pathway: >-
      KN-FIND-012 is DECLARED as a path owned by TASK-20260731-706 and is NOT
      promoted here. Promotion is conditional on the TASK-20260731-705 verdict
      that the derivation note is fit for promotion as a standalone artifact.

  promotion_gates_status:
    engaged: false
    reason: >-
      NO asymptotic-complexity claim is advanced by this decision, which approves
      a dispatch plan and amends a resource ceiling. The four promotion gates are
      NOT engaged and are not bypassed: they remain fully applicable to any
      BATCH-002 output later proposed toward `supported`, and DEC-20260731-011's
      enumeration of them stands unchanged.

  limitations:
    - >-
      THIS DECISION ASSERTS NOTHING ABOUT AES. It approves a plan and amends a
      budget. No distinguisher, no key recovery, no speedup, no measured
      structural excess, and no barrier statement about the cipher is claimed at
      any round count. No BATCH-002 task has run and no BATCH-002 artifact exists.
    - >-
      Nothing here concerns full-round AES, AES-NI-deployed AES, or the security
      of any system that uses AES. The claim-tier ceiling remains toy /
      reduced-round and is not touched by the amendment.
    - >-
      Approving a plan is not evidence that the plan will yield anything. The
      super-box lane may close; NO_ADMISSIBLE_NEXT_MECHANISM is an explicitly
      admissible and complete outcome for TASK-20260731-701's ideation
      deliverable, and the campaign's saturation prior is unchanged.
    - >-
      No artifact of this batch is durable yet. The BATCH-002 queue, the six
      handoffs, this decision, and protocol-amendment-GOAL-AES-001-001 are
      UNCOMMITTED at the time of writing. Under AGENTS.md "Durable research
      commits" nothing here is official until a Coordinator commit is accepted by
      the post-commit verifier.
    - >-
      protocol-amendment-GOAL-AES-001-001 is not yet assigned to an archival task
      (`archived_by: null`). The BATCH-002 queue declares no path for it, so it
      must ride an isolated Coordinator commit alongside the goal-record update —
      the pattern BATCH-001 used for inference-amendment-TASK-20260731-602 at
      commit 0137a051 — or the queue must be superseded to declare it. This must
      be resolved before TASK-20260731-704.
    - >-
      The BATCH-001 measured timings are wall-clock observations reported by the
      dispatching session for this harness. They are not a validated performance
      model and not an independent second measurement, and the 2.5x
      declared-to-measured ratio rests on a single five-task batch, three of whose
      tasks were short.
    - >-
      Cross-model independence remains UNAVAILABLE. Under
      inference-amendment-TASK-20260731-602.yaml every subagent resolves to the
      inherited model, so TASK-20260731-705's independence is in SESSION and not
      in MODEL. The budget amendment does not change this and supplies no basis
      for relaxing any review requirement.
    - >-
      GOAL-AES-001 is NOT completed and is not proposed for completion. Under the
      inference amendment a three-distinct-model closure quorum is unobtainable in
      this harness, so `completed` is unreachable regardless of budget or outcome.
      No completion_quorum block exists and no attestation is recorded.

  next_actions:
    - >-
      Dispatch TASK-20260731-701, TASK-20260731-702 and TASK-20260731-703
      concurrently from
      coordination/goals/GOAL-AES-001/batches/BATCH-002/dispatch_queue.json under
      max_concurrent 3, after committing the BATCH-002 queue, the six handoffs,
      protocol-amendment-GOAL-AES-001-001, this decision, and the updated
      GOAL-AES-001 record. Enforce the inference-block completion gate at
      TASK-20260731-704 rather than at validation.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT AN EVIDENCE-REVIEW DECISION. This is a planning and resource decision:
      no evidence record was reviewed, no run was interpreted, and no result
      exists to promote. The two durable negative facts that DO merit a KN-FIND
      are deferred by design to TASK-20260731-706, which owns
      knowledge/findings/KN-FIND-012.md and promotes it if and only if
      TASK-20260731-705 returns the TASK-20260731-701 derivation note as fit for
      promotion as a standalone artifact — the refutation-artifact ordering
      DEC-20260731-011 deliberately deferred to this batch. Promoting anything
      here would repeat exactly the ordering error that deferral was created to
      avoid.

  decided_by: coordinator
  decided_at: '2026-07-31'
