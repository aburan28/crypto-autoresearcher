      interpretation_limits. RD-5 (J7-BA): supersede
      H observation_collision.distinct_preimage_search so it matches spec D4
      (withdrawn separator; five collisions), or name that field in
      version_2.supersedes with the corrected text.
    - >-
      Non-breaking items the revision should answer in its worksheet: U-1
      (CD-LAMBDA uniqueness field on e1 rows), U-2 (SR-5c/SR-5b list order),
      M-J2-a/M-J2-b (E1-c fragility / sufficiency disclosure), red-team
      O-E4-5..O-E4-9 material/minor items as applicable, validator
      material_findings_non_breaking on J7.
    - >-
      What holds, carried unchanged unless a defect above forces it: the
      deployed ord_n(2) census and six primary-sourced k | r - 1 rows; the
      e1_admissibility_table and its halt reachability; D8 / SR-SRC-6..8; the
      R2 boundaries; J6 carry-forward of census/rows/fixture; PTM-A..E
      signatures as met; C1-C5 of the prior design conditions as still binding
      on the revision producer.
    - >-
      Every break is a design or instrument defect, never mathematical evidence
      (CB-11). No run exists. Nothing here supports or weakens H-BINSTD-ce4f38,
      and its status does not move. Approval would have asserted nothing about
      any deployed curve's security; refusal asserts the same.

