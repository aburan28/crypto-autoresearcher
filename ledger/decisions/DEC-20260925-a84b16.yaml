    - >-
      DEFECTS TO BE FIXED BY THE REVISION (each with joint and breaking
      artifact). RD-1 (J3-B1): repair CERT-BIND so the unmutated control passes
      G4 on the intended domain (e.g. bind the identity on G / pi_G(R), not on
