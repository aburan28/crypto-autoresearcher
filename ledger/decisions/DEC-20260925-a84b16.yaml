    - >-
      Keys applied as frozen. K-approve requires J2, J3, J4, J6 and J7 to hold,
      J5 agreement, every PTM met, ESC-B recorded with the required tier, no
      in-round tripwire, and no breaking unowned defect. J3, J4 and J7 break
