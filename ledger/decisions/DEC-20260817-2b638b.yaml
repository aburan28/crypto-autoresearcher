        that plainly rather than let it pass.
      consequence_was_tested: true
      what_the_test_returned: >-
        THE LESSON'S CONSEQUENCE IS CONFIRMED, BUT BY A DIFFERENT INSTRUMENT THAN THE ONE THE
        DEFERRAL NAMED. The parametric route -- the null-object control DEC-20260815-176614 named as
        its first option -- FAILED on two independent counts: BLIND under its own fail-closed rule,
        and structurally the wrong shape (uncoupled arms calibrating a paired estimator). The route
