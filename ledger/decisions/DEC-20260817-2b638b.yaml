  context: >-
    This is the closing ledger archive for BATCH-91929e's single executor task,
    TASK-20260817-c603c0 -- PART A, a fresh, fully disjoint 2x2 (shard x transition regime)
    local-exponent factorial on shards 5000 and 8002 at both the 25->50 and 50->100 jackknife-batch
    transitions over trial indices [30000:75000); PART B, a decoder-free null-object control on the
    2-point local-exponent diagnostic itself, four-rung ladder at R=200 plus a planted-departure
    sensitivity leg -- snapshotted by TASK-20260817-f24a5e at commit
    9ac60648ddede021a854a4777a8979af298b7ad9 and reviewed by two independent sessions:
    TASK-20260817-6f610c (Validator; verdict passed, ADMIT subject to five characterization
    corrections; validation_report.yaml, sha256 prefix 14e12278bf54b7c1, 86,136 bytes) and
    TASK-20260817-94c89e (Red Team; verdict objections_material_to_conclusions; red_team_report.md,
    sha256 prefix 60111b44a9d9401d, 84,465 bytes). Both reports are at
    coordination/goals/GOAL-HQC-001/batches/BATCH-91929e/reviews/<task>/, which is what the committed
    task cards, the committed handoffs and the committed dispatch_queue.json all declare. This
    decision applies batch.yaml's FROZEN pre-registered reading rule in its declared precedence
    order, records the evidence at EV-HQC-e458ef, resolves DEC-20260815-176614's deferred knowledge
    promotion for both held candidates by name, debits this batch's measured executor spend, and
    checkpoints GOAL-HQC-001.
  rationale:
  - >-
    (a) VALIDITY GATES FIRST, BECAUSE THEY DOMINATE THE READING RULE: ALL PASS, ON ALL ARMS, AND NO
    ARM IS AN INFRASTRUCTURE OUTCOME. Arm A's direct disjointness proof (bit-identical [0:5000)
    prefix against TASK-20260809-a79e4f stage 1's committed raw array, both variants, 10,000 elements,
    zero differing), Arm B's adapted two-step proof (exact float64 bit-identity across all eight
    statistic arrays, max relative deviation 0.0, the declared 1e-9 fallback available and never
    fired), the F[:, 0:n_e-1] structural invariant (eight of eight combinations, zero mismatches),
    D2 = D3 = 0 on all six decoder calls with none truncated, both fail-closed selftests and all
    three module sha256 pins -- every one PASSES, and the Validator re-executed every one of them
    from raw data its own driver generated rather than reading the producer's results. NEITHER
    REVIEWER JUDGED EITHER PROOF INADEQUATE: the Validator's required judgment is ADEQUATE for its
    own purpose and explicitly NOT equivalent to the direct check, which is what the producer itself
    says; the Red Team judges the asymmetry correctly scoped and if anything under-credited. Under
    batch.yaml's validity_gates_dominate_everything clause, NO ARM IS DISQUALIFIED AND NO BRANCH IS
    BLOCKED BY A VALIDITY FAILURE. Stated explicitly rather than allowed to silently downgrade the
    finding's strength (EV-HQC-e458ef O2). Two gate-level corrections are applied by superseding
    record and never by editing a frozen artifact: the F-invariant covers 4,950,000 elements, not the
    2,475,000 reported in run_manifest.yaml line 249 and repeated in this Coordinator's own snapshot
    receipt and commit message (2,475,000 is the per-shard subtotal); and the invariant is
    NON-VACUOUS, established by a check the producer omitted and the Validator added -- the last
    block genuinely differs between arms on 10.4% to 11.4% of trials in every one of the eight cells
    (O3).
  - >-
    (b) THE NULL-OBJECT CONTROL IS BLIND, ITS BAND CARRIES NO INTERPRETIVE WEIGHT, AND THIS IS THE
    FIFTH INSTANCE OF THIS CAMPAIGN'S CONTROL-BLINDNESS PATTERN -- NAMED AS SUCH, NOT SOFTENED. No
    planted magnitude drove the planted median outside the null band (medians 0.129895 / 0.059429 /
    -0.115719 against [-1.02956, 1.75888], all three IN_BAND); the producer applied its own frozen
    fail-closed rule correctly and said BLIND in that word; both reviewers confirm the arithmetic and
    the verdict. AND BOTH REVIEWERS THEN SHOWED THE LEG COULD NOT HAVE FIRED. Clearing the band needs
    rho >= 2.526; the largest pre-registered g reached 1.392, and the Red Team extended the same
    transform past its pre-registered ceiling and found rho PEAKS near 1.35 at g=2 and REVERSES --
    1.038 at g=3, 0.828 at g=4, 0.869 at g=50 -- because clipping to [0,56] around mu=17.877 drives
    the planted arm to a near-two-point law whose k=17 jackknife SE is LOWER than the base. THE BLIND
    VERDICT IS CORRECTLY DERIVED AND ITS INFORMATIONAL CONTENT IS WEAKER THAN "THE INSTRUMENT IS
    BLIND": it is a fact about the plant class's reach and the band's width, not about the
    instrument's sensitivity. The operational consequence is identical and is binding on everything
    below: THIS BATCH PRODUCED AN UNCALIBRATED DIAGNOSTIC. The campaign's own named mechanism for the
    pattern -- an invariance strong enough to force a control's null also blinds it to any defect
    sharing that invariance -- recurs here with a measurement attached for the first time: the
    boundedness that makes the null object clean is the same boundedness that caps the plant below
    the detection threshold. INDEPENDENTLY OF BLINDNESS, THE OBJECT IS THE WRONG SHAPE: its arms are
    drawn from independent RNG streams (null_object_control.py:256-257) where the real pair shares 55
    of 56 blocks on every trial, which this batch's own F-invariant gate proves; measured
    se_unpaired/se_paired is 0.9965 in the null against 2.34-28.69 in the eight real cells. Both
    reviewers built corrected coupled nulls, by DIFFERENT constructions, and both found the bands
    WIDER (+22% Red Team; +36% and +26% Validator). FIXING THE SHAPE MAKES THE DIAGNOSTIC LOOK WORSE,
    NOT BETTER. Neither reviewer-built band is used to adjudicate anything here, and both reviewers
    say they must not be.
  - >-
    (c) THE FROZEN READING RULE, APPLIED IN ITS DECLARED PRECEDENCE ORDER. RULING: BRANCH X --
    INCONCLUSIVE -- ENTERED ON ITS OWN ENUMERATED TRIGGER, WITH BRANCHES N, R AND S RECORDED AS
    INEVALUABLE RATHER THAN FALSE. Taking them in the frozen order. BRANCH N IS EVALUATED FIRST AND
    DOMINATES, AND IT CANNOT BE ESTABLISHED. Its clause 1 ("the null object's replicate distribution
    of alpha at the relevant rung-pair contains the historical exponents") is answerable and comes
    back SPLIT: against the producer's own bands, 6000-P (+1.402), 8001-N (-0.268) and 8002-N
    (-0.866) are inside, and 5000-P (+2.836) is OUTSIDE, so the clause is not satisfied wholesale.
    Its clause 2 ("both the regime and shard main effects fall inside the corresponding null band")
    is INEVALUABLE for three separate reasons, each found independently: Part B banded a SINGLE alpha
    at a single rung pair and produced no null distribution for a MAIN-EFFECT CONTRAST at all, so
    comparing -1.0913 or +1.5458 to a single-alpha band is a category error (Validator); "the
    corresponding null band" is undefined for a contrast spanning both regimes, and the deciding
    contrast flips verdict on the choice -- the regime main effect -1.091319 is INSIDE the regime-P
    band [-1.4498, 1.7379] and OUTSIDE the regime-N band [-1.0296, 1.7589] (Red Team); and the two
    clauses are joined by "and/or", which specifies no truth condition when one is split and the
    other inevaluable. ABOVE ALL OF THAT, THE BLINDNESS GATE BINDS: the batch's own fail-closed rule
    and this task's card both state that a BLIND control's band carries no interpretive weight and
    that Branch N cannot be established from it. BRANCHES R AND S FAIL AT THE SAME POINT AND MORE
    SIMPLY: each requires one main effect to EXCEED the null band while the other does not, and no
    main-effect null band exists and the band that does exist is void. BRANCH X THEREFORE FIRES --
    and it fires AFFIRMATIVELY, not as a leftover: its enumerated trigger list includes "a
    replication cell that fails to reproduce its own historical value", and cell (8002, regime N)
    returned +1.5943364808460014 against the historical -0.8662355237627483, a delta of
    +2.46057200460875 with a sign flip. That trigger references no band and is unaffected by the
    blindness gate, so Branch X is established on the data itself. RECORDED PLAINLY, WITH THE
    OBSERVED VALUES, AS THE RULE REQUIRES: the four fresh cells at k=17 are 2.0488128380076307 /
    2.960737268597787 / 0.32362272345795423 / 1.5943364808460014; the three contrasts are
    -1.091319093989102 (regime), +1.545795451150731 (shard), +0.3587893267978908 (interaction). THE
    EVIDENCE CANNOT DISCRIMINATE AMONG "SHARD-SPECIFIC", "GENERAL ESTIMATOR HETEROGENEITY" AND
    "BATCH-SIZE/TRANSITION REGIME". I say that plainly and I do not force a branch to avoid it. I
    ALSO DO NOT USE "INCONCLUSIVE" TO AVOID SAYING WHAT WAS MEASURED: what was measured is rationale
    items (d) and (e), and those are not inconclusive at all.
  - >-
    (d) WHAT WAS MEASURED, PART ONE -- THE HEADLINE IS A k=17 STATEMENT. "All four fresh cells are
    positive" does not survive the k sweep, and BOTH reviewers found this independently at zero
    marginal cost from the same committed per-k arrays, and it is stated nowhere in the producer's
    report. At k=2, on identical data, identical windows, identical shards, identical regimes and the
    identical estimator, the four cells are 0.580733 / 0.506553 / 0.628397 / 0.511866 -- all within
    0.13 of the analytically forced 0.5 -- and the three contrasts are +0.095 / -0.026 / -0.042, all
    approximately zero. The values fan out monotonically with k, reaching [0.35, 4.02] by k=26, and
    at k=20 and k=21 alpha(8002, P) is NEGATIVE (-0.027, -0.113). The fan-out tracks the producer's
    OWN Forced-Value-1 measurement of the estimator's bias, which is -0.00007 at k=2, first exceeds
    0.01 at k=13, is -0.10164 at k=17 and -2.71938 at k=26. THE DRAMATIC EXPONENTS EXIST ONLY WHERE
    THE ESTIMATOR IS WORST SAMPLED AND VANISH WHERE IT IS MEASURED TO BE NEARLY EXACT. Under
    docs/inventor-protocol.md Section 3 that is the canonical artifact signature, and it is fired
    here by this campaign's own control against this campaign's own signal. k=17 is legitimately
    pre-registered as m_load_bearing_order, so this is NOT selective reporting by the producer; the
    defect is that a quantity read directionally for five batches has an unstated k-dependence.
  - >-
    (e) WHAT WAS MEASURED, PART TWO -- THE BATCH MEASURED THE REAL-OBJECT NOISE FLOOR AND DID NOT
    REPORT IT, AND THAT NUMBER SETTLES THE REPLICATION QUESTION. Windows P2 [35000:45000) and N1
    [45000:55000) are both T=10,000, same shard, same batch size 50, same procedure, disjoint
    indices, so anything differing between them is sampling realization by construction. Measured
    se_paired at k=17 differs by 16.712x on shard 5000 (0.016872 vs 0.281963) and 3.719x on shard
    8002 (0.020055 vs 0.074586); since every alpha in this family is exactly -log2(se_hi/se_lo),
    those are 4.063 and 1.895 IN ALPHA UNITS, RMS 3.17 -- larger than the largest contrast reported
    (1.546), larger than the fresh spread (2.637), larger than the +2.461 "replication failure", and
    approaching the entire historical spread (3.702). THE REQUIRED REPLICATION REPORT, GIVEN
    SEPARATELY FROM THE FACTORIAL AS THE FROZEN RULE DEMANDS: cell (5000, P) fresh +2.0488 against
    historical +2.836, delta -0.787; cell (8002, N) fresh +1.5943 against historical -0.8662, delta
    +2.4606 with a sign flip. WHAT THE GAP MEANS: the replication gap is SMALLER than the noise floor
    of the instrument that produced it, so the sign flip is the expected behaviour of this statistic
    and is not a finding requiring a mechanism. Both cells also moved toward the historical midpoint
    (+0.985), the larger historical deviation producing the larger move -- the predicted signature of
    regression to the mean under selection on extremes, which is precisely how batch.yaml's own
    arm-assignment rationale chose these two shards ("MAXIMUM HISTORICAL CONTRAST ... the largest
    available true contrast"), a justification valid only under the hypothesis the batch exists to
    test. THIS ALSO OVERTURNS EV-HQC-469c08 O7's READING, BY SUPERSEDING OBSERVATION AND NEVER BY
    EDIT: O7 read a 3.24x BETWEEN-shard spread as "broad shard-to-shard heterogeneity", and the
    WITHIN-shard, same-T, disjoint-data spread measured here (16.71x and 3.72x) equals or exceeds it,
    so O7's signal is fully accounted for by within-shard sampling variation. The Red Team notes this
    corrects a finding of its own lineage. EV-HQC-469c08 stands exactly as archived.
  - >-
    (f) THE OBSTRUCTION IS RECORDED AS A MEASURED BLOCK, WITH ITS resource_check, AT
    EV-HQC-e458ef.obstruction. tools/obstruction_registry.py currently reports NO obstruction blocks
    recorded program-wide, and this batch produced exactly what that registry lacks: a quantity, a
    value with an honestly stated error bar, the tasks it is read from, and a scope it is claimed
    nowhere outside. STATEMENT, ABOUT THE OBJECT AND NOT THE ATTEMPT: the 2-point local exponent of
    se_paired at joint-moment order k=17 with N_JACK_BATCHES=200 has a draw-to-draw dispersion on the
    real object, at fixed shard, T, batch size and procedure, that equals or exceeds the entire
    spread of the phenomenon being read from it -- because at k=17 the functional sum_s C(s,k) H_s is
    carried by a thin right tail of high-S trials, so the effective sample size for the estimand is a
    small fraction of T. VALUE: RMS 3.17 alpha units from n=2 same-T contrasts plus one historical
    draw per shard, against a 3.702 phenomenon, with the corroborating parametric bands (2.788
    producer, 3.398 Red Team coupled, 3.508 and 4.326 Validator coupled) recorded AS SCALE ONLY and
    explicitly carrying no interpretive weight because the control that produced them is BLIND and
    wrong-shaped. ERROR BAR STATED HONESTLY: a scale, not a distribution; no confidence interval is
    computable and none is claimed. SCOPE: k=17 specifically, and NOT claimed at k <= 7 where the
    same measurements show the estimator behaving as theory requires, and NOT claimed for a >= 3-rung
    ladder on the same data, which is measured to be 2.99x less noisy. resource_check EXAMINED, with
    three readings under which the block is an asset -- the k-localization is a free instrument
    upgrade rather than a loss; the tail-carried instability may be the estimand speaking rather than
    the estimator failing, which is a hypothesis and is recorded as one; and the dominance fact
    supplies its own already-computed replacement -- plus a fourth reading considered and found empty
    and recorded so it is not re-examined blindly. spawned_ids is empty for a mechanical reason
    (no shell, and identifiers may not be invented), with the one reading that warrants a fresh
    IDEA-* named for the driving session to mint.
  - >-
    (g) AN INSTRUMENT-GOVERNANCE RULING, SCOPED DELIBERATELY NARROWLY: THE 2-POINT LOCAL EXPONENT OF
    se_paired AT k=17 IS RETIRED AS A DIRECTIONAL STATISTIC FOR THIS TASK FAMILY, PENDING
    CALIBRATION. It is NOT retired as a recorded measurement; every value this family has published
    remains a correct, reproducible measurement, and where checked they are bit-identical. What is
    removed is the basis for reading any of them DIRECTIONALLY at k=17 -- every statement of the form
    "shard X's exponent is positive / negative / larger than shard Y's / outside [0.4,0.6]" is a
    statement about one draw from a distribution whose own spread is at least as large as the range
    being compared. This touches EV-HQC-469c08 O6 and O7 and EV-HQC-927899 O3 and O4, by superseding
    observation and never by edit. It does NOT touch the validity gates, the disjointness proofs, the
    F-invariants, the D2/D3 counts or any reproducibility result, none of which are 2-point
    exponents. THIS IS A SCOPED RETIREMENT OF A STATISTIC, NOT A CLOSURE OF A LANE, and the
    distinction is the Red Team's own and I adopt it deliberately. Both reviews explicitly refuse to
    close the lane; so do I. Under docs/inventor-protocol.md Section 4, closing this lane on this
    evidence would be premature closure -- the obstruction is real, named, measured, LOCALIZED to a
    parameter choice (k=17) and a fixable estimator (2-point, uncoupled null, unpersisted arrays),
    and correctable at essentially zero marginal cost with the corrected measurement already
    half-computed in committed artifacts. Under the same section, declining to state the measured
    obstruction would be a fatigue report. I do neither. A count of five blind controls is a fatigue
    report about the search, not a statement about the problem.
  - >-
    (h) CORRECTIONS THIS COORDINATOR APPLIES TO ITS OWN PRIOR ARCHIVE RECEIPT, RATHER THAN LEAVING
    THEM TO BE RE-COPIED A FOURTH TIME. TASK-20260817-f24a5e's snapshot receipt, which I wrote,
    carries three overstatements inherited from the producer and one of my own relaying. (1) THE
    "FORCED IDENTITY" SUPPORTS NOTHING. alpha_planted = alpha_unmodified - log2(rho_g) is an
    ALGEBRAIC TAUTOLOGY: the se_hi terms cancel identically and the residual is exactly zero for any
    three positive numbers. The Validator fed 20,000 arbitrary unrelated triples and got max residual
    1.07e-14 -- the same order as the celebrated 6.217248937900877e-15 -- and the Red Team got
    residual 0.0 from fictional se_planted values. The reported figure measures float64 rounding.
    THE PLANT WAS STILL REALIZED, and the ONLY evidence for that is the measured rho rising 1.134 ->
    1.213 -> 1.392 with g, itself now scoped by rationale item (b): that rise is an artifact of
    sampling only g <= 2 and reverses at g=3. The identity is carried forward as corroboration
    nowhere. (2) THE F-INVARIANT COUNT IS 4,950,000, not the 2,475,000 my receipt repeated. (3) "ALL
    FOUR POSITIVE" IS A k=17 STATEMENT, per item (d). (4) THE PRE-REGISTRATION CLAIM I RELAYED DOES
    NOT STAND AS VERIFIED: DEV-1's pre-Part-A content hash 7511ecc1... is an UNVERIFIABLE
    SELF-ATTESTATION -- the pre-fill blob was never committed anywhere, the Validator could not
    reconstruct it from nine placeholder forms plus deletion variants, and neither script prints that
    log line, so stdout.log is a curated composite in which the anchor is hand-authored text rather
    than program output. What DOES stand is content-based and is substantial: every constant, gate,
    window, forced value, g list, R and reduction step in design.md is hard-coded in the two
    committed scripts, which the Validator executed unmodified to reproduce every number, and the
    post-fill hash verifies twice independently. The correct phrasing, adopted here, is
    "self-attested, content-corroborated by the scripts, not independently anchored." The fix is one
    line and free and this campaign should adopt it: commit the pre-fill file. A FIFTH CORRECTION,
    added by the Validator and recorded as a SECOND protocol deviation alongside DEV-1: design.md
    Section 3.5's pre-registered leg_code RNG seeding is not implemented -- leg_code is a dead
    parameter hard-coded to 0, and planted replicates reuse the unmodified base draws. Arguably the
    better choice, changing no verdict, but undeclared, and it makes the reported
    fraction-outside-band a paired quantity compared against an unpaired band.
  - >-
    (i) THE COMMITTED CONTRACT GOVERNED OVER THE DISPATCH ORIENTATION, CORRECTLY, AND THAT IS
    RECORDED AS A PROCESS FINDING. My dispatch orientation to the Red Team named a write_scope of
    .../red-team/TASK-20260817-94c89e/; the COMMITTED task card, the COMMITTED handoff and the
    COMMITTED dispatch_queue.json archive entry all name .../reviews/TASK-20260817-94c89e/. The
    reviewer wrote to the committed path and flagged the discrepancy rather than resolving it
    silently or splitting the difference. THAT IS THE RIGHT PRECEDENCE AND I AFFIRM IT: a dispatch
    orientation is a pointer, never a contract (AGENTS.md "Inter-agent messaging"), and had the
    reviewer followed my prompt its report would have landed outside the declared artifact_paths the
    archiver reads. The defect was mine, in the orientation, not the reviewer's.
  - >-
    (j) THE READING RULE ITSELF FAILED TO COVER ITS OWN OUTCOME, AND THAT IS RECORDED AS A PROCESS
    FINDING RATHER THAN REPAIRED AFTER THE FACT. Branches N, R and S are all defined entirely in
    terms of the null object's band, and the SAME BATCH's fail-closed rule strips that band of
    interpretive weight on a BLIND verdict -- so honouring the rule disables three of its four
    branches REGARDLESS OF HOW THE DATA FELL, while the precedence clause elevates one of the
    disabled three. Two further structural defects compound it: "the corresponding null band" is
    undefined for a contrast spanning both regimes and the deciding contrast gets opposite verdicts
    under two equally defensible readings; and a main effect, an interaction and a single alpha have
    different null spreads (an interaction of four independent cells has 4x the variance of one
    alpha), while the rule applies one single-alpha band to all three. THIS IS THE THIRD
    PRE-REGISTERED RULE IN THIS CAMPAIGN TO FAIL TO COVER ITS OWN OUTCOME, after DEC-20260809-186c86's
    binary test on BATCH-0e126d's measurement and DEC-20260806-1ac8fa's stopping rule on
    BATCH-2ecaa1's pilot. The residual branch was added BECAUSE of the first two; it caught this
    failure, as designed, but it does not fix the cause, which is that all three substantive branches
    were made dependent on a single unvalidated instrument. NO PROTOCOL AMENDMENT IS WRITTEN AND THE
    RULE IS NOT ADJUSTED AFTER SEEING THE OUTCOME: it was applied exactly as frozen and its failure
    is recorded. THE ACTIONABLE CONSEQUENCE, BINDING ON THE NEXT BATCH: a pre-registered reading rule
    in this family may not define its substantive branches solely in terms of a band produced by a
    control whose own validity that same rule is testing. The next batch's rule must name, in
    advance, what it will read if its control comes back blind, and must state the null distribution
    of every contrast it intends to band -- not just of a single alpha. Branch N's PRECEDENCE was
    right in principle (an instrument that cannot resolve an effect cannot license a directional
    reading, and putting that first is the strongest thing in the rule) and wrong in this instance
    only because the band it defers to is the wrong yardstick.
  - >-
    (k) I DO NOT RECORD BRANCH N's SUBSTANTIVE READING AS THE RULE's OUTPUT, THOUGH I REACH A
    NEIGHBOURING CONCLUSION BY ANOTHER ROUTE, AND THE DISTINCTION IS THE HONEST CORE OF THIS
    DECISION. Branch N would have concluded "the 2-point local-exponent diagnostic cannot adjudicate
    this question" FROM THE NULL BAND. That band is void by the batch's own fail-closed rule and is
    the wrong shape besides, so nothing may be concluded from it, in either direction. The
    conclusion I do reach -- the scoped retirement in item (g) -- rests on a DIFFERENT instrument
    that the frozen rule never contemplated: the real-object, distribution-free, same-T disjoint-
    window contrast of item (e), which needs no parametric model, plus the k-collapse of item (d),
    plus the 2.99x dominance of the 4-rung OLS on identical replicates. Those are measurements on
    committed data, not band comparisons. Recording them as "Branch N fired" would smuggle
    interpretive weight back into a band this batch's own rule voided; recording them nowhere would
    be a different failure. They are recorded here and at EV-HQC-e458ef O6, O8 and O16, outside the
    rule, and labelled as such.
  - >-
    (l) WHAT PART B DID ESTABLISH POSITIVELY, RECORDED SO A BLIND CONTROL IS NOT MISTAKEN FOR A
    WORTHLESS ONE. (1) THE CONTROL CAN FAIL: the Validator moved log2 A_k from ~0 to +4.7167 at
    z_paired = -9.36 by feeding the same pipeline a dependent-blocks arm, so the three forced values
    are forced by the MATHEMATICS and not by a code path that returns zero. This was the
    fifth-instance risk the batch named in advance, and it was tested directly rather than argued.
    (2) BATCH-SIZE REGIME ALONE DOES NOT SHIFT THE DIAGNOSTIC ON THE NULL: the difference of mean
    alpha between the 25->50 and 50->100 rung pairs is 0.0217 against a per-replicate SD of 0.70,
    well under half a standard error of the mean. THIS RESULT DOES NOT DEPEND ON THE VOIDED BAND --
    it is a difference of means, not a band comparison -- and it is the strongest positive content in
    Part B: a decoder-free, shard-free, defect-free negative control bearing directly on the confound
    this batch was dispatched to break. (3) FORCED VALUE 3 IS MISSED BY 9 SIGMA AND ITS
    PRE-REGISTERED EXCUSE IS FALSIFIED BY THE PRODUCER'S OWN DATA: the full-ladder fit gives
    alpha = 0.35133 (SD 0.23433, R=200, SE 0.01657, z = -8.97 against the forced 0.5), and the
    pre-registered O(1/T) finite-T explanation predicts the miss falls roughly 4x across the ladder's
    8x range in T while the measured misses are 0.1461 / 0.1678 / 0.1257 -- FLAT, not even monotone.
    A quantity that stays flat when it should decay is the canonical artifact tell, here fired by the
    control's own forced value against an excuse frozen before the data existed. The honest reading
    is that with nb pinned at 200 this estimator's paired SE at k=17 scales as T^(-0.35), not
    T^(-0.5), across 5,000-40,000 -- so every directional statement in this family that used 0.5 as
    its reference point used the wrong reference point.
  - >-
    (m) V1'S POSITIVE-CONTROL PILOT IS DEFERRED A FOURTH TIME, WITH A REASON STRONGER THAN THE
    PREVIOUS THREE BECAUSE IT IS NOW QUANTITATIVE, AND WITH A BINDING RELEASE CONDITION SO THE
    DEFERRAL IS NOT OPEN-ENDED. The prior three deferrals (DEC-20260809-46e85c, DEC-20260814-3f429d,
    DEC-20260815-176614) all rested on the qualitative claim that sizing or interpreting a positive
    control depends on SE-vs-T scaling arithmetic this family exists to check. That claim now has
