  decision_vocabulary_note: >-
    "refine" is this campaign's established disposition vocabulary (DEC-20260802-344883, -9664c6,
    -d94a64, DEC-20260806-46a8f3, -cf5102, -0995d5, -9a4551, DEC-20260809-186c86, DEC-20260814-3f429d,
    DEC-20260815-176614 all use it). Against templates/research-records.md's enumeration
    (approve|revise|replicate|expand|support|weaken|reject_scoped|pause|supersede) this decision is a
    REVISE: it revises the interpretive weight this campaign has placed on the 2-point local exponent
    at k=17, applies the frozen reading rule as frozen, and records a measured obstruction. IT IS
    DELIBERATELY NOT A reject_scoped. Per agents/coordinator.md, reject_scoped on a single
    unreplicated empirical-only run is forbidden; the real-object noise floor that carries this
    decision's central quantitative content rests on n=2 same-T contrasts per shard, which is a scale
    and not a distribution, so the correct disposition is weaken-grade language plus a named
    replication route, and that is what is recorded. No hypothesis is rejected, no lane is closed, no
    mathematical claim is refuted.
