    candidate_1_fixed_batch_count_jackknife_confound:
      name_as_deferred: >-
        "A fixed-batch-count jackknife design (N_JACK_BATCHES held constant while T varies) silently
        confounds any SE-vs-T scaling exponent with the absolute batch-size regime, unless T-points
        are chosen to hold batch size fixed or the regime is deliberately varied independently of
        whatever else the exponent is meant to isolate."
      disposition: not_warranted -- TERMINAL AT THIS SCOPE, NOT DEFERRED AGAIN
      consequence_was_tested: true
      what_the_test_returned: >-
        SPLIT, AND INFORMATIVELY SO. (i) The structural half is CONFIRMED and was then BROKEN as
        designed: shard identity and transition regime were 100% collinear across every measurement
        this family had made, and the 2x2 decoupled them on fresh disjoint ranges with the design
        matrix full rank. (ii) The causal half -- that the regime explains the sign pattern -- is NOT
        supported, and is in fact contradicted by Part B's own decoder-free measurement: batch-size
        regime ALONE does not shift this diagnostic, the difference of mean alpha between the 25->50
        and 50->100 rung pairs being 0.0217 against a per-replicate SD of 0.70. That result does not
        depend on the voided band. (iii) A residual the lesson did not anticipate was measured: with
        nb pinned at 200, batch size and absolute T are the SAME VARIABLE up to a constant in every
        design this family has ever run, including this batch's 2x2 and Part B's own ladder, so NO
        FACTORIAL CAN SEPARATE THEM -- only varying nb can.
      why_not_warranted: >-
        THE REASON IS CONCRETE AND IS NOT A SHRUG. The lesson is a warning about how to avoid
        confounding a MEASURED EXPONENT, and this same archive rules that the measured exponent
        cannot be read directionally at k=17 for reasons having nothing to do with the confound
        (rationale (d), (e), (g)). A design caution about protecting a quantity that cannot currently
        be read is premature; the lesson worth filing, if any, is about the quantity. What remains
        after that narrowing is (i) a restatement of a deterministic design constant (batch size =
        T/nb), checkable by inspection and carrying no claim its sources do not, and (ii) the
        already-recorded structural fact and its break, both fully preserved in EV-HQC-927899 O7 and
        EV-HQC-e458ef O4 and its unresolved_confounds. Filing an immutable corpus entry for that
        would add an entry with no durable content beyond its sources, which is the failure mode this
        campaign has avoided at every prior checkpoint for the opposite reason.
      revisit_condition: >-
        FILE IT, sharpened to "with a fixed batch count, batch size and absolute T are one variable
        and no factorial separates them; only varying the batch count does", AT THE FIRST OF: (a) the
        next-action recompute or a successor producing an instrument whose exponent IS readable, at
        which point the caution becomes actionable and should be filed WITH that instrument; or (b) a
        second instance of the same fixed-batch-count confound arising OUTSIDE this task family,
        which supplies the transfer this campaign has required of every held pattern since
        BATCH-4b8ad3.
