    747bab711ded9e9b609f359dc25733649ff83b8cafb1dd234874d61e1b692003.

    The contract freezes the equation y^2 = x^3 + 2x + 3, the first
    prime from 13 through 200 with a rational point of order exactly
    3, lexicographic T, the successive x-difference multiset, and 500
    x-shuffles. Success is the source idea's prediction that the pair
    count is at least 1. The concrete negative is a finished pair
    count of 0. No point was enumerated in this session and no
    collision count was recorded.

    This session opened KR-RHO-13bf67, KR-IC-955fd6, KR-IC-5a43e5,
    KR-IC-5931ee, KR-RHO-755e35, KR-RHO-0528e7, KR-RHO-fb88e6,
    KR-IC-5ea2f8, KN-OPEN-020, and the Theorem C paragraph of
    KN-FIND-ffe1df. Those rows are not a measurement of the pair count.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. Success fails
    when a finished pair count is 0. No field required for approval
    was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - A finished pair count of 0 is reachable as a recorded outcome, so success is not automatic.
    - The group-law cycle, the difference sum, and the identity exclusion are the instrument controls.
    - The shuffle band and the birthday gap are flags. They do not rewrite a pair count.
    - This session did not enumerate a point and did not claim that the exponent moves.

  evidence_refs: []
  limitations:
    - The measurement covers one toy curve and one prime at most 200. It does not transfer.
    - A collision or a separation is not a change in rho cost.
    - A group-law failure is not a pair count of 0.
    - A timeout is failed_infrastructure and is not a mathematical negative.
    - This decision authorizes a later execution. It does not start one.
    - This decision does not edit a goal head.

