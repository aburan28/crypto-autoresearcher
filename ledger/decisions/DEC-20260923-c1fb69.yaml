  # --------------------------------------------------------------------------
  # (a) THE DISPATCHING SESSION'S FACTS: CONFIRMED OR REFUTED
  # --------------------------------------------------------------------------
  facts_checked:
    F1_RUN-GFPN-ac4487:
      verdict: CONFIRMED
      verified_by_this_act: >-
        YES, read:
        - execution-report-v2.yaml lines 49-54 (completed_valid, gate_pass
          true, exit 0, v2_check_run PASS 38/38) and lines 94-116 (D per
          target: raw_x 384, raw_u 384, S3 64, S3_rescaled 64,
          torsion_S3_norm 64, torsion_S3_rq 16 on reg0, reg1, fresh1 and
          fresh2; structure 35 monomials / degree 4 / deg_A 2 / deg_B 1 / 14
          monomials; F-2(a) 384 = 24 * 16; F-2(b) tables pass; F-3 ratio 4;
          group order 69477519282; 38 certificates, 38 verified);
        - manifest.yaml lines 19-20 and 70-75 (status, seeds keyed by
          '2026092001:v2:fixture:4111:...' and '2026092002:v2:...');
        - post-run-receipt.json lines 389-392 (v2_check_run output verbatim).
    F2_RUN-GFPN-3377f1:
      verdict: CONFIRMED
      verified_by_this_act: >-
        YES, read in full: stderr.log lines 1-21; raw-result.json lines 1-5;
        manifest.yaml (status failed, failure_class infrastructure_error,
        gate_pass null, exit 1, wall 0.286 s, no child read-back);
        command.txt; post-run-receipt.json lines 393-396 (v2_check_run FAIL:
        "no child RLIMIT_AS read-back recorded"). The failure is at
        v2_driver.py line 308 -> v2_common.py line 261, in the uncapped
