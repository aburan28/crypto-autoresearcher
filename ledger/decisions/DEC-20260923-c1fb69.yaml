        the gate (W-6 checks RUN-GFPN-3377f1). This decision retires both ids
        (R-1 (4)) so that no session can launch them by mistake.
    F4_executor_report:
      verdict: CONFIRMED
      verified_by_this_act: >-
        YES: execution-report-v2.yaml lines 76-82 (the Executor's
        implementation_error observation), lines 34-46 (XD-1, XD-2) and lines
        153-155 (DN-7 exercised ellcard only on a toy curve), and
        implementation-v2.md line 432 ("PARI `ellcard` on a toy curve").
    F5_other_code_facts:
      verdict: CONFIRMED
      verified_by_this_act: >-
        YES: v2_driver.py line 771 (cmd_controls, fixture_n3(4111) at line
        764) and line 542 (cmd_fixture4); a1_pari.py line 38
        (`default(parisize, 256000000)`, `default(parisizemax, 4000000000)`),
        in a capped child through v2_solver.run_child (lines 87-96);
        trial-plan-v2.json line 85 (driver_rss_limit_bytes 1073741824).
        A search of experiments/EXP-GFPN-05ff43/ for
