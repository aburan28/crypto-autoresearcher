      not_verified: >-
        The post-commit verifier's acceptance and the commit's tree are the
        dispatching session's report; the receipt's commit_sha_note (line 21)
        records it. This act has no shell.
    F8_queue_simulation:
      verdict: NOT VERIFIED BY THIS ACT (no shell)
      note: >-
        The dispatching session reports that research_dispatch.py and
        validate_dispatch_reference.py both pass a revision that sets
        TASK-20260923-cd932c failed, appends its 344 run files and completes
        TASK-20260923-0fa03f. This act read tools/research_dispatch.py lines
        280-400 and 760-1016: a completed archive is not blocked by a failed
        source for validation purposes (blockers() only gates admission), and
        the review-chain check (lines 766-812) is structural and does not
        depend on reviewer state. That is consistent with the report.

  # --------------------------------------------------------------------------
  # VALIDITY OF THE RETURNED RUN SET (before any interpretation)
  # --------------------------------------------------------------------------
  run_set_validity:
    expected_run_count: >-
      2 packages, as EC-3 prescribes when package 2 fails: the task stops, and
      packages 3 and 4 and every post-gate package are not attempted. MET.
    manifests_schema_complete: >-
      Both manifests exist with every v2 wrapper field. RUN-GFPN-3377f1 has no
      child read-back because no child existed; v2_check_run's FAIL on that
      point follows from the crash and is not a separate defect
      (execution-report-v2.yaml lines 160-161). The phase-A commit is not
      named literally (XD-1; CORR-20260923-fb1be8).
    seed_integrity: >-
      RUN-GFPN-ac4487 records its fixture streams (manifest lines 70-75).
      RUN-GFPN-3377f1 drew nothing: it failed before (beta, lam) or targets
      were fixed, and its raw result is the wrapper's default.
    raw_summary_agreement: >-
      Status, gate_pass, exit code, failure class, wall time and rusage agree
      between each manifest, raw-result.json, execution-report-v2.yaml and
      the receipt, at the lines cited above.
    control_comparability: >-
      Not applicable: no control package ran.
    verdict: >-
      A VALID RECORD OF A GATE FAILURE. RUN-GFPN-ac4487 is a valid pass under
      the v2 code. RUN-GFPN-3377f1 is a valid record of a failure before
      measurement. Neither is evidence about D, the quotient or
      HEUR-GFPN-DFLAT.

  # --------------------------------------------------------------------------
  # RULINGS
  # --------------------------------------------------------------------------
  rulings:
    R-1_terminal_state_and_queue:
      stage_2: >-
        Stage 2 of TASK-20260923-cd932c is TERMINAL `failed`. The task ran,
        its blocking gate failed, and EC-3 and AC-5 end it there. It is not
        `invalid`: its artifacts are a correct and complete record of what
        happened. It is not `cancelled`: it ran. It is not re-iterated inside
        the card (EC-3). The repair is a successor under a new decision (R-5).
      addendum_packages_not_attempted: >-
        As DEC-20260923-8b2dbf SQ-7 and TASK-20260923-6c7f55 DP-5 require:
        the 11 packages of trial-plan-v2-a1.json (RUN-GFPN-0d91bf,
        RUN-GFPN-8c772a, RUN-GFPN-569fd7, RUN-GFPN-086463, RUN-GFPN-bab146,
        RUN-GFPN-7dd55d, RUN-GFPN-47aa51, RUN-GFPN-3a70f1, RUN-GFPN-ae4918,
        RUN-GFPN-8cfac3, RUN-GFPN-6a7f35) are recorded NOT_ATTEMPTED. Reason:
        the v2 gate did not pass (RUN-GFPN-3377f1 failed; RUN-GFPN-76420e and
        RUN-GFPN-b231c1 not attempted), so A1-2's gate cannot hold and
        a1_run_wrapper.py A-6 refuses every one of them (AC-5; SQ-7). This is
        a gate outcome, never a result.
      TASK-20260923-6c7f55: >-
        CANCEL NOW. Its card binds the frozen v2-a1 wrapper, whose A-6 can
        never be satisfied, because RUN-GFPN-3377f1 is immutable. Its run
        ids are retired (R-1 (4)). This holds whether or not Act 4 approves
        the repair, so leaving it `blocked` would state an unblock condition
        that cannot occur. Successor: the stage-R2b card Act 4 writes
        (proposed spare TASK-20260923-292052).
      TASK-20260923-4ff597: >-
        CANCEL NOW. Phase A is committed and verified (36c3b0d2e, 12 paths).
        That receipt STANDS as the binding of implementation-v2-a1/,
        implementation-v2-a1.md and trial-plan-v2-a1.json, and the repair
        wrapper checks against it (addendum PS-5 R-5). Phase B would bind
        stage 2b's run packages, which can never exist, so it can never run.
        The queue's own rule makes an archive complete only on full coverage
        (research_dispatch.py lines 939-948), which is unreachable.
        Successor archive for the repaired addendum packages: proposed spare
        TASK-20260923-befe48.
      review_chain_placeholders: >-
        LEAVE BLOCKED, WITH A NOTE, NOT CANCELLED BY THIS ACT:
        TASK-20260923-9d6cfc, TASK-20260923-ab99ed, TASK-20260923-3eb51f,
        TASK-20260923-4547d3, TASK-20260923-60caac, TASK-20260923-af2fe6 and
        TASK-20260923-7dba83. Reasons:
        (1) They carry no card, run nothing and own no deliverable yet. They
            mark an obligation that SURVIVES the gate failure:
            TASK-20260923-cd932c's gate record and TASK-20260923-4c64b5's
            code are review_required and still need independent review.
        (2) Their successors' shape (which producers, which batch, which
            joints) depends on Act 4's approval decision. Cancelling them now
            would leave the queue asserting, until Act 4, that no review of
            those producers is planned.
        (3) Their depends_on includes the cancelled TASK-20260923-6c7f55 and
            TASK-20260923-4ff597, so they can no longer become ready; the
            dispatcher will report them blocked. Act 4 cancels them in the
            SAME revision that declares their successors, and the reserved
            DEC-20260923-71ebeb, DEC-20260923-c6b67b and EV-GFPN-acdec5 are
            then either reassigned by that act or reported unused.
      TASK-20260923-4c64b5: >-
        Unchanged. Its claim was released completed. Its code is bound by
        phase A of TASK-20260923-4ff597 and is reused read-only by the repair.
        It is reviewed in the successor review round.
      retired_ids: >-
        (4) Every unused v2 and v2-a1 id is RETIRED and never reusable: 29 v2
        ids (RUN-GFPN-76420e, RUN-GFPN-b231c1, the 23 post-gate ids and the 4
        contingency ids, listed in the addendum PS-3 retirement) and the 11
        v2-a1 ids above. RUN-GFPN-ac4487 and RUN-GFPN-3377f1 remain as records
        and are never re-run. No session may launch any of these under the
        frozen wrappers. RUN-GFPN-76420e and RUN-GFPN-b231c1 in particular
        would be admitted by W-5 and W-6 (F3 nuance); launching them would
        violate EC-3, AC-5 and this ruling.
      queue_revision: see queue_revision_authorized below.

    R-2_classification_of_RUN-GFPN-3377f1:
      reading: >-
        IMPLEMENTATION_ERROR, recorded in CORR-20260923-bb8fa5, which
        supersedes the READING and leaves the manifest's
        `infrastructure_error` untouched. The cause is a configuration the
        code controls and never set: an in-process PARI stack ceiling of
        8003584 bytes, deterministic at GF(16777291^3). The recorded class is
        v2_run_wrapper.py's default for a driver that leaves no raw result
        (lines 193-195), not a diagnosis.
      stated_plainly: >-
        It is NOT a D mismatch: no D was computed at p' = 16777291.
        It is NOT "implementation or derivation": that AC-5 reading applies
        only to a mismatch confined to raw_u or S3_rescaled, and there is no
        mismatch of any value.
        It is NEVER a mathematical result about the quotient, the DC-3
        construction, D, HEUR-GFPN-DFLAT or H-GFPN-9a29be.
      consequence: >-
        The remedy is a code-level repair, not a re-run of the same bytes.
        No contingency id applies to a gate package under any class.

    R-3_process_gap_development_check_coverage:
      finding: >-
        Stage 1's development check DN-7 exercised PARI ellcard only on a toy
        curve (implementation-v2.md line 432). The in-process call on the gate
        path was never run at the fixture's GF(16777291^3) before stage 2.
        The Executor stated this honestly, so no record misstates coverage
        and no correction is needed for it. The gap is in what was REQUIRED:
        - TASK-20260923-cd932c EC-2 (lines 119-121) allowed development checks
          but required no parameter coverage. That is the Coordinator's
          specification gap.
        - Acts 1 and 2 read implementation-v2.md and did not flag DN-7's
          scope, while they required parameter-true checks for the v2-a1
          layer (addendum A1-7 (c) at 31 bits). The asymmetry went unnoticed.
      ruling: >-
        STANDING REQUIREMENT for GOAL-GFPN-380702 from this decision on. Any
        card or amendment whose development checks precede a solver-running
        stage must (a) inventory every external-library call on the path of
        each package it will run, in-process or in a child, with the
        parameters each will meet, and (b) exercise every IN-PROCESS call at
        those exact parameters under the delivered configuration, with a
        negative control where a failure is being repaired. Where exercising
        a call would solve a gate, fixture, anchor or cell system, the check
        is replaced by a recorded reason. The repair addendum applies this as
        DV-1 to DV-3. The rule is cheaper than one failed gate.
      not_a_result: >-
        A process finding. It carries no weight on any GFPN claim.

    R-4_standing_of_RUN-GFPN-ac4487:
      ruling: >-
        RE-RUN ALL FOUR GATE PACKAGES UNDER THE REPAIR, WITH NEW IDS, AND
        REQUIRE A BYTE-LEVEL REGRESSION OF THE 4111 FIXTURE AGAINST
        RUN-GFPN-ac4487 (addendum PS-4 REG-1) BEFORE THE 16777291 FIXTURE IS
        ADMITTED. RUN-GFPN-ac4487 is NOT carried forward as a gate member. It
        stays a valid, archived pass under the v2 code and becomes the
        regression reference. It is not superseded, discarded or re-labelled.
      reasons:
        - >-
          The gate certifies the code state that will run the ladder. The
          repair changes that state (the driver's PARI configuration, a new
          entry point, a new wrapper, redirected constants). 4111 is the only
          point where a before-and-after comparison is possible.
        - >-
          The fixture streams are keyed by fixed labels, not by run id
          (v2_common.py lines 4-14 and 43-44; v2_driver.py lines 309 and
          316; RUN-GFPN-ac4487 manifest lines 70-75), and a group order is
          unique. An unchanged pipeline therefore reproduces RUN-GFPN-ac4487's
          solver inputs, D table and certificates. Any difference localises
          to the repair layer or to non-determinism, before any spend at
          16777291.
        - >-
          Carrying RUN-GFPN-ac4487 forward would need cross-layer admission
          logic in the new wrapper (a v2-wrapper package inside an r1 gate,
          with a different task id and protocol label). That is a larger
          change than a re-run and mixes two code states in one gate.
        - >-
          Cost: one fixture package (79.21 s wall at 4111,
          execution-report-v2.yaml line 123) and one package of the 48
          ceiling (44 used by the repaired plans).
      required: YES. REG-1 is a gate condition, not an optional check.

    R-5_the_repair_draft:
      draft: >-
        experiments/EXP-GFPN-05ff43/amendments/v2_addendum_paristack.yaml,
        id AMD-EXP-GFPN-05ff43-20260923-paristack, status draft, approved_by
        null. Additive: no v1, v2 or v2-a1 byte changes.
      key_parameters: >-
        - FIX, primary P-A: configure cypari2's process-wide PARI stack in
          every repair entry process before any v2 or v2-a1 code runs:
          parisize 67108864 (64 MiB), parisizemax 536870912 (512 MiB). Rule:
          parisizemax at most half of driver_rss_limit_bytes 1073741824.
          Demonstrated by DV-2 at (4111, n = 3), (16777291, n = 3) and
          (4111, n = 4), with read-back through a fresh cypari2.Pari() handle,
          driver VmHWM <= 805306368 B, and N at 4111 equal to 69477519282.
          v2_common.curve_order_pari is not replaced.
        - FIX, fallback P-B, only on a named infrastructure trigger (stack
          overflow at 512 MiB, VmHWM above 768 MiB, or a read-back mismatch,
          reproduced once): the same PARI expression in a capped /usr/bin/gp
          child (RLIMIT_AS 10737418240 read back with getrlimit; parisize
          256000000 / parisizemax 4000000000 as a1_pari.py line 38; 7200 s
          child timeout outside the watchdog object).
        - LAYER: implementation-v2-r1/, implementation-v2-r1.md,
          trial-plan-v2-r1.json, trial-plan-v2-a1-r1.json. Entry points that
          apply the fix, redirect only listed module constants in-process,
          and call the unchanged drivers; a new wrapper (R-1..R-13); a checker
          that runs v2_check_run and a1_check_run unchanged plus r1 checks.
        - PLANS: derived mechanically, with canonical-JSON equality to the
          frozen plans after the inverse id map. The addendum's v2-gate
          dependency is re-pointed to the repaired gate.
        - IDS: 42 new ids (31 + 11), minted in stage R1. 40 unused ids
          retired; 2 used ids kept as records.
        - CEILING: 2 + 31 + 11 = 44 of 48.
        - GATE: G1..G4 re-run; REG-1 before G2; AC-5 reading unchanged.
        - DEVELOPMENT CHECKS: DV-1 to DV-10, including the DV-3 negative
          control, which must reproduce the overflow without the fix.
        - SEQUENCING: RS-0..RS-9, replacing DEC-20260923-8b2dbf SQ-5..SQ-9.
      options_weighed:
        P-A_in_process_configuration:
          verdict: ADOPTED as the primary branch
          why: >-
            Minimal. The v2 code runs byte-identically and behaviourally
            identically except for the stack ceiling it inherits. v1 used the
            same API on this pipeline (ladder_select.py lines 23-25).
        P-B_capped_gp_child:
          verdict: ADOPTED ONLY AS A PRE-DECLARED FALLBACK
          why: >-
            It fits AC-1's philosophy (memory-heavy work in a capped child)
            and has a prior signal on this host (implementation-v2-a1.md lines
            366-375). But it replaces a v2 function in-process and changes the
            PARI entry route, a larger change than P-A. It is taken only on a
            checkable trigger, decided before any repaired run.
        in_process_stack_at_2e9_or_4e9:
          verdict: REJECTED
          why: >-
            v1's 2e9 and v2-a1's 4e9 exceed the 1 GiB driver RSS limit of
            AC-1 if touched. The envelope is machine protection and is not
            relaxed.
        edit_v2_common:
          verdict: REJECTED
          why: Frozen and archive-bound (AC-2, AC-3; phase A of TASK-20260923-0fa03f). It would also need v2 re-approved.
        carry_ac4487_forward:
          verdict: REJECTED (R-4)
        rerun_only_the_failed_package:
          verdict: IMPOSSIBLE under the frozen wrappers (F6)
        abandon_the_v2_lane:
          verdict: REJECTED
          why: >-
            A gate failure before measurement is not evidence (AGENTS.md core
            rule 5). Dropping the lane would leave goal criterion C1's
            measured side and KN-OPEN-9b4a2b unanswered for no scientific
            reason (AGENTS.md "Research-direction integrity").
      batch: >-
        Proposed, for Act 4 to decide: a NEW batch, BATCH-e409ca, for the
        repair (its own queue, max_concurrent 1, its own review chain covering
        the repaired producers, TASK-20260923-cd932c's gate record and
        TASK-20260923-4c64b5's code). BATCH-6b1c29's remaining producers are
        terminal after this act's revision, and piling repair tasks onto a
        queue whose objective and AA-2 order are for the frozen run would
        obscure both. The lane moves by close-lane / open-lane.

    R-6_executor_deviations_XD-1_and_XD-2:
