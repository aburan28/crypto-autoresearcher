    F6_gate_cannot_pass_under_existing_code:
      verdict: CONFIRMED, with one correction of detail
      verified_by_this_act: >-
        YES: v2_run_wrapper.py W-6 (lines 115-123) reads
        plan["gate"]["blocking_packages"]; a1_run_wrapper.py A-6 (lines 20-22,
        168-174) reads a1_common.V2_GATE_PACKAGES (a1_common.py line 62), the
        same four ids. Every gate_required package of either plan is refused
