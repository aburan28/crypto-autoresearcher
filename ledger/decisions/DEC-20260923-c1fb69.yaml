    F3_nothing_ran_after:
      verdict: CONFIRMED
      verified_by_this_act: >-
        YES: execution-report-v2.yaml lines 84-91; post-run-receipt.json
        reserved_id_accounting (lines 401-668), with_directory only
        RUN-GFPN-ac4487 and RUN-GFPN-3377f1, 27 planned and 4 contingency ids;
        addendum_ids_checked with_directory [] (lines 670-675).
      nuance: >-
        RUN-GFPN-76420e and RUN-GFPN-b231c1 are gate packages with
        gate_required false (trial-plan-v2.json lines 229-261). The frozen
        v2 wrapper's W-6 would therefore NOT refuse them; W-5 is satisfied
