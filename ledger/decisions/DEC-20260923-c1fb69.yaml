    F7_archiving:
      verdict: CONFIRMED WHERE CHECKABLE
      verified_by_this_act: >-
        PARTLY: the release file
        coordination/goals/GOAL-GFPN-380702/batches/BATCH-6b1c29/claims/TASK-20260923-cd932c.1.release.json
        exists; post-run-receipt.json records commit_sha f9188ae34d59...,
        parent 5952dd671c7e..., 345 staged paths, the v2_check_run outputs
