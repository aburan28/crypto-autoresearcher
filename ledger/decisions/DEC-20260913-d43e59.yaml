coordinator_decision:
  id: DEC-20260913-d43e59
  id_allocation_provenance: >-
    Pre-allocated and verified free via `python3 tools/allocate_id.py
    --check` by the orchestrating session before this record was authored
    (rule 14).
  recorded_at: '2026-09-13'
  recorded_under_task: TASK-20260913-154303
  goal_id: GOAL-CRYPTO-001
  question_id: RQ-CRYPTO-001
  decision: approve
  target_ids:
  - EXP-CRYPTO-3713bf
  - H-CRYPTO-46bb7c
  - IDEA-20260905-afa907
  context: >-
    Proposal selection was made by the orchestrating session, not
    re-litigated here: RQ-CRYPTO-001 carries exactly 2 unconverted
    proposals per `python3 tools/audit_proposal_backlog.py --question
    RQ-CRYPTO-001 --list` scanning all branch tips (IDEA-20260905-0d50d6
    and IDEA-20260905-afa907). IDEA-20260905-afa907 ("Approximate public
    quotients through a defect of lumpability") was selected over its
    sibling because its own `minimal_test` is a concrete, dependency-free,
    exact finite-table computation on cyclic groups of order 11 and 17
    plus a Z/15 coset control -- executable with plain Python stdlib exact
    arithmetic, no PARI/Sage/GAP or other unverified infrastructure
    required -- while the sibling (an algebraic-geometry sheaf-monodromy
    transfer-lemma proposal) requires genuine unproved theorem work with
    no clear decidable success criterion at this stage. GOAL-CRYPTO-001's
    own next_action holds CURVE WORK pending an externally supplied
    mechanism; this experiment does not do curve work at all -- it is a
    finite combinatorial diagnostic on two named small cyclic groups, and
    the proposal's own `goal_applicability.GOAL-CRYPTO-001` field states
    explicitly that it "tests a prerequisite for a public non-generic
    route; it does not meet cryptographic completion." Neither
    GOAL-CRYPTO-001.yaml nor RQ-CRYPTO-001.yaml is edited by this decision
    or by the frozen contract. This decision converts the proposal into
    hypothesis H-CRYPTO-46bb7c, freezes and approves experiment contract
    EXP-CRYPTO-3713bf, and hands both to the executor as
    TASK-20260913-154303, under the standing user authorization of
    2026-09-06 ("all is approved. ideas/experiments should be always
    approved") -- the same authorization already relied on in
    DEC-20260913-7036ce -- so no per-experiment user confirmation is
    requested.
  title: >-
    Approve the frozen contract EXP-CRYPTO-3713bf (exact
    approximate-lumpability delta_t diagnostic on Z/11 and Z/17, with a
    Z/15 known-false coset control and a full-translation-grammar collapse
    test; converts IDEA-20260905-afa907 under H-CRYPTO-46bb7c), and hand
    it to the executor as TASK-20260913-154303.
  binding:
    hypothesis_file: ledger/hypotheses/H-CRYPTO-46bb7c.yaml
    specification_file: experiments/EXP-CRYPTO-3713bf/specification.yaml
    handoff_file: ledger/handoffs/TASK-20260913-154303.yaml
    sha256_note: >-
      Byte hashes are recorded by the Coordinator's snapshot-archive task
      at commit time (this decision is authored before that commit, per
      the design-experiment skill's step ordering: design, then approve,
      then snapshot-archive). specification.yaml was drafted directly at
      status `approved` by the drafting subagent under this session's
      explicit instruction, rather than drafted at `draft`/`review_required`
      and separately flipped; every protocol field (objective, inputs,
      controls, independent variables, metrics, heuristic_under_test,
      preregistered_prediction, scale_relevance, tail_checks, replication,
      budget, stopping/invalidation rules, success/falsification criteria,
      required_artifacts) was checked non-null by this decision before
      approval is treated as final, per the rationale below.
  rationale:
  - >-
    PROTOCOL COMPLETENESS CHECKED BEFORE THIS APPROVAL, field by field
    against experiments/EXP-CRYPTO-3713bf/specification.yaml: objective
    (decidable, both branches of M-A/M-B and P1/P2 stated as first-class
    outcomes); inputs (self-generated only; explicit statement that no
    external data or unverified infrastructure -- PARI, Sage, GAP, cypari
    -- is required or used); controls CTL-1-MATCHED-NULL (random balanced
    partitions matched on cell-size multiset and operation count, fixed
    seed 20260913, >=20 draws or full enumeration where feasible) and
    CTL-2-KNOWN-FALSE-COSET (the Z/15 coset partition, which must show
    exact propagation delta_t=0 and gates all downstream interpretation)
    each with an explicit invalidation clause; independent variables
    (partition family, operation grammar, history length t, group);
    primary metrics (delta_t_table, matched_null_distribution,
    coset_control_result) and secondary metrics (fiber sizes, kernel
    description length, construction wall-clock, the observation-collision
    second-coordinate-rule table); heuristic_under_test naming HEUR-1,
    stated exactly with its justification honestly marked WEAK and
    RECALLED (the only rigorous support found is the classical
    Kemeny-Snell exact-lumpability criterion, which backs the Z/15 control
    but not the core approximate-separation claim itself -- this gap is
    disclosed, not papered over, per AGENTS.md rule 9); the
    preregistered_prediction (P1/P2 transcribed verbatim from the
    hypothesis through into the contract, unweakened, with both negative
    branches -- no separation found; no collapse found -- stated
    explicitly as real, informative, non-failing outcomes); scale_relevance
    (tier `toy`, explicit non-transfer statement to cryptographic-size
    groups, no correspondence trick used); tail_checks (the single
    luckiest matched-random draw vs the coordinate-style result; the Z/15
    gate checked first; the independently-drawn second coordinate rule);
    replication (fixed seed 20260913; independent_instances=2 for the two
    prime-order groups, with an explicit note on why the Z/15 control is
    not counted toward that figure); budget (advisory, per
    docs/research-budget-policy.md -- 300s per run, 0.1 CPU-hours, 1 GB,
    1 worker, no run-count ceiling, all stated as generous advisory
    ceilings on a trivially cheap exhaustive enumeration over groups of
    order <=17, not measured figures); stopping rules and invalidation
    rules (CTL-2 checked first and gates everything; a watchdog
    interruption is `failed_infrastructure` per AGENTS.md rule 3, never a
    negative result for HEUR-1/P1/P2); success_criterion and
    falsification_criterion, both decidable directly from the three
    primary metrics with every negative branch (CTL-2 failure invalidating
    the run; P1 failing; P2 failing) recorded as a first-class, reportable,
    non-failing outcome of the decision rather than a failure of the
    experiment; and required_artifacts (the enumeration script, the full
    kernel tables, the delta_t values with their construction shown, the
    matched-random draw list and distribution, the coset-control result
    table, the second-coordinate-rule table, the execution report, and the
    ledger run schema record). No field checked was null.
  - >-
    NOTHING IS WEAKENED FROM THE PROPOSAL. The two controls (matched_null,
    known_false), the single heuristic (HEUR-1) with its
    random_model_justification honestly marked weak, and the single
    prediction (split, unweakened, into the two decidable parts P1/P2 that
    the proposal's own minimal_test design already implies -- the
    coordinate-vs-random comparison and the full-translation collapse
    check) are transcribed into H-CRYPTO-46bb7c and EXP-CRYPTO-3713bf
    without omission or softening; this was checked line-by-line against
    ledger/proposals/IDEA-20260905-afa907.yaml before this approval.
  - >-
    THIS EXPERIMENT IS SYMMETRIC, NOT A HUNT FOR A PARTICULAR ANSWER, and
    the contract says so explicitly in three places (the hypothesis
    statement, the experiment objective, and the success_criterion): a
    genuine absence of separation (P1 fails) or a genuine absence of
    collapse (P2 fails) is a real, informative, first-class result, not a
    failure of this task or a reason to re-parameterize and re-run in
    search of a different answer.
  - >-
    A STRUCTURAL SCHEMA CORRECTION WAS MADE BEFORE THIS APPROVAL: the
    drafting subagent initially nested `constructive_transforms` one
    level too deep, as a child of `proof_search_map.observation_collision`
    rather than as its own sibling key of `proof_search_map` (per the
    template in templates/research-records.md). The orchestrating session
    corrected this in H-CRYPTO-46bb7c.yaml before this decision was
    authored; the content of `constructive_transforms` itself (transform:
    stronger_invariant; proposed_object: history-conditioned transition
    kernel) is unchanged from the drafting subagent's own text, only its
    nesting level.
  - >-
    PROOF-SEARCH MAP PRESENT AND CARRIED (docs/inventor-protocol.md
    section 8 / KN-TECH-080): bottleneck (whether the coordinate-style
    delta_t falls below the matched-random range on the same finite
    data), baseline_embedding (the matched_null fixture and the Z/15
    known-false reproduction check that must pass first), observation_collision
    (a named collision search -- an independently drawn second coordinate
    rule of the same family, to rule out a one-lucky-labelling artifact),
    quantifier_order (FOR EACH tested grammar/feature pair, FOR EVERY
    allowed history, THERE EXISTS one valid kernel per fiber -- explicitly
    NOT generalized to other grammars, features, or groups), and
    method_ceiling with its nearby_object_control (the Z/15 coset
    fixture, which the diagnostic must correctly classify as exact). All
    four audits are present in H-CRYPTO-46bb7c.proof_search_map; none
    records not_applicable.
  - >-
    NO EXTERNAL DEPENDENCY RISK, UNLIKE THE PRIOR EXPERIMENT DESIGNED THIS
    SESSION: EXP-ECRANK-b23a5e (approved under DEC-20260913-7036ce) required
    PARI/GP with cypari, not installed in this execution environment, and
    disclosed that as a setup dependency. EXP-CRYPTO-3713bf's inputs.solver
    states explicitly that the entire pipeline is Python stdlib exact
    arithmetic on groups of order <=17; no comparable infrastructure risk
    exists for this contract.
  - >-
    SCALE HONESTY: scale_relevance.tier is `toy`, with an explicit
    statement that this is a finite combinatorial diagnostic on two named
    small groups (largest order 17) plus one auxiliary control group, and
    that no claim transfers to cryptographic-size groups, any other
    operation grammar, or any other feature map without a separately
    frozen follow-up experiment.
  - >-
    NO OTHER RECORD'S STATUS IS TOUCHED by this decision or by the frozen
    contract: GOAL-CRYPTO-001.yaml, RQ-CRYPTO-001.yaml, and
    IDEA-20260905-afa907.yaml are read-only inputs. This experiment does
    not satisfy, partially satisfy, or advance any GOAL-CRYPTO-001
    completion criterion by itself, per H-CRYPTO-46bb7c's own
    interpretation_limits.
  evidence_refs:
  - ledger/proposals/IDEA-20260905-afa907.yaml
  - ledger/hypotheses/H-CRYPTO-46bb7c.yaml
  - experiments/EXP-CRYPTO-3713bf/specification.yaml
  - ledger/questions/RQ-CRYPTO-001.yaml
  limitations:
  - >-
    This decision authorizes DESIGN AND APPROVAL only. No run of
    EXP-CRYPTO-3713bf has executed; no evidence record exists yet; no
    finding about HEUR-1, P1, or P2 is made or implied by this decision
    itself.
  - >-
    Protocol completeness was checked by this Coordinator session reading
    the frozen contract; it was not independently re-verified by a second
    model at this stage (that independent check belongs to the review
    round after execution, per docs/inter-agent-messaging.md and the
    handoff's own review_plan_note).
  - >-
    HEUR-1's random_model_justification is honestly disclosed as weak: no
    rigorous theorem is known to this session establishing that a
    restricted-grammar coordinate partition should have smaller
    approximate-lumpability defect than a matched random partition; the
    experiment is precisely the check of this untested modelling step, not
    a consequence of an established one. This is a limitation of the
    hypothesis's theoretical grounding carried forward honestly, not
    resolved by this decision.
  - >-
    The specific coordinate-style modulus choice (m=3 for Z/11, m=4 for
    Z/17) is one reasonable instantiation of "an explicit, cheap, publicly
    computable coordinate rule" and was not independently re-derived or
    optimized by this decision; the observation-collision check (an
    independently chosen second coordinate rule of the same family) exists
    precisely to test whether the specific choice matters.
  status_fields:
    hypothesis_status_change: none -> specified (H-CRYPTO-46bb7c newly created at status specified; moves to running/analyzed only with executed evidence)
    experiment_status_change: none -> approved (EXP-CRYPTO-3713bf newly created; version 1; drafted directly at status approved by the drafting subagent under explicit instruction; every protocol field checked non-null by this decision before treating the approval as final)
    proposal_status_change: none recorded here (IDEA-20260905-afa907.status remains as committed in the ledger; this decision converts it via a new hypothesis record rather than editing the proposal file)
    claim_tier: toy
    claim_status: execution_authorized
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No evidence exists yet; this decision approves the first frozen
      contract of a new hypothesis. Nothing is supported, weakened, or
      rejected by an approval, so no finding is promotable at this stage.
  next_actions:
  - >-
    Executor TASK-20260913-154303: implement and execute the enumeration
    exactly as frozen in EXP-CRYPTO-3713bf/specification.yaml -- CTL-2
    (Z/15 gate) first, then the coordinate-style/matched-null/full-
    translation comparisons resolving P1 and P2 -- preserving every
    required artifact.
  - >-
    Coordinator snapshot archive of the run package BEFORE any independent
    review (a separate, Coordinator-only archival task per AGENTS.md
    "Durable research commits").
  - >-
    Independent review round (validator + red team) after the snapshot
    archive, with a frozen review_plan naming the load-bearing joints --
    at minimum, the CTL-2 gate result and the exactness of the one-step
    kernel construction (verified against brute-force group multiplication
    tables per proof_search_map.proof_obligations, responsibility:
    correctness).
  - >-
    If P1 or P2 resolves as a genuine negative, the Coordinator drafts an
    evidence record scoped exactly to the tested groups, grammar, and
    coordinate rule per AGENTS.md rule 6 (negative evidence closes only
    the exact tested scope) -- never a claim about other groups, grammars,
    or scales.
  decided_by: coordinator
  decided_at: '2026-09-13'
  inference:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    model_provenance: >-
