  target_ids:
    - GOAL-ICEX-001
    - BATCH-1104d5
    - TASK-20260907-5b8740
    - TASK-20260907-2568e2
    - TASK-20260907-0b2354
  rationale:
    - >-
      INDEPENDENT VALIDATOR VERDICT: FAILED. TASK-20260907-0b2354 independently
      re-ran the producer's own three specific claims with fresh git commands
      and found the producer's central negative claim to be WRONG. The
      producer's recovery-report.md asserted that no ICEX-content
      DEC-20260731-015 was ever committed anywhere in this clone's history.
      Running the producer's own cited command (`git log --all -- ledger/decisions/DEC-20260731-015.yaml`)
      TODAY returns THREE commits, not one: commit
      91e404845e7fd34dccda78f9267c8cc662ccc80d (an ordinary ancestor of current
      HEAD) contains a real Git blob at exactly that path holding ICEX
      protocol-PASS content, with sha256
      05627e11dac0014ec866683d349942d07682f0a3d1f9e2a0a68917a2e3beeebc -- the
      EXACT hash the archive block had declared. This was verified at the
      object level (git ls-tree, git cat-file -p), independent of any git log
      history-simplification quirk.
    - >-
      A SECOND PRODUCER CLAIM WAS ALSO REFUTED: the producer characterized its
      own sed-substitution reconstruction (splicing the -003 content's body
      under a -015 id) as "explaining the hash without asserting such an
      object ever existed" -- i.e. a coincidence. The reviewer's independent
      diff shows the sed-substituted content is BYTE-IDENTICAL to the real
      historical blob at 91e404845, meaning it is not a coincidental
      hash-formula match but an exact reconstruction of a genuine, recoverable
      historical object that the producer's own package wrongly marked
      `unresolved[0]` / unavailable.
    - >-
      A THIRD CLAIM WAS PARTIALLY CONFIRMED BUT THE PRODUCER'S OWN INVENTORY
      WAS INCOMPLETE: the live-path overwrite attribution (DEC-003 now
      GOAL-MLKEM-003 content, DEC-015 now GOAL-ECDLP-001 content) checks out,
      but the reviewer's own `git log --all` on DEC-20260731-003 surfaces an
      earlier, additional same-day collision commit (fa0c33c37, also an
      ancestor of HEAD) that the producer's recovery-report.md never
      mentions.
    - >-
      WHAT IS NOT IN QUESTION: every byte the producer DID capture and hash in
      preservation-package.json is independently confirmed accurate --- 27/27
      entries byte- and hash-verified by the reviewer, plus the content-first
      snapshot binding for TASK-20260907-2568e2. The defect is a wrong
      negative claim about non-existence and an incomplete overwrite
      inventory, not corrupted preservation of what was captured.
    - >-
      A NEGATIVE CONTROL WAS EXERCISED (positive/negative/mismatched-hash/
      mismatched-path cases), all behaving correctly, confirming the review
      itself is not the source of the discrepancy.
    - >-
      THIS DOES NOT AUTHORIZE ANY ICEX MEASUREMENT. GOAL-ICEX-001's own
      standing ruling (EV-ICEX-001, cited independently of DEC-20260731-015)
      already forbids ICEX measurement pending charged SDEG/MONO/RELN feeds;
      nothing here changes that. The genuinely-recovered historical
      DEC-20260731-015 content (now confirmed real, not fabricated) is a
      custody-provenance fact, not new scientific evidence, and is not read
      as reopening, reversing, or reinterpreting any prior ICEX ruling.
  evidence_refs:
