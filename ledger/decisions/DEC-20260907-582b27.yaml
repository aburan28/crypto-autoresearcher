    independent validator TASK-20260907-0b2354, and this ledger archive
    (TASK-20260907-6d3467). UNLIKE THE FIVE SIBLING BATCHES OPENED BY THE SAME
    DEC-20260907-46aa8f, THIS ONE IS NOT CLOSED CLEAN: the independent
    validator returned FAILED, not PASSED.
  decision: revise
  decision_note: >-
    "revise" per the DEC-20260907-46aa8f family convention. This decision does
    NOT certify the custody package as accurate or complete; it discloses a
    confirmed defect in it. No hypothesis, experiment, or claim-tier
    transition is made, and no ICEX measurement is authorized by anything in
