    created from origin/main at
    9c2bc35e93f0c2f83026c8e351c621f623bdfb90 and git merge origin/main
    reported already up to date.

    The contract freezes the prime search from 307 through primes
    below 2000, the reduced model, the degree-2 slice S_3, the 2-core
    crater, and the integer comparison 4*|n_c*F - n_f*C| >= n_f*n_c.
    That comparison is the absolute mean gap of at least 0.25. The
    strict opposite inequality, with the instrument gates passing, is
    a negative. No volcano was built in this session and no Y was
    computed.

    This session opened KR-IC-5a43e5, KR-RHO-755e35, KR-RHO-13bf67,
    and KR-IC-5931ee. Those rows are the summation polynomial, the
    isogeny-invariance of group order, the generic floor, and the
    prime-field Semaev negative. They are not the 0.25 gap.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. Success is
    the gap of at least 0.25, and it fails when the finished gap is
    strictly below 0.25 against quiet instrument gates. No field
    required for approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading are fixed before any executor run.
    - A finished gap strictly below 0.25 is reachable as a recorded outcome, so success is not automatic.
    - The collinear-triple audit and the four-trace null are the same-shape instrument controls.
    - A search that finds no qualifying volcano is not scored as a gap of 0.
    - This session did not compute Y and did not claim that the exponent moves.

  evidence_refs: []
  limitations:
    - The measurement covers one volcano at one prime below 2000. It does not transfer to cryptographic primes or to other summation polynomials.
    - A gap in Y is not a gap in rho steps.
    - A formula disagreement or a Vélu point-count mismatch is an instrument failure and is not a gap result.
    - A distinguished-point rho cap hit is incomplete as a cost control and is not a mathematical negative about Y.
    - This decision authorizes a later execution. It does not start one.
    - This decision does not edit a goal head.

