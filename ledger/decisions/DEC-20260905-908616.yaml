coordinator_decision:
  id: DEC-20260905-908616
  context: >-
    Approving EXP-ECDLP-a26bde (hard-lift localisation: the formal-group digit
    identity, the m^2 size law, the Teichmuller non-homomorphic contrast, the
    leak demonstration, and the anomalous break step) for execution, per the
    missing Coordinator approval step of /design-experiment steps 2 and 4.
  decision: approve
  target_ids: [EXP-ECDLP-a26bde, H-ECDLP-6a9479, TASK-20260905-6cb4b3]
  rationale:
    - >-
      A. Schema completeness: REQUIRED["experiment"] fields (id, hypothesis_id,
      version, status, metrics, budget, success_criterion) are all present and
      non-null; success_criterion and falsification_criterion are non-null;
      approved_by is now set to coordinator, satisfying the approved-status
      check in tools/validate_ledger.py check_experiment.
    - >-
      B. Budget floors: wall_clock_seconds_per_run (1800) exceeds the 600s
      floor. maximum_memory_gb (4) is below the 8GB floor stated in
      templates/research-records.md, but the contract's own scope justifies
      it and the deficiency is stated here rather than silently passed: the
      procedure is exact rational (Python fractions) arithmetic over Q on toy
      curves with primes of 10-14 bits and m up to 256, no floating point, no
      numpy, and no large tables (per inputs.instrument and assumptions in
      H-ECDLP-6a9479); the numerators/denominators involved stay at most a
      few hundred bits, so real memory use is a small fraction of 4GB and
      raising the cap would not change what the run can do. No budget field
      was edited.
    - >-
      C. Distinguishable outcomes: success_criterion (digit agreement 1.0,
      size slope 2.00+-0.05, Teichmuller linearity <= 3/p, certified recovery,
      correct anomalous refusal) and falsification_criterion (exact
      disagreement, out-of-range slope, high Teichmuller linearity, recovery
      failure or wrong anomalous break point, each separately from
      infrastructure failure) are each decidable from the declared metrics,
      and each names a realistic negative outcome; the contract does not
      guarantee its own success.
    - >-
      D. Proof-architecture gate (KN-TECH-080): H-ECDLP-6a9479.proof_search_map
      is filled, not excused via not_applicable_reason (which is null). It
      names a real bottleneck (the digit identity and the size law), a
      baseline-reproduction check (exact digit equality, fitted slope 2), an
      observation-collision test (d and bit-size as the two observables), an
      explicit quantifier order, and a method ceiling (toy-scale verification
      plus the leak demonstration and anomalous break; nothing beyond that
      certified). The gate is satisfied.
    - >-
      E. Scope and claim-tier discipline: scale_relevance.tier is toy; no
      attack or exponent claim is made anywhere in the contract or hypothesis
      (H-ECDLP-6a9479 states "NO ATTACK, NO EXPONENT MOVED" explicitly); the
      leak arm is explicitly labelled in both the hypothesis
      (interpretation_limits) and the experiment's approval_gate as a
      demonstration that consumes the scalar to build the lift it reads,
      never a recovery result. This is stated clearly enough to stand without
      further edit.
    - >-
      F. Independent-review requirement: this is a toy-scale measurement that
      verifies a derivation and asserts neither an attack nor an exponent
      improvement, and it contradicts no existing validated evidence, so it
      does not meet AGENTS.md's review-breakthrough trigger (a claimed break,
      a closure result, or a contradiction of validated evidence). Ordinary
      Coordinator approval is sufficient; review_plan is null on the handoff.
  evidence_refs: []
  limitations:
    - Toy tier; five curves, twenty primes, one anomalous object.
    - A verified identity is not a theorem at cryptographic scale; the derivation is general and its recalled inputs still need reading.
    - No attack; the leak arm consumes the scalar to produce the lift it reads.
  next_actions:
    - Dispatch TASK-20260905-6cb4b3 to the Executor for EXP-ECDLP-a26bde.
    - On terminal outcomes, run the Coordinator snapshot archive before independent review, then /review-evidence to assign evidence strength and an official decision.
  knowledge_promotion:
    promoted: []
    not_warranted: pre-execution approval decision; no evidence exists yet to promote or decline promoting
  decided_by: coordinator
  decided_at: '2026-09-05'
