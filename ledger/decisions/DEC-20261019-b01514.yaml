  target_ids: [H-ECDLP-60de36, EXP-ECDLP-20a588, EV-ECDLP-97cb57]
  hypothesis_status_transition:
    H-ECDLP-60de36: rejected_scoped -> rejected_scoped (scope widened)
  scope: >-
    Rejected for prime fields at toy scale for m in {2, 3} under Singular
    std/slimgb + fglm, m = 3 under msolve 0.6.5 F4 + FGLM with plain DRL, and
    m = 3 with the chain variables eliminated first (msolve -e, Singular block
    order). Not rejected: other weighted or interleaved orders, other solvers,
    other modellings of the chain.
  rationale:
    - The frozen falsification criterion of EXP-ECDLP-20a588 is met for both solver pairs, independently recomputed by VAL-20261019-e750db (passed).
    - The block order is a real improvement over plain DRL (4.6x, 16x) but leaves a roughly constant factor of about 2 over the dense same-set encoding, with intervals that exclude parity.
    - The exploratory degree observation points away from an L-independent degree bound for this encoding.
  evidence_strength: replicated
  evidence_refs:
    - EV-ECDLP-97cb57
    - experiments/EXP-ECDLP-20a588/reports/validation-20261019/validation.md
    - experiments/EXP-ECDLP-20a588/reports/review-DEC-20261019-b01514/report.pdf
  next_actions:
    - problems/pkm-isogeny-chain-factor-base-no-fast-decomposition.md stays open; next discriminating step is F4 matrix-size accounting (msolve -v 2) for chain vs dense per L.
    - No further P-256 work on this route unless some order or encoding beats the dense and random controls on the frozen grid.
  approval_basis: AGENTS.md standing user authorization (2026-09-06)
