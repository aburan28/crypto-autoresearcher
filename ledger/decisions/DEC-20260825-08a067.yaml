coordinator_decision:
  id: DEC-20260825-08a067
  context: >-
    The user requested a durable map of the latest attacks on hash functions,
    AES, and block ciphers, explicitly naming differential trails,
    distinguishers, SHA-1's roughly 2^61 frontier, and IACR ePrint 2026/1744.
    Existing goals cover primitive-specific experiments and GOAL-DIFFP-84d641
    covers new MD5/SHA-1 differential-path search, but no goal owns a normalized
    cross-primitive published frontier.
  decision: approve
  target_ids:
    - GOAL-SYMF-c00fa1
    - RQ-SYMF-5ab172
    - BATCH-303ce8
    - TASK-20260825-51dfe7
    - TASK-20260825-3da758
    - TASK-20260825-7d3441
    - TASK-20260825-568663
    - TASK-20260825-bb6d5d
    - TASK-20260825-9eda3a
    - TASK-20260825-6b0c89
  rationale:
    - >-
      A cross-primitive frontier is a prerequisite for the inventor protocol's
      mandatory `dominated_by` and quantitative `sota_delta` fields.  Without
      it, those fields are repeatedly re-derived from partial memories.
    - >-
      The canonical object is a set of Pareto rows keyed by notion, model,
      target, rounds, and cost units.  There is deliberately no global "best
      SHA-1 attack" or "best AES attack" scalar.
    - >-
      Batch 1 is acquisition and transcription, not an attack.  Three bounded
      producers cover disjoint primitive families; a snapshot freezes them
      before two sibling-blind independent reviews; only the Coordinator's
      ledger archive may compile reviewed rows into canonical knowledge.
    - >-
      Concurrency 3 is acceptable for text-only acquisition on this host.  No
      producer runs cryptanalytic compute, and the archive tasks still run
      alone.
  evidence_refs:
    - ledger/goals/GOAL-DIFFP-84d641.yaml
    - ledger/goals/GOAL-MD5-001.yaml
    - coordination/goals/GOAL-MD5-001/batches/BATCH-04272f/tasks/TASK-20260821-cbb510/frontier-ledger.yaml
    - ledger/goals/GOAL-SHA1-001.yaml
    - ledger/goals/GOAL-SHA2-001.yaml
    - ledger/goals/GOAL-SHA3-001.yaml
    - ledger/goals/GOAL-AES-001.yaml
    - ledger/goals/GOAL-AES-002.yaml
    - ledger/goals/GOAL-AES-003.yaml
    - >-
      https://eprint.iacr.org/2026/1744.pdf -- retrieved and read by the driving
      Coordinator session on 2026-08-25 as a seed only; its claims are not yet
      authoritative knowledge until the producer/review/archive chain completes.
  limitations:
    - No literature row is promoted by this opening decision.
    - No paper claim is treated as independently reproduced.
    - >-
      "All" is made auditable by the coverage manifest and terminal per-cell
      states; absence of a search hit is never proof that no attack exists.
    - The user-supplied RIPEMD-160 paper is a 42-step reduced collision result, not a full RIPEMD-160 break.
  next_actions:
    - Commit the opening control plane from origin/main and validate the dispatch queue.
    - Dispatch the three producer tasks, then follow the snapshot and review chain.
  knowledge_promotion:
    promoted: []
    not_warranted: No batch evidence or independent review exists at opening.
  decided_by: coordinator
  decided_at: '2026-08-25'
