coordinator_decision:
  id: DEC-20260930-713445
  recorded_at: '2026-09-30'
  decided_at: '2026-09-30'
  decided_by: coordinator
  recorded_by: coordinator
  decision: open_goal
  target_ids: [GOAL-NGCC-6c8a52, RQ-NGCC-f52138]
  user_instruction: >-
    2026-09-30: make the Chinese NGCC algorithms targets. The request
    included the text of Saarinen, Chinese NGCC Algorithms: The First Week
    of AI Cryptanalysis (IACR ePrint 2026/2266).
  standing_authorization: >-
    AGENTS.md "Standing user authorization for ideas and experiments"
    (2026-09-06). It authorizes later ideation and design under this goal.
    It approves no specific experiment, and this decision approves none.
  rationale: >-
    ICCS published 119 first-round NGCC candidates on 2026-09-20. This
    program had no NGCC goal. The user asked for those schemes to be
    targets. One goal owns the population in
    inputs/ngcc-round1-20260920/candidates.yaml, joined from the public
    harness tables retrieved the same day (34 signatures, 41 KEMs, 9
    key-exchange protocols, 35 hashes). Opening 119 goals would have
    required inventing an attack object for each scheme before its
    specification was read. ePrint 2026/2266 is a lead list, recorded in
    paper_mentions.yaml. It is not evidence, and this decision confirms
    nothing in it.
  priority: >-
    NGCC is declared non-ECC in orchestration/research-priority.yaml.
    GOAL-NGCC-6c8a52 is ranked after every ECC goal that offers a ranked
    task. The three SQIsign submissions and NIIKE remain NGCC targets;
    attacks on the supersingular-isogeny problem itself stay with
    GOAL-SQISIGN-001, GOAL-SQISIGN-002, GOAL-SSI-001, and GOAL-CSIDH-001.
  prior_expectation: >-
    Coordinator prior, recorded before any NGCC experiment: the first
    useful result is an independent reproduction or refutation of one
    published design-level break on one named parameter set. A new
    exponent-moving attack on a candidate that survived the first public
    week is not expected from the opening batch. A sweep that only
    re-finds implementation bugs would not meet the completion criterion.
  citations:
    - ref: https://eprint.iacr.org/2026/2266
      provenance: retrieved
      claim: >-
        The paper is the source the user supplied for the NGCC population
        and the first-week public findings. This decision uses it as the
        reason the targets exist, not as proof of any finding.
      verified_by: >-
        Session of 2026-09-30 fetched the ePrint landing page. Finding
        identifiers in paper_mentions.yaml come from the paper text
        supplied with the user request and were not re-executed.
    - ref: inputs/ngcc-round1-20260920/candidates.yaml
      provenance: internal
      claim: >-
        The 119-row roster this goal owns, joined from harness CSVs whose
