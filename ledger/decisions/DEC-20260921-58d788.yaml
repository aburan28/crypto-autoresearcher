  the_decision_stated_plainly: >-
    RUN-FROB-9c4e81's interruption is diagnosed, honestly and without
    fabrication, as the SAME failure mode that destroyed RUN-FROB-39714f,
    RUN-FROB-f3e2a3, RUN-FROB-16ecb6, RUN-FROB-5490f1, RUN-FROB-0b1c8e,
    RUN-FROB-5fa3f0, RUN-FROB-35c3b1, RUN-FROB-a91f4c, and RUN-FROB-e6c204: a
    whole-environment/container restart external to any script's own
    control, external to any timeout wrapper (there was none this time
    either), and external to any code defect in driver-v2.py/checker-v2.py.
    This is now the TENTH, CONSECUTIVE instance of the identical
    infrastructure failure mode under the same, already-corrected source and
    launch procedure, launched correctly by the dispatching session every
    time. RUN-FROB-9c4e81 survived approximately 15 minutes -- this lane's
    SECOND-LONGEST genuine survival to date, behind only RUN-FROB-35c3b1's
    ~37 minutes. The full observed interval sequence is now ~20, 11, 9, 7, 4,
    5, 37, 3.5, 9, and now 15 minutes. This tenth point is on the longer side
    of the sequence, but it does NOT challenge DEC-20260921-51d07b's own
    (and, before it, DEC-20260921-cb38f4's own) "highly variable, no
    confirmed upper bound or distributional shape, no monotonic trend"
    characterization in any direction -- it remains below the already-
    observed ~37-minute maximum, and ten points read in order (20, 11, 9, 7,
    4, 5, 37, 3.5, 9, 15) still show no consistent direction. This coordinator
    states that plainly, exactly as instructed: there is nothing new to say
    about the pattern beyond adding this tenth observation, and this record
    does not invent a narrative where none is warranted. Declaring the range
    "narrower," "confirmed," or "trending upward" on the strength of one
    longer-than-median point would be exactly the false precision
    DEC-20260921-51d07b itself declined to manufacture from its own ninth
    point. Like all ten interruptions themselves, this characterization
    remains infrastructure signal, never negative mathematical evidence
    (AGENTS.md core rule 3 / CLAUDE.md rule 3), and this record does NOT
    condition its own authorization on any reading of it. None of the ten
    says anything about H-FROB-73df22. On that basis, this coordinator (1)
    makes no change to RUN-FROB-9c4e81's directory -- it was already
    preserved exactly as it stands (real partial roots.jsonl.gz,
    151339023 bytes, sha256
    072b2cce87c9f21cafe3e135434fcdc3f3e7ea0cd3f34cf41fcbe81e40defb70, the
    corresponding oversized-artifact-pointer.json, and the other six
    adapter/launch files, no execution-receipt.json) by the dispatching
    session prior to this engagement, and this record does not touch it
    again -- and (2) authorizes a fresh retry under a fresh,
    coordinator-proposed (NOT yet allocate_id.py-confirmed) run_id,
    RUN-FROB-b91d47, via a fresh trial-plan-stage0-v15.json, a fresh
    run-binding, and a fresh launch handoff to the Executor
    (TASK-20260921-79f360), per the user's standing instruction to keep
    retrying automatically through this exact failure mode.

  rationale:
    - >-
      TENTH, CONSECUTIVE INSTANCE OF THE SAME FAILURE MODE, STILL
      INFRASTRUCTURE/PROTOCOL SIGNAL, NEVER NEGATIVE MATHEMATICAL EVIDENCE,
      PER AGENTS.md CORE RULE 3 / CLAUDE.md RULE 3. RUN-FROB-9c4e81 is not a
      new, distinct failure mode; it is a REPEAT of RUN-FROB-e6c204's,
      RUN-FROB-a91f4c's, RUN-FROB-35c3b1's, RUN-FROB-5fa3f0's,
      RUN-FROB-0b1c8e's, RUN-FROB-5490f1's, RUN-FROB-16ecb6's,
      RUN-FROB-f3e2a3's, and RUN-FROB-39714f's own whole-environment-restart
      mode -- entire process tree destroyed, including the Python supervisor
      that would have written execution-receipt.json, before that
      supervisor's own completion/receipt-writing logic could run at all.
      This is the TWELFTH interruption overall in this lane's history and
      the TENTH consecutive occurrence of the identical infrastructure
      failure mode under the same, already-corrected source and launch
      procedure. Ten-for-ten launch attempts under driver-v2.py/checker-v2.py
      have now been killed by whole-environment restarts, all
      non-scientific, non-protocol infrastructure signal. None of
      RUN-FROB-9c4e81, RUN-FROB-e6c204, RUN-FROB-a91f4c, RUN-FROB-35c3b1,
      RUN-FROB-5fa3f0, RUN-FROB-0b1c8e, RUN-FROB-5490f1, RUN-FROB-16ecb6,
      RUN-FROB-f3e2a3, or RUN-FROB-39714f says anything about H-FROB-73df22,
      RQ-FROB-7d8dd4, or whether Frobenius structure moves the index-calculus
      exponent.
    - >-
      HONEST, DELIBERATELY UNCHANGED CHARACTERIZATION -- THIS POINT DOES NOT
      CHALLENGE THE EXISTING CHARACTERIZATION AT ALL, EVEN THOUGH IT IS THE
      SECOND-LONGEST OBSERVED SURVIVAL. DEC-20260921-51d07b stated, on nine
      points, that the interval remains "highly variable, roughly
      3.5-to-37-minute range... no monotonic trend in either direction." This
      tenth point (~15min) sits above the sequence's own median but strictly
      below its own already-observed maximum (~37min from RUN-FROB-35c3b1),
      so it does not break either bound, does not suggest a narrower band,
      and does not add evidence for or against a monotonic trend -- reading
      all ten points in order (20, 11, 9, 7, 4, 5, 37, 3.5, 9, 15) still
      shows no consistent direction: five consecutive falls, two rises, a
      fall, a rise to mid-range, then another rise to a longer-than-median
      value. This record does not manufacture a new, more-precise-sounding
      distributional claim from a longer-than-median point, and does not
      pretend the range is now "confirmed" or "trending upward" merely
      because a tenth point happened to be the second-longest yet -- twelve
      points from an externally-imposed, uncontrolled restart process still
      cannot establish a confirmed distributional shape or upper bound. The
      honest statement on ten points is exactly DEC-20260921-51d07b's own
      honest statement, unchanged: highly variable, roughly 3.5-to-37 minutes
      observed so far, no confirmed distributional shape, no monotonic
      trend. If there were nothing new to say about the pattern, this record
      says that plainly instead of inventing a narrative -- and there is
      nothing new to say here beyond honestly recording the tenth point.
      This correction (or rather, non-correction) changes no authorization in
      this record: like the ten interruptions themselves, the interval
      sequence, under any of its framings, remains infrastructure signal
      only, never negative mathematical evidence, and this record does not
      condition RUN-FROB-b91d47's authorization on any reading of it.
    - >-
      NO FABRICATED RECEIPT, AND NO REDUNDANT PRESERVATION ACTION. This
      decision does NOT author an execution-receipt.json for RUN-FROB-9c4e81,
      and does not construct, estimate, or infer one from the partial
      roots.jsonl.gz or from what a graceful interruption receipt would
      ordinarily contain. RUN-FROB-9c4e81's directory was already preserved
      exactly as found by the dispatching session in commit a49022426, prior
      to this engagement -- this coordinator's own Glob confirms it still
      contains exactly eight entries (launch.json, command.txt, stdout.log,
      stderr.log, environment.json, tuples.jsonl.gz, roots.jsonl.gz,
      roots.jsonl.gz.oversized-artifact-pointer.json) and no
      execution-receipt.json or other downstream adapter/checker artifact.
      Per AGENTS.md core rule 5 ("Never fabricate commands, outputs, timings,
      statistics, citations, or runs. Missing data stays missing and is
      reported as such."), this record does not edit, complete, or backfill
      that directory in any way.
    - >-
      OVERSIZED ARTIFACT HANDLING IS THE SAME, ALREADY-ESTABLISHED PATTERN,
      NOT A NEW EXCEPTION. RUN-FROB-9c4e81's roots.jsonl.gz (151339023 bytes)
      is the second file in this lane to exceed GitHub's 100MiB hard limit,
      after RUN-FROB-35c3b1's (486954627 bytes). Both are handled identically:
      a roots.jsonl.gz.oversized-artifact-pointer.json disclosing the exact
      size and sha256 is committed in place of the raw bytes, honestly
      labeled as a hosting-infrastructure limitation rather than a
      data-integrity or provenance gap, and explicitly declared never to be
      read as evidence about H-FROB-73df22. This coordinator independently
      read that pointer file in full in this engagement (see context above)
      and confirms its shape matches RUN-FROB-35c3b1's own pointer exactly,
      field for field.
    - >-
      THE RUNTIME LOCK BEING CITED REMAINS THE SAME, STILL-CURRENT, STILL-
      UNEDITED, LAUNCH-AUTHORIZED LOCK. This coordinator independently
      cross-checked linux-runtime-lock-successor-20260914-c85f6a.json's
      content sha256
      (46d918a1a4b9d358df39f09a87d5221128cc1ce19cb62672bc35204785952eb5)
      against trial-plan-stage0-v14.json's own and
      run-binding-stage0-v14-retry-20260921.json's own already-filled
      runtime_lock_sha256 fields (all agree, re-read directly in this
      engagement). Nothing about the runtime, its guards, or its
      authorization changes here; a tenth whole-machine restart is not
      evidence the runtime lock's own guards were inadequate -- the failure
      is again a whole-machine restart, a class of event no per-process guard
      in linux-runtime-lock-successor-20260914-c85f6a.json claims to protect
      against, and this record does not construct a new claim that it does.
    - >-
      WATCHDOG SIZING RATIONALE REMAINS VALID, UNCHANGED. No run in this
      lane has ever shown signs of hanging or needing a shorter or longer
      watchdog; all twelve interruptions observed to date have each been
      either an instant application-level error, an external interruption
      from this lane's own now-corrected tooling, or (ten times now) an
      infrastructure restart external to any process's own control -- never
      a hang. RUN-FROB-9c4e81 itself was still progressing normally (its
      roots.jsonl.gz was real and growing, reaching 151339023 bytes) at the
      moment it was destroyed, at ~15 minutes -- far short of the 86400s
      watchdog ceiling. 86400 seconds remains sized generously above the
      only real duration signal available and remains a ceiling meant never
      to bind in the normal case, machine protection only per CLAUDE.md
      "Research budgets: progress first."
    - >-
      DIRECTION CHECK, unchanged from the whole DEC-20260909-bf5b48 ..
      DEC-20260921-51d07b chain. Stage0 is not itself exponent-moving; it is
      the correctness gate for H-FROB-73df22's two arms. No scientific claim
