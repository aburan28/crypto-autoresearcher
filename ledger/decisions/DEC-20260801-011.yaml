  # ==================================================================
  # PART III - RATIONALE FOR THE BATCH-026 DESIGN
  # ==================================================================
  rationale:
    - >-
      THE MEASUREMENT ARM IS THE POINT OF THE BATCH AND EVERYTHING ELSE IS THE MINIMUM
      PATH TO IT. BATCH-026 exists to reach RUN-LPF-001-measure against the EXISTING
      ADMISSIBLE calibration. It authors no new contract, no new hypothesis, no new
      calibration, no new driver and no new statistic. OPEN-BATCH023-A - the direct
      B-smoothness measurement owed for twenty-five batches - is still unpaid and still
      the single next action.
    - >-
      THE REPAIR IS MECHANICAL BY CONSTRUCTION AND THAT IS THE LESSON OF RTB-054-1. The
      defect was a hand-written summary of a machine-readable table. moving_rungs in
      RR-LPF-2 is therefore GENERATED from LPF_movement_beyond_noise_flag by a stated
      operation over a named array, per ladder, with the generating operation written into
      the file so a reviewer can re-run it rather than re-read it. A new discipline is
      filed for this - MECH-GEN-1 - because the failure class is general and cheap to
      prevent.
    - >-
      THE D1 RESTATEMENT REQUIRES AN ARCHIVED ARRAY BEFORE IT REQUIRES A SENTENCE, WHICH
      IS WHY AN EXECUTION TASK PRECEDES THE AUTHORING TASK. RTB-054-2 exists because a
      quantitative claim about planted Z values entered a frozen record while the
      per-sample Z arrays were absent from the archive, making the claim uncheckable in
      principle. Restating that claim from an equally unarchived regeneration would repeat
      the defect exactly. TASK-20260801-063 therefore regenerates the planted values from
      the frozen driver's own functions on the frozen driver's own streams and archives
      the Z distribution, the per-replicate exceedance counts and the eviction and
      insertion accounting AS MACHINE-READABLE ARRAYS, and TASK-20260801-065 validates
      them independently, BEFORE any sentence of RR-LPF-2 is written. This is the
      reviewer's own forward fix, adopted verbatim, and it is filed as a discipline -
      PERTURB-TAIL-1.
    - >-
      THE REGENERATION TOUCHES NO REAL OBJECT AND MODIFIES NO HASH-BOUND FILE, AND BOTH
      CONSTRAINTS ARE STRUCTURAL RATHER THAN PROMISED. It runs from a SEPARATE auxiliary
      script that IMPORTS lpf001_driver.py unmodified, asserts DRIVER_SHA256 equality
      before doing anything, and calls only build_smooth_replacement,
      build_rough_replacement, the Stream seeding and all_statistics. It never calls
      deterministic_factor_base, int1_fibre_invariants, run_measurement or
      _independent_pmax_recheck, and the module tripwire _REAL_OBJECT_TOUCHED must be
      asserted false at exit and recorded false in the run record. IT REQUIRES NO
      FACTORIZATION - the plants' factorizations are known by construction - and runs in
      seconds. ATS-LPF-1 clause 3 is respected because the hash-bound driver is IMPORTED
      AND NOT EDITED; the D5 completeness hoist, which WOULD require a new driver under a
      new hash, is still refused for exactly that reason.
    - >-
      THE FIVE DISCIPLINES ARE CARRIED IN FULL AND THE ATTAINABILITY AND MOVEMENT DUTIES
      ARE RE-RUN FROM SCRATCH AGAINST RR-LPF-2 RATHER THAN INHERITED. A REGENERATED
      moving_rungs CHANGES WHAT IS CERTIFIED, and what is certified is an input to the
      attainability argument, to the L-1 stop-condition check, to ALT-CLASS's S1 and S2
      certified sets and to every per-rung power statement. Inheriting the BATCH-025
      attainability verdict because "only two entries changed" would be exactly the
      reasoning the cap exists to refuse. TASK-20260801-068 re-runs all four duties with
      its own recomputation, and additionally carries a fifth duty - THE DIFF DUTY - which
      verifies that nothing outside the four permitted changes moved.
    - >-
      THE RTB-054-6 DECLARATION IS ADDED AS A SCOPE STATEMENT AND CHANGES NO NUMBER,
      BECAUSE IT MUST. The [1/8, 8] band and the u_star_formula are hash-bound pre-datum
      and moving either after seeing that the uniform arm sits at 4.571 of an 8.0 ceiling
      would be textbook post-hoc band adjustment. The declaration states the asymmetry -
      about 1.75x rather than 8x of headroom at bits 16 u = 5 - and states that the sole
      non-decidable rung is largely a definitional artifact of u being defined at D while
      samples live on [1, p**2]. It travels with every LIMB B reading. IT MAKES THE
      APPARATUS LOOK WEAKER AND MORE FRAGILE THAN THE FROZEN FILE DOES, WHICH IS WHY IT IS
      MANDATORY.
    - >-
      THE ONE-CYCLE CAP IS RETAINED UNCHANGED AS RC-26. A REVISE at TASK-20260801-068 at
      any severity is a BATCH-026 non-execution for the measurement arm, and the fact that
      this batch's own repair was itself produced under a cap is not a reason to soften
      the next one. A cap that survives only until it is inconvenient has never been
      tested.
    - >-
      NOTHING ABOUT THE COST MODEL CHANGES AND THE BUDGET GATE STANDS. RUN-LPF-001-measure
      is still the single genuinely expensive thing this campaign has proposed, the pilot
      projection gate still aborts before bulk work if the projection exceeds budget, an
      abort is still a BUDGET EVENT and an L-0 instrument signal and never a result, and
      SILENT SCOPE REDUCTION IS STILL FORBIDDEN - reducing R_CAL, the ladders, the cells
      or n requires a Coordinator protocol_amendment. Every factorization is still
      re-verified at 100 percent and independently re-factored on a subsample by the
      validator.

