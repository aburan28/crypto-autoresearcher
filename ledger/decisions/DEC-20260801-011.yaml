  rationale:
  - >-
    TASK-20260801-040 discharged its three named duties and returned literal
    REVISE. The frozen D-5 wording makes the already archived 1-of-20
    apparatus-identity exceedance a rejection; choosing a different aggregate
    reading after calibration would violate ATS-DEP-1.4.
  - >-
    D-1 lacks a frozen sampling-noise predicate, so the reading rule is not
    mechanically decidable. That defect cannot be repaired after seeing a
    measurement array without opening a new versioned protocol and fresh
    calibration.
  - >-
    The alternative-class gate fails because source-versus-plant joint-table
    movement is diagnosed only at K=16, not K=64, and C2/C3 have no calibration
    observation. A source construction capable of crossing bins is not the
    required measured per-family certificate.
  - >-
    RC-24 explicitly makes REVISE a BATCH-024 non-execution. The Executor
    followed that branch exactly. No missing-data interpretation is permitted.

