  # ==================================================================
  # PART IV - LIMITATIONS
  # ==================================================================
  limitations:
    - >-
      TOY TIER ONLY - field sizes 16 and 20 bits, D = 2**32 and 2**40. AGENTS.md rule 7
      applies with full force. No crypto-scale, medium-scale, asymptotic or
      affected-scheme claim under any branch; no scheme is affected and none is declared
      safe; all four promotion gates G1 through G4 remain OPEN.
    - >-
      A FAVOURABLE OUTCOME IS NOT A VALIDATION OF HEUR-DS-1 AND THAT IS STILL THE MOST
      LIKELY OVERCLAIM AVAILABLE FROM THIS LANE. HEUR-DS-1 is used in cost reasoning at
      cryptographic D; this measures its instance at toy D. Uncertified class V6 states
      the reason.
    - >-
      DELIBERATELY NOT A REPLICATION. The same two curve instances are used. Nothing here
      can move anything toward `replicated` and RT049-CTRL-5 remains owed.
    - >-
      NO SEARCH, NO COST, NO TIMING DECISION VARIABLE, NO R, NO EXPONENT. S1_met, F1_met,
      F2_met and structure_gate_passed cannot be evaluated at all.
    - >-
      THE RTB-054-6 DECLARATION NARROWS WHAT LIMB B CAN BE SAID TO TEST AND IT IS NOT A
      REPAIR OF LIMB B. The apparatus still reads R(u) against a band whose reference arm
      is off-centre by a definitional mismatch, and the honest consequence is that a LIMB
      B band exit at bits 16 u = 5 is a weaker fact than the [1/8, 8] band makes it look.
      A CENTRED LIMB B WOULD BE A DIFFERENT EXPERIMENT UNDER A DIFFERENT CONTRACT and is
      ranked in the forward guidance, not attempted here.
    - >-
      FORBIDDEN THROUGHOUT - `support` for H-LPF-001, H-SMTH-001, H-DS-001, H-EQD-001 or
      H-DEP-001; validation or refutation of HEUR-DS-1 above the toy tier in either
      direction; asymptotic promotion; `reject_scoped` and in particular
      reject_scoped-as-impossibility; dominated_by null; and equally any characterization
      of BATCH-021 through BATCH-025 as vacuous or worthless, which would be premature
      closure under docs/inventor-protocol.md section 4.
    - >-
      THE STANDING MODEL-INDEPENDENCE CAVEAT APPLIES UNCHANGED - author, executor,
      validator, reviewer, red team and coordinator all resolve to claude-opus-5,
      independence is PROCEDURAL and not model-level, model_verified is false everywhere,
      and NOTHING IN BATCH-025 OR BATCH-026 IS ADMISSIBLE TOWARD THE AGENTS.md RULE 13
      THREE-MODEL CLOSURE QUORUM.
    - >-
      RT049-B6 IS CARRIED FORWARD UNADDRESSED. The determinism-versus-small-x-window
      confound is not attacked by this batch either, and it is uncertified class V7.

