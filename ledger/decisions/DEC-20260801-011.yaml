coordinator_decision:
  id: DEC-20260801-011
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-001
  batch_id: BATCH-026
  closes_batch_id: BATCH-025
  question_id: RQ-ECDLP-002
  decided_by: coordinator
  decided_at: '2026-08-01'
  decision: approve
  decision_scope: >-
    THIS RECORD DOES TWO THINGS AND NEITHER IS AN EVIDENCE-REVIEW DECISION. (1) It CLOSES
    BATCH-025 AS A ONE-CYCLE NON-EXECUTION FOR THE MEASUREMENT ARM by goal-record
    amendment, following the BATCH-014/015, BATCH-022/023 and BATCH-024/025 precedent
    exactly - NO EVIDENCE RECORD IS FILED BECAUSE NO MEASUREMENT RUN EXISTS, EV-LPF-001 IS
    NOT WRITTEN AND ITS ID REMAINS FREE, and no hypothesis status moves in either
    direction. (2) It OPENS BATCH-026 on the BATCH-026 dispatch plan, the UNCHANGED frozen
    contract EXP-LPF-001, the hypothesis H-LPF-001 at `specified` and the fourteen
    handoffs, approved AS A PLAN. IT AUTHORIZES NO RUN. The two run authorizations of
    BATCH-026 are PLANT_TAIL_REGENERATION_AUTHORIZATION in the TASK-20260801-062 snapshot
    receipt and APPROVAL_DETERMINATION in the TASK-20260801-069 snapshot receipt, and
    neither is granted here. No experimental support of any kind is asserted anywhere
    below.
  target_ids:
    - GOAL-ECDLP-001
    - BATCH-025
    - BATCH-026
    - EXP-LPF-001
    - H-LPF-001
    - RR-LPF-1
    - RR-LPF-2
    - RQ-ECDLP-002

  # ==================================================================
  # PART I - THE BATCH-025 CLOSE
  # ==================================================================
  batch_025_close:
    outcome: NON_EXECUTION
    outcome_class: >-
      READING-RULE TRANSCRIPTION AND JUSTIFICATION DEFECT CAUGHT BEFORE THE MEASUREMENT
      COMPUTE. NOT an instrument-capability failure and NOT an infrastructure failure.
    what_it_is_not: >-
      IT IS NOT A MATHEMATICAL RESULT ABOUT H-LPF-001, HEUR-DS-1, H-SMTH-001, H-DS-001,
      H-EQD-001 OR H-DEP-001 IN EITHER DIRECTION, AND IT IS NOT AN INFRASTRUCTURE FAILURE.
      Nothing timed out, nothing crashed and no budget was exhausted. AGENTS.md rule 5 and
      rule 3 both apply and neither is stretched. IT IS ALSO NOT A FINDING THAT THE
      APPARATUS CANNOT MEASURE WHAT IT CLAIMS - see the_distinction_from_pattern_instr_5
      below, which is the single most important thing this close records.
    procedure: >-
      RUN-LPF-001-measure IS NOT EXECUTED. Under the RC-25 one-cycle cap a REVISE at
      TASK-20260801-054 at any severity is NOT APPROVED and ends the measurement arm.
      TASK-20260801-055 recorded APPROVAL_DETERMINATION NOT APPROVED. TASK-20260801-056
      through TASK-20260801-060 are terminal `blocked` with that reason recorded on each
      card, which is the honest terminal state and not a bookkeeping lag. No evidence
      record is filed, EV-LPF-001 IS NOT WRITTEN and its id stays free, and the close is
      recorded by goal-record amendment at this batch's opening.
    the_cap_was_enforced_against_convenience: >-
      RECORDED PLAINLY BECAUSE IT IS THE PART THAT COST SOMETHING. The reviewer stated in
      terms that the repair NEEDS NO RE-EXECUTION and that the calibration package REMAINS
      ADMISSIBLE. The cap was nevertheless enforced. Accepting a REVISE as approvable
      because the fix looks cheap is exactly the latitude the cap exists to remove, and a
      one-cycle cap that bends when the fix is cheap is not a cap.
    hypothesis_status_effect: >-
      H-LPF-001 REMAINS `specified`. No hypothesis status moves. H-DEP-001, H-EQD-001,
      H-SMTH-001, H-DS-001, H-IC-001 and H-STR-002 are untouched. EV-EQD-001 and
      EV-DS-001 through EV-DS-004 are not re-scored and are amended in neither direction.
    reviewed_artifacts:
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-054/contract_review.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-054/attainability_check.md
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-054/anti_tuning_check.md
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-054/alternative_class_check.md
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-054/perturbation_movement_check.md
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/archives/TASK-20260801-055/snapshot_commit_receipt.json
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-051/calibration_validation_report.yaml

    the_one_blocking_defect_that_forced_the_revise:
      id: RTB-054-1
      finding: >-
        certified_ladders.moving_rungs IN RR-LPF-1 CERTIFIES TWO RUNGS WITH NO RECORDED
        MOVEMENT. OBJ-PLANT-ROUGH / STAT-RATE-u@u_target=2 / bits 16 is frozen with
        moving_rungs_bits_16 [0.005, 0.01, 0.02, 0.05] while the archived row at
        gamma 0.005 carries shift -0.882122 null sd and flag False; the mechanically
        recomputed set is [0.01, 0.02, 0.05]. OBJ-PLANT-ROUGH / STAT-KS-DICK / bits 16 is
        frozen with [0.01, 0.02, 0.05] while the archived row at gamma 0.01 carries shift
        -0.937958 null sd and flag False; the recomputed set is [0.02, 0.05]. BOTH ARE
        FALSE UNDER THE SD READING, UNDER THE AUXILIARY RANGE READING AND UNDER DET-LPF-1
        AT 1 OF 20 WITH detected_under_DET_LPF_1 false. They are uncertified on every
        criterion the calibration archives.
      why_it_is_blocking: >-
        The reading rule's own certified_ladders note makes the moving_rungs list THE
        PER-RUNG POWER CERTIFICATE, and PERTURB-MOVE-1's named reviewer duty states the
        consequence verbatim - "a rung with no recorded movement that the reading rule
        nevertheless certifies, is a REVISE". ALT-CLASS-RR052 declares itself binding and
        travels with every statement citing this experiment, so the overstatement
        propagates into every downstream power claim. Both overstatements are in the ROUGH
        direction, which the file itself identifies as the measurably weaker one, and they
        claim power at a gamma an octave below where any movement was recorded. The
        reviewer states it cannot waive a REVISE condition the contract names, and this
        Coordinator does not ask it to.
      it_is_a_transcription_failure_not_a_measurement_failure: >-
        THE ARCHIVED TABLE IS CORRECT. The frozen SUMMARY of it is not. The validator
        recomputed all 210 rows at maximum discrepancy exactly 0.0 with zero misreported
        rows. The defect entered when a derived list was written by hand instead of
        generated from LPF_movement_beyond_noise_flag.
      a_third_row_erring_the_other_way_recorded_for_completeness: >-
        RTB-054-3, non-blocking. OBJ-PLANT-SMOOTH / STAT-RATE-u@u_target=3 / bits 20 is
        frozen with moving_rungs_bits_20 [0.002, 0.005, 0.01, 0.02, 0.05] while the
        archived row at gamma 0.001 carries shift 1.572416 and flag True, so the frozen
        list UNDERSTATES certified power by one rung. It errs against the experiment and
        is not a REVISE ground on its own. A MECHANICAL REGENERATION REPAIRS IT TOO, in
        the same operation and by the same rule, which is the point of a mechanical
        regeneration.

    the_two_corrections_the_reviewer_established:
      preamble: >-
        THESE ARE CORRECTIONS TO THE FROZEN RECORD AND TO THE DISPATCHING SESSION, NOT
        MERELY REVIEW COMMENTARY. Both must travel into RR-LPF-2 or the repair is
        cosmetic. Both were established by REGENERATING the frozen driver's own functions
        on the frozen driver's own streams, with the regeneration anchored by reproducing
        the archived null values bit-for-bit - T_deep 6.060618052804848 at bits 16 and
        5.762382565494627 at bits 20 on replicate 0, and STAT-KS-DICK 0.04919123043052837
        and 0.038236912915851275 - so any disagreement is a disagreement with the frozen
        TEXT and not with the pipeline.
      correction_RTB_054_2:
        id: RTB-054-2
        title: the D1 structural argument is materially false as written
        the_half_that_is_true: >-
          THE ROUGH FAMILY IS GENUINELY STRUCTURAL AND IT IS CONFIRMED FROM SOURCE. In
          build_rough_replacement the replacement is q*r with q drawn in (p, v//64] and
          r <= v//q; since v <= X = p**2 we get r <= p**2/q < p < q, so P_max = q exactly
          and Z = 1 + ln r / ln q < 2 UNCONDITIONALLY. The rough family cannot occupy the
          deep tail, no sampling is involved, and the fallback path leaves the original
          null sample in place so it introduces no planted value at all.
        the_half_that_is_false: >-
          THE SMOOTH FAMILY IS NOT STRUCTURAL AT ALL. build_smooth_replacement returns a
          product of primes drawn from primes_upto(Bsm(u=4)), so Z = ln m / ln(max drawn
          prime) is a RANDOM VARIABLE bounded only by about ln(p**2)/ln 2, i.e. about 32.
          Whether any plant reaches the null deep tail is an empirical question that has to
          be measured, and D1 asserted it as an impossibility instead.
        the_numbers_that_do_not_reproduce: >-
          D1 quotes a maximum planted Z of 4.957 at bits 16 and 4.643 at bits 20 over
          "all 6541 planted OBJ-PLANT-SMOOTH values". The top rung carries 130820 planted
          values per cell, not 6541, and the regenerated maxima over the twenty top-rung
          replicates are 5.936051910051658 and 6.031412202025096. The quoted quantity
          corresponds to no set the reviewer could construct - not the maximum, not the
          mean of per-replicate maxima, and not the tenth-largest planted Z (4.969 and
          4.792). THE PER-SAMPLE Z ARRAYS ARE NOT IN THE CALIBRATION PACKAGE, so the
          number is not checkable against the archive at all, and the freeze's own
          reliance_on_the_validator_declared block lists the D1 regeneration among the
          items it did NOT re-derive. A claim entered the frozen record unverified against
          an archive that cannot verify it.
        the_universal_claim_is_falsified_by_the_pipelines_own_output: >-
          At bits 20, gamma 0.05, replicate 0 a planted value has Z = 6.031412202025096,
          ABOVE that same replicate's null tenth-largest Z of 5.762382565494627, and the
          driver's own all_statistics on that planted replicate returns
          T_deep 5.824044507159416 against the null's 5.762382565494627. THE PLANT MOVED
          T_DEEP UP, which the stated mechanism says cannot happen. The companion sentence
          "RAISING GAMMA OR THE REPLICATE COUNT WOULD NOT CHANGE THIS" is false as an
          absolute, because the count of plants above the null tail scales LINEARLY in
          gamma; within the frozen ladder at gamma <= 0.05 it is empirically true and that
          is the honest scope.
        the_true_statement_with_its_number: >-
          A MEASURED NEAR-DISJOINTNESS, NOT A STRUCTURAL IMPOSSIBILITY. At gamma = 0.05
          the mechanism is dominantly eviction - about 0.5 evictions per replicate against
          about 0.05 insertions, an EVICTION-TO-INSERTION RATIO OF ABOUT 10 TO 1, from a
          measured per-plant exceedance rate of about 7.6e-06. Distributionally over the
          130820 top-rung plants per cell - mean Z 3.8166 and 3.7968, q99 4.5943 and
          4.4559, q99.9 5.0288 and 4.8190, q99.99 5.5359 and 5.1901, mean per-replicate
          maximum 5.5173 and 5.2398. The honest phrase is that the frozen ladder places
          NEGLIGIBLE MASS above the null deep-tail threshold, by a measured factor of ten.
        what_this_does_not_overturn: >-
          STRIKE-1 ITSELF STANDS AND THIS IS STATED SO THE DEFECT IS NOT INFLATED. Its
          measured basis is unchanged and was reconfirmed - 0 of 28 plant rung-cell rows
          carry a movement flag for STAT-TAIL-DEEP under BOTH the sd reading and the
          auxiliary range reading, and the largest absolute shift over all 28 is
          0.3379820826156079 null sd. The retained and struck sets are correct. WHAT FAILS
          IS THE REASON, and the reason is load-bearing because CERT-LPF-1 forbids
          reporting the inertness as low power and D1 was the only thing distinguishing
          the two. STRIKE-2 is sound and the reviewer independently strengthened it -
          10 of 130820 top-rung smooth plants are 40-smooth at bits 16 and 1 of 130820 are
          102-smooth at bits 20, predicting a shift of about -0.18 null sd against a
          measured -0.290 and -0.454.
        what_the_repair_must_be: >-
          RR-LPF-2 restates D1 as (i) a STRUCTURAL bound for OBJ-PLANT-ROUGH only, derived
          from source, and (ii) a MEASURED near-disjointness for OBJ-PLANT-SMOOTH with the
          eviction-to-insertion ratio stated and the gamma range it holds over stated;
          restates V8 as "places negligible mass there at the frozen rungs" with the
          measured rate rather than "NEITHER FROZEN PLANT FAMILY CAN PLACE MASS THERE";
          and narrows the "raising gamma cannot change this" sentence to the frozen
          ladder. EVERY NUMBER IT USES MUST COME FROM A MACHINE-READABLE ARRAY ARCHIVED
          FIRST, which is what TASK-20260801-063 exists to produce. Restating one
          unarchived number with another unarchived number would repeat the defect.
      correction_RTB_054_6:
        id: RTB-054-6
        title: the LIMB B interpretation limit, undeclared in RR-LPF-1
        finding: >-
          THE PARAMETER THAT SHOULD HAVE DESTROYED THE SIGNAL DID NOT, AND THE REASON IS
          DEFINITIONAL. R(u) on a correct uniform sample should sit near 1 at every rung.
          It does not - measured 1.170, 1.452, 2.052, 4.571, 11.594 at bits 16 and 1.128,
          1.306, 1.644, 2.445, 5.039 at bits 20, rising monotonically in u. About half the
          excess is a definitional mismatch and not a finite-X property of Dickman -
          u is computed as ln(D)/ln(Bsm) while the samples live on [1, p**2] with
          p**2/D = 0.5070 and 0.5358. Recomputing u against the ACTUAL SAMPLE RANGE gives
          R(u) 1.063, 1.199, 1.519, 2.998, 6.684 at bits 16 and 1.050, 1.134, 1.318,
          1.794, 3.365 at bits 20, AND IN PARTICULAR MOVES THE SOLE NON-DECIDABLE
          CELL-RUNG, bits 16 u = 6, FROM 11.5937 OUTSIDE THE [1/8, 8] BAND TO 6.68 INSIDE
          IT. The frozen attribution of the non-decidability entirely to "the asymptotic
          rho under-predicts deep-tail smoothness at the toy X" is at best half right; the
          non-decidability is LARGELY A DEFINITIONAL ARTIFACT.
        the_operative_consequence: >-
          LIMB B IS NOT A SYMMETRIC 8x TEST AT THESE CELLS. Because the uniform arm
          already sits at 4.571 of an 8.0 ceiling at bits 16 u = 5, THE REAL ARM NEEDS TO
          BE ONLY ABOUT 1.75x SMOOTHER THAN THE UNIFORM ARM TO EXIT THE BAND THERE,
          against 8x if the reference were centred. That asymmetry is undeclared in the
          frozen file and it must travel with any LIMB B reading.
        this_is_not_a_repair_request_on_the_band: >-
          NEITHER THE [1/8, 8] BAND NOR THE u_star_formula MAY MOVE. Both are hash-bound
          pre-datum in specification.yaml and moving either would be exactly the
          ATS-LPF-1 clause 2 violation this campaign has spent five batches guarding
          against. RR-LPF-2 ADDS A DECLARATION and changes no number. DREAD-LPF-1's
          per-cell reading of the D_formula is separately CONFIRMED by the reviewer as the
          only admissible reading; confirming the reading is not endorsing its
          consequence, and this declaration is that consequence stated.

    what_survives_and_is_reused_verbatim:
      preamble: >-
        LISTED EXPLICITLY SO NO SUCCESSOR BATCH REBUILDS ANY OF IT. Every item below was
        independently verified in BATCH-025 and is carried forward unchanged.
      calibration_package: >-
        RUN-LPF-001-calib at snapshot 104d32faff09207740f980be3c7dc8faa3642110 is
        ADMISSIBLE (VAL-20260801-006, TASK-20260801-051) - 68950136 factorizations at
        LPF_factorization_verified_fraction 1.0 with zero failures, 13600 independently
        re-factored by a second code path with zero disagreements, all 210 movement rows
        reproducing at maximum discrepancy exactly 0.0, and a full from-scratch
        re-execution reproducing every result file identically on every scientific field.
        THE MEASUREMENT ARM DOES NOT NEED A NEW CALIBRATION AND BATCH-026 DOES NOT AUTHOR
        ONE.
      driver: >-
        lpf001_driver.py at DRIVER_SHA256
        786aeb0550d75fa3d0785aefbe50b121a24cacae584a4cadd79902c464722d65 is UNMODIFIED and
        binds - six-way agreement across the manifest, environment.json, command.txt, the
        execution report, the TASK-20260801-050 receipt and the live file at HEAD. It is
        not edited in BATCH-026 and the D5 hoist is still refused for that reason.
      open_rr052_a: >-
        RULED. THE STRIKE OF STAT-TAIL-DEEP STANDS, on textual grounds the reviewer states
        it would have given in both counterfactuals independent of the measured values -
        the decisive point being that TAIL-LPF-1's demonstration (c) IS the ROUGH ladder's
        top rung, one of the rows CERT-LPF-1 reads, so the only configuration in which
        TAIL-LPF-1's one-absent case can co-occur with a CERT-LPF-1 strike is (b) present
        and (c) absent, and under the opposing reading TAIL-LPF-1's sole operative effect
        would be to override CERT-LPF-1 exactly where CERT-LPF-1 bites. CONSEQUENCE -
        L-1's second leg does NOT pre-fire on archived data and L-2, L-3 and L-4 ARE
        REACHABLE.
      attainability: >-
        DUTY PASSES. No branch unreachable by construction. Every frozen probability
        reproduces exactly - 0.8009950248756219, 0.8179027857969561, 0.9800995024875622,
        P(L-3) 0.0009900745031063587, P(L-4) 0.18110713969993755 - and R(u) shows 0 of 200
        failures at every powered rung at both cells. THE FAVOURABLE BRANCH COULD HAVE
        FAILED, at about 15 percent on the reviewer's corrected estimate and about 18
        percent on the frozen one, and the dominant null failure mode is L-4 inconclusive
        rather than L-3 false departure by a factor of about 180.
      anti_tuning: >-
        ALL MECHANICAL CHECKS PASS. Ancestry ba1567ee -> 104d32fa -> 1026150f verified
        against Git; the tree at the contract freeze holds ONLY specification.yaml under
        experiments/EXP-LPF-001, not even the driver; the specification sha256 is
        unchanged; 28 of 28 band edges and 28 of 28 null_spread entries recompute exactly;
        12 of 12 branch condition and disposition strings are whitespace-identical in the
        same order. The strikes are contract-mandated in mandatory form, uniformly
        applied, and survive both movement readings.
      d9: >-
        THE WHOLE-LADDER STRIKE OF OBJ-PLANT-ROUGH / STAT-KS-DICK / BITS 20 IS RULED
        RIGHT AND NOT OVERCAUTIOUS. The seven-value sequence is confirmed to every digit
        and is unique in the 210 rows on the operative predicate; the shift SHRANK 46
        percent when gamma rose 2.5-fold, which is the canonical artifact tell; the cause
        is the max(D+, D-) argmax switch, so the statistic is not monotone in gamma on
        that ladder; and the strike costs nothing measurable because that ladder never
        reaches DET-LPF-1 detection at any rung.
      open_rr052_b_c_d: >-
        ALL THREE RULED AND ALL THREE RULINGS CARRIED INTO RR-LPF-2 UNCHANGED. B - "LIMB A
        rejects" in L-4 means a rejection by a CERTIFYING statistic, so a struck statistic
        cannot trigger L-4's third clause. C - the whole-ladder strike is correct. D - a
        STAT-KS-DICK band exit is non-directional because the statistic is max(D+, D-) by
        construction, direction under L-3 must be read from STAT-RATE-u, and the reviewer
        ADDS that the same argument bars reading directional AGREEMENT between cells from
        STAT-KS-DICK too.
      what_this_survival_list_is_not: >-
        IT IS NOT EVIDENCE ABOUT ANYTHING. Every item above is a statement about the
        apparatus and the archive. CAL-LPF-1 makes the calibration NON-EVIDENTIAL in
        either direction, and nothing in this list bears on H-LPF-001, HEUR-DS-1, the
        Semaev map or anything at cryptographic scale.

    the_distinction_from_pattern_instr_5:
      headline: >-
        BATCH-025 IS NOT A SIXTH INSTANCE OF PATTERN-INSTR-5 AND THE COUNT IS NOT
        INFLATED. PATTERN-INSTR-5's defect class is AN INSTRUMENT THAT CANNOT MEASURE WHAT
        IT CLAIMS. The BATCH-025 apparatus can. Duties 1 and 2 - attainability and
        anti-tuning - PASSED on an executed audit; the certifying set is non-empty at five
        statistic ids; no branch is unreachable by construction; the favourable branch is
        falsifiable at about 15 percent on a correct null; and both perturbation families
        were re-derived from source and confirmed not invariant in law.
      the_reviewers_own_words_recorded_because_they_are_load_bearing: >-
        "THE APPARATUS ITSELF IS THE FIRST IN THIS CAMPAIGN THAT SURVIVED AN EXECUTED
        ATTAINABILITY AND MOVEMENT AUDIT WITH ITS CERTIFYING SET NON-EMPTY, ITS FAVOURABLE
        BRANCH FALSIFIABLE AT ABOUT 15 PERCENT ON A CORRECT NULL, AND NO BRANCH
        UNREACHABLE BY CONSTRUCTION, AND THAT SHOULD BE RECORDED AS SUCH RATHER THAN LOST
        IN THE REVISE."
      the_new_and_distinct_defect_class: >-
        A CORRECT INSTRUMENT WITH AN OVERSTATED READING OF ITS OWN CALIBRATION. The
        defects are in one YAML file's DERIVED SUMMARIES and JUSTIFICATION TEXT - a
        hand-transcribed list where a generated one was required, and a structural
        argument asserted where a measurement was required. Neither is a property of the
        specification, the driver, the calibration, the objects or the mathematics. NAMING
        IT AS A NEW CLASS RATHER THAN FOLDING IT INTO THE OLD ONE IS THE HONEST MOVE, and
        it is why the count of PATTERN-INSTR-5 instruments stays at four across five
        batches with five distinct defect classes, exactly as DEC-20260801-010 recorded.
      the_consequence_for_the_knowledge_candidate: >-
        KN-CAND-BATCH024-A's promotion trigger (b) required a subsequent batch to build an
        instrument under the five disciplines and have it PASS independent review. BATCH-025
        did NOT pass. But it produced the FIRST PARTIAL NEGATIVE CASE - an instrument that
        passed the capability duties and failed on the transcription of its reading rule.
        That changes the candidate's status from "no negative case exists" to "a partial
        negative case exists" and it does not discharge the trigger. See
        knowledge_promotion.

  # ==================================================================
  # PART II - WHY BATCH-026 IS A SUPERSEDING READING RULE AND NOT A NEW EXPERIMENT
  # ==================================================================
  why_a_superseding_reading_rule_and_not_a_new_experiment_id:
    ruling: >-
      RR-LPF-2, A SUPERSEDING READING RULE UNDER THE UNCHANGED EXPERIMENT EXP-LPF-001, IN
      A NEW FILE experiments/EXP-LPF-001/reading_rule_v2.yaml. NO NEW EXPERIMENT ID.
      experiments/EXP-LPF-001/specification.yaml IS NOT EDITED, NOT AMENDED, NOT VERSIONED
      AND NOT RE-HASHED. experiments/EXP-LPF-001/reading_rule.yaml IS NOT EDITED EITHER -
      RR-LPF-1 KEEPS ITS PATH, ITS CONTENT AND ITS HASH, AND IS SUPERSEDED BY ADDITION.
    the_question_put_precisely: >-
      When EXP-LPF-001 superseded EXP-SMTH-001 a NEW EXPERIMENT ID WAS HELD MANDATORY. The
      question is whether the same reasoning forces a new id here, and the answer is no,
      for a reason that has to be stated rather than assumed.
    justification_against_the_immutability_rule: >-
      THE INDIVIDUATING UNIT IS THE FROZEN APPARATUS, AND THE FROZEN APPARATUS IS
      UNFAULTED. DEC-20260801-010 held that an experiment is individuated by its frozen
      apparatus as much as by its object, and that EXP-SMTH-001 needed a new id because
      ITS FATAL DEFECT LIVED INSIDE ITS FROZEN DECISION RULES - TAIL-DS-1, a rule
      unsatisfiable by a correct null, sitting in the hash-bound specification, where
      repairing it in place would have destroyed the only thing a freeze is for. THAT
      CONDITION IS ABSENT HERE AND THE ABSENCE WAS INDEPENDENTLY VERIFIED. The
      specification's sha256 is unchanged since ba1567ee; all twelve branch condition and
      disposition strings are whitespace-identical to it in the same order; all 28 band
      edges and 28 spreads recompute exactly from the named arrays; no statistic, rung,
      cut, band or branch was added, dropped, moved or reordered. NOT ONE OF THE
      REVIEWER'S FINDINGS NAMES A DEFECT IN THE SPECIFICATION. Both blocking defects and
      the RTB-054-6 omission are located in RR-LPF-1, which is by construction the
      SUBSTITUTION INSTRUMENT - the artifact whose whole function is to carry measured
      numbers into forms the specification already fixed. An error in a substitution is
      repaired by re-performing the substitution correctly under a new id, which is
      precisely what a superseding reading rule is.
    the_immutability_rule_is_satisfied_and_here_is_how: >-
      AGENTS.md rule 4 and CLAUDE.md rule 2 require that corrections SUPERSEDE and never
      overwrite. RR-LPF-1 is not edited, not moved, not deleted and not re-hashed; it
      remains at experiments/EXP-LPF-001/reading_rule.yaml with sha256
      8bcb196fa620503c736da307281325d17bb3dc8b0299407b24b584067c979f1d at commit
      1026150f10ed425901a83a2acf61338f5e892fd7, and the TASK-20260801-053 receipt that
      binds it stands. RR-LPF-2 is a NEW RECORD UNDER A NEW ID IN A NEW FILE that cites
      RR-LPF-1's hash, states exactly what it takes over and exactly what it changes, and
      states why. That is the same route EXP-LPF-001 took over EXP-SMTH-001, applied one
      level down at the level where the defect actually is.
    why_a_new_exp_id_would_be_positively_harmful_here: >-
      STATED BECAUSE THE CONSERVATIVE-LOOKING CHOICE IS NOT THE SAFE ONE. A new experiment
