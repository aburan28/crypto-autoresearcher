  id: DEC-20260804-298a73
  goal_id: GOAL-MLKEM-004
  batch_id: BATCH-1be68e
  batch_number: 5
  recorded_at: '2026-08-04'

  decision: expand
  target_ids: [GOAL-MLKEM-004]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.
  decision_label: >-
    Batch 5 produced new evidence that partially addresses OBJ-QEMU: QEMU
    state leakage across runs is ruled out (RC-3 ≈ 0), but the structural
    emulation artifact remains possible. The asymmetric ratio (correct < null)
    and the calibrated H1 prediction (r ≈ 0.317 vs observed 0.44, p=0.33)
    make H1 (environmental) more plausible than H2 (genuine sieve correlation).
    Batch 6 (final) runs gauss_sieve as a same-parameters discriminator: if
    ratio > 1 for a DIFFERENT sieve algorithm under the same QEMU conditions,
    the ratio inflation is algorithm-independent, strengthening the case for
    genuine sieve-vector correlation rather than bgj1-specific behavior.

  context: >-
    GOAL-MLKEM-004 BATCH-1be68e (batch 5 of 6). 50 paired runs in QEMU.
    Validator: accept_with_qualifications (5/5 checks pass). Red team:
    pass_with_constraints (OBJ-1 blocking — pre-registered thresholds not
    calibrated; OBJ-5 blocking — all QEMU-only; OBJ-6 blocking — RC-3
    computable from existing data). RC-3 computed by Coordinator after ledger:
    cross-run r ≈ 0 for all four tests (p > 0.25), ruling out QEMU JIT state
    leakage as the variance source. Snapshot 8b446af2.

  evidence_refs:
    - EV-MLKEM-bdbfba

  rationale: >-
    RC-3 is the most decisive result of batch 5: QEMU does not leak state
    across sequential sieve runs. This rules out one specific QEMU artifact
    mechanism (JIT state correlation). The remaining H1 mechanism is structural
    emulation difference: QEMU may produce intrinsically different-quality
    sieve vectors than native x86_64. The calibrated H1 prediction (r ≈ 0.317)
    is not significantly below the observed r = 0.44 (p = 0.33). If batch 6
    runs gauss_sieve and also shows ratio > 1 in QEMU, that is evidence against
    the bgj1-specific emulation hypothesis (since two different algorithms share
    no code paths that QEMU would emulate differently). If ratio_gauss ≈ 1.0,
    the inflation is bgj1-specific. Either outcome narrows the obstruction.

  what_survives:
    - >-
      RC-3 (cross-run r ≈ 0): QEMU JIT state does NOT correlate sequential
      sieve runs. The within-run r=0.44 is a genuine structural relationship
      on the same sieve vectors. This is the most important result of batch 5.
    - >-
      ratio_correct = 1.54 < ratio_null = 1.76 in batch-5 (asymmetric
      under the independence baseline). This asymmetry is inconsistent with
      symmetric H2 (genuine bgj1 sieve-vector correlation) and weakly
      consistent with H1 (quality variation).
    - >-
      Pre-registered H1 threshold of r ≥ 0.8 was never calibrated; calibrated
      H1 predicts r ≈ 0.317, and observed r = 0.44 is statistically consistent
      with it.

  hypothesis_status_changes: []

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No finding. Evidence is consistent with environmental H1 but does not
      rule out H2. The campaign closes on a named obstruction: native x86_64
      hardware unavailable in this session. Rule 12 UNMET and UNWAIVED.

  next_actions:
    - >-
      Open BATCH-e87ab3 (batch 6 of 6, FINAL). Run gauss_sieve with n=50
      runs on the same LWE instance in the same QEMU Docker environment as
      batch-5, using the same seed expression
      numpy.random.default_rng(20260804004).integers(0,2**32,size=50).tolist().
      Compute ratio_gauss = Var[T_N_gauss] / (N_gauss × Var[s_i_gauss]).
      Also compute RC-3 (cross-run r) for gauss_sieve. If ratio_gauss is
      also > 1.0 and RC-3 ≈ 0, the variance inflation is algorithm-independent
      within QEMU — evidence against bgj1-specific emulation artifact, toward
      genuine sieve-vector correlation. If ratio_gauss ≈ 1.0, the inflation
      is bgj1-specific. Either outcome is the campaign's final narrowest
      supported statement. Budget: max_runs: 60 (50 + 10 spare).

  decided_by: coordinator
  decided_at: '2026-08-04'

  inference_provenance:
    requested_policy: coordinator-archive
    resolved_model_id: amazon-bedrock/us.anthropic.claude-sonnet-4-6
    fallback_used: true
    model_verified: false
