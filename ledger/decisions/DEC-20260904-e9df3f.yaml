  claim_tier: toy
  scope_statement: >-
    Scoped to the m=4 symmetric-base distinct-split (Z=3) stratum, toy
    scale, curves with h_+=0 specifically (n_+, n_- and h_- vary; two
    curves tested, h_-=1 and h_-=3). Supports: the D-term's dependence on
    h_- is linear, both empirically (two discriminating confirmations)
    and mechanistically (an independently re-derived, structurally sound
    argument). Does NOT yet support: the h_+ term's own contribution or
    any h_+/h_- interaction (untested -- every curve so far has h_+=0);
    the non-split strata; any relation-rate, cost, exponent, or
    cryptographic-scale claim; any re-scoping of H-MONO-93bc4d.

  rationale:
    - >-
      A SOUND, INDEPENDENTLY RE-DERIVED MECHANISM CHANGES THE EPISTEMIC
      WEIGHT OF THE CONFIRMATION: this is not "two curves now happen to
      match a fitted curve" but "a structural argument, independently
      re-verified via two separate combinatorial methods by an adversarial
      reviewer working from the group law alone, predicts linearity, and
      the specific alternative that argument rules out was pre-registered,
      tested, and excluded." Per AGENTS.md rule 4 (claims scoped to what
      was tested) and the inventor protocol's own closure standard, a
      derivation independently re-verified this way is exactly the kind of
      result that earns "supported" rather than a weaker status.
    - >-
      H-MONO-d4c511 IS UPGRADED, ADDITIVELY, NOW THAT ITS OWN NAMED GAP IS
      CLOSED: DEC-20260904-46b71e explicitly left H-MONO-d4c511 at
      partially_supported because a single h_-=1 point could not
      discriminate the functional form. EXP-MONO-ee06e2 was designed and
      dispatched specifically to close that gap, and did so decisively.
      The additive status_note on H-MONO-d4c511 (below) records this
      chain explicitly rather than silently editing away the earlier,
      correctly-scoped partial status -- both records remain readable as
      an honest history of what was known when.
    - >-
      KNOWLEDGE PROMOTION IS WARRANTED, WITH THE SCOPE GAP DISCLOSED IN
      THE ENTRY ITSELF, NOT WITHHELD PENDING A FUTURE, MORE COMPLETE
      RESULT: this program's own promotion gates (docs/task-lifecycle.md /
      the coordinate-research-goal skill's promotion gates) ask for a
      decomposed derivation, named heuristics with validation, and
      independent xhigh review plus red-team -- all satisfied here, twice.
      Withholding promotion until the h_+ term is also tested would treat
      "not yet fully general" as equivalent to "not established", which
      overcorrects; KN-FIND-edd62c is written to promote exactly what is
      established (the h_-, h_+=0 slice) and names the gap explicitly
      rather than either overclaiming the full bivariate form or
      under-promoting a genuine, well-verified result.
    - >-
      THE RED TEAM'S OWN DISCRETIONARY FINDING (a concrete h_+=1, h_-=1
      curve at p=103, A=1, B=11, found unprompted, in the very next prime
      after the declared range's start) IS ACCEPTED AND ACTED ON
      DIRECTLY, exactly as this lane's own established practice has done
      for every prior red-team-found lead this session (see next_action).

  next_action: >-
    HIGH PRIORITY: design and dispatch a follow-up experiment testing the
    closed form's FULL bivariate prediction (both h_+ and h_- nonzero
    simultaneously) on the curve p=103, A=1, B=11 (h_+=1, h_-=1, per Red
    Team's own finding, to be independently re-verified by that
    experiment's own Stage 0, not assumed) -- this is the first test of
    any h_+/h_- interaction and the natural completion of this sub-thread
    before any claim about the FULL closed form (as opposed to its h_-,
    h_+=0 slice, already promoted) is made. Gets its own new hypothesis ID.

  knowledge_promotion:
    promoted:
      - KN-FIND-edd62c
    not_warranted: null

  procedure_deviations:
