      Two curves, one prime (p=101), both with h_+=0. No claim about the
      h_+ term or joint h_+/h_- behavior; see next_action.
    - >-
      Toy scale only (largest prime tested: 101). No cryptographic-scale
      claim.
    - >-
      Does not re-scope H-MONO-93bc4d's own already-closed collision-rate
      formula, named but explicitly deferred.

