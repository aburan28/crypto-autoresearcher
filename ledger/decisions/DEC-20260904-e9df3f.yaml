  hypothesis_status_after_note: >-
    H-MONO-fa4cb9's own two-sided prediction resolves cleanly to outcome
    (I): on the found h_-=3 curve, the linear closed form matches the
    exhaustive census exactly (R1_lin=R2_lin=0, plus the un-required
    #2+2 check also matching) while the named quadratic rival is
    decisively excluded (R1_quad=-312, R2_quad=936). Independently
    reproduced by the Validator from scratch, with the search's freedom
    from hard-coding independently confirmed by the Red Team. Status:
    supported (not partially_supported) -- this hypothesis's own narrow
    claim (does the linear form survive discrimination against a named
    rival on an h_->=2 curve) is unambiguously resolved, cleanly, with no
    remaining scope gap of the kind H-MONO-d4c511 was left with.

