    EV-MONO-fae201 for the full evidentiary summary.
  decision: revise
  decision_label: >-
    linear_d_term_confirmed_at_two_independent_h_minus_values_quadratic_rival_excluded_mechanism_independently_rederived_and_confirmed_sound_h_plus_term_and_cross_interaction_remain_untested_knowledge_promoted_with_disclosed_scope
