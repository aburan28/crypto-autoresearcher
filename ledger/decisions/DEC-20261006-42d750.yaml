    The contract freezes p=23, the curve y^2=x^3+x+1, ell=7, and the
    twist by the smallest nonsquare. Success is the source idea's
    prediction that the absolute difference of the multiplicity-weighted
    factor counts is at least 1. The concrete negative is that the
    instrument checks pass and the counts are equal. No psi_7 was
    factored in this session. A degree check on the same curve returned
    degree 24 and leading coefficient 7 before the monic scaling. That
    check is not a value of the gap.

    python3 tools/portfolio_kpis.py --capacity area:TORS reported
    approved_unrun=6 against a cap of 3. The same command for
    GOAL-ENDO-001 reported approved_unrun=1 and headroom=2. The
    question is one of that goal's question_ids, so the contract sets
    goal_id GOAL-ENDO-001 and is counted there.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, decision_impact, and required artifacts are all
    non-null. Success fails when the counts are equal under the
    stated instrument conditions, and it is also not confirmed when
    an instrument check fails.     The driver and the trial plan are in
    the experiment directory. This decision does not launch them.
    The same pass files IDEA-20261006-24268f, IDEA-20261006-42b03f,
    and IDEA-20261006-2a1db1 and does not design them.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - Equal counts, with the instrument checks passed, are reachable as a recorded outcome, so success is not automatic.
    - The c=1 count, the degree 24 check, the nonzero discriminants, the trace negation, the nonsquare test, and the second build are the instrument controls.
    - An instrument failure is not relabeled as a zero gap, and the p=29 gap does not choose the reading row.
    - This session did not factor psi_7 and did not claim that an exponent moves.
    - GOAL-ENDO-001 had approval headroom. The contract names that goal.

  evidence_refs: []
  limitations:
    - The measurement covers one twist pair at p=23. It does not transfer to a larger field.
    - A nonzero gap does not lower the generic exponent 1/2 and does not recover a discrete logarithm.
    - A degree failure, a zero discriminant, a c=1 mismatch, and a trace mismatch are not the negative.
    - An instrument failure is not a value of the gap.
    - A timeout is failed_infrastructure and is not a mathematical negative.
    - The p=29 gap and the 30-polynomial null range are recorded beside the gap and do not choose the reading row.
    - This decision authorizes a later execution. It does not start one.
    - This decision does not edit a goal head.
    - The three new proposals are not hypotheses and are not approved experiments.

