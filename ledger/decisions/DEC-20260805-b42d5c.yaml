coordinator_decision:
  id: DEC-20260805-b42d5c
  context: >-
    GOAL-AES-003 BATCH-014 close. RC-D (DEC-20260805-f2086a rank 1, carried
    forward unrun since BATCH-010) built a keyed, deterministic, fixed-16-round
    Feistel PRP -- independently confirmed to share no vocabulary with AES's
    actual operations or with any prior null-object instrument in this
    campaign -- and reran BATCH-009's matched-exposure comparison against it
    at 2^30 and 2^33 trials. The package was bound by a dispatcher-verified
    snapshot archive at commit 74922012ff34086e7b177cffcb809eaeaa548602
    (TASK-20260805-051ba3) and reviewed by one independent validator
    (TASK-20260805-063dbf), verdict passed, zero defects found.
  decision: extend_control_close_rank
  target_ids: [RQ-AES-003, GOAL-AES-003, EV-AES-dec938]

  rationale:
    - >-
      RESIDUAL LIMITATION U4 IS NARROWED, NOT RESOLVED, AND THE DIRECTION OF
      THE NARROWING IS AWAY FROM IDEALNESS BEING THE OPERATIVE FACTOR. Both
      arms read OUTCOME-A': M1 (matched exposure, 2^30) read 0 hits against
      the frozen r5 comparator's 14 (p=0.00012207031250000008); M2 (8x
      exposure, 2^33) read 9 hits, tracking its own ~8-event analytic null
      (rate ratio 1.125, 95% CI [0.51, 2.14], containing 1) and far below the
      ~112 hits an AES-level rate scaled to 8x exposure would predict
      (exposure-weighted test against r5: p=1.336455492547555e-08). This is
      the second null-object construction in this campaign (after BATCH-009's
      ideal permutation) under which the excess fails to reappear -- now also
      under a substitute that is emphatically NOT ideal, only non-AES and
      deterministic.
    - >-
      THE TWO PROPERTIES THIS CONTROL'S VALIDITY DEPENDS ON WERE VERIFIED BY
      DIRECT CODE READ, NOT ASSERTION, AND THIS DECISION ADOPTS THE
      VALIDATOR'S INDEPENDENT CONFIRMATION RATHER THAN THE PRODUCER'S OWN
      CLAIM ALONE. Independence from AES's actual S-box/MixColumns/ShiftRows
      and from every prior null-object instrument in this campaign was
      confirmed by a fresh grep against the actual cited source files (not
      the producer's own transcript). Determinism (not resampled per trial --
      the single property that distinguishes a structuredness test from
      another idealness test) was confirmed both by code-path tracing and by
      the mechanical detcheck gate that ran before any measurement arm.
    - >-
      THE VALIDATOR CAUGHT AND CONFIRMED CORRECT THE ONE PLACE THIS ANALYSIS
      WAS MOST LIKELY TO GO WRONG. M2's comparison against r5 requires an
      EXPOSURE-WEIGHTED null probability (p0=1/9, not the naive p0=0.5),
      since M2's 2^33 trials is 8x r5's 2^30. The task card flagged this in
      advance as the easy place to get wrong; the validator independently
      rederived the correct null model from first principles and confirmed
      the producer's p0 and resulting statistics, including the CI, matched
      to reported precision.
    - >-
      STRENGTH IS SET TO MODERATE, MATCHING THE CAMPAIGN'S OWN PRECEDENT FOR
      CLEAN NULL-OBJECT EXCLUSIONS (EV-AES-e4c091, EV-AES-acddd0), NOT
      HIGHER. This is one fixed 16-round construction at one key; no decay
      check (varying the round count) and no second key/seed were run, so
      the finding establishes absence for this one instance, not for the
      class of "sufficiently non-AES deterministic PRPs" as a varied
      parameter. Both the producer and the validator name this scope
      explicitly.

  evidence_refs:
    - EV-AES-dec938

  what_this_decision_does_not_do:
    - >-
      It does not resolve U4; it narrows it by one additional data point on
      one fixed construction. A decay check across Feistel round counts, or
      a second key/seed, would be needed to generalize this finding beyond
      the single instance tested here.
    - >-
      It does not resolve the cipher-substitution mechanism's lack of
      independent-instrument corroboration at a decisive exposure
      (EV-AES-837cd8 unresolved_confounds, unchanged by this record).
    - >-
      It does not advance any closure criterion; no model independence
      exists under standing basis 0137a051eb5828789eb267fa83c8278086578d4c,
      so nothing here counts toward a goal-closure quorum.
    - >-
      It does not make, and nothing in it may be transcribed as, any
      statement about full-round or deployed AES, or any comparison to
      published cryptanalysis in either direction.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED. This is a single null-object control result, consistent
      in shape and strength with the campaign's own prior two exclusions
      (EV-AES-e4c091, EV-AES-acddd0) rather than a new technique or a durable
      methodological pattern on its own. The construction-independence-plus-
      determinism verification discipline this batch and its validator
      applied is a candidate technique, but it is the same discipline
      BATCH-011/BATCH-012 already applied to their own instruments -- a third
      demonstrated instance, not a first one, so it does not clear this
      campaign's own bar (one demonstrated instance is premature to promote)
      a second time either; it would be double-counting an already-noted
      pattern rather than a new candidate.

  next_actions:
    - >-
      SINGLE NEXT ACTION: GOAL-AES-003 BATCH-015, rank 1 = the O(1)-memory-
      per-query ideal-permutation construction for the cipher-substitution
      comparison (DEC-20260805-0041a6 rank 2, explicitly deferred rather than
      ranked at the time, "until rank 1 is exhausted or a specific reason
      emerges to prioritize it sooner" -- rank 1, RC-D, is now exhausted with
      this batch's close, so this item is PROMOTED to rank 1 rather than
      remaining deferred). BATCH-012 established arithmetically that the
      pair-storage architecture (perm128, used by rc8probe_ideal.c) cannot
      reach 2^26 within any plausible memory budget; reaching a decisive
      exposure (order 2^30, where ~14 events would be expected under
      BATCH-009's measured rate) for the cipher-substitution comparison
      specifically requires a genuinely different construction -- a Feistel
      or Thorp-shuffle-style keyed permutation evaluated directly rather than
      stored in a pair table. THIS BATCH'S OWN rc8probe_feistel.c IS NOT THAT
      CONSTRUCTION AND MUST NOT BE REUSED FOR IT UNMODIFIED: it is
      deterministic and non-ideal by design (the entire point of RC-D was
      that it NOT approximate an ideal permutation), so BATCH-015 needs a
      construction that DOES approximate an ideal random permutation (e.g. a
      Thorp shuffle, or a Feistel network with enough rounds and a
      cryptographically strong round function to be indistinguishable from
      ideal at the exposures tested) while still costing O(1) memory per
      query, unlike perm128's pair-storage table. NAMED BUT NOT RANKED AHEAD
      OF THIS: RC-D's own two disclosed gaps (a decay check varying Feistel
      round count; a second key/seed) are real, cheap follow-ons available
      whenever capacity allows, but the cipher-substitution mechanism
      (BATCH-009's central, still-uncorroborated-by-independent-instrument
      claim) is the more consequential open question per BATCH-010's own
      red-team synthesis, so it is ranked first.

  budget_accounting:
    producer_declared_seconds: 5400
    producer_consumed_seconds: 1508
    note: >-
      From budget_stamps.jsonl in TASK-20260805-b95720's task folder: start
      event declares wall_clock_seconds=5400; the task's own accounting
      (independently cross-checked against runs/*.timing.txt) shows 1508s
      actually consumed across construction, independence audit, and both
      measurement arms (M1: 101.9s, M2: 806.9s, plus calibration/audit
      overhead). Well inside budget despite this being real new-instrument
      engineering, not a recomputation.

  limitations:
    - >-
      Toy tier only; one probe geometry (r=5, amask=1, smask=1), one 16-round
      Feistel construction, one key, one machine, trials up to 2^33.
    - >-
      Session and implementation independence only. NO MODEL INDEPENDENCE
      under standing basis 0137a051eb5828789eb267fa83c8278086578d4c; nothing
      here counts toward a closure quorum.
    - No red team reviewed this batch.
    - >-
      U4 is narrowed, not resolved: no decay check across Feistel round
      counts and no second key/seed were run within this batch.
    - >-
      The cipher-substitution mechanism remains uncorroborated by any
      independent instrument at a decisive exposure, unchanged by this
      batch.

  decided_by: coordinator
  decided_at: 2026-08-05

  inference:
    policy: coordinator-orchestration-code
    requested_policy: coordinator-orchestration-code
    resolved_model: claude-sonnet-5
    fallback_used: true
    model_verified: false
    standing_basis: 0137a051eb5828789eb267fa83c8278086578d4c
