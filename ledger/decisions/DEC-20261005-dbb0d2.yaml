  rationale:
    - >-
      J1 holds only as conditional finite-level uniqueness: identical full
      E[N] action and N^2>4D force equality of degree-D maps under the declared
      square-root-degree norm premise. The admissible id/-id collision at
      N=2,D=1 preserves the strict-bound control. This is not a recovery,
      plaintext, or security result; removing the conditioning still requires
      the positive-definite degree-form/norm proof.
    - >-
      J2 is inconclusive. A recovered map or kernel yields a plaintext only
      through typed realization, parsing, extraction, validation, message
      separation, and a proved left inverse. When RecoverHom and the decoder
      are public, their composition cannot establish a recipient-only
      advantage.
    - >-
      J3 breaks for the all-routes proposition because Route A maps distinct
      messages to one endpoint and returns bottom. Route B has public
      syntax/correctness but its fixed-rank decoder is public. Route C has a
      finite actual-message decoder, but its proposed efficient
      EndRing-to-evaluated-Hom operation is absent.
    - >-
      J4 breaks for the exact A/B/C definitions. In Route C, the unchanged
      public full smooth torsion action admits the source-checked Robert
      map-to-message route without End(E) under the audited rationality,
      smoothness, basis, factorization, rank, and model conditions. Its cost is
      polynomial only in represented-field arithmetic; field-extension degree,
      encodings, preprocessing, large fixed-dimension constants, and K0 remain
      separately chargeable or unresolved.
    - >-
      J5 remains inconclusive. Concrete Robert, FESTA, POKE, PIKE, Maino,
      SiGamal/C-SiGamal, SÉTA, and LIT-SiGamal boundaries were independently
      checked, but unidentified-UPKE-comparison and
      unspecified-ideal-action-comparison remain source impediments. No
      complete novelty comparison follows.
    - >-
      Route C is retained only as the strongest scaffold. A successor must
      replace its public full-action ciphertext with a typed public projection
      and supply an explicit ring-derived SecretLift that is unavailable from
      the public interface. Until that definition passes the cheap symbolic
      gates, hypothesis promotion, implementation, experiments, and
      EndRing-based security wording are unwarranted.
