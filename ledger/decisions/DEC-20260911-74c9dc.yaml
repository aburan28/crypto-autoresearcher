coordinator_decision:
  id: DEC-20260911-74c9dc
  context: >-
    /review-evidence for EXP-ECDLP-a26bde (TASK-20260911-6bf4f9): deciding
    H-ECDLP-6a9479's four claims (the formal-group digit identity, the m^2
    size law, the Teichmuller non-homomorphic contrast, and the leak/break
    demonstration) after independent blind rederivation (by the dispatching
    session, per the handoff's review_plan) and this dispatch's own
    verification of run validity, certificate discipline, and a mechanistic
    explanation for the one anomalous finding (curve 2 at m=2), recorded in
    experiments/EXP-ECDLP-a26bde/analysis.md.
  decision: support
  target_ids: [H-ECDLP-6a9479, EXP-ECDLP-a26bde, EV-ECDLP-95ec68]
  rationale:
    - >-
      A. Claims (1), (2), and both halves of claim (4) are supported at
      strength `strong`: 1360/1360 exact digit-identity agreements across 20
      instances, independently re-derived by a blind pass using code that
      does not import the driver's own aggregation logic (zero mismatches);
      per-instance size-law slopes in [1.9983,1.9999], independently
      refit to ~1e-14 agreement, all inside the pre-registered 2.00+-0.05
      band; 277/277 independently re-verified leak certificates against
      [m]S=T via harness.toycurve.EllipticCurve.mul (0 failures), with 683
      companion pairs skipped under a pre-declared, budget-driven
      infeasibility cap whose combinatorics this dispatch reconciled exactly
      (12 m-samples x 4 non-negative-producing j-values x 20 instances =
      960 = 277+683, given m < n throughout this ladder); and the anomalous
      curve refusing at exactly the predicted step (division by n inside
      E_1), matched by self-check 5's 24/24-certified positive control.
      This is `support`, not `replicate`, because these are exact algebraic
      identities and certificate-checked recoveries, not statistical
      effects needing independent confirmation to trust the sign of the
      result -- but see limitation C on toy-scale scope.
    - >-
      B. Claim (3) is deliberately carved OUT of this `support` and is not
      folded into it. The pooled 24/1360 statistic conflates a mathematical
      tautology (m=1: stage23.py computes u_S and the m=1 loop iteration's
      u_mS via the byte-identical function call on byte-identical
      arguments -- the same computation invoked twice, confirmed by direct
      reading of stage23.py, not an independent trial) with genuine trials.
      The corrected, non-tautological count (4/1340, all four in curve 2 at
      m=2 across its four primes) is fully explained, not merely observed:
      curve 2's point S^=(1,6) on y^2=x^3+9x+26 has doubling slope
      lambda=(3*1+9)/(2*6)=1 exactly, giving 2S^=(-1,-4) exactly over Q;
      x=1 and x=-1 are the only rational integers that are (p-1)-th roots
      of unity for every odd prime, so instrument.py's Teichmuller lift and
      paired Hensel-y lift return them with zero p-adic correction at every
      precision, making the "canonical Teichmuller section" coincide
      exactly with the true global-lift reduction at m=1 and m=2 on this
      one curve -- confirmed three ways in the raw data (numerator-bit-
      length, exact digit coincidence restricted to m=1/2, identical
      recurrence across all four of curve 2's primes as a single global
      rational coincidence rather than four independent per-prime
      accidents). This neither confirms nor contradicts uniqueness of the
      homomorphic section (KN-TECH-73630e); it identifies a
      measurement-instrument blind spot in this specific test. Separately,
      and independent of this finding, the pre-registered 3/p falsification
      threshold is uncalibrated to the ladder's 68-sample resolution (the
      coarsest measurable nonzero rate, 1/68, already exceeds 3/p at every
      tested prime), so claim (3) as specified could not have discriminated
      the intended hypothesis regardless of outcome. Per AGENTS.md/the
      review-evidence discipline ("surprising or high-impact results get
      replicate, not support, on first observation"), and per this task's
      own framing, claim (3)'s disposition is `refine`: the test design
      (exclude the tautological m=1 entry from any agreement statistic; use
      a resolution-matched threshold; and either exclude multiples whose
      x-coordinate reduces to a universal root of unity or use a contrast
      section without this specific degeneracy) needs a protocol amendment
      before a re-run's result can be read as evidence either way.
    - >-
      C. Run validity and certificate discipline hold across the 22
      official runs: all 22 manifests read status: completed_valid
      (confirmed directly, not only via the dispatching session's report,
      by Grep across all 22 manifest.yaml files: 44/44 expected matches);
      the leak arm's 683 skips are all tagged
      infeasible_estimated_bits_exceeds_cap, a budget decision fixed before
      the run per derivation_note.md section E; certificates use kind:
      none at the manifest level with the per-pair certification itemized
      in raw-result.json, matching docs/claims-and-verification.md's
      pattern for batch/measurement runs; and no run's certificate was
      accepted without independent re-verification (leak-arm pairs via
      harness.toycurve.EllipticCurve.mul; self-check 5's positive control
      likewise). A stray, differently-named artifact (RUN-ECDLP-a26bde-1,
      distinct git commit, self-check C recorded as failed yet marked
      completed_valid) exists under the experiment's runs/ directory but is
      not one of the 22 official runs and is excluded from
      EV-ECDLP-95ec68.run_ids; flagged as a data-hygiene item in
      next_actions rather than folded into this decision's evidence base.
    - >-
      D. Claim tier and scope discipline: toy throughout (5 curves, 20
      primes, m to 256); no attack, no exponent claim anywhere in this
      record or its citations, consistent with H-ECDLP-6a9479's explicit
      "NO ATTACK, NO EXPONENT MOVED" and the leak arm's status as a
      demonstration, never a recovery result.
  evidence_refs: [EV-ECDLP-95ec68]
  limitations:
    - "Toy tier; 5 curves, 20 primes, one anomalous object; no transfer to cryptographic scale is claimed or implied."
    - "Claim (3) is not decided by this evidence: neither supported nor rejected, pending a protocol amendment to EXP-ECDLP-a26bde (or a successor experiment) that removes the m=1 tautology from the statistic, uses a resolution-matched falsification threshold, and controls for the unit-x-coordinate degeneracy identified above."
    - "The curve-2/m=2 explanation is a derivation cross-checked against committed raw data by a dispatch with no Bash/Python execution tool, not a re-executed numerical confirmation; it is elementary and independently checkable by any reader, but an actual re-run confirming it numerically is still open."
    - "The leak arm consumes the scalar to build the lift it reads; it is a demonstration of the digit-identity mechanism, never an attack or recovery result."
  next_actions:
    - >-
      Design a small, targeted follow-up experiment on curve 2 specifically
      to close the open confound named above: (a) numerically confirm
      2S^=(-1,-4) and that s(2S) as computed by instrument.teichmuller_section
      equals the exact reduction of that point at several precisions and
      primes; (b) scan a denser or larger m-ladder on curve 2 (and a fresh
      curve deliberately constructed to have a doubling slope of 1, as a
      positive control for the mechanism) to confirm no other multiple in a
      wider range reduces to x=+-1, and that the Teichmuller contrast
      agrees exactly there too if it does; (c) construct a differently
      realized non-homomorphic contrast section (e.g. Hensel-lifting both
      coordinates from a residue that is provably never a universal root of
      unity, or using non_canonical_section already in instrument.py, which
      derivation_note.md's Naming defect note records as measuring 100%
      homomorphic for an unrelated reason and would need its own scrutiny
      before reuse) to test claim (3) without this specific instrument
      blind spot.
    - >-
      Protocol-amend EXP-ECDLP-a26bde's claim-3 test design (exclude m=1
      from the agreement statistic; replace the flat 3/p falsification
      threshold with one resolution-matched to the tested ladder size, e.g.
      a binomial confidence interval on the corrected rate) before any
      future run of this experiment is used to decide claim (3).
    - "Administrative: review the stray RUN-ECDLP-a26bde-1 artifact under experiments/EXP-ECDLP-a26bde/runs/ (distinct commit, self-check C recorded as failed yet marked completed_valid) for a data-hygiene correction; it is not evidence and was not used in EV-ECDLP-95ec68, but its presence under the same experiment ID as the official 22-run package is a namespace/validity hazard for future readers."
    - "Wire the KN-FIND-* id (once minted by the top-level session, which mints IDs for this dispatch since it has no allocate_id/Bash tool) into this decision's knowledge_promotion.promoted field before the ledger archive commit."
  knowledge_promotion:
    promoted: [KN-FIND-85845f]
    not_warranted: null
  decided_by: coordinator
  decided_at: '2026-09-11'
