  context: >-
    One cycle of design-experiment plus propose-ideas.
    IDEA-20261006-79bd0d is on origin/design/volc-b4c2bf-root and is
    not on origin/main. The question is RQ-JINV-8fc13a. No hypothesis
    or experiment on origin/main cites that full idea id. The branch
    design/jinv-79bd0d was created from origin/main at
    1d5aa96e52a8642a96148b20105f5199d6136502. The copied proposal
    bytes are blob 5d2841d26d3e108bb75267bd38ee0bf53065194f and parsed
    as YAML without a quote change. The prediction is that the
    scaling-automorphism counts on y^2 = x^3 + 1 and
    y^2 = x^3 + x + 1 over F_13 are exactly 6 and exactly 2.

    A run-aware count on origin/main, using the first top-level
    status and goal_id in each specification together with git
    ls-tree of experiments/*/runs and ignoring .gitkeep, gives
    GOAL-ENDO-001 approved_unrun=10, cap=3, headroom=0. The ten
    contracts are EXP-CANL-96b0ad, EXP-ICINV-4d33aa,
    EXP-ICINV-e0cd8f, EXP-ICINV-fcb497, EXP-INSTR-36c8cf,
    EXP-INSTR-85b102, EXP-JINV-bd141d, EXP-TORS-77e641,
    EXP-VOLC-3fee23, and EXP-VOLC-9f5571. This decision does not
    name them under supersedes_experiments or withdraws_experiments.
    check_approval_capacity is the check that would reject an
    approving decision. The working tree omits experiment run trees,
    so portfolio_kpis.py --capacity on that tree is not the figure
    used here.

    The missing driver is a program that enumerates u in F_13-star,
    applies A u^4 = A and B u^6 = B, counts distinct pairs
    (u^2, u^3) on both models, and records j and the traces. A
    search of origin/main for the phrases "scaling automorphism" and
    "u^6 = 1" under *.py and *.sage returned no path. There is no
    trial-plan.json. The only file under runs/ is .gitkeep.

    Success is the source idea's prediction. The concrete negative
    is a generic count of 3 or more, or a j = 0 count other than 6,
    with the identity, negation, j, and ordinary checks passed. No
    u was scored in this session. The same pass files
    IDEA-20261007-ee731f, IDEA-20261007-9fe905, and
    IDEA-20261007-d94783 and does not design them. Proposals on
    origin/main and the idea files on pull requests 1970 and 1969
    were read before those three claims were written. The
    idea-generator was not dispatched. The coordinator wrote the
    three records in this pass.

  rationale:
    - The standing authorization covers a complete runnable protocol. This one is over the approval cap and has no scaling-automorphism counter, so it is not approved.
    - check_approval_capacity would reject an approving decision. GOAL-ENDO-001 has approved_unrun=10 against cap 3. This decision names that check and does not force approved.
    - The missing driver is the F_13 scan of distinct pairs (u^2, u^3) on y^2 = x^3 + 1 and y^2 = x^3 + x + 1, including the identity and negation checks. No program on origin/main evaluates that pair of counts.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - A generic count of 3 or more, or a j = 0 count other than 6, with the checks passed, is reachable as a recorded outcome, so success is not automatic.
    - The identity, the negation on E_gen, the j-invariant of E_gen, and the ordinary nonsingular check are the controls.
    - A missing identity is not relabeled as a count other than 6 or 2.
    - This session did not score a u and did not claim that the exponent 1/2 moves.
    - No run id was minted. The replication plan does not name a future run slot while the trial plan is unfrozen.

  evidence_refs: []
  limitations:
    - The measurement, once run, covers p = 13 only. It does not transfer to another prime or to cryptographic size.
    - Counts 6 and 2 do not lower the generic-group exponent.
    - A missing identity and a crash are not the negative.
    - This decision does not authorize execution.
    - This decision does not edit a goal head.
    - The three new proposals are not hypotheses and are not approved experiments.

  next_actions:
    - A later session may approve EXP-JINV-dfebe7 only after check_approval_capacity accepts the goal and a scaling-automorphism counter exists with a frozen trial plan. Both were absent on 2026-10-07.
    - Do not dispatch TASK-20261007-2af192 from the design session that wrote this decision.

