  what_is_not_decided:
    note: >-
      Recorded as explicitly as what IS decided, because three consecutive batches have
      produced instrument outcomes and the temptation to convert one into an answer
      grows each time.
    items:
    - >-
      WHETHER ANY AM-4-ADMISSIBLE AND RELEVANT OBSERVABLE EXISTS: INCONCLUSIVE. The gate
      that was to decide it admits a parameter-determined null with zero dispersion and
      refuses two lattice invariants for failing to depend on a readout-window parameter
      they do not take as an argument. R2 and R2' were never reached, so no "no
      admissible predicate exists" claim exists at any scope. Both of the prereg's own
      forward repairs -- weaken AM-4 to {T2, T3}, or restate the question in
      isometry-invariant terms as a DIFFERENT question -- remain open and untried.
    - >-
      WHETHER THE AM-3 GATE HAS USABLE POWER AGAINST A REAL VIOLATION: INCONCLUSIVE,
      for the second time and by a second route. Undemonstrated, never disproved. AM-3
      is NOT retired; its 0.096 family-wise false-failure bound stands, correctly
      derived and declared before any datum.
    - >-
      WHETHER D DEPENDS ON THE FRAME ONLY THROUGH V AT THE 2^-10 QUANTILE: OPEN IN BOTH
      DIRECTIONS, unchanged. Neither "falsified" nor "consistent" is a result of this
      program. The second-order identity
      Var(e^T P e) = 2*beta + (mu_4 - 3)(V + beta^2/d) is correct and untouched.
    - >-
      WHETHER hkz OR ANY NON-f(P) CANDIDATE CARRIES BLOCK-ATTRIBUTION CONTENT: NOT
      DECIDED. One mirrored pair at one d was replicated by one reviewer and found
      indistinguishable from zero; four mirrored pairs were replicated by nobody.
    - >-
      WHETHER AM4-OBS-1's PREMISE FAILS FOR D IN GENERAL: NOT DECIDED. Refuted at two
      cells in one run, one of them at only 1.29x its floor, by a single frozen probe
      construction, single-source.
    - >-
      BATCH-a44d08 IS NOT RESCORED IN ANY RESPECT. Its INADMISSIBLE verdict stands, its
      four PARTIAL cell readings stay WITHHELD, and its Section C verdict and detection
      floors remain VOID IN BOTH DIRECTIONS.
    - >-
      NOTHING HERE BEARS ON ML-KEM, FIPS 203, ANY ATTACK COST OR ANY COST MODEL, and no
      goal completion criterion is claimed met by this decision. C1 is UNTOUCHED, C2
      remains MET from BATCH-a51f91, C3 is STILL UNMET AND STILL MEETABLE.

  amendment_disposition:
    supersedes: DEC-20260806-607779
    scope_note: >-
      AM-1's grid, AM-3's gate and its 0.096 bound, AM-4's transform triple, AM-5,
      AM-6's clauses, AM-7's clauses and AM-8's pre-registration escalation are all
      RETAINED. AM-9's k convention is retained. What is amended is the SPECIFICATION OF
      THE CRITERIA AND CONTROLS those amendments are implemented with. Nothing in
      DEC-20260806-607779, DEC-20260806-14ac13, DEC-20260806-00deff or
      DEC-20260805-4823db is otherwise disturbed.
    AM-10:
      title: A relevance or sensitivity criterion is not a criterion without replication,
        a stated normalization, and a positive control.
      requirement: >-
        Any G-REL-class or G-Q-class criterion in this goal MUST (a) be evaluated over
        ALL frozen bases with the between-basis mean, sd and a paired test reported per
        candidate and per cell -- not at one basis index; (b) be reported at BOTH
        normalizations, max(|X|, s_X) and |X|, with the ratio s_X/|X| printed so a
        reader can see when the scale floor is the binding term; and (c) carry at least
        one declared candidate that MUST PASS it, so the criterion has a could-not-PASS
        guard of its own. A criterion satisfying none of these cannot decide an outcome.
      grounds: Red Team RT-A2, RT-A4, RT-A5, RC-1, RC-2; Validator claim (a) and (i).
      consequence_for_the_record: >-
        BATCH-cbe023's R1/R3 boundary is NOT CITABLE as a fact about lattices. The R3
        label for hkz survives one reviewer's replication at one mirrored pair; the
        REASON the producer gave for it does not.
    AM-11:
      title: An admissibility gate that admits a parameter-determined observable is
        inadmissible. Add G-VAR.
      requirement: >-
        Every admissibility gate in this goal MUST include a DISPERSION criterion:
        an admissible observable must have non-zero dispersion across the frozen bases
        at fixed (d, k, beta, q). Equivalently, any closed-form function of
        (d, k, beta, q) with zero between-basis variance MUST be refused, and a gate
        that admits one is declared INADMISSIBLE and no admissibility claim may be
        reported from it. X7 = tr(P^2) CANNOT serve as this control: it is q-independent
        and k-independent, so it tests only whether the gate refuses a CONSTANT, not
        whether it refuses PARAMETER ARITHMETIC. The parameter-determined null must be
        on the frozen candidate list, scored through the identical code path.
      grounds: Red Team RT-A1, RT-A8, RC-3; the built counterexample X_null reaching R1.
    AM-12:
      title: An outcome map must have a row for every outcome, and a conditional
        exclusion must carry the branch where its condition fails.
      requirement: >-
        (a) A collision- or premise-refutation clause MUST trigger on ANY candidate whose
        residual exceeds ITS OWN measured floor, with that floor reported per candidate --
        never on a fixed sub-list. (b) A clause whose trigger list contains only
        candidates for which the tested premise holds BY ALGEBRA is dead by construction
        and may not be declared as a guard. (c) Any exclusion made CONDITIONAL on a
        measured outcome must carry an explicit outcome row for the branch in which the
        condition fails; otherwise a real result lands in prose and not in the outcome
        field, which is what happened to the refutation of AM4-OBS-1's premise for D.
      grounds: Validator F-4; Red Team RT-A6, RT-A7.
    AM-13:
      title: Every headline count is quoted against the same count on a null object of
        the same shape.
      requirement: >-
        No count-style headline may be reported in this goal without the identical count
        computed on a NULL OBJECT of the same shape, printed in the same sentence, and
        without checking that the count DECAYS as the parameter meant to destroy the
        effect is applied. A quantity that fails to decay is an artifact
        (docs/inventor-protocol.md section 3). Two injections of the same family are not
        a null object. For Section B specifically the required control is the NULL
        FAMILY: regenerate the 13 grid points as 13 independent Haar frames from the
        carried seeds so E[Delta_i] = 0 at every step -- pure numpy, no BKZ, no LLL, no
        reduction -- and report n_fire(c=6) on it beside the real count. Additionally, a
        prediction whose falsifier is empty conditional on a bit-exact reproduction
        check is not a prediction and must be labelled a CONSISTENCY CHECK.
      grounds: Red Team RT-B1, RT-B2, RT-B3, RC-4; Validator finding (g).
    AM-14:
      title: A verdict must be sensitive to the quantity the section exists to repair,
        and a positive control must actually inject.
      requirement: >-
        (a) Before scoring, a section MUST state in its pre-registration which frozen
        clause is LOAD-BEARING for each possible verdict, and must verify that the
        verdict is not invariant to the quantity under repair. A verdict determined
        entirely by a threshold the section did not rebuild may not be reported as the
        section's result. (b) A positive control MUST perform the injection and re-run
        the full scoring path; closed-form arithmetic in the SE it is meant to validate
        cannot detect SE inflation and is not a control. (c) A relative-effect floor
        MUST be re-derived from the REBUILT null's own measured distribution, not from a
        superseded instrument's; on this batch's rebuilt nulls (medians 0.65%, 0.98%,
        0.77%, 1.50%) the frozen rule gives 0.025 against the frozen 0.15. (d) The
        SUGGESTIVE band MUST record any pair inside 0.8*|t|crit REGARDLESS of the
        relative floor, so a near miss reaches the record. (e) The ratio SE_2way /
        SE_naive MUST be reported at every target; a ratio below 1 is in tension with
        AM-7 clause (1) and must be disclosed. (f) A target flagged
        NEGATIVE-VARIANCE-COMPONENT may not carry a family-level bound without the flag
        in the same sentence.
      grounds: Red Team RT-C1, RT-C2, RT-C3, RT-C4, RT-C5, RT-C6, RC-5, RC-6, RC-7;
        Validator F-2, F-3.
    binding_carries:
    - >-
      ARTIFACT POLICY, NON-NEGOTIABLE FOR SUCCESSORS: every run emits command.txt,
      stdout.log and stderr.log as DURABLE artifacts in its task directory, and no path
      is written into a folded YAML scalar. Validator F-5 and Red Team RT-C7 both record
      Section C failing this; it is an evidence-integrity gap, never a mathematical
      result.
    - >-
      A q-SWEEP DOWN TO q = 1 UNDER B = [[I_k, A],[0, q I_{d-k}]] WITH A UNIFORM ON
      [0,q) COMPARES A q-ARY LATTICE AGAINST Z^d, because A = 0 and B = I_d at q = 1.
      Any sensitivity criterion built on that rung must say so; it does not demonstrate
      that the criterion separates informative from uninformative observables.
    - >-
      AN OBSERVABLE COMPUTED FROM THE INTEGER GRAM MATRIX CANNOT BE TESTED FOR
      AMBIENT-ISOMETRY INVARIANCE, since G(BH) = BB^T identically. A 0.0 T1 residual
      there is not a test that could have failed and must be reported as untested, not
      as invariant.
    - >-
      THE SPLIT-PRODUCER NOTARIZATION PATTERN AND THE NO-EARLY-DURABILITY-COMMIT RULE
      ARE RETAINED UNCHANGED. They worked a third time and the Validator verified the
      chain in both directions.
    - >-
      CLAIM TIER STAYS TOY. AM-3 IS NOT RETIRED. BATCH-a44d08 IS NOT RESCORED AND ITS
      SECTION C VERDICT AND FLOORS REMAIN VOID IN BOTH DIRECTIONS. AM-9's k convention
      stands.

  limitations:
  - >-
    CLAIM TIER TOY, UNCONDITIONALLY. d <= 140, beta <= 95, q <= 3329, n = 8 bases,
    S = 8 supports, E = 4 pools, N = 2^20, the 2^-10 quantile only, HKZ only at d <= 40.
    Nothing in this decision bears on ML-KEM security, on any FIPS 203 parameter set, on
    any attack cost, or on any cost model.
  - >-
    NO HYPOTHESIS STATUS MOVES. No hypothesis is named by the evidence and none is
    proposed. No experiment state transitions.
  - >-
    THIS DECISION MAKES NO OFFICIAL TRANSITION FROM UNCOMMITTED ARTIFACTS. Both
    BATCH-cbe023 review reports and the Red Team's probe directory were read in the
    working tree and are NOT part of the 6bafef862 snapshot (inherited PD-4). They must
    be committed by the ledger archive that carries this decision, and the durability of
    everything here is contingent on that archive being made and accepted by the
    post-commit verifier.
