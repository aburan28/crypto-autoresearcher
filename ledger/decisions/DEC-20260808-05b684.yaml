coordinator_decision:
  id: DEC-20260808-05b684
  context: >-
    BATCH-cbe023 of GOAL-MLKEM-005 closes. It was commissioned by
    DEC-20260806-607779 to lead with the AM-4 admissibility question (AM-8) and to
    carry the two instrument repairs (AM-6, AM-7) in the same batch. Three producers
    ran one frozen pre-registration
    (TASK-20260808-35efa3/prereg.md, sha256
    2da554914e5d78146c1e6cafcdbd109aacbc1a1624ed1f8e94ae769f757fc4f8, notarized in
    4f7c63703 before any producer was dispatched): TASK-20260808-2a9085 (Section A,
    the AM-4 gate over ten candidate observables), TASK-20260808-cece0c (Section B,
    the AM-3 positive control rebuilt), TASK-20260808-3a5f18 (Section C, the
    matched-V comparison rebuilt with a two-way SE). All three artifact packages were
    snapshot-committed at 6bafef862 by TASK-20260808-a6a336 before either independent
    review read them. The Validator (TASK-20260808-768137) returned `passed`; the Red
    Team (TASK-20260808-6de788) returned nine CRITICAL/MAJOR objections that cut
    against all three producer headlines, and twice reported against its own thesis.
    Evidence: EV-MLKEM-9b8f7f. Claim tier TOY throughout.

  decision: revise

  target_ids:
  - GOAL-MLKEM-005
  - BATCH-cbe023
  - EV-MLKEM-9b8f7f
  - DEC-20260806-607779
  - KN-FIND-f38a89

  decision_note: >-
    `revise` is the ACTION -- the frozen instrument specification is amended by AM-10
    through AM-14 below -- and it is not a verdict on any proposition. THE BATCH IS
    INCONCLUSIVE ON EVERY PROPOSITION IT SET OUT TO ADDRESS, and I say so plainly
    rather than converting an instrument outcome into a finding. Nothing is
    `support`ed, `weaken`ed or `reject_scoped` here; no hypothesis status moves,
    because no hypothesis is named and no evidence bears on one. `approve` would
    endorse three headlines that independent review has shown to be properties of
    their own designs; `pause` is not available, since none of this goal's
    pause_conditions (all INFRASTRUCTURE-ONLY, plus a user request) has fired and
    every one of the conditions that DID occur is listed in the goal's own
    non_terminal_conditions.

  rationale:

  - >-
    THE RUN SET IS VALID AND I VERIFIED THAT BEFORE INTERPRETING ANYTHING. Expected
    run count met (3 tasks, maximum_runs 1 each, used 1 each; 48 of 48 Section B steps
    with no selection and 0 degenerate; 10 Section C targets after the frozen
    UNREACHABLE rule, plus 1200 exact-null and 120 Gaussian-control replicates; ten
    candidates scored in Section A). Manifests schema-complete with one recorded gap
    (Section C retains no durable command.txt/stdout.log/stderr.log and its manifest
    command is a folded YAML scalar that is not runnable as written -- Validator F-5,
    Red Team RT-C7). Seed integrity PASS, including the one-ULP d = 140 deviation
    2.220446049250313e-16 that the pre-registration DECLARED IN ADVANCE and forbade
    rounding to 0.0. Raw/summary agreement PASS, recomputed from raw by the Validator
    at both Section B and Section C. Notarization verified by the Validator IN BOTH
    DIRECTIONS with git plumbing run in this worktree, including the negative test that
    the frozen text is ABSENT at the notarizing commit's parent and that `git log --all
    --follow` returns exactly one commit for it. Controls: the ones that were built
    behaved; the ones that decide the batch were MISSING and were built after the fact
    by the Red Team. One declared budget cap bound (Section A's L11 arm at 300.4 s) and
    is recorded as INFRASTRUCTURE SIGNAL, never as a refusal and never as an
    obstruction.

  - >-
    SECTION A'S HEADLINE MAY NOT BE REPORTED AS A FINDING, AND THIS IS THE DECISION'S
    LOAD-BEARING JUDGEMENT. I weighed the three grounds the task put to me and all
    three hold. (i) NINE OF TEN CANDIDATES WERE EXCLUDED FROM R1 BY THE
    PRE-REGISTRATION'S OWN ALGEBRA BEFORE ANY DATUM: five by OBS-GEN, which prereg 2.4
    states as a theorem; X7 by design; X8 and X9 because they take no beta argument so
    REL-1 is identically 0 and prereg 2.7 says so in advance -- report_am4.md records
    both at exactly 0.0000 with X_lo == X_hi bit-for-bit; and X4 because the frozen D
    arm has one beta per cell at two non-mirrored cells. Exactly one candidate, X10 =
    hkz, was ever live. All three of prereg 2.10's Form-2 guards protect G-INV and G-Q
    and NONE is a positive control for G-REL; I checked both facts against the frozen
    text myself. (ii) G-REL'S NORMALIZATION DECIDES THAT ONE CANDIDATE: s_hkz = 1.0
    while every recorded |hkz| lies in [0.0661, 0.4462], so the denominator is always
    exactly 1.0 and the floor is 2.2x-15.1x the realized magnitude; under the ordinary
    relative difference prereg 2.2 itself defines, hkz clears REL-2 at 0.4036 and
    0.1315 and REL-1 at 0.617-0.694, and REL-2 needs only one grid point -- so
    multiplying hkz by 10 flips the batch headline. G-REL1, G-REL2 and G-Q are
    additionally evaluated at basis index 0 ONLY, which is not in the run's declared
    deviations list. (iii) A BUILT PARAMETER-DETERMINED NULL REACHES R1 THROUGH THE
    IDENTICAL GATE: X_null = (beta/d)*(1/d)*log|det B|, standard deviation exactly 0.0
    across the eight frozen bases, scored at G-NUM 3.33e-14, G-INV 4.71e-14 over 4800
    residuals, G-Q 1.0000, REL-1 3.1035, REL-2 0.6000. The same script reproduces the
    producer's own rdet residuals to the digit, so it is their pipeline. CONCLUSION:
    "R1 is empty" is a fact about a ten-item list, not about lattices, and "the
    obstruction is RELOCATED, not removed" is not supported and is not recorded. The
    Validator reaches the same place from the other side: for rdet, R3 is forced by
    algebra and was predicted in the prereg in advance, and it explicitly declines to
    endorse the R3 headline as informative.

  - >-
    WHAT SECTION A DID ESTABLISH, STATED NARROWLY. The six diagonal-determined
    observables are refused at 1-2 orders above tau_inv = 0.01 and 13-14 orders above
    the measured T0 noise floor, with the T1 refusals reproduced under an independent
    implementation, RNG and seed (the T2/T3 refusals are single-source and are recorded
    as such). AM4-OBS-1's premise is REFUTED for D at both probed cells above D's own
    floor (7.5x and 1.29x). The HKZ reducer needed a real repair, and the Validator
    reproduced both the pre-repair violation (7.5500e-03 at d = 30) and the post-repair
    lambda_1^2 bit-exactly through a different fpylll entry point. G-RANK is NOT
    ADJUDICATED, confirmed independently. And the R3 LABEL for hkz survives the Red
    Team's own replication -- which it ran against its own thesis and reported -- but
    for a reason the producer never gave: the mirrored gap's mean is 0.00103 against a
    between-basis sd of 0.0239-0.0392 with a paired t of -0.064, so neither the 0.0697
    nor the 0.10 carries information. THE HONEST HEADLINE OF SECTION A IS ABOUT ITS OWN
    GATE: the AM-4/AM-8 admissibility gate as frozen does not discriminate informative
    from uninformative observables. That is a real, checkable finding, and it matters
    more than R3 because AM-8 makes this gate binding over every candidate observable
    in the goal.

  - >-
    SECTION B'S REPAIR IS REAL AND ITS POWER CLAIM IS NOT. The argmax-SE_diff selection
    is REMOVED rather than replaced, all 48 steps are reported, every firing sits on a
    strictly positive post-injection Delta, both negative controls return 0 of 48, and
    the entire table re-derives at deviation 0.0 from a SEPARATE committed snapshot, so
    it depends on no number this producer originated. But "the AM-3 gate CAN fire -- 29
    of 48 at c = 6" has no null object: NC-B1 and NC-B2 are the same family under
    different injections, and on the Red Team's exact-null step (Delta_i := 0 at the
    committed SEs) the same count is 47 of 48. The reported quantity is 62% of its own
    null and MOVES THE WRONG WAY as the violation vanishes -- the canonical artifact
    tell of docs/inventor-protocol.md section 3, in its exact form. PRED-B1's falsifier
    was additionally empty: c_min is a closed form of quantities reproduced bit-exactly
    from the committed record and the threshold 4 was set from a review measurement of
    the same map on the same data. AM-3's power is undemonstrated for a second time by
    a second route, and AM-3 IS STILL NOT RETIRED.

  - >-
    SECTION C'S VERDICT IS INVARIANT TO SECTION C'S OWN REPAIR. The largest realized
    relative difference over all 10 targets is 14.12% against tau_rel = 0.15, so the
    frozen condition (ii) fails at every target FOR ANY VALUE OF THE SE, including
    SE = 0. I re-checked this against report_am7.md's own table. Delete either frozen
    clause and the verdict is unchanged, so neither is load-bearing and neither carries
    evidence. CONSISTENT is therefore not recorded as a result in either direction and
    the L2 tail-sufficiency proposition stays OPEN IN BOTH DIRECTIONS. The section's
    genuine result is one its report does not contain and the Red Team found against
    its own thesis: split by condition over 1200 exact-null replicates, the SE-based
    condition (i) fires 5 times, 0.42% against a nominal per-pair 0.909% -- THE REBUILT
    SE AND ITS SATTERTHWAITE nu_eff ARE CALIBRATED, slightly conservatively -- and the
    Validator's independently built null corroborates the regime. That is exactly what
    AM-7 clause (2) asked for and it is the batch's most useful instrument gain.

  - >-
    THE UPPER BOUNDS ARE RESTATED AT THEIR CORRECT FLOORS. The advertised tightest
    detection floor of 3.91% relative occurs at the SINGLE target flagged
    NEGATIVE-VARIANCE-COMPONENT, where the frozen degenerate branch replaces the
    two-way estimate with MS_res/(S*E) -- precisely the residual-only variance model
    AM-7 exists to replace. The tightest NON-degenerate floor is 10.83%. Any citation
    of 3.91% must carry the qualifier, and the family-level bound over targets with a
    well-defined two-way SE is ~10.8% relative, not 3.91%. Six of ten pairs have floors
    at or above tau_rel; per-pair floors run 3.91% to 45.62%.

  - >-
    MY OWN ERROR, RECORDED BY SUPERSESSION AND NOT BY EDIT. My snapshot receipt at
    archives/TASK-20260808-a6a336 asserted AM-7's self-reported defect D-2 -- that its
    REPO_ROOT resolved to the enclosing checkout -- AS ESTABLISHED FACT, and added
    "the fix propagated within the batch". Validator finding F-1 proves both halves
    false, and I confirmed the core myself by reading the committed script:
    measure_am7.py line 85 uses FOUR ".." above batches/ and resolves to THIS worktree.
    The Validator additionally showed the five-level path reports a different HEAD
    (d724be4c9, main), that 111d04124 is not on main at all, that the enclosing
    checkout sat on a different branch throughout AM-7's run window, and that this
    worktree's HEAD WAS 111d04124 at AM-7's start instant. The false claim propagated
    into report_am7.md, the 3a5f18 manifest, measure_g3.py, results_g3.json and my
    receipt -- and mine is the only one of the five that stated it as fact rather than
    as a producer's self-report. The full correction, its propagation map and two
    further receipt corrections (the "twelve" artifact count against a binding
    path_sha256 map of eighteen; the incomplete quotation of D's collision separation
    at one cell of two) are in EV-MLKEM-9b8f7f.receipt_correction_by_supersession. THE
    RECEIPT IS COMMITTED AND IMMUTABLE AND IS NOT EDITED: AGENTS.md rule 4 allows only
    supersession, and the task card that commissioned this record states that a sibling
    batch's receipt was damaged this session by exactly such an in-place edit. I did not
    audit that batch and I record the instruction rather than the finding, but it is
    followed here without exception. The generalisable lesson is the Validator's:
    a Coordinator claim about the git record, repeated rather than verified.

  - >-
    THE METHODOLOGICAL PATTERN HAS A NINTH INSTANCE AND IT IS IN THE CONTROL AGAIN.
    This pre-registration is the first in the goal to name both could-not-fail
    directions per section, and it named the wrong pair three times out of three:
    Section A named both directions for invariance and sensitivity and neither for
    relevance; Section B named the vacuity of "fires at some c" and not the emptiness
    of its own prediction's falsifier; Section C named "could not FIRE" and "could not
    PASS calibration" and not "the VERDICT could not be falsified". The amendments
    below are written against that pattern rather than against the three sections. As
    last batch, the pattern is NOT promoted to knowledge, because every instance is
    internal to this program and that is exactly the sampling that would make it look
    characteristic whether or not it is.

