# =============================================================================
# DEC-20260923-ce06a6 -- GOAL-AUXIN-a93442: compose REVIEW-AUXIN-20260922-fd1edc
# (eight joints, three owners) on the RUN-AUXIN-fd1edc census package.
#
# THE RULING IN ONE PARAGRAPH. The census ARITHMETIC is right: three independent
# implementations reproduced it, one of them structurally blind. The census RUN
# is NOT admissible evidence, for four reasons. Its controls were built by a
# recipe no protocol text declares, and the governing amendment was rewritten in
# place after they were built. Its run files are hash-recorded but not
# verifier-bound. One row was computed on a field prime. And its escalate
# trigger counted the wrong set while typing the r + 1 branch with the r - 1
# cost. Separately, the escalate fires on about 94 % of random 256-bit primes,
# so it carries no curve-specific signal. Every break is an instrument, pin,
# provenance or interpretation defect; none is a mathematical result, and none
# is negative evidence about any curve. Decision: REVISE. The protocol is
# amended and the census re-run; nothing moves status.
#
# Census values appear in this record (it is a ledger record). They must not be
# copied into commit messages or PR text.
# =============================================================================
coordinator_decision:
  id: DEC-20260923-ce06a6
  id_provenance: >-
    Minted by the top-level session with tools/allocate_id.py and confirmed
    free with --check, as reported in this engagement's brief. This agent holds
    no shell.
  recorded_at: '2026-09-23'
  decided_at: '2026-09-23'
  decided_by: coordinator
  goal_id: GOAL-AUXIN-a93442
  batch_id: BATCH-ba0b0d
  task_id: TASK-20260922-a05e72
  archived_by: TASK-20260923-888d90
  review_plan_id: REVIEW-AUXIN-20260922-fd1edc
  opened_by_decision: DEC-20260922-19b645

  decision: revise
  decision_label: >-
    RUN-AUXIN-fd1edc is ruled INVALID AS EVIDENCE (inadmissible controls,
    unbound run files, one void row). Its arithmetic stands as
    independently reproduced REVIEW findings only. The escalate set and branch
    typing are corrected additively. The escalate is recorded as generic to
    primes of that size. Return to protocol design: a versioned amendment
    fixing the listed defects, reviewed before approval, then a fresh run. No
    status transition.

  context: >-
    GOAL-AUXIN-a93442 (ECC, active). BATCH-5149d8 produced RUN-AUXIN-fd1edc
    (EXP-AUXIN-7e2e3d, AMD-EXP-AUXIN-7e2e3d-20260916-bands), and its trigger
    stop_and_escalate fired, so the goal's pause condition required independent
    review before any further work. DEC-20260922-19b645 froze
    REVIEW-AUXIN-20260922-fd1edc before any reviewer ran and opened BATCH-ba0b0d.
    The three reviews returned and were snapshot-archived by
    TASK-20260922-39a32c: validator TASK-20260922-ba2fac (report
    VAL-20260923-d1a41c, J1-J4), red team TASK-20260922-0e10d1 (RT-20260923-ca6b7c,
    J5-J7) and blind re-deriver TASK-20260922-09522c (rederivation-report, J8). This
    decision is the composition step, TASK-20260922-a05e72.

  # ---------------------------------------------------------------------------
  # 0. Gate checks before composing (CA-4, CA-2).
  # ---------------------------------------------------------------------------
  tripwire_check_CA4:
    result: NO TRIPWIRE REPORTED; composition proceeds.
    basis: >-
      Read from the reports themselves. VAL-20260923-d1a41c tripwires.fired:
      none, with T1-T4 each explained as not fired. RT-20260923-ca6b7c
      T1-T4 each fired: false, with bases. The rederivation-report asserts no
      reading of any kind and makes no ordinary-ECDLP, below-floor or closure
      statement. The red team named one ADJACENT finding: frozen-expression r + 1
      values lie below the published r + 1 floor. It ruled that this is not T2,
      because nobody asserts them as attainable and they are a contract-level
      mis-typing. I concur, and CORR-20260923-187ea3 carries a standing clause
      routing any later assertion of them as a real cost to review-breakthrough.
  independence_check_CA2:
    run_by: >-
      The top-level /coordinate session. This Coordinator holds no shell. The
      results below are that session's reported outputs, recorded as such.
    plan_and_reports: >-
      `python3 tools/check_review_independence.py --plan
      coordination/review/auxin-20260922-fd1edc/review-plan.yaml --reports
      coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-ba0b0d/reviews` at HEAD
      3bf1db9df1: EXACTLY ONE PROBLEM -- "TASK-20260922-0e10d1: verdict on 'J7'
      is 'breaks (J7_generic; PTM-1 generic, PTM-2 holds, PTM-3 holds)', which
      must be breaks|holds|inconclusive". No independence, blindness or
      joint-ownership problem.
    plan_and_reports_ruling: >-
      A FORMAT defect in one attestation value, not an independence defect. The
      verdict token is unambiguous ("breaks", with the plan's own outcome label
      J7_generic), and the report's joint_verdicts.J7.verdict is the bare token
      "breaks". Composition reads it as breaks. The report was committed unedited,
      as the snapshot card requires, and is not edited here. No addendum was
      requested, because no conclusion below depends on it and this Coordinator
      may not message reviewers. Every one of the eight joints is owned and
      attested; no joint is unowned or unattested.
    blind_history: >-
      `python3 tools/check_review_independence.py --blind-history HEAD
      --protected-from coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-ba0b0d/batch.yaml`:
      PASS; none of the 12 protected values in the last 500 reachable commit
      messages.
    other_gate_outputs_reported: >-
      research_dispatch.py on the queue exit 0, 11/11 gates, TASK-20260922-39a32c
      verified on 7 content hashes; validate_ledger.py 94 errors = pre-existing
      baseline, none naming a batch path.

  # ---------------------------------------------------------------------------
  # 1. Per-joint composition (CA-1: composed, not vote-counted).
  # ---------------------------------------------------------------------------
  joints:
    - joint: J1 order pins
      owner: TASK-20260922-ba2fac
      verdict: breaks
      what: >-
        brainpoolP384r1 r is RFC 5639 p (the field prime), not q. The other nine
        pins match primary sources: seven in-repo, and BN254-r and
        BLS12-381-r from sources the validator retrieved. All ten r are prime
        (FLINT library proof), and the r-value commitment recomputes. The run
        pinned nothing from a source: every r is a literal in driver.py.
      plan_key_applied: J1_breaks -- "The affected rows are void; the others stand. Infrastructure, not mathematics."
      disposition: >-
        The brainpoolP384r1 row is VOID (specification invalidation_rules: field
        prime as r => invalid_measurement), recorded in CORR-20260923-64ee17 C1.
        Its void status is not negative, not inert and not escalating. The
        other nine rows are not voided BY THIS JOINT (they are voided as
        evidence by J3 and J4 below).
    - joint: J2 arithmetic and certificates
      owner: TASK-20260922-ba2fac
      verdict: breaks (certificate strength and independence only; values hold)
      what: >-
        All 20 products exact. The 83 reported primes are library-proven by
        FLINT; the 7 declared composites are proven composite. Divisor counts,
        minimizers and exponents agree to <= 2.45e-80; nothing is below the
        analytic floor, and every E_bound points the right way. The producer's
        certificates are sympy BPSW verdicts, and its "second check" is the same
        call. The factoring budget was NOT USED: 7 of 8 unfactored cofactors got
        no deep attempt, and the effective budget was 360 s against a frozen
        3600 s.
      plan_key_applied: J2_breaks_on_certificate_strength_only -- values stand; certificate wording downgraded unless re-proved.
      disposition: >-
        RE-PROOF RULING (the validator left it to the Coordinator): FLINT's
        fmpz_is_prime counts as re-proved at LIBRARY-VERDICT strength. That
        lifts the "probable prime" wording for review purposes. It is not an
        exportable, independently checkable certificate. For NIST-P-256 and
        brainpoolP256r1, J8's Pocklington/ECPP certificates, checked by a
        library-free verifier, ARE checkable certificates. Wording is fixed in
        CORR-20260923-64ee17 C7. The unused budget is a disclosure defect and
        a resource limit (C5), never negative evidence: E_bound rows mean "budget
        not used", not "integer resisted".
    - joint: J3 amended controls
      owner: TASK-20260922-ba2fac
      verdict: breaks
      what: >-
        Neither control integer is reproducible from its seed by ANY version of
        the amendment. Both come from an undeclared driver start 2^62 + (seed
        mod 2^20), and are deterministic from the seed under that recipe. Under
        the version the run launched with, the planted control is not
        constructible in its window. The amendment was rewritten in place about
        eight minutes after the controls were built. Every numeric gate
        recomputes and passes. Ordering is supported by the log and the code but
        is not tamper-evident. There is no positive control on r + 1.
      plan_key_applied: >-
        J3_breaks -- "The census has no admissible controls; every deployed row
        is void as it was for RUN-AUXIN-6117d3. Infrastructure, not
        mathematics."
      disposition: >-
        APPLIED AS WRITTEN. The mitigating facts are recorded, not used to
        override the key: deterministic construction, passing gates, and
        second-version-literal controls that would also pass. The key was frozen
        before any report returned. Relaxing it now, after seeing facts that
        favour the run, would be changing a success criterion after observing
        the outcome, which needs a protocol_amendment and cannot be done in a
        composition. The mitigation matters for the NEXT step: a clean re-run is
        low-risk and cheap. Recorded in CORR-20260923-64ee17 C2 and C3.
    - joint: J4 provenance, binding, raw/summary agreement
      owner: TASK-20260922-ba2fac
      verdict: breaks
      what: >-
        The bytes hold: 14/14 run files match their recorded hashes, the
        implementation is recoverable, and every numeric restatement agrees. The
        binding breaks: the trial plan binds amendment version 1 (179ea99b)
        while the committed file is version 2 (8dcd725a); the run files and
        modules are hash-RECORDED, not verifier-BOUND; and orders.json's
        self-hash is of a deleted pre-image.
      plan_key_applied: J4_breaks -- "No evidence record may cite the run until a superseding snapshot binds the run files ... by path_sha256."
      disposition: >-
        Applied. Moot for this run, since J3 already voids it as evidence, but
        binding for the re-run: its snapshot must declare every run file and
        implementation module in path_sha256 (CORR-20260923-64ee17 C4, C6).
    - joint: J5 escalate set and branch typing
      owner: TASK-20260922-0e10d1
      verdict: breaks
      what: >-
        Nine rows satisfy the frozen text, not six; one of the nine is the void
        field-prime row. The r + 1 rows are costed with the r - 1 formula, while
        Cheon 2006 Theorem 2 (retrieved and read) needs Theta(d) consecutive
        powers and costs sqrt((r+1)/d) + d. The boolean fires under every
        reading; the set does not stay the same.
      plan_key_applied: J5_breaks -- "The escalate set is corrected by a correction record, never by editing the run."
      disposition: Corrected in CORR-20260923-187ea3 (sets A, B, C, E stated, stratified by expected_structure_flag).
    - joint: J6 model scope and leak paths
      owner: TASK-20260922-0e10d1
      verdict: breaks (labelling only; J6 (iv) holds)
      what: >-
        No ordinary-ECDLP, deployed-system, weak-curve or safe-curve sentence
        exists anywhere in the package, the plan or DEC-20260922-19b645. The
        breaks are: the rho 0.5 column sits beside unlabelled E(r) "at identical
        accounting"; there is no per-row auxiliary-input typing; the r + 1
        values are called Cheon's known exponent; and the pairing flag is
        dropped from every restatement of the escalate set.
      plan_key_applied: J6_breaks -- "Every offending sentence or column is superseded before any citation."
      disposition: >-
        Superseded by CORR-20260923-187ea3 (labelling_rule_for_any_citing_record)
        and CORR-20260923-5c5a23 (S1, S2, S4). Nothing may cite the run in any
        case (J3).
    - joint: J7 proves too much
      owner: TASK-20260922-0e10d1
      verdict: breaks (outcome label J7_generic)
      what: >-
        PTM-1: 30 of 32 random 256-bit primes escalate (93.8 %, 95 % CI
        79.2-99.2 %); 0 of 32 inert; random primes sit as close to the floor as
        NIST-P-256 does. PTM-2: a proven prime built to be inert is reported
        inert on BOTH branches by the producer's own evaluator, so the evaluator
        is not what makes rows escalate. PTM-3: no ASSERTED sentence survives
        removal of supply; two READINGS do (the unlabelled rho column and goal
        completion criterion 1) and are refused.
      plan_key_applied: >-
        J7_generic -- "The escalate is reported as a generic property of primes
        of that size. The preregistered thresholds are left standing ... the
        calibration gap is recorded as a finding about the protocol, with a
        protocol_amendment if any future census is to use them."
      disposition: >-
        Applied. T3 does not fire: the deployed rate is not above the random rate
        (Fisher two-sided p = 1.0 on the 256-bit class), and nobody proposes the
        standards are anomalous. The PTM-1 sample is 32 primes at 256 bits only;
        extending the reading to the 224/384/521-bit rows rests on the red
        team's stated heuristic transfer assumption.
    - joint: J8 blind re-derivation (NIST-P-256, brainpoolP256r1, both branches)
      owner: TASK-20260922-09522c
      verdict: holds
      what: >-
        Pinned both r from the primary texts (equal to the producer's hex; not
        field primes). Factored all four integers completely with three backends
        (PARI, FLINT, sympy) in agreement. Proved every prime with checkable
        certificates. Evaluated every divisor at 200 digits in two libraries plus
        a 400-digit stdlib verifier. Attested blind_from respected; its leak
        check found no computed value in its read scope.
      comparison_with_producer: >-
        Performed IN THIS DECISION by reading
        experiments/EXP-AUXIN-7e2e3d/runs/RUN-AUXIN-fd1edc/e_table.json and
        factorizations.json against the rederivation report (a reading, no
        computation). On all four branches the prime-power multisets are
        IDENTICAL; the minimizing d is IDENTICAL (the producer reports the
        smaller member of the tied pair {d, m/d}, as J8 does); the divisor
        counts are identical; and the per-branch exponents agree to at least 59
        significant digits, the full length of J8's 60-digit strings against
        the producer's 80-digit strings. The required tolerance was 25. The
        attaining branch and the global E(r) agree on both curves.
      plan_key_applied: none needed (agreement).
      disposition: >-
        The producer's implementation is NOT wrong-and-self-consistent on these
        four branches. Together with the validator's and the red team's
        independent recomputation of all 20 branches, the census ARITHMETIC is
        not in doubt. What failed is pins, controls, custody, trigger and typing.
  unowned_or_unattested_joints: none -- eight joints, three owners, all attested (checker confirmed; one format finding above).
  gaps_named_though_owned: >-
    No control exercises r + 1 at a known POSITIVE answer at any size. PTM-2
    exercised it at the inert end only. The true brainpoolP384r1 order has no
    census row; D1c is a review diagnostic. The NIST-P-384 r + 1 and NIST-P-521
    r + 1 cofactors remain unfactored even after the review diagnostics.

  # ---------------------------------------------------------------------------
  # 2. Validity ruling.
  # ---------------------------------------------------------------------------
  validity_ruling:
    run_id: RUN-AUXIN-fd1edc
    ruling: INVALID AS EVIDENCE -- not citable by any evidence record, for any row.
    grounds:
      - J3_breaks (inadmissible controls), by itself sufficient under the frozen plan.
      - J4_breaks (run files not verifier-bound; governing amendment hash mismatch), by itself sufficient.
      - J1_breaks (brainpoolP384r1 row computed on the field prime; invalid_measurement for that row).
    validity_checks_applied: >-
      Expected run count: one run, one package (met). Manifests schema-complete:
      the manifest restates the factoring cap wrongly (C5). Seed integrity:
      seeds agree across specification, manifest, trial plan, receipt and
      amendment, but the control integers do not follow from any declared
      recipe (C3). Raw/summary agreement: holds except the orders.json
      self-hash (C4). Control comparability: FAILS (C2, C3).
    what_it_is_not: >-
      Not a mathematical result, not negative evidence about any curve, and not
      a statement that any value in the table is wrong. The arithmetic was
      reproduced independently three times, once blind.
    returned_to: >-
      PROTOCOL DESIGN FIRST, then the Executor. A plain re-run under the
      current contract would repeat the defects that sit IN the contract: the
      r + 1 typing, an escalate predicate that does not match the text, and no
      declared control recipe that fits the windows. The concrete defects are
      listed in next_actions (D1-D10).
    admissible_as_review_findings_only: >-
      VAL-20260923-d1a41c, RT-20260923-ca6b7c and the J8 rederivation-report
      may be cited AS REVIEW FINDINGS with their task ids. That covers the
      reproduced arithmetic, PTM-1/PTM-2/PTM-3 and the D1 diagnostics. They mint
      no RUN-* and are not evidence records, so none of them discharges a
      completion criterion.

  # ---------------------------------------------------------------------------
  # 3. Prior versus outcome (CA-3).
  # ---------------------------------------------------------------------------
  prior_versus_outcome:
    weighting_rule: >-
      PD-R2: the prior was INFORMED, written by a Coordinator that had read the
      run outputs and part of the driver. Where TASK-20260922-ba2fac or
      TASK-20260922-0e10d1 concur with it, that is weak corroboration: the prior
      found those diagnoses first. Only J8 (structurally blind) and J7 (a
      measurement nobody had made) could overturn or confirm it independently.
    items:
      - prior: "Arithmetic right: J1, J8 and the value half of J2 hold."
        outcome: >-
          J8 HOLDS: independent confirmation, the strongest agreement in the
          round. J2 values hold, which is concurrence and weak. J1 BROKE on a
          VALUE (a field prime as r), where the prior expected at most a
          provenance problem. PRIOR PARTLY OVERTURNED. Neither the prior, nor
          the previous round's reviews, nor the run's own Stage 0 check caught it.
          The validator's own pin caught it, and the red team caught it
          independently through a literature cross-check.
      - prior: "J2 breaks on certificate strength, not values (both paths call sympy.isprime)."
        outcome: Exactly as predicted. Concurrence, weak under PD-R2.
      - prior: "J5 breaks in both directions: under-inclusive (bound rows) and over-inclusive (r + 1 typing)."
        outcome: >-
          Concurred, and EXTENDED beyond the prior in three ways the prior did
          not foresee. (1) The r + 1 cost is linear in d, so frozen r + 1 values
          fall BELOW published r + 1 costs; the prior's and DEC-20260922-19b645's
          "cannot express below prior art" is false on r + 1 (CORR-20260923-5c5a23
          S1). (2) The prior's typed r - 1 set contains a void row (S2). (3) The
          recalled pointer (Theta(d) powers) was confirmed from a retrieved
          source, and its cost half corrected.
      - prior: "J7: most random primes of the same size escalate; the escalate is generic (recalled heuristic, unchecked)."
        outcome: >-
          CONFIRMED BY MEASUREMENT (30/32, 0/32 inert). This is independent
          confirmation in the PD-R2 sense: the prior asserted an expectation, and
          J7 measured it for the first time.
      - prior: "J6: flagged minimizers need 126-128-bit d; the escalate is operationally empty pending supply."
        outcome: >-
          Concurred on the r - 1 rows. Sharpened on r + 1: the listed r + 1
          minimizers presuppose about 2^126-2^128 CONSECUTIVE powers at a
          Theorem-2 cost of about r^0.49-r^0.50.
      - prior: "J4: durability gap, not content; J3 holds unless the recipe is ambiguous."
        outcome: >-
          J4 as predicted (bytes hold; binding narrow), PLUS a governing-input
          hash mismatch the prior did not expect. J3 BROKE, and the PRIOR IS
          OVERTURNED: not through ambiguity alone, but because the controls
          follow no declared recipe and the amendment was rewritten in place
          after them. This is the break that decides validity, and the prior did
          not see it.
      - prior: "Where it breaks: in the trigger and the certificate wording; 'a correct table under a mis-specified trigger'."
        outcome: >-
          Correct about the table and the trigger; WRONG about where validity
          would fail. Validity failed on custody and control provenance (J3, J4)
          and on one pin (J1).
      - prior: "What would overturn it most: (i) J8 disagreement, (ii) random primes rarely escalate, (iii) a row below the analytic floor."
        outcome: >-
          None of the three occurred. On (iii), the frozen formula floor held on
          all 20 branches; the r + 1 below-published-floor issue is a typing
          defect, not a floor violation.
    pre_declared_discount_check: >-
      batch.yaml pre-declared that, IF a leak were suspected, J8's agreement on
      the brainpoolP256r1 r - 1 minimizer would be read as agreement on the
      factorization only. NO LEAK IS SUSPECTED, so the discount is NOT applied.
      Grounds: blind-history PASS on 12 protected values; J8 attests
      blind_from_respected true and lists its sources; its BL-4 leak check
      found no computed value; its launch prompt named no census value
      (rederivation-report inference.independent_session); and nothing in any
      report suggests otherwise. The discount would change nothing anyway: that
      branch's factorization is 2 * 3^2 * (a 252-bit prime), and its minimizer
      follows from the factorization.

  # ---------------------------------------------------------------------------
  # 4. Scope statement (CA-7).
  # ---------------------------------------------------------------------------
  scope: >-
    Every statement here is scoped to the following. The ten frozen orders of
    EXP-AUXIN-7e2e3d, of which the brainpoolP384r1 row was computed on the wrong
    integer. The frozen cost expression sqrt(m/d) + sqrt(d), without the log
    factor, applied by the contract to BOTH branches. The factoring actually
    spent: sympy 1.14.0; an effective 360 s per integer; deep attempts only on
    cofactors of at most 260 bits; 50-86 s on each of the seven larger
    unfactored cofactors. The two synthetic controls at 125 and 64 bits. The
    review computations: PTM-1 on 32 random 256-bit primes (seed 2026092201,
    300 s cap); PTM-2 on one constructed 256-bit prime; D1/D1c GMP-ECM and PARI
    diagnostics. The literature actually read and cited in the reports. No
    transfer to other curves, sizes, cost models, protocols or deployed systems
    is assumed; the 224/384/521-bit comparison with PTM-1 rests on a stated
    heuristic transfer assumption. Nothing here concerns ordinary ECDLP (the
    DEC-20260802-204 acquisition gate stands). Every exponent is conditional on
    supplied auxiliary input, which this program has not examined
    (IDEA-20260831-ccb587 unopened).

  status_transitions: none
  status_transitions_note: >-
    H-AUXIN-66e6fd stays approved: an invalid run supports no transition in
    either direction, and no refutation artifact is claimed. EXP-AUXIN-7e2e3d
    stays approved at version 1; its specification is frozen and not edited,
    and this decision records RUN-AUXIN-fd1edc's validity instead.
    RQ-AUXIN-f8d8c0 stays active. GOAL-AUXIN-a93442 stays active. No completion
    criterion is discharged or withdrawn. RUN-AUXIN-6117d3 stays void.

  rationale:
    - >-
      The plan's composition keys were frozen before any reviewer ran, and J3
      and J4 each void the run as evidence on their own. Applying them as
      written is the difference between a pre-registered review and a post-hoc
      one (AGENTS.md "Review architecture"; coordinator prohibition on changing
      success criteria after observing outcomes).
    - >-
      CA-5 / core rule 5: every break is an instrument, pin, provenance or
      interpretation defect. The arithmetic is independently reproduced. So the
      right response is REVISE, not weaken; nothing about the hypothesis is
      refuted.
    - >-
      The re-run is not "the same protocol again". Three defects live IN the
      contract: the untyped r + 1 cost, an escalate predicate that does not match
      the text, and control recipes that do not fit the windows. Returning the
      run to the Executor unchanged would reproduce them, so the return goes
      through a versioned protocol_amendment.
    - >-
      J7_generic changes what the goal's escalate branch can mean: an escalate
      is the expected outcome for almost any prime of this size, and the inert
      branch is practically unreachable at 256 bits (CORR-20260923-5c5a23 S3).
      The amended protocol must either calibrate its thresholds against the
      null or drop escalate semantics and report a typed descriptive table.
    - >-
      TARGET-PROFILE HONESTY (docs/target-result-profile.md). This lane's method
      ceiling is Cheon's known exponent realised at specific integers under
      supplied input (RT-CA6B7C-P3). It cannot produce an exponent-moving
      result. Its value to the program is a certified, correctly typed table
      plus the supply audit that decides whether the table has any operational
      reading. That is worth finishing cheaply and correctly, not expanding.

  ranking_of_successor_work:
    - rank: 1
      item: Protocol amendment for the census (next_actions item 1), then a fresh run under it.
      why_first: >-
        The goal's completion criteria 1 and 3 need a VALID table, and none
        exists. The design is small, every defect is already localised, and the
        run takes minutes. This is the cheapest act that discharges a criterion.
    - rank: 2
      item: IDEA-20260831-ccb587 (protocol supply audit, completion criterion 2).
      status: STAYS UNOPENED by this decision (CA-6).
      why_not_first: >-
        The goal's criterion 3 joins the audit against a valid table, and none
        exists yet. Only a single next_action is permitted on the goal head.
      revisit_condition: >-
        Rank it at the next /coordinate selection point after the amendment
        design card is dispatched. It does NOT depend on census values, only on
        the typed input models (one power [x^d]P on r - 1; Theta(d) consecutive
        powers on r + 1), which CORR-20260923-187ea3 now fixes, so it may run
        in parallel on a disjoint lane. This is a scheduling order, not a
        deprioritization of the lead.
    - rank: none
      item: Any expansion toward new mechanisms within this lane.
      why: Method ceiling (above). Not proposed.

  evidence_refs:
    - coordination/review/auxin-20260922-fd1edc/review-plan.yaml
