  rulings:
    - id: R-1
      on: the D-3 extension to G4 and G4-R (raised by the correction for NA-4)
      ruling: ACCEPTED as within D-3 option (i)
      reason: >-
        Option (i) as DEC-20261002-d0594a words it binds "the RA-04 checks on
        structured and planted arms"; G4 and G4-R are RA-04 checks, so naming
        them executes the option rather than extending it. The extension is
        also necessary: the unmodified verify_rows.py writes per-instance and
        total rows_checked and prints a summary carrying rows_checked and
        failure_count (AP-047, AP-093), which over sampled structured
        instances is a row count. Feasibility: with --out /dev/stdout the
        report (json.dump, no trailing newline) is followed on the same
        stream by the summary line; analyze_a.py parses the first JSON value
        and discards the rest. No interpretive latitude is added.
    - id: R-2
      on: the D-5 outcomes.note sentence (the consequential edit making the five reading rows apply only when neither O-A-INVALID nor O-A-UNCAL applies)
      ruling: ACCEPTED
      reason: >-
        Without it O-A-UNCAL's small_x 80% clause, which is neither a gate nor
        a control, would overlap the reading rows; the sentence restates
        O-A-UNCAL's own condition, assigns no case differently from where
        the archived text assigned it unambiguously, and is required for D-5.
    - id: R-3
      on: the D-6 assignment of O-A4 restricted to z_A <= t_dec
      ruling: ACCEPTED as the exact closure of D-6
      reason: >-
        D-6's finding is that O-A3 and O-A4 depend on X_rel; both rows begin
        with z_A <= t_dec. Assigning O-A4 when z_A > t_dec would put one
        outcome in two rows and violate D-5. The restriction is the only
        reading under which D-5 and D-6 are both satisfied.
    - id: R-4
      on: the D-7 examination of experiment.title and experiment.objective ("confirmatory replication of the small_x TT4 relation-level excess")
      ruling: ACCEPTED unchanged, with the reading AR-5 written into the contract
      reason: >-
        The words name the test of whether a candidate excess recurs on fresh
        curves (RC-1 of DEC-20261002-c3f49b), not a replication status for a
        bounded null and not a reject_scoped role; O-A3's meaning and
        part_B.cells_covered.[3] already say what a bounded reading is. A
        reading costs nothing and prevents the title being quoted against
        O-A3 at composition.
    - id: R-5
      on: AF-1 (RA-04 outputs that are not checks; the census per-job stdout summary sums cert_pass and rows_emitted over every arm, AP-086)
      ruling: ADOPTED as AR-1 (binding), with the I-A7 extension the finding offered as its alternative
      reason: >-
        Real: with the null-arm totals RA-05 reads, the pooled per-job total
        exposes a structured-and-planted row total before RA-06. Closing it
        costs only where outputs go and what is parsed; the engine is not
        changed (EC-A1 only) and the frozen command template is not changed.
    - id: R-6
      on: AF-2 (the RA-04 checks have no named analyze_a.py subcommand and checks-report.json and row-verify.json no permitted means)
      ruling: ADOPTED and completed as AR-2 (binding)
      reason: >-
        Under the draft's local_ambiguity_rule an unlisted data file is a
        stop, so the gap would stop RA-04. This act found the same gap for
        the RA-04 merge (rows.jsonl.gz, staircase.jsonl.gz, merge-report.json
        at the run root have no named writer; EXP-PFDR-011cd0 used
        merge_relcensus.py, which the draft does not list as reused, and
        verify_rows.py reads merge-report.json's bases_map and
        harvest_rows_map, AP-088 to AP-092) and for view-map.json (named as a
        required artifact, never defined). AR-2 names one writer per data
        file, a merge subcommand of run_jobs.py and a checks subcommand of
        analyze_a.py, and defines view-map.json.
    - id: R-7
      on: AF-3 (which bound O-A3 and O-A4 compare when the |dev| fallback governs)
      ruling: ADOPTED as AR-3 (a reading)
      reason: >-
        upper_bound_U_A says the |dev| bound "governs instead" (AP-085), and
        design_properties_recorded_before_data already counts the fallback as
        a route to O-A4 (AP-087); "U_A" in the rows can only mean the
        governing bound. Stated before data, it removes a composition-time
        dispute.
    - id: R-8
      on: AF-4 (P0X-A recounts the archived known-null counts but compares none)
      ruling: ADOPTED as AR-4 (binding)
      reason: >-
        calibration.json's known_null_sub TT4 band C_A is 975.0 (AP-039), an
        integer-valued total the recount already produces; comparing it
        extends the baseline embedding to the known-null arm at no cost. A
        correct recount passes; one that differs by a single relation fails,
        as for C_R.
    - id: R-9
      on: DEC-20261002-d0594a OB-1 (PC-R-T (ii)'s 4 SD_null tolerance)
      ruling: NOT TIGHTENED
      reason: >-
        Exact plant recovery is carried by PC-R-iii (invalidating) and
        sensitivity at the target by PC-R-T (i); (ii) is a gross-error check
        following the EXP-PFDR-011cd0 PC-R (ii) precedent. Tightening it now
        would add a calibration failure mode without adding information.
    - id: R-10
      on: DEC-20261002-d0594a OB-2 to OB-5
      ruling: carried as observations; no change. Only the H1c TT m = 4 dispersion clause is read from this experiment (OB-2); the review round's prior is written at its dispatch and does not inherit the draft's (OB-4).

