        file: [coordination/design/TASK-20261002-33047e/replication-design.yaml, coordination/design/TASK-20261002-729fc9/replication-design-corrected.yaml]
        locator: 'yaml:'
        check: dict_equal_except
        procedure: >-
          Load A (the first file) and B (the second) with yaml.safe_load. A
          path is a tuple of segments: a str for a mapping key, an int for a
          list index. A leaf is a value that is neither a dict nor a list,
          or an empty dict or list. Parse every segment-path string named
          below ('a.b.[2].c' gives ('a', 'b', 2, 'c')). Let X be the set of
          the archived_path values of every
          B.correction.defect_to_edit_map[*].edits[*] entry whose
          archived_path is not null, together with the path values of every
          B.correction.identity_edits[*] entry. A path L is covered by a set
          P if some p in P is a prefix of L (L[:len(p)] == p). PASS iff
          (i) for every leaf path L of A not covered by X, L exists in B and
          the value at L in B == the value at L in A (type-exact); and
          (ii) every leaf path of B that is not a leaf path of A is covered by
          X or by ('correction',), ('draft_meta', 'corrects_under'),
          ('draft_meta', 'supersedes_draft'), ('draft_meta', 'opened_under',
          2) or ('part_B', 'cells_covered', 3). Record the number of leaves of
          A compared, the number covered by X, and every path failing (i) or
          (ii); any such path is a MISS.
