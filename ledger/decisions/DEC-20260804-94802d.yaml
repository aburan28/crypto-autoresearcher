coordinator_decision:
  id: DEC-20260804-94802d
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-054
  recorded_by_task: TASK-20260804-028
  archived_by: TASK-20260804-028
  context: >-
    BATCH-054 produced three non-isogeny proposals after SG-ECDLP-002 was paused.
    All three are expected to be closure directions. The Semaev BKK proposal
    (IDEA-b5462f) is the most promising (it could improve a constant, not an
    exponent). The p-adic and cover-attack proposals are expected to formally close
    known-failed directions.

  decision: admit_with_honest_assessment
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    All three proposals admitted for formal closure experiments. IDEA-b5462f admitted
    at medium priority as a potential constant-factor improvement to the Semaev index
    calculus (not exponent-moving, but computationally testable). IDEA-673f3a and
    IDEA-a4efaf admitted at low priority as formal closures of p-adic and cover-attack
    directions respectively.

    HONEST ASSESSMENT: After 54 batches of GOAL-ECDLP-001, all examined directions
    have either been formally blocked (isogeny-based: scalar-domain mismatch; class-group
    DLP: h(D)<<N order mismatch; Elkies augmentation: no advantage over random map)
    or are expected to close (p-adic formal group for non-anomalous, cover attacks for
    prime-field). The only remaining direction with potential for a genuine improvement
    is the Semaev BKK/mixed-volume approach — but this improves a CONSTANT in the
    exponent, not the exponent itself.

    For a target-class result (exponent below 1/2), the program has not yet found a
    viable mechanism. This is not a failure; it is consistent with the known hardness
    of prime-field ECDLP. The program should either:
    (A) Continue with formal closures of the remaining directions (3-6 more batches)
        to establish a clean negative result map
    (B) Pivot to a FRESH MECHANISM SEARCH using the knowledge corpus more systematically
        (search_knowledge for recent preprints, Wesolowski-style approaches for
        different problems)
    (C) Reframe the goal: instead of sub-rho prime-field ECDLP, target a RELATED
        problem where a Wesolowski-type result might apply (e.g., the ISOGENY FINDING
        PROBLEM for ordinary curves, which IS subexponential via class group DLP)

    The HONEST NEXT ACTION is (C): accept that prime-field ECDLP exponent reduction
    via the examined mechanisms is not feasible with current techniques, and pivot to
    a problem where a genuine p^{1/3}-style result is achievable. The ordinary
    isogeny finding problem (OIFP) — given two ordinary curves E, E' in the same
    isogeny class, find the connecting isogeny — is a fresh subgoal that admits
    Wesolowski-style MITM and has practical cryptographic relevance.

  proposal_dispositions:
    - id: IDEA-20260804-b5462f
      disposition: admitted
      priority: medium
      next_step: >-
        Dispatch a mathematical analysis to compute the mixed volume of the Semaev
        3-fold polynomial system at bits=20 and compare to the Bezout bound.
        If MV << Bezout: design an experiment. If MV ≈ Bezout: record as closure.
    - id: IDEA-20260804-673f3a
      disposition: admitted
      priority: low
      next_step: Dispatch mathematical analysis to confirm p-adic formal group gives k mod 1 = nothing for non-anomalous prime-order curves. Expected closure.
    - id: IDEA-20260804-a4efaf
      disposition: admitted
      priority: low
      next_step: Dispatch mathematical analysis to confirm no F_p-rational degree-2 genus-2 cover exists for prime-order prime-field curves. Expected closure (2-torsion absent).

  new_subgoal_proposed: >-
    SG-ECDLP-003: Ordinary Isogeny Finding Problem (OIFP) — find the degree-d isogeny
    between two ordinary curves E, E' in the same isogeny class. This IS subexponential
    (L[1/2] via class group index calculus on Cl(O_K)) and the Wesolowski-style MITM
    might give p^{1/3} complexity — a genuine exponent-moving result for a related
    hard problem. Dispatch ideation for SG-ECDLP-003 in BATCH-055.

  exact_next_action: >-
    Open BATCH-055 with two parallel tracks:
    (A) Formal closure experiments for IDEA-b5462f (BKK mixed-volume computation at bits=20)
    (B) Ideation for SG-ECDLP-003 (Ordinary Isogeny Finding Problem):
        state the problem precisely, compare to Wesolowski's supersingular result,
        determine whether a p^{1/3} MITM applies and what the key differences are.

  knowledge_promotion:
    promoted: []
    not_warranted: Proposals not yet validated.

  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2
    sota_delta: {time_exponent: not_applicable, memory_exponent: not_applicable, data_or_query_exponent: not_applicable}
  claim_ceiling: theoretical
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-04'
