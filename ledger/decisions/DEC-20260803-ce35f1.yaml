coordinator_decision:
  id: DEC-20260803-ce35f1
  goal_id: GOAL-SSI-001
  batch_id: BATCH-042
  recorded_by_task: TASK-20260802-004
  archived_by: TASK-20260802-004
  batch_directory_note: >-
    Artifacts reside in coordination/goals/GOAL-SSI-001/batches/BATCH-017/
    (directory reused due to stale-state dispatch when goal was at BATCH-004).
    This is recorded as BATCH-042 in the goal's checkpoint sequence to avoid
    collision with the pre-existing BATCH-017 checkpoint (DEC-20260730-015).
  context: >-
    BATCH-042 ideation and red-team review for GOAL-SSI-001. TASK-20260802-001
    (idea-generator) produced 5 SSI mechanism candidates across 3 lanes
    (orientation/known-End, CSIDH quantum, SQIsign transcript leakage).
    TASK-20260802-003 (red-team) rendered PASS_WITH_OBJECTIONS with 4 binding
    controls (RT-CTRL-001 through RT-CTRL-004).
  decision: conditional_advance
  decision_scope: >-
    Advance SSI-S1 (transcript leakage test) to experiment design phase,
    conditional on RT-CTRL-001 being satisfied in the experiment contract.
    O2/Q2 Pareto claims must be corrected. O1/O2 deferred until uncharged
    preprocessing is resolved. No hypothesis status change. No asymptotic
    claim. No knowledge promotion. GOAL-SSI-001 remains active.
  target_ids:
    - GOAL-SSI-001
    - EV-SSI-0eb0b1
    - TASK-20260802-001
    - TASK-20260802-003
  evidence_ids:
    - EV-SSI-0eb0b1
  rationale:
    - >-
      The idea screen is honest, properly bounded, and correctly excludes the
      broken SIDH/SIKE torsion-image setting from positive-target scope.
    - >-
      The red-team's four binding controls (RT-CTRL-001..004) are accepted as
      necessary conditions before any experiment dispatch. They are not
      objections to the screening itself but to the readiness of the candidates
      for computation.
    - >-
      SSI-S1 advances to experiment design ONLY if the contract names the exact
      statistic, simulator construction, parameter set, and effect-size
      threshold (RT-CTRL-001). An underspecified gate cannot falsify anything.
    - >-
      O2/Q2 Pareto claims (dominated_by) must be corrected to position against
      Wesolowski 2026 p^{1/3+o(1)} and Kuperberg 2011 quantum subexponential
      isogeny evaluation, not only against internal candidates.
    - >-
      O1/O2 uncharged endomorphism preprocessing must be resolved before any
      orientation experiment: a concrete curve set with known End(E) must be
      identified without solving the target problem (endomorphism-ring /
      path-finding).
    - >-
      No candidate identifies a genuinely new structural ingredient
      (target-result-profile A4). All five are recombinations of known
      techniques. This is not disqualifying for a first screen but constrains
      the expected information gain.
  next_actions:
    - action: design_experiment_contract
      description: >-
        Design EXP-SSI-S1 experiment contract with all four RT-CTRL-001 elements
        specified: exact statistic (e.g. KL divergence, chi-squared on
        coefficient distribution), simulator construction (random walk on
        supersingular graph with matching degree sequence), toy SQIsign parameter
        set (named prime, security level, number of transcripts), and effect-size
        threshold (minimum distinguishing advantage required for support).
      blocking: true
      condition: RT-CTRL-001 satisfied in contract
    - action: correct_pareto_claims
      description: >-
        Correct O2/Q2 dominated_by fields to position against Wesolowski 2026
        p^{1/3+o(1)} (classical, endomorphism-ring) and Kuperberg 2011 quantum
        subexponential isogeny evaluation (quantum, CSIDH). Current local-only
        Pareto comparison is globally dishonest.
      blocking: false
      condition: null
    - action: defer_orientation_lane
      description: >-
        Defer O1/O2 until a concrete curve set with known End(E) — not obtained
        from solving the target problem — is identified. Without this, any
        orientation experiment charges zero for the hardest step and produces
        misleading results.
      blocking: true
      condition: Source of known-endomorphism curves identified and justified
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Ideation screen is not evidence; no result to promote. The mechanism
      candidates are unverified proposals, not findings. Screening correctly
      bounded five ideas and identified their gaps; that is coordination, not
      discovery.
  pareto_integrity:
    dominated_by: >-
      All five candidates are dominated by Wesolowski 2026 p^{1/3+o(1)} for
      classical endomorphism-ring computation and by the VW p^{1/2} baseline
      for general supersingular path-finding. No candidate predicts an
      exponent improvement.
    sota_delta:
      time_exponent: not_applicable
      memory_exponent: not_applicable
      data_or_query_exponent: not_applicable
      note: >-
        Ideation screen; no algorithmic claim made. Candidates are proposals,
        not results.
  claim_ceiling: theory
  official_research_state_changed: false
  hypothesis_status_transition: none
  asymptotic_promotion_gates:
    proof_decomposition: not_applicable
    numbered_heuristics_validated: not_applicable
    concrete_cost_table: not_applicable
    independent_review_xhigh_and_red_team: not_applicable
    note: >-
      No asymptotic-complexity claim; gates do not apply to an ideation screen.
  red_team_controls_accepted:
    - id: RT-CTRL-001
      requirement: >-
        SSI-S1 experiment contract must preregister exact statistic, simulator
        construction method, toy SQIsign parameter set, and effect-size threshold.
      binding: true
      must_satisfy_before: experiment_dispatch
    - id: RT-CTRL-002
      requirement: >-
        Correct O2/Q2 dominated_by to position against Wesolowski 2026 and
        Kuperberg 2011.
      binding: true
      must_satisfy_before: next_ideation_round
    - id: RT-CTRL-003
      requirement: >-
        Resolve O1/O2 uncharged endomorphism preprocessing: identify concrete
        curve set with known End(E) not obtained by solving the target problem.
      binding: true
      must_satisfy_before: orientation_experiment_dispatch
    - id: RT-CTRL-004
      requirement: >-
        Confirm torsion-image exclusion scope applies to all five candidates.
      binding: true
      status: satisfied
      note: Red-team confirmed PASS on torsion-image exclusion.
  decided_by: coordinator
  decided_at: '2026-08-03'
