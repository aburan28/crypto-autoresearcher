    - id: R-JRD1
      ruling: >-
        BREAKS NARROWLY AT DR-3 (and D-6) ON SO-2; HOLDS ELSEWHERE. On the
        validator's referral (R-1) the composer rules (CW-R1): a hard link to
        a blind_from file is a filesystem alias of the kind the plan's attack
        list counts as a path form ("a symlinked parent"), and the reference
        canonicaliser leaves blind_from_respected TRUE on it, which meets "a
        blind_from-equivalent path form that is not a hit" as written. SO-1
        (duplicate YAML keys) is a document-layer construct with no evaluated
        non-canonical entry; it is a surviving objection whose repair is
        mandatory. PTM-RD1 and PTM-RD2 are met. Remedy local.
    - id: R-JRD2
      ruling: >-
        BREAKS AT DR-7, qualifying D-4. PTM-RD5 is not met: the design's own
        R-C8 code flags its legitimate A-DENSE on synthetic (8, 3), and every
        WO-I-4-conformant split of G is flagged. Five unnamed trace-visible
        disguises (D3g, D3g2, D3e2, D3h, D3k) return I_direct's quantity and
        pass R0 to R4; two static bypasses (D3i, D3t) pass S1 to S4. The six
        named disguises are rejected on every row (PTM-RD4 signature met).
        PTM-RD3 is met. JRD2 holds at the rule replay, the boundary
        re-measurement (every declared-engine ratio inside the factor),
        FFT exactness, the amendment's scope, R-C6-DIAG, DR-11, CI-1, CI-3,
        CI-4, D-5 and CC-4. Not K-new-record (b): the reviewer's tested
        whitelist remedy is evidence against it, not a proof of completeness.
    - id: R-JRD3
      ruling: >-
        K-INDETERMINATE. QR1 agrees exactly on every quantity the committed
        design embeds. Every rate both sides measured on a declared family
        lies inside [1/3, 3]. In the E-NP column (the design's fastest
        declared family) the route verdict differs off the marginal band at
        stage2-bandL-n8 d 3, and the memory verdict differs there and at
        n10 d 4, n11 d 5, n12 d 6, n13 d 6 and n14 d 7; n10 d 4 is disputed
        (marginal). The quantity is the E-NP memory verdict at B = 3^17 and
        the E-NP memory model above 6^10; the implementations are the
        design's 2^25-blocked numpy engine and JRD3's unsplit numpy engine,
        a choice the blind card left open (QR0-06). Neither side is preferred.
    - id: R-DISCHARGE
      ruling: >-
        FAILS. Every DR, D, CC and CI item, R-AMEND-SCOPE and R-ROUTE-RULE has
        a named clause; DR-3 and D-6 (JRD1), DR-7 (JRD2), and in part DR-8
        (headline binding) and D-4 (certification) are contradicted by their
        owning joint. Table in the worksheet.
    - id: R-KEY
      ruling: >-
        K-DESIGN-REVISE (JRD1 and JRD2 break; PTM-RD5 unmet; discharge check
        fails) TOGETHER WITH K-INDETERMINATE (JRD3 route verdict off the
        band). Both prescribe revise, no dispatch of cards 10 to 16, the lane
        closing at TASK-20261002-ea2ed7 and a selection point. K-design-accept,
        K-new-record, K-leak and K-infra do not apply. The keys are applied as
        written; no breaking list is widened or narrowed.
    - id: R-STRUCTURAL
      ruling: >-
        DR-7 BROKE AGAIN IN ITS CLASS; THE REMEDY IS STRUCTURAL: a whitelist
        by provenance class with a handle registry, private slots, a kroots
        input rule and a stated audit ceiling (off-trace and trace-aware
        computation sent to static restriction and an explicit code-reading
        certification item), demonstrated before the rest of the design is
        redrafted. DR-3 broke again in its class; the remedy is local (inode
        identity test, duplicate-key-rejecting loader, stated ceiling). The
        rate table's remedy is structural in the plan's own example: a
        separate frozen-definition measurement card with a blind replica.
        All three are carried in NA-1.
    - id: R-AMENDMENT
      ruling: >-
        AMD-20261002-09957b IS USED AND REFUSED -- NOT APPROVED. It lies at
        R-AMD-PATH-2's path and id and inside R-AMEND-SCOPE in kind (A1; A1-C1
        an A1-consequential tightening, labelled so; consequence statements);
        TQR-2 did not fire. Its headline qualifier is a consequence statement
        DR-8 requires but its anchor is not byte-bound to the frozen sentence
        (CW-R2). It is refused because the key is not K-design-accept, and its
        content carries the round's defects: an independence sentence resting
        on R0 to R4, a route table holding the K-indeterminate row and the
        disputed row, and the anchor. The file is not edited, keeps approved_by
        null and governs nothing; its id is consumed. amendment-v2.yaml is
        unedited on the record (snapshot input_checks; JRD1 AK-3; JRD2).
    - id: R-DR9
      ruling: >-
        READING (b): C5's own text requires I_indep on K-coefficient lambda at
        n' = 33, and A1 can admit a route only where derivation (A) is shown
        infeasible by (M) or (T), which C5K-np33 is not; reading (a) would make
        the specification's own arm unexecutable. Conditions: C-DR9-1,
        A-TWIST's C5K-np33 output is a model check calibrated on synthetic
        cells only, and any successor's independence certification covers
        A-TWIST; C-DR9-2, no successor amendment lists C5K-np33 under an A1
        heading as if A1 decided it.
    - id: R-ROUTE-ORDER
      ruling: >-
        RECORDED, NOT A KEY (CW-R3). The committed record cannot show that
        route_line_code's above-ladder gcd extrapolation was fixed before the
        rates; it moves only the marginal stage2-bandL-n10 d 4. A successor
        commits its extrapolation rule before any rate is measured, and carries
        the exclusion of a sub-quadratic gcd as a limitation (CW-R4).
    - id: R-C3-AND-OWNER
      ruling: >-
        No owner reply exists; silence is recorded, not read. On
        DEC-20261008-89d673 C-3: (a) the R-QSP-RETURN (2)(b) stop by
