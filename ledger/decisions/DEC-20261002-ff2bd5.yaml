  rationale:
    - >-
      Compose, do not count. JRD1's reviewer voted "holds"; the composer
      applies the plan's breaking sentence to its own referred construction
      and finds one member inside it. JRD3's reviewer voted "inconclusive" by
      design; the composer's comparison finds an off-band disagreement. The
      keys, not the votes, decide.
    - >-
      The independence check is the load-bearing defect. A check that flags
      the specification's own derivation (A) cannot certify the instrument,
      and one that admits I_direct through multiples of L or a re-wrapped
      token cannot certify independence. Both directions failed, so the
      repair is a change of form, not of rule list.
    - >-
      The rate disagreement localises, it does not accuse. Both sides'
      measurements are internally verified and agree on every rate measured
      in common; they differ because one engine splits operands and the other
      does not. Freezing the engine definition before measuring, with a blind
      replica under the same definition, is the cheapest discriminating step.
    - >-
      The standing order governs the freed slot. No new reason exists to pass
      over S1-V5, and the later goal-level orders on main still hold every new
      batch on this goal behind the repair.

