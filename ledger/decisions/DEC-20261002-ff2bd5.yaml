        key. RT-1 to RT-3 travel with DEC-20261002-e0aa2b NA-5.
    - id: R-CARDS
      ruling: >-
        TASK-20261002-38ffea, -909f2c, -34584f, -60ec76, -4c19d4, -c6bdf7 and
        -fa1d96 are NOT DISPATCHED; the session appends their disposition
