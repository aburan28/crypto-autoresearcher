  recommended_execution_order:
    - >-
      0. TOOLING PREREQUISITE (a handoff to be minted, see next_actions item
      1): the F_p port of experiments/EXP-SBRG-60c55e/driver/macaulay.py
      with the p = 2 known answer against KN-FIND-006 and a planted-syzygy
      positive control. Contracts 1-5 name it as an explicit input and none
      may be dispatched before it reports and its snapshot is archived.
    - >-
      1. EXP-PFDR-fd901a (H-PFDR-09e1b0, IDEA-20260903-26aa81): the
      p-independence calibration at (m, d, s) = (2, 2, 3) on p in {4099,
      the largest prime below 2^64, the P-256 prime}. Runs first because it
      scopes the small-p rank-drop artifact budget every later toy cell
      needs.
    - >-
      2. EXP-PFDR-5726af (H-PFDR-4148b8, IDEA-20260903-e1e38b): the single
      forced cell m = 2, d = 2, s = 3 with the Semaev arm, the
      block-factored null and the support-matched null. Its outcome decides
      whether IDEA-20260830-84cdb7's ladder runs at all; the ladder cells
      s in {2, 4, 5, 6} are inside the same contract, gated on the deciding
      cell.
    - >-
      3. EXP-PFDR-cbdefb (H-PFDR-c88f14, IDEA-20260903-d52480): the
      (first fall, last fall) slope ladder m = 2, d = 2, s in {1..5} with
      the V_{F,D} closure, two known-answer fixtures, three nulls and the
      three-outcome rule; consumes contract 1's artifact budget and contract
      2's d_ff values.
    - >-
      4. EXP-PFDR-20ee58 (H-PFDR-9aadc0, IDEA-20260903-cf63ad): the
      digit-twin deficit cells s in {3, 4, 5}, D in {5..8}, with the binary
      n = 12 calibration of the ported meter and the s = 1 slice tied to
      IDEA-20260830-cb8e46.
    - >-
      5. EXP-PFDR-4bfc6f (H-PFDR-e02f3b, IDEA-20260903-751062): the
      ALPF-011 mechanism separation on the exact archived builders, two
      cross-checked meters, |FB| = 4..8.
    - >-
      6. EXP-PFDR-c04716 (H-PFDR-06fd60, IDEA-20260903-dcf857): the
      zero-run static derivation of the conditional cost table; it may run
      at any time after approval because it needs no meter, and it MUST be
      archived before any Outcome III of contract 3 is interpreted.
    - >-
      7. INTEGRATING NEXT ACTION (not a contract in this battery): the
      coupled degree-by-yield table of IDEA-20260903-399a18, to be minted
      as a contract only after the meter validates and contracts 1-5 report,
      because two of its five columns have no instrument today and its two
      calibration cells (R2, R6) are decided by contracts 2 and 5.
  shared_prerequisite: >-
    No test-covered F_p Macaulay deficit meter exists in the repository at
    this commit (IDEA-20260903-399a18 P1, a floor). Every contract that
    needs exact graded ranks over F_p -- EXP-PFDR-fd901a, -5726af, -cbdefb,
    -20ee58, -4bfc6f -- names as an explicit input the port of
    experiments/EXP-SBRG-60c55e/driver/macaulay.py to F_p with (a) the
    p = 2 known answer against KN-FIND-006 (deficit(3) = 1, deficit(4) = 31
    at n = 12, support-matched null 0, under the same cumulative-multiplier
    convention the DREG series used) and (b) a planted-syzygy positive
    control of dialled size k (the redundant-generator construction of
    IDEA-20260903-afa56b, exactly k unpredicted zero-reductions at chosen
    degrees; and a planted-fall generator g = u f_1 + v f_2 + h with
    deg h < deg g for the closure of contract 3). The port must expose:
    squarefree mode (a^2 = a), ordinary-monomial mode (few free variables,
    for the positive control of contract 1 and the e-ring of contract 5),
    a mixed mode with one free variable (contract 4), per-layer and
    cumulative multiplier conventions, fall_dim and syzygy_dim per degree,
    the leading-form / shrink-test localization bit of EXP-ALPF-013, the
    degree-histogram-matched null generator, arbitrary-precision residues,
    and a pre-flight column/row gate. It is charged ONCE, as the first
    next_action, and no contract silently assumes it.
  approval_condition: >-
    The user confirms the six frozen contracts as drafted (or names the
    subset to confirm); THEN, and only then, the Coordinator sets
    approved_by coordinator on the confirmed contracts by a NEW versioned
    record or archive step (never by editing a committed specification in
    place), moves the corresponding hypotheses proposed -> specified, and
    writes the executor handoffs with budgets and completion gates -- in the
    recommended order, each dispatched only after the tooling handoff has a
    verified snapshot receipt. Until that confirmation every contract stays
    review_required with approved_by null, no hypothesis status changes, and
    no executor handoff exists.
