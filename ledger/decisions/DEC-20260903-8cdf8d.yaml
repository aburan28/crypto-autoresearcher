    - id: IDEA-20260903-f7e8a6
      lane: C
      disposition: held_as_closure_by_derivation
      bound_to: null
      note: >-
        The S_3-equivariant Hilbert series and the symmetrized null
        ceil((3B - 5)/2) with the exact offset 7 close H002's 6:1 at zero
        compute; its Stage 1 measurement (graded d_solve of the archived
        H002 instances against the two nulls with the equal-ideal control)
        is held as a pre-registered prediction awaiting the meter and is a
        candidate for the integrating table's R6-adjacent row.
  rationale:
    - >-
      Decision checklist item 1 (uncertainty): the battery reduces, in
      order, whether the prime-field degree column can be measured at all
      (prerequisite), how much of any toy measurement is a small-p
      artifact (contract 1), whether the derived first-fall law holds and
      is curve-blind (contract 2), whether the last fall degree is bounded,
      semi-regular, or isolated (contract 3), whether the binary deficit
      law has a prime-field existence (contract 4), and whether the
      archive's one positive survives its own section 8 (contract 5); the
      sixth prices the only conditional stake before it can be measured.
    - >-
      Item 2 (outcomes that change the next decision): contract 2's
      deciding cell decides whether 84cdb7's ladder is run or retired;
      contract 3's label decides whether the conditional route is dead
      (I, II) or priced (III); contract 4's branch decides whether binary
      deficit structure may be imported into the RQ; contract 5's
      classification decides whether the RQ's motivation (iv) is read with
      a correction. Each has at least one pre-registered negative outcome
      decidable from the metrics.
    - >-
      Item 3 (cheapest valid experiment): every deciding cell is a
      64-column to 2304-column exact rank costing seconds to minutes;
      budgets are sized to the work with the template floors respected and
      the one above-floor memory cap (16 GB, contract 4) justified by the
      5310 x 56751 cell.
    - >-
      Item 4 (controls): every contract carries a support-matched null of
      the same shape, the planted-syzygy positive control through the
      shared meter, the CRT / complete-splitting artifact of
      IDEA-20260830-cb8e46 and the output-degree proxy of
      IDEA-20260807-899c5e named as confounders and excluded by
      construction, and the structural tells of docs/inventor-protocol.md
      section 3 (p-ladder, curve spread, decay with s, iteration count).
    - >-
      Item 5 (budgets): stated per contract with run granularity; timeouts
      and OOM are failed_infrastructure in every invalidation list.
    - >-
      Item 6 (artifacts): manifests with commit, dirty-tree hash, per-file
      sha256, timing and peak RSS; frozen Stage 0 prediction files with
      their sha256 in every manifest; analysis.md against the frozen
      criteria.
    - >-
      Item 7 (proof-oriented gate, KN-TECH-080): all six hypotheses carry
      a filled proof_search_map with baseline embedding, observation-
      collision search, quantifier order, method ceiling and nearby-object
      control; the four closure-class proposals are not dispatched as
      experiments and their derivations are held for a later decision.
    - >-
      Item 8 (closure): no lane is closed here; contract 5's expected
      outcome would reduce the RQ's degree-column positives from one to
      zero under a derivation, which becomes official only through a
      Coordinator evidence record with a measured obstruction block after
      independent review.
    - >-
      Target-profile bias: the battery is exponent-relevant in exactly one
      place (contract 3's Outcome III) and that place is paired, in the
      same batch, with its heuristic-validation experiment (contract 3
      itself) and its concrete-cost artifact (contract 6), as the
      Coordinator's dispatch rule requires; everything else is calibration,
      instrument validation, or closure of stakes that were never costed.
    - >-
      Approval is withheld here because approval is the gate that spends
      compute and is presented to the user (design-experiment skill, step
      4); a Coordinator subagent's design is not a confirmation.
