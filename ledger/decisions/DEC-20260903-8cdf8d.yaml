      lane: C
      disposition: held_as_pre-registered_prediction
      bound_to: null
      note: >-
        Its planted-redundant-generator positive control (dialled k) is
        ADOPTED into the meter tooling handoff as the required planted-
        syzygy positive control; its signature census is an optional meter
