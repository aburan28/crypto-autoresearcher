  limitations:
    - >-
      UNUSED IDS: none. All six pre-allocated hypothesis ids and all six
      pre-allocated experiment ids are used, in order; the sixth pair is
      bound to IDEA-20260903-dcf857 as a zero-run static derivation rather
      than to IDEA-20260903-399a18, which is held as the integrating
      next_action for the reasons recorded in proposal_dispositions.
    - >-
      Inputs are proposal-tier; no evidence record exists and none is
      reviewed here. This is a design decision, not an evidence review, and
      every pre-registered prediction is quoted from the proposals'
      derivations, not from any run.
    - >-
      Every external citation in the hypotheses is either internal,
      snippet-level retrieved (Wilson 1990; arXiv:2103.07282 at abstract
      and ar5iv level, both by the idea-generator), or recalled and
      unopened (Schwartz-Zippel, Bettale-Faugere-Perret, Huang-Kosters-Yeo's
      solve relation); recalled sources back nothing in this decision.
    - >-
      The shared meter does not exist; contracts 1-5 cannot be dispatched
      until it does, and the tooling handoff's own scope (field-generic
      port with three reduction modes, two conventions, the localization
      bit and the histogram-matched null) is the battery's largest
      implementation risk.
    - >-
      Two reconciliations were made by the Coordinator before any run and
      are recorded in the contracts rather than silently absorbed: the
      joint-label rule of contract 3 (d52480's Outcome II versus e1e38b's
      derived d_ff slope 1/2) and the cumulative-multiplier deficit
      convention of contract 4 (which must match the DREG series' convention
      for the p = 2 known answer to be meaningful). Contract 4's s = 1
      slice is recorded as a fixture rather than compared against a
      non-existent instrument, a departure from cf63ad's P5 as written.
    - >-
      No ECDLP claim, no speedup, no sub-rho mechanism, no closure of any
      lane, no cryptographic-scale result. The 256-bit cells of contract 1
      are degree invariants of a 64-column matrix reached by a fixed-shape
      shortcut and are labelled toy tier.
    - >-
      No goal lane is opened; RQ-PFDR-ae2fba's status is unchanged; no
      hypothesis status changes; no experiment is approved; no executor
      handoff is written.
    - >-
      Sage is required by contract 5 and by the H-TOP symbolic check of
      contract 2; its absence at dispatch is failed_infrastructure.
  next_actions:
    - >-
      1. TOOLING HANDOFF (to be minted with tools/allocate_id.py by the
      orchestrating session; executor policy executor-implementation):
      port experiments/EXP-SBRG-60c55e/driver/macaulay.py to F_p per the
      shared_prerequisite block above, with tests: (a) the p = 2 known
      answer against KN-FIND-006 on the committed n = 12 chained system
      under the cumulative convention (deficit(3) = 1, deficit(4) = 31, null
      0); (b) the planted-syzygy positive control at k in {1, 2, 4, 8}
      (exact recovery) and the planted-fall generator (fall at deg g with
      known content); (c) mod-2 reduction agreement with the boolean meter
      on its own fixtures; (d) the instrument map of IDEA-20260903-399a18
      Stage 0 recorded at the port's commit. Snapshot-archive it and verify
      the receipt before any battery contract is dispatched.
    - >-
      2. Present the six frozen contracts to the user for confirmation
      (design-experiment skill step 4). On confirmation: set approved_by
      coordinator on the confirmed contracts through the archive step (a
      committed specification is never edited; an unconfirmed contract stays
      review_required), transition the corresponding hypotheses proposed ->
      specified in the same ledger archive, write the executor handoffs
      (budgets and completion gates copied from each contract; independent
      sessions; policy executor-implementation) in the recommended order,
      and open or refresh the PR naming the H-PFDR, EXP-PFDR and TASK
      records.
    - >-
      3. Snapshot archive of this design by the orchestrating Coordinator
      session: the six hypothesis records, the six specifications, this
      decision and TASK-20260903-b5d2ae by exact path; run
      tools/validate_ledger.py on the merged tree; push and open or refresh
      the PR against main naming the records.
    - >-
      4. After contracts 2 and 5 report (snapshot-archived and
      independently validated at review-adversarial in separate sessions),
      mint the integrating contract of IDEA-20260903-399a18 with its R2 and
      R6 cells entered as calibration checks, its R4 and R5 cost cells as
      'no instrument' unless the coset FFT solver and the fpylll window
      solver exist by then, and UNRESOLVED as a legal cell value.
    - >-
      5. If contract 3 returns Outcome III, route it to review-breakthrough
      at max effort (a bounded last fall degree contradicts the semi-regular
      null and the recorded prior) with a review_plan naming as joints the
      closure convention, the known-answer fixture, the censoring report and
      the null band, and read D_0 against the thresholds of contract 6 only
      after that review; no status change before it.
    - >-
      6. Hold IDEA-20260903-fc1355, -e0a3e8 and -f7e8a6 as closure-by-
      derivation records; consider, in a later decision after the meter
      exists, a single zero-run derivation-note contract filing their Stage
      0 derivations for independent review, or promotion of f7e8a6's
      measurement into the integrating table.
