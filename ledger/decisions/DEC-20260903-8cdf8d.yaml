    - id: IDEA-20260903-dcf857
      lane: C
      disposition: bound_as_zero_run_static_derivation
      bound_to: 'H-PFDR-06fd60 / EXP-PFDR-c04716 (battery position 6, EXP-JPR-402649 shape)'
      note: >-
        Bound because contract 3 carries the battery's only conditional
        exponent stake (Outcome III) and the Coordinator's rules require a
