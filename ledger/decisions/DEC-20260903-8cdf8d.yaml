coordinator_decision:
  id: DEC-20260903-8cdf8d
  goal_id: null
  batch_id: null
  recorded_at: '2026-09-03'
  decided_at: '2026-09-03'
  decided_by: coordinator
  recorded_by_task: TASK-20260903-b5d2ae
  context: >-
    Eleven proposals were filed against RQ-PFDR-ae2fba on 2026-09-03 under
    TASK-20260903-22c36b (lanes A and B) and TASK-20260903-dc126c (lane C).
    TASK-20260903-b5d2ae asked the Coordinator to convert them into a
    pre-registered experiment battery of up to six hypotheses and six frozen
    contracts, ordered so that calibration and instrument validation run
    before discovery, every contract decidable from predefined metrics with
    a matched null and a planted positive control where the instrument is
    new, and every budget sized to the work -- DESIGNED HERE AND NOT
    APPROVED HERE. The binding facts at design time: no test-covered F_p
    Macaulay deficit meter exists (IDEA-20260903-399a18 Stage 0, a floor
    read from the tree); the only recorded prime-field early fall
    (EV-ALPF-001's EXP-ALPF-011 line) is contradicted by its own archive's
    section 8 (IDEA-20260903-751062); the first fall degree of the d = 2
    digit presentation is derivable in closed form (IDEA-20260903-e1e38b);
    p-independence of fixed-shape invariants is derivable and the sweep to
    the P-256 prime costs the same matrix (IDEA-20260903-26aa81); no
    bounded-last-fall theorem transfers to the digit presentation
    (IDEA-20260903-d52480); and the binary 8 dim V deficit has a cheap
    prime-field separating cell (IDEA-20260903-cf63ad). RQ-PFDR-ae2fba is
    bound to no active goal head; no lane is opened on any goal.
