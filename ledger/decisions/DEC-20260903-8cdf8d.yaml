    - id: IDEA-20260903-fc1355
      lane: A
      disposition: held_as_closure_by_derivation
      bound_to: null
      note: >-
        Profile-blindness of the digit null and the marginal-digit
        inequality are zero-compute derivations under the semi-regular
        null; not an experiment. Its four proposed added cells (profiles
