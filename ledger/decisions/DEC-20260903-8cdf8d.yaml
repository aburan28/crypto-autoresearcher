    - id: IDEA-20260903-e0a3e8
      lane: A
      disposition: held_as_closure_by_derivation
      bound_to: null
      note: >-
        A box-model closure of symmetrization composed with archimedean
        windows; off the degree column of this battery and dependent on a
        lattice instrument (fpylll) that no record has built. Its Stage 2
        toy lattice test is held as a pre-registered prediction (recovery
        never above the e-box ceiling 1/2 in eps_eff units) for a future
