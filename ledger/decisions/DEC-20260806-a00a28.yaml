coordinator_decision:
  id: DEC-20260806-a00a28
  goal_id: GOAL-SSI-001
  batch_id: BATCH-b3c87f
  recorded_by_task: TASK-20260806-91f36a
  archived_by: TASK-20260806-91f36a

  context: >-
    BATCH-b3c87f refilled the SSI/SSIQ candidate pool under a mandatory
    duplication audit and froze one contract, EXP-SSI-697354, converting
    IDEA-20260803-48e258 into an executable object. The independent red team
    (TASK-20260806-9536f4, review-adversarial, independent session) returned
    three BLOCKING findings. Two were reproduced by the dispatcher at source
    before this decision was written. The contract is not fit to dispatch.

  decision: reject_pending_repair

  decision_scope: >-
    This decision governs the admissibility of five proposals and the
    execution authorization of one frozen contract. IT DECIDES NOTHING ABOUT
    SSI, SQIsign, OR THE SUPERSINGULAR ISOGENY PROBLEM. No hypothesis status
    moves. No measurement was taken by this batch.

  target_ids:
    - EXP-SSI-697354
    - H-SSI-7fe2bf
    - IDEA-20260806-62ba9d
    - IDEA-20260806-e4c719
    - IDEA-20260806-9c2f80
    - IDEA-20260806-d5a34e
    - IDEA-20260806-b60c35

  evidence_ids:
    - EV-SSI-455241

  rationale:
    execution_authorization:
      granted: false
      reason: >-
        EXP-SSI-697354 cannot be executed as frozen. Its blocking reproduction
        gate declares a configuration (unbounded memory, memoryless baseline)
        under which its own selected cost model returns T_A(256) = 72.2113,
        against the gate's asserted band [118.25, 118.75]. An Executor would
        have to either fail the gate or make an undeclared protocol choice, and
        the contract's invalidation_rules forbid both. Dispatching it would
        spend budget to produce a completed_invalid run set.
      second_reason: >-
        Independently of OBJ-1, the contract's control set cannot fail. The
        reviewer computed all 14 declared assertions and found that none can
        return a negative about the mathematical object. Approving it would
        make this batch 34 of the pattern this campaign already has 33
        instances of, and which analysis/SSI-ECDLP-SYNTHESIS-20260803.md
        section 2 identifies as the failure mode symmetric with premature
        closure.

    proposal_admissions:
      - id: IDEA-20260806-e4c719
        verdict: admitted
        basis: >-
          Not a duplicate against its named nearest neighbour or against the
          further proposals the reviewer selected independently. Carries a null
          object, heuristic assumptions with validation routes, and
          target_complexity. sota_delta zero on every attack axis.
      - id: IDEA-20260806-9c2f80
        verdict: admitted
        basis: as above; no duplication or screen finding returned.
      - id: IDEA-20260806-d5a34e
        verdict: admitted
        basis: as above; no duplication or screen finding returned.
      - id: IDEA-20260806-b60c35
        verdict: admitted_with_qualification
        basis: >-
          Not a duplicate. Its ARM M is the ONLY object-level control produced
          anywhere in this batch, and it is blocked on a sampler that does not
          exist. Admitted as a candidate; it cannot be dispatched until that
          sampler is built, and that dependency must travel with it.
      - id: IDEA-20260806-62ba9d
        verdict: quantitative_claims_withdrawn_structural_half_retained
        basis: >-
          Its rank floor is unsound: two non-commuting non-scalar endomorphisms
          already generate a rank-4 order because every subfield of B_{p,inf}
          has degree dividing 2, giving k >= 2 and firing the record's own
          falsification condition 5. Reference [35] at line 328 of the file the
          record declares READ, and committed record SC-2, both give k = 1. The
          1.585-2.585 bit figures and the 32-43% sota_delta are WITHDRAWN. Its
          novelty claim is refuted: GOAL-SSIQ-001 GD-1 states the same premise
          verbatim and was discharged at BATCH-002. Its structural observation
          -- that Section 4.1 prices OneEnd while SQIsign key recovery is
          Isogeny -- is upheld and is retained.

    dispatcher_error_recorded:
      - >-
        Both task cards in this batch instructed producers that "numpy is
        present". The dispatcher asserted this without checking. numpy and
        sympy are BOTH absent in this environment. EXP-SSI-697354 is unaffected
        because it independently verified and chose a stdlib-only primary path,
        but the instruction was false when issued and is recorded as the
        dispatcher's error, not the producer's.
      - >-
        The same task card instructed the designer to state that NIST-III/V
        retain margin under every tested overhead scenario, copied from
        analysis/SSI-ECDLP-SYNTHESIS-20260803.md. The designer refused and was
        right: gaps are 9.5387 / 21.9537 / 38.8387 bits at NIST-I/III/V and
        GROW with level. The reviewer confirmed this and traced the inversion
        to EV-WESO-001's own inference block.

  corrections_owed_not_made:
    - record: EV-WESO-001
      nature: >-
        Its committed finding that the method "beats Delfs-Galbraith at every
        tested budget w = 2^30..2^80" is reported to be a direct product of the
        MC_P13 anchor error. Correctly anchored, the crossover sits near
        log2 w ~ 49.5 entries. A superseding evidence record is owed. NOT MADE
        HERE: EV-WESO-001 is immutable and this batch took no measurement.
    - record: EV-SSI-59f7a2
      nature: >-
        It labels a OneEnd cost as a SQIsign security figure without carrying
        SC-1 (GRH at the Isogeny arrow) or SC-3 (concrete cost not
        inheritable); "GRH" appears zero times in it. The correction is
        QUALITATIVE. The 2^{120-123} value is not challenged by this finding.
        A superseding record is owed.
    - record: analysis/SSI-ECDLP-SYNTHESIS-20260803.md
      nature: >-
        Its "NIST-III/V retain comfortable margins" sentence is wrong as
        written. It is an analysis document, not a ledger record; a correction
        note is owed to it.
    - record: experiments/EXP-WESOVOW-001/cost_model.py
      nature: >-
        `T_w_vOW: "T_full / sqrt(min(w, M))"` takes the square root of a memory
        count rather than a ratio and does not reduce to T_full at w = M. This
        is a defect in committed experiment code and needs a superseding
        experiment, not an edit.

  next_actions:
    - >-
      SINGLE NEXT ACTION FOR GOAL-SSI-001: open BATCH-<new> to repair
      EXP-SSI-697354 as a versioned successor contract, not an edit. The repair
      must (a) fix the anchoring of the vOW law so it reduces to T_full at
      w = M and state which of MC_P13 / MC_VOW / neither it adopts, (b) replace
      the reproduction gate with one whose asserted band is computed under the
      configuration it declares, (c) supply at least one control capable of
      returning a negative about the object -- the reviewer's finding that zero
      of fourteen can is the binding defect and a repair that does not fix it
      is not a repair, and (d) add `re` and `ast` to stdlib_modules_permitted
      and move the w grid into the frozen specification.
    - >-
      The corrections owed above are queued, not performed. They require
      superseding records and, for EV-WESO-001, a decision from the goal that
      owns it.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This batch measured nothing and produced no evidence record above
      claim_tier not_applicable. There is nothing to promote. The reviewer's
      control-capability finding is a methodological observation about this
      contract, not yet a corpus-level finding; if the repair batch confirms
      the pattern generalises, KN-FIND promotion should be reconsidered then
      against KN-TECH-1a5b7e and KN-FIND-029.

  claim_ceiling: >-
    Nothing in this batch may be cited as evidence about SSI, SQIsign, the
    supersingular isogeny problem, or any security margin. Five proposals and
    one defective contract exist. The strongest true statement is that an
    independent review found the contract unrunnable and its controls incapable
    of failing, and that the dispatcher reproduced the two decisive defects.

  official_research_state_changed: false
  hypothesis_status_transition: none
  experiment_status_transition:
    - id: EXP-SSI-697354
      from: approved
      to: approved_execution_withheld
      note: >-
        The contract remains a committed, frozen artifact. Its approval as a
        SPECIFICATION is not revoked -- revoking it would rewrite an immutable
        record. What this decision withholds is EXECUTION AUTHORIZATION, which
        was never granted. The successor contract supersedes it.

  asymptotic_promotion_gates:
    gate_1_proof_decomposition: not_applicable
    gate_2_numbered_heuristics: open
    gate_3_concrete_cost_table: open
    gate_4_independent_review_and_red_team: >-
      A red-team pass occurred and returned three blocking findings. The gate
      is not "passed" -- an adverse review is not a satisfied gate.
    note: >-
      No asymptotic-complexity claim is advanced by this batch, so these gates
      are recorded as open rather than as failed.

  decided_by:
    task: TASK-20260806-91f36a
    role: coordinator
    policy: coordinator-orchestration-code
  decided_at: '2026-08-06'
