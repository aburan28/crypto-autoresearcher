coordinator_decision:
  id: DEC-20261005-e86fbf
  context: >-
    Design tick on 2026-10-05. origin/main was fetched and the
    branch was cut at f5b5a0efae5331bac173f05f5bf70c2b32f82225.
    The new main commits after 118c856f35 are event digests.
    Main already carries contracts for the open SSI, FROB, QSP,
    and symmetric-monodromy ideas. The remaining proposed ECC
    ideas are the arithmetic statements declined by
    DEC-20261005-138b51. IDEA-20261005-3a18d1 still has its
    height regression outside EXP-PAIR-ef9af7, and no newer
    uncited curve idea is ahead of it.
  decision: approve
  target_ids:
    - IDEA-20261005-3a18d1
    - H-PAIR-2af76d
    - EXP-PAIR-894a7f
  rationale:
    - >-
      PAIR is an ECC area. This contract measures the
      coefficient bit length of Hilbert class polynomials. It
      does not repeat the trace cells.
    - >-
      A design-session count, not a run, gave 437 included
      discriminants, product Spearman correlation
      0.616752204791, and quartile ratio 1.59959009977408.
      The class-number correlation on the same rows is
      0.444241687030.
    - >-
      Standing user authorization of 2026-09-06 covers approval.
      The protocol fields required before dispatch are filled.
    - >-
      The large prime bins stay outside this contract. They
      are named, not dropped silently.
  evidence_refs: []
  limitations:
    - The sample stops at absolute discriminant 2000 and class number 16.
    - One library produced the design-session table. The run still has to agree with a second construction.
    - Approval authorizes one deterministic run. It does not assert the correlations.
  next_actions:
    - >-
      Snapshot-archive this contract. Do not launch
      TASK-20261005-7c9f18 until the receipt verifies.
  knowledge_promotion:
    promoted: []
    not_warranted: Approval of an unrun contract. No finding is promoted.
  decided_by: coordinator
  decided_at: '2026-10-05'
