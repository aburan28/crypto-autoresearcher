      0.01-bit tolerance; the largest difference is 6.8e-7 bit at (127, 5).
    Q3: >-
      3 of 3 exact on |F_V|, f, orbit count, histogram and #E: n = 7: 57, 1, 9,
      {1: 1, 7: 8}, 116; n = 11: 1057, 1, 97, {1: 1, 11: 96}, 2116; n = 13:
