      digits. The producer's V at dimensions 6, 10, 12 is the unique stable
      subspace of that dimension, ker Tr, on the same model, so the comparison
      is like for like.
    residual_risk_weighting: >-
      Per batch.yaml: the Q1/Q2 integers at n = 131/163 carry the LEAST
      independent weight (classical, and present in records and commit
      messages). The protected long literals passed --blind-history, but they
      are functions of l', so their agreement mainly confirms precision. A
      positive signature of independent computation: at (113,4), (113,5),
      (127,3), (127,4) and (127,5) the blind margins differ from the producer's
      by 4e-11 to 7e-7 bit, in the predicted direction (log2 n against log2 g,
      g < n); copied literals would match exactly. Q3 is the strongest
      independent confirmation (two field models, three enumeration methods and
      a closed form). Net: J6 confirms the values independently, which is the
      check PD-R1 says only J6 can supply.

