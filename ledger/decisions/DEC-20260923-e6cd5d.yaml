      stable subspaces, dimensions {0, 1, 130, 131}, ord_131(2) = 130. It agrees
      with the blind and producer values under a third field model
      (z^131 + z^13 + z^2 + z + 1; the blind used t^131 + t^8 + t^3 + t^2 + 1).
      Weight: low, since it comes from this program's own IDEA lineage and the
      value is classical. The README's "The finding" paragraph reads section B
      as ruling out "every linear" stable factor base; that over-reads B,
      because the dimension-130 subspace is stable. Flagged here; not corrected
      (analysis note, unresolved ownership); KN-FIND-b9a41d does not cite it.
    Q2: >-
