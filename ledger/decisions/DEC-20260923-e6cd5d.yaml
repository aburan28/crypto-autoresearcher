        be "recovered and recorded, or declared lost, before any promotion". The
        rule was fixed in the Phase A hand-back BEFORE the search results: if the
        search found nothing, declare lost and promote in this archive; if it
        found anything, record it and defer the KN-FIND. The dispatching session
        ran R1 (git log over all refs except the excluded one), R2 (a names-only
        grep for the card's figures over 818 refs) and R3 (PR #1360 text).
        Nothing was recovered. CORR-20260923-f1e5bc D4 declares lost and
        withdraws the untraceable figures; KN-FIND-b9a41d is promoted here. The
        queue's rerank trigger for this case fired; the rerank changed no order.
      severity: disclosed
    - id: PD-C4
      what: >-
        The dispatching session's PTM-7 reproduction, its pre-staging spot checks
        and the R1-R3 search are PROVENANCE, not review findings, and are cited
        as such. It relayed nothing between reviewers.
      severity: disclosed
    - id: PD-C5
      what: >-
