  tripwire_ruling:   # CA-4, ruled first and on its own
    T1:
      status: not_fired
      plan_text: >-
        "Any reviewer computes or finds, inside the linear F_V family, a
        pi-orbit gain greater than n for n an odd prime, or a net win at q = 2
        with n in {131, 163} for some m in {2,3,4,5}. That contradicts accepted
        evidence EV-FROB-d336b0."
      reading_applied: >-
        "pi" is H-FROB-6774fb's pi(x, y) = (x^q, y^q), the q-power Frobenius for
        the field over which V is a subspace; "pi-orbit gain" is the mean orbit
        size of <pi> on F_V. The reading is fixed by the plan's own text, not
        chosen after reading the reports: (a) claim_under_review points to H's
        statement verbatim, which defines pi with q; (b) PTM-6 in the same plan
        routes a group larger than <pi> (with classes of size 2n) to the WORDING
        failure signature ("... without the linear-F_V and pi-alone
        qualifiers"), not to T1, so the plan separates the pi-alone gain from
        larger-group gains; the 2-power Frobenius of a curve with F_2
        coefficients viewed over F_8 generates a group of order 3n containing
        pi_8 with index 3, which is that class; (c) T1's own reason is a
        contradiction of evidence, and no EV-FROB-d336b0 value is contradicted.
      basis: >-
        First disjunct: on the red team's PTM-7 object the pi_8 orbits are
        {1: 1, 5: 814}, mean 4.995 < 5, and P4 is exact (COMP-PTM7). The
        dispatching session reproduced this with its own Sage code sharing
        nothing with the red team's (provenance, PD-C4). Every run row has
        longest pi-orbit exactly n (validator). Second disjunct: every reviewer
        and the blind re-derivation find a loss at all 8 cells; PTM-7 cannot
        occur at q = 2.
      reading_rejected_and_why: >-
        If "pi-orbit gain" meant the gain of ANY Frobenius endomorphism of E on a
        linear F_V, T1 would fire on PTM-7 (mean 14.80 > 5) and on the red team's
        (4,41) and (8,41) sub-family figures. Rejected for reasons (b) and (c).
        Rule 12 was checked separately: the finding NARROWS the claim with a
        classical fact; it is not a breakthrough, closure or contradiction of a
        measured value, and after CORR-20260923-9a3529 H2 the PTM-7 object lies
        outside everything re-affirmed here.
      disclosed: >-
        The composing Coordinator ruled on a tripwire whose firing would have
        stopped its own composition. Any session that reads T1 differently may
        open a review-breakthrough round on the PTM-7 question; nothing here
        forecloses it.
      how_the_finding_enters: >-
        Key J3_or_J4_break_on_scope_or_wording: CORR-20260923-9a3529 H2 adds the
        field-of-definition exclusion and the pi-alone qualifier, and states the
        classical fact that for E with a model over F_{q0}, q = q0^k, pi_{q0} is
        an endomorphism of order kn on E(F_{q^n}), so the Frobenius gain is
        measured against the degree over the field of definition. Basis: an
        elementary derivation plus the archived COMP-PTM7 certificate.
        Literature: KN-LIT-796 (retrieved, verified_by TASK-20260923-33a48b).
        Recalled pointers, not relied on: Wiener-Zuccherato 1998 and
        Gallant-Lambert-Vanstone 2000.
    T2:
      status: not_fired
      plan_text: >-
        "The composing decision would assert a closure wider than this evidence
