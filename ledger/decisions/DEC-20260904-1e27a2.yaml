    The evidence record is EV-PFDR-1394a4. Approved under DEC-20260903-93862f,
    executed under TASK-20260903-b0727c.
  decision: weaken
  decision_label: >-
    weaken_H_PFDR_4148b8_on_an_archived_counterexample_certificate_refuting_the_universally_quantified_fall_dim_clause_while_recording_that_the_d_ff_closed_form_survived_every_attack_and_that_H_TOP_now_holds_at_m_eq_4
  target_ids:
    - EXP-PFDR-5726af
    - H-PFDR-4148b8
    - EV-PFDR-1394a4
    - RQ-PFDR-ae2fba
  rationale:
    - >-
      WHAT FALLS, AND IT FALLS TO A COUNTEREXAMPLE CERTIFICATE. Joint R1 BREAKS.
      The fall_dim identity of statement (D4) - fall_dim(d_ff) = m[C(s,a_0) -
      C(s,a_0+e)] - is stated WITHOUT the hypothesis it needs (linear
      independence of the rows mu S~ in B) and is FALSE inside the record's own
      quantifier range over all p, all non-singular curves and all affine
      targets. Explicit instance: m = 2, d = 2, s = 2, p = 13,
      E of the form y^2 = x^3 + 12x + 3 with 4a^3 + 27b^2 = 5 nonzero, x_R = 11,
      giving (d_ff, fall_dim) = (5, 3) against the frozen (5, 4), with N_sol = 8
      and the vanishing linear form a_{1,0} - a_{2,0}; second instance p = 19,
      a = 2, b = 15, x_R = 9. Both curves pass the experiment's own filter. This
      is item 1 of docs/claims-and-verification.md "Refutation artifacts" - the
      STRONGEST tier - packaged as a self-contained verifier that prints PASS,
      re-checked by three implementations sharing no code, and archived BEFORE
      this decision. The exact mechanism is supplied (fall_dim(D) =
      dim ker(m_{S~_top}) - dim Rel_D with Rel_D = {h of degree D - delta
      vanishing on supp(S~)}), as is the repair and its rigorous sufficient
      condition N_sol < 2^{ms - a_0}, which is SHARP: the counterexample sits at
      N_sol = 8 = 2^{4-1} exactly.
    - >-
      THREE MORE CLAUSES FALL, none of them softened. (D6)/P3's "the
      block-factored null reproduces d_ff AND fall_dim exactly, FORCED 0 at
      every cell" is UNSATISFIABLE at the two boundary cells (2,2,2) and
      (3,2,4), where a homogeneous block-factored null is a scalar times the
      product of all ms variables and its fall_dim is 1 for any m, s, p; the
      clause "and fall_dim" was added between IDEA-20260903-e1e38b (D6), which
      claims only d_ff, and the hypothesis record. (D4)'s exactness
      justification, "for p > s every binom(k-i, t-i) is a positive integer
      below p", is FALSE - witness s = 10, j = 4, e = 2, p = 11 with entry
      15 >= p - while the rank is nevertheless full; the correct reason is
      Kummer/Lucas, and the source proposal had the right bound
      (binom(s, floor(s/2)) < 2^s <= p) which the ledger record LOST. And
      (D7)'s literal sigma >= 1 is wrong for every m >= 3, the recomputed bound
      being 0.975 at m = 3 and falling to 0.318 at m = 10.
    - >-
      WHAT SURVIVES, and it survived everything this round could throw at it.
      The hypothesis's PRINCIPAL claim - a closed form for the first fall degree
      of the d = 2 digit presentation, d_ff = m 2^{m-1} + floor((s - 2^{m-1})/2)
      + 1, curve- and target-independent - takes the values 5, 5, 6, 6, 7 at
      m = 2, s = 2..6 and 13, 13 at m = 3, s = 4, 5, identical across every
      curve, target and prime, strictly below the measured support-matched null
      at the five cells where a strict early fall is possible, and reproduced
      exactly by a curve-free block-factored null. It was BLIND re-derived at
      (5, 4) on 12 of 12 declared instances by an implementation that had read
      nothing of the producer's, confirmed on an unrequested 80-draw
      supplementary sweep, cross-checked against EXP-PFDR-cbdefb's closure meter
      on the same instances (24 of 24 rows, disagreements empty), and it
      survived an EXHAUSTIVE small-prime sweep of 26,000 instances at (2,2,3)
      with 0 deviations. Additionally H-TOP, declared not attempted at m = 4 in
      the package's own stage0 note, is NOW CHECKED at m = 4 by the review:
      deg S_5 = 32 in the four unknowns with leading coefficient exactly 1,
      constant in x_R and in (a, b).
    - >-
      WHY weaken AND NOT reject_scoped, stated against the rule. The refutation
      artifact is of the strongest tier and would license reject_scoped on the
      fall_dim clause alone. It is not taken, for two reasons that are recorded
      rather than assumed. First, the clause that falls is a SUBSIDIARY clause
      of a hypothesis whose principal claim survived every attack, so rejecting
      the hypothesis in scope would misdescribe the round's outcome in the
      adverse direction as badly as calling it a support would in the favourable
      one. Second, the repaired statement supplied by the reviewer is TRUE at
      every draw in the package and its side condition holds there with orders
      of magnitude to spare (observed N_sol in {1, 2, 6} against thresholds 8,
      32, 64, 256, 512, 2^11, 2^14), so what is warranted is a correction with a
      side condition, not a rejection. Whether the exception exists at a
      STRICT-early-fall cell or only at the boundary cells is undetermined - the
      reviewer found it twice at (2,2,2) and never in 26,000 exhaustive
      instances at (2,2,3) - and that is exactly what the next action settles.
    - >-
      THE PROVES-TOO-MUCH CONTROL PRODUCED ONE PARTIAL SURVIVAL, and it
      re-scopes what d_ff alone can certify. A non-tensor top form
      ell_1^2 ell_2^2 + ell_1^3 ell_2 with dense sub-top terms has a rank-2 top
      form, so (D4) does not apply at the tensor step - and it still returns
      d_ff = 5, with fall_dim 2 rather than 4. What produces d_ff = delta + 1 is
      the mere existence of SOME degree-1 annihilator of the top form; being a
      block tensor is SUFFICIENT, NOT NECESSARY. So d_ff alone does not identify
      block structure and F5's converse reading is too strong; the mechanism
      claim must be carried by the PAIR (d_ff, fall_dim) or by the kernel
      dimension. The three planned objects and the added out-of-regime cell
      showed no failure signature.
    - >-
      THE CITATION UNDERPINNING HEUR-001 IS WRONG, and the correction is
      actionable rather than rhetorical. The archived EXP-ALPF-011 column
      [4, 4, 4, 12] is a GENERATOR-DEGREE list, not a per-variable profile of
      S_4 - decisive because the entry becomes [5, 5, 5, 12] when |FB| = 5, and
      a per-variable profile cannot track the factor base. HEUR-001's
      random_model_justification is factually wrong as written, and the m = 3
      claim rests entirely on the package's own symbolic run, which is sound and
      which the reviewer reproduced independently. No objection to the sympy
      substitution for the absent Sage: the contract names the construction, not
      a CAS, and the resultant over Z[a, b, x_R] is exact with no termination
      heuristic.
    - >-
      THE NEGATIVE CLAIMS IN THE TITLE ARE RE-SCOPED, NOT WITHDRAWN. "Refuted by
      derivation" and "closed at d = 2" carry the closure standard of
      docs/inventor-protocol.md section 4. Refuting IDEA-20260830-84cdb7's H1
      (boundedness in s) needs the LOWER bound only, hence Wilson's rank theorem
      only, so the s <= 8 direct check contributes NO UNCONDITIONAL REFUTATION -
      no finite s-range can refute a boundedness statement. The correct wording
      is "H1 refuted at d = 2, m = 2 CONDITIONAL on Wilson's rank theorem, with
      H-WIL verified directly at e = 2 for s <= 8 (package) and s <= 10
      (review), and at e = 4 for s <= 10 (review)". And the exponent closure of
      (D7) survives at the finite parameters that exist (sigma >= 1.015 at
      (3,256) through 1.125 at (9,256)) for a reason the record does NOT give -
      that 2^s <= p caps s and s >= 2^{m-1} caps m - and it does NOT reach
      m >= 10 at 256-bit p, where the presentation is in its own excluded
      regime and where IDEA-20260808-812554's admission threshold is loosest.
      The closure is weakest where the stake is most attractive, and that
      belongs in its forward guidance.
    - >-
      SCOPE, AND IT IS PART OF THE FINDING RATHER THAN A CAVEAT. The
      block-factored null - a curve-free, target-free, x_R-free object -
      reproduces the Semaev arm's (d_ff, fall_dim) exactly at the deciding cell
      and at (3,2,5); an inhomogeneous version reproduces (5,4) and (13,12) at
      the boundary cells; a dense random polynomial with no block structure does
      the same; and EXP-PFDR-cbdefb's non-curve nodal cubic reproduces the pair
      at every cell from a second engine. THEREFORE NOTHING MEASURED HERE IS A
      STATEMENT ABOUT SUMMATION POLYNOMIALS, ELLIPTIC CURVES OR THE ECDLP. Any
      downstream sentence of the form "the Semaev system at (2,2,3) behaves
      thus" must read "any generator with this block-tensor top form behaves
      thus". Two blinded reviewers converged on this localisation from different
      directions without contact.
    - >-
      THE PRIOR WAS CONFIRMED ON ITS MECHANISM AND REFINED ADVERSELY ON ITS
      REACH. The coordinator_prior of TASK-20260904-642cf5 predicted the (5,4)
      blind value, the (D4)/(D6) fall_dim break, the boundary-cell mechanism,
      the homogeneity diagnosis, the ALPF-011 mislabel, the acceptance of the
      CAS, the Wilson conditionality and the missing non-monomial nearby object
      - all confirmed. It expected the fall_dim clause to fail only at the
      BOUNDARY cells and only for the NULL arm; the reviewer found it failing in
      the SEMAEV arm itself at an exhibited curve and target. The prior's
      expected decision (support scoped to the tested cells) is therefore NOT
      reached, and this decision records that plainly rather than bending the
      verb to the prior.
