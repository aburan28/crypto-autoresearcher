  limitations:
    - >-
      A FIRST FALL DEGREE IS NOT A SOLVING DEGREE, not a cost and not an
      exponent. Nothing on any attack axis moves; Pollard rho is unchallenged
      and unapproached by anything in this package.
    - >-
      THE RESULT IS NOT ABOUT ELLIPTIC CURVES (rationale item 8), which is the
      single easiest sentence for a downstream reader to get wrong.
    - >-
      Toy scale throughout: p in {4099, 65537}, at most 64 columns at the
      deciding cell, s <= 6, m in {2, 3}. The general-s claim rests on Wilson's
      formula, which NO ONE in this round opened - two WebSearch queries and two
      WebFetch attempts failed (HTTP 403, PDF extraction unavailable).
    - >-
      Two of the seven residual-table cells (s = 2^{m-1}) carry ZERO dynamic
      range: there d_ff = ms + 1 is forced for every generator of degree ms, so
      the measured agreement is degree exhaustion, not a degree fall. They are
      instrument checks and must be scored as such.
    - >-
      The deciding cell replicates over 11 distinct instances, not 12 (curve
      1103 at p = 65537 yields the same x_R for both target seeds), and two
      further draws certify only through a doubling with N_sol = 1.
    - >-
      The seed to (a, b, x_R) derivation could not be checked by the re-deriving
      validator (the run script is blind_from). Every checkable consequence is
      consistent.
    - >-
      Whether the row-collapse exception exists at a STRICT-early-fall cell is
      UNDETERMINED, and it decides whether the repaired (D4) needs its N_sol
      side condition only at s = 2^{m-1} or everywhere.
    - >-
      H-TOP at m >= 5 is an open symbolic obligation. The general argument
      offered is GENERIC, and the degenerate specialisations the reviewer hit
      are exactly where genericity fails.
    - >-
      stage0-predictions.yaml was first committed WITH the run package, so its
      own "written before any official rank" flag is self-attested; the binding
      evidence is the contract commit c5742969, 52 minutes before the first run.
      That file also discloses a pre-registration scratch benchmark, disclosed
      by the producer and neutralised by the earlier contract commit.
    - >-
      Correlated judgement: producer and both reviewers report the same model
      family, one recording model_verified true only on string equality between
      the adapter's resolution and the runtime self-report, which is not a
      probe.
    - >-
      This decision was composed by a Coordinator subagent with no shell and no
      interpreter. The counterexample reproduction cited in the evidence record
      was performed by the ORCHESTRATING session and is reproduction of the
      reviewer's implementation, NOT an independent re-derivation. Neither
      tools/check_review_independence.py nor tools/validate_ledger.py was run by
      this subagent.
  next_actions:
    - >-
      THE ONE NEXT ACTION FOR THIS LANE. Run the exhaustive small-prime fall_dim
      sweep at (m, s) = (2, 3) and (3, 4) under a NEW experiment id - all
      non-singular curves, all affine targets, p in {11..43} at s = 3 and
      p in {17..31} at s = 4 - WITH THE ROW-INDEPENDENCE READOUT (rows,
      full_rank) recorded per layer and a flag for full_rank < rows. It answers
      the one undetermined question the counterexample leaves open: whether the
      row-collapse exception exists at a STRICT-early-fall cell or only at the
      boundary cells, and therefore whether the repaired (D4) needs its N_sol
      side condition everywhere or only at s = 2^{m-1}. It is minutes of
      single-core Python on 64- and 4096-column matrices, needs no new tooling,
      and the reviewer's script already takes (p, s) as parameters. Post hoc the
      readout fires at 35 of 240 NULL-2 layers and at none of the 272 Semaev or
      1490 NULL-1 layers, so it is also free diagnostic value on the existing
      arms.
    - >-
      RECORDS THE ORCHESTRATING SESSION MUST ALLOCATE IDENTIFIERS FOR - each a
      SUPERSEDING record, never an edit. (a) An annotation of H-PFDR-4148b8 (D4)
      carrying the row-independence side condition ("whenever no nonzero
      squarefree form of degree a_0 vanishes on supp(S~); a sufficient condition
      is N_sol < 2^{ms - a_0}"), numbering it as a heuristic assumption in its
      own right, and replacing the false exactness justification with the
      Kummer/Lucas argument or the proposal's 2^s <= p bound. (b) An annotation
      of (D6)/P3 restricting it to d_ff at all cells and to fall_dim at the
      strict-early-fall cells, and recording that the two boundary cells test
      neither integer. (c) An annotation of HEUR-001's supporting_results
      recording that the EXP-ALPF-011 archive supports only "total degree 12",
      that m = 3 rests on the package's symbolic run and m = 4 on this review,
      and that m >= 5 is open. (d) An annotation of the title's "refuted by
      derivation" and "closed at d = 2" with the Wilson conditionality and the
      m >= 10 gap. (e) An annotation dropping or marking the D_null_84cdb7
      column at m >= 3, which is the null of a system that does not exist. None
      is created by this decision, and this agent allocated no identifiers.
    - >-
      CARRY THE PAIR, NOT THE INTEGER. Any future mechanism claim in this lane
      must be carried by (d_ff, fall_dim) or by the kernel dimension, never by
      d_ff alone, because a non-tensor top form reaches d_ff = 5 with
      fall_dim 2. Adopt CTRL-RT-1 (a degree-matched, structure-free null that
      holds the generator degree and the inhomogeneity fixed and varies ONLY the
      block factorisation, measured at (6,14) and (14,90) against the Semaev
      (5,4) and (13,12)) and CTRL-RT-2 (an INHOMOGENEOUS block-factored null at
      the boundary cells) as standing controls, since the homogeneous NULL-2 is
      degenerate at s = e.
