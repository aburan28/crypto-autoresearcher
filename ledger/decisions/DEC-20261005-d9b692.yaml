  context: >-
    /design-experiment, one contract. IDEA-20261005-3a18d1 was the first
    candidate. After git merge origin/main fast-forwarded to
    29d5f24b0871b96a933b303125838c8de7686ebe, ledger/hypotheses/H-PAIR-c5e676.yaml
    cites it as source_idea, with experiment EXP-PAIR-cc5e99. It was not
    redesigned. The next undesigned idea in the stated order is
    IDEA-20261005-a5cf85. No hypothesis and no experiment specification
    cites that idea. The branch design/pair-3a18d1-hcp fast-forwarded
    from b0526955e6 to that origin/main commit. No conflict inside an
    immutable record.

    The contract measures the free Z-rank r of the abelianization of the
    norm-one units of one maximal order in the quaternion algebra ramified
    exactly at 3 and infinity. The pre-registered prediction under test is
    r = 0 with a finite norm-one shell. r >= 1 falsifies that reading.
    An infinite shell with r = 0 is a third outcome and is not success.
    No HAWK exponent is claimed. Measured enumeration counts and the
    recalled g >= 2 polynomial-time report are separate columns.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, seeds, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. No field
    required for approval was left null. No unit of the quaternion order
    was enumerated while writing this decision.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading are fixed before any run.
    - The ramification gate and the two meter checks on different rings give the rank a way to come back inconclusive.
    - r >= 1 is a reachable negative result for the finite-torsion reading, so the success criterion can fail.
    - HAWK key recovery and the Eurocrypt 2025 reduction stay unclaimed.

  evidence_refs: []
  limitations:
    - One maximal order at p = 3 only. No transfer to HAWK-512, HAWK-1024, or any other prime.
    - The finiteness pointer (Borel-Harish-Chandra) was not opened. It is the statement under test, not support. KN-OPEN-024 and KN-TECH-081 were read and give no measured rank.
    - This decision authorizes a later run. It does not start one.

