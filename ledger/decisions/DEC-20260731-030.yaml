  dispositions:
    CAMPAIGN_BUDGET_CEILING: >-
      RAISED 20000 -> 34500 on the UNCHANGED measured basis, by
      protocol-amendment-GOAL-AES-001-005 Part A. THIRD BUDGET ACT ON ONE CAMPAIGN
      and recorded as such. Sized bottom-up at per-role measured maxima with NO
      cushion: BATCH-005 8600, BATCH-006 6200, plus 19458 charged = 34258, rounded to
      34500. The standing limit is UNCHANGED IN FORM and now binds at 34500: a
      further amendment is required if measured consumption approaches it, and
      reaching it without one fires the declared pause condition.
    MAXIMUM_BATCHES: >-
      UNCHANGED AT 6, NOT RAISED, AND NOW THE BINDING CONSTRAINT. Four spent, two
      remain. BATCH-005 is the LAST batch that may open new research questions;
      BATCH-006 is reserved for consolidation and the terminal record.
    THE_BINDING_CLOCK: >-
      NAMED. Charged clock: SESSION ELAPSED, authoring-inclusive, dispatcher-observed
      (C1). Stop-condition clock: THE PRODUCER'S OWN COMMITTED UTC STAMPS, with a
      first-act stamp carrying a computed binding_stop_utc, boundary stamps, a halt
      at binding_stop_utc, and the stamps committed as a declared artifact (C2).
      Discharging C2 is FULL COMPLIANCE even where the charged figure exceeds the
      declaration (C3). Declarations are calibrated against authoring-inclusive
      elapsed with compute reported separately (C4). Compute seconds may NO LONGER be
      offered as budget compliance — prospective only, and TASK-20260801-806 is not
      re-graded.
    D_811_3: >-
      CLOSED. The charged figure is the LARGEST session-elapsed figure on the record
      from any source; all figures are preserved with sources named and none is
      deleted; producer stamps GOVERN the timeline and the largest-figure rule
      governs the charge. The mechanism — a producer stamp ends at the final write
      and cannot cover the task's tail — explains the 1180/1370 gap rather than
      adjudicating between honest parties. Applied to TASK-20260801-809 the rule
      returns 1370, the figure already charged, so nothing is re-charged.
    COORDINATION_ACT_UNDERCOUNT: >-
      FOUND AND FIXED PROSPECTIVELY. From BATCH-005 every coordination act is
      dispatched as a queue task and charged at measured session elapsed. The
      historical under-count across BATCH-001..004 is UNQUANTIFIED AND UNRECOVERABLE
      and is NOT reconstructed, because reconstructing durations nobody recorded
      would be fabrication (AGENTS.md rule 9).
    D_808_1: >-
      UPHELD AND RESTATED. "At least one manifest per task, designated the COVERING
      manifest, carries an artifact_provenance list covering every declared artifact
      of the task; every other manifest of the task must appear as an ENTRY in it."
      Prospective from BATCH-005; the TASK-20260801-808 acceptance stands.
    D_808_2_AND_D_809_7: >-
      CLOSED. The four Part B class names are CLOSED and CASE-INSENSITIVE, with an
      explicit alias rule resolving machine-readable structured-data artifacts
      (including `machine_readable_prescreen`) to MACHINE_READABLE_MANIFEST. A value
      outside the vocabulary is a DEFECT TO REPORT, never a fifth class to invent.
      Prospective from BATCH-005.
    GOAL_STATUS: >-
      GOAL-AES-001 CONTINUES AND REMAINS `active`. IT IS NOT PAUSED: the budget-linked
      pause condition did not fire, because the amendment it required was authored and
      approved rather than declined. It is NOT `completed` and cannot be — no
      completion criterion is met, and under inference-amendment 0137a051 a
      three-distinct-model closure quorum is unobtainable in this harness. NO
      completion_quorum block is created and NO ATTESTATION IS RECORDED.
    HYPOTHESIS_STATUS_CHANGES: >-
      NONE. No hypothesis record exists for GOAL-AES-001 and none is created here.
    PROMOTION_GATE_4: >-
      UNCHANGED AND NOT RE-SCOPED. DEC-20260731-017's ruling stands in full: its
      independent-confirmation half is STRUCTURALLY UNSATISFIABLE under this harness,
      no promotion may rest on a validator-plus-red-team pair resolving to one model,
      and routing a genuinely different backend for at least one reviewer remains the
      standing precondition for any future asymptotic promotion.

  limitations:
    - >-
      THIS DECISION ASSERTS NOTHING ABOUT AES. It approves a budget ceiling, a clock
      convention and two provenance errata. It produces no distinguisher, no key
      recovery, no bound, no barrier statement and no claim at any round count, and
      no part of it may be cited as cryptanalytic evidence.
    - >-
      IT REVIEWS NO NEW EVIDENCE. No EV-* record is created, no experiment was run,
      no artifact was produced or validated. It rests entirely on records already
      committed at 2d440416 plus the amendment authored alongside it.
    - >-
      34500 IS A SIZING, NOT A PREDICTION. The campaign has NO calibrated basis for
      predicting measured cost — the over-declaration series has flattened to parity
      and the ratio may not be used as an expectation. Sizing at per-role maxima
      reduces but does not eliminate the chance of a FOURTH budget act.
    - >-
      THREE OF THE EIGHT BATCH-005 SIZING LINES — snapshot archive, ledger archive
      and coordination act — REST ON DECLARATIONS NO CLOCK EVER TESTED. The measured
      figures underlying the rest are REPORTED, NOT INSTRUMENTED, and no
      BATCH-001..004 duration is re-derivable from this tree.
    - >-
      THE 19458 s "CHARGED TO DATE" LEG IS AN UNDERSTATEMENT, because coordination
      acts were charged at zero for four batches. That softness runs in the direction
      that favours continuing, and it is stated against this decision's own interest.
    - >-
      COMMITTED UTC STAMPS ARE PRODUCER ATTESTATION, NOT A MECHANISM. The V-804-2
      lesson applies unchanged: a producer-written timestamp is a string the producer
      wrote. Part B makes the timeline READABLE AND CONSISTENT, not PROVEN, and it
      installs no instrumented timer.
    - >-
      THE DECISION TO CONTINUE WAS UNAVOIDABLY TAKEN WITH BATCH-004's OUTCOMES IN
      VIEW. That is disclosed rather than defended; the amendment's
      confirmatory_status_note answers the "criterion changed after an outcome" charge
      on three checkable grounds, of which the strongest is that the amendment was
      REQUIRED AT THIS POINT BY THE CAMPAIGN'S OWN PRIOR TEXT (amendment 003's
      standing_limit, written before BATCH-003 ran).
    - >-
      THE RANKING IN next_actions IS A JUDGEMENT, NOT A MEASUREMENT. It rests on the
      target-result profile's exponent-first bias, on the Coordinator contract's
      pairing requirement, and on the batch-count constraint — not on evidence that
      either candidate will yield anything. Both may return nothing, and returning
      nothing is a legitimate outcome that will be recorded as such.
    - >-
      CROSS-MODEL INDEPENDENCE REMAINS UNAVAILABLE campaign-wide under
      inference-amendment 0137a051; `model_verified` remains false throughout this
      campaign; and `doctor --probe` has been run by no task of it. NO ATTESTATION IS
      RECORDED and none may be.
    - >-
      THIS RECORD IS AUTHORED BEFORE ITS OWN COMMIT AND CANNOT CARRY THAT COMMIT'S
      SHA. It is NOT DURABLE until the post-commit verifier accepts the isolated
      coordination commit carrying it, the amendment and the goal checkpoint, and
      until that branch is pushed with an open PR against main naming both records.

