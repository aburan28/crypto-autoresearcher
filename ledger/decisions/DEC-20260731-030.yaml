coordinator_decision:
  id: DEC-20260731-030
  context: >-
    THE PAUSE-OR-CONTINUE DECISION FOR GOAL-AES-001, taken ON
    protocol-amendment-GOAL-AES-001-005 and on nothing else. This is the single
    next action of DEC-20260731-017, discharged exactly as that decision framed it:
    the amendment is AUTHORED FIRST and the decision is taken ON IT, with NO
    BATCH-005 research queue drafted and no handoff issued, because a queue drafted
    against a number that does not exist is drafted against nothing. The committed
    starting state is the BATCH-004 ledger archive 2d440416cfabe8330c2398e1835f3e84
    593cacb4 with goal checkpoint f6fe38b1. FOUR of six batches are spent; on the
    measured basis of protocol-amendment-GOAL-AES-001-003, 19458 of the 20000 s
    ceiling are charged and ROUGHLY 542 REMAIN, which is an order of magnitude less
    than BATCH-005's minimum credible shape. Amendment 003's `standing_limit`
    requires a further amendment at exactly this point and the declared pause
    condition fires if it is declined. THIS DECISION APPROVES IT. It concerns a
    resource counter, a clock and a provenance vocabulary; IT ASSERTS NOTHING ABOUT
    AES, at any round count, and nothing below should be read as a cryptanalytic
    result.
  decision: approve
  target_ids:
    - GOAL-AES-001
    - protocol-amendment-GOAL-AES-001-005
    - DEC-20260731-017
    - DEC-20260731-016
    - DEC-20260731-015
    - RQ-AES-001

  id_provenance: >-
    DEC-20260731-030 WAS VERIFIED FREE HERE by directory listing of
    ledger/decisions: the highest existing AES-campaign decision is
    DEC-20260731-017 and no DEC-20260731-030 exists on this tree. KN-FIND-019
    remains RESERVED AND UNALLOCATED (see knowledge_promotion). No EV-* record is
    created by this decision, because no new evidence is produced or reviewed by
    it. If a concurrent branch has published DEC-20260731-030 by merge time, the
    collision is resolved by a CORR record — CORR-20260731-006 is the next free
    correction ID — and NEVER by editing a committed record (the CORR-20260731-005
    precedent).

  # ===================================================================
  # PROCEDURAL NOTE ON THIS SESSION
  # ===================================================================
  session_provenance: >-
    A prior Coordinator session was assigned this exact task and TERMINATED ON AN
    API SESSION LIMIT BEFORE WRITING ANYTHING. The working tree was clean and no
    partial artifact existed, so this session started fresh rather than resuming.
    Recorded because it is an infrastructure fact about how this record came to be
    written, and because AGENTS.md rule 5 governs it: a session limit is
    infrastructure signal and is not evidence about the campaign, the budget, or
    the difficulty of this decision.

  rationale:
    - >-
      THE AUTHORIZATION IS THE USER'S, IT WAS OBTAINED ON A SPECIFIC DISCLOSURE, AND
      BOTH ARE RECORDED SO THE APPROVAL IS AUDITABLE RATHER THAN ASSUMED. The
      dispatching session put the position to the user and reports the reply as the
      single word "Continue". WHAT WAS PUT TO THEM, verbatim in substance: that
      CONTINUING MEANS RAISING THE CEILING A SECOND TIME — the THIRD budget act on
      one campaign, after amendment 001's 10800 -> 20000 raise and amendment 003's
      declared -> measured re-basing — on a campaign which, FOUR BATCHES IN, HAS
      PRODUCED NO CLAIM ABOUT AES and has spent ZERO cryptanalytic compute on AES
      itself; and that against that stand three things: A REAL BOUND AT ONE
      INTERFACE (Proposition 806-1, B >= q = 256 for the F-linear round-independent
      subclass, re-derived lemma by lemma and reproduced exhaustively in two
      analogues by an independent session), TWO KNOWLEDGE ENTRIES (KN-FIND-017 and
      KN-FIND-018), and AN OPEN CANDIDATE NOW DEMONSTRABLY WRONGLY DISCARDED
      (CAND-806-A's bounded-index-subgroup residual, killed at n = 30 under a rule
      its sibling screen says gives n = 1, RT-8, traceable to this Coordinator's own
      guidance, D-811-2). THE DISCLOSURE WAS ADVERSE-LEANING BY DESIGN and led with
      the failure rather than the consolation. THE PAUSE CONDITION THEREFORE DOES
      NOT FIRE. What the reply authorizes: the raise and the continuation. What it
      does not authorize: any widening of scope, claim tier, authority, review
      requirement or completion criterion, any raise of maximum_batches, and any
      change to this Coordinator's configuration or permissions. A user reply
      relayed by a session is authority for a research act; it is not, and is not
      treated as, authority for anything else.
    - >-
      THE DECISION IS TAKEN ON THE MERITS AND WOULD BE THE SAME ON THEM, WHICH IS
      WHY THE AUTHORIZATION IS RECORDED AS PERMISSION RATHER THAN AS REASON.
      DEC-20260731-017 already weighed the pause seriously and ruled against it on
      two grounds, and this decision adopts both after re-reading the record rather
      than inheriting them. FIRST AND DECISIVE: BATCH-004's OWN RED TEAM
      DEMONSTRATED THAT THE CAMPAIGN SCREENED OUT ITS BEST REMAINING
      EXPONENT-RELEVANT CANDIDATE ON AN ERRONEOUS CONSTANT, and the error is the
      Coordinator's. CAND-806-A's residual is the type-stable invariant a repair of
      the induction would need, is EXPLICITLY OPEN, and HAS BEEN ATTEMPTED BY NOBODY.
      Pausing now would close the campaign ON A DEMONSTRATED SCREENING ERROR — the
      premature-closure failure docs/inventor-protocol.md names as symmetric with
      overclaiming, in its sharpest form: not a general reluctance to search, but a
      specific candidate wrongly discarded and KNOWN to be wrongly discarded. SECOND:
      three MAJOR red-team findings (RT-1, RT-2, RT-3) and one unresolved MODERATE
      (RT-5) are settled by ONE bounded control, CTRL-810-A, which is simultaneously
      HEUR-806-1's own already-specified validation experiment, and the Coordinator
      contract REQUIRES a conditional result to be paired with heuristic validation
      in the same or the FOLLOWING batch. BATCH-005 IS THAT FOLLOWING BATCH. Leaving
      RT-1, RT-2 and RT-3 unsettled while the package that provoked them stands
      committed is worse than leaving them unraised.
    - >-
      THE CASE FOR PAUSING IS REAL AND IS RESTATED HERE RATHER THAN SUMMARISED AWAY,
      BECAUSE A DECISION THAT ONLY RECORDS ITS WINNING SIDE IS NOT A DECISION. Four
      batches have produced NO cryptanalytic result and NO claim about AES at any
      round count. The campaign's only exponent-relevant question, OD-4 as literally
      posed, is now answered NO at the closure standard. The only cost model the
      campaign built was VOIDED by its first red-team pass. NO gate package stands
      and nothing has ever moved beyond `analyzed`. Promotion gate (4)'s
      independent-confirmation half is STRUCTURALLY UNSATISFIABLE under this harness.
      `completed` is UNREACHABLE regardless of outcome under inference-amendment
      0137a051. And continuing requires a THIRD budget act whose two predecessors
      both rested on a fact that MEASUREMENT HAS NOW DESTROYED. A reasonable
      Coordinator could pause here on that record, and a pause on a committed
      rationale is legitimate and is not failure. IT LOSES ON THE TWO GROUNDS ABOVE,
      AND ON NOTHING ELSE — not on sunk cost, not on the two knowledge entries, and
      not on the hope of a result.
    - >-
      THE CEILING IS SET AT 34500 s ON THE UNCHANGED MEASURED BASIS, AND THE FIGURE
      IS SIZED BOTTOM-UP FROM MEASUREMENT RATHER THAN CHOSEN FOR CONVENIENCE. The
      prior justification is EXHAUSTED and this amendment is forbidden to borrow it:
      the over-declaration series 2.51x -> 1.55x -> 1.28x -> ~1.01x HAS FLATTENED TO
      PARITY, declared and measured are now the same thing, TWO producer tasks ran
      OVER for the first time, and no ratio may be used as an expectation again. The
      sizing uses PER-ROLE MEASURED ACTUALS AT OR NEAR THE OBSERVED MAXIMUM, not the
      mean, and adds NO cushion on top: producer 1600 (against 792, 892, 1609, 1510);
      snapshot 500 (against 378 measured, 350 unmeasured); validation 1400 (against
      1046, 1370); red team 1000 — NOT the single observed 668, because the red team
      itself warns that ONE TASK IS NOT A DISTRIBUTION; ledger archive 900 (against
      two unmeasured 800s); coordination 700-900 by analogy with the ledger role.
      BATCH-005 at two concurrent producers plus a full review chain sizes to 8600;
      BATCH-006 as a one-producer consolidation and terminal-record batch sizes to
      6200. 19458 + 8600 + 6200 = 34258, SET AT 34500, with the 242 s difference
      declared as ROUNDING TO A REPORTABLE FIGURE and explicitly NOT a cushion — it
      is smaller than a single task of any role and buys no work.
    - >-
      SIZING SURFACED A REAL ACCOUNTING DEFECT AND IT IS FIXED PROSPECTIVELY RATHER
      THAN LEFT: THE CAMPAIGN HAS BEEN CHARGING ITS OWN COORDINATION AT ZERO.
      charged_to_date has only ever counted QUEUE TASKS. Drafting a queue, authoring
      an amendment and taking a decision consume real session elapsed and have been
      free for four batches — the same species of error amendment 003 corrected in
      the opposite direction. From BATCH-005 EVERY COORDINATION ACT IS DISPATCHED AS
      A QUEUE TASK with a declared budget and charged at measured session elapsed.
      NOT RETROACTIVE: re-charging four batches on durations nobody recorded would be
      fabrication under AGENTS.md rule 9, so the historical under-count is recorded
      as UNQUANTIFIED AND UNRECOVERABLE. THE HONEST CONSEQUENCE, STATED AGAINST THIS
      DECISION'S OWN INTEREST: 19458 is an UNDERSTATEMENT, so the "charged to date"
      leg of the ceiling arithmetic is soft in the direction that favours continuing.
    - >-
      THE BINDING CONSTRAINT HAS SWITCHED BACK, AND IT IS NOW THE BATCH COUNT. THIS
      IS RULED EXPLICITLY BECAUSE IT SHAPES WHAT THE REMAINING BATCHES SHOULD
      ATTEMPT. Before this decision, SECONDS BOUND FIRST: 542 s against two batches,
      exactly as DEC-20260731-017 recorded. After it, 14800 s covers two batches at
      measured maxima and SECONDS NO LONGER BIND. maximum_batches STAYS 6, is NOT
      raised, and was NOT put to the user as raisable. BATCH-005 AND BATCH-006 ARE
      THE LAST TWO. THE OPERATIVE CONSEQUENCE, BINDING ON THE BATCH-005 QUEUE:
      BATCH-005 IS THE LAST BATCH THAT MAY OPEN NEW RESEARCH QUESTIONS, because
      BATCH-006 must be reserved for consolidating, reviewing and writing the
      terminal record of whatever BATCH-005 produces. Any exponent-relevant object
      not attempted in BATCH-005 will not be attempted on this campaign; it will be
      named as OPEN AND UNATTEMPTED, which is a legitimate outcome, and it will NEVER
      be recorded as tried, screened or negative (AGENTS.md rules 5 and 8). RAISING
      SECONDS WHILE HOLDING BATCHES FIXED DOES NOT BUY THE CAMPAIGN A RESULT; it buys
      it the ability to finish the two batches it was already permitted, at the cost
      the work actually has.
    - >-
      THE CLOCK IS NAMED, AND THE UNEVALUABLE PRODUCER STOP IS REPLACED BY AN
      AUDITABLE PROXY DUTY. THE DIAGNOSIS IS ADOPTED IN FULL: amendment 003 charges a
      DISPATCHER-OBSERVED quantity while imposing the halt duty on a PRODUCER WHO
      CANNOT OBSERVE IT, so the stop condition is UNEVALUABLE. TASK-20260801-806
      measured COMPUTE (67 s of 1600) and reported no overrun; TASK-20260801-807
      measured SESSION ELAPSED (~1510 of 1200) and self-reported one as DEV-807-4
      with the dropped work named; NEITHER MISREAD ITS CARD, BECAUSE THE CARD DOES
      NOT SAY. One instrument with no units, a COORDINATOR-SIDE fault, and neither
      producer is charged. THE RULING, ENACTED AS PART B OF AMENDMENT 005: (C1) the
      CHARGED clock is SESSION ELAPSED, authoring-inclusive, from first act to
      terminal receipt; (C2) the STOP condition is evaluated against the PRODUCER'S
      OWN COMMITTED UTC STAMPS — a stamp as the first act carrying start_utc,
      declared budget and a COMPUTED binding_stop_utc, a stamp at every major section
      boundary, a halt at binding_stop_utc, and the stamps COMMITTED as a declared
      artifact; (C3) a producer that discharges C2 HAS COMPLIED IN FULL even if the
      charged figure later exceeds its declaration, and any residual difference is a
      campaign-side accounting fact and NEVER a producer defect; (C4) declarations
      are calibrated against AUTHORING-INCLUSIVE elapsed with the compute component
      reported separately, since both BATCH-004 overruns were authoring (67 s and
      ~254 s of compute against 1609 s and 1510 s elapsed). C3 IS THIS COORDINATOR'S
      ADDITION TO THE RECOMMENDATION AND IS THE CLAUSE THAT ACTUALLY CLOSES THE
      FAULT: without it a producer would still be exposed to a clock it cannot see.
      THE DUTY IS NOT SPECULATIVE — TASK-20260801-809 and TASK-20260801-810 BOTH DID
      THIS VOLUNTARILY when the rule was unclear, and BOTH CAME IN WITHIN BUDGET;
      TASK-810's `budget` block, with its five boundary stamps and its explicit
      binding_stop_utc of 2026-08-01T16:21:29Z, is named as the reference
      implementation to copy.
    - >-
      D-811-3 IS SETTLED, WITH A MECHANISM RATHER THAN A PREFERENCE. Three
      session-elapsed figures exist for TASK-20260801-809 — 1336 and 1370
      dispatcher-reported, ~1180 self-reported at its final write — and none is
      re-derivable from the tree. THE RULE (C5): THE CHARGED FIGURE IS THE LARGEST
      SESSION-ELAPSED FIGURE ON THE RECORD FROM ANY SOURCE; every other figure is
      PRESERVED in the task record marked `on_record_not_charged` with its source
      named, and NO SPREAD IS EVER RESOLVED SILENTLY OR BY DELETING A FIGURE. TWO
      GROUNDS, AND THE SECOND IS THE ONE THAT MATTERS: (1) the TASK-20260801-808
      ruling that the campaign does not get to under-charge itself by using the
      smaller of two clocks; (2) A PRODUCER STAMP SYSTEMATICALLY UNDERSTATES BY
      CONSTRUCTION, because its last stamp is at its final write and the task's tail
      — finalization, terminal receipt, handback — falls after that stamp and inside
      the session the campaign is charged for. 1180 against 1370 IS EXACTLY THAT GAP,
      and it is EXPLAINED rather than treated as one party being wrong. A SECOND
      DISTINCTION IS KEPT DELIBERATELY: for establishing WHAT HAPPENED the producer's
      committed stamps GOVERN, because they are readable from committed bytes; for
      establishing WHAT IS CHARGED the largest-figure rule governs. NOT RETROACTIVE,
      and it does not need to be: applied to TASK-809 the rule returns 1370, which is
      exactly what DEC-20260731-017 already charged, so nothing is re-charged and no
      committed figure changes. D-811-3 IS CLOSED BY THE RULE PRODUCING THE SAME
      ANSWER — recorded as a fact, not offered as a vindication.
    - >-
      THE TWO PART-B ERRATA ARE CARRIED HERE, AND THEY BELONG HERE ON THE MERITS AND
      NOT MERELY BECAUSE DEC-20260731-017 ASSIGNED THEM. Both are Coordinator-side
      DRAFTING faults in amendment 004 Part B, both were found at Part B's FIRST
      exercise at the TASK-20260801-808 snapshot archive, and BOTH BIND ON THE
      BATCH-005 PRODUCERS AND SNAPSHOT ARCHIVE — issuing BATCH-005 cards under a
      clause already known to be unsatisfiable as written is exactly the failure this
      program refuses. D-808-1 is UPHELD, NOT OVERTURNED, on the TASK-20260801-809
      validator's DECISIVE EMPIRICAL ground that the literal reading DEMONSTRABLY
      GENERATES DIGESTS NO PARTY CAN VERIFY, an argument that was not available to
      this Coordinator at snapshot time; the clause is restated as "AT LEAST ONE
      manifest per task, DESIGNATED THE COVERING MANIFEST, carries an
      artifact_provenance list covering every declared artifact of the task; EVERY
      OTHER MANIFEST OF THE TASK MUST APPEAR AS AN ENTRY IN IT". D-808-2 / D-809-7 is
      closed by declaring the four class names CLOSED AND CASE-INSENSITIVE with an
      EXPLICIT ALIAS RULE — any machine-readable structured-data artifact, including
      the `machine_readable_prescreen` that generated the erratum, resolves to
      MACHINE_READABLE_MANIFEST — and by ruling that a value outside the vocabulary
      is A DEFECT TO REPORT, never a fifth class to invent. BOTH ARE PROSPECTIVE FROM
      BATCH-005 AND NEITHER IS RETROACTIVE: no BATCH-004 artifact is failed,
      re-scored or withdrawn, and the TASK-20260801-808 acceptance stands in full.
    - >-
      WHAT THIS DECISION DOES NOT DO, STATED SO NO LATER RECORD CAN READ IT WIDER.
      It creates NO hypothesis and changes NO hypothesis status; none exists for this
      campaign. It promotes NOTHING and satisfies NO promotion gate. It does NOT
      re-scope promotion gate (4), whose independent-confirmation half
      DEC-20260731-017 recorded as STRUCTURALLY UNSATISFIABLE under this harness —
      re-scoping a review requirement is a separate amendment on its own rationale.
      It records NO closure attestation and creates no completion_quorum block; under
      inference-amendment 0137a051 `completed` remains UNREACHABLE for this goal. It
      lifts NO standing constraint: GATE-601-A remains NOT dispatched, the BATCH-003
      instrument stand-down remains in force, NO reject_scoped of the
      round-independent single-word deterministic class may be considered until a
      control ISOLATES the ingredient it negates (V-804-1, undischarged for the third
      consecutive batch), Proposition 806-1 may be cited ONLY at one interface for
      the F-linear subclass and never as a cost inequality and never with U-809-1
      dropped, and section 5's cost table remains STRUCK. AND IT ASSERTS NOTHING
      ABOUT AES, at any round count, in any form.

