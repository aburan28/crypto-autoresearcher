  standing_authorization: >-
    AGENTS.md standing user authorization (user instruction, 2026-09-06:
    "all is approved. ideas/experiments should be always approved")
    would be the user-approval basis for a complete runnable protocol.
    It is not applied here. check_approval_capacity would reject an
    approving decision, and the doubling-sum character driver does not
    exist, so the contract cannot report execution_state ready. This
    decision does not assert that the absolute sum is at least N/4,
    does not assert that the absolute sum is below N/4, and does not
    rewrite IDEA-20261006-5db10b.

  decision: revise
  decision_label: >-
    Specify H-ECDLP-e6772e and leave EXP-ECDLP-340a9e at
    review_required. approved_by stays null. The executor is not
    dispatched.

  target_ids:
    - RQ-ECDLP-4fcbd3
    - IDEA-20261006-5db10b
    - H-ECDLP-e6772e
    - EXP-ECDLP-340a9e
