  context: >-
    One cycle of design-experiment plus propose-ideas.
    IDEA-20261006-5db10b is on origin/design/ssi-e211ac-distance and
    is not on origin/main. The question is RQ-ECDLP-4fcbd3. No
    hypothesis or experiment on origin/main cites that full idea id.
    The branch design/ecdlp-5db10b was created from origin/main at
    9e25fddba6d9d9a397521b2b0456e7ff18edb1c8. git merge origin/main
    was already up to date. No conflict. The copied proposal bytes
    are blob a4e66c7ea93da948ee9f0eb8956af2d90621391d and parsed as
    YAML without a quote change. The question id is RQ-ECDLP-4fcbd3.
    The prediction is that the absolute sum of χ(s(P)), divided by
    N, is at least 1/4, with s(P) = x(P) + x(2P) on
    y^2 = x^3 + x + 3 over F_47.

    python3 tools/portfolio_kpis.py --capacity GOAL-ECDLP-001 reports
    approved_unrun=7, cap=3, headroom=0. The seven contracts are
    EXP-ECDLP-08f99d, EXP-ECDLP-96c4dc, EXP-ECDLP-b2e5d1,
    EXP-ECDLP-c74a83, EXP-LHW-22aefa, EXP-SEMAEV-a097b5, and
    EXP-SMTH-9d04ba. This decision does not name any of them under
    supersedes_experiments or withdraws_experiments.
    check_approval_capacity is the validator check that would reject
    an approving decision. The contract therefore stays
    review_required.

    The missing driver is a program that enumerates
    y^2 = x^3 + x + 3 over F_47, evaluates both formulas for
    s(P) = x(P) + x(2P), sums χ(s(P)), compares the absolute value
    with N/4, draws 200 uniform signings, and runs the even-order
    instrument on y^2 = x^3 + x over F_47. A search of origin/main
    for the phrases "x(P) + x(2P)" and "doubling-sum" under *.py
    returned no path. experiments/EXP-ECDLP-1ed445/run_character_sum_ladder.py
    measures a discrete-log Fourier coefficient of a factor base at
    20 to 26 bits and does not evaluate this sum. There is no
    trial-plan.json. The only file under runs/ is .gitkeep.
    newest_experiments.py does not report execution_state ready
    while status is review_required.

    Success is the source idea's prediction. The concrete negative
    is an absolute sum strictly below N/4, with the two formulas in
    agreement and the even-order instrument passed. No sum was
    evaluated in this session. The same pass files
    IDEA-20261007-c79278, IDEA-20261007-fad964, and
    IDEA-20261007-7541f8 and does not design them. Proposals on
    origin/main for RQ-ECDLP-4fcbd3 and the idea files on pull
    requests 1968 and 1967 were read before those three claims were
    written. The idea-generator was not dispatched. The coordinator
    wrote the three records in this pass.

  rationale:
    - The standing authorization covers a complete runnable protocol. This one is over the approval cap and has no doubling-sum character driver, so it is not approved.
    - check_approval_capacity is the named validator check. GOAL-ECDLP-001 has approved_unrun=7 against cap 3. An approving decision would be rejected. This decision does not force approved.
    - The missing driver is the doubling-sum character census on y^2 = x^3 + x + 3 over F_47, including the 200 signings and the even-order instrument on y^2 = x^3 + x over F_47. No program on origin/main evaluates that sum.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - An absolute sum strictly below N/4, with the instrument checks passed, is reachable as a recorded outcome, so success is not automatic.
    - The two formulas, the random signings, the nearby χ(x) sum, and the even-order instrument are the controls.
    - An instrument failure is not relabeled as an absolute sum below N/4.
    - This session did not evaluate the sum and did not claim that the exponent 1/2 moves.
    - No run id was minted. The replication plan does not name a future run slot while the trial plan is unfrozen.

  evidence_refs: []
  limitations:
    - The measurement, once run, covers one curve over F_47. It does not transfer to another curve or to cryptographic size.
    - A sum at least N/4 does not lower the rho exponent 1/2.
    - A null overlap and a crash are not the negative.
    - This decision does not authorize execution.
    - This decision does not edit a goal head.
    - The three new proposals are not hypotheses and are not approved experiments.

  next_actions:
    - A later session may approve EXP-ECDLP-340a9e only after check_approval_capacity reports headroom on GOAL-ECDLP-001 and a doubling-sum character driver exists. Both were absent on 2026-10-07.
    - Do not dispatch TASK-20261007-c5aaf0 from the design session that wrote this decision.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
