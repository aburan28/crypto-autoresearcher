  official_status_changes_note: >-
    H-ECTD-19017a's status field is unchanged (specified); its notes gained
    an entry recording this revision cycle, which is not a status
    transition. GOAL-ECTD-001 stays active.

  knowledge_promotion:
    promote: false
    promoted: []
    warranted: false
    not_warranted: >-
      No empirical or theoretical finding is produced by this decision --
      it approves a contract, it does not report a result. Nothing here
      meets any knowledge-promotion bar because there is no measurement to
      promote. The methodological pattern this batch demonstrates (a
      dispatched independent review before approval catching a
      not-yet-executed requirement gap from the very decision that opened
      the lane) is a candidate lesson but rests on a single instance and is
      recorded here, not curated, per the same discipline this program
      applies to every single-instance candidate.

  limitations:
    - >-
      UNRELATED PRE-EXISTING FINDING, disclosed here rather than silently
      worked around: while auditing every commit SHA referenced by this
      batch's records for fabrication (prompted by catching myself about to
      write a fabricated full SHA for 87ba5ae7 before correcting it to the
      real value), I checked `git cat-file -e` against every 40-hex-char
      string this batch's files reference and found one that predates this
      batch and is NOT mine: 189678cb4027c943a144218873fdce3f3165bb8e (the
      BATCH-002 design-snapshot commit, cited by EV-ECTD-002, H-ECTD-001.yaml,
      EXP-ECTD-001/specification.yaml, and GOAL-ECTD-001.yaml's BATCH-002
      checkpoint) is unreachable from any branch in this repository. This is
      likely covered by CLAUDE.md's content-first fallback
      (`research_dispatch.py` verifies declared path_sha256 against the tree
      even when a commit cannot be reached, per the existing
      SELF-REFERENCING-RECEIPT-FINDING.md precedent for a related class of
      issue), so it is not treated here as evidence those BATCH-002 records
      are wrong -- only that their commit_sha field cannot be independently
      reached, and this was not previously flagged anywhere I could find.
      Not investigated further or corrected in this decision, since it
      predates and is outside BATCH-e722dd's write scope; flagged for a
      future batch or a dedicated correction record.
    - >-
      No implementation exists yet; D2's and D3's fixes are requirements on
      the driver, not code, and remain unverified until the impl run
      actually exercises them.
    - >-
      D4's cost estimate is a rough order-of-magnitude figure, not measured;
      the actual search cost is unknown until the impl run reports it, and
      the budget may still prove insufficient.
    - >-
      Inference fallback: requested coordinator-orchestration-code, resolved
      claude-sonnet-5, model_verified false. TASK-20260806-2dcce2 likewise
      recorded fallback_used true against review-adversarial, so this
      Coordinator archive and its sole independent review ran on the same
      model family. A real independence limitation of this harness, recorded
      rather than glossed, matching the same limitation recorded in
      DEC-20260801-005 and DEC-20260806-4a9604.
    - >-
      Only one independent review round was run. A more adversarial process
      would re-dispatch a fresh independent pass on v2 itself before
      approval; this decision instead self-verifies the fixes against the
      reviewer's own stated criteria (case enumeration for D1, direct code
      reading for D2/D3/D5, explicit estimate for D4) rather than commissioning
      a second full independent agent round. Disclosed as a real, if bounded,
      gap rather than presented as equivalent to a second independent pass.

