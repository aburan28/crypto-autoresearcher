coordinator_decision:
  id: DEC-20260806-160175
  goal_id: GOAL-ECTD-001
  batch_id: BATCH-e722dd
  recorded_by_task: TASK-20260806-a62a8b
  authorized_by: DEC-20260806-4a9604
  recorded_at: '2026-08-06'

  context: >-
    BATCH-e722dd is GOAL-ECTD-001's design-stage batch for IDEA-20260731-017
    (large-conductor vertical barrier), opened per DEC-20260806-4a9604's
    next_action. TASK-20260806-e693bb converted the idea into H-ECTD-19017a
    and froze EXP-ECTD-9e4248 v1 at review_required, after independently
    re-verifying (not trusting revise_status alone) that all five of
    TASK-20260731-049's BATCH-002 revise conditions for this idea are
    present in its current text. TASK-20260806-06bbf4 snapshot-archived that
    design package at commit d4d5e8df1341a9be677bdd671300a8af3e8ccbad
    (parent 4b08897c). TASK-20260806-2dcce2 (independent red-team,
    independent_session: true) then reviewed the frozen v1 contract and
    returned verdict revise, finding five concrete defects (D1-D5,
    documented in full in
    coordination/goals/GOAL-ECTD-001/batches/BATCH-e722dd/reviews/TASK-20260806-2dcce2/red_team_report.yaml),
    most seriously D3: v1 never addressed this very goal's own
    DEC-20260806-4a9604's explicit requirement to fix EXP-ECTD-001's
    exact-width-prime sampling gap before this driver runs.

  decision: approve
  decision_label: approve_design_contract_v2_after_incorporating_five_red_team_fixes
  decision_vocabulary_note: >-
    `approve` here means the DESIGN CONTRACT (H-ECTD-19017a +
    EXP-ECTD-9e4248) is admissible for future execution. It authorizes
    neither this batch nor any specific future batch to run it -- that
    dispatch happens when GOAL-ECTD-001's campaign budget and priority
    ordering next select this lane (see next_actions below). No run has
    occurred; this decision produces no empirical finding of any kind.

  what_was_fixed:
    - id: D1
      severity: blocking
      fix: >-
        decision_table's false "mutually exclusive and exhaustive" claim
        corrected. Added moderate_effect_unresolved as the exact logical
        complement of discontinuity_nominates_endpoint and continuity_scoped
        over the completed-and-valid outcome space (not an enumerated
        special case -- an earlier enumerated attempt still missed one
        residual case: KS rejects exchangeability but no single edge
        individually crosses the 100x/d_reg-2 threshold). Verified
        exhaustive and mutually exclusive by direct enumeration of all 6
        reachable (ks_rejects, any_edge_ge_100, all_edges_in_band)
        combinations before being accepted, not by assertion.
    - id: D2
      severity: blocking
      fix: >-
        CTRL-HORIZONTAL-BASELINE now requires a same-conductor certificate
        on both endpoints of every horizontal comparison pair (reusing the
        same conductor-computation code CTRL-END-RING-CERTIFICATE requires
        for vertical edges), correcting the unearned "already characterized"
        claim -- EXP-ECTD-001's neighbor-walking code was independently
        confirmed (by the red-team reviewer, re-checked here) to verify only
        group-order preservation, never conductor/level.
    - id: D3
      severity: blocking
      fix: >-
        Added n_bit_range_sampling_requirement as a HARD requirement in
        inputs: the driver must not reuse driver/fp.py's random_prime
        unmodified (confirmed to return an exact-width prime by its own
        docstring), and must instead either fix the sampler to draw a
        genuine range or draw a distinct per-seed target bit-length and
        report the achieved distribution -- directly discharging
        DEC-20260806-4a9604's next_actions instruction, which this fix cites
        by ID.
    - id: D4
      severity: non-blocking
      fix: >-
        Added conductor_search_cost_estimate to replication: names the
        rough order-of-magnitude search cost, states the preferred
        construction method (Hilbert class polynomial route, which fixes
        the conductor by construction rather than searching for it), and
        requires the observed attempts-per-success rate to be reported in
        the run manifest if search-and-filter is used as a fallback.
    - id: D5
      severity: non-blocking
      fix: >-
        instrument_void's compound AND split into two independently
        sufficient OR'd conditions, matching EXP-ECTD-001's clean
        single-condition pattern; the mis-attribution failure mode remains
        separately covered by invalidation_rules, avoiding double-counting.

  independent_reverification_of_fixes: >-
    D1's fix specifically was not accepted on the strength of the drafting
    session's own claim. Before finalizing v2, I ran a direct case
    enumeration over all 6 reachable combinations of (ks_rejects,
    any_edge_ge_100, all_edges_in_band) and confirmed exactly one branch
    fires in every case (script and output recorded in the drafting
    session's own working notes; the same check is embedded verbatim in
    EXP-ECTD-9e4248/specification.yaml's revision_note for any future reader
    to re-run). D3 was reverified by reading driver/fp.py's random_prime
    directly (lines 109-117: "Random probable prime with exactly `bits`
    bits") and re-reading DEC-20260806-4a9604's own next_actions text, both
    of which confirm the red-team's claim exactly as stated. D2, D4, D5 were
    read against the actual EXP-ECTD-001 driver files
    (isogeny.py/isogeny_class.py) and confirmed to have no
    conductor/volcano logic, exactly as the reviewer found.

  status_transitions:
    - record: EXP-ECTD-9e4248
      from: review_required (v1)
