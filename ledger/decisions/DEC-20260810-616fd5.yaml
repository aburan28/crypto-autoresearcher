coordinator_decision:
  id: DEC-20260810-616fd5
  goal_id: GOAL-SSIQ-001
  batch_id: BATCH-014
  context: >-
    GOAL-SSIQ-001 BATCH-014. TASK-20260808-d458a3 (executor, authorized by
    the freeze decision DEC-20260808-c2a470) has RETURNED its execution
    report. The producer run is RUN-SSIQ-a85692-k against the frozen
    contract experiments/EXP-SSIQ-a85692/specification_v11.yaml. The run
    DEFERRED AT G-0c -- the host-comparability gate that three rounds of
    pre-freeze review forced into the contract -- and produced NO delta_E
    measurement of any kind.
    This decision does exactly three things: it records the snapshot
    archive act and the process deviation in how that archive had to be
    taken; it adjudicates RUN-SSIQ-a85692-k's validity and the epistemic
    character of its defer; and it names the next actions. IT DOES NOT
    CLOSE BATCH-014, does not write an evidence record, and does not move
    any hypothesis -- independent review has not occurred.
  decision: approve
  decision_label: snapshot_archive_and_validity_adjudication_batch014_g0c_defer
  decision_vocabulary_note: >-
    `approve` here is narrow and means exactly this: the run package
    RUN-SSIQ-a85692-k is ACCEPTED AS A VALID, COMPLETE EXECUTION of
    TASK-20260808-d458a3 and is archived (content-verified) as admissible
    input to independent review. It is NOT `support`: nothing is supported,
    because nothing was measured. It approves an archive and a validity
    finding, not a scientific reading.
  target_ids:
    - GOAL-SSIQ-001
    - BATCH-014
    - RUN-SSIQ-a85692-k
    - TASK-20260810-dae7ef
    - EXP-SSIQ-a85692

  rationale:
    - >-
      RUN-SSIQ-a85692-k IS completed_valid AND ITS DEFER IS THE FROZEN
      CONTRACT'S OWN DESIGNED, SUCCESSFUL BEHAVIOUR. The run records
      validity completed_valid, status completed, outcome DEFERRED_AT_G0C.
      load_defer_gate_v11 was evaluated in the exact frozen order
      [G-0c, G-0, G-0b, G-1, G-2, G-2b, G-3]; G-0c fired on first
      evaluation and the remaining six branches were never evaluated,
      which is precisely the first-fires-wins structure the frozen text
      specifies. TASK-20260808-d458a3's own constraints state, in advance
      and unambiguously, that "DEFERRING ON A HOST MISMATCH IS A FULLY
      SUCCESSFUL OUTCOME OF THIS TASK, NOT A FAILURE" and that the gate
      must not be worked around by adjusting the comparison, relaxing the
      gate, or substituting a different reference host. The Executor did
      none of those things.
    - >-
      THE GATE FIRED ON TRUE ARCHIVED DATA, NOT ON A MISREAD. G-0c compared
      the execution host (platform macOS-26.6-arm64-arm-64bit-Mach-O,
      machine arm64, os.cpu_count() = 14) against RUN-SSIQ-a85692-h's
      archived environment.json (platform
      Linux-6.18.5-fc-v18-x86_64-with-glibc2.39, cpus_available 4), and
      mismatched on ALL THREE compared dimensions: OS family, ISA, and CPU
      count. That archived environment.json was read DIRECTLY and
      independently -- not trusted from the execution report -- and it
      genuinely records those values. `git show --stat 5471247e6` further
      confirms that RUN-h's directory was not touched by the producer
      commit, so the reference the gate read is the reference as archived.
    - >-
      THIS IS AN INFRASTRUCTURE OUTCOME AND IS NEVER NEGATIVE MATHEMATICAL
      EVIDENCE (AGENTS.md rule 5). No mathematical claim of this campaign
      is weakened, strengthened, narrowed, or reopened by it. The
      symmetric statement also holds and is stated deliberately: an
      environment gate firing before any computation is not a POSITIVE
      mathematical result either. The batch produced
      n_sweep_points_attempted/succeeded/failed = 0/0/0 and NO delta_E
      value of any kind.
    - >-
      NO RESOURCE FAILURE OCCURRED AND NONE CAN BE INVOKED AS AN
      EXPLANATION. wall_clock_seconds = 0.1884760856628418 against the
      frozen 1000 s cap -- 0.02% consumed. There was no timeout, no crash,
      and no implementation failure. The run stopped because the gate told
      it to, not because anything broke.
    - >-
      THE PACKAGE IS CLEAN ON EVERY CHECK THIS COORDINATOR COULD APPLY.
      Ten declared artifacts, all present and parsing; the working tree is
      byte-identical to the producer commit (`git diff --stat 5471247e6`
      empty); write_scope respected (`git show --stat 5471247e6` = exactly
      10 files, 2491 insertions, 0 deletions, all newly added, with no
      prior specification v1-v10 and no prior run -a..-j modified); the
      run executed against a58be63848492aa45c75b8d2d6973a352166de96, which
      IS the commit that froze specification_v11 and dispatched this task,
      with no intervening commit; stderr.log's sha256 is the sha256 of the
      empty string, independently corroborating the report's claim that it
      is empty. Full detail in the receipt's coordinator_precommit_checks.
    - >-
      CLOSED-LIST COMPLIANCE ON DEFER HOLDS, AND THIS IS THE CHECK THAT
      MATTERS MOST FOR A DEFER. truncation_sweep_comparison.json's
      top-level keys were enumerated directly and contain NOT ONE
      sweep-derived field: no n_naturally_completed, no delta_E histogram,
      no equality cross-check, no final-pop overshoot distribution. The
      artifact reports what the gate saw and nothing else, exactly as a
      defer requires. Had a sweep-derived field appeared here it would have
      indicated the sweep ran despite the defer; it did not.
    - >-
      THE ONLY GENUINE COMPUTATION AGAINST THE p=2437 GRAPH WAS STEP (0),
      AND IT PASSED. The graph rebuild and two-part graph-identity
      re-verification ran before G-0c: n_built_vertices = 203 against
      archived 203, degree_sequence_check.pass = true, vertex_count_match =
      true. This establishes that the instrument was correctly assembled on
      this host. It establishes nothing whatever about delta_E, and this
      decision claims nothing further from it.
    - >-
      THREE EXECUTOR-DISCLOSED DEVIATIONS ARE CARRIED FORWARD TO REVIEW
      RATHER THAN ADJUDICATED AWAY HERE. (1) infrastructure_error: the
      frozen budget.maximum_memory_gb = 2 was enforced for runs a..j via
      `ulimit -v 2097152`, which is unsupported on macOS (setrlimit rejects
      RLIMIT_AS) and was therefore NOT APPLIED; the only binding cap
      actually in force was `timeout 1000`. Actual peak memory was
      trivially far under 2 GiB given one 203-vertex graph build followed
      by a defer, but no peak-memory figure was measured and none is
      asserted -- the enforcement gap is real and is named for the
      Validator. (2) specification_error: load_defer_gate_v11's frozen text
      does not pin down whether CAL-1/CAL-2 run BEFORE G-0c is evaluated or
      whether G-0c gates whether they run at all; the Executor adopted the
      latter reading, giving cal1_records = [] and cal2_records = [], and
      REPORTED the ambiguity rather than silently guessing. This
      Coordinator finds the reading defensible on the Executor's three
      stated grounds -- G-0c's own "FIRST, BEFORE ANY CALIBRATION IS
      INTERPRETED" text, the frozen defer-artifact language "to whatever
      extent they exist", and TASK-20260808-d458a3's own stated evaluation
      order -- but defensible is not settled, and it goes to the Validator.
      (3) specification_error: the frozen spec cites "AGENTS.md rule 3" for
      the timeout/environment-failure principle where the live AGENTS.md
      numbers that identical principle rule 5 -- citation-numbering drift
      only, no functional effect.
    - >-
      BATCH-014'S MEASUREMENT OBJECTIVE IS UNMET AND IS BLOCKED ON
      EXECUTION-HOST AVAILABILITY. The two quantities this batch existed to
      produce -- n_naturally_completed(b) at b = 1.45 s against the
      pre-registered P-1/P-2 threshold of 58, and the final-pop overshoot
      distribution over the b = 1.10 s arm, which specification_v11's own
      contribution_accounting_v11 calls "the first direct measurement of
      that quantity anywhere in this lineage" -- WERE NOT MEASURED AND
      REMAIN UNMEASURED. This is stated plainly rather than softened: the
      batch did not partially achieve its objective, it achieved none of
      it, for a reason that has nothing to do with the mathematics.
    - >-
      A NON-OFFICIAL OBSERVATION EXPLAINS WHY THE GATE EARNED ITS PLACE,
      AND IS FENCED ACCORDINGLY. A pre-execution verification exercise --
      explicitly NOT part of the official run, never written into the run's
      artifacts -- exercised CAL-1 standalone on this host: 8 records, 0
      timed out, measured wall range [0.5095, 0.5937] s against the
      archived [1.1499, 1.3147] s, ratio range [0.4308, 0.4703]; this host
      is roughly 2.0x-2.3x FASTER than the archived reference host on this
      exact workload. specification_v11's own text states that the
      b = 1.10 s arm's "guaranteed truncated" control depends on the
      execution host NOT being faster than the archived host, protected by
      a margin of only 49.93 ms (4.3%). A ~2x speedup would very plausibly
      have broken that control outright had the sweep been allowed to run.
      That is measured vindication of the round-3 reviewer's insistence on
      G-0c: the gate did not fire on a bureaucratic host-identity
      technicality, it fired on a host difference large enough to
      invalidate a pre-registered control. THESE FIGURES ARE NOT
      RUN-SSIQ-a85692-k's OFFICIAL MEASUREMENTS AND MUST NEVER BE CITED AS
      SUCH -- RUN-k recorded cal1_records = [] and cal2_records = [].
    - >-
      NO EVIDENCE RECORD IS WRITTEN AND NO HYPOTHESIS MOVES, BECAUSE
      INDEPENDENT REVIEW HAS NOT HAPPENED. H-SSIQ-36e970 stays exactly
      where it is. Writing an EV-* now would assert a reviewed reading of a
      package no independent reviewer has opened; moving a hypothesis on an
      infrastructure defer would violate AGENTS.md rule 5 twice over. The
      evidence record follows the two reviews, not this decision.

  process_deviation:
    id: PD-ARCH-BATCH-014-producer-committed
    statement: >-
      THIS WAS NOT A CLEAN COORDINATOR SNAPSHOT AND THIS DECISION DOES NOT
      CLAIM IT WAS. The frozen process, and this goal's own immediately
      preceding precedent (BATCH-013, TASK-20260806-5af708), is that the
      COORDINATOR makes the snapshot commit of the producer's declared
      package before any reviewer reads it, with the receipt committed
      inside that same commit (commit_sha: null, "Null by construction").
      Here the Executor committed its own run package at 5471247e6, so the
      receipt TASK-20260810-dae7ef is necessarily authored AFTER the
      artifacts entered history, in a separate later commit.
    preserved: >-
      The snapshot-before-review INTEGRITY property survives. The artifacts
      are immutably frozen at 5471247e6; their ten sha256 values are
      declared in the receipt and were independently computed against a
      working tree that `git diff --stat 5471247e6` shows is identical to
      that commit; and NO independent reviewer has read the package -- both
      review handoffs are written as pending and undispatched.
    binding: >-
      Per CLAUDE.md "Archive receipts bind to CONTENT first", commit
      reachability is advisory and declared content hashes are
      authoritative. 5471247e6 is reachable and IS recorded as commit_sha,
      so both bindings happen to hold; but the binding this archive RESTS
      on is content, and the archive is characterized as CONTENT-VERIFIED
      rather than snapshot-committed. The receipt file itself is
      deliberately NOT in declared_paths, since it does not exist at
      5471247e6 and its hash would be unverifiable there.
    genuinely_lost: >-
      The Coordinator's ability to inspect the package BEFORE it entered
      history. Every check recorded in the receipt was performed after the
      producer commit already existed, so those checks could only ever have
      DETECTED a defective package, never PREVENTED one from entering the
      repository. Stated so that no later reader infers a stronger gate
      than was actually applied. Neither overstated (the artifacts are
      immutable and content-verified, and review is still virgin) nor
      understated (the ordering property the process exists to guarantee
      was not obtained).
    not_a_finding_against_the_executor: >-
      Recorded against the archival chain, not against RUN-SSIQ-a85692-k,
      which was found clean on every check.

  archive:
    kind: snapshot
    task_id: TASK-20260810-dae7ef
    receipt: coordination/goals/GOAL-SSIQ-001/batches/BATCH-014/archives/TASK-20260810-dae7ef-receipt.yaml
    source_task_ids: [TASK-20260808-d458a3]
    commit_sha: 5471247e6
    verification_basis: content_verified_via_declared_path_sha256
    declared_path_count: 10

  evidence_refs:
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-k/manifest.yaml
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-k/raw-result.json
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-k/execution_report.yaml
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-k/truncation_sweep_comparison.json
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-k/environment.json
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-h/environment.json
    - experiments/EXP-SSIQ-a85692/specification_v11.yaml
    - ledger/decisions/DEC-20260808-c2a470.yaml
    - ledger/handoffs/TASK-20260808-d458a3.yaml
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-014/archives/TASK-20260810-dae7ef-receipt.yaml
    - ledger/goals/GOAL-SSIQ-001/checkpoints/BATCH-014.yaml
  evidence_refs_note: >-
    These are the artifacts this decision RESTS on. None of them is an
    EV-* evidence record, because no EV-* exists for BATCH-014 -- see
    next_actions.

  limitations:
    - >-
      NO delta_E MEASUREMENT EXISTS FROM THIS RUN, at any budget, in any
      partial form. n_sweep_points_attempted/succeeded/failed = 0/0/0.
      Nothing here bears on delta_E convergence, on n_naturally_completed
      at any b, on the final-pop overshoot distribution, on H-SSIQ-36e970,
      on lever L4, or on the p^{1/3+o(1)} exponent budget, in EITHER
      direction.
    - >-
      The pre-execution CAL-1 figures ([0.5095, 0.5937] s; ratio range
      [0.4308, 0.4703]; ~2.0x-2.3x faster than the archived host) ARE NOT
      OFFICIAL MEASUREMENTS OF RUN-SSIQ-a85692-k and must never be cited as
      such. They came from a verification exercise outside the official run
      and were never written to the run's artifacts; RUN-k itself recorded
      cal1_records = [] and cal2_records = []. They may inform reasoning
      about why G-0c matters; they may not stand as this run's data.
    - >-
      Everything here is UNREVIEWED. No Validator, Red Team, attestation,
      or quorum has touched BATCH-014. The checks in the archive receipt
      are the Coordinator's own and are explicitly not a substitute for
      independent review; the process deviation above further means they
      were performed after the fact.
    - >-
      Scope: p = 2437, a single prime; graph size N = 203; the v11
      implementation module; the frozen 1000 s / 2 GiB / 1-run budget. The
      run's own scale_qualifier reads "toy; N (graph size) = 203; single
      prime p=2437". No transfer to any cryptographic-scale parameter is
      claimed or implied.
    - >-
      The frozen 2 GiB memory bound was UNENFORCED on this execution host
      (`ulimit -v` unsupported on macOS). For this particular run the
      practical consequence is nil, but any future run on this host under
      this contract would also be unbounded in memory unless the
      enforcement mechanism is replaced.
    - >-
      The CAL-1/CAL-2 ordering under G-0c rests on an INTERPRETATION of
      ambiguous frozen text, not on unambiguous frozen text. The
      interpretation is disclosed and defended, not hidden, but it is open
      to challenge and is explicitly assigned to the Validator.

  next_actions:
    - >-
      DISPATCH TASK-20260810-098fad (validator, policy review-adversarial,
      reasoning_effort xhigh, independent session) against the
      content-verified BATCH-014 package at 5471247e6. It is written and
      PENDING; this session was not authorized to dispatch it.
    - >-
      DISPATCH TASK-20260810-971cfa (red team, policy review-adversarial,
      reasoning_effort xhigh, independent session) against the same
      package. Also written and PENDING.
    - >-
      AFTER both reviews return: write the BATCH-014 evidence record
      (EV-*), then a closing Coordinator decision, then a ledger archive.
      Only at that point does the BATCH-014 checkpoint shard's closed_at /
      closed_by / evidence_id / outcome become fillable -- and the shard is
      WRITE-ONCE, so the closing state is recorded in the closing decision
      and a superseding record, never by editing
      ledger/goals/GOAL-SSIQ-001/checkpoints/BATCH-014.yaml.
    - >-
      THE REAL FORWARD CHOICE, FOR A LATER COORDINATOR, IS BINARY AND
      NEITHER BRANCH IS FREE. Either (A) obtain a MATCHED execution host --
      Linux, x86_64, 4 CPUs, matching RUN-SSIQ-a85692-h's archived
      environment on all three dimensions G-0c compares -- and re-dispatch
      the frozen contract unchanged; or (B) issue a versioned
      protocol_amendment that re-establishes a NEW archived reference host,
      with its own reference curve measured on that host. Branch (B) is
      substantially more expensive than it looks, because every prediction
      in specification_v11 is derived from RUN-h's timings.
    - >-
      BINDING ON BOTH BRANCHES: THE GATE MUST NOT BE RELAXED OR WORKED
      AROUND. This is TASK-20260808-d458a3's own explicit instruction --
      "Do not attempt to work around a defer by adjusting the comparison,
      relaxing the gate, or substituting a different reference host" -- and
      it survives this decision intact. Branch (B) is not a relaxation of
      the gate; it is a re-derivation of the reference the gate compares
      against, and it must be done as a versioned amendment through
      pre-freeze review, never as a runtime adjustment.
    - >-
      NOTE FOR WHOEVER TAKES THAT CHOICE: this is the condition the frozen
      contract NAMED IN ADVANCE. specification_v11's
      inputs.contribution_accounting_v11 lists as durable yield item (3)
      "ONE DURABLE INFRASTRUCTURE FACT: the execution host's platform, ISA,
      Python build, CPU count and load averages -- which no run -a..-j ever
      recorded, which is precisely why PF-26 was possible." That fact is
      now recorded, and it is the fact that blocked the batch. The contract
      predicted its own blocker and the blocker arrived; that is the gate
      working, not the plan failing.
    - >-
      DO NOT re-dispatch RUN-SSIQ-a85692-k or retry it on this host under
      any variation. maximum_runs is 1, the single run WAS the complete and
      correct execution of TASK-20260808-d458a3, and a retry on a
      mismatched host would defer identically at G-0c.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOTHING PROMOTED, on two independent and each individually sufficient
      grounds. FIRST, there is no measurement: the run computed no delta_E
      value of any kind (0/0/0 sweep points), so there is no durable
      mathematical claim available to promote. SECOND, independent review
      has not occurred, so no evidence record exists and no evidence
      strength has been established -- promotion requires `support` or
      `reject_scoped` on replicated/strong evidence, and this decision is
      neither, resting on evidence that is not yet graded at all. A
      candidate infrastructure finding does exist in embryo -- that a
      pre-registered host-identity gate comparing platform/ISA/CPU-count
      against an archived reference run's environment.json catches a
      host substitution that would silently invalidate a timing-based
      control -- but it must go through the two pending reviews and an
      evidence record before any KN-FIND is considered, and this decision
      deliberately does not pre-commit that outcome.

  hypothesis_status_changes: []
  hypothesis_status_changes_note: >-
    NONE. H-SSIQ-36e970 does not move and remains at whatever status it
    already carries. No other hypothesis moves. A G-0c infrastructure
    defer is evidence for nothing and against nothing (AGENTS.md rule 5).

  batch_closure: null
  batch_closure_note: >-
    THIS DECISION DOES NOT CLOSE BATCH-014. The batch stays OPEN pending
    TASK-20260810-098fad and TASK-20260810-971cfa, the evidence record, and
    a closing decision. The checkpoint shard
    ledger/goals/GOAL-SSIQ-001/checkpoints/BATCH-014.yaml records
    closed_at / closed_by / evidence_id / outcome as null accordingly.

  goal_closure_note: >-
    Not applicable. GOAL-SSIQ-001 remains active under the "No budget
    constraints" extension (campaign_budget.maximum_batches: null). No
    completion criterion is claimed met; no attestation was obtained and
    none is recorded. latest_verified_commit is deliberately left unchanged
    at its existing value, because this batch's package has NOT passed
    independent review and so is not a verified snapshot in that field's
    sense.

  decided_by: coordinator
  decided_at: '2026-08-10'
