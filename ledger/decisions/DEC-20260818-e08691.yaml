  verdict_detail: >-
    EXP-SYC-c5f30f is REVISE, and GOAL-ECDLP-001 moves to `paused` at the
    campaign's budget ceiling. The 55th and LAST authorized batch (
    BUDGET-AMEND-20260818-001) ran two successive zero-run static repair
    artifacts. The first successor EXP-SYC-4725b3 received a SPLIT dual
    review (validator TASK-20260818-e0fa83 PASS on record integrity only; red
    team TASK-20260818-db50a3 REVISE with 3 blocking / 2 major / 4 moderate /
    5 minor). On the user's explicit continuing instruction the Coordinator
    deferred the pre-registered pause once and authorized the scoped-repair
    second successor EXP-SYC-c5f30f, which discharged every first-round
    finding on the companion-artifact side. The second successor's dual
    re-review -- independent validator TASK-20260819-b0465b (REVISE: 1
    blocking, 11 non-blocking, ZERO numeric mismatches) and independent red
    team TASK-20260819-0f62f9 (REVISE: 2 blocking, 4 major, 5 moderate, 6
    minor) -- returned DUAL REVISE on the frozen snapshot
    b60d94f50d36ee54536d3e246675587fc0b080d0, with three blocking findings
    NONE of which appears in either first-round report: VAL-B0465B-B1 (the
    false dedup bound survives in the frozen contract at
    specification.yaml:1243), RT-0F62F9-B1 (the 40-digit exact_prefix for
    2^(-7/6) is wrong in its fortieth digit), and RT-0F62F9-B2 (the
    d4_crossing_rule formula label does not generate its own recorded value).
    Each was hand-verified by the Coordinator from the frozen bytes before
    this decision was recorded. The disposition is a DUAL_REVISE: a
    disposition on one review alone would be invalid. Per the pre-registered
    next_action of batch.yaml (restated in both successors' specifications),
    a REVISE with further new findings moves the goal to `paused` at the
    campaign's budget ceiling, which is a scoped, expected outcome and not a
    reason to raise the cap.
