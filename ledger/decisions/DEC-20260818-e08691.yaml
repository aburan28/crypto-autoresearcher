  goal_head_scope_adjudication: >-
    This decision records the BATCH-4d7ae0 disposition and the goal pause.
    The goal head (status, status_value_history, next_action,
    latest_verified_commit, updated_at) is updated in the goal-head commit
    that follows this ledger commit to reflect: the 55th batch closed on
    DUAL REVISE with new findings, the goal moves `active` -> `paused` at the
    campaign budget ceiling, latest_verified_commit advances to this ledger
    archive commit (a commit's own sha cannot be written into an artifact
    inside that same commit, so the advance lands in the following commit,
    exactly as DEC-20260817-e633b6 did), and next_action becomes one RESUME
    action naming the revisit condition (a future budget amendment
    re-authorizing batches together with a cap-amendment task) and the
    minimum repair set for the first batch of any resumed campaign. The
    superseded next_action (the 55th's dispatch instruction) is preserved
    verbatim in a prior_* field, as every prior head act in this goal has
    done.
  rationale: >-
    The batch was opened to fix record-integrity defects; the first successor
    fixed the mandated ones on the companion side but the dual review split,
    and the second successor -- which discharged every first-round finding it
    was given -- still carried three record-integrity defects of the same
    class, one of them (the false dedup bound) in the frozen contract itself,
    plus a wrong 40-digit literal and a formula label that does not generate
    its own recorded value, all in the artifact whose entire purpose is to
    certify the arithmetic. The ECDLP mathematics is untouched in every
    round -- the independent validator found ZERO numeric mismatches over
    every literal, bound, row and pasted string it checked -- so the defects
    are all about the record's account of itself, exactly the class AGENTS.md
    rule 3 and the inventor protocol treat as paperwork, never evidence
    against a mathematical hypothesis. The honest disposition is REVISE. The
    honest budget position is the pre-registered one: this was the last
    authorized batch, the contingency fired, and the goal pauses at the
    ceiling with every open item named, rather than a third successor being
    authorized by a Coordinator who holds no budget-amendment authority.
