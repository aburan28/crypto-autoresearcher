  # B2. Dispatch-precondition audit of TASK-20261002-fc71d6
  # ---------------------------------------------------------------------------
  dispatch_precondition_audit:
    - id: P1
      precondition: archived_by bound before dispatch (standing precondition 1)
      status: owed
      finding: Bound by B1. Holds once TASK-20261005-8d4da1 verifies and the branch is pushed.
    - id: P2
      precondition: design-packet archive receipt (8480bf)
      status: holds_on_presence
      finding: >-
        Present, binding_mode content_at_commit, with path_sha256 for the
        specification (ff68918e...b536133), the card (f3062531...0e109ed),
        DEC-20261002-5a576d (53d328fe...f2e7b9), H-SEMBIN-8e8bef
        (884ef5d9...a9a00ee) and IDEA-20260913-449d2b (63318510...47c781).
        Not recomputed here. Recomputation on origin/main is owed on
        TASK-20261005-8d4da1 (check D-b).
    - id: P3
      precondition: declared inputs committed and pushed (standing precondition 2)
      status: holds_on_tree_owed_on_origin
      finding: >-
        The card lists 15 inputs. Owed on 8d4da1 (check D-a): `git ls-tree -r
        --name-only origin/main` on each. src/h012c_block_m4ri.py imports
        sage.all (DEC-20261005-c83e5a N3); it is an input to read, not a
        runnable path here (B4 N3).
    - id: P4
      precondition: lane available within max_concurrent 2 (standing precondition 3)
      status: owed_at_dispatch
      finding: >-
        LANE 1 is held by TASK-20261002-530540 (35bf67), per
        MSG-20261005-30680f, without a claim file. LANE 2 is reserved for this
