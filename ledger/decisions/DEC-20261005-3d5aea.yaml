        claim` cannot take it. Owed at dispatch (check D-c): `git fetch`, then
        `python3 tools/goal_lanes.py lanes GOAL-SEMBIN-5078bc` across refs.
        Proceed only if at most one live lane or claim exists and none holds
        fc71d6. Post one agent_bus message to role coordinator naming
        TASK-20261002-fc71d6 as dispatched, refs this decision.
        DEC-20261005-859f40 NA-1 takes no lane and does not compete.
    - id: P5
      precondition: blindness and instrument independence
      status: owed
      finding: >-
        The card declares no blindness. EXP-SEMBIN-35bf67 (LANE 1) is running
        and its interim outputs are reported on PR #1827. If 79a02d's executor
        reads them before its own Stage-0 freeze, or reuses 35bf67's
        implementation as a rank arm, then later agreement between the two
        instruments is dependent, not independent. That would cost the
        program the one cross-check b7e3a9 R1 couples these lanes for. The
        remedy is B4 N1, carried by the dispatcher.
    - id: P6
      precondition: write_scope collisions
      status: holds_on_tree_owed_across_refs
      finding: >-
        No handoff on this tree other than fc71d6 names a path under
