    card_field_value_unchanged: "archived_by: TASK-20261002-8480bf"
    card_field_reading: >-
      Historically accurate for the card FILE, which 8480bf staged and
      hash-bound (f3062531...0e109ed). Defective as the owner of the card's
      OUTPUTS, which 8480bf does not declare. The card is immutable and is not
      edited.
    run_output_owner: TASK-20261005-6c1c10
    owned_paths:
      - experiments/EXP-SEMBIN-79a02d/implementation/
      - experiments/EXP-SEMBIN-79a02d/runs/
      - experiments/EXP-SEMBIN-79a02d/stage0/
      - experiments/EXP-SEMBIN-79a02d/stage1/
      - experiments/EXP-SEMBIN-79a02d/stage2/
      - experiments/EXP-SEMBIN-79a02d/stage3/
      - experiments/EXP-SEMBIN-79a02d/RESULTS.md
    owned_paths_note: >-
      Exactly the artifact_paths and write_scope of TASK-20261002-fc71d6, which
