    EXP-SEMBIN-35bf67. This Coordinator read in full: TASK-20261002-fc71d6, the
    8480bf receipt, DEC-20261005-b7e3a9, DEC-20261005-c83e5a,
    TASK-20261005-71d2b9, TASK-20261005-e40f6c, the goal head next_action, and
    the c83e5a shard. It read in part: EXP-SEMBIN-79a02d specification.yaml
