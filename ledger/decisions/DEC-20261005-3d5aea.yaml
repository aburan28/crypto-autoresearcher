    - The prior in B3 is subjective and is recorded for pre-commitment only.
    - N2 and N4 cite EV-SEMBIN-702d1d and the M4RI defect through decisions that report them. Neither the evidence record nor the NOTES were opened here.

  knowledge_promotion:
