  # ---------------------------------------------------------------------------
  # B3. Review plan: not required before dispatch; prior pre-registered now
  # ---------------------------------------------------------------------------
  review_plan: null
  review_plan_ruling: >-
    NOT REQUIRED BEFORE DISPATCH. The card opens no review round. The run's
    review IS claim-changing (it can move H-SEMBIN-8e8bef past running, and
    its verdict decides how GOAL-DREG-001's degree data and rank 1's surface
    are read). So a full review_plan is owed on the reviewer handoffs, after
    TASK-20261005-6c1c10 verifies and before any reviewer runs. The prior and
    joints are recorded now, before any output exists.
  review_preregistration:
    recorded_before_any_run_output: true
    recorded_without_reading: experiments/EXP-SEMBIN-35bf67/ outputs; experiments/EXP-SEMBIN-7e1371/runs/**
    coordinator_prior: >-
      Subjective, recorded for pre-commitment only; not evidence. (a) The
      Stage-1 builder-equality gate at n = 12, m = t = 3, k = 4 passes: about
      0.7. The main risk is a convention mismatch with the DREG builder
      (variable order, field polynomial, normalisation of eq. (5)), not a
      mathematical difference. (b) Given a pass, SOLV4 and the Macaulay
      rank-versus-nrows criterion agree on the calibration cells n in {12, 15}:
      about 0.6. d_ff coinciding with both is less likely, about 0.4, because
      first-fall and solving degree are known to separate on structured
      systems. (c) Stage 3 records O-IMPEDIMENT for lack of a vendored
      per-step-degree engine: about 0.6. (d) Most likely single label: a
      partial-separation label in which some instrument pairs coincide and
      d_ff does not. Where I expect the review to bite: whether "degree-4
      capped closure" is the iterated closure with a fixed monomial order and
      multiplier budget, and whether the two GF(2) rank arms share a library.
    joints_to_be_owned:
      - id: J1
        joint: Stage-0 definitions fix all four degrees with explicit quantifiers, closure type, monomial order and multiplier budget, frozen before Stage 1.
        worked_attack: Compare file times of stage0/ files with the first stage1/ write. Check definitions.md against the EV-SEMBIN-702d1d certificate-ambiguity findings (pointer, B4 N2).
      - id: J2
        joint: Builder equality is coefficient-wise against the DREG builder, not a hash of a shared builder.
        worked_attack: Import-graph check. Re-derive one n = 12 system by hand from Semaev eq. (5) and compare with both builders.
      - id: J3
        joint: The dual GF(2) rank arms are independent, including the library build.
        worked_attack: Read per-cell library and version provenance. Inject one rank deficiency into a calibration matrix and confirm that both arms see it.
      - id: J4
        joint: Planted and uniform-z strata are never pooled, and null and known-false arms run in identical format.
        worked_attack: Recount per-stratum denominators from raw records.
      - id: J5
        joint: The single O-* label follows the frozen falsification text mechanically.
        worked_attack: Re-apply the specification's decision text to stage2/census.json before reading RESULTS.md prose.
    blind_rederivation_proposed:
      quantity: >-
        SOLV4 verdict, rank(M_4) and nrows(M_4) for 3 seeds at n = 12 and 3 at
        n = 15, from the specification's definitions and frozen seeds.
      blind_from:
        - experiments/EXP-SEMBIN-79a02d/implementation/
        - experiments/EXP-SEMBIN-79a02d/runs/
        - experiments/EXP-SEMBIN-79a02d/stage1/
        - experiments/EXP-SEMBIN-79a02d/stage2/
        - experiments/EXP-SEMBIN-79a02d/stage3/
        - experiments/EXP-SEMBIN-79a02d/RESULTS.md
    review_tier: >-
      review-adversarial (xhigh): one validator and one red team in
      independent sessions. ESCALATION (AGENTS.md rule 12): if the 79a02d
      verdicts contradict EV-SEMBIN-702d1d or a validated 35bf67 evidence
      record on a shared definition, the contradiction round runs at
      review-breakthrough (max) and is never degraded.

  # ---------------------------------------------------------------------------
  # B4. Pre-run notices (pointers for the executor; NOT protocol changes)
  # ---------------------------------------------------------------------------
  pre_run_notices:
    - id: N1
      subject: blindness to LANE 1 and to EXP-SEMBIN-7e1371
      text: >-
        Do not read experiments/EXP-SEMBIN-35bf67/{stage0,stage1,stage2,stage3,runs,RESULTS.md}
        (including PR #1827's copies) or experiments/EXP-SEMBIN-7e1371/runs/**
        before stage0/preregistered-predictions.json is frozen. Record a
        sources-read list in stage0/. Do not use EXP-SEMBIN-35bf67 or
        EXP-SEMBIN-7e1371 implementation code as either GF(2) rank arm. If you
        use any of it after the freeze, declare that in RESULTS.md.
      status_in_protocol: >-
        Not an invalidation rule; the frozen specification has none for this.
        A breach is a deviation recorded at J1 and J3 that downgrades the
        independence reading of any concordance. It does not void the run.
    - id: N2
      subject: closure definition
      text: >-
        The specification reports SOLV4 via "degree-4 capped GF(2) closure"
        and a solv4_closure_iterations metric "to fixpoint". When writing
        stage0/definitions.md, state explicitly: iterated closure W_4 versus
        a single level; the monomial order; the multiplier budget; and whether
        sufficiency uses |V|, rank deficiency or both. DEC-20261005-859f40
        records that a single-level reading and the iterated closure gave
        opposite labels on 7 of 12 systems in EXP-SEMBIN-7e1371 (EV-SEMBIN-702d1d
        F-3, F-4, RD-6; a pointer, not read here). Freezing which one you
        measure is what makes this run's SOLV4 comparable.
      status_in_protocol: >-
        A reading of the specification's own Stage-0 obligation ("four degrees
        with explicit quantifiers"). No criterion changes. If the executor
        finds the specification fixes a different definition, it records the
        specification's definition and reports back. It does not self-amend.
    - id: N3
      subject: reusable src/ needs Sage; Sage excluded as success path
      text: >-
        src/h012c_block_m4ri.py imports sage.all (c83e5a N3), and the
        specification excludes Sage as a success path. Treat the src/ files as
        references. Implement or wrap under implementation/. A missing tool is
        O-IMPEDIMENT, never evidence.
    - id: N4
      subject: M4RI 0.0.20200125 defect
      text: >-
        DEC-20261004-df2986 records (from RUN-SEMBIN-9bb990 NOTES) that apt
        libm4ri 0.0.20200125 returns eliminations outside the row space at
        scale. DEC-20261005-859f40 reports closure on M4RI release-20240729
        cross-checked by an independent M4RI-free recomputation. Two
        rank arms that both link 0.0.20200125 are not independent under the
        card's "dual independent GF(2) rank" constraint (Coordinator reading,
        as c83e5a N2). Record library name, version and build provenance per
        cell.

  launch_route:
    ruling: >-
      DISPATCH THE `executor` SUBAGENT UNDER TASK-20261002-fc71d6, NOT /run.
      No program exists for EXP-SEMBIN-79a02d, the card says "Implement and
      execute", and /run adds no implementation phase (c83e5a B5 precedent).
      The top-level session launches it. This Coordinator does not.
    launch_prompt_must_name:
      - ledger/handoffs/TASK-20261002-fc71d6.yaml (read in full)
      - ledger/decisions/DEC-20261005-3d5aea.yaml (owner TASK-20261005-6c1c10; notices N1 to N4)
      - experiments/EXP-SEMBIN-79a02d/specification.yaml
    launch_order:
      - TASK-20261005-8d4da1 committed, verified, pushed; its dispatch gate line for fc71d6 reads CLEAR
      - lane check and bus message (P4)
      - executor subagent launched under TASK-20261002-fc71d6
      - on return and a quiet write_scope, TASK-20261005-6c1c10, alone

  rationale:
    - >-
      The defect is evidence-integrity, not science. Its remedy is purely
      additive and already precedented on LANE 1, so writing it costs nothing
      and unblocks the approved run that tells the program whether its
      Assumption-1 instruments measure the same thing.
    - >-
      Blindness between LANE 1 and LANE 2 is cheap to impose now and impossible
      to restore later. It is the property that makes b7e3a9's coupling of the
      two lanes informative.

  evidence_refs:
    - ledger/handoffs/TASK-20261002-fc71d6.yaml
    - coordination/goals/GOAL-SEMBIN-5078bc/design/TASK-20261002-8480bf/snapshot-receipt.json
    - experiments/EXP-SEMBIN-79a02d/specification.yaml
