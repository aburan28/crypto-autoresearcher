      DISPATCHER, ALONE: TASK-20261005-8d4da1, including checks D-a to D-e and
      the fc71d6 dispatch gate line. Then, if CLEAR, the top-level session
      launches the `executor` subagent under TASK-20261002-fc71d6 per
      launch_route. On return and a quiet write_scope: TASK-20261005-6c1c10,
      alone.
  goal_checkpoint:
    shard: ledger/goals/GOAL-SEMBIN-5078bc/checkpoints/BATCH-9d649f-DEC-20261005-3d5aea.yaml
    head_edit: none
