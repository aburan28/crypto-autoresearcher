    - ledger/decisions/DEC-20261005-b7e3a9.yaml
    - ledger/decisions/DEC-20261005-c83e5a.yaml
    - ledger/decisions/DEC-20261005-859f40.yaml
    - ledger/handoffs/TASK-20261005-71d2b9.yaml
    - ledger/handoffs/TASK-20261005-e40f6c.yaml
    - ledger/goals/GOAL-SEMBIN-5078bc/goal.yaml
    - coordination/bus/messages/MSG-20261005-30680f.yaml

