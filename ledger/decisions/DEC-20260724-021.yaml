coordinator_decision:
  id: DEC-20260724-021
  context: >-
    GOAL-ICLIFT-001 BATCH-001 executed EXP-XEDN-002, the exact function-field
    xedni section census issued to replace the EXP-XEDN-001 phase-2 design, which
    cannot reach its own gate (it must fit an exponent from a per-slot rate near
    p^-3, about 2e-9 at the largest contracted size, inside a 40-run budget).
    Evidence EV-XEDN-001; validation TASK-20260724-234 (valid_with_findings;
    the closed form was independently re-derived symbol for symbol before the
    executor's derivation was read); red team TASK-20260724-235
    (conclusion_requires_narrowing, 3 fatal scoping objections).
  decision: reject_scoped
  target_ids: [H-XEDN-001, RQ-XEDN-001, EXP-XEDN-002, EV-XEDN-001]
  rationale:
    - >-
      H-XEDN-001 predicted alpha < 1/2 for the family, slot shape, and predicate
      it names. The exact answer is P_lift(p) = (1 - 2/p + p^-3)/(2p^3), so
      alpha = 3 exactly, and the exact finite-size exponents at the contracted
      sizes are 2.985781, 2.993178, 2.996544. The prediction is false and the
      EXP-XEDN-001 phase-2 promotion gate does not open. This part of the verdict
      is not overturnable: it is an exact identity, independently re-derived and
      brute-force-confirmed over full slot spaces at p = 5 and 7.
    - >-
      The rejection is recorded as "rejected as posed", not as a closure of the
      route, because the red team's first objection is fatal to the broader
      reading. The frozen family has a(t) = 0, hence j = 0 throughout, hence is
      iso-trivial in the standard sense — precisely the class candidate B2
      excluded, and precisely the exclusion H-XEDN-001 lists among its own
      assumptions. A hypothesis whose stated assumption is unsatisfiable for the
      family it names can be refuted, but its refutation cannot be promoted into
      a statement about the direction that motivated it.
    - >-
      Two further fatal objections bound the reading. The multi-section clause
      counted DISTINCT sections of one degree shape, and on an in-family p = 13
      surface the counted sections form mu_3 orbits whose specialised relation is
      a tautology, so distinctness is not independence and s >= r+1 is neither
      necessary nor sufficient. And the measured quantity uses the UNIFORM measure
      on the family, whereas xedni constructs its surface through the prescribed
      points: the red team built an in-family surface with the target fibre and a
      prescribed section at 10,201 of 10,201 attempts at p = 101, against a
      uniform per-slot rate of 4.76e-07. The census therefore did not measure the
      lift probability the attack needs.
    - >-
      The methodological result stands independently of all of that and is the
      durable part of this batch: an exact count by fibering over sections
      answered, in seconds and with no uncertainty, a question that the frozen
      sampling design could not have answered with any budget it was given. The
      p=101 smoke's observed 0 hits in 5760 slots had an expected count of
      0.00274; it was uninformative about alpha by construction, and the
      research-direction note that read it as "rarity already visible at toy
      scale" is retroactively falsified by the exact rate.
    - >-
      The scoped-negative direction is not weakened by iso-triviality: the red
      team derived and exhaustively verified in a scratch probe that the
      non-iso-trivial family (deg a <= 4) gives P_slot = (p-1)(p^3+1)/(2p^7),
      i.e. alpha = 3 as well. That probe is a red-team artifact, not a recorded
      run, so it informs the next action rather than the evidence record.
  evidence_refs:
    - EV-XEDN-001
    - experiments/EXP-XEDN-002/derivation.md
    - experiments/EXP-XEDN-002/analysis.md
    - experiments/EXP-XEDN-002/execution-report.yaml
    - experiments/EXP-XEDN-002/runs/RUN-XEDN-002-A2
    - experiments/EXP-XEDN-002/runs/RUN-XEDN-002-B
    - experiments/EXP-XEDN-002/runs/RUN-XEDN-002-C
    - experiments/EXP-XEDN-002/runs/RUN-XEDN-002-CTRL
    - coordination/goals/GOAL-ICLIFT-001/batches/BATCH-001/tasks/TASK-20260724-234/validation_report.yaml
    - coordination/goals/GOAL-ICLIFT-001/batches/BATCH-001/tasks/TASK-20260724-235/red_team_report.yaml
  status_transitions:
    - record_id: H-XEDN-001
      from: approved
      to: rejected_scoped
      note: >-
        Rejected AS POSED. The prediction alpha < 1/2 is false for the named
        family, slot shape, and predicate; the hypothesis additionally carries an
        assumption (iso-trivial exclusion) that is unsatisfiable for the family it
        names, which is recorded as a formalisation defect rather than repaired
        in place.
    - record_id: EXP-XEDN-002
      from: approved
      to: analyzed
      note: >-
        Arms A, B, and D terminal; arm C completed through p = 13. Artifacts
        snapshot-archived at commit 9f9186c and independently validated.
    - record_id: EXP-XEDN-001
      from: contract (phase 2 unexecuted)
      to: phase-2 design superseded, gate resolved on the closure side
      note: >-
        The ECFG-NR-1518 closure branch of the EXP-XEDN-001 contract is satisfied
        for the frozen family only. EXP-XEDN-001 has no specification.yaml and is
        not a registered experiment record; this note is descriptive and creates
        no new status for it. Its harness, smoke results, and contract were not
        modified.
  limitations:
    - >-
      Scope, adopted verbatim from the red team's narrowest defensible boundary:
      the uniform-measure per-slot integral-section density for this surface
      family (a(t) = 0, deg b = 6 exactly), this monic degree-2 slot shape, this
      predicate (nonzero square with squarefree root, y = 0 excluded), and these
      sizes. Claim tier toy.
    - >-
      The following sentences are explicitly NOT recorded and must not be quoted
      from this decision: "the function-field xedni census is closed"; "candidate
      B2 is closed or rejected"; "the function-field xedni lift probability decays
      as p^-3"; "section-rich surfaces are exponentially rare over F_p(t)"; "the
      exact census confirms the classical JKSST prediction alpha = 3"; "the
      multi-section or Mordell-Weil relation-source route is closed"; "arm D shows
      that prescribing the target specialisation destroys section abundance";
      "the frozen predicate was exhaustively validated at p in {5, 7, 11, 13}";
      "together with ECFG-P1543 and ECFG-P1547 this closes lifting-based relation
      sources"; "no lifting-based relation source exists over F_p(t)".
    - >-
      alpha = 3 is the naive square-density codimension count, NOT the
      Jacobson-Koblitz-Silverman-Stein-Teske prediction. JKSST's refutation of
      classical xedni concerns relation-coefficient growth (KN-LIT-021), which is
      untested here. The counted sections are in fact height-2 roots of the E_8
      Mordell-Weil lattice, so their relation coefficients are absolutely bounded
      — meaning the census measured a different obstruction from the one the
      literature says is binding.
    - >-
      Nothing here supersedes or adds to ECFG-P1543 or ECFG-P1547 in
      ledger/FINDING-PF-IC-001.md, and nothing here is a general no-go for
      lifting. Arm D is a scoped parameter-counting lemma with two unproved
      heuristics and one verified off-by-one (its "m >= 6" threshold should read
      "m >= 7").
    - >-
      Full-space exhaustion under the frozen predicate reached p = 5 and 7 only;
      the package has no in-population planted positive control, because the
      inherited planted surface has deg b = 5 and lies outside the census family.
    - >-
      No independent-session review in the strict sense was available: review-xhigh
      cannot be resolved in this Claude-family harness, and the validator reported
      that its session and resolved model match the executor's. Rule 12 is
      discharged only in the weaker sense that reviewers were separate subagents
      with independent context and the validator re-derived the count before
      reading the executor's derivation.
  next_actions:
    - >-
      Adopt the red team's cheapest falsifying control as the single next lifting
      action: on the surfaces this census already identified, form the Shioda
      height Gram matrix for the observed free-x integral sections
      (<P,P> = 2, <P,Q> = 1 - (P.Q), with chi = 1, (P.O) = 0, all fibres
      irreducible for squarefree b) at p = 7, 13, 19, 31, extract a Z-basis of the
      relation lattice, and report max |coefficient| of the minimal relation
      versus p. Growth reopens the route and forces withdrawal of this closure;
      boundedness closes it by the mechanism the literature actually names, which
      would mean the p^-3 census measured the wrong obstruction. Cost is under a
      CPU-minute and it needs no new family or predicate.
    - >-
      Do not re-run the census on the non-iso-trivial family for the exponent
      alone: the red team's probe already indicates alpha = 3 there too. If that
      value is wanted as recorded evidence rather than as a probe, it is a
      by-product of the control above, not a separate campaign.
    - >-
      Any future contract in this area must check the candidate family against the
      classes its own source direction excluded BEFORE freezing. That check is
      cheap, and its absence is what produced an exact answer about a family
      candidate B2 had ruled out.
  knowledge_promotion:
    promoted: [KN-FIND-002]
    not_warranted: null
  decided_by: coordinator
  decided_at: '2026-07-24T12:45:00-07:00'
