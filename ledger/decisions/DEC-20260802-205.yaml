coordinator_decision:
  id: DEC-20260802-205
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-033
  recorded_by_task: TASK-20260802-218
  archived_by: TASK-20260802-219
  context: >-
    BATCH-032 synthesis is durable at commit
    1cf6ad5e115728416e977e56d715511490ef3700. DEC-20260802-204 classifies
    APR-206, its two scalar-action stages, the balanced N^{1/4} augmented-input
    row, and the rho/distinguished-point implementation as rediscoveries of
    Cheon's known DLP-with-auxiliary-input algorithm. Ordinary-input acquisition
    of alpha^d*G from G,alpha*G remains unresolved and blocks any ordinary-ECDLP
    improvement.
  decision: approve
  decision_scope: >-
    Open one proof-only BATCH-033 lane focused exclusively on ordinary-input
    nonlinear acquisition or a scoped generic-group acquisition barrier with
    explicit escape interfaces. Cheon DLPwAI is a faithfully attributed known
    baseline, not a research contribution. No experiment, Executor, status
    transition, knowledge promotion, closure, support, or breakthrough claim is
    authorized.
  target_ids:
    - GOAL-ECDLP-001
    - H-IT-001
    - BATCH-033
    - TASK-20260802-213
  rationale:
    - >-
      Acquisition is the only step by which Cheon's auxiliary-input speedup
      could affect ordinary ECDLP; polishing the known augmented route cannot
      reduce that uncertainty.
    - >-
      A typed sub-rho acquisition would identify a genuine premise-changing
      mechanism, while a proof-grade generic-group barrier would prevent further
      false exponent claims and name the non-generic interfaces that remain open.
    - >-
      Proof and independent adversarial review are cheaper and more decisive
      than implementation while the acquisition mechanism is absent.
  evidence_refs:
    - ledger/decisions/DEC-20260802-204.yaml
    - BATCH-032 synthesis commit 1cf6ad5e115728416e977e56d715511490ef3700
    - TASK-20260802-206 snapshot dbd03c4b26e48a5a093e6740588044c4f666aa4a
    - TASK-20260802-208 snapshot 636f3975e3a66c4d76c5e2115ac0f835069a7459
    - https://www.iacr.org/archive/pkc2012/72930594/72930594.pdf
  known_baseline:
    name: Cheon DLP with auxiliary input
    source: https://www.iacr.org/archive/pkc2012/72930594/72930594.pdf
    input: G, alpha*G, alpha^d*G with d dividing r-1
    time: O(sqrt((r-1)/d) + sqrt(d))
    balanced_time: N^{1/4+o(1)}
    low_memory: known rho/distinguished-point implementation
    ordinary_ECDLP_sota_delta: 0.0
  limitations:
    - No sub-rho ordinary-input acquisition is currently established.
    - The affine-label observation is not yet a complete generic-group lower-bound theorem.
    - Novelty is not assessed for any genuinely new acquisition interface.
    - Cheon's augmented-input route must not be presented as new.
    - All asymptotic-promotion gates remain open.
  deterministic_resolutions:
    - >-
      Queue maximum_runs=1 denotes one bounded agent invocation required by the
      dispatcher. The experiment-run budget is zero.
    - >-
      A positive producer result advances only to TASK-214 snapshot and
      independent TASK-215 Red Team; it does not authorize an Executor.
    - >-
      A negative result must be a scoped obstruction with argument and open
      escape interfaces; it is not closure.
    - >-
      An inconclusive result names the exact missing lemma, model assumption, or
      cost inequality and the cheapest bounded proof repair.
  hypothesis_status_transition:
    hypothesis_id: H-IT-001
    from: specified
    to: specified
    changed: false
    reason: BATCH-033 opens analytical research only.
  goal_status_transition:
    goal_id: GOAL-ECDLP-001
    changed: false
    reason: No completion criterion or closure quorum is implicated.
  asymptotic_promotion_gates:
