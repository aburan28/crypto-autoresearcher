coordinator_decision:
  id: DEC-20260914-04d16a
  context: >-
    SEPARATE launch-admission decision, taken only because DEC-20260914-d471ce
    (this same engagement, recorded independently) set
    scientific_launch_authorized: true in a second successor runtime lock for
    EXP-FROB-d8aa37 stage0. Per that decision's own framing, per
    DEC-20260914-37e0d9's NA-4, and per DEC-20260914-bb1dbe's NA-5, admission of
    the runtime and approval to launch the actual scientific trial
    (TASK-20260909-ece919) are kept deliberately distinct acts. This record
    answers only the launch question: given the runtime is now admitted, should
    TASK-20260909-ece919 be released to an executor with a fresh claim now.

  decision: approve
  target_ids:
    - EXP-FROB-d8aa37
    - RUN-FROB-2404fa
    - TASK-20260909-ece919
    - BATCH-2f8435
    - RQ-FROB-7d8dd4
    - H-FROB-73df22

  the_decision_stated_plainly: >-
    RELEASE TASK-20260909-ece919 to an executor with a fresh claim now. This is
    a fresh, independent judgment, not automatic from DEC-20260914-d471ce:
    considered on its own terms below (budget, standing authorization, whether
    anything else changed) and found to support release. This coordinator holds
    no shell and cannot perform the claim itself; the exact mechanics are
    handed to the dispatching session in next_actions.

  rationale:
    - >-
      RUNTIME ADMISSION IS SATISFIED. DEC-20260914-d471ce (this engagement)
      independently verified, against raw logs it read directly, that both
      items blocking scientific_launch_authorized are closed, and authored
      linux-runtime-lock-successor-20260914-c85f6a.json with
      scientific_launch_authorized: true. Every guard
      specification-stage0-v2.yaml's runtime_requirements block actually names
      is now measured and passing: Linux, Sage 10.9, POSIX process group,
      per-process RLIMIT_AS exactly 8192 MiB, single worker, in-process
      libsingular, aggregate cgroup v1 memory ceiling of 14327676928 bytes
      cross-confirmed via the exact 'sage -python' argv_prefix, Sage-bundled
      Python identity corroborated in a raw log, and all four frozen
      source/spec/plan hashes matched (as of the first successor lock's own
      source-check; re-verified mechanically by the adapter at actual launch
      time regardless).
    - >-
      BUDGET. Per CLAUDE.md "Research budgets: progress first" (2026-09-06):
      research cost estimates are advisory and require no repeated user
      approval; the Coordinator continues justified work within the authorized
      research scope. No 90-day stagnation review is active or warranted here
      -- this lane has shown continuous documented progress across
      DEC-20260909-bf5b48, DEC-20260914-37e0d9, DEC-20260914-bb1dbe, and now
      DEC-20260914-d471ce, all within the last five days. TASK-20260909-ece919's
      own budget block (wall_clock_seconds null, memory_gb 8, maximum_runs 1)
      is unchanged and still governs; memory_gb 8 is machine protection matching
      the now-measured RLIMIT_AS/cgroup guards, not a spending cap. FROB is a
      declared ECC area (orchestration/research-priority.yaml line 79) with
      maximum_batches null and total_wall_clock_seconds null by standing
      instruction, and ECC work is selected before all other candidates at
      every selection point.
    - >-
      STANDING AUTHORIZATION. AGENTS.md's "Standing user authorization for
      ideas and experiments" plus "ECC comes first" already supply permission
      for this dispatch without further per-task user confirmation, exactly as
      every prior decision in this lane stated for its own dispatch. Nothing in
      this record waives or weakens any guard; it releases work that guards
      already admit.
    - >-
      NOTHING ELSE HAS CHANGED THAT WOULD COUNSEL AGAINST RELEASE. This
      coordinator checked: no DISSENT is recorded against this lane; no
      impediment beyond the now-cleared IMP-1 narrow condition exists;
      H-FROB-73df22 stays `proposed` and EXP-FROB-d8aa37 stays `approved`,
      execution_authorized true, unedited by this record; TASK-20260909-ece919
      itself is untouched (still `queued`, unclaimed) and its constraints and
      completion_gate are unedited and unweakened by anything in this record.
    - >-
      WHY NOW RATHER THAN HOLDING FURTHER. Holding admission open after the
      runtime is genuinely admitted, with no active budget cap and no new
      impediment, would itself be the kind of unscoped, indefinite delay
      DEC-20260914-bb1dbe declined to impose on the image-identity question --
      here inverted: there is no structural reason left to wait, and CLAUDE.md's
      "progress first" instruction and AGENTS.md's "Goals are never paused"
      both counsel against manufacturing one.
    - >-
      WHAT THIS DECISION DOES NOT DO. It does not itself claim
      TASK-20260909-ece919 -- this coordinator has no shell and cannot run
      tools/goal_lanes.py. It does not weaken, edit, or reinterpret any of
      TASK-20260909-ece919's original constraints, deliverables, or
      completion_gate (ledger/handoffs/TASK-20260909-ece919.yaml, read in full
      by this coordinator, unedited). It does not authorize launch on macOS, a
      bypassed adapter, a restarted other task, or any weakened guard -- the
      opposite: it releases the task precisely because the guards are now
      measured, not because they are being set aside.

  evidence_refs:
    - ledger/decisions/DEC-20260914-d471ce.yaml
    - ledger/decisions/DEC-20260914-bb1dbe.yaml
    - ledger/decisions/DEC-20260914-37e0d9.yaml
    - ledger/decisions/DEC-20260909-bf5b48.yaml
    - coordination/frobenius/BATCH-2f8435/admission/linux-runtime-lock-successor-20260914-c85f6a.json
    - coordination/frobenius/BATCH-2f8435/admission/run-binding-successor-20260914-c85f6a.json
    - ledger/handoffs/TASK-20260909-ece919.yaml
    - experiments/EXP-FROB-d8aa37/specification-stage0-v2.yaml
    - experiments/EXP-FROB-d8aa37/stage0/dependencies.json
    - CLAUDE.md ("Research budgets: progress first")
    - orchestration/research-priority.yaml

  verification:
    attribution_note: >-
      HONEST ATTRIBUTION, per AGENTS.md core rule 9. This coordinator subagent
      holds no shell. It did not claim, launch, or execute anything. Every item
      below is marked read_by_coordinator or reported_by_session.
    read_by_coordinator:
      - >-
        ledger/handoffs/TASK-20260909-ece919.yaml in full: its objective, five
        constraints (unweakened, including "Do not launch on macOS with
        weakened guards, bypass adapter or restart other work"), its 16-file
        deliverables/artifact_paths/write_scope, budget block (wall_clock_seconds
        null, memory_gb 8, maximum_runs 1), four-item completion_gate, and its
        execution_binding_pending block (trial_plan_sha256 null, note that the
        parent injects the exact execution object into the queue only after
        admission). archived_by is TASK-20260909-150b1e.
      - >-
        coordination/frobenius/BATCH-2f8435/admission/run-binding-successor-20260914-c85f6a.json's
        own launch_conditions list (four items: fresh claim, adapter strict-hash
        pass, executor native-turn continuity, remote fast-forward), authored
        earlier in this same engagement, cited here verbatim as what remains
        outstanding after this decision.
      - >-
        orchestration/research-priority.yaml line 79 confirming FROB's declared
        ECC-area status.
    reported_by_session:
      - >-
        That no DISSENT record or additional impediment exists against this
        lane beyond IMP-1 (now cleared by DEC-20260914-d471ce) is this
        coordinator's own read of the cited decision chain in this session; it
        did not run a ledger-wide search tool to confirm the absence of a
        DISSENT record elsewhere in the repository.

  launch_readiness_assessment:
    scientific_launch_authorized: >-
      true, per linux-runtime-lock-successor-20260914-c85f6a.json, authored by
      DEC-20260914-d471ce in this same engagement.
    launch_conditions_from_run_binding:
      - condition: "Fresh owned claim must be published and visible through origin refs."
        satisfied: false
        note: "Outstanding. This is the dispatching session's job per next_actions below; this coordinator cannot claim anything."
      - condition: "Adapter must pass strict current authorization, exact committed source/plan/spec/queue hashes and absent run directory."
        satisfied: not_yet_checked
        note: "Mechanically enforced by tools/experiment_execution.py at actual launch time, per TASK-20260909-ece919's own constraint text; not something this coordinator can pre-check without a shell."
      - condition: "Executor must remain in recorded native task/turn, or record and admit a truthful prospective replacement before launch."
        satisfied: not_yet_applicable
        note: "Applies to the executor session that performs the launch, not to this coordinator's admission decision."
      - condition: "Remote checkout must fast-forward to exact final published claim commit without source or dependency mutation."
        satisfied: not_yet_applicable
        note: "Applies at claim/launch time, enforced by the adapter."
    watchdog_status: >-
      dependencies.json.required_runtime.watchdog_seconds is null -- this trial
      has no declared process watchdog. CLAUDE.md states "Memory/concurrency
      limits and explicitly justified process watchdogs remain machine
      protection" but does not itself mandate one exist for every task; this
      coordinator flags the absence explicitly rather than inventing a value,
      and recommends (not mandates, since it cannot edit the frozen dependencies.json)
      that the dispatching/executing session consider an explicit,
      separately-justified wall-clock watchdog around the actual
      tools/experiment_execution.py invocation as ordinary machine protection,
      distinct from and not a substitute for the memory_gb 8 / RLIMIT_AS guards
      already locked.

  what_this_decision_does_not_do:
    - >-
      DOES NOT claim TASK-20260909-ece919. This coordinator has no shell.
    - >-
      DOES NOT edit TASK-20260909-ece919.yaml, specification-stage0-v2.yaml,
      dependencies.json, the trial plan, or either successor lock/binding. All
      remain immutable and unedited.
    - >-
      DOES NOT move H-FROB-73df22, EXP-FROB-d8aa37's status, or any goal
      status. Creates no GOAL-* record.
    - >-
      DOES NOT waive or weaken any of TASK-20260909-ece919's original
      constraints or completion_gate. Does not authorize any deviation from
      "no existing run-root reuse, extra run, sample reduction, output
      fabrication or silent recovery."
    - >-
      DOES NOT assert or predict any scientific outcome. Whether Frobenius
      structure moves the index-calculus exponent on subfield curves is
      untouched by this record in either direction (AGENTS.md core rule 5,
      CLAUDE.md rule 3).

  review_disposition:
    review_required: true
    review_plan: >-
      Unchanged from TASK-20260909-ece919's own handoff (review_plan: null
      there, but its completion_gate item 3 requires "source/run snapshot
      publication and independent scientific review still required" before any
      scientific conclusion is drawn). This decision does not open or specify a
      new review round itself; it releases the trial whose eventual evidence
      will require independent validator/red-team review before any
      H-FROB-73df22 status change, per the standard
      /run -> snapshot commit -> /review-evidence -> ledger commit loop.

  limitations:
    - >-
      Scope: this decision authorizes RELEASE of one queued task for execution.
      It makes no claim about the outcome of that execution and no claim about
      any other cell of the ladder, any other curve, arm A, arm B, or Pollard
      rho.
    - >-
      This coordinator ran no command and cannot itself verify at decision-time
      whether origin/main has moved since the runtime lock's carried-forward
      source-check (head f75319d7ecf54f73d947e70c1652287ebd3ee964); the
      adapter's own strict current-hash check at actual launch time is the
      binding gate, not this decision's own review of that older hash.
    - >-
      No watchdog is declared for this trial (watchdog_seconds null); this
      decision flags rather than resolves that, and does not itself set one,
      since dependencies.json is frozen and not this coordinator's to edit.
    - >-
      This coordinator has no shell and cannot claim, launch, or monitor
      TASK-20260909-ece919. Every mechanical next step is handed to the
      dispatching session below.

  next_actions:
    - >-
      NA-1 (dispatching session, BEFORE claiming): confirm both
      DEC-20260914-d471ce's and this decision's ledger/coordination artifacts
      are committed and pushed first (see DEC-20260914-d471ce's NA-1/NA-2) --
      the runtime_lock_sha256 in run-binding-successor-20260914-c85f6a.json
      must be filled before TASK-20260909-ece919 is claimed, so that the
      binding is complete at claim time, not left with a PENDING field.
    - >-
      NA-2 (dispatching session): claim TASK-20260909-ece919 against the FROB
      batch's dispatch queue with `tools/goal_lanes.py claim`, e.g.:
      `python3 tools/goal_lanes.py claim coordination/frobenius/BATCH-2f8435/dispatch_queue.json
      TASK-20260909-ece919 --as executor --ttl-minutes 360 --publish`. TTL of
      360 minutes (6 hours) is this coordinator's recommendation only, not a
      measured value: the trial has no declared watchdog
      (dependencies.json.required_runtime.watchdog_seconds is null) and no
      wall-clock estimate exists for this specific frozen trial at this scale,
      so the figure is chosen to be generously bounded rather than derived. If
      execution is still legitimately running as the TTL approaches, RENEW the
      claim rather than let it lapse mid-run and rather than treating TTL
      expiry as a negative result -- per CLAUDE.md, "Watchdog expiry checkpoints
      a task; it does not exhaust the campaign."
    - >-
      NA-3 (dispatching session): after claiming, verify the four
      launch_conditions in run-binding-successor-20260914-c85f6a.json are
      actually met at claim time (fresh claim visible through origin refs;
      adapter strict-hash pass against current committed source/plan/spec;
      absent run directory at experiments/EXP-FROB-d8aa37/runs/RUN-FROB-2404fa/;
      executor native-turn continuity or a recorded truthful replacement) before
      invoking `tools/experiment_execution.py run --plan <exact alternate plan>
      --owner <actual owner> --epoch <actual epoch>` per TASK-20260909-ece919's
      own constraint text. This coordinator did not and cannot pre-verify these
      at decision time; they are the executor/adapter's own gate.
    - >-
      NA-4 (executor, once claimed and adapter-admitted): execute
      TASK-20260909-ece919 exactly as specified -- one frozen aggregate trial,
      all 16 declared deliverables, no run-root reuse, no sample reduction, no
      output fabrication, no silent recovery. On interruption/failure, retain
      the adapter receipt and require a prospective new RUN-ID for any retry
      per the task's own constraints; an interruption is infrastructure signal,
      never a negative mathematical result.
    - >-
      NA-5 (coordinator, future): once TASK-20260909-ece919 returns evidence,
      take the Coordinator snapshot commit, then dispatch independent
      validator/red-team review per the standard lifecycle, before any
      H-FROB-73df22 status change or evidence-review decision.
    - >-
      NA-6 (coordinator): DEC-20260914-37e0d9's NA-5 (propose the
      RQ-FROB-7d8dd4 -> GOAL-ECDLP2M-001 attachment) remains outstanding and
      unaffected by this record.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT AN EVIDENCE-REVIEW DECISION AND NO SCIENTIFIC CLAIM RESULTS. This is
      a launch-admission decision releasing a queued task for execution; zero
      scientific runs exist yet for EXP-FROB-d8aa37. Per AGENTS.md core rule 5,
      no infrastructure/admission finding is promoted as a mathematical one.
      Knowledge promotion becomes live only once TASK-20260909-ece919 returns
      evidence and an evidence-review decision is taken (NA-5 above).

  decided_by: coordinator
  decided_at: '2026-09-14'
