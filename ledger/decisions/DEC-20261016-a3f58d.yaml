  context: >-
    DEC-20261012-4e00e6 approved the frozen contract EXP-ECDLP-6f869c: one
    deterministic census in Z/503Z (generator 1, four planted targets, 16
    seeds, DP modulus 16, cap 2000). It is scored only when at least 12 seeds
