  rationale:
    - >-
      Validity first. Run count (1 of 1), frozen inputs, the seed list and
      label, raw/summary agreement and the implementation-agreement control all
      check out. The run record is incomplete: the manifest is not
      schema-complete (V-1); the runner envelope, logs and execution receipt
      are missing (V-2); and the record is unpublished (V-3). Under the
      Coordinator contract an incomplete run set goes back to the executor and
      is not evidence, so EV-ECDLP-7c2e94 does not cite it in run_ids.
    - >-
      Even taken at face value, the census is unscored on both labelings
      (3 < 12 and 6 < 12). The contract's decision_impact.on_unscored applies:
      record the shortfall, compute no ratio, and do not lower the 12-seed rule
      or the 7/5 threshold. Nothing here is amended after the outcome.
    - >-
      This is not a timeout or a budget stop. Derivation D2 (EV-ECDLP-7c2e94)
      shows that the 2000-step cap exceeds the group order 503, so every point
      a walk will ever visit is examined. The drops are structural properties
      of the walk's functional graph and DP set (D3), and the driver is
      deterministic (D4). Re-running this frozen contract reproduces the same
      unscored census, so replicate is not a useful transition.
    - >-
      Not adverse. No weaken or reject_scoped is warranted, because no S/J
      ratio was scored. The derivation is recorded as the checkable basis
      (proof_status derivation) for the neutral direction only.
    - >-
      Two declared controls cannot fail (V-7: the planted-residue check is the
      identity by D1, and the two step implementations are the same loop), and
      the separate arm is accounting from one shared walk with S >= J by
      construction (D5, V-8). A successor contract must fix these before any
      reading counts.
    - >-
      Success criterion (AGENTS.md "Every improvement is a success"): no ECDLP
      cost is measured, so there is no improvement over the index-calculus
      baseline to record. The distance remaining to the matched rho is not
      measured by this experiment. A scored ratio would have been a
      constant-factor accounting quantity in any case, not an improvement.
