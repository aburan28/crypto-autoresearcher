  context: >-
    When this session merged origin/main into
    md5-001-927ab5-archive-20260819 after closing BATCH-04272f, the merge
    produced a content conflict in ledger/goals/GOAL-MD5-001.yaml. The
    conflict revealed that a second, parallel coordinator session had
    opened and closed its own "batch 4 of 7" for the same goal -
    BATCH-af29f6 on main (ledger archive commit
    9ca1d80544cf85de8e2ea80342bf84cf546ceb68, DEC-20260821-1215e5) - while
    this session opened and closed BATCH-04272f on this branch (ledger
    archive commit 47768b803, DEC-20260821-117817). Both lineages descend
    from the same post-batch-3 base (BATCH-1f30fe, DEC-20260821-6df1e9,
    961fd1c6c) and both read the same batch-3 next_action ("open BATCH-4:
    METHOD-CEILING AUDIT, MD4 FIRST, NOT MD5"); they diverged on the audit
    INSTRUMENT: lineage A audited the declared enumeration instrument
    class (bounded meet-table/birthday enumeration) as frozen in BCP-2,
    while lineage B built a new two-free-word splice-and-cut MITM
    instrument for the audit. Neither session had visibility of the other
    at opening: BATCH-04272f never reached main before the fork, and the
    18000 s pre-registered stop (DEC-20260821-ddaa33) exists only in this
    branch's opening decision. This decision is the superseding
    adjudication of the fork: it does not pick a side of the goal-head
    conflict (AGENTS.md: a conflict in a ledger record is resolved by a
    new superseding record, never by an edit that picks one side), and it
    is the record the merged goal head now points at.
  findings:
    - id: F-1
      text: >-
        FORK FACTS. Two parallel coordinator sessions each opened and
        closed a different "batch 4 of 7" for GOAL-MD5-001 from the
        common post-batch-3 base, without visibility of each other.
        Lineage A (this branch, PR #496): BATCH-04272f, 8 tasks, declared
        6320 s (17620 s cumulative declared through the batch after
        repair tasks), closing ledger archive commit 47768b803
        (content_first, 5 paths; DEF-PROC1 disclosed in
        DEC-20260821-117817 F-2), method-ceiling statement issued at its
        named scope (EV-MDFIVE-1a2952 O-5), both independent reviews
        HOLDS. Lineage B (main): BATCH-af29f6, 8 tasks, declared 4370 s
        (15270 s cumulative declared at its opening per
        DEC-20260821-5ab6a1), closing ledger archive commit
        9ca1d80544cf85de8e2ea80342bf84cf546ceb68 (content_first, 6
        paths), ANOM-1 established by both independent reviews,
        H-MDFIVE-bf7767 WEAKENED (DEC-20260821-1215e5 F-2), claim tier
        capped at analyzed. Both batches are fully closed with all tasks
        terminal and verified archives; both batch directories coexist in
        the merged tree; there is NO task- or artifact-level conflict -
        the only overlapping path is the mutable goal head. No rule was
        violated at either opening: each session's declared cumulative at
        its own batch-4 opening (17220 s and 15270 s respectively) was
        below the 18000 s stop that existed only in lineage A's opening
        decision; the fork is a coordination failure of session
        isolation, recorded as such, not a compliance failure by either
        session.
    - id: F-2
      text: >-
        CRITERION 3 ADJUDICATION: OPEN, with two measured, complementary
        pillars. The criterion (goal head, completion_criteria 3) asks for
        "A METHOD CEILING STATEMENT for MITM/biclique preimages against
        MD5: the strongest certifiable claim, the named obstruction, the
        argument, and what remains open - with MD4 run through the
        identical audit as the control where the method does break
        through." The two lineages' closed decisions made opposite
        criterion-level calls - DEC-20260821-117817 F-4 recorded the
        statement as ISSUED; DEC-20260821-1215e5 F-6 recorded the
        criterion as OPEN - each with only its own lineage visible. This
        decision supersedes the criterion-level reading of
        DEC-20260821-117817 F-4 (and only that reading; the statement
        itself, EV-MDFIVE-1a2952 O-5, stands unimpaired at its named
        scope, and F-4's in-audit-scope finding that the declared
        enumeration class is ceiling-bound at the declared budget on both
        primitives is exactly pillar (a) below). The conservative reading
        prevails because it is the correct one under the criterion's
        text: neither pillar alone closes the MITM/biclique scope.
        PILLAR (a): the declared enumeration instrument class is
        ceiling-bound at the declared budget on both in-scope primitives
        (MD4 row R6, R = 0.9935513427; MD5 anchor row R6, R = 1.018031),
        named obstruction = the random-collision floor of the 40-bit meet
        table, measured at the floor on all four objects (EV-MDFIVE-
        1a2952 O-5). PILLAR (b): the S=9 two-free-word splice-and-cut
        MITM construction is structurally obstructed - its declared
        matching quantity (register A immediately after step 9) is PROVEN
        mathematically independent of free word9, independently
        reconfirmed four ways (EV-MDFIVE-ab007d ANOM-1); a named
        obstruction WITH AN ARGUMENT, which is what the criterion
        requires, against a named construction. WHAT REMAINS OPEN under
        the criterion: a genuinely two-free-word instrument has not yet
        been measured (DEC-20260821-1215e5 F-6); the instrument-class
        ~2^64-block-gap cost question is unanswered at either modeled or
        measured level (DEC-20260821-1215e5 F-8); the "identical audit"
        on both primitives has not been completed for the MITM method
        itself (lineage B's MD5 arm was an identically-bounded conditional
        comparison at R=1.0, not a ceiling measurement); and the MD4
        "breaks through" control is demonstrated only at the one-
        effective-free-word locator level, not to a full preimage.
    - id: F-3
      text: >-
        COMBINED BUDGET: 21990 s declared (lineage A 17620 s + lineage B
        4370 s) vs the 10800 s original plan and the 18000 s pre-
        registered stop (DEC-20260821-ddaa33: "if the cumulative declared
        total exceeds 18000 s before a batch-5 opening, the goal is
        PAUSED with a concrete resume action"). The stop keys off
        DECLARED sums. Lineage B's DEC-20260821-1215e5 F-9 observed that
        ACTUAL measured compute through batch 4 is ~11000 s (its batch
        added well under 100 s actual against 4370 s declared) and
        characterized the declared-overage flag as "a planning caution,
        not a retraction" - that observation is recorded here as
        context: it explains why the declared total overstates actual
        compute (the declared envelope prices authoring, verification,
        and review headroom, and lineage A's RANK-1 5.4x overrun pattern
        shows declared envelopes are upper bounds, not predictions). It
        does not release the stop: a stop pre-registered at a batch
        opening is not un-pre-registered by a parallel session's closing
        decision, and lineage B's own text concedes "the campaign's
        stopping rules key off declared ceilings, not actual spend." The
        stop is now tripped by the COMBINED declared total (21990 s >
        18000 s), so NO batch-5 opening is permitted under either
        lineage's plan before a user budget authorization recorded in a
        new Coordinator decision.
    - id: F-4
      text: >-
        GOAL STATE: PAUSED (unchanged). The pause was committed in
        DEC-20260821-117817 F-6 before the fork was discovered; the
        fork's combined budget strengthens rather than weakens it. The
        merged goal head is set to: status paused; current_batch_id null
        and dispatch_queue_path null BY DESIGN (no batch is open; both
        batch-4 queues exist in the tree and are fully closed; the
        head's single-batch fields cannot name two, and null names
        neither falsely); latest_verified_commit 47768b803 (lineage A's
        archive, this branch) with the note recording lineage B's
        equally-verified archive 9ca1d80544cf85de8e2ea80342bf84cf546ceb68
        (both reachable from the merged tree). The unified next_action
        supersedes both per-lineage next_actions and carries the union of
        their still-binding content (criterion standing, citation
        constraints, quarantine, unverified-figure marking).
    - id: F-5
      text: >-
        NAMED GAPS. (a) REVIEW TIER, lineage A: the batch-4 review round
        ran at review-adversarial (xhigh) per the pre-committed review
        plan, as the opening decision DEC-20260821-ddaa33 designated;
        the ceiling statement's ISSUANCE at close is closure-adjacent,
        and AGENTS.md rule 12 routes proposed closure results to
        review-breakthrough at max. This runtime cannot serve
        review-breakthrough (no max-tier backend resolves), so the gap
        is recorded, not papered over: EV-MDFIVE-1a2952 O-5 is valid at
        its named instrument scope and explicitly NOT a lane closure (its
        own DOES_NOT_SHOW says so, and the escape routes remain open),
        but ANY goal close resting on criterion 3 being met is a closure
        result that requires the max tier and is BLOCKED on this runtime
        until a backend that can reach it resolves (AGENTS.md: an
        unservable tier is a pause condition, never a substitution).
        (b) LINEAGE B SENTINEL REPAIR: main's goal head carried
        latest_verified_commit: PENDING_POST_COMMIT (their driving
        session had no Bash/git access and delegated the fill to a post-
        commit render that never ran); this decision repairs it to
        9ca1d80544cf85de8e2ea80342bf84cf546ceb68 in the merged head, per
        the sentinel convention in that batch's ledger-receipt.json.
        (c) MUTABLE-HEAD BINDING TENSION: after this merge, the goal
        head's bytes differ from the bytes lineage B's archive bound at
        9ca1d8054; their content_first binding is a record of the state
        at their archive commit, not a perpetual lock, and no repair is
        made on this branch - future head edits by the resuming
        Coordinator will carry the divergence forward in the note, as
        this one does.
    - id: F-6
      text: >-
        DEFERRED OBLIGATIONS CARRIED INTO BATCH 5 (or a scoped repair
        task at resume), the union of both lineages' deferrals: (1) the
        H-MDFIVE-bf7767 status -> weakened status-field edit (DEC-
        20260821-1215e5 F-2; requires a task with ledger/hypotheses/ in
        write_scope; the F-2 ruling itself stands now); (2) the deferred
        KN-TECH entry naming ANOM-1 as a reusable splice-and-cut/MITM
        design pitfall (DEC-20260821-1215e5 knowledge_promotion; cite
        EV-MDFIVE-ab007d, H-MDFIVE-bf7767, DEC-20260821-1215e5); (3) the
        two deferred KN-LIT candidates (frontier ledger; ceiling
        statement) revisited at goal close (DEC-20260821-117817
        knowledge_promotion) - their revisit is now conditional on
        criterion 3 actually closing, which F-5(a) blocks on this
