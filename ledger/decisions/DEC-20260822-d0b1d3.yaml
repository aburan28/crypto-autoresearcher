        #496 bookkeeping commit and are bound by the next ledger commit
        (the batch-5 ledger archive, or a repair/ledger task if the goal
        closes first).
    - id: F-7
      text: >-
        RESUME ACTION (USER AUTHORITY; both parts required). (1) BUDGET
        AUTHORIZATION for a COMBINED batch-5 envelope: lineage A
        demonstrations ~1760 s (CAND-1 on MD4 at 2^21 with its predicted
        non-random partial-hit signature and falsification condition;
        CAND-2 at mid-state width 20) plus lineage B corrected-design
        work ~1560 s (idea-generator names a specific split-point/
        matching-quantity fix; KN-TECH-080's four proof_search_map
        audits re-run on the new construction; MANDATORY k1=k2=4 two-
        way-dependence spot-check gate passed BEFORE any declared-scale
        run; then the MD4 primary certificate and a genuine HEUR-H1
        validation run; an MD5 arm only if named and approved at
        identical bounded scale) - re-declared at opening, combined
        cumulative ~25310 s projected vs the 10800 s original plan - or
        a user-directed reduced scope that fits an honest envelope.
        (2) CONFIRMATION that batch 5 runs the COMBINED plan as one
        queue: the two obstructions are independent and complementary
        (one bounds the declared class's cost; the other proves a
        structural defect in a named MITM construction), each lineage's
        batch-5 work stands alone, and the resuming Coordinator
        sequences them in a single dispatch queue. STILL BINDING ON
        RESUME: dependent goals may cite per DEC-20260821-117817 F-3
        (lineage A: cost anchors and the in-scope statement, not as
        security evidence) and per DEC-20260821-1215e5 F-2/F-4 (lineage
        B: the 512x/R=1.0 figures are a design-pitfall record only,
        never evidence of a genuine two-free-word speedup or of MD4/MD5
        divergence); every figure in RQ-MDFIVE-6870c1 provenance not
        obtained in primary text remains marked unverified (F-7
        UNSETTLED with a reviewer pointer, DEC-20260810-1163ec); NO
        BATCH TASK READS THE QUARANTINED PAYLOAD (hash-only throughout).
        Completion criteria standing after the fork: 1 (blind
        calibration, row R6), 4 (both review rounds, both lineages), 5
        (both verified ledger archives) met; 2's chosen-prefix component
        NAMED as never executed (the protocol declared identical-prefix
