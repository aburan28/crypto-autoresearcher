coordinator_decision:
  id: DEC-20260913-92aa48
  recorded_at: '2026-09-13'
  decided_at: '2026-09-13T23:10:00Z'
  decided_by: coordinator
  recorded_by_task: TASK-20260913-de1707
  archived_by: TASK-20260913-de1707
  goal_id: GOAL-SEMBIN-5078bc
  batch_id: BATCH-9d649f
  decision: support
  decision_label: >-
    H-SEMBIN-83a856 (trace-parity confinement) moves to `supported` in its tested
    scope on EV-SEMBIN-0c8bf4; EXP-SEMBIN-911efe moves to `analyzed`; the
    contract's literal N1 = 16 is recorded as a procedure finding about the
    contract's wording, localized and diagnosed by two independent computations;
    the open attribution of EV-SEMBIN-d40877 O-5 is closed by reference at t = 2.
  context: >-
    EXP-SEMBIN-911efe re-analyzed the committed per-target counts of
    RUN-SEMBIN-1b9afe by one deterministic integer and a shape test, added two
    exhaustive odd-n cells as the nearby-object control, and ran the null object
    and two known-false splits. The executor (TASK-20260913-1d3db7,
    RUN-SEMBIN-8be036, snapshot e7a7f6ddb by TASK-20260913-e39bfe) reported
    N1 = 16 and stopped to diagnose, as the stopping rule required. The
    Coordinator wrote review-plan REVIEW-SEMBIN-20260913-911efe with its prior
    recorded first (expecting K1 to hold with the sixteen a contract-wording
    defect; expecting K2 to hold; naming the pooled-vs-(1 + lambda) interval and
    the Tr = 0 class mean as the places it might not). The validator
    (TASK-20260913-0d6586) computed both N1 integers with its own trace code
    before opening the producer's outputs, verified the twist-side a from the
    source construction, bootstrapped per-configuration and per-cell intervals,
    reran both known-false splits, checked the odd-n cells were enumerated and
    not sampled, and returned K1 holds, K2 holds, verdict passed, with three
    limitations. tools/check_review_independence.py passes on the round.
  target_ids:
    - H-SEMBIN-83a856
    - EXP-SEMBIN-911efe
    - RUN-SEMBIN-8be036
    - EV-SEMBIN-0c8bf4
    - REVIEW-SEMBIN-20260913-911efe
    - EV-SEMBIN-d40877

  official_transitions:
    H-SEMBIN-83a856:
      from: specified
      to: supported
      via: [approved, running, analyzed]
      basis: >-
        P1 holds on the object the hypothesis states -- F_q-rational m-decompositions:
        zero usable decompositions on all 79 751 targets of the predicted-empty
        class over 40 even-n low-degree configurations, both sides, with each side's
        a and the moduli verified independently (EV-SEMBIN-0c8bf4 O-2). P2 holds at
        the contract's cell grain: reachable-class variance/mean interval contains 1
        at n = 20, 22, 24; reachable mean is twice the pooled mean; pooled
        variance/mean equals 1 + lambda within its interval at all three cells with
        no fitted parameter (O-3). P3 holds: the random-V null shows both classes
        populated, no over-dispersion (O-5). P4 holds: odd-n f_dispersion
        0.985-1.015 on two exhaustive new cells (O-6). P5 is untestable from the
        archive and is not scored (O-8). P6 is a re-reading. Both known-false splits
        fail to produce an empty class (O-1). `supported` rather than `replicated`:
        one run, one review round. `supported` in spite of the literal N1 = 16
        because the sixteen are algebraic x-multisets with non-F_q-rational y at one
        |V| = 4 cell, which the theorem does not speak to, and both computations
        agree on that pair-for-pair; the wording defect is the contract's and is
        recorded below as a deviation, not as a fact about the curve. Strength
        stays `preliminary`; claim tier `toy`.
    EXP-SEMBIN-911efe:
      from: approved
      to: analyzed
      via: [running, completed]
      basis: Evidence record EV-SEMBIN-0c8bf4 written and archived under this decision.

  refuted_priors: []
  confirmed_priors:
    - joint: K1
      prior: >-
        K1 holds, with the sixteen a contract-wording defect: N1 restricted to
        usable decompositions is 0 and the sixteen are non-usable x-multisets at
        n = 12, t = 6, k = 2 on the twist; verify a_T is the twist's a and that
        pi = 1 is the class predicted empty.
      finding: >-
        Confirmed in every particular by an integer computed before the producer's
        file was opened: N1 (i) = 16 with the same sixteen keys, N1 (ii) = 0,
        a_T = 512 = the first trace-1 element (fastfield.twist_a), Tr(a_T) = 1,
        m Tr(a_T) = 0 so pi = 1 is predicted empty, all sixteen at pi = 1 with
        Tr(x_R) = 0 and usable = 0. The Coordinator's prior was formed from the
        executor's summary and is therefore not independent of the producer; the
        validator's integer is.
      by: TASK-20260913-0d6586
    - joint: K2
      prior: >-
        K2 holds; the pooled-vs-(1 + lambda) comparison needs a stated interval,
        and the Tr = 0 class mean should be checked against twice the pooled mean.
      finding: >-
        Confirmed with the intervals the prior asked for. At cell grain every
        reachable-class D interval contains 1 and every pooled D - (1 + lambda)
        interval contains 0; all six mean/(2 pooled) ratio intervals contain 1.
        The prior did NOT anticipate the (n = 22, B = 1) box excluding 1 at box
        grain (z = 2.10) while the sibling B box sits below 1 + lambda; the
        validator disclosed it as a limitation and the Coordinator carries it as
        EV-SEMBIN-0c8bf4 O-4 and a replication condition.
      by: TASK-20260913-0d6586
    - joint: proves_too_much
      prior: >-
        The random-V configurations must show two populated classes with equal
        means; an empty or depleted class there would mean the split code, not
        the curve, produces the effect.
      finding: >-
        Both classes populated at every (n, B) box on E with means of the same
        order and per-class D in [0.980, 1.016]; mixture signature absent.
        Passed.
      by: TASK-20260913-0d6586

  procedure_deviations:
    - id: PD-F
      what: >-
        CONTRACT-WORDING DEFECT IN P1. The frozen contract's N1 counts a nonzero
        entry "in either presentation" and the run scored it on the x-multiset
        columns, which include algebraic solutions whose y-coordinates lie in
        F_{q^2} \ F_q. The hypothesis's theorem is about F_q-rational points.
        Both the hypothesis's first falsification condition ("such a count
        indicates an error in the recorded x_R, the modulus, or the reading of the
        code, and is recorded as a procedure finding before any claim") and the
        contract's stopping rule anticipated this class of event, and both were
        followed: the executor stopped and diagnosed, the validator re-derived. The
        frozen specification is NOT edited; this decision records the defect and
        the successor contract defines N1 on usable_point_multiset (points of
        E(F_q)) explicitly. The literal falsification criterion "N1 > 0 with a,
        modulus and x_R verified" is therefore read as the procedure finding it
        was written to be, and the Coordinator states plainly that it is choosing
        the theorem's object over the contract's column, on two independent
        computations that agree.
    - id: PD-G
      what: >-
        NO SEPARATE BLIND RE-DERIVATION SESSION. review-plan.yaml records
        blind_rederivation.required false, because the load-bearing quantity is an
        exact integer over committed data and the single validator computed it under
        a declared sequencing before opening the producer's outputs; the plan gives
        the backend impediment (IMP-SEMBIN-REVIEW-MAX) as the reason a second
        session was not spent. Recorded again here because a sequencing inside one
        session is weaker than a second session, and the difference should be
        visible from the decision, not only from the plan.
    - id: PD-H
      what: >-
        NEITHER SESSION RAN ON THE BOUND BACKEND. Producer cursor-grok-4.6-medium
        (requested executor-implementation), validator cursor-grok-4.6-xhigh
        (requested review-adversarial at xhigh), both under the fallback
        DEC-20260913-c224bb authorized while claude-fable-5-1-thinking is at its
        usage limit; both model_verified false. The review-adversarial policy's
        independent-session requirement is met; its effort requirement is met by
        the fallback model's own xhigh tier as the runtime reports it.

  rationale:
    - >-
      The deterministic prediction is the strongest kind this program can test: a
      universal statement over committed data with zero free parameters, computed
      twice, once under sequencing that kept the second computation from reading
      the first. Both give 0 on the object the theorem names.
    - >-
      The "whole deficit" clause was the part the Coordinator's prior flagged as
      most likely to fail, and it survived the intervals it lacked: the Poisson
      shape inside the reachable class, the 2x mean, and pooled 1 + lambda are all
      inside their bootstrap intervals at the declared grain. That closes the
      first unresolved confound of EV-SEMBIN-d40877 at t = 2 by reference; that
      record is not edited.
    - >-
      The controls did their job in both directions: the null object shows no
      stratification, the odd-n nearby object shows no deficit, and the known-false
      splits fail to manufacture an empty class. A confinement effect that the
      split machinery could produce on any split would have shown up on the LSB
      or second-irreducible split; it did not.
    - >-
      The sixteen are not hidden behind the finding. They are localized to one
      cell, classified the same way by two computations, and the classification
      rests on a distinction the hypothesis statement makes explicitly ("points of
      E(F_q)"). The remedy is a better-worded successor contract, which
      next_actions names.

  next_actions:
    - >-
      Curate KN-FIND for the parity-confinement theorem and the even-n
      confinement of Semaev's low-degree window (EV-SEMBIN-0c8bf4
      knowledge_promotion_reason), in a scoped task whose write scope includes
      knowledge/findings; cite EV-SEMBIN-0c8bf4 O-1, O-2 and the (F2) selftest.
      The whole-deficit attribution is cited as preliminary, not promoted.
    - >-
      Replication at n = 22 with >= 20 seeds per B mode to resolve the (n = 22,
      B = 1) box (O-4); define N1 on usable_point_multiset in that contract.
    - >-
      Extend to t = 3 at |V| >= 2^10 where the source cells could not resolve the
      deficit, testing whether the reachable-class Poisson shape at mean 2 lambda
      holds for m = 3 (the theorem fixes the empty class for every m; the shape
      is measured only at t = 2).
    - >-
      Explain the twist's uniformly zero usable count at t = 2 (O-7) before any
      twist-side shape claim; until then every shape statement is E-side.
    - >-
      Record the Nagao Section 7 parity condition (sum_i Tr(v_i) = m Tr(a) mod 2)
      as a condition in the Nagao costing lane (GOAL-SEMBIN-fcb7a2 design), by
      theorem, with this evidence cited for the mechanism and not for the
      transfer.

  evidence_refs:
    - EV-SEMBIN-0c8bf4
    - RUN-SEMBIN-8be036
    - RUN-SEMBIN-1b9afe
    - coordination/review/sembin-20260913-911efe/TASK-20260913-0d6586/validation_report.yaml
    - coordination/review/sembin-20260913-911efe/TASK-20260913-0d6586/independent-figures.json

  citations:
    - claim: >-
        The point-halving criterion on an ordinary binary curve: P is in 2E(F_q)
        iff Tr(x_P) = Tr(a) (the (F2) direction used by the hypothesis).
      source: >-
        IDEA-20260913-cedd2f retrieved sources (Fong-Hankerson-Lopez-Menezes 2003
        Lemma 4.1; Pornin ePrint 2022/1325 Section 3); re-verified inside the run by
        exhaustive enumeration at n = 7, 8, 9, a in {0, 1} (raw-result.json selftest)
      provenance: internal
      verified_by: TASK-20260913-1d3db7 (selftest) and TASK-20260913-0d6586 (read from raw-result.json)
    - claim: >-
        Semaev's own text prefers the low-degree-polynomial subspace for V.
      source: inputs/SEMAEV-2015-310/paper_fulltext.md lines 539-545
      provenance: retrieved
      verified_by: TASK-20260913-31d530

  limitations:
    - >-
      NOTHING IN THIS DECISION IS A STATEMENT ABOUT THE SECURITY OF ANY CURVE AT ANY
      PARAMETER, IN EITHER DIRECTION.
    - >-
      Toy scale: n <= 24, |V| <= 4096. The theorem transfers; the shape measurement
      does not, except as stated.
    - >-
      Whole-deficit attribution at t = 2 only, E side only; one box at 2.1 sigma
      inside a cell that contains its target.
    - >-
      `supported` on one run and one review round with strength `preliminary`;
      `replicated` requires the successor named above.
    - >-
      No degree is measured or asserted; the Groebner-side trade-off of the
      low-degree window is not assessed.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Not "not warranted": DEFERRED TO A SCOPED TASK. The archive recording this
      decision (TASK-20260913-de1707) has no write scope under knowledge/, so no
      KN-FIND can be written in it. The first next_action is that task. The
      whole-deficit attribution is not promoted for the reasons in
      EV-SEMBIN-0c8bf4 knowledge_promotion_reason.

  standing_user_authorization:
    cited: '2026-09-06: "all is approved. ideas/experiments should be always approved"'
    applied_to: []
    note: >-
      This decision approves nothing; it composes a review and moves a hypothesis
      status, which is Coordinator authority and needs no user authorization. The
      successor contracts named in next_actions will cite the standing
      authorization when complete.
