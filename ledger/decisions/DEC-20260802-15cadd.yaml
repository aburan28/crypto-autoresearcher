  refutation_artifact_accounting: >-
    docs/claims-and-verification.md requires the strongest checkable refutation
    artifact an adverse transition admits, archived before the decision relying
    on it. This decision makes NO adverse transition — no `weaken`, no
    `reject_scoped`, no hypothesis moved to `rejected` — so that gate is not
    crossed. The artifacts are nonetheless recorded at their honest level:
    objection 2 is a `derivation` (a counting-bound identity, checkable in one
    line, reproduced by me and independently by the validator from the opposite
    direction); objection 1 is a retrieved counterexample witness against Q3's
    broad form, verified by me at n=90 and recorded on the red team's retrievals
    at n=40..80. EV-MLKEM-017 carries `proof_status: derivation` accordingly. The
    review artifacts are archived in the SAME commit as this decision, not a
    predecessor one, because `tools/research_dispatch.py` verifies a ledger
    archive against the union of its declared archive paths and its source
    tasks' paths in one commit; see the ledger commit receipt for that note.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Two reasons, both concrete. (1) GATED. The one result strong enough to be
      durable — the counting-resolution confound — would supersede the coverage
      statistics carried by KN-FIND-012 and KN-FIND-014. Under AGENTS.md rule 12
      that is a contradiction between validated evidence records and requires an
      independent `review-breakthrough` review at `max` before it may change
      their official standing. Promoting a KN-FIND now would accomplish through
      the knowledge corpus precisely the status change the rule forbids making
      directly, so it is refused. (2) PREMATURE. The Ducas-Pulles counter-evidence
      is a fact about a third-party published result that this program has now
      verified at exactly one dimension (n=90, by me) and has not yet mined; the
      other five dimensions rest on the red team's retrievals. A KN-FIND written
      today would be a citation stub, and the correct vehicle is the existing
      literature entry KN-LIT-111, whose own "Not verified here" section records
      that only the abstract was read — upgrading that entry is a
      `/curate-knowledge` action that belongs with the mined result, not ahead of
      it. Also note that the decision disposition is `revise`, which does not
      itself trigger the promotion requirement.
    concrete_successor: >-
      BATCH-008 (the final batch under `maximum_batches: 8`). Its producer task
      mines the Ducas-Pulles data and runs the zero-compute extrapolation test on
      Carrier's archived Pwrong; its review task is the rule-12
      `review-breakthrough` pass on the counting-resolution contradiction. The
      promotion decision is then made in BATCH-008's ledger decision, on
      EV-MLKEM-018, with both the KN-FIND-012 / KN-FIND-014 supersession and the
      KN-LIT-111 upgrade in scope.
    promote: false

  ranking_rationale:
    basis: >-
      AGENTS.md "Research-direction integrity and auditability". Exactly one
      batch remains (this is batch 7 of `maximum_batches: 8`), so the ranking
      below is the whole remaining allocation and is recorded with the evidence,
      budget, test boundary, remaining uncertainty, and revisit condition each
      candidate carries.
    candidates:
      - id: A
        candidate: >-
          Re-scope Q3 explicitly to Carrier's polar-coded score, and mine the
          Ducas-Pulles paper and published CSVs properly: the measured
          log2(Pwrong) at the measured Pgood=1/2 threshold across n=40..90, the
          measured-vs-predicted excess (9.12 bits at n=90) and its trend in n,
          and what the waterfall-floor phenomenon does or does not imply for a
          polar-coded score.
        rank: 1
        cost: >-
          Near zero. About 100 KB of network, all URLs and sha256 already
          recorded in RT-20260802-3a440d; no lattice computation, no G6K.
        why_first: >-
          Highest information per unit cost by a wide margin, and it is the only
          candidate that produces new knowledge rather than repairing the
          program's own record. It bears directly on the goal's stated residual
          (KN-OPEN-016: does the dual attack beat the primal attack once its
          heuristics are repaired), because the excess is measured in exactly the
          direction that raises Pwrong. It also repays the process failure this
          batch exposed: the single most transferable paper in the lattice corpus
          has been reachable and unread since 2026-07-24.
        test_boundary: >-
          Dual-Sieve-FFT score, n=40..90, published third-party data. Transfer to
          Carrier's polar-coded score is a stated open question, not an inference.
      - id: B
        candidate: >-
          Independent `review-breakthrough` at `max` on the counting-resolution
          contradiction (AGENTS.md rule 12), as the gate on any status change to
          EV-MLKEM-011 / EV-MLKEM-013 and on any KN-FIND supersession.
        rank: 2
        cost: One independent review session; no compute.
        why_second_and_not_competing: >-
          This is a required gate, not a rival use of the batch. A batch carries
          an independent review task in any case, so B rides in the same batch as
          A rather than displacing it. Ranked below A only in the sense that it
          generates no new knowledge by itself; it is not optional.
        stated_risk: >-
          `review-breakthrough` may never be degraded and refuses a backend that
          cannot reach `max`. Under this harness, subagent frontmatter resolves
          only Claude models and both BATCH-007 reviewers recorded
          `fallback_used: true` with `model_verified: false`. If the runtime
          cannot serve `review-breakthrough` at `max` without degradation, the
          review does not run, the contradiction stays
          alleged-and-coordinator-verified, and EV-MLKEM-011 / EV-MLKEM-013 keep
          their current status. That outcome is acceptable and is the safe one;
          what is not acceptable is recording a review that was silently
          downgraded.
      - id: C
        candidate: >-
          The standing expensive branch: install G6K and measure Pwrong near the
          aligned Pgood-median threshold (the next_action DEC-20260731-006 left
          behind).
        rank: 3
        deprioritized: true
        evidence_for_deprioritization: >-
          Blocked twice on infrastructure — BATCH-003 (EV-MLKEM-011: "Fresh
          verifyModel runs blocked: G6K not installed") and BATCH-005
          (EV-MLKEM-013: G6K install failed). Two install failures are
          infrastructure signal, never mathematical evidence (AGENTS.md rule 5),
          and they are also a cost estimate.
        budget: >-
          It is the campaign's declared expensive branch and would consume the
          entire remaining batch with a demonstrated failure history, leaving A
          and B undone.
        test_boundary_and_remaining_uncertainty: >-
          Objection 2 may make this measurement moot or, more likely, reframe it.
          If the coverage gap is a sample-budget boundary rather than a
          distributional one, the decisive question is no longer "measure Pwrong
          at the threshold with a fresh sieve" but "what nb_iteration is required
          to push the counting-resolution floor below the aligned Pgood minimum
          at score 2222.56, and does the measured survival function extrapolated
          to that point agree with Approximation 4.9?" — which needs arithmetic,
          not G6K. Whether a fresh G6K run at reachable parameters would beat that
          extrapolation is genuinely open and is NOT closed here.
        revisit_condition: >-
          Reopen the measurement branch if EITHER (i) BATCH-008's extrapolation
          shows the archived survival function is inconsistent with Approximation
          4.9 at the aligned threshold, so a direct measurement becomes decisive;
          OR (ii) the required nb_iteration is computed and found feasible within
          a campaign budget, in which case a longer run of the authors' own
          verifyModel is the cheaper route and G6K is not needed; OR (iii) a
          working G6K install is demonstrated independently of this goal.
        successor: >-
          BATCH-008 task computing the required nb_iteration and the extrapolation
          test, which is the cheap precursor to any measurement.
    dominated_by: >-
      For the question "has measured Pwrong at the Pgood=1/2 threshold been
      reported for a dual-sieve-FFT score?", this program's standing position is
      dominated by Ducas-Pulles sections 5.2-5.3 and their published CSVs on
      every axis that matters (tail depth measured, dimensions covered, common
      score scale). For the narrower question about Carrier's polar-coded score
      at Carrier's Fig 4.1 parameters, the red team found no dominating source
      and declines to assert completeness, because Guo-Johansson remains
      unretrieved.
    sota_delta: >-
      Zero. BATCH-007 produced no time, memory, data/query, or security-bits
      delta against any baseline, and claims none. Its delta over the program's
      own standing records is negative-going: Q2 is zero by construction
      (head == pin), Q1 is zero at the byte level against the side the question
      named, and Q3's broad form moved from asserted to refuted.
    named_obstruction: >-
      Carrier's archived verifyModel outputs CANNOT exhibit Pwrong at the aligned
      Pgood approx 1/2 threshold, because each file's support terminates exactly
      at its counting-resolution floor 1/(nb_iteration * q^k_fft) — 2^-35.70,
      2^-23.74 and 2^-36.29 for the three archived files — while the aligned
      Pgood minimum for the only doubly-instrumented parameter set sits at score
      2222.56, about 420.56 units beyond where that budget expires. This is a
      sample-budget boundary, not a measured absence of mass. It is a named
      obstruction with an argument, not a retrieval count, and it meets the
      docs/inventor-protocol.md section 4 closure standard for the statement it
      makes — which is a statement about the archived data, not about
      Approximation 4.9.
    forward_guidance: >-
      Open: whether the Ducas-Pulles waterfall floor transfers to Carrier's
      polar-coded score (Carrier's abstract claims their analysis avoids the
      flawed independence assumptions, so this is a real question); what
      nb_iteration reaches score 2222.56 at those parameters; whether the
      extrapolated Carrier survival function agrees with Approximation 4.9 at the
      aligned threshold; and Guo-Johansson, still unread.

  limitations:
    - >-
      This decision covers exactly BATCH-007's three adjudication questions and
      the two blocking objections against them. It adjudicates nothing about
      ML-KEM security, about whether 143.30 or 134.30 is the arithmetically
      correct value, about Carrier's Kyber cost figures, or about KN-OPEN-016.
    - >-
      A source adjudication is literature/provenance-tier evidence about what
      published sources say. It is never a measurement.
    - >-
      Where measured data appear at all they are toy-parameter (q=241, m=40,
      n=43/50; Ducas-Pulles n=40..90) and are never presented as crypto-scale.
    - >-
      Both BATCH-007 reviewers recorded `fallback_used: true` and
      `model_verified: false` (the harness cannot resolve the policy aliases and
      no `doctor --probe` was run). The reviews are independent sessions and
      their findings stand on reproducible artifacts, but their inference
      provenance is self-reported.
    - >-
      Objection 3 (the 143.30 cell is arithmetically over-determined by the
      paper's own tables, hence a self-correcting appendix typo with no
      downstream reach) is accepted as materially plausible and is NOT
      independently re-derived by me. It is not load-bearing for anything in this
      decision.

