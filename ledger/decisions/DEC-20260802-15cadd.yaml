  id: DEC-20260802-15cadd
  goal_id: GOAL-MLKEM-003
  batch_id: BATCH-007
  recorded_by_task: TASK-20260802-105
  authorized_by: DEC-20260802-002
  recorded_at: '2026-08-02'

  id_provenance: >-
    The BATCH-007 dispatch queue planned this record as DEC-20260802-003. That
    identifier was allocated sequentially when the queue was written and
    GOAL-ECDLP-001 BATCH-026 committed it first (`tools/allocate_id.py --check
    DEC-20260802-003` returns REFUSE: taken). DEC-20260802-15cadd was minted with
    `--next coordinator_decision --date 20260802` and verified free before use
    (AGENTS.md rule 14). No completed archive binds DEC-20260802-003 to this
    batch — TASK-20260802-102, the only completed archive here, carries
    `record_ids: []` — so repointing a planned identifier renames no record and
    breaks no archive (AGENTS.md rule 15).

  decision: revise
  decision_label: revise_batch_conclusions_on_blocking_objections_and_reprioritize_final_batch

  context: >-
    DEC-20260802-002 resumed GOAL-MLKEM-003 from a budget pause (6 -> 8 batches)
    on restored primary-source access and authorized BATCH-007 as an adjudication
    batch: retrieve the sources the program's four standing Carrier findings rest
    on, and ask three checkable questions of them. TASK-20260802-101 executed the
    adjudication and returned `confirmed_in_current_source` on all three
    questions. TASK-20260802-102 snapshot-committed the package
    (38cc4402087bae7578472d03dffda61764d1d3bf) before any reviewer read it.
    Independent review then substantially corrected the picture: the validator
    (TASK-20260802-103, VAL-20260802-b1cb71) returned ADMISSIBLE_WITH_DEFECTS
    with Q1 `not_reproduced` on the verdict label, and the red team
    (TASK-20260802-104, RT-20260802-3a440d) returned `blocking_objections` with
    11 objections, two of them blocking. Before relying on either blocking
    objection I reproduced both myself; the arithmetic and the retrieval are
    recorded in EV-MLKEM-017 under `coordinator_independent_verification`.

  what_the_batch_actually_established:
    - >-
      DURABLE POSITIVE. Table C.2, block CN, row Kyber-512 reads 143.30 in the
      authors' most recent self-deposited full text (HAL hal-05406481 v1,
      sha256 083b1422...757b8005), verified by three independent sessions and now
      from FRESH bytes fetched 2026-08-02, not only from the vendored snapshot;
      and no correction exists in any retrievable source, including a HAL deposit
      made roughly six months after the last ePrint revision (2025-06-11).
    - >-
      DURABLE LIMIT. Whether the ePrint-hosted revision-3 bytes read the same is
      INDETERMINATE. No byte of that side was observed by the executor, the
      validator, or the red team; three independent HTTP 403 Cloudflare blocks
      are on record. The identification rested on a metadata chain that never
      touches Appendix C.
    - >-
      ZERO NEW INFORMATION, RECORDED AS SUCH. Q2's `confirmed_in_current_source`
      is head == pin: kevin-carrier/CodedDualAttack HEAD is
      9c1367f85d26038244bc83c025d84c0b7006f2ee, the exact commit
      EXP-MLKEM-013 pins. The question is closed by object identity, not by
      corroboration, and EV-MLKEM-013's identity check — which licenses the
      k_fft=3 alignment every aligned statistic depends on — was not re-run by
      anyone in this batch and remains a single un-replicated run.
    - >-
      A CORRECTION TO THIS PROGRAM, NOT TO CARRIER (i). Q3's broad
      negative-existence form is false. Ducas-Pulles' published auxiliary data
      contains a measured Pwrong AT the measured Pgood=1/2 threshold on a common
      score scale. Q3's narrowed form — Carrier's polar-coded score at Carrier's
      Fig 4.1 parameters — stands.
    - >-
      A CORRECTION TO THIS PROGRAM, NOT TO CARRIER (ii). The coverage statistic
      the program has headlined is confounded with run length: all three archived
      Pwrong files terminate exactly at -log2(nb_iteration * q^k_fft).

  verified_blocking_objections:
    - objection_id: 2
      title: counting-resolution confound
      severity: blocking
      coordinator_status: reproduced_by_me
      what_i_computed: >-
        -log2(4000 * 241^3) = -35.70450 against the recorded -35.7045
        (delta 0.0000); nb_iteration=1 -> -23.7387 against -23.74;
        nb_iteration=6000 -> -36.2894 against -36.29.
      consequence: >-
        `fraction_inside = 0` and the roughly 421-unit aligned T-gap recorded in
        EV-MLKEM-011 and EV-MLKEM-013 are confounded with the sample budget. This
        is the inventor-protocol section 3 artifact tell in its exact form: the
        parameter meant to destroy the gap is nb_iteration, the support endpoint
        is a closed form in that parameter, and it was never varied. It does not
        make the arithmetic wrong — the validator recomputed every figure exactly
        — it makes those figures uninterpretable as properties of the score
        distribution.
      independent_corroboration: >-
        The validator reached the same conclusion from the other direction
        (defect D5): the last positive value equals exactly one observed count,
        1/(4000 * 241^3) = 1.7860305406935986e-11, and all 1804 entries are
        integer multiples of that quantum.
    - objection_id: 1
      title: Q3's broad negative-existence answer is falsified
      severity: blocking
      coordinator_status: reproduced_by_me
      what_i_fetched: >-
        https://raw.githubusercontent.com/ludopulles/DoesDualSieveWork/main/data/bdd_scores_n90.csv
        (23345 B, sha256 8f16c416...) and .../unif_scores_n90.csv (80027 B,
        sha256 9e5685a3...).
      what_i_found: >-
        Both carry N=377126, a common score scale. First bdd score with
        cdf_real >= 0.5 is 3521.487; first unif score >= it is 3655.211 with
        measured log2_sf_real = -46.415 against a predicted -55.53 — a 9.12-bit
        floor excess in the direction that increases Pwrong, support extending
        1.11x past threshold. A measured Pwrong at the aligned Pgood=1/2
        threshold exists in the literature.
      retrieval_fact: >-
        The executor recorded this source unretrievable after two attempts
        against one host; the red team reached it in three hops (OpenAlex -> CWI
        landing -> PDF) and the data repository in one more. The program's own
        KN-LIT-111 records under "Not verified here" that only the abstract was
        read. Infrastructure and process, never mathematics (AGENTS.md rule 5).
      steelman_carried: >-
        Ducas-Pulles measure the MATZOV / Dual-Sieve-FFT score of their section
        2.3, not Carrier's polar-coded score under Approximation 4.9, and at
        n=40..90 — toy scale against Kyber's beta approximately 384-816. So this
        does NOT establish that Carrier's Pwrong has been measured at Carrier's
        threshold. The real defect is that Q3 never said which of two different
        questions it was asking, and they have different answers.
    - objection_id: 6
      title: "'HAL unretrieved' was a client artifact"
      severity: material
      coordinator_status: reproduced_by_me
      what_i_confirmed: >-
        The HAL PDF is retrievable with plain curl (HTTP 200, 1252838 B,
        sha256 083b1422..., cmp-clean against
        experiments/EXP-MLKEM-010/vendor-lock/Carrier-2022-1750-hal-05406481.pdf).
        Favourable consequence: 143.30 is now confirmed from fresh bytes, not
        only from the vendored snapshot. Unfavourable consequence: the executor's
        gloss that /CreationDate 2026-07-21 is HAL download-time stamping is
        falsified and is withdrawn.

  rationale:
    - id: R-1
      text: >-
        The red team returned `blocking_objections`, so no disposition in the
        support family is available. Its `clears_to_pass_with_constraints_if`
        list carries four conditions; EV-MLKEM-017 implements all four. `revise`
        is the disposition that matches: the batch's artifacts are admissible and
        its arithmetic is sound, and what changes is the interpretation recorded
        on top of them.
    - id: R-2
      text: >-
        Two of three verdicts did not survive review, and I verified the two
        blocking objections myself rather than accepting them. A coordinator who
        ratified `confirmed_in_current_source` on three questions here would be
        recording as evidence a label the producing session's own scope text
        already contradicted.
    - id: R-3
      text: >-
        The counting-resolution confound is the more consequential of the two
        because it bears on the program's own standing records rather than on a
        batch verdict. It is nonetheless recorded WITHOUT changing the status of
        EV-MLKEM-011 or EV-MLKEM-013: AGENTS.md rule 12 makes a contradiction
        between validated evidence records a `review-breakthrough` matter at
        `max`, and a coordinator who reproduced the arithmetic himself is exactly
        the person that rule exists to check.
    - id: R-4
      text: >-
        Q1's two sub-findings survive at full strength and are carried forward
        rather than lost with the label, per the validator's explicit request.
        The useful part of Q1 was never the label.
    - id: R-5
      text: >-
        Red-team objection 11 named the failure mode to watch for: any
        `direction: supports` against a hypothesis about Carrier's cost model or
        ML-KEM security. EV-MLKEM-017 is `direction: neutral`,
        `claim_tier: toy`, `type: literature`. The objection is not realized.
    - id: R-6
      text: >-
        Objection 4 is accepted against DEC-20260802-002's own rationale: that
        decision justified the batch with "if the Table C.2 transcription error
        is already corrected by the authors, KN-FIND-016 is a finding about a
        superseded document", which is true only of KN-FIND-016 item 3. Items 1
        and 2 rest on the authors' pickle and on Theorem 4.1 and could not have
        been falsified by Q1. Cheap falsification before expensive measurement
        was the right ordering; the target chosen for it was narrower than the
        decision claimed. Recorded here rather than by editing DEC-20260802-002,
        which is immutable.

  explicit_non_claims:
    - >-
      ML-KEM is not broken. Nothing in BATCH-007 is a cryptanalytic result, and
      no ML-KEM break is claimed, implied, or supported.
    - >-
      No security level changes. FIPS 203 / ML-KEM parameter sets are neither
      affected nor cleared by this batch. No cost model was built or revised;
      COST-MLKEM-001's conditional envelope is untouched.
    - >-
      "The erratum survives" does NOT imply "the security claim is wrong". The
      survival of a typographic cell in an appendix table whose other columns
      already force the corrected value is compatible with the surrounding
      analysis being entirely correct, and equally compatible with its being
      wrong. Q1, Q2 and Q3 severally and jointly constrain neither. The
      `erratum` / `table-erratum` vocabulary is where that slide would enter and
      it is refused here.
    - >-
      No claim is made that the current ePrint-hosted revision of 2022/1750 reads
      143.30. Those bytes have never been observed by this program.
    - >-
      No claim is made that the literature contains no measured Pwrong at an
      operating threshold. That claim was made by the batch and is false.
    - >-
      The Ducas-Pulles measurement is not transferred to Carrier's polar-coded
      score, and n=40..90 is not transferred to Kyber scale (AGENTS.md rule 7).
    - >-
      KN-OPEN-016 remains open. Nothing here resolves whether the dual attack
      beats the primal attack.
    - >-
      No three-model closure quorum is asserted or sought. GOAL-MLKEM-003 stays
      `active` and is not completed.

