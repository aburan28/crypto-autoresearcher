coordinator_decision:
  id: DEC-20260804-d7cc39
  goal_id: GOAL-MLKEM-004
  batch_id: BATCH-6f309b
  batch_number: 2
  recorded_by_task: TASK-20260804-6ad417
  authorized_by: DEC-20260803-d810d0
  recorded_at: '2026-08-04'

  decision: infrastructure_blocked
  target_ids: [GOAL-MLKEM-004]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.
  decision_label: >-
    BATCH-6f309b is blocked by an infrastructure failure: g6k 0.1.2 cannot be
    built on Apple Silicon (ARM64) because its sieve kernels use x86-specific
    SIMD intrinsics. No sieve runs were produced. Per AGENTS.md rule 5, this is
    not evidence against any mathematical hypothesis. The durable output of this
    batch is: CTRL-RT-4c confirmed (MATZOV callable verified functional), the
    independence baseline N·Var[s_i] = 5,958.15 computed from batch-1 data, and
    variance_test.py ready for Linux x86_64.

  context: >-
    GOAL-MLKEM-004 BATCH-6f309b (batch 2 of 6). TASK-20260804-27e27b (executor)
    attempted to rebuild g6k on Apple Silicon. passagemath 10.8.7 and fpylll 0.6.4
    installed and verified functional. g6k 0.1.2 build failed at its SIMD
    intrinsic headers (immintrin.h, crc32intrin.h), which are x86-only. The
    variance test requires g6k to produce sieve vectors; without it, T_N cannot be
    computed. CTRL-RT-4 checks 1a and 1b also require the sieve; CTRL-RT-4c
    (matzov callable) does not and was executed.
    Snapshot at commit 3494c0e4ca3104cd42fa88baf4e2b0cd50c5937b.

  what_was_learned:
    - >-
      CTRL-RT-4c (MATZOV callable) PASSED: `estimator.lwe_dual.MATZOV`
      can be imported and called. `MATZOV.Nf` returned 3.524 for a toy
      instance (n=25, q=127, eta=2, sigma=2, m=35, beta=40). This is the
      callable that GOAL-MLKEM-003 argued about for four batches and never
      verified. It is now verified reachable and functional.
    - >-
      Independence baseline computed from batch-1 data: single-score variance
      Var[s_i] = 0.3325 (ddof=1, from batch-1 raw_scores.json phases_t[0] for
      MAIN_lwe_sigma2, N=17919). Independence-predicted N·Var[s_i] = 5,958.15.
      This is the denominator of the variance ratio. It does not require sieve
      runs and is durable.
    - >-
      variance_test.py is written and ready to execute on Linux x86_64 with
      g6k 0.1.2. It implements exactly the 50-run protocol from the handoff.

  infrastructure_failure:
    component: g6k 0.1.2
    reason: >-
      SIMD intrinsics (immintrin.h, crc32intrin.h) are x86-only; ARM64 compiler
      (Apple Clang on macOS 14+) rejects them. g6k has no ARM64 build path in
      version 0.1.2.
    scope: sieve execution only — passagemath and fpylll are unaffected
    evidence_status: >-
      infrastructure_error per AGENTS.md rule 5. Not evidence against any
      mathematical hypothesis. The mathematical question (Var[T_N] vs
      N·Var[s_i]) remains open.
    prior_runs_on_linux: >-
      BATCH-d2a728 (batch 1) ran on Linux-6.18.5-x86_64 inside Docker; the
      same g6k 0.1.2 produced 17,919 sieve vectors. The recipe is validated
      on that platform.

  hypothesis_status_changes: []

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Infrastructure failure; no mathematical claim made. CTRL-RT-4c confirmation
      (matzov callable reachable) is worth noting but is a tool-access verification,
      not a research finding. Rule 12 UNMET and UNWAIVED.

  next_actions:
    - >-
      BATCH-6f309b repair: re-run TASK-20260804-27e27b on Linux x86_64 (Docker
      linux/amd64 or equivalent). The variance_test.py script is ready; rebuild
      g6k via KN-TECH-14efa5 recipe on the appropriate platform. This is an
      infrastructure repair, not a new experiment design.
    - >-
      Before the variance test runs, run CTRL-RT-4 1a and 1b (zero-error and
      uniform-error checks) on Linux — these are also completion gates.
    - >-
      CTRL-RT-4c is already DONE and need not be re-run. Record this in the
      repair handoff.

  decided_by: coordinator
  decided_at: '2026-08-04'

  inference_provenance:
    requested_policy: coordinator-archive
    resolved_model_id: amazon-bedrock/us.anthropic.claude-sonnet-4-6
    fallback_used: true
    model_verified: false
