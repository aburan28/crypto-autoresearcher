      T_0 = 0 comparator (KS), the LOWER/UPPER bracket accounting, the
      first-10% binding slice, the capped/uncapped memory arms with S_peak,
      the phi decay, and a certified curve arm.
    - >-
      The decidable negative is T_0(U)/T_BL(1) not below 1 with 95% CI at
      U = 4*T_BL (k = 4, epsilon = 0.9). The U ladder was corrected to be in
      units of T_BL so this point is directly measurable in the pilot.
    - >-
      Standing user authorization of 2026-09-06 supplies the user-approval
      gate. This decision supplies the Coordinator authorization gate for
      the Stage 1 (pilot) contract only. Authorization is not a run.
    - >-
      The hypothesis H-ECDLP-32fad8 remains specified; this decision does
      not change its status. The experiment moves from review_required to
      approved. Execution is authorized for Stage 1 only.

