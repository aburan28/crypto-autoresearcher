  findings:
    - id: F-1
      text: >-
        ROUND VERDICTS. Red team (TASK-20260820-affeff, resolved model
        zai/glm-5.2, xhigh, independent session): holds-with-named-gaps —
        J1-J6 all hold, proves-too-much objects A/B/C all pass the declared
