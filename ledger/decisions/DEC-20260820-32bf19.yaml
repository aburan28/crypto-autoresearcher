        zai/glm-5.2, xhigh, independent session): dispatchable-with-named-
        gaps — the pre-dispatch gate is mechanically decidable and passes
        for the committed payload (pre-registered digest 2ea0083b...
        MATCH), all known-false certificate objects rejected with named
        checks, pin distinctness confirmed, firewall carry-over with no
        regression. The two determinations agree and are recorded as the
        round result.
    - id: F-2
      text: >-
        NAMED GAPS AND DISPOSITIONS (five from the red team, one defect from
        the validator; none blocks the supersession, all are carried):
        (1) cross-version stability of the pinned serialization is
        declared-not-checked and the original verification PyYAML version is
        unrecorded — carried; the digest comparison is the check, and batch
        3's pre-dispatch gate re-verification under the calibration
        interpreter is where it is measured, not waived;
        (2) no committed test exercises md5_collision_pair — ADOPTED AS A
        BATCH 3 PRECONDITION: a committed test in tests/test_harness.py
        (known-false object through the production path plus pin-mechanism
        distinctness with real and aliased registries) must land before the
        blind calibration dispatch, so a future aliasing edit is caught by
        the suite, not only at run time;
        (3) TOL = 2 and the named baseline are declarations, not
        measurements — carried as BCP-2 honestly states; the calibration
        batch measures costs and either grounds or replaces the constant,
        with the change recorded as a BCP-3 amendment, never a silent edit;
        (4) confound_caveat is a required evidence-record field (INV-10) at
        protocol level but not code-enforced — carried; the calibration
        batch's evidence-record writer must check it, and a code-level check
        is a candidate batch-3 amendment;
        (5) the legacy write_run() path still accepts caller-supplied timing
        for new runs — carried as policy for new calibration runs (they must
        use run_wrapped per BCP-2 INV-11), the legacy path remains for
        non-calibration runs, and no existing record is touched.
    - id: F-3
      text: >-
        DEFECT-1 DISPOSITION (validator, minor): BCP-2 documents IMPL-3's
        runtime_type as _md5.MD5Type; the runner's pin-mechanism probe
        records _md5.md5 (the type's __name__; MD5Type is an attribute
        alias for the same object). The distinctness check compares the two
        implementations' observed strings to each other and is unaffected.
        Disposition: the RUNNER'S PROBE OUTPUT IS AUTHORITATIVE for any
        future pin-mechanism record; the documented string is corrected in
        the next BCP supersession (BCP-3) or in the batch-3 dispatch
        record. No re-review of this batch is warranted by a documentation
        string.
    - id: F-4
      text: >-
        REVIEWER PROCEDURE DISPOSITION. TASK-20260820-affeff attests
        blind_from_respected: false — it read BCP-2's self_report section
        via a full-file read. The breach is the second occurrence of the
        same pattern (first: TASK-20260810-b9d956, dispositioned in
        DEC-20260810-1163ec F-5) and receives the same standard: the round
        is ACCEPTED because the round's load-bearing verdicts rest on the
        reviewer's own re-runs and the re-derivation was stated from the
        blind_scoring_rule section alone (the reviewer attests zero
        substantive impact; the self_report carries no CONSUMPTION-
        predicate content); the re-derivation joint is downgraded from blind
        to informed in the standing record, and no targeted rerun is
        ordered. The standing lesson is unchanged: a full-file read of a
        protocol that contains a self_report section is a blind_from
        breach; reviewers must read section-by-section. TASK-20260820-
        047039 attested blind_from_respected: true.
    - id: F-5
      text: >-
        SUPERSESSION EFFECT. BCP-1 (BATCH-46254b, frozen at
        d5fc2117d/f5087686e in origin/main) is FROZEN AND SUPERSEDED as of
        this decision: BCP-2 at snapshot commit 8677f11af is the protocol
        of record for the blind calibration run. BCP-1 remains immutable;
        the delta table (23 rows: 8 tightened, 15 held, 0 loosened) is the
        standing record of what changed. BCP-2 itself supersedes only by
        reference and only for the calibration run it governs.
    - id: F-6
      text: >-
        CALIBRATION GATE. THE BLIND CALIBRATION SEARCH remains OPEN AND
        UNATTEMPTED (it is not in BATCH-312472 and was not tried). It may
        open in batch 3 or later ONLY under BCP-2, and only when ALL of:
        (a) the committed pin-mechanism test of F-2(2) has landed and
        passed; (b) the pre-dispatch gate has been re-verified at dispatch
        time under the calibration interpreter (digest comparison, recorded
        with interpreter and PyYAML versions); (c) a batch-3 opening
        decision names the run's budget, seed policy, null-object control,
        and the charging convention (run_wrapped wall_seconds). Until then
        the goal's completion criterion (a blind calibration result, either
        outcome admissible) is unmet and the dependent goals (GOAL-SHA2-001,
        GOAL-SHA3-001, GOAL-BLAKE-001, GOAL-ASCON-001, GOAL-SIMSPK-001)
        remain blocked from asserting anything about their shared
        instrument.
    - id: F-7
      text: >-
        BUDGET OUTCOME (SC-4). Batch 2 declared 2880 s total. Measured:
        TASK-20260820-e4405b ~55 s (2/2 runs used, 62/88 MB peaks);
        TASK-20260820-3d26df's session reported no timer instrumentation
        (wall clock null, 0/1 runs — the authoring session had no command
        execution, so nothing to instrument); the two reviewer sessions and
        the coordinator archive sessions are likewise session-level
        uninstrumented. No instrumented task exceeded its declared ceiling.
        The nulls are recorded as such, not filled in.
    - id: F-8
      text: >-
        THE PARAMETRIC CHANNEL is unchanged: the named obstruction (model
        parametric prior knowledge — a published MD5 collision path is in
        the training data of any model this harness can resolve, and no
        file-system mechanism reaches it) is carried forward verbatim in
        substance in BCP-2's declared-not-checked list, which grew from 5
        to 6 channels. The confound_caveat requirement (INV-10) is the
        standing control for any REDISCOVERY-eligible success. The RQ's
        flagged apparent error remains UNSETTLED with reason, exactly as
        DEC-20260810-1163ec F-7 recorded it.

