coordinator_decision:
  id: DEC-20261005-2a1dbb
  context: >-
    Fourth design tick on 2026-10-05. This branch was created from
    origin/main at 92a3d5047cbbc343439c84fdb23db6ad3d79ae8a.
    EXP-GFPN-8da8d4 tests lemma (L) on y^2 = x^3 + x, which has the
    rational point (0, 0). IDEA-20261004-31991f separates that case
    from a curve with no rational 2-torsion. That case had no contract.
  decision: approve
  target_ids:
    - IDEA-20261004-31991f
    - H-GFPN-8aaf70
    - EXP-GFPN-3ce2d1
  rationale:
    - >-
      GFPN is an ECC area. The root-free model y^2 = x^3 + x + 1
      at primes 7, 19, and 59 is the case the previous contract
      excluded.
    - >-
      A design-session enumeration, not a run, found no F_p-root,
      rational-sum counts 26, 418, and 3900, and no nonzero side-1
      subsum. Both addition laws must recompute them.
    - >-
      Standing user authorization of 2026-09-06 covers approval.
      The protocol fields required before dispatch are filled.
    - >-
      H-GFPN-d48ae1 and H-GFPN-d3c9a1 are not edited.
  evidence_refs: []
  limitations:
    - n = 1 and pairs only. No Gaudry exponent is claimed.
    - Approval authorizes six deterministic runs. It does not assert the counts.
  next_actions:
    - >-
      Snapshot-archive this contract. Do not launch
      TASK-20261005-65cc13 until the receipt verifies.
  knowledge_promotion:
    promoted: []
    not_warranted: Approval of an unrun contract. No finding is promoted.
  decided_by: coordinator
  decided_at: '2026-10-05'
