    - "coordination/design/TASK-20261006-9b6db4/tasks/TASK-20261006-fa5bac/blind-statement.yaml"
    - "coordination/design/TASK-20261006-9b6db4/tasks/TASK-20261006-fa5bac/scheme-obligation-delta.yaml"
  limitations:
    - >-
      This is protocol preparation, not evidence that the repaired predicate
      exists, is honestly generable, is injective, or enables decoding.
    - >-
      Even a positive admission/decoder theorem does not construct f, compute
