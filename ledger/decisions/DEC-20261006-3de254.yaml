  context: >-
    DEC-20261006-3025de leaves GOAL-SSI-2fa82a active with zero finalists and
    selects OBL-SSI-ADMISSION-DECODE-1. The corrected review localizes two
    statement-level defects: P was not required to have exact order N, and
    U,V were not required to form an admissible ordered D-torsion basis with
    the image-order properties used by the decoder. Exact-map construction or
    uniform two-point evaluation remains a separate unresolved obligation.
  decision: "approve"
  decision_label: "approve_bounded_zero_run_admission_decoder_repair"
  target_ids:
    - "GOAL-SSI-2fa82a"
    - "RQ-SSI-1946c9"
    - "BATCH-9681e3"
    - "TASK-20261006-04e1d5"
  standing_user_authorization:
    source: "AGENTS.md standing authorization and the continuing GOAL-SSI-2fa82a objective"
    scope: >-
      One bounded zero-run idea-generator design and independent review of
      OBL-SSI-ADMISSION-DECODE-1. This decision authorizes preparation, not an
      automatic claim, task launch, scientific run, or successor batch.
  rationale:
    - >-
      Repairing the public statement is cheaper and decision-changing: an
      evaluator search cannot yield a correct PKE interface while exact-order,
      basis, nondegeneracy, image-order, and model conditions remain implicit.
    - >-
      The batch separates honest KeyGen compatibility, public decidability,
      message injectivity, and actual-message decoding from the still-open
      calibrated-map/two-point evaluator problem.
    - >-
      P=0, V=0, nonbasis pairs, weakened order checks, and relaxed model tags
      are frozen known-false or nearby-object controls before the producer runs.
    - >-
      One producer, one snapshot, two fresh disjoint reviewers, one composer,
      and one final archive give the smallest auditable zero-run lifecycle.
  evidence_refs:
    - "ledger/decisions/DEC-20261006-3025de.yaml"
    - "coordination/design/TASK-20261006-d4ec12/composition/TASK-20261006-97107d/composition.yaml"
