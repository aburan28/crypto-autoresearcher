coordinator_decision:
  id: DEC-20260906-030aad
  recorded_at: '2026-09-06'
  goal_id: GOAL-ECDLP-001
  context: >-
    Composes the round-1 mutually-blind review DEC-20260904-92dec2's own
    next_actions required before the C2 calibration run could be dispatched
    ("If the round returns without blocking dissent: dispatch the C2
    calibration run... If the round returns with dissent, the Coordinator's
    next act is to compose the two joints and either accept the dissent's
    consequence or file a rebuttal with new evidence" -- read in full from
    the cited decision). Two independent, mutually-blind reviewers were
    dispatched against the actual committed review_plan
    (ledger/handoffs/TASK-20260904-410404.yaml joint J1, validator;
    TASK-20260904-a897dc joint J2, red-team), after an earlier ad hoc
    dispatch this session was found non-conforming and archived separately
    as informational (coordination/goals/GOAL-ECDLP-001/reviews/
    TASK-run-experiment-56ee42-stage-review-{validator,redteam}/report.yaml).
    Both reports are now complete: J1 (experiments/EXP-ECDLP-56ee42/reviews/
    round-1/validator/report.yaml, verdict BROKEN) and J2 (.../round-1/
    red-team/report.yaml, verdict BROKEN, narrowly scoped to C2).
  decision: revise
  target_ids:
    - H-ECDLP-a4be60
    - EXP-ECDLP-56ee42
    - DEC-20260904-92dec2
    - TASK-20260904-410404
    - TASK-20260904-a897dc
    - experiments/EXP-ECDLP-56ee42/amendments/v2_control_c_recalibration.yaml
  rationale:
    - >-
      THE ROUND RETURNED WITH DISSENT, NOT WITHOUT. DEC-20260904-92dec2's
      own next_actions conditioned C2 calibration dispatch on the round
      returning "without blocking dissent." Both joints returned BROKEN.
      Per the decision's own stated contingency, the C2 calibration run
      MUST NOT be dispatched as amendment v2 currently specifies it. This
      decision accepts both dissents' consequences rather than filing a
      rebuttal, since both are independently, exactly reproduced findings
      (not disputed readings) that this session verified are correctly
      derived from committed, public data.
    - >-
      J1 (BROKEN): the T3 ("Rudin-Shapiro of x") digit statistic used
      throughout Stages 0-2 and slated for Stage 3 does NOT implement the
      digit statistic specification.yaml itself defines (the standard
      block-count Rudin-Shapiro sequence, OEIS A020985). estimator.py's
      rudin_shapiro_sign/_array instead computes a different recursion that
      is mathematically equivalent to a global sign-flip of T1
      (Thue-Morse), confirmed via (i) an independent, OEIS-verified blind
      re-derivation disagreeing with the archived value by ~299% while the
      SAME independent method matched T1 and the comparator to 1e-16
      relative error, and (ii) direct execution of the archived function
      confirming 0 mismatches against -thue_morse_sign(x) over x in
      [0, 200000). Because q_maj, q_strict, A(v), and A_noDC(v) are all
      exactly invariant under a global sign flip, T3's every reported
      measurement is mathematically forced to equal T1's (up to a
      negligible O(1/n) point-at-infinity perturbation). T3 therefore
      carries no independent information beyond T1, contrary to
      EXP-ECDLP-56ee42's own premise of three independent digit families
      and its own success_criterion (CLOSURE requires "all of T1-T3 to
      close, not the family"). This is disclosed in estimator.py's own
      docstring as a divergence from the literal spec text, but the
      docstring's own characterization ("uses a nonstandard variant of the
      standard Rudin-Shapiro sequence") materially understates the defect:
      it is not a variant family member, it is a near-total redundant echo
      of an arm already measured. estimator.py already contains a correct,
      unused implementation of the literal definition (`_rudin_shapiro_u`).
      Separately and independently, J1 CONFIRMS AND STRENGTHENS
      DEC-20260904-92dec2's own F-static finding: the T3 static-provenance
      scanner flag is confirmed, token-by-token, to be a genuine false
      positive (the flagged "k" tokens are a local bit-length loop counter
      bounded by an x-coordinate value, never a discrete-log input) --
      this part of the original DEC stands and is not disturbed by the
      separate T3-definitional finding above.
    - >-
      J1 also found (d) seed arithmetic INCOMPLETE, not broken: the
      NULL-2 seed formula (SplitMix64-family, BASE+1000+10*arm_index+shuffle_index)
      is well-defined and, under the only available reading of arm order,
      collision-free -- but no manifest.yaml or equivalent artifact records
      an actual applied integer seed anywhere under
      experiments/EXP-ECDLP-56ee42/, despite specification.yaml's own
      required_artifacts explicitly requiring "a manifest per stage"
      carrying "all seeds." Whether the formula was actually applied to
      produce the archived Stage 0-2 results cannot be confirmed from the
      archive as it stands.
    - >-
      J2 (BROKEN, narrowly scoped to C2 only): amendment v2's own
      characterization of the comparator ("top bit of x") as "nearly, not
      exactly, balanced" is false by 4 to 7 orders of magnitude, computed
      exactly from public curve parameters alone (no stage-cache needed,
      which J2 also found was never committed to this repository at any
      point in its history -- a disclosed gap). The minority fiber holds
      only 8 to 50 of the curve's points at every one of the six frozen
      rungs (a fraction between 2.4e-4 and 1.6e-7), and the imbalance
      WORSENS as p grows across the ladder. A synthetic control matched to
      this exact measured sparsity shows a genuinely working matched-marginal
      shuffle and the "fix-one" reading of a known-broken max-preserving
      shuffle produce statistically indistinguishable comparator-collapse
      ratios, both comfortably above C2's 0.5 threshold in every rung
      tested -- meaning C2 as currently instantiated is not shown to have
      the statistical power to certify a working NULL-2, and is at real
      risk of rejecting one outright. This directly and exactly triggers
      amendment v2's own pre-declared contingency: "if the comparator is
      marginal-dominated, the positive control must be a PLANTED
      point-structure statistic instead." J2 explicitly confirms C1 (the T4
      survival band), the mechanism-transfer argument, the no-op
      proves-too-much result, and the P2 classification all SUSTAIN --
      only the specific comparator choice is broken.
    - >-
      BOTH JOINTS AGREE ON A SEPARATE, MINOR CITATION DEFECT: DEC-20260904-92dec2's
      quoted popcount o2 survival-ratio range ("0.97-0.99") is inaccurate;
      the true range from the same cited table is [0.9207, 0.9916]. Neither
      review found this changes the qualitative conclusion (0.9207 remains
      far above both the C1 band and the removal threshold); it is
      corrected via CORR-20260906-d06837, filed alongside this decision,
      without disturbing DEC-20260904-92dec2's own F-control reasoning.
    - >-
      NEITHER FINDING IS NEGATIVE MATHEMATICAL EVIDENCE ABOUT H-ECDLP-a4be60.
      Per AGENTS.md rules 3 and 5, both defects are instrumentation/control-design
      gaps in the review's own measuring apparatus (an under-specified
      comparator; a digit statistic that measures the wrong sequence; a
      missing provenance artifact) -- not a finding about the underlying
      object (whether digit-family bias exists in the discrete-log
      coordinate). No Stage 3 run has occurred, and this decision does not
      change H-ECDLP-a4be60's status: it holds Stage 3 and the C2
      calibration run pending repairs, exactly as DEC-20260904-92dec2's own
      contingency required for a dissenting round.
  evidence_refs:
    - experiments/EXP-ECDLP-56ee42/reviews/round-1/validator/report.yaml
    - experiments/EXP-ECDLP-56ee42/reviews/round-1/red-team/report.yaml
    - ledger/decisions/DEC-20260904-92dec2.yaml
    - CORR-20260906-d06837
  limitations:
    - >-
      This decision does not itself repair the comparator, the T3 arm
      implementation, or the missing seed manifest; per this program's
      established amendment-clearance pattern (DEC-20260814-1445a1 /
      DEC-20260906-b60887), repair is design work for a follow-up task, not
      this ledger-archive act.
    - >-
      This decision does not assert the archived Stage 0-2 T1, T2, POS-A,
      POS-B, NULL-1, or CONTROL-C(T4) measurements are wrong -- J1 and J2
      both explicitly SUSTAIN everything except T3's definition and C2's
      comparator choice.
    - >-
      Does not resolve whether Stage 0-2's NULL-2 shuffles actually used
      the specified seed formula; that remains an open provenance gap
      pending either a located seed manifest or an explicit disclosure that
      none exists and the stages must be re-run with proper instrumentation
      before being treated as fully provenance-complete.
    - >-
      This decision does not compare or rank the two non-conforming,
      informational preliminary reviews archived earlier this session
      against this official round; both official joints independently
      reproduced the earlier informational reviews' core findings (the
      comparator-imbalance/C2 problem was found by both the non-conforming
      red-team and this official J2; the T3 mismatch is new to this round).
  next_actions:
    - >-
      Open a protocol-amendment task (not a dispatch task) for
      EXP-ECDLP-56ee42 that produces a versioned amendment (v3, superseding
      v2, per docs/task-lifecycle.md's protocol_amendment mechanism -- never
      an edit of the frozen specification or v2 in place) addressing, at
      minimum: (a) replace or supplement C2's comparator with a planted,
      non-sparse point-structure statistic (each level set a sizeable
      fraction of the group, per amendment v2's own pre-declared
      contingency and J2's required_controls), with a synthetic power
      check performed BEFORE any calibration run is dispatched against it;
      (b) fix the T3 arm to implement specification.yaml's own literal
      Rudin-Shapiro definition (estimator.py's existing, unused
      `_rudin_shapiro_u` helper is a candidate starting point) or explicitly
      redefine T3's role and re-derive success_criterion's three-arm
      requirement accordingly; (c) disambiguate the "max-preserving
      permutation" proves_too_much object for any future re-run, per J2's
      required_controls; (d) address the missing seed-manifest
      required_artifact -- either by locating/reconstructing genuine
      applied-seed records for the already-archived Stage 0-2 runs, or by
      disclosing that none exist and specifying that any re-run must
      produce one.
    - >-
      Neither Stage 3 nor the C2 calibration run may be dispatched against
      EXP-ECDLP-56ee42 until a Coordinator decision records that the
      resulting amendment resolves both BROKEN findings, mirroring
      DEC-20260906-b60887's precedent for the sibling QALG-001 amendments.
    - >-
      Archive this decision alongside CORR-20260906-d06837 and the two
      official round-1 review reports (already written to
      experiments/EXP-ECDLP-56ee42/reviews/round-1/{validator,red-team}/,
      not yet committed as of this decision).
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is a protocol/instrumentation-defect finding about the review's
      own measuring apparatus (comparator design, digit-statistic
      implementation, provenance completeness), not a research result about
      digit-family bias in the discrete-log coordinate. No hypothesis moves
      from its current status, no run occurred under this decision, and no
      durable scientific claim exists to promote.
  decided_by: coordinator
  decided_at: '2026-09-06'
  inference:
    requested_policy: coordinator-orchestration-code
