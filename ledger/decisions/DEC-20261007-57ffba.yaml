coordinator_decision:
  id: DEC-20261007-57ffba
  context: >-
    Design of IDEA-20261006-0c760e under RQ-SSI-001 / GOAL-SSI-001.
    Standing authorization of 2026-09-06 would approve a complete
    runnable protocol. This contract is specified and can fail, and
    the walker that would emit o_3 and o_5 is not in the tree.
  decision: revise
  target_ids:
    - H-SSI-03b806
    - EXP-SSI-235f4c
    - IDEA-20261006-0c760e
  rationale:
    - >-
      The prediction is the idea's own: success is |o_3 - o_5| >= 1
      with both integers in 1..17 and the walk defined. The negative
      outcome is o_3 = o_5, including the pair (17, 17). Those
      criteria differ, and decision_impact.on_positive differs from
      on_negative.
    - >-
      Approval is not recorded. The missing driver is a program that
      enumerates E0(F_59) for E0: y^2 = x^3 + x, walks at most 16
      Vélu quotients by the unique rational subgroup of order ell
      for ell in {3, 5}, and writes point_count_E0,
      rational_subgroup_count_3, rational_subgroup_count_5, o_3, o_5,
      and ordinary_control_a. harness/isogeny_class.py defines
      velu_odd and velu_image for one odd-degree isogeny and is not
      that walker.
    - >-
      python3 tools/newest_experiments.py execution_progress on this
      contract reports execution_state needs_implementation_or_plan
      because there is no trial-plan.json. tools/experiment_execution.py
      load_plan refuses a plan unless status is approved and every
      trial names an allocated RUN id. This replication plan names no
      run slot, so no RUN id was minted. Status stays review_required.
      approved_by stays null.
    - >-
      check_approval_capacity was not the rejecting check. With
      goal_id GOAL-SSI-001, python3 tools/portfolio_kpis.py --capacity
      GOAL-SSI-001 reports approved_unrun=2 (EXP-SSI-001,
      EXP-SSI-db46fa), cap 3, headroom 1. The area key area:SSI
      reports approved_unrun=39 and headroom 0. The contract names
      the goal, so the capacity key is GOAL-SSI-001. An approving
      decision was not written, because the driver is missing.
  limitations:
    - No run was launched. No executor was dispatched.
    - The inequality is untested. This decision is not evidence.
  next_actions:
    - >-
      Bind a walker that emits the named metrics, then re-check
      python3 tools/newest_experiments.py --experiment EXP-SSI-235f4c
      before any approval decision.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No run and no evidence record. A review_required contract does
      not promote a knowledge entry.
  decided_by: coordinator
  decided_at: '2026-10-07'
