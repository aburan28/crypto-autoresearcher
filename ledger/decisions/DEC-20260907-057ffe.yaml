coordinator_decision:
  id: DEC-20260907-057ffe
  recorded_at: '2026-09-07'
  context: >-
    EV-RELN-ed92ff recorded 4 of 5 Stage-0c recovery controls fully
    recovered for EXP-RELN-141a86, with INV-7 p_exist's minimality search
    (part (a), exhaustive below complexity 11) the sole gap: complete and
    clean through level 8, but blocked from level 9 by resource_exhaustion
    across four attempts. DEC-20260907-bc69ee authorized a fifth,
    extended (~12-14h) attempt via a detached, checkpointed background job
    (TASK-20260907-8e0165). That job died twice more to container
    restarts this session (RUN-RELN-141a86-stage0c-pexist-extended), both
    times before completing level 9, and both times at or before roughly
    the same ~30-minute mark it independently takes to re-derive levels
    1-8 from scratch -- suggesting the from-scratch-relaunch strategy may
    never reach level 9 on this infrastructure. This exhausted the
    handoff's authorized maximum_runs (2). The user was asked how to
    proceed among building true checkpoint-resume first, retrying as-is,
    amending the gate to accept the 4-of-5 state, or stopping for now; the
    user chose "Amend the gate to accept 4-of-5".
  decision: revise
  target_ids:
    - EXP-RELN-141a86
    - H-RELN-427bfd
  rationale:
    - >-
      Approves protocol_amendment v1
      (experiments/EXP-RELN-141a86/amendments/v1.yaml), version_from 1 to
      version_to 2: INV-7 p_exist is accepted as PARTIALLY recovered (known
      form confirmed at exactly canonical complexity 11 with zero
      residual; no lower-complexity match through level 8) rather than
      fully recovered (which would additionally require levels 9-10
      exhaustively cleared). A mandatory degraded-minimality flag must
      accompany every later artifact citing INV-7's recovery, stating
      plainly that complexities 9-10 remain unsearched due to disclosed
      infrastructure failure, not ruled out by computation.
    - >-
      This is a gate-relaxation for one sub-target under a disclosed,
      demonstrated infrastructure limit (three container restarts killing
      a checkpointed, SIGKILL-hardened background job, each before
      completing the one remaining level), not a scientific finding: it
      changes what counts as INV-7 p_exist's recovery-control PASS, not
      the frozen success_criterion's NULL/ALIVE classification of the
      hypothesis itself.
    - >-
      No existing run is edited or re-scored. RUN-RELN-141a86-stage0bcde,
      -stage0c-repair, -stage0c-minimality, and -stage0c-pexist-extended
      stand exactly as recorded. Levels 9-10 remain unsearched; a future
      run that completes them would simply upgrade p_exist to full
      recovery under the ORIGINAL standard via a new run and evidence
      record.
    - >-
      Under this amended standard, the Stage-0c gate is now passed (5 of
      5 controls, INV-7 at the partial-recovery standard for p_exist), so
      Stage 1 is authorized. TASK-20260907-8fd098 dispatches its
      execution: the exhaustive grammar engine across every statistic
      pack, with PySR's already-disclosed unavailability
      (environment.lock.json) reported as a tooling gap for that arm if
      it remains unavailable, never silently skipped.
  evidence_refs:
    - EV-RELN-ed92ff
    - experiments/EXP-RELN-141a86/runs/RUN-RELN-141a86-stage0c-minimality/recovery-controls.json
    - experiments/EXP-RELN-141a86/runs/RUN-RELN-141a86-stage0c-pexist-extended/manifest.yaml
  limitations:
    - >-
      This decision authorizes the gate amendment and Stage 1's execution.
      It does not itself classify H-RELN-427bfd's hypothesis as NULL,
      ALIVE, or inconclusive -- that classification is produced by Stage
      1/2 and still requires the contract's later_review_requirements
      (independent validator, red-team, review-adversarial at xhigh)
      before it backs any claim or promotes the hypothesis.
    - >-
      The partial-recovery standard adopted for INV-7 p_exist (existence
      at canonical complexity plus exhaustive non-existence through level
      8 only) is a genuine, disclosed weakening of the original gate for
      that one sub-target; it is not dressed up as equivalent to the
      original standard, and the amendment's degraded-minimality flag must
      travel with every artifact that cites it.
    - >-
      This decision does not approve, alter, or bear on EXP-RELN-f202be or
      EXP-RELN-82f487.
  next_actions:
    - >-
      Dispatch the executor per TASK-20260907-8fd098 to run Stage 1
      (stage1_grammar_fits and stage1_pysr_fits) under the now-passed
      Stage-0c gate, reporting PySR's availability honestly.
    - >-
      After Stage 1 returns, run the contract's later_review_requirements
      before any claim-changing use of INV-7's recovery or any Stage 1/2
      classification.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is a protocol-amendment approval, not an evidence-review
      decision; no new scientific classification has been produced yet.
  decided_by: coordinator
  decided_at: '2026-09-07'
