  context: >-
    /design-experiment, one contract, for IDEA-20261005-bda728. No
    hypothesis and no experiment on origin/main or on pull requests
    1899, 1898, 1897, or 1880 cites it. The branch
    design/frob-bda728-descent was created from origin/main at
    3575cc2705c200ffc0c0163c82548ab3335585ce and git merge origin/main
    reported already up to date.

    The quadratic is Q_E(T) = S_3(alpha, beta, T) on the first
    nonsingular ordinary short-Weierstrass curve E over F_11. The null
    is E0, the first nonsingular short-Weierstrass curve over F_{11^5}
    whose j-invariant is not in F_11. The same pair (alpha, beta) is
    used on both curves. The prediction is the dimension pair (1, 0).
    Any other pair is a negative, so success can fail. The span rank
    on E is pre-registered at 5. No exponent improvement is claimed.

    This session opened ledger/questions/RQ-FROB-7d8dd4.yaml,
    knowledge/techniques/KN-TECH-002.md, and the frontier rows
    KR-IC-5a43e5, KR-IC-b0fcda, KR-IC-5ea2f8, KR-RHO-755e35, and
    KR-RHO-13bf67. It read IDEA-20261005-bda728 from
    origin/design/qlwe-9f4777-logunit via git show and did not copy
    that file. The approval is of the protocol.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, the lexicographic seed, replication,
    budget, stopping rules, invalidation rules, success criterion,
    falsification criterion, and required artifacts are all non-null.
    No field required for approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The assignment of each observation is fixed before any run. A dimension pair other than (1, 0) is a negative.
    - Two linear-algebra methods, the null curve, and the transposition give the dimension a way to come back invalid rather than as a false (1, 0).
    - Success is only the first assignment row, so success can fail.
    - No field element was enumerated while writing this decision.

  evidence_refs: []
  limitations:
    - Toy scope only: one quadratic, q = 11, n = 5. No transfer to a factor base or a larger extension.
    - The group-algebra count of a free rank-1 module is the source of the integer 1. It is not the counter.
    - This decision authorizes a later run. It does not start one.

