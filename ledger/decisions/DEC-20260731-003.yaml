  rationale: EXP-MLKEM-011 shows Carrier's Fig 4.1 Pwrong experiments do not intersect
    the Pgood≈1/2 operating threshold (0/4000 Pgood scores inside the measured Pwrong
    T-range), with ~84 bits of further probability extrapolation from the toy floor
    to Kyber-512 CC Table C.2. This is the strongest scoped negative yet on the dual-claim's
    experimental backup, and it redirects KN-OPEN-016 from table arithmetic (settled
    by KN-FIND-016) to threshold- coverage / extrapolation. Next work must either
    (a) install G6K and extend Pwrong measurements toward the Pgood median T, or (b)
    derive a corrected ε under an explicit extrapolation model with red-team on the
    cost impact — without claiming an ML-KEM break from this coverage gap alone.
