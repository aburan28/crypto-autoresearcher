coordinator_decision:
  id: DEC-20260727-005
  id_allocation_note: >-
    This record was drafted as DEC-20260727-003 and reallocated to DEC-20260727-005 BEFORE
    any commit, after the executing session found that ledger/DEC-20260727-003.yaml is a
    tracked, published, entirely different record (the EXP-GPS-002 GPS-2 decisive test).
    No correction record is filed for this reallocation and none is owed: the draft was
    never committed, so it had no published identity to correct. The uncommitted file
    ledger/decisions/DEC-20260727-003.yaml is superseded by this file and must be discarded
    rather than staged. That the ruling convened to repair identifier collisions nearly
    committed one is recorded here rather than quietly fixed, and it is the direct evidence
    for the allocation rule in rationale item 10.
  context: >-
    Merge commit 304df00c, "merge: begin resolving conflicts with origin/main", authored by
    copilot-swe-agent[bot] on 2026-07-27 with parents P1 = 5cd208c1 and P2 = eca384c7,
    committed a partially resolved merge to origin/main. Eighteen files at the branch tip
    still carry literal <<<<<<< HEAD / ======= / >>>>>>> origin/main markers: knowledge/INDEX.md,
    knowledge/findings/KN-FIND-001.md and KN-FIND-002.md, five ledger/decisions records and
    ten ledger/handoffs records. All fifteen ledger records fail to parse as YAML in the
    committed state, so they are unreadable and every record citing them cites a broken
    record. DEC-20260727-002 recorded the defect and ruled that repairing it needs its own
    Coordinator decision on which record keeps each identifier, because a blind resolution
    would silently pick a side. This is that decision. Both merge parents were inspected
    verbatim; both hold clean, marker-free versions of every affected file; and at every
    one of the seventeen colliding identifiers the two versions are DIFFERENT genuine
    published records, never two drafts of one record. This is therefore not a content
    choice. It is a bulk identifier collision of exactly the class ESC-20260727-001 section
    D adjudicated for DEC-20260726-007 and DEC-20260727-001 executed, repeated seventeen
    times, on top of a corruption event.
  decision: supersede
  target_ids:
    - CORR-20260727-002
    - DEC-20260724-020
    - DEC-20260724-021
    - DEC-20260724-022
    - DEC-20260725-003
    - DEC-20260725-004
    - KN-FIND-007
    - KN-FIND-008
    - TASK-20260727-007
    - DEC-20260727-006
    - CORR-20260727-004
  rationale:
    - >-
      THE CENTRAL RULING. Choosing one version of a conflicted ledger path and discarding
      the other is not a repair; it is the deletion of a published ledger record. That is
      precisely the violation CORR-20260727-001 was filed against on 2026-07-27, committed
      by this same bot two days earlier, when it resolved the DEC-20260726-007 add/add
      conflict by deleting main's published record. Repeating it seventeen times would be
      the same failure at scale. Therefore at every colliding identifier BOTH records
      survive: one retains the identifier and the other is reissued verbatim at a free
      identifier with an added id line and a provenance block. No record's content is
      edited, revised, summarised, or dropped. Two records that were sharing a filename
      stop sharing it.
    - >-
      WHICH SIDE RETAINS. The trunk side. ESC-20260727-001 section D_id_collision ruled
      that the published trunk record keeps the identifier and the branch record renumbers,
      because that touches no published trunk history and costs less integrity than any
      alternative; DEC-20260727-001 and CORR-20260727-001 executed exactly that, and
      CORR-20260724-001 and CORR-20260724-004 applied the same remedy at two earlier merge
      boundaries. The two sides are identified from the artifact itself, not by topology
      inference: the losing hunk terminator that the bot committed into all eighteen files
      reads ">>>>>>> origin/main", so P2 = eca384c7 is the trunk side and P1 = 5cd208c1 is
      the branch side as a matter of what git wrote. P2 retains all seventeen; P1's
      seventeen are reissued per the id_remap table in CORR-20260727-002.
    - >-
      THE RULE WAS FIXED BEFORE THE ROWS WERE FILLED, AND TWELVE OF SEVENTEEN ROWS
      INDEPENDENTLY CORROBORATE IT. The decisive corroborations, all from marker-free
      records that were never in conflict: (a) DEC-20260724-009 - the P2 version literally
      carries remapped_from DEC-20260722-003, which is the assignment committed correction
      CORR-20260724-003 and tools/legacy_ledger_inventory.yaml both declare, and the
      adjacent uncontested DEC-20260724-010 and -011 carry remapped_from DEC-20260722-004
      and -005, completing the block. (b) The nine TASK-20260724 handoffs - every
      marker-free handoff in that range at HEAD (219 through 225, 227, 230, 231, 236, 238)
      is a GOAL-MLKEM-001 record, and restoring the nine conflicted slots to P2 closes the
      dispatch chain completely (226->227, 228->229, 233->234, 235->236, 237->239, with
      232, 234 and 239 self-archiving), whereas the P1 records name archived_by
      TASK-20260724-227/230/231/236/238/240, four of which are already occupied by
      uncontested ML-KEM records and one of which does not exist. (c) TASK-20260725-001,
      DEC-20260725-001 and DEC-20260725-002 - the P2 versions' named companions
      (TASK-20260725-002 and -003, EV-ECDLP-005, GOAL-SSI-001, EV-SSI-001,
      TASK-20260725-501 through -504) are all present marker-free, while the P1 versions
      cite TASK-20260725-005, -006, -012 and -013, none of which exists as a ledger
      handoff. (d) KN-FIND-001 - ten uncontested records cite it in the ML-KEM sense, four
      of them binding it into hypothesis or question evidence_basis fields, against four in
      the conservation sense.
    - >-
      WHERE THE EVIDENCE IS THIN, IT IS SAID SO. Three rows rest on the section D precedent
      rather than on independent corroboration, and each is marked determined_by_precedent
      in CORR-20260727-002 rather than dressed up. For DEC-20260724-007 the citation-cost
      metric measures 7 against 6 and does not discriminate, and both sides hold a
      hash-bound archive receipt naming that exact path; the row is decided by section D
      plus whole-set coherence, since the P2 record cites only the collision-free
      TASK-20260724-301/-303 block. DEC-20260724-008 is the same picture with one
      asymmetric corroboration on the P2 side. KN-FIND-002 is decided by section D against
      a real contiguity argument that runs the other way, and that argument is recorded in
      full in the correction so a reader can weigh it.
    - >-
      KN-FIND-002 SPECIFICALLY. The GGM closure finding retains KN-FIND-002; the
      "Rare-event density gates are settled exactly by fibering over solutions" finding is
      reissued at KN-FIND-008. The reason is consistency with this coordinator's own prior
      ruling and nothing else: the GGM finding is promoted by origin/main's published
      DEC-20260726-007, whose knowledge_promotion names KN-FIND-002; that decision is
      immutable, is present marker-free at HEAD, was itself restored under CORR-20260727-001
      after this same bot deleted it, and ESC-20260727-001 section D already ruled that it
      keeps its identifier. Moving KN-FIND-002 away from the record that decision promotes
      would leave an immutable published trunk decision pointing at nothing. The rare-event
      finding's promoting record is P1's DEC-20260724-008, which this decision reissues as
      DEC-20260724-021 anyway, so its reissue carries KN-FIND-008 natively at zero alias
      cost. The renumber is required to be recorded in CORR-20260727-002 and is, exactly as
      the DEC-20260726-007 renumber was recorded in CORR-20260727-001, because identifiers
      are immutable and a renumber is itself a deviation.
    - >-
      KN-FIND-002 CARRIES NO SUBSTANTIVE IMPLICATION EITHER WAY. Retaining the identifier
      does not ratify the GGM finding. ESC-20260727-001 section A ruled origin/main's
      EXP-GGM-001 archive process-invalid as an official transition and ruled that it must
      not be treated as having promoted that finding; section C requires a separate
      correction or superseding entry for it on its own merits. None of that is performed
      or prejudged here, and reissuing the rare-event finding says nothing against it
      either. This row moves a filename, not a claim.
    - >-
      knowledge/INDEX.md IS NOT RESOLVED BY CONTENT CHOICE AT ALL. It is regenerated.
      tools/build_knowledge_index.py is authoritative and says so in its own text: "The
      index is a derived artifact: entries under knowledge/{literature,techniques,findings,
      open-problems}/ are the source of truth", and the file it emits carries the header
      "do not hand-edit facts here. Regenerate via /curate-knowledge". It also ships a
      --check mode that exits non-zero when the index is stale. Neither the 28,894-byte P1
      rendering nor the 1,262,076-byte P2 rendering is authoritative; both are stale
      outputs of that generator over different corpora, and DEC-20260727-002 already
      recorded that the two committed tables declare 128 and 7638 entries, which cannot
      both describe this corpus. Choosing between them would be choosing between two wrong
      answers. The order of operations is binding: settle knowledge/findings/ first, then
      regenerate, then require --check to exit 0, then commit the regenerated index in the
      same archive as the findings - which is the /curate-knowledge convention
      ESC-20260727-001 section A5 found violated when KN-FIND-001 was promoted without it.
      No entry count is predicted here; whatever the tool emits over the marker-free corpus
      is the answer.
    - >-
      IMMUTABILITY. This repair is consistent with "records are immutable; corrections
      supersede, never overwrite", and the reasoning is recorded rather than assumed. The
      rule protects record content against editorial revision: once published, a coordinator
      may not change what a record says, and a later view must be carried by a new record.
      The eighteen files at HEAD are not records in that sense. A file containing
      <<<<<<< HEAD / ======= / >>>>>>> is a merge-tool intermediate that was committed by
      mistake; fifteen of them do not parse, so they assert nothing at all, and the content
      immutability would protect is not even well defined for them. Immutability cannot
      attach to a state a record never had. Restoring each path to the exact bytes of one of
      its two parents does not overwrite a record, it recovers one: the bytes come from a
      real prior commit in this repository's history, they are extracted mechanically rather
      than retyped or reconstructed, and the result is checkable by comparing the restored
      blob against the parent blob. Two boundaries make this a repair rather than a rewrite,
      and both are binding: no record loses content, because every losing version is
      reissued verbatim at a free identifier; and no status moves, because renumbering and
      byte restoration are not state transitions. The one place this reasoning does not
      reach is recorded as RES-1 rather than papered over.
    - >-
      THE RECURRENCE IS A PROCESS FINDING WITH A CONTROL. This is the second integrity
      event from copilot-swe-agent[bot] in two days; the first deleted published
      DEC-20260726-007 during the PR #42 merge and was repaired under CORR-20260727-001.
      Both share one mechanism: an automated agent resolving add/add conflicts over ledger
      records without a Coordinator ruling. Under AGENTS.md and this harness's contract, a
      merge resolution over ledger records IS an identifier adjudication and a potential
      state transition, and both are reserved to the Coordinator. The control is stated in
      limitations below. It is a process finding about tooling authority; it is not a
      judgement about any campaign's science and it is not evidence about ECDLP.
    - >-
      TENTH AND NEW - THE IDENTIFIER SPACE IS ONE, THE DIRECTORY LAYOUT IS TWO, AND THAT IS
      WHAT PRODUCED ALL OF THIS. ledger/ carries two parallel conventions for one identifier
      space. The root namespace ledger/*.yaml holds DEC, EV, H, RQ and one CORR record; the
      typed namespace holds ledger/decisions/, evidence/, hypotheses/, questions/,
      corrections/, handoffs/ and goals/. Neither is a subset of the other, and root holds
      no TASK, GOAL or KN records at all, so those three identifier spaces are single. An
      identifier such as DEC-20260727-003 denotes ONE record under AGENTS.md regardless of
      which path holds it; AGENTS.md constrains identifiers and says nothing about
      directories. The de facto allocation practice - glob one directory and take the next
      number - therefore reads a partial view of the space and is unsound. It produced three
      separate collisions in a single day: the pre-existing double occupancy of
      DEC-20260727-001, -002 and -003 and of CORR-20260724-002; a parallel task's choice of
      DEC-20260727-004 for the H-GGM-001 determination, which collides with the published
      root EXP-GPS-001 forensics record; and this decision's own draft identifier. BINDING
      FROM NOW ON: identifier allocation resolves the identifier across the whole
      repository, never a single directory listing. Check the union of every location that
      holds records of that type, at minimum ledger/*.yaml AND the typed subdirectory, and
      allocate strictly above the maximum of that union, never into a gap in either. Two
      apparent gaps in this repair's own analysis were in fact occupied root records
      (DEC-20260724-005, and the DEC-20260722-001/-002 originals underlying RES-1), which is
      independent confirmation that the union is the correct space.
    - >-
      ELEVENTH - WHAT THIS DECISION DELIBERATELY DOES NOT SETTLE ABOUT THE NAMESPACE. It
      does not declare the root namespace closed, and it renumbers nothing that is already
      published there. Root records dated today exist and are live work by a concurrent
      co-driver: ledger/DEC-20260727-001 is the EXP-SIG-007 n=21 D5 completion,
      ledger/DEC-20260727-002 the EXP-SIG-008 n=12 D6 gates, ledger/DEC-20260727-003 the
      EXP-GPS-002 GPS-2 test and ledger/DEC-20260727-004 the EXP-GPS-001 forensics, and
      they cross-reference each other as a coherent block. Calling that namespace "legacy"
      because tools/legacy_ledger_inventory.yaml froze 95 root records at a past merge
      boundary would be false to what is happening in it now. Nor does this decision rule
      which side of each doubly occupied pair renumbers: both sides are published and
      same-dated, so section D's published-versus-unpublished test ties, and a hasty
      resolution would do to a co-driver exactly what the bot did here. That question, and
      the convention question behind it, are assigned to DEC-20260727-006 and
      CORR-20260727-004, allocated and reserved here and not absorbed into this repair.
      No root record is moved, renamed or deleted by anything authorized here; moving one
      would break the frozen inventory hashes and every citation that resolves to its path.
  evidence_refs:
    - ledger/corrections/CORR-20260727-002.yaml
    - coordination/goals/GOAL-ECDLP-001/escalations/ESC-20260727-001/ruling.yaml
    - ledger/decisions/DEC-20260727-001.yaml
    - ledger/corrections/CORR-20260727-001.yaml
    - ledger/decisions/DEC-20260727-002.yaml
    - ledger/corrections/CORR-20260724-003.yaml
    - ledger/corrections/CORR-20260724-004.yaml
    - tools/legacy_ledger_inventory.yaml
    - tools/build_knowledge_index.py
    - coordination/goals/GOAL-ICLIFT-001/batches/BATCH-001/archives/TASK-20260724-236/ledger-receipt.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-003/archives/TASK-20260724-304/ledger_commit_receipt.json
    - ledger/DEC-20260727-003.yaml
    - ledger/DEC-20260727-004.yaml
  evidence_refs_disambiguation: >-
    ledger/decisions/DEC-20260727-001.yaml and ledger/decisions/DEC-20260727-002.yaml above
    are the TYPED-namespace records (the section D execution and the BATCH-009 budget
    extension). ledger/DEC-20260727-003.yaml and ledger/DEC-20260727-004.yaml are the ROOT
    namespace records (EXP-GPS-002 and EXP-GPS-001), cited as evidence of the live root
    namespace only. Full paths are given because the bare identifiers are ambiguous until
    DEC-20260727-006 resolves the double occupancy.
  evidence_note: >-
    Every item above is a committed repository artifact read verbatim by the authoring
    session, plus the two merge-parent blob sets extracted for it by the calling session.
    No experiment, run, or measurement is cited, because none bears on this decision. This
    decision reviews no evidence about mathematics.
  limitations:
    - >-
      NOTHING HERE IS EVIDENCE FOR OR AGAINST ECDLP. Not about ECDLP hardness, prime-field
      ECDLP, index calculus, factor-base geometry, function-field xedni lifting,
      Mordell-Weil relation coefficients, generic-group simulability, ML-KEM security,
      supersingular isogenies, semi-regularity, the GPS support-syzygy work, or any attack.
      This is corruption repair and identifier bookkeeping. KN-OPEN-001 is untouched.
    - >-
      NO STATUS CHANGES. No hypothesis, experiment, evidence, goal, question or knowledge
      status is changed by this decision or by the task it opens. H-GGM-001 still reads
      supported, EXP-GGM-001 still reads review_required with approved_by null,
      GOAL-ECDLP-001 still reads paused, and every H-XEDN-*, H-FBG-*, H-BKKMV-*, H-SIG-*,
      H-SSI-* and H-MLKEM-* status is untouched. ESC-20260727-001 sections A and C hold in
      full and still require their own superseding decision, which this is not.
    - >-
      DEC-20260724-007 AND -008 HAVE AN UNRESOLVED THIRD CLAIMANT, NOW DOWNGRADED.
      CORR-20260724-003, tools/legacy_ledger_inventory.yaml and CORR-20260724-004 all assign
      those identifiers to the canonical copies of root records DEC-20260722-001 and -002,
      and neither merge parent contains those copies. Where the copies now live is
      CANNOT_DETERMINE from the artifacts available here, logged as RES-1 with the exact git
      queries that settle it, and not guessed. It is materially less serious than first
      assessed: the ORIGINALS survive at ledger/DEC-20260722-001.yaml and
      ledger/DEC-20260722-002.yaml, verified present, so what was displaced is a derived
      parseable copy and not a published record. No deletion occurred.
    - >-
      FURTHER UNDETERMINED ITEMS ARE LOGGED, NOT FIXED. RES-2: the GGM finding sat at
      KN-FIND-001 at origin/main commit 3a59a207 and at KN-FIND-002 at eca384c7, and the
      commit and authorizing correction for that shift are not identified here; the ruling
      is stable under either answer. RES-4 remainder: TASK-20260725-005, -006 and -007 are
      absent and cannot be hiding in the root namespace, which holds no TASK records at all.
      RES-5: the dual-namespace ownership question, deferred to DEC-20260727-006.
    - >-
      RES-3: TASK-20260724-227/230/231/236/238/240 are cited as archival tasks by
      GOAL-ICLIFT-001 lineage records and have no ledger handoff file in that lineage,
      though their receipts exist under coordination/. They are not renumbered, because
      there is no record to reissue, and no handoff is back-filled and presented as
      contemporaneous. The ambiguity is carried by the alias declaration and assigned to a
      later ledger-hygiene task.
    - >-
      THE AUTHORING SESSION HAS NO SHELL AND NO CLOCK. It ran no git command, computed no
      SHA-256, made no commit, and staged nothing. It asserts no commit happened. Every
      byte restoration, every hash binding, commit identity and parentage must be computed
      and verified by the executing session, and until the post-commit verifier accepts
      those commits nothing here is durable.
    - >-
      CONTROL AGAINST RECURRENCE, RECORDED AS A REQUIREMENT AND NOT AS A COMPLETED ACTION:
      no automated agent may resolve an add/add conflict over any path under ledger/,
      knowledge/ or experiments/*/specification.yaml. Such a conflict is escalated to the
      Coordinator for an identifier adjudication and is repaired only by a decision plus a
      correction record. This decision cannot enforce that by itself; enforcing it is a
      separate configuration and process change and is named here so it is not forgotten.
    - >-
      THE ID ALLOCATIONS WERE CHECKED AGAINST BOTH NAMESPACES BUT NOT AGAINST GIT.
      DEC-20260724-020/021/022 and DEC-20260725-003/004 were confirmed free in both
      ledger/*.yaml and ledger/decisions/*.yaml (root holds nothing above DEC-20260724-005
      on that date and no DEC-20260725-* at all); TASK-20260724-243 through -251 and
      TASK-20260725-009 were confirmed free because the root namespace holds no TASK records
      whatsoever; KN-FIND-007 and -008 were confirmed free because no ledger namespace holds
      KN records; CORR-20260727-002 was confirmed free in both (root holds only
      CORR-20260724-002). All of that was read from the working tree, not from git. The
      executing session must reconfirm each identifier is free at HEAD across the union, and
      stop and escalate rather than shift the mapping if any is taken.
    - >-
      INTERIM LEDGER INCONSISTENCY, CHOSEN AND RECORDED. Between this decision's commit and
      TASK-20260727-007's commit, ledger/corrections/CORR-20260727-002.yaml names seventeen
      reissued records that do not yet exist, and the eighteen files remain corrupt. That is
      deliberate: the ruling is committed and verified before any byte is moved, so the
      mechanical application has an authorizing record to cite. It is named so a reader who
      finds the mismatch knows it was chosen, not missed.
  authorized_repair_task:
    id: TASK-20260727-007
    handoff_record_required: >-
      This card is the specification. The executing coordinator session must persist it as
      ledger/handoffs/TASK-20260727-007.yaml in the handoff schema before dispatch; the
      authoring session was constrained to write only this decision and CORR-20260727-002
      and did not create that file. TASK-20260727-001 remains reserved by ESC-20260727-001
      section E for the nine-run provenance audit and must not be reused.
    from: coordinator
    to: coordinator
    objective: >-
      Apply CORR-20260727-002's resolution table mechanically. Restore each of the eighteen
      conflicted paths, reissue the seventeen branch-side records at their mapped
      identifiers, regenerate knowledge/INDEX.md, and produce a post-commit receipt.
    constraints:
      - >-
        Before writing any reissued record, reconfirm every target identifier is free at
        HEAD across the UNION of ledger/*.yaml and the typed subdirectory, per the binding
        allocation rule in rationale item 10. Stop and escalate rather than shift the
        mapping if any is taken.
      - >-
        Restore every retained path by extracting the blob from merge parent eca384c7, for
        example git checkout eca384c7 -- <path>. Never hand-edit a conflicted file, never
        retype content, and never delete a conflict hunk by hand. Verify each restored blob
        equals the eca384c7 blob before staging.
      - >-
        Create each reissued record from the merge parent 5cd208c1 blob at the same path,
        for example git show 5cd208c1:<path>, changing ONLY the id line (or the frontmatter
        id line, for the two KN-FIND entries) and adding a provenance block recording
        original_id, remapped_from, remapping_note and authority DEC-20260727-005 /
        CORR-20260727-002. Every other field, including context, decision, target_ids,
        rationale, evidence_refs, limitations, next_actions, knowledge_promotion, decided_by,
        decided_at, created_at, archived_by, budget and completion_gate, is carried verbatim.
        Carry archived_by values verbatim even where RES-3 makes them ambiguous.
      - >-
        Do not perform a repository-wide search and replace. The colliding strings are
        lineage-ambiguous by construction and several citing files are hash-bound into
        verified commits. Update only the three operational goal anchors named in
        CORR-20260727-002 (GOAL-ICLIFT-001, GOAL-XEDN-001, GOAL-XEDN-002), each with an
        inline id_renumber_note. Every path in must_not_be_edited_covered_by_the_alias_instead
        stays byte-for-byte unchanged.
      - >-
        Touch no file in the root ledger namespace ledger/*.yaml. No root record is moved,
        renamed, edited or deleted by this task. RES-5 is assigned to DEC-20260727-006.
      - >-
        Regenerate knowledge/INDEX.md only after all six knowledge/findings/ entries are
        marker-free, by running python3 tools/build_knowledge_index.py, then
        python3 tools/build_knowledge_index.py --check and requiring exit 0. Do not
        hand-edit the index and do not carry either merge parent's rendering forward.
      - >-
        Change no hypothesis, experiment, evidence, goal, question or knowledge STATUS
        field. If applying the table appears to require a status change, stop and escalate.
      - >-
        Run alone in the shared worktree, stage only the declared paths, and reference
        DEC-20260727-005, CORR-20260727-002 and TASK-20260727-007 in the commit message.
      - >-
        Report RES-1 through RES-5 as still open. Repair none of them in this task and
        invent no answer to any of them.
    deliverables:
      - The eighteen conflicted paths, marker-free, each provably equal to its declared source blob or to the generator's output
      - The seventeen reissued records at the id_remap identifiers
      - The three updated operational goal anchors
      - A post-commit receipt recording commit sha, parent sha, declared paths, per-path SHA-256, and the record and task IDs
    completion_gate:
      - No file under ledger/, knowledge/ or coordination/ contains the strings "<<<<<<<", "=======" as a conflict marker, or ">>>>>>>"
      - All fifteen restored ledger records parse as YAML and tools/validate_ledger.py reports no new violations
      - Every restored blob is byte-identical to the eca384c7 blob at the same path, verified by hash
      - Every reissued record differs from its 5cd208c1 source only by the id line and the added provenance block
      - Every reissued identifier was reconfirmed free at HEAD across the union of both ledger namespaces
      - python3 tools/build_knowledge_index.py --check exits 0
      - No file under ledger/*.yaml (root namespace) is modified
      - No status field anywhere in ledger/ or experiments/ differs from its pre-task value
      - The post-commit verifier accepts the commit against its expected parent, declared paths, recorded hashes, and named record and task IDs
    inference:
      policy: coordinator-ultra-code
      fallback_allowed: true
      independent_session_required: false
      note: Record requested_policy, resolved model, and fallback_used; claim no equivalence if a fallback is used.
    budget:
      wall_clock_seconds: 3600
      memory_gb: 2
      maximum_runs: 1
  reserved_identifiers:
    - id: DEC-20260727-006
      reserved_for: >-
        The RES-5 namespace decision: whether the root ledger namespace is closed to new
        records, and which side of each doubly occupied pair (DEC-20260727-001, -002, -003
        and CORR-20260724-002) renumbers. Not authored here.
    - id: CORR-20260727-004
      reserved_for: The correction record carrying whatever DEC-20260727-006 rules.
    - id: DEC-20260727-007
      reserved_for: >-
        The TASK-20260727-005 H-GGM-001 determination, reallocated from DEC-20260727-004
        which collides with the published root EXP-GPS-001 forensics record. That task's
        other two identifiers, EV-GGM-002 and CORR-20260727-003, were verified free across
        both namespaces and are unchanged. Identifier allocation is the Coordinator's, so
        this reallocation is issued here rather than left to the parallel task.
    - id: TASK-20260727-007
      reserved_for: The mechanical repair task specified above.
  next_actions:
    - >-
      Commit and verify this decision together with ledger/corrections/CORR-20260727-002.yaml
      as an isolated ledger archive on parent ce09d2f5, discarding the superseded uncommitted
