  rationale:
    - >-
      THE PRE-DECLARED RULE DECIDES. VR-5, VR-1 and VR-2 were written before
      this act, and each holds on archived bytes. Approving is the rule's
      outcome, not a judgement call. Refusing a draft whose declared readings
      all hold would be premature closure of the only route to the measured
      side of criterion C1.
    - >-
      THE 14 ROWS ARE COVERED BY WORDS, NOT BY INTENT. Each census row is
      named in VC-2 by file and line, and each is inside the literal scope of
      the VC-1 disposition named for it: the aggregate's integrity hash and
      the three statuses it sets are K-6 / V-7; the wrapper's reads are the
      named gamma functions; the event-record hash check is epsilon.
    - >-
      CONDITIONS CLOSE WHAT THE READINGS COULD NOT SEE, WITHOUT CHANGING THE
      RULE. Reading the texts together found three places where an honest r3
      implementation would hit a DV-11 STOP for reasons unrelated to the
      science: the event record that must be hashed now carries V-5 (VA-6);
      the approved forbidden-id check swept site-carrying bytes, a reader the
      census did not reach (VA-7; CORR-20260924-27a4b6); and value and class
      overlaps the inventory must list once (VA-8). Each resolution follows
      the texts' own words, keeps every check, and moves no threshold.
    - >-
      STRICTNESS IS NOT LOOSENED. REG-1 compares recorded attempts with no
      tolerance, the exclusion list gains nothing, every attempt is preserved,
      DV-17 is unchanged, and a failure that reproduces keeps its frozen class.
    - >-
      THE BIAS IS TOWARD THE DECIDABLE QUESTION. Criterion C1's measured side
      and KN-OPEN-9b4a2b need the v2 ladder and the 31-bit rung; this approval
      is the step that lets them run under a reproducibility regime.
    - >-
      NO SECURITY READING. Toy EcGFp5-shaped arithmetic with known scalars;
      nothing transfers to p = 2^64 - 2^32 + 1.

