        adds no class, row or value, widens neither epsilon nor V-7 beyond
        VC-1's words, and removes no check: the hash, parse and consistency
        checks stay exactly as approved.
    - id: VA-7
      name: deterministic resolution, the forbidden-task-id requirement in r3 (OBS-1; CORR-20260924-27a4b6)
      text: >-
        The approved requirement that no file of any package carries a
        forbidden task id as a task id (paristack lines 617-618, with the
        R-13 list of HR-10) is met in r3 WITHOUT any r3 function that reads
        the bytes of a file, or a serialization of a record, that carries an
        S-1, S-2 or S-3 value:
        (a) R-13 on plan text, unchanged; the r3 wrapper also refuses any r3
            constant, redirected attribute or plan string equal to a forbidden
            id (static, DV-6 and DV-9 exercised);
        (b) the r3 checker tests every task-id-bearing key the r3 layer and
            the frozen drivers write (task_id, run card, written_by_task and
            archived_by fields of manifest.yaml, raw-result.json,
            pari-stack.json, solver-events.json and the plans), by constant
            key, for the forbidden ids; a key the site records do not carry
            reads no site data (census M-3); and it byte-sweeps only files that
            carry no site value (command.txt, stdout.log, stderr.log,
            environment.json, pari-stack.json), which DV-11's inventory lists;
        (c) the r3 event-record writer carries no substring guard over the
            serialized record; the record is composed only from site values
            and r3 constants, which (a) covers;
        (d) each snapshot archive of r3 packages (phase B of
            TASK-20260924-f1fb0e; TASK-20260924-9d6601) byte-sweeps every
            staged file for the six R-13 ids and the r2 FORBIDDEN_TASK_IDS and
            records the result in its receipt. That sweep is performed by the
            dispatching session outside every scanned tree. It is REPORT ONLY:
            a hit changes no package, no recorded field and no status, is
            returned to the Coordinator as a bookkeeping finding, and is never
            evidence.
        The requirement is kept in full; only the place where site-carrying
        bytes are swept moves out of r3 code. If the r3 Executor finds the
        requirement cannot be met this way within the approved words, the
        stage STOPS (VA-12 (b)); it does not improvise.
    - id: VA-8
      name: deterministic resolutions, class listing in the r3 inventory (OBS-3; OBS-4)
      text: >-
        (a) A value that is both alpha and epsilon (a final_* copy of the
            returned result in the event record) keeps alpha's coverage (VC-1
            (f)). A function whose only E1-E4 reads are such copies is listed
            alpha; the epsilon prohibition on choosing a recorded result still
            applies to it.
        (b) No gamma function contains a check or guard that its named clause
            does not prescribe. A refusal or integrity guard the r3 wrapper
            needs is a separate function, listed under its own class (epsilon
            integrity reader, V-7, or a function that reads no site value), so
            that each listed function carries exactly one class (VC-3).
        (c) A counter rewrite after each wrapped call (r2 SD-6) is declared as
            SE-2 (5) recording in the r3 note and listed gamma with that
            clause.
    - id: VA-9
      name: SEQUENCING, BINDING ON THE DISPATCHER (SC-7 and VC-5 VS-5 onward, re-pointed)
      text: >-
        Normative, and binding on the SESSION THAT DISPATCHES in addition to
        each card's own preconditions. Every archive runs ALONE.
        Solver-running tasks (the r3 stage, R2'', R2b'') never overlap each
        other or any other solver process. Each producer runs under a lane
        claimed on the BATCH-e409ca queue and is released on return.
      sequence:
        - id: RQ''-1
          step: >-
            This act is ledger-archived ALONE by TASK-20260924-c817ee, verified
            by the post-commit verifier, pushed, and PR #1412 (or its
            successor) refreshed.
        - id: RQ''-2
          step: >-
            The BATCH-e409ca revision of queue_revision_authorized below is
            appended as its own later commit, after research_dispatch.py and
            validate_dispatch_reference.py both pass on it (fallback variant
            otherwise). Pushed.
        - id: RQ''-3
          step: >-
