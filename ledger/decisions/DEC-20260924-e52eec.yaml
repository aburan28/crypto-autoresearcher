            Coordinator decision (reserved DEC-20260924-1ce186) records its 11
            packages not_attempted with the reason, cancels
            TASK-20260924-b3e690 and TASK-20260924-9d6601 by revision, and
            reshapes the review chain by appended revision under the reserved
            TASK-20260924-c62839, TASK-20260924-7f5f5f and
            TASK-20260924-22918e, never by editing an entry or card. A gate or
            REG-1 failure is never a result.
        - id: RQ''-8
          step: >-
            R2b'' under TASK-20260924-b3e690, reading the repaired v2 packages
