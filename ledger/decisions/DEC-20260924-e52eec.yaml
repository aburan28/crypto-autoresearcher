    - id: VA-10
      name: envelope, launch rule and authorization scope (SC-8 and SC-10 re-pointed; valueclose and launchcover authorization)
      text: >-
        DEC-20260923-e788a1 AC-1..AC-6 apply to every development check and
        every R2'' and R2b'' package exactly as to v2: child RLIMIT_AS
        10737418240 set in the child and read back with getrlimit (a child
        that cannot set it refuses to start); driver RSS at most 1 GiB; one
        memory-heavy process at a time; task envelope at most 11 GiB; msolve
        -t 1; the lowered cap if the dispatcher's guard threshold is below
        12.0 GB. Every SE-2 and HR-4 attempt runs under the same cap and
        timeout as attempt 1. No undeclared outer guard on any package.
        Exhausting an envelope, a watchdog or the SF-2 (c) / HR-6 cap is an
        infrastructure outcome and a checkpoint, never evidence about D.
        Run ceilings: r3 stage 0, R2'' 31, R2b'' 11; at most 48 packages in
        the lineage over the eight plans (2 existing + 42 planned = 44). NO
        attack, NO unknown-scalar solve, NO deployed-curve instance, NO
        wall-time extrapolation, NO use of any retired id (124), NO msolve,
        valgrind or callgrind_annotate flag or argv change, NO time()
        interposition, NO REG-1 or exclusion-list change, NO health-check
