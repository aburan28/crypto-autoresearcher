        - id: RQ''-6
          step: >-
            Phase B of TASK-20260924-f1fb0e, alone, after R2'' returns (any
            outcome) and releases its claim. Then a revision appends the staged
            run files to TASK-20260924-4351ac's artifact_paths and marks the
            archive completed (commit_sha, parent_sha, full path_sha256,
            content_first).
        - id: RQ''-7
          step: >-
            Branch on the repaired gate. IF G1..G4 each have run_status
            completed_valid with gate_pass true and REG-1 passed: a revision
