coordinator_decision:
  id: DEC-20260804-d0c452
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-051
  recorded_by_task: TASK-20260804-013
  archived_by: TASK-20260804-013
  context: >-
    BATCH-051 ran EXP-ICI-e622fd under PA-ICI-e622fd-v2-rc51. VAL-20260804-018
    returned COMPLETED_VALID_SCOPED; RT-20260804-019 returned PASS_SCOPED.
    Key result: Elkies ell-isogeny augmentation ratio ≈ null-map ratio ≈ 2-B_frac
    at 8/9 completed cells. Falsification criterion met at toy scale for this mechanism.

  decision: reject_scoped
  decision_vocabulary_note: >-
    reject_scoped means: the specific mechanism tested — Elkies ell-isogeny (ell ≤ 23)
    preimage augmentation of the Semaev factor base on prime-order ordinary curves at
    bits ∈ {20, 24, 28} — shows no structural advantage over a random bijection.
    This is NOT a closure of the broader isogeny-augmented index calculus direction.
    H-ICI-063e91 moves to `weakened` at this narrow scope.

  decision_scope: >-
    H-ICI-063e91 weakened for the Elkies ell ≤ 23 augmentation mechanism at toy
    scale on prime-order prime-field curves. The result does NOT close: (a) ell > 23
    isogenies; (b) isogeny CHAINS (multiple hops); (c) extension-field isogenies;
    (d) CM-endomorphism-related augmentation; (e) augmentation measured at crypto
    scale; (f) other index-calculus enhancement approaches. H-ICI-063e91 requires a
    scope correction (2-isogeny → ell-isogeny) before any further status transition.
    GOAL-ECDLP-001 remains active.

  target_ids:
    - GOAL-ECDLP-001
    - SG-ECDLP-002
    - H-ICI-063e91
    - EXP-ICI-e622fd
    - RUN-ICI-001
    - EV-ICI-0bdaaa
    - BATCH-051

  evidence_ids: [EV-ICI-0bdaaa]

  rationale:
    - >-
      |aug - null| < 0.004 at all 8 valid cells: Elkies ell-isogeny preimages are
      statistically indistinguishable from a random [k]-map bijection. The isogeny
      structure provides no structural factor-base advantage at these parameters.
    - >-
      Null control is valid: [k] empirically yields 2-B_frac as expected for a
      random bijection. Negation control = 1.0 as algebraically required.
    - >-
      Scope note: H-ICI-063e91's stated 2-isogeny mechanism is untestable on
      prime-order curves (Atkin condition). The tested ell-isogeny variant is the
      nearest feasible proxy. Scope correction required.
    - >-
      AGENTS.md rule 6: negative evidence closes only the exact tested scope.
      bits=28/B=0.3 resource exhaustion is not negative evidence.

  h_ici_063e91_transition:
    from: specified
    to: weakened
    scope: Elkies ell-isogeny (ell <= 23) preimage augmentation, prime-order curves, bits 20-28

  exact_next_action: >-
    Open BATCH-052: two tasks — (A) scope-correct H-ICI-063e91 (supersede or amend
    to replace "2-isogeny" with "Elkies ell-isogeny") and propose the next testable
    variant (isogeny chains, ell > 23, or different augmentation strategy); (B) fresh
    ideation for SG-ECDLP-002 targeting exponent-moving mechanisms that are not
    blocked by the Atkin condition or the class-group order-mismatch.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Scope corrections required before promotion. Negative finding at toy scale
      for a specific sub-mechanism only.

  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2
    sota_delta: {time_exponent: not_applicable, memory_exponent: not_applicable, data_or_query_exponent: not_applicable}
  claim_ceiling: toy
  official_research_state_changed: true
  state_changed_fields: ["H-ICI-063e91.status: specified -> weakened"]
  asymptotic_promotion_gates:
    proof_decomposition: open
    numbered_heuristics_validated: open
    concrete_cost_table: open
    independent_review_xhigh_and_red_team: open
  decided_by: coordinator
  decided_at: '2026-08-04'
