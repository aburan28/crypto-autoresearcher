      status: blocking_unoverruled
      finding: >-
        Target-seed aggregation, operating-row weighting, exact p-rank and
        row-reversal plants, and a numeric intended-versus-nuisance threshold,
        equality rule, and instrument-block consequence are absent.
    - blocker_index: 7
      report_objection_id: O-JINV-PB-6
      subject: end_to_end_cost_and_artifact_volume_are_not_bound
      status: blocking_unoverruled
      finding: >-
