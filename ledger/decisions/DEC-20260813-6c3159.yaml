  rationale:
    - >-
      The frozen approval rule permits approval only after an unqualified fresh
      independent PASS without a material blocker. RT-20260813-2ad661 returned
      REVISE, so approval is unavailable and the Coordinator does not overrule
      any of its seven blockers.
    - >-
      Exact content-first custody and the structural source audit passed: the
      snapshot binds the 22,700-byte proposal and self-neutral receipt, and the
      reviewed geometry remains 59 classes, 51 conductor-1 classes, 46 distinct
      absolute D0 values with five duplicates, 1,771 conductor-1 curves, 2,212
      total curves, the 37-vertex Aut 1+36 geometry, and r=0 only. These are
      static custody and structural facts, not JINV observations or science.
    - >-
      The proposal does not yet define one deterministic complete Phase-B
      procedure. Its whole-grid-null label conflicts with cross-target-seed
      coupling; source-record exposure and pairing are unlocalized; W lacks the
      400-target normalization; the Aut floor lacks an Aut predicate; the null
      reference bank is undefined; aggregation, pooling, nuisance plants, and
      specificity are incomplete; and end-to-end cost and artifact volume are
      not bound.
    - >-
      All defects are prospective and additively repairable. REVISE is therefore
      faithful and proportional; REJECT, approval, execution, scientific
      interpretation, and any status transition would exceed the evidence.
    - >-
      N18, scalar-orientation-preserving same-k C-TRANSPORT-CERT, the second
      matched N, and the historical two-harness-path scope discrepancy remain
      separate blockers. The repair action may not merge, waive, or discharge
      them.

