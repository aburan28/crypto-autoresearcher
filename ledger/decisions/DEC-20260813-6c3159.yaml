        Aut target-seed aggregation, strict-extreme detection, or cross-row and
        cross-statistic multiplicity.
    - blocker_index: 5
      report_objection_id: O-JINV-PB-4
      subject: null_false_positive_reference_bank_is_undefined
      status: blocking_unoverruled
      finding: >-
        The 20,000 null trials lack an exact inner/reference, leave-one-out,
        disjoint-bank, or cross-fit rule, so their own p-values and FPR gate are
        not uniquely executable.
    - blocker_index: 6
