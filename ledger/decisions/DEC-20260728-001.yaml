coordinator_decision:
  id: DEC-20260728-001
  id_allocation_note: >-
    Verified free across the UNION of both ledger namespaces per the binding allocation rule
    in DEC-20260727-005 rationale item 10. The root namespace ledger/*.yaml holds DEC records
    up to DEC-20260727-004 and holds no DEC-20260728-* record of any number; the typed
    namespace ledger/decisions/ holds DEC-20260727-007 as its maximum and holds no
    DEC-20260728-*. A repository-wide search for the string DEC-20260728 returns no match.
    Allocation is strictly above the maximum of the union on a new date, never into a gap in
    either namespace. The executing session must reconfirm this at HEAD before staging and
    must STOP and escalate rather than shift the allocation if any identifier is taken.

  context: >-
    GOAL-ECDLP-001 stands paused with 8 batch_checkpoints against campaign_budget.maximum_batches
    8, so the extended budget authorized by DEC-20260727-002 is exactly exhausted. BATCH-009
    closed with two DOES_NOT_SURVIVE verdicts and no research movement: TASK-20260727-002
    demolished origin/main's EXP-GGM-001 archive (a control gate comparing two string literals
    in one source file, returning 4/4 on every possible execution, appearing in no run
    artifact, over nine byte-identical run directories that are one computation serialized nine
    times), and TASK-20260727-003 demolished BAR-PATHDYN-CONDTAIL-D2 while recording in terms
    that "a broken barrier is not a positive result for RT-1476-SUBRES-A1 - the gate is merely
    still open ... THIS TASK DOES NOT CLOSE THE GATE, AND IT DOES NOT OPEN IT." Two consecutive
    batches produced no measurement of anything. Meanwhile RT-1476-SUBRES-A1 has been the
    program's only live sub-rho gate for 29+ ideation runs, it carries a complete frozen
    experiment contract that has already absorbed one adversarial amendment, and ITS EXPONENT
    HAS NEVER BEEN MEASURED. This decision extends the campaign batch budget by one, opens
    BATCH-010, and dispatches that measurement.
  decision: expand
  identifier_renumber_note: >-
    IDENTIFIER REPAIR APPLIED UNDER CORR-20260728-001, AFTER THIS DECISION WAS PUBLISHED AT
    e1847fc8. H-RT1476-001 and EXP-RT1476-001 were malformed - tools/validate_ledger.py requires
    a letters-only area code and RT1476 has digits - so this decision's target_ids dangled. Only
    target_ids is edited, to H-SUBRES-001 and EXP-SUBRES-001. The reserved_identifiers block
    below and all prose are LEFT VERBATIM: they record what was actually reserved and decided on
    2026-07-28 under the retired ids, and the reservation of EV-RT1476-001 was in fact spent at
    that identifier before the malformation was found. Nothing substantive changes: the batch
    extension 8 -> 9, the terminal condition and every ceiling stand exactly as decided.
  target_ids:
    - GOAL-ECDLP-001
    - BATCH-010
    - H-SUBRES-001
    - EXP-SUBRES-001
    - TASK-20260728-001
    - TASK-20260728-002
    - TASK-20260728-003
    - TASK-20260728-004

  rationale:
    - >-
      THE BUDGET RULING, STATED EXPLICITLY AND BEFORE ANY WORK IS DISPATCHED.
      campaign_budget.maximum_batches is extended from 8 to 9. BATCH-010 EXCEEDS the maximum
      of 8 that DEC-20260727-002 set, and it is named as an extension here rather than run
      silently over the limit. This is the SECOND declared extension of this campaign's batch
      budget: DEC-20260727-002 took it from 6 to 8 (and recorded that 6 had already been
      exceeded by one before that decision existed), and this decision takes it from 8 to 9.
      Nine admits exactly one further batch, BATCH-010. NO ELEVENTH BATCH IS AUTHORIZED BY
      THIS DECISION.
    - >-
      WHY THE EXTENSION IS WARRANTED, AND THE HONEST CASE AGAINST IT. Against: a campaign that
      keeps extending its own budget is a campaign that is not converging, and two extensions
      in two days is a signal that should be uncomfortable. For: the previous extension bought
      paper review and the campaign is now review-rich and measurement-poor - no experiment has
      executed on this goal since BATCH-005, and the two batches since produced only demolition
      verdicts on other people's artifacts. The cheapest work that can actually MOVE something
      is a bounded measurement of the one gate that has stayed open for 29+ runs without ever
      being measured. Both outcomes are informative: an adverse measurement gives that gate its
      first real negative on a tested scope, and a favourable one gives the program its first
      toy-scale reason to look further. Refusing the extension would leave the gate open on a
      prior instead of on a measurement, which is strictly worse than either outcome.
    - >-
      A TERMINAL CONDITION IS ATTACHED SO THIS DOES NOT BECOME AN OPEN-ENDED SERIES. If
      BATCH-010 returns a VALID run set with beta_deg >= 0.3, RT-1476-SUBRES-A1 is closed on
      the tested scope and the goal moves to paused or closed_at_budget with that recorded as
      its terminal finding - NOT to BATCH-011 by default. A further batch after BATCH-010
      requires its own Coordinator decision naming what new uncertainty it reduces. Declaring
      the exit condition before the data exists is what keeps this an extension rather than a
      drift.
    - >-
      THE WALL-CLOCK BUDGET IS NOT EXTENDED AND REMAINS UNAUDITABLE.
      campaign_budget.total_wall_clock_seconds stays 28800 and is NOT increased. It also still
      cannot be reconciled: DEC-20260727-002 rationale item 3 recorded that BATCH-005 has no
      coordination directory, no batch record, no queue and no elapsed-time entry, so the
      campaign tally is unreconstructible. BATCH-010 is therefore bounded INDEPENDENTLY at
      12300 seconds across its four cards (7200 + 600 + 3600 + 900), and the campaign figure is
      treated as unverifiable rather than as satisfied. That is the same treatment BATCH-009
      received and it is a defect carried forward, not repaired.
    - >-
      WHY THIS EXPERIMENT AND NOT ANOTHER. Four grounds. (i) RT-1476-SUBRES-A1 is the only
      live sub-rho gate in the program. (ii) It already carries a COMPLETE FROZEN CONTRACT
      written by someone other than this session - Contract A1 at
      inputs/idea_generation_20260718_batch2.md lines 1286-1319 - so the design is not being
      invented to fit an outcome. (iii) That contract has already been adversarially amended:
      the red-team note at lines 1388-1397 forced the fit onto the SUCCESSFUL-membership subset
      only, which is the objection that would otherwise have sunk the result afterwards. (iv)
      It is executable in this environment at toy scale within a bounded budget, and the
      largest object it must enumerate has fewer than 22000 elements.
    - >-
      THE PRIOR IS ADVERSE AND IS RECORDED IN THE SPECIFICATION BEFORE EXECUTION. The red team
      predicts beta_ops -> 3/2 from above; the generic count predicts beta_deg = 0.6, which is
      twice the 0.3 gate. This experiment is expected to fail. It is being run because the
      expectation has never been tested, and because a gate held open on a prior is worse than
      a gate closed on a measurement. Recording the prior now is what prevents an adverse
      result from being reinterpreted later as a surprise, an artifact of the port, or a reason
      to relax the criterion.
    - >-
      NOTHING IN THIS BATCH IS AN ATTACK OR AN ATTACK IMPROVEMENT. No discrete logarithm is
      solved, no scalar is recovered, no relation feeds a linear-algebra stage, no descent runs,
      and no comparison against Pollard rho or BSGS is produced. Two exponents are measured on
      toy curves of at most 24 bits. This decision is not evidence for or against ECDLP
      hardness, prime-field ECDLP, index calculus at any relevant scale, or KN-OPEN-001.
    - >-
      THE GOAL RECORD IS NOT EDITED BY THIS DECISION. GOAL-ECDLP-001 stays paused, its
      maximum_batches still reads 8, its current_batch_id still reads BATCH-009, and its single
      next_action still points at TASK-20260727-008. Extending a budget is authorized by a
      decision; applying it to the operational anchor is a goal checkpoint, which
      templates/research-records.md restricts to a Coordinator ledger archive. TASK-20260728-004
      performs it, reconciling against the goal record's then-current committed content rather
      than against a copy read today, so a concurrent co-driver's next_action is not clobbered
      from stale state. That is the BATCH-009 mechanism and it is reused deliberately.
    - >-
      THREE PRIOR OBLIGATIONS ARE PRESERVED, NOT CLOSED AND NOT DEPRIORITISED ON THEIR MERITS.
      TASK-20260727-008 (the CORR-20260727-003 knowledge action plus the Report 94 demotion of
      BAR-PATHDYN-CONDTAIL-D2) is the goal record's CURRENT single next_action and is UNDISCHARGED.
      TASK-20260727-009 (EXP-GGM-001 version 2 plus the superseding H-GGM-001 record) and
      TASK-20260727-010 (the conforming review-breakthrough-at-max re-review that leaves
      AGENTS.md rule 12 undischarged until it runs) are likewise open. None of them is closed,
      countermanded or judged by this decision. They are not admitted into BATCH-010 because
      this batch is deliberately a single-lane measurement and adding curation lanes to a batch
      opened to fix a measurement deficit would reproduce the deficit. They are carried in the
      batch record's known_open_obligations and TASK-20260728-004 must preserve or restore
      whichever single next_action the goal record's state at close supports, recording the
      divergence verbatim if it replaces one.
    - >-
      TASK-20260727-001 REMAINS RESERVED by ESC-20260727-001 section E for the nine-run
      provenance audit and is NOT reused. All BATCH-010 identifiers are allocated on the new
      date 2026-07-28 precisely so that none of the reserved-but-unwritten TASK-20260727-007
      through -010 slots is disturbed.
    - >-
      A KNOWN DEFECT IN THE DISPATCH TOPOLOGY IS NAMED RATHER THAN HIDDEN. max_concurrent is
      set to 2 as directed, but BATCH-010's four cards form a strictly serial dependency chain
      (execute -> snapshot -> validate -> ledger), so at most ONE card is ever eligible and the
      concurrency setting is inert. Idle parallel capacity is not a reason to admit another
      lane (agents/coordinator.md, Focus discipline), and none is admitted.

  reserved_identifiers:
    - id: DEC-20260728-003
      reserved_for: >-
        The BATCH-010 close decision, authored in phase 1 of TASK-20260728-004 and installed by its
        phase 2. Confirmed free at batch opening across the UNION of ledger/*.yaml and
        ledger/decisions/: neither namespace holds any DEC-20260728-* record other than
        DEC-20260728-001 and -002, both created by this batch opening.
      allocation_basis: >-
        RESERVED RATHER THAN DEFERRED, AND THE EARLIER JUDGEMENT IS RECORDED AS REVERSED. The first
        draft of TASK-20260728-004 deliberately left this identifier to be allocated at close time,
        reasoning that the close might fall on a later date and that DEC-20260727-005 rationale item
        10 requires allocating strictly above the union maximum AT ALLOCATION TIME. Two concrete
        facts overrode that before any commit: tools/research_dispatch.py requires every
        artifact_path to be an exact repository-relative file path and rejects a placeholder, and a
        deferred identifier would have left the ledger archive committing a path it had not
        declared, failing the "changes exactly the declared paths" check. Reservation is the
        established remedy here - DEC-20260727-005 reserved DEC-20260727-006 and -007 in advance and
        DEC-20260727-007 was in fact issued at its reserved identifier - and a reservation binds even
        if the close falls on a later date, because identifiers are immutable and a reserved one is
        not re-dated. TASK-20260728-004 must still RECONFIRM it free at HEAD across the union and
        STOP and escalate rather than shift.
    - id: EV-RT1476-001
      reserved_for: 'The BATCH-010 evidence record, if and only if the run set validates. Confirmed free across the union; no EV-RT* record exists anywhere in the repository.'
      conditional: >-
        NOT created if TASK-20260728-003 returns INVALID. An invalid run set is not evidence and
        gets no evidence record; the identifier then stays unused, which is permitted. Reserving an
        identifier is not a commitment to spend it, and an unspent reservation is never re-used for
        anything else.

  evidence_refs: []
  evidence_note: >-
    Deliberately empty. This decision reviews no evidence and rests on none. It is a budget
    and coordination action. The BATCH-009 verdicts (REV-20260727-002, RT-20260727-001) and
    DEC-20260727-007 are context for WHY this batch is opened; none of them is adjudicated
    here, and none of them is evidence for or against H-RT1476-001. In particular,
    RT-20260727-001's demolition of BAR-PATHDYN-CONDTAIL-D2 is NOT support for H-RT1476-001:
    a broken barrier leaves a gate open, it does not open it, and the red team said so in
    those words.

  limitations:
    - >-
      NOTHING IN THIS DECISION IS EVIDENCE FOR OR AGAINST ECDLP HARDNESS. Not about
      prime-field ECDLP, index calculus, Semaev decomposition, factor-base geometry, any
      attack stage, any curve, or KN-OPEN-001. Opening a batch and extending a batch budget is
      coordination, not a finding.
    - >-
      NO HYPOTHESIS, EXPERIMENT, EVIDENCE, GOAL, QUESTION OR KNOWLEDGE STATUS IS CHANGED BY
      THIS DECISION. H-GGM-001 still reads specified, EXP-GGM-001 still reads review_required
      with approved_by null, GOAL-ECDLP-001 still reads paused, and every other hypothesis
      status is untouched. H-RT1476-001 is CREATED at status specified; creating a record at an
      initial status is not a transition of an existing one.
    - >-
      EXECUTION OF EXP-GGM-001 VERSION 1 IS NOT AUTHORIZED BY THIS DECISION OR BY ANY TASK IT
      OPENS, in this campaign or any successor. DEC-20260727-007 forbids it at sha256
      09931848d2dbe55aa998857db9653d763a5b327a2016dd56e8eab942a8a03c56 and RT-20260726-001
      OBJ-02 remains a standing blocking objection.
    - >-
      INTERIM LEDGER INCONSISTENCY, CHOSEN AND RECORDED. For the duration of BATCH-010 the goal
      record understates the authorized batch budget (8 recorded versus 9 authorized), points at
      BATCH-009 rather than BATCH-010, and carries a next_action that this batch does not
      execute. This is deliberate, follows the BATCH-009 precedent, and is remedied by
      TASK-20260728-004. It is named so a reader who finds the mismatch knows it was chosen, not
      missed.
    - >-
      GOAL-ECDLP-001 CANNOT BE MOVED TO completed BY THIS BATCH UNDER ANY OUTCOME. AGENTS.md
      rule 13 requires three CONCUR attestations with pairwise-distinct resolved_model_id; none
      has been obtained and none may be recorded that was not. Even a maximally favourable
      measurement is toy-tier and meets neither completion criterion.
    - >-
      MAXIMUM CLAIM TIER FOR EVERYTHING IN THIS BATCH IS toy, mechanically, from a maximum
      field size of 24 bits. Maximum evidence strength from a single execution is preliminary.
      No hypothesis may move to supported from this batch, and reject_scoped on a single
      unreplicated empirical-only run set is forbidden - an adverse result takes weakened plus
      replication.
    - >-
      NO INDEPENDENT PRE-EXECUTION DESIGN REVIEW OF EXP-RT1476-001 EXISTS. That is a real
      weakness, is recorded in the specification's review_history, and its compensating control
      is TASK-20260728-003. It is a deliberate trade against spending a third consecutive batch
      on paper, and it is a judgement that a later reviewer is entitled to disagree with.
    - >-
      THE BATCH-004 LEDGER ARCHIVE CARD TASK-20260726-004 REMAINS BLOCKED at 7 of 8 post-commit
      checks on message_contains_task_id, in published history that must not be rewritten. No
      waiver is granted here.
    - >-
      THE BATCH-009 SNAPSHOT RECEIPT DEFECT (D3) IS NOT REPAIRED HERE. No
      snapshot_commit_receipt.json exists for TASK-20260727-004, and no
      ledger/handoffs/TASK-20260727-007.yaml or committed receipt for the DEC-20260727-005
      conflict repair was located. Both are carried forward as open defects, and BATCH-010's
      archive cards are written to not repeat them.
    - >-
      THIS AUTHORING SESSION HAS NO SHELL AND NO CLOCK. It ran no git command, computed no
      SHA-256, made no commit, and staged nothing. It asserts that no commit happened. Every
      hash binding, commit identity and parentage must be computed and verified by the executing
      session; until the post-commit verifier accepts the commits, nothing in BATCH-010 is
      durable or official.

  next_actions:
    - >-
      Make the BATCH-010 opening snapshot commit on expected parent e77ca6a4, staging exactly
      the ten paths declared in
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/batch.yaml under batch_opening_archive,
      with a message naming BATCH-010, DEC-20260728-001, DEC-20260728-002, H-RT1476-001,
      EXP-RT1476-001 and TASK-20260728-001 through -004. Verify it before dispatching anything.
      Then dispatch TASK-20260728-001 alone, then TASK-20260728-002 alone, then
      TASK-20260728-003, then TASK-20260728-004 alone.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is not an evidence-review decision. It reviews no run set, cites no experiment
      result, produces no durable research claim and changes no hypothesis status. Opening a
      batch and extending a batch budget is coordination, not a finding about ECDLP. Separately,
      the outstanding knowledge obligation on this goal - the CORR-20260727-003 superseding or
      correcting KN-FIND entry for the GGM closure finding, with a regenerated
      knowledge/INDEX.md - is NOT discharged here and is NOT abandoned: it is TASK-20260727-008
      and is preserved as an open obligation in the BATCH-010 batch record and in this
      decision's rationale. knowledge/ is outside every write scope in BATCH-010.

  decided_by: coordinator
  decided_at: '2026-07-28'
  decided_at_precision: >-
    Date only. This authoring session has no clock access and does not fabricate a wall-clock
    time. The committing session may record the exact commit time in the archive receipt.
