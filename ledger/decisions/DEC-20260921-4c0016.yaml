    now breaks that corrected range's own upper bound by nearly 2x. This
    record does NOT force a further false-precision narrative on top of an
    already-corrected one; see the_decision_stated_plainly and rationale below
    for the honest characterization this coordinator is prepared to state on
    seven points.
