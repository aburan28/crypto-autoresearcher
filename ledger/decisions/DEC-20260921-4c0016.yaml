  the_decision_stated_plainly: >-
    RUN-FROB-35c3b1's interruption is diagnosed, honestly and without
    fabrication, as the SAME failure mode that destroyed RUN-FROB-39714f,
    RUN-FROB-f3e2a3, RUN-FROB-16ecb6, RUN-FROB-5490f1, RUN-FROB-0b1c8e, and
    RUN-FROB-5fa3f0: a whole-environment/container restart external to any
    script's own control, external to any timeout wrapper (there was none
    this time either), and external to any code defect in
    driver-v2.py/checker-v2.py. This is now the SEVENTH, CONSECUTIVE instance
    of the identical infrastructure failure mode under the same,
    already-corrected source and launch procedure, launched correctly by the
    dispatching session every time. RUN-FROB-35c3b1 is also, by a wide
    margin, the LONGEST-surviving attempt to date: ~37 minutes, against a
    prior maximum of ~20 minutes (RUN-FROB-39714f, the very first retry) --
    nearly double. The full observed interval sequence is now ~20, 11, 9, 7,
    4, 5, and 37 minutes. DEC-20260921-0ddc5f already corrected the framing
    carried by DEC-20260921-fd5bf1 and DEC-20260921-1988f5 from "strictly
    shrinking" to "noisy/stochastic in a roughly 4-20 minute range" once a
    sixth point broke the shrinking trend those two records had described.
    This seventh point does not merely add noise inside that corrected
    range -- it breaks the corrected range's own upper bound by nearly 2x.
    This coordinator does not force a further precise-sounding distributional
    claim onto seven data points that have now, twice in a row, falsified the
    lane's own most recent honest characterization. The honest statement this
    record makes is: the restart interval is HIGHLY VARIABLE, has been
    observed at least in the roughly 4-to-37-minute range so far, and every
    one of the last two new data points has WIDENED the observed range rather
    than confirmed a stable one -- so no shape (shrinking, stable-noisy,
    bounded, or otherwise) is reliably characterizable from this data beyond
    "highly variable, with no confirmed upper bound." A description as
    "heavy-tailed" is plausible and worth naming as a candidate, but is NOT
    asserted as established: seven points from an unknown, externally-imposed
    restart process is too small a sample, with too little independent
    control over the underlying mechanism, to distinguish "heavy-tailed" from
    "small-sample noise around a wide uniform-ish range" or any other shape.
    This coordinator explicitly declines to fit a new named pattern to seven
    points where the last two both broke the immediately preceding pattern.
    Like all seven interruptions themselves, this characterization -- however
    stated -- remains infrastructure signal, never negative mathematical
    evidence (AGENTS.md core rule 5 / CLAUDE.md rule 3), and this record does
    NOT condition its own authorization on any reading of it. None of the
    seven says anything about H-FROB-73df22. On that basis, this coordinator
    (1) preserves RUN-FROB-35c3b1's directory exactly as it stands -- its
    real partial roots.jsonl.gz (486954627 bytes, sha256
    c6c6085c9d103f8057401b1dee39e5c48a55864436edbf3b36b3b945f5589876) and the
    three further hashed files, the three confirmed-empty files (stderr.log,
    stdout.log, tuples.jsonl.gz), with no execution-receipt.json authored for
    it, because the absence of one IS the honest record of what happened, not
    a gap to be papered over -- and (2) authorizes a fresh retry under a
    fresh, coordinator-proposed (NOT yet allocate_id.py-confirmed) run_id,
    RUN-FROB-a91f4c, via a fresh trial-plan-stage0-v11.json, a fresh
    run-binding, and a fresh launch handoff to the Executor
    (TASK-20260921-37bec7), per the user's standing instruction to keep
    retrying automatically through this exact failure mode.

  rationale:
    - >-
      SEVENTH, CONSECUTIVE INSTANCE OF THE SAME FAILURE MODE, STILL
      INFRASTRUCTURE/PROTOCOL SIGNAL, NEVER NEGATIVE MATHEMATICAL EVIDENCE,
      PER AGENTS.md CORE RULE 5 / CLAUDE.md RULE 3. RUN-FROB-35c3b1 is not a
      new, ninth failure mode; it is a REPEAT of RUN-FROB-39714f's,
      RUN-FROB-f3e2a3's, RUN-FROB-16ecb6's, RUN-FROB-5490f1's,
      RUN-FROB-0b1c8e's, and RUN-FROB-5fa3f0's own whole-environment-restart
      mode -- entire process tree destroyed, including the Python supervisor
      that would have written execution-receipt.json, before that
      supervisor's own completion/receipt-writing logic could run at all.
      This is the NINTH interruption overall in this lane's history and the
      SEVENTH consecutive occurrence of the identical infrastructure failure
      mode under the same, already-corrected source and launch procedure.
      Seven-for-seven launch attempts under driver-v2.py/checker-v2.py have
      now been killed by whole-environment restarts, all non-scientific,
      non-protocol infrastructure signal. None of RUN-FROB-35c3b1,
      RUN-FROB-5fa3f0, RUN-FROB-0b1c8e, RUN-FROB-5490f1, RUN-FROB-16ecb6,
      RUN-FROB-f3e2a3, or RUN-FROB-39714f says anything about H-FROB-73df22,
      RQ-FROB-7d8dd4, or whether Frobenius structure moves the index-calculus
      exponent.
    - >-
      CORRECTED CHARACTERIZATION OF THE INTERVAL SEQUENCE, RECORDED HONESTLY
      RATHER THAN FORCED INTO A NEW FALSE-PRECISION NARRATIVE. DEC-20260921-
      0ddc5f corrected its own two predecessors' "strictly/sharply shrinking"
      framing (four and five points respectively) to "noisy/stochastic in a
      roughly 4-20 minute range" once the sixth point (~5min) broke the
      shrinking trend. This seventh point (~37min) is nearly double the
      previous maximum (~20min, the very first retry) and breaks the
      corrected range's own stated upper bound by nearly 2x. Faced with a
      characterization that has now been falsified by the immediately
      following data point TWICE IN A ROW (five-point "shrinking" falsified
      by point six; six-point "4-20 minute range" falsified by point seven),
      this record does not attempt a third increasingly-precise-sounding
      re-fit. The honest statement, on seven points (~20, 11, 9, 7, 4, 5, 37
      minutes), is: the restart interval is HIGHLY VARIABLE, has ranged at
      LEAST from roughly 4 to roughly 37 minutes so far, and each of the two
      most recent points has widened rather than confirmed the observed
      range -- so this coordinator records no confirmed upper bound and no
      confirmed distributional shape. "Heavy-tailed" is named here as a
      plausible descriptive candidate (a process that occasionally survives
      far longer than its typical case, consistent with e.g. exponential/
      geometric-ish external scheduling with a long right tail), but is NOT
      claimed as established: seven points, drawn from a process this lane
      has no control over or visibility into, cannot reliably distinguish
      "heavy-tailed" from "small-sample noise around a genuinely wide but
      otherwise unremarkable range," and asserting more shape than the data
      supports would itself violate AGENTS.md core rule 5 and core rule 9 in
      the same way the two prior over-precise framings eventually needed
      correcting. This correction changes no authorization in this record:
      like the seven interruptions themselves, the interval sequence, under
      any of its three successive framings, remains infrastructure signal
      only, never negative mathematical evidence, and this record does not
      condition RUN-FROB-a91f4c's authorization on any reading of it.
    - >-
      NO FABRICATED RECEIPT. This decision does NOT author an
      execution-receipt.json for RUN-FROB-35c3b1, and does not construct,
      estimate, or infer one from the partial roots.jsonl.gz or from what a
      graceful interruption receipt would ordinarily contain. Per AGENTS.md
      core rule 5 ("Never fabricate commands, outputs, timings, statistics,
      citations, or runs. Missing data stays missing and is reported as
      such."), the honest record of RUN-FROB-35c3b1 is exactly what is on
      disk: real partial output (roots.jsonl.gz, 486954627 bytes, sha256
      c6c6085c9d103f8057401b1dee39e5c48a55864436edbf3b36b3b945f5589876),
      three further hashed adapter/launch files (command.txt,
      environment.json, launch.json), three confirmed-empty files
      (stderr.log, stdout.log, tuples.jsonl.gz -- all the well-known
      empty-file sha256), and a documented absence of every downstream
      adapter/checker artifact, because the process that would have produced
      them was destroyed before it could run. RUN-FROB-35c3b1's directory, as
      it stands right now, is preserved as-is by this decision. No file
      within it is edited, completed, or backfilled by this record.
    - >-
      THE RUNTIME LOCK BEING CITED REMAINS THE SAME, STILL-CURRENT, STILL-
      UNEDITED, LAUNCH-AUTHORIZED LOCK. This coordinator independently
      re-read linux-runtime-lock-successor-20260914-c85f6a.json in full in
      this engagement and reconfirms scientific_launch_authorized: true and
      its content sha256
      46d918a1a4b9d358df39f09a87d5221128cc1ce19cb62672bc35204785952eb5,
      cross-checked against trial-plan-stage0-v10.json's own and
      run-binding-stage0-v10-retry-20260921.json's own already-filled
      runtime_lock_sha256 fields (all agree). Nothing about the runtime, its
      guards, or its authorization changes here; a seventh whole-machine
      restart is not evidence the runtime lock's own guards were inadequate
      -- the failure is again a whole-machine restart, a class of event no
      per-process guard in linux-runtime-lock-successor-20260914-c85f6a.json
      claims to protect against, and this record does not construct a new
      claim that it does.
    - >-
      WATCHDOG SIZING RATIONALE REMAINS VALID, UNCHANGED. No run in this
      lane has ever shown signs of hanging or needing a shorter or longer
      watchdog; all nine interruptions observed to date have each been
      either an instant application-level error, an external interruption
      from this lane's own now-corrected tooling, or (seven times now) an
      infrastructure restart external to any process's own control -- never
      a hang. RUN-FROB-35c3b1 itself was still progressing normally (its
      roots.jsonl.gz was still growing) at the moment it was destroyed, at
      ~37 minutes -- far short of the 86400s watchdog ceiling. 86400 seconds
      remains sized generously above the only real duration signal available
      and remains a ceiling meant never to bind in the normal case, machine
      protection only per CLAUDE.md "Research budgets: progress first."
    - >-
      DIRECTION CHECK, unchanged from the whole DEC-20260909-bf5b48 ..
      DEC-20260921-0ddc5f chain. Stage0 is not itself exponent-moving; it is
      the correctness gate for H-FROB-73df22's two arms. No scientific claim
      of any kind is advanced by this admission/retry-authorization record.
      FROB is a declared ECC area (orchestration/research-priority.yaml line
      79), ranked ahead of non-ECC candidates at every selection point, with
      unlimited batch/wall-clock budget per AGENTS.md "ECC comes first."
    - >-
      BUDGET. Per CLAUDE.md "Research budgets: progress first" (2026-09-06):
      research cost estimates are advisory and require no repeated user
      approval; the Coordinator continues justified work within the
      authorized research scope. No 90-day stagnation review is active or
      warranted -- this lane has shown continuous documented progress across
      DEC-20260909-bf5b48 through DEC-20260921-0ddc5f and now this record,
      all within roughly two weeks, including seven genuine, correctly-
      executing partial runs (one of them, RUN-FROB-35c3b1, by far the
      longest yet) each destroyed only by infrastructure external to this
      program's own control. Authorizing a further retry after a seventh,
      consecutive infrastructure-only interruption is exactly the kind of
      routine continuation CLAUDE.md's "progress first" instruction protects,
      not a new spending decision requiring fresh justification. This is
      additionally, and explicitly, covered by the user's own standing
      instruction, relayed by the dispatching session, to keep retrying
      automatically through this exact recurring failure mode -- stated
      multiple times already. This coordinator's role is to execute that
      instruction faithfully via a proper decision record, not to
      second-guess it. A whole-machine restart mid-run is squarely within
      "watchdog expiry checkpoints a task; it does not exhaust the
      campaign."
    - >-
      NA-4's INFRASTRUCTURE-DIAGNOSIS RECOMMENDATION REMAINS OUTSTANDING AND
      IS REAFFIRMED, NOT RE-OPENED AS A NEW GATE. DEC-20260921-1988f5's own
      NA-4, reaffirmed by DEC-20260921-0ddc5f's own NA-4, recommended,
      non-blockingly, that the dispatching session open a dedicated
      infrastructure-diagnosis task once the five-for-five trigger
      DEC-20260921-fd5bf1 itself named was met. This record has not been
      told, and does not assume, that this diagnosis task has been opened,
      run, or completed; nothing in the materials reviewed for this record
      reports its status. A seventh consecutive instance of the identical
      failure mode -- now including this lane's single longest-surviving
      attempt to date, and a restart-interval range that has widened rather
      than stabilized on every one of the last two data points -- is further,
      unambiguous reinforcement that this diagnosis remains worth pursuing,
      and this record reaffirms it rather than re-litigating or escalating it
      into a new condition -- it still runs in PARALLEL with, and never
      blocks, the retry authorized here.

