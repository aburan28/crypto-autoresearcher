  context: Root-executed source validation successor with enforced write-once attempt receipts.
  rationale:
  - The failed decoder task overwrote a receipt and left final source unexecuted. Its archived history stays
    failed and cannot be reconstructed.
  - The current decoder code already expresses the clarified carrier semantics and the solver files match their
    required originals. Fresh exact-source tests with exclusive per-attempt receipts reduce the remaining uncertainty
    without another algorithm rewrite.
  - Standing authorization permits this bounded successor. Root carries out the receipt discipline directly;independent
    component review still follows the snapshot.
  approved_boundaries:
  - Root Coordinator executes directly. Copy the final eight-file source from failed snapshot2e44076ebdadb9fac6bb21b9a12257e9d7a179cc
    into the new task path. Preserve table.py,bsgs.py and rho-corrected.py byte-identically; verify the latter
    two also match d8f64d928c8f6a28eed97eac70b741ad3232fbd5. No algorithm,encoding,hash,capacity or scalar
    change.
  - Current table.py uses isinstance for declared buffer carriers and memoryview for actual nbytes/bytes,including
    genuine bytes/bytearray subclasses without invoking overridden __bytes__/__len__. Adopt that existing final
    source for fresh testing;do not narrow the domain or relabel old tests as testing it.
  - Change only checker task/path/binding metadata and receipt writing. Before launching a child,refuse if
    the requested receipt path already exists. Write each attempt receipt with exclusive creation. Every attempt
    uses a unique temporary path;the final canonical receipt embeds all attempts and complete outer responses.
    Never overwrite a prior receipt or drop failures.
  - 'Run exactly six focused smoke cases first: the three archived integer/bool counterexamples must raise
    TableValidationError and logical/hash/physical O/empty bytes carried respectively by bytearray,memoryview,bytes
    must decode correctly. Then run the unchanged365case complete suite against final exact source. At most800TOTAL
    cases incl failures/reruns;reserve a second365suite only for a concrete checker correction.10s/case1800aggregatewallCPU,one
    worker2GiB.'
  - All original365cases and expected outcomes remain intact. Preserve all failed predecessor artifacts,including
    the irrecoverably missing first per-case receipt as missing. A fresh complete pass does not repair prior
    custody.
  - No scientific curve/fixture,full rho,manifest,Docker/guard,keys/signature/RUN or experiment pipeline. Fixed
    synthetic checks only. Use -B/PYTHONDONTWRITEBYTECODE,absolute paths and complete outer/nested terminal/log/UTC/metric
    custody. Final source hashes must equal tested hashes;report implementation_commit:null and actual results
    with acyclic receipt bindings.
