  asymptotic_promotion_gates:
    status_all: OPEN
    note: >-
      G1-G4 remain OPEN. No assembled exponent was computed in this package
      (assembled_E_proxy null, "not_computed (out of control scope)"), and
      RT047-H3 records that at the quoted optimistic parameters the assembled
      exponent is ~1/2 — no improvement over matched rho — unless HEUR-DS-1
      delivers a superpolynomial smoothness gain, which failed at toy
      (EV-DS-002 O-3, F3).

  rationale:
    - >-
      Integrity gate PASSED. VAL-20260801-001 ADMISSIBLE with independent
      re-derivation of 400 certificates, independent regeneration of the target
      stream from seed 101, exact reproduction of R, R_null and both bootstrap
      CIs, and a from-scratch re-execution of the driver. The receipt may enter
      the ledger as empirical_only, toy-tier evidence.
    - >-
      Interpretation gate FAILED for any structure-dependent reading.
      RT047-B1..B5 show, from numbers inside the committed snapshot, that the
      three quantities carrying that reading are instrument artifacts. I
      recomputed the decisive ones and they hold.
    - >-
      The packaging branch is genuinely falsified and three real repairs landed
      (unplanted targets verified independently; 1200/1200 certificates;
      synthetic known-answer plant removed with CTRL_NULL_RHO honestly recorded
      as not_measured). This batch is NOT a failed run and is not written up as
      one.
    - >-
      No adverse transition is taken, because no evidence about the mechanism
      exists in either direction: smoothness_abort = false means the smoothness
      claw has never executed in this experiment series. Premature closure is a
      failure mode symmetric with overclaiming (inventor-protocol section 4).
    - >-
      The cheapest decisive next test is named and scheduled: RT047-CTRL-1
      variant (a), a matched-ALGORITHM null that changes only the object. Under
      a minute of compute, no new mathematics, decisive in both directions.

  limitations:
    - Single unreplicated empirical_only control at one toy cell; no replication
      is claimed and none exists.
    - The tested cell's prime-order subgroup is 241 (~7.9 bits); the "20 bits"
      label refers to the field, not the subgroup (AN-5).
    - Costs are wall-clock derived on one macOS arm64 host; the run's own
      charged-unit ledger disagrees by 2.20x on R and 116.5x on R_null, and
      neither proxy is a defensible operation count (RT047-C2).
    - PER_TARGET_CAP_SECONDS = 5.0 is an undeclared per-attempt cap (D-3); inert
      here, biasing at larger parameters, and it must be declared in the
      contract before this driver is reused.
    - CTRL-RT025-PLANT-LIVE remains undischarged and the plant detector has no
      measured specificity.
    - >-
      PD-2 blob drift re-bound at EV-DS-003 O-9: the executed control blobs are
      not the reviewed blobs, differing by five DEC-id remap lines only, with
      science-bearing fields byte-identical per the Validator's git diff.
    - This decision's own ID differs from the ID the queue issued; see
      id_assignment_note. The queue's declared commit set needs the
      corresponding amendment before the verifier can accept the commit.
    - >-
      Inference fallback: requested coordinator-orchestration-code, resolved
      claude-opus-5, model_verified false.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED, WITH A CONCRETE REASON, AND BOTH LEGS OF THE GATE FAIL. The
      promotion gate fires on a `support` or `reject_scoped` decision backed by
      `replicated` or `strong` evidence (proven boundaries included). LEG ONE
      FAILS: this decision is `inconclusive` — no scoped prediction is supported
      and no tested prediction is contradicted, because the mechanism under test
      was never exercised. LEG TWO FAILS: EV-DS-003 carries
      `strength: preliminary` on a single unreplicated run at one cell on one
      host; `replicated` and `strong` are unavailable by construction. AND THE
      DURABLE CONTENT IS NOT YET A FINDING: the transferable lesson — that a
      wall-clock ratio against an unmatched, algorithmically different null can
      manufacture a 111x "structure" signal that the same run's deterministic
      ledger puts at 0.957 — is a methodological observation whose decisive
      confirmation is one experiment away (RT047-CTRL-1). Promoting it now would
      curate a conclusion drawn from the very instrument under suspicion. It is
      recorded in EV-DS-003 (N-1, N-2, UC-1) and is the FIRST candidate for
      KN-FIND promotion once RT047-CTRL-1 returns, in either direction. No
      KN-FIND id is reserved, knowledge/INDEX.md is untouched,
      tools/build_knowledge_index.py was not run, and the five-path ledger
      commit set stands unenlarged.

  next_actions:
    - >-
      EXACTLY ONE NEXT ACTION — RT047-CTRL-1 VARIANT (a), THE MATCHED-ALGORITHM
      NULL. Open BATCH-021 under SG-ECDLP-001 with a superseding control
      addendum (CTRL-RT047-MATCHED-NULL) and, after one RC-21 review cycle,
      execute RUN-DS-001-ctrl-matched-null: run naive_search and split_search
      UNCHANGED — same code, smoothness_abort=false, same charge_backend_units,
      same frozen cost identity, 200 relations, seed 101 — against the additive
      group Z/753848Z with a 128-element negation-closed random signed factor
      base and 200 uniform random targets, reporting R and R_null under BOTH the
      wall proxy AND the charged-unit proxy, plus per-arm n_enum, peak claw
      table entries and peak RSS. PRE-REGISTER THE DISPOSITION MAP BEFORE THE
      RUN: R_matched_null ~ 0.03 (wall) / ~ 0.015 (units) fires H-DS-001's own
      falsification condition ("R_null < 0.5 whenever R < 0.5: apparent gain is
      an engine artifact") and R-1's F2 branch for the first time in the series,
      and the disposition is then WEAKEN with the win reattributed to generic
      meet-in-the-middle — explicitly NOT reject-as-impossibility;
      R_matched_null >= 0.9 is the first genuine structure evidence this
      experiment has produced, and RT047-CTRL-2's B-sweep becomes the immediate
      follow-on. Declare PER_TARGET_CAP_SECONDS in the control addendum (D-3)
      and carry RT047-B1's proxy-sensitivity disclosure into the reporting
      template. Estimated cost under 60 s of compute; no new dependencies; no
      new mathematics. Do NOT run the live plant in this task —
      CTRL-RT025-PLANT-LIVE stays undischarged and its repair (RT047-CTRL-3: a
      numeric pre-registered predicate exercised against a divisor-1.0 negative
      control and an opposite-sign plant) is a contract-drafting item ranked
      behind this one. Do not execute v1. Do not alter H-IC-001 or H-STR-002.
      Leave FAEST and XEDN alone. Forbid S1_met, support, asymptotic promotion
      and reject_scoped throughout.
  next_action_selection_rationale: >-
    Four candidate controls were on the table (RT047-CTRL-1..4). CTRL-1 is
    selected because it is the only one that attacks the single load-bearing
    inference of the entire lane — "R < 0.5 while R_null >= 0.9 means the win is
    structure-dependent" — and it is decisive in BOTH directions at under a
    minute of compute, requiring no new mathematics and no new dependency.
    CTRL-2 (B-sweep) is the correct follow-on and supplies the artifact tell and
    the memory axis, but its reading is only interpretable once the object-level
    null is known. CTRL-3 (plant-detector specificity) is a drafting task with
    no compute and no bearing on the mechanism question; it gates any future
    plant rerun, not this one. CTRL-4 (sparse-target regime) matters for the
    per-attempt-cost x inverse-success-probability bookkeeping the target
    profile demands, but it presumes the arm under test is the arm of interest,
    which is precisely what CTRL-1 decides. One action, chosen for
    decisiveness per unit of compute.

