  context: >-
    BATCH-020 executed CTRL-RT025-UNPLANTED, the single-cell unplanted control
    (bits=20, B=64, m=4, seed=101) that DEC-20260731-018 named as the exact next
    action, plus the CTRL-RT025-PLANT-LIVE companion. RUN-DS-001-ctrl-unplanted
    was snapshot-archived at 1d241a878b4f0e74cadbb5e2e0995c0bf6f97cbd
    (TASK-20260731-045, parent 64c069ab, 14 declared paths). Validator
    VAL-20260801-001 returned ADMISSIBLE to an unusually high standard: it
    re-derived 400/400 certificates with elliptic-curve arithmetic it wrote
    itself, regenerated the seed-101 target stream (sha256 match) confirming the
    targets are genuinely unplanted uniform random curve points, reproduced R,
    R_null and both bootstrap CIs exactly, and re-ran the driver end to end. Its
    four defects D-1..D-4 are minor. Red Team RT-20260731-047 then established,
    with code and artifact citations that this Coordinator re-derived
    independently from raw-result.json and R_cell.json, five blocking objections
    RT047-B1..B5: R and R_null are wall-clock ratios whose charged-unit
    counterparts are 0.0147 and 0.957 (a 116x disagreement on R_null, driven by
    the null arm rebuilding a 4096-entry table inside every attempt while the
    real arm amortizes its table once); the real arm exercises no elliptic-curve
    structure at all (smoothness_abort=false, provably-identity encoding,
    exact-equality join) and is a generic hash-join meet-in-the-middle; relation
    collection alone costs 66,170 rho-equivalent group operations against a
    MEASURED 744-operation rho solve of the same instance; subgroup_order_n =
    241 is a 7.9-bit prime-order subgroup, not the 20-bit prime-order subgroup
    H-DS-001's test boundary asks for (Executor AN-5); and
    CTRL-RT025-PLANT-LIVE is not discharged, the /4 divisor being applied only
    to the split arms so R_on/R_off = 1/4 by algebra, with Reading B a
    threshold-free strict inequality of false-positive rate 1 and Reading A —
    the only reading with contractual provenance — returning false with the
    plant both on and off. Prior standing: EV-DS-002 / DEC-20260731-018
    (relations=200, inconclusive, H-DS-001 analyzed); EV-DS-001 /
    DEC-20260731-023 (relations=15, historical).

  decision: inconclusive
  decision_label: inconclusive_on_mechanism_with_partial_repair_confirmed
  decision_vocabulary_note: >-
    `inconclusive` on the H-DS-001 mechanism, with the packaging repair recorded
    as an established positive result. The schema template enumerates
    approve|revise|replicate|expand|support|weaken|reject_scoped|pause|supersede;
    DEC-20260731-023 and DEC-20260731-018 established `inconclusive` as the
    operative evidence-review disposition for this lane when the integrity gate
    passes but interpretation cannot support a mechanism reading, and that usage
    is continued here. `inconclusive_partial` is not a distinct enum value; the
    partial-repair character is carried in decision_scope and in EV-DS-003.

  decision_scope: >-
    The official status of RUN-DS-001-ctrl-unplanted is an ADMISSIBLE toy-tier
    control receipt that (a) falsifies the packaging branch of the frozen
    pre-registered packaging_falsification_rule, (b) repairs the planted-target
    and synthetic-known-answer defects, and (c) establishes that the favourable
    R / R_null figures do not evidence structure-dependence. It does not
    establish S1_met, does not support or weaken H-DS-001's mechanism, does not
    validate or refute HEUR-DS-1, does not discharge CTRL-RT025-PLANT-LIVE, and
    moves no asymptotic claim. H-DS-001 remains `analyzed`. H-IC-001 and
    H-STR-002 are unchanged. EV-DS-002 remains the operative record for the
    planted relations=200 package and is not superseded.

  central_adjudication: >-
    THE RUN LANDED OUTSIDE BOTH BRANCHES OF A RULE DRAFTED AS A DICHOTOMY: IT
    FALSIFIED PACKAGING WITHOUT ESTABLISHING STRUCTURE. That is the finding of
    this batch, and it is a finding about the instrument, not about the
    mathematics. The correct response to an instrument that cannot see the
    quantity in question is to fix the instrument, not to score the hypothesis.

  weighing_of_the_red_team_recommendation: >-
    RT-20260731-047 recommends `inconclusive` on mechanism with partial repair
    confirmed, keeping H-DS-001 at `analyzed` pending replication and
    RT047-CTRL-1. The Coordinator CONCURS, on independent verification rather
    than deference, and states the merits:
    (1) I recomputed the load-bearing numbers myself from the committed blobs:
    charged units 1914080/130630800 = 0.01465 and 465080/486040 = 0.95688
    against wall-derived 0.03216 and 111.447, confirming the 2.20x / 116.5x
    proxy disagreement; and 64 x 1033.909835504201 = 66,170.2 rho-equivalent
    operations against the measured CTRL_RHO 744, confirming 88.9x; and
    log2(241) = 7.91. The objections are arithmetic, not rhetoric.
    (2) `support` is unavailable twice over: the AGENTS.md state machine
    requires `replicated` before `supported`, and H-DS-001's own criterion
    demands R < 0.5 at B >= 64 on at least TWO bit sizes among {16,20,24} while
    this package supplies one. That is arithmetically unmeetable, before any
    objection is considered.
    (3) `weaken` is also unavailable, and this is where I part company with any
    reading that treats an adverse review as an adverse result. Weakening
    requires evidence against the mechanism. There is none, because the
    mechanism was never invoked: SMOOTHNESS_ABORT = False in this run and in
    every real arm of the EXP-DS-001 series to date, so is_B_smooth has never
    been called and the smoothness claw H-DS-001 is about has never executed. An
    untested mechanism generates no evidence in either direction. The strongest
    checkable refutation artifact this result admits — RT047-B2's identity
    derivation that encode_intermediate is the identity map at this cell
    (D = 2^40 vs x < p = 752627 < 2^20) — refutes the INSTRUMENT's ability to
    test the mechanism, not the mechanism; it is archived in this same ledger
    commit and cited in EV-DS-003.proof_refs, and it licenses no adverse
    hypothesis transition.
    (4) `reject_scoped` is forbidden outright: a single unreplicated
    empirical_only control cannot carry it (docs/claims-and-verification.md;
    inventor-protocol section 4; the contract's own
    packaging_falsification_rule). Closing this lane on this evidence would be a
    fatigue report about the harness, not a statement about the problem.
    (5) The one place I go beyond the Red Team's recommendation is emphasis: the
    packaging falsification and the three repairs are ESTABLISHED RESULTS, not
    consolation prizes, and EV-DS-003 records them as such under
    what_is_established E-1..E-6. A report that only attacks would leave this
    batch looking like a failure. It was not one.

