  hypothesis_status_transition:
    hypothesis_id: H-DS-001
    from: analyzed
    to: analyzed
    changed: false
    reason: >-
      The control package is admissible (VAL-20260801-001) but inconclusive on
      mechanism under RT-20260731-047's blocking objections. No promotion is
      available (one bit size against a two-bit-size criterion; unreplicated).
      No adverse transition is available either, because the mechanism was never
      exercised (smoothness_abort=false on every real arm in the series). Status
      remains analyzed — not supported, not weakened, not rejected.

  packaging_falsification_rule_adjudication:
    branch_1_packaging: >-
      NOT OBSERVED. R did not rise toward 0.5 (0.0322 wall, 0.0147 units) and
      yield did not collapse (200/200 on both real arms, empirical success
      probability 1.000, no resource exhaustion). Planted-yield packaging is
      FALSIFIED as an explanation of the previous package's yield.
    branch_2_structure_dependent: >-
      NOT ESTABLISHED. Conjunct 1 is satisfied as measured but measures wall
      time on a structure-free generic meet-in-the-middle (RT047-B1, B2);
      conjunct 2 holds only under the wall proxy against an unmatched null
      (0.957 under the run's own charged units); conjunct 3 fails (RT047-B3).
    official_reading: >-
      THIRD OUTCOME. The rule was drafted as a dichotomy and the run landed
      outside both branches. The mechanism remains untested because the
      instrument does not measure it.

  control_discharges:
    CTRL-RT025-UNPLANTED: DISCHARGED AS TO THE UNPLANTED-TARGET FACET ONLY.
    CTRL-RT025-PLANT-LIVE: NOT DISCHARGED.
    RT038-B7: PARTIALLY DISCHARGED.
    RT038-B3: NOT DISCHARGED.
    RT038-B4: NOT DISCHARGED.
    note: >-
      The control file's self-asserted `discharges` list [RT038-B7,
      CTRL-RT025-UNPLANTED, CTRL-RT025-PLANT-LIVE] is NOT carried forward
      unamended (RT047-S3). This decision is the operative discharge statement.
      No control, specification or amendment file was edited by this task.

  binding_constraints_from_red_team:
    - 'RT047-B1: R and R_null are wall ratios; charged units never enter R; the
      same file gives R_null = 0.957 under charged units. The R_null >= 0.9 gate
      is not robust to proxy choice — it passes by 6%, not by 12,000%.'
    - 'RT047-B2: the null object is not matched and the real arm exercises no
      Semaev/elliptic structure; R_null discriminates nothing. Blocks every
      structure-dependence and mechanism-supported reading.'
    - 'RT047-B3: CTRL-RT025-PLANT-LIVE undischarged; a numeric, pre-registered,
      specific detection predicate with a MEASURED false-positive rate is
      required before any plant rerun.'
    - 'RT047-B4: relation collection alone is 88.9x the measured rho solve and
      dominated by BSGS on memory; no Pareto or attack-cost claim; dominated_by
      may not be null.'
    - 'RT047-B5: one cell, one seed, unreplicated, 7.9-bit prime-order subgroup
      against a test boundary asking for 20 bits; blocks promotion and bit-size
      overstatement.'
    - 'RT047-M1 (advisory): bootstrap CIs are anticonservative because arm
      overhead is not resampled.'
    - 'RT038-B1..B7 + M1 all remain binding; B3 and B4 are undischarged and now
      stronger.'

