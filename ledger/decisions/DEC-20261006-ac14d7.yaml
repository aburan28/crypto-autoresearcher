  context: >-
    /design-experiment, one contract, and three new proposals.
    IDEA-20261006-b6ce60 is on origin/design/ssi-2f5c3f-cartier and is
    not on origin/main. The question is RQ-SSIQ-9702af. No hypothesis
    or experiment on origin/main cites that full id. The branch
    design/ssiq-b6ce60 was created from origin/main at
    e9b096ab05aee655e52f04ab6dbc5a3bb1ebd47e. A later fetch
    fast-forwarded the branch to 7c15b48908ec601eb513f00c15c9d163cc00869c
    with no conflict. The copied proposal bytes have git
    blob 08968262af30390ef04ba31159431cfc0d6a0dba.

    The contract freezes the smallest prime at least 5500, with
    candidate 5501 rechecked by trial division, X = 14, the curve-side
    degree and the quaternion norm, and the exact threshold 3/20
    against 10/14. Success is the source idea's prediction that the
    symmetric difference is empty and the absolute gap is strictly
    greater than 0.15. The concrete negatives are a finished nonempty
    difference, and a finished gap of at most 0.15 once the multisets
    are equal. No j-invariant was enumerated in this session and no
    degree was recorded.

    This session opened the archived paper, KN-TECH-055, KR-RHO-755e35,
    KR-RHO-13bf67, and KR-RHO-ea34b8. Those rows are not a measurement
    of the two multisets.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. Success fails
    when a finished symmetric difference is nonempty, and it fails
    when the multisets are equal and the gap is at most 0.15. No
    field required for approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - A finished nonempty symmetric difference, and a finished gap of at most 0.15, are both reachable as recorded outcomes, so success is not automatic.
    - The 5-smooth recount, the subfield degree-1 check, the ordinary control, and Gal duplication are the instrument controls.
    - An unequal multiset is not relabeled as a smoothness gap, and a smoothness gap is not relabeled as an unequal multiset.
    - This session did not enumerate a j-invariant and did not claim that the exponent moves.

  evidence_refs: []
  limitations:
    - The measurement covers one prime near 5500 only. It does not transfer to the question's log2(p) window [20, 60] or to a SQIsign prime.
    - Equal multisets are not a certificate of the isometry at large p.
    - A gap from 10/14 is not a change in the 1/3 exponent.
    - An instrument failure is not an unequal multiset and is not a gap.
    - A timeout is failed_infrastructure and is not a mathematical negative.
    - This decision authorizes a later execution. It does not start one.
    - This decision does not edit a goal head.

