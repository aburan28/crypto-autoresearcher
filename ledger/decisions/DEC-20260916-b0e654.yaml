coordinator_decision:
  id: DEC-20260916-b0e654
  context: >-
    EXP-SEMBIN-4fa22c's own proof_search_map carried an observation-collision audit marked "REQUIRED
    BEFORE THE FIRST RUN and not yet performed". BATCH-cbb416 dispatched it as TASK-20260916-fc72a6
    before the execution rather than after, and gated the execution on a Coordinator ruling rather
    than on the audit merely finishing -- because a collision can reframe a run as a replication,
    hand it an existing validated instrument, or contradict its prediction outright, and each needs a
    decision rather than a default. The audit returned `collision: partial`, recommendation
    `proceed`, both marked in its own verdict.json as recommendations and not rulings. This is the
    ruling.
  decision: approve
  decision_note: >-
    `approve` in the schema's sense: it authorizes the already-approved EXP-SEMBIN-4fa22c to proceed
    to execution, records an additive protocol amendment, and grants a bounded reuse permission the
    contract left open. It approves no claim, moves no hypothesis, and discharges no completion
    criterion.
  target_ids:
    - EXP-SEMBIN-4fa22c
    - TASK-20260916-0c2802
    - AMD-EXP-SEMBIN-4fa22c-20260916-collision
    - REVIEW-SEMBIN-20260916-cbb416-ADD2
    - BATCH-cbb416
    - GOAL-SEMBIN-fcb7a2

  the_ruling:
    on_the_verdict: >-
      ACCEPTED AS `partial`, and the audit's reading of why is adopted. There is no collision on the
      headline arm: no record in this tree measures the fake first fall degree of a coset-shifted
      EQS4 degree-3 Weil descent under the contract's equality-form convention with trivial Koszul
      falls excluded. There is a partial one on the CONTROL arm: two prior instruments have scanned
      EQS2-shaped chained-S_3 Weil descents over F_{2^n} at n inside this contract's range, under a
      fall-to-linear criterion, without Koszul exclusion. Neither `none` nor `replication` describes
      that honestly.
    on_whether_the_run_proceeds: >-
      IT PROCEEDS. TASK-20260916-0c2802 moves from `blocked` to `queued` on this decision being
      committed. The headline measurement is unmeasured, no existing measurement contradicts
      H-SEMBIN-a7e721, and stopping on this evidence would be the unjustified steering AGENTS.md's
      research-direction integrity section forbids.
    on_reuse_the_contract_left_open: >-
      READ ANY OF THEM, IMPORT NONE OF THEM INTO THE MEASUREMENT PATH, and one specific routine is
      promoted to a TEST ORACLE inside the C-3 fixture suite. Full terms in the amendment's A-1. The
      contract forbade importing EXP-ICPERF's converter and was silent about EXP-ECTD-9e4248,
      EXP-SIG-007, EXP-ALPF-012 and src/semaev_tree.py; an executor cannot answer that for itself,
      which is why the audit asked and why the answer is here rather than in a session message.
    on_the_two_reframings: >-
      R-1 ADOPTED and made binding as amendment A-3: the unshifted arm reports as a replication with
      a changed instrument, with a comparison table against the prior EQS2 records and the four
      differences stated beside it. R-2 DECLINED as a fixture and adopted instead as that post-hoc
      comparison, with three reasons and a revisit condition recorded in the amendment.
    what_the_audit_established_that_matters_more_than_its_verdict: >-
      THAT THIS PROGRAM CANNOT CURRENTLY BUILD THE OBJECT THE CONTRACT IS ABOUT. src/semaev_tree.py
      -- the builder behind every Semaev descent measurement this program has made -- contains no
      occurrence of coset, shift, v_i or offset, and make_V_subspace returns a subspace through the
      origin. The Coordinator confirmed both independently. Every descent built from it is v = 0,
      which is EQS2 by Nagao's Definition 4 in the paper's own words. Two consequences, and they run
      in opposite directions: the shifted arm's novelty rests on a CHECKABLE ABSENCE IN CODE rather
      than on a failure to find a record, which is much stronger than the absence of a search hit;
      and the shifted construction is new implementation work with no precedent in the tree, which
      is a real scope cost the contract as frozen already carried and nobody had priced.

  rationale:
    - >-
      THE AUDIT DID NOT FAIL, AND THAT IS NOT THE SAME AS IT BEING UNINFORMATIVE. Section 8 of the
      inventor protocol puts these audits before compute precisely because a failure is often the
      useful result. This one did not fail, but it moved two things: it converted the headline arm's
      novelty claim from "we searched and found nothing" into "the code cannot express the object",
      and it found the control arm substantially pre-measured, which the contract was not claiming
      and now gets for free as a cross-instrument read.
    - >-
      THE PERMISSION QUESTION WAS WORTH ASKING AND THE ANSWER IS NOT THE OBVIOUS ONE. The tree holds
      exactly one Macaulay rank routine that runs without an algebra engine, in a checkout where
      sage, sympy and galois are all absent -- so the naive ruling is "reuse it". The ruling is
      instead to keep it out of the measurement path (coupling, plus dense Python elimination against
      a 1800 s per-arm budget) while using it as an independent oracle for the instrument's own
      kernel. That turns a scarce resource into a control instead of a dependency.
    - >-
      A CORRECTION TO THE AUDIT, RECORDED BECAUSE IT CHANGES THE REASONS AND NOT THE OUTCOME. The
      audit stated that macaulay.rank_mod_p's Fermat inverse degenerates at p = 2. It does not: the
      only invertible residue mod 2 is 1 and pow(1, 0, 2) = 1, so the step returns the right value
      for the only input it can receive. Checked against an independently written bitset eliminator on
      300 random 0/1 matrices up to 9x9, agreeing on every one. This removes a correctness objection,
      which is why the routine is promoted to oracle rather than merely referenced; the ruling still
      excludes it from the measurement path on coupling and performance grounds. An audit finding
      corrected by the ruling that reads it is the review architecture working.
    - >-
      AN UNCHECKED RANK ROUTINE IS THE SINGLE POINT OF SILENT FAILURE IN THIS EXPERIMENT. Every
      metric the contract defines is read off a rank; there is no engine to fall back on; the routine
      will be written from scratch. It does not fail loudly, it returns a plausible integer. Amendment
      A-4 requires it to be checked against an independent computation and against constructed
      matrices of known rank before any Nagao instance is measured, inheriting SR-3's stop.
    - >-
      THE DISCLOSURE NEEDED CONTAINMENT, NOT CRITICISM. The audit deliberately disclosed one scoped
      relation between prior unshifted values and this contract's threshold, judging that withholding
      it would understate its own answer to Q5 in the direction that keeps the run alive. That
      judgement was correct. But the paths it names hold integers for a nearby object, and the round
      contains a blind re-derivation of this contract's integers -- so review-plan-addendum-2.yaml
      puts the audit and those paths under `blind_from`. No number is restated anywhere in this
      decision, its amendment, or that addendum.

  evidence_refs:
    - id: TASK-20260916-fc72a6
      provenance: internal
      what: the collision audit; verdict `partial`, recommendation `proceed`, 0 runs, 0 measurements
      verified_by: coordinator, this session, which read report.md and verdict.json in full
    - id: TASK-20260916-81fa8c
      provenance: internal
      what: >-
        the snapshot archive binding the audit's three artifacts at commit 4af041050 under
        content_at_commit, with the Coordinator's pre-commit read disclosed in the receipt
      verified_by: coordinator, this session; four path hashes verified by research_dispatch.py
    - id: src/semaev_tree.py
      provenance: internal
      what: >-
        the shift-free builder. `rg -c 'coset|shift|v_i|offset'` returns no match;
        make_V_subspace returns the F2-span of {1, alpha, ..., alpha^{k-1}}
      verified_by: coordinator, this session, independently of the audit
    - id: experiments/EXP-ECTD-9e4248/driver/reused/macaulay.py
      provenance: internal
      what: rank_mod_p, correct at p = 2, promoted to test oracle by amendment A-1
      verified_by: coordinator, this session, on 300 random matrices against an independent kernel
    - id: NAGAO-2015-984
      provenance: retrieved
      what: >-
        Definition 4's "taking v1 = ... = vN = 0", which is what makes every unshifted descent EQS2
      verified_by: >-
        the audit, which quotes the frozen text at paper_fulltext.md:264-265; and the blind reader of
        coordination/review/sembin-20260916-propquant for the surrounding definitions
    - id: DEC-20260916-88ac73
      provenance: internal
      what: the decision imposing DC-1 through DC-4, which this ruling leaves untouched
      verified_by: coordinator, this session

  limitations:
    - >-
      RECALL IS A FLOOR, NOT A CLEAN BILL OF NOVELTY. The kb retrieval index could not be called,
      verified by six probes; 63 direct tree queries were substituted for it. Semantic recall,
      staged corpus material absent from this checkout, and ranking are all lost. Absence of a
      result is not evidence that something was not tried.
    - >-
      The audit swept only two experiments' manifests for validated first-fall runs; 19 copies of
      semaev_tree.py exist in the tree. That is the largest and cheapest open hole and it is named,
      not closed.
    - >-
      This ruling asserts nothing about Proposition 5, about d_F, or about d'_F. No measurement has
      been performed. DC-1 and S-1 stand: this instrument cannot refute Proposition 5, whatever it
      returns.
    - >-
      The `partial` verdict rests on the audit's judgement that the prior EQS2 scans are close enough
      to matter and different enough not to be a replication. A later reader may reasonably reclassify
      it; the four named differences are what such a reader should argue with.
    - >-
      Nothing here makes the shifted construction easier. It remains new code with no precedent in
      the tree, in a checkout with no algebra engine, and the run may well censor before the top of
      the n-series. A truncated series is a complete result for the n it covers.

  next_actions:
    - rank: 1
      action: >-
        Dispatch TASK-20260916-0c2802, the EXP-SEMBIN-4fa22c executor, under this ruling and its
        amendment. C-3's fixtures and A-4's rank-kernel check run FIRST; SR-3 stops the run before
        any Nagao instance if either fails.
    - rank: 2
      action: >-
        On the run's return: snapshot TASK-20260916-8eb394, extract blind-instance.yaml from the
        run's recorded inputs block with no measured value in it, re-grep the tree for any d'_F, M-1
        or M-2 figure as the plan's blind_from_note requires, then dispatch both reviewers.
    - rank: 3
      action: >-
        Sweep the remaining 17 experiments that vendor semaev_tree.py for a completed_valid
        first-fall run. The audit names this as its largest open hole; it is cheap and it can only
        raise the floor.
    - rank: 4
      action: >-
        Stand the kb retrieval index up (make -C kb qdrant-up; kb/.env; uv; crypto-kb stage-repo .
        && crypto-kb ingest) so that the next collision audit in any campaign has the instrument
        AGENTS.md names for it. This is infrastructure, and it is not a precondition of rank 1.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No durable corpus entry results. Nothing here is a measurement or a validated finding: it is a
      permission ruling, a protocol amendment and a discharged pre-compute audit. The audit's
      structural finding -- that the program's shared Semaev descent builder cannot express a coset,
      so every descent it has ever built is EQS2 -- is a candidate for a KN-FIND entry about the
      program's own instrumentation, but it should be promoted after the shifted builder exists and
      the two are compared, not on a code read alone.

  what_this_decision_does_not_do:
    - It does not edit experiments/EXP-SEMBIN-4fa22c/specification.yaml. The contract is frozen at
      version 1; every change travels in AMD-EXP-SEMBIN-4fa22c-20260916-collision.
    - It does not move H-SEMBIN-a7e721, which stays `approved`, or EXP-SEMBIN-4fa22c's status, which
      stays `approved` until a run makes it `running`.
    - It discharges no completion criterion of GOAL-SEMBIN-fcb7a2. Authoring and ruling are not
      progress against a criterion; only run or read evidence is (CORR-20260916-402547).
    - It does not touch the goal head. That path is owned by this batch's opening card and a dispatch
      queue permits one owner per artifact; the head is reranked at the batch's close.
    - It quotes no measured degree, from this campaign or any other.

  inference:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: claude-opus-4-5
    resolved_model_id_provenance: >-
      self-reported by this runtime session; unverified configuration, not an established fact
    fallback_used: true
    fallback_reason: >-
      No adapter backend is credentialed in this checkout; the runtime-native binding permitted by
      core rule 16 is the only route (DEC-20260916-7b2235).
    degraded_allowed: false
    model_verified: false
    model_verified_reason: >-
      `python3 -m orchestration.adapter doctor --probe` has no usable backend here. No verified
      identifier was invented.

  decided_by: coordinator
  decided_at: '2026-09-16'
