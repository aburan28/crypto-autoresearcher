  context: Complete the four CM serialized-definition corrections accepted in archived DEC-20260908-1c00a5.
  rationale:
  - The peer independently reviewed46bound inputs andarchived the exact three outputs. Its121fixed attempts include120passes
    andonepreservedchecker-fixturefailure; this is NEEDS_CORRECTION,not a clean source or scientific verdict.
  - Adopt the four exact corrective boundaries from the committed peer disposition. Preserve the verified23unchangedscientific
    sections andexisting positive controls. No duplicate review orarchive is assigned.
  - The missing predecessor absolute invocation chronology remains disclosed. A fresh successor must record prospective
    case reservations andabsolute invocation boundaries so the same custody gap is not repeated.
  - Standing authorization approves complete definition drafting andfixed schema checks. Approval of the final experiment
    contract remains a later Coordinator action after fresh independent review.
  accepted_findings:
  - finding_key: component_arm_and_edge_reason_mapping
    required_correction: Add exact allowed plane and arm domains to every arm-context component row, including warmup/setup/evaluation/conversion
      cases, and add an exhaustive reason_code mapping keyed by component family, strategy_view, and scenario kind.
      Enforce both in the schema where possible and in one explicit global semantic predicate.
  - finding_key: inference_writer_schema_conflict
    required_correction: Reconcile the schema with the sole writer additively. Define closed note and resolution_error
      branches and their status conditions, or change the authoritative writer and corresponding governance contract
      together. Do not silently strip the provenance/error fields downstream.
  - finding_key: unlabeled_leave_one_out_identity
    required_correction: Add omitted_block with the closed domain 0 through 6 to every leave-one-out item, require
      exactly one of each label for each governing cell, and recompute against the same label in both strategies
      and endpoints. An explicit immutable array-index rule plus exact uniqueness checks would also close the encoding,
      but it must be stated.
  - finding_key: untyped_manifest_failure_reason
    required_correction: Define a closed outcome reason-code union covering every result state, bind each code to
      its permitted status and stage, include the existing AUTH_* codes, and require a separate optional detail
      field if free diagnostic prose is needed.
  approved_correction_boundaries:
  - Create a complete new five-file prospective successor of TASK-20260908-5e3d88,not a patch-only checklist. Preserve
    its23unchanged scientific sections and all finite CM identities,reducers,Med7/Med6,controls,samples,seeds,arms,quantifiers,thresholds,resource
    policy andsource/runtime bindings. Only cost_contract andartifact_custody serialized definitions plus prospective
    provenance may change.
  - For every registered arm-context component,derive an exhaustive allowed plane/arm relation from the complete
    existing named algorithms and control matrices. Explicitly bind transport psi/iota/phi/warmup to their actual
    transport contexts,scalar multiplication/warmup to scalar contexts,library conversions/setup to the actual library
    arm,andpoint-table/setup/verification to their actual permitted algorithm contexts. Shared/setup/scaffolding
    rows retain their exact existing owner domains. Encode schema-expressible constraints andone normative global
    relation; do not invent a new algorithm or charge.
  - Define an exhaustive allocation reason_code relation keyed by component family, strategy_view andscenario kind,consistent
    with the existing edge-existence/lifetime table. Actual-only edges must have actual_only reason; candidate-score,common,transport
    andselection expenditure reasons must identify their true existing allocation purpose. Invalid family/view/scenario
    combinations remain forbidden. Preserve global72target allocation,candidate7library lifetime,eight-endpointstratum
    derivation,integer remainder and rational conservation.
  - Reconcile inference serialization with the sole pinned orchestration/adapter/manifest.py writer. Add closed
    optional note andresolution_error fields and exact branch/status conditions for deterministic andresolution-failure
    outputs; preserve their provenance/error bytes and do not edit or silently strip the shared writer. List all
    fields and required/forbidden combinations. An operational policy-resolution failure cannot become a completed_valid
    scientific record.
  - Every leave_one_out item has required omitted_block integer0..6,exactly one of each for every governing cell.
    Bind recomputation by label to the same omitted timing block in both strategies andboth endpoints. Non-governing
    cells retain emptyLOO. List ordering alone does not supply identity; duplicates,missinglabels and relabeled
    values must fail. Med7/Med6 andall36gates are unchanged.
  - Define an exhaustive closed result reason-code union for completed_valid,completed_invalid,partial_inconclusive,refused_before_run,infrastructure_stopped,including
    all existingAUTH_*refusals. Map each to exact permitted status,stage,validity andbranch; distinguish invalid
    measurements,incompletework,infrastructure andauthorization. Use a separate optional detail string for diagnostics;
    arbitrary prose is not a reason code. Completed-valid inconclusive statistical patterns remain valid data when
    controls pass. Preserve every existing reason/failure path by explicit mapping; never silently discard an unexpected
    outcome.
  - Update the complete JSONSchema,prospective normative semantic predicates,andactual fixed checker together. Required
    global relations are named and executable for fixed serialization examples; clearly state any scientific runtime
    validator still unimplemented. Cover all four archived counterexamples,positive real writer shapes,full allocations,reduced
    fractionalLOO label permutations,and each status/reason branch using fixed abstract objects only.
  - Preserve the prior missing absolute suite-time chronology as a historical limitation. Every new checker invocation
    records UTC start andend,pre-reserved case count,checker/contract hashes,command,exit,status,timing andmemory-enforcement
    outcome. Keep all failed/rerun attempts. No prospective invocation order is inferred solely from a final receipt
    timestamp.
  - No future runner,actual allocator/CM evaluation,curve/point/divisor generation,scientific fixture/null/control/timingpanel,Sage/PARI
    process,privatekey,signature,nonce,launchlock,RUN allocation ormeasurement. Installed JSONSchema may validate
    fixed objects andmust record its actual version. Use the public trust source only as an unchanged binding.
