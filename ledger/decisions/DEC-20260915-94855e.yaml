coordinator_decision:
  id: DEC-20260915-94855e
  decided_by: coordinator
  decided_at: '2026-09-15'
  decision: expand
  scope: >-
    Opens GOAL-SEMBIN-fcb7a2 as a committed campaign, adopts a reporting rule for its
    central measurement, and ranks its work. Changes no hypothesis status, promotes no
    claim, approves no experiment, and records no measurement.
  target_ids:
    - GOAL-SEMBIN-fcb7a2
    - RQ-SEMBIN-9e8f82
    - IDEA-20260913-352163
  context: >-
    GOAL-SEMBIN-fcb7a2 was announced to every lane on 2026-09-13 by the committed bus
    message MSG-20260913-67d64f, and four records that reached origin/main cite it as
    their goal_id -- DEC-20260913-8d19e5, DEC-20260913-c224bb, DEC-20260913-92aa48 and
    the handoff TASK-20260913-335d65. THE GOAL RECORD ITSELF WAS NEVER COMMITTED. Its
    head sat untracked in one worktree for two days, describing an open batch, an
    approved frozen contract, and a dispatched executor run, none of which existed. This
    decision commits the goal in a corrected form and records what the draft claimed, so
    the gap between them is auditable. CORR-20260915-b7ca0c carries the full account.

    The campaign audits Nagao ePrint 2015/984, which claims ECDLP over F_{2^n} in
    O(n^{8w+1}) -- the ePrint's own keyword is "polynomial time algorithm" -- under the
    first fall degree assumption. Its Proposition 5, which every downstream complexity
    statement including Theorem 1 consumes, is justified entirely by footnote 6: "The
    situation is the same as the Semaev's case. So, we omit the proof."
  rationale: >-
    THREE THINGS ARE DECIDED, AND THE SECOND IS THE ONE THAT MATTERS.

    (1) THE GOAL IS OPENED, ACTIVE, WITH NO BATCH. SEMBIN is a declared ECC area
    (orchestration/research-priority.yaml, read via tools/ecc_priority.py), so the
    campaign budget is unlimited -- maximum_batches and total_wall_clock_seconds null --
    and max_concurrent stays at 2 as machine headroom rather than as a research budget.
    Opening it with `current_batch_id: null` rather than inheriting the draft's
    BATCH-efea59 is deliberate: that directory holds committed work
    (TASK-20260913-0188bf's Nagao read, TASK-20260913-74b33c's sizing) which is declared
    and archived by the PARENT goal's queue under BATCH-9d649f, so it is a working
    location named for this campaign, not a batch of it. The first real batch takes a new
    identifier. The identifiers MSG-20260913-67d64f announced -- H-SEMBIN-a7e721 and
    EXP-SEMBIN-4fa22c -- are recorded as reserved rather than reused elsewhere, so the
    committed announcement resolves when those records are written.

    (2) THE INSTRUMENT'S EVIDENTIAL DIRECTION IS SETTLED BY REQUIRING BOTH READINGS,
    NOT BY CHOOSING ONE. Two records in this repository stated opposite consequences for
    the same measurement. The uncommitted draft head said a fake-first-fall-degree
    measurement can CONFIRM Proposition 5 and never REFUTE it; the committed
    DEC-20260913-8d19e5 item (d) said the instrument is a one-directional REFUTER. Read
    against the frozen bytes, each is correct under a different reading of the
    proposition, and THE PAPER DOES NOT FIX WHICH:

      - Proposition 5 is PRINTED as "First fall degree of EQS4(m,R) is bounded by 4
        (p = 2)" (paper_fulltext.md:719), unqualified, which by the paper's own
        Definition 5 (:398) is the TRUE d_F. With Lemma 4's d_F <= d'_F (:510, printed
        without proof, and absent from 2013/549 in either direction per
        DEC-20260913-8d19e5), a measured d'_F <= 4 confirms and a measured d'_F > 4
        refutes nothing.
      - Its only justification, footnote 6 (:844), defers to "the Semaev's case", and the
        passage it defers to (:449-452) describes that argument as yielding "the relation
        that its Fake first fall degree d'_F <= 4". Under the reading its own proof
        supports, Proposition 5 is about d'_F and a measured d'_F > 4 refutes it outright.

    So the campaign adopts a rule that is sound under either reading and costs nothing:
    EVERY REPORTED d'_F CARRIES BOTH CONSEQUENCES SIDE BY SIDE, AND A REPORT THAT PICKS
    ONE FAILS COMPLETION CRITERION 1 HOWEVER THE NUMBER CAME OUT. A measured d'_F > 4 is
    recorded as refuting the fake-degree reading AND as not bearing on the printed
    reading, and that pair is the result. This is docs/inventor-protocol.md section 8's
    quantifier-order audit arriving before compute, which is where it is cheap: the same
    d'_F table supports both sentences, so nothing in the run artifacts would ever have
    exposed a wrong choice.

    (3) THE RANKING PUTS AN INDEPENDENT READ OF (2) AHEAD OF FREEZING ANY CONTRACT. The
    reasoning in (2) was done by ONE reader, and one reader per record is how the
    disagreement arose. It is ranked first because it costs no compute, because an honest
    success criterion for EXP-SEMBIN-4fa22c cannot be written without it, and because if
    the fake-degree reading is the correct one then a d'_F > 4 measurement CONTRADICTS A
    PUBLISHED PROPOSITION and the review of that result falls under core rule 12's
    review-breakthrough tier at max rather than review-adversarial. Freezing the contract
    first would force an additive amendment to a frozen protocol, which is strictly more
    expensive than stating it correctly once. Authoring the hypothesis and contract is
    ranked second, opening the first batch third, and the odd-characteristic control is
    deferred with its sizing arithmetic recorded rather than dropped.
  evidence_refs:
    - DEC-20260913-8d19e5
    - KN-LIT-71b758
    - KN-LIT-c5dceb
    - KN-LIT-ebd657
    - KN-OPEN-7f0511
    - CORR-20260915-b7ca0c
  evidence_refs_note: >-
    NONE OF THESE IS A MEASUREMENT UNDER THIS GOAL, because none exists: the campaign has
    no run, no evidence record, and until now no committed goal. They are the read records
    and the correction this decision rests on. Nothing here is cited as experimental
    support for any statement about a first fall degree.
  completion_criteria_status:
    - criterion: >-
        (4) A committed decision records what 2013/548 and 2013/549 contain that bears on
        Proposition 5, on the basis of a read by an agent that opened them.
      status: MET
      met_by: DEC-20260913-8d19e5
      met_before_this_goal_was_committed: true
      substance: >-
        The Lemma 3 statement 2015/984 declines to prove is present and proved as
        2013/549 Lemma 2, and its "not constructive" caveat concerns witness computation
        rather than the bound. The inequality d_F <= d'_F that the instrument leans on is
        NOT in 2013/549 in either direction and rests on 2015/984's own unproved Lemma 4.
        The disjoint coset factor base is in 2013/548 Section 7, which credits Diem (2009)
        and Matsuo rather than claiming it. THE OMITTED PROPOSITION 5 PROOF WAS NOT FOUND
        IN EITHER PAPER.
    - criterion: (1) matched-pair d'_F answer with its control
      status: NOT MET
      why: No instrument, no contract, no run exists.
    - criterion: (2) whether the analogy in place of Proposition 5's proof transfers
      status: NOT MET
      why: Depends on (1)'s instrument.
    - criterion: (3) the d_F / d'_F / Macaulay-rank map on identical instances
      status: NOT MET
      why: >-
        Partially advanced but NOT met. This decision states the d_F-versus-d'_F half
        from the source's definitions; the criterion additionally requires the map onto
        THIS program's own Macaulay-rank statistic on identical instances, which needs the
        instrument. A definitional reading is not the map.
  deliberately_not_targeted:
    - id: H-SEMBIN-c59e50
      why: >-
        DEC-20260913-8d19e5 recommends an ATTRIBUTION correction to its novelty language
        (the m!-removing device is in 2013/548 Section 7, crediting Diem and Matsuo) and
        explicitly finds that this does NOT trigger a novelty downgrade, because Section 7
        derives no first-fall-degree consequence. That record lives under the parent goal
        GOAL-SEMBIN-5078bc and the correction belongs there, not here. Recorded so it is
        neither lost nor double-worked.
    - id: H-SEMBIN-4a80f3 / EXP-SEMBIN-db9bc3
      why: >-
        Costs Nagao Theorem 1 at the FIPS binary labels and GRANTS Proposition 5 as an
        explicit untested premise. Owned by GOAL-SEMBIN-5078bc BATCH-9d649f and
        cross-referenced rather than re-homed: moving a hypothesis between goals would
        break the parent batch's archive bindings for no scientific gain, which core
        rule 15 makes a last resort.
    - id: GOAL-ICPERF-e6b6a4
      why: >-
        A different ECC campaign, running concurrently on this branch with an executor
        holding the machine for a timing measurement under EXP-ICPERF-e21835. This
        decision is deliberately zero-compute so as not to contaminate those timings, and
        touches none of its records.
  limitations:
    - >-
      ONE READER SETTLED A QUESTION TWO RECORDS ANSWERED DIFFERENTLY. The reading in
      rationale (2) is this Coordinator's, from the frozen text, and it has not been
      independently checked. That is why the both-consequences rule is adopted -- it does
      not depend on the reading being right -- and why an independent check is ranked
      first rather than treated as done.
    - >-
      THE BOTH-CONSEQUENCES RULE IS A REPORTING DISCIPLINE, NOT A RESULT. It makes the
      campaign's eventual claim honest under either reading; it does not make Proposition
      5 more or less likely to hold, and it buys no evidence.
    - >-
      OPENING A GOAL IS NOT PROGRESS AGAINST ANY CRITERION, and this decision claims none
      beyond recording that criterion 4 was already met by a prior committed decision.
      Criterion 4 was met by a READ, and a read is a statement about what two papers
      contain -- not about whether Proposition 5 is true.
    - >-
      THE CAMPAIGN'S CENTRAL MEASUREMENT REMAINS UNBUILT AND ITS BLOCKING IMPEDIMENT
      REMAINS OPEN. IMP-SEMBIN-FCB7A2-DESCENT is recorded on the goal head: no artifact in
      this repository provides the pure-Python Weil descent of S_3 over F_{2^n} at the
      required fidelity. The goal stays active with that impediment recorded, per AGENTS.md
      "Goals are never paused", and the impediment is not evidence about anything.
  what_this_decision_does_not_assert:
    - >-
      NOT that Proposition 5 is true, false, or provable, and not that its omitted proof
      exists anywhere. It asserts only that the source leaves the bounded quantity
      undetermined.
    - >-
      NOT that Lemma 4 is false. It is unproved in 2015/984 and absent from 2013/549;
      unproved is not refuted.
    - >-
      NOT that DEC-20260913-8d19e5 was wrong. Its item (d) is superseded by a rule that
      contains its reading as one of two, and every other finding in it stands.
    - >-
      NOT an approval of any experiment. EXP-SEMBIN-4fa22c does not exist; its identifier
      is reserved. Under the standing user authorization of 2026-09-06 approval follows a
      COMPLETE protocol as a matter of course, and this protocol is not yet written, so
      there is nothing to approve and no user confirmation is being awaited.
    - >-
      NOT any statement about the security of any deployed curve. The FIPS binary labels
      appear in this campaign as parameter labels in a cost table, and a degree measured
      at n <= 44 is evidence about n <= 44.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Nothing here is a validated internal finding. The reading in rationale (2) is a
      single-reader reading of a frozen source and is exactly what the ranked independent
      check exists to test; promoting it to the corpus now would give it an authority it
      has not earned. KN-OPEN-7f0511 already carries the open quantity-conflation problem
      from the parent goal's side, and IDEA-20260913-449d2b is the standing proposal to
      separate the four quantities that share the name "first fall degree" -- this
      decision is further evidence that proposal is worth designing, and it is recorded
      there rather than promoted here.
    revisit_when: >-
      An independent reader confirms or overturns the quantifier reading. If confirmed,
      the d_F / d'_F / Proposition-5 quantifier map is a genuine KN-FIND candidate and
      would discharge half of completion criterion 3.
  next_actions:
    - >-
      Dispatch an independent read of the quantifier question in rationale (2) against
      inputs/NAGAO-2015-984/paper_fulltext.md, blind to this decision's conclusion, and
      have it report which quantity Proposition 5 bounds or that the source does not fix
      it. Zero compute.
    - >-
      Author H-SEMBIN-a7e721 and freeze EXP-SEMBIN-4fa22c under the reserved identifiers,
      carrying the both-consequences reporting rule, the Example 1 fixture the frozen text
      supplies verbatim (:431-444), and the strict-null control (descent of EQS4 at v = 0
      equal coefficient-for-coefficient to the descent of EQS2, an identity under
      Definition 4).
    - >-
      Open the campaign's first batch under a NEW batch identifier once the contract is
      complete; BATCH-efea59 is taken and is not this goal's batch.
    - >-
      Publish the quantifier finding on the agent bus as a POINTER, so any lane measuring
      or citing "the first fall degree" of a descended system learns that the phrase does
      not identify a quantity and that Proposition 5's own reading is undetermined.
  citations:
    - claim: >-
        Proposition 5 is printed over the unqualified "First fall degree" (Definition 5,
        the true d_F), while its only justification defers to a passage the paper itself
        describes over the Fake first fall degree d'_F -- so the bounded quantity is not
        fixed by the source.
      source: >-
        inputs/NAGAO-2015-984/paper_fulltext.md, frozen with sha256 sidecar. Lines relied
        on: 398 (Definition 5), 430 (Definition 6), 449-452 (the Semaev fake-degree
        passage), 510 (Lemma 4), 709 (Definition 8, EQS4 includes S_fe), 719
        (Proposition 5), 844 (footnote 6).
      provenance: retrieved
      verified_by: >-
        coordinator, top-level session on cursor/semaev-2015-audit-program-5b8b,
        2026-09-15, which opened the frozen text and read the cited lines directly. NOT
        independently checked: an independent blind read is this decision's first ranked
        next action precisely because one reader is how the disagreement it resolves arose.
    - claim: >-
        This campaign, and the identifiers H-SEMBIN-a7e721 and EXP-SEMBIN-4fa22c, were
        announced to all lanes on 2026-09-13, which is why those two are reserved rather
        than reallocated.
      source: coordination/bus/messages/MSG-20260913-67d64f.yaml
      provenance: internal
      verified_by: >-
        coordinator, this session, which read the message via tools/agent_bus.py read and
        confirmed both identifiers appear in its refs while neither record exists.
