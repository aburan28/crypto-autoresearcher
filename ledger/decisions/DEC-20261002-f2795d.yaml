    - >-
      Standing user authorization of 2026-09-06 covers approval of the
      cutoff check. The contract names the seven degrees, two routes, and
      a falsification criterion. It does not run a rank simulation.
    - >-
      The counts were computed in this session. That computation is not a
      run. The seven cutoffs sum to 58. The rounded square root exceeds
      the cutoff by 1 at n = 19, 89 and 131. The solver ratios named in
      the proposal were not used as support for this approval.
    - >-
      origin/main was merged into this branch. origin/main was
      4339fab2298f2cf42f818474927c82803d3e4cea. The merge commit was
      e8a7ba699243869f7d7f7a4be92ee5b0a9846b30.
  evidence_refs:
    - ledger/proposals/IDEA-20260926-b11cb1.yaml
    - ledger/decisions/DEC-20260926-901ea1.yaml
  limitations:
