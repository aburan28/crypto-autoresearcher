coordinator_decision:
  id: DEC-20261017-695534
  recorded_at: '2026-10-17'
  decided_at: '2026-10-17'
  decided_by: coordinator
  archived_by: TASK-20261017-96de39
  mode: approval_readiness_governance
  kind: prospective_tooling_correction
  decision: revise
  decision_scope: >-
    Correct the generic self-dependent preapproval readiness rule through a
    separate read-only approvability probe and corresponding contract and skill
    wording. This authorizes tooling and documentation only. It approves no
    experiment, changes no hypothesis, experiment or goal status, admits no
    lane, takes no claim and launches no scientific process. The current
    AGENTS.md gate remains binding until a reviewed replacement is merged.
  target_ids: [EXP-ICPERF-018b0c, GOAL-ICPERF-e6b6a4]
  context: >-
    newest_experiments.py excludes every specification unless status is
    approved, approved_by is nonempty and frozen is true. Its coverage path
    calls experiment_execution.load_plan, which also requires a frozen plan,
    approval, task and queue fields, and an approved or running specification.
    An unapproved experiment therefore cannot satisfy the current AGENTS.md
    requirement that the ordinary selector report ready before approval.
    EXP-ICPERF-018b0c remains review_required with null approval, task and
    queue bindings; its empty selector output expresses exclusion, not an
    implementation readiness judgment.
  rationale:
    - Keep ordinary newest_experiments selection and load_plan, authorize, dispatcher, archive and live-claim guards unchanged.
    - A separate read-only probe may assess exact prospective final bytes before approval; its result grants no execution authority.
    - After a later Coordinator approval and exact archive, the ordinary selector must report ready before dispatch.
    - The probe must include supervisor-generated and declared trial artifact coverage, which the ordinary selector currently does not establish.
  authorized_changes:
    - AGENTS.md
    - .claude/skills/design-experiment/SKILL.md
    - .claude/skills/coordinate/SKILL.md
    - tools/experiment_preapproval.py
    - tests/test_experiment_preapproval.py
    - problems/experiment-preapproval-readiness-cycle.md
    - problems/pr-merge-checks-not-enforced.md
    - problems/README.md
    - coordination/infrastructure/preapproval-readiness-20261017/validation-report.json
    - coordination/infrastructure/preapproval-readiness-20261017/validation-report-v2.json
  acceptance_checks:
    - A complete review_required candidate with prospective frozen specification, trial plan, executor handoff and queue can yield approvable true only from the new probe; ordinary newest_experiments and the runner still refuse unapproved canonical bytes.
    - The probe hashes exact prospective specification and plan bytes, checks queue binding, source/input/binary hashes, committed inputs, run IDs, trial dependencies, GENERATED and trial artifact paths, and a lawful lane route without writing files or running trials.
    - Missing task, queue or approval binding, absent raw-bundle or supervisor artifact, stale hash, invalid lane, or absent execution route yields approvable false with a specific blocker.
    - A synthetic postapproval fixture with exactly the projected bytes yields ordinary ready, while altering a bound byte removes readiness and runtime still requires committed inputs, valid dispatch and a live claim.
    - The focused positive and negative controls pass; selector and supervisor test results introduce no new failure relative to the untouched source baseline. The probe emits approvable, never execution_state ready.
    - The new problem record and index distinguish this cycle from the existing supervisor archive-coverage and full-width measurement problems.
  abort_conditions:
    - An unapproved contract becomes selectable or runnable, or a dispatcher, loader, selector or claim guard is weakened.
    - The probe relies on fabricated approval files, uncommitted source bytes, an unbound queue or a capacity-bypassing lane assumption.
    - Any check launches an experiment or changes a scientific protocol solely to satisfy the governance probe.
  evidence_refs:
    - tools/newest_experiments.py
    - tools/experiment_execution.py
    - experiments/EXP-ICPERF-018b0c/specification.yaml
    - experiments/EXP-ICPERF-018b0c/trial-plan.json
    - problems/ready-plans-lack-supervisor-archive-coverage.md
  citations:
    - {source: tools/newest_experiments.py, provenance: internal, verified_by: coordinator}
    - {source: tools/experiment_execution.py, provenance: internal, verified_by: coordinator}
  official_transitions: {}
  knowledge_promotion:
    promoted: []
    not_warranted: Approval tooling correction only; no scientific evidence.
  approval:
    approved: false
    approved_by: null
    reason: No experiment is approved by this prospective decision.
  limitations:
    - An approvable result is conditional on committing exactly the projected bytes and is not runtime admission.
    - Final archive or postapproval selector refusal stops dispatch and needs a write-once correction.
  next_actions:
    - Archive this prospective decision, its self-archiving Coordinator task and the exact tooling/problem artifacts in one content commit and a verified receipt before treating the correction as operative.
    - Review the scoped probe and contract change through a PR; retain the baseline suite failures and their independent reproduction in the validation report.
    - Only after this rule is merged may a later Coordinator decision assess EXP-ICPERF-018b0c approval under standing authorization.
