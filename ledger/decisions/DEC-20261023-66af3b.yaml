  status_transitions: []
  validity_check:
    expected_run_count: '2 of 2 planned trials present (trial-plan.json), each output_validated, returncode 0, check_returncode 0; 2 of an advisory maximum of 4 runs used.'
    manifests_schema: 'complete for the required artifacts. Custody J1 holds: 18/18 execution-receipt hashes and 20/20 ledger-receipt hashes match (VAL-20261022-a38921 artifact_checks).'
    seed_integrity: 'seeds 20261009 -> RUN-CZLIFT-ac0be5 and 20261010 -> RUN-CZLIFT-8cd006, as planned; 29 curves x 56 rows = 1624 rows per run; no curve duplicated.'
    raw_summary_agreement: 'every recorded metric recomputes exactly from raw-result.json, and an independent correct-series replay reproduces all 3248 rows field for field.'
    control_comparability: 'FAILS. Frozen control C1 fails as written on both seeds and was never evaluated by the checker. Control C2 is vacuous. The "independent checker" imports the producer code path.'
    instrument_fidelity: 'FAILS. The computed lambda is not the specified log_F(z([p]P^)) mod p^6 on the 18 of 29 curves with A != 0.'
    verdict: 'inadmissible: the receipts faithfully record a computation, but not the specified instrument, and a frozen control fails as written.'
  defects:
    - id: D1
      kind: implementation_error
      where: harness/czlift_formal.py, formal_series (frozen sha256 fedf4035554c21c1effe823427a4b2aa4723cca56089e11ff54d962bc3e55030)
      defect: >-
        w is iterated only through z^k (N = k+1). u = Series(w.c[3:] + [0, 0, 0]) then pads u_4..u_6
        with zeros, where the true values are u_4 = A and u_6 = B. As a result u = 1, and log_F = exp_F = z
        mod z^7 on every curve. The true term (2A/5) z^5 of log_F (and -(2A/5) z^5 of exp_F) is missing
        on the 18 of 29 curves with A != 0. Example: D = -11, p = 223, producer coefficient 0, sealed
        blind value 2A/5 mod 223^6 = 73787097714279. The docstring claim "the series are exact mod p^k"
        is false for A != 0.
      evidence: VAL-20261022-a38921 blind_rederivation (result_specification); j3_compare.out.json
    - id: D2
      kind: implementation_error
      where: lambda and the constructed point P~ in experiments/EXP-CZLIFT-7c8d73/implementation/run.py (via D1)
      defect: >-
        The computed lambda differs from the true log_F(z([p]P^)) at valuation exactly 5 on 280 rows per
        seed (all e = 1 non-split rows). The constructed P~ is the identity-series construction. On e = 1
        curves it is p-torsion only to z-valuation 6 (716 and 715 rows), so it passes the precision-5
        verification and would fail at precision 7. No recorded flag changes, because the defect lies
        below the verification precision. The specified instrument was therefore never exercised.
      evidence: VAL-20261022-a38921 metric_recomputations (independent_replay)
    - id: D3
      kind: specification_error
      where: control C1 of experiments/EXP-CZLIFT-7c8d73/specification.yaml; run.lift_classes
      defect: >-
        "pert_p (non-split) must never yield a construction" fails as written on both seeds: 8 pert_p
        constructions per seed (seed 20261009: p = 17, D = -67, rows 24..31; seed 20261010: p = 223,
        D = -11, rows 24..31). Both lifts are genuinely split: exact v_p(j - j_cm) = 2 = 2e, because
        j_A r1 + j_B r2 = 0 mod p. That happens with probability about 1/p for e = 1 pert_p draws
        (expected 0.478 per seed). The constructions on them are correct (p-torsion to z-valuation >= 21
        by the validator's own construction). The class label is wrong, and the control's premise is
        false for those draws.
      evidence: VAL-20261022-a38921 control_checks C1 and proves_too_much
    - id: D4
      kind: implementation_error
      where: experiments/EXP-CZLIFT-7c8d73/implementation/check.py
      defect: >-
        The checker never evaluates C1. Its C2 test (exp_F(log_F(z)) == z at one point) cannot fail: the
        producer's series are the identity, which is self-inverse, and a reversion is inverse by
        construction in any case. Its re-run subset (D = -3, p = 7 and 19) contains only A = 0 curves, where
        mu_6 symmetry masks D1. It imports run.measure_curve and run.summarize, so it is a replication of the
        producer path, not an independent checker. No additivity test exists, although its comment claims
        one.
      evidence: VAL-20261022-a38921 control_checks C2, invalidation rule, independence
    - id: D5
      kind: specification_error
      where: success criterion and metric definitions
      defect: >-
        Two primary metrics cannot fail as defined and implemented. (a) nonsplit_with_construction =
        #(v_log = 1 and constructed): the recorded rows satisfy constructed == split == (v_log >= 2) on
        all 1624 rows per seed, so the construction is attempted only when v_log >= 2 and the count is
        structurally zero. (b) construction_verified_rate at precision 5 cannot distinguish the specified
        series from the identity series (D2). The success criterion is therefore met by a defective
        instrument.
      evidence: VAL-20261022-a38921 metric_recomputations (definitions, independent_replay)
    - id: D6
      kind: specification_error
      where: decision_impact.on_positive
      defect: >-
        The validator reports that v_p(log_F(z)) = v_p(z) on E1 for p > 2. If so, the series split flag
        equals EXP-CZLIFT-17b7eb's z-valuation reading whether or not the series is correct, and
        "EXP-CZLIFT-17b7eb's rule gains an independent instrument" cannot be earned by rule_agreement. Only
        a construction verified at a precision where the series terms matter is series-dependent. This is
        an observation outside the validator's joints. It is recorded here as a design defect, not as
        an interpretation of results.
      evidence: VAL-20261022-a38921 limitations (interpretation observation)
    - id: D7
      kind: scope_note
      where: harness.czlift.anomalous_cm_curves(1500)
      defect: >-
        The family omits the class-number-one non-maximal order of discriminant -27 (j = -12288000), which
        has anomalous curves at p = 7, 61, 331, 547. The frozen family is still the 29 curves the
        specification names. A successor must either include them or state their exclusion.
      evidence: VAL-20261022-a38921 limitations; scope_check_d27.out.txt
  superseding_contract_must:
    - 'Code fix (D1, D2): compute w through at least z^(k+3) before forming u = w/z^3, so that u is exact mod z^(k+1). State the series precision per curve with k < p, so that every coefficient has unit denominators. The z^7 coefficient 3B/7 is not 7-integral, so p = 7 curves are excluded or capped. Add regression tests: the z^5 coefficient equals 2A/5 on A != 0 curves against the sealed values of VAL-20261022-a38921; mu_6 symmetry on A = 0; additivity of log_F on E1(Q_p) by an independent chord law.'
    - 'Verification precision (D2, D5b): verify [p]P~ = O at a precision strictly above the first A-dependent term (z-valuation >= 7 on e = 1 curves, with stated margin), so that the identity-series construction fails it.'
    - 'Control wording (D3): define the non-split class so that it is non-split by construction. Either label each lift by the j-rule (v_dj = 2e - 1 exactly for e = 1, v_dj = 3 for e = 3), or resample pert_p until j_A r1 + j_B r2 != 0 mod p and record every rejected draw. The checker evaluates C1 on raw-result.json as written.'
    - 'Criterion that cannot fail (D5a): attempt the construction on every row, non-split rows included, and count verifications, or replace the metric with the PTM-1 signature (z([p](P^ + U)) has valuation exactly 1 for every attempted U on a genuine non-split lift). Replace the inverse check C2 with an additivity check and a coefficient check against an independently derived series.'
    - 'Same-shape null: run the known-wrong series (the identity series, which is the current defect, and z + z^3/3) through the identical pipeline on the same curves and samples. It must fail additivity and the raised-precision torsion verification on the A != 0 rows. This is a pre-registered negative control, not a tuned threshold.'
    - 'Independent checker (D4): it must not import run.py or harness/czlift_formal.py. It derives the series independently (for example the Silverman AEC IV recursion over Q[A, B]), and its re-run subset includes A != 0 curves.'
    - 'Replication: the two seeds stay as independent instances of the sampling. In addition, the replication instance must exercise a different series precision (two values of k), so that agreement is not an artifact of one truncation.'
    - 'Decision impact (D6): drop "independent instrument for EXP-CZLIFT-17b7eb''s rule", or restrict it to the raised-precision construction witness. State what on_positive and on_negative change.'
    - 'Scope (D7): include the D = -27 curves (p = 7, 61, 331, 547, subject to the k < p rule) or record their exclusion in out_of_scope.'
    - 'Version and supersession: a new experiment id (or a v2 with a versioned amendment under experiments/EXP-CZLIFT-7c8d73/amendments/) that names EXP-CZLIFT-7c8d73 v1 as superseded. Source hashes are re-frozen. Approval requires tools/experiment_preapproval.py approvable: true (AGENTS.md "Approval is bounded by execution").'
  observation_decision_citation_limits:
    record: DEC-20261009-44c288
    fields: [criterion_readings.EXP-CZLIFT-7c8d73]
    may_no_longer_be_cited_for:
