  decision_scope: >-
    One action: the run set of EXP-CZLIFT-7c8d73 is ruled inadmissible as evidence and returned.
    The value "pause" is used because it is the only value in both the template schema
    (templates/research-records.md, "Coordinator decision") and the skill's transition list that
