    (goals are never paused; AGENTS.md); the blocked item is this one claim's review. No run is
    authorized, nothing is promoted, and the recorded runs are not edited. The frozen v1 contract
    is not amended in place. A successor is a new, versioned, superseding contract approved by a
    later decision.
  target_ids:
