      - 'The reading "the formal-series instrument agrees with the j-distance rule on every sample". The series computed was the identity mod z^7, not log_F.'
      - 'The reading "on every split sample the explicitly constructed p-torsion lift verifies by curve arithmetic". The construction verified at precision 5 is the identity-series construction, which is not a p-torsion lift beyond z-valuation 6 on e = 1 curves.'
      - 'The reading "non-split lifts never admit one". It is structurally zero (D5a), and the pert_p label includes two split lifts (D3).'
      - 'by_class_frac_split pert_p = 0.017241379310344827 as a non-split rate. The 8 rows per seed are mislabelled split lifts.'
      - 'Any statement that EXP-CZLIFT-17b7eb''s rule has an independent instrument.'
    still_records: >-
      That the two trials ran under the frozen plan, with the receipts and numbers shown. Those numbers
      are reproduced exactly by validation as outputs of the code as written, and remain observations of
      that code only. DEC-20261009-44c288 is not edited; this field supersedes its use, not its text.
  rationale:
    - 'Validity before interpretation (coordinator contract, responsibility 6; skill step 2). Custody is exact, and every number reproduces. But a frozen control fails as written (C1), the checker evaluates neither C1 nor any non-vacuous form of C2, and the load-bearing quantity is not the specified quantity on 18 of 29 curves (J3, against the specification''s curve family). An output_validated receipt certifies a computation, not the specified instrument.'
    - 'The defects are implementation and specification errors (agents/executor.md failure semantics), not negative observations. Under AGENTS.md core rule 5 they say nothing against H-CZLIFT-d3dc4b. The validator''s full correct-series replay reproduces every recorded flag, but that replay is a verification and not a run record. Citing it as the result would repair a run set in prose, which is forbidden.'
    - 'The success criterion is not informative as frozen: nonsplit_with_construction is structurally 0, and precision-5 verification is blind to the defect. A re-run of the same contract with only the code fixed would therefore still not test the claim. A superseding contract is required, not a replication.'
    - 'No evidence record and no hypothesis transition: the skill stops at an invalid run set. No refutation artifact is sought, because no adverse call is made.'
