coordinator_decision:
  id: DEC-20261005-92a50c
  context: >-
    Design tick on 2026-10-05. origin/main was fetched and this
    branch was created at d25816800a. That tip indexes an external
    coordinate-orbit packet and allocates no idea identifier.
    IDEA-20261004-a09dd4 already has a contract for three static
    compilers. It does not contain the walk transition matrix the
    proposal names.
  decision: approve
  target_ids:
    - IDEA-20261004-a09dd4
    - H-SSI-8d940f
    - EXP-SSI-435a2c
  rationale:
    - >-
      SSI is an ECC area. The contract runs a multiplicity-weighted
      Phi_2 walk on the supersingular sets at primes 7, 11, and 19
      for times 0, 1, and 2.
    - >-
      A design-session count, not a run, gave total variations
      0, 0, 0; 0, 1/6, 1/18; and 0, 1/6, 1/6. Both Phi_2 formulas
      must recompute them.
    - >-
      Standing user authorization of 2026-09-06 covers approval.
      The protocol fields required before dispatch are filled.
    - >-
      The three-compiler contract is not edited. The external
      packet is not assigned an identifier here.
  evidence_refs: []
  limitations:
    - The chains have one or two states.
    - At p=19 the two rows are identical, so time 2 copies time 1.
    - Approval authorizes six deterministic runs. It does not assert the distances.
  next_actions:
    - >-
      Snapshot-archive this contract. Do not launch
      TASK-20261005-8b204b until the receipt verifies.
  knowledge_promotion:
    promoted: []
    not_warranted: Approval of an unrun contract. No finding is promoted.
  decided_by: coordinator
  decided_at: '2026-10-05'
