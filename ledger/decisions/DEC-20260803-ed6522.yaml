coordinator_decision:
  id: DEC-20260803-ed6522
  goal_id: GOAL-MLKEM-003
  batch_id: BATCH-010
  evidence_id: EV-MLKEM-eac95b
  recorded_by_task: TASK-20260803-87681a
  archive_kind: ledger
  recorded_at: '2026-08-03'
  decision: weaken
  decision_label: exponent_control_adverse_but_family_misspecified_overprediction_unattributed

  context: >-
    DEC-20260802-359eca opened BATCH-010 to run the two discriminating controls
    the BATCH-009 shape comparison lacked. TASK-20260803-f95b4e produced them
    with zero new sampling and was snapshot-archived at be7ed9e3.
    TASK-20260803-e9709a returned ADMISSIBLE_WITH_DEFECTS after re-deriving the
    model independently, and contributed a control neither the producer nor this
    Coordinator had asked for.

  central_adjudication: >-
    THE CONTROL CAME BACK ADVERSE, AND THEN THE VALIDATOR SHOWED THE ADVERSE
    READING WAS STILL TOO GENEROUS. Check A is one-sided: neither archived file's
    own Approximation-4.9 exponent minimises rms against its own data, and the
    displacement survives an independent re-derivation and every low-noise
    weighting. The obvious conclusion -- that a neighbouring exponent is the
    right one -- is WRONG, and the validator's identifiability control is what
    rules it out: on noiseless data regenerated from the model itself the scan
    recovers the generating exponent exactly, and a 2.75 shift costs 0.535 bits,
    yet the best achievable rms on the real data is 0.426 bits rather than 0. No
    member of the family fits well. `weaken` is the disposition that fits: the
    fitted-exponent claim is weakened at toy scale on the tested files, and
    nothing stronger is available on one execution with one review.

  what_is_established:
    - >-
      Check A is adverse and reproduces three ways (producer, Coordinator from
      the raw curves, validator by an independent implementation): argmin p=23.25
      against own 26.0 for n=43, and 22.25 against own 24.5 for n=50, both
      interior, both unimodal.
    - >-
      The displacement is not an estimator artifact. The identifiability control
      recovers the generating exponent exactly on model-generated data.
    - >-
      The correct description is a MISSPECIFIED FAMILY whose least-bad member
      sits lower, not a corrected exponent, because the best achievable rms is
      0.426 bits rather than 0.
    - >-
      Check B's careful claim is correct: concavity fixes only the SIGN. The
      finite two-sided bound comes from P_in >= Q(T), a different fact, and is
      nearly vacuous.

  what_is_not_established:
    - >-
      That the BATCH-009 over-prediction is the implementation's min(1,.)
      collapse. It is not excluded and not supported: the textually motivated
      reading at the only archived alpha accounts for 0.31 and 0.27 percent of it.
    - >-
      That Approximation 4.9 is refuted. This is a fit statement about two
      archived toy-dimension curves under a fitted normalisation, and the deep
      tail supplies a genuine counter-instance where the own exponent IS the
      argmin.
    - >-
      Anything about ML-KEM security, Carrier et al.'s Kyber cost figures, or
      their headline shortfalls.
    - >-
      Anything that changes EV-MLKEM-011, EV-MLKEM-013 or EV-MLKEM-017.

  weighing_of_the_review: >-
    Accepted in full, including where it corrects the producer AND where it
    corrects the framing this Coordinator wrote into the handoff.
    (1) D4 IS THE BATCH'S MOST IMPORTANT CONTRIBUTION AND IT CAME FROM THE
    VALIDATOR. My handoff asked whether a neighbour wins. It did not ask whether
    ANY member fits, which is the question that determines what "a neighbour
    wins" is worth. The identifiability control answers it and converts an
    apparently clean adverse result into a more accurate and less quotable one.
    (2) D5 IS ACCEPTED AND STRENGTHENS THE RESULT: six weightings instead of one,
    with every low-noise weighting pushing the argmin further below.
    (3) O-4 IS RECORDED PROMINENTLY BECAUSE IT CUTS AGAINST THE BATCH. On the
    deep tail the n=43 own exponent IS the argmin. The package did not report it;
    the validator did. Its region is also the least informative, but a
    counter-instance is recorded where a reader will find it, not buried.
    (4) D7 IS MATERIAL AND CHANGES THE QUESTION. (4.18) defines D with the d_lsc
    integral INSIDE, which neither BATCH-009 nor BATCH-010 noticed. The source is
    internally inconsistent on exactly the point Check B examines, so the
    collapse may be a SOURCE defect rather than an implementation one. That is a
    different finding from the one BATCH-010 set out to test.
    (5) D3 IS ACCEPTED: the log2 K linearity is real but the inference from it is
    a non sequitur, since the parameterisation forces linearity regardless.
    (6) D1/D2 ARE ACCEPTED AS PROVENANCE DEFECTS, and see the DEV-1 ruling below.

  ruling_on_DEV_1: >-
    THE FAULT IS THE COORDINATOR'S, NOT THE EXECUTOR'S. My handoff declared
    exactly four artifact paths for a task that produces measurements, without
    declaring the runs/<RUN-ID>/ package layout docs/evidence-and-reproducibility.md
    requires. The executor faced two binding rules in conflict, refused the scope
    expansion, and disclosed -- which is the correct order of operations. But the
    validator is right that DEV-1 explains the missing DIRECTORY and not the
    missing FIELDS: commit sha, dirty state, command, inference block,
    determinism, memory, stderr and validity status are absent from the JSON the
    handoff did declare, and memory, stderr and validity appear nowhere at all.
    That gap is carried into EV-MLKEM-eac95b as O-8 and is retired for THIS
    result only by the validator's independent re-derivation. Binding prospective
    repair: any future measurement handoff in this goal declares the run-package
    layout explicitly or declares the provenance fields inside its own artifacts.

  hypothesis_status_changes: []
  hypothesis_status_note: >-
    No hypothesis moves. H-MLKEM-011 concerns the coverage statistic, not the
    functional form of Approximation 4.9, and this batch measured the latter.
    H-MLKEM-010 and H-MLKEM-013 are untouched. The `weaken` disposition attaches
    to the batch's own fit claim, recorded in EV-MLKEM-eac95b, not to a
    hypothesis record.

  rule_12_status: >-
    UNMET AND UNWAIVED, and this decision does not waive it. The misspecification
    reading in O-2 would, if promoted, bear on how EV-MLKEM-011's and
    EV-MLKEM-013's statistics are read; that routes to independent
    review-breakthrough at max, exactly as DEC-20260802-15cadd established and as
    CORR-20260802-d8ba0e recorded against this branch for getting it wrong once
    already.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      `weaken` on `preliminary` evidence fails the promotion gate, which needs
      `support` or `reject_scoped` at `replicated` or `strong`. Independently:
      the one result worth promoting -- that a fitted-normalisation shape
      agreement can hide a misspecified family, and that the identifiability
      control is what exposes it -- rests on a single execution with one
      validator and no red-team pass, and it has a live counter-instance in the
      tail (O-4). Promoting it now would repeat CORR-20260802-d8ba0e exactly.
    promote: false

  non_claims:
    - ML-KEM is not broken.
    - KN-OPEN-016 remains open.
    - >-
      Approximation 4.9 is neither validated nor refuted; this is a scoped fit
      statement about two archived toy-dimension curves.
    - >-
      No asymptotic claim advanced; none of the four promotion gates is engaged.
    - No closure quorum is asserted. GOAL-MLKEM-003 stays active.

  next_actions:
    - >-
      BATCH-011, zero new sampling, two tasks. FIRST, resolve D7 by reading
      (4.18) against (4.22) in the archived text and stating whether the source
      defines D with the d_lsc integral inside or outside -- this decides whether
      the min(1,.) collapse is a defect of the implementation or of the source,
      and it is prior to any further work on Check B. SECOND, run the red-team
      pass this batch never had, against the misspecification reading
      specifically: the strongest case that the 0.426-bit floor is an artifact of
      the fitted-normalisation protocol or of the resolved band rather than
      evidence that the family is misspecified, plus the cheapest check that
      would settle it. Do not promote anything until that pass exists.

