    named_obstruction: >-
      The comparison protocol fits the normalisation to the compared data, so it
      cannot separate a wrong exponent from a wrong family; the identifiability
      control shows the family is the binding problem, and no exponent in the
      window repairs it.
    forward_guidance: >-
      Settle the (4.18) versus (4.22) source inconsistency first, then red-team
      the misspecification reading before any promotion. Both zero new sampling.

