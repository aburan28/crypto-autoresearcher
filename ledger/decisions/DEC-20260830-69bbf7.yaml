    - ledger/decisions/DEC-20260724-003.yaml
    - knowledge/techniques/KN-TECH-002.md
    - knowledge/techniques/KN-TECH-007.md
    - ledger/decisions/DEC-20260830-680f6d.yaml
    - knowledge/open-problems/KN-OPEN-73f0f4.md
    - ledger/goals/GOAL-ECDLP-001/goal.yaml (preadmission_degree_provenance_derivation_terminal_note_20260830)

  limitations:
    - "Zero-compute analytical/code-reading verification, not a machine-checked proof or executed experiment."
    - "This decision does not itself determine whether the one-pair or two-pairs reading is correct; it names the ambiguity as unresolved and, on the evidence found, tilts against assuming the matching (one-pair) reading by default."
    - "The RT103-O1/RT103-C1 gap-tracing is as thorough as the archiving Coordinator's corpus access allowed; it is possible an undiscovered artifact elsewhere supplies the missing definition, though none was found in H-CREP-001's own lineage (IDEA-20260723-001, TASK-20260722-101/103)."

  knowledge_promotion:
    promoted:
      - KN-OPEN-de67f0
    not_warranted: >-
      No KN-FIND is created: per AGENTS.md, KN-FIND promotion requires an
      EV-* evidence record at replicated/strong strength backing a
      support/reject_scoped decision; this is an idea-generator
      zero-compute derivation plus a Coordinator corpus-provenance trace,
      and H-CREP-001's status is unchanged. KN-OPEN-73f0f4 is superseded by
      KN-OPEN-de67f0, which names the specification gap (RT103-C1, never
      discharged since 2026-07-22) as the primary blocker, with the
      Theta(B^2)/Theta(B^4) reconstruction ambiguity recorded as a named
      downstream consequence rather than the root cause.

  next_actions:
