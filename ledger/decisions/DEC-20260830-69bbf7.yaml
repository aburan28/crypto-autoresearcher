coordinator_decision:
  id: DEC-20260830-69bbf7
  recorded_at: '2026-08-30'

  target_ids:
    - GOAL-ECDLP-001
    - H-CREP-001
    - EXP-CREP-001

  decision: revise
  decision_label: degree_provenance_derivation_accepted_with_corrected_scope_and_named_specification_gap

  context: >-
    Closes TASK-20260830-4e51b2's independent review of TASK-20260830-06afa2
    (idea-generator), the degree-provenance derivation dispatched by
    DEC-20260830-680f6d and KN-OPEN-73f0f4. Full findings recorded in
    preadmission_degree_provenance_derivation_terminal_note_20260830 on
    ledger/goals/GOAL-ECDLP-001/goal.yaml.

  decision_scope: >-
    ACCEPTS the mathematical content of the producer's reconstruction as
    careful and independently verified: Semaev's S_3 relation degree-2-
    per-variable was independently re-derived by hand expansion and
    confirmed against knowledge/techniques/KN-TECH-002.md; the resultant
    degree-multiplication logic was correctly applied; the B=1 and
    two-conics controls are genuine at the narrow scope they actually
    claim. REJECTS reading the producer's own genuine_elimination_confirmed
    disposition as resolving KN-OPEN-73f0f4 for H-CREP-001's actual
    mechanism. Independent full reading of ledger/hypotheses/H-CREP-001.yaml
    confirms it supplies exactly one compound sentence of mechanism and no
    formula for r_R -- only that z_R = gcd(g_I, r_R) and that r_R "vanishes
    at a label exactly when that fifth occurrence extends to a labelled
    pair-pair relation," with no named technique and no specification of
    how many decks are folded or how. Tracing this gap further back found
    it is not new: coordination/goals/GOAL-CRYPTO-001/batches/BATCH-001/tasks/TASK-20260722-103/red_team_report.yaml,
    the original 2026-07-22 red-team review of this exact obligation,
    already raised this precise underspecification as objection RT103-O1
    (severity blocking_before_constructor_review): "'Complete-chart
    intersection resultant' is an untyped macro here... not yet scoped
    tightly enough to distinguish a compact constructor from construction
    of the wrong support object," with a required control RT103-C1
    demanding a self-contained definition of g_I, r_R, z_R, charts,
    saturations, multiplicities, and strata, plus a proof of exact support.
    ledger/proposals/IDEA-20260723-001.yaml (H-CREP-001's own source
    proposal) adds no further mechanism detail. ledger/decisions/DEC-20260724-003.yaml
    records NO_ADMISSIBLE_CONSTRUCTION failing at a DIFFERENT requirement,
    never affirmatively closing RT103-C1. This gap was never discharged
    before H-CREP-001 was approved and EXP-CREP-001 was frozen -- it was
    carried silently through every subsequent layer, including the entire
    thirteen-round trigger-search chain and the two prior derivation
    rounds this closes out. The correct citation of this round's
    disposition going forward is: genuine_elimination_confirmed for ONE OF
    TWO EQUALLY COHERENT, UNADJUDICATED reconstructions of an
    underspecified mechanism -- never as confirmation of H-CREP-001's real
    degree. This Coordinator additionally finds the producer's preferred
    one-pair/Theta(B^2) reading is, if anything, the LESS literal fit to
    the primary source's symmetric naming of both named decks versus the
    two-pairs/Theta(B^4) alternative the producer disclosed but did not
    prefer, and that the one-pair reading was partly selected because it
    matches the pre-existing declared figure rather than from an
    independent derivation excluding the two-pairs case.

  what_this_decision_does_not_do:
    - It does not change H-CREP-001's status (remains approved).
    - It does not change EXP-CREP-001's specification (remains frozen, unmodified).
    - It does not admit any B71, batch, experiment, or implementation.
    - It does not claim the Semaev reconstruction is wrong, only that it is unconfirmed as H-CREP-001's actual mechanism.
    - It does not itself amend, repair, or supply the missing r_R definition -- inventing a missing result is prohibited under AGENTS.md; discharging RT103-C1 is named as the next concrete action, not performed here.

  non_claims:
    - This is not evidence that H-CREP-001's underlying construction obligation is misconceived; it is a corrected assessment of how much this round's reconstruction should be trusted as answering the degree-provenance question.
    - Finding a specification gap open since 2026-07-22 is not evidence of bad faith by any prior round or session; it is evidence the gap has been structurally invisible to corpus-reading-based approaches, which is exactly why a different kind of task (explicit specification, then independent review) is recommended next rather than a further inference round.
    - This does not retroactively invalidate DEC-20260830-6f28e0's or DEC-20260830-680f6d's own findings, which concern the frozen EXP-CREP-001 engine's actual, as-built behavior (a well-defined object regardless of H-CREP-001's underspecification) rather than H-CREP-001's abstract mechanism.

  rationale:
    - "Every load-bearing mathematical claim in the reconstruction (KN-TECH-002's S_3 degree, the resultant-degree-multiplication bound, the B=1 and nearby-object controls) was independently re-derived or re-checked by the archiving Coordinator, not accepted from the producer's prose, and held up exactly at the scope claimed."
    - "H-CREP-001.yaml was independently read in full and confirmed to lack a formula for r_R; tracing this further back to the original red-team report found the identical gap was already named as a blocking objection at this obligation's inception on 2026-07-22 and never closed -- a more fundamental finding than the producer's own framing disclosed, and arguably the headline result of this entire investigation chain."
    - "The Theta(B^2)-vs-Theta(B^4) disagreement is a full exponent-squared gap, not a minor completeness issue, and the more literal reading of the one extant primary-source sentence plausibly favors the non-matching answer -- this materially changes how the disposition label must be cited going forward, from an unconditional confirmation to a conditional one."

  evidence_refs:
