    - Dispatch a Coordinator-authored, explicitly-scoped hypothesis-precision task to draft an explicit, self-contained candidate definition of r_R discharging TASK-20260722-103's RT103-C1 (g_I, r_R, z_R, charts, saturations, multiplicities, strata, and a proof of exact support), submitted for independent validator/red-team review before further degree-provenance work proceeds.
    - If no such definition can be produced or agreed upon within a bounded effort, record KN-OPEN-de67f0's question as blocked on hypothesis specification rather than continue pursuing it by further reconstruction.

