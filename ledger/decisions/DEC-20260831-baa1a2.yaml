      verification, and the process deviation. content_first is the same binding
      mode the DEF-3 repair's own snapshot used for a self-referential receipt;
      here it additionally covers the source bytes preexisting the receipt,
      which is exactly the case the mode exists for.
    - >-
      No other task state, dependency, write_scope, budget, review chain, or
      claim tier changed. The red-team (TASK-20260810-1166f2), validator
      (TASK-20260810-9fc65d), producer (TASK-20260810-d8835b,
      TASK-20260810-2a0a37), snapshot (TASK-20260810-1a81be) and ledger archive
      (TASK-20260810-9f661a) tasks remain queued and untouched.
