    and a receipt-only commit fails the default exact-diff check. The 2026-08-30
    policy block (reasoning_effort max, degraded_allowed false; then no backend
    could serve it) is CLEARED as of this session: `orchestration.adapter doctor
    --probe` shows the openai backend serving gpt-5.6-terra, which binds
    coordinator-orchestration-code at max_reasoning_effort max. Re-running the
    producer task was rejected as an option: its artifacts exist, are merged,
    and are immutable; producing them again is impossible under refuse-overwrite
    and pointless as evidence.
