      papered over; the bytes themselves were never in doubt (the DEF-3
      precedent: what failed is the QUEUE'S MODEL, not the archive).
    - >-
      TASK-20260810-f7bc82 set to `completed` with archive.binding_mode
      content_first: the task committed only its own self-neutral snapshot
      receipt at 96bfe78d313d29ad7f73f5870e9af5c1bc9b3e05 (parent
