coordinator_decision:
  id: DEC-20260914-8374d8
  context: >-
    FOLLOW-UP to the DEC-20260914-37e0d9 / DEC-20260914-bb1dbe / DEC-20260914-d471ce
    / DEC-20260914-04d16a chain. DEC-20260914-04d16a released TASK-20260909-ece919
    with a fresh claim. The dispatching session genuinely claimed it (epoch 2, live,
    published, visible via origin refs) and launched the frozen stage0 trial for
    real: `sage -python experiments/EXP-FROB-d8aa37/stage0/driver.py --run-dir
    .../runs/RUN-FROB-2404fa` via `tools/experiment_execution.py run`. The trial
    genuinely executed -- 376,232 real records, 54MB written to roots.jsonl.gz,
    deep into the calibration-cell sweep -- when it was killed by an EXTERNAL
    `timeout 580` the dispatching session wrapped around the launcher out of its
    own caution about tool-call duration. dependencies.json.required_runtime.watchdog_seconds
    and trial-plan-stage0-v2.json's own watchdog_seconds are both null -- no
    cutoff was ever supposed to apply. This was self-inflicted tooling, not an
    infrastructure or protocol failure, and is disclosed as such. The resulting
    interrupted receipt (status "interrupted", returncode null, truncated
    roots.jsonl.gz/tuples.jsonl.gz retained verbatim, the other 6 of 16
    deliverables correctly absent) is already committed on main (PR #1189,
    merged) at experiments/EXP-FROB-d8aa37/runs/RUN-FROB-2404fa/. Consequence:
    tools/experiment_execution.py's own directory semantics (directory.mkdir(),
    exclusive create, no exist_ok) mean RUN-FROB-2404fa -- the ONE run_id
    trial-plan-stage0-v2.json names -- can never be retried.
    `tools/experiment_execution.py status --plan
    experiments/EXP-FROB-d8aa37/trial-plan-stage0-v2.json` reports
    "needs_reconciliation" for this trial, confirmed by the dispatching session.
    Per AGENTS.md/CLAUDE.md, "changing a frozen scientific protocol uses an
    additive amendment; never rewrite historical records." This decision is that
    amendment: it mints and authorizes a fresh run_id and trial plan so a proper,
    unbounded, backgrounded retry can happen, without editing any existing
    committed record.

  decision: amend
  target_ids:
    - EXP-FROB-d8aa37
    - RUN-FROB-2404fa
    - RUN-FROB-3c0b8f
    - TASK-20260909-ece919
    - TASK-20260914-0a026a
    - BATCH-2f8435
    - RQ-FROB-7d8dd4
    - H-FROB-73df22

  the_decision_stated_plainly: >-
    A FRESH, ADDITIVE trial plan (experiments/EXP-FROB-d8aa37/trial-plan-stage0-v3.json)
    is authored and approved, naming run_id RUN-FROB-3c0b8f under a fresh handoff
    (ledger/handoffs/TASK-20260914-0a026a.yaml) and a fresh run-binding
    (coordination/frobenius/BATCH-2f8435/admission/run-binding-successor-20260914-8374d8.json)
    that points the new plan/run_id at the SAME still-valid runtime admission
    DEC-20260914-d471ce already established (linux-runtime-lock-successor-20260914-c85f6a.json,
    scientific_launch_authorized true, unedited and unchanged by this record). v3
    is byte-identical to v2 in every scientific respect -- same specification,
    same specification_sha256, same four source_sha256 values, same argv/check_argv
    shape, same memory_mb -- and differs only in run_id, task_id, and a newly
    authorized watchdog_seconds of 86400 (24h), sized generously above the only
    real duration signal available (RUN-FROB-2404fa was still progressing
    normally at ~578s when externally killed) and justified below as machine
    protection, not a scientific change. None of trial-plan-stage0-v2.json,
    specification-stage0-v2.yaml, TASK-20260909-ece919.yaml, or the interrupted
    RUN-FROB-2404fa receipt is edited, moved, or renamed; all remain exactly as
    committed. This decision approves the amendment and its artifacts; it does
    not itself claim or launch anything (this coordinator has no shell), and the
    exact next steps are handed to the dispatching session below.

  rationale:
    - >-
      THE INTERRUPTION IS INFRASTRUCTURE/TOOLING SIGNAL, NEVER NEGATIVE
      MATHEMATICAL EVIDENCE. AGENTS.md core rule 5 and CLAUDE.md rule 3 apply
      directly and are read here exactly as DEC-20260914-37e0d9 read an expired
      cloud lease under the same rules: the loss of RUN-FROB-2404fa to an
      external `timeout 580` says nothing whatsoever about H-FROB-73df22, about
      RQ-FROB-7d8dd4, or about whether Frobenius structure moves the
      index-calculus exponent. No hypothesis status moves here; H-FROB-73df22
      stays `proposed`. No experiment status moves here; EXP-FROB-d8aa37 stays
      `approved` with execution_authorized true. The 376,232 real records
      already written and committed in RUN-FROB-2404fa's truncated
      roots.jsonl.gz are retained verbatim as partial, honestly-labeled
      "interrupted" output -- not discarded, not silently repaired, not
      promoted to a completed observation.
    - >-
      WHY THE FAILURE IS GENUINELY SELF-INFLICTED TOOLING AND NOT A PROTOCOL
      GAP. This coordinator read specification-stage0-v2.yaml's own
      stopping_rules directly: "No watchdog unless a future explicit
      machine-protection amendment; current watchdog_seconds=null." The frozen
      protocol anticipated exactly this situation and left the door open for
      precisely the amendment this record makes. It did not authorize, and
      nothing in TASK-20260909-ece919's constraints authorized, an external
      `timeout 580` wrapper around the adapter invocation. The interruption
      therefore falls entirely outside the frozen protocol's own contemplated
      failure modes and is correctly attributed to the dispatching session's
      tool-call-duration caution, not to the trial plan, the driver, the
      specification, or any scientific control.
    - >-
      WHY A FRESH RUN_ID AND TRIAL PLAN ARE STRUCTURALLY REQUIRED, NOT A
      CHOICE. This coordinator read tools/experiment_execution.py's own
      directory-creation semantics as reported (exclusive create, no
      exist_ok=True) and confirmed against the "needs_reconciliation" status
      report and the DEC-20260909-4dd8dd precedent, which already states the
      same rule for this identical run_id in a prior, unrelated interruption:
      "any retry requires new RUN ID and prospective authority, no existing
      directory reuse" (specification-stage0-v2.yaml's own stopping_rules,
      third bullet). RUN-FROB-2404fa's directory exists and is permanently
      occupied by the committed interrupted receipt. No amendment can make it
      retryable; only a fresh run_id can.
    - >-
      WHY A FRESH HANDOFF RATHER THAN AN ADDITIVE FIELD ON TASK-20260909-ece919.
      This coordinator read TASK-20260909-ece919.yaml in full: its
      write_scope and artifact_paths are a closed, exact 16-path list keyed
      character-for-character to runs/RUN-FROB-2404fa/. An executor launching
      against RUN-FROB-3c0b8f under that handoff would write outside its
      declared write_scope, which is exactly the violation AGENTS.md's write-scope
      discipline exists to prevent. The task's own text further states plainly,
      per its own constraints, that "changing a frozen scientific protocol uses
      an additive amendment; never rewrite historical records" -- editing
      TASK-20260909-ece919.yaml's write_scope in place would be exactly that
      rewrite, since the record is already committed and its bytes already
      govern the completed (interrupted) RUN-FROB-2404fa attempt. A sibling,
      additive handoff -- TASK-20260914-0a026a -- is the only shape that adds
      the needed write_scope without touching the old one. This mirrors the
      established pattern in this exact lane: DEC-20260914-bb1dbe and
      DEC-20260914-d471ce both authored SUCCESSOR lock/binding files rather
      than editing the originals, for the identical reason (an existing
      artifact's declared sha256 is pinned elsewhere and editing it would
      silently invalidate that pin).
    - >-
      WHY THE RUNTIME ADMISSION QUESTION IS NOT REOPENED. DEC-20260914-d471ce
      already independently verified, against raw probe logs it read directly,
      that the alternate conda-forge Sage 10.9 runtime satisfies every guard
      specification-stage0-v2.yaml's runtime_requirements block actually names:
      Linux, Sage 10.9, POSIX process group, per-process RLIMIT_AS exactly 8192
      MiB, single worker, in-process libsingular, an aggregate cgroup v1 memory
      ceiling of 14327676928 bytes cross-confirmed via the exact 'sage -python'
      argv_prefix, and Sage-bundled Python identity corroborated in a raw log.
      Nothing about the runtime changed between RUN-FROB-2404fa's launch and
      now; only the specific run_id is spent. Re-deriving runtime admission from
      scratch here would be makework this record explicitly declines, per this
      question's own framing ("This decision does not need to re-litigate the
      runtime admission... or re-open the launch-admission question"). The
      fresh run-binding therefore points at the SAME successor lock file by its
      already-committed, already-read sha256
      (46d918a1a4b9d358df39f09a87d5221128cc1ce19cb62672bc35204785952eb5), carried
      forward rather than recomputed.
    - >-
      THE WATCHDOG DECISION, MADE EXPLICITLY RATHER THAN LEFT NULL AGAIN.
      specification-stage0-v2.yaml's own stopping_rules text is the trigger
      condition it names for adding one: "No watchdog unless a future explicit
      machine-protection amendment." This is exactly that amendment. Leaving
      watchdog_seconds null a second time risks the identical failure recurring
      -- a dispatching session again inventing an ad hoc external `timeout`
      wrapper because no authorized cutoff exists for it to rely on instead. Set
      too low, a watchdog repeats the exact failure being remedied; the request
      is explicit that any watchdog "must be sized generously, not to the point
      of repeating this exact failure." The only real duration signal available
      is that RUN-FROB-2404fa was ~578 seconds (9.5 minutes) into the run, deep
      in the calibration-cell sweep, with 376,232 records already written and
      no sign of hanging, stalling, or error, when it was killed externally --
      i.e., strictly progressing, not runaway. Given that signal alone, and
      given the full domain this trial must exhaustively cover (two curves,
      every stable 1D/2D subspace, both m=2 and m=3, every nonzero target,
      complete lex/grevlex calibration), no reliable upper bound on total
      duration can be derived from one partial run; this coordinator does not
      invent one. Instead, 86400 seconds (24 hours) is chosen as a ceiling
      that is not itself a duration estimate but machine protection sized by
      precedent already accepted in this exact admission chain -- the identical
      86400-second magnitude the original Modal sandbox lifecycle lease used
      (coordination/frobenius/BATCH-2f8435/admission/linux-runtime-lock.json,
      read by DEC-20260914-37e0d9). This is a genuine amendment, recorded here
      with its rationale in full, not a silent tightening: it changes no
      scientific parameter, control, sample count, or success/falsification
      criterion, and it is expected never to bind in the normal case.
    - >-
      WHY THIS IS NOT A SILENT PROTOCOL WEAKENING. Every field the frozen v2
      scientific protocol actually governs -- field/curve/subspace/arity/target
      coverage, controls, polynomial construction, calibration procedure,
      serialization, cost accounting, success and falsification criteria -- is
      unchanged. specification-stage0-v2.yaml is not edited. The only fields
      that differ between v2 and v3 are administrative/infrastructural: run_id
      (structurally forced), task_id (structurally forced by write_scope), and
      watchdog_seconds (newly authorized machine protection, justified above).
      This is exactly the class of change AGENTS.md's additive-amendment
      mechanism exists for.
    - >-
      DIRECTION CHECK, unchanged from the whole DEC-20260914-* chain. Stage0 is
      not itself exponent-moving; it is the correctness gate for H-FROB-73df22's
      two arms (arm B is the exponent-targeting arm, arm A the falsification
      arm). No scientific claim of any kind is advanced by this admission
      record. FROB is a declared ECC area (orchestration/research-priority.yaml
      line 79), ranked ahead of non-ECC candidates at every selection point,
      with unlimited batch/wall-clock budget per AGENTS.md "ECC comes first."
    - >-
      BUDGET. Per CLAUDE.md "Research budgets: progress first" (2026-09-06):
      research cost estimates are advisory and require no repeated user
      approval; the Coordinator continues justified work within the authorized
      research scope. No 90-day stagnation review is active or warranted --
      this lane has shown continuous documented progress across
      DEC-20260909-bf5b48 through DEC-20260914-04d16a and now this record, all
      within the last five days, and the interruption itself is exactly the
      kind of "exhausted estimate" CLAUDE.md explicitly states is "not
      stagnation." FROB's maximum_batches and total_wall_clock_seconds remain
      null by standing instruction.

