coordinator_decision:
  id: DEC-20260803-155a86
  decided_at: '2026-08-03'
  decided_by: coordinator
  decision: approve_experiment
  target_ids: [EXP-SMTH-71b1b0, H-SMTH-001, RQ-ECDLP-002]
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-038
  question_id: RQ-ECDLP-002
  hypothesis_id: H-SMTH-001
  target: EXP-SMTH-71b1b0
  action: approve_execution

  summary: >-
    Authorize execution of the frozen contract EXP-SMTH-71b1b0, the direct
    B-smoothness measurement of the half-arity Semaev partial-map integer
    invariants against a MEASURED null. This discharges DEC-20260801-011 rank 1
    (OPEN-BATCH023-A), which has been owed since BATCH-023 and which BATCH-024
    closed without performing.

  rationale:
    - OPEN-BATCH023-A was ranked first by DEC-20260801-011 and has never been
      performed. CORR-20260803-77d5da re-verified that as of 2026-08-03 no run
      package exists under any smoothness contract and no batch from BATCH-029
      to BATCH-037 references HEUR-DS-1.
    - The measurement is DIRECT. It replaces an inferred smoothness rate with a
      measured distribution, which is the narrowest available way to reduce the
      uncertainty HEUR-DS-1 carries.
    - EXP-SMTH-71b1b0 is self-contained, schema-valid, frozen, and states its
      measured quantity directly rather than by reference to the unapproved
      EXP-SMTH-001 or the null-only pilot EXP-SMTH-002. Neither is reused and
      neither is edited.
    - Its claim ceiling is TOY TIER under every outcome and it licenses no cost
      saving, no exponent and no crypto-scale claim. Approving it therefore
      risks no overclaim, and its failure modes are informative either way.

  what_this_decision_does_not_do:
    - It does NOT change the status of H-SMTH-001, H-IC-001, H-STR-002 or any
      other hypothesis. No status moves on an approval.
    - It does NOT assert any smoothness result. No datum exists.
    - It does NOT edit EXP-SMTH-71b1b0. The contract is frozen and stays byte-identical.
    - It does NOT resolve the EXP-IT-001 evidence-citation defect (EV-IT-001 and
      EV-IT-002 cite RUN-IT-001-bounded-toy and RUN-IT-001-rerun, whose flat
      manifest.json files the validator does not index). That is deferred and
      remains open.

  authorization_mechanism:
    issue: >-
      EXP-SMTH-71b1b0 carries `execution_authorized: false` and
      `evidence_eligible: false`, and its freeze_rule states that any needed
      change is a SUPERSEDING contract under a new id, never an edit.
    resolution: >-
      The specification is NOT edited. Authorization is recorded here and in
      experiments/EXP-SMTH-71b1b0/freeze_receipt.json as a later external fact,
      on the same principle by which corrections supersede rather than
      overwrite: the frozen record states what was true at freeze time, and a
      committed decision states what is true now.
    contestable: >-
      A reviewer may instead read freeze_rule as requiring a superseding
      contract with execution_authorized: true. That reading is defensible. If
      the Validator or Red Team takes it, BATCH-038 is re-opened against a new
      contract id and this decision is superseded; no run performed under this
      authorization would be discarded for that reason alone, but its evidence
      record would name the contested authorization.

  preconditions_verified:
    - freeze_receipt.json now exists and pins sha256
      e193a1966b264804b17976c1575f7bded858936005cab393f31763fef8a0e432
      (17950 bytes). The Executor re-hashes and HALTS on any difference.
    - tools/check_merge_hygiene.py PASSES on the batch-opening tree.
    - H-SMTH-001 exists in ledger/hypotheses/ and is bound to RQ-ECDLP-002.
    - Two receipt defects of the freezing task are recorded in
      CORR-20260803-a1c41e and are unresolved, not hidden.

  known_tree_state_at_approval: >-
    tools/validate_ledger.py reports 20 new validation errors on this tree, all
    pre-existing on origin/main and none introduced by BATCH-038. They are
    schema debt (missing required fields, unindexed run manifests) and are named
    in the batch INPUT-CAPSULE. The batch does not clear them and does not
    depend on them.

  executor_constraint_binding_this_batch: >-
    The run package MUST be written as experiments/EXP-SMTH-71b1b0/runs/<RUN-ID>/manifest.yaml
    with a nested top-level `run:` key. This is not stylistic. tools/validate_ledger.py
    scans runs only at experiments/*/runs/*/manifest.yaml, and registers flat
    JSON manifests only for frozen legacy runs. BATCH-028 wrote
    experiments/EXP-IT-001/runs/*/manifest.json flat, and as a direct result
    EV-IT-001 and EV-IT-002 fail validation citing runs that physically exist
    with complete artifacts. A run this batch cannot cite is a run this batch
    wasted.

  next_action: >-
    Dispatch TASK-20260803-fa7476 (Executor) to perform the measurement under
    EXP-SMTH-71b1b0, RSS pre-flight probe first, halting on a contract digest
    mismatch or any budget ceiling.

  claim_ceiling: >-
    TOY TIER. This decision authorizes a measurement; it asserts no result. Per
    the contract, any outcome is scoped exactly to INT-1, ENC-B, bits in
    {16,20}, |FB| = 512, m = 4 and the declared ladder, and licenses no cost
    saving, no exponent and no crypto-scale validity.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Nothing is promoted. This decision authorizes an experiment and records
      receipt defects; no result exists to promote. A knowledge entry will be
      considered only after the measurement is run, archived and independently
      reviewed.
