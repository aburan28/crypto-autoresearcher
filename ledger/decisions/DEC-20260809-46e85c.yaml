  limitations:
  - 'NO STATEMENT ABOUT HQC. Nothing in this decision bears on HQC''s IND-CCA security, its
    decoding-failure rate, assumption A17 or A5, or any standardized parameter set. Claim tier stays
    TOY, scoped to PS-R3 (n=7187, n_e=56, N=7168, k=m=17), the V3 defect class, the decode_blocks
    injection point, and T=5,000 per arm as tested to date.'
  - 'H-HQC-18d1b4 IS UNCHANGED AND REMAINS PROPOSED. This is stated explicitly rather than left to
    inference: nothing in EV-HQC-dd85c1 bears on the hypothesis in either direction, and no evidence in
    this cycle would justify moving it.'
  - 'THE ADJUDICATED DELIVERABLE WAS NEVER INDEPENDENTLY REVIEWED. No Validator or Red Team pass exists
    for TASK-20260807-db4230; no review verdict and no attestation is recorded for it here, because none
    was obtained. The Coordinator''s verification extends only to re-reading the cited sources and
    re-deriving the arithmetic, which is how the 5-18x overstatement was found.'
  - 'EVERY REQUIRED-T FIGURE THIS DECISION ACTS ON IS MODELED, NOT MEASURED. It extrapolates a single
    T=5,000 SE via an unverified 1/sqrt(T) assumption, from a single unreplicated measurement whose
    script is not committed. TASK-20260809-a79e4f is designed to test both of those weaknesses, which is
    also why its stage-2 sizing is computed from what stage 1 MEASURES rather than from 0.1982.'
  - 'experiments/EXP-HQC-982268/specification.yaml IS NOT AMENDED by this decision, and nothing beyond
    TASK-20260809-a79e4f is pre-authorized. In particular the full 3.09e5-trial run is NOT authorized,
    and standardized-parameter real-sampler runs remain out of scope.'
  - 'NONE OF THE FOUR ASYMPTOTIC-COMPLEXITY PROMOTION GATES IS ENGAGED OR CLAIMED. This program advances
    no asymptotic-complexity claim of its own here.'
  - 'THE CAMPAIGN''S REMAINING WALL-CLOCK FIGURE IS CITED, NOT RE-DERIVED. reanalysis_report.md section
    0 states roughly 4,973 of 10,800 seconds remained at BATCH-2ecaa1''s close; that is THAT REPORT''S
    figure, carried forward from BATCH-2ecaa1''s checkpoint, and this decision does not independently
    reconcile it. The convention for what is debited against the total is not stated anywhere in the
    record. total_wall_clock_seconds remains a live pause condition and TASK-20260809-a79e4f is
    required to report its actual spend so the next ledger archive can debit a measured number.'
  - 'NO CLOSURE QUORUM AND NO ATTESTATIONS. GOAL-HQC-001 is not being closed, no completion criterion is
    met or approached, and no completion_quorum block is written or implied.'
  knowledge_promotion:
    promoted: []
    not_warranted: 'HELD, WITH A CONCRETE RELEASE CONDITION -- NOT A SHRUG, AND NOT A SECOND
      INDEFINITE DEFERRAL. DEC-20260806-9a4551 held one methodological lesson ("a between-shard
      comparison design can look statistically clean while being far less powered than an available
      free matched-pair alternative") pending confirmation that the matched-pair reanalysis resolved the
      ambiguity. IT DID NOT RESOLVE IT (rationale 1-2), so the stated release condition did not fire.
      What step (2) added is a concrete number for the power deficit, and this decision had to CORRECT
      that number before it could be used: the defensible like-for-like figure at k=m=17 is 5.0x-7.7x in
      required trials, not the deliverable''s "5-18x" (rationale 3). Promoting now is refused on three
      specific grounds. (i) CLASS AND THRESHOLD: this would be a KN-TECH methodological entry, not a
      KN-FIND -- nothing was measured about HQC -- and the Coordinator''s KN-FIND obligation attaches to
      support/reject_scoped decisions on replicated or strong evidence; this is a refine decision on
      evidence of strength inconclusive. (ii) THE NUMBER IS SINGLE-SOURCE: the SE ratio underlying it
      comes from ONE uncommitted scratch computation, on ONE shard, in ONE session, unreplicated
      (EV-HQC-dd85c1 O8). Filing an immutable corpus entry around a figure with that provenance, in the
      same decision that had to correct the artifact publicising it, would repeat exactly the pattern
      this campaign has recorded against itself in six consecutive batches. (iii) THE REPLICATION IS
      ALREADY DISPATCHED AND CHEAP: TASK-20260809-a79e4f stage 1 measures the matched-pair and unpaired
      SEs on the pilot''s OWN two shards at roughly 10 core-seconds. RELEASE CONDITION, BINDING ON THE
      NEXT LEDGER ARCHIVE: if stage 1''s measured SE ratio at k=17 on shards 5000 and 6000 is consistent
      with the Red Team''s 2.78x, file a KN-TECH entry stating the lesson with the replicated
      like-for-like required-trials factor and the irreversibility point (a between-shard design cannot
      be re-paired after the fact, so the choice is made once); if it is materially inconsistent, file a
      KN-TECH entry stating THAT instead, because a design-power figure that does not replicate across
      shards is the more valuable lesson. Either way an entry is filed at the next ledger archive; the
      hold does not renew a second time. Also carried, unchanged and unpromoted: the four-instance
      control-blindness pattern (KN-TECH candidate held since BATCH-4b8ad3) and the planted-arm plateau
      lesson (held since BATCH-f8050e).'
  next_actions:
  - 'DISPATCH BATCH-412513''s single executor task TASK-20260809-a79e4f (queue:
    coordination/goals/GOAL-HQC-001/batches/BATCH-412513/dispatch_queue.json; card:
    .../tasks/TASK-20260809-a79e4f/task_card.yaml; envelope: ledger/handoffs/TASK-20260809-a79e4f.yaml).
    TWO PRE-REGISTERED STAGES, ONE TASK. STAGE 1, ZERO NEW ENTROPY: re-decode the already-committed
    shard 5000 through the UNMODIFIED decode_blocks and shard 6000 through the DEFECTED wrapper,
    reconstructing genuine matched pairs on the pilot''s own draws (5,000 per shard, 10,000 total);
    gate the stage fail-closed on reproducing pilot_results.json''s committed S_histogram arrays
    BIT-IDENTICALLY in the original configuration; report per-shard and pooled matched-pair
    diff/SE/z at k=17 and across k=2..26, plus the unpaired-vs-paired SE ratio as an independent
    replication of the Red Team''s 2.78x. STAGE 2, NEW SAMPLING AT A PRE-REGISTERED SIZE: a matched-pair
    arm at fresh shard indices with T2 = clamp(round(10000 x (SE_pooled_measured x 2.80 / 0.20)^2),
    20000, 60000) -- delta fixed at 0.20 and z at 2.80 IN ADVANCE, floor and cap declared IN ADVANCE, so
    the only input from stage 1 is the measured SE. Budget 400 core-seconds, 1800 wall-clock seconds, 2
    runs; expected use of order 30-80 core-seconds.'
  - 'PRE-REGISTERED DECISION RULE, FIXED BEFORE THE RUN, EVALUATED ON STAGE 2 AT k=m=17 AS PRIMARY (stage
    1 is calibration and replication and is explicitly NOT the primary test, because its pooled minimum
    detectable effect of about 0.275 exceeds both existing point estimates). BRANCH A -- DETECTED:
    |z| >= 1.96 and the sign agrees with stage 1''s pooled sign. The real-sampler-to-joint-moment chain
    has produced its first positive detection in this campaign; the V1 positive control is NO LONGER the
    blocking next step, and the next batch is an independent-shard replication plus a full-run design
    decision. BRANCH B -- NULL WITH A STATED MINIMUM DETECTABLE EFFECT: |z| < 1.96 AND |diff| + 1.96 x SE
    < 0.19. A genuine scoped null at the V3/decode_blocks point, PS-R3, toy tier -- and per the
    controls-before-belief standard a null from an instrument that has never rung is uncalibrated, so
    the V1 POSITIVE-CONTROL PILOT IS THE IMMEDIATE NEXT ACTION, matched-pair from the outset at the T
    stage 2 established. BRANCH C -- STILL AMBIGUOUS: |z| < 1.96 AND |diff| + 1.96 x SE >= 0.19. C1, if
    |diff| >= 0.10 with sign consistent with stage 1: ONE further matched-pair extension sized for
    delta = the observed |diff| at z = 2.80, capped at 2.0e5 trials (about 100-200 core-seconds at the
    measured throughput). C2, if |diff| < 0.10: the point estimate has collapsed toward zero without the
    interval yet excluding 0.19, so the V1 POSITIVE CONTROL runs next instead of buying more T at a
    point whose estimate is shrinking. BRANCH D -- INVALID / INFRASTRUCTURE: stage 1''s bit-identity gate
    fails, or any D2/D3 invariant violation, or a crash, or a budget overrun. Per AGENTS.md rule 5 this
    is infrastructure signal and NEVER a negative mathematical result; the run set returns to the
    executor with concrete defects and NO branch fires. BRANCH E -- ANOMALY: stage 1''s two shards
    disagree in sign with each individually at |z| >= 1.96. Per AGENTS.md rule 8 this is recorded, not
    discarded; the batch is not interpretable pending a red-team pass on the estimator, and A/B/C do not
    fire.'
  - 'SECONDARY, PRE-REGISTERED, REPORTED WHATEVER THE PRIMARY OUTCOME: fit the matched-pair jackknife SE
    against trial count across the three available points (5,000 per shard, 10,000 pooled, T2) and report
    the fitted exponent. Consistency with 1/sqrt(T) is declared in advance as a fitted exponent in
    [0.4, 0.6]. IF IT FALLS OUTSIDE THAT BAND, that supersedes branches A/B/C: the derivation''s own
    modeling assumption is refuted, every required-T figure in EV-HQC-dd85c1 O5 is downgraded to resting
    on a refuted assumption, and the next action is a scaling-characterization task before any further
    sizing. This is the first empirical test the assumption has ever received.'
  - 'RUN THE REVIEW AND ARCHIVE CHAIN. TASK-20260809-a79e4f carries review_required: true and MUST
    receive an independent Validator and an independent Red Team pass before any evidence record
    interprets it, with a snapshot archive committed BEFORE either review reads it and a ledger archive
    after both. The four chain task IDs are not minted in this decision because the Coordinator session
    that wrote it had no ID allocator; the driving session allocates them with tools/allocate_id.py
    --next handoff --date 20260809, appends them to the queue as declared in its review_chain_pending
    block, and only then dispatches. THE QUEUE IS DELIBERATELY INCOMPLETE UNTIL THAT HAPPENS and
    tools/research_dispatch.py will reject it as it stands -- stated plainly rather than left to be
    discovered.'
  - 'AT THE NEXT LEDGER ARCHIVE, FILE THE HELD KN-TECH ENTRY under the release condition in
    knowledge_promotion above. The hold does not renew a second time.'
  - 'DELIBERATELY NOT SCHEDULED, unchanged and for the same reason as in DEC-20260806-2947ba,
    -46a8f3, -cf5102, -0995d5, -1ac8fa and -9a4551: completion criterion 1''s missing extrapolation,
