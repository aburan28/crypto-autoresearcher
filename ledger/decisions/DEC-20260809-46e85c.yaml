coordinator_decision:
  id: DEC-20260809-46e85c
  decided_by: coordinator
  decided_at: '2026-08-09'
  decision: refine
  decision_vocabulary_note: '"refine" is this campaign''s established disposition vocabulary
    (DEC-20260802-344883, -9664c6, -d94a64, DEC-20260806-46a8f3, -cf5102, -0995d5, -9a4551 all use it,
    and batch_checkpoints[].disposition records it). It is not in templates/research-records.md''s
    enumeration, which lists approve|revise|replicate|expand|support|weaken|reject_scoped|pause|supersede;
    against that enumeration this decision is an APPROVE (of one bounded successor task, TASK-20260809-a79e4f)
    combined with a REVISE (of the ordering inside DEC-20260806-9a4551''s standing three-step plan). The
    campaign''s own vocabulary is kept for continuity with its checkpoint chain and the mapping is stated
    here so no reader has to guess it.'
  target_ids:
  - GOAL-HQC-001
  - EXP-HQC-982268
  - H-HQC-18d1b4
  - EV-HQC-dd85c1
  context: 'DEC-20260806-9a4551 closed BATCH-2ecaa1 (refine) and named exactly one next action in three
    ordered steps: (1) matched-pair reanalysis of TASK-20260806-77a574''s already-collected pilot data,
    free, no new sampling; (2) a real required-T derivation from the defect''s own measured 10.7 percent
    local effect size; (3) ONLY IF GENUINE AMBIGUITY REMAINS after (1) and (2), a positive-control pilot
    at a less-diluted injection point (V1). Steps (1) and (2) WERE EXECUTED -- by TASK-20260807-db4230,
    producing reanalysis_report.md and required_t_derivation.py, committed on main at f4bcb89ab -- but NO
    evidence record, NO coordinator decision and NO goal-head update was ever written for them. The goal
    head has since carried a next_action naming steps (1) and (2) as pending, which they are not. THIS
    DECISION CLOSES THAT ADJUDICATION GAP: it records EV-HQC-dd85c1 over the deliverable, rules on each
    of the three steps, opens BATCH-412513, and replaces the stale next_action. It is the first
    Coordinator adjudication of TASK-20260807-db4230 and no earlier one exists to supersede.'
  rationale:
  - 'STEP (1) IS DISCHARGED AS STRUCTURALLY IMPOSSIBLE, NOT COMPLETED, AND THE DISTINCTION MATTERS. The
    reanalysis DEC-20260806-9a4551 called "free, no new sampling" cannot be performed on the pilot''s own
    committed data for two independent reasons, each verified against committed code (EV-HQC-dd85c1 O2):
    only whole-arm S-histograms were persisted, so trial identity is destroyed even within an arm; and
    the two arms were drawn from disjoint PRNG shards (5000 defected, 6000 undefected) keyed
    per-shard-index, so NO MATCHED PAIR EVER EXISTED TO RECOVER. The second reason is the deeper one and
    holds regardless of serialization. This is a property of the design, not a data-retention accident,
    and the prior decision''s premise that the reanalysis was free was therefore mistaken -- recorded as
    a correction to that premise, not as a fault of the executor, who found the fact and reported it
    rather than manufacturing a substitute analysis.'
  - 'THE BEST AVAILABLE SUBSTITUTE NARROWS THE AMBIGUITY AND DOES NOT RESOLVE IT, SO STEP (3)''s
    PRECONDITION IS MET. The only matched-pair measurement in the record is the Red Team''s own
    independently-collected Probe 2 on fresh shard 424242: at k=17, T=5,000, it tightens the SE from
    0.5514 to 0.1982 (2.78x) and yields z = 0.970, clearing neither a significance bar nor a clean-null
    bar; its approximate 95 percent interval contains both zero and effects several times its point
    estimate. Three independent estimates of the k=17 difference now exist (-0.207 pilot between-shard;
    +0.5082 Validator between-shard at T=2,000; +0.1922 Red Team matched-pair) and their SIGN IS
    UNSTABLE, with two of three positive -- a sharper statement than the two-sample framing supports,
    and one this decision records explicitly (EV-HQC-dd85c1 O4). Genuine ambiguity remains, on the
    deliverable''s own analysis and on this Coordinator''s independent check of it.'
  - 'STEP (2) IS DELIVERED AND ITS ARITHMETIC RE-VERIFIES, WITH ONE HEADLINE FIGURE CORRECTED. The
    derivation gives matched-pair T_req of 17,625 to 41,686 trials against 88,331 to 322,636 for the
    between-shard design (EV-HQC-dd85c1 O5), all re-derived by hand from the cited constants and
    reproduced by re-executing the committed script. BUT reanalysis_report.md''s claim that the
    matched-pair design is "roughly 5-18x" cheaper is NOT LIKE-FOR-LIKE: at fixed delta and fixed z the
    ratio is exactly (SE_unpaired/SE_paired)^2, which is 7.74 within the Red Team''s single dataset and
    5.01 substituting the pilot''s SE; the 18x comes from dividing the smallest matched-pair cell by the
    largest between-shard cell across DIFFERENT delta AND DIFFERENT z. THE DEFENSIBLE FIGURE AT THE
    LOAD-BEARING CELL k=m=17 IS 5.0x TO 7.7x. The direction is unchanged and still substantial; the
    magnitude was overstated by about 2.4x at the top end. Recorded here because this campaign has now
    corrected a numerically-derived overstatement in six consecutive batches, and because the corrected
    figure is the one a knowledge entry would have to carry.'
  - 'THE ORDERING FIXED BY DEC-20260806-9a4551 IS REVISED, ON INFORMATION THAT DECISION COULD NOT HAVE
    HAD. Two facts surfaced by the reanalysis change the cheapest-information-per-cost ordering. FIRST,
    a deterministic zero-new-entropy reconstruction is available: because stage_a.py''s PRNG is a
    function of the committed shard index, re-decoding shard 5000 through the unmodified decode_blocks
    and shard 6000 through the defected wrapper yields GENUINE matched pairs on the pilot''s own draws --
    and its determinism is not an assumption, because the VALIDATOR already executed the forward half of
    exactly this procedure and obtained bit-identical S-histograms (EV-HQC-dd85c1 O9). SECOND, the
    derived matched-pair T_req is affordable: at the measured ~2,100 trials/core-second, 41,686 trials
    cost roughly 20 to 40 core-seconds including the second decode pass, against EV-HQC-bfb257''s
    139-392 core-second pricing of the FULL 3.09e5 run (EV-HQC-dd85c1 O11). The "expensive full-scale
    commitment" this campaign has deferred for two batches was never expensive at PS-R3 scale. Together
    these make a single bounded task -- deterministic reconstruction, then a matched-pair arm at the
    derived T -- both cheaper than and strictly more informative than the V1 positive control, which is
    why it is dispatched first.'
  - 'AND THE STRICTLY-CHEAPER TASK IS DELIBERATELY NOT SOLD AS DECISIVE ON ITS OWN. A 10,000-pair
    reconstruction of the pilot''s own shards has, under the derivation''s own 1/sqrt(T) assumption, a
    pooled SE of about 0.140 and a minimum detectable effect of about 0.275 at z=1.96 -- ABOVE both
    existing point estimates. It therefore CANNOT produce a null that excludes a ~0.19-0.21 effect, no
    matter what it observes, and is unlikely to reach significance. Stated before the run rather than
    discovered after it. Its real value is that it replicates the single unreplicated, uncommitted input
    the whole required-T derivation rests on (SE_paired = 0.1982, one source, one shard, scratch script:
    EV-HQC-dd85c1 O8), supplies the FIRST empirical check of the unverified 1/sqrt(T) scaling
    (EV-HQC-dd85c1 O7) by measuring SE at more than one trial count, and restates the campaign''s own
    headline null on the correctly-specified instrument. Because it de-risks the sizing input, it runs
    as stage 1 of the same task whose stage 2 is sized from what it measures -- at T about 3.9e4 pairs
    the design reaches a minimum detectable effect of about 0.135, BELOW both point estimates, making a
    detection AND an effect-excluding null BOTH reachable for the first time in this campaign.'
  - 'THE V1 POSITIVE CONTROL IS SEQUENCED, NOT SHELVED, AND THE COMMITMENT IS MADE BINDING HERE. The Red
    Team''s strongest standing objection is that in six batches this detection chain has never once
    produced a fired cell from a known-present defect, so every null it reports is uncalibrated. That
    objection is not answered by this decision and is not weakened by it. To ensure sequencing cannot
    become indefinite deferral, this decision commits in advance: V1 is dispatched in the IMMEDIATELY
    FOLLOWING batch under pre-registered branches B and C2 below, and is unnecessary only under branch
    A, where the pipeline will have demonstrably rung on its own. No other outcome defers it.'
  - 'A PROCESS FINDING IS RECORDED RATHER THAN SMOOTHED OVER. TASK-20260807-db4230 ran with no committed
    task card, no handoff envelope and no dispatch-queue entry, wrote into a batch directory whose
    ledger archive had already completed, and received NO independent Validator or Red Team review
    (EV-HQC-dd85c1 O10). Its status is a Coordinator-verified analysis deliverable, not an
    independently reviewed one, and this decision records no verdict or attestation for it because none
    was obtained. The work itself was careful -- it correctly refused to exceed its own budget scope and
    flagged the question for authorization rather than answering it -- and the defect is in the control
    plane, not the analysis. That is also why TASK-20260809-a79e4f carries review_required: true.'
