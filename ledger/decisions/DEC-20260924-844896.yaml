        child's only exits other than exec are os._exit(97), (98) and (99)
        (v2_solver.py 196, 201, 208), which run no handler, no finally and no
        interpreter shutdown; exec is visible to the parent through a counter
        opened with enable_on_exec on the child before the go byte (the child
        cannot exec before 236, v2_solver.py 202); and the frozen parent reaps
        the child before returning (223, 230, 243-271). The successor childend
