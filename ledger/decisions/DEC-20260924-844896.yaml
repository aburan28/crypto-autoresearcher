        every other end, whatever an escaped process writes. FD stays the
        revisit if the review of the successor names a fail-open
        counterexample in the foreign-process class, or shows that the
        operating-system behaviour RG-1 relies on is not available on the
        host (childend what_the_readings_cannot_do_applies).
      result: >-
        FAILS on FO-1 (definition (iv) as worded). NOT APPROVABLE AS WRITTEN.
