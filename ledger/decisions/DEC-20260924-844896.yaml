      FD_revisit_condition: >-
        RECONSIDERED, NOT ADOPTED NOW. DEC-20260924-8fa3d4's revisit condition
        reads: "If the review finds a FAIL-OPEN counterexample that no r4-layer
        rule can close without changing a frozen byte, the approval act
        reconsiders option FD". FO-1 CAN be closed at the r4 layer by POSITIVE
