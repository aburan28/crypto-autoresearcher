      R-RFR1-FO-1_is_a_fail_open_counterexample: >-
        YES, AS DEFINITION (iv) IS WORDED.
        (1) It is stated with file, lines and sequence, as RFR-1 requires.
        (2) Its outcome is PASS (and dependants admitted) while a record
            (pari-stack.json, written by the entry's finally in the child) is
            written in a process other than the installing one and nothing
            detects it: definition (iv) as worded.
        (3) It is none of the NOT A BAR items. It is not a fail-closed finding
            (the rules give PASS). The package's verdict is PASS, not FAIL, so
            "record inexactness on a package whose verdict is FAIL" does not
            reach it. It concerns a forked child, not a grandchild (RFL-1). It
            is not "which path occurs at run time" (RFL-3), which excuses the
            static nature of the readings, not a path on which the rules pass.
            And "the RFL-5 behaviour of an escaped fork child ONCE IT IS
            RECORDED" presupposes the recording that FO-1 shows can be lost.
        (4) Reachability through documented interpreter behaviour (the
            census's L-11 class; review DV-5) does not remove it: a path
            derived from documented behaviour is a finding, not a limit
            (DEC-20260924-8fa3d4 method_limits_ruled L-11;
            DEC-20260924-650068 "not expected is not impossible"). The
            recalled provenance of the semantics (review 749-768) is
            acceptable for a constructed sequence: the draft itself relies on
            the same documented behaviour (RFL-4), and its own RF-6 (f)
            (xiii) plans to exercise the fork-child path.
      R-RFR1-reading_of_iv: >-
        LITERAL. "A record" is any record; the review's alternative (records
        written by the recorder only, review 163-167, 225-231) is REFUSED:
        - it is a narrowing of a pre-declared definition chosen after the
          review, the post-hoc reading refused in DEC-20260924-8fa3d4
          R-RKR1-b_P-16 (3) and DEC-20260924-a789e1 R-RLR1-P-7 (2);
        - under RF-1 (b) the recorder writes, in a foreign process, only the
          foreign file whose existence is itself the detection, so the
          narrowed (iv) would reach almost nothing: it would drop exactly the
          entry and frozen-caller writes that make a foreign process
          dangerous to the record;
        - the definition was written (DEC-20260924-8fa3d4 E-9) precisely to
          catch the fork-child path, whose writes are the entry's and the
          interpreter's, not the recorder's.
      R-RFR1-substance: >-
        Stated so that the scope is honest. No argv is executed by the escaped
        process and it creates no capped child (review 550-556; J-2's handler
