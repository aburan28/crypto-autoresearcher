      and a planned-basis refusal mean: not approvable as written. The review
      named one of each, with sequences from frozen code.
    - >-
      NO READING IS NARROWED AFTER THE FACT. (iv) is read literally; the
      alternative reading of RFR-2 is declined; the RFR-3 conflict on FC-2 is
      left undecided because it decides nothing, and the successor removes it.
    - >-
      THE DESIGN LOCALIZED THE PROBLEM. Unlike six exact-coverage rounds, the
      review found one absence-based condition and one dropped sentence, not a
      finer layer of paths; every fail-closed finding costs a stop, not a
      result, and none orders a census. The successor is targeted to those
      findings and is reviewed on its difference only.
    - >-
      POSITIVE EVIDENCE MUST COME FROM A PROCESS THE FAILURE CANNOT SUBVERT.
      A guard that waits for the escaped process to report itself is
      absence-based however it is phrased; the kernel's exec-enabled counter
      and the frozen child's own os._exit codes, collected by the installing
      process after reaping, are not. That is why the successor does not
      adopt the reviewer's second mutation alone.
    - >-
      FD IS KEPT, NOT SPENT. A v3 launcher with no Python between fork and exec
      would remove the foreign-process class entirely, at the cost of a new
      protocol version, REG-1 reference and gate. It is the named revisit if
      the successor's review shows the r4-layer evidence insufficient.
    - >-
      THE LANE STAYS OPEN. Nothing measured D. The obstruction is recording
      and approval design in a layer not yet written.
    - >-
      NO SECURITY READING. Toy EcGFp5-shaped arithmetic with known scalars;
      nothing transfers to p = 2^64 - 2^32 + 1.

