      - CJ-1: holds on FO-1's variants. The likeliest break is RGL-2 (an
        exit status 97, 98 or 99 reachable from an unwinding path) or a flaw
        in the pid-discovery step; about one chance in four of a fail-open
        finding. A reading of (iv) that counts the writes of an exec'd argv
        program (the comparator or the build child, both Python) as
        "undetected foreign records" would make every launch fail-open; I
        expect the reviewer to raise and reject it, and if it is pressed, the
        approval act must rule it without narrowing (iv).
      - CJ-2: holds; the likeliest findings are fail-closed (a child killed
        before exec; the counter unavailable on the host), not refusals.
      - CJ-3: holds; the likeliest break is the driver-RSS envelope refusal
        argued as a designed "m = 5 infeasible" basis (about one in four).
      - CJ-4: holds, with a better-than-even chance of one further
        fail-closed finding (another path-bearing value a child reads).
      - CJ-5, CJ-6: hold.
      A prior the review overturns is the most useful outcome here.

