coordinator_decision:
  id: DEC-20260813-1aae44

  context: >-
    BATCH-6e08fe of GOAL-MLKEM-005 discharged DEC-20260813-28d7b2's single next_action
    against PREREG-4, the frozen pre-registration notarized alone at commit
    1e1acf08b151dd31b4d41b8afd287d261adce1e5 by TASK-20260813-e24ad9 (3 declared paths,
    zero producer artifacts), and applied by the lead producer TASK-20260813-ea2e96,
    snapshot-committed at 6ad64048dfee5b87b9df7ebcd9d7f7b80baf44cb by TASK-20260813-2d6b5e.
    PREREG-4's part (a) carried BATCH-fbb639's coverage-table correction (RC-3) verbatim,
    no recomputation. PREREG-4's part (b) -- the batch's substantive lead measurement --
    built a genuinely non-code-shared re-implementation of ROUTE-I (ROUTE-I') for lam1n and
    hkz at L7/L9/L11, using from-scratch pure-Python/numpy LLL + exact SVP enumeration
    (fpylll and every alternative reduction library confirmed unavailable in the run
    environment), and re-ran PREREG-3 3.3's exact D_route comparison against the
    already-archived ROUTE-P values. TWO INDEPENDENT REVIEWS RETURNED: Validator
    TASK-20260813-71d65d (VAL-20260813-71d65d), verdict `passed`; Red Team
    TASK-20260813-7930a6 (RT-20260813-7930a6), one MAJOR objection (RT-4) plus three MINOR
    ones, stating explicitly the branch fires correctly and it is "not arguing to reopen or
    reverse the branch call." THE FROZEN TERMINATION CLAUSE OF PREREG-4 SECTION 2.6 FIRED
    T-INDVERIFY-ARTIFACT-PARTIAL, PER-CELL SPLIT, AND BOTH REVIEWS CONFIRM IT INDEPENDENTLY
    FROM THE FROZEN TEXT, CORRECT IN AGGREGATE AND PER-CELL. This decision is that batch's
    official close.
    CLAIM TIER TOY, UNCONDITIONALLY: nothing here bears on ML-KEM security, on any FIPS 203
    parameter set, on any attack cost, or on any cost model.

  decision: revise

  decision_note: >-
    `revise` is the ACTION -- the evidence record is committed with a per-candidate,
    per-cell split (lam1n discharged, hkz qualified-but-not-flagged), RC-3 is discharged as
    committed text, hkz's branch MEANS-text is corrected/qualified per the convergent
    reduction-quality finding, the revisit condition is ruled on explicitly and separately
    for each candidate, and the successor's single next action is specified -- and it is NOT
    a verdict on any proposition about a lattice. NOTHING IS `support`ed, `weaken`ed OR
    `reject_scoped` HERE, no hypothesis status moves and none is named. `approve` would
    understate the work this decision does: it would treat the Validator's `passed` verdict
    and PREREG-4's own default MEANS-text for T-INDVERIFY-ARTIFACT as sufficient on their
    own, when both reviews' own convergent central finding shows that default text is not
    the better-supported explanation and requires an explicit, citable correction before any
    future reader relies on it -- exactly the situation DEC-20260813-28d7b2 itself resolved
    with `revise` rather than `approve` for BATCH-fbb639. `reject_scoped` would be forbidden
    even if it applied: no hypothesis is being adjudicated and this is a single,
    unreplicated (model-correlated) batch. `pause` is unavailable for the same reasons
    DEC-20260813-28d7b2 gave: GOAL-MLKEM-005's pause_conditions are INFRASTRUCTURE-ONLY plus
    a user request, and nothing here is either. THIS BATCH CLOSES, PAUSES AND COMPLETES
    NOTHING. T-INDVERIFY-ARTIFACT-PARTIAL and T-INDVERIFY-CONFIRMED close no lane by
    themselves -- PREREG-4 2.6 is explicit their FORBIDS list includes closing, pausing or
    completing GOAL-MLKEM-005 for either branch, at every cell. T-C3LANE-OPEN-PARTIAL is
    EXPLICITLY NOT retroactively changed by anything in this decision, exactly as PREREG-4
    states throughout.

  target_ids:
  - GOAL-MLKEM-005
  - BATCH-6e08fe
  - EV-MLKEM-5aa471
  - TASK-20260813-cdcd88
  - TASK-20260813-e24ad9
  - TASK-20260813-ea2e96
