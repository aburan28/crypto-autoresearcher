  # ==================================================================
  # 10. KNOWLEDGE PROMOTION
  # ==================================================================
  knowledge_promotion:
    promoted: [KN-FIND-7de6b6]
    not_warranted: null
    promotion_note: >-
      TWO CANDIDATE FINDINGS CONSIDERED SEPARATELY, ON THE MERITS. ONE PROMOTED IN THIS SAME
      ARCHIVE; ONE JUDGED NOT WARRANTED.
      (1) lam1n's confirmed independent agreement (T-INDVERIFY-CONFIRMED discharge, 6
      cells): JUDGED NOT WARRANTED for independent promotion. It discharges an existing
      qualification (F-1/RT-1 of EV-MLKEM-965a37) on an existing finding rather than
      establishing a new, generalizable lesson, and is single-batch, single-goal evidence at
      TOY scale for one specific observable. The general lesson it illustrates (an exact,
      algorithm-independent invariant like lambda_1 is a genuinely strong basis for a
      cross-implementation check, unlike a reduction-quality-dependent statistic like hkz's
      GSO-tail profile) is arguably interesting but is a narrower, more specific instance of
      reasoning already implicit in this goal's own instrument-design carries; I do not
      judge it warrants a standalone corpus entry.
      (2) THE REDUCTION-QUALITY-CONFOUND PATTERN ITSELF: I JUDGED THIS MERITS DISCRETIONARY
      PROMOTION, on these grounds, and requested a KN-FIND-* identifier from the
      Coordinator's principal per AGENTS.md rule 14, since no identifier for this specific
      finding was reserved at batch open (only EV-MLKEM-5aa471 and DEC-20260813-1aae44 were).
      THE DEFERRED PROMOTION IS NO LONGER DEFERRED: the requested identifier was supplied
      before this archive committed, and the finding is promoted as KN-FIND-7de6b6 IN THIS
      SAME ARCHIVE rather than a successor's. THE GROUNDS, transcribed verbatim from the
      original request: it is CONVERGENT (independently found by both reviews, working blind
      to each other, via genuinely different supporting methods -- a pattern-correlation
      analysis of already-committed numbers plus a disconfirmed floor-mechanism control on
      one side; a freshly-built second independent LLL implementation run on all 24 bases on
      the other); it is DURABLE (the statistical signature -- sign consistency, dimension
      scaling, window shrinkage -- is invariant to how the underlying open question about hkz
      eventually resolves); and it GENERALIZES BEYOND THIS GOAL: a two-route independence
      test can be confounded by MISMATCHED COMPUTATIONAL FIDELITY (e.g. reduction quality,
      precision, iteration depth) even when code-sharing is genuinely absent -- and the
      confound is DISTINGUISHABLE from code-sharing by its own statistical signature (sign
      consistency, monotone scaling with the parameter that should amplify a genuine quality
      gap, shrinkage as an averaging window widens) WITHOUT needing to resolve the underlying
      computation exactly, using a contrast against this same goal's own precedent for what a
      genuine code-sharing artifact looks like (EXACTLY zero disagreement, no scaling
      structure of any kind). THIS IS DISTINCT FROM KN-FIND-9b5df0 (which is about auditing
      code PROVENANCE before naming a route independent, discovered BEFORE any independence
      test runs) -- this pattern is about a SEPARATE failure mode that persists EVEN AFTER
      code-sharing has been ruled out, and about how to DIAGNOSE it cheaply without a
      quality-matched control. KN-FIND-7de6b6 was minted without scanning state and
      two-scope confirmed (worktree `--check` plus a cross-ref sweep of the 25
      most-recently-updated remote branches, 0 hits in either scope, and confirmed absent
      from `origin/main`) by the dispatching session, per the same identifier-provenance
      discipline this goal's prior promotions (KN-FIND-9b5df0, KN-FIND-9d44b4) both used.
      Full entry: knowledge/findings/KN-FIND-7de6b6.md, citing
      EV-MLKEM-5aa471.hkz_qualification_citable_wording, VAL-20260813-71d65d section 6, and
      RT-20260813-7930a6 sections 3 and 7 as its proof_refs/source_refs.

