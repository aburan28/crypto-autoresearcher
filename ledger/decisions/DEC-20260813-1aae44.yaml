  - KN-FIND-7de6b6
  - BATCH-7033ee

  # ==================================================================
  # 1. VALIDITY BEFORE INTERPRETATION
  # ==================================================================
  run_set_validity:
    ruling: >-
      THE RUN SET IS VALID AND ADMISSIBLE AS EVIDENCE FOR THE PARTS NAMED admissible_now IN
      EV-MLKEM-5aa471. The Validator's own verdict is `passed` (not `incomplete`) -- checked
      before interpretation, not taken on that word alone.
    expected_run_count: >-
      ONE lead producer, ONE measurement invocation (measure_route_reimpl.py, 981.52 s of
      an 1800 s task budget). Both reviews independently confirm no invocation is omitted
      and no reduction above d=40 occurred anywhere (Validator AC-10; Red Team's own
      no-reduction confirmation).
    schema_complete_manifests: >-
      CONFIRMED BY THE VALIDATOR (AC-1 through AC-14) AND INDEPENDENTLY BY THE RED TEAM
      ("Commit verification" section). Both archives -- the notarization
      (1e1acf08b151dd31b4d41b8afd287d261adce1e5, 3 paths) and the lead snapshot
      (6ad64048dfee5b87b9df7ebcd9d7f7b80baf44cb, 8 paths) -- pass change-set equality at 3/3
      and 8/8, 0 extra, 0 missing, verified by BOTH reviews independently running git
      plumbing themselves, including recomputing all 11 committed path hashes from the git
      object database. No path inside a folded YAML scalar in run_manifest.yaml (AC-14, the
      artifact-policy carry from BATCH-fbb639's F-2, checked and clean).
    seed_integrity: >-
      CONFIRMED BY BOTH REVIEWS. The basis-construction seed formula
      (default_rng([1,d,k,i]).integers(0,q,(k,d-k))) is the ONLY source of randomness; both
      the LLL reduction and the SVP enumeration are fully deterministic given the basis
      (run_manifest.yaml deterministic_seeds block, independently confirmed by both
      reviews' own reading of the committed script).
    raw_summary_agreement: >-
      CONFIRMED FOR THE MACHINE-READABLE RECORD, INCLUDING AT EVERY CELL EITHER REVIEW'S OWN
      BUDGET REACHED. The obligation-0 coverage table (12/18) is independently re-derived
      cell for cell by both reviews from results_relvar.json's own G_REL1 block, matching
      the lead's own table exactly. D_route'/VERDICT' at the 12 covered cells matches the
      lead's reported values at every cell either review's own budget reached (Validator
      MR-1..MR-3 at L7/L9 for lam1n plus pattern re-analysis for hkz; Red Team's own
      independent recomputation of hkz at all 6 covered cells via a second, differently
      structured LLL implementation, matching the lead's route_i_prime to 1e-15-scale
      machine epsilon). NO MATERIAL DISAGREEMENT is found by either review anywhere in the
      lead's reported arithmetic.
    control_comparability: >-
      CONFIRMED, AND STRENGTHENED BY BOTH REVIEWS' OWN BUILT CONTROLS. The Red Team built a
      null-object calibration on rdet (algebraically forced to zero true dispersion),
      bounding the plausible floating-point floor for lam1n's D_route' at <=5.3e-10 and
      finding the observed 2.220e-15 to 9.992e-15 comfortably inside that range -- not
      implausibly small. The Red Team separately built a SECOND, independently-coded LLL
      implementation and ran it on all 24 bases, the decisive control this batch's own task
      card asked for. The Validator independently built a pattern-correlation analysis of
      the lead's own already-committed numbers (sign consistency, dimension scaling,
      beta-window shrinkage) and a reduction-quality floor probe that DISCONFIRMED its own
      naive working hypothesis (reported honestly against itself, per docs/inventor-
      protocol.md's control discipline). Both controls converge independently on the
      reduction-quality-confound reading -- see central_finding below.
    infrastructure_separation: >-
      No infrastructure failure, crash or missing dependency invalidates any part of this
      batch. fpylll's absence is INFRASTRUCTURE SIGNAL, confirmed live and independently by
      the lead, the Validator (AC-12), and the Red Team, never treated as negative
      mathematical evidence. The 3 of 8 L11 SVP-enumeration timeouts (lam1n) are likewise
      infrastructure signal, correctly excluded from the matched-basis count rather than
      defaulted to either verdict (Validator AC-11 and l11_timeout_exclusion_ruling,
      confirming exclusion was the correct call under PREREG-4's own exact-quantity
      justification). The Validator's own L11 non-completion (its probe's coarser timeout
      granularity) is an infrastructure limitation of THAT VALIDATION PROBE specifically,
      disclosed as such, and is not evidence about the lead's own L11 result.

  # ==================================================================
  # 2. THE BRANCH THAT FIRED, AND WHAT IT MEANS, PER CANDIDATE
  # ==================================================================
  termination_branch: >-
    T-INDVERIFY-ARTIFACT-PARTIAL, read off PREREG-4 2.6's frozen precedence: COVERED=12/18
    (all 6 middle-beta cells genuinely UNCOVERED at both candidates, independently
    re-derived by both reviews), SOME-ARTIFACT holds (all 6 hkz covered cells DOES NOT
    EXCEED), so T-INDVERIFY-ARTIFACT fires as the aggregate label under PREREG-4's stated
    precedence, with the -PARTIAL suffix at 12<18. PREREG-4 2.6's own "reports BOTH" rule
    then splits the branch per-cell, by candidate, exactly as this data requires -- lam1n's
    6 covered cells independently satisfy ALL-SURVIVE and fire under T-INDVERIFY-CONFIRMED's
    license; hkz's 6 covered cells all show DOES NOT EXCEED and fire under
    T-INDVERIFY-ARTIFACT's license. BOTH REVIEWS INDEPENDENTLY RE-DERIVED THIS from the raw
    per-cell VERDICT' array with no producer import and CONFIRM IT CORRECT, in aggregate and
    per-cell (Validator section 4; Red Team section 4). Full detail, quotations and
    per-candidate discharge in EV-MLKEM-5aa471 (termination_branch,
    lam1n_confirmed_discharge, hkz_qualification_citable_wording,
    revisit_condition_ruling).

  lam1n_discharge_summary: >-
    lam1n's 6 covered cells DISCHARGE EV-MLKEM-965a37's F-1/RT-1 qualification: D_route' at
    machine epsilon (2.220e-15 to 9.992e-15), independently confirmed at L7 (8/8 bases) and
    L9 (8/8 bases, 6/8 at full precision) by a THIRD implementation (the Validator's, no
    import of the lead's script). BATCH-fbb639's EXCEEDS verdicts at these six cells MAY NOW
    BE CITED WITHOUT the "not under independent verification" caveat. Stated honestly with
    two limitations: L11's numeric lam1n' values remain single-source (the lead's alone;
    the Validator's own probe did not reach L11 within budget); and the Red Team's
    quantification of the L11 near-miss basis (0.0276 residual, would not have flipped the
    verdict but narrows the margin to approximately 1.4x had it been included instead of
    excluded) is recorded explicitly rather than left implicit in the headline "near machine
    epsilon" framing. Full text in EV-MLKEM-5aa471.lam1n_confirmed_discharge.

  hkz_qualification_summary: >-
    hkz's 6 covered cells fire T-INDVERIFY-ARTIFACT correctly and mechanically per PREREG-4
    2.6's frozen precedence (D_route' 0.0153-0.2235). PREREG-4's own default MEANS-text
    attributes this to "a methodological artifact of code-sharing." BOTH REVIEWS,
    INDEPENDENTLY, VIA DIFFERENT METHODS, FOUND STRONG EVIDENCE THIS ATTRIBUTION IS WRONG:
    the reduction/enumeration step is independently verified genuinely non-code-shared by
    both (direct code-body diff plus a structural environmental-impossibility argument), and
    the observed disagreement is instead substantially attributable to a REDUCTION-QUALITY
    MISMATCH -- ROUTE-I' used LLL(delta=0.99)-only reduction for hkz (fpylll unavailable),
    compared against ROUTE-P's genuinely HKZ-quality pipeline. The Validator's evidence: a
    pattern-correlation analysis of the lead's own already-committed numbers showing sign
    consistency (41/48), geometric growth with dimension, and beta-window shrinkage -- a
    signature this goal's own precedent for genuine code-sharing (F-1/RT-1, EXACTLY 0.0
    disagreement) does not produce. The Red Team's evidence: an independently-structured
    SECOND LLL implementation, run on all 24 bases, reproducing essentially the SAME
    0.015-0.223 disagreement with ROUTE-P at every covered cell. THIS DOES NOT CHANGE WHICH
    BRANCH FIRED -- both reviews explicitly confirm it is not arguing for a different
    branch. It changes what the branch's default MEANS-text may be cited as establishing.
    THE PRECISE CITABLE WORDING, adapted from the Validator's own proposed text (VAL-
    20260813-71d65d section 6), verified against that report's cited evidence and
    strengthened with the Red Team's independent second-LLL control, is frozen in
    EV-MLKEM-5aa471.hkz_qualification_citable_wording and MUST travel with any future
    citation of hkz's T-INDVERIFY-ARTIFACT-PARTIAL flag from this batch. hkz's
    T-INDVERIFY-ARTIFACT verdict is NOT to be cited as demonstrating code-sharing was the
    cause of BATCH-fbb639's original hkz EXCEEDS verdicts.

  # ==================================================================
  # 3. THE REVISIT CONDITION -- DISCHARGED HERE, RULED SEPARATELY PER CANDIDATE
  # ==================================================================
  revisit_condition_discharge: >-
    PREREG-4 2.8's revisit condition (restating DEC-20260813-28d7b2's own next_actions text)
    is DISCHARGED IN THIS SAME ARCHIVE, RULED SEPARATELY FOR EACH CANDIDATE, NOT DEFERRED.
    FOR lam1n: the antecedent (D_route' small under genuine algorithmic independence, not
    confounded by reduction quality because lambda_1 is an exact algorithm-independent
    invariant) IS SATISFIED. T-INDVERIFY-CONFIRMED's license discharges EV-MLKEM-965a37's
    F-1/RT-1 qualification for the 6 lam1n covered cells, plainly.
    FOR hkz: the antecedent -- a GENUINE, quality-matched test of whether code-independence
    alone changes the answer -- IS NOT SATISFIED by this batch's own convergent finding.
    ROUTE-I' for hkz is code-independent but is NOT quality-matched (LLL vs ROUTE-P's HKZ
    pipeline), and both reviews' convergent evidence shows the observed disagreement is
    better explained by that quality mismatch than by testing whether BATCH-fbb639's
    original code-sharing was masking a real finding. The test PREREG-4 part (b) actually
    ran for hkz therefore does NOT isolate code-sharing as the explanatory variable: the Red
    Team's independent second LLL implementation shows ANY LLL-quality route disagrees with
    ROUTE-P's HKZ-quality pipeline by roughly this much, REGARDLESS of whether BATCH-fbb639's
    original route was code-shared. THE CONSEQUENT ACCORDINGLY DOES NOT FIRE FOR hkz:
    BATCH-fbb639's hkz EXCEEDS verdicts are NOT flagged methodologically unsupported on this
    batch's evidence alone. hkz's status remains EXACTLY as qualified by BATCH-fbb639's own
    close (the code-sharing caveat of DEC-20260813-28d7b2/EV-MLKEM-965a37) -- NEITHER newly
    confirmed NOR newly flagged unsupported.
    THIS IS A COORDINATOR-LEVEL RULING THAT GOES BEYOND WHAT EITHER REVIEW LITERALLY
    RECOMMENDED (both recommended applying the flag with the causal attribution corrected,
    rather than withholding it -- Validator RC-V1; Red Team next_concrete_action). I judge
    the stronger reading correct because the flag's own stated purpose is a specific causal
    claim (code-sharing caused BATCH-fbb639's original hkz EXCEEDS), and recording that flag
    when this batch's own convergent evidence shows code-sharing is NOT the better-supported
    cause would misinform a future reader who does not read past the flag itself, more than
    it would inform one. This does not reopen, weaken, or contest either review's own
    findings -- both are carried at full weight in EV-MLKEM-5aa471 -- it is a judgment about
    what recording the flag, as opposed to recording the qualified wording alone, would
    communicate.
    T-INDVERIFY-ARTIFACT-PARTIAL ITSELF, AS THE MECHANICALLY-FIRED BRANCH, IS NOT REOPENED,
    RE-SCORED OR REVERSED BY THIS RULING. T-C3LANE-OPEN-PARTIAL ITSELF IS EXPLICITLY NOT
    RETROACTIVELY CHANGED BY ANY OF THIS, exactly as PREREG-4 states throughout. Full
    reasoning in EV-MLKEM-5aa471.revisit_condition_ruling.

  # ==================================================================
  # 4. WHY THIS IS NOT AN EIGHTH OR NINTH CONSECUTIVE GATE REPAIR
  # ==================================================================
  repair_bar_ruling: >-
    RE-DERIVED, NOT MERELY CITED, EXTENDING PREREG-4 2.7'S OWN THREE-PART TEST TO THIS
    DECISION'S OWN ACT OF WRITING A CITABLE QUALIFICATION AND RULING ON A REVISIT CONDITION.
    (1) This decision specifies no criterion, clause, gate or threshold: the qualification
    text corrects what an ALREADY-FIRED branch's ALREADY-WRITTEN default prose may be cited
    as establishing, and the revisit-condition ruling decides whether an ALREADY-DECLARED
    consequent fires on ALREADY-COLLECTED evidence -- neither creates a new rule any future
    candidate would be scored against. (2) This decision re-verifies measurements already
    made (BATCH-fbb639's original comparison, PREREG-4's own part (b) re-run of it) rather
    than measuring a new class of object; it decides nothing about any future candidate.
    (3) Its outcome (a per-candidate discharge/non-flag ruling) is a verification result
    about prior measurements, not a repaired gate's pass/fail; it touches no A-1 sub-clause,
    extends none, and replaces none. THE SEVEN-CONSECUTIVE-INSTRUMENT-BATCH COUNT REMAINS
    SEVEN, unaffected by BATCH-fbb639's part (c) or BATCH-6e08fe's part (b), for the
    identical structural reason PREREG-3 3.6 and PREREG-4 2.7 both independently gave.
    Neither review contests this (Red Team RT-3 of BATCH-fbb639, unmodified; PREREG-4 2.7's
    own re-derivation, unmodified by anything in this batch's review).

  # ==================================================================
  # 5. THE L11 MARGIN, F-1 DRAFTING GAP AND MINOR FINDINGS -- CARRIED, NOT BURIED
  # ==================================================================
  carried_findings: >-
    THE L11 MARGIN (Red Team RT-6): recomputed from the lead's own already-archived
    per-basis timeout log (zero new reduction), 2 of the 3 timed-out L11 bases (indices 1,
    6) were already at 1e-15-scale agreement despite not certifying exact within the time
    cap; the third (basis 5) carried a real 0.0276 residual. Had it been included instead of
    excluded, D_route' for lam1n/L11_b10 and lam1n/L11_b30 would have risen from 9.99e-15 to
    0.0276 -- the EXCEEDS verdict would NOT have flipped (s_c^fib=0.0388 > 0.0276) but the
    margin narrows to approximately 1.4x, materially closer than the reported "near machine
    epsilon" framing implies. Recorded here explicitly, per EV-MLKEM-5aa471.
    F-1, THE NAMED DRAFTING GAP IN PREREG-4 ITSELF (Validator, single-source): whether the
    block-matrix embedding step, not only the numeric matrix A, is licensed as shareable
    under PREREG-4 2.2 is not settled by that document's own text. Both readings are
    recorded in EV-MLKEM-5aa471.f1_prereg4_drafting_gap; neither is resolved here, and no
    number or verdict is affected either way.
    THREE MINOR FINDINGS (Validator F-2, F-3; Red Team RT-5, RT-7 -- F-3 and RT-7 are the
    same finding, found independently by both) are carried at full weight in
    EV-MLKEM-5aa471.minor_findings: a prose-vs-implementation precision gap on the L11
    exclusion flag string; an out-of-band-computed manifest hash for a non-ROUTE-P file; an
    imprecise "no fpylll import anywhere" claim (a harmless capability-probe import, not a
    computational use). None changes any number or verdict.

  # ==================================================================
  # 6. RATIONALE
  # ==================================================================
  rationale:
  - >-
    THE BATCH DISCHARGED ITS PREDECESSOR'S SINGLE NEXT ACTION IN FULL. Part (a) (RC-3) is a
    cheap, correct, mechanical correction, independently re-confirmed by both reviews
    directly against the primary source. Part (b) built the ONE thing DEC-20260813-28d7b2
    named as decisive -- a genuinely non-code-shared second route -- and both reviews
    independently verify it IS genuinely non-code-shared, by direct code-body comparison
    plus (Red Team) a structural environmental-impossibility argument.
  - >-
    THE HARD CALL IS THE SAME SHAPE AS DEC-20260813-28d7b2's OWN HARD CALL, ONE LEVEL
    FURTHER IN. That decision found the branch fired correctly but its default reading
    overstated what the data established (code-shared reproducibility read as independent
    verification); this decision finds the SAME structure: T-INDVERIFY-ARTIFACT fired
    correctly for hkz, but its default MEANS-text (code-sharing) overstates what this
    batch's own convergent evidence supports (reduction-quality mismatch, code-sharing
    independently ruled out). Recording the corrected wording, rather than letting the
    default prose stand or silently applying the flag it licenses, is deliberate for the
    identical reason DEC-20260813-28d7b2 gave: the informal reading a future citation would
    reach for is not the one this batch's evidence supports, and this record exists
    specifically to prevent that informal reading from becoming citable by default.
  - >-
    THE REVISIT-CONDITION RULING FOR hkz IS THE MOST CONSEQUENTIAL, MOST CAREFULLY REASONED
    CALL IN THIS DECISION, AND IT DIVERGES DELIBERATELY FROM BOTH REVIEWS' OWN
    RECOMMENDATION. Both reviews, independently, recommended applying PREREG-4 2.8's flag
    with the causal attribution corrected. I rule instead that the flag's antecedent --
    a GENUINE, quality-matched test -- was not actually run for hkz, so its consequent does
    not fire; applying a "methodologically unsupported, per code-sharing" flag to a finding
    both reviews agree code-sharing did not cause would itself become a citable
    overclaim of the kind this goal's own conventions repeatedly guard against. This
    narrows nothing about hkz's true mathematical properties in either direction -- the
    question remains exactly as open as BATCH-fbb639 left it.
  - >-
    THE CONVERGENCE IS WHAT MAKES THE hkz FINDING ACTIONABLE RATHER THAN SUGGESTIVE. Two
    reviewers, working from the same frozen text without reading each other's write scope,
    independently reached the reduction-quality-confound conclusion by different supporting
    methods -- a pattern-correlation analysis of already-committed numbers plus a
    disconfirmed floor-mechanism control; a freshly-built second independent LLL
    implementation run on all 24 bases. Neither review's finding borrows the other's
    warrant; both are recorded and cited by their own evidence.
  - >-
    THE ADVERSE ITEMS ARE CARRIED RATHER THAN BURIED. The L11 margin quantification, the
    F-1 drafting gap (both readings), and three minor findings are all recorded at full
    weight, none smoothed into a `passed` verdict's silence.
  - >-
    WHAT THIS BATCH IS NOT ALLOWED TO BUY, STATED SO NO LATER READER HAS TO INFER IT. It
    buys no admissibility claim about any lattice, no statement about ML-KEM, no closure of
    the admissibility-gate lane, no declaration that any C3 candidate is safe, no rescoring
    of any prior batch, and no retirement of AM-3.

  # ==================================================================
  # 7. WHAT DOES NOT CHANGE
  # ==================================================================
  binding_carries_restated_and_not_re_litigated:
  - CLAIM TIER STAYS TOY, UNCONDITIONALLY. No number transports to beta = 606, d = 1420 or
    any FIPS 203 parameter set by extrapolation, analogy or any other route.
  - AM-3 IS NOT RETIRED. AM-10 through AM-18 and their carries are in force. BATCH-a44d08
    is NOT RESCORED in any respect.
  - BATCH-4ed139, BATCH-9e3584, BATCH-cbe023, BATCH-6b6e78 and BATCH-fbb639 are NOT
    RESCORED OR REVALIDATED IN ANY RESPECT by anything in this batch.
  - NEITHER SUB-6x COUNT IS CITABLE. "A factor of 6 to 31" is FALSE; the citable range is
    4.87x to 31.03x. "Genuinely cross-platform" is NOT citable.
  - KN-FIND-9d44b4, KN-FIND-7d098b and KN-FIND-9b5df0 ARE PROMOTED, not restated as new
    anywhere in this batch or this record.
  - T-C3LANE-OPEN-PARTIAL CLOSES NOTHING and is EXPLICITLY NOT retroactively changed by
    anything in this decision. This batch closes, pauses and completes nothing.
  - >-
    RULE 12 IS UNMET AND UNWAIVED, AND THIS DECISION DOES NOT EXEMPT ITSELF FROM THE
    STANDARD IT APPLIES TO THE PRODUCER OR TO hkz'S REDUCTION-QUALITY FINDING. Both reviews
    of THIS batch are two SESSIONS ON ONE MODEL and, per both reviews' own measured records,
    the same sandboxed execution recipe as the producer -- including sharing the identical
    fpylll-absence constraint that drove the reduction-quality confound they identified.
    The irony is named rather than left implicit, exactly as EV-MLKEM-965a37 named it for
    its own reviews of the producer's independence claim.
  - THE SPLIT-PRODUCER NOTARIZATION PATTERN IS RETAINED UNCHANGED, having now worked eight
    times and been verified in both directions by independent sessions each time.
    knowledge/INDEX.md must NOT be written, regenerated or staged.

  # ==================================================================
  # 8. EVIDENCE
  # ==================================================================
  evidence_refs:
  - ledger/evidence/EV-MLKEM-5aa471.yaml
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-6e08fe/reviews/TASK-20260813-71d65d/validation_report.yaml
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-6e08fe/reviews/TASK-20260813-7930a6/red_team_report.md
