coordinator_decision:
  id: DEC-20260807-e5b294
  goal_id: GOAL-SSI-001
  context: >-
    Evidence review for EXP-SSI-6a2619 (Frobenius degree census). This experiment
    measured the cumulative distribution of the minimal L-smooth Frobenius-conjugate
    isogeny degree over the full supersingular graph at four toy primes (503, 1019,
    2003, 4003), with L={2,3}. It reports intra-prime exponents beta_hat and a
    cross-prime exponent gamma_hat against a matched random-target null, positive
    controls, and envelope bounds. RUN-SSI-6a2619-001 completed in 202s, all controls
    pass. The pre-registered prediction was gamma=1/2; measured gamma_hat=0.95.
  decision: accept
  decision_scope: >-
    RUN-SSI-6a2619-001 ACCEPTED AS VALID EVIDENCE at strength PRELIMINARY and
    claim_tier TOY. The run produces honest measurements of (beta_hat, gamma_hat) at
    four toy primes. It demonstrates the instrument works (controls pass, constructions
    agree) but does NOT discriminate between the pre-registered prediction
    (gamma=1/2) and alternatives, because the tested primes are too small for
    beta_hat to stabilize. Direction is NEUTRAL: the data is inconclusive for the
    hypothesis at this scale.
  target_ids:
    - EXP-SSI-6a2619
    - RUN-SSI-6a2619-001
    - H-SSI-df550b
    - GOAL-SSI-001
    - EV-SSI-d4e892
  rationale:
    - >-
      CONTROLS ARE CLEAN. Positive control achieves 100% at all primes. Envelope
      control has zero violations. Both vertex-set constructions agree. Sanity
      invariants pass (conjugation closure, ell-2 connectedness, correct sizes).
      The instrument is working correctly.
    - >-
      THE PRIMARY METRICS ARE INCONCLUSIVE. beta_hat drifts from 0.45 to 0.97 across
      the tested range, never stabilizing. The pre-registered fork classified only
      p=503 as CONSISTENT_WITH_1_OVER_2 and the rest as INTERMEDIATE_NO_CLEAR_MATCH.
      No fork condition triggered a decisive outcome.
    - >-
      gamma_hat = 0.95 IS FAR FROM THE PREDICTED 1/2, but this is a 4-point OLS fit
      on data where beta_hat has not converged. If beta_hat is still drifting, the
      cross-prime exponent is measuring a mixture of finite-size effects and the true
      law. A 4-point fit cannot distinguish these.
    - >-
      TREATMENT-NULL SEPARATION IS WEAK AT SMALL p. At p=503, 1019, 2003 the
      treatment-null difference is within or at the null's seed spread. Only at p=4003
      does separation become significant (1.46 vs spread 0.77). This means the
      instrument has low discrimination power at the three smaller primes.
    - >-
      FINITE-SIZE EFFECTS DOMINATE. ANOM-1 (CDF saturates at D=4 for p=503) and
      ANOM-3 (beta_hat drift) both confirm the tested primes are too small for the
      asymptotic regime to emerge. The experiment was correctly designed with four
      primes as a PILOT; the pilot tells us we need larger primes.
  evidence_refs:
    - EV-SSI-d4e892
    - experiments/EXP-SSI-6a2619/runs/RUN-SSI-6a2619-001/execution-report.yaml
    - experiments/EXP-SSI-6a2619/runs/RUN-SSI-6a2619-001/raw-result.json
  limitations:
    - >-
      No independent post-execution review. The instrument was demonstrated to work
      (controls pass) but the execution itself was not independently validated.
    - >-
      Four primes are too few for a reliable cross-prime fit, especially when the
      intra-prime exponent has not stabilized.
    - >-
      L={2,3} only. The optional L={2,3,5,7} extension was not implemented (DEV-2).
      Larger smoothness sets may change the picture.
    - >-
      Graded control non-monotonicity prevents shell-level localization of deviations.
  next_actions:
    - >-
      EXTEND TO LARGER PRIMES. The pilot tells us that p >= 10007 is needed before
      beta_hat stabilization can be assessed. Design a successor experiment at
      p in {10007, 20011, 40009, 80021} (or similar, 4 primes spanning one decade
      above the current range). This is the highest-priority next step for this
      sub-question.
    - >-
      ASSESS COMPUTATIONAL FEASIBILITY. The full supersingular graph at p=80021 has
      |S| ~ 6668 curves and the {2,3}-smooth graph computation at that scale needs to
      be budgeted. If the wall clock exceeds 3600s, consider L={2} only (faster graph
      build) or sampling rather than full enumeration.
    - >-
      IF beta_hat STABILIZES NEAR 0.95 AT LARGER PRIMES: this would WEAKLY SUPPORT
      a scaling exponent near 1 rather than 1/2, which would have implications for
      H-SSI-df550b. But that is conditional on future data.
    - >-
      IF beta_hat CONTINUES TO DRIFT: the hypothesis's distributional prediction may
      not have a well-defined exponent at accessible scales. Record this as an
      honest negative scope result.
    - >-
      DO NOT PROMOTE. No knowledge entry is warranted from toy-scale inconclusive
      measurements with unstabilized exponents.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Evidence is preliminary, direction is neutral, claim tier is toy. beta_hat has
      not stabilized, treatment-null separation is weak at 3 of 4 primes, and the
      cross-prime exponent contradicts the prediction but on too few data points to
      be decisive. Nothing here meets the threshold for knowledge promotion.
  decided_by: coordinator
  decided_at: '2026-08-07'
