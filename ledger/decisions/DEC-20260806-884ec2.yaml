coordinator_decision:
  id: DEC-20260806-884ec2
  goal_id: GOAL-MLKEM-003
  batch_id: null
  batch_id_note: >-
    Not a batch decision. This is a goal-state decision taken between BATCH-017
    and BATCH-018, on a divergence discovered by the pre-batch merge.
  evidence_id: null
  evidence_id_note: >-
    No evidence record. This decision rests on a user instruction and on git
    state, not on a measurement. No mathematical claim is advanced by it.
  recorded_by_task: null
  archive_kind: ledger
  recorded_at: '2026-08-06'
  decision: resume
  decision_label: main_closure_superseded_by_budget_removal_goal_remains_active

  context: >-
    The BATCH-018 pre-batch merge of origin/main revealed that a parallel
    execution of GOAL-MLKEM-003 on main had closed the goal with status
    `closed_at_budget`, while this line had continued to BATCH-017 and remains
    `active`. Eight GOAL-MLKEM-003 paths collided. The collision itself, the
    resolution mechanics and the byte-level verification are recorded in
    CORR-20260806-d86487; this decision records only the goal-state consequence.

  central_adjudication: >-
    MAIN'S CLOSURE WAS CORRECT WHEN IT WAS MADE AND IS SUPERSEDED NOW, AND THE
    REASON IS THE INSTRUCTION, NOT THE RIVALRY. Main closed GOAL-MLKEM-003 as
    `closed_at_budget` with the stated reason `maximum_batches: 12` exhausted.
    That is a budget pause condition, and it is precisely the condition the user
    lifted for this campaign, recorded on this line as DEC-20260802-0c6eb4. An
    execution that closes on a budget it was given, when the budget has since
    been removed by the person who set it, is superseded by the removal rather
    than mistaken. GOAL-MLKEM-003 therefore REMAINS ACTIVE, and this line is
    authoritative for it on the user's explicit decision. Nothing about main's
    findings is disturbed: no record of main's is withdrawn, corrected or
    contradicted here, and no agreement between the two lines is asserted.

  what_this_decision_does:
    - >-
      Records that main's `closed_at_budget` on GOAL-MLKEM-003 is SUPERSEDED for
      this line by the removal of budget limits (DEC-20260802-0c6eb4), and that
      the goal's official status remains `active` at BATCH-017.
    - >-
      Records that `claude/harness-findings-repo-yyzt1x` is authoritative for
      GOAL-MLKEM-003 going forward, on the user's decision of 2026-08-06.
    - >-
      Leaves every record of main's parallel execution in place, unmodified and
      un-withdrawn.

  what_this_decision_does_NOT_do:
    - >-
      It does NOT declare main's execution wrong. Main closed correctly under the
      budget it had.
    - >-
      It does NOT treat the two executions as replications of each other. They
      ran different tasks under colliding batch identifiers, agreement between
      them has not been checked, and no such agreement may be asserted.
    - >-
      It does NOT advance, retract or strengthen any mathematical claim. No
      evidence record is created and no hypothesis moves.
    - >-
      It does NOT reopen GOAL-MLKEM-004 or touch any record of it, including
      EV-MLKEM-4a9cfe, which arrives from main schema-noncompliant and is another
      session's immutable record.

  hypothesis_status_changes: []
  hypothesis_status_note: >-
    No hypothesis moves. A goal-state and authority decision carries no
    mathematical content.

  rule_12_status: >-
    UNMET AND UNWAIVED. EV-MLKEM-011, EV-MLKEM-013 and EV-MLKEM-017 keep their
    official status; KN-FIND-031 stays withdrawn.

  closure_quorum_status: >-
    NOT APPLICABLE AND NOT ASSERTED. This decision keeps a goal open; it does not
    close one. No `completion_quorum` block is created, and none is needed. If
    GOAL-MLKEM-003 is closed later, that closure carries its own standard.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Nothing measured, nothing to promote. The transferable observation -- that
      the harness has no claim or lease on a dispatched goal, so two sessions can
      mint the same batch identifiers for different work and discover it only at
      merge time, and that random identifier allocation does not prevent this
      because the collision is in the WORK rather than the token -- is now on its
      SECOND occurrence in one campaign (CORR-20260802-d8ba0e was the first). It
      is a harness defect rather than a research finding, it is recorded in
      CORR-20260806-d86487, and it is named here so a successor does not need a
      third occurrence to notice the pattern.
    promote: false

  non_claims:
    - ML-KEM is not broken. This decision bears on no mathematical question.
    - KN-OPEN-016 remains open.
    - No asymptotic claim advanced. No closure quorum asserted.
    - >-
      The two parallel executions are NOT mutual corroboration and must never be
      cited as such.

  next_actions:
    - >-
      Proceed to BATCH-018 as already specified by DEC-20260803-95176a and
      carried in the GOAL-MLKEM-003 next_action: build the JOINT null carrying
      cross-cell dependence and re-test the low-occupancy deficit and the
      model-free detrended var/mean against it, pair it with the cross-file
      identification move, widen the declared artifact list to close validator
      defect D-10, and require an independent validation in the same batch.

  references:
    - GOAL-MLKEM-003
    - CORR-20260806-d86487
    - DEC-20260802-0c6eb4
    - DEC-20260803-95176a
    - CORR-20260802-d8ba0e
    - EV-MLKEM-890e2a

  target_ids:
    - GOAL-MLKEM-003

  inventor_accounting:
    dominated_by: n/a (no result claimed)
    sota_delta:
      time_exponent: 0.0
      memory_exponent: 0.0
      data_query_improvement: 0
      cryptographic_security_bits_reduced: 0
    named_obstruction: >-
      The harness has no claim or lease on a dispatched goal or batch, so
      parallel sessions can duplicate work under colliding identifiers and only
      discover it at merge time. Second occurrence in this campaign.
    forward_guidance: >-
      Merge main before every batch, as the skill requires; that is what caught
      this. Never treat a parallel execution as corroboration without checking
      it.

  decided_by: coordinator
  decided_at: '2026-08-06'
  decision_authority: >-
    The authority decision is the user's, taken 2026-08-06 in response to a
