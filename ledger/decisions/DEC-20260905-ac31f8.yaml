coordinator_decision:
  id: DEC-20260905-ac31f8
  recorded_at: '2026-09-05'
  goal_id: GOAL-AES-003
  question_id: RQ-AES-003
  batch_id: BATCH-169639
  decision: open_batch
  decision_rationale_for_verb: >-
    Batch-opening decision for the EXECUTION-DESIGN REPAIR LANE named as
    RANK 1 by the goal head after DEC-20260905-7d0311 (the
    execution-design audit composition of BATCH-a019c8, on main via
    PR 762 / merge commit 72854f0f7). That round produced a complete,
    arithmetically exact 17-arm D-2 execution design whose two artifacts
    disagree: the machine-readable mirror directs an executor to run 8 of
    the 10 floor arms at (seed, armid) pairs different from the governing
    YAML, and P5 admissibility - whether ANY floor sentence is ever
    composed - hangs on which list binds (RT4-F1; independently found by
    mutually blind J-D1 F-1/F-2 and J-D2 RT4-F1/RT4-SR-1). The design is
    NOT FIT for authorization as authored. This batch executes the scoped
    repair: a SUPERSEDING design record under a new id (the snapshot
    artifacts at 8616e32c7 are immutable and are never edited), then a
    FOCUSED re-review. ZERO ARMS: this batch remains design-only; the
    authorization decision, if ever taken, is a separate committed
    Coordinator decision after the repaired design passes re-review.

  context: >-
    GOAL-AES-003's FM-cascade line completed its design-gate sequence
    (BATCH-e479db, BATCH-519c76, BATCH-a861e9) and its
    execution-authorization preparation round (BATCH-a019c8). The
    candidate is IDEA-20260904-6aed0b; the realized anchor readings are
    h(4)=17/21, h(8)=13/18, h(16)=12 at 2^30 trials per arm, cell (1,1),
    r=5, PIN-T0, exact Garwood 95% CI [9.903, 27.219] for 17 (29.2 is a
    citation error that must never reappear as a live value). The
    BATCH-a019c8 design committed: 17 arms x 2^30 = 18,253,611,008
    trials; per-arm FP price 0.171940 + 0.018883 = 0.190823 on the 8
    plateau-composing arms; grand accounting sum 1.526584 (not an event
    probability); compute 17 x 1620 s = 27,540 s, cap 29,500 s; memory
    4 GB; R5-3 NON-reliance posture (AC-1/AC-2 dormant). ALL of those
    quantities were independently verified correct where the two
    artifacts agree, and NONE of them changes in this repair. The repair
    items are exactly: RT4-SR-1 (BLOCK) one committed (seed, armid) list
    identical across record and mirror; J-D1 F-2 the seed derivation rule
    reproduces the table exactly (or explicit enumeration replaces it);
    J-D1 F-3 priced-semantics statements on the two bound-carrying
    sentences that lack them; RT4-SR-2 (REVISE) remove the false
    exact-Garwood derivation for G4 = 39, threshold kept; J-D1 F-4
    resolve the pointer-form R5-1 carriage against the design's own
    not-by-pointer rule explicitly; RT4-SR-3..RT4-SR-6 disclosures
    carried into the repaired record.

  target_ids:
    - IDEA-20260904-6aed0b
    - DEC-20260905-7d0311
    - GOAL-AES-003
    - RQ-AES-003

  ecc_priority_note: >-
    GOAL-AES-003 is non-ECC. ECC priority was considered at the
    2026-09-05 selection point that opened BATCH-a019c8
    (DEC-20260905-1ea7a0 ecc_priority_note): every ECC offer of ranked
    work was held by a live session (GOAL-ECDLP-001's queue renders empty
    and its review round sits on coordinator-harness-ecdlp-2's live
    branch; SCURVE/ECRANK work is carried by coordinator-aes-1). This
    batch is the DIRECT CONTINUATION of that same in-flight ranked
    campaign - the repair lane its own closing decision set as RANK 1
    minutes ago - not a new selection; no ECC-priority re-derivation is
    owed for continuing an already-ranked, uncontested in-flight action.
    If any ECC offer becomes unheld at the next true selection point
    (after this batch closes), it is considered first there.

  inference_note: >-
    Role-bound opencode subagent bindings (idea-generator, validator,
    red-team) remain balance-dead in this environment; per the
    DEC-20260903-16bfc2 disclosure path, all three worker tasks are
    dispatched as general agents carrying their full role contracts,
    recording fallback_used true, model_verified false, resolved model
    fireworks-ai/accounts/fireworks/models/qwen3p8-max, as in the five
    prior batches.

  coordinator_prior: >-
    Recorded BEFORE any worker runs, per the review-architecture
    obligation. What I expect this round to find:
    (1) THE MIRROR IDENTITY IS THE WHOLE BALLGAME. The repair is
    mechanical: one committed (seed, armid) list, the rule reproducing it
    exactly or replaced by explicit enumeration, the mirror byte-faithful
    to it. I expect the producer to succeed at the list and I expect the
    MOST LIKELY FAILURE to be a residue of the old inconsistency - e.g.
    the mirror fixed while some prose section of the design still quotes
    the old floor-seed assignment, or the derivation rule "fixed" in a
    way that reproduces the table only under an unstated reading. The
    validator's re-derivation must apply the rule MECHANICALLY, without
    charity, and must search the whole record for stale quotations of the
    superseded assignment.
    (2) THE P5 SEAM CLOSES IF AND ONLY IF exactly one list is committed
    AND every P5-admissibility reference points at that list and nothing
    else. I expect the red team to confirm closure on the declared paths
    and to hunt for any NEW post-data discretionary choice the repair
    itself introduces (a repair that adds an "executor shall reconcile"
    or "in case of mismatch" clause would REOPEN the seam in a worse
    form - any such clause is a BREAKS-level finding).
    (3) NO NEW LICENSING SURFACE. The repair is fidelity work: no
    sentence may become stronger, no gate weaker, no scope wider. Any
    licensing delta beyond the five named fix items is a finding; a
    licensing delta that strengthens a sentence is BREAKS-level.
    (4) F-4 RESOLVES EXPLICITLY IN ONE DIRECTION. Either the ~9
    pointer-form sites are inlined or the not-by-pointer rule is
    explicitly relaxed with a recorded rationale; a silent inconsistency
    between the rule and the practice is a REVISE finding.
    (5) THE OUTCOME MAP IS UNTOUCHED IN SUBSTANCE. BATCH-a019c8's map
    passed complete with zero rejected sentences; the repaired record
    should carry it verbatim (or by explicit immutable reference), and
    any substantive change to it is unexplained scope creep and a
    finding.
    A round that confirms all five points is the expected outcome; a
    round that overturns any is more informative than one that confirms
    all; the prior exists so the difference is measurable.

  review_plan:
    prior_recorded_at: '2026-09-05'
    prior_recorded_in: this decision, before any worker ran
    joints:
      - id: J-R1
        owner: validator (TASK-20260905-92ad3c)
        joint: >-
          REPAIR FIDELITY AND MECHANICAL RE-DERIVATION. (a) Apply the
          repaired record's seed derivation rule mechanically to its own
          arm table in fresh sealed code - no charitable reading - and
          confirm exact reproduction of every (seed, armid, position,
          arm-class) tuple; (b) confirm the machine-readable mirror is
          semantically IDENTICAL to the governing record's committed list
          (every tuple, both directions, no extras, no omissions);
          (c) search the entire repaired record for stale quotations of
          the superseded assignment (531105/531110 as floor seeds, the
          old derivation rule text, the old mirror tuples) - any live
          residue is a finding; (d) confirm the two F-3 sentences now
          carry priced-semantics statements and that NO OTHER
          bound-carrying sentence lost one; (e) confirm the exact-Garwood
          derivation for G4 = 39 is removed and the threshold 39 itself
          is unchanged; (f) confirm all previously verified quantities
          are UNCHANGED (0.190823 per-arm, 1.526584 sum, 17 x 2^30
          trials, 27,540 s / 29,500 s cap, 4 GB, anchor readings,
          Garwood CI [9.903, 27.219], gates verbatim); (g) confirm the
          repaired record SUPERSEDES by reference and the snapshot
          artifacts at 8616e32c7 are untouched on disk.
        coordinator_expectation: >-
          Passes on (a)(b)(d)(e)(f)(g); the live residue hunt (c) is
          where I expect any finding.
      - id: J-R2
        owner: red-team (TASK-20260905-4da4f3)
        joint: >-
          P5-SEAM RE-ATTACK ONLY (focused scope, declared here). (a)
          Re-run the full stopping-rule attack suite of BATCH-a019c8
          J-D2 against the repaired record with ONE question: after the
          repair, does ANY post-data discretionary path remain anywhere -
          declared or undeclared - that could swing a verdict between
          halt-no-sentence and compose-sentence? (b) Attack the repair
          itself: any reconciliation clause, mismatch-handling clause,
          executor-discretion language, or ambiguity about WHICH record
          governs if record and mirror ever diverge again is a
          BREAKS-level finding; (c) confirm the outcome map is carried
          without substantive change (spot-audit the margin-zone rows and
          the two report-only k=8 arms); (d) confirm no prohibited
          sentence entered via the repair text; (e) confirm RT4-SR-3..6
          disclosures are carried; (f) rule AC-1/AC-2 still dormant under
          the repaired record's reliance posture.
        coordinator_expectation: >-
          Seam closed; the attack on the repair text (b) is where a
          surprise would live.
    blindness:
      mode: mutual
      detail: >-
        J-R1 and J-R2 are mutually blind fresh sessions; neither reads
        the other's directory; each attests to what it read. Blindness is
        NOT lifted: this is a focused re-review, not a hardening round,
        and the two joints attack disjoint surfaces (fidelity vs
        licensing).
      lifted_for: null
    proves_too_much_control: >-
      J-R2 re-runs the known-false routing on the repaired record for the
      inherited objects (OBJ-3, OBJ-4, OBJ-5B at minimum): a repair that
      accidentally reopened FM-PLATEAU-CONSISTENT routing for a
      known-false object would be caught here. This is the argument-level
      control (known-false objects) applied to the repaired design.
    blind_rederivation:
      quantity: the committed (seed, armid) arm list and its derivation rule
      blind_from: >-
        J-R1 re-derives the list from the repaired record's DECLARED RULE
        and arm-class/position structure alone, in fresh sealed code,
        never reading the producer's mirror-construction script or notes;
        the mirror is then compared against the re-derivation, not the
        other way round.
      note: >-
        This is not replication: deriving from the producer's own mirror
        would reproduce a wrong-but-self-consistent construction
        faithfully, which is exactly the failure mode BATCH-a019c8
        exposed.

