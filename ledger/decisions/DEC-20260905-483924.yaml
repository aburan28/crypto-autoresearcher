coordinator_decision:
  id: DEC-20260905-483924
  decision: approve
  decided_by: coordinator
  decided_at: '2026-09-05'
  context: >-
    The user requested 20-80 new ECDLP and ECC ideas, then explicitly requested
    a PR and continuation. This decision approves a bounded 48-proposal batch
    after the separate administrative repair closes through its declared gates.
  target_ids:
    - BATCH-c86946
    - TASK-20260905-2bccc0
    - TASK-20260905-551da2
    - TASK-20260905-0a0340
    - TASK-20260905-2b1823
    - TASK-20260905-2988d1
    - TASK-20260905-03d057
    - TASK-20260905-0be63d
    - TASK-20260905-8dd9a4
    - TASK-20260905-834eb0
  authority_scope: proposal_generation_filing_and_quality_review_only
  effectiveness_conditions:
    - >-
      DEC-20260905-487021 and the actual independent repair report are archived;
      the repair archive and full ledger checks pass. This decision does not
      assert that those events have occurred.
    - >-
      The frozen queue gives filing task TASK-20260905-2988d1 read access to the
      coverage plan, templates/research-records.md and agents/idea-generator.md.
    - >-
      Both independent review cards give read access to ledger/questions/,
      ledger/RQ-DREG-001.yaml, ledger/RQ-SIG-001.yaml, ledger/hypotheses/,
      knowledge/, the goal inventory and the verified snapshot receipt.
    - >-
      The snapshot handoff identifies its own archive task as archived_by
      or leaves that field null; it does not assign its artifact to the later
      ledger archive. Snapshot record_ids names every new handoff it archives.
    - >-
      Root commits the concrete coverage plan, inventory, queue and handoffs;
      the current dispatcher and ledger checks pass before any producer starts.
  rationale:
    - >-
      The allocation binds 48 reserved IDs to 44 active or draft ECC goals and
      58 unique questions. Set comparison found no missing goal or question;
      applicability remains a producer and reviewer obligation, not a result
      established by attaching metadata.
    - >-
      Allocate 20 proposals to ECDLP and algebraic machinery, 12 to isogenies
      and rank, and 16 to curve certificates, signatures, auxiliary input and
      pairing costs. Eight shared SafeCurves mechanisms cover twenty curve
      questions without counting curve renamings as separate ideas.
    - >-
      Three generators own disjoint task bundles. A Coordinator filing task
      copies complete idea bodies into their canonical proposal paths. The
      snapshot archives authority, bundles and canonical copies before two
      fresh independent sessions assess quality, provenance and distinctness.
  budget:
    max_concurrent: 3
    wall_clock_seconds_per_task: 1800
    memory_gb_per_task: 2
    maximum_runs: 0
  ranking_basis: >-
    Prioritize distinct structural mechanisms, representations and compositions
    that expose a decision-changing mathematical uncertainty. Require a named
    cheap discriminating test and charge setup, transport, memory and data.
    Duplicate or untestable candidates return for revision; capacity is not a
    reason to pad the count.
  archival_plan:
    snapshot_task: TASK-20260905-03d057
    snapshot_binding_mode: content_first
    binding_declared_before_generation: true
    binding_reason: >-
      The package deliberately spans the initial authority freeze and later
      producer and canonical-filing commits. Reachable commit and parent
      bindings, all record IDs and every exact artifact hash remain required.
    ledger_task: TASK-20260905-834eb0
    closing_decision: DEC-20260905-2aa2a6
    publication: Update the already authorized PR after each archive.
  review_allocation:
    validator: >-
      TASK-20260905-0be63d checks every record's required fields, source
      provenance, controls, and substantive goal/question coverage.
    red_team: >-
      TASK-20260905-8dd9a4 challenges mechanism distinctness, nearest-work
      differences, cost accounting and known-false controls.
    blindness: >-
      Fresh sessions; neither reviewer reads the other's report. Both disclose
      the exact source artifacts read and report per-ID defects within scope.
    limitation: >-
      These are proposal-quality reports. They do not certify mathematical
      correctness, global novelty, successful experiments or a breakthrough.
  review_plan: null
  review_plan_note: >-
    No scientific claim, hypothesis status or lane closure is under review.
    A later claim-changing review requires its own pre-recorded review plan.
  limitations:
    - All ideas remain status proposed and novelty_status unverified in this batch.
    - No experiments, attack implementations, extraction procedures or third-party target operations.
    - No hypothesis or goal status transition, experiment approval or knowledge promotion.
    - Eight terminal goals provide historical context only and are not reopened.
    - Primary retrieval and local comparison never prove global novelty by absence of a match.
    - Conditional complexity targets require named assumptions and time, memory and data accounting.
  evidence_refs:
    - coordination/ecc-ideas-20260905-c86946/coverage-plan.json
    - coordination/ecc-ideas-20260905-c86946/goal-inventory.json
    - coordination/ecc-ideas-20260905-c86946/dispatch_queue.json
    - orchestration/research-priority.yaml
  citations:
    - ref: orchestration/research-priority.yaml
      provenance: internal
      verified_by: TASK-20260905-c81c06
      claim: Canonical ECC area membership governs the supplied goal inventory.
  knowledge_promotion:
    promoted: []
    not_warranted: Candidate generation and proposal-quality review supply no new scientific result.
  next_actions:
    - >-
      After every effectiveness condition is met, render and claim the three
      ready producer cards; file complete proposals, snapshot, independently
      review, and archive the scoped synthesis. Do not dispatch experiments.
  inference:
    requested_policy: coordinator-orchestration-code
    runtime: native_codex
    resolved_model_id: null
    model_verified: false
    provenance_note: >-
      Native inherited Coordinator session. No independent model probe or
      exact backend attestation is available to this author; no model or epoch
      is inferred from requested configuration.
    fallback_used: false
    degraded_requirements: []
