  decision_rationale_for_verb: >
    Opens BATCH-ef0456 to execute the goal head's RANK 2 (set by
    DEC-20260905-b4a4fa): /design-experiment on IDEA-20260905-d5608c
    (multi-twist-class forcing, s(a_i) = d_i * square at once). Per ECC
    instruction 3, open ECC ideas are DESIGNED, not shelved: this batch
    converts the filed proposal into a `specified` hypothesis
    (H-ECRANK-ee6e0e) and a frozen experiment contract
    (EXP-ECRANK-76a70d) with controls, metrics, seeds and replication,
    budget, stopping and invalidation rules, success and falsification
    criteria, and required artifacts. DESIGNING IS NOT APPROVING: the
    contract sits at approved_by null and status review_required; approval
    is a separate gate (user confirmation per the design-experiment skill,
    then a committed Coordinator decision) that authorizes execution and
    spends compute. No execution runs in this batch. IMP-2 stands
    untouched: RANK 1 (the breakthrough-tier round on the UNPROMOTED
    C1-closure candidate) remains gated on the doctor probe.
  context: >
    IDEA-20260905-d5608c was filed by BATCH-05103f (DEC-20260905-b4a4fa,
    FILED-AS-PROPOSED): mechanism M0-M6 grounded in the committed
    construct_highrank.py / twist_family.py machinery; parameter count
    n + (n-1) - (n-5) = n+4 dimensional family for n >= 6; multi-class
    forcing survives at n = 8 (4 classes x 2 points, density exponent +1),
    borderline at n = 10 (exponent 0); ELLIPTICITY WALL past n = 10
    (deg s = n/2 - 1; HEUR-1 density H^(5 - n/2)) with the wall-crossing
    route UNPRICED; dominated_by null after an 8-row frontier check;
    sota_delta quantitative (axis B: descent-free k = 3 total 0 -> >= 8);
    five numbered predictions P1-P5 each with a falsifier; frozen test
    boundary with four controls (known-false d = 1; null-object scan; blind
    kernel re-derivation; degeneracy filter); six falsification conditions;
    two numbered heuristics (HEUR-1 density; HEUR-2) with random-model
    justification. The design producer converts exactly this record -- it
    adds no new mechanism and silently drops nothing: every wall, heuristic,
    and honesty note of the idea must appear in the hypothesis or the
    contract or be explicitly excused with a reason.
  target_ids:
    - BATCH-ef0456
    - IDEA-20260905-d5608c
    - H-ECRANK-ee6e0e
    - EXP-ECRANK-76a70d
  design_class_note: >
    The design-experiment skill's HEURISTIC-VALIDATION pattern applies
    first-class: the hypothesis conditions the construction on HEUR-1 (and
    HEUR-2), so the frozen contract must state each heuristic exactly
    (quantifiers, distribution, the rigorous results it interpolates
    between), carry a PRE-REGISTERED prediction with its source (written
    before any run, never adjusted afterward), state scale access and any
    transfer assumptions, derive the sample count from the smallest
    predicted probability the experiment must resolve (with the expected
    tail count multiple stated), predefine the distribution-comparison
    metric including tail checks, and carry the minimum controls: a
    synthetic uniform control of matched shape, independence of instances
    and seeds, and a second parameter set at a different scale. The
    success criterion must be decidable from the predefined metrics --
    reject contracts where no possible outcome would count as negative.
  coordinator_prior: >
    Recorded BEFORE the design producer runs. What I expect the frozen
    contract to contain, and where I think it breaks: (1) DECIDABILITY --
    the largest risk is a success criterion that cannot fail ("construct
    any curve with forced points on four classes" succeeds given enough
    solver time); the criterion must bind a falsifiable target tied to the
    idea's P1 (a certified k = 3 total contribution from the forced classes
    at a stated budget), and I expect the producer to be pulled toward the
    unfalsifiable phrasing -- that is where I think it breaks; (2)
    SAMPLE-SIZE DERIVATION -- the skill requires the sample count derived
    from the smallest predicted probability to resolve, with the expected
    tail multiple stated; this is the most commonly skipped field and I
    expect it to be missing or hand-waved unless the producer does the
    H^(5 - n/2) arithmetic explicitly at the chosen n; (3) CONTROL
    BINDING -- the known-false d = 1 control must appear in the
    INVALIDATION rules (its failure voids the run), not as decoration; the
    null-object scan and degeneracy filter likewise; (4) BUDGET
    CONSISTENCY -- the idea's own estimate is ~10^8-10^10 exact ops for
    joint forcing; the contract's budget and stopping rules must be
    consistent with that estimate, and the tension between the n = 8
    target (4 classes x 2) and a bounded budget must be resolved by fixing
    the scope, not by an unbounded run; (5) WALL DISCIPLINE -- the
    contract's scope is n <= 10; nothing in it may silently promise the
    unpriced wall-crossing route; (6) STATUS DISCIPLINE -- hypothesis
    `specified`, experiment `review_required`, approved_by null; any
    self-approval in this batch is a violation. Comparison rule: the
    closing decision compares the frozen contract against these six points
    and records any overturning.
  review_plan: null
  review_plan_note: >
    No claim-changing review round inside this batch: the design produces
