# FILED under ledger/decisions/DEC-20260814-1445a1.yaml by TASK-20260814-5870c1
# (GOAL-QALG-001 BATCH-dbf57a). Closing decision for this batch's design-stage
# red-team review. Administrative in the sense that no hypothesis exists in
# supported/weakened/etc. status to transition here -- both H-MLKEM-36f511 and
# H-CSIDH-3eaede stay `proposed` -- but this IS an official Coordinator
# decision governing whether either handoff may be dispatched, and it is
# binding on the next batch.
coordinator_decision:
  id: DEC-20260814-1445a1
  context: >-
    BATCH-dbf57a produced two Coordinator-approved, frozen experiment
    contracts (EXP-MLKEM-12d9b8 for H-MLKEM-36f511, from
    IDEA-20260813-02479f; EXP-CSIDH-c65945 for H-CSIDH-3eaede, from
    IDEA-20260813-e6d55d) and two matching Executor handoffs
    (ledger/handoffs/TASK-20260814-807901.yaml,
    ledger/handoffs/TASK-20260814-a82a19.yaml), both explicitly self-marked
    DO NOT DISPATCH pending this batch's own independent red-team review.
    That review, TASK-20260814-11516e (RT-20260814-41d4cc, independent
    session, policy review-adversarial, reasoning_effort xhigh), read both
    contracts fresh and returned verdict HOLD-FOR-REVISION for BOTH:
    MLKEM-OBJ-1 (moderate) shows Simon 2026's own stated minimal sample
    count Q at ML-KEM-512 exceeds the combinatorial ceiling of self-
    reduction samples by roughly 20 orders of magnitude even under the
    most generous ring-compatible coefficient bound, undisclosed in the
    contract, foreclosing the "REALIZABLE" branch independent of whatever
    the Executor would compute and leaving the tail_checks "extreme-B
    check" instruction without an operational stopping rule. CSIDH-OBJ-1
    (major) shows the applicability audit's required citation of four
    primary sources at page/section/lemma granularity (CSI-FiSh, Kuperberg
    2005, Regev 2004, Ettinger-Hoyer) is materially under-budgeted and
    under-disclosed: none of the four are staged in inputs/, three of four
    have knowledge-base entries this program's own curators marked
    unverified/"paper not read", the fourth has no knowledge-base entry at
    all, and the contract's stopping_rules name a BLOCKED/NOT-COMPUTED
    escape valve for only one of the four sources. Full detail in
    EV-QALG-4f140a and the red-team report itself
    (coordination/goals/GOAL-QALG-001/batches/BATCH-dbf57a/tasks/TASK-20260814-11516e/red_team_report.yaml).
    Neither objection invalidates the underlying research directions or
    hypotheses; both are narrow, protocol-level defects the red-team itself
    states are resolvable by a versioned protocol_amendment without
    re-scoping either experiment or re-running the design work.
  decision: revise
  target_ids:
    - H-MLKEM-36f511
    - EXP-MLKEM-12d9b8
    - H-CSIDH-3eaede
    - EXP-CSIDH-c65945
    - TASK-20260814-807901
    - TASK-20260814-a82a19
    - TASK-20260814-11516e
  rationale:
    - >-
      No hypothesis in this batch is in a status (supported / weakened /
      reject_scoped / etc.) that this decision could transition: both
      H-MLKEM-36f511 and H-CSIDH-3eaede remain `proposed`, as they were
      filed at design time by TASK-20260814-1b47ba / TASK-20260814-bdf473,
      and stay `proposed` after this decision -- no run has occurred that
      could move either past that status.
    - >-
      Both EXP-MLKEM-12d9b8 and EXP-CSIDH-c65945 stay `status: approved,
      frozen: true` (approval and freezing of the protocol text is not
      revoked by a red-team hold) but `execution_authorized: false` in
      both remains correct and is NOT flipped by this decision:
      TASK-20260814-11516e's HOLD-FOR-REVISION verdict on both contracts
      is exactly the condition both handoffs' own DO NOT DISPATCH notices
      named as the thing that must be "resolved" before dispatch, and it
      has not been resolved -- it has been confirmed and detailed.
    - >-
      docs/task-lifecycle.md / .claude/skills/design-experiment/SKILL.md's
      "Rules" state that after approval the protocol is frozen and any
      later change requires a versioned protocol_amendment under
      experiments/<EXP-ID>/amendments/. This Coordinator decision does
      NOT itself write those amendments (that is design work, out of this
      ledger-archive task's write_scope and this task's own role); it
      records that they are required and directs a follow-up batch to
      produce them.
    - >-
      Per CLAUDE.md's conditional-result pairing rule, both contracts
      are pre-compute realizability/applicability gates on a DCP-route
      family (a conditional mechanism), so any future dispatch of either
      must remain paired, in the same or a following batch, with the
      heuristic-validation and proof-of-concept work this program's
      pairing rule and the two hypotheses' own heuristic_assumptions
      already name (HEUR-MLKEM-36f511-1's exact-identity status requires
      no separate validation; HEUR-CSIDH-3eaede-1 / H1 is explicitly
      NOT tested by EXP-CSIDH-c65945 and awaits a not-yet-designed
      toy-simulation experiment) -- unaffected by, and not resolved by,
      this decision.
  evidence_refs:
    - EV-QALG-4f140a
    - coordination/goals/GOAL-QALG-001/batches/BATCH-dbf57a/tasks/TASK-20260814-11516e/red_team_report.yaml
  limitations:
    - >-
      This decision does not itself resolve either objection; it directs
      where that resolution happens (a follow-up protocol-amendment
      batch), consistent with the Coordinator's role of approving and
      directing, not authoring, protocol text or executor-facing design
      work.
    - >-
      MLKEM-OBJ-1's ~20-order-of-magnitude arithmetic and CSIDH-OBJ-1's
      corpus-staging findings were computed/checked by one independent
      red-team session; neither has been independently re-verified by a
      third session as of this decision. A future batch should treat this
      as a starting point for the protocol_amendment, not as
      independently triple-checked fact, though the underlying arithmetic
      (order-of-magnitude comparison of two exact integers) and the
      corpus search (presence/absence of files and knowledge-base
      confidence labels) are both mechanically re-checkable by anyone.
    - >-
      CSIDH-OBJ-2 (unpinned outcome-A/B interpretive boundary) and
      CSIDH-OBJ-3 (cross-source-agreement control's actual epistemic
      weight) were also raised by the red-team as moderate/minor findings
      against EXP-CSIDH-c65945; this decision's required_controls for the
      follow-up batch (see next_actions) name only the two most
      load-bearing objections (MLKEM-OBJ-1, CSIDH-OBJ-1) explicitly, per
      this task's own scope, but the follow-up batch's protocol_amendment
      for EXP-CSIDH-c65945 should address CSIDH-OBJ-2 and CSIDH-OBJ-3 too,
      per the red-team's own required_controls list, before that handoff
      is considered fully cleared.
  next_actions:
    - >-
      Open GOAL-QALG-001's batch 3 of 5 as a protocol-amendment batch (not
      a dispatch batch) that produces, per docs/task-lifecycle.md's
      protocol_amendment mechanism (never a silent edit to the frozen
      specification.yaml files): (a) for EXP-MLKEM-12d9b8, a versioned
      amendment under experiments/EXP-MLKEM-12d9b8/amendments/ that either
      (a-i) discloses and accepts the apparent infeasibility of the
      REALIZABLE (F2) branch as a likely-negative result the Executor
      should still be dispatched to confirm decisively (i.e. add the
      disclosure sentence the red-team's required_controls names, and give
      the "extreme-B check" tail-check instruction an operationally
      decidable stopping rule, e.g. capping B at ML-KEM's own modulus q
      with the stated justification that coefficients beyond q add no new
      distinct residue), or (a-ii) narrows the contract to a smaller,
      more realistic Q bound if one can be identified and states why; and
      (b) for EXP-CSIDH-c65945, a versioned amendment under
      experiments/EXP-CSIDH-c65945/amendments/ that either (b-i) stages
      the four required primary sources (CSI-FiSh eprint 2019/498,
      Kuperberg 2005, Regev 2004, Ettinger-Hoyer) or working substitutes
      into inputs/ and knowledge/ before dispatch, or (b-ii) rewrites the
      contract's stopping_rules so every one of the four sources has its
      own named BLOCKED/NOT-COMPUTED terminal disposition (not only
      CSI-FiSh) and revises the budget note to disclose the literature-
      access risk rather than characterizing the task as routine
      "citation-plus-arithmetic-check" -- and, either way, addresses
      CSIDH-OBJ-2 (pin the outcome-A/B "citable reduction" boundary) and
      CSIDH-OBJ-3 (disclose the cross-source-agreement control's actual
      scope) per the red-team's required_controls. Neither
      ledger/handoffs/TASK-20260814-807901.yaml nor
      ledger/handoffs/TASK-20260814-a82a19.yaml may be dispatched to the
      Executor as-is; each becomes dispatchable only after its own
      protocol_amendment is committed and a Coordinator decision records
      that the amendment resolves the named objection(s).
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Nothing here is a validated research finding: both hypotheses remain
      `proposed`, neither experiment has run, and no realizability or
      applicability verdict exists to promote. What this batch actually
      found is a process-integrity gap (two approved contracts with an
      undisclosed infeasibility and an undisclosed literature-access risk)
      caught by independent red-team review before any compute was spent
      -- valuable to this program's own process discipline, but not a
      KN-FIND-worthy scientific result under CLAUDE.md's promotion gate
      (which requires `support`/`reject_scoped` on `replicated`/`strong`
      evidence; this decision is neither).
  decided_by: coordinator
  decided_at: '2026-08-14T14:45:00-07:00'
