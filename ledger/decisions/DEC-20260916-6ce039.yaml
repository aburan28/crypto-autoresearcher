coordinator_decision:
  id: DEC-20260916-6ce039
  recorded_at: '2026-09-16'
  recorded_by: coordinator
  decided_by: coordinator
  area: SEMBIN
  decision_type: experiment_approval
  target_ids:
    - EXP-SEMBIN-4fa22c
    - H-SEMBIN-a7e721
    - GOAL-SEMBIN-fcb7a2
  title: >-
    Approve EXP-SEMBIN-4fa22c v1 for execution and move H-SEMBIN-a7e721 to approved, under the standing
    user authorization, with the reachable claim bounded to Proposition 5's justification

  authority: >-
    Standing user authorization of 2026-09-06 ("all is approved. ideas/experiments should be always
    approved"). No user confirmation was sought and none is required. What the Coordinator owes instead is
    protocol readiness, and this decision records the check rather than asserting it.

  protocol_readiness_check:
    controls: >-
      PRESENT. Six: the matched unshifted pair (C-1), two null objects with ten seeded draws each including
      the stricter shuffled null that preserves the target's exact monomial multiset (C-2), a known-answer
      fixture with a planted fall (C-3), order sensitivity (C-4), monotonicity as a reported series (C-5),
      and field-equation placement both ways (C-6).
    metrics: >-
      PRESENT. Five, and M-1 is re-derivable from the recorded rank series M-3 without re-running the
      algebra, which is what makes the headline integer checkable rather than merely reported.
    budgets: >-
      PRESENT. 1800 s per arm per n, 43200 s total, 10 GB enforced by a RESIDENT-SET watchdog and never
      RLIMIT_AS. cost_estimate is null and advisory per the research-budget policy; the stopping rules
      gate the work, not the estimate.
    stopping_rules: >-
      PRESENT. Five, and two of them can stop the experiment before it measures anything: SR-3 halts
      before any Nagao instance if the known-answer fixture fails, and SR-4 makes a null-control failure
      the headline rather than a footnote.
    required_artifacts: >-
      PRESENT, and two entries were written from defects found in another campaign hours earlier: per-file
      hashes whenever the tree is dirty, and the poll interval beside every wall figure.
    dependencies: >-
      PRESENT and deliberately narrow. The summation polynomial and its descent are implemented under this
      contract; nothing is imported from EXP-ICPERF's converter, because coupling two audits through one
      implementation is the defect the ICPERF review just found.
    inference: >-
      PRESENT and TRUTHFUL AT AUTHORING TIME rather than amended afterwards: fallback_allowed is TRUE
      because this checkout has no API credentials for any adapter backend, and the expected unmet
      requirement (model_verified) is named in advance. DEC-20260916-7b2235 records why every card that
      says otherwise here is false.
    write_scope: PRESENT and non-overlapping — experiments/EXP-SEMBIN-4fa22c/{code,runs}/ only.
    proof_search_map: >-
      PRESENT, with all four audits carrying a status. Two are already discharged, one PASSES and is the
      reason DC-1 exists, and one — the observation-collision search — is explicitly REQUIRED BEFORE THE
      FIRST MEASUREMENT and is not yet done. Approval does not waive it; it is a precondition inside the
      contract and the executor cannot satisfy S-7 without it.

  decision:
    experiment: >-
      EXP-SEMBIN-4fa22c version 1 is APPROVED for execution. Its bytes are frozen: a change is an additive
      amendment with a new id and never a rewrite (core rule 4).
    hypothesis: >-
      H-SEMBIN-a7e721 moves `specified` -> `approved`. This asserts that the hypothesis is well-formed and
      worth testing. IT ASSERTS NOTHING ABOUT WHETHER IT IS TRUE.
    what_approval_does_not_mean: >-
      Approval to perform work is not a claim that the prediction holds, that the mechanism is right, or
      that a result will be obtained. A run that measures d'_F <= 4 everywhere satisfies every success
      criterion and FALSIFIES the hypothesis (F-1); that is the experiment succeeding and the prediction
      failing, and the contract is written so the two cannot be confused.

  the_bound_on_what_this_can_claim:
    restated_because_it_is_the_whole_point: >-
      DC-1. No run under this contract may report a refutation of Proposition 5, because the instrument is
      structurally incapable of one: a Boolean-ring Macaulay computation cannot exhibit d_F > 4, since
      falls produced purely by X^2 -> X count toward d_F and are invisible to d'_F. The reachable result
      is a statement about the paper's JUSTIFICATION at the instances measured.
    why_this_is_worth_approving_anyway: >-
      Because an exponent-bearing published bound whose sole justification is a borrowed fake-degree
      estimate, converted by a lemma that is FALSE as literally written, and transferred to the shifted
      systems by a footnote that omits its proof, is worth checking — and the check is cheap. Under the
      target result profile this is audit work in service of an exponent claim rather than an exponent
      claim itself, and the profile's exponent-first bias is a reason to keep it cheap rather than a
      reason to skip it.
    review_tier_deliberately_not_pre_set: >-
      DEC-20260916-88ac73 declined to pre-authorize a review tier for a result not yet obtained, on the
      grounds that deciding in advance that an unobtained result deserves a cheaper review IS THE SHAPE OF
      A SILENT DOWNGRADE. That stands. A result presented as contradicting Proposition 5 requires
      review-breakthrough at max, undegradable — and that tier CANNOT BE SERVED in this environment, so
      such a claim would stay un-promoted while the campaign stays active (AGENTS.md, "Goals are never
      paused", guarantee 2: what is blocked is the claim, not the campaign).

  ranking_justification:
    why_this_ahead_of_doing_nothing: >-
      GOAL-SEMBIN-fcb7a2 has carried these two identifiers as reserved since 2026-09-13 with no records
      behind them, and its stated completion criterion 2 was NOT MET for that reason alone. The blind read
      of 2026-09-16 removed the obstacle that made the contract undesignable — before it, the campaign did
      not know whether its instrument could refute the proposition, and a contract frozen in ignorance of
      DC-1 would have carried an unsatisfiable success criterion.
    why_this_ahead_of_the_ranked_second_action: >-
      DEC-20260916-88ac73 ranked the residual reads (Nagao 2013/549's Lemma 3, Semaev 2015/310) second
      because neither answer can change DC-1, which is the constraint that shapes the contract. That
      ordering is unchanged and the reads remain ranked work: they bear on HOW CONDITIONAL a confirmation
      is, which the contract already carries as a condition in S-5.
    ecc_priority: >-
      SEMBIN is index-calculus machinery and is in the ECC area set read through tools/ecc_priority.py, so
      this work is considered before non-ECC work at every selection point and its campaign budget is
      unlimited. Unlimited removes the batch ceiling, NOT the duty to rank, and this decision ranks.
    not_make_work: >-
      This is a designed contract discharging a named, previously-blocked completion criterion, not a task
      invented to keep an unlimited-budget campaign looking busy. The distinction matters here because
      "never paused" plus "unlimited budget" is the program's strongest standing invitation to make-work.

  next_action: >-
    Open a batch on GOAL-SEMBIN-fcb7a2 and dispatch an executor for EXP-SEMBIN-4fa22c. The executor's
    first deliverable is the observation-collision search of the proof_search_map — `search_knowledge` for
    an existing measured first fall degree at these parameters — BEFORE any implementation, because a
    collision either reframes the run as a replication or hands the campaign a disagreement worth more
    than the run. Absence of a search result is not evidence that nothing was tried; recall is a floor.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Nothing is promoted by approving an experiment. The one thing established today that is a candidate
      for the corpus — that Lemma 4 of Nagao 2015/984 is FALSE as literally written, with an exhaustively
      verified counterexample — belongs to the blind read and CORR-20260916-96f47d, and its promotion is a
      separate decision that should follow the residual read of the upstream Lemma 3, since the useful
      knowledge entry is "which form is provable" rather than "the literal form is false".
    revisit_if: >-
      The rank-2 reads settle whether the upstream Lemma 3 supports the inside form. At that point the pair
      of facts is a technique-grade note about first-fall-degree conventions in the summation-polynomial
      literature, and it would save any future reader the week this campaign spent on the quantifier.

