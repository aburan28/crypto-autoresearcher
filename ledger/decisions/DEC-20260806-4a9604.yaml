coordinator_decision:
  id: DEC-20260806-4a9604
  goal_id: GOAL-ECTD-001
  batch_id: BATCH-fca4e2
  recorded_by_task: TASK-20260806-411ffd
  authorized_by: DEC-20260731-013
  recorded_at: '2026-08-06'

  context: >-
    BATCH-fca4e2 is GOAL-ECTD-001's first execution batch (BATCH-001 was
    literature/ideation, BATCH-002 was design/freeze/approval of
    EXP-ECTD-001, no runs). TASK-20260806-983eed implemented the driver
    (23 pure-Python files, no SageMath dependency -- confirmed unavailable
    per CORR-20260805-7f3a08) and ran both designed arms: RUN-ECTD-001-impl
    (1-class implementation smoke test) and RUN-ECTD-001-screen (the
    designed >=5-class Semaev/Macaulay heavy-tail screen). TASK-20260806-4455ac
    snapshot-archived the 38-file producer package plus receipt at commit
    9fd0d97433e6d1a2600b6e8cf507dce8f1d5cd58 (parent 7ecae67b), verified via
    exact `git diff --staged --name-only` before commit. TASK-20260806-5bc785
    (independent Validator, independent_session: true, policy
    review-adversarial) then re-derived every load-bearing claim from raw
    data rather than trusting the producer's summary and returned verdict
    valid.

  decision: weaken
  decision_label: >-
    weaken_scoped_to_the_confirmed_outlier_reading_at_40_bit_N_only
  decision_vocabulary_note: >-
    `weaken` is the disposition GOAL-ECTD-001's own frozen
    spec.decision_table names for the scoped_homogeneity branch and is
    dictated by TASK-20260806-411ffd's pre-registered constraint (AGENTS.md
    binding rule against reject_scoped on a single unreplicated
    empirical_only run). Its object is H-ECTD-001's confirmed-outlier
    reading, not the broader mechanism; the scope travels in
    ledger/hypotheses/H-ECTD-001.yaml's status_scope block, written in this
    same commit.

  measured_result:
    screen_run:
      run_id: RUN-ECTD-001-screen
      decision_branch: scoped_homogeneity
      completed_classes:
      - class_seed_201
      - class_seed_202
      - class_seed_203
      - class_seed_204
      - class_seed_205
      n_bit_N_achieved: 40
      n_bit_N_declared_range: [40, 44]
      note_on_range: >-
        Every completed class landed at exactly 40 bits, never 41-44 (F-3
        below). Compliant with the frozen n_bit_range=[40,56]'s letter;
        narrower in practice than the deviation text disclosed.
      instrument_validity: >-
        CTRL-PLANTED-OUTLIER's planted >=100x/d_reg-2 control was recovered
        as an outlier in every completed class -- instrument_void is ruled
        out.
      confirmed_outlier_count: 0
    impl_run:
      run_id: RUN-ECTD-001-impl
      decision_branch: resource_incomplete
      completed_classes: 1
      note: >-
        Designed only as an implementation smoke test, not a homogeneity-
        scale run; contributes no homogeneity reading in either direction.

  decision_table_application:
    map_id: experiments/EXP-ECTD-001/specification.yaml decision_table
    map_status: pre-registered and frozen at BATCH-002 snapshot 189678cb,
      approved by DEC-20260731-013; not amended by this decision
    branch_fired_screen: scoped_homogeneity
    condition_quoted_verbatim: >-
      "All >=5 classes factor-10 homogeneous on every primary meter; planted
      control recovered; permutation null does not manufacture false
      outliers"
    frozen_interpretation_quoted_verbatim: >-
      "No >=100x Semaev/Macaulay outlier under frozen FB/solver conventions
      at toy N. Forward guidance: private factor-base precomputation,
      path-hiding, detection, and vertical (017) / DDH (018) lanes remain
      open. Not inventor-protocol family closure."
    branch_fired_impl: resource_incomplete
    independently_recomputed_by: >-
      TASK-20260806-5bc785, directly from raw per-class data against
      spec.decision_table's conditions, not by reading the producer's
      stated field -- reached the identical branches on both runs,
      including working through a genuine textual gap in the decision
      table's wording (whether the planted curve is excluded from
      homogeneity/outlier determinations), resolved identically and
      consistently by both the Executor and the Validator.
    map_applied_as_frozen: true
    map_relitigated: false

  decision_scope: >-
    ASSERTS -- that BATCH-fca4e2's 5-class screen at exactly 40-bit N found
    no confirmed heavy-tail outlier (permutation-stable AND null-passing AND
    excluding the planted curve) under the frozen Semaev/Macaulay meter
    convention, with the instrument itself validated by planted-control
    recovery. DOES NOT ASSERT -- that the underlying mechanism (equation-
    dependent algebraic weakness inside an isogeny class) is impossible;
    that HEUR-ECTD-TAIL-1 is refuted (its own falsification_condition never
    fired, because no candidate outlier reached the point of being testable
    against it); that 41-56-bit N behaves the same way (F-3: the achieved
    scope is narrower than the disclosed [40,44] deviation implied); that
    path-hiding or public detection is at least rho-hard or otherwise; or
    anything about medium- or crypto-scale curves. The one-line honest
    summary is: at exactly 40-bit N, on 5 classes, under this driver's
    frozen conventions, no class-internal algebraic heavy tail was found --
    and that is the full extent of what this batch measured.

  material_finding_and_its_non_effect_on_this_decision:
    finding_id: F-1 (TASK-20260806-5bc785, severity material)
    what_was_found: >-
      CTRL-RHO's stated empirical justification for substituting plain for
      negation-map Pollard rho ("~2.5% degenerate collisions, >500x sqrt(N)
      step counts") has zero supporting evidence anywhere in the committed
      package and reads as a fabricated statistic under AGENTS.md rule 9.
    independent_confirmation: >-
      I independently re-verified this myself at source, before writing
      CORR-20260806-2f98f4, rather than accepting the Validator's finding on
      its word: grepped all 23 driver files and both runs' logs for
      negation/fruitless/degenerate/2.5%/500x terms; the only rho
      implementation anywhere is pollard_rho_plain (a standard r-adding
      walk, no negation step); no log or artifact contains the cited
      figures; and the shipped degenerate_restarts counter measures the
      generic trivial-relation collision case common to any additive-walk
      Pollard rho, not a negation-specific fruitless-cycle pathology.
    correction_filed: CORR-20260806-2f98f4, archived in this same ledger
      commit (write_scope and artifact_paths extended to ledger/corrections
      to carry it, since it was discovered during this batch's own review).
    why_it_does_not_change_the_decision_above: >-
      Confined to the prose justification for one methodological
      substitution. CTRL-RHO's actual pass_condition ("valid rho receipt per
      completed class; baseline only") does not require the negation
      optimization, and every rho/bsgs receipt used in the decision_branch
      determinations above is the real plain-rho run's own reported
      group_ops and k_found -- independently re-verified by both the
      Validator (byte-exact class_seed_203 reproduction, 3/3 k*G=Q spot
      checks) and, separately and earlier, by me directly on one real
      certificate. The scoped_homogeneity and resource_incomplete branches
      were each independently re-derived from raw per-class meter data,
      which the fabricated prose never fed into.

  minor_findings_disposed_of_in_this_record:
    finding_F2: >-
      CTRL-NO-CLASS-INVARIANT-ENDPOINT was absent from every committed
      artifact of BATCH-fca4e2, not even as an N/A note, though on the
      merits it is a genuine structural N/A: EXP-ECTD-001 never nominates a
      secret endpoint under any decision_branch (spec's own
      what_this_experiment_is_NOT is explicit), so the control's
      precondition never arose. Disposed of here, exactly as the finding
      itself recommended, by recording the N/A ruling in
      ledger/hypotheses/H-ECTD-001.yaml's updated notes rather than by
      editing the frozen, immutable run package.
    finding_F3: >-
      The disclosed N-bit-range deviation text overstates the achieved
      scope: every completed class is exactly 40 bits, never 41-44, because
      driver/fp.py's random_prime returns an exact-width prime and Hasse's
      theorem then confines N to that width regardless of the [40,44] band
      passed to find_seed_curve. Compliant with the frozen n_bit_range's
      letter; the accurate scope statement now lives in
      H-ECTD-001.yaml.status_scope.scope_boundary_note (see
      decision_scope above) rather than in an edit to the frozen spec.
    finding_F4_and_F5: >-
      Informational; no action required. F-4 (meter-constancy across
      curves at fb_size=8) is independently assessed as a plausible genuine
      instrument-sensitivity limitation, not a bug, by both the Validator
      and, earlier and separately, by me on two freshly generated curves.
      F-5 confirms no trapdoor/crypto-scale language exists anywhere in the
      package.

  hypothesis_status_transition:
    hypothesis_id: H-ECTD-001
    from: specified
    to: weakened
    changed: true
    scoped: true
    scope_location: ledger/hypotheses/H-ECTD-001.yaml status_scope, written
      in this same ledger commit
    transition_note: >-
      H-ECTD-001.yaml's status field was never separately advanced through
      approved/running/analyzed as EXP-ECTD-001 moved through those real
      stages (DEC-20260731-013 approval; this batch's now-verified
      running+analysis). This is the same disclosed-not-silent D-1-style
      convention already used for experiments/EXP-ECTD-001/specification.yaml
      itself. The jump from specified directly to weakened is stated
      explicitly here rather than left unexplained.
    reason: >-
      scoped_homogeneity fired on its frozen, pre-registered condition
      against an admissible run with instrument validity established
      (planted control recovered) and no D-5-style guard triggered. The
      frozen decision_table's own interpretation text assigns exactly the
      forward guidance this decision adopts; it is applied as frozen, not
      relitigated.
    what_it_does_not_license: >-
      No `rejected`, no lane closure, no impossibility claim about
      41-56-bit N or medium/crypto scale, no HEUR-ECTD-TAIL-1 validation or
      refutation, and no reading of RUN-ECTD-001-impl's resource_incomplete
      branch as a second confirming homogeneity data point.

  forbidden_dispositions_on_this_set:
    - reject_scoped, on a single unreplicated empirical_only run
    - support, or any reading that HEUR-ECTD-TAIL-1 is validated or refuted
    - any closure of GOAL-ECTD-001, RQ-ECTD-001, or the inventor-protocol
      closure standard for this campaign
    - any trapdoor, path-hiding-strength, or crypto-scale claim
    - any statement that class-internal algebraic heavy tails are impossible
      beyond exactly 40-bit N on these 5 classes
    - citing "~2.5% degenerate collisions" or ">500x sqrt(N)" for this
      driver in any future record (CORR-20260806-2f98f4)

  refutation_artifact:
    tier_achieved: 3 (empirical_only)
    artifact: >-
      RUN-ECTD-001-screen's 5 completed classes, each with a genuinely
      recovered planted-outlier control, a permutation-stability table, and
      an outside-class null arm, independently re-derived from raw data by
      TASK-20260806-5bc785 rather than accepted from the producer's summary.
    why_not_higher_tier: >-
      No counterexample certificate applies to a homogeneity (absence)
      finding, and no derivation isolates why no outlier exists at this
      cell -- the finding rests on measured absence across 5 classes, which
      is exactly what empirical_only means and is declared as such rather
      than inflated to `derivation`.

  official_status_changes:
    - record: H-ECTD-001
      from: specified
      to: weakened
    - record: EV-ECTD-8c098d
      from: null
      to: recorded
    - record: CORR-20260806-2f98f4
      from: null
      to: recorded
  official_status_changes_note: >-
    GOAL-ECTD-001 itself stays `active`; no goal-level status change (see
    goal checkpoint in this same commit for its next_action).

  knowledge_promotion:
    promote: false
    promoted: []
    warranted: false
    not_warranted: >-
      This is BATCH-fca4e2's first, unreplicated run set, so evidence
      strength cannot exceed preliminary regardless of outcome (pre-
      registered in TASK-20260806-411ffd's own constraints). A KN-FIND on
      "class-internal Semaev/Macaulay meters are homogeneous at toy N" would
      require a later replication independently confirming the same reading
      -- none exists yet. The candidate methodological lesson (fix the
      exact-width prime sampler so [40,56] is genuinely covered before
      generalizing a homogeneity finding beyond 40 bits, F-3) is recorded
      here and in H-ECTD-001.yaml rather than promoted, for the same reason:
      one instance plus an argument is a candidate, not a curated finding.
    promotion_trigger: >-
      Promote a KN-FIND only if a later replication at widened N-bit
      coverage (post F-3 fix) or a second seed independently confirms
      scoped_homogeneity at strength replicated/strong; or promote a
      KN-TECH on the exact-width-prime sampling gap if a future batch
      confirms it recurs elsewhere in this codebase.

  limitations:
    - >-
      Single unreplicated empirical_only run set at one toy cell (exactly
      40-bit N), one seed range, one host; no replication is claimed and
      none exists.
    - >-
      The Validator did not independently re-execute all 5 screen classes
      from scratch (only class_seed_203); the other 4 are verified by
      hash-integrity, internal consistency, and spot-checked rho/bsgs
      receipts, not full independent re-derivation (Validator's own stated
      limitation, judged sufficient sampling by both the Validator and me).
    - >-
      2 of 5 primary meters (groebner_solving_degree_d_reg,
      macaulay_rank_defect_at_first_fall) carried zero discriminating power
      at this toy fb_size=8 (F-4); only the remaining meters were
      informative discriminators in this run.
    - >-
      Neither the Validator nor I independently re-derived primality/order
      for all curves across all classes; both of us relied on
      curve.find_curve_order's BSGS-witness scheme and fp.py's
      deterministic Miller-Rabin, each exercised by selftest_basic.py.
    - >-
      Inference fallback: requested coordinator-orchestration-code, resolved
      claude-sonnet-5, model_verified false. TASK-20260806-5bc785 likewise
      recorded fallback_used true against review-adversarial, so this
      Coordinator archive and its sole independent review ran on the same
      model family. A real independence limitation of this harness,
      recorded rather than glossed.

