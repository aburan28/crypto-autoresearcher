coordinator_decision:
  id: DEC-20260727-001
  context: >-
    Execution of ESC-20260727-001 section D_id_collision. origin/main published a
    coordinator_decision at ledger/decisions/DEC-20260726-007.yaml (the EXP-GGM-001
    archive decision, support / strong) while an unmerged record of this branch occupied
    the same ID (the goal integrity repair and BATCH-006 opening decision). A Copilot bot
    merge, reported to this session as commit c2beba80, resolved the resulting add/add
    conflict in favour of the branch record and thereby deleted the published main record
    from the merged tree, leaving EV-GGM-001 and H-GGM-001 carried on this branch with
    their authorizing decision record destroyed. The executing session restored main
    published record byte-identical and verified the restoration. This decision makes the
    renumber official in the ledger: the branch record is reissued as DEC-20260726-009,
    the deviation is recorded in CORR-20260727-001 with an alias declaration for the
    artifacts that must not be edited, and the five cleared citation sites are updated.
    ESC-20260727-001 itself lives in coordination/ and is Coordinator direction, not an
    official transition; this record is the ledger entry that carries it. No hypothesis,
    experiment, or evidence status is changed here.
  decision: supersede
  target_ids:
    - DEC-20260726-009
    - CORR-20260727-001
    - GOAL-ECDLP-001
    - BATCH-004
    - BATCH-006
  rationale:
    - >-
      The published trunk record keeps the ID and the unpublished branch record renumbers.
      IDs are immutable and never reused, so one of the two colliding records had to move;
      moving the unpublished one touches no published history, no published commit message,
      and no external citation. DEC-20260726-008 was already ours, so 009 is the next free
      number on the same date. The 20260726 date component is retained because the record
      decided_at is 2026-07-26 and the date is part of record identity, not a filing
      timestamp.
    - >-
      DEC-20260726-009 is the same decision, reissued, not a new one. Its context,
      decision, target_ids, rationale, evidence_refs, limitations, next_actions,
      knowledge_promotion, decided_by and decided_at are carried verbatim from the record
      as authored at the colliding ID; the only additions are the id line and a provenance
      block. Nothing about the substance of the BATCH-006 opening or the BATCH-004
      integrity repairs is revisited by this renumber.
    - >-
      CORR-20260727-001 records the renumber as a deviation rather than letting it happen
      silently, and carries the alias declaration verbatim from the ruling: every
      occurrence of DEC-20260726-007 in an artifact authored on this branch on or before
      2026-07-26 refers to DEC-20260726-009. The alias is what makes eleven immutable
      artifacts - two independent review outputs, one red-team output pair, one published
      decision, four handoffs, and three hash-bound archive receipts - readable without
      editing any of them. A repository-wide search and replace was expressly not
      performed.
    - >-
      Five citation sites in four files were updated, exactly the set the ruling cleared:
      ledger/goals/GOAL-ECDLP-001.yaml (1 occurrence, the operational goal anchor),
      BATCH-006/dispatch_queue.json (5), BATCH-004/dispatch_queue.json (3), and
      BATCH-006/batch.yaml (3). ledger/decisions/DEC-20260726-007.yaml was not touched by
      this authoring session; it holds main restored content.
    - >-
      BATCH-006/batch.yaml was left to Coordinator choice at execution time and was
      UPDATED rather than aliased. Three grounds. First, after the merge the string
      DEC-20260726-007 is not a dangling reference on this branch: it resolves to a real,
      present, and entirely different record, so a stale citation would silently mislead a
      reader and any citation-following tool into reading a GGM archive decision as the
      authority for a coordination repair. That failure mode is worse than a broken link.
      Second, the two grounds the ruling used to protect the other artifacts do not apply
      here: batch.yaml is coordination state, it is not the immutable output of an
      independent non-originating session, and no archive receipt hash-binds it - the only
      BATCH-006 receipt, TASK-20260726-008 ledger_commit_receipt.json, does not list it
      among its eleven path_sha256 entries, and TASK-20260726-005 review_report.yaml cites
      it only as binding authority for a method, recording no hash for it. Third,
      BATCH-006/dispatch_queue.json was cleared for update, and leaving batch.yaml stale
      would put two files in the same batch directory citing two different records for the
      same authorization.
    - >-
      Each of the three coordination files carries a new id_renumber_note field naming
      CORR-20260727-001, and the goal record carries an inline parenthetical, so the change
      is self-documenting rather than a silent string substitution. No task state, budget,
      verdict, claim tier, review outcome, or latest_verified_commit was altered by any of
      these edits.
    - >-
      The deletion of main published DEC-20260726-007 by an automated merge is recorded in
      CORR-20260727-001 as an integrity event. AGENTS.md makes ledger records immutable and
      permits supersession, never deletion; no decision authorized the removal, and a merge
      resolution produced by a bot is not a Coordinator decision. The event is repaired and
      recorded rather than passed over, on the principle that an unauthorized deletion of a
      published record must not go unrecorded even when the repair is mechanical and
      complete.
  evidence_refs: []
  evidence_note: >-
    Deliberately empty. This decision reviews no evidence and rests on none. It is an ID
    and record-integrity action. EV-GGM-001, EV-ECDLP-007, REV-20260726-005 and
    RT-20260726-001 are discussed in ESC-20260727-001 and are not adjudicated here.
  limitations:
    - >-
      This is bookkeeping and integrity work. It produces no evidence for or against any
      hypothesis and asserts nothing about prime-field ECDLP, generic-group simulability,
      the jet, elliptic-net, incidence or endomorphism oracles, or any attack stage.
    - >-
      Nothing here ratifies main published DEC-20260726-007, EV-GGM-001, KN-FIND-001, or
      the H-GGM-001 supported status merged from main. ESC-20260727-001 section A found
      that archive process-invalid as an official transition and section C rules the honest
      status of H-GGM-001 to be specified. Restoring the branch record to a valid ledger
      state was explicitly NOT performed here: a status change is a state transition that
      needs its own superseding decision on reviewed evidence, not a hand-edit inside an ID
      repair. H-GGM-001 therefore currently reads supported on this branch while
      ledger/goals/GOAL-ECDLP-001.yaml BATCH-006 claim_boundary states it stays specified.
      That inconsistency is live, is recorded here, and is the first next action.
    - >-
      The commit identities referenced in this decision - merge c2beba80, branch commit
      81f8e793, main commit 3a59a2079e7d24fa877828dc4766d4ca1c1cc9cb, archive commit
      747eb6bf - were reported to this authoring session, which has no shell access. The
      byte-identity of the restored ledger/decisions/DEC-20260726-007.yaml and the identity
      of the preserved branch content are asserted as reported and verified by the
      executing session, not as checks this session performed. No SHA-256 in this decision
      was computed here.
    - >-
      ledger/goals/GOAL-ECDLP-001.yaml and BATCH-004/dispatch_queue.json are two of the
      eleven paths hash-bound by TASK-20260726-008 ledger_commit_receipt.json. Those
      bindings are to Git object content at commit 747eb6bf and remain valid for that
      commit; the updated working-tree content intentionally differs from the recorded
      hashes. No receipt was edited, and this is not an archive verification failure.
    - >-
      GOAL-ECDLP-001 remains paused under pause_conditions item 1. This decision does not
      resume it, does not add a batch checkpoint, and does not alter its single preserved
      next_action; the follow-ups below belong to the successor campaign or to the
      escalation track, not to the exhausted six-batch budget.
  next_actions:
    - >-
      Author the ESC-20260727-001 section C superseding decision at the next free DEC id,
      setting H-GGM-001 status back to specified with the reasoning that a process-invalid
      execution is neither positive nor negative evidence, and reconciling the hypothesis
      record with the goal record BATCH-006 claim_boundary. It must cite this ruling, main
      DEC-20260726-007, EV-GGM-001, EV-ECDLP-007, REV-20260726-005 and RT-20260726-001, and
      state plainly that it is a process ruling and not a finding that the mathematics is
      wrong. Sequence it after, or alongside, the independent rule-12 review named in
      section F item 1, so the status change rests on review rather than on a Coordinator
      verdict.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is not an evidence-review decision. It reviews no run set, produces no durable
      research claim, and changes no hypothesis status. An ID renumber and the recording of
      an unauthorized deletion are ledger hygiene, not a finding about ECDLP or about
      generic-group simulability.
  decided_by: coordinator
  decided_at: "2026-07-27"
  decided_at_precision: >-
    Date only. This authoring session has no clock access and does not fabricate a
    wall-clock time. The committing session may record the exact commit time in the
    archive receipt.
