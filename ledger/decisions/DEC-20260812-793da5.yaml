  material_findings:
    - severity: material_approval_blocker
      subject: impossible_literal_v7_snapshot_receipt_lookup
      statement: >-
        The exact self-neutral receipt v7 names cannot supply the final commit,
        self-path hash, self-path size, or generated-path skip facts v7
        requires. An accepting reader must discover an unreferenced completed
        queue archive object and canonical plan, so the literal named lookup
        fails v7's own missing-or-null rule.
      repairable_additively: true
      overruled: false
    - severity: material_approval_blocker
      subject: nonexhaustive_field_projection_and_prose_override_scopes
      statement: >-
        The independent leaf audit found 158 parsed leaves outside explicit
        owner prefixes and enumerated common metadata. Prose scopes such as
        same_semantic_subject and each_changes_entry_field_named_by_that_entry
        do not machine-map those leaves to resolved fields or exact override
        edges, so readers must choose among executable, predecessor, or
        provenance-only dispositions.
      repairable_additively: true
      overruled: false
    - severity: material_approval_blocker
      subject: positive_convergence_fixture_has_no_expected_preimages
      statement: >-
        The positive fixture contains expected equality booleans but no exact
        resolved-contract UTF-8 preimage or digest and no exact origin-trace
        UTF-8 preimage or digest. Latest-entry versus ordered-entry equality is
        therefore asserted rather than independently recomputable.
      repairable_additively: true
      overruled: false
    - severity: material_protocol_ambiguity
      subject: multi_fault_error_priority_unspecified
      statement: >-
        Several of the 22 negative mutations satisfy multiple failure
        predicates, but v7 defines no error-priority table. The fail-closed
        boundary is broadly clear while the declared first error is not
        deterministic, and ownerless, dual-owner, and out-of-scope override
        cases share one conflated error code.
      repairable_additively: true
      overruled: false

  rationale:
    - >-
      The frozen approval rule permits approval only after an unqualified
      independent PASS with no dissent. TASK-20260812-f6c4ba returned REVISE,
      expressly blocked approval, and TASK-20260812-2ca66d faithfully applied
      that outcome. Approval is therefore unavailable.
    - >-
      Exact snapshot, source, exclusion, controlling-v6, v5-preservation, v6
      RNG-fixture, and zero-authority bindings match. Those passing local facts
      do not cure any of the four material composition findings and do not
      establish one executable resolver.
    - >-
      V7 and every prior artifact remain immutable. Every material finding is
      preserved without omission, softening, overruling, or retroactive repair.
    - >-
      This is neutral protocol governance only. It is not an experiment
      approval, run receipt, observation, metric, scientific result, JINV
      finding, ECDLP result, research-status transition, knowledge promotion,
      source change, closure, or breakthrough.

