coordinator_decision:
  id: DEC-20260831-7d623d
  context: >-
    This Coordinator decision composes the independent Validator (J1,
    `passed`/`holds`) and Red Team (J2, `holds_..._with_one_significant_
    new_quantitative_finding_...`) reviews of EXP-MONO-b1423c's execution:
    a small, targeted K5 sensitivity check closing the single open
    qualification EV-MONO-04d447/DEC-20260831-fccd7e left on
    H-MONO-663fb4's status. Both reviewers independently reconfirmed every
    construction and arithmetic claim from scratch via disjoint methods
    and converged on the same qualitative disposition while each
    surfacing distinct, valuable sharpenings; this decision adopts both.
  decision: revise
  decision_label: >-
    fisher_combined_sensitivity_demonstrated_absent_for_single_extreme_outlier_structural_not_artifactual_redundant_with_holm_untested_for_intended_diffuse_regime
  target_ids:
    - H-MONO-663fb4
    - EXP-MONO-b1423c
    - RQ-MONO-001
    - EV-MONO-0e7ace
    - CORR-20260831-817847
    - EV-MONO-04d447
    - DEC-20260831-fccd7e

  hypothesis_status_before: supported_scoped_k3_k4_controlled_null_fisher_sensitivity_open
  hypothesis_status_after: supported_scoped_k3_k4_controlled_null_fisher_sensitivity_open
  hypothesis_status_after_note: >-
    UNCHANGED status level. This experiment CLOSES the open qualification
    for the specific regime it tested (single/few-extreme-outlier
    sensitivity, now demonstrated absent, structurally, not merely
    untested), but does NOT close the qualification in general: Fisher-
    combined's actual intended regime (many mild, diffuse per-curve
    deviations) remains completely untested by any experiment in this
    lane. Per both reviewers' explicit, converged recommendation, the
    hypothesis's own status_note is sharpened (not the status level)
    to replace "untested assumption" with the more precise
    "demonstrated absent for the single/few-extreme-outlier case
    (redundant with the already-power-verified per-curve Holm test,
    which independently covers that exact failure mode and found nothing
    on real data); entirely untested for the many-mild-curves case the
    statistic was actually introduced for."

  experiment_status_before: approved
  experiment_status_after: completed

  official_status_changes:
    goal_status_changed: false
    goal_status_after: paused
    hypothesis_status_changes: []
    experiment_status_changes:
      - experiment_id: EXP-MONO-b1423c
        from: approved
        to: completed
    resource_disposition_changed: false
    completion_criteria_met: []
    implementation_authorized: false
    experiment_runs_authorized: 0
    scientific_interpretation_authorized: true
    closure_authorized: false
    breakthrough_authorized: false

  claim_tier: toy
  scope_statement: >-
    Scoped exactly to EXP-MONO-b1423c's tested regime: a single,
    maximally-extreme, exactly-constructed positive control (RO3's
    subgroup factor base, C/F=1.0) mixed into a ~49-curve non-exceptional
    background panel, tested via EXP-MONO-b19c6b's own unweighted
    Fisher-combined statistic. No ECDLP, relation-rate, exponent, or
    cryptographic-scale claim. Does not close KN-OPEN-009.

  rationale:
    - >-
      BOTH REVIEWERS INDEPENDENTLY RECONFIRMED, VIA WHOLLY DISJOINT
      FROM-SCRATCH METHODS, EVERY CONSTRUCTION AND ARITHMETIC CLAIM IN
      THE ARCHIVED RECORD. RO3's group structure and Var_real for both
      known-positive cells were re-derived from first principles
      (brute-force point enumeration, H-MONO-663fb4's own closed-form
      mechanism formula) bypassing the reused implementation entirely,
      and matched bit-for-bit. The reuse claims (byte-identical
      subgroup_control, fields/curve/conv/groupstate/stats.py) were
      confirmed by direct diff, not trust. No implementation defect,
      construction error, or execution-fidelity gap was found by either
      reviewer.
    - >-
      THE DIRECTION OF THE SENSITIVITY-GAP FINDING IS ROBUST AND
      STRUCTURAL, NOT AN ARTIFACT OF AN UNLUCKY DRAW OR AN
      UNREPRESENTATIVE BACKGROUND SAMPLE. The Validator's decisive
      contribution: the permutation floor caps the maximum possible
      chi-squared contribution any single-cell injection could ever
      supply (already realized here, both cells), and the shortfall to
      the alpha=0.05 rejection threshold is more than double that cap --
      closing it via more null draws alone would require billions of
      draws, computationally infeasible. The Red Team's independent
      cross-check across four archived background panels plus a pooled
      k=191 panel confirms no panel choice would have crossed the
      threshold, and that the dilution effect genuinely worsens (not
      improves) with more curves.
    - >-
      THE RED TEAM'S SHARPENING OF THE REPORTED MAGNITUDE IS ADOPTED:
      the specific combined p-values (0.47-0.52) are NOT a panel-
      independent characterization -- the chosen background panel
      happens to sit below its own null expectation (z~-1.3), and
      alternative archived panels give 0.076-0.292 for the identical
      injected outlier. Any future citation of this experiment's
      specific numbers should disclose this range, per the Red Team's
      own required_controls.
    - >-
      BOTH REVIEWERS' CONVERGENT FRAMING IS ADOPTED: this experiment
      tests close to the least favorable regime for demonstrating
      Fisher's method's actual value proposition (many mild, diffuse
      deviations), a regime the co-existing per-curve Holm test already
      covers with demonstrated power. The non-rejection here is
      therefore NOT evidence the Fisher-combined statistic is broken or
      poorly designed -- it is the expected outcome for any unweighted
      pooling method facing a single extreme value diluted among ~49
      background tests, and converts a previously-untested assumption
      into a demonstrated fact, which was this record's entire purpose.
    - >-
      THE CROSS-LANE SHARPENING IS ADOPTED VERBATIM AS THE PRIMARY
      OUTCOME OF THIS DECISION: EV-MONO-04d447's "untested assumption"
      language for Fisher-combined sensitivity is stale in one specific,
      narrow respect and is corrected in H-MONO-663fb4's own status_note
      (not reopening EV-MONO-04d447 itself, which remains valid and
      unmodified as a historical record). This does not weaken
      EXP-MONO-b19c6b's own "controlled null confirmed" reading: the
      per-curve Holm test independently covers the single/few-extreme-
      curve failure mode and already found nothing on real data,
      confirmed by this experiment's own S5 metric (the injected cell's
      raw p-value would trivially survive Holm correction).
    - >-
      A MINOR, GENUINELY NEW, INCONSEQUENTIAL DOCUMENTATION DEFECT IS
      ACCEPTED (Red Team OBJ-5): implementation.md's Step 4 narrative
      misstates the h=144 Var-vs-null-max margin as "roughly 6x" (correct
      figure: ~6,358x), an apparent substitution of a different reported
      ratio into that sentence. Understates rather than inflates the
      result; does not affect S1-S5 or the outcome classification. Not
      independently corrected here per immutability discipline; named
      for any future citation.
    - >-
      A FOURTEENTH OUT-OF-BAND "CURSOR AGENT" COMMIT IS DISCLOSED AND
      INDEPENDENTLY RECONFIRMED CONTENT-CORRECT AND NEVER LIVE IN THE
      EXECUTED CODE, BY BOTH REVIEWERS SEPARATELY READING run.py DIRECTLY
      (not the correction's own git-forensics narrative). Not adopted as
      an authorized amendment; not reopened here.

  next_action: >-
    LOW PRIORITY, NOT DISPATCHED HERE: if a future contract wants to test
    Fisher-combined's actual intended regime, construct a positive
    control with several (5-15) mildly-perturbed curves at a realistic,
    sub-extreme effect size, mixed into a comparably-sized background
    panel -- per both reviewers' converged recommendation. Given the
    per-curve Holm test already independently covers the single/few-
    extreme-curve regime with demonstrated power, and K3/K4's core
    question is already well-supported by that test on real data
    (EV-MONO-04d447), this is named as an available future direction
    for the Fisher-combined statistic's own methodological completeness,
    not as an urgent gap in H-MONO-663fb4's own disposition. No further
    K3/K4-adjacent experiment is required to sustain the current
    hypothesis status.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Both reviewers' findings (the permutation-floor-caps-chi-squared-
      contribution argument; Fisher's method's classical weakness
      against single extreme outliers versus its strength on diffuse
      signals; the panel-choice sensitivity of a small-k Fisher test) are
      valuable but are folded directly into this decision's rationale and
      H-MONO-663fb4's own status_note rather than promoted as a
      standalone knowledge-technique entry: they are specific,
      well-understood consequences of classical statistical theory
      (Fisher's combined-probability test's known power profile) rather
      than a novel methodological lesson this program discovered, unlike
      KN-TECH-95a42b's floor-vs-threshold arithmetic (which WAS a novel,
      previously-unstated design-time check specific to this program's
      own contract-approval practice) or KN-TECH-a810e4's cross-lane
      review-discipline pattern. A future contract designing a diffuse-
      regime Fisher-combined positive control should cite this decision
      and both reviews directly rather than a promoted technique entry.

  procedure_deviations:
    - >-
      None from the review_plan itself: both reviews dispatched
      concurrently, post-snapshot, with disjoint joints (Validator =
      J1-correctness, Red Team = J2-adversarial), both attest
      read_sibling_reports: false (each disclosing they observed only an
      empty or nonexistent sibling directory), and both were explicitly
      instructed to independently re-derive the core arithmetic and the
      mathematical dilution explanation from raw data/source before
      relying on the Coordinator's or the correction's own prose -- both
      confirm having done so via wholly disjoint methods, and both
      surfaced sharpenings not present in this Coordinator's own
      pre-review framing.
    - >-
      GOVERNANCE FINDING, CARRIED FORWARD, NOT RE-LITIGATED: the
      fourteenth out-of-band "Cursor Agent" commit (CORR-20260831-817847)
      is independently reconfirmed, by both reviewers separately, to be
      content-correct and never live in the executed code. Not adopted
      as an authorized amendment.

  limitations:
    - >-
      This decision does not itself dispatch the low-priority future
      direction it names (a diffuse-regime Fisher-combined positive
      control); it is recorded as available context only.
    - >-
      The sharpened status_note language applies specifically to
      Fisher-combined's sensitivity qualification; it does not change
      H-MONO-663fb4's status level, EXP-MONO-b19c6b's own disposition, or
      GOAL-MONO-001's status.
    - >-
      Model-correlation confound: both reviewers this round resolved to
      claude-sonnet-5, matching this Coordinator and the experiment's own
      author. Both reviews explicitly disclose this and argue their
      independent, disjoint-method re-derivations -- which surfaced
      sharpenings neither this Coordinator's framing nor each other's
      review anticipated -- is evidence against rubber-stamping.
    - >-
      This decision does not reopen or adjudicate EV-MONO-04d447 or
      DEC-20260831-fccd7e as historical records; it sharpens the language
      those records' own stated open qualification uses going forward,
      via H-MONO-663fb4's own status_note.

  reviewed_by: [validator-mono-b1423c, red-team-mono-b1423c]
  decided_by: coordinator
  decided_at: '2026-08-31'
