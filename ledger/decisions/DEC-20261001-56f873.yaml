  rationale:
    - >-
      Unit (NA-5 (a), NA-4). The quantity the mechanism is about is the number
      of distinct informative relations. Lemma L1 shows that under the
      uniform model the pair count is a compound of the relation count, with
      index of dispersion (1 - 1/N) sum M^2 / sum M (3 for TT at arity 2, 10
      at arity 3), while the relation count of a table class has dispersion
      exactly 1 - 1/N. So the pair-unit Poisson band could not be calibrated,
      and a relation-unit Poisson floor is model-consistent. The relation unit
      is written out as a projective (monic) normalisation, because a
      relation and its scalar multiples are the same event in L1.
    - >-
      Calibration (NA-5 (b)). t* is the family-wise 0.95 quantile under a
      generator fitted to the random arms' own relation dispersion, fixed in a
      blinded first step (R15) that cannot parse a structured arm. A fourth
      random base per family, scored with the identical statistic and df, is
      the in-design known-null check, and a planted arm with a known count of
      planted relations is the opposite control. EXP-PFDR-1b78f7 had neither.
    - >-
      Exposure (NA-5 (c)). SS is counted among the first X_fix = 20*isqrt(N)
      formally distinct encodings, identical for every arm of a curve, in a
      search-only mode that also removes censoring. TT and TB are table-only
      and exposure-matched by |F|.
    - >-
      Retention and family (NA-5 (d), (e)). Every row of every family cell is
      retained, the 21-cell family and its resolvability (E[C_R] >= 100 under
      the uniform model, from design curves) are fixed now, and no count
      decides membership.
    - >-
      Power (NA-5 (g)). TT m 4 and TB were unresolved because their null
      counts are tiny (about 0.25 and 0.2 relations per instance at 30-32
      bits). Both are table classes, so a table-only mode measures them
      without a search, at about 0.15 s per m = 4 arm-instance; 2000 curves
      per rung resolve TT m 4 at about kappa 1.12. TB m 3 is resolved at a
      stated weaker target (1.5, predicted 1.35); TB m 4 and 5 are excluded
      with the reason that their expected null counts (about 0.0025 and 0.008
      per instance) would need more than 10^4 curves per rung, and are
      tail-screened. The analytic plan meets every target; P0 re-checks it
      from archived data before any census run and may only raise n.
    - >-
      Repair and certificates (NA-7, NA-8, NA-5 (h), (i)). EC-1 repairs the SS
      counter, T-OBJ5 must reproduce the undercount on the pre-fix code, and
      G-FIX re-runs EXP-PFDR-1b78f7 jobs to show that only OBJ-5-attributable
      counts move. Every solve archives (P, Q, k), re-verified by a verifier
      that uses only the standard library; a 1-in-10 curve sample of rows is
      re-verified the same way.
    - >-
      Intervals (NA-5 (j); KN-TECH-d00f7b). Primary intervals and X_rel are
      calibrated by simulation at the realised n with >= 20000 replicates over
      5 seed families; the bootstrap is secondary and n/(n-1)-corrected; A2
      reads against its design-evaluated null slope, never "interval above 0".
    - >-
      Exponent bias (docs/target-result-profile.md). The structural branch is
      the only exponent-targeting part of this line (kappa ~ N^delta would
      move the exponent). The prior is the null; the design is justified by
      replacing a miscalibrated pair-unit non-detection with a calibrated,
      powered relation-unit one that can either close the cells honestly or
      surface a real candidate. Its heuristic-validation half (H1a/b/c, H3,
      H4, H5) is paired in the same experiment, as AGENTS.md requires for a
      conditional claim.
    - >-
      Proof-architecture gate (KN-TECH-080; coordinator.md). The map is
      complete: the bottleneck is named, the baseline is reproduced by frozen
      fixtures (G1', G2', P0X, G-FIX), five observation collisions are listed
      with their separators and one residual collision is routed, the
      quantifier order is explicit about what a toy design can and cannot
      test, and the method ceiling has two-sided nearby-object controls.
    - >-
      Floor independence. No floor-relative quantity is computed or relied on.
      The IDEA-20260928-ce3ab0 comparison in dominated_by and the
      floor-relative form of the parent's exponent statement wait on the
      TW-FLOOR round. Dispatch waits on that round so that any accounting or
      certificate finding it makes about the harvest code can be absorbed by
      an additive amendment before data exist.
    - >-
      Focus (coordinator.md "Focus discipline"). Active critical items on this
      line: the TW-FLOOR round (running) and this experiment (approved, held).
      Two, within the limit of three. The generic even-m work
      (DEC-20260929-bbb3a9 NA-12 item 3) stays ranked below, and floor-relative.

  limitations:
    - Toy scale, 20..32 bits, generated curves, one engine; every reading is scoped to the tested arms, cells and curves.
    - Lemma L1 is proved within the uniform model but not yet checked by an independent reader; L2 rests on a stated assumption about the stored set; L3 is a sketch. None is relied on for an adverse transition before the post-run review checks it.
    - The power planning values come from one archived run set's random arms (five curves per rung) and from the uniform model; the SS multiplicity at X_fix is extrapolated from A_fix. P0 re-checks them, but realised power can differ; X_rel is therefore computed again at the realised design.
    - The search-only and table-only modes are new code paths; their equivalence to census mode is gated (T-SEARCH, T-TABLE, G-SRCH, G-TAB), not assumed.
    - One model served this Coordinator and will serve the executor; session independence is the only independence claimed.
    - This Coordinator ran no tool that writes or measures (no shell); every count quoted from archived files was read, not recomputed.

