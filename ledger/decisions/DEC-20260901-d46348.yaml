coordinator_decision:
  id: DEC-20260901-d46348

  context: >-
    GOAL-AES-003 batch-closing act by the dispatching Coordinator (session
    coordinator-aes003-1, 2026-09-01), executed as the ledger archive task
    TASK-20260901-4c0410 of BATCH-2f12ac. BATCH-2f12ac was opened by
    DEC-20260901-78e2d9 to execute IDEA-20260901-363851 Stage 0 -- the
    first measurement of the candidate carrier e = (q0^q1)^(p0^p1) under a
    nonlinear S-box (the red team's J5 control), gated by a receipt-
    identity Gate 0.

    The producer (TASK-20260901-7e0b71, ~22 min of 120 min, 7 record
    runs) returned S0-CARRIER-ALIVE under the preregistered decision
    rule: Gate 0 reproduced the committed L1-AES-R5-P30 receipt
    field-by-field (non-perturbation proven); the J5 arm read 14 hits at
    wt(e) 11-16 bytes vs 93.9% miss mass at 16; the exact one-sided
    exchangeability test read p_small = 6.8027e-59; the r=6 known-dead
    reference read 3 hits (dead band, tripwire not fired). Because this
    is the first carrier measurement on the sealed-verdict lineage,
    red-team card TASK-20260901-6efcd8 was added after the snapshot with
    the coordinator prior recorded first. The independent validator
    (TASK-20260901-91adc1) confirmed the arm with zero discrepancies
    (p_small reproduced exactly as a rational through three independent
    blind implementations). The independent red team
    (TASK-20260901-6efcd8, blind to the validator) returned
    verdict-must-narrow and BROKE the interpretation: the low-wt(e)
    concentration is a theorem of the instrument's definitions at
    amask=1 (10/14 hits forced to wt(e) <= 12 for ANY round function),
    and the proves-too-much control fires (same statistic p_small =
    3.95e-5 on the known-dead r=6 arm).

  decision: close_batch

  decision_scope: >-
    THIS DECISION CLOSES BATCH-2f12ac, RECORDS ITS EVIDENCE AS
    EV-AES-732f71, AND MOVES THE GOAL HEAD.

    It moves current_batch_id to BATCH-2f12ac, dispatch_queue_path to
    coordination/goals/GOAL-AES-003/batches/BATCH-2f12ac/dispatch_queue.json,
    appends the BATCH-2f12ac batch_checkpoints entry, rewrites
    next_action, and leaves latest_verified_commit to be advanced by the
    verified follow-up commit once this ledger archive is post-commit
    verified. It promotes NO knowledge, creates NO hypothesis, and
    asserts NOTHING beyond EV-AES-732f71's scope-narrowed statements:
    in particular it does NOT assert that the carrier is alive (the
    preregistered arm fired mechanically but its significance is
    definition-dominated), does NOT assert that the carrier is falsified
    (the correctly-conditioned statistic is unmeasured), and keeps the
    sealed verdict's carrier clause, in substance, NAMED-UNMEASURED.

  target_ids:
    - GOAL-AES-003
    - RQ-AES-003
    - BATCH-2f12ac
    - EV-AES-732f71
    - TASK-20260901-7e0b71
    - TASK-20260901-91adc1
    - TASK-20260901-6efcd8
    - TASK-20260901-4c0410
    - DEC-20260901-78e2d9
    - DEC-20260901-079719
    - IDEA-20260901-363851
    - EV-AES-ec53f1
    - EV-AES-b2910a

  outcome: >-
    MIXED OUTCOME, both halves independently reviewed and recorded at
    full strength:

    (i) INSTRUMENT VALIDATED (established): Gate 0 reproduced the
    committed L1-AES-R5-P30 receipt field-by-field at full 2^30 (14/14
    hit indices, all 25 trial-map fields, diffs exactly the
    preregistered allowed list) -- the per-trial wt(e) logging is
    proven non-perturbing, the ramp's instrument is certified, and the
    first wt(e) dataset under a nonlinear S-box exists (hits {11 x3,
    12 x7, 16 x4} vs 93.9% miss mass at 16). The validator confirmed
    every number with zero discrepancies, including the exchangeability
    p-value as an exact rational (6.8027e-59) via three independent
    blind implementations. r=6 reference 3 hits, dead band, tripwire
    not fired.

    (ii) INTERPRETATION NARROWED (red team adopted): the
    S0-CARRIER-ALIVE arm fired mechanically, but at amask=1 any hit
    vanishing on word 1/2/3 has wt(e) <= 12 deterministically for any
    round function -- 10/14 hits are that class (top of the forced
    envelope), the 4 active-word hits sit at the miss peak (subclass
    p_small = 1.0), and the same raw statistic 'confirms the carrier'
    on the known-dead r=6 arm (p_small = 3.95e-5). The carrier
    interpretation is NEITHER ESTABLISHED NOR FALSIFIED; the correctly-
    conditioned statistic is unmeasured. One unadjudicated 1-byte
    residual (3/10 at wt(e)=11 vs naive ~0.6) is recorded per rule 8
    as the only candidate genuine signature.

    Composed: the sealed verdict's carrier clause stays named-unmeasured
    in substance; the ramp's Stage 1 is blocked on a statistic
    redefinition; the instrument and the frozen family are certified
    and reusable; the red team's named support signature (extra zero
    bytes beyond the forced envelope, decaying jointly with the excess)
    is the target any repaired statistic must hit.

  rationale:
    - >-
      The preregistered decision rule returned S0-CARRIER-ALIVE and the
      validator confirmed it with zero discrepancies -- that mechanical
      fact is recorded honestly. The red team then demonstrated, by
      derivation and 0-run controls, that the statistic is definition-
      dominated at amask=1 and proves too much; that narrowing is
      adopted into the evidence record in full (OBS-2F1-3/4).
      Recording the fired arm without the narrowing would overclaim;
      recording the narrowing without the fired arm would understate
      the preregistration's own outcome. Both are recorded.
    - >-
      The coordinator prior named the tautology as the primary expected
      joint before any reviewer ran; the red team confirmed it. This is
      the review architecture working as designed, and the prior is
      preserved in the card handoff for audit.
    - >-
      Stage 1a/1b are NOT dispatched: spent before the statistic is
      reconditioned they would measure the same tautology (red team
      J-D). The next action routes through idea-generator for a
      repaired statistic (inventor protocol: new falsifiable proposal,
      not an ad-hoc edit).
    - >-
      No knowledge promotion: the positive content is an instrument
      validation plus one unadjudicated residual.

  next_action: >-
    RANK 1: A REPAIRED CARRIER-STATISTIC PROPOSAL via idea-generator
    (inventor protocol -- new falsifiable proposal, not an ad-hoc edit
    of the tautological statistic). Inputs: EV-AES-732f71 OBS-2F1-3/4
    (the tautology derivation, the forced envelope, the unadjudicated
    1-byte residual), the red team's named controls (mask-conditioned
    restatement of the committed data, 0 runs; seed-531002 J5-2 arm
    with mask decomposition as co-primary, ~2 min), and its named
    support signature (extra zero bytes of e beyond the forced
    envelope, decaying jointly with the excess along the ramp). The
    repaired statistic must provably be NON-tautological at amask=1
    (its null must be satisfiable by construction -- a preregistered
    anchor check analogous to Gate 0, e.g. the statistic must read
    null on a known-dead arm before any alive arm is read). RANK 2:
    IDEA-20260901-363851 Stages 1a/1b, gated on RANK 1's repaired
    statistic (per red team J-D; the frozen family, instrument and
    digests are certified and reusable). RANK 3 (was RANK 2):
    IDEA-20260901-69912d (layer autopsy), unblocked since BATCH-fe0bdc.
    RANK 4 (was RANK 3): IDEA-20260901-02f7c4 battery arms B1-B3.
    RANK 5: the 256-byte random-bijection control (EV-AES-b2910a
    confound 1, ~2-4 min). RANK 6: a decay-specific design if needed
    (EV-AES-5478a0 confound). RANK 7: BATCH-6fe3c2's ledger-archive
    debt (TASK-20260806-ccfd8b, DEC-20260806-435a43 missing). Full
    rationale: DEC-20260901-78e2d9 (selection), EV-AES-732f71 (outcome,
    confounds), TASK-20260901-6efcd8 red_team_report.yaml (controls,
    support signature, boundary falsifiers).

  evidence_refs:
