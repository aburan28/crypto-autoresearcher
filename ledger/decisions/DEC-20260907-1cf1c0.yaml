  rationale:
    - >-
      IDEA-20260901-b4e6eb was read in full. It already holds the transport
      lemma, the prime-n homomorphism argument, the r^3 cost point, the
      redundant-not-lossy verdict, the degree gap, and the composite-order
      control. Leaving it unadmitted while derived tasks recirculate those
      results is the provenance defect DEC-20260903-e9dad9 named.
    - >-
      EXP-ECDLP-a98ea9 measures ordinary base-p digits of the canonical
      prime-to-p lift. EXP-ECDLP-56ee42 measures binary Thue-Morse and
      Rudin-Shapiro signs of the F_p integer representative. Shared estimator
      family, distinct object. The existing 56ee42 Stage 0-2 artifacts do not
      cover a98ea9's r>1 cells, transport gate, or NULL-2.
    - >-
      H-ECDLP-07c7c6 preserves the proposal's claims, ladder, bands, and
      limits. Design tightenings are additive. The missing protocol piece
      from DEC-20260904-4f0f52 is the ordinary-digit versus Witt versus
      character freeze, now on the approved contract.
    - >-
      EXP-ECDLP-3930b1 is the same binary-digit family 56ee42 is already
      approved to measure. It is not approved. That is the double-commit
      this deconfliction exists to prevent.
    - >-
      CAND-D2-A remains complementary and is not dispatched. a98ea9 is the
      empirical measurement of whether the degree gap matters on the
      declared ladder. A second degree-audit task before that freeze would
      double-commit the same question.

  what_this_decision_does_not_do:
