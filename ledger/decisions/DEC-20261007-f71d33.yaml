    The contract freezes degree 4, the two ratios, and the three
    curve roles. Success is the source idea's prediction together
    with the idea's third falsifier: the other rational 2-torsion
    curve must also drop, or the translation reading fails. The
    concrete negative is ratio_double_odd > 1/2 with the instrument
