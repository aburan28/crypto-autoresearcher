    plan is frozen, because a trial plan requires status approved.
    This decision does not launch a driver. The same pass files
    IDEA-20261007-cefca4, IDEA-20261007-1300af, and
    IDEA-20261007-72d11a and does not design them.

  rationale:
    - The standing authorization covers a complete runnable protocol. This one has no driver, so it is not approved.
    - check_approval_capacity was inspected. GOAL-GFPN-380702 has approved_unrun=1 against cap 3. That check is not the reason for review_required.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - ratio_double_odd > 1/2, with the instrument checks passed, is reachable as a recorded outcome, so success is not automatic.
    - The S_5-only nonzero rank, the torsion census, the discriminant, and the memory watch are the instrument controls.
    - An instrument failure is not relabeled as ratio_above_half.
    - This session did not compute a rank and did not claim that the exponent 8/5 moves.
    - No run id was minted. The replication plan does not name a future run slot while the trial plan is unfrozen.

