    check_approval_capacity would not reject an approval of a
    runnable contract with this goal_id. area:GFPN, used when
    goal_id is absent, has six approved contracts with no run
    (EXP-GFPN-3d834b, EXP-GFPN-4a3f2b, EXP-GFPN-7257b5,
