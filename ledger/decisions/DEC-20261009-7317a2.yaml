      - id: RE-1
        what: >-
          execution-report-9456e8.yaml outcome.TW-ALIVE reads "fired" (RR-12).
          TW-ALIVE is defined as "O-A1, O-A1b or O-A2" (RR-13). RA-06 assigns
          O-A3 (RR-01), and analyze_a.py computes no tripwire (RR-14).
        ruling: >-
          A report error by the executor: it misread the card's "Report
          TW-ALIVE as fired, nothing more" as an instruction to write
          "fired". Under the frozen tripwire, TW-ALIVE did NOT fire. The
          report is immutable and is not corrected. This record governs, and
          the review notes it (J-VAL).
      - id: DV-1
        what: RA-06 was given three --gate-report files and --junit, not row-verify.json.
        ruling: >-
          Benign. checks-report.json's G4-R passes only if verify_rows' report
          passes (analyze_a.py line 1012: `(check != "G4-R" or vr["pass"])`;
          RR-15), and RA-06 reads checks-report.json as a gate (gates_read).
          G4-R was therefore gating. J-VAL confirms it.
      - id: DV-2
        what: A-6 append 1 contained a literal "pending" placeholder for its own check results; append 2 recorded them.
        ruling: A wording slip in an append-only file; the prefix rule held after each append. Disclosed, with no effect.
      - id: DV-3
        what: The executor's report names its resolved model as claude-sonnet-5-5 (not probe-verified), under policy executor-implementation.
        ruling: Recorded. The runs are deterministic code; the policy contract was met; no fallback was declared.
      - id: OBS-1
        what: >-
          AR-3 bound choice. The signed U_A's simulated coverage at kappa 1.10
          is 0.94325, below the 0.945 floor, so the governing bound is the
          |dev| quantile (U_A 1.0434; signed 1.0360) (RR-03). This is the
          PDI-6 sensitivity point the adjudication named.
        ruling: >-
          Recorded for J-COV. Both bounds are well below 1.15, so the
          assigned outcome does not depend on the switch.
    computed_outcome:
      outcome_id: O-A3
      as_computed_by: analyze_a.py unmask (RA-06), analysis.json
      standing: >-
