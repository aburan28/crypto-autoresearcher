      - J-CAL and J-PTM: the calibration holds; the null pseudo-cells behave
        as the calibrated law predicts.
      - J-PLANT: planted recovery shows the instrument would have seen
        kappa 1.15.
      - J-COV: coverage is near the floor (OBS-1) but does not move U_A
        across 1.15.
