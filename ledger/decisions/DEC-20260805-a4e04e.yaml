coordinator_decision:
  id: DEC-20260805-a4e04e
  context: >-
    GOAL-SSIQ-001 BATCH-004 closes. It attempted the direct-computation
    unblock of lever L4 that BATCH-003's own next_action specified: compute
    delta_E in-session via bounded smooth-degree isogeny search, bypassing
    WISDE's per-vertex-linkage gap entirely. The instrument worked --
    independently re-verified via live Phi_ell re-fetch, independent Velu
    re-verification, and a full independent re-execution reproducing the
    terminal branch. But the mandatory Phase -1 coverage gate (>=4 of 12
    primes admitted under the pre-registered truncation fallback) failed:
    the confirmatory prime set came out empty, terminal label
    DATA-UNAVAILABLE-BLOCKED. Recorded as EV-SSIQ-94de20, on
    TASK-20260805-798a16 ADMIT-WITH-CONDITIONS and TASK-20260805-b5873f
    CHALLENGE.
  decision: revise
  decision_note: >-
    revise, NOT inconclusive and NOT reject_scoped. This is not BATCH-003's
    shape (inconclusive: instrument validated, blocker was external data
    that does not exist) and not BATCH-002's exact shape either (revise: a
    biased ESTIMATOR). Here the defect is in the frozen contract's BUDGET
    ALLOCATION FORMULA, independently identified by Red Team and
    independently re-verified by the Coordinator directly from numbers
    already committed in this run's own raw-result.json (zero
    re-measurement): the truncation fallback checks each prime's estimated
    cost against an INDIVIDUAL 1/12 share of the reserved budget
    (T_prime=300s), when the ascending-prefix selection it implements
    should be checked CUMULATIVELY against the budget actually reserved.
    Summing the exact same already-committed flat-extrapolation estimates
    ascending by prime: 4 primes fit within the reserved half-budget
    (cumulative 3041.7s <= 3600s) and 6 fit within the full 7200s budget
    (cumulative 6138.3s <= 7200s) -- clearing the Phase -1 gate's own
    stated 4-prime floor without touching the per-vertex cost estimate at
    all. Named GD-7. A revise decision, not inconclusive, because the fix
    is concrete, cheap (zero re-measurement to identify; an estimated
    3042-6138s of the 7200s budget, of which only 90.57s was spent, to
    execute), and does not require a new hypothesis, a new instrument, or
    abandoning L4 -- it requires a versioned amendment to the SAME frozen
    contract's fallback formula.
  target_ids:
    - GOAL-SSIQ-001
    - RQ-SSIQ-9702af
    - H-SSIQ-9e2c71
    - EXP-SSIQ-a85692
    - EV-SSIQ-94de20
    - TASK-20260805-81ffe0
    - TASK-20260805-798a16
    - TASK-20260805-b5873f
  evidence_refs:
    - EV-SSIQ-94de20
  rationale:
    - id: D-1
      statement: >-
        THE INSTRUMENT WORKS, INDEPENDENTLY CONFIRMED. The delta_E-computation
        route this batch built to replace WISDE is genuine: live re-fetch of
        Sutherland's modular-polynomial database for ell in {3,11,23}
        reproduces byte-identical content; independent re-execution of
        velu_verify.py for ell=3 and ell=23 (the largest actually used)
        returns all_ok=True with zero residual on every trial, via an
        independently-implemented verification route; a full independent
        re-execution of the pipeline reproduces the terminal branch;
        C-SEARCH-BIAS correlations reproduce to 14 significant figures. This
        closes the exact instrument gap BATCH-003 left open.
      confidence: high
    - id: D-2
      statement: >-
        THE PHASE -1 GATE FAILURE WAS CORRECTLY DERIVED FROM THE FROZEN
        CONTRACT, AND THE EXECUTOR FOLLOWED GD-4's DISCIPLINE EXACTLY. The
        Validator traced the code (compute_delta_e.py lines 331-360) and
        confirmed the empty confirmatory set is a mechanically exact
        implementation of the contract's own truncation-fallback text, not
        a producer deviation. The Executor disclosed anomaly A-1 (an
        informal smaller measurement that might have admitted the smallest
        prime) prominently and correctly did not substitute it into the
        mechanical result -- good-faith, non-improvisation-compliant
        behavior, exactly what this campaign's standing practice requires.
      confidence: high
    - id: D-3
      statement: >-
        A NEW CONTRACT DEFECT IS NAMED, GD-7, AND IT IS THE DOMINANT FINDING
        OF THIS BATCH -- IT REACHES THE GATE WITHOUT TOUCHING THE COST
        MODEL AT ALL. Red Team's finding, independently re-verified by the
        Coordinator by hand from raw-result.json's already-committed
        per_prime_estimate array (379.7, 598.9, 900.4, 1162.7, 1405.4,
        1691.2, 1984.8, 2294.0, 2552.4, 2861.6, 3159.2, 3444.9 seconds,
        ascending by prime): a CUMULATIVE ascending-prefix reading of the
        reserved budget (T_prime's own stated derivation, 0.5*7200=3600s
        half-reserved, or the full 7200s) admits 4 primes at the half-budget
        reading (cumulative 3041.7s) and 6 primes at the full-budget
        reading (cumulative 6138.3s) -- both clear the Phase -1 gate's own
        stated >=4-prime floor. The individual-cap reading (T_prime as a
        fixed 1/12 share, checked per-prime) admits zero. Both readings use
        the identical, already-committed numbers; nothing was re-measured
        or re-modeled to produce this finding. THIS IS GD-4's EXACT FAILURE
        MODE ONE LAYER DOWNSTREAM: the pre-freeze review stress-tested the
        smoothness parameters (B, X) explicitly (Finding 1/8) but the
        budget-allocation formula that determines how those parameters get
        applied across primes was finalized during the same fix pass and
        never itself received the same scrutiny.
      severity: medium
      standing_repair_adopted: >-
        A truncation/scope-reduction fallback that selects an ASCENDING
        PREFIX of items under a total reserved budget must check the
        PREFIX'S CUMULATIVE COST against that budget, not each item's
        estimated cost against a fixed equal share of it -- an equal-share
        check is the wrong instrument for a selection rule that already
        discards the expensive tail. Effective immediately for any future
        contract in this campaign that uses a prefix-truncation fallback:
        the pre-freeze review explicitly derives BOTH readings (individual
        cap and cumulative-prefix) of any such formula and states which one
        the contract's text and code actually implement, before freeze.
    - id: D-4
      statement: >-
        A SECOND, SMALLER, ORTHOGONAL DEFECT WAS ALSO FOUND (Validator,
        F-1) AND DOES NOT BY ITSELF CLEAR THE GATE, BUT SHOULD STILL BE
        FIXED. The single-largest-prime, flat-extrapolation cost estimate
        plausibly overstates true per-vertex cost at the 1-2 smallest
        primes by ~1.3-2.3x (three independent correction models: the
        run's own disclosed A-1, a Theorem-1.5 degree-scaling model, and a
        Lemma-3.2 table-size-scaling model), on a margin thin enough (1.27x
        at the smallest prime) to matter, but the Validator's own
        construction of these models found this alone never admits more
        than 1-2 of 12 primes -- real, worth fixing, but strictly secondary
        to D-3, which reaches the 4-prime floor with zero cost-model
        correction.
      confidence: medium
    - id: D-5
      statement: >-
        THE CHEAPEST UNBLOCK IS A VERSIONED AMENDMENT TO THE SAME CONTRACT,
        NOT A NEW BUILD, NOT A NEW HYPOTHESIS, AND NOT ABANDONMENT OF L4.
        Only 90.57s of the 7200s run budget (1.26%) was spent, because
        Phase -1 never executed. An amendment correcting the
        truncation-fallback formula to a cumulative-prefix check (D-3),
        optionally also folding in D-4's per-vertex-cost correction, and
        then actually running Phase -1 on the resulting corrected prefix
        (an estimated 3042-6138s, well inside the remaining ~7109s of
        unspent budget) is markedly cheaper than any alternative route
        (full Deuring reconstruction, a new WISDE-adjacent dataset search,
        or retiring L4). Red Team's caveat is adopted: the cheapest
        corrected prefix concentrates on the smaller primes (narrower
        N-range than the originally intended 203-1800-vertex span), which
        risks repeating the shape of the narrow-fitting-window estimator
        bias this campaign already documented once (instrument_calibration,
        DEC-20260805-be2f87) -- so the amendment should widen coverage
        where cheaply possible (e.g. per-prime B/X pinning for excluded
        larger primes) rather than simply taking the cheapest admissible
        prefix and stopping.
  limitations:
    - >-
      H-SSIQ-9e2c71's real-arm prediction (gamma_greedy < gamma_random) is
      UNTESTED. No statement about a delta_E-gradient existing or not
      existing is licensed by this batch in either direction.
    - >-
      No claim about a p^{1/4} algorithm's existence, likelihood, or
      proximity is made or implied anywhere in this decision or its
      evidence record.
    - >-
      GD-7's cumulative-vs-individual arithmetic establishes a property of
      the CONTRACT FORMULA, not a claim about what a corrected Phase -1 run
      would find; whether a real descent-vs-random gap is detectable on the
      corrected prefix remains to be executed in BATCH-005.
    - >-
      Toy scale throughout (p up to 21601, graphs up to 1800 vertices,
      B=X=23 smoothness bound).
    - >-
      Model independence remains absent and unverifiable in this
      environment, unchanged from every prior batch. Evidence strength
      stays capped at preliminary campaign-wide.
  next_actions:
    - >-
      SINGLE NEXT ACTION -- open BATCH-005 as a Coordinator-approved,
      versioned amendment to EXP-SSIQ-a85692 (not a new experiment record,
      not a new hypothesis; H-SSIQ-9e2c71's statement and scope are
      unchanged and this is the same instrument): (1) correct the
      truncation fallback from an individual per-prime budget cap to a
      cumulative-ascending-prefix check against the reserved budget (D-3);
      (2) widen coverage toward the originally intended N-range where
      cheaply possible rather than accepting only the cheapest small-prime
      prefix (D-5's caveat); (3) actually execute Phase -1 (the real
      greedy-vs-random descent test) on the resulting corrected prefix,
      using the ~7109s of this run's budget that went unspent. Optionally
      fold in D-4's per-vertex cost-model correction (a second smoke test
      at the smallest prime) if it does not materially extend scope. Goes
      through the pre-freeze Red Team process WITH GD-7's STANDING REPAIR
      APPLIED: any prefix-truncation fallback formula has both its
      individual-cap and cumulative-prefix readings explicitly derived and
      the operative one named, before freeze.
    - >-
      NOT CHOSEN, WITH REVISIT CONDITIONS (AGENTS.md rule 9). (i) A new
      WISDE-independent dataset search is not pursued: the direct-
      computation instrument already works and the blocker is a contract
      formula, not a data source. (ii) Full Deuring curve-to-ideal
      reconstruction remains correctly declined as out of budget; the
      cumulative-budget fix reaches the gate without it. (iii) The N5
      scoping pass and the p != 1 (mod 12) successor from PF-5 stay open
      and unscheduled, unchanged from BATCH-003's reasoning, while L4's
      now-narrowly-blocked labelling problem is worked to conclusion.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Nothing promoted; evidence strength is inconclusive/preliminary for
      H-SSIQ-9e2c71 itself, below the replicated bar docs/task-lifecycle.md
      step 9 requires. A FIFTH KNOWLEDGE CANDIDATE IS NOW QUEUED
      campaign-wide, distinct from the prior four: "a prefix-truncation
      fallback under a reserved budget must be checked cumulatively against
      that budget, not per-item against a fixed equal share of it" --
      GD-7's general form, independent of this campaign's specific isogeny
      content and potentially reusable by any future contract in this
      harness that uses a similar scope-reduction pattern. All five promote
      together when a genuinely different model becomes available to
      re-check them.
  decided_by: coordinator
  decided_at: '2026-08-05'
