  citation_boundary:
    status: >-
      RETAINED IN FULL, BOTH LIMBS, BY THIS DECISION AND BY NOTHING ELSE. NOT
      LIFTED, NOT NARROWED, NOT WIDENED. This is the THIRD consecutive round in
      which the lift was available and was declined.
    retained_verbatim: >-
      The `P=512` crossover value and its `w=2^80` sign are **NOT citation-eligible**.
      This task does not lift that prohibition. Only a committed Coordinator decision
      on independently reviewed evidence can lift it.
    predicate_extension_verbatim: >-
      In addition to the retained sentence, a row of any EXP-WESOVOW-001
      reconciliation is NOT citation-eligible when either (a) the two anchors disagree
      in the SIGN of the baseline comparison at that row, or (b) the smaller |margin|
      across the two anchors at that row is below that field size's anchor gap |Delta
      log2 T_full + Delta log2 M / 2|.
    why_not_lifted: >-
      REASONED, NOT INHERITED. (a) NOTHING THIS ROUND PRODUCED BEARS ON EITHER LIMB.
      No crossover, anchor, margin, sign or speedup was measured, derived, recomputed
      or tabulated by anyone; the reviewer verified this by enumerating EVERY decimal
      number in all five RC-6 prose artifacts rather than by trusting the claim, and
      found only quoted contract constants, a section number and a schema version.
      (b) EVERY GROUND DEC-20260904-166ab5 AND DEC-20260904-4c81b6 RECORDED FOR
      REFUSING SURVIVES UNTOUCHED: the anchor is still recorded off_curve at three of
      five field sizes and nobody re-verified that status this round; resolving power
      is still unestablished for the RECONCILIATION procedure (CF-7's remainder); the
      overhead c is still a free knob; and both runs still carry `dirty_tree: true`
      unattested (CF-9). (c) THIS ROUND STRENGTHENS THE CASE FOR RETENTION RATHER THAN
      WEAKENING IT: J1 establishes that the contract's own crossover statement is
      defective, so any crossover figure derived under contract version 1 was derived
      under a metrics line that does not agree with the contract's own controls.
      Stating that is not deriving, recomputing or citing a crossover value, and no
      value is stated here. (d) The reviewer RECOMMENDED retaining both limbs; a
      recommendation is not a decision, and this decision adopts it on the grounds
      above.
    machine_flag: >-
      The BATCH-256a94 anchor_reconciliation.json per-row `citation_prohibited` flag
      is scoped by field size and REMAINS KNOWN TO UNDER-REPORT: at least two rows
      carrying `false` at log2 p = 256 fall under the predicate. That artifact is
      snapshot-bound, IMMUTABLE, AND MUST NOT BE EDITED. This batch produced no
      successor to it and did not repair it. Every consumer applies
      DEC-20260904-166ab5, DEC-20260904-4c81b6 and this decision on top of it.
    did_either_limb_fire_this_round: >-
      NO. The RC-6 package is the one place in this batch where the predicate could
      plausibly have fired, because the target metrics line is itself an analytic
      crossover line; it quotes the contract's text without deriving, recomputing,
      tabulating or citing a crossover value or a baseline sign, and it deliberately
      states NO corrected closed form, giving the prohibition as the first of its
      three reasons. The OBJ-4 package computes no crossover, no baseline comparison,
      no margin and no speedup; it states the source's own cost pair at one field
      size, which is a SOURCE FIGURE and not a crossover value or a
      baseline-comparison sign - the prohibition names a crossover at P=512, not every
      quantity indexed by 512, and this decision endorses that reading explicitly
      rather than leaving it to a successor to re-derive.

