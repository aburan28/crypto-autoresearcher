  rationale:
    - >-
      THE DEFECT IS REAL, IT IS CONDITIONAL, AND IT IS NO LONGER RESTING ON ONE
      UNREPEATED DERIVATION. Three batches of this campaign cited `internally
      unsatisfiable` from a single blind re-derivation nobody had repeated. It has now
      been reproduced from the frozen file by two routes in two sessions, corroborated
      by the van Oorschot-Wiener law the published article states in its own words,
      and corroborated again by this program's own committed corrected model from
      BATCH-2e6130, which carries the term the frozen metrics line lacks. The finding
      is and remains CONDITIONAL - unsatisfiable except on the degenerate slice - and
      both the producer and the reviewer state it that way and confirm the degenerate
      witness rather than claiming a contradiction there. This is the shape a defect
      report should have, and it is why the round is composed as `revise` and not as
      an escalation.
    - >-
      THE DRAFTED AMENDMENT IS NOT APPROVED BY THIS DECISION AND EXP-WESOVOW-001 IS
      NOT AMENDED. Drafting is not amending. The draft carries `status: draft`,
      `in_force: false`, `approved_by: null`, a statement forbidding any reader to
      cite any clause of it as governing, and an enactment block naming three
      decisions that are NOT sufficient to enact it - including the one that ordered
      it. Enacting a protocol amendment against a frozen contract is a separate
      committed Coordinator decision on a reviewed draft, and batch.yaml names a
      RED-TEAM PASS on that draft as a precondition for approving it. This round ran
      ONE reviewer and supplied no red-team pass. The specification file is in no
      write scope of this batch and was not touched.
    - >-
      OBJ-4 CLOSES THE PROVENANCE GAP AND CLOSES NOTHING ELSE, AND THE DIFFERENCE IS
      THE WHOLE POINT. Every prior fidelity check in this campaign verified the frozen
      transcript against itself or against code derived from it. This is the FIRST
      check against the published article, and it succeeded: ten of ten
      character-identical, zero derivations, every difference exactly 0.0, relation
      symbols matching, on two independent retrievals and three extraction engines
      across two sessions, plus a third re-fetch and re-extraction by the
      orchestrating session that reproduced the checksum and recovered the identical
      set from both of the producer's retained extractions. IT IS A FACT ABOUT TEN
      NUMBERS FROM ONE VENUE. It says nothing about the other ~340 lines of the
      transcript, nothing about whether the article's estimates are correct, tight or
      reproducible, and nothing about any artifact derived from the transcript.
    - >-
      THE SINGLE-VENUE EXPOSURE IS THE ROUND'S PRINCIPAL RESIDUAL, IT IS UNCLOSED,
      AND IT CANNOT BE CLOSED HERE. All three retrievals came from one archive. If
      that archive's copy were itself corrupt, every retrieval would agree and every
      one would be wrong, and nothing in this round could tell the difference. The
      producer's arXiv attempt was rate-limited and it honestly left the question
      open; the reviewer closed the question, and the answer makes the exposure WORSE:
      the paper is not on arXiv at all - three queries, all HTTP 200, all zero
      results, with a control query returning five other papers by the same author so
      the query is known to have been live - and the archive records it as a preprint
      with no journal publication. A SECOND-PUBLISHER COPY DOES NOT EXIST TO FETCH.
      This is recorded as the load-bearing limitation of the J4 result rather than as
      a footnote, and it is infrastructure and world-state, never negative evidence
      about anything.
    - >-
      F-1 IS A CONFIRMED LIVE DEFECT IN THE DRAFT'S OWN CONTROL AND IT IS CARRIED
      FORWARD WITH ITS ONE-CHARACTER FIX. AC-4's eighth pattern carries an uppercase
      literal that the scanner's lowercased haystack can never match, so the pattern
      can never fire. The orchestrating session verified it directly and
      independently: the pattern alone returns zero hits on a sentence built to make
      it fire, the same pattern lowercased returns one hit on that sentence, and THE
      FULL AC-4 VOCABULARY RETURNS ZERO HITS ON IT - so the control passes exactly
      the drift it exists to catch. It is the same defect class the package itself
      disclosed and repaired elsewhere in the same control, surviving the repair,
      because the recorded remedy audited gap classes and `every gap class was
      widened` is not the statement `every pattern can now fire`. It does NOT
      overturn J2, because the drift it would have caught does not exist in the draft
      on an independent hand scan. IT IS NOT FIXED HERE: amendment_controls.py is a
      snapshot-bound producer artifact and this is an archive task; editing it would
      rewrite the object under review.
    - >-
      F-3'S OVERSTATEMENT IS CORRECTED ON THE RECORD RATHER THAN INHERITED. `C3
      forces the same set independently of C4` is not true: C3's second clause
      entails C4, which is that clause at a single point, so the producer's C3 route
      is the same inference from a strictly stronger premise and invites a reader to
      count one source as two. The reviewer's better version is adopted as the
      record of what C3 genuinely contributes: C3's FIRST clause, monotonicity, needs
      no charging law at all and gives that whenever the overhead-inflated
      full-memory time exceeds the baseline NO CROSSOVER EXISTS ANYWHERE, while the
      metrics line returns a finite one - the metrics line asserts the existence of
      an object C3 forbids. That strengthens the finding, and the satisfying set is
      unchanged either way.
    - >-
      TWO WARRANT DEFECTS ARE RECORDED AND ARE NOT TREATED AS GROUNDS TO REJECT THE
      PACKAGE. F-2 (the exhaustiveness claim is literally false in exactly two lines,
      both bare container keys that were read and confirmed harmless) and F-4 (an
      unnecessary functional-form posit, honestly named by both the artifact and the
      instrument) are defects in WARRANTS, not in the conclusion, and the conclusion
      survives without either - the reviewer's own derivations avoid both. Superseding
      an immutable artifact over a two-line coverage gap would be disproportionate and
      would destroy an accurate record; a successor record naming both is the right
      response. This adopts the reviewer's R-4 as a decision.
    - >-
      NEITHER INDEPENDENCE PROPERTY THIS ROUND CLAIMS IS MODEL-INDEPENDENCE, AND THAT
      IS RECORDED AS A WEAKNESS IN ITS OWN RIGHT RATHER THAN AS BOILERPLATE. The RC-6
      producer's own receipt records an adapter-resolved model identifier that DOES
      NOT AGREE with the self-report of the session that served it, with
      `model_verified: false`, no probe run, and the divergence escalated rather than
      absorbed; the reviewer self-reports the same family as that self-report; and the
      reviewer established that it and the OBJ-4 producer share a scratchpad and
      therefore a top-level session. The round is SESSION-INDEPENDENT, NOT
      MODEL-INDEPENDENT, AND PROBABLY NOT MODEL-DIFFERENT, and it may never be
      presented as agreement between distinct models. What that leaves open is
      concrete and already named by DEC-20260904-4c81b6: a shared misreading, a
      mis-parsed glyph, a systematically preferred slot, a shared assumption about
      which figure is the figure. The only partial mitigation is for the J4 limb
      alone - three extraction engines from at least two codebase lineages - and it
      does not extend to J1, J2 or J3, which are acts of reading and reasoning by one
      model family.
    - >-
      F-6 IS A SECOND LIVE INCONSISTENCY IN THE FROZEN CONTRACT AND NO CARRIED-FORWARD
      ITEM NAMED IT. A note at line 49 describes control C1 as carrying a `3-bit`
      tolerance while C1's own tolerance line reads 0.75 bit and the 3-bit figure is
      the stopping rule's rerun threshold. Found independently by the producer, which
      correctly recorded it as orthogonal and did not touch it, and by the reviewer
      reading the whole file. It bears directly on how any reader interprets the very
      control the draft annotates. It is added to the carried-forward list by this
      decision (CF-14).
    - >-
      THE ROUND'S ONE INDEPENDENCE GATE THAT WAS EXPECTED TO RUN FOR THE FIRST TIME
      STILL DID NOT RUN, AND THAT IS RECORDED AS AN OUTSTANDING GATE. CF-11 gave this
      batch a standalone review_plan.yaml with a top-level `review_plan` key, the only
      one in the batch directory, precisely so that
      `tools/check_review_independence.py --batch` could resolve it. Neither the
      reviewer nor this composing task ran it. The plan's resolvability is therefore
      asserted from its SHAPE and not demonstrated by the tool, CF-11 remains
      discharged only in part, and hand-verification of blindness - reading the
      report and its per-path attestation - is WEAKER THAN THE TOOL and is recorded
      as such (DEC-20260904-166ab5 PD-6).
    - >-
      EVERY CONTRACTED OUTCOME OF THIS BATCH WAS TREATED AS A RESULT IN ADVANCE, AND
      THE ONE THAT OCCURRED IS NOT INFLATED BECAUSE IT WAS THE FAVOURABLE ONE. A
      `not_reproduced` verdict would have meant three batches reasoning from a
      misread and would have been the round's most valuable finding; the reviewer
      searched for it, including through two dissolving readings the producer never
      considered, and records the SEARCH rather than merely the absence. A
      `not_retrievable` outcome would have left the gap open with a measured account
      of why. Neither occurred. What did occur is a confirmation, and a confirmation
      bought by an independent method is worth exactly what it is worth and no more.

