  observations:
  - >-
    The epoch-1 claim was acquired at 2026-10-21T14:26:38Z and released
    failed at 2026-10-21T14:26:49Z with note RBS-ICPERF-c4a91e and empty
    artifact_sha256. No trial outputs are committed under this experiment's
    run directory in the inspected branch. The release does not identify the
    failure cause or certify whether a scientific process started.
  - >-
    The immutable original design queue still declares TASK-20261017-054f82
    queued and the frozen trial plan still points to that queue. A historical
    release is not an archive receipt or permission for another claim epoch.
  rationale:
  - >-
    Static source inspection shows run.py writes a manifest with only run ID,
    experiment ID, status, stage and sample fields. The standard supervisor
    run-schema check requires code, environment, inputs, timing and result,
    including code.commit and code.command. check.py checks narrower file
    presence, raw-result fields and manifest ID substrings. If this source
    reached the supervisor output gate, its emitted manifest would fail the
    standard schema; this finding does not explain the observed failed release.
  - >-
    The frozen plan lacks input_sha256 and the approved specification lacks
    input_bindings. The separate executor handoff lacks exact execution and
    archived_by bindings; the original design packet supplies no verified
    prospective approvable:true preapproval packet, complete archival binding
    or lawful lane for a new claim. These are current admission gaps.
  - >-
    The successor queue preserves both embedded handoffs and all other card
    fields, changes only the producer top-level state to blocked, and leaves
    its dependent snapshot queued. It prevents new claims when this successor
    is selected; it does not rewrite the original plan or queue.
  withheld_contracts:
    ruling: >-
      Withhold EXP-ICPERF-b2f2d0 from unqualified and goal-scoped ordinary
      experiment selection, preserving its frozen approved status. Do not
      dispatch another epoch of TASK-20261017-054f82 from the old plan or
      original queue. A named --experiment lookup may still display the row
      for inspection, and direct use of the old plan or queue remains a
      residual route that this decision expressly disallows.
    membership_basis: >-
      Exact experiment ID EXP-ICPERF-b2f2d0, its frozen one-trial plan and
      TASK-20261017-054f82; no title or area pattern.
    ids: [EXP-ICPERF-b2f2d0]
    rule_9_fields:
      evidence: >-
        The 2026-10-21 epoch-1 release reports failed with empty artifact
        hashes and no committed run outputs in the inspected branch. Static
        inspection of the pinned runner and checker establishes the
        manifest-schema mismatch and the original queue/plan admission gaps.
        Original queue SHA-256:
        92a37f0094b6689eeef54c7fb27164e7297ae3e2df0079500687fb297ac2c465.
      budget: >-
        No research spending cap is imposed. The original single-run,
        60-second watchdog and 1 GiB task protection remain machine limits;
        they do not supply admission or explain the failed release.
      test_boundary: >-
        One frozen seed-20261017 geometric-sample contract with 64 draws at
        p=1/50, its 2026-10-21 claim/release and committed artifact inventory.
        This decision ran no trial and does not infer an output or failure
        mechanism from the release note.
      remaining_uncertainty: >-
        The cause of the failed release and any off-branch or uncommitted
        runbook-session detail are unknown here. A valid successor sample's
        result, host latency, larger-table behavior and ECDLP cost remain
        unmeasured by this correction.
      successor_or_revisit: >-
        Keep the old experiment withheld. Allocate fresh EXP, RUN, TASK,
        batch and approval IDs for a schema-valid one-seed successor.
        Freeze exact source/input hashes, complete execution and archive
        ownership, supervisor-valid positive and negative fixtures, runbook
        lint receipt and lawful lane; require an exact prospective
        approvable:true packet while the new specification is review_required.
        A later released_contracts decision may lift this exact hold only
        after independent evidence that the old frozen contract itself is
        lawfully executable without rewriting its records.
