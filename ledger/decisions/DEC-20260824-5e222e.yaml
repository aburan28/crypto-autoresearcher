coordinator_decision:
  id: DEC-20260824-5e222e
  decided_by: coordinator
  decided_at: '2026-08-26'
  goal_id: GOAL-MLKEM-005
  decision: >-
    CLOSE BATCH-f9780d as INCOMPLETE, admit EV-MLKEM-59e4a4 at strength
    single_run / claim tier toy, and set exactly one next_action: implement
    DEC-20260815-3e8e9c's binding condition (i) -- the RT-CTRL-2 zero-compute
    instrument fixes -- BEFORE any further capped run at this basis. GOAL-MLKEM-005
    stays `active`. No hypothesis moves. No budget is extended.
  target_ids: [GOAL-MLKEM-005, BATCH-f9780d, EV-MLKEM-59e4a4, TASK-20260824-b3e9da, RQ-MLKEM-001]
  supersedes: null
  rationale: >-
    The batch answered its question on one side and produced nothing on the
    other. The 75-bit reference arm failed terminally and reproducibly, NOT at
    BKZ.Param, under strategies bytes different from every prior run of that
    cell -- which is the one thing route (c) was built to establish and it is
    established. The 100-bit target arm ran at least 14448 s, was capped, and
    wrote no record at all. None of the four outcomes the task card declared in
    advance is realised, because all four presuppose both cells terminating.
    Re-running the 100-bit cell with a larger budget is REFUSED as the next
    action, and that refusal is the substance of this decision. Both independent
    reviews found the same blocker: DEC-20260815-3e8e9c's condition (i) required
    instrument fixes before any further capped run, it was not implemented, not
    mentioned, and recorded as no deviation -- and its pre-quantified cost was
    then incurred verbatim. A larger budget without those fixes buys the same one
    bit a third time.
  what_the_reviews_established_against_this_coordinator: >-
    Recorded here rather than in a note, because the findings are against the
    dispatch and the dispatch was mine.
    (1) THE REFERENCE ARM WAS ALREADY KNOWN TO FAIL. The same cell, same seed, is
    recorded in DEC-20260815-3e8e9c raising the identical error at 2502.74 s, and
    that decision's own line 367 calls the figure "a FAILURE cost". The task
    card, instrument_readiness_20260824.md and DEC-20260824-526f89 all described
    it as what the cell "cost". A time-to-failure is not a baseline, so the
    matched pair had no baseline even in principle, and the same mislabelling
    undersized the budget.
    (2) THE INSTRUMENT COULD NOT HAVE RECORDED A SUCCESS. `tours` is never
    assigned by fpylll; the root-Hermite formula is wrong by 57.242 at d=512.
    (3) THE BUDGET MODEL ASSERTED A TRUE BUT IRRELEVANT PREMISE. Per-operation
    parity at 2 limbs holds and was MEASURED by the Red Team (1.2 per cent apart
    at tour level, identical 26 tour counts); total-cost parity does not follow
    from it, and the goal's own strongest committed number contradicts it 376.4x.
    (4) A GATE ITEM WAS UNSATISFIABLE WHEN WRITTEN.
  next_action: >-
    ONE ACTION: implement DEC-20260815-3e8e9c condition (i) as a successor task --
    at minimum a per-cell STARTED stub written before the cell runs, a SIGTERM
    handler that flushes partial state, per-tour progress, a machine-readable
    resource record (peak RSS, CPU time), `tours` obtained from bkz.trace rather
    than a non-existent attribute, and the root-Hermite factor corrected to
    (b0/q^(1/2))^(1/d). Only after that instrument exists may the 100-bit cell be
    re-attempted, and its budget must be sized from the 14448 s LOWER BOUND this
    batch measured, not from the predecessor's 2502.74 s failure time.
  knowledge_promotion:
    promoted: []
    warranted: false
    not_warranted: >-
      The durable lesson here is an instrument-and-provenance lesson, and the
      corpus already carries its parts: KN-TECH-14efa5 for obtaining fpylll,
      KN-TECH-797223 for the recipe's container dependence, KN-FIND-f54a82 for
      the isolated-step-versus-tour boundary. What this batch adds -- that a
      producer input recorded BY PATH rather than BY CONTENT can become
      unrecoverable and silently confound a control -- is a candidate KN-FIND,
      but it rests on a batch whose own verdict is `incomplete` and whose reviews
      are same-model. Promotion on that footing would be exactly the overclaim
      this program's rules exist to prevent. Revisit when the successor batch
      produces a terminal result under a fixed instrument.
  claim_tier: toy
  scope: >-
    One basis, one dimension (d=512), one block size (beta=55), one seed, one
    container, two precisions of which one produced no record. Nothing here is a
    statement about ML-KEM at any standardized parameter set.
  rule_12_status: >-
    UNMET AND UNWAIVED. Producer, Coordinator, Validator and Red Team all resolve
    to claude-opus-5. Agreement between the reviews and this decision is
    correlated same-model judgement and is NOT independent corroboration; the
    evidence record's strength is held at single_run for that reason among
    others.
