        iv2_counts_identical with the reconstruction that settles it.
    - joint: J3 recorded outcome of every control IV-1..IV-9 against its frozen text
      assigned_to: TASK-20260907-d47eb0
      attack_plan: >-
        For each of IV-1 through IV-9, quote the control frozen text from
