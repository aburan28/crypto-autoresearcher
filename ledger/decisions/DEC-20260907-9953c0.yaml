    note: >-
      Pre-allocated and verified free with tools/allocate_id.py. It is NOT a
      target_id because the record does not exist yet: this decision only
      OPENS the review round, and the evidence record is authored later under
      TASK-20260907-175a4a from what the two independent reviews actually
      return. Listing an unwritten record as a target would assert a
      conclusion this decision does not have, and tools/validate_ledger.py
      rejects it as an unknown target.
  rationale:
  - >-
    VALIDITY BEFORE INTERPRETATION. AGENTS.md and agents/coordinator.md
    responsibility 6 require the Coordinator to verify a run set before
    interpreting it: expected run count, schema-complete manifests, seed
    integrity, raw and summary agreement, and control comparability. The
    EXP-ECRANK-73275e package has had none of that checked by an agent that
    did not produce it. Opening this round is the cheapest action that can
    change what the program knows, and no interpretation of the package is
    admissible before it completes.
  - >-
    THE PACKAGE CARRIES AT LEAST THREE ITEMS THAT COULD INVALIDATE IT, AND
    THEY ARE NAMED HERE RATHER THAN DISCOVERED LATER. The frozen control
    IV-1 says a known-false-family failure voids ALL runs, and R7 records no
    n equals 6 build at all plus n equals 8 totals 5, 6, 7, 7, 7, 7, 6, 7
    against an expected 7. IV-3 records 0 of 9 planted instances built, so
    the positive control may never have evaluated. R4 raw-result.json
    carries iv2_counts_identical false against report prose saying the
    counts agree. Each of these is a validity question, not a mathematical
    one, and each is assigned to exactly one reviewer below.
  - >-
    TWO REVIEWERS, SEVEN OWNED JOINTS, NO SHARED JOINT. Reviewers told only
    to review a result converge on whatever is most legible, and their
    agreement then measures shared taste rather than coverage. The seven
    load-bearing steps are enumerated and each has exactly one owner, with a
    worked attack naming where the Coordinator thinks it breaks. The
    Validator owns receipt, control-outcome and reproducibility verification
    plus the blind re-derivation (J1 to J4); the Red Team owns
    discrimination, hidden assumptions, end-to-end cost, scope honesty and
    the cheapest falsification control (J5 to J7).
  - >-
    CONCURRENCY IS THE POINT, NOT A SCHEDULING CONVENIENCE. The two reviews
    are independent by construction and must not read each other, so they
    run at the same time with disjoint write scopes and mutual blindness,
    each attesting to what it read. max_concurrent is 2, sized to what this
    environment can serve without degrading. Both run review-adversarial at
    xhigh in fresh independent sessions with degraded_allowed false; neither
    tier is downgraded and neither report may change any status.
  - >-
    THE PRIOR IS RECORDED FIRST, IN FULL, AND IS FALSIFIABLE. Concurrence
    with a recorded prior and concurrence with an unrecorded one look
    identical afterwards and mean different things. The prior below names
    ten expectations, says which one is most likely wrong, and names the
    single finding that would overturn it as a whole.
  - >-
    RANKING. GOAL-ECRANK-002 is an ECC goal, so it is selected before all
    others and its campaign budget is unlimited (AGENTS.md, ECC comes
    first). Its recorded next action is the executed contract, whose review
    is the only step that converts the executed package into anything the
    program can use. RANK 1 of the goal head is unchanged and still gated:
    the breakthrough-tier review of the UNPROMOTED C1-closure candidate of
    DEC-20260905-7adca0 waits on review-breakthrough becoming servable at
    max, and is never downgraded. This batch is RANK 2 and does not touch
    RANK 1.
