    coordinator_prior: >-
      Recorded BEFORE any reviewer of this round ran, and deliberately
      falsifiable.
      (1) I expect J1 to find the run set formally complete -- eight
      enumerated runs, the nested run record schema SR-3 with command.txt and
      environment.json companions, and seeds exactly 760806 for R3 and R4,
      760810 for R5, 760812 for R7 and 760808 for R8 as declared -- and to
      find one provenance defect I am pre-committing to rather than
      discovering afterwards, namely that execution-report.yaml declares
      resolved_model_id cursor-grok-4.6 with model_verified false,
      fallback_used true and git_dirty_at_runs true. That is a provenance
      finding, never a defect in the mathematics.
      (2) I expect J2 to confirm R4 equals R3 on the instance list and on
      counted ops, 9191003 both. THE SINGLE MOST DANGEROUS ITEM IN THE
      PACKAGE is the R4 raw field iv2_counts_identical false against the
      report prose that the counts agree after JSON serialization. My prior
      is that the producer explanation, int-keyed versus str-keyed dicts
      compared before dump, is CORRECT -- AND THIS IS THE PLACE I MOST
      EXPECT TO BE WRONG. A raw record saying false while a summary says
      identical is precisely the shape of a re-scored run; any divergence
      beyond dict-key typing means IV-2 fails and, by the frozen
      invalidation rules, the R3 and R5 readings are void.
      (3) I expect J2 to recompute ops_cap_respected as the EXACT boolean
      counted_ops less than 1.0e8 required by SR-9, with no tolerance band,
      and to find it false for R5 alone (100002120 at or above 1.0e8) and
      true for the other seven. I expect the R5 found 0 to be INERT IN BOTH
      DIRECTIONS: it stopped at b_index 666 of 10000 and says nothing about
      n equals 8 in either direction.
      (4) IV-1 IS WHERE I EXPECT THIS ROUND TO BREAK, and I record that
      before either report returns. The frozen control fixes certified
      totals on the known-false all-ones family at n minus 1, that is 5 at
      n equals 6 and 7 at n equals 8, and says IV-1 failure voids ALL runs.
      The record shows NO BUILD AT ALL at n equals 6 on all eight tuples
      (degenerate_deg_s_2) and totals 5, 6, 7, 7, 7, 7, 6, 7 against
      expected 7 at n equals 8, with n8_all_match false. My prior is that
      IV-1 as frozen is NOT satisfied. I am not deciding that and neither
      reviewer is asked to: J3 establishes the exact recorded verdict
      against the frozen text, J5 establishes whether the control
      discriminates at all, and only a later Coordinator decision composes
      them. If IV-1 did fail, the correct reading is that the run set is
      invalid or infrastructure-limited under core rule 3, NOT that anything
      about HEUR-1 was learned.
      (5) I expect J5 to find that IV-3 and R8 DID NOT DISCRIMINATE: 0 of 9
      plants were built, recovered is 0 of 0 and the exponent gate never
      evaluated. A control that produced no objects cannot fail, which
      docs/inventor-protocol.md treats as the canonical artifact tell rather
      than a pass.
      (6) I expect J5 to find the R6 zero weaker than it looks: found is
      empty but null_proof_first is null (PD-1), so the run does not itself
      exhibit the infeasibility proof the contract required to be frozen
      first, and the same degenerate_deg_s_2 rejection that emptied R7 and
      R8 is a live alternative explanation for an empty R6.
      (7) I expect J6 to find PD-3 material: the n equals 8 Bezout
      enumeration used the integer a,b box of width min(H, 20) rather than
      the full rational height-H coefficient lattice, so R5 did not measure
      the quantity the frozen contract defines, independently of the
      exhaustion.
      (8) I expect J4 to REPRODUCE 15 at 100, 22 at 1000 and 28 at 10000 and
      feasibility fraction 0.002 from the contract statement alone. That is
      my prior and the one I would most like overturned: a blind
      disagreement localises to one of two named implementations and is
      worth more than the agreement.
      (9) I expect J6 to find at least one cost-model gap.
      wall_seconds_monotonic and wall_seconds_timestamp_span are identical
      to six decimal places in every one of the eight runs, which is one
      instrument reported twice rather than the two independent measurements
      SR-10 asks for; and the IC-1 exclusions mean counted_ops is a LOWER
      bound on true cost.
      (10) What would overturn the prior as a whole: a finding that the R3
      28 certified instances were produced by a code path the controls never
      traverse. If the counted path and the control path differ, 28 has no
      positive control behind it and no reading of it survives, whatever its
      arithmetic.
      This prior is a pre-commitment, not an instruction. A reviewer that
      contradicts it has produced this round most valuable output and must
      say so plainly.
