    coordinator_prior_earlier_frozen_record:
      path: >-
        coordination/goals/GOAL-ECRANK-002/batches/BATCH-e15a65/coordinator-prior-20260907T174252Z.md
      commit_sha: 10a0aacd7
      frozen_at: '2026-09-07T17:42:52Z'
      relationship_to_the_prior_below: >-
        A SECOND, EARLIER Coordinator prior over the same run set, frozen and
