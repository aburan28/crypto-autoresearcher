coordinator_decision:
  id: DEC-20260906-e4a2f7
  recorded_at: '2026-09-06'
  context: >-
    Repair of one of the six administrative blocks DEC-20260807-5adc24 opened
    (decision: pause) on 2026-08-07. That decision found ledger/handoffs/
    TASK-20260727-009.yaml (EXP-HZM-001) carries `authorized_by:
    "DEC-20260727-002"`, a real decision about an entirely different goal and
    batch. This session independently re-verified that finding by reading
    DEC-20260727-002 in full: it is GOAL-ECDLP-001's BATCH-009
    campaign-budget extension (maximum_batches 6 -> 8) authorizing
    TASK-20260727-002 through -006, and contains zero occurrences of
    EXP-HZM-001, H-HZM-001, IDEA-20260723-002, or GOAL-CRYPTO-001 (H-HZM-001's
    actual goal). This session also independently grepped ledger/decisions/
    for "EXP-HZM-001" and "H-HZM-001": the only hit, for both strings, is
    DEC-20260807-5adc24 itself (the administrative-block finding). No other
    decision record, under any identifier, approves this experiment. OPTION A
    applies: no real prior Coordinator approval for EXP-HZM-001 exists
    anywhere, under any citation. Per DEC-20260807-5adc24's own next_actions,
    this decision re-runs the approval act with a genuine, checkable
    Coordinator review, citing itself rather than a fabricated or
    misattributed record.
  decision: approve
  target_ids:
    - EXP-HZM-001
    - H-HZM-001
    - TASK-20260727-009
    - GOAL-CRYPTO-001
    - DEC-20260807-5adc24
  rationale:
    - >-
      RE-VERIFICATION, NOT ASSUMPTION. DEC-20260727-002 was read in full by
      this session: its context, target_ids ([EXP-IT-001 lineage under
      GOAL-ECDLP-001 BATCH-009]), and rationale concern SG-ECDLP-002 and a
      campaign-budget amendment, not any HZM record. A repository-wide grep
      for EXP-HZM-001 and H-HZM-001 across ledger/decisions/ returns only
      DEC-20260807-5adc24, confirming DEC-20260807-5adc24's own audit rather
      than merely repeating it.
    - >-
      FRESH SCIENTIFIC REVIEW, NOT A RUBBER STAMP. The frozen contract's own
      quality is assessed on its merits, independent of the citation defect.
      H-HZM-001 states an external, quoted mechanism (Mahalanobis,
      arXiv:2607.09814v1, as pinned in the immutable TASK-20260723-301
      candidate_report.yaml), with formulas anchored to specific displayed
      equations, and its own preregistered expectation is FALSIFICATION
      (H/q >= N^(1-o(1)) at every tested (L,d)), so the design is not tuned
      toward a foregone positive result -- the opposite of premature closure
      or manufactured approval.
    - >-
      CONTROLS SATISFY "controls before belief" (docs/inventor-protocol.md).
      CTRL-HZM-BRUTE-FORCE is an independent ground-truth check (direct minor
      evaluation with no signature hashing) on a frozen subset;
      CTRL-HZM-CERTIFICATE reverifies every accepted duplicate by independent
      code; CTRL-HZM-MANUSCRIPT-ALIGNMENT is a hard pre-registered stop
      (inconclusive_misalignment) before any enumeration run if the pinned
      formulas cannot be anchored to one trial/defect/stopping rule. These
      are exactly the null-object and pre-registration disciplines this
      program requires before crediting a signal.
    - >-
      CLAIM-TIER AND SCOPE DISCIPLINE ARE CORRECT ON THEIR FACE (CLAUDE.md
      rule 4). claim_tier is toy; the specification states explicitly that
      gate survival "triggers only independent theorem review of the pinned
      manuscript; nothing further is authorized," and interpretation_limits
      correctly bars any standardized-curve, key-recovery, or crypto-tier
      inference from a toy-scale formula-tracking result.
    - >-
      BUDGET AND FIT WITH THE GOVERNING GOAL. GOAL-CRYPTO-001 is `active`
      with an unlimited campaign budget (BUDGET-AMEND-20260828-2a257e) and a
      standing hold (DEC-20260731-002, re-verified 2026-08-18) that awaits
      "newly retrieved primary sources or externally supplied formal
      mechanisms with quoted source semantics" before admitting NEW curve
      work. EXP-HZM-001 is not new work solicited by that hold: it is a
      pre-existing (BATCH-003-era, 2026-07-23) audit of exactly such an
      externally sourced, quoted mechanism, whose only defect was an
      unrelated approval citation. Running it discharges a standing audit
      obligation rather than opening a new admission under the post-BATCH-013
      hold criteria. Its own budget (6300s wall-clock total, 1.75 CPU-hours,
      4 runs, 4GB memory) is modest and bounded.
    - >-
      EXECUTABILITY WITHOUT SILENT SUBSTITUTION. The contract names exact
      equation anchors, a frozen cost ledger with named stages, primary gate
      sizes (12,1) and (16,1), explicit stopping and invalidation rules, and
      a complete required_artifacts list -- sufficient for an Executor to run
      without inventing missing decisions.
    - >-
      NEITHER OPTION A(b) NOR A DEFECT-DRIVEN REVISE/PAUSE APPLIES HERE. No
      flaw was found in the contract's design, controls, budget, or scope
      that would warrant sending it back; the only defect found anywhere was
      the fabricated citation this decision repairs.
  evidence_refs:
    - ledger/decisions/DEC-20260807-5adc24.yaml
    - ledger/decisions/DEC-20260727-002.yaml
    - ledger/hypotheses/H-HZM-001.yaml
