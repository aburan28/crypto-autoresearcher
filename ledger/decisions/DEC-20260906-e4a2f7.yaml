    - ledger/goals/GOAL-CRYPTO-001.yaml
    - ledger/decisions/DEC-20260731-002.yaml
    - experiments/EXP-HZM-001/specification.yaml
    - ledger/handoffs/TASK-20260727-009.yaml
  limitations:
    - >-
      SCOPE OF THIS ACT. This decision approves the SCIENCE and repairs the
      administrative provenance gap only. It does NOT itself edit
      experiments/EXP-HZM-001/specification.yaml (whose `status` field
      currently reads `paused` per the 2026-08-08 status_enactment_note) and
      does NOT flip any execution-authorization flag or dispatch an Executor.
      This session's write_scope is ledger/decisions/ and ledger/corrections/
      only. A future Coordinator session with write access to experiments/
      must enact this approval in the frozen specification file (mirroring
      the 2026-08-08 pause-enactment pattern) before /run-experiment treats
      EXP-HZM-001 as dispatchable.
    - >-
      TASK-20260727-009.yaml's `authorized_by: "DEC-20260727-002"` field
      remains exactly as committed -- it is an immutable record and is not
      edited by this decision. The false citation stays visible in that file
      for auditability; any future dispatch of this work must cite
      DEC-20260906-e4a2f7 (this record) as the operative authorization, not
      the original false citation.
    - >-
      This decision does not pre-judge EXP-HZM-001's outcome. The
      hypothesis's own preregistered expectation is falsification of gate
      survival; both outcomes (survival or falsification) remain fully open
      and decidable from the frozen metrics.
    - >-
      This decision does not re-review or touch EXP-SEMAEV-002, EXP-PMA-001,
      EXP-MLKEM-008, EXP-JMV-001, or EXP-JMV-004, each of which receives its
      own independent decision under this same repair effort.
  next_actions:
