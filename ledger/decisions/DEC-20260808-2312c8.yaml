coordinator_decision:
  id: DEC-20260808-2312c8
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-3033bc
  recorded_by_task: TASK-20260808-c0a95d
  archived_by: TASK-20260808-c0a95d
  decided_at: '2026-08-08'
  decision: revise_and_pause
  context: >-
    BATCH-3033bc produced one max-effort proposal outside the closed m=3
    two-way x-oracle MITM construction, snapshot-committed its exact bytes,
    obtained an independent xhigh Validator review, and snapshot-committed that
    report. The review verdict is REVISE and names blocking cost, probability,
    inference, control, ceiling, novelty, and budget defects.
  decision_scope: >-
    This decision governs only whether IDEA-20260808-c4b462 advances to an
    experiment-design task. It decides nothing about the truth of prime-field
    ECDLP security, moves no hypothesis or research-question status, and does
    not close the broader probabilistic-propagation lane.
  target_ids:
    - GOAL-ECDLP-001
    - BATCH-3033bc
    - IDEA-20260808-c4b462
  evidence_ids:
    - EV-ECDLP-d5e2e9
  source_snapshot_commits:
    proposal: 99c8726d325502871333c5bbad42e9975e1fecd6
    independent_review: b96bc9167076d2856687b174c6447f83ddb5c5a5
  rationale:
    execution_authorization:
      granted: false
      reason: >-
        The frozen proposal's gamma>1/6 gate is only a raw group-work crossover.
        Mandatory full-cost accounting gives N^(7/9-gamma+o(1)) and requires
        gamma>5/18 to beat rho. The frozen stopping, prior, table, and Pareto
        interpretation do not adjudicate that gate.
    probability_obligation: >-
      Expected collision multiplicity cannot be substituted for the probability
      that a root contains at least one usable distinct match. The claimed
      restart runtime needs a second-moment/no-clustering condition and Boolean
      root-success inference.
    statistical_obligation: >-
      Cross-pairs share list elements, point sums, roots, curves, and models.
      Clustered or exact randomization inference, a free intercept, finite-size
      terms, power, pooling, and zero-count rules must replace independent
      cross-pair binomial treatment.
    control_and_budget_obligation: >-
      Exact executable control definitions and expected outputs, a narrowed or
      proved ceiling, refreshed corpus coverage, and an operation/byte/time
      schedule must be frozen before treatment compute.
  proposal_disposition:
    status: proposed
    action: preserve_pending_versioned_revision
    novelty_status: unverified
    dominated_by: >-
      Under the current fully charged record, rho dominates unless gamma>5/18;
      no measured gamma exists. No Pareto improvement is established.
  cheapest_falsification_control: >-
    First run, only after a future approval, the frozen-tuple balanced
    antisymmetric-label null in Z/NZ. It is the cheapest complete apparatus
    check and must recover gamma=0 with calibrated uncertainty and agreement
    between multiplicity and Boolean root success. It was not run here.
  next_actions:
    - >-
      Author a versioned replacement proposal that corrects the full-cost
      threshold, root-success proof obligation, clustered inference,
      intercept-bearing scaling model, controls, ceiling, novelty coverage,
      and staged budget.
    - >-
      Snapshot the replacement and obtain a new independent review-adversarial
      verdict before any Coordinator approval or Executor task exists.
  restart_condition: >-
    A new non-overlapping batch may reopen this successor only when both actions
    above are satisfied. User direction to continue alone does not waive these
    mathematical and evidence gates; it authorizes work on their repair.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is design-review evidence with no experiment, theorem, or validated
      cryptanalytic improvement.
  claim_ceiling: >-
    A low-prior, falsifiable proposal exists and an independent Validator found
    it requires revision. No attack, speedup, security impact, or crypto-scale
    claim is supported.
  official_research_state_changed: true
  official_state_change: >-
    BATCH-3033bc closes revise_and_pause and this successor path pauses pending
    the stated restart condition. RQ-ECDLP-002 and all hypotheses are unchanged.
  hypothesis_status_transition: none
  experiment_status_transition: none
  decided_by:
    task: TASK-20260808-c0a95d
    role: coordinator
    policy: coordinator-orchestration-code
    provider: OpenAI
    runtime: native Codex
    fallback_used: false
    degraded_requirements: []
    bedrock_selected_or_contacted: false
