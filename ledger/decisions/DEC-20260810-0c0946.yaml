coordinator_decision:
  id: DEC-20260810-0c0946
  context: >-
    GOAL-AES-003 head reconciliation, discharge of the open flag
    LIVE-HEAD-AES003 recorded in ledger/goals/GOAL-AES-003.yaml under key
    `head_reconciliation_20260810` (written by TASK-20260810-2b1c3b, campaign
    RECON-20260810-002, verdict UNRESOLVED, fields_changed NONE).

    That flag named exactly one decisive and cheap test, quoted from its own
    `what_would_settle_it` list -- a shell-capable session verifying the
    BATCH-b41ba9 ledger archive by running tools/research_dispatch.py against
    the commit its receipt names (74e33ea35), confirming the commit is
    reachable from HEAD or content-verifies against the tree, and confirming it
    changes exactly the paths that receipt declares -- and it bound the outcome
    in advance in both directions. IF IT VERIFIES, the head moves to
    BATCH-b41ba9 and a checkpoint is appended. IF IT DOES NOT, BATCH-014 is
    correct as it stands and the flag is discharged BY CONFIRMING IT, NOT BY
    CHANGING IT.

    That verification has now been run by direct shell in a single Coordinator
    session on 2026-08-10, against fork base / origin/main at commit 44525b6f7.
    IT DOES NOT VERIFY. This decision therefore discharges LIVE-HEAD-AES003 by
    confirmation, supersedes the UNRESOLVED verdict of
    `head_reconciliation_20260810` with a definite one, and corrects one
    premise that flag reasoned from.

  decision: supersede

  decision_scope: >-
    THIS DECISION DISCHARGES LIVE-HEAD-AES003 AND NOTHING ELSE.

    It reviews NO experimental evidence. It creates, moves, weakens, rejects or
    supersedes NO hypothesis -- GOAL-AES-003.active_hypothesis_ids is untouched.
    It approves NO experiment and NO measurement. It promotes NO knowledge
    entry. It moves NO claim tier; the goal's TOY ceiling and every scope
    statement in RQ-AES-003 stand exactly as written. It opens NO batch and
    closes NO batch. It asserts NOTHING WHATSOEVER about AES at any round
    count, about the round-5 yoyo excess, about the cipher-substitution
    mechanism, or about any comparison to published cryptanalysis in either
    direction.

    It is an integrity and bookkeeping adjudication over a goal record's head
    fields and over one batch's archive binding. Nothing in it may be
    transcribed as a research result.

  target_ids:
    - GOAL-AES-003
    - RQ-AES-003
    - BATCH-014
    - BATCH-b41ba9
    - BATCH-015
    - BATCH-6fe3c2
    - CORR-20260810-e00f0e
    - TASK-20260810-724383

  head_disposition: >-
    THE HEAD IS CONFIRMED AT BATCH-014. IT IS NOT MOVED.

    `current_batch_id` stays BATCH-014. `dispatch_queue_path` stays
    coordination/goals/GOAL-AES-003/batches/BATCH-009/dispatch_queue.json.
    `next_action` stays exactly as committed. `latest_verified_commit` stays
    0f86463eb0eb4eca7c28a0bba2d7b4864d863832. `status` stays active. All of
    these are left EXACTLY as committed, INCLUDING the known head-internal
    mismatch between `current_batch_id` (BATCH-014) and `dispatch_queue_path`
    (BATCH-009) that TASK-20260810-2b1c3b flagged and declined to touch.

    That mismatch is left standing deliberately, under the flag's own rule that
    the three head fields move TOGETHER OR NOT AT ALL. They do not move here
    because the candidate successor -- BATCH-b41ba9, the only candidate the
    flag identified -- FAILED ITS TEST. Repairing the mismatch in isolation
    would move one of the three without the other two, which is the exact
    failure the rule exists to prevent, and would require an independent
    determination of the correct queue path that this act did not make and is
    not authorized by its own scope to make.

  rationale:
    - >-
      GROUND (A) -- BATCH-b41ba9 DOES NOT VERIFY, AND THE FAILURE IS IN THE
      RECEIPTS, NOT IN THE WORK. Run by direct shell this session against fork
      base 44525b6f7:
      `PYTHONPATH=. python3 tools/research_dispatch.py
      coordination/goals/GOAL-AES-003/batches/BATCH-b41ba9/dispatch_queue.json
      --output <plan.json> --report <plan.md>`
      terminates with exactly this string and nothing further --
      "dispatch error: completed archive task TASK-20260806-9c6a11 requires
      archive.commit_sha". In that queue all 5 task cards are at state
      `completed`, and BOTH archive cards carry EMPTY binding metadata:
      TASK-20260806-9c6a11 (kind snapshot) and TASK-20260806-3998cd (kind
      ledger) each have `commit_sha: null`, `parent_sha: null`, and
      `path_sha256: {}`. The ledger receipt at
      coordination/goals/GOAL-AES-003/batches/BATCH-b41ba9/archives/TASK-20260806-3998cd/ledger-receipt.json
      carries `commit_pending: true`, has NO `path_sha256` key at all, and
      records no dispatcher-verification result. NO CONTENT BINDING EXISTS FOR
      BATCH-b41ba9. Under this goal record's own head convention -- stated in
      its BATCH-713991 `merge_provenance_note` and quoted by the flag, that
      `current_batch_id` sits at "the most recent FULLY VERIFIED checkpoint on
      either lineage" -- BATCH-b41ba9 is not a fully verified checkpoint and
      cannot take the head.
    - >-
      GROUND (D) -- THE INCUMBENT HEAD DOES VERIFY BY CONTENT, SO THE
      CONVENTION IS SATISFIED WHERE THE HEAD ALREADY SITS. The BATCH-014 ledger
      receipt at
      coordination/goals/GOAL-AES-003/batches/BATCH-014/archives/TASK-20260805-a486d5/ledger-receipt.json
      carries 4 `path_sha256` digests and `validator_verdict: passed`. (Its
      own `commit_sha` field is null and it carries no `commit_pending` key --
      recorded here plainly rather than glossed over.) All 4 digests were
      RECOMPUTED this session and MATCH 4 of 4 at commit 0f86463eb, which is
      this goal's recorded `latest_verified_commit` and is an ancestor of
      origin/main. The four paths are ledger/evidence/EV-AES-dec938.yaml,
      ledger/decisions/DEC-20260805-b42d5c.yaml, ledger/goals/GOAL-AES-003.yaml,
      and
      coordination/goals/GOAL-AES-003/batches/BATCH-014/tasks/TASK-20260805-063dbf/validation_report.yaml.
      Against origin/main as it stands today the same digests MATCH 3 of 4;
      the only path that differs is ledger/goals/GOAL-AES-003.yaml, which is
      expected and correct, because a goal record is appended by supersession
      and has changed many times since. The two immutable ledger records and
      the validation report are byte-identical on main today.
    - >-
      THE COMPARISON IS THEREFORE DECISIVE IN THE DIRECTION THE FLAG SPECIFIED
      IN ADVANCE. A candidate whose dispatcher run terminates on missing
      binding metadata cannot displace an incumbent whose four declared digests
      recompute 4/4 at its own recorded verified commit. Moving the head to
      BATCH-b41ba9 would upgrade exactly the evidence class the goal record
      declined to upgrade for BATCH-713991, which the flag correctly named as
      the forbidden upgrade.
    - >-
      GROUND (B) -- A PREMISE THE EARLIER FLAG REASONED FROM IS FALSIFIED, AND
      IT MUST BE CORRECTED EVEN THOUGH IT DOES NOT CHANGE THE OUTCOME.
      TASK-20260810-2b1c3b reasoned by analogy: BATCH-b41ba9's receipt has
      "the exact shape of BATCH-713991's receipt, whose archive this record
      says never landed." THE ANALOGY HOLDS FOR THE RECEIPT'S SHAPE AND FAILS
      FOR THE INFERENCE ABOUT WHETHER THE WORK LANDED. Verified by direct shell
      this session -- snapshot commit
      74e33ea35bf0fabd1a55b2c6bd39bff229e86330, dated 2026-08-06 18:21:15
      -0700, subject "research(GOAL-AES-003):  snapshot BATCH-b41ba9
      (TASK-20260806-47f217 identity/affine arm NO-NONLINEARITY-REQUIRED at
      exact algebraic E; TASK-20260806-7a980b RANK-1 repair assessment)", IS AN
      ANCESTOR OF origin/main, 24 files changed, 2107 insertions, all under
      BATCH-b41ba9/tasks/. Ledger commit
      8098bb98e67a0d77224cf41a9c26d831d0dfccf7, dated 2026-08-06 18:31:33
      -0700, subject "research(GOAL-AES-003):  ledger BATCH-b41ba9
      (NO-NONLINEARITY-REQUIRED; RANK-1 dual-device repair; EV/DEC/GOAL
      updated)", IS ALSO AN ANCESTOR OF origin/main and changed exactly 4
      paths -- its own receipt file, ledger/decisions/DEC-20260804-73977c.yaml,
      ledger/evidence/EV-AES-048545.yaml, ledger/goals/GOAL-AES-003.yaml --
      which is EXACTLY the scope that receipt declares (record_ids
      [EV-AES-048545, DEC-20260804-73977c] plus its goal_update). No
      out-of-scope path was touched. The declared content is present on main
      today: DEC-20260804-73977c.yaml carries entries "- id: D-6", "- id: D-7"
      and "- id: D-8", and EV-AES-048545.yaml carries O-7 and O-8.
    - >-
      SO THE CORRECT CHARACTERIZATION OF BATCH-b41ba9 IS **UNBOUND**, NOT
      MISSING. Its work is real, its archives landed, and its commits are
      reachable from origin/main. What it lacks is a CONTENT BINDING in its own
      receipts -- no commit_sha, no path_sha256 -- which is a bookkeeping
      defect in the archive records, not an absence of the archived work. Any
      future reader of this goal must read the earlier flag's "never landed"
      language for BATCH-b41ba9 as SUPERSEDED BY THIS RECORD.
    - >-
      THE EARLIER SESSION IS NOT AT FAULT AND THIS DECISION SAYS SO EXPLICITLY.
      TASK-20260810-2b1c3b had NO SHELL, declared that limit in its own
      `method_limit` field, was forbidden to infer ordering from commits, and
      reasoned only from record contents -- under which the receipt shape was
      genuinely the only signal available and the analogy to BATCH-713991 was a
      reasonable reading of it. Its REFUSAL TO MOVE THE HEAD WAS THE RIGHT CALL
      ON THE INFORMATION IT HAD, and its stated preference for a head that is
      wrong-and-flagged over one that is confidently wrong is the disposition
      that made this cheap discharge possible at all. THIS ACT CONFIRMS ITS
      CONCLUSION AND CORRECTS ONE PREMISE. It does not overturn it.
    - >-
      GROUND (C) -- A NEW DEFECT WAS FOUND THAT EXPLAINS WHY THE NO-SHELL
      SESSION COULD NOT RESOLVE THE HEAD, AND IT IS FILED SEPARATELY AS
      CORR-20260810-e00f0e. The BATCH-b41ba9 STRUCTURED CHECKPOINT WAS SILENTLY
      DROPPED BY A MERGE. Commit 8098bb98e ADDED a `- batch_id: BATCH-b41ba9`
      entry to research_goal.batch_checkpoints; the entry is present at
      8098bb98e (1 occurrence) and at 350632006 (1 occurrence), absent at
      c6f5d9e9f (0 occurrences -- the origin/main side, which never had it),
      and absent at the merge 232659d3c (0 occurrences), whose parents are
      exactly 350632006 and c6f5d9e9f. The merge resolved `batch_checkpoints`
      to the main side and DROPPED THE ENTRY ITS OWN BRANCH PARENT CARRIED. The
      entry is absent from origin/main today. The same merge's PROSE survived,
      so the goal record today NARRATES BATCH-b41ba9 in its next_action
      THIRD-MERGE ADDENDUM while carrying NO STRUCTURED CHECKPOINT for it --
      which is precisely the state in which a contents-only session finds a
      batch it can neither locate as a checkpoint nor dismiss. Full detail,
      prior/corrected values and consequence are in CORR-20260810-e00f0e.
    - >-
      THAT DROP IS A RECURRENCE, NOT A NOVELTY, AND THE GOAL RECORD ALREADY
      DISCLOSES THE CLASS. Its own `current_batch_id_note` describes "the
      disclosed environment defect that silently dropped it from this branch's
      FIRST merge of origin/main" for the BATCH-003 backfill. This is the same
      defect class firing a second time on the same field of the same record.
      Recording it as a recurrence rather than as a fresh surprise is what lets
      a later session treat `batch_checkpoints` on this goal as KNOWN
      MERGE-FRAGILE rather than rediscovering it a third time.
    - >-
      CURRENT STATE OF THE FIELD, FOR THE RECORD: `batch_checkpoints` on main
      today holds 9 entries -- BATCH-713991, BATCH-014, BATCH-013, BATCH-012,
      BATCH-011, BATCH-010, BATCH-009, BATCH-003, BATCH-001. BATCH-b41ba9 is
      not among them.

  precedence_ruling: >-
    THE FLAG SEPARATELY REQUIRED A COORDINATOR RULING ON PRECEDENCE BETWEEN THE
    TWO OPEN QUEUES. IT IS GIVEN HERE, AND IT CONFIRMS A RANKING ALREADY
    COMMITTED RATHER THAN ADJUDICATING FRESH RESEARCH MERIT.

    Both queues are open, committed on main, and unstarted since 2026-08-05 and
    2026-08-06 respectively, verified this session:

    BATCH-015 (opened by commit b6d1d5b0f, 2026-08-05, on main) holds a
    dispatch_queue.json and nothing else. All 4 cards are `queued`:
    TASK-20260805-d408ac (executor -- build an O(1)-memory ideal-approximating
    permutation oracle and rerun the cipher-substitution comparison),
    TASK-20260805-237cad (coordinator snapshot), TASK-20260805-849a4a
    (validator), TASK-20260805-3f00cb (coordinator ledger).

    BATCH-6fe3c2 (opened by commit f03eb9b48, 2026-08-06, on main) likewise
    holds a dispatch_queue.json only. All 4 cards are `queued`:
    TASK-20260806-7fcdf8 (executor -- dual-device RANK-1 stamp repair per
    DEC-20260804-73977c D-7), TASK-20260806-621261, TASK-20260806-1c1103,
    TASK-20260806-ccfd8b.

    RULING. BATCH-015 RETAINS RANK 1 FOR RESEARCH. This CONFIRMS the ranking
    already committed in DEC-20260805-b42d5c, whose single next_action reads
    "SINGLE NEXT ACTION: GOAL-AES-003 BATCH-015, rank 1 = the O(1)-memory-
    per-query ideal-permutation construction for the cipher-substitution
    comparison". The goal record's own committed next_action independently
    states that the D-7 stamp repair "does not block BATCH-015". BATCH-6fe3c2
    REMAINS AVAILABLE AND UNBLOCKING: it is not cancelled, not deprioritized
    out of existence, and may be run whenever capacity allows; it carries
    DEC-20260804-73977c D-7's adopted dual-device repair, which is real work
    with a committed decision behind it.

    HONESTY ABOUT WHAT THIS RULING IS. It confirms a pre-existing ranking. IT
    IS NOT A FRESH ADJUDICATION OF RESEARCH MERIT BETWEEN THE TWO QUEUES, AND
    NO NEW RESEARCH INFORMATION ENTERED THIS ACT. This session read no
    experimental result, ran no measurement, and consulted no reviewer. The
    flag correctly observed that DEC-20260805-b42d5c's ranking "was written
    before BATCH-6fe3c2's queue existed"; that observation stands, and this
    ruling does not pretend to have re-derived the ranking against the newer
    queue on the merits. What it establishes is narrower and sufficient for the
    flag's purpose: the committed ranking has not been displaced by anything
    this act found, and the D-7 repair's own decision text does not claim
    precedence over BATCH-015. A later session with research information in
    hand may revisit the ordering on the merits; nothing here forecloses that.

  head_advancement_blocker: >-
    NEWLY IDENTIFIED, AND RANKED AHEAD OF BOTH OPEN QUEUES FOR THE NARROW
    PURPOSE OF HEAD ADVANCEMENT ONLY: a SUPERSEDING ARCHIVE BINDING for
    BATCH-b41ba9, specified as TASK-20260810-724383.

    THE REASON IS STRUCTURAL, NOT A RESEARCH JUDGEMENT. BATCH-b41ba9 is,
    by the earlier flag's own contents-based reading, the most recent closed
    and reviewed batch on either lineage. Until its archives carry a content
    binding, it can never become a fully verified checkpoint, so THE HEAD CAN
    NEVER ADVANCE PAST BATCH-014 NO MATTER HOW MUCH RESEARCH LANDS -- a batch
    closed after it inherits the same gap, and every future head-reconciliation
    session will rediscover exactly the finding recorded here, at exactly the
    cost this session paid, indefinitely.

    THIS GATES ONLY HEAD ADVANCEMENT. IT DOES NOT GATE THE RESEARCH IN
    BATCH-015, which is rank 1 and may be dispatched at any time without
    waiting for the binding repair, and it does not gate BATCH-6fe3c2 either.
    A reader who takes this item as a stop on research has misread it.

