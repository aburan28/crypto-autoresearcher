coordinator_decision:
  id: DEC-20261007-d7f447
  context: >-
    Design of IDEA-20261006-300758 under RQ-SSI-001 / GOAL-SSI-001.
    Standing authorization of 2026-09-06 would approve a complete
    runnable protocol. This contract is specified and can fail. The
    degree-2 neighbor census that would emit n is not in the tree.
    The same pass files three proposals and does not design them.
  decision: revise
  target_ids:
    - H-SSI-21eec4
    - EXP-SSI-587b14
    - IDEA-20261006-300758
    - IDEA-20261007-38fa7c
    - IDEA-20261007-d30bed
    - IDEA-20261007-19d12d
  rationale:
    - >-
      The prediction is the idea's own: success is |n - 3| >= 1 with
      n in {1, 2} and the census defined. The negative outcome is
      n = 3. Those criteria differ, and decision_impact.on_positive
      differs from on_negative.
    - >-
      Approval is not recorded. The missing driver is a program that
      factors x(x^2 + 1) over F_{67^2} for E: y^2 = x^3 + x, applies
      t = 3 x_T^2 + 1 and w = x_T t, and writes point_count_E,
      kernel_x_count, n, and codomain_j_list.
      harness/isogeny_class.py velu_odd refuses even ell, including
      ell = 2, and does not implement that formula.
    - >-
      check_approval_capacity was not the rejecting check. With
      goal_id GOAL-SSI-001, python3 tools/portfolio_kpis.py --capacity
      GOAL-SSI-001 reports approved_unrun=2 (EXP-SSI-001,
      EXP-SSI-db46fa), cap 3, headroom 1. The area key area:SSI
      reports approved_unrun=39 and headroom 0. The contract names
      the goal, so the capacity key is GOAL-SSI-001. An approving
      decision was not written, because the driver is missing.
      Status stays review_required. approved_by stays null.
    - >-
      The copied proposal bytes are git blob
      55a15ce5112c5a38e3c3987a89ee6f2fc1c81012 and parsed as YAML
      without a quote change. The question id is RQ-SSI-001. No run
      was launched and no executor was dispatched.
      execution_progress reports needs_reconciliation because runs/
      contains only .gitkeep. That label is not a run.
      newest_experiments.py --experiment EXP-SSI-587b14 returns no
      selectable row because status is not approved.
  limitations:
    - No run was launched. No executor was dispatched.
    - The inequality is untested. This decision is not evidence.
    - The three new proposals are not hypotheses and are not approved experiments.
  next_actions:
    - >-
      Bind a degree-2 Vélu census that emits n, then re-check
      python3 tools/newest_experiments.py --experiment EXP-SSI-587b14
      before any approval decision.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No run and no evidence record. A review_required contract does
      not promote a knowledge entry.
  decided_by: coordinator
  decided_at: '2026-10-07'
