  context: Approve the archived CM corrected prospective protocol with exact installed scalar and public-trust bindings,
    and authorize an immutable implementation successor.
  rationale:
  - The prior independent CM mathematical and implementation reviews were archived before correction; TASK-20260907-fe3f53
    resolves their accepted multiplicity/cost/selection definitions in a full prospective contract. The parent verified
    all seven stated source bindings, strict YAML parsing and prospective authority separation.
  - Adopt and explicitly approve the listed neutral pre-data choices. Their validation remains a future independent
    source-conformance review; no toy measurement, asymptotic claim, scientific result or hypothesis promotion is
    asserted.
  - Resolve the missing external scalar arm with the installed Sage Python3.14.3/CyPari2 2.2.4/PARI2.17.1 stack.
    The actual wrapper directly invokes C ellmul; installed binary/config/source hashes are pinned. Standalone GP2.17.3
    is a different runtime and is not substituted.
  - Resolve trust provenance with an Ed25519 public key and exact OpenSSL3.6.3 binary/dependency bindings. Parent
    generated a private key outside git with0600/0700 custody and verified one nonlaunch message plus an altered-message
    refusal. No launch signature, RUN or scientific authority was created.
  - Rank finishing this approved concrete calibration alongside the already dispatched spectral/Tate repairs and
    five-contract review. No additional speculative experiment is needed to fill capacity.
