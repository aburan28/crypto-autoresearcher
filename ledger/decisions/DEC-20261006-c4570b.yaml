  context: >-
    /design-experiment, one contract, for IDEA-20261005-e6a067. No
    hypothesis and no experiment cites that idea. Its question id is
    RQ-XEDN-001. The proposal file is on origin/main. The branch
    design/xedn-e6a067-section was created from origin/main at
    9c2bc35e93f0c2f83026c8e351c621f623bdfb90 and git merge origin/main
    reported already up to date.

    The contract enumerates every exact-degree-4 and exact-degree-6
    coefficient vector of b at p=5, with a(t)=0, under the pinned
    predicate is_square_poly. The pre-registered prediction is an
    absolute gap of at least 0.05. A finished absolute gap strictly
    less than 0.05 is a negative. The degree-6 census compared with a
    replay of itself is the control and has gap 0. No lift to
    characteristic zero is claimed.

    This session did not enumerate the 2500 or 62500 slots. It opened
    the predicate module and the frontier rows KR-IC-cd159a,
    KR-RHO-53c89f, KR-IC-5a43e5, KR-RHO-898783, and KR-RHO-755e35.
    Those rows are not used as costs. The classical xedni height paper
    was not opened.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, seeds, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. Success is a
    valid pin together with an absolute gap of at least 0.05, and it
    fails when the finished gap is strictly less than 0.05. No field
    required for approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading are fixed before any executor run.
    - A finished absolute gap strictly less than 0.05 is reachable as a recorded outcome, so success is not automatic.
    - A replay of the degree-6 census is a same-shape control on which a gap of 0.05 is predicted false, and a run that does not return gap 0 on that replay is invalid rather than a section result.
    - Named plant slots, including a y=0 slot the predicate must reject, give the run a way to come back invalid when the predicate is not the pinned one.
    - This session did not enumerate the census and did not claim a xedni lift.

  evidence_refs: []
  limitations:
    - The measurement covers p=5 and two degrees. It is not a rate at p=101 or p=809 and not a lift to characteristic zero.
    - KR-IC-cd159a remains the known-negative on xedni lifting. This decision does not contradict it.
    - The classical height paper was not opened. The known-negative used here is the opened frontier row.
    - HEUR-1 is a Bernoulli null for the gap. It does not identify a lift probability over Q.
    - The p=7 check is a prefixed sign check. An unstable sign does not enlarge the p=5 claim.
    - This decision authorizes a later execution. It does not start one.
    - GOAL-ICLIFT-001 stays completed. This decision does not reopen it.

  next_actions:
