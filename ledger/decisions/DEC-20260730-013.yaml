coordinator_decision:
  id: DEC-20260730-013
  reserved_alias_note: >-
    This decision was archived as DEC-20260730-006 under GOAL-SSI-001. Main assigned
    DEC-20260730-006 to a non-SSI record, so per CORR-20260731-002 this decision uses
    the next free id DEC-20260730-013. Content is otherwise unchanged aside from
    remapped sibling DEC/TASK citations.
  context: >-
    GOAL-SSI-001 BATCH-014 FC0-R2 schedule-history reachability for
    IDEA-20260729-001; snapshot a3ac87c9; red-team RT-20260730-023 REVISE
    retaining FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED with wording/process
    repairs required.
  decision: revise
  target_ids:
    - IDEA-20260729-001
    - GOAL-SSI-001
    - RQ-SSI-001
    - TASK-20260730-021
    - TASK-20260730-023
    - KN-OPEN-014
  rationale:
    - >-
      REVISE adopted: independent spot-checks confirm the [1,2,4] schedule
      arithmetic and the empty zero-progress class among 176 enumerated
      internal S=2 pairs (positive keep probabilities). That narrow exclusion
      is retained as a schedule-specific bounded-model fact.
    - >-
      Revision is required because (a) pinned_before_analysis is not
      independently durable (pin and results share one snapshot), and
      (b) the embedded analyzer is static pair-set enumeration rather than an
      explicit typed-tape/history transition machine. jointly_reachable=false
      and recurrent=false must stay nested under the bounded ideal-choice
      abstraction and must not be read as a global C2 rejection.
    - >-
      QUERY_MEMORY unreconciliation remains supported with blockers
      QM-STOPPING, QM-MEMORY-MAP, and QM-ERROR. C2 remains live; C3 remains
      lexical-only; error map remains live. No numeric, breakthrough, or
      completion claim. Keep GOAL-SSI-001 active with null campaign budgets.
  evidence_refs:
    - EV-SSI-014
    - coordination/goals/GOAL-SSI-001/batches/BATCH-014/archives/TASK-20260730-022/snapshot-receipt.json
    - coordination/goals/GOAL-SSI-001/batches/BATCH-014/tasks/TASK-20260730-023/red_team_report.yaml
  limitations:
    - One schedule; ideal choice tape, not concrete HashDRBG.
    - Same-model fallback on red-team; producer reported GPT-5.6 Terra.
    - Recovery/object-lifetime gates intentionally out of scope.
  next_actions:
    - >-
      Open BATCH-015: first commit a pre-analysis small-schedule panel and an
      explicit typed-tape transition-machine specification (immutable before
      result inspection), then exhaustively run every panel row through at
      least one same-level retry and compare each projected S=2 pair set
      against the BATCH-014 static enumeration; qualify prior pin-order and
      analyzer-implementation wording; keep recovery implementation and
      object-lifetime tracing as a separate gate; zero curve compute; no
      numeric security, breakthrough, or completion claim
      (DEC-20260730-013 / EV-SSI-014).
  hypothesis_status_record:
    IDEA-20260729-001: revise_preregister_schedule_panel_tape_audit
    note: >-
      Narrow [1,2,4] empty-class exclusion retained; QUERY_MEMORY open; next
      gate is preregistered schedule panel plus explicit tape/history audit.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      REVISE is a scoped process/control repair at preliminary strength, not a
      replicated/strong cryptanalytic boundary. KN-TECH-051 already covers the
      CSIDH quantum cost-model dispute; QUERY_MEMORY remains open. No
      KN-FIND/KN-TECH until a reconciled FC0 row or durable negative boundary
      is independently confirmed.
  decided_by: coordinator
  decided_at: '2026-07-30'
