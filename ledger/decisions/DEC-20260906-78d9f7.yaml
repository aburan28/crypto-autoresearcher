# COORDINATOR DECISION OPENING BATCH-60d6b9 ON GOAL-SSI-001.
#
# IT APPROVES A BATCH'S COMPOSITION, SCOPE, CONTROLS, REVIEW ARCHITECTURE AND
# BUDGET, AND NOTHING ELSE. It approves no experiment, enacts no amendment,
# changes no status, and records no result. EXP-WESOVOW-001 remains `approved` and
# UNAMENDED at version 1; the drafted amendment of BATCH-752ef2 remains a DRAFT;
# GOAL-SSI-001 remains `active`. OPENING A BATCH IS NOT APPROVING ANYTHING IN IT.
#
# It is written as a LEDGER RECORD, which the two preceding batches could not do:
# BATCH-752ef2's DEC-20260905-d639cf and BATCH-79a0cb's opening decision are both
# recorded UNPUBLISHED because their authoring tasks held no shell with which to
# mint an identifier and correctly refused to invent one. Here the identifier was
# pre-allocated, so the decision is a record. IT IS STILL NOT DURABLE UNTIL THE
# DISPATCHING SESSION COMMITS AND PUSHES IT.
coordinator_decision:
  id: DEC-20260906-78d9f7
  goal_id: GOAL-SSI-001
  batch_id: BATCH-60d6b9
  id_note: >-
    PRE-ALLOCATED by the dispatching session and stated to have been checked free
    immediately before this dispatch. RE-CHECKED BY THIS AUTHORING TASK BY DIRECT
    SEARCH ONLY, WHICH IS WEAKER THAN `tools/allocate_id.py --check`: no file
    ledger/decisions/DEC-20260906-78d9f7.yaml existed and the token occurs nowhere
    under ledger/ or coordination/ as an identifier. This task holds no shell and
    did not run the tool. The token conforms to the identifier grammar, so unlike a
    non-conforming placeholder it WOULD commit if wrong; the committing session must
    run `--check` on it, and on BATCH-60d6b9, the four TASK identifiers,
    EV-SSI-804e09 and DEC-20260906-408595, before dispatch, and record a
    SUBSTITUTION - a NEW identifier at every declared site, never a rename - if any
    is taken.

  context: >-
    Opening ONE bounded successor batch, BATCH-60d6b9, on GOAL-SSI-001, under the
    single next action of the committed goal head and of DEC-20260905-3b8e94, which
    closed BATCH-79a0cb as `revise`. That round supplied the red-team pass named as
    the precondition for approving the drafted superseding protocol amendment for
    experiments/EXP-WESOVOW-001/specification.yaml:39-40, and the pass found that
    THE DRAFT AS WRITTEN CANNOT BE APPLIED MECHANICALLY: clause_1's
    `replacement_text_in_full` - the one clause carrying the actual repair - does
    not parse when spliced over lines 39-40 (RT-1), demonstrated mechanically and
    independently re-performed by the orchestrating session. The same round REFUTED
    the derivation of the monotonicity route this program itself adopted (RT-2),
    while confirming its conclusion, and found that AC-1's pass is entailed by its
    own construction (RT-3). This decision approves a FOUR-TASK batch carrying TWO
    PRODUCERS - the redraft with the control RT-1's absence exposed, and CF-9,
    dispatched after two consecutive holdings - then one independent review and one
    ledger archive.

  decision: approve
  decision_scope: batch_composition_and_review_architecture
  decision_scope_statement: >-
    THE COMPOSITION, SCOPE, CONTROLS, REVIEW ARCHITECTURE AND BUDGET OF ONE BOUNDED
    BATCH - and nothing else. It is not `approve` of an experiment, an amendment, a
    hypothesis or a claim. The deliverable of producer (A) is a `status: draft`
    record and DRAFTING IS NOT AMENDING; the deliverable of producer (B) is an
    attestation about two immutable run manifests and may not touch either.

  target_ids:
    - GOAL-SSI-001
    - BATCH-60d6b9
    - EXP-WESOVOW-001
    - TASK-20260906-ee372e
    - TASK-20260906-0fbf69
    - TASK-20260906-ba0284
    - TASK-20260906-9f3e2a

  rationale:
    - >-
      THE REDRAFT IS THE SINGLE NEXT ACTION, AND ITS POINT IS THE CONTROL AND NOT
      THE TWO SPACES. RT-1 is the ONLY blocking finding of BATCH-79a0cb: the
      enactment path cannot proceed until the draft is redrafted as a NEW record,
      because the immutable one is not mechanically applicable. The mechanical repair
      is two spaces on eight continuation lines. THE FINDING'S REAL CONTENT IS ITS
      LAST SENTENCE - the check that would have caught it, parse the amended contract
      and report that experiment.metrics still has 7 items with metrics[5] a
      single-key mapping, IS THE ONE CONTROL THIS AMENDMENT LACKS, and an amendment
      that replaces text in a machine-readable contract has no control that the
      result still loads. DEC-20260905-3b8e94's knowledge_promotion recorded that
      remedy as "demonstrated once, by the failure it would have caught, and not yet
      implemented anywhere". THIS BATCH IMPLEMENTS IT, as a committed re-runnable
      script exercised on named negative objects, which is what turns CF-20 from a
      good intention into something a successor can run.
    - >-
      THE CONTROL IS SPECIFIED WITH A CONTENT ASSERTION BECAUSE THE OBVIOUS FORM OF
      IT CANNOT FAIL. The UNAMENDED frozen file ALREADY has a 7-element metrics list
      whose item 5 is a single-key mapping - BATCH-79a0cb's structural parse records
      exactly that - so a control asserting only shape PASSES ON THE FILE IT EXISTS
      TO DETECT THE AMENDMENT OF. That is RT-3's failure mode reproduced inside the
      control written to answer RT-1, and it is the specific thing this batch's
      review is paid to check. The card therefore requires a fourth assertion on
      CONTENT, and the review plan names the unamended file as the proves-too-much
      object it most wants run. A control whose pass has not been shown able to fail
      is not a control - which is CF-13's general remedy, applied prospectively for
      the first time in this campaign rather than retrospectively.
    - >-
      CF-9 IS DISPATCHED AND THE HOLDING ENDS. It was held by BATCH-752ef2 and again
      by BATCH-79a0cb on the ground that a second producer beside an ADVERSARIAL PASS
      would change nothing about what that pass concludes; DEC-20260905-3b8e94
      next_actions[3] recorded that the ground has EXPIRED ON ITS OWN TERMS, because
      this batch is a redraft batch and not an adversarial pass, and dispatched it
      here. BATCH-79a0cb's own control plane recorded in advance that a third holding
      would read as deprioritization without a recorded reason. It is not held a
      third time. It is cheap, unblocked, independent of the redraft, and it is one
      of the standing grounds on which the citation prohibition is retained -
      although discharging it lifts nothing by itself, and its card says so.
    - >-
      THE REDRAFT IS BOUND NEGATIVELY BY TWO OF THE PREVIOUS ROUND'S RESULTS, AND
      THIS DECISION MAKES BOTH BINDINGS EXPLICIT RATHER THAN LEAVING THEM TO BE
      INFERRED. R3 WAS REFUTED: C3's second clause instantiated at w = M IS control
      C4, so the C3 route is the same inference from a strictly stronger premise and
      not a second source; and the monotonicity route DEC-20260905-5f5592 adopted in
      its place was itself missing an endpoint premise (C4 again) and the omitted
      `capped by M` premise, returning CONTRADICTION on two objects where that is
      known false. THE REDRAFT MAY NOT REST ON THE REFUTED DERIVATION AND MAY NOT
      SILENTLY SUBSTITUTE THE REPAIRED ONE WITHOUT SAYING IT IS REPAIRED. And AC-1's
      pass region is exactly its own constructed input, so AC-1 may not be carried
      forward unchanged as though it discriminates. Neither binding asserts that any
      committed record is false: that stronger claim stays un-promoted for want of a
      `review-breakthrough` tier this environment cannot serve, and substituting a
      lower tier is the silent downgrade the policy layer forbids.
    - >-
      RANKING, AS THE UNLIMITED ECC BUDGET REQUIRES. GOAL-SSI-001 is an ECC goal, so
      `campaign_budget.maximum_batches` and `.total_wall_clock_seconds` are null and
      stay null; this batch writes no finite value to either. UNLIMITED REMOVES THE
      BATCH CEILING, NOT THE DUTY TO RANK. (A) is ranked ahead of doing nothing
      because it is the only blocking item on the campaign's only live enactment path
      and because its control generalizes to every future amendment of a YAML
      contract in this program. (B) is ranked ahead of doing nothing because it is
      owed, cheap and unblocked. Two producers are dispatched and not three;
      `max_concurrent` is 2 on a 4-core host and is machine headroom, not a research
      budget.
    - >-
      THE BATCH DECLARES NO BLIND PHASE, AND THE ANALYSIS WAS DONE FOR THIS BATCH
      RATHER THAN COPIED FROM EITHER PREDECESSOR. Task by task: the redraft producer
      runs a parser over a file it is itself writing, so its mechanical result is not
      a quantity this repository holds; the CF-9 producer attests provenance FROM the
      committed artifacts that are its evidence, so withholding them would disable it
      rather than blind it; and the reviewer is given every producer artifact by
      design, because judging them is its assignment. There is nothing to protect.
      Arming a digest map anyway would declare a protection that protects nothing,
      and a declaration that protects nothing teaches every later reader to skip the
      one that does. `--blind-history` is NOT APPLICABLE and must not be run or
      recorded. CF-15's first limb consequently STILL has no object and remains owed
      by the next batch that declares a blind phase; its second limb is applied, in
      the ledger receipt and in each agent's own runtime receipt.
    - >-
      MODEL-INDEPENDENCE IS FORECLOSED IN ADVANCE RATHER THAN CLAIMED AND WITHDRAWN.
      Only the `local` backend resolves here (IMP-1, unchanged and re-confirmed
      rather than re-raised); the previous round's adapter resolution was
      anthropic:claude-opus-5 with `model_verified: false` and NO PROBE RUN, and the
      round before that recorded a resolved identifier DIVERGING from its session's
      self-report; and every agent of this batch is a subagent of one orchestrating
      session on one filesystem. SESSION-INDEPENDENT IS THE CEILING AND IT IS STATED
      HERE, BEFORE ANY REPORT RETURNS. No artifact of this batch may present
      agreement between the reviewer and a producer as agreement between distinct
      models.
    - >-
      THE REVIEW ROUND IS DECLARED BEFORE IT RUNS, WITH A PRIOR THAT CAN LOSE.
      review_plan.yaml is standalone, carries a top-level `review_plan` mapping, is
      the only file in the batch directory carrying one, enumerates four joints each
      with exactly one owner and a worked attack, declares five proves-too-much
      objects with a failure signature, and records the Coordinator's prior in eight
      numbered elements with explicit probabilities and named candidates - including
      two predictions the review can overturn: that the new control passes on the
      unamended file, and that RT-4 is carried behind a pointer rather than into
      clause_4's own text. A prior the round overturns is among the most valuable
      results this program can produce and it is worthless if written afterwards.
    - >-
      NOTHING IS APPROVED, ENACTED OR TRANSITIONED, AND THAT IS THE SHAPE OF THE
      BATCH RATHER THAN A SHORTFALL OF IT. EXP-WESOVOW-001 stays `approved` and
      UNAMENDED at version 1; the BATCH-752ef2 draft stays a draft and is not edited,
      annotated or marked; the redraft is itself a draft; GOAL-SSI-001 stays
      `active`; no hypothesis exists to move; no knowledge is promoted; no
      prohibition is lifted; no lane is closed and no obstruction block is written.

  procedure_deviations:
    - id: PD-1
      deviation: >-
        THIS BATCH CARRIES NO SNAPSHOT-ARCHIVE TASK, AND THE PRE-REVIEW COMMIT IS A
        DISPATCH PRECONDITION EXECUTED BY THE DISPATCHING SESSION INSTEAD. AGENTS.md
        and agents/coordinator.md require a producer's exact artifacts to be
        committed by an isolated archival task BEFORE an independent agent reviews
        them, and then a ledger archive after review. For two producers plus a review
        that is FIVE tasks - BATCH-752ef2 is the worked example, and
        tools/research_dispatch.py `_validate_review_chains` enforces the chain the
        moment a producer sets `review_required: true`. FOUR identifiers were
        pre-allocated and this authoring task holds no shell to mint a fifth;
        inventing a conforming token is forbidden.
      what_was_chosen_and_why: >-
        Of the two four-task shapes that render, one has no reviewer at all - which
        would leave the review plan unexercised and `check_review_independence.py`
        unable to find a single `review_attestation` - and the other has a reviewer
        and no snapshot-archive TASK. The second was chosen, because an unreviewed
        redraft is a worse defect than a commit made outside a task card, and because
        the substance of snapshot-before-review can be preserved without an
        identifier: TASK-20260906-ba0284 may not be dispatched until the dispatching
        Coordinator session has committed exactly the six producer artifact paths, by
        exact pathspec, in one commit, recording its sha, its parent and the six
        per-path digests.
      cost_stated_plainly: >-
        That commit has no task card, no budget, no completion gate of its own, and
        NO DISPATCHER POST-COMMIT VERIFIER PASSES OVER IT. This is the cost
        BATCH-79a0cb accepted for its snapshot commit, one notch worse: that one at
        least had a card and a receipt. Both producers additionally carry
        `review_required: false`, which is TRUE OF THE QUEUE FLAG AND FALSE OF THE
        WORLD - both are reviewed, by TASK-20260906-ba0284, which depends on both by
        name.
      mitigation_and_its_limit: >-
        A COMPLETION GATE ON THE LEDGER ARCHIVE: recompute the sha256 of all six
        producer paths, confirm they match what was recorded before the review ran,
        confirm the commit is an ancestor of HEAD, and record the result either way;
        a mismatch means the reviewed object changed after it was reviewed and stops
        the archive. AND A STOP CONDITION: if the pre-review commit cannot be made,
        the review is NOT dispatched and the batch returns to the Coordinator. The
        limit is that the mitigation runs AFTER the review rather than before it, and
        that the digests it checks against are recorded by the session that made the
        commit.
      what_a_successor_should_do: >-
        A successor batch with FIVE identifiers should use the five-task shape:
        producers with `review_required: true`, a snapshot archive owning both, the
        review depending on both and on the snapshot, and a ledger archive owning the
        review. It should also split the review across TWO reviewers, which would let
        `blind_rederivation.required` be true with a real `blind_from` list - see
        PD-3.
    - id: PD-2
      deviation: >-
        THIS AUTHORING TASK HOLDS Read/Grep/Glob/Write AND NO SHELL, AND IT RAN NO
        GATE. `tools/allocate_id.py --check` on the eight pre-allocated identifiers,
        `tools/research_dispatch.py` against this batch's dispatch_queue.json,
        `tools/validate_ledger.py`, `tools/ecc_priority.py --classify GOAL-SSI-001`,
        `tools/goal_head.py show`, `tools/agent_bus.py inbox`, `git fetch`, the
        merge, the commit, the push and the PR were ALL NOT RUN HERE.
      consequence: >-
        Identifier freedom was re-checked BY DIRECT SEARCH ONLY; the goal head's
        `next_action` was READ FROM THE COMMITTED FILE rather than rendered by the
        tool, and cross-checked against DEC-20260905-3b8e94 and the BATCH-79a0cb
        checkpoint, which agree; the ECC classification is carried with its source
        rather than as a tool output; the bus was read as files rather than through
        the inbox command; and THE QUEUE HAS NOT BEEN RENDERED. The topology was
        checked by READING tools/research_dispatch.py against this queue's fields and
        by comparison with two rendered predecessors, WHICH IS WEAKER THAN RUNNING
        IT. The dispatching session must render the queue before any task is
        dispatched; a render failure is a defect of this control plane, to be
        repaired here and never worked around in a task.
    - id: PD-3
      deviation: >-
        `blind_rederivation.required` IS FALSE, FOR A MECHANICAL REASON RATHER THAN
        AN ECONOMIC ONE, AND WHAT REPLACES IT IS WEAKER. A `blind_from` list is
        checked by tools/check_review_independence.py against the re-deriver's
        declared `sources_read`, and this round's single reviewer is REQUIRED by
        joint J2 to read the producer's control script and report. Declaring those
        files blind_from would either collide with an honest `sources_read` or force
        the joint to be skipped.
      what_replaces_it: >-
        An ATTESTED READING ORDER on joints J1 and J2: the reviewer writes and runs
        its own splice-and-parse, from the redraft's own bytes, before opening the
        producer's control. That is an attestation, not a tool result, and no
        successor can verify the ordering from it. With two reviewers the two
        assignments could be separated and a real blind re-derivation declared; with
        one they cannot.
    - id: PD-4
      deviation: >-
        ONE REVIEWER, AND IT IS A VALIDATOR RATHER THAN A RED TEAM. Each of J1
        through J4 is attacked ONCE, by one agent, of one model family, under one
        orchestrating session.
      consequence: >-
        THE REDRAFT WILL NOT HAVE HAD AN ADVERSARIAL PASS AT THE END OF THIS BATCH,
        and no artifact of it may say otherwise. The enacting decision will still
        need a red-team reading of the redrafted record as a proposed act. The
        Validator was chosen because the objects of this round are an artifact's
        integrity and a control's ability to fail, which is that role's contract; the
        cost is recorded rather than presented as a design virtue.

