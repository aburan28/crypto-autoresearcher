  citation_boundary:
    status: >-
      RETAINED IN FULL, BOTH LIMBS, BY THIS DECISION. NOT LIFTED, NOT NARROWED, NOT
      WIDENED. It has been considered for lifting and deliberately retained in FOUR
      consecutive committed decisions; this decision opens a batch and produces no
      anchor evidence, so it retains rather than reconsiders, and the reconsideration
      for this round belongs to DEC-20260906-408595 on the round's own evidence.
    retained_verbatim: >-
      The `P=512` crossover value and its `w=2^80` sign are **NOT citation-eligible**.
      This task does not lift that prohibition. Only a committed Coordinator decision
      on independently reviewed evidence can lift it.
    predicate_extension_verbatim: >-
      In addition to the retained sentence, a row of any EXP-WESOVOW-001
      reconciliation is NOT citation-eligible when either (a) the two anchors disagree
      in the SIGN of the baseline comparison at that row, or (b) the smaller |margin|
      across the two anchors at that row is below that field size's anchor gap |Delta
      log2 T_full + Delta log2 M / 2|.
    the_newest_ground_and_it_binds_this_batch: >-
      DEC-20260905-3b8e94 recorded a ground that did not exist before: RT-2
      establishes that the adopted monotonicity route is CONDITIONAL ON `A > 0`, and
      `A > 0` IS the per-row baseline-comparison sign the retained sentence governs,
      so discharging that conditional into a statement about the contract's actual
      rows would require computing exactly the governed quantity. NO TASK OF THIS
      BATCH MAY COMPUTE IT, including while arguing that the redraft should have said
      something about it. This is also why the redraft's warrant sentence must state
      the structure and never instantiate it.
    cf_9_is_a_ground_and_not_a_key: >-
      STATED AT THE OPENING SO IT CANNOT BE INFERRED AT THE CLOSE. CF-9 is one of
      several grounds on which the prohibition is retained, so whatever the
      attestation returns it lifts NOTHING by itself: the anchor recorded off_curve
      at three of five field sizes, CF-7's undischarged remainder for the
      RECONCILIATION procedure, the free overhead knob, and the RT-2 ground above all
      survive it. Both the producer's card and the archive's card say so.
    machine_flag: >-
      The BATCH-256a94 anchor_reconciliation.json per-row `citation_prohibited` flag
      is scoped by field size and REMAINS KNOWN TO UNDER-REPORT: at least two rows
      carrying `false` at log2 p = 256 fall under the predicate. That artifact is
      snapshot-bound, IMMUTABLE, AND MUST NOT BE EDITED. This batch produces no
      successor to it and does not repair it.

