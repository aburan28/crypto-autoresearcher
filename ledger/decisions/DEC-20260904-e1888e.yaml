  semantic_disposition: BACKEND_FALLBACK_RECORDED_PER_USER_AUTHORIZED_MECHANISM
  target_ids:
  - opencode.json
  - TASK-20260904-410404
  - TASK-20260904-a897dc
  - DEC-20260904-92dec2
  what_changed:
  - >-
    opencode.json: agent models validator and red-team moved
    zai/glm-5.2 -> vllm/qwen3.8-27b (the local L40S runtime via the
    127.0.0.1:8787 proxy). That runtime was probed live at 17:5xZ
