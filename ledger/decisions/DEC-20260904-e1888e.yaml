    reasoning effort on the report.
  ground:
  - >-
    DEC-20260903-16bfc2 (user-authorized 2026-09-03): review-adversarial
    drops its fixed effort floor so 'any resolvable backend may serve
    them, with the actual effort recorded on every receipt'; 'independence,
    not tier, is the load-bearing part of review integrity'
    (independent_session_required unchanged); the per-call REQUESTED effort
    (xhigh) stays recorded as requested, and a weaker backend serving at
    its ceiling is a recorded cap, never silent.
  - >-
    No other backend is resolvable for this runtime: anthropic, openai,
    openrouter have no keys; the local :8000 endpoint is down; zai
    lists but does not serve; fireworks is not configured in
    opencode.json (it serves the policy layer for other runtimes, not
    this one). vllm is the one resolvable alternative.
  - >-
    The failing tier is not a downgraded one: review-adversarial remains
    the requested policy on the v2 handoffs, and the round's
    claim-changing scope is unchanged.
  limitations:
  - >-
    This fallback authorizes review-adversarial on vllm only. It does NOT
    authorize review-breakthrough on any backend that cannot reach max;
    no breakthrough-tier round is currently pending, and if one opens,
    it is unrunnable on this runtime and must be recorded as such rather
    than served here.
  - >-
    The vllm runtime's effective reasoning ceiling is below the xhigh
    request; the cap is recorded on the reports per 16bfc2, and the
    round's verdicts carry that disclosure. The Coordinator's prior in
    the round plan was written for this round and does not depend on the
    serving model.
  next_actions:
