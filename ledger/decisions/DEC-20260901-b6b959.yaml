coordinator_decision:
  id: DEC-20260901-b6b959

  context: >-
    GOAL-AES-003 selection and batch-opening act by the dispatching
    Coordinator (session coordinator-aes003-1, 2026-09-01), discharging
    the live RANK 1 written by the 2026-09-01 next_action update
    (idea-generation round on WHERE the r=5 excess lives, per
    DEC-20260901-bad1e5 RANK 2). The idea-generation round ran this
    session under DEC-20260831-0d1eeb and produced four filed proposals:
    IDEA-20260901-ec54fe (affine skeleton census), IDEA-20260901-69912d
    (layer autopsy, affine-gated), IDEA-20260901-bcb117 (nonlinearity
    dilution ramp), IDEA-20260901-02f7c4 (proves-too-much artifact
    battery), all in ledger/proposals/ (commit 77e0076a0).

  decision: select_ideas_and_open_batch

  decision_scope: >-
    THIS DECISION RANKS THE FOUR PROPOSALS, SELECTS TWO FOR IMMEDIATE
    EXECUTION, AND OPENS BATCH-803af6 TO RUN THEIR CHEAPEST DISCRIMINATING
    STAGES. It moves no head field, reviews no experimental evidence, and
    promotes no knowledge; it is a selection and dispatch act.

  selection:
    - rank: 1
      idea: IDEA-20260901-ec54fe
      scope_selected: >-
        STAGE 0 ONLY plus the blocking anchor re-measurement (the record's
        own F1 falsification): the exact GF(2) rank census over the frozen
        cell set at r=1..10 (zero cipher compute), anchor-cell
        reproduction of the BATCH-b41ba9 affine arm (ranks 32,0,0,0,
        P(hit)=1.0), and one 2^30 affine-cell arm verifying the census's
        NULL-predicted cells as known-answer fixtures. Stages 1-2 (the
        full dichotomy arms) await a successor batch on this result.
      basis: >-
        dominated_by null after the generator's row-by-row frontier check;
        converts one archived exact cell into an exact map at zero cipher
        compute; separates two mechanism classes no committed record has
        separated (linear-geometry-driven death round vs
        nonlinearity-driven decay); manufactures known-answer controls the
        other proposals need.
    - rank: 2
      idea: IDEA-20260901-02f7c4
      scope_selected: >-
        B4 EXCLUSION-TOGGLE AUDIT ONLY (the battery's cheapest arm): one
        AES r=5 arm and one null-object arm, each in two builds
        (trivial-trial exclusion enabled vs deliberately disabled), with
        the preregistered exact signed-delta prediction. Battery arms
        B1-B3 await a successor batch.
      basis: >-
        Defends the pipeline before any census reading is interpreted
        (the battery's own gate structure); the cheapest arm first;
        dominated on one named axis only (EV-AES-e4c091's structureless
        null, reused as anchor seat).
    - rank: 3
      idea: IDEA-20260901-69912d
      basis: >-
        DEFERRED by construction: its Stage 0 gate consumes ec54fe's
        census output, so it cannot start before this batch lands.
    - rank: 4
      idea: IDEA-20260901-bcb117
      basis: >-
        DEFERRED on cost/ordering: its ramp arms are heavier (2^32) and
        its interpretation depends on the pipeline defence (02f7c4) and
        the census (ec54fe).

  target_ids:
    - GOAL-AES-003
    - RQ-AES-003
    - BATCH-803af6
    - IDEA-20260901-ec54fe
    - IDEA-20260901-02f7c4
    - IDEA-20260901-69912d
    - IDEA-20260901-bcb117
    - TASK-20260901-3dffdc
    - TASK-20260901-e2e66e
    - TASK-20260901-75360b
    - TASK-20260901-d004bb
    - TASK-20260901-b309a2
    - EV-AES-64750e
    - DEC-20260901-182c3d

  rationale:
    - >-
      The two selected stages are the two cheapest falsification-relevant
      moves across all four proposals, are disjoint in write scope and in
      instrument, and run concurrently without contention.
    - >-
      ec54fe's census is pure computation (sparse GF(2) products on
      128x128 matrices, seconds per cell) plus one 2^30 arm at the
      campaign's measured rates; 02f7c4 B4 is four short arms. Total
      declared compute stays under two hours at 8 threads.
    - >-
      The deferred proposals are not rejected: 69912d and bcb117 are
      sequenced behind this batch's outputs by their own design.

  dispatch_note: >-
    Queue authored at
    coordination/goals/GOAL-AES-003/batches/BATCH-803af6/dispatch_queue.json:
    TASK-20260901-3dffdc (ec54fe stage 0 + anchor arm),
    TASK-20260901-e2e66e (02f7c4 B4), TASK-20260901-75360b (snapshot of
    both), TASK-20260901-d004bb (independent validator),
    TASK-20260901-b309a2 (ledger archive, owning EV-AES-64750e and
    DEC-20260901-182c3d, both minted and --checked). Inference under
    DEC-20260831-0d1eeb.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED. Selection and dispatch act; no new durable claim.

  decided_by: coordinator
  decided_at: '2026-09-01'

