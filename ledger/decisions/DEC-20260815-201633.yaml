coordinator_decision:
  id: DEC-20260815-201633

  context: >-
    BATCH-279acb of GOAL-MLKEM-005 discharged DEC-20260814-8ec2e5's own
    next_actions in full: TASK-20260815-6e4c02 ran a genuine 1-bit-resolution
    bisection at (d=512, beta=40), isolated-LLL-step level, between 65 bits
    (known failing) and 100 bits (known succeeding, per the predecessor
    batch's own Red Team OBJ-1/CTRL-1 control) -- determined 69 bits as the
    minimum adequate precision AT THAT EXACT INSTANCE, a genuinely determined
    minimum, not a fallback -- then re-attempted the three currently-ERRORing
    d=512 main-grid cells' own full BKZ tours at that precision, each capped
    at PER_BASIS_FEASIBILITY_CAP_V3=14400s (never approached; largest cell
    cost 631.74s). RESULT: 0/3 cells completed. TWO INDEPENDENT REVIEWS
    RETURNED: Validator TASK-20260815-2f026b (VAL-20260815-2f026b), verdict
    `passed`, which independently reproduced the bisection boundary and all 3
    reattempted cells live, bit-identical, and disclosed two non-load-bearing
    arithmetic errors in run_manifest.yaml's own narrative prose; and Red Team
    TASK-20260815-85e02a (RT-20260815-85e02a), which does not challenge the
    0/3 outcome, the notarization chain, or the construction/seed fidelity,
    but raises OBJ-1 (severity: critical) -- a live, independently-executed,
    seed-bit-identical control at (d=512, beta=55) and (d=512, beta=70)
    directly falsifies the task's own framing that "69 bits" generalizes
    within d=512: BOTH other bases ERROR at 69 bits and COMPLETE at 100 bits,
    the exact same operation their own full-tour reattempts already fail on.
    CONSEQUENCE: only 1 of the 3 reattempted cells -- (d=512, beta=40) -- was
    actually tested at its own correctly-calibrated precision; the other two
    were tested at a precision the Red Team's own executed control now shows
    is inadequate for their own bases, their true minimum lying somewhere in
    (69, 100], never tested at any level for their own basis. This is,
    structurally, the SAME calibration-instance-generality hazard
    TASK-20260815-6e4c02 was itself commissioned to correct
    (DEC-20260814-8ec2e5's own escalation-branch ruling), now recurring one
    level deeper: within d=512, across beta, rather than across dimension.
    The Red Team's own OBJ-2 separately confirms (d=512, beta=40)'s own
    deeper-but-still-failing full-tour result (even at ITS OWN correctly-
    bisected precision) is a FOURTH recurrence of KN-FIND-f54a82's own
    already-promoted isolated-step-vs-full-tour permissiveness pattern. NO
    FACTUAL CONFLICT EXISTS BETWEEN THE TWO REVIEWS -- the Red Team's own
    scope is a strict superset of the Validator's own (the Validator
    reproduced what the producer actually tested; the Red Team additionally
    tested the untested generality question the producer's own single-
    instance bisection design could not itself answer). This decision rests
    on the reconciled, narrower reading; the full account is
    EV-MLKEM-e4189c.cell_by_cell_precision_status. CLAIM TIER TOY,
    UNCONDITIONALLY: nothing here bears on ML-KEM security, any FIPS 203
    parameter set, any attack cost, or any cost model.

  decision: revise

  decision_note: >-
    `revise` is the ACTION: the evidence record is committed with the
    cell-by-cell-precision-status reconciliation, and the successor's single
    next action is a narrower, strictly cheaper, evidence-directed follow-up
    than either of DEC-20260814-4ac30a's own named escalation branches -- NOT
    a verdict on C1 or C2, and NOT a change to H-MLKEM-7d9bcc's or
    EXP-MLKEM-42ea04's status. PREREG-8 section 4.3 item 1's own FORBIDS
    clause bars any C1/C2 statement at the affected scope while
    T-PROJNOISE-NODATA fires (again), and this decision honours that bar in
    full. `approve` (of EXP-MLKEM-42ea04) is explicitly declined again: no
    cell cleared Stage 0 this batch either, and 2 of the 3 attempted d=512
    cells were never even tested at their own adequate precision, so there is
    still no measured per-cell cost at a properly calibrated attempt to size
    a Stage-1 budget from. `pause` is unavailable, for the identical reason
    the two predecessor decisions in this chain gave: GOAL-MLKEM-005's
    pause_conditions are infrastructure-only, and an infrastructure-limited
    result is explicitly listed in the goal's own non_terminal_conditions.
    THIS BATCH CLOSES, PAUSES, AND COMPLETES NOTHING.

  target_ids:
  - GOAL-MLKEM-005
  - BATCH-279acb
  - TASK-20260815-6e4c02
  - TASK-20260815-af296c
  - TASK-20260815-2f026b
  - TASK-20260815-85e02a
  - EV-MLKEM-e4189c
  - H-MLKEM-7d9bcc
  - EXP-MLKEM-42ea04

  # ==================================================================
  # 1. VALIDITY BEFORE INTERPRETATION
  # ==================================================================
  run_set_validity:
    ruling: >-
      THE RUN SET IS VALID AND ADMISSIBLE for exactly what it reports: a
      d=512-specific bisection-and-reattempt re-measurement that reached
      ZERO completed main-grid reductions, of which exactly ONE cell was
      tested at its own correctly-calibrated precision. It is NOT, and is
      not treated as, evidence for or against C1 or C2.
    expected_run_count: >-
      ONE producer task, one internally-declared run
      (RUN-MLKEM-D512BISECT-1), completed within budget (per-phase totals
      2662.76s bisection + 4080.23s reattempt, well under the 48000s
      overall cap; see EV-MLKEM-e4189c.arithmetic_errors_disclosed for the
      two double-counted/mis-transposed narrative totals this does NOT
      match). Both independent reviews confirm no Stage-1 work, no
      NULL-1/2/3/SENS control, and no (d=256, *) cell occurred anywhere.
    schema_complete_manifests: >-
      CONFIRMED BY THE VALIDATOR (notarization chain checked in both
      directions with git plumbing; every declared committed artifact hash
      verified) AND INDEPENDENTLY BY THE RED TEAM (its own equivalent check,
      same git plumbing, same result).
    seed_integrity: >-
      CONFIRMED BY BOTH REVIEWS INDEPENDENTLY. SEED_ROOT=715923 and the full
      default_rng formula reproduce bit-identical seed values across the
      producer, the Validator, and the Red Team, at (d=512, beta=40), and
      independently re-derived and confirmed bit-identical at (d=512,
      beta=55) and (d=512, beta=70) by the Red Team's own OBJ-1 control.
    raw_summary_agreement: >-
      CONFIRMED FOR EVERY RAW PER-TRIAL AND PER-CELL FIGURE. TWO
      NON-LOAD-BEARING NARRATIVE-SUMMARY ARITHMETIC ERRORS ARE DISCLOSED
      (see EV-MLKEM-e4189c.arithmetic_errors_disclosed): a double-counted
      total wall-clock figure ("6742.99s") and a digit-transposed outer
      timestamp delta ("~4779s" vs. the correct 4179s), both found
      independently by both reviews; a third, minor trial-count error ("8
      trials" vs. the actual 7) was found only by the Red Team. None
      propagates to any cap-compliance determination, cell status, or seed
      value.
    control_comparability: >-
      NOT APPLICABLE. PREREG-8 section 2.2-2.3 scopes Stage 0 to feasibility
      timing only; both reviews independently confirm this scope was
      honoured.
    infrastructure_separation: >-
      The 0/3 main-grid outcome (all 3 ERROR, none NOT_COMPUTED) is genuine
      infrastructure signal under AGENTS.md rule 5, never a negative
      mathematical result about C1 or C2.

  # ==================================================================
  # 2. THE TERMINATION BRANCH
  # ==================================================================
  termination_branch:
    branch: T-PROJNOISE-NODATA fires AGAIN, for this narrower d=512 follow-up.
    firing_confirmed_by: >-
      TASK-20260815-6e4c02's own writeup, the Validator (no challenge to the
      branch), the Red Team (narrowest_supported_statement, "does not
      challenge it"), and this Coordinator's own reading of PREREG-8
      sections 2.3 and 4.3 item 1.
    licenses: >-
      Citing the (d=512, beta=40) bisection result and the 3-cell reattempt's
      own real per-cell outcomes as a standalone, reportable
      infrastructure-timing deliverable. Nothing else.
    forbids: >-
      Any statement about C1 or C2's truth, in either direction, at any of
      the 3 cells. This decision makes none.

  # ==================================================================
  # 3. RECONCILIATION OF THE TWO REVIEWS' FINDINGS
  # ==================================================================
  review_reconciliation_ruling: >-
    NO FACTUAL CONFLICT EXISTS BETWEEN THE TWO REVIEWS, AND NONE REQUIRES
    ADJUDICATION AGAINST A LIVE fpylll INSTALL. Where both reviews overlap
    (the notarization chain; the bisection's genuineness; the construction
    and seed-formula fidelity; the 3-cell reattempt AT THE PRODUCER'S OWN
    TESTED PRECISION), they agree exactly, each independently, live
    re-executing and reproducing the producer's own reported figures
    bit-identically. The Red Team's own OBJ-1/OBJ-2/OBJ-3/OBJ-4 are a
    superset of the Validator's own scope, not a contradiction of it: the
    Validator's own review reproduces what the producer actually ran (all 3
    cells at the single, beta=40-derived precision); the Red Team
    additionally, independently ran the untested generality question --
    does that precision hold at the OTHER two bases -- that the producer's
    own task design (a single bisection at a single instance, applied
    unchanged to three cells) could not itself answer and was never asked
    to answer. This is EXACTLY the shape of DEC-20260814-8ec2e5's own
    review_reconciliation_ruling one level deeper: complementary findings on
    two different, non-contradictory axes of the SAME under-tested
    generality question, not a disagreement to resolve.

  # ==================================================================
  # 4. WHAT THE COMPOUND FINDING LICENSES AGAINST THIS TASK CARD'S OWN
  # NAMED BRANCHES -- THE ESCALATION-BRANCH QUESTION
  # ==================================================================
  escalation_branch_ruling: >-
    NOT RIPE. THIS IS THE SAME DETERMINATION DEC-20260814-8ec2e5 MADE ONE
    LEVEL SHALLOWER, MADE HERE EXPLICITLY RATHER THAN BY DEFAULT, AND THE
    ANSWER IS THE SAME FOR A DIRECTLY ANALOGOUS REASON. DEC-20260814-4ac30a's
    own named escalation branches (upstream fplll bug report, alternate
    build/version, or a scoped-down dimension) presuppose that the corrected
    (ROW_EXPO-free, mpfr) construction ITSELF is exhausted at d=512 -- that a
    genuinely, properly calibrated attempt at every d=512 main-grid cell has
    been tried and failed. That premise is NOT MET by this batch's own 0/3
    outcome: only ONE of the three cells, (d=512, beta=40), was actually
    tested at its own correctly-calibrated precision, and even that cell's
    own result (a deeper-but-still-failing outcome, the fourth recurrence of
    KN-FIND-f54a82's own pattern) is consistent with, and does not
    decisively resolve between, "the construction is fundamentally exhausted
    at this cell" and "the isolated-step proxy is still not the right
    calibration target for the full tour." The other two cells, (d=512,
    beta=55) and (d=512, beta=70), were tested ONLY at a precision the Red
    Team's own live, executed OBJ-1 control DECISIVELY SHOWS is inadequate
    for their own bases -- their true minimum lies in (69, 100], and NEITHER
    CELL HAS EVER BEEN ATTEMPTED, AT ANY LEVEL, AT A PRECISION ACTUALLY
    ADEQUATE FOR ITS OWN BASIS. Naming the escalation branches ripe now would
    close a lane on an obstruction measured over a scope (one
    single-instance-bisected precision, applied unchanged to two other,
    untested bases) narrower than what the escalation branches assert (the
    construction, or the fpylll/fplll build itself, is exhausted at d=512) --
    precisely the failure mode agents/coordinator.md's "Closure gate"
    identifies as the more common and more expensive one. Per
    docs/inventor-protocol.md's closure standard, an obstruction claimed
    over a scope broader than what was actually measured is not admitted
    here. INSTEAD, per the Red Team's own CTRL-2/CTRL-3 and
    next_concrete_action, ONE additional, cheap, bounded follow-up is named
    as this goal's own next_action (section 6 below), BEFORE either of
    DEC-20260814-4ac30a's named escalation branches is treated as ripe. If
    THAT follow-up also fails to clear either of the two remaining cells at
    their OWN properly-calibrated precision, the obstruction is then
    measured closer to (though, per the Red Team's own CTRL-3 caveat, still
    not necessarily fully at) the scope the escalation branches require --
    that determination is reserved for the Coordinator decision reviewing
    that follow-up's own result, not pre-empted here.

  # ==================================================================
  # 5. STAGE 1 IS STILL NOT AUTHORIZED OR SIZED
  # ==================================================================
  stage_1_authorization_ruling: >-
    PREREG-8's own Stage 1 IS NOT AUTHORIZED, SIZED, OR IMPLICITLY LICENSED
    BY ANYTHING IN THIS DECISION. No cell cleared Stage 0 this batch, and
    only one of the three attempted cells was even tested at its own
    correctly-calibrated precision (and that one still failed). There is
    still no cleared cell, no measured per-cell cost at a properly
    calibrated attempt, and no basis from which to size a Stage-1 dispatch.

  # ==================================================================
  # 6. HYPOTHESIS AND EXPERIMENT STATUS, RULED EXPLICITLY
  # ==================================================================
  hypothesis_status_ruling: >-
    H-MLKEM-7d9bcc STAYS `proposed`. Reasoned, not defaulted:
    EXP-MLKEM-42ea04's own success_criterion requires at least one (n, beta)
    cell to clear Stage 0 and produce >= 8 complete draws before this
    hypothesis may advance even to `analyzed`. Zero cells cleared Stage 0
    this batch, and only one cell was tested at its own adequate precision
    at all. A Stage-0-only, infrastructure-outcome result -- even one whose
    interpretation is now substantially narrower and better understood --
    CANNOT license any movement of this hypothesis's status in either
    direction: T-PROJNOISE-NODATA's own FORBIDS clause bars exactly that.
    `proposed` is therefore not a default holdover but the ONLY status this
    record's evidence permits. H-MLKEM-7d9bcc.yaml itself is not touched by
    this decision, per this task's own constraints; it is frozen and
    unedited.

  experiment_approval_ruling: >-
    EXP-MLKEM-42ea04 STAYS `review_required`/`approved_by: null`. Approval
    is a distinct, explicit act (AGENTS.md rule 1) and I explicitly DECLINE
    to make it here, not merely defer it as a byproduct of archiving this
    batch's result. Grounds: (1) no cell cleared Stage 0 at any tested,
    properly calibrated precision, so no responsible Stage-1 budget can be
    derived from this batch's own measurements; (2) two of the three
    attempted d=512 cells remain genuinely untested at their own adequate
    precision, so even a narrower reading of "the construction may still
    clear at d=512" is itself unconfirmed by any completed cell -- a
    plausible path to a cleared cell is not a cleared cell.
    EXP-MLKEM-42ea04/specification.yaml itself is not touched by this
    decision, per this task's own constraints; it is frozen and unedited.

  # ==================================================================
  # 7. RATIONALE
  # ==================================================================
  rationale:
  - >-
    THE FOLLOW-UP DID EXACTLY WHAT IT WAS COMMISSIONED FOR AT THE ONE
    INSTANCE IT WAS DESIGNED TO CALIBRATE: it determined a genuine,
    single-instance-correct minimum precision at (d=512, beta=40) and
    measured a real, definite ERROR outcome there, at a materially
    different failure site than before. What it could NOT do, by its own
    single-instance-bisection design, is calibrate the other two cells --
    and the Red Team's own executed control shows decisively that it did
    not, in fact, generalize to them.
  - >-
    THE HARD CALL IS THE ESCALATION-BRANCH RULING, MADE ON THE RECONCILED
    EVIDENCE RATHER THAN ON THE BARE 0/3 FIGURE READ ALONE, FOR THE SAME
    REASON AS ITS PREDECESSOR ONE BATCH AGO. A naive reading of "0/3, at a
    dimension-appropriate precision" would treat this batch as licensing the
    next-named escalation by default. The Red Team's own executed control
    directly falsifies the premise that two of the three cells were ever
    tested at an adequate precision for their own bases at all.
  - >-
    THE ADVERSE ITEM IS CARRIED RATHER THAN SOFTENED: 0/3 cells completed,
    and even the ONE cell tested correctly still failed, at a deeper site --
    a fourth recurrence of a pattern this goal already knows to expect. This
    is not reported as a disguised success.
  - >-
    WHAT THIS BATCH IS NOT ALLOWED TO BUY, STATED SO NO LATER READER HAS TO
    INFER IT. It buys no C1/C2 finding, no ML-KEM statement, no Stage-1
    authorization, no experiment approval, no hypothesis-status movement,
    and no escalation-branch determination. A genuinely useful narrowing of
    a negative interpretation is not the same thing as Stage 0 having
    cleared, and this decision does not conflate them.

  # ==================================================================
  # 8. WHAT DOES NOT CHANGE
  # ==================================================================
  binding_carries_restated_and_not_re_litigated:
  - CLAIM TIER STAYS TOY, UNCONDITIONALLY.
  - H-MLKEM-11aabf (analyzed), H-MLKEM-dc51f5, H-MLKEM-232843, H-MLKEM-34e22e
    (all proposed) are UNCHANGED by this decision.
  - PREREG-8's own frozen text, DEC-20260814-4ac30a, DEC-20260814-8ec2e5,
    EV-MLKEM-098182, EV-MLKEM-ef0261, and KN-FIND-f54a82 are BINDING-CARRIED
    WITHOUT RE-LITIGATION.
  - NO HYPOTHESIS STATUS MOVES. THE GOAL IS NOT CLOSED, PAUSED, OR
    COMPLETED, and an infrastructure-limited result may not be cited in a
    decision that closes it (GOAL-MLKEM-005's own non_terminal_conditions).
  - The (d=256, beta=55)/(d=256, beta=70) open question named in
    EV-MLKEM-098182's own unresolved_confounds is UNCHANGED and out of
    scope for this batch, exactly as this task card required.
  - THE SPLIT-PRODUCER NOTARIZATION AND SNAPSHOT-BEFORE-REVIEW PATTERNS ARE
    RETAINED UNCHANGED. knowledge/INDEX.md must NOT be written, regenerated,
    or staged.

  # ==================================================================
  # 9. EVIDENCE
  # ==================================================================
  evidence_refs:
  - ledger/evidence/EV-MLKEM-e4189c.yaml
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-279acb/reviews/TASK-20260815-2f026b/validation_report.yaml
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-279acb/red-team/TASK-20260815-85e02a/red_team_report.md
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-279acb/tasks/TASK-20260815-6e4c02/writeup.md
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-279acb/tasks/TASK-20260815-6e4c02/bisection_d512_results.json
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-279acb/tasks/TASK-20260815-6e4c02/main_grid_d512_reattempt_results.json
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-279acb/tasks/TASK-20260815-6e4c02/run_manifest.yaml
  - ledger/decisions/DEC-20260814-8ec2e5.yaml
  - ledger/evidence/EV-MLKEM-098182.yaml
  - knowledge/findings/KN-FIND-f54a82.md
  evidence_refs_note: >-
    Every number and figure quoted in this decision is attributed to the
    producer's own writeup/manifest/results, or one of the two review
    reports. No measurement, timing, citation, or run is invented anywhere
    in this record. This drafting session ran no code and held no shell;
    every figure above is a citation of what the producer and the two
    reviews' own probes report, not a re-derivation.

  # ==================================================================
  # 10. LIMITATIONS
  # ==================================================================
  limitations:
  - CLAIM TIER TOY, UNCONDITIONALLY.
  - >-
    INDEPENDENCE IS PROCEDURAL, NEVER MODEL-LEVEL. AGENTS.md rule 12 is
    UNMET AND UNWAIVED. The Validator and Red Team ARE independent sessions;
    the reconciliation above was performed by this Coordinator, not by a
    fourth, independent reviewer -- disclosed explicitly, not smoothed over.
    Unlike BATCH-3b9962's own root-cause reconciliation, no adjudication
    against a live fpylll install was required: the two reviews' own scopes
    are strictly nested (Validator reproduces what was tested; Red Team
    additionally tests what was not), not conflicting.
  - >-
    OF THE 3 REATTEMPTED d=512 CELLS, ALL THREE WERE INDEPENDENTLY
    REPRODUCED AT THE PRECISION ACTUALLY TESTED (69 bits) BY THE VALIDATOR.
    ONLY (d=512, beta=40) HAS EVER BEEN TESTED, BY ANYONE, AT ITS OWN
    CORRECTLY-CALIBRATED PRECISION. (d=512, beta=55) AND (d=512, beta=70)'S
    OWN TRUE MINIMUM ADEQUATE PRECISION REMAINS UNDETERMINED, BRACKETED ONLY
    TO (69, 100] BY THE RED TEAM'S OWN OBJ-1.
  - >-
    THE FOURTH RECURRENCE OF KN-FIND-f54a82's OWN ISOLATED-STEP-VS-FULL-TOUR
    PATTERN (at (d=512, beta=40), even at its own correctly-bisected
    precision) MEANS THAT EVEN A PROPERLY-CALIBRATED PRECISION AT (d=512,
    beta=55)/(d=512, beta=70) IS NOT GUARANTEED TO CLEAR A FULL TOUR EITHER
    -- the Red Team's own CTRL-3 caveat, carried forward into next_actions
    below, not resolved by this decision.
  - >-
    NOTHING IN THIS RECORD IS DURABLE OR OFFICIAL until the ledger archive
    carrying it commits, THE POST-COMMIT VERIFIER ACCEPTS IT -- RUN BEFORE
    THE PUSH, NOT AFTER -- and the branch is pushed with an open PR against
    main naming EV-MLKEM-e4189c, DEC-20260815-201633, and GOAL-MLKEM-005.

  # ==================================================================
  # 11. KNOWLEDGE PROMOTION -- THE DEFERRED BAR REVISITED
  # ==================================================================
  knowledge_promotion:
    promoted: [KN-FIND-ead2ac]
    promoted_note: >-
      IDENTIFIER SUPPLIED BY THE ORCHESTRATING SESSION BEFORE THIS ARCHIVE
      COMMITTED, per AGENTS.md rule 14 and this field's own request: a fresh
      KN-FIND-ead2ac identifier (random 6-hex token) was drawn and confirmed
      free in two scopes -- worktree `tools/allocate_id.py --check
      KN-FIND-ead2ac` (0 occurrences across 6,965 identifier-bearing paths)
      and a cross-ref sweep of the 25 most-recently-updated remote branches
      (0 hits) -- matching KN-FIND-f54a82's own established provenance
      discipline exactly. knowledge/findings/KN-FIND-ead2ac.md is filed with
      the content specified in what_the_promotion_would_say_if_minted below,
      structured to match KN-FIND-f54a82.md's own established entry format.
      This placeholder-replacement note is retained (rather than deleted) as
      the record of how the identifier was supplied, matching
      DEC-20260814-4ac30a's own precedent for KN-FIND-f54a82 itself.
    not_warranted: null
    bar_revisited: >-
      DEC-20260814-8ec2e5's own knowledge_promotion field set a bar of "TWO
      independent recurrences, from structurally different questions"
      before promoting the calibration-instance-generality lesson (OBJ-1's
      own axis, distinct from KN-FIND-f54a82's already-promoted operation-
      level axis), and explicitly named the follow-up that produced this
      batch as "the decisive test of whether this pattern recurs -- and
      therefore whether it clears that bar," stating in terms this record
      applies directly: "if that follow-up confirms the pattern at
      additional (d, beta) pairs ... promotion should be revisited then."
      THAT HAS NOW HAPPENED: this batch's own OBJ-1 confirms the identical
      calibration-instance-generality mechanism at TWO additional (d, beta)
      pairs -- (d=512, beta=55) and (d=512, beta=70) -- both live-executed,
      both seed-bit-identical, both falsifying "the beta=40-bisected
      precision generalizes." THIS RECORD JUDGES THE BAR MET, FOR REASONS
      STATED EXPLICITLY RATHER THAN DEFAULTED: (1) DEC-20260814-8ec2e5's own
      next_actions text pre-committed this EXACT operational criterion for
      this EXACT follow-up, and a Coordinator continuing a chain of
      reasoning across batches should not renege on a prior Coordinator's
      own stated, considered criterion absent a new reason to -- none is
      found here. (2) The two recurrences genuinely differ in WHICH
      structural axis of instance variation is tested: the FIRST
      (BATCH-d1a736's own OBJ-1) is ACROSS-DIMENSION (a precision bisected
      at d=256 fails to generalize to d=512); the SECOND (this batch's own
      OBJ-1) is WITHIN-DIMENSION-ACROSS-BETA (a precision bisected at
      (d=512, beta=40) fails to generalize to (d=512, beta=55) and (d=512,
      beta=70), holding dimension fixed) -- a materially different
      parameter axis, not a mechanical restatement of the same measurement.
      (3) The underlying hazard the two recurrences jointly establish is
      now STRONGER and MORE GENERAL than either alone: not merely "a
      precision bisected at one dimension does not transfer to another
      dimension," but "a precision bisected at one (d, beta, seed) instance
      does not transfer to ANY other instance of the identical cheap
      sub-step, whether the other instance differs in dimension or merely
      in beta at the same dimension" -- a genuinely broader, more useful
      methodological lesson than either single control alone would support.
      A GENUINE COUNTERWEIGHT, DISCLOSED RATHER THAN OMITTED: unlike
      KN-FIND-f54a82's own historical two-recurrence bar (which required
      each recurrence to arise from an investigation NOT DESIGNED around the
      other's own question -- "neither probe pairing was built with the
      other's own question in mind"), this batch's own OBJ-1 was
      EXPLICITLY, DELIBERATELY COMMISSIONED to test exactly this axis (this
      task's own completion_gate directs the Red Team to challenge "does the
      (d=512, beta=40)-bisected precision actually hold at (d=512, beta=55)
      and (d=512, beta=70)?" in so many words) -- it is a directed
      confirmation experiment, not an independently-arising discovery in the
      sense KN-FIND-f54a82's own promotion note used that word. This is a
      WEAKER form of independence than KN-FIND-f54a82's own precedent, and
      is stated as such in the promoted entry's own limitations rather than
      smoothed over. It does not, on its own, disqualify promotion here,
      because DEC-20260814-8ec2e5's own pre-committed criterion (point (1)
      above) is the more specific, more recently-stated, and directly
      binding standard for THIS finding, and it asks for confirmation at
      additional (d, beta) pairs, not for undirected discovery.
    what_the_promotion_would_say_if_minted: >-
      TITLE: "A precision minimum bisected at one (dimension, beta, seed)
      instance of an fpylll isolated-LLL-preprocessing step is not evidence
      it holds at a different instance of the identical cheap sub-step --
      confirmed across two structurally different axes of instance
      variation." CLAIM TIER: TOY, unconditionally; nothing bears on ML-KEM
      security, any FIPS 203 parameter set, or any attack cost. THE FINDING,
      IN ONE SENTENCE: in fpylll (>=0.6.4), a minimum mpfr precision
      determined by bisection at ONE (d, beta, seed) instance of the
      isolated LLL/GSO-preprocessing step (GSO.Mat(...) -> LLL.Reduction(...)
      -> lll_obj(), the identical sub-step KN-FIND-f54a82 already names) is
      measurably, non-trivially inadequate at a DIFFERENT instance of the
      SAME cheap sub-step -- confirmed independently, by live execution with
      bit-identical seeds, across TWO structurally different axes of
      instance variation: ACROSS DIMENSION (a precision bisected at (d=256,
      beta=40) fails at (d=512, beta=40): 65 bits ERROR, 100 bits COMPLETED
      -- BATCH-d1a736's own OBJ-1) and, now, WITHIN A FIXED DIMENSION ACROSS
      BETA (a precision bisected at (d=512, beta=40) fails at (d=512,
      beta=55) and (d=512, beta=70), holding d fixed: 69 bits ERROR, 100
      bits COMPLETED at both -- BATCH-279acb's own OBJ-1). GENERAL LESSON: a
      cheap, single-instance precision bisection is not, by itself, evidence
      about ANY other instance of the identical sub-step -- not across
      dimension, and not even across a cheaper-to-vary parameter like beta
      at fixed dimension. A calibration campaign that reuses one instance's
      bisected minimum across a multi-cell sweep, without separately
      verifying each cell, risks under-provisioning some cells while
      correctly provisioning others, with no way to tell which from the
      bisection alone. WHAT THIS DOES NOT SAY: it does not identify the
      underlying C++/mpfr numerical mechanism (unidentified in both source
      batches); it does not claim the isolated-step precision, once properly
      calibrated per-instance, is sufficient for the full BKZ tour (the
      SEPARATE, already-promoted KN-FIND-f54a82 axis shows it frequently is
      not, now confirmed a fourth time in this same batch at (d=512,
      beta=40) itself); and it makes no claim about any lattice family
      beyond IntegerMatrix.random(d,"qary",k=d//2,q=3329) or any fpylll
      version beyond 0.6.4 on this host. LIMITATIONS TO CARRY INTO THE ENTRY
      ITSELF: (i) AGENTS.md rule 12 is unmet and unwaived, as in every
