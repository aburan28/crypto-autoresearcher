coordinator_decision:
  id: DEC-20260831-fccd7e
  context: >-
    This Coordinator decision composes the independent Validator (J1,
    `passed`/`holds`) and Red Team (J2,
    `holds_with_findings_that_confirm_and_meaningfully_qualify_the_disposition`)
    reviews of EXP-MONO-b19c6b's execution: the third of three consecutive
    experiments in this lane testing H-MONO-663fb4's K3/K4 discriminating
    question, and the first whose instrument both reviewers independently
    confirmed, via full bit-for-bit re-execution and independent
    arithmetic re-derivation, to be genuinely powered and genuinely
    independent. Both reviewers converged on confirming the disposition
    while each surfacing distinct new, disclosed findings; this decision
    adopts both.
  decision: support
  decision_label: >-
    controlled_null_confirmed_at_verified_power_for_per_curve_holm_reading_fisher_combined_sensitivity_open_qualification_third_of_three_k3_k4_attempts
  target_ids:
    - H-MONO-663fb4
    - EXP-MONO-b19c6b
    - RQ-MONO-001
    - EV-MONO-04d447
    - CORR-20260831-d663e0
    - knowledge/techniques/KN-TECH-a810e4.md
    - knowledge/techniques/KN-TECH-95a42b.md

  hypothesis_status_before: partially_supported_instrument_uncalibrated
  hypothesis_status_after: supported_scoped_k3_k4_controlled_null_fisher_sensitivity_open
  hypothesis_status_after_note: >-
    UPGRADED from `partially_supported_instrument_uncalibrated`. For the
    first time across three consecutive experiments, K3/K4's per-curve
    Holm/permutation reading is SUPPORTED with high confidence by a
    design-time-power-verified, independently-panel-verified, fully
    reviewed instrument: no significant deviation was found anywhere,
    confirmed by an exhaustive audit of all 760 raw per-curve p-values
    (below, not above, the null-expected rate of nominally-low results).
    `supported_scoped` rather than plain `supported` because (a) this
    covers the per-curve Holm/permutation statistic specifically, not the
    co-equal Fisher-combined statistic, whose SENSITIVITY to a genuine
    positive is unverified anywhere in this lane (K5's own mandatory
    nearby-object control was never discharged against it); (b) toy
    scale, one panel, one F value, one m value, per the contract's own
    claim_ceiling; (c) "controlled null confirmed" is consistent with but
    does not confirm the load-bearing conditional HEUR-CHR-2.

  experiment_status_before: approved
  experiment_status_after: completed

  official_status_changes:
    goal_status_changed: false
    goal_status_after: paused
    hypothesis_status_changes:
      - hypothesis_id: H-MONO-663fb4
        from: partially_supported_instrument_uncalibrated
        to: supported_scoped_k3_k4_controlled_null_fisher_sensitivity_open
    experiment_status_changes:
      - experiment_id: EXP-MONO-b19c6b
        from: approved
        to: completed
    resource_disposition_changed: false
    completion_criteria_met: []
    implementation_authorized: false
    experiment_runs_authorized: 0
    scientific_interpretation_authorized: true
    closure_authorized: false
    breakthrough_authorized: false

  claim_tier: toy
  scope_statement: >-
    Scoped exactly to EXP-MONO-b19c6b's tested regime: prime fields F_p,
    p roughly in [73, 2050] on the realized 90-98-curve panel (45-49 j0,
    48-49 random-ordinary), F=N/4, m=4, n=20000 matched-null draws per
    cell, Holm/Bonferroni AND Fisher-combined tests, both independently
    verified powered and both independently verified to draw from a
    genuinely independent two-family panel. No ECDLP, relation-rate,
    exponent, or cryptographic-scale claim. Does not close KN-OPEN-009.

  rationale:
    - >-
      BOTH REVIEWERS INDEPENDENTLY CONFIRMED, VIA FULL BIT-FOR-BIT
      RE-EXECUTION AND FIRST-PRINCIPLES ARITHMETIC RE-DERIVATION (NOT
      TRUSTING COORDINATOR OR CORRECTION PROSE), THAT BOTH OF
      EXP-MONO-670aa6'S NAMED DEFECTS ARE GENUINELY FIXED. The
      permutation-p-value floor now sits 10.2x-11.1x BELOW every declared
      family's Holm threshold (opposite of the predecessor's 5-10x
      above); zero full-triple (p,B,t_used) collisions across 46 and 48
      matched curve_ordinals (was 100%). Neither reviewer found any
      p-value near the floor or the threshold anywhere in either run.
    - >-
      THE RED TEAM'S EXHAUSTIVE AUDIT OF ALL 760 RAW PER-CURVE P-VALUES
      IS THE SINGLE STRONGEST PIECE OF EVIDENCE FOR A GENUINE (NOT
      TAUTOLOGICAL) NULL: 27/760 (3.55%) below nominal 0.05, BELOW the
      38/760 (5.00%) a perfectly-calibrated null would produce. This is a
      non-corrected, non-Holm, non-Fisher-combined, independent line of
      evidence pointing the same direction as every other statistic in
      this run. One exploratory field_bits=9 pattern was found and
      self-null-object-controlled by the Red Team (appears equally in the
      null-object arm) and correctly read as noise, not signal.
    - >-
      THE DISCLOSED ALPHA-INFLATION DEFECT (CORR-20260831-d663e0) IS
      CONFIRMED REAL BY BOTH REVIEWERS, CONFIRMED PRESENT IN THE ACTUALLY
      EXECUTED CODE (not merely the tampered specification text -- the
      Validator additionally found an independent timestamp proof: both
      runs completed ~7 hours before the tampering commit was even
      authored), AND CONFIRMED EMPIRICALLY INCONSEQUENTIAL TO THE
      SPECIFIC NUMBERS OBSERVED. The Red Team's own sharpening is
      adopted: the bare "Stage 2 passed" EVENT, read in isolation, is
      materially weaker evidence of calibration than a naive reading
      suggests (a well-calibrated instrument had only a ~54.0% a priori
      chance of clearing the flawed composite gate on both seeds) -- the
      actual evidentiary weight rests on the p-value MAGNITUDES (far from
      either threshold), not the pass/fail event, and any future citation
      of this run should say so explicitly rather than citing "Stage 2
      passed" alone.
    - >-
      THE RED TEAM'S STRONGEST NEW FINDING IS ACCEPTED AS THE PRIMARY
      OPEN QUALIFICATION ON THIS DECISION'S SUPPORT CLAIM: K5's mandatory
      nearby-object positive control was validly discharged for the
      reused per-curve Var/permutation computation (relying on
      EXP-MONO-c819ba's own already-reviewed result, correct for that
      specific computation) but was NEVER discharged for the new,
      co-equal Fisher-combined statistic this contract introduced. A
      null-object gate confirms a statistic's SPECIFICITY, never its
      SENSITIVITY. This is why the hypothesis status transition above is
      scoped to the per-curve Holm/permutation reading specifically,
      rather than treated as blanket support from "the instrument passed
      review."
    - >-
      A NAMED, THREE-INSTANCE CROSS-LANE PATTERN IS ACCEPTED AND
      PROMOTED. The Red Team's observation -- that a review-flagged
      coverage or positive-control gap is repeatedly closed by the next
      contract at its stated NUMERIC FLOOR while narrowing its stated
      INTENT (the dual-path sample's two fixed positions; the K5 control
      never extended to the new statistic; an undisclosed partial-
      collision rate) -- is a genuine, distinct design-review discipline
      finding, not an arithmetic one, and is promoted as
      KN-TECH-a810e4.md.
    - >-
      TWO FURTHER DISCLOSED, EMPIRICALLY-INCONSEQUENTIAL FINDINGS ARE
      ACCEPTED WITHOUT CHANGING THIS DECISION'S DISPOSITION: the same
      alpha-inflation defect recurs, unremarked, in Stage 3's own
      exceptional-locus-vs-controlled-null outcome determination
      (Validator RECOMP-8), and Stage 4's residual diagnostics are
      persisted but not individually thresholded against the frozen
      text's own literal instruction (Validator OTHER-FINDING-3). Both
      confirmed inconsequential to the actual observed values.

  next_action: >-
    Close the single remaining open qualification (K5's Fisher-combined
    sensitivity gap) via the Red Team's own named, cheap next step: apply
    the archived `fisher_combined_pvalue` implementation to a
    reconstructed positive-control panel using EXP-MONO-c819ba's own
    already-realized subgroup or coset-union factor-base cell mixed into
    an otherwise-matched null panel of this run's own realized curves,
    and confirm the statistic rejects. This requires no new curve
    construction and no new Executor dispatch of Stage 2/3's full
    20,000-draw machinery -- it is a small, targeted analysis task. If it
    confirms sensitivity, H-MONO-663fb4's status may be revisited toward
    unscoped `supported`; if it does not, this is itself a significant,
    reportable finding about the Fisher-combined statistic's practical
    detection power at this panel size. Secondary, lower-priority items
    for any future K3/K4-adjacent contract: apply KN-TECH-a810e4's
    discipline explicitly (draw extended validation samples via the
    contract's own seeded Drawer across the full declared range, not a
    fixed prefix; report partial as well as full-triple collision rates;
    extend the composite-gate alpha correction to the Stage-3 outcome
    label, not only the Stage-2 gate).

  knowledge_promotion:
    promoted: [KN-TECH-a810e4]
    promotion_note: >-
      New knowledge-technique entry, checked non-duplicative of
      knowledge/techniques/ and knowledge/findings/ via scoped grep
      before drafting. Documents a design-review discipline distinct from
      KN-TECH-7745e6's calibration check and KN-TECH-95a42b's
      floor-vs-threshold arithmetic: a coverage or positive-control
      clause satisfied at its stated numeric floor is not the same as
      satisfying its stated intent, illustrated by three concrete
      instances across this lane's three consecutive experiments.
    not_promoted_reason: null

  procedure_deviations:
    - >-
      None from the review_plan itself: both reviews dispatched
      concurrently, post-snapshot, with disjoint joints (Validator =
      J1-correctness, Red Team = J2-adversarial), both attest
      read_sibling_reports: false (each disclosing they observed the
      other's directory listing only AFTER their own findings/verdict
      were fully drafted), and both were explicitly instructed to blindly
      re-derive the design-time power, panel-independence, and
      alpha-inflation claims from raw data/source before reading the
      Coordinator's or the cited correction's own prose -- both confirm
      having done so, and both surfaced findings the cited correction did
      not disclose, which this Coordinator reads as evidence against
      rubber-stamping.
    - >-
      GOVERNANCE FINDING, CARRIED FORWARD, NOT RE-LITIGATED: the
      thirteenth out-of-band "Cursor Agent" commit (CORR-20260831-d663e0)
      is independently reconfirmed, by both reviewers, to be content-
      correct and empirically inconsequential to this run, with the
      Validator additionally providing an independent timestamp proof
      beyond this session's usual git-commit-graph reasoning. Not adopted
      as an authorized amendment.

  limitations:
    - >-
      This decision does not itself close the Fisher-combined sensitivity
      gap; it names the concrete next step only.
    - >-
      "Supported, scoped" applies to the per-curve Holm/permutation
      reading specifically. Any future citation of this record for the
      Fisher-combined statistic's "no signal" finding must carry the
      sensitivity caveat explicitly.
    - >-
      A "no significant deviation" reading is consistent with, not
      confirmation of, HEUR-CHR-2 -- restated per both reviewers'
      explicit caution against over-reading a clean null as heuristic
      confirmation.
    - >-
      Model-correlation confound: both reviewers this round resolved to
      claude-sonnet-5, matching this Coordinator and the experiment's own
      author. Both reviews explicitly disclose this and argue their
      independent, pre-reading re-derivation -- and their surfacing of
      NEW findings the cited correction did not disclose -- is evidence
      against rubber-stamping rather than for it; this Coordinator
      concurs but notes the confound is not eliminated.
    - >-
      This decision does not reopen or adjudicate EV-MONO-b84b24 or
      EV-MONO-849355; the cross-lane pattern finding is filed as a new,
      forward-looking knowledge entry, not a correction to either prior
      record.

  reviewed_by: [validator-mono-b19c6b, red-team-mono-b19c6b]
  decided_by: coordinator
  decided_at: '2026-08-31'
  inference:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
