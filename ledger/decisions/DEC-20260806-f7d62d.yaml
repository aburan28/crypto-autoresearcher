coordinator_decision:
  id: DEC-20260806-f7d62d
  context: >-
    GOAL-SSIQ-001 BATCH-011 -- the third batch under the extended
    campaign_budget (maximum_batches 8 -> 12, this session, on user
    direction). Executed the highest-ranked resume action from
    DEC-20260806-7839b5: PF-6's own named falsification probe, a
    re-search of delta_E for p=2437 using per-vertex-independent,
    freshly-seeded RNG under a fixed (never-shrinking) per-vertex time
    budget, via a frozen v8 amendment (specification_v8.yaml, after
    THREE pre-freeze review rounds -- this campaign's deepest pre-freeze
    review to date, proportionate to being the first amendment since
    v4.yaml to spend real, non-recoverable delta_E search compute).
    Recorded as EV-SSIQ-69ba8b, on TASK-20260806-ae09c6 ADMIT and
    TASK-20260806-359283 CHALLENGE (narrow).
  decision: support
  decision_note: >-
    support: RUN-SSIQ-a85692-h is genuinely, non-trivially executed
    exactly as the frozen v8 contract requires, independently confirmed
    by the Validator (true C-REPRO via a clean-room re-execution,
    matching every headline number recomputed from raw JSON) and the Red
    Team (execution fidelity clean, no protocol deviation, cost/budget
    honest). The Red Team's CHALLENGE was narrow and entirely about
    evidentiary framing, not execution: the raw artifacts' and this
    Coordinator's own prior snapshot-commit message's "0/203 differences,
    stronger margin than archived" framing overstated what the two
    headline comparisons actually discriminate (EV-SSIQ-69ba8b O-2/O-3).
    The Red Team's correction, independently re-derived and confirmed by
    this Coordinator via direct code read, does not weaken this batch's
    conclusion -- it STRENGTHENS it in kind while narrowing it in scope:
    PF-6's RNG-sharing channel is closed for p=2437 by a scale-bound
    determinism/correctness argument (O-4), the strongest epistemic basis
    this campaign has produced for any of ANOM-1's four primes, licensing
    "genuine structural fact" language for p=2437 alone (O-5).
  target_ids:
    - GOAL-SSIQ-001
    - RQ-SSIQ-9702af
    - EXP-SSIQ-a85692
    - EV-SSIQ-69ba8b
    - TASK-20260806-64562f
    - TASK-20260806-ae09c6
    - TASK-20260806-359283
  evidence_refs:
    - EV-SSIQ-69ba8b
    - EV-SSIQ-a64d92
  rationale:
    - id: D-1
      statement: >-
        THIS CAMPAIGN'S FIRST REAL-COMPUTE-SPENDING AMENDMENT SINCE
        specification_v4.yaml EXECUTED WITHOUT INCIDENT, VALIDATING THE
        THREE-ROUND PRE-FREEZE REVIEW DISCIPLINE THAT PRODUCED IT. The
        frozen contract's own PF-1/PF-9 coverage gate, PF-8's
        graph-identity re-verification, PF-12's permutation-trial
        construction, and PF-13's JSON-safety convention were all
        confirmed, by direct code read and independent re-execution, to
        be implemented exactly as specified -- no crash, no coverage
        shortfall, no wasted compute. The run finished in 278.5s of a
        3600s budget, well within the empirically documented
        infrastructure kill window this lineage's own history required
        guarding against (PF-3).
      confidence: high
    - id: D-2
      statement: >-
        THE RED TEAM'S ADVERSARIAL REVIEW CORRECTLY IDENTIFIED THAT THIS
        RUN'S TWO HEADLINE NUMBERS DO NOT DISCRIMINATE PF-6's CONFOUND
        THE WAY A FIRST READING SUGGESTS -- A CORRECTION THIS COORDINATOR
        INDEPENDENTLY VERIFIED, NOT MERELY ACCEPTED. PART A's "0/203
        differences" is close to the algorithm's guaranteed output at
        this toy scale: find_roots_with_multiplicity's own
        correctness-check (raising before returning if the root count
        does not exactly match the polynomial's squarefree-part degree)
        makes two_sided_search's output a function of the field
        arithmetic alone, not the RNG seed, whenever the search does not
        truncate -- and neither the archived nor this run's search came
        within an order of magnitude of truncating. PART B's "margin
        stronger than v7's archived 23.1pp" is traced to a demonstrated
        base-value insertion-order mismatch between two independently-
        drawn 1000-trial permutation samples, not a strengthened signal.
        Both corrections are adopted verbatim into EV-SSIQ-69ba8b
        (O-2, O-3) rather than left in this decision's prose alone, since
        the underlying run artifacts are immutable and cannot be edited.
      confidence: high
    - id: D-3
      statement: >-
        THE CORRECTED FRAMING IS A STRONGER, NOT WEAKER, BASIS FOR
        CLOSING PF-6's RNG-SHARING CHANNEL FOR p=2437, THOUGH EXPLICITLY
        NARROWER IN SCOPE. A scale-bound determinism argument (does not
        depend on this specific seed's luck, given non-truncation) is
        more defensible than "we ran it once and it matched" -- but it is
        bound to this scale specifically because it requires non-
        truncated search, which is not guaranteed at larger primes or
        crypto scale, where PF-6's mechanism becomes live again. This
        decision therefore licenses restoring DEC-20260806-498531 D-2's
        "genuine structural fact" language for p=2437 ONLY (superseding
        EV-SSIQ-a64d92's narrower "control-confirmed clustering signal of
        undetermined cause" framing for this one prime specifically, not
        for p=3889/5737/7333, which remain at that narrower framing until
        their own probes run). The budget-shrinking half of PF-6 remains
        addressed only by PF-4's disclosure (not independently re-tested
        by this run).
      confidence: high
  limitations:
    - >-
      No claim about H-SSIQ-36e970, a delta_E-gradient's existence, or a
      p^{1/4} algorithm is made anywhere in this decision or its evidence
      record. Lever L4 is NOT retired.
    - >-
      "Genuine structural fact" is restored by this decision for p=2437
      ONLY. p=3889, p=5737, p=7333 remain at EV-SSIQ-a64d92's narrower
      framing pending their own RNG-independence probes.
    - >-
      The determinism argument closing PF-6's RNG-sharing channel is
      SCALE-BOUND (requires non-truncated search) and must not be assumed
      to hold at larger primes without checking per-vertex near-timeout
      data first.
    - >-
      The 25.29pp-vs-23.1pp cross-run margin comparison must never be
      cited as evidence of a strengthened signal; only this run's own
      fresh margin against its own pre-registered threshold supports the
      PERSISTS label.
    - >-
      Toy scale throughout; nothing transfers to cryptographic scale.
      Model independence remains absent and unverifiable. Evidence
      strength stays capped at preliminary campaign-wide.
  next_actions:
    - >-
      RANKED, FOR BATCH-012: (1) [cheapest, most mechanism-targeted, per
      the Red Team's own ranking] a truncation-mutation control -- rerun
      this probe design with PER_VERTEX_BUDGET_SECONDS artificially
      shrunk well below the observed ~1.15-1.70s completion range (e.g.
      0.5s), forcing genuine truncation under the fresh-RNG regime. If
      n_value_differs stays near 0 even under forced truncation, that
      would be a genuinely surprising result the determinism argument
      does not predict; if it rises sharply, that confirms the
      determinism argument's own boundary condition precisely -- this is
      the single most informative and cheapest next control available;
      (2) [alternative/complementary] a second full-budget probe at a
      different BASE_SEED, testing the Front-4 prediction that
      n_value_differs stays at 0 (not luck); (3) [second-ranked, larger
      scope] extend this probe design to the other three primes (3889,
      5737, 7333), but ONLY after checking each prime's own archived
      per-vertex timing data for near-timeout cases first -- the
      determinism argument's scale-boundedness means this cannot be
      assumed to transfer; (4) [unchanged, deferred] the funnel-structure
      mechanism question remains open, informed by whichever of (1)-(3)
      runs next. L4 remains the only lever whose ceiling meets this
      goal's target and still the top priority. Any future amendment
      spending real search compute goes through this lineage's now-
      established three-round-capable pre-freeze discipline, applied in
      proportion to the compute at risk.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Nothing promoted; evidence strength is preliminary (session-only
      independence), below this campaign's replicated/strong bar for
      promotion. A TWELFTH knowledge candidate is now queued
      campaign-wide, distinct from the prior eleven: "when auditing a
      randomized search instrument's output against a confound
      hypothesis, first check whether the instrument's OWN correctness
      invariants (e.g. a verified-output splitter that raises on
      mismatch) make the planned empirical comparison capable of
      discriminating the hypothesis at all, before treating a clean
      empirical match as confirmatory -- the comparison may be
      near-guaranteed to match regardless of which hypothesis is true,
      in which case a structural/correctness argument, not the empirical
      comparison, is what actually carries the finding, and that argument
      must be checked for scale-boundedness before being assumed to
      transfer." All twelve promote together when a genuinely independent
      model becomes available to re-check them.
  decided_by: coordinator
