coordinator_decision:
  id: DEC-20260806-46a8f3
  decided_by: coordinator
  decided_at: '2026-08-06'
  decision: refine
  target_ids:
  - GOAL-HQC-001
  - EXP-HQC-982268
  - H-HQC-18d1b4
  - EV-HQC-db1fd9
  context: BATCH-4b8ad3, the first batch under the user-authorized removal of GOAL-HQC-001's batch cap
    (DEC-20260806-7c2f91), dispatched exactly one thing per the resume plan's blocking item -- a
    planted-correlation control arm for EXP-HQC-982268 meant to close OPEN-6, EV-HQC-b71230's largest
    unresolved confound. TASK-20260806-e19f6c built and ran the arm; TASK-20260806-5a3d0e snapshotted it
    before either review; TASK-20260806-9f4b27 (Validator) and TASK-20260806-21c8da (Red Team) reviewed
    it independently and in parallel. This decision closes the batch on their reports plus EV-HQC-db1fd9.
  rationale:
  - 'THE ARM WORKED AS AN INSTRUMENT CHECK AND FAILED AS A CLOSURE OF OPEN-6, AND THOSE ARE DIFFERENT
    FACTS. All 17 cells MATCHed a closed-form, pre-registered planted value; the Validator independently
    re-derived the planted law before reading reported results and re-executed the full generator with
    separately-written code, reproducing every value bit-for-bit. Both reviews ADMIT the artifacts as
    honest, reproducible, and budget-compliant (72 of 1800 core-seconds used).'
  - 'THE RED TEAM''S INJECTION IS DECISIVE AND OVERRIDES THE CLEAN MATCH, PER THIS BATCH''S OWN
    PRE-DECLARED RULE. Two defect classes this campaign already named against CTRL-IDXMAP -- V1
    (off-by-one truncation) and V3 (last-block-window-read-early) -- are undetectable by this arm WITH
    MATHEMATICAL CERTAINTY, for any T. Homogeneous 128-bit planted blocks under majority-threshold
    reduction give a 64-vote margin no single boundary-bit shift can cross; every recovered log2_Ahat_k
    was bit-identical between the defect-free baseline and both injections, verified over 500,000 trials.
    This is a structural property of the construction, not a power limitation that more compute would
    fix.'
  - 'ROOT CAUSE, NAMED PLAINLY: the arm never invokes stage_a.py''s real decode_blocks (the WHT/Reed-Muller
    decoder). Its reduce step is a from-scratch majority-threshold reimplementation over homogeneous
    blocks -- disclosed in the arm''s own design.md but understated in its comparison_report.md summary,
    which both reviewers flagged independently and which this decision corrects: this arm must never be
    cited downstream as having exercised "the block-partition/index-map path" without that qualifier.'
  - 'THIS IS THE FOURTH CONTROL THIS CAMPAIGN HAS FOUND STRUCTURALLY BLIND TO ITS OWN TARGET DEFECT
    CLASS, after CTRL-BS, CTRL-POSHOM, and CTRL-IDXMAP (EV-HQC-b71230 unresolved_confounds). The pattern
    is now established across four independent instances: an invariance strong enough to force a
    control''s null also blinds it to any defect sharing that invariance. This is itself a candidate
    generalizable finding, held per knowledge_promotion below rather than promoted on a fourth
    single-campaign instance.'
  - 'OPEN-6 THEREFORE REMAINS FULLY OPEN, NOT PARTIALLY CLOSED. EV-HQC-b71230''s PS-R3 measurement
    (-244.1 to -32.4 null SD across 17 cells) still cannot be distinguished from a subtly wrong sampler
    by any evidence this campaign has produced to date. This decision does not reopen, revise, or
    supersede EV-HQC-b71230, which stands exactly as archived; EV-HQC-db1fd9 is a new, independent
    instrument-trust finding alongside it.'
  - THE UNRECONCILED RUN-COUNT DISCREPANCY (2 vs. 3 executions across run_manifest.yaml and
    comparison_report.md, with discarded runs' raw output unpreserved) does not change either verdict --
    both reviewers judged it benign given deterministic seeding -- but it is carried forward as an open
    item rather than silently dropped.
  evidence_refs:
  - EV-HQC-db1fd9
  - EV-HQC-b71230
  - coordination/goals/GOAL-HQC-001/batches/BATCH-4b8ad3/reviews/TASK-20260806-9f4b27/validation_report.yaml
  - coordination/goals/GOAL-HQC-001/batches/BATCH-4b8ad3/reviews/TASK-20260806-21c8da/red_team_report.md
  - coordination/goals/GOAL-HQC-001/batches/BATCH-4b8ad3/tasks/TASK-20260806-e19f6c/design.md
  limitations:
  - NO statement about HQC, its decoding-failure rate, assumption A17 or A5, or any standardized
    parameter set. Claim tier stays toy.
  - H-HQC-18d1b4 UNCHANGED at proposed. This batch ran no measurement of HQC; it ran an instrument check
    on the pipeline that produced EV-HQC-b71230's measurement.
  - experiments/EXP-HQC-982268/specification.yaml is not amended by this decision.
  - None of the four asymptotic-complexity promotion gates is engaged; none is claimed.
  - The V1/V3 blindness finding is scoped to this arm's specific homogeneous-block, majority-threshold
    construction. It does not by itself establish that stage_a.py's real decoder shares the blindness --
    only that this proxy cannot speak to the question in either direction.
  knowledge_promotion:
    promoted: []
    not_warranted: 'The four-instance control-blindness pattern (CTRL-BS, CTRL-POSHOM, CTRL-IDXMAP, and
      now this planted arm) is close to KN-TECH-worthy but is held for one more reason beyond strength:
      three of the four instances are within one campaign on one instrument family, so the generalizable
      claim ("an invariance strong enough to force a null also blinds the control") is not yet shown to
      transfer beyond this specific measurement pipeline. Promote once a V2 arm on a structurally
      different instrument (the real decoder, per next_actions) either repeats or breaks the pattern.
      No KN-FIND: nothing was measured about HQC this batch.'
  next_actions:
  - 'Dispatch a V2 planted-correlation control arm, the Red Team''s named next concrete action: import
    stage_a.py''s actual decode_blocks (the real WHT/Reed-Muller reduction, sha256-pinned, read-only --
    reused exactly as measure.py already is) instead of a hand-rolled majority threshold, and construct
    planted blocks with heterogeneous, decision-boundary-adjacent per-bit content instead of homogeneous
    all-0/all-1 blocks, so a boundary-index defect (V1/V3-class) has a non-zero chance of being expressed
    as a decode error. This is the cheapest control that would actually test what CTRL-IDXMAP and
    CTRL-POSHOM were built to test, on a known-answer instance, through the real decoder.'
  - 'Correct comparison_report.md''s citing language downstream: never describe TASK-20260806-e19f6c''s
    arm as having exercised "the block-partition/index-map path" without noting it substitutes a
    hand-rolled majority-threshold decoder for the real one.'
  - 'Only after a V2 arm closes or narrows OPEN-6 should the remaining resume-plan items from
    DEC-20260806-2947ba be attempted: the missing extrapolation to standardized parameters (or a
    statement of why PS-A''s removal makes it unreachable), PS-R3''s second independent reviewer, and the
    remaining named harness repairs. Attempting them first would still risk interpreting a measurement
    whose sampler integrity is unresolved.'
  - Reconcile the run-count discrepancy (2 vs. 3 executions) the next time this arm's task directory is
    touched, or record explicitly why it is judged immaterial enough to leave open.
