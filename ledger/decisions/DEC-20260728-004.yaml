coordinator_decision:
  id: DEC-20260728-004
  context: >-
    GOAL-SSI-001 BATCH-003 corrected derivation gate for IDEA-20260725-001.
    TASK-20260728-701 produced corrected_derivation_note.md and
    corrected_baseline_recommendation.yaml under verified snapshot 94df4f86.
    Independent red-team TASK-20260728-703 (review-adversarial,
    independent_session: true, resolved_model: glm-5p2) returned SUPPORT with
    zero fatal objections and three nonfatal objections (NF1-NF3). Evidence
    EV-SSI-003.
  decision: support
  target_ids:
    - IDEA-20260725-001
    - GOAL-SSI-001
    - RQ-SSI-001
    - TASK-20260728-701
    - TASK-20260728-703
    - EV-SSI-003
    - KN-TECH-057
  rationale:
    - >-
      The F1 fix is verified correct by independent review: per-processor
      walk-function variation using seeded hash functions h_i(x) = H(i || x)
      mod (l+1) gives genuinely distinct walks, restoring P = p^{1/4} useful
      processors. The VW full-cost exponents are confirmed at p^{1/2}
      (F_{p^2}) and p^{1/4} (F_p conditional on mixing).
    - >-
      All four nonfatal objections from BATCH-002 (N1-N4) are correctly
      reconciled: clock-cycle set by per-processor storage O(1) (N1),
      "recomputed kernels" phrasing (N2), l specified as small fixed prime
      (N3), mixing-time assumption noted (N4).
    - >-
      The MITM full-cost exponent p^{2/3} (F_{p^2}) and Delfs-Galbraith
      full-cost p^{1/3} (F_p) are confirmed correct (unchanged from
      BATCH-002). The complete matched-baseline package is coherent.
    - >-
      The matched-baseline recommendation is decision-relevant: under full
      cost, VW (not MITM/DG) is the honest classical baseline. Future
      candidates must beat VW full cost p^{1/2} (F_{p^2}) or p^{1/4}
      (F_p conditional on mixing), not the easier MITM p^{2/3} or DG p^{1/3}.
      This raises the bar for novelty screening.
    - >-
      This is a matched-baseline correction, not a cryptanalytic mechanism
      toward GOAL-SSI-001 completion criteria. It does not claim a sub-p^{1/4}
      break. It does not close KN-OPEN-013, KN-OPEN-014, or KN-OPEN-015.
    - >-
      Independence was achieved: the red-team review ran in a separate session
      (independent_session: true) with a different model lineage than the
      producer. This is the second consecutive batch with achieved independence.
    - >-
      Nonfatal NF2 (birthday bound on Ramanujan graph is heuristic, not direct
      Wiener group-theorem transfer) is recorded and noted in the KN-TECH entry.
      It does not block promotion because the heuristic is standard in
      collision-search analysis on expander graphs and the Ramanujan property
      provides the mixing guarantee.
  evidence_refs:
    - EV-SSI-003
    - coordination/goals/GOAL-SSI-001/batches/BATCH-003/tasks/TASK-20260728-701/corrected_derivation_note.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-003/tasks/TASK-20260728-701/corrected_baseline_recommendation.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-003/tasks/TASK-20260728-703/review_report.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-003/tasks/TASK-20260728-703/falsification_check.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-003/archives/TASK-20260728-702/snapshot-receipt.json
  limitations:
    - The F_p VW variant is conditional on unproven F_p subgraph mixing.
    - Birthday bound on Ramanujan graph is heuristic (NF2), not direct Wiener group-theorem transfer.
    - Full-cost constants from KN-LIT-094 are asymptotic with unextracted o(1) terms.
    - No isogeny or curve computation was performed; this is a derivation only.
    - This is not a sub-p^{1/4} break or a cryptanalytic mechanism toward completion criteria.
  next_actions:
    - >-
      Screen orientation, CSIDH-quantum, and SQIsign-transcript lanes as
      separate candidate mechanisms for BATCH-004. The matched-baseline package
      (KN-TECH-057) now provides the honest full-cost baselines against which
      any new candidate must be measured. The cheapest next direction from the
      BATCH-001 baseline map is a scoped orientation / known-endomorphism
      advantage against KN-OPEN-013 — but only if a typed mechanism is stated,
      not a slogan. Do not count the baseline-correction lane toward completion
      criteria.
  hypothesis_status_record:
    IDEA-20260725-001: supported_as_baseline_correction
    note: >-
      The candidate is supported as a matched-baseline correction, not as a
      cryptanalytic mechanism. It raises the bar for novelty screening but does
      not attack a surviving hardness assumption. No H-SSI-* hypothesis file
      is created; the candidate is closed at the idea stage with a knowledge
      promotion.
  knowledge_promotion:
    promoted: [KN-TECH-057]
    rationale: >-
      Full-cost matched-baseline package for classical supersingular
      path-finding: MITM p^{2/3} (F_{p^2}), Delfs-Galbraith p^{1/3} (F_p),
      VW distinguished-point collision search p^{1/2} (F_{p^2}) / p^{1/4}
      (F_p conditional on mixing). VW analogue defined with seeded hash
      walk functions, distinguished predicate, and collision-to-path
      reconstruction with recomputed kernels. Fills the gap in KN-TECH-029
      which records step-count exponents only. Not an attack; a baseline
      correction that raises the novelty bar.
    not_warranted: null
  decided_by: coordinator
  decided_at: '2026-07-28'