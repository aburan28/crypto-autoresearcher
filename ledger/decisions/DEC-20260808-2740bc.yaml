  rationale:
    repaired_cost_model: >-
      The candidate now names raw work, storage, wiring-aware full cost, and
      correct rho/BSGS crossovers separately. These calculations and concrete
      rows recompute but remain conditional on unmeasured Boolean success.
    execution_authorization:
      granted: false
      reason: >-
        The statistical estimand is not bound to marginal p_N, the controls do
        not yet falsify polynomial match clustering or calibrate coverage, the
        isomorphism apparatus gate occurs too late, and hard operation and byte
        caps omit declared work and exceed the artifact budget.
    probability_and_statistics_obligation: >-
      Freeze the random-effect distribution, marginalization, bootstrap
      statistic, exposure and offset formulas, proportional-hazard premise,
      kappa_N and p_N/E[X] power, and repeated-fixture interval coverage.
    control_and_budget_obligation: >-
      Add the matched-mean Boolean-bridge clustering fixture, move isomorphism
      correctness fixtures before treatment, include all self-reduction and
      transform costs, state planted-map reuse, and choose a lossless artifact
      representation within an honest cap.
  proposal_disposition:
    status: proposed
    action: preserve_pending_versioned_revision
    novelty_status: unverified
    dominated_by: >-
      No measured gamma_s exists. Under the fully charged conditional model,
      rho dominates unless gamma_s>5/18; no Pareto improvement is established.
  cheapest_falsification_control: >-
    First specify, but do not yet execute, the matched-mean Boolean-bridge
    clustering fixture: identical expected match exponents, planted
    kappa_N=N^delta, and Boolean success reduced by N^-delta. It is the cheapest
    complete test that the proposed inference distinguishes multiplicity from
    usable root success.
  next_actions:
    - >-
      Author a versioned replacement proposal freezing the marginal estimator,
      clustering and repeated-coverage controls, pre-treatment isomorphism gate,
      and exact operation, memory, and artifact-byte accounting.
    - >-
      Snapshot that replacement and obtain a new independent
      review-adversarial verdict before any experiment contract or approval.
  restart_condition: >-
    A new non-overlapping batch may reopen this successor only when both next
    actions are satisfied. User direction to continue authorizes repair work;
    it does not waive the mathematical, cost, or evidence gates.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is design-review evidence with no experiment, theorem, or validated
