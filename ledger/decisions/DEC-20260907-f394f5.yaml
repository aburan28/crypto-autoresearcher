coordinator_decision:
  id: DEC-20260907-f394f5
  id_allocation_provenance: >-
    Minted with python3 tools/allocate_id.py --next coordinator_decision
    --date 20260907 and confirmed free with --check before authoring.
  recorded_at: '2026-09-07'
  goal_id: GOAL-ECDLP-bbc21f
  question_id: RQ-ECDLP-78dbc5
  batch_id: BATCH-1e7251
  decision: open_batch
  also: approve_protocol_amendment
  decision_rationale_for_verb: >
    Opens BATCH-1e7251 to EXECUTE the EXP-ECDLP-869870 successor cell that
    DEC-20260906-1f5b71 licensed, DEC-20260906-bcc097 carried as RANK 3,
    and DEC-20260907-9b1b02 carried as RANK 4: a re-keyed 2^24 fixture
    (>= 8 keys per instrument; murmur3_fmix64 and splitmix64). Approves
    the versioned protocol amendment
    experiments/EXP-ECDLP-869870/amendments/v2_rekeyed_fixture.yaml
    (PA-ECDLP-869870-v1-to-v2). The v1 specification.yaml is UNEDITED;
    v1 runs RUN-001..024 are never re-scored. This is disjoint from the
    DEC-20260907-9b1b02 RANK 1 amendment on EXP-ECDLP-6ac801 and from
    RANK 2 (online RESEL-L), both of which other sessions are entitled
    to take; this lane takes the still-open 869870 successor only.
    Existing user authorization of EXP-ECDLP-869870 (DEC-20260906-2b1387,
    "Approve both as frozen") plus the committed Coordinator commission
    of this exact successor cell satisfies the design-experiment
    confirmation gate for the amendment. No hypothesis status changes.
  target_ids:
    - BATCH-1e7251
    - GOAL-ECDLP-bbc21f
    - EXP-ECDLP-869870
    - H-ECDLP-3550b8
    - TASK-20260907-fe3512
    - DEC-20260906-1f5b71
    - DEC-20260907-9b1b02
    - EV-ECDLP-855daf
    - DEC-20260907-ece434
  amendment_approved:
    path: experiments/EXP-ECDLP-869870/amendments/v2_rekeyed_fixture.yaml
    id: PA-ECDLP-869870-v1-to-v2
    execution_authorized: true
    v1_specification_edited: false
  review_plan:
    claim_under_review: >
      The executor's v2 run records: whether each mixer (splitmix64,
      murmur3_fmix64) with 8 keys at N = 2^24 meets or misses
      fixture_gate_v2 EXACTLY as the amendment states, and whether v1
      bytes were left untouched. This round does not promote
      H-ECDLP-3550b8 and does not score V2-V5 / M1-M5.
    coordinator_prior: >
      Recorded BEFORE any reviewer runs. Expected: splitmix64 8-key mean
      scaled cost near the validator's 5-key 1.7323 (inside 0.10 of 1.79
      raw); murmur3 8-key mean near the validator's sealed 1.6814 (raw
      FAIL of the 0.10 band by ~0.009). The O(theta) correction, if
      instantiable from the v1 (B4) note, may move murmur3 inside the
      band -- I do not pre-judge that. Seeds 1-5 splitmix64 should match
      v1 receipts bit-for-bit on the shared (N, a, cap, rule) fields;
      disagreement is IV-determinism. Where a failure would hide: (i)
      silently substituting the validator's sealed numbers for an
      executor-owned re-run; (ii) pooling both mixers into one gate;
      (iii) editing v1 source or re-scoring RUN-001..024.
    joints:
      - joint: J1 run-record integrity, key count, mixer separation, no v1 rewrite
        assigned_to: TASK-20260907-b8f8a9 (validator)
        attack_plan: >
          Re-parse every v2 run manifest. Confirm 8 seeds x 2 mixers, no
          missing/duplicate seed, walk-projection label present, cycle_mass
          and capped-mass reported. Confirm v1 specification.yaml and
          source/ hashes match origin/main. Confirm no v1 run directory
          was rewritten (mtime/hash vs HEAD at batch open).
      - joint: J2 blind re-derivation of one mixer's 2^24 scaled-cost mean
        assigned_to: TASK-20260907-b8f8a9 (validator)
        attack_plan: >
          Re-derive the scaled-cost mean for murmur3_fmix64 (8 keys) at
          N = 2^24, a = 1/4, T = 256 from the amendment's statement of
          the quantity and the mixer definition, WITHOUT reading
          source_v2/ or the executor's report bodies (blind_from those
          paths). Compare to the executor's raw-result after sealing.
      - joint: J3 scope, O(theta) honesty, fixture-gate bookkeeping
        assigned_to: TASK-20260907-9f3c12 (red-team)
        attack_plan: >
          Attack any language that scores V2-V5 / M1-M5 or moves
          H-ECDLP-3550b8. Check raw vs corrected residuals are both
          present and not collapsed. Check the two mixers were not
          pooled into one pass/fail.
      - joint: J4 proves-too-much
        assigned_to: TASK-20260907-9f3c12 (red-team)
        attack_plan: >
          A permutation of the walk (or a mixer that is the identity)
          must NOT pass fixture_gate_v2. If the pipeline reports a
          1.79-band hit for a known-unstructured walk, the argument
          proves too much and the round fails regardless of the real
          mixers' residuals.
    blindness:
      within_round: >
        Validator (b8f8a9) and red-team (9f3c12) may not read each
        other's reports. Both read the snapshot commit of the executor
        artifacts. The Coordinator composes joint-level verdicts.
      lifted_for: []
    proves_too_much:
      failure_signature: >-
        fixture_gate_v2 PASSES for an identity or permutation walk.
      objects:
        - A walk f(x) = x + 1 (mod N), same DP predicate: must miss 1.79.
    blind_rederivation:
      blind_from:
        - experiments/EXP-ECDLP-869870/source_v2/
        - the executor's execution-report-v2.yaml and run report bodies
      what: >
        murmur3_fmix64 8-key mean scaled cost at N = 2^24, a = 1/4, T = 256.
    procedure_deviations: []
  evidence_refs:
    - experiments/EXP-ECDLP-869870/specification.yaml
    - experiments/EXP-ECDLP-869870/amendments/v2_rekeyed_fixture.yaml
    - ledger/decisions/DEC-20260906-1f5b71.yaml
    - ledger/decisions/DEC-20260907-9b1b02.yaml
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-7ec3ea/validation_report.yaml
  knowledge_promotion:
    promoted: []
    not_warranted: Opening a successor cell promotes nothing.
