    envelope-receipt.json (designated covering manifest, SC-3, 34-entry
    artifact_provenance, R5 verbatim, budget block), execution-report.md,
    and measure_envelope.c (session-1 artifact, verified present with its
    comment-block inference stanza).
  measured_content_completed: >-
    The receipt resolves the named C-toolchain contradiction BY MEASUREMENT
    and resolves it AGAINST BOTH committed records as written: /usr/bin/gcc
    exists but reports Apple clang 17.0.0 arm64 (not gcc 13.3.0, not x86-64);
    -maes does NOT compile (exact clang error recorded); pycryptodome is
    measured ABSENT; numpy IS importable (2.4.4). Valid measured throughput:
    pure-Python AES-128 fresh-key median 11061.1924 evaluations/s/core
    (reps 10804.85/11061.19/11236.65), KAT-verified 4/4 against the openssl
    CLI before timing; amortised fixed-key median 13379.81/s/core. The arm64
    accelerated benchmark numbers are classified invalid_measurement — all
    four program versions FAIL the FIPS-197 known-answer selftest and
    disagree 8/8 with the openssl CLI — and are preserved but explicitly
    BARRED from budgeting use. Derived ceilings rest on the valid Python
    figure only, with the linear-scaling assumption stated in the field
    itself. The receipt names requires_rerun for the accelerated path,
    scoped to a successor task (correct intrinsics code or an x86-64 host);
    that is OPEN work, not a negative result.
  decision: approve
  semantic_disposition: PRODUCER_COMPLETED_DELIVERABLES_ARCHIVED_INVALID_MEASUREMENTS_BARRED
  target_ids:
    - GOAL-AES-002
    - BATCH-2b0fd1
