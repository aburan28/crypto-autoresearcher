coordinator_decision:
  id: DEC-20260908-afe5b9
  decision: approve
  decided_by: coordinator
  decided_at: '2026-09-08'
  target_ids:
  - EXP-ECDLP-651b94
  - TASK-20260908-4cacf0
  - TASK-20260908-5abf3c
  context: Repair six independently reproduced S4 source/admission/custody defects without altering the frozen spectral
    experiment.
  rationale:
  - Accept the archived review of59bound inputs and79fixed cases:54passes,25conformance failures,zero scientific
    runs. The six finding groups remain exact source defects,not mathematical evidence.
  - Repair the existing ranked runner before adding another unimplemented proposal. Its scientific estimator,RNG
    and decision controls passed the reviewed fixed boundaries and remain unchanged.
  - A resource guard that writes millions of full event histories cannot be treated as harmless instrumentation.
    Explicit bounded linear progress custody and truthful sampled-memory/timing scopes are implementation prerequisites.
  - Standing authorization approves this complete source repair and bounded regressions. Failed host RLIMIT_AS installation
    is disclosed and remains separate from future Linux guard verification.
  accepted_findings:
  - id: A8240D-01
    title: Review admission rejects the standard attestation and accepts non-governed task, claim and plan shapes
    required_correction: Validate the exact dispatch queue and full nested handoff/claim schemas; bind every handoff
      source_binding to source_reads and sources_read; validate the complete review plan; and require standard attestation
      verdict holds alongside top-level PASS/passed semantics.
  - id: A8240D-02
    title: Completed-release output custody and lifecycle ordering are not enforced
    required_correction: Require review_plan_commit to precede claim_commit, claim_commit to precede release_commit,
      release_commit to precede archive_commit, and the completed release artifact_sha256 mapping to equal the declared
      output set and the archive's exact hashes. Keep the archive receipt separate from reviewer outputs.
  - id: A8240D-03
    title: Successful diagnostic rows are duplicated and boundary RSS samples are mislabeled as peaks
    required_correction: Rename endpoint values to start/end and boundary_sample_max, or install a real sampler
      and state its cadence. Track a measured process-group peak only from those samples. Serialize completed diagnostics
      from one canonical source; reserve partial rows for interrupted diagnostics only.
  - id: A8240D-04
    title: Artifact construction and publication remain outside complete typed resource and timing custody
    required_correction: Keep the timing bracket open through publication; chunk large serialization, writes and
      hash verification with progress-before-guard checkpoints; wrap construction and publication in the same typed
      outcome/custody state machine; preserve the progress tree until a durable final or typed incomplete package
      exists; and retain CancellationStop/ResourceStop classifications.
  - id: A8240D-05
    title: Dense-loop progress custody is quadratic, misclassified and too large for the declared protocol
    required_correction: Separate certificates from progress, use an append-only event log plus one atomically replaced
      compact latest checkpoint, use truthful in-progress event names, and choose a bounded checkpoint cadence whose
      full-panel event count and storage are explicitly calculated under the machine cap.
  - id: A8240D-06
    title: Frozen immediate-stop semantics still defer known relabel and occupancy failures
    required_correction: Compute and retain occupancy immediately after the seven assignments and stop before relabel
      on failure. Retain and inspect relabel immediately after it returns and stop before subsequent controls. Preserve
      the partial invalid-cell reason and diagnostic row in both cases.
  approved_correction_boundaries:
  - Copy exactly the six-file TASK-20260908-a58827 package archived at44a9e000bb8a4a8e77eff58817f44726b62ba72e.
    Preserve all frozen scientific fixtures,seeds,counts,RNG,algorithms,cost reductions,thresholds andcontrols;
    preserve every passing V/S2/S3 behavior.
  - Admission accepts standard review_attestation.verdict holds together with the required top-level pass semantics.
    Validate the full governed dispatch queue,nested handoff,write-once claim/release and precommitted review plan
    against the pinned governing schemas,including every source binding and source-read entry. A reduced handwritten
    subset or implementation-specific pass attestation is insufficient. Canonical verifier reuse must itself be
    source-pinned and must not execute untrusted commands or mutate queues.
  - Require source snapshot and review-plan authority before claim,claim before completed release,release before
    archive,and archive before completed external authority/executing descendant. Use actual Git ancestry including
    equality only where semantically legitimate. The release artifact_sha256 must equal every declared reviewer
    output and its archived hash; separate the Coordinator snapshot receipt. Positive fixed fixtures must start
    queued with full real schemas then evolve through claim,release and archive.
  - Report RSS start/end/boundary-sample maximum by those names. A final sample is not a peak. If sampled maxima
    are reported,retain sample scope/cadence and distinguish process-wide kernel maximum from any diagnostic. Each
    successful coordinate/null diagnostic has one canonical serialized row; only interrupted diagnostics appear
    in the partial stream.
  - Keep cancellation handlers,typed exception handling,resource guards and total/report meters active through artifact
    construction and durable payload publication. Stream/chunk serialization,hashing,writes andverification with
    bounded chunks no larger than64KiB and guarded checkpoints; avoid a whole-artifact memory copy or an unguarded
    monolithic serializer. Preserve typed CancellationStop andResourceStop plus custody details instead of converting
    them to InfrastructureStop.
  - 'Final timing is causally scoped: retain total/report timing through durable payload publication in a separate
    operational completion receipt after that boundary. It may live in the existing retained progress/custody tree,which
    is then a declared required operational artifact in the execution plan. Explicitly state that writing/fsyncing
    this terminal receipt is outside its measured end boundary; never assert self-inclusive timing or self-hashes.
    Keep payload manifest timing labeled by its earlier observed boundary and refer to the final receipt for complete
    payload duration. No new scientific output or sample. Exact operational paths and hash/custody rules must be
    fully specified before sealing source and independently reviewed before a future lock.'
  - Construction/publication failure must retain a typed incomplete package or original progress tree. Do not remove
    the only progress tree before a durable final payload plus required terminal custody exists. Filesystem retention
    errors remain explicit; preserve the original stop classification alongside any secondary infrastructure failure.
  - Separate progress records from scalar certificates. Use append-only bounded-size events plus one atomically
    replaced compact latest checkpoint,not an in-memory all-history list or whole-history rewrite. Keep correct
    phase/in-progress/completed names. Guard scheduling may throttle resource polling using a monotonic interval
    at most250ms between eligible polling opportunities and must retain explicit forced phase/terminal polls; signal
    flags are checked at every existing bounded guard opportunity. Persist current coordinates before each actual
    resource probe. The logical number of arithmetic/RNG operations is unchanged.
  - 'Bound progress storage explicitly: event records at most1024bytes,append log at most256MiB plus at most64KiB
    compact latest checkpoint; stop with retained typed ResourceStop before exceeding the cap. Do not drop scientific
    certificates or retrospectively thin observations to meet this operational cap. Record counters for guard requests,actual
    polls,events andbytes. Derive a full-panel upper-bound or safe-cap argument using frozen r<=509 and192cells,show
    linear rather than quadratic serialization, and disclose that wall cadence is a sampling policy rather than
    a real-time scheduling guarantee.'
  - Reduce and retain occupancy immediately after the seven shuffle assignments,then stop on failure before relabel.
    Retain/check relabel immediately on return and stop before constant-O,mutated verifier orCayley work. Preserve
    failed scalar certificate retention and the original named invalid-cell reason. Known-false control outcomes
    retain their existing intended interpretation.
  - Only lower-level fixed synthetic/mock and temporary synthetic-Git fixtures are allowed. Never invoke a scientific
    or prospective pipeline entrypoint,even with mocked admission. Seal exactly the six outputs; temporary tests
    remain in an owned temporary directory and are cleaned. No actual runtime completion receipt,launch lock,signing
    key orRUN may be created in this zero-run source task.
