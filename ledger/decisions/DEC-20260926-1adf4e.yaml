  rationale:
    - >-
      WHY A FULL ROUND. The primary counts are exact per draw and sit at a
      floor or ceiling, so agreement between the run and its own aggregation
      says little. The run's certificates are verified by same-author code,
      and the engine's author is the session that dispatches the review. The
      checks that can see a wrong-but-self-consistent implementation are the
      author-independent verifier (J1) and the blind re-derivation with a full
      stream replay (J7); both are load-bearing here.
    - >-
      WHY THE RED TEAM IS AIMED AT THE NULL. The frozen primary observable is
      at the W_4 ceiling in both the S_3 reference and N-CONV, and U62 was
      selected on S_3's M_4 failure. Whether randomizing the lower part
      changes the problem class, so that M_4 refutation is expected, decides
      what "S_3's lower part is not needed" can mean. That is J9, with a
      counting derivation, a selection attack, O3 as its proves-too-much
      check, and O4 as a nearby object for the polynomial-basis dependence.
    - >-
      JOINT DESIGN. Admissibility: J1 (verifier), J2, J3, J4 (validator), J8
      (comparator). Recomputation: J5, J6 (validator). Reading: J9-J12 (red
      team). The blind re-derivation J7 is a separate session with the widest
      blind_from. Each joint has exactly one owner. The verifier and the
      re-deriver are separate sessions because the verifier must read the
      claimed certificates and the re-deriver must not.
    - >-
      TIER. Review-adversarial with the plan's tripwire. Nothing here closes a
      lane; E-LINEAR is a competing reading inside C-T, not a hypothesis
      record, so no reject_scoped is in view.
    - >-
      TARGET-PROFILE HONESTY. Toy tier, sota_delta zero, oracle A and parallel
      rho dominate. The round is sized to the decisions it feeds (KN-OPEN-3c8f51
      item (A) at this cell, the n = 19 control of NC-DR-7, and the CERTBIN
      rerank), not to any cost claim.
    - >-
      CONCURRENCY (machine protection). Reviewers are capped at 3 GB each. If
      another CERTBIN executor is running on the 4-core, 15 GB machine, run at
      most two of the four first-wave reviewers at once, in the order of NA-2.
      Idle capacity does not justify extra work.

