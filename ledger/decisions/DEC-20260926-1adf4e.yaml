        - >-
          Dev 4 (archived-arm T5 predictions written after their W_4 was
          computed): those W_4 values were already archived by RC-1 and its
          red team. LIMIT: the predictive character of C-T4's T5 clause is
          claimed for fresh systems only; J4 confirms the hash order in
          phase-log.jsonl.
        - >-
          Dev 7 (development dry run on offset seeds, previewing dev-seed
          outcomes): no seed, threshold, rule or arm could move, and the
          frozen streams are replayed in full by J7. LIMIT: the dry run's
          outputs and the file-mtime claim are not archived and are
          unauditable from archived bytes; mitigated by J2 and J7, not
          eliminated. Archiving the scratch outputs now would widen a write
          scope after the fact.
        - >-
          Dev 9 (C-VERIFIER type (c) declared vacuous for two M_4 kinds):
          WEAKENS C-VERIFIER, which is why J1 builds its own negative controls
          for every (closure, arm, format) kind, including degree violations.
        - >-
          CRYPTO_AR_GF2_THREADS = 2 (specification default 3, "lower if the
          machine is shared more heavily; record it"): permitted and recorded.
          C-DET (c) covers thread-count invariance; J4 checks it ran.
        - Devs 2, 5, 6, 8, 10, 11 and 12 do not limit any joint; J4 confirms each is as stated.
    - id: R-3
      concerns: Whether the observations of implementation.md "Unexpected observations" are joints.
      ruling: >-
        THEY ARE, and none is folded into a scope reading. (A) The closure
        level at which the N-CONV unsatisfiable systems are refuted, against
        the level S_3 needs at the same targets (bullet 1): J9, the right-null
        joint, with the selection, saturation and ceiling attacks of the plan.
        (B) The N-ELL144 satisfiable controls whose W_4 codimension exceeds s
        (bullet 5): J10 O1 (soundness needs only codim >= s; the red team says
        what the inequality can still detect). (C) N-CONV17's and N-CONVL's
        split between M_4 and W_4 refutations (bullets 3 and 4): J11, the
        ladder reading.
      basis: >-
        (A) is where the frozen primary cannot look: with both arms at the W_4
        ceiling the primary observable collides for systems refuted at W^(0)
        and at W^(1) (review plan proof_search_map). U62 was selected on S_3's
        M_4 failure, while N-CONV draws are unconditional; a joint with a
        worked selection and counting attack can break the reading, a scope
        paragraph cannot. Neither (A), (B) nor (C) is evidence yet; all are
        preserved as recorded (agents/coordinator.md prohibitions).
    - id: R-4
      concerns: Authorship and the independence rule for this round.
      ruling: >-
        The engine src/crypto_autoresearcher/gf2/ was written by the top-level
        dispatching session; impl/ and verifier/ were written by the executor
        in one session. Therefore: (1) the certificate verifier
        TASK-20260926-f0e5a4 is written from the specification's
        certificate_format and E_layout text only; it may not read, import or
        copy impl/, verifier/, any module of src/crypto_autoresearcher/,
        tools/gf2_replay_rc1.py or tests/test_gf2_kernels.py, and it evaluates
        over GF(2) with its own code; (2) the blind re-deriver
        TASK-20260926-83cebf has all of those in its blind_from; (3)
        TASK-20260926-9c0134 scans both code/ directories for imports of
        crypto_autoresearcher, of any impl/ or verifier/ module, and for
        sys.path insertions pointing at src/ or impl/, and a hit blocks the
        comparator; (4) the validator and the red team MAY read and run the
        pinned engine, because they own no independence joint; the red team
        runs it UNCHANGED. Every reviewer is a fresh subagent whose dispatch
        prompt is only its card path, so the engine author's session context
        does not reach it (review plan PD-R3).
    - id: R-5
      concerns: Blind scope and outcome hygiene.
      ruling: >-
        The blind pool is fixed by the plan's outcome-independent rule
        (P-A..P-G), and the re-deriver also replays the whole N-CONV stream and
        computes M_4 on all 144 replayed unsatisfiable N-CONV systems (plan
        PD-R2). Protected literals are derived mechanically by the extraction
        script and only their digests are written (plan PD-R4).
      false_positive_rule_a_blind_history: >-
        PRE-AUTHORIZED, mechanical. A --blind-history match of a protected
        digest is a FALSE POSITIVE, and cannot carry an outcome of
        RUN-CERTBIN-6ebb0e, iff EVERY matching commit either (a) is an ancestor
        of 2b58093c36cac3277af23ca8fe8b1f2a1d4e57e2 (git merge-base
        --is-ancestor), the HEAD at every executor invocation, so it predates
        every output of the run; or (b) touches no path whose name contains
        "CERTBIN" or "certbin" (git show --name-only). The archive then removes
        that item from protected_sha256, records it under
        blind_phase_hygiene.removed as {label, commits, by:
        "DEC-20260926-1adf4e R-5"} (never the value or its digest), re-runs the
        check, and proceeds. Any other match is a STOP: TASK-20260926-83cebf
        does not run on that history until the Coordinator decides.
      benign_rule_b_opening_texts: >-
        PRE-AUTHORIZED. A V6 match (a protected token occurring in an opening
        text written by this Coordinator) is BENIGN iff every occurrence of the
        matched token in every opening text is (i) a pool size, slot index or
        slot range, (ii) a seed, budget, point count, or fixture or
        combinatorial constant stated as such, or (iii) a digit run inside a
        hex digest, a commit sha or an identifier. The non-blind dispatching
        session inspects with --v6-show (terminal only; never recorded),
        records "V6 benign" per file with the item label only, and re-runs the
        script with --v6-accepted "DEC-20260926-1adf4e R-5 (b)". The item stays
        protected. Any other V6 match is a STOP for the Coordinator.
