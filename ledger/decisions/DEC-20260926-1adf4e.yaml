    - id: R-2
      concerns: The twelve deviations and readings of implementation.md, and the thread count.
      ruling: NONE VOIDS THE RUN. Each is owned by a joint and limits it as stated.
      basis_and_limits:
        - >-
          Dev 1 (fresh keys "<ARM>:<slot>:<role>"): a key-format reading made
          before data (trial-plan reading R1). J1 and J8 map keys by it.
        - >-
          Dev 3 (one certificate line per (system, closure, format)): the
