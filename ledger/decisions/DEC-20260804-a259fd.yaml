coordinator_decision:
  id: DEC-20260804-a259fd
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-113
  recorded_by_task: TASK-20260804-169
  archived_by: TASK-20260804-170
  context: >-
    BATCH-113: m=3 BKK speedup = 2.29x (vs m=2: 1.72x). General formula 2^{m-1} × gamma_m.
    Speedup GROWS with m.

  decision: advance_growing_speedup_analysis
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    The BKK speedup is STRONGER at larger m:
    - m=2: speedup 1.72x
    - m=3: speedup 2.29x
    - General: 2^{m-1} × gamma_m

    For OPTIMAL m in Semaev (m_opt = O(sqrt(log N / log log N))): the speedup factor
    is 2^{m_opt-1} × gamma_{m_opt}. If gamma_m stays bounded away from 0 as m grows,
    the total speedup could be SUBSTANTIAL (potentially superpolynomial in log N).

    KEY QUESTION: How does gamma_m scale with m? If gamma_m decreases as C^m for some
    0 < C < 1: the net speedup is (2C)^{m_opt-1} which might still be large.

    GOAL-ECDLP-001 stays active.

  exact_next_action: >-
    BATCH-114: Measure gamma_m for m=4,5 in the saturated regime to determine the scaling
    of gamma_m with m. This determines whether the BKK speedup factor 2^{m-1} × gamma_m
    is growing or decaying in the optimal m regime.

  knowledge_promotion:
    promoted: []
    not_warranted: m=3 measurement only. Need more m values to confirm trend.

  pareto_integrity:
    dominated_by: Standard Semaev
    sota_delta: {time_exponent: not_applicable, note: Growing m-dependent constant speedup.}
  claim_ceiling: toy
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-04'
