    - >-
      RANK 2: Stage 3 of EXP-ECDLP-612fb1 and Stages 3-4 of EXP-ECDLP-869870
      (the 2^30 sampled arm and the certified curve arms) in a later batch
      under the same frozen contracts if the first batch exhausts its
      budget before reaching them.
    - >-
      RANK 3: /design-experiment on IDEA-20260906-a3d6ae (the
      growth-with-relations comparator EXP-ECDLP-612fb1 cites as its
