    - >-
      Then the Validator TASK-20260906-7ec3ea (blind re-derivation of the
      1.79 fixture, C_max(1/4) and the exact top-T share at 2^24 from the
      statement of the quantities) and the Red Team TASK-20260906-90e7cf
