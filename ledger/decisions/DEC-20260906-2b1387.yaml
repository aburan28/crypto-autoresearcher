  recorded_at: '2026-09-06'
  goal_id: GOAL-ECDLP-bbc21f
  question_id: RQ-ECDLP-78dbc5
  batch_id: BATCH-9c5410
  context: >-
    First batch of GOAL-ECDLP-bbc21f (RQ-ECDLP-78dbc5): an approval gate
    with zero execution. Two frozen contracts were designed at version 1
    and committed at status review_required with approved_by null:
    EXP-ECDLP-612fb1 (H-ECDLP-37dc01, the batch-reselected fixed-size
    table, derived from IDEA-20260906-ee3543) and EXP-ECDLP-869870
    (H-ECDLP-3550b8, the basin-partition coverage instrument, derived from
    IDEA-20260906-aed829). Per design-experiment skill step 4 and the
    GOAL-ECRANK-002 precedent (DEC-20260905-2d466e, BATCH-832f3d), neither
    could be executed until the user confirmed and a committed Coordinator
    decision marked it approved. The orchestrating session put the question
    on 2026-09-06 after the campaign-opening commit 28a63c4d5 was pushed;
    TASK-20260906-67f1ab then wrote the approval package (gate fields on
    both specifications, executor handoffs TASK-20260906-3623b9 and
    TASK-20260906-d17254, approval-note.md); this decision, authored by the
    ledger archive TASK-20260906-2d30dd, records the answer and binds the
    package. No run exists under either contract.
  decision: approve_experiment
  decision_rationale_for_verb: >-
    Marks BOTH frozen contracts EXP-ECDLP-612fb1 and EXP-ECDLP-869870
    APPROVED (status approved, approved_by coordinator, frozen true,
    execution_authorized true; version 1) and binds the executor handoffs
    TASK-20260906-3623b9 and TASK-20260906-d17254, discharging the goal
    head's RANK 1 approval gate. The gate's user-confirmation requirement
    (design-experiment skill step 4) is met: the two contracts were
    presented to the user with their success and falsification criteria,
    controls, budgets and constant-factor scope, and the user selected
    "Approve both as frozen (Recommended)" from four options, then
    re-affirmed in chat with the single word "Approved". The answer is
    unambiguous and maps to branch A (approve) for each contract, so the
    verb is approve_experiment for both and no `revise` branch is recorded.
    This decision authorizes execution and nothing else: it changes no
    hypothesis status, promotes no finding, and produces no evidence.
    Execution runs in the subsequent batch under the frozen contracts,
    starting from this decision committed on main; the Executor records
    observations only; the results are claim-relevant and meet the
    reserved independent Validator and Red Team tasks before any evidence
    record is written.
  target_ids:
    - EXP-ECDLP-612fb1
    - EXP-ECDLP-869870
    - H-ECDLP-37dc01
    - H-ECDLP-3550b8
    - TASK-20260906-3623b9
    - TASK-20260906-d17254
    - BATCH-9c5410
    - GOAL-ECDLP-bbc21f
  user_confirmation_record:
    obtained_at: '2026-09-06'
    obtained_via: >-
      interactive approval gate in the orchestrating session (question
      tool), after the campaign-opening commit 28a63c4d5 was pushed; the
      answer was relayed to the coordinator by that session and is also
      recorded in
      coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-9c5410/tasks/TASK-20260906-67f1ab/approval-note.md
    question_presented: >-
      Approve the two frozen contracts under RQ-ECDLP-78dbc5
      (GOAL-ECDLP-bbc21f)? (1) EXP-ECDLP-612fb1, the batch-reselected
      fixed-size table (H-ECDLP-37dc01): toy scale, a generic
      keyed-random-function instrument at N in {2^20, 2^24, 2^30} plus a
      certified toy prime-order curve arm at N ~ 2^24 (every solve
      re-verified by an independent scalar multiplication and against the
      seeded logarithm). Decidable success criterion at a = 1/4, r = 2,
      k = 4, at both generic N: the T/2 re-selected table's steady-state
      per-target success at U = 8T is within CI of the static T-entry
      table (CI upper bound of the difference >= 0, point estimate >=
      -0.03); NULL-A (relabelled batch evidence) at zero and NULL-B / phi =
      0 bit-identical to static; phi decay monotone with gain(0) = 0; no
      re-selected table's hit rate exceeds the exact oracle top-T share.
      Falsification: the T/2 table still CI-separated below static T at
      U = 16T. Budget 12 CPU-h, 48 runs, 3600 s/run, 8 GB, one worker. (2)
      EXP-ECDLP-869870, the basin-partition coverage instrument
      (H-ECDLP-3550b8), Stages 1-3: exact basins at N in {2^20, 2^22,
      2^24}, sampled coverage at 2^30, plus a certified toy-curve transfer
      arm; gated on reproducing Bernstein-Lange's 1.79 case study and
      Table 4.1 within 0.10; measures the Borel basin law, the unselected
      law, the exact oracle top-T share against C_max(a), the published
      weight against the oracle as a function of N/T, a relabelling null,
      a sigma-noise decay and N-independence. Budget 16 CPU-h, 40 runs,
      3600 s/run, 8 GB, one worker. Both are constant-factor,
      generic-model measurements under the KN-LIT-013 S T^2 = Omega~(eps
      N) ceiling; neither can move an exponent and both say so. Approval
      authorizes execution: a committed Coordinator decision marks it
      approved and writes the executor handoffs.
    presentation_included: >-
      for each contract: the hypothesis it tests, the tested scale and
      instrument (generic keyed-random-function at N in {2^20, 2^24, 2^30}
      / {2^20, 2^22, 2^24, 2^30} and a certified toy prime-order curve arm
      at N ~ 2^24 with independent certificate re-verification), the
      decidable success criterion and its falsification branch, the nulls
      and controls (NULL-A relabelling, NULL-B / phi = 0 bit-identity, phi
      decay, oracle top-T share ceiling; Bernstein-Lange 1.79 case-study
      and Table 4.1 reproduction gate, relabelling null, sigma-noise
      decay, N-independence), the frozen budget (12 CPU-h / 48 runs and 16
      CPU-h / 40 runs, 3600 s per run, 8 GB, one worker), and the explicit
      constant-factor scope under the KN-LIT-013 S T^2 = Omega~(eps N)
      ceiling with the statement that neither contract can move an
      exponent
    options_offered:
      - "Approve both as frozen (Recommended)"
      - "Approve EXP-ECDLP-612fb1 only"
      - "Approve EXP-ECDLP-869870 only"
      - "Do not approve; revise"
    answer_verbatim: "Approve both as frozen (Recommended)"
    reaffirmation:
      text_verbatim: "Approved"
      obtained_via: chat message in the orchestrating session, same day (2026-09-06), after the option answer
      note: >-
        A re-affirmation of the recorded option answer, not a second or
        different decision; it adds no scope and is recorded because it
        was given.
    answer_meaning: >-
      branch A (approve) for EXP-ECDLP-612fb1 AND branch A (approve) for
      EXP-ECDLP-869870: commit this approval decision, bind the gate-field
      updates of both contracts and both executor handoffs, and dispatch
      execution in a new batch under the frozen contracts from the base
      branch once this decision is on main. No contract was declined and
      no revision direction was given, so no `revise` branch is recorded.
  gate_field_scope: >-
    Exactly FIVE fields of each approved specification change and nothing
    else: status (review_required -> approved), approved_by (null ->
    coordinator), frozen (false -> true), execution_authorized (false ->
    true), and approval_note (the null-by-design "DESIGNED, NOT APPROVED
    ..." note superseded by the approval record, its original text
    preserved verbatim inside the new note). Why five and not the
    precedent's three: `frozen` and `execution_authorized` are gate fields
    of THESE contracts' own schema, and invalidation rule 1 of each contract
    reads execution_authorized ("Execution while status is not approved or
    execution_authorized is false: no run under this contract is
    evidence"); leaving either false would make every run non-evidence by
    the contract's own rule. The precedent contract EXP-ECRANK-76a70d did
    not carry those two fields, which is why DEC-20260905-2d466e named
    three. `version` stays 1 on both. Every protocol field (stage_plan,
    arms, per_target_protocol, fixture_procedure, selection_rules, controls,
    seed_policy, stopping_rules, invalidation_rules, budget, charging,
    success and falsification criteria, pre-registered predictions) is
    byte-identical to the designed contract.
  approved_contract_binding: >-
    The approved protocols are experiments/EXP-ECDLP-612fb1/specification.yaml
    and experiments/EXP-ECDLP-869870/specification.yaml, each at version 1,
    bound to the bytes committed by the campaign-opening archive at commit
    9bd8a17e7 (the design commit of BATCH-9c5410 on branch
    claude/batch-dlp-precomputation-nov7vh) with the five gate fields named
    in gate_field_scope as the ONLY differences. The orchestrating session
    verified that diff against the committed bytes before this decision was
    written (approval-note.md and the in-session handoff record the
    verification; both specifications parse; version 1 on both). This
    coordinator role has no shell and computed no hash: the sha256 of each
    approved specification at its committed bytes is recorded by the Git
    half of TASK-20260906-2d30dd in the ledger receipt
    (coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-9c5410/archives/TASK-20260906-2d30dd/ledger-receipt.json)
    and in the dispatch queue's path_sha256 backfill, which
    research_dispatch.py verifies content-first. No hash is asserted in
    prose here. Any later protocol change requires a versioned
    protocol_amendment under experiments/<EXP>/amendments/ and never an
    edit of the frozen prediction; runs already executed are never silently
    re-scored.
  executor_handoff_note: >-
    TASK-20260906-3623b9 (EXP-ECDLP-612fb1) and TASK-20260906-d17254
    (EXP-ECDLP-869870) target the executor under policy
    executor-implementation with fallback_allowed false and
    degraded_allowed false, review_required true, and each contract's
    budget envelope copied verbatim: 3623b9 at 3600 s per run, 12 CPU-h,
    8 GB, 48 runs, one worker (the contract's own arithmetic is 36 runs
    with 12 spare for recorded infrastructure re-runs); d17254 at 3600 s
    per run, 16 CPU-h, 8 GB, 40 runs, one worker (24 runs with 16 spare).
    First-batch scope per the handoffs: 3623b9 runs Stage G (gates,
    N = 2^20, both a, 5 seeds) and Stages 1-2 (N = 2^24 exact and N = 2^30
    sampled, all arms, 5 seeds), Stage 3 (curve search and certified curve
    arms) only if budget remains, otherwise reported as NOT YET RUN;
    d17254 runs Stage 1 (N = 2^20) and Stage 2 (N in {2^22, 2^24} with the
    BLOCKING Bernstein-Lange fixture gate at 2^24), Stages 3-4 (2^30
    sampled; curve arms) only if budget remains, otherwise NOT YET RUN.
    Completion gate for both: every run carries the full artifact-policy
    manifest (exact command, commit and dirty-tree state, environment, ALL
    seeds, inference manifest, complete stdout/stderr, raw-result.json,
    summary.json, validity status, timestamps, wall clock and
    peak_rss_bytes); gate order binding and reported before any dependent
    arm; certificate pass counts equal solved/hit counts on every curve-arm
    run that executed; exhaustion reported as exhaustion; a timeout, crash
    or dependency failure is failed_infrastructure and never a result. The
    Executor interprets nothing and changes no status. Both handoffs carry
    batch_id null with a note: they are dispatched ONLY by the execution
    batch opened after this decision is committed and merged to main, so
    the Executor starts from the frozen approved contract on the base
    branch. Both name archived_by TASK-20260906-7a2446 (the reserved
    snapshot archive) and the reserved Validator TASK-20260906-7ec3ea and
    Red Team TASK-20260906-90e7cf.
  rationale:
    - >-
      The gate condition is satisfied on a recorded, verbatim user answer
      obtained after the frozen designs were pushed, exactly as the
      precedent DEC-20260905-2d466e required; nothing in this decision
      rests on an in-session word alone, and the answer maps to a single
      unambiguous branch for both contracts.
    - >-
      Both contracts were designed from ideas that passed Stage 0 primary
      reading: the coordinator read Bernstein-Lange (IACR 2012/458) and
      Corrigan-Gibbs-Kogan (IACR 2017/1113) in full on 2026-09-06 and the
      idea records IDEA-20260906-ee3543 and IDEA-20260906-aed829 carry
      those readings in their citations (verified_by fields), so the
      published constants the contracts use as fixtures (the 1.79 (l/T)^{1/2}
      case study, Table 4.1) are bound to the primary text, not to memory.
    - >-
      Both contracts carry a decidable success criterion with a matching
      falsification branch, nulls that must sit at zero or be bit-identical
      to the control, an exact-oracle ceiling that no treatment may exceed,
      deterministic seeds, a per-run and total budget, and invalidation
      rules that make any timeout or gate failure non-evidence rather than
      a negative -- the controls that prevent a misleading interpretation
      are frozen before compute is spent.
    - >-
      The cheapest valid experiment is the toy-tier generic instrument at
      N <= 2^30 with one certified curve arm; both contracts say in their
      own text that they are constant-factor measurements under the
      KN-LIT-013 S T^2 = Omega~(eps N) ceiling and cannot move an exponent.
      Under the roadmap bias toward exponent-targeting mechanisms this is
      ranked as what it is: a bounded measurement that either narrows the
      constant's known range or closes the lane with a measured obstruction
      block per docs/inventor-protocol.md (goal criterion C3), and the
      campaign is ECC by declared policy, so it is selected before every
      non-ECC goal.
    - >-
      Every executor handoff budget field is non-null and copied verbatim
      from its contract; the review chain (snapshot archive, independent
      Validator and Red Team, then ledger archive) is reserved with
      identifiers before any run exists, so the execution batch cannot skip
      independent review by omission.
  evidence_refs:
    - ledger/questions/RQ-ECDLP-78dbc5.yaml
    - ledger/hypotheses/H-ECDLP-37dc01.yaml
    - ledger/hypotheses/H-ECDLP-3550b8.yaml
    - experiments/EXP-ECDLP-612fb1/specification.yaml
    - experiments/EXP-ECDLP-869870/specification.yaml
    - ledger/proposals/IDEA-20260906-ee3543.yaml
