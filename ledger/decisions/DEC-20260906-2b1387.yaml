    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-9c5410/tasks/TASK-20260906-67f1ab/approval-note.md
    - ledger/decisions/DEC-20260905-2d466e.yaml
  limitations:
    - >-
      No run exists under either contract. Nothing in this decision is
      evidence: no measurement, no constant, no confidence interval, no
      certificate. It authorizes execution only.
    - >-
      H-ECDLP-37dc01 and H-ECDLP-3550b8 stay `specified`. No hypothesis
      status moves here, and none may move until the execution batch's
      snapshot archive, independent Validator and Red Team reports and a
      Coordinator ledger archive with EV records have completed and been
      verified.
    - >-
      Claim tier is toy: the generic instrument is a keyed random function
      at N <= 2^30 and the curve arm is a certified toy prime-order curve
      at N ~ 2^24. No result of either contract transfers to
      cryptographic-scale curves without an explicit, separately tested
      transfer assumption.
    - >-
      Both contracts are constant-factor, generic-model measurements under
      the Corrigan-Gibbs-Kogan S T^2 = Omega~(eps N) ceiling (KN-LIT-013).
      Neither can move an exponent, neither claims to, and a positive
      result would be a constant with an interval, not an asymptotic
      claim; the four promotion gates for asymptotic claims are therefore
      not engaged by this campaign.
    - >-
      The sha256 bindings of the approved specifications are not asserted
      in this record; they are recorded by the Git half in the receipt and
      queue backfill, where the dispatcher verifies them content-first.
    - >-
      tools/validate_ledger.py reports no error on any record of this goal.
      The four pre-existing errors on origin/main (DEC-20260905-01a1b4,
      DEC-20260905-36847f, DEC-20260905-e140ee, TASK-20260905-2c383f)
      belong to other campaigns' records and are not this lane's to fix;
      they are disclosed, not repaired, here.
    - >-
      The user's answer covers the two contracts as frozen at version 1
      and nothing beyond them: no protocol amendment, no budget increase,
      and no later-stage scheduling is authorized by it.
  next_actions:
