coordinator_decision:
  id: DEC-20260803-4d4528
  goal_id: GOAL-MLKEM-004
  batch_id: null
  recorded_by_task: null
  authorized_by: user_session_directive
  recorded_at: '2026-08-03'

  decision: open_goal
  decision_label: >-
    Open GOAL-MLKEM-004, the successor named by DEC-20260803-64b55b, now that
    its instrument is verified obtainable.

  context: >-
    GOAL-MLKEM-003 closed at budget hours earlier (DEC-20260803-64b55b) with a
    named obstruction -- the lattice-estimator cannot answer KN-OPEN-016's
    question -- and named this successor while recording its instrument as
    unavailable. That second half was wrong: passagemath-standard, fpylll and
    g6k were all obtained and verified functional in the same container within
    the hour (KN-TECH-14efa5). The obstruction stands; the tooling blocker does
    not.

  authorization: >-
    The user's standing session directive is ML-KEM cryptanalysis work. The
    predecessor's next_action NA-1 recorded opening a successor as a user
    decision; that decision was already made by the standing directive, and
    treating it as still-pending was Coordinator over-caution rather than
    contract. Budget is set conservatively at 6 batches, half the predecessor's.

  why_this_goal_and_not_a_thirteenth_batch: >-
    A thirteenth batch of GOAL-MLKEM-003 would produce a more precise number of
    the same unusable sort -- that is exactly what its red team argued and what
    its closure recorded. The obstruction is a property of the instrument, so
    the only response that changes anything is a different instrument. That is
    now available, so the successor is runnable rather than aspirational.

  what_is_authorized:
    - >-
      Measuring the score distribution of sieve-produced dual vectors at reduced
      dimensions with g6k, and comparing it against the independence structure
      underlying MATZOV.Nf's closed-form advantage law.
    - >-
      Rebuilding the instrument per KN-TECH-14efa5 in every batch, since it
      lives in an ephemeral container and will not survive session end.

  what_is_not_authorized:
    - >-
      Any claim about FIPS 203 dimensions that is not stated as a numbered
      extrapolation heuristic with its own uncertainty. Reduced-dimension
      measurement is not crypto-scale evidence (AGENTS.md rule 4).
    - >-
      Any statement that corrects, supersedes or changes the status of
      EV-MLKEM-015 or any other GOAL-MLKEM-003 record. Rule 12 is UNMET and
      UNWAIVED and is inherited unchanged.
    - >-
      Reopening GOAL-MLKEM-003. It is closed_at_budget on the merits of its
      evidence, not on tooling, and having an instrument today does not
      retroactively satisfy a criterion about what the campaign measured.

  inherited_failure_modes_and_the_guards_adopted:
    - failure: >-
        The predecessor went two consecutive batches with no null object of the
        right shape, and the one time one ran (RT-20260803-f55e34 OBJ-4) it came
        back a coin flip.
      guard: >-
        The null is a completion-gate item on the batch-1 producer card, not an
        aspiration. Controls before belief.
    - failure: >-
        The predecessor's Coordinator recorded three install failures as
        "unobtainable" and that became a twelve-batch blocker. The same error
        recurred in its own closing decision about g6k.
      guard: >-
        A negative install result is recorded as a route that failed, with the
        exact command and output, and never as a claim about what is possible.
        Before recording a tool unobtainable, name the routes not yet tried.
    - failure: >-
        The predecessor read a reproducible difference between two functions as
        a finding, and three probes that all fixed the one live variable as
        corroboration.
      guard: >-
        Batch 1 delivers RAW DATA and states no finding. The comparison against
        the assumed law is batch 2, after the raw data has been independently
        reviewed. Agreement is as publishable as departure.
    - failure: >-
        The predecessor's Coordinator authored an unreviewed interpretive note
        during a review window, and it carried two errors.
      guard: >-
        The corrective rule from DEC-20260803-85adf8 is carried forward: a
        Coordinator reading that bears on a pending review is dispatched as an
        INTERROGATIVE in the task card, never as a note that also supplies the
        verdict.

  explicit_non_claims:
    - No ML-KEM break, and none is expected from a measurement at reduced dimensions.
    - >-
      No security claim in either direction. A cost model's input assumption
      failing to match measured behaviour is not an attack.
    - >-
      No FIPS 203 parameter set is affected or cleared by opening this goal.
    - >-
      KN-OPEN-016 is not answered by opening a goal that intends to address it.

  knowledge_promotion:
    promote: false
    promoted: []
    not_warranted: >-
      Opening a goal promotes nothing. KN-TECH-14efa5 was recorded separately as
      infrastructure and makes no research claim. The two promotions owed by the
      predecessor (KN-FIND-012 restatement, KN-FIND-014 withdrawal) remain owed
      and remain rule-12 blocked.

  evidence_refs: []
  evidence_ref_note: >-
    None. This decision opens a goal; it records no evidence and cites none in
    support of any research claim. Its factual basis is KN-TECH-14efa5, which is
    an infrastructure record verified by execution.

  target_ids:
    - GOAL-MLKEM-004

  next_actions:
    - id: NA-1
      owner: coordinator
      action: >-
        Create BATCH-d2a728 and dispatch TASK-20260803-e53ce2: rebuild the
        instrument, then measure and emit the raw score distribution. State no
        finding in batch 1.

  decided_by: coordinator
  decided_at: '2026-08-03'

  inference_provenance:
    requested_policy: coordinator-decision
    fallback_used: false
