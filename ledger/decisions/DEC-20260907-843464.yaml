coordinator_decision:
  id: DEC-20260907-843464
  recorded_at: '2026-09-07'
  context: >-
    Following amendment v1 (DEC-20260907-432a39), EXP-RELN-f202be's full
    run set (RUN-RELN-f202be-N14v2, N16v2, N18, N20, stage4v2) completed
    with every blocking control passing. The frozen success_criterion and
    falsification_criterion of the contract do not resolve: Delta stays
    inside the NULL-A band at every rung (the NULL half), but the
    growth-fit slope is confidently negative on every geometry, which the
    contract's decision tree does not name as either NULL, ALIVE, or its
    defined INCONCLUSIVE (underpowered) case. EV-RELN-335cd2 records the
    measured facts and a diagnostic (unverified) explanation: the
    growth-fit statistic's max(diff, SD_null) clipping likely tracks the
    null band's own sampling-SD shrinkage rather than any property of the
    object geometries, since the object-versus-null-mean difference is
    small and of mixed sign at every rung. The user was asked how to
    proceed among filing this as inconclusive and moving to the other two
    RQ-RELN-61638a contracts, amending the growth-fit metric and rerunning,
    dispatching independent review first, or stopping. The user chose to
    file as inconclusive and move on.
  decision: inconclusive
  target_ids:
    - EXP-RELN-f202be
    - H-RELN-41562a
    - EV-RELN-335cd2
  rationale:
    - >-
      The contract's own falsification_criterion names exactly one
      inconclusive case (a slope interval containing both 0 and the alive
      threshold, i.e. underpowered) and this run set does not match it: the
      slope confidently excludes 0 but is negative, which the contract's
      decision tree never anticipated. Absent a pre-registered rule for
      this exact outcome, neither promoting nor weakening H-RELN-41562a is
      warranted; `inconclusive` is the only decision that does not read a
      criterion the contract did not write.
    - >-
      The diagnostic explanation in EV-RELN-335cd2 (the growth-fit metric's
      own SD_null-clipping behaviour) is offered as the Coordinator's
      working account, checkable arithmetic on already-recorded numbers,
      but is explicitly UNVERIFIED by independent review and is not treated
      here as settling the question.
    - >-
      H-RELN-41562a's status remains proposed. No claim is made about
      clustering, growth, or the dispersion index's behaviour at any scale
      beyond what EV-RELN-335cd2 states.
  evidence_refs:
    - EV-RELN-335cd2
    - experiments/EXP-RELN-f202be/runs/RUN-RELN-f202be-stage4v2/metrics.json
    - experiments/EXP-RELN-f202be/amendments/v1.yaml
  limitations:
    - >-
      This decision does not resolve whether the negative growth-fit slope
      is purely a metric-definition artifact or partly a real (small)
      property of the object geometries; EV-RELN-335cd2's
      unresolved_confounds names the cheap follow-up check (fitting on diff
      alone, no new curve generation) that would settle this from data
      already collected, left for a future task rather than performed here.
    - >-
      Independent validator and red-team review, per the contract's
      later_review_requirements, has not occurred. Nothing in
      EV-RELN-335cd2 or this decision may back a claim-changing conclusion
      until that review completes.
    - >-
      This decision does not touch EXP-RELN-82f487 or EXP-RELN-141a86,
      whose approval and dispatch are separate acts; both consume this
      battery's exact count-vector labels, which are valid data unaffected
      by this classification ambiguity.
  next_actions:
    - >-
      Approve and dispatch EXP-RELN-82f487 (learned predictor panel) and
      EXP-RELN-141a86 (symbolic-regression invariant extractor), each
      under its own coordinator_decision, per the user's "in dependency
      order" instruction, consuming EXP-RELN-f202be's exhaustive count
      vectors as their declared input labels/summaries.
    - >-
      Optionally, in a later task: a growth-fit metric definition that fits
      directly on Delta - Delta_null_mean (without the SD_null floor) would
      give a cleaner discriminator for a future protocol amendment or
      successor contract, if this exact question is revisited.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      An inconclusive decision with strength `inconclusive` and no
      independent review does not meet the replicated/strong bar for
      knowledge promotion (templates/research-records.md,
      coordinator_decision.knowledge_promotion).
  decided_by: coordinator
  decided_at: '2026-09-07'
