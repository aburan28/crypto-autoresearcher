coordinator_decision:
  id: DEC-20260915-744b57
  decided_by: coordinator
  decided_at: '2026-09-15'

  context: >-
    RETRY of a dispatch that failed on an account-level rate limit before any
    work was done (verified clean by the dispatching session; no prior
    attempt's output exists to reconcile with). FOLLOW-UP to the
    DEC-20260909-bf5b48 .. DEC-20260914-8374d8 chain on EXP-FROB-d8aa37
    stage0. TASK-20260914-0a026a's retry launch under the fresh run_id
    RUN-FROB-3c0b8f failed in ~7 seconds with status infrastructure_error.
    This coordinator independently read both frozen sources in full
    (experiments/EXP-FROB-d8aa37/stage0/driver.py,
    experiments/EXP-FROB-d8aa37/stage0/checker.py) rather than accepting the
    dispatching session's audit on faith, and confirms two structural defects
    in the frozen source itself, not in any trial-plan-layer amendment:
    (1) driver.py:29 and checker.py:23 each hardcode a module-level constant
    RUN = 'RUN-FROB-2404fa' (the FIRST, spent, interrupted run_id), checked
    at driver.py:841 (`require(run_dir.name==RUN,'unexpected run identity')`,
    the first run-identity-specific check inside guard_and_inputs(), after
    the platform/RLIMIT_AS/pgrp guards), driver.py:929 (manifest `id=RUN`),
    checker.py:779 (`demand(os.getpgrp()>0 and run_dir.name==RUN, ...)`) and
    checker.py:785 (`demand(manifest['id']==RUN and ..., 'canonical run
    identifiers')`). No trial-plan amendment can route around a hardcoded
    Python literal. (2) driver.py:851 and driver.py:935 hardcode the path to
    the ORIGINAL, Modal-era
    coordination/frobenius/BATCH-2f8435/admission/linux-runtime-lock.json
    (scientific_launch_authorized: false, superseded for launch purposes by
    DEC-20260914-bb1dbe/DEC-20260914-d471ce; its sandbox is long gone), not
    the successor lock that actually authorizes any current launch
    (linux-runtime-lock-successor-20260914-c85f6a.json, sha256
    46d918a1a4b9d358df39f09a87d5221128cc1ce19cb62672bc35204785952eb5,
    scientific_launch_authorized: true, confirmed unedited and still current
    by this coordinator's own read above). This coordinator independently
    confirms the dispatching session's further finding that this second
    defect alone did not cause either launch failure (driver.py's own check
    here is `require(lock_path.is_file(), ...)` then `require(lock, 'empty
    runtime lock')`; it never reads scientific_launch_authorized or compares
    runtime identity) -- but if left unfixed, any future successful run's
    manifest.yaml would embed the WRONG lock's content/sha256 as its
    runtime_lock/runtime_lock_sha256 provenance, misattributing which
    admission actually authorized the run. This coordinator also
    independently confirmed, by full grep of both files for RUN, lock,
    admission, coordination/, and BATCH-, that: driver.py's only three RUN
    references are exactly the three lines above; checker.py's only three RUN
    references are exactly the three lines above; checker.py carries ZERO
    lock/admission/coordination/BATCH- references (so the lock defect is
    driver.py-only); and no other hardcoded run/task/batch/decision
    identifier exists in either file --
    experiments/EXP-FROB-d8aa37/specification-stage0-v2.yaml's path IS
    correctly hardcoded and is not touched. This coordinator also read
    ledger/decisions/DEC-20260914-d04668.yaml and
    ledger/decisions/DEC-20260918-7e0865.yaml in full, as instructed, and
    confirms neither touches this stage0 launch-identity blocker: the first
    approves a DIFFERENT experiment (EXP-FROB-91ee9c) under the same research
    question RQ-FROB-7d8dd4 and orders an unrelated evidence review first; the
    second is goal/campaign organisation for RQ-QSP-f9bbdb under
    GOAL-ECDLP2M-001 and explicitly records RQ-FROB-7d8dd4 as a CANDIDATE,
    NOT adopted, with its own separate recheck (AC-4) -- neither record edits,
    supersedes, or bears on TASK-20260914-0a026a, RUN-FROB-2404fa,
    RUN-FROB-3c0b8f, or either frozen source file.

  decision: amend
  target_ids:
    - EXP-FROB-d8aa37
    - RUN-FROB-2404fa
    - RUN-FROB-3c0b8f
    - RUN-FROB-39714f
    - TASK-20260909-ece919
    - TASK-20260914-0a026a
    - TASK-20260915-ccffee
    - BATCH-2f8435
    - RQ-FROB-7d8dd4
    - H-FROB-73df22

  the_decision_stated_plainly: >-
    THE AMENDMENT IS AUTHORIZED, IN TWO SEPARATE STEPS, NOT ONE. Step one,
    taken here: this coordinator authorizes an additive, non-scientific
    identity-and-provenance correction to driver.py/checker.py as NEW,
    versioned files (driver-v2.py, checker-v2.py), and DISPATCHES ITS
    AUTHORSHIP to the Executor via a fully specified, zero-discretion handoff
    (TASK-20260915-ccffee) rather than writing the Python source itself. Step
    two, NOT taken here and left to a follow-up Coordinator decision once
    TASK-20260915-ccffee returns: approving trial-plan-stage0-v4.json (which
    needs the new files' actual sha256 values, not yet known), a fresh
    run-binding, and a launch handoff for RUN-FROB-39714f. The reserved
    run_id RUN-FROB-39714f is confirmed unused by this record and carried
    forward for that follow-up decision.

  why_the_coordinator_does_not_author_the_python_source_itself: >-
    This coordinator's own operating contract is explicit and is treated here
    as binding regardless of how the requesting message frames the ask: "You
    never run experiments and never write experiment implementation code...
    Dispatch execution to the executor agent... via a handoff record -- never
    do their work inline." driver.py/checker.py are, in full, the frozen
    scientific source of EXP-FROB-d8aa37 stage0 -- the object this program's
    entire hash-pinning discipline exists to protect -- and remain
    "experiment implementation code" under that rule even where the specific
    diff touches only identity/provenance plumbing and changes no
    mathematical, curve, field, control, or calibration logic. The prior
    admission-chain precedent this record's requesting message points to
    (DEC-20260914-bb1dbe/-d471ce/-8374d8 authoring lock/binding/trial-plan
    JSON directly) is not the same act: those are coordination-layer records
    -- JSON configuration and custody artifacts this program's own conventions
    already treat as Coordinator-authored (trial plans specifically, per
    DEC-20260914-8374d8's own direct authorship of trial-plan-stage0-v3.json)
    -- not executable Python implementing the driver/checker themselves. Two
    further reasons beyond the bright-line rule: (1) SELF-REVIEW HAZARD, named
    explicitly and treated as a real cost elsewhere in this exact program
    (DEC-20260918-7e0865's handling of its own two proposals) -- the approving
    authority writing the very artifact it approves collapses the separation
    this program's whole review architecture depends on, even for a change
    both this coordinator and the requester believe is purely mechanical; (2)
    THIS COORDINATOR HAS NO SHELL and cannot run either file's own
    `--self-test`, cannot diff the new file against the old byte-for-byte,
    and cannot compute a sha256 -- so even a mechanically "obviously correct"
    diff cannot be verified as applied without a session that can execute it,
    which is exactly what dispatching to the Executor obtains. What this
    coordinator CAN and does do, in place of writing the code, is remove all
    discretion from the Executor: the diff below is stated exactly, per file,
    per line, with an explicit prohibition on any other change and a
    completion gate requiring the Executor's own report to show that nothing
    else differs.

  exact_diff_authorized:
    driver_py_to_driver_v2_py:
      - >-
        DELETE line 29 in full: `RUN = 'RUN-FROB-2404fa'`. No replacement
        line. (EXPERIMENT = 'EXP-FROB-d8aa37' on line 28 is unchanged and
        stays.)
      - >-
        DELETE line 841 in full: `require(run_dir.name==RUN,'unexpected run
        identity')`. No replacement line. (The preceding platform/RLIMIT_AS/
        pgrp guards and the following `require(run_dir.is_dir(), ...)` line
        are unchanged and stay in their existing order.)
      - >-
        In the `guard_and_inputs` function, replace exactly these 5 lines
        (current lines 851-856):
        `lock_path=repo/'coordination/frobenius/BATCH-2f8435/admission/linux-runtime-lock.json'`
        / `require(lock_path.is_file(),'missing committed Linux runtime
        lock')` / `lock=json.loads(lock_path.read_text())` / the existing
        comment line / `require(lock,'empty runtime lock')` -- with:
        `lock_relative=inputs['environment.json'].get('runtime_lock')` then
        `require(lock_relative,'environment.json missing runtime_lock
        path')` then `lock_path=repo/lock_relative` then
        `require(lock_path.is_file(),'missing committed Linux runtime
        lock')` then `lock=json.loads(lock_path.read_text())` then the SAME
        existing comment line unchanged then `require(lock,'empty runtime
        lock')` then two new lines:
        `lock_expected_sha256=inputs['environment.json'].get('runtime_lock_sha256')`
        and `require(lock_expected_sha256,'environment.json missing
        runtime_lock_sha256')` and `require(sha(lock_path)==lock_expected_sha256,'bound
        runtime lock hash mismatch')`. The function's final line, `return
        repo,inputs,lock`, is UNCHANGED -- the return signature/arity does
        not change, so the call site `repo,adapter,runtime_lock=guard_and_inputs(run_dir)`
        in `execute()` needs no edit.
      - >-
        In `execute()`, line 929's manifest construction: change
        `manifest={'run':dict(id=RUN,experiment_id=EXPERIMENT,status=status,`
        to `manifest={'run':dict(id=run_dir.name,experiment_id=EXPERIMENT,status=status,`.
        (`run_dir` is already `execute`'s own parameter; no new variable
        needed.)
      - >-
        In `execute()`, line 935's `environment=dict(...)` block: change
        `runtime_lock_sha256=sha(repo/'coordination/frobenius/BATCH-2f8435/admission/linux-runtime-lock.json'))`
        to `runtime_lock_sha256=sha(repo/adapter['environment.json']['runtime_lock']))`.
        (`adapter` is already `execute`'s local name for `guard_and_inputs`'s
        second return value, i.e. `inputs`; no new variable needed. The
        `runtime_lock=runtime_lock` field immediately above it, populated
        from `guard_and_inputs`'s third return value -- the actual lock
        content dict -- is UNCHANGED.)
      - >-
        NO OTHER LINE OF driver.py MAY DIFFER FROM driver-v2.py. In
        particular: every field/curve/subspace/formal-polynomial/panel/
        control/serialization function; SCIENCE/RESERVED/CACHE_LIMIT;
        `self_test()` in full; the module docstring; and every comment not
        listed above are byte-identical.
    checker_py_to_checker_v2_py:
      - >-
        DELETE line 23 in full: `RUN='RUN-FROB-2404fa'`. No replacement line.
      - >-
        Line 779: change `demand(os.getpgrp()>0 and
        run_dir.name==RUN,'checker process/run identity')` to
        `demand(os.getpgrp()>0,'checker process group')`.
      - >-
        Line 785: change `demand(manifest['id']==RUN and
        manifest['experiment_id']=='EXP-FROB-d8aa37','canonical run
        identifiers')` to `demand(manifest['id']==run_dir.name and
        manifest['experiment_id']=='EXP-FROB-d8aa37','canonical run
        identifiers')`. (`run_dir` is already `verify`'s own parameter.)
      - >-
        NO OTHER LINE of checker.py may differ from checker-v2.py, including
        `self_test()` in full, which must remain byte-identical (it never
        calls `verify()` and is unaffected by either change).
      - >-
        checker.py carries no lock/admission reference of any kind (confirmed
        by this coordinator's own full grep for lock, admission,
        coordination/ and BATCH-, matched only inside unrelated identifiers
        `block`/`h.update(block)`), so checker-v2.py needs no lock-path
        change; only the two RUN-identity lines above differ from checker.py.
    tools_experiment_execution_py:
      - >-
        This file is ordinary, non-frozen repository tooling shared by every
        experiment in the program, not EXP-FROB-d8aa37 scientific source; it
        carries no source_sha256 pin in any trial plan. The one change
        authorized is additive and backward compatible with every OTHER
        experiment's trial plan (a plan lacking the two new keys yields
        `None` for both, unchanged from today's behaviour for any driver that
        does not read them): in `execute_trial()`, the `environment.json`
        `write_once(...)` call (current lines 383-385) gains two new keys,
        `"runtime_lock": plan.get("runtime_lock")` and `"runtime_lock_sha256":
        plan.get("runtime_lock_sha256")`, alongside the four existing keys
        (`python`, `platform`, `source_sha256`, `specification_sha256`,
        `commit`), which are themselves UNCHANGED. No other line of this file
        may differ.

  what_a_plan_authoring_this_change_will_require_next: >-
    trial-plan-stage0-v4.json (not authored by this record) will need two new
    top-level keys, `"runtime_lock"` (the relative path
    `coordination/frobenius/BATCH-2f8435/admission/linux-runtime-lock-successor-20260914-c85f6a.json`)
    and `"runtime_lock_sha256"` (the already-committed value
    `46d918a1a4b9d358df39f09a87d5221128cc1ce19cb62672bc35204785952eb5`, read
    by this coordinator directly from
    run-binding-successor-20260914-8374d8.json's own `runtime_lock_sha256`
    field, not recomputed), alongside a `source_sha256` map naming
    driver-v2.py and checker-v2.py (with dependencies.json and
    implementation-report.json's existing two hashes unchanged) and a fresh
    `run_id` of `RUN-FROB-39714f`. This coordinator does not author that file
    now because it cannot state driver-v2.py/checker-v2.py's real sha256
    values without fabricating them, and CLAUDE.md rule 5 / this coordinator's
    own no-shell limitation forbid that; TASK-20260915-ccffee's own report is
    the source of those two hashes.

  rationale:
    - >-
      THE FAILURE IS INFRASTRUCTURE/PROTOCOL-DEFECT SIGNAL, NEVER NEGATIVE
      MATHEMATICAL EVIDENCE. AGENTS.md core rule 5 and CLAUDE.md rule 3 apply
      exactly as they did to RUN-FROB-2404fa's external-timeout interruption
      under DEC-20260914-8374d8: RUN-FROB-3c0b8f's 7-second
      infrastructure_error says nothing about H-FROB-73df22, RQ-FROB-7d8dd4,
      or whether Frobenius structure moves the index-calculus exponent. No
      hypothesis or experiment status moves here.
    - >-
      THE CHANGE IS GENUINELY IDENTITY/PROVENANCE PLUMBING, NOT SCIENCE. Every
      line touched is inside `guard_and_inputs`'s admission checks or the
      manifest's own `run`/`environment` bookkeeping fields; nothing in
      `Tower`, `Curve`, `select_curves`, `subspaces`, `formal_polynomials`,
      `build_ideal`, `buchberger`, `panel`, or either file's `self_test()` is
      touched. This coordinator verifies this claim is falsifiable and
      checkable, not merely asserted: `exact_diff_authorized` above names
      every changed line by number and content, and the completion gate below
      requires the Executor's own diff to show nothing else differs.
    - >-
      THE RUN-IDENTITY FIX IS A STRICT GENERALIZATION, NOT A WEAKENING, OF
      WHAT IT PROTECTS. The removed checks (`run_dir.name==RUN` in both
      files) rejected every run directory except one specific, now-permanently
      spent literal string -- a constraint this program's own
      exclusive-create run-directory semantics (`tools/experiment_execution.py`'s
      `directory.mkdir()`, no `exist_ok`) make impossible to satisfy for any
      future retry, by construction. The retained/added check
      (`manifest['id']==run_dir.name` in checker.py; `id=run_dir.name` written
      truthfully by driver.py) preserves the actual protective property --
      that the manifest's declared run id is self-consistent with the
      directory it was written to and found in -- for ANY run_id, not one
      hardcoded value. Every run_id the OLD check accepted, the NEW check
      still accepts (RUN-FROB-2404fa itself would pass both); the new check
      additionally accepts every other run_id, which is exactly the property
      needed for a retry lineage without editing frozen source with the run_id
      baked in a second time.
    - >-
      THE LOCK-PATH FIX CLOSES A REAL, IF NOT YET TRIGGERED, PROVENANCE
      DEFECT. This coordinator independently confirms the dispatching
      session's finding: as written, driver.py's `require(lock_path.is_file(),
      ...)`/`require(lock,'empty runtime lock')` checks never compare against
      `scientific_launch_authorized` or any runtime identity field, so the
      wrong hardcoded path did not itself cause either observed failure.
      Left unfixed, however, a future SUCCESSFUL run's manifest.yaml would
      silently embed the superseded, launch-unauthorized Modal-era lock's own
      content and sha256 as its `runtime_lock`/`runtime_lock_sha256`
      provenance -- misattributing which admission decision actually
      authorized the run, a durable falsification of the run's own custody
      record. Fixing it now, alongside the run-identity fix and before any
      further launch attempt, is cheaper and more honest than discovering it
      after a completed run's manifest already needs a correction record.
    - >-
      THE FIX IS PLUMBED THROUGH THE PLAN/ENVIRONMENT LAYER, NOT A SECOND
      HARDCODED PATH. Hardcoding the SUCCESSOR lock path into driver-v2.py in
      place of the original would repeat the identical defect one admission
      cycle later: the next successor lock (if this runtime is ever
      re-admitted under a different provenance) would again require editing
      frozen source. Reading it from `environment.json`, itself populated
      from the trial plan by `tools/experiment_execution.py` (ordinary,
      non-frozen tooling), makes the lock binding an admission-layer/plan-layer
      fact instead of a scientific-source fact, matching where every other
      per-launch binding (source hashes, specification hash) already lives in
      this exact file.
    - >-
      WHY driver-v2.py/checker-v2.py AND NOT AN EDIT. Per AGENTS.md/CLAUDE.md,
      "changing a frozen scientific protocol uses an additive amendment;
      never rewrite historical records," and per this exact lane's own
      established pattern (successor locks/bindings; trial-plan-stage0-v2 ->
      v3), driver.py and checker.py remain the immutable historical record of
      what actually ran (RUN-FROB-2404fa, genuinely executed and interrupted)
      and what failed to run (RUN-FROB-3c0b8f, infrastructure_error) under
      their exact frozen bytes. Both stay unedited, at their existing
      committed source_sha256 values, cited unchanged in
      trial-plan-stage0-v2.json and trial-plan-stage0-v3.json.
    - >-
      DIRECTION CHECK, unchanged from the whole DEC-20260909-bf5b48 ..
      DEC-20260914-8374d8 chain. Stage0 is not itself exponent-moving; it is
      the correctness gate for H-FROB-73df22's two arms. No scientific claim
      of any kind is advanced by this admission/provenance-plumbing record.
      FROB is a declared ECC area (orchestration/research-priority.yaml line
      79), ranked ahead of non-ECC candidates at every selection point, with
      unlimited batch/wall-clock budget per AGENTS.md "ECC comes first."
    - >-
      BUDGET. Per CLAUDE.md "Research budgets: progress first" (2026-09-06):
      research cost estimates are advisory and require no repeated user
      approval; the Coordinator continues justified work within the
      authorized research scope. No 90-day stagnation review is active or
      warranted -- this lane has shown continuous documented progress across
      DEC-20260909-bf5b48 through DEC-20260914-8374d8 and now this record,
      all within the last five days, and a rate-limited retry of an
      already-authorized dispatch is exactly the kind of routine continuation
      CLAUDE.md's "progress first" instruction protects, not a new spending
      decision requiring fresh justification.

