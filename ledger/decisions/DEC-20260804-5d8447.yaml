  recorded_by_task: TASK-20260804-165
  archived_by: TASK-20260804-166
  context: >-
    BATCH-111: BKK speedup at p=4001. B/2 gives 75.5% yield (vs 86% at p=1009).
    Speedup is regime-dependent: stronger in saturated regime (heuristic > 1.5).

  decision: advance_optimized_semaev
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    BKK speedup confirmed at p=4001 but weaker than at p=1009 due to near-crossover
    regime (heuristic=0.88 < 1). The speedup is real but depends on the regime:
    - Saturated (heuristic >> 1): ~1.7x speedup
    - Near-crossover (heuristic ≈ 1): ~1.3x speedup
    - Sub-saturated (heuristic < 0.5): no speedup

    For optimal Semaev B (chosen to give heuristic ≈ 1 at the optimal m):
    the BKK speedup gives ~1.3-1.7x depending on the specific m and B.

    NEXT CONCRETE QUESTION: What is the OPTIMALLY EFFICIENT B to choose to maximize
    the BKK speedup? Is it better to use larger B (heuristic > 1, more speedup) or
    standard optimal B?

    GOAL-ECDLP-001 stays active.

  exact_next_action: >-
    BATCH-112: Compute the optimal B for BKK-accelerated Semaev. Specifically:
    find the B_opt that minimizes total relation-finding cost T(B) = N_trials * n_check
    where N_trials = 1/yield(B/2) and n_check = B/2. With yield ~ B^2/(2N) and
    n_check = B/2: T = B/(B^2/(2N)) * (B/2) = N/B * B/2 = N/2. This is independent
    of B! So the BKK speedup gives a constant-factor improvement of 2x at ALL B choices.
    But this ignores the sub-heuristic correction — need to account for yield < heuristic.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Shape repaired under DEC-20260805-7b3e91 (RUL-6). The record as committed
      wrote `knowledge_promotion: not_warranted` as a bare token with no stated
      reason. No KN-* entry was created by this decision. The reason was not
      recorded at the time and is NOT reconstructed here.
  pareto_integrity:
    dominated_by: Standard Semaev at exp(c*sqrt(log N*log log N))
    sota_delta: {time_exponent: not_applicable, note: Regime-dependent constant speedup.}
  claim_ceiling: toy
  official_research_state_changed: false
