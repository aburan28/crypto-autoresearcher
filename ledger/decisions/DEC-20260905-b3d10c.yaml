coordinator_decision:
  id: DEC-20260905-b3d10c
  batch_id: BATCH-23ec69
  goal_id: GOAL-ECDLP-001
  context: >-
    Ranking decision for BATCH-23ec69, the two user-directed ECDLP avenues of 2026-09-05
    (exotic point representations, RQ-ECDLP-623a32; SAT/SMT technology for relation finding,
    RQ-ECDLP-f0a7b0). Eleven proposals were filed by two idea-generator tasks and snapshot-
    archived under TASK-20260905-8443e4 (commit de6ca2d52251e363677f4909749f302fae705f79,
    content_first, 18 path hashes). The independent Red Team TASK-20260905-ac087e reviewed all
    eleven on six owned joints under the review_plan recorded in its handoff, with the
    Coordinator's prior written before the round. This decision composes that report. It ranks
    and returns; it approves no experiment, creates no hypothesis, changes no status, and
    certifies no novelty.
  decision: revise
  target_ids:
  - IDEA-20260905-d0fee4
  - IDEA-20260905-24b41a
  - IDEA-20260905-579fcc
  - IDEA-20260905-ab4a6e
  - IDEA-20260905-0e0982
  - IDEA-20260905-24d827
  - IDEA-20260905-a6f98e
  - IDEA-20260905-3de445
  - IDEA-20260905-a94b5f
  - IDEA-20260905-79112a
  - IDEA-20260905-3993c3
  - RT-20260905-ac087e
  - TASK-20260905-ac087e
  - TASK-20260905-8443e4
  prior_outcome: >-
    The Coordinator's recorded prior (handoff TASK-20260905-ac087e, review_plan.prior) stands
    on its headline, no exponent-moving survivor in either set, and is overturned on two
    sub-claims. The representation set does not fail mainly as PGL_2 reparametrisations (the
    Red Team's proves-too-much control found every record's argument invariant where it must
    be, and the defects lie in controls and closure scope instead), and the sharpest SAT-set
    break is a metric-definition blindness (IDEA-20260905-3de445's narrowness threshold
    excludes the exact clause that would witness above-leaf pruning) that the prior did not
    anticipate. An overturned sub-claim is recorded as a result of the round, not absorbed.
  rationale:
  - >-
    Snapshot integrity. The Red Team verified the archive content-first at 18 of 18 paths
    against commit de6ca2d52251e363677f4909749f302fae705f79, read no sibling report (none
    existed), edited no record and made no commit (RT-20260905-ac087e, review_attestation).
  - >-
    Headline. Across the batch no proposal moves any attack exponent and none claims to;
    every record places itself below Pollard rho with a quantitative sota_delta and a
    non-null dominated_by. Within stated scopes the Red Team found the following derivations
    correct, three of them re-derived independently by the reviewer: d0fee4's average-fibre
    law (C1), 579fcc's shift-multiset dichotomy (M1)-(M2), 0e0982's gluing count and group
    structure (G1)-(G2), 24b41a's vanishing of homomorphic torsor coordinates (T2), ab4a6e's
    small-root lift-count tie (Q2), and the ceiling arithmetic of 24d827 and 79112a's batched
    row (RT-20260905-ac087e, narrowest_supported_statement).
  - >-
    Defects are concentrated and repairable. Controls that cannot fire (ab4a6e's CM positive
    control uses a square box that is not unit-stable for D = -3, escape fraction exactly 1/4;
    3de445's threshold ml - l equals the maximum length of a clause on m - 1 blocks), closures
    asserted one scope wider than their arguments reach (24b41a's quadratic biextension case
    and cross-ratio index condition; 579fcc's (M4), refuted as literally stated by a
    quadratic-character multiset statistic), and comparison bookkeeping (d0fee4's undeclared
    membership convention and false baseline-embedding clause against IDEA-20260807-dadcd2;
    79112a's missing multi-target-rho row; 3993c3's undeclared call count; a94b5f's null
    resting on a random-graph law that does not describe a gadget-rich encoding graph).
  - >-
    Batch-level objections, each adopted. (1) Citation discipline: 579fcc and ab4a6e mark
    in-repository records as recalled while leaning on them (KN-FIND-b7e091, KN-TECH-005,
    KN-LIT-004, IDEA-20260903-81a943); under AGENTS.md rule 9 a recalled reference supports
    nothing, and in the two the reviewer opened the sources do not state what the citing
    clause claims. (2) Stale absence assertion: five SAT records state that BATCH-1a527c's
    intake.md and benchmark-obligations.json were absent from the tree; both exist at the
    reviewed snapshot commit, having reached this branch when origin/main was merged after
    the producer had looked. The assertion is false against the archive; the reviewer checked
    the substantive diffs against the files' actual content and they survive. (3) Intra-batch
    duplication: a6f98e (B) and 3de445 (B) measure the same obstruction on UNSAT instances
    because D_elim(m-1, e) is at most D_NS; the producers were blinded to each other and could
    not catch this; the two are counted as one obstruction here. (4) Cross-goal scope: five
    SAT records name GOAL-SATIC-c49b77 in goal_applicability at the Coordinator's mid-run
    instruction; these are coordination pointers only and assert nothing about that campaign
    having accepted, commissioned or been unblocked by this work.
  - >-
    Ranking basis. Expected information gain per unit cost, using the Red Team's joint
    verdicts and its cheapest-decisive-test finding, under the ECC-first rule that open ECDLP
    ideas are ranked work to be designed, not shelved. Designing is not approving.
  evidence_refs:
  - coordination/ecdlp-ideas-20260905-23ec69/tasks/TASK-20260905-ac087e/red_team_report.yaml
  - coordination/ecdlp-ideas-20260905-23ec69/dispatch_queue.json
  - coordination/ecdlp-ideas-20260905-23ec69/archives/TASK-20260905-8443e4/snapshot.md
  - coordination/ecdlp-ideas-20260905-23ec69/tasks/TASK-20260905-a6ea8a/report.md
  - coordination/ecdlp-ideas-20260905-23ec69/tasks/TASK-20260905-282872/report.md
  - ledger/handoffs/TASK-20260905-ac087e.yaml
  ranking:
  - rank: 1
    id: IDEA-20260905-d0fee4
    disposition: returned for additive revision, then first design candidate
    why: >-
      The batch's cheapest decisive test is this record's Stage 1 counting loop, run with
      both membership conventions pre-registered. It adjudicates four committed predictions
      at once with no solver and no elimination, namely IDEA-20260808-2e14f7's HA-1 (about
      d*B) against (C1) (about B), the tight membership degree implicit in IDEA-20260807-dadcd2
      (L3) and IDEA-20260807-5f5ace, the contradictory Bezout ratio 4.5 (this record) versus
      exactly 2 (5f5ace and the draft EXP-MODEL-5c4f24), and ab4a6e's first prediction on
      the same loop. The successor record must declare the membership convention, correct
      the baseline-embedding clause against dadcd2 (factor 2^(m-1)), and cite EXP-MODEL-5c4f24
      before a contract is designed.
  - rank: 2
    id: IDEA-20260905-24d827
    disposition: ready for /design-experiment ranking with a caveat
    why: >-
      Pareto block, heuristic block, controls and scope discipline sound; the one load-bearing
      step is the encoding-invariance assertion, so any contract must run at least two
      modular-reduction encodings and report node counts separately.
  - rank: 3
    id: IDEA-20260905-a6f98e
    disposition: ready for /design-experiment ranking for the certificate-two arm only
    why: >-
      The Nullstellensatz-degree arm and the calibration objects are the new content.
      Certificate one is a consequence of IDEA-20260904-3c7a91 and is labelled so; the
      pipeline-level certification cost is restricted to per-instance claims or charged.
      Shares its UNSAT obstruction with 3de445 (B), so a contract on either must cite the
      other and the obstruction is counted once.
  - rank: 4
    id: IDEA-20260905-3de445
    disposition: returned for additive revision
    why: >-
      Otherwise the strongest mechanism proposal in the SAT set; the repair is a single
      declared change, report the block-support histogram by length instead of a count
      thresholded at ml - l, and a known-false object that can fire at the enumeration depth.
  - rank: 5
    id: IDEA-20260905-ab4a6e
    disposition: returned for additive revision
    why: >-
      One-line repair with the highest revision value per word in the representation set,
      a norm ball in place of the square box so the CM positive control is unit-stable; the
      recalled in-repository citations must be opened or dropped.
  - rank: 6
    id: IDEA-20260905-24b41a
    disposition: returned for additive revision
    why: >-
      The 0-bit conclusion survives; (T3) needs the second-order balance condition for
      admissible cross-ratio indices and (T2) must cover the quadratic biextension invariant.
  - rank: 7
    id: IDEA-20260905-579fcc
    disposition: returned for additive revision
    why: >-
      (M1)-(M3) correct, (M1) verified independently; (M4)'s closure must be narrowed to
      class (7) plus the shift and orbit sub-family and its recalled in-repository supports
      opened. The Red Team's obstruction reversal names the forward action, run (M3)'s
      canonicalisation measurement on the arithmetic selector already frozen by
      IDEA-20260901-863e36.
  - rank: 8
    id: IDEA-20260905-79112a
    disposition: returned for additive revision
    why: >-
      (A) survives; dominated_by must add multi-target rho, which on the record's own numbers
      dominates the batched row on time at comparable memory unless the stated regime
      condition holds.
  - rank: 9
    id: IDEA-20260905-a94b5f
    disposition: returned for additive revision
    why: >-
      The null's |Aut| = 1 prediction needs a gadget-aware baseline and the FHJRV
      symmetrisation bits must be quantified rather than dismissed.
  - rank: 10
    id: IDEA-20260905-3993c3
    disposition: returned for additive revision
    why: >-
      Priced negative in the right direction with a good control set; the two headline
      domination magnitudes must be restated as measurements with a declared call count.
  - rank: 11
    id: IDEA-20260905-0e0982
    disposition: ready for /design-experiment ranking, lowest
    why: >-
      Mathematically sound and independently verified, dominated by N^(1/2) with high
      implementation cost, and by its own statement runnable only as one contract with
      H-ECDLP-f9a627; its own recommended_priority low is right.
  limitations:
  - Proposal-only batch. No experiment was run, no hypothesis created, no contract approved.
    Every record stays status proposed and novelty_status unverified; claim tier toy.
  - One independent reviewer (Red Team) this batch; no Validator task was dispatched, so the
    review architecture here is a single owner for all six joints, declared in the handoff.
  - The reviewer's resolved model was inherited from the runtime and not probe-verified
    (model_verified false); the requested policy was review-adversarial.
  - Both producer subagents and the Red Team subagent were cut off by API session rate
    limits and resumed or had already written their deliverable; infrastructure events,
    evidence of nothing (AGENTS.md rule 3).
  - Each producer's report.md is a verbatim Coordinator transcription of the producer's
    returned text (the runtime refused subagent writes of report-named files), with a
    provenance note inside each file.
  - The representation handoff predates docs/object-frame-ideation.md; its declarations
    were supplied as an additive Coordinator message and are carried in the records.
  - The stale absence assertion in five SAT records is corrected by this decision, not by
    editing the immutable records; successors restate it.
  next_actions:
  - >-
    Open a successor idea-generator task that files additive successor records for the eight
    returned proposals with exactly the named repairs, opening every in-repository citation
    now marked recalled; originals stay immutable and proposed.
  - >-
    /design-experiment on the d0fee4 successor's Stage 1 counting loop as the batch's first
    contract candidate, with both membership conventions and all four contradictory point
    predictions pre-registered, and with the adaptive-window known-false object, the PGL_2
    battery and the translation-conjugate null; approval is a separate committed decision.
  - >-
    /design-experiment ranking of IDEA-20260905-24d827 (two encodings, node counts reported
    separately) and of IDEA-20260905-a6f98e's certificate-two arm citing 3de445 (B).
  - >-
    Notify the GOAL-SATIC-c49b77 coordinator address on the agent bus that six records name
    its goal as a pointer only; no acceptance is implied and no work is assigned.
  - >-
    Record the corpus-index finding of this batch as process guidance for the next ideation
    handoff, a file-backed crypto-kb index surfaced ten unnamed nearest neighbours the
    producers' grep screens missed, so make the index available to producers before they
    write novelty screens.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Proposal-only batch with no evidence record; nothing reached a strength that a
      knowledge entry could carry. The Red Team's independently re-derived statements
      (average-fibre law, shift-multiset dichotomy, gluing count) become promotable only
      after an executed contract and a validated evidence record.
  decided_by: coordinator
  decided_at: '2026-09-06'
