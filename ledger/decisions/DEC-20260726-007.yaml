coordinator_decision:
  id: DEC-20260726-007
  context: >-
    EXP-GGM-001 (9 runs, 3 seeds × 3 bit sizes) executed the machine-checkable
    GGM simulability test. Control gate: 4/4 correct (test sound). All 4
    augmented oracles classified: jet=SIMULABLE(C=1), endomorphism=SIMULABLE(C=0),
    elliptic_net=SIMULABLE(O(log N)), incidence=SIMULABLE(O(B^m)). The jet and
    endomorphism verdicts are scale-independent mathematical closures at
    exponent 1/2 (derivation-level, not toy-tier).
  decision: support
  target_ids:
    - H-GGM-001
    - EXP-GGM-001
  rationale:
    - >-
      Control gate 4/4: the test correctly classifies pure_generic (SIMULABLE),
      discrete_log (NON_SIMULABLE), public_curve (SIMULABLE), and encoding
      (NON_SIMULABLE). Test soundness established.
    - >-
      Jet oracle SIMULABLE with C=1: the eps-block is a deterministic function
      of (P, Q, P+Q, curve_params). Closed at exponent 1/2 by KN-TECH-005.
      This is a derivation-level result valid at all scales.
    - >-
      Endomorphism oracle SIMULABLE with C=0: phi is public and deterministic.
      Closed at exponent 1/2. This contextualizes H-STR-002: the block-structure
      advantage is non-generic (phi is available to the generic model).
    - >-
      Elliptic-net and incidence oracles SIMULABLE with non-constant overhead
      (O(log N) and O(B^m)). Not closed at 1/2 by the constant-overhead bound,
      but no sub-birthday advantage.
    - >-
      support at strong strength: the control gate is 4/4 (perfect), the
      verdicts are deterministic (not stochastic), and the SIMULABLE
      constructions are explicit simulator algorithms (derivation-level proof).
      The result is reproducible by construction.
  evidence_refs:
    - EV-GGM-001
  limitations:
    - Uses the structured GGM (public curve equation), not the strictest
      Shoup GGM (opaque labels).
    - The test operates on oracle specifications, not implementations.
    - Elliptic-net and incidence are SIMULABLE but not with O(1) overhead.
  next_actions:
    - >-
      Promote a KN-FIND entry: "Jet and endomorphism oracles are GGM-simulable
      with O(1) overhead, closing their ECDLP candidate families at exponent
      1/2 (KN-TECH-005). Elliptic-net and incidence oracles are GGM-simulable
      with non-constant overhead, providing no sub-birthday advantage."
    - >-
      Contextualize H-STR-002: the endomorphism oracle is GGM-simulable (C=0),
      meaning the block-circulant LA advantage is non-generic. The advantage
      is real (387x displacement rank reduction) but does not beat the generic
      lower bound. Update H-STR-002 interpretation_limits accordingly.
    - >-
      Close jet-based ECDLP candidates (ECDLP-IDEA-004 and related) by theorem.
  knowledge_promotion:
    promoted:
      - KN-FIND-002
    not_warranted: null
  decided_by: coordinator
  decided_at: "2026-07-26T20:00:00-07:00"
