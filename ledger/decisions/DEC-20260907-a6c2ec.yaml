  context: Independent source-bound audit found specific protocol-definition and accounting gaps in all five mathematical
    drafts; a blind standard-ring derivation confirms the higher-digit correction. Authorize additive design correction
    only.
  rationale:
  - Accept the exact missing-definition, RNG, digit-domain, incomplete-null and cost/memory findings in archived
    TASK-20260907-ab3eb8. The source counts and scoped null definitions that passed remain useful and should be
    preserved.
  - TASK-20260907-b27e3e independently derived correct digits and Teichmuller precision compatibility without reading
    producer amendments. Its PASS concerns those quantities only and does not approve the unseen contracts.
  - The Validator checker had18passes and2retained failures. One failure detects typed count fields; the other is
    a disclosed checker limitation, with the cost-model finding supplied by explicit manual decomposition. No failed
    checker is recast as a protocol pass or independent negative scientific result.
  - Complete these ranked ECC protocols rather than generate replacement ideas or widen scientific scopes. Standing
    user authorization permits design and later approval when readiness is established; no new user confirmation
    is needed.
  - Stage costs may have null advisory estimates. Memory headroom, fixed sample counts, deterministic schedules,
    controlled failure outcomes and full cost disclosure still require concrete definitions.
