  accepted_corrections:
    EXP-ECDLP-1b1b99:
    - Retain all four labeled kernel/map endpoints, but certify exactly two Fp-isomorphism-class IDs with multiplicity
      two and explicit within-pair maps under the reviewed CM assumptions. Do not enforce four pairwise nonisomorphic
      floors; distinguish labels, equations, kernel orbits and independent six-source-class replication.
    - Freeze a complete cost tensor with source class, kernel endpoint, isomorphism class, coordinate, seed, q,
      arm and timing block. Declare exact nonduplicating allocation of shared fixture discovery and transport-only
      map/level/normalization work; sum every rejected-candidate, eigenvalue, setup, repeated workload, final verification
      and baseline selection cost. Separate actually incurred campaign work, reported amortized batches and modeled
      quantities. Every allocation must sum back to raw charged totals.
    - Choose one exact primary all-floor aggregation and deterministic baseline-selection argmin domain/tie-break/reuse
      scope before data. Use ratio of equally weighted charged floor totals for primary R; any mean-of-ratios is
      secondary and explicitly distinct. Choose a defensible selection stratum, charge every candidate trial and
      freeze the seed606101 q256 winner for all intended q and seed606103 use. No selection from confirmatory timings;
      oracle-minimum remains descriptive. Explain q1 interpretation when q256 selection is charged.
    - Define source/target point types, both exact dual identities and codomain isomorphism transport; beta=[3lambda],
      beta^2=[-9], full conductor discriminant/torsion/one-ascending-edge certificates, and unavailable versus invalid
      outcomes. Correct endpoint mixing.
    - Keep the six source classes, four labeled kernels, three coordinates, two seeds and q ladder1,16,256,4096,
      seven blocks, timing resolution threshold/repeat count and gain thresholds unchanged. Define every full matrix/control
      output and all36primary-cell conjunctions; missing earlier q cells make qstar unresolved.
    - 'Provide a complete executable implementation checklist covering every archived Validator finding: no semantic
      stage callbacks or descriptive controls, persistent exact RNG counters and x-cap units, actual label permutation/identity
      transport/coordinate controls, concrete full timing/baseline/cost flow and scalar-label separation. A real
      pinned library arm must have an exact implementation/version/runtime definition; do not mislabel duplicate
      affine code.'
    - Define constructible detached-signature or one-way launch authority, trusted verifier/key provenance, exact
      spec/amendment/driver/plan/review archive/run ID/runtime/resource/path binding and one-run replay protection,
      without minting any real lock, key, signature or run. Require semantic review PASS at exact source/archive,
      not arbitrary hash-bound text.
    - Define progressive fsynced custody from first candidate, full canonical manifest and companions, atomic publication,
      typed failure/partial-data preservation, correct Darwin/Linux RSS units and process-group memory/cancellation
      inside long loops. Historical routine wall/CPU estimates remain advisory; any watchdog has an explicit machine-protection
      justification.
