coordinator_decision:
  id: DEC-20260803-f6f113
  context: >-
    GOAL-AES-003 BATCH-008 close. The batch was opened to discharge two controls
    the BATCH-005 red team named as the cheapest falsifiers in the campaign:
    RC-9, the yoyo round profile below r=5, and RC-10, a prefix-scaling test of
    the analytic null 4*2^-32 that every excess factor divides by. One producer
    ran both; the package was bound by a dispatcher-verified snapshot archive at
    8f463492 and reviewed by one independent validator, verdict passed.
  decision: support_with_scope_reduction
  target_ids: [RQ-AES-003, GOAL-AES-003, EV-AES-8b8dcf]

  rationale:
    - >-
      THE BATCH'S REAL YIELD IS NOT THE ONE IT WAS OPENED FOR, AND SAYING SO
      PLAINLY IS THE POINT OF THIS RECORD. RC-9 could not have falsified
      anything: at r <= 4 the statistic is deterministic by BATCH-007's
      Proposition 1, the excess is identically 2^30 at rate 1.0 regardless of the
      data, and both competing hypotheses predict the same value there. RC-10's
      stated premise was false: the null had already been measured eleven times,
      aggregate 57 against 58.0. What the batch DID produce is worth more than
      either: a byte-local mechanism for the r=5 excess is now excluded by about
      four orders of magnitude, and the instrument change carrying that result is
      the most thoroughly verified in this campaign's history.
    - >-
      THE EQUIVALENCE PROOF IS THE MODEL FOR HOW AN INSTRUMENT CHANGE SHOULD BE
      CHECKED. The validator did not accept the producer's bit-exact reproduction
      as sufficient. It reconstructed v3 from the shipped diff byte-exactly,
      confirmed the single apparent deletion was a format string with an
      unchanged value expression, established that the added block calls no RNG
      function and writes only its own zero-initialised field, rebuilt the binary
      to byte-identity, and then wrote its own prefix counter by a different
      algorithm that reproduced every count. A shared-state bug in an added
      counter is exactly the defect a producer's own equivalence run cannot see,
      and five independent grounds is what closing that gap looks like.
    - >-
      THE HEADLINE WAS OVERSTATED BY THE COORDINATOR AND IS REDUCED HERE. "The
      excess is absent at k=1,2,3 and appears only at the full 32-bit word" is
      half established. The negative half is strong and was understated by the
      producer. The localisation half is not: by nesting, the 13 excess k=4
      events are already inside the k=3 count, and removing them leaves 266
      against 255.0 at z = +0.69. The supportable statement is that the excess is
      NOT byte-local and IS present at the full word; 32-bit versus 24-bit is
      unresolved at this exposure. The producer's own body text conceded this
      while its summary line did not, and the Coordinator propagated the summary
      line rather than the body.
    - >-
      THE MOST USEFUL RESULT IN THE BATCH WAS FOUND IN DATA THE CAMPAIGN ALREADY
      HAD. BATCH-006's 27 random-S-box arms at r=5 give mean 15.48 against AES
      readings of 12 and 14, putting AES at roughly the 41st percentile of its own
      null distribution, P(X >= 14) = 0.681. THE r=5 EXCESS IS NOT
      AES-S-BOX-SPECIFIC. Combined with the byte-locality exclusion, the campaign
      now has two localisations pointing the same way: the excess belongs to the
      five-round SPN shape and the 4-byte word framing, not to the AES S-box.
      Nobody had asked the campaign's own null object this question.

  evidence_refs:
    - EV-AES-8b8dcf
    - CORR-20260803-8fa302
    - CORR-20260803-7d41c8
    - EV-AES-a47618

  the_coordinator_error_recorded_in_this_decision:
    what: >-
      CORR-20260803-7d41c8, written to establish that absence claims must cite
      the directories searched, itself asserted an unsearched absence: that
      RC-10's premise "remains correct as stated". Eleven prior null arms refute
      it.
    why_it_is_recorded_in_a_decision_and_not_only_in_a_correction: >-
      Because it is the fourth instance in two days and the third by the
      Coordinator, and because the remedy the third instance prescribed was an
      exhortation that demonstrably failed within one document of being written.
      A rule that is violated by the document establishing it is not a rule yet.
    the_mechanical_remedy_adopted: >-
      A batch objective, correction or review may not assert that something was
      never measured unless the SAME DOCUMENT records the search performed --
      the glob or grep executed, the number of files scanned, and the date. An
      unsearched absence claim is treated as an unrun measurement, because that
      is what it is. This binds Coordinator objectives, corrections and decisions
      from this record forward, and is written into the GOAL-AES-003 next_action
      so that it is carried rather than remembered.
    why_the_machinery_never_catches_these: >-
      Reproducing a measurement cannot test an assertion that a DIFFERENT
      measurement is missing. All four instances survived every reproduction
      check in the campaign because none of them is a number that a rerun can
      disagree with.

  what_this_decision_does_not_do:
    - It does not claim the r=5 effect is a 32-bit rather than a 24-bit phenomenon.
    - It does not claim the round profile corroborates a decay reading; that claim is withdrawn.
    - It does not treat "the falsifier did not fire" as evidence, because the falsifier could not have fired.
    - It advances no closure criterion. No model independence exists under standing basis 0137a051eb5828789eb267fa83c8278086578d4c.

  review_coverage_shortfall:
    what: ONE REVIEWER, NOT TWO, for the second batch running.
    disposition: >-
      Reflected in EV-AES-8b8dcf's strength of moderate rather than repaired
      retroactively. Recorded as a standing weakness of the last two batches
      rather than a property of this one.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED YET, AND THE CANDIDATE IS NAMED SO THAT THIS IS NOT A
      REFLEX. The promotable finding is the LOCALISATION PAIR: the r=5 excess is
      neither byte-local nor AES-S-box-specific, so it is a property of the
      five-round SPN shape and the word framing. Both halves are single-session
      measurements reviewed by one party, the S-box half was computed from
      another batch's arms in the course of reviewing this one and has never been
      the declared object of any batch, and the word-framing half is exactly the
      claim this decision just reduced in scope. Promote after the BATCH-009
      null object returns, and record whether it changed the picture.

  next_actions:
    - >-
      SINGLE NEXT ACTION: GOAL-AES-003 BATCH-009 rank 1 remains the
      inventor-protocol section 3 NULL OBJECT for the r=5 statistic -- a random
      bijection in place of the reduced-round cipher, amask=1, matched trials --
      and this batch STRENGTHENS the case for it rather than displacing it. Every
      open interpretive question in the campaign sits at r=5, and OBS-B8-7 has
      just narrowed the target: whatever explains the excess must be a property
      of the five-round structure, not of the S-box. Rank 2: RC-11, the
      trial-index pairing that would let the matched r=5 and r=10 arms be
      analysed paired rather than unpaired -- cheap, and it is the control that
      would sharpen OBS-B8-3's [2.13, 592] interval. Rank 3: a red team pass,
      which two consecutive batches have now lacked.

  what_is_explicitly_not_ranked_and_why:
    - >-
      A deeper k=3-to-k=4 rung at r=10 would need about 2^38 trials, roughly 20
      hours. NOT RANKED: the null is already pinned to plus or minus 0.05 percent
      at k=1 and a null error large enough to matter was excluded before this
      batch ran. Revisit only if a future result depends on the deep rung.
    - >-
      Resolving 32-bit versus 24-bit localisation needs far more k=4 events than
      2^30 trials yield. NOT RANKED AHEAD OF THE NULL OBJECT: if the r=5 effect
      turns out to be a probe-geometry property, the localisation question
      dissolves. Ordering the null object first is the cheaper branch.

  budget_accounting:
    producer_declared_seconds: 5400
    producer_consumed_seconds: 1310
    note: >-
      Well inside budget. The measurements themselves are about two minutes; the
      budget was for the instrument change and its equivalence proof, which is
      where the time went and where it should have gone.

  limitations:
    - Nothing here is a statement about full-round or deployed AES, and no comparison to published cryptanalysis is made in either direction.
    - Toy tier; one key, one base, one machine, r in {3,4,5,10}.
    - Session and implementation independence only; NO model independence, so nothing counts toward a closure quorum.
    - One reviewer, not two.
    - The matched r=5 and r=10 arms are paired by design but analysed unpaired.

  decided_by: coordinator
  decided_at: 2026-08-03

  inference:
    policy: coordinator-orchestration-code
    requested_policy: coordinator-orchestration-code
    resolved_model: claude-opus-5
    fallback_used: true
    model_verified: false
    standing_basis: 0137a051eb5828789eb267fa83c8278086578d4c
