coordinator_decision:
  id: DEC-20260809-e9ac4b
  goal_id: GOAL-SSI-001
  batch_id: BATCH-b47cd5
  recorded_by_task: TASK-20260809-212ab3
  archived_by: TASK-20260809-212ab3
  context: >-
    BATCH-b47cd5 opened an additive v6 successor to EXP-SSI-357363 after the
    c057fd Validator and Red Team found the finite contract incomplete. Fresh
    independent Validator and Red Team sessions reviewed the immutable v6
    snapshot. Neither executed an experiment or diagnostic.
  decision: refine
  decision_scope: >-
    Retain EXP-SSI-8fbe66 as an improved but incomplete design candidate and
    open a further additive clarification. This decision does not freeze the
    contract, authorize execution, change hypothesis or experiment status, or
    make any SSI, SQIsign, attack, security, novelty, or exponent claim.
  target_ids: [IDEA-20260806-9c2f80, EXP-SSI-357363, EXP-SSI-8e589d, EXP-SSI-8fbe66, GOAL-SSI-001]
  evidence_ids: [EV-SSI-5e770f]
  review_ids: [VAL-20260809-ed64bf, RT-20260809-c96ef6]
  review_task_ids: [TASK-20260809-ed64bf, TASK-20260809-c96ef6]
  snapshot_commit: 9b476537a3018ea94d66e775ea4784f3a9348b10
  queue_binding_commit: c10a6b633
  rationale:
    design_progress: >-
      The v6 successor adds explicit logical middle-factor width, bounded-frame
      intent, target-derived key intent, finite terminal outcomes, HNF/output,
      external certificate, replay, null, C-pair, and synthetic diagnostic
      clauses. Both reviews confirm these are design improvements only.
    independent_validation: >-
      Validator VAL-20260809-ed64bf returned incomplete with
      DISSENT_ON_FREEZE_AND_EXECUTION_READINESS. It verified the snapshot and
      predecessor immutability, then recorded unresolved direct-predecessor,
      schema, helper, framing, query/index, saturation/FOE, output, certificate,
      replay, null, C-pair, and synthetic-reference defects.
    independent_red_team: >-
      Red Team RT-20260809-c96ef6 returned DISSENT on freeze and execution
      readiness. It independently found unresolved helper physical lookup and
      digest layout, order/query oracle boundary, counter bounds, finite cost,
      output/certificate, replay/null, C-pair, and synthetic-reference defects.
    execution_authorization:
      granted: false
      reason: >-
        The logical C-helper width and substantial contract detail improved, but
        the finite contract still lacks complete helper/index/query semantics,
        canonical cryptographic-scale framing, computable saturation and cost,
        output and certificate accounting, byte-identical replay, valid nulls,
        and calibrated diagnostics. No execution task may be opened from this
        decision.
    claim_boundary: >-
      No measurement, run, attack, security, exponent, novelty, hypothesis
      transition, or goal completion follows from either review.
  official_research_state_changed: false
  hypothesis_status_transition: none
  experiment_status_transition:
    - id: EXP-SSI-8fbe66
      from: review_required
      to: review_required
      note: >-
        The v6 successor remains review_required, unfrozen,
        execution_authorized:false, evidence_eligible:false, and approved_by
        null. EXP-SSI-357363 and all earlier predecessors remain immutable.
  asymptotic_promotion_gates:
    gate_1_proof_decomposition: open
    gate_2_numbered_heuristics: open
    gate_3_concrete_cost_table: open
    gate_4_independent_review_and_red_team: >-
      Completed only as an execution-blocking design review; all scientific
      promotion gates remain open.
  next_actions:
    - >-
      Open an additive successor to EXP-SSI-8fbe66 that first corrects the
      direct-predecessor and c057fd provenance metadata, then specifies the
      complete C-HELPER-v1 physical table, ORDER-MANIFEST-v1 universe and
      setup, and target-derived query/index lookup.
    - >-
      Close canonical frame/counter bounds, finite saturation/terminal/FOE and
      q/T_inc/break-even equations, HNF/output witness algorithms, and the
      end-to-end EDGE-CERT-v1 availability, transition, storage, and cost model.
    - >-
      Make replay traces/witnesses, null permutations and small-cardinality
      controls, dependent C-pair calibration, and synthetic reference binding
      byte-recomputable. Snapshot before another independent review.
    - >-
      Keep EXP-SSI-8fbe66, EXP-SSI-357363, and all SSI advice-frontier
      experiments unapproved, unfrozen, and unexecuted.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This batch measured nothing and promotes no technique, theorem, attack,
      exponent, security conclusion, or knowledge item.
  claim_ceiling: >-
    The strongest true statement is that EXP-SSI-8fbe66 materially expands the
    design contract and repairs the logical middle-factor width, but remains
    execution-unauthorized and underdefined. This is not evidence about the
    SSI problem or any deployed security level.
  decided_by:
    task: TASK-20260809-212ab3
    role: coordinator
    policy: coordinator-orchestration-code
  decided_at: '2026-08-09'
