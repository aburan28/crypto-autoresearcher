coordinator_decision:
  id: DEC-20261007-e6a276
  recorded_at: '2026-10-07'
  decided_at: '2026-10-07'
  decided_by: coordinator
  question_ids:
    - RQ-ECDLP-623a32
  goal_id: GOAL-ECDLP-001
  archived_by: TASK-20261007-faa4e6
  mode: design_experiment_withheld_capacity_and_driver
  standing_authorization: >-
    AGENTS.md standing user authorization (user instruction, 2026-09-06:
    "all is approved. ideas/experiments should be always approved")
    would be the user-approval basis for a complete runnable protocol.
    It is not applied here. check_approval_capacity would reject an
    approving decision, and the fiber-census driver does not exist, so
    the contract cannot report execution_state ready. This decision
    does not assert that the maximum fiber equals 4, does not assert
    that every fiber has size at most 3, and does not rewrite
    IDEA-20261006-bc1250.

  decision: revise
  decision_label: >-
    Specify H-ECDLP-67fc66 and leave EXP-ECDLP-ced7a5 at
    review_required. approved_by stays null. The executor is not
    dispatched.

  target_ids:
    - RQ-ECDLP-623a32
    - IDEA-20261006-bc1250
    - H-ECDLP-67fc66
    - EXP-ECDLP-ced7a5
    - TASK-20261007-18b3b6
    - TASK-20261007-faa4e6
    - IDEA-20261007-dc7612
    - IDEA-20261007-71c7df
    - IDEA-20261007-6c7d84

  context: >-
    One cycle of design-experiment plus propose-ideas.
    IDEA-20261006-bc1250 is on origin/design/ssi-e211ac-distance and
    is not on origin/main. The question is RQ-ECDLP-623a32. The
    question text names representations as a standing avenue of
    GOAL-ECDLP-001. No hypothesis or experiment on origin/main cites
    that full idea id. The branch design/ecdlp-bc1250 was created
    from origin/main at 5d59c642c01ab8cfdc3c50b2450b50eebe0937c4
    and then fast-forwarded to
    9e25fddba6d9d9a397521b2b0456e7ff18edb1c8. No conflict. The copied
    proposal bytes are blob
    9203067c9a9fc4e1061af6161d6694382994f91e and parsed as YAML
    without a quote change. The question id is RQ-ECDLP-623a32. The
    prediction is that the maximum tangent-slope fiber equals 4, at
    least 1 above the failure outcome in which every fiber has size
    at most 3.

    python3 tools/portfolio_kpis.py --capacity GOAL-ECDLP-001 reports
    approved_unrun=7, cap=3, headroom=0. The seven contracts are
    EXP-ECDLP-08f99d, EXP-ECDLP-96c4dc, EXP-ECDLP-b2e5d1,
    EXP-ECDLP-c74a83, EXP-LHW-22aefa, EXP-SEMAEV-a097b5, and
    EXP-SMTH-9d04ba. This decision does not name any of them under
    supersedes_experiments or withdraws_experiments.
    check_approval_capacity is the validator check that would reject
    an approving decision. The contract therefore stays
    review_required.

    The missing driver is a program that enumerates
    y^2 = x^3 + x + 6 over F_73, histograms
    λ = (3x^2 + 1)/(2y), counts roots of the degree-4 slope
    polynomial, checks λ(-P) = -λ(P), and reruns the count after
    μ(x) = (x+1)/(x+2). A search of origin/main for the phrases
    "maximum fiber" and "fiber cardinality" under *.py returned no
    path. experiments/EXP-ECDLP-895a0f/implementation/stage0_dblslp.py
    evaluates one doubling slope on one F_19 point and does not
    histogram fibers. There is no trial-plan.json. The only file
    under runs/ is .gitkeep. newest_experiments.py does not report
    execution_state ready while status is review_required.

    Success is the source idea's prediction. The concrete negative
    is that every attained slope has at most 3 preimages, with the
    instrument checks passed. No fiber was counted in this session.
    The same pass files IDEA-20261007-dc7612, IDEA-20261007-71c7df,
    and IDEA-20261007-6c7d84 and does not design them.

  rationale:
    - The standing authorization covers a complete runnable protocol. This one is over the approval cap and has no fiber-census driver, so it is not approved.
    - check_approval_capacity is the named validator check. GOAL-ECDLP-001 has approved_unrun=7 against cap 3. An approving decision would be rejected. This decision does not force approved.
    - The missing driver is the tangent-slope fiber census on y^2 = x^3 + x + 6 over F_73. No program on origin/main reports that maximum fiber.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - A maximum of at most 3, with the instrument checks passed, is reachable as a recorded outcome, so success is not automatic.
    - The sign relation, the two enumerations, the root agreement, and the exclusion of random polynomials are the instrument controls.
    - An instrument failure is not relabeled as a fiber of size at most 3.
    - This session did not count a fiber and did not claim that the exponent 1/2 moves.
    - No run id was minted. The replication plan does not name a future run slot while the trial plan is unfrozen.

  evidence_refs: []
  limitations:
    - The measurement, once run, covers one curve over F_73. It does not transfer to another curve or to cryptographic size.
    - A fiber of size 4 does not lower the rho exponent 1/2.
    - A degree contradiction and a crash are not the negative.
    - This decision does not authorize execution.
    - This decision does not edit a goal head.
    - The three new proposals are not hypotheses and are not approved experiments.

  next_actions:
    - A later session may approve EXP-ECDLP-ced7a5 only after check_approval_capacity reports headroom on GOAL-ECDLP-001 and a fiber-census driver exists. Both were absent on 2026-10-07.
    - Do not dispatch TASK-20261007-18b3b6 from the design session that wrote this decision.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Design only, and not approved. No run, no evidence record, and
      no durable finding. The fiber cardinality is not a reviewed
      result.
