coordinator_decision:
  id: DEC-20260730-003
  context: >-
    User policy directive: no goals are to be paused. GOAL-MLKEM-002 was set to
    status=paused by DEC-20260730-006 after BATCH-004 because three-model
    closure quorum could not be obtained on this harness (all reviewers fell
    back to the same resolved_model_id). Pause as a campaign disposition is
    rejected; laboratory research disposition in EV-MLKEM-010 / DEC-20260730-006
    is otherwise unchanged.
  decision: rescind_pause
  target_ids:
    - GOAL-MLKEM-002
    - DEC-20260730-006
  rescinds:
    decision_id: DEC-20260730-006
    rescinded_fields:
      - goal_disposition.status=paused
      - pause as terminal campaign disposition for quorum unavailability
    preserved_from_DEC-20260730-006:
      - official package class second_impl_unavailable
      - H-MLKEM-009 supported_within_laboratory_boundary_gnu_ld_wrap
      - instrument_adequacy_repair admitted_gnu_ld_wrap_linux_amd64
      - completion_quorum.quorum_satisfied=false
      - claim_tier laboratory_implementation_conformance
      - knowledge_promotion not_warranted
  rationale:
    - >-
      User directive forbids pause as a disposition for active campaign work.
      Quorum unavailability blocks status=completed; it does not authorize
      status=paused.
    - >-
      DEC-20260730-006's laboratory adjudication stands: package class
      second_impl_unavailable; GNU ld --wrap adequacy admitted; Validator
      accept_with_qualifications; Red Team confirm (RT-20260730-006). Those
      findings are not reopened.
    - >-
      GOAL-MLKEM-002 returns to status=active with exactly one next_action: the
      quorum-collection / ledger-complete path. No new experimental batch is
      authorized under maximum_batches=4 without an explicit campaign-budget
      amendment.
    - >-
      Fabricating completion_quorum attestations remains forbidden. Closure
      still requires three CONCUR attestations with pairwise-distinct
      resolved_model_id.
  evidence_refs:
    - EV-MLKEM-010
    - DEC-20260730-006
    - coordination/goals/GOAL-MLKEM-002/batches/BATCH-004/tasks/TASK-20260724-943/red_team_report.yaml
  limitations:
    - Does not mark GOAL-MLKEM-002 completed.
    - Does not invent or alter completion_quorum attestations.
    - Does not reopen BATCH-005 or amend maximum_batches=4.
    - Does not recharacterize EV-MLKEM-008/009/010 as H-MLKEM-004 support.
    - Does not authorize attack, oracle, exploitation, or key-recovery work.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Disposition-only Coordinator amendment under user pause policy; no new
      laboratory finding beyond DEC-20260730-006 / EV-MLKEM-010.
  goal_disposition:
    status: active
    prior_status: paused
    prior_decision_id: DEC-20260730-006
    completion_blocked_on: >-
      Three pairwise-distinct resolved_model_id CONCUR completion_quorum
      attestations reviewing EV-MLKEM-010 / DEC-20260730-006 / RT-20260730-006.
    note: >-
      Pause disposition of DEC-20260730-006 is rescinded. Goal remains active
      until quorum→completed ledger archive, or until a future Coordinator
      decision under an explicit user-authorized terminal disposition other
      than pause.
  next_actions:
    - >-
      Collect three CONCUR completion_quorum attestations with
      pairwise-distinct resolved_model_id reviewing EV-MLKEM-010 /
      DEC-20260730-006 / RT-20260730-006; then Coordinator ledger archive
      setting GOAL-MLKEM-002 status=completed and quorum_satisfied=true.
      Until then keep status=active. Do not fabricate attestations. Do not
      reopen experimental batches without an explicit campaign-budget
      amendment.
  decided_by: coordinator
  decided_at: '2026-07-30'
