coordinator_decision:
  id: DEC-20260804-5538d4
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-100
  recorded_by_task: TASK-20260804-140
  archived_by: TASK-20260804-143
  context: >-
    BATCH-100: Track A (special prime classes) — no systematic difference in C(p);
    p≡1 vs p≡3 mod 4 both give C≈3.7 at bits~14. Track B — two new H-PSEUDO ideas:
    IDEA-28c15f (ECCG security → H-PSEUDO conditional), IDEA-24b025 (linear complexity proxy).

  decision: advance_eccg_conditional
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    Track A: C(p) is uniform across p≡1 vs p≡3 mod 4 (both ~3.7 at bits~14).
    No prime class shows lower C. CM primes theoretically special but cryptographically excluded.

    Track B: Two new proposals admitted:
    - IDEA-28c15f (ECCG → H-PSEUDO): HIGH PRIORITY. If a valid reduction exists from
      H-PSEUDO falseness to ECCG distinguishability, H-PSEUDO would follow as a
      CONDITIONAL THEOREM from the well-believed ECCG security assumption. This is the
      most promising new direction: it would give a proof without requiring new algebraic
      machinery. The key question: does the reduction require seeing all N ECCG outputs
      (circular) or just a polynomial-length prefix?
    - IDEA-24b025 (linear complexity proxy): MEDIUM PRIORITY. Mathematical analysis needed.

    GOAL-ECDLP-001 stays active.

  exact_next_action: >-
    BATCH-101: Investigate the ECCG → H-PSEUDO conditional reduction (IDEA-28c15f).
    Specifically: (1) does knowing large |hat{1_F}(k)| give a POLYNOMIAL-TIME ECCG
    distinguisher from a short (poly-length) prefix? (2) Does the ECCG security assumption
    as standardly stated (indistinguishability from random in polynomial queries) imply
    H-PSEUDO? (3) What is the exact reduction (if any)?

  knowledge_promotion:
    promoted: []
    not_warranted: Proposals not yet analyzed.
  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2
    sota_delta: {time_exponent: not_applicable}
  claim_ceiling: theoretical
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-04'
