  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - Agreement on both pairs with a ratio strictly below 2 is reachable as a recorded outcome, so success is not automatic.
    - The (P, P) value check, the discriminant -60 refusal control, the ancilla-definition guard, and the no-reuse guard are the instrument controls.
    - An instrument failure is not a ratio and is not the concrete negative.
    - The launcher is committed and its machinery is validated at other discriminants, so this approval is bounded by execution as AGENTS.md requires.

