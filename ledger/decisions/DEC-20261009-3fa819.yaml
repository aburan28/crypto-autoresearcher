    discriminants -23 and -83 (run.py --self-test: both circuits
    agree with each other and with the classical mirror on every
    composable pair; widths and gate counts constant across pairs;
    inputs unchanged; classical group table verified) and hand-verified
    the algebraic control identities at -59. The frozen -59 cell was
