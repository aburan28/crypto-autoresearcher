  id: DEC-20261017-3e00ee
  id_provenance: >-
    Minted with `python3 tools/allocate_id.py --next coordinator_decision
    --date 20261017` and confirmed free with `--check` by the design session
    on 2026-10-17.
  recorded_at: '2026-10-17'
  decided_at: '2026-10-17'
  decided_by: coordinator
  goal_id: GOAL-ICPERF-e6b6a4
  question_ids:
    - RQ-ICPERF-94c86e
  mode: design_experiment_approval
  kind: protocol_approval
  design_packet_archive: >-
    Committed by exact path by the design session that drives this role;
    TASK-20261017-4c890d archives the run artifacts after execution.
  standing_authorization: >-
    AGENTS.md "Standing user authorization for ideas and experiments" (user,
    2026-09-06). Cited to approve the complete frozen protocol for
    EXP-ICPERF-9cd390 without per-experiment user confirmation. It does not
    assert the hypothesis is true or that any result is validated, and it
    does not rewrite IDEA-20261015-b41f68.

  context: >-
    IDEA-20261015-b41f68 (idea-synthesist, 2026-10-15, class control,
    priority high) reads the n = 83 IC online time as a geometric probe
    count times the host's random-access latency over the root table, and
    rho online time as steps times compute, with a pointer-chase null object
    and the geometric model as the two nulls. The crypto repository froze a
    one-host protocol for claims (1), (2) and (4) at commit
    286bc22cc7c4f93a354b667981bf786f2f9fa671 (research/ic_probe_latency_20261017:
    PROTOCOL.md, run_step.sh, sources.sha256; claim arithmetic in
    examples/ic_probe_latency.rs). This decision specifies H-ICPERF-b3d1a4,
    transcribes the protocol into the frozen contract EXP-ICPERF-9cd390 and
    dispatches TASK-20261017-d53b9c, with TASK-20261017-4c890d as the
    isolated snapshot archive of the run artifacts.

  decision: approve
  decision_scope: >-
    Approves EXP-ICPERF-9cd390 at version 1 (ten trials RUN-ICPERF-caa0c1,
    -620cfc, -c17b55, -9a8b93, -78de0f, -8d4b4e, -d9b642, -7bd68a, -a3c228,
    -407b07, in that order) and moves H-ICPERF-b3d1a4 to approved (pre-run).
    Authorizes execution through experiments/EXP-ICPERF-9cd390/trial-plan.json
    under TASK-20261017-d53b9c. Authorizes no second host, no extra base or
    K, no IC speed-up claim and no cross-method ranking.

  target_ids:
    - GOAL-ICPERF-e6b6a4
    - RQ-ICPERF-94c86e
    - IDEA-20261015-b41f68
    - H-ICPERF-b3d1a4
    - EXP-ICPERF-9cd390
    - DEC-20261017-3e00ee
    - TASK-20261017-d53b9c
    - TASK-20261017-4c890d

  protocol_completeness:
    EXP-ICPERF-9cd390:
      hypothesis: present (statement, mechanism, numbered heuristics H1 and H2 with falsification conditions, predictions, test_boundary, falsification_conditions, interpretation_limits; proof_search_map not applicable with reason)
      controls: present (8 GiB dependent chase and independent gather in the same trial, T1.null positive control, T1.applied check, G.scalars/G.probes same-workload gate, rho before/after, ABAB drift, chase size sweep)
      metrics: present (primary H1.<base>, L1, T1, G.scalars, G.probes; secondary T1.applied, T1.null, L1g, R, D, per-run ns/probe, geomfit tails, chase sweep, memory)
      preregistered_prediction: present (proposal predictions (1), (2), (4) copied unchanged; T1 gate is the protocol's addition)
      disclosure: present (designer smoke tests; stage-0 readings already seen for k1271_regular and k1798_dense, both NOT_SUPPORTED)
      replication: present (ABAB on the same 64 targets and seeds; rho before and after)
      budget: present (advisory; 10,800 s per IC run, 600 s per rho run, about 12 h, 10 runs, 14 GiB per trial as machine protection)
      stopping_rules: present
      invalidation_rules: present (G.scalars FAIL invalidates; G.probes FAIL with G.scalars PASS is a recorded deviation)
      success_criterion: present, decidable from claims.json
      falsification_criterion: present, decidable from claims.json, differs from success
      decision_impact: present (on_positive and on_negative differ)
      required_artifacts: present (ten run directories, claims.json, run report with graph and PDF, crypto results report, crypto benchmarks copy with README row, snapshot receipt)
      amendment_rule: present
      test_boundary_limits: >-
        Claim (3) cross-host is out of scope (one host). The cache-resident
        small-table control is not run (rank cost grows as 1/K), so c0 is
        unseparated. Both are recorded as limits, not defects.
  runnability_check: >-
    Launcher bound: experiments/EXP-ICPERF-9cd390/implementation/run.py
    refuses to run unless run_step.sh, sources.sha256 and PROTOCOL.md hash to
    their frozen values, and run_step.sh checks every frozen source and the
    target and answer hashes before each step; check.py verifies outputs
    against the manifest and requires all 14 claim ids. The archived inputs
    (targets.jsonl, answers.jsonl, primary_target.jsonl, rho_config.json and
    the five panel targets_result.jsonl files) are on disk in the crypto
    checkout. The design subagent cannot run tools; this decision takes
    effect only when the committing session confirms `python3
    tools/newest_experiments.py --experiment EXP-ICPERF-9cd390` reports
    execution_state ready and `python3 tools/validate_ledger.py` passes on
    the committed tree (AGENTS.md "Approval is bounded by execution"). If
    either fails, the contract is not committed as approved; it is rewritten
    as review_required with the reason before any commit.
  capacity_check: >-
    The approved-unrun cap was removed on 2026-10-11 (AGENTS.md "Approval is
    bounded by execution"); approval rests on the runnable condition only.
  resource_limits_check: >-
    Declared limits checked against the host: the 8 GiB table (archived peak
    RSS 8.7 GB) and the 8 GiB chase array run in separate processes in
    sequence on a 15 GiB host; 14 GiB per trial is machine protection;
    caps are 10,800 s per IC run and 600 s per rho run; about 12 h wall
    clock for ten runs. All advisory except the machine-protection memory
    limit and the frozen timeouts.

  official_transitions:
    hypothesis_status_changed: true
    hypothesis_id: H-ICPERF-b3d1a4
    hypothesis_from: proposed
    hypothesis_to: approved
    experiment_status_changed: true
    experiment_id: EXP-ICPERF-9cd390
    experiment_to: approved
    approved_by: DEC-20261017-3e00ee
    idea_status_changed: false
    idea_status_note: IDEA-20261015-b41f68 stays proposed; its claim text is immutable.
    goal_status_changed: false
    goal_remains_active: true
    goal_head_edited: false

  rationale:
    - >-
      The proposal's claims decide how every Koblitz vs_rho row on this goal
      is read: if IC ns/probe is one host latency, a raw IC/rho ratio carries
      the host's memory system as a factor, and one-point ratios carry a
      geometric spread. The measurement is cheap relative to that reach.
    - >-
      The protocol is complete and its bands are the proposal's own
      predictions and falsification conditions, copied before any run; every
      verdict is computed by the claims step in Rust, never by hand.
    - >-
      The controls separate the readings that could otherwise be confused:
      the null object runs on the same page size in the same trial, the
      huge-page reading is gated on the kernel backing the table and on the
      null object seeing a gain (INSTRUMENT_CANNOT_SEE otherwise, never
      FALSIFIED), and G.scalars/G.probes tie the on-host workload to the
      archived one.
    - >-
      This experiment is also the heuristic-validation measurement for the
      proposal's heuristics H1 and H2 at the claim's own scale.
    - >-
      It is a cost-model attribution measurement, not an IC improvement: it
      adds no gap-to-rho row and ranks no methods (crypto CLAUDE.md success
      criterion; crypto AGENTS.md section 5a).

  evidence_refs: []
  limitations:
    - Approval does not assert H-ICPERF-b3d1a4 is true.
    - One host; proposal claim (3) is untested and nothing transfers to another host.
    - c0 is unseparated because the cache-resident control is not run; L1's band admits a compute term of up to one latency.
    - The H1 readings for k1271_regular and k1798_dense were seen by the designer before the freeze; they are disclosed, not blind.
    - If G.probes passes, the on-host H1 panel repeats the archived k1798_dense counts and adds no independent sample.
    - The rho-under-huge-pages half of proposal claim (4) is not tested; R is session drift only.
    - A single session on one host; an adverse reading supports weaken plus replication, not lane closure.

