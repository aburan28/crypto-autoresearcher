# DEC-20261017-3e00ee -- Approve H-ICPERF-b3d1a4 / EXP-ICPERF-9cd390 under the
# standing user authorization. Source IDEA-20261015-b41f68 (RQ-ICPERF-94c86e,
# GOAL-ICPERF-e6b6a4). Ten trials, one host, design frozen at crypto commit
# 286bc22cc (PR aburan28/crypto#2069). Zero runs at decision time.
