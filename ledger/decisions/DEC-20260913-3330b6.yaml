  official_disposition:
    corrected_run_validity:
      run_id: RUN-ECDLP-1bef8f-S0
      prior_recorded_value: valid
      corrected_value: invalid
      mechanism: additive_correction_CORR-20260913-a3ffdb
      original_bytes_changed: false
    hypothesis_status_changed: false
    experiment_specification_changed_in_place: false
    goal_status_changed: false
    evidence_record_created: false
    interpretation: >-
      Invalid fixture/instrument receipt only. This is not negative evidence
      about H-ECDLP-b97b72, gamma_m, a height-box attack, or ECDLP.

  rationale:
    - >-
      VALIDITY. J3 and J6 are required Stage 0 gates. A required control that
      proves a tautology, accepts malformed payloads, or returns a literal
      expected answer cannot support completed_valid even when its output
      label and unaffected numerical anchors agree.
    - >-
      PREMISE SEPARATION. The algebraic implication is conditional:
      B=c_H*H^2 and B^m=n imply H^(2m)=n/c_H^m. It is tested prospectively on
      exact tuples satisfying both premises and must refuse tuples violating
      either. The frozen cell instead records H^4/p=10000/10007=0.99930 and
      B^2/n=19044/9851=1.9332; these are different ratios. With c_H=127/100,
      H^(2m)/(n/c_H^m) is 16129/9851 at m=2 and 2048383/9851 at m=3, not 1.
    - >-
      CONTROL POWER. The correction makes KF-1 payload- and premise-driven;
      compares KF-2 against the exact nine-key set and mutation-tests deletion
      of (0,0) and (1,1); makes KF-3 validate a structured payload and accept a
      complete synthetic schema fixture while refusing Stage 0 gamma and missing
      witnesses; and derives both tail gates from a recursive assembled-payload
      scan with injected gamma and certificate mutations.
    - >-
      IMMUTABILITY. A distinct run ID and run directory preserve the invalid
      receipt and every old artifact. The correction does not silently re-score
      or overwrite the version-1 run, specification, implementation, reports,
      proposal, hypothesis, decisions, or goal.
    - >-
      SCOPE. One Stage 0 correction run is the cheapest decisive action. It
      reruns all unaffected anchors and controls so agreement can be compared
      with the immutable observations, while prohibiting gamma, lattices,
      scalar recovery, and ECDLP interpretation. Stage 1 remains a separate
      later authorization question.
    - >-
      STANDING AUTHORIZATION. AGENTS.md records the user's 2026-09-06 direction
      that ideas and experiments are always approved once complete. The
      amendment has controls, a one-run scientific limit, stopping and
      invalidation rules, exact artifacts, write scopes, and a bounded claim
      ceiling. No renewed user confirmation is required.

  evidence_refs:
