  context: >-
    RUN-ECDLP-1bef8f-S0 reported completed_valid, but the completed Stage 0
    review round found two decisive instrument breaks. J3 checked the tautology
    (n/c_H^m)c_H^m=n rather than H^(2m)=n/c_H^m, and the frozen cell does not
    satisfy B^m=n: B^2/n=19044/9851=1.9332. J6 found that KF-1 does not enforce
    premises, KF-2 accepts incomplete grids, KF-3 accepts no payload, and the
    certificate/no-gamma gates are literal True. J1, J2, J4, blind J5, J7, J8,
    and the invalid-input controls hold narrowly, but an invalid run cannot
    promote any of them to evidence. The additive amendment separates the
    exact conditional identity from the frozen cell's different numerical
    ratios and specifies discriminating mutations.

  decision_scope:
    approved_run: RUN-ECDLP-7ff4d9
    approved_stage: 0
    maximum_runs: 1
    claim_ceiling: fixture_and_instrument_correction_only
    certificate_kind: none
