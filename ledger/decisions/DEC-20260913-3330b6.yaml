    - experiments/EXP-ECDLP-1bef8f/runs/RUN-ECDLP-1bef8f-S0/manifest.yaml
    - experiments/EXP-ECDLP-1bef8f/runs/RUN-ECDLP-1bef8f-S0/raw-result.json
