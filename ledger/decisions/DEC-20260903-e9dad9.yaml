coordinator_decision:
  id: DEC-20260903-e9dad9
  recorded_at: '2026-09-03'

  target_ids:
    - GOAL-ECDLP-001
    - ECDLP-IDEA-436
    - IDEA-20260901-b4e6eb

  decision: revise
  decision_label: d2_split_verdict_strict_closed_conditionally_like_residue_open_prior_art_credited_to_b4e6eb

  context: >-
    Disposes of TASK-20260903-b1653a, the D2-residue task this Coordinator
    dispatched after a rerank identified D2 as the highest-ranked live thread
    for GOAL-ECDLP-001. D2 is the never-gated half of ECDLP-IDEA-436's
    disjunctive hypothesis H; D1 was disposed and its
    implementation-independence discharged by DEC-20260903-256c7c. Producer
    bytes snapshot-archived at 2f16225ae by TASK-20260903-f390d2.

  disposition_one_line: >-
    THREE-PART verdict, none of it a closure of D2 as a whole. The STRICT
    homomorphism reading is closed CONDITIONALLY. A third STRICT-ISO reading,
    outside the two-way split this Coordinator's own brief prescribed, is not
    closed by the cited theorem at all and is closed here only in its additive
    part. The "-LIKE" residue remains OPEN. Substantial overlap with an
    existing unadmitted proposal is recorded as a Coordinator dispatch defect.

  decision_scope: >-
    ACCEPTS the producer's split verdict, with all three parts kept separate.
    (a) STRICT reading -- T an actual group homomorphism onto a smaller group.
    KN-FIND-ffe1df's Theorem C applies, via its terminal step (the image of a
    cyclic group of order n has order dividing n), not via its character-sum
    machinery. But the closure is CONDITIONAL and this Coordinator verified
    why against the frozen record directly: ECDLP-IDEA-436 Assumption 1
    requires E/F_p ordinary with good reduction, p >= 3, and n = ord(S) with
    gcd(n,p) = 1 -- it does NOT require n prime. Primality was added by the
    erratum's R-OBJ2 to the D1 CORROBORATION only. So the strict closure holds
    in the cryptographic regime, where curves are designed with n prime, and
    LAPSES over the record's own declared scope, where composite n admits
    explicit witnesses (k mod d) that are exactly Pohlig-Hellman. The producer
    refused to state this unconditionally and was right to.
    (b) A THIRD reading, STRICT-ISO, which the two-way split in this
    Coordinator's brief did not cover: targets of the SAME size or larger,
    which is the shape every representation attack that has ever worked
    actually takes -- SSSA is an isomorphism onto (F_p,+), MOV is an
    injection. Neither is closed by Theorem C, correctly, since one has
    |G| = n and the other is injective. The producer closed the ADDITIVE part
    under D2's own hypotheses by an elementary argument (every additive target
    in the p-adic tower is pro-p or torsion-free; a group of order coprime to
    p has only the trivial homomorphism into either) and NAMED THE COINCIDENCE
    as KN-TECH-033's bar requires: SSSA works because #E = p makes the source
    a p-group, and gcd(n,p) = 1 is precisely the negation of that. A D2
    proposal therefore cannot borrow SSSA's coincidence, and no substitute was
    found in the good-reduction, large-embedding-degree regime.
    (c) The "-LIKE" residue is OPEN -- relocated and narrowed, not closed. Of
    four escapes tested, exactly one (E1) survives, and E1 is NOT
    group-theoretically closable: KN-FIND-ffe1df item 2 already records that
    the dlog-interval pullback achieves constant advantage at arbitrary
    alphabet on every prime-order group, so any closure here must be a COST
    statement rather than a structural one. The lossy-projection test returns
    that the lift contributes ZERO lossiness (digit 0 already determines the
    point up to sign; higher digits are deterministic), so D2 is a
    cost-dominated re-encoding of the F_p-coordinate-statistic residue rather
    than a new object. The single live unbounded quantity is the DEGREE GAP.
    A cheap high-agreement bound was attempted and FAILED by a factor of n;
    the failure is recorded so nobody re-attempts it.

  what_this_decision_does_not_do:
    - >-
      It does NOT close D2. Only the strict reading (conditionally) and the
      additive part of the strict-iso reading are closed; the "-like" residue,
      which is where the erratum's own phrasing put the openness, survives.
    - >-
      It does NOT dispose of ECDLP-IDEA-436 as a record. H is a disjunction
      and its D2 half remains partly open, so the record stays as the erratum
      left it.
    - >-
      It does NOT claim the strict closure holds at the scale this program
      actually measures without checking n. It holds for the specific measured
      instances (n = 47 and n = 41, both prime) and for cryptographic curves;
      it does not hold across the record's declared scope.
    - >-
      It does NOT promote any KN-FIND. The material's proper home is
      IDEA-20260901-b4e6eb, which holds it first; promoting this task's output
      would misattribute authorship within this program's own corpus.
    - >-
      It does NOT admit IDEA-20260901-b4e6eb. Admission is a separate
      Coordinator act on that record's own merits, ranked below.
    - It asserts no algorithm, solve, advantage, bound, attack, speedup, novelty, or breakthrough. sota_delta is +0 on time, memory, data/queries and constant factor; dominated_by is n/a because no result is claimed.

  non_claims:
    - >-
      Theorem C applying to the strict reading is not a new result. It is the
      correct citation of an existing Validator-confirmed finding, and the
      producer cited rather than re-derived it, as instructed.
    - >-
      Narrowing the "-like" residue to a single surviving escape is not
      evidence that the escape leads anywhere. It bounds where to look; it
      says nothing about what is there.

  prior_art_and_attribution:
    finding: >-
      ledger/proposals/IDEA-20260901-b4e6eb.yaml -- filed 2026-09-01 under
      RQ-ECDLP-002, status `proposed` and unadmitted, 48510 bytes, titled
      'THE TRANSPORT LEMMA THAT CARRIES THE LAST OPEN DISJUNCT OF
      ECDLP-IDEA-436 INTO AN ALREADY-BOUNDED CLASS' -- already holds the
      transport lemma, the prime-n exact-homomorphism settlement, the r^3 cost
      point, the redundant-not-lossy verdict, the degree gap, and the
      composite-order control. This Coordinator verified its existence,
      status, question binding, size, and topical content directly.
    attribution: >-
      The producer derived several of these independently, found b4e6eb
      mid-task, disclosed it unprompted, and CLAIMED NONE of the overlapping
      results. That is the correct handling and is recorded as a credit.
      TASK-20260903-b1653a is to be ranked as BUILDING ON b4e6eb, not as
      confirming or duplicating it. Where the two agree, b4e6eb has priority.
    genuinely_additive_from_this_task: >-
      Three items appear to go beyond b4e6eb and are recorded as this task's
      own contribution, subject to correction if b4e6eb is found to contain
      them: the explicit STRICT / STRICT-ISO / "-LIKE" three-way split; the
      elementary closure of the strict-iso ADDITIVE part with the SSSA
      coincidence named as required by KN-TECH-033's bar; and the recorded
      FAILURE of the cheap high-agreement bound, which has negative value
      only in the sense that it prevents a repeat attempt.

  procedure_deviations_recorded:
    - id: PD-1
      severity: coordinator_defect_wasted_budget
      summary: >-
        I DISPATCHED THIS TASK WITHOUT SEARCHING ledger/proposals/ FOR PRIOR
        ART ON D2. IDEA-20260901-b4e6eb had been filed two days earlier,
        squarely on this object, and I did not look. The rerank that selected
        D2 surveyed hypotheses, decisions and knowledge entries but not the
        proposal pool. A substantial fraction of this task's effort therefore
        re-derived results the program already held. The producer caught it
        and disclaimed credit; the waste is mine.
      correction_adopted: >-
        Standing practice for this goal from now on: before dispatching any
        idea-generation or derivation task on a named object, grep
        ledger/proposals/ for that object's identifier and read any hit. Added
        to the goal's next_action so it survives this session.
    - id: PD-2
      severity: material_tooling_gap
      summary: >-
        The producing session had NO SHELL: it could not compute sha256
        values (recorded null), could not mint an identifier, and COULD NOT
        RUN THE STRICT YAML PARSE its own brief required. It disclosed that it
        had introduced and manually corrected one defect of the prohibited
        class (a bare mapping key inside a block sequence) and explicitly
        asked that the parse be run before its files were relied on. This
        Coordinator ran it: all four artifacts PASS under plain safe_load and
        a strict duplicate-key checker. The manual correction held. Recorded
        because a completion gate that the executing session structurally
        cannot check is a gate in name only, and this is the second time in
        this goal that a shell-less session has hit it.
    - id: PD-3
      severity: brief_defect
      summary: >-
        My brief prescribed a TWO-way split (strict / "-like"). The producer
        found a third reading, STRICT-ISO, that neither half covers and that
        is precisely the shape of every representation attack that has ever
        worked. It reported the third reading separately rather than folding
        it into either half, which would have misstated the closure. The gap
        was in my framing, not in its execution.
    - id: PD-4
      severity: minor
      summary: >-
        Two web searches and one abstract fetch, depth-disclosed and
        non-load-bearing; novelty_status recorded as `unverified`, capped
        rather than chosen. KB retrieval tools were absent from the session
        and were not called.

