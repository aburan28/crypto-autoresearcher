coordinator_decision:
  id: DEC-20260907-52f2a0
  recorded_at: '2026-09-07'
  goal_id: GOAL-ECDLP-bbc21f
  question_id: RQ-ECDLP-78dbc5
  experiment_id: EXP-ECDLP-6ac801
  batch_id: BATCH-48ef8b
  authoring_task: TASK-20260907-058c69
  archived_by: TASK-20260907-6077f2
  branch: cursor/ecdlp-bbc21f-g3-feasibility-review-276e

  context: >-
    OPEN ONE BOUNDED LANE, BATCH-48ef8b, TO AUTHOR THE RANKED RANK 1
    DELIVERABLE AND GATE IT. DEC-20260907-b6bcf4 closed BATCH-e9fd22 and set
    RANK 1: author the protocol amendment PA-ECDLP-6ac801-v2-to-v3, discharging
    blocking defect D2 first, then D3, then D1, and carrying the wide scope
    under the four binding conditions of the compatibility read CR-1. The
    predecessor lane's own gate (DEC-20260907-4e34c5) refused its proposed
    v1-to-v2 draft on those three blocking defects plus four non-blocking ones,
    and the goal head's committed next_action names exactly this work. This
    decision opens the lane, records the Coordinator's reasoning for its shape,
    and states what the lane may and may not conclude.
    THIS DECISION ASSERTS NO RESEARCH FINDING. It approves no experiment,
    changes no hypothesis status, changes no goal status, and reports no
    measurement.

  decision: approve
  decision_scope: >-
    The verb `approve` here approves ONE THING ONLY: opening BATCH-48ef8b with
    the six-task queue described below, on the branch named above. IT DOES NOT
    APPROVE PA-ECDLP-6ac801-v2-to-v3, which is authored inside this lane and
    left at status: proposed, approved_by: null, frozen: false,
    execution_authorized: false. A Coordinator does not approve its own
    amendment; that is what TASK-20260907-9c0626 exists for, in a fresh session
    that must not be the author.

  target_ids:
    - BATCH-48ef8b
    - PA-ECDLP-6ac801-v2-to-v3
    - EXP-ECDLP-6ac801
    - GOAL-ECDLP-bbc21f
    - TASK-20260907-058c69
    - TASK-20260907-6077f2
    - TASK-20260907-9c0626
    - TASK-20260907-3edbf0
    - TASK-20260907-1aa16f
    - TASK-20260907-38f086

  rationale:
    - >-
      RANK 1 IS TAKEN AS COMMITTED, NOT RE-RANKED. DEC-20260907-b6bcf4 already
      performed the rerank at the close of BATCH-e9fd22, on this goal's central
      ECC question, and the goal head carries its next_action. Re-deciding the
      ranking here would be make-work; this lane executes the ranked action.
    - >-
      D2 IS DISCHARGED FIRST BECAUSE IT IS THE REASON RANK 1 OUTRANKS
      EVERYTHING ELSE. The approved specification.v2.yaml is
      execution_authorized and requires a fresh blind re-seal, yet `cap`,
      `CAP_MULT`, `cycle_mass` and `capped_mass` appear nowhere in it, and it
      asserts an exhaustive basin partition that production does not implement.
      A from-scratch re-deriver must therefore invent a cap convention -- the
      same class of gap that produced the original disagreement, relocated from
      the selection weight to the walk cap. Every later defect is cheaper to
      fix and none of them can be fixed durably while the contract's own
      arithmetic is untrue.
    - >-
      D2 IS DISCHARGED AGAINST THE CODE, NOT AGAINST THE TEXT. The amendment
      states the cap as an explicit formula in the measured quantities and
      cites the file and line it was read from, and states the residual-mass
      accounting as a true identity in the two named residual quantities the
      implementation actually computes. DEC-20260907-b6bcf4 `limitations`
      requires the gate to REPEAT that comparison rather than inherit it, and
      the gate's joint J1 is written to force exactly that.
    - >-
      D3 IS DISCHARGED AS A MECHANISM. Adding two paths to a blind list would
      not answer archive-time observation AO-2: a blind discipline whose
      convention lives in a decision record is not one a fresh re-deriver can
      obey from its own text. The lane replaces the denylist with a POSITIVE,
      CLOSED ALLOWLIST -- a derivation packet under
      experiments/EXP-ECDLP-6ac801/derivation-packet/PA-ECDLP-6ac801-v2-to-v3/
      whose manifest names every file the re-deriver may read, so that reading
      anything else is a self-detectable violation rather than an omission
      nobody can see. The corroborating denylist is retained in the contract,
      demoted to a cross-check.
    - >-
      THE COORDINATOR'S PRIOR IS RECORDED IN FULL AND MOVED OFF THE
      CONTAMINABLE READING PATHS. AGENTS.md 'Review architecture' requires the
      prior to be written before any reviewer runs, and the answer to a leaking
      prior is never to stop recording it. It is committed in this lane's
      OPENING snapshot at
      coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-48ef8b/priors/coordinator_prior.SEALED.yaml,
      absent from the packet allowlist, named on the contract's denylist, and
      unreadable by the approval gate until the gate's own findings are
      written. That last restriction is STRICTER than the program's default and
      is deliberate: the gate is an adversarial reader of a document this
      Coordinator wrote, and a prior that tells it what its author expects is a
      thumb on the scale. The cost -- the gate loses the guidance a stated
      prior gives -- is accepted and recorded.
    - >-
      THIS LANE'S OWN ARTIFACTS ARE HELD TO D3 AS WELL. No queue field, task
      card, handoff, decision or commit message of BATCH-48ef8b states a prior,
      an expectation, a verdict, a margin, a pass-count or any numeric value of
      the quantity under test at any cell. Contract parameters and task budgets
      are stated, because they are inputs rather than results and the
      re-deriver reads them from the contract anyway.
    - >-
      NO EXECUTOR, VALIDATOR OR RED-TEAM TASK IS OFFERED, AND THAT IS A
      DELIBERATE REFUSAL RATHER THAN AN OMISSION. A queue offering an executor
      against a contract whose approved_by is null is the exact defect
      BATCH-e9fd22 had to cancel five tasks to fix. Gating by depends_on does
      not help: the handoff is committed the moment the queue is. Worse, the
      blind re-derivation task cannot be specified honestly before the gate
      rules, because what it may read IS the object under review -- committing
      its required-reading path now would put an unchecked reading path into a
      committed queue, which is D3 reproduced one level up. And the Stage A''
      seal must be created after approval and before any production reading, so
      it belongs to the lane that carries the seal. The successor lane is named
      in `next_actions`; nothing is lost, only deferred to where it can be
      stated truthfully.
    - >-
      THE TERMINAL ARCHIVAL NODE IS PLANNED IN AT OPENING.
      CORR-20260907-5afd89 records that BATCH-e9fd22's opening plan could not
      represent a terminal archive its plan had not anticipated, because
      archive.source_task_ids may not be empty and every non-archive task was
      already assigned. This queue reserves TASK-20260907-1aa16f as an
      unassigned non-archive source at opening time precisely so
      TASK-20260907-38f086 has a legal source and this lane can archive its own
      checkpoint.
    - >-
      THE GOAL HEAD IS NOT WRITTEN AT LANE OPENING. Another session holds lane
      BATCH-8f3e86 open on this goal from another branch, and
      docs/concurrent-goal-lanes.md makes a second lane's visibility a
      write-once side file exactly so that opening a lane does not require
      editing the one file every other session on the goal also edits.
      agents/coordinator.md requires the committed goal record to be
      checkpointed after every LEDGER archive; this lane's opening is a
      SNAPSHOT archive, so no head write is due. The head and the checkpoint
      shard are owned by the terminal ledger archive and are written there.

  evidence_refs:
    - DEC-20260907-b6bcf4 (closing decision and rerank of BATCH-e9fd22; sets RANK 1 and states CR-1's four binding conditions and the requirement to repeat the formula comparison)
    - DEC-20260907-4e34c5 (the approval-gate refusal: blocking D1, D2, D3; non-blocking D4-D7; transferable finding TF-1)
    - CORR-20260907-5afd89 (the unachievable-handling correction and the dispatcher archive invariants it records)
    - ledger/goals/GOAL-ECDLP-bbc21f/checkpoints/BATCH-e9fd22.yaml (predecessor checkpoint, task dispositions, archive-time observations AO-1/AO-2)
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/tasks/TASK-20260907-f65c6e/approval_review.yaml (the gate's worked defect list)
    - experiments/EXP-ECDLP-6ac801/specification.v2.yaml (READ-ONLY; the approved, frozen, execution_authorized document PA-ECDLP-6ac801-v2-to-v3 amends)
    - experiments/EXP-ECDLP-6ac801/amendments/v1_to_v2.yaml (READ-ONLY; the approved amendment whose additive precedent governs how a frozen block is extended)
    - experiments/EXP-ECDLP-612fb1/specification.v2.yaml line 223 (the frozen T_OF_NBITS table D1 is fixed against)
    - experiments/EXP-ECDLP-612fb1/source_v2/instrument.py and experiments/EXP-ECDLP-6ac801/source/run_stageb.py (the production implementation D2's formula is read off)
  evidence_refs_note: >-
    EVERY REFERENCE ABOVE IS `internal` PROVENANCE -- a committed record or a
    source file of this repository, read by this session. No external
    literature is cited by this decision, and no reference is `recalled`.

  what_this_lane_may_not_conclude:
    - >-
      IT MAY NOT CONCLUDE ANYTHING ABOUT THE ECDLP, ABOUT G3 FEASIBILITY AT ANY
      a, OR ABOUT ANY MARGIN. It runs nothing and measures nothing. Its
      strongest possible output is a committed ruling on whether a document is
      fit to be frozen.
    - >-
      IT MAY NOT MOVE H-ECDLP-37dc01, H-ECDLP-3550b8 OR ANY OTHER HYPOTHESIS.
      Authoring a contract is not evidence.
    - >-
      IT MAY NOT MOVE GOAL-ECDLP-bbc21f TOWARD `completed`. No completion
      criterion of this goal is met by authoring a contract, and C2 remains
      OPEN.
    - >-
      IT MAY NOT RESOLVE THE PA-ECDLP-6ac801-v1-to-v2 IDENTIFIER COLLISION.
      Two v1-to-v2 amendments carry that identifier -- one approved at the
      canonical path, one at a `revision_required` sidecar. The collision
      stands, both records are immutable, neither is renamed, and v3 states
      explicitly that it amends the APPROVED one. Repairing it would be a
      separate superseding act under a new identifier, and AGENTS.md rule 15
      makes a remap a last resort rather than a repair.
    - >-
      IT MAY NOT RE-SCORE RUN-ECDLP-6ac801-001..006. They enter the v3 contract
      only as the reproduction control's reference. No task in this queue has
      experiments/EXP-ECDLP-6ac801/runs/ in its write_scope.

  limitations:
    - >-
      THE V3 CONTRACT IS ONE SESSION'S SINGLE-PASS WORK AND HAS NOT BEEN
      REVIEWED BY ANYONE. Its cap formula was transcribed from source by the
      same session that wrote the contract; its derivation packet is asserted
      leak-free and sufficient by its own author. Both assertions are exactly
      what TASK-20260907-9c0626 exists to test, and neither should be relied on
      before that gate's decision is committed.
    - >-
      THE SEED-COUNT EXTENSION RESTS ON A WEAKER WARRANT THAN THE REST OF THE
      WIDE SCOPE, and the amendment says so in the control itself. The approved
      contract's `invalidation_rules` item 7 does not name the seed set, so the
      authority used is control (e)'s own stated rationale, a fortiori. A gate
      that rejects that reading is within its rights; the fallback needing no
      new warrant is the original seed count, which costs the wide scope its
      power.
    - >-
      THE SECOND SCALE IS ADDED SURFACE THAT RANK 1 DID NOT REQUIRE.
      DEC-20260907-4e34c5 offered dropping it as a complete discharge of D1.
      Every field of the v3 contract concerning it is written to be separable,
      so a gate that prefers the smaller change can have it at no cost to the
      rest. Gate joint J7 asks the question directly.
    - >-
      THE GATE FIELDS ARE NOT SET IN THIS LANE, so between this lane's close
      and the successor lane's opening act an approving gate decision coexists
      with v3 documents that still read approved_by: null. The reason is a
      dispatcher invariant -- one owner per artifact path for the whole queue --
      and the cost is recorded in the queue's `gate_field_note` rather than
      hidden. A reader who finds it too clever should raise it at the gate.
    - >-
      THE REQUESTED POLICY IS coordinator-orchestration-code AND THE RESOLVED
      MODEL IS RECORDED BESIDE IT, BUT IT IS NOT PROBE-VERIFIED. This session
      did not run `python3 -m orchestration.adapter doctor --probe`, so
      `model_verified` is false rather than asserted. Disclosed, not glossed.
    - >-
      `validate_ledger.py` REPORTS 29 ERRORS INHERITED FROM main (GOAL-ECRANK-002
      records, four TASK-20260905-* handoffs, DEC-20260905-eb1df9, and
      EXP-ECDLP-bbb42f run manifests). None is this lane's and this lane adds
      none. They are recorded here so a later reader does not mistake them for
      damage from BATCH-48ef8b.

  contradictions_in_the_committed_record:
    - id: CT-1
      what: >-
        THE ALLOCATOR HAS NO `task` RECORD TYPE. The instruction to mint task
        identifiers with `--next task` cannot be followed literally:
        tools/allocate_id.py accepts `handoff`, which is the type that mints
        `TASK-*`. All six task identifiers of this lane were minted with
        `--next handoff --date 20260907` and each was confirmed free with
        `--check` before use. Recorded because a later reader comparing the
        instruction against the tooling will find the same mismatch.
      resolution: 'None needed; the tool is authoritative and was used as designed.'
    - id: CT-2
      what: >-
        THE CROSS-SCALE REPRODUCTION CONTROL CANNOT BE ANCHORED AT THE SMALLER
        SCALE, AS THE FRAMING ASKS. A reproduction control needs a committed
        reference to reproduce, and EXP-ECDLP-6ac801 has never been run at the
        smaller scale -- there are no committed cells there at all. Anchoring a
        control against a nonexistent reference would be a fabrication under
        core rule 9.
      resolution: >-
        The v3 contract anchors the reproduction control at the scale that HAS
        committed cells, reads a cross-scale CONSISTENCY comparison at the
        smaller scale, and declares that comparison EXPLICITLY NOT A CONTROL
        because it has nothing to pass or fail against. Stated in the control's
        own text rather than in a note.
    - id: CT-3
      what: >-
        THE GOAL HEAD'S `current_batch_id` IS null AND ITS `dispatch_queue_path`
        STILL NAMES THE CLOSED LANE BATCH-e9fd22, while `open_batches` is empty
        even though BATCH-8f3e86 is open. The head is therefore not a reliable
        index of which lanes are live.
      resolution: >-
        Not this lane's to repair, and repairing it would mean editing the one
        record another session is working. Lane liveness is read from the
        write-once side files under coordination/goals/GOAL-ECDLP-bbc21f/lanes/
        via `tools/goal_lanes.py lanes`, which is what those files exist for.
        Recorded so the discrepancy is not read as damage.

