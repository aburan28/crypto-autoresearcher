  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT AN EVIDENCE-REVIEW DECISION. This decision opens a lane; it cites no
      evidence record, reports no measurement, and rests on no run. There is no
      durable claim to promote, and promoting a contract's text as a finding
      would be exactly the overclaiming the knowledge gate exists to prevent.
      The reusable procedural lesson of this lane -- replacing a blind-reading
      denylist with a closed, manifest-hashed allowlist -- may be worth a
      KN-TECH entry once the gate has ruled on whether it actually works; it is
      not worth one on its author's say-so.

