coordinator_decision:
  id: DEC-20260909-6c3306
  goal_id: GOAL-SHA2-75ae45
  batch_id: null
  recorded_at: '2026-09-09'
  authorized_by: user_session_directive
  decision: open_goal
  decision_label: >-
    Open GOAL-SHA2-75ae45 and RQ-SHATWO-f340ac for independent reproduction of
    Li et al.'s 36–39-step SHA-2 collision attack line from user-supplied
    primary text.

  context: >-
    The user explicitly requested a new goal for the paper "Pushing Collision
    Attacks on SHA-2 to 39 Steps" (Yingxin Li, Zhuolong Zhang, Muzhou Li,
    Fukang Liu, Haifeng Qian, Jinwei Zhu), providing the full text in session.
    Draft GOAL-SHA2-001 already owns a related but distinct deficit-ledger
    campaign and remains untouched. Standing user authorization for ideas and
    experiments (2026-09-06) covers protocol work after this open; creating
    the goal itself is the user's explicit "start a new campaign" act.

  rationale:
    - >-
      The paper's stated frontier (practical 36-step SHA-256 collision;
      theoretical 38-step on both; effective 39-step SHA-512) is exactly the
      kind of literal-certificate baseline this program's SHA-2 lane has been
      waiting on, and it is not yet independently verified here.
    - >-
      A separate goal is required so GOAL-SHA2-001's deficit-ledger ownership
      and this reproduction/cost-model line do not collide in write scope or
      completion criteria.
    - >-
      Opening authorizes only the ranked next_action on the goal record
      (acquisition + 36-step certificate check). No hypothesis status change,
      no experiment approval, and no claim about full SHA-2.

  what_is_authorized:
    - Creation of RQ-SHATWO-f340ac, GOAL-SHA2-75ae45, and SRC-SHA2-LI-39STEPS-2026.
    - Subsequent Coordinator design of BATCH-1 for acquisition and Table-2 verification only.

  what_is_not_authorized:
    - Any SAT/SMT characteristic search or MITM collision search in this decision.
    - Any edit to GOAL-SHA2-001, GOAL-SYMF-c00fa1, or any hypothesis status.
    - Any statement that full SHA-256/SHA-512, HMAC, TLS, or Bitcoin is weakened.

  explicit_non_claims:
    - Opening a goal asserts nothing about the paper's correctness.
    - User-supplied text is not yet an independently retrieved primary PDF.
    - Complexity figures remain user_supplied until reconciled against a retrieved copy and re-derived here.

  target_ids:
    - GOAL-SHA2-75ae45
    - RQ-SHATWO-f340ac
    - SRC-SHA2-LI-39STEPS-2026

  evidence_refs: []
  evidence_ref_note: >-
    None. This decision opens a goal from an explicit user request and a
    user-supplied paper freeze; it records no experimental evidence.

  next_actions:
    - id: NA-1
      owner: coordinator
      action: >-
        Design and open BATCH-1 for FIPS 180-4 pin, PDF retrieval attempt, and
        independent re-verification of the stated 36-step SHA-256 colliding
        pair. Do not dispatch characteristic search.

  knowledge_promotion:
