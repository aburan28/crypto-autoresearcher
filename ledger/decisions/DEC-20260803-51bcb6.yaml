  rationale:
    - >-
      RT-047-B1: CTRL-PLANTED-PATH-POS starts from a special curve
      (embedding_degree=1, any_special=true), violating R5-FIX-PRESERVE-M1's
      nonspecial-start requirement. This is not a bureaucratic failure: the
      violation reveals that ordinary ell-isogenies preserve trace of Frobenius
      (isogeny-class invariant), so anomalous endpoints cannot be reached from
      generic non-anomalous starting curves via ordinary isogeny walks. The
      planted control was forced to start from a special curve precisely because
      a non-special curve cannot reach a special endpoint.
    - >-
      RT-047-B2: Run-id RUN-IT-001-rc47 is not in the amendment's reserved_run_ids;
      mode smoke_then_measure is not a frozen mode; manifest batch_open_decision
      cites DEC-20260803-003 (BATCH-046 opener). Provenance chain is broken.
    - >-
      RT-047-B3: run_bounded_toy.py was modified on a dirty worktree at runtime.
      Reproducibility from committed state is unconfirmed.
    - >-
      EV-IT-aefd12 O-3: rho_special=0.0 at all three tested bit sizes. This is
      consistent with the class-invariant observation in O-6: if ordinary isogenies
      preserve trace, no path from a generic (trace-t) curve can reach an anomalous
      (trace-1) curve at any scale. rho_special=0 is not a finite-scale artifact
      and is not negative evidence against ECDLP hardness.
    - >-
      AGENTS.md rules 5-7: resource_exhaustion is not negative evidence; toy
      evidence is not crypto-scale; the tested scope is ordinary 2-isogeny BFS
      at 20-28 bits on a Python implementation.

  exact_next_action: >-
    Dispatch a mathematical analysis task (research-deep) to formally evaluate
    the class-invariant argument from EV-IT-aefd12 O-6: (a) state and prove or
    refute whether ordinary ell-isogenies preserve the isogeny class (conductor)
    and hence prevent transfer from generic-trace curves to anomalous-trace curves;
    (b) determine whether H-IT-001's mechanism is achievable via ordinary isogenies
    at any scale, or whether it requires supersingular/non-ordinary paths; (c)
    if the mechanism is infeasible for ordinary isogenies, propose a scoped
    successor hypothesis (e.g., restricted to supersingular isogenies, or
    declare H-IT-001 weakened at ordinary-isogeny scope and name the exact
    remaining open question). This analysis must run before any further Executor
    batch on the current H-IT-001 formulation.

