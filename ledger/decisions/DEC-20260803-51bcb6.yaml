    on nonspecial-start requirement (B1), non-reserved run-id/mode/provenance (B2),
    and dirty worktree (B3).

  decision: inconclusive
  decision_vocabulary_note: >-
    inconclusive means: the run package is not admissible as a transfer-gate or
    HEUR-ISO-1 measurement under the frozen contract due to RT-047-B1..B3. It is
    NOT null evidence against H-IT-001, NOT reject_scoped, and NOT weaken.
    The density observations (rho_special=0 at all tested sizes) are recorded as
    EV-IT-aefd12 O-3 without drawing a conclusion about the mechanism. The
    class-invariant structural concern in O-6 is recorded and requires mathematical
    analysis before further Executor work.

  decision_scope: >-
    Official disposition of RUN-IT-001-rc47 and BATCH-047. Adopt VAL-20260803-029
    COMPLETED_VALID_SCOPED at its three required narrowings. Adopt RT-20260803-030
    FAIL at its three blocking objections. H-IT-001 stays specified. GOAL-ECDLP-001
    stays active. Claim ceiling toy. No support, weaken, reject_scoped, STR reopen,
    lane death, asymptotic promotion, or GOAL completion. Knowledge not warranted.
    No further Executor work on the current H-IT-001 ordinary-isogeny formulation
    until the class-invariant concern in EV-IT-aefd12 O-6 is formally assessed.

  target_ids:
    - GOAL-ECDLP-001
    - H-IT-001
