  context: >-
    BATCH-047 executed EXP-IT-001 under PA-IT-001-v3-rc45-repair-5 with BF-1..BF-3
    control repairs (DEC-20260803-004 mandate). Run snapshot archived at
    be21c53c58cb64eb (TASK-028). VAL-20260803-029 returned COMPLETED_VALID_SCOPED
    (three required narrowings RN-1..3); RT-20260803-030 returned FAIL with three
