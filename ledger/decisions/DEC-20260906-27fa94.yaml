    ledger/decisions/ returns zero hits. OPTION A applies: no real prior
    Coordinator approval for EXP-JMV-004 exists anywhere, under any
    citation. This decision re-runs the approval act with a genuine,
    checkable Coordinator review, citing itself, and is the sibling of
    DEC-20260906-b083ce (EXP-JMV-001).
  decision: approve
  target_ids:
    - EXP-JMV-004
    - H-JMV-002
    - RQ-JMV-001
    - DEC-20260807-5adc24
  rationale:
    - >-
      RE-VERIFICATION. DEC-20260726-001 was read in full and confirmed to be
      an FCP-lineage record with zero JMV content, exactly as
      DEC-20260807-5adc24 found. No real approval exists under any
      identifier. (DEC-20260726-002, the third decision in this FCP
      cluster, was also read and is likewise FCP-only, for completeness.)
    - >-
      SAME BROADER RELATED DEFECT AS EXP-JMV-001, NAMED HERE TOO.
      ledger/questions/RQ-JMV-001.yaml carries the same false
      `admitted_by: DEC-20260726-001` citation and lists EXP-JMV-004 branch
      (a) among its `approved_experiments... of DEC-20260726-001`. This
      decision does not edit RQ-JMV-001 (outside this session's write_scope
      and outside the six-experiment repair this effort covers); its own
      approval below rests entirely on this decision's fresh review, never
      on RQ-JMV-001's fabricated citation.
    - >-
      FRESH SCIENTIFIC REVIEW -- THIS IS THE MOST CAREFULLY SELF-LIMITED
      CONTRACT OF THE SIX. Version 2 explicitly REFUSED version 1's
      claim_tier `crypto` (condition E3) precisely because zero instances
      are tested at any size, and instead records `type: theoretical`,
      `proof_status: derivation`, `claim_tier: not_applicable` -- a stricter
      tier than the original draft claimed, adopted BEFORE any run exists.
      This is the opposite of a manufactured approval: the contract narrows
      its own claim ceiling on its own initiative.
    - >-
      CONTROLS. C1 gates every conclusion about vacuity or non-vacuity on an
      independent transcription review, exactly as EXP-JMV-001; E2-CONVENTION
      requires BOTH logarithm conventions and a single explicit degree
      convention reported side by side, since a factor of 2 is stated to move
      the headline sign across zero; E4-PRECOMPUTATION forbids silently
      assuming free precomputation for a non-storable modular polynomial;
      CTRL-CONSTANT-PROVENANCE forbids inventing or silently fixing any
      implied constant; CTRL-GRH requires every quantitative statement to be
      labelled GRH-conditional. invalidation_rules explicitly forbid
      asserting the corollary is FALSE (only concretely unproven at evaluated
      parameters) and forbid any framing as an attack or a bearing on GRH,
      D1, or BAR-AMORT-D2.
    - >-
      CLAIM-TIER DISCIPLINE. No curve, key, or attack instance of any kind is
      touched; this is pure deterministic arithmetic evaluating a published,
      cited cost model at declared parameters. This is the cleanest possible
      claim-tier fit in the six-experiment set: the tier the contract claims
      (not_applicable / theoretical derivation) is mechanically forced by
      what is actually computed, per docs/claims-and-verification.md.
    - >-
      RESOURCE FIT. Same standalone RQ-JMV-001 track, same small shared
      budget (2 CPU-hours / 10 runs total across both JMV experiments; this
      one alone capped at 1 CPU-hour, 5 runs, 2GB, 600s per run). No goal
      campaign budget is consumed and no GOAL-MLKEM-001-style closure
      conflict exists.
    - >-
      BRANCH DISCIPLINE IS ALREADY CORRECT IN THE FROZEN TEXT. Only branch
      (a) (the proven, explicit-constant GRH bound) is approved and runnable;
      branch (b) (a constant measured by the unapproved EXP-JMV-003) is
      explicitly blocked, and the stopping_rules forbid estimating,
      substituting, or partially running it. This decision's approval
      extends ONLY to branch (a), exactly as the contract itself scopes.
    - >-
      No defect was found in the contract's design, controls, budget, or
      scope beyond the fabricated citation this decision repairs.
