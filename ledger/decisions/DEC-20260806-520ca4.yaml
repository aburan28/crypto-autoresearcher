coordinator_decision:
  id: DEC-20260806-520ca4
  context: >-
    GOAL-SSIQ-001 BATCH-013 -- the fifth batch under the "No budget
    constraints" extension (user direction, this session, recorded as a
    Coordinator-logged user authorization removing campaign_budget's
    batch-count ceiling after BATCH-012's own closed_at_budget
    checkpoint). Executed the highest-ranked resume action from
    DEC-20260806-f96efd: a three-point intermediate-budget truncation
    sweep (0.6s/0.8s/1.0s), via a frozen v10 amendment
    (specification_v10.yaml, after TWO pre-freeze review rounds).
    Recorded as EV-SSIQ-48d274, on TASK-20260806-aefc34 passed and
    TASK-20260806-d4379a CHALLENGE (narrow).
  decision: support
  decision_note: >-
    support: RUN-SSIQ-a85692-j is genuinely, non-trivially executed
    exactly as the frozen v10 contract requires, independently confirmed
    by the Validator (true C-REPRO including DYNAMIC fault-injection
    tests of both previously-unexercised failure-isolation paths, and a
    from-scratch re-execution that independently reproduced the
    headline finding on a genuinely different search) and the Red Team
    (execution fidelity clean; the headline finding independently
    DERIVED from first principles before being checked against the
    data, not merely fit to it). The Red Team's CHALLENGE was narrow and
    entirely about precision of citation, not defects: three specific
    corrections (composition-explain the differs-proportion trend;
    conjugate-pair-correct the differs counts; state explicitly that
    this finding is orthogonal to BATCH-011's own RNG-sharing
    conclusion), all adopted into this evidence record (O-5, O-6, O-7)
    rather than requiring any change to the immutable run.
  target_ids:
    - GOAL-SSIQ-001
    - RQ-SSIQ-9702af
    - EXP-SSIQ-a85692
    - EV-SSIQ-48d274
    - TASK-20260806-62e105
    - TASK-20260806-aefc34
    - TASK-20260806-d4379a
  evidence_refs:
    - EV-SSIQ-48d274
    - EV-SSIQ-69ba8b
  rationale:
    - id: D-1
      statement: >-
        THIS BATCH PRODUCES THE STRONGEST-EVIDENCED SINGLE FINDING THIS
        CAMPAIGN HAS RECORDED, BY A DIFFERENT AND HIGHER STANDARD THAN
        ANY PRIOR BATCH: A CODE-LEVEL DERIVATION, PRE-REGISTERED BEFORE
        THE DATA WAS CHECKED, CONFIRMED WITH ZERO EXCEPTIONS, THEN
        INDEPENDENTLY REPRODUCED ON A SECOND REAL EXECUTION. Every prior
        batch's evidence rested on observing a pattern in one execution's
        data (even when independently re-verified, as in BATCH-009
        through BATCH-012). This batch's Red Team instead derived the
        expected result (truncated search values are never smaller than
        complete-search values) from Dijkstra correctness plus a named,
        testable physical premise BEFORE looking at the outcome, and
        this Coordinator and the Validator each independently confirmed
        every checkable consequence of that derivation against raw data
        with zero exceptions -- and the Validator's own from-scratch
        re-execution reproduced the identical pattern on a genuinely
        different search. This is a materially different, and stronger,
        epistemic basis than this campaign has used before.
      confidence: high
    - id: D-2
      statement: >-
        THE FINDING IS CORRECTLY, PRECISELY SCOPED AWAY FROM BATCH-011's
        OWN RNG-SHARING CONCLUSION, WHICH REMAINS FULLY INTACT AND
        UNTOUCHED. The Red Team's own adversarial effort to determine
        whether this finding narrows, extends, or reopens BATCH-011's
        determinism argument concluded it does none of these -- it is an
        orthogonal finding about truncation itself, independent of which
        RNG scheme drove the search. This Coordinator independently
        confirms this scoping is correct: BATCH-011's conclusion rests
        on search COMPLETENESS, which this run never provides at any of
        its three sweep points (all strictly below the 1.14993s natural-
        completion floor). Both the archived (shared-RNG) and v8
        (independent-RNG) reference values, both complete searches,
        continue to agree exactly, reconfirmed by this run's own
        internal Comparison 1/Comparison 2 consistency at every budget.
      confidence: high
    - id: D-3
      statement: >-
        THIS FINDING DIRECTLY AND CONCRETELY INFORMS THE DESIGN OF ANY
        FUTURE ATTEMPT TO PROPERLY TEST BATCH-011's ORIGINAL BOUNDARY
        QUESTION, WITHOUT ITSELF BEING THAT TEST. A future truncation-
        based probe of whether RNG-sharing matters under genuine search
        incompleteness must now explicitly control for or account for
        THIS confound (truncation itself biases results upward,
        regardless of RNG scheme) before any observed difference could
        be attributed to RNG-sharing specifically rather than to
        truncation's own now-proven directional effect. This is a
        genuine, actionable, positive contribution to this campaign's
        instrument-design discipline, independent of what it does or
        does not say about H-SSIQ-36e970 itself.
      confidence: high
  limitations:
    - >-
      No claim about H-SSIQ-36e970, a delta_E-gradient's existence, or a
      p^{1/4} algorithm is made anywhere in this decision or its evidence
      record. Lever L4 is NOT retired.
    - >-
      This finding does NOT bear on, narrow, or reopen BATCH-011's own
      RNG-sharing determinism conclusion (DEC-20260806-f7d62d), which
      remains fully intact and unaffected.
    - >-
      Any future citation of the raw "62 differences" count or the
      16.0%/7.5%/26.7% proportion trend must include the conjugate-pair-
      corrected effective sample size (~34) and the composition
      explanation for the proportion trend, not the bare numbers.
    - >-
      Despite the derivation-tier proof_status, the wall-clock-
      monotonicity premise underlying the finding is a physical, not
      mathematical, assumption, verified with zero exceptions in this
      batch's own data but not something the code itself guarantees at a
      different scale or system load.
    - >-
      Toy scale throughout; nothing transfers to cryptographic scale.
      Model independence remains absent and unverifiable. Evidence
      strength stays capped at preliminary campaign-wide, unchanged by
      this batch's stronger-than-usual epistemic basis.
  next_actions:
    - >-
      RANKED: (1) [cheapest, most directly informative, per the Red
      Team's own falsifiable prediction] one more sweep point at
      1.1-1.2s per-vertex budget, straddling and for some vertices now
      at or above the observed 1.14993s natural-completion floor, to
      test whether delta_E>=5 convergence begins appearing there while
      delta_E=2/3 remain exactly converged -- directly testing whether
      convergence is genuinely monotone-in-budget across the full value
      range, or has some other structure this three-point sweep cannot
      yet distinguish; (2) [longer-term, unchanged] any future amendment
      attempting to properly test BATCH-011's own original truncation-
      boundary question (does RNG-sharing matter under genuine
      incompleteness) must now explicitly account for this batch's own
      confound (truncation itself biases upward, regardless of RNG
      scheme) in its own design -- a design constraint this campaign did
      not have before this batch; (3) [unchanged, deferred] widening any
      RNG-independence or truncation probe to the other three primes
      stays deferred until (1)-(2) justify it; (4) [unchanged, deferred]
      the funnel-structure mechanism question remains open.
      L4 remains the only lever whose ceiling meets this goal's target
      and still the top priority. Any future amendment goes through this
      lineage's own pre-freeze discipline scaled to compute at risk,
      PLUS (new this batch, per EV-SSIQ-48d274's own fourteenth
      knowledge candidate): a finding derived from first principles and
      confirmed with zero exceptions against raw data, then reproduced
      on an independent re-execution, is qualitatively stronger evidence
      than a pattern merely observed and re-verified in one execution's
      data -- this distinction should be stated explicitly in any future
      evidence record's own strength_note, not folded into the
      undifferentiated "preliminary" tier without comment. Still standing
      from BATCH-012/BATCH-011/BATCH-010: any resolved subsample from a
      truncated search must be checked for selection bias and
      correlation before its result is cited as representative; any
      control-derived finding's caveats must be propagated into every
      artifact a future reader might consult first.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Nothing promoted; evidence strength is preliminary (session-only
      independence), below this campaign's replicated/strong bar for
      promotion -- unchanged even though this batch's underlying
      epistemic basis (a pre-derived, zero-exception, twice-reproduced
      structural finding) is qualitatively the strongest this campaign
      has produced, because the independence-tier ceiling, not the
      finding's own rigor, is what caps promotion under this campaign's
      established convention. A FOURTEENTH knowledge candidate is now
      queued campaign-wide, distinct from the prior thirteen: "when a
      randomized search instrument is truncated below its natural
      completion time, the returned result for any vertex/instance that
      still resolves is a valid but potentially non-minimal answer,
      never a better one than a complete search would find, and
      convergence to the true value proceeds in ascending order of true
      answer depth/complexity as budget grows -- this is a general,
      re-derivable property of any best-first/Dijkstra-style search
      instrument under a hard time budget with a single end-of-search
      correctness check, not specific to this campaign's delta_E metric,
      and should be assumed present (and controlled for) in any future
      instrument design that truncates such a search rather than
      discovered anew each time." All fourteen promote together when a
      genuinely independent model becomes available to re-check them.
  decided_by: coordinator
  decided_at: '2026-08-06'
