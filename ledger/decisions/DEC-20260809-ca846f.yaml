    correction binds the unchanged design bytes to the actual parent. Fresh
    independent Reviewer TASK-20260809-537233 accepted that correction,
    recomputed every registered arithmetic headline, and returned REVISE with
    four blocking specification findings and two nonblocking hardening findings.
  decision_scope: >-
    Preserve the design, correction, review, and all provenance; close only
    BATCH-f5d854; leave EXP-ECDLP-adaa91 at review_required and GOAL-ECDLP-001
    and RQ-ECDLP-002 active; authorize a fresh non-overlapping immutable design-
