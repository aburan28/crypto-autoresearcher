  rationale:
    immutable_binding: >-
      The reviewer verified the hash-correct design bytes, preserved invalid
      original receipt, correct Git parent, and forward-only corrective snapshot.
    arithmetic_basis: >-
      Exact equal means, arm success counts, eta-aware slopes, gamma separation,
      key counts, XOF traffic, fit counts, and archive addition all recompute.
    blocker_basis: >-
      The gamma-gap statistic, byte and path encodings, decoder interface, and
      stage/resource/artifact closure allow implementation-time choices that can
      alter the registered gate or prevent independent reproduction.
    claim_boundary: >-
      Passing planted arithmetic is not implementation readiness or ECDLP
      evidence. The blockers are specification defects and do not refute the
      apparatus concept or any mathematical hypothesis.
