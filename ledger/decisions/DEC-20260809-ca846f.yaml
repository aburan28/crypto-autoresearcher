  required_successor_repairs:
    - Define ordinal-paired eta-zero gamma-gap bootstrap values and Type-1 ranks 41 and 8151.
    - Freeze whitespace-free domain keys, enum bytes, digest and record framing, path ordering, indexing, and padding with concrete fixtures.
    - Declare X, Y, and V aliases of one M field or separately encode them and recompute archive capacity.
    - Add fixed malformed bitset, endian, truncation, and conditional channel-mismatch controls with reason codes.
    - Rename the deterministic estimator objective to avoid an unsupported sampling-law implication.
    - Reconcile stage wall, CPU, RSS, shards, operations, logical I/O, archive rows, exact-versus-slot semantics, residuals, and artifact bijection.
