coordinator_decision:
  id: DEC-20260904-166ab5
  context: >-
    Composition and record acceptance for the BATCH-256a94 review round on
    GOAL-SSI-001. One Executor produced a seven-artifact source-state census and
    240-row anchor reconciliation for the frozen EXP-WESOVOW-001 cost model; it
    was snapshot-archived at commit 5872cf99a2e71c0455502244047ad3c2f019ccbc and
    then reviewed by two mutually blinded independent sessions, a Validator
    owning J1/J2/J3/J5 and a Red Team owning J4/J6 plus the proves-too-much
    control and the blind re-derivation. This decision composes their per-joint
    verdicts, accepts EV-SSI-5d954c, retains and WIDENS the standing citation
    prohibition, and sets one next action. It is not a hypothesis, experiment, or
    goal transition, and this identifier - reserved by the batch for the
    prohibition question - is used here to RETAIN and EXTEND the prohibition, not
    to lift it.
  decision: revise
  decision_scope: record_acceptance_composition_and_citation_boundary
  target_ids:
    - EV-SSI-5d954c
    - EXP-WESOVOW-001
    - GOAL-SSI-001
    - BATCH-256a94
    - TASK-20260904-1f4e2f
    - TASK-20260904-e13cf2
    - TASK-20260904-22e444
  rationale:
    - >-
      ACCEPT the round as evidence of arithmetic and measurement hygiene only,
      recorded in EV-SSI-5d954c at strength `inconclusive`, claim_tier `toy`,
      direction `neutral`. The package is admissible: the snapshot is
      content-verified independently by both reviewers, all seven declared
      artifact hashes reproduce from the snapshot tree, and no file under
      experiments/ was touched by any task of this batch.
    - >-
      RECORD THE HEADLINE AS THE ROUND'S PRINCIPAL RESULT. The frozen contract
      experiments/EXP-WESOVOW-001/specification.yaml still carries, at lines
      39-40, the PRE-FIX analytic crossover "w* = (T_full * 2^{c*sqrt(log2 p)} /
      T_DG)^2, capped by M" on origin/main. Two mutually blinded reviewers found
      it by different routes - the Red Team blind from the specification alone
      (O1), the Validator by recomputation (MR-10), measuring the gap to the
      repaired crossover as exactly log2 M at every field size. On the Red Team's
      blind derivation the contract is INTERNALLY UNSATISFIABLE: no single law
      satisfies both that metrics line and control C4 of the same file unless
      log2 M = 0. I read specification.yaml:36-42 myself and confirm the line is
      there as quoted. The census quoted those lines zero times and stated that
      the specification holds "a normalisation requirement, not a closed-form
      law", which is false of the file.
    - >-
      HOLD RG-0's verdict `fix_already_applied`, and narrow its wording rather
      than its status. It is correct and independently re-verified on the scope
      where it was evidenced - cost_model.py, RUN-WESOVOW-001 and
      RUN-WESOVOW-201692-001 - and it is broader than the evidence supports by
      exactly one governing artifact, which is the artifact above. A source fix
      to the implementation is not outstanding; a CONTRACT reconciliation is.
    - >-
      ACCEPT J5's REFUTATION rather than absorb it. RG-4 has no reachable failure
      branch on any real anchor: the Validator pushed 2e5 arbitrary anchors
      through the producer's own control function and neither the cap arm nor the
      monotonicity arm failed once, and the three arms the producer asserted were
      not entailed are all entailed given only log2 M > 0. A control that cannot
      fail is not evidence and its pass may not be reported as confirmation. No
      computed value in the package is wrong because of this; what does not
      survive is the claim about what RG-4's pass establishes.
    - >-
      ACCEPT J4's and J6's BREAKS. J4 breaks on citation eligibility, not on the
      reconciliation, which the Red Team confirmed and strengthened. J6 breaks on
      the scope of the verdict word, not on its provenance, which was re-verified
      independently and holds - including the Coordinator's own suspicion that
      the producer might have reproduced a handed prior, which is not sustained:
      the producer overturned a load-bearing element of that prior.
    - >-
      RECORD THAT PAPER_PAIRS IS NOT A POINT OF THIS MODEL at log2 p in
      {256, 384, 512}: its transcribed time lies below the minimum the model
      attains on the contract's own declared optimizer grid. The two anchors are
      different kinds of quantity, not two estimates of one, and no control in
      the package tests anchor reachability. The reconciliation artifact's phrase
      "a genuine difference between two committed inputs" is too kind and is
      corrected here rather than repeated.
    - >-
      DO NOT TREAT "0.0 bits over 120 cells" AS VALIDATION. RG-1's and RG-2's
      exact agreement is an implementation agreeing with its own output under the
      same law from the same anchors - arithmetic self-consistency. A faithful
      re-implementation of a wrong expression tree would produce it identically.
      What bears independently is the blind re-derivation, which HOLDS, and the
      Validator's pre-registered derivation from the frozen specification alone.
    - >-
      OWN THE COORDINATOR'S OWN DEFECTS IN THIS ROUND, because three of them are
      mine and none is the producer's: the recorded prior carried a timing claim
      that git does not support; the review plan's three proves-too-much objects
      have, as the Red Team shows, the coverage of one quantity plus one
      tautology; and the producer's task card asked in prose for a cell whose
      value the dispatching instruction forbade restating, leaving the Executor
      to resolve a conflict I created.
    - >-
      DECLINE any promotion, transfer, or lifting. This round demonstrates no
      speedup, constructs no attack, and says nothing about SSI, SQIsign, CSIDH,
      or ECDLP security in either direction. `dominated_by` is NOT ASSESSABLE
      from this package and is recorded as such rather than invented.
  coordinator_prior_outcome:
    prior_location: >-
      review_plan.coordinator_prior on
      coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/tasks/TASK-20260904-1f4e2f/task_card.yaml
      and ledger/handoffs/TASK-20260904-1f4e2f.yaml, recorded before any reviewer ran
    per_element:
      - element: RG-0 returns fix_already_applied
        outcome: CONFIRMED on the implementation and the two runs; OVERTURNED in scope
        detail: >-
          Both reviewers re-verified the verdict where it was evidenced. J6
          breaks on the verdict word: a governing committed artifact still
          carries the pre-fix law, so the census that the verdict summarizes is
          incomplete by one artifact.
      - element: the repair was admitted upstream on 2026-08-09 and reached this branch only in the recent merge
        outcome: OVERTURNED
        detail: >-
          The decision is dated 2026-08-09; the SOURCE reached origin/main's
          first-parent line at 2675886ea on 2026-08-24 20:50:28 UTC, about
          2 h 18 min after BATCH-eb0a7e's snapshot base bd47a3f5c (18:32:12 UTC).
          Producer AN-1, independently re-derived by both reviewers, one of whom
          also checked the first-parent step the census asserted but did not
          show. BATCH-eb0a7e was reading a genuinely pre-fix revision; no fault
          attaches to it. Already corrected in
          BATCH-256a94/CORRECTION-20260904-rg0-timing.md and repeated here so the
          overturn is on the ledger and not only in a batch note.
      - element: the two corrected laws are algebraically identical in the frozen log2 units
        outcome: CONFIRMED, and strengthened beyond what the prior asked for
        detail: >-
          Confirmed by the Validator in a third summation order and by a blind
          re-derivation that read neither implementation and reproduced all 240
          rows and both runs' crossover values to 0.000e+00 bits.
      - element: the BATCH-eb0a7e law was "derived independently"
        outcome: OVERTURNED as a claim of independence
        detail: >-
          CORR-20260808-c792f8 already stated the corrected law and crossover and
          was readable at BATCH-eb0a7e's own base. The agreement is transcription
          fidelity between two implementations of one committed formula.
      - element: the fitted_opt / PAPER_PAIRS divergence survives reconciliation as a genuine difference between two committed inputs
        outcome: CONFIRMED that it survives; SHARPENED against the prior's framing
        detail: >-
          It survives, and it is worse than "two committed inputs" conveys:
          PAPER_PAIRS is not a point of this model at three of five field sizes,
          so the two anchors are not two estimates of one quantity.
      - element: the P=512 / w=2^80 prohibition remains in force
        outcome: CONFIRMED, and the prohibition is found UNDER-SCOPED
        detail: >-
          Retained here, and widened by predicate: the anchor-dependent sign flip
          that is the prohibition's rationale also occurs at two log2 p = 256
          rows that the machine-readable flag reports as unprohibited.
      - element: at least one residual bookkeeping inconsistency that is not a law defect
        outcome: CONFIRMED (R1-R8), but the prior missed the one that matters
        detail: >-
          The prior enumerated required_artifacts, the RAW_PATH default and the
          C1 partial_fail, and anticipated none of them being in the frozen
          contract's own statement of the crossover.
      - element: the findings that would most inform the program are a fix_outstanding verdict, a demonstrated inequivalence, or a demonstration that the divergence is an arithmetic artifact
        outcome: NONE OF THE THREE OCCURRED; a fourth, unanticipated overturn did
        detail: >-
          The most informative result of this round is one the prior did not
          enumerate: the frozen contract itself is internally unsatisfiable at
          specification.yaml:39-40 against C4. Recorded plainly because a prior
          that fails to anticipate the actual break is exactly the outcome the
          pre-registration exists to make visible.
  citation_boundary:
    status: RETAINED IN FULL AND WIDENED. NOT LIFTED BY THIS DECISION.
    retained_verbatim: >-
      The `P=512` crossover value and its `w=2^80` sign are **NOT
      citation-eligible**. This task does not lift that prohibition. Only a
      committed Coordinator decision on independently reviewed evidence can lift
      it.
    lift_refused_because:
      - >-
        One of the two anchors is infeasible for this model at three of five
        field sizes, so citing "under both anchors" would publish a figure
        derived from a pair the model cannot produce, and naming the anchor does
        not repair that because nothing in the committed record said so before
        this round.
      - >-
        The resolving power is not established at the scale that decides the
        sign: the anchor gap is 0.18-3.22 bits and the contract's own C1 sanity
        tolerance of 0.75 bits is exceeded at every field size.
      - >-
        The overhead c is a declared free scenario knob, not a measurement, so
        any sign statement is conditional on an unmeasured parameter.
      - >-
        Neither run's execution provenance is attested; both manifests record
        dirty_tree: true. Lifting promotes a number to quotable status, which is
        exactly where unattested provenance stops being tolerable.
      - >-
        RC-1 has never been performed, so the anchor question is not merely
        undetermined but untested at its cheapest decisive point.
    extension_enacted_now: >-
      WIDENING, NEVER A LIFT, and within the Coordinator's sole authority because
      withholding a citation requires no evidence while permitting one does. In
      addition to the retained sentence, a row of any EXP-WESOVOW-001
      reconciliation is NOT citation-eligible when either (a) the two anchors
      disagree in the SIGN of the baseline comparison at that row, or (b) the
      smaller |margin| across the two anchors at that row is below that field
      size's anchor gap |Delta log2 T_full + Delta log2 M / 2|. This predicate
      covers the currently prohibited log2 p = 512 family AND the two log2 p =
      256 rows identified by the Red Team at (log2 w = 50, c = 0.0) and
      (log2 w = 70, c = 0.5), and it remains correct if the grid is ever
      extended, which a field-size index does not.
    machine_flag_status: >-
      anchor_reconciliation.json's per-row `citation_prohibited` flag is scoped
      by field size (48 rows, all at log2 p = 512) and is now KNOWN TO
      UNDER-REPORT: at least two rows carrying `citation_prohibited: false` fall
      under the predicate above. That artifact is snapshot-bound and immutable
      and MUST NOT be edited. The correction lives in this decision; any
      successor artifact implementing the flag implements the predicate, and any
      consumer reading the committed JSON must apply this decision on top of it.
  procedure_deviations:
    - id: PD-1
      what: >-
        BATCH-256a94/CORRECTION-20260904-rg0-timing.md was committed at
        19f3a222b (17:12:08 UTC), before the snapshot archive (17:16:42 UTC) and
        before either reviewer ran, and it states of the very verdict under
        review that it "is unaffected and stands".
      raised_by: red-team, TASK-20260904-22e444 section 4.4 (objection O9)
      coordinator_ruling: >-
        Recorded as a deviation from the review plan, whose procedure_deviations
        was empty. Correcting the record promptly was right and the note is
        scrupulous about its own scope, but affirming a reviewed verdict in a
        committed batch artifact before the round reports is not
        self-documenting and had to be written down. It changed no reviewer's
        verdict: the Validator recorded the batch's opening material as
        inadmissible and the Red Team declined to treat the note as evidence.
        Future rounds: a pre-review correction states what it corrects and does
        NOT state that the reviewed verdict stands.
    - id: PD-2
      what: >-
        The producer's task card asked anchor_reconciliation.md to include the
        P=512, log2 w = 80, c = 0 cell "under both anchors" in prose, while the
        dispatching instruction forbade restating that value or sign anywhere.
        The Executor followed the stricter instruction, gave locators instead of
        values, retained and flagged the numeric rows in the JSON, and reported
        the conflict as R8.
      raised_by: executor, TASK-20260904-1f4e2f (outstanding_fix.md R8)
      coordinator_ruling: >-
        The Executor resolved it correctly and disclosed it, which is the
        behaviour the contract wants. THE CONFLICT WAS MINE: a task card must not
        request in prose a value its own dispatching instruction prohibits.
        Ruling for successors: the prohibition governs, a locator satisfies any
        deliverable that names a prohibited cell, and completeness of a
        machine-readable grid is met by flagged rows.
    - id: PD-3
      what: >-
        The Red Team ran a control that the plan did not declare (a
        mixed-anchor audit of all 240 rows, from the JSON alone) and added a
        FOURTH proves-too-much object beyond the three declared.
      raised_by: red-team, TASK-20260904-22e444 sections 2(b) and 5
      coordinator_ruling: >-
        Both additions are ADMITTED as within its ownership of the
        proves-too-much control, and both are the most informative things the
        control produced. The undeclared audit closed a hole no declared control
        could reach, because the plan's own prohibition on mixed-anchor rows was
        otherwise discharged only by an assertion about a file the reviewer was
        blind from. The fourth object is the control's one genuine break. The
        plan should have carried both; that omission is the Coordinator's.
    - id: PD-4
      what: >-
        The Red Team's card declared `maximum_runs: 2`. It executed zero runs of
        any experiment or producer implementation and invoked its own throwaway
        analysis script nine times, two of which aborted. It flagged the budget
        ambiguity rather than resolving it silently.
      raised_by: red-team, TASK-20260904-22e444 section 7
      coordinator_ruling: >-
        Its reading is correct and is ruled to be the standing interpretation for
        review tasks in this program: `maximum_runs` on a review card bounds
        executions of experiment code, producer implementations, and anything
        that writes a run record; a reviewer's own throwaway arithmetic is not a
        run. The batch's `new_experiment_runs_authorized: 0` was honoured by
        every task. Successor review cards state this explicitly instead of
        leaving it to be inferred.
    - id: PD-5
      what: >-
        The Validator imported reconcile.py as a module to feed the producer's
        own control functions failing inputs, and read a PRIOR round's report
        (BATCH-eb0a7e/reviews/TASK-20260824-5b150a/validation_report.md) to
        verify a caveat the producer quotes from it.
      raised_by: validator, TASK-20260904-e13cf2 (declared in its attestation)
      coordinator_ruling: >-
        NOT A DEVIATION, and recorded so that a later reader does not mistake it
        for one. Both were directed by its own attack plan, the prior round's
        report is not a sibling in this round, the import executed no `main()`
        and wrote only to a scratchpad, and the reviewer declared both. The J5
        method - running the producer's control code against inputs designed to
        break it - is what made the refutation checkable rather than rhetorical.
    - id: PD-6
      what: >-
        tools/check_review_independence.py was not run before this composition,
        and neither was tools/validate_ledger.py.
      raised_by: coordinator, TASK-20260904-63e06e
      coordinator_ruling: >-
        This archive task held no shell, so the check could not be run and MUST
        NOT be reported as run. The round's blindness is attested by both
        reviewers and was checked by the composing Coordinator reading both
        reports in full and finding no cross-reference in either. That is weaker
        than the tool and is recorded as such: the gate stays OUTSTANDING in
        coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/archives/TASK-20260904-63e06e/ledger_commit_receipt.json
        and the committing session must satisfy it, together with
        validate_ledger.py, the origin/main fetch-and-merge, the push, and the
        PR, before this round is treated as complete or this decision as durable.
