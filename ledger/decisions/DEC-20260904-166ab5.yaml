  limitations:
    - >-
      NO hypothesis status, NO experiment status, and NO research-direction
      status changes. EXP-WESOVOW-001 remains `approved` and untouched;
      GOAL-SSI-001 remains `active`. No completion criterion of GOAL-SSI-001 is
      met or approached, and nothing in this round moves toward one.
    - >-
      No experiment was executed or re-executed anywhere in BATCH-256a94, and no
      new run record exists. Nothing here is a measurement.
    - >-
      No security, SQIsign, CSIDH, standardized-parameter, exponent, asymptotic,
      speedup, or attack claim is made or supported in either direction. No
      asymptotic promotion gate is engaged.
    - >-
      The two reviews are SESSION-independent but NOT MODEL-independent: only the
      `local` backend resolved, both reviewers self-report claude-opus-5, and
      neither ran an adapter probe, so both record model_verified false or
      undetermined. Their concurrence on the specification.yaml:39-40 finding is
      corroboration by two independent METHODS in two independent SESSIONS and
      may never be presented as agreement between distinct models.
    - >-
      This decision does not repair specification.yaml. A frozen contract is
      changed only by a recorded protocol amendment, never by an edit, and this
      decision authorizes no edit to any frozen path.
    - >-
      RG-4 is refuted as a control; nothing follows about the correctness of any
      value it computed, all of which reproduce.
    - >-
      `dominated_by` is NOT ASSESSABLE from this package. No Pareto comparison
      against any external method exists in it and none may be inferred from the
      log2speedup_vs_DG_current_law column.
    - >-
      The independence checker, the ledger validator, the origin/main merge, the
      push and the PR were not performed by this task and are recorded as
      outstanding in the ledger commit receipt. Until they pass, this decision is
      unpublished, not durable evidence.
  next_actions:
    - >-
      SINGLE NEXT ACTION - RC-1. Open one bounded successor batch on GOAL-SSI-001
      whose first and gating task verifies the five PAPER_PAIRS literals at
      experiments/EXP-WESOVOW-001/cost_model.py:61-65 against Section 4.1 of
      inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, with page or line locators,
      in a task whose read_scope includes that path. It is a text lookup, both
      reviewers name it the cheapest decisive step in the round, and it is the
      only step that can distinguish a transcription defect from a model defect
      from a genuine external disagreement. Chosen over the contract
      reconciliation amendment because the amendment's correct content depends
      on it: if
      the literals are mis-transcribed, the anchor question changes shape before
      any contract text is rewritten. Nothing else is dispatched until that batch
      is scoped.
    - >-
      CARRIED FORWARD, RECORDED AND NOT DISPATCHED - to be scoped by that batch
      or its successor, each with its origin: (RC-6/O1) a recorded protocol
      amendment or superseding note reconciling specification.yaml:39-40 with the
      crossover frozen in TASK-20260809-ef3e58, since the contract as frozen is
      internally unsatisfiable against its own C4; (RC-2) an anchor-feasibility
      control comparing any anchor's log2 T_full against the model's attained
      minimum on the contract's optimizer grid before that anchor is used;
      (RC-4) a discrimination control whose known difference sits at the 0.2-3.2
      bit scale this campaign actually cares about, since RG-3 bounds resolution
      nowhere tighter than 46.25 bits; (RC-3) a null-object recount of the sign
      disagreements using two synthetic anchors separated by the same per-field
      constant; (RC-7) attest, or record as unattestable, the two runs whose
      manifests carry dirty_tree: true; and (O7/R2) the standing hazard that
      cost_model.py's default output path writes into a committed run directory
      when WESOVOW_RAW_PATH is unset, which is an evidence-integrity hazard and
      is not to be left classified as a bookkeeping non-defect.
    - >-
      Keep the citation boundary as this decision leaves it: retained verbatim
      and widened by predicate. It is lifted only by a later committed
      Coordinator decision resting on independently reviewed evidence that
      answers RC-1 and the anchor question, and no reviewer recommendation,
      message, or tidy recomputation substitutes for that.
    - >-
      Successor review plans fix the three defects this round exposed in the
      plan itself: proves-too-much objects that do not all probe one constant and
      one identity; an explicit requirement that every declared control state the
      input that makes it fail ON A REAL ANCHOR, not a mutation of the law in the
      code; and a required runtime-session receipt in the producer's declared
      artifact set so its inference provenance is determinable from committed
      state.
  status_effect: >-
    No hypothesis status, no experiment status, and no goal status changes.
    GOAL-SSI-001 remains active with exactly one next action. This is a
    composition, record-acceptance, and citation-boundary decision only.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      The promotion rule fires only for `support` or `reject_scoped` on
      `replicated` or `strong` evidence; this decision is `revise` on
      EV-SSI-5d954c at strength `inconclusive`. There is no durable finding to
      promote: the round's transferable content is an unrepaired defect in a
      frozen contract, a refuted control, and an anchor-comparability question
      that RC-1 has not yet been run to answer. Promoting an open instrument
      defect into knowledge/findings/ would present unresolved work as settled.
      Reconsider promotion only after RC-1 reports and the contract
      reconciliation is recorded.
  decided_by: coordinator
  decided_at: '2026-09-04'
  decided_in_task: TASK-20260904-63e06e
