coordinator_decision:
  id: DEC-20260810-180d8e
  goal_id: GOAL-HAWK-001
  batch_id: null
  batch_id_note: >-
    NULL DELIBERATELY. This is a direct Coordinator ledger act that reconciles
    a goal head; it opens no batch, dispatches no worker, and consumes no
    campaign batch budget. Recording a batch id here would repeat the very
    ambiguity D2/DIV-1 of CORR-20260810-a2bbd5 records about the 2026-08-06
    scope correction, whose two records self-label a batch they were not
    committed with.
  recorded_at: '2026-08-10'
  decision: revise
  target_ids:
    - GOAL-HAWK-001

  context: >-
    GOAL-HAWK-001's head at origin/main describes a campaign that stopped at
    BATCH-002 on 2026-08-02. The committed record shows it ran two further
    batches (BATCH-56498f, BATCH-d44912) plus one direct Coordinator
    scope-correction commit through 2026-08-06, producing four decisions
    (DEC-20260805-bdcb53, DEC-20260805-77a735, DEC-20260805-ed4cd3,
    DEC-20260805-a62164), four evidence records (EV-HAWK-af783e,
    EV-HAWK-68b8b6, EV-HAWK-c99848, EV-HAWK-21edba), two knowledge promotions
    (KN-FIND-528ca0, KN-LIT-7674) and three review reports. The head's
    current_batch_id had been REGRESSED to BATCH-002 by a merge that resolved a
    conflict inside the committed ledger record by picking a side, and its
    next_action had become a three-layer splice ending in a headless remnant
    that contradicts its own opening. CORR-20260810-a2bbd5 records all of this
    as defects D1-D8 with, for each, the field, the prior value, the corrected
    value, and the committed evidence. THIS DECISION ADOPTS THAT CORRECTION AND
    THE HEAD EDITS IT DIRECTS. It is the superseding record AGENTS.md "Durable
    research commits" requires for D1, since that rule forbids resolving a
    ledger-record conflict by editing.

  rationale:
    - >-
      D1 IS A CONTRACT VIOLATION, NOT A TYPO. AGENTS.md "Durable research
      commits": "when a sync conflicts inside a ledger record, run artifact, or
      knowledge entry, the resolution is a new superseding record under a new
      id - the same rule as any other correction - and never an edit that picks
      one side." Merge 3994acb2d picked a side, reverting current_batch_id from
      BATCH-d44912 to BATCH-002 in a single one-line hunk. The remedy the rule
      names is a new record; CORR-20260810-a2bbd5 is it, and the immutable
      merge commit is left alone.
    - >-
      THE CORRECTED VALUE IS EVIDENCED, NOT PREFERRED. Six committed records
      read directly in this worktree self-label batch_id BATCH-d44912
      (DEC-20260805-77a735, DEC-20260805-ed4cd3, DEC-20260805-a62164,
      EV-HAWK-68b8b6, EV-HAWK-c99848, EV-HAWK-21edba); BATCH-002 has no
      directory at all and the head's own BATCH-002 checkpoint says "NOT
      CONSTRUCTED" (CORR-20260802-bc9e33 OI-3); commit 893483df8 had set the
      field to BATCH-d44912 and 61d5ccbb1 left it there.
    - >-
      A HEAD THAT SAYS "NO FURTHER ACTION REQUIRED" WHILE ITS GOVERNING
      DECISION LISTS OPEN ITEMS UNDERSTATES THE WORK. DEC-20260805-a62164's
      `what_needs_to_be_established_freshly` names two: the count of fractional
      O_F-ideals of relative norm q'O_K in the NUMBER FIELD setting (Dedekind
      domain O_F, F = K(√α)), which "needs independent verification", and the
      Dedekind-domain argument for J = (1/r)·I with N_{F/K}(I) = r^2·q'O_K. No
      committed artifact of this campaign performs either - both committed
      derivations are about quaternion-order ideals, which is exactly the
      object DEC-20260805-a62164 rules out for HAWK's totally definite algebra
      A = (-1,-1|K). AGENTS.md "Research-direction integrity and auditability"
      makes that understatement a defect to record, so it is recorded (D8) and
      the open item becomes the head's single next action.
    - >-
      THE SPLICED next_action HAD TO GO WHOLESALE, NOT LINE BY LINE. Three
      successive commits each replaced only the leading line, so the record now
      simultaneously says the corrected nrd-PIP cost is answered and directs
      deriving it as "the cheapest remaining move". A fourth leading-line patch
      would produce a fourth layer. The full prior text is preserved verbatim
      in next_action_history, so replacing it loses nothing.
    - >-
      WHAT IS NOT CORRECTED IS NAMED WITH A REASON AND A SUCCESSOR.
      latest_verified_commit (7c3cce2c, predating all three later archives) is
      left untouched because it is receipt-bound and this coordinator-only
      session ran no git command; writing a sha no command produced would be
      the fabrication AGENTS.md core rule 5 forbids and that TASK-20260807-dcfaee
      already stopped short of for GOAL-MLDSA-001. dispatch_queue_path is left
      pointing at BATCH-001's queue because NEITHER BATCH-56498f NOR
      BATCH-d44912 CONTAINS A dispatch_queue.json - there is no conforming file
      to point it at, and naming a nonexistent path would be worse than naming
      a stale one.
    - >-
      THE OWED CONFORMING QUEUE IS NOW RETROSPECTIVE AS WELL AS PROSPECTIVE.
      The obligation recorded at CORR-20260802-bc9e33 OI-3 was never
      discharged, and two further batches then dispatched work with no queue.
      That does not retract their results - artifacts, reviews and decisions are
      committed - but it does mean their task states, budgets and completion
      gates were never independently checkable. The obligation is carried into
      the next action as the first requirement of the next batch (D7).

  evidence_refs:
    - CORR-20260810-a2bbd5
    - DEC-20260805-bdcb53
    - DEC-20260805-77a735
    - DEC-20260805-ed4cd3
    - DEC-20260805-a62164
    - EV-HAWK-af783e
    - EV-HAWK-68b8b6
    - EV-HAWK-c99848
    - EV-HAWK-21edba
    - EV-HAWK-001
    - DEC-20260802-007
    - CORR-20260802-bc9e33
    - CORR-20260802-a1f151
    - KN-FIND-528ca0
    - KN-LIT-7674
    - KN-OPEN-028
    - RECON-20260810-001

  reconciled_head_values:
    current_batch_id: >-
      BATCH-002 -> BATCH-d44912 (D1).
    updated_at: >-
      '2026-08-02' -> '2026-08-10' (D4).
    batch_checkpoints: >-
      Three entries appended (D2): BATCH-56498f (closed; DEC-20260805-bdcb53,
      advance_with_repair_required; EV-HAWK-af783e; validator
      TASK-20260805-36cc26 verdict accept_with_qualifications; red team
      TASK-20260805-80676e verdict pass_with_constraints; no dispatch queue);
      BATCH-d44912 (closed; DEC-20260805-77a735 promote_kn_find and
      DEC-20260805-ed4cd3 case_c_confirmed_from_paper_body; EV-HAWK-68b8b6 and
      EV-HAWK-c99848; KN-FIND-528ca0 and KN-LIT-7674 promoted; validation
      report verdict accept_with_qualifications CARRYING NO DISTINCT TASK-* ID;
      NO RED-TEAM REVIEW EXISTS; no dispatch queue); and the 2026-08-06 scope
      correction recorded as `entry_kind: direct_coordinator_ledger_commit -
      NOT A BATCH` (DEC-20260805-a62164, EV-HAWK-21edba, commit 61d5ccbb1, no
      batch directory, no review, consumes no batch budget).
    next_action_history: >-
      Three entries appended (D6): the text overwritten at 893483df8, of which
      only the leading line "EXACTLY ONE NEXT ACTION, and it does NOT require
      the paper. Derive the" is recoverable; the text overwritten at 61d5ccbb1,
      of which only the leading line "BATCH-d44912 CLOSED (DEC-20260805-77a735).
      KN-FIND-528ca0 promoted." is recoverable; and the spliced text this
      decision replaces, preserved verbatim with superseded_because naming D3.
    next_action: >-
      Replaced wholesale (D3, D8) with one concrete action: open the next batch
      with a CONFORMING dispatch queue (discharging D7), whose head task is the
      number-field Dedekind-domain O_F-ideal count derivation named by
      DEC-20260805-a62164.
    latest_verified_commit: >-
      UNCHANGED at 7c3cce2c. Recorded stale in D5, not repaired: receipt-bound,
      and this session ran no git command.
    dispatch_queue_path: >-
      UNCHANGED at BATCH-001's queue. Recorded stale in D7, with the reason: no
      conforming queue was ever built for BATCH-56498f or BATCH-d44912.
    status: >-
      UNCHANGED at `active`. No completion criterion is met.
    active_hypothesis_ids: >-
      UNCHANGED at []. H-HAWK-c7a551 and H-HAWK-a28be6 exist at
      `status: proposed` naming this goal; admitting a lane is a research act
      this reconciliation does not perform (CORR-20260810-a2bbd5 OBS-1).

  campaign_budget_position:
    maximum_batches: 6
    consumed: 4
    consumed_ids: [BATCH-001, BATCH-002, BATCH-56498f, BATCH-d44912]
    remaining: 2
    scope_correction_consumed_none: >-
      The 2026-08-06 scope correction (DEC-20260805-a62164, EV-HAWK-21edba,
      commit 61d5ccbb1) CONSUMED NO BATCH BUDGET: it was a direct Coordinator
      ledger commit with no batch directory, no dispatch queue, no producer
      task and no review. Neither does this decision.
    caveat: >-
      BATCH-002 counts as consumed although it was never constructed as a
      formal dispatch queue (CORR-20260802-bc9e33 OI-3): the work was done and
      committed directly, and its checkpoint is closed. Counting it is the
      conservative reading of the budget; the alternative would silently return
      a batch to the campaign on the strength of a coordination defect.
    what_the_remaining_two_must_cover: >-
      At minimum the next action below (conforming queue + number-field
      derivation), and any independent review that action requires. Two batches
      is not obviously enough to also reach completion criterion 1, and this
      decision does not claim it is.

  limitations:
    - >-
      THIS DECISION RECONCILES THE RECORD ONLY. IT MAKES NO NEW MATHEMATICAL
      CLAIM ABOUT HAWK, MODULE-LIP, nrd-PIP, OR ANY OTHER OBJECT, IN EITHER
      DIRECTION. No claim tier moves; the campaign ceiling stays `toy`. No
      hypothesis status changes, no evidence record is filed, no experiment is
      approved, no knowledge entry is promoted or retracted, and nothing here
      is admissible toward a closure quorum.
    - >-
      THE THREE UNDERLYING DECISIONS CARRY WEAK PROVENANCE, AND THIS DECISION
      RESTS ON THEM. DEC-20260805-bdcb53, DEC-20260805-77a735 and
      DEC-20260805-a62164 each record
      `inference_provenance.resolved_model_id:
      amazon-bedrock/us.anthropic.claude-sonnet-4-6` with `fallback_used: true`
      and `model_verified: false`; so do DEC-20260805-ed4cd3 and all three
      review reports. AGENTS.md rule 16 prohibits Bedrock going forward but
      states that "Historical receipts that record prior Bedrock use remain
      immutable and must not be rewritten" - so those files are NOT modified.
      What it means for weight: no probe verified which model served them, the
      requested policy is recorded as not having answered, and the two
      BATCH-56498f reviews assert `independent_session: true` on the same
      unverified resolved model as the decision they review - the exact
      correlation AGENTS.md "Goal closure quorum" says does not constitute
      independent agreement. Their findings stand as findings and this decision
      cites them; they are not corroborated judgements and must not be
      presented as such.
    - >-
      BATCH-d44912'S REVIEW COVERAGE IS THINNER THAN BATCH-56498f'S, AND THAT
      IS RECORDED, NOT REPAIRED. Its validation report carries no distinct
      TASK-* identifier of its own (`task_id` names the PRODUCER,
      TASK-20260805-a39814; `validated_by` reads "review_task_d44912"), and NO
      RED-TEAM REPORT EXISTS ANYWHERE UNDER THAT BATCH. Completion criterion 2
      requires both an independent Validator AND an independent Red Team; that
      criterion is not met for the batch that promoted KN-FIND-528ca0.
    - >-
      THE PAPER-BODY CLAIMS ARE NOT RE-CHECKABLE FROM THE REPOSITORY.
      DEC-20260805-ed4cd3, EV-HAWK-c99848 and DEC-20260805-a62164 rest on the
      body text of iacr:2026/1318, which KN-LIT-7674 records as user-provided
      in session on 2026-08-05 and which is not filed anywhere under inputs/.
      A later session cannot verify those readings against a committed
      artifact.
    - >-
      NO GIT FACT IN THIS DECISION WAS ESTABLISHED BY THIS SESSION. Every
      commit sha and diff statement was verified by the orchestrating session
      against this worktree and is carried as given; this session has no shell.
      No sha is reconstructed, inferred, or estimated anywhere.
    - >-
      THE BRIEFING THIS SESSION RECEIVED DIVERGED FROM THE FILES IN TWO
      PLACES, both recorded verbatim in CORR-20260810-a2bbd5
      `divergences_from_the_briefing_this_session_received` rather than
      reconciled silently: (DIV-1) DEC-20260805-ed4cd3 and EV-HAWK-c99848 also
      self-label batch_id BATCH-d44912, as do DEC-20260805-a62164 and
      EV-HAWK-21edba themselves despite being committed a day later as a
      non-batch ledger commit; (DIV-2) DEC-20260805-a62164 does NOT leave the
      A/B/C case open - it states "Q1 REMAINS CLOSED via the correct argument
      (O_F-ideals in the number field, bounded-β Case C, DEC-20260805-ed4cd3)".
      The record that leaves the case open is the goal head itself, which is a
      further layer of the same splice. NEITHER DIVERGENCE WEAKENS THE REFUSAL
      TO CLOSE: closure fails on the completion criteria as written,
      independently of the case question.
    - >-
      THIS DECISION DOES NOT AUTHORIZE THE CONTACT-AUTHOR REQUEST for
      iacr:2026/1318. CORR-20260802-bc9e33 OI-1 stands: it is outward-facing
      correspondence with named third parties, it requires EXPLICIT USER
      AUTHORIZATION that no record carries, and it must not be sent.

  goal_status_disposition:
    status: active (unchanged)
    why_not_completed: >-
      NO COMPLETION CRITERION IS MET. Criterion 1 requires either a certified
      secret-key recovery at a HAWK-shaped instance or an identification WITH
      DERIVATION of the failing heuristic AND the resulting true cost floor:
      there is no certified recovery, and the number-field derivation
      DEC-20260805-a62164 calls for has not been done, so the identification is
      incomplete. Criterion 2 requires independent Validator AND Red Team
      sessions admitting the run package: BATCH-d44912 has no red-team review at
      all. Criterion 3 requires the conclusion committed through a VERIFIED
      ledger archive, and D5 records that no verified archive sha is available
      to this session.
    quorum_note: >-
      The AGENTS.md rule 13 three-model closure quorum is SUSPENDED. That is
      irrelevant here: a suspended quorum removes a gate on closure, it does not
      satisfy an unmet completion criterion. No attestation, review verdict, or
      quorum is recorded by this decision. The only verdicts cited anywhere in
      this act are the three that exist in report files, each attributed to its
      file.
    why_not_paused: >-
      No pause condition has fired. The campaign has two batches of budget
      remaining, the next action is concrete, cheap, and NOT blocked by the
      source gate or by the unauthorized contact-author request.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NO DURABLE CLAIM IS PRODUCED. This is a record reconciliation: it
      corrects goal-head fields and records eight defects with their evidence.
      It derives nothing, measures nothing, and reviews no mathematics. The
      knowledge entries this campaign has already produced (KN-FIND-528ca0,
      KN-LIT-7674, KN-OPEN-028) are untouched - neither promoted further nor
      retracted - and the scope correction DEC-20260805-a62164 applied to
      KN-FIND-528ca0 stands exactly as that decision left it. A KN-FIND would
      be warranted only for a `support` or `reject_scoped` on
      replicated/strong evidence, and this decision is neither.

  next_actions:
    - >-
      OPEN THE NEXT GOAL-HAWK-001 BATCH WITH A CONFORMING DISPATCH QUEUE - each
      task carrying its own write scope, budget and completion gate, and each
      archive receipt committed inside the archive commit it binds, discharging
      the obligation from CORR-20260802-bc9e33 OI-3 that CORR-20260810-a2bbd5
      D7 carries forward over BATCH-56498f and BATCH-d44912 - whose HEAD TASK
      is the number-field Dedekind-domain derivation named in
      DEC-20260805-a62164's `what_needs_to_be_established_freshly`:
      independently verify, for O_F the ring of integers of F = K(√α) (a
      Dedekind domain, NOT the quaternion order), the count of fractional
      O_F-ideals of relative norm q'O_K, via the stated argument that for
      J = (1/r)·I with r ∈ O_K and I integral satisfying
      N_{F/K}(I) = r^2·q'O_K the count grows with r, and check it against the
      paper authors' own statement that the count exceeds O(n^{1+o(1)}).
      Constraints that travel with it, unchanged: the contact-author request
      for iacr:2026/1318 still awaits explicit user authorization
      (CORR-20260802-bc9e33 OI-1) and must not be sent; the claim-tier ceiling
      stays `toy`; the producer task requires an independent Validator AND an
      independent Red Team, the pairing BATCH-d44912 lacked. THIS SESSION DID
      NOT RUN IT: it needs a producer subagent under a dispatched task, and
      this was a coordinator-only reconciliation whose entire write scope was
      three ledger paths.

  decided_by: coordinator
  decided_at: '2026-08-10'

