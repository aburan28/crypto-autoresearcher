coordinator_decision:
  id: DEC-20260904-9be0f2
  context: >-
    Opening one bounded successor batch, BATCH-dc1424, on GOAL-SSI-001, under the
    single next action of the committed decision DEC-20260904-166ab5 and under the
    repository owner's explicit ruling of 2026-09-04 that RC-1 runs first. BATCH-256a94
    closed as `revise` with EV-SSI-5d954c at strength `inconclusive`. Its headline
    adverse finding is that the frozen contract experiments/EXP-WESOVOW-001/specification.yaml
    still carries the pre-fix analytic crossover at lines 39-40 and is internally
    unsatisfiable against its own control C4; its second finding is that PAPER_PAIRS
    is not a point of this cost model at three of five field sizes; and its recorded
    gap is that nobody has ever compared the five PAPER_PAIRS literals against the
    source paper. This decision approves the composition, scope, controls, review
    architecture and budget of the successor batch. It approves no experiment, changes
    no status, and records no result.
  decision: approve
  decision_scope: batch_composition_and_review_architecture
  target_ids:
  - GOAL-SSI-001
  - BATCH-dc1424
  - EXP-WESOVOW-001
  - TASK-20260904-d66403
  - TASK-20260904-977d04
  - TASK-20260904-82665d
  - TASK-20260904-c8675d
  - TASK-20260904-cb8d1d
  rationale:
  - >-
    RC-1 IS DISPATCHED FIRST AND ALONE BECAUSE THE AMENDMENT'S CORRECT CONTENT DEPENDS
    ON IT. The owner's ruling and DEC-20260904-166ab5 agree: if the literals are
    mis-transcribed, the anchor question changes shape before any contract text
    is rewritten. Writing the RC-6 amendment first would freeze a reconciliation
    whose premise is untested. RC-1 is a text lookup against a frozen document and
    is the cheapest decisive step available anywhere in this campaign.
  - >-
    ALL THREE RC-1 OUTCOMES ARE CONTRACTED AS RESULTS, AND THE HARDEST ONE IS NAMED
    AS A SUCCESS. `undetermined` - the paper does not state the pairs in a directly
    comparable form - is not a failed task. It would establish that PAPER_PAIRS
    was never a transcription of stated values, hence that the two anchors were
    never two estimates of one quantity, hence that the reconciliation framing of
    BATCH-eb0a7e and BATCH-256a94 was mis-posed. A contract that treated `undetermined`
    as a shortfall would push the Executor toward a derivation, and a derivation
    reported as what the paper says is the exact failure this task exists to detect.
    The card therefore separates `derived_comparison` from the verdict and forbids
    the former becoming the latter.
  - >-
    THE PRE-REGISTRATION IS WRITTEN BY THE COORDINATOR, NOT CHOSEN BY THE PRODUCER.
    The tolerance (0.05 bits, half a unit in the last decimal place the literals
    carry), the directly-comparable test, and the composition rule (mis_transcribed
    > undetermined > faithful) are fixed on the task card before the paper is opened.
    AGENTS.md forbids changing a success criterion after observing an outcome; the
    cheapest way to honour that here is to remove the choice from the agent that
    will see the outcome.
  - >-
    RC-2 IS ADDED BECAUSE NO COMMITTED CONTROL TESTS ANCHOR REACHABILITY. EV-SSI-5d954c
    records that the procedure of BATCH-256a94 accepted an infeasible anchor and
    emitted 120 fully formed rows from it, 72 at field sizes where the anchor is
    not a value of the function, with no schema field recording that the anchor
    was off-curve. RC-2 is cheap (a comparison of committed numbers), it is gated
    behind the frozen RC-1 verdict so it cannot contaminate the gate, and it carries
    failure branches in BOTH directions on real inputs.
  - >-
    EVERY CONTROL NAMES THE INPUT THAT MAKES IT FAIL, ON A REAL OBJECT. DEC-20260904-166ab5
    refuted RG-4 for having no reachable failure branch on any real anchor, so its
    pass carried no information. VC-1's decoys, VC-2's delta ladder and RC-2's two
    directions are all real inputs, and a whole review joint (J3) is assigned to
    constructing those inputs and calling the producer's own functions on them rather
    than reading its prose.
  - >-
    THE REVIEW ARCHITECTURE BUYS THE ONE THING VALIDATION CANNOT. The Red Team's
    assignment is not an audit but a second independent instance of the measurement:
    a blind re-transcription from the source by an agent that has never seen the
    committed literals, the producer's answer, or any record from which they can
    be reconstructed. That is why its blind_from list includes EV-SSI-5d954c, both
    BATCH-256a94 reconciliation artifacts, both prior review reports and both run
    directories, and why no control-plane file of this batch restates any of the
    ten values or the five deltas. The joint split is four to the Validator and
    one to the Red Team because a reviewer that opens the package to attack a second
    joint has spent the blindness that makes the first joint worth having.
  - >-
    THE REVIEW ARTIFACTS ARE .yaml, WHICH REPAIRS A GATE THAT WAS INERT. In BATCH-256a94
    both reports were .md, so tools/check_review_independence.py - which yaml.safe_loads
    the whole report file - could read neither attestation and the independence
    gate could not run at all; blindness had to be verified by hand and was recorded
    as weaker. Both reports here are YAML with a top-level review_attestation, exactly
    one file in the batch directory carries a review_plan, and no non-review artifact
    carries a review_attestation key, so `--batch` resolves one plan and exactly
    two reports.
  - >-
    WHAT THIS BATCH CANNOT CHECK IS SAID OUT LOUD. The Phase A / Phase B ordering
    with respect to cost_model.py and DEC-20260904-166ab5 is attested, not tool-checked,
    because the re-transcriber must open both in Phase B; and the two reviews are
    session-independent but not model-independent, because only the `local` backend
    resolves here. Recording both limits in the plan is what keeps the round from
    reading as stronger than it is.
  - >-
    THE CITATION PROHIBITION IS RETAINED IN FULL AND WIDENED BY PREDICATE, AND THE
    PREDICATE'S APPLICATION HERE IS REASONED RATHER THAN ASSUMED. No task of this
    batch computes a crossover, a baseline comparison, a margin or a speedup, so
    neither the retained sentence nor the predicate is expected to fire; every task
    must nonetheless restate both and report whether either fired, and the committed
    machine-readable flag remains known to under-report and must not be edited.
  - >-
    EVERY CARRIED-FORWARD ITEM IS NAMED, WITH ITS ORIGIN AND ITS DISPATCH STATE.
    CF-1 (the internally unsatisfiable frozen contract), CF-3 (RC-2), CF-4 (controls
    that can fail), CF-5 (.yaml review artifacts), CF-6 (runtime provenance), CF-7
    (RC-4, partially), CF-8 (RC-3), CF-9 (RC-7) and CF-10 (the RAW_PATH hazard)
    are recorded so that nothing from the closed round evaporates between batches,
    and the ledger archive is required to carry every still-undispatched one into
    its own next_actions.
  - >-
    THE RAW_PATH HAZARD IS CONTAINED RATHER THAN LEFT LIVE. No task of this batch
    may execute cost_model.py at all, so the default output path cannot write into
    a committed run directory during this batch. Containment is not repair, and
    the repair is carried forward with the amendment.
  - >-
    VERIFIED BY THE PERSISTING SESSION BEFORE THIS RECORD WAS FILED, because the
    designing coordinator held no shell and said so. (a) The three candidate identifiers
    DEC-20260904-9be0f2, EV-SSI-7a3e91 and DEC-20260904-4c81b6 were run through
    `tools/allocate_id.py --check`: all three well-formed and free across the union,
    so none was substituted. (b) GOAL-SSI-001's own goal head was read directly
    and its `next_action` does say "RC-1, AND ONLY RC-1", matching the DEC-20260904-166ab5
    text the coordinator quoted by proxy; the goal is `active`. (c) `research_dispatch.py
    --claims refs` renders the queue with 11/11 gates passed, plan sha256 07c1ce0767fcf3df64fb5e938a7f2018346097f3cb9983932afd95689098e941,
    and TASK-20260904-d66403 as the only Ready task. (d) The two review handoffs
    were searched for each other's task identifier: zero occurrences in either direction,
    so the blinding holds as written in the control plane.
  evidence_refs:
  - ledger/decisions/DEC-20260904-166ab5.yaml
  - ledger/evidence/EV-SSI-5d954c.yaml
  - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/batch.yaml
  - >-
    coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/tasks/TASK-20260904-1f4e2f/task_card.yaml
  - experiments/EXP-WESOVOW-001/specification.yaml
  - experiments/EXP-WESOVOW-001/cost_model.py
  - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/batch.yaml
  - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/dispatch_queue.json
  - >-
    coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/tasks/TASK-20260904-d66403/task_card.yaml
  limitations:
  - >-
    THIS DECISION APPROVES A BATCH, NOT AN EXPERIMENT AND NOT A RESULT. No hypothesis
    status, no experiment status, no research-direction status and no goal status
    changes. EXP-WESOVOW-001 remains `approved` and untouched. GOAL-SSI-001 remains
    `active`. No completion criterion is met or approached.
  - >-
    NOTHING HAS BEEN MEASURED. No task of this batch has run. No RC-1 verdict, no
    RC-2 reachability value, and no comparison exists yet, and none may be inferred
    from this decision or from the shape of the batch. The coordinator prior recorded
    on TASK-20260904-d66403 is a pre-commitment, explicitly not a finding.
  - >-
    THE COORDINATOR DID NOT READ SECTION 4.1 AND DELIBERATELY DID NOT. Doing so
    would have converted the recorded prior from a pre-registration into a post-hoc
    statement and would have made this role a participant in the measurement it
    is composing.
  - >-
    NO SECURITY, SQIsign, CSIDH, STANDARDIZED-PARAMETER, EXPONENT, ASYMPTOTIC, SPEEDUP
    OR ATTACK CLAIM is made or supported in either direction, and no asymptotic
    promotion gate is engaged.
  - >-
    THIS DECISION DOES NOT REPAIR specification.yaml AND AUTHORIZES NO EDIT TO ANY
    FROZEN PATH. A frozen contract changes only by a recorded protocol amendment.
  - >-
    THE THREE LEDGER IDENTIFIERS USED HERE - DEC-20260904-9be0f2, EV-SSI-7a3e91
    and DEC-20260904-4c81b6 - ARE CANDIDATES CHECKED BY DIRECT SEARCH, NOT BY tools/allocate_id.py
    --check, because the authoring task held no shell. They must be checked before
    use.
  - >-
    THE INFERENCE ENVIRONMENT IS CARRIED FORWARD, NOT PROBED. "local only" is taken
    from BATCH-256a94's recorded 15:22Z doctor run and is an assumption in this
    batch, re-checkable with `python3 -m orchestration.adapter doctor`.
  - >-
    THE READ OF THE GOAL HEAD IS BY PROXY. This task quoted the single next action
    from the committed decision DEC-20260904-166ab5 rather than from ledger/goals/GOAL-SSI-001/goal.yaml,
    which it could not project without a shell. The committing session should confirm
    the two agree.
  - >-
    RC-2 SITS INSIDE THE RC-1 PRODUCER CARD, WHICH IS WIDER THAN THE COMMITTED NEXT
    ACTION. GOAL-SSI-001's head says "RC-1, AND ONLY RC-1" and names RC-2 among
    the carried-forward items that are "NOT dispatched by this action"; the maintainer's
    ruling was likewise that RC-1 runs first. TASK-20260904-d66403 nonetheless carries
    RC-2 as a second phase of the same card. The card gates it hard -- the RC-1
    verdict is written and frozen before RC-2 is computed, RC-2 reads only committed
    numbers, and no RC-2 result may alter any RC-1 verdict -- so this is a scope
    widening, not a reordering, and it spends no new compute. It is recorded here
    rather than silently accepted because the discrepancy is with committed state,
    and a reader comparing the card against the goal head must not have to rediscover
    it.
  next_actions:
  - >-
    BEFORE TASK-20260904-d66403 IS DISPATCHED, resolve the RC-2 discrepancy named
    in the limitations: either sever RC-2 into a successor card so the dispatch
    matches "RC-1, AND ONLY RC-1", or record a superseding decision widening the
    next action to include it. Do not dispatch the card as written on the assumption
    that the gating language inside it is equivalent to not dispatching RC-2 at
    all.
  - >-
    Dispatch TASK-20260904-d66403, the only ready task at the opening state, and
    nothing else until its snapshot receipt is verified.
  - >-
    Persist this decision at ledger/decisions/DEC-20260904-9be0f2.yaml, or supersede
    it. Until then it is unpublished and is not evidence.
  - >-
    Hold the carried_forward list. CF-1 (the RC-6 amendment for the internally unsatisfiable
    frozen contract) is dispatched by this batch's successor on the RC-1 result;
    CF-9 (RC-7, attest or declare unattestable the two dirty_tree runs) is independent
    of RC-1 and may be dispatched in parallel next; CF-8 (RC-3) and CF-10 (the RAW_PATH
    repair) follow.
  - >-
    DISCHARGED BY THE PERSISTING SESSION, recorded so it is not re-done: the three
    candidate identifiers are `--check`ed and free, the goal head's next_action
    is confirmed to match the quoted decision text, and this decision is now persisted
    at ledger/decisions/DEC-20260904-9be0f2.yaml rather than living only in batch.yaml:opening_decision.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      The promotion rule fires only for `support` or `reject_scoped` on `replicated`
      or `strong` evidence. This is `approve` on a batch composition and rests on
      no evidence record of this round, because no task of this round has run. There
      is no finding of any kind to promote, and promoting a batch design into knowledge/findings/
      would present a plan as a result.
  decided_by: coordinator
  decided_at: '2026-09-04'
