      0.5-1.6 GB with temporaries, inside the cap; watchdogs are justified as
      hang protection and never read as results.

  rationale:
    - >-
      The census is the direct measurement of the user's question. Mean yield
      cannot move (KN-FIND-007); the second moment can, and kappa per class is
      the one number that decides whether x-structure is a non-generic
      relation source on this engine.
    - >-
      kappa is never reported alone. Informative rank (modulo an explicit
      formal basis per arm) and S_3 to solution travel with it, so a formal
      high-energy base (known_log) cannot read as a lever, and a j = 0
      automorphism excess cannot read as structure.
    - >-
      The instrument's range is proven in the same run: PC-1 (known_log) and
      PC-2 (j0) must pass, or the structural reading is inconclusive rather
      than null. The duplicated-column rank control is a unit fixture because
      a duplicate x cannot live in this engine's base without a solver change
      (disclosed in controls_design_notes).
    - >-
      No solver change, exact baseline: every committed row of all six sweep
      files must be reproduced with harvest off (G1), and harvest in passive
      census mode must reproduce the solver columns too (G2); a mismatch stops
      the census before any harvest number is read and is attributed to the
      change or to pre-existing drift (R17).
    - >-
      Matching is exact where the source asked for it: all arms on a curve
      share one target stream (target_label census) and one attempt budget;
      the Dickson arm gets its own matched random seeds because its size can
      differ from the subgroup arm's.
    - >-
      The pre-protocol scratch count is disclosed and fenced off: the ALIVE
      test reads 30 and 32 bits on fresh census curves, and the scratch cells
      are recomputed only as a labelled replication.
    - >-
      Target profile: the generic part moves only a constant at odd m and an
      even-m exponent that stays above rho; the structural part is the only
      exponent-relevant branch, (1+beta-delta)/2 if kappa ~ N^delta, and is
      pre-committed to the null. A positive is a lever candidate routed to
      review-breakthrough and independent replication, never a result.

