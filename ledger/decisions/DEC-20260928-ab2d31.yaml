  context: >-
    KN-FIND-007 fixes the mean decomposition yield of any base of a given
    size, and README sections 1-5 show the three existing bases within 7% of
    each other and the mitm exponents on the generic model. The one
    non-generic relation source left open for structure is an excess of x-key
    coincidences carrying informative rank (IDEA-20260928-4e2be7;
    IDEA-20260928-ce3ab0 names the required excess kappa). The engine computes
    three classes of coincidences and discards them (TT, TB, SS). This contract
    harvests them, certifies every row, measures their excess per class over
    matched random bases for coset, Dickson and small_x bases, and proves the
    instrument's range with a known-log base (formal, zero information) and a
    j = 0 curve (formal automorphism coincidences). The generator pre-committed
    the null. A pre-protocol scratch count by the top-level session (TT excess
    at m = 3, 20/24/28 bits) is disclosed in H-PFDR-4765e4 and handled as a
    replication, not a discovery.

