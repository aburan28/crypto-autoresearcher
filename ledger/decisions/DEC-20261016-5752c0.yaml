# DEC-20261016-5752c0 -- evidence review of EXP-ENDO-25ad84 (RUN-ENDO-d7cb69).
# Decision: weaken H-ENDO-5a33ae. Arm M met its frozen success criterion at
# the modelled tier; arm A's zero-hit statement is refuted as worded by two
# certified rows. No ECDLP claim changes.
coordinator_decision:
  id: DEC-20261016-5752c0
  recorded_at: '2026-10-16'
  decided_at: '2026-10-16'
  decided_by: coordinator
  question_ids: [RQ-ENDO-476761]
  goal_id: GOAL-ENDO-001
  archived_by: TASK-20261016-5c0f78
  mode: evidence_review
  decision: weaken
  decision_label: >-
    Weaken H-ENDO-5a33ae (approved -> analyzed -> weakened). Arm M: supported
    as worded at the modelled tier, scoped. Arm A: refuted as worded
    (counterexample certificate, pending the archive gate's independent
    recomputation).
  target_ids:
    - H-ENDO-5a33ae
    - EXP-ENDO-25ad84
    - EV-ENDO-fb5823
    - RUN-ENDO-d7cb69
    - RQ-ENDO-476761
    - IDEA-20261016-15a6fc
  context: >-
    RUN-ENDO-d7cb69 is the single frozen pass of the isogenous-model screen
    over 132 prime-field population curves and four controls. It was
    snapshot-archived by TASK-20261016-cbf19d (2a8674d65) and passed
    independent validation TASK-20261016-1b5210, which raised one material
    scope finding: the contract's baseline omits E's own verified chain
    2-GLV. The two follow-ups it motivated, EXP-ENDO-7494e7 and
    EXP-ENDO-33a1ee, are reviewed in DEC-20261016-4f3a1a and
    DEC-20261016-f379af.
  validity: >-
    Valid and complete: 1 of 1 runs, 136 rows, 0 errors, frozen arguments and
    seed as specified, raw and rows agree, all five controls pass, every
    positive route verified 8/8 and re-verified by independent code
    (EV-ENDO-fb5823 validity_check).
  arm_outcomes:
    M: >-
      Success criterion met. Seven population curves (five families) have a
      verified best route with one-shot gain > 0 against E's best model plus
      unit GLV: +6.70 % to +14.52 %, inside the predicted (0, 15 %]. Against
      E's verified chain 2-GLV, six of the seven lose by 25.24 % to 34.05 %
      one-shot. other/BADA55-VPR-224 (+11.44 % one-shot) is the only positive
      no known method on E beats within the scanned bound.
    A: >-
      Zero-hit prediction falsified as worded: bls/Bandersnatch (D_K -8) and
      mnt/mnt1 (D_K -19) are population curves whose root is not a j = 0 /
      1728 crater with |D_K| <= 20. The validator's alternative f_E-based
      reading leaves them unresolved, not supported.
  rationale:
    - >-
      The frozen criteria were applied as written. Arm M's success criterion
      is met; its baseline was fixed by the contract ("E's unit GLV
      included"), so the chain-GLV domination limits the result's
      significance and does not falsify it. No criterion was relaxed or
      tightened.
    - >-
      Arm A is read through H-ENDO-5a33ae's own frozen definition ("whose own
      root is not a j = 0 or j = 1728 crater"), which is exactly the
      instrument's root_crater flag. Under it, two rows falsify the zero-hit
      prediction. The adverse call rests on a counterexample certificate (the
      recorded identity t^2 - 4p = D_K f_pi^2 plus the derivation that
      D_K not in {-3, -4} excludes j in {0, 1728}), the strongest refutation
      artifact this result admits, archived with the analysis in the same
      ledger commit.
    - >-
      A conjunction with one conjunct refuted and the other holding is
      weakened, not rejected. reject_scoped would discard arm M, which holds
      in its stated scope. support would ignore arm A.
    - >-
      Arm M's substantive question is already carried forward: H-ENDO-f58749
      tests composition with the GLV and H-ENDO-c9f324 times the one GLV-free
      positive. Weakening this hypothesis closes no lane.
  evidence_refs:
    - ledger/evidence/EV-ENDO-fb5823.yaml
    - experiments/EXP-ENDO-25ad84/analysis.md
    - experiments/EXP-ENDO-25ad84/validation/TASK-20261016-1b5210.md
    - experiments/EXP-ENDO-25ad84/runs/RUN-ENDO-d7cb69/manifest.yaml
    - experiments/EXP-ENDO-25ad84/runs/RUN-ENDO-d7cb69/raw-result.json
    - experiments/EXP-ENDO-25ad84/runs/RUN-ENDO-d7cb69/rows.jsonl
    - experiments/EXP-ENDO-25ad84/archive/TASK-20261016-cbf19d.receipt.yaml
    - experiments/EXP-ENDO-25ad84/reports/run-20261016T1709Z/report.typ
    - experiments/EXP-ENDO-7494e7/runs/RUN-ENDO-795989/raw-result.json
    - research/endosweep_curves_20261006/curves.json
  scoped_claim: >-
    On the 132 tested prime-field curves (<= 521 bits; ell <= 13, depth 2,
    <= 64 nodes; curvesweep M_eq = M + S model, S = 1 M, 200 scalars, seed
    20261016), a model change on a rational 5- or 25-isogenous neighbour
    lowers modelled one-shot variable-base k*P cost against E's best model and
    unit GLV on seven curves from five families (+6.70 % to +14.52 %), all
    routes verified on points; on six of them E's own chain 2-GLV is cheaper
    still. The arm-A statement that no non-j = 0 / 1728 population curve has
    |D_K| <= 20 is false on this population (Bandersnatch -8, mnt1 -19). No
    timing, no ECDLP, rho or exponent statement.
  limitations:
    - Modelled counts in one cost model; no wall-clock statement (EXP-ENDO-33a1ee is the measured follow-up for BADA55-VPR-224 only).
    - One deterministic seed; seven positives are five families.
    - Scope ell <= 13, depth 2, 64 nodes, |D_K| <= 2^20, prime fields <= 521 bits.
    - f_E unresolved outside j = 0 / 1728; the arm-A refutation depends on the hypothesis's definition of crater.
    - The arm-A identity awaits independent recomputation (archive gate).
    - Heuristics H1-H3 of IDEA-20261016-15a6fc are not validated.
  procedure_deviations:
    - >-
      No review_plan was written before TASK-20261016-1b5210 ran (the
      validator found none on disk). The Coordinator's prior for this
      contract is only the idea's preregistered prediction. The validator
      owned all five joints itself, so check_review_independence.py has no
      multi-reviewer composition to check here. The session should still run
      it on the validation directory and record the output in the archive
      receipt.
  next_actions:
    - >-
      Ranked follow-ups for this lane, recommended and not approved here
      (common ranking with DEC-20261016-4f3a1a and DEC-20261016-f379af): (1)
      fix isoglv's one-shot input-format pricing and re-run the combined
      screen under a new contract; (2) a timed bench of the combined route
      on other/Tom-384 against GLV on E; (3) the ecbench independent-runner
      replication of EXP-ENDO-33a1ee.
    - >-
      Lower ranked, arm-A residue: price E's own small-norm CM endomorphism
      GLV on bls/Bandersnatch (D_K -8) and mnt/mnt1 (D_K -19), and certify
      f_E for both, as an idea for /propose-ideas. It is a constant-factor
      known-scalar question and ranks behind exponent-targeting work.
    - >-
      The session runs the archive gate of TASK-20261016-5c0f78, including
      the independent recomputation of the arm-A identity. If that gate
      fails, it stops before the ledger commit.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      The decision is weaken on preliminary evidence, so promotion is not
      required. Arm M's practical content is superseded by EV-ENDO-7628a0
      (composition with the GLV). The arm-A counterexamples are design
      properties of two CM-constructed curves, not a new durable finding. A
      KN-TECH for the route-verification instrument is deferred until the
      isoglv one-shot pricing defect (CORR-20261016-ac9fc8) is fixed and
      re-run.
  ecdlp_claim_effect: none
