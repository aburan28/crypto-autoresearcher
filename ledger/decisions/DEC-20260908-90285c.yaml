      s=(t([p]R~)//p) mod p. T1 exact affine
      is an observation, not a hard gate.
      The 0.9 power threshold remains a
      later-stage object at D=20. Budget,
      artifacts, and replication are in this
      filing.
    - >-
      execution_authorized_stages stay [0, 1, 2, 3, 4].
      Authorizing Stage 5 in the same act as
      first filing the text would skip the
      completeness check.

