      frozen protocol is not ranked.
    - >-
      v1_stage5_protocol freezes T2
      y^2=x^3+16x+127 over F_1048573, N=1048573,
      P=(0,907328), V=x([k]P) for k=1..20, and
      T1 y^2=x^3+2 over the same p, N=1049791,
