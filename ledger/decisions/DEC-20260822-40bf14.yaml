    - >-
      THE TRANSFER ASSUMPTION MOST LIKELY TO BE MISUSED, STATED SO IT CANNOT BE
      MADE SILENTLY - the E/D taint calculus and the j - i >= 4 threshold ARE
      full-word algebraic facts about MD4's Round-1 word schedule and do transfer
