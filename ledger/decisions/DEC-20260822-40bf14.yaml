      calculus proves joint FULL-WORD dependence while the instrument needs
      WINDOWED distinguishability, and at m = 12 that is seed-contingent - the
      forward window image reaches 1 at some seeds, which is full ANOM-1
      recurrence on the corrected construction. A taint calculus cannot detect
      that gap and must never be cited as if it could.
