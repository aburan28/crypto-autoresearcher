  context: >-
    BATCH-7215fa's closing ledger archive - the rank-7, run-alone task at which
    the batch's observations become official state. Both blinded reviews are in
    and BOTH RETURNED `breaks` on the joints they own - the red team on R2
    (with R1, R4 and R5 holding with named gaps and R3 not applicable), the
    validator on V4 and V5 (with V1, V2 and V3 holding). Neither reviewer voted
    on the claim and neither could see the other; this decision composes them.
    THE ONE-LINE RESULT - the mandatory two-directional dependence gate GATE-PO2
    PASSED on all nine clauses, so the correction batch 5 was built to make IS
    present and ANOM-1 is not relocated; one phase later CTL-PO5 part (b) FAILED
    at 8 raw pre-certificate candidates against a declared ceiling of 4, and the
    contract's own stopping rule halted everything downstream. No declared-scale
    run, no HEUR-H1 validation run, no MD5 search arm, 900 s of run ceiling
    unspent and reported as unspent. That is an admissible and informative batch
    outcome, it is recorded as a real result rather than as a failure, and IT IS
    NOT A CLOSURE OF ANYTHING.

  rationale:

    - >-
      F-1 - RUN VALIDITY WAS VERIFIED BEFORE ANY INTERPRETATION, AND TWO OF THE
      FIVE CHECKS DID NOT PASS. Expected run count SATISFIED - exactly two run
      directories, both declared, three declared runs not executed each carrying
      the contract clause that stopped it, no deleted and no superseded run.
      Seed integrity SATISFIED and it is the strongest positive result in either
      report - the validator regenerated the 14 fixed words, both free-word
      high-order bit patterns and every declared target from the frozen seeds
      and procedures using its own named-register implementation and obtained
      byte-identity on every value; IR-3 holds. Control comparability SATISFIED
      for every MD5 computation that ran, verified from the runs' own
      code_path_fingerprint parameter tuples rather than from narrative - phase
      C differs from phase B in exactly one field, `primitive`, and nothing MD5
      is wider than the MD4 arm anywhere. Schema-complete manifests NOT
      SATISFIED - `code_path_fingerprint` is absent from both manifests
      (contract required_artifacts, IR-8) and three AGENTS.md artifact-policy
      fields are absent from both. Raw/summary agreement PARTIALLY SATISFIED -
      every headline integer recomputes from raw-result.json, but SC-G asserts
      the manifests carry `code_path_fingerprint` and they do not, and
      budget.enforcement asserts a `timeout --signal=KILL` wrapper no artifact
      records.
      RULING ON ADMISSIBILITY - THE RUN SET IS ADMITTED AS EVIDENCE, WITH THREE
      NAMED EXCLUSIONS, AND IS NOT RETURNED TO THE EXECUTOR. The reason is
      stated rather than assumed. The defects are RECORD and SCOPE defects, not
      measurement defects - the validator establishes that every measurement in
      both runs is bit-for-bit reproducible from a cold re-run of the snapshot
      module AND from a from-scratch reimplementation sharing no code with the
      producer, and the red team independently reproduces the same integers from
      a third implementation. The runs are immutable and may not be repaired; a
      re-run would mint new run ids for numerically identical results, which is
      not a reason to run anything; and returning the set would produce no
      information that two independent from-scratch replications have not
      already produced. The three exclusions are enumerated in EV-MDFIVE-24e077
      `validity_reason` and are binding on every later reader. The corrective
      action lands on the SUCCESSOR CONTRACT, not on these runs - emit the
      fingerprint into the manifest (it is constructible inside the executor's
      own module, unlike the caveat_refs placement), qualify the primitive on
      EVERY listed control rather than only on CTL-PO6, and pass the per-run
      ceiling as an explicit deadline so the manifest shows an armed one.

    - >-
      F-2 - THE DEV-3 / IR-4 DISPOSITION. DEFERRED TWICE TO THIS TASK, BY THE
      EXECUTOR AND BY THE SNAPSHOT COORDINATOR, PRECISELY SO VALIDATOR JOINT V4
      COULD OWN IT FIRST. IT HAS. THE RULING, IN FOUR PARTS.
      (i) THE BREACH IS REAL AND IS NOT SOFTENED. Run 1's CTL-PO9
      component-identity assertion executed in MD5 mode in two configurations -
      128 MD5 Round-1 evaluations plus 128 MD5 straight-line reference passes,
      over probe word-lists drawn from random.Random(20260821), a procedure the
      contract does not declare. md5_run_authorization enumerates F1, F2 and F3
      and closes "NOTHING ELSE ... Any MD5 computation outside F1, F2, F3 and
      run 5 is invalid under IR-4". The validator checked the computation
      against each of F1, F2, F3 and run 5 in turn and it is none of them, and
      it regenerated the probe word-lists and recomputed all four configurations
      to confirm that MD5 arithmetic genuinely ran rather than being merely
      labelled. IR-4 applies on its face. THE BREACH IS PRESENCE WITHOUT
      AUTHORIZATION, NOT EXCESS SCALE - the computation is parameter-symmetric
      with its MD4 counterpart in every field, so SC-1's "never larger" clause
      is not engaged and this is not a scope-widening of the kind P-V4
      anticipated.
      (ii) IR-4 INVALIDATES THE TWO MD5 SUB-RESULTS, NOT RUN 1 AS A WHOLE. The
      rule's object is a COMPUTATION - "any MD5 computation outside F1, F2, F3
      and run 5 is invalid" - not a run, and the artifacts make the severance
      exact rather than convenient - the unauthorized results are two distinct
      keys in run 1's raw output, nothing in either run consumes them, no
      target, no seeded draw from any of the nine frozen seeds and no search
      depends on them, and the MD4-mode CTL-PO9 result the contract actually
      needs is independently present and passed. Run 1's other content is
      authorized and stands - CTL-PO6 in both primitives is F1, the T[1..16]
      self-check is F2, and the input pins are neither.
      (iii) THE ONE AGGREGATE THAT CANNOT BE SEVERED IS RULED INADMISSIBLE AS
      FILED. `CTL_PO9_all_ok` is computed as all() over all four configurations,
      so the manifest headline rests partly on an IR-4-invalid computation. It
      may not be cited. Any record needing PO-9 reads the MD4-only values from
      raw-result.json, where they are present and true. NOTHING IS REPAIRED -
      the runs are immutable and the manifest keeps its contaminated headline
      with this ruling attached to it.
      (iv) THE PRE-COMMITTED BATCH-HALTING CONSEQUENCE IS HONOURED, NOT
      REINTERPRETED. review-plan-2de43d pre-committed that an MD5 run present
      with no naming clause is BATCH-HALTING and that a reviewer finding one
      reports it and stops. The validator did exactly that and declined to rule
      on the remedy. The halt binds as follows - BATCH-7215fa CLOSES AT THIS
      STOP; runs 3, 4 and 5 of EXP-MDFIVE-a8e71e MAY NEVER BE COMMISSIONED under
      that contract, and any successor work is a NEW contract in a new batch.
      There is no declared-scale result to void, because none exists. The
      contract's own root cause is recorded for the successor - DEFECT-1601d6-02
      was closed for the fixture it named and the identical ambiguity recurred
      one control over, because CTL-PO9's text names no primitive and run 1's
      contents line qualifies only CTL-PO6.

    - >-
      F-3 - HOW THE TWO BLINDED REPORTS WERE COMPOSED, AND WHERE THEY WERE NOT
      AVERAGED. Each reviewer owns joints, not a vote, and each was weighed on
      the instrument the plan gave it. The RED TEAM was weighed heaviest on R1's
      substance, on the proves_too_much objects and on anything requiring an
      answer derived rather than replicated, because its instrument was a blind
      re-derivation from RFC 1320 with its own code - and it was DISCOUNTED
      exactly once and by a named amount, on the R1 re-derivation's
      independence-of-answer, per PD-1 (F-13). The VALIDATOR was weighed
      heaviest on everything mechanical - run integrity, ordering, seeds,
      manifests, the archive binding, the suite, the quarantine, the cold re-run
      - because its instrument was replication from the producer's own artifacts
      with independent code, and it produced grounding command output for every
      claim it made.
      THE ROUND'S MOST INFORMATIVE FACT IS THAT THEY AGREE WHERE THEY WERE MADE
      TO OVERLAP. Both reached the same threshold defect down independent paths
      that could not see each other - the red team from the fiber-multiplicity
      product (the raw set is exactly 4 x 2, so its size is the PRODUCT of two
      multiplicities the gate already measured), the validator from the forward
      image's non-injectivity (the window image saturates at SIX values, all
      congruent to 98 mod 512, so the 12-bit window carries about 2.58 bits on
      the forward side). Two instruments, two implementations, opposite
      directions, one defect. THAT IS STRONGER EVIDENCE THAN EITHER ALONE and it
      is why EV-MDFIVE-24e077 carries `proof_status - derivation` rather than
      `empirical_only`.
      THE ONE PLACE THEY DIFFER IS REPORTED AS A LOCALISATION, NOT A SPLIT
      DIFFERENCE. They do not disagree about the gate - both reproduce the same
      nine clauses and the same PASS. They offer TWO DIFFERENT MECHANISMS for
      the forward collapse, and the disagreement localises to two named
      implementations of one explanation - the red team's F-multiplexer
      annihilation, established against a null object and a surviving
      falsification test, and the validator's shift-table bit-placement reading,
      offered explicitly as an interpretation of measured image structure. See
      F-10. Nothing is averaged between them and neither is discarded.

    - >-
      F-4 - THE COORDINATOR'S PRIOR P-R1 IS **CONFIRMED**, AND STRENGTHENED
      BEYOND ITS OWN TERMS. RULED EXPLICITLY, AS A RESULT OF ITS OWN, BECAUSE A
      CONFIRMED PRIOR ABSORBED INTO "THE DESIGN WAS FINE" IS A RESULT
      DESTROYED. P-R1 predicted that at S = 9 the two free words influence
      DISJOINT components of the boundary state, so the naive "read tuple
      position 0 instead of the degenerate position 1" repair would RELOCATE
      ANOM-1 onto word8 rather than cure it. The red team executed exactly that
      prediction as object M' and measured d_f32 = 1, d_f12 = 1 against d_b32 =
      16 - the gate FAILS it in the forward direction, which is the mirror image
      of ANOM-1. THE PRIOR IS CORRECT AND ITS PREDICTED REMEDY WAS THE ONE THE
      PROPOSAL TOOK.
      IT IS ALSO STRENGTHENED IN THREE WAYS THE PRIOR DID NOT CLAIM, AND EACH IS
      A GAIN THIS BATCH BOUGHT. (a) PROVENANCE - the prior was a Coordinator
      READING of harness/run_md4_ceiling.py's return tuples, a fact about ONE
      IMPLEMENTATION, and KN-TECH-bb7e9f recorded it as explicitly "Open, not
      settled". The red team derived it from RFC 1320's step table alone without
      opening that module, so DISJOINTNESS IS A PROPERTY OF MD4'S ROUND-1 WORD
      SCHEDULE and holds for every correct implementation. The prior is now
      settled, at a stronger level of generality than it was stated. (b) SCOPE -
      the prior is a statement about the single case j - i = 1; the true
      statement is a THRESHOLD, E_d meets D_r for every legal split point iff
      j - i >= 4, because d + r = j - i - 1 is split-independent. The prior held
      one point of a curve it did not have. (c) REMEDY RANKING - the prior
      offered two remedies as equals, match on both components or increase the
      separation. They are not equals - at j - i = 1 the union E_0 u D_0 = {0,1}
      is a PARTITION, not an overlap, so no component and no pair of components
      is jointly dependent and matching on both CANNOT WORK. INCREASING THE
      SEPARATION IS THE ONLY REMEDY IN THE FAMILY. The proposal chose the only
      correct option and no record knew that until now.
      AND THE PRIOR IS TOO GENEROUS TO THE CHOSEN DESIGN IN ONE PLACE, RECORDED
      AGAINST ITSELF - it implies the component index matters. At separation 10,
      d = 5 and r = 4 put all four components in E_d n D_r, so p = 3 is NOT
      load-bearing and any component would pass GATE-PO2 identically. THE DESIGN
      IS PRESENTED AS A TWO-PART CORRECTION AND ONLY THE SEPARATION DOES WORK.
      P-R2 is OVERTURNED IN DIRECTION (its watched failure, carried-forward
      audit text, did not occur - every audit is substantively re-written at
      similarity 0.03 to 0.06 with five new structured fields - yet R2 breaks
      anyway on a defect the prior did not contemplate - the prior watched the
      DOCUMENTATION and the defect is in the LOGIC). P-R3 is NOT DISCRIMINATED
      and stays live and undischarged for the next batch that reaches an H1 run.
      P-R4 and P-R5 are CONFIRMED with the mechanism differing - P-R4 watched
      for OMISSIONS and found none, while the defect found is a COMMISSION
      (F-7); P-R5's verdict matched but its causal story is untested, because
      the creep pressure was never applied - the instrument never produced a
      declared-scale result. R5's exposure is NOT CLEARED, only deferred.

    - >-
      F-5 - THE BATCH RESULT, AND WHY THE TRANSITION IS `weaken` AND NOT
      `reject_scoped`. H-MDFIVE-0ca596's LOAD-BEARING MECHANISM CLAIM IS
      CONFIRMED - at separation 10 the declared matching observable genuinely
      depends on both free words, ANOM-1 is not relocated, and this is
      established by a blind derivation from the RFC and a replication from the
      artifacts independently. WHAT FAILS IS NARROWER AND IS NAMED - the
      unnumbered near-injectivity/uniformity premise underlying audit 2's
      expected count and CTL-PO5(b)'s ceiling, and the proof obligation PO-5
      that rested on it. THE DECISION IS THEREFORE `weaken`.
      `reject_scoped` IS REFUSED FOR TWO INDEPENDENT REASONS, EITHER SUFFICIENT.
      First, the refutation artifact secured is a `derivation` over a bounded
      exhaustive enumeration at ONE fixed-word seed, and the frozen contract
      declines to quantify over seeds - the reviewer-measured range of the same
      quantity over 120 seeds is 2 to 928. Rejecting on that is rejecting on a
      seed. Second, and decisively - 9 OF 120 SEEDS PASS CTL-PO5(b) AND 6 OF 120
      GIVE A FULLY INJECTIVE FORWARD MAP, so A PASSING CONSTRUCTION DEMONSTRABLY
      EXISTS INSIDE THE CURRENT PARAMETER FAMILY.
      THIS IS NOT WRITTEN AS A CLOSURE, AND THE PROHIBITION IS RECORDED AS A
      BINDING CONSTRAINT ON EVERY RECORD THAT CITES THIS ONE. No record may
      state that the Round-1 splice-and-cut lane is obstructed, dead, or closed;
      a negative result claiming that would need a named obstruction, an
      argument AND forward guidance, and the evidence supports the first two and
      contradicts the third. Under docs/inventor-protocol.md section 4 that
      would be premature closure, which this program treats as a failure mode
      symmetric with overclaiming, and it would be a fatigue report about one
      seed wearing the number 8. EQUALLY, NOTHING HERE OVERSTATES THE GATE - the
      PASS is compromised by F-7 and is licensed to mean only what the contract
      says it means, "the declared observable varies with each free word
      separately at k1 = k2 = 4, on this fixed-word seed, at these four
      held-fixed values", with clause 6 of nine carrying no weight at all (F-8).

    - >-
      F-6 - WHAT CTL-PO5 PART (b) IS A FINDING ABOUT. IT IS A FINDING ABOUT ALL
      THREE - R1-SEP10, GATE-PO2 AND THE DECLARED CEILING OF 4 - AND THE
      APPORTIONMENT IS THE RULING, BECAUSE IT IS WHAT TELLS THE SUCCESSOR WHICH
      KNOB TO TURN.
      PRIMARILY ABOUT THE GATE'S CRITERION (see F-7). That is the actionable and
      generalizable defect, it is the one that determines what the successor
      must change, and it is the only one of the three that costs nothing to
      fix.
      SECONDLY ABOUT THE CEILING'S CALIBRATION, AND THIS IS REFUTED
      INDEPENDENTLY OF R1-SEP10'S MERITS. Four is a defensible bound for the
      quantity the model describes; the model is refuted. It assumes
      near-injective per-side maps and measured injectivity is 33/64 forward and
      24/64 backward. THE CEILING IS NOT THE WRONG QUANTITY - the raw candidate
      count is exactly the right thing to bound - BUT ITS CALIBRATION IS
      FABRICATED BY A MODEL THE OBJECT VIOLATES. The decisive evidence is the
      nearby object - MD5, whose forward map is fully injective at 32 bits at
      all 120 reviewer-sampled seeds, STILL EXCEEDS THE CEILING AT 59 OF 120.
      Remove the MD4 forward collapse entirely and the ceiling is still wrong
      roughly half the time. That is a model defect, not an MD4 defect, and it
      would have been invisible without the nearby-object arm.
      THIRDLY, AND ONLY IN A SEED-SCOPED FORM, ABOUT R1-SEP10. At seed 20260821
      it fails, and 111 of 120 reviewer-sampled seeds exceed the ceiling with
      seed 20260821 among the MILDEST (median 32, max 928). The construction
      does not cure ANOM-1 at 12-bit resolution; it AVOIDS it at this seed, and
      at some seeds distinct_fwd_12bit reaches 1, which is full ANOM-1
      recurrence. But the same sweep shows 9 of 120 seeds passing, so this is a
      statement about the (construction, seed) PAIR and not a disqualification
      of the construction.
      WHAT IT IS NOT - IT IS NOT AN IMPLEMENTATION ERROR, and the executor's
      `negative_observation` classification is RATIFIED. Two independent
      from-scratch implementations reproduce the reported figures exactly - 8 raw
      candidates, all sharing one 20-bit value, 1 of 8 certificate-verified,
      33/64 and 6/64 at k = 6, 9/16 and 4/16 at k = 4. Two implementations
      agreeing to the integer localises nothing to either. THE STOP WAS CORRECT
      AND THE CLASSIFICATION WAS CORRECT.
      THE APPORTIONMENT ALSO SETTLES WHICH REMEDY IS CHEAP - change the SEED
      (cheap), change the CRITERION (cheap), or change the CONSTRUCTION
      (expensive) - and RC-1 is the single measurement that discriminates them.
      It is the first thing the successor does.

    - >-
      F-7 - THE GATE'S OWN DEFECT, AND WHAT IT DOES TO THE NINE-CLAUSE PASS
      PREDICATE. GATE-PO2 MEASURED THE CAUSE OF THE FAILURE AND RECORDED A PASS.
      Its pre-registered predicted values, frozen before any run, are
      distinct_fwd = 16 and distinct_bwd = 16 "with 15 acceptable"; the observed
      values were 9 and 4 at the gate scale and 33/64 and 6/64 at the control
      scale. Its criterion is `>= 2`. A pre-registered prediction missed by a
      factor of ten scored PASS. `>= 2` tests NON-CONSTANCY; the downstream
      arithmetic needs NEAR-INJECTIVITY; non-constancy does not imply
      near-injectivity, so THE GATE CANNOT DISCHARGE THE ASSUMPTION THE
      proof_search_map NAMES IT AS DISCHARGING. That is the ground of the red
      team's R2 break, and the ground is NOT the one the plan anticipated - the
      map does not leave the assumption implicit; it states it explicitly and
      names its discharge, and the named discharge is provably insufficient. The
      map is credited for the explicitness and broken on the logic.
      RULING ON THE PASS PREDICATE - THE PASS STANDS AS A MEASUREMENT AND IS
      DOWNGRADED IN WHAT IT LICENSES. All nine clauses are true as evaluated and
      three implementations agree on every integer, so nothing here is an
      erratum. But clause 6 (CTL-PO3 byte-identity) carries NO EVIDENTIAL WEIGHT
      (F-8), so the pass is an EIGHT-clause pass in substance; and the joint
      fiber clause carries far less of the non-degeneracy load than the contract
      assigns it - the contract calls `distinct_fiber_sets >= 2` "the
      operational signature of ANOM-1" and says per-side counts alone do not
      catch it, whereas the red team measured that BOTH mirror-image degenerate
      objects score fibers = 2 and it is the PER-SIDE counts that reject them.
      The criterion's stated role is inverted relative to its measured power. The
      criterion is retained and its description is corrected.
      THE CHEAPEST FALSIFICATION CONTROL COSTS ZERO COMPUTE AND IS RECORDED AS
      SUCH - comparing the gate's own reported integer to the gate's own
      pre-registered predicted integer, a single comparison over numbers already
      on the page, WOULD HAVE HALTED THIS BATCH AT PHASE B, before CTL-PO4,
      CTL-PO5, CTL-OBS and CTL-H1B ran at all. Everything from CTL-PO4 onward
      was spent rediscovering a number the batch already had. THE FIX IS
      GENERAL AND IS BINDING ON EVERY FUTURE GATE IN THIS GOAL - any gate must
      require an explicit recorded ADJUDICATION whenever an observed integer
      departs from its own pre-registered predicted integer beyond a declared
      tolerance, even when the pass criterion is met. It costs nothing and it is
      the difference between a prediction that is decoration and a prediction
      that is an instrument.

    - >-
      F-8 - TWO CONTRACT-CONFORMANCE FAILURES IN A CONTRACT THIS ROLE APPROVED,
      RULED ON RATHER THAN CARRIED AS CAVEATS.
      (i) CTL-PO3 IS VACUOUS AGAINST ITS OWN DECLARED FAILURE MODE.
      gate_direction_A loops over the four pre-registered held-fixed indices and
      NEVER APPLIES the loop variable to the word list, so its four repetitions
      are four evaluations of one expression and its byte-identity assertion can
      detect only nondeterminism - not "chunk1_observable reads free word B
      somewhere it must not", which is the failure the contract assigns it. The
      validator demonstrated this on a deliberately leaky observable rather than
      asserting it. RULING - the clause is SATISFIED IN FACT and UNESTABLISHED BY
      THE ARTIFACT; the validator ran the contract-shape loop against the real
      observable and got byte-identical rows, so the property is true and the
      gate verdict is not overturned. Clause 6 carries no weight (F-7). The
      remedy is one line in the successor's instrument and is recorded.
      (ii) THE MANIFESTS ARE NON-CONFORMANT. `code_path_fingerprint` is absent
      from both, and IR-8 makes its absence an invalidation rule and states that
      prose disclosure elsewhere does not discharge it. RULING - this is a
      RECORD defect and it does not invalidate the measurements, for two stated
      reasons - run 2's four per-phase fingerprints ARE present in
      raw-result.json and do answer PO-8's substantive question, and run 1
      invokes neither observable so the question is vacuous for it; and every
      measurement was independently reproduced from scratch. IR-8 is
      nonetheless UNMET IN LETTER for both manifests, SC-G asserts the opposite
      and is CORRECTED ON THIS RECORD, and the successor contract must emit the
      field into the manifest. The three missing AGENTS.md fields
      (inference.backend, probe_verified, degraded_requirements) originate in
      harness/runner.py, outside every participating task's write_scope; they
      are filed forward with the known-wrong requested_policy at the same site
      and are NOT scored against this batch's executor. Both defects are the
      approving Coordinator's to own as much as the executor's - a frozen
      contract that specifies a vacuous control and a required field the harness
      cannot emit is a defect at approval time.

    - >-
      F-9 - CORR-A AND CORR-B, THE GATE DECISION'S OWN TWO CORRECTIONS, WHICH
      DEC-20260821-333267 ASSIGNED TO REVIEW JOINT R2 AS FALSIFIABLE CLAIMS.
      CORR-A (the "F-layer" numbers are step distances, and the load-bearing
      branch-coverage property - word2 enters all three of v5, v4, v3 - is
      nonetheless true) IS TRUE AND IS ALSO NOT SUFFICIENT, and the red team
      produced the counterexample to its sufficiency - THE PROPERTY IS TRUE AND
      THE OBSERVABLE STILL COLLAPSES TO 6/64. Entering all three arguments of F
      does not imply the variation SURVIVES F, because F is a multiplexer that
      is constant in its x argument wherever y and z agree. CORR-A establishes a
      NECESSARY condition and the gate decision invoked it as though it were
      SUFFICIENT. That is corrected here.
      CORR-B (the predicted distinct_fiber_sets is exactly 2, not about 16) IS
      **DERIVED, NOT FITTED**, AND THE RULING IS MADE ON PROVENANCE THAT IS
      CHECKABLE RATHER THAN ON PLAUSIBILITY. The gate decision was written and
      frozen at TASK-20260821-fad775, which precedes TASK-20260821-372d67 in the
      dispatch chain; no observation existed when it was written, and the
      correction is a closed-form derivation stated in full (16 x 16 window
      values into 4096 bins gives 0.0625 expected non-planted matches, the
      planted pair matches exactly by HEUR-H2, so one fiber is non-empty and
      fifteen are empty, giving exactly 2, with 3 on a roughly 6 percent
      spurious match). BOTH predictions were left on the record and attributed,
      and the contract required that whichever was observed the deviation from
      the other be legible - which is the opposite of fitting.
      TWO QUALIFICATIONS THAT MUST TRAVEL WITH THE RULING. First, CORR-B's
      derivation rests on the SAME uniformity premise that CTL-PO5(b) refuted,
      so it is derived from a premise this batch measured false - it happened to
      land on the observed value for a reason that does not generalise. Second,
      the agreement is weak confirmation in any case, because the red team
      measured that DEGENERATE objects also score fibers = 2 - the value 2 does
      not discriminate. A pre-registered prediction that both the correct and
      the degenerate object satisfy is not evidence for the correct one.

    - >-
      F-10 - ANOM-B5-1. THE PHENOMENON IS ADMITTED AS A REPLICATED OBSERVATION;
      THE EXPLANATION IS **HELD PENDING ITS OWN TEST**, AND IT IS NOT PROMOTED.
      The phenomenon - MD4's forward observable collapses far below its
      pre-registered value while MD5's does not - was measured by the executor
      at k = 4 and k = 6, reproduced independently by both reviewers, extended
      by the validator across k1 = 4..8 and across six fixed-word seeds (MD4
      window image 2 to 26 of 256 against MD5 fully injective at 256), and
      extended by the red team across 120 seeds (MD4 forward injective at 6 of
      120, MD5 at 120 of 120). It is structural, not a seed accident, and it is
      admitted as an observation at that strength.
      THE EXPLANATION IS NOT ADMITTED AT THE SAME STRENGTH, AND THE REASON IS A
      COMPOSITION RESULT NEITHER REVIEWER COULD SEE. TWO DIFFERENT MECHANISMS
      ARE NOW ON RECORD FOR ONE MEASUREMENT - the red team's, that MD4's F is a
      bitwise multiplexer constant in x wherever y and z agree, annihilating the
      free word's varying bits at steps 3 and 5 (masks y^z = 0x5c0be734 and
      0x7b7a00ae, visible bits 0 at both), while MD5 adds the varying register
      OUTSIDE F so no bit of it can be annihilated; and the validator's, that
      MD4's Round-1 SHIFT TABLE keeps the free word's bits out of v6's low nine,
      offered explicitly as an interpretation of the measured image structure
      rather than as a measurement. They may be two views of one mechanism or
      two mechanisms. NOTHING IN THIS BATCH DISCRIMINATES THEM, and composing
      them into one would be this Coordinator's synthesis presented as the
      reviewers' evidence.
      THE RED TEAM'S EXPLANATION IS CREDITED FOR CARRYING WHAT AN EXPLANATION
      MUST CARRY - a null-object control (F replaced by a same-shape
      non-multiplexer mixer restores 64/64 against MD4's 33/64 and 6/64, so the
      collapse is caused by F's structure and not by the window width, the
      rotation schedule, the implementation or the seed) and a falsification
      test it survived (MD5 must never collapse at 32-bit resolution; measured
      min 64 max 64 over 120 seeds). That is why it is HELD PENDING rather than
      set aside. RC-4, the static per-F-application (y XOR z) mask check, is the
      discriminator, it costs sub-milliseconds and no search, and it is carried
      into the successor as a phase-1 item alongside RC-1.

    - >-
      F-11 - THE dominated_by ROW-1 RULING PROVES TOO MUCH AGAINST ITS OWN
      OBJECT. THE REASON ON THE RECORD IS WRONG AND IS CORRECTED HERE BY
      SUPERSESSION, NOT BY EDITING. H-MDFIVE-0ca596 and DEC-20260821-333267 both
      rule the strictly dominating decoupled rival non-disqualifying because
      "its match condition factorizes, so it exhibits no joint two-word MITM".
      The red team verified structurally that R1-SEP10'S MATCH CONDITION
      FACTORIZES IDENTICALLY - chunk1_observable is a function of wA alone,
      chunk2_observable of wB and Y alone, and the raw candidate set is exactly
      {(a,b) - low20(F(a)) == low20(B(b))}. FACTORIZATION IS WHAT MAKES A
      MEET-IN-THE-MIDDLE POSSIBLE. Applied unchanged, the stated discriminator
      disqualifies R1-SEP10.
      THE CONCLUSION SURVIVES AND THE REASON IS REPLACED. The corrected
      discriminator is that NEITHER OF R1-SEP10'S FACTORS IS CONSTANT, whereas
      the rival's backward factor is. AND THE CORRECTION IS ITSELF STRENGTHENED
      BY THIS BATCH'S OWN RESULT, WHICH IS THE POINT OF MAKING IT HERE - a
      binary constant/non-constant discriminator is exactly the `>= 2` error one
      level up. R1-SEP10's forward factor is not constant but takes 6 of 64
      values; the honest discriminator is QUANTITATIVE - the per-side maps must
      be near-injective at the window resolution, not merely non-constant. The
      successor states it that way or repeats the mistake in a new place.
      MECHANICS - H-MDFIVE-0ca596, DEC-20260821-333267 and IDEA-20260821-ea35d1
      are IMMUTABLE and are NOT edited. This finding is the superseding record
      and any citation of the dominated_by ruling must carry it. The concession
      itself is credited - `dominated_by` is correctly non-null, the dominance
      was conceded against every Pareto axis and not only the headline, and
      recording it rather than burying it is what made the error findable.

    - >-
      F-12 - HEUR-H1 WAS NOT TESTED AT ALL, AND HEUR-H1b IS FALSIFIED AT THESE
      PARAMETERS BY ITS OWN FROZEN TEXT.
      HEUR-H1 - run 4 never executed. There is no chi-square, no p-value, no
