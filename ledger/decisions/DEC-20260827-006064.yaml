    - >-
      J1 establishes all eight exact normalized intervals, bijective base-m
      unranking, complete BSGS coverage, occurrence-labelled collision replay,
      exact decoder, and final group verification. Its controls show that the
      serialized table must be a multimap retaining all coefficients and
      occurrence lineage rather than a one-value dictionary.
    - >-
      J2 independently retrieves MPZ ePrint 2020/996, CGK ePrint 2017/1113,
      and Rotem-Segev ITC 2022. Under the frozen no-extra-oracle, persistent
      same-encoding, complete-serialization, and full aggregate-charging
      premises, the inherited resource rectangle remains
      ell=B^(9/4+o(1)), k=B^(5/4+o(1)), and MPZ bounds complete success by
      B^(-1/4+o(1))=N^(-1/20+o(1)).
    - >-
      J3 confirms that every forbidden transfer stops and keeps the
      full-group denominator N. It preserves the one-restriction route as
      open: the same-budget full-group construction is real but has only
      B^(-1/4+o(1)) residual success, independent composition yields
      B^(-1/2+o(1)), constant full-group success needs B^(11/8+o(1)) online
      time, and direct interval BSGS costs B^(7/4+o(1)).
    - >-
      The blind statement-only rederivation independently reproduces the
      normalized interval, all eight endpoints, unranking, B^(7/4) table,
      B^(5/4) scan, decoder, conditional MPZ exponent, and one-restriction
      non-conclusion. Its reusable same-oracle multimap and N=2 caveats are
      incorporated into the accepted statement.
