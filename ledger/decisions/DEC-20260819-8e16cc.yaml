coordinator_decision:
  id: DEC-20260819-8e16cc
  goal_id: GOAL-MD5-001
  batch_id: BATCH-46254b
  recorded_at: '2026-08-19'
  recorded_by_task: TASK-20260819-f98fc0

  target_ids:
   - DEC-20260819-8e16cc
   - DEC-20260810-9942ea
   - TASK-20260810-cbd708
   - TASK-20260810-fc23ce
   - TASK-20260819-bec8eb
   - TASK-20260819-f98fc0
   - GOAL-MD5-001
   - BATCH-46254b

  decision: supersede
  decision_label: opening_snapshot_re_scoped_via_content_first_supersession

  context: >-
    When BATCH-46254b opened, TASK-20260810-cbd708 committed the whole opening
     control plane in a single commit, 230038427, which changed 24 paths: the
    three declared artifacts (coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/
    batch.yaml, dispatch_queue.json, ledger/decisions/DEC-20260810-9942ea.yaml)
    plus 21 paths that no task owned as artifact_paths (the ten ledger/handoffs/
     records, the ten task-cards, and the ledger/goals/GOAL-MD5-001.yaml head edit).
    The opening snapshot task TASK-20260810-fc23ce was scoped to the three declared
    artifacts only. tools/research_dispatch.py:635 fixes an archive task's
     expected_paths as the union of its own artifact_paths and its source task's
    artifact_paths, and :1244-1257 require a commit-mode archive's single changed
     path set to equal that union exactly. Because 21 of the 24 changed paths were
    never declared as any task's artifact_paths, no single commit can change exactly
    the three-file set fc23ce was scoped to, and the content-only fallback at
     :1090-1149 does not engage here: its declared commit (230038427) IS reachable
     from HEAD, so :1204-1229 treat it as a satisfied commit binding whose exact
     scope still fails. A prior session therefore deliberately left fc23ce at state
     queued with verification.status "informational_not_machine_verified_completed"
    (commit 0b3ea912c, "don't force a false completed state"), recording that a
    future session could close the batch "by having a fresh, correctly-scoped
    archive task supersede this one." THIS DECISION IS THAT SUPERSESSION. It
    supersedes the binding of TASK-20260810-fc23ce by the two-task content_first
    scheme: TASK-20260819-bec8eb establishes a stable reattestation record at a
    path in no existing task's artifact_paths, which re-binds the three declared
    control-plane files by citation to 230038427, and TASK-20260819-f98fc0
    archives that reattestation under the opt-in content_first binding mode
    (CLAUDE.md "Archive receipts bind to CONTENT first"), byte-verified at HEAD,
    with the SELF sentinel resolving the receipt's own hash. The 21 orphan paths
    are documented below as not bound by this re-scope; they remain durable at
    230038427 and are cited, not claimed, by the new receipt.

  supersession_basis: >-
    TASK-20260819-bec8eb (completed; its deliverable is the reattestation record
    at coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/reattestation/
    BATCH-46254b-opening-reattestation.yaml) establishes a stable new file at a
    path in no existing task's artifact_paths, which re-binds the three declared
    control-plane files by citation to 230038427 and documents the 21 orphan
    paths. TASK-20260819-f98fc0 is a snapshot archive, binding_mode content_first,
    with source_task_ids [TASK-20260819-bec8eb], whose commit stages exactly its
    own receipt, and whose path_sha256 covers the reattestation file and the
    receipt itself (the receipt carries the SELF sentinel for its own entry; the
    queue holds the actual post-commit hash), each verified at HEAD. content_first
    mode (research_dispatch.py:1218-1242) requires a reachable commit, its declared
    parent, a message naming the record_ids, and a path_sha256 block covering every
    expected path; it does NOT require the bound commit to have changed the full
    24-file set, because that whole set is already durable at the historical commit
    230038427 (recorded as the content commit in the reattestation). The
    content_first binding of this shape was verified empirically before this
    decision was drafted: a coordinator subagent built it on a throwaway branch
    and the dispatcher's GitRepositoryVerifier accepted it. This follows the
    AES-002 content_first precedent (TASK-20260815-0f5486 / TASK-20260815-aa30e8).
    TASK-20260810-fc23ce is marked cancelled in the dispatch queue and withdrawn
    from the operative queue; its prior receipt at the same path is NOT edited
    (immutable), and this decision is the new operative binding for the batch
    opening's archive chain.

  decision_scope: >-
    STRICTLY the archive-chain mechanics of the opening snapshot of BATCH-46254b.
    No scientific content is reviewed; no run is validated; no evidence record is
    produced; no experiment, hypothesis, or goal status changes; CLAIM CEILING
     unchanged (protocol_freeze_implementation_pin_and_literature_acquisition_only).
    BCP-1 is not authored or re-authored by this decision; it already exists at the
    path snapshot TASK-20260810-927ab5 documented, and this decision changes no
     scientific byte of it.

  what_this_decision_does_not_do:
   - >-
    It does not open, close, or pause any goal or batch beyond re-linking the one
    blocked task. GOAL-MD5-001 stays active; BATCH-46254b stays the current batch.
   - It does not change the 24-file commit 230038427, the BCP-1 bytes, the two
     RFC 1321 implementation-pins of TASK-20260810-3e0793, or any evidence.
   - It does not obtain or record a closure quorum, an attestation, or a review
     verdict. The independent validation and red-team passes of this batch remain
     downstream and are not relaxed.
   - It does not touch any goal other than GOAL-MD5-001.

  orphan_paths_documented_not_bound:
   - >-
    The 21 paths 230038427 changed that were never any task's artifact_paths:
     ledger/handoffs/TASK-20260810-{cbd708,fc23ce,26d0d5,927ab5,3e0793,bde128,
    5c819b,23e0ea,b9d956,ccfeb4}.yaml (10), the ten task-cards under
     coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/task-cards/, and
    ledger/goals/GOAL-MD5-001.yaml. These remain durable and verifiable at
     230038427; the new content_first receipt binds the three declared artifacts
    plus its own file, and references the 24-file commit as the historical content
     custody rather than re-staging 21 files no task owns.

  evidence_refs: []

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      An archive-chain mechanics correction (a scope mismatch between a one-commit
      producer and a three-file snapshot task), not a mathematical finding; nothing
      to promote.

  next_actions:
   - >-
    TASK-20260819-f98fc0 performs the content_first binding commit (its receipt
    plus the queue update) and the dispatcher's post-commit verification accepts
    it. At the control-plane refresh that commits this decision, the queue records
    the already-verified state of the batch: BCP-1 was authored (TASK-20260810-
    26d0d5) at f5087686e and repaired at d5fc2117d, both in origin/main; its
    snapshot (TASK-20260810-927ab5) is committed at 48372c5d2 with its binding
    fixed at d8b91866a on this branch (PR #485); and the RANK-2 executor run
    (TASK-20260810-3e0793) is committed at 421932986. The single ready task is
    therefore f98fc0, running alone; after its receipt verifies, the plan
    resolves TASK-20260810-bde128 (RANK 3 literature acquisition) and
    TASK-20260810-b9d956 (independent red team on BCP-1) as the concurrent next
    pair at max_concurrent 2.

  decided_by: coordinator
  decided_at: '2026-08-19'
  decision_authority: >-
    The Coordinator's authority to re-scope and supersede an archive binding within
     a batch, exercised after empirically verifying the content_first supersedence
    against tools/research_dispatch.py's GitRepositoryVerifier. It asserts no
     scientific content and changes no official status, so it does not require
     independent review on its own merits; the batch's independent validation and
     red-team passes remain downstream of this re-scope.

  inference_provenance:
