coordinator_decision:
  id: DEC-20261005-f31688
  context: >-
    Design tick on 2026-10-05. origin/main was fetched at
    230462081dc12e0badfc905defc365f803819acd. The open ECC list
    on that tree still contains the arithmetic statements
    declined by DEC-20261005-138b51. The highest remaining
    proposal that names a curve is IDEA-20261005-ddbf31, a
    signed-sum monodromy census. H-MONO-0b3def already supports
    the input-point fibre and is not the object of this idea.
    The ordered-base sibling IDEA-20261005-70b25b is left open.
  decision: approve
  target_ids:
    - IDEA-20261005-ddbf31
    - H-MONO-a82b4a
    - EXP-MONO-1da7be
  rationale:
    - >-
      MONO is an ECC area, and this proposal is the high-priority
      open idea that is not an integer digit count. The contract
      reads the four signed sums on y^2 = x^3 + A x + B at p=101.
    - >-
      A design-session count, not a run, gave image order 8 on
      all four ordinary curves, with partition breaks 0 and
      four-cycle counts 15, 15, 24, and 14. The input fibre on
      the same points also has order 8.
    - >-
      Standing user authorization of 2026-09-06 covers approval.
      The protocol fields required before dispatch are filled.
    - >-
      H-MONO-0b3def and EXP-MONO-4c7479 are not edited. The
      ordered base is not folded into this contract.
  evidence_refs: []
  limitations:
    - The sample is one prime and 64 base points per curve.
    - Order 8 on the panel does not empty an exceptional locus outside the panel.
    - The j=0 artifact is supersingular at this prime and is not an ordinary control.
    - Approval authorizes six deterministic runs. It does not assert the image.
  next_actions:
    - >-
      Snapshot-archive this contract. Do not launch
      TASK-20261005-897310 until the receipt verifies.
  knowledge_promotion:
    promoted: []
    not_warranted: Approval of an unrun contract. No finding is promoted.
  decided_by: coordinator
  decided_at: '2026-10-05'
