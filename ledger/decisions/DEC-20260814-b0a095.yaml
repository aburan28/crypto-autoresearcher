  - RQ-MLKEM-001
  - KN-FIND-001e68
  - KN-FIND-5e9728

  # ==================================================================
  # 1. VALIDITY BEFORE INTERPRETATION
  # ==================================================================
  run_set_validity:
    ruling: >-
      THE RUN SET IS VALID AND ADMISSIBLE AS EVIDENCE FOR THE PARTS NAMED admissible_now IN
      EV-MLKEM-159715. The Validator's own verdict is `passed`, checked before interpretation,
      not taken on that word alone; the Red Team independently confirms the mechanical
      arithmetic and states plainly it is not disputing the branch call.
    expected_run_count: >-
      ONE lead producer, ONE task covering Stage A and Stage B (9 declared artifacts, ~a
      fraction of the 3600 s hard cap). Both reviews independently confirm no invocation is
      omitted, every defined (parameter set, model) cell is computed (8/8), and no lattice
      reduction of any kind (fpylll/BKZ/HKZ) occurred anywhere.
    schema_complete_manifests: >-
      CONFIRMED BY THE VALIDATOR (reviewed_snapshot.change_set_equality_07bfae: 10/10, 0 extra,
      0 missing, every path sha256 independently recomputed from the git object database) AND
      INDEPENDENTLY BY THE RED TEAM ("Commit and change-set verification" section, identical
      result). The notarization chain (TASK-20260814-487c0f, 3/3) is independently re-verified
      IN BOTH DIRECTIONS by the Validator: PREREG-7 confirmed ABSENT at the notarizing commit's
      parent, ZERO producer artifacts at that commit.
    seed_integrity: >-
      No random sampling occurs anywhere in this batch -- Stage A is an exhaustive census over
      all 3329 residues (no PRNG), and Stage B is a closed-form estimator readout. Both reviews
      independently confirm this (Validator HVC-1: "Stage A is an EXHAUSTIVE closed-form census
      ... no sampling, no PRNG anywhere"; Red Team's own from-scratch reproduction requires no
      seed).
    raw_summary_agreement: >-
      CONFIRMED, AT EVERY DEFINED CELL. Both reviews independently re-derived every reported
      beta/rop figure directly from PREREG-7's frozen text and the pinned estimator, without
      importing the producer's ciphertext_noise_readout.py, and confirm exact agreement with
      the producer's own results_ciphertext_noise.json and writeup at all 8 defined
      (parameter set, model) cells.
    control_comparability: >-
      CONFIRMED, AND SUBSTANTIALLY EXTENDED BY BOTH REVIEWS' OWN BUILT CONTROLS. The Validator
      performed a self-check that its own M2-construction technique (DiscreteGaussian-rebuilt
      Xe, m overridden) reproduces the known-answer-controlled key-side beta exactly at
      m=1024 (CTRL-1), then built a coarse-then-fine m-sweep bracketing reduced_m=236 (CTRL-2).
      The Red Team independently built five separate probes, including a single-unit-step scan
      specifically bracketing m=236 (probe5) and a source-level mechanism trace of the pinned
      estimator's own Bai-Galbraith construction. Both controls converge independently on the
      SAME chaotic-region finding via non-overlapping methods, and both also independently
      confirm the null control at ML-KEM-512/768 (0 singleton fibres at d_u=10, forced by the
      exact census, not an unexplored choice).
    infrastructure_separation: >-
      No infrastructure failure invalidates any part of this committed batch's evidence.
      lattice-estimator availability at the pinned commit (3e48ef421ec256afddb3e7d2249a77eab6e9ba12)
      is confirmed live and independently by the lead, the Validator, and the Red Team, in
      three separate sessions/clones, each reproducing the exact known-answer-control figures.
      The two disclosed protocol deviations (the committed FIPS 203 corpus lacking the
      Compress/Decompress passage, requiring a fresh PDF fetch; the mod-q delta-centering bug,
      caught and fixed before any final number was reported) are both independently confirmed
      genuine, honestly described, and non-recurring elsewhere -- neither is an unresolved
      infrastructure failure.

  # ==================================================================
  # ITEM (a) -- DID THE TERMINATION BRANCH FIRE CORRECTLY
  # ==================================================================
  ruling_a_termination_branch: >-
    YES, MECHANICALLY, BOTH REVIEWS CONFIRM. T-CIPHNOISE-CLOSED fires per PREREG-7 section
    3.6's frozen precedence: T-CIPHNOISE-NODATA does not fire (Stage A clears F(a)/F(d);
    section 1's infrastructure and API-surface checks both succeed); the three parameter sets
    agree CLOSED (ML-KEM-512: 404>=389; ML-KEM-768: 633>=606; ML-KEM-1024: 872>=855), so
    T-CIPHNOISE-MIXED does not fire; full agreement among CLOSED/OPEN means T-CIPHNOISE-CLOSED
    fires, aggregate CLOSED-ALL. Both reviews independently re-derived this from their own
    from-scratch recomputed beta figures, with no producer import, and both state explicitly
    they are not disputing the branch call. The branch is additionally shown ROBUST to both
    reviews' own most significant new finding (the M2 chaos control): at ML-KEM-1024,
    beta(best)=max(872,872,617)=872 regardless of what M2 itself reads, because M2's own value
    is lower than the independently-confirmed-robust M0/M1 figures and so never sets "best."
    F(b) (HEUR-MLKEM-11aabf-1's own falsification condition, beta(M2)>=beta(M0) at
    ML-KEM-1024) is recorded ALONGSIDE the branch, per PREREG-7 section 3.5's own instruction,
    and did NOT fire (617<872) -- both reviews independently confirm this, while also
    independently flagging (Validator CTRL-3; Red Team's counterexample_or_mutation) that the
    NOT-FIRED reading is technically correct as computed but sits only ONE UNIT OF m away from
    the opposite reading (m=237 would have returned 908>872, firing F(b)), which is a material
    fact about the reading's fragility, not itself a falsification (PREREG-7 does not license
    moving a falsification condition's evaluation point after the fact, and this decision does
    not do so).

  # ==================================================================
  # ITEM (b) -- THE CORRECTED CITABLE WORDING FOR THE M2 FIGURE
  # ==================================================================
  ruling_b_m2_corrected_wording: >-
    ADOPTED IN FULL, from both reviews' own convergent finding, not invented fresh --
    EV-MLKEM-159715.m2_magnitude_corrected_citable_wording is the text a future citation of
    T-CIPHNOISE-CLOSED's discharge, or of the "255 bits"/"beta(M2)=617" figures specifically,
    MUST carry, narrower than PREREG-7 section 3.6's own default license for T-CIPHNOISE-CLOSED
    ("citing the exact M0/M1/M2 beta figures ... as a labelled model readout ... narrowly").
    THE REASONING, RE-DERIVED RATHER THAN MERELY CITED: beta(M2)=617 is a deterministic,
    reproducible ARITHMETIC FACT at the producer's actual reduced_m=236 -- both reviews
    reproduce it exactly, and the Validator's own re-run confirms it five times over. But the
    INTERPRETATION of that number as a stable measurement of "the effect of removing
    compression noise" (H-MLKEM-11aabf's own stated mechanism) is independently shown by both
    reviews, via genuinely different built controls, to be unsupported: the number sits inside
    a demonstrated chaotic, near-breakdown region of primal_bdd/RC.MATZOV's own cost landscape
    at the severely sample-starved regime M2's construction requires, with a source-verified
    mechanism (the pinned estimator's own Bai-Galbraith embedding-enlargement construction,
    which floors the internal d-optimizer's search grid at d>=n=1024 regardless of how small m
    is) and NO validity-range guard anywhere in the primal_usvp/primal_bdd call graph tied to
    m vs n (unlike this same estimator's lwe_dual.py/lwe_guess.py/lwe_bkw.py, which do raise
    an InsufficientSamplesError for their own success conditions). The QUALITATIVE conclusion
    (M2 < M0, so the honest treatment cannot make the ciphertext-side lattice more favourable
    to the defender than the naive treatment already suggests) is not in dispute and is not
    weakened by this correction. The SPECIFIC MAGNITUDE ("255 bits," "~2 orders of magnitude
    beyond the predicted 2-4 bit floor") IS. This correction is NOT optional: BOTH REVIEWS
    INDEPENDENTLY REQUIRED IT, via genuinely different, non-overlapping methods (the
    Validator's coarse-then-fine m-sweep; the Red Team's five separate probes including a
    single-unit-step scan specifically bracketing m=236, plus an independent source-level
    mechanism trace neither review borrowed from the other) -- reached WITHIN THIS SINGLE
    BATCH, working blind to each other's write scope, and the convergence of two structurally
    unrelated methods is what makes this finding ACTIONABLE rather than merely suggestive,
    matching this goal's own established convention (EV-MLKEM-f65f00.hkz_discharge_corrected_citable_wording
    and EV-MLKEM-552c58.mutctrl_corrected_citable_wording used the identical method).

  # ==================================================================
  # ITEM (c) -- THE M0==M1 PROTOCOL-DESIGN DEGENERACY AND WHAT IT MEANS GOING FORWARD
  # ==================================================================
  ruling_c_m0_m1_degeneracy_and_forward_guidance: >-
    THE FINDING IS ADOPTED AS STATED IN EV-MLKEM-159715.m0_m1_identity_finding: beta(M0)=
    beta(M1) exactly, at every tested parameter set, is a FORCED mathematical identity under
    PREREG-7's own M1 specification -- independently re-derived symbolically and numerically
    by both reviews, confirmed at two structurally different partitions (d_u=10's 767x3/257x4
    and d_u=11's 767x1/1281x2). THIS IS A PREREG-7 PROTOCOL-DESIGN DEGENERACY, NOT A PRODUCER
    EXECUTION DEFECT -- the producer built M1 exactly as PREREG-7 section 3.2 specified it
    ("the estimator is fed a single effective distribution constructed as this properly
    class-weighted mixture"), and no execution of that literal specification, however careful,
    could have produced a number different from M0, given the pinned estimator's own
    variance-only Xe cost path. WHAT THIS MEANS FOR H-MLKEM-11aabf GOING FORWARD, reasoned
    through explicitly rather than defaulted: this DOES NOT close the noise-heterogeneity
    question H-MLKEM-11aabf's own mechanism describes (that the public singleton/doublet label
    justifies a more honest per-coordinate noise model) -- it shows that THIS SPECIFIC
    INSTRUMENT-FEEDING CONSTRUCTION ("mixture-then-convolve-then-feed-one-marginal" against a
    variance-only cost path) is structurally incapable of testing it, which is a narrower and
    more useful finding than either "the mechanism is wrong" or "the mechanism is confirmed."
    Both reviews independently and identically name the forward path: a genuinely different
    attack construction (e.g. a row-rescaling/whitening technique that treats coordinates
    heterogeneously rather than mixing them into one marginal -- a real, different technique,
    which the pinned estimator's own LWEParameters API does not itself expose) OR an instrument
    extension that consumes more than the first two moments of a per-coordinate-varying noise
    model. NEITHER OF THESE IS COMMISSIONED BY THIS DECISION -- both are named as available,
    licensed candidates for a future, separately-specified protocol, exactly matching PREREG-7
    section 3.6's own declared forward boundary that a genuinely different noise-model
    construction is a NEW question requiring its own, separately-commissioned Coordinator
    decision, not an automatic successor to this batch. Whether C2's own future work pursues
    this is left to the next_action below and to whichever Coordinator session next opens a
    batch on H-MLKEM-11aabf, not pre-decided here.

  # ==================================================================
  # ITEM (d) -- H-MLKEM-11aabf'S STATUS TRANSITION
  # ==================================================================
  ruling_d_hypothesis_status: >-
    STATUS MOVES TO `analyzed` -- FURTHER THAN PREREG-7 section 0.2's OWN MINIMUM JUDGMENT
    (`specified`), BUT NOT ALL THE WAY TO A TERMINAL `supported`/`weakened`/`rejected` CALL.
    REASONED THROUGH EXPLICITLY, PER AGENTS.md's research-states lifecycle (`proposed ->
    specified -> approved -> running -> analyzed -> replicated -> supported | weakened |
    rejected | inconclusive | superseded`), CHECKED AGAINST THIS GOAL'S OWN VOCABULARY
    (templates/research-records.md and the status values actually in use across
    ledger/hypotheses/*.yaml -- `proposed, specified, approved, analyzed, supported,
    supported_scoped, weakened, rejected, rejected_scoped, inconclusive`; no status is
    invented here). `specified` describes a hypothesis with a frozen, bounded protocol not
    yet executed -- PREREG-7 section 0.2's own judgment was made BEFORE any measurement
    existed and is now stale on its own terms: this hypothesis has since been FULLY MEASURED
    (Stage A and Stage B both ran to completion, within budget) and FULLY REVIEWED (two
    independent, passing/concurring reviews that independently REPRODUCED, not merely
    checked, the central numbers via genuinely different code). Leaving status at `specified`
    would understate what has actually happened and would misrepresent the ledger's own record
    of this batch. `analyzed` is the correct next step in the lifecycle -- the hypothesis has
    been measured and its results interpreted (this record IS that interpretation) -- and is
    chosen OVER a jump to `supported` for a reason stated explicitly, not defaulted: C1 alone,
    if it were a standalone hypothesis, would warrant `supported` (derivation-tier, exactly
    confirmed, independently replicated twice, no falsification possible even in principle
    given it is closed-form arithmetic over a finite domain). But H-MLKEM-11aabf bundles C1
    and C2 under ONE status field, and C2's own predictions were only UNEVENLY tested: its
    HEADLINE deliverable (recording CLOSED with the exact number) is delivered and robust; its
    OWN stated M1 prediction is unfalsifiable-as-specified and was silently missed (item c);
    and its OWN stated M2 magnitude prediction, while directionally satisfied, is independently
    shown by BOTH reviews to be an unreliable reading of the underlying mechanism in the
    specific regime tested (item b). Given AGENTS.md's discipline against overclaiming and the
    goal's own established practice of narrowing rather than inflating a default reading when
    two independent reviews converge on a reason to do so (DEC-20260813-9c7353's own
    `revise`-not-`approve` reasoning is the direct precedent for this exact situation), calling
    the WHOLE bundled hypothesis `supported` now would extend more confidence to C2's own
    specific numeric predictions than this batch's own evidence, read honestly, supports.
    `weakened` is NOT chosen either: nothing in this batch actually undermines
    H-MLKEM-11aabf's core testable claims (see decision_note above) -- the two reviews'
    findings narrow HOW MUCH weight to place on specific downstream numbers, they do not
    contradict the hypothesis's own falsifiable structure, which passed every test wired to it.
    `analyzed` is therefore the disciplined, correct terminal status FOR THIS BATCH: fully
    measured, fully and independently reviewed, no falsification, genuine open items narrowing
    confidence in two specific sub-claims, explicitly recorded rather than smoothed over,
    with a concrete forward path (item c) that a future, separately-commissioned batch could
    pursue toward a firmer terminal call. ledger/hypotheses/H-MLKEM-11aabf.yaml's own `status`
    field is edited to `analyzed` by this same archive, per PREREG-7 section 0.2's own
    reservation of this transition for the ledger-archive session.

  # ==================================================================
  # ITEM (e) -- KNOWLEDGE PROMOTION
  # ==================================================================
  ruling_e_knowledge_promotion_pointer: >-
    See knowledge_promotion below. BOTH candidate findings are judged, ON THE MERITS,
    EXPLICITLY CONSIDERED RATHER THAN ASSUMED EITHER WAY, TO WARRANT PROMOTION, as TWO
    separate, genuinely new entries distinct from this goal's six prior KN-FIND-* entries
    (KN-FIND-7d098b, KN-FIND-9d44b4, KN-FIND-9b5df0, KN-FIND-7de6b6, KN-FIND-d29ece,
    KN-FIND-7ffdd0 -- all of which concern the hkz/HKZ-independence lineage's own comparison/
    mutation-testing instruments, a completely different lane from this batch's cost-model-
    estimator lane, using a different underlying tool (fpylll direct reduction vs. a
    closed-form lattice-cost estimator) and a different failure mode entirely in each case).
    Two identifiers are requested, since both findings independently meet this goal's own
    established discretionary-promotion bar (DEC-20260813-9c7353's own knowledge_promotion
    section: replicated within a single batch via genuinely different methods; durable,
    independent of how this hypothesis's own open questions resolve; generalizes beyond this
    goal and beyond the existing findings' family).

  # ==================================================================
  # ITEM (f) -- WHY THIS IS NOT A FURTHER CONSECUTIVE GATE/CRITERION REPAIR
  # ==================================================================
  ruling_f_repair_bar_ruling: >-
    RE-DERIVED, EXTENDING PREREG-6 2.7's own three-part test to this decision's own acts, for
    the FIRST time on this batch's own object (a genuinely different lane from the hkz/
    HKZ-independence lineage's own seven-batch repair count, which this decision does not
    touch, extend, or reset). (1) DOES THIS DECISION SPECIFY A NEW CRITERION, CLAUSE, GATE OR
    THRESHOLD? No. The corrected citable wording narrows what an ALREADY-FIRED branch's
    ALREADY-WRITTEN default license may be cited as establishing; the M0=M1 forward-guidance
    ruling names licensed candidates without commissioning any of them; the status ruling
    applies the ALREADY-EXISTING lifecycle vocabulary to an ALREADY-COMPLETED measurement.
    None of these creates a rule any future candidate would be scored against, and this
    decision touches no A-1 sub-clause or hkz-lineage admissibility gate anywhere. (2) DOES
    THIS DECISION RE-VERIFY A MEASUREMENT ALREADY MADE, OR MEASURE A GENUINELY DIFFERENT
    OBJECT? Neither -- it makes no new measurement; it reviews and rules on an ALREADY-
    COMPLETED, ALREADY-REVIEWED FIRST measurement of a genuinely different RQ-MLKEM-001
    hypothesis (ciphertext-side noise modelling, C1/C2) from anything the hkz/HKZ-independence
    lineage's own seven prior instrument-batches measured (route-comparison/mutation-testing
    on a shared BKZ-reduced basis construction). (3) IS ITS OUTCOME A VERIFICATION/CORRECTION
    RESULT ABOUT THE INSTRUMENT'S OWN PRIOR MEASUREMENT, OR A REPAIRED GATE'S PASS/FAIL? The
    former, exclusively -- every ruling above characterizes what THIS batch's own evidence
    does and does not establish about H-MLKEM-11aabf's own predictions, never any lattice's
    admissibility. THIS DECISION DOES NOT TOUCH, EXTEND, OR RESET the hkz-lineage's own
    seven-consecutive-instrument-batch count in any respect.

  # ==================================================================
  # RATIONALE
  # ==================================================================
  rationale:
  - >-
    THE BATCH DISCHARGED ITS PREDECESSOR'S SINGLE NEXT ACTION IN FULL. It took H-MLKEM-11aabf
    -- the most decision-relevant of three idle RQ-MLKEM-001 hypotheses -- through
    /design-experiment directly (reasoned explicitly against /propose-ideas first, PREREG-7
    section 0) to a frozen, bounded protocol, at this lineage's own established discipline
    (split-producer notarization, frozen termination clause, explicit falsification
    conditions), and both reviews independently confirm every stage ran exactly to spec.
  - >-
    THE HARD CALL IS THE SAME SHAPE AS THIS GOAL'S PRIOR HARD CALLS, APPLIED TO A REAL
    HYPOTHESIS FOR THE FIRST TIME. DEC-20260813-9c7353 found a branch fired correctly but its
    default LICENSES-text overstated what the evidence supported for an instrument-calibration
    finding with no hypothesis attached; this decision finds the identical structure on a
    batch that DOES adjudicate a hypothesis -- T-CIPHNOISE-CLOSED fired correctly, but its
    default license for the M2 figure specifically overstates what this batch's own
    convergent evidence supports. Recording the corrected wording, and choosing `analyzed`
    over an unqualified `supported` for the hypothesis's own status, is deliberate for the
    identical reason: the informal reading a future citation would reach for is not the one
    this batch's evidence supports.
  - >-
    THE CONVERGENCE WITHIN A SINGLE BATCH IS WHAT MAKES BOTH CENTRAL FINDINGS ACTIONABLE
    RATHER THAN SUGGESTIVE. Two reviewers, working from the same frozen text without reading
    each other's write scope, independently reached BOTH the M2-chaos finding and the M0=M1
    forced-identity finding by genuinely different, non-overlapping methods (a coarse-then-fine
    m-sweep vs. five separate probes including a source-level mechanism trace; and two
    independently-written symbolic-plus-numerical re-derivations of the same law-of-total-
    probability argument). Neither borrows the other's warrant.
  - >-
    THE ADVERSE ITEMS ARE CARRIED RATHER THAN BURIED. The M1 falsification-coverage gap, the
    M2 magnitude's demonstrated unreliability, and the honest ruling that H-MLKEM-11aabf's own
    status stays short of `supported` are all recorded at full weight, none smoothed into a
    `passed` verdict's silence or inflated into a false sense of closure.
