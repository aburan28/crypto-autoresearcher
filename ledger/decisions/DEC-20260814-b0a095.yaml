coordinator_decision:
  id: DEC-20260814-b0a095

  context: >-
    BATCH-a5b13c of GOAL-MLKEM-005 discharged DEC-20260813-9c7353's single next_action against
    PREREG-7, the frozen pre-registration notarized alone at commit
    89bf454eaf67dffa0e9585e2bccfb4b2e2b1543c by TASK-20260814-487c0f's own snapshot task (zero
    producer artifacts). PREREG-7 took H-MLKEM-11aabf -- the most decision-relevant of three
    idle, `proposed` RQ-MLKEM-001 hypotheses -- through /design-experiment directly to a
    two-stage protocol: Stage A (C1, the exact Compress_d fibre census over Z_q, q=3329) and
    Stage B (C2, a three-noise-model ciphertext-side block-size readout under the pinned,
    already-known-answer-controlled sage-free lattice-estimator harness, RC.MATZOV,
    primal_bdd). The lead producer TASK-20260814-c87a24 independently re-verified the pinned
    estimator infrastructure, ran Stage A's full census (F(a)/F(d) both clear), and, gated on
    that clearing, ran Stage B at ML-KEM-512/768/1024: beta(key-side)=389/606/855;
    beta(M0)=beta(M1)=404/633/872 exactly at every set; beta(M2)=617 at ML-KEM-1024 only
    (reduced_m=236, base_m=1024); F(b) (beta(M2)>=beta(M0)) NOT FIRED (617<872); aggregate
    CLOSED-ALL (every parameter set CLOSED). Snapshot-committed at
    6f6c0a0f645b6f762042500210d622675a15e7c1 by TASK-20260814-07bfae (10 declared paths).
    TWO INDEPENDENT REVIEWS RETURNED: Validator TASK-20260814-b13873 (VAL-20260814-b13873),
    verdict `passed`; Red Team TASK-20260814-c09076 (RT-20260814-174d78), a PRIMARY finding
    plus five further findings, stating explicitly "this is not a rejection of the branch
    call." BOTH REVIEWS, INDEPENDENTLY, VIA GENUINELY DIFFERENT METHODS (the Validator built
    m_sensitivity_sweep.py/m_sensitivity_sweep_fine.py; the Red Team built five separate
    probes including a single-unit-step scan bracketing m=236; neither imported the other's
    code or read the other's write scope during execution), CONVERGE ON TWO MAJOR FINDINGS:
    (1) beta(M2)=617's own "255 bits below beta(M0)" headline sits inside a demonstrated,
    reproducible, chaotic/non-smooth region of primal_bdd/RC.MATZOV's own cost landscape in
    the severely sample-starved (m<<n, reduced_m=236 vs base m=n=1024, ~23%) regime M2's
    construction requires, source-traced to the pinned estimator's own Bai-Galbraith
    embedding-enlargement construction with no validity-range guard for this attack path
    (m=236->617, m=237->908/905, a ~290-bit swing for Delta-m=1; total optimizer failure
    below m~218-220; smooth only above m~240-250); (2) beta(M0)=beta(M1) exactly, at every
    parameter set, is a FORCED mathematical identity under PREREG-7's own M1 specification (a
    "single effective distribution" fed to a variance-only cost path) combined with the
    fibre-size classes M1 conditions on partitioning the full population -- so C2's "three
    declared noise models" are, as actually executable against this pinned instrument, only
    TWO distinguishable readouts (M0=M1, and M2), and H-MLKEM-11aabf's own M1-specific
    numeric prediction (2-4 bits/under 1 bit) was silently missed (0 bits measured) with no
    F() condition wired to notice. NEITHER REVIEW DISPUTES THE CLOSED-ALL TERMINATION BRANCH.
    CLAIM TIER DERIVATION (C1) / MEDIUM (C2), NOT TOY: labelled model readouts under one pinned
    estimator and one named cost model, never a measured attack cost or a revision of any
    published security estimate.

  decision: revise

  decision_note: >-
    `revise` is the ACTION -- the evidence record is committed with the termination branch
    read exactly as fired, the discharge's default LICENSES-text corrected and narrowed for
    the M2 figure specifically per the convergent review finding, the M0=M1
    protocol-design-degeneracy finding entered with its forward guidance, H-MLKEM-11aabf's own
    status ruled on explicitly, the knowledge-promotion determination made on the merits, and
    the goal's single next action specified -- it is NOT a verdict on ML-KEM security, on any
    FIPS 203 parameter set's deployed safety, or on any attack cost. `support` is NOT chosen
    unconditionally: while no falsification condition fired and C1 is essentially proven, both
    reviews independently show H-MLKEM-11aabf's own C2 predictions were only partially and
    unevenly tested (M1's specific prediction is unfalsifiable-as-specified; M2's specific
    magnitude is independently shown to be dominated by an instrument artifact in the m<<n
    regime), so an unqualified `support` would overstate what this batch's own evidence
    establishes -- the corrected wording this decision adopts exists precisely because the
    default reading would otherwise overclaim. `weaken` is NOT chosen either: nothing in this
    batch actually undermines H-MLKEM-11aabf's core, testable claims -- C1 is confirmed
    exactly, the CLOSED-ALL verdict (the hypothesis's own predicted, expected deliverable)
    fired at every tested parameter set and is ROBUST to both reviews' own most significant new
    finding (M2 never sets "best" at ML-KEM-1024), and HEUR-MLKEM-11aabf-1's own falsification
    condition did not fire. `reject_scoped` is unavailable and would be forbidden even if it
    applied: no falsification condition fired, and AGENTS.md's own rule forbids
    `reject_scoped` on a single unreplicated empirical-only run in any case, which does not
    describe this batch's own REPLICATED central findings. `pause` is unavailable for the same
    reasons prior decisions in this goal gave: GOAL-MLKEM-005's pause_conditions are
    infrastructure-only plus a user request, and nothing in this batch triggers either.
    THIS BATCH CLOSES, PAUSES AND COMPLETES NOTHING. T-CIPHNOISE-CLOSED closes no lane by
    itself -- PREREG-7 section 6 is explicit its FORBIDS list includes closing, pausing or
    completing GOAL-MLKEM-005, closing RQ-MLKEM-001, or any claim about best-of-M ciphertext
    selection. T-HKZINDEP-CONFIRMED, T-C3LANE-OPEN-PARTIAL, T-INDVERIFY-ARTIFACT-PARTIAL and
    T-MUTCTRL-DETECTED are EXPLICITLY NOT retroactively changed by anything in this decision.

  target_ids:
  - GOAL-MLKEM-005
  - BATCH-a5b13c
  - EV-MLKEM-159715
  - TASK-20260814-d13724
  - TASK-20260814-487c0f
  - TASK-20260814-c87a24
  - TASK-20260814-07bfae
  - TASK-20260814-b13873
  - TASK-20260814-c09076
  - DEC-20260813-9c7353
