      BOTH CANDIDATES WERE JUDGED, ON THE MERITS, EXPLICITLY CONSIDERED RATHER THAN ASSUMED
      EITHER WAY, TO MERIT DISCRETIONARY PROMOTION -- the mandatory trigger is explicitly not
