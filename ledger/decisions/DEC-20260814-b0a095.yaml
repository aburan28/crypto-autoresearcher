      CANDIDATE 1 (promoted as KN-FIND-001e68), STATED IN FULL AS TRANSCRIBED VERBATIM INTO
      THE COMMITTED ENTRY: A
      closed-form lattice-cost estimator's primal-attack cost readout (here: primal_bdd under
      RC.MATZOV in the pinned sage-free lattice-estimator, commit
      3e48ef421ec256afddb3e7d2249a77eab6e9ba12) can exhibit demonstrated, reproducible,
      non-smooth/chaotic behavior in its returned block-size (beta) as a function of sample
      count m, specifically in the severely sample-starved regime m << n (here m/n ~ 23%,
      m=236 vs n=1024): total optimizer failure (no finite-cost configuration found, rop=+inf)
      below a threshold; a chaotic, non-monotone band immediately above it (beta swinging by
      hundreds of bits within ~20 units of m, a single-unit change producing a ~290-bit jump);
      smooth, monotone behavior only once m grows large enough relative to n. The mechanism is
      source-verified, not merely observed: the estimator's own primal_usvp/primal_bdd call
      path applies a Bai-Galbraith embedding-enlargement construction that floors its internal
      d-optimizer's search grid at d>=n regardless of how small m is, producing a cramped,
      locally non-convex search landscape whenever m<<n, and no InsufficientSamplesError-style
      validity guard exists for this specific attack path tied to m vs n (unlike this same
      estimator's lwe_dual.py/lwe_guess.py/lwe_bkw.py modules, which do raise such a guard for
      their own success conditions) -- the instrument silently returns a number from deep
      inside the chaotic band with no warning. GENERAL LESSON: any research use of this or a
      structurally similar closed-form lattice-cost estimator that constructs a
      REDUCED-DIMENSION (sample-starved, m<<n) instance and cites its headline beta/cost figure
      must first run and report an m-sensitivity/smoothness control bracketing the constructed
      m, because a single headline number in this regime cannot be trusted as a stable
      measurement of the underlying object without one -- the MAGNITUDE, not merely the
      direction, of an effect can be dominated by instrument artifact.
      GROUNDS: (1) REPLICATED within a single batch -- independently built and run by both
      reviewers via genuinely different, non-overlapping probes (Validator: a coarse-then-fine
      m-sweep, two scripts; Red Team: five separate probes including a single-unit-step scan
      specifically bracketing m=236, plus an independent source-level mechanism trace neither
      review borrowed from the other), reaching the same qualitative picture and, where
      overlapping (m=236, m=240), the same quantitative readings. (2) DURABLE -- the underlying
      mechanism (the Bai-Galbraith embedding trick's d>=n floor) is a property of the pinned
      estimator's own source code, independent of how H-MLKEM-11aabf's own open questions
      resolve. (3) GENERALIZES beyond this goal and beyond its existing six findings, all of
      which concern the hkz/HKZ-independence lineage's own two-route comparison/mutation-
      testing instruments (a different tool -- fpylll direct reduction, not a closed-form
      cost-model estimator -- and a different failure mode entirely). This finding is about the
      RELIABILITY OF A CLOSED-FORM LATTICE-COST-ESTIMATOR READOUT ITSELF in a specific, common
      construction pattern (reduced-dimension/clean-samples-only instances), directly relevant
      to any future hypothesis in this or another campaign proposing to drop/reduce samples and
      read a beta figure off this same class of estimator.
      source_refs: BATCH-a5b13c, TASK-20260814-d13724, TASK-20260814-c87a24,
      TASK-20260814-b13873, TASK-20260814-c09076. internal_refs: EV-MLKEM-159715,
      DEC-20260814-b0a095. Committed at knowledge/findings/KN-FIND-001e68.md.

      CANDIDATE 2 (promoted as KN-FIND-5e9728): When a hypothesis-
      testing protocol specifies a "per-class noise reweighting" or heterogeneous-noise
      construction as -- partition the population into classes by a public/known label, build
      each class's own noise distribution, and then feed the attack/cost instrument a SINGLE
      combined ("effective") marginal distribution built as the probability-weighted mixture of
      the per-class distributions -- that construction is FORCED, by the law of total
      probability applied to sums of independent random variables, to equal the
      population-average ("unconditional marginal") noise distribution the naive/baseline model
      already uses, WHENEVER the classes partition the full population and the cost
      instrument's noise-consuming code path is itself distributional-moment-only (e.g.
      variance-only, as directly source-verified here for the pinned estimator's
      primal_bdd/Xe.stddev path). This holds regardless of the specific class sizes,
      probabilities, or per-class distributions, and regardless of the specific partition
      (independently confirmed at two structurally different partitions of the same
      population, one with two class-sizes both >1 and one with a singleton/doublet split --
      same forced equality both times). PRACTICAL UPSHOT: a protocol that specifies "feed the
      estimator one combined/effective distribution" for a per-coordinate-heterogeneous noise
      model has, by that specification choice alone, already collapsed the intended
      heterogeneous test to the homogeneous baseline BEFORE any data is measured -- the
      resulting agreement is not evidence that heterogeneity does not matter; it is a design
      artifact of how the heterogeneous model was fed to a variance-only instrument. GENERAL
      LESSON: to actually test whether a public/known per-coordinate class label matters to
      attacker difficulty against a moment-only cost instrument, the construction must change
      WHICH SAMPLES/EQUATIONS the instrument sees (e.g. a genuine dimension reduction or
      selective retention, not a re-mixed marginal) or must use/build an instrument that
      consumes more than the first two moments of a per-coordinate-varying noise model; "feed
      one combined distribution" is mathematically guaranteed not to distinguish the two, for
      any partition, on any population, against any variance-only cost path.
      GROUNDS: (1) REPLICATED -- independently re-derived, symbolically AND numerically, by
      both reviews, confirmed at two structurally different partitions of the same population.
      (2) DURABLE -- a mathematical fact (law of total probability applied to mixtures over a
      partition), independent of any future measurement or of how H-MLKEM-11aabf's own open
      questions resolve. (3) GENERALIZES beyond this goal and beyond its existing six findings
      (again, a different lane and a different failure mode entirely). This is a general
      protocol-design lesson for ANY future hypothesis proposing to test per-coordinate/
      per-class noise heterogeneity against a moment-only cost instrument by "mixing then
      feeding one combined distribution" -- directly actionable and preventable in a way none
      of the existing findings describe.
      source_refs: BATCH-a5b13c, TASK-20260814-d13724, TASK-20260814-c87a24,
      TASK-20260814-b13873, TASK-20260814-c09076. internal_refs: EV-MLKEM-159715,
      DEC-20260814-b0a095. Committed at knowledge/findings/KN-FIND-5e9728.md.

