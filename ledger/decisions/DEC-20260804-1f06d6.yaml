coordinator_decision:
  id: DEC-20260804-1f06d6
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-060
  recorded_by_task: TASK-20260804-050
  archived_by: TASK-20260804-052
  context: >-
    BATCH-060 frontier rerank after 59 batches. All examined ordinary-isogeny-based
    ECDLP directions have been blocked or paused. The Semaev BKK analysis gives a
    constant factor-2 improvement (not exponent-moving). OIFP MITM is valid but
    gives an algorithm for OIFP (not ECDLP), with unknown constant C. The knowledge
    corpus (KN-OPEN-3f7a21) has integrity issues limiting novelty screening.

  decision: advance_ggm_analysis
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    BATCH-060 dispatches a mathematical analysis of H-GGM-001 (augmented ECDLP oracle
    simulability test). H-GGM-001 has been at `specified` since the early program and
    addresses a SCALE-INDEPENDENT question: are jet/elliptic-net/incidence augmented
    oracles simulable in the generic group model? A SIMULABLE verdict closes a whole
    class of oracle-based attacks by theorem (cheap, decisive). A NON-SIMULABLE
    verdict is a potential non-generic signal. Neither outcome requires running an
    experiment; it requires a mathematical argument.

  frontier_rerank:
    hypothesis_statuses:
      H-IT-001: weakened (ordinary isogeny transfer to anomalous/MOV/Weil-descent)
      H-ICI-063e91: weakened (Elkies ell<=23 augmentation)
      H-STR-002: weakened (phi_alpha density, from BATCH-007)
      H-IC-001: weakened (index calculus on prime fields)
      H-OIFP-097d1a: specified (OIFP MITM, C unknown, inconclusive)
      H-GGM-001: specified (GGM simulability, NOT YET TESTED in current loop)
      H-YIELD-001: specified (decomposition yield, BATCH-011 void, NOT re-tested)
      H-FCP-001: analyzed (from earlier program)
    open_directions:
      - id: H-GGM-001
        priority: high
        rationale: Scale-independent mathematical test; SIMULABLE closes a class;
                   NON-SIMULABLE is a genuine signal; not tried in current loop
      - id: OIFP-MITM-C-scaling
        priority: medium
        rationale: C=O(1) vs O(log p) undetermined; requires larger experiments
      - id: Semaev-empirical-sparsity
        priority: low
        rationale: Actual root count 4x below BKK at m=3; persist at m=5?
      - id: KN-OPEN-009
        priority: medium
        rationale: Monodromy of Semaev cover is open; exceptional locus might give faster relations
    blocked_directions:
      - SG-ECDLP-002 (scalar-domain mismatch, paused)
      - IDEA-e88120 (h(D)<<N order mismatch)
      - IDEA-b6624c (MITM starting point undefined for ECDLP scalar)
      - IDEA-673f3a (p-adic formal group, expected closure)
      - IDEA-a4efaf (genus-2 cover, no 2-torsion for prime-order curves)

  exact_next_action: >-
    TASK-20260804-051: Mathematical analysis of H-GGM-001 — perform the simulability
    test for the four augmented oracles (first-jet, elliptic-net/Somos, incidence,
    endomorphism) to determine which are GGM-simulable and which provide genuinely
    k-dependent information. Expected: most are simulable; verify rigorously; identify
    any non-simulable oracle.

  knowledge_promotion:
