coordinator_decision:
  id: DEC-20260809-54f91c
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-ac2e6d
  context: >-
    The independent review TASK-20260809-f27fa2 returned NO-GO for the first
    canonical Arm-A contract EXP-ECDLP-51921d. This decision opens a versioned
    successor design and corrects the prior materialization record's inaccurate
    characterization of BATCH-bd36fe's unrelated synthetic XOR review.
  decision: revise
  decision_scope: >-
    Supersede the rejected contract for future execution with the new
    review-required EXP-ECDLP-a76937 / H-ECDLP-80fceb package. Preserve all
    predecessor bytes and the NO-GO review. No approval, freeze, implementation,
    execution authorization, run, evidence, or research-status promotion occurs.
  target_ids:
    - EXP-ECDLP-51921d
    - H-ECDLP-1853dc
    - EXP-ECDLP-a76937
    - H-ECDLP-80fceb
    - TASK-20260809-f27fa2
    - BATCH-ac2e6d
  rationale:
    - The independent review found six blocking design defects in executable admission, controls, costs, statistics, artifacts, and proof/Pareto accounting.
    - The previous BATCH-bd36fe review was for a synthetic XOR-control package and did not review an Arm-A ECDLP specification; it is not used as Arm-A evidence.
    - The successor fixes the defects with explicit certificates, paired controls, cost units, run matrix, held-out tests, stopping rules, artifact schemas, and no-result Pareto fields.
    - The missing configured API backend remains infrastructure only and is not evidence against either hypothesis.
  evidence_refs:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-ac2e6d/reviews/TASK-20260809-f27fa2/review_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-ac2e6d/archives/TASK-20260809-4c2ee7/snapshot-receipt.json
  limitations:
    - This decision does not assert that the repaired contract has passed independent review.
    - No implementation or experiment run exists.
    - Toy finite-size results, if later obtained, cannot establish a cryptographic-scale break or exponent improvement.
  supersession:
    prior_decision: DEC-20260809-b61556
    prior_citation_correction: >-
      The cited BATCH-bd36fe TASK-20260809-f84bf3 review is retained as an
      unrelated synthetic XOR-control design review. TASK-20260809-f27fa2 is
      the first independent review of the canonical Arm-A specification and
      its NO-GO verdict controls this successor gate.
