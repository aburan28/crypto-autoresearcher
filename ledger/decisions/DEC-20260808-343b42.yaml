  rationale:
    archive_invalidity: >-
      A self-neutral receipt must bind every frozen non-self path. Two false
      hashes make the 2b82966ae envelope invalid even though its parent, path
      set, review hash, and message-ID coverage are correct.
    false_queue_verification: >-
      5942b44be's queue hash map matches actual Git blobs, but the dispatcher
      compared only queue-to-Git and did not compare receipt-to-Git. Its
      completion note therefore falsely elevates a partial mechanical check
      into receipt verification and has no retroactive repair effect.
    predecessor_content_rule: >-
      EV-ECDLP-8e45ba and DEC-20260808-2acfa5 remain immutable historical
      content. Their factual lineage and unchanged REVISE account may be used
      only with the invalid envelope, both hash pairs, and false queue assertion
      prominently disclosed. Neither has a verifier-accepted archive envelope.
    forward_only_repair: >-
      Commit 849755b9c correctly marks TASK-20260808-bc7cb5 invalid and creates
      new review and archive tasks under new random identifiers. This decision
      completes that additive route without modifying prior paths.
    technical_disposition: >-
      The e37e061a technical report is byte-stable across the relevant lineage.
      Cluster-rank seed domains, treatment sharing, traffic compilation,
      planted sampling, exact-quotient L semantics, and canonical on-curve
      charges remain the exact blocker set. REVISE is supported; PASS and
      REJECT are not.
    execution_authorization:
      granted: false
      experiment_design_authorized: false
      experiment_execution_authorized: false
      reason: >-
        The six blockers prevent a deterministic, lossless, independently
        reproducible experiment contract. No experiment or run is authorized.
  proposal_disposition:
    status: proposed
    action: preserve_pending_new_immutable_revision
    novelty_status: unverified
    dominated_by: >-
      No measured gamma_s exists. Under the fully charged conditional model,
      rho remains the baseline unless the proposal's gate is met; no Pareto
