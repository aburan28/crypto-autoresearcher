    cluster-rank keys, run only the deterministic matched-mean decoder and
    eta-aware bootstrap fixture. Require exact seed regeneration, equal
    one-quarter means, frozen planted slopes, and Boolean-gamma separation by
    one-third before any curve, selector, isomorphism, or signed-y work. This is
    a future recommendation, not an approval or run.
  limitations:
    - No experiment, run, measured gamma_s, scalar recovery, attack, speedup, security impact, asymptotic improvement, crypto-scale result, or breakthrough exists.
    - EV-ECDLP-8e45ba and DEC-20260808-2acfa5 do not have a verifier-accepted archive envelope.
