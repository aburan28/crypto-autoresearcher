  rationale:
    - >-
      v1_stage16_protocol reuses frozen
      Stage 7 curves. D is round(N^{1/2})
      per cell: T2 4096, T1 4095. A shared
      D is not round(N^{1/2}). Cap is
      8*ceil(N/D)=32768 on both cells.
      n_walks 10000, partition
      independent_uniform_0_15, 4096
      spares, KS including T=0 with p=D/N
      per cell, certificate kind none, and
      hard gate fixture_pass are present.
      One thing changed versus the live
      Stage 15 contract: D 256 ->
      round(N^{1/2}) per cell.
    - >-
      Design V k=1,20,21,256 and k=D
      reconstruct on both cells; prefix
      k=1..20 matches Stage 7; k=21 and
      k=256 match Stage 15. NULL-3 k
      continues Random(20260908) after
      addends and starts to 4096; prefix
      matches Stage 10 and Stage 15.
      Extra-start pins 10, 11, 9999,
      10000, 10031, 10032, 14095
      reconstruct with 8 collision skips.
      first_j at 0 and 10 matches.
    - >-
      T2 NULL-3 x([k]P) has one collision
      at stream indices 745 and 1623, so
      |unique V|=4095 at declared D=4096.
      Pins at 20, 255, and 4095 remain
      distinct. The protocol does not
      claim T2 NULL-3 distinctness. KS
      uses declared D/N. This is a freeze
      observation, not a pin mismatch,
      not failed_infrastructure, and not
      a completeness failure.
    - >-
      Completeness is not authorization.
      Stage 16 stays unauthorized. Do not
      hunt a new cell. Do not execute
      Stage 16 from this decision.

