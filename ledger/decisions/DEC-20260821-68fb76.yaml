  context: >-
    BATCH-46254b (gate package, BCP-1) and BATCH-312472 (BCP-2 supersession
    + certificate kind) are CLOSED. DEC-20260820-32bf19 F-6 gates the blind
    calibration search: (a) the committed pin-mechanism test must land and
    pass first; (b) the pre-dispatch gate must be re-verified at dispatch
    time under the calibration interpreter; (c) the batch opening must name
    the run's budget, seed policy, null-object control, and charging
    convention. THIS DECISION OPENS BATCH-1f30fe (batch 3 of the 7-batch
    campaign), which executes the blind calibration search under BCP-2 —
    the first batch that can produce a result about the instrument, and
    therefore the first batch whose result the five dependent goals
    (GOAL-SHA2-001, GOAL-SHA3-001, GOAL-BLAKE-001, GOAL-ASCON-001,
    GOAL-SIMSPK-001) may cite. It records only what the batch's runs and
    reviews support, and asserts nothing about MD5 beyond the calibration
    result itself.

  scope:
    claim_ceiling: blind_calibration_execution_and_instrument_verdict_only
    claim_ceiling_statement: >-
      This batch EXECUTES the blind calibration search and its null-object
      control, and records an instrument verdict (capability at the
      declared encoding, seed, and ceiling; cost anchor; ceiling report).
      Both outcomes are admissible per the goal's completion criterion: a
      verified rediscovery (recorded with the BCP-2 confound caveat, never
      unqualified) or a budgeted failure (a report about the solver, never
      evidence about MD5, SC-4). The batch asserts NOTHING about MD5 beyond
      what the executed runs and their two independent reviews support.
    in_scope:
      - The committed pin-mechanism test (DEC-20260820-32bf19 F-2(2) precondition) in tests/test_harness.py: md5_collision_pair kind on known-false objects through the production path, plus pin distinctness with real and aliased registries.
      - The RFC 1321 primary text, acquired under the network policy and filed under the batch inputs with its sha256 recorded (the ONLY specification input the runs may use).
      - The search instrument harness/run_md5_calib.py: a standalone MD5 (written from the RFC 1321 text, not imported from hashlib) plus a BOUNDED differential/MTM collision-path search with a declared search strategy, deterministic seed, and cost instrumentation.
      - The BLIND TARGET RUN against standard MD5: pre-dispatch gate re-verified at dispatch, closed hash-manifested input set (RFC 1321 text + declared budget + seed), wall clock ceiling 900 s, memory 4 GB, 1 run, charged via run_wrapped wrapper-measured wall_seconds (BCP-2 charging_convention; cost = ceiling on halt).
      - The NULL-OBJECT RUN against the BCP-2 null variant, IDENTICAL instrument, IDENTICAL encoding (adapted only for the variant constants), IDENTICAL ceiling/seed/memory: the 64 round constants T[i] cyclically shifted by 16 (T'[i] = T[(i+16) mod 64]); all other structure (schedule word order, rotations, IV, Merkle-Damgard chaining, step count) identical. Runs SEQUENTIALLY after the target (same machine state, no concurrent-load distortion of the wall-clock comparison).
      - Interpretation strictly through BCP-2's decision table (R1-R6) with the named tolerance TOL = 2 and the named baseline (target run's own wall_seconds; ceiling if it halts there), and the evidence-record requirement (confound_caveat REQUIRED for any REDISCOVERY-eligible success; record invalid without it, INV-10).
      - Two concurrent independent reviews under the pre-committed plan (red team on the frozen run package; validator on run integrity and certificate/firewall), then the isolated ledger archive.
    out_of_scope:
      - The MD4 lower control and the method-ceiling audit: still BINDING per the goal head — the preimage ceiling audit opens only after this instrument has a calibration verdict, OPENS WITH MD4 AND NOT MD5, and belongs to a later batch.
      - Any BCP supersession (no BCP-3 in this batch); DEC-20260820-32bf19 F-3's documentation-string correction (IMPL-3 runtime_type) is carried in the batch-3 dispatch record (the runner's probe output is authoritative) and the next BCP supersession.
      - Any cost-model transfer to SHA-2 or any other primitive; any assertion about the existence or non-existence of MD5 collision paths (SC-2/SC-4).
      - Re-running either search run; the two runs are the batch's observation.

