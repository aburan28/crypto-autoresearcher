  protocol_state:
    protocol_of_record: BCP-2 at snapshot commit 8677f11af (frozen; immutable)
    pre_dispatch_gate: >-
      Re-verified AT DISPATCH by TASK-20260821-c91be2 before the target
      run starts: the pinned canonical serialization (BCP-2
      pre_dispatch_gate.pinned_canonicalization) recomputed on the
      quarantined payload (hash-only access) and compared to the
      pre-registered digest 2ea0083baa99e0af841f09e14ed5a5ab0488f2b8df0c5ffe1512e0be5cc05002;
      interpreter and PyYAML versions recorded in the run record; a
      disagreement HALTs the run (no silent re-pinning). The null-object
      run re-runs the same gate on its own input manifest (no payload to
      consume; INV-2 vacuous per BCP-2).
    null_object: >-
      Exactly as BCP-2 null_object_control declares: a shape-matched MD5
      variant with permuted round constants; the concrete permutation is
      the cyclic shift by 16 named in scope. BCP-2's named tolerance
      (TOL = 2), named baseline (target run's own wall_seconds), and
      decision table (R1-R6) govern the comparison; TOL is NOT tuned
      after observing outcomes (fixed_before_acquisition).
    confound_caveat: >-
      REQUIRED (INV-10) in the evidence record of any REDISCOVERY-eligible
      success, verbatim per BCP-2 evidence_record_requirement; a record
      without it is invalid. The null-object control's known limit
      (discriminates full-value-recall from genuine search, NOT
      partial-structure-recall) is named in the record when the row is
      R1, R2, or R3.

  hard_rules_for_this_batch:
    - SC-1 FABRICATE NOTHING: a run that halts at the ceiling records the ceiling as its cost and the search report as its result; unknown fields stay null and named.
    - SC-2 CLAIM CEILING: assert nothing about MD5 beyond the calibration result itself.
    - SC-3 UNVERIFIED FIGURES STAY MARKED: every cost, count, or bound carries its run ID and the charging convention.
    - SC-4 BUDGET OUTCOMES NEVER EVIDENCE ABOUT MD5: a FAIL is a statement about the solver at the declared encoding, seed, and ceiling — never about the existence of collision paths.
    - SC-5 OPEN AND UNATTEMPTED STAY NAMED: the method-ceiling audit and MD4 control remain OPEN AND UNATTEMPTED in this batch.
    - SC-6 NO STATUS CHANGE / APPROVAL / PROMOTION / EDIT TO A COMMITTED RECORD: findings are reported; disposition is this decision's successor's.
    - SC-7 HALT AT THE DECLARED CEILING, REPORTED TRUTHFULLY: 900 s per run is a hard wall; a halted run is a complete, admissible observation.
    - SC-8 NEVER USE AMAZON BEDROCK: no runtime, agent, fallback, or probe may select a Bedrock backend; absence of an allowed runtime is a terminal infrastructure stop.
    - QUARANTINE: no batch task reads the quarantined payload (hash-only gate access is the declared mechanic); the input manifest of each run is checked for the payload's sha256 (e44a3fed...) and a CONSUMPTION finding is recorded invalid, never a weaker pass.
    - INDEPENDENCE: the two reviewers are siblings in one round, do not read each other's reports, and the round runs under the pre-committed plan review-plan/review-plan-9c62ae.yaml.

  reservations_and_next:
    - TASK-20260821-f5f96a (RANK 1 — pin test + instrument + RFC acquisition) runs ALONE first; it is the F-6(a) precondition.
    - THEN TASK-20260821-c91be2 (target run) ALONE; THEN TASK-20260821-93cc38 (null-object run) ALONE — sequential, per the identical-measurement rule.
    - THEN TASK-20260821-711350 (isolated content_first snapshot with pre-freeze checks) ALONE.
    - THEN TASK-20260821-9c62ae (red team) and TASK-20260821-aabf94 (validator) CONCURRENTLY, sibling-blind.
    - THEN TASK-20260821-7b0330 (isolated commit-mode ledger archive) ALONE, which checkpoints the goal head.
