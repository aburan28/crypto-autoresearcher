    envelope_note: >-
      The goal's campaign envelope was declared at 10800 s total. Batches 1
      and 2 declared 3300 s and 2880 s (6180 s combined); batch 3 declares
      4720 s, bringing the cumulative declared total to 10900 s — 0.9%
      above the original plan, the delta being the in-loop review cost
      (two independent xhigh reviews per batch) under-planned in the
      original envelope. Batches 4-7 re-declare against the remainder at
      their openings with the same justification requirement. This
      re-declaration is recorded here, not silent.
    run_basics:
      seed_policy: >-
        Deterministic seed 0 (0x0) for every stochastic element of the
        solver (fragment sampling, table ordering); the seed is a declared
        input of both runs and appears in both run records.
      encoding: >-
        Messages as 512-bit blocks, hex-encoded (64 hex chars per block);
        the collision target is equality of the full 128-bit MD5 digest of
        the two full messages. The certificate kind md5_collision_pair
        (harness/runner.py, committed at 8677f11af) is the ONLY acceptance
        path: verified:true requires m1 != m2 and all four pinned-pair
        digests equal.
      charging_convention: BCP-2 charging_convention — wrapper-measured wall_seconds via run_wrapped; caller-supplied timing not trusted for new runs; cost = the 900 s ceiling if the run halts there.

