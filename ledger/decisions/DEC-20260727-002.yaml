coordinator_decision:
  id: DEC-20260727-002
  context: >-
    GOAL-ECDLP-001 stands paused with 7 batch_checkpoints against a declared
    campaign_budget.maximum_batches of 6, and with two ruled-but-unrepaired defects.
    ESC-20260727-001 section A ruled that origin/main's EXP-GGM-001 archive is not a
    valid official state transition: no approval record exists (the specification is
    still status review_required with approved_by null) and no AGENTS.md rule-12
    independent review preceded a claimed closure at exponent 1/2. Section C ruled that
    H-GGM-001 should read specified and that this requires its own superseding decision
    rather than a hand-edit; that decision has not been written, so the hypothesis record
    reads supported while ledger/goals/GOAL-ECDLP-001.yaml's BATCH-006 claim_boundary
    says it stays specified. DEC-20260727-001's single next_action is precisely that
    missing decision, and section F item 1 names an independent rule-12 review of main's
    execution - by a session that did not author the ruling - as the highest-value open
    item in the program. Separately, Report 94
    (research/idea_generation_20260727_claude.md, 63 candidates, ZERO constructive
    survivors) leaves 15 never-refuted candidates, all Group-D barriers, of which
    BAR-PATHDYN-CONDTAIL-D2 is the only one whose survival would move a live gate
    (RT-1476-SUBRES-A1) and which costs no experiment compute. This decision extends the
    campaign batch budget by two and opens BATCH-009 to do exactly that work.
  decision: expand
  target_ids:
    - GOAL-ECDLP-001
    - BATCH-009
    - TASK-20260727-002
    - TASK-20260727-003
    - TASK-20260727-004
    - TASK-20260727-005
    - TASK-20260727-006
  rationale:
    - >-
      BUDGET, STATED EXPLICITLY. campaign_budget.maximum_batches is extended from 6 to
      8. This is an extension, not an overrun, and it is recorded before any work is
      dispatched rather than discovered afterwards. Seven batches are already consumed
      (BATCH-001 through BATCH-006 plus BATCH-008), so a declared maximum of 6 was
      already exceeded by one before this decision existed; that is a defect in the
      record and it is named here rather than passed over. Setting the maximum to 8
      makes the declared budget consistent with what has actually been consumed and
      admits exactly one further batch, BATCH-009. No ninth batch is authorized by this
      decision.
    - >-
      HOW THE SEVENTH CHECKPOINT AROSE IS NOT ESTABLISHED. The BATCH-008 checkpoint
      carries TASK-20260719-043/044/045 and ledger_commit 6db269d0b2e0c8a6f7d4c0fcf4fbf9fcb0e55e8a,
      i.e. task ids and a commit from 2026-07-19, which is earlier than BATCH-006's
      close-out on 2026-07-26 that recorded the six-batch budget exhausted. No committed
      record inspected while opening this batch explains how that entry came to sit
      after BATCH-006 in the list. No explanation is invented. The fact is recorded as an
      open bookkeeping question for the goal record's owner.
    - >-
      THE WALL-CLOCK BUDGET IS NOT EXTENDED AND IS NOT AUDITABLE.
      campaign_budget.total_wall_clock_seconds stays 28800. It also cannot be
      reconciled: BATCH-005 has no coordination directory, no batch record, no queue and
      no elapsed-time entry, so the campaign tally is unreconstructible. BATCH-009 is
      therefore bounded independently at 9600 seconds across its five cards, and the
      campaign wall-clock figure is treated as unverifiable rather than as satisfied.
    - >-
      WHY THIS WORK AND NOT MORE EXPERIMENTS. Both producer tasks are paper analysis of
      already-committed artifacts and neither runs any computation. The user has directed
      continuous work on this goal; the cheapest honest work available is not another
      toy experiment but the review debt and the ledger contradiction the campaign has
      already accumulated. A program that keeps generating claims faster than it reviews
      them does not get closer to a result, and this campaign has now produced two
      consecutive batches whose headline criterion could not fail.
    - >-
      WHY THE REVIEWER MUST NOT BE THE RULING'S AUTHOR. ESC-20260727-001 states its own
      horn argument is "a derivation-level argument offered for independent checking, not
      a theorem", lists four ways it could be wrong, and asks for a non-originating
      reviewer. Accepting a Coordinator's verdict because a Coordinator wrote it is the
      same failure the ruling found in main's archive, with the sign reversed.
      TASK-20260727-002 therefore requires independence from the execution AND from the
      ruling, at review-breakthrough / max under AGENTS.md rule 12, with an explicit stop
      rather than a degraded verdict if that floor cannot be resolved.
    - >-
      WHY BAR-PATHDYN-CONDTAIL-D2. It is unrefuted only because Report 94 capped
      adversarial refutation at the first six candidates per family, not because it
      withstood attack; the report marks it status unrefuted-not-endorsed and says so.
      It is the single unrefuted candidate whose outcome would move a live gate, it
      attacks the sole argument that has kept RT-1476-SUBRES-A1 alive for 29+ runs, and
      it can be attacked on paper. Both possible outcomes are informative and neither is
      a result about ECDLP.
    - >-
      NOTHING IN THIS BATCH IS AN ATTACK IMPROVEMENT. No experiment runs, no execution is
      authorized, no crypto-scale claim is available, and the narrowest honest objective
      is stated in the batch record: reduce two named uncertainties and write one ruled
      transition. This decision is not evidence for or against ECDLP hardness,
      prime-field ECDLP, index calculus, generic-group simulability, or KN-OPEN-001.
    - >-
      EXECUTION OF EXP-GGM-001 VERSION 1 IS NOT AUTHORIZED BY THIS DECISION OR BY ANY
      TASK IT OPENS. The specification remains status review_required with approved_by
      null, and RT-20260726-001 OBJ-02 remains a standing blocking objection against
      approving or executing version 1.
    - >-
      A NEW DEFECT IS RECORDED, NOT REPAIRED. Eighteen files at the branch tip carry
      unresolved Git conflict markers, including knowledge/INDEX.md (two mutually
      exclusive tables, one declaring 128 entries and one 7638),
      knowledge/findings/KN-FIND-001.md and KN-FIND-002.md, five ledger/decisions
      records and ten ledger/handoffs records. The identifier KN-FIND-002 is claimed by
      two different findings - "Rare-event density gates are settled exactly by fibering
      over solutions" and main's GGM closure finding - which is an ID collision of the
      same class ESC-20260727-001 section D adjudicated for DEC-20260726-007. Repairing
      it needs its own Coordinator decision on which record keeps each ID; a blind
      resolution would silently pick a side in eleven records. It does not block
      BATCH-009 because none of the reviewed artifacts is among the conflicted files, but
      knowledge/ is excluded from every write scope in this batch for that reason.
    - >-
      THE GOAL RECORD IS NOT EDITED BY THIS DECISION. GOAL-ECDLP-001 stays paused, its
      recorded maximum_batches still reads 6, its current_batch_id still reads BATCH-008,
      and its single next_action still points at the co-driver's BATCH-008 scoped-revision
      work. Extending a budget is authorized by a decision; applying it to the operational
      anchor is a goal checkpoint, which templates/research-records.md restricts to a
      Coordinator ledger archive. TASK-20260727-006 performs it, reconciling against the
      goal record's then-current committed content rather than against a copy read today,
      so a concurrent co-driver's next_action is not clobbered from stale state.
  evidence_refs: []
  evidence_note: >-
    Deliberately empty. This decision reviews no evidence and rests on none. It is a
    budget and coordination action. EV-GGM-001, EV-ECDLP-007, REV-20260726-005,
    RT-20260726-001 and ESC-20260727-001 are the subject matter of the tasks this
    decision opens; none of them is adjudicated here.
  limitations:
    - >-
      No hypothesis, experiment, evidence, knowledge or goal STATUS is changed by this
      decision. H-GGM-001 still reads supported, EXP-GGM-001 still reads review_required
      with approved_by null, and GOAL-ECDLP-001 still reads paused.
    - >-
      For the duration of BATCH-009 the goal record understates the authorized batch
      budget (6 recorded versus 8 authorized) and points at BATCH-008 rather than
      BATCH-009. This interim inconsistency is deliberate, is recorded here, and is
      remedied by TASK-20260727-006. It is named so that a reader who finds the mismatch
      knows it was chosen, not missed.
    - >-
      The pause condition that stopped this campaign (pause_conditions item 1, six-batch
      budget exhausted) no longer has a factual basis once the budget reads 8, but
      removing the ground for a pause is not the same as resuming. Whether
      GOAL-ECDLP-001 returns to active is decided at the BATCH-009 close on what the two
      producers actually return, and is assigned to TASK-20260727-006.
    - >-
      GOAL-ECDLP-001 cannot be moved to completed by this batch under any outcome.
      AGENTS.md rule 13 requires three CONCUR attestations with pairwise-distinct
      resolved_model_id; none has been obtained and none may be recorded that was not.
    - >-
      The BATCH-004 ledger archive card TASK-20260726-004 remains blocked at 7 of 8
      post-commit checks on message_contains_task_id, in published history that must not
      be rewritten. No waiver is granted here.
    - >-
      This authoring session has no shell and no clock. It computed no SHA-256, made no
      commit, and staged nothing. Commit identity, parentage and every hash binding for
      the batch-opening archive must be computed and verified by the executing session;
      until that verifier accepts the commit, nothing in BATCH-009 is durable.
    - >-
      TASK-20260727-001 is reserved by ESC-20260727-001 section E for the 9-run
      provenance audit and is deliberately NOT reused. It is not dispatched in this batch
      and is recommended as the first item of the next one.
  next_actions:
    - >-
      Dispatch TASK-20260727-002 and TASK-20260727-003 concurrently (max_concurrent 2)
      in two separate non-originating independent sessions, neither of which authored
      ESC-20260727-001, origin/main's EXP-GGM-001 execution, or H-GGM-001; then run
      TASK-20260727-004 alone, then TASK-20260727-005, then TASK-20260727-006 alone.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is not an evidence-review decision. It reviews no run set, produces no durable
      research claim, and changes no hypothesis status. Opening a batch and extending a
      batch budget is coordination, not a finding about ECDLP. Separately, knowledge/ is
      currently unwritable on this branch: knowledge/INDEX.md and two KN-FIND entries
      carry unresolved Git conflict markers and KN-FIND-002 is claimed by two different
      findings, so no promotion or index regeneration may occur until that is repaired by
      its own decision.
  decided_by: coordinator
  decided_at: "2026-07-27"
  decided_at_precision: >-
    Date only. This authoring session has no clock access and does not fabricate a
    wall-clock time. The committing session may record the exact commit time in the
    archive receipt.
