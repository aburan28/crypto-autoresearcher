coordinator_decision:
  id: DEC-20260727-002
  context: >-
    Batch execution of the design-experiment skill (lifecycle steps 3-5) over all
    fourteen open proposals in ledger/proposals/. Each proposal was converted to a
    specified hypothesis and a complete frozen experiment contract; every contract
    passed the design gate (all required fields non-null, success criterion decidable
    from predefined metrics, falsification criterion reachable by an actual run,
    controls load-bearing, claim_tier honest). The user confirmed batch approval at
    the skill's step-4 gate on 2026-07-27.
  decision: approve
  target_ids:
    - EXP-MTIC-001
    - H-MTIC-001
    - EXP-ENDO-001
    - H-ENDO-001
    - EXP-FIB-001
    - H-FIB-001
    - EXP-DTREE-001
    - H-DTREE-001
    - EXP-CREP-001
    - H-CREP-001
    - EXP-SCR-001
    - H-SCR-001
    - EXP-SCR-002
    - H-SCR-002
    - EXP-SCR-003
    - H-SCR-003
    - EXP-HZM-001
    - H-HZM-001
    - EXP-SEMAEV-002
    - H-SEMAEV-002
    - EXP-PMA4-001
    - H-PMA4-001
    - EXP-MLKEM-007
    - H-MLKEM-007
    - EXP-MLKEM-008
    - H-MLKEM-008
    - EXP-SSI-001
    - H-SSI-001
  rationale:
    - Each contract carries inputs, controls, independent variables, primary/secondary
      metrics, seeds and replication plan, concrete budget with per-stage wall-clock
      and stop rules, stopping and invalidation rules, decidable success and
      falsification criteria, and required artifacts; none left a required field null.
    - Heuristic-conditioning designs (FIB, DTREE, SSI, MLKEM pair, HZM, MTIC, ENDO)
      state numbered heuristics with falsification conditions; heuristic-validation
      designs carry pre-registered predictions fixed before any run.
    - EXP-SSI-001 follows the cost-model pattern: measured vs modeled separation,
      optimistic assumptions flagged with bias direction, memory accounting with
      peak_rss reconciliation, F_p2 vs F_p regime split, standardized parameter sets.
    - The three SCR screens declare synthetic must-pass calibration fixtures as
      instrument soundness checks only, excluded from corpus tables.
  evidence_refs: []
  limitations:
    - All contracts are claim_tier toy (EXP-MLKEM-008: laboratory_implementation_conformance);
      no contract may support a crypto-scale conclusion.
    - EXP-MLKEM-008 requires a physical protected Cortex-M4 trace rig; without one its
      stage-0 preflight terminates failed_infrastructure with zero evidence value.
    - GOAL-MLKEM-001 is closed_at_budget and GOAL-CRYPTO-001 is paused; dispatch against
      those goals requires a goal-state repair before execution.
    - RQ-ECDLP-001 (bound by H-FIB-001) is not in GOAL-ECDLP-001's question_ids; a goal
      binding amendment is owed at the next ledger commit touching that goal.
    - EXP-SSI-001's Delfs-Galbraith memory profile is unresolved in the corpus; the
      frozen two-case formula (F5a/F5b) means the F_p regime may terminate inconclusive.
  next_actions:
    - Snapshot archival commits TASK-20260727-901..905 over the exact design paths.
    - Executor dispatch of TASK-20260727-001..014 only after the snapshot receipts verify.
    - Goal-state repair for GOAL-MLKEM-001 / GOAL-CRYPTO-001 before those experiments run.
  knowledge_promotion:
    promoted: []
    not_warranted: design-stage approval; no experiment evidence reviewed
  decided_by: coordinator
  decided_at: '2026-07-27'
