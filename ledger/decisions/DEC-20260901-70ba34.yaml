      snapshot receipt) re-confirm it remains unopened. A routed round that
      nobody opens is indistinguishable, in the corpus, from a defect nobody
      found - which is the failure mode the routing existed to prevent.
    - >-
      The tier is not discretionary. Both subject records are marked
      authoritative and they disagree in committed text, which is the
      contradicts_prior_evidence trigger of routing_rules
      unrecoverable-result-review, and AGENTS.md rule 12 sends that class to
      review-breakthrough at max with degradation forbidden. Setting the tier by
      first guessing whether the contradiction is real would let the expected
      answer choose the scrutiny, which is backwards.
    - >-
      Opening is not adjudicating, and this decision is careful to be only the
      former. The three defects are verified here only as TEXT - the sentences
      exist and say what they were reported to say - and every mathematical view
      this session formed is quarantined in coordinator_prior, labelled as a
      prior, with its weakness declared, including the fact that P-3 is
      correlated with a composition judgement I myself made in DEC-20260831-a9716f
      and should be discounted for that reason.
    - >-
      Immutability is bound before anything can propose to touch these files, not
      after. The check found that KN-FIND-002 is named in the binding fields of a
      COMPLETED ledger archive (TASK-20260724-236 - declared_paths, path_sha256
      f91c41cf..., record_ids), so under AGENTS.md rule 15 a remap is forbidden
      and, because CLAUDE.md binds archive receipts to CONTENT first, an edit
      would permanently invalidate that archive. The screen found no such binding
      for KN-FIND-b7e091 but is stated as a floor, not a proof, since its own
      BATCH-060 archive directory is not present in this worktree. Either way the
      output shape is fixed - a NEW record under a NEW identifier.
    - >-
      A null result is pre-declared as legitimate so that it cannot later be
      re-read as failure. The likeliest honest outcome is that two different
      oracle interfaces share one name and both records stand, and a round whose
      only acceptable outcome is a retraction is not a review. The symmetric
      guard is also stated - an inconclusive round is not permission to adopt the
      Coordinator's preferred reading.
    - >-
      The corpus-integrity finding is recorded NOW rather than at the round's
      end, because the contested status is already true and downstream sessions
      are reading these records today. It is stated with its boundary attached -
      a bookkeeping defect is not mathematical counterevidence, and nothing here
