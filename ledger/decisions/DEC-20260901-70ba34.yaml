coordinator_decision:
  id: DEC-20260901-70ba34
  recorded_at: '2026-09-01'

  decision: approve
  decision_enum_note: >-
    The template enum for a coordinator_decision is approve, revise, replicate,
    expand, support, weaken, reject_scoped, pause or supersede. What this
    decision does is AUTHORISE AND OPEN a review round at a named policy tier,
    with a named question, named joints, named tasks and a pre-recorded prior.
    Of the available tokens, approve is the one that means authorise; no other
    token is closer and none is invented. Nothing about either subject record is
    approved, supported, weakened, rejected or superseded by this decision, and
    the label below states that in words so the enum token cannot be misread.
  decision_label: >-
    open_review_breakthrough_round_on_the_KNFIND002_KNFINDb7e091_oracle_defects_CC1_CC2_CC3_no_adjudication_no_edit_new_superseding_record_only

  target_ids:
    - GOAL-ECDLP-001
    - KN-FIND-002
    - KN-FIND-b7e091
    - EV-ECDLP-048824
    - DEC-20260831-a9716f

  context: >-
    DEC-20260831-a9716f, in its routed_separately_not_this_lane block, recorded
    three defects in prior COMMITTED knowledge records - CC-1, CC-2 and CC-3 on
    EV-ECDLP-048824, together with validator finding F-5 - and ruled that they
    must be handled in a SEPARATE round running at review-breakthrough, max
    effort, degradable false, independent session, per AGENTS.md rule 12 and the
    orchestration/model-policies.yaml routing_rules entry
    unrecoverable-result-review. That block states in terms that the round is
    NOT OPENED BY THIS DECISION, that it requires its own Coordinator opening
    decision with its own prior written before any reviewer runs, and that until
    it runs both records stand exactly as committed. It was queued as Q-2 and
    left undispatched. DEC-20260901-255ebd and the TASK-20260901-362726 snapshot
    receipt both re-confirm, later, that the objections remain routed to an
    UNOPENED review-breakthrough round and are not acted on. Nobody has opened
    it. THIS DECISION OPENS IT, and does nothing else - it adjudicates none of
    the three defects, edits neither record, and moves no hypothesis,
    experiment, question, goal or knowledge status anywhere.

  defects_verified_by_this_session_against_the_files:
    method: >-
      Every quotation below was read by this Coordinator session directly from
      the working tree at the paths named, not taken from the dispatching
      instruction, from DEC-20260831-a9716f, or from either reviewer report. The
      crypto-kb MCP retrieval server is bound to a :memory: URL over an empty
      index; it was NOT called and its silence is not read as evidence in any
      direction. Screening was by direct file reading and by ripgrep over the
      committed tree.
    what_verification_means_here: >-
      Verified means the quoted sentence EXISTS VERBATIM at the stated location
      and the two records say what CC-1, CC-2 and CC-3 report them as saying.
      It does NOT mean this session has adjudicated which reading is correct.
      Every mathematical judgement about the defects appears below only under
      coordinator_prior, explicitly labelled as a prior for the reviewers to
      attack, never as a finding of this decision.
    items:
      - id: CC-1
        verified: true
        where:
          - 'knowledge/findings/KN-FIND-002.md, body item 4, under the heading SIMULABLE with non-constant overhead (NOT closed at 1/2)'
          - 'knowledge/findings/KN-FIND-b7e091.md, body item 1, under the heading Finding'
        quoted_from_KN_FIND_002: >-
          Incidence oracle (O(B^m)) - decompositions are found by brute-force
          summing m-subsets of the factor base, costing O(B^m) group operations.
          For fixed B, m this is constant, but B grows with problem size. Not
          closed at 1/2 by the constant-overhead bound.
        quoted_from_KN_FIND_b7e091: >-
          Incidence oracle (Oracle C) - An oracle reporting which factor-base
          subsets sum to the target Q. This is simulable in O(m) group
          operations per query - the oracle output is determined by group
          operations and equality tests alone.
        authority_confirmed: >-
          KN-FIND-002 front matter reads status established, confidence strong,
          internal_refs EV-GGM-001 and DEC-20260726-007 and EXP-GGM-001.
          KN-FIND-b7e091 front matter reads confidence proved, evidence_level
          theorem_backed, source_refs BATCH-060 and EV-GGM-79e710 and
          DEC-20260804-3b4258, and its title and tags carry the token closed.
          Its Implication section reads - These oracle classes are CLOSED at
          exponent 1/2. Both are therefore marked authoritative, as CC-1 states.
      - id: CC-2
        verified: true
        where: 'knowledge/findings/KN-FIND-b7e091.md, body item 2, the sentence spanning lines 26 to 28 of the file as committed'
        quoted_verbatim: >-
          Endomorphism images oracle (Oracle D) - An oracle returning phi(G),
          phi(Q) for any endomorphism phi of E. For prime-order prime-field
          curves with End_{F_p}(E) = Z, every phi = [m], so phi(Q) = [m]Q is
          computable in m group operations from Q alone.
        additional_provenance_found_by_this_session: >-
          The same premise and the same cost figure appear one level upstream in
          the evidence record the finding rests on. ledger/evidence/EV-GGM-79e710
          observation O-3 reads - Oracle D (endomorphism images) - SIMULABLE. For
          prime-order prime-field curves with End_{F_p}(E) = Z, every
          endomorphism acts as scalar multiplication [m]. So the defect, if it is
          one, is inherited from the evidence record and is not a transcription
          slip introduced at promotion time. The round must therefore examine
          EV-GGM-79e710 and DEC-20260804-3b4258, not KN-FIND-b7e091 alone.
      - id: CC-3
        verified: true
        where: 'knowledge/findings/KN-FIND-002.md, the heading of body items 1 and 2, set against its own Scope and limitations section'
        quoted_heading: >-
          SIMULABLE with O(1) overhead (closed at exponent 1/2 by KN-TECH-005)
        quoted_scope_block: >-
          The classification uses the structured GGM (curve equation is public),
          not the strictest Shoup GGM (opaque labels). Under the strictest GGM,
          jet and endomorphism would be NON-SIMULABLE because they require
          coordinate access.
        additional_provenance_found_by_this_session: >-
          The same pairing is present in the evidence record. EV-GGM-001 states
          in its inference that jet and endomorphism are simulable with O(1)
          overhead, closing their candidate families at exponent 1/2 by theorem
          (KN-TECH-005), and states in its own boundaries that the
          classification uses the structured GGM and that under the strictest
          GGM jet and endomorphism would be NON-SIMULABLE. Its
          unresolved_confounds add that the O(1) overhead for jet and
          endomorphism depends on the structured GGM assumption. So on CC-3 the
          question is not whether the model parameter was disclosed - it was,
          twice - but whether the exponent-1/2 closure sentence is licensed by a
          simulability argument conducted in that model. That is a question about
          what a committed record supports, and it is what the round must answer.

  archive_binding_check_before_anything_touches_these_identifiers:
    why_run: >-
      AGENTS.md rule 15. An identifier remap is a last resort, not a repair, and
      renaming a record that a COMPLETED archive names in its binding fields
      breaks that archive permanently. The check is run BEFORE the round opens
      so that no task card can propose a remap in ignorance.
    KN_FIND_002:
      bound_in_a_completed_archive: true
      archive: 'coordination/goals/GOAL-ICLIFT-001/batches/BATCH-001/archives/TASK-20260724-236/ledger-receipt.json'
      binding_fields_hit:
        - 'declared_paths contains knowledge/findings/KN-FIND-002.md'
        - 'path_sha256 binds knowledge/findings/KN-FIND-002.md to f91c41cf6b407f87e175078364f5d52a5890865f5197a7bc2b97182dd78e43ad'
        - 'record_ids contains KN-FIND-002'
      consequence: >-
        A remap of KN-FIND-002 is FORBIDDEN outright. An EDIT to the file is
        additionally fatal to that archive on its own terms - CLAUDE.md states
        that archive receipts bind to CONTENT first and that a content mismatch
        is fatal, and this receipt carries commit_sha null with parent_sha
        ae5503dc288efe74f23a870c59d5870c5f779d72, so its validity rests entirely
        on the declared hash matching the tree. Changing one byte of
        KN-FIND-002.md permanently invalidates TASK-20260724-236.
    KN_FIND_b7e091:
      bound_in_a_completed_archive: not_found_by_this_screen
      screen_performed: >-
        Ripgrep over the whole working tree for the identifier and for the exact
        path string, restricted to archive receipt files, and over
        ledger/handoffs for artifact_paths and write_scope entries. Every hit
        found was a READ scope, a dispatch-queue read_scope entry, a report body,
        or a citation - specifically the inputs list of eight handoffs
        (TASK-20260811-029a6c, TASK-20260811-c439c2, TASK-20260811-845cc4,
        TASK-20260811-f58f22, TASK-20260811-6d56a7, TASK-20260811-5ff234,
        TASK-20260811-6ca12c, TASK-20260825-10a615) and prose fields of receipts
        under the two B71-IDEA436 proposal namespaces. No archive receipt names
        it in record_ids and none names its path in path_sha256 or
        declared_paths.
      this_screen_is_a_floor_not_a_proof: >-
        The record's own source_refs name BATCH-060, whose archive directory does
        not exist in this worktree, so an archive that binds it may exist outside
        what this session can read. State the screen as a floor. Independently of
        the screen, AGENTS.md rule 4 makes the record immutable, and at least
        eleven committed decisions cite it (DEC-20260901-255ebd,
        DEC-20260831-a9716f, DEC-20260810-d70ece, DEC-20260810-a4bec4,
        DEC-20260810-95a741, DEC-20260810-5aeeaa, DEC-20260810-56db2d,
        DEC-20260808-e75211, DEC-20260807-4261e3, DEC-20260807-1538f8,
        DEC-20260804-98a4a4), so a remap would break those citations regardless.
      consequence: 'Remap forbidden. Supersede only.'
    procedural_question_this_check_exposes_and_does_not_resolve: >-
      The /curate-knowledge convention marks a retired entry by writing
      superseded_by into its front matter. On KN-FIND-002 that is an EDIT to a
      file whose content hash is bound by the completed archive
      TASK-20260724-236, so performing it would create the exact fatal content
      mismatch described above. This decision therefore sets the round's default
      to DO NOT TOUCH EITHER FILE - supersession is expressed by the new record
      naming the old ones, and by the derived index, not by editing them. If the
      corpus convention is judged to require the superseded_by edit anyway, that
      is a standing conflict between two committed rules and it needs its own
      Coordinator decision or a user ruling; it MUST NOT be resolved inside this
      round, and a reviewer or archivist who finds themselves about to edit
      either file has left the round's scope.

  round_opened_by_this_decision:
    round_id_note: >-
      No BATCH identifier is minted here. The dispatching session mints one with
      tools/allocate_id.py --next batch, confirms it with --check, and records it
      in the lane it opens. This decision names the round by its subject and by
      this decision id, not by an identifier it has not allocated.
    recommended_namespace: >-
      coordination/goals/GOAL-ECDLP-001/proposals/B72-KNFIND-ORACLE-CONTRADICTION-20260901-70ba34/
      The dispatching session may substitute another namespace provided the
      review plan, every task write_scope and every archive receipt use one
      consistent namespace.
    policy_required:
      policy: review-breakthrough
      reasoning_effort: max
      degradable: false
      fallback_allowed: false
      independent_session: true
      reviewer_must_not_be_originating_agent: true
    routing_rule_and_why_it_fires:
      rule: 'orchestration/model-policies.yaml routing_rules, id unrecoverable-result-review'
      trigger_clause: 'contradicts_prior_evidence: true'
      why: >-
        CC-1 sets two records that are BOTH marked authoritative against each
        other on the cost and closure status of an oracle they both call the
        incidence oracle - KN-FIND-002 at status established and confidence
        strong, KN-FIND-b7e091 at confidence proved and evidence_level
        theorem_backed. CC-2 asserts that the stated justification of a closure
        carried at evidence_level theorem_backed rests on a false premise. Both
        are, on their face, contradictions of prior validated evidence, which is
        precisely the class AGENTS.md rule 12 sends to review-breakthrough at max
        with no possibility of degradation. Whether the CC-1 contradiction is
        real or dissolves into two interfaces sharing a name is the round's
        QUESTION and cannot be the round's entry condition - deciding the tier by
        pre-judging the answer is how a contradiction gets reviewed at the tier
        that suits the reviewer's expectation. The tier is set by the shape of
        the claim as recorded, and as recorded it is a contradiction.
      what_did_not_fire: >-
        DEC-20260831-a9716f recorded that the escalation condition on the
        producer question OFQ-1 DID NOT FIRE for the ECDLP-IDEA-436 gate round,
        both reviewers having assessed OFQ-1 as a scoping observation. That
        determination stands and is not reopened. It concerned a different
        subject - whether the gate round itself had to be re-run - and it is the
        same decision that routed CC-1, CC-2 and CC-3 here.
    degradation_stop_condition: >-
      review-breakthrough carries a FLOOR of max and degradable false. If the
      resolved backend cannot reach max, the round STOPS and reports an
      infrastructure stop; it does not run at review-adversarial, does not run
      with degraded_allowed, and no inference_amendment can authorise it. A stop
      of that kind is infrastructure signal and is never mathematical
      counterevidence about either record, in either direction.

  the_rounds_question:
    one_line: >-
      Do KN-FIND-002 and KN-FIND-b7e091 contradict each other on the incidence
      oracle or merely give one name to two different oracle interfaces, what are
      the correct premise and the correct per-query cost for the
      endomorphism-image oracle closure recorded in KN-FIND-b7e091, and what
      claim tier does a structured-GGM simulability argument actually license for
      the jet and endomorphism oracles recorded in KN-FIND-002 as closed at
      exponent 1/2 - with every answer recorded ONLY in new superseding records.
    sub_questions:
      - id: Q1
        source: CC-1
        question: >-
          Which reading governs the incidence oracle. Specifically - does
          KN-FIND-002's O(B^m) figure and KN-FIND-b7e091's O(m) figure describe
          the SAME oracle interface, in which case one of them is wrong and the
          round must say which and why; or do they describe DIFFERENT interfaces
          sharing the name incidence oracle, in which case neither is wrong, both
          stand, and each sentence must be explicitly scoped to its interface in
          a new record. If the second, the round must additionally state whether
          KN-FIND-b7e091 is internally consistent, since its own prose names an
          oracle REPORTING WHICH subsets sum to Q while its cost figure is O(m)
          per query.
      - id: Q2
        source: 'CC-2, and validator finding F-5 on the adjacent constant-overhead question'
        question: >-
          What is the correct justification and the correct cost for the
          endomorphism-image oracle whose closure KN-FIND-b7e091 records. Is the
          premise End_{F_p}(E) = Z true of any elliptic curve over a finite
          field; is m group operations the right cost for computing [m]Q; does
          the CONCLUSION - Oracle D simulable, hence no route past the generic
          bound - survive under a corrected argument, at what per-query cost, and
          under what inputs the simulator must be GIVEN rather than compute; and
          does the same question apply to EV-GGM-79e710 observation O-3 and to
          DEC-20260804-3b4258, which carry the same premise upstream.
      - id: Q3
        source: 'CC-3, raised as OBJ-3 by TASK-20260831-62019a'
        question: >-
          What tier is supportable for the jet (C=1) and endomorphism (C=0)
          oracles that KN-FIND-002 records as closed at exponent 1/2 by
          KN-TECH-005, given that the same record and EV-GGM-001 both declare the
          structured GGM as the model and both state that under the strictest
          Shoup GGM those two oracles would be NON-simulable. Is the closure
          sentence licensed, is it licensed only in a relative sense, or is it
          licensed on some other ground the records do not foreground.
    what_the_round_may_not_do:
      - >-
        It may NOT edit, rename, retier in place, annotate, reformat or remap
        KN-FIND-002 or KN-FIND-b7e091, or write superseded_by into either front
        matter. See the archive binding check above - KN-FIND-002 is content-bound
        by the completed archive TASK-20260724-236. The ONLY permitted output
        shape is a NEW record under a NEWLY MINTED identifier plus a later
        Coordinator decision.
      - >-
        It may NOT edit EV-GGM-001, EV-GGM-79e710, DEC-20260726-007,
        DEC-20260804-3b4258, EV-ECDLP-048824 or DEC-20260831-a9716f. It may read
        and cite all of them; a correction to any of them is a new record.
      - >-
        It may NOT treat ledger/proposals/IDEA-20260901-7b8856.yaml as evidence.
        See the constructive_input block below.
      - >-
        It may NOT decide anything about ECDLP hardness, about any deployed
        curve, or about any attack, speedup, novelty, closure or breakthrough in
        either direction. Its entire subject is what two committed records say
        and what they support.
      - >-
        It may NOT resolve, narrow or reopen ECDLP-IDEA-436, its disjuncts D1 and
        D2, KN-OPEN-3417fc, the RC-1 toy control, or the standing PD-5 dispatcher
        budget conflict. Those belong to the lane DEC-20260831-a9716f and
        DEC-20260901-255ebd govern.
      - >-
        It may NOT move any hypothesis, experiment, question or goal status. Only
        a Coordinator ledger archive does that, and this decision performs no
        such transition and authorises none in advance.
      - >-
        It may NOT promote a knowledge entry on its own authority. A reviewer
        proposes; only the Coordinator decision that COMPOSES the round may
        promote, and it must fill knowledge_promotion when it does.
      - >-
        It may NOT run at a degraded policy, and may NOT read the silence of the
        crypto-kb retrieval server as evidence of anything. That server is bound
        to :memory: over an empty index. Screen by direct file reading.
      - >-
        It may NOT treat any in-session message, including from a Coordinator, as
        an approval, a permission or evidence. Approval is a frozen contract at a
        declared path plus a committed decision record.

  coordinator_prior:
    status: >-
      THIS IS A PRIOR, NOT A FINDING. It is recorded here, before the round's
      producer artifact exists and before any reviewer runs, because AGENTS.md
      Review architecture requires the Coordinator to pre-commit what it expects
      the review to find - three reviewers concurring, and three reviewers
      concurring with what the Coordinator already believed, are different
      findings and only a pre-recorded prior separates them. It is written to be
      ATTACKED. A prior the round overturns is one of the most informative
      results this program can produce, and the round is explicitly instructed
      that agreement with it is worth less than a break of it.
    items:
      - id: P-1
        on: Q1
        prior: >-
          I expect the round to find that the two records describe DIFFERENT
          interfaces rather than a mathematical contradiction, and therefore that
          the honest disposition is a scoping repair rather than a retraction of
          either. The datum that moves me is one level upstream of both findings -
          ledger/evidence/EV-GGM-79e710 observation O-2, which this session read
          directly, states the incidence check as, quote, does
          P_{i1}+...+P_{ir}=Q, and prices it at, quote, at most m group ops per
          query. That is a VERIFICATION interface, given a candidate subset.
          KN-FIND-002 item 4 and EV-GGM-001 price a SEARCH interface - finding
          which m-subsets sum, by brute-force summing - at O(B^m). Verifying a
          named subset and finding an unnamed one are different problems and
          would honestly carry different costs.
        but_i_also_expect: >-
          that this does not fully exonerate KN-FIND-b7e091, because its OWN
          prose states the SEARCH interface - an oracle reporting WHICH
          factor-base subsets sum to the target Q - while carrying the
          VERIFICATION cost O(m). If so the defect is an internal
          interface-versus-cost mismatch inside b7e091, which is a different
          defect from the one CC-1 names and would need its own scoped statement.
        declared_weakness_of_this_prior: >-
          I have NOT opened experiments/EXP-GGM-001/simulability_test.py,
          experiments/EXP-GGM-001/analysis.md, or the BATCH-060 TASK-20260804-051
          artifacts. Which interface the machine-checkable classifier ACTUALLY
          implemented is the single most decisive fact for Q1 and I do not know
          it. My prior is formed from record prose alone and should be discounted
          accordingly.
      - id: P-2
        on: Q2
        prior: >-
          I expect the round to confirm that the quoted premise is false as
          written, and that the quoted cost is wrong on its own terms. Frobenius
          is an F_p-rational endomorphism of degree p, multiplication by m has
          degree m squared, and a prime is not a perfect square, so no elliptic
          curve over a finite field has End_{F_p}(E) equal to Z; and [m]Q costs
          O(log m) group operations by double-and-add, not m. I further expect
          the CONCLUSION to survive on a corrected argument, because every
          F_p-rational endomorphism acts on a prime-order subgroup as a scalar.
        but_i_also_expect: >-
          that survival may be CONDITIONAL on an input. The filed proposal
          IDEA-20260901-7b8856 argues that the scalar is computable in O(log p)
          only when the simulator is GIVEN the conductor level f_E, and that the
          level is not obtainable from inside the subgroup at any cost. If that
          is right, then whether Oracle D is simulable depends on what the
          simulator is handed, and a repaired sentence must say so. The round
          must not accept survival by assertion, and must state the simulator's
          inputs explicitly.
        declared_weakness_of_this_prior: >-
          The degree argument I state is elementary and I am confident in it, but
          confidence from the chair is exactly what this round exists to test.
          Nothing in this decision may be cited as having established it. I have
          also not opened KN-TECH-005 in this session; my reading of what it
          bounds comes from DEC-20260831-a9716f quoting two reviewers who did
          open it, which is one remove from the source.
      - id: P-3
        on: Q3
        prior: >-
          I expect the round to find that the sentence closed at exponent 1/2 by
          KN-TECH-005 overstates what a structured-GGM simulability argument
          licenses for the jet and endomorphism oracles, and that the supportable
          statement is narrower - relative to the structured model, or founded on
          some ground other than the Shoup bound.
        declared_weakness_of_this_prior: >-
          This is the strongest weakness in this whole block and it is declared
          rather than buried. I have ALREADY made a closely adjacent composition
          judgement once, in DEC-20260831-a9716f, where I judged OFQ-1 and OBJ-3
          to be different observations and routed OBJ-3 here. My prior on Q3 is
          therefore correlated with my own earlier decision and is not
          independent evidence about anything. The round should treat P-3 as a
          hypothesis to break, and a reviewer that finds P-3 congenial should
          suspect the correlation before the argument.
      - id: P-4
        on: 'the round as a whole'
        prior: >-
          Composite expectation, recorded so it can be scored - a NULL result on
          contradiction (two interfaces, both records stand, correctly scoped),
          combined with a REAL justification defect in KN-FIND-b7e091 inherited
          from EV-GGM-79e710, and a REAL tier question on KN-FIND-002. Net
          disposition - the corpus needs a disambiguating superseding record, not
          a retraction. If the round returns exactly this, that is a weak result
          because it is what I already believed; if it returns anything else,
          that is the informative outcome.

  joints_and_named_tasks:
    note_on_authority: >-
      These are NAMED, not dispatched. This decision creates NO handoff record,
      launches no subagent, and confers no authority on anyone. A dispatching
      session builds the queue from this block, mints every TASK identifier with
      tools/allocate_id.py --next task --date 20260901 confirmed by --check,
      writes each handoff with its own budget and completion gate, and claims
      each Ready task with tools/goal_lanes.py claim before launching it. A task
      that exists only in this decision has not been assigned to anyone.
    joints:
      - id: J1
        joint: >-
          Whether KN-FIND-002 item 4 and KN-FIND-b7e091 item 1 quantify over the
          same oracle interface, and whether their cost figures are consistent
          under the reading that governs. Load-bearing because if they are the
          same interface, one authoritative record is wrong.
        assigned_to: 'T-3 (validator-breakthrough) - exactly one owner'
        attack_plan: >-
          Do not argue from record prose. Open
          experiments/EXP-GGM-001/simulability_test.py and
          experiments/EXP-GGM-001/analysis.md and read which interface the
          machine-checkable classifier implemented, then open EV-GGM-001 and
          EV-GGM-79e710 and read what each evidence record priced. Then state, as
          a table, the interface, the input, the output and the per-query cost
          for each of the two sentences. Where I expect this to break - I expect
          the interfaces to differ and the contradiction to dissolve; the way to
          break that is to find that the classifier implemented ONE interface and
          that both records were written about that one, in which case the O(B^m)
          and O(m) figures cannot both stand and the round has a genuine
          contradiction on its hands.
        breaking_artifact: >-
          Either an explicit statement of two distinct interfaces with their
          costs, each tied to the text that uses it; or a demonstration that one
          interface is at issue and a counting argument showing which cost figure
          is wrong.
      - id: J2
        joint: >-
          Whether the premise End_{F_p}(E) = Z and the cost m group operations
          can carry the Oracle D closure recorded in KN-FIND-b7e091 and, upstream,
          in EV-GGM-79e710 O-3, and what the repaired statement and its inputs
          are. Load-bearing because the closure is recorded at evidence_level
          theorem_backed.
        assigned_to: 'T-4 (red-team-breakthrough) - exactly one owner'
        attack_plan: >-
          Attack the premise on degrees first, then attack the REPAIR rather than
          the premise, because the repair is where the round can still go wrong.
          Specifically - grant that every F_p-rational endomorphism acts as a
          scalar on a prime-order subgroup, then ask what the simulator must be
          GIVEN to know that scalar, and price the case where it is not given.
          IDEA-20260901-7b8856 claims the scalar is (1-A)*f_E*f^{-1} mod N and
          costs O(log p) GIVEN the level, and separately claims the level is
