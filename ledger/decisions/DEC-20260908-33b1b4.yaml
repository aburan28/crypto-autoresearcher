  recorded_at: '2026-09-08'
  decided_at: '2026-09-08'
  decided_by: coordinator
  task_id: TASK-20260908-5f236e
  context: >-
    The v2.4 red-team report broke the prospective canonical-locator claim at
    two registry-level constructions. Preserve that finding, add the narrowly
    scoped v2.5 repair, and pre-register one new blinded joint review.
  decision: revise
  target_ids: [GOAL-SDEG-001, H-ECDLP-004445, EXP-ECDLP-ac7e8b, TASK-20260908-0a9470]
  evidence_refs:
    - coordination/design/BATCH-c2a2b6/hardening-v2/reviews/TASK-20260908-0a9470/review.yaml
    - ledger/corrections/CORR-20260908-fbd218.yaml
  rationale:
    - >-
      A full-entry byte hash is not a semantic uniqueness test unless the
      source defines which fields and values determine the physical object.
    - >-
      A stage registry cannot prevent a non-summed publication fork without a
      canonical schedule-node key and one-to-one resolver to the frozen finite
      schedule.
    - >-
      The v2.5 amendment addresses only these two source-definition defects;
      it needs a fresh independent attack before any authority changes.
  prior_vs_actual:
    prior: >-
      V2.4 appeared to close display-level aliasing, but the Coordinator
      expected a review to challenge registry-entry semantics separately.
    actual: >-
      Direct display alias controls held, while free schema metadata and an
      undefined schedule-node resolver created distinct accepted entry hashes
      for the same physical object.
    consequence: >-
      Keep the review-required state and advance only an additive v2.5
      source-repair and independent review.
