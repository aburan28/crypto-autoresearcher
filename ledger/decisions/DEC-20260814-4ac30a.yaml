coordinator_decision:
  id: DEC-20260814-4ac30a

  context: >-
    BATCH-3b9962 of GOAL-MLKEM-005 dispatched its first real-BKZ lead producer
    (TASK-20260814-ffd791) against PREREG-8, the frozen, notarized protocol for
    H-MLKEM-7d9bcc/EXP-MLKEM-42ea04 (notarized alone, zero producer artifacts, at commit
    cf9520cf5507dff126632e2598fc90e689e996c2 by TASK-20260814-518949; snapshot-committed at
    dc61fe376a7108b4dd58110f856db5c7589cde86 by TASK-20260814-cb26de). The lead ran PREREG-8
    section 1 (infrastructure re-verification: all three checks PASS) and section 2 (Stage 0
    feasibility benchmark): 0 of 6 main-grid (d,beta) cells reached a completed BKZ reduction,
    every cell failing identically with fpylll.util.ReductionError('infinite loop in babai')
    well inside the 3600s cap. TWO INDEPENDENT REVIEWS RETURNED: Validator TASK-20260814-a94ddf
    (VAL-20260814-a94ddf), verdict `passed`, which independently reproduced the observation
    bit-for-bit at the seed level and substantially extended the producer's own bounded
    root-cause diagnostic (API choice, precision, dimension boundary); and Red Team
    TASK-20260814-fe02ff (RT-20260814-fe02ff), which does not challenge the termination branch
    but built a live counterexample showing the isolated LLL-preprocessing step IS
    precision-fixable once GSO.ROW_EXPO is dropped, directly contradicting the producer's own
    "not resolved by the one precision setting tested" characterization. THE TWO REVIEWS'
    RESPECTIVE FINDINGS ON MPFR-FIXABILITY LOOKED, READ AT FACE VALUE, LIKE A DIRECT FACTUAL
    CONFLICT. The orchestrating session performed its own direct adjudication
    (coordination/.../archives/TASK-20260814-87a572/adjudication/ADJUDICATION.md, three live
    test scripts against the same fpylll install both reviews used) and found BOTH REVIEWS
    CORRECT ABOUT THE EXACT CONSTRUCTION EACH ONE TESTED -- the discrepancy traces to the
    GSO.ROW_EXPO flag, which is decisive only at the full-BKZ-tour level, not at the isolated
    LLL-preprocessing-step level both reviews' own precision tests actually exercised. This
    decision rests on that reconciled understanding, not either review's finding read in
    isolation. CLAIM TIER TOY, UNCONDITIONALLY: nothing here bears on ML-KEM security, any
    FIPS 203 parameter set, any attack cost, or any cost model.

  decision: revise

  decision_note: >-
    `revise` is the ACTION: the evidence record is committed with the reconciled root-cause
    account, EXP-MLKEM-42ea04's own construction is identified as needing a specific,
    named fix before any further Stage-0 attempt, and the successor's single next action is
    specified as a NEW, separately-scoped follow-up task -- and it is NOT a verdict on C1 or
    C2. NOTHING IS `support`ed, `weaken`ed OR `reject_scoped` HERE: PREREG-8 section 4.3 item
    1's own FORBIDS clause bars any C1/C2 statement at the affected scope when
    T-PROJNOISE-NODATA fires, and this decision honours that bar in full -- no falsification,
    no confirmation, and no hypothesis status change. `approve` (of EXP-MLKEM-42ea04) is
    explicitly declined, not deferred by accident: approving it now would authorize spending
    against PREREG-8 section 6's own worst-case budget (2,073,600s) on a construction now known
    to fail Stage 0 outright, when a concrete, cheaper, already-identified fix exists and has
    not yet been tried as an official measurement. `pause` is unavailable: GOAL-MLKEM-005's
    pause_conditions are infrastructure-only (a broken archive, an unpushable repository, an
    unresolvable `review-breakthrough` backend) plus a user request, none of which applies
    here, and an infrastructure-limited result is explicitly listed in the goal's own
    non_terminal_conditions. THIS BATCH CLOSES, PAUSES, AND COMPLETES NOTHING.

  target_ids:
  - GOAL-MLKEM-005
  - BATCH-3b9962
  - TASK-20260814-ffd791
  - TASK-20260814-cb26de
  - TASK-20260814-a94ddf
  - TASK-20260814-fe02ff
  - EV-MLKEM-ef0261
  - H-MLKEM-7d9bcc
  - EXP-MLKEM-42ea04

  # ==================================================================
  # 1. VALIDITY BEFORE INTERPRETATION
  # ==================================================================
  run_set_validity:
    ruling: >-
      THE RUN SET IS VALID AND ADMISSIBLE for exactly what it reports: an infrastructure/Stage-0
      feasibility measurement that reached ZERO completed main-grid reductions. It is NOT, and
      is not treated as, evidence for or against C1 or C2 -- no cell cleared Stage 0, so no C1/C2
      adjudication is possible or claimed anywhere in the committed artifacts.
    expected_run_count: >-
      ONE lead producer task, two internally-declared runs (RUN-MLKEM-STAGE0-INFRA-1,
      RUN-MLKEM-STAGE0-FEASIBILITY-1), both completed_valid within budget (~3471s of a 25200s
      cap). Both independent reviews confirm no Stage-1 work, no NULL-1/2/3/SENS control, and no
      >=2^20 target generation occurred anywhere.
    schema_complete_manifests: >-
      CONFIRMED BY THE VALIDATOR (notarization chain checked in both directions with git
      plumbing; every one of TASK-20260814-ffd791's 12 declared artifacts hash-verified) AND
      INDEPENDENTLY BY THE RED TEAM (its own "chain-of-custody" section, same git plumbing,
      same result). Durable command.txt/stdout.log/stderr.log/environment.json/run_manifest.yaml
      all present; the two artifacts genuinely written as write_scope outputs but not on the
      original aspirational list (run_start_utc.txt, run_end_utc.txt) were caught and the
      declared set correctly extended by the prior snapshot archive (TASK-20260814-cb26de).
    seed_integrity: >-
      CONFIRMED BY BOTH REVIEWS INDEPENDENTLY. SEED_ROOT=715923 and the full
      default_rng([SEED_ROOT, stage_index, d, beta, arm_index, draw_index]) formula reproduce
      bit-identical seed values (e.g. seed_used=1398073216 at d=256/beta=40) across the
      producer, the Validator, the Red Team, and the orchestrating session's own adjudication
      scripts -- four independent recomputations of the same formula, all agreeing.
    raw_summary_agreement: >-
      CONFIRMED, WITH THE ONE MATERIAL CORRECTION THIS DECISION EXISTS TO RECORD: the ERROR
      outcome itself (0/6 cells, identical exception, wall-clock figures) is reproduced exactly
      by both reviews. The producer's own SUMMARY/CHARACTERIZATION of WHY ("a genuine,
      unfixable incompatibility ... not resolved by the one precision setting tested") is NOT
      fully supported by the raw evidence once both reviews' own probes are reconciled -- see
      root_cause_ruling below. This is a correction of a CHARACTERIZATION, not of any measured
      figure; every number in stage0_results.json is unaffected and unchallenged.
    control_comparability: >-
      NOT APPLICABLE. PREREG-8 section 2.2-2.3 scopes Stage 0 to feasibility timing only, no
      statistical or distributional claim; both reviews independently confirm this scope was
      honoured (Validator CTRL-2, explicitly checked and ruled N/A rather than skipped).
    infrastructure_separation: >-
      The 0/6 main-grid ERROR outcome is a THIRD category, distinct from both a
      PER_BASIS_FEASIBILITY_CAP timeout and a completed reduction -- recorded explicitly as
      such (DEV-3, severity high, "this IS the result") by the producer and confirmed by both
      reviews as genuine infrastructure signal under AGENTS.md rule 5, never a negative
      mathematical result about C1 or C2.

  # ==================================================================
  # 2. THE TERMINATION BRANCH, AND WHAT IT LICENSES/FORBIDS
  # ==================================================================
  termination_branch:
    branch: T-PROJNOISE-NODATA, fires for the WHOLE package.
    firing_confirmed_by: >-
      TASK-20260814-ffd791's own writeup (section 2.3), the Validator (CTRL-1, independently
      re-derived from PREREG-8's own frozen text), the Red Team (narrowest_supported_statement,
      "does not challenge it"), and this Coordinator's own independent re-reading of PREREG-8
      sections 2.3 and 4.3 item 1 -- FOUR independent readings, all in agreement.
    means: >-
      This attempt did not produce usable data at the affected scope (the whole package), for
      a reason OTHER than H-MLKEM-7d9bcc's own content -- an fpylll/fplll-internal exception
      unrelated to whether C1 or C2 is true.
    licenses: >-
      Citing Stage 0's own cell-by-cell benchmark results (the ERROR outcome and its exact
      exception at every main-grid cell; the toy-floor sweep's completed/NOT_COMPUTED results
      and selected d=12) as a standalone, reportable infrastructure-timing deliverable
      (R-PN-OUT-1). Nothing else.
    forbids: >-
      Any statement about C1 or C2's truth, in either direction, at any of the 6 cells. This
      decision makes none, and confirms neither the producer, nor either review, nor
      EV-MLKEM-ef0261 makes one anywhere.

  # ==================================================================
  # 3. ROOT-CAUSE RULING -- THE MOST CONSEQUENTIAL ITEM IN THIS BATCH
  # ==================================================================
  root_cause_ruling: >-
    THE PRODUCER'S OWN ROOT-CAUSE CHARACTERIZATION IS PARTIALLY CORRECTED BY THE RECONCILED
    REVIEW EVIDENCE, AND THIS MUST BE STATED WITH ITS FULL PRECISION, NOT SOFTENED. Two
    distinct claims must be kept separate, exactly as the reconciled evidence separates them:
    (1) THE ISOLATED LLL-PREPROCESSING STEP IS GENUINELY, DEMONSTRABLY PRECISION-FIXABLE. The
    Red Team's probe5 constructs an explicit, correctly-configured GSO.Mat(A,
    float_type="mpfr"), FPLLL.set_precision(212) called first, WITH NO GSO.ROW_EXPO flag, and
    passes it directly into BKZReduction on the exact (d=256, beta=40, seed=1398073216)
    instance -- the internal LLL step that fails under the producer's own default construction
    SUCCEEDS in 0.0038s. This is confirmed independently by the orchestrating session's own
    adjudicate_precision.py and adjudicate_wrapping.py (both ROW_EXPO settings succeed at the
    isolated-LLL and wrapped-lll_obj levels, ~0.004s each). The producer's own out-of-band
    mpfr diagnostic almost certainly tested the SAME under-precise (53-bit, i.e.
    double-equivalent) construction it thought it was raising past, per the Validator's own
    ART-6 finding (fpylll's default precision IS 53 bits, identical to double, unless
    explicitly raised via FPLLL.set_precision -- the producer's disclosed diagnostic gives no
    indication of having called it).
    (2) BUT THE ACTUAL CONSTRUCTION stage0_feasibility.py's OWN worker_main_cell() USES --
    handing a raw IntegerMatrix to BKZReduction, which builds its own internal GSO.Mat(A,
    flags=GSO.ROW_EXPO) at double precision internally, per bkz.py's own __init__ -- IS NOT
    FIXED BY PRECISION ALONE, CONFIRMED CORRECT FOR THAT SPECIFIC, ACTUALLY-RELEVANT
    CONSTRUCTION BY THREE SEPARATE SESSIONS NOW: the producer's own bounded diagnostic, the
    Validator's own explicit mpfr-at-212-and-424-bits-WITH-ROW_EXPO full-tour test (ART-6, both
    fail identically), and the orchestrating session's own direct reproduction
    (adjudicate_full_tour.py, ROW_EXPO=True: fails in 0.282s with the identical exception,
    exactly reproducing the Validator's own finding). The divergence between the two reviews'
    apparently-contradictory reports is explained EXACTLY: it occurs at the full bkz(par,
    tracer=True) TOUR level, not at LLL preprocessing, where both ROW_EXPO settings succeed
    identically. The Red Team's own construction (mpfr, no ROW_EXPO) does NOT hit the immediate
    exception at the full-tour level either, but it ALSO does not complete within any bound
    tested so far (100s here; 684s in the Red Team's own probe6) -- so it is not, on this
    evidence, "the fix," it is "an avoidance of the immediate exception with an unmeasured,
    apparently large real cost" (see cost_ruling below).
    WHAT THIS MEANS FOR THE PRODUCER'S OWN STATEMENT, VERBATIM QUOTED SO THE CORRECTION IS
    PRECISE: "a genuine, unfixable incompatibility between this host's fpylll 0.6.4/fplll build
    and BKZ's own internal LLL preprocessing ... not resolved by the one alternative precision
    setting that could be tested to a definite result" IS CORRECT FOR THE EXACT CONSTRUCTION
    stage0_feasibility.py ACTUALLY RUNS (ROW_EXPO-on), AND THIS RECORD DOES NOT WEAKEN THAT
    PART OF IT. It IS INCORRECT AS A GENERAL CLAIM ABOUT fpylll/fplll's OWN CAPABILITY: an
    ordinary, already-available fpylll construction change (explicit mpfr GSO.Mat, no
    GSO.ROW_EXPO) demonstrably avoids the immediate exception at the isolated-LLL-preprocessing
    level, on the exact same failing instance. The producer's own consequent follow-up
    recommendation ("the blocking question ... is a genuine infrastructure root-cause
    investigation ... filing/checking this exact exception against the fpylll/fplll upstream
    issue tracker ... testing an entirely different fpylll/fplll build or version") IS
    THEREFORE NOT THE CHEAPEST NEXT STEP and is not adopted by this decision -- see
    next_actions.

  cost_ruling: >-
    EVEN THE CORRECTED CONSTRUCTION HAS NOT BEEN MEASURED TO A COMPLETED FULL-BKZ-TOUR RESULT
    BY ANYONE -- not the producer, not the Validator, not the Red Team, not this Coordinator's
    own adjudication. Every attempt at the corrected (mpfr, no-ROW_EXPO) full-tour construction
    has been TIME-BOUNDED AND TERMINATED BEFORE COMPLETION: the orchestrating session's own
    adjudicate_full_tour.py at ROW_EXPO=False did not finish or error within a 100s bound; the
    Red Team's own probe6 ran ~684s of steady single-core CPU before being manually terminated;
    a companion attempt at the cheaper d=224 (probe2) did not complete within a 120s exploratory
    bound. None of this is a fabricated timing -- each is disclosed as an honest, manual early
    stop in its own source artifact. The real per-cell cost under the fix REMAINS UNKNOWN, and
    the preliminary evidence available (>100s-684s and counting, versus the double-precision
    failure's own 70.2s-to-error at the same cell) is CONSISTENT WITH a materially larger real
    cost than PREREG-8 section 6.2's own double-precision-based estimate ("well under a minute
    to on the order of an hour"). NO STAGE-1 SIZING DECISION MAY TREAT THE FIX AS FREE.

  # ==================================================================
  # 4. STAGE 1 IS NOT AUTHORIZED OR SIZED BY THIS DECISION
  # ==================================================================
  stage_1_authorization_ruling: >-
    PREREG-8's own Stage 1 (the full >=8-draw measurement grid) IS NOT AUTHORIZED, SIZED, OR
    IMPLICITLY LICENSED BY ANYTHING IN THIS DECISION. Section 2.3's own decision rule is
    unambiguous: T-PROJNOISE-NODATA firing for the whole package means Stage 1 does not run at
    all, on the construction actually tested. Nor does the reconciled root-cause finding change
    this -- the corrected construction has not been measured to completion at ANY main-grid
    cell by anyone, so there is no cleared cell, no measured per-cell cost, and no basis
    whatsoever from which to size a Stage-1 dispatch. Any future dispatch of Stage 1 must be
    preceded by a SEPARATE, NEWLY-SCOPED follow-up (named in next_actions) that actually
    measures the corrected construction's real cost.

  # ==================================================================
  # 5. HYPOTHESIS AND EXPERIMENT STATUS, RULED EXPLICITLY
  # ==================================================================
  hypothesis_status_ruling: >-
    H-MLKEM-7d9bcc STAYS `proposed`. Reasoned, not defaulted: EXP-MLKEM-42ea04's own
    success_criterion requires "at least one (n, beta) cell clears Stage 0 and produces >= 8
    complete draws; C1 and C2 are each adjudicated per prereg.md section 4.2 at every such
    cell" before this hypothesis may advance even to `analyzed` (the success_criterion's own
    ceiling for a toy, non-exponent-targeting measurement -- never `supported` without the
    separate promotion gates CLAUDE.md's asymptotic-complexity rule requires, which do not
    apply here in any case since H-MLKEM-7d9bcc carries no asymptotic_claim). Zero cells
    cleared Stage 0 this batch. A Stage-0-only, infrastructure-outcome result -- even one whose
    root cause is now substantially better understood and partially corrected -- CANNOT
    license any movement of this hypothesis's status in either direction: T-PROJNOISE-NODATA's
    own FORBIDS clause bars exactly that. `proposed` is therefore not a default holdover but
    the ONLY status this record's evidence permits.

  experiment_approval_ruling: >-
    EXP-MLKEM-42ea04 STAYS `review_required`/`approved_by: null`. Approval is a distinct,
    explicit act (AGENTS.md rule 1) and I explicitly DECLINE to make it here, not merely defer
    it as a byproduct of archiving a Stage-0 result. Grounds: (1) the construction
    EXP-MLKEM-42ea04's own specification names (`method: BKZ.reduction, block_size = beta`) and
    the construction stage0_feasibility.py actually ran (BKZReduction from a raw IntegerMatrix,
    ROW_EXPO-on) both fail Stage 0 outright at the tested cells -- ART-5/OBJ-4 additionally show
    the spec-literal `BKZ.reduction()` free function fails EVEN MORE SEVERELY (an uncaught C++
    abort, only rescued by cysignals) on the same instance; (2) the corrected construction that
    avoids the immediate exception has not been measured to a completed cost anywhere, so no
    responsible budget for a Stage-1 dispatch can be derived; (3) approving EXP-MLKEM-42ea04
    now, unmodified, would authorize spending against its own worst-case ceiling (2,073,600s,
    per its own budget.total_cpu_hours=576 note) on a construction now demonstrated not to
    complete Stage 0 at all. A follow-up task must first fix worker_main_cell's own construction
    and re-measure before any approval is even considerable.

  # ==================================================================
  # 6. REVIEW RECONCILIATION -- CARRIED FROM EV-MLKEM-ef0261, RESTATED HERE
  # ==================================================================
  review_reconciliation_summary: >-
    BOTH REVIEWS AGREED: the termination branch fires correctly and was not challenged by
    either; the Stage-0/toy-floor caps were applied exactly as PREREG-8 section 6.3 specifies;
    no scope violation occurred (no Stage 1, no NULL controls, no hypothesis/experiment status
    change); SEED_ROOT=715923 was genuinely used. BOTH REVIEWS APPEARED TO DISAGREE, BEFORE
    ADJUDICATION, ON WHETHER EXPLICIT MPFR PRECISION FIXES THE FAILURE -- recorded here as a
    genuine disagreement that arose and was then reconciled (root_cause_ruling above), per
    AGENTS.md's requirement that real disagreement be recorded, not silently smoothed over,
    even where it later proves reconcilable rather than an irreducible conflict. A SECOND
    DISCREPANCY WAS FOUND WHILE DRAFTING EV-MLKEM-ef0261 AND HAS SINCE BEEN RESOLVED: the two
    reviews' own dimension-sweep boundaries for the default (double, ROW_EXPO-on) construction
    at beta=10 appeared not to match (Validator: d<=184 works/d>=192 fails; Red Team: d=192
    works/d=224 fails). This is now RECONCILED, not merely disclosed as unresolved: the
    orchestrating session's own follow-up adjudication (ADJUDICATION.md's "Second
    reconciliation" section, `adjudicate_d192.py`) compared the two probes' own source code and
    found they measure DIFFERENT OPERATIONS -- Red Team's `probe4_dimension_scan.py` tests only
    the isolated LLL step (no `BKZ.Param`, no tour); the Validator's `probe_dimension_sweep.py`
    tests the full native BKZ tour (`BKZ.reduction(A, par)`, real block enumeration at
    beta=10). Direct adjudication at d=192, the exact disputed point, using each review's own
    exact construction, confirms both: Red Team's isolated-LLL construction COMPLETES at d=192
    (0.0061s); the Validator's full-tour construction FAILS at d=192 (6.65s, `RuntimeError:
    Aborted`, the same underlying condition). THERE ARE PROPERLY TWO DISTINCT BOUNDARIES, NOT
    ONE CONTESTED ONE: an isolated-LLL-step boundary (Red Team's own d=192/d=224) and a
    separate, lower, full-tour boundary (Validator's own d<=184/d>=192). Neither review
    overstated its own finding; neither needed correction. This never affected the termination
    branch or the Stage-1 non-authorization ruling above, since both main-grid dimensions (256,
    512) are well above either reported boundary. See EV-MLKEM-ef0261.review_reconciliation for
    the full account. NOTABLY, THIS IS THE SECOND TIME IN THIS SAME BATCH THAT AN APPARENT
    VALIDATOR/RED-TEAM CONTRADICTION HAS RESOLVED TO THE IDENTICAL UNDERLYING PATTERN -- an
    isolated LLL/preprocessing-only probe being more numerically permissive than the full
    BKZ-tour operation it was being used to characterize or validate a fix against. This
    recurrence is itself weighed in knowledge_promotion below.

  # ==================================================================
  # 7. RATIONALE
  # ==================================================================
  rationale:
  - >-
    THE BATCH DID EXACTLY WHAT A STAGE-0 FEASIBILITY GATE IS FOR: it replaced PREREG-8 section
    6's own wide-uncertainty budget estimate with a real observation before any Stage-1 compute
    was spent, and the observation is a clean, reproducible infrastructure signal, not a
    fabricated or ambiguous one.
  - >-
    THE HARD CALL IS THE ROOT-CAUSE CORRECTION, AND IT IS MADE ON THE RECONCILED EVIDENCE
    RATHER THAN ON EITHER REVIEW READ ALONE. Read separately, the Validator's and Red Team's
    findings looked contradictory; the orchestrating session's own direct, live adjudication
    (not an assertion, an executed reconciliation against the same fpylll install both reviews
    used) resolved this as two correct findings about two different constructions, not a
    factual conflict. This decision states the correction with its full precision: fixable at
    the isolated-LLL level, not fixed at the full-tour level for the construction actually run,
    and unmeasured in real cost either way.
  - >-
    THE ADVERSE AND INCONVENIENT ITEMS ARE CARRIED RATHER THAN ROUNDED AWAY. The cost of the
    fix is not free and is not known. A second, unrelated discrepancy between the two reviews
    (the dimension boundary) surfaced only on careful reading and is disclosed rather than
    dropped for tidiness. Neither Stage 1 nor EXP-MLKEM-42ea04's approval is treated as a
    byproduct of a genuinely useful root-cause finding.
  - >-
    WHAT THIS BATCH IS NOT ALLOWED TO BUY, STATED SO NO LATER READER HAS TO INFER IT. It buys
    no C1/C2 finding, no ML-KEM statement, no Stage-1 authorization, no experiment approval, and
    no hypothesis-status movement. A genuinely useful diagnostic finding about WHY Stage 0
    failed is not the same thing as Stage 0 having cleared, and this decision does not conflate
    them.

  # ==================================================================
  # 8. WHAT DOES NOT CHANGE
  # ==================================================================
  binding_carries_restated_and_not_re_litigated:
  - CLAIM TIER STAYS TOY, UNCONDITIONALLY. No number here transports to any FIPS 203 parameter
    set by extrapolation, analogy, or any other route.
  - H-MLKEM-11aabf (analyzed), H-MLKEM-dc51f5, H-MLKEM-232843, H-MLKEM-34e22e (all proposed) are
    UNCHANGED by this decision.
  - PREREG-8's own frozen text is BINDING-CARRIED WITHOUT RE-LITIGATION. This decision amends
    nothing in it; a follow-up task's own construction fix is a task-level correction to
    stage0_feasibility.py's own worker_main_cell(), not a protocol amendment to PREREG-8 itself
    -- PREREG-8 section 1 point 1 already licenses "BKZ.reduction (or the equivalent BKZ2.0
    entry point the installed version exposes)" broadly enough to cover an explicitly-configured
    GSO.Mat construction without requiring a new pre-registration.
  - NO HYPOTHESIS STATUS MOVES. THE GOAL IS NOT CLOSED, PAUSED, OR COMPLETED, and an
    infrastructure-limited result may not be cited in a decision that closes it
    (non_terminal_conditions).
  - THE SPLIT-PRODUCER NOTARIZATION AND SNAPSHOT-BEFORE-REVIEW PATTERNS ARE RETAINED UNCHANGED.
    knowledge/INDEX.md must NOT be written, regenerated, or staged.

  # ==================================================================
  # 9. EVIDENCE
  # ==================================================================
  evidence_refs:
  - ledger/evidence/EV-MLKEM-ef0261.yaml
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-3b9962/reviews/TASK-20260814-a94ddf/validation_report.yaml
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-3b9962/reviews/TASK-20260814-fe02ff/red_team_report.md
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-3b9962/archives/TASK-20260814-87a572/adjudication/ADJUDICATION.md
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-3b9962/tasks/TASK-20260814-ffd791/writeup.md
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-3b9962/tasks/TASK-20260814-ffd791/run_manifest.yaml
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-3b9962/tasks/TASK-20260814-dfaa60/prereg.md
  - ledger/hypotheses/H-MLKEM-7d9bcc.yaml
  - experiments/EXP-MLKEM-42ea04/specification.yaml
  evidence_refs_note: >-
    Every number and figure quoted in this decision is attributed to the producer's own
    writeup/manifest, one of the two review reports, or ADJUDICATION.md. No measurement,
    timing, citation, or run is invented anywhere in this record. This drafting session ran no
    code and held no shell; every root-cause and cost figure above is a citation of what the
    orchestrating session's own adjudication scripts and the two reviews' own probes report,
    not a re-derivation.

  # ==================================================================
  # 10. LIMITATIONS
  # ==================================================================
  limitations:
  - CLAIM TIER TOY, UNCONDITIONALLY. Scope exactly as EV-MLKEM-ef0261.claim_tier_note states.
  - >-
    INDEPENDENCE IS PROCEDURAL, NEVER MODEL-LEVEL. AGENTS.md rule 12 is UNMET AND UNWAIVED. The
    Validator and Red Team ARE independent sessions; the reconciliation of their apparent
    disagreement was performed by the SAME orchestrating session that dispatches this archive,
    not by a fourth, independent reviewer -- disclosed explicitly, not smoothed over.
  - >-
    THE DEFAULT CONSTRUCTION'S FAILURE (beta=10) HAS TWO DISTINCT, NOW-RECONCILED DIMENSION
    BOUNDARIES, NOT ONE: an isolated-LLL-step boundary (d=192 works/d=224 fails) and a separate,
    lower, full-BKZ-tour boundary (d<=184 works/d>=192 fails) -- see
    review_reconciliation_summary above. A successor MUST name which operation a cited boundary
    describes; a bare, unqualified numeric boundary remains not admissible.
  - >-
    THE REAL PER-CELL COST OF THE CORRECTED (mpfr, no-ROW_EXPO) CONSTRUCTION IS COMPLETELY
    UNMEASURED. Every session that attempted it terminated the attempt before completion or
    error. Preliminary evidence is consistent with, but does not prove, a materially larger
    cost than PREREG-8 section 6.2's own double-precision estimate.
  - >-
    PD-4-STYLE EXPOSURE: both review reports and their probe files, plus ADJUDICATION.md and
    its own scripts, sat uncommitted across a dispatch window and are the sole carriers of
    their own evidence until this ledger archive commits them.
  - >-
    NOTHING IN THIS RECORD IS DURABLE OR OFFICIAL until the ledger archive carrying it commits,
    THE POST-COMMIT VERIFIER ACCEPTS IT -- RUN BEFORE THE PUSH, NOT AFTER -- and the branch is
    pushed with an open PR against main naming EV-MLKEM-ef0261, DEC-20260814-4ac30a, and
