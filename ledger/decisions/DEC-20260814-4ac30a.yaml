    what_the_promotion_would_say_if_minted: >-
      In fpylll (>=0.6.4), a probe that exercises only the isolated LLL/GSO-preprocessing step
      (e.g. `GSO.Mat(...)` -> `LLL.Reduction(...)` -> `lll_obj()`, with no `BKZ.Param` and no
      actual block-enumeration tour) is measurably, and non-trivially, more numerically
      permissive than the full BKZ tour (`BKZReduction.__call__` / `BKZ.reduction(A, par)` with
      real block enumeration) it is naturally reached for as a cheap stand-in when validating a
      fix or characterizing a numerical-stability boundary. On one q-ary lattice family
      (`IntegerMatrix.random(d,"qary",k=d//2,q=3329)`) at a fixed beta=10, the isolated step
      succeeds up to at least d=224 while the full tour already fails by d=192 -- confirmed
      independently at the exact disputed point (d=192) using each construction verbatim: the
      isolated-step construction completes in 0.0061s; the full-tour construction fails
      (`RuntimeError: Aborted`, the same underlying "infinite loop in babai" condition) after
      6.65s. The identical asymmetry explains, mechanistically, why an explicit-precision fix
      (dropping the internal `GSO.ROW_EXPO` flag `BKZReduction` builds by default from a raw
      `IntegerMatrix`; raising mpfr precision explicitly) that demonstrably repairs the isolated
      LLL step at d=256/beta=40 (0.0038s, versus failing under the default construction) does
      NOT, by itself, establish that the full BKZ tour under the same base construction will
      also succeed: `GSO.ROW_EXPO` is decisive only at the full-tour level (both settings
      succeed identically at the isolated-LLL/wrapped-`lll_obj()` level). GENERAL LESSON:
      validating a proposed numerical-stability fix, or characterizing a numerical-stability
      boundary, against a cheap, isolated sub-step of an iterative lattice-reduction pipeline is
      NOT evidence about the full pipeline's own behavior -- the actual, full operation must be
      tested directly before any fix or boundary claim is allowed to transfer to it. This
      recurred TWICE, independently, within one batch (once diagnosing an mpfr-fixability
      question, once diagnosing a dimension-boundary question), each time resolved only by
      reading the two probes' own exact source code and re-executing each construction directly
      -- a cheap, general diagnostic any future review can apply BEFORE trusting an isolated-step
      probe's own result as a proxy for the full operation. This is a methodological hazard, not
      a claim that fpylll is broken, not a claim about any lattice's admissibility, and carries
      NO C1/C2 or ML-KEM content of any kind. LIMITATIONS TO CARRY INTO THE ENTRY ITSELF: (i) the
      reconciliation that discovered this pattern, both times, was performed by one session (not
      independently re-reviewed by a distinct fourth party) -- AGENTS.md rule 12 is unmet and
      unwaived, as in every record of this goal; (ii) this entry makes NO claim that the
      full-tour fix (dropping ROW_EXPO, raising precision) is cheap, practical, or usable at any
      scale that matters -- its real per-cell cost remains completely unmeasured by every
      session that has attempted it, and that is a separate, still-open question this entry does
      not touch.

