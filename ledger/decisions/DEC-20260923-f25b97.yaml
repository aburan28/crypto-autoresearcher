  objection_responses:
    - id: OBJ-1
      response: >-
        ADOPTED. EV-CERTBIN-6c3e0a keeps the frozen DR-4 and DR-2 labels and
        records beside them that TS1's independence clause fails exactly (11
        repeated forms in P2; K_rank = 17 against K about 2670) and that its
        balance clause holds on 8 distinct low-weight forms. DR-4 is described
        as a threshold on n_rep, not as a statistical inconclusive.
    - id: OBJ-2
      response: >-
        ADOPTED. Neither 2.2e-13 nor 8.34e-75 is cited as evidence. The null
        is misapplied, because the zeros are forced. The record states that
        stats.binom_sf cannot resolve tails below about 1e-13, so the spec's
        extreme-hazard tail check could not report the true figure. RC-3
        binds successors.
    - id: OBJ-3
      response: >-
        ADOPTED. Subgroup targets lie on the hyperplane r_0 = Tr(A) = 0
        (measured on 1000 + 5). The record states that K_sampled undercounts
        K_exact by the a_k = e_0 pivot, that one DEP_TAU pivot per reference
        is forced to 0 on curve targets only (outside P2), and that the
        uniform-r figure 2^{-K_rank} is not the curve-target figure. The
        survival set is a single point either way (16 rank-increasing forms
        modulo tau on a 16-dimensional hull). TS1's random-model transfer
        ("curve x behaves like uniform r") therefore fails exactly in one
        direction, and this is carried into the heuristic reading.
    - id: OBJ-4
      response: >-
        ADOPTED. The record states that the 15 in-band P2 pairs are 8
        distinct (form, survivor-set) measurements. Any successor counts
        distinct pairs (RC-2).
    - id: OBJ-5
      response: >-
        ADOPTED, with the tripwire qualifier. DR-7's "T_set replay not
        closed" is recorded with NA-5's failed retention conjunct (unsat T_set
        retention 0 at D = 4): T_set-level replay does NOT meet NA-5's survival
        condition at this cell. By NA-5's text, regime B is the only remaining
        route for P-GPU, and the rerank follows (NA-2). Regime-A replay is NOT
        recorded as closed.
    - id: OBJ-6
      response: >-
        ADOPTED. DR-1's evidence sentence cites f_div (divergence at step 0 or
        1) alongside retention. O2 shows that retention alone cannot separate
        early from late divergence.
    - id: OBJ-7
      response: >-
        ADOPTED. "1 in R_4" is scoped to this cell, to the Macaulay D = 4
        closure (not F4 step degree), and to subgroup (x(2E)) targets at 0.839,
        against 0.60-0.66 off 2E and 0 in the nulls. It is written as neither
        "S_3 systems are refuted at degree 4" nor evidence for or against
        Semaev's Assumption 1.
    - id: OBJ-8
      response: >-
        ADOPTED. Overturned prior (f) is read as the branch-free penalty
        (masked full elimination costs about 35x the row XORs of
        data-dependent elimination at this cell), not as a replay gain. No
        replay design can realise it at this cell (Lemma 2). This is also why
        P8's miss weakens nothing about P-GPU beyond DR-1.
    - id: OBJ-9
      response: >-
        ADOPTED. EV-CERTBIN-6c3e0a's dominated_by adds oracle A (2^9
        root-findings per attempt) as the closest specialised per-attempt
        baseline. Every resource reading of "1 in R_4" charges against it.
    - id: OBJ-10
      response: >-
        ADOPTED, jointly with F-J2-2. C-UNIF and the independence tail check
        are determined at K_rank = n = 17 with N about 1000. Their passes are
        not cited. INV-7's protection of M2 is nominal at this cell. What
        C-UNIF was meant to check is covered by the J2 sampler regeneration
        and by K_rank from J1, J3, J4 and J6/J7.

