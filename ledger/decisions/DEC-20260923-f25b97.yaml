  rationale:
    - >-
      WHY WEAKEN RATHER THAN SUPPORT. H-CERTBIN-a73f1c names its mechanism in
      its claim: C2 is "HEUR-CERTBIN-TS1 ... retention about 2^{-K}". That
      mechanism is false at this cell by an exact derivation, and P2 and P8
      missed. The program's own precedent (DEC-20260915-fad1c1) supports
      only when "no falsification condition fired and no stated numeric
      prediction was missed", and that test fails here on the second limb.
      The corroborated direction is recorded in full, so the weakening does
      not understate what held.
    - >-
      WHY NOT REJECT_SCOPED. The direction holds. The frozen falsification
      conditions did not fire. The tripwire forbids it on one unreplicated
      run at review-adversarial.
    - >-
      REFUTATION ARTIFACT FIRST. The adverse part rests on a derivation note
      instantiated on explicit instances and independently reproduced three
      times (proof_status derivation). It is archived by snapshot
      TASK-20260923-a4d27c before TASK-20260923-918a6d commits this
      decision. The empirical parts are declared empirical_only and
      single-run.
    - >-
      RERANK (DEC-20260923-4d7a19 NA-6 / DEC-20260923-b85c30 NA-5; both
      conjuncts read):
      - strict replay: falsified at this cell (DR-1);
      - T_set replay: saving conjunct met (1.658-1.660 >= 1.5), retention
        conjunct failed (0 < 0.5).
      Per NA-5, Stage 2 (regime B, l = 6, n in {17, 19}) is the only
      remaining route for P-GPU and ranks ahead of Stage 3. Stage 3's
      regime-A n-ladder, for P-GPU, would re-measure an identity: when
      K_rank = n, fixed-schedule retention is 0 (Lemma 2), and K_rank = n
      held at every reference. It is deprioritized for P-GPU. It is revisited
      if any Stage-1 replication shows K_rank < n, or if R-1 step 2 needs
      the n = 19 cell anyway (NA-5).
    - >-
      TARGET-PROFILE HONESTY. The P-GPU lane is constant-factor with
      sota_delta zero, and parallel rho dominates. Stage 2 is ranked within
      CERTBIN and is not promoted above exponent-targeting ECC work. The
      "1 in R_4" follow-ups (RC-1, then R-1 step 2) touch the solving degree
      of summation-polynomial systems on Semaev's diagonal. That is the one
      exponent-adjacent thread this run produced, which is why it gets a
      KN-OPEN and a zero-sampling first step. It is still a pointer, not a
      cost claim.

