  limitations:
    - >-
      NOTHING IS MEASURED BY THIS DECISION. It approves a protocol; it reports
      no result and asserts nothing about whether R1-SEP10 works. A-1 -- that
      the observable actually varies with each free word -- remains an
      ASSUMPTION discharged only by the k1 = k2 = 4 gate measurement, and if
      that measurement fails the proposal is wrong and the failure is the
      batch's result.
    - >-
      The mirror-image settlement and the propagation calculus are SYMBOLIC
      derivations by two agents in this program. The review round's BLIND
      re-derivation is the third instrument and is deliberately not pre-empted.
      KN-TECH-bb7e9f is NOT edited by this decision; updating its "Open, not
      settled" section belongs to the closing task's knowledge_promotion, on
      the review round's evidence.
    - >-
      The residual limits RL-1 to RL-6 are carried forward unrepaired and are
      named in the gate decision record: the gate is not quantified over
      fixed-word seeds; direction A's repetitions buy no quantifier strength;
      reachability over-approximates dependence; the settlement is symbolic;
      HEUR-H3 is untested by design; novelty is unverified.
    - >-
      THIS COORDINATOR SESSION HAS NO SHELL. It ran no tools/allocate_id.py,
      no tools/validate_ledger.py, no test suite, and no git command, and made
      no commit. It did not verify the resolved model by
      `orchestration.adapter doctor --probe`. Nothing here is durable research
      state until the driving session's archive commit is accepted by the
      post-commit verifier and the branch is pushed to a PR against main.
    - >-
      Every conclusion this contract can reach is scoped to MD4 Round 1 as the
      control (MD5 Round 1 only under the named authorization), the declared
      bounded parameter slice, the declared seeds, this single-core
      unoptimized Python instrument, and this batch's declared budget. No
      transfer to full 48-step MD4, full 64-step MD5, SHA-2, or any literature
      complexity figure is claimed or licensed, and the literature figures
      2^96 / 2^102 / 2^116.9 / 2^123.4 remain UNVERIFIED provenance.
    - >-
      Budget figures in the frozen contract are DECLARATIONS, not
      measurements. A run reaching its ceiling halts truthfully; the halt is
      infrastructure signal, never a negative mathematical result (HR-8,
      SC-7). A FAILED two-way-dependence gate is explicitly NOT in that
      category and IS recorded as evidence.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NO KN-* ENTRY IS PROMOTED BY THIS DECISION, and the reason is concrete
      rather than procedural. This is a DISPATCH GATE, not an evidence review:
      no observation exists, no evidence record has been written, and no
      claim has reached `replicated` or `strong`. The one candidate that is
      genuinely promotable on the merits -- the separation/propagation
      calculus that converts ANOM-1 from an accident at one split point into a
      derived design law over the whole one-round family, and that settles
      KN-TECH-bb7e9f's "Open, not settled" paragraph -- is deliberately NOT
      promoted here for three reasons: (i) it currently rests on two symbolic
      derivations by agents inside this program, and the review plan
      explicitly commissions a THIRD, BLIND re-derivation of exactly this
      quantity, so promoting it now would pre-empt the instrument designed to
      check it; (ii) its `novelty_status` is unverified because kb retrieval
      was unavailable and both external references are `recalled`, so a
      technique entry would have to be scoped around that anyway; (iii)
      promotion authority for this batch's findings sits with the closing task
      TASK-20260821-6ce8a8, whose own completion gate requires it to fill
      knowledge_promotion on the evidence it actually has. THIS IS RECORDED AS
      A DEFERRAL WITH A NAMED SUCCESSOR, NOT AS A JUDGEMENT THAT THE FINDING
      IS UNWORTHY -- if the blind re-derivation agrees, a KN-TECH entry (or an
      update superseding KN-TECH-bb7e9f's unsettled section) is warranted on
      the merits and should be minted at close.
