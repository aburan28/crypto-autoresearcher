  context: >-
    BATCH-7215fa's rank-2 Coordinator gate, holding the first of the batch's
    two independent stop points. It applies the KN-TECH-080 dispatch gate and
    the roadmap-bias pairing rule to IDEA-20260821-ea35d1 (construction
    R1-SEP10) and decides whether any implementation compute is spent.
    THE GATE APPROVES. All ten checklist items G-1 to G-10 pass on the
    merits. The load-bearing symbolic derivation -- the forward and backward
    tuple-position propagation calculus, the identity d + r = j - i - 1, the
    separation threshold j - i >= 4, and the conclusion that batch 4 could
    not have been saved by any split point or component -- WAS RE-DERIVED
    INDEPENDENTLY BY THIS GATE FROM harness/run_md4_ceiling.py's source AND
    AGREES ON EVERY LOAD-BEARING STEP. The Coordinator's pre-committed prior
    P-R1 is confirmed and KN-TECH-bb7e9f's "Open, not settled" mirror-image
    paragraph is settled by two independent derivations; KN-TECH-bb7e9f is
    NOT edited by this decision.
  rationale:
    - >-
      G-5 IS THE ITEM THAT COULD HAVE STOPPED THE BATCH AND IT PASSES BY
      INVERSION. The proposal does not adopt the position-0 swap; it derives
      that the swap is inadmissible on its own at a one-step-separated split
      and changes the free words instead, to separation 10. A proposal
      adopting option (b) alone would have been a REVISE; this one settles
      the risk with an argument, and the argument is independently correct.
    - >-
      G-1's specific defect -- batch 4's audit-1 bottleneck claim (b), false
      and unchecked (red-team D1) -- is repaired the only way it can be: the
      equivalent assumption is stated EXPLICITLY as A-1, with its SOLE
      discharge named and with an explicit denial that four other controls
      discharge it. The bottleneck itself is different, and it inverts batch
      4's false design principle rather than restating it.
    - >-
      G-7 passes because the package is honest about what its own controls
      cannot do. The completeness control is genuinely non-vacuous (its naive
      side never calls backward_step, never reads the matched component, and
      never reads the matching window, unlike batch 4's), AND the proposal
      concedes that it alone would still pass vacuously against ANOM-1. The
      non-degeneracy load is carried by CTL-PO5 on the raw pre-certificate
      set, which DEMONSTRABLY CAN FAIL -- batch 4's own raw set was a full
      row and fails both of its parts -- and by the gate itself. The detector
      null control CTL-PO1 must FAIL on an object whose failure is already
      proved, which is the strongest available answer to KN-TECH-9d21c4's
      "can this null fail" line.
    - >-
      G-8's pairing rule is satisfied INSIDE this batch, not deferred: the
      HEUR-H1 validation run samples the relevant distribution at the declared
      scale, compares against the predicted Poisson with lambda fixed a
      priori, and checks tail consistency; HEUR-H1b carries its own paired
      two-outcome contrast; and the proof-of-concept implementation is the
      executor task itself.
    - >-
      G-9 authorizes the MD5 arm because RANK 1 NAMED it with exact bounded
      parameters and it is identically bounded and strictly smaller in run
      count. The changed comparison quantity is ruled admissible: R is
      declared uninformative in advance and forbidden as a finding, and the
      replacement (distributional shape) can come out two ways with a
      crediting rule fixed before any data exists. Its structural premise --
      that MD5's shifts, constants and "+= b" change values but not which
      tuple positions depend on the supplied word -- was re-derived and
      confirmed by this gate.
    - >-
      THE PROPOSAL'S OWN dominated_by ROW 1 IS NOT DISQUALIFYING. The
      decoupled construction really does dominate on the narrow object
      "recover two planted words", and this gate re-derived that dominance.
      It is irrelevant here because its match condition factorizes, so it
      exhibits no joint MITM and produces no collision distribution for
      HEUR-H1 -- it answers neither question the batch asks. Recording it
      rather than burying it strengthens the package; the dominance is
      carried forward as a binding interpretation limit on how R1-SEP10's
      ratios may be described.
    - >-
      `novelty_status: unverified` is ACCEPTED at this claim tier. Nothing in
      the package depends on novelty, no novelty claim is made, no
      supporting_result rests on a `recalled` citation, and the retrieval
      failure is reported honestly with its inference correctly refused. Three
      conditions are attached and are now binding, including a prohibition on
      any downstream record calling the derivation novel.
    - >-
      DECLARED SCALE IS JUSTIFIED, NOT MERELY STATED -- k1 + k2 - m = 8 fixes
      lambda = 256 for a usable chi-square, k1 + k2 - k = 0 fixes the expected
      non-planted full-target collision count at about 1 which is the
      observation-collision audit's own quantity, and N = 1000 fits a 300 s
      ceiling with wide margin. IT IS FROZEN AT THE PROPOSAL'S BUDGET-SAFE
      FLOOR AND NOT SCALED UPWARD; larger-scale replication is recorded as an
      explicit open direction, not a gate edit.
  actions_taken:
    - >-
      FROZE ledger/hypotheses/H-MDFIVE-0ca596.yaml -- the new hypothesis for
      R1-SEP10, with mechanism, the E/D propagation calculus, assumptions
      A-1 to A-6, all four re-run KN-TECH-080 audits, twelve proof
      obligations PO-1 to PO-12, four numbered heuristics (H1, H1b, H2, H3),
      predictions, test boundary with every parameter and all nine seeds,
      falsification conditions, and interpretation_limits capping the claim at
      `analyzed`. asymptotic_claim is null.
    - >-
      FROZE experiments/EXP-MDFIVE-a8e71e/specification.yaml -- the approved
      contract, with the exact bounded scale, every seed, per-run ceilings, a
      five-run plan totalling 1680 s inside the executor's 1800 s, ten
      controls, ten invalidation rules, seven success criteria, the
      falsification criterion, required artifacts including `caveat_refs` and
      code_path_fingerprint in the manifest output, and md5_run_authorization.
    - >-
      WROTE THE TWO-DIRECTIONAL DEPENDENCE GATE INTO THE CONTRACT AS A HARD
      TERM IN ALL THREE PLACES REQUIRED: proof obligation PO-2 in the
      hypothesis, success criterion SC-A in the experiment, and invalidation
      rule IR-1 ("any declared-scale run executed without a passing gate is
      INVALID, regardless of what it found").
    - >-
      AUTHORIZED THE MD5 ARM at identical bounds and CLOSED DEFECT-1601d6-02
      by naming, in md5_run_authorization, the three MD5-mode correctness
      computations permitted besides the search arm (F1 the H2 inversion
      fixture, F2 the T[1..16] sine self-check, F3 the MD5 gate phase) and by
      stating explicitly what MD5-mode computation is NOT authorized.
    - >-
      RECORDED TWO LOCALISED CORRECTIONS to IDEA-20260821-ea35d1 rather than
      absorbing them: CORR-A, that the "F-layer" numbers are step distances
      (the load-bearing branch-coverage property is nonetheless true and was
      verified); and CORR-B, that the predicted distinct_fiber_sets is 2 and
      not about 16 (the CRITERION >= 2 is unchanged and not weakened, and BOTH
      predictions are pre-registered and attributed).
    - >-
      SPECIFIED FOUR PARAMETERS THE PROPOSAL LEFT IMPLICIT, as contract terms
      and not as design changes: m = 12 and k = 20 at EVERY scale; the gate's
      own target and its generation; direction B's target-regeneration rule
      for its four held-fixed values; and the nine seeds.
