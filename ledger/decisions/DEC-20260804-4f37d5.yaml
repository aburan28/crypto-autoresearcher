coordinator_decision:
  id: DEC-20260804-4f37d5
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-061
  recorded_by_task: TASK-20260804-055
  archived_by: TASK-20260804-056
  context: >-
    BATCH-061 ran two parallel tracks: (A) monodromy analysis of Semaev cover (KN-OPEN-009);
    (B) exhaustive search for publicly computable non-simulable oracle (KN-OPEN-005).
    Both produced definitive theoretical results.

  decision: close_two_open_problems

  decision_scope: >-
    KN-OPEN-009 CLOSED: The monodromy group of the m-th Semaev cover is exactly C_2^{m-2}
    (universally, no exceptional locus). The factor-2 BKK improvement and the constant
    relation rate are universal across all prime-field curves. No curve family has 
    systematically higher relation rate from monodromy structure.

    KN-OPEN-005 PARTIALLY ADDRESSED: No publicly computable non-simulable oracle is
    known for non-anomalous prime-field ECDLP. All candidates (Frobenius twist: 
    simulable; p-adic height: privately computable or k mod 1 for non-anomalous;
    AGM: simulable; higher pairings: infeasible for generic k). The direction has a
    named obstruction but remains technically open (no proof that no such oracle exists;
    only exhaustion of known candidates).

    GOAL-ECDLP-001 stays active.

  target_ids:
    - GOAL-ECDLP-001
    - KN-OPEN-009
    - KN-OPEN-005
    - H-GGM-001
    - BATCH-061

  rationale:
    - >-
      Monodromy closure: The splitting field of S_m in x_1 over F_p(x_2,...,x_{m-1},c)
      has Galois group C_2^{m-2}. This is universal — the same for all non-singular
      E/F_p (p>3) and all m≥3. The imprimitivity at m≥4 mirrors the recursive resultant
      structure (already known), not a new exploitable block system. Frobenius cycle type
      on the factor-base locus = identity for ALL curves at ALL m. No exceptional locus.
    - >-
      Non-simulable oracle exhaustion: Five oracle types analyzed (Frobenius twist,
      p-adic height, Coleman, AGM, higher Weil pairing). All either simulable or 
      provide k only for anomalous (N=p) curves (Smart's attack generalization).
      The fundamental obstruction: the formal group log gives k mod gcd(N,p) = k mod 1
      = no information for non-anomalous prime-order curves.
    - >-
      The named obstruction for the non-simulable oracle direction: the formal group
      p-adic approach always reduces to Smart's attack (anomalous case only). 
      Any new oracle requires a different algebraic structure that embeds k 
      in a publicly accessible invariant — no such structure is known.

  kn_open_009_disposition: CLOSED
  kn_open_005_disposition: >-
    PARTIALLY_ADDRESSED — no publicly computable non-simulable oracle known;
    named obstruction recorded; technically open (no existence proof one way or another).

  exact_next_action: >-
    BATCH-062: Knowledge curation + fresh ideation from the full knowledge corpus.
    Specifically: (A) Promote three findings to KN-FIND: the Tate-theorem ECDLP
    scalar-domain mismatch, the Shoup-GGM incidence/endomorphism closure, and the 
    Semaev monodromy universality. (B) Search the knowledge corpus for any open
    problems or literature items related to non-algebraic or combinatorial approaches
    to prime-field ECDLP that the program has not examined (KN-OPEN-006 displacement-rank,
    KN-OPEN-008 noncommutative path algebra, KN-OPEN-010 transfer operator spectral).

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No KN-* entry was created by this decision. The record's `promoted` list held
      two placeholder ids for promotions that were OWED but never made, which made
      the record assert the opposite of the truth -- that the corpus had been
      updated. Converted under DEC-20260805-7b3e91 (RUL-9): the obligations are
      declared here, where the schema puts an unmet obligation, and every word of
      the original entries is preserved verbatim under owed_promotions below.
      Nothing was deleted.
    owed_promotions:
      - id: pending_kn_find_monodromy
        note: >-
          Semaev m-th cover monodromy = C_2^{m-2}, universal, no exceptional locus.
          Factor-2 BKK improvement is structural and constant across all curves.
      - id: pending_kn_find_oracle_obstruction
        note: >-
          No publicly computable non-simulable oracle known for non-anomalous prime-field
          ECDLP. Named obstruction: formal group log gives k mod gcd(N,p) = 0 for N≠p.
  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2
    sota_delta: {time_exponent: not_applicable, memory_exponent: not_applicable, data_or_query_exponent: not_applicable}
  claim_ceiling: theoretical
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-04'
