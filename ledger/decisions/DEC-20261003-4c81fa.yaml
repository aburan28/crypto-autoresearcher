# =============================================================================
# DEC-20261003-4c81fa -- RULING ON A WRITE-ONCE EXCEPTION raised by
# TASK-20261003-6d2f84 under DEC-20261003-e2a917 R2.
#
# ledger/decisions/DEC-20261003-4e91b7.yaml has two non-merge commits, not one.
# The first is d5575ffd52, the original ruling. The second is ff918bdc48, an
# in-place repair of three validate_ledger errors that this Coordinator made at
# the dispatching session's request. Both commits are on the PR #1771 branch,
# and both precede that PR's merge at 785b14211. The exception is ACCEPTED, on
# conditions E1 to E4 checked in 6d2f84's receipt. The in-place edit itself
# departed from "corrections supersede, never overwrite", and it is recorded in
# CORR-20261003-9a2d57.
#
# It also rules on two identifier-check readings in the same archive: task-owned
# output paths are not collisions (R4), and the two-version EXP-SEMBIN-3d9a71
# draft id is recorded, not a stop (R5).
#
# Archived in TASK-20261003-6d2f84's own commit (R3 below). Changes no status
# and approves nothing.
# =============================================================================
coordinator_decision:
  id: DEC-20261003-4c81fa
  id_provenance: >-
    Random 6-hex token chosen by hand (no shell). Greps of ledger/,
    coordination/ and knowledge/ found no occurrence. Owed on
    TASK-20261003-6d2f84: `python3 tools/allocate_id.py --check
    DEC-20261003-4c81fa` and `git grep -l 4c81fa HEAD`.
  recorded_at: '2026-10-03'
  decided_at: '2026-10-03'
  decided_by: coordinator
  archived_by: TASK-20261003-6d2f84
  goal_id: GOAL-SEMBIN-5078bc
  batch_id: null
  standing_authorization: >-
    The standing user authorization of 2026-09-06 covers archival work. This
    decision approves no experiment.

  decision: revise
  decision_label: >-
    WRITE-ONCE EXCEPTION ACCEPTED, CONDITIONALLY. DEC-20261003-4e91b7 is bound
    at its post-repair bytes (sha256 84bdaaa0...dedf25d, the only version main
    has carried). The pre-repair version stays reachable at d5575ffd52 and is
    recorded, not erased. The in-place repair is recorded as a deviation by
    CORR-20261003-9a2d57.

  context: >-
    The dispatching session reports the following for TASK-20261003-6d2f84
    Step B. Of the 13 declared records, 12 have exactly one non-merge commit.
    The exception is ledger/decisions/DEC-20261003-4e91b7.yaml. d5575ffd52
    (2026-10-03 21:05) is the original. ff918bdc48 (21:26) is the in-place fix
    of three validate_ledger errors. That fix removed EXP-SEMBIN-3d9a71 from
    target_ids, added draft_ids_ruled_on_not_in_ledger, added verified_by to
    the Hhan citation, and moved a recalled source into unread_pointers. PR
    #1771 merged at 785b14211 after both commits. The file's sha256 on main is
    84bdaaa0c970c680d950093c796a447541567c543fedcbf69c1667e62dedf25d. Every
    other Step B check passed: C1 (10, 7 and 2 files), C2 (6 of 6), C3 (19 of
    19), C4 (PASS with --plan; --batch exits 2), C6, the 655056eb0b byte check
    (3 of 3), the d815a6 file set, and a clean base sync. This Coordinator
    read the working-tree DEC-20261003-4e91b7. It carries
    draft_ids_ruled_on_not_in_ledger, the Hhan verified_by and unread_pointers,
    and no EXP-SEMBIN-3d9a71 in target_ids. That is the post-repair version,
    and it is the version DEC-20261003-e2a917 read.

  rulings:
    - id: R1
      question: Does the two-commit history of DEC-20261003-4e91b7 fail C3's purpose?
      ruling: >-
        NO, ON CONDITIONS E1 TO E4. Under R2 of DEC-20261003-e2a917, C3 exists
        to show that the bytes 6d2f84 binds are the bytes that entered main and
        were not changed afterwards. Both commits precede the merge, so main has
        only ever carried the post-repair bytes, and 6d2f84 binds exactly those.
        The decision was also never effective in either version: it said it
        was "NOT EFFECTIVE until ... TASK-20261003-6d2f84's ledger receipt
        verifies", and that has not happened. So no official transition rested
        on the first version. What the exception does show is that a committed
        ledger record was edited in place, not superseded. That is a deviation,
        and it is recorded in CORR-20261003-9a2d57. It is not re-done as a
        supersession now. A superseding DEC would make the official record a
        third text to fix a defect that is already fixed, and both texts stay
        reachable in history.
      conditions:
        - id: E1
          what: >-
            MAIN NEVER CARRIED THE FIRST VERSION. `git rev-list --first-parent
            origin/main -- ledger/decisions/DEC-20261003-4e91b7.yaml` lists
            exactly one commit, 785b14211...
        - id: E2
          what: >-
            THE BOUND BYTES ARE THE MERGED BYTES. `git show
            785b14211:ledger/decisions/DEC-20261003-4e91b7.yaml | sha256sum`
            equals 84bdaaa0c970c680d950093c796a447541567c543fedcbf69c1667e62dedf25d,
            and so does `git show ff918bdc48:<same path> | sha256sum` and the
            working-tree file.
        - id: E3
          what: >-
            THE REPAIR IS CONFINED TO THE FOUR STATED CHANGES. `git diff
            d5575ffd52 ff918bdc48 -- ledger/decisions/DEC-20261003-4e91b7.yaml`
            changes lines only inside target_ids (removal of EXP-SEMBIN-3d9a71),
            the added draft_ids_ruled_on_not_in_ledger block, citations, and
            unread_pointers. A changed line anywhere else STOPS 6d2f84 again and
            returns the diff here. That includes the header, context,
            composition, convergence, comparison_with_coordinator_prior,
            rulings, official_transitions, rationale, evidence_refs,
            limitations, procedure_deviations, knowledge_promotion,
            goal_checkpoint and next_actions. Also `git show --stat
            ff918bdc48` lists that file alone, or, if it lists others, each
            other path is outside the 13 declared records and the 19
            substituted paths.
        - id: E4
          what: >-
            BOTH VALUES RECORDED. The sha256 of `git show
            d5575ffd52:ledger/decisions/DEC-20261003-4e91b7.yaml` and the full
            diff output are written into 6d2f84's receipt
            (declared_records_write_once.exception_checks). The diff is pasted
            as a literal block.
    - id: R2
      question: Did anything read the pre-repair version, and does it matter?
      ruling: >-
        TASK-20261003-a19c53's receipt records head_commit d5575ffd52, so the
        Hhan freeze ran with the pre-repair version in its tree.
        TASK-20261003-e7058d read the branch working tree at an unrecorded
        commit. Provided E3 holds, neither is affected. The repair touches no
        ruling, and in particular not R6 (X1 to X9) or R7, which are the parts
        those two tasks execute. The Hhan citation's added verified_by restates
        what R7 already said: two scratch readings, pointer only. If E3 fails,
        this ruling is void and both tasks' reliance is re-examined.
    - id: R3
      question: >-
        Where are this decision and CORR-20261003-9a2d57 archived, given that
        DEC-20261003-e2a917 R2 fixes 6d2f84's commit to its receipt, the goal
        conversion and the shard?
      ruling: >-
        IN TASK-20261003-6d2f84's OWN COMMIT, which this ruling extends by
        exactly those two paths. This departs from the practice that
        DEC-20261003-e2a917 followed, which was to commit a ruling before the
        archive that relies on it. The departure is justified by what each
        ruling governs. DEC-20261003-e2a917 decided whether 6d2f84 could START.
        This ruling decides how one field of 6d2f84's receipt reads. The
        transition it bears on (DEC-20261003-4e91b7 taking effect) happens only
        when 6d2f84's commit verifies, and by then this ruling's bytes are
        fixed in that same commit. No official transition rests on uncommitted
        bytes. If the dispatching session prefers a separate isolated archive,
        that is also acceptable. It must run before 6d2f84 resumes.

    - id: R4
      question: >-
        Identifier checks. For TASK-20261003-6d2f84, -a19c53, -e7058d and
        -3c8ea2, allocate_id.py --check also lists the task's own coordination
        directory. For a19c53, git grep also hits task_id lines in that task's
        own outputs. Is that a pass?
      ruling: >-
        YES. A task's own output directory (coordination/tasks/<TASK>/, or
        coordination/goals/<GOAL>/archives/<TASK>/ for an archive task) is part
        of that task's own record footprint. So is a file the task itself
        produced that names its own task_id. That covers the a19c53 hits in
        coordination/tasks/TASK-20261003-a19c53/quote_table.yaml, receipt.yaml
        and inputs/HHAN-2024-2402.11269/source_record.yaml. None of them
        defines a DIFFERENT record carrying the token, which is the receipt's
        collision definition. The pass rule's phrase "only the record's own
        path" is read to include these paths. It was worded too narrowly, and
        the defect is this Coordinator's.
    - id: R5
      question: >-
        EXP-SEMBIN-3d9a71 is defined twice, in the version-1 draft
        (coordination/tasks/TASK-20261002-a84e65/proposed-records/) and in the
        version-2 re-draft (coordination/tasks/TASK-20261003-e7058d/proposed-records/).
        Is that a collision?
      ruling: >-
        NO, AND NOT A STOP. It is the same draft identifier in two versions, by
        design. DEC-20261003-4e91b7 R6 orders the re-draft "as draft version 2
        under the same identifier". No ledger or experiments/ record carries
        the id yet. The row is report-only (DEC-20261003-e2a917 R3) and is
        recorded. The approval decision on version 2 must name which file it
        approves, by path and sha256, and only that file may be moved into
        experiments/.

  target_ids:
    - DEC-20261003-4e91b7
    - DEC-20261003-e2a917
    - TASK-20261003-6d2f84
    - CORR-20261003-9a2d57
    - TASK-20261003-a19c53
    - TASK-20261003-e7058d

  rationale:
    - >-
      The archive's job is to bind the bytes that are official. That is the
      post-repair version, and main has carried no other. The repair is
      schema-level and narrows what the decision claims: it drops a non-ledger
      target and de-cites a recalled source. It added nothing to any ruling.
    - >-
      Stopping the archive to re-supersede an already-fixed text would trade a
      recorded deviation for a third text. Recording both blobs and the diff
      keeps both values, which is what a correction requires.

  evidence_refs:
    - ledger/decisions/DEC-20261003-4e91b7.yaml
    - ledger/decisions/DEC-20261003-e2a917.yaml
    - ledger/handoffs/TASK-20261003-6d2f84.yaml
    - coordination/tasks/TASK-20261003-a19c53/receipt.yaml
    - coordination/tasks/TASK-20261003-e7058d/DESIGN.md
  evidence_refs_note: >-
    The commit shas, times, the description of the repair, and the hash
    84bdaaa0... are the dispatching session's report. This Coordinator read
    only the current working-tree file and ran no git command. E1 to E4 turn
    the report into checked facts.

  limitations:
    - No shell. E1 to E4 are gates on TASK-20261003-6d2f84.
    - >-
      The exact pre-repair text is not known to this Coordinator. It is
      recorded by hash and diff in 6d2f84's receipt (E4), not reconstructed
      here.

  procedure_deviations:
    - id: PD-1
      severity: minor
      what: >-
        Archived inside the archive it rules on (R3). This is a declared
        extension of DEC-20261003-e2a917 R2's commit scope by two paths.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      A procedural archive ruling. There is no evidence record and no research
      claim.

  next_actions:
    - >-
      DISPATCHER: run E1 to E4 and record them in 6d2f84's receipt. If all
      hold, set the exceptions field to the literal block written there, run
      the identifier checks for DEC-20261003-4c81fa and CORR-20261003-9a2d57,
      add both files to the staged set, and resume Step B from validation.
      If E3 fails, stop and send the diff.
    - >-
      COORDINATOR, practice: a validate_ledger defect in a committed ledger
      record is cleared by a superseding record or a correction, not by an
      in-place edit. This holds even before merge, once the commit has been
      pushed (CORR-20261003-9a2d57).
