  archived_by: TASK-20260804-083
  context: >-
    BATCH-071 extended Semaev yield measurement to m=5. Pattern consistent with
    m=2,3,4: no super-heuristic yield at p≥4001. At p=4001, ratio drops FURTHER
    below 1.0 at larger m (0.706 at m=5 vs 0.936 at m=4).

  decision: continue_with_fresh_ideation
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    H-YIELD-001 is already `weakened` (BATCH-070) for m=2..4. The m=5 result
    (ratio=0.706 at p=4001) further confirms the weakening. The scoped weakening
    extends to m=5.

    The m=5 result also reveals: inter-factor correlations DEGRADE the yield at
    larger m (ratio further below 1.0 at m=5 vs m=4). This is consistent with known
    results that the Semaev summation polynomial gets "harder" at larger m (more
    cancellations in the decomposition).

    FRESH IDEATION: Given the comprehensive negative evidence, open a dedicated
    ideation batch targeting the ONE remaining open direction: H-PSEUDO (prove or
    disprove character sum bound for structured point sets). This is the precise
    mathematical question whose resolution would either close the arithmetic FB gap
    or open a new sub-rho direction.

  exact_next_action: >-
    BATCH-072: Ideation specifically targeting H-PSEUDO:
    (1) Can the equidistribution theorem for EC points (Birch/Michel/Venkatesh)
        give a bound on |Σ_{P∈F} e^{2πi k*DL(P)/N}| without circular dependence?
    (2) Can any "mock character" (an algebraic function of (x(P), y(P)) that
        approximates e^{2πi k*DL(P)/N}) give a useful bound?
    (3) Is H-PSEUDO equivalent to a known open problem in number theory
        (e.g., the Murty-Gupta conjecture on character sums for CM points)?

  knowledge_promotion:
    promoted: []
    not_warranted: Weakening confirmed at m=5 but no new finding to promote.

  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2
    sota_delta: {time_exponent: not_applicable}
  claim_ceiling: toy
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-04'
