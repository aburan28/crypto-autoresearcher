# execution"). ID minted without tools/allocate_id.py (no shell in this
# session); random token checked by repository search; run --check before
# the archive.
coordinator_decision:
  id: DEC-20261016-c41e97
  recorded_at: '2026-10-16'
  decided_at: '2026-10-16'
  decided_by: coordinator
  question_ids:
  - RQ-CMFB-33610e
  archived_by: null
  mode: design_experiment_review_required
  decision: revise
  decision_label: >-
    Specify H-CMFB-7d4e1a and draft EXP-CMFB-b36f58 (orbit-arc factor base,
    BSGS-equivalence check). Hold the contract at review_required until a
    launcher exists and newest_experiments reports execution_state ready.
  target_ids:
  - IDEA-20261015-29fdc8
  - H-CMFB-7d4e1a
  - EXP-CMFB-b36f58
  context: >-
    IDEA-20261015-29fdc8 (recommended_priority low, class mechanism, no
    result claimed) states that an arc of the degree-5 CM endomorphism has
    one unknown logarithm, so it needs 2 relations, and that the cost moves
    into a meet-in-the-middle search equal to BSGS. The workflow asked for a
    design of every open idea.
  rationale:
  - >-
    The scientific contract is complete: it has controls (brute-force search
    check, known-log BSGS reproduction, fake-endomorphism arc, matched random
    base, planted-target and planted AP positive controls, random-set
    synthetic control), a pre-registered prediction, resolutions with a
    sample-size derivation, tail checks, stopping and invalidation rules, and
    a mechanical decision rule whose outcomes include negative readings.
  - >-
    It is not runnable: driver, checker, tests and trial plan do not exist,
    and the Coordinator does not write implementation code. Approving it now
    would add an approved contract that nobody can run. Status stays
    review_required, frozen false.
  - >-
    Two departures from the idea, made before any run and recorded in the
    design_notes of the specification: the idea's absolute threshold (0.5
    sqrt(N) search ops per relation) equals the model prediction at c = 1, so
    it is replaced by the ratio rho to the prediction with a 0.8 lead band;
    the 7-cycle prediction is pair-46 specific, so toy instances use their own
    exact cycle count.
  - >-
    Target-scale heuristic validation is paired in the same contract: at pair
    46 it tests the class-leak null (HEUR-003, 200000 samples), the
    eigenvalue identity, ord(lambda), and a sum-set collision tail check for
    HEUR-001.
  - >-
    Priority: constant-only by design (at best equal to BSGS, which rho
    dominates). It closes one RQ-CMFB-33610e channel cheaply and should not
    displace exponent-targeting work (docs/target-result-profile.md).
  evidence_refs:
  - ledger/proposals/IDEA-20261015-29fdc8.yaml
  - ledger/proposals/IDEA-20261015-29fdc8.notes.md
  - knowledge/findings/KN-FIND-b7e091.md
  - experiments/EXP-CMFB-cea1d2/specification.yaml
  limitations:
  - No shell was available in this session. The ids were not minted or checked
    with tools/allocate_id.py, tools/validate_ledger.py was not run, and no
    timing was measured; the cost model is analytic.
  - Pair-46 statements in the contract are primitive checks only; every cost
    and coverage number is at 2^18 < p <= 2^29 with a stated transfer
    assumption.
  next_actions:
  - >-
    Driving session: run python3 tools/allocate_id.py --check on
    H-CMFB-7d4e1a, EXP-CMFB-b36f58 and DEC-20261016-c41e97, then
    python3 tools/validate_ledger.py, before archiving these files.
  - >-
    Coordinator: write an executor-implementation handoff (policy
    executor-implementation; executor-mechanical such as Haiku is enough for
    the later run, not for the build) for the launcher named in the
    specification's launcher.missing_pieces, with write scope
    experiments/EXP-CMFB-b36f58/implementation and
    experiments/EXP-CMFB-b36f58/trial-plan.json and a completion gate of
    tests passing, the C24 pilot timing, parallel.verify_determinism, and
    execution_state ready.
  - >-
    After the launcher is ready: freeze the contract, mint the 7 run ids,
    record the approval decision under the AGENTS.md standing authorization,
    write the executor handoff and run the snapshot archive.
  knowledge_promotion:
    promoted: []
    not_warranted: A design decision is not a result; no evidence exists.
