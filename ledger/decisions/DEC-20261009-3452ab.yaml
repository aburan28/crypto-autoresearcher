coordinator_decision:
  id: DEC-20261009-3452ab
  recorded_at: '2026-10-09'
  goal_id: GOAL-CSIDH-001
  question_id: RQ-CSIDH-64343f
  batch_ids:
    - BATCH-dedd56
  kind: protocol_approval
  mode: portfolio

  context: >-
    The 2026-10-09 design session (design-experiment skill, worktree
    design/session-b-20261009 on branch design/session-b-20261009)
    selected the open ECC idea IDEA-20261006-3cc090 by the
    tools/ecc_priority.py --open-ideas ranking: the two prio=high SSI
    ideas (IDEA-20261007-20f660, IDEA-20261007-cd446e) are capacity
    blocked in both their goal (GOAL-SSI-2fa82a, 6 approved-unrun:
    EXP-SSI-474826, EXP-SSI-494592, EXP-SSI-5bacb4, EXP-SSI-c34de8,
    EXP-SSI-e502f5, EXP-SSI-f08a63) and their area (area:SSI, 39
    approved-unrun), so they stay proposed. IDEA-20261006-3cc090 is the
    highest-ranked open idea whose home goal has approval headroom:
    GOAL-CSIDH-001 owns RQ-CSIDH-64343f and held 0 approved-unrun
    contracts (cap 3) when checked with python3
    tools/portfolio_kpis.py --capacity GOAL-CSIDH-001. The session
    drafted H-CSIDH-10eb0a and the frozen contract EXP-CSIDH-7886f6,
    corrected one control premise at design time (see below), wrote the
    launcher (implementation/driver.py, implementation/check.py) and the
    frozen trial plan, and verified execution_state ready. This decision
    (1) verifies protocol completeness, (2) records approval under the
    standing user authorization, (3) advances H-CSIDH-10eb0a
    specified to approved (pre-run), and (4) opens BATCH-dedd56 with
    the executor run task TASK-20261009-9ec9ef and the snapshot archive
    task TASK-20261009-da6ff6. No scientific trial is launched by this
    decision; /run EXP-CSIDH-7886f6 after the design package is
    committed and pushed is the next_action.

  decision: approve

  decision_scope: >-
    Approves EXP-CSIDH-7886f6 version 1 for the single deterministic
    measurement it defines: the 30-term truncation of L(1, chi) at
    discriminant -83 against the twice-enumerated reduced-form count h,
    under the frozen rational enclosures, with the three-discriminant
    fundamentality labeling (-83 fundamental, -84 fundamental, -92
    non-fundamental) and the -84 control enumeration. Does NOT assert
    that H-CSIDH-10eb0a is true. Does NOT authorize any additional
    discriminant, truncation length, security level, or cost claim, and
    does NOT treat equality as a proof of the class-number formula.

  target_ids:
    - H-CSIDH-10eb0a
    - EXP-CSIDH-7886f6
    - IDEA-20261006-3cc090
    - TASK-20261009-9ec9ef
    - TASK-20261009-da6ff6
    - BATCH-dedd56
    - GOAL-CSIDH-001
    - RQ-CSIDH-64343f

  authorization: >-
    Standing user authorization of 2026-09-06 in AGENTS.md ("All is
    approved. Ideas/experiments should be always approved"). User
    authorization is already satisfied; this decision records PROTOCOL
    READINESS and RUNNABILITY and is the separate approval act.
    Designing was not approving.

  protocol_completeness_check:
    result: complete
    fields_verified:
      - controls (chi-one-and-reduced-sum, enumeration-agreement, fundamentality-labeling, invariant-factors-ignored, interval-length-gate)
      - independent_variables (explicitly empty by design, stated)
      - metrics.primary (abs_diff) and metrics.secondary (h_e1, h_e2, chi_table, L30, interval, r_or_failure, count_84, label_92, invariant_factors, timings)
      - budget (advisory; memory_gb 1 and maximum_runs 1 machine protection)
      - stopping_rules
      - invalidation_rules
      - required_artifacts (manifest.yaml, raw-result.json, forms-83.json, forms-84.json, reading.yaml)
      - preregistered_prediction (r = h; written before any run)
      - success_criterion and falsification_criterion (decidable, differing; instrument_failure is neither)
      - decision_impact (on_positive / on_negative name different future records)
      - no outcome field before a run (check_outcome_not_prewritten)
    defects: []

  capacity_check:
    goal_id: GOAL-CSIDH-001
    approved_unrun_before_this_decision: 0
    cap: 3
    checked_with: python3 tools/portfolio_kpis.py --capacity GOAL-CSIDH-001
    checked_at: '2026-10-09'
    note: >-
      The contract carries goal_id GOAL-CSIDH-001, so
      tools/validate_ledger.py check_approval_capacity counts this goal,
      not the area fallback area:CSIDH (17 approved-unrun). At check
      time, before this design session started, the goal held 0
      approved-unrun contracts. While this package was in flight, PR
      #2029 merged the parallel session's design of EXP-CSIDH-906d0e
      (IDEA-20261006-fd07db, decision DEC-20261009-3fa819); this branch
      merged that PR before its snapshot commit. After this decision the
      goal holds 2 approved-unrun contracts (EXP-CSIDH-7886f6 and
      EXP-CSIDH-906d0e), still below the cap of 3, and
      check_approval_capacity counts 1 standing approved-unrun contract
      for this goal at approval time.

  design_time_control_correction: >-
    IDEA-20261006-3cc090 requires discriminant -84 to be labeled
    non-fundamental before the -83 row is scored. That premise is
    false: -84 = 4*(-21) with -21 congruent to 3 modulo 4 and
    squarefree is the fundamental field discriminant of Q(sqrt(-21))
    (conductor 1). Correct code cannot satisfy the idea's label, and a
    control correct code fails would void every honest run. The design
    keeps the idea's intent (explicit fundamentality labeling before any
    row is scored) and strengthens it: one criterion routine labels
    -83 and -84 fundamental and -92 = 4*(-23) (conductor 2 in
    Q(sqrt(-23))) non-fundamental, any mislabel voids the run. The
    claim row (r against h at -83) is unchanged. The correction is
    recorded in the headers of H-CSIDH-10eb0a and EXP-CSIDH-7886f6;
    the proposal record IDEA-20261006-3cc090 is immutable and is not
    edited.

  status_transitions:
    - record: EXP-CSIDH-7886f6
      from: review_required
      to: approved
      also_set:
        frozen: true
        execution_authorized: true
        approved_by: coordinator
        approval_decision: DEC-20261009-3452ab
    - record: H-CSIDH-10eb0a
      from: specified
      to: approved
      note: >-
        Pre-run approval of the hypothesis paired to the approved
        contract. Not supported. Not running until /run executes the
        frozen trial plan.

  rationale:
    - >-
      PROTOCOL COMPLETE AND RUNNABLE. Every approval-gate field
      tools/validate_ledger.py and AGENTS.md require is present, the
      launcher is written, the frozen trial plan
      experiments/EXP-CSIDH-7886f6/trial-plan.json binds the approved
      specification bytes and the driver/checker closure, and
      python3 tools/newest_experiments.py --experiment EXP-CSIDH-7886f6
      reports execution_state ready. An approved contract nobody can run
      is the backlog this program is paying for; this one runs.
    - >-
      STANDING AUTHORIZATION applies. Designing left approved_by null by
      design; this DEC is the approval. No user confirmation is
      requested.
    - >-
      CAPACITY HOLDS. GOAL-CSIDH-001 held 0 approved-unrun contracts at
      check time; this approval takes it to 1 of 3.
    - >-
      SCOPE OF AUTHORIZATION IS NARROW. One deterministic measurement
      at one discriminant and one truncation length; no security claim,
      no class-number-formula proof, no extrapolation to cryptographic
      discriminants.
    - >-
      THE CONTROL PREMISE WAS CORRECTED, NOT SILENTLY DROPPED. -84 is
      fundamental; the design records the correction and the strengthened
      three-discriminant labeling control.

  evidence_refs:
    - ledger/proposals/IDEA-20261006-3cc090.yaml
    - ledger/hypotheses/H-CSIDH-10eb0a.yaml
    - experiments/EXP-CSIDH-7886f6/specification.yaml
    - experiments/EXP-CSIDH-7886f6/implementation/driver.py
    - experiments/EXP-CSIDH-7886f6/implementation/check.py
    - experiments/EXP-CSIDH-7886f6/trial-plan.json
    - ledger/handoffs/TASK-20261009-9ec9ef.yaml
    - coordination/goals/GOAL-CSIDH-001/batches/BATCH-dedd56/dispatch_queue.json

  limitations:
    - >-
      Approval asserts protocol readiness, not truth of H-CSIDH-10eb0a.
    - >-
      The measurement is toy-scale: one discriminant (-83), one
      truncation length (30). No transfer to CSIDH-512 is claimed.
    - >-
      Equality r = h would not prove the class-number formula; a
      mismatch closes only this discriminant and truncation length.
    - >-
      The two prio=high SSI ideas stay proposed on capacity, not merit;
      they are ranked work once GOAL-SSI-2fa82a or area:SSI frees a
      slot.

  knowledge_promotion:
