    presentation_included: the decidable success criterion (certified k =
      3 total >= 8 from 4 forced twist classes within the frozen box and
      counted-op cap, all controls passing); the derived negative branch
      (P(zero | rate >= q) ~ 4.5 x 10^-5); HEUR-1 pre-registered
      validation design (N_b = 10^4, tail count 10, scales n = 6/8/10);
      invalidation rules IV-1..IV-7; budget (10^8 counted ops per arm,
      7200 s wall, checkpointing, inert exhaustion); and the four findings
      the approval had to engage
    answer_verbatim: "Approve as frozen (Recommended)"
    answer_meaning: commit the approval decision engaging findings 1/2/3/6,
      write the executor handoff, and dispatch execution in a new batch
      under the frozen contract
  findings_engagement: >
    Required by DEC-20260905-145454 before marking approved. Finding 1
    (q = 10^-3 DECLARED, not theorem-derived): ACCEPTED as a frozen
    pre-registered design constant, movable only by versioned amendment.
    The approval does not treat q as a theorem: it sizes the sample; the
    success criterion binds the OBSERVED certified k = 3 total from the
    forced classes, not q itself, so the declared floor cannot manufacture
    a positive. Finding 2 (throughput assumption >= 2 x 10^4 exact
    Fraction ops/s; the idea's cost model implies up to 1.4 x 10^6):
    ACCEPTED with the contract's own mitigation binding -- the COUNTED-ops
    cap (10^8 per arm) is the budget, checkpointing every 10^7 ops, and
    exhaustion is inert in both directions: a slow machine yields a
    completed prefix plus an exhaustion report, never a fake result
    (AGENTS.md rules 3 and 5). Finding 3 (per-b cost ~7.2 x 10^3 ops rests
    on the idea's estimate, not a measurement of this engine): ACCEPTED
    with the contract's rule -- the run counts ACTUAL ops; if the real
    per-b cost exceeds the declared per-b cap, the arm completes a smaller
    prefix and reports it as such, and F1's scope narrows to the completed
    prefix (rule 6). Finding 6 (Hasse-Minkowski and Mazur are RECALLED
    pointers; P0 carries a "near-rigorous" label with a rigor_note):
    ADDRESSED -- this approval records that the experiment's pipeline
    relies ONLY on the COMMITTED verifier implementations
    (verify_certificate.py, regulator_check.py and the contract's exact
    certificate machinery); no conclusion of this experiment leans on the
    recalled pointers or on P0's label; confirmation of Hasse-Minkowski
    (Serre Ch. IV) and Mazur (IHES 1977) from read sources remains owed
    by any FUTURE record that leans on them, per rule 9. Findings 4, 5, 7
    (limited F6 power; borderline arm C where a null is a measurement not
    an invalidation; absent kb index with novelty staying unverified) are
    carried as disclosures into execution and composition, unchanged.
  approved_contract_binding: >
    The approved protocol is experiments/EXP-ECRANK-76a70d/specification.yaml
    version 1 at the bytes committed by the BATCH-ef0456 ledger archive
    (sha256 bcff5ced4c31468e3e09b49b7197b793888775f4df0d63074bad6c3905044b8f).
