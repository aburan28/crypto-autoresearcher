    experiments/EXP-ECRANK-76a70d/amendments/ and never an edit of the
    frozen prediction; runs already executed are never silently re-scored.
  executor_handoff_note: >
    TASK-20260905-26364a targets the executor under policy
    executor-implementation with the contract's own budget envelope
    (maximum_runs 8; wall_clock_seconds_per_run 7200; worst-case total
