  context: Fresh independent review of the archived additive binding correction.
  rationale:
  - The earlier independent behavioral checks remain bounded and the original whole-joint verdict remains failed
    for custody ambiguity.
  - The new binding preserves source bytes;the next uncertainty is metadata consistency and faithful custody.
    Repeating algorithm tests does not alone resolve it.
  - Standing authorization applies. A fresh reviewer owns the precise replacement/source-conservation joint,
    with known-invalid metadata controls.
  approved_boundaries:
  - You are not alone. Own only three exact new artifacts. No source,Git,ledger,queue,claim,status,approval
    or original-artifact mutation.
  - Fresh native review-adversarial gpt-5.6-sol/xhigh;no fallback,degradation,Bedrock or serving probe. Read
    and hash-verify every declared input. No parent conversation or concurrent work.
  - At most128fixed malformed metadata controls including failures/reruns;each complete suite<=48and reserve
    one final suite. Each control serialized input<=1MiB,one control at a time. All frozen input files together
    must be<=16MiB before parsing.10s/control,1800aggregate executed-check wall/CPU,one worker,2GiB. Metadata/source
    comparisons counted separately.
  - No solver-module import, algorithm test rerun, Docker, live guard, process-tree discovery, privilege or
    scientific execution. Do not attempt RLIMIT_AS. Use bounded inputs and a180s checker process watchdog;
    report actual diagnostic RSS honestly and fail if observed usage exceeds2GiB. No hard-kernel-limit claim.
  - Take explicit --repo from the published claim/worktree;do not infer it with an untested fixed parent-depth.
    Reserve unique temporary attempt directory and exact checker bytes before each invocation. Persist command
    results and launch exceptions before interpreting or raising;retain full outer tool/session/polls/terminal
    exit and nested argv,UTC,stdout,stderr,allcontrols and actualmetrics.
  - Create canonical check-receipt.json only once after every intended attempt has terminated,embedding every
    immutable attempt. No overwritten receipt, reconstructed data, guessed exit or accounting restart.
  - Return scoped joint verdict,three hashes and all limitations. The previous review stays failed;Coordinator
    alone may synthesize source acceptance from the exact complementary evidence. No measurement admission.
