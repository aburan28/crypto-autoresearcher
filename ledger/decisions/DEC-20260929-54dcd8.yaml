  revision_requirements:
    note: >-
      Numbered for discharge by the version-4 revision. Every item is a
      specification, pre-registration or wording defect of an unapproved
      contract, and none is evidence about H1, H2 or any curve. Remedies are
      the reviewers' suggestions, adopted here as requirements. Everything
      that held is carried unchanged or with its change stated in a
      constants_delta block: the constants, column, windows, the committed
      m = 4 range, Stage 0 code, conventions, wording, exclusions, controls,
      the IR-5 scoping, the per-cell bands and the self-test wiring. Any edit
      to fixture_code or stage0_code re-pins extracted_sha256 in the new
      snapshot.
    breaking:
      - id: R3-J3-1
        source: 810095 J3-D1 and required_controls RC-1
        requirement: >-
          Make the decision table route every consequence the contract
          declares tested. PREFERRED REMEDY: add two per-cell gated tests to
          gate_tests, and so to G1 (a). T_kappa: |z_kappa| at most 3.3, low
          when z is below 0. T_rho: |ln rho_rel| at most 3.3 sqrt(exp(-mu_c) /
          B_c), low when rho_rel is high. Keep both out of COVERAGE_TESTS so a
          coverage deficit classes LOW-RETRY. Then restate
          outcome_table.per_cell_class (the R2-J3-4 mapping) and
          H1-NEGATIVE-YIELD to match the code exactly. Add generative patterns
          for 5 and 10 percent low-dispersion matched-mean deficits to
          outcome_patterns with their declared assignments, and have the
          session re-run --outcome-patterns and the G1 calibration Monte Carlo
          as producer computations, restating the per-cell false-fail rates
          with the new tests. PERMITTED ALTERNATIVE, only with a recorded
          reason why gating is not adopted: declare H1 (e) reported-not-gated,
          and remove target coverage and the relation-phase yield from
          statement (D), from H1's tested consequences, from the H1
          validation_plan power sentence and from certifies_only, stating the
          deficit range the table routes to PASS. EITHER WAY, the audit sheet
          adds a false-pass sweep. For every consequence the contract says it
          tests and every certifies_only item, it records the smallest
          deviation the contract's own statistic flags at its own threshold
          and the class and outcome the committed table assigns to it.
    required_moderate:
      - id: R3-J4-1
        source: 810095 J4-D1 and RC-4
        requirement: >-
          Wording only. Beside the column-value c-range of the TW-01
          containment clause (tw01_caution; tripwire_preregistration; D-12),
          state the matched-advice range: the first-below-the-line restatement
          holds for c below about 1.67 on the committed m = 4 range, about
          1.54 with the online attempt constant charged, and 1.54 to 1.60 at
          B = B_cap(m) on that basis. State that the failure description at
          the Bernstein-Lange constants already applies from c of about 1.67
          for bases above B_cap(4). The routing rule is unchanged.
    required_minor:
      - {id: R3-J3-2, source: '810095 J3-D4, J3-O5 and RC-2', requirement: 'Charge the coset factor: predict the binary cells at the measured f mu_c (the |F_i| are counted at setup), or admit f at most 1.02 as an admission rule. Disclose the coset-subgraph structure of the binary relation graphs in A5.'}
      - {id: R3-J3-3, source: 810095 J3-D2, requirement: 'Align the text of IR-5 (a) and RB-IR5 with ir5_check, or split the flag so the text and the code assign the same consequence.'}
      - {id: R3-J3-4, source: 810095 J3-D3, requirement: 'Make the null arm''s extra target attempt every 4 B relations fire independently of the check cadence, or state the cadence dependence.'}
      - {id: R3-J3-5, source: 810095 J3-O6, requirement: 'Reword "equal per-test false-fail rates on all three cells, by construction": the per-cell bands equalise the nominal sd multiple only.'}
      - {id: R3-J1-1, source: 7fb81e J1-D1, requirement: 'Correct the LA-iteration-constant restatements (H statement (B), H asymptotic_claim.hidden_cofactor, E definitions.cap_locus_and_constants): the m = 4 cap slice lower edges rise by up to 2.00 and 3.17 bits at k = 2, 3; the critical and closing values move by at most 0.02. Optionally print the cap slice in la_sensitivity.'}
    recommended_not_required:
      - 'RC-3 (810095): a physical negative-control cell for H1, for example a Z/NZ cell with a structured repeated-sums base of KN-FIND-007''s type, expected to read LOW-RETRY with a coverage deficit, so the instrument and table are shown to reach a declared NEGATIVE on real instrument data. If not added, the producer states why.'
      - 'O-J2-1 (7fb81e): null the axis labels in stage2_outcome when the contract label is RUN-ARTIFACT.'
      - 'O-J2-2 (7fb81e): read the in-cell certificates as a second guard beside verify.py IR2_fired.'
      - 'J3-O7 (810095): a cheap gate on per-target generic group operations (at most a fixed multiple of attempts).'
      - 'OI-5: a code-review card for the I3 to I5 code in the execution batch before Stage 2 (the contract recommends it and cannot bind it).'
      - 'OI-2: vendor the three retrieved PDFs under inputs/ with their sha256.'

