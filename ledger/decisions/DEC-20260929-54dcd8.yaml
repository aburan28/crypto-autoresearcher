      Q7 effect.
    k_carry_broken: >-
      NOT TRIGGERED, ruled explicitly. D-CARRY reports no uncovered difference
      in a constant, the committed m = 4 range or a compared design figure.
      The independence tool did not refuse the carried report: it reports
      PASS with it, and reports the blind joint unattested only when the
      carried directory is omitted. The plan instructs the session to pass
      that directory. The carried J5 is applicable to version 3.
    j5_versus_contract: >-
      Compared quantity by quantity against version 3's frozen design_figures
      and constants, after a constants_delta adjustment of 0 bit (worksheet
      j5_versus_contract). Largest differences: Q1 below 1e-6 bit; Q2 6e-7
      bit; Q3 identity exact and LA sign agreeing at every m; Q5 4e-5 bit; Q4
      bounds 0.0046 bit, empty at g = 13, 13.2, 14 in both conventions,
      critical g 3.2e-4; Q6 envelope edges 0.0035 bit, contiguity identical,
      closing g 1.3e-4; cap and sub-cap slices within 0.0046 bit; Q7 4.1e-7
      and 4e-5 bit. Every quantity is within tolerance, so K-indeterminate is
      not triggered.

