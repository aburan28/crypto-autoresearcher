  rationale:
    - >-
      The plan's keys decide this outcome as written. K-approve needs J3 to
      hold and every revision requirement discharged. J3 breaks on an
      artifact the plan listed before the object existed (an undischarged
      R2-J3 item), under a discharge test the plan also fixed in advance. The
      reading that would rescue approval needs a qualifier the frozen clause
      does not carry, and even the most charitable qualifier the text admits
      leaves the contradiction standing.
    - >-
      The break is substantive. H1 (e), the Poisson coverage law, is the law
      behind A(mu) = 1/(1 - exp(-mu)), the attempts constant the deployed
      column charges (A(1) = 1.582 in T_shared and kappa_m). A toy POSITIVE
      that "certifies target coverage" while the contract's own statistic
      rejects it at 3.5 to 11 sigma would carry an unvalidated constant into
      the proposed column note. A validation arm that cannot fail on a
      declared consequence does not meet DEC-20260928-63addc C5.
    - >-
      Proportion. Everything else in the protocol held under a fresh red team
      that attacked the round's new items: the IR-5 repair, the rule sweep,
      per-cell calibration, reachability, the null, wording, custody, code
      and the blind arithmetic. The remedy is local and zero-compute, so the
      decision is revise, not a return to ideation, and not approval.
    - >-
      Revise before run. Running the frozen contract would spend a run whose
      POSITIVE could not be read as validating H1 (e), which the review
      showed at zero compute.

