  composition:
    rule: >-
      CA3-3 and CA3-8. Each joint is read against the plan's own
      breaking_artifact list and given one composed disposition naming the key
      applied. Verdicts are not counted, and keys are applied as written. No
      key is relaxed or tightened, and no breaking list is widened or narrowed
      after reading.
    joints:
      - joint: J1
        owner: TASK-20260929-7fb81e
        attested: true
        disposition: holds
        key_applied: none triggered (the K-approve J1 and D-CARRY conditions are met)
        basis: >-
          140 of 140 Stage 0 DESIGN comparisons reproduce within the plan's
          tolerances. The column is within 0.000335 bit, window bounds within
          0.00459 bit, critical g within 0.000324, envelope edges within
          0.00347 bit on the exact committed grid, and closing g within
          0.000129. The L = 1 print is model-evaluated and can fail, and D1 is
          nowhere a budget. R2-J1-1, R2-J1-2, R2-J2-2 and the R2-J4-1 numeric
          part are discharged; R2-J1-3 is discharged by the audit clause.
          D-CARRY is clean. Minor J1-D1: the LA-constant restatements in H
          statement (B), H hidden_cofactor and E cap_locus_and_constants
          understate the m = 4 cap slice (+2.000 and +3.170 bit at k = 2, 3;
          critical and closing values move at most 0.019, not "not at all").
          This is disclosure only.
      - joint: J2
        owner: TASK-20260929-7fb81e
        attested: true
        disposition: holds
        key_applied: none triggered
        basis: >-
          Both code blocks extract by two routes to the pinned digests and
          execute nothing on import. Every procedure step 2 self-test is wired
          (G1 (h); S3 and CTL-7; IR-11). In 24 traced instrument cases on the
          committed stage2_outcome, no self-test failure reaches NEGATIVE. The
          I3 to I5 code is bound by the execution-batch pin before any run,
          with the gap stated (OI-5). Every approval field is present,
          approved_by is null, the approval block names this decision, and
          both supersedes fields are present. No version-1 or version-2 file
          changed, and memory is beside every time figure. Observations O-J2-1
          to O-J2-4 are carried as recommendations.
      - joint: J3
        owner: TASK-20260929-810095
        attested: true
        disposition: breaks
        key_applied: K-revise-defect
        basis: >-
          J3-D1 matches the plan's J3 artifact "an undischarged R2-J3 item"
          under the plan's discharge test (the owning joint's report
          contradicts the named clause). See decision_label and
          reading_ruling. What holds, in the reviewer's abstract-model Monte
          Carlo and committed-code dry calls (review computations, not
          observations): IR-5 is scoped, off the run-wide list, coded and never
          fires on declared figures (R2-J3-1 discharged). No invalidation,
          stopping or admission rule fires on the contract's own metrics or on
          P1. Every gate's false-fail rate is at most 2.4 percent per cell at
          every tested regime (G1 0.59 percent) and no band confines its
          observable. Every declared outcome is reachable, and the 19 coded
          patterns reproduce. The no-reuse null fails every amortisation gate
          in every simulated arm. The AM reductions are exact, with the
          L-dimension declared untested. R2-J3-2, R2-J3-3, R2-J3-5, R2-J3-6 and
          R2-J3-7 are discharged. Minor J3-D2, J3-D3 and J3-D4 and
          observations J3-O5 to J3-O7 are carried. J3-D4 (per-cell non-PASS
          6.25 percent at a coset factor f = 1.05) is not scored as breaking:
          the plan's item is a false-fail above 5 percent under the true model
          at a cell regime, the declared regimes stay at most 2.4 percent, and
          f = 1.05 is a perturbed model whose realisation is unknown.
        reading_ruling: >-
          The red team offers an alternative reading under which R2-J3-4
          counts discharged and J3-D1 is a material non-breaking defect. That
          reading is outcome-determinative, because every other K-approve
          condition holds. The composer rules that the plan's text supports
          the primary reading, and does not adopt the alternative, for five
          reasons. (a) The plan fixed the discharge test before any report:
          does the owning joint's report contradict the named clause? It does,
          with committed-code patterns. (b) The clause defines the deficit by
          its quantity and attaches no detection condition. The parenthetical
          "(T_a low, ...)" describes the LOW-RETRY signature. Where the author
          wanted a strength qualifier it wrote one ("AM2 low when strong") and
          attached none to T_a. The alternative needs "a deficit that T_a
          detects", which the frozen bytes do not carry. (c) A literal reading
          covering arbitrarily small deficits would bind no statistical
          classifier. The most the text can bear is a deficit the contract's
          own coverage statistic detects at its own threshold (yield_audit,
          z at or below -3). The contradicting patterns are flagged by exactly
          that statistic and still route to PASS. (d) The contract's own text
          says such deficits are to be read. H1 validation_plan says "a 10
          percent target-coverage deficit is about 7 standard errors",
          certifies_only lists "target coverage", and the falsification
          criterion names H1-NEGATIVE-YIELD. (e) Adopting a rescuing qualifier
          after reading the reports would narrow the breaking list and relax a
          requirement without a protocol_amendment, which a composition cannot
          do. DEC-20260929-1f5fcb declined the analogous reading of IR-5.
      - joint: J4
        owner: TASK-20260929-810095
        attested: true
        disposition: holds
        key_applied: none triggered
        basis: >-
          No frontier, first-below-the-line or below-T_gen sentence is an
          outcome (TA-1 not fired). The TW-01 clause, as frozen
          (specification lines 979 to 993), states containment against the
          T_gen column value and holds on its stated c-range (c_max 2.0046 on
          the committed range, 2.52 to 2.63 at B_cap(m)). The c = 1
          first-below-the-line restatement (audit line 3819) holds at c = 1.
          So the plan's item "a TW-01 clause stated for a range of c it does
          not hold on" is absent. R2-J4-2 and R2-J4-3 are discharged. The
          conventions travel with the column, the per-orbit framing is
          conditional, and R-SRC digests reproduce by the reviewer's own
          retrieval. Moderate J4-D1: the narrower matched-advice range (about
          1.667, or 1.536 with the online attempt constant) is not stated. No
          named constant lies in the gap, and no outcome moves.
      - joint: J5
        owner: TASK-20260929-739a0c (carried by digest)
        attested: true
        disposition: applicable to version 3 and in agreement within tolerance on every compared quantity
        key_applied: K-carry-broken not triggered; K-indeterminate not triggered; the K-approve J5 condition is met
        basis: See d_carry_and_carried_j5. The inconclusive attestation is the card's designed verdict, and every Q0 to Q7 output was delivered, so K-infra does not apply.
    unowned_or_unattested_joints: none
    k_infra: not applied to any joint
    composite_reading: >-
      What stands. The deployed Stage 0 arithmetic (column, identity, LA term,
      m = 5 window, m = 4 slices and envelope, L = 1 ties, rho reference) is on
      two routes, one blind, and now carried to version 3 by a clean diff. The
      code binding, import safety, self-test wiring and custody stand. So do
      the IR-5 repair, the rule sweep against the modal pattern, the per-cell
      gate calibration, reachability and null separation, the scope wording
      and conventions, and all four proves-too-much controls. What fails. The
      validation arm declares that it tests the Poisson coverage law H1 (e),
      the law behind the attempts constant A(mu) that the deployed column
      charges. It measures that law at high power, but its decision table does
      not route a detected deficit out of POSITIVE. A POSITIVE could therefore
      certify "target coverage" while the contract's own deficit flag is
      raised on both cells. That is a validation arm that cannot fail on one
      of its declared consequences, which DEC-20260928-63addc C5 and the
      dispatch bias forbid. The remedy is two gated tests (or an honest
      demotion of the consequence) plus enumerated wording, all zero-compute.

