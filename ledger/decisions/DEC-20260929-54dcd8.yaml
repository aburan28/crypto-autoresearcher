  decision: revise
  decision_label: >-
    Revise under composition key K-revise-defect. J3, the joint on the decision
    table, breaks on the plan's listed artifact "an undischarged R2-J3 item".
    R2-J3-4 required the contract to state which per-cell class a
    KN-FIND-007-direction yield deficit maps to. The contract states that such
    a deficit ("target coverage below the Poisson value at matched mean")
    maps to LOW-RETRY, or to SPLIT, and never to LOW-COV (specification
    outcome_table.per_cell_class, lines 926 to 929). The committed classifier
    does not do that. Target coverage (kappa_hat) is read only inside the
    LOW-RETRY audit, and the relation-phase yield (rho_rel) is gated only
    through the ratio KR, where a deficit's rise in a_bar cancels it. A
    matched-mean coverage deficit of 5 to 15 percent therefore classifies PASS
    on both binary cells and reads contract POSITIVE, while the contract's own
    yield_audit flags it at z = -3.52 to -10.85. The composer verified the
    routing on the frozen code (gate_tests, classify_cell, h1_axis,
    yield_audit) and the 10 percent point (z = -7.13) by hand arithmetic
    through gen_values. Everything else holds. J1 and J2 hold. D-CARRY finds no
    uncovered difference, so the carried J5 is applicable, and it agrees on
    every compared quantity. J4 holds, all four proves-too-much controls meet
    their signatures, no tripwire fired, no ICPERF objection is on the bus, and
    seventeen of eighteen revision requirements are discharged. The contract is
    not approved. Every defect is a protocol-design, pre-registration or
    wording defect of an unapproved contract, not a mathematical result about
    any curve, oracle, algorithm or heuristic (CA3-10).

