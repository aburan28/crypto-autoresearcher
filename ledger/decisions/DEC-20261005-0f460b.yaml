# H-FROB-ff99bf (proposed -> approved): the dimension 5-6 extension of the
# exact Weil census at n = 131 over F_2, KN-OPEN-095df5's cheapest
# discriminating test item 1. Standing user authorization; no user
# confirmation required or sought.
#
# WHAT IS APPROVED. The frozen contract experiments/EXP-FROB-720a77/
# specification.yaml and its hypothesis H-FROB-ff99bf: extend the exact
# abelian-variety exclusion (dimensions 1-4, EV-FROB-b6e1e9; 234,220 exact
# tests at dimension 4, zero hits) to dimensions 5 and 6, with C1
# prior-dimension reproduction as the instrument gate, C2 boundary reporting,
# C3 empty-sweep transparency, and a 50,000,000-test feasibility gate.
#
# WHY IT IS RANKED. It is the open problem's own named cheapest test, it is
# exactly computable with no Groebner engine, it scales with candidates
# rather than class counts, and either outcome is a result: a miss narrows
# the Couveignes-Lercier survival space at the ECC2K-130 degree to
# dimension >= 7 and non-abelian groups; a hit supplies the concrete Weil
# polynomial the Frobenius-invariant factor-base route needs.
# =============================================================================
