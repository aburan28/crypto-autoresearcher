  context: >-
    /design-experiment, one contract, for IDEA-20261005-be4540. No
    hypothesis and no experiment cites that idea. Its question id is
    RQ-DREG-bd6c86. The proposal file is on origin/main. The branch
    design/dreg-be4540-firstfall was created from origin/main at
    9c2bc35e93f0c2f83026c8e351c621f623bdfb90 and git merge origin/main
    reported already up to date.

    The contract freezes the first nonsingular short-Weierstrass curve
    over F_5 in lex order of (A, B) with nonzero trace, builds raw S_3
    at m=3 and n'=1, and compares the first positive new_falls degree
    through cap 6 with the median of 20 support-matched nulls. The
    pre-registered prediction is an absolute gap of at least 1. A
    finished absolute gap of 0, with null range at most 1, is a
    negative. A null range of 2 or more is inconclusive. No Jacobian
    is built.

    This session counted points and selected (A, B) = (1, 0) with
    trace 2. It did not build a Macaulay matrix. It opened KN-TECH-002,
    the S_3 module, IDEA-20260916-4b7c1e through the rank identity,
    and the frontier rows KR-IC-fbdb61, KR-IC-5ea2f8, KR-IC-5a43e5,
    and KR-IC-889857. Those rows are not used as costs.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, seeds, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. Success is a
    valid pin together with an absolute gap of at least 1, and it
    fails when the finished gap is 0. No field required for approval
    was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading are fixed before any executor run.
    - A finished absolute gap of 0 is reachable as a recorded outcome, so success is not automatic.
    - Twenty support-matched nulls are the same-shape control. A run that disagrees with itself on the seed-1 null is void rather than a fall result.
    - Three planted matrices give the run a way to come back void when the ranker is wrong.
    - This session did not build the Macaulay matrices and did not claim a subexponential cost.

  evidence_refs: []
  limitations:
    - The measurement covers one cell at q=5, m=3, n'=1. It does not determine growth in n or m.
    - KR-IC-fbdb61 remains the known bound on last fall degree. This decision does not contradict it.
    - HEUR-1 is a support-matched fill. It is not a semi-regular formula.
    - A null range of 2 or more is inconclusive and is not a negative.
    - This decision authorizes a later execution. It does not start one.
    - No goal file lists RQ-DREG-bd6c86. This decision does not create one.

  next_actions:
