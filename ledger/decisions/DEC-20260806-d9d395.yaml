coordinator_decision:
  id: DEC-20260806-d9d395
  decided_by: coordinator
  decided_at: '2026-08-06'
  decision: expand
  target_ids:
  - GOAL-HQC-001
  - EXP-HQC-982268
  - H-HQC-18d1b4
  - EV-HQC-036d4b
  context: "BATCH-fc30b5 dispatched DEC-20260806-9a4551's next_actions items 1-2: a matched-pair
    reanalysis of the pilot's already-collected data, and a defect-specific required-T derivation.
    TASK-20260806-e120e8 built both; TASK-20260806-7bbbc8 snapshotted them before either review; and
    TASK-20260806-f743ae (Validator) and TASK-20260806-2cec38 (Red Team) reviewed independently and in
    parallel, each re-deriving the key formula from first principles rather than checking arithmetic
    alone. This decision closes the batch and reverses the pessimistic framing this campaign was heading
    toward, on their reports plus EV-HQC-036d4b."
  decision_label: single_block_dilution_confirmed_global_injection_projected_cheaper_than_baseline
  rationale:
  - 'THE MATCHED-PAIR REANALYSIS CONFIRMS THE PILOT''S NULL WAS GENUINE, NOT AN ARTIFACT. Both reviewers
    independently reproduced the tighter matched-pair comparison and got the same non-significant result
    (z=+0.534 at k=17) the executor reported. This closes DEC-20260806-9a4551''s narrowest open question:
    the tighter design did not reveal a hidden signal the pilot''s weaker design had missed.'
  - 'THE DILUTION FORMULA IS MATHEMATICALLY CORRECT, CONFIRMED BY TWO INDEPENDENT FIRST-PRINCIPLES
    RE-DERIVATIONS, NOT MERELY ARITHMETIC CHECKS. This is treated as established: a single-block injection
    at n_e=56 is diluted by k/n_e in its propagated effect and by a second, near-cancelling term under an
    i.i.d.-blocks approximation.'
  - 'BUT THE 4.33e8 FIGURE IS NOT TRUSTED AS A PRECISE NUMBER, ON THE RED TEAM''S SPECIFIC AND VERIFIABLE
    GROUNDS: the formula''s i.i.d.-blocks approximation, applied to the UNDEFECTED baseline, predicts
    mubar_16/mubar_17 = 1/q_hat exactly -- but this campaign''s own committed data (EV-HQC-b71230) already
    shows this is false by 13.4 percent. Since the reported residual is a near-cancellation of two terms
    each ~8.5x its size, an unmodeled effect of that magnitude could move the true required-T substantially
    in either direction. This is recorded as a genuine, disclosed uncertainty, not resolved by this
    decision -- the Red Team named two cheap, no-new-sampling checks to narrow it, and they are ordered
    into next_actions below.'
  - 'THE GOVERNING FINDING FOR THIS DECISION IS THE RED TEAM''S PROJECTION, NOT THE 4.33e8 FIGURE: applying
    the SAME validated formula to a GLOBAL (V1-class, all-56-block) injection removes the k/n_e dilution
    entirely, projecting a required T of roughly 1.38e5 -- cheaper than the frozen specification''s own
    undefected T_req of 3.09e5. Whatever residual uncertainty attaches to the exact multiplier, the
    QUALITATIVE conclusion -- that a global injection faces a vastly smaller, plausibly negative, dilution
    penalty relative to a single-block injection -- follows directly from the confirmed formula''s
    structure (effect scales by n_e, required T by n_e-squared) and does not depend on resolving the
    independence-approximation question first.'
  - 'A COORDINATOR OVERCLAIM IS RETRACTED HERE RATHER THAN CARRIED FORWARD. The prior batch''s review
    briefing described real-sampler injection as "astronomically infeasible" based on the 4.33e8 figure
    alone, without having done the global-injection projection or having flagged the underlying
    approximation''s known weakness. The Red Team caught this by direct comparison against the committed
    artifacts, before it entered any permanent ledger record. It is corrected here: single-block injection
    at this exact point is a poor instrument; real-sampler injection in general is not shown infeasible,
    and the global-injection projection argues the opposite.'
  - 'THIS SATISFIES DEC-20260806-9a4551''s CONDITION FOR REVISITING THE ORIGINAL STOPPING RULE, BUT NOT IN
    EITHER OF ITS TWO ORIGINAL BRANCHES. Neither "scale to the full run" (at V3''s single-block point, which
    the dilution analysis shows would be uninformative regardless of exact T) nor "PAUSE" (which the
    global-injection projection makes premature -- there is now a concretely cheaper, promising avenue
    that has never been tried) fits. The next action is the POSITIVE-CONTROL PILOT that DEC-20260806-9a4551
    item 3 already named as the fallback if ambiguity persisted -- now sharpened with a specific target
    injection point (global, V1-class) and a specific target scale (~1.38e5, itself to be validated by two
    cheap pre-checks before a full run at that scale is authorized).'
  evidence_refs:
  - EV-HQC-036d4b
  - EV-HQC-67a6ec
  - EV-HQC-bfb257
  - EV-HQC-163374
  - EV-HQC-9a30d3
  - EV-HQC-db1fd9
  - EV-HQC-b71230
  - coordination/goals/GOAL-HQC-001/batches/BATCH-fc30b5/reviews/TASK-20260806-f743ae/validation_report.yaml
  - coordination/goals/GOAL-HQC-001/batches/BATCH-fc30b5/reviews/TASK-20260806-2cec38/red_team_report.md
  limitations:
  - NO statement about HQC, its decoding-failure rate, assumption A17 or A5, or any standardized
    parameter set. Claim tier stays toy.
  - H-HQC-18d1b4 UNCHANGED at proposed. Six consecutive batches of instrument-trust, feasibility, and
    pilot work have not moved it.
  - experiments/EXP-HQC-982268/specification.yaml is not amended by this decision. Neither the global
    pilot nor any full run is pre-authorized beyond the two named pre-checks and a subsequently scoped
    pilot task.
  - None of the four asymptotic-complexity promotion gates is engaged; none is claimed.
  - The ~1.38e5 required-T for a global injection is a projection, not a measurement. It rests on the same
    formula whose reliability is itself flagged as uncertain; the two named pre-checks exist specifically
    to narrow that uncertainty before any run is sized against this number.
  - The V3 single-block injection point is not declared permanently uninformative -- only that resolving
    its ambiguity via more trials at the SAME design is intractable at any affordable budget. A
    differently-shaped instrument at that same point was not evaluated here.
  knowledge_promotion:
    promoted: []
    not_warranted: 'Two real candidates are visible: (1) the block-dilution formula itself (a single-block
      perturbation''s propagated effect on a k-way aggregate statistic scales as k/n_e times a
      near-cancelling correction term) is a genuine, checkable, reusable result for this instrument family;
      (2) the general lesson that a comparison design''s statistical power should be checked BEFORE relying
      on its null (from EV-HQC-67a6ec) is reinforced here. Both are held pending the two named pre-checks
      and, ideally, a second confirming instance outside HQC''s specific decode_blocks structure -- this
      program''s inventor protocol treats premature generalization from one confirmed derivation as
      exactly the failure mode promotion gates exist to prevent. No KN-FIND: nothing was measured about
      HQC.'
  next_actions:
  - "Dispatch two cheap, no-new-sampling checks on the dilution formula's reliability, as named by the Red
    Team: (1) an empirical conditional-vs-unconditional mubar_{k-1} check comparing the formula's
    i.i.d.-blocks assumption directly against already-collected PS-R3 data; (2) an SE-scaling in-range
    check. Both use only existing committed data -- no new (T)-sampling required."
  - "If those checks leave the qualitative conclusion intact (global injection dilution penalty much
    smaller than single-block, plausibly negative), dispatch a GLOBAL (V1-class, all-56-block off-by-one
    truncation) real-sampler injection pilot, sized initially as a smaller diagnostic run before committing
    to the full projected ~1.38e5 scale -- following the same pilot-then-scale discipline this campaign
    used for the V3 injection, but this time informed by a dilution analysis from the start rather than
    discovering it after the fact."
  - "Do not schedule further work at the V3 single-block injection point under the same design -- its
    dilution penalty is now understood structurally, not merely observed as an inconclusive result, and
    more trials at the same design would not resolve it."
  - "Only after a global-injection result (or a clear infeasibility finding from the two pre-checks) is in
    hand should the remaining resume-plan items from DEC-20260806-2947ba be attempted: the missing
    extrapolation to standardized parameters, PS-R3's second independent reviewer, and the remaining named
    harness repairs."
  - "Carry forward, lowest priority: the unreconciled run-count discrepancy from the V1 arm (BATCH-4b8ad3)
    remains unresolved."
