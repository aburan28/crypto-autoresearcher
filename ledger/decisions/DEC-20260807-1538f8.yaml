coordinator_decision:
  id: DEC-20260807-1538f8
  context: >-
    /design-experiment lifecycle steps 3-5 for IDEA-20260807-9fb27c under
    RQ-ICINV-475b5e / GOAL-ENDO-001. The proposal was converted to hypothesis
    H-ICINV-82ee6a and experiment contract EXP-ICINV-fcb497, drafted at
    `review_required` with `approved_by: null` by a Coordinator that explicitly
    declined to approve its own contract and referred the decision upward. This
    record is the approval act at that gate.
  decision: approve
  decision_note: >-
    EXP-ICINV-fcb497 IS APPROVED FOR EXECUTION at version 1, on the user's
    explicit answer at the /design-experiment gate on 2026-08-07 (option
    "Approve, full contract"). The protocol is FROZEN as of this record. The
    approval authorises the frozen budget -- 12 runs, 6 CPU-hours, 4 GB, 7200 s
    per run -- and nothing beyond it. TASK-20260807-f9c69c is activated in the
    same archive.
  target_ids:
    - EXP-ICINV-fcb497
    - H-ICINV-82ee6a
    - TASK-20260807-f9c69c
    - IDEA-20260807-9fb27c
  rationale:
    - >-
      THE GATE CAN INVERT THE RECORD, AND THAT IS WHY IT IS WORTH RUNNING FIRST.
      STAGE 0 is a single literature read establishing over which field the
      square-root Velu Otilde(sqrt d) operation count is stated. Its four outcomes
      are pre-registered as first-class branches, none an abort: KERNEL_FIELD
      (cost corollary CC stands as a conditional, modeled claim), BASE_FIELD (CC
      REFUTED, IDEA-20260807-9fb27c superseded, lane priority rises), AMBIGUOUS,
      and UNRETRIEVED_INFRA. The refuting branch is a pre-registered success of
      the task. An experiment whose cheapest step can overturn its own headline
      is the shape this campaign asked for.
    - >-
      STAGE-0 FEASIBILITY IS ESTABLISHED, NOT ASSUMED. WebSearch and WebFetch both
      fail in this environment with a backend model-access error -- the same
      failure that left IDEA-20260807-9fb27c at `novelty_status: unverified` with
      its Bernstein-De Feo-Leroux-Smith attribution marked as cited from
      background knowledge and not read. Direct HTTP egress works: curl against
      https://eprint.iacr.org/2020/341 returns 200. The contract therefore
      specifies a curl retrieval path with the artifact stored under the run
      directory and pinned by sha256, not a WebFetch that would fail on contact.
    - >-
      THE DESIGN ADMITS OUTCOMES THAT LOSE, and the success criterion is decidable
      from the predefined metrics without reference to which way they fall.
      S0_BASE_FIELD, OUTCOME_FAMILY_small_m and OUTCOME_STALE_BARRIER all satisfy
      the success criterion while refuting a named part of H-ICINV-82ee6a. The
      experiment fails on INVALID, unpinned source, unverifiable quotation, a
      failed planted control, a failed m = 1 fixture, too few decades, or a
      missing table.
    - >-
      THE m = 1 FIXTURE IS THE SHARPEST CHECK IN THE CONTRACT and is blocking. If
      the corrected accounting does not degenerate to Otilde(sqrt ell) on the
      small-ell rational-eigenspace slice, the argument proves too much -- it
      would also kill the object where square-root Velu genuinely helps -- so the
      cost formula has mis-identified the load-bearing structure. This is
      simultaneously a falsification condition and an invalidation rule.
    - >-
      SAMPLE SIZE IS DERIVED, NOT ASSERTED. The two-sample KS critical value at
      level 0.05 is 1.358 sqrt(2/N), so resolving D_min = 0.10 requires N >= 369;
      the floor is 400 instances per decade and the target 1000, which resolves
      0.061. Effects below D = 0.10 are declared unresolvable in advance and may
      not be reported as null results.
    - >-
      TWO INSTRUMENT DEBTS ARE DISCHARGED AS BLOCKING CONDITIONS rather than
      recommendations. `code.source.all_pinned: true` with a passing
      tools/check_run_source_provenance.py --strict answers CORR-20260807-911ef7
      and the seventeen-of-nineteen unpinned runs of EXP-ICINV-4d33aa;
      byte-verified substring quotation for every reference value, literature
      included, answers CORR-20260807-a24675.
    - >-
      THE DRAFTING COORDINATOR'S FIVE REFUSALS ARE ACCEPTED AS DRAFTED, INCLUDING
      THE TWO THAT WEAKEN THE CONTRACT AGAINST THE HANDOFF THAT COMMISSIONED IT.
      (1) The KN-LIT-780 STAGE-0 fallback is restricted to returning AMBIGUOUS
      only: its `citation_verified: read` front matter overstates a bulk-seeded
      entry whose body relays claims from the abstract, whose local PDF is absent
      from this worktree, and whose text says "field operations" without
      disambiguating the field -- the exact ambiguity STAGE 0 exists to resolve.
      (2) HEUR-M2-2's runtime instrumentation of shared harness modules is
      replaced by a read-only static audit plus the m = 1 fixture, declared as
      weaker coverage in both records. (3) No authority to correct another record
      off this experiment's own barrier table; stale rows escalate to a decision.
      (4) alpha narrowed to Z[pi], with the O-minimum a declared secondary for
      f <= 100 and everything stratified by conductor. (5) No prime literals
      written by an agent without a shell to verify them; the ladder is frozen as
      a rule and computed by the executor.
  evidence_refs:
    - IDEA-20260807-9fb27c
    - RQ-ICINV-475b5e
    - GOAL-ENDO-001
    - H-ENDO-001
    - KN-FIND-b7e091
    - CORR-20260807-911ef7
    - CORR-20260807-a24675
    - CORR-20260807-0f5d56
    - KN-LIT-780
    - EXP-ICINV-4d33aa
    - H-ICINV-6c7920
    - IDEA-20260807-c36472
  limitations:
    - >-
      claim_tier is capped at `toy`. The prime ladder stops below 2^24, bounded by
      exact factorisation of d ~ p. No result may be phrased as a statement about
      cryptographically sized curves.
    - >-
      Ordinary prime-field curves only. Nothing here transfers to supersingular
      curves, where End(E) is a non-commutative quaternion order and the
      scalar-collapse filter does not apply.
    - >-
      alpha is scoped to Z[pi]. Where the conductor f > 1 the order O may contain a
      non-scalar element of smaller degree, so every reported d is a Z[pi]
      statement and the O-minimum is a declared secondary.
    - >-
      NO ATTACK AND NO SPEEDUP IS CLAIMED OR SOUGHT. sota_delta is zero; the only
      movement claimed is upward, in a cost figure. H-ENDO-001 is used as an
      admissibility filter and is NOT re-tested by this experiment, per the
      standing constraint in GOAL-ENDO-001.
    - >-
      H-ICINV-82ee6a carries forward IDEA-20260807-9fb27c's `novelty_status:
      unverified` and its unverified-citation flag. Until STAGE 0 returns a
      determinate verdict against a pinned artifact, the cost corollary is
      conditional on an attribution nobody in this chain has read.
    - >-
      This approval rests on the contract and its cited records alone. No run of
      EXP-ICINV-fcb497 exists, no evidence record is created, and no hypothesis
      status other than H-ICINV-82ee6a at `proposed` is created or changed.
  next_actions:
    - >-
      N1 Coordinator snapshot archive of H-ICINV-82ee6a, EXP-ICINV-fcb497,
      TASK-20260807-f9c69c and this decision by exact path; push the branch and
      refresh PR #228 naming all four ids. Merge origin/main first; never rebase.
    - >-
      N2 Dispatch the executor against TASK-20260807-f9c69c only after the archive
      commit verifies. STAGE 0 runs first and alone; stages 1-4 follow under every
      branch, including BASE_FIELD.
    - >-
      N3 Reserve an independent Validator task and a Red Team task before any
      evidence record is written.
    - >-
      N4 If STAGE 0 returns BASE_FIELD, supersede IDEA-20260807-9fb27c under a new
      id -- never edit it -- and state in the same record that T1, T2, T3,
      HEUR-ORD-1, HEUR-M2-2 and the H-ENDO-001 kill are untouched, so the
      inversion is not overread as an attack.
    - >-
      N5 GOAL-ENDO-001 checkpoint after the ledger archive, preserving exactly one
      next action.
