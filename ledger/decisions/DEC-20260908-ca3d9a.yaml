    - It does not dispatch CAND-D2-A or rerun EXP-ECDLP-56ee42.
    - It does not dispatch EXP-ECDLP-df601f from BATCH-5a5091.
    - It asserts no attack, speedup, novelty, closure, support, or breakthrough.

