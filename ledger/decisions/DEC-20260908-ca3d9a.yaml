    - It does not claim H1 or treat one ordinary cell as an H1 measurement.
    - It does not read a recorded Stage 0--10 gamma or walk mean as H1 support.
    - It does not treat an H3 factor-2 miss as failed_infrastructure.
    - It does not treat an H3 miss as H1 closure.
    - It does not treat eight walks as the idea's 10^4-walk KS plan.
    - It does not permit re-running C1, C2, or C3 as a Stage 10 measurement.
    - It does not classify W as SMALL-W or LARGE-W.
    - It does not set fit_of_a true.
