coordinator_decision:
  id: DEC-20260810-d82c61
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-74ebef

  context: >-
    Written while merging origin/main (PR #324, tip 44525b6f) into this
    branch before archiving amendment v4 to EXP-ICINV-4d33aa. The merge-base
    overlap check (git diff --name-only against the actual merge-base, not
    HEAD) found exactly one overlapping path, ledger/goals/GOAL-ENDO-001/
    goal.yaml, and inspecting both sides' changes to it surfaced something
    this Coordinator must record before proceeding: origin/main carries a
    SECOND, INDEPENDENTLY-OPENED BATCH, BATCH-d7e255 (DEC-20260810-a4bec4),
    forked from the exact same parent state as this branch's own
    BATCH-74ebef -- the point immediately after N12 closed
    (DEC-20260809-4081cc, 2026-08-09) -- by a session with no visibility
    into this one. This decision documents that fork plainly, states which
    parts are a genuine substantive collision versus which are simply two
    disjoint bodies of new work, and pauses on the one open question it
    raises rather than resolving it unilaterally.

  decision: pause

  target_ids:
  - GOAL-ENDO-001
  - BATCH-74ebef
  - BATCH-d7e255
  - EXP-ICINV-4d33aa
  - RQ-ICINV-475b5e
  - DEC-20260809-de11f9
  - DEC-20260810-cc6577
  - DEC-20260810-a4bec4
  - EXP-INSTR-36c8cf
  - experiments/EXP-ICINV-4d33aa/amendments/v3.yaml
  - experiments/EXP-ICINV-4d33aa/amendments/v4.yaml

  rationale:
  - >-
    THE FORK IS STRUCTURAL, NOT AN ERROR IN EITHER RECORD. Both branches
    diverged from the identical parent commit (7df1972a, verified as this
    merge's own git merge-base). Neither session that authored
    BATCH-74ebef (this branch) or BATCH-d7e255 (origin/main, merged via PR
    #324) could see the other's commits while working -- this is exactly
    the "many agents, many worktrees" hazard CLAUDE.md's concurrency
    section exists to name, one level up from the identifier-collision
    case that section was written around: here the collision is not on an
    identifier but on WHICH CONCRETE DESIGN implements the same
    high-level user directive. Nothing here alleges that either
    DEC-20260809-de11f9, DEC-20260810-cc6577, or DEC-20260810-a4bec4 is
    factually wrong; each is an accurate record of what its own session
    did and saw.
  - >-
    THE ONE SUBSTANTIVE COLLISION, STATED PRECISELY. DEC-20260809-de11f9
    (2026-08-09, present on both branches identically) named three
    candidate redesigns of EXP-ICINV-4d33aa's SR3 baseline-reproduction
    gate and recorded that a third attempt needed a user decision among
    them. Both branches independently record that the user selected
    candidate (b), "replacing literal band membership with a statistical
    comparison against the reference run's own sampling uncertainty" --
    but turned that same words-level directive into two DIFFERENT
    concrete instruments. THIS BRANCH (BATCH-74ebef): a THEORETICAL /
    PARAMETRIC redesign, reusing the Wilson-Hilferty chi-square
    approximation already frozen in harness/exp_icinv.py:
    binomial_null_verdict against the ALREADY-COLLECTED per-curve count
    data, with no new instrument and no new run. Filed as amendment v3
    (executed as RUN-ICINV-849d1d, independently reviewed, adjudicated
    reject_scoped in DEC-20260810-cc6577 on other grounds unrelated to
    this fork), and refined into amendment v4 (filed unapproved
    concurrently with this decision, fixing a 44-45% false-pass-rate
    defect CORR-20260810-a4c123 found in v3's version of the same idea).
    ORIGIN/MAIN (BATCH-d7e255, DEC-20260810-a4bec4): an EMPIRICAL
    redesign -- a brand-new instrument, EXP-INSTR-36c8cf, that measures
    the reference run's own per-density-row sampling distribution
    directly across many seeds. Approved but not yet dispatched; no
    handoff, no run, no data. DEC-20260810-a4bec4's own text states
    plainly that "experiments/EXP-ICINV-4d33aa/amendments/v3.yaml... is a
    separate Coordinator act... required before any successor run" --
    i.e. that branch's session had not yet written any v3.yaml when it
    recorded the user's selection. Because this branch's v3.yaml already
    exists in git history and origin/main never touched that path, the
    merge itself produces no file-level conflict: the v3.yaml that lands
    is this branch's Wilson-Hilferty design, by construction of which
    branch got there first, not by any comparison of merits.
  - >-
    THIS COORDINATOR CANNOT ADJUDICATE WHICH "THE USER SELECTED..." IS
    THE MORE FAITHFUL ACCOUNT, AND DOES NOT GUESS. Each record's claim is
    consistent with a real interaction its own session had; this
    Coordinator has no visibility into either conversation beyond the
    committed ledger text, and CLAUDE.md's own instruction that "a
    recorded attestation must be genuine -- never record one you did not
    obtain" applies with equal force to inventing a preference between
    two records neither of which this Coordinator watched being decided.
    THE TWO DESIGNS ARE NOT NECESSARILY IN TENSION AS SCIENCE: a
    parametric approximation cross-checked by an independent empirical
    measurement of the same quantity is a stronger result than either
    alone, if both are wanted. Whether both are wanted, given
    EXP-INSTR-36c8cf's own recorded cost (delaying EXP-JINV-bd141d and
    EXP-VOLC-9f5571 through GOAL-ENDO-001 criterion C4), is a resource
    question for the user, not a mathematical one this Coordinator can
    settle by re-deriving anything.
  - >-
    BATCH-d7e255 IS NOT DIMINISHED BY THIS NOTE. Three of its four
    approved contracts (EXP-JINV-bd141d, EXP-VOLC-9f5571,
    EXP-ICINV-e0cd8f) and their paired hypotheses are entirely disjoint
    from anything BATCH-74ebef touched -- different experiments,
    different files, no overlap found by the merge-base diff beyond
    goal.yaml itself. DEC-20260810-a4bec4 is a substantial, carefully
    reasoned batch-opening decision (472 lines, five mandatory controls
    on the within-class arm alone, an explicitly declared identifiability
    ceiling, a stated infrastructure risk) and this decision does not
    reweigh, second-guess, or deprioritize any part of it. AGENTS.md rule
    9 (do not steer away from a plausible high-value lead) binds this
    Coordinator with respect to BATCH-d7e255's own three unaffected
    contracts exactly as it binds with respect to this branch's own work.
  - >-
    WHY `pause` AND NOT A UNILATERAL RESOLUTION. Under AGENTS.md rule 1
    only the Coordinator changes hypothesis status or approves
    experiments, and this Coordinator (this session) already exercised
    that authority once on this exact gate by approving and dispatching
    v3. Retroactively favoring one branch's design over the other from
    inside the branch that already benefits from having gotten there
    first would be exactly the kind of self-serving outcome-shopping SR6
    forbids in spirit, even though SR6 is textually about this
    experiment's own gate formula. The honest act available to this
    Coordinator is to merge without deleting either side's record (rule
    4), name the collision precisely, and pause on RECONCILING it --
    not on this branch's own already-independently-reviewed v3/v4 thread,
    which stands on its own regardless of how the other design fares.
  - >-
    WHAT THIS DECISION DOES NOT DO. It does not move H-ICINV-6c7920's
    status (DEC-20260810-cc6577's reject_scoped stands, decided on
    grounds -- the density confound -- unrelated to this fork). It does
    not retract, edit, or diminish amendment v3 or v4. It does not cancel
    or deprioritize EXP-INSTR-36c8cf or any of BATCH-d7e255's four
    contracts. It does not merge the two SR3 designs into one, invent a
    reconciliation, or pick a winner. It authorizes no new dispatch and
    no new compute.

  evidence_refs:
  - ledger/goals/GOAL-ENDO-001/goal.yaml
  - ledger/decisions/DEC-20260809-de11f9.yaml
  - ledger/decisions/DEC-20260810-cc6577.yaml
  - ledger/decisions/DEC-20260810-a4bec4.yaml
  - ledger/corrections/CORR-20260810-a4c123.yaml
  - experiments/EXP-ICINV-4d33aa/amendments/v3.yaml
  - experiments/EXP-ICINV-4d33aa/amendments/v4.yaml
  - experiments/EXP-INSTR-36c8cf/specification.yaml
  - analysis/endomorphism-isogeny-decomposition/MATCHED-ORDER-DESIGN.md

  limitations:
  - >-
    This Coordinator has not evaluated the relative statistical merits of
    the Wilson-Hilferty parametric approach versus the per-density-row
    empirical-sampling approach against each other -- that comparison is
    not attempted here, would itself need independent review before being
    decisive, and is not needed to record the fork honestly.
  - >-
    This Coordinator has no shell-level visibility into which, if either,
    branch's "the user selected..." framing corresponds to an actual
    single conversation, or whether the user gave compatible instructions
    to two concurrent sessions without realizing both would design
    concrete instruments independently. Neither possibility is asserted
    here; both are left open.
  - >-
    This decision is scoped to the ONE path-level collision the
    merge-base diff actually found (goal.yaml) plus the ONE substantive
    design collision discovered by reading DEC-20260810-a4bec4's own
    text. It does not constitute a full line-by-line audit of every
    record BATCH-d7e255 introduced; those records are taken as
    self-consistent and independently reasoned on their own terms, per
    the point above about not diminishing that batch's work.
  - Toy scale throughout; claim_tier n/a (no measurement is reported by this decision).

  next_actions:
  - >-
    Present this fork to the user directly and ask how to proceed:
    (a) run both SR3 redesigns as independent cross-checks of the same
    gate (the parametric one already executed and reviewed; the empirical
    one requires dispatching EXP-INSTR-36c8cf first); (b) retire one in
    favor of the other, and if so state which and why; or (c) something
    else. Not decided by this record.
  - >-
    Decide when to write and dispatch the four handoffs BATCH-d7e255's
    own N4 calls for (EXP-ICINV-e0cd8f, EXP-JINV-bd141d, EXP-VOLC-9f5571,
    EXP-INSTR-36c8cf) -- a substantial, fully approved, currently
    undispatched body of work that this decision does not deprioritize
    but also does not dispatch itself, since it was not this session's
    own queued work and dispatching it was not requested.
  - >-
    This branch's own already-authorized, already-in-flight thread is
    UNAFFECTED and continues: filing amendment v4 (unapproved, pending
    user review, same two-step discipline as v3) and drafting the
    EXP-CANL-96b0ad v2 protocol_amendment (CORR-20260810-308774 /
    CORR-20260810-685434), neither of which this fork touches.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is a process/coordination record about concurrent authorship,
      not a research result. No hypothesis status changes, no evidence is
      reviewed, and no measurement is reported.

  decided_by: coordinator
  decided_at: '2026-08-10'

  inference:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: claude-sonnet-5
    reasoning_effort: null
    fallback_used: true
    fallback_reason: >-
      This Claude Code harness cannot resolve the policy aliases in
      orchestration/model-policies.yaml; every alias falls back to the one
      model the session runs on. Recorded, never silently substituted
      (AGENTS.md rule 11).
    degraded_allowed: false
    degraded_requirements: []
    model_verified: false
    model_verified_reason: No adapter probe receipt exists for this session.
