coordinator_decision:
  id: DEC-20260726-009
  provenance:
    reissue_of: DEC-20260726-007
    reissued_as: DEC-20260726-009
    correction_record: CORR-20260727-001
    authorizing_decision: DEC-20260727-001
    authority: >-
      ESC-20260727-001 section D_id_collision, ruling OURS_RENUMBERS_TO_DEC-20260726-009
      (coordination/goals/GOAL-ECDLP-001/escalations/ESC-20260727-001/ruling.yaml),
      entered into the ledger by DEC-20260727-001.
    original_issuance: >-
      Issued on branch feat/launch-research-harness-78c286 as
      ledger/decisions/DEC-20260726-007.yaml. The executing session reports and has
      verified that the content below is byte-identical to what was committed at 81f8e793;
      this authoring session has no shell access and computed no hash itself.
    reason_for_renumber: >-
      origin/main independently published a DIFFERENT record at the same ID:
      ledger/decisions/DEC-20260726-007.yaml at main commit
      3a59a2079e7d24fa877828dc4766d4ca1c1cc9cb, the EXP-GGM-001 archive decision
      (support / strong on H-GGM-001). IDs are immutable and never reused. The published
      trunk record keeps the ID; this unpublished branch record renumbers, which touches
      no published history.
    date_component_unchanged: >-
      The 20260726 date component is retained because decided_at is 2026-07-26 and the
      date is part of the record identity, not a filing timestamp. DEC-20260726-008 was
      already taken, so 009 is the next free number on that date.
    substance_unchanged: >-
      Nothing below this block differs from the record as originally issued. context,
      decision, target_ids, rationale, evidence_refs, limitations, next_actions,
      knowledge_promotion, decided_by, and decided_at are carried verbatim. This is the
      same decision, reissued at a non-colliding ID; it is not a new decision, not a
      revision, and it changes no status.
    alias: >-
      Every occurrence of the string DEC-20260726-007 in an artifact authored on branch
      feat/launch-research-harness-78c286 on or before 2026-07-26 refers to THIS record,
      DEC-20260726-009, and NOT to main published DEC-20260726-007. See
      CORR-20260727-001 for the alias declaration and the list of artifacts that retain
      the historical string under it.
  context: >-
    Bookkeeping audit of the GOAL-ECDLP-001 goal record and its coordination state,
    plus the opening of the final campaign batch. Four integrity defects were found in
    the committed goal and dispatch records, none of which is a mathematical result:
    (1) latest_verified_commit had been set to the literal string "pending" by the goal
    record's last commit, replacing a real commit sha; (2) current_batch_id had jumped
    from BATCH-004 to BATCH-006 with no BATCH-005 coordination artifacts anywhere in
    the repository; (3) BATCH-004 completed (EV-ECDLP-006, DEC-20260726-004) with no
    batch_checkpoints entry; (4) dispatch_queue_path still pointed at the archived
    BATCH-004 queue, whose four task cards all still read state "queued". This decision
    records the repairs, their evidentiary basis, and the approval of BATCH-006 as the
    sixth and final batch. No hypothesis or experiment status is changed here.
  decision: approve
  target_ids:
    - GOAL-ECDLP-001
    - BATCH-004
    - BATCH-006
    - TASK-20260726-005
    - TASK-20260726-006
    - TASK-20260726-007
    - TASK-20260726-008
  rationale:
    - >-
      latest_verified_commit is set to 6a4f0705d6bbd1e7b72aa77b79c1a024a20b4faf. That
      is the most recent commit in this goal for which a committed record attests a
      completed post-commit verification: coordination/goals/GOAL-ECDLP-001/batches/
      BATCH-004/reviews/TASK-20260726-003/review_report.yaml records snapshot_validation
      with commit 6a4f0705d6bbd1e7b72aa77b79c1a024a20b4faf, parent
      3bc446881ac9ab4d6ba13adddd35299351c8be6f, reachable_from_head true, exactly 3
      changed paths, both source SHA-256 values matching git cat-file, verdict PASS. It
      is strictly later than the prior value aca9d56b (the BATCH-003 ledger commit),
      because its parent 3bc44688 is the commit that reopened BATCH-004 after the
      BATCH-003 pause.
    - >-
      The later BATCH-004 ledger archive commit is NOT used for this field. Its only
      committed receipt, coordination/goals/GOAL-ECDLP-001/batches/BATCH-004/archives/
      TASK-20260726-004/ledger_commit_receipt.json, records commit_sha null, parent_sha
      null, and no path_sha256 bindings, so no committed record establishes that any
      post-commit verification of it ever occurred. Recording it as "verified" would
      assert a check that no artifact shows was performed. TASK-20260726-007 is scoped
      to recover and verify it; only after that may the field advance.
    - >-
      current_batch_id BATCH-006 is confirmed correct, for a reason the record did not
      state. The committed next_action of DEC-20260726-004 reserved the id BATCH-005
      for the execution of EXP-IC-001, and that execution occurred: DEC-20260726-005
      records 748 EXP-IC-001 runs across 8-36 bits with EV-IC-001. The same undocumented
      slot also carried DEC-20260726-006 / EV-STR-002 and the design of H-GGM-001 and
      EXP-GGM-001. The id is therefore consumed. Under the immutable-ID convention it
      cannot be reused, and reusing it would silently hand the campaign a seventh batch
      against a six-batch stop condition. What is missing is not the batch, it is the
      batch's coordination record.
    - >-
      A BATCH-005 checkpoint is appended with every coordination field null or empty,
      because no BATCH-005 directory, batch record, dispatch queue, review report, or
      archive receipt exists anywhere in this repository. Its evidence_id, decision_id,
      and claim_boundary are taken from the committed DEC-20260726-005 / EV-IC-001 and
      DEC-20260726-006 / EV-STR-002 records. The absence of any independent review,
      snapshot archive, or ledger archive receipt for that work is recorded as an
      observed gap; this decision does not reopen or adjudicate those two support
      decisions.
    - >-
      The BATCH-004 checkpoint is appended from committed records only. ledger_commit
      is null and stated as unrecoverable, rather than filled from the abbreviated sha
      the calling session reported, because no committed record in this repository
      preserves it.
    - >-
      The BATCH-004 dispatch queue is reconciled rather than left stale, because four
      "queued" cards in an archived batch would cause the dispatcher to re-select
      already-executed work. TASK-20260726-001 and TASK-20260726-003 are promoted to
      completed on committed-record evidence. The two Coordinator archive cards are set
      to blocked, not completed, because tools/research_dispatch.py requires a non-null
      archive.commit_sha and a path_sha256 entry covering every archive and source
      artifact before accepting state completed, and those hashes cannot be produced
      without computing Git object content hashes. "blocked" asserts only that the cards
      are not dispatchable; it makes no claim that the commits failed.
    - >-
      BATCH-006 dispatches two independent non-originating review-xhigh sessions against
      the H-GGM-001 + EXP-GGM-001 package before any execution. The package was authored
      by the Coordinator session under a declared glm-5p2 fallback and has had no
      independent scrutiny. Its specification asserts that a SIMULABLE verdict is a
      scale-independent derivation-level closure at exponent 1/2, which is a closure
      claim under AGENTS.md rule 12 and the only assertion in this campaign that reaches
      above the toy tier. A Reviewer therefore attacks test soundness and decidability
      while a Red Team attacks the tier-escalation argument itself.
    - >-
      Execution of EXP-GGM-001 is not authorized. Its status remains review_required
      with approved_by null. The review outcome, archived by TASK-20260726-008, decides
      its fate; and because BATCH-006 exhausts the batch budget, any approved execution
      belongs to a separately budgeted successor campaign, not to this one.
    - >-
      The H-STR-002 structured-solve wall-time track from the DEC-20260726-006
      next_action is deliberately excluded from BATCH-006. It needs a new experiment
      design, an implementation, an execution, and its own review chain; fitting it into
      the final batch alongside the GGM review would produce an unreviewed result.
    - >-
      The pre-review snapshot obligation for H-GGM-001 and EXP-GGM-001 is discharged by
      prior commit plus reviewer-computed hash, not by a new snapshot commit. Both files
      are already committed and unmodified, and an archive commit must change exactly
      its declared paths, so staging unchanged content would produce an empty diff and
      fail the post-commit verifier. Each review session must instead resolve the commit
      supplying each reviewed path, confirm it is clean at HEAD, compute its SHA-256 from
      Git object content, and record the binding, exactly as TASK-20260726-003 bound
      commit 6a4f0705.
  evidence_refs:
    - EV-ECDLP-006
    - EV-IC-001
    - EV-STR-002
  limitations:
    - >-
      This is a coordination and integrity decision. It produces no evidence for or
      against any hypothesis, changes no hypothesis or experiment status, and asserts
      nothing about prime-field ECDLP.
    - >-
      The BATCH-004 ledger archive commit identity remains unrecovered. Until
      TASK-20260726-007 verifies it, EV-ECDLP-006 and DEC-20260726-004 rest on a receipt
      that records no commit and no hash bindings.
    - >-
      The BATCH-005 work (EXP-IC-001 execution, EXP-STR-002 extension, H-GGM-001 and
      EXP-GGM-001 design) has no independent review, no snapshot archive, and no ledger
      archive receipt. Its two support decisions stand as recorded and are not reopened
      here, but the missing review chain is a known weakness in their standing.
    - >-
      The campaign wall-clock tally against total_wall_clock_seconds 28800 is not
      reconstructible, because BATCH-005 recorded no budget or elapsed time. BATCH-006
      is bounded independently at 6600 seconds.
    - >-
      Both BATCH-006 review sessions are permitted a declared glm-5p2 fallback, so
      neither can claim equivalence to the requested review-xhigh policy. If those
      reviews are later used to support a closure claim at exponent 1/2, the fallback
      non-equivalence must be carried as a limitation on that claim.
    - >-
      The SHA-256 bindings for the archive commit that carries this decision were not
      computed by the authoring session, which has no shell access. They must be
      computed and verified by the committing session before the commit is treated as
      durable.
  next_actions:
    - >-
      Commit the declared BATCH-006 opening and integrity-repair paths as one isolated
      archive with expected parent 9b77791f, verify it, and only then dispatch
      TASK-20260726-005 and TASK-20260726-006 concurrently under review-xhigh in two
      separate non-originating sessions.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This decision reviews no evidence and produces no durable research claim. It
      repairs goal and dispatch bookkeeping and opens a review batch. Nothing here is a
      finding about ECDLP, generic-group simulability, or any attack stage.
  decided_by: coordinator
  decided_at: "2026-07-26T21:15:00-07:00"
