    a RESUME action, not a dispatch instruction, and it is effective only on a
    fresh explicit user budget authorization recorded as a Coordinator budget
    amendment.

  # =====================================================================
  # THE TRANSITION
  # =====================================================================
  goal_status_transition:
    goal_id: GOAL-ECDLP-001
    from: active
    to: paused
    performed_by_this_decision: true
    performed_at: '2026-08-17'
    performed_in: >-
      the same isolated ledger commit as this record, which stages exactly two
      paths: ledger/decisions/DEC-20260817-e633b6.yaml and
      ledger/goals/GOAL-ECDLP-001/goal.yaml.
    authority: >-
      Coordinator, the only role that may change an official status (AGENTS.md
      rule 1). This act is a goal-head reconciliation, not a batch archive; it
      opens no batch, dispatches no task, and approves nothing.
    basis_records:
      disposition_decision: ledger/decisions/DEC-20260815-7a7ba4.yaml
      evidence: ledger/evidence/EV-ECDLP-96bf56.yaml
      checkpoint: ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-7d9b78.yaml
      control_plane_correction: coordination/goals/GOAL-ECDLP-001/batches/BATCH-7d9b78/corrections/CORR-20260817-2b5ab1.yaml
    prior_status_stands_unretracted: >-
      The `active` value set at the BATCH-7d9b78 opening on
      BUDGET-AMEND-20260815-001 was correct on its own terms and is preserved
      verbatim in the head. Nothing in this transition retracts it, retracts the
      BATCH-8c58a3 pause that preceded it, or retracts any prior
      pause-condition firing recorded anywhere in this goal's history.

  # =====================================================================
  # WHICH PAUSE CONDITION FIRED, AND WHY ON ITS OWN TERMS
  # =====================================================================
  pause_condition_fired:
    which: 'goal.yaml pause_conditions[0]'
    text_as_committed: >-
      'The campaign_budget.total_wall_clock_seconds or
      campaign_budget.maximum_batches budget is exhausted without meeting a
      positive completion criterion.'
    limb_that_fired: campaign_budget.maximum_batches
    other_limb_not_relied_on: >-
      campaign_budget.total_wall_clock_seconds = 28800 remains UNTRACKED and
      therefore UNEVALUABLE per the head's own total_wall_clock_tracking_status
      and INT-BATCH006-005. This decision asserts nothing about it in either
      direction and does not rest on it.
    campaign_budget_maximum_batches: 53
    set_by: BUDGET-AMEND-20260815-001
    authorization_basis_of_that_cap: >-
      The user's 2026-08-15 explicit instruction "Continue GOAL-ECDLP-001",
      recorded by the Coordinator in the BATCH-7d9b78 OPENING act. A fresh
      explicit user authorization, NOT a Coordinator self-grant.
    consumed: true
    independent_count_by_this_session:
      method: >-
        Directory listing of ledger/goals/GOAL-ECDLP-001/checkpoints/*.yaml
        performed by THIS session with the file-glob tool. No shell was used and
        no command was executed; this is a tool-level file listing, and it is the
        only quantity in this record this session verified for itself.
      checkpoint_files_counted: 53
      agrees_with: >-
        DEC-20260815-7a7ba4 campaign_budget_position (52 before this batch, this
        checkpoint the 53rd) and BATCH-7d9b78.yaml campaign_budget_position.
      disclosed_counting_artifact: >-
        STATED RATHER THAN SMOOTHED OVER. The 53 files carry 52 DISTINCT batch
        identifiers: BATCH-ef31ab is carried by two files
        (checkpoints/BATCH-ef31ab.yaml and
        checkpoints/BATCH-ef31ab-close-20260808.yaml), both recording
        batch_id BATCH-ef31ab. Every prior budget amendment in this goal's
        history counted FILES ("52 checkpoint files exist", "counted 50
        checkpoint files present"), and on that convention 53 of 53 are
        consumed. This session does not adjudicate the convention, and it does
        not need to: BUDGET-AMEND-20260815-001 authorizes the last batch BY
        IDENTITY as well as by count -- "the second unit authorizes EXACTLY ONE
        new batch, the 53rd (BATCH-7d9b78) ... A 54TH IS NOT" -- so BATCH-7d9b78
        is the last authorized batch on the amendment's own words under either
        reading. The artifact is recorded so that a later reader finds it here
        rather than mistaking it for an unnoticed discrepancy, and it is not
        available to anyone as an argument for a further batch.
    completion_criteria_met: false
    completion_criteria_met_detail: >-
      NEITHER declared completion criterion is met and neither is close. No
      candidate attack improvement has been independently reproduced or proved,
      no certificates exist, no end-to-end cost accounting against matched
      rho/BSGS controls exists, and no novel technique has been independently
      validated with a concrete reproducible improvement. Zero experiment runs
      occurred in BATCH-7d9b78; EV-ECDLP-96bf56 is direction `neutral`, strength
      `inconclusive`, run_ids empty.
    disposition_that_accompanied_it: >-
      DUAL REVISE. Validator TASK-20260815-7fa865 (validation_status failed, 5
      blocking / 7 non-blocking, ZERO numeric mismatches across 96 independently
      recomputed values) and Red Team TASK-20260815-82a8cb (5 blocking, 6 major,
      4 moderate, 3 minor), both at review-adversarial / xhigh in independent
      non-originating sessions, fallback_used false, degraded false. Their
      near-exact convergence is SAME-MODEL CORRELATED JUDGEMENT at the
      BATCH-a723af discount and is never distinct-model corroboration.
    fired_on_its_own_terms: true
    fired_on_its_own_terms_detail: >-
      The condition names a budget and a criterion. The budget is exhausted and
      no criterion is met. Nothing about the REVISE verdict is needed to make it
      fire, and the verdict does not make it fire harder: had both reviews
      returned PASS with no completion criterion met, this same condition would
      fire identically. That is what makes this a SCOPED, EXPECTED outcome of a
      bounded campaign rather than a conclusion about the science.

  # =====================================================================
  # WHAT `paused` ASSERTS AND WHAT IT DOES NOT
  # =====================================================================
  status_semantics:
    no_completion_criterion_was_met: true
    paused_asserts_no_success: >-
      AGENTS.md is explicit that `paused`, `blocked` and `closed_at_budget`
      assert NO SUCCESS. `paused` here is not `completed`, not
      `closed_at_budget`, not `blocked`, and not `cancelled`.
    paused_asserts_no_failure_either: >-
      AND IT ASSERTS NO FAILURE. It records that a bounded campaign reached its
      authorized ceiling, nothing more. Per AGENTS.md rule 3 and the reviews'
      own framing, a REVISE on a zero-run static design package is a statement
      about paperwork; apparatus, capacity, provenance, cap and budget residuals
      are never evidence against a mathematical hypothesis. NOTHING IN THIS
      DECISION IS EVIDENCE FOR OR AGAINST H-SYC-b854f4 OR ECDLP IN EITHER
      DIRECTION.
    understatement_check: >-
      AGENTS.md forbids retiring under a no-success status a goal that DID meet
      a criterion, in order to understate it. No criterion was met here, so
      `paused` understates nothing; and no criterion was met, so `paused`
      overstates nothing either.
    not_closed_at_budget:
      chosen: false
      why_not:
        - >-
          A CONCRETE, CHEAP, FULLY SPECIFIED SUCCESSOR SCOPE EXISTS. BLOCK-1
          through BLOCK-5 (plus BLOCK-6 and the twelve non-blocking findings)
          are each independently checkable by hand from committed bytes, and the
          repair is zero-run and static. The validator's own summary is that NOT
          ONE NUMBER NEEDS TO CHANGE.
        - >-
          A LIVE SPAWNED CANDIDATE EXISTS. RT-82A8CB-SPAWN-1 (a representation
          with no fixed candidate_index capacity has no overflow EVENT, hence no
          familywise tail obligation) is filed with the cheap check that would
          kill it first. It is a CANDIDATE ONLY -- not evidence, supporting no
          claim, changing no status, and not ranked by this decision.
        - >-
          Retiring a lane that has both would be PREMATURE CLOSURE, which
          docs/inventor-protocol.md and CLAUDE.md treat as a failure mode
          SYMMETRIC WITH OVERCLAIMING. Declining to search because a target
          looks saturated is not a neutral act.
      what_would_change_it: >-
        A later Coordinator decision may still record `closed_at_budget` if the
        successor scope is discharged or abandoned on its own recorded evidence
        and revisit condition. This decision does not pre-empt that and does not
        recommend it.
    revisit_condition: >-
      Either (i) a fresh explicit user authorization raising
      campaign_budget.maximum_batches above 53, recorded by the Coordinator as a
      versioned budget amendment, or (ii) a declared completion_criteria item
      being met on some other basis. Nothing else discharges this pause.

