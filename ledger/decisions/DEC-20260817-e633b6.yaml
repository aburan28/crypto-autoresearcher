      `high` with review-adversarial unbound, and Bedrock was refused under
      AGENTS.md rule 16. Both reviews were correctly recorded NOT_OBTAINED rather
      than fabricated or degraded. That was the right call and it stands.
    clearing_condition_satisfied: 'b'
    clearing_condition_text_as_recorded_in_the_stop: >-
      '(b) set ZAI_API_KEY or ANTHROPIC_API_KEY in .env, confirm with
      `python3 -m orchestration.adapter doctor --probe`, and run the reviews on
      the resolved binding.'
    how_it_was_satisfied: >-
      BY RUNTIME RATHER THAN BY SETTING AN API KEY, AND THE DIFFERENCE IS STATED
      RATHER THAN GLOSSED. Both reviews ran in fresh, independent,
      non-originating NATIVE AUTHENTICATED CLAUDE CODE sessions on the anthropic
      backend, each self-reporting claude-opus-5[1m], at review-adversarial /
      xhigh, fallback_used false and degraded false. That is the SAME BINDING
      TARGET the clearing condition names -- anthropic:claude-opus-5, which both
      review task cards preregistered -- reached through an authenticated direct
      session rather than through an API key in .env. AGENTS.md rule 16
      expressly allows authenticated direct Claude Code sessions whose resolved
      provider is not Bedrock. The condition's PURPOSE (the required tier
      actually served by the bound model, in an independent session, with no
      fallback and no degradation) is met on its own terms.
    what_was_not_done: >-
      No downgrade and no substitution occurred. No rule was waived, no gate was
      lowered, no effort floor was relaxed, no receipt was reused, and no review
      ran on a model that could not serve the tier. The failed 2026-08-17 probe
      receipt is preserved BYTE-IMMUTABLE at
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-7d9b78/reviews/TASK-20260815-7fa865/runtime-session-receipt.json
      (sha256 bbde745d6e9f520edd2795cebe15278a203609f15186f30eb6b766424f1759e3,
      committed in 0e76e76c3), never overwritten, never deleted, and never cited
      as review provenance; the real receipt is at the v2 path
      DEC-20260817-f607d2 itself directed, routed by CORR-20260817-2b5ab1.
    residual_limitation_not_cleared: >-
      No cross-family review exists for BATCH-7d9b78. Clearing condition (a) --
      the distinct-model native-Codex route -- was never satisfied, and the
      same-model correlation discount recorded in EV-ECDLP-96bf56 and in the
      checkpoint therefore stands in full. Clearing the tier stop does NOT clear
      the independence limitation, and this decision does not treat it as
      cleared.
    the_stop_was_never_evidence: >-
      Per AGENTS.md rule 3 and this program's own repeated statement, that
      infrastructure stop was never negative mathematical evidence and is not
      retroactively converted into anything by being cleared.

