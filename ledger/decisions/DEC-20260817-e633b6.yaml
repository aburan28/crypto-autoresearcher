    and by the additive head reconciliation committed with it. The basis is
    pause_conditions[0] firing on its own terms:
    campaign_budget.maximum_batches = 53 is CONSUMED with NO completion
    criterion met, on a dual REVISE. NO COMPLETION CRITERION IS MET, and the
    status asserts nothing about ECDLP, about H-SYC-b854f4, or about
    EXP-SYC-dc854f's merits in either direction. This is NOT `closed_at_budget`:
    the lane has a concrete, cheap, fully specified successor scope and a live
    spawned candidate (RT-82A8CB-SPAWN-1), so retiring rather than suspending
