  # =====================================================================
  # THE REVIEW-TIER INFRASTRUCTURE STOP IS CLEARED
  # =====================================================================
  review_tier_infrastructure_stop:
    superseded_decision: DEC-20260817-f607d2
    status: CLEARED_NOT_BYPASSED
    what_the_stop_was: >-
      DEC-20260817-f607d2 recorded that the two BATCH-7d9b78 review tiers could
