    - It does not read a recorded Stage 0--13 gamma, C4 S_C, fishing min-gamma, or KS as H1 support.
    - It does not treat C4 or fishing-1000 as an admissible positive indicator.
    - It does not treat an H3 miss as failed_infrastructure.
    - It does not treat an H3 miss as H1 closure.
    - It does not run the 10^4-walk KS.
    - It does not permit re-running C1, C2, C3, the Stage 10 walk, the Stage 12 three-arm C4, or Stage 13 fishing-1000 as a Stage 14 measurement.
