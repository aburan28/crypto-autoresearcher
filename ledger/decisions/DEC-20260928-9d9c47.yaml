        discharged by the reviewer's own derivation and an exhaustive check at
        n in 13, 17 for a in 0, 1 with zero disagreements. Nothing is relayed
        through IDEA-20260922-1b16d7.
      what_holds: |
        The labelling half of J3 holds entirely: the stake appears exactly once
        in the three files, labelled per row as a ceiling margin; no
        outcome-table cell is below matched rho; the lead threshold is
        pre-registered word for word as the plan states it, routed to
        review-breakthrough and independent replication, with no cost, margin,
        speedup, exponent or curve consequence attached (C1 holds); the
        orbit-unknowns line is labelled in all three files as a per-orbit
        relation-count framing conditional on a per-orbit unit no approved
        contract has fixed (CORR-20260925-649e25), and the without-orbit line is
        never called unconditional without the remaining ceiling condition
        (C3 holds); HEUR-B2 is labelled a heuristic and never a bound wherever
        the transfer appears, with the extrapolation distance stated (C7 holds);
        C5 as in key_note.
      breaking_artifact: |
        J3-BREAK-1, the shuffle rule. The plan's breaking artifact "a shuffle
        rule the artifact passes" is met in a strictly worse form: the committed
        rule preserves every reading, artifact and genuine signal alike, because
        it is a permutation of alphabet labels (measured: an exact mod-4 filter
        reads 4.000000 before and after, with the permutation the identity map;
        a planted marginal-only artifact reads 4.051948 before and after). The
        prose rule, read strictly, is also non-destructive on the exact
        controls, so the defect is of the rule and not only of the code. PC-6 is
        unsatisfiable, IR-6 voids every Stage 2 arm, and SR-4 clause 3 is
        unsatisfiable jointly with clause 1, so the pre-registered LEAD branch
        is unreachable by construction. The reviewer's histogram-preserving
        resampling across points separates the two cleanly in the same
        computation (exact filter 4.000000 to 1.052267; artifact 4.05 to 4.17).
      further_defects: |
        J3-BREAK-2: PC-2 imports the bucket-averaged null scale M^(-1/2) as the
        calibration of a maximum statistic whose null scale is about
        sqrt(M^3 / S) times a log factor; on a null object of CELL-Z's own shape
        the random label reads G minus 1 equal to 0.8612 and 3.1202 where 0.7071
        and 0.5000 are allowed, and reads exactly 0 where the table is sparse,
        so PC-2 fails at every declared (cell, M) and IR-2 reads nothing. The
        SR-4 threshold is therefore not a threshold: clause 3 cannot be met,
        clause 2 (non-negative slope) is satisfied by the estimator's own
        occupancy scaling along the ladder, and only clause 1 carries
        information. J3-OBJ-1: the 1000-resample bootstrap is uncharged, about
        1.92 hours per arm and about 554 CPU-hours over 288 Stage 2 arms
        against total_cpu_hours 12. J3-OBJ-2: HEUR-B2's random-model
        justification cites Theorem A-prime, which bounds the averaged
        agreement, for the maximum statistic, and the repaired prime-field bound
        reaches only M at most N^(1/4), so the N^(1/3) arm has no random-model
        justification even conditionally. J3-OBJ-3: HEUR-B2's consequent
        "of order N^(-c) for some c greater than 0" is satisfied at a single N
        by any excess below 1 and so is unfalsifiable as formalised; the premise
        and the LEAD falsification condition are sound. J3-OBJ-4: the with-orbit
        line cites KN-FIND-47da4e against that record's own exclusion of
        materialised meet-in-the-middle oracles and its NOT MET promotion gate.
        J3-OBJ-5: the two k equal to 32 rows carry no per-row margin_reading
        and the second is the largest below-rho ceiling figure in the sheet.
        J3-OBJ-6: procedure S3-2 says four outcome rows; the block has five.
        J3-OBJ-7: part (A) is headed unconditional while naming PO-1 as an open
        obligation. Wagner-at-source deltas: the design charges k lists where
        the source stores about lg k, and the source's joins nest cumulatively;
        both make the ceiling more generous, the right direction for a ceiling.
    J4:
      owner: TASK-20260928-062eb8
      reviewer_verdict: breaks
      composed_disposition: breaks
      key_applied: K-revise-defect
      what_holds: |
        The boundaries and exclusions half of J4 is clean: no k-tree run at
        deployed parameters; target-dependent filters out of family and named
        as the widest open class; levels above 1 excluded; the d3c5a5 engine not
        used with the substitute named; d06324's four-arm table not designed;
