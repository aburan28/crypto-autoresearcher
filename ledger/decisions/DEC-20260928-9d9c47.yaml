  approval_ruling:
    target: EXP-BINSTD-de9678 (with H-BINSTD-0126fe as its hypothesis)
    ruling: Not approved. Decision revise under K-revise-defect.
    key_test: |
      K-approve requires J1 to J4 to hold, J5 to agree, every PTM to meet its
      failure signature and no tripwire fired. J5 agrees and no tripwire fired,
      but J1, J2, J3 and J4 each break and PTM-A fails its signature on the
      gate arm, so K-approve fails. K-impediment is satisfied for C5 and is not
      a defect, but it permits approval only when every other key of K-approve
      holds, which they do not. K-infra does not apply: no reviewer was unable
      to run a joint. K-indeterminate does not apply. No key is relaxed (CB-7).
    standing_authorization_note: |
      The AGENTS.md standing user authorization of 2026-09-06 is satisfied for
      this contract as for every contract; what is not satisfied is protocol
      readiness, which remains a Coordinator responsibility. A protocol whose
      pre-registered gate cannot pass on any cell, whose blocking nearby-object
      control reads the null at its declared sample size, whose lead branch is
      unreachable by construction and whose success criterion cannot be met on
      the admissible ladder is incomplete, and an incomplete protocol is
      completed, never approved and never left waiting on the user.
    status_effect: |
      No status field moves (CB-8). EXP-BINSTD-de9678 stays review_required
      with approved_by null; H-BINSTD-0126fe stays specified. Neither record is
      edited; the revision is a new record set or additive amendment set in a
      new batch, never an edit of the frozen version 1.
    what_survived_and_carries_forward: |
      The capacity certificate and its composite-order extension (J1, J5, PTM-A
      certificate arm); the ideal-tree table entries at every k with and
      without orbit unknowns, the floors, rho and the memory column (J1, J5);
      the k equal to 8 reconciliations as arithmetic; the halving criterion
      and the E/2E and E/4E constructions as code; the composite-cell alphabets
      as constructed given a verified generator; the labelling of the stake,
      the lead route, the orbit-unknowns line and the transfer heuristic (C1,
      C3, C7); the exclusions and R2 boundaries (C8); the k-tree accounting
      against Wagner at source (C5); custody, parseability and every approval
      field. The revision should change none of these beyond the ambient
      labelling of DEV-J1-1, the k equal to 32 row labels of J3-OBJ-5 and the
      wording items J3-OBJ-6 and J3-OBJ-7.

  revision_requirements:
    note: |
      The defects a version-2 contract must remedy, each with its joint and
      breaking artifact, grouped by remedy. Every item is an instrument, code,
      design-feasibility, labelling or cost-model defect; none is a
      mathematical result and none bears on any curve (CB-9). Numbering is
      this record's.
    items:
      - id: R-1
        joints: [J2, J3]
        artifacts: [DEV-J2-1, J3-BREAK-1, PC-6, IR-6, CTL-SHUFFLE, SR-4 clause 3, OC-1 separator]
        remedy: |
          Redefine the matched-marginal shuffle, in the definition and in the
          code, as a histogram-preserving resampling of h-values across points
          under a recorded seed (every bucket keeps its exact size; every
          arithmetic relation is destroyed), and pin it with a criterion it can
          fail: an exact control must collapse to within the null width and a
          planted marginal-only filter must be preserved, both as gate checks.
      - id: R-2
        joints: [J2, J3]
        artifacts: [DEV-J2-3, J3-BREAK-2, PC-2, IR-2, CTL-RANDLABEL, SR-4 clause 2]
        remedy: |
          Delete the closed-form allowance 4 x M^(-1/2); calibrate the null from
          the random-label arm's own measured distribution per (cell, M) on the
          same code path, state PC-2 and the family comparison against that
          distribution, and restate SR-4 clause 2 so a random label's own
          occupancy-driven slope does not satisfy it. State the finite-sample
          null scale of the maximum statistic in the design and cite
          KN-FIND-ffe1df's averaged-versus-maximum record as the reason.
      - id: R-3
        joints: [J2, J4]
        artifacts: [DEV-J2-4, DEV-J2-6, PTM-A gate arm, IR-4, IR-12, COST-2, COST-3]
        remedy: |
          Re-price S per (cell, filter, M) against S at or above about 100 x M^2
          (about 2^24.84 at 548 and 2^26.44 at 956 on the composite cell) and
          against the closed-form check's own need where one is kept; re-derive
          the alphabet grid and the ladder from what the repriced budget can
          read; or lower MIN_CELL with the precision loss stated. The composite
          nearby-object control must be readable at the declared S or the
          design cannot see the object it exists to see.
      - id: R-4
        joints: [J1, J2]
        artifacts: [DEV-J1-3, DEV-J2-6, ROUTE-TO-J1-1, AR-B1, CTL-LADDER, success clause 3, HEUR-B2 validation_plan]
        remedy: |
          Recompute every ladder order at design time (the Lucas recurrence is
          zero compute) and declare only AR-B1-admissible cells; the admissible
          a equal to 0 degrees below 64 are 5, 7, 9, 13, 19, 23, 41. Either
          extend the ladder to n equal to 41 with its cost priced, or relax
          AR-B1 for ladder cells with the reason stated, or restate the success
          criterion and HEUR-B2's plan for the ladder that exists. A slope with
          an interval needs more than two cells.
      - id: R-5
        joints: [J2]
        artifacts: [DEV-J2-2, ROUTE-TO-J2-1, PC-1, IR-1, CTL-IDENT]
        remedy: |
          Replace the identity arm with a control the estimator can read
          (an exact filter of the largest alphabet the sample supports, with
          G equal to M as its criterion), or exempt the identity label from
          MIN_CELL with the vacuity of G equal to M for any label under that
          exemption stated and a different identity check chosen.
      - id: R-6
        joints: [J2]
        artifacts: [DEV-J2-5, PC-8, gate_cell, CELL-O19, CELL-RC1]
        remedy: Give the ordinary cells their own order route (route B of the audit sheet applies to any curve) and skip the order-4 search where the cofactor is 2, in code and in AR-B1's text.
      - id: R-7
        joints: [J2, J4]
        artifacts: [DEV-J2-7, PC-7, PC-9, CTL-ZLZ, CTL-SAMPLING, IR-7, IR-11, PTM-A second finding]
        remedy: |
          Commit as code the Z/lZ object with the log-interval key (PC-7), the
          exhaustive-versus-sampled check (PC-9), and a divisor-set certificate
          function with the three control readings of the audit sheet as its
          pass criteria, so PTM-A's certificate arm runs against code rather
          than against the argument.
      - id: R-8
        joints: [J2, J3]
        artifacts: [DEV-J2-8, J3-OBJ-1, COST-1, bootstrap_gain, budget.stage_split]
        remedy: Cache the sampled points' labels before resampling; price the 1000-resample bootstrap in stage_split or reduce the resample count with the precision loss stated; restate the advisory ceilings to match.
      - id: R-9
        joints: [J1]
        artifacts: [DEV-J1-1, gap_against_exact_capacity_bits, closure_line, per_level_gap_step, hypothesis statement (C), outcome row CEIL, metric per_level_alphabet_gap]
        remedy: State the needed alphabet and the capacity in one named ambient on those lines, or report both ambients side by side, and carry the same into the CEIL row and the hypothesis; nothing else in the table moves.
      - id: R-10
        joints: [J2]
        artifacts: [DEV-J2-9, DEV-J2-10, DEV-J2-11, to_nb, build_dlog, seeds, trial division, SR-1 wording]
        remedy: Replace to_nb with Gaussian elimination; have the fixture find and verify a generator (order exactly N by the route B proof) and check the table has N entries; enumerate seeds 0 to 9 in gate_cell; record trial division as the specification says; add PC-7's factor and PC-14 to SR-1.
      - id: R-11
        joints: [J3]
        artifacts: [J3-OBJ-2, J3-OBJ-3, J3-OBJ-4, HEUR-B2]
        remedy: |
          In HEUR-B2's random_model_justification record that Theorem A-prime
          bounds the averaged agreement and not G and that the repaired bound
          reaches only M at most N^(1/4); state the consequent quantitatively
          (name the c for which the tree at the exact capacity stays above
          matched rho) so the heuristic can fail in principle; add to the
          with-orbit line's conditional_on that KN-FIND-47da4e declines to price
          materialised meet-in-the-middle oracles and is not a promoted finding.
      - id: R-12
        joints: [J3]
        artifacts: [J3-OBJ-5, J3-OBJ-6, J3-OBJ-7, DEV-J1-2, DEV-J1-4]
        remedy: |
          Add margin_reading to both k equal to 32 rows; change four to five in
          S3-2; head part (A) "unconditional subject to PO-1"; soften the DC-B1
          diagnosis sentence to the ambient-mix reading or leave the diagnosis
          open; either prove l prime (a Pocklington proof is within reach per
          C-J1-2) or state that the certificate's divisor set rests on the
          primary source's primality statement.
    carried_unchanged: |
      Every design condition C1 to C8 of DEC-20260928-63addc S2 binds the
