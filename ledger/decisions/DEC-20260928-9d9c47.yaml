    J1:
      owner: TASK-20260928-91b346
      reviewer_verdict: breaks
      composed_disposition: breaks
      key_applied: K-revise-defect
      what_holds: |
        The extension of Theorem C to a composite-order finite abelian group
        holds step by step; the only step in which the group order enters is
        Lagrange, as divisibility, and primality is used nowhere (C-J1-1,
        corroborated by exhaustive enumeration on six small composite groups).
        The divisor set of 4l below l is 1, 2, 4 and the capacity is exactly
        2 bits in the full-group ambient and 0 bits on the target subgroup
        (C-J1-2). Every relations, main-term, linear-algebra, total and margin
        entry of the ideal-tree table at k in 4, 8, 16, 32 with and without
        orbit unknowns reproduces to 6.4e-5 bit (C-J1-5); the k equal to 8
        reconciliations DC-B1 and DC-B2 are arithmetic and not relabelling
        (C-J1-6); matched rho, both floors and the memory column reproduce
        (C-J1-7); every line the table, rho and the floors carry is labelled
        with its ambient; D1, D2 and D3 appear only inside sentences refusing
        them; the hand values t_19 and t_17 appear only as inputs (C-J1-8);
        the 2-Sylow subgroup of the deployed row is cyclic of order 4 by the
        E(F_2) argument (C-J1-4).
      breaking_artifact: |
        DEV-J1-1. The gap column (gap_against_exact_capacity_bits in every row)
        and the closure line at k equal to 16 subtract the full-group capacity
        (2 bits) from the target-subgroup needed alphabet inside a table whose
        declared ambient is the target subgroup, where the certificate's own
        line gives capacity 0 bits. Recomputed in the declared ambient the gap
        at k equal to 16 is 25.8000 bits and the closure line 107.2000; in the
        full-group ambient 24.2000 and 102.8000 with the row's totals shifting
        by 0.8 bit. The contract's 23.8000 and 101.2000 correspond to neither.
        That is the plan's breaking artifact of a table entry differing by more
        than 0.5 bit, on a derived design figure; every self-consistent value
        lies above the contract's figure, so nothing outcome-bearing follows.
        Model-consistency and labelling defect (design condition C2), not a
        mathematical result.
      further_defects: |
        DEV-J1-3 (material for J2): the a equal to 0 Koblitz curves at
        n equal to 29 and 31 have orders 4 x 8353 x 16067 and
        4 x 373 x 1439393 by two independent integer routes, so CELL-K29 and
        CELL-K31 are inadmissible under the contract's own AR-B1; the
        admissible degrees below 64 are 5, 7, 9, 13, 19, 23, 41. Visible at zero
        compute; the red team reached the same orders independently
        (ROUTE-TO-J1-1) and asserted no admission verdict. DEV-J1-2
        (informational): the DC-B1 diagnosis sentence (division by about 188)
        is less plausible than an ambient mix inside the record; the reconciled
        value is unaffected. DEV-J1-4 (minor): l is probable-prime tested and
        sourced from Bailey Appendix A, not proved, by contract or review.
    J2:
      owner: TASK-20260928-91b346
      reviewer_verdict: breaks
      composed_disposition: breaks
      key_applied: K-revise-defect
      what_holds: |
        The fixture and calibration code extract verbatim, compile and import;
        the field arithmetic at general n, the group law, point halving and the
        halving criterion, the E/2E map, the constructed E/4E homomorphism, the
        cyclic-cell discrete-logarithm filters and the alphabet-548 and -956
        homomorphisms of the composite n equal to 17 cell are correct where
        tested against the validator's own disjoint arithmetic (C-J2-2, C-J2-8,
        C-J2-9); design finding DF-1 is confirmed; the rules block every
        Koblitz-specific arm until the gate passes (S1-3, IR-14); all 23
        experiment template fields and every approval field are present,
        approved_by is null, the approval block names DEC-20260928-9d9c47, the
        three files hash to the snapshot (AC-1 to AC-4, C-J2-15); HEUR-B1 and
        HEUR-B2 carry sample, predicted distribution, comparison and tail, with
        the transfer labelled a heuristic; KN-FIND-007's relay is adequate
        (C-J2-16); the stake carries its memory figure (C-J2-17); FIXTURE-B2's
        two calibration rows are satisfiable in principle (C-J2-14).
      breaking_artifact: |
        DEV-J2-1, the strongest. The committed matched_marginal_shuffle permutes
        bucket labels within groups of equal sampled frequency and composes the
        permutation with h; the bucket-gain statistic is exactly invariant
        under any relabelling of the alphabet, so G_shuffle equals G for every
        filter and every sample (static bijection argument plus dry calls on
        synthetic integers, C-J2-3). Pass criterion PC-6 can never pass, SR-1
        stops every cell, and CTL-SHUFFLE separates nothing. The
        specification's prose definition describes a point-level shuffle the
        code does not implement and lacks a tolerance rule for equal marginals.
        The plan's breaking artifact "fixture non-runnable in principle" is met
        in the form of a fixture that runs and cannot pass its own
        pre-registered gate.
      further_defects: |
        DEV-J2-2: the identity control reads G equal to 0 on every cell because
        MIN_CELL 100 excludes every singleton conditioning cell (C-J2-4; the red
        team reached the same, ROUTE-TO-J2-1). DEV-J2-3: PC-2's closed-form
        allowance 4 x M^(-1/2) is not met by the sampled maximum statistic at
        S equal to 2^20 and the percentile bootstrap of that maximum excludes 1
        and the point estimate (C-J2-5). DEV-J2-4: at S equal to 2^20 the
        alphabet-548 and -956 homomorphisms have 3.5 and 1.1 samples per
        conditioning cell and G reads 0, so IR-4 makes no null admissible
        anywhere (C-J2-6). DEV-J2-5: gate_cell applies the Koblitz Lucas
        recurrence and the order-4 search to the ordinary cells CELL-O19 and
        CELL-RC1, which fail PC-8 as coded (C-J2-10). DEV-J2-6: with two
        admissible ladder cells (19, 23) success clause (3) cannot be met and no
        slope with an interval can be fitted; at N^(1/3) only CELL-K19 is
        estimable under IR-12. DEV-J2-7: PC-7 (log-interval key) and PC-9
        (exhaustive versus sampled G) have no committed code; CTL-ZLZ and
        CTL-SAMPLING are blocking. DEV-J2-8: bootstrap_gain re-evaluates the
        filter on every resample, about 3.1e9 evaluations per arm, against 6
        hours per run and 12 CPU hours in total (C-J2-12). DEV-J2-9: to_nb is
        not Gaussian elimination and fails for most inputs (C-J2-13). DEV-J2-10:
        the composite cell's generator is an unverified external input to
        build_dlog. DEV-J2-11: minor specification-versus-code mismatches
        (trial division, seeds, the PC-7 factor and PC-14 absent from SR-1).
        DEV-J2-12: KN-FIND-007 read and consistent (informational).
    J3:
      owner: TASK-20260928-062eb8
      reviewer_verdict: breaks
      composed_disposition: breaks
      key_applied: K-revise-defect
      key_note: |
        K-impediment is also engaged and satisfied for design condition C5, and
        is not a defect: Wagner 2002 was reached at source by the reviewer
        (provenance retrieved) and the producer's first-principles re-derivation
        under IMP-WAGNER is faithful to it; Fong-Hankerson-Lopez-Menezes was
        reached in part (abstract and Section 1; Section 3 not machine-readable),
