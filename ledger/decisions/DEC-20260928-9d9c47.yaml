  knowledge_promotion:
    promoted: []
    not_warranted: |
      This is a contract revision, not an evidence review. No evidence record
      exists for EXP-BINSTD-de9678 (zero runs), no support or reject_scoped
      decision is made, and there is no replicated or strong evidence to
      promote. The blind agreement of J5 with the Stage 0 certificate and
      table is arithmetic on a stated model and a subgroup-lattice argument
      already carried by KN-FIND-ffe1df for prime order; its composite-order
      extension is a proof obligation of a hypothesis that is not yet approved,
      and promoting it before the contract runs would promote a design figure.
      Two candidate technique lessons are named for a later curation act and
      not promoted here: that the bucket-gain statistic is invariant under any
      relabelling of the alphabet, so a label-permutation shuffle is never a
      null; and that the null scale of a maximum-over-cells statistic depends on
      S/M^2 and not on M alone. Both are the reviewers' review computations,
      not evidence records.

