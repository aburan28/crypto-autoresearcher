  # ---------------------------------------------------------------------------
  j5_versus_contract:
    rule: |
      CB-4. J5's values (rederivation-report.yaml Q1 to Q4, computed from the
      card's statement and parameters alone) compared with the contract's
      frozen certificate and table (proof-search-map-audit.yaml
      stage_0.capacity_certificate and stage_0.ideal_tree_table, snapshot-bound)
      quantity by quantity, under the plan's agreement tolerance: Q1 exact on
      the set and the bit count; Q2 and Q3 within 0.5 bit per entry; Q4 within
      1 bit. Every quoted ceiling margin is the contract's counterfactual design
      figure conditional on a filter the certificate excludes exactly; the
      with-orbit entries are additionally conditional on the per-orbit unit no
      approved contract has fixed (CORR-20260925-649e25). None is a cost, a
      prediction or an outcome.
    q1_primary: |
      J5: admissible alphabets of the group of order 4l are exactly the six
      divisors 1, 2, 4, l, 2l, 4l; largest strictly below l is 4; capacity
      2 bits exactly; independent of isomorphism type. Contract: admissible
      alphabets below l [1, 2, 4]; exact capacity 2.00 bits; target-subgroup
      capacity 0.00 bits. Agree, exact. J5 also verified l prime three ways
      (probable-prime tests and trial division to 10^6; no proof), consistent
      with the contract's input.
    q1_control_z2_17: |
      J5: eighteen admissible alphabets 2^0 to 2^17; capacity below 2^17 is
      16 bits. Contract control: the subgroup filters of every alphabet 2^i,
      capacity below 2^n is n minus 1 bits, which is 16 at n equal to 17.
      Agree, exact.
    q1_control_composite: |
      J5: the twelve divisors of 130972 including 548 and 956; largest below 239
      is 137; capacity log2(137) equal to 7.0980 bits. Contract control: every
      divisor including 548 and 956; capacity below 239 is log2(137), about
      7.10 bits. Agree, exact on the set, 0.002 bit on the rounded figure.
    q2_k8: |
      log2 L 32.25 against 32.2500; per-attempt 35.25 against 35.2500;
      without orbit unknowns relations 32.25, linear algebra 67.50, total 68.50
      against 32.2500, 67.5000, 68.5000; with orbit unknowns relations 24.22,
      linear algebra 51.43, total 59.47 against 24.2166, 51.4332, 59.4721.
      Agree, every entry within 0.004 bit; J5's six-decimal values 24.216577,
      51.433154, 59.472073 match the contract to four decimals.
    q2_k16: |
      log2 L 25.80 against 25.8000; per-attempt 29.80 against 29.8000;
      without orbit unknowns 25.80, 55.60, 56.60 against 25.8000, 55.6000,
      56.6000; with orbit unknowns 17.77, 39.53, 47.57 against 17.7666,
      39.5332, 47.5721. Agree, every entry within 0.004 bit. J5 independently
      observed the model identity that the two without-orbit terms coincide so
      the total is exactly one bit above the main term, which is the contract's
      structural_observation and its DC-B2 reconciliation.
    q3_rho: J5 60.8090 (60.80903656396743 high precision) against the contract's 2^60.8090 under the same formula and convention. Agree, exact to four decimals.
    q4_margins: |
      k equal to 8 without orbit unknowns +7.69 against +7.6910; with orbit
      unknowns -1.34 against -1.3369; k equal to 16 without orbit unknowns
      -4.21 against -4.2090; with orbit unknowns -13.24 against -13.2369.
      Agree, every margin within 0.004 bit, inside the 1-bit tolerance. All four
      are ceiling margins under the label above.
    q0_choices: |
      J5 reported 17 undetermined choices and, for each, the reading adopted
      and the dependence. None changes a compared value under the reading J5
      adopted, and every adopted reading coincides with the contract's stated
      model: strict bound (C6), linear-algebra coefficient k (C11), N equal to
      l (C12), real L (C8), exact sum (C17), log2 of the integer l (C10). J5
      recorded the alternative readings and their sensitivities (coefficient 1
      shifts the without-orbit totals by about 0.83 to 0.91 bit; N equal to 4l
      shifts log2 L by 0.5 or 0.4 bit; the non-strict bound would change the
      capacities) only so a divergence could be localised; none was adopted and
      none is a divergence. K-indeterminate is therefore not triggered.
    what_j5_did_not_re_derive: |
      The gap column, the closure line and the k in 4, 32 rows were not J5
      quantities, so J5 says nothing about DEV-J1-1; that finding rests on the
      validator's recomputation alone and on this composer's reading of the
      table's declared ambient, and it is a labelling and model-consistency
      defect on a derived figure, not a disagreement between implementations.
    reading: |
      Two implementations that share nothing produce the same exact capacity
      and the same ideal-tree table. Under PD-R1 the validator's concurrence is
      weak corroboration because the plan's prior was informed; J5's agreement
      is the structurally blind check and it is the strongest corroboration of
      the Stage 0 arithmetic available in this round.

  # ---------------------------------------------------------------------------
  prior_versus_outcome:
    rule: |
      CB-5. The plan's coordinator_prior (written before the object existed and
      before any reviewer ran) compared with the composed outcome. Under PD-R1
      the prior was informed, not blind: the plan's author had read
      IDEA-20260926-136bd3 and IDEA-20260926-d06324 in full. Concurrence of the
      non-blind validator with the proposal's values is therefore weak
      corroboration; J5 is the structurally blind check.
    per_joint:
      - joint: J1
        prior: holds with probability about 0.65; if it breaks, on the k equal to 8 slips reconciled by relabelling or on the linear-algebra term chosen silently
        outcome: breaks
        reading: |
          Direction overturned, location not predicted. The two named break
          points did not occur (DC-B1 and DC-B2 are arithmetic; the coefficient
          k and B equal to L are stated). The break is a mixed-ambient gap
          column and closure line the prior did not anticipate, plus a
          zero-compute ladder-admissibility fact (n equal to 29, 31) the design
          deferred to setup.
      - joint: J2
        prior: holds with probability about 0.5; expected break on C4, the E/4E map and halving as prose, or the composite alphabets asserted
        outcome: breaks
        reading: |
          Direction confirmed, location wrong. The E/4E map, halving and the
          composite alphabets are correct as code. The break is in the
          estimator and its pre-registered gate (shuffle invariance, identity
          occupancy, null-scale calibration, composite sample size, ordinary
          cells in a Koblitz setup path, missing PC-7 and PC-9 code, uncharged
          bootstrap cost), none of which the prior named.
      - joint: J3
        prior: holds with probability about 0.6; expected break on a stake sentence leaking into the outcome table (TB-1) or the orbit-unknowns line labelled unconditional (C3)
        outcome: breaks
        reading: |
          Direction overturned, and the prior's named break points both held
          cleanly (TB-1 not fired; C3 met). The break is that the controls
          cannot do what the labels promise: the shuffle rule separates nothing
          and the null criterion is calibrated to the wrong quantity, the same
          averaged-versus-maximum confusion KN-FIND-ffe1df records for the
          prime-field round.
      - joint: J4
        prior: holds with probability about 0.8; expected break on PTM-A if the certificate code assumed prime order
        outcome: breaks
        reading: |
          The most confident joint broke, one layer below where the prior
          looked: the certificate argument survives PTM-A and assumes nothing
          about primality, but there is no certificate code, and the gate arm
          reads the null at the declared sample size.
      - joint: J5
        prior: agrees on the exact capacity with probability about 0.95 and on the k equal to 16 table within 1 bit with probability about 0.7, the gap being model choices
        outcome: agrees on every quantity, exact on the capacity and within 0.004 bit on every table and margin entry
        reading: Confirmed, and stronger than expected; no model-choice gap appeared because the card fixed the model and J5 adopted it as written.
    overall:
      prior: probability about 0.3 that the round composes to approve; most likely outcome revise on C4 (the fixture) or C3 (the orbit-unknowns label), each a cheap remedy
      outcome: revise, on C4 among other conditions
      reading: |
        The headline matched and the substance did not. The prior expected a
        thin revise on one of two named conditions; the outcome is a revise on
        four joints whose specific defects the prior did not name, and the two
        specific defects the prior did name did not occur. The remedies are
        nonetheless local and cheap, as the prior expected, and none touches
        the capacity certificate, the ceiling arithmetic, the exclusions or
        the labelling. Of the three listed prior-overturning events, none
        occurred: J5 agreed on the capacity, no exact filter between 4 and l
        was exhibited, and the composite-order extension holds at every step.
    what_this_says_about_the_prior: |
      An informed prior located the risk in the contract's text and labelling,
      where the producer had been told to be careful and was; the risk sat in
      the instrument's statistics, where nobody in the round had yet looked
      closely. The next plan on this lane should carry a prior about the
      estimator's finite-sample behaviour, not only about the labels.

