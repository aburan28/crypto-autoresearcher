  rationale:
    - |
      Keys as written. K-approve needs every one of J1 to J4 to hold; four
      break, each on an artifact from the plan's own breaking list, and one
      proves-too-much control fails its declared signature. Approval under any
      other reading would be a relaxation after reading the reports, which
      CB-7 forbids and a protocol_amendment cannot supply inside a composition.
    - |
      The arithmetic is not the problem. The blind re-derivation agrees with
      the frozen certificate and table on every quantity to 0.004 bit, the
      composite-order extension holds step by step, and the halving criterion
      and the k-tree accounting are confirmed at source. What fails is the
      instrument: a shuffle that is a relabelling, a null calibrated to the
      averaged rather than the maximum statistic, sample sizes the estimator's
      own exclusion rule cannot support, a ladder two of whose cells the
      contract's own admission rule rejects, and an uncharged bootstrap. Those
      are cheap, local and enumerated, which is why the decision is revise and
      not a return to ideation.
    - |
      Revise before run, not run then invalidate. As frozen, SR-1 would stop
      every cell at the gate and IR-4 would make every null inadmissible, so a
      run would produce outcome row ART on every arm and read nothing. Spending
      the run to learn what the reviewers already showed at zero compute is
      make-work, and the ECC-first rule removes the batch ceiling, not the duty
      to rank a task ahead of doing nothing.
    - |
      The lead branch must be reachable. A contract whose most valuable
      outcome cannot occur by construction is not a falsifiable test of its
      null prediction on the tested range, and the target-result profile asks
      for heuristics paired with validation that can fail.
    - |
      Custody and independence hold, so the reports are admissible as
      evidence for this decision: the six digests were fixed before any read,
      the object hashes to its snapshot at every point checked, the
      independence check passed as reported, blindness was attested and
      respected, and no tripwire fired.

