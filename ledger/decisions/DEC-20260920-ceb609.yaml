  schema_diagnosis: >-
    tools/research_dispatch.py defines STATES = {"queued", "running",
    "blocked"} ∪ TERMINAL_STATES. The BATCH-93320c queue authored under
    DEC-20260918-7e0865 used state: "ready" on both producer tasks. That value
    is not in STATES, so validate_queue raises "tasks[N].state is invalid".
    The correct initial non-terminal state for an unblocked producer is
    "queued". Additionally, queue.handoff was a path string rather than an
    embedded object, and no archive tasks assigned the producers — both also
    fail validate_queue. Smallest accepted repair: in-place state fix to
    "queued" with tasks_state_revisions citing this DEC; embed handoff objects;
    add snapshot-archive queue rows TASK-20260920-06808e and
    TASK-20260920-e51da0. No completed-archive binding was rewritten.

