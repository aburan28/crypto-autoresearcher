coordinator_decision:
  id: DEC-20260921-e81e25
  decided_by: coordinator
  decided_at: '2026-09-21'

  context: >-
    NA-1 follow-up to the /review-evidence round on EXP-FROB-91ee9c
    (DEC-20260921-3678fc, EV-FROB-2fe225, decision inconclusive). This
    decision approves protocol_amendment
    experiments/EXP-FROB-91ee9c/amendments/DEC-20260921-e81e25.yaml
    (specification.yaml v1 -> v2), which extends EXP-FROB-91ee9c's
    maximum_runs from 1 to 2 and authorizes exactly one additional bounded
    Executor run completing the C2/C3/C4 control battery on the second
    eligible object curve of FROB-SPLIT-q11n5 (A=1,B=2,N=10061) and
    FROB-EQDEG-q19n5 (A=1,B=1,N=117991) -- the curves that actually show
    non-trivial object-arm variation and were never given the battery in
    RUN-FROB-91ee9c-7119f2 -- so that H-FROB-d93575's success_criterion
    clause (6) / falsification_criterion clause (c) can finally be
    evaluated.

  decision: approve

  target_ids:
    - EXP-FROB-91ee9c
    - H-FROB-d93575
    - DEC-20260921-3678fc
    - EV-FROB-2fe225

  rationale:
    - >-
      WHY AN AMENDMENT AND NOT A NEW EXPERIMENT. specification.yaml's own
      SR-6 requires an additive protocol_amendment for any change to a
      parameter, metric definition, control, threshold or outcome rule, and
      permits nothing else to be edited in the frozen file. The change made
      here is exactly a parameter (budget.maximum_runs) plus an execution-
      scope extension (which curve indices receive the already-defined
      C2/C3/C4 controls); no control's DESIGN, no metric definition, no
      threshold, and no success/falsification/decision-branches text is
      touched. DEC-20260921-3678fc's own NA-1 named the amendment path as
      the Coordinator's to choose "if the frozen contract permits extending
      curve-index coverage without altering any threshold, control design
      or outcome rule" -- it does, so amendment is used rather than a new,
      differently-scoped EXP-* record, which would have fragmented one
      question (does the partition-cost effect on FROB-SPLIT-q11n5/
      FROB-EQDEG-q19n5's informative curve survive the same matched
      controls that already ran on the degenerate curve?) across two
      experiment identities for no discriminating benefit.
    - >-
      WHY FROB-NOLATTICE-q13n5's SECOND CURVE IS EXCLUDED. Its achievable
      slot-dimension multiset is {0,4} on every curve by construction (one
      non-trivial factor of degree 4; specification.yaml
      named_parameter_sets.FROB-NOLATTICE-q13n5.expected_factorisation),
      independently reconfirmed for both of its curves in
      RUN-FROB-91ee9c-7119f2 (report.md section 3, certificates.json). This
      is a FIELD-level structural fact, not a per-curve empirical unknown
      (the same status as the C5 ker-Tr identity, verified once per cell
      rather than per curve in J4 of EV-FROB-2fe225): spread=1 on every
      arm, on any curve, in this cell is already certain by algebra alone,
      so running the battery a second time there would reconfirm a known
      certainty and cannot bear on J3, which is specifically about whether
      the SPLIT/EQDEG effect is structural. Extending to it would be
      make-work, not completeness.
    - >-
      WHAT THIS DECISION DOES NOT DO. It does not change H-FROB-d93575's
      status (it stays `inconclusive_control_battery_curve_scope_gap`, set
      by DEC-20260921-3678fc, until the new run is itself reviewed); it
      does not re-score, re-open or edit RUN-FROB-91ee9c-7119f2, which
      remains exactly as committed in PR #1311 (its own snapshot commit;
      PR #1315 touched only the review-round records -- analysis.md,
      EV-FROB-2fe225.yaml, DEC-20260921-3678fc.yaml, and H-FROB-d93575.yaml's
      status field -- and never touched runs/TASK-20260914-7119f2/); and it
      asserts nothing about whether the informative curves' spread
      comparison will pass or fail once measured.
    - >-
      STANDING AUTHORIZATION. AGENTS.md's standing user authorization
      (2026-09-06) is the user-approval basis for this amendment and its
      dispatch; no user confirmation is sought or required. This
      Coordinator checked that the amendment's scope is genuinely additive
      (SR-6-compliant) and that the new handoff's budget, constraints and
      completion gate are complete and non-null before recording approval.

  approval_checklist:
    protocol_complete: true
    sr6_compliance_confirmed: >-
      No control design, metric definition, threshold, success_criterion,
      falsification_criterion or decision_branches text is changed; the
      amendment touches only budget.maximum_runs and execution-scope
      (curve-index coverage). Verified against
      experiments/EXP-FROB-91ee9c/specification.yaml directly (predecessor
      sha256
      9d66c4f7914250a09a5083a3e97c85af9f26ba04755b906105c200d41c75daa4,
      matching the amendment's own predecessor_sha256 field).
    fields_verified_non_null:
      - amendment reason, changes, unchanged, affected_runs, confirmatory_status
      - handoff objective, constraints, deliverables, budget, completion_gate

  affected_runs: []
  confirmatory_status: preserved

  evidence_refs:
    - experiments/EXP-FROB-91ee9c/amendments/DEC-20260921-e81e25.yaml
    - ledger/decisions/DEC-20260921-3678fc.yaml
    - ledger/evidence/EV-FROB-2fe225.yaml
    - experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/report.md
    - experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/manifest.yaml
    - experiments/EXP-FROB-91ee9c/specification.yaml

  limitations:
    - >-
      THIS DECISION APPROVES AN AMENDMENT AND A DISPATCH, NOT EVIDENCE. No
      new run exists yet; H-FROB-d93575's status is unchanged by this
      decision.
    - >-
      Scope is exactly the two named curves' C2/C3/C4 batteries plus an
      object-arm consistency recomputation; nothing else in
      EXP-FROB-91ee9c is re-examined, and FROB-EXT-q13n7 remains
      not_run_resource, untouched by this amendment.
    - >-
      A future /review-evidence round is required to interpret the new
      run's results; this decision pre-judges neither clause (6)/(c)'s
      outcome nor H-FROB-d93575's eventual status.

  next_actions:
    - >-
      NA-1 (coordinator, dispatching session): merge origin/main, then make
      ONE isolated snapshot archive staging exactly
      experiments/EXP-FROB-91ee9c/amendments/DEC-20260921-e81e25.yaml,
      ledger/decisions/DEC-20260921-e81e25.yaml and
      ledger/handoffs/TASK-20260921-51bc02.yaml under archived_by
      TASK-20260921-23341e, then push and open or refresh a PR against main
      naming all three records.
    - >-
      NA-2 (coordinator, dispatching session): after the snapshot is
      verified and published, dispatch the Executor against
      TASK-20260921-51bc02.
    - >-
      NA-3 (coordinator): on the new run's completion, open a
      /review-evidence round evaluating the COMBINED evidence (both
      RUN-FROB-91ee9c-7119f2 and the new run) specifically to resolve J3
      and either affirm or falsify success_criterion clause (6) /
      falsification_criterion clause (c), and update H-FROB-d93575's status
      accordingly.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT AN EVIDENCE-REVIEW DECISION. This decision approves a protocol
      amendment and a bounded execution dispatch; no EV-* record is in
      scope and no run has executed under it yet. The knowledge-promotion
      gate applies at NA-3, once the new run is reviewed.
