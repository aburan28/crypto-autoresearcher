coordinator_decision:
  id: DEC-20260822-5a5635
  context: >-
    Review of EXP-ECRANK-e1e30e (runs 001-003) against H-ECRANK-28dba7, opened
    from the user goal "generate an elliptic curve with a rank higher than 30".
    The goal statement does not name a base field, and the two readings are not
    close: over Q, rank >= 31 is an OPEN world record (the record is 30,
    Alpoge-Howell 2026); over number fields of growing degree, rank >= 31 is
    constructible and the real question is the field degree and the strength of
    the certificate. The experiment was scoped to the second reading and says so
    everywhere.
  decision: support
  target_ids: [H-ECRANK-28dba7]
  rationale:
  - >-
    Prediction P1 HELD and is the load-bearing result. At k = 5 the curve of
    conductor 53 attains all 32 distinct classes, giving rank >= 32 over a
    degree-32 field by an argument with no numerical step anywhere: on-curve and
    non-torsion checks in exact rational arithmetic, independence by distinct
    Galois characters. The independent verifier reports 0 errors.
  - >-
    Prediction P2 HELD exactly as stated: at k = 4 the distinct-class count is
    15, at most 16 by construction, so the degree-16 bound of 32 comes from
    multiplicities and carries the weaker regulator-based certificate. The
    record separates the two bounds rather than reporting the larger one.
  - >-
    Prediction P3 HELD. The k = 3 control tops out at 20 across the entire
    502-curve pool. The pipeline does not report success at every degree, which
    is the only reason its successes mean anything.
  - >-
    The verification apparatus was itself measured, and it fired. The first
    build of the multiplicity certificates was rejected: 16 points were off
    their stated curves because of an XOR cancellation bug in coset transport.
    Independent verification is therefore load-bearing here in fact, not just in
    design.
  - >-
    Evidence strength `strong` is justified by the certificate class rather than
    by replication count: the primary claims are exact finite checks that any
    reader can re-run with the Python standard library, on artifacts committed
    in full.
  evidence_refs: [EV-ECRANK-b6c9b6]
  limitations:
  - >-
    NO CLAIM IS MADE ABOUT RANK OVER Q, and none may be read into this decision.
    Rank >= 31 over Q is open; the record over Q is 30 (Alpoge-Howell 2026). All
    certified bounds here require base change to a field of degree >= 16.
  - >-
    The degree-2 result is RELATIVE: rank E(Q(sqrt d)) >= rank E(Q) + 1. Only the
    "+1" is certified here. The "30" is an external published input whose
    internal consistency was re-checked (all 30 generators on-curve exactly,
    30x30 regulator 1.07e37, least eigenvalue 0.294, matrank 30 at two
    precisions) but whose discovery was not reproduced.
  - >-
    The multiplicity bounds (deg 16 -> 32, deg 32 -> 52, deg 64 -> 68) rest on
    numerically evaluated height regulators and are strictly weaker artifacts
    than the eigenspace-only bounds (deg 32 -> 32, deg 64 -> 64).
  - >-
    Degree 16 is the smallest degree THIS PIPELINE reached at rank >= 31. It is
    not a proven floor. The binding constraint is base rank over Q: the search
    found no twist of rank >= 5 and only two curves of rank 4, and the degree-2
    row shows what a rank-30 input buys immediately.
  next_actions:
  - >-
    OPTIONAL successor, not a blocker: obtain base curves of rank >= 8 over Q
    (Mestre-style construction rather than twist search, which measurably failed
    here) and re-run the same k = 3 and k = 4 optimisation. The degree-8 rung is
    the first genuinely uncertain one and the experiment already measures the
    exact quantity that decides it.
  - >-
    Do NOT pursue rank >= 31 over Q with this machinery. The method's ceiling at
    k = 0 is the base curve's own rank; there is no path from here to the record.
  knowledge_promotion:
    promoted: [KN-FIND-fd382f, KN-TECH-eb06ea]
    not_warranted: null
  decided_by: coordinator
  decided_at: '2026-08-22T07:20:00+00:00'
