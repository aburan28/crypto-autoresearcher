coordinator_decision:
  id: DEC-20260922-5796b8
  decided_by: coordinator
  decided_at: '2026-09-22'
  goal_id: GOAL-FROB-6333a9
  question_id: RQ-FROB-7d8dd4
  task_id: TASK-20260922-451b0e

  identifier_provenance: >-
    All six identifiers minted with `python3 tools/allocate_id.py --next <type>`
    and each confirmed with `--check` before use, 0 occurrences across the
    25863 identifier-bearing paths scanned: EXP-FROB-ec08b5, H-FROB-6774fb,
    RUN-FROB-627924, EV-FROB-d336b0, TASK-20260922-451b0e, and this record's own
    DEC-20260922-5796b8. No token was proposed without being checked.

  decision: >-
    Design IDEA-20260918-9abf42 into H-FROB-6774fb and EXP-FROB-ec08b5; approve
    that experiment; accept EV-FROB-d336b0 as supporting evidence of `strong`
    strength; move H-FROB-6774fb from `proposed` to `supported`; and record
    impediment IMP-20260922-stage0 against GOAL-FROB-6333a9 for the nineteen
    failed EXP-FROB-d8aa37 stage0 launches, with a diagnosis and a clears_when.
    The goal stays `active`.
  target_ids:
    - H-FROB-6774fb
    - EXP-FROB-ec08b5
    - EV-FROB-d336b0
    - GOAL-FROB-6333a9
    - IDEA-20260918-9abf42
  summary: >-
    Designs IDEA-20260918-9abf42 into an experiment, approves it, records its
    completed run, and accepts EV-FROB-d336b0. The factor-base half of
    RQ-FROB-7d8dd4 is answered: the Frobenius-orbit gain in a Gaudry/Diem factor
    base is exactly n and never more, it is available only on the coarse
    dimension lattice cut by the divisors of T^n - 1, and at the ECC2K-130 and
    NIST K-163 extension degrees it is a net loss at every m tested.

  decisions:
    - id: D1
      action: design_idea_into_experiment
      subject: IDEA-20260918-9abf42
      rationale: >-
        The proposal was `proposed` with no hypothesis and no experiment citing
        it -- an open ECC idea, which CLAUDE.md rule 11 makes ranked work to be
        designed into an experiment. Its counting theorem was already verified
        `holds` under DEC-20260920-f1e672. It is now carried by H-FROB-6774fb
        and EXP-FROB-ec08b5, which extend it from which stable factor bases
        EXIST to what they are WORTH.
    - id: D2
      action: approve_experiment
      subject: EXP-FROB-ec08b5
      rationale: >-
        Protocol complete and frozen before execution: object, null object,
        nearby-object control, four independent methods for the structural
        claims and two independent derivations of the orbit census, five
        preregistered predictions each with an explicit falsification condition,
        declared scope and declared budget. Zero-cost falsification checks
        precede any expensive step, per docs/inventor-protocol.md section 8.
    - id: D3
      action: accept_evidence
      subject: EV-FROB-d336b0
      direction: supports
      strength: strong
      rationale: >-
        All five preregistered predictions held; both controls failed on every
        curve cell as required; the exact orbit-count prediction was exact on 14
        of 14 cells. Strength capped below `decisive` because the curve panel
        reaches only toy field sizes, so the orbit-length clause is verified
        exactly at small n and derived, not measured, at cryptographic n.
    - id: D4
      action: set_hypothesis_status
      subject: H-FROB-6774fb
      from: proposed
      to: supported
      rationale: >-
        Supported at the tested scale and within the declared scope, on
        EV-FROB-d336b0. Not `established`: the scope is one factor-base family
        and the decisive measurements are toy-scale.
    - id: D5
      action: record_impediment
      subject: GOAL-FROB-6333a9
      rationale: >-
        EXP-FROB-d8aa37 stage0 has failed to complete on nineteen consecutive
        launches. The cause is now identified and is an engineering defect, not
        an infrastructure accident. Recorded as an impediment with a
        clears_when, per AGENTS.md "Goals are never paused"; the goal stays
        `active` and this experiment is progress on it.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      The result is strong and exact but toy-scale on its decisive clause, and
      the lane has not yet had an independent validator or red-team pass over
      it. Promotion to a KN-FIND entry is proposed as the successor action once
      independent review has run, not asserted here. Naming the promotion gate
      and declining it is the required behaviour, not an omission.

  impediment_recorded:
    what_is_blocked: >-
      EXP-FROB-d8aa37 stage0, trial `stage0-q8-n3-complete`, has not completed
      in nineteen consecutive launch attempts across trial plans v3 to v23.
    diagnosis: >-
      NOT simply an infrastructure accident, and the lane's own records should
      stop treating it as one. Two engineering defects in the frozen driver make
      completion impossible in an ephemeral container, and a twentieth identical
      relaunch would fail the same way:
        (1) UNBOUNDED AUDIT STREAM. driver-v2.py writes one JSON record per
            signed tuple (panel(), the `for points in itertools.product(F,
            repeat=m)` census) and per calibration coordinate. The partial
            roots.jsonl.gz of RUN-FROB-4b8e05 reached 2443452479 bytes in about
            three hours, exceeding GitHub's 100 MiB per-file limit, so even a
            completed run could not be archived as specified.
        (2) NO CHECKPOINTING. The driver has no resume path: every restart
            recomputes from zero, so a container reclaimed at three hours loses
            all three hours. With a 24-hour watchdog against an environment that
            is reclaimed after inactivity, the trial cannot finish however many
            times it is relaunched.
      A third, smaller point: `sage` is not on PATH in a fresh container of this
      environment (it is at /opt/conda-sage/bin/sage), so the v23 launch command
      as written in trial-plan-stage0-v23.json would fail immediately with
      `sage: command not found` before any science began.
    clears_when: >-
      The stage0 driver is amended, by additive protocol amendment and never by
      rewriting the frozen record, to (a) emit aggregate counters plus bounded
      witness records instead of a per-tuple stream, (b) checkpoint per cell with
      a --resume path so a reclaimed container loses one cell rather than the
      whole run, and (c) resolve the interpreter by absolute path or PATH
      preamble. EXP-FROB-ec08b5's driver is the worked reference for all three:
      the same environment ran its five phases to completion in 53 seconds with
      51 KB of artifacts.
    recheck: >-
      On the next session that opens this goal. Do not authorise a twentieth
      identical relaunch of stage0-q8-n3-complete before the amendment lands;
      relaunching unchanged is the one action already known to fail.
    is_not: >-
      This impediment is NOT negative mathematical evidence about H-FROB-73df22
      or about anything else. No stage0 run reached a checker, so no claim,
      certificate or count is being withheld; there is nothing scientific to
      report from those nineteen attempts.

  next_actions:
    - >-
      Independent validation of EXP-FROB-ec08b5 under `validator`: re-derive the
      attainable dimension spectrum at n in {41, 43, 131, 163} from the divisors
      of T^n - 1 without using this repository's code, and re-check the exact
      orbit-count prediction on at least one curve cell.
    - >-
      Red-team challenge under `red-team`: the cost model in clause (iv) is the
      soft joint. Attack the claim that relation count and linear-algebra
      dimension both scale with the number of factor-base CLASSES rather than
      elements, and look for a factor-base family outside the F_V form that
      escapes the dimension lattice.
    - >-
      On successful review, promote to a KN-FIND entry: the availability of the
      Frobenius-orbit factor base is decided by ord_n(q) alone, and it is
      unavailable at the ECC2K-130 and K-163 degrees.
    - >-
      Amend EXP-FROB-d8aa37 stage0 per the clears_when above before any further
      launch attempt.

  scope_exclusions_respected:
    - No deployed Koblitz or ECC2K-130 curve is an attack instance; the real
      extension degrees appear only as parameters of a structural census.
    - The GFPN-excluded combined WDSat+torsion+coset arm is untouched.
    - No a77711 corollary is cited and IDEA-20260918-9abf42 is not rewritten in
      place, per the mandatory repair in DEC-20260920-f1e672.

