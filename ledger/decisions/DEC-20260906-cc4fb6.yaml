  context: >-
    Ledger-archive step for RUN-MLKEM-12d9b8-001 (EXP-MLKEM-12d9b8, committed
    b47237c99 under DEC-20260906-b60887's authorization and amendments/v1.yaml).
    Both required independent reviews are complete: validation
    (coordination/goals/GOAL-QALG-001/reviews/RUN-MLKEM-12d9b8-001-validation/report.yaml,
    verdict CONFIRM) and red-team
    (coordination/goals/GOAL-QALG-001/reviews/RUN-MLKEM-12d9b8-001-redteam/report.yaml,
    verdict REVISE). This decision synthesizes both, files the required
    correction, promotes the durable finding, and records the resulting
    hypothesis status.
  decision: support
  target_ids:
    - H-MLKEM-36f511
    - EXP-MLKEM-12d9b8
    - RUN-MLKEM-12d9b8-001
    - EV-QALG-8d85be
    - KN-FIND-3245f1
    - CORR-20260906-69ff2a
  rationale:
    - >-
      BOTH REVIEWS AGREE THE HEADLINE FINDING SURVIVES. The Validator
      independently recomputed all 12 (level, c) Q-values and all 6
      (level, B) combinatorial-ceiling values from a from-scratch script,
      matching raw-result.json byte-for-byte, and confirmed UNREALIZABLE
      holds at every pair. The Red Team's six-attack falsification attempt
      broke nothing in the arithmetic or the reported verdict: the ceiling
      formula was confirmed sound across the full |S|=m variable space (not
      an undercount), the c-sweep robustness claim was independently
      source-verified against the paper's own text, no proves-too-much
      counterexample was found within the claim's declared scope, and no
      claim-ceiling overreach was found anywhere in the run's artifacts.
      Both reviews' own words: Validator's verdict_rationale states the
      finding is "an admissible research receipt"; Red Team's
      verdict_rationale states it "survives every attack attempted below"
      and its next_concrete_action states it "may proceed to the
      Coordinator's ledger-archive step without further compute."
    - >-
      RED TEAM'S REVISE IS ON A NARROW, NOW-DISCHARGED POINT. The Red
      Team's REVISE verdict targets stage0-disposition.md's overstated
      characterization of its own source search as exhaustive (a fifth,
      relevant, already-staged source, KN-LIT-1744, was named by one of the
      four checked sources but never itself checked or disclosed as
      skipped) -- explicitly NOT the combinatorial-ceiling finding. This is
      discharged by CORR-20260906-69ff2a, filed alongside this decision,
      which the Red Team's own report performed the underlying check for
      (a live fetch confirming the omission does not change the "NOT
      COMPUTED" bottom line). This decision does not treat the REVISE
      verdict as blocking the evidence-review step for the finding it does
      not target.
    - >-
      SCOPE OF THE `support` VERDICT. H-MLKEM-36f511's own statement
      predicts standard self-reduction is UNREALIZABLE against Simon
      2026's sample requirement at ML-KEM's actual parameters. The run
      found exactly this, on the combinatorial-ceiling axis, robustly
      across all three levels and the full c sweep, by 24-50 orders of
      magnitude, independently reproduced three times with zero
      discrepancy. This decision therefore records `support`, scoped
      EXACTLY as EV-QALG-8d85be's boundaries state: the combinatorial-ceiling
      axis only, for standard scalar-coefficient self-reduction only. It
      does NOT resolve stage 0's faulty-rate axis (remains NOT COMPUTED),
      does NOT rule out a richer ring-element/Galois-orbit construction
      (explicitly out of scope), and makes NO claim about Simon 2026's
      Lemma 3, ML-KEM's security, an attack, or a speedup.
    - >-
      EVIDENCE STRENGTH `strong`, NOT `replicated` OR `preliminary`. Three
      independent, from-scratch, exact-integer implementations (Executor,
      Validator, Red Team) agree on every load-bearing number with zero
      discrepancy; a dedicated adversarial falsification attempt (the Red
      Team's own mandate, not a defence) found no counterexample within the
      claim's declared scope. This is not a statistical claim needing
      multiple independent experimental runs to reach `replicated` -- it is
      a deterministic closed-form computation, and three independent
      re-derivations agreeing exactly is the applicable form of replication
      for this claim_tier (derivation), per docs/claims-and-verification.md.
    - >-
      KNOWLEDGE PROMOTION IS THEREFORE OWED, NOT OPTIONAL. Per CLAUDE.md's
      knowledge-promotion gate, a `support` decision backed by evidence of
      strength `strong` must promote a finding
      (knowledge/findings/KN-FIND-3245f1.md, filed alongside this decision)
      or state why not; this decision promotes.
  evidence_refs:
