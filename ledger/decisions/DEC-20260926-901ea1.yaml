  rationale:
    - >-
      WHY SUPPORT. Every staked clause of C-P and C-M held; no falsification
      condition fired; no stated numeric prediction missed; the run is
      admissible and every counted refutation is certified author-independently.
      That is the program's support test. The narrowed readings bound what the
      support means; they are not claims the hypothesis staked.
    - >-
      WHY `supported` ON THE HEAD (unlike DEC-20260924-e61f3b's `analyzed`).
      There the head summarized untested claims C2 and C3. H-CERTBIN-e3ac93
      has two claims and both are tested. The head carries a
      status_scope_note restating the cell, the narrowings and "two values of
      n are not a trend", so `supported` cannot be read as persistence in n,
      as S_3-specificity at W_4, or as persistence of the n = 17 route.
    - >-
      WHY NOT WEAKEN. The M_4 collapse and the loss of FULL refute no claim
      of H-CERTBIN-e3ac93 (PP-3 is directionless; C-M's frozen test is sigma
      > 0). They do weaken a decision PREMISE (DEC-20260923-f25b97 NA-5's
      plain gate), which is handled in n19_dr9_ruling, and an open-problem
      reading, handled in kn_open_3c8f51_item_B_ruling.
    - >-
      RERANK (specification attention_contract rerank_trigger;
      DEC-20260926-f6a749 NA-6; carried NA-7 items). Within CERTBIN:
      (1) NA-2, the which-algebra successor (RC-R1 W_3 across all arms, RC-R2
          perturbation ladder): cheapest, zero new curve sampling, and it
          decides the only open question the W_4 ceiling hides (what separates
          S_3 from its tensor neighbourhood; where the refuting neighbourhood
          ends);
      (2) NA-3, the second n = 19 curve (h = 4) read on M_4, R'_4 and W_3 as
          well as W_4 (RC-R3), with EXP-CERTBIN-3f06d1's h = 2 cell when its
          review is composed;
      (3) NA-4, the W_4-type m = 3 pricing design (eligible; after NA-2's
          review);
      (4) NA-5, the n = 23 diagonal step (after NA-3; a W_4 rate at its
          ceiling would add a confounded point, so it must carry a
          non-saturating read).
      EXP-CERTBIN-3f06d1, EXP-CERTBIN-a58c63 and the N-CONV lane continue
      their own lifecycles unchanged.
    - >-
      TARGET-PROFILE HONESTY. Toy tier, sota_delta zero, oracle A per attempt
      and parallel rho dominate; no cost claim. Refutation degree on Semaev's
      diagonal is exponent-adjacent only, and W_4 is not F4. The lane stays
      ranked within CERTBIN, not above exponent-targeting ECC work
      (docs/target-result-profile.md). The one exponent-adjacent reading this
      cell adds is resource_check (R-a): a low mutant degree for convolution
      tensors would matter only if it survives m >= 3 with bounded degree
      along the diagonal, which nothing here measures.

