  t2_replicate_first_argument: >-
    WHY `supported` AND NOT `replicate` ON THIS FIRST OBSERVATION (review-plan
    tier_ruling T2; .claude/skills/review-evidence/SKILL.md "Surprising or
    high-impact results get replicate, not support, on first observation").
    The rule guards against a result that is an accident of one sample or one
    implementation. Neither can be the source here:
    (1) J1 (TASK-20260926-401771, author-independent; read none of impl/,
        verifier/ or src/crypto_autoresearcher/): every one of the 400 counted
        W_4 refutations carries a wdag-v1 that J1's own checker verifies (215
        own negative controls reject), every one of the 400 M_4
        non-refutations carries a checked witness, all 2100 systems were
        rebuilt and s re-decided. The count is a set of 400 checked proofs,
        not a sample statistic.
    (2) J6/J7 (TASK-20260926-f0736e blind; TASK-20260926-f50294 comparator):
        a session that never saw producer code, values or expectations
        re-derived W_4 by the literal rule, rc_b and certificates on 90
        systems fixed by arm and index before extraction (40 primary):
        3770/3770 compared item-instances agree, and 65 run-refuted pool keys
        are certified a second time by blind wdag-v1 under the comparator's
        own checker.
    (3) J13 (TASK-20260926-fee7a9): the instrument proves nothing too much: 0
        refutations and codim >= s on 300/300 satisfiable controls, W_4 equal
        to the whole degree-4 ideal on the 150 S_3 and N-CONV19 ones, and the
        pinned engine landing exactly on declared derived records on 600
        semi-regular controls. O4 narrows the READING; it does not touch the
        count.
    (4) J2: the 400 systems are a function of frozen seeds and rules,
        replayed attempt by attempt by independent code. A second run of this
        cell would re-measure certified identities.
    (5) The result is not surprising relative to the pre-data prior on the
        claims under test (PERSISTS modal at about 55%; NON-SEMI-REGULAR
        PERSISTS at about 80%); the surprising sub-results (M_4 0/400, FULL
        0/400, ell route never true) are not claims of the hypothesis and were
        attacked as J9 and located.
    (6) It is not high-impact: toy tier, sota_delta zero, oracle A and rho
        dominate, and its only downstream license is a RANKING entry.
    What a second n = 19 curve (h = 4) would test is TRANSFER to another curve
    and cofactor, which the hypothesis does not claim; it is ranked as a
    successor (NA-3), not required as replication. This is the same reasoning
    DEC-20260924-e61f3b applied at n = 17, with a stronger round (every
    counted certificate verified author-independently, the population
    replayed, an N-CONV-type arm in-run).

