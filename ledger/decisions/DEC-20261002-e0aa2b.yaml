        other 14 are invalid, each with its defects listed (F-01 and F-02 on
        all 14; F-04 on the 13 Stage-1 and Stage-2 directories; F-06 on
        RUN-QSP-1df59e; F-03 on RUN-QSP-86e0d2, RUN-QSP-383952 and
        RUN-QSP-2e1ff8). None is not_checkable (V7 counts). Neither the
        infrastructure failure nor the incomplete attempt is negative
        evidence.
    - id: R-SETKEY
      subject: set classification under R-KEYS
      ruling: >-
        K-INVALID. R-KEYS: "a defect (seed, raw/summary, plan-hash binding or
        source-hash closure) touches every present scientific trial". The
        present scientific trials are the 14 directories with a scientific
        output; RUN-QSP-cec70a and RUN-QSP-715b58 produced none (F-13). The
        raw/summary check V4 fails, and its failure F-02 (no root-list
        certificate exists for any N > 0 row while the reported
        certificate_bearing counts N > 0 rows, so the specification's M5
        identity and F_acct fail) is in the defect list of all 14 (V4,
        per_directory). Seed (V3), plan-hash binding (V6) and source-hash
        closure (V6) pass, so the key rests on the raw/summary class alone.
        F-01, F-04, F-05 and F-06 are not among the four classes R-KEYS lists
        for K-INVALID; they do not carry the key, and they are returned to
        execution with it. Interpretive point, disclosed: the empty set of
        valid trials is, read literally, a proper subset, so K-PARTIAL could
        be argued; it is not applied because its directed actions presuppose a
        valid subset to analyse and K-INVALID's condition is met by a named
        check. K-COMPLETE is not met (0 valid; V1). K-NOT-CHECKABLE is not met
        (V7 not_checkable 0; the V6 items the validator could not check are
        not needed for the set). No key is added and none is relaxed.
    - id: R-PRIOR-COMPARE
      subject: the outcome against DEC-20261002-86a7e0 R-PRIOR P1 to P5
      ruling: >-
        P1 CONFIRMED (V1, absent_planned_trials). P2 CONFIRMED with a scope
        refinement (V2, F-01: 14 flat manifests; F-13: two directories have no
        manifest at all). P3 CONFIRMED exactly (V7 rows of RUN-QSP-cec70a and
        RUN-QSP-715b58). P4 OVERTURNED on its raw/summary component (V4 fail,
        F-02, F-03), with its seed component confirmed (V3) and its plan-hash
        component refined (V6: 15 receipts bind trial-plan-run2.json,
        RUN-QSP-cec70a binds trial-plan-run.json, each equal to its own plan
        file). P5 CONFIRMED (inventory introducing_merge 1e96d1d00e, PR #1325,
        on all 157 files; V6 and V8 corroborate the introducing commits). The
        overturned component is the one the set key turns on. Not in the prior
        at all: F-02's mechanism, F-04, F-06 and F-05's ordering point. Table:
        prior_comparison below and the worksheet.
    - id: R-CONTINUATION
      subject: the approved BATCH-2c4a9c continuation, in the light of the findings (a recommendation; no approval is changed here)
      ruling: >-
        RECOMMENDED FOR SUPERSESSION AS AN EXECUTION APPROVAL, BY THE NEXT
        PASS (NA-1), NOT PERFORMED HERE. trial-plan-cont.json (approved by
        DEC-20260921-f0e100 for TASK-20260921-9f84a3) binds the same eight
        source_sha256 values as trial-plan-run2.json (both plan files read;
        its supersession_reason states the source hash is carried
        byte-identical). The 14 invalid directories ran under that closure
        (V6). Executing the continuation as approved would run the
        implementation in which the validator located F-01 (flat manifest
        writer, driver.py lines 436-456) and F-02 (driver.py line 116, cert =
        None), so each trial it produced would be schema-incomplete and not
        evidence under specification invalidation rule 7, with a headline
        invalid under F_acct. Its one cross-plan edge (stage3-bridge-n22's
        pruned dependency) is justified in its own supersession_reason by
        RUN-QSP-327529 being output_validated, which is now classified invalid
        (F-01, F-02, F-04). EVIDENCE: V6, F-01, F-02, F-04, OBS-2 of the
        worksheet. TEST BOUNDARY: the eight-file implementation closure at
        those hashes and the six continuation trials; nothing about any other
        implementation. REMAINING UNCERTAINTY: whether the integers that
        implementation computes are correct is untested by any independent
        means (F-04: C1 compares one algorithm with itself on 2904 of 2928
        Band-L rows; validator limitation 1). SUCCESSOR: QSP-SUCC (NA-4).
        REVISIT: NA-1, or earlier if the QSP owner answers (a reply is a
        pointer, never approval or a binding objection). If NA-1 instead keeps
        the approval, completing that chain still needs a scoped successor
        snapshot card excluding the bound set (DEC-20261002-86a7e0 R-BIND (7)).
        This ruling edits no QSP record and withdraws no approval.
    - id: R-SLOT-READING
      subject: the selection point this lane frees (DEC-20261002-86a7e0 R-SLOT; card constraint)
      ruling: >-
        R-SLOT UNCHANGED. When TASK-20261002-9a734c verifies and the lane
        closes, slot 1 goes to the S1 version-4 revision design batch
        (DEC-20260929-54dcd8 CH-B, NA-1) if no earlier freed slot has taken it
        and no other session has opened it, otherwise to U-HOLDH
        (DEC-20260929-7257b2 rank 3), on the facts at that fetch
        (DEC-20261002-0983f2 R-NEXT-SLOT). This composer does not know whether
        the S1 version-4 batch has opened (PD-1). ONE CHANGE (W-SLOT-1): a new
        ranked item, QSP-SUCC, takes the next freed slot after the R-SLOT
        claimant(s) are served, ahead of DEC-20260929-7257b2 rank 4 (U-REACH)
        and later ranks. Not ahead of S1 version 4 or U-HOLDH, because R-SLOT
        was fixed before this outcome, S1 version 4 is committed ahead of
        every hold (54dcd8 CH-B), U-HOLDH may not be deferred twice without a
        new reason (7257b2 rank 3), and QSP-SUCC is not exponent-shaped. Ahead
        of U-REACH, because it carries forward the custody successor's rank 2
        in DEC-20260929-7257b2, EXP-QSP-70b731 is the approved replication
        DEC-20261002-86a7e0 records as ranked first on this goal by
        DEC-20260918-7e0865, and its remedy is enumerated. Cost, stated: U-REACH
        and later ranks wait at most one more slot release. Revisit: each lane
        archive verification on this goal; earlier if the QSP owner answers.
    - id: R-NO-STATUS
      subject: what this decision does not do
      ruling: >-
        No hypothesis, experiment, evidence, question or goal status moves.
        EXP-QSP-70b731 keeps its recorded status; this decision does not mark
        it invalid, failed_infrastructure or analyzed, because R-KEYS does not
        authorize a status change and the card's write scope covers no QSP
        record. No EV record is written. No closure is performed (NA-5
        recommends). TW-C1 (DEC-20261002-86a7e0 R-OUTCOME) is carried: any
        later evidence review of EXP-QSP-70b731 output that could contradict
        EV-QSP-a6aa4b runs at review-breakthrough, max.

