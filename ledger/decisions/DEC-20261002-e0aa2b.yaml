  validity_review_before_interpretation:
    expected_run_count: >-
      Checked (V1, pass as a count check). 20 trial ids across six plans; 16
      directories present, each mapped to its plan trial with 0 mismatches;
      14 trial ids have an output_validated receipt (all under
      trial-plan-run2.json); stage3-bridge-n22 has one claim_expired attempt;
