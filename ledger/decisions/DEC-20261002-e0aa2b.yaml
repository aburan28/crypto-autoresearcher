  defect_return:
    note: >-
      The named defects K-INVALID returns to execution, each with the check
      and the validator finding it rests on and what a successor must
      discharge. The successor is QSP-SUCC (NA-4). Nothing here repairs a
      result in prose or alters a frozen protocol; a successor that changes
      any field of the frozen specification needs a versioned
      protocol_amendment under experiments/EXP-QSP-70b731/amendments/.
    items:
      - id: D-1
        finding: F-01
        check: V2
        defect: Flat manifests without a top-level run key; inference block, dirty-tree state, validity reason and dependency versions absent; command and commit only in sidecars.
        discharge: >-
          The manifest writer emits the run-record schema validate_ledger.py
          checks, carrying every AGENTS.md artifact-policy field (specification
          invalidation_rules item 7 and required_artifacts item 1).
      - id: D-2
        finding: F-02
        check: V4
        defect: No root-list certificate file for any N > 0 row (driver.py line 116 hard-codes cert = None) while certificate_bearing counts N > 0 rows.
        discharge: >-
          Every N > 0 row writes a root-list certificate file that the wrapper
          re-verifies; certificate_bearing equals re-verified files on disk; the
          M5 identity is checked on every stage before any headline
          (specification certificate_semantics, M5, F_acct, tail_checks item 3).
      - id: D-3
        finding: F-03
        check: V4
        defect: 8 rows with root_count_listed below I_indep N and root_list_deferred false, counted certificate-bearing; check.py lines 59-60 pass them.
        discharge: >-
          Under-listing is impossible or flagged, never silently passed; the
          silent skip of a factor whose root search fails (i_indep.py lines
          83-84, also F-11 for path A-H) raises or flags.
      - id: D-4
        finding: F-04
        check: V5
        defect: I_indep took path A-L, the same deg-gcd algorithm as I_direct over shared primitives, on 2904 of 2928 Band-L rows; derivation (A) on 24 rows; Stages 0 and 1 used enumeration, so no calibration exercised path A-H.
        discharge: >-
          I_indep conforms to the specification (independently written from
          derivation (A), used on all census cells so that Band-L and bridge
          agreement with I_direct calibrates it before Band H), and the Stage-1
          calibration exercises the I_indep path(s) the census uses. Whether
          any fast path is admissible is read from the specification, never
          assumed; a change needs a protocol_amendment.
      - id: D-5
        finding: F-05
        check: V5
        defect: C3, C4, C5 and C6 absent and C2 not run as a control trial; all six plans order stage5-controls after stage-compare-sealed, so no census trial is gated by the blocking controls.
        discharge: >-
          The successor plan states, read from the specification's stages,
          controls and stopping_rules, where the blocking fixtures and controls
          run relative to the census stages; any order the specification does
          not permit needs a protocol_amendment. Completeness finding, never
          negative evidence.
      - id: D-6
        finding: F-06
        check: V5
        defect: The Stage-0 gate is computed by census code; blind_from_respected and executor_read_set are constants, not per-run declarations.
        discharge: >-
          Stage 0 is the hand re-derivation with no census code (specification
          stages.stage_0), and M9 records a declared, checkable read set per run.
      - id: D-7
        finding: F-10
        check: V3
        defect: Fixed internal RNG seeds in hash-bound source not declared in the specification's seeds or the manifests.
        discharge: Declared in the manifest (information item; not a validity defect on its own).
      - id: D-8
        finding: F-13
        check: V2
        defect: Failed or expired attempts leave no manifest, so validate_ledger.py does not see them.
        discharge: Recorded for the successor's runner configuration (information item).
    carried_conditions:
      - Fresh run ids for every trial; none of the 16 bound directories is reused or edited (they are immutable and bound by TASK-20261002-5e1246).
      - The 14 invalid trials are re-run under the successor, not carried, because their receipts are not evidence (K-INVALID).
      - Linux execution, since RLIMIT_AS cannot be set on darwin (RUN-QSP-cec70a receipt and the owner's release note; run-validation.yaml bus_claims_checked; consistent, not independently reproduced).
      - The blind_from list of the specification binds the successor's implementer exactly as it bound the first.
      - TW-C1 carried for any later evidence review.

