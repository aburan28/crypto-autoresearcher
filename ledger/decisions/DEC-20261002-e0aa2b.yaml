    seed_integrity: Holds (V3; observations F-09, F-10).
    raw_summary_agreement: Failed on certificate accounting (V4, F-02, F-03); every integer comparison and the checker re-run agree (V4 reasons; computations.json V4_checker_rerun).
    control_comparability: Failed (V5, F-04, F-05, F-06).
    provenance_and_custody: Hold (V6, V8; observations F-07, F-08).
    conclusion: >-
      The run set is not evidence. It is returned to execution with the
      defects listed under defect_return. A timeout, a claim expiry, an
      infrastructure failure, a schema defect and an implementation defect
