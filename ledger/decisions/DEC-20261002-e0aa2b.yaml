  rulings:
    - id: R-DIRS
      subject: per-directory classification under R-KEYS (directory keys)
      ruling: >-
        ADOPTED FROM THE VALIDATOR (run-validation.yaml per_directory and V7),
        one key per directory, as tabled under classification.per_directory.
        RUN-QSP-cec70a is infrastructure_failure (receipt infrastructure_error;
