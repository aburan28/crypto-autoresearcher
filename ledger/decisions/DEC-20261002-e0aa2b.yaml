      named check (V4) on every present scientific trial; the key is not
      chosen for its consequences, and the interpretive point against
      K-PARTIAL is disclosed in R-SETKEY.
    - >-
      Infrastructure is not evidence. RUN-QSP-cec70a and RUN-QSP-715b58 are
      an infrastructure failure and a claim-expired attempt; the 14 invalid
      directories fail on record schema, accounting and instrument
      conformance. None of this bears on N_K(L), on H-QSP-cd0c90 or on
