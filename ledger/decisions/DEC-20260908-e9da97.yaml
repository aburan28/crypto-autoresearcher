  rationale:
    - >
      IDEA-20260906-86cc17 cites
      RQ-ECDLP-623a32 and
      GOAL-ECDLP-001, has a cheap
      finite N^2-th-root uniqueness
      identity, and is not owned by
      a hypothesis or experiment.
      Confirmed unowned immediately
      before ID allocation.
      IDEA-20260906-e07475 remains
      leftover and is not selected.
      Stage 0 is the N^2-th-root
      calibrator only: at p=19 N=5
      the unique roots are the frozen
      18-tuple [1, 3, 14, 9, 17, 4,
      7, 8, 6, 13, 11, 12, 15, 2, 10,
      5, 16, 18]; KF embed p=19 N=3
      is rejected.
    - >
      Ranked next after P-S0-QRESIDUE
      review is this cheap finite
      Stage 0 (N^2-root arm only),
      not Stage 1 of EXP-ECDLP-a294b6
      and not Stage 1 of the earlier
      Stage-1-blocked experiments.
      Cubical identities, Tate, the
      DL-spectrum, Coppersmith,
      Semaev S_m, Velu, and the
      yield ratio k stay unauthorized.

