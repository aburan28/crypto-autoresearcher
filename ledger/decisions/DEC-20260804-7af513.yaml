  recorded_by_task: TASK-20260804-146
  archived_by: TASK-20260804-147
  context: >-
    BATCH-102: LC correlation measurement. EC C=3.13 > random C=2.57 at p=1009.
    EC sequences are LESS Fourier-flat than random bijections. High LC does not imply
    high Fourier flatness. IDEA-24b025 (LC proxy) blocked.

  decision: close_lc_route_advance
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    IDEA-24b025 (linear complexity proxy for H-PSEUDO): BLOCKED.

    Key finding: C_EC > C_random (EC sequences are less flat than random bijections).
    High LC ~ N/2 for EC sequences is irrelevant to Fourier flatness. The two properties
    are independent.

    AT LARGE SCALE: C_EC ~ p^{0.079} >> sqrt(log p) = C_random_prediction. EC sequences
    become increasingly worse than random bijections as p grows. This is a genuine
    structural difference between EC multiplication and random bijections.

    **WHAT THIS MEANS FOR H-PSEUDO**:
    - Random bijections: H-PSEUDO provable with C = O(sqrt(log N)) (standard result)
    - EC multiplication: C ~ p^{0.079} > sqrt(log p) — EC structure makes H-PSEUDO HARDER

    The EC-specific difficulty comes from a correlation in x([j]G) that random bijections
    don't have. The x-coordinate sequence x([j]G) is NOT a random permutation — it has
    specific EC-group-law correlations that cause C > C_random.

    THIS IS THE SOURCE OF H-PSEUDO DIFFICULTY: The EC multiplication creates a specific
    non-random structure in the DFT of the small-x indicator that exceeds what random
    bijections produce. Proving H-PSEUDO requires understanding and bounding this
    EC-specific excess.

    GOAL-ECDLP-001 stays active.

  exact_next_action: >-
    BATCH-103: Investigate WHAT SPECIFIC EC STRUCTURE causes C_EC > C_random.
    Measure: for each k achieving max|hat{1_F}(k)|, what is [k]G? Does it have
    special properties (small x-coordinate, specific trace, etc.)?
    If the "worst" k corresponds to a factor-base-adjacent point [k]G,
    this gives a new structural insight about H-PSEUDO.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      LC not a proxy for DFT flatness. C_EC > C_random finding worth recording
      in KN-FIND pending further analysis.

  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2
    sota_delta: {time_exponent: not_applicable}
  claim_ceiling: toy
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-04'
