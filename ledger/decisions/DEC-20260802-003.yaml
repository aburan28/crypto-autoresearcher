coordinator_decision:
  id: DEC-20260802-003
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-026
  recorded_by_task: TASK-20260802-015
  context: >-
    The focused rerank after BATCH-020 selected no existing candidate, so
    BATCH-026 ran a complete object-first pre-ID cohort under TASK-20260802-012,
    snapshot-committed it under TASK-20260802-013, and obtained an independent
    adversarial review under TASK-20260802-014. Both producer and reviewer found
    zero survivors among the five exact objects.
  decision: zero_survivors
  decision_vocabulary_note: >-
    ZERO_SURVIVORS is the handoff's pre-ID admission disposition. It is not a
    hypothesis rejection, search-space closure, goal pause, or success claim.
  decision_scope: >-
    Reject B21-P01 through B21-P05 before canonical allocation; preserve their
    complete screens, obstructions, and forward guidance. Allocate no IDEA id,
    authorize no experiment, and keep RQ-ECDLP-002 and GOAL-ECDLP-001 active.
  target_ids:
    - GOAL-ECDLP-001
    - RQ-ECDLP-002
    - BATCH-026
    - TASK-20260802-012
    - TASK-20260802-013
    - TASK-20260802-014
    - TASK-20260802-015
    - EV-ECDLP-015
    - B21-P01
    - B21-P02
    - B21-P03
    - B21-P04
    - B21-P05
  rationale:
    - id: R-1
      text: >-
        P01's short word has at most 2^(s*w) values over N positions, so its
        claimed small fibres fail for s*w=o(log N); an isolating word still
        lacks the scalar inverse it was meant to replace.
    - id: R-2
      text: >-
        P02's unordered x-only deck identifies X and -X although their +P
        successors generally differ, so the proposed state has no deterministic
        update unless discarded orbit orientation is restored.
    - id: R-3
      text: >-
        P03 gives an endpoint jet but no source-tuple interface, exact recall,
        selectivity theorem, rank path, factor logs, or descent; it also overlaps
        the occupied public/source-jet lane, most directly ECDLP-IDEA-268.
    - id: R-4
      text: >-
        P04's degree-coprime isogenies are injective on the prime subgroup;
        equal-total pullback accounting yields ordinary bases on isomorphic
        copies and no proved density or rank gain.
    - id: R-5
      text: >-
        P05 is the occupied exterior/tensor frontier and assumes the exact
        source-complete separator-rank theorem required for its claimed N^0.45
        path. Conditional targets receive no supported SOTA credit.
    - id: R-6
      text: >-
        Independent review verified committed-byte provenance, complete corpus
        counts, primary-source boundaries, candidate-specific costs, controls,
        Pareto accounting, and zero supported time, memory, data, or security delta.
  limitations:
    - The decision covers exactly five pre-ID objects and their semantic duplicates.
    - It is not a universal lower bound outside the stated generic and structured-generic models.
    - It provides no empirical evidence and no crypto-scale validation.
    - A count of rejected objects is not evidence of search saturation.
  evidence_refs:
    - ledger/evidence/EV-ECDLP-015.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/archives/TASK-20260802-013/snapshot_commit_receipt.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/reviews/TASK-20260802-014/cohort_review.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/reviews/TASK-20260802-014/dedup_audit.md
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      The screen refines corpus mappings but proves no new mathematical theorem
      and supports no attack or crypto-scale claim.
  research_status_transition:
