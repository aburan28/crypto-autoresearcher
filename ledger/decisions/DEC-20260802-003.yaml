      Open BATCH-027 as a bounded theorem-first ingredient-scouting batch. Exclude
      longer orbit words, reordered Kummer decks, higher public endpoint jets,
      additional bounded-degree isogeny charts, exterior/tensor format swaps,
      and BATCH-020 threshold maintenance unless a new theorem changes their
