      generic_ecdlp_time_exponent: 0.0
      memory_exponent: 0.0
      data_query_improvement: 0
      cryptographic_security_bits_reduced: 0
    named_obstruction: >-
      Candidate-specific fibre, state-aliasing, source-interface, injective-
      transport, and missing-rank-theorem barriers.
    forward_guidance: >-
      Open one theorem-first ingredient-scouting successor for a concrete
      non-permutation correspondence, source-free inverse, or exact source-
      complete rank theorem. Require an exact operation and matched lower-bound
      interface before any new proposal allocation.
  next_actions:
