coordinator_decision:
  id: DEC-20260916-bec4b8
  recorded_at: '2026-09-16'
  recorded_by: coordinator
  area: ICPERF
  decision_type: inference_amendment
  decided_by: coordinator
  target_ids:
    - TASK-20260915-efa91b
    - BATCH-a33cda
  builds_on: DEC-20260916-7b2235
  title: >-
    Amend the last card in BATCH-a33cda whose fallback_allowed false this environment cannot keep, and
    discharge the ranked next action that decision left open by making the dispatcher say so before launch

  triggered_by: >-
    DEC-20260916-7b2235 amended two reviewer cards and then named its own successor: "write the
    environment's actual inference reality into the queue builder, so that a card either declares the
    runtime-native binding up front or names the backend it requires". That is now done as a dispatcher
    check, and the first render under it found exactly one open card still carrying the unkeepable claim.

  findings:
    - id: F-1
      what: the environment fact is unchanged and was re-checked, not assumed
      evidence: >-
        `python3 -m orchestration.adapter doctor` still reports every API-backed backend unusable for want
        of credentials; only `local` needs none, and it carries no binding for
        coordinator-orchestration-code. Re-rendering BATCH-a33cda's dispatch plan under this session's
        environment lists TASK-20260915-efa91b as the single open card whose policy binds on an
        uncredentialed backend.
    - id: F-2
      what: the remaining card is a Coordinator ledger-archive task, which does not soften the defect
      evidence: >-
        TASK-20260915-efa91b is the ledger archive for the composition of REVIEW-ICPERF-20260915-a33cda
        (EV-ICPERF-433fa5, DEC-20260915-927eaa, the BATCH-a33cda checkpoint). Its handoff sets policy
        coordinator-orchestration-code with fallback_allowed false.
      consequence: >-
        It will be executed by a runtime-native Coordinator session, exactly as the two reviewer cards
        were, so its card asserts the same thing this checkout cannot supply. That the task is
        Coordinator-owned makes the mismatch MORE worth fixing, not less: this is the card that performs a
        research-state transition, and it should not perform one while its own inference block is false.
    - id: F-3
      what: the check is advisory by design, and the reason is not squeamishness
      evidence: >-
        tools/research_dispatch.py `inference_advisories`, and its tests
        (tools/test_research_dispatch.py::InferenceAdvisoryTests).
      why_not_a_refusal: >-
        Refusing to dispatch would block every open card in exactly the environments where the
        runtime-native binding is the legitimate route under core rule 16 — converting a paperwork defect
        into a research stoppage, which is the opposite of what the rule protects. The dispatcher's job
        here is to make the Coordinator see the mismatch BEFORE launching, which is the whole difference
        between declaring a binding and amending a card after the work has run.
      what_it_deliberately_does_not_do: >-
        It does not probe the network — credentials absent settles the question, credentials present
        proves only configuration, and `doctor --probe` with model_verified remains where a SERVED model
        is established. And it does not report terminal cards: a finished card's inference block is
        history, correctable only by a record, and noise in an advisory section is how the section stops
        being read.
    - id: F-4
      what: the remedy diverges on `degradable`, and the check now diverges with it
      evidence: >-
        review-breakthrough carries `degradable: false`; every other policy does not.
      consequence: >-
        An advisory that told a Coordinator to record an inference_amendment against review-breakthrough
        would counsel precisely the act AGENTS.md forbids, so those cards render a different remedy:
        moving to a binding that FULLY meets the floor is legitimate, `degraded_allowed` is never
        signable, and if nothing meets the floor the CLAIM stays un-promoted while the campaign stays
        active. A test pins this, because a wrong remedy here is worse than no advisory at all.

  decision:
    approved: >-
      An additive inference_amendment for TASK-20260915-efa91b: fallback_allowed false -> TRUE, with the
      resolved model recorded in the archive receipt and model_verified recorded false, on the same
      grounds and with the same limits as DEC-20260916-7b2235.
    degraded_allowed: >-
      Stays FALSE. model_verified is again NOT OBTAINED and is named rather than deemed met: no backend
      here is probeable, so the resolved identifier stays self-reported and a reader must not treat it as
      an established fact about which model performed the archive.
    fallback_reason: >-
      The adapter's configured binding for coordinator-orchestration-code is unreachable from this
      checkout for want of credentials (F-1). An absent key, not an exhausted quota.
    also_recorded: >-
      DEC-20260916-7b2235's ranked next action is DISCHARGED, in the narrow form it asked for: the
      dispatcher now reports the mismatch per open card at render time. It is discharged as a WARNING,
      not as an enforcement — see F-3 for why that is the intended strength and not a shortfall.

  what_this_does_not_do:
    - >-
      DOES NOT make an advisory into permission. Only a Coordinator inference_amendment on a card
      authorizes a substitution; the dispatcher reports and never approves, and a card already carrying
      an amendment is not listed.
    - >-
      DOES NOT extend to review-breakthrough, here or by precedent. F-4 states the divergence and
      DEC-20260916-7b2235 F-5 states the wall: any ICPERF claim escalated to that tier hits it in this
      environment and must not be resolved by an amendment like this one.
    - >-
      DOES NOT authorize the archive itself. TASK-20260915-efa91b remains blocked on R6's return and on
      the composition of REVIEW-ICPERF-20260915-a33cda; this decision fixes what its card SAYS about
      inference, and asserts nothing about the evidence it will archive.
    - >-
      DOES NOT claim the underlying condition is repaired. Cards in future batches will keep inheriting
      `false` from AGENTS.md's template, which is the RIGHT default for the contract and the wrong value
      for this machine. What changed is that the mismatch is now visible before a launch instead of after
      a return.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Same reasoning as DEC-20260916-7b2235: this is inference provenance for one batch in one
      environment, establishing no mathematical result. The durable part is now code and tests in the
      dispatcher rather than prose in the corpus, which is where a lesson about dispatch belongs.
    revisit_if: >-
      A second backend becomes servable here (`doctor --probe`). The advisory would then fall silent on
      its own, which is the correct behaviour and is what its credential test is for.

  citations:
    - id: DEC-20260916-7b2235
      provenance: internal
      what: the decision that established the environment finding and ranked this successor
      verified_by: >-
        coordinator, this session: read it in full and re-ran `adapter doctor` to confirm F-1 still holds
        rather than carrying the earlier finding forward on trust.
    - id: BATCH-a33cda
      provenance: internal
      what: the batch whose queue carries the amended card
      verified_by: >-
        coordinator, this session: rendered the dispatch plan before and after the amendment; the card is
        listed as the single advisory before it and the section is empty after, and gates pass in both.
    - id: TASK-20260915-efa91b
      provenance: internal
      what: the amended card
      verified_by: coordinator, this session, by reading its handoff inference block in the queue.
