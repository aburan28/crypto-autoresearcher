    executed once, with43 administrative source/snapshot comparisons. Parent verified its three returned artifact
    hashes and actual four-path archive binding.
  - The independent PASS for EXP-ECDLP-0c717c supports definition approval separately from the four contracts requiring
    correction. Its runtime/implementation and Linux guard prerequisites remain open.
  - Accept the source-specific residual RNG, deterministic-pair, statistic-tail/zero-scale, physical-encoding, common-scalar,
    self-hash and crossover-scope findings as correction requirements. They concern proposed definitions, not evidence
    that any mathematical hypothesis fails.
  - Rank source-admitted spectral/Tate review and CM implementation first; next bind the approved envelope implementation
    while correcting the four remaining drafts. Completing these existing ECC leads has more immediate information
    value than adding unprepared ideas solely to enlarge the queue.
  - All failed draft/check attempts and prior archives remain immutable. No source attribution, mathematical closure,
    novel algorithm, exponent improvement or validated measurement is asserted.
