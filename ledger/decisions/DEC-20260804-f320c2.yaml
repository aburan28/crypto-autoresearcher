coordinator_decision:
  id: DEC-20260804-f320c2
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-066
  recorded_by_task: TASK-20260804-071
  archived_by: TASK-20260804-072
  context: >-
    BATCH-066 analyzed the BGS spectral gap direction for prime-field ECDLP.
    Two independent mathematical obstructions found.

  decision: close_bgs_advance_weil_bound
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    BGS spectral gap direction: CLOSED with named obstruction (abelian spectral gap
    obstruction: E(F_p) ≅ Z/N is cyclic abelian, BGS requires non-abelian; even if
    a spectral gap existed, birthday collision threshold is orthogonal to mixing time).

    GOAL-ECDLP-001 stays active. A new potentially closure-capable direction is identified:
    the WEIL BOUND YIELD UPPER BOUND. The Weil/equidistribution theorem for elliptic
    curves might directly imply that Semaev yield ≤ B^m/(m!N) + O(sqrt(p)/N), providing
    a THEOREM (not just empirical observation) that arithmetic factor bases cannot exceed
    the heuristic yield.

  bgs_obstruction:
    name: abelian_spectral_gap_obstruction
    claim: >-
      E(F_p) ≅ Z/N (prime cyclic abelian). For any bounded generating set |S|=O(1),
      the spectral gap of Cay(Z/N, S) = Θ(1/N^2) → 0. BGS requires non-abelian
      non-virtually-solvable groups; does not apply to Z/N.
      Even a hypothetical Ω(1) spectral gap would not reduce birthday threshold
      (collision counting is independent of mixing time).

  exact_next_action: >-
    BATCH-067: Analyze whether the Weil bound / character sum estimate for elliptic
    curves over F_p directly implies that the Semaev m-fold decomposition yield
    cannot exceed B^m/(m!N) + O(sqrt(p)/N). If this follows from known character
    sum bounds, it would provide a THEOREM completing the no-go for arithmetic
    factor bases (complementing the Bezout no-go for algebraic factor bases).
    This would constitute a near-complete closure of prime-field index calculus.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Shape repaired under DEC-20260805-7b3e91 (RUL-6). The record as committed
      wrote `knowledge_promotion: not_warranted` as a bare token with no stated
      reason. No KN-* entry was created by this decision. The reason was not
      recorded at the time and is NOT reconstructed here.
  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2
    sota_delta: {time_exponent: not_applicable}
  claim_ceiling: theoretical
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-04'
