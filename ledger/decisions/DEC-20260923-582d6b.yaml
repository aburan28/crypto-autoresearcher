  # --------------------------------------------------------------------------
  # RULINGS
  # --------------------------------------------------------------------------
  rulings:
    R-1_the_STOP:
      reading_under_R1-7_and_RC-6: >-
        CORRECT, AND FINAL FOR STAGE R1. RC-6 says that if any field REG-1
        compares differs between the two toy runs, stage R1 stops, REG-1
        could not be read, and fixing it is out of the repair's scope
        (DEC-20260923-80e280 lines 460-471). D, the arm outcome and the run
        status differed (implementation-v2-r1.md lines 628-635). The
        exclusion list may not absorb D. The Executor stopped, did not re-run
        DV-7 to get a pass (line 671), and preserved everything. That is the
        behaviour the contract requires. The STOP is an impediment for this
        decision and is never evidence.
      established: >-
        - On the stage-R1 host, msolve 0.6.5 at -t 1, with the frozen v2 argv
          and default genericity handling, returned two different results on
          ONE byte-identical toy input at p' = 1033: once a parametrisation
          whose eliminating polynomial is not square-free (square-free part
          of degree 63 against a quotient dimension of 64), once a
          square-free one of degree 64. The world-A result was not reproduced
          in 50 further solves.
        - The frozen classifier turns such a result into
          degenerate_parametrisation with D undefined (v2_solver.py lines
          488-508; v2_driver.py lines 205-206). This is a correct reading of
          the result the solver returned. It is conservative: a recorded D is
          read from msolve's printed quotient dimension before the
          parametrisation step (v2_driver.py lines 199-204), and every other
          check sits between the parse and an ok outcome. So the event can
          REMOVE a D or a solution set; it cannot ALTER a recorded one.
        - PYTHONHASHSEED does not explain it (implementation-v2-r1.md lines
          650-653).
      not_established: >-
        - The MECHANISM. Default `-c 2` genericity handling (a change of
          variable order, then a random linear form) is a plausible source.
          So is any time- or state-seeded choice. Neither is established.
        - The RATE. One differing result in 52 recorded solves of one input.
          If those solves were exchangeable, a binomial reading would put a
          95% interval at roughly 0.0005 to 0.10 per solve. This is
          Coordinator arithmetic on reported counts, not a measurement, and
          exchangeability is itself not established (a clock-seeded choice
          would make consecutive solves correlated).
        - Whether the event can occur at p' = 4111, 16777291 or 1073741831,
          or on any other input. RUN-GFPN-ac4487's 36 solves at 4111 were all
          ok with eliminating degree equal to D (line 663-664). That is one
          run of each input and bounds nothing tightly.
      meaning_for_REG-1: >-
        REG-1 is a CORRECT detector: it demands byte-identical .ms.out and
        equal D and outcomes, and it caught the event. Under protocol 2-r1 an
        event in G1 at 4111 would FAIL REG-1 for a reason unrelated to the
        repair layer. The paristack failure_reading names this case ("the
        pipeline is non-deterministic"; addendum lines 530-532) and ends R2
        at the gate, never as a result. So the risk is a FALSE FAILURE that
        costs a gate cycle and a decision. Non-determinism of this kind
        cannot make REG-1 pass falsely, because a pass needs equality.
      meaning_for_the_gate: >-
        At G1 or G2, an event on a REGRESSION target makes its D undefined and
        fails F-1 (v2_driver.py lines 436-441): a false gate failure. On a
        FRESH target, the target is replaced by the next seeded draw (lines
        382-387). That changes the target set, which fails REG-1 at G1 and
        silently changes which targets G2 uses. At G4, a control that needs
        two ok solves (for example line 788) fails. An arm solved gb_only
        never reaches the parametrisation step (lines 187-189), so the event
        cannot arise there. Under AC-5, none of these is ever a result.
      meaning_for_every_later_D_measurement: >-
        At a cell, the event makes that target `not_measured` with class
        "non_generic_system (R-5)" (v2_driver.py lines 1184-1188). Three
        consequences:
        (1) a D value is MISSING, not wrong;
        (2) the label misattributes a solver event to the system;
        (3) if the event's rate depends on the system, for example grows
            with D as a projection collision would, the missingness is not
            at random and could bias any reading across arms or primes. This
            is a possibility, not an established fact.
        This is why the remedy acts at the solve, before any cell runs,
        rather than at the reading rules.

    R-2_PYTHONHASHSEED_RD-1:
      ruling: >-
        Repaired packages run with PYTHONHASHSEED="0" set by the successor
        wrapper for the driver child, and recorded in the manifest (draft
        SE-6).
      reasons: >-
        - It is the condition under which the REG-1 reference RUN-GFPN-ac4487
          actually ran (v2_run_wrapper.py lines 177-178), and the condition
          of every v1, v2 and v2-a1 package.
        - RC-6's own stated purpose is that G1 inherit the reference's
          condition. Its premise, that the reference ran without the
          variable, is false. CORR-20260923-111265 records the fact and makes
          the purpose governing.
        - A literal reading would give G1 a DIFFERENT condition from its
          reference, and so would make REG-1 compare two conditions.
      interaction_with_RC-6: >-
        RC-6's first part stays in force as amended (draft SE-5): the toy
        probe still runs a second world with a DIFFERENT hash seed ("12345",
        by a development-only override), so that a hidden dependence on
        string-hash order would still be exposed. Package condition "0";
        probe perturbation "12345".
      interaction_with_REG-1: >-
        With "0", G1 matches RUN-GFPN-ac4487 in hash-seed condition, so a
        REG-1 difference can no longer be attributed to that condition.
      no_package_ran_under_the_literal_reading: >-
        None did: stage R1 created no package, and no repaired package runs
        before the successor addendum is approved.

    R-3_the_remedy:
      chosen: >-
        (a) + (c) + (d), with (b) held as the pre-declared successor route.
        (a) FIRST: a zero-run frequency characterization, TASK-20260923-6599cf,
            archived by TASK-20260923-683f34 before the approval act.
        (c) and (d): a DRAFT additive addendum,
            AMD-EXP-GFPN-05ff43-20260923-solverevent, at
            experiments/EXP-GFPN-05ff43/amendments/v2_addendum_solverevent.yaml,
            status draft, approved_by null, archived by TASK-20260923-4eee3b,
            decided by a later separate act (reserved TASK-20260923-ad3016,
            DEC-20260923-d670c6).
      key_parameters: >-
        - EVENT SIGNATURE (SE-1): degenerate_parametrisation with one of the
          three non-square-free / degree-mismatch reasons of classify_solve
          (v2_solver.py lines 498, 501-502, 505). The substitution-failure
          reason (line 507) and every other class are excluded.
        - BOUNDED RE-SOLVE (SE-2): on that signature, the identical input is
          re-solved with identical argv, cap and timeout, at least 2 s after
          the previous attempt, up to K + 1 attempts in all. The recorded
          result is the last attempt. A signature that reproduces K + 1 times
          keeps its frozen class. Every attempt must show the same input hash
          and the same printed quotient dimension, or the package fails. All
          attempts are preserved and reported. Applied by code to every solve
          uniformly; never by hand, per target or per outcome.
        - K: the least k in {2, 3, 4, 5} with S_ub * u_max^(k + 1) <= 0.01,
          where u_max is the largest one-sided 95% Clopper-Pearson upper bound
          of the per-solve event rate over the four characterization classes,
          and S_ub bounds the number of solves both plans can make (CR-2). No
          qualifying k: the draft is not approvable as written.
        - REG-1 (SE-4): compares the recorded attempt. (a)-(c) unchanged; (d)
          byte-identical, or the parsed comparison PS-4 (d) already names,
          chosen by CR-3 from the characterization. The exclusion list gains
          NOTHING; attempt files and solver-events.json sit outside the
          compared globs and are quoted in REG-1's output.
        - RC-6 probe (SE-5): world A "0", world B "12345"; any difference in a
          compared field of the RECORDED results stops the stage; events are
          recorded, not a stop by themselves; run once.
        - PYTHONHASHSEED "0" for package drivers (SE-6).
        - NEW LAYER, PLANS AND IDS (SE-7): implementation-v2-r2/,
          implementation-v2-r2.md, trial-plan-v2-r2.json,
          trial-plan-v2-a1-r2.json, derived from the FROZEN plans; protocol
          labels 2-r2 / 2-a1-r2; 42 fresh ids; ceiling 44 of 48.
        - Development checks DV-1..DV-10 on the delivered code (DV-1 complete
          with the Sage start-up probe; DV-6 re-run), plus DV-11 (every
          msolve launch goes through the wrapper), DV-12 (the re-solve path,
          forced, three cases) and DV-13 (hash seed read back).
        - msolve binary and flags UNCHANGED.
      why_this_combination: >-
        - (c) removes the failure mode where it occurs, at the solve, without
          changing the solver's path, so RUN-GFPN-ac4487 remains a valid
          reference. It cannot select among D values: the quotient dimension
          is printed before the parametrisation and must agree across
          attempts.
        - (d) in NARROW form keeps REG-1 and the probe strict: no tolerance
          on any value, nothing new excluded.
        - (a) turns the two judgement calls (how many attempts; bytes or
          parsed) into formulas applied to archived data, and tests the
          rule's premise (CR-1) before any spend.
      why_not_b_now: >-
        A solver-invocation change (`-c 0`, `-c 1`, a seed) alters msolve's
        algorithmic path relative to RUN-GFPN-ac4487 and every archived solve,
        so REG-1 would lose its reference. `-c 0` would make msolve quit where
        it now succeeds, adding missing D. `-c 1`'s determinism and any seed
        option are not established, and neither is the mechanism. It is the
        pre-declared route if CR-1 (other nondeterminism) or CR-2 (no
        qualifying K) fires, by a new draft. The characterization's C-3 (c)
        diagnostics gather the evidence it would need, without adopting it.
      outcome_blindness: >-
        Everything is fixed before any repaired solve. The characterization
        solves only (i) toy inputs, and (ii) RUN-GFPN-ac4487's 36 inputs,
        whose outputs are archived and reviewed. It solves nothing at a
        ladder prime, and no fixture, cell, build or anchor system whose
        outcome is unknown. K and the (d) branch follow from formulas written
        before it runs.
      why_not_rule_under_the_existing_approval: >-
        The paristack addendum puts "solvers and msolve flags" and every
        function replacement other than curve_order_pari out of scope (lines
        387-401). A re-solve is a new function wrapper and changes when
        degenerate_parametrisation is recorded (reanchor R-5, lines 888-901).
        That is a protocol change and needs an amendment and a separate
        approval.

    R-4_queue_state:
      ruling: >-
        TASK-20260923-a681f9 is TERMINAL `failed` NOW. The successor work is
        new cards: the characterization TASK-20260923-6599cf and, after the
        approval act, the successor stage (reserved TASK-20260923-de3a7d).
      reasons: >-
        - It ran and stopped under its own stop rule. Its completion gate is
          not met (DV-7 and DV-1 incomplete; AR-1 unmet). It is not
          `invalid`, because its artifacts are a correct record of what
          happened, and not `cancelled`, because it ran.
        - Re-dispatching it is impossible without editing its card. Its
          constraints bind the r1 layer, RC-6 as written, and a write scope
          that already holds the preserved outputs, which a second run would
          overwrite.
        - Left `queued`, it is a HAZARD. The claim overlay reads a failed
          release as queued_scope_free, so any session could re-claim it and
          re-run a stale card. Until the revision lands, no session may claim
          it (this decision).
      dependent_tasks: >-
        CANCELLED NOW, because their conditions can never occur whatever the
        approval act decides:
        - TASK-20260923-b53550: phase A needs R1 completed (card RA-6,
          phase_a.runs), and phase B needs R2 on phase-A-bound r1 plans.
        - TASK-20260923-3aa31e and TASK-20260923-292052: they run the r1
          plans under protocol labels 2-r1 / 2-a1-r1 and the r1 ids, which
          are not final and are retired below.
        - TASK-20260923-befe48: its only source is TASK-20260923-292052.
        The successor cards are written by the approval act.
        The review-chain placeholders (TASK-20260923-387ca1,
        TASK-20260923-53e1fe, TASK-20260923-5f1901, TASK-20260923-817065,
