      not_attempted_record: >-
        The 31 packages of trial-plan-v2-r1.json and the 11 of
        trial-plan-v2-a1-r1.json are recorded NOT ATTEMPTED: stage R1
        stopped, so neither plan became final. This is a stop outcome, never
