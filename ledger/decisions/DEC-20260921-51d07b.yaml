  the_decision_stated_plainly: >-
    RUN-FROB-e6c204's interruption is diagnosed, honestly and without
    fabrication, as the SAME failure mode that destroyed RUN-FROB-39714f,
    RUN-FROB-f3e2a3, RUN-FROB-16ecb6, RUN-FROB-5490f1, RUN-FROB-0b1c8e,
    RUN-FROB-5fa3f0, RUN-FROB-35c3b1, and RUN-FROB-a91f4c: a
    whole-environment/container restart external to any script's own
    control, external to any timeout wrapper (there was none this time
    either), and external to any code defect in
    driver-v2.py/checker-v2.py. This is now the NINTH, CONSECUTIVE instance
    of the identical infrastructure failure mode under the same,
    already-corrected source and launch procedure, launched correctly by
    the dispatching session every time. RUN-FROB-e6c204 survived
    approximately 9 minutes -- squarely mid-range for this lane, close to
    the third point (RUN-FROB-39714f, ~9min) and the fourth point
    (RUN-FROB-f3e2a3, ~7min). The full observed interval sequence is now
    ~20, 11, 9, 7, 4, 5, 37, 3.5, and now 9 minutes. This ninth point does
    NOT challenge DEC-20260921-cb38f4's own "highly variable, no confirmed
    upper bound or distributional shape, no monotonic trend"
    characterization in any direction -- it is simply another mid-range
    data point in a sequence already established as highly variable. This
    coordinator states that plainly, exactly as instructed: there is
    nothing new to say about the pattern beyond adding this ninth
    observation to the record, and this record does not invent a new
    narrative where none is warranted. Declaring the range "narrower" or
    "confirmed" on the strength of one unremarkable mid-range point would be
    exactly the false precision DEC-20260921-cb38f4 itself declined to
    manufacture from its own eighth point. Like all nine interruptions
    themselves, this characterization remains infrastructure signal, never
    negative mathematical evidence (AGENTS.md core rule 3 / CLAUDE.md rule
    3), and this record does NOT condition its own authorization on any
    reading of it. None of the nine says anything about H-FROB-73df22. On
    that basis, this coordinator (1) makes no change to RUN-FROB-e6c204's
    directory -- it was already preserved exactly as it stands (real partial
    roots.jsonl.gz, 86075493 bytes, sha256
    837087cddf0aaa500f55fa7688c2cfbc81ce37eda360780b1ba9663682998c01, and the
    other six adapter/launch files, no execution-receipt.json) by the
    dispatching session prior to this engagement, and this record does not
    touch it again -- and (2) authorizes a fresh retry under a fresh,
    coordinator-proposed (NOT yet allocate_id.py-confirmed) run_id,
    RUN-FROB-9c4e81, via a fresh trial-plan-stage0-v14.json, a fresh
    run-binding, and a fresh launch handoff to the Executor
    (TASK-20260921-b052d5), per the user's standing instruction to keep
    retrying automatically through this exact failure mode.

  rationale:
    - >-
      NINTH, CONSECUTIVE INSTANCE OF THE SAME FAILURE MODE, STILL
      INFRASTRUCTURE/PROTOCOL SIGNAL, NEVER NEGATIVE MATHEMATICAL EVIDENCE,
      PER AGENTS.md CORE RULE 3 / CLAUDE.md RULE 3. RUN-FROB-e6c204 is not a
      new, distinct failure mode; it is a REPEAT of RUN-FROB-a91f4c's,
      RUN-FROB-35c3b1's, RUN-FROB-5fa3f0's, RUN-FROB-0b1c8e's,
      RUN-FROB-5490f1's, RUN-FROB-16ecb6's, RUN-FROB-f3e2a3's, and
      RUN-FROB-39714f's own whole-environment-restart mode -- entire process
      tree destroyed, including the Python supervisor that would have
      written execution-receipt.json, before that supervisor's own
      completion/receipt-writing logic could run at all. This is the
      ELEVENTH interruption overall in this lane's history and the NINTH
      consecutive occurrence of the identical infrastructure failure mode
      under the same, already-corrected source and launch procedure.
      Nine-for-nine launch attempts under driver-v2.py/checker-v2.py have
      now been killed by whole-environment restarts, all non-scientific,
      non-protocol infrastructure signal. None of RUN-FROB-e6c204,
      RUN-FROB-a91f4c, RUN-FROB-35c3b1, RUN-FROB-5fa3f0, RUN-FROB-0b1c8e,
      RUN-FROB-5490f1, RUN-FROB-16ecb6, RUN-FROB-f3e2a3, or RUN-FROB-39714f
      says anything about H-FROB-73df22, RQ-FROB-7d8dd4, or whether
      Frobenius structure moves the index-calculus exponent.
    - >-
      HONEST, DELIBERATELY UNCHANGED CHARACTERIZATION -- THIS POINT DOES NOT
      CHALLENGE THE EXISTING CHARACTERIZATION AT ALL. DEC-20260921-cb38f4
      stated, on eight points, that the interval remains "highly variable,
      observed so far in roughly the 3.5-to-37-minute range... no evidence
      of any monotonic trend in either direction." This ninth point (~9min)
      is squarely inside that already-stated range, close to the third and
      fourth points (~9min, ~7min from RUN-FROB-39714f and RUN-FROB-f3e2a3).
      It does not break either bound, does not suggest a narrower band, and
      does not add evidence for or against a monotonic trend -- reading all
      nine points in order (20, 11, 9, 7, 4, 5, 37, 3.5, 9) still shows no
      consistent direction: five consecutive falls, two rises, a fall, then
      a rise back to mid-range. This record does not manufacture a new,
      more-precise-sounding distributional claim from an unremarkable point,
      and does not pretend the range is now "confirmed" merely because a
      ninth point happened to land inside it -- eleven points from an
      externally-imposed, uncontrolled restart process still cannot
      establish a confirmed distributional shape or upper bound. The honest
      statement on nine points is exactly DEC-20260921-cb38f4's own honest
      statement, unchanged: highly variable, roughly 3.5-to-37 minutes
      observed so far, no confirmed distributional shape, no monotonic
      trend. If there were nothing new to say about the pattern, this record
      says that plainly instead of inventing a narrative -- and there is
      nothing new to say here. This correction (or rather, non-correction)
      changes no authorization in this record: like the nine interruptions
      themselves, the interval sequence, under any of its framings, remains
      infrastructure signal only, never negative mathematical evidence, and
      this record does not condition RUN-FROB-9c4e81's authorization on any
      reading of it.
    - >-
      NO FABRICATED RECEIPT, AND NO REDUNDANT PRESERVATION ACTION. This
      decision does NOT author an execution-receipt.json for RUN-FROB-e6c204,
      and does not construct, estimate, or infer one from the partial
      roots.jsonl.gz or from what a graceful interruption receipt would
      ordinarily contain. RUN-FROB-e6c204's directory was already preserved
      exactly as found by the dispatching session in commit 1eb6f0469, prior
      to this engagement -- this coordinator's own Glob confirms it still
      contains exactly seven entries (launch.json, command.txt, stdout.log,
      stderr.log, environment.json, tuples.jsonl.gz, roots.jsonl.gz) and no
      execution-receipt.json or other downstream adapter/checker artifact.
      Per AGENTS.md core rule 5 ("Never fabricate commands, outputs, timings,
      statistics, citations, or runs. Missing data stays missing and is
      reported as such."), this record does not edit, complete, or backfill
      that directory in any way.
    - >-
      THE RUNTIME LOCK BEING CITED REMAINS THE SAME, STILL-CURRENT, STILL-
      UNEDITED, LAUNCH-AUTHORIZED LOCK. This coordinator independently
      cross-checked linux-runtime-lock-successor-20260914-c85f6a.json's
      content sha256
      (46d918a1a4b9d358df39f09a87d5221128cc1ce19cb62672bc35204785952eb5)
      against trial-plan-stage0-v13.json's own and
      run-binding-stage0-v13-retry-20260921.json's own already-filled
      runtime_lock_sha256 fields (all agree, re-read directly in this
      engagement). Nothing about the runtime, its guards, or its
      authorization changes here; a ninth whole-machine restart is not
      evidence the runtime lock's own guards were inadequate -- the failure
      is again a whole-machine restart, a class of event no per-process
      guard in linux-runtime-lock-successor-20260914-c85f6a.json claims to
      protect against, and this record does not construct a new claim that
      it does.
    - >-
      WATCHDOG SIZING RATIONALE REMAINS VALID, UNCHANGED. No run in this
      lane has ever shown signs of hanging or needing a shorter or longer
      watchdog; all eleven interruptions observed to date have each been
      either an instant application-level error, an external interruption
      from this lane's own now-corrected tooling, or (nine times now) an
      infrastructure restart external to any process's own control -- never
      a hang. RUN-FROB-e6c204 itself was still progressing normally (its
      roots.jsonl.gz was real and growing, reaching 86075493 bytes) at the
      moment it was destroyed, at ~9 minutes -- far short of the 86400s
      watchdog ceiling. 86400 seconds remains sized generously above the
      only real duration signal available and remains a ceiling meant never
      to bind in the normal case, machine protection only per CLAUDE.md
      "Research budgets: progress first."
    - >-
      DIRECTION CHECK, unchanged from the whole DEC-20260909-bf5b48 ..
      DEC-20260921-cb38f4 chain. Stage0 is not itself exponent-moving; it is
      the correctness gate for H-FROB-73df22's two arms. No scientific claim
      of any kind is advanced by this admission/retry-authorization record.
      FROB is a declared ECC area (orchestration/research-priority.yaml line
      79), ranked ahead of non-ECC candidates at every selection point, with
      unlimited batch/wall-clock budget per AGENTS.md "ECC comes first."
    - >-
      BUDGET. Per CLAUDE.md "Research budgets: progress first" (2026-09-06):
      research cost estimates are advisory and require no repeated user
      approval; the Coordinator continues justified work within the
      authorized research scope. No 90-day stagnation review is active or
      warranted -- this lane has shown continuous documented progress across
      DEC-20260909-bf5b48 through DEC-20260921-cb38f4 and now this record,
      all within roughly two weeks, including nine genuine, correctly-
      executing partial runs each destroyed only by infrastructure external
      to this program's own control. Authorizing a further retry after a
      ninth, consecutive infrastructure-only interruption is exactly the
      kind of routine continuation CLAUDE.md's "progress first" instruction
      protects, not a new spending decision requiring fresh justification.
      This is additionally, and explicitly, covered by the user's own
      standing instruction, relayed by the dispatching session, to keep
      retrying automatically through this exact recurring failure mode --
      stated multiple times already. This coordinator's role is to execute
      that instruction faithfully via a proper decision record, not to
      second-guess it. A whole-machine restart mid-run is squarely within
      "watchdog expiry checkpoints a task; it does not exhaust the
      campaign."
    - >-
      NA-4's INFRASTRUCTURE-DIAGNOSIS RECOMMENDATION REMAINS OUTSTANDING AND
      IS REAFFIRMED, NOT RE-OPENED AS A NEW GATE. DEC-20260921-1988f5's own
      NA-4, reaffirmed by every intervening decision through
      DEC-20260921-cb38f4, recommended, non-blockingly, that the dispatching
      session open a dedicated infrastructure-diagnosis task once the
      five-for-five trigger DEC-20260921-fd5bf1 itself named was met. This
      record has not been told, and does not assume, that this diagnosis
      task has been opened, run, or completed; nothing in the materials
      reviewed for this record reports its status. A ninth consecutive
      instance of the identical failure mode is further, unambiguous
      reinforcement that this diagnosis remains worth pursuing, and this
      record reaffirms it rather than re-litigating or escalating it into a
      new condition -- it still runs in PARALLEL with, and never blocks, the
      retry authorized here.
    - >-
      TWO DIVERGENT COUNTS, REPORTED HONESTLY AND SEPARATELY. This lane has
      now seen NINE genuine launch-and-restart cycles (RUN-FROB-2404fa
      through the current RUN-FROB-e6c204) and, separately, FOUR trial-plan
      VERSIONS minted since v11 (v11, v12 [never launched, wiring bugfix],
      v13 [launched, ninth restart], and v14, this record's own
      authorization). These counts diverged when v12 was admitted and
      abandoned without ever launching a process; this record does not
      collapse them into a single number in either direction, and does not
      count the v12 non-launch as a tenth restart or omit it from the
      record's own history.

