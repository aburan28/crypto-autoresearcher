    roots.jsonl.gz, 86075493 bytes, sha256
    837087cddf0aaa500f55fa7688c2cfbc81ce37eda360780b1ba9663682998c01, last
    modified ~2026-09-21T05:13 -- for approximately 9 minutes before it, too,
    was interrupted by the exact same failure mode as every genuine launch
    before it: a whole-environment/container restart external to any
    script's own control, confirmed via /proc/uptime showing ~11s (fresh
    boot) at the next check. This is the NINTH, CONSECUTIVE instance of the
    identical infrastructure failure mode under the same, already-corrected
    source and launch procedure, launched correctly by the dispatching
    session every time. TASK-20260921-fc0bd1's claim (which held
    RUN-FROB-e6c204's write_scope) has already been released as failed with
    this same disclosure by the dispatching session (commit 5555a1a1c), and
    RUN-FROB-e6c204's directory was already preserved exactly as found by
    the dispatching session (commit 1eb6f0469), both prior to this
    engagement -- this record does not repeat either action.
    NOTE ON TWO DIVERGENT COUNTS, stated plainly rather than conflated: there
    was also a TENTH admission attempt, v12 (TASK-20260921-b18586), that was
    never actually launched at all, due to the dispatching-session wiring
    bug described above -- that is a distinct event from a genuine
    whole-environment restart, and this coordinator does not count it among
    the restarts. Restart count and trial-plan-version count have therefore
    diverged: this is the NINTH genuine LAUNCH-AND-RESTART (RUN-FROB-2404fa
    through RUN-FROB-a91f4c being the first eight, RUN-FROB-e6c204 under
    TASK-20260921-fc0bd1 being the ninth), while this is only the FOURTH
    trial-plan VERSION minted since v11 (v11 -> v12 [never launched,
    wiring bugfix] -> v13 [launched, ninth restart] -> v14, this record's own
    authorization). Both counts are reported honestly and separately; neither
    is used to inflate or deflate the other.
    The full interval sequence across all nine genuine launch attempts under
    driver-v2.py/checker-v2.py is now: ~20min, ~11min, ~9min, ~7min, ~4min,
    ~5min, ~37min, ~3.5min, and now ~9min. DEC-20260921-cb38f4 characterized
    the eight-point sequence as "highly variable... no monotonic trend in
    either direction". This ninth point (~9min) is HONESTLY UNREMARKABLE: it
    falls comfortably within the previously observed range, close to the
    third and fourth points (~9min, ~7min from RUN-FROB-39714f and
    RUN-FROB-f3e2a3), and does not challenge DEC-20260921-cb38f4's
    characterization in any direction. This record does not manufacture a
    new narrative, does not widen or narrow any stated bound, and does not
    claim any distributional shape the nine points still cannot support --
    see the_decision_stated_plainly and rationale below.
    This coordinator has no shell and cannot independently recompute any
    hash, re-check process state, or re-read /proc/uptime; the cited sha256
    (roots.jsonl.gz:
    837087cddf0aaa500f55fa7688c2cfbc81ce37eda360780b1ba9663682998c01), the
    86075493-byte size, the ~2026-09-21T05:13 last-modified time, the uptime
    reading, and the two cited commit shas (1eb6f0469, 5555a1a1c) are
