    This coordinator also independently re-read
    coordination/frobenius/BATCH-2f8435/admission/run-binding-stage0-v13-retry-20260921.json
    in full: it shows plan_sha256
    (b9cdeb5f33870e18cfc509f4f4aec585677f95ba271823debe851c0248ed5aa5) and
