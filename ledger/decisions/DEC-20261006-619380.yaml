  context: >-
    /design-experiment, one contract, for IDEA-20261005-cd4cf5. No
    hypothesis and no experiment on origin/main cites it. The branch
    design/drinf-cd4cf5-height was created from origin/main at
    3575cc2705c200ffc0c0163c82548ab3335585ce and git merge origin/main
    reported already up to date.

    The contract scores H_coeff, the least tau-exponent with a nonzero
    coefficient, and H_gcd, the gcd of the tau-exponents, on the six
    modules M00, M01, M10, M11, M20, and M21, which are Phi_T = g tau +
    Delta tau^2 over F_3 with Delta nonzero. The pre-registered
    prediction is height1_count = 4, height2_count = 2, agreement of
    the two integers on each of the six, and H_coeff minus H_gcd = 1
    on tau^2 + tau^3. A different split is a negative. Equal heights
    on that neighbor are a negative. The Carlitz module Psi_T = tau is
    predicted to have both integers equal to 1. No torsion root is
    counted. No characteristic polynomial is counted. No ECDLP exponent
    is claimed.

    This session opened knowledge/literature/KN-LIT-174.md and
    knowledge/literature/KN-LIT-1515.md. Neither note states a height
    integer. The PDFs were not opened. Drinfeld 1974 stayed provenance
    recalled. That recalled pointer is not evidence for this approval.
    The approval is of the protocol.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, seeds, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. Success is the
    4+2 split together with the neighbor gap of 1, and it fails when
    the split differs or the neighbor heights are equal. No field
    required for approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The 4+2 split, the agreement on the six modules, and the neighbor gap of 1 are fixed before any run.
    - The Carlitz control, the Delta-scaling check, and the separate treatment of a third PDF column give the census a way to come back invalid or negative instead of a repaired label.
    - A different split, or equal heights on tau^2 + tau^3, is a negative, so success can fail.
    - No polynomial was scored while writing this decision, and no ECDLP algorithm is claimed.

  evidence_refs: []
  limitations:
    - Toy scope only: q = 3, six modules, one neighbor. No transfer.
    - The prediction is the split and the gap, not a measured observation.
    - This decision authorizes a later run. It does not start one.

