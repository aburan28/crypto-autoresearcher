    at p = 16411, m = 3, and excluded the subgroup base as too small). The
    controls battery of IDEA-20260921-da1896 (identity, matched random,
    interval, ell = 1 trivial coset, generic relabelled Z/nZ) is built into the
    protocol as fixed overhead rather than as a separate tooling build.
    H-PFDR-8a4f44 (proposed) argues that certifying a multiplicative-subgroup
    base by character sums needs a saving equal to the whole square-root
    exponent at beta = 1/m; its coverage arm (EXP-PFDR-1c5939) is a draft that
    has never run. No committed measurement of a subgroup base at
    index-calculus size exists.

  rationale:
    - id: RA-1_the_design_turn
      text: >-
        KN-FIND-007 makes the source idea's central prediction (a mean-yield
        ratio rho_ell = 1 + Theta(delta/p) at matched |FB|) false by
        arithmetic: every base of size B has total count binomial(B+m-1, m).
        The cover point-count excess delta acts on the mean only through B.
        The idea is therefore converted, not approved as written: the mean is
        demoted to an instrument gate (P1) and the nominal-size ratio rho_nom
        is registered as an identity (P3), and the hypothesis tests the only
        free supply quantities -- coverage, dispersion, residue-label profile
        (and Fourier bias, secondary) -- with the idea's cover-sign direction
        kept as the alternative (HEUR-PFDR-COVERSIGN). This is recorded here
        so that no later reader mistakes the conversion for a softened test.
    - id: RA-2_both_regimes
      text: >-
        Regime (a) (ell in {3, 5, 7}, |FB| about p/ell) is the idea's own
        minimal test and asks the structure question at large size. Regime
        (b) (x in g*mu_d, d | p-1, d about p^(1/m)) is the index-calculus-
        relevant size with polylog membership: it is H-PFDR-8a4f44's operating
        point beta = 1/m, where that record says no known bound can certify
        the count. A random-model reading there is the heuristic every
        subgroup-base index-calculus cost model would condition on, so this
        experiment is a heuristic-validation experiment in the sense of the
        target-result profile (sampling the relevant distribution exactly,
        comparing against the predicted distribution, tail checks), at toy
        size, with the scale stated.
    - id: RA-3_exponent_bias
      text: >-
        Against docs/target-result-profile.md: the distributional arm is not
        itself exponent-moving (KN-FIND-007 bounds any coverage gain at 1.582
        and the harvest-all gain at zero), and the record says so. What the
        experiment adds that bears on an exponent is the cost arm: the
        charged per-relation cost of a polylog-membership base of size
        p^(1/m) under two engines and a projected end-to-end slope measured
        against Pollard rho on the same curves. The Coordinator's prior is
        that both engines give a slope near 1 against rho's 1/2; a slope at
        or below rho's would be the reportable surprise. Cheap (toy primes,
        exact counts), decisive for a KN-OPEN-020 class, and it produces the
        empirical reading H-PFDR-8a4f44's closure currently lacks. Ranked
        above building the full fb_meter of IDEA-20260921-da1896 first,
        because the battery is embedded here at no extra design cost; the
        meter as reusable tooling remains a separate proposal.
    - id: RA-4_protocol_completeness
      text: >-
        Decision checklist (agents/coordinator.md): (1) uncertainty -- whether
        coset / subgroup bases are distributionally random at matched size,
        and what they cost per relation; (2) decision-changing outcomes --
        O-POS opens a replication and growth design, O-NULL extends structure
        invariance to the high-degree class (weaken plus replication), O-UNDIR
        records an anomaly without the mechanism, C-ANOM triggers
        review-breakthrough; (3) cheapest valid experiment -- exact E0 census
        (one discrete-log table plus cyclic convolutions per base) instead of
        target sampling; (4) controls -- identity, ell = 1, conservation,
        random-K (100 draws), GENERIC-ZN, interval-K, known-positive
        small-multiples base, EV-FB-001 anchor, null replay, engine agreement,
        rho comparator; (5) budget -- memory 8 GB and justified process
        watchdogs; time and CPU advisory and null by user instruction;
        maximum_runs 14; (6) artifacts -- enumerated in required_artifacts;
        (7) proof-oriented audits -- see RA-5; (8) closure -- no lane closes on
        this run: O-NULL is empirical_only on one run and supports weaken plus
        replication only; the obstruction quantity would be the per-family
        pooled z with its MDE over the stated scope.
    - id: RA-5_proof_search_map_gate
      text: >-
        KN-TECH-080 gate, checked on H-PFDR-6c1e94.proof_search_map:
        (1) bottleneck named (relation supply distribution and charged solve
        cost; the mean is fixed) and baseline reproduced exactly as parameter
        slices -- the ell = 1 / identity closed forms and the EV-FB-001
        anchor rows at p = 16411 -- as in-run frozen fixtures;
        (2) observation-collision search performed analytically (mean
        collides for all equal-size bases; size-versus-structure removed by
        exact K matching; automorphism collisions removed by excluding
        j = 0, 1728; coverage-versus-Sidon separated by the Fourier column);
        (3) quantifier order explicit, bases fixed per curve before any target
        or draw; (4) method ceiling (toy distributional statement plus
        descriptive slopes) and nearby-object controls (interval-K,
        GENERIC-ZN, known-positive small multiples); (5) strictness is not
        claimed and the interface obligations (E0 and E1 correctness,
        charging) have their own proof obligations. PASS.
    - id: RA-6_closed_forms_derived_here
      text: >-
        P2's identity constants, derived for this record by a Burnside count
        over the symmetric group on m letters with D = G minus O: for m = 2,
        ordered pairs summing to R number N-2 (R != O) or N-1 (R = O), and
        the fixed pair count is 1 (R != O) or 0, giving c_2(R) = (N-1)/2 for
        every R; for m = 3, ordered triples number (N-1)^2 - (N-2) (R != O) or
        (N-1)^2 - (N-1) (R = O), transposition-fixed triples N-2 or N-1, and
        3-cycle-fixed triples 1 or 0, giving c_3(R) = (N^2-1)/6 for every R.
        Both satisfy conservation: N(N-1)/2 = binomial(N, 2) and
        N(N^2-1)/6 = binomial(N+1, 3). Removing the at most two points with
        x = 0 (the ell = 1 base) lowers c_2 by at most 2 and c_3 by at most
        N-1 (each removed point lies in at most (N-1)/2 of the size-3
        multisets for a given R). These derivations are the source of P2 and
        are re-checked by the Validator.
    - id: RA-7_anchor_facts_computed_here
      text: >-
        16410 = 2 * 3 * 5 * 547 with 547 prime (no prime up to 23 divides
        it), so its divisors are 1, 2, 3, 5, 6, 10, 15, 30, 547, 1094, 1641,
        2735, 3282, 5470, 8205, 16410. With d2* = sqrt(2 * 16411) = 181.2 and
        d3* = (6 * 16411)^(1/3) = 46.2 and the window [0.5, 2], only d = 30
        (m = 3) qualifies, and 7 does not divide 16410. The EV-FB-001
        conservation means binomial(B+2,3)/16411 for B = 6, 8, 10, 12 are
        56, 120, 220, 364 over 16411 = 0.00341, 0.00731, 0.01341, 0.02218.
        The executor re-verifies all of this at Stage 0 and stops on any
        difference.
    - id: RA-8_prior
      text: >-
        COORDINATOR PRIOR, recorded before any run: O-NULL on every family
        (coset and subgroup bases distributionally random at matched size),
        NOT-DEGENERATE for H-PFDR-8a4f44's coverage arm, and C-DOM on cost
        (index-calculus slope near 1, rho near 1/2). Confidence moderate on the
        null (no mechanism is known that couples multiplicative cosets of the
        x-line to additive structure in the group law of a generic curve);
        high on C-DOM. An overturned prior is the informative outcome.

