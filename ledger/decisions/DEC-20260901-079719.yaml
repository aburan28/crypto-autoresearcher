coordinator_decision:
  id: DEC-20260901-079719

  context: >-
    GOAL-AES-003 batch-closing act by the dispatching Coordinator (session
    coordinator-aes003-1, 2026-09-01), executed as the ledger archive task
    TASK-20260901-f26b32 of BATCH-99945e. BATCH-99945e was opened by
    DEC-20260901-f41451 to execute DEC-20260901-3150f0's RANK 1: the five
    cheapest named controls from the BATCH-fe0bdc red team
    (TASK-20260901-31bac8), sealing or narrowing the scope-narrowed
    CONFIRMED-MISMATCH-ALIVE verdict of EV-AES-ec53f1.

    The producer (TASK-20260901-74271d, 762 s of 2700 s, 7/8 runs) returned
    ALL-SEALED: J4 random-bijection r=6 arm DEAD (2 hits at 2^30, subclass-
    scoped per disclosed deviation); J3 second-seed affine rerun hits = 2^30
    (T=0); J2 bridge r = 3/7 500/500 both laws; J1 census r = 11..16 flat
    160/160 with keyed r = 16 cell 500/500; GUARD identity law 0/500 on the
    dead Feistel substitute. The independent validator (TASK-20260901-b064ff,
    fresh session, fresh code, 4/4 runs) derived ALL-SEALED independently
    from the preregistered consequence map with zero numerical discrepancies
    (112/112 checks). No arm killed or narrowed the verdict, so no new
    red-team round was triggered (the DEC's own reserved condition).

  decision: close_batch

  decision_scope: >-
    THIS DECISION CLOSES BATCH-99945e, RECORDS ITS EVIDENCE AS
    EV-AES-b2910a, AND MOVES THE GOAL HEAD.

    It moves current_batch_id to BATCH-99945e, dispatch_queue_path to
    coordination/goals/GOAL-AES-003/batches/BATCH-99945e/dispatch_queue.json,
    appends the BATCH-99945e batch_checkpoints entry, rewrites next_action,
    and leaves latest_verified_commit to be advanced by the verified
    follow-up commit once this ledger archive is post-commit verified. It
    promotes NO knowledge, creates NO hypothesis, and asserts NOTHING beyond
    EV-AES-b2910a's scoped statements: in particular the J4 generality
    statement is subclass-scoped (nibble-wise lift of a 16-symbol
    permutation; the 256-byte class remains untested), and the comparator-
    side seed variance and the unmeasured candidate carrier e remain open
    exactly as recorded.

  target_ids:
    - GOAL-AES-003
    - RQ-AES-003
    - BATCH-99945e
