  outcome: >-
    ALL-SEALED: every preregistered control met its expectation with zero
    validator discrepancies, and the scope-narrowed CONFIRMED-MISMATCH-ALIVE
    verdict of EV-AES-ec53f1 survives its hardening battery:

    (i) J4 (load-bearing): the r=6 random-bijection arm read DEAD (2 hits
    at 2^30 vs frozen excess_E = 2^30, band <=8) -- the factor-contrast
    reading 'death at r=6 tracks the S-box' generalizes from the AES table
    to nonlinearity within the tested subclass (nibble-wise lift of a
    uniform 16-symbol permutation; disclosed deviation from the red team's
    256-byte recipe; the 256-byte class remains a named control).

    (ii) J3: second-seed affine rerun reproduced hits = 2^30 (T=0, W=3 on
    100% nontrivial) -- the affine side's seed/key variance is discharged
    at 2^30.

    (iii) J2 + J1: empirical law coverage widened to r in {2,3,5,6,7} and
    the r-free derivation survived extension to r = 16 (census flat
    160/160, keyed r = 16 cell 500/500, r*_aff still undefined).

    (iv) GUARD: the identity law held 0/500 on the dead Feistel substitute
    -- the proves-too-much non-transfer is now empirically sealed; the law
    discriminates alive (100%) from dead (0%).

    Composed: the mechanism localization stands as scope-narrowed in
    EV-AES-ec53f1 OBS-FE0-4, now hardened on all four joints its red team
    named (J1-J4), with the GUARD converting a derivation-only premise to
    an empirical seal. What remains open is recorded, not absorbed: the
    256-byte bijection class, the comparator-side seed variance, and the
    unmeasured candidate carrier e.

  rationale:
    - >-
      The battery's preregistered consequence map returned ALL-SEALED;
      the validator independently derived the same outcome from raw
      data; the close is the mechanical recording of committed results.
    - >-
      No new red-team round: no arm killed or narrowed the verdict, and
      the verdict's claim-changing review already occurred in
      BATCH-fe0bdc. The DEC's own reserved condition (post-hoc red team
      if an arm kills the verdict) did not fire.
    - >-
      The J4 subclass scope is carried in EV-AES-b2910a's strength_basis
      and unresolved confounds rather than being absorbed into the
      generality statement (Pareto honesty; the 256-byte control is
      named and costed, ~2-4 min, available to any future batch that
      spends the generality beyond the subclass).
    - >-
      Strength stays moderate per EV-AES-b2910a's strength_basis.
      Knowledge promotion remains not warranted until the dilution ramp
      (RANK 2) measures the candidate carrier e under a nonlinear
      S-box.

  next_action: >-
    RANK 1 (was RANK 2): IDEA-20260901-bcb117 -- the nonlinearity
    dilution ramp, now that the hardening battery sealed the verdict it
