    J2:
      owner: TASK-20260929-75e9e4
      reviewer_verdict: holds
      composed_disposition: holds
      key_applied: J2 clause of K-approve satisfied
      basis: |
        No artifact of the plan's J2 list is found. Seven blocks reproduce their
        pins by the pinned method and by a YAML-free reader, and all compile and
        import. On synthetic Z/N, the committed shuffle collapses exact
        filters and preserves planted marginal-only filters (PC-6a and PC-6b
