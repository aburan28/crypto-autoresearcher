    rule: Plan composition.discharge_check, applied as written (CB-7). Table in the worksheet.
    revision_requirements_R1_to_R12: |
      Discharged: R-2, R-3, R-4, R-5, R-6, R-8, R-9, R-10, R-12. The following
      are contradicted in part by the owning joint's report and so are
      undischarged in part.
      R-1: the shuffle as R-1 defines it holds (J2, PTM-D), but the named
      clause "audit_2 OC-1 separator", which classifies F1 as a marginal-skew
      object, is contradicted by RT-O1 and RT-O7.
      R-7: the clause "PC-9 exhaustive on CELL-K13" is contradicted by
      DEV-V-J2-1. The coded check compares curve-sampled with index-sampled
      readings, and the exhaustive value is not checked. The validator judges
      the redefined check sound but undisclosed.
      R-11: the justification limits and the KN-FIND-47da4e conditional hold,
      but the consequent's quantity is false by arithmetic for two declared
      arms (RT-O2).
    design_conditions_C1_to_C8: |
      All eight are discharged by named clauses that the owning reports do not
      contradict. C5 engages K-impediment, which is satisfied and is not a
      defect. C7 is discharged in letter, with DEV-V-J2-4 and RT-O2 carried as
      RR-9 and RR-4. For C1, the route is live (PC-16 reads LEAD in 3 of 3).
      Its narrow reach and its triggering by F1 are J3 defects, not labelling
      defects.

  # ---------------------------------------------------------------------------
  prior_versus_outcome:
    rule: |
      CB-5, against the plan's coordinator_prior, which was written before the
      object existed. Under PD-R1 the prior is informed, not blind. Under PD-R5
      the reviewers read DEC-20260928-9d9c47, so their concurrence on the
      version-1 items it quotes is informed.
    estimator_finite_sample_prior:
      - item: (a) exact controls separate from the measured null by one to two orders of magnitude
        outcome: Confirmed. (M - q50)/W is about 10 to 16 at M = 4, 29 at 16 and 48 at 64 (75e9e4 OBS-3); 25 to 62 W on Z/2^16 (PTM-B).
      - item: (b) the shuffle collapses an exact filter (p about 0.9) and preserves a planted marginal-only filter (p about 0.8)
        outcome: Confirmed, and stronger than expected (20/20 each; every seed at two shapes).
      - item: (c) LEAD reachable in principle only by several-unit excesses; a coarse floor stated as an interpretation limit
        outcome: |
          Confirmed and sharpened. The measured floor q50 + 3 W is 8.9 at
          M = 64 and 14.6 at 128, 1.4 to 1.7 times the design estimates. LEAD
          needs growth of the standardised excess, not merely its size, and
          the floor is undefined at M = 8 and 16 on the contract's grid.
      - item: (d) a bootstrap of a maximum under-covers unless the null draws independent random labels
        outcome: |
          Moot. The bootstrap is removed and the null uses fresh random labels.
          A cousin of the concern appeared: W is taken from the third-largest
          of 200 draws (CV 0.07 to 0.20), and one W standardises all ten seeds,
          so the L2 interval is anti-conservative against W's calibration
          error (RT-O6).
      - item: the scale, random-label G - 1 about 0.8 to 2 at M = 64
        outcome: |
          Wrong by a factor of 2.3 to 5.8. Two independent code paths measured
          about 4.6. The overturn event the plan named (a null far below
          sqrt(M)/10) did not occur; the null read far above, so the resolving
          floor is coarser than the prior expected.
    per_joint:
      - {joint: J1, prior: "holds p 0.7; break on the S grid N reading or a stated order", outcome: holds, reading: "confirmed; neither named break occurred"}
      - {joint: J2, prior: "holds p 0.5; break on item (d) or a null from its own resamples", outcome: holds, reading: "the location the prior thought most likely held; both named points absent"}
      - {joint: J3, prior: "holds p 0.55; break on SR-4 reachability", outcome: breaks, reading: "direction and one location confirmed (RT-O3); the primary break, an exact quotient hidden in a declared arm's marginal (RT-O1), was not in the prior"}
      - {joint: J4, prior: "holds p 0.75; if it breaks, on PTM-D", outcome: "breaks on over-scoped sentences only", reading: "PTM-D held; location wrong"}
      - {joint: J5, prior: "orders exact p 0.95; S within tolerance p 0.85, gap in the N reading or rounding", outcome: "agrees after matching the rule", reading: "confirmed; the one gap was the card's S constant, not the N reading or M rounding"}
    overall:
      prior: probability about 0.35 of approve; most likely revise on J2 or J3 with a local remedy
      outcome: revise on J3 and J4 with local remedies; J2 held
      reading: |
        The headline matched on J3, but the substance of J3's break was not in
        the prior. None of the three listed overturn events occurred.
    what_this_says_about_the_prior: |
      The prior looked where DEC-20260928-9d9c47 said to look, at the
      estimator's finite-sample behaviour, and that machinery held. The break
      came from the interaction between the certificate's exact quotient and a
      declared family arm. The producer caught this for F5 (DF-7) but not for
      F1, whose normal-basis weight parity is the trace. The next plan on this
      lane should carry a prior about which declared arms carry an exact
      component, and a control that feeds the rules one.

