        and CTL-MAXEXACT reads G = M. Every R-10 repair is in code. Every
        approval and supersedes field is present and approved_by is null.
        Version 1 is unchanged.
      minor_findings: |
        DEV-V-J2-1: PC-9's text claims an exhaustive pin that neither the code
        nor SR-1 checks. DEV-V-J2-2: the PC-9 filter is the family arm F2@0.
        DEV-V-J2-3: the stratified-shuffle branch is not gate-pinned.
        DEV-V-J2-4: HEUR-B1's validation has no committed code and no fixed
        chi-squared binning. DEV-V-J2-5: maximum_runs is 12 in the sheet and 16
        in the specification (the specification governs). INF-J2-b: PC-10 has
        no code-level guard.
      composer_note: |
        J2 tested the shuffle on the two objects the plan named: exact
        homomorphisms and marginal-only filters. F1 is neither, so J2 and RT-O1
        do not conflict. RT-O1 is a defect of the decision rules, composed
        under J3.
    J3:
      owner: TASK-20260929-7d8385
      reviewer_verdict: breaks
      composed_disposition: breaks
      key_applied: K-revise-defect
      breaking_artifact_1: |
        "A null that lands outside the null outcome": RT-O1. Verified against
        the frozen bytes by this composer. F1 is the normal-basis Hamming
        weight of x in M quantile classes (specification 376-386; CODE-FAM
        arms, audit 3271-3276). CODE-CORE make_h2 returns Tr(x(P)) + Tr(A)
        (audit 2077-2087), so on the a = 0 cells h2 = Tr(x). The shuffle is
        stratified by h4 "for the F5 composites only" (specification 338-341).
        In a normal basis, Tr(x) is the parity of x's coordinate weight,
        because every basis element b^(2^i) has trace Tr(b) = 1. So F1
        determines h2 on every parity-pure weight bucket. The contract's own
        DF-7 (audit 1254-1268) states that an exact component alone satisfies
        L1 and L3 "with no family content" and that the family null is excess
        beyond the known bits. By the contract's own definition, then, a label
        whose only arithmetic is h2 is a null of the family comparison, and it
        lands in LEAD. The red team's raw aggregate (computations.json
        2175-2190) is consistent with this. F1MODEL was LEAD in 7 of 7 and the
        uniform label NEG in 7 of 7. F1MARG, the same weight marginal without
        the parity, was NEG in 7 of 7, and F1STRAT, the same label under an
        h2-stratified shuffle, was NEG in 6 of 6. On a non-declared n = 9
        Koblitz curve the contract's own F1 code gives parity(F1) = h2 on every
        parity-pure sample and meets L1 and L3 at M = 8 and 16.
        The prediction that F1 reads LEAD on the declared cells is an
        inference, not a measurement: measuring F1 there was forbidden to the
        review. It rests on an exact field identity and on the exact
        parity-purity of the declared buckets (90.8 to 98.9 percent of the mass
        at the LEAD keys). Consequence: as frozen, the pre-registered NEG
        prediction fails for F1 by construction, and the most valuable branch,
        LEAD, routed to review-breakthrough and independent replication, would
        fire on the certificate's own quotient.
      breaking_artifact_2: |
        "A LEAD branch unreachable by a planted filter at the stated floor":
        RT-O3, met in letter. Planted filters held at the floor gave LEAD
        0 of 14. The weight of this artifact is recorded honestly. The stated
        floor is the L1 and L3 threshold itself (3 W, specification 356-357),
        so a filter planted exactly on it passes each cell's clause about half
        the time, and 0 of 14 is expected. The more informative evidence is
        elsewhere. A flat standardised excess at 2x and 4x the floor gave LEAD
        4 of 14 and 7 of 14. A constant raw excess above every floor gave
        0 of 14. Growing key mixtures gave 13 to 14 of 14. The specification
        (358-361) confirms that L2 requires 9 of 10 per-seed Z-slopes to be
        non-negative, which tests growth, while its text describes L2 as a
        non-decay clause. It also confirms that one W per (cell, M)
        standardises all ten seeds, a common-mode error (RT-O6).
      not_met: |
        No closed-form allowance governs the maximum statistic. L2 is not
        satisfied by occupancy (the random label held L2 in 0 of 7; its Z-slopes
        were non-negative on 35 of 70 seeds). No stake or lead sentence is an
        outcome, and no per-orbit line is unlabelled.
      further_defects: |
        RT-O2, verified: HEUR-B2's consequent is stated on raw G_131, which by
        the hypothesis' own words (line 444) "includes any exact component". For
        F1, G_131 at L_32 is at least 2^21.5 x 2 x C(131, 65) / 2^131, about
        2^18.65, which exceeds the binding threshold 18.2978 (c* = 0.1418). The
        marginal alone exceeds both with-orbit thresholds. The consequent is
        therefore false by arithmetic for F1 and F5xF1, for a reason unrelated
        to sum-compatibility, and untestable for every other arm at any tested
        N. This is not the plan's letter "unfalsifiable", so it is not counted
        as a J3 breaking artifact. It contradicts R-11's discharge in part and
        is carried as RR-4.
        RT-O4: the measured floor is undefined at M = 8 and 16 on the
        contract's grid. RT-O5: the design floor and scale estimates are low
        (W measured about twice the estimate at M = 64 and 128). RT-O6: W is
        noisy. RT-O9: wording.
      what_holds: |
        The random label reads NEG in 7 of 7, and the measured-null method
        holds. The labelling half of J3 holds: the stake appears once, as the
        column's ceiling; the lead threshold is pre-registered and routed; the
        orbit-unknowns line carries CORR-20260925-649e25 and KN-FIND-47da4e as
        conditions. HEUR-B2's random-model limits (the averaged agreement; the
        N^(1/4) reach) are recorded. Two independent code paths corroborate the
        measured null (validator OBS-2 against red team: G - 1 about 4.63 and
        W about 1.09 at M = 64).
    J4:
      owner: TASK-20260929-7d8385
      reviewer_verdict: breaks
      composed_disposition: breaks, on the over-scoped-sentence artifact only
      key_applied: K-revise-defect
      breaking_artifact: |
        "An over-scoped sentence". Two sentences state more than the controlled
        measurement or the ceiling supports. (1) Specification 831-832, "THE
        LEAD OUTCOME IS REACHABLE: PC-16 requires the rules as coded to classify
        a known approximate filter LEAD", generalises from one control whose
        excess grows with M (RT-O3). (2) Hypothesis 441-442 with audit 979-982
        maps a raw G_131 above l^(c_k) to the k-tree falling below matched rho
        under the ceiling model. A known-useless label (F1) crosses that
        threshold at zero compute (RT-O2).
      not_counted: |
        PTM-E, which the reviewer added, is not counted as J4's PTM artifact:
        the plan's PTM list is PTM-A to PTM-D, and counting an added object
        would widen the plan's breaking list after reading the reports. Its
        substance is RT-O1, composed under J3. The reviewer also listed as
        over-scoped the NEG prediction for every arm, OC-1's classification of
        F1, the design floor figures and mechanism (vi). These are a false
        prediction, a design misclassification, labelled estimates and an
        ordering slip. None states more than a certificate, a ceiling and a
        controlled measurement. They are remedied under RR-1, RR-5 and RR-11,
        not counted as J4 over-scope (PD-B4).
      what_holds: |
        PTM-A: CODE-CERT returns the full twelve-divisor set of 130972 with
        [1, 2, 4, 137] below 239. PC-5 reads G = 548 and G = 956 exactly at
        2^26 and 2^27 on the isomorph, and setup_cell admits CELL-K17C with a
        verified generator and a 130972-entry table. PTM-B: G = M exactly on
        Z/2^16 at every declared alphabet. PTM-C: the key reads G/M from 0.612
        to 0.680, and PC-7, PC-7c and PC-16 pass in 3 of 3. PTM-D: the exact
        filter collapses and the planted marginal-only filters are preserved.
        No excluded object is designed in; the cited and absorbed records are
        unedited; no D-quantity is used as a budget. RT-O8 is minor: CODE-CERT
        accepts a malformed factorisation, which the contract's own flow cannot
        produce.
    J5:
      owner: TASK-20260929-953377
      reviewer_verdict: inconclusive by design (the comparison was forbidden to the re-deriver)
      composed_disposition: agrees with the contract on every compared quantity after matching the contract's stated rules
      key_applied: K-indeterminate not triggered; the J5 clause of K-approve is satisfied
      blindness: |
        The re-deriver read exactly its four whitelisted files, ran no git
        command and attests read_sibling_reports false and blind_from_respected
        true. The runtime auto-placed CLAUDE.md in its context, and it discloses
        this. Neither CLAUDE.md file carries a Q1 to Q5 value. The
        --blind-history tool check is uncheckable (PD-R4), so blindness rests on
