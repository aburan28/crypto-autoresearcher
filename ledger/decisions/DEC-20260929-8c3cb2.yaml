  # ---------------------------------------------------------------------------
  j5_versus_contract:
    rule: |
      CB-4, performed before any key was applied. The full quantity-by-quantity
      table is in the worksheet. Contract reading: N = l, r = floor(log2 N / p +
      1/2), S = 2^ceil(log2(128 M^2)).
    summary: |
      Q1 is exact. The orders of CELL-K13, K17C, K19, K23 and K41, their
      factorisations, admissibility, the admissible degree set {5, 7, 9, 13, 19,
      23, 41}, n = 29 and 31 inadmissible, and the twelve divisors of 130972 all
      agree. Q2 is exact: CELL-O19 is 523646 = 2 x 261823, CELL-RC1 is
      130412 = 4 x 32603, and Z/lZ has l = 130873. Q3 is exact: every log2 N / p
      to 4 decimals and every M under N = l and under the #E reading (shown, not
      used) agree, including the flagged near-boundary row CELL-O19 N^(1/4) at
      4.4996. Q4 agrees at 0 bit on every power-of-two row, because
      ceil(log2(100 M^2)) = ceil(log2(128 M^2)) = 2r + 7. The 100 x M^2 floors
      at 548 and 956 (24.8399, 26.4456) match the contract's stated 2^24.84 and
      2^26.45. Q5 is exact in both ambients: the gap is 43.0000, 32.2500,
      25.8000, 21.5000 (target subgroup) and 41.6667, 30.7500, 24.2000, 19.8333
      (full group).
    the_548_row: |
      The card's S_pow2 at M = 548 is 2^25, while the contract's S is 2^26. The
      one bit is entirely the rule constant: the card rounds 100 x M^2 and the
      contract's rule R-S rounds 128 x M^2. It is not a difference between
      implementations. The plan applies the Q4 tolerance "after matching the
      contract's N reading and rounding rule". J5's log2 S_min 24.8399 plus
      log2 1.28 is 25.1960, the contract's own 25.1961, whose ceiling is 26. So
      the entries agree once the rule is matched, and the contract's S is at or
      above J5's floor. At 956 both rules give 2^27. The card, not J5 or the
      contract, carried the mismatched constant (PD-B6). Under the stricter
      reading the effect would be an added revise on C6 naming S(548), and the
      decision is revise regardless.
    totals: |
      Not compared as a matched pair, because the definitions differ. J5 sums
      S_min over two R-M rows; the contract sums declared S over every row,
      including the gate and fixed-M rows. As a composer reconciliation, not a
      blind comparison, 1.28 times J5's sums plus the gate and fixed-M rows
      equals the contract totals 43520, 559616 and 2263552 exactly.
    not_compared: CELL-Z-2003 and CELL-Z-2095853 (outside the card's cell set); the CELL-Z2 grid and the gate rows at M = 2, 4 and 16 (fixed alphabets); J5 rows without a contract counterpart; the closure line.
    q0_choices: J5 reports eight choice points. Every adopted reading coincides with the contract's model; the alternatives are recorded for localisation only.
    reading: |
      Two implementations that share nothing agree on the arithmetic of Stage 0
      and on the repriced grid. Under PD-R1 and PD-R5 J1's concurrence is
      informed; J5 is the structurally blind check.

