  rationale:
    - |
      Keys as written. K-approve needs J3 and J4 to hold and every revision
      requirement to be discharged. J3 breaks on two artifacts of the plan's
      own list, J4 breaks on a third, and three discharge clauses are
      contradicted in part. Approving under any other reading would relax a
      key after reading the reports, which CB-7 forbids.
    - |
      The break is exact and cheap to see. The contract already knew the
      principle: DF-7 stratifies F5's null by h4, because an exact component
      alone satisfies L1 and L3. The contract did not apply that principle to
      F1, whose normal-basis weight parity is the trace, and hence the E/2E
      class. This composer verified the identity, the F1 code, the h2 code and
      the F5-only stratification in the frozen bytes. The consequence is that
      the instrument's most valuable branch would fire on the certificate's own
      quotient.
    - |
      Revise before run, not run then invalidate. As frozen, the run would
      route F1 to a review-breakthrough round and an independent replication
      for a known artifact. That costs both, and the result would say only what
      the review already shows at zero compute. The ECC-first rule removes the
      batch ceiling, not the duty to rank a task ahead of doing nothing.
    - |
      Most of version 2 stands. J1 and J2 hold, J5 blind-confirms the orders
      and the repriced grid, and PTM-A to PTM-D meet their signatures. The
      repaired shuffle and measured null behave as R-1 and R-2 asked. The
      remedies are local and enumerated, which is why the decision is revise
      rather than a return to ideation.
    - |
      Custody and independence hold, so the reports are admissible for this
      decision. The digests were fixed before any read. The object hashes to
      its snapshot at every point checked. The independence check passed as
      reported, blindness was attested, and no tripwire fired.

