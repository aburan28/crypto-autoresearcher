coordinator_decision:
  id: DEC-20260908-4f847e
  decision: approve
  decided_by: coordinator
  decided_at: '2026-09-09T01:50:50.956302+00:00'
  target_ids:
  - TASK-20260908-e7e0db
  - TASK-20260908-6cde4a
  - EXP-ECDLP-0c717c
  - EXP-ECDLP-709063
  - EXP-ECDLP-184fc4
  - EXP-ECDLP-1e6502
  - EXP-ECDLP-2c3d20
  context: Approve a bounded local Linux resource-control probe for the five definition-approved reserve experiments.
  rationale:
  - The five complete protocol definitions require exact Linux resource/runtime prerequisites before measurement.
    Repeated DarwinRLIMIT_AS failures do not prove those prerequisites available.
  - Read-only observation found an allowed local Linux/arm64 Docker daemon with cgroup-v2 and only hello-world installed.
    The official Python helper manifest digest was resolved without pulling or starting a container.
  - The probe separates configuration readback, intentional mismatch refusal and a small64MiB OOM control. No ECC
    fixture, arithmetic benchmark, scientific pipeline, key or launch allocation is involved.
  - Standing authorization covers the exact reversible image preparation and isolated local probe. No Docker daemon
    setting or unrelated job may change.
  approved_protocol:
    purpose: Verify local Linux cgroup-v2 configuration, fail-closed mismatch detection and one small OOM control.
      This is runtime infrastructure evidence only, not a scientific experiment or arithmetic runtime admission.
    image: docker.io/library/python@sha256:c89921a0c7b42f27338ed8c279fb370e69e941c92460f91895d08304e844b0b4
    platform: linux/arm64/v8
    endpoint: Use only the currently configured local Unix-socket Docker endpoint. Reject remote endpoints or any
      prohibited-provider token before network or container work. Do not change Docker settings or stop other jobs.
    image_preparation: At most one pull of the exact pinned official Python manifest digest. Verify actual image
      OS, architecture and digest; retain actual version/ID. This helper image is not a replacement for any experiment
      arithmetic dependency.
    container_isolation:
      user: 65534:65534
      network: none
      read_only_root: true
      cap_drop: ALL
      no_new_privileges: true
      cgroup_namespace: private
      pids_limit: 32
      cpu_quota_cores: 1
      host_mounts: []
      tmpfs: /tmp:rw,size=16m
    cases:
    - id: profile_exact
      memory_bytes: 8589934592
      memory_swap_total_bytes: 8589934592
      action: Read /proc/self/cgroup and the cgroup-v2 memory.max, memory.swap.max, cpu.max and pids.max values
        from the actual running container; retain effective UID, Python/platform identity and available resource
        observations. Allocate no stress buffer.
      pass: Exit0, actual Linux/arm64, UID65534, memory.max=8589934592, memory.swap.max=0, pids.max=32, cpu.max
        quota/period=1 and own cgroup membership/mount provenance.
    - id: profile_mismatch_rejected
      memory_bytes: 67108864
      memory_swap_total_bytes: 67108864
      action: Run the same configuration checker with required memory.max=8589934592 in a container actually limited
        to67108864. Retain actual values. No stress allocation.
      pass: Typed configuration refusal and dedicated exit42 before any workload; observed mismatch is explicit,
        not silently accepted.
    - id: oom_small_limit
      memory_bytes: 67108864
      memory_swap_total_bytes: 67108864
      action: First verify the actual64MiB/no-swap profile and flush a before_allocation JSON marker. Then request
        one128MiB bytearray allocation, touching its pages. Retain Docker terminal state before removing the container.
      pass: The pre-allocation marker and matching profile exist; Docker reports OOMKilled=true and exit137. A watchdog
        kill, startup failure or unobserved process termination is not an OOM-control pass.
    case_accounting: One operational case is one started named container. Initial planned suite has3cases; at most6total
      started containers including failed attempts/reruns, with a complete3case reserve before an intermediate attempt.
      Administrative endpoint/image inspection and pull are recorded separately. Never reset counts.
    watchdogs: Each case has a60second process watchdog. On expiry kill only its recorded owned container ID, inspect
      and retain that terminal state, and classify it as a watchdog outcome. The single image pull has a300second
      network-process watchdog. These are machine/observation protection, not campaign spending limits.
    custody: Capture every command argv, UTC start/end, exit status, stdout/stderr and Docker create/inspect state.
      Retain full exec_command response/session handles until terminal. Remove only exact container IDs created
      by this task after inspection; no broad cleanup. Do not claim child CPU/RSS if unavailable after OOM.
    interpretation: Report8GiB configuration readback separately from the64MiB OOM control. Do not claim8GiB pressure
      testing, physical8GiB availability, scientific implementation conformance, real launch authority or arithmetic
      dependency compatibility. The previously observed VM memory was7529156608bytes and must be refreshed/disclosed.
    scientific_runs: 0
  source_bindings:
  - path: coordination/experiment-reserve/BATCH-635652/runtime-bindings/DEC-20260908-4f847e-image.json
    sha256: 66b1c9287151d07d6c535cf4473a66e01ad8be622d9dc886984ee55489d34aa3
  evidence_refs: []
  knowledge_promotion:
    promoted: []
    not_warranted: Runtime-control preparation only.
  approval_scope:
    operational_container_probe: true
    scientific_execution: false
    measurement_admission: false
  next_actions:
  - Root implements and runs the exact probe under TASK-20260908-e7e0db and archives its four outputs under TASK-20260908-6cde4a.
  - Independently review any observed runtime result before using it as a launch prerequisite; complete arithmetic
    and source bindings separately.
