  context: >-
    One cycle of design-experiment plus propose-ideas.
    IDEA-20261006-83c197 is on origin/design/frob-bda728-descent and
    is not on origin/main. The question is RQ-FROB-7d8dd4, listed on
    GOAL-FROB-6333a9. No hypothesis or experiment on origin/main cites
    that full id. The branch design/frob-83c197 was created from
    origin/main at 7c58d1ad92a0c17c14c85805b47e089967d47a2f. The merge
    of origin/main was already up to date. The copied proposal bytes
    hash to blob 2ab555fdf1972ad118d0f5200b9b6936a617688a and parsed
    as YAML without a quote change. The question id is
    RQ-FROB-7d8dd4. The prediction is a dimension-2 class count
    different from 0, and an S_3 total-degree gap of at least 1 when
    an explicit quotient is written.

    python3 tools/portfolio_kpis.py --capacity GOAL-FROB-6333a9
    reports approved_unrun=5, cap=3, headroom=0. The five contracts
    are EXP-FROB-30006a, EXP-FROB-7d51ae, EXP-FROB-ad6a6d,
    EXP-FROB-ec08b5, and EXP-FROB-f495ea. This decision does not
    name any of them under supersedes_experiments or
    withdraws_experiments. check_approval_capacity is the validator
    check that would reject an approving decision. The contract
    therefore stays review_required.

    The missing driver is a program that recomputes the smallest
    excluded prime, enumerates dimension-2 Weil classes over F_2,
    and reports the total degree of one Weil-descended S_3 system
    on an explicit quotient and on a matched subspace.
    analysis/couveignes-lercier-131/weil_census.py enumerates classes
    for the modulus 131 and does not emit an S_3 degree. It was
    opened and was not run. There is no trial-plan.json. The only
    file under runs/ is .gitkeep, so execution_progress reports
    needs_reconciliation because any directory entry counts as
    activity. That label does not mean a run exists.
    newest_experiments.py --experiment EXP-FROB-05cbda returns no
    selectable row because status is not approved. The contract is
    not execution_state ready.

    Success is the source idea's prediction. The concrete negative
    is class_count 0 with the instrument checks passed and the
    prime equal to 7. No class was enumerated in this session. The
    same pass files IDEA-20261007-9711d4, IDEA-20261007-d0d301, and
    IDEA-20261007-4c9c5f and does not design them.

  rationale:
    - The standing authorization covers a complete runnable protocol. This one is over the approval cap and has no S_3 degree driver, so it is not approved.
    - check_approval_capacity is the named validator check. GOAL-FROB-6333a9 has approved_unrun=5 against cap 3. An approving decision would be rejected. This decision does not force approved.
    - The missing driver is the S_3 total-degree comparison. analysis/couveignes-lercier-131/weil_census.py is not that driver.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - class_count 0, with the instrument checks passed and the prime equal to 7, is reachable as a recorded outcome, so success is not automatic.
    - The class-total calibration, the dimension-1 numeric degree, the cardinality check, and the excluded curve are the instrument controls.
    - An instrument failure is not relabeled as nonexistence.
    - This session did not enumerate a class and did not claim that the exponent 1/2 moves.
    - No run id was minted. The replication plan does not name a future run slot while the trial plan is unfrozen.

  evidence_refs: []
  limitations:
    - The measurement, once run, covers genus 2 over F_2 at one toy prime. It does not transfer to n = 131.
    - A passing count and a passing degree gap do not lower the rho exponent 1/2.
    - A calibration failure and a crash are not the negative.
    - This decision does not authorize execution.
    - This decision does not edit a goal head.
    - The three new proposals are not hypotheses and are not approved experiments.

  next_actions:
    - A later session may approve EXP-FROB-05cbda only after check_approval_capacity reports headroom on GOAL-FROB-6333a9 and an S_3 degree driver exists. Both were absent on 2026-10-07.
    - Do not dispatch TASK-20261007-84f7d2 from the design session that wrote this decision.

