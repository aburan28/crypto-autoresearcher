coordinator_decision:
  id: DEC-20260803-2e82d5
  goal_id: GOAL-MLKEM-003
  batch_id: BATCH-011
  evidence_id: EV-MLKEM-2e668d
  recorded_by_task: TASK-20260803-9d382c
  archive_kind: ledger
  recorded_at: '2026-08-03'
  decision: revise
  decision_label: conclusion_survives_narrowed_argument_struck_object_under_test_was_never_tested

  context: >-
    DEC-20260803-ed6522 opened BATCH-011 to settle validator defect D7 and then
    run the adversarial pass BATCH-010 never had. TASK-20260803-a7861e produced
    the source reading, snapshot-archived at eb7cdc1d. TASK-20260803-90c29e
    returned `blocking_objections` with thirteen numbered objections, blocking on
    the record's reasoning and scope rather than on its conclusion.

  central_adjudication: >-
    THE PROGRAM HAS SPENT THREE BATCHES MEASURING SOMETHING IT DID NOT NAME
    CORRECTLY. The red team's C-3 is the finding that matters: what BATCH-009 and
    BATCH-010 fitted is not Approximation 4.9's family but BATCH-009's
    Gaussian-Phi surrogate, and the source's own (4.10)/(4.11) predict why it
    misfits -- Upsilon_{n_fft/2-1} at n_fft=8 departs from a Gaussian by -0.58
    bits at x=5 and changes sign at 6.38, so E(T-t) is not an ellipsoid and its
    measure is not a pure power of v. Every statement this program has made about
    "Approximation 4.9's exponent" is a statement about the surrogate's exponent.
    The conclusion of BATCH-010 survives, on better evidence than BATCH-010 gave
    it, but its argument, its attribution and two of its recorded limitations do
    not. `revise` is the disposition: correct the record before anything is
    promoted or built on.

  what_survives:
    - >-
      Misspecification, NARROWED and on stronger evidence. In the count>=1000
      sub-band the best achievable rms is 16.5x and 24.8x the closed-form
      counting-noise floor. That owes nothing to the tail and nothing to the
      number zero. The Coordinator recomputed both ratios.

  what_is_struck:
    - >-
      The "0.426 rather than 0" argument. Zero was never achievable: the
      closed-form Poisson floor is 0.3406 and 0.3276, and the whole-band excess
      is only 1.25x and 1.30x. As an argument for misspecification this was weak,
      and I recorded it as the batch's headline.
    - >-
      The attribution to "Approximation 4.9's family". A Gaussian-Phi surrogate
      was fitted, not the source's model.
    - >-
      O-7's suggestion that the min(1,.) collapse may be a SOURCE defect. The
      literal inconsistency is real, but the operative displays favour the
      mixture reading five to one and (4.23)/(4.29) are ill-formed under the
      literal one, so the suggestion fails under either reading.
    - >-
      O-6's "unattributed" as a limitation of the EVIDENCE. Both blockers --
      Phi_dlsc at (4.10) and alpha, identifiable from the archive to 0.48 percent
      -- are in the repository. It is a limitation of the work done, which the
      inventor protocol classifies as a fatigue report with honest status
      `unverified`.
    - >-
      O-4 as a live counterweight. The resolved band reaches only ~15 percent of
      the operating threshold, so the tail counter-instance is doubly irrelevant.
    - >-
      The specific values 23.25 and 22.25 as estimates of a better exponent. The
      argmin drifts monotonically 23.0 -> 18.0 and 22.0 -> 17.0 as noise is
      removed, which is the inventor protocol's canonical artifact tell.

  weighing_of_the_red_team: >-
    Accepted, including where it strikes findings I authored two batches running.
    (1) RT-6/RT-7 ARE CORRECT AND THE CORRECTION CUTS BOTH WAYS. I let "0.426
    rather than 0" stand as the batch headline without asking what floor the
    counting noise imposes. The red team computed it in closed form -- and
    disposed of the BATCH-010 validator's claim that such a control "is a
    simulation forbidden by ZERO NEW SAMPLING", which was simply wrong about the
    method. The same computation that strikes my argument supplies a better one.
    (2) RT-9 IS THE BATCH'S REAL CONTRIBUTION: a named mechanism, derived from
    the source's own equations, for why the surrogate misfits. Under the
    inventor-protocol closure standard a negative result needs a named
    obstruction; this is the first one this lane has had.
    (3) RT-8 IS ACCEPTED AND IS UNCOMFORTABLE IN THE RIGHT WAY. The monotone
    argmin drift is simultaneously an artifact tell against the numbers I
    recorded and the strongest evidence for the conclusion I drew from them.
    (4) RT-10 AND RT-13 ARE ACCEPTED. Calling the over-prediction "unattributed"
    when both named blockers sit in the archive is a fatigue report, and I signed
    it.
    (5) RT-3 IS ACCEPTED AND IT PARTLY VINDICATES THE SOURCE. I opened this batch
    expecting to find a source defect. The literal reading supports one; the
    weight of the operative displays does not. Recording that the paper is
    probably consistent is as much this batch's result as anything adverse.
    (6) RT-1/RT-2 ARE ACCEPTED as package defects on a task whose entire product
    is verbatim quotation.
    (7) RT-12 is accepted: four artifact hypotheses tested and dismissed, and
    recorded as tested so no successor repeats them.

  hypothesis_status_changes: []
  hypothesis_status_note: >-
    No hypothesis moves, and C-3 is why: the object under test was never the one
    the hypotheses name. H-MLKEM-010, H-MLKEM-011 and H-MLKEM-013 are untouched.

  rule_12_status: >-
    UNMET AND UNWAIVED. Nothing here changes EV-MLKEM-011, EV-MLKEM-013 or
    EV-MLKEM-017, and KN-FIND-031 stays withdrawn.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      `revise` on `preliminary` evidence fails the gate outright. Beyond that,
      the one transferable candidate -- that a fitted-normalisation shape
      comparison must be scored against the counting-noise floor of the data it
      fits, or it will mistake sampling resolution for misfit -- is a rule this
      batch demonstrated by VIOLATING it, and it has had exactly one adversarial
      pass and no independent validation of the counting-floor computation
      itself. Promoting it now would be the third instance of the error
      CORR-20260802-d8ba0e records.
    promote: false

  non_claims:
    - ML-KEM is not broken.
    - KN-OPEN-016 remains open.
    - >-
      Approximation 4.9 is NOT refuted, and this batch is the record that it has
      never actually been instantiated in this program.
    - >-
      Carrier et al.'s paper is not shown defective; the weight of its operative
      displays favours a consistent reading.
    - No asymptotic claim advanced. No closure quorum asserted.

  next_actions:
    - >-
      BATCH-012, zero new sampling, the check the red team named as C3: replace
      the surrogate's K*v^p by the EXACT region measure from (4.10), (4.11) and
      (4.24) at alpha=2, and refit. This is the first time the program would test
      the object it has been naming for three batches, and it is cheap because in
      fit_one_p the quadrature never reads log2meas. Score the result against the
      closed-form counting-noise floor from the outset, not against zero. Carry
      an independent validation of the counting-floor computation in the same
      batch, since every conclusion now rests on it and it has had none.

