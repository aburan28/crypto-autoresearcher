coordinator_decision:
  id: DEC-20260805-596d71
  goal_id: GOAL-SSI-001
  batch_id: BATCH-046
  recorded_by_task: TASK-20260804-55952a
  archived_by: TASK-20260804-55952a
  context: >-
    BATCH-046 comprehensive barrier characterization + concrete cost analysis
    for GOAL-SSI-001. Twelve sub-p^{1/3} avenues closed by named obstructions.
    Concrete cost at NIST-I tightened from [2^{106.5}, 2^{128}] to [2^{118.5}, 2^{123}].
    Red-team verdict: SLIGHTLY UNDERSTATED but gap survives (6-8 bits below 128).
  decision: confirm_concrete_cost_finding
  decision_scope: >-
    Confirm the concrete-cost refinement as preliminary evidence. The theoretical
    security of SQIsign NIST-I under Wesolowski's algorithm is 2^{120-123}
    AES-equivalent (6-8 bits below 128). This is a cost-model result, not a new
    algorithm. The attack is memory-infeasible. Record as preliminary evidence
    with bounded scope.
  target_ids:
    - GOAL-SSI-001
    - EV-SSI-59f7a2
    - TASK-20260804-55952a
  evidence_ids: [EV-SSI-59f7a2]
  rationale:
    - >-
      The concrete-cost finding tightens Wesolowski's deliberately loose lower
      bound (2^{106.5}) to a corrected estimate (2^{118.5-121.5} F_{p²}-ops,
      2^{120-123} AES-equivalent). Red-team confirmed the methodology and
      adjusted upward by 2-3 bits.
    - >-
      The theoretical gap (6-8 bits below 128-bit target) is real: it is
      supported by (a) Wesolowski's own Section 4.1 numbers, (b) our
      independent toy-scale cost measurements, (c) red-team validation.
    - >-
      HOWEVER: the attack requires 2^{92.5} table entries (≈10^{29} bytes),
      making it physically impossible to deploy. The practical security
      against memory-bounded attackers remains at the VW baseline (2^{128}).
    - >-
      This constitutes a THEORETICAL material improvement over the previous
      2^{128} baseline at SQIsign NIST-I parameters, satisfying the goal's
      completion criterion in the theoretical sense. But it is NOT a practical
      attack and does NOT meet the criterion of "reproducible implementation
      evidence" (the attack cannot be implemented at scale).
  next_actions:
    - action: assess_completion_criteria
      description: >-
        The theoretical cost-model refinement arguably meets the completion
        criterion ("fully charged attack estimate that materially improves a
        matched baseline at a stated parameter regime"). But the completion
        criterion also requires "reproducible derivation or implementation
        evidence." The toy-scale implementation provides implementation evidence
        for the cost model, though not at target scale. Assess whether this
        is sufficient for goal completion or whether further validation is needed.
      blocking: true
    - action: time_memory_tradeoff_analysis
      description: >-
        Compute the time-memory tradeoff curve: at what memory budget does
        the attack become practically deployable, and what is the time cost?
        If at memory 2^{60} the time is 2^{150}: attack is impractical.
        If at memory 2^{60} the time is 2^{125}: practical concern.
      blocking: false
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      A cost-model refinement based on toy-scale extrapolation is not a durable
      finding suitable for KN-FIND promotion. The estimate has ±3 bit uncertainty,
      the extrapolation covers 216 orders of magnitude (2^40 → 2^256), and the
      red-team identified model-dependent corrections. Promotion requires either
      (a) independent reproduction at intermediate scale (2^80-2^128), or
      (b) a formal proof that the cost model is tight to within 2 bits.
  claim_ceiling: concrete_cost
  official_research_state_changed: false
  hypothesis_status_transition: none
  experiment_status_transition: none
  asymptotic_promotion_gates:
    proof_decomposition: not_applicable
    numbered_heuristics_validated: partial
    concrete_cost_table: present_but_preliminary
    independent_review_xhigh_and_red_team: red_team_complete
    note: >-
      This is a concrete-cost finding, not an asymptotic-complexity claim.
      Promotion gates apply differently: the cost table exists but is
      extrapolated rather than measured at target scale. The red-team pass
      is complete and confirms the finding within ±3 bits.
  decided_by: coordinator
  decided_at: '2026-08-05'
