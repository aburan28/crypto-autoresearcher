  context: >-
    BATCH-012 was the scoped instrument successor DEC-20260729-001 named as its
    single next action - RC-A, the curve-free repaired-null re-derivation, and
    essentially nothing else. It froze one contract, EXP-YIELD-002, at
    f291a624610458fc7ad40b5cf174447517ce97e5; reviewed it independently three
    times before execution (RT-20260729-016 REVISE, RT-20260729-025 REVISE on the
    first amendment, RT-20260729-029 PASS on the second); spent TWO versioned
    protocol_amendment cycles, the second a DECLARED DEVIATION from a
    pre-registered execution gate recorded as INT-BATCH012-O and
    QUEUE-AMEND-20260729-003; recorded the approval determination APPROVED in the
    TASK-20260729-030 receipt at 5174001c37cc6e3b27fb468e0742d7732976a5de,
    pre-execution and hash-bound; executed three curve-free runs
    (TASK-20260729-018), snapshot-committed alone at
    c7189f80225bad0d0d2aa28cbbbb11e672d30dd6 by TASK-20260729-019; and reviewed
    the bound package twice independently - TASK-20260729-020 (Validator,
    VAL-20260729-001) and TASK-20260729-021 (Red Team, RT-20260729-021).
    THE PRE-REGISTERED PREDICTION WAS MET. The realised branch under the frozen
    rule is P-CORE: CR-1, CR-2 and CR-3 firing sets all EMPTY on set identity,
    CR-4's n_neg = 16 inside the pre-registered [14, 34] window, no invalidation
    rule fired, all eight known-answer cases pass, and IV-4's re-derivation agrees
    with the quoted values at MAXIMUM ABSOLUTE DIFFERENCE 0.0 across all 48
    tuples. The Validator returned PASS with `blocks_ledger_record: false` and
    seven required narrowings; re-execution reproduced the package BIT-IDENTICALLY
    under the pinned numpy 2.4.0 with zero non-timing differences, and a simulator
    written FROM THE CONTRACT TEXT ALONE reproduced it at maximum absolute
    difference 0.0 on every reported statistic and on all 96 derived seeds. The
    Red Team returned PASS WITH BOUNDED READING, ten objections of which one is
    BLOCKING ON ADOPTION and one BLOCKING, ruling that what P-CORE licenses is
    NARROWER than the governing contract's own success_criterion sentence claims
    and that one sentence C-20 makes mandatory on every downstream record is
    FALSE.

  decision: support
  decision_vocabulary_note: >-
    `support` IS TAKEN FROM THE docs/task-lifecycle.md SECTION 9 TRANSITION
    VOCABULARY, which this card's completion gate L2 names as governing, and it
    is the one transition label this record records. Section 9 defines it as
    "evidence supports the scoped prediction", and that is exactly and only what
    happened: the pre-registered prediction of EXP-YIELD-002 was met at all 48
    declared tuples under both denominator readings. RT-20260729-021 pre-stated
    the label for this branch as `confirm_scoped` on the instrument question with
    `inconclusive` on everything else; `confirm_scoped` is not in the section 9
    vocabulary and `support`, scoped as below, is its faithful equivalent. It is
    NOT `replicate`, which would misdescribe a decision that dispatches nothing;
    NOT `expand`; NOT `refine`; NOT `weaken` or `reject_scoped`, both of which are
    independently forbidden on a single unreplicated empirical-only run set and
    neither of which is true of a met prediction; NOT `pause` on the lane, though
    the GOAL record separately moves to `paused` on its own budget terms; and NOT
    `inconclusive`, which is what DEC-20260729-001 correctly recorded when nothing
    admissible had been measured and which would now misstate a measurement that
    was taken and met its target.
  decision_scope: >-
    `support` ON THE INSTRUMENT QUESTION ALONE, AND ON NOTHING ELSE. What is
    supported is the scoped prediction of EXP-YIELD-002: that a balls-in-bins
    process which pre-marks |S_(m-2)| uniformly chosen bins before throwing
    C_red/2 antipodal pairs reaches the UNCHANGED, hash-bound P_pred at the 48
    declared tuples. On every other question this batch touches the record is
    UNCHANGED or UNDISCHARGED and says so in terms: the decomposition-yield
    question is untouched in either direction; the discrimination between the two
    live BATCH-011 explanations AT THE CENSUS LEVEL is not made, because the
    census-facing component of EV-ECDLP-008 observation O-4 was not measured;
    INV-5 is declared neither way; RC-F is not discharged; and the +0.3610
    aggregate z_sem shift is recorded as UNEXPLAINED AND UNREPLICATED with no
    explanation adopted. `support` at strength `preliminary` is a statement about
    a control object on one unreplicated curve-free run set. IT IS NOT SUPPORT FOR
    ANY HYPOTHESIS, and no hypothesis status moves.

