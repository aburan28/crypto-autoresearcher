  protocol_amendment_cycle_deviation:
    id: INT-BATCH012-O
    carried_from: >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-012/dispatch_queue.json,
      queue_amendments.QUEUE-AMEND-20260729-003, and
      experiments/EXP-YIELD-002/amendments/v2_to_v3.yaml, both of which state that
      the ruling MUST be carried into DEC-20260729-002 because until it is, a
      deviation from a pre-registered execution gate exists only in a coordination
      file. IT IS CARRIED HERE, AND WITH IT THE DEVIATION BECOMES A LEDGER RECORD.
      This also discharges required control RC-21D.
    what_was_deviated_from: >-
      RC-12's `amendment_cycle_cap` states in terms that AT MOST ONE versioned
      protocol_amendment cycle is permitted, and that if a re-review after that
      cycle returns REVISE again, the batch records the non-execution as a BATCH
      FAILURE. TASK-20260729-025 returned REVISE on the first amendment. The
      Coordinator admitted a SECOND AND FINAL cycle.
    it_is_a_deviation_and_not_an_interpretation: >-
      STATED PLAINLY AND NOT DRESSED UP. It is a DATED, RECORDED DEVIATION FROM A
      PRE-REGISTERED EXECUTION GATE, made after the outcome of the first cycle was
      known, and it is NOT a reading RC-12 always permitted. Describing it as an
      interpretation would be the softening the reviewer explicitly refused to
      perform, performed one step later by the Coordinator instead.
    why_it_was_admissible_at_all: >-
      BECAUSE NO DATA EXISTED. agents/coordinator.md forbids changing SUCCESS
      CRITERIA after observing OUTCOMES. Zero runs of EXP-YIELD-002 existed at any
      commit reachable from HEAD, as RT-20260729-025 confirmed against commit
      order; the outcome observed was a REVIEW VERDICT ON A TEXT. RC-12's cycle cap
      is a PROCESS budget, not a success criterion. That distinction is what made
      the deviation admissible AND is its limit: no criterion, threshold,
      replicate count, cell set, denominator reading or disposition moved, and the
      amendment moved none.
    the_substantive_ground: >-
      NB-2 WAS A REAL, PRE-DATA, LOAD-BEARING DEFECT IN A PRE-REGISTERED REFERENCE
      DISTRIBUTION. mu_001 is a committed constant and is not redrawn, so CR-3's
      statistic is non-central under a perfectly correct repaired null; the
      contract declared a per-tuple chance-alarm reference between 17 and 28 times
      too small at the tuple most likely to fire, and an escalated form of that
      chance exceedance routes to MISS-STRUCTURED, which SUPERSEDES EV-ECDLP-008
      observation O-4 and records a measurement fault that did not occur.
      EXECUTING ON A CONTRACT KNOWN TO BE DEFECTIVE WOULD HAVE RISKED A FALSE
      LEDGER, and a batch failure would have bequeathed the defect rather than
      removed it.
    the_direction_test: >-
      THE OPERATIVE PRINCIPLE, AND THE ONLY PRECEDENT THIS RULING SETS. A repair
      cycle beyond the declared budget may be admitted ONLY when EVERY repair in it
      moves the contract in the tightening, narrowing or disclosing direction, and
      must be refused the moment any repair would loosen a threshold, weaken a
      criterion, widen a claim, add an arm, raise a replicate count or make an
      outcome easier to report as a pass. RT-20260729-029 was required to test that
      claim ADVERSARIALLY rather than accept it, did so under OI-8, and found no
      loosening, no threshold moved and nothing outside the closed seven-item scope.
    what_the_cycle_bought: >-
      The single most valuable pre-data number in the batch: P(MISS-STRUCTURED
      under a perfectly correct repaired null) = 0.050 and P(P-CORE) = 0.659,
      derived by exact dynamic programming and committed BEFORE any draw. Without
      it a realised MISS-STRUCTURED would have been read as roughly ten times
      stronger than it is.
    the_ruling_on_the_outcome: >-
      JUSTIFIED ON ITS STATED MERITS AT THE TIME IT WAS GRANTED, AND NOT VINDICATED
      BY THE OUTCOME. What justifies it is checkable from the committed record
      WITHOUT knowing the outcome. A FAVOURABLE OUTCOME IS EXACTLY WHEN A PROCESS
      FAILURE IS EASIEST TO FORGIVE, AND THIS ONE IS NOT FORGIVEN BY IT: had the
      run returned MISS-STRUCTURED, the identical process would be indicted, which
      is the test of whether the justification is outcome-independent. It is. The
      outcome adds nothing to the justification and subtracts nothing from the
      defect.
    what_is_not_forgiven: >-
      THE SELF-SCOPING RECURRENCE IS REAL AND IS NOW TWICE IN A ROW ON THE SAME
      CONTRACT. The session that recorded QUEUE-AMEND-20260729-002 executed the
      card it created, and the session that recorded QUEUE-AMEND-20260729-003 did
      the same (INT-BATCH012-N, INT-BATCH012-Q). Following a precedent does not
      shrink the limitation and repeating it on the same contract arguably worsens
      it. The cost of the previous instance is on the record: RT-20260729-025 found
      BOTH of its blocking defects OUTSIDE the scope the first amendment had
      defined for itself. What discharged the limitation, to the extent anything
      could, was RT-20260729-029 - independent and non-originating - and nothing
      else.
    ruling_on_whether_the_cap_stands_for_successors: >-
      THE ONE-CYCLE CAP STANDS UNCHANGED FOR EVERY SUCCESSOR. This ruling
      pre-authorises nothing and is not a licence to count to two; the precedent it
      sets is the DIRECTION TEST above and nothing else. TWO FURTHER CONDITIONS
      BIND ANY SUCCESSOR THAT CONTEMPLATES A CYCLE BEYOND ITS BUDGET. FIRST, THE
      CYCLE-CAP RULING IS ASSIGNED TO A SESSION THAT DID NOT AUTHOR THE AMENDMENT
      IT AUTHORISES - this batch's arrangement, where one session recorded the
      queue amendment and then executed the card it created, is not repeated.
      SECOND, the hard cap remains absolute and unconditional on the content of a
      third verdict: a third REVISE, for any reason and at any severity, ends the
      batch as a non-execution, and NON-EXECUTION IS NEVER RECORDED AS A RESULT.
    the_cap_was_never_invoked: >-
      RT-20260729-029 returned PASS, so the absolute cap of
      QUEUE-AMEND-20260729-003 was not reached. It remained in force throughout and
      no third cycle was available or opened.

