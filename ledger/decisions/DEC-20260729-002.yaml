  rationale:
    - id: R-1
      text: >-
        THE RUN PACKAGE IS VALID AND ADMISSIBLE, AND THAT WAS CHECKED BEFORE IT
        WAS INTERPRETED. Three runs, all `completed_valid`, 48 of 48 declared
        tuples measured in both 48-tuple arms, 27 of 27 artifact-policy fields
        present in 3 of 3 manifests, 105 seeds all distinct and all independently
        re-derivable from the contract text, raw-to-summary agreement with ZERO
        mismatches over 48 x 16 comparisons plus four byte-equal blocks, and all
        eleven committed hashes recomputing from the Git blobs. There is no
        defect to return to the Executor and no repair is ordered. NO TIMEOUT,
        CRASH, RESOURCE EXHAUSTION OR BUDGET CANCELLATION OCCURRED, so there is
        no infrastructure signal in this batch and none is reported as one.
    - id: R-2
      text: >-
        THE PREDICTION WAS MET UNDER THE FROZEN RULE, EVALUATED ON SET IDENTITY.
        CR-1, CR-2 and CR-3 firing sets are EMPTY and all three symmetric
        differences against the pre-registered expectation are empty; CR-4's
        n_neg = 16 sits inside [14, 34]. P-MISS is false, so MISS-STRUCTURED and
        MISS-MARGINAL are unreachable branches. The classification was
        recomputed independently by the dispatching session from the raw means
        and standard deviations, and again by the Validator from an independently
        written simulator, and BOTH REPRODUCE IT EXACTLY.
    - id: R-3
      text: >-
        THE NARROWEST TRUE STATEMENT IS THE ONE THIS DECISION ADOPTS, AND IT IS
        NARROWER THAN THE GOVERNING CONTRACT'S OWN SENTENCE. The repaired control
        reaches the unchanged prediction at the declared cells under both
        denominator readings, which confirms that CTRL-NULL-SUMSET was
        MIS-CONSTRUCTED. IT ESTABLISHES NOTHING ABOUT DECOMPOSITION YIELD, does
        not un-fire INV-4, re-opens no efficiency, and has NO COST-MODEL
        CONSEQUENCE - the counterfactual branch is O-6 and not O-4.
    - id: R-4
      text: >-
        THE MANDATORY POWER SENTENCE IS FALSE AND THE CORRECTION IS ADOPTED
        RATHER THAN THE SENTENCE SUPPRESSED (RT21-1). C-20 requires the sentence
        verbatim on this record; the clause about a shortfall of 5 per cent of T
        is nevertheless FALSE, because at T-18-3-B16 T/sem_001 is 124.73, so a 5
        per cent shortfall has expected |z_sem| of 6.24 and CR-1 fires there with
        probability about 0.999. The obligation is discharged the only honest
        way: BOTH THE SENTENCE AND THE CORRECTION ARE CARRIED, AND NO RECORD
        PRODUCED BY THIS BATCH MAY QUOTE ONE WITHOUT THE OTHER. The error's
        origin is recorded against this program's own process: the power curve's
        column reports a COUNT of tuples reaching 3.000 and three successive
        sessions read it as a MAGNITUDE - the cardinality-not-identity failure the
        contract's own PRED-ID rule exists to prevent, recurring FOR THE THIRD
        TIME IN THE SAME CONTRACT. It cuts conservatively, understating the
        design's power, which is why it is blocking on adoption and not on the
        P-CORE reading.
    - id: R-5
      text: >-
        WHAT A SINGLE P-CORE ACTUALLY EXCLUDES IS QUANTIFIED AND IS TWO-SIDED. On
        RT-20260729-021's corrected curve the likelihood ratio against phi = 0 is
        1.5 to 1 at a uniform shortfall of 2 per cent of T, 5.7 at 3 per cent, 87
        at 4 per cent and about 8,600 at 5 per cent. A SMALL SHORTFALL IS POORLY
        EXCLUDED AND A 5 PER CENT ONE IS WELL EXCLUDED, and essentially all of
        that discriminating content rests on THREE TUPLES and overwhelmingly on
        one tuple's 100 replicates (RT21-9). The design is blind to any shortfall
        that is not proportional to T, T/sem_001 being below 3.000 at 25 of the 29
        m = 2 tuples. Under a perfectly correct repaired null this design records
        P-CORE only about 0.659 of the time.
    - id: R-6
      text: >-
        EV-ECDLP-008 OBSERVATION O-4 IS NEITHER SUPERSEDED NOR CONFIRMED AS A
        WHOLE, AND THE GOVERNING CONTRACT'S SENTENCE SAYING OTHERWISE IS
        OVER-BROAD AS WRITTEN (RT21-2). Component (b) - that a process which ALSO
        pre-marks |S_(m-2)| bins has mean P_pred - is CONFIRMED BY MEASUREMENT FOR
        THE FIRST TIME, and that is the batch's genuine increment. Component (a)
        was already determined arithmetic on committed data. Component (c) is
        supported but NOT independently established, because IV-1's anchor arm is
        transcribed from a contract text written after the Coordinator read the
        BATCH-011 driver. Component (d) - that the correct null pre-marks the bins
        a cancelling multiset reaches DETERMINISTICALLY - is UNTOUCHED and still
        unarchived, because RC-A and this contract pre-mark a UNIFORMLY RANDOM
        s-subset which the contract itself says is not the structurally exact set.
        The record adopts S-5 of the falsification review and never the contract's
        unqualified sentence.
    - id: R-7
      text: >-
        NO BATCH-011 EFFICIENCY BECOMES READABLE, ON THREE INDEPENDENT GROUNDS,
        ANY ONE SUFFICIENT. PROCEDURAL: INV-4 is a rule of the EXP-YIELD-001
        contract evaluated on the EXP-YIELD-001 run, and nothing in BATCH-012
        evaluates or can evaluate a rule of another contract on another run;
        un-firing it would require editing an immutable committed contract or a
        new run under a corrected control, and neither exists. EVIDENTIAL: P-CORE
        certifies the CONTROL OBJECT, not the CENSUS, and certifying a replacement
        control after the fact supplies no denominator for a quantity computed
        against the original one; no such re-normalisation exists in any committed
        run and none is computed anywhere. STRUCTURAL: the half of O-4 that is a
        claim about the census is not what was measured. THE VOID STANDS IN FULL,
        INV-4 IS NOT UN-FIRED, and no efficiency E, no yield ratio and no
        occurrence of 0.85 as a measurement appears in this record or in
        EV-ECDLP-009.
    - id: R-8
      text: >-
        THE ONE UNEXPLAINED OBSERVATION IS RECORDED, NOT ABSORBED, AND NO
        EXPLANATION IS ADOPTED. The aggregate z_sem mean of +0.361024 (sd
        0.975002, SEM 0.140729, t 2.5654) exceeds what the declared second-order
        biases account for by roughly an order of magnitude - they contribute
        +0.0264 and replicate skewness a further +0.011. What is EXCLUDED is
        excluded by named checks: a coding slip in either implementation, an
        off-by-one in the pre-mark, a ddof inconsistency, a seeding pathology, an
        n_rep-keyed code path, a third analytic term, and - decisively for the
        strongest hypothesis - a real bins-level bias, because a fixed offset in
        BINS large enough to give +0.3346 SEM at 100 replicates MUST give +2.9 to
        +3.7 SEM at 10,000, and the committed high-precision block measures
        exactly that through the same draw path and observes -2.95, +0.97, +0.61
        and -0.45, a joint outcome of probability of order 1e-7 under that
        hypothesis. The Validator's independent 400-repetition Monte Carlo under
        the contract's own seed rule places the observation at P = 0.0100 plus or
        minus 0.0050 with P(n_neg at most 16) = 0.0200. WHAT REMAINS: chance in an
        unthresholded post-hoc statistic that no criterion tests, and a small
        shift common to both BATCH-012 arms that would be a property of this
        driver, platform or numpy build. RT-20260729-021 made its own reading
        conditional on RC-21A being dispatched first; RC-21A WAS NOT DISPATCHED,
        the batch budget being consumed, so ON THE RED TEAM'S OWN STATED TERMS
        THIS RECORD RECORDS THE SHIFT AS UNEXPLAINED AND UNREPLICATED AND ADOPTS
        NO EXPLANATION FOR IT. It does not damage the P-CORE reading, and the
        reason is not that CR-4's window absorbed it: the shift is POSITIVE and
        every alternative this design exists to detect is a SHORTFALL, so it
        points AWAY from the counterfactual and cannot manufacture a pass a
        shortfall would have denied. ONE SENTENCE IS CONSTRAINED ON EVERY LATER
        RECORD: NO RECORD MAY SAY THE REPAIRED NULL LANDS ON P_pred - IT LANDS AT
        OR SLIGHTLY ABOVE IT.
    - id: R-9
      text: >-
        THE STRONGEST AVAILABLE REFUTATION ARTIFACT IS DECLARED AND ITS BASIS IS
        MIXED. A counterexample certificate is NOT AVAILABLE and none can exist,
        the exact-mean identity being a theorem for the specified process. The
        DERIVATION note is available, archived in the frozen specification and
        re-derived independently by RT-20260729-016 and again by
        TASK-20260729-020, and it is STRONGER THAN THE MEASUREMENT IT IS PAIRED
        WITH. Everything the run adds is EMPIRICAL_ONLY and is declared so in
        EV-ECDLP-009's `proof_status_declaration`. An undeclared basis would be
        the failure; the absence of a proof is not.
    - id: R-10
      text: >-
        NO HYPOTHESIS MOVES, AND THAT IS A REASONED CHOICE. A certified CONTROL is
        not evidence about the yield hypothesis, so H-YIELD-001 stays `specified`.
        H-STR-002 does not move in either direction: DEFER-BATCH009-001's
        EXP-STR-004 replication obligation is undischarged and binds its next
        transition. Nothing in this batch bears on H-IC-001, H-ENDO-001,
        H-GGM-001, H-FCP-001 or H-SUBRES-001. BECAUSE NO HYPOTHESIS FILE IS
        TOUCHED, no QUEUE-AMEND adding a hypothesis path was needed or recorded.
    - id: R-11
      text: >-
        THE BATCH IS A SUCCESS ON ITS OWN NARROW TERMS AND IS NOT A RESEARCH
        RESULT. RC-A was the cheapest control in the BATCH-011 design - seconds of
        wall clock and 61 MB - and it was never run before the expensive one.
        Running it cost 15.0 seconds and answered the exact question it was built
        to answer. It answers NO question about decomposition yield, moves no
        exponent, and is not a cryptanalytic result. Recording it as anything more
        would be the failure mode this program exists to avoid.
    - id: R-12
      text: >-
        THE SECOND AMENDMENT CYCLE WAS A DECLARED DEVIATION FROM A PRE-REGISTERED
        GATE, IT IS JUSTIFIED ON ITS STATED MERITS, AND IT IS NOT VINDICATED BY
        THE OUTCOME. See the `protocol_amendment_cycle_deviation` block below,
        which carries the QUEUE-AMEND-20260729-003 ruling into the ledger as
        INT-BATCH012-O and RC-21D require. A FAVOURABLE OUTCOME IS EXACTLY WHEN A
        PROCESS FAILURE IS EASIEST TO FORGIVE, AND THIS ONE IS NOT FORGIVEN BY IT:
        had the run returned MISS-STRUCTURED the identical process would be
        indicted, which is the test of whether the justification is
        outcome-independent, and it is. The one-cycle cap STANDS UNCHANGED for
        successors.

  prediction_disposition:
    was_the_pre_registered_prediction_met: >-
      YES, AT ALL 48 OF THE 48 DECLARED TUPLES, UNDER BOTH PRE-REGISTERED
      DENOMINATOR READINGS.
    detail: >-
      CR-1 (primary, standard-error-of-the-mean reading, denominator
      sem_rep = s_rep/sqrt(n_rep)): firing set EMPTY, 0 of 48, max |z_sem| =
      2.6101537975436533 at T-18-3-B44. CR-2 (secondary, single-replicate
      standard-deviation reading, denominator s_rep with ddof n_rep - 1): firing
      set EMPTY, 0 of 48, max |z_sd| = 0.4765467044908104. CR-3 (the
      pre-registered upward shift): firing set EMPTY, 0 of 48, max |z_shift| =
      2.981990543674932 at T-18-2-B140. CR-4 (aggregate sign): n_neg = 16, inside
      the pre-registered window [14, 34], does not fire. Every comparison
      evaluated on SET IDENTITY per PRED-ID, all three symmetric differences
      empty. Both denominator readings are reported at every one of the 48 rows
      and no cell reports only one.
    branch_under_the_frozen_rule: P-CORE
    miss_branches: >-
      NOT REACHED AND NOT REACHABLE ON THIS DATA. P-MISS is false, and
      MISS-STRUCTURED and MISS-MARGINAL are both branches of P-MISS, so neither
      is evaluated. The pre-registered meaning of a miss - that the reading of
      BATCH-011 would change from a null-construction fault to a MEASUREMENT
      fault and that EV-ECDLP-008 observation O-4 would be SUPERSEDED rather than
      confirmed - is recorded here so that the branch that did not occur is on the
      record beside the one that did. IT DID NOT OCCUR, and EV-ECDLP-008 is
      neither superseded nor edited by this record.
    pre_data_reference_carried: >-
      Under a perfectly correct repaired null this design records P-CORE only
      about 0.659 of the time, MISS-MARGINAL 0.291 and MISS-STRUCTURED 0.050 -
      committed at 5174001c BEFORE any draw, from RT-20260729-029's exact dynamic
      programming over the 48 per-tuple joint laws. The declared 0.377 marginal
      chance-alarm figure is carried only with the RT29-2 correction: it is no
      longer a DERIVED bound, the derived conditional union bound being 0.4427,
      but it remains a TRUE bound on the probability of at least one chance alarm,
      whose conditional value is 0.341.

  O_4_disposition: >-
    CONFIRMED IN PART AND LEFT STANDING IN PART; NOT SUPERSEDED, AND NOT CONFIRMED
    AS A WHOLE. Component (a), that the shortfall equals |S_(m-2)| exp(-lambda) at
    every cell: ALREADY DETERMINED arithmetic on committed data before this batch,
    reconfirmed, not newly established. Component (b), that a process which ALSO
    pre-marks |S_(m-2)| bins has mean P_pred: CONFIRMED BY MEASUREMENT FOR THE
    FIRST TIME - the batch's genuine increment. Component (c), that
    CTRL-NULL-SUMSET as IMPLEMENTED realises only the first term: SUPPORTED BUT NOT
    INDEPENDENTLY ESTABLISHED (C-12, C-21). Component (d), that the bins are the
    ones a cancelling multiset reaches DETERMINISTICALLY: UNTOUCHED AND STILL
    UNARCHIVED. THE FROZEN success_criterion SENTENCE THAT O-4 IS THEREBY CONFIRMED
    BY MEASUREMENT FOR THE FIRST TIME IS CORRECT FOR COMPONENT (b) AND OVER-BROAD
    AS WRITTEN AS A STATEMENT ABOUT O-4 AS A WHOLE, and it is not adopted
    unqualified anywhere. EV-ECDLP-008 is immutable and is not edited.

  validator_narrowings_adopted_verbatim:
    adoption_statement: >-
      ALL SEVEN REQUIRED NARROWINGS NARROW-1 TO NARROW-7 FROM VAL-20260729-001 ARE
      ADOPTED VERBATIM, NOT PARAPHRASED AND NOT ANSWERED ON THE MERITS. The
      Validator set `blocks_ledger_record: false`, so none of them is a condition
      on this record's existence; they are adopted because they are correct and
      because adopting the Validator's own words is safer than re-arguing them.
      Each is also carried into EV-ECDLP-009.
    NARROW-1: >-
      The condensed IV-2 projection in experiments/EXP-YIELD-002/results/summary.json
      records tolerance as null for KA-4 and KA-6, whose contract tolerances are the
      numeric half-bands 0.00178145 and 0.00114993; the complete per-case detail,
      including admissible_interval and half_band, is present in
      experiments/EXP-YIELD-002/runs/RUN-YIELD-002-KNOWNANSWER/results.json, and no
      verdict depends on the omission.
    NARROW-1_action: >-
      Cosmetic, disclosed by the Executor and correctly left unrepaired, since
      repairing it would have changed a driver SHA-256 already recorded in three
      written manifests and required a fourth run against a maximum_runs of 3. No
      repair is ordered.
    NARROW-2: >-
      CR-3's realised firing set is empty, and its largest realised statistic is
      |z_shift| = 2.981990543674932 at T-18-2-B140, which passes the 3.000 threshold
      by 0.018 and which is NOT one of the two tuples C-16 pre-registered by name as
      CR-3's expected chance offenders.
    NARROW-2_action: >-
      Carried into EV-ECDLP-009 observation O-5 so that no record reads the empty
      CR-3 firing set as a comfortable margin. Recorded beside it, in the package's
      favour: the two tuples that WERE named in advance, T-18-2-B264 and
      T-14-2-B118, realised 1.9806 and 1.5698 and did not fire - a genuine and
      correctly reported pre-registration success.
    NARROW-3: >-
      The high-precision diagnostic block's two legs share a per-tuple seed under
      DEV-4, so its measured repaired-minus-as-recorded differences are
      common-random-number estimates whose apparent agreement with T is tighter than
      two independent draws would give, and no record may read that agreement as an
      independent confirmation of the restored term.
    NARROW-3_action: >-
      Adopted and extended by RT21-8. No record produced by this batch quotes the
      high-precision difference column as a confirmation of T, and this one does not.
    NARROW-4: >-
      The mean of the z_sem vector over the 48 declared tuples, +0.3610 against a
      standard error of 0.1407, is not explained by anything in the run artifacts:
      the two declared second-order biases account for +0.026 of it, replicate
      skewness for a further +0.011, and an independent 400-repetition Monte Carlo
      of the whole design under the contract's own seed rule places the observed
      value in the upper tail at P = 0.0100 plus or minus 0.0050, with P(n_neg at
      most 16) = 0.0200.
    NARROW-4_action: >-
      Recorded as an unexplained observation under AGENTS.md core rule 8, not
      adjusted for, with no explanation adopted. See rationale R-8 and EV-ECDLP-009
      observation O-6. The named replication is RC-21A and it is the single next
      action.
    NARROW-5: >-
      The independent reproduction of this package was performed on the same
      platform, the same interpreter and the same numpy 2.4.0 as the original run,
      so it establishes determinism of the recorded pipeline and not portability
      across numpy versions or architectures, which the contract's own C-3e boundary
      never claimed.
    NARROW-5_action: >-
      The reproducibility claim in EV-ECDLP-009 is scoped to determinism of the
      recorded pipeline and nowhere to portability. RC-21A requires a DIFFERENT
      interpreter build and platform partly for this reason.
    NARROW-6: >-
      RC-F is not discharged by this validation: the validator's re-implementation
      was written from the same contract text as the Executor's driver, so a process
      error transcribed faithfully into the contract would be invisible to both, and
      only the P-REPAIRED pre-marking step, which has no analogue in the BATCH-011
      driver, is genuinely independent of the instrument under test.
