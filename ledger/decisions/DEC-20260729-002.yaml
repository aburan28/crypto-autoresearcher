  power_limit_sentence_C_20_carried_verbatim: >-
    THEREFORE A PASS OF P-CORE IS NOT EVIDENCE THAT THE REPAIRED NULL IS EXACT: it
    is evidence that the null does not fall short by a LARGE fraction of T, and a
    shortfall of 5 percent of T or less would be very unlikely to be detected by
    anything in this contract.
  power_limit_sentence_C_20_correction_carried_beside_it: >-
    MANDATORY. THE CLAUSE ABOUT A SHORTFALL OF 5 PERCENT OF T IS SUPERSEDED BY
    RT-20260729-021. The design detects a uniform shortfall of 5 per cent of T
    with probability about 0.9999 and of 4 per cent with probability about 0.99,
    essentially all of it carried by CR-1 at T-18-3-B16 where T/sem_001 is 124.73,
    so the expected |z_sem| there at phi = 0.05 is 6.24 and CR-1 fires at that
    single tuple with probability about 0.999. IT IS BLIND TO A UNIFORM SHORTFALL
    BELOW ABOUT 1.5 PER CENT OF T, AND BLIND TO ANY SHORTFALL THAT IS NOT
    PROPORTIONAL TO T, because T/sem_001 is below 3.000 at 25 of the 29 m = 2
    tuples. WHAT P-CORE EXCLUDES ABOVE PHI ABOUT 0.03 RESTS ON THREE TUPLES. The
    likelihood ratio against phi = 0 is 1.5 to 1 at phi = 0.02, 5.7 at 0.03, 87 at
    0.04 and about 8,600 at 0.05. Under a perfectly correct repaired null this
    design records P-CORE only about 0.659 of the time, MISS-MARGINAL 0.291 and
    MISS-STRUCTURED 0.050.

