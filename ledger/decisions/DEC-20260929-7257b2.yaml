    - id: R-HOLD-X11
      subject: DEC-20260928-63addc HOLD-X11 (IDEA-20260926-ae8f0a)
      ruling: >-
        TRIGGER MET (the revised 1b16d7 and e3048d are returned as 39014f and
        5628bc). ae8f0a becomes the constructive arm of one 2-power label
