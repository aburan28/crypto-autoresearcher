        hold's remaining uncertainty is therefore reducible only by the
        record's own measurement (its minimal_test Part 3), not by further
        reading of this source. The note's C4 evaluation of the bound is not a
        cost and is not adopted.
      design_conditions:
        - id: DC-L1
          text: >-
            One form of the decomposition-probability term is fixed before any
            calibration is read (the record states 1/(g-1)!, 1/(k-2)! and
