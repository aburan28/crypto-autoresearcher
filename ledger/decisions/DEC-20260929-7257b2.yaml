      - {tripwire: T4, idea_id: IDEA-20260922-8278db, where: the U-HOLDL design round and any design carrying the latent figure}
      - {tripwire: T5, idea_id: IDEA-20260922-153a90, where: the closure section carried in IDEA-20261001-39014f when U-LABEL is designed}
    new:
      - id: TW-7257-1
        idea_id: IDEA-20261001-621974
        field: claim (C) and interpretation_limits (the j = 2 free-oracle floor)
        what: >-
          The reviser reports that under the free-oracle convention the
          double-large-prime floor at m = 3 is 2^53.84, labelled by the
          reviser a floor (a D1-type gap quantity) and not a cost, and that
          this would scope KN-FIND-aa2efc's m = 3 statement and
          CORR-20260928-4cb669's statement that no m <= 3 row crosses rho to
          the j = 0 row. That is a proposed narrowing of established records.
        routed_to: review-breakthrough at max, non-degradable
        where: >-
          The first review of the U-REACH unit (621974 Stage 0) and of any
          design that carries claim (C); a blind re-derivation of the claim (C)
          table with the j = 0 fixture read first is required in its plan.
        meanwhile: >-
          KN-FIND-aa2efc and CORR-20260928-4cb669 stand as recorded. No design
          may cite the 2^53.84 figure, or any j = 2 budget, as a cost, an
          oracle bound or a crossing. Any narrowing is an additive correction
          by a later Coordinator decision after that round concurs.
      - id: TW-7257-2
        idea_id: IDEA-20261001-93e740
        field: claim (C) (Lemma A2-prime)
        what: >-
          The reviser reports that IDEA-20260906-a77711 Lemma A2 (freeness:
          the systems of R and sigma^j R share no tuple) holds for signed point
          tuples but not for the sign-free x-only systems the program builds
          (shared tuples exactly when one leg is a half of (1 - s lambda^j) R),
          which would affect IDEA-20260926-9c5694 reproduction check (iii)
          under HOLD-X5. Lemma A2 is the named obstruction of a77711's closure
          of the invariant-ring symmetry lens, and the text "falsifies Lemma
          A2" appears in a falsification clause of H-FROB-73df22 (whether that
          hypothesis's systems are signed or sign-free was not checked here).
          Closure-adjacent, so routed at the top tier.
        routed_to: review-breakthrough at max, non-degradable
        where: The first review of 93e740's Lemma A2-prime, inside the HOLD-X5 design round or standalone.
        meanwhile: >-
          Design condition on HOLD-X5: 9c5694 reproduction check (iii) is not
          used as an instrument gate until that review rules; the design
          pre-registers both readings (signed and sign-free) and the
          reviser's predicted coincidence count. a77711 and 9c5694 are not
          edited.

