      AGENTS.md rule 12 and DEC-20260928-63addc tripwire_routing. Each item is
      routed to review-breakthrough at max, non-degradable; if that tier
      cannot be served the item stays un-promoted and the impediment is
      recorded, never downgraded. Routing decides no item.
