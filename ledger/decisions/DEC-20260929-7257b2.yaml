      what_the_note_reports_for_scheduling: >-
        As the note's account of its source: no per-trial cost at arity 10 to
        22 over F_(2^16) is supplied, by measurement or by a law stated for
        that regime (largest implemented n is 5 with a 3-summand hybrid
