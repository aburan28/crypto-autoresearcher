        Gorla-Massierer is read at source. Met at excerpt level. The note of
        TASK-20260929-0e2d93 records arXiv:1405.1059 read through the ar5iv
        rendering of the arXiv LaTeX source (nine mediated fetches,
        load-bearing items in at least two), provenance retrieved, verified_by
