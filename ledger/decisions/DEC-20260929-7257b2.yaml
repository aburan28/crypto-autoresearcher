        IDEA-20261001-39014f's heuristic H-39014f-3 (per-attempt cost
        independent of the affine slice), because its load-bearing unproven
        step (Proposition 5) is invariance of the first fall degree under an
        affine shift; design condition on U-LABEL: cite it there.

