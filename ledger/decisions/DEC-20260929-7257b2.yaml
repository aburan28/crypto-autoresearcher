      statements (621974 on KN-FIND-aa2efc and CORR-20260928-4cb669; 93e740 on
      a77711 Lemma A2). Routing both to the top tier before any design reads
      them, and freezing their effect until then, is the conservative reading
      of rule 12; adjudicating them here would be deciding them.
    - >-
      Consolidation into three units (U-REACH, U-LABEL, and folding 93e740 and
      e740ce into existing holds) avoids building the same instrument three
      times and keeps the queue shorter than the record count.
    - >-
      The NISTBIN revision keeps its committed slot because the only reason to
      defer it again would be the HOLD-H clearance made today, and a ranked
      item is not deferred twice without a recorded cost of waiting; U-HOLDH
      takes the next slot and is protected by the same rule.

