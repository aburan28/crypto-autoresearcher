        - id: DC-H1
          text: >-
            The Hess obligation stays open. The design either reads Hess at
            source in its Stage 0 (a PDF-capable runtime; IMP-3 recheck) or
            carries (C1) as the record's own elementary derivation with MMT
            Remarks 21 and 23 cited as the source's conclusion and the Hess
            hypothesis as an explicit numbered open obligation.
        - id: DC-H2
          text: >-
            MMT Table 3 (n, m, g per open cell, read at source) is the
            baseline-reproduction fixture of the proof_search_map, including
            the four cells where m differs from n (E208 and E368 at n = 8 and
            16) and the n = 16 genus branch the source leaves open.
        - id: DC-H3
          text: >-
            The cost model charges linear algebra, the descent map and memory;
            the VOW memory-charged comparison is the record's own unsourced
            prediction and is priced, not quoted.
        - id: DC-H4
          text: >-
            Matched rho under CORR-20260922-81aeab (the note's CHECK-3 reports
            the record's printed rho about 0.25 bit below that convention).
        - id: DC-H5
          text: >-
            Any cell verdict that depends on pages 20-21, 25-42 or on the
            journal version reads them first (IMP-2 recheck).
        - id: DC-H6
          text: >-
            Tripwire T2 kept: the design round and any cell verdict below
            matched rho run at review-breakthrough at max, non-degradable.
      test_boundary: Zero compute; a reading of one source at the stated extent.
      remaining_uncertainty: >-
        The hypothesis of Hess's non-kernel theorem; ePrint versus journal
