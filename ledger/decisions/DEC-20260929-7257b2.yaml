  rulings:
    - id: R-HOLD-H
      subject: DEC-20260924-99ce20 HOLD-H (IDEA-20260922-d11575 with consolidated member IDEA-20260922-0e3641)
      ruling: >-
        CLEARED. Recorded revisit condition: a research-deep reading task reads
        the MMT body at source and records it as retrieved. Met. The note of
