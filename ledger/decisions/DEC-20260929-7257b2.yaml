        the conclusion for the record's 25 derived-empty cells (Remarks 21 and
        23, page 17) and the census quantities n, m, g for the 20 open cells
        (Table 3), but not the record's cost columns (GTTD time, charged
        factor-base memory, the van Oorschot-Wiener memory-charged comparison,
        any ratio to matched rho with linear algebra). Hess 2003/2004 was not
        read (IMP-3); the journal version and pages 20-21 and 25-42 were not
        read (IMP-2). The source's D2 column and its counterfactual figures are
        the source's numbers under its own model and are NOT adopted here.
