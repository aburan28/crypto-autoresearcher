      most two under an allowed singleton-support base. This is a scoped
      obstruction, not a universal nonexistence theorem.
    - >-
      O3 has the sole reviewed discharge: accepted-key actual-message
      correctness follows from psi([r]P)=[r]psi(P). O1, O2, O4, O5, and O6
      remain open, so J5 breaks and the construction gate is not met.
    - >-
      The two-pairing predicate uniquely recognizes a supplied scalar-transfer
      point in q-torsion, and the separate classical-ROM CEST-XFER-KI hybrid is
      directionally valid at its exact scope. Neither result constructs that
      point, yields a reusable evaluator, or extracts a complete EndRing basis.
    - >-
      J4 breaks because the record has no exact EndRing challenge embedding or
      attacker-to-rank-four-evaluable-basis extractor. The established
      EndRing-solver-to-decrypt implication is the reverse attack direction and
      supplies no security reduction.
    - >-
      The frozen unauthenticated syntax has an exact one-query IND-CCA2 break:
      altering only v by a nonzero Delta yields a distinct accepted ciphertext
      whose decryption reveals m_beta XOR Delta. This does not contradict the
      narrower conditional IND-CPA proposal under CEST-XFER-KI.
    - >-
      J6 passed after TASK-20261013-1c2b7a restored PDF direction arrows and
      durable links and TASK-20261013-b61e2d corrected the final link-count
      metadata. No scientific content or J1--J5 verdict changed.
