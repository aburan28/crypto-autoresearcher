  decision_note: >-
    "replicate" is the kind agents/coordinator.md gives for requesting
    independent replication of a result that is high-impact or sensitive to
    implementation choices. This decision opens one independent-validation
    round and freezes its review plan. It approves no experiment, and
    changes no hypothesis, experiment, goal or SafeCurves cell. It writes no
