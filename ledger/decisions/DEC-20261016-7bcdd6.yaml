    - ruling: review_plan_frozen
      record: TASK-20261016-9bf74b
      statement: >-
        The review_plan on TASK-20261016-9bf74b is frozen as committed in the
        freeze commit. It contains the claim as the producer stated it, the
        Coordinator's prior, the seven owned joints with worked attacks, the
        proves-too-much objects, the blind re-derivation with blind_from,
        coverage limits and procedure deviations. Any later change is a
        review_plan_addendum under a new record, never an edit. Success
        criteria do not move after results are seen (no protocol amendment
        without a versioned record).
    - ruling: archival_binding
      record: TASK-20261016-670480
      statement: >-
        The Validator's artifacts are archived alone, as a snapshot, after
        the Validator returns and before the Coordinator interprets them.
        The evidence record, the evidence-review decision and any KN-FIND
        come later, in a separate ledger archive under fresh ids.
  pre_committed_strength_reading: >-
    Written before any result. It binds this Coordinator's later evidence
    review, unless a versioned protocol_amendment changes it.
    (1) replicated, for C1, C2, C3 and C4 separately. Every joint bearing on
    the claim returns holds. Every proves-too-much object fails as required.
    blind_from is respected and the review-independence check passes. Any
    concern is wording or labelling only.
    (2) strong for C3 additionally requires the independent early-abort
    re-census of all 11,042 rows, agreeing row by row. Strong for C2
    additionally requires state recovery and walk-back for all ten prime
    seeds.
    (3) Any joint that breaks makes the affected claim contradictory or
    inconclusive, not weakened by default. The evidence review then names
    the defect and decides whether the producer must repair it.
    (4) A not_run check caps the affected claim at preliminary. A crash or
    a missing tool is never negative evidence.
    (5) C5 gets no strength. It is external analysis, and only its
    labelling and provenance are reviewed. A J7 timing concern does not
    lower C1-C4.
    (6) KN-FIND-cee88d is promoted only if the later decision is support at
    replicated or stronger. Its text is scoped to exactly the claims that
    reached that strength.
  rationale:
    - >-
      AGENTS.md "Review architecture" and agents/coordinator.md: a
      claim-changing round runs under a review_plan written before any
      reviewer runs. It records the prior first, gives every load-bearing
      joint one owner and a worked attack, names proves-too-much objects, and
      requires a blind re-derivation from statement and parameters alone.
      Replicating from the producer's artifacts is not a blind
      re-derivation. The plan is frozen in a commit before dispatch so that
      its timing is checkable.
    - >-
      knowledge/README.md and /curate-knowledge allow a KN-FIND only from an
      evidence record of strength replicated or strong. The bundle is a
      single producer's reproduction, so an independent implementation that
      never read the producer's code is the cheapest route to that strength.
      Disagreement would localise the defect to one of two named
      implementations.
    - >-
      One Validator owns all seven joints, because the joints share one
      implementation (drand48, the X9.62 map and the census) that should
      not be built twice inside one round. The cost is that mutual blindness
      is vacuous. The plan says so, rather than counting one reviewer as
      several.
    - >-
      Proportionality: this is provenance on historical curves. No ECDLP
      cost, curve-security verdict or SafeCurves cell depends on the outcome.
  evidence_refs:
    - ledger/decisions/DEC-20261016-fb3a6f.yaml
    - ledger/handoffs/TASK-20261016-714367.yaml
    - research/nist_seed_provenance_20261016/README.md
    - research/nist_seed_provenance_20261016/SOURCE.md
    - research/nist_seed_provenance_20261016/PREREGISTRATION.md
    - research/nist_seed_provenance_20261016/census/summary.json
    - knowledge/literature/KN-LIT-d2f917.md
  limitations:
    - >-
      The round has a single reviewer and no red-team pass. It tests
      independence from the producer, not across reviewers. If the evidence
      review finds a joint inconclusive, a red-team or second-validator
      round follows under a review_plan_addendum.
    - >-
      The Validator is blind to the producer's implementation, not to the
      target values. The README's counts are part of the claim under review
      and are visible from the start. Constraint 4 on the card orders the
      Validator's own outputs before the producer's corresponding outputs,
      and logs each by hash and timestamp. This ordering is attested, not
      mechanically enforced.
    - >-
      PARI/GP SEA is common to producer and Validator. Only the N*P = O
      certificate for prime orders is independent of it. The nonce sample
      detects a systematic error rate of about 1.5% or more, not an isolated
      wrong row. Only the optional full re-census closes that gap.
    - >-
      Where the dispatching brief and the repository contracts differ, the
      contracts win. (a) Evidence strength uses the repository hierarchy
      (docs/evidence-and-reproducibility.md), not "none / suggestive". (b)
      The producer's Rust receipt in /home/user/crypto is in blind_from for
      the whole round, because tools/check_review_independence.py treats any
      read as a leak and the round has one task id. (c) The claim is quoted
      in the producer's words. The README says "at most one" block-aligned
      state, not "exactly one". It lists the b = (p+1)/4 root as a census
      construction and a derived observation, not a classifier criterion.
    - >-
      The bundle was never archived by a Coordinator snapshot task. It is
      validated at the freeze commit under the 14 SOURCE.md hashes, as
      recorded in procedure_deviations.
    - >-
      This Coordinator subagent has no shell. It verified only that the
      three record ids were free (no file at those paths). The freeze
      commit, push, PR and dispatch are done by the top-level session.
