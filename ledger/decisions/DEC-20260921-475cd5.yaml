    THIS FOURTEENTH RESTART CARRIES A GENUINE, UNRESOLVED AMBIGUITY, SMALLER
    IN ABSOLUTE TERMS THAN THE TWELFTH'S OR THIRTEENTH'S BUT STILL PRESENT,
    STATED PLAINLY RATHER THAN RESOLVED BY ASSUMPTION, matching the precedent
    of every disclosed monitoring-gap ambiguity in this lane since
