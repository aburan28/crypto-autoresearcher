      restart cadence has any real pattern at all, or is simply highly
      variable, is exactly the kind of question a platform-level diagnosis
      could answer with dmesg/journalctl/eviction logs that this coordinator
      has no access to. This record reaffirms the recommendation rather than
      re-litigating or escalating it into a new condition -- it still runs in
      PARALLEL with, and never blocks, the retry authorized here.
    - >-
      TWO DIVERGENT COUNTS, REPORTED HONESTLY AND SEPARATELY, CONSISTENT WITH
      THIS CHAIN'S OWN PRIOR NUMBERING. This lane has now seen FOURTEEN
      genuine launch-and-restart cycles under driver-v2.py/checker-v2.py
      (RUN-FROB-39714f through the current RUN-FROB-a749d2) and, counting
