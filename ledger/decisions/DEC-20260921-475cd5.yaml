    running silently with no further roots.jsonl.gz writes until the
    confirmed reboot (a genuine run duration as long as ~16.5min). No
    telemetry survives a whole-environment restart by definition. This record
    states this plainly as genuinely unknown, bounded only by [~4.5min,
    ~16.5min], rather than manufacturing either narrative.
    THIS RECORD ALSO STATES PLAINLY, PER EXPLICIT DISPATCHING-SESSION
    INSTRUCTION, THAT THE THIRTEENTH RESTART'S DRAMATIC LONG DURATION DOES
    NOT APPEAR TO REPRESENT A LASTING CHANGE IN THE UNDERLYING INFRASTRUCTURE'S
