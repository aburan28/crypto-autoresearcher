    bound, roughly 3h09m to 5h21m before interruption -- by far the longest
    in this lane's history, against a prior record of ~37 minutes
    (RUN-FROB-35c3b1). This fourteenth restart's own interval, [~4.5min,
    ~16.5min], falls squarely back within the pre-thirteenth minutes-scale
    range (the eleven unambiguous points span ~3.5-37min, and the twelfth's
    own range was [~3.5min, ~53min]). One long outlier followed immediately
    by a short point is the signature of highly variable restart timing, NOT
    of a stabilizing trend. This record therefore continues to treat restart
    timing as highly variable with NO CONFIRMED TREND, and explicitly
    declines to assume the environment has become more stable going forward
    on the strength of the thirteenth restart's own duration alone.
    This coordinator has no shell and cannot independently recompute any
