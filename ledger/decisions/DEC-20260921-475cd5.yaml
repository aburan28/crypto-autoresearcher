  the_decision_stated_plainly: >-
    RUN-FROB-a749d2's interruption is diagnosed, honestly and without
    fabrication, as the SAME failure family that destroyed RUN-FROB-b8e451,
    RUN-FROB-c27b95, RUN-FROB-b91d47, RUN-FROB-9c4e81, RUN-FROB-e6c204,
    RUN-FROB-a91f4c, RUN-FROB-35c3b1, RUN-FROB-5fa3f0, RUN-FROB-0b1c8e,
    RUN-FROB-5490f1, RUN-FROB-16ecb6, RUN-FROB-f3e2a3, and RUN-FROB-39714f: a
    whole-environment/container restart external to any script's own
    control, external to any timeout wrapper (there was none this time
    either), and external to any code defect in
    driver-v2.py/checker-v2.py. This is the FOURTEENTH, CONSECUTIVE instance
    of the identical infrastructure failure family under the same,
    already-corrected source and launch procedure, launched correctly by the
    dispatching session every time. Its own survival duration is, like the
    twelfth and thirteenth restarts' own, honestly ambiguous rather than
    resolved by assumption: the last observed file write was at
    13:53:39Z, but the confirming reboot was not observed until 14:05:39Z, a
    gap of roughly 12 minutes -- much smaller than the twelfth restart's own
    ~53-minute gap and the thirteenth restart's own ~2h12m gap, but not zero.
    This record does not pick one of the two readings this gap admits and
    does not average or split the difference; it records the true interval as
    GENUINELY UNKNOWN, bounded only by [~4.5min, ~16.5min]. This record
    states plainly that the thirteenth restart's own dramatic, record-setting
    duration (~3h09m to ~5h21m, roughly five times the prior record) does NOT
    appear to represent a permanent change in the underlying infrastructure's
    behavior: this fourteenth point, at ~4.5-16.5 minutes, is back in the
    pre-thirteenth range spanned by the eleven unambiguous points (~3.5-37min)
    and the twelfth's own range ([~3.5min, ~53min]). This record therefore
    continues to treat restart timing as highly variable with NO CONFIRMED
    TREND, rather than assuming the environment has become more stable going
    forward. This uncertainty is itself infrastructure/observability signal,
    never negative mathematical evidence about H-FROB-73df22 (AGENTS.md core
    rule 3 / CLAUDE.md rule 3), and this record does NOT condition its own
    authorization on either resolution of it. None of the fourteen says
    anything about H-FROB-73df22.
    On that basis, this coordinator (1) makes no change to RUN-FROB-a749d2's
    directory -- it was already committed and pushed exactly as it stands
    (the raw 13713775-byte roots.jsonl.gz committed directly, and the other
    six adapter/launch files, no execution-receipt.json) by the dispatching
    session prior to this engagement, and this record does not touch it
    again -- and (2) authorizes a fresh retry under a fresh,
    coordinator-proposed (NOT yet allocate_id.py-confirmed) run_id,
    RUN-FROB-d05e7a, via a fresh trial-plan-stage0-v19.json, a fresh
    run-binding, and a fresh launch handoff to the Executor
    (TASK-20260921-0d56cb), per the user's standing instruction to keep
    retrying automatically through this exact recurring failure mode.

  rationale:
    - >-
      FOURTEENTH, CONSECUTIVE INSTANCE OF THE SAME FAILURE FAMILY, STILL
      INFRASTRUCTURE/PROTOCOL SIGNAL, NEVER NEGATIVE MATHEMATICAL EVIDENCE,
      PER AGENTS.md CORE RULE 3 / CLAUDE.md RULE 3. RUN-FROB-a749d2's
      resulting run-directory shape (real, partial scientific output --
      13713775 bytes of roots.jsonl.gz, committed directly this time since it
      is under GitHub's 100MiB limit -- no execution-receipt.json, entire
      process tree including the Python supervisor destroyed before any
      receipt-writing logic could run) matches every one of its thirteen
      predecessors under driver-v2.py/checker-v2.py. Fourteen-for-fourteen
      launch attempts under that source have now been killed by
      whole-environment restarts, all non-scientific, non-protocol
      infrastructure signal. None of RUN-FROB-a749d2 or any predecessor says
      anything about H-FROB-73df22, RQ-FROB-7d8dd4, or whether Frobenius
      structure moves the index-calculus exponent.
    - >-
      THE HONEST AMBIGUITY ITSELF, STATED PLAINLY, NOT RESOLVED BY
      ASSUMPTION -- AND ITS OWN NOTABLE FEATURE: A REVERSION TO SHORT
      DURATION, NOT A CONTINUATION OF THE THIRTEENTH RESTART'S OUTLIER.
      RUN-FROB-a749d2's last confirmed write (13:53:39Z, roots.jsonl.gz at
      13713775 bytes) establishes a floor of ~4.5min of genuine progress. The
      gap itself (last write to confirmed reboot, ~12min) is much smaller
      than both the twelfth restart's own ~53-minute gap and the thirteenth
      restart's own ~2h12m gap, so this fourteenth point's true interval
      cannot be narrowed below [~4.5min, ~16.5min]. This record explicitly
      declines to assume the process died promptly after its last write (the
      lower bound) merely because that is the more conservative reading, and
      equally declines to assert the ~16.5min upper bound as fact. The honest
      statement is: this fourteenth point's true interval lies somewhere in
      [~4.5min, ~16.5min], and which value it actually is CANNOT be recovered
      from the artifacts that survive a whole-environment restart. Critically,
      EITHER bound is back within the pre-thirteenth-restart minutes-scale
      range, and this record states plainly that the thirteenth restart's own
      dramatic ~3h09m-5h21m duration does not appear to represent a lasting
      change in the underlying infrastructure's behavior -- this fourteenth
      point, at ~4.5-16.5 minutes, is squarely back in the pre-thirteenth
      range. Restart timing remains highly variable with no confirmed trend;
      this record does not assume the environment has become more stable
      going forward, and does not assume it has become less stable either --
      one long outlier followed by a short point establishes variability, not
      direction.
    - >-
      NO FABRICATED RECEIPT, AND NO REDUNDANT PRESERVATION ACTION. This
      decision does NOT author an execution-receipt.json for RUN-FROB-a749d2,
      and does not construct, estimate, or infer one from the partial
      roots.jsonl.gz or from what a graceful interruption receipt would
      ordinarily contain. RUN-FROB-a749d2's directory was already committed
      and pushed exactly as found by the dispatching session, prior to this
      engagement, in commit 6ffe69026 -- this coordinator's own Glob confirms
      the working tree holds exactly the seven committed entries (launch.json,
      command.txt, stdout.log, stderr.log, environment.json, tuples.jsonl.gz,
      roots.jsonl.gz [the full raw file]), and no execution-receipt.json or
      other downstream adapter/checker artifact. Per AGENTS.md core rule 5,
      this record does not edit, complete, or backfill that directory in any
      way, and does not touch the run directory's exclusive-create run_id
      semantics (RUN-FROB-a749d2 is spent and cannot be reused).
    - >-
      NO OVERSIZED-ARTIFACT HANDLING WAS NEEDED THIS TIME, AND THIS RECORD
      DOES NOT MANUFACTURE ANYTHING BEYOND WHAT WAS ALREADY DONE.
      RUN-FROB-a749d2's roots.jsonl.gz (13713775 bytes, ~13.1MB,
      reported_by_session) is well under GitHub's 100MiB per-file limit and
      was committed directly, unlike RUN-FROB-b8e451's (~2.48GB),
      RUN-FROB-9c4e81's (151339023 bytes), and RUN-FROB-35c3b1's (486954627
      bytes), all of which required the oversized-artifact-pointer.json
      disclosure pattern. This is a difference in file size only, not a
      scientific or protocol difference, and is itself further,
      non-scientific confirmation that this fourteenth restart's own genuine
      progress was modest, consistent with the short end of this lane's own
      historical range rather than a continuation of the thirteenth restart's
      outlier scale.
    - >-
      THE RUNTIME LOCK BEING CITED REMAINS THE SAME, STILL-CURRENT, STILL-
      UNEDITED, LAUNCH-AUTHORIZED LOCK. This coordinator carries forward
      linux-runtime-lock-successor-20260914-c85f6a.json's content sha256
      (46d918a1a4b9d358df39f09a87d5221128cc1ce19cb62672bc35204785952eb5)
      unchanged from trial-plan-stage0-v18.json's and
      run-binding-stage0-v18-retry-20260921.json's own already-filled
      runtime_lock_sha256 fields (all agree, re-read directly in this
