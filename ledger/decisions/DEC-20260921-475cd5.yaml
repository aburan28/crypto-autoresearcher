      authorization changes here; a fourteenth whole-machine restart -- even
      one whose exact duration is ambiguous -- is not evidence the runtime
      lock's own guards were inadequate against a class of event
      (whole-machine restart) no per-process guard in that lock claims to
      protect against.
    - >-
      WATCHDOG SIZING RATIONALE REMAINS VALID, UNCHANGED. Even under the
      longest reading this lane has ever observed (the thirteenth restart's
      own ~5h21m upper bound), the duration remains far short of the 86400s
      (24h) watchdog ceiling; this fourteenth restart's own [~4.5min,
      ~16.5min] interval is trivially far shorter still. 86400 seconds
      remains sized generously above the longest duration this lane can
      currently establish under any reading and remains a ceiling meant never
      to bind in the normal case, machine protection only per CLAUDE.md
      "Research budgets: progress first".
    - >-
      DIRECTION CHECK, unchanged from the whole DEC-20260909-bf5b48 ..
      DEC-20260921-0ab00e chain. Stage0 is not itself exponent-moving; it is
      the correctness gate for H-FROB-73df22's two arms. No scientific claim
