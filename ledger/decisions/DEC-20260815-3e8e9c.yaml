  # ==================================================================
  # 9. RATIONALE
  # ==================================================================
  rationale:
  - >-
    THE BATCH DID EXACTLY WHAT IT WAS COMMISSIONED FOR, AND THAT IS RECORDED
    FIRST BECAUSE IT IS TRUE. BATCH-0d5018 existed to catch one specific
    failure mode -- a precision shared or borrowed between the two bases --
    and both reviews independently establish that it IS NOT PRESENT: the
    bisections replay separately from their own trials, the seed sets are
    disjoint, the minima differ, the probe sequences diverge at the sixth
    trial, and each reattempt used its own basis's own value. CTRL-2 is
    satisfied. The predecessor batch's defect was genuinely fixed.
  - >-
    THE REAL RESULT IS NOT THE HEADLINE. Two reviews, on two different
    instruments, converged on a finding neither was commissioned to produce:
    at the isolated-LLL-step level the calibration axis is PER-DRAW, not
    per-(d, beta). The Red Team reached it by source inspection (beta enters
    the bisected computation only through the RNG seed vector); the Validator
    reached it by running the null-object control the producer did not run
    (draw_index 0 -> 1 moves the threshold 4 bits, twice the 2-bit cross-beta
    gap). One static, one empirical, neither having read the other. That
    convergence is weighed as instrument diversity and NOT as distinct-model
    corroboration, because both reviewers ran on the same model family and
    said so.
  - >-
    THE HARD CALL IS THE ESCALATION CONDITIONAL, AND IT TURNS ON A PREDICATE
    RATHER THAN A MOOD. A pre-written consequent was waiting for "both cells
    fail". One cell failed. The other was killed by a clock. Treating the
    second as a failure would convert an infrastructure limit into a
    mathematical conclusion and close a lane for every campaign on an
    obstruction measured over a narrower scope than the closure asserts. I
    decline, and I record the three further reasons that would hold even if
    the count had been two.
  - >-
    THE ADVERSE ITEMS ARE CARRIED RATHER THAN SOFTENED. Zero cells cleared, in
    the fourth consecutive Stage-0 batch to clear none. The one properly
    calibrated cell that produced an outcome still failed. The first attempt's
    artifacts were deleted and its corroboration claim is unverifiable. The
    cap bound for the first time and 47.9% of the task's compute bought
    nothing. A large per-draw calibration cost is in no budget anywhere. None
    of this is reported as a disguised success, and the decision to withhold
    a closure is not a claim that the lane is healthy.
  - >-
    THE MEASUREMENT IS RE-READ AS A RESOURCE, AS THE PROTOCOL REQUIRES AND AT
    THE MOMENT IT IS CHEAPEST TO ASK. The same numbers that read as "a fifth
    recurrence of a known negative pattern" read, decomposed, as a measured
    monotone precision response at the full-tour level, and the tight cluster
    of three per-draw minima {69, 73, 75} inside one 2-limb mpfr regime reads
    as an argument for a fixed margin that would delete an entire cost
    dimension from Stage 1. Both readings are recorded in EV-MLKEM-6edf0e's
    resource_check, both are candidates rather than evidence, and both point
    at the same single cheap experiment -- which is why that experiment is the
    next action.
  - >-
    WHAT THIS BATCH IS NOT ALLOWED TO BUY, STATED SO NO LATER READER HAS TO
    INFER IT. It buys no C1/C2 finding, no ML-KEM statement, no Stage-1
    authorization or sizing, no experiment approval, no hypothesis-status
    movement, no escalation-branch ripeness, no cap amendment, and no
    knowledge promotion. It buys a corrected understanding of what the
    instrument measures, one replicated negative full-tour observation at one
    cell at one precision, one honest non-measurement, and a named,
    quantified obstruction that a later reader can compare and re-scope.

