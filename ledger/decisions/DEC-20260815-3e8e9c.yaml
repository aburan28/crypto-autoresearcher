  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED THIS BATCH, WITH A CONCRETE REASON AND A CONCRETE REVISIT
      CRITERION -- NOT A DEFERRAL BY FATIGUE.
      THE MANDATORY GATE DOES NOT FIRE: agents/coordinator.md requires a
      KN-FIND on a `support` or `reject_scoped` decision backed by
      `replicated`/`strong` evidence. This decision is `revise`, and it makes
      no adverse transition, so the obligation here is to state a reason
      rather than to promote.
      THE CANDIDATE, STATED SO IT IS NOT LOST: the per-draw calibration axis
      established on two instruments (Red Team OBJ-1 by source inspection,
      Validator F-3 by executed null-object control). Its content is that at
      the ISOLATED-LLL-STEP level `beta` enters the bisected computation only
      through the RNG seed vector, so a bisected "minimum" is a per-DRAW
      quantity; and that a single draw change at FIXED beta moved the
      threshold 4 bits at (d=512, beta=55), twice the 2-bit cross-beta gap.
      WHY NOT YET, THREE REASONS. (1) IT PARTLY NARROWS AN ALREADY-PROMOTED
      ENTRY. KN-FIND-ead2ac names its second recurrence axis "within a fixed
      dimension across `beta`", and this finding says that axis is measured by
      an instrument in which beta does not participate -- so the recurrence is
      across DRAWS. Narrowing a promoted finding is exactly the kind of
      corpus-level act that should rest on more than one directed control by
      one reviewer, especially when the reviewers are same-family and their
      agreement cannot be counted as corroboration. The narrowing is recorded
      durably in EV-MLKEM-6edf0e and in this decision and travels by citation
      in the meantime, so nothing is buried. (2) THE QUANTITATIVE HALF IS
      PRELIMINARY, NOT REPLICATED. The 4-bit effect rests on ONE additional
      draw at ONE cell and does not replicate at the other cell, where the
      same draw change left the threshold inside (69, 73]. A corpus entry
      asserting a per-draw spread wants a spread, not a single difference.
      (3) THE STATIC HALF, WHILE CHECKABLE BY INSPECTION, IS A STATEMENT ABOUT
      ONE HARNESS'S SOURCE AT ONE LEVEL OF THE PIPELINE. It must not be read
      as "beta is irrelevant" -- beta IS operative at the full-tour level as
      the block size -- and a corpus entry is precisely where that scope would
      be lost first.
      REVISIT CRITERION, PRE-COMMITTED HERE SO A SUCCESSOR CAN APPLY IT
      WITHOUT RE-ARGUING IT: promote when the per-draw spread of the
      isolated-step minimum is measured over >= 4 draws at one fixed (d, beta)
      cell, reported as a spread with its range, so the entry can state a
      distribution rather than a difference. That is cheap at this scale --
      the Validator's own draw-variation probes cost about six minutes per
      cell -- and it can ride along with any future Stage-0 producer at
      negligible marginal cost. If the next batch's single control run
      (next_actions) is dispatched, adding two further draws to it is a
      near-free rider and would very nearly discharge this criterion by
      itself.
      NOTHING ELSE IN THIS BATCH MEETS ANY PROMOTION BAR: the 0-of-2 outcome
      is a fifth recurrence of KN-FIND-f54a82's already-promoted
      isolated-step-vs-full-tour pattern and adds no new axis; the cap and
      cost findings (COST-1..COST-5) are campaign-budget facts recorded in
      EV-MLKEM-6edf0e rather than durable methodological claims; and the
      measured precision response is an open, one-run-away question, not a
      finding.
    sibling_findings_narrowed: []
    sibling_findings_note: >-
      KN-FIND-ead2ac is NOT edited, superseded, or re-litigated by this
      decision -- it is immutable, the Red Team explicitly AFFIRMS it, and the
      sharpening moves its hazard WIDER (per-draw rather than per-beta), not
