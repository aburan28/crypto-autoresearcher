coordinator_decision:
  id: DEC-20260815-3e8e9c
  id_date_note: >-
    THE DATE TOKEN IN THIS IDENTIFIER IS A MINT DATE, NOT A DECISION DATE.
    DEC-20260815-3e8e9c was pre-minted and two-scope verified on 2026-08-15
    when BATCH-0d5018 was opened, and is bound into that batch's own
    dispatch_queue.json in TASK-20260815-fa0ead's artifact_paths and
    archive.record_ids; the completion gate requires this exact identifier and
    forbids minting a replacement. The decision itself was made on 2026-08-17
    -- see decided_at. Per AGENTS.md rule 14, identifiers do not sort into
    creation order and chronology is read from `decided_at`/`recorded_at` or
    git history.

  context: >-
    BATCH-0d5018 of GOAL-MLKEM-005 discharged DEC-20260815-201633's own
    next_actions in full. TASK-20260815-f14d3c ran two genuine, SEPARATE
    1-bit-resolution isolated-LLL-step bisections inside the Red Team's own
    CTRL-1 (69,100] window -- 7 trials each, 5 of them interior, both
    endpoints re-confirmed as real trials -- determining 75 bits at (d=512,
    beta=55, seed 452658293) and 73 bits at (d=512, beta=70, seed 915347894),
    neither a fallback. It then re-attempted each cell's own full BKZ tour at
    ITS OWN newly-bisected precision under PER_BASIS_FEASIBILITY_CAP_V3 =
    14400 s. OUTCOME: (d=512, beta=55) raised
    ReductionError('infinite loop in babai') after 2502.74 s, terminating on
    its own far inside the cap, at fpylll bkz.py:186 inside a doubly-nested
    svp_preprocessing; (d=512, beta=70) was hard-killed by SIGTERM at
    14400.08 s having neither completed nor raised. n_cells_completed = 0 of
    2. TWO INDEPENDENT REVIEWS RETURNED TERMINAL VERDICTS. Validator
    TASK-20260815-57bc79 (VAL-20260815-57bc79): `passed`, every completion-gate
    item discharged, notarization chain re-verified first-hand in both
    directions, construction and seed fidelity AST-identical to both validated
    references with NO DRIFT, the cap applied exactly at each cell, and -- the
    substantive contribution -- INDEPENDENT RE-EXECUTION on a different host,
    OS, Python and numpy reproducing 8 of 8 producer trial outcomes with 0
    disagreements and fully reproducing the (d=512, beta=55) full-tour ERROR
    at 75 bits, same error string character-for-character, same seed, same
    nine-frame failure path in the same order. Red Team TASK-20260815-19c716
    (RT-20260815-19c716): THE PACKAGE IS ACCEPTED AS AN HONEST, INTERNALLY
    CONSISTENT, NOTARIZED MEASUREMENT AND ITS HEADLINE READING IS REJECTED AS
    TOO BROAD. Both reviews independently establish that the failure mode this
    batch existed to catch -- a precision shared or borrowed between the two
    bases -- IS NOT PRESENT: CTRL-2 is satisfied. The full reconciled account
    is EV-MLKEM-6edf0e. CLAIM TIER TOY, UNCONDITIONALLY: nothing here bears on
    ML-KEM security, any FIPS 203 parameter set, any attack cost, or on C1, C2
    or H-MLKEM-7d9bcc in either direction.

  decision: revise

  decision_note: >-
    `revise` is the ACTION: the evidence record is committed with the
    cell-by-cell outcome reconciliation and a measured obstruction block, and
    the successor's single next action is a strictly cheaper, evidence-directed
    control than either of DEC-20260814-4ac30a's own named escalation branches
    -- NOT a verdict on C1 or C2, NOT a Stage-1 sizing, NOT a change to
    H-MLKEM-7d9bcc's or EXP-MLKEM-42ea04's status, and NOT a ripeness ruling
    for the escalation branches. PREREG-8 section 4.3 item 1's own FORBIDS
    clause bars any C1/C2 statement while T-PROJNOISE-NODATA fires (again),
    and this decision honours that bar in full. `approve` (of
    EXP-MLKEM-42ea04) is explicitly declined again, for reasons given in
    experiment_approval_ruling. `reject_scoped` is UNAVAILABLE AND WOULD BE A
    CONTRACT VIOLATION HERE: it may not rest on a single unreplicated
    empirical-only run, and what this batch holds is ONE measured full-tour
    failure plus ONE non-measurement. `pause` is unavailable for the identical
    reason the three predecessor decisions in this chain gave:
    GOAL-MLKEM-005's pause_conditions are INFRASTRUCTURE-ONLY, and an
    infrastructure-limited result is explicitly listed in the goal's own
    non_terminal_conditions. THIS BATCH CLOSES, PAUSES, AND COMPLETES NOTHING,
    and no declared pause condition fired -- checked item by item, not
    assumed: the archive verifies, the repository pushes, no `degradable:
    false` policy was required or unresolvable, and the user asked for no
    pause.

  target_ids:
  - GOAL-MLKEM-005
  - BATCH-0d5018
  - TASK-20260815-f14d3c
  - TASK-20260815-02b01b
  - TASK-20260815-57bc79
  - TASK-20260815-19c716
  - TASK-20260815-fa0ead
  - EV-MLKEM-6edf0e
  - H-MLKEM-7d9bcc
  - EXP-MLKEM-42ea04

  # ==================================================================
  # 1. VALIDITY BEFORE INTERPRETATION
  # ==================================================================
  run_set_validity:
    ruling: >-
      THE RUN SET IS VALID AND ADMISSIBLE for exactly what it reports: a
      two-cell, d=512-only, per-basis bisection-and-reattempt that produced
      two genuine isolated-step minima, ONE measured full-tour failure, and
      ONE non-measurement. It is NOT, and is not treated as, evidence for or
      against C1 or C2, and it is not treated as two failures.
    expected_run_count: >-
      ONE producer task, one internally-declared run
      (RUN-TASK-20260815-f14d3c-attempt2), covering 2 bisections x 7 trials =
      14 isolated-step trials plus 2 full-tour cells. The Validator's
      full-run-coverage check confirms every planned unit of work reached a
      terminal state and appears in the artifacts, in_progress is false, and
      no scratch file remains. A SECOND, EARLIER EXECUTION OCCURRED and was
      killed by a VM reboot; its artifacts were deleted at the dispatch's
      direction and exist in no commit. That is disclosed by the producer and
      confirmed independently by both reviews; it is treated as consuming no
      run and as supporting nothing (see EV-MLKEM-6edf0e.attempt_1_artifacts_
      deleted). The declared execution_boundary maximum_runs = 1 is read as
      one clean producer pass, which is this program's practice after an
      infrastructure kill and is disclosed rather than hidden.
    schema_complete_manifests: >-
      CONFIRMED TWICE, INDEPENDENTLY, WITH GIT PLUMBING, AND NEITHER REVIEW
      ACCEPTED THE DISPATCHING SESSION'S PRIOR ASSERTION. Validator: 12/12
      declared digests recomputed from the snapshot commit's own blobs, 0
      mismatch, 0 missing; commit's changed set equals the receipt's declared
      set with BOTH symmetric differences EMPTY; commit and parent both
      ancestors of a freshly fetched origin/main; working tree byte-identical
      to committed blobs for 12/12. Red Team: 13/13 recomputed, 0 mismatch, 0
      missing, 0 non-hash sentinels, and the receipt's expected commit-vs-
      working-tree divergence (the 6470beac9 commit_sha backfill) identified
      and recorded as benign. The run manifest carries every field AGENTS.md
      "Artifact policy" requires except probe-verified model status, which is
      recorded as unverified rather than asserted. TWO MANIFEST DEFECTS ARE
      DISCLOSED AND NEITHER IS LOAD-BEARING: both successful bisections are
      filed under `runs.failed` with `status: COMPLETED` and an explanatory
      note (Validator F-6), and the manifest dropped the `artifact_sha256` map
      its predecessor carried, leaving every digest in the package traceable
      to a single writer (Red Team OBJ-6).
    seed_integrity: >-
      CONFIRMED INDEPENDENTLY BY BOTH REVIEWS. SEED_ROOT = 715923 and the full
      default_rng([SEED_ROOT, stage_index, d, beta, arm_index, draw_index])
      formula were recomputed in a fresh process on a different host with a
      different numpy and reproduce 452658293, 915347894 and -- as a
      cross-check against a third, independent record -- 2074339090 at
      (512, 40), matching TASK-20260815-6e4c02's own EXPECTED_SEED. All 7
      beta=55 trials and all 7 beta=70 trials record their own expected seed,
      and the beta=55 reattempt cell records 452658293. ONE GAP: the beta=70
      reattempt cell has NO in-worker record at all -- it was SIGTERMed before
      serializing -- so its seed, GSO float type and strategies file are
      inferable from the parent's argv and stdout but are NOT
      artifact-verified. That is an instrument limitation inherent to a hard
      kill, not a producer omission, and it is recorded rather than waved
      through.
    raw_summary_agreement: >-
      CONFIRMED, AND MORE STRICTLY THAN USUAL. The three JSON blocks printed
      in the committed stdout.log parse and compare EQUAL, as Python objects,
      to the three committed JSON artifacts -- so the results files are the
      program's own output and were not hand-edited afterwards. Every metric
      the Validator recomputed from raw artifacts agrees: both bisection
      replays reproduce the recorded probe ORDER exactly; bisection wall-clock
      sums agree to 0.01 s and 0.00 s; the whole-script total agrees to
      rounding with a 44 s residual in the right direction; peak RSS and
      per-cell figures match the manifest exactly. UNLIKE THE PREDECESSOR
      BATCH, NEITHER REVIEW FOUND ANY ARITHMETIC ERROR IN THE PRODUCER'S OWN
      ARTIFACTS -- the Red Team checked the same axis its own predecessor's
      OBJ-4 found defective and reports this package clean on it, explicitly.
      (One arithmetic slip DOES exist elsewhere in the batch and is recorded
      rather than passed over: the Validator's own report miscounts its own
      probe enumeration in its trailing hand_off_note, saying 38 where its
      section 8 list and section 9 text both say 40. It is load-bearing only
      for the archive's declared set, which was settled by directly listing
      the write_scope; the immutable report is not edited.)
    control_comparability: >-
      SATISFIED, AND EXTENDED BEYOND WHAT THE CONTRACT REQUIRED. The
      producer's own matched positive control (100 bits COMPLETES) and
      negative control (69 bits ERRORs) ran as real trials at both bases with
      correct seeds and real wall clock, and the Validator re-measured all
      four first-hand. THE VALIDATOR THEN ADDED TWO CONTROLS THE PRODUCER DID
      NOT RUN, under docs/inventor-protocol.md section 3: a 71-bit
      monotonicity probe at both bases, and the NULL OBJECT OF THE SAME SHAPE
      -- same cell, same construction, only the seed formula's free draw_index
      moved 0 -> 1. THE NULL-OBJECT CONTROL FIRED, and its consequence is
      carried in full in EV-MLKEM-6edf0e. The canonical artifact tell -- a
      quantity that fails to decay when the parameter meant to destroy it
      increases -- is ABSENT: the failure decays monotonically in precision at
      every point anyone has measured.
    infrastructure_separation: >-
      THE DECISIVE VALIDITY CALL OF THIS BATCH, MADE EXPLICITLY. The two cells
      are NOT in the same category and are not aggregated. (d=512, beta=55)
      produced a MATHEMATICAL OUTCOME: a genuine exception raised by a valid
      run that terminated on its own inside its cap, correctly classified
      `negative_observation`, and independently reproduced frame-for-frame on
      a second host. (d=512, beta=70) produced NO OUTCOME: a wall-clock cap
      kill, correctly classified `resource_exhaustion`, which under AGENTS.md
      core rule 5 and CLAUDE.md rule 3 is INFRASTRUCTURE SIGNAL and contributes
      EXACTLY ZERO to any obstruction measurement or to any count of failures.
      The producer itself is careful here and neither review objects to its
      wording; the risk was always downstream, in this decision, and it is
      refused here.

  # ==================================================================
  # 2. THE TERMINATION BRANCH
  # ==================================================================
  termination_branch:
    branch: T-PROJNOISE-NODATA fires AGAIN, for this narrower two-cell d=512 follow-up.
    firing_confirmed_by: >-
      TASK-20260815-f14d3c's own writeup, the Validator (which records the
      measured fact n_cells_completed = 0 of 2 and challenges no branch), the
      Red Team (which confirms PREREG-8 section 4.3 item 1's FORBIDS clause is
      honoured throughout by direct inspection of every artifact), and this
      Coordinator's own reading of PREREG-8 sections 2.3 and 4.3 item 1.
    licenses: >-
      Citing the two per-draw isolated-step minima, the (d=512, beta=55)
      full-tour ERROR with its exact traceback and wall clock, and the
      (d=512, beta=70) cap kill AS A NON-MEASUREMENT, as a standalone,
      reportable infrastructure-timing deliverable. Nothing else.
    forbids: >-
      Any statement about C1 or C2's truth, in either direction, at either
      cell. This decision makes none.

  # ==================================================================
  # 3. RECONCILIATION OF THE TWO REVIEWS
  # ==================================================================
  review_reconciliation_ruling: >-
    NO FACTUAL CONFLICT EXISTS BETWEEN THE TWO REVIEWS, AND NONE REQUIRES
    ADJUDICATION AGAINST A LIVE fpylll INSTALL. Where they overlap they agree
    exactly -- notarization chain, bisection genuineness and separateness,
    construction and seed fidelity, exact cap application, complete scope
    discipline, and the unverifiability of the deleted first attempt's
    corroboration claim (reached independently as Validator F-1 and Red Team
    OBJ-5). Where they differ they are complementary instruments, not
    competing opinions: the Validator's contribution is RE-EXECUTION on a
    second host plus two controls the producer never ran; the Red Team's is
    ARITHMETIC AND SOURCE READING over the committed fields -- it executed no
    fpylll and no lattice computation of any kind, and says so plainly --
    plus the cost-model and scope challenges.
    ONE CROSS-QUALIFICATION IS RECORDED RATHER THAN SMOOTHED: the Validator's
    F-4 (the error-versus-timeout asymmetry is confounded with BKZ block-size
    cost) directly bounds the beta=70 row of the Red Team's OBJ-4 precision
    response. Both are correct; the beta=55 row, a within-cell comparison at
    fixed beta with only precision changed, is not so confounded. This
    decision therefore relies on the beta=55 row and treats the beta=70 row as
    supporting nothing in either direction.
    ONE PLACE WHERE THIS COORDINATOR NARROWS A REVIEW STATEMENT USING THE
    OTHER REVIEW'S MEASUREMENTS, BECAUSE NEITHER COULD SEE THE OTHER:
    RT-CTRL-4 lists five untested interior points below the reported minima,
    correctly derived from the producer's trials alone; the Validator
    subsequently measured 71 bits at BOTH bases. The reconciled state is
    exactly THREE untested points at draw 0 -- 70 and 73 at beta=55, 70 at
    beta=70 -- which is narrower than either review states on its own. This
    reconciliation is my own act on two committed reports and is not presented
    as a third review.
    HOW THEIR AGREEMENT IS WEIGHED, STATED PRECISELY AND NOT INFLATED: BOTH
    REVIEWERS DISCLOSED, UNPROMPTED, THAT THEY RAN ON THE SAME MODEL FAMILY.
    Every agreement between them is CORRELATED SAME-MODEL JUDGEMENT and is NOT
    recorded anywhere as distinct-model corroboration, nor as an attestation
    of any kind -- I obtained none and I record none. What DOES carry
    independent weight, and is claimed at exactly that width: (i) the two
    reviews reached the per-draw finding on DIFFERENT INSTRUMENTS, one static
    source reading and one executed null-object control, and a measurement is
    not a second opinion; (ii) both reviews ARE a different resolved model
    from the producer, which recorded claude-sonnet-5 in its own run manifest
    -- a genuine but PARTIAL independence gain over this goal's
    eighteen-batch history, being one vendor's family reviewing another model
    in the same family. AGENTS.md rule 12 remains UNMET AND UNWAIVED.

  # ==================================================================
  # 4. THE ESCALATION CONDITIONAL -- THE PRIMARY RULING
  # ==================================================================
  escalation_conditional_ruling: >-
    DEC-20260815-201633's ESCALATION CONDITIONAL IS **NOT DISCHARGED** BY THIS
    BATCH. I RULE EXPLICITLY, NOT BY DEFAULT, AND THE REASON IS THE PREDICATE,
    NOT THE MOOD OF THE RESULT.
    THE ANTECEDENT, QUOTED FROM THE RECORD IT LIVES IN. Its
    escalation_branch_ruling says: "If THAT follow-up ALSO FAILS TO CLEAR
    EITHER of the two remaining cells at their OWN properly-calibrated
    precision, the obstruction is then measured closer to ... the scope the
    escalation branches require." Its next_actions section 12 states the same
    trigger as: "IF BOTH STILL FAIL, EVEN AT A GENUINELY, INDIVIDUALLY
    CALIBRATED PRECISION."
    WHAT ACTUALLY HAPPENED, AGAINST THAT PREDICATE. (d=512, beta=55) at its
    own bisected 75 bits DID FAIL, in the full sense the antecedent means: a
    genuine mathematical outcome, an exception raised by a run that terminated
    on its own inside its cap, independently reproduced frame-for-frame on a
    second host. That is ONE of the two. (d=512, beta=70) at its own bisected
    73 bits DID NOT FAIL. It was hard-killed by SIGTERM at a 14400 s wall-clock
    cap having neither completed nor raised. "Did not clear" and "failed to
    clear" are not the same predicate, and this consequent draws on the
    latter. Under AGENTS.md core rule 5 and CLAUDE.md rule 3 a timeout is
    infrastructure signal and NEVER a negative mathematical result; it
    contributes exactly zero to any obstruction measurement. The antecedent
    requires BOTH cells to have failed. ONE FAILED AND ONE WAS NEVER MEASURED,
    SO THE ANTECEDENT IS FALSE AND THE CONDITIONAL DOES NOT FIRE.
    I ACCEPT THE RED TEAM'S OBJ-2 ON THIS POINT IN FULL, AND I NOTE THAT IT
    ARGUES FORCEFULLY FOR EXACTLY THIS READING. I also record that this is the
    ruling I would reach without it: applying a pre-written consequent to a
    record containing one measured failure plus one timeout would convert an
    infrastructure limit into a mathematical conclusion, which is the single
    prohibition agents/coordinator.md states most plainly about my own role.
    THREE FURTHER REASONS, EACH INDEPENDENTLY SUFFICIENT TO WITHHOLD THE
    CONSEQUENT EVEN IF THE COUNT HAD BEEN TWO. (1) CALIBRATION LEVEL: the one
    measured failure occurred at the ISOLATED-STEP MINIMUM, the least
    conservative precision in the entire tested window, which this goal's OWN
    ALREADY-PROMOTED KN-FIND-f54a82 says is the wrong calibration target for
    the full tour. The Red Team's OBJ-3 makes the sharper point that the task
    card MANDATED that precision, so the outcome was predicted before the run
    by the goal's own knowledge base; that is a design objection against the
    card, not against the executor, who executed the card exactly. (2)
    OBSTRUCTION SCOPE VERSUS CLOSURE SCOPE: no d=512 cell has EVER been run,
    at any beta, at any precision above its own isolated-step minimum, in this
    goal's entire history. The escalation branches assert that the corrected
    construction, or the fplll/fpylll build itself, is exhausted at d=512. An
    obstruction measured only at the isolated-step minimum is measured over a
    scope strictly narrower than that assertion -- the failure mode
    agents/coordinator.md's Closure gate names as the more common and the more
    expensive one, because it closes a lane for every campaign and not just
    this one. (3) OBJECT SCOPE: the obstruction is measured on a GENERIC
    RANDOM q-ARY LATTICE, while PREREG-8's Stage 1 -- the thing this gate
    exists to gate -- reduces real ML-KEM module lattices whose GSO profile
    differs. The gate is measured on a different object from the one it
    gates, in both directions, and no record in this goal has ever stated that
    transfer assumption. It is now stated, in EV-MLKEM-6edf0e's obstruction
    scope.
    AND THE DIRECTION OF THE EVIDENCE POINTS THE OTHER WAY. The same recorded
    numbers contain a measured, monotone 376.4x growth in post-outer-LLL
    residual at fixed cell and fixed beta on +6 bits of precision, carrying
    the computation from "never entered a tour" to roughly 35 minutes of real
    BKZ work -- corroborated by the Validator's independent re-execution,
    which measured 1104.40 s of BKZ work before the identical failure on a
    different host. Closing on a record whose own numbers show the failure
    decaying under the parameter meant to destroy it would be premature
    closure in the exact sense docs/inventor-protocol.md section 4 defines: a
    fatigue report about the calibration search wearing a number, whose honest
    status is `unverified`.
    WHAT THIS RULING IS NOT. It is not a finding that the escalation branches
    are wrong, and it is not an indefinite deferral. It names the one cheap
    run that would settle the antecedent's remaining half and put the
    obstruction, for the first time, at a precision that is not the
    isolated-step minimum -- see next_actions. If that run errors identically,
    the obstruction is then measured at the scope those branches presuppose
    and I expect the successor decision to say so. Refusing to close on
    evidence that supports closing is premature closure's mirror image; the
    evidence here does not yet support closing, and the successor is one run,
    not one campaign, away.

  # ==================================================================
  # 5. RIPENESS OF DEC-20260814-4ac30a'S NAMED ESCALATION BRANCHES
  # ==================================================================
  escalation_branch_ripeness_ruling: >-
    NOT RIPE. This follows directly from section 4 and is stated separately so
    it cannot be read as merely implied. DEC-20260814-4ac30a's own named
    branches -- an upstream fplll bug report, an alternate build/version, or a
    scoped-down dimension -- each presuppose that the corrected (ROW_EXPO-free,
    mpfr) construction itself is exhausted at d=512. That premise is not met
    by a record holding one measured failure at the wrong calibration level
    and one non-measurement.
    ONE BRANCH IS NEVERTHELESS NOW BETTER SUPPORTED THAN IT WAS, AND I RECORD
    THAT RATHER THAN LETTING A "not ripe" HIDE IT: the Red Team's RT-CTRL-3(i)
    observes that the object under test IS the null object -- a structureless
    random q-ary lattice -- so every d=512 obstruction this goal has measured
    is a property of fpylll 0.6.4's mpfr path on generic bases, on one host.
    That directly INDICATES the "upstream fplll bug report" branch over the
    "construction is exhausted" reading. It does not make that branch ripe on
    this record, because a bug report whose reproducer is a run at a precision
    the reporter's own knowledge base says is inadequate is a weak report; the
    next action's single run produces a materially stronger reproducer either
    way. This is recorded so the branch is not lost, and so a successor
    Coordinator can pick it up with the reason already written down.

  # ==================================================================
  # 6. STAGE 1 IS NOT AUTHORIZED, NOT SIZED, AND NOT SIZEABLE FROM THIS RECORD
  # ==================================================================
  stage_1_authorization_ruling: >-
    NO STAGE-1 SIZING OR ESCALATION-BRANCH DETERMINATION IS AUTHORIZED FROM
    THIS RECORD, AND I DECLINE TO MAKE ONE. Both reviewers decline to
    recommend one; I reach the same conclusion on the record itself, for three
    reasons that are independent of their recommendations.
    (1) THERE IS NO COMPLETED-CELL COST TO SIZE FROM. Zero cells cleared. The
    only two cost figures in the record are a FAILURE cost (2502.74 s) and a
    LOWER BOUND (>= 14400 s at a cap kill). A per-cell Stage-1 cost
    manufactured from either would be unsupported by this run, and the
    Validator states independently that the expected-total-cost bookkeeping is
    correctly absent because 0 of 2 successes gives no probability to invert.
    (2) A LARGE OMITTED COST IS NOW ON THE TABLE AND IS IN NO BUDGET. COST-1:
    if per-draw bisection is carried into Stage 1 -- and the per-draw axis is
    exactly what this batch established -- calibration alone costs ~1,209,600 s
    against a frozen 2,073,600 s ceiling, a ~58% increase appearing in no
    specification, no decision record and no budget_justification anywhere. It
    is labelled as what it is: arithmetic extrapolated from d=512 rates, not a
    measurement. It is nevertheless the number a Stage-1 sizing decision must
    not be made without, and it currently has a plausible mitigation (a
    fixed-margin precision) whose price is unmeasured.
    (3) THE SIZING METHOD ITSELF IS FALSIFIED ON THIS RUN'S OWN DATA. COST-2:
    "largest per-trial cost observed to date x n_trials" was used as an upper
    bound and was exceeded by 9.68% on a single trial and 4.5% on a basis
    total. Nothing broke, because the real budget had headroom. But that same
    method style underpins PER_BASIS_FEASIBILITY_CAP_V3 and would underpin any
    Stage-1 sizing, and COST-3's measured 5-8% environmental error bar on
    every wall-clock number in this record compounds it.
    EXP-MLKEM-42ea04 IS NOT APPROVED AND ITS SPECIFICATION IS NOT TOUCHED.

  # ==================================================================
  # 7. THE CAP DIVERGENCE FROM THE FROZEN SPECIFICATION
  # ==================================================================
  cap_divergence_ruling: >-
    RECORDED, NOT RESOLVED HERE, AND EXPLICITLY NOT RATIFIED BY SILENCE.
    COST-4 establishes by direct inspection that
    experiments/EXP-MLKEM-42ea04/specification.yaml states
    PER_BASIS_FEASIBILITY_CAP = 3600 s twice for Stage 0 (line 123
    pass_condition, line 333 stopping rule) and PER_BASIS_STAGE1_CAP = 14400 s
    for a single Stage-1 basis reduction (line 339); that this Stage-0 task
    ran at the Stage-1 number, a 4.0x relaxation; that "PER_BASIS_FEASIBILITY_
    CAP_V2/V3" appears NOWHERE in specification.yaml, the V2/V3 escalation
    living only in batch-local decisions and goal checkpoints; and that the
    escalation 3600 -> 7200 -> 14400 has now run three batches without an
    amendment and without buying a single completed cell. CONCRETE COST IN
    THIS RUN: 10,800.08 s -- 47.9% of the task's entire compute -- was spent
    past the specification's own Stage-0 stopping rule and produced no
    information; by that rule (d=512, beta=70) was a dropped NOT_COMPUTED cell
    at 3600 s. (d=512, beta=55) errored at 2502.74 s, INSIDE the spec's cap,
    so the one measured mathematical outcome in this batch is unaffected by
    the divergence.
    MY RULINGS, THREE, EACH NARROW. (a) THIS IS NOT A PROTOCOL VIOLATION:
    EXP-MLKEM-42ea04 is `review_required` / `approved_by: null`, so there is
    no approved protocol to violate, and a larger cap can only help a cell
    PASS -- it cannot manufacture a negative. (b) I MAKE NO AMENDMENT AND
    RAISE NO CAP. Changing a frozen success criterion after observing outcomes
    requires a versioned `protocol_amendment` record, and I will not create
    one inside an archive whose whole subject is the outcome it would
    retro-fit; nor is any cap raise self-grantable. (c) I BIND THE SUCCESSOR
    TO DUAL-MARK REPORTING RATHER THAN TO A SILENT FOURTH INHERITANCE: the
    next Stage-0 producer reports its outcome at BOTH the 3600 s and the
    14400 s marks, so the record is readable against the number PREREG-8's
    eventual go/no-go will actually be read against. That is a reporting
    requirement that narrows rather than loosens, costs nothing, and is
    exactly what the Red Team asked for as the alternative to an amendment.
    Whether to amend the specification is a separate act for a separate
    record, and it is named here so it is not forgotten.

  # ==================================================================
  # 8. HYPOTHESIS AND EXPERIMENT STATUS, RULED EXPLICITLY
  # ==================================================================
  hypothesis_status_ruling: >-
    H-MLKEM-7d9bcc STAYS `proposed`. Reasoned, not defaulted:
