coordinator_decision:
  id: DEC-20260913-47bbb7
  context: >-
    IMP-SEMBIN-ENGINE was recorded on GOAL-SEMBIN-5078bc as blocking the degree lane
    because no Groebner engine is installed on this host -- no MAGMA, Sage, Singular or
    msolve, and this program's own first-fall instruments src/ic_first_fall_fast.py,
    src/semaev_tree.py and src/h012_peel_rank.py all import sage.all at module scope. Two
    approved experiments sat unrunnable behind it: EXP-SEMBIN-c2c312, which instruments
    Semaev's d_F4 against GOAL-DREG-001's Macaulay-rank statistic on byte-identical
    instances, and EXP-SEMBIN-7e1371, which locates the d_F4 = 4 versus d_F4 >= 5 boundary
    of Assumption 1. Both bear on the load-bearing assumption of the paper under audit,
    and both had been shelved rather than ranked.

    Reading the two contracts against the installed code shows the impediment is wider
    than the facts. EXP-SEMBIN-7e1371's own title is "using degree-4 Macaulay rank
    certificates INSTEAD OF Groebner completions", and EXP-SEMBIN-c2c312's certificate is
    likewise a degree-4 F_2 Macaulay rank. NEITHER CONTRACT ASKS FOR A GROEBNER
    COMPLETION. A degree-D Macaulay rank over F_2 needs a Boolean system and GF(2) linear
    algebra; it does not need an F4 implementation, and F4 is what is missing.

  decision: expand

  target_ids:
    - GOAL-SEMBIN-5078bc
    - EXP-SEMBIN-c2c312
    - EXP-SEMBIN-7e1371
    - TASK-20260913-701b50

  rationale:
    - >-
      WHAT IS ACTUALLY INSTALLED, read rather than assumed. src/ic_first_fall_fast.py's
      Boolean monomial algebra is PURE PYTHON: mono_deg(mono) is len(mono), and
      multiply(monoset, mu) is a set union with mod-2 cancellation over frozensets of
      variable indices. src/macaulay_export.py's macaulay_rows builds the sparse degree-D
      F_2 Macaulay rows from those monosets and imports nothing but itertools and those
      three helpers. The sage dependency enters at exactly three places and none of them
      is the Macaulay construction: building the field and curve and performing the Weil
      descent symbolically (src/semaev_tree.py), converting a sage Boolean polynomial into
      a monoset (poly_to_monoset, which is the boundary function), and taking the rank
      (Matrix(GF(2)).rank()). A module-scope `from sage.all import GF, Matrix` then makes
      the pure-Python parts unimportable, which is why the whole file reads as blocked.
    - >-
      TWO OF THE THREE SAGE USES ARE ALREADY REPLACED IN THIS CAMPAIGN.
      experiments/EXP-SEMBIN-354a75/code/binary_field.py is a pure-Python F_{2^m} and
      F_{q^2} arithmetic with a programmatic irreducible search, built under
      TASK-20260913-4df669, and it replaces sage's field and curve construction. A rank
      over GF(2) is Gaussian elimination on Python ints used as bit-rows, which needs no
      library at all. What remains genuinely missing is ONE component: a pure-Python Weil
      descent that emits the chained S_3 system directly as monosets, so poly_to_monoset
      is not needed because no sage polynomial is ever built.
    - >-
      THE DEGREE-4 BLOCKS FIT, computed exactly rather than estimated. At every cell the
      two contracts declare -- N = n(t-2) + kt variables, cols = #monomials of degree <= 4,
      rows = n(t-1) cubic generators times #monomials of degree <= 1 -- the worst dense
      bitset footprint is 0.223 GB, at c2c312's n=12 t=6 k=2 separation cell (N=60,
      523,686 columns, 3,660 rows). Every other declared cell is between 0.001 and 0.069
      GB. Both contracts declare maximum_memory_gb: 8. The certificate is therefore not
      merely feasible, it is two orders of magnitude inside its own declared budget, and
      it needs none of the column-chunking and staircase-carry machinery
      src/h012c_block_m4ri.py was written for -- because that engine targets degree 5,
      where the same n=12 t=6 k=2 cell has 5,985,198 columns and a 76.5 GB dense
      footprint. THE DEGREE IS THE WHOLE DIFFERENCE, and both these contracts stop at 4.
    - >-
      WHY THIS IS RANKED AHEAD OF THE STANDING RANK 3. DEC-20260913-74e208 ranked
      EXP-SEMBIN-2c40bb third and it remains queued behind the concurrency cap. The
      instrument task is placed ahead of it, and the justification is that the instrument
      was not previously ranked AT ALL -- it was believed impossible on this host, so it
      never entered the comparison. Once available it dominates 2c40bb on the criterion
      this goal was opened under: 2c40bb refines a cost surface whose conclusion the
      review round already scoped, whereas the instrument converts two `approved`
      contracts on ASSUMPTION 1 -- the paper's load-bearing assumption and this
      campaign's stated central target -- from unrunnable into runnable. Nothing about
      2c40bb is deprioritised on its merits and its rank is unchanged relative to
      everything else.
    - >-
      WHAT THE SIZING DOES NOT ESTABLISH, stated so the approval is not read as more than
      it is. The XOR-traffic column (worst case 408 GB at n=12 t=6 k=2, most cells 5-50
      GB) is an OPERATION-COUNT PROXY for runtime, not a measured runtime: it counts
      row-pair XORs times row width under a rank bound, and Python's large-int XOR
      throughput on this host has not been measured. If the proxy is wrong the instrument
      task reports a resource impediment with its recheck, which is not negative evidence
      about anything (core rule 5). The sizing also computes NO RANK and asserts nothing
      about d_F4, about Assumption 1, or about any curve.

  official_transitions:
    - record: GOAL-SEMBIN-5078bc
      field: impediments
      action: narrow IMP-SEMBIN-ENGINE and add its successor
      from: >-
        IMP-SEMBIN-ENGINE, what_is_blocked: the degree lane, i.e. EXP-SEMBIN-c2c312 and
        EXP-SEMBIN-7e1371, because no Groebner engine is installed
      to: >-
        IMP-SEMBIN-ENGINE stands ONLY for work that needs a Groebner or F4 COMPLETION --
        a measured d_reg from a completed basis, a step-degree trace, anything requiring
        the algorithm Semaev's Section 4.4 describes. It no longer covers
        EXP-SEMBIN-c2c312 or EXP-SEMBIN-7e1371, whose certificates are degree-4 F_2
        Macaulay ranks. Those two are blocked instead by IMP-SEMBIN-DESCENT, a bounded
        implementation gap: no pure-Python Weil descent emitting the chained S_3 system as
        monosets. clears_when: TASK-20260913-701b50 delivers a descent that passes its
        exhaustive-enumeration correctness gate. recheck: run that task's self-test.
      asserts_nothing_about: >-
        the science. Narrowing an impediment does not make either experiment's hypothesis
        more likely, and an impediment was never evidence in either direction.

  approvals:
    - target: TASK-20260913-701b50
      what: >-
        Build and validate a pure-Python Boolean-polynomial engine for the chained S_3
        Weil descent plus a GF(2) degree-D Macaulay rank, sufficient to run
        EXP-SEMBIN-c2c312 and EXP-SEMBIN-7e1371 on this host.
      basis: >-
        Standing user authorization of 2026-09-06. Approval asserts that the task is
        scoped, budgeted and gated, NOT that either downstream experiment will confirm
        anything. The Coordinator verified the sizing independently before approving and
        retained it as an artifact.
      acceptance_gates:
        - >-
          CORRECTNESS BY EXHAUSTIVE ENUMERATION, which is the gate that matters and is
          fully available on this host. For a tiny cell, enumerate every tuple in V^t,
          decide vanishing of the chained S_3 system in F_{2^n} using
          binary_field.py, and independently evaluate the emitted Boolean monoset system
          at the corresponding F_2 assignment. The two zero sets must agree EXACTLY, tuple
          by tuple. A descent that agrees on counts but not on which tuples vanish has a
          basis or indexing bug and is not validated.
        - >-
          SHAPE, against both contracts' own declarations: n(t-1) equations in
          N = n(t-2) + kt variables, of algebraic degree exactly 3 over F_2. A mismatch is
          reported as a defect rather than absorbed.
        - >-
          FIELD EQUATIONS ARE IMPLICIT in the monoset representation, since a frozenset of
          variable indices already quotients by x^2 = x. EXP-SEMBIN-c2c312 declares
          `field_equation_convention: [explicit_generators, engine_implicit]` as a
          variable, so the engine must be able to emit the explicit generators too and the
          rank must be reported under BOTH conventions. If the two conventions disagree on
          rank, that disagreement is the finding and is reported, not reconciled.
        - >-
          RANK CROSS-CHECK against an independent implementation on the same matrix at the
          two smallest cells: a second, deliberately naive elimination written without
          reading the first. This is the blind-re-derivation discipline applied to an
          instrument, because a rank routine that is wrong is wrong self-consistently.
        - >-
          A NULL OBJECT of matched shape -- a random Boolean cubic system with the same
          equation count, variable count and monomial profile -- run through the identical
          pipeline. Any rank statistic reported for the S_3 system must be reported beside
          the null's, because a statistic that does not distinguish the structured system
          from a matched random one is measuring the shape and not the structure.
      prohibitions:
        - >-
          MEASURE NO d_reg AND NO FIRST-FALL DEGREE FROM A COMPLETION. The instrument
          computes Macaulay ranks at a fixed degree. IMP-SEMBIN-ENGINE still stands for
          everything that needs an F4 completion, and reporting a completion-derived
          degree from a rank would be a fabrication under core rule 9.
        - >-
          Do not modify src/. The installed sage-dependent modules are read-only inputs;
          the new engine is a new module under the task's own write scope, and any bug
          found in src/ is reported rather than patched.
        - >-
          Do not run either downstream experiment. This task delivers and validates an
          instrument. EXP-SEMBIN-c2c312 and EXP-SEMBIN-7e1371 are separate dispatches
          against their own frozen contracts, and running them here would produce
          evidence outside any approved protocol.

  evidence_refs:
    - coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-9d649f/coordinator-engine-sizing/size_degree4.py
    - coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-9d649f/coordinator-engine-sizing/sizing.txt
    - coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-9d649f/coordinator-engine-sizing/sizing.stderr.txt

  limitations:
    - >-
      NO EXPERIMENT BECOMES MORE LIKELY TO SUCCEED. This decision changes what is
      RUNNABLE. Whether the degree-4 Macaulay rank at Semaev's reproduction cells is
      consistent with his reported d_F4 = 4 is exactly what EXP-SEMBIN-c2c312 exists to
      find out, and this decision prejudges none of it.
    - >-
      The impediment is narrowed, not cleared. IMP-SEMBIN-ENGINE still blocks every
      degree measurement that needs an F4 completion, and its successor
      IMP-SEMBIN-DESCENT blocks the two experiments until TASK-20260913-701b50 passes its
      correctness gate. Neither impediment is evidence.
    - >-
      The sizing is a combinatorial count plus an operation-count proxy, produced by one
      Coordinator session and not independently reviewed. TASK-20260913-420226 reviews the
      instrument when it lands, and the sizing's numbers are re-derivable from the
      retained script.
    - >-
      The concurrency cap on BATCH-9d649f is raised from 2 to 3 to admit this task
      alongside the two running executors. That is machine headroom, not a research
      budget: this host has 4 CPUs with one executor pinned at 100% and 6.8 GB available,
      and the instrument's own worst declared footprint is 0.223 GB. GOAL-AES-003
      BATCH-002 (DEC-20260802-b226fb) records the cost of oversizing this, so the basis is
      written into the queue beside the number.
    - >-
      A pure-Python engine is not a substitute for the installed sage pipeline at scale.
      It is sized for degree 4 at these contracts' cells and nothing beyond; degree 5 at
      the same cells is 76.5 GB dense and remains out of reach here.

  next_actions:
    - >-
      Dispatch TASK-20260913-701b50 (executor) to build and validate the engine, with
      TASK-20260913-392dad snapshotting it and TASK-20260913-420226 reviewing it
      independently before either downstream experiment runs.
    - >-
      On a passing correctness gate, clear IMP-SEMBIN-DESCENT and dispatch
      EXP-SEMBIN-c2c312 first: it is the instrumentation experiment and its output
      calibrates 7e1371's boundary search.
    - >-
      EXP-SEMBIN-2c40bb under TASK-20260913-39f7a4 keeps its rank and runs when a slot
      frees.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Nothing here is a durable research finding. The sizing is a feasibility computation
      and the impediment narrowing is a coordination fact; neither is a claim about
      Semaev's method. A knowledge entry becomes due if the engine lands and
      EXP-SEMBIN-c2c312 produces a validated statement about the d_F4 / Macaulay-rank map,
      which is the point of that experiment and is not this decision.

  decided_by: coordinator
  decided_at: '2026-09-13'
