  context: Two archived independent implementation-admission reviews require correction. Authorize an additive protocol
    clarification and a new immutable implementation successor.
  rationale:
  - The blinded derivation exposes two possible unavailable-cell readings. Select pooled-side availability because
    it preserves the expressly frozen pooled estimator and charges every zero-yield null arm. All scientific sample
    counts and effect thresholds remain fixed.
  - Accept demonstrated implementation failures F-01 through F-05 and F-07 through F-09. Preserve and correct singular-candidate
    handling, actual known-false controls, validity reduction, canonical provenance, partial persistence, atomic
    publication and complete diagnostic custody.
  - Accept F-06 requirements for measured resources, process-group memory and bounded cancellation latency. Its
    demand to enforce historical routine wall/CPU estimates conflicts with superseding progress-first policy and
    is not adopted. The prospective amendment makes that distinction explicit.
  - Both reviewers disclosed memory-registry orientation outside their declared input list. Neither reports sibling-report
    exposure or producer-blind artifact exposure. Accept the narrow worked defects and independently stated estimator
    ambiguity, with this procedural limitation retained; no scientific promotion follows.
  - Prioritize repairing an already implemented approved calibration ahead of adding more speculative designs. Existing
    CM and Tate completion and five-amendment review continue within their own exact scopes.
