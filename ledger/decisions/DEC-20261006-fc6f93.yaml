  context: >-
    /design-experiment, one contract. IDEA-20261006-ed9a14 is on
    origin/design/ntru-bd02d9-fatigue and is not on origin/main. The
    question is RQ-TORS-8c7b79. No hypothesis or experiment on
    origin/main cites that full id. The branch design/tors-ed9a14 was
    created from origin/main at
    9c2bc35e93f0c2f83026c8e351c621f623bdfb90 and git merge origin/main
    reported already up to date.

    The contract freezes p=751, the curve y^2 = x^3 + x + 1, the
    generator (0, 1) of order 727, two samples of 200, and the
    SHA-256 rejection sampler. The pre-registered prediction is an
    agreement count within 12 of 100 on both samples, with each sign
    at least 20 times. A finished pair of counts both at least 140,
    with the instrument gates passing, is a negative. No sample was
    drawn in this session. The session counted #E = 727, built the
    degree-12 polynomial, and factored it into six irreducible
    quadratics.

    This session opened KR-RHO-13bf67, KR-RHO-53c89f, and
    KR-IC-955fd6. Those rows are the generic floor, the pairing
    scope limit, and an adjacent torsion-decomposition row. They are
    not the 0.06 band.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. Success is
    the band together with the sign floor, and it fails when both
    finished counts are at least 140 against quiet instrument gates.
    No field required for approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading are fixed before any executor run.
    - An agreement count of 140 on both samples is reachable as a recorded outcome, so success is not automatic.
    - The planted carrier and the curve-only factor multiset are the same-shape instrument controls.
    - A sign count below 20 is a second finished negative from the proposal.
    - This session did not draw the 200 scalars and did not claim that the exponent moves.

  evidence_refs: []
  limitations:
    - The measurement covers one pin at p=751 and one polynomial. It does not transfer to cryptographic primes or to other division polynomials.
    - An agreement rate inside the band does not prove independence from k.
    - A vanished symbol or a broken carrier is an instrument failure and is not an agreement-rate result.
    - A distinguished-point rho cap hit is incomplete as a cost control and is not a mathematical negative about the symbol.
    - This decision authorizes a later execution. It does not start one.
    - This decision does not edit a goal head.

  next_actions:
