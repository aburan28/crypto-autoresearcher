  rationale:
    - >-
      ECC FIRST (CLAUDE.md rule 11). RQ-ECDLP-f0a7b0 is the ECC question of a
      round whose DESIGN-BRIEF records its ECC classification from
      tools/ecc_priority.py; this subagent did not rerun the tool. The idea is an
      open ECC idea (proposed, no hypothesis or experiment citing it before
      this record) and open ECC ideas are ranked work to be designed into
      experiments.
    - >-
      EXPONENT-TARGETING (docs/target-result-profile.md; agents/coordinator.md).
      The idea is the only proposal of the round whose positive outcome would
      move a per-attempt EXPONENT, conditional on a numbered heuristic (H2). The
      pairing duty is met: Stage 1 IS the heuristic-validation experiment for H2
      and H1; H3's validation (and the proof-of-concept wrapper) is Stage 2,
      designed after Stage 1, named in the contract and not approved here.
    - >-
      PROOF-SEARCH-MAP GATE (KN-TECH-080; agents/coordinator.md). The four
      audits were re-checked (coordination/design/TASK-20261002-420186/
      proof-search-map-audit.yaml): baseline embedding strengthened (builder
      equivalence added to C-BASE), observation collision attacked (verified
      certificates on both sides, null, planted, easy), quantifier order and
      method ceiling carried. One gap was found in the idea's exponent
      bookkeeping (see key_finding) and is recorded as an interpretation limit,
      not as a failed audit of the Stage-1 measurement.
    - >-
      DECISIVE AND CHEAP. Stage 0 is a zero-run note. Stage 1 on two cells reuses
      a pinned, certified engine (generic in (nv, D, neq)) and needs no solver.
      (23,8) is the generic-by-counting cell and gate G1; (35,12) is the first
      cell where degree 4 is not generic (10535 rows < 12951 columns). It
      discriminates E-DRIFT / E-DECAY (negative, closes the bounded-degree
      inner-theory route on this ray with a measured rung-versus-cell table)
      from E-BOUNDED-PARTIAL (positive, necessary not sufficient).
    - >-
      CERTIFICATE DISCIPLINE FROM THE CERTIFIED FINDINGS. KN-FIND-5a8d3e
      section 3 shows flat (mu, k) certificates do not certify W_4 membership;
      the contract therefore counts a W_D refutation only with a verified
      degree-disciplined wdag-v1 and an adverse non-refutation only with an
      ann-v1 annihilator certificate (or by the worst-case rule). This supplies
      the strongest checkable refutation artifact for the adverse transition
      (docs/claims-and-verification.md, Refutation artifacts) BEFORE any decision
      that would rely on it. A single unreplicated empirical-only run can never
      support reject_scoped (stated in the contract).
    - >-
      SCOPE GATE OF THE QUESTION. RQ-ECDLP-f0a7b0 scopes executable falsification
      to toy instances (typical l in 6..9) and larger parameters only after a
      toy-scale instrument-validity gate. (35,12) has l = 12; it is therefore run
      only after gate G1 (C-GATE) passes on (23,8).
    - >-
      DISPATCHER SCOPE FOLLOWED, GAP RECORDED. The dispatcher bounded Stage 1 to
      (23,8) and (35,12). The idea's full E-BOUNDED row needs (41,14), so the
      approved cells can issue E-BOUNDED-PARTIAL, E-DRIFT-SUPPORTED, E-DECAY,
      INTERMEDIATE, NOT-DISCRIMINATING or ARTIFACT, not the full E-BOUNDED row.
      This is stated in the contract rather than hidden; widening to (29,10) and
      (41,14) is an additive amendment and is flagged as an open item. (41,14)
      also cannot run under the 3 GB cap with the pinned engine as it stands
      (mask2col 2 GiB at nv = 28, derived), which is an amendment matter.
    - >-
      PARETO HONESTY. dominated_by: rho at 0.886 x 2^{n/2} on the ECDLP; at toy
      scale the loop dominates the pipeline by orders of magnitude; the idea's
      conditional new row ties the pair table's time at poly memory and stays
      above rho. sota_delta is zero on every ECDLP axis and nothing in Stage 0-1
      measures a cost delta. No exponent claim is made or tested.
    - >-
      RESEARCH-DIRECTION INTEGRITY. The candidate is pursued in good faith: it is
      designed and approved, not deprioritized, and the narrowing to two cells is
      the dispatcher's recorded scope with the extension and its revisit
      condition (a Coordinator decision after the run, or earlier on request)
      stated, not a steer away from the lead.

  key_finding:
    title: >-
      RATE IS NOT EXPONENT: the idea's E-BOUNDED threshold (rate >= 0.90) does not
      carry the idea's exponent claim.
    derivation: >-
      The idea's own per-attempt cost is 2^l (c_group + C_W) + (1 - r_D) 2^l 2^l
      c_A. The second term is (1 - r_D) 2^{2l} c_A, so the exponent
      l + O(log l) requires (1 - r_D) <= poly(l) 2^{-l} (or a bounded-degree
      fallback refuting the remainder at polynomial cost); a constant non-refuted
      fraction leaves the exponent at 2 l with a constant-factor gain. The idea
      says 'if r_D is near 1' without this tail.
    consequence_for_this_design: >-
      No threshold of the idea is changed. The tail is recorded as the derived
      HEUR-ECDLP-1f1111-H2-TAIL (not testable at 60 instances per cell;
      95 percent exclusion of a non-refuted fraction 2^{-l} needs about 3 x 2^l
      zero-failure samples: 768 at l = 8, 12288 at l = 12, derived, recomputed in
      Stage 0) and as the interpretation limit RATE IS NOT EXPONENT. A positive
      Stage-1 outcome is necessary, not sufficient, for the exponent. A tail test
      is named as a candidate follow-up and is not designed or approved here.
    disposition: >-
      Reported to the dispatcher and recorded here; the idea record is immutable
      and is not edited.

