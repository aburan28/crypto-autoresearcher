coordinator_decision:
  id: DEC-20260806-cf5102
  decided_by: coordinator
  decided_at: '2026-08-06'
  decision: refine
  target_ids:
  - GOAL-HQC-001
  - EXP-HQC-982268
  - H-HQC-18d1b4
  - EV-HQC-9a30d3
  context: "BATCH-558f5b dispatched DEC-20260806-46a8f3's next_action -- a V2 planted-correlation control
    arm for EXP-HQC-982268 that closes the two gaps the Red Team found in the V1 arm (BATCH-4b8ad3):
    import the real decode_blocks instead of a hand-rolled majority threshold, and use heterogeneous,
    boundary-adjacent planted content instead of homogeneous blocks. TASK-20260806-047535 built and ran
    it; TASK-20260806-883308 snapshotted it before either review; TASK-20260806-01a340 (Validator) and
    TASK-20260806-ae74c4 (Red Team) reviewed it independently and in parallel. This decision closes the
    batch on their reports plus EV-HQC-9a30d3."
  rationale:
  - 'BOTH NAMED GAPS AGAINST V1 WERE ADDRESSED, ONE FULLY AND ONE PARTIALLY, AND BOTH REVIEWERS AGREE
    WITHOUT CONFERRING. decode_blocks is now genuinely, verifiably called unmodified -- V1 never invoked
    it at all. The heterogeneous-content requirement is met in the sense that two distinct, verified,
    near-boundary templates replace homogeneous all-0/all-1 blocks, and the Red Team confirms this is
    enough to retire V1''s strongest finding: boundary/index-shift defects are no longer structurally,
    mathematically invisible. Every injected V1/V3-class variant produced a 90-to-13,000-jackknife-SE
    deviation in the actual estimator statistic, not merely a self-check firing, at every tested block
    position.'
  - 'BUT THE RED TEAM''S QUANTIFIED RESIDUAL IS DECISIVE FOR THE DISPOSITION, AND IT OVERRIDES A NAIVE
    READING OF THE CLEAN 17/17 MATCH. The demonstrated 100 percent detection is an artifact of a
    deliberately hand-searched worst-case template pair, not a property of realistic content. An
    independent measurement on Bernoulli(0.35) content -- design.md''s own stated proxy for realistic
    crypto-like noise -- finds a natural single-position flip rate of only ~8.8 percent, roughly 5 to 11x
    lower. Because the construction uses exactly two fixed templates chosen specifically because a
    perturbation guarantees their flip, it can only ever express {0 percent, 100 percent} at the
    population level and cannot, even in principle, measure a calibrated detection rate.'
  - 'THIS IS PROGRESS, HONESTLY SCOPED AS PARTIAL, NOT FULL, CLOSURE. Both the Validator (independently:
    "PARTIALLY CLOSES") and the Red Team (independently: "PARTIALLY CLOSED") converge on the same
    disposition through different arguments -- the Validator emphasizing the untested detection rate and
    the unexercised cryptographic sampler, the Red Team additionally quantifying the ~8.8 percent natural
    baseline and the structural {0,100} percent ceiling of a two-template design. OPEN-6''s actual
    question -- whether PS-R3''s -244.1-to--32.4 null-SD signal (EV-HQC-b71230) could be explained by an
    undetected subtle sampler bug in the real pipeline -- is not answered by a worst-case demonstration
    5 to 11x more sensitive than realistic content.'
  - THE T-REDUCTION (1e7 TO 1e6) DID NOT WEAKEN ANY FINDING HERE, PER THE RED TEAM''S OWN CHECK -- every
    injected defect''s deviation remains far outside a 3-SE band even at the sqrt(10)-narrower SE a
    T=1e7 run would give. This is because the tested defects are large relative to this arm''s own noise
    floor, not because T=1e6 is adequate in general; a smaller defect, more representative of the ~8.8
    percent natural regime, could sit closer to the detectability boundary where the T-cut matters more.
  - 'A GENUINE SECOND-ORDER FINDING, NAMED SO IT IS NOT LOST: this arm''s own jackknife SE is
    artificially tiny relative to PS-R3''s real noise floor, because its planted S_t support is only
    {17,18,19} versus PS-R3''s near-binomial spread over {0,...,56}. The thousands-of-SE margins observed
    here do not directly transfer to PS-R3''s actual detectability threshold for the same absolute
    defect.'
  evidence_refs:
  - EV-HQC-9a30d3
  - EV-HQC-db1fd9
  - EV-HQC-b71230
  - coordination/goals/GOAL-HQC-001/batches/BATCH-558f5b/reviews/TASK-20260806-01a340/validation_report.yaml
  - coordination/goals/GOAL-HQC-001/batches/BATCH-558f5b/reviews/TASK-20260806-ae74c4/red_team_report.md
  - coordination/goals/GOAL-HQC-001/batches/BATCH-558f5b/tasks/TASK-20260806-047535/design.md
  limitations:
  - NO statement about HQC, its decoding-failure rate, assumption A17 or A5, or any standardized
    parameter set. Claim tier stays toy.
  - H-HQC-18d1b4 UNCHANGED at proposed. This batch ran no measurement of HQC.
  - experiments/EXP-HQC-982268/specification.yaml is not amended by this decision.
  - None of the four asymptotic-complexity promotion gates is engaged; none is claimed.
  - The real (T)-sampler (CTRStream, fixed_weight_support, ring arithmetic) remains entirely unexercised
    across both control-arm attempts to date.
  knowledge_promotion:
    promoted: []
    not_warranted: 'A candidate methodological lesson is now visible across two campaign batches: a
      two-fixed-template planted-arm design can only ever demonstrate {0 percent, 100 percent} detection
      at the population level, never a calibrated rate, regardless of how carefully the templates are
      chosen. This is close to KN-TECH-worthy but held until the V3 heterogeneous-ensemble arm confirms
      it by contrast -- promoting from one demonstrated instance risks the same premature-generalization
      failure this program''s own inventor protocol warns against. No KN-FIND: nothing was measured about
      HQC this batch.'
  next_actions:
  - 'Dispatch a V3 planted-correlation control arm, the convergent next concrete action named by both
    reviewers independently: replace the two fixed templates with a genuinely heterogeneous per-position,
    per-trial content ensemble (e.g. Bernoulli(0.35)-style content, filtered only on matching the planted
    decode label, so S_t''s marginal law stays exactly as closed-form as V1''s and V2''s), so an injected
    boundary-shift defect''s detection RATE -- not merely its possibility -- can be measured and compared
    quantitatively against the ~8.8 percent natural flip-rate baseline EV-HQC-9a30d3 establishes. This is
    the missing ingredient for turning "detection is possible" into "detection occurs with probability
    p," the quantity OPEN-6 actually needs.'
  - 'Once a V3 arm measures a real detection rate (whether high or low), the Coordinator must confront
    the harder question directly rather than deferring again: does ANY control-arm design that never runs
    the real cryptographic sampler (CTRStream / fixed_weight_support / ring arithmetic) have a ceiling on
    how much it can ever say about OPEN-6? If so, name that ceiling explicitly rather than dispatching a
    V4.'
  - 'Only after OPEN-6 is closed, meaningfully narrowed, or explicitly ceilinged should the remaining
    resume-plan items from DEC-20260806-2947ba be attempted: the missing extrapolation to standardized
    parameters, PS-R3''s second independent reviewer, and the remaining named harness repairs.'
  - 'Carry forward, lower priority: the unreconciled run-count discrepancy from the V1 arm (BATCH-4b8ad3)
    remains unresolved and un-worsened by this batch.'
