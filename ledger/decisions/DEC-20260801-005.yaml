    intermediate bounded by D = 2^40, a factor of 2^20 apart. So the heuristic's own
    validation experiment has never been run on the object the heuristic is about,
    and that is the single largest information deficit in this lane. It is also the
    action the program's own direction rules favour - a heuristic-validation
    experiment that samples the relevant distribution, compares against the predicted
