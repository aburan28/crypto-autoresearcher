  decision: weaken
  decision_label: >-
    weaken_scoped_to_the_structure_attribution_only__artifact_confirmed_on_the_instrument__mechanism_still_unexercised
  decision_vocabulary_note: >-
    `weaken` is the disposition the frozen D-1 branch assigns and is one of the
    template's enumerated values. Its OBJECT is the interpretive claim attached to
    R, not the mechanism; the scope travels in decision_scope below, in the
    hypothesis record's status_scope block, and in EV-DS-004.

  decision_scope: >-
    The official status of RUN-DS-001-ctrl-matched-null is an ADMISSIBLE toy-tier,
    empirical_only control receipt that fires the pre-registered D-1a branch. IT
    ASSERTS - that at this cell the claim that the measured R evidences Semaev or
    multihomogeneous structure has lost its support, the split arm's advantage being
    reattributed to generic meet-in-the-middle worth about |signed|/2 in enumerations
    and available on any abelian group with any factor base; and consequently that
    the BATCH-020 R_null = 111.4 licenses no structure reading. IT DOES NOT ASSERT -
    that the mechanism fails, that the smoothness claw does not work, that H-DS-001
    is refuted as mathematics, that HEUR-DS-1 is validated or refuted, that S1_met,
    F1_met or structure_gate_passed hold, or that this lane is closed. THE HONEST
    ONE-LINE SUMMARY OF BATCH-021 IS THAT THE INSTRUMENT, NOT THE HYPOTHESIS, HAS
    BEEN REFUTED. H-IC-001 and H-STR-002 are unchanged. EV-DS-001, EV-DS-002 and
    EV-DS-003 stand exactly as archived and are not re-scored; only the FORWARD
    READING of EV-DS-003's null axis is superseded, by EV-DS-004.

  central_adjudication: >-
    BATCH-021 ADDED AN OBJECT, NOT A MECHANISM. The frozen branch fires and is
    applied, and the generic-meet-in-the-middle reattribution moves from ARGUED to
    MEASURED on a second object with 400 independently re-verified certificates on
    that object. But the number that fires the branch is, on one limb, a closed form
    in the protocol's own matched parameters and, on the other, a measurement of
    Python arithmetic cost - so the confirmation is weaker than D-1a's "the strongest
    form of the artifact finding" language suggests. smoothness_abort is false and
    encode_intermediate is the identity on BOTH objects, so is_B_smooth has still
    never been called anywhere in this series, and the only curve-specific structure
    this instrument touches at all is x(P) = x(-P) - worth a factor 2 in table keys
    and approximately zero in enumerations. The correct response to an instrument
    that cannot see the quantity in question remains to fix the instrument, not to
    score the hypothesis; the weaken is bookkeeping that brings a status field into
    line with what DEC-20260801-003 already said in prose about the INTERPRETIVE
    claim, and nothing more.

  weighing_of_the_red_team_recommendation: >-
    RT-20260801-008 recommends D-1a with a SCOPED `weakened`, and it explicitly
    CONSIDERED AND REJECTED the narrower disposition of leaving H-DS-001 at
    `analyzed` and weakening only the evidence reading, on the ground that declining
    a pre-registered adverse branch after seeing the number is the mirror image of
    the sin pre-registration exists to prevent. THE COORDINATOR CONCURS, ON THE
    MERITS AND ON INDEPENDENT RE-DERIVATION RATHER THAN DEFERENCE, AND STATES THEM.
    (1) I recomputed the load-bearing arithmetic myself from the committed blobs.
    51703/3508544 = 0.014736312270845113 and 47852/3265770 = 0.014652593415947848
    reproduce the reported U figures exactly, so U IS the enumeration-count ratio;
    2/(|signed|+1) = 2/129 = 0.015504 contains no object and both observations sit
    about 5 percent below it in common mode, which is why the ratio of ratios is
    1.0057. 200 x C(129,2) = 1,651,200 against 3,508,544 gives the U <= 0.4706
    ceiling, so D-2's U conjunct was unreachable. The per-enumeration walls
    5.687e-07, 1.821e-06, 1.345e-06 and 2.857e-06 give the 2.366x naive and 1.569x
    split object-cost ratios from which the two-parameter model predicts 0.6633
    against an observed 0.6595. These are arithmetic, not rhetoric.
    (2) ON THE NARROWER DISPOSITION, I AGREE WITH THE RED TEAM AND SAY WHY. A map was
    frozen and hash-bound before any data existed; its adverse branch was the one its
    own author predicted; its favourable branch was deliberately built to be
    non-promoting; an independent session reviewed it adversarially and passed it;
    and the run landed squarely inside a stated condition. Declining that branch now,
    on the ground that the confirmation turned out weaker than its own language
    claimed, would teach this program that pre-registration is optional whenever the
    result is uncomfortable - and it would do so in the batch whose entire point was
    pre-registration. The right response to a map whose favourable branch was
    unattainable is to RECORD THAT DEFECT AND BIND THE SUCCESSOR PROTOCOL TO CHECK
    BAND ATTAINABILITY, which this decision does, not to decline the branch that did
    fire. Note also that the narrower disposition would not have been more
    conservative in any direction that matters: the substance of `weakened` here is
    identical to what EV-DS-004 records either way, and the only difference is
    whether the hypothesis's status field carries it. A status field that disagrees
    with the evidence record is not caution; it is drift.
    (3) BOTH OF THE RED TEAM'S ATTACHED CONDITIONS ARE ADOPTED AS MANDATORY AND ARE
    DISCHARGED IN THIS SAME COMMIT. See conditions_discharged below.
    (4) WHERE I GO BEYOND THE RECOMMENDATION - the Red Team's own primary finding,
    that this is "the instrument never tested structure on either object" rather than
    "the win is generic", is elevated in EV-DS-004 to the record's CHARACTERIZATION
    (artifact_confirmed_on_the_instrument / mechanism_still_unexercised) rather than
    left as commentary, and the two-proxy disclosure is explicitly down-weighted in
    the evidence record rather than only in the objections. A weaken written up as if
    both proxies independently confirmed the transfer would be an overclaim in the
    adverse direction, which is the direction this batch is prone to overstate.
    (5) The execution quality of this package is high and its repairs are real
    (RT048-M2). Nothing here is a failed run and it is not written up as one.

  conditions_discharged:
    condition_1_scope_travels_in_the_hypothesis_record:
      requirement: >-
        RT048-B5 - a bare `weakened` status field is unscoped by construction,
        because successors read the field and not the branch text. The same ledger
        commit must add a `status_scope` block to ledger/hypotheses/H-DS-001.yaml
        reproducing D-1's scope verbatim, and must preserve and re-affirm
        `mechanism_test_status.exercised: false` naming BATCH-021.
      discharged: true
      how: >-
        H-DS-001 now carries a `status_scope` block quoting D-1's
        hypothesis_status_transition and reattribution text verbatim, an explicit
        list of what the status does and does not assert, and
        `mechanism_test_status.exercised: false` preserved unchanged with a
        BATCH-021 re-affirmation sub-block recording that all six arms ran with
        smoothness_abort false, that is_B_smooth was never called, that
        encode_intermediate is the identity on both objects and that the join is
        exact group equality.
    condition_2_the_falsifier_must_be_named_honestly:
      requirement: >-
        RT048-B4 - either the decision says a SUBSTITUTED SURROGATE of falsification
        condition 2 fired, or the same commit amends H-DS-001's null_object field by
        a superseding record. The unqualified sentence is not available.
      discharged: true
      how: >-
        BOTH ROUTES ARE TAKEN, deliberately, so that neither a decision reader nor a
        hypothesis reader can miss it. THE STATEMENT OF RECORD IS - A SUBSTITUTED
        MATCHED-NULL SURROGATE OF H-DS-001 FALSIFICATION CONDITION 2 FIRED, THE NULL
        OBJECT NAMED IN THE HYPOTHESIS
        (random_multihomogeneous_matched_multidegree) HAVING BEEN DECLARED UNFIT BY
        RT047-B2 AND REPLACED BY NULL-DS-ADDITIVE-Z753848 UNDER
        CTRL-RT047-MATCHED-NULL. In addition, H-DS-001 now carries a
        `test_boundary_amendments` block recording NULL-DS-ADDITIVE-Z753848 as the
        OPERATIVE matched null for all future structure-dependence readings in this
        lane, with RT-20260731-047, CTRL-RT047-MATCHED-NULL and RT048-B4 as the
        basis. The original test_boundary field is PRESERVED VERBATIM and annotated,
        not overwritten, per AGENTS.md rule 4 - the discrepancy is recorded, never
        silent, and never repaired by an edit that hides it.
      note_on_def_3: >-
        Recorded because symmetric honesty requires stating what came out in the
        adverse reading's favour. Reviewer defect DEF-3's omitted conjunct is
        R_real < 0.5, and it IS SATISFIED ON THIS DATA - the live re-measure gives
        0.031116 wall and 0.014653 units, as does the archived BATCH-020 anchor. The
        D-1 weaken does not rest on a false premise in that respect.

  refutation_artifact:
    required_by: CTRL-RT047-MATCHED-NULL.disposition_map.D-1.refutation_artifact_required
    tier_achieved: 1 (counterexample certificate), with a tier-2 derivation alongside
    artifact: >-
      The 400 matched-null relation certificates on NULL-DS-ADDITIVE-Z753848 (200 on
      matched_null_naive, 200 on matched_null_split), each carrying its signed
      factor-base indices, independently re-verified by VAL-20260801-002 with its own
      plain-integer arithmetic mod N rebuilt from the certificate alone, checking
      kind, modulus 753848, additive law, arity exactly 4, summand membership in a
      factor base the Validator regenerated itself from seed 101, and
      sum(summands) mod N equal to the recorded target, with 200 distinct targets per
      arm. These ARE the RT047 counterexample construction executed and verified.
    archived_before_this_decision: true
    archival_basis: >-
      They live inside snapshot c781a2e7bb740f58dbf3e4c7773c143c3b910642, created by
      TASK-20260801-006 before either review and before this decision, satisfying the
      docs/claims-and-verification.md requirement that the artifact be archived in or
      before the ledger commit that relies on it. No derivation-note or empirical_only
      fallback was needed for the refutation artifact, although the EVIDENCE RECORD's
      own basis for the measurement remains declared `empirical_only`.
    accompanying_derivation: >-
      RT048-B1's constant-charge identity (U is exactly the enumeration-count ratio
      with object-free expectation 2/129) and RT048-B2's C(129,2) enumeration cap
      (U <= 0.4706 for any succeeding split arm) are checkable arguments about the
      INSTRUMENT, archived in the red-team report committed in this same ledger
      commit. They are labelled `derivation`, never "proved", and they license no
      adverse transition about the MECHANISM.

  hypothesis_status_transition:
    hypothesis_id: H-DS-001
    from: analyzed
    to: weakened
    changed: true
    scoped: true
    scope_location: ledger/hypotheses/H-DS-001.yaml status_scope, written in this same ledger commit
    reason: >-
      The pre-registered D-1a branch fired on its stated condition against an
      ADMISSIBLE run with no D-5 guard triggered, and D-1 assigns
      "analyzed -> weakened, SCOPED EXACTLY to the claim that the measured R
      evidences Semaev/multihomogeneous structure". The weaken attaches to that
      interpretive claim ALONE. It is NOT a finding that the mechanism fails,
      because the mechanism was never exercised - smoothness_abort has been false on
      every real arm in the series, is_B_smooth has never been called, and BATCH-021
      re-confirms all of that on BOTH objects. What changed relative to
      DEC-20260801-003 finding (iii) is NOTHING ABOUT THE MECHANISM'S TEST STATUS -
      only that the artifact reading moved from argued to measured on a second
      object. Successors reading the status field must read status_scope with it.
    what_it_does_not_license: >-
      No `rejected`, no lane closure, no impossibility claim, no statement that
      H-DS-001 is refuted as mathematics, no HEUR-DS-1 disposition, and no
      re-opening or re-scoring of H-IC-001 or H-STR-002.

  forbidden_dispositions_on_this_set:
    - reject_scoped, and in particular reject_scoped-as-impossibility, on a single unreplicated empirical_only run
    - any closure of the EXP-DS-001 lane or of SG-ECDLP-001
    - any statement that H-DS-001 is refuted as mathematics rather than as measured by this instrument
    - any rescue of the BATCH-020 R or R_null as evidence of structure
    - support for H-DS-001, or S1_met, F1_met or structure_gate_passed under any reading
    - HEUR-DS-1 validation or refutation
    - any asymptotic or crypto-scale claim, or any affected-scheme scope statement
    - any movement of asymptotic promotion gates G1-G4
    - dominated_by null anywhere downstream of this record
    - any change to H-IC-001 or H-STR-002

  r1_adjudication:
    override_fires: true
    fired_branch: F2
    official_S1_met: false
    official_F1_met: false
    official_F2_met: true
    binding: true
    qualifiers_that_travel_with_it: >-
      F2 fired for the first time in the EXP-DS-001 series (f2_eligible was 0 across
      54 cells per RT038-B3), against a SUBSTITUTED matched-null surrogate
      (RT048-B4), on a proxy pair one limb of which is a closed form whose adverse
      landing was entailed by construction (RT048-B1, RT048-B2). F2 is the label for
      "the apparent gain is an engine artifact" and carries no mechanism content.

  asymptotic_promotion_gates:
    status_all: OPEN
    note: >-
      G1-G4 all remain OPEN and nothing in this package moves them; no assembled
      exponent is computed anywhere. Two implicit unnumbered heuristics remain
      unrepaired and are named for future numbering - "the wall-clock ratio on this
      host is a faithful proxy for algebraic cost" (RT047-H4 / RT048-H3, falsified a
      second time and more cleanly by the object-cost recovery) and "the two cost
      proxies are independent confirmations" (RT048-H4, false and quantitatively so).

  rationale:
    - >-
      VALIDITY BEFORE INTERPRETATION. The run set was checked first - six arms of an
      expected six, schema-complete manifest with command, revision, dirty state and
      reason, seven enumerated randomness sources under seed 101 with both stream
      hashes regenerating in an independent session, raw and summary agreement across
      six artifacts with no summary figure absent from the raw record, and control
      comparability established by an amortization parity that is EVIDENCED by an
      integer build count rather than inferred. Only then was the map applied.
    - >-
      THE BRANCH IS APPLIED AS FROZEN, NOT RELITIGATED. W and U are both LOW and both
      within a factor of 2 of the live re-measure, so D-1a fires on its stated
      condition. The map was hash-bound before its data and no threshold, band or
      reading was altered after the fact.
    - >-
      THE CONFIRMATION IS RECORDED AT ITS TRUE STRENGTH, WHICH IS LOWER THAN D-1a's
      OWN LANGUAGE. One limb is object-free by construction; the other is object
      arithmetic cost recovered to 0.6 percent; and the favourable branch could not
      have fired at these parameters. All three are recorded in EV-DS-004 rather than
      smoothed over.
    - >-
      NO ADVERSE FINDING ABOUT THE MECHANISM IS TAKEN, because none is available. The
      smoothness claw has never executed in this series. Premature closure is a
      failure mode symmetric with overclaiming (inventor-protocol section 4), and a
      reject_scoped on a single unreplicated empirical_only run is forbidden outright.
    - >-
      THE SUCCESSOR IS AIMED AT THE MECHANISM RATHER THAN AT ANOTHER R MEASUREMENT.
      Every remaining R figure in this lane is predicted in closed form until the
      backend changes, so the highest-information experiment available is the one
      that touches the smoothness mechanism for the first time.

  limitations:
    - Single unreplicated empirical_only control at one toy cell, one seed, one host; no replication is claimed and none exists.
    - >-
      Toy tier. p = 752627 is the 20-bit FIELD; the prime-order subgroup is n = 241,
      about 7.9 bits (RT047-B5). Any prose saying "at 20 bits" must say which 20 bits.
    - >-
      R is a wall ratio of Python procedures and the charged-unit ledger is a
      candidate counter, not an operation count. They are not independent - U is an
      algebraic function of the enumeration counts alone (DEF-V2, RT048-B1).
    - >-
      The pre-registered map's favourable branch was unattainable on its U limb at
      these parameters (RT048-B2). Recorded, not repaired, and binding on the
      successor protocol.
    - >-
      At least three non-structural channels can move R_matched_null relative to
      R_real - the AN-2 key-collapse asymmetry (sign known, downward, about 1 percent),
      the AN-4 factor-base-policy confound, and object-cost parity, which is recovered
      for THIS CELL ONLY from the run's own numbers.
    - Bootstrap intervals are anticonservative by construction (overhead added unresampled); immaterial here, material at any near-threshold cell.
    - Host independence is untested; the Validator's reproduction ran on the same host.
    - CTRL-RT025-PLANT-LIVE remains UNDISCHARGED and the plant detector still has no measured specificity.
    - >-
      Inference fallback - requested coordinator-orchestration-code, resolved
      claude-opus-5, model_verified false. The Validator and Red Team sessions
      likewise recorded fallback_used true against review-adversarial, so both
      independent reviews of this batch ran on the same model family as this
      Coordinator. That is a real independence limitation of this harness and it is
      recorded rather than glossed.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED, WITH A CONCRETE REASON, AND EXACTLY AS THE FROZEN MAP
      PRE-REGISTERED (D-1.knowledge_promotion_expectation). THE GATE FAILS ON BOTH
      LEGS. LEG ONE - the promotion gate fires on a `support` or `reject_scoped`
      decision; this decision is `weaken`, which is neither, and `reject_scoped` is
      forbidden here outright. LEG TWO - the gate requires `replicated` or `strong`
      evidence, proven boundaries included; EV-DS-004 carries
      `strength: preliminary` on ONE unreplicated execution at one cell on one host,
      so `replicated` and `strong` are unavailable by construction. Pre-registering
      this expectation before the run is what prevents a post-hoc promotion now.
    candidate_lesson_recorded_not_promoted: >-
      A CONTROL WHOSE DECISION VARIABLE IS A CLOSED FORM IN THE PROTOCOL'S OWN
      MATCHED PARAMETERS CANNOT DISCRIMINATE THE OBJECTS IT COMPARES; CHECK THE
      ATTAINABILITY OF EVERY BAND IN A PRE-REGISTERED MAP BEFORE FREEZING IT.
      Banked as the standing KN-FIND candidate for this lane, superseding the weaker
      BATCH-020 candidate recorded in DEC-20260801-003.knowledge_promotion (the
      unmatched-null 111x lesson), which it subsumes.
    why_withheld_rather_than_promoted_now: >-
      JUDGED EXPLICITLY, NOT DEFERRED BY HABIT, BECAUSE THE LESSON IS UNUSUALLY
      STRONG FOR A CANDIDATE. Three things count IN FAVOUR of promoting it now: its
      load-bearing content is a DERIVATION, not a measurement - the constant
      40-unit charge and the C(129,2) enumeration cap are algebraic facts about
      committed code, checkable by an independent reader in minutes; it was reached
      INDEPENDENTLY BY TWO SESSIONS in this batch (Validator DEF-V2 on the closed
      form, Red Team RT048-B1/B2 on the closed form and on band unattainability);
      and it is a METHODOLOGICAL finding about experiment design, whose value does
      not depend on the ECDLP content of this lane. Four things count AGAINST, and
      they prevail. (i) THE GATE IS THE GATE. It fails on both legs, and the gate is
      not a heuristic to be balanced against the merits of a particular item -
      loosening it for an item I find persuasive is exactly how promotion standards
      erode. (ii) THE LESSON MAKES A LIVE, CHEAP, FALSIFIABLE PREDICTION THAT HAS
      NOT BEEN CHECKED. If U is truly the closed form 2/(|signed|+1), then
      U(B=128)/U(B=64) = 0.5017 on both objects; RT048-CTRL-3's two-point mutation
      tests that in under two minutes. Curating a claim about closed-form
