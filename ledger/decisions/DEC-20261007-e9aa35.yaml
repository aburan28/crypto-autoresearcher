  context: >-
    Authorize exactly one frozen, non-scientific Role-1 preflight for the P-192
    weighted-CM protocol under the standing user authorization, without
    authorizing a scientific search or any later role.
  decision: approve
  target_ids:
    - EXP-SCURVE-1a8daf
  rationale:
    - >-
      The frozen Role-1 interface, immutable manifest, exact source commits,
      clean native checkout, release executable bytes, and fresh canonical run
      path are closed before dispatch.
    - >-
      The composite supervisor admits one producer invocation followed by an
      isolated verifier and preserves the dependency audit and canonical
      custody artifacts without permitting runtime commit overrides.
    - >-
      This decision exercises only the reference/control preflight and cannot
      create or record scientific weighted-CM search evidence.
  evidence_refs:
    - experiments/EXP-SCURVE-1a8daf/amendments/v2_addendum_role1_interface.yaml
    - research/p192-weighted-cm-20261007-v2-role1-interface/SHA256SUMS
  limitations:
    - >-
      This authorization is non-scientific only: it covers one Role-1
      preflight, produces no scientific result, and establishes no P-192
      weakness.
    - >-
      Execution assumes a trusted local host and exclusive workspace custody
      for the admitted checkouts, binaries, and fresh run directory.
    - >-
      Pre-main dynamic-loader behavior and kernel compromise are outside the
      attested boundary.
    - >-
      Coordinator authenticity is governance-based and is not
      cryptographically signed.
    - >-
      Binary hashes bind the exact admitted executable bytes but do not
      serialize the compiler or toolchain.
    - >-
      No scientific search, retry, resume, result recording, or advance to a
      later role is authorized.
  next_actions:
    - >-
      Commit this decision as a fresh regular blob, then run the closed
      pre-dispatch checker once against that exact decision commit.
    - >-
      If admission passes, invoke only the exact bound supervisor argv and
      retain the resulting non-scientific custody artifacts for post-run
      validation.
