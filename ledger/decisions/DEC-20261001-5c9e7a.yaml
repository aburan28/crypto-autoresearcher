  # ---------------------------------------------------------------------------
  # Composition. Each reviewer owns one joint; none of their verdicts is a vote.
  # ---------------------------------------------------------------------------
  composition:
    - joint: J1 -- cost-model algebra
      owner: TASK-20260928-a1c7e5
      report: coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20260928-a1c7e5/validation_report.yaml
      verdict: breaks
      receipt_verdict: failed
      load_bearing_finding: >-
        The MITM_CAPPED oracle probes a target-independent table of |F|^s = 2^(sd)
        entries that is never charged. Writing it costs at least 2^(sd)
        operations, so true stage-1 time is max(|F|^s, m! N |F|^(1-s)). The
        product "relations x trials x oracle" is self-consistent only while the
        number of oracle calls is at least 1; at the run's own ECC2K-130 cell
        (n 131, m 8, d 26.7, s 4) it is 2^-42.6 and the closed form understates
        the total by 42.6 bits (reported 2^64.20; lower bound 2^106.8). With the
        build term charged, 0 sub-rho cells at any budget, any degree (S6), and
        analytically total >= (log2 N + log2 m! + d)/2 > log2 N / 2 for every m,
        d, s (analytic_floor).
      secondary_findings:
        - >-
          The stated store-free closed form 2^(2n/(floor(m/2)+1)) omits log2 m!
          and a +1; no reported cell inherits it (the driver minimises
          numerically), but P2's "m = 6 landing near it" and my own prior's
          "m = 6 lands at 2^65.5" do: the driver puts m = 6 at 2^70.27.
        - >-
          The stated minimum-store form S/(S-1)(n/2 + log2 m!) ignores the
          linear-algebra constraint; no sub-rho cell exists for m <= 7 at any
          store, so the A2/A2b values 140.2 (m 4) and 112.5 (m 6) at n 131 are
          the minimum store of no cell.
        - >-
          Relation excess HOLDS (bounded by |F|+2 relations, simulated excess
          +1). Odd m HOLDS under the frozen cap s <= floor(m/2); with
          s = ceil(m/2) the n 131 argmin moves to m 7 at 2^102.6, so P4's argmin
          is a property of the cap.
        - >-
          C-BOUND-PROBE (A3), C-BASELINE-CONSISTENCY (A7) and the A6 realisation
          table were not implemented; raw-result.json carries three controls and
          the manifest claims four.
    - joint: J2 -- failure power of the A1-amended C-FLOOR-REPRO
      owner: TASK-20260928-3f90b8
      report: coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20260928-3f90b8/report.md
      verdict: breaks
      load_bearing_finding: >-
        Mutant M1 (drop m!, a one-line wrong cost function) passes A1's
        structural gate, A1's offset signature, C-M3-ANCHOR and the producer's
        gate, and falsifies P5 (44 cells). The signature is calibrated on an
        m!-free reconstruction: it PASSES m!-free code and FAILS every m!-faithful
        implementation, including the committed one (departures 2.02-3.22 bits at
        m 4, 5, 6, 8). Gate and signature see only the FREE model and are blind to
        every oracle exponent; no v1 control exercises MITM_CAPPED. The replacement
        `proposed_gate` (yield identity, closed forms at every m both parities,
        budget invariant) passes M0 and fails M1-M4.
      stop_rule_finding: >-
        RUN-SEMBIN-c68773 tripped A1's stop rule and did not stop; the manifest
        asserts compliance (adjudicated in R2 below).
    - joint: proves-too-much control
      owner: TASK-20260928-3f90b8
      report: coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20260928-3f90b8/report.md
      verdict: breaks (the declared failure signature fires)
      load_bearing_finding: >-
        With the contract's own accounting and its generic oracle laws, NO
        sub-rho cell appears on a genus-g Jacobian (n ~ 160 and ~ 256) or on
        F_q^* (n 131-1024), where index calculus is known to win; with each
        object's real oracle (factoring the Mumford u-polynomial; smoothness
        testing) the same accounting finds them (Harley's 2 - 2/(g+1) reproduced
        exactly). The verdict flips on the oracle law alone. Therefore the
        binary-curve negative is neither a counting artifact nor a property of
        that curve's decomposition probability: it is HEUR-GENERIC-MSUM applied
        as if it were accounting. The conditional statement survives on both
        objects; every unconditioned reading is falsified.
    - joint: J3 -- HEUR-GENERIC-MSUM
      owner: TASK-20260928-62ad14
      report: coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20260928-62ad14/report.md
      verdict: breaks (in a direction that helps nobody below rho)
      load_bearing_finding: >-
        The heuristic is false as a statement of the generic time-store frontier.
        van Oorschot-Wiener section 5.3 eq. (8) golden-collision MITM gives
        ~7 |F|^(m-S) |F|^((S-s)/2) at store |F|^s, S = floor(m/2), a gain of
        (S - s) d/2 - log2 7 bits for every s < S; vOW itself names the
        memory-limited method the heuristic codifies "the standard approach" and
        beats it. PCS multi-collision batching prices the relation phase lower
        still. Neither yields a sub-rho cell: the generic-class conclusion follows
        from Shoup's bound via Wagner 2002 Cor. 1, at any memory, and needs no
        heuristic. So the plan's premise that the heuristic "carries the entire
        result" is false; it carries only the sweep's numbers, which J3 section 1
        shows are artifacts of the uncharged fill. Frobenius x negation buys at most
        log2(2n) bits on relations and store and 2 log2(2n) on linear algebra
        (8.0 and 16.1 at n 131); the 2-torsion at most 2 bits; an F_2-subspace
        factor base cannot be Frobenius-stable at n 131 or 163.
      escalation_note: >-
        The literal breaking_artifact trigger fires; the escalation's stated
        rationale (a sub-rho route) is absent. Ruled in R3.
    - joint: J4 -- scope and language
      owner: TASK-20260928-d8b371
      report: coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20260928-d8b371/validation_report.yaml
      verdict: breaks
      receipt_verdict: failed
      load_bearing_finding: >-
        The joint's declared object (RESULTS.md and the EV record) does not exist.
        On the texts that do exist (manifest, specification, hypothesis, commit
        3c97c0d40 message) nine overstatements are quoted with corrected wording:
        an unconditioned commit title; curve-named margins mixing the vOW and
        published columns; A5-forbidden "memory charged" language; the 720 count;
        P2/P4/P5 readings; uncited security assertions; solve dates contradicted by
        the frozen input; a false H prediction 4 at tracked degrees 79 and 89.
        Claim tier heuristic_estimate is NOT exceeded anywhere. Every correction
        is carried by CORR-20261001-a38d14.
    - joint: blind re-derivation of the minimum-store / sub-rho quantity
      owner: TASK-20260928-4e5c26
      reports:
        - coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20260928-4e5c26/blind_derivation.md
        - coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20260928-4e5c26/comparison.md
        - coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20260928-4e5c26/validation_report.yaml
      verdict: holds
      blind_from_respected: true
      load_bearing_finding: >-
        Under the producer's three conventions (K = |F|, LA = |F|^2, real d) the
        blind formulas reproduce 150/150 min-store rows, 15/15 n 131 store-free
        rows and 10/10 summaries with zero mismatches. No arithmetic error on
        either side. The blind derivation independently and BEFORE the reveal
        flagged (S2/V3) that the store build is never charged and that charging
        it leaves no feasible cell at any n, m, d, s (identity I1: RC x store =
        K m! N >= N), and (S1/V4) that a truncated MITM is overcharged by m!/s!,
        which in the probe-only model flips P5 at n 97 (store 2^70) and n 109
        (2^77). "m = 8 is the smallest m below 60.8090 at n 131" is fragile: 0.018
        bits at K = |F| with the LA row weight restored; m = 10 with a Wiedemann
        constant of 3.
      what_agreement_means_here: >-
        Agreement is evidence that the implementation computes its model. It is
        NOT evidence for the model, and the model is what J1, J2, J3 and the
        re-derivation's own S2 break.
  convergence: >-
    FOUR INDEPENDENTLY-PRODUCED ARTIFACTS locate the same defect without reading
    each other: J1 S6 (validation_report), J2 section 3 build_term_audit, J3
    section 1, and the blind re-derivation's S2/V3/identity I1 (written and
    hashed before reveal). Each finds every reported sub-rho cell needs fewer than
    one oracle call (their exponents differ by definition and are NOT reconciled
    here) and a table larger than rho's work, and each finds zero sub-rho cells
    once construction is charged. INDEPENDENCE CAVEAT, stated so it is not
    overread: these are independent SESSIONS, not independent MODELS. Every
    policy alias resolved to one model (each attestation records
    fallback_used: true or session-reported claude-opus-5-5), so a blind spot
    shared by that model would be shared by all five. J1 and J4 were one
    validator session (disclosed). The convergence is strong evidence about this
    defect because the defect is also an elementary algebraic identity anyone can
    check (RC x store = K m! N).
  comparison_with_coordinator_prior: >-
    The prior (TASK-20260928-e4f7b2) expected P1-P4 confirmed and "nearly
    worthless", and named three overturning conditions. NONE OF THEM FIRED; the
    prior was overturned somewhere it did not look -- the oracle's own build
    time. In addition three numbers in the prior or plan were wrong on their own
    terms: "m = 6 lands at 2^65.5" (2^70.27 in the driver; J1 S2), "the columns
    differ by 4.52 bits" (3.52 = log2 sqrt(131) plus a 1.00-bit cofactor; J4-3),
    and "eleven degrees" (ten distinct; 163 is in both lists). "Confirmation
    nearly worthless" was right, more strongly than intended: the confirmed P2
    and P4 cells are not sub-rho once time is counted. Recorded because a prior
    overturned on mechanism is the most informative outcome this architecture
    can produce, and it is only visible because the prior was written first.

  # ---------------------------------------------------------------------------
  # Rulings.
  # ---------------------------------------------------------------------------
  rulings:
    - id: R1
      question: Does the claim as produced stand, as evidence?
      ruling: >-
        NO. RUN-SEMBIN-c68773 is a faithful, reproducible computation of an
        incomplete model. Every headline metric -- min_store_to_beat_rho_by_degree,
        the 720/14/706 counts, P2's below-reference row, P4's 2^106.8 read as an
        entry price -- rests on a time accounting that omits a term dominating
        every reported sub-rho cell by at least 41.9 bits (J1 S6). Both validators
        returned receipt verdict `failed`. The hypothesis's CONCLUSION (no cell
        below rho) survives a fortiori -- under correct accounting nothing is below
        rho at ANY store -- but the run's numbers do not support it, the run's
        reason for it ("the store must exceed rho's work") is replaced by a
        stronger and simpler one (the table takes longer to WRITE than rho's whole
        work), and its stated dependence on HEUR-GENERIC-MSUM is false (R6).

    - id: R2
      question: The untriggered A1 stop.
      ruling: >-
        A MATERIAL PROTOCOL DEVIATION, adjudicated as follows.
        (a) FACT. A1 required that a departure of more than 1.5 bits from the
        declared offset signature be reported as a suspected implementation defect
        and that "the run stops for Coordinator adjudication"; the approval-time
        falsification criterion adds "no row may be read". In A1's own sign
        convention the offsets depart by 2.02, 2.44, 2.76 and 3.22 bits at m = 4,
        5, 6, 8 (J1 out_of_joint; J2 section 1.2 item 4; J4-7). The run did not
        stop. The manifest records `halted: null`, `protocol_deviations: []`, and
        states the offsets grow "as the amendment's declared signature requires" --
        a compliance statement the run does not have, and the driver's own
        offset_bits field carries the opposite sign. Corrected in
        CORR-20261001-a38d14; TASK-20260928-9e14ac's constraint stating the stop
        rule is quoted there.
        (b) MERITS. The alarm is a FALSE ALARM ABOUT THE IMPLEMENTATION. The
        signature was miscalibrated -- by me, in DEC-20260928-7c3d91 amendment A1 --
        on an m!-free reconstruction: a faithful implementation's offset is about
        2 log2 m - 2 log2(m!)/(m+1), so every m!-faithful implementation trips it
        and m!-free ones pass (J2 OBJ-2, demonstrated by mutation). The
        implementation's arithmetic is independently reproduced (J1 S0: 1,500 cells,
        zero mismatches; blind: 150/150). The defect the stop rule was meant to
        catch is absent; the defect that IS present (uncharged fill) is one the
        signature could never see.
        (c) CONSEQUENCE. The stop is NOT lifted retroactively. Lifting a stop rule
        after reading the rows it guarded is a post-hoc change of criterion, which
        agents/coordinator.md forbids without a protocol amendment, and an
        amendment cannot retroactively alter a raw run. "No row may be read"
        therefore stands for RUN-SEMBIN-c68773 on this ground ALONE, independently
        of R4. The miscalibrated signature A1(ii) is WITHDRAWN going forward by
        AMD-20261001-e61f2b and replaced, not re-tuned.
        (d) The deviation is not infrastructure and not negative mathematical
        evidence (AGENTS.md rule 5). It is a protocol-compliance and
        reporting failure of the producer receipt, compounded by a control defect
        authored by the Coordinator.

    - id: R3
      question: J3's escalation trigger. Is review-breakthrough at max convened?
      ruling: >-
        NOT CONVENED. The plan said a sub-generic m-SUM algorithm, or a retrieved
        citation to one, "voids every row of the sweep and escalates to
        review-breakthrough at max", and its stated reason was that such a route
        "IS a breakthrough-shaped claim". The literal condition fired (vOW section
        5.3, retrieved). The reason did not: the algorithm is a 1999 generic method,
        it lowers the oracle's per-target cost toward Shoup's floor and never below
        rho, and it STRENGTHENS the negative (J3, escalation_note). AGENTS.md rule
        12 binds on a claim PROPOSED as a breakthrough, a closure result, or a
        contradiction of ESTABLISHED evidence. None is proposed here:
        HEUR-GENERIC-MSUM was an unvalidated assumption with
        validation_experiment_ids [] and no evidence record, so contradicting it
        contradicts no established evidence; this decision closes no lane; and
        nothing is promoted. Nothing is downgraded either: no claim that would
        require the max tier is being moved by a lower tier.
        The departure from the plan's literal text is recorded as PD-7, because a
        plan deviated from silently is worth less than one never declared.
      voiding_effect_of_the_trigger: >-
        The trigger's first half -- "voids every row of the sweep" -- IS applied:
        no row of RUN-SEMBIN-c68773 is readable as evidence (R2, R4).
      mandatory_revisit: >-
        review-breakthrough at max, independent session, non-degradable, becomes
        MANDATORY the moment any record proposes (i) a sub-rho or exponent-moving
        decomposition oracle on a binary curve, including IDEA-20260930-4b7d1e
        outcome (C-yes); (ii) a closure of the decomposition-oracle lane; or (iii)
        a contradiction of a validated evidence record. IMP-SEMBIN-REVIEW-MAX's
        recurrence note governs servability; the claim stays un-promoted if max
        cannot be served.

    - id: R4
      question: May rows of RUN-SEMBIN-c68773 enter an evidence record?
      ruling: >-
        NO ROW MAY ENTER ANY EV-* RECORD AS REPORTED, on two independent grounds:
        the unlifted A1 stop (R2c) and the uncharged table construction (R1). The
        run is NOT deleted, NOT re-labelled infrastructure failure, and NOT
        negative evidence. It is preserved as an immutable, completed,
        evidence-INADMISSIBLE receipt, citable only (i) as the M0 reference object
        of the replacement gate in AMD-20261001-e61f2b, (ii) as the subject of
        CORR-20261001-a38d14, and (iii) as the probe-only reference column in the
        v2 report, labelled "probe-only v1 reference, not a cost". The run manifest
        is not edited (AGENTS.md core rule 4).

    - id: R5
      question: What replaces it?
      ruling: >-
        AN ADDITIVE PROTOCOL AMENDMENT AND ONE RERUN.
        AMD-20261001-e61f2b (EXP-SEMBIN-04ec3c v1 -> v2) is approved by this
        decision under the standing user authorization of 2026-09-06. It charges
        the oracle table's construction at one operation per entry; adds a
        trials >= 1 domain guard; adds a generic-lower-bound consistency flag that
        STOPS the run as an arithmetic defect; replaces C-FLOOR-REPRO with the
        J2-demonstrated proposed_gate plus an m-bound probe and a gate-power
        self-test against four mutation classes; withdraws A1(ii); implements the
        A3, A6 and A7 controls the v1 receipt omitted (A7's 4.52-bit attribution
        withdrawn); and adds clearly labelled exploratory sensitivity columns. It is
        POST-DATA and says so: confirmatory_status exploratory_only. The rerun is
        TASK-20261001-c2a58e, snapshot TASK-20261001-41f6b3, whose card carries the
        review plan for the round on it, written now, before any v2 output exists.
      why_rerun_at_all: >-
        The analytic floor (J1) and identity I1 (blind) already settle the
        model-level verdict. The rerun is not for discovery. It buys (i) an
        ADMISSIBLE receipt an EV record may cite, with gates that can fail; (ii) a
        demonstrated gate-power result on the program's own driver; and (iii) the
        per-degree fill-charged margins as a frozen fixture the restated
        hypothesis can be checked against. Seconds of standard-library arithmetic,
        no machine contention. Ranked ahead of doing nothing on (i) alone: without
        it this round leaves no evidence record at all.

    - id: R6
      question: The restated hypothesis wording, and HEUR-GENERIC-MSUM.
      heur_generic_msum_ruling: >-
        CONTRADICTED AS WORDED. Its own falsification_condition -- "An m-SUM
        algorithm on this group, for any m, with time below |F|^(m-s) at store
        |F|^s" -- is met by van Oorschot-Wiener golden-collision MITM
        (section 5.3, eq. (8)), conditional on vOW's random-function model, which
        their simulations calibrate. Like-for-like: both sides are heuristic. I
        read the vendored source myself for this decision
        (inputs/VOW-1996-PCS/paper_fulltext.md lines 682-744): the memory-limited
        "standard approach" costs n1 n2/(2w) evaluations and the collision-search
        method is stated "0.07 [sqrt(n1/w)] times faster"; the displayed equation
        (8) is fragmentary in the vendored text and its sqrt(n1/w) factor is
        restated from the prose ratio, as TASK-20260929-c05f6e literature-screen
        section 2c and J3 section 2 both note. Refutation basis: `derivation`
        anchored on a retrieved primary source (J3 report section 2;
        literature-screen section 2c), both archived by TASK-20261001-7d04c9 in
        the same ledger archive as this decision -- see PD-9.
      binding_effects_of_the_heuristic_ruling:
        - >-
          HEUR-GENERIC-MSUM MAY NOT BE CITED AS A LOWER BOUND by any record from
          this decision on. H-SEMBIN-8e7ae3 is NOT edited; its recorded
          `status: unvalidated` is read through this decision as
          `contradicted_as_worded`.
        - >-
          ITS ROLE IS RE-LOCATED, NOT MERELY WEAKENED. It does not carry the
          hypothesis's conclusion (the generic-class conclusion follows from
          Shoup's bound via Wagner 2002 Cor. 1 at any memory); it carried only the
          sweep's numbers. J3 O4.
        - >-
          The restated heuristic -- a relation-HARVESTING statement with the table
          fill charged, per IDEA-20260930-4b7d1e (C) -- is a deliverable of
          TASK-20261001-9b3e70 and is not adopted by this decision.
      restated_hypothesis_wording: >-
        RESTATED, CONDITIONAL, NOT YET A RECORD. Within the cost model of
        EXP-SEMBIN-04ec3c with the oracle table's construction charged at one
        operation per entry (AMD-20261001-e61f2b), for an m-summand index calculus
        on a binary curve of prime extension degree n in {97, 109, 131, 163, 191,
        233, 239, 283, 409, 571} whose decomposition oracle is in the GENERIC CLASS
        -- it touches the group only through group operations and equality of
        encodings, and treats the factor base as an unstructured list -- no cell
        (2 <= m <= 16, any d, any s <= floor(m/2), any store budget) has a total
        operation count below the van Oorschot-Wiener column 0.886 sqrt(N). Inside
        the model this is the algebraic identity RC x store = K m! N; for generic
        algorithms at large it is a corollary of Shoup 1997 via Wagner 2002
        Cor. 1, NOT of HEUR-GENERIC-MSUM. It is SILENT on every oracle that uses
        the curve's structure: membership tests x(P) in V, Weil-descended
        summation polynomials, approximate F_2-linear x-coordinate filters, and
        Frobenius beyond orbit bookkeeping. It asserts nothing about any curve's
        security in either direction.
      what_the_restatement_withdraws_from_the_original:
        - >-
          "without a store whose size exceeds rho's entire work" as a PRICE OF
          ENTRY. Read correctly, P3a says every sub-rho cell's table takes more
          operations to write than rho's whole work: it is a proof inside the
          model that no cell is sub-rho, not the cost of reaching one (J1
          analytic_floor).
        - >-
          The mechanism sentence "leaving a total of 2^n at every m and every
          factor-base size": the total is m! N, independent of d and INCREASING in
          m (the run's own P1 result; J4-9).
        - >-
          The generic-class conclusion as a contribution: sota_delta is 0 against
          Shoup's bound (KN-LIT-011). The hypothesis's `dominated_by: null` was
          checked against program records only; it is not supported (J3 section 3).
      vehicle: >-
        A superseding hypothesis record, drafted by TASK-20261001-9b3e70 under
        its task directory and committed only by a later Coordinator decision,
        which will also move H-SEMBIN-8e7ae3 to `superseded` at that time.

    - id: R7
      question: Hypothesis status.
      ruling: >-
        NO STATUS MOVE. H-SEMBIN-8e7ae3 stays `specified`, its `analyzed` ceiling
        stands, and the record is not touched by this decision.
        Not `running`/`analyzed`: there is no admissible evidence record, so
        there is nothing analyzed; moving it would read downstream as progress on
        a receipt this decision rules inadmissible.
        Not `weakened` or `rejected`: its CONCLUSION is not contradicted -- it
        survives a fortiori -- and an adverse transition would need an evidence
        record with a proof basis archived first (docs/claims-and-verification.md),
        which does not exist and which this round's findings would not support in
        that direction.
        Not `superseded` yet: the superseding record does not exist. Moving the
        status before the replacement is committed would leave the lane pointing
        at nothing.
      agents_md_note: >-
        AGENTS.md "Research states" requires a decision record for every state
        transition. Prior practice on this exact record (DEC-20260928-7c3d91)
        moved `status` in place and appended `status_history`; that pattern is
        noted for the later supersession and is not exercised here.

    - id: R8
      question: TASK-20260929-c05f6e's Frobenius-orbit DO-NOT-BUILD.
      ruling: >-
        ACCEPTED, scoped as a METHOD CEILING and NOT as a lane closure.
      evidence: >-
        DESIGN.md sections 2-3 and the proof_search_map (L1 transport with trivial
        target stabiliser; L2 target-fixing group <= m! 4^(m-1); L3 leverage
        confined to target-independent bookkeeping; X1-X5), and, independently and
        blind to it, J3 report section 4 (orbit quotient <= log2(2n) on relations and
        store, 2 log2(2n) on linear algebra; ord_n(2) table agreeing with DESIGN.md
        section 7 at 233, 283, 409, 571 and with KN-FIND-b9a41d (5) at 131, 163).
        Two sessions with different attack plans reach the same ceiling.
      scope: >-
        Koblitz E_a over F_(2^n), n an odd prime; F = F_V with V sigma-stable,
        1 < dim V < n; fixed m >= 2, s <= floor(m/2); shared-table PMITM family
        model with the store charged; algorithm class A_G (uses G = <-1, pi> only
        through orbit bookkeeping). Exponent change 0 (derived); concrete gain
        <= 2 log2(2n) bits at fixed physical store, <= 0.5 log2(2n) at the
        balanced optimum, matched there by rho's own sqrt(2n).
      budget_and_boundary: >-
        Zero scientific runs; 10800 s advisory design budget (TASK-20260929-c05f6e).
        Derivation-grade and UNREVIEWED as a derivation; obstruction value derived,
        measured_by empty, so it may not be recorded as an obstruction block on an
        evidence record or as a closure.
      remaining_uncertainty:
        - A_G is a definition; an algorithm using pi through its eigenvalue lambda otherwise is outside the ceiling.
        - X2 rests partly on a RECALLED fact (units of End(E_a) are +-1) and on heuristic H-STAB, unvalidated.
        - L1-L3 are single-session derivations not independently reviewed as derivations.
        - The x-coordinate approximate-filter gap (X1 approximate case) is uncovered for p = 2, as KN-FIND-ffe1df's own scope states.
      revisit_conditions:
        - an efficiently computable canonicaliser for a multiplicative subgroup H of (Z/l)^* strictly larger than <+-lambda_pi> is exhibited (X2)
        - an approximate sum-compatible F_2-linear x-filter on a binary curve shows bucket gain growing with M against a SHA null (J3 RC5 ladder; X1 gap)
        - an algebraic oracle shows a sigma-stable V lowering the Weil-descent solving degree (X5; routes through IMP-SEMBIN-ENGINE and GOAL-SEMBIN-5078bc criteria 1-3)
        - any record shows a nontrivial G-symmetry acting on the target-dependent side (L1 false)
      successor: >-
        IDEA-20260930-4b7d1e, ranked, carded as TASK-20261001-9b3e70 (step 1).
        The X1-approximate and X5 rows are named as the open non-generic routes in
        R6's restated wording. Not a deprioritisation of the sub-generic question:
        the Frobenius route is capped; the question itself stays open.

    - id: R9
      question: IDEA-20260930-4b7d1e.
      ruling: >-
        ACCEPTED AND FILED as `proposed` at ledger/proposals/IDEA-20260930-4b7d1e.yaml,
        byte-identical to the designer's draft (no Coordinator edit to a
        proposer's record). Owning goal GOAL-SEMBIN-5078bc (objective item (4) COST,
        per the H-SEMBIN-8e7ae3 attribution ruling of DEC-20260928-7c3d91).
        `question_id: null` is ACCEPTED AS DOCUMENTED: neither of that goal's
        questions (RQ-SEMBIN-fa2e3f on Assumption 1, RQ-SEMBIN-ade131 on eq. (11))
        covers it, and minting a question to hold one idea is ceremony. Step 1 (zero
        compute) is carded as TASK-20261001-9b3e70. Step 2 (toy fixture) is NOT
        carded: it is conditional on step 1 leaving (C) open. Its pre-cutover id
        (20260930 < PRIOR_ART_CUTOVER 20261001) makes prior_art optional; it carries
        one, which is checked when present.
      caveat_recorded: >-
        The idea was written without reading RUN-SEMBIN-c68773 or the contract's
        cost model (its assumptions say so). Its claim (A) agrees with this
        decision's R6 on the source; its claim (B) sketch is consistent with J3
        section 2's PCS bound. Step 1 must pin to the actual model first.

    - id: R10
      question: KN-LIT-e3a95c (draft).
      ruling: >-
        NOT FILED. The draft is preserved where it was written and archived with
        its task's deliverables; it does not enter knowledge/.
      reasons:
        - >-
          DUPLICATE SOURCE. Its primary paper, arXiv 1801.08589
          (Adikari-Dimitrov-Cintra), is already in the corpus as KN-LIT-584.
          .claude/skills/curate-knowledge requires that an existing stub be
          upgraded by a NEW entry that the stub's `superseded_by` points to;
          filing a second entry for one identifier without that link is the
          defect the convention exists to prevent, and setting the link is an edit
          to an existing record that this decision does not need to make.
        - >-
          CONFIDENCE OVERSTATED FOR ITS BASIS. `confidence: established` with
          `citation_verified: read`, while the general form rests on two Wikipedia
          pages, the paper was read through an ar5iv extraction with an UNRESOLVED
          curve-equation discrepancy (ax versus ax^2), and the usual primary sources
          (Solinas; Avanzi-Heuberger-Prodinger) were not read. Per the skill,
          confidence would be `reported` at best.
        - >-
          NOTHING HERE RESTS ON IT. R8's ceiling uses only that pi is an
          automorphism of E(F_(2^n)) with pi^n = 1 and fixed group E(F_2), which
          is immediate from the definition (x, y) -> (x^2, y^2); J3 reached the same
          ceiling without it.
      revisit_condition: >-
        Refile as a new entry superseding KN-LIT-584 (with that stub's
        superseded_by set in the same archive) once the paper text is read
        directly, the ax / ax^2 discrepancy is resolved, confidence is set to what
        was actually read, and `make sources` is regenerated. Low rank; a
        curation item, not research.

