  rationale:
    - >-
      THE RUN IS REPRODUCIBLE AND WRONG IN THE SAME BREATH, AND THAT IS WHY
      VALIDATION ALONE COULD NOT HAVE CAUGHT IT. Two implementations reproduce it
      exactly. The blind re-derivation -- the architecture's check for a
      wrong-but-self-consistent implementation -- agreed with the arithmetic AND,
      before seeing a producer number, independently named the omitted build term.
      That is the review architecture working as designed.
    - >-
      THE CONTROL THAT SHOULD HAVE GUARDED THE RUN WAS MINE AND WAS INVERTED. A1's
      signature fails every faithful implementation and passes an m!-free one. I
      wrote it. The run's failure to stop is still the producer's deviation, and
      the stop is still not lifted after the fact; both things are true and both
      are recorded.
    - >-
      THE CONCLUSION SURVIVES FOR A BETTER REASON THAN THE ONE GIVEN. A family-wide
      generic negative that needed an unvalidated heuristic now needs none, and the
      heuristic it named is contradicted. Recording that as "the hypothesis was
      right" would misdescribe it: the claim's value to the program is the
      NON-generic remainder it points at, and the restatement names that remainder
      explicitly so the next session does not re-derive Shoup's bound as a result.
    - >-
      NO ESCALATION, BECAUSE NOTHING IS CLAIMED THAT RULE 12 PRICES. Convening the
      max tier on a trigger whose rationale is absent would spend it on a 1999
      textbook algorithm and teach the program that triggers fire on wording. The
      revisit conditions keep the tier mandatory for the cases it exists for.
    - >-
      THE FROBENIUS DO-NOT-BUILD IS ACCEPTED BECAUSE TWO INDEPENDENT ROUTES REACH
      THE SAME CEILING, and it is scoped as a method ceiling because neither route
      measured anything. Premature closure is guarded by four named revisit
      conditions and an open successor; overclaiming is guarded by refusing it the
      word "closure".

