  context: >-
    TASK-20260928-e4f7b2 carried a review plan written before any implementation
    existed. RUN-SEMBIN-c68773 then ran (17.9 s, deterministic, seedless) and was
    snapshot-committed at 3c97c0d40. Five independent reviewer sessions returned:
