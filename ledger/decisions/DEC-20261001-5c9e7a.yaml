# DEC-20261001-5c9e7a -- COMPOSITION of review round REVIEW-SEMBIN-20260928-04ec3c
# on H-SEMBIN-8e7ae3 / EXP-SEMBIN-04ec3c / RUN-SEMBIN-c68773 (snapshot 3c97c0d40),
# and disposition of the rank-1 design task TASK-20260929-c05f6e.
#
# THE ONE THING A HURRIED READER SHOULD TAKE AWAY: RUN-SEMBIN-c68773 is NOT
# EVIDENCE. Its arithmetic is a faithful transcription of its model (reproduced
# cell-for-cell by two independent implementations), but the model never charges
# the construction of the oracle's |F|^s table, and every sub-rho cell it reports
# needs fewer than one oracle call and a table larger than rho's entire work.
# Charge the table's construction and NO cell is below rho at any store. The
# hypothesis's CONCLUSION survives, a fortiori, but not for the reason the run
# gives, and not because of HEUR-GENERIC-MSUM, which is contradicted as worded.
# Nothing here is a statement about the security of any curve.
# =============================================================================
