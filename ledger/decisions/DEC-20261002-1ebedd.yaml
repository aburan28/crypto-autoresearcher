  procedural_deviations:
    - id: PD-71B610-1
      facts: >-
        TASK-20261002-71b610 constraint CODE, EXACTLY AND ONLY allowed as new
        code only the closed list of AMD-20261002-236691 E-5 (1) (VR-105). The
        executor also wrote and ran three scratch scripts: dev/step_a.py
        (records the order-step (a) tables into the pin file),
        dev/make_inputs.py (writes each attempt's finalize-inputs.json with
        exactly executed_sources and writer_notes) and dev/make_extra.py
        (writes each location's finalize-extra.yaml and applies E-6
        mechanically from raw-result.json and execution.json). Their sha256
        values are recorded; their text is not archived. The executor listed
        them as disclosures, not deviations (VR-103, VR-104, VR-106).
      ruling: >-
        A PROCEDURAL DEVIATION from the letter of the card, ACCEPTED AS
        DISCLOSED; not a validity defect. (1) Every output of the three scripts
        is a data file archived at its location (finalize-inputs.json,
        finalize-extra.yaml) or a pin-file table, and each of their values is
        re-derivable from archived inputs. (2) None computes a census
        statistic; make_extra.py applies a mechanical status rule that the
