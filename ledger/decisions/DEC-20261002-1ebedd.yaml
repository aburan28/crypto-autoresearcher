  # ---------------------------------------------------------------------------
  rationale:
    - >-
      Validity first (coordinator.md responsibility 6). Every item of the
      fb5717 NA-5 list is checked against archived files and bound to a
      machine-checked row. This Coordinator recomputed no hash (no shell); the
      top-level session's out-of-repository scripts are corroboration only.
      Infrastructure and procedure are kept apart from evidence (AGENTS.md core
      rule 5): the two procedural deviations and the clerical items affect no
      byte that a status, gate or outcome reads.
    - >-
      The tier follows mechanically from the frozen TW-ALIVE definition and the
      archived outcome ids, decided before any reviewer runs. Opening at
