    result: >-
      TW-ALIVE DID NOT FIRE. Per DEC-20261001-56f873 NA-7 ("review-adversarial
      for a null outcome", VR-23) and DEC-20261002-fb5717 NA-6 (VR-24), the
      round runs at review-adversarial: TASK-20261002-0114ff on the validator
      binding and TASK-20261002-87ffc4 on the red-team binding, independent
