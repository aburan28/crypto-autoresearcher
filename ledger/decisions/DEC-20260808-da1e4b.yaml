coordinator_decision:
  id: DEC-20260808-da1e4b
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-204b34
  recorded_by_task: TASK-20260807-c9d8e7
  archived_by: null
  decided_by: coordinator
  decided_at: '2026-08-08'
  context: >-
    This decision supersedes the preliminary BATCH-204b34 lane decision after the independent
    reviewer artifact became available. The package decomposes the proposed isogeny-class,
    j-invariant, and endomorphism-transfer route into bounded subproblems and tests each against
    matched isomorphic, cyclic, and overhead controls.
  decision: revise
  target_ids:
    - GOAL-ECDLP-001
    - BATCH-204b34
    - H-ECDLP-f8101e
    - EV-ECDLP-3dc2db
  rationale:
    - >-
      L2 finds the tested invariant features class-constant or unsuitable as downstream
      predictors; the j-invariant is rejected as a stable selection feature under the declared
      toy corpus.
    - >-
      L3 reports no measurable j-based gain after matched controls (zero positive-gain families,
      Bonferroni-adjusted p=0.75), so the proposed public representative-selection mechanism has
      no surviving signal in this boundary.
    - >-
      L4 charges forward, inverse, and preprocessing work and reports no end-to-end transfer
      speedup; every tested family has net speedup below one.
    - >-
      Independent review TASK-20260807-b5c6d7 and red-team task TASK-20260807-94b191 both report
      that no lane survives control checks. This supports a scoped negative result, not an
      impossibility claim about ordinary prime-order curves or cryptographic-size parameters.
  evidence_refs:
    - EV-ECDLP-3dc2db
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-204b34/reviews/TASK-20260807-b5c6d7/lane_review_report.yaml
    - coordination/goals/GOAL-ECDLP-001/proposals/NON-INDEX-ECDLP-III-20260807/red-team/L5_control_audit.yaml
    - coordination/goals/GOAL-ECDLP-001/proposals/NON-INDEX-ECDLP-III-20260807/validation/L2_invariant_validation.json
    - coordination/goals/GOAL-ECDLP-001/proposals/NON-INDEX-ECDLP-III-20260807/validation/L3_predicate_validation.json
    - coordination/goals/GOAL-ECDLP-001/proposals/NON-INDEX-ECDLP-III-20260807/validation/L4_endo_transfer_validation.json
  limitations:
    - >-
      The evidence is toy-field triage data; the sampled curves are not a cryptographic-size,
      prime-order benchmark and do not establish an asymptotic exponent bound.
    - >-
      The degree cap is five and the tested predicates are bounded by the proposal's frozen
      corpus. Larger ordinary families, different public predicates, and alternative transfer
      schedules remain open.
    - >-
      EXP-ECTD conductor/endomorphism evidence is a separate goal and is not merged into this
      ECDLP lane decision.
  next_actions:
    - >-
      Keep H-ECDLP-f8101e at analyzed/scoped-negative status and do not advance the j/transfer
      lane without a successor experiment on prime-order ordinary curves with the same null and
      end-to-end overhead controls.
    - >-
      Preserve the isogeny-class direction as an open research direction only through a new,
      explicitly specified successor hypothesis; do not infer that all endomorphism methods fail.
    - >-
      Compare any successor against Pollard rho's 1/2 time exponent and memory/query costs;
      no measured sota improvement exists in this batch.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      The result is a preliminary, control-validated toy-scale observation and does not meet the
      replication, scale, or proof gates for durable cryptanalytic claim promotion.
  claim_ceiling: toy
  official_research_state_changed: false
  supersedes: DEC-20260807-1fd020
  correction_note: >-
    This is a new immutable decision record. The superseded decision remains unchanged so its
    historical binding and hashes remain valid.
