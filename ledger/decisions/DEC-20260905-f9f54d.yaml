  decision_rationale_for_verb: >
    BATCH-e19be0 is CLOSED AS A DUPLICATE of work already completed, and its
    four malformed handoff records are REPAIRED by the sanctioned
    schema-supersession mechanism. Facts, all read from committed state on
    origin/main: (1) commit 7731a6cf9 (2026-09-05T15:52:24-07:00) opened
    BATCH-e19be0 on GOAL-ECRANK-002 to dispatch N1 of DEC-20260822-7d356e --
    the same directive my lane dispatched as BATCH-52b70c ten seconds earlier
    (lane opened 2026-09-05T22:52:14Z = 15:52:14-07:00). This was an honest
    concurrent race between two sessions: my sweep predated their opening
    commit, they opened no lane file (nothing in
    coordination/goals/GOAL-ECRANK-002/lanes/ for BATCH-e19be0), so neither
    session could see the other. (2) Their executor task TASK-20260905-b4b4cb
    was claimed at 15:52:37 and RELEASED AS FAILED at 16:27:52 with empty
    artifact_sha256; no run record, no evidence, no further commits from that
    session. Per core rule 3 that failure is infrastructure history, not
    evidence about rank, and it changes nothing about C1. (3) N1 itself was
    COMPLETED, validated, red-teamed, and ledger-committed by BATCH-52b70c
    (DEC-20260905-7adca0, EV-ECRANK-2f1e65, merged in PR #768): the committed
    verifiers accepted the 31-point external witness; the C1-closure
    candidate stands UNPROMOTED under IMP-2. BATCH-e19be0's remaining queued
    tasks (snapshot, validator, ledger) would duplicate or collide with that
    landed record, so they are void and the batch's queue states are set to
    cancelled. (4) The four handoff files committed by 7731a6cf9
    (TASK-20260905-b4b4cb, -63b4f7, -a91a34, -b96b81) are missing the
    required top-level 'handoff' key and have been failing
    tools/validate_ledger.py on main for every session since 15:52. They are
    immutable committed records: the repair is four complete replacements
    under ledger/corrections/schema-supersessions/20260905/ -- the original
    envelope verbatim, wrapped under 'handoff:' (content identity asserted
    programmatically at creation) -- registered with both sides hash-pinned
    in tools/schema_supersession_registry.yaml, the mechanism already
    carrying 96 such routings. One second-level defect surfaced once the
    wrapper let the validator parse the envelope: TASK-20260905-a91a34
    carries an incomplete pre-schema review_plan (owner/attack field names,
    no claim_under_review, no proves_too_much.objects) for a review round
    that NEVER RAN -- the batch was closed before any reviewer was
    dispatched. Its replacement voids review_plan (optional-when-present;
    the field is omitted) and preserves the original block verbatim in the
    replacement's provenance header; completing the plan myself would have
    been authoring a review round that never happened, and keeping the
    malformed block fails the schema. The other three replacements are pure
    wraps. No completed archive binds these identifiers (BATCH-e19be0 has
    no archives at all; its only claim was released failed), so core rule
    15's remap prohibition is not engaged and no rename occurs -- ids are
    preserved.
  context: >
    Discovered while validating the approval batch BATCH-832f3d in this
    worktree (branched from origin/main b6ef32f65): validate_ledger reported
    exactly four new errors, all 'expected top-level key handoff', all on
    BATCH-e19be0 files, none on this batch's records. Full timeline verified
    from git: opening 7731a6cf9 15:52:24; claim d0d54209d 15:52:37 by
    coordinator-ecrank-3; release 3e826e252 16:27:52 outcome failed,
    was_expired false, artifacts empty; no commits touching BATCH-e19be0
    after the release. Additional finding recorded without blame: the other
    session used lane address coordinator-ecrank-3, which this session later
    also used for BATCH-ef0456 -- an address collision in the lane namespace,
    harmless here because the two batches' claim files live under their own
    batch directories, but noted so future lane addresses are chosen less
    predictably. The other session appears ephemeral and gone; per the bus
    contract this closure is announced on the bus so a resurrected session
    reads it on wake, and if it objects it may supersede this decision on the
    merits with a new record.
