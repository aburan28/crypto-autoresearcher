coordinator_decision:
  id: DEC-20260802-002
  goal_id: GOAL-MLKEM-003
  batch_id: BATCH-007
  recorded_at: '2026-08-02'
  decision: expand
  decision_label: resume_from_budget_pause_on_restored_source_access

  context: >-
    GOAL-MLKEM-003 was moved to `paused` by DEC-20260731-006 under the stated
    pause condition `campaign_budget_maximum_batches_exhausted` (6 of 6 batches
    consumed). Its recorded next_action was: "Resume only with extended budget
    and/or G6K for Pwrong near aligned Pgood-median T." Two things changed.
    First, the user has directed the harness to run this goal, which is the
    budget extension that next_action names. Second, and materially, the
    network policy that blocked every primary source has been lifted: this
    session verified reachability directly, receiving HTTP 200 from
    https://eprint.iacr.org/2022/1750 (17539 bytes) and HTTP 200 from
    https://csrc.nist.gov/pubs/fips/203/final (45732 bytes) before authoring
    this decision. Those two checks are the entire evidentiary basis for the
    access claim and nothing else in this record depends on them.

  why_this_is_not_the_paused_next_action: >-
    DEC-20260731-006's next_action names the G6K threshold measurement. This
    decision deliberately does NOT dispatch that. The G6K route was blocked
    twice (BATCH-003 and BATCH-005 both record install/run failure) and is the
    expensive branch. Restored source access opens a strictly cheaper branch
    that was unavailable when that next_action was written, and which is
    logically prior to it: the program holds four findings against Carrier et
    al. (KN-FIND-012, -013, -014, -016) that were derived entirely from a
    vendored HAL snapshot (hal-05406481) and a pinned code commit (9c1367f),
    with no ability to check them against the authoritative current revision.
    If the Table C.2 transcription error is already corrected by the authors,
    KN-FIND-016 is a finding about a superseded document and the program should
    know that before spending a batch on G6K. Cheap falsification before
    expensive measurement is the inventor-protocol ordering
    (docs/inventor-protocol.md section 8); this is that gate, applied to the
    program's own standing findings rather than to a proposal.

  budget_extension:
    from_maximum_batches: 6
    to_maximum_batches: 8
    authorization: >-
      User direction to run the harness for ML-KEM. Recorded as an explicit
      extension rather than an unbounded resumption: two batches, after which
      the campaign returns to a pause decision unless extended again.
    unchanged:
      - max_concurrent remains 3 (this batch uses 2)
      - total_wall_clock_seconds per batch unchanged

  goal_status_transition:
    from: paused
    to: active
    reason: budget_extended_and_primary_source_access_restored

  scope: >-
    This decision authorizes BATCH-007 and nothing else. BATCH-007 is an
    adjudication batch: it retrieves primary sources with recorded provenance
    and asks whether three specific, checkable statements hold in the
    authoritative current text and code. It authorizes no new cost model, no
    re-optimization, no G6K run, and no measurement of ML-KEM security. An
    adjudication of published text is evidence about the provenance and current
    standing of a claim; it is never evidence about the security of ML-KEM.

  non_claims:
    - ML-KEM is not broken, and this batch cannot claim otherwise.
    - >-
      Restored network access is not itself a research result. It changes which
      questions are answerable, not what is true.
    - >-
      KN-OPEN-016 remains open. Nothing in this decision resolves whether the
      dual attack beats the primal attack.
    - >-
      No three-model closure quorum is asserted or sought by this decision.
      GOAL-MLKEM-003 becomes `active`, not `completed`.

  next_actions:
    - >-
      Execute BATCH-007 TASK-20260802-101 (source vendoring and adjudication of
      Q1/Q2/Q3), then snapshot, then independent validation and red team, then
      the ledger archive carrying EV-MLKEM-017 and DEC-20260802-003.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      A launch decision establishes nothing about the subject matter. Any
      promotion belongs to DEC-20260802-003 after the adjudication is reviewed.
    promote: false

  references:
    - DEC-20260731-006
    - GOAL-MLKEM-003
    - KN-OPEN-016
    - KN-FIND-012
    - KN-FIND-013
    - KN-FIND-014
    - KN-FIND-016
    - EV-MLKEM-011
    - EV-MLKEM-013
    - EV-MLKEM-016

  target_ids:
    - GOAL-MLKEM-003

  decided_by: coordinator
  decided_at: '2026-08-02'
