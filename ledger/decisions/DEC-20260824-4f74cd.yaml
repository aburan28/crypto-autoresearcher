coordinator_decision:
  id: DEC-20260824-4f74cd
  id_provenance: >-
    Minted and verified free by the DRIVING SESSION with
    `python3 tools/allocate_id.py --check` on 2026-08-24, and transmitted to this
    Coordinator subagent, which has no shell and minted nothing. It is DISTINCT
    from DEC-20260824-af6d5c, which remains bound to TASK-20260824-b03556's
    ledger archive (the batch CLOSE) and is untouched by this record.
  context: >-
    A new persistent goal, GOAL-DIFFP-84d641, is opened to own the search over
    MD5 and SHA-1 difference space for previously unpublished differential
    paths, and to own the adjudication of what "new" means. Neither existing
    symmetric goal owns this: GOAL-MD5-001 owns instrument calibration (the
    blind rediscovery of a published MD5 path) and the MITM preimage ceiling;
    GOAL-SHA1-001 (draft) owns the chosen-prefix cost model and the deployed
    collision-detector audit. The carve is written into the goal record's
    non_duplication, including the binding rule that solver-validation work
    discovered here is handed to GOAL-MD5-001 rather than absorbed.
    The opening survey of this repository found that the census this goal
    needs cannot presently be populated: the one MD5 collision-path source on
    file (KN-LIT-87e00e) deliberately carries no path data and points at a
    payload quarantined under GOAL-MD5-001's BCP-1 firewall, and no SHA-1
    entry in knowledge/literature carries disturbance-vector data.
  decision: approve
  target_ids:
    - GOAL-DIFFP-84d641
    - RQ-DIFFP-a5c483
    - BATCH-f8bf86
    - EXP-DIFFP-fe894e
    - TASK-20260824-531f8a
    - TASK-20260824-873dc9
    - TASK-20260824-c6625a
    - TASK-20260824-be7bbc
    - TASK-20260824-c40847
    - TASK-20260824-3bd362
    - TASK-20260824-b03556
  rationale:
    - >-
      A CLAIM THAT A PATH IS NEW IS UNFALSIFIABLE WITHOUT THREE OBJECTS: a
      machine-readable census, a declared equivalence relation, and a verifier
      that adjudicates membership. This program holds none of them. Dispatching
      a search first would produce an unsupportable claim in either direction
      -- a returned characteristic could not be shown new, and an empty search
      would be a fatigue report, which docs/inventor-protocol.md section 4
      refuses as a closure. Building the adjudicator first is the cheap gate
      that can FAIL, per docs/inventor-protocol.md section 8 / KN-TECH-080:
      exact baseline reproduction and observation-collision search BEFORE
      expensive search.
    - >-
      THE GATE CAN FAIL INFORMATIVELY IN BOTH DIRECTIONS, which is why it is
      worth a batch. If the published families already tile the reachable
      space under the natural equivalences, that is a named obstruction with a
      measured covering quantity, recorded under the closure standard. If the
      census collapses to very few orbits, the space of genuinely new paths is
      larger than assumed and the search is worth its budget. Neither answer is
      available today.
    - >-
      THE NULL CONTROL IS MADE NON-VACUOUS BY CONSTRUCTION. A null run against
      an empty census returns NON-MEMBER for everything and has measured
      nothing; the contract therefore makes a shadow census containing planted
      entries MANDATORY, so a false positive is possible. This is
      docs/inventor-protocol.md section 3 applied at the point where it would
      otherwise be silently skipped.
    - >-
      EVERY EQUIVALENCE GENERATOR IS VERIFIED OR EXCLUDED, and the adjudicator
      reports the strict and permissive verdicts separately. Admitting an
      unverified equivalence under-declares novelty; omitting a real one
      over-declares it. Reporting both bounds the error in a direction a
      reader can see, instead of hiding it in one number.
    - >-
      max_concurrent IS 2, NOT 3. The machine is 4 cores / 15 GB;
      GOAL-AES-003 BATCH-002 degraded badly at 3 producers on exactly this
      shape (DEC-20260802-b226fb); and the widest stage of this batch is 2
      anyway (the sibling-blind review pair). Sizing concurrency to what the
      environment can actually run is the dispatching Coordinator's
      responsibility, not something the tooling enforces (AGENTS.md, "Dynamic
      dispatch").
    - >-
      BATCH 1 SPENDS NO LARGE COMPUTE: 3000 s of a 10800 s campaign, and the
      modelled compute of all six contract runs together is well under 60 s.
      The declared ceilings exist so that a halt is legible, not because the
      work needs them.
    - >-
      DIRECTION BIAS IS HONOURED WITHOUT PRETENDING TO IT. The canonical target
      profile (docs/target-result-profile.md) asks for exponent-moving results
      on central hard problems. THIS BATCH MOVES NO EXPONENT AND CLAIMS NONE;
      it is the falsifiability precondition for a lane that could. Where the
      profile does bind now is on scope and cost honesty, and the contract's
      interpretation_limits and claim ceiling are written to it. If a later
      batch proposes an asymptotic claim, all four promotion gates in
      agents/coordinator.md apply before it may move toward `supported`.
  evidence_refs:
    - >-
      knowledge/literature/KN-LIT-87e00e.md -- read in full by this task; the
      entry states it carries no characteristic, no message blocks and no
      colliding pair, and points at the quarantined payload by sha256.
    - >-
      coordination/goals/GOAL-MD5-001/quarantine/MANIFEST.yaml -- read in full;
      establishes the BCP-1 firewall, the payload sha256, and the
      pre-registered expected-answer digest.
    - >-
      knowledge/techniques/KN-TECH-066.md -- read in full; its own "Verified vs
      reported" section records that this corpus holds no KN-LIT entry for the
      Wang et al. SHA-1 work.
    - >-
      ledger/goals/GOAL-MD5-001.yaml and ledger/questions/RQ-MDFIVE-6870c1.yaml
      -- read in full; source of the carve against instrument calibration and
      of the binding "file the experiment record at OPENING" rule.
    - >-
      ledger/goals/GOAL-SHA1-001.yaml and ledger/questions/RQ-SHAONE-081e3a.yaml
      -- read in full; source of the carve against the cost model and the
      detector audit.
    - >-
      experiments/EXP-MDFIVE-a8e71e/specification.yaml and
      coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/ -- read as the
      structural precedent for this contract and this control plane.
    - >-
      NO EXPERIMENTAL EVIDENCE IS CITED BECAUSE NONE EXISTS. This is an opening
      decision, not an evidence review. No run has occurred under this goal.
  limitations:
    - >-
      NO PATH IS CLAIMED NEW. NO CRYPTANALYTIC IMPROVEMENT IS CLAIMED. NO
      SEARCH OVER THE DIFFERENCE SPACE IS AUTHORISED BY THIS DECISION
      (EXP-DIFFP-fe894e IR-8).
    - >-
      Claim ceiling for every batch-1 record is `analyzed`, never `supported`.
    - >-
      The census will very likely be EMPTY of readable path data for both
      primitives, so the adjudicator's correctness on PUBLISHED paths cannot be
      tested this batch at all. That limitation is structural, is stated in the
      contract's scale_relevance and interpretation_limits, and is the reason
      acquisition is the named batch-2 object.
    - >-
      Every literature reference in this goal's records other than KN-LIT-87e00e
      and this program's own KN-TECH entries is `recalled`: a pointer for a
      reviewer, never support, and it may not discharge any coverage or novelty
      claim (AGENTS.md rule 9).
    - >-
      The opening survey of the corpus was performed by a single Coordinator
      session with grep and glob, not by an exhaustive retrieval pass; the
      `readable = 0` prediction is recorded as a PREDICTION precisely so a
      nonzero finding is legible as a correction rather than absorbed.
    - >-
      This decision approves a contract and a dispatch queue. It is not durable
      until committed, pushed, and accepted by the post-commit verifier, and
      this session performed none of those.
  next_actions:
    - >-
      Driving session: merge origin/main into the working branch (MERGE, NEVER
      REBASE), run tools/validate_ledger.py and
      tools/research_dispatch.py on the merged tree, mint and file this opening
      decision under a real DEC id, commit the opening control plane, push, and
      open a PR against main naming GOAL-DIFFP-84d641, RQ-DIFFP-a5c483,
      EXP-DIFFP-fe894e and every TASK-20260824-* record.
    - >-
      Then dispatch TASK-20260824-873dc9 (idea-generator) and
      TASK-20260824-c6625a (executor) at width 2 from the queue.
    - >-
      After TASK-20260824-be7bbc lands and BEFORE either reviewer runs, a
      SEPARATE coordinator handoff writes the review plan for
      TASK-20260824-c6625a, carrying this batch's
      `coordinator_prior_recorded_at_opening` forward VERBATIM.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No evidence exists yet under this goal. This is an opening decision, not
      an evidence review: there is no result, no strength, and nothing durable
      to promote. The knowledge-promotion question is answered at the close
      (DEC-20260824-af6d5c), where a working adjudicator would warrant a
      KN-TECH entry recording the census schema, the per-generator verification
      status and the two controls -- because the adjudication problem recurs for
      every primitive this program will ever ask "is this new" about.
  decided_by: coordinator
  decided_at: '2026-08-24'

  # ===================================================================
  # AMENDMENT AT FILING -- everything above this line is the body composed
  # BEFORE the driving session's 2026-08-24 acquisition-reachability report,
  # reproduced WORD FOR WORD from
  # coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/batch.yaml
  # `opening_decision_body_pending_mint`. NOT ONE WORD OF IT WAS EDITED, including
  # its now-outdated next_actions item 1, which asks the driving session to do
  # things it has since done. It is left standing because a pre-registered
  # reasoning record that gets tidied after the fact is worth less than one that
  # is visibly stale: a reader must be able to see what was decided on what
  # information.
  #
  # This block records what arrived AFTER that body was composed and BEFORE this
  # file was written. It is additive and RESTRICTION-ONLY: it forbids more than
  # the body did and relaxes nothing, so it cannot be criterion-tuning.
  # ===================================================================
  amendment_at_filing:
    recorded_at: '2026-08-24'
    kind: prospective_protocol_amendment
    prospective: >-
      TRUE, AND CHECKABLY SO. No producer task of BATCH-f8bf86 has been
      dispatched, no run manifest exists, and no observation has been made. This
      amendment is written before acquisition rather than after it, which is the
      only condition under which a scope restriction is not criterion-tuning
      (AGENTS.md; agents/coordinator.md prohibitions).
    new_fact:
      reported_by: driving session, 2026-08-24, in-session
      measurement: >-
        NETWORK ACQUISITION OF PRIMARY SOURCES IS REACHABLE FROM THIS
        ENVIRONMENT. The driving session measured HTTP 200 for
        eprint.iacr.org/2004/199, shattered.io, and
        raw.githubusercontent.com/cr-marcstevens/hashclash. THIS COORDINATOR
        SUBAGENT DID NOT RUN THOSE PROBES AND DOES NOT CLAIM TO HAVE; the
        measurement is attributed to the session that made it, and any record
        relying on it cites that attribution rather than restating it as this
        goal's own observation.
      independent_confirmation_of_the_census_finding: >-
        The driving session independently re-checked the opening survey rather
        than taking it on trust, and reports that KN-TECH-066 carries no
        disturbance-vector data and that its cited SHA-family notes
        (KN-LIT-2958, KN-LIT-4387, KN-LIT-4909) are bibliography-level with zero
        DV content. Prediction P-1 (`readable_md5 = 0`, `readable_sha1 = 0`)
        STANDS as pre-registered and is now corroborated by a second reader.
        This does not discharge P-1: it remains a prediction that the batch-1
        executor's census build will test, and a nonzero finding by that run
        would still be the correction P-1 exists to make legible.
    the_trap_being_closed: >-
      BCP-1 QUARANTINES CONTENT, NOT A FILE PATH. Fetching eprint 2004/199 over
      the network hands an agent the Wang MD5 characteristic exactly as
      completely as opening
      coordination/goals/GOAL-MD5-001/quarantine/MD5-COLLISION-PATH-WANG-2004-199.yaml
      would, and contaminates GOAL-MD5-001's blind-rediscovery criterion
      identically -- while looking like ordinary acquisition in a receipt. The
      opening body's constraint ("do not read the quarantine directory") is
      stated as a PATH restriction and would not, on its face, stop an agent
      acting in good faith from fetching the same content by URL. THAT GAP IS
      THE DEFECT THIS AMENDMENT CLOSES, and it was found by the driving session,
      not by the Coordinator that wrote the gap. Recorded as a Coordinator
      process finding, not absorbed.
    operative_amendment_record: >-
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/amendments/AMD-20260824-DIFFP-ACQ-1.yaml,
      version 1. That record carries the binding text -- the tier boundary, the
      content-not-path principle, and the per-receipt attestation requirement --
      and is what batch-2 records cite. It is cited here rather than restated so
      there is exactly one authoritative copy.
    ruling_on_re_scoping_batch_1: >-
      BATCH 1'S EXECUTOR TASK IS **NOT** RE-SCOPED TO INCLUDE ACQUISITION. Four
      reasons, in descending weight.
      (1) THE EXECUTOR ROLE HAS NO WEB CAPABILITY. orchestration/roles.yaml gives
      `executor` read_files, search_files, write_files, edit_files and
      run_commands, and deliberately NOT web_search; AGENTS.md is explicit that a
      role needing the open web runs under a runtime that has it rather than
      silently doing without. Authorising the Executor to fetch over the network
      through run_commands would route around a declared role boundary using the
      shell -- capability laundering, and precisely the shape of thing
      tools/check_runtime_bindings.py exists to prevent. I will not authorise it.
      (2) METHODOLOGY, AND THIS IS THE REASON I WOULD GIVE EVEN IF (1) DID NOT
      HOLD. An adjudicator must be shown to work on objects whose ground truth
      the producer CONTROLS before it is fed objects whose ground truth it does
      not. Feeding published paths into an unvalidated adjudicator confounds "the
      adjudicator is wrong" with "the census entry was transcribed wrong", and
      those two failures are indistinguishable in the artifact. Batch 1's
      controls -- planted-positive recall, the random-negative null against a
      plantable census, observation collision, and the SHA-0 nearby-object
      control -- are ALL fully exercisable at census size zero. The single thing
      acquisition would add, testing correctness on published paths, is already
      disclosed as the contract's honest ceiling in its scale_relevance and
      interpretation_limits and is named as batch 2's object.
      (3) IT IS A RESTRUCTURE, NOT AN AMENDMENT. An acquisition producer needs a
      new TASK id (I have none and cannot mint), a new archive assignment, and a
      new serial stage ahead of the executor. That is a different batch shape,
      and it would push batch 1 past its declared 3000 s of a 10800 s campaign.
      (4) The idea-generator TASK-20260824-873dc9 already holds web_search and is
      already tasked with the acquisition-TARGET list. That is the right amount
      of web use for batch 1: name and reach-check the sources, acquire nothing.
    what_is_re_scoped_now_because_it_is_free: >-
      TASK-20260824-873dc9 IS AMENDED BEFORE DISPATCH, and it is the task that
      most needed it: it is the ONLY batch-1 task holding web_search, its
      committed constraints named only the quarantine PATH, and it is therefore
      the exact agent that would have walked into the trap in good faith. Three
      restriction-only additions, all in AMD-20260824-DIFFP-ACQ-1: it may not
      fetch Tier-A content by any route; it must tier-label every entry in
      acquisition-targets.yaml; and it must attest, per fetch, which side of the
      firewall the fetch landed on. Its budget, deliverables, completion gate and
      claim ceiling are UNCHANGED. TASK-20260824-c6625a receives one
      restriction-only pointer (a new invalidation rule IR-10 forbidding network
      acquisition by any route, since it holds run_commands and could otherwise
      curl); no success criterion, control, seed, metric or budget of
      EXP-DIFFP-fe894e is touched.
    resource_check_on_the_firewall: >-
      ASKED, AND IT RETURNED SOMETHING. The obstruction here is the BCP-1
      firewall: it blocks the MD5 census. Read the other way round, BCP-1 already
      defines exactly the object a contamination-free census needs -- a
      `pre_registered_expected_answer_digest`, the sha256 of a canonical
      serialisation of the path block. A candidate path can be canonicalised and
      hashed the same way and compared to that digest WITHOUT ANY AGENT EVER
      READING THE PATH. A DIGEST-ONLY MD5 CENSUS is therefore buildable, and
      would give exact-match membership at zero contamination cost. Orbit-level
      membership would additionally require the digest to be taken over the
      canonical form under this goal's equivalence, which means the
      canonicalisation must happen inside the quarantine boundary by a tool
      rather than by an agent. THIS IS A DESIGN PROPOSAL, NOT A RESULT, NOT
      VALIDATED, AND NOT AUTHORISED HERE: it is filed as a batch-2 candidate in
      AMD-20260824-DIFFP-ACQ-1 and enters the ranking on its merits like any
      other proposal. Recording it is what stops the firewall being read only as
      a cost.
    unchanged_by_this_amendment:
      - Batch-1 claim ceiling remains `analyzed`, never `supported`.
      - No path is claimed new; no cryptanalytic improvement is claimed.
      - >-
        No search over the difference space is authorised (EXP-DIFFP-fe894e
        IR-8), and no acquisition at all is authorised in BATCH-f8bf86.
      - >-
        Every success criterion, control, seed, metric, budget and stopping rule
        of EXP-DIFFP-fe894e stands exactly as frozen.
      - >-
        The Coordinator's prior P-1..P-5 stands exactly as recorded and is not
        revised by the corroboration reported above.
      - >-
        The campaign budget ceilings stand: maximum_batches 6,
        total_wall_clock_seconds 10800, max_concurrent 2. No raise is
        self-granted or requested.
