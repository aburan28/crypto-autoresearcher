coordinator_decision:
  id: DEC-20260726-008
  context: >-
    Closing decision for GOAL-ECDLP-001 BATCH-006, the sixth and final batch under
    campaign_budget.maximum_batches 6. Two independent non-originating sessions reviewed the
    H-GGM-001 + EXP-GGM-001 version 1 generic-group simulability package as frozen at commit
    5de2db97: TASK-20260726-005 (report REV-20260726-005, reviewer) returned terminal_verdict
    REVISE with 8 blocking and 7 non-blocking objections, and TASK-20260726-006 (report
    RT-20260726-001, red team) returned 15 objections of which exactly one, OBJ-02, is recorded
    as blocking approval and execution of version 1. Neither session read the other's output.
    TASK-20260726-007 recovered and bound the two BATCH-004 archive receipts. No experiment was
    implemented or executed in this batch, and none has ever been executed for EXP-GGM-001. This
    decision selects the BATCH-006 negative_branch, disposes of EXP-GGM-001 version 1, fixes the
    status of H-GGM-001, records one unresolved archive-integrity gap, and applies the campaign
    budget stop condition.
  decision: revise
  target_ids:
    - EXP-GGM-001
    - H-GGM-001
    - GOAL-ECDLP-001
    - BATCH-006
    - TASK-20260726-004
    - TASK-20260726-005
    - TASK-20260726-006
    - TASK-20260726-007
    - TASK-20260726-008
  rationale:
    - >-
      BRANCH SELECTED (exactly one). BATCH-006 batch.yaml negative_branch applies and is selected:
      both sessions found the control gate unsound and the scale-independence argument
      unsupported, so a scoped revise bounded to the reviewed specification version is recorded,
      the first unmet obligation is named, and no execution is authorized. positive_branch does
      not apply because neither session accepted the package. inconclusive_branch does not apply
      because the two sessions do not disagree: they reach the same do-not-approve disposition
      from two different charters, and converge on one identical, paper-checkable defect
      (REV-20260726-005 BO-3 = RT-20260726-001 OBJ-05).
    - >-
      VERB IS REVISE, NOT REJECT_SCOPED. Every defect found is a defect of the specification
      document. Nothing was executed, so no observation exists that could contradict a prediction
      of H-GGM-001, and there is therefore no refutation artifact of any kind (no counterexample
      certificate, no derivation note about an oracle, not even a replicated empirical
      observation) that a rejection could rest on. Both reports say so directly: the reviewer
      records "REVISE rather than FAIL because the underlying question survives every objection,
      every blocking objection carries a concrete and bounded fix, the specification is still
      status review_required with approved_by null, and nothing has been executed"; the red team
      records does_not_block "The research direction, or running a small Python module on toy
      curves". reject_scoped would assert a scoped mathematical negative that no evidence in this
      repository supports, and is forbidden here.
    - >-
      EXP-GGM-001 IS NOT APPROVED FOR EXECUTION. Its status stays review_required and approved_by
      stays null. No execution is authorized by this decision, in this campaign or in any
      successor campaign, for version 1 at sha256
      09931848d2dbe55aa998857db9653d763a5b327a2016dd56e8eab942a8a03c56. The blocking reason for
      execution is RT-20260726-001 OBJ-02: analysis_methodology.scale_independence_note is a
      standing instruction frozen into the protocol requiring the analyst to assert a supra-toy
      tier for any SIMULABLE verdict and forbidding presentation of such a verdict as toy-tier
      evidence, which contradicts docs/claims-and-verification.md ("does not relax the ceiling
      above") and inverts AGENTS.md rule 7. That harm occurs on execution regardless of whether
      any verdict is correct. The first unmet obligation, per REV-20260726-005, is the control
      gate: it cannot discriminate a sound test from an unsound one, because its answers are
      inside its input and its four controls are all extremal.
    - >-
      THESE ARE SPECIFICATION DEFECTS, NOT REFUTATIONS OF THE DIRECTION. The reviews did not
      establish that any of the jet, elliptic-net, incidence, or endomorphism oracles is simulable
      or non-simulable, and neither report claims to. They established that the frozen protocol
      cannot decide the question it poses. The underlying screen remains the right question
      (REV-20260726-005 valid_aspects item 1; RT-20260726-001 blocking_finding.does_not_block), and
      it survives this decision intact for a separately budgeted successor campaign.
    - >-
      CORROBORATION. The single defect both sessions found independently is the discrete_log
      control's expected_witness, which requires two encodings representing the same abstract group
      relationship but requiring different k. Since k is determined by the abstract pair, no such
      object exists. Two non-communicating sessions reaching this from different charters is
      stronger than either alone, and the argument is checkable on paper against the frozen text
      without any code. This is the most load-bearing single item in EV-ECDLP-007.
    - >-
      H-GGM-001 STATUS: UNCHANGED AT specified. It does not advance to approved, because its sole
      test is withheld from execution by this decision. It does not move to weakened, rejected, or
      inconclusive, because those are evidence-driven transitions and no evidence about its
      mechanism exists: no run, no measurement, no counterexample certificate, no derivation note
      about any oracle. A defective test is not a refuted hypothesis. No edit is made to
      ledger/hypotheses/H-GGM-001.yaml by this task, which is consistent with recording no status
      change.
    - >-
      RECORDED DEFECTS INTERNAL TO H-GGM-001, FOR CORRECTION BY A SUPERSEDING RECORD ONLY.
      (a) falsification_conditions item 4 is stated backwards. It reads that if simulator overhead
      C grows with N for an oracle classified SIMULABLE, "the Shoup lower bound does not apply to
      that oracle". RT-20260726-001 OBJ-03c shows the inference is wrong in the direction that
      manufactures false openness: a C-overhead simulator converts any T-query algorithm using the
      augmented oracle into a C*T-query generic algorithm, so Shoup gives C*T = Omega(sqrt(p)),
      i.e. T = Omega(sqrt(p)/C). With C = Theta(log N) the bound becomes Omega(sqrt(p)/log p) and
      the exponent is still 1/2. The correct invariant is polylog versus polynomial overhead, not
      constant versus non-constant, so as written this falsifier would reclassify a still-closed
      oracle as "effectively non-simulable" and emit a non-generic signal that is not there. This
      Coordinator adopts that correction as the recorded reading of the defect; it is a
      derivation-level argument offered for independent checking, not a theorem, and it does not
      by itself decide any oracle's status. (b) The mechanism's witness definition ("an encoding
      pair that are generic-model-indistinguishable but yield different O-answers") is satisfied by
      relabelling the pure_generic control and never states the equivariance property actually
      intended (REV-20260726-005 BO-4; RT-20260726-001 OBJ-12). (c) assumptions item 2 scopes the
      constructibility guarantee to the eight listed subjects, which concedes the control gate's
      inference (RT-20260726-001 OBJ-04). (d) interpretation_limits item 1 assigns the confirming
      branch a stronger tier than the disconfirming branch of the same module
      (RT-20260726-001 OBJ-09). Per AGENTS.md rule 4 and the immutability convention, none of
      these may be fixed by overwriting H-GGM-001; each requires a superseding hypothesis record
      in the successor campaign.
    - >-
      UNRESOLVED ARCHIVE-INTEGRITY GAP, NAMED AND NOT WAIVED. Archive task TASK-20260726-004 (the
      BATCH-004 ledger archive) cannot reach verifier-clean completed state. Its commit is
      recovered and fully bound: 9a848838bee3f4128d47f34261e0e470b713e245, parent 6a4f0705,
      ancestor of HEAD, exactly the 6 declared paths, no deletions, all 6 SHA-256 values matching
      commit content, and all 3 record IDs present in the message. The sole failing check is
      message_contains_task_id: the published message never contains the literal string
      TASK-20260726-004 (DEC-20260726-004 shares the numeric suffix but is a different
      identifier). The defect lives in an immutable, already-published commit message and is
      irreparable without rewriting pushed history, which AGENTS.md forbids. The card therefore
      stays blocked. This decision grants no waiver and performs no promotion. Any future closure
      must be an explicit, separately authorized Coordinator waiver that records this exact
      verifier check by name, never a silent promotion or a weakened expectation. Nothing about
      this gap is evidence for or against any hypothesis, and it does not weaken EV-ECDLP-006 or
      DEC-20260726-004, whose artifacts are committed and content-verified.
    - >-
      CAMPAIGN BUDGET STOP CONDITION APPLIED. BATCH-006 exhausts campaign_budget.maximum_batches 6
      (BATCH-001 through BATCH-006, with BATCH-005 consumed by the undocumented slot recorded in
      DEC-20260726-007 and in the goal's BATCH-005 checkpoint). Neither completion criterion is
      met: no candidate attack improvement was independently reproduced or proved with end-to-end
      cost accounting, and no novel technique was independently validated with a reproducible
      improvement to a decision-critical attack stage. pause_conditions item 1 therefore applies
      and GOAL-ECDLP-001 moves to status paused, not completed. An exhausted budget with a
      withheld candidate never completes a goal.
    - >-
      LATEST VERIFIED COMMIT. The goal's latest_verified_commit advances to
      ab59e26bbf5fb06248b3a4ae2fb4306fb57c8144, the BATCH-006 opening commit, whose verification
      is attested by the calling session against Git: reachable, parent
      9b77791f, exactly 9 declared paths, all 9 recorded hashes matched, and all 8 record IDs
      present in the message. It is strictly later than the prior value 6a4f0705 and it is the
      latest commit in this goal whose full post-commit verification has been performed.
    - >-
      RESIDUAL COORDINATION GAP RECORDED, NOT REPAIRED. The BATCH-006 dispatch queue
      (coordination/goals/GOAL-ECDLP-001/batches/BATCH-006/dispatch_queue.json) still records all
      four task cards in state queued, although TASK-20260726-005, TASK-20260726-006, and
      TASK-20260726-007 have delivered their artifacts and TASK-20260726-008 is executing. That
      file is outside this task's declared write_scope, so it is deliberately not edited here. It
      is the same class of stale-card defect DEC-20260726-007 repaired for BATCH-004 and it needs
      a separately authorized reconciliation before this queue is used for dispatch again.
  evidence_refs:
    - EV-ECDLP-007
    - EV-ECDLP-006
  limitations:
    - >-
      POLICY-AXIS RULE 12 GAP. Both review sessions recorded requested_policy review-xhigh,
      resolved_model_id claude-opus-5, fallback_used true, and
      equivalence_to_requested_policy_claimed false. AGENTS.md rule 12's independent review-xhigh
      obligation is satisfied on the INDEPENDENCE axis and NOT on the POLICY axis. This limitation
      travels with every downstream use of REV-20260726-005, RT-20260726-001, EV-ECDLP-007, and
      this decision.
    - >-
      SHARED SUBSTRATE. Both reviews resolved to the same model identifier under the same harness.
      Their agreement is corroboration by two non-communicating sessions, not by two independent
      model families.
    - >-
      TOY CEILING. Nothing above claim_tier toy is supportable from this package at any verdict.
      The ceiling is mechanical (the specification's own --bits 8,12,16, all at or below 32) and
      is independent of any repair to the protocol's reasoning. proof_status certificate is
      unreachable for a simulability witness under the current harness.
    - >-
      NO EXECUTION OCCURRED. EXP-GGM-001 has never been implemented or run. This decision rests
      entirely on review of frozen text at bound hashes. It contains no measurement, no attack, no
      cost comparison against rho or BSGS, and no statement about whether any oracle is
      GGM-simulable.
    - >-
      OBJECTIONS ARE RECORDED, NOT ADJUDICATED ONE BY ONE. This decision does not certify each of
      the 8 blocking and 15 red-team objections as correct. It records that two independent
      sessions reached a do-not-approve disposition, that they converge on one paper-checkable
      internal contradiction, and that the package is therefore not eligible for approval. The
      Omega(log N) endomorphism argument and the Theta(B^m) incidence argument are
      derivation-level arguments offered for independent checking; neither was independently
      verified in this batch.
    - >-
      BATCH-004 GAP OPEN. The TASK-20260726-004 message_contains_task_id defect is unresolved and
      not waived, as stated in the rationale.
    - >-
      BATCH-005 GAP UNCHANGED. The work carried in the undocumented BATCH-005 slot
      (EXP-IC-001 execution, EXP-STR-002 extension, and the design of H-GGM-001 and EXP-GGM-001
      itself) still has no batch record, no snapshot archive, and no independent review chain of
      its own. This batch supplies the missing independent review of the H-GGM-001 + EXP-GGM-001
      design only; DEC-20260726-005 and DEC-20260726-006 remain as recorded and are not reopened.
    - >-
      HASH BINDINGS NOT COMPUTED HERE. The SHA-256 bindings and the commit and parent identities
      for the archive that carries this decision were not computed by the authoring session, which
      has no shell access. They must be computed from Git object content and verified by the
      committing session before this decision is treated as durable or official.
  next_actions:
    - >-
      GOAL-ECDLP-001 is paused under pause_conditions item 1. Resume requires a new, separately
      budgeted campaign whose first task is a Coordinator-authored design revision producing
      EXP-GGM-001 version 2 as a superseding specification record (never an edit to version 1),
      together with a superseding H-GGM-001 record correcting falsification condition 4 to the
      T = Omega(sqrt(p)/C) form. Version 2's first edit is a single frozen definition of
      "simulable" in lazy-encoding-simulator form with all eight expected verdicts re-derived by
      hand under it and sealed into a separately hashed, withheld expectation file, then the
      remaining items of REV-20260726-005 BO-1 through BO-8 and RT-20260726-001
      required_controls_before_approval 1 through 8, with claim_tier set from tested instances and
      scale-independence carried only by proof_status derivation backed by an archived,
      independently checked construction note. No implementation and no execution of EXP-GGM-001
      version 1 is authorized.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No KN-FIND is warranted. The promotion gate requires a support or reject_scoped decision
      backed by replicated or strong evidence; this decision is revise and EV-ECDLP-007 is
      preliminary, direction neutral, proof_status empirical_only, with zero executed instances.
      Two candidate promotions were considered and rejected on the merits. (1) The discrete-log
      expected_witness impossibility (BO-3 / OBJ-05) is a fact about one field of one frozen
      specification version, not a durable finding about ECDLP or about generic-group
      simulability; it belongs in the review artifacts and in this decision, and it will be
      obsolete the moment version 2 supersedes the field. (2) The observation that a C-overhead
      simulator yields T = Omega(sqrt(p)/C), so polylog overhead leaves the exponent at 1/2, is
      the standard Shoup transfer argument and is already the content of KN-TECH-005; recording it
      as new would overstate a correction to a local record as a research finding. Nothing in this
      batch is a durable claim about ECDLP, about any augmented oracle, or about any attack stage.
  decided_by: coordinator
  decided_at: "2026-07-26T23:30:00-07:00"
