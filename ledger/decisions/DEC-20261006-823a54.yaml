  context: >-
    /design-experiment, one contract, and three new proposals.
    IDEA-20261006-b87de8 is on origin/design/frob-1e54b5-theta and is
    not on origin/main. The question is RQ-ECDLP-623a32. No hypothesis
    or experiment on origin/main cites that full id. The branch
    design/ecdlp-b87de8 was created from origin/main at
    96d15ed85c00fbbdd6205beb2bdf02099c576fb5 and git merge origin/main
    reported already up to date. The copied proposal bytes hash to
    08feed84651639dcdc34c79327c24d661d3f768f807f3dd422a46f94f95df0a8.

    The contract freezes p = 37, A = 1, the first eligible B in
    {1,...,18}, the least-nonnegative cut at 18, 2000 size-matched
    relabelings, and the integer test of |2a - n| against rank 1980.
    Success is the source idea's prediction. The concrete negative is
    a finished numerator at most that rank. No point was enumerated
    in this session and no agreement count was recorded.

    This session opened KR-RHO-13bf67, KR-RHO-fb88e6, KR-RHO-0528e7,
    KR-IC-5ea2f8, KR-IC-5931ee, and the Theorem C paragraph of
    KN-FIND-ffe1df. Those rows are not a measurement of |f - 1/2|.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. Success fails
    when a finished numerator is at most rank 1980. No field required
    for approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - A finished numerator at most rank 1980 is reachable as a recorded outcome, so success is not automatic.
    - Negation, the curve identity, and the exact-law gap are the instrument controls.
    - A null-law gap above 2 is not scored as a percentile miss.
    - This session did not compute an agreement and did not claim that the exponent moves.

  evidence_refs: []
  limitations:
    - The measurement covers one toy prime and one curve. It does not transfer to cryptographic primes or to a walk.
    - A frequency gap is not a change in rho cost.
    - A negation failure or an identity failure is not a numerator at most rank 1980.
    - A timeout is failed_infrastructure and is not a mathematical negative.
    - This decision authorizes a later execution. It does not start one.
    - This decision does not edit a goal head.

