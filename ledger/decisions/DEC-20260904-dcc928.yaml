  decision_rationale_for_verb: >-
    Batch-opening decision for the scoped fidelity-correction pass named as
    RANK 1 by the goal head after DEC-20260904-031ed2 (the ledger archive of
    BATCH-e479db, now on main via PR 729 / merge commit 36f2129d8). The pass
    closes successor requirements RT2-SR-1..4 - the four REVISE-class
    wording/table-fidelity findings from joint J-R2 (TASK-20260904-937822)
    that touch the RAT-3-binding preregistration text and the pricing
    tables. DEC-20260904-031ed2 states these must be closed before any
    future Coordinator decision may authorize execution of D-1, D-2, or any
    successor design derived from the FM-cascade candidate; this batch is
    that gate-closing work. Design-only, zero arms.

  context: >-
    IDEA-20260904-06c396 is the reviewed FM-cascade candidate promoted by
    DEC-20260904-031ed2 after independent joints J-R1 (HOLDS, sealed blind
    re-derivation) and J-R2 (HOLDS_WITH_FINDINGS). J-R2's four REVISE-class
    findings (RT2-SR-1: margin-rationale rewrite; RT2-SR-2: written-cascade-
    order routing table with corrected decay power 0.952538 and OBJ-5B
    comparator 0.989349 -> 0.884236 as phi runs 1.0 -> 2.0; RT2-SR-3: byte
    fidelity of the verbatim AMEND-1/NARROW-3 quotes or relabeling; RT2-SR-4:
    naming the OBJ-5B split point) are deterministic, spec-driven corrections
    to an unexecuted proposed design. Core rule 4 applied: the correction
    pass creates a NEW corrected proposal record (IDEA-20260904-6aed0b,
    minted, superseding IDEA-20260904-06c396) rather than editing the
    promoted record in place. RT2-SR-5 (the Coordinator's adoption trade on
    the 0.171940 range-wide false-plateau bound and the 11-17% disclosed
    residual) is RESERVED to the execution-gate decision and is NOT part of
    this pass.

  ecc_priority_note: >-
    GOAL-AES-003 is classified non-ECC (tools/ecc_priority.py --classify).
    The ECC worklist holds 273 open ECC ideas (ranked design work under
    instruction 3). This non-ECC batch is dispatched because GOAL-AES-003 is
    the user-directed active campaign of this session (CLAUDE.md session
