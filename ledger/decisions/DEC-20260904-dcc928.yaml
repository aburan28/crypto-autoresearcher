    TASK-20260904-148ed6. The audit checks that the corrected proposal
    differs from IDEA-20260904-06c396 by exactly the four named fixes plus
    the identity block; that the corrected quantities are independently
    re-derived (chi2_0.975(3) = 9.348404; decay power 0.952538; OBJ-5B
    comparator 0.989349 at phi = 1.0 falling to 0.884236 at phi = 2.0 under
