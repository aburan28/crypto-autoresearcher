    - id: NA-6
      role: idea-generator (via handoff)
      text: >-
        Take up EV-SEMBIN-07960c obstruction.resource_check. Retrieve and read
        the Boolean semi-regular Hilbert series source, since the Coordinator's
        citation is only recalled. Re-derive d_reg for the (n, N) grid from
