    - ledger/evidence/EV-SEMBIN-c71cad.yaml (read in full)
    - ledger/corrections/CORR-20260929-616d03.yaml (read in full)
    - research/FFD_SEMAEV_MEASUREMENT1.md (read in full)
    - ledger/decisions/DEC-20260913-74e208.yaml (precedent for replicated-computation reject_scoped and queued promotion)
    - EV-SEMBIN-07960c
    - CORR-20260929-d6ddce

  limitations:
    - >-
      Toy tier only: N <= 8, n <= 7, one curve, characteristic 2, m = 2. It
      is a re-computation on MEASUREMENT1's systems, with nulls matched to a
      single Semaev system per cell and correlated null seeds. The null is
      matched on degree profile only.
    - >-
      d_ff is the differencing definition, which is not Nagao's Definitions
      1, 5 or 6 and not the solving degree. Nothing here bears on
      subexponentiality, Proposition 5, Assumption 1, ECDLP cost, or any
      curve's security.
    - >-
      Nothing here bears on this goal's completion criteria. Criterion 3 asks
      for the map between Nagao's d_F, d'_F and the program's Macaulay-rank
      statistic. O-8's identification of the formal convention with the
      F_2[u] {f} union S_fe filtration is relevant background for that map,
      and it is not the map.
    - >-
      This Coordinator has no shell. It ran nothing and computed no hash. It
      did not parse the YAML it wrote and did not run tools/validate_ledger.py
      or tools/check_review_independence.py. It read the validator's
      artifacts through the report, not file by file. Its scoring was done by
      reading results.json.
    - One model family serves every role by runtime inheritance. Session independence is real; model independence is not claimed.

