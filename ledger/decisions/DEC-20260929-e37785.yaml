  evidence_refs:
    - experiments/EXP-SEMBIN-473340/validation-report-20260929.yaml (VAL-20260929-sembin473340; read in full)
    - experiments/EXP-SEMBIN-473340/runs/RUN-SEMBIN-3a4248/results.json (read in full; scored by hand)
    - experiments/EXP-SEMBIN-473340/runs/RUN-SEMBIN-3a4248/manifest.yaml, manifest.json, prelaunch_test.log (read in full)
    - experiments/EXP-SEMBIN-473340/specification.yaml (read in full)
    - ledger/hypotheses/H-SEMBIN-d8c4fe.yaml (read in full)
