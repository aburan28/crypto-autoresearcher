        fixed n' and n' at fixed n, so the (n, N) reading and a pure-n' trend
        make different predictions. It changes no status by existing.
    - id: NA-7
      role: coordinator ranking (not dispatched here)
      text: >-
        MEASUREMENT1 N3 (n' = 5 to 6, N = 10 to 12). Ranked behind NA-5 and
        NA-6. The trend claim it would test has just failed at n = 7, and
        without NA-6's framing a larger-n' run would repeat the P3 design
