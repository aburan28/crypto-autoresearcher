coordinator_decision:
  id: DEC-20260929-e37785
  id_provenance: >-
    Pre-minted and --check verified by the top-level session on 2026-09-29,
    together with EV-SEMBIN-07960c and CORR-20260929-d6ddce. This Coordinator
    holds no shell and minted nothing.
  recorded_at: '2026-09-29'
  decided_at: '2026-09-29'
  decided_by: coordinator
  goal_id: GOAL-SEMBIN-fcb7a2
  question_ids:
    - RQ-DREG-bd6c86

  decision: reject_scoped
  decision_label: >-
    Evidence review of RUN-SEMBIN-3a4248 (EXP-SEMBIN-473340).
    VAL-20260929-sembin473340 passes the run as valid-with-limits, with a blind
    48/48 re-derivation. Of the six preregistered outcomes, P1 and P2 hold and P3
    FAILS under both the reduced and the formal convention. H-SEMBIN-d8c4fe is
    REJECTED, scoped to exactly its declared systems and conventions. What
    survives is recorded as it stands: Semaev median 2 in all 8 cells, the null
    median above it by at least 1 in all 8 cells (an upper bound), and the null
    rising with n' at n = 4, 5 and 6. EV-SEMBIN-07960c is contradicts /
    replicated / empirical_only. The values in research/FFD_SEMAEV_MEASUREMENT1.md
    section 2 are superseded, and that note is not edited.
    CORR-20260929-d6ddce records the definitional scope note ordered by
    DEC-20260929-0d6685 NA-5.

  context: >-
    DEC-20260929-d75c82 made the MEASUREMENT1 section 2 comparison uncitable
    until it was re-measured with the XOR product, because it had been computed
    with the set-OR product (CORR-20260929-616d03). DEC-20260929-0d6685 approved
    EXP-SEMBIN-473340 v1. That contract carries MEASUREMENT1's own three claims
    as preregistered P1-P3, scored separately under two named conventions,
    with the superseded instrument kept as a transcription control (C1).
    RUN-SEMBIN-3a4248 exited 0 in 22.5 s. The independent validator passed it,
    re-derived every distribution blind, scored the six outcomes with its own
    scorer, and showed that the formal convention equals the F_2[u]
    {f} union S_fe Macaulay filtration for new_falls/d_ff. The Coordinator
    re-applied scoring_rule to results.json by reading it and got the same
    medians and outcomes in every cell.

  target_ids:
    - H-SEMBIN-d8c4fe
    - EXP-SEMBIN-473340
    - RUN-SEMBIN-3a4248
    - EV-SEMBIN-07960c
    - CORR-20260929-d6ddce
    - EV-SEMBIN-c71cad
    - DEC-20260929-d75c82
    - RQ-DREG-bd6c86

  validity_check:
    expected_run_count: 1 expected (maximum_runs 1), 1 present (RUN-SEMBIN-3a4248), exit 0
    manifest_schema: >-
      Complete enough to register and to score. It has gaps (PD-6 below):
      there is no separate gate_exit_code field, the boolring.py sha256 at
      launch is not recorded, parameters (field_bits, N, Dmax, conventions) are
      absent, the serving model is absent, certificate.verified/verifier are
      absent, and memory is not recorded.
    seed_integrity: >-
      Seeds are as specified. C1 reproduces all 16 published distributions,
      both through the runner's legacy column and through the validator's own
      set-OR implementation on independently rebuilt systems.
    raw_summary_agreement: raw-result.json is byte-identical to results.json (sha256 9dd5d353c680...), which equals manifest.yaml raw_result_sha256
    control_comparability: >-
      PASS. C1 pins the systems, so reduced and legacy differ in the product
      only. C2 passes on re-run. C3 and C4 pass. Unlike DEC-20260929-d75c82's
      case, the observable itself was checked independently: the validator's
      blind kernel was written from the written definitions before any
      producer code was read.
    invalidation_rules: IR-1 to IR-9 not triggered (VAL-20260929-sembin473340 check 1)
    conclusion: >-
      Valid and scorable. The manifest gaps are recorded and not repaired, and
      the run is NOT returned to the executor, for three reasons. No missing
      field bears on a scored quantity. Each is recoverable from committed
      artifacts or was verified by the validator at the commit. And
      results.json is independently reproduced. A run record is immutable, so
      any fill-in would be a supplementary record, and this decision does not
      order one.

  scoring:
    applied_by: coordinator (reading results.json) and validator (score.py), independently, with identical results
    P1_reduced: holds
    P2_reduced: holds
    P3_reduced: fails (n = 7, null median 3 at n' = 3 and 3 at n' = 4)
    P1_formal: holds
    P2_formal: holds
    P3_formal: fails (n = 7, null median 3 at n' = 3 and 3 at n' = 4)
    censoring: no None and no d_ff = 1 in any cell, kind or convention
    hypothesis_consequence: >-
      Per success_criterion, H-SEMBIN-d8c4fe is confirmed for convention c
      only if P1_c, P2_c and P3_c all hold. Per falsification_criterion, the
      P3 failure falsifies it for both conventions on these systems.

  success_criterion_handling: >-
    No success criterion, falsification criterion or scoring rule is changed,
    and no protocol_amendment is written. The outcomes are applied exactly as
    frozen. One interpretive clause is SCOPED rather than applied literally,
    and the scoping is stated here so that it is visible. interpretation_map
    P2_c_or_P3_c_fails says "for c = reduced ... the published pattern was an
    artifact of the set-OR product". Reduced and legacy differ in the product
    only, so the product is the established cause of exactly the changes
    observed. At median level that is one change: the (7,3) null went 2 -> 3,
    which is what made the published P3 hold at n = 7. Reading the clause as
    "the whole null-rises and deficit pattern was an artifact" would
    contradict the same run: the n = 4-6 rises and all P2 deficits are
    unchanged in median under the product correction. This narrows a causal
    attribution sentence, and it moves no outcome. The map's other clause is
    applied as written: the MEASUREMENT1 comparison as published may not be
    cited for either convention.

  refutation_basis:
    proof_status: empirical_only (declared on EV-SEMBIN-07960c)
    why_reject_scoped_is_permitted: >-
      docs/claims-and-verification.md forbids reject_scoped on a SINGLE
      UNREPLICATED empirical-only run. This one is replicated in the sense
      the claim needs. The claim is a deterministic statement about a fixed,
      declared set of systems, and an independent blind kernel recomputes all
      48 distributions identically, including both n = 7 null cells in both
      conventions. The same standard of replication backed the rejection of
      H-SEMBIN-b1708c (DEC-20260913-74e208).
    why_not_stronger: >-
      No packaged counterexample certificate with its own verifier exists,
      and the system construction is shared by producer and validator. No
      derivation explains the flat n = 7 step.
    archived_before_decision: >-
      results.json is in snapshot commit cfeb0b6d04. The validator artifacts
      (blind_all_cells.json, compare_blind_vs_runner.json, score_results.json)
      must be committed no later than the ledger archive of this decision
      (NA-1). This decision is not official until that commit verifies.

  closure_gate:
    obstruction: >-
      EV-SEMBIN-07960c.obstruction. Quantity: Delta_n = null median d_ff at
      (n,4) minus at (n,3). Value: Delta_7 = 0 under both conventions (against
      +1 at n = 4, 5, 6), with margins to flipping. It is measured by
      RUN-SEMBIN-3a4248 over exactly the (7,3) and (7,4) null systems.
    scope_match: >-
      The rejection asserts nothing wider than the obstruction's scope. The
      hypothesis's P3 is a universal claim over n in {4,5,6,7} on these
      systems, and one measured failing n falsifies it there. No claim is made
      about other seeds, cells, scales or nulls.
    resource_check: >-
      Examined (EV-SEMBIN-07960c). Under a semi-regular Boolean reading, in
      which the null d_ff is a function of (n, N) jointly, the flat n = 7 step
      is predicted. That formula is RECALLED, the Coordinator's arithmetic on
      it is unverified, and the fit is post hoc. It is routed to the
      idea-generator (NA-6) as an ordinary proposal and changes no status.
    lane_closed: >-
      NONE. Only H-SEMBIN-d8c4fe closes. The Semaev-versus-null first-fall
      comparison under RQ-DREG-bd6c86 stays open, and its decisive next step
      is N1 (NA-5).

  official_transitions:
    H-SEMBIN-d8c4fe:
      from: approved
      to: rejected
      scope: >-
        REJECTED ONLY AS STATED: the conjunction P1 and P2 and P3, for each of
        the reduced and formal conventions, on exactly MEASUREMENT1's 80
        Semaev and 200 null systems (cells {4,5,6,7} x {3,4}, the specified
        seeds, Dmax 6), for the differencing d_ff with the XOR product. It is
        NOT a rejection of P1 or P2, which hold, and not of the null rise at
        n = 4, 5, 6, which holds. It says nothing about any other system,
        null, scale or definition.
      basis: EV-SEMBIN-07960c; RUN-SEMBIN-3a4248; VAL-20260929-sembin473340
    EXP-SEMBIN-473340:
      from: approved
      to: analyzed
      basis: >-
        Its one run, RUN-SEMBIN-3a4248, completed validly and has been
        reviewed and scored. The specification's status field was never
        advanced past approved; that is recorded here and not repaired.
  status_field_updates_pending:
    note: >-
      NOT APPLIED BY THIS COORDINATOR. Program precedent applies an official
      transition by setting the record's status field and appending a
      status_history entry (H-SEMBIN-b1708c under DEC-20260913-74e208). This
      engagement was instructed to edit no existing record, so both files
      still read "approved". The transition is official on this decision's
      verified commit. Applying the append-only update is left to the
      session's decision (NA-2). The exact entries to append are given below.
    H-SEMBIN-d8c4fe: "status: rejected; status_history += {status: rejected, at: '2026-09-29', by: coordinator, ref: DEC-20260929-e37785, evidence: [EV-SEMBIN-07960c, RUN-SEMBIN-3a4248], note: scoped to the declared systems and both conventions; P1 and P2 hold, P3 fails}"
    EXP-SEMBIN-473340: "status: analyzed; status_history += {status: analyzed, at: '2026-09-29', by: coordinator, ref: DEC-20260929-e37785, note: RUN-SEMBIN-3a4248 completed_valid and reviewed}"

  rationale:
    - >-
      The preregistration is being held to its own terms. P1-P3 are
      MEASUREMENT1's published claims, frozen before the corrected instrument
      touched these cells. The success criterion needs all three, and the
      falsification criterion fires on any one. P3 fails under both
      conventions, on an exact median comparison that an independent blind
      kernel reproduces. Refusing to reject here would be the mirror image of
      premature closure. Rejecting the hypothesis beyond its declared scope
      would be overclaiming, and the transition is written to do neither.
    - >-
      P3 failed for a reason that is specific and not a tie. At n = 7 the
      null median is 3 at both n' = 3 and n' = 4. Flipping it needs 10
      (reduced) or 5 (formal) more null draws at 4 in (7,4), or 6 or 12 more
      draws at 2 in (7,3). The published P3 held at n = 7 only because the
      set-OR product put 13/25 null draws at (7,3) on d_ff 2. The XOR product
      puts 7/25 there (reduced), and the formal filter puts 1/25.
    - >-
      Most of the published pattern survives, and it is recorded rather than
      buried under the rejection. The Semaev median is 2 in every cell. The
      null median exceeds it by at least 1 in all 8 cells, including (7,3),
      where the published deficit of 0 becomes 1. The null rises 3 -> 4 at
      n = 4, 5 and 6, and the deficit widens 1 -> 2 there. Reduced and formal
      agree at median level everywhere. Every one of these statements is
      scoped to MEASUREMENT1's systems and to a degree-profile-only null, so
      the deficit is an upper bound.
    - >-
      The "pinned at 2" claim holds as a median and not per draw. After
      correction 12/80 Semaev draws sit at 3, against 10/80 published. The
      two new ones, at (5,3), are draws whose degree-1 generator absorbs the
      section 3a degree-2 combination into V_1. That is the hypothesis's own
      mechanism caveat, and it is the same effect CORR-20260929-d6ddce records
      for the recombination witness.
    - >-
      The validator's formal-convention result is the most reusable output of
      the round. Formal equals the F_2[u] {f} union S_fe Macaulay filtration
      for new_falls/d_ff, by argument and by 296 + 39 computations, and the
      reduced convention is shown NOT to be that filtration. It discharges the
      specification's "not asserted" caveat for d_ff, and not for dim V_D. It
      also turns DEC-20260929-0d6685's definitional finding into the
      correction ordered there: whether a separation "vanishes with field
      equations" depends on Definition 1 versus differencing, not on where
      S_fe sits (CORR-20260929-d6ddce).
    - >-
      Evidence strength is replicated, and it is not called strong, because
      nothing new was sampled. The run re-computes MEASUREMENT1's own systems:
      the nulls are matched to one Semaev system per cell, P3 comparisons
      share 18/25 seeds, and the scale is toy. Replication here means two
      independent kernels agree on a fixed set. It does not mean the pattern
      recurs on fresh draws.
    - >-
      Target profile (docs/target-result-profile.md). This is corrective
      measurement on an internal note, not an exponent-moving mechanism, and
      it moves no complexity claim. Its value to the program is that a table
      other documents lean on is now either corrected or withdrawn, sentence
      by sentence.

  prior_vs_outcome:
    recorded_in: DEC-20260929-0d6685 coordinator_prior (before any run)
    C1: {prior: pass ~0.9, outcome: passed}
    P1_reduced: {prior: holds ~0.75, outcome: held}
    P1_formal: {prior: holds ~0.8, outcome: held}
    formal_vs_reduced_semaev_threes: {prior: "no more under formal (weaker, unscored)", outcome: identical in all 80 draws}
    P2_both: {prior: ~0.5 no direction, outcome: held in both}
    P3_both: {prior: ~0.5 no direction, outcome: failed in both}
    note: >-
      No prior was refuted, because the prior declined to take a direction on
      P2 and P3. The one directional mechanism the prior offered, that XOR
      admits more low-degree rows and could move null falls earlier, was
      wrong in net for the cell that mattered: at (7,3) the correction moved
      null falls LATER (2 -> 3). It was not refuted in general, since 2 null
      draws moved down.

