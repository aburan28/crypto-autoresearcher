coordinator_decision:
  id: DEC-20260907-43a1e0
  recorded_at: '2026-09-07'
  context: >-
    Evidence review of EXP-JMV-004 branch (a), RUN-JMV-004-a, now that
    Control C1 (source-transcription-fidelity gate) has been independently
    completed by VAL-20260907-b0832b (fresh validator session, did not
    produce the held transcription; verdict: passed). Per
    specification.yaml's own stopping_rules ("Conclusions are written only
    after the C1 review completes") and manifest.yaml/manifest_v2.yaml's
    own c1_status: PENDING fields, this run computed the model, grids, and
    constants table only and drew no conclusion about vacuity, non-vacuity,
    or the crossover. This decision draws that conclusion, reads the full
    400-cell crossover.csv/crossover_summary.csv record already computed
    (no re-execution of compute_grid.py; no new number invented), records
    the resulting evidence (EV-JMV-05a150), and disposes of a genuine,
    numerically-inert transcription/derivation defect in Section 4.3 of
    source_statements.md/cost_model.md that VAL-20260907-b0832b's
    digit-level check surfaced (CORR-20260907-b7e0f3).
  decision: support
  target_ids:
    - H-JMV-002
    - EXP-JMV-004
    - RQ-JMV-001
    - EV-JMV-05a150
    - CORR-20260907-b7e0f3
  rationale:
    - >-
      C1 GENUINELY PASSED. VAL-20260907-b0832b read the actual, retrieved,
      sha256-pinned arXiv:math/0411378v3 PDF page-by-page (not the plain-
      text extraction, used only to locate pages) and checked all five
      transcribed source statements digit-for-digit, in an independent
      session that did not produce the held transcription. Four of five
      match exactly or as closely as the source permits; the fifth
      (Section 4.3) is a partial match whose numeric value is
      asymptotically consistent with the source across this run's entire
      evaluated grid and whose defect (a wrong stated MECHANISM, and the
      omission of the source's own constant "e") is numerically inert here
      and is corrected separately by CORR-20260907-b7e0f3, not edited into
      the immutable run artifacts. This satisfies condition C1 and the
      coordinator_note_added_in_version_2 requirement for a digit-level,
      not sense-level, check.
    - >-
      THE GRID SUPPORTS ALL THREE OF H-JMV-002'S PRE-REGISTERED
      PREDICTIONS, checked directly against crossover.csv (spot-checked
      cell-by-cell against raw crossover.csv rows, not merely against
      analysis.md's own prose): (1) at least one (q=2^256, delta<=1) cell
      is negative under BOTH logarithm conventions -- satisfied robustly,
      e.g. bits=256,delta=0.25,C=1.0; (2) a crossover of
      overhead/sqrt(n) >= 1 exists at some tested q>=128 bits -- satisfied,
      bits=160,delta=2.0,C=1.0,bits,phi_l-typical: cost_over_rho=4152.6;
      (3) the delta required for log(k/c)>0 at q=2^256 is strictly greater
      than the smallest tested delta (0.25) -- satisfied, the smallest
      convention-robust delta is 2.0, the grid's largest value.
    - >-
      THE RESULT IS REPORTED AT ITS TRUE GRANULARITY, NOT OVERCLAIMED.
      Roughly a third of cells at delta in {0.5,1.0} region and 37/400
      cells overall flip between degree conventions, and 16/200 triples
      flip between logarithm conventions (already computed and disclosed
      by the Executor in analysis.md/cost_model.md). This decision's
      addendum to analysis.md explicitly separates the CONVENTION-ROBUST
      cells (delta in {0.25,0.5}: robust vacuity; delta=2.0, C<=4: robust
      non-vacuity) from the CONVENTION-DEPENDENT ones (delta=1.0 at low C;
      delta=2.0 at C=8), per condition E2-CONVENTION and its invalidation
      rule. No convention-dependent cell is reported as a directional
      finding.
    - >-
      CLAIM-TIER AND FRAMING DISCIPLINE HELD THROUGHOUT. Every vacuity
      statement is phrased as "Corollary 1.2 is asymptotically sound but
      concretely UNPROVEN at q=2^256 under this model" per
      specification.yaml's own claim_boundary and invalidation_rules --
      never that the corollary is false or the reduction fails. claim_tier
      remains not_applicable (zero curve instances tested at any size,
      condition E3). Nothing in this decision, EV-JMV-05a150, or the
      analysis.md addendum states or implies anything about ECDLP
      hardness, attack cost, or GRH's truth (condition C2, CTRL-GRH).
    - >-
      THE SECTION 4.3 DEFECT IS DISCLOSED, CORRECTED, AND SHOWN TO BE
      INERT, NOT SWEPT ASIDE. VAL-20260907-b0832b found the held
      transcription's stated mechanism for the k ~ pi(m)/2 approximation
      is the opposite of the source's own text, and that the source's own
      constant "e" (the unit count) is missing from constants_table.csv.
      CORR-20260907-b7e0f3 documents the correct mechanism, verifies this
      does not change any cell in crossover.csv (this run's own |D|=4q
      convention always lands in the source's own e=2 case, for every
      q>=2^64 in the grid), and recommends adding "e" explicitly in any
      future reuse of this cost model. source_statements.md, cost_model.md,
      and constants_table.csv are left immutable, exactly as committed.
    - >-
      TARGET-RESULT-PROFILE FIT. This is a concrete, cost-honest,
      GRH-conditional finding about JMV's Corollary 1.2 evaluated at
      cryptographic parameter sizes under an explicit, cited cost model --
      exactly the kind of evaluated-cost-model finding
      docs/target-result-profile.md asks the roadmap to surface, distinct
      from a pure logarithmic/constant-cofactor tweak: the finding is
      about WHERE (in delta, C, and bit size) a proven asymptotic
      separation becomes concretely vacuous or non-vacuous, and where the
      modelled reduction cost crosses sqrt(n).
    - >-
      KNOWLEDGE PROMOTION IS WARRANTED. Decision is `support` on evidence
      of strength `strong` (EV-JMV-05a150): a deterministic derivation
      independently confirmed three ways (the computation's own
      60-decimal-digit precision with zero indeterminate cells; a second
      Executor session's byte-identical re-execution plus an independent
      hand-recomputation of one cell; and VAL-20260907-b0832b's independent
      digit-level source-fidelity check). This clears the bar for a
      KN-FIND (KN-FIND-f293c6): explicit about what is convention-robust
      versus convention-dependent, states the GRH-conditionality and the
      zero-instance claim_tier throughout, and folds in the Section 4.3
      correction rather than hiding it.
    - >-
      NO ATTACK, NO CRYPTO-TIER CLAIM, NO GOAL CAMPAIGN BUDGET CONSUMED.
      Confirmed again at review time: branch (b) / EXP-JMV-003 not touched
      anywhere; claim_tier not_applicable throughout; RQ-JMV-001 remains
      detached from GOAL-ECDLP-001 and GOAL-CRYPTO-001; budget consumed is
      within the standalone RQ-JMV-001 track (well under its 2 CPU-hour /
      10-run cap; this run alone used <0.001 CPU-hours, 1 of 5 permitted
      runs).
  evidence_refs:
    - ledger/evidence/EV-JMV-05a150.yaml
    - experiments/EXP-JMV-004/reviews/VAL-20260907-b0832b.yaml
    - experiments/EXP-JMV-004/runs/RUN-JMV-004-a/crossover.csv
    - experiments/EXP-JMV-004/runs/RUN-JMV-004-a/crossover_summary.csv
    - experiments/EXP-JMV-004/runs/RUN-JMV-004-a/cost_model.md
    - experiments/EXP-JMV-004/runs/RUN-JMV-004-a/constants_table.csv
    - experiments/EXP-JMV-004/runs/RUN-JMV-004-a/manifest.yaml
    - experiments/EXP-JMV-004/runs/RUN-JMV-004-a/manifest_v2.yaml
    - experiments/EXP-JMV-004/runs/RUN-JMV-004-a/analysis.md
    - ledger/corrections/CORR-20260907-b7e0f3.yaml
    - ledger/hypotheses/H-JMV-002.yaml
    - experiments/EXP-JMV-004/specification.yaml

  limitations:
    - >-
      Zero curve instances are tested at any size; claim_tier is
      not_applicable and stays not_applicable forever, regardless of what
      q the model is evaluated at. Nothing here is a measurement on P-256
      or any curve.
    - >-
      Scoped strictly to branch (a) (the proven, explicit-constant
      GRH-conditional Lemma 4.1 bound) and to the swept grid exactly as
      computed: q in {64,...,512} bits, delta in {0.25, 0.5, 1.0, 2.0},
      C in {0.5, 1, 2, 4, 8}, both logarithm conventions, PRIMARY degree
      convention with ALT reported only as a sensitivity check. No
      unswept delta, C, or q is claimed.
    - >-
      Convention-dependent cells (delta=1.0 at C in {0.5, 1.0} under bits;
      delta=2.0 at C=8) are NOT resolved by this decision in either
      direction and remain open inside this same grid. A future run could
      narrow this only by pinning C via the Bach-Sorenson explicit
      constants (JMV ref [2]), which this program's corpus does not hold.
    - >-
      The crossover finding at delta=2.0 uses the free-precomputation cost
      variant only; the with-precomputation storage cost (order m^2
      coefficients per step) is not converted to a field-operation figure
      for lack of a cited per-coefficient bit-size formula, so the
      crossover claim does not account for that storage cost.
    - >-
      The OPTIMISTIC/CAVEATED per-step cost variants (velu, sqrt_velu,
      phi_l best-case l=2) show an earlier apparent crossover but are not
      established as applicable to this setting (a uniformly random split
      prime generically lacks cheap rational l-torsion); the PRIMARY
      phi_l/typical-l crossover at 192 bits is the load-bearing figure,
      not those.
    - >-
      CORR-20260907-b7e0f3 corrects a stated derivation, not a computed
      number; source_statements.md, cost_model.md, and constants_table.csv
      remain uncorrected in place (immutable per AGENTS.md rule 2) and a
      future run reusing this cost model with a different |D| convention
      (one that could reach disc(O) in {-3,-4}) must re-derive k using the
      source's own e-based formula rather than assuming the bare "/2".
    - >-
      This decision does not itself dispatch or design any follow-up
      experiment; RQ-JMV-001's track budget (2 CPU-hours / 10 runs total
      across EXP-JMV-001 and this branch) is not exhausted, but no new run
      is authorized here.

  next_actions:
    - >-
      H-JMV-002's status is updated from approved to supported in this same
      archive, citing this decision and EV-JMV-05a150 (see the edit to
      ledger/hypotheses/H-JMV-002.yaml made alongside this record).
    - >-
      A future Coordinator or Idea Generator session may design a version-3
      EXP-JMV-004 (or a new experiment) that: (a) narrows the C=8 and
      delta=1.0 convention-dependent cells if a citable pinned value for
      Lemma 4.1's implied constant C becomes available; (b) applies
      CORR-20260907-b7e0f3's next_action by adding "e" explicitly to a
      fresh constants_table.csv and correcting the Section 4.3 written
      reconciliation, before this cost model is reused with any |D|
      convention that could reach disc(O) in {-3,-4}. Neither is designed
      or authorized by this decision.
    - >-
      Per RQ-JMV-001's own related_records, ISOWALK-C1 (proposed,
      unscheduled) would consume EXP-JMV-003's constant (branch b, still
      blocked under DEC-20260726-002) and is unaffected by this decision;
      not actioned here.
    - >-
      No further review (validator/red-team) is dispatched by this
      decision; per this task's own instruction, this session does not
      commit or push and leaves every new/modified file in the working
      tree for the orchestrating session to review and commit.

  knowledge_promotion:
