        to the letter. A capability the coordinator role does not carry
        cannot be supplied inside it; this is a reassignment, not a producer
        failure and not a REVISE verdict on the successor.
     - id: F-3
       text: >-
        ARITHMETIC STATUS. The two attempts are pure session/tooling events.
        The orchestrating Coordinator session (which carries a bash surface)
        independently recomputed every carried figure and recorded them, with
        honest coordinator-authored provenance, at
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-fb7af9/tasks/
        TASK-20260820-e384f0/coordinator-recompute-evidence.txt. The results:
        R3a (m = 32768, formula 1/3 - (15 - log2 33)/bits), R3b (m = 98304,
        formula 1/3 - (15 - log2 11)/bits), B2 (min(1, 32768*2^(-30/3)/33)
        = 32/33 = 0.969697 at 6dp), B3 (98304*2^(-bits/18)/33, all six
        rows), the D4 m_98304 and m_32768 variants, and the D2 capacity
        residuals all REPRODUCE the predecessor's recorded values. The
        single correction this batch authorizes, R2, is confirmed: the true
        40-decimal-digit prefix of 2^(-7/6) is
        0.4454493590701696523701131027952562539936 (the predecessor's
        d4_mu_column_bits_21.exact_prefix ended ...2539935, which is
        neither a truncation nor a rounding of the true value at 40 digits).
        No carried number changes. The ECDLP arithmetic is UNTOUCHED.

