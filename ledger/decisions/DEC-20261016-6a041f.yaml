        determinism replicate, C5 independent checker)
      metrics: present (primary P1-P3 JSON pointers of raw-result.json; secondary P4, P5)
      budget: present (900 s per run, 1 GB, 2 runs, 1 worker; advisory)
      stopping_rules: present
