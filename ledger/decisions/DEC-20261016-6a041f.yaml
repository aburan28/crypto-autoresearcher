  readiness_requirement: This record takes effect only when committed together with the runbook and trial plan
    whose sha256 it names, after tools/runbook.py lint prints LINT OK and tools/newest_experiments.py
    --experiment EXP-XEDN-0c0182 reports execution_state ready on the committed tree (AGENTS.md "Approval is
    bounded by execution"). Both checks are run by the session that commits this record.
  capacity_check: The approved-unrun cap was removed on 2026-10-11 (AGENTS.md "Approval is bounded by
    execution"); approval here rests on the runnable condition only. RQ-XEDN-3bfe2e carries no goal record, so
    no goal lane is claimed.
  status_transitions:
  - record: EXP-XEDN-0c0182
    to: approved
    approved_by: coordinator
  - record: H-XEDN-5befd8
    from: specified
    to: approved
    note: Pre-run approval; not supported. The hypothesis file keeps the status it was written with at design
      (specified); this decision is the transition record.
  rationale:
  - The census decides which frozen sign arms carry ECDLP-relevant (odd-order) targets before any lift search
    spends compute on them; a falsifying value would contradict a descent-homomorphism derivation and is
    therefore highly informative either way.
  - The contract is cheap (stdlib, O(p) point enumeration per prime, at most 4624 divisibility tests per eligible (pair, arm)), deterministic, and checked
    by independent code; the two seeds make the replicate a determinism check.
  - H1 is a numbered heuristic of the source idea; P5 is its paired heuristic-validation measurement in the
    same experiment, with its low power stated.
  - Predictions, controls and the decision rule are copied from IDEA-20261016-633cb1 without adjustment.
  evidence_refs: []
  limitations:
  - Eligibility only; nothing about (+,+) dependence and no route closure.
  - F3 is a derivation not tested here; F5 is scoped to the four frozen p = 3 mod 4 primes.
  - check.py re-derives every census field with disjoint code but is producer-written; independent review
    re-derives P1-P3 blind before any status move.
  - Toy scale; 32 pairs give small accepted-cell counts, so P5 has low power.
  - Serving model for the executor-mechanical tier is unverified until the adapter probe confirms it.
  execution_dispatch:
    task: TASK-20261016-3833ab
    inference:
      policy: executor-mechanical
    runbook_session: RBS-XEDN-a7cd25
    runs:
    - {run_id: RUN-XEDN-132272, trial_id: primary-seed-20261016, seed: 20261016}
    - {run_id: RUN-XEDN-f4d646, trial_id: replicate-seed-20261017, seed: 20261017}
    depends_on: TASK-20261016-a13a59
