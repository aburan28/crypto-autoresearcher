coordinator_decision:
  id: DEC-20261016-6a041f
  recorded_at: '2026-10-16'
  question_ids:
  - RQ-XEDN-3bfe2e
  kind: protocol_approval
  context: IDEA-20261016-633cb1 (proposed, open, ECC area XEDN) claims that odd-order targets on the frozen
    Xedni-Cheon source curve have square x, so at p = 3 mod 4 a faithful pair occupies only the (+,+) arm.
    It is designed here as H-XEDN-5befd8 and the frozen contract EXP-XEDN-0c0182, a deterministic stdlib
    eligibility census over the 32 frozen pairs at p in {31,43,59,83} plus the historical p=353, with an
    independent checker and a runbook for the mechanical tier. The sibling hypotheses H-XEDN-0ea2b6 and
    H-XEDN-4a5b50 are unchanged.
  decision: approve
  decision_scope: APPROVES EXP-XEDN-0c0182 at version 1 (two trials, seeds 20261016 and 20261017) and moves
    H-XEDN-5befd8 to approved (pre-run). Authorizes execution through experiments/EXP-XEDN-0c0182/runbook.yaml
    under TASK-20261016-3833ab. Asserts nothing about any hypothesis; authorizes no attack, no lift search and
    no edit of the frozen targets.
  target_ids:
  - RQ-XEDN-3bfe2e
  - IDEA-20261016-633cb1
  - H-XEDN-5befd8
  - EXP-XEDN-0c0182
