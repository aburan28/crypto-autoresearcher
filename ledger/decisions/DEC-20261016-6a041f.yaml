  authorization: Standing user authorization of 2026-09-06 in AGENTS.md ("All is approved. Ideas/experiments
    should be always approved"); no per-experiment user confirmation is requested. The Coordinator's
    completeness check is recorded under protocol_completeness and the runnable condition under
    readiness_requirement.
  protocol_completeness:
