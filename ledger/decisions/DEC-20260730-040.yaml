    inclusion F_spec ⊆ U at recovery_spec-internal scope — is advanced from
    committed structure. OBL-2a is a definitional consequence of the recovery_spec
    exit typing and, combined with the committed BATCH-025 forward inclusion
    U ⊆ F, yields a scoped spec-internal set equality U = F_spec over the
    recovery_spec typed exit set. This is genuinely new checkable content (BATCH-025
    recorded only U ⊆ F), not a relabel, and it forces the remaining obligations
    to be named and honestly blocked: OBL-2b host-level exhaustiveness
    not_supported (REV-E1), OBL-3/OBL-4 probability composition / numeric bounds
    not_instantiated (REV-E2), OBL-5 crypto Verify body not_supported (REV-E3),
    OBL-6 CollimationSieve end-to-end not_supported (REV-E1), OBL-7 F_sim
    maps_to_F false retained, OBL-8 overlap/independence checklist_only.
  - >-
    This is NOT QM-ERROR clearance, NOT host-level exhaustiveness, NOT a
    probability / numeric error bound / security bit, NOT a crypto Verify body,
    NOT τ / joint finiteness, NOT a QUERY_MEMORY / QM-STOPPING / QM-MEMORY-MAP
    clearance or advancement, and NOT a breakthrough / completion / PIN_COMPLETE.
    QM-ERROR advances from f_union_ledger_partial to
    f_union_ledger_partial_spec_internal_reverse_inclusion_scoped. Disposition
    remains FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED; QM-STOPPING remains open with
    control_result FAIL and lane paused_pending_revisit (REV-1/REV-2 unmet; NOT
    reopened); QM-MEMORY-MAP RETAINED at
    numeric_composition_operator_protocol_toy_partial; BATCH-020 no_admissible_pin
    retained; CollimationSieve@6f9188e4 pin untouched; BATCH-022 scaffold
    unmodified; ttm-v2 retained without equating BATCH-014. Keep GOAL-SSI-001
    active with null campaign budgets; do NOT mark the goal completed; do NOT
    re-queue QM-STOPPING while both REV-1 and REV-2 remain unmet.
  - >-
    Mode change: with OBL-2a tightened and every remaining QM-ERROR obligation now
    host/source/probability-gated (RT OBJ-2 — REV-E1 shares the QM-STOPPING REV-1
    host gap; REV-E2 needs a committed error-probability source that may not be
    invented; REV-E3 needs a crypto Verify body), a further zero-compute QM-ERROR
    tightening pass would not reduce the stated uncertainty. The executable
    zero-compute forward lever shifts to a pin-seeking / host-admissibility probe
    that does NOT invent CollimationSieve@6f9188e4 APIs (the shared REV-E1/REV-1
    pin gate), which — if it resolves admissibility either way — is the narrower
    uncertainty reduction that could unblock OBL-2b/OBL-6 (and QM-STOPPING REV-1).
    The width lane stays pin-blocked. Do NOT iterate the toy peak-byte width lane;
    do NOT attempt a fake-τ gate B; do NOT launch EXP-SSI-001.
