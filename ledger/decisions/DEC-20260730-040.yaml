  rationale:
  - >-
    CONFIRM (scoped) adopted: the durable snapshot archives an honest bounded
    zero-compute QM-ERROR F-union OBLIGATION-LEDGER TIGHTENING with pre-registered
    falsifiable criteria (OUTCOME-T / OUTCOME-P / OUTCOME-N). Producer and
