  context: >-
    RESOLUTION OF PROTOCOL AMENDMENT experiments/EXP-INSTR-36c8cf/amendments/v2.yaml,
    which was filed by DEC-20260810-5aeeaa with `approved_by: null` and made its own
    approval conditional on two independent reviews, either of whose dissent blocks.
    BOTH HAVE RETURNED.

    V1 (validation_v1_noise_vs_tail.yaml, VAL-20260810-c98659-v1, verdict `passed`,
    recommendation APPROVE, dissent false) answered the MECHANISM question.

    V2 (red_team_v2_freeze.yaml, RT-20260810-V2-FREEZE, FINAL) DISSENTED ON APPROVING
    v2 AS FILED, on the ground that three of the four conditions DEC-20260810-5aeeaa
    itself declared necessary-and-sufficient are defective AS WRITTEN, and listed
    eight repairs R1-R8 that would withdraw the dissent. It explicitly declined a
    harsher finding the brief offered and did not dissent on CONFLICT-1.

    THIS DECISION RESOLVES v2, ADDRESSES OBJ-1 THROUGH OBJ-8 BY NAME, APPROVES A
    SUPERSEDING AMENDMENT v3, AUTHORIZES ONE BOUNDED RUN, ADJUDICATES NO HYPOTHESIS,
    MEETS NO COMPLETION CRITERION AND CREATES NO EVIDENCE RECORD.

  decision: approve

  decision_scope: >-
    `approve` ATTACHES TO experiments/EXP-INSTR-36c8cf/amendments/v3.yaml AND TO
    NOTHING ELSE. AMENDMENT v2 IS NOT APPROVED AND NEVER WILL BE: it is superseded,
    stays on the record byte-unchanged with `approved_by: null`, and its changes have
    no force (AGENTS.md rule 2 -- corrections supersede, never overwrite). The
    contract moves from version 2 to version 3 by amendment v3.

    IT AUTHORIZES exactly ONE successor Phase A run of EXP-INSTR-36c8cf under
    contract version 3, under the budget and load precondition in
    compute_authorized_by_this_decision. IT DOES NOT TOUCH EXP-ICINV-4d33aa:
    RQ-ICINV-475b5e REMAINS PAUSED for that experiment on both of its standing
    grounds, and nothing here unpauses that lane. It does not lift the criterion-C4
    block on TASK-20260810-9c2e47 or TASK-20260810-820328, does not move any
    hypothesis status, does not discharge criterion C4, creates no evidence record,
    and edits no committed record.

  the_two_reviews_are_not_in_conflict_and_this_is_the_governing_distinction: >-
    STATED FIRST AND EXPLICITLY, BECAUSE TREATING THEM AS OPPOSED WOULD BE AS WRONG AS
    IGNORING EITHER. V1 AND V2 ANSWER DIFFERENT QUESTIONS AND NEITHER CONTRADICTS THE
    OTHER ON ANY FACT.

    V1 ANSWERS THE MECHANISM: is the E3 failure noise in the standard-deviation
    estimator, or a right-skewed / heavy-tailed per-row distribution? Its answer is
    NOISE, so more seeds are the right repair and the estimator is not the thing to
    replace. V2 does not dispute this and did not test it; it says so
    (things_i_could_not_check_and_why).

    V2 ATTACKS THE STATED JUSTIFICATION: are the four conditions under which
    DEC-20260810-5aeeaa said the extension is admissible actually sound as written?
    Its answer is that (b) is FALSE on the committed record, (a) names the wrong one
    of two acceptance regions, and (d) is necessary but not sufficient. V1 does not
    dispute this and did not review it; it says so (its `passed` is scoped to the run
    AS A RECEIPT, and it explicitly records that a `passed` here does not answer a
    concurrent dissent).

    A DISSENT ON A JUSTIFICATION IS NOT A REFUTATION OF THE CONCLUSION. V2 says this
    itself: "THIS DISSENT BLOCKS APPROVAL AND IS NOT A REJECTION OF THE EXTENSION IN
    PRINCIPLE ... EVERY ONE OF THESE IS REPAIRABLE WITHOUT ABANDONING THE EXTENSION."
    The correct resolution is therefore neither to approve over the dissent nor to
    withdraw the extension, but to REPAIR THE JUSTIFICATION ON THE RECORD and to file
    a new versioned amendment for the one repair that moves a parameter. That is what
    this decision does.

  restating_a_justification_is_not_changing_a_parameter: >-
    THE DISTINCTION THAT GOVERNS THIS RESOLUTION, STATED PLAINLY BECAUSE IT IS THE
    ONE A LATER READER WILL TEST. A JUSTIFICATION is the argument a record gives for
    why a design is admissible. A PARAMETER is a number or rule the run executes
    against. Correcting a false, incomplete or mis-scoped justification is not
    post-hoc repair of a design: nothing the run does changes, so nothing about what
    counts as a pass changes, and a reader can check the correction against the same
    committed artifacts the original was checked against. Repairs R1, R2, R3's second
    limb, R4, R5, R7 and R8 are of this kind, and NONE OF THEM MOVES: the 5%
    threshold (byte-unchanged), the per-row central coverage 259/260, the per-row
    two-sided alpha 1/260, the family-wise target 0.05 and its realised value
    0.048862, the interval quantiles 1/520 and 519/520, the mean +- z*sd estimator
    with z computed at run time, the thirteen density rows, T = 400, or SR4 NO
    WIDENING. That is why they are admissible as restatement.

    EXACTLY ONE REPAIR MOVES A FROZEN PARAMETER, AND IT THEREFORE TRAVELS AS A NEW
    VERSIONED AMENDMENT (v3) AND NOT AS AN EDIT. Amendment v2 is filed and immutable;
    it is superseded, not corrected. The moved parameter is v2's T2, the
    first-crossing acceptance rule, and the derivation that forces it is in
    why_the_terminus_moves_from_a_pass_probability_to_a_requirement below. The
    direction of that move is ANTI-PERMISSIVE at the construction stage, which is the
    opposite of the direction a post-hoc repair takes.

  why_the_terminus_moves_from_a_pass_probability_to_a_requirement: >-
    THIS IS THE CHAIN THAT DECIDES THE WHOLE RESOLUTION AND IT IS SET OUT SO IT CAN BE
    ATTACKED STEP BY STEP.

    (1) V2 OBJ-5 IS ACCEPTED: the terminus 1536 was selected as the rung at which the
    rule being extended becomes overwhelmingly likely to pass (0.92980 per transition,
    0.969 cumulative). A stopping point placed where a rule stops being able to fail
    is not a bound on looks.

    (2) R3 REQUIRES A REQUIREMENT-DERIVED TERMINUS. Two candidate requirements exist.
    The direct precision criterion 1/sqrt(2*(n-1)) < 0.05 gives n >= 201 and a
    terminus of 384. The TAIL-RESOLUTION requirement -- at least two expected per-seed
    observations beyond each endpoint of an interval whose endpoints ARE the 1/520 and
    519/520 quantiles, i.e. n/520 >= 2, i.e. n >= 1040 -- gives 1536 (n/520 = 2.954).

    (3) THE TAIL-RESOLUTION REQUIREMENT IS ADOPTED, AND THE PRECISION CRITERION IS
    RULED NECESSARY BUT NOT SUFFICIENT, FOR A MEASURED REASON. Precision on the sd
    does not touch HEUR-INSTR-3, which is the declared weak point of the whole
    construction and whose declared validation route (amendment v1) is the listed
    extremes at each row. At 384 seeds the expected count beyond an endpoint is 0.738
    and that route is vacuous. V1 finding F-V1-2 supplies a second, independent reason
    that a criterion on the sd cannot see: because BOTH the mean and the sd are
    estimated, mean +- z*sd UNDER-COVERS out of sample, with realised two-sided tail
    probability 0.00627 at n = 48 against a nominal 0.003846 (1.63x), 0.00404 at
    n = 768 (1.05x) and 0.00398 at n = 1536 (1.04x); the exact factor is
    t_(n-1)(519/520)*sqrt(1+1/n), equal to 3.0727 at n = 48 against the frozen
    z = 2.8905115606917384.

    (4) THE CONCESSION, MADE RATHER THAN BURIED. Two requirements were available and
    the one adopted is the one that reproduces the terminus v2 already filed. This is
    the weakest joint in the restatement and it is stated as such rather than
    presented as forced. What makes it admissible is checkable: the requirement is a
    function of the FROZEN coverage and the FROZEN doubling schedule alone and cannot
    be fitted to any observed value; it is filed before rungs 4 through 8 exist; and
    it is adopted together with (5), which moves the construction stage's own pass
    probability DOWN.

    (5) A REQUIREMENT ON THE TERMINUS THAT DOES NOT BIND THE ACCEPTED RUNG IS VACUOUS,
    AND THAT IS WHAT FORCES A PARAMETER CHANGE. Under v2's T2 the ladder accepts at the
    FIRST rung meeting the 5% rule, which may be rung 5 (192 seeds, 0.369 expected
    observations beyond each endpoint) -- an interval that fails the very requirement
    justifying the terminus. The justification and v2's acceptance rule are
    inconsistent, and the acceptance rule gives way. Amendment v3 change E11 T2: THE
    LADDER RUNS TO RUNG 8 IN EVERY CASE AND THE RULE IS EVALUATED ONCE, AT THE
    768 -> 1536 TRANSITION.

    (6) THE CONSEQUENCES, WITH THEIR NUMBERS. P(the construction stage produces an
    interval) is 3.0e-6 under the frozen v1 ladder, 0.969 analytic / 0.9482 measured
    under v2 as filed, and 0.92980 analytic / 0.882 measured under v3. So P(terminal
    F4) RISES from 0.031 analytic / 0.052 measured to 0.070 / 0.118. V3 IS
    ANTI-PERMISSIVE RELATIVE TO v2 AS FILED. V2's quantifier-order attack is answered
    rather than bounded: the protocol is now "FOR ALL data, THERE EXISTS a pre-declared
    terminus derived from the frozen coverage, at which the rule is evaluated", and
    the witness is not selected after seeing an outcome.

  disposition_of_every_objection_by_name:
    OBJ_1_condition_b_is_false_on_the_committed_record:
      disposition: ACCEPTED IN FULL. Repair R1 enacted.
      finding_accepted: >-
        Condition (b) of DEC-20260810-5aeeaa -- "THERE IS NO DATA TO FIT TOWARD ... no
        candidate arm value has been observed by anyone" -- IS FALSE. 39 committed Arm
        A0 per-row variance ratios sit on exactly this gate's grid in
        experiments/EXP-ICINV-4d33aa/runs/RUN-ICINV-40622f/cell-aggregates.json, and
        the ceiling of the superseded [1.3, 3.6] band is one of them:
        3.6 - 0.011900 = 3.5881 = primary|A0|seed=20260807|T=400|fb=18 =
        3.5881004922763506 exactly. INDEPENDENTLY RE-VERIFIED BY THE ARCHIVING
        SESSION. A defence stated as holding "if and only if four conditions hold"
        cannot stand on a condition that is false, and this Coordinator does not try
        to save it by reading it charitably.
      what_replaces_it: >-
        Condition (b') of amendment v3, as the VERIFIED claim V2 checked rather than
        assumed: candidate values ARE committed and visible, and no choice of terminal
        rung admits or excludes any of them at the rungs measured -- all 39 inside the
        interval at rungs 1, 2 and 3, zero admission flips, minimum margin 0.2444
        half-widths (fb = 5, seed 11235813), median about 0.71, and the c4 effect is
        strictly widening so a longer ladder cannot exclude any of them by that route.
      recorded_as_unchecked: >-
        The floor slack 1.320397 was not located in the committed artifacts. V2 did
        not claim it and neither does this decision.
    OBJ_2_condition_a_names_the_wrong_acceptance_region:
      disposition: ACCEPTED IN FULL. Repair R2 enacted.
      finding_accepted: >-
        There are two acceptance regions. Region 1 (the downstream arm test at
        coverage 259/260 and family-wise 0.05) is genuinely untouched and condition (a)
        is true of it. Region 2 (E3, wired into F4, which decides whether an interval
        exists at all) is the region the amendment operates on, and v2 moved it by five
        orders of magnitude -- 3.0e-6 to 0.969 -- while disclosing only the +0.517% c4
        effect. THE DISCLOSURE ASYMMETRY IS THE OBJECTION AND IT IS CONCEDED. Amendment
        v3 names both regions separately and states Region 2's movement with its number.
      how_V1s_finding_bears_on_it_and_how_far: >-
        WEIGHED EXPLICITLY BECAUSE IT CUTS TWO WAYS. V1 found the c4 disclosure
        incomplete in the OPPOSITE direction: the frozen estimator UNDER-covers out of
        sample at 1.63x nominal tail probability at n = 48, so the NET finite-n
        direction of the estimator at the tested rungs is ANTI-permissive, not
        permissive. That materially reduces the force of "self-serving" as a
        characterisation of the c4 disclosure -- and V2 had already conceded that limb,
        writing that the c4 effect "IS NOT THE PROBLEM" and that refusing to correct it
        is right. IT DOES NOT ANSWER THE DISCLOSURE-ASYMMETRY COMPLAINT, WHICH IS ABOUT
        WHAT THE RECORD SAYS AND NOT ABOUT WHICH WAY THE BIAS RUNS. Both effects are
        now reported at every rung by amendment v3 change E13 D3, and NEITHER is
        applied: correcting the estimator after seeing data is forbidden, and it is a
        USER decision because the user selected this gate (DEC-20260810-a4bec4).
    OBJ_3_the_decision_repeats_its_own_off_by_one_rung_error:
      disposition: ACCEPTED IN FULL. Repair R5 enacted; the two entries are superseded here.
      finding_accepted: >-
        CONFIRMED INDEPENDENTLY BY BOTH REVIEWERS, which is what makes it not a
        judgement call. DEC-20260810-5aeeaa's "about 1.2e-4 at 24->48" and "about 0.006
        at 48->96" are the 48 -> 96 and 96 -> 192 entries. THE CORRECTED TABLE, WHICH
        SUPERSEDES THEM: 12->24 = 4.245e-08; 24->48 = 2.981e-06; 48->96 = 1.644e-04;
        96->192 = 5.789e-03; 192->384 = 0.09465; 384->768 = 0.51304;
        768->1536 = 0.92980. The true 24 -> 48 value is about forty times smaller than
        stated, so the error UNDERSTATED the case; the three entries that select the
        terminal rung were correct. No conclusion of DEC-20260810-5aeeaa is overturned,
        and the committed decision is NOT edited.
      second_correction_carried: >-
        V1 F-V1-5: the nested formula 1/(2*sqrt(n_prev)) is a large-n approximation and
        is optimistic at small rungs -- direct Monte Carlo gives 0.1873, 0.1156 and
        0.0763 at n_prev 12, 24, 48 against the analytic 0.1443, 0.1021, 0.0722. The
        direction strengthens the case for extending. Successors quoting small-rung
        figures use the simulated values.
    OBJ_4_the_look_free_repair_is_named_and_then_deferred_behind_five_looks:
      disposition: >-
        ACCEPTED IN PART AND ANSWERED, NOT DEFERRED. Repair R4's first limb enacted:
        the answer is given now, before the compute, as V2 demanded.
      the_answer: >-
        V2 is right that a direct precision criterion needs no ladder, no look and no
        freeze defence, gives n >= 201 in closed form, and that E3 at n = 48 numerically
        tracks it (1/(2*sqrt(24)) = 0.10206 against 1/sqrt(2*47) = 0.10314), so E3 is a
        noisy 13-row-maximum proxy for a computable quantity. IT IS NOT ADOPTED AS THE
        SOLE CRITERION BECAUSE IT IS NECESSARY AND NOT SUFFICIENT: it certifies the
        precision of the sd, and the gate's endpoints are 1/520 quantiles governed by
        HEUR-INSTR-3, which precision on the sd does not touch. THE CHARGE THAT THE
        LADDER BUYS 7.6x THE SEEDS FOR NO ADDITIONAL PRECISION IS ANSWERED: the extra
        seeds buy tail resolution and finite-n calibration, not sd precision.
      what_is_conceded: >-
        The direct criterion is STRICTLY BETTER ON THE PRECISION AXIS and amendment v3
        does not claim otherwise; T3 keeps it as the named successor if the terminal
        test fails. AND V2's METHOD-CEILING ATTACK STANDS UNANSWERED AS A LIMITATION:
        2.954 expected observations beyond an endpoint makes the tail check non-vacuous;
        it does not make it powerful, and no rung on this ladder validates HEUR-INSTR-3
        with comfort.
      the_look_free_element_that_IS_adopted: >-
        Amendment v3 E11 T2 removes the five intermediate LOOKS entirely: the rungs are
        measured and reported, and the rule is evaluated ONCE at a pre-declared n. That
        is the look-free discipline of OBJ-4's criterion applied to the frozen rule
        rather than a replacement of it.
    OBJ_5_condition_d_is_necessary_but_not_sufficient:
      disposition: ACCEPTED IN FULL. Repair R3 enacted, both limbs.
      finding_accepted: >-
        (d) constrains only that the terminus is finite and declared, not how it was
        picked, and the terminus was picked by the pass probability of the rule being
        extended. Conditions (e') and (f') are added by amendment v3: the terminus is
        derived from a stated requirement, and the rule is evaluated once at it. See
        why_the_terminus_moves_from_a_pass_probability_to_a_requirement.
      the_precedent_V2_found_FOR_the_decision_and_it_is_recorded_because_it_is_not_in_either_document: >-
        A SECOND EXTENSION IS REFUSABLE, AND ON EVIDENCE RATHER THAN ON T1's
        unenforceable self-binding. HEUR-INSTR-4 is the sole justification for
        extending; under the declared model a terminal F4 at rung 8 has probability
        0.070 analytic (0.118 on V1's bootstrap of the run's own data) and is likely
        under the competing explanation, so observing it is evidence AGAINST
        HEUR-INSTR-4. Amendment v3 change E11 T6 declares this IN ADVANCE, together
        with V2's stronger unstated defence of the extension: under the frozen
        12/24/48 ladder F4 fired with probability ~1 under BOTH explanations and
        discriminated nothing -- which is exactly why its firing is refused as evidence
        -- and at rung 8 its outcome discriminates them. E3 IS NOT DEAD; V2 checked and
        declined the harsher finding, and the extension improves E3's evidential
        content rather than destroying it.
    OBJ_6_the_first_crossing_rule_selects_the_accepted_interval_on_a_stability_event:
      disposition: >-
        VOIDED BY THE PARAMETER CHANGE RATHER THAN MEASURED. R8 IS THEREBY MOOT, NOT
        DEFERRED -- and this is recorded because V1 did NOT measure the selection
        effect, so under any resolution that kept T2 it would still be open.
      reasoning: >-
        With no first-crossing rule there is no selection over five looks. The reported
        rung-8 interval, half-width, extremes and diagnostics are UNCONDITIONAL --
        computed and reported whatever E3 does -- so the mechanism V2 described
        (preferentially selecting rungs at which no new extreme seed entered) has
        nothing to act on in the reported quantity.
      the_residue_stated_honestly: >-
        A SINGLE CONDITIONING EVENT REMAINS: whether the interval is USED depends on
        the one E3 test at 768 -> 1536. That is an ordinary pre-declared falsification
        test at a fixed n, not optional stopping, and because the unconditional rung-8
        quantities are reported regardless, a reader can see exactly what the
        conditioning selected on. V2 itself declined to assert the sign or size of the
        effect; this Coordinator asserts neither.
    OBJ_7_the_decision_reads_down_F4s_consequence_clause_and_passes_over_its_remedy_clause:
      disposition: ACCEPTED. Repair R4's second limb enacted, and it is answered in the stronger direction.
      the_ruling: >-
        The EVIDENTIARY clause of F4 is read narrowly, as DEC-20260810-5aeeaa ruled and
        as V2 endorsed for a stronger reason than the one given -- a mismatch between
        two protocol parameters cannot bear on whether a distribution is an adequate
        reference, so reading the stability disjunct as refuting HEUR-INSTR-2 would let
        a self-inflicted protocol artifact masquerade as mathematical evidence. THE
        REMEDY CLAUSE IS NOT SUPERSEDED AND IS NOT CONSTRUED AWAY. It is HONOURED:
        amendment v3 redesigns the gate's acceptance rule, replacing a five-look
        first-crossing stability test with a single evaluation at a requirement-derived
        terminus. Amendment v2 redesigned nothing and lengthened a ladder, which on
        V2's reading and on this Coordinator's did not satisfy the remedy. The
        ESTIMATOR is not redesigned, because that is a USER decision and V1 found the
        mechanism to be noise rather than shape.
    OBJ_8_scope_limit_1_is_violated_by_pre_existing_committed_records:
      disposition: RESOLVED EXPLICITLY. Repair R7 enacted. THE SCOPE LIMIT IS PROSPECTIVE.
      the_ruling: >-
        Scope limit (1) of DEC-20260810-5aeeaa adjudication_item_2 -- "nothing measured
        through targets_uniform may support any within-class claim, in either direction,
        at any scale" -- BINDS PROSPECTIVELY, FROM THE COMMIT OF THAT DECISION ONWARD.
        It does not void, weaken, or re-adjudicate EV-ENDO-10109d, DEC-20260807-41c173
        or any other committed record.
      three_reasons_it_is_prospective_and_not_retrospective: >-
        (i) The clause is a COORDINATOR DISPATCH CONTROL. DEC-20260810-5aeeaa states of
        the same restatement that it "supersedes by reference and edits no committed
        record"; a dispatch control governs what future envelopes may instruct, not
        what past evidence records assert. (ii) The disposition of pre-existing
        targets_uniform-measured within-class claims is H-ICINV-6c7920's remit. That
        hypothesis is `specified` and is neither presumed true nor false; deciding those
        records here would be adjudicating it without its lane's evidence or controls,
        in a decision that adjudicates no hypothesis. (iii) Voiding EV-ENDO-10109d
        (strength `replicated`) by a sentence in an adjudication of an unrelated
        sampler conflict would be a `reject_scoped`-class action with NO refutation
        artifact of any kind -- no counterexample certificate, no derivation note, not
        even a declared `empirical_only` basis. That is forbidden, and a scope limit
        may not accomplish by wording what a decision may not do by finding.
      what_prospective_does_NOT_buy_and_is_stated_so_it_is_not_read_as_relief: >-
        EV-ENDO-10109d's within-class over-dispersion claim continues to carry
        H-ICINV-6c7920's dispute with every citation, exactly as it did before. AND V2
        FLAGGED AN ARTIFACT TELL AGAINST IT THAT THIS DECISION DOES NOT ADJUDICATE AND
        WILL NOT BURY: the quantity that density should destroy stays flat across a
        40-fold density range, and the committed three-seed Arm A0 / Arm B contrast in
        RUN-ICINV-40622f suggests the flat curve is the composition of a large
        low-density sampler inflation with a genuine high-density rise -- two
        mechanisms, not one property. That is FLAGGED FOR H-ICINV-6c7920's lane, is not
        a finding, moves no hypothesis, and is carried forward in the goal head so it
        is not lost.

  the_mechanism_question_and_what_V1_settled: >-
    DEC-20260810-5aeeaa WAS EXPLICITLY INCONCLUSIVE ON THE MECHANISM. IT NO LONGER IS,
    WITHIN THE RANGE THE DATA CAN SEE.
    THE DECISIVE MEASUREMENT: replaying the frozen nested schedule and the UNCHANGED
    E3 rule on 5000 bootstrap replicates of the run's own seed-columns gives
    P(stabilise by 1536) = 0.9482; against a MATCHED SYMMETRIC null holding each row's
    mean, variance AND kurtosis fixed while forcing skew to zero it is 0.9472, a
    difference of +0.0010 against a Monte-Carlo se of at most 0.0100. REMOVING SKEW
    ENTIRELY CHANGES THE GATE'S BEHAVIOUR BY NOTHING. The ~1.8 pp gap to the Gaussian
    reference (0.9656) is excess kurtosis, about two points of stabilisation
    probability at the terminal rung -- quantified, small, and consistent with
    extending. The interpretation rule was fixed before the number was read.
    THE EXCEEDANCE SIGNAL IS CONFIRMED AS FACT AND EMPTY AS EVIDENCE, BECAUSE THE NULL
    WAS THE WRONG SHAPE. The statistic is a ratio of quadratic forms; under the
    contract's own generative model its skewness is 2*CV exactly, predicting per-row
    skew 0.166-0.296 (mean 0.2108) at the measured CV, against an OBSERVED mean per-row
    skew of 0.1811 -- BELOW the prediction. P(at least 2 exceedances, all upper) is
    0.099 against a Gaussian null and 0.365 against the shape-correct null.
    THREE FACTUAL CORRECTIONS TO THE RECORD, BOTH REVIEWS AGREEING: (1) "2.4 expected
    exceedances" is WRONG -- it treats estimated endpoints as constants; the correct
    self-normalised Gaussian-null expectation at n = 48 is 1.57 (0.784 upper, 0.789
    lower), so TWO OBSERVED SITS ABOVE EXPECTATION, not comfortably below it, and the
    direction of the original error worked against the decision's own conclusion.
    (2) "Both exceeding rows are among the rows that fail stability" carries no
    information: 8 of 13 rows fail, so P = 0.359; and the largest rung-3 instability is
    fb = 7 at 0.2354, whose excess kurtosis is +0.017. (3) fb = 22 IS ONE OUTLYING SEED,
    NOT A TAIL: its maximum lives in rung 2, rung 3's 24 fresh seeds produced no new
    upper extreme in that row at all, and dropping its single largest point takes skew
    1.079 -> 0.406 and excess kurtosis 2.296 -> -0.054.

  V1s_limitations_recorded_rather_than_buried: >-
    STATED IN V1's OWN TERMS BECAUSE A VERDICT WITHOUT ITS DETECTION FLOOR IS NOT A
    FINDING. (1) THE NONPARAMETRIC BOOTSTRAP CANNOT SEE A TAIL BEYOND THE OBSERVED
    RANGE. The result is "the tail present in this data does not defeat the gate", not
    "no tail could"; a pathology appearing only beyond the 1-in-48 quantile is
    invisible to every test performed. (2) SYSTEMATIC SKEW BELOW ABOUT 0.30 IS NOT
    EXCLUDED: the correlation-aware aggregate test has power 0.709 at true skew 0.30
    and 0.948 at 0.45, critical value 0.1994 against an observed 0.1811. That range is
    exactly what the generative model predicts and what the ladder replay measures to
    be harmless, but IT IS NOT MEASURED TO BE ABSENT AND MUST NOT BE REPORTED AS
    ABSENT. (3) Every simulation figure in V1 is the reviewer's own Monte Carlo, gates
    nothing and creates no evidence record. (4) The 13x13 cross-row correlation used in
    every null object was estimated from the same 48 points and needed a nearest-PD
    repair; the null-object probabilities inherit that estimation error.
    IS THE SELF-SETTLING PROPERTY PART OF THE JUSTIFICATION? YES, AS A SUPPORTING
    REASON AND NOT AS THE LOAD-BEARING ONE, AND IT IS STRONGER UNDER v3 THAN IT WOULD
    HAVE BEEN UNDER v2. Both gaps close at rung 8 for free -- 1536 draws per row drop
    the aggregate skew test's detection floor by about sqrt(32), and only more seeds
    can see past the 1-in-48 quantile. UNDER v2's FIRST-CROSSING RULE THAT WAS NOT
    GUARANTEED: the measured stopping distribution has a median terminal rung of 768
    and a real chance of accepting at 192 or 384, where neither gap closes. Under v3
    the ladder always reaches rung 8, so the closure is certain rather than
    conditional. THE LOAD-BEARING JUSTIFICATION REMAINS THE TAIL-RESOLUTION
    REQUIREMENT; "more data settles more things" is not by itself a reason to draw
    more data, and it is not used as one.

  provenance_of_V1s_decisive_control_and_how_much_weight_it_can_carry: >-
    DISCLOSED IN FULL BECAUSE IT MUST BE AUDITABLE, AND WEIGHED RATHER THAN WAVED
    THROUGH. THE ARCHIVING SESSION AMENDED V1's CHARTER MID-REVIEW, adding the
    matched-symmetric bootstrap control after the red team observed that the original
    charter was underpowered (exact skewness SE 0.3431 at n = 48, detection floor about
    |skew| 0.686). THAT CONTROL PRODUCED V1's DECISIVE RESULT. V1 recorded the
    correction verbatim in coordinator_added_control and recorded that it demoted the
    per-row moment tests to no independent weight.
    DOES IT WEAKEN V1's INDEPENDENCE? YES, ON ONE AXIS AND NOT ON THE OTHER, AND THE
    DISTINCTION IS WHAT DECIDES THE WEIGHT. V1 is no longer an independent CHOICE OF
    WHAT TO MEASURE: the method came from the dispatching session. V1 remains an
    independent EXECUTION, INTERPRETATION AND VERDICT: it ran the control, fixed the
    interpretation rule before reading the number, and could have returned the
    heavy-tail explanation, which would have forced withdrawal.
    FOUR THINGS BOUND HOW FAR THE CONCERN REACHES. (1) THE CORRECTION RAISED THE BAR
    FOR APPROVAL. It told V1 that a bare null from an underpowered test must not be
    read as support. A charter correction that makes approval harder cannot manufacture
    support for approval. (2) ITS SOURCE WAS THE ADVERSARIAL SIDE. It originates in the
    red team's own observation and discharges V2's repair R6 verbatim -- R6 asks that
    the ladder-bootstrap control be added to V1's charter BEFORE V1 returns, or else
    that V1's null be recorded as uninformative. It was added before V1 returned. THE
    LEAST SELF-SERVING POSSIBLE PROVENANCE FOR A CONTROL IS THE REVIEWER ATTACKING THE
    CLAIM. (3) THE CONTROL IS A FALSIFICATION OPPORTUNITY, NOT A CONFIRMATION DEVICE:
    had the matched-symmetric null stabilised markedly more often than the observed
    data, a tail would have been implicated and the amendment withdrawn. (4) THE
    RESULT IS REPRODUCIBLE FROM COMMITTED ARTIFACTS: V1 states its replicate counts and
    rng seeds, and the input is the run's own committed per_seed_ratios.
    THE WEIGHT ASSIGNED: V1 carries FULL weight on the mechanism verdict and on every
    recomputation it performed. It carries NO weight as evidence that the review
    programme was independently designed, and this decision does not cite it for that.
    RESIDUAL RECORDED: the two reviews were not blind to each other at the charter
    level, though V1 states it did not read V2's file and V2 states it did not compute
    V1's quantities.
    WHAT R6 DOES AND DOES NOT DISCHARGE. The core of RC-1 -- the ladder bootstrap under
    the frozen stopping rule, with a chi-square NULL-B null object and a shape-matched
    comparison -- WAS RUN. RC-1(ii), the accepted interval's realised coverage against
    259/260, was NOT run and is now a required per-rung diagnostic (amendment v3 E13
    D3, in its analytic form, which V1 shows is exact and needs no run). RC-1(iii), the
    first-crossing selection effect, was NOT run and is MOOT under amendment v3's
    design. RC-3, the pre-freeze feasibility and reference-existence check, is a
    Coordinator-level action against hidden assumption H-3 and is carried forward.

