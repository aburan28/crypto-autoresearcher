  rationale:
    - >-
      BOTH REQUIRED REVIEWS RETURNED AND THEY ANSWER DIFFERENT QUESTIONS. V1 settled
      the mechanism (NOISE, not a tail) by a matched-symmetric ladder replay whose
      interpretation rule was fixed before the number was read. V2 dissented on the
      JUSTIFICATION as filed and listed the repairs that would withdraw the dissent. A
      dissent on a justification is not a refutation of the conclusion, and treating it
      as one would have been as wrong as ignoring it.
    - >-
      THE DISSENT IS DISCHARGED BY ENACTING ITS OWN REPAIRS, NOT BY OUTVOTING IT. R1,
      R2, R3, R4, R5 and R7 are enacted here and in amendment v3; R6 was discharged
      before V1 returned by the mid-review charter correction, whose provenance is
      disclosed and weighed above; R8 is MOOT because the parameter change removes the
      effect it asked to have measured. RC-2 is declined with its evidence, budget,
      boundary, successor and revisit condition recorded.
    - >-
      RESTATING A JUSTIFICATION IS NOT CHANGING A PARAMETER. The 5% threshold, the
      coverage 259/260, the per-row alpha 1/260, the family-wise 0.05 and its realised
      0.048862, the quantiles 1/520 and 519/520, the mean +- z*sd estimator with z at
      run time, the thirteen rows, T = 400 and SR4 NO WIDENING are ALL UNTOUCHED. That
      is why the restatement is admissible rather than post-hoc repair: nothing the run
      executes changes, so nothing about what counts as a pass changes, and every
      corrected claim is checkable against the same committed artifacts.
    - >-
      EXACTLY ONE REPAIR MOVES A FROZEN PARAMETER AND IT THEREFORE TRAVELS AS
      AMENDMENT v3. A requirement on the terminus that does not bind the ACCEPTED rung
      is vacuous, so v2's first-crossing acceptance rule is inconsistent with the
      requirement-derived terminus R3 demands, and the acceptance rule gives way: the
      ladder runs to rung 8 in every case and the rule is evaluated once. Amendment v2
      is filed and immutable; it is superseded, never edited, and never approved.
    - >-
      THE DIRECTION OF THE PARAMETER CHANGE IS ANTI-PERMISSIVE AND THAT IS THE POINT.
      P(the construction stage produces an interval) goes 3.0e-6 (frozen v1 ladder) ->
      0.969 analytic / 0.9482 measured (v2 as filed) -> 0.92980 analytic / 0.882
      measured (v3). A repair that makes the gate harder to satisfy is not a repair
      chosen to make an observed failure disappear.
    - >-
      THE TERMINUS IS NOW DERIVED FROM THE FROZEN COVERAGE AND NOT FROM THE PASS
      PROBABILITY OF THE RULE BEING EXTENDED: at coverage 259/260 the endpoints ARE
      1/520 quantiles, at least two expected observations beyond each endpoint requires
      n >= 1040, and the first doubling rung satisfying it is 1536. The competing
      precision criterion (n >= 201, terminus 384) is ruled necessary but not
      sufficient, with reasons. THE CONCESSION IS MADE PLAINLY: the adopted requirement
      is the one that reproduces the already-filed terminus, and that is the weakest
      joint in the restatement.
    - >-
      F4's REMEDY CLAUSE IS HONOURED RATHER THAN CONSTRUED AWAY, WHICH IS THE ONE PLACE
      THIS RESOLUTION GOES FURTHER THAN THE RED TEAM ASKED. v3 redesigns the acceptance
      rule; v2 redesigned nothing.
    - >-
      A TERMINAL F4 AT RUNG 8 IS DECLARED IN ADVANCE AS EVIDENCE AGAINST HEUR-INSTR-4,
      WHICH IS WHAT MAKES A SECOND EXTENSION REFUSABLE ON EVIDENCE RATHER THAN ON AN
      UNENFORCEABLE SELF-BINDING. And the strongest defence of the extension, absent
      from both prior documents, is now on the record: under the frozen ladder F4 fired
      with probability ~1 under BOTH explanations and discriminated nothing; at rung 8
      its outcome discriminates them.
    - >-
      SCOPE LIMIT (1) OF DEC-20260810-5aeeaa IS PROSPECTIVE. It voids no committed
      record. EV-ENDO-10109d's disposition belongs to H-ICINV-6c7920, which stays
      `specified`; voiding replicated committed evidence by a scope sentence, with no
      refutation artifact of any kind, is forbidden. The red team's artifact-tell flag
      against that record is carried forward to that lane, unadjudicated.
    - >-
      F4 FIRING REMAINS A PROTOCOL OUTCOME AND IS NEVER NEGATIVE EVIDENCE about any
      instrument, sampler, statistic, class, curve, isogeny or prime, in either
      direction, at any scale. Nothing in this decision or in either review bears on
      H-ICINV-6c7920, on EV-ENDO-10109d, on endomorphism structure, on |D_0| or on
      ECDLP difficulty.
    - >-
      CLAIM DISCIPLINE, APPLIED UNIFORMLY. claim_tier toy on every record archived by
      this decision. NO ATTACK, NO EXPONENT, NO SPEEDUP; sota_delta ZERO on every axis;
      dominated_by parallel Pollard rho with distinguished points at 0.886 sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006) and, on CM curves, its
      automorphism-discounted variant (KN-TECH-018), under which any factor at or below
      sqrt(6) is BASELINE CALIBRATION and never an attack. Every figure is scoped to the
      committed p = 4001 trace-30 class of 138 curves at about 12 bits, T = 400, the
      thirteen frozen factor-base rows, one sampler, one solver, one unreplicated run
      and this budget, and transfers to no other geometry, prime, sampler or statistic.
      NO CURVE-SIDE CONCLUSION OF ANY KIND IS MADE OR AVAILABLE.
    - >-
      STANDING CONSTRAINTS, NONE OF THEM MOVED. H-INSTR-444c7b `specified`.
      H-ICINV-d5e351 `specified`. H-ICINV-6c7920 `specified`, neither presumed true nor
      false. H-ENDO-001 `approved`, used as the admissibility filter and not retested.
      H-STR-002 `weakened` with DEFER-BATCH009-001 OPEN, and PAUSE CONDITION P2 IS
      RESPECTED: this contract builds no equivariant factor base and tests no phi-stable
      structure. KN-FIND-b7e091 binding and unrevisited. P1 not triggered. P3 not
      triggered. EXP-ICINV-4d33aa STAYS PAUSED and nothing here unpauses it.
    - >-
      NO COMPLETION CRITERION IS MET AND C4 IS EXPLICITLY NOT DISCHARGED BY ANY OF
      THIS. Not one cell has a measured detection floor or a measured matched-null
      false-positive rate; no SR3 v3 interval is accepted at either prime; blockers B1
      and B2 stand; C1, C2 and C3 are untouched. NO ATTESTATION IS RECORDED AND NO
      CLOSURE QUORUM IS GATHERED OR CLAIMED.

