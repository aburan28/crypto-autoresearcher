  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NO KNOWLEDGE PROMOTION IS WARRANTED, FOR A CONCRETE REASON RATHER THAN A
      PROCEDURAL ONE. The promotion gate fires on a `support` or `reject_scoped`
      decision backed by `replicated` or `strong` evidence. This decision is `approve`
      on a protocol amendment, it creates NO evidence record, no hypothesis moves, and
      every quantity it cites is either derived arithmetic or a reviewer's own Monte
      Carlo that gates nothing.
      ON THE SUBSTANCE, WHERE THE STRONGEST CANDIDATE ACTUALLY IS. The most general
      object produced by this batch is methodological: the per-seed statistic here is a
      RATIO OF QUADRATIC FORMS, for which the contract's own generative model gives
      skewness exactly 2*CV and excess kurtosis 6*CV^2, so a Gaussian is the WRONG-SHAPE
      null object -- and choosing it flips the same data from a marginal p ~ 0.04
      "finding" (28 upper against 15 lower beyond |z| > 2) to p ~ 0.32, and turns an
      exceedance pattern of p ~ 0.10 into p = 0.365. That is a genuinely reusable point
      about a statistic this campaign uses everywhere. IT IS NOT PROMOTED NOW because
      its general half is textbook chi-square moment arithmetic, which would enter the
      corpus as internal knowledge it is not, and its campaign-specific half rests on
      ONE unreplicated run at ONE prime with 48 seeds per row, where the predicted mean
      skew 0.2108 and the observed 0.1811 agree within a test whose own detection floor
      is 0.30. Promoting it now would promote an agreement that the data cannot
      distinguish from noise.
      REVISIT CONDITION, STATED SO IT IS NOT LOST. The authorized run reports per-row
      skewness, excess kurtosis, CV and the model's own 2*CV prediction at every rung
      through 1536, at p = 4001 and then p = 6007 (amendment v3 E13 D2 and D4). If the
      2*CV relation holds at rung 8 at BOTH primes -- 32x the sample and an independent
      family, which is replication in the sense this ledger uses -- that is a cheap,
      checkable instrument finding about a statistic used campaign-wide, and it becomes
      a KN-FIND candidate at the ledger archive that records it, curated under
      /curate-knowledge with a regenerated knowledge/INDEX.md in the same commit. If the
      run ends in a terminal F4 or a budget event instead, nothing is promoted and the
      reason is recorded there.

