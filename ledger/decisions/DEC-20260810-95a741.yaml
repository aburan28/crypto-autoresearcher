    - >-
      ONE VALID RUN, ONE PRIME, ONE GEOMETRY, 48 SEEDS PER ROW, UNREPLICATED. Every
      figure here comes from RUN-INSTR-36c8cf-phaseA-v2-57ca9a at p = 4001 on the
      trace-30 class of 138 curves at T = 400, across thirteen frozen factor-base rows,
      under this sampler, this solver and this 14400 s budget. Nothing transfers.
    - >-
      THE MECHANISM VERDICT IS SCOPED TO WHAT THE DATA CAN SEE AND IS NOT A CLEARANCE.
      The bootstrap cannot see a tail beyond the 1-in-48 quantile, and systematic skew
      below about 0.30 is not excluded (aggregate power 0.709 at 0.30, 0.948 at 0.45).
      Both are reported as unmeasured, never as absent.
    - >-
      EVERY REACHABILITY, POWER AND NULL-OBJECT FIGURE CITED HERE IS DERIVED OR IS A
      REVIEWER'S MONTE CARLO. None is a run artifact, none gates anything, and none
      creates an evidence record. The analytic probabilities assume a Gaussian sampling
      model for the sd estimator; row correlation makes them FLOORS on the pass
      probability and a non-Gaussian tail voids them. The 13x13 cross-row correlation
      behind every null object was estimated from the same 48 points.
    - >-
