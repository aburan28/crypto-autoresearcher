coordinator_decision:
  id: DEC-20261017-6fb3ce
  recorded_at: '2026-10-17'
  question_ids:
  - RQ-PFDR-ae2fba
  goal_id: GOAL-PFDR-fd09e0
  kind: protocol_approval
  context: >-
    IDEA-20261017-077f12 (proposed, open, ECC area PFDR) asks whether window and rank-d label-GAP factor bases
    carry pair-level group-additive excess below p^(2/3), where the random model stops being a theorem (heuristic
    H1). RQ-PFDR-ae2fba had no host goal, so GOAL-PFDR-fd09e0 is opened here with lane BATCH-286bd3. The idea is
    designed as H-PFDR-011a4b and the contract EXP-PFDR-ca5e01, a heuristic-validation census over 90 toy cells
    (bits 16-22, theta 0.30-0.65, d in {1,2,3}) of exact nontrivial pair-sum coincidences against a matched random
    symmetric null, with a kernel selftest, a planted known-log AP, null-vs-null calibration, disjoint seed blocks,
    replication of flagged cells on fresh curves, a producer checker and a runbook for the mechanical tier. The
    implementation (run.py, check.py, paircount.c, vendored curve.py) was written and tested by the design session;
    the contract transcribes it. No cost, no speedup and nothing about any deployed curve is claimed.
  decision: approve
  decision_scope: >-
    APPROVES EXP-PFDR-ca5e01 at version 1 (six trials: selftest RUN-PFDR-936605, pilot RUN-PFDR-93c865,
    census-main RUN-PFDR-eb4733, analyze-main RUN-PFDR-c08b70, census-rep RUN-PFDR-e15482, analyze-final
    RUN-PFDR-b7c582) and moves H-PFDR-011a4b to approved (pre-run). Authorizes execution through
    experiments/EXP-PFDR-ca5e01/runbook.yaml (session RBS-PFDR-ca5e01) under TASK-20261017-2755a2 in lane
    BATCH-286bd3 of GOAL-PFDR-fd09e0. Opens GOAL-PFDR-fd09e0 (status active) with its initial checkpoint. Asserts
    nothing about any hypothesis; authorizes no attack, no cost extrapolation and no run outside the frozen trial
    plan.
  target_ids:
  - RQ-PFDR-ae2fba
  - GOAL-PFDR-fd09e0
  - IDEA-20261017-077f12
  - H-PFDR-011a4b
