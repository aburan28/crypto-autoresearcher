    note: Pre-run approval; not supported. The hypothesis file keeps the status it was written with at design
      (proposed); this decision is the transition record.
  rationale:
  - ECC comes first and open ECC ideas are designed, not shelved; IDEA-20261017-077f12 is an open PFDR idea with
    low implementation and compute cost and an implementation already tested by the design session.
  - >-
    The measurement is a heuristic validation in the sense of docs/target-result-profile.md. It samples the
    relevant distribution (pair-sum coincidences of label-structured bases), compares it with the predicted one
    (the matched random null), and checks tails (largest |z| against the maximum of standard normals). Its
    heuristic is the one IDEA-20261017-bbc53e's conditional delta-to-exponent translation consumes, so it is
    dispatched before that conditional result, as the pairing rule requires.
  - Each outcome has a pre-registered, distinct consequence (O-NULL scoped closure of pair-level label-GAP excess
    at the tested range; O-STRUCT a costed follow-up with matched rho; O-MIXED named-cell refinement; O-INVALID
    repair), and none can be read as a speedup.
  - The IDEA's claim, H1, controls and falsification conditions are carried; the two places the contract departs
    from the IDEA's literal numbers (calibration band, replication threshold) are recorded as resolutions R1 and
    R2 with reasons before any run, and two implementation properties that bear on reading (incomplete
    replication, bootstrap order) as R3 and R4.
  evidence_refs: []
  limitations:
  - Toy scale (bits 16-22, b <= 8192, pair level h = 2); no transfer to any cryptographic size; nothing about any
    deployed curve.
  - No tested cell lies in the (recalled) theorem range b >= p^(2/3), and the recalled bound covers windows only,
    so no structured cell has a proven kappa = 1 anchor.
  - The calibration gate can fail a correctly calibrated run about 6% of the time at 90 powered cells (R1); such a
    failure is O-INVALID, never evidence.
  - Power to flag a true 10% excess at |z| > 4 is about 0.8 at the sizing target under Poisson-like counts and
    lower under over-dispersion.
  - check.py is producer-written and does not re-derive the outcome, bootstrap interval, z_cal values or
    replication statistics (R5); independent review with a blind recount precedes any status move.
  - Serving model for the executor-mechanical tier is unverified until the adapter probe confirms it.
