    Standing user authorization of 2026-09-06 in AGENTS.md ("All is approved. Ideas/experiments should be always
    approved"); no per-experiment user confirmation is requested. The Coordinator's completeness check is recorded
    under protocol_completeness and the runnable condition under readiness_requirement.
  protocol_completeness:
    EXP-PFDR-ca5e01:
      controls: present (C1 kernel selftest, C2 matched random symmetric null, C3 planted known-log AP, C4
        null-vs-null calibration, C5 disjoint seed blocks and replication on fresh curves, C6 checker replay and
        brute recount; C7 Pollard rho declared not run because no cost claim is made, with the costed follow-up
        that would add it)
      metrics: present (primary kappa per cell with bootstrap 95% interval and z, outcome, calibration, planted
        recovery, replication of flagged cells; secondary slope of log kappa on theta, sizing record,
        infrastructure failures, base geometry, wall time; JSON pointers into analysis.json, design.json, jobs
        files and raw-result.json)
      budget: present (per-trial watchdogs 1800/14400/43200/3600/43200/3600 s, trial memory
        2048/4096/4096/2048/4096/2048 MB, 6 runs, 4 workers, kernel timeout 3600 s; advisory; design-session
        estimate about 1.4 CPU-hours for the main census)
      stage_estimates: present (per trial; pilot and replication census not separately estimated, recorded as such)
      stopping_rules: present
      invalidation_rules: present (selftest failure, checker exit non-zero, pilot sizing mismatch, replay or brute
        recount mismatch, failed_infrastructure jobs, calibration failure, code or plan digest mismatch,
        unamended change)
      required_artifacts: present (manifest.yaml and raw-result.json per run plus selftest.json, design.json,
        pilot-jobs.jsonl, main-jobs.jsonl, analysis-main.json, flags.json, rep-jobs.jsonl, analysis.json)
      preregistered_prediction: present (P1 kappa within 5% in every powered cell, P-detect, P2 planted
        recovery; source IDEA-20261017-077f12 and the recalled Parseval argument; never adjusted after a run)
      heuristic_validation: present (H1 stated with quantifiers and source; rigorous support recalled and scoped
        to windows at b >= p^(2/3); operationalization; uniform object; toy scale access; sample-size
        justification; comparison metric; tail checks; controls)
      decision_impact: present (on_positive O-NULL, on_negative O-STRUCT, on_inconclusive O-MIXED, on_invalid
        O-INVALID, each distinct)
      coordinator_resolutions: R1 calibration band, R2 flag and replication rule, R3 incomplete replication, R4
        bootstrap order, R5 checker scope; written before any run, each with its reason
      launcher: trial-plan.json, run.py, check.py, paircount.c and vendored curve.py bound by sha256 in the trial
        plan; runbook experiments/EXP-PFDR-ca5e01/runbook.yaml, session RBS-PFDR-ca5e01
      open_at_record_time: >-
        specification_sha256, trial_plan_sha256 and runbook_sha256 below are filled at freeze, before the
