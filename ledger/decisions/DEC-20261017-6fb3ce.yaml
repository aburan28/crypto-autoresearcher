  readiness_requirement: >-
    This record takes effect only when committed together with the specification, trial plan and runbook whose
    sha256 it names, after tools/runbook.py lint prints LINT OK, tools/experiment_preapproval.py reports
    approvable true for the packet, and tools/newest_experiments.py --experiment EXP-PFDR-ca5e01 reports
    execution_state ready on the committed tree (AGENTS.md "Approval is bounded by execution"). All checks are
    run by the session that commits this record. If the probe reports blockers, the specification stays
    review_required with those blockers recorded and this record is not committed.
  capacity_check: >-
    The approved-unrun cap was removed on 2026-10-11 (AGENTS.md "Approval is bounded by execution"); approval
    rests on the runnable condition only. GOAL-PFDR-fd09e0 is a new active ECC goal (area PFDR in
    orchestration/research-priority.yaml) with unlimited campaign budget and max_concurrent 2; the lane is
    BATCH-286bd3 (queue coordination/goals/GOAL-PFDR-fd09e0/batches/BATCH-286bd3/dispatch_queue.json,
    max_concurrent 1), the only open lane of the goal, to be claimed with tools/goal_lanes.py before dispatch of
    TASK-20261017-2755a2.
