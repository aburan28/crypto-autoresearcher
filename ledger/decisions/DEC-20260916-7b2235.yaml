      what: the review plan whose model_note declared the binding before the round (F-4)
      verified_by: >-
        coordinator, this session: read review-plan.yaml:536-542 directly and confirmed the note predates
        the round rather than being added after the reviewer returned.
    - id: BATCH-a33cda
      provenance: internal
      what: the batch whose queue carries the two amended cards
      verified_by: >-
        coordinator, this session: amended both cards' inference blocks in dispatch_queue.json and
        re-rendered the dispatch plan to confirm the queue still parses and gates still pass.
    - id: CORR-20260916-33068f
