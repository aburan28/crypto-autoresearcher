  context: 'Session RBS-SEMBIN-24ec56 of EXP-SEMBIN-24ec56 stopped on 2026-10-31 with its step failed. 17 of 36
    trials have final receipts (output_validated or invalid_output). The other 19 have no result: 4 killed by container
    restarts without receipts and 15 infrastructure_error receipts from a container image without numpy and libm4ri-dev.
    Retry-1 (DEC-20261022-063e36) covered 3 of them and never launched. The user asked on 2026-10-31 to try again.'
  decision: approve
  decision_scope: APPROVES amendment AMD-EXP-SEMBIN-24ec56-20261031-retry2 and the retry of exactly these 19 trials,
    once each, under the run ids listed under execution_dispatch, through experiments/EXP-SEMBIN-24ec56/runbook-retry2.yaml
    (session RBS-SEMBIN-620add) under TASK-20261031-620add in lane BATCH-821a5d. SUPERSEDES DEC-20261022-063e36
    before any launch and CANCELS its tasks TASK-20261022-96e7c8, TASK-20261022-ed3a5b, TASK-20261022-b06eee; its
    run ids RUN-SEMBIN-af9f0f, RUN-SEMBIN-cf4102, RUN-SEMBIN-d3997d stay unused. CLOSES TASK-20261018-944ddb as
    failed (session RBS-SEMBIN-24ec56 stopped; its 17 final receipts and preserved attempts are archived by TASK-20261018-61c6a1).
    The earlier attempts stay preserved as non-evidence. Asserts nothing about any hypothesis; changes no protocol
    value.
