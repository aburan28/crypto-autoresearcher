  rationale:
    - >-
      WHY SUPPORT. Every clause of C-T held (E-TENSOR count, the null ceiling,
      PN-2..PN-5); no falsification condition fired; no stated numeric
      prediction missed. That is the program's support test
      (DEC-20260915-fad1c1, as applied in DEC-20260924-e61f3b). The red team's
