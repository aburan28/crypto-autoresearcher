  nc_dr7_ruling:
    decides: DEC-20260924-e61f3b NA-3 control / DEC-20260924-833c70 NA-7, via EXP-CERTBIN-ddfe75 NC-DR-7
    recorded_label: '"the n = 19 cell quotes S_3-specificity against an N-CONV-type arm (same-support nulls insufficient)"'
    ruling: >-
      As EV-CERTBIN-5c9e14 nc_dr7_control_decision, which cites J9 (a)-(e),
      J10 O3/O4 and J12 (ii)-(iii): (i) NEGATIVE HALF ADOPTED: same-support
      nulls are insufficient as the only contrast. (ii) POSITIVE HALF NOT
      ADOPTED AS STATED: an N-CONV-type arm's W_4 rate is not a discriminating
      control for S_3-specific W_4 behaviour, at n = 17 (measured) or, by
      derivation, at n = 19. (iii) Any N-CONV-type arm is read on
      one_first_iteration, the M_4 fall profile and the excess codimension,
      unconditioned, with its conditional iteration-1 W_4 rate and
      denominator, beside an N-CONVL-type arm typed by target class. (iv) The
      zero-trial counting gate (NA-1) precedes any further n = 19 approval and
      any quotation of an N-CONV19 contrast as discriminating.
    basis: >-
      J9: N-CONV is at the M_4 ceiling (144/144; fallen 988 on 142/144) and its
      conditional W_4 rate is 0/0, so its W_4 rate carried no S_3-specific
      information at n = 17. J12 (ii): the saturation margin falls from +88
      (+71) at n = 17 to +3 (-16) at n = 19 (derivation, ell-syzygies
      assumed), so an N-CONV19-type arm is predicted to leave the M_4 ceiling;
      J10 O4 predicts it then sits at the W_4 ceiling at iteration 1, beside
      S_3 if S_3 is refuted there. A W_4 rate that both arms saturate cannot
      discriminate. The separator is the one the review plan's
      observation_collision named.
    limits: >-
      The n = 19 prediction is a derivation unchecked by measurement with an
      assumed ell-syzygy count; that is why (iv) makes the measured count a
      gate rather than taking the prediction as settled. This ruling reads
      nothing of RUN-CERTBIN-a3fc60 and asserts nothing about it.

