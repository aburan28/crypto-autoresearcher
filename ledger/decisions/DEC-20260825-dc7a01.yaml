      and c6d08bb67 on the main checkout (PR #592), rerouting all worker
      agents and the session default to zai/glm-5.2. This session
      (coordinator-endo-3) resumed per those messages. An infrastructure
      delay is not evidence about the reviewed package (AGENTS.md rule 5):
      the reviews were completed before the infra-stop, and the reviewed
      snapshot commit b08eeeac is unchanged.
