coordinator_decision:
  id: DEC-20260803-18d8f3
  context: >-
    GOAL-MCE-001 BATCH-002 close. Two producers drafted the BATCH-001
    correction package and transcribed the estimator-output cost table; two
    independent sessions reviewed the snapshot-committed packages. Validator
    TASK-20260803-8cf2b6: ADMIT_WITH_QUALIFICATIONS. Red team
    TASK-20260803-9ab856: PARTIALLY UPHELD.

    Both producer packages are admitted and ten knowledge entries are FILED --
    the first filing in this campaign. Two findings force retractions of
    committed records, including of the decision that authorized this batch.
  decision: refine
  target_ids: [GOAL-MCE-001, RQ-MCE-e65b3c, EV-MCE-0fbb1a, DEC-20260803-a5b9b1]
  rationale:
    - id: D-1
      what: BOTH PRODUCER PACKAGES ADMITTED; TEN ENTRIES FILED.
      why: >-
        Snapshot integrity 12/12: commit b30400a9 reachable from HEAD, declared
        parent, exactly the declared paths, all recorded blob hashes recompute,
        and the receipt's own hash matches the queue archive block.
        Re-acquisition: 5 sources, 5 byte-identical, 0 non-reproducible. All ten
        new IDs are lowercase random 6-hex, 0/9967 occurrences, no max+1 shape.
        Both reviews independently confirm every superseding entry FIXES its
        defect and DROPS NOTHING the original had right; the validator verified
        the three conjuncts of arXiv:2304.14757 in one sentence of the
        re-fetched PDF. The scope firewall held in both packages.
    - id: D-2
      what: >-
        FILED WITH TWO PRE-FILING FIXES, both demanded by the reviews, and both
        recorded rather than applied silently.
      why: >-
        (1) Three drafts still referred to "the sha256 in `identifiers`" after
        the package's own schema fix moved it to `source_artifact:`. The
        validator flagged this as "a one-word fix now, permanent after filing";
        the red team flagged the same dangling references as R-5. Corrected in
        the filed text. (2) KN-LIT-c4c2ac's tag list carried both `not-goppa`
        and `goppa-excluded` -- two goppa-sense tags on the one paper that
        excludes Goppa codes (red team R-6). `not-goppa` removed. Nothing else
        differs between the reviewed proposals and the filed entries, and both
        changes are exactly what the reviews asked for.
    - id: D-3
      what: >-
        RETRACTED -- DEC-20260803-a5b9b1's promise that the tag correction would
        make the "distinguisher is not break" constraint "enforceable by grep".
      why: >-
        FALSE as designed. tools/build_knowledge_index.py contains no occurrence
        of superseded_by; INDEX.md has no superseded column; superseded entries
        appear unmarked. The old entries keep key-recovery, so
        `grep "key-recovery" knowledge/INDEX.md | grep -c -i distinguish`
        returns 4 before filing and 4 after. Found by red team R-1 and verified
        independently by this Coordinator before recording.

        SUPERSESSION IS THE CORRECT IMMUTABILITY MECHANISM AND IS NOT A
        RETRIEVAL MECHANISM. This program conflated the two. The filing is
        still right -- the corpus now states the correct boundary in a live
        entry -- but the retrieval claim attached to it was invented, not
        checked.
    - id: D-4
      what: >-
        CORRECTED -- "Esser-Bellini SEC Table 1" is a mis-attribution, in six
        records and two handoffs.
      why: >-
        The table is Table 1 of mceliece-security-20221023.pdf, the SUBMITTERS'
        OWN security guide, captioned "Output of the Esser-Bellini estimator".
        It is the designers' document reporting a third party's estimator
        output, not a third-party paper. Red team R-4; the producer had written
        it correctly and this Coordinator dropped the qualifier.

        This is the fifth Coordinator error of the batch and it has a sharp
        edge: EV-MCE-332f99 O-7 states the applicable rule -- "a single source
        that is a party to the claim is not an independent confirmation" --
        and this Coordinator wrote that rule about ISO and then failed to apply
        it to the cost table. EV-MCE-0fbb1a O-1 carries the corrected
        attribution.
    - id: D-5
      what: >-
        UPHELD -- BATCH-002-OPENING section 4's "the baseline half" is wrong,
        and the correction now lives in a ledger record rather than only a task
        directory.
      why: >-
        "Computed" is not satisfied by a citation (producer G1). The red team
        scores 0 of 6 of the second completion criterion's stated requirements
        as met, and notes G2/G8/G9/G10 make it FURTHER away. R-3 also observed
        that the corrected position existed only inside a task directory; that
        is remedied here and in EV-MCE-0fbb1a O-3.
    - id: D-6
      what: >-
        UPHELD -- BATCH-002-OPENING section 3's harm claim is UNDEMONSTRATED
        and "defeated at the grep level" is too strong.
      why: >-
        Red team R-2: `grep -rn "key-recovery" tools/ .claude/ docs/ Makefile`
        returns ZERO consumers of those tags, and all four false positives are
        self-labelled `distinguisher` on the same line, so a reader sees the
        contradiction immediately. The tag defect was still worth correcting --
        an entry whose body says "It does not recover keys" should not be tagged
        key-recovery -- but the stated harm was asserted, not shown. The
        producer declined to test it and rested no correction on it, which was
        the right call.
    - id: D-7
      what: >-
        UPHELD -- BATCH-002-OPENING section 1's claim that D-3 was "already
        corrected" is FALSE, and it bit this batch.
      why: >-
        It was corrected in goal.yaml only. RQ-MCE-e65b3c still carried both a
        constraint instructing binding to ISD-FC-2026 and a scope.targets
        bullet asserting the sibling goals bind to one, while
        TASK-20260803-cb44ab was transcribing a cost table under it. Found by
        TASK-20260803-a53f73, confirmed independently by red team R-9. Both are
        corrected in this archive as RQ-CORR-002, together with a third stale
        field (RQ-CORR-003, the standardization_status still marked UNVERIFIED
        and still carrying the "durable rather than provisional" gloss that
        BATCH-001 withdrew).
    - id: D-8
      what: >-
        RECORDED -- a published falsification control in a committed review
        report does not reproduce.
      why: >-
        BATCH-001's red team asserted KN-LIT-4c8135 mentions Goppa "exactly
        once" and published `grep -c -i goppa` -> 1. It returns 2. The validator
        checked every git revision of the file; only one content revision exists
        and it also returns 2. The report QUOTED BOTH OCCURRENCES in the same
        paragraph as the control claiming one, and the error propagated into
        DEC-20260803-a5b9b1 D-4 and BATCH-002-OPENING section 2.

        DIRECTION MATTERS: the defect is LARGER than recorded, not smaller. The
        second occurrence -- "it does not claim to break alternant or Goppa
        codes at arbitrary rate" -- is the more damaging one, because what it
        implies is what the paper's own sentence denies.
    - id: D-9
      what: >-
        CORRECTED -- the tag-defect prevalence figure. "4 of 4" was the
        137-entry sub-population stated without its scope.
      why: >-
        Three independent measurements with three different parsers agree:
        across 7947 tagged corpus files, 52 key-recovery, 9 distinguisher, 4
        both, 5 distinguisher-only. The defect is LOCAL to the 2026-08-03 sweep,
        because correct single-tagging already existed elsewhere. The producer's
        own summary "4 of 7" is also imprecise (literature-only); EV-MCE-0fbb1a
        O-7 states the measured numbers rather than any summary.
    - id: D-10
      what: >-
        PROCESS FINDING, recorded because it is now a pattern rather than an
        incident.
      why: >-
        Five wrong Coordinator claims in this batch, NONE found by the
        Coordinator: four by a producer commissioned to draft corrections, one
        by the red team. The pipeline is healthy in that nothing was suppressed
        and a producer's flag produced a same-day scope amendment. It is
        unhealthy in that three of the five cost ONE COMMAND to check, and
        D-8's control was printed alongside its own disconfirming evidence in a
        report this Coordinator then copied from without running.

        Naming the precedent a fifth time will not fix it -- BATCH-001 proved
        that. ADOPTED, from the red team's own proposal: before an opening
        document is issued, every grep-shaped claim in it must be RUN and its
        output pasted into the document. Four commands would have caught four
        of the five errors in this batch.
    - id: D-11
      what: NOTHING IS CONCLUDED ABOUT CLASSIC McELIECE'S SECURITY.
      why: >-
        No solver ran, no experiment was designed, no hypothesis exists, and no
        distance between the 2026 attack regime and Classic McEliece was
        computed. claim_tier stays toy and RQ-MCE-e65b3c's ceiling is unchanged.
  evidence_refs: [EV-MCE-0fbb1a]
  limitations:
    - >-
      D-3 is repaired in the RECORD but not in the TOOLING. The corpus still has
      no retrieval-level supersession awareness, so a grep-based novelty or
      scoping check still reads superseded entries as live. This is the leading
      BATCH-003 candidate and it is a tooling change, not another supersession.
    - >-
      The transcribed cost table is the SUBMITTERS' own document. Under this
      program's own rule it is not independent confirmation of anything, and the
      estimator paper defining its cost model (eprint 2021/1243) is unread.
    - >-
      iacr:2026/1232 remains unread; the 403 is path-scoped and reproducible and
      was not re-attempted, per DEC-20260803-a5b9b1's instruction.
    - >-
      PROMOTION GATES: none of G1-G4 addressed. BATCH-002 advances no
      asymptotic-complexity claim of this program's own.
    - >-
      Both reviews are independent sessions on ONE resolved model. NOT
      admissible toward an AGENTS.md rule 13 quorum; no completion_quorum block
      is written and no attestation may be synthesized from these reviews.
    - >-
      2 of 6 campaign batches used. runs_authorized was 0 in every task and 0
      runs were executed.
  next_actions:
    - >-
      EXACTLY ONE NEXT ACTION for the goal: open BATCH-003 to fix the RETRIEVAL
      defect D-3 names -- teach tools/build_knowledge_index.py to read
      superseded_by and mark or exclude superseded entries, then verify with the
      control that currently returns 4 and must return 0. This is a tooling
      change with a mechanical acceptance test, and it is the only item in this
      campaign whose success or failure can be checked by one command.
    - >-
      In the same batch, apply D-10's adopted process rule to the BATCH-003
      opening itself: run every grep-shaped claim and paste its output.
    - >-
      Carry the two validator qualifications that touch no value: the
      "no arithmetic" certification contradicted by its own anomaly note, and
      the false claim that BJMM appears nowhere outside the table header.
    - >-
      DO NOT re-attempt iacr:2026/1232's PDF, and DO NOT bind to ISD-FC-2026
      while DEC-20260802-344883 D-6 stands.
  knowledge_promotion:
    promoted:
      - KN-LIT-c4c2ac
      - KN-LIT-819780
      - KN-LIT-6b5b72
      - KN-LIT-45b1b2
      - KN-LIT-15c85b
      - KN-LIT-48b4eb
      - KN-LIT-7b78de
      - KN-LIT-b7f8f8
      - KN-LIT-209151
      - KN-LIT-9a7860
    not_warranted: >-
      Ten KN-LIT entries filed -- five superseding corrections and five
      specification-family entries that this corpus genuinely did not hold,
      confirmed by two independent dedup runs. Each supersession is TWO writes:
      the new entry, and superseded_by set on its predecessor (KN-LIT-4c8135,
      71d1a0, 13a01d, 7ee1a9, e37d4c). No orphaned supersession exists.

      NO KN-FIND: this program still produced no internal result. EV-MCE-0fbb1a
      is strength inconclusive, far below the replicated/strong bar.

      NO KN-TECH: still zero technique entries on ISD, still correctly so. D-3
      is a live demonstration that this program does not yet know the
      applicability conditions well enough to state them with limits.
  decided_by: coordinator
  decided_at: '2026-08-03'
