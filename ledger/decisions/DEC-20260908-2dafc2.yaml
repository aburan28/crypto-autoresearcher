coordinator_decision:
  id: DEC-20260908-2dafc2
  decision: approve
  decided_by: coordinator
  decided_at: '2026-09-09T03:51:44.675707+00:00'
  target_ids:
  - EXP-ECDLP-651b94
  - TASK-20260908-e34baf
  - TASK-20260908-9ef3ea
  context: Complete S5 source architecture repairs after the archived independent S4 review.
  rationale:
  - Accept the four source findings and preserve the58 passing final boundaries. The independent review used188/640fixed
    cases with complete terminal custody; its12 final source breaks are not scientific observations.
  - The remaining problems concern whole-queue validation and artifact/state-machine architecture. Separate streaming
    and final-custody modules make the actual production path directly testable without running a scientific pipeline.
  - Use the research-deep capability policy at xhigh for this source design/implementation task. The OpenAI binding
    names gpt-5.6-sol; Executor permissions remain unchanged. This is an explicit task-level policy choice, not
    a fallback, degradation, serving-probe claim or retrospective judgement about earlier models.
  - Progress instrumentation must not consume its entire budget through required scientific certificate completions.
    Separate those artifacts while preserving all observations and existing machine caps.
  - Standing authorization approves exact source work and bounded tests only. Linux group-OOM/actual arithmetic
    runtime and launch admission remain separate.
  accepted_findings:
  - id: S4V-01
    title: Review admission still accepts reduced or internally inconsistent governed authority
    required_correction: Apply a source-pinned pure canonical queue/handoff/claim/release/review-plan validator
      to every task without executing arbitrary commit code or mutating the queue. Require the nested handoff plan
      to equal the precommitted plan, freeze every governed review-task field across claim, validate every plan
      subsection, and require every handoff binding digest to equal the corresponding attested source_reads digest
      and snapshot blob.
  - id: S4V-02
    title: Chunked write helpers still materialize complete artifacts and duplicate all-history payloads
    required_correction: Stream each canonical artifact directly into an owned staging file through incremental
      encoders and a guarded 64-KiB writer, updating its digest during the same pass. Avoid returning a dict of
      complete bytes, avoid rebuilding certificates/metrics into parallel all-history objects, and use a streaming
      YAML emitter or another canonical manifest writer whose producer is probed before bounded output fragments.
  - id: S4V-03
    title: The required post-publication completion receipt is deleted on success and its failure can replace the
      original typed stop
    required_correction: Retain the receipt in an explicit immutable operational namespace that survives success
      and is bound by the future execution plan. If receipt publication fails after the payload rename, quarantine
      or explicitly mark the payload incomplete before returning. Preserve the original typed stop alongside every
      secondary retention error, and remove the progress tree only after its required receipt has durable replacement
      custody.
  - id: S4V-04
    title: Occupancy failure is checked only after all seven null collision censuses
    required_correction: Construct and retain all seven assignment/bucket-count objects first, reduce occupancy
      once at that boundary, and stop with the retained partial invalid state before any null census or relabel/control
      work. Only after occupancy holds should the seven frozen null censuses run.
  approved_correction_boundaries:
  - Preserve the exact frozen scientific fixtures, seeds, RNG byte schedules, estimators, thresholds, controls and
    all passing V/S2/S3/S4 behavior. Use the six-file S4 source at2c2b45a5772894c4bd0431cb2b5da45775382328 as the
    additive baseline; its producer remains operationally failed. Do not rewrite its receipt or infer past execution
    compliance.
  - Apply complete source-pinned canonical validation semantics to the entire admitted queue, every nested handoff
    and plan, claims and releases. Validate every plan subsection and every task, not a selected-field mirror. Resolve
    legitimate inline or path-bound plan representations to the same precommitted plan. Freeze every governed claimed-task
    declaration field, including dependencies, allowing only explicitly declared lifecycle state/bookkeeping changes.
  - Every declared handoff input binding digest must equal the attested read digest and the actual snapshot blob.
    Preserve complete output/release hash equality and source->plan->claim->release->archive->authority ancestry.
    Load only locally trusted, independently source-pinned validator modules/dependencies; never execute arbitrary
    code read from an external commit or mutate the admitted queue. Retain a canonical valid lifecycle test with
    an unrelated plan-to-claim commit.
  - Replace whole-payload materialization with a streaming artifact pipeline. Write each canonical artifact directly
    to its owned staging file, incrementally hash and verify it, and keep bounded buffers no larger than64KiB per
    emitted/read/write chunk. Do not accumulate a complete bytearray, bytes, StringIO/CSV text, list of raw lines,
    or parallel all-history structures before writing. A bounded small manifest graph is permissible only with an
    explicit pre-serialization size/lifetime guard; large histories must be streamed or file-backed.
  - Introduce streaming.py and custody.py as the two additional source modules. Keep large captured cells/certificates/diagnostics
    in append-only spools and retain only the current bounded cell plus compact decision reducers in memory. Preserve
    every scientific record and its ordering. JSON used as YAML is acceptable only if all key/value types and required
    document semantics are preserved; no silent integer-key conversion.
  - Use one shared, directly testable finalizer in custody.py for both production and lower-level fixed tests. The
    finalizer streams payloads, establishes durable payload publication, captures complete payload-duration timing,
    then durably writes a stable operational completion receipt at run_root/runtime-custody/<run_id>/operational-completion.json.
    Bind this exact companion namespace in the execution plan. The terminal receipt explicitly excludes its own
    write/fsync duration; no self-inclusive timing or self-hash.
  - Success requires both the durable payload and durable operational companion. If companion write/fsync fails
    after payload rename, quarantine or explicitly retain the payload as incomplete before returning. Preserve the
    original typed cancellation/resource/infrastructure/measurement stop alongside secondary custody failures. Never
    delete the only progress/spool evidence; remove temporary progress only after every required record has durable
    replacement custody.
  - Keep compact progress separate from scientific certificates. Do not append a progress event for every successful
    scalar certificate or duplicate certificates into the progress log. Persist scientific certificates in their
    own append-only artifact/spool, and flush the required prefix before actual guard probes and immediately before
    a failure stop. Retain the1024byte event,256MiB log,64KiB latest-checkpoint caps and at most250ms polling cadence
    between eligible opportunities; signal flags are checked at every existing bounded opportunity. Derive the full-panel
    counts and distinguish a safe cap from a completion guarantee.
  - Construct and retain all seven frozen shuffle assignments/bucket counts before any null collision census. Reduce
    occupancy once at that boundary and retain/stop immediately on failure. Only a valid assignment set permits
    null censuses. Preserve relabel and scalar-certificate immediate stops. Keep RNG results and charged scientific
    operation conventions unchanged; retain assignment-preparation cost under its proper phase.
  - Use fixed lower-level synthetic/mock/Git/artifact tests, including the actual shared finalizer, to exercise
    success and failures at serialization, payload rename, companion write/fsync and cleanup. Test a large lazy
    payload and a large string/record to detect pre-write materialization and missing guard opportunities. Tests
    must not use a duplicate test-only implementation. No public future-run/measurement entrypoint or scientific
    generator/census/panel may run, even with a mocked admission gate.
  - Retain every test command, absolute UTC boundary, pre-reserved case count, terminal exit, stdout/stderr and
    session handle. Redirect logs before execution and poll yielded handles until terminal before another attempt.
    Do not discard r.session_id, reset counts or infer termination from the functions.exec wrapper. Unknown telemetry
    remains unknown and cannot support a completed execution-custody claim.
