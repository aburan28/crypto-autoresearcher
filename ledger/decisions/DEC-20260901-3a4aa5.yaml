coordinator_decision:
  id: DEC-20260901-3a4aa5

  context: >-
    GOAL-AES-003 batch-opening act by the dispatching Coordinator
    (session coordinator-aes003-1, 2026-09-01). DEC-20260901-600997
    closed BATCH-5ed9a3 with RANK 1 = a scoped powered follow-up
    proposal. IDEA-20260901-f8294e was authored and filed on main
    (PR #680): one 2^32 t=1 arm under the inherited repaired X
    statistic, preceded by a matched-exposure r=6 dead anchor, with an
    ordered branch-precedence cascade repairing the RX-WEAK-b2/RX-DEAD
    overlap. Required instrument delta: HIT_LOG_CAP 64->256, policed
    by source-diff audit and Gate-0 rebuild.

  decision: open_batch

  decision_scope: >-
    THIS DECISION OPENS BATCH-ace664 AND DISPATCHES ITS QUEUE. It does NOT move
    current_batch_id (that happens in the closing ledger archive), does
    NOT spend Stage 1a/1b of IDEA-20260901-363851, and does NOT assert
    any outcome. It authorizes execution of IDEA-20260901-f8294e under
    its preregistered ordered decision cascade, with validator and
    red-team review before ledger recording.

  target_ids:
    - GOAL-AES-003
    - RQ-AES-003
    - BATCH-ace664
    - IDEA-20260901-f8294e
    - TASK-20260901-579808
    - TASK-20260901-f7762c
    - TASK-20260901-1c8501
    - TASK-20260901-7df96a
    - TASK-20260901-124a06
    - EV-AES-896ef2
    - DEC-20260901-c3d261
    - DEC-20260901-600997
    - EV-AES-241790

  outcome: >-
    Batch opened. Producer TASK-20260901-579808 executes the 2^32 anchor and alive arm
    with gates; snapshot TASK-20260901-f7762c binds the producer package before
    review; validator TASK-20260901-1c8501 and red-team TASK-20260901-7df96a run blind to each other
    after the snapshot; ledger TASK-20260901-124a06 is the sole archiver of both
    review packages and records EV-AES-896ef2/DEC-20260901-c3d261.

  rationale:
    - >-
      RANK 1 of DEC-20260901-600997 is exactly this proposal. It
      repairs the branch-precedence ambiguity and provides quantified
      power (rho_80 <= 0.109 uniformly over expected hit counts)
      before any further carrier closure is considered.
    - >-
      The batch is bounded by the proposal's binding baseline
      (~4.5 h) and wall-clock cap 18000 s, max 8 runs; every stage
      boundary is a stopping point with a committed reading.
    - >-
      A claim-changing outcome (PX-ALIVE, or lane closure at the
      measured exclusion frontier) gets both validator and red-team
      before ledger recording; the coordinator prior is recorded below
      before any reviewer runs.

  review_plan:
    prior: >-
      I expect the matched 2^32 dead anchor to pass (p_extra near 1.0)
      and the arithmetic/gates to survive. The uncertain joint is the
      alive 2^32 arm: either PX-DEAD (non-replication, lane closure at
      measured power), PX-WEAK (weak-signal survival), or PX-ALIVE
      (resurrection). Where I think it can break: HIT_LOG_CAP change
      introducing perturbation, finite-class null estimation at 2^32,
      or over-strong closure language if PX-DEAD.
    joints:
      - joint: arithmetic/gates/instrument perturbation
        owner: validator
        attack_plan: >-
          Re-derive X/F/S and exact DP p-values blind; verify Gate-0
          rebuild identity under the extended allowed-diff list
          (HIT_LOG_CAP only), anchor-first sequence, KAT/determinism/
          digest gates, hit_overflow=0, snapshot hashes.
      - joint: interpretation/scope/power/closure language
        owner: red-team
        attack_plan: >-
          Attack whether the power statement is honest, whether
          PX-DEAD closure is scoped to the measured exclusion
          frontier, whether PX-WEAK/PX-ALIVE language stays within
          probe cell/toy tier, and whether the precedence cascade can
          still overlap.
    blindness:
      declared: true
      lifted_for: null
    proves_too_much: >-
      The matched 2^32 dead anchor is the built-in proves-too-much
      control; red team must also apply the statistic to prior dead
      arms/null objects where available.
    blind_rederivation:
      required: true
      blind_from: producer implementation and run report; validator derives from proposal and committed receipts only.

  next_action: >-
    Execute the queue. On PX-ALIVE: claim-changing review and
    Coordinator decision before any Stage 1 spend. On PX-WEAK: named
    pooled successor, no closure. On PX-DEAD: scoped lane closure at
    measured exclusion frontier; rho<rho_50 remains named-unmeasured.
    On PX-ANCHOR-FAIL/PX-GATE-FAIL: invalid_measurement, halt, repair.

  evidence_refs:
    - ledger/proposals/IDEA-20260901-f8294e.yaml
    - ledger/evidence/EV-AES-241790.yaml
    - ledger/decisions/DEC-20260901-600997.yaml

  knowledge_promotion:
