    refused. This decision does not withdraw those contracts.

    The contract freezes the curve y^2 = x^3 + x + 1 over F_7, affine
    points over F_343, and the gates b <= 4 and L >= 2. Success is the
    source idea's prediction. The concrete negative is b > 4 while
    L >= 2 and the calibrations pass. No (L, b) was computed in this
    session. Field arithmetic for the basis polynomial z^3 + 2 was
    checked without enumerating points.

    The driver is in the experiment directory. No trial plan is frozen,
    because a trial plan requires status approved. This decision does
    not launch the driver. The same pass files IDEA-20261007-d1a14f,
    IDEA-20261007-7d95b5, and IDEA-20261007-469116 and does not design them.

  rationale:
    - The standing authorization covers a complete protocol only when the capacity check also passes. It does not pass.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - b > 4, with the calibrations passed and L >= 2, is reachable as a recorded outcome, so success is not automatic.
    - The x-coordinate pair, the 30-point identity, the seven-bin label, the discriminant, and the swapped summation order are the instrument controls.
    - An instrument failure is not relabeled as explanation 1, and the maximum fanout does not choose the reading row.
    - This session did not compute b and did not claim that an exponent moves.
    - The goal had no approval headroom. The contract stays review_required.

  evidence_refs: []
  limitations:
    - The measurement, once run, covers one curve over F_343. It does not transfer to a larger field.
    - A passing pair does not lower the generic exponent 1/2 and does not recover a discrete logarithm.
    - A calibration failure and a timeout are not the negative.
    - This decision does not authorize execution.
    - This decision does not edit a goal head.
    - The three new proposals are not hypotheses and are not approved experiments.

