coordinator_decision:
  id: DEC-20260806-357b30
  context: >-
    GOAL-SSIQ-001 BATCH-008 closes -- the LAST batch within this goal's
    declared 8-batch campaign_budget (maximum_batches: 8). It executed a
    frozen v5 amendment (specification_v5.yaml, after two pre-freeze
    review rounds) bundling two independent, zero-new-search actions:
    PART A fixed GD-11 (a numerical-robustness defect in shared library
    code, found in BATCH-007); PART B ran the trapping-mechanism
    diagnostic deferred since BATCH-006. PART A is confirmed genuinely
    closed by both reviewers. PART B's own required cross-check failed
    on all four primes, and both reviewers independently traced this to
    a defect in the frozen contract's own specification text (comparing
    the wrong vertex), not a code bug -- named GD-12. Recorded as
    EV-SSIQ-334ab9, on TASK-20260806-3c6363 ADMIT-WITH-CONDITIONS and
    TASK-20260806-bf15ab CHALLENGE.
    THIS DECISION ALSO TRANSITIONS GOAL-SSIQ-001's STATUS, per the
    campaign budget boundary reached at this batch's close (see
    goal_closure section below).
  decision: revise
  decision_note: >-
    revise for BATCH-008 itself (GD-11 closed; GD-12 named with a
    concrete, zero-new-search-cost fix). This is the fifth consecutive
    batch (BATCH-004 through BATCH-008) in which independent review found
    a validation-instrument or specification defect rather than new
    evidence about the underlying mechanism -- GD-7, GD-8/GD-9, GD-10,
    GD-11, now GD-12. Per the inventor protocol and both reviewers'
    explicit assessment, a run of instrument-shaped findings is a fatigue
    report about this campaign's OWN process discipline, not evidence
    that lever L4 (the only lever whose ceiling meets this goal's target)
    is exhausted -- L4 is NOT retired by this decision.
  target_ids:
    - GOAL-SSIQ-001
    - RQ-SSIQ-9702af
    - EXP-SSIQ-a85692
    - EV-SSIQ-334ab9
    - TASK-20260806-b3c2fc
    - TASK-20260806-3c6363
    - TASK-20260806-bf15ab
  evidence_refs:
    - EV-SSIQ-334ab9
  rationale:
    - id: D-1
      statement: >-
        GD-11 IS GENUINELY CLOSED, INDEPENDENTLY CONFIRMED BY BOTH
        REVIEWERS VIA FROM-SCRATCH RE-EXECUTION, CONFIRMING THE FIX
        REACHES bootstrap_gap_ci_v2's OWN RESAMPLING LOOP (not merely a
        standalone function), exactly closing the hollow-fix risk the
        first pre-freeze review round caught before freeze. This is an
        unambiguous, fully independent advance.
      confidence: high
    - id: D-2
      statement: >-
        A NEW DEFECT IS NAMED, GD-12, IN A GENUINELY NEW CATEGORY: AN
        UNCONDITIONAL MATHEMATICAL CLAIM ASSERTED WITH HIGH CONFIDENCE IN
        A PRE-FREEZE REVIEW'S OWN PROSE, TRANSCRIBED INTO FROZEN CONTRACT
        TEXT AS FACT, NEVER CHECKED AGAINST A CONCRETE TRACE BY EITHER OF
        TWO REVIEW ROUNDS. Both reviewers independently confirmed, with
        their own fresh counter-examples (the Validator re-traced the
        Executor's own p=2437 example end to end; the Red Team
        constructed an entirely separate example at p=3889 the Executor
        never used), that greedy_descent_hitting_time's "trapped" flag
        reflects the walk's TERMINAL vertex, never exposed by its return
        value, not the START vertex the frozen contract's cross-check
        compared against. THE INSTRUMENT WORKED EXACTLY AS BUILT AND
        FAILED LOUDLY AND REPRODUCIBLY, per this campaign's own
        discipline -- this is not a repeat of GD-9/GD-10 (a check that
        cannot fail or doesn't call the right function); the defect is
        upstream, in what the contract told a working instrument to
        compare.
      severity: medium
      standing_repair_adopted: >-
        Any pre-freeze finding that asserts a mathematical equivalence,
        invariant, or "provably exact" claim as the justification for a
        required check must be accompanied by a concrete, executed trace
        of at least one non-trivial instance before that claim is written
        into frozen contract text as unconditional fact -- the same
        "trace it, don't trust it" standard this campaign's GD-9/PF-9
        lineage already applies to Executor and Coordinator artifacts,
        extended explicitly to a reviewer's own mathematical assertions,
        including within the SAME review that may apply this discipline
        correctly to an adjacent finding (as round 2 did for PF-9 but not
        PF-6).
    - id: D-3
      statement: >-
        THE RED TEAM FOUND GD-12's DIAGNOSIS WAS INCOMPLETE ON ITS OWN,
        AND COMPLETED IT: a second, independent boundary-condition defect
        at the delta_E=1 "success" case (where start and terminal ARE the
        same vertex) means a naive fix -- simply exposing the walk's
        terminal vertex -- would newly misclassify every SUCCESSFUL walk
        (15-28% of vertices per prime) as a disagreement. The correct fix
        must restrict the equivalence claim to trapped: True walks only.
        This finding is adopted into GD-12's own fix specification below
        rather than treated as a separate defect, since it is part of the
        same underlying contract-text error, discovered in the same
        investigation.
      confidence: high
    - id: D-4
      statement: >-
        THE STRUCTURAL LOCAL-MINIMUM FRACTIONS (0.41-0.47 per prime)
        REMAIN VALID DESPITE THE CROSS-CHECK'S FAILURE, INDEPENDENTLY
        CONFIRMED BY BOTH REVIEWERS THROUGH FROM-SCRATCH RECOMPUTATION
        AND BIT-EXACT REPRODUCTION OF THE ARCHIVED greedy_trapped_fraction
        (confirming exact graph-rebuild fidelity, not merely a
        same-count graph). The contrast between this fraction and the
        72-85% walk-based greedy_trapped_fraction is itself a real,
        quantified funnelling signal -- fewer than half of vertices are
        genuine structural local minima, yet most greedy walks end up
        trapped somewhere -- the first candidate mechanism this campaign
        has that could explain WHY trapping is pervasive, not merely
        re-confirm that it is.
      confidence: medium
  limitations:
    - >-
      No claim about H-SSIQ-36e970, a delta_E-gradient's existence, or a
      p^{1/4} algorithm is made anywhere in this decision or its evidence
      record. Lever L4 is explicitly NOT retired.
    - >-
      GD-12's fix (a corrected cross-check) is NOT yet applied; it is a
      named, zero-new-search-cost resume action for whenever this goal is
      next worked, not a completed correction.
    - >-
      Toy scale throughout; nothing transfers to cryptographic scale.
    - >-
      Model independence remains absent and unverifiable in this
      environment, unchanged from every prior batch. Evidence strength
      stays capped at preliminary campaign-wide.
  next_actions:
    - >-
      RANKED RESUME ACTION FOR WHENEVER THIS GOAL IS NEXT RE-APPROVED OR
      EXTENDED (not scheduled as a next batch under the current, now-
      exhausted budget -- see goal_closure below): (1) [highest value]
      correct GD-12 by superseding (never editing) greedy_descent_hitting_time
      with a version that exposes the walk's terminal vertex (the same
      supersede-by-addition discipline ols_hardened.py already
      established for GD-11), and rewrite the cross-check to restrict the
      equivalence claim to trapped: True walks (comparing against
      is_structural_local_min(terminal)) while explicitly excluding the
      delta=1/success case from any comparison -- zero new search cost,
      re-run against the same four primes' already-archived delta_map;
      (2) [second] investigate which structural local minima capture the
      most walks (an in-degree/funnel-structure analysis), the most
      promising specific mechanism question for L4 once GD-12 is fixed;
      (3) [deferred, correctly, unchanged from BATCH-006's reasoning]
      widening to larger primes/N stays deferred until (1) and (2) give
      an evidence-based reason to expect different behavior.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Nothing promoted; this batch's findings are infrastructure/defect-
      naming, not evidence toward any hypothesis. A NINTH KNOWLEDGE
      CANDIDATE IS NOW QUEUED campaign-wide, distinct from the prior
      eight: "an unconditional mathematical equivalence claim asserted in
      review prose as justification for a required check must be
      accompanied by a concrete executed trace before being written into
      frozen contract text as fact -- the discipline applies to a
      reviewer's own mathematical reasoning, not only to code and data
      claims, and must be applied uniformly within a single review, not
      selectively to some findings and not others." All nine promote
      together when a genuinely different model becomes available to
      re-check them.
  goal_closure:
    status_transition: active -> closed_at_budget
    recorded_in: ledger/goals/GOAL-SSIQ-001/goal.yaml (status_value_history)
    reasoning: >-
      GOAL-SSIQ-001's campaign_budget.maximum_batches is 8; BATCH-008,
      closed by this decision, is the 8th and final batch within that
      declared hard limit. Per goal.yaml's own pause_conditions ("the
      eight-batch campaign budget is exhausted") and per AGENTS.md's
      distinction between paused/blocked/closed_at_budget (all assert NO
      success) and completed (requires a committed decision showing a
      declared completion criterion was met): NONE of GOAL-SSIQ-001's
      five completion criteria are met. Criterion 1 (exponent-budget
      decomposition) and criterion 5 (verified ledger archive) are
      satisfied on an ongoing basis, but criterion 2 (every lever carries
      a full method-ceiling audit) is not complete for every enumerated
      lever, criterion 3 (a surviving lever advanced to a falsifiable
      hypothesis with independent review) is satisfied for L4 specifically
      but criterion 4 (a sub-1/3 mechanism surviving review) is not met
      and is explicitly conditional, not required. goal.yaml's own
      on_not_closing_early note is explicit: meeting criteria 1-3 and 5
      does not license closure while any lever remains OPEN and budget
      remains -- and now budget does NOT remain, which is exactly the
      closed_at_budget case, distinct from and weaker than completed.
      closed_at_budget is chosen over a bare paused because the specific,
      stated reason for stopping IS budget exhaustion (not an
      infrastructure blocker, not a user request, not every lever
      closing) -- matching this repository's own established convention
      for a hard-budget stop with an open lever (per RT-BATCH-008's
      citation of GOAL-MLKEM-001/GOAL-P13-001/GOAL-AES-002/003's identical
      pattern). closed_at_budget asserts NO success and does not retire
      or downgrade lever L4's OPEN status -- L4 remains the only lever
      whose ceiling meets this goal's p^{1/4} target, and is explicitly
      NOT closed by any committed ceiling argument or executed
      falsification.
    resume_action: >-
      Same as next_actions above: (1) fix GD-12 (corrected cross-check,
      zero new search cost), (2) the funnel-structure diagnostic, (3)
      widening to larger N only if (1)-(2) justify it. Resuming this goal
      requires either an extended/renewed campaign_budget or a fresh
      goal record explicitly continuing this one's lever map and ledger
      history, per this campaign's standing practice for a budget-
      exhausted, not-completed goal.
    not_closed_early_reaffirmed: >-
      This transition is NOT a retirement of lever L4 and does NOT
      understate what BATCH-001 through BATCH-008 established: L1 closed
      in scope (BATCH-001); the delta_E-computation instrument,
      budget-allocation formulas (twice fixed), trapped-vertex exclusion
      filter, and null-label comparison wrapper are all independently
      validated, reusable infrastructure; the first-ever real M-GAP was
      computed (BATCH-005); a quantified funnelling signal in the
      trapping mechanism was found (BATCH-008); and nine defects (GD-1
      through GD-12, several superseding earlier ones) were named, fixed
      or scoped, and used to adopt nine standing process repairs. None of
      this is claimed as evidence for or against a delta_E-gradient or a
      p^{1/4} algorithm at any point.
  decided_by: coordinator
  decided_at: '2026-08-06'
