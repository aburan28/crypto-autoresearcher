    hypothesis_status_changed: true
    hypothesis_transitions:
      - hypothesis_id: H-SEMBIN-c5b2e0
        from: specified
        to: approved
        goal_id: GOAL-SEMBIN-5078bc
        question_id: RQ-SEMBIN-ade131
        contract: EXP-SEMBIN-354a75
        execution_authorized: true
    experiment_status_changed: false
    experiment_status_note: >
      EXP-SEMBIN-354a75 was already `approved` under DEC-20260913-ebd639. What
      changes here is execution authorization, which is a dispatch fact rather
      than a contract status. The contract is not reopened, amended, or
      reversioned.
    execution_authorized_now: [EXP-SEMBIN-354a75]
    execution_still_not_authorized: [EXP-SEMBIN-c2c312, EXP-SEMBIN-7e1371]
  ranking:
    - rank: 1
      id: EXP-SEMBIN-354a75
      authorized: true
      reason: >
        It COUNTS rather than solves, so it inherits neither Assumption 1 nor
        Assumption 2 and is not gated by the definitional question that blocks
        the degree work. Its cells are n <= 24 with |V|^t exhaustively
        enumerable inside a 4 GB cap, so it needs no machine headroom this
        environment lacks. And it is the input both completed derivations name
        as the thing that could change their reading. Nothing else available
        does all three.
    - rank: 2
      id: EXP-SEMBIN-c2c312
      authorized: false
      reason: >
        Still the gate for the degree work, and still worth doing, but it
        consumes a Groebner or Macaulay engine that this environment has not
        been confirmed to provide. Authorizing it before that is confirmed would
        put a task in flight whose first act is to discover it cannot run.
        Ranked behind 354a75 rather than dropped.
    - rank: 3
      id: EXP-SEMBIN-7e1371
      authorized: false
      reason: >
        Blocked by c2c312 by construction, and carries the real
        machine-headroom risk in this batch -- the cells it wants are the ones
        Kosters reported at 111-126 GB.
  rationale:
    - >
      STANDING USER AUTHORIZATION of 2026-09-06 covers the approval; protocol
      readiness is checked here and was already checked once under
      DEC-20260913-ebd639. Rechecked for this dispatch: the contract carries
      seven controls including a realized-random-map matched null and a
      known-false class count, a declared window (tk - n in [-6, +6]), five
      seeds, 2000 R draws per cell, an exhaustiveness control by two
      independent orderings, a 4 GB and 3600 s per-run budget, invalidation
      rules that void a non-exhaustive cell rather than downgrade it, and a
      success criterion satisfiable by EITHER answer -- a ratio
      indistinguishable from 1 refutes the hypothesis and vindicates eq. (11),
      and the contract says so explicitly.
    - >
      ECC FIRST. SEMBIN is a declared ECC area in
      orchestration/research-priority.yaml, confirmed through
      tools/ecc_priority.py rather than inferred from the prefix, so both goals
      carry null batch and wall-clock ceilings. Unlimited budget removes the
      ceiling and not the duty to rank, which is what the ranking block above
      discharges: this task is ranked ahead of doing nothing because two
      committed run records name its output as the thing that would change their
      interpretation.
    - >
      WHY NOT WAIT FOR THE REVIEW ROUND. REVIEW-SEMBIN-20260913-9d649f is in
      flight over the two completed runs. This dispatch is deliberately
      independent of it: the yield enumeration consumes neither run's output,
      shares no code path with either implementation, and its result is
      informative whichever way the review goes. Serializing it behind the
      review would buy no independence -- the reviewers cannot see it and it
      cannot see them -- and would idle the ranked queue on a goal that may not
      be paused. If the review breaks either derivation, the yield measurement
      is still the right next measurement.
    - >
      SCOPE, recorded before any result exists. This is a TOY-SCALE count at
      n <= 24. The MAGNITUDE of any measured ratio is claimed only over that
      window. Only the SIGN of the bias transfers upward, and it transfers by
      the paper's own inequality chain in Section 4.3 -- P(n,m,t,k) >= P(solve
      eq. 5), with equality assumed -- rather than by any measurement here. A
      ratio below 1 makes Semaev's stage-1 cost an underestimate and moves the
      concrete crossover; it cannot move the asymptotic exponent, which absorbs
      a constant or t-dependent factor in P identically.
    - >
      A YIELD RESULT SAYS NOTHING ABOUT EITHER DEGREE ASSUMPTION. eq. (11) is a
      probability model and Assumptions 1 and 2 are degree bounds; neither
      supports nor refutes the other. Recorded here because the temptation to
      read a yield shortfall as evidence against the paper generally is exactly
      the overclaim this batch is most exposed to.
    - >
      A PRE-EXISTING SIGNAL IS ALSO AT STAKE, which is why this is worth more
      than its own hypothesis. Two frozen protocols under GOAL-RELN-001 and
      GOAL-ICEX-001 cite a reference curve named HEUR-SEMAEV-2015-4.3 -- Section
      4.3 of a paper this program recorded as UNREAD until 2026-09-13 -- and
      H-RELN-96e3ba reports a 2^m-type discrepancy against it at m = 2. Counting
      both the chained and single presentations on the same target points is
      what separates "eq. (11) is the wrong law" from "eq. (11) is right for
      eq. (4) and the chain loses solutions" from "a mapping error between an
      F_{2^n} derivation and a toy prime-field instrument". Those records are
      immutable; if the comparator proves biased the remedy is a new record and
      an additive amendment, never an edit.
  evidence_refs:
    - experiments/EXP-SEMBIN-354a75/specification.yaml
    - ledger/hypotheses/H-SEMBIN-c5b2e0.yaml
    - ledger/decisions/DEC-20260913-ebd639.yaml
    - experiments/EXP-SEMBIN-81dc96/runs/RUN-SEMBIN-aa5161/manifest.yaml
