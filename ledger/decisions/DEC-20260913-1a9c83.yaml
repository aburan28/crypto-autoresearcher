    - coordination/review/sembin-20260913-9d649f/review-plan.yaml
  citations:
    - ref: KN-LIT-fa346d
      provenance: internal
      claim: >
        Supplies eq. (11), P = 1 - exp(-2^{tk-n}/t!), the Section 4.3 inequality
        chain P(first t-1 systems) >= P(n,m,t,k) >= P(solve eq. 5) inside which
        it is derived, the assumption that the right-hand relation is an
        equality, and the printed probability cells of Tables 1-2 that the
        baseline control must reproduce.
      verified_by: >
        coordinator, 2026-09-13; read inputs/SEMAEV-2015-310/paper_fulltext.md
        Section 4.3 and inputs/SEMAEV-2015-310/tables.yaml in full
    - ref: RUN-SEMBIN-aa5161
      provenance: internal
      claim: >
        Records in its own preregistered-outcome block that the t = m optimality
        result holds UNDER THE PUBLISHED YIELD LAW, and that if eq. (11)
        overstates realized yield more at t = m than at t < m the comparison
        changes and the optimization must be rerun. This is the dependency that
        moves 354a75 to rank 1.
      verified_by: >
        coordinator, 2026-09-13; read the run manifest and raw-result.json in
        full. NOTE: this run is under review and is an observation, not
        validated evidence. It is cited here as a statement of its own stated
        dependency, which does not require the run to be correct.
  limitations:
    - >
      Authorizing execution asserts the protocol is complete and the task is
      ranked. It asserts nothing about whether H-SEMBIN-c5b2e0 is true, and it
      is not evidence for anything.
    - >
      No hypothesis moves past `approved` on this decision, and no experiment
      changes contract status.
    - >
      The two runs cited above have NOT been independently reviewed. This
      decision uses one of them only for what it says about its own scope, which
      is a claim about the record rather than about the world. If the review
      round breaks that run, this dispatch's ranking rationale weakens but the
      task remains ranked on its own merits -- it is the only available ranked
      SEMBIN work that needs no engine this environment lacks.
    - >
      Nothing here bears on Assumption 1, Assumption 2, the asymptotic bound
      (17), or the security of any deployed curve.
  next_actions:
    - >
      Execute EXP-SEMBIN-354a75 under TASK-20260913-4df669 as RUN-SEMBIN-1b9afe.
      Retain per-R counts in full rather than aggregated; the contract requires
      it and the tail checks are unrecoverable from aggregates.
    - >
      Honour the stopping rules literally. In particular: a measured ratio ABOVE
      1 contradicts the paper's own inequality chain and is a procedure defect
      to diagnose, never a finding; and a cell that does not fit its cap is
      recorded UNREACHED with the size of V^t it needed. Substituting sampling
      for enumeration in a cell that did not fit is this experiment's principal
      false-positive route and is forbidden.
    - >
      Snapshot-archive before any independent review reads the run. Do not write
      an evidence record from within the executing session.
    - >
      Confirm whether a Groebner or Macaulay engine is available in this
      environment. That, not a research judgement, is what currently withholds
      EXP-SEMBIN-c2c312.
