coordinator_decision:
  id: DEC-20260913-1a9c83
  recorded_at: '2026-09-13'
  decided_at: '2026-09-13'
  decided_by: coordinator
  recorded_by_task: TASK-20260913-4df669
  archived_by: TASK-20260913-4df669
  goal_id: GOAL-SEMBIN-5078bc
  batch_id: BATCH-9d649f
  decision: approve
  decision_label: authorize_execution_of_EXP-SEMBIN-354a75_yield_enumeration
  context: >
    DEC-20260913-ebd639 approved five SEMBIN protocols and authorized execution
    for two of them, leaving EXP-SEMBIN-354a75 at rank 2 with execution
    withheld. Both authorized derivations have now run (RUN-SEMBIN-121b59 and
    RUN-SEMBIN-aa5161) and are under independent review as
    REVIEW-SEMBIN-20260913-9d649f. This decision authorizes execution of
    EXP-SEMBIN-354a75, the exhaustive yield enumeration against Semaev's
    eq. (11), and of nothing else.

    THE REASON IS SUPPLIED BY THE TWO RUNS THEMSELVES, and it is not the reason
    the earlier ranking gave. Both derivations turned out to rest on eq. (11)
    being the realized yield rather than an upper bound on it, and both said so
    in their own limitations. RUN-SEMBIN-aa5161 is the sharper case: its whole
    result -- that Semaev's t = m is optimal because yield loss from shortening
    the chain is exponential while solving savings are polynomial -- is a
    statement about the SHAPE of eq. (11). Its own preregistered-outcome block
    records that if eq. (11) overstates realized yield more at t = m than at
    t < m, the comparison inverts and the optimization must be rerun. So the
    yield measurement is not merely the next ranked item; it is the input that
    decides how much either result is worth, and it is measurable now.
