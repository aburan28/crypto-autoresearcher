    "rationale": [
      "Both complete source proposals are retained at their actual hashes. Public disjoint target routing asks about conditional solve cost at unchanged union storage and target law; bounded-fill elimination asks about total stopped work at certified projected rank and matched memory. Neither claims an increase in conserved mean tuple count or an observed exponent gain.",
      "EXP-RELN-ee5c12/H-RELN-341f71 already own the inverse-fibre estimator. Its group-a archive c582390984fa6328609920e2729dd865384fdd3d and all thirteen current blob hashes are bound; its science task is separately blocked in the read queue. Routing is a bounded refinement of RQ-RELN-61638a’s broader learned solve-policy scope, not new ownership of that entire question.",
      "IDEA-20260905-1a8cb3 supplies a distinct dependency/rank-accounting proposal. H-ICEX-87ad66/EXP-ICEX-e0c85b owns the LP-1 exchange-rate/crossover draft and expressly leaves LP-2/cycle behavior outside its scope. The bounded-fill designer must compare actual filtering policy costs and not reproduce an unchanged owned benchmark.",
      "The bounded-fill literal determinant control remains a source-definition gate. The future designer must distinguish the auxiliary block, cancellation kernel, projected rows and exact rank, construct a worked control, and return revise if source interpretation cannot be retained without additive clarification. This concern is not an independently validated counterexample or a reason to abandon the mechanism.",
      "All routing N-about2^12/2^16/2^20, three-ordinary-curve, m3 and at-most-eight-predicate requirements remain; all bounded-fill N-about2^12..2^20, m3, two auxiliary-set sizes, f_max8/16/32 and20 independent streams per cell remain. Future designers must freeze unresolved exact finite choices without reducing source scope. Calibrated policy bytes and a published snapshot are mandatory before holdout.",
      "The current work produces exactly two questions, a ranking/audit/proposed queue/report/runtime record and this DEC. Future designers own seven exact files each and snapshots eight exact paths each. Extra lifecycle and run IDs must be minted/checked before use; no H, EXP, implementation or scientific run is produced by this intake.",
      "Standing user authorization satisfies permission. Parent validation, exact nine-path intake snapshot/publication, canonical adoption, fresh focus/runtime/claims and nonoverlap are still required before either designer starts. The opening decision was null because the lane was preparation-only, not because a future approval already existed."
    ],
