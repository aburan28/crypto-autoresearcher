coordinator_decision:
  id: DEC-20260810-4b8bbc
  context: >-
    BATCH-33b207 of GOAL-ECTD-001. The Executor task TASK-20260806-986054 ran and its
    17 declared artifacts are committed on main. The snapshot archive task
    TASK-20260806-a49026 was then dispatched to bind a custody receipt over them, and
    it cannot be completed: the dispatcher rejected it twice, on two different grounds,
    and the second rejection also corrected a factual briefing this Coordinator had been
    given about which commit holds the package. THIS DECISION ADJUDICATES ARCHIVE-CHAIN
    MECHANICS AND NOTHING ELSE. No scientific content was reviewed, no run was validated,
    no evidence record was produced, and no experiment or hypothesis is a target of this
    decision. The two runs themselves are committed, byte-verified and untouched.
  decision: revise
  target_ids:
  - TASK-20260806-a49026
  - GOAL-ECTD-001
  - BATCH-33b207
  rationale: >-
    THE SPECIFICATION OF TASK-20260806-a49026 IS VOIDED, NOT THE RUNS IT WAS TO ARCHIVE.
    The task was specified as a snapshot archive that commits a producer's work and binds
    a receipt to that commit. By the time it was dispatched the work was already committed
    by the orchestrating Executor session, so the task had nothing to stage and could only
    bind a receipt to commits it did not make. That is the whole defect, and it is a
    scaffolding defect.

    TWO EMPIRICAL REJECTIONS, QUOTED VERBATIM FROM tools/research_dispatch.py AS RUN BY
    THE DISPATCHING SESSION. This Coordinator session has no shell and did not run the
    tool; these are that session's reported outputs, recorded as received and neither
    reconstructed nor paraphrased. Run 1, with the task at state completed and the 17
    producer hashes declared: "dispatch error: completed archive task TASK-20260806-a49026
    path_sha256 must cover every archive and source artifact", EXIT=2. Run 2, after the
    dispatching session computed the receipt's own digest (d221f8ad140d0bd2...) and added
    it as an 18th entry: "dispatch error: archive task TASK-20260806-a49026 commit must
    change exactly declared archive and source artifacts (missing [...snapshot-receipt.json,
    experiments/EXP-ECTD-9e4248/driver/MANIFEST.md, ... 15 producer paths ...]; extra
    [coordination/goals/GOAL-ECTD-001/batches/BATCH-33b207/dispatch_queue.json])", EXIT=2.
    The bracketed ellipses are the dispatching session's own elision of its tool output,
    reproduced as supplied and not expanded here.

    THE SPLIT-COMMIT FACT, WHICH CORRECTS AN EARLIER BRIEFING RATHER THAN CONFIRMING IT.
    This Coordinator was told that commit 7cc3c4b59a321127e6623ee97f4ff33b7d36be79
    contained all 17 producer artifacts, and the first draft of the receipt said so. Run 2
    established otherwise, and the correction is recorded here rather than quietly
    absorbed: 7cc3c4b59 changed only THREE paths - RUN-ECTD-9e4248-impl/run.yaml,
    RUN-ECTD-9e4248-screen/run.yaml, and the batch dispatch_queue.json. Per-path git log
    shows the package split across two immutable commits, both ancestors of origin/main:
    53d3fed02 ("GOAL-ECTD-001 BATCH-*: TASK-20260806-986054 EXP-ECTD-9e4248 producer runs")
    carries 15 of the 17, and 7cc3c4b59 carries the remaining 2 plus the queue file, whose
    presence is exactly what the verifier reports as "extra". 53d3fed02 is recorded in the
    abbreviated form supplied; no full 40-character SHA and no parent for it is asserted,
    because this session observed neither and will not invent one.

    WHY BOTH VERIFICATION PATHS ARE UNREACHABLE, NOT MERELY UNMET. research_dispatch.py:564
    fixes expected_paths as the archive task's artifact_paths union its source's
    artifact_paths - here 18 paths, the receipt plus 17 producer files. Line 577 requires a
    completed archive to cover that set exactly, which is run 1's rejection. Lines 1073-1089
    require ONE commit whose changed-path set equals those 18 exactly, which is run 2's
    rejection and which no single commit in this split can satisfy, since 53d3fed02 holds
    15, 7cc3c4b59 holds 2 plus the queue file, and neither holds the receipt. The
    content-only fallback at :961, reached from verify_archive at :1030-1048, engages ONLY
    when the declared commit fails to resolve or is not an ancestor of HEAD - and BOTH
    commits ARE ancestors, so that escape is closed too. Completed is therefore unreachable
    by construction.

    AND NO SUCCESSOR ARCHIVE TASK CAN RESCUE IT AS SPECIFIED. Any new archive task that
    names TASK-20260806-986054 in source_task_ids inherits the same 18-path expectation
    against the same immutable split of already-published commits. Re-cutting the task
    under a fresh ID would reproduce the identical rejection, so the repair must change the
    binding rule or the declared source set, not the identifier.

    WHY THE QUEUE ENTRY IS invalid RATHER THAN completed OR queued. Completed is untrue and
    also operationally destructive: the coverage mismatch aborts the entire queue at EXIT=2,
    so no task renders at all, including the Validator. Queued would advertise an impossible
    act as ready, and every scheduled dispatcher run would re-attempt it indefinitely.
    Invalid is the honest terminal state, it asserts no path coverage, and per
    research_dispatch.py:205-213 an invalid dependency is terminal-failed, which correctly
    keeps TASK-20260806-8d8d3c and TASK-20260806-62a167 blocked until a Coordinator repair
    exists.

    INDEPENDENT PRIOR OBSERVATION, CITED HONESTLY. DEC-20260810-1e0b6c / PR #315 records the
    same root cause on GOAL-MD5-001 / TASK-20260810-fc23ce and generalises it as: a snapshot
    archive is only satisfiable when the work it archives is left uncommitted for it to
    commit. That PR is OPEN AND UNMERGED, and this session did not re-verify its MD5
    particulars; it is cited as convergent prior art, not as verified evidence. The present
    case replicates it independently on a different goal and sharpens it, because the split
    across two commits defeats even the single-commit repair that a same-session recommit
    would otherwise permit.

    WHAT IS NOT BROKEN, STATED AS PLAINLY AS THE DEFECT. All 17 producer artifacts are
    committed on main and were verified 17 of 17 byte-identical against the digests in the
    receipt, zero drift. Content custody is intact. This is a binding failure in the archive
    chain, not a research defect, not an infrastructure failure of the experiment, and under
    no reading a negative mathematical result.
  evidence_refs:
  - coordination/goals/GOAL-ECTD-001/batches/BATCH-33b207/dispatch_queue.json
  - coordination/goals/GOAL-ECTD-001/batches/BATCH-33b207/archives/TASK-20260806-a49026/snapshot-receipt.json
  - coordination/goals/GOAL-ECTD-001/batches/BATCH-fca4e2/SELF-REFERENCING-RECEIPT-FINDING.md
  - tools/research_dispatch.py
  - experiments/EXP-ECTD-9e4248/runs/RUN-ECTD-9e4248-impl/run.yaml
  - experiments/EXP-ECTD-9e4248/runs/RUN-ECTD-9e4248-screen/run.yaml
  - ledger/goals/GOAL-ECTD-001.yaml
  limitations:
  - >-
    THIS DECISION ADJUDICATES ARCHIVE-CHAIN MECHANICS ONLY. It reviews no scientific
    content, validates nothing, recomputes no statistic, and leaves the interpretation of
    RUN-ECTD-9e4248-impl and RUN-ECTD-9e4248-screen entirely open.
  - >-
    IT DOES NOT TOUCH H-ECTD-19017a. No hypothesis status moves, and EXP-ECTD-9e4248 is
    deliberately not a target_id. Claim ceiling stays TOY: no trapdoor, no Galbraith
    path-finding hardness, no isogeny-evaluation hardness, no crypto-scale language.
  - >-
    IT DOES NOT ADJUDICATE THE TWO EXECUTOR OBSERVATIONS. Zero instrument dynamic range
    (constant primary meter vector across all 32 curves measured, three of five meters
    exactly 0.0 everywhere, 0/0 mapping to 1.0 by driver convention, KS D = 0.0
    arithmetically, CTRL-PERMUTATION tying all 8 edges) and D-2 (CTRL-HORIZONTAL-BASELINE's
    mandated conductor recomputation not executed as written, an a-priori gcd argument
    substituted covering only the q-part for five candidate primes and not the ell-adic
    valuation) both remain OPEN and are reserved to the independent Validator
    TASK-20260806-8d8d3c. Nothing in this decision may be read as settling, softening, or
    pre-empting either.
  - >-
    NO INDEPENDENT REVIEW SUPPORTS THIS DECISION AND NO ATTESTATION IS RECORDED. It is a
    single-session Coordinator adjudication of a tooling outcome. Its load-bearing facts are
    the dispatching session's reported tool outputs and per-path git log; this session has
    no shell and verified none of them itself.
  - >-
    DEC-20260810-1e0b6c / PR #315 is cited as convergent prior art from an OPEN, UNMERGED
    branch. Its MD5 particulars were not re-verified here, and no claim of this decision
    depends on them.
  next_actions:
  - >-
    THE NEXT ACT IS A COORDINATOR REPAIR, AND IT PRECEDES THE VALIDATOR. Amend BATCH-33b207's
    queue so that an archive task's declared source-path set is realizable against a single
    commit - or, alternatively, bind the existing package by content under an explicit,
    versioned protocol_amendment that states the content-first rule it is invoking and why
    the commit-scope rule cannot apply to an already-published split. Either route is a
    Coordinator act. Do not resolve it by editing any committed record.
  - >-
    TASK-20260806-8d8d3c (independent Validator, independent_session true, policy
    review-adversarial) STAYS BLOCKED at queued until that repair exists, and
    TASK-20260806-62a167 (ledger archive) stays blocked behind it. Neither is unblocked by
    this decision, and an invalid dependency does not unblock a successor.
  - >-
    NO EXECUTOR RE-RUN IS AUTHORIZED. The runs are committed, complete and byte-verified;
    re-running them would spend budget, would produce no new information, and would not
    repair a binding defect. Anyone reading this decision as grounds to re-execute
    EXP-ECTD-9e4248 has misread it.
  - >-
    WHEN THE REPAIR LANDS, the Validator's charge is unchanged from the committed queue card
    and must still weigh the zero-dynamic-range and D-2 observations explicitly, since a
    meter with no dynamic range cannot discriminate continuity from discontinuity even
    though the pre-registered continuity_scoped branch fired as written.
  - >-
    GOAL-ECTD-001 status, current_batch_id, dispatch_queue_path and latest_verified_commit
    are UNCHANGED by this decision. Only next_action moves, and it moves to name the repair.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No evidence review occurred and no evidence record was produced. This decision
      adjudicates a scaffolding failure in the archive chain, which is not a research
      finding about ECDLP, isogeny volcanoes, or any measured quantity, and it rests on a
      single unreplicated tooling observation in one worktree. The durable record of the
      defect is this decision plus the queue entry note and the amended receipt. If the
      archive-chain pattern recurs across goals and is independently confirmed - PR #315 is
      one unmerged prior instance - a KN-TECH or KN-OPEN entry on archive-chain design may
      then be warranted, and should be reconsidered at that point rather than minted now
      from one case.
  dominated_by: >-
    Not applicable. No attack, no algorithm, no Pareto point and no cost claim is advanced by
    this decision. Written explicitly rather than left null.
  sota_delta: >-
    Zero on every axis. No ECDLP cost is improved, no exponent is moved, Pollard rho remains
    the baseline, and nothing here transfers to any cryptographic parameter.
