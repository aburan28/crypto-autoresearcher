coordinator_decision:
  id: DEC-20260824-384e78
  context: >-
    Coordinator-scoped record acceptance and revision boundary for the
    arithmetic/review outcome produced under BATCH-eb0a7e. This decision reads
    only the snapshot-bound producer artifacts and the independent Validator
    report; it is not a hypothesis or goal transition.
  decision: revise
  decision_scope: record_acceptance_only
  target_ids:
    - EV-SSI-12c22e
    - TASK-20260824-5b150a
    - GOAL-SSI-001
    - BATCH-eb0a7e
  rationale:
    - >-
      Accept EV-SSI-12c22e as a neutral arithmetic/review record because the
      committed Validator report independently checks the snapshot-bound
      package, its 240 rows, separate fitted_opt and PAPER_PAIRS anchors, and
      the RG-1, RG-2 and RG-3 control behavior.
    - >-
      Preserve the Validator's qualification that RG-2 uses the supplied
      log2(M) as its exact cap input and that RG-3 probes only log2(w)=30. These
      limitations constrain the record and do not become mathematical evidence
      for a broader claim.
    - >-
      Preserve the anchor ambiguity: the fitted_opt and PAPER_PAIRS records
      give different P=512 crossover behavior and opposite w=2^80,c=0 signs.
      No anchor is selected for official interpretation.
    - >-
      The decision is explicitly limited to recording and revising the claim
      boundary. It does not promote a hypothesis, change a research direction,
      or assert a goal completion criterion.
  evidence_refs:
    - ledger/evidence/EV-SSI-12c22e.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-eb0a7e/reviews/TASK-20260824-5b150a/validation_report.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-eb0a7e/archives/TASK-20260824-e8f6b7/snapshot_commit_receipt.json
    - coordination/goals/GOAL-SSI-001/batches/BATCH-eb0a7e/tasks/TASK-20260824-dd5b5c/defect_localization.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-eb0a7e/tasks/TASK-20260824-dd5b5c/corrected_charging.py
    - coordination/goals/GOAL-SSI-001/batches/BATCH-eb0a7e/tasks/TASK-20260824-dd5b5c/recomputed_table.json
    - coordination/goals/GOAL-SSI-001/batches/BATCH-eb0a7e/tasks/TASK-20260824-dd5b5c/control_report.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-eb0a7e/tasks/TASK-20260824-dd5b5c/anchor_sensitivity.md
  limitations:
    - >-
      No experiment was rerun and no new timing, resource, attack, solve,
      certificate, or security measurement is accepted by this decision.
    - >-
      The arithmetic is finite-grid and anchor-dependent. It does not transfer
      to standardized parameters or asymptotic complexity.
    - >-
      RG-2's corrected-cap identity is algebraically constructed at its
      supplied log2(M), and RG-3's capability-to-fail check uses one probe.
    - >-
      The P=512 crossover value and its w=2^80 sign remain prohibited from
      citation and official interpretation.
  next_actions:
    - >-
      Keep all hypothesis statuses, experiment statuses, and GOAL-SSI-001
      status unchanged; no completion criterion is met or approached.
    - >-
      Reconcile the fitted_opt and PAPER_PAIRS source anchors in a future
      source-fix task, with an explicit decision about which committed source
      is authoritative or whether both remain scenario anchors.
    - >-
      Obtain a fresh independent review of that source-fix outcome before any
      P=512 citation boundary or official interpretation is reconsidered.
    - >-
      Do not cite or lift the exact P=512 prohibition unless a later committed
      Coordinator decision is based on independently reviewed evidence.
  status_effect: >-
    No hypothesis status and no official goal status changes. GOAL-SSI-001
    remains active; this is a record-acceptance/revision decision only.
  p512_prohibition: >-
    Preserved verbatim: The `P=512` crossover value and its `w=2^80` sign are
    **NOT citation-eligible**. This task does not lift that prohibition. Only a
    committed Coordinator decision on independently reviewed evidence can lift
    it.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No knowledge entry is warranted because this decision records a neutral,
      arithmetic-only review outcome with no durable hypothesis, security,
      asymptotic, or reusable scientific claim; the anchor ambiguity remains
      unresolved and the P=512 boundary remains closed.
  decided_by: coordinator
  decided_at: '2026-08-24'
