  - ledger/corrections/CORR-20260811-b37856.yaml

  limitations:
  - >-
    This decision does NOT itself run the empirical D3/D4/D5-catch-rate check
    it names as the resolving next step. That check is well-specified but not
    performed here, to keep this record scoped to documenting and reconciling
    the collision rather than opening a further analysis round before the
    collision itself is on record.
  - >-
    This Coordinator has read RT-20260810-b12e04 and VAL-20260810-eddc0c in
    full and independently assessed their scope against RT-20260811-35ab34's
    own scope (the complementary-not-contradictory reading above is this
    Coordinator's own synthesis, checked against both reports' literal text),
    but has not re-run either report's own independent arithmetic
    (the nested-ladder noise-scale re-derivation, the fb=22 LOO Monte Carlo)
    from scratch. Both reports show extensive self-checking and cross-
    verification against DEC-20260810-5aeeaa's own figures already, and
    DEC-20260810-00ee9d records that ITS Coordinator independently re-checked
    several of V1's key numbers before adopting them -- proportionate
    independent verification (AGENTS.md rule 9) given that depth already
    exists in the chain.
  - >-
    The "D5 could be foreclosed by an early T2 accept" concern in this
    decision's own rationale is a STRUCTURAL reading of E7's and E11's text,
    not an empirically demonstrated failure -- it is exactly the kind of thing
    the named next-step check would confirm or refute, and this decision does
    not assert it as an established defect.
  - Toy scale throughout; claim_tier toy; sota_delta zero; no new measurement is asserted by this decision itself.

  next_actions:
  - >-
    PRIMARY, NAMED AS THE CONCRETE PATH TO CLEARING THIS PAUSE: extend
    harness/exp_instr_36c8cf/ctrl_r3r4.py's already-built R4 machinery
    (reusable, zero new experimental budget) to also compute, per replication,
    per rung reached, the D3 (leave-one-out z-score at fb=18 and fb=22),
    D4 (a Monte-Carlo-calibrated null threshold at that rung's own n, mirroring
    v3.yaml change E11's own specification) and D5 (recurrence-across-more-
    than-one-rung trigger) diagnostics EXACTLY as amendment v3 change E11
    specifies them, across the SAME 500-replication Student-t(df=5) arm
    (master seed 314159265, fully reproducible) -- and report, honestly and
    without pre-judging the answer, what fraction of the 94/500 replications
    that reach accepted_rung under T2 alone would ALSO have had D5 fire first
    (or at the same rung), versus how many would have had accepted_rung set
    with fewer than two rungs of D3/D4 data available for D5 to check
    recurrence against. This is the single check that turns the open
    structural question in this decision's own rationale into a settled
    empirical one.
  - >-
    SECONDARY, IF THE PRIMARY CHECK SHOWS A MATERIAL GAP: a v4 amendment
    (ordinal 4, version_from/version_to 3->4 since v3 IS approved) that binds
    a diagnostic into T2's OWN accept condition directly -- the ORIGINAL R1
    recommendation of RT-20260811-35ab34/DEC-20260811-a4c7ec -- rather than
    relying solely on a parallel, narrower-scoped escalation path. If the
    primary check instead shows E11/D5 already closes the gap in practice
    (e.g. because first-accepts under a broad heavy-tailed alternative
    reliably land late enough for two rungs of D3/D4 data to exist), this
    decision's pause clears on that finding alone and no v4 is needed.
  - >-
    THIRD, CARRIED FORWARD UNCHANGED FROM BOTH PRIOR DECISION CHAINS: blockers
    B1 and B2 remain unresolved; EXP-ICINV-4d33aa stays paused (RQ-ICINV-475b5e);
    EXP-JINV-bd141d and EXP-VOLC-9f5571 stay blocked on criterion C4; the
    three-way SR3-gate design fork (DEC-20260810-d82c61, DEC-20260811-af68d1)
    remains open and is untouched by this decision; the pending approvals of
    EXP-ICINV-4d33aa amendment v4 and EXP-CANL-96b0ad amendment v2 are
    untouched; DEC-20260810-00ee9d's own THIRD and FOURTH next_actions
    (carry-forward items, the RC-3 codification recommendation) stand
    unaffected by this decision.
  - >-
    A single Coordinator decision does not have authority to adopt
    RT-20260810-b12e04's RC-3 (codifying the reachability-repair pattern
    campaign-wide) unilaterally; forwarded as a recommendation, consistent
    with how DEC-20260810-00ee9d itself already declined to mandate it.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      The self-masking-in-sample-diagnostic finding is now independently
      confirmed by THREE separate methodologies across two concurrent
      sessions (VAL-20260810-eddc0c's targeted LOO re-score, this branch's
      blind R3a jackknife sweep, and this branch's R4 null-object simulation
      showing the downstream consequence at scale) -- this is meaningfully
      closer to corpus-ready than either session's individual finding was on
      its own, and the revisit condition DEC-20260810-00ee9d itself named
      ("if the leave-one-out/Monte-Carlo diagnostic... actually runs at rungs
      4-8 and produces a real, replicated read... THAT result... is the point
      at which the underlying self-masking methodology becomes a genuine,
      evidenced, independently reviewable KN-TECH candidate") is now
      substantially closer to being met via this branch's synthetic
      (not yet real-rung) replication. Held at not_warranted rather than
      promoted because the outstanding empirical check named in next_actions
      is exactly the kind of additional confirmation DEC-20260810-00ee9d's
      own revisit condition asks for before promotion, and because a
      corpus entry synthesizing findings from two independent Coordinator
      chains is exactly the kind of promotion that should happen with full
      visibility into both, which this record newly provides but has not yet
      acted on. REVISIT CONDITION: when the primary next_action above
      completes, whichever Coordinator session performs it should weigh
      promotion at that point, with a regenerated knowledge/INDEX.md in the
      same commit.

