  context: >-
    DISCOVERED ON MERGING origin/main (tip 3d5dd80a -> ae065c6c, merge commit
    d41f5b7e, clean auto-merge, zero conflict markers, verified): a
    CONCURRENT, INDEPENDENT Coordinator session ran its OWN V1/V2 review pair
    on the SAME experiments/EXP-INSTR-36c8cf/amendments/v2.yaml this branch
    was separately reviewing, reached DEC-20260810-00ee9d (decision: revise),
    and APPROVED experiments/EXP-INSTR-36c8cf/amendments/v3.yaml ON FILING
    (approved_by: coordinator, status
    filed_and_approved_supersedes_v2_filing_authorizes_the_ladder_extension).
    That approval is now live on this branch and AUTHORIZES DISPATCH OF A
    SUCCESSOR SR3 v3 CHARACTERISATION RUN (rungs 4-8), named explicitly as the
    SECOND next_action of DEC-20260810-00ee9d.

    This branch's own, separately-conducted review chain reached the OPPOSITE
    headline conclusion on the SAME amendment v2: DEC-20260811-a4c7ec
    (decision: pause, amendment v2 NOT approved), based on this branch's own
    V1 (coordination/.../execution/EXP-INSTR-36c8cf/validation_v1_report.md)
    and V2 (RT-20260811-35ab34), followed by DEC-20260811-aed346 (decision:
    refine), which adjudicated a further R3/R4 empirical control
    (RUN-INSTR-r3r4-nullobj-d3efd7, EV-INSTR-600710) neither the concurrent
    session nor its reviewers (VAL-20260810-eddc0c, RT-20260810-b12e04) had
    any visibility into, since that work did not exist on origin/main until
    this merge.

    Both Coordinator sessions acted in good faith on the information available
    to them, exactly as CLAUDE.md's "Concurrency: many agents, many
    worktrees" section anticipates: neither is invalidated by the other's
    existence, and this record's job is to reconcile them on the merits, not
    to declare one session's work void.

  decision: pause

  what_is_and_is_not_paused_stated_first_so_nothing_downstream_is_over_read: >-
    ONLY ONE THING IS PAUSED: DEC-20260810-00ee9d's own second next_action --
    "author and dispatch a fresh Coordinator handoff... for the SR3 v3
    characterisation's successor run under EXP-INSTR-36c8cf contract version 2
    as amended by v1 (approved) and v3 (approved)." NOTHING ELSE.
    amendments/v3.yaml's approval itself is NOT revoked; changes E10
    (documentation correction of condition (b)) and E12 (report accepted
    interval's absolute half-width) are sound, uncontested by anything in
    either review chain, and require no further action. Change E11 (the D3
    leave-one-out diagnostic, D4 Monte Carlo null calibration, D5 recurrence-
    triggered early termination, scoped to fb=18/fb=22) is a genuine, real
    improvement over v2's original E9 D1/D2 -- this decision does not
    contest that it helps; it contests only that its catch rate against the
    SPECIFIC kind of alternative RUN-INSTR-r3r4-nullobj-d3efd7 already
    empirically demonstrates is UNTESTED, and dispatching real compute against
    an unrepaired T2 before that is checked would spend budget on a run whose
    accepted_rung, if it fires, cannot yet be trusted to mean what the
    contract says it means.

  target_ids:
  - GOAL-ENDO-001
  - BATCH-d7e255
