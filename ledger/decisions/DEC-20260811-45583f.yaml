  rationale:
  - >-
    THE TWO V2 (RED-TEAM) REVIEWS ARE COMPLEMENTARY, NOT CONTRADICTORY, ONCE
    THEIR SCOPES ARE MADE PRECISE. RT-20260810-b12e04's own scope_note states
    it explicitly: "It attacks ONLY the freeze/optional-stopping question --
    changes E6 and E7 ... and the FOUR CONDITIONS DEC-20260810-5aeeaa states
    as necessary." Its question is "does this collapse into classical,
    infinite sample-until-it-passes optional stopping with outcome
    cherry-picking?" Its answer, reached by directly attacking T1-T4 and
    failing to break it, is NO -- and that answer is CORRECT on its own
    terms; nothing in this branch's own work disputes it. RT-20260811-35ab34's
    question was different: "given that T1-T4 is a genuine, terminating,
    non-cherry-picking stopping rule, does PASSING it (E3 alone) actually
    DISCRIMINATE HEUR-INSTR-4 from a competing, equally-legitimate
    finite-variance heavy-tailed explanation for the SAME observed data?" Its
    answer, reached by direct construction (a Student-t(df=5) null-object
    simulated through the identical, unmodified interval_for_rung/
    stability_check pipeline) and independently confirmed by TWO further
    reviews (VAL-20260811-bc336d, RT-20260811-cb3211), is NOT RELIABLY: a
    concrete, plausible alternative reaches accepted_rung 18.8% of the time
    (94/500 replications) under the EXACT SAME T2 rule RT-20260810-b12e04
    examined and could not break. RT-20260810-b12e04 never asked this
    question -- its own attack on E7 (change_E7_attack.
    does_T2_plus_a_terminal_rung_actually_prevent_hull_fitting_or_only_narrow_it)
    computed the residual FAILURE probability under Explanation A ("~7% floor,
    real falsifying content") but never computed the analogous ACCEPTANCE
    probability under Explanation B, which is exactly the number
    RUN-INSTR-r3r4-nullobj-d3efd7 supplies. Both reports are right; they
    answered different questions, and only one of the two questions was asked
    of BOTH review pairs.
  - >-
    THE TWO V1 (VALIDATOR) REVIEWS ARE ALSO COMPLEMENTARY, BOTH RETURNING
    INCONCLUSIVE, BOTH FINDING REAL TAIL-ANOMALY SIGNAL BY DIFFERENT
    METHODS. VAL-20260810-eddc0c's single_row_outlier_analysis performed a
    TARGETED leave-one-out re-score of the two rows amendment v2's own
    in-sample check already flagged (fb=11, fb=22), finding fb=22's
    already-known exceedance is materially MORE extreme under LOO (in-sample
    z=3.56, LOO z=4.22-4.88, borderline-significant at ~1-in-22 after a
    13-row Bonferroni correction) -- a "how much worse is the already-visible
    signal" finding. This branch's own R3a (jackknife-exceedance.json)
    performed a BLIND, comprehensive leave-one-out sweep of all 13 rows x 48
    seeds (624 trials), finding a DIFFERENT thing: a new exceedance at fb=12
    invisible to ANY in-sample check (in-sample 0/0, jackknife 1/0) -- a "are
    there anomalies the in-sample check would never even flag as a candidate"
    finding. Both demonstrate the SAME underlying mechanism (in-sample
    checking self-masks) via independent, non-overlapping methodologies, and
    together make a stronger case for it than either alone. Neither
    contradicts the other; VAL-20260810-eddc0c did not examine fb=12 (its
    method only re-scores rows already flagged in-sample) and this branch's
    R3a did not compute exact LOO z-score magnitudes for fb=22 (only a binary
    exceed/no-exceed flag), so the two reports' silence on each other's
    specific finding is a scope limit, not a disagreement.
  - >-
    A SEPARATE, BENIGN DUPLICATION, NOTED AND LEFT AS-IS. CORR-20260810-43c5c4
    and this branch's own CORR-20260811-b37856 are two independently-filed,
    fully consistent correction records for the IDENTICAL defect (the
    harness/run_saturation.py:89 vs harness/exp_icinv.py:422 ULP-level
    row-mean summation-order discrepancy, at the same two rows, fb=7 and
    fb=18). Both state "no repair authorized," both cite the same root cause,
    neither contradicts the other. AGENTS.md rule 2 (immutable records) means
    neither is edited or retracted; both stand as independent, convergent
    confirmations of the same finding. No action required.
  - >-
    WHY THIS MATTERS ENOUGH TO PAUSE A DISPATCH RATHER THAN JUST NOTE THE
    DISAGREEMENT. amendments/v3.yaml's relationship_to_v2_filing states
    plainly: "changes E6 (extend the seed ladder)... E7 (declare terminal
    rung T1, first-pass-wins T2...)... are ADOPTED VERBATIM BY REFERENCE...
    Nothing in E6-E9 is altered by this amendment." T2 -- the exact mechanism
    RUN-INSTR-r3r4-nullobj-d3efd7 empirically tested -- is therefore BYTE-
    IDENTICAL between the amendment RT-20260811-35ab34/RT-20260810-b12e04 both
    reviewed and the NOW-APPROVED v3. The 18.8% false-accept figure this
    branch independently verified three ways (executor, VAL-20260811-bc336d,
    this Coordinator's own from-scratch reproduction) applies with EQUAL
    force to a successor run dispatched under v3 as it did to the
    hypothetical successor run v2 never authorized. E11's own D3/D4/D5
    diagnostic is a real repair candidate, but it is NARROWER than what
    RUN-INSTR-r3r4-nullobj-d3efd7 tested in two material ways: (i) it is
    scoped to fb=18 and fb=22 only, while the Student-t(5) simulation shows
    ALL 13 rows exceed at the terminal rung, not just those two; (ii) D5
    requires RECURRENCE of an exceedance "at more than one rung," but T2's
    own unchanged text says the characterisation STOPS at the first rung that
    passes the 5% rule -- if a heavy-tailed alternative happens to pass E3
    early (this branch's own data shows first-accepts cluster at rungs 7-8,
    but a different alternative or a different seed could plausibly accept
    earlier), fewer than two rungs of D3/D4 data might exist for D5 to check
    recurrence against, closing the very door E11 opens. WHETHER THIS GAP IS
    REAL IN PRACTICE IS AN OPEN, CHEAPLY-CHECKABLE EMPIRICAL QUESTION, NOT
    ASSERTED AS FACT HERE -- see next_actions.
  - >-
    THIS IS NOT A REVOCATION OF DEC-20260810-00ee9d ON THE MERITS OF ITS OWN
    REASONING. Read on its own terms, against the review pair it had, its
    approval of v3 was well-founded: E10/E11/E12 are genuine improvements
    adopted directly from independent review findings, not unreviewed
    Coordinator invention, exactly as its own
    why_this_amendment_is_approved_on_filing argues. This decision supersedes
    it only on ONE narrow point -- whether a successor run may be dispatched
    RIGHT NOW, before RUN-INSTR-r3r4-nullobj-d3efd7's existence (unknown to
    that session) is accounted for -- using the same mechanism
    experiments/EXP-INSTR-36c8cf/amendments/v2.yaml's own text establishes for
    exactly this situation: "a new Coordinator decision supersedes it on the
    merits."
  - >-
    CLAIM DISCIPLINE, applied uniformly. claim_tier toy throughout. No attack,
    no exponent, no speedup; sota_delta zero on every axis touched by this
    decision. Nothing here makes or adjudicates any curve-side, within-class,
    or between-class claim, and nothing here moves H-INSTR-444c7b,
    H-ICINV-d5e351, or H-ICINV-6c7920's status.

