  rationale:
    - >-
      S2MX recorded n_holds 3,
      n_this_M_delta_that_would_make_miss_hold 0,
      n_holds_flipped_by_miss_M_delta 0, and
      miss_M_delta_flips_only_next_tightest false.
      S2GX recorded miss_G_flips_only_next_tightest
      true. Restating those flags is dominated.
    - >-
      S2GX and S2MX compare mixed G / M_delta against
      a bound. S2TP swapped G versus M_delta on the
      tight pair only. None of those official flags
      records aligned_ratio_miss versus a hold
      cs_bound, or aligned_ratio_H versus miss
      cs_bound. Same-cell CS bounds are not adjacent
      to the miss bound, so a cs_bound-swap of the
      four S2BD cells is not determined by S2GX,
      S2MX, or S2TP flags.
    - >-
      The remaining cheap residual is whether miss
      cs_bound flips only the next-tightest among the
      three official S2BD holds, or also a same-cell
      hold. Consume the four S2BD cells, not S2GX,
      S2MX, or S2TP. For each hold H, compute
      miss_would_hold_if_this_cs as
      (G_miss / M_delta_miss) <= cs_bound_H and
      this_would_hold_if_miss_cs as
      (G_H / M_delta_H) <= cs_bound_miss. Report
      n_holds, per-hold flags,
      n_this_cs_that_would_make_miss_hold,
      n_holds_flipped_by_miss_cs, and a uniqueness
      flag such as miss_cs_flips_only_next_tightest.
      This decision does not pre-record those flags.
      A cs_bound-swap uniqueness or sharing is not a
      W class and is not an official supported bound.
    - >-
      Re-partitioning the 168-row S2CS table, another
      four-cell uniqueness restatement, another slack
      restatement, Stage 5, a subset fit of a, the
      S2FIT W-ratio gate, CAND-D2-A, D2 closure, and
      designing an unrelated open ECC idea remain
      dominated or forbidden. Open ECC ideas remain
      ranked work under instruction 3, not ahead of
      this live residual on the approved experiment.

  ranking:
