coordinator_decision:
  id: DEC-20261024-e29f4c
  id_provenance: >-
    The four new ids (GOAL-PEXT-4a1d6b, RQ-PEXT-7c3e91, IDEA-20261024-b58e07, DEC-20261024-e29f4c) carry random
    6-hex tokens drawn by the Coordinator, whose subagent session had no shell, so tools/allocate_id.py could
    not be run. Each token was checked free by a path search of the whole checkout (no path component carries
    it). The session that commits this record runs python3 tools/allocate_id.py --check on each id first; a
    REFUSE means a new id and a rewrite of all four records before any commit, never a commit under a taken id.
  recorded_at: '2026-10-24'
  decided_at: '2026-10-24'
  decided_by: coordinator
  goal_id: GOAL-PEXT-4a1d6b
  question_ids:
  - RQ-PEXT-7c3e91
  kind: goal_opening
  mode: start a new campaign, then goal (GOAL-PEXT-4a1d6b only; no trials)
  context: >-
    On 2026-10-24 the user asked to open a campaign on prime-degree extension descent, framed as understanding
    how it works rather than as an attack: any prime extension degree n, general theory, for E/F_{q^n} in any
    characteristic (how Weil restriction and GHS covers behave when no intermediate subfield exists, why the
    genus floor grows with n, which curves admit low-genus covers, what governs the minimum), with the first
    batch the GHS cover genus floor at n = 7. The program has exact bounded results at n = 3 and n = 5 in the
    sibling repository aburan28/crypto (class minima 13 / 5 / 3 at n = 3; derived floors 33 / 33 / 25 / 5 by
    2-torsion type and spectrum m in {1, 4, 5} at n = 5; GHS floors 9 / 49 / 41 at k = 6 / 10 / 14 with no cover
    exhibited) but no ledger question or goal that holds the general mechanism, and nothing at n = 7. No
    existing goal owns it: GOAL-GFPN-380702 is the deployed Goldilocks F_{p^5} curves, GOAL-ECDLP2M-001 is
    binary-field index-calculus and descent cost, GOAL-FROB-6333a9 is Frobenius-stable factor bases at n = 41/43,
    GOAL-SEMBIN-fcb7a2 and GOAL-SEMBIN-5078bc are Nagao and Semaev first-fall degree, GOAL-PFDR-fd09e0 is
    prime-field decomposition without descent.
  decision: approve
  decision_scope: >-
    Opens GOAL-PEXT-4a1d6b (status active) hosting RQ-PEXT-7c3e91, records IDEA-20261024-b58e07 (status
    proposed) as the first-batch target, and adds the area token PEXT to the ECC set in
    orchestration/research-priority.yaml. Approves no experiment, hypothesis or trial, freezes no contract,
    opens no batch or lane and dispatches no task. Asserts nothing about any floor or mechanism: the n = 7
    predictions in the IDEA are the Coordinator's prior, to be derived or refuted at design. Authorizes no
    attack, no cost claim and no work on any deployed or standardized curve.
  target_ids:
  - GOAL-PEXT-4a1d6b
  - RQ-PEXT-7c3e91
  - IDEA-20261024-b58e07
  authorization: >-
    Explicit user request of 2026-10-24 to start this campaign (.claude/skills/coordinate/SKILL.md, mode "Start
    a new campaign": a goal is created only on that explicit request). Later design and approval proceed under
    the standing user authorization of 2026-09-06 in AGENTS.md once a protocol is complete and approvable; no
    per-experiment user confirmation will be requested.
  user_request:
    received: '2026-10-24'
    intent: >-
      Open a campaign on improving the understanding of prime-degree extension descent ("not attacks, but just
      how that works"). Scope: any prime extension degree n, general theory, every characteristic. First batch:
      the GHS cover genus floor at n = 7, extending the existing cover census and floor, and what governs the
      minimum there.
  ecc_classification:
    area: PEXT
    classified: >-
      ECC by the entry added to orchestration/research-priority.yaml in the same change as this record (no
      existing token fits: GFPN is scoped to deployed F_{p^5} curves and owned by GOAL-GFPN-380702). The
      committing session confirms with python3 tools/ecc_priority.py --classify GOAL-PEXT-4a1d6b RQ-PEXT-7c3e91
      (expected: ECC) and --budget-violations (expected: OK).
    budget: maximum_batches null, total_wall_clock_seconds null (AGENTS.md "ECC comes first"); max_concurrent 2.
  scope_boundary: recorded in full on GOAL-PEXT-4a1d6b (scope_boundary.owns and scope_boundary.not_owned).
  capacity_check: >-
    No approval is made, so the runnable condition of AGENTS.md "Approval is bounded by execution" does not
    arise here. It binds the later approval decision for the n = 7 contract, which needs
    tools/experiment_preapproval.py approvable true and, after commit, tools/newest_experiments.py execution_state
    ready.
  status_transitions:
  - record: GOAL-PEXT-4a1d6b
    to: active
    note: Goal opened; the committed goal record is its initial checkpoint (docs/task-lifecycle.md section 0).
  - record: RQ-PEXT-7c3e91
    to: active
  - record: IDEA-20261024-b58e07
    to: proposed
    note: Open ECC idea; to be designed (AGENTS.md "ECC comes first", rule 3), not approved here.
  rationale:
  - >-
    The user asked explicitly for this campaign; the skill admits goal creation only on such a request, and no
    active goal holds the question, so a new goal is the lawful home rather than a lane on an existing one.
  - >-
    n = 7 is the decision-changing next case. By Lemma M of the sibling n = 5 study the span dimensions are
    those of cyclic submodules of F_2[x]/(x^n - 1); at n = 3 and 5 that leaves only {1, n-1, n}, so the two
    censuses cannot separate "the 2-torsion type governs the floor" from "the factorisation of x^n - 1 governs
    the spectrum". At n = 7, x^7 - 1 has two cubic factors over F_2, and the two readings predict different
    spectra and floors (IDEA-20261024-b58e07). The characteristic-2 n = 7 genus-7 family (KR-IC-791cb7) gives a
    published nearby-object control across characteristics.
  - >-
    The work is cheap relative to its information: the tool (cover_census_n.rs), the regression records and the
    Lean scaffolding exist; the n = 7 derivations are finite; the constructive enumeration avoids the
    infeasible full structure scan above q = 3.
  - >-
    Direction bias (docs/target-result-profile.md): this is not an exponent claim and makes none; it maps
    which descents are structurally possible at prime n, the precondition for any later exponent-relevant cover
    question. Recorded as structural so no reader takes it for an improvement over the index-calculus
    baseline.
  evidence_refs: []
  citations:
  - source: aburan28/crypto research/ghs_cover_census_n5_20261013/README.md
    provenance: retrieved
    claim: n = 5 floors, Lemma M, Lemma D0, spectrum m in {1, 4, 5}, tool and Lean files
    verified_by: coordinator 2026-10-24, read in the /home/user/crypto checkout
  - source: aburan28/crypto research/ghs_cubic_cover_census_20261012/README.md
    provenance: retrieved
    claim: n = 3 class minima 13 / 5 / 3 and the odd-order proof
    verified_by: coordinator 2026-10-24, read in the /home/user/crypto checkout
  - source: aburan28/crypto research/cover_descent_genus_floor_20261015/README.md
    provenance: retrieved
    claim: GHS floors 9 / 49 / 41 at k = 6 / 10 / 14 for F_p(j) = GF(p^k); no cover exhibited
    verified_by: coordinator 2026-10-24, read in the /home/user/crypto checkout
  - source: aburan28/crypto research/odd_char_descent_genus3_20261014/REPORT.md
    provenance: retrieved
    claim: genus formula depends only on the orbit type of the branch locus; sources read and not read
    verified_by: coordinator 2026-10-24, read in the /home/user/crypto checkout
  - source: KR-IC-791cb7
