    j not in F_q) are the Coordinator's prior from Lemma M and the Prop. O5 analogy, not derivations.
  - >-
    Iijima-Momose-Chao (KN-LIT-bf1772) reportedly classify odd-characteristic covers at d = 7; only the abstract
    has been read. The IDEA's novelty is unverified until the design reads the full text.
