      is not opening a gate.

  manifest_filename_ruling:
    question: >-
      Should the new experiment's contract specify manifest.yaml or manifest.json for its
      run record.
    ruling: manifest.yaml
    reason: >-
      tools/validate_ledger.py indexes run records by globbing
      experiments/*/runs/*/manifest.yaml and nothing else. A run whose manifest is
      manifest.json is invisible to it, and the evidence record that cites the run is
      then reported as referencing an unknown run. Specifying manifest.yaml means
      EXP-SMTH-001 does not inherit that defect - its run is indexed and its evidence
      record will resolve. The repo-wide convention is manifest.yaml by a wide margin and
      the same lane's three earlier runs follow it, so this is the conventional choice
      and not a novel one.
    consequence_accepted_and_written_into_the_contract: >-
      Because manifest.yaml IS indexed, check_run applies in full, so the contract fixes
      the exact companion filenames the validator demands - command.txt,
      environment.json, stdout.log, stderr.log and raw-result.json - and the manifest's
      required fields. NOTE the .log rather than .txt extensions; EXP-DS-001 used .txt,
      which an indexed run would fail on.
    what_this_ruling_does_not_do: >-
      IT REPAIRS NOTHING IN EXP-DS-001 AND IS NOT A REPAIR OF IT. Those contracts
      specified manifest.json, the runs complied, and both the contracts and the run
      packages are immutable. The defect they expose is carried as declared open item
      OPEN-BATCH022-A and is not fixed by editing anything.

  declared_open_items:
    - id: OPEN-BATCH022-A
      title: validator run indexing misses manifest.json run packages
      severity: minor_but_currently_producing_false_ledger_errors
      statement: >-
        tools/validate_ledger.py indexes runs only from
        experiments/*/runs/*/manifest.yaml, but BOTH EXP-DS-001 control runs -
        RUN-DS-001-ctrl-unplanted and RUN-DS-001-ctrl-matched-null - emit manifest.json,
        exactly as their frozen contracts specified. As a result EV-DS-003 and EV-DS-004
        are both reported as "evidence references unknown run", for runs that exist, are
        committed, and were certificate-verified 1200 of 1200 by two independent
        sessions. Repo-wide the convention is manifest.yaml by a wide margin (about 1462
        files against about 17 json), and the same experiment's three earlier runs follow
        it, so the two control runs are the outliers.
      status: FILED AND OPEN. NOT REPAIRED IN THIS BATCH AND NOT REPAIRABLE BY EDITING ANYTHING IMMUTABLE.
      why_not_repaired_here: >-
        Neither available repair belongs in BATCH-022. Editing the frozen EXP-DS-001
        contracts or the archived run packages is forbidden outright - they are immutable
        and a correction supersedes, never overwrites. Widening the validator glob is a
        tooling change with repo-wide blast radius that would be made by a session that
        did not author the records it would newly index, and it is outside this batch's
        declared write scope and outside its single next_action. Filing it and naming
        both repair routes is the correct action now.
      candidate_repairs_named:
        - >-
          Widen the check_run glob to manifest.yaml and manifest.json, in a separate
          tooling task with its own review, and add a regression test pinning both.
        - >-
          Emit a superseding manifest.yaml sidecar for each affected run under a new
          record id, leaving the archived manifest.json untouched and hash-stable.
      forbidden_repairs_named:
        - Editing experiments/EXP-DS-001/specification.v2.yaml or any frozen control or amendment.
        - Renaming, rewriting or re-hashing any archived run artifact.
        - Editing EV-DS-003 or EV-DS-004 to hide the reference.
      affected_records:
        - EV-DS-003
        - EV-DS-004
        - RUN-DS-001-ctrl-unplanted
        - RUN-DS-001-ctrl-matched-null
      how_batch022_avoids_inheriting_it: See manifest_filename_ruling above; EXP-SMTH-001 specifies manifest.yaml.
    - id: OPEN-BATCH022-B
      title: recurring same-date DEC-id collision between this branch and origin/main
      severity: process_defect_with_four_recorded_occurrences
      statement: >-
        This campaign has now hit FOUR same-date DEC-id collisions with origin/main.
        Recorded occurrences - DEC-20260731-010 remapped to -019 per CORR-20260801-001;
        DEC-20260731-020 remapped to DEC-20260801-003 at the BATCH-020 close; the
        intervening occupation of -021 through -024 and of DEC-20260801-001 and -002 by
        published GOAL-FAEST-001 work; and the standing risk that forced the mandatory
        freshness re-check written into the BATCH-021 queue. The root cause is that the
        id space is dated and flat while several branches allocate into it concurrently
        without a reservation mechanism, so two branches can both take the next free
        number and only discover the collision at merge.
      status: FILED AND OPEN. MITIGATED, NOT FIXED.
      mitigation_in_force_this_batch: >-
        The queue declares the intended close id DEC-20260801-007 in advance so the
        post-commit verifier can work in the normal case, AND makes a freshness re-check
        MANDATORY immediately before writing it. If it is occupied at write time, OUR
        record is renumbered and never the other party's (the CORR-20260801-001
        precedent), the substitution is filed as a queue amendment against the declared
        set, the artifact_paths and the write_scope so that the declared and
        verifier-expected sets agree, and the authoritative mapping is recorded in the
        new decision's id_assignment_note and in the archive remap_note. THE OPENING ID
        DEC-20260801-006 WAS RE-CHECKED FREE IMMEDIATELY BEFORE THIS RECORD WAS WRITTEN.
      candidate_repairs_named:
        - >-
          A branch-scoped id suffix or a reservation file merged to main before
          allocation, so two branches cannot take the same number.
        - >-
          A pre-commit check that fails when a ledger record id already exists on
          origin/main, run as part of tools/sync_open_branches.py.
      why_not_repaired_here: >-
        It is a tooling and convention change affecting every lane in the repository,
        not only this goal, and it must not be made from inside a batch whose single
        next_action is a distributional measurement. Filing it with named repairs is the
        correct action now.

  next_actions:
    - >-
      EXECUTE THE BATCH-022 NINE-TASK LIFECYCLE IN ORDER AND NOTHING ELSE.
      TASK-20260801-010 has authored experiments/EXP-SMTH-001/specification.yaml,
