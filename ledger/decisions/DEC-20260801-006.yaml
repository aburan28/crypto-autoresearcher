  context: >-
    BATCH-021 closed at DEC-20260801-005 with the frozen disposition map's D-1a branch
    fired on an ADMISSIBLE matched-null control - `weaken`, scoped exactly to the claim
    that the measured cost ratio R evidences Semaev or multihomogeneous structure, with
    the mechanism itself UNEXERCISED and no adverse finding about it taken. The single
    next_action recorded at that close is RT048-CTRL-1, the ranked-first control of
    RT-20260801-008. This decision opens BATCH-022 to execute exactly that action and
    nothing else. THE FACT THAT MAKES THIS BATCH DIFFERENT FROM THE PREVIOUS TWENTY-ONE
    IS RECORDED PLAINLY - every real arm in the EXP-DS-001 series ran with
    smoothness_abort false, so is_B_smooth has never been called anywhere in the series
    and the smoothness claw has never executed; and the one HEUR sampling ever performed
    sampled an identity-encoded curve x-coordinate below 2**20 rather than a half-arity
    Semaev intermediate bounded by D = 2**40, a factor of about 2**20 apart. This would
    be the first experiment in the program that tests the mechanism H-DS-001 is actually
    about.

  decision: approve
  decision_label: >-
    open_batch022_and_authorize_authoring_of_EXP-SMTH-001_and_H-SMTH-001__no_run_authorized

  decision_scope: >-
    THIS DECISION (1) opens BATCH-022 under SG-ECDLP-001 with the nine-task lifecycle
    TASK-20260801-010 through TASK-20260801-018 at max_concurrent 3; (2) approves the
    AUTHORING of a fresh frozen experiment contract under the new id EXP-SMTH-001 and a
    hypothesis record under the new id H-SMTH-001 at status `specified`; (3) freezes the
    pre-registered reading rule RR-SMTH-1 TOGETHER WITH ITS ATTAINABILITY ARGUMENT
    ATTAIN-RR-SMTH-1 before any datum exists; (4) makes checking that attainability
    argument an explicit, NAMED duty of the independent reviewer at TASK-20260801-012;
    and (5) carries two previously unfiled defects into the batch record as declared
    open items. IT AUTHORIZES NO RUN. The Executor at TASK-20260801-014 is gated on
    APPROVAL_DETERMINATION APPROVED in the TASK-20260801-013 snapshot receipt, which
    does not exist. IT CHANGES NO HYPOTHESIS STATUS other than creating H-SMTH-001 at
    `specified`, and it re-scores no evidence.

  central_reasoning: >-
    FOUR THINGS DECIDE THIS OPENING AND THEY ARE STATED SO THEY CAN BE AUDITED.
    (1) INFORMATION. RT048-CTRL-1 is the only ranked candidate that touches the
    mechanism at all. Every remaining R figure in the EXP-DS-001 lane is predicted in
    closed form until the backend changes (RT048-B1), so a further cost measurement
    would be a check of a derivation rather than a new quantity, while the smoothness
    law of the actual intermediate has never been sampled once. That is the single
    largest information deficit in the lane and DEC-20260801-005 already ranked it
    first.
    (2) DIRECTION. The program's own direction rules require a conditional result to be
    paired with a heuristic-validation experiment that samples the relevant
    distribution, compares it against the predicted distribution and checks tail
    consistency. HEUR-DS-1 has carried a validation_experiment_ids field pointing at
    EXP-DS-001 since BATCH-017 and that experiment has never run the validation. This
    batch supplies it.
    (3) A NEW EXP ID IS MANDATORY, NOT STYLISTIC. The measurement needs
    summation-polynomial arithmetic, which CTRL-RT047-MATCHED-NULL.budget.new_dependencies
    forbids inside the EXP-DS-001 lane. Filing this as a control there would breach a
    frozen clause.
    (4) THE BATCH-021 LESSON IS APPLIED, NOT MERELY CITED. BATCH-021's map was verified
    EXHAUSTIVE by an independent session and applied honestly, and its favourable branch
    was nevertheless arithmetically unreachable. Exhaustiveness is necessary and is not
    sufficient. This batch therefore freezes an ATTAINABILITY ARGUMENT alongside the
    reading rule and makes checking it a named reviewer duty. That is the most important
    process change here, and it has already changed the design - see
    attainability_changed_the_design below.

  attainability_changed_the_design: >-
    RECORDED BECAUSE IT IS THE EVIDENCE THAT THE PROCESS CHANGE IS REAL RATHER THAN
    CEREMONIAL. Writing the attainability argument forced two design changes before any
    review. FIRST, the factor base had to move from the EXP-DS-001 sizes to Bfb = 512.
    The number of distinct half-tuples over a factor base of size Bfb is C(Bfb + 1, 2),
    which is 2080 at Bfb = 64, 8256 at 128 and 32896 at 256 - EVERY ONE BELOW THE FROZEN
    10**5 SAMPLE MINIMUM. At any EXP-DS-001 factor-base size the required sample count is
    reachable only by drawing with replacement from a support of at most 32896 distinct
    values, whose discretization would dominate the KS statistic and force a failure for
    a reason having nothing to do with Semaev structure. This is arithmetically the SAME
    SHAPE OF DEFECT as the C(129, 2) = 8256 enumeration cap that made BATCH-021's D-2
    unreachable, and it was caught this time before the freeze rather than by the Red
    Team afterwards. SECOND, the u = 6 rung of the smoothness ladder was found
    underpowered at the chosen sample size - 2.58 expected smooth samples against the 30
    the rate band needs - so it is DECLARED UNATTAINABLE AS A RATE DECISION IN ADVANCE,
    excluded from the rate check, retained for the decay tell where its low-count noise
    is provably conservative, and carries the sample size that would power it. Declaring
    an unattainable band and confining it to a role its unattainability does not spoil is
    exactly what BATCH-021 failed to do.

  decision_variable_variation_check_required_and_performed: >-
    ALSO REQUIRED BY THE BATCH-021 CLOSE AND PERFORMED BEFORE THE FREEZE. EV-DS-004 N-2
    and RT048-B1 established that the charged-unit proxy in the previous lane was a
    CLOSED FORM IN THE PROTOCOL'S OWN MATCHED PARAMETERS - a constant 40 units per
    enumeration making the ratio exactly the enumeration-count ratio with the object-free
    expectation 2/129 - so the object cancelled and the variable could not discriminate
    the objects it compared. EXP-SMTH-001 carries a decision_variable_variation_check
    block that answers this for every decision variable. The load-bearing argument is
    that the primary encoding ENC-B is a BIJECTION from [0, p) x [0, p) onto [1, p**2]
    and the null object is drawn uniformly on that same [1, p**2], so the real sample
    deviates from the null IF AND ONLY IF the joint law of the two elementary symmetric
    functions of the half-arity Semaev partial map departs from uniform - a property of
    the Semaev map alone, containing no free parameter of the protocol. Two further
    variables ARE degenerate by construction and are declared as such and confined to
    roles the degeneracy does not spoil - the ENC-A power certificate, whose rejection is
    derivable in advance and which is therefore used only to certify that the statistic
    can reject at all, and the apparatus-identity control, whose agreement is derivable
    and is expressly declared NOT to be corroboration.

  what_this_decision_forbids:
    - Any run. The Executor is gated on an approval snapshot that does not exist.
    - >-
      The anti-pattern of setting smoothness_abort = true on the existing EXP-DS-001
      arms and calling the mechanism exercised. That calls is_B_smooth on a stand-in and
      produces a false ledger tick while testing nothing. If ever run it is a plumbing
      check, produces no evidence record and discharges nothing.
    - Any modification of any EXP-DS-001 specification, control, amendment, driver, run package or result.
    - Any alteration of H-DS-001, H-IC-001 or H-STR-002, including their statuses, scopes, boundaries and histories.
    - Any touching of FAEST or XEDN.
    - S1_met, F1_met, F2_met and structure_gate_passed, none of which this batch can evaluate because it runs no search.
    - '`support` for H-SMTH-001, for H-DS-001 or for HEUR-DS-1, under every branch of the frozen reading rule.'
    - Any asymptotic, crypto-scale, medium-scale or affected-scheme claim; all four promotion gates G1 through G4 stay OPEN.
    - reject_scoped, and in particular reject_scoped-as-impossibility, on this single unreplicated run.
    - '`dominated_by: null` anywhere downstream of this record.'
    - Re-scoring or reopening EV-DS-001, EV-DS-002, EV-DS-003 or EV-DS-004.

  asymptotic_promotion_gates:
