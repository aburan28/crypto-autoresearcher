  id_assignment_note: >-
    ISSUED AND FILED AS DEC-20260801-006 AFTER A FRESHNESS RE-CHECK PERFORMED
    IMMEDIATELY BEFORE WRITING. ledger/decisions/ was re-listed against the current
    tree and contains DEC-20260801-001, -002, -003, -004 and -005 and no -006, so -006
    is the next free id on this date. ledger/handoffs/ contains TASK-20260801-001
    through -009 and none of -010 through -018. ledger/hypotheses/ contains no H-SMTH
    record of any number and there is no EXP-SMTH directory, no EV-SMTH record and no
