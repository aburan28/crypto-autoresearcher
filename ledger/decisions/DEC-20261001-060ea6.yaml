  recorded_at: '2026-10-01'
  decided_at: '2026-10-01'
  decided_by: coordinator
  recorded_by: coordinator
  goal_ids: [GOAL-RELN-001]
  archived_by: TASK-20261001-f3e0dc
  prior_decisions:
    - DEC-20261001-d3143e (holds approval of EXP-RELN-dc761f on IMP-1; NA-1, NA-2)
  inference:
    policy: coordinator-orchestration-code
    resolved_model_id: unknown (Cursor runtime; top-level session on its inherited model)
    fallback_used: true
    fallback_reason: Cursor runtime does not expose the resolved model identifier.

  decision: open_batch
  decision_label: >-
    CLOSE BATCH-9fba5a (design + readiness hold) as a checkpoint. OPEN
    BATCH-79a580: an executor-mechanical task derives the three F-2 28-bit
    fixtures and their P-5 yields and budgets; a validator task re-derives the
    same values blind from the contract text; one snapshot archives both. No
    scientific run.

  target_ids:
    - GOAL-RELN-001
    - BATCH-9fba5a
    - BATCH-79a580
    - EXP-RELN-dc761f
    - H-RELN-940f14
    - TASK-20261001-c21719
    - TASK-20261001-f3e0dc
    - TASK-20261001-84833e
    - TASK-20261001-8615ec
    - TASK-20261001-93c38a

  ranking:
    ecc_first: RELN is a declared ECC area (tools/ecc_priority.py); budget unlimited.
    obstruction_registry_read: >-
      tools/obstruction_registry.py --unexamined lists one entry, EV-AES-abf3dc
      (non-ECC). EV-RELN-3c9a24 carries an examined resource check naming this
      successor.
    rank_1:
      task: TASK-20261001-84833e with TASK-20261001-8615ec
      why: >-
        DEC-20261001-d3143e NA-1 is the goal's committed next action and the
        only remaining blocker to approval (IMP-1). Both computations are
        deterministic and label-free.

  rulings:
    - id: R-1
      ruling: >-
        Blind re-derivation. TASK-20261001-8615ec may not read anything under
        TASK-20261001-84833e's task directory or any other implementation of F-2
        or P-5; it works from the contract text and the v4 fixture values only.
        The two tasks may run concurrently. The Coordinator compares their
        outputs in the approval decision (NA-2); disagreement blocks approval
        and localises to one of two named implementations.
    - id: R-2
      ruling: >-
        Both tasks must also recompute the frozen P-5 values for the nine
        existing F-1 fixtures and report any mismatch with the contract table.
        That is the proves-too-much control: an implementation that does not
        reproduce known values is not trusted on the new ones.
    - id: R-3
      ruling: >-
        Dispatch waits for C-7 (15-min load <= 14, / >= 5 GiB free, repository
        volume >= 20 GiB free); each task carries a 4 GiB RSS watchdog.

  transitions_not_made:
    - record: EXP-RELN-dc761f
      note: Stays designed (approved_by null) until NA-2.
    - record: H-RELN-940f14
      note: Unchanged.

  rationale: >-
    DEC-20261001-d3143e found the contract complete apart from IMP-1. Deriving
    the values twice, independently, is the cheapest route to frozen inputs
    and keeps the full twelve-fixture panel that the C34 power check assumed.

  knowledge_promotion:
    promoted: []
    not_warranted: Batch-opening decision; it records no result.
