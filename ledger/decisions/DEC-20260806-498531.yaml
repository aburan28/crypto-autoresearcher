coordinator_decision:
  id: DEC-20260806-498531
  context: >-
    GOAL-SSIQ-001 BATCH-009 -- the first batch under the extended
    campaign_budget (maximum_batches 8 -> 12, this session, on the user's
    explicit direction "Extend the budget and continue"). Executed the
    ranked resume action item (1) from DEC-20260806-357b30: fix GD-12 (a
    specification-authoring defect named in BATCH-008, where the v5
    contract's trapping-mechanism cross-check compared the wrong vertex)
    via a frozen v6 amendment (specification_v6.yaml, after THREE
    pre-freeze review rounds -- round 1 DO-NOT-FREEZE, round 2 DO-NOT-
    FREEZE again with two new defects found inside the round-1 fix's own
    text, round 3 FREEZE-WITH-FIXES). PART A fixed GD-12; PART B ran the
    funnel-structure diagnostic named as resume action item (2). Recorded
    as EV-SSIQ-0fc992, on TASK-20260806-ff3023 ADMIT-WITH-CONDITIONS and
    TASK-20260806-bb916b CHALLENGE (narrow).
  decision: support
  decision_note: >-
    support: GD-12 is genuinely, non-trivially fixed, independently
    confirmed across FIVE from-scratch re-derivations by four separate
    parties (Executor twice, Coordinator, Validator, Red Team) -- the
    first batch since BATCH-004 in which no NEW code, control, or
    specification defect requiring a further "revise" cycle was found in
    the run itself. PART B's diagnostic ran exactly as specified and
    surfaced a genuine, control-confirmed empirical anomaly (universal
    delta_E local ties) that reframes, rather than closes or refutes, the
    funnel-structure mechanism question. Two small numeric slips in the
    run's own disclosed-but-uncorrected prose and one missing control
    (independently supplied and reproduced by this decision's own
    evidence record) are recorded as corrections, per this campaign's
    GD-9/PF-8/PF-9 "trace a producer's own confidence-building prose"
    standing discipline -- now shown to apply even to a reviewer's own
    report (RT-BATCH-009's internal 624/47.4% vs. 670/50.9% inconsistency,
    caught and corrected in EV-SSIQ-0fc992 O-2).
  target_ids:
    - GOAL-SSIQ-001
    - RQ-SSIQ-9702af
    - EXP-SSIQ-a85692
    - EV-SSIQ-0fc992
    - TASK-20260806-fea335
    - TASK-20260806-ff3023
    - TASK-20260806-bb916b
  evidence_refs:
    - EV-SSIQ-0fc992
  rationale:
    - id: D-1
      statement: >-
        GD-12 IS CLOSED. The corrected cross-check passes on all four
        primes with zero disagreements across 1316 trapped=True walks, and
        the Red Team's independent reconstruction (cross-triangulated
        against its own prior BATCH-008 arithmetic) confirms 670 of those
        1316 (50.9%) are genuine multi-step cases where the fix's
        start-vs-terminal distinction actually matters -- not a population
        dominated by trivial 0-step self-traps. This is the exact same
        vertex population v5's broken cross-check flagged as false
        disagreements, now correctly reconciled.
      confidence: high
    - id: D-2
      statement: >-
        ANOM-1 (universal depth==0 among structural local minima) IS A
        REAL, CONTROL-CONFIRMED EMPIRICAL SIGNAL, independently verified
        FIVE TIMES total across this lineage (Executor twice, Coordinator
        once via raw data query, Red Team once via a null-permutation
        control, Coordinator again reproducing that same control). The
        null control -- real data 100% depth==0 vs. a label-permutation
        null's 35-57% -- rules out a coarse-alphabet pigeonhole artifact
        and establishes genuine spatial autocorrelation of delta_E along
        graph edges as a new, previously unrecorded structural fact about
        this labelling scheme.
      confidence: high
    - id: D-3
      statement: >-
        THE FUNNEL-STRUCTURE MECHANISM QUESTION IS REFRAMED, NOT ANSWERED.
        The REQUIRED CORRELATION's undefined result is not itself evidence
        against a funnel mechanism -- it is a structural consequence of
        this batch's coarse delta_E resolution (8-13 distinct values),
        independently confirmed by D-2's control. The mild-but-real
        top-decile concentration measurement (17-19% of trapped=True walks
        captured by the top decile of local minima, vs. a 10% uniform
        baseline) stands on its own and must not be blended with the
        correlation's failure into a single "no funnel structure"
        statement. A future amendment needs a depth measure with genuine
        variance at whatever delta_E resolution it uses, verified against
        the same null-permutation control before being trusted.
      confidence: medium
    - id: D-4
      statement: >-
        THIS BATCH DEMONSTRATES THE CAMPAIGN'S OWN STANDING REPAIR
        (GD-9/PF-8/PF-9's "trace a producer's own confidence-building
        prose before it becomes a record") NOW APPLIES RECURSIVELY TO A
        REVIEWER'S OWN REPORT, NOT ONLY TO EXECUTOR OR COORDINATOR TEXT.
        RT-BATCH-009's own "Bottom line up front" section states an
        internally inconsistent total (624/47.4%) against its own later
        table and every other section (670/50.9%, independently
        recomputed and confirmed correct in EV-SSIQ-0fc992 O-2 directly
        from archived JSON). The discipline holds regardless of which role
        produced the prose.
      confidence: high
  limitations:
    - >-
      No claim about H-SSIQ-36e970, a delta_E-gradient's existence, or a
      p^{1/4} algorithm is made anywhere in this decision or its evidence
      record. Lever L4 is NOT retired.
    - >-
      "GD-12 is fixed" is NOT progress toward resolving H-SSIQ-36e970's
      DATA-UNAVAILABLE-BLOCKED status, which remains untouched by this
      batch.
    - >-
      ANOM-1's spatial-autocorrelation signal is about UNDIRECTED local
      clustering of delta_E; H-SSIQ-36e970's own question is about
      DIRECTIONAL descent efficiency. Related subject matter, not the same
      test -- this decision does not conflate them.
    - >-
      Toy scale throughout; nothing transfers to cryptographic scale.
      Model independence remains absent and unverifiable in this
      environment. Evidence strength stays capped at preliminary
      campaign-wide.
    - >-
      The delta_E label-permutation null control this decision relies on
      (D-2) has been independently reproduced twice but has never itself
      been run as an archived Executor task or committed as a standalone
      artifact -- a future amendment relying on it further should formally
      re-run and archive it.
  next_actions:
    - >-
      RANKED, FOR BATCH-010: (1) [highest value, per RT-BATCH-009's own
      next_concrete_action] formally re-run and archive the delta_E
      label-permutation null control as its own bounded task, together
      with its falsifiable mechanical hypothesis (near-Lipschitz spatial
      clustering of delta_E along graph edges) -- testable by re-running
      the same diagnostic at a larger smoothness bound B/X and checking
      whether depth==0's universality recedes toward the null's ~35-57%
      baseline as the delta_E alphabet grows finer; this is the natural
      next falsification test and the most direct way to test whether
      ANOM-1 is resolution-driven; (2) [second] if (1) confirms
      resolution-dependence, design a depth operationalization with
      demonstrated non-degenerate variance (e.g. graph-hop distance to the
      nearest strictly larger-delta vertex) and re-attempt the
      funnel-capture correlation the current amendment could not test;
      (3) [deferred, unchanged reasoning from BATCH-006/008] widening to
      larger primes/N stays deferred until (1)-(2) give an evidence-based
      reason to expect different behavior.
      L4 remains the only lever whose ceiling meets this goal's target and
      still the top priority, unchanged. Any future amendment goes through
      its own pre-freeze review(s) with GD-11/GD-12's standing repairs
      applied, PLUS this batch's own addition: a claimed empirical anomaly
      requires a stated, executed null-object control before being
      recorded as a real signal, not merely a disclosed-but-unexplained
      observation.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Nothing promoted; evidence strength is preliminary (session-only
      independence), below this campaign's replicated/strong bar for
      promotion. A TENTH KNOWLEDGE CANDIDATE is now queued campaign-wide,
      distinct from the prior nine: "a null-object control (holding the
      real structure fixed, permuting only the labeling under test) is the
      correct discriminating check for 'is this empirical anomaly a
      structural artifact of the object's coarseness/regularity, or a
      genuine signal' -- apply it before recording any anomaly as
      unexplained, and apply the same 'trace it, don't trust it' standard
      to a reviewer's own report text, not only to Executor/Coordinator
      artifacts." All ten promote together when a genuinely independent
      model becomes available to re-check them.
  decided_by: coordinator
  decided_at: '2026-08-06'
