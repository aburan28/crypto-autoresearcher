coordinator_decision:
  id: DEC-20260825-46598a
  context: >-
    Before the BATCH-303ce8 snapshot, TASK-20260825-51dfe7 reported one
    schema-ineligible MD4 frontier flag and one omitted, Pareto-incomparable
    SHA-0 memory tradeoff from CRYPTO 2009 Table 1. TASK-20260825-7d3441
    independently reported that its written summary undercounted its actual
    rows. Both producing roles are create-only and correctly refused to
    overwrite their artifacts.
  decision: revise
  target_ids:
    - GOAL-SYMF-c00fa1
    - BATCH-303ce8
    - TASK-20260825-51dfe7
    - TASK-20260825-7d3441
    - TASK-20260825-ced8f2
    - TASK-20260825-568663
    - TASK-20260825-bb6d5d
    - TASK-20260825-9eda3a
  rationale:
    - >-
      A missing incomparable time--memory row is material to the exact Pareto
      frontier and cannot be inserted from an inter-agent message, which is not
      evidence. A bounded producer must retrieve and transcribe the source.
    - >-
      The original producer artifacts remain unchanged. A separate correction
      addendum makes the defects auditable and lets independent reviewers test
      both the original rows and their proposed overlays.
    - >-
      The correction adds 300 seconds inside the existing 21600-second campaign
      ceiling and uses the free concurrency slot after two producers terminated.
  evidence_refs:
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/tasks/TASK-20260825-51dfe7/frontier-shard.yaml
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/tasks/TASK-20260825-7d3441/frontier-shard.yaml
    - https://www.iacr.org/archive/crypto2009/56770071/56770071.pdf -- producer-supplied pointer only until TASK-20260825-ced8f2 retrieves it
  limitations:
    - This decision approves source retrieval and structured correction only; it does not admit the missing row to canonical knowledge.
    - The reviewers remain sibling-blind and must test the correction addendum after snapshot.
    - The SHA-1 blind re-derivation remains blind from the legacy producer directory; the correction contains no SHA-1 row.
  next_actions:
    - Complete TASK-20260825-ced8f2 and the still-running modern-hash task.
    - Snapshot the three original shards plus the correction addendum before review.
  knowledge_promotion:
    promoted: []
    not_warranted: The correction has not been source-checked or independently reviewed.
  decided_by: coordinator
  decided_at: '2026-08-25'
