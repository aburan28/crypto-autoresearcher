  archived_by: TASK-20260809-1dfd9a

  context: >-
    BATCH-4f52ab reopened only the missing independent Red Team gate after the
    corrected EXP-SSI-2d8583 contract and its schema-supersession registry
    route were snapshot-bound. Fresh Validator and Red Team sessions reviewed
    the same immutable boundary. Neither executed Stage 0/1.

  decision: refine

  decision_scope: >-
    Admit the schema-repaired candidate to continued design refinement only.
    This decision records that both independent reviews found the provenance
    and claim boundary coherent with caveats. It does not approve, freeze, or
    authorize EXP-SSI-2d8583; it changes no hypothesis status and makes no SSI,
    SQIsign, attack, security, or exponent claim.

  target_ids:
    - IDEA-20260806-9c2f80
    - EXP-SSI-a6132d
    - EXP-SSI-2d8583
    - GOAL-SSI-001

  evidence_ids:
    - EV-SSI-710df5

  review_ids:
    - VAL-20260809-6f34ac
    - TASK-20260809-83623a
  review_task_ids:
    - TASK-20260809-6f34ac
    - TASK-20260809-83623a

  snapshot_commit: 329eef133c5a84605469af92c692fa8c010df7df

  rationale:
    design_boundary:
      basis: >-
        The successor has the required schema fields, the predecessor remains
        hash-identical, the registry route is additive, the proof_search_map
        and matched-null controls are present, and the contract explicitly
        forbids execution and cryptanalytic overclaim.
    independent_validation:
      basis: >-
        VAL-20260809-6f34ac independently verified the snapshot, queue, schema,
        predecessor immutability, proof-map presence, matched null design, and
        no-execution boundary. It returned CONCUR_WITH_CAVEAT and recorded no
        blocking provenance defect.
    independent_red_team:
      basis: >-
        TASK-20260809-83623a attacked the advice quantifier, H-ADV assumptions,
        A/B collision representation, Construction C pair law, fiber metric,
        matched null, nearby control, cost accounting, provenance, and claim
        boundary. It returned CONCUR_WITH_CAVEAT and identified the repairs
        required before execution.
    execution_authorization:
      granted: false
      reason: >-
        The review package is not execution-ready. The universal-over-E
        quantifier is not matched by the proposed random-set validation;
        Construction C's pair law and fiber accounting are not frozen; the
        null, shuffle, and nearby controls lack byte-level reproducibility; and
        the advice representation, build costs, physical units, and catalogue
        path need repair. No compute should be spent on Stage 0/1 until an
        additive successor addresses these points and passes fresh gates.
    caveats:
      basis: >-
        The snapshot receipt intentionally retains pending post-commit fields,
        native review model binding was not adapter-probe-verified because no
        usable API backend was configured, and the unrelated WESOVOW manifest
        error remains baseline debt. These are recorded limitations, not
        scientific results.
    claim_boundary:
      basis: >-
        No measurement, attack, security, exponent, novelty, hypothesis
        transition, experiment authorization, or goal completion follows from
        this decision.

  official_research_state_changed: false
  hypothesis_status_transition: none
  experiment_status_transition:
    - id: EXP-SSI-2d8583
      from: review_required
      to: review_required
      note: >-
        The corrected contract remains review_required, unfrozen,
        execution_authorized: false, and evidence_eligible: false. This
        decision records refinement only and does not mutate the experiment.

  asymptotic_promotion_gates:
    gate_1_proof_decomposition: open
    gate_2_numbered_heuristics: open
    gate_3_concrete_cost_table: open
    gate_4_independent_review_and_red_team: >-
      Passed only for this design-boundary review; it does not pass any
      asymptotic, breakthrough, or security promotion gate.
    note: >-
      The candidate remains conditional and design-only. Its formula and
      heuristic obligations are not observations or a complexity result.

  next_actions:
    - >-
      Open an additive successor refinement batch for IDEA-20260806-9c2f80 that
      fixes the quantifier/hitting-time statement, pins B's advice encoding,
      states Construction C's pair-distribution assumption, defines the charged
      resolution fiber, freezes byte-level random/shuffled/nearby controls and
      tolerances, charges build and physical-memory costs, and corrects the
      ssi-ssiq versus ssi-ssqi catalogue path. Snapshot the successor before
      fresh independent Validator and Red Team review.
    - >-
      Keep EXP-SSI-2d8583 unapproved for execution, unfrozen, and
      execution-unauthorized until the successor review gates pass. Do not run
      Stage 0/1 or infer a security/exponent result from EV-SSI-59f7a2.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This batch measured nothing and promotes no technique, theorem, attack,
      exponent, security conclusion, or knowledge item.

  claim_ceiling: >-
    The strongest true statement is that the schema-repaired design boundary
    survived independent provenance and claim-boundary review with caveats,
    while substantive model and control repairs remain required. This is not
    evidence about the SSI problem or any deployed security level.

  decided_by:
    task: TASK-20260809-1dfd9a
    role: coordinator
    policy: coordinator-orchestration-code
  decided_at: '2026-08-09'
