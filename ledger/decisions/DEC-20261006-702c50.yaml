  context: >-
    /design-experiment, one contract, for IDEA-20261005-1cb745. No
    hypothesis and no experiment cites that idea. Its question id is
    RQ-SERP-722a09. The proposal file is on origin/main. The branch
    design/serp-1cb745-sbox was created from origin/main at
    9c2bc35e93f0c2f83026c8e351c621f623bdfb90 and git merge origin/main
    reported already up to date.

    The contract applies one Serpent linear transformation to the 480
    nonzero differences supported in a single 4-bit S-box. The
    pre-registered prediction is that every image has at least 2 active
    S-boxes. The identity linear layer on the same 480 differences is
    the control and achieves minimum 1. A single image with fewer than
    2 active S-boxes, under a valid pin, is a negative. No attack is
    claimed.

    This session did not apply the linear transformation. The markdown
    notes KN-LIT-3430 and KN-TECH-066 were opened. The frontier rows
    KR-RHO-fb88e6 and KR-IC-73db3f were opened and are not used as
    costs. The Serpent AES submission was not opened.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, seeds, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. Success is a
    valid pin together with every image having at least 2 active
    S-boxes, and it fails when one image has fewer than 2. No field
    required for approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading are fixed before any executor run.
    - A single image with fewer than 2 active S-boxes is reachable as a recorded outcome, so success is not automatic.
    - The identity map is a same-shape control on which the minimum 2 is predicted false, and a run that does not return 1 on the identity is invalid rather than a Serpent result.
    - Two activity counters and a matrix extracted from the bitsliced routine give the run a way to come back invalid when the pin splits.
    - This session did not apply the linear transformation and did not claim a Serpent break.

  evidence_refs: []
  limitations:
    - The measurement covers one linear layer and 480 differences. It is not an 11-round attack and not a distinguisher.
    - KN-LIT-3430 remains an abstract-level note. Its printed figures were not checked against the paper.
    - The Serpent AES submission was not opened. The executor must pin a published test vector before the count.
    - HEUR-1 is a 16-bit counting check. It does not transfer to the 128-bit map.
    - This decision authorizes a later execution. It does not start one.

  next_actions:
