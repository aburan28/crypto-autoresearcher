coordinator_decision:
  id: DEC-20260915-87360d
  recorded_at: '2026-09-15'
  decided_at: '2026-09-15'
  decided_by: coordinator
  recorded_by_task: TASK-20260915-5e4617
  archived_by: TASK-20260915-5e4617
  goal_id: GOAL-ICPERF-e6b6a4
  batch_id: BATCH-51e2aa
  decision: refine
  decision_label: >-
    Compose REVIEW-ICPERF-20260913-66fd51 (joints V1-V6 and two proves-too-much
    objects, two independent validators under a base plan and two addenda) on
    RUN-ICPERF-305ca3 and RUN-ICPERF-4ec9b9 of EXP-ICPERF-66fd51, the first
    point-decomposition row of the RQ-ICPERF-94c86e boundary table.
    H-ICPERF-cc4847 moves approved -> weakened (moderate, in scope): P1 is false as
    worded on 5 of 205 SAT answers and the five are certified TWIST decompositions,
    which discharges P1's own stated consequence and leaves the prediction's wording
    as the defect; P6's mechanism clause is unsupported because the relabelling
    control shows its null comparison is confounded with variable order; P2 and P5's
    Groebner clause are UNMEASURED for two diagnosed infrastructure reasons and are
    not evidence in either direction. The branching-order clause is SUPPORTED and
    strengthened. Nothing here is a statement about the security of any curve, and no
    generic-attack comparison exists in either run to make one from.
  context: >-
    EXP-ICPERF-66fd51 is the first batch of GOAL-ICPERF-e6b6a4, opened on the user's
    2026-09-13 instruction to establish a concrete performance boundary for index
    calculus on Koblitz, characteristic-2 and prime-field curves, against a benchmark
    set the user pointed at (mtrimoska/EC-Index-Calculus-Benchmarks, vendored as
    SRC-ICPERF-TRIMOSKA-ECICB-2024). RUN-ICPERF-305ca3 measured 504 rows over the 60
    shipped S_4 PDP instances and 18 matched null objects, and reported P1 false, P2
    null, P3-P6 true. Two facts about that run made an ordinary single-reviewer round
    inadequate: P1 -- the prediction the Coordinator was most confident of -- failed,
    and the run was interrupted twice by host suspension while its own Macaulay2 phase
    drove the load average to 4.55. The Coordinator wrote the review plan and its prior
    before any reviewer ran, then extended it twice, additively: addendum V6 added the
    generic-baseline joint after confirming from find_points.sage that the benchmark
    curve is Koblitz, and addendum split-V2 moved the solver-re-run joint into its own
    task so the five zero-compute joints could proceed without contaminating the
    in-flight second run. RUN-ICPERF-4ec9b9 is that second run, admitted by additive
    amendment AMD-20260915-4ec9b9 to answer one question -- whether the first run's
    medians were timings or load artifacts -- and it answers it (31/31 identical
    conflict medians).
  target_ids:
    - H-ICPERF-cc4847
    - EXP-ICPERF-66fd51
    - RUN-ICPERF-305ca3
    - RUN-ICPERF-4ec9b9
    - EV-ICPERF-390707
    - IDEA-20260915-8fe0ef
    - IDEA-20260915-3f1964
  official_transitions:
    H-ICPERF-cc4847:
      from: approved
      to: weakened
      basis: >-
        Pre-registered test: six predictions, six falsification conditions. ONE
        FALSIFICATION CONDITION FIRED. P1's ("a shipped certificate does not verify, or
        any engine returns an assignment that is not a decomposition") fired on 5 of 205
        answers, all one x-set on n19l6-19-U; the certificate half held 30/30 under
        independent arithmetic (EV-ICPERF-390707 O-1). P2 is NULL, not failed -- no
        Groebner engine finished in either run, so under core rule 5 nothing is asserted
        (O-3, O-4, O-5). P3 HELD on all three clauses: (a) identity on 60/60, (b) censored
        50-1843x against a 2x threshold, (c) 10.4-83.5x after correcting a reporting bug
        that moved no verdict (O-8). P4 HELD, 4.1-7.2x slower, unmoved by excluding every
        high-load row (O-10). P5's SAT clause HELD on every cell (3.63-11.45 against 2x);
        its Groebner clause was NEVER EVALUATED, guarded on a row key present on 0 of 504
        rows, so it is void for the same reason P2 is (O-8). P6's RATIO held where
        evaluable (114.30, 20.06, both >= 10, robust to the aggregation choice) and its
        n19l6 cell is unevaluable in the predicted quantity; P6's MECHANISM CLAUSE ("the
        solver's speed is a property of the descended structure, not of the size") is NOT
        SUPPORTED, because relabelling the structured instance's variable indices alone
        reproduces the structured-versus-null gap to within a factor of two in the median
        (O-6, O-7). `weakened` and not `rejected`: nothing was refuted -- P1's failure is
        explained to certificate standard and the instrument is sound, P2 is unmeasured
        rather than negative, and four of six predictions held. `weakened` and not
        `supported`: a falsification condition fired, a headline mechanism clause is
        confounded by the control the plan designed to catch exactly that, and the title's
        SAT-over-Groebner clause has no measurement behind it at all. `weakened` and not
        `inconclusive`: the round settled what it was built to settle, at certificate
        standard on P1 and by direct measurement on the rest; the uncertainty is in the
        design of two predictions, not in whether they were met.
    EXP-ICPERF-66fd51:
      from: approved
      to: analyzed
      basis: >-
        Evidence record EV-ICPERF-390707 written and archived under this decision over
        both runs. The contract head carries AMD-20260915-4ec9b9, which raised
        maximum_runs 1 -> 2 additively; both runs are archived (TASK-20260913-e75497 and
        TASK-20260915-620d66) and both reviewers' reports are archived here. The contract
        is NOT `archived`: its second batch reuses this specification's phase structure,
        and three defects in its own code (O-4, O-8, O-17c) are repaired against the next
        run rather than this one.
  confirmed_priors:
    - joint: V1
      prior: '"I EXPECT THE FIVE SAT ANSWERS TO BE GENUINE ROOTS OF THE SHIPPED SYSTEM AND NOT DECOMPOSITIONS ON E ... a TWIST decomposition made possible by how the upstream generator labels instances."'
      finding: >-
        CONFIRMED, and confirmed harder than the prior asked. All three named
        mind-changing conditions were tested and none fired: f3 = 0 under the convention
        the 30 certificates force, x_R has trace 1 rather than 0, and the bit-order
        convention is consistent (LSB-first verifies 30/30 and MSB-first 0/30, so the
        convention is settled by the data). The prior's rough probability estimate
        (~1.4 satisfiable U instances in 30) is superseded by an exact enumeration
        (5.57 expected, one observed), which is where O-16 comes from. What the prior did
        not anticipate: an exhaustive V^3 enumeration agrees with the solvers on 60/60,
        n19l6-19-U has exactly ONE root and it is the twist one, and n15l5-8-S is
        degenerate with 32 roots.
    - joint: V2
      prior: '"I EXPECT THE MACAULAY2 ABORT TO BE AN ADDRESS-SPACE-LIMIT ARTIFACT, NOT MEMORY EXHAUSTION ... I expect Singular std to be genuinely uncompetitive at 900 s."'
      finding: >-
        CONFIRMED in the main clause and CONFIRMED IN THE ESCAPE CLAUSE TOO, which is a
        more useful outcome than the prior contemplated. 2.575 GiB resident at a 5.996 GiB
        address-space cap; uncapped the same script completes F4 in ~50 s reserving
        145 GiB of address space against 6.8 GiB resident. And the escape clause the prior
        wrote ("exceeding 6 GB RSS ... then the memory model is the problem") ALSO fires:
        unconstrained peak RSS is 6.71-6.82 GiB, above the contract's own 6 GB child
        budget. Both halves true at once, so the successor must change the limit KIND and
        its VALUE. Singular's `std` timeout is confirmed real and fair.
    - joint: V5
      prior: '"the measured rows are clean" (with the stated relation "every row''s wall_s is within 2 s of 2 x cpu_s")'
      finding: >-
        SUBSTANCE CONFIRMED, STATED RELATION WRONG. No row spans either suspension, 0 rows
        overshoot a timeout by more than 45 ms, and across all 442 non-Macaulay2 rows
        wall - cpu lies in [0.3 ms, 170 ms]. But the relation is wall ~ 1 x cpu, not 2x,
        and on Macaulay2 cpu EXCEEDS wall (1.27-2.74x, multi-threaded) -- which is the
        measurement that later explains the load average. The Coordinator's count of 125
        high-load rows was exact.
    - joint: V3
      prior: 'that the identical 83.50030889840438 across four P3c cells is a bug, and that n17l6/S would be the tight cell'
      finding: >-
        CONFIRMED on both, including the cell. It is a loop-variable leak: summary.py
        line 131 reads a name never rebound in the P3b loop, so n19l6/U's ratio is written
        under four keys. Corrected, n17l6/S is the tightest at 10.396 -- clearing the
        threshold by 4%, exactly as predicted -- and all eight comparators clear 10, so
        the declared breaking artifact does not fire. Also confirmed: the P3b comparator
        IS the matched 5-instance subset, as the Coordinator guessed, and is undocumented
        under a key name that invites the wrong comparison.
    - joint: V6
      prior: 'that the curve is Koblitz, that the tau orbit is the full 2n, and that the most likely outcome is that nothing in the run moves'
      finding: >-
        CONFIRMED on all three. All five Weierstrass coefficients are in F_2; point counts
        32494, 131174, 525086 from the F_2 trace recursion, each independently confirmed by
        brute-force count over all 2^n x-values; lambda has multiplicative order exactly n
        with -1 not a power of it at every cell, so the orbit is 2n = 30, 34, 38. And the
        run reports no generic baseline of any kind, so nothing moves. The nearby-object
        control behaves correctly off Koblitz.
  refuted_priors:
    - joint: proves_too_much object 2
      prior: 'implicit in the plan''s ordering: the control was written as a check the design was expected to pass, with its failure consequence stated as a contingency'
      finding: >-
        THE CONTROL FAILS, AND IT IS THE MOST INFORMATIVE RESULT OF THE ROUND. Relabelling
        Xn15l5-11-U.anf's 42 variable indices by a random bijection -- same system, verified
        identical in header counts, constant count, total terms and per-equation degree
        multisets, on the same byte-identical binary -- costs a median 4,224,251 conflicts
        against 31,257, i.e. 135x, at 0.55x the matched null. Nine of ten seeds exceed both
        of the plan's thresholds; the tenth is still 3.84x. The structured instance spans
        361x across variable orders while its null spans 2.14x. An identity-permutation
        control reproduces the source byte-for-byte and its conflict count, so the rewriter
        is not the effect. The mechanism is in wdsat.c: the default branching sequence is
        literally the index order, with no dynamic heuristic, so the generator's emission
        order IS the branching order. The Coordinator accepts the consequence it
        pre-committed to and applies it below.
    - joint: V6 (the addendum's own framing, not the reviewer's finding)
      prior: '"the negation-only Pollard rho baseline that RUN-ICPERF-305ca3 compares its SAT column against"'
      finding: >-
        WITHDRAWN BY THE COORDINATOR. There is no such baseline and no such comparison:
        the run reports no rho, generic, Pollard or Frobenius column at all, as its own
        frozen contract and the hypothesis both state. The addendum described a defect in
        the run where there was only an absence. What V6 establishes is a correction to a
        FUTURE boundary-table column, and the correction is sqrt(n) = 3.87/4.12/4.36
        against a negation-only baseline, NOT the sqrt(2n) = 5.5/5.8/6.2 that
        IDEA-20260915-8fe0ef asserts -- that proposal is internally inconsistent, its
        formula evaluating to sqrt(n) and its stated number to sqrt(2n), and wrong in the
        direction of overstating the correction. See official corrections below.
  corrections_recorded:
    - target: IDEA-20260915-8fe0ef
      what: >-
        The proposal's stated correction factor of sqrt(2n) against the rho baseline is
        wrong; sqrt(2n) is the factor against a baseline with NO equivalence classes,
        while against negation-only -- which is what any competent implementation would
        have -- it is sqrt(n). The proposal's own numerator and denominator are right;
        only the ratio it states is wrong. It also presumes a rho baseline in
        RUN-ICPERF-305ca3 that does not exist.
      how: >-
        Recorded here and in EV-ICPERF-390707 O-12/O-13. The proposal record is NOT
        edited: it is immutable, and a design task derived from it must cite this
        correction. The proposal's underlying idea -- Frobenius-invariant factor bases on
        Koblitz cells -- is unaffected and stays ranked; what is corrected is one factor
        in its motivation and one false premise about an existing run.
    - target: 'H-ICPERF-cc4847 P1 (wording)'
      what: >-
        "Every SAT answer any engine returns is a valid decomposition" is not a
        well-formed prediction about a system encoding S_4 = 0, because S_4 vanishes on
        x-coordinates over the algebraic closure and therefore cannot distinguish E from
        its quadratic twist. A solver returning a twist decomposition is behaving
        correctly and a curve-membership decoder rejecting it is behaving correctly; the
        prediction had no room for the true state of affairs.
      how: >-
        A superseding hypothesis must word it as "every SAT answer is a valid
        decomposition on E or on its quadratic twist, with the side recorded", and the
        side-classified table is then part of the instrument rather than an anomaly
        investigation. NEVER by editing the frozen H-ICPERF-cc4847.
  procedure_deviations:
    - id: PD-C1
      side: coordinator
      text: >-
        The round was extended twice after the plan was written, by two committed addenda
        rather than by edits. V6 added a joint (permitted: an addendum may add, never
        remove). split-V2 REASSIGNED an existing joint to a new task mid-round, which is
        the more consequential of the two and is a departure from "joints are enumerated
        and owned" as a once-and-for-all act. The reason was resource contention, not
        finding-driven: joint V2 needs a solver and RUN-ICPERF-4ec9b9 was in flight, so
        running V2 in the same session would have contaminated both. The blindness cost is
        zero -- the second reviewer never read the first's directory -- and the coverage
        cost is zero, since every joint still has exactly one owner. What it did cost was
        the mechanical independence check; see PD-C2.
    - id: PD-C2
      side: coordinator
      text: >-
        `tools/check_review_independence.py` could not compose the addenda when this round
        ran, so it held the first reviewer to the base plan's owners map and reported it
        as failing to claim a joint the governing addendum had taken away. The reviewer
        refused to clear that by fabricating an ownership claim and a verdict, named it as
        a core-rule-9 violation, and escalated. The Coordinator's answer is a tooling
        change on this branch (compose `extends`/`also_extends` addenda before checking,
        with tests pinning that an addendum may add a joint, reassign an owner and add a
        proves-too-much object, and may NOT remove a joint or weaken a control). No
        Coordinator-side run of the repaired checker over BOTH attestations against the
        composed plan is claimed here; the second reviewer reports the repaired checker
        raises no problem with its own joint.
    - id: PD-C3
      side: coordinator
      text: >-
        Two subagent attempts at the first reviewer's joints died before filing a report,
        one disclosed in the plan (`scratch/`, ~09:16-09:33Z) and one NOT disclosed
        (`artifacts/`, 12:35-13:33Z, a nearly complete pass with no report and no
        attestation). The cause is subagent sessions terminating on VM suspension and
        being relaunched, already on this campaign's record. The reviewer listed the
        undisclosed directory's file names to report its existence and opened none of its
        contents; both predecessors' numbers are excluded from EV-ICPERF-390707. TWO
        SILENT PREDECESSORS IS A DIFFERENT INDEPENDENCE STORY FROM ONE, and the honest
        statement is that this round's independence rests on the reviewer's own account of
        what it did not read. The Coordinator's failure was not disclosing the second
        attempt before the round; the general fix is that a relaunch after an
        infrastructure death is disclosed at relaunch time, not reconstructed afterwards.
    - id: PD-C4
      side: coordinator
      text: >-
        summary.py was NOT repaired between the two runs although all three of its defects
        were known before RUN-ICPERF-4ec9b9 produced its summary. This is deliberate and
        recorded in AMD-20260915-4ec9b9: editing the reduction under a running experiment
        changes what that run's own summary means. The cost is that RUN-ICPERF-4ec9b9's
        printed booleans carry the same three defects, and the corrections in O-8 apply to
        both runs.
    - id: PD-V1
      side: reviewer
      text: >-
        Five deviations by TASK-20260913-6c5729, all disclosed and all accepted. Two are
        strengthenings: 170 bit-flip control objects where the plan asked for 30, and not
        reading IDEA-20260915-8fe0ef at all so that only the claim quoted in the addendum
        was scored. One preserves blindness at no cost: the plan said to open code/binec.py
        to compare decoder conventions and the reviewer instead read the convention off the
        decoder's own recorded `why` string, so binec.py, convert.py and Weil_descent.sage
        were never opened. One is a limitation, not a choice: V5's exclusion test cannot
        evaluate P3c because phase D is 82/90 high-load and no low-load control exists, so
        a direct per-row wall-versus-cpu measurement was substituted, which bounds the
        contamination more tightly than the test would have. One is independence: the
        predecessor directories were not read.
    - id: PD-V2
      side: reviewer
      text: >-
        TASK-20260915-195b0c launched 29 child processes under a joint whose plan
        anticipated re-runs, which is within scope; it also ran probes the plan did not
        name (slimgb, `no redSB`, six Macaulay2 configurations, a pty stdin reproduction,
        ten relabelling seeds where the plan implied one, three null relabellings). Every
        one is diagnostic rather than a new measurement of the claim, and three of them
        produced the round's most actionable findings (O-4, O-5, O-6). Accepted and
        recorded rather than absorbed.
  rationale: >-
    This round was built to answer whether the first row of the boundary table is an
    instrument or a log, and the answer is that it is an instrument with three
    identified defects and one confounded comparison. The reasoning behind `weakened`
    rather than `supported` is worth stating plainly, because four of six predictions
    held and the temptation is to round up. Two things stop that. First, P1 failed --
    and the honest reading is not that the benchmark is broken but that the PREDICTION
    was not well formed: a Weil-descended S_4 system cannot distinguish a curve from
    its quadratic twist, so "every SAT answer is a decomposition" had no room for the
    truth. That is a design defect in the hypothesis, and a hypothesis with a design
    defect in its most confident prediction is weakened even when the instrument
    survives. Second, and more consequentially, the relabelling control failed. P6 was
    the design's only claim about MECHANISM -- that WDSat's advantage is a property of
    the descended structure rather than of size -- and the control shows the
    structured-versus-null gap is reproduced to within a factor of two by renaming
    variables in the structured instance alone. The gap is real; the attribution is not
    available from this design. Reporting P6 as "null objects are slower where they
    finish" is what the evidence supports, and the plan pre-committed to exactly that
    consequence before the control ran, which is the whole reason it was written down
    first. Read the other way, the same measurement is the round's strongest positive
    result: it reaches the branching-order conclusion by a route with no `-g` flag in
    it, at 135x, against P3b's censored 50-1843x through the flag, and WDSat's
    branching order is literally its index order in source. So the campaign loses an
    attribution and gains a sharper probe. What it also gains is a Groebner column
    converted from an open question into a specified repair: the Macaulay2 abort is an
    address-space artifact, every generated script additionally carries a parse error
    that would have zeroed the column at any memory limit, and two engines complete the
    n15l5-1-S basis inside the contracted budget and agree on the answer. That last
    fact is the single most useful thing to come out of the round, because the whole
    point of the boundary table is a measured Groebner column and this says it is
    reachable on this host today.
  next_actions:
    - >-
      RANKED FIRST. Repair the three instrument defects against the NEXT run, as one
      scoped executor task, because they are the only reason two of six columns are
      empty: (a) convert.py's `gens_` line, a two-character fix that currently zeroes
      the Macaulay2 column at any memory limit (O-4); (b) replace RLIMIT_AS with an RSS
      watchdog at >= 8 GiB per child, and record both the kind and the value, since the
      review shows an equivalent 6 GiB RSS cap would also kill the row honestly (O-3);
      (c) summary.py's three defects -- the P3c loop-variable leak, P5's Groebner clause
      guarded on a key present on 0 of 504 rows, and P6's conjunction dropping an
      unevaluable cell (O-8). Also fix bench.py's version probe to pass stdin=DEVNULL so
      a run can name its own Singular (O-17c), and emit `stats` for CaDiCaL and MiniSat
      (O-17b). None of this is a research question; all of it gates the next row.
    - >-
      RANKED SECOND. Design IDEA-20260915-3f1964 -- the exhaustive side-classified V^3
      table -- as the first successor experiment, and design it to INHERIT rather than
      repeat O-2: the reviewer's enumeration already covers all 60 instances, agrees with
      the solvers on 60/60, and classifies 67 roots as 45 all-on-E, 1 all-on-twist and 21
      mixed. What the experiment adds is the table as a committed instrument artifact with
      the side recorded per answer, so P1's successor prediction is checkable mechanically
      and the twist reading is part of the harness rather than a review finding.
    - >-
      RANKED THIRD, and it costs no solver. Settle O-16: the measured decomposable
      fractions predict 5.57 decomposable targets among the 30 shipped U instances and one
      is observed, P(X <= 1) = 0.0148, with the trace-bias control already run and clean.
      Regenerate U targets with the shipped generator at a recorded seed and measure the
      decomposable fraction directly. Until this is settled, every statement about "U
      instances" in this campaign is a statement about 30 specific files, not about
      uniform targets -- which matters because U instances carry the U/S ratios in P5 and
      the structured baseline in P6.
    - >-
      RANKED FOURTH. Separate structure from variable order, which is what O-6 leaves
      open and what P6 was supposed to do. The cheap design: relabel the structured
      instance and then re-sort so the core is contiguous again (if the collapse is
      recovered, order is the whole story); and scramble the NULL object's order the same
      way as a matched control. Extend past one instance, one config and one label --
      O-6's stated limits are the design brief. This is IDEA-20260915-7ef636's territory
      (the 2x2 plus planted-core null) and the control failure is the reason to rank it.
    - >-
      RANKED FIFTH. Build the generic-baseline column of RQ-ICPERF-94c86e by MEASURING
      rho and BSGS on these groups and this host, not by substituting a formula, and carry
      the Koblitz correction in the implementation. Three things must be stated in the
      column and are now on the record before it is built: the correction against a
      negation-only baseline is sqrt(n) and not sqrt(2n) (O-12); the baseline must use r
      and not #E, since at n = 15 the group order 32494 = 2*7*11*211 is fully smooth and
      the substitution overstates rho by 12.4x, more than double the Koblitz factor
      (O-14a); and at n = 15 there are only ~7 equivalence classes, so no asymptotic
      constant means anything there (O-14b). n = 17 and 19 are the only usable cells for
      a constant, at 1929 and 6909 classes.
    - >-
      RANKED LAST, a bookkeeping item. Exclude or flag n15l5-8-S in every median: its
      target lies inside the subspace V and it has 32 roots where every other instance has
      one, so a solver on it is solving an easier problem (O-17a). The n15l5 S cell's
      numbers in both runs include it and are not recomputed here.
  evidence_refs: [EV-ICPERF-390707]
  citations:
    - claim: >-
        The contract's six predictions, six falsification conditions, interpretation
        limits and the Coordinator prior quoted in the review plan are as stated.
      source: experiments/EXP-ICPERF-66fd51/specification.yaml
      provenance: internal
      verified_by: coordinator (read in full when writing REVIEW-ICPERF-20260913-66fd51 and its two addenda)
    - claim: >-
        The joint verdicts, numbers and deviations for V1, V3, V4, V5, V6 and
        proves-too-much object 1 are as recorded in EV-ICPERF-390707.
      source: coordination/review/icperf-20260913-66fd51/TASK-20260913-6c5729/report.md
      provenance: internal
      verified_by: coordinator (read in full before composition)
    - claim: >-
        The joint verdict, numbers and deviations for V2 and the relabelling control's
