      source: coordination/review/icperf-20260913-66fd51/TASK-20260915-195b0c/report.md
      provenance: internal
      verified_by: coordinator (read in full before composition)
    - claim: >-
        The benchmark curve is EllipticCurve(K,[1,1,0,0,1]), i.e. y^2 + xy = x^3 + x^2 + 1
        with every coefficient in F_2, and the "U" label is assigned to a uniformly random
        target with no unsatisfiability check.
      source: inputs/TRIMOSKA-ECICB-2024/upstream/find_points.sage
      provenance: internal
      verified_by: coordinator (read at source before writing addendum V6) and TASK-20260913-6c5729 (independently, for V6)
    - claim: >-
        WDSat's default branching sequence is the ANF's variable index order, statically,
        with no dynamic decision heuristic.
      source: inputs/TRIMOSKA-WDSAT-2024/upstream/src/wdsat.c
      provenance: internal
      verified_by: TASK-20260915-195b0c (read at source for the relabelling control's mechanism)
    - claim: >-
        van Oorschot-Wiener's own parallel-rho constant is sqrt(pi/2) on sqrt(p) and their
        paper contains no negation map and no 0.886 constant.
      source: knowledge/literature/KN-LIT-73f7e1.md
      provenance: retrieved
      verified_by: coordinator (inputs/VOW-1996-PCS/ retrieved and read at source, 2026-09-15)
  citations_note: >-
    No external source is cited from recollection. The 0.886 = sqrt(pi/4) constant that
    V6's reduced baseline rows use is `recalled` in this program -- KN-LIT-73f7e1
    attributes it to Wiener-Zuccherato 1998 and GLV 2000, neither of which any agent here
    has opened -- and the reviewer said so rather than presenting it as read. It is not
    load-bearing for any verdict in this decision, because the run reports no baseline
    (O-13) and the correction FACTOR sqrt(n) is a ratio in which the constant cancels.
  limitations:
    - NOTHING IN THIS DECISION IS A STATEMENT ABOUT THE SECURITY OF ANY CURVE AT ANY PARAMETER, IN EITHER DIRECTION.
    - >-
      NOTHING HERE COMPARES INDEX CALCULUS TO ANY GENERIC ATTACK. Both runs report no rho,
      BSGS or generic column at all (O-13), so no such comparison exists to be made, and
