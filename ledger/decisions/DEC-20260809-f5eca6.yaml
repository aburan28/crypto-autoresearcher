coordinator_decision:
  id: DEC-20260809-f5eca6
  goal_id: GOAL-SSI-001
  batch_id: BATCH-726c16
  recorded_by_task: TASK-20260809-8f7603
  archived_by: TASK-20260809-8f7603
  context: >-
    BATCH-726c16 opened an additive v8 successor to EXP-SSI-e29417 after the
    prior v7 Validator and Red Team found non-canonical physical contracts.
    Fresh independent Validator and Red Team sessions reviewed the v8
    snapshot. Neither executed an experiment or diagnostic. The queue's
    mistyped snapshot object was corrected as mutable operational metadata in
    33daedb89; the immutable snapshot receipt was not rewritten.
  decision: refine
  decision_scope: >-
    Retain corrected EXP-SSI-16649a as a materially improved but still incomplete design
    candidate and open an additive v9 physical-contract repair. This decision
    does not freeze the contract, authorize execution, change hypothesis or
    experiment status, or make any SSI, SQIsign, attack, security, novelty, or
    exponent claim.
  target_ids: [IDEA-20260806-9c2f80, EXP-SSI-e29417, EXP-SSI-16649a, GOAL-SSI-001]
  evidence_ids: [EV-SSI-a5f9a7]
  review_ids: [VAL-20260809-d2b66e, RT-20260809-5ef381]
  review_task_ids: [TASK-20260809-d2b66e, TASK-20260809-5ef381]
  snapshot_commit: c19deb2206d548b2192cfe33d67ba56559f48d37
  queue_binding_commit: 33daedb89
  rationale:
    design_progress: >-
      V8 materially improves the active-schema boundary and makes the pending
      incumbent gate explicit. It also attempts one helper, owner manifest,
      target index, global integer inventory, finite builder, event table,
      certificate, HNF/output path, replay, null, pair, and synthetic contract.
      These are design improvements only.
    independent_validation: >-
      Validator VAL-20260809-d2b66e returned incomplete with
      DISSENT_ON_FREEZE_AND_BYTE_RECOMPUTABILITY. It verified the namespace and
      no-execution boundary but found the 377-byte versus 96-byte helper
      contradiction, incomplete derived bounds, query wiring, finite grammar,
      FOE/memory accounting, certificate/output, and controls.
    independent_red_team: >-
      Red Team RT-20260809-5ef381 returned DISSENT_ON_BYTE_RECOMPUTABILITY_FREEZE_AND_EXECUTION_READINESS.
      It independently reproduced the helper contradiction and found frame
      ambiguity, fixed-advice leakage, query/index omission, incomplete signed
      encodings, finite terminals, FOE double counting, memory, certificate,
      HNF/output, replay/null, C-pair, and synthetic defects.
    provenance_correction: >-
      The snapshot commit actually reachable and reviewed is
      c19deb2206d548b2192cfe33d67ba56559f48d37, parent
      6791c10eb92c3610ffe610e902f52a26ca74b44e. The earlier queue typo was
      corrected in 33daedb89. The review reports retain the original mismatch
      as a truthful provenance caveat rather than silently normalizing it.
    execution_authorization:
      granted: false
      reason: >-
        V8 is not byte-recomputable: the helper slot width contradicts its
        fields, the universal frame and local layouts are ambiguous, derived
        bounds and finite records are incomplete, and the FOE/memory,
        certificate/output, and controls are not closed. The incumbent is still
        pending and no execution task may be opened.
    claim_boundary: >-
      No measurement, run, attack, security, exponent, novelty, hypothesis
      transition, or goal completion follows from either review.
  official_research_state_changed: false
  hypothesis_status_transition: none
  experiment_status_transition:
    - id: EXP-SSI-16649a
      from: review_required
      to: review_required
      note: >-
        The v8 successor remains review_required, unfrozen,
        execution_authorized:false, evidence_eligible:false, and approved_by
        null. EXP-SSI-e29417 and all earlier predecessors remain immutable.
  asymptotic_promotion_gates:
    gate_1_proof_decomposition: open
    gate_2_numbered_heuristics: open
    gate_3_concrete_cost_table: open
    gate_4_independent_review_and_red_team: >-
      Completed only as an execution-blocking design review; all scientific
      promotion gates remain open.
  next_actions:
    - >-
      Open an additive v9 successor that makes the universal frame the sole
      active grammar, gives C-HELPER one physical slot/payload layout, totalizes
      capacity, and binds factor/matrix bytes to the helper digest.
    - >-
      Bind fixed advice before target selection and close the owner manifest,
      target manifest, selection-code map, query-key domain, record widths,
      pointer ranges, and all derived finite inequalities.
    - >-
      Close signed/biguint grammars, finite request/record/terminal/padding and
      restart semantics, complete event payloads, hash/byte costs, setup/access
      sums, live memory ranges, EDGE-CERT authenticity, HNF/output, replay/null,
      C-pair, and synthetic rational bytes.
    - >-
      Obtain a separately archived independently verified matched
      INCUMBENT-FOE-v1 measurement before any freeze, comparison, or break-even
      arithmetic. Keep all SSI experiments unapproved, unfrozen, and unexecuted.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This batch measured nothing and promotes no technique, theorem, attack,
      exponent, security conclusion, or knowledge item.
  claim_ceiling: >-
    The strongest true statement is that corrected EXP-SSI-16649a materially improves the
    v7 design intent but remains physically inconsistent, execution-unauthorized,
    and underdefined. This is not evidence about SSI hardness or deployed
    security.
  decided_by:
    task: TASK-20260809-8f7603
    role: coordinator
    policy: coordinator-orchestration-code
  decided_at: '2026-08-09'
