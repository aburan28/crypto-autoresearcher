      2^{58.1}. The weight-13 pattern count is strictly above 2^71. The
      weight-12 count is strictly below 2^67, so it does not clear
      2^{70.2}.
    - >-
      origin/main was already contained in HEAD. origin/main was
      52d0152e17e4fa9a7fa6549e87cc10049f3d3f14.
  evidence_refs:
