  context: >-
    Design tick. IDEA-20260926-89886c is the first open ECC idea and is not
    designed. IDEA-20260915-3476de is next and is not designed.
    IDEA-20260926-b48c9d is the following open idea, and only the pattern
    counts are frozen.
