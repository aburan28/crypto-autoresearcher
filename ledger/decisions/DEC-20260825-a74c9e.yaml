coordinator_decision:
  id: DEC-20260825-a74c9e
  decided_by: coordinator
  decided_at: '2026-08-25'
  goal_id: GOAL-ECQ-2298dc
  question_id: RQ-ECQ-e9b361
  hypothesis_id: null
  hypothesis_id_note: >-
    DELIBERATELY NULL, AS IN DEC-20260824-5246b7 AND DEC-20260824-b7557b. No hypothesis record has
    ever been minted under GOAL-ECQ-2298dc. This decision moves no hypothesis, names none, and must
    not be read as having weakened, rejected or supported one.
  batch_id: BATCH-4d5406
  batch_id_note: >-
    THE FIRST BATCH IDENTIFIER EVER MINTED UNDER THIS GOAL, and its existence is itself a departure
    from DEC-20260824-b7557b's sixth next_action. It is recorded rather than smoothed; see
    procedure_deviation. The batch carries exactly one task, TASK-20260825-169adc, which is a
    Coordinator audit: 0 experiment runs, 0 searches, 0 producer dispatches.

  decision: supersede
  decision_verb_note: >-
    `supersede` is the template enum's verb for replacing a committed record's content with a new
    record under a new id. WHAT IS SUPERSEDED IS ONE ITEM, NOT THE RECORD: lane closure L5 of
    DEC-20260824-b7557b, together with the L5 component of that decision's `obstruction` block and
    the L5 clause of its rationale item R3. DEC-20260824-b7557b IS NOT EDITED, IS NOT WITHDRAWN,
    AND STANDS BYTE-IDENTICAL. Everything in it other than L5 is REAFFIRMED here, explicitly and
    item by item, including its terminal `blocked` status, which this decision does not change.
  goal_status_set: blocked
  goal_status_note: >-
    UNCHANGED, DELIBERATELY, AND ON DEC-20260824-b7557b's OWN STATED RULE. That decision faced the
    identical question for resume condition R3 (the OSCAR step-0 measurement, an internally
    available action) and held `blocked` with the reasoning, verbatim: "An internally available
    action that cannot move C1 does not make the constraint on C1 internal." The Stage-0 protocol
    approved below cannot move C1 (see approved_protocol.ceiling_on_complete_success). The same
    rule therefore yields the same status, and the goal's single `next_action` is preserved
    unchanged.

  headline: >-
    LANE CLOSURE L5 DOES NOT CARRY THE WEIGHT L5 BEARS, AND IS SUPERSEDED. Its central measurement
    applies Silverman specialisation to a certified rank LOWER bound where the argument requires an
    UPPER bound; run against a curve inside this same campaign whose rank this program itself
    certified at >= 31, the identical procedure would report "at most 0". The lane returns to
    UNMEASURED. IT DOES NOT RETURN TO PROMISING, AND NOTHING HERE IS PROGRESS TOWARD RANK 32 OVER
    Q. The terminal status of GOAL-ECQ-2298dc is unaffected: L5's real obstruction turns out to be
    THE SAME AVAILABILITY OBSTRUCTION AS L4 -- the highest explicit geometric rank this program has
    ever retrieved is 15, seventeen short of the objective even at zero descent loss -- so the goal
    stays `blocked`, C1 stays UNMET, and its one next action is unchanged. The campaign recorded
    two obstructions where there is one, and recorded the second one wrongly.

  decision_scope: >-
    THIS DECISION DOES EXACTLY FIVE THINGS. (1) It supersedes lane closure L5 of
    DEC-20260824-b7557b and states, with a derivation artifact, why. (2) It restates L5 at the
    scope its basis actually supports: an unmeasured lane whose binding obstruction is object
    availability, not descent. (3) It REAFFIRMS, unchanged, L1, L2, L3, L4 and L6, the terminal
    `blocked` status, C1 and C2 both UNMET, all seven recorded orchestrating-session errors, and
    all three resume conditions. (4) It approves ONE bounded protocol, Stage 0 only, with an
    explicit budget, and explicitly REFUSES to approve Stage 1 because its cost is not priced. (5)
    It records a procedure deviation of the orchestrating session. IT DISPATCHES NOTHING, RUNS
    NOTHING, WRITES NO EVIDENCE RECORD, MOVES NO HYPOTHESIS, CLAIMS NO RANK, AND CHANGES NO GOAL
    STATUS. It asserts no ECDLP, speedup or asymptotic-complexity claim, so the four asymptotic
    promotion gates of agents/coordinator.md are not engaged.

  context: >-
    GOAL-ECQ-2298dc is `blocked` on DEC-20260824-b7557b, which closed six lanes. On 2026-08-25 the
    user re-invoked the harness. NONE of that decision's three resume conditions is met: no reply
    from the rank-17 model's author exists, no model of generic rank >= 18 over Q(t) has been
    published, and no OSCAR step-0 lattice measurement has been funded or run. The orchestrating
    session therefore dispatched TASK-20260825-169adc, which is NOT a resumption but an audit of
    one closure. L5 was selected on a stated, auditable ground: of the six lanes, five are either
    external-dependency-gated (L4, L6) or rest on exhausted, run-backed sieve measurements (L1,
    L2), or record an admitted absence of a discriminating statistic (L3). L5 alone asserts a
    MEASURED mathematical obstruction over a whole object class, and by DEC-20260824-b7557b's own
    text it does so on: one surface; a model transcribed through the exponent-dropping retrieval
    tool, which the source file says should be re-run against a verified PDF before it is cited; NO
    COMMITTED RUN RECORD for the 31 specialisations behind its number; and a `remaining_open` field
    calling its own central question "the live item". L5 is additionally load-bearing because the
    proven Shioda-Tate ceiling that closes the elliptic-K3 route (17 over Q) is confined to Euler
    characteristic 2, while at characteristic d the bound is rank MW <= 10d - 2 -- 38 at d = 4 --
    so generic rank 32 over Q(t) is NOT excluded by Shioda-Tate at d >= 4, and the campaign's own
    scoping input calls that object class one "whose descent behaviour is UNSTUDIED HERE."

  recorded_prior_and_what_happened_to_it:
    prior_as_dispatched: >-
      RECORDED IN THE HANDOFF BEFORE THE WORK, AND REPEATED HERE VERBATIM IN SUBSTANCE SO THE
      OUTCOME CAN BE READ AGAINST IT: "The honest prior is that the descent gap IS generic -- that
      is what Galois descent theory predicts and what Shioda's degree-829,440 example illustrates.
      THE EXPECTED OUTCOME OF THIS AUDIT IS THAT L5 IS REAFFIRMED."
    outcome_against_the_prior: >-
      THE PRIOR IS PARTLY OVERTURNED AND PARTLY UPHELD, AND THE SPLIT IS THE RESULT. UPHELD: the
      DIRECTION of the effect. Galois descent does cut arithmetic rank below geometric rank, the
      theory does predict it, and Shioda's degree-829,440 example is a real instance. NOTHING HERE
      DISPUTES THAT. OVERTURNED: that the recorded measurement establishes it, and that the gap is
      generic. The measurement is invalid in the direction of its bound (see refutation_artifact),
      and genericity is contradicted by the campaign's own central object -- the rank-17 elliptic
      K3, whose descent gap on the campaign's own reading is 0 or 1, not total. A prior that
      predicts an effect is not a licence to accept an invalid measurement of it, and the harness's
      own review contract states that a prior the review overturns is among the most valuable
      results available to this program precisely because it was written down first.
    what_this_coordinator_will_not_do_with_that: >-
      REOPENING IS NOT THE SUCCESSFUL RESULT AND IS NOT TREATED AS ONE. A reopened lane with no
      object in it is worth less than a closed lane, not more. This decision therefore spends most
      of its length narrowing what the reopening reaches, and its net effect on the campaign's
      forward position is ZERO: same status, same next action, same unmet criteria.

  rationale:

  - id: A1-THE-BOUND-RUNS-THE-WRONG-WAY
    statement: >-
      THE DECISIVE DEFECT, AND IT IS A DERIVATION, NOT AN OPINION. Silverman specialisation gives
      rank E_t(Q) >= rank E(Q(t)) for all but finitely many t. To bound the generic rank ABOVE, that
      inequality must be fed a certified UPPER bound on rank E_t(Q); fed a certified LOWER bound it
      yields nothing at all, because both quantities then sit below the same unbounded number. The
      L5 measurement produced CERTIFIED LOWER BOUNDS -- its own words, and the only kind of number
      this campaign's instrument can emit, since that instrument exhibits points and certifies their
      independence by F_l-ranks of reduction maps with a torsion bound, and contains no descent, no
      Selmer computation and no analytic input. min over t of a lower bound is not an upper bound on
      anything. DEC-20260824-b7557b's own hedge -- "The 0 is an upper bound on the generic rank read
      off a 31-point sample" -- is the error rather than a caveat on it.
  - id: A2-THE-PROVES-TOO-MUCH-CONTROL-IS-RUN-BACKED-AND-SITS-INSIDE-THIS-CAMPAIGN
    statement: >-
      THE SAME PROCEDURE, APPLIED TO A CURVE THIS PROGRAM ITSELF CERTIFIED AT RANK >= 31, WOULD
      REPORT "AT MOST 0". RUN-ECQ-f5af06-v2-A-certify certified 31 jointly independent points on
      ICARM no. 302 in exact arithmetic. Those generators have x-numerators of about 33 decimal
      digits. The only x-coordinate box this campaign ever froze reaches 8 decimal digits and was
      exhausted at 95 899 629 / 95 899 629 = 100 percent with 0 rank-increasing hits
      (RUN-ECQ-f5af06-v2-B-extension). Every one of the 31 generators lies outside that box by about
      25 decimal orders of magnitude, so a from-scratch box-search-and-certify on no. 302 CANNOT
      certify above 0. The gap between the instrument's output and the truth is AT LEAST 31 on a
      curve inside this campaign. This is a counterexample to the INFERENCE RULE, backed by
      committed runs -- not a counterexample to L5's conclusion, which may still be true and is
      simply unsupported.
  - id: A3-THE-SEARCH-BOUND-IS-NOWHERE-RECORDED-SO-THE-NULL-IS-UNINTERPRETABLE
    statement: >-
      DEC-20260824-b7557b states there is NO COMMITTED RUN RECORD for the 31 specialisations. The
      consequence is stronger than "weakly evidenced": the x-numerator bound, the denominators
      searched, the prime set, the torsion bound and the per-t timings are absent from committed
      state, so the measurement's discriminating power -- the chance that a generator lay inside
      whatever region was inspected -- CANNOT BE FORMED AT ALL. A null search result whose search
      bound is not recorded is uninterpretable in principle, not merely in this instance. Recorded
      as an illustration and NOT as a measurement: the transcribed model's coefficients have degree
      8 in t, so a generic generator of x-degree 4 to 8 would specialise at t = 25 to a 12-digit
      x-numerator, already past the 8-digit reach of the only box this campaign froze.
  - id: A4-THE-MODEL-FAILS-THIS-CAMPAIGN-S-OWN-ADMISSIBILITY-RULE
    statement: >-
      The campaign derived and recorded a selection criterion: "a paper printing model AND
      generators is safely transcribable; a paper printing model only is not." Its own retrieval
      file records of the Kloosterman surface: "No explicit generators." The model was transcribed
      through tooling the same file documents as silently dropping exponents, and the file states
      the measurement "should be re-run against a verified PDF before it is cited." IT WAS CITED.
      The campaign's own rule, applied to the campaign's own artifact, excludes this model from
      transcription-safe use. That is not a technicality: the rule exists because a dropped exponent
      changes the surface, and a rank measured on the wrong surface measures nothing.
  - id: A5-THE-SCOPE-EXCEEDS-THE-BASIS-AND-THE-SAMPLED-OBJECT-COULD-NOT-CARRY-ITS-OWN-LANE
    statement: >-
      One surface supports a class-level assertion -- "this is why 'find a surface of high geometric
      rank' is not a route to 32". agents/coordinator.md's closure gate names exactly this failure
      and calls it the more expensive one, "because it closes a lane for every campaign, not just
      this one." Independently: the sampled surface has stated GEOMETRIC rank 15. Under ZERO descent
      loss it delivers 15, seventeen short of the objective. THE ONE OBJECT MEASURED COULD NOT HAVE
      CARRIED THE LANE IT WAS USED TO CLOSE, in either direction, so its outcome was uninformative
      about the lane before any arithmetic was done.
  - id: A6-GENERICITY-IS-CONTRADICTED-BY-THE-CAMPAIGN-S-OWN-CENTRAL-OBJECT
    statement: >-
      L5 asserts the gap is "not small -- it is total". THE RANK-17 ELLIPTIC K3 FIBRATION, the
      vehicle of the entire published record ladder and the object this whole campaign chased, is a
      counterexample: on the campaign's own recorded reading (R = 0, NS = U + MWL, rank NS >= 19,
      arithmetic MW rank over Q(t) equal to 17) its geometric MW rank is 17 or 18, so its descent
      gap is 0 or 1. Mestre/Kihara rank 14 and Nagao rank 13 are likewise ARITHMETIC generic ranks
      over Q(t), each on a surface of at least that geometric rank. Shioda's degree-829,440 example
      is a genuine instance of the obstruction at the opposite extreme, but it is a retrieved
      literature statement about one atypical highly symmetric object, not a measurement made here.
      ONE EXTREME INSTANCE PLUS ONE DEFECTIVE INSTANCE DO NOT ESTABLISH A DISTRIBUTION. The honest
      statement the evidence supports is that the gap is OBJECT-DEPENDENT and ranges from 0 to
      total -- which is exactly the reversal DEC-20260824-b7557b already records in its own
      resource_check ("the correct object is NS(X_Qbar) AS A GALOIS MODULE"; a rational non-CM point
      on a moduli curve "is what buys that triviality"). A decision cannot coherently hold both that
      the gap is generic and that a known mechanism selects objects where it vanishes.
  - id: A7-AND-YET-THE-TERMINAL-STATUS-IS-UNTOUCHED-BECAUSE-L5-S-REAL-OBSTRUCTION-IS-L4-S
    statement: >-
      THIS IS THE FINDING THAT KEEPS THE SUPERSESSION FROM BEING A REOPENING. Strip the invalid
      descent measurement out of L5 and ask what actually blocks the lane. The answer is OBJECT
      AVAILABILITY, identical in kind to L4 and to rationale R3 of DEC-20260824-b7557b: the highest
      explicit geometric rank this program has ever retrieved is 15, and it holds NO verified
      explicit family over Q(t) of any rank -- Kihara 14 paywalled and unread, Mestre 14 never
      retrieved, Nagao 13 with contradictory access and mangled exponents, Elkies 15-18 unpublished.
      The surfaces where the question would bite, Euler characteristic d >= 4 with rank MW <= 10d - 2
      = 38, are not in this program's hands and no route to obtaining one is priced. So the campaign
      recorded TWO obstructions where there is ONE, and recorded the second one wrongly. Correcting
      it changes the campaign's forward position by nothing: the maximum over lanes of rank
      delivered on complete success stays 17 (L6), the obstruction value stays -15, C1 stays unmet,
      and the goal stays `blocked`.
  - id: A8-THE-MEASUREMENT-HAD-NO-CONTROL-OF-ANY-KIND-AND-THE-CLOSURE-STANDARD-NAMES-THAT
    statement: >-
      RECORDED SEPARATELY FROM A1 BECAUSE IT WOULD BIND EVEN IF A1 WERE WRONG.
      docs/inventor-protocol.md section 3, "Controls before belief", requires that any apparent
      signal be treated as an artifact until the IDENTICAL MEASUREMENT has been run against a null
      object of the same shape, and AGENTS.md's review architecture adds the proves-too-much control:
      "the argument is run against objects for which its conclusion is KNOWN FALSE". THE L5
      MEASUREMENT HAS NEITHER. No null object was measured; no surface of known positive arithmetic
      rank over Q(t) was put through the same 31-specialisation procedure to check that the procedure
      can see a rank that is actually there. Had one been -- Nagao's rank-13 or Mestre's rank-14
      family, both named in this campaign's own retrieval as substitutes -- the direction error at A1
      would have surfaced immediately as a controlled null. SEPARATELY, section 4 of the same
      protocol requires a closure's obstruction to name "the runs it is read from"; L5's `basis`
      names an input document, and DEC-20260824-b7557b's own obstruction.measured_by_limitation
      states that the listed run ids cover the L1 and L2 components only. A closure whose obstruction
      cites no run does not meet the standard agents/coordinator.md's closure gate makes checkable.
  - id: A9-WHAT-A-CORRECT-CLOSURE-OF-L5-WOULD-COST-IS-NOW-PRICED-AT-STAGE-0-ONLY
    statement: >-
      Refusing to close on evidence that supports closing is premature closure's mirror image and
      costs the program the forward guidance a closure carries. So this decision does not leave L5
      dangling: it specifies and approves the cheapest measurement that could make L5 a MEASURED
      closure with committed run records, at a budget anchored to a measured comparable from this
      campaign's own producer, with a positive control of exactly the kind the original measurement
      lacked and an explicit prohibition on the point search that produced the defect. IT APPROVES
      STAGE 0 ONLY. Stage 1's dominant cost is unknown until Stage 0 reports, the only estimate
      available for it is an orchestrating-session guess with no run record, and this Coordinator is
      not authorised to approve a protocol whose cost it has not priced.

  superseded_item:
    supersedes_record: DEC-20260824-b7557b
    supersedes_scope:
    - lane_closures.items[L5] in full (obstruction, quantity, value, scope, basis, basis_limitation,
      remaining_open)
    - the L5 component of obstruction.value ("L5 measured arithmetic rank 0 over Q(t) against
      geometric 15 (deficit -32, bounded above by the minimum of a 31-point specialisation sample)")
    - the L5 clause of rationale R3 ("Kloosterman's geometric rank 15 was MEASURED at arithmetic
      rank 0 over Q(t) and is dead as a vehicle (L5)")
    does_not_supersede: >-
      EVERYTHING ELSE, EXPLICITLY AND ITEM BY ITEM: lane closures L1, L2, L3, L4 and L6 with their
      obstructions, quantities, values, scopes and stated limitations; rationale items R1, R2, R4,
      R5 and R6 (R3 only in its L5 clause); the terminal goal status `blocked` and every clause of
      status_choice; the headline that the objective was NOT met; c1_status and c2_status, both
      UNMET; all seven orchestrating_session_errors E1-E7 and the statement that the list is not
      certified complete; the obstruction's statement, quantity, value of -15 units, scope and
      resource_check; all three resume conditions R1, R2 and R3 with their stated ceilings; the
      declined_action on Kihara and the decision not to circumvent an access control; every
      limitation; the three requested knowledge entries; and what_this_decision_does_not_do in full.
    immutability_statement: >-
      DEC-20260824-b7557b IS NOT EDITED BY THIS DECISION AND MUST NOT BE. It remains committed and
      byte-identical, and a reader encountering L5 there must be routed here by this record rather
      than by any alteration of that one. Nor are the immutable artifacts touched: the v1 contract,
      the v2 overlay PA-ECQ-f5af06-v2-triage-gate-sign, every RUN-ECQ-f5af06-* record and
      DEC-20260824-5246b7 all stand unchanged.

  l5_restated_at_the_scope_its_basis_supports:
    lane: Substitute a published surface of high GEOMETRIC rank
    status: OPEN AND UNMEASURED. Not closed, and not promising.
    what_is_actually_established: >-
      (i) Galois descent can reduce arithmetic Mordell-Weil rank over Q(t) below geometric rank over
      Qbar(t), by theory and by the retrieved literature statement that Shioda's rank-68 surface has
      its Mordell-Weil group defined over a field of degree 829 440. (ii) The size of that reduction
      is OBJECT-DEPENDENT and observed across this program's own citation set to range from 0 or 1
      (the rank-17 elliptic K3) to total (Shioda's extreme). (iii) NOTHING is established about its
      distribution, its typical value, or its behaviour on elliptic surfaces of Euler characteristic
      >= 3, which is the class where Shioda-Tate would permit rank 32.
    binding_obstruction_after_correction: >-
      OBJECT AVAILABILITY, the same obstruction as L4. Quantity: the maximum stated GEOMETRIC
      Mordell-Weil rank over any explicit Weierstrass model over Q that this program actually holds.
      Value: 15 (Kloosterman arXiv:math/0502439 Thm 1.2, as transcribed and NOT admissible under the
      campaign's own transcription rule; the highest ADMISSIBLE model this program holds carries a
      published ARITHMETIC generic rank of 9, Elkies-Klagsbrun arXiv:2003.00077). Deficit against 32
      at zero descent loss: -17, and -23 on the admissible model. Scope: the models retrieved by
      this campaign as listed in its two committed input documents; claimed nowhere wider. This
      obstruction is NOT independently measured here either -- it is a count over a retrieval, and it
      is recorded as such.
    what_would_change_it: >-
      An explicit Weierstrass model over Q, printing its own generators, of stated geometric
      Mordell-Weil rank >= 32 -- necessarily Euler characteristic d >= 4, since 10d - 2 >= 32 forces
      d >= 4 -- entering this program's hands. Nothing in the retrieved literature offers one, and no
      route to obtaining one is priced.

  refutation_artifact:
    proof_status: derivation
    proof_refs:
    - coordination/goals/GOAL-ECQ-2298dc/batches/BATCH-4d5406/tasks/TASK-20260825-169adc/DERIVATION-L5-bound-direction.md
    basis_note: >-
      SOUGHT IN THE ORDER agents/coordinator.md RESPONSIBILITY 12 AND docs/claims-and-verification.md
      REQUIRE, AND THE ACHIEVED TIER IS DECLARED RATHER THAN IMPLIED. A COUNTEREXAMPLE CERTIFICATE
      to L5's conclusion was sought and is NOT available: producing one would require computing the
      arithmetic rank of the Kloosterman surface over Q(t), which is precisely the measurement this
      decision declines to authorise unpriced. What IS available, and is archived, is a DERIVATION
      NOTE -- a self-contained argument that the bound runs the wrong way -- strengthened by a
      proves-too-much control backed by committed run records (RUN-ECQ-f5af06-v2-A-certify,
      RUN-ECQ-f5af06-v2-B-extension). That control is a counterexample certificate to the INFERENCE
      RULE, which is the object actually being refuted. Nothing here is `empirical_only` and nothing
      is machine-verified. The artifact is archived in the snapshot commit that precedes the ledger
      commit carrying this decision; a reader who finds this decision without that file should treat
      the supersession as unarchived.
    what_it_does_not_establish: >-
      IT DOES NOT ESTABLISH THAT THE KLOOSTERMAN SURFACE HAS POSITIVE ARITHMETIC RANK OVER Q(t). It
      does not establish that any surface of high geometric rank has high arithmetic rank. It
      refutes an inference, and an unsupported conclusion is not thereby a false one.

  reaffirmed_without_change:
    preamble: >-
      LISTED EXPLICITLY BECAUSE A SUPERSESSION THAT LEAVES THE REST TO INFERENCE INVITES A LATER
      READER TO TREAT THE WHOLE RECORD AS SHAKEN. It is not. Each item below was re-read in this
      session and is reaffirmed.
    items:
    - id: RA1
      item: Terminal goal status `blocked`, and every clause of DEC-20260824-b7557b status_choice
      why: >-
        The status rests on the decisive closure L6 -- a lane whose ceiling on COMPLETE SUCCESS is
        generic rank 17 over Q(t), a deficit of 15 -- which depends on no run set and on no cost
        estimate, and on the availability obstruction L4. Neither is touched by the L5 correction,
        and A7 shows L5's own corrected obstruction merges into L4's rather than opening anything.
    - id: RA2
      item: L1 and L2, the two exhausted self-contained lanes
      why: >-
        Both are run-backed at 100 percent coverage of frozen regions with 0 hits and maximum
        certified rank lower bound 0, and their obstruction is a stated HEIGHT MISMATCH rather than a
        budget shortfall. Note the consistency this decision insists on: those are LOWER bounds too,
        and DEC-20260824-b7557b uses them correctly -- as evidence that a box was searched and found
        empty, explicitly NOT as evidence that no. 302 has rank exactly 31 ("A miss is consistent
        with the board's 'rank exactly 31' reading AND EQUALLY CONSISTENT WITH THE BOX BEING FAR TOO
        SMALL, and cannot distinguish the two"). L1 states the very principle L5 violates. The defect
        is local to L5.
    - id: RA3
      item: L3 (no discriminating statistic) and L4 (the model was never published)
      why: >-
        L3 records an admitted absence and claims nothing beyond it. L4 is a bounded negative over
        five named sources, robust to the exponent-dropping hazard in a way coefficient strings are
        not, and it carries the correct caveat that absence of a search result is not evidence of
        non-existence.
    - id: RA4
      item: L6, the decisive closure
      why: >-
        Its ceiling argument is independent of every cost figure and of every run: a complete success
        delivers generic rank 17 over Q(t), and 17 is not 32. This decision checked the one piece of
        that reasoning that generalises -- the Shioda-Tate arithmetic -- and confirms it, including
        confirming that it is confined to Euler characteristic 2 (see limitations).
    - id: RA5
      item: C1 UNMET, C2 UNMET, and the headline that the objective was not met
      why: >-
        Unchanged and not weakened by anything here. No curve, no point, no family and no unit of
        rank belonging to this program was produced by this task or by this campaign.
    - id: RA6
      item: Errors E1-E7 and the statement that the list is not certified complete
      why: >-
        All stand as recorded, attributed to the orchestrating session and not to the agents that
        caught them. This decision adds an eighth deviation of its own dispatch, below.
    - id: RA7
      item: Resume conditions R1, R2 and R3 with their stated ceilings, and the declined action on Kihara
      why: >-
        None is met, none is weakened, and the decision not to circumvent a paywall's access control
        stands as a deliberate choice rather than a gap.

  approved_protocol:
    id_note: >-
      NO EXP-* IDENTIFIER IS MINTED HERE AND NONE MAY BE INFERRED. This is an APPROVED PROTOCOL, not
      a frozen contract. Before any producer is dispatched against it, an EXP-* record must be minted
      with tools/allocate_id.py, confirmed with --check, authored, and COMMITTED -- which is
      DEC-20260823-ee9162 next action N1(h) verbatim ("AN EXP-* CONTRACT BEFORE ANY PRODUCER IS
      DISPATCHED"), a standing dispatch blocker that DEC-20260824-b7557b E1 records as already
      violated twice in this lineage and that this decision does not close.
    approval_status: >-
      STAGE 0 IS APPROVED. STAGE 1 IS EXPLICITLY NOT APPROVED. Approval is a standing authorisation
      with a budget; DISPATCH is a separate act and is NOT performed by this decision (see
      dispatch_gate).
    uncertainty_reduced: >-
      Whether the geometric-to-arithmetic Mordell-Weil descent gap over Q(t) is generic, and whether
      any object in the class L5 names is even available to this program. Both are currently
      unmeasured; L5 asserted the first and never asked the second.
    stage_0:
      approved: true
      name: Admission and fibre census of candidate high-geometric-rank surfaces. NO POINT SEARCH.
      exact_quantity_measured: >-
        For each candidate surface S in a frozen admission set of at most six published models:
        (m1) ADMISSION under CTL-TRANSCRIPTION-IDENTITY -- does the source print generators, and do
        ALL printed generators satisfy the transcribed model IDENTICALLY in exact rational-function
        arithmetic over Q(t)? Emitted as admitted|excluded with the reason;
        (m2) the factorisation over Q of the discriminant Delta(t) of the transcribed model, with
        deg Delta, the number of distinct roots, their fields of definition, and -- where determinable
        exactly by Tate's algorithm on the model as given -- the Kodaira type and component count m_v
        at each place, including the fibre at infinity;
        (m3) chi(S) = deg Delta / 12 for a minimal model, hence the Shioda-Tate ceiling 10*chi - 2,
        reported against the source's STATED geometric rank, with any disagreement reported as a
        disagreement and not reconciled;
        (m4) for each admitted surface printing generators, the rank of the height-pairing Gram
        matrix of those generators over Q(t) -- a certified ARITHMETIC generic-rank LOWER bound,
        labelled `lower` in the manifest and NEVER consumed as an upper bound.
      what_it_deliberately_does_not_measure: >-
        AN UPPER BOUND ON ARITHMETIC RANK. That is Stage 1 and is not approved. Stage 0 emits no
        upper bound of any kind, so no Stage-0 number can be fed to Silverman specialisation in the
        direction that produced the defect this decision corrects.
      controls_blocking_and_preregistered:
      - id: CTL-POSITIVE-CONTROL
        statement: >-
          THE CONTROL THE ORIGINAL L5 MEASUREMENT LACKED, AND THE REASON THIS PROTOCOL IS WORTH
          RUNNING AT ALL. The admission set MUST include at least one surface whose ARITHMETIC
          generic rank over Q(t) is published AND whose generators are printed -- the Elkies-Klagsbrun
          torsion fibration of arXiv:2003.00077, generic rank 9, recorded in this campaign's own
          retrieval as open access with "the object and the method both published and mutually
          consistent". If m4 on that surface returns a rank BELOW its published value, THE INSTRUMENT
          IS BROKEN AND THE ENTIRE RUN SET IS VOID; no other row may be interpreted.
      - id: CTL-NO-POINT-SEARCH
        statement: >-
          The run must contain NO point enumeration and NO specialisation-and-search of any kind. A
          run reporting a null search is OUT OF CONTRACT and must be refused by its executor rather
          than reported. This is a direct structural remedy for A1 through A3.
      - id: CTL-BOUND-DECLARED
        statement: >-
          Any null or absent result must carry the exact bound over which it is null and the size of
          the object it would have had to find. An undeclared bound voids the row.
      - id: CTL-UPPER-VS-LOWER
        statement: >-
          Every rank figure in every manifest must carry an explicit `direction: upper | lower |
          exact` field, and the analysis must refuse any inference consuming a `lower` where an
          `upper` is required. MACHINE-CHECKABLE, and it is the exact defect being remedied.
      - id: CTL-NULL-OBJECT
        statement: >-
          Include one surface of LOW geometric rank with printed generators as a null object. If the
          pipeline reports a high geometric rank or an admission for it, the pipeline is measuring
          something other than what it claims.
      null_result_that_closes_the_lane: >-
        STATED BEFORE THE RUN. If the admission set contains NO surface that both (a) states a
        geometric Mordell-Weil rank >= 32 and (b) prints generators, then L5's object class is
        confirmed EMPTY WITHIN THIS PROGRAM'S REACH, and L5 closes as a MEASURED AVAILABILITY
        obstruction with a committed run record -- correctly named, unlike the closure superseded
        here. THAT IS THE EXPECTED OUTCOME AND IT IS A GOOD ONE: it converts a cited closure into a
        measured one and strengthens the goal's `blocked` status rather than weakening it.
      positive_result_and_what_it_would_and_would_not_license: >-
        An admitted surface with stated geometric rank >= 32 and printed generators would make the
        class MEASURABLE and would route to Stage 1 under a NEW Coordinator decision. IT WOULD NOT BE
        A RANK RESULT, would not be progress toward C1, and would not change any goal status by
        existing.
      budget:
        wall_clock_seconds: 1800
        maximum_runs: 1
        maximum_surfaces: 6
        memory_gb: 2
        max_concurrent_producers: 1
        point_searches_authorised: 0
        network_retrievals_authorised: 0
      budget_basis: >-
        PRICED FROM A MEASURED COMPARABLE IN THIS CAMPAIGN, NOT FROM AN ESTIMATE OF THE NEW WORK,
        AND THE COMPARABLE'S OWN WEAKNESS IS DECLARED. The v2 producer executed a 95 899 629-candidate
        exact-arithmetic enumeration, 24 165 triage scorings and 400 x 1 167 027 reduced-box searches
        in 841.1 s total of 3600 s on this hardware class, with no cap bound anywhere
        (TASK-20260824-02c3e4 report.md; PRODUCER-REPORTED ON AN UNVALIDATED RUN SET, and that caveat
        is carried rather than dropped). Stage 0 performs, per surface, at most about twenty exact
        rational-function identity checks, one integer-polynomial discriminant of degree <= 60 with
        small coefficients and its factorisation over Q, Tate-algorithm type determination at its
        roots, and one Gram-matrix rank over Q. Each of those is milliseconds to seconds at these
        degrees. 1800 s is therefore roughly three orders of magnitude of headroom over the plausible
        cost. IF STAGE 0 BINDS ITS CAP, THAT IS ITSELF THE REPORTABLE FINDING and the run stops
        rather than being extended.
      deliverables:
      - An immutable run record under experiments/<EXP-ID>/runs/ with a schema-complete manifest,
        seeds, and the direction field required by CTL-UPPER-VS-LOWER on every rank figure.
      - An admission table (m1) naming every excluded surface and its exclusion reason.
      - A fibre-census table (m2, m3) with the Shioda-Tate ceiling per surface against the source's
        stated geometric rank.
      - A lower-bound table (m4) on admitted surfaces printing generators.
      - A control report showing CTL-POSITIVE-CONTROL, CTL-NO-POINT-SEARCH, CTL-BOUND-DECLARED,
        CTL-UPPER-VS-LOWER and CTL-NULL-OBJECT each PASS or FAIL explicitly.
      completion_gate:
      - Every one of the five controls reports explicitly, and CTL-POSITIVE-CONTROL PASSES.
      - Every rank figure carries `direction`.
      - Every excluded surface carries its exclusion reason.
      - The run record is committed and accepted by the post-commit verifier before any Coordinator
        interpretation.
    stage_1:
      approved: false
      why_not_approved: >-
        ITS COST IS NOT PRICED AND THIS COORDINATOR IS NOT AUTHORISED TO APPROVE AN UNPRICED
        PROTOCOL. Stage 1 is the part that would produce an UPPER bound on arithmetic rank over Q(t),
        by Galois-invariant Shioda-Tate over Q from the fibre census plus the fields of definition of
        the components, and/or by 2-Selmer bounds at several specialisations used in the correct
        direction. Its dominant costs are an OSCAR installation and 2-descent on models whose
        coefficient sizes are UNKNOWN UNTIL STAGE 0 REPORTS. The only estimate available for it --
        "steps 0, 2 and 3 all fit on this hardware in hours to days" -- is an orchestrating-session
        judgement in a committed input document with NO RUN RECORD, and this decision declines to
        launder it into a budget.
      what_would_unblock_it: >-
        A committed Stage-0 run record reporting the coefficient sizes and fibre censuses, followed
        by a NEW Coordinator decision pricing Stage 1 against them.
    ceiling_on_complete_success: >-
      STATED SO THAT NO DELIVERABLE OF THIS LANE CAN BE PRESENTED AS PROGRESS TOWARD C1. On COMPLETE
      SUCCESS of BOTH stages the lane delivers a measured table of (geometric rank, arithmetic-rank
      upper bound, arithmetic-rank lower bound) over at most six published surfaces, and at best a
      verified explicit family over Q(t) whose arithmetic generic rank is at most the publicly
      available explicit ceiling of 14 (Kihara, paywalled and unread) or 13 (Nagao). IT DOES NOT
      DELIVER RANK 32 OVER Q. It does not deliver generic rank 32 over Q(t). It does not deliver a
      curve, a point, or one unit of rank belonging to this program. Deficit against C1 on complete
      success: AT LEAST -18. The lane's abstract MATHEMATICAL ceiling is higher -- Shioda-Tate permits
      rank MW <= 10d - 2 = 38 at Euler characteristic d = 4, which is why the lane must not be closed
      on a defective measurement -- but this program's REACHABLE ceiling within it is bounded by
      object availability at 15 geometric / 9 admissible arithmetic, and closing that gap is not
      priced by anything in this decision.
    dispatch_gate: >-
      NOT DISPATCHED, AND NOT DISPATCHABLE UNDER GOAL-ECQ-2298dc. That goal's objective is rank >= 32
