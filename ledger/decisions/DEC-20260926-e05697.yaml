coordinator_decision:
  id: DEC-20260926-e05697
  recorded_at: '2026-09-26'
  goal_id: GOAL-SSIQ-001
  question_id: RQ-SSIQ-9702af
  kind: protocol_approval
  mode: design-experiment

  context: >-
    IDEA-20260926-e1b48e (committed 8339062db, draft PR #1447) files a closure:
    under deg, Hom(E, E') for supersingular E, E' / F_{p^2} is a rank-4
    lattice with Gram determinant p^2/16 for every pair, so no rank-4
    Hermite/Minkowski certificate inside a single Hom-module certifies an
    exponent below 1/2, emptying the "rank 4 with det <~ p" option of
    GOAL-SSIQ-001's corrected admissibility criterion (DEC-20260805-2be965)
    in dimension one. The user asked to run ideate -> design -> run -> review
    on this target. This decision specifies H-SSIQ-a9df38, freezes and
    approves EXP-SSIQ-6916e8 v1, and opens executor handoff
    TASK-20260926-7d20e4 (archived_by TASK-20260926-73104c, one run
    RUN-SSIQ-81bd08). No run has been executed.

  decision: approve

  decision_scope: >-
    Approves EXP-SSIQ-6916e8 version 1 for implementation, the derivation
    note, and exactly one run. Does NOT assert the lemma is true, does NOT
    amend GOAL-SSIQ-001 or its lever map, does NOT close lever N5 (only its
    rank-4, dimension-one, single-Hom-module, degree-form branch is under
    test), and authorizes no curve, isogeny or attack construction.

  target_ids:
    - H-SSIQ-a9df38
    - EXP-SSIQ-6916e8
    - IDEA-20260926-e1b48e
    - TASK-20260926-7d20e4
    - RQ-SSIQ-9702af
    - GOAL-SSIQ-001

  authorization: >-
    Standing user authorization in AGENTS.md (ideas and experiments are
    approved once the protocol is complete) plus the user's explicit
    2026-09-26 request to run phases ideate -> design -> run -> review on this
    proposal. This decision is the separate approval act recording protocol
    readiness; no further user confirmation is outstanding.

  protocol_completeness_check:
    result: complete
    fields_verified:
      - hypothesis statement, mechanism, assumptions, predictions, test_boundary, falsification_conditions, interpretation_limits
      - proof_search_map complete (bottleneck, baseline slice + reproduction check, observation-collision search, observable_fiber transform, quantifier order, method ceiling, nearby-object control, five proof obligations with responsibilities)
      - experiment objective, inputs (22 frozen primes, 6 arms with exact counts), conventions (Gram, n(I), R)
      - controls C-TRD, C-NOSCALE, C-NONMAX (must-fail, exact ratios), C-NEAR (rank-3 nearby object, exact p^2/4 and p/4), C-ALG, C-CROSS (two instruments)
      - independent_variables; metrics primary (M-R, M-SUB, M-INDEX) and secondary
      - preregistered_prediction with formula and source; scale_relevance with correspondence stated as cited-not-tested
      - tail_checks; replication (seeds, two instruments)
      - budget (memory 4 GB, 1 worker, 1 run; watchdog 3600 s with machine-protection reason; time/CPU advisory)
      - stopping_rules; invalidation_rules
      - success_criterion and falsification_criterion decidable from metrics, with every non-success non-falsification outcome coded
      - required_artifacts with exact paths; handoff budget fields all non-null; archived_by bound
    defects: []
    proof_oriented_dispatch_gate: >-
      KN-TECH-080 checks pass: bottleneck decision-changing (it empties or
      keeps an admissibility option); baseline (P, Nrd/p) index 1 reproduces
      L1's recorded 1/2; identifiability audit is the collision search over
      targets (A4/A5); quantifier order explicit and witness-free; method
      ceiling and nearby-object control (rank-3 P^0, det p/4, exponent 1/3)
      fixed before any run; interface obligation (Deuring) stated separately.

  status_transitions:
    - record: H-SSIQ-a9df38
      from: proposed
      to: approved
      via: specified
      note: >-
        Record created at approval time: the Coordinator specified the
        hypothesis from IDEA-20260926-e1b48e and approves it paired with the
        frozen contract. Pre-run; not supported.
    - record: EXP-SSIQ-6916e8
      from: draft
      to: approved
      also_set:
        frozen: true
        execution_authorized: true
        approved_by: coordinator
        approval_decision: DEC-20260926-e05697

  rationale:
    - >-
      CHEAP AND DECISION-CHANGING. Seconds-to-minutes of exact arithmetic
      either withdraws the closure (a normalisation error) or leaves a
      derivation-tier artifact that removes one admissibility option from
      GOAL-SSIQ-001's lever map and names the three branches that stay open
      (rank <= 3, other forms, g >= 2). Recording a closed branch is forward
      guidance; leaving it open costs later campaigns a search.
    - >-
      THE CHECK CAN FAIL. The proposal's own point is that a wrong
      normalisation fails loudly. The contract makes that concrete: three
      must-fail controls with exact pre-registered ratios (16, n(I)^4, 64),
      two independent determinant instruments, two independent Nrd
      instruments, and an order construction entirely outside PARI.
    - >-
      THE COMPUTATION IS NOT TAUTOLOGICAL WHERE IT MATTERS. For a maximal order,
      det(Nrd) = p^2/16 is the discriminant criterion plus the factor 1/16, so
      A1 mainly tests PARI's independently computed maximal order and the Gram
      convention. The non-trivial inputs are [O : I] = n(I)^2 with both sides
      measured independently (A4), the rescaling, and the right orders A5 that
      reach other maximal-order types, i.e. other targets E'. The contract says
      this and forbids deriving n(I) from the index.
    - >-
      NOTHING IS OVERCLAIMED. The Deuring isometry is cited and explicitly
      untested; the universal lemma rests on the derivation note (derivation
      tier, pending independent review), not on the 22-prime sample; the
      goal record is not amended by this decision.
    - >-
      DEVIATION FROM THE PROPOSAL'S MINIMAL TEST, RECORDED. The proposal
      named the WISDE/AOV results files as the basis source. They are not
      archived in this repository, so the contract substitutes PARI maximal
      orders plus 440 right orders and lists WISDE as out of scope with a
      revisit route (amendment).
    - >-
      TARGET PROFILE. This is not an exponent-moving result; it is a closure
      that prunes the exponent-targeting search, which is the profile's
      honest-accounting duty (docs/target-result-profile.md). Its cost is
      negligible, so it does not displace exponent-targeting work.

  evidence_refs:
    - ledger/proposals/IDEA-20260926-e1b48e.yaml
    - ledger/hypotheses/H-SSIQ-a9df38.yaml
    - experiments/EXP-SSIQ-6916e8/specification.yaml
    - ledger/goals/GOAL-SSIQ-001/goal.yaml
    - ledger/decisions/DEC-20260805-2be965.yaml
    - inputs/P13-WESOLOWSKI-2026/paper_fulltext.md

  limitations:
    - >-
      Approval asserts protocol readiness, not truth of H-SSIQ-a9df38.
    - >-
      The Deuring interface and the hand-written order formulas (arm A2) rest
      on recalled literature; the run tests A2 formulas for being orders but
      does not test the Deuring isometry.
    - >-
      A single deterministic run is the whole experiment; independent
      re-derivation is deferred to the post-run validator, not yet minted.
    - >-
      No BATCH id was minted for this design; lane bookkeeping, if required,
      is the dispatching session's.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Protocol approval is not evidence; no support or reject_scoped
      transition. A KN-FIND is considered only at evidence review.

  next_actions:
    - >-
      OPERATIVE: the top-level session commits the design package
      (IDEA-20260926-e1b48e already committed; H-SSIQ-a9df38,
      experiments/EXP-SSIQ-6916e8/specification.yaml plus amendments/.gitkeep
      and runs/.gitkeep, TASK-20260926-7d20e4, this decision) by exact path,
      pushes, refreshes PR #1447, then dispatches the executor on
      TASK-20260926-7d20e4 (one run, RUN-SSIQ-81bd08).
    - >-
      After the executor returns: snapshot archive TASK-20260926-73104c of the
      declared artifact_paths, verify the receipt, then dispatch an
      independent validator (review-adversarial, independent session) with a
      blind re-derivation of det(O, Nrd), [O : I] = n(I)^2 and det(P^0,
      Nrd/p) = p/4, and a proves-too-much check against the rank-3 case.
    - >-
      Then /review-evidence EXP-SSIQ-6916e8: evidence record with
      proof_status derivation, proof_refs
      experiments/EXP-SSIQ-6916e8/derivation-note.md, and an obstruction block
      (quantity det(Hom(E, E'), deg) * 16 / p^2, scope rank 4 / single Hom /
      deg / g = 1) if the closure is to be adopted into GOAL-SSIQ-001.

  decided_by: coordinator
  decided_at: '2026-09-26'
