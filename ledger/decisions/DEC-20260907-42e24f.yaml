      restatement also restates S2DX. Those acts are
      dominated.
    - >-
      S2G and S2CS do not record occupancy vectors,
      empty-bucket counts before remap, M_eff, or the
      CS-aligned pair-rate vector. S2FL reported only
      the five exact scalars on the one miss cell.
      Those occupancy and CS-ingredient quantities are
      the cheapest new official observation of the
      isolated residual.
    - >-
      The ranked act rebuilds floor(Mx/p) labels from
      the frozen Stage 2 recipe on four cells only:
      the miss, the two same-cell holds, and the
      next-tightest hold. It does not re-run the
      eight-prime ladder.
    - >-
      Any subset fit of a, Stage 5 of EXP-ECDLP-a98ea9,
      the S2FIT W-ratio gate, a rerun of EXP-ECDLP-56ee42,
      approval of EXP-ECDLP-3930b1, CAND-D2-A, D2 closure,
      re-auditing Stage 0 or Stage 1, classifying the miss
      as SMALL-W or LARGE-W, and designing an unrelated
      open ECC idea remain dominated or forbidden.

  ranking:
    selected: >-
      Four-cell occupancy and CS-ingredient audit of
      floor(Mx/p) on S2-P8219 at M=9, 20, and 37 and
      S2-P32779 at M=13. Rebuild labels from the frozen
      Stage 2 recipe. Record q, n_empty_before_remap,
      M_eff, max_q, min_q, dstar, pi_c, max_pi_c, and
      the five exact scalars matched to archived S2G.
      No new eight-prime ladder.
    dominated:
      - consume-only re-partition of the same 168 S2CS rows
      - same-cell three-M slack restatement of S2DX
      - new eight-prime exact-G or aligned-CS measurement
      - re-audit of Stage 0, Stage 1, or Stage 2 aligned CS
      - any proper-subset fit of a
      - Stage 5 of EXP-ECDLP-a98ea9
      - S2FIT P2-versus-sha W-ratio gate
      - classifying the S2-P8219 miss as SMALL-W or LARGE-W
      - rerun of EXP-ECDLP-56ee42
      - approval of EXP-ECDLP-3930b1
      - CAND-D2-A
      - designing an unrelated open ECC idea to keep the loop turning
    sota_delta: >-
      Not a complexity claim. The selected act makes the
      occupancy and CS-ingredient vectors of the isolated
      miss and its three floor controls official. Those
      vectors are absent from S2CS, S2G, S2FL, and S2DX.
    dominated_by: null

