  rationale:
    - >-
      RE-VERIFICATION. DEC-20260727-002 (GOAL-ECDLP-001 BATCH-009 budget
      amendment) and, separately, DEC-20260801-007 / DEC-20260801-008
      (GOAL-ECDLP-001 BATCH-022/023, EXP-SMTH-001 non-execution and
      EXP-EQD-001 replicate verdict) were each read in full. None mentions
      EXP-SEMAEV-002 or H-SEMAEV-002 substantively; the latter two name
      H-SEMAEV-002 only in a `does_not_modify` list. No real approval exists
      under any identifier.
    - >-
      FRESH SCIENTIFIC REVIEW. H-SEMAEV-002 is a computational base-case
      check of an already-derived, normalization-locked induction
      (EV-CRYPTO-009, DEC-20260724-001): it does not introduce a new
      unreviewed claim, it exhaustively verifies a prior derivation's stated
      base cases (m in {3,4}) by direct symbolic computation over F_p. Its
      falsification_conditions are concrete and would report a genuine
      contradiction (a lost box vertex outside the predicted exceptional
      set) rather than merely confirming what was assumed.
    - >-
      CONTROLS. CTRL-SEM-M3-CALIBRATION reproduces known m=3 literature
      identities exactly as a positive control; CTRL-SEM-CROSS-METHOD
      re-derives a sampled subset by an independent, code-path-disjoint
      method (corner evaluation vs. convex hull); CTRL-SEM-PREDICTED-SET
      compares the observed exceptional set against an independently
      computed group-arithmetic prediction, never polynomial vanishing;
      CTRL-SEM-CONSISTENCY-BKK001 cross-checks against an existing recorded
      result and escalates any contradiction to review-breakthrough per
      AGENTS.md rule 12 rather than resolving it silently. This is a
      well-instrumented exhaustive verification, not a bare assertion.
    - >-
      CLAIM-TIER DISCIPLINE. claim_tier is toy; interpretation_limits state
      explicitly that this is not a proof of the all-m theorem and says
      nothing about m >= 5 or crypto scale, and that no sub-rho algorithm is
      claimed regardless of outcome (this is a negative-gate control).
    - >-
      FIT WITH THE GOVERNING GOAL. GOAL-CRYPTO-001 is `active` with an
      unlimited campaign budget. This experiment strengthens (or, on the
      falsification branch, would contradict and escalate) an existing
      recorded negative gate rather than opening a new mechanism-search
      admission, so it does not conflict with the goal's post-BATCH-013 hold
      on new candidate mechanisms. Budget (6300s wall-clock total, 1.75
      CPU-hours, 4 runs, 4GB memory) is modest and bounded.
    - >-
      EXECUTABILITY. Exact primes per m, a deterministic curve-selection
      rule, frozen stopping/invalidation rules, and a complete
      required_artifacts list are all specified; no silent substitution is
      needed by an Executor.
    - >-
      No defect was found in the contract's design, controls, budget, or
      scope beyond the fabricated citation this decision repairs.
  evidence_refs:
