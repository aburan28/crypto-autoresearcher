    - >-
      This decision does not pre-judge the outcome: falsification (a lost
      box vertex, an exceptional-set mismatch, or a contradiction with
      EV-CRYPTO-009/EV-BKK-001) remains fully possible and is, per the
      contract's own stopping rules, escalated rather than resolved silently
