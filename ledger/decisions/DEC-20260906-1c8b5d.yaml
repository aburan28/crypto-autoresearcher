    DEC-20260801-007 and DEC-20260801-008, both read in full: both concern
    GOAL-ECDLP-001's EXP-SMTH-001/EXP-EQD-001 lineage and name H-SEMAEV-002
    ONLY in a `does_not_modify` list confirming they touch nothing about it.
    Neither approves EXP-SEMAEV-002. OPTION A applies: no real prior
    Coordinator approval for EXP-SEMAEV-002 exists anywhere, under any
    citation. This decision re-runs the approval act with a genuine,
    checkable Coordinator review, citing itself.
  decision: approve
  target_ids:
    - EXP-SEMAEV-002
    - H-SEMAEV-002
    - TASK-20260727-010
    - GOAL-CRYPTO-001
    - EV-CRYPTO-009
