          "metrics.primary",
          "preregistered_prediction.formula"
        ],
        "objection": "C_glue is expressly an assembly-stage field-operation quantity with signature, saturation, recovery and other costs outside its polynomial target. The primary ratio and finite opportunity reuse C_glue/C_monolithic while requiring whole-fixture setup/checking, and a separate unit-weight score W is introduced without explicitly assigning it to those C symbols. The stage scope and unit of the decision threshold are therefore ambiguous even though the cost inventory is comprehensive.",
        "required_successor_change": "Define C_assembly and its field-operation polynomial target separately from C_total or W_total for each arm. Give the exact included-stage formula and denominator for each per-D and whole-fixture ratio and the heldout SM strict-work/nonincreasing-memory predicate. Freeze how shared, lower-degree, scalar, saturation, recovery, verification and I/O work is attributed without free reuse; keep CPU/wall descriptive.",
