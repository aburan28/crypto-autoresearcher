        "objection": "Z_J is defined as a submodule of R^r, whereas the stated projection sends core coordinates modulo J, hence lands in (R/J)^r. Quotienting that image by projected E does not define a map to the unquotiented Z_J. The requested degreewise kernel/cokernel consequently has no single specified map. The finite affine membership ideal is inhomogeneous, so reducing modulo it is not a homogeneous degree-preserving map from the primary h-graded slices.",
        "required_successor_change": "Add exact names and diagrams for P_core:Z->Z_J, its reduction to Z_J/JR^r, and the induced map after quotienting the relevant image of E. Declare every kernel/cokernel source and target. Separately freeze a graded construction using homogenized memberships and shifted core modules, or explicitly define a filtered affine comparison plus its strictness/degree-completeness obligations. Do not apply finite affine normal-box counts to h-graded modules.",
        "claim_boundary": "This is a protocol typing/filtration defect. It does not refute the valid quotient/intersection comparison or any ECDLP hypothesis."
      },
      {
        "finding": "P2-F2",
        "decision": "revise",
        "resolution_status": "unresolved",
        "severity": "material_for_Gstar_reproducibility",
        "source_fields": [
          "inputs.definitions.signatures.algorithm",
          "certificates.signature"
        ],
        "objection": "The definition fixes the intrinsic minimum representative by finite feasibility and separately requires actual normal-pair witnesses. It does not fix which normal pair is chosen when several are available, the complete signature-safe reduction/tie-breaking transition, or whether the feasibility-selected representative is identical to an actually produced remainder. Intrinsic necessary-signature counts are well-defined, but these instructions do not yet freeze the actual algorithm-dependent Gstar trace and charged work.",
        "required_successor_change": "Freeze the normal-pair selection, coefficient normalization, reducer and monomial selection, initialization/counting of S and membership elements, and the rule connecting any feasibility-derived canonical representative to the actual remainder. Count only recorded nonzero remainders of actual S-polynomial transitions; keep feasibility outputs and intrinsic necessary signatures separate. Use the stated deterministic Buchberger trace as its own baseline.",
        "claim_boundary": "No mismatch or fabricated trace has been observed; no algorithm has run. The unresolved issue is whether two compliant implementers would execute the same declared trace."
      },
      {
        "finding": "P3-F1",
        "decision": "revise",
        "resolution_status": "unresolved",
        "severity": "material",
        "source_fields": [
          "inputs.finite_panel.null_generation.key",
          "inputs.finite_panel.null_generation.law",
          "inputs.finite_panel.families.Y",
          "inputs.finite_panel.families.W"
        ],
        "objection": "The law fixes rejection sampling but only gives a schematic UTF8 key. It does not specify exact serialization for case and monomial_exponents, the generator index origin, counter origin/encoding, or absent topology/object fields. Y has membership degree d separate from case constant; W has ell rather than cases. There is no explicit rule binding d and ell into distinct scientific keys. Multiple byte encodings satisfy the printed template and yield different coefficients.",
        "required_successor_change": "Publish an additive frozen byte grammar with exact family/case/object tags, inclusion of Y d and W ell, canonical tuple/exponent encoding, integer and index/counter conventions, and raw key test vectors for every family. State explicitly any deliberate common-random-number coupling across panels. Preserve all 414 slots, six draws per applicable source, fixed membership coefficients and rejection/duplicate policy; do not choose a grammar after observing coefficients.",
        "claim_boundary": "This is a reproducibility ambiguity, not a claimed observed hash collision, bias, null failure or omitted fixture."
      },
