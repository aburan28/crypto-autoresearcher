  rationale:
    - >-
      RANK 1, SELECTED. Open a bounded design-repair batch that produces exactly
      one new immutable successor, EXP-ECDLP-d7b3c3, closing all five blocking
      findings, and submit it to a fresh independent design-readiness review.
      This is the action DEC-20260809-d5ff80 authorized verbatim, the action the
      committed BATCH-c3c474 checkpoint names, and the action the reviewer's own
      next_action names. It is also the cheapest route to the next
      decision-changing fact: whether the five defects admit one deterministic,
      byte-canonical, resource-closed, acyclically finalized design at all.
    - >-
      RANK 2, REJECTED. Proceed to an implementation-review or implementation
      batch on EXP-ECDLP-ffa5c3. DEC-20260809-d5ff80 records
      experiment_design_approved false and implementation_review_batch_authorized
      false, and the review report's authorization_boundary refuses
      implementation, execution, run creation, and evidence creation. Building on
      a contract whose primary gap decision has no canonical retained bytes would
      produce artifacts no second session could reproduce.
    - >-
      RANK 3, REJECTED. Repair EXP-ECDLP-ffa5c3 in place. Records are immutable;
      corrections supersede and never overwrite. The reviewer's next_action says
      the same thing explicitly: freeze a new immutable successor rather than
      edit the reviewed record.
    - >-
      RANK 4, REJECTED. Pause the apparatus lane or close it as unproductive.
      The verdict identifies repairable specification defects, not an obstruction
      or a refutation of the apparatus concept, and the reviewer independently
      recomputed the planted arithmetic, seven SHAKE256 fixtures, Type-1 ranks,
      thirteen file geometries, and displayed stage sums without error. Declining
      to continue on the ground that the design keeps failing review would be
      premature closure, which this program treats as a failure mode symmetric
      with overclaiming, and no named obstruction exists to support it.
    - >-
      RANK 5, REJECTED. Open a wider batch that also admits nearby apparatus
      variants or begins heuristic-validation work. Focus discipline caps active
      lanes, the current uncertainty is entirely specification-side, and a second
      lane would neither reduce it nor be reviewable within the same budget.
    - >-
      RECONCILIATION, NOT A CONCLUSION. The goal head's next_action still
      directed freezing EXP-ECDLP-ffa5c3 as an immutable successor design. That
      text predates the independent review; a session resuming GOAL-ECDLP-001
      from goal.yaml alone would have frozen and advanced exactly the contract
      TASK-20260809-923ede refused, on a record already committed as
      review_required. Replacing it with the committed checkpoint's action
      propagates state that is already durable. No new scientific claim, no
      status change, and no reinterpretation of any evidence is asserted by it.
