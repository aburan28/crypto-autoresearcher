# OPENING COORDINATOR DECISION FOR BATCH-314308. IMMUTABLE.
#
# IT APPROVES A BATCH COMPOSITION AND NOTHING ELSE. It approves no experiment,
# enacts no amendment, resolves no reserved item, lifts no prohibition, promotes no
# knowledge and changes no status. EXP-WESOVOW-001 remains `approved` and UNAMENDED
# at version 1; the redraft under attack remains `status: draft`, `in_force: false`,
# `approved_by: null`. GOAL-SSI-001 stays `active`.
#
# THIS BATCH IS NOT THE ENACTING DECISION AND DOES NOT CONTAIN ONE. The reasoning
# for that, and the cost of a seventh deferral, are recorded below under
# why_the_enacting_decision_is_not_in_this_batch rather than left implicit.
coordinator_decision:
  id: DEC-20260906-6a620e
  goal_id: GOAL-SSI-001
  batch_id: BATCH-314308
  id_note: >-
    PRE-ALLOCATED by the dispatching session and stated to have returned
    `OK: well-formed and free across the union` from `python3 tools/allocate_id.py
    --check` immediately before this dispatch, together with the other nine
    identifiers of this batch. RE-CHECKED BY THIS AUTHORING TASK BY DIRECT SEARCH
    ONLY, WHICH IS WEAKER THAN THE TOOL: no file ledger/decisions/DEC-20260906-6a620e.yaml
    existed before this task wrote it, and the token occurs only at its declared
    reservation sites. NO SUBSTITUTION WAS MADE OR NEEDED. The token CONFORMS to the
    grammar and would commit if wrong, which is why `--check` is a hard precondition
    of the commit and not a formality.

  context: >-
    BATCH-60d6b9 closed as `revise` on DEC-20260906-408595 and EV-SSI-804e09 with ZERO
    findings blocking the enactment path - the first time in this campaign that is true
    - and with two structural prerequisites that are NOT findings still standing. The
    first is decisive: THE REDRAFT HAS HAD NO ADVERSARIAL PASS. That round was a
    VALIDATOR review of integrity and controls; an adversarial reading of the redraft AS
    A PROPOSED ACT - what it would do to the contract, whom it binds, what it forecloses
    - has never happened, the reviewer says so itself, and DEC-20260906-408595 NA-1 makes
    it the single next research action. BATCH-314308 is that pass, plus the independent
    review of it, plus the archive that finally performs CF-19 and this campaign's first
    knowledge promotion.

  decision: approve
  decision_scope: batch_composition_and_review_architecture
  decision_scope_statement: >-
    `approve`, AND THE WORD IS NARROW. WHAT IT APPROVES: the composition of BATCH-314308
    - one red-team producer, one snapshot archive, one independent validator review, one
    ledger archive; its four-axis assignment and four review joints; its blind policy;
    its entailed-control objects and their failure signature; its frozen-artifact ruling
    and its one declared exception; its budgets; and the two Coordinator acts dispatched
    to its ledger archive. WHAT IT DOES NOT APPROVE: the redraft, the amendment, any
    experiment, any run, any claim, any status transition, and any outcome of the round
    it opens. OPENING A BATCH IS NOT APPROVING ANYTHING IN IT, and no artifact of this
    batch may cite this decision as authority for an act.

  target_ids:
    - BATCH-314308
    - GOAL-SSI-001
    - RQ-SSI-001
    - TASK-20260906-dc4905
    - TASK-20260906-51fec3
    - TASK-20260906-918585
    - TASK-20260906-8f3ee7

  # =======================================================================
  the_topology_and_what_six_identifiers_bought:
    shape: >-
      FOUR TASKS IN A STRICT SERIAL CHAIN, AND FOR THE FIRST TIME IN THREE BATCHES IT IS
      THE FULL CHAIN THE ARCHIVAL CONTRACT WANTS. TASK-20260906-dc4905 (red-team producer,
      `review_required: TRUE`) -> TASK-20260906-51fec3 (SNAPSHOT ARCHIVE, `kind: snapshot`,
      `binding_mode: commit`, owning the producer, RUNS ALONE) -> TASK-20260906-918585
      (validator, independent session, depends on BOTH) -> TASK-20260906-8f3ee7 (LEDGER
      ARCHIVE, `kind: ledger`, `binding_mode: commit`, owning the review, RUNS ALONE).
    what_four_identifiers_foreclosed: >-
      BATCH-60d6b9 recorded, as a real cost, that FOUR identifiers cannot express this
      shape once a producer sets `review_required: true`, because
      tools/research_dispatch.py `_validate_review_chains` then demands producer ->
      snapshot archive -> review -> ledger archive. It chose the four-task shape with a
      reviewer and NO snapshot-archive task, declared `review_required: false` on two
      genuinely reviewed producers - "TRUE OF THE FLAG AND FALSE OF THE WORLD" in its own
      words - and carried snapshot-before-review in a dispatch_precondition executed by
      the dispatching session. Its `what_a_successor_should_do` says: use the five-task
      shape. THIS BATCH DOES.
    what_six_bought_concretely:
      - >-
        `review_required: true` ON THE PRODUCER IS NOW TRUE OF THE FLAG AND TRUE OF THE
        WORLD, and the declaration BATCH-60d6b9 had to make is gone.
      - >-
        THE PRE-REVIEW COMMIT IS A QUEUED ARCHIVAL TASK AGAIN, with a card, a budget, a
        completion gate, a receipt and a DISPATCHER POST-COMMIT VERIFIER PASS.
        BATCH-60d6b9's had none of those (PD-1), and its compensating six-hash gate was
        declared and then NEVER RUN because the composing task held no shell (PD-2) - a
        deviation spent without the mitigation being bought. That failure mode is
        structurally removed here.
      - >-
        BOTH ARCHIVES BIND IN `commit` MODE RATHER THAN `content_first`. Neither archive's
        expected path set contains a path committed by somebody else, so each commit can be
        required to change EXACTLY its expected set - the stronger binding, available only
        because the snapshot task exists.
    the_two_spare_identifiers_are_reserved_unused: >-
      TASK-20260906-23f571 and TASK-20260906-238142 ARE RESERVED AND NOT USED, and the
      alternatives are named rather than left as an absence. A SECOND ADVERSARIAL PASS was
      considered and declined: the goal head names ONE producer, and two passes launched by
      the same session under the same prompt would buy correlated agreement while halving
      what the single reviewer can afford to check. A SECOND REVIEWER with disjoint joints
      was considered and declined: its value would come from a genuine blind separation, and
      this round has no quantity for one reviewer to re-derive from another - its product is
      an argument, not a measurement. INVENTING WORK FOR AN IDENTIFIER IS WORSE THAN LEAVING
      IT UNUSED.

  # =======================================================================
  why_the_enacting_decision_is_not_in_this_batch:
    the_ruling: >-
      IT IS NOT, AND THAT IS A DECISION TAKEN HERE RATHER THAN A CONSTRAINT INHERITED. The
      goal head says the enacting decision "is in neither batch until that pass returns",
      which makes it AVAILABLE to a batch in which the pass does return. This one does. It
      is deliberately not taken.
    reason_1_no_independent_check_on_the_act_itself: >-
      An enacting decision composed in the same task that first reads the pass has no
      independent check ON THE ENACTMENT. Every artifact of this batch is an INPUT to the
      enactment; none is a review OF it. The campaign's own standard - that a
      claim-changing act is reviewed by an agent that did not produce it - would be
      satisfied for the pass and unsatisfied for the act. Enacting on a red-team pass that
      returns findings would be the campaign's strongest act to date and it would rest on
      one reading, by the composing Coordinator, of a report delivered hours earlier.
    reason_2_the_material_is_not_the_ruling: >-
      Four of the five reserved items need the pass's input and the fifth needs something
      the pass is FORBIDDEN to supply. RT-4's licensing question was carried into clause_4's
      text as ordered and, in DEC-20260906-408595's own words, the redraft "did not and
      could not SETTLE" it; the pass may not settle it either. A Coordinator that rules the
      same hour it receives the material has not deliberated, it has transcribed.
    reason_3_enactment_deserves_its_own_round: >-
      Enactment moves EXP-WESOVOW-001 off version 1 - a status and version transition of an
      `approved`, frozen experiment contract on this campaign's only live enactment path. It
      deserves its own bounded round with its own review plan, its own reserved identifiers
      and its own recorded prior, not a slot inside an archive task that is already
      composing a round, performing CF-19 and writing this campaign's first knowledge
      promotion.
    the_cost_of_deferring_it_again_stated_plainly: >-
      THIS IS THE SEVENTH CONSECUTIVE ROUND IN WHICH THE CONTRACT STAYS DEFECTIVE AND
      UNAMENDED, AND THE COST IS NOT ZERO. CF-1 remains DISCHARGED ONLY IN PART.
      specification.yaml:39-40 is still jointly satisfiable with its own control C4 only on
      the degenerate slice log2 M = 0, it is still the governing document of an `approved`
      experiment, and a reader who does not read five committed decisions deep will not
      know. THE CAMPAIGN HAS ALSO DEFERRED CF-19 FOUR TIMES AND THE CITATION LIFT FIVE
      TIMES, AND A PROGRAMME THAT DEFERS BY DEFAULT HAS STOPPED CHOOSING. Premature closure
      and perpetual deferral are the same failure mode wearing different clothes, and
      docs/inventor-protocol.md treats the first as symmetric with overclaiming.
    what_this_batch_does_so_the_deferral_does_not_become_a_habit:
      - >-
        IT ENDS THE CF-19 DEFERRAL HERE rather than naming it a fifth time: the ledger
        archive DECLARES inputs/P13-WESOLOWSKI-2026/source_record.yaml in its own path set,
        which is the exact reason every previous archive gave for not doing it.
      - >-
        IT ENDS THE KNOWLEDGE-PROMOTION DEFERRAL HERE for the same reason, by declaring the
        knowledge path.
      - >-
        IT REQUIRES THE CLOSING DECISION TO MAKE THE ENACTING BATCH THE SINGLE NEXT ACTION
        WITH A NAMED PRECONDITION SET rather than an open-ended "when ready", so a successor
        can check whether the precondition is met instead of re-arguing whether it is time -
        unless the round returns a finding that BLOCKS enactment, in which case it opens
        nothing and says so.
    what_would_have_had_to_be_true_for_the_enactment_to_be_here: >-
      RECORDED SO THE DEFERRAL IS CHECKABLE AND NOT MERELY CAUTIOUS. Three things, none of
      which this batch can arrange: a second independent session reviewing the ENACTMENT
      rather than the pass; a Coordinator ruling on RT-4's licensing question drafted BEFORE
      the pass returned, so the pass could attack the ruling rather than supply it; and the
      companion record for clause_3 and clause_4 in existence, because the redraft's own
      reviewer_notes state that enacting without it "leaves the contract with no conforming
      implementation" and that the two "should be enacted together".
    what_this_ruling_does_not_do: >-
      It does not promise that a future decision will enact, does not pre-approve the
      amendment, does not rank enactment above whatever the pass returns, and does not bind
      the closing decision to any outcome.

  # =======================================================================
  the_blind_policy_and_its_reason:
    declared: NONE. This batch has no blind phase.
    ground_1_nothing_is_re_derived: >-
      A blind phase exists to stop an agent being told the answer to a measurement it is
      about to make independently. THE PRODUCER MEASURES NOTHING. Its core question - what
      the redraft would DO, whom it binds, what it forecloses - HAS NO PUBLISHED ANSWER
      ANYWHERE IN THIS REPOSITORY; nobody has ever written it. The mechanical facts about
      the redraft's bytes ARE published (EV-SSI-804e09 OBS-1 to OBS-8) and withholding them
      would not blind the pass, it would make it spend its budget re-deriving the record.
    ground_2_the_mechanism_does_not_reach: >-
      `blind_rederivation.assigned_to` must name an agent that FILES a review_attestation,
      and `blind_from` is checked against that agent's declared `sources_read`. This batch's
      single reviewer must read the pass's report because it IS its object, so a blind_from
      list would collide with an honest sources_read or force every joint to be skipped; and
      a PRODUCER cannot carry a blind_from list under the tool at all. SIX IDENTIFIERS DID
      NOT CHANGE THIS - what would is a second reviewer re-deriving a quantity a first agent
      produced, and this round has no such quantity.
    ground_3_this_control_plane_could_not_arm_one: >-
      NEW IN THIS BATCH AND DECISIVE ON ITS OWN. The authoring task holds NO SHELL: it
      cannot compute a sha256 and may not invent one, so `blind_phase_hygiene.protected_sha256`
      could not be armed here. And even with a shell there is no object for it - that map
      protects LITERAL VALUES against leaking through commit messages, and this round's
      candidate protected object is a FILE, not a number. A BLIND PHASE WHOSE HYGIENE MAP IS
      EMPTY ANNOUNCES A PROTECTION THAT PROTECTS NOTHING, and a declaration that protects
      nothing teaches every later reader to skip the one that does - the opposite failure to
      CORR-20260905-547849.
    consequence_for_the_tool: >-
      `tools/check_review_independence.py --blind-history` is NOT APPLICABLE to this batch.
      IT MUST NOT BE RUN OR RECORDED, and a report of UNCHECKABLE from that mode would be
      CORRECT rather than a defect.
    cf_15_first_limb_is_owed_for_a_third_batch: >-
      Naming the launching prompt as a protected channel INSIDE a blind-phase declaration has
      no object here for the third batch running. IT REMAINS OWED, and this batch names
      exactly what would create an object for it so a successor need not reconstruct it: a
      batch in which a SECOND reviewer independently re-derives a quantity a first agent
      produced, with that agent's output IN ITS OWN FILE so blind_from can name it without
      colliding with an honest sources_read, and with the digest map armed by a session that
      HOLDS A SHELL before dispatch.
    what_replaces_protection_and_it_is_weaker: >-
      TWO MEASURES, BOTH DECLARED AS WEAKER. (i) A READ_SCOPE BOUNDARY: review_plan.yaml,
      which carries the Coordinator's prior, is NOT in the producer's read_scope, so an
      expectation is not handed to the agent about to look. THIS IS THE ONE THING THIS BATCH
      DOES THAT BATCH-60d6b9 DID NOT, its cost is that the entailed-control objects had to be
      reproduced on the producer's card, and a read_scope declaration is not a tool-enforced
      blind phase. (ii) AN ATTESTED ORDERING on the reviewer at J3. Both are attestations,
      not tool results.

  # =======================================================================
  the_entailed_control_analysis:
    why_it_is_in_the_opening_decision: >-
      BECAUSE THE QUESTION IS ASKED IN ADVANCE OF THE PRODUCER'S OUTPUT, NOT AFTER IT. THIS
      CAMPAIGN HAS NOW SEEN THREE CHECKS WHOSE PASS WAS ENTAILED BY THEIR OWN CONSTRUCTION:
      AC-1's pass region being exactly how its input was built (RT-3, CF-21); AC-4's eighth
      pattern carrying an uppercase literal against a lowercased haystack so it can never
      fire (F-1, CF-13); and the shape-only parse control that would have passed on the very
      file it exists to detect the amendment of, which the previous producer anticipated and
      defeated with a content assertion.
    what_would_make_this_producers_output_vacuous:
      - ENTAILED BY THE ASSIGNMENT - asked what it forecloses, any agent returns foreclosures, because every record that proposes anything forecloses something.
      - ENTAILED BY THE PROMPT - this control plane names nine key paths and four axes, and a report that is those nine populated into those four is the dispatcher's outline with a red-team header.
      - ENTAILED BY THE CAMPAIGN RECORD - re-confirming RT-, F- and V-numbers and relabelling them as act findings is a bibliography, not a pass; blindness is lifted for the producer so its agreement with any of them is not independent.
      - ENTAILED BY THE DRAFT'S OWN DISCLOSURES - amendment.reviewer_notes.known_weaknesses_of_this_draft already names four weaknesses, and returning them is reading the draft's confession back to it.
    the_named_entailed_control_object: >-
      THE INERT OBJECT:
      coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-0fbf69/run_provenance_attestation.yaml.
      A committed record of this campaign that PROPOSES NO ACT - it attests provenance about
      two immutable run manifests, binds nobody, amends nothing, forecloses no option. "This
      record would bind a party, foreclose an option, or mislead a reader of a green control
      about an amendment" IS KNOWN FALSE FOR IT. The act-analysis procedure is run on it
      UNCHANGED. If it returns act-findings of the same class and severity as against the
      redraft, THE FINDINGS ARE PRODUCTS OF THE PROCEDURE AND NOT OF THE REDRAFT, and that is
      the most valuable result this round can produce.
    the_discriminating_twin_object: >-
      THE SUPERSEDED BATCH-752ef2 DRAFT, immutable and KNOWN UN-ENACTABLE because its
      clause_1 does not parse when spliced. Any act-finding that survives UNCHANGED there is
      about amendments of this shape, or about this campaign, and NOT about the redraft's own
      text - and must be LABELLED so. THE INERT OBJECT CATCHES A PROCEDURE THAT FIRES ON
      ANYTHING; THE TWIN CATCHES ONE THAT FIRES ON THE CLASS RATHER THAN THE INSTANCE. The
      campaign's three previous entailment failures were all of the first kind, which is why
      the second is worth paying for now.
    the_other_three_objects: >-
      A KNOWN-FALSE ATTRIBUTION OBJECT (the proposition that the redraft resolves RT-6,
      RT-9(a) or RT-12, known false on committed evidence - a pass that reports otherwise has
      a reading defect); A GREEN-CONTROL READER OBJECT (the committed control report showing
      PASS, whose candidate wrong conclusions must each be checked against a committed
      artifact); and THE POSITIVE CONTROL, which is not optional - a procedure that returns
      nothing on every object, including the redraft, is equally uninformative and its silence
      is NOT evidence that enactment is safe.

  # =======================================================================
  citation_boundary:
    ruling: RETAINED IN FULL, BOTH LIMBS. NOT LIFTED, NOT NARROWED, NOT WIDENED BY THIS DECISION.
    retained_verbatim: >-
      The `P=512` crossover value and its `w=2^80` sign are **NOT citation-eligible**. This
      task does not lift that prohibition. Only a committed Coordinator decision on
      independently reviewed evidence can lift it.
    predicate_extension_verbatim: >-
      In addition to the retained sentence, a row of any EXP-WESOVOW-001 reconciliation is NOT
      citation-eligible when either (a) the two anchors disagree in the SIGN of the baseline
      comparison at that row, or (b) the smaller |margin| across the two anchors at that row is
      below that field size's anchor gap |Delta log2 T_full + Delta log2 M / 2|.
    this_would_be_the_sixth_consecutive_round: >-
      DEC-20260904-166ab5, DEC-20260904-4c81b6, DEC-20260905-5f5592, DEC-20260905-3b8e94 and
      DEC-20260906-408595 each considered lifting it and each deliberately did not. AN OPENING
      DECISION IS NOT THE PLACE TO REASON A LIFT, because the round's evidence does not exist
      yet; what it can do is refuse to inherit an answer. THE CLOSING DECISION MUST REASON THE
      QUESTION AFRESH FOR THIS ROUND, and its task card requires it to.
    what_survives_untouched_at_batch_open: >-
      Nothing this batch produces bears on any of the standing grounds: the anchor recorded
      off_curve at three of five field sizes; CF-7's undischarged remainder for the
      reconciliation procedure; the free overhead knob; and RT-2's `A > 0` antecedent, WHICH IS
      THE GOVERNED SIGN and which this batch's producer will be under direct pressure to check
      while attacking the R3 warrant sentence. It may not. WHERE A CHECK WOULD REQUIRE A
      GOVERNED SIGN, THE CORRECT OUTPUT IS THE STATEMENT THAT IT WOULD, NEVER THE VALUE.
    the_machine_readable_flag: >-
      BATCH-256a94's anchor_reconciliation.json per-row `citation_prohibited` flag is scoped by
      field size and IS KNOWN TO UNDER-REPORT - at least two rows carrying
      `citation_prohibited: false` at log2 p = 256 fall under the predicate. THAT ARTIFACT IS
      SNAPSHOT-BOUND, IMMUTABLE, AND MUST NOT BE EDITED. This batch produces no successor to it
      and does not repair it.

  # =======================================================================
  procedure_deviations:
    - id: PD-1
      deviation: >-
        THE KN-TECH IDENTIFIER COULD NOT BE MINTED AND IS NOT INVENTED, so the ledger
        archive's declared path set carries the deliberately NON-CONFORMING placeholder
        `knowledge/techniques/KN-TECH-f8ec55.md`.
      why: >-
        tools/allocate_id.py has NO `KN` entry in PREFIX_TYPE at all, so `--next` cannot mint
        one even from a session with a shell; the corpus's recent entries (KN-LIT-327949,
        KN-LIT-e77232) use a six-hex token minted by the curating session. This authoring task
        additionally holds no shell.
      cost: >-
        A DECLARED ARTIFACT PATH THAT NAMES NO FILE UNTIL SOMEBODY SUBSTITUTES IT. The
        placeholder matches neither the six-hex nor the legacy three-digit grammar, so unlike a
        conforming guess it cannot commit silently as a real identifier - which is the point.
      mitigation: >-
        batch.yaml dispatch_preconditions DP-3 makes substitution a hard precondition with an
        exhaustive site list, AND NAMES A SAFE FALLBACK: if it cannot be minted, remove the
        knowledge path from the ledger archive's artifact_paths and write_scope BEFORE dispatch,
        re-render the queue, and record the promotion as deferred. DO NOT WRITE A FILE AT THE
        PLACEHOLDER PATH - a knowledge entry under a non-conforming identifier is corpus damage
        and is worse than one more deferral.
    - id: PD-2
      deviation: >-
        knowledge/INDEX.md IS NOT IN THE LEDGER ARCHIVE'S DECLARED PATH SET, contrary to what
        DEC-20260906-408595's knowledge_promotion says the promoting archive must carry.
      why: >-
        knowledge/INDEX.md IS GITIGNORED - .gitignore line 134 - and CLAUDE.md's concurrency
        section states that generated artifacts are never committed, that INDEX.md is rebuilt on
        demand, and that CI rebuilds it and fails if the corpus stops building. COMMITTING IT
        WOULD BE THE DEFECT, NOT THE COMPLIANCE.
      how_it_is_handled: >-
        THIS IS A CORRECTION OF A COMMITTED DECISION'S ASSUMPTION, MADE BY A SUCCESSOR RECORD AND
        NEVER BY AN EDIT. DEC-20260906-408595 is immutable and is not touched. The ledger archive
        declares the ENTRY path only, may run `tools/build_knowledge_index.py` to confirm the
        entry parses into the index, and REPORTS that result without staging the file.
    - id: PD-3
      deviation: >-
        THE ARCHIVE TASKS OF THIS BATCH CANNOT RUN THEIR OWN GATES ON THIS RUNTIME, and this is
        declared IN ADVANCE as a design rather than discovered afterwards.
      basis: >-
        A coordinator subagent has no shell here - recorded by DEC-20260906-408595 PD-2 and PD-3,
        by EV-SSI-804e09 OBS-16, and broadcast by this campaign's own session at
        coordination/bus/messages/MSG-20260906-dc0f1e.yaml note 2.
      the_structural_mitigation: >-
        batch.yaml archive_execution_ruling: THE DISPATCHING SESSION EXECUTES BOTH ARCHIVAL
        COMMITS AND EVERY GATE OF BOTH ARCHIVE TASKS unless it dispatches them to a session that
        demonstrably holds a shell. The archive task AUTHORS; whoever holds the shell RUNS and
        records each command with verbatim output and exit code. A GATE NOT RUN IS RECORDED
        OUTSTANDING, never as passed.
      why_it_is_stated_in_advance: >-
        BECAUSE THE PREVIOUS ROUND DECLARED A COMPENSATING GATE AND THEN COULD NOT RUN IT (PD-2
        there), which its own decision calls spending the deviation without buying the mitigation.
        A design that assumes a capability the runtime does not have is the same defect.
    - id: PD-4
      deviation: >-
        THIS CONTROL PLANE WAS AUTHORED BY A TASK HOLDING Read/Grep/Glob/Write/Edit AND NO SHELL.
        EVERY GATE OF THE CONTROL PLANE ITSELF IS OUTSTANDING.
      the_outstanding_list: >-
        `python3 tools/research_dispatch.py` against this batch's dispatch_queue.json (the queue
        has NEVER been rendered and none of its gates evaluated); `python3
        tools/allocate_id.py --check` on all ten pre-allocated identifiers; the KN-TECH mint;
        `git fetch origin main` and the MERGE; `python3 tools/merge_digest.py`; `python3
        tools/validate_ledger.py`; `python3 tools/check_merge_hygiene.py`; `python3
        tools/check_review_independence.py` (which cannot pass before the reports exist and is a
        gate of the ledger archive, not of the open); `python3 tools/goal_lanes.py claim`;
        `python3 tools/agent_bus.py inbox`; the control-plane commit; the push; and the PR.
      what_was_done_instead_and_how_much_weaker_it_is: >-
        THE TOPOLOGY WAS CHECKED BY READING tools/research_dispatch.py - validate_queue's archive
        assignment loop, validate_archive_shape, _validate_ledger_archive, _validate_review_chains
        and verify_archive's `commit` branch - against this queue's fields, and by comparison with
        two rendered predecessors. THE IDENTIFIERS WERE CHECKED BY DIRECT SEARCH ONLY. READING THE
        VALIDATOR IS WEAKER THAN RUNNING IT, and no exit code, output or hash is reported anywhere
        in this control plane because none was obtained.
      what_a_failure_means: >-
        A RENDER FAILURE IS A DEFECT OF THIS CONTROL PLANE, to be repaired here before dispatch
        and NEVER worked around inside a task.
    - id: PD-5
      deviation: >-
        THE PRODUCER'S READ SCOPE EXCLUDES review_plan.yaml BY DESIGN, so the Coordinator's prior
        is not handed to the agent about to look.
      cost: >-
        THE ENTAILED-CONTROL OBJECT LIST AND ITS FAILURE SIGNATURE HAD TO BE REPRODUCED on the
        producer's task card and in the queue's handoff block. TWO COPIES CAN DISAGREE; the plan is
        declared to govern and a divergence is a defect of the control plane rather than of the
        producer, and the reviewer is asked to report it.
      what_it_is_not: >-
        NOT A BLIND PHASE. A read_scope declaration is not tool-enforced, and the dispatching
        session is forbidden by batch.yaml to repair the separation by speaking the prior aloud at
        launch - a prohibition that is itself enforceable only by disclosure.
    - id: PD-6
      deviation: >-
        THE GOAL HEAD'S `current_batch_id` AND `dispatch_queue_path` REMAIN STALE AT BATCH-eb0a7e
        AT BATCH OPEN, for the fourth consecutive archive, and are now stale with respect to six
        batches.
      why_it_does_not_travel_with_the_open: >-
        DEC-20260906-408595 PD-12 says the repair "should travel with the OPENING of a successor
        batch". It cannot here: goal.yaml is not in this control plane's declared path set, and
        this authoring task holds no shell and cannot render the queue whose path the field would
        name - so setting the pointer now would create exactly the dangling pointer the head's own
        superseded note records as the defect to avoid.
      where_it_is_routed: >-
        TASK-20260906-8f3ee7, with the exact values on its card. THE DISPATCHING SESSION MAY DO IT
        EARLIER if it renders the queue successfully and DECLARES goal.yaml in its control-plane
