coordinator_decision:
  id: DEC-20260921-f93b43
  decided_by: coordinator
  decided_at: '2026-09-21'

  context: >-
    NA-2 of ledger/corrections/CORR-20260921-9dc350.yaml, on the user's
    explicit selection of this option this session ("1" -- "Complete
    FROB-EXT-q13n7"). This decision approves protocol_amendment
    experiments/EXP-FROB-91ee9c/amendments/DEC-20260921-f93b43.yaml
    (specification.yaml v3 -> v4), which extends EXP-FROB-91ee9c's
    maximum_runs from 3 to 4 and authorizes one additional bounded Executor
    run attempting full completion of FROB-EXT-q13n7 (q=13, n=7, s=3
    equal-degree factors, Bell(3)=5 achievable partitions: [6], [4,2],
    [2,2,2]) -- a cell already specified in the original v1 contract that
    RUN-FROB-91ee9c-7119f2 previously attempted and left in the SR-4
    permitted terminal state `not_run_resource`.

  decision: approve

  target_ids:
    - EXP-FROB-91ee9c
    - H-FROB-d93575
    - CORR-20260921-9dc350

  rationale:
    - >-
      WHY THIS IS RETRIABLE, NOT CLOSED. RUN-FROB-91ee9c-7119f2's own probe
      (work/FROB-EXT-q13n7.probe.json) explicitly states the prior
      checkpoint "was purely a wall-clock scheduling decision" -- peak RSS
      never approached 300 MB against an 8 GiB cap. CLAUDE.md's "Research
      budgets: progress first" (2026-09-06) instruction directly addresses
      this: "Watchdog expiry checkpoints a task; it does not exhaust the
      campaign or require another user budget approval," and CPU is
      "measured for algorithm comparisons, not rationed by default." A
      self-imposed 540-second cap that the same probe's own throughput
      extrapolation (~7,000-8,000 point additions/sec, ~650-750s for a
      single full pass over N=5,230,261) shows was always going to be too
      short is a scheduling error to correct, not a scientific finding to
      accept as final.
    - >-
      WHY AN AMENDMENT AND NOT A NEW EXPERIMENT. FROB-EXT-q13n7 is already
      part of EXP-FROB-91ee9c's ORIGINAL v1 contract (named_parameter_sets,
      cell_execution_order, SR-4) -- this is not a new cell or a new
      control, only a budget extension (maximum_runs 3->4,
      wall_clock_seconds advisory raised to 10800s) plus a scope statement
      (curve index 0 only, matching the original run's own scope for the
      three core cells). SR-6 requires exactly this mechanism for a budget
      change; no control design, metric, threshold, or outcome rule is
      touched.
    - >-
      WHY CURVE INDEX 0 ONLY. A first genuine measurement on this cell's
      richer lattice is the goal; extending to curve index 1 as well would
      roughly double the cost for a refinement (curve-index coverage) that
      is not what NA-2 asked for and is not needed to learn whether the
      partition-cost effect appears at m=3 with three equal-degree factors.
      If this run's result is itself informative enough to warrant a second
      curve, that is a separate future amendment, decided after seeing this
      run's outcome.
    - >-
      THE CORRECTED C2 CONSTRUCTION APPLIES HERE FROM THE START.
      DEC-20260921-2f89d4's per-slot-independent subspace pool is already
      in force for this run -- FROB-EXT-q13n7's [2,2,2] partition is
      exactly the multi-same-dimension-slot case that fix exists for (three
      slots of dimension 2, needing three genuinely distinct subspaces),
      so this is also the first real stress test of that fix on a
      partition richer than [2,2].
    - >-
      WHAT THIS DECISION DOES NOT DO. It does not change H-FROB-d93575's
      status (unchanged:
      `weakened_control_battery_spread_ties_and_c2_excess`); it does not
      re-score, re-open, retract, or edit RUN-FROB-91ee9c-7119f2's
      `not_run_resource` terminal status for this cell, which remains the
      accurate record of that attempt; and it asserts nothing about
      whether the new attempt will complete, or what it will show if it
      does -- including the possibility that it, too, ends in a genuine
      (not merely self-imposed) `not_run_resource` if the cost estimate
      proves wrong, which remains a permitted, non-negative SR-4 outcome.
    - >-
      STANDING AUTHORIZATION. AGENTS.md's standing user authorization
      (2026-09-06) and CLAUDE.md's research-budgets instruction (2026-09-06)
      are the general basis for continued research spending here; the
      user's explicit selection of this option in this session is the
      basis for this particular attempt. No further user confirmation is
      sought or required.

  approval_checklist:
    protocol_complete: true
    sr6_compliance_confirmed: >-
      No control design, metric definition, threshold, success_criterion,
      falsification_criterion, or decision_branches text is changed; the
      amendment touches only budget.maximum_runs, budget.wall_clock_seconds
      (advisory), and execution scope (curve index 0 only, for a cell
      already in the original contract). Verified against
      experiments/EXP-FROB-91ee9c/specification.yaml directly (predecessor
      sha256
      9d66c4f7914250a09a5083a3e97c85af9f26ba04755b906105c200d41c75daa4,
      unchanged since DEC-20260921-e81e25 and DEC-20260921-2f89d4).
    fields_verified_non_null:
      - amendment reason, changes, unchanged, affected_runs, confirmatory_status
      - handoff objective, constraints, deliverables, budget, completion_gate

  affected_runs: []
  confirmatory_status: not_applicable

  evidence_refs:
    - experiments/EXP-FROB-91ee9c/amendments/DEC-20260921-f93b43.yaml
    - ledger/corrections/CORR-20260921-9dc350.yaml
    - experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/report.md
    - experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/work/FROB-EXT-q13n7.probe.json
    - experiments/EXP-FROB-91ee9c/specification.yaml

  limitations:
    - >-
      THIS DECISION APPROVES AN AMENDMENT AND A DISPATCH, NOT EVIDENCE. No
      new run exists yet; H-FROB-d93575's status is unchanged by this
      decision.
    - >-
      Scope is exactly FROB-EXT-q13n7, curve index 0, full battery; curve
      index 1 for this cell, and every other cell, is untouched.
    - >-
      The 3-hour advisory wall-clock budget is a point estimate from the
      prior probe's own throughput extrapolation, adjusted upward for the
      corrected C2 construction's extra passes; it may still prove
      insufficient, in which case a genuine `not_run_resource` remains a
      permitted, non-negative outcome under SR-4, to be reported honestly
      rather than forced.
    - >-
      A future /review-evidence round is required to interpret whether a
      completed FROB-EXT-q13n7 measurement bears on H-FROB-d93575's status;
      this decision pre-judges neither.

  next_actions:
    - >-
      NA-1 (coordinator, dispatching session): merge origin/main, then make
      ONE isolated snapshot archive staging exactly
      experiments/EXP-FROB-91ee9c/amendments/DEC-20260921-f93b43.yaml,
      ledger/decisions/DEC-20260921-f93b43.yaml, and
      ledger/handoffs/TASK-20260921-ba442e.yaml under archived_by
      TASK-20260921-86a930, then push and open or refresh a PR against main
      naming all three records.
    - >-
      NA-2 (coordinator, dispatching session): after the snapshot is
      verified and published, dispatch the Executor against
      TASK-20260921-ba442e, instructing it to run the long-running Sage
      computation in the background (not a single foreground call bounded
      by any short tool timeout) and to report a genuine, honestly-reasoned
      `not_run_resource` rather than force completion if the 3-hour
      advisory budget proves insufficient.
    - >-
      NA-3 (coordinator): on the new run's completion (or genuine
      not_run_resource), decide whether the result -- a first measurement
      at m=3 on a genuinely richer partition lattice -- warrants a
      /review-evidence round against H-FROB-d93575, or is itself the basis
      for a further amendment (e.g., extending to curve index 1).

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT AN EVIDENCE-REVIEW DECISION. This decision approves a protocol
      amendment and a bounded execution dispatch; no EV-* record is in
      scope and no run has executed under it yet. The knowledge-promotion
      gate applies at NA-3, if a review round follows.
