# DEC-20261016-5cd7e2 — approve the isogenous-model screen EXP-ENDO-25ad84.
# The standing authorization of 2026-09-06 is the user-approval basis.
coordinator_decision:
  id: DEC-20261016-5cd7e2
  recorded_at: '2026-10-16'
  decided_at: '2026-10-16'
  decided_by: coordinator
  question_ids:
    - RQ-ENDO-476761
  goal_id: GOAL-ENDO-001
  goal_binding: >-
    This decision binds RQ-ENDO-476761 to GOAL-ENDO-001 as its nearest parent
    (is any cost functional non-constant across an isogeny class?). The bound
    functional is known-scalar multiplication cost, not an attack cost; no
    result of EXP-ENDO-25ad84 changes an ECDLP claim of that goal.
  archived_by: TASK-20261016-cbf19d
  mode: design_experiment_approved
  standing_authorization: >-
    The standing user authorization in AGENTS.md (user instruction,
    2026-09-06: "all is approved. ideas/experiments should be always
    approved") is the user-approval basis. The Coordinator checked the
    controls, the metrics, the stopping and invalidation rules, the artifact
    paths, the budget, and that the success and falsification criteria are
    distinct.
  decision: approve
  decision_label: >-
    Approve H-ENDO-5a33ae (specified -> approved) and the frozen runnable
    contract EXP-ENDO-25ad84 for one modelled screen, RUN-ENDO-d7cb69.
  target_ids:
    - RQ-ENDO-476761
    - IDEA-20261016-15a6fc
    - H-ENDO-5a33ae
    - EXP-ENDO-25ad84
    - TASK-20261016-3a809b
    - TASK-20261016-cbf19d
    - RUN-ENDO-d7cb69
  context: >-
    IDEA-20261016-15a6fc asks whether routing k*P through a rational
    ell-isogenous neighbour with a cheaper model pays for its conversion on
    deployed curves. The launcher (harness/endosweep/isomodel.py, run.py,
    check.py) is implemented, unit-tested and smoke-tested. The smoke runs
    were at reduced samples on P-256, brainpoolP256r1, Curve25519, secp256k1
    and the two controls, and they are disclosed in the specification. No
    criterion was set from them. RQ-ENDO-476761 is not bound to a goal.
  rationale:
    - The contract reduces one decision-changing uncertainty. Either a verified, conversion-charged modelled gain exists on some deployed curve, which makes that curve a bench candidate, or the arm closes in scope.
    - There are two positive controls (route-back and ascent), two negative controls (P-256 and Curve25519) and an odd-order instrument check. Each failure mode maps to an indeterminate arm, not to evidence.
    - The success and falsification criteria are distinct and were fixed before the run. Every route with positive gain is verified on points.
    - This is a constant-factor, known-scalar question, not an exponent-targeting one. It is admitted because it is cheap (one run, 3 h watchdog, 2 GB) and closes an unmeasured route. It does not displace exponent-targeting work.
    - The approval covers the driver, the checker, the trial plan and the executor card.
  evidence_refs:
    - ledger/proposals/IDEA-20261016-15a6fc.yaml
    - ledger/proposals/IDEA-20261016-15a6fc.notes.md
    - ledger/questions/RQ-ENDO-476761.yaml
    - harness/endosweep/isomodel.py
    - tests/test_isomodel.py
    - experiments/EXP-ENDO-25ad84/implementation/run.py
    - experiments/EXP-ENDO-25ad84/implementation/check.py
    - harness/endosweep/README.md
  runnable_condition: >-
    Approval requires tools/newest_experiments.py --experiment
    EXP-ENDO-25ad84 to report execution_state ready, with trial-plan.json
    present and the trial_plan_sha256 of TASK-20261016-3a809b filled in. The
    dispatching session confirms this before committing this record.
  limitations:
    - All figures are modelled counts in curvesweep's wNAF model. The claim tier is modelled, and no timing or ECDLP claim is possible from this run.
    - The scope is ell <= 13, depth 2, at most 64 nodes and at most 521 bits. A null result there does not close larger degrees or depths.
    - Heuristics H1-H3 of the idea are not validated here.
    - This decision does not launch the executor and does not edit the idea or the question.
  next_actions:
    - The executor runs experiments/EXP-ENDO-25ad84/trial-plan.json once under TASK-20261016-3a809b and records observations only.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Approval of a protocol is not a result. No evidence record is created
      here.
