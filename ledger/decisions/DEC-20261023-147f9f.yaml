  status_transitions:
    - {id: H-CZLIFT-889c9d, from: approved, to: supported, tier: toy}
  scoped_claim: >-
    Scope: the 29 class-number-one CM anomalous curves with 7 <= p <= 1373
    (D in {-3, -11, -19, -43, -67, -163}); unramified integral
    short-Weierstrass Z_p-lifts in the four sampled classes (v_p(Δj) in {1, 2,
    3, ∞} at e = 1, {3, 6, ∞} at e = 3); precision p^8; the naive, Teichmuller
    and one-digit Hensel sections.
    (1) The degeneracy flag v_p(z([p]P^)) >= 2 agreed with v_p(Δj) >= 2e on
    14,616/14,616 rows. This calibrates two code-independent instruments
    against a statement that follows from Serre-Tate/Kummer theory (prior art:
    Belding 2007, section 7); it is not independent evidence for it. At j = 0
    the threshold is pinned only to (3, 6].
    (2) Smart's ratio recovered d on 2,052/2,052 rows per seed with
    v_p(Δj) < 2e.
    (3) On degenerate lifts the pooled next-digit success count was consistent
    with the random-section null on both seeds. Matching null 1/(p+1): 93 and
    87 against 86.84 expected, z = +0.68, +0.02. Exact lift-conditioned nulls:
    z = +1.54, +0.75. The rate is not 1/p per cell for deterministic sections:
    on j = 0 lifts with A ≡ 0 mod p^2 the Teichmuller section never succeeds
    on d in mu_6 \ {±1} (rate 0 at p = 7).
    Evidence: EV-CZLIFT-712fe4. Runs: RUN-CZLIFT-041d05, RUN-CZLIFT-6709c9.
    Review tasks: TASK-20261022-282b02, TASK-20261023-856638.
  rationale:
    - >-
      The run set is valid. Both planned trials ran (2 of 2) to
      output_validated. Seeds are as frozen. Custody is intact (J1). The
      independent replay matches 14,616/14,616 rows. The blind re-derivation
      agrees (J3). The J2 break is definitional and outcome-invariant, and
      CORR-20261023-1869c3 and CORR-20261023-9f2176 now state it per
      definition. No defect blocks interpretation.
    - >-
      The preregistered success criterion is met on both seeds under every
      definition-and-null pairing (max |z| = 1.539), and the falsification
      criterion is not triggered under any. The frozen criterion is read as
      written. The matching null is reported beside it and does not replace
      it.
    - >-
      Clauses 1 and 2 are true by derivation. The red-team R1 derivation
      shows that the flag and the j-distance rule are one predicate on every
      unramified Z_p-lift of an ordinary anomalous curve. I checked it step by
      step. The full-fiber sweep corroborates it (one degenerate class mod p^2
      per curve), and Belding 2007 section 7 (retrieved) states its core. I
      accept R1: the experiment's contribution is calibrated confirmation,
      not discovery. This is what my recorded prior in
      REVIEW-CZLIFT-17B7EB-EVIDENCE-20261023 expected, so concurrence on
      these clauses carries little surprise.
    - >-
      I accept R2 in part. 1/(p+1) is the matching null for the governing
      definition, and CORR-20261023-9f2176 records it. The cell-level reading
      of clause 3 fails for deterministic sections; the counterexample is the
      Teichmuller section at p = 7, where the rate is 0. The preregistered
      prediction and its falsification condition were pooled and
      one-sided (an excess above 1/p). On that reading clause 3 holds, and the
      Teichmuller shortfall is a deficit explained by CM automorphisms, not a
      leak. Support is therefore given to the pooled form only, and the
      cell-level reading is excluded in the evidence record's must_not_claim.
      The overturned third part of my prior (the rate sits at 1/p) is
      recorded.
    - >-
      I weighed refine against support. The scoped statement differs from the
      hypothesis only in wording that the frozen criteria never tested:
      "random rate 1/p" read per cell, and the mechanism sentence's operative
      condition. The measurable predictions all hold. A restated hypothesis
      would re-test a theorem. support with an explicit scope is the
      proportionate transition.
    - >-
      Strength is replicated, not strong. Clause 3's support rests on a pooled
      statistic with a post-observation null correction and low power
      against confined leaks. The pert_p generator deviated (D2), and the
      deterministic sections are overdispersed.
    - >-
      No gate blocks the transition. The result is not surprising, so
      first-observation replicate does not apply. asymptotic_claim is null, so
      the four promotion gates of agents/coordinator.md do not apply. It is
      not a breakthrough, closure or contradiction of established evidence,
      so AGENTS.md rule 12 is not triggered. The direction is supports, so
      no refutation artifact is required. The proof basis (derivation) is
      recorded anyway.
