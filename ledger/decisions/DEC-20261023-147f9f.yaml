    rule is a Serre-Tate/Kummer theorem, with prior art in Belding 2007
    section 7, so agreement calibrates instruments), that R2 breaks (the
    matching null for the adopted definition is 1/(p+1), and the Teichmuller
    deficit is a j = 0 automorphism effect), and that PTM-1 holds.
  decision: support
  decision_scope: >-
    ONE TRANSITION: H-CZLIFT-889c9d approved -> supported, at toy tier, in the
    scoped form of EV-CZLIFT-712fe4 only. It closes no lane. It does not close
    RQ-CZLIFT-b9f765, whose decision target also depends on EXP-CZLIFT-ae0a13
    and EXP-CZLIFT-a255fc. It changes no criterion and amends no protocol.
    Authorizes no attack.
  target_ids:
