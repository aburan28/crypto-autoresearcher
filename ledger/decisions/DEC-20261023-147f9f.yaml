  limitations:
    - Toy tier. p <= 1373 (at most 11 bits), 29 class-number-one CM curves, precision p^8, unramified lifts, three sections.
    - The j = 0 threshold 2e = 6 is not measured. Only (3, 6] is pinned over Z_p.
    - The large-p and single-section leak exclusions are post hoc red-team readings. The frozen pooled test has power 0.05 against a one-section 1/sqrt(p) leak at p > 500.
    - Rows omit (P, d) and the lift coefficients. Replays depend on the producer's RNG order.
    - The derivation's Serre-Tate facts rest on a source (Katz, LNM 868) verified only bibliographically. It is a checkable argument, labelled derivation, not a machine-checked proof.
    - Nothing transfers to non-anomalous curves, to non-CM anomalous curves (red-team data only), to ramified lifts, to higher class number or to cryptographic sizes.
    - DEC-20261009-9f9254's user-clause reading "on anomalous curves the canonical curve lift is the one lift where Smart fails" is correct but known. Its source is Belding 2007 section 7 and Serre-Tate theory, not this experiment. That record is not edited.
    - RQ-CZLIFT-b9f765 decision target (a) says "every non-canonical section recovers d at the random rate 1/p". At this scope that means only the three tested sections, pooled.
    - The validator and red-team sessions are independent by session and role. Their model identities are not probe-verified in these reports.
