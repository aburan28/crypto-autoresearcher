  context: >-
    BATCH-082: Weyl/WvdC differencing approach for H-PSEUDO is CLOSED.
    Three independent failures: correlation sum = B² (exact obstruction),
    C_h bounds require DL circularity, even circular bound gives O(N^{3/4}*B^{1/4}).

  decision: close_weyl_record_hpseudo_frontier
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    All identified analytic approaches for H-PSEUDO are now CLOSED:

    | Approach | Status | Key obstruction |
    |----------|--------|-----------------|
    | DDH conditional | CLOSED | Categorical gap: computation ≠ distribution |
    | BGS spectral | CLOSED | Abelian group: no Ω(1) spectral gap |
    | Weil/étale cohomology | CLOSED | DL circularity, wrong functional form |
    | Michel-Venkatesh | CLOSED | Algebraic characters only |
    | Weyl/WvdC differencing | CLOSED | Σ_h C_h = B² (exact), Weyl accesses no EC structure |
    | DL random permutation | CLOSED | Not standard assumption, empirically refuted |
    | Hecke characters (CM) | OPEN | Conditional on CM structure, inapplicable to generic curves |

    H-PSEUDO is a GENUINELY NEW MATHEMATICAL OPEN PROBLEM:
    - Empirically supported (C ~ p^{0.079}, yield bound negligible at crypto scale)
    - Cannot be proved by any currently known analytic technique
    - Requires a new technique exploiting the specific structure of EC multiplication sequences
    - The gap is precisely: bounding Σ_j 1_{x([j]G)<t} * e^{2πi kj/N} requires
      understanding the joint distribution of (j, x([j]G)) which is the ECDLP structure

    GOAL-ECDLP-001 stays active. The H-PSEUDO investigation has reached its frontier.

    TRANSITION: After 82 batches, the program has exhausted all standard analytic
    tools for the H-PSEUDO proof. The next productive action is:
    (A) Pivot to a different research direction for ECDLP (e.g., revisit the
        arithmetic factor-base gap from the ALGORITHMIC side — is there an algorithm
        that achieves C^m-normalized yield, or is the heuristic the true achievable level?)
    (B) Study CM curves specifically for the Hecke character approach
    (C) Fresh ideation targeting a genuinely different attack mechanism

  exact_next_action: >-
    Push a PR with all BATCH-079..082 work. Then open BATCH-083 targeting option (A):
    verify empirically whether the Semaev index calculus ACHIEVES the heuristic
    complexity or whether there is a systematic deficit (consistent with H-PSEUDO).
    Run a full Semaev index calculus (relation collection + linear algebra) at bits=20
    to measure the actual solving success rate vs. the theoretical prediction.

