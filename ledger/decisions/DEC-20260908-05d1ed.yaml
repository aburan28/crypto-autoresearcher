  context: Both fresh CM review joints are archived at 48f3310b5eb3c8704d47ae72d32c79d50f997ae0. Approve a complete
    additive prospective contract correction for the four definition defects before another implementation repair
    is dispatched.
  rationale:
  - Accept the four mathematical/cost-definition findings as worked finite protocol counterexamples. The implementation
    review independently exposes absent reducers, cost pathways and public/private isolation, so an unambiguous
    contract must precede source repair. No scientific observation or hypothesis status is inferred.
  - The Red Team disclosed generic prior CM memory-summary exposure. Preserve that limit and use its worked arithmetic
    definitions as repair requirements, not a claim of full prior-topic blindness or a promoted mathematical result.
  - The normalized baseline choice preserves the original intent to compare against the preselected fastest declared
    baseline for the fixed q256 selection workload; actual adaptive repetition totals cannot provide that ordering.
    The amended score is a prospective scientific-definition change requiring a full updated contract and subsequent
    independent review, not a retrofit to data.
  - Keep all finite sample counts, seeds, arms, thresholds, arithmetic eligibility, controls, claim limits and implementation/trust
    binding identities. Existing records remain immutable.
  - This code-aware Coordinator subtask drafts complete definitions and fixed synthetic checks only; it cannot approve
    its own output, dispatch implementation/science, edit official hypothesis/goal status or touch real signing
    material.
  - 'Rank this alongside finishing the returned four-contract corrections: it reduces known admission blockers across
    the existing eight-experiment reserve without manufacturing additional proposals.'
  accepted_definition_findings:
  - id: REDUCER-1
    required_correction: Define the even-cardinality median explicitly as the arithmetic mean of the two central
      exact rational costs. For each omission b in0..6 remove that same timing-block label jointly from the confirmation
      measurement rows used by both strategies and both endpoints of every primary cell. Freeze baseline selection
      and setup charges; do not reselect or alter setup during leave-one-out. Give total missing/below-resolution/zero-denominator
      branches and update every related definition.
  - id: COST-ALLOC-1
    required_correction: Distinguish one physical raw-cost ledger from alternative normalized views. Reconcile shared
      items per(raw_cost_row_id,strategy_view,scenario) and every setup once per fixed-q/seed view; never sum scalar+transport
      copies or different q views into actual physical work. Define one allocation EDGE per raw-item/view/target,
      permit multiple edges, and make each scoped weight sum exactly one. Resolve old one-record and global sum-one
      wording everywhere.
  - id: COST-ALLOC-2
    required_correction: Provide a total discriminated raw-cost schema for global,interval,fixture,kernel,class,endpoint-coordinate,selection-stratum,arm-workload,block/repetition
      and scaffolding charges, including partial failed searches. Define exact required/forbidden indices per variant,
      every component-to-scope and strategy mapping, canonical target ordering, integer remainder handling, and
      rational normalized quantities. Specify every library initialization, conversion, candidate/setup/warmup/per-point-table/verification
      charge and prevent double counting nested timers. Preserve actual campaign work separately from normalized
      cold-total scenarios and modeled reuse.
  - id: BASELINE-1
    required_correction: Replace adaptive total-repetition argmin with an exact normalized q256 per-workload candidate
      score including declared setup/warmup/verification and equally weighted eight-endpoint aggregation. Derive
      the statistic and exact rational tie rule completely, then retain lowest arm ID on exact ties. Charge ALL
      actual selection campaign work to scalar cold totals separately. Keep nine strata, allsix candidates, selectionseed606101,q256,seven
      blocks and preconfirmation freeze. Explicitly supersede the earlier integer-total candidate-score neutral
      choice prospectively; do not change its history or silently rely on confirmation data.
