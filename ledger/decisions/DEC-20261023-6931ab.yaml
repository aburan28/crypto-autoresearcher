  review_round:
    plans: [REVIEW-CZLIFT-14F6D5-20261022, REVIEW-CZLIFT-14F6D5-EVIDENCE-20261023]
    joint_verdicts:
      J1: holds
      J2: 'holds (DISC-1 disclosed: unstated saturation filter and upper median; no clause changes)'
      J3: holds
      PTM-1_validation: 'holds (counter level: 11a1 flat at torsion)'
      R1: breaks
      R2: breaks
      PTM-1_red_team: 'breaks (inference level: rank-0 objects pass S1; counter level holds)'
    composition: >-
      Validation establishes that the numbers are right, and the red team that
      they do not mean what the hypothesis says. The two do not conflict. The
      two PTM-1 verdicts are the same object at different levels: the counter
      does not manufacture points, but a single-hmax count is rank-blind. R2
      and the a255fc ceiling finding are one instrument fact, now derived on
      both lanes.
    prior_comparison: >-
      Prior (TASK-20261023-7b5dc6): a regulator effect, and coverage inheriting
      the a255fc limit. Confirmed in direction. Not anticipated: model
      dependence of N_E(H) (translation mutation), the naive-height window as
      the dominant factor for GZ, and EW records that break the class.
    procedure_deviations:
      - 'Validation (L10): the task card''s claim_under_review exposed the producer''s headline numbers before the blind seal. Disclosed, and accepted: the blind enumeration agrees exactly, and its slow scan up to H = 1000 is theorem-free.'
      - 'Red team: a truncated git diff --stat printed path tails of other experiments'' red-team reports. Disclosed; no sibling report was opened. The amendments/ folder was outside its read_scope; the coordinator checked it, and it holds only .gitkeep.'
      - 'tools/check_review_independence.py was not run by this composer (no shell); see next_actions.'
  limitations:
    - Toy tier only (p <= 20011, naive x-height <= 3e5). Three named reduced minimal models, of which two are record curves.
    - The adverse comparisons (EW rows, coefficient-matched null, translation, run-shaped coverage nulls) are post hoc, use one reviewer implementation, and were not pre-registered. Red-team canonical heights are floating point, and the regulators are of listed sublattices.
    - Every rank label is a lower bound, including rank 7 (Elkies-Watkins footnote 3). No rank upper bound is established.
    - The two trials are nested deterministic runs, not independent instances. check.py imports the driver and does not test C1. The manifests omit per-curve counts and h_half. Library versions and memory are not recorded.
    - The derivation note is a written argument, not a machine-checked proof, and the counterexample instances are not packaged as certificates.
    - The specification's status_note and the driver docstring say LMFDB stops at conductor 500000; it reaches 299,996,953. This is not load-bearing; a correction record is pending (next_actions).
    - This decision is not official until the ledger archive commit containing it, EV-CZLIFT-b6fe48, analysis.md, the H-CZLIFT-27a184 update and the decision report passes post-commit verification and is pushed to the PR branch.
  next_actions:
    - 'Session (archive): write experiments/EXP-CZLIFT-14f6d5/analysis.md from the text returned by this coordinator subagent. It carries derivation note D1-D4, which proof_refs cites. Per "Refutation artifacts", archive it no later than this decision; if the verifier requires strict precedence, commit it in a snapshot archive before the ledger archive. Run plot.py in reports/review-DEC-20261023-6931ab/ to produce graph.svg, compile report.typ to report.pdf, and inspect every page. Run tools/validate_ledger.py and python3 tools/check_review_independence.py --batch over reports/validation-20261022 and reports/redteam-20261023, recording any departure as a procedure deviation. Then run the ledger archive TASK-20261023-4d7449 alone, staging by exact path: the two review folders, analysis.md, ledger/evidence/EV-CZLIFT-b6fe48.yaml, ledger/decisions/DEC-20261023-6931ab.yaml, ledger/hypotheses/H-CZLIFT-27a184.yaml, and the review-DEC-20261023-6931ab folder (report.typ, plot_data.json, plot.py, graph.svg, report.pdf). Verify the commit, merge origin/main (merge, never rebase), push, and open or refresh the ready-for-review PR "evidence: EV-CZLIFT-b6fe48/DEC-20261023-6931ab".'
    - 'Goal checkpoint: after the verified archive, checkpoint GOAL-CZLIFT-1516d5 (still active) and keep exactly one next action for the global-lift lane: the idea-generator dispatch already named by DEC-20261023-26a6de (/propose-ideas RQ-CZLIFT-b9f765). Its brief absorbs this decision''s successor scope as an optional arm, ranked on merits and not as a second action. The arm: a rank-versus-discriminant ladder on Elkies-Watkins Table 2 rows (r = 5..11, at least two per rank) plus the two 1977 records plus coefficient-matched random curves. The primary metric is the model-invariant canonical-height count N(T); N_E(H) on reduced minimal models is secondary, with a translation-stability check. Coverage is read against the nested uniform and same-height-rationals nulls, with the per-cell cap reported and cap-bound edges declared uninformative. 210e2 is a standing proves-too-much row.'
    - 'Certificates before any reject_scoped: package the translation instance (382623908456a1 at t = 1e6: N_E(1e5) = 3, N_E(3e5) = 5, same discriminant) and the EW rank >= 9 instance (N_E(1e6) = 2281 against 2153) with an independent re-checker. The validator''s blind_sieve.py shares no code with rt_lib.py. If they pass, record proof_status certificate in a successor evidence record.'
    - 'If rank labels become load-bearing: rank upper bounds by 2-descent (PARI ellrank or equivalent) for 382623908456a1 and the two 1977 curves.'
    - 'Correction record (file a CORR, do not edit the frozen specification): EXP-CZLIFT-14f6d5 specification status_note and run.py docstring "LMFDB stops at conductor 500000" -> 299,996,953 per the LMFDB stats page (retrieved by TASK-20261023-7b5dc6). The claim "no rank-8 curve in LMFDB" stands.'
    - 'For the synthesis task on RQ-CZLIFT-b9f765 (wording fixes, listed and not written here): (1) scope.curve_families names only "literature rank 0 to 7" curves; add the retrieved 1977 rank-record curves and state that every rank label, including the rank-7 Elkies-Watkins curve, is a lower bound. (2) The constraint "rank labels are consistency-checked by the measured growth exponent" fails on record curves at H <= 3e5 (GZ 2- and 3-point fits; local exponent 17.3 against r = 8; BK slope 8.3 against r/2 = 4.5). Replace it with "lower bounds certified by independent points; upper bounds unverified; growth informative only in the asymptotic window". (3) The method "rational-point census of bounded naive height" must name the model, because N_E(H) at finite H is not an isomorphism invariant; add the canonical-height count N(T). (4) decision_target (a), "small global points cover E(F_p) no better than uniform reductions", is false as worded on both lanes, and its frozen band cannot fail upward. A negative closure must rest on the rank-independent counting obstruction of EV-CZLIFT-376eee. (5) The motivation''s "rank is small" as the reason global lifts fail is not what the counting bound says: the bound holds at every fixed rank. Record curves are not a counterexample to it. (6) Any synthesis statement about record curves speaks of counts in named models within a window, never of "the Neron constant collapsing". (7) Cite LMFDB coverage as conductor <= 299,996,953, maximum rank 5.'
    - 'Infrastructure ticket to the executor / harness owner (not evidence): successor specifications define N_E (O included, +-P counted separately), the coverage cell filter and the median convention (DISC-1). check.py must be independent of run.py and must evaluate every frozen control (C1 included). Manifests should carry per-curve counts and h_half tables, and record library versions and peak memory.'
    - 'Consider a KN-TECH entry at synthesis time, not now, for the coverage-ratio instrument ceiling (min(x,1)/(1 - e^-x)) and the model dependence of naive-height counts, once both lanes'' derivations are archived and the certificates exist.'
