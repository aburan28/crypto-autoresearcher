coordinator_decision:
  id: DEC-20261023-6931ab
  recorded_at: '2026-10-24'
  goal_id: GOAL-CZLIFT-1516d5
  question_ids: [RQ-CZLIFT-b9f765]
  kind: evidence_review
  mode: goal
  context: >-
    Evidence review of EXP-CZLIFT-14f6d5 (H-CZLIFT-27a184), the rank ladder
    extended with two retrieved 1977 rank-record curves (Grunewald-Zimmert,
    rank >= 8; Brumer-Kramer, rank >= 9) and the rank-7 overlap curve
    382623908456a1. Both planned trials (RUN-CZLIFT-ca7450, hmax 1e5;
    RUN-CZLIFT-b1dce4, hmax 3e5) are output_validated. DEC-20261009-44c288
    recorded the frozen criterion as met, as an observation. Validation
    VAL-20261022-2dd0e7 passed: custody and recomputation are exact, the blind
    re-derivation agrees, and PTM-1 holds at counter level. It disclosed
    DISC-1, an unstated saturation filter and upper-median convention that
    changes no clause. The red team RT-20261023-174849 broke R1: the counts
    follow the discriminant, not rank. Its counterexamples are the
    Elkies-Watkins low-conductor rows and a translation mutation of the same
    curve. It broke R2: S3, S4 and the upper edge of S2 cannot fail. And it
    broke PTM-1 at the inference level: a single-hmax count cannot separate
    rank >= 8 from rank 0. The coordinator prior, recorded before the red team
    ran, read the low counts as a regulator effect and expected the coverage
    clauses to inherit the a255fc instrument limit. It was right on both, but
    did not anticipate the larger effect: N_E(H) at finite H depends on the
    model, and naive-height window loss, not regulator, carries most of the GZ
    deficit.
  decision: weaken
  decision_scope: >-
    One transition: H-CZLIFT-27a184 approved -> weakened. Clause readings
    (EV-CZLIFT-b6fe48): S1, the record-curve count below rank 7, holds as an
    observation in the reduced minimal models, but its interpretation is
    unsupported. The S1 parenthetical "c_E falls with coefficient height" is
    not measured. S2 is met, with an uninformative upper side; its lower edge
    excludes gross subgroup confinement. S3 and S4 cannot fail. The mechanism
    clause "reduce uniformly / no structure" is contradicted as stated. The
    generalisation to "rank-record curves" is contradicted by the
    Elkies-Watkins rows. Scope: three named reduced minimal models,
    H <= 3e5, p = 103..20011, toy tier. Not support: three of four clauses
    could not fail, and the fourth is model-dependent and confounded with
    discriminant. Not reject_scoped: no frozen falsification clause fired, the
    adverse comparisons are post hoc, and the instances are not certificates.
    Not inconclusive: the data do discriminate. Derivations D1-D3 and explicit
    instances contradict the interpretive clauses, and the measurable clauses
    stand. The decision closes no lane, changes no RQ text, approves nothing,
    and promotes nothing.
  target_ids:
    - H-CZLIFT-27a184
    - EXP-CZLIFT-14f6d5
    - RUN-CZLIFT-ca7450
    - RUN-CZLIFT-b1dce4
    - EV-CZLIFT-b6fe48
  status_transitions:
    - {id: H-CZLIFT-27a184, from: approved, to: weakened, evidence: EV-CZLIFT-b6fe48}
  clause_decisions:
    S1_count_order: >-
      Holds as an observation. N_E = 5 and 215 against 1155 at H = 1e5, and 11
      and 311 against 1559 at 3e5, exact, in the reduced minimal models. Its
      reading as a rank or c_E statement is unsupported: the count depends on
      the model (D3), cannot separate rank >= 8 from rank 0 (D4), and orders by
      discriminant across seven rank >= 7 curves (Spearman -1.00 against -0.40
      for rank).
    S1_parenthetical_c_E: >-
      Not measured. c_E is an isomorphism invariant, and the counts are
      pre-asymptotic and model-dependent. Large regulators exist but explain
      about 6.3x of the 231x GZ deficit; the naive-height window explains about
      37x.
    S2_coverage_band: >-
      Met: frozen median 1.0419 / 1.0424; hypothesis cell set 1.0389 / 1.0380;
      cell range 0.9966..1.2593. The upper edge cannot fail (attainable maximum
      1.071 / 1.082). The lower edge is informative: no confinement of index
      about 4 or more at the median cell. GZ supplies no cell.
    S3_frac_above_1p5: Cannot fail; attainable maximum 0.046 / 0.045 < 0.05 (D1).
    S4_no_H_half_p_ge_1000: Cannot fail; distinct <= 311 < 468.9 <= N_p/2 for p >= 1000 (D2).
    mechanism_uniform_reduction: >-
      Contradicted as stated. Median 1.0424 against a nested uniform null of
      1.0008 +- 0.0017 (0/400 reach it); top-cell collisions 4969 against
      6142 +- 39. A same-height-rationals null (1.0277 +- 0.0040) explains most
      of the excess. Post hoc, one implementation; same direction as
      EV-CZLIFT-376eee C2.
    generalisation_rank_record_curves: >-
      Contradicted. EW rows of rank >= 8..11 have N_E(1e5) = 1027..665, and the
      EW rank >= 9 curve has 2281 against the rank-7 curve's 2153 at H = 1e6.
      Rank labels are lower bounds throughout.
  supersedes_readings:
    - record: DEC-20261009-44c288
      fields: [criterion_readings.EXP-CZLIFT-14f6d5.reading]
      note: >-
        The observation reading "what points exist reduce like uniform points"
        is superseded at clause level by this decision (mechanism clause
        contradicted as stated). "Far fewer small points than the rank-7
        curve" stands as an observation about the named models only. The
        earlier record is not edited, and its success_criterion_met_on_both_trials
        value stands.
  rationale:
    - 'Validity first. Both planned trials ran (ladder-h1e5, ladder-h3e5) and none was unplanned. Receipts are output_validated with returncode 0 and check_returncode 0, and 20/20 artifact hashes are bound. The argv equals the frozen plan, and the run is deterministic with seed null, as the specification requires. Every frozen metric, count, cell and H_half table recomputes exactly, including from the validator''s independent enumeration. The red team''s positive control also reproduces every recorded count and 480 distinct counts. Control C1 holds, verified by the validator. The amendments folder is empty. The run set is admissible evidence.'
    - 'The frozen criterion reads met, and that reading stands; no amendment is made. Its evidential weight is a separate question, of instrument power, answered by derivation. For any point set, a cell ratio is at most min(x,1)/(1 - e^-x). Hence S3 cannot fail (attainable maximum 0.046 / 0.045) and the upper edge of S2 cannot fail (1.071 / 1.082). S4 cannot fail because n <= 311 < N_p/2 at every p >= 1000 (analysis.md D1, D2). Meeting the criterion therefore carries evidence only through S1 and the lower edge of S2. A DL-known arithmetic progression passes the same frozen criterion.'
    - 'S1 is an exact observation, but it is not the quantity the hypothesis names. The translation x -> x + t is a Q-isomorphism that preserves discriminant, rank, regulator, torsion and c_E. Under it the rank-7 curve''s N_E(1e5) falls from 1155 to 3 at t = 1e6, below GZ''s 5, so F1 would fire on the same curve (D3). The rank-0 curves 11a1 (5) and 210e2 (16) match or exceed GZ at H = 1e5, so a single-hmax count is rank-blind (D4). Only growth in H separates them.'
    - 'The counts follow the discriminant. Across seven rank >= 7 curves, Spearman(N_E(1e5), log|disc|) is -1.00, against -0.40 with the rank lower bound. At matched coefficient size, random curves have N_E(3e5) of at most 9 (rank-7 size) and 1 (record sizes), so the record curves are 11 to 311 times richer than generic curves. The BK/rank-7 ratio rises with H (0.055 to 0.199), as a rank-helps reading predicts. These comparisons are post hoc and single-implementation, so they weigh as preliminary.'
    - 'Weigh the reviewers. The validator''s "passed" covers custody and arithmetic, and it is not in tension with the red team''s breaks, which concern meaning. They compose. DISC-1 is benign: every clause has the same truth value on the 144 / 176-cell hypothesis set. But it is a specification gap, and successors must state the cell filter and the median convention. I accept R1 and R2 as breaks of the hypothesis''s interpretation, not of the measurement. I do not adopt the red team''s option of a "narrowed supported" status. Moving H-CZLIFT-27a184 to supported would advertise its title and mechanism, which are contradicted. The narrow statement is recorded instead as the evidence record''s largest justified claim.'
    - 'Refutation basis: proof_status derivation (analysis.md D1-D4), with explicit instances in the red-team outputs, not yet packaged as certificates. The discriminant ordering and the uniform-null rejection are empirical and post hoc. Under docs/claims-and-verification.md this supports weaken, not reject_scoped.'
    - 'Strength preliminary, tier toy. The counts alone would be strong, but the comparison the hypothesis draws is not isolated from discriminant (confound_assessment not_isolated). There are two record curves, and the trials are nested.'
    - 'This weakening does not rescue global lifts. The obstruction to coverage-based lifts is the rank-independent counting bound of EV-CZLIFT-376eee: half coverage needs at least N_p/2 distinct global points, i.e. Omega(p) work against O(sqrt p) for rho. This run neither strengthens nor weakens it. A rank-versus-discriminant successor therefore has low decision value for the attack question. It enters the ranking on its merits, folded into the single successor proposal already routed by DEC-20261023-26a6de, not as a parallel lane.'
