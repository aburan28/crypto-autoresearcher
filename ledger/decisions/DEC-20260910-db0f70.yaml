  approved_boundaries:
  - You are not alone. Own only three exact new outputs. No source,Git,ledger,queue,claim,status,approval or
    original-artifact mutation.
  - Fresh native review-adversarial gpt-5.6-sol/xhigh,no fallback,degradation,Bedrock or serving probe. Verify
    every source hash and declared commit origin. Use explicit --repo from the published claim;no guessed parent
    depth.
  - At most384totalfixed controls including failures/reruns;each complete suite<=128and reserve a final suite.10s/case1800aggregate
    executed-check wall/CPU,one worker,2GiB. Bound metadata/source comparisons separately.
  - At most32totalbenign owned POSIX child starts,at most2concurrent,3second lifetime and1MiBdeliberate payload
    each. Retain actual created PIDs separately from synthetic marker PIDs,terminal/reap status and descriptor
    closure. No live Docker CLI/API,cgroup/mount operation,privilege change,migration,pressure body or scientific
    fixture. Inject those observations.
  - No RLIMIT_AS attempt. Use a parent watcher for the owned checker/fixtures and retain raw sample basis with
    the peak,distinguishing post-exit unavailability. Tool escalation may be used for only the authorized bounded
    owned-process operations when needed;it never permits live Docker/cgroup/privilege actions or broad process
    changes. No hard-kernel-memory claim.
  - Every invocation must reserve unique temporary receipts and exact checker bytes before launch. Persist
    command results and launch exceptions before parsing or raising. Preserve full outer tool responses/session/polls/terminal
    exit and nested argv,UTC,streams,allcases and metrics. Canonical check-receipt.json is created once only
    after all intended attempts terminate. No overwritten,guessed or reconstructed history.
  - Review all current source and real producer/consumer integration, including every IR,NF and original source
    obligation; do not substitute rerunning the producer tests for independent controls.
  - Return exact3hashes,scoped assigned-joint verdict,all attempts and all limitations. Source review alone
    never authorizes live guard,whole runtime or scientific execution.
  - Use explicit repo and require_escalated for the scoped owned-process monitoring/checker invocations. No
    default-environment process-query retry,RLIMIT_AS,provider change or live Docker/cgroup action.
  - Pre-reserve every invocation,source copy and log destination. Record every real fixture PID immediately
    on creation and every case start/result before advancing; assertion or cleanup failure must not erase prior
    custody. Preserve primary and secondary errors separately. Raw streams and command results are stored before
    parsing.
  - Decode and hash every embedded source/stream payload programmatically as data; do not execute embedded
    producer controllers or checker commands as evidence. Recompute actual counts and bindings and disclose
    any unavailable fact. No memory or time observation establishes hard kernel enforcement.
  - Canonical receipt is written once after all intended attempts terminate. Return exact three artifact hashes
    and an explicit assigned-joint verdict. Whole-runtime,scientific and historical retrovalidation claims
    are out of scope.
