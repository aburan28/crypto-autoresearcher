    - TASK-20260831-46a7e5 (blind re-derivation, corroborates the rule; S-sufficiency precondition named)
    - TASK-20260831-ea2561 (red-team, J2 DISSENT, J3 DISSENT, proves-too-much null certificate CONCUR)
