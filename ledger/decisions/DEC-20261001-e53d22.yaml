coordinator_decision:
  id: DEC-20261001-e53d22
  context: >-
    Second design tick of the 10-minute loop. IDEA-20260922-6cf862 is now
    cited by H-BINSTD-336b2d. The next high-priority open ECC idea is
    IDEA-20260922-7ab503.
  decision: approve
  target_ids:
    - IDEA-20260922-7ab503
    - H-BINSTD-42720d
    - EXP-BINSTD-d7cb2c
  rationale:
    - >-
      Standing user authorization of 2026-09-06 covers this approval. The
      contract has inputs, controls, metrics, two runs, stopping and
      invalidation rules, and a falsification criterion an outcome can meet.
    - >-
      The proposal next_gate asks whether Stage 0 alone is the deliverable
      and whether a FIPS/ANSI re-derivation is a prerequisite. This decision
      freezes Stages 0 and 1 against the repository parameter file. Stages
      2-4 stay unspecified. FIPS 186-4 and ANSI X9.62 were not opened, so
      they are not inputs.
    - >-
      subfield_scan.hexblob in the current tree already accepts an optional
      (0xN) suffix. The contract records that parser beside an independent
      parse. It does not treat the proposal's bug report as still true.
    - >-
      Eligible experiments still have no trial plan. EXP-BINSTD-becc4b was
      absent from the selector because runs/.gitkeep made the runs directory
      look occupied. This decision's commit removes that placeholder. The
      frozen specification of EXP-BINSTD-becc4b is unchanged, and that
      experiment still has no launcher.
  evidence_refs:
    - ledger/proposals/IDEA-20260922-7ab503.yaml
    - analysis/binstd-curve-audit/binary-curve-params.txt
    - analysis/binstd-curve-audit/subfield_scan.py
  limitations:
    - Approval authorises the test. It does not support H-BINSTD-42720d.
    - The normal-basis existence fact is a recalled ingredient. The run must exhibit a basis.
    - No Pareto improvement is claimed. The source frontier_check remains pending.
  next_actions:
    - >-
      Dispatch TASK-20261001-daf707 only after the TASK-20261001-be31d2
      receipt verifies.
    - Leave SAT stages undesigned until this certificate is retained or the instrument fails.
  knowledge_promotion:
