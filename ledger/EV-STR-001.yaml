evidence:
  id: EV-STR-001
  hypothesis_id: STR-H-001
  experiment_ids: [EXP-STR-001]
  run_ids: [RUN-STR-001-a]
  type: empirical
  direction: contradicts
  strength: preliminary
  validity_status: valid
  controls_outcome:
    positive_control: "PASS 36/36 (standard harvesting reproduced with AP filter disabled = frozen D={0} reading; enumeration integrity; Sage-vs-script arithmetic spot-checks exact; hit rate within [0.5,2]x of 1/n)"
    negative_control: "PASS 6/6 (random x-sets: direct AP-set enumeration equals closed form on all legs; sampling within 4 sigma where powered; 2 low-power legs at m=4 p in {1009,4099} carried by exact enumeration)"
  metrics:
    ap_hit_rate_vs_random: "per-tuple penalty (random/AP) medians 0.990/0.680 (p=211), 0.891/0.139 (p=1009), 0.700/0.315 (p=4099) for m=3/4: NO per-tuple collapse; 14/36 zero-AP-hit instances recorded (small supply x 16 targets)"
    ap_supply: "medians 28/8 (p=211), 124/40 (p=1009), 477/154 (p=4099) vs B = 15/32/64.5; supply/B = 1.77/0.48, 3.83/1.23, 7.41/2.41"
    yield_penalty: "C(B,m)/supply medians 17.5/214.9 (p=211), 41.9/924.5 (p=1009), 87.8/4128.6 (p=4099); grows with size and superlinearly in m"
    coverage: "AP sums cover 13.2/3.3 % (p=211), 11.8/3.9 % (p=1009), 11.1/3.8 % (p=4099) of the group vs 93-100% baseline; max multiplicity <= 3 (spread thin, not clustered)"
    displacement_rank_alpha: "classic (Z,Z^T) alpha = min(R,B) (generic maximum) in 32/35 measurable instances, identical to random baseline at every size (15/15, 9/9, 32/32, 64/64); x-space translation alpha_AP >= alpha_rand in 5/6 cells, alpha/B ~ 0.56-0.77, alpha/sqrt(B) rising 2.42 -> 6.10 (m=3): alpha grows ~linearly in B, faster than sqrt(B); NOT O(1)"
    solve_comparison: "25 verified Wiedemann solves on equal AP square matrices (0.4-6.5 ms, toy); structured-solve MODEL ops alpha^2*B*ceil(log2 B) with the smaller measured alpha = 4.9-39x the Wiedemann model ops 2*B^2*m, ratio growing with size"
  gate_arithmetic:
    la_share_wiedemann: "medians 0.016/0.015 (p=211), 0.005/0.030 (p=1009), 0.004/0.007 (p=4099): below the 10% clause at all sizes (toy relation stage dominates)"
    la_share_structured_model: "0.075/0.018, 0.090/0.165, 0.129/0.133: above 10% in 4/6 cells"
    relation_penalty_vs_threshold: "17.5x-4128.6x vs 1.5x threshold: failed at all three sizes, both m, trend worsening with size"
    disproof_track: "alpha ~ B (faster than sqrt(B)) AND AP penalty >= n/B at p >= 1009 (41.9 > 31.2, 87.8 > 63.3, 924.5 >> 31.2, 4128.6 >> 63.3): both candidate-stated disproof criteria met by the measurements"
  observations:
    - "The AP penalty is supply-side, not per-tuple: AP tuples hit at comparable per-tuple rates, but only supply << C(B,m) admissible AP tuples exist and their sums cover 3-13% of the group."
    - "The claimed translation symmetry of supports does not survive lifting: ~50% non-residue gaps in the x-interval FB break x-translation invariance, so the operator is not Toeplitz/Hankel-like (candidate's own obstruction #2 materialized)."
    - "AP relation matrices attain full ordinary rank B whenever supply >= ~1.2*B; obstruction is structural, not rank."
    - "m=4 at p=211: supply < B in 6/6 seeds (as low as 3 tuples); no square matrix possible without inflating B."
  inference: "Over the tested toy distribution (p in {211,1009,4099}, x-interval FB at B=ceil(sqrt(n)), D={1..64}, m in {3,4}, 6 seeds), AP-constrained relation supports produce relation matrices with generic-maximal displacement rank and a supply-side relation penalty of 17.5x-4128.6x vs standard harvesting; the promotion gate is not crossed at any size and both disproof-track criteria are met. No improvement meeting the predefined threshold was observed over the tested instances, parameters, solver, and resource budget."
  boundaries:
    - "Toy prime fields only (n <= 4139); toy != crypto-scale; does not establish any P-256 statement."
    - "Closes only the tested scope: these sizes, x-interval FB, B=ceil(sqrt(n)), D={1..64}, m in {3,4}; other FB rules, larger m, or non-interval shift sets are NOT covered."
    - "Structured-solve time is cost-model evaluation from measured alpha, not a measured superfast solve."
    - "Hit-rate penalties at small supply carry wide uncertainty (14/36 zero-hit instances recorded, not smoothed)."
  unresolved_confounds:
    - "Larger FB intervals or residue-filtered FBs could restore partial translation symmetry; untested."
    - "Per-tuple AP hit-rate slightly EXCEEDS random in several cells (penalty < 1); cause not isolated (small-target-sample noise vs mild algebraic bias)."
  deviations:
    - "p=4099/m=4 baseline enumeration sampled at 120000 cap (C(64,4)=635376); exact combinatorial totals used for yield arithmetic."
    - "D={0} positive control realized as AP-filter-disabled (frozen interpretation)."
    - "2 low-power negative-control sampling legs; exact direct-enumeration leg carries the control."
    - "Run history: 4 sage invocations, attempts 1-3 infrastructure failures (preparser Integer leaks, JSON coercer truncation) fixed; attempt 4 is the run of record; no timeout kill (29 s); runs used 4 <= budget 8."
  reviewed_by: coordinator
