    budget:
      wall_clock_seconds_per_arm: 3600
      maximum_memory_gb: 8
      new_decomposition_solves: 0    # arms 0 and 2 reuse existing relations
      network: none
    controls:
    - The configuration-model null object above (P3), the deciding control.
    - >-
      Known-false control: run the filtering stack on a relation set with a
      DELIBERATELY INSERTED known dependency and confirm the pipeline
      preserves it. A filter that destroys a known kernel vector is broken;
      this is the proves-too-much guard.
    - >-
      Identity control: filtering must never change the recovered logarithm
      on a known-answer cell. The certificate is re-verified with arithmetic
      independent of the filtering code.

  falsification_conditions:
  - F1: P1 and P2 both fail -- neither classical nor stratified filtering
      reduces end-to-end cost on any executable cell. The linear algebra
      column of the boundary table is then declared already tight for these
      sizes and the direction closes.
  - F2: P3 fails -- real and matched-random hypergraphs are
      indistinguishable. The graph framing carries no curve information; any
      gain is generic and belongs in the engineering column, not the
      research column.
  - F3: The stratified variant's extra decomposition cost exceeds its linear
      algebra saving at every tested split point, with the crossover (if any)
      outside the executable range.

  dominated_by: >-
    HONEST POSITION: on the FACTORING and FINITE-FIELD side this is
    completely dominated -- Cavallar-style filtering is standard, decades
    old, and implemented in every serious NFS code (CADO-NFS, msieve). This
    record claims NO novelty there and must never be read as proposing
    filtering as a new technique. What is NOT dominated, to this program's
    knowledge and subject to novelty_status below, is the MEASUREMENT on
    ECDLP relation sets specifically: whether a uniform-arity,
    subspace-defined factor base admits any of the gain, and whether the
    relation hypergraph is distinguishable from a degree-matched random one.
    If a novelty screen finds that measurement published, this record should
    be closed as dominated and the published numbers ingested via
    /curate-knowledge instead of re-measured.

  sota_delta: >-
    Against SOTA index calculus: ZERO asymptotic delta. No exponent moves,
    no heuristic is weakened, no curve becomes closer to broken. Against
    THIS PROGRAM'S boundary table: the delta is that the linear algebra
    column stops being an unoptimised incumbent, so every "index calculus
    loses to rho by factor X" statement gains a hardened X instead of a soft
    one. That is a measurement-quality improvement, not a cryptanalytic one,
    and the record should be ranked as such.

