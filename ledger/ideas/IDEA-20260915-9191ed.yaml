  proposed_by: idea-generator

  title: >-
    Treat the ECDLP relation set as a weighted hypergraph and import NFS
    filtering wholesale (singleton peeling, clique removal, spanning-tree
    merge, two-large-prime cycle finding) into the linear algebra phase --
    then measure the reduction against a DEGREE-MATCHED RANDOM hypergraph
    to find out whether elliptic structure contributes anything at all

  class: composition

  claim: >-
    THE CLAIM, IN ONE SENTENCE. The relations produced by Semaev/Gaudry-Diem
    point decomposition form a weighted hypergraph H (vertices = factor-base
    points, one hyperedge per relation, labelled by exponents mod the group
    order), the ECDLP linear algebra phase is exactly the kernel of H's
    incidence matrix, and therefore the ENTIRE NFS filtering stack -- which
    is pure graph reduction: degree-1 vertex peeling (singleton removal),
    dense-local-structure deletion (clique removal), weighted edge
    contraction with minimum-spanning-tree fill-in minimisation (Cavallar
    merge), and the large-prime variation as CYCLE FINDING in the ordinary
    graph whose edges are the weight-2 relations, with cycle count E - V + C
    per connected component -- applies to ECDLP relation sets verbatim, with
    no new mathematics. What is NOT known, and what this idea proposes to
    measure, is the SIZE of the effect here: NFS filtering buys roughly 2-3x
    matrix reduction on factoring/finite-field relation sets whose degree
    distribution comes from smoothness of integers, whereas an ECDLP factor
    base is a SUBSPACE-DEFINED SET OF POINTS with a decomposition relation
    of FIXED ARITY n (every relation is an (n+1)-uniform hyperedge, not a
    variable-support smooth factorisation). A uniform hypergraph has NO
    singletons to peel by construction and NO two-large-prime edges unless
    the factor base is deliberately split into small/large strata -- so the
    honest prior is that the classical filtering stack DEGENERATES on ECDLP
    relations and buys close to nothing, and that the interesting object is
    the stratified variant (split the factor base, allow relations with a
    bounded number of out-of-base points, recover them by cycle finding).
    THE DECISIVE MEASUREMENT IS THE NULL OBJECT: run the identical pipeline
    on a random (n+1)-uniform hypergraph with the SAME vertex count, edge
    count and degree distribution. If the reduction ratio, cycle yield and
    post-filter matrix weight are indistinguishable from the random control,
    then the elliptic curve contributed nothing to the graph and the framing
    is a lossy projection -- a cheap, genuine, publishable-internally
    negative that closes a direction this program would otherwise re-enter.
    This record asserts no speedup, claims no exponent, and is a candidate
    for the ranking, not evidence.

  mechanism: >-
    [M0 -- THE OBJECT.] Gaudry/Diem index calculus over F_{q^n}: factor base
    F = {P in E : x(P) in V} for a declared subspace V, decomposition
    R_j = sum_{i=1..n} P_{j,i} with P_{j,i} in F, found by solving the
    Semaev summation polynomial S_{n+1} after Weil descent. Each successful
    decomposition of a walk point R_j = a_j P + b_j Q yields one relation.
    Collect m > |F| relations, find a kernel vector mod ell, read off the
    logarithm. The linear algebra phase is the kernel computation and is the
    phase RQ-ICPERF-94c86e says must be costed in field operations and bytes.

    [M1 -- THE HYPERGRAPH.] Define H = (F, E) with one hyperedge e_j per
    relation, support(e_j) = {P_{j,1}, ..., P_{j,n}} union {the walk point's
    contribution}, weights = exponents. The incidence matrix of H IS the
    relation matrix. Every statement below is a statement about a matrix
    that this program already builds; nothing new is constructed, which is
    why the idea is cheap.

    [M2 -- THE CLASSICAL STACK, AND WHY IT MAY DEGENERATE HERE.] NFS
    filtering, in graph terms: (a) SINGLETON REMOVAL = repeatedly delete
    every degree-1 vertex and the unique edge containing it (that edge can
    never enter a dependency); (b) CLIQUE REMOVAL = delete relations sharing
    dense local structure; (c) MERGE = contract a degree-k vertex by
    combining its k edges, choosing the combination tree that minimises
    fill-in -- Cavallar's merge builds a MINIMUM SPANNING TREE on the
    weighted graph of those k edges, i.e. a literal Prim/Kruskal call inside
    a factoring pipeline; (d) LARGE-PRIME VARIATION = relations with exactly
    two large primes are ORDINARY EDGES between large-prime vertices, and a
    CYCLE in that graph multiplies to a large-prime-free relation, with the
    available cycle count given by E - V + C over connected components.
    THE DEGENERACY: (a) needs variable-support edges to produce singletons;
    an (n+1)-uniform hypergraph over a fixed factor base has a concentrated
    degree distribution and few. (d) needs a small/large prime stratification
    that an ECDLP factor base does not have unless one is IMPOSED. So the
    prediction is not "filtering helps"; it is "classical filtering nearly
    no-ops, and the stratified variant is the only live version".

    [M3 -- THE STRATIFIED VARIANT (the actual proposal).] Split F into
    F_small (the retained factor base) and allow decompositions to use up to
    t points OUTSIDE F_small, drawn from a larger pool F_large. Each such
    partial relation is a hyperedge on F_small plus t "large" vertices.
    t = 2 gives exactly the large-prime graph: an ordinary edge between two
    F_large vertices, and cycles in it are full relations on F_small alone.
    The trade is explicit and measurable: a larger effective factor base
    RAISES decomposition probability (each solve is more likely to succeed,
    the RQ-RELN-001 quantity) while the LINEAR ALGEBRA is done on the
    smaller F_small after cycle recovery. That trade is the whole content of
    the idea and it is a two-number measurement, not a theory.

    [M4 -- WHY THIS IS NOT AN EXPONENT CLAIM.] Filtering changes the CONSTANT
    and the matrix weight. It does not change the asymptotic exponent of
    index calculus on any curve family, and no part of this record should be
    read as claiming it does. Its value is that RQ-ICPERF-94c86e is building
    a boundary table whose linear algebra column is currently unoptimised,
    and an unoptimised column makes every "index calculus loses to rho by
    factor X" statement in this program soft by an unknown factor. Measuring
    the filtering gain HARDENS THE INCUMBENT SIDE OF THE COMPARISON. A
    negative result (filtering buys nothing on ECDLP relation sets) is
    equally useful and is the outcome M2 predicts.

  tracked_object: >-
    The relation hypergraph H of a completed toy ECDLP index-calculus run:
    its vertex degree distribution, connected-component structure, cycle
    space dimension E - V + C on the weight-2 stratum, and the post-filter
    matrix dimension and weight. This object is DERIVED, not new: it is a
    different reading of a matrix the ICPERF pipeline already produces.

  lossy_projection_test: >-
    Passing to H discards the elliptic curve entirely -- H remembers only
    which factor-base points co-occur in relations, not the group law, the
    subspace V, or the Semaev system that produced them. That is a LOSSY
    projection, and the loss is the whole risk: if the curve's arithmetic is
    what makes filtering pay, H cannot see it; if H alone predicts the gain,
    then the gain is combinatorial and available to ANY index calculus, which
    is precisely what the null-object control decides. The test is therefore
    not an afterthought -- it IS the experiment.

  null_object_control: >-
    A random (n+1)-uniform hypergraph on |F| vertices with the SAME edge
    count and the SAME degree distribution as the measured H, generated by
    configuration-model rewiring of H itself (so degrees match exactly, not
    approximately). The identical filtering pipeline runs on both. A second,
    stronger control: rewire only WITHIN connected components, which
    preserves component structure and isolates whether any gain comes from
    component structure rather than from finer curve-induced correlation.

  numbered_predictions:
  - id: P1
    statement: >-
      CLASSICAL FILTERING NEARLY NO-OPS. On unstratified ECDLP relation sets
      from the executable ICPERF cells, singleton removal deletes < 5% of
      relations and the total matrix-weight reduction from the full classical
      stack is < 1.15x -- materially less than the 2-3x NFS regime -- because
      the relation hypergraph is (n+1)-uniform.
    falsified_by: >-
      Measured reduction >= 1.5x from the unstratified stack, which would
      mean the ECDLP relation hypergraph carries variable-support structure
      this record's M2 reasoning says it does not have.
  - id: P2
    statement: >-
      THE STRATIFIED VARIANT IS THE LIVE ONE. With F split and t = 2
      out-of-base points permitted, the weight-2 relation graph has cycle
      space dimension E - V + C growing SUPERLINEARLY in the number of
      partial relations past a measurable threshold (the classical
      large-prime "cycle explosion"), and the recovered full relations reduce
      total end-to-end cost -- decomposition attempts PLUS linear algebra --
      below the unstratified pipeline on the same cell by a factor > 1.2.
    falsified_by: >-
      No cycle explosion within the declared budget, or an end-to-end cost
      ratio <= 1.0 (the stratification costs more in extra decomposition
      attempts than it saves in linear algebra).
  - id: P3
    statement: >-
      THE DECIDING MEASUREMENT. The reduction ratio, cycle yield and
      post-filter matrix weight on the real H differ from the
      degree-matched configuration-model control by more than the
      seed-to-seed spread of the control itself (>= 2 standard deviations
      over >= 20 rewirings).
    falsified_by: >-
      Indistinguishable from the control -- in which case the graph framing
      is confirmed as a lossy projection carrying no curve information, the
      gain (if any) is generic combinatorics, and this direction closes with
      a measured reason rather than a hunch.

  heuristic_assumptions:
  - id: HEUR-1
    formal_statement: >-
      For a factor base F defined by a subspace V and decompositions found by
      Semaev/Weil-descent solving, the co-occurrence pattern of factor-base
      points across independent relations behaves, for the purposes of
      filtering-stack performance, like a uniformly random (n+1)-uniform
      hypergraph with the same degree sequence.
    random_model_justification: >-
      Relations are produced from independently sampled pseudorandom walk
      points, and the solver returns whichever decomposition exists without
      reference to previously found relations, so no mechanism is known that
      would correlate the supports of distinct relations. This is a
      hypothesis to be TESTED BY P3, not an assumption the conclusions rest
      on -- P3 is literally its falsification test, and a refutation of
      HEUR-1 is the INTERESTING outcome (it would mean the curve leaves a
      combinatorial fingerprint in the relation hypergraph).
    falsification_condition: P3 separating real H from the matched control.
    validation_plan: P3.

  test_boundary:
    instances: >-
      Relation sets from the executable ICPERF cells only -- binary
      extension n <= 41 with PDP at l <= 8, and the (n,l) in {(15,5),(17,6),
