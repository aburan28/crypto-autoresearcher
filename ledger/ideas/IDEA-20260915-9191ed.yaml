  interpretation_limits:
  - >-
    Any measured gain is scoped to the tested cells, factor-base
    construction, solver and filtering implementation. Toy-scale filtering
    behaviour is KNOWN to differ from large-scale behaviour in NFS (cycle
    explosion is an asymptotic phenomenon with a threshold), so a null
    result at n <= 41 does not close the stratified variant at scale -- it
    closes it AT THE TESTED SCALE, and the record must say so.
  - >-
    A gain in matrix weight is not a gain in ECDLP security margin. The
    end-to-end comparison against matched rho is the only statement with
    security content, and it stays with RQ-ICPERF-94c86e's boundary table.
  - >-
    P3 failing (indistinguishable from random) is a statement about the
    FILTERING-RELEVANT statistics only. It does not say the relation
    hypergraph is random in every respect.

