idea:
  id: IDEA-20260824-95d8d8
  question_id: RQ-ECQ-e9b361
  goal_id: GOAL-ECQ-2298dc
  title: >-
    Price the record: measure the tail of `extra` and turn "how much search buys +1
    rank" into a number with an error bar
  class: measurement

  claim: >-
    For a fixed non-isotrivial family E/Q(t) of generic rank r, define
    extra(t) = rank E_t(Q) - r over rational t in a declared box. Then
    log P(extra >= k) is approximately linear in k over the measurable range
    k = 1..6, with a family-dependent slope beta, and the number of specialisations
    that must be searched for extra >= k scales as exp(beta*k) times a
    certification-cost factor. Falsifiable: fit beta on k = 1..4 in a training box,
    predict the count at k = 5 and k = 6 in a held-out box, and check the prediction
    within a factor of 3. If the tail is not log-linear the model is wrong and the
    campaign has no cost model; if it is, the record ladder's own numbers
    (17 + 11 = 28 in 2006, 17 + 12 = 29 in 2024, and 17 + 14 = 31 in 2026 if
    IDEA-20260824-155411 confirms the base) become an extrapolation with a stated
    error, and the price of +1 is known rather than guessed.

  mechanism: >-
    THE SINGLE MOST IMPORTANT COST NUMBER FOR THIS CAMPAIGN IS THE GAP BETWEEN
    GENERIC RANK AND RECORD RANK, and nobody in this program has measured its
    distribution. The published ladder gives three or four points of it and no
    density. The gap is not mysterious - a specialisation of a family of generic
    rank r has rank at least r by Silverman, and the excess is the rank of the
    quotient, which behaves like the rank of a "random" curve conditioned on the
    family's local data. Under any of the standard heuristics for rank
    distributions, the probability of a large excess decays at least geometrically,
    which is what makes each +1 cost a constant factor more search than the last -
    and it is why the record moved by 1 in 18 years and then by 2 in three days when
    a much larger compute budget arrived.
    Measuring beta on families this program can afford (the rank-8 pencil, the
    rank-12 and rank-13 Mestre families) and checking whether beta depends on r, on
    the height box, and on chi, converts the campaign's central question - "can we
    close a gap of 15 from base 17, or of 0 from base 32" - from rhetoric into
    arithmetic.

  tracked_object: >-
    extra(t), one non-negative integer per specialisation, and its empirical
    survival function P(extra >= k) as a function of the height box.

  lossy_projection_test: >-
    PASSES. The projection E_t -> extra(t) discards the curve, its points, its
    conductor and its height, retaining one integer that is defined RELATIVE to the
    family. It is compatible with the operation the search performs - varying t -
    because the generic subgroup specialises uniformly and extra is exactly what is
    left. It is non-injective in the extreme, and the loss is the point - the
    distribution of extra is a property of the family, which is the object a search
    plan must reason about, not of any curve.

  novelty_status: unverified
  novelty_note: >-
    Rank distributions in families are heavily studied and a published measurement of
    this exact quantity for the record families may well exist; retrieval this
    session did not find one, and did not find any cost figure for any record search
    at all. The Simons/ICERM item gives the method for rank 29 and no candidate count
    or CPU time; the ICARM news item for rank 30 gives neither method nor cost.
    THAT ABSENCE IS ITSELF RECORDED AS A FINDING - the public record contains no
    search-cost figure for any of the four most recent rank records.

  citations:
    - ref: "https://simonscollab.icerm.brown.edu/2024/08/record-breaking-elliptic-curve/"
      provenance: retrieved
      claim: >-
        For the rank-29 curve, the search looked "for points outside the fibration's
        generic rank 17 subgroup of rational points; for the new curve this search
        found 12 more independent points", i.e. extra = 12. The page gives NO number
        of candidates evaluated and NO CPU time.
      verified_by: "idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)"
    - ref: "arXiv:0709.2908"
      provenance: retrieved
      claim: >-
        For the rank-28 curve - "Specialization of the rank-17 surface also yields
        several examples of elliptic curves over Q with more than 24 independent
        rational points, including a curve of rank at least 28", i.e. extra = 11;
        and Mestre's heuristic is described as needing "literally thousands of
        primes" and canvassing "many millions of specializations E_t". That phrase is
        the ONLY order-of-magnitude search figure retrieved for any record.
      verified_by: "idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)"
    - ref: "https://icarm.io/news/new-record-breaking-elliptic-curve-reported/"
      provenance: retrieved
      claim: >-
        The rank-30 announcement gives the submission date (2026-08-20) and the
        verification policy and states NO method, NO family, NO Q(t) rank, NO sieve
        description and NO cost. Recorded as an absence, not filled in.
      verified_by: "idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)"
    - ref: "KN-FIND-6b3e17"
      provenance: internal
      claim: >-
        Supplies a fully measured instance of the same distribution at small scale -
        rank histogram over 137 certified fibres of a generic-rank-8 pencil is
        8 for 93, 9 for 14, 10 for 17, 11 for 12, 12 for 1, i.e. extra survival
        counts 44, 30, 13, 1 for k = 1, 2, 3, 4 out of 137. Also supplies the
        measured cost - 1.028 ms per Mestre-Nagao score and about 7.5 s per descent,
        with certification and not scoring identified as the binding cost, and a
        60 percent descent-timeout rate at larger height.
      verified_by: "idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)"
    - ref: "EV-ECQ-8ee697"
      provenance: internal
      claim: >-
        Supplies a second measured slice, by height band rather than by k - empirical
        P(certified rank >= 12) per searched fibre of a ceiling-at-least-13 Mestre
        family is 0.002 at naive height in [80, 90], 0.006 at [90, 100] and 0.044 at
        [100, 120]. THE RATE RISES STEEPLY WITH HEIGHT, which is the second axis this
        idea must model and which a k-only model would miss.
      verified_by: "idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)"

  assumptions:
    - >-
      Certified rank is a LOWER bound throughout, so every measured extra is a lower
      bound and the survival function is a lower bound. Descent timeouts censor the
      sample upward-blindly and must be modelled, not ignored - this program has
      already measured that the censoring is driven by coefficient size and is
      nearly orthogonal to the Mestre-Nagao score.

  proof_search_map:
    not_applicable_reason: >-
      Measurement proposal, not proof-oriented. No theorem, no certificate, no
      asymptotic claim about an algorithm. Baseline reproduction is nonetheless
      specified below because the fit must reproduce the already-measured rank-8
      histogram.
    bottleneck: null
    baseline_embedding:
      parameter_slice: >-
        The 137-fibre histogram of KN-FIND-6b3e17. The fitted survival function must
        reproduce it within its own Poisson error.
      reproduction_check: >-
        frozen fixture with the fitted beta and its bootstrap interval
    observation_collision:
      observable: >-
        the survival counts at k = 1..4
      distinct_preimage_search: >-
        Two families with identical survival counts at small k but different
        behaviour at large k. Expected; the honest consequence is that beta must be
        reported with an interval and that extrapolation beyond the measured k is
        labelled as extrapolation everywhere it appears.
    constructive_transforms:
      - transform: telescoping_potential
        proposed_object: >-
          Charge the cost of each +1 of rank to a single multiplicative factor
          exp(beta), making the total search cost for extra >= k a product of
          per-step costs rather than an unstructured search.
        predicted_gain: >-
          A defensible cost model - the campaign can then state what compute would be
          needed for +1 instead of asserting it is or is not feasible.
    quantifier_order: >-
      FOR THIS family and FOR THIS height box, the survival function has fitted slope
      beta with interval I. No uniformity over families is claimed and none is
      tested; a claim of the form "beta is the same for all families" would be a
      different and much stronger statement.
    method_ceiling:
      strongest_certifiable_claim: >-
        A cost model with an error bar for the specific families measured, plus a
        measured dependence of beta on r, chi and height band. It cannot predict the
        record holders' cost, because their family and box are unknown.
      nearby_object_control: >-
        Random curves at matched naive height, which have no family and hence no
        generic subgroup - their rank distribution is the k = 0 baseline the survival
        function must sit above. This program's existing random-curve null is a
        TRUNCATED BOUND at n = 79 (EV-ECQ-8ee697 UC-2) and completing it to the
        intended n = 200 is a required component of this idea.

  predictions:
    - metric: >-
        fitted slope beta of log P(extra >= k) on k = 1..4, per family
      direction: different
      minimum_effect: >-
        reported with a bootstrap interval; a fit whose interval spans zero means no
        geometric decay is detected and the model is refused
    - metric: >-
        ratio of predicted to observed count at k = 5 and k = 6 in the held-out box
      direction: lower
      minimum_effect: >-
        within a factor of 3, or the log-linear model is falsified
    - metric: >-
        dependence of beta on naive height band
      direction: different
      minimum_effect: >-
        EV-ECQ-8ee697 already measured a factor-22 rise in the rank-12 rate from
        height band [80,90] to [100,120]; if beta is height-independent that
        measurement contradicts this model and the model loses
    - metric: >-
        implied specialisation count for extra = 15 from base rank 17
      direction: higher
      minimum_effect: >-
        reported as an extrapolation with its interval, explicitly labelled as
        extrapolating 9 to 11 units of k beyond the measured range - which is a very
        long way and must be stated as such

  minimal_test:
    design: >-
      (1) Take three families of known generic rank - the rank-8 pencil, a Mestre
      family of ceiling 13 with exhibited generic rank, and one further family - and
      a declared height box for t.
      (2) Search a training set of specialisations, certify rank lower bounds by
      exhibited points and reduction-map independence (never by descent alone, to
      avoid the timeout censoring), and record extra(t) with the height and the
      Mestre-Nagao score.
      (3) Fit log P(extra >= k) on k = 1..4; bootstrap the slope.
      (4) Predict counts at k = 5, 6 in a DISJOINT held-out box declared before the
      fit, and compare.
      (5) Complete the random-curve null to n = 200 at three matched height bands.
      (6) Report the implied cost of extra = 15 as an extrapolation with its
      interval and with the extrapolation distance stated.
    controls:
      - >-
        Random-curve null at matched height, completed to n = 200 - the k = 0
        baseline without which "extra is impressive" is uninterpretable.
      - >-
        Held-out box declared before fitting, so the check is a prediction rather
        than a fit statistic.
      - >-
        Censoring control - report the certification-failure rate by height band and
        show that the survival function is computed only over successfully certified
        fibres, with the failure rate stated beside every count.
    required_metrics:
      - >-
        per-fibre (t, height, Mestre-Nagao score, certified extra, certification
        method, wall clock)
      - >-
        survival counts and fitted beta with bootstrap interval, per family
      - >-
        predicted versus observed counts at k = 5, 6 in the held-out box
      - >-
        random-curve null rank histogram at n = 200 by height band
      - >-
        certification-failure rate by height band

  falsification_conditions:
    - >-
      The held-out prediction misses by more than a factor of 3 at k = 5 or k = 6.
      The log-linear model is refused and the campaign has no cost model from this
      route.
    - >-
      The fitted beta's bootstrap interval spans zero. No geometric decay is
      detected at the tested scale.
    - >-
      The random-curve null reaches the same survival counts as the family. Then
      extra is not a family effect at all and the whole framing is wrong.

  confounders:
    - >-
      Height and k are entangled - the rate of high rank rises steeply with height
      (measured factor 22 across three bands in EV-ECQ-8ee697), so a survival
      function pooled over a wide height box measures the height distribution of the
      box as much as the family. Stratify by height band and report both.
    - >-
      Certification method changes the answer - descent censors by coefficient size
      (Spearman of log|a6| against timeout equals +0.765) and point search censors by
      search depth. Fix one method per stratum and report it.
    - >-
      Selection on the Mestre-Nagao score inside the training set would bias the
      survival function upward; the training set must be a declared box sampled
      without score selection, with score-selected arms reported separately.

  interpretation_limits:
    - >-
      Every number is scoped to the measured families, the declared boxes, the
      certification method and the machine. Nothing transfers to the record holders'
      unknown family.
    - >-
      Extrapolating from k = 4 to k = 15 crosses 11 units. The extrapolation is
      reported because the campaign needs a number, and it is labelled at every
      appearance as an extrapolation of that distance, which is the honest way to
      present a figure nobody can currently check.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a fixed non-isotrivial family of generic rank r and a fixed height band,
        P(extra >= k) decays geometrically in k with a family-and-band-dependent
        rate, in imitation of the classical picture in which ranks of curves in a
        family behave like an integer random variable with geometric or faster tails
        (the Katz-Sarnak and Goldfeld heuristics, and the Poonen-Rains style
        Selmer-group models that predict rapidly decaying rank tails).
      rigorous_support: >-
        None of these is a theorem for the excess in a fixed family; the rigorous
        anchor is only Silverman's specialisation theorem, which gives extra >= 0 for
        all but finitely many t and says nothing about the tail. The heuristic is
        therefore doing real work and is labelled as the load-bearing assumption of
        the cost model.
      validation_plan: >-
        Directly measure the survival function at k = 1..6 on at least three families
        and at least three height bands, with at least 2000 certified fibres per
        stratum; compare against the geometric fit by a held-out prediction at k = 5
        and 6; tail check by comparing the largest observed extra against the
        geometric prediction at that sample size. Sampled parameters (family, box,
        certification method, machine) recorded with every stratum. Transfer
        assumption stated - that a rate measured at r = 8 to 13 and chi at most 2
        transfers to r = 17 and chi = 2 is NOT established, and the experiment
        measures the r-dependence explicitly so that the transfer can be judged
        rather than assumed.

  target_complexity:
    time_exponent: >-
      Dominated by certification. At the measured 7.5 s per descent on the cheap
      fixture and with point-search certification substituted at larger height,
      2000 certified fibres per stratum times 9 strata is of order 40 core-hours,
      plus the n = 200 null.
    memory_exponent: >-
      negligible
    best_known: >-
      No published measurement of this distribution for any record family was found;
      no published search-cost figure exists for any of the last four records. The
      only public order of magnitude is Elkies' phrase "many millions of
      specializations".
    hidden_overhead: >-
      Certification failure rates rise with height exactly where the interesting
      fibres are, so the effective sample at large k is much smaller than the nominal
      one. Reported per stratum.
    tradeoff_note: >-
      Embarrassingly parallel over t.

  null_object_control: >-
    Random curves at matched naive height, completed to n = 200 across three bands.
    This program's existing version is a truncated bound at n = 79 and is explicitly
    recorded as insufficient (EV-ECQ-8ee697 UC-2); completing it is part of this
    idea and is a prerequisite for interpreting any survival function.

  reach_to_32: >-
    It does not reach 32. It says what reaching 32 would cost from any given base
    rank, which is the number the campaign must have before choosing between the
    sieve lever and the base-rank lever. Its most likely honest output is that
    closing extra = 15 from base 17 is far outside this program's compute, which
    would be a decisive argument for spending everything on the base-rank ideas.

  dominated_by: >-
    n/a (no result claimed) on rank. On the cost-model axis there is no published
    competitor to compare against - the search returned no cost figure for any
    record - so the frontier rows for time, memory and queries are recorded as
    not-applicable rather than as an unchecked null.
  sota_delta: >-
    No rank claim. Contribution is a measured survival function and a priced +1,
    against a public record that currently contains no cost figure at all.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
