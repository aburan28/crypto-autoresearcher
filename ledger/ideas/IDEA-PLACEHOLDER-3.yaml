idea:
  id: IDEA-PLACEHOLDER-3
  question_id: RQ-ECQ-e9b361
  goal_id: GOAL-ECQ-2298dc
  title: >-
    Twist-rank census over quadratic base changes of the record fibration: the only
    Galois-clean rank amplifier over Q(t), and its distribution has never been measured
  class: algorithm

  claim: >-
    Let E/Q(v) be the rank-17 elliptic K3 fibration behind the rank-28 and rank-29
    records, and for a squarefree D(v) of degree 1 or 2 over Q let phi_D : P^1_u ->
    P^1_v be the double cover branched at the roots of D. Then
    rank (phi_D^* E)(Q(u)) = rank E(Q(v)) + rank E^{(D)}(Q(v)) = 17 + r(D),
    on a surface of arithmetic genus chi = 4 whose Shioda-Tate ceiling is at most
    38 - sum(m_v - 1), so r(D) = 15 is not excluded by any known bound.
    THE CLAIM UNDER TEST IS THE DISTRIBUTION OF r(D), not its maximum: over a
    3-parameter box of D (two branch points and a square class), the empirical
    distribution of r(D) has a measured maximum, and that maximum is either <= 2 -
    in which case Elkies' recorded +1 (17 -> 18 over Q(t)) is typical and this lever
    is quantified and closed at this scope - or >= 3, in which case the lever is
    live and the box should be enlarged toward r(D) = 15.

  mechanism: >-
    Over Q(t) there is exactly one rank amplifier with no Galois-descent
    obstruction, and it is the quadratic one. For a cyclic base change of degree n,
    the Mordell-Weil group of the pullback decomposes over Q into isotypic pieces
    indexed by the characters of Z/nZ; for n > 2 those characters are not
    Q-rational, Galois permutes the eigenspaces, and only the invariants descend -
    which is exactly why Shioda's rank-68 surface y^2 = x^3 + t^360 + 1 needs a
    field of definition of degree 829,440 for its Mordell-Weil group while its
    equation sits over Q(t). For n = 2 both characters are rational, the
    decomposition is defined over Q, and the whole of rank E + rank E^{(D)} descends.
    So: geometric rank 68 exists and is unreachable over Q(t); the record over Q(t)
    is 18; and the one construction that provably carries rank across the descent is
    the quadratic base change. Elkies used it once, gaining +1 (17 over Q(t) -> 18
    over Q(t), the standing world record for generic rank).
    The generic behaviour is known and is against us: for a quadratic base change of
    a rational elliptic surface, rk MW of the base change EQUALS rk MW of the
    original for generic parameter values, and can only increase at special ones. So
    r(D) = 0 is the default and the whole question is the shape of the tail. NOBODY
    HAS PUBLISHED THAT DISTRIBUTION, and Elkies' single +1 is one draw. The
    experiment measures the draw distribution.

  tracked_object: >-
    r(D) = rank E^{(D)}(Q(v)), the Mordell-Weil rank of the quadratic twist of a
    FIXED high-rank surface, as a function of the twisting divisor D - i.e. the
    minus-eigenspace of the base change, tracked as a function on the 3-dimensional
    space of branch data.

  lossy_projection_test: >-
    PASSES. The projection (E, D) |-> r(D) discards the surface, its sections, its
    fibre configuration and the twisted surface's entire geometry, retaining one
    non-negative integer per D. It is compatible with the operation that matters -
    base change - because the eigenspace decomposition MW(phi_D^* E) ⊗ Q =
    MW(E) ⊗ Q  ⊕  MW(E^{(D)}) ⊗ Q is functorial: the retained integer determines the
    base-changed rank given the fixed 17, deterministically, with no further data.
    It is heavily non-injective: infinitely many D share any value of r, and r
    forgets which sections appear. That is the loss, and it is what makes the
    3-parameter space searchable at all.

  novelty_status: unverified
  novelty_note: >-
    The base-change/eigenspace decomposition is standard and is marked `recalled`
    below because this session did NOT open a source stating it as a displayed
    theorem - the retrieved source (Kimura) states only the inequality
    rk MW(S) >= rk MW(X) with equality generically. The census of r(D) over a
    parameter box is not something retrieval found published, but absence of a
    search hit is not evidence of absence (AGENTS.md knowledge-retrieval bound), and
    Elkies plainly examined at least one D. Honest label: unverified. First action
    of any implementing task is to retrieve a displayed statement of the
    decomposition and to search for a published twist-rank census.

  citations:
    - ref: arXiv:1802.05195
      provenance: retrieved
      claim: >-
        For an elliptic K3 surface S obtained by quadratic base change of a rational
        elliptic surface X: "rk MW(S) >= rk MW(X)", and "the Mordell-Weil rank of the
        K3 surface S is equal to the rank of the Mordell-Weil group of the original
        rational elliptic surface X for generic values of the parameters". THIS IS
        THE PRIOR AGAINST THE IDEA and is recorded as such: the default outcome is
        r(D) = 0.
      verified_by: idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)
    - ref: "MW(phi^* E) ⊗ Q = MW(E) ⊗ Q ⊕ MW(E^{(D)}) ⊗ Q for a quadratic base change"
      provenance: recalled
      claim: >-
        The eigenspace decomposition of the Mordell-Weil group of a quadratic base
        change into the untwisted and twisted parts. Standard in the elliptic-surface
        literature (Shioda; Schuett-Shioda survey, arXiv:0907.0298, sections on base
        change and quadratic twisting). NOT OPENED THIS SESSION - a fetch of the
        survey returned only the fibre-type interchange I_n <-> I_n*, II <-> IV*,
        III <-> III*, IV <-> II* and no displayed rank formula. This citation is a
        pointer for a reviewer and supports nothing until retrieved.
      verified_by: null
    - ref: arXiv:0709.2908
      provenance: retrieved
      claim: >-
        Elkies: MW rank of E/F(t) is at most 10d - 2; the rank-17 elliptic K3 over
        Q(t) from the N = 6*79 Shimura curve; "It also yields the new records of 18
        for the Mordell-Weil rank of a nonconstant elliptic curve over Q(T)"; and
        "there are no elliptic K3 surfaces of Mordell-Weil rank 18 over Q", proved by
        observing that the required positive-definite rank-18 lattice of discriminant
        163 with minimal norm >= 4 would have broken the sphere-packing density record
        in R^18. Quotes as returned by a summarising fetch of the ar5iv rendering.
      verified_by: idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)
    - ref: https://web.math.pmf.unizg.hr/~duje/tors/generic.html
      provenance: retrieved
      claim: >-
        Dujella's table of best known generic ranks over Q(t) by torsion group:
        trivial torsion G(0) >= 18, Elkies 2006, which is the overall record; Z/2Z
        11; Z/3Z 7; Z/2Z x Z/2Z 7; all others smaller.
      verified_by: idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)
    - ref: "arXiv:2601.17182 (and arXiv:2512.25009)"
      provenance: retrieved
      claim: >-
        Shioda's surface y^2 = x^3 + t^360 + 1 has Mordell-Weil rank 68, "currently
        the elliptic surface with the highest known rank"; the field of definition of
        that Mordell-Weil group is a number field of degree 829,440; the lattice
        decomposes into 10 rational elliptic surfaces of ranks 2,2,4,4,4,6,6,8,8,8
        and one K3 of rank 16. This is the quantitative statement of the
        Galois-descent obstruction the quadratic case avoids.
      verified_by: idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)

  assumptions:
    - The explicit rank-17 fibration is in hand (shared HARD DEPENDENCY with
      IDEA-PLACEHOLDER-1). If it cannot be retrieved, run the identical census on a
      substitute: Kuwata's explicit elliptic K3s over Q of geometric MW rank 16, 17,
      18, or on this program's own rank-8 pencil, and report the census for whatever
      base was actually used.
    - The generic-rank oracle of IDEA-PLACEHOLDER-2 is calibrated, or a slower exact
      screen is substituted and the box shrunk accordingly.

  proof_search_map:
    bottleneck: >-
      r(D): the rank of the quadratic twist of a fixed high-rank elliptic surface.
      Everything else in the route from 17 to 32 over Q(t) is bookkeeping; this one
      integer is what has to move.
    baseline_embedding:
      parameter_slice: >-
        Elkies' own D, the one that took 17 to 18 over Q(t), must appear in the box
        and must score r = 1. That is the exact old-method boundary and the
        proposal is a strict family extension of it.
      reproduction_check: >-
        Frozen fixture: (Elkies D, r = 1, exhibited generic section of the twisted
        surface). If the census cannot reproduce r = 1 there, no number from it is
        interpretable.
    observation_collision:
      observable: >-
        The Nagao score of the twisted family, S_X(E^{(D)}), standing in for r(D).
      distinct_preimage_search: >-
        Search for pairs D, D' with |S_X(E^{(D)}) - S_X(E^{(D')})| below the
        calibrated residual but with different exact r. Expected to exist; the
        consequence is that the census reports a SHORTLIST plus exact confirmation
        on the shortlist, never a distribution of exact ranks.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "find a Q(t)-family of rank >= 32" by "find one twisting divisor D
          with r(D) >= 15", moving the problem from a
          high-dimensional equation search to a 3-parameter scan against a cheap
          scalar statistic.
        predicted_gain: >-
          The search space drops from the space of elliptic surfaces to
          (v0, v1, c) in Q^2 x Q*/(Q*)^2, which is enumerable to any height the
          budget allows.
      - transform: boundary_lift
        proposed_object: >-
          The known boundary is r = 1 (Elkies). The lift is a strict inward
          improvement - some D with r >= 2 - not merely a feasibility statement.
        predicted_gain: >-
          Any D with r(D) >= 2 is a NEW WORLD RECORD for generic rank over Q(t)
          (19 versus Elkies' 18), independently of rank 32.
    quantifier_order: >-
      THERE EXISTS D squarefree of degree <= 2 over Q such that
      rank E^{(D)}(Q(v)) >= 15. The experiment tests the bounded version: FOR ALL D
      in an explicitly declared height box, measure r(D). A negative is a
      bounded-search negative over that box and nothing more - the same discipline
      EV-ECQ-8ee697 B-2 imposes.
    method_ceiling:
      strongest_certifiable_claim: >-
        rank >= 17 + r_max over Q(u) for the best D found, hence rank >= 17 + r_max
        over Q for all but finitely many rational u. If r_max = 15 this settles the
        campaign outright with no sieving at all. If r_max = 2 it is a world record
        for generic rank over Q(t) and no progress on rank over Q beyond +1 to the
        record ladder's base.
      nearby_object_control: >-
        Run the identical census with E replaced by a random degree-matched chi = 2
        family of generic rank 0. There, 0 + r(D) is the whole rank and the twisted
        ranks should be indistinguishable in distribution from the ones measured on
        the record fibration. IF THEY ARE NOT - if the record fibration's twists are
        systematically higher - that is itself a finding about the surface. If they
        ARE identical, then r(D) is a property of the twist alone and choosing a
        better base surface buys nothing on this axis.
    proof_obligations:
      - claim: eigenspace decomposition of the base change over Q
        responsibility: baseline
      - claim: Shioda-Tate ceiling of the base-changed chi = 4 surface, computed from its own fibre configuration
        responsibility: size
      - claim: r(D) measured with a calibrated residual over a declared box
        responsibility: feasibility
      - claim: exhibited generic sections for any D claimed to have r(D) >= 2
        responsibility: correctness
      - claim: Silverman specialisation transfers the generic rank to almost all u in Q
        responsibility: interface

  predictions:
    - metric: max over the declared box of exact r(D)
      direction: higher
      minimum_effect: >-
        >= 2 for the lever to be live (and that alone is a Q(t) world record);
        >= 15 for the campaign target. <= 1 quantifies the obstruction.
    - metric: fraction of D in the box with r(D) = 0
      direction: higher
      minimum_effect: >-
        Predicted > 0.9 by the cited generic-equality result; a measured value below
        0.5 contradicts the retrieved prior and is the more interesting outcome.
    - metric: Shioda-Tate ceiling of the base-changed surface for the best D
      direction: higher
      minimum_effect: >-
        Must be >= 17 + r(D); if the base change forces reducible fibres that pull
        the ceiling below 32, the route is capped and the cap is the closure.
    - metric: difference in the r(D) distribution between the record fibration and a rank-0 null base
      direction: different
      minimum_effect: "no difference is the null result and is itself informative"

  minimal_test:
    design: >-
      1. Compute the fibre configuration of the base-changed surface symbolically for
      a generic D and record sum(m_v - 1) and the Shioda-Tate ceiling at chi = 4,
      with the Euler check sum(deg * v(Delta)) = 48 = 12 * chi. If the ceiling is
      below 32 for ALL D, the route is closed before any scan runs, and that is the
      cheapest possible outcome.
      2. Enumerate D = c(v - v0)(v - v1) and D = c(v - v0) with v0, v1 rationals of
      height <= H and c squarefree with |c| <= C; declare H and C in the contract.
      3. Score every D with the calibrated Nagao oracle applied to E^{(D)}.
      4. Take the top 100 by score and attempt an EXACT determination of r(D) by
      symbolic section search on the twisted chi = 3 surface, plus a Shioda-Tate
      upper bound from its own fibre configuration; retain only D where the two meet.
      5. For the best D, construct the base-changed family, exhibit 17 + r(D)
      independent generic sections, specialise at several rational u, and certify the
      specialised rank over Q by exhibited points and reduction-map independence.
    controls:
      - Positive: Elkies' D must be recovered with r = 1.
      - Null object: the identical census over a rank-0 degree-matched base surface.
      - Null object 2: the identical census over this program's rank-8 pencil, where
        the twisted surface is chi = 2 and r(D) is exactly computable, giving a
        stratum where the oracle's error is measurable rather than assumed.
      - Decay control: the measured r(D) distribution must shift toward 0 as the
        height of D grows. A distribution that does not decay with height is the
        canonical artifact tell.
    required_metrics:
      - full histogram of scores and of exact r(D) on the shortlist
      - max r(D) with the exhibited sections for the maximiser
      - Shioda-Tate ceiling of the base-changed surface, per D on the shortlist
      - box definition (H, C) and total D count, with coverage fraction if truncated
      - wall clock, RSS, and every truncation, reported as an infrastructure outcome

  falsification_conditions:
    - Elkies' D is not recovered at r = 1. Instrument or transcription failure; no
      negative may be reported.
    - The base-changed surface's Shioda-Tate ceiling is < 32 for every admissible D.
      The route to 32 by ONE quadratic base change of this surface is closed, with a
      named, measured obstruction, and the forward question becomes whether two
      iterated base changes (chi = 8, ceiling <= 78) evade it.
    - max r(D) over a box of at least 10^4 admissible D, with the oracle calibrated
      to detect r = 4 on the control, is <= 1. Then Elkies' +1 is typical, the
      amplifier is measured, and the honest statement is that this lever yields
      generic rank 18 and no more over the tested box.
    - The null base's r(D) distribution matches the record fibration's. Then r(D) is
      independent of the base and no choice of base surface helps.

  confounders:
    - Squarefreeness and coprimality of D against the discriminant: a D sharing roots
      with Delta changes the fibre types (I_n <-> I_n*) rather than adding sections,
      and would inflate or deflate the ceiling. The scan must stratify by
      gcd(D, Delta) and report both strata.
    - The twisted surface is chi = 3 and its specialisations have much larger height
      than the base surface's; any DESCENT-based confirmation will time out
      preferentially on the interesting cases, which is the censoring mechanism
      already measured in this program (Spearman(log|a6|, timeout) = +0.765,
      KN-FIND-6b3e17). Confirmation must be by exhibited sections, not by descent.
    - Coefficient content: the twisted family's coefficients grow with the height of
      D, so a wall-clock cap selects against large-height D exactly where an
      exceptional twist is most likely to live. Cost must be measured per stratum.

  interpretation_limits:
    - Every negative is bounded by the declared box and by the oracle's residual, and
      may not be stated as a property of the construction.
    - A large r(D) found by the oracle is NOT a rank until sections are exhibited.
    - Even a full success gives rank >= 32 over Q(t) and hence over Q for almost all
      u; producing the actual record curve then requires choosing a u where the
      specialised points are independent and certifying them, which is a further
      (easy, finite, exact) step and must be done before any claim.

  heuristic_assumptions:
    - id: H1
      statement: >-
        r(D) = rank E^{(D)}(Q(v)), for D drawn uniformly from squarefree divisors of
        bounded height, has a distribution concentrated at 0 with a tail
        P(r(D) >= k) decaying at least geometrically in k, in imitation of the
        Goldfeld/Katz-Sarnak picture for ranks of quadratic twists of a fixed
        elliptic curve over Q, transported to the function-field setting.
      rigorous_support: >-
        The retrieved statement that quadratic base change preserves MW rank for
        generic parameter values (arXiv:1802.05195) is the rigorous half: it fixes
        the mode of the distribution at 0. The tail shape is the imitated classical
        statement and is NOT proved here.
      validation_plan: >-
        Measure P(r(D) >= k) for k = 0, 1, 2, 3 directly on the rank-8 pencil, where
        the twisted surface is chi = 2 and r(D) is EXACTLY computable by symbolic
        section search at a cost of seconds. Sample at least 5000 D at three height
        scales. Compare the empirical log P against a geometric fit and report the
        fitted decay rate with a bootstrap interval. Tail check: the largest r
        observed against the geometric prediction at that sample size. Transfer
        assumption, stated explicitly: that the decay rate measured on a chi = 1 base
        transfers to the chi = 2 record fibration. THIS TRANSFER IS UNJUSTIFIED and
        is exactly what the main census measures, so H1 is used only to size the box,
        never to interpret the result.
    - id: H2
      statement: >-
        The Nagao oracle's residual measured in IDEA-PLACEHOLDER-2 applies to the
        twisted families E^{(D)} at chi = 3.
      rigorous_support: >-
        None; pure transfer. The calibration set of IDEA-PLACEHOLDER-2 must include
        chi = 3 twisted families of known rank, or this census's shortlist threshold
        must be set conservatively low and the exact stage made to carry the weight.
      validation_plan: >-
        Include at least 20 twisted families of exactly known rank at chi = 3 in the
        calibration set; report the chi = 3 residual separately; if it exceeds the
        chi <= 2 residual by more than a factor of 2, lower the shortlist threshold
        by that factor and report the increased exact-stage cost.

  target_complexity:
    time_exponent: >-
      Screening: |box| * (oracle cost) = 10^4 * 10 s ~ 30 core-hours. Exact stage:
      100 symbolic section searches at chi = 3, minutes to hours each, so 10-100
      core-hours. Total order 10^2 core-hours - within a small cluster and far below
      the scale of any record sieve.
    memory_exponent: negligible (< 4 GB)
    best_known: >-
      The published alternative for raising generic rank over Q(t) is Elkies'
      Shimura-curve construction, which produced 17 and then 18 and has not been
      improved in twenty years. There is no published cost figure for it. The claimed
      gain here is not speed: it is that a 3-parameter space adjacent to the record
      surface has, as far as retrieval shows, never been censused.
    hidden_overhead: >-
      The exact stage's cost is superlinear in the height of D and is the term that
      will actually bind. Reported honestly: if the top of the shortlist is all at
      large height, the exact stage may cover only a fraction of it, and every
      negative then carries that coverage fraction, exactly as EV-ECQ-8ee697 B-2
      requires.
    tradeoff_note: >-
      Screening parallelises perfectly over D. The exact stage does not benefit from
      memory.

  null_object_control: >-
    Two: (i) the identical census over a random degree-matched chi = 2 family of
    generic rank 0; (ii) the identical census over the rank-8 pencil where r(D) is
    exactly computable. Required before any element of the r(D) histogram is
    believed.

  reach_to_32: >-
    THIS IS ONE OF THE TWO PROPOSALS IN THIS SET THAT REACHES 32 RATHER THAN 30.
    What would have to be true: some squarefree D of degree <= 2 with
    rank E^{(D)}(Q(v)) >= 15. Then the base-changed surface has rank >= 32 over Q(u)
    at chi = 4, whose Shioda-Tate ceiling of 38 permits it, and Silverman
    specialisation hands rank >= 32 over Q to all but finitely many rational u - no
    sieve, no Mestre-Nagao, no compute race against the record holders. The prior
    against it is explicit and retrieved: generic D gives r(D) = 0, and the one D
    anyone is recorded as having examined gave r(D) = 1. The proposal is worth
    running because the cost of finding out is about 10^2 core-hours and because the
    intermediate outcome r(D) = 2 is itself a world record for generic rank over Q(t).

  dominated_by: >-
    On the axis this proposal actually competes on - generic rank over Q(t) - the
    incumbent is Elkies 2006 at 18 (Dujella G(0) >= 18, retrieved), and the proposal
    is dominated by it unless r(D) >= 2. On the rank-over-Q axis it is dominated by
    ICARM #302 at rank >= 31 unless r(D) >= 14. Time, memory and query axes: no
    competing published cost figure exists for the Q(t) record, so those three rows
    are recorded as not-applicable rather than as an unchecked null.
  sota_delta: >-
    Quantitatively: needs r(D) >= 2 to move the Q(t) record from 18 to 19 (+1), and
    r(D) >= 15 to move the Q record from 31 to 32 (+1). Current measured evidence for
    the achievable r(D) is a single published instance at 1.

  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: high
