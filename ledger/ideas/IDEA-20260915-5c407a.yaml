  interpretation_limits:
  - >-
    ARM 1 IS NOT AN ECDLP RESULT. It measures finite-field descent because
    that is where depth exists. Any transfer to ECDLP is conditional on arm
    2, which this record PREDICTS WILL BE NEGATIVE at executable scale.
    A reader taking arm 1's rho_j as an elliptic-curve number is misreading
    the record.
  - >-
    Every rho_j is a LOWER BOUND on true sharing, because canonicalisation
    can only under-merge safely (over-merging is a correctness bug caught by
    P1). A measured rho_j = 1 therefore does not prove no sharing exists.
  - >-
    Regime R3 at toy depth does not establish R3 asymptotically. The
    pigeonhole mechanism of M1 gives a REASON to expect persistence, but a
    reason is not a proof and no extrapolation to cryptographic sizes is
    licensed by this experiment. Any such extrapolation is arithmetic on
    numbered assumptions and must be labelled as such.
  - >-
    A memoised descent trades time for MEMORY, and the memo table is exactly
    the kind of cost this program has repeatedly found decides comparisons
    against rho. Any cost statement from this line must be memory-charged,
    or it is not a cost statement.

