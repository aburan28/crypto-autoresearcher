idea:
  id: IDEA-20260824-a5e3f9
  question_id: RQ-ECQ-e9b361
  goal_id: GOAL-ECQ-2298dc
  title: >-
    Does an Elkies-style lattice obstruction forbid Mordell-Weil rank 32 over Q at
    chi = 4, the way it forbids 18 at chi = 2? A pre-compute closure audit
  class: mechanism

  claim: >-
    Elkies proved that no elliptic K3 surface has Mordell-Weil rank 18 over Q, by
    showing that the required essential lattice would be a positive-definite rank-18
    lattice of discriminant 163 with minimal norm at least 4, whose existence would
    break the known sphere-packing density record in R^18. THE CLAIM UNDER TEST IS
    THAT THE SAME ARGUMENT SHAPE EITHER DOES OR DOES NOT BITE AT chi = 4 AND RANK 32.
    Concretely - enumerate the admissible (chi, root lattice R, discriminant,
    minimal norm) data for an elliptic surface over Q with chi = 4 and Mordell-Weil
    rank at least 32, and determine whether every such datum forces a
    positive-definite lattice of rank at least 32 whose density exceeds the best
    known packing in that dimension. If yes, rank 32 over Q(t) at chi = 4 is
    impossible and the campaign's structural route is closed with a named,
    quantified obstruction. If no, the enumeration outputs a TARGET LIST of fibre
    configurations that a construction must realise, which is strictly more useful
    than a search with no target.

  mechanism: >-
    Shioda-Tate gives rho(S) = 2 + sum(m_v - 1) + rank MW, and for an elliptic
    surface with chi = d one has b_2 = 12d - 2, p_g = d - 1, h^{1,1} = 10d, so in
    characteristic zero rho <= 10d and rank MW <= 10d - 2 - sum(m_v - 1). This
    reproduces the numbers the brief states - 8 at d = 1, 18 at d = 2, 28 at d = 3,
    38 at d = 4 - and the d = 1, 2, 3 values are independently confirmed by the
    retrieved Elkies text. Rank 32 therefore requires d >= 4 and sum(m_v - 1) <= 6.
    Elkies' impossibility at d = 2 does not come from Shioda-Tate at all - it comes
    from ARITHMETIC over Q. Attaining rho = 20 over Q for a K3 forces the
    transcendental lattice to be a rank-2 form of class number one, hence one of the
    thirteen discriminants -3, -4, -7, -8, -11, -12, -16, -19, -27, -28, -43, -67,
    -163; the largest of them, 163, then forces an essential lattice too dense to
    exist. The question this idea asks is whether the analogous arithmetic
    constraint at d = 4 (where p_g = 3 and the transcendental lattice has rank
    40 - rho, so rho = 34 leaves a rank-6 transcendental lattice) produces a
    comparable contradiction, a weaker constraint, or none at all. The three cases
    are genuinely different and the answer is not obvious in either direction, which
    is exactly the property a discriminating audit needs.

  tracked_object: >-
    The essential lattice - the orthogonal complement of the trivial lattice inside
    the Neron-Severi group, taken with its induced positive-definite form after sign
    change, recorded as (rank, discriminant, minimal norm, packing density).

  lossy_projection_test: >-
    PASSES. The projection S -> (rank, discriminant, minimal norm) of the essential
    lattice discards the surface, its equation, the field of definition of its
    sections and the sections themselves, retaining three integers. It is compatible
    with the operations that generate candidates - a base change multiplies chi and
    acts on the root lattice by known fibre-type rules, a quadratic twist permutes
    fibre types by the involution that exchanges I_n with I_n-star, II with IV-star,
    III with III-star, IV with II-star - so the retained triple propagates
    deterministically under those moves without reconstructing the surface. It is
    enormously non-injective, and that is precisely why an impossibility statement
    about the triple is an impossibility statement about a whole class of surfaces.

  novelty_status: adaptation
  novelty_note: >-
    The argument at chi = 2 is Elkies'. Running it at chi = 4 and rank 32 is an
    adaptation and, on this session's retrieval, no published instance of that
    computation was found. The classification rests on the retrieved Elkies text
    for the chi = 2 case; the claim that nobody has run chi = 4 is `unverified` and
    is stated as such rather than as novelty.

  citations:
    - ref: "arXiv:0709.2908"
      provenance: retrieved
      claim: >-
        "the Mordell-Weil rank of E/F(t) is at most 10d - 2"; d = 1 gives at most 8,
        d = 2 at most 18, d = 3 at most 28; "Therefore there are no elliptic K3
        surfaces of Mordell-Weil rank 18 over Q ... Such a lattice, positive-definite
        of rank 18 with discriminant 163 and minimal norm at least 4, would have
        broken the density record for a sphere packing in R^18"; and the list of
        thirteen class-number-one discriminants -3, -4, -7, -8, -11, -12, -16, -19,
        -27, -28, -43, -67, -163. Read via a summarising fetch of the ar5iv
        rendering, not by direct text inspection.
      verified_by: "idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)"
    - ref: "arXiv:2603.24666"
      provenance: retrieved
      claim: >-
        Grassi, Miranda, Paranjape, Srinivas, Weigand, "Bounds on the Mordell-Weil
        rank of elliptic fibrations", submitted 2026-03-25. Abstract only - two
        proofs of a bound on the MW rank of some elliptic fibrations, with explicit
        bounds for Calabi-Yau threefolds and new explicit bounds for fourfolds under
        mild assumptions. THE PAPER WAS NOT READ. It is listed as a candidate
        external structural ingredient - a 2026 bound on MW rank of elliptic
        fibrations is exactly the kind of result that could settle this audit in
        either direction - and retrieving it is the first task of any implementation.
      verified_by: "idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)"
    - ref: "EV-ECQ-8ee697"
      provenance: internal
      claim: >-
        This program has already implemented and triple-checked a per-family
        Shioda-Tate ceiling computation from a family's own fibre configuration,
        with the Euler consistency check sum(deg * v(Delta)) = 12*chi holding in
        every case checked, and with the identity ceiling = 18 - sum(m_v - 1) holding
        on all 13391 families. The machinery this audit needs at chi = 4 is the same
        machinery, already validated at chi = 2.
      verified_by: "idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)"

  assumptions:
    - >-
      Characteristic zero throughout, so rho at most h^{1,1} holds and the
      Shioda-Tate ceiling arithmetic is the stated one.
    - >-
      Best-known sphere-packing densities in dimensions 26 to 40 are taken from a
      cited table and are used only as UPPER bounds on what is known to exist, never
      as proved optima. A lattice that would beat the best known packing is
      "unknown to exist", which is weaker than "impossible" in most dimensions - the
      audit must state which of the two it is using at each rank, since Elkies'
      chi = 2 argument leans on a record that is much better understood in dimension
      18 than in dimension 32.

  proof_search_map:
    bottleneck: >-
      Whether the arithmetic constraint forcing a small class number (and hence a
      large discriminant with a small-rank transcendental lattice) at chi = 2 has
      any analogue at chi = 4, where the transcendental lattice has rank 6 rather
      than 2 and class-number-one is not the relevant finiteness.
    baseline_embedding:
      parameter_slice: >-
        chi = 2, rank 18. The audit implementation must reproduce Elkies'
        contradiction exactly - rank 18, discriminant 163, minimal norm at least 4,
        density above the record - from the general code path, not from a special
        case.
      reproduction_check: >-
        frozen symbolic fixture reproducing the thirteen discriminants and the
        rank-18 density contradiction
    observation_collision:
      observable: >-
        the triple (rank, discriminant, minimal norm) of the essential lattice
      distinct_preimage_search: >-
        Search for two surfaces with the same triple but different MW rank over Q -
        for example a geometric rank-18 K3 whose Q-rank is 17. Such pairs certainly
        exist (the geometric and arithmetic ranks differ precisely by the Galois
        action, which the triple forgets), so the audit CANNOT conclude anything
        about the rank over Q from the triple alone. This is the audit's most
        important self-limitation and it is recorded here rather than discovered
        later - the Galois half must be supplied separately, which is
        IDEA-20260824-248142.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Carry the Galois module structure of the essential lattice alongside its
          isometry class, not just the three integers, so that the invariant is
          strong enough to see the difference between geometric and arithmetic rank.
        predicted_gain: >-
          Converts an obstruction about existence over Qbar into one about existence
          over Q, which is the only version that answers the campaign's question.
      - transform: observable_fiber
        proposed_object: >-
          Hold the triple fixed and vary the Galois action; look for an intrinsic
          invariant distinguishing surfaces of Q-rank 32 from Q-rank at most 31.
        predicted_gain: >-
          Either a genuine obstruction or an explicit demonstration that no
          lattice-level obstruction exists, which redirects the campaign to
          construction rather than to impossibility.
    quantifier_order: >-
      FOR ALL elliptic surfaces S over Q with chi = 4 and rank MW(S over Q(t)) at
      least 32, THERE EXISTS a positive-definite lattice with the stated invariants.
      The obstruction argument then requires - FOR ALL such invariant sets, NO such
      lattice exists. Note the quantifier trap being avoided - a single admissible
      invariant set that is NOT excluded refutes the closure, and the audit must
      enumerate rather than sample.
    method_ceiling:
      strongest_certifiable_claim: >-
        Either "no elliptic surface over Q with chi = 4 has MW rank at least 32", a
        genuine closure at the section 4 standard with a measured obstruction, or
        "the lattice invariants do not exclude it, and here are the N admissible
        fibre configurations". It can never construct a surface.
      nearby_object_control: >-
        Run the identical audit at chi = 4 and rank 18, where surfaces certainly
        exist (Elkies' record family). The audit must NOT exclude that case. An
        audit that proves too much - excluding a rank that is known to occur - is
        wrong somewhere and the failure is detected before any closure is claimed.
        This is the proves-too-much control applied to an argument rather than a
        measurement.
    proof_obligations:
      - claim: >-
          rank MW <= 10*chi - 2 - sum(m_v - 1) with chi = 4 giving 38
        responsibility: baseline
      - claim: >-
          enumeration of admissible root lattices R with sum(m_v - 1) <= 6 at chi = 4
        responsibility: size
      - claim: >-
          density comparison against best-known packings in dimensions 32 to 36
        responsibility: strictness
      - claim: >-
          the Galois half, i.e. that geometric existence would descend to Q
        responsibility: scope

  predictions:
    - metric: >-
        number of admissible (root lattice, discriminant, minimal norm) triples at
        chi = 4 with MW rank at least 32 that survive the density test
      direction: different
      minimum_effect: >-
        zero means a closure; any positive number is a target list. Both outcomes
        are publishable internal findings.
    - metric: >-
        reproduction of Elkies' chi = 2 rank-18 contradiction by the same code path
      direction: different
      minimum_effect: >-
        must reproduce exactly, or the audit is void
    - metric: >-
        outcome of the proves-too-much control at chi = 4, rank 18
      direction: different
      minimum_effect: >-
        must NOT exclude; exclusion falsifies the audit

  minimal_test:
    design: >-
      (1) Implement the Shioda-Tate ceiling and essential-lattice invariants from a
      fibre configuration, generalising the already-validated chi = 2 code of
      BATCH-541940 to arbitrary chi, with the Euler check sum(deg * v(Delta)) =
      12*chi as the internal consistency test.
      (2) Reproduce Elkies' chi = 2, rank-18 contradiction end to end.
      (3) Enumerate root lattices R realisable as fibre contributions at chi = 4 with
      sum(m_v - 1) at most 6, using the Kodaira classification and the Euler number
      constraint sum over fibres of e_v = 12*chi = 48.
      (4) For each, compute the required essential lattice invariants at MW rank 32
      to 38 and compare with best-known packing densities in the corresponding
      dimension, citing the density table used.
      (5) Run the proves-too-much control at chi = 4, rank 18.
    controls:
      - >-
        Positive control - reproduce the chi = 2 rank-18 impossibility.
      - >-
        Positive control 2 - the audit must NOT exclude chi = 2, rank 17, which
        Elkies constructed.
      - >-
        Proves-too-much control - chi = 4, rank 18, which exists.
      - >-
        Null object - run the enumeration on a random admissible fibre multiset with
        no relation to any construction and confirm the pipeline produces the same
        kind of output, so that a "zero survivors" answer is not an artifact of an
        over-restrictive enumeration.
    required_metrics:
      - >-
        count of admissible root lattices at chi = 4 by sum(m_v - 1)
      - >-
        per-candidate (rank, discriminant, minimal norm, implied density, best-known
        density, verdict)
      - >-
        the density table's source and date
      - >-
        the chi = 2 reproduction fixture, byte-stable

  falsification_conditions:
    - >-
      The chi = 2 reproduction fails. The audit is void and no chi = 4 statement may
      be made.
    - >-
      The audit excludes chi = 4, rank 18. It proves too much and is wrong.
    - >-
      The enumeration is incomplete - a fibre configuration is found by hand that the
      enumerator missed. Then no "zero survivors" claim may be made, because the
      closure is a universally quantified statement and an incomplete enumeration
      cannot support one.

  confounders:
    - >-
      Best-known packing density is not proved optimality in most dimensions above
      8 and 24. An argument that leans on a record rather than a theorem yields
      "unknown to exist", not "impossible", and the two must not be conflated. The
      audit must label every verdict with which of the two it is.
    - >-
      The essential lattice's discriminant depends on the Galois module structure of
      NS, not only on the fibre types; treating it as determined by the fibre
      configuration alone would produce a false closure.
    - >-
      rho at most h^{1,1} is a characteristic-zero statement; nothing here transfers
      to characteristic p and none is claimed.

  interpretation_limits:
    - >-
      A closure here closes chi = 4 ONLY. Rank 32 could still be attained at chi = 5
      or above, where the ceiling is 48 and the constraint sum(m_v - 1) <= 16 is far
      looser. Forward guidance is therefore mandatory in either outcome - if chi = 4
      closes, the open classes are chi at least 5 and the cost of their much larger
      specialisation heights becomes the binding question.
    - >-
      The audit says nothing about rank over Q for a SPECIALISATION. A curve of rank
      32 over Q need not come from any high-rank family at all; the record ladder's
      own `extra` term is direct evidence that specialisations exceed their family's
      generic rank by 11 to 14.

  heuristic_assumptions: []
  heuristic_assumptions_note: >-
    None used in the argument. The one soft input is the best-known packing density
    table, which is cited data rather than a heuristic, and every verdict leaning on
    it is labelled "unknown to exist" rather than "impossible".

  target_complexity:
    time_exponent: >-
      Pure lattice and combinatorial enumeration; hours of CPU at most, dominated by
      enumerating fibre multisets with sum of Euler numbers 48.
    memory_exponent: >-
      negligible
    best_known: >-
      No published chi = 4 audit was found. The chi = 2 result is Elkies'.
    hidden_overhead: >-
      The enumeration's completeness is the real cost - an incomplete enumeration
      silently converts a non-result into a false closure, so the enumerator needs
      its own correctness argument, which is where the implementation effort goes.
    tradeoff_note: >-
      not applicable

  null_object_control: >-
    Random admissible fibre multisets with no construction behind them, pushed
    through the identical pipeline, to confirm that a "zero survivors" verdict is a
    property of the constraint and not of the enumerator.

  reach_to_32: >-
    This idea does not construct anything and cannot reach 32. It decides whether
    reaching 32 through a Q(t) family at chi = 4 is possible at all. That is worth
    doing FIRST among the structural ideas because it is the cheapest, and because a
    positive verdict converts IDEA-20260824-b26635, -6 and -7 from open-ended searches
    into searches with an explicit target list of fibre configurations.

  dominated_by: >-
    n/a (no result claimed) on the rank axes. As an argument it is compared only
    against Elkies' chi = 2 impossibility, which it reproduces rather than competes
    with; there is no time, memory or query frontier row for an impossibility audit.
  sota_delta: >-
    No rank, no attack. The delta is a possible new impossibility statement one
    arithmetic-genus step above the known one, or an explicit target list where none
    is published.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
