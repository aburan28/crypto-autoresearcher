idea:
  id: IDEA-20260824-324dca
  question_id: RQ-ECQ-e9b361
  goal_id: GOAL-ECQ-2298dc
  title: >-
    Congruence-class sieving on the local data of a fibration: does the root-number
    and Tamagawa vector of E_t carry rank information that the Mestre-Nagao score
    does not already contain?
  class: control

  claim: >-
    For a fixed family E/Q(t), the vector of local invariants of the specialisation
    E_t - the local root numbers w_p(E_t), the Tamagawa numbers c_p(E_t) and the
    global root number - depends on t only through congruence conditions modulo a
    fixed modulus M determined by the family. Restricting the specialisation search
    to the congruence classes that maximise the expected rank raises the yield
    P(extra >= k) by a factor that is measurable and, crucially, is EITHER
    (a) residual after conditioning on the Mestre-Nagao score, in which case the
    local-data object carries information the score does not and the sieve should be
    two-stage, OR (b) fully explained by the score, in which case this is a
    repackaging of Mestre-Nagao and should be dropped. The experiment is designed to
    separate exactly those two explanations, and (b) is a perfectly good outcome.

  mechanism: >-
    The Mestre-Nagao score S(N) = sum over p <= N of (a_p(E_t) log p)/p is a smoothed
    average of fibral traces and is known in this program to order specialisations
    usefully when the family has a fixed base rank - KN-FIND-6b3e17 measured
    Fisher exact p = 6.1e-8 between its top and bottom arms at rank at least 9, and
    identified the censoring mechanism and cleared it. But S(N) is a single scalar
    that integrates over all primes. The local data is different in kind: the global
    root number fixes the PARITY of the analytic rank, so half the parameter space is
    excluded from even rank outright, and the Tamagawa product enters the BSD formula
    multiplicatively, so large c_p at many primes depresses the regulator needed for
    a given L-value and biases toward more, smaller points - which is exactly what a
    point search finds. Both are computable from t modulo a fixed modulus for a fixed
    family, so the "good" classes can be identified once and then sieved for free.
    The reason this is proposed as a `control` rather than an `algorithm` is that the
    honest prior is that S(N) already sees most of this - the traces a_p feeding the
    score are the same local data - and the value of the experiment is in measuring
    the residual, not in assuming it.

  tracked_object: >-
    The local-invariant vector of a specialisation - (global root number, the
    multiset of local root numbers, the Tamagawa vector) - as a function of the
    residue class of t modulo M.

  lossy_projection_test: >-
    PASSES. The projection E_t -> (root numbers, Tamagawa numbers) discards the
    curve, its points, its height and its j-invariant, keeping a vector in a FINITE
    set. It is compatible with the operation performed - varying t - because for a
    fixed family these invariants are locally constant in the t-adic topology and
    therefore constant on residue classes modulo a computable M, so the retained
    vector propagates deterministically as t moves. It is drastically non-injective:
    an entire congruence class of specialisations shares one vector, which is what
    makes it a free sieve rather than a per-curve computation.
    The projection's honest weakness is stated here rather than discovered later - it
    is NOT independent of the Mestre-Nagao projection, since both are functions of
    the local data, and that dependence is precisely what the experiment measures.

  novelty_status: adaptation
  novelty_note: >-
    Root-number and Tamagawa-driven selection is standard practice in rank searches
    and is very likely part of what the record holders do; the Elkies-Klagsbrun
    ANTS-XIV 2020 paper is the obvious place it would be described and this session
    could not read it (the publisher PDF was not machine-readable by the available
    tooling; only the title, authors and one-sentence abstract were retrieved). The
    adaptation claimed is not the sieve but the CONTROLLED COMPARISON against
    Mestre-Nagao on a fixture with ground truth. Retrieving the ANTS-XIV paper is a
    prerequisite and could well render this idea `known`, which would itself be a
    useful outcome.

  citations:
    - ref: "https://msp.org/obs/2020/4-1/p15.xhtml"
      provenance: retrieved
      claim: >-
        Elkies and Klagsbrun, "New rank records for elliptic curves having rational
        torsion", ANTS-XIV, Open Book Series 4 (2020), pages 233-250. Abstract read
        verbatim - "We present rank-record breaking elliptic curves having torsion
        subgroups Z/nZ for n = 2, 3, 4, 5, 6, and 7." THE BODY WAS NOT READ - the
        publisher PDF could not be converted to text by the available tooling. The
        Simons/ICERM item cites "the techniques described in their ANTS-XIV (2020)
        paper" as what was used for the rank-29 search, so this unread paper is the
        most important single retrieval debt in this whole idea set.
      verified_by: "idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)"
    - ref: "https://web.math.pmf.unizg.hr/~duje/tors/tors.html"
      provenance: retrieved
      claim: >-
        Best known ranks over Q with prescribed torsion - trivial 31 (Alpoge-Howell
        2026); Z/2Z 20 (Elkies-Klagsbrun 2020); Z/3Z 15 (Elkies-Klagsbrun 2020);
        Z/4Z 13 (Elkies-Klagsbrun, Li, 2020 and 2026); Z/5Z 9; Z/6Z 9; Z/7Z 6;
        Z/2Z x Z/2Z 15 (Elkies 2009); Z/2Z x Z/4Z 9; all others lower. RELEVANCE TO
        THE CAMPAIGN - every prescribed-torsion row is at least 11 below 32, so
        torsion-constrained families are ruled out as a route to the target, and this
        answers question 4 of the brief in the negative for the torsion half.
      verified_by: "idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)"
    - ref: "KN-FIND-6b3e17"
      provenance: internal
      claim: >-
        The Mestre-Nagao score ORDERS USEFULLY on a family with fixed base rank -
        top-60 arm gives 28 of 29 completed at rank at least 9 and 12 of 29 at rank
        at least 11, uniform-random 60 gives 16 of 25 and 0 of 25, bottom-20 gives
        0 of 9 and 0 of 9; Fisher exact top versus bottom at rank at least 9 is
        p = 6.1e-8. The timeout rate is flat across the ordering (51.7, 58.3, 55.0
        percent) while yield decays monotonically, and the censor was identified as
        coefficient size (Spearman of log|a6| against timeout equals +0.765,
        Spearman of score against timeout equals -0.104). The BSD-flavoured
        prediction of a per-rank score shift of 5.6095 is matched by observed steps
        of +5.26, +3.91, +2.61. THIS IS THE INCUMBENT THE NEW SIEVE MUST BEAT.
      verified_by: "idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)"
    - ref: "KN-FIND-fd382f"
      provenance: internal
      claim: >-
        The counter-instance that bounds the claim - a Mestre-Nagao prefilter over
        364,756 squarefree twists of five small-conductor curves, with ellrank on the
        400 best-scoring twists of each, produced NO twist of rank at least 5. The
        score is a rank-EXCESS detector and fails when asked for a large excursion
        from a rank-0 family. Any new sieve must be tested in both regimes or its
        measured gain is regime-specific.
      verified_by: "idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)"

  assumptions:
    - >-
      For a fixed family, the local invariants of E_t are constant on residue classes
      modulo a computable M. This is standard for a family with fixed reduction
      behaviour but must be VERIFIED per family rather than assumed, by direct
      computation on sampled t in the same class.

  proof_search_map:
    not_applicable_reason: >-
      Control experiment, not proof-oriented. No theorem or certificate is at stake;
      the deliverable is a measured residual effect size with a confidence interval,
      and the design's whole content is the conditioning that separates two
      explanations.
    bottleneck: null
    baseline_embedding:
      parameter_slice: >-
        The Mestre-Nagao top arm of KN-FIND-6b3e17, reproduced exactly - 28 of 29
        completed at rank at least 9. The new sieve is measured as an increment on
        that arm, on the same 1548-fibre domain and the same alarm settings, or the
        comparison is not a comparison.
      reproduction_check: >-
        frozen fixture reproducing the three-arm table and its Fisher p-values
    observation_collision:
      observable: >-
        the residue class of t modulo M
      distinct_preimage_search: >-
        Two t in the same class with very different rank - guaranteed to exist, since
        a congruence class contains infinitely many specialisations of every rank the
        family attains. The consequence, stated up front, is that the sieve can only
        ever shift a distribution, never predict a curve, and the experiment must
        report distributions with intervals rather than best cases.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Partition the t-line into residue classes modulo M and charge each class an
          expected-rank weight computed once from its local data, then spend the
          search budget proportionally.
        predicted_gain: >-
          If the parity constraint alone is effective, up to a factor 2 in yield at
          zero cost; the Tamagawa half is the part that must be measured rather than
          predicted.
    quantifier_order: >-
      FOR THIS family and THIS height box, the yield in the selected classes exceeds
      the yield in matched unselected classes by a factor f with interval I, AFTER
      conditioning on the Mestre-Nagao score. No claim is made about other families.
    method_ceiling:
      strongest_certifiable_claim: >-
        A measured factor on yield for a specific family and box. It cannot produce a
        curve of any particular rank and cannot be cited as evidence for one.
      nearby_object_control: >-
        The twist regime of KN-FIND-fd382f, where the Mestre-Nagao score FAILED. If
        the local-data sieve also fails there in the same way, it is measuring the
        same thing; if it succeeds where the score failed, the residual information is
        real and the two-stage sieve is justified.

  predictions:
    - metric: >-
        yield ratio P(extra >= 3 | selected class) divided by P(extra >= 3 | matched
        unselected class), unconditional
      direction: higher
      minimum_effect: >-
        at least 1.5 with a bootstrap interval excluding 1, or no effect is claimed
    - metric: >-
        the same ratio AFTER conditioning on the Mestre-Nagao score decile
      direction: higher
      minimum_effect: >-
        THIS IS THE DISCRIMINATING NUMBER. At least 1.3 with an interval excluding 1
        means the local data carries residual information; an interval containing 1
        means the score already contains it and the idea is a repackaging, which is
        the honest and useful negative outcome
    - metric: >-
        yield in the classes forced to odd parity
      direction: lower
      minimum_effect: >-
        must be measurably lower for even extra; if parity has no measurable effect
        at all, the local-invariant computation is wrong and nothing else in the
        experiment is interpretable

  minimal_test:
    design: >-
      (1) On the rank-8 pencil fixture, compute M and the local-invariant vector for
      every residue class; verify constancy on classes by direct computation on
      sampled t.
      (2) Reproduce the three-arm Mestre-Nagao table of KN-FIND-6b3e17 exactly, as
      the baseline.
      (3) Add two arms - selected congruence classes, and matched unselected classes
      drawn to have the same height distribution and the same Mestre-Nagao score
      distribution.
      (4) Report the yield ratio unconditionally and within score deciles, with
      bootstrap intervals.
      (5) Repeat in the twist regime of KN-FIND-fd382f, where the score is known to
      fail.
    controls:
      - >-
        Score-matched control - the unselected arm must match the selected arm's
        Mestre-Nagao score distribution, or the experiment measures the score again
        and answers nothing. This is the single most important design element.
      - >-
        Height-matched control - the same, for naive height, since yield rises
        steeply with height (measured factor 22 across three bands in
        EV-ECQ-8ee697).
      - >-
        Parity control - classes forced to odd parity must show lower even-rank
        yield, as an instrument check on the local computation.
      - >-
        Null object - random classes modulo the same M with no selection, which must
        show a ratio consistent with 1.
      - >-
        Attrition disclosure - certification failures reported per arm, since
        differential attrition across arms silently manufactured a result once in this
        program already (EV-ECQ-8ee697 OBS-9, 55 and 52 percent attrition on two
        middle rungs with the failures persisted nowhere).
    required_metrics:
      - >-
        M, the class enumeration, and the verification that invariants are constant
        on classes
      - >-
        per-arm yield at extra at least 1, 2, 3, with bootstrap intervals
      - >-
        the score-conditioned ratio by decile
      - >-
        certification attrition per arm
      - >-
        the twist-regime replication result

  falsification_conditions:
    - >-
      The score-conditioned ratio's interval contains 1. The local-data object is
      subsumed by the Mestre-Nagao score at this scope and the idea is a repackaging.
      This is a clean negative and should be recorded as one rather than rescued.
    - >-
      The parity control shows no effect. The local computation is wrong.
    - >-
      The unconditional ratio is above 1 but disappears entirely under height
      matching. Then what was measured is the height distribution of the selected
      classes, which is a confound and not a lever.
    - >-
      Differential attrition across arms exceeds 10 percentage points and is not
      reported per arm. The comparison is void regardless of its result.

  confounders:
    - >-
      The score and the local data are functions of the same underlying quantities,
      so an unconditioned comparison is nearly guaranteed to show an effect that is
      not residual. Conditioning is not optional.
    - >-
      Congruence classes have different height distributions once t is restricted to
      a box, which reintroduces the height confound through the back door.
    - >-
      Certification method must be identical across arms; descent censors by
      coefficient size and would differentially censor a class with systematically
      larger coefficients.

  interpretation_limits:
    - >-
      A yield factor is not a rank. Nothing here produces or predicts a record curve.
    - >-
      Scoped to the measured family, box, modulus and certification method.
    - >-
      If the ANTS-XIV 2020 paper turns out to describe this sieve, the correct label
      becomes `known` and the contribution reduces to a controlled measurement of a
      published technique - still worth having, and to be reported as exactly that.

  heuristic_assumptions:
    - id: H1
      statement: >-
        Conditional on the local-invariant vector, the rank of E_t behaves like a
        random variable whose mean shifts with the Tamagawa product and whose parity
        is fixed by the global root number - imitating the BSD formula's structure,
        in which the Tamagawa product and the regulator trade off at fixed L-value.
      rigorous_support: >-
        The parity half has genuine support - the root number determines the parity of
        the analytic rank by the functional equation, and under BSD that is the
        Mordell-Weil rank. The Tamagawa half is heuristic and is doing the real work.
        This program has already measured one quantitative consequence of the same
        BSD-flavoured model and found it accurate - a predicted per-rank score shift
        of 5.6095 against observed steps of +5.26, +3.91, +2.61.
      validation_plan: >-
        Measure mean certified extra against log of the Tamagawa product within score
        deciles and height bands, on at least 2000 certified fibres; report the
        regression slope with a bootstrap interval and compare against the BSD-implied
        slope. Tail check - the largest extra observed in the top Tamagawa decile
        against the prediction. Sampled parameters - family, box, modulus M,
        certification method, machine, all recorded. Transfer to other families is
        NOT assumed and the twist-regime replication is the test of it.

  target_complexity:
    time_exponent: >-
      Local invariants cost one Tate-algorithm run per class, paid once per family;
      the sieve itself is then free. The experiment's cost is dominated by
      certification, of order the same 40 core-hours as IDEA-20260824-95d8d8 and
      shareable with it.
    memory_exponent: >-
      negligible
    best_known: >-
      Mestre-Nagao scoring, measured in this program at 1.028 ms per score with the
      yield table cited above. The claimed gain is a multiplicative factor on yield
      at essentially zero added cost - and the honest expectation is that the factor
      is small or absent after conditioning.
    hidden_overhead: >-
      Computing M correctly for a family with many bad fibres is fiddly and is where
      an implementation error would silently produce a null result.
    tradeoff_note: >-
      Combines with IDEA-20260824-95d8d8 - both need the same certified-fibre corpus,
      so they should share one run.

  null_object_control: >-
    Random congruence classes modulo the same M, and the score-matched unselected
    arm. Both required before any factor is believed.

  reach_to_32: >-
    IT DOES NOT REACH 32 AND SHOULD NOT BE SOLD AS IF IT MIGHT. A constant-factor
    improvement in sieve yield moves the achievable `extra` by roughly
    log(factor)/beta, where beta is the tail slope of IDEA-20260824-95d8d8 - so a
    factor of 2 buys well under one unit of rank. Against a required +15 of `extra`
    from base rank 17, that is nothing. Its place in this set is as a CONTROL that
    tells the campaign whether the sieve axis has any headroom at all before more is
    spent on it, and its most valuable likely outcome is the negative one.

  dominated_by: >-
    Dominated on the rank axis by ICARM curve no. 302 at 31, absolutely and by a
    wide margin - this proposal claims no rank. On the sieve-yield axis the incumbent
    is Mestre-Nagao as measured in KN-FIND-6b3e17, and this proposal is dominated by
    it unless the score-conditioned ratio's interval excludes 1. On time and memory
    it is strictly cheaper than the incumbent per candidate, since the sieve is a
    table lookup, but that is not a Pareto improvement while the yield question is
    open.
  sota_delta: >-
    Target is a score-conditioned yield ratio of at least 1.3. In rank terms that is
    worth under +1 of `extra` and is explicitly NOT a route to 32. Against the
    campaign target the delta is -1 rank (31 to 32 unreached) and this record says
    so plainly.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: low
