idea:
  id: IDEA-PLACEHOLDER-1
  question_id: RQ-ECQ-e9b361
  goal_id: GOAL-ECQ-2298dc
  title: >-
    Base-family forensics on the live record curves: decide whether ranks 30 and 31
    are specialisations of the same rank-17 K3 fibration that produced 28 and 29
  class: measurement

  claim: >-
    The ICARM leaderboard curves #302 (rank >= 31, submitted 2026-08-23) and #273
    (rank >= 30, submitted 2026-08-20) are, up to quadratic twist, specialisations
    E_{t0} of the SAME elliptic K3 fibration of Mordell-Weil rank 17 over Q(t) that
    Elkies used for rank 28 (2006) and Elkies-Klagsbrun used for rank 29 (2024).
    Operationally: there exists t0 in Q with j_E(t0) = j(#302), where j_E is the
    j-map of that fibration, and c4(#302)^3 / c6(#302)^2 = c4(t0)^3 / c6(t0)^2.
    The claim is falsifiable in both directions and either answer relocates the
    campaign.

  mechanism: >-
    Every published step of the record ladder that has a public method description
    has the same shape: fix a family E/Q(t) of generic rank r, specialise at many
    rational t, and search each specialisation for points OUTSIDE the specialised
    generic subgroup. The Simons/ICERM announcement of rank 29 states this
    explicitly for that step - a sieve search on a rank-17 elliptic fibration of a
    K3 surface, the same surface used for rank 28, with 12 further independent
    points found. So the ladder's arithmetic to date is 17 + 11 = 28 and
    17 + 12 = 29. No public description of the 2026 rank-30 and rank-31 steps
    exists; retrieval found none. If they are the same base, then rank 31 is
    17 + 14 and the ENTIRE gain of the last two decades has been in the `extra`
    term at fixed base rank 17, which prices the next increment and says the base
    rank is a completely untouched lever. If they are NOT, a base family of unknown
    (possibly larger) generic rank has entered the record ladder and identifying it
    is worth more than any search this program could run.
    The j-map test is decisive because j is a birational invariant of the fibre and
    is insensitive to quadratic twist, which is the only freedom a sieve of this
    kind exercises beyond the choice of t.

  tracked_object: >-
    The j-map of a fibration, evaluated on a single curve - i.e. the fibre of the
    map t |-> j_E(t) over the point j(#302) in the j-line.

  lossy_projection_test: >-
    PASSES. The projection E |-> j(E) discards the twist class, the model, the
    conductor, the points and the entire Mordell-Weil group, retaining one element
    of Q. It is compatible with the operations the record search performs -
    specialisation composes with j to give j_E(t), and quadratic twisting acts
    trivially on j - so the retained part propagates deterministically under
    exactly the moves the ladder makes. It is emphatically NOT injective: the
    fibre of j_E over a generic point has up to 24 preimages, and a j-value can
    also be hit by fibrations this test knows nothing about. That collision is
    handled explicitly in the observation-collision audit below, not ignored.

  novelty_status: unverified
  novelty_note: >-
    The test is elementary and its ingredients are standard; what is unverified is
    whether anyone has published the answer. Retrieval found no method writeup for
    the rank-30 or rank-31 curves at all: the ICARM news item and the leaderboard
    entry give the a-invariants, the submitter and a one-line comment, and nothing
    about the construction. The idea is therefore classified `unverified` rather
    than `known`, and the first minutes of the experiment should be one more
    literature sweep in case a writeup appeared.

  citations:
    - ref: https://elliptic-rank.icarm.cloud/curve/302
      provenance: retrieved
      claim: >-
        Curve #302: rank lower bound 31 with 31 independent witness points, trivial
        torsion, naive height 468.2771, Faltings height 36.7425, submitted by Ava
        Howell 2026-08-23T20:02:58Z, comment "BSD + GRH certified to rank 31, found
        by Claude, Levent Alpoge, and Ava Howell"; a-invariants
        [1, 1, 1, -1284727764113567728281797636015784768866707681415849262157224232063,
        560368321454261339256859338901915312332769858684945406858043869199456710681989058863306170127006181].
      verified_by: idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)
    - ref: https://elliptic-rank.icarm.cloud/
      provenance: retrieved
      claim: >-
        Leaderboard head as of 2026-08-24: #302 rank >= 31 (log conductor 375),
        #273 rank >= 30 (log conductor 339), #12 rank >= 29 (326), #11 rank >= 28
        (287). Independence is certified by exact quadratic-character methods at
        good primes with no floating point in the decision.
      verified_by: idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)
    - ref: https://simonscollab.icerm.brown.edu/2024/08/record-breaking-elliptic-curve/
      provenance: retrieved
      claim: >-
        "The new curve was found by a sieve search on a rank-17 elliptic fibration
        of a K3 surface - the same surface used to find the rank-28 curve"; for each
        candidate specialisation the search looked "for points outside the
        fibration's generic rank 17 subgroup of rational points; for the new curve
        this search found 12 more independent points"; techniques of the authors'
        ANTS-XIV (2020) paper. No candidate count or CPU time given.
      verified_by: idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)
    - ref: arXiv:0709.2908
      provenance: retrieved
      claim: >-
        Elkies, "Three lectures on elliptic surfaces and curves of high rank", read
        through the ar5iv HTML rendering. Relied on for: "Specialization of the
        rank-17 surface also yields several examples of elliptic curves over Q with
        more than 24 independent rational points, including a curve of rank at least
        28"; the rank-17 elliptic K3 over Q(t) arising from a non-CM rational point
        on the N = 6*79 Shimura curve (u^2 = 16t^6 - 19t^4 + 88t^2 - 48).
        CAVEAT: read via a summarising fetch tool, not by direct text inspection;
        two fetches of the same page disagreed about whether the group (Z/2Z)+Z^18
        is over Q or over Q(t). Treat the quoted sentences as retrieved and the
        surrounding interpretation as unverified.
      verified_by: idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)
    - ref: KN-FIND-6b3e17
      provenance: internal
      claim: >-
        This program's own recorded statement that the published record ladder rests
        on base ranks "of roughly 18-20 (recalled literature, background, not
        measured by this program)". Retrieval this session gives 17 for the 28 and 29
        steps, so that internal figure is now known to be too high by 1 to 3 and
        should not be reused.
      verified_by: idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)

  assumptions:
    - The explicit Weierstrass model (c4(t), c6(t) of degrees 8 and 12) of Elkies'
      rank-17 K3 fibration over Q(t) can be obtained. This is a HARD DEPENDENCY and
      is not yet discharged - see interpretation_limits.
    - The a-invariants published on the ICARM leaderboard for #273 and #302 are
      correct as published. The experiment recomputes c4, c6 and the minimal model
      from them and does not trust the page's derived quantities.

  proof_search_map:
    bottleneck: >-
      Not a proof-oriented proposal in the theorem sense; the bottleneck being
      probed is factual, namely which base family the current record ladder stands
      on. The audits below are still run because the conclusion is an identification
      claim and identification claims fail exactly by collision.
    baseline_embedding:
      parameter_slice: >-
        The known-answer slice is Elkies' own rank-28 curve, ICARM #11. It IS a
        specialisation of the rank-17 fibration by the cited source, so the
        procedure must return a rational t0 for #11. If it does not, the
        implementation or the retrieved model is wrong and no negative result about
        #302 may be reported.
      reproduction_check: >-
        Frozen fixture: (#11 a-invariants, recovered t0, recovered twist parameter d),
        checked by exact rational arithmetic.
    observation_collision:
      observable: >-
        j(E) in Q, and the pair (c4^3 : c6^2) which determines it.
      distinct_preimage_search: >-
        Two distinct curves can share a j-invariant while lying on different
        fibrations, and j_E can take the same value at up to 24 different t. The
        collision is therefore EXPECTED and is separated by a second condition:
        after recovering a candidate t0, the twist parameter
        d = (c6(target) * c4(t0)) / (c4(target) * c6(t0)) must be, up to rational
        squares, an integer of size compatible with the target's conductor, and the
        17 specialised generic sections must be exhibited as rational points on the
        target curve in exact arithmetic. A candidate t0 that fails the point
        exhibition is a collision and is reported as one, not as a hit.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The identification is moved to an exact rational-root problem: rational
          roots of the numerator of j_E(t) - j(target), a polynomial of degree at
          most 24 over Q with very large coefficients.
        predicted_gain: >-
          Turns an open-ended "which family is this" question into one PARI
          polrootsrational call plus one exact twist check.
    quantifier_order: >-
      EXISTS t0 in Q and EXISTS d in Q* such that the target curve is Q-isomorphic
      to the d-quadratic-twist of E_{t0}. Negation is universally quantified over
      the at most 24 roots and is therefore decidable exactly, with no search
      budget and no heuristic.
    method_ceiling:
      strongest_certifiable_claim: >-
        "#302 is / is not a quadratic twist of a specialisation of THIS fibration."
        It certifies nothing about any other fibration and cannot identify the true
        base family if the answer is negative.
      nearby_object_control: >-
        Apply the identical procedure to a board curve of modest rank that is known
        not to come from this fibration (e.g. the rank-11 board curve #108 that this
        program rediscovered in BATCH-541940, EV-ECQ-8ee697 OBS-13). The procedure
        must return no rational t0. If it returns one, the test cannot distinguish
        the pair and the identification is worthless.
    proof_obligations:
      - claim: The retrieved c4(t), c6(t) really define a fibration of MW rank 17 over Q(t)
        responsibility: baseline
      - claim: Rational-root recovery of t0 is exact and complete over Q
        responsibility: correctness
      - claim: The twist check separates j-collisions
        responsibility: strictness
    not_applicable_reason: null

  predictions:
    - metric: number of rational roots t0 of j_E(t) - j(#302) that survive the twist and point-exhibition check
      direction: different
      minimum_effect: >-
        Exactly 0 or exactly >= 1; both are informative. Under the hypothesis, >= 1
        for #273 and #302 and >= 1 for the control #11.
    - metric: implied `extra` for the current record (record rank minus recovered base rank)
      direction: higher
      minimum_effect: >-
        If the hypothesis holds, extra(#302) = 14 and extra(#273) = 13, against 11
        for 2006 and 12 for 2024 - i.e. +2 of `extra` bought in 20 years, and +2 more
        in three days of 2026.
    - metric: recovered base rank of the current record's family
      direction: different
      minimum_effect: >-
        17 under the hypothesis; any other value is a new fact about the state of
        the art.

  minimal_test:
    design: >-
      1. Retrieve and transcribe the explicit rank-17 K3 fibration over Q(t) (c4, c6
      of degrees 8, 12) from Elkies' primary source; record the exact provenance and
      recompute its discriminant factorisation and Shioda-Tate ceiling from its own
      fibre configuration, exactly as BATCH-541940 did for the Mestre families, to
      confirm 18 - sum(m_v - 1) = 17.
      2. Positive control: recover t0 for ICARM #11 (Elkies rank 28). Frozen fixture.
      3. Run the recovery on #273 and #302.
      4. Negative control: run it on #108 (rank 11, known unrelated) and on 20 random
      board curves of rank <= 12.
      5. For any recovered t0, specialise the 17 generic sections at t0, twist, and
      verify each is a rational point on the target curve in exact integer arithmetic.
    controls:
      - Positive: #11 must be recovered (known ground truth from the cited source).
      - Negative / null object: #108 and 20 random board curves must NOT be recovered.
      - Shioda-Tate self-check on the transcribed fibration: sum over fibres of
        deg * v(Delta) must equal 24 = 12*chi, the same internal consistency test
        used and passed in BATCH-541940.
    required_metrics:
      - recovered t0 (exact rational) per target curve, or explicit "none"
      - recovered twist parameter d, squarefree part
      - number of the 17 specialised sections verified on the target curve, in exact arithmetic
      - degree of j_E and number of rational roots before the twist filter (collision count)
      - sum(m_v - 1) of the transcribed fibration

  falsification_conditions:
    - The positive control fails: no rational t0 recovers #11. Then the transcribed
      model or the implementation is wrong and NO conclusion about #302 may be drawn.
    - A negative control succeeds: #108 or a random board curve is "recovered". The
      observable collides and the identification is void.
    - t0 is recovered for #302 but fewer than 17 specialised sections verify as
      rational points on the target. Then the j-match is a collision, and the claim
      is false as stated.
    - The transcribed fibration's own fibre census gives sum(m_v - 1) != 1, i.e. its
      Shioda-Tate ceiling is not 17. Then the wrong surface was transcribed.

  confounders:
    - The record curves may be specialisations of a QUADRATIC BASE CHANGE of the
      rank-17 fibration rather than of the fibration itself (Elkies' route to 18
      over Q(t)). A negative result must therefore also be run against the
      base-changed family before "different base" is concluded; otherwise the test
      answers a narrower question than it appears to.
    - Minimal-model scaling: c4, c6 must be compared as (c4^3 : c6^2) or through j,
      never as raw integers, or a correct match is missed.
    - The published a-invariants are enormous; naive floating point anywhere in the
      j computation destroys the test. Exact rational arithmetic only.

  interpretation_limits:
    - THE HARD DEPENDENCY: this experiment cannot start until the explicit rank-17
      fibration is in hand. Retrieval this session obtained the Shimura-curve
      description (u^2 = 16t^6 - 19t^4 + 88t^2 - 48, N = 6*79) but NOT the
      Weierstrass model, because the arXiv PDF could not be read as text by the
      available tooling and the ar5iv rendering was consumed only through a
      summarising fetch. Obtaining the model is a prerequisite sub-task and its
      failure is an infrastructure outcome, never a mathematical result.
    - A negative answer identifies nothing. It says only "not this family".
    - Nothing here is progress toward rank 32. It is reconnaissance whose value is
      that it decides which of the two levers - base rank or `extra` - the campaign
      should spend on.

  heuristic_assumptions: []
  heuristic_assumptions_note: >-
    None. Every step is exact rational arithmetic with a decidable outcome. This is
    the reason it is ranked first: it is the only proposal in this set that carries
    no heuristic at all.

  target_complexity:
    time_exponent: >-
      Not an asymptotic proposal. One polrootsrational call on a degree <= 24
      polynomial with coefficients of a few hundred digits, plus <= 17 exact point
      verifications per candidate. Seconds to minutes.
    memory_exponent: negligible (< 100 MB)
    best_known: >-
      No published answer exists; the state of the art on this specific question is
      "unknown to the public", which is why the measurement has information value
      out of all proportion to its cost.
    hidden_overhead: >-
      All of the real cost is in the retrieval sub-task (transcribing and verifying
      the fibration), not in the computation.
    tradeoff_note: not applicable

  null_object_control: >-
    Board curve #108 and 20 random board curves of rank <= 12, run through the
    identical procedure. Required BEFORE any positive identification is believed.

  reach_to_32: >-
    This idea does not reach 32 and does not claim to. It decides where 32 could
    come from. If the answer is "same rank-17 base", then every increment since 2006
    has been bought in `extra`, `extra` = 14 is the current frontier, and the base
    rank is a 20-year-old untouched parameter - which promotes IDEA-PLACEHOLDER-3,
    -4, -7 and -8 (all base-rank ideas) over any sieving proposal. If the answer is
    "different base", the campaign's first job is to identify that base, and every
    sieving idea here is aimed at the wrong object.

  dominated_by: >-
    n/a (no result claimed). This is a measurement of public record with no
    competing published measurement; there is no frontier row to compare against
    on time, memory or queries.
  sota_delta: >-
    No attack, no rank, no speedup. Information contribution only: it would convert
    "the record ladder's base family since 2024 is unknown to us" into a fact, and
    would correct this program's own internal figure of "base ranks roughly 18-20"
    (KN-FIND-6b3e17), which retrieval has already shown to be wrong by 1 to 3 for
    the 2006 and 2024 steps.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
