idea:
  id: IDEA-20260824-248142
  question_id: RQ-ECQ-e9b361
  goal_id: GOAL-ECQ-2298dc
  title: >-
    The descent index: geometric rank 68 exists and arithmetic rank 18 is the record,
    so measure the Galois-invariant rank of every explicitly published high-geometric-rank
    family and find where the gap is smallest
  class: representation

  claim: >-
    For an elliptic surface X over Q with base P^1 over Q, the Mordell-Weil group
    MW(X over Qbar(t)) carries an action of Gal(Qbar/Q), and
    rank MW(X over Q(t)) equals the rank of the invariant sublattice. Define the
    descent index of X as (geometric rank) minus (invariant rank). The claim is that
    the descent index is a computable, highly variable quantity that nobody has
    tabulated, and that among the explicitly published families with large geometric
    rank - Kuwata's elliptic K3s of geometric rank 0 to 18 over Q, Kloosterman's
    geometric rank 15 case, the elliptic Delsarte surfaces classified by Heijne
    with maximal ranks up to 56, and Shioda's rank-68 surface - THERE EXISTS ONE
    WITH INVARIANT RANK AT LEAST 19, beating Elkies' twenty-year-old record of 18
    for generic rank over Q(t). Falsifiable: compute the invariant rank for every
    member of the classified families and report the maximum. If it is at most 18,
    the record is confirmed as a ceiling over this entire explicitly-published class,
    which is a real closure with a named obstruction, and the obstruction is the
    Galois action rather than Shioda-Tate.

  mechanism: >-
    THIS IS THE CENTRAL STRUCTURAL FACT OF THE WHOLE PROBLEM, and this session's
    retrieval makes it quantitative for the first time in this program. Shioda's
    surface y^2 = x^3 + t^360 + 1 has Mordell-Weil rank 68 - the highest known for
    any elliptic surface - and its EQUATION is defined over Q(t), yet the field of
    definition of its Mordell-Weil group is a number field of degree 829,440. The
    geometric rank is enormous and the arithmetic rank over Q(t) is not, and the
    entire difference is Galois. Meanwhile Shioda-Tate permits 10*chi - 2, which at
    the chi = 60 of that surface is 598, so the binding constraint on the record over
    Q(t) is NOT the Shioda-Tate ceiling at all - it is descent.
    That reframes the search. Instead of building new surfaces, take the surfaces
    whose geometric Mordell-Weil lattices are already known EXPLICITLY, together with
    the explicit Galois action on their generators, and simply compute the rank of
    the invariants. For Delsarte and Fermat-type surfaces the action is
    cyclotomic and completely explicit, and the recent work computing the splitting
    field and the 68 generators of Shioda's surface makes exactly this data available
    for the extreme case. The decomposition retrieved for that surface - into 10
    rational elliptic surfaces of ranks 2, 2, 4, 4, 4, 6, 6, 8, 8, 8 and one K3 of
    rank 16 - is itself the shape of an isotypic decomposition, and the invariant
    part is the sub-sum over the Q-rational characters.
    A single family in this class with invariant rank 19 or 20 would be a world
    record over Q(t) AND would hand the record ladder a better base than the 17 it
    has stood on since 2006.

  tracked_object: >-
    The pair (MW(X over Qbar(t)) tensor Q, the Galois action), projected to the
    multiset of character multiplicities - i.e. the isotypic decomposition of the
    Mordell-Weil lattice as a Galois representation, with the invariant multiplicity
    singled out.

  lossy_projection_test: >-
    PASSES, and this is the object the whole set of ideas is organised around.
    The projection X -> (character multiplicities of MW as a Galois module) discards
    the surface, the equations of the sections, the height pairing's actual values
    and the fibration's geometry, retaining a finite multiset of integers. What it
    discards is discarded compatibly with the operations performed - base change
    induces a known map on characters (a degree-n cyclic base change adds the
    characters of Z/nZ tensored against the existing ones), quadratic twisting
    exchanges the trivial character with the quadratic one, and Galois-equivariance
    of Shioda's height pairing guarantees the isotypic decomposition is orthogonal,
    so the retained multiset propagates deterministically without reconstructing any
    section. It is very far from injective - surfaces with the same character
    multiplicities can differ in every other respect - which is exactly why "invariant
    rank" is a usable search coordinate.
    CONTRAST WITH A FAILING PROJECTION, to show the test has teeth - tracking the
    geometric rank ALONE fails, because it is not lossy in the relevant direction -
    it retains a number that does not determine the arithmetic rank and does not
    propagate to it under any of the operations, so it is neither a coordinate change
    nor a usable object. That is the mistake this program would have made by chasing
    rank 68.

  novelty_status: unverified
  novelty_note: >-
    The framework is entirely standard; the specific tabulation across the published
    high-geometric-rank families, and the search for a member with invariant rank
    above 18, is what retrieval did not find. It may well exist - Kloosterman and
    Heijne work exactly in this area and either may have computed it. The first task
    of any implementation is a focused literature pass on "Mordell-Weil rank over
    Q(t) of Delsarte surfaces" and on the Heijne classification, and the honest
    label until then is unverified.

  citations:
    - ref: "arXiv:2601.17182 and arXiv:2512.25009"
      provenance: retrieved
      claim: >-
        Shioda's surface y^2 = x^3 + t^360 + 1 has Mordell-Weil rank 68, "currently
        the elliptic surface with the highest known rank, although there are other
        families of elliptic surfaces with rank 68 as well"; "the field of definition
        of Shioda's rank 68 elliptic surface ... is a number field of degree 829,440";
        the Mordell-Weil lattice decomposes into 10 rational elliptic surfaces of
        ranks 2, 2, 4, 4, 4, 6, 6, 8, 8, 8 and one K3 of rank 16; the defining
        polynomials of the splitting field reach degrees 1728 and 5760. Retrieved via
        a summarising fetch of the HTML rendering.
      verified_by: "idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)"
    - ref: "arXiv:math/0502439"
      provenance: retrieved
      claim: >-
        Kloosterman, "Elliptic K3 surfaces with geometric Mordell-Weil rank 15".
        Retrieved at search-summary level only - Kuwata gave explicit Weierstrass
        equations for elliptic K3 surfaces defined over Q with GEOMETRIC Mordell-Weil
        rank r for every r in 0..18 except 15, and this paper supplies the missing
        case 15. THE PAPER WAS NOT READ IN FULL. These explicit equations are the
        primary input data for this idea, so retrieving and transcribing them is the
        first implementation task.
      verified_by: "idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)"
    - ref: "arXiv:1011.2340"
      provenance: retrieved
      claim: >-
        Kloosterman, "The Maximal Rank of Elliptic Delsarte Surfaces". Abstract read
        verbatim - Shioda's 1986 method computes the Lefschetz number of a Delsarte
        surface and in one example the rank of an elliptic curve over k(t); the paper
        finds ALL elliptic curves over k(t) for which the method applies and computes
        the Mordell-Weil rank of each. THE ABSTRACT DOES NOT STATE THE MAXIMAL RANK
        VALUE and the body was not read. A separate search summary attributed to
        related work by Heijne a maximal rank of 56 for a family under a congruence
        condition; that figure is UNVERIFIED and must not be used until the source is
        opened.
      verified_by: "idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)"
    - ref: "arXiv:0709.2908"
      provenance: retrieved
      claim: >-
        Elkies' record table for the rank of a nonconstant elliptic curve over Q(T) -
        8, 9, 10 Neron (1952); 11, 12 Mestre (1991); 13 Nagao (1994); 14 Mestre and
        Kihara (2000-1); 15, 16, 17, 18 Elkies (2006-7). Plus the impossibility of
        Mordell-Weil rank 18 over Q for an elliptic K3, which is why 18 must live at
        higher arithmetic genus.
      verified_by: "idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)"
    - ref: "https://web.math.pmf.unizg.hr/~duje/tors/generic.html"
      provenance: retrieved
      claim: >-
        Independent confirmation that the record generic rank over Q(t) for trivial
        torsion is 18, Elkies 2006, and that every prescribed-torsion row is far
        lower (11 for Z/2Z, 7 for Z/3Z and for Z/2Z x Z/2Z, 6 for Z/4Z, downward).
      verified_by: "idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)"

  assumptions:
    - >-
      The explicit generators and the Galois action are obtainable for at least the
      Kuwata K3 list and for the Delsarte class. For Shioda's rank-68 surface the
      recent work supplies them but the splitting field has degree 829,440, so the
      invariant-rank computation there must be done through the character
      decomposition rather than by explicit linear algebra over that field.
    - >-
      Invariant rank equals rank over Q(t). This is the standard consequence of
      Galois descent for the Mordell-Weil group of a surface defined over Q with a
      Q-rational section; it is stated here as an assumption because no source
      stating it was opened this session.

  proof_search_map:
    bottleneck: >-
      The descent index. Every published attempt to raise the record over Q(t) has
      had to fight it, and no one has published its distribution across the families
      where the geometric side is already solved.
    baseline_embedding:
      parameter_slice: >-
        Elkies' rank-17 K3 - geometric rank 17 or 18 with invariant rank 17. The
        computation must return 17 there. And the chi = 2 case must reproduce the
        known fact that invariant rank 18 is impossible over Q even where geometric
        rank 18 occurs (Kuwata's rank-18 K3s), which is a sharp, published,
        checkable target.
      reproduction_check: >-
        frozen fixture on Kuwata's geometric rank-18 K3 - the computation must give
        invariant rank at most 17, matching Elkies' impossibility theorem. THIS IS
        THE STRONGEST AVAILABLE CHECK ON THE WHOLE METHOD because it is a case where
        the answer is proved and non-obvious.
    observation_collision:
      observable: >-
        the multiset of character multiplicities of MW as a Galois module
      distinct_preimage_search: >-
        Two surfaces with the same multiplicities but different invariant rank would
        refute the coordinate; by construction they cannot exist, since the invariant
        rank IS one of the multiplicities. The real collision risk is upstream - two
        surfaces with the same geometric rank and different multiplicities, which is
        expected and is the whole point.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the question from "does a high-rank family over Q(t) exist" to
          "does a known geometric Mordell-Weil lattice have a large Galois-invariant
          part", which is a finite character computation on published data.
        predicted_gain: >-
          Replaces construction with tabulation over a classified list.
      - transform: observable_fiber
        proposed_object: >-
          Hold the geometric rank fixed and vary the twist or the field of
          definition of the surface, which changes the Galois action without changing
          the geometry, and look for a twist maximising the invariant rank.
        predicted_gain: >-
          A free extra parameter - the same geometric surface can have many
          arithmetic forms, and only one of them needs a large invariant part.
    quantifier_order: >-
      THERE EXISTS X in the classified list, and THERE EXISTS a Q-form of X, such
      that the invariant rank is at least 19. The experiment tests it as - FOR ALL X
      in the classified list and FOR ALL Q-forms considered, compute the invariant
      rank. The second quantifier is the dangerous one - the Q-forms of a fixed
      geometric surface are infinite in number, and a negative can only ever be over
      the forms actually examined.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Invariant rank at least R for this explicit surface", which if R >= 19 is a
        world record for generic rank over Q(t) and, by Silverman specialisation,
        rank at least R over Q for almost all rational t. If R >= 32 it settles the
        campaign.
      nearby_object_control: >-
        Kuwata's geometric rank-18 elliptic K3 - the nearest object where the desired
        conclusion (invariant rank 18) is KNOWN FALSE by Elkies' theorem. A method
        that reports 18 there is wrong, and this control must be run before any
        positive report.
    proof_obligations:
      - claim: >-
          invariant rank equals rank over Q(t)
        responsibility: baseline
      - claim: >-
          the character decomposition of MW for each classified family
        responsibility: correctness
      - claim: >-
          exhibited Q(t)-rational sections for any claimed invariant rank
        responsibility: strictness
      - claim: >-
          Silverman specialisation transfer to rank over Q
        responsibility: interface

  predictions:
    - metric: >-
        maximum invariant rank over the classified families and forms examined
      direction: higher
      minimum_effect: >-
        at least 19 to beat the twenty-year-old Q(t) record; at most 18 is a closure
        over the examined class
    - metric: >-
        descent index (geometric minus invariant rank) by family
      direction: different
      minimum_effect: >-
        reported as a distribution; the prediction under the Shioda-68 datum is that
        it grows sharply with geometric rank, and a family that breaks that trend is
        the target
    - metric: >-
        invariant rank of Kuwata's geometric rank-18 K3
      direction: lower
      minimum_effect: >-
        must be at most 17; 18 falsifies the method against a proved theorem

  minimal_test:
    design: >-
      (1) Transcribe Kuwata's explicit elliptic K3s over Q of geometric rank 16, 17,
      18 and Kloosterman's rank-15 case; verify each one's geometric rank
      independently from its own fibre configuration by Shioda-Tate with the Euler
      check.
      (2) For each, determine the field of definition of a generating set of
      sections and compute the Galois-invariant rank; report the descent index.
      (3) Run the nearby-object control on the geometric rank-18 case, where the
      answer must be at most 17.
      (4) Extend to the Delsarte class using the published classification, computing
      invariant ranks from the cyclotomic character data rather than by explicit
      section arithmetic.
      (5) For any family with invariant rank at least 19, EXHIBIT the sections over
      Q(t) explicitly and verify them by substitution in exact rational arithmetic
      before any claim is made.
    controls:
      - >-
        Proved-answer control - Kuwata geometric rank 18 must return invariant rank
        at most 17.
      - >-
        Positive control - a rational elliptic surface with squarefree discriminant
        and all 8 sections rational must return invariant rank 8, descent index 0.
        This program already owns one such surface with every input verified in exact
        arithmetic (KN-FIND-6b3e17).
      - >-
        Null object - a surface built with deliberately irrational sections (e.g. the
        k = 0 rung defect of EV-ECQ-8ee697 OBS-9, where twelve geometric sections
        occur in Galois-conjugate pairs) must return a LOW invariant rank, and the
        known trace trick (P plus its conjugate is rational) must show up as the
        correct nonzero invariant part. That defect is a ready-made calibration case
        for this exact computation.
    required_metrics:
      - >-
        per-family (geometric rank, invariant rank, descent index, field degrees of
        the generators)
      - >-
        exhibited Q(t)-sections for any invariant rank claimed at least 19
      - >-
        the control results, all three
      - >-
        the enumeration's coverage - which families and which Q-forms were examined,
        stated as a fraction of the classified list

  falsification_conditions:
    - >-
      The proved-answer control returns 18 for a geometric rank-18 K3. The method
      contradicts a published theorem and is wrong.
    - >-
      The positive control on the rank-8 pencil returns anything other than 8.
    - >-
      Maximum invariant rank at most 18 across the entire classified list AND across
      the Q-forms examined. Then the Q(t) record of 18 is confirmed as a ceiling over
      this class, the named obstruction is Galois descent rather than Shioda-Tate,
      and the forward guidance is that new record families must come from outside the
      Delsarte and Kuwata classes.
    - >-
      A claimed invariant rank at least 19 whose sections cannot be exhibited over
      Q(t). Then the character computation is wrong somewhere and nothing is claimed.

  confounders:
    - >-
      Geometric rank and invariant rank are routinely conflated in secondary sources.
      Every retrieved rank figure must be checked for which one it is; the retrieved
      Kuwata statement is explicitly GEOMETRIC and using it as an arithmetic rank
      would be exactly the error that produced this program's own wrong "base ranks
      18 to 20" note.
    - >-
      A Q-form change (quadratic twist of the whole surface, or a different model of
      the base) changes the invariant rank without changing the geometry, so a
      negative over one form is not a negative over the family.
    - >-
      Delsarte surfaces are often isotrivial or have constant j; an isotrivial family
      with high rank does NOT specialise usefully by Silverman's theorem in the form
      needed, and the screen must exclude them explicitly.

  interpretation_limits:
    - >-
      A negative is bounded by the classified list and the forms examined, and is
      never a statement about all surfaces.
    - >-
      Invariant rank at least 19 is a world record over Q(t) and gives rank at least
      19 over Q for almost all t - which by itself does NOT beat 31 over Q. Its value
      to the campaign is that it raises the base of the ladder, so it must be
      combined with the sieve term to matter for the 32 target.

  heuristic_assumptions:
    - id: H1
      statement: >-
        Across families of increasing geometric rank, the descent index grows, so
        that the invariant rank is bounded well below the geometric rank - in
        imitation of the observation that the Galois orbit of a generating set of
        sections grows with the complexity of the surface, with Shioda's rank-68
        surface at splitting-field degree 829,440 as the extreme measured point.
      rigorous_support: >-
        Only one measured point (829,440 for rank 68) and one theorem (Elkies'
        impossibility of invariant rank 18 at chi = 2 where geometric rank 18
        occurs). This is a very thin basis and the assumption is stated so that the
        experiment can refute it - a family with large geometric rank and small
        descent index is exactly the target, and H1 predicts there is none.
      validation_plan: >-
        Tabulate (geometric rank, descent index) over the entire Kuwata list at
        chi = 2, where both are computable, giving 18 data points at a single chi;
        then over the Delsarte class across chi. Compare the observed relation
        against the monotone prediction and report the residuals. Tail check - the
        smallest descent index observed at each geometric rank, which is the quantity
        the campaign actually needs. Sampled parameters - the family list, the Q-form
        chosen for each, and the method used to determine the field of definition of
        the generators, all recorded.

  target_complexity:
    time_exponent: >-
      Character and lattice computations plus symbolic section verification. Hours to
      days of CPU for the K3 list; the Delsarte class is dominated by the cost of
      handling large cyclotomic fields and is where the effort concentrates.
    memory_exponent: >-
      moderate, gigabytes at worst for the large splitting fields
    best_known: >-
      Generic rank 18 over Q(t), Elkies 2006, unbeaten for twenty years. Geometric
      rank 68, Shioda. The descent index between them is the unmeasured quantity.
    hidden_overhead: >-
      Determining the field of definition of a generating set is the expensive step
      and is where a published classification, if one exists, would collapse the cost
      by orders of magnitude. The literature pass is therefore not optional.
    tradeoff_note: >-
      not applicable

  null_object_control: >-
    The k = 0 rung defect already measured in this program (EV-ECQ-8ee697 OBS-9),
    where sections occur in Galois-conjugate pairs and the naive section count
    reports 0 while the rational rank is not 0. Any implementation of invariant-rank
    computation that does not reproduce the trace phenomenon there is wrong, and this
    is a ready-made, already-paid-for calibration case.

  reach_to_32: >-
    THIS IS THE SECOND OF THE TWO PROPOSALS THAT REACHES 32 RATHER THAN 30. What
    would have to be true - a surface in or adjacent to the classified high-geometric-
    rank families whose Galois-invariant Mordell-Weil rank is at least 32. Shioda-Tate
    does not forbid it above chi = 4, and geometric ranks up to 68 exist, so the only
    obstruction is descent. What makes it a long shot is exactly H1 - the one measured
    descent index at high geometric rank is catastrophic (68 geometric, splitting
    field of degree 829,440). What makes it worth doing anyway is that the
    INTERMEDIATE outcome, invariant rank 19 or 20, is a world record in its own right
    and immediately raises the base of the record ladder from the 17 it has stood on
    since 2006.

  dominated_by: >-
    On generic rank over Q(t) - dominated by Elkies 2006 at 18 unless the computed
    maximum is at least 19. On rank over Q - dominated by ICARM curve no. 302 at 31
    unless the computed maximum is at least 32. On geometric rank over Qbar(t) -
    dominated by Shioda at 68, and this proposal does not compete there and does not
    claim to. Time, memory and query axes are recorded as not-applicable, since no
    competing cost figure exists for any of these records.
  sota_delta: >-
    Needs invariant rank at least 19 for +1 on the Q(t) record (18 to 19) and at
    least 32 for +1 on the Q record (31 to 32). Current evidence bounding the
    achievable value - one theorem (invariant rank at most 17 at chi = 2) and one
    extreme measured descent index (68 geometric at splitting-field degree 829,440).

  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: high
