idea:
  id: IDEA-20260824-5980b2
  question_id: RQ-ECQ-e9b361
  goal_id: GOAL-ECQ-2298dc
  title: >-
    Fibration hopping: a fixed high-Picard surface carries many elliptic fibrations
    with different root-lattice/Mordell-Weil splits, so enumerate the fibrations
    instead of the surfaces
  class: representation

  claim: >-
    Fix a surface S over Q whose Neron-Severi lattice has large rank and is known
    explicitly - the base-changed record surface at chi = 4, or a Delsarte surface.
    The elliptic fibrations on S with section correspond, lattice-theoretically, to
    the ways of splitting NS(S) as (trivial lattice) plus (essential lattice), and
    each such splitting distributes the same total budget rho - 2 between the root
    lattice sum(m_v - 1) and the Mordell-Weil rank. The claim is that the maximum of
    the Mordell-Weil rank over all Q-rational fibrations on a single fixed surface
    exceeds the rank of the fibration one happens to be handed, by a measurable
    margin, and that on at least one explicitly available surface with rho at least
    34 that maximum is at least 19. Falsifiable: enumerate the fibrations, compute
    each one's (root lattice, MW rank, field of definition of the fibration), and
    report the maximum over Q-rational ones. If it never exceeds the handed
    fibration's rank, the hopping lever is measured and closed on those surfaces.

  mechanism: >-
    Shioda-Tate says rho = 2 + sum(m_v - 1) + rank MW. For a FIXED surface rho is
    fixed, so every elliptic fibration on it is a different way of spending the same
    budget - a fibration with many reducible fibres has small Mordell-Weil rank and
    vice versa. Elkies' rank-17 K3 spends its budget as rho = 20, sum(m_v - 1) = 1,
    MW = 17; a different fibration on the very same surface would give a different
    split. At chi = 2 this cannot help, because 18 is the ceiling and Elkies proved
    18 is unattainable over Q - so 17 is already optimal there and the surface is
    exhausted. THE LEVER ONLY EXISTS ABOVE chi = 2, where the ceiling 10*chi - 2
    rises to 28 and 38 but no construction is anywhere near it.
    The lattice-theoretic enumeration of elliptic fibrations on a fixed surface is a
    developed technique (Nishiyama's method and its successors) and is purely
    combinatorial - it does not require writing down any Weierstrass equation until
    a target splitting has been chosen. That is what makes this cheap relative to
    constructing surfaces: the search runs in the lattice, and only the winner is
    realised as an equation.
    The arithmetic catch, which is what makes it a real experiment rather than a
    calculation, is that a fibration existing geometrically need not be defined over
    Q, and its sections need not be Q-rational even when it is. So each candidate
    splitting carries a descent question, and this idea is the fibration-level
    analogue of IDEA-20260824-248142's section-level descent question.

  tracked_object: >-
    A splitting of the Neron-Severi lattice into trivial-plus-essential parts, i.e.
    a pair (root lattice R, essential lattice N) with rank R + rank N = rho - 2,
    together with the Galois action on that splitting.

  lossy_projection_test: >-
    PASSES. The projection (surface, fibration) -> (R, rank N) discards the surface,
    the fibration's actual equations, the positions of the singular fibres and the
    sections, keeping a root-lattice isometry class and one integer. It is
    compatible with the operations performed - moving between fibrations on a fixed
    surface acts on the pair by a lattice-theoretic rule with rho held constant, and
    base change and twist act on R by the known fibre-type rules - so the retained
    pair propagates deterministically. It is non-injective: many fibrations share a
    root lattice. The loss is what allows the search to be run as a combinatorial
    enumeration.

  novelty_status: adaptation
  novelty_note: >-
    Lattice-theoretic enumeration of elliptic fibrations on a fixed K3 is established
    technique; applying it at chi = 3 and 4 with an explicit Q-rationality
    requirement and with maximising the Mordell-Weil rank over Q(t) as the objective
    is the adaptation. Retrieval this session did not open a source performing that
    enumeration at chi above 2, and the classification of fibrations is very much
    harder above chi = 2 than on a K3 - see interpretation_limits, where this is
    recorded as the idea's principal risk rather than hidden.

  citations:
    - ref: "arXiv:0709.2908"
      provenance: retrieved
      claim: >-
        The Shioda-Tate budget - rank MW is at most rho - 2, with equality iff the
        essential lattice has no roots, and rank MW at most 10*d - 2; d = 2 gives 18,
        d = 3 gives 28. Also that no elliptic K3 has MW rank 18 over Q, which is what
        closes the lever at chi = 2 and forces this idea above it.
      verified_by: "idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)"
    - ref: "arXiv:0907.0298"
      provenance: retrieved
      claim: >-
        Schuett and Shioda, "Elliptic Surfaces". Retrieved for the Shioda-Tate
        statement rho(S) = rank T + rank E(K) = 2 + sum(m_v - 1) + rank E(K), and for
        the fibre-type transformation rules used when moving between fibrations,
        twists and base changes - multiplicative fibres I_n become I_{nd} under
        ramified base change, and quadratic twisting interchanges I_n with I_n-star,
        II with IV-star, III with III-star, IV with II-star. Read via a summarising
        fetch; no displayed rank formula for base change was returned.
      verified_by: "idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)"
    - ref: "Nishiyama's lattice-theoretic method for enumerating elliptic fibrations on a K3 surface"
      provenance: recalled
      claim: >-
        The technique of classifying elliptic fibrations with section on a fixed K3
        by embedding root lattices into Niemeier lattices. NOT OPENED THIS SESSION.
        A pointer for a reviewer; supports nothing until retrieved, and retrieving it
        (together with any extension above chi = 2) is the first implementation task.
      verified_by: null
    - ref: "EV-ECQ-8ee697"
      provenance: internal
      claim: >-
        This program has a validated implementation of the per-family fibre census
        and Shioda-Tate ceiling from a discriminant factorisation, checked with the
        Euler identity sum(deg * v(Delta)) = 12*chi on every family, and it found that
        99.0 percent of one whole construction sat at ceiling 9 because of six
        reducible finite fibres - a direct, measured instance of a construction
        spending its Shioda-Tate budget badly. That is exactly the failure this idea
        proposes to fix by choosing the splitting instead of accepting it.
      verified_by: "idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)"

  assumptions:
    - >-
      An explicit surface with rho at least 34 over Q, or at least an explicit
      NS lattice with its Galois action, is available. The most likely source is the
      base-changed record surface of IDEA-20260824-b26635 or a Delsarte surface from
      IDEA-20260824-248142, so this idea is downstream of both.
    - >-
      The enumeration technique extends above chi = 2. THIS IS THE PRINCIPAL RISK and
      is not assumed silently - if it does not, the idea degenerates to a chi = 2
      exercise where the answer is already known to be 17 and it should be dropped.

  proof_search_map:
    bottleneck: >-
      The split of the fixed Shioda-Tate budget between reducible fibres and
      Mordell-Weil rank, and whether the optimal split is realised by a fibration
      defined over Q with Q-rational sections.
    baseline_embedding:
      parameter_slice: >-
        The rank-17 fibration on Elkies' K3 at chi = 2, with rho = 20 and
        sum(m_v - 1) = 1. The enumeration must find it and must NOT find any
        Q-rational fibration on that surface with MW rank 18, since Elkies proved
        there is none.
      reproduction_check: >-
        frozen fixture - the chi = 2 enumeration reproduces max Q-rational MW rank 17
    observation_collision:
      observable: >-
        the pair (root lattice isometry class, essential lattice rank)
      distinct_preimage_search: >-
        Two fibrations with the same pair but different Q-rationality behaviour.
        These certainly exist - the pair forgets the Galois action entirely - so the
        enumeration must carry the Galois structure or it will report geometric
        maxima as if they were arithmetic ones. That is the identical error this
        program already made once (recording geometric base ranks as arithmetic in
        KN-FIND-6b3e17) and the control below is designed to catch it.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Treat rho - 2 as a fixed resource and pack it into Mordell-Weil rank by
          choosing the fibration whose root lattice is smallest, adding charges only
          over provably disjoint fibre contributions.
        predicted_gain: >-
          On a surface where the handed fibration wastes k units on reducible fibres,
          up to k units of Mordell-Weil rank, at zero cost in new geometry.
      - transform: stronger_invariant
        proposed_object: >-
          Carry the Galois module structure of NS through the enumeration, not just
          the isometry classes.
        predicted_gain: >-
          Makes the maximum an arithmetic maximum rather than a geometric one, which
          is the only version that answers the question.
    quantifier_order: >-
      THERE EXISTS a Q-rational elliptic fibration on S whose Mordell-Weil rank over
      Q(t) is at least 19. Tested as - FOR ALL splittings in the enumeration, compute
      the rank and the rationality. The negative is bounded by the completeness of
      the enumeration, which above chi = 2 is exactly what is uncertain.
    method_ceiling:
      strongest_certifiable_claim: >-
        "This explicit surface carries a Q-rational fibration of MW rank R over Q(t)",
        with sections exhibited. At R at least 19 that is a world record; at R at
        least 32 it settles the campaign.
      nearby_object_control: >-
        Elkies' K3 at chi = 2, where the answer 17 is proved and 18 is proved
        impossible. A method that reports 18 there has not identified the
        load-bearing structure and its chi = 4 output must not be believed.
    proof_obligations:
      - claim: >-
          completeness of the fibration enumeration at the chi used
        responsibility: scope
      - claim: >-
          Q-rationality of the winning fibration and of its sections
        responsibility: strictness
      - claim: >-
          exhibited sections over Q(t) for the claimed rank
        responsibility: correctness
      - claim: >-
          Shioda-Tate budget bookkeeping with the Euler check
        responsibility: size

  predictions:
    - metric: >-
        maximum Mordell-Weil rank over Q(t) among Q-rational fibrations on the fixed
        surface
      direction: higher
      minimum_effect: >-
        strictly greater than the handed fibration's rank for the lever to exist at
        all; at least 19 to be a record
    - metric: >-
        gap between the geometric maximum and the Q-rational maximum over the
        enumerated fibrations
      direction: different
      minimum_effect: >-
        this is the fibration-level descent index and it is the quantity worth
        keeping whatever the headline says
    - metric: >-
        chi = 2 control result
      direction: different
      minimum_effect: >-
        must be exactly 17; 18 falsifies the method

  minimal_test:
    design: >-
      (1) Run the enumeration at chi = 2 on Elkies' K3 and reproduce max Q-rational
      MW rank 17 with no rank-18 fibration.
      (2) Establish whether the enumeration technique extends to the chi of the
      target surface; if it does not, STOP and record that as the obstruction rather
      than substituting a heuristic search.
      (3) Enumerate splittings on the target surface, record (R, rank N) for each,
      and filter by Q-rationality using the Galois action on NS.
      (4) Realise the best Q-rational splitting as an explicit Weierstrass equation
      and exhibit its sections over Q(t) in exact arithmetic.
    controls:
      - >-
        Proved-answer control at chi = 2 - maximum 17, no 18.
      - >-
        Budget check - for every enumerated fibration, 2 + rank R + rank N must equal
        rho exactly, and the Euler identity sum over fibres of e_v = 12*chi must hold.
        An enumeration that violates either is producing splittings that no surface
        realises.
      - >-
        Null object - run the enumeration on a surface of small rho where the answer
        is trivially known (a rational elliptic surface, rho = 10, max MW rank 8) and
        confirm it returns 8 and not more.
    required_metrics:
      - >-
        full list of enumerated splittings with (R, rank N, Q-rational yes/no)
      - >-
        maximum Q-rational rank and the realising equation with exhibited sections
      - >-
        the geometric-versus-arithmetic gap
      - >-
        completeness statement for the enumeration, with its justification

  falsification_conditions:
    - >-
      The chi = 2 control returns a Q-rational rank-18 fibration. The method
      contradicts a published theorem and is void.
    - >-
      The budget or Euler check fails on any enumerated splitting.
    - >-
      The enumeration technique does not extend above chi = 2 and no substitute with
      a completeness argument is available. The idea is then closed with a named
      obstruction - the classification of elliptic fibrations is not available at the
      arithmetic genus where the lever would pay - and the forward guidance is that
      the surfaces must be built with their fibration chosen in advance rather than
      searched afterwards.
    - >-
      Maximum Q-rational rank equals the handed fibration's rank on every surface
      examined. The hopping lever is measured at zero over that scope.

  confounders:
    - >-
      Geometric versus arithmetic maximum - the single most likely way to produce a
      false positive here, and the same conflation that already put a wrong figure
      into this program's own knowledge corpus.
    - >-
      rho itself must be established for the target surface over Q, not assumed;
      an overestimate of rho inflates every rank in the enumeration.
    - >-
      A fibration may be Q-rational while its Mordell-Weil generators are not,
      which is IDEA-20260824-248142's question appearing inside this one. The two must
      be answered together or the reported rank is a geometric rank in disguise.

  interpretation_limits:
    - >-
      The whole idea is downstream of having an explicit high-rho surface over Q; it
      constructs nothing itself.
    - >-
      Above chi = 2 the completeness of any enumeration is the weak point, and every
      negative must carry it.
    - >-
      At chi = 2 the lever is provably empty (17 is optimal and 18 impossible), so a
      chi = 2-only result is a control, not a contribution.

  heuristic_assumptions:
    - id: H1
      statement: >-
        On a surface of large rho, the distribution of Mordell-Weil ranks across its
        elliptic fibrations is broad, so that the fibration one is handed is not
        typically the rank-maximising one - by analogy with the K3 case, where a
        single surface of rho = 20 carries fibrations spanning a wide range of
        root-lattice sizes.
      rigorous_support: >-
        The Shioda-Tate identity is the rigorous half - the budget is exactly
        conserved, so any reduction in the root lattice is exactly an increase in the
        Mordell-Weil rank. What is heuristic is that the spread is large and that the
        maximum is attained by a Q-rational fibration.
      validation_plan: >-
        Measure the full distribution of (rank R, rank N) over the enumerated
        fibrations at chi = 2 on Elkies' K3, where ground truth is available, and
        report the spread and the position of the handed fibration within it. If the
        handed fibration is already at the maximum there, that is direct evidence
        against H1 and the idea's priority drops accordingly. Sampled parameters -
        the surface, its rho, and the enumeration method, all recorded.

  target_complexity:
    time_exponent: >-
      Combinatorial lattice enumeration; the K3 case is minutes, and the cost above
      chi = 2 is unknown because the method's extension is unknown. Realising the
      winner as an equation is the expensive step and is paid once.
    memory_exponent: >-
      moderate
    best_known: >-
      No published fibration enumeration above chi = 2 with a Q-rationality filter
      was retrieved. At chi = 2 the answer for the record surface is 17 and is
      optimal.
    hidden_overhead: >-
      The completeness argument for the enumeration is the real cost and the real
      risk; without it the output is a lower bound on the maximum, which is still
      useful but must be labelled as such.
    tradeoff_note: >-
      not applicable

  null_object_control: >-
    A rational elliptic surface with rho = 10, where the maximum MW rank is 8 and is
    known. The enumeration must return 8 and not more.

  reach_to_32: >-
    It reaches 32 only in combination - it can raise the base rank of an existing
    surface by however many units that surface is wasting on reducible fibres, and
    at chi = 4 the budget is 38, so a surface with rho = 38 and a root-free
    Q-rational fibration would give exactly 36. What would have to be true is both
    that such a surface exists over Q with rho near 38 AND that the rank-maximising
    fibration is Q-rational with Q-rational sections. Neither is established and the
    second is the same descent obstruction that limits everything else here. Ranked
    below IDEA-20260824-b26635 and -6 because it is downstream of both.

  dominated_by: >-
    On generic rank over Q(t) - dominated by Elkies 2006 at 18 unless the enumerated
    maximum is at least 19. On rank over Q - dominated by ICARM curve no. 302 at 31.
    At chi = 2 it is dominated by Elkies' own optimality result, which is why the
    proposal is stated only above chi = 2. Time, memory and query axes recorded as
    not-applicable, no competing cost figures exist.
  sota_delta: >-
    Needs at least 19 for +1 on the Q(t) record. Best case at chi = 4 with a
    root-free Q-rational fibration is 36, which would be +18 on the Q(t) record and
    +4 on the Q record - but nothing retrieved this session establishes that such a
    surface exists over Q.

  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: medium
