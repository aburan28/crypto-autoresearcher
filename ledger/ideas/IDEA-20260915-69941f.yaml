  interpretation_limits:
  - >-
    A bounded spread at n <= 19 does not prove a bounded spread at
    cryptographic n. The ceiling is established AT THE TESTED CELLS with the
    TESTED ENGINES, and the record must carry that scope in every sentence
    that uses the word "ceiling".
  - >-
    The ceiling is about the PRIMARY UNIT. Parallel DAG scheduling does buy
    wall clock and this record does not dispute it; that gain is excluded
    from every ratio by the unit convention (M4), not by a claim that it is
    absent.
  - >-
    Engines absent from this host (Magma F4, PolyBoRi) are NOT covered. A
    negative here says nothing about them, and RQ-ICPERF-94c86e already
    forbids treating any in-repo engine as a reproduction of them.
  - >-
    Timeouts are censored observations. A spread computed over
    configurations where some timed out is a LOWER bound on the true spread,
    and must be reported with the censoring rate, not as a point estimate.

  estimated_cost:
