  goal_id_note: >-
    Named because RQ-ICPERF-94c86e owns the point-decomposition phase and
    names the installed Groebner and SAT engines whose scheduling this audit
    measures. The degree-of-regularity CORRECTNESS questions stay with
    RQ-DREG-* and RQ-SDEG-*; this record consumes their quantity and asks
    only about cost. Naming a goal is not dispatch and authorizes nothing.
  added: '2026-09-15'
  recorded_at: '2026-09-15'
  status: proposed
  proposed_by: idea-generator

  title: >-
    Method-ceiling audit: the F4/Macaulay elimination order is also a DAG,
    so bound ONCE AND FOR ALL how much any scheduling reordering can buy in
    the point-decomposition phase -- the expected answer is "a constant,
    while d_reg sets the exponent", and that negative is the deliverable

  class: cost-model

  claim: >-
    THE CLAIM, IN ONE SENTENCE. The third natural place to apply the "index
    calculus as a graph problem" reframing is the SOLVER: F4's reduction
    steps, the Macaulay matrix's row-echelon dependencies, and a SAT solver's
    implication graph are all DAGs, and one can genuinely reorder, schedule
    and parallelise them as graph problems -- but this record claims, and
    proposes to MEASURE RATHER THAN ASSERT, that doing so is CAPPED AT A
    CONSTANT FACTOR because the cost of solving a Semaev system is governed
    by the degree of regularity d_reg, which fixes the SIZE of the largest
    Macaulay matrix the computation must pass through, and no scheduling of
    operations on a matrix of that size changes its size. Concretely: the
    dominant term is the linear algebra on a matrix of dimension roughly
    binom(n + d_reg, d_reg), a quantity determined by the IDEAL, not by the
    order in which reductions are performed; therefore reordering moves the
    constant and the memory traffic, never the exponent. The proposal is to
    establish this as a MEASURED CEILING for the engines actually installed
    here (Macaulay2 F4, Singular std/slimgb, msolve, WDSat, CryptoMiniSat,
    CaDiCaL, MiniSat) by sweeping every scheduling knob each engine exposes
    -- monomial order, variable order, degree strategy, selection strategy,
    SAT branching heuristic and restart policy -- and reporting the FULL
    SPREAD of cost across all of them against the d_reg-predicted cost. If
    the spread is a bounded constant while d_reg-driven cost moves by orders
    of magnitude across cells, the ceiling is established and the direction
    is CLOSED WITH A NUMBER. If some knob moves cost super-constantly across
    cells, that is a genuine surprise and becomes the finding. Filing this as
    an explicit ceiling audit is the point: per docs/inventor-protocol.md a
    failed audit is often the useful result, and this program has repeatedly
    re-encountered "reorder the Groebner computation" as an intuition
    without a number attached to refuse it. This record asserts no speedup,
    claims no exponent, and is a candidate for the ranking, not evidence.

  mechanism: >-
    [M0 -- THE OBJECT.] Point decomposition on E/F_{q^n} reduces, after Weil
    descent of the Semaev summation polynomial S_{n+1}, to a polynomial
    system over F_2 (binary case) or F_p. The system is solved by a Groebner
    engine (F4/F5, std, slimgb, msolve) or, after CNF-XOR conversion, by a
    SAT solver. RQ-ICPERF-94c86e's batch 1 already measures every installed
    engine on every shipped instance of three frozen cells; this record adds
    a knob sweep INSIDE each engine, on the same instances.

    [M1 -- THE DAGS, NAMED HONESTLY.] (a) F4: each step builds a Macaulay
    matrix from selected critical pairs and row-reduces it; the reductions
    form a DAG whose nodes are polynomials and whose edges are
    "reduced-by". (b) The MONOMIAL ORDER induces a partial order on this
    DAG, and changing it changes the DAG's shape. (c) SAT: the implication
    graph is the canonical DAG of the field, and clause learning is
    literally a graph-cut operation on it. All three are real DAGs and all
    three are already exploited by their engines. NOTHING IN THIS RECORD
    PROPOSES A NEW DAG; it proposes to bound what varying the existing ones
    can buy.

    [M2 -- WHY THE CEILING IS EXPECTED, STATED SO IT CAN BE ATTACKED.] For a
    zero-dimensional system the dominant cost of a Groebner computation is
    the linear algebra on the Macaulay matrix at the degree of regularity:
    roughly O(binom(n + d_reg, d_reg)^omega) field operations for linear
    algebra exponent omega. Both n and d_reg are properties of the IDEAL and
    the field equations, not of the scheduling. A monomial order change CAN
    change d_reg (grevlex vs lex is the standard example, and lex is
    catastrophically worse) -- so the sweep must be read carefully: the
    claim is NOT that order does not matter, it is that among the orders and
    strategies that are SANE for this system class the spread is bounded,
    and that no sane choice escapes the d_reg-set exponent. The FAIR version
    of the audit therefore reports the spread across sane settings AND
    reports the insane ones (pure lex) separately, so the ceiling is not
    flattered by excluding bad options or inflated by including absurd ones.

    [M3 -- WHY IT IS WORTH MEASURING ANYWAY.] Three reasons, none of them
    "we expect a speedup". (i) RQ-ICPERF-94c86e's boundary table needs each
    engine's cost reported at its BEST sane setting; a table built on
    defaults understates the incumbent and every ratio to rho inherits the
    error. (ii) The spread across settings is the ERROR BAR on every
    single-configuration measurement this program has already recorded in
    the DREG/SDEG/SATIC lanes -- currently unknown, and a spread larger than
    the effects those lanes report would be a serious finding about the
    program's own past measurements. (iii) A measured ceiling is a reusable
    refusal: the next time "reorder the Groebner computation" is proposed,
    there is a number.

    [M4 -- THE PARALLELISM SUB-QUESTION, KEPT SEPARATE.] DAG scheduling does
    buy real wall-clock through parallel reduction, and that is not in
    dispute. It is EXCLUDED from the ceiling claim because RQ-ICPERF-94c86e
    declares a hardware-independent primary unit (solver conflicts, matrix
    operations, field multiplications) precisely so that wall-clock
    parallelism does not contaminate cost comparisons. Parallel speedup is
    reported as a secondary observation and never enters a ratio against rho
    unless rho is given the same core count on the same machine.

  tracked_object: >-
    The cost spread of one FROZEN polynomial system across the full
    cross-product of scheduling settings its engine exposes: per setting,
    the primary-unit cost, the peak Macaulay matrix dimension actually
    reached, the observed d_reg, and peak memory. The object is the SPREAD,
    not any single configuration's number.

  lossy_projection_test: >-
    The scheduling DAG discards the algebra: it remembers which polynomial
    was reduced by which, not what the polynomials mean or where they came
    from. This is the MOST lossy of the three sibling reframings, and it is
    why the ceiling is expected -- the quantity that sets the exponent
    (d_reg) is invisible in the DAG, living in the ideal the DAG was built
    from. Stating it that way is the record's actual argument: if the
    exponent-setting quantity cannot be seen in the projected object, the
    projection cannot move the exponent.

  null_object_control: >-
    RANDOM SCHEDULING. For each engine that permits it, a setting chosen at
    random from the sane set, repeated >= 10 times, establishes the spread
    attributable to scheduling alone. The comparison of interest is: does
    the BEST sane setting beat a RANDOM sane setting by more than the
    random-to-random spread? If not, tuning buys nothing beyond noise, which
    is the strongest form of the ceiling result. Second control: the SAME
    sweep on a MATCHED RANDOM polynomial system of identical shape (same
    variable count, same degree profile, random coefficients) -- if the
    Semaev system's spread is indistinguishable from the random system's,
    then nothing about the elliptic curve is reachable by scheduling, which
    is the sibling records' null-object logic applied here.

  numbered_predictions:
  - id: P1
    statement: >-
      BOUNDED SPREAD. Across all SANE scheduling settings of a given engine
      on a given frozen instance, the primary-unit cost spread (max/min) is
      bounded by a factor < 10 and does NOT grow with the cell parameter n,
      while the cell-to-cell cost at fixed setting grows by orders of
      magnitude tracking d_reg.
    falsified_by: >-
      A spread ratio that GROWS with n -- which would mean some scheduling
      knob has super-constant leverage and the ceiling claim is wrong. This
      is the outcome that would make the record interesting rather than
      confirmatory, and it must be reported as prominently as the expected
      one.
  - id: P2
    statement: >-
      THE EXPONENT LIVES IN d_reg, NOT THE SCHEDULE. The peak Macaulay
      matrix dimension reached is, across sane settings, constant to within
      a factor < 2, and predicted by the observed d_reg via
      binom(n + d_reg, d_reg) to within the same factor.
    falsified_by: >-
      Peak matrix dimension varying by more than 2x across sane settings at
      equal d_reg -- the schedule would then be changing the size of the
      object, not just the order of operations on it.
  - id: P3
    statement: >-
      ERROR BAR ON THIS PROGRAM'S PAST NUMBERS. The measured scheduling
      spread is SMALLER than the engine-to-engine effects already reported
      in the SATIC / DREG / SDEG lanes, so those lanes' conclusions survive
      the spread.
    falsified_by: >-
      Scheduling spread COMPARABLE TO OR LARGER THAN a reported
      engine-to-engine effect. That is a defect finding about this program's
      own measurements, requires a correction record against the affected
      lane, and is the single most consequential possible outcome here.
  - id: P4
    statement: >-
      NULL OBJECT. The Semaev system's scheduling spread is
      indistinguishable from that of a matched random system of the same
      shape.
    falsified_by: >-
      A separation -- the Semaev system responds to scheduling differently
      from a shape-matched random one, meaning curve structure IS visible to
      the scheduler after all, and the lossy_projection_test above is wrong.

  heuristic_assumptions:
  - id: HEUR-1
    formal_statement: >-
      For the zero-dimensional Semaev/Weil-descent systems in the declared
      cells, the primary-unit cost of any sane Groebner strategy is
      Theta(binom(n + d_reg, d_reg)^omega) with a strategy-dependent
      constant and a strategy-independent d_reg.
    random_model_justification: >-
      Not a random model -- this is the standard semi-regularity-based cost
      statement for zero-dimensional systems, which this program's DREG and
      SDEG lanes already measure d_reg for. It is listed as a heuristic
      rather than a fact because semi-regularity is itself a heuristic and
      because these systems are KNOWN to be structured (field equations,
      symmetry from the summation polynomial), so the standard statement may
      not apply cleanly -- which P2 tests directly.
    falsification_condition: P2 failing, or measured d_reg varying by strategy.
    validation_plan: P2, with d_reg read off the engine's own degree trace.

  test_boundary:
    instances: >-
      The frozen instances already used by EXP-ICPERF-66fd51 -- shipped
      instances of the (n,l) cells in {(15,5),(17,6),(19,6)} from
      SRC-ICPERF-TRIMOSKA-ECICB-2024 -- plus matched random systems of
      identical shape for P4. No new instance generation is required, which
      is why this audit is cheap. Toy scale; AGENTS rule 4 applies.
    parameters:
      groebner_knobs: >-
        monomial order (grevlex, block orders; pure lex included but
        reported SEPARATELY as the insane control per M2), variable order
        (several permutations incl. reverse), degree bound / degree
        strategy, selection strategy where the engine exposes it, field
        equations included vs not.
      sat_knobs: >-
        branching heuristic, restart policy, phase saving, XOR handling
        (WDSat's native XOR vs CryptoMiniSat's CNF-XOR), preprocessing on/off.
      engines: >-
        Macaulay2 F4 over ZZ/2 with field equations, Singular std and
        slimgb, msolve where characteristic permits, WDSat, CryptoMiniSat,
        CaDiCaL, MiniSat -- each NAMED AND VERSIONED in every cell, per
        RQ-ICPERF-94c86e's constraint that "Groebner" is not an engine.
      primary_unit: >-
        solver conflicts (SAT) and Macaulay matrix operations (Groebner),
        with peak matrix dimension, observed d_reg, wall time and peak
        memory recorded alongside. SAT and UNSAT instances reported
        SEPARATELY, never pooled -- RQ-ICPERF-94c86e names pooling as a
        composition artifact.
    implementation: >-
      A sweep driver beside the existing ICPERF harness, reusing its uniform
      resource accounting. No edit to the frozen harness. Every run carries
      the engine version string.
    budget:
      wall_clock_seconds_total: 10800
      per_configuration_timeout_seconds: 600
      maximum_memory_gb: 8
      network: none
    controls:
    - Random sane setting, >= 10 draws per engine per instance (the deciding
      spread control).
    - Matched random polynomial system of identical shape (P4).
    - >-
      Insane-setting control: pure lex reported separately, establishing
      that the sweep CAN detect a large effect when one exists. A sweep that
      shows no spread even between grevlex and lex is not measuring
      anything, and this control catches that instrument failure.
    - >-
      Known-answer control: every SAT answer re-verified against the curve
      with independent arithmetic; scheduling must never change the answer.

  falsification_conditions:
  - F1: P1 fails (spread grows with n) -- the ceiling claim is WRONG, the
      direction is live, and this record should be superseded by a positive
      proposal against the specific knob responsible.
  - F2: P3 fails -- scheduling spread swamps a previously reported effect.
      This is a defect finding requiring a correction record against the
      affected lane, and it takes priority over everything else in this
      record.
  - F3: Timeouts dominate the sweep so that no spread can be measured within
      budget. INFRASTRUCTURE OUTCOME, never negative evidence and never
      evidence that any instance is unsatisfiable (AGENTS rule 3, and
      RQ-ICPERF-94c86e's own constraint says the same).

  dominated_by: >-
    HONEST POSITION. Monomial-order and strategy sensitivity of Groebner
    computations is textbook, and SAT heuristic sensitivity is the entire
    subject of the SAT competition. This record claims NO novelty about
    either phenomenon. What it claims is narrow and local: that the SPREAD
    has not been measured on THESE Semaev instances with THESE installed
    engines, that RQ-ICPERF-94c86e's boundary table needs it as an error
    bar, and that a measured ceiling is a reusable refusal for a recurring
    intuition. If the novelty screen finds the spread published for Semaev
    systems, the record is dominated and the numbers should be ingested via
    /curate-knowledge rather than re-measured -- though note that the
    constraint in RQ-ICPERF-94c86e forbids entering reported numbers as
    measured in a boundary table, so a published spread would still need a
    marked "reported" row and would not close the in-repo measurement.

  sota_delta: >-
    ZERO delta against SOTA, by construction and by intent. This is an audit
    whose expected result is a negative. Its value is entirely internal:
    a hardened boundary-table column, an error bar on prior measurements,
    and a numbered ceiling that lets the Coordinator refuse a recurring
    direction without re-litigating it. Ranking it as a cryptanalytic
    proposal would be a category error.

