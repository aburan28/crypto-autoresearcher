  class: composition

  claim: >-
    THE CLAIM, IN ONE SENTENCE. The committed Mestre engine (p = prod(x -
    a_i), g = truncated sqrt(p), s = g^2 - p, so s(a_i) = g(a_i)^2
    identically) generalizes to an engine that forces s(b_i) = d_i *
    r_i^2 for PRESCRIBED squarefree classes d_i at PRESCRIBED rationals
    b_i: take delta = the Lagrange interpolant with delta(b_i) = d_i and
    set s := delta * g^2 mod p; then s(b_i) = d_i * g(b_i)^2 holds
    IDENTICALLY for every solution g of an explicit system of n - 5
    quadratic vanishing conditions, and each pair (b_i, g(b_i)) is a
    rational point on the twist E^(d_i) of E : v^2 = s(u) -- by
    evaluation, never by descent or search-for-points. Equivalently
    (CRT/subspace form): the n forcing conditions say that the vector
    (d_i * r_i^2)_i lies in W(b), the fixed 5-dimensional evaluation
    image of quartics at b, i.e. that u = (r_i^2) lies in the computable
    5-dimensional subspace W'(b) = D^-1 W(b) of Q^n. Multi-class forcing
    is therefore the problem of finding SQUARE-PATTERN POINTS IN A
    COMPUTABLE 5-DIMENSIONAL RATIONAL SUBSPACE, and the parameter
    arithmetic is exact: n free b's + (n-1) projective r's - (n-5)
    quadratic conditions = an (n+4)-dimensional solution family for EVERY
    n >= 6; the conditions are quadratic (never higher -- no degree
    multiplication) and only their NUMBER grows with n. Consequences:
    (i) at n = 8 (4 classes x 2 points of one k = 3 coset) the system is
    3 diagonal quadratic equations in 8 unknowns inside a 5-dimensional
    subspace, with expected solution count growing like H^1 in the box
    height -- abundant; (ii) at n = 6 the system is ONE diagonal
    quadratic form in 6 variables, where Hasse-Minkowski makes existence
    equivalent to checkable local solvability -- a near-rigorous anchor;
    (iii) the engine yields, at certified-scale parameters, a quartic
    model whose k = 3 coset has >= 4 classes POPULATED BY CONSTRUCTION,
    certified descent-free (exact eigenspace independence across
    classes + the exact F_l-reduction certifier within classes), which
    is a NEW VALUE ON AN AXIS WHERE THE COMMITTED RECORD HOLDS ZERO --
    every committed k = 3 per-class number rests on PARI's r_low, i.e.
    on descent; (iv) THE WALL IS NAMED, NOT HIDDEN: ellipticity caps deg
    s <= 4, Mestre's own closed form gives deg s = n/2 - 1 (elliptic
    only for n <= 10), the fixed-b solution density decays like
    H^(5 - n/2) (H^-11 at n = 32), and no closed form survives for
    n >= 12 even at d = 1 -- so the route to a degree-8 total >= 32 is
    NOT "force 32 points on one quartic" but "force a 10-point,
    5-class core by construction, then fill classes and multiplicities
    with the committed per-class exact-square-test augmentation scan
    (a generalization of extra_quartic_points from 's(u) square' to
    's(u)/d square' -- exact integer arithmetic, zero descent, the knob
    the committed run never widened)". Parts (i)-(iii) are falsifiable
    by a bounded <= 2 h experiment; part (iv) is flagged optimistic and
    unpriced. This record asserts no rank, changes no status, and is a
    candidate for the ranking, not evidence.

  mechanism: >-
    GROUNDED IN THE COMMITTED MACHINERY, STEP BY STEP.
    [M0 -- THE FORCING IDENTITY, ELEMENTARY, INTERNAL PRECEDENT.] For a
    model E : v^2 = s(u) over Q and squarefree d, the quadratic twist
    E^(d) has model d*v^2 = s(u); hence ANY rational pair (b, r) with
    s(b) = d * r^2 IS a rational point (b, r) on E^(d), by substitution.
    d a square recovers a point on E itself. This is the one-line
    identity already recorded internally by IDEA-20260829-01cbc5 (which
    derives it for the short Weierstrass model: (d*x0, d^2) on E^(d)
    whenever f(x0) = d); the quartic-model form used here is the same
    identity. Nothing downstream ever needs to FIND such a pair by
    descent or point search: the pair is exhibited the moment s and b
    are written down.
    [M1 -- THE COMMITTED ENGINE.] construct_highrank.py (TASK-20260822-
    a7a9e8, re-verified by EV-ECRANK-6695dc on all 1206 pool curves):
    A = {a_1..a_{2k}} distinct rationals (2k free parameters); p =
    prod(x - a_i) monic degree 2k; g = the UNIQUE monic degree-k
    polynomial with deg(p - g^2) <= k - 1 (exact coefficient matching,
    polysqrt_trunc -- k conditions consuming the k non-leading
    coefficients of g); s := g^2 - p. Then s(a_i) = g(a_i)^2 holds
    IDENTICALLY for all 2k points -- the square conditions are not
    solved, they are automatic. Elliptic exactly when deg s <= 4, i.e.
    2k <= 10 (M8: cubic, ceiling 7; M10: quartic, ceiling 9 -- one
    function-theoretic relation each, from g - y). What it certified:
    rank 13 over Q on E alone, i.e. ONE twist class (d = 1), with
    numerical-regulator independence and an augmentation scan over
    |n| <= 400, d <= 12 that was never widened.
    [M2 -- THE MULTI-CLASS GENERALIZATION: THE DELTA MULTIPLIER.] Fix n
    distinct rationals b = (b_1..b_n) and squarefree classes d =
    (d_1..d_n) drawn from ONE k = 3 coset d0*V of the committed support
    {-1, 2, 3, 5, 7, 11, 13}. Let delta := the Lagrange interpolant
    with delta(b_i) = d_i (degree <= n - 1, unique, ALWAYS exists,
    consumes ZERO degrees of freedom; the exact-equality version is
    used for cleanliness -- the weaker requirement delta(b_i) = d_i *
    square only adds freedom). For g of degree k_g set s := delta*g^2
    mod p, p = prod(x - b_i) (equivalently s = delta*g^2 - p*h with h
    the quotient -- h is NOT a free unknown). Then s(b_i) =
    delta(b_i)*g(b_i)^2 - p(b_i)*h(b_i) = d_i * g(b_i)^2 holds
    IDENTICALLY FOR EVERY g: the n simultaneous class-d_i conditions
    are by construction, exactly as the red team's sentence requires.
    The ONLY constraints are (a) ellipticity deg s <= 4: the top n - 5
    coefficients of the remainder delta*g^2 mod p must vanish -- n - 5
    QUADRATIC equations in the k_g + 1 coefficients of g; and (b)
    nondegeneracy: g(b_i) != 0 (points non-torsion candidates), s of
    degree exactly 3 or 4, s nonsingular, points independent. Solution-
    family dimension of (a): k_g + 1 - (n - 5) = k_g + 6 - n (>= 0 iff
    k_g >= n - 6): n = 8, k_g = 4 -> 2-dimensional; n = 10, k_g = 5 ->
    1-dimensional; n = 12, k_g = 6 -> 0-dimensional, k_g = 7 ->
    1-dimensional. THE DEGREE-MULTIPLICATION PREMISE OF THE DOMINATION
    OBJECTION IS FALSE IN THIS FORMULATION: s stays quartic, delta has
    degree <= n - 1, every condition is degree 2 at any n, and only the
    NUMBER of conditions grows, linearly. At d = (1..1) the system
    CONTAINS Mestre's trunc-sqrt as a solution whenever n <= 10
    (audit 1); for n >= 12 Mestre's closed form gives deg s = n/2 - 1
    >= 5 -- a genus >= 2 curve -- so the vanishing system is strictly
    stronger than Mestre EVEN AT d = 1: the engine is a genuine
    generalization, not a relabeling.
    [M3 -- THE SUBSPACE FORM: WHERE THE SEARCH LIVES, EXPLICIT PARAMETER
    COUNT.] The conditions s(b_i) = d_i*r_i^2 (deg s <= 4) say exactly
    that v = (d_1*r_1^2, ..., d_n*r_n^2) lies in W(b) := the image of
    the evaluation map s |-> (s(b_i)) on the 5-dimensional space of
    quartics -- a computable 5-dimensional subspace of Q^n for n >= 5
    (left kernel: the n - 5 independent linear relations c_l.v = 0 from
    the 5 x n Vandermonde matrix (b_i^j)_{j <= 4}). Equivalently u :=
    (r_i^2) must lie in W'(b) := D^-1 W(b), D = diag(d) -- ANOTHER
    5-DIMENSIONAL SUBSPACE, computable by linear algebra from b alone.
    Multi-class forcing = FINDING A POINT OF W'(b) WHOSE EVERY
    COORDINATE IS A NONZERO RATIONAL SQUARE. PARAMETER COUNT, EXPLICIT:
    unknowns b (n) + r projectively (n - 1); conditions n - 5
    homogeneous quadratic (DIAGONAL in u); family dimension (n - 1) + n
    - (n - 5) = n + 4 for every n >= 6; at n <= 5 there are NO
    conditions at all (any class pattern on <= 5 prescribed points is
    attainable -- the constraint genuinely begins at n = 6). Closed-
    form vs search boundary: Mestre's trunc-sqrt solves the d = 1 case
    identically; for mixed d NO closed form is committed and the
    quadratic system is the SINGLE search step of the whole
    construction. Density heuristic (HEUR-1 below): for fixed generic
    b, expected number of square-pattern points of height <= H in
    W'(b) ~ H^5 lattice points * H^(-n/2) (each coordinate a square
    with probability ~ H^(-1/2)) = H^(5 - n/2): n = 6 -> H^2, n = 8 ->
    H^1 (ABUNDANT), n = 10 -> H^0 (finite, expected nonzero), n = 12 ->
    H^-1 (fixed generic b expected EMPTY; the n free b's must supply
    the solutions, expected ~ B^n * H^(5 - n/2) over a b-box of size
    B), n = 32 -> H^-11 at fixed b. n = 6 is the near-rigorous anchor:
    ONE diagonal quadratic form in 6 variables -- by Hasse-Minkowski
    (recalled pointer) a rational zero exists iff zeros exist at every
    local place, and both the real check (sign pattern: the coset
    contains negative classes whenever -1 is in its direction space, so
    the diagonal form is indefinite) and the p-adic checks are minutes
    of exact arithmetic.
    [M4 -- RELATIONS AND CEILINGS, MEASURED NOT ASSUMED.] Mestre's one
    relation (sum of forced points = O, via the function g - y) lives
    in class d = 1 and eats exactly 1 point there (committed ceilings 7
    and 9, both attained exactly per EV-ECRANK-6695dc). For a
    NONTRIVIAL class e the descended norm g^2 - s does NOT vanish at
    the forced class-e points -- (g^2 - s)(b_j) = (1 - d_j)*g(b_j)^2
    != 0 when d_j != 1 -- so no automatic per-class relation is
    inherited; the prediction is c_e <= 1 relation per nontrivial class
    carrying n_e = 2 points, and the FIRST EXPERIMENT MEASURES c_e
    (P2) rather than assuming it. Cross-class independence is EXACT by
    the committed eigenspace argument (distinct square classes ->
    distinct chi_d-isotypic components of Gal(K/Q) -> Z-independence by
    algebra, no numerics: twist_family.py, analysis.md, KN-TECH-eb06ea).
    Within-class independence is certified by the exact F_l-reduction
    certifier proposed by IDEA-20260829-d53906 (stdlib, descent-free;
    its instrument measured 31 jointly independent points in 1.831 s
    over 45 good primes, RUN-ECQ-f5af06-v2-A-certify), with the
    numerical regulator as a cross-check only, never as the certificate.
    CERTIFICATE-KIND SPLIT IS CARRIED IN EVERY TOTAL (the O-06
    guardrail): a k = 3 total of T decomposes as (exact eigenspace
    units, <= 8) + (F_l or regulator multiplicity units). At k = 3 the
    exact ceiling is 8 and is saturated everywhere in the committed
    scan (PA-03), so any total above 8 is necessarily weaker in kind
    than the held degree-32 certificate that is 32 exact with no
    floating point anywhere -- and no record from this line may say
    "degree 8 beats degree 32" without the split.
    [M5 -- CERTIFICATION PATH, ALL COMMITTED MACHINERY, ZERO DESCENT.]
    Forced points per class -> per-twist quartic-to-cubic reduction
    (committed quartic_reduction / cubic_to_weierstrass, with built-in
    exact on-curve rechecks) -> transport into E(K) through the
    committed certificate machinery's explicit transport factor (the
    GOAL-ECRANK-001 XOR-cancellation failure mode was found and fixed
    by the independent verifier -- analysis.md) -> exact eigenspace
    independence across classes + F_l within classes -> Mazur
    non-torsion on every point (m*P != O, m = 1..12) -> Kummer: [K:Q] =
    8 certified by 2^3 - 1 = 7 exact integer square tests (no
    factorization needed). The scoring convention min(r_low, #points)
    with PARI's r_low -- which is what made EVERY committed k = 3
    per-class number descent-dependent -- is BYPASSED entirely: every
    claim is a lower bound from exhibited points, and r_low is never
    computed. No PARI ellrank, no 2-descent, no root numbers.
    [M6 -- THE SCALE ROUTE PAST THE WALL: CONSTRUCTION SEEDS, EXACT
    SCAN FILLS.] The ellipticity wall (deg s <= 4 caps forced n at the
    H^(5-n/2) density decay past n = 10) means the route to a large
    k = 3 total is NOT one quartic with 32 forced points. It is: force
    a core (n = 8-10 points across 4-5 classes) BY CONSTRUCTION, then
    fill the remaining classes and multiplicities with a PER-CLASS
    AUGMENTATION SCAN: for each class d of the coset, scan rationals u
    = num/den in a declared box and test s(u) = d * square by exact
    integer arithmetic -- the exact generalization of the committed
    extra_quartic_points (which scans for s(u) square, i.e. class 1
    only, over |n| <= 400, d <= 12 -- "the untouched knob" per the
    producer's own report and EV-ECRANK-6695dc inference (1)). The scan
    is a SEARCH (legitimate in a future approved experiment; this
    filing runs none), costs O(box) exact ops per class, needs NO
    descent, and its yield on constructed quartics is UNMEASURED --
    which is exactly what P3/F6 make falsifiable.

