  heuristic_assumptions:
  - id: HEUR-1
    formal_statement: >-
      For a fixed generic n-tuple b of distinct rationals and squarefree
      d with mixed signs, the set {u in W'(b) : every u_i a nonzero
      rational square} has counting function ~ C(b,d) * H^(5 - n/2) as
      the height bound H grows, with C(b,d) > 0 iff the system is
      solvable at every local place.
    random_model_justification: >-
      Points of a fixed 5-dimensional rational subspace of height <= H
      number ~ H^5 (lattice-point count in a rational subspace); a
      coordinate of size ~ X is a rational square with probability ~
      X^(-1/2) (square-counting), and square-class equidistribution of
      subspace-point coordinates is the standard random-model assumption
      in this genre (the same heuristic family that predicts square
      values of polynomial systems; nearest recalled pointers:
      Schinzel-type square-pattern heuristics, Nagao-style Diophantine
      constructions -- both RECALLED, pointers only, never support).
    falsification_condition: >-
      F1 (declared box exhausted at n = 8 with no instance) or F4
      (height blow-up beyond 10^8 on every found instance).
    validation_plan: P0/P1/P3 of this record, distribution of found-instance counts vs H.
  - id: HEUR-2
    formal_statement: >-
      For a nontrivial twist class e != 1 carrying n_e forced points
      from the delta-multiplier engine, the number of independent
      function-theoretic relations among the forced points over Q is
      c_e = 0 when n_e <= 2 (no automatic relation descends; M4).
    random_model_justification: >-
      Not a random model -- a divisor argument: the only committed
      relation producer (g - y and its norm g^2 - s) provably does not
      vanish at forced points of nontrivial classes, ((g^2 - s)(b_j) =
      (1 - d_j) g(b_j)^2 != 0). Residual relations would be accidental
      (special position of the b_i), which genericity excludes.
    falsification_condition: F3 (c_e >= 2 measured for most nontrivial classes).
    validation_plan: P2 -- F_l certifier and regulator cross-check on the P1 instance.

