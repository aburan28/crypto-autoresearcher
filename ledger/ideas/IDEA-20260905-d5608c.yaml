    quantifier_order: >-
      AUDIT 3, CARRIED. The claim is a pure existence statement,
      finite and exhibitable: EXISTS a quartic s, EXISTS distinct
      rationals b_1..b_n, EXISTS r_1..r_n (all explicit), SUCH THAT FOR
      ALL i: s(b_i) = d_i*r_i^2, the model is nonsingular, the points
