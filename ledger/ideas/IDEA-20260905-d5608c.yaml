  title: >-
    Force points across several twist classes of ONE k = 3 coset at once:
    a delta-multiplier generalization of the committed Mestre engine that
    produces multi-class twist points BY CONSTRUCTION, with the explicit
    degrees-of-freedom arithmetic, the density heuristic, and the named
