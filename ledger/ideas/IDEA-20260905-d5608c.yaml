      stated (the forcing identity is a theorem; failure there is a
      defect in the record, not in the mathematics).
  - id: F6
    condition: >-
      At P3, the per-class augmentation-scan yield on constructed
      instances is statistically indistinguishable from the null-object
      random-quartic yield => the seeds-and-fills route (M6) buys
      nothing measurable and P4's only open path closes.

  domination_objection:
    objection_as_stated_by_the_prior: >-
      Per-class single-twist Mestre runs (4-5 separate runs, one per
      class) may dominate joint multi-class forcing, because
      simultaneous conditions multiply the degrees of the polynomial
      identities required.
    premise_check_degree_multiplication: >-
      THE PREMISE IS FALSE IN THIS FORMULATION, AND THE RECORD SHOWS IT
      RATHER THAN ASSERTS IT: in M2/M3 the curve polynomial s stays
      quartic at every n, delta has degree <= n - 1 by interpolation,
      and every forcing condition is a degree-2 equation -- degrees do
      not multiply with the number of classes; only the NUMBER of
      conditions grows (n - 5, linear). Degree growth DOES enter at one
      named place: g's degree must satisfy k_g >= n - 6, so deg(delta*g^2)
      = n - 1 + 2*k_g grows linearly (not multiplicatively) in n, and
      coefficient heights with it -- unpriced at n >= 12, flagged in P4.
    what_the_per_class_baseline_actually_produces: >-
      A single-class forcing run for class d is, by M0's identity, an
      ORDINARY Mestre run on F := E^(d) followed by re-labeling E =
      F^(d): 4-5 such runs produce 4-5 DIFFERENT curves E_1..E_m, each
      with exactly ONE populated class. The k = 3 total is a per-curve
      quantity -- rank E(K) = sum over the 8 classes of rank E^(d)(Q)
      for ONE E -- so the baseline's remaining 7 classes per curve
      require a descent or point search PER CLASS on curves of
      constructed size. That is measured-blocked, not merely expensive:
      31 of 31 PARI ellrank calls hit the 25 s alarm on exactly these
      curves (|a_i| ~ 1e25; O-07 of RT-20260904-de2fa2), and the
      committed twist search found NO twist of rank >= 5 in 364,756
      candidates at small scale (EV-ECRANK-b6c9b6 / analysis.md). The
      per-class baseline therefore CANNOT PRODUCE THE OBJECT AT ANY
      PRICE: one curve, >= 4 populated classes, certified without
      descent. On the target axis its cost is not lower -- it is
      infinite (blocked), and per rule 3 the blockage is an
      infrastructure/cost fact, never evidence against the mechanism.
    cost_model_at_certified_parameters: >-
      Joint forcing, n = 8, m = 4: delta by Lagrange interpolation,
      O(n^2) ~ 64 exact rational ops; b in affine normal form (x |->
      alpha*x + beta preserves the forcing structure with controlled
      rescaling of s and r; fix b_1 = 0, b_2 = 1) leaving ~ 10^5-10^7
      candidate b-tuples; per b: left kernel of the 5 x n Vandermonde,
      O(n^3), plus a square-pattern point search in the 5-dimensional
      W'(b) (fibration: fix 5 of the 8 r-coordinates in a small box ~
      10^4, leaving 3 conics in P^2 -- at most 8 intersection points by
      Bezout, rationality checked exactly), ~ 10^3 ops per b. TOTAL ~
      10^8-10^10 exact rational operations: single-core minutes-to-
      hours, < 4 GB. Single-class Mestre baseline: ~ 9.4 ms per curve
      (committed M10 measurement) -- ~ 10^6 times cheaper PER OBJECT,
      and the object is not the one C2/the k = 3 total measures.
      VERDICT: joint forcing strictly wins on the only comparable axis
      (multi-class objects without descent: baseline cost infinite vs
      <= 2 h); the baseline strictly wins on the single-class axis
      (certified 13 over Q) -- and this proposal makes NO single-class
      claim, so there is nothing there to dominate.

  by_construction_not_by_descent: >-
    PRIOR POINT (d), DISCHARGED. The forced points are EVALUATIONS:
    given (b, r) solving the quadratic system, s is linear algebra (the
    5-coefficient interpolation space meeting the n consistent
    conditions), and (b_i, r_i) is a point of E^(d_i) by the M0
    identity -- substitution, exact, no oracle. NO STEP FINDS POINTS BY
    DESCENT: class membership is an INPUT (the d_i are chosen from a
    committed-support coset; distinctness mod squares is F_2 linear
    algebra over {-1,2,3,5,7,11,13}); r_low is never computed, so the
    min(r_low, #points) convention that made every committed k = 3
    number descent-dependent is bypassed; independence is eigenspace-
    exact across classes and F_l-exact within classes, neither of which
    descends; [K:Q] = 8 is 7 exact square tests, no factorization. The
    ONLY search in the whole pipeline is the Diophantine solve of the
    quadratic system for (b, r) and (in M6) an exact-square-test
    augmentation scan -- searches over polynomial systems and integer
    boxes, categorically not descents. N2's why-clause therefore holds
    as stated: the twist points are produced BY CONSTRUCTION. HONEST
    INHERITANCE NOTE: if HEUR-1 fails and (b, r) can only be found in
    enormous boxes, the COST objection grows -- but the descent-
    infeasibility obstacle is still not inherited, because no descent
    occurs at any box size.

  walls:
  - id: H1
    name: the ellipticity wall
    statement: >-
      deg s <= 4 caps what ONE elliptic quartic can force: Mestre's own
      closed form gives deg s = n/2 - 1 (elliptic only for n <= 10);
      fixed-b solution density decays as H^(5 - n/2) (H^-1 at n = 12,
      H^-11 at n = 32); and for n >= 12 the vanishing system is
      strictly stronger than Mestre even at d = 1 (no closed form). The
      parameter count SURVIVES multi-class forcing -- abundantly at
      n = 8, borderline at n = 10 -- and the route past the wall is
      M6 (construction seeds 4-5 classes; the exact per-class scan
      fills), whose yield is unmeasured and whose failure mode is F6.
      This wall is the honest bottom line of the degrees-of-freedom
      arithmetic the prior demanded, and it is why P4 is flagged
      optimistic rather than predicted.

