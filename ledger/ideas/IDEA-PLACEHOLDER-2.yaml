idea:
  id: IDEA-PLACEHOLDER-2
  question_id: RQ-ECQ-e9b361
  goal_id: GOAL-ECQ-2298dc
  title: >-
    A calibrated Nagao-sum oracle for the GENERIC rank of a family over Q(t):
    the enabling instrument for every base-rank idea in this set
  class: tooling

  claim: >-
    The truncated Nagao sum S_X(E) = (1/X) * sum_{p <= X} (-A_E(p) * log p), where
    A_E(p) = (1/p) * sum_{t mod p} a_p(E_t), estimates rank E(Q(t)) to within +/- 1
    at X = 2000 for non-isotrivial families of arithmetic genus chi <= 4 with
    conductor-degree comparable to the Mestre and Elkies families, at a cost of
    under 10 CPU-seconds per family - four to six orders of magnitude cheaper than
    exhibiting generic sections or than descent on a specialisation. Falsifiable:
    if the estimator's residual against ground-truth generic ranks has standard
    deviation above 1.5 on the calibration set, the oracle is not usable and every
    family-level search in this set must be re-costed.

  mechanism: >-
    Every base-rank idea in this set (IDEA-PLACEHOLDER-3, -4, -7, -8) requires
    scoring MANY candidate families by their generic rank over Q(t). The only
    methods this program has used for that are exhibiting sections symbolically or
    computing Shioda-Tate ceilings, and neither scales: the first is a Groebner-type
    computation per family, the second gives an upper bound only (BATCH-541940
    measured 13391 ceilings but the ceiling is not the rank - EV-ECQ-8ee697 B-5).
    Nagao's conjecture supplies a cheap DIRECT estimator of the rank itself, and
    Rosen-Silverman proved it follows from Tate's conjecture, unconditionally for
    rational elliptic surfaces. The estimator is a sum over primes of a fibral trace
    average; each A_E(p) costs one pass over t in F_p with a point count per fibre,
    i.e. O(p * log p) with baby-step-giant-step or O(p) with a precomputed character
    table for the family's Weierstrass form.
    The point of this record is NOT to assert Nagao's conjecture. It is to CALIBRATE
    the estimator against families whose generic rank this program already knows
    exactly, so that its residual distribution is a measured quantity rather than an
    article of faith, and so that any later use of it carries an error bar.

  tracked_object: >-
    A_E(p), the average fibral trace of Frobenius of the family at p - one rational
    number per prime, per family.

  lossy_projection_test: >-
    PASSES, and it is the cleanest instance in this set. The projection
    E/Q(t) |-> (A_E(p))_{p} discards the equations, the sections, the fibre types,
    the heights and the field of definition of each section, retaining a single
    average per prime. It is compatible with the operations the search performs:
    A_E(p) of a quadratic twist by D is the average of chi_D(t) * a_p(E_t), and
    A_E(p) of a base change is computable from the pieces, so the retained data
    propagates deterministically under twisting and base change - exactly the moves
    IDEA-PLACEHOLDER-3 makes. It is massively non-injective (infinitely many
    families share any finite set of A_E(p)), which is what makes it a projection
    and not a re-coordinatisation, and it is why the oracle is a FILTER whose hits
    must be confirmed by exhibiting sections, never a certificate.

  novelty_status: adaptation
  novelty_note: >-
    Nagao's conjecture and its use as a rank estimator are established; using it as
    a high-throughput screen over a parametrised space of FAMILIES (rather than to
    estimate the rank of one family of interest) is the adaptation. The calibration
    protocol and the residual distribution are, as far as this session's retrieval
    goes, not published. The classification `adaptation` rests on citations marked
    retrieved below; the specific claim about Rosen-Silverman is only
    summary-level and is flagged.

  citations:
    - ref: "Rosen, Silverman, On the rank of an elliptic surface, Invent. Math. 133 (1998); https://link.springer.com/article/10.1007/s002220050238"
      provenance: retrieved
      claim: >-
        PARTIALLY VERIFIED, SEARCH-SUMMARY LEVEL ONLY. Relied on for: Tate's
        conjecture on the order of vanishing of L_2(E, s) implies Nagao's limit
        formula lim_{X} (1/X) sum_{p <= X} (-A_E(p)/p) log p = rank E(Q(t)); and the
        formula is proved unconditionally for rational elliptic surfaces. The paper
        itself was NOT opened this session - only a search engine's summary of it and
        of secondary sources quoting it. NOTE the discrepancy in the normalisation
        between the two summary statements retrieved (one with a 1/p inside A, one
        without); the calibration experiment must fix the normalisation empirically
        against known-rank families and record which convention it used.
      verified_by: idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)
    - ref: arXiv:2105.10805
      provenance: retrieved
      claim: >-
        "From the Birch and Swinnerton-Dyer conjecture to Nagao's conjecture" -
        abstract read verbatim: if the limit (1/log x) sum_{p <= x} a_p log p / p
        exists then it equals -r + 1/2, and the authors relate this to Nagao's
        conjecture. Relied on only for the existence of active recent work tying the
        two; the abstract does not state Nagao's conjecture.
      verified_by: idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)
    - ref: KN-FIND-6b3e17
      provenance: internal
      claim: >-
        Provides the calibration fixture: a pencil of plane cubics through 8 rational
        points whose base rank over Q(t) is EXACTLY 8, proved by squarefree
        discriminant (all 12 fibres I_1, Shioda-Tate has nothing to subtract), with
        every input verified in exact rational arithmetic by an independent reviewer.
        Also records that 2-descent closes on its specialisations, so ground truth is
        available.
      verified_by: idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)
    - ref: EV-ECQ-8ee697
      provenance: internal
      claim: >-
        Provides 13391 admissible Mestre families with exactly recomputed
        Shioda-Tate ceilings (17 at ceiling 5, 16 at 7, 13257 at 9, 5 at 11, 82 at
        13, 14 at 15), and the standing warning that the ceiling is an UPPER bound on
        the geometric rank and not the rank. These are the negative-control families
        for the oracle: a family of ceiling 5 cannot have generic rank above 5.
      verified_by: idea-generator session for RQ-ECQ-e9b361, 2026-08-24 (no TASK id issued)

  assumptions:
    - Nagao's limit formula holds for the families in the calibration set. This is
      NOT assumed as truth: it is the thing the calibration measures. A family where
      the estimator misses the known rank is a datum about the estimator (or about
      the conjecture at that chi), not a discarded outlier.
    - Fibre-counting at p is implemented correctly; verified by the controls below.

  proof_search_map:
    not_applicable_reason: >-
      Instrument construction, not a proof-oriented proposal. No theorem is claimed
      and no certificate is issued: the deliverable is a measured residual
      distribution for a screening statistic. The four audits are recorded as
      not-applicable for that reason, EXCEPT baseline reproduction, which is the
      whole experiment and is specified under minimal_test.
    bottleneck: null
    baseline_embedding:
      parameter_slice: >-
        The rank-8 pencil of KN-FIND-6b3e17, whose generic rank is exactly 8 and
        proved. The estimator must return 8.0 +/- 1 on it.
      reproduction_check: frozen fixture with the recovered estimate and its residual
    observation_collision:
      observable: the vector (A_E(p))_{p <= X}
      distinct_preimage_search: >-
        Deliberately construct two families of DIFFERENT known generic rank whose
        truncated Nagao sums agree to within the measured residual - e.g. a rank-8
        rational elliptic surface and a rank-9-or-more base change. Such a pair is
        expected to exist and its existence is the honest statement of the oracle's
        resolution limit, not a refutation.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: A_E(p) as a per-prime resource measure summed over disjoint primes
        predicted_gain: a rank estimate at O(X^2 / log X) fibre operations rather than a symbolic section search
    quantifier_order: >-
      FOR ALL families in the calibration class, THERE EXISTS X <= 2000 such that
      |S_X(E) - rank E(Q(t))| <= 1. The experiment tests the weaker and honest
      version: measure the distribution of S_2000(E) - rank over the calibration
      set. A uniform-in-family claim is NOT made and would be the wrong quantifier.
    method_ceiling:
      strongest_certifiable_claim: >-
        A ranked shortlist with an error bar. The oracle can never certify a rank; a
        rank lower bound requires exhibited sections and a rank upper bound requires
        Shioda-Tate or descent.
      nearby_object_control: >-
        An ISOTRIVIAL family (constant j), where Nagao's formula is known to behave
        differently and where the geometric rank can be large for trivial reasons.
        The oracle must be shown to misbehave there, and the screen must exclude
        isotrivial candidates by a j-map degree check rather than by trusting the
        score.
    proof_obligations:
      - claim: residual distribution of S_X against known generic ranks
        responsibility: correctness
      - claim: cost per family at X = 2000
        responsibility: runtime
      - claim: the screen's false-negative rate on high-rank families
        responsibility: success_probability

  predictions:
    - metric: standard deviation of (S_2000(E) - true generic rank) over the calibration set
      direction: lower
      minimum_effect: "<= 1.0 for the oracle to be usable; > 1.5 falsifies the claim"
    - metric: Spearman correlation of S_2000 with true generic rank over the calibration set
      direction: higher
      minimum_effect: ">= 0.9"
    - metric: wall-clock seconds per family at X = 2000
      direction: lower
      minimum_effect: "<= 10 s on one core"
    - metric: score of a ceiling-5 Mestre family
      direction: lower
      minimum_effect: "<= 5 + residual; a ceiling-5 family scoring 9 falsifies the implementation"

  minimal_test:
    design: >-
      Calibration set of at least 60 families with independently known generic rank:
      (a) the rank-8 pencil of KN-FIND-6b3e17 and at least 10 further 8-point pencils
      with squarefree discriminant, each rank exactly 8 by the same argument;
      (b) Mestre families from BATCH-541940 stratified by Shioda-Tate ceiling
      (5, 7, 9, 11, 13, 15), using the ceiling as an upper bound and an exhibited
      section count as a lower bound, retaining only families where the two meet;
      (c) constructed families of known rank 0 (generic Weierstrass equation with
      random coefficients of the right degrees - the same degree-matched null objects
      the BATCH-541940 validator built for control C1);
      (d) at least 3 isotrivial families as the nearby-object control.
      Compute S_X for X in {200, 500, 1000, 2000} and report residual distribution,
      Spearman correlation, and cost, per X and per chi.
    controls:
      - Null object: random degree-matched families with no construction and
        expected generic rank 0. The oracle must return near 0. This is the exact
        control the BATCH-541940 validator built (deg A = 8, deg B = 12) and it is
        reused so the two rounds are comparable.
      - Decay control: the residual must NOT be flat in X. A statistic that is
        identical at X = 200 and X = 2000 is not converging to anything and is the
        canonical artifact tell.
      - Sign/normalisation control: report which of the two retrieved normalisation
        conventions was used and the estimate under both.
    required_metrics:
      - per-family S_X for each X, with the true generic rank and its provenance
      - residual mean, sd, and full histogram, by chi and by X
      - Spearman(S_2000, true rank)
      - wall-clock and RSS per family
      - the two-family collision pair, if found, with both true ranks

  falsification_conditions:
    - Residual sd > 1.5 at X = 2000 on the calibration set. The oracle is unusable
      and IDEA-PLACEHOLDER-3, -7 and -8 must be re-costed with a more expensive
      screen or abandoned at this budget.
    - The null families score away from 0 by more than the residual sd. The
      implementation is wrong.
    - The residual does not shrink from X = 200 to X = 2000. Nothing is converging;
      report a controlled null, not an instrument.
    - A ceiling-5 family scores above its ceiling by more than the residual. The
      fibre counting or the family parametrisation is wrong.

  confounders:
    - Bad primes and fibres of additive reduction bias A_E(p); the implementation
      must exclude them by the same rule for every family or the comparison across
      families is meaningless.
    - Large-height families cost more per prime, so a wall-clock-bounded run
      silently selects against them - the same censoring mechanism KN-FIND-6b3e17
      identified (Spearman(log|a6|, timeout) = +0.765). Cost must be measured, not
      capped.
    - Ceiling-derived "true ranks" in stratum (b) are upper bounds; using them as
      ground truth where sections were not exhibited would manufacture agreement.
      Only families where exhibited-section count equals the ceiling are admissible
      as ground truth.

  interpretation_limits:
    - The oracle SCREENS; it never certifies. No rank claim of any kind may cite it.
    - Calibrated on chi <= 4 and on these construction classes only; transfer to
      other chi or other constructions is an explicit extrapolation.
    - Nagao's conjecture is a conjecture. A residual is evidence about the estimator
      AND about the conjecture jointly, and the experiment cannot separate them.
      This is stated rather than hidden.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a non-isotrivial family E/Q(t) of arithmetic genus chi <= 4, the
        truncated Nagao sum S_X(E) converges to rank E(Q(t)) as X -> infinity, with
        fluctuation at finite X of size O(X^{-1/2}) times a family-dependent
        constant - i.e. the fibral traces a_p(E_t) behave, after removal of the rank
        contribution, like a mean-zero sequence with square-root cancellation.
      rigorous_support: >-
        Rosen-Silverman: Tate's conjecture implies Nagao's limit formula, and the
        formula is proved unconditionally for rational elliptic surfaces (chi = 1).
        The square-root-cancellation half imitates the Sato-Tate distribution for the
        non-rank part of the trace, which is the classical distribution statement
        being borrowed. Both are cited at summary level only.
    - id: H2
      statement: >-
        The residual distribution measured on the calibration set transfers to
        families of the same chi produced by twisting and base change, which are the
        families IDEA-PLACEHOLDER-3 will screen.
      rigorous_support: >-
        None. This is a pure transfer assumption and it is the weakest link. Its
        validation route is to include twisted and base-changed families of KNOWN
        rank in the calibration set - which is possible because the rank of a
        quadratic base change of the rank-8 pencil is 8 plus the twist rank, and the
        twist rank is independently computable for small examples.
      validation_plan: >-
        Sample at least 20 quadratic base changes of the rank-8 pencil, compute the
        twist rank exactly by symbolic section search at chi = 2 (feasible), and
        compare the oracle's estimate of the base-changed family's rank against
        8 + (exact twist rank). Report the residual separately for this stratum. Tail
        check: the largest observed |residual| in this stratum against the largest in
        the main calibration set; if the twisted stratum's tail is heavier by more
        than a factor of 2, the transfer fails and is reported as failed.

  target_complexity:
    time_exponent: >-
      O(X^2 / log X) fibre point-counts per family, i.e. about 3 * 10^5 fibre counts
      at X = 2000, target under 10 s/family on one core. Screening 10^4 candidate
      families is then about 30 core-hours.
    memory_exponent: negligible
    best_known: >-
      The alternative screen is a symbolic generic-section search or descent on a
      specialisation, at roughly 7.5 s per DESCENT for the cheapest known fixture
      (KN-FIND-6b3e17) and with 60 percent timeouts at larger height; that gives a
      rank lower bound for ONE specialisation, not the generic rank. The claimed
      gain is not a constant factor - it is a change of what is being measured, from
      one fibre to the family.
    hidden_overhead: >-
      The convergence rate hides in the constant: a family needing X = 10^4 to
      resolve costs 25x the budget. The calibration measures this rather than
      assuming it. Nothing here is asymptotic in a cryptographic sense and no
      exponent claim is made.
    tradeoff_note: >-
      Embarrassingly parallel over primes and over families; no memory-time tradeoff
      arises.

  null_object_control: >-
    Random degree-matched Weierstrass families with no construction (deg A = 8,
    deg B = 12 for chi = 2), reusing the BATCH-541940 validator's null generator so
    the two rounds are directly comparable. Required before any score is believed.

  reach_to_32: >-
    Alone it reaches nothing; it is declared as an enabling building block, in the
    sense the Idea Generator contract requires that to be said explicitly. It is a
    prerequisite for IDEA-PLACEHOLDER-3, -7 and -8, each of which is a candidate
    route to a family of generic rank >= 32 over Q(t), which by Silverman
    specialisation would give rank >= 32 over Q outright.

  dominated_by: >-
    n/a (no result claimed). As an instrument it is compared on cost against
    symbolic section search and per-fibre descent, both of which measure a different
    quantity; there is no Pareto row it competes with on time, memory or queries.
  sota_delta: >-
    No mathematical claim. Cost delta only: an estimate of generic rank at ~10 s per
    family versus a symbolic determination at minutes-to-hours per family, with the
    tradeoff being that the cheap version certifies nothing.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
