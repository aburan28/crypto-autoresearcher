# Auditable reduction chain required by AGENTS.md rule 13.
# Every link states what it establishes, its status (proved | conditional | open),
# and the artifacts that back it, so a reader can see exactly which link is
# load-bearing and which are proved vs assumed.
reduction_chain:
  id: CHAIN-ECDLP-001
  goal_id: GOAL-ECDLP-002
  goal_statement: 'total cost o(sqrt N) for ECDLP over a generic prime field'
  links:
    - step: 1
      name: localization
      claim: 'Total >= B + sigma*m!*N/(2^m B^{m-1}); beating rho requires sigma = o(N^{m/2-1})'
      status: proved
      refs: [research/THM-collection-lower-bound-20260722.md, KN-FIND-COLLECTION-LB-001]
    - step: 2
      name: m=2 closure
      claim: 'm=2 costs >= sqrt(2N) > rho for EVERY factor base (sumset cap)'
      status: proved
      refs: [research/THM-collection-lower-bound-20260722.md, KN-FIND-COLLECTION-LB-001]
    - step: 3
      name: generic closure
      claim: 'generic-group decomposition tests cannot beat rho (Shoup); MITM gives N^{2/3}'
      status: proved
      refs: [research/THM-collection-lower-bound-20260722.md]
    - step: 4
      name: naive algebraic closure
      claim: 'the naive S_4 oracle is Theta(B^2); MITM/root-finding/multipoint/FFT all >= O~(B^2) or O~(N)'
      status: proved
      refs: [KN-FIND-S4-ORACLE-001, KN-FIND-TOOLKIT-ROBUST-001]
    - step: 5
      name: instance-choice closure
      claim: 'choosing the factor base is self-defeating: shrinking the sumset destroys yield faster than it cheapens the test'
      status: proved
      refs: [research/THM-collection-lower-bound-20260722.md]
    - step: 6
      name: equivalence
      claim: 'sub-rho m=3 index calculus <=> a decomposition oracle with S*T = o(B^2) (3SUM-Indexing frontier)'
      status: proved
      refs: [KN-FIND-SP4-EQUIV-002, research/THM-collection-lower-bound-20260722.md]
    - step: 7
      name: CRUX
      claim: >-
        Does the algebraic structure of S_{m+1} yield such an oracle? Concretely:
        a decomposition test in o(B) time using O(B) space (gap to close: B^2 -> o(B)).
      status: open
      refs: [IDEA-20260722-002, KN-FIND-SP4-EQUIV-002, CORR-20260722-001]
      note: >-
        Conjecturally impossible for arbitrary sets (3SUM-Indexing); whether
        curve structure evades that is the open question. A positive resolution
        is the sub-rho algorithm; a negative one completes the no-go.
  load_bearing_link: 7
  status_summary: 'links 1-6 proved; link 7 open (equivalent to a fine-grained-complexity open problem)'
  recorded_at: '2026-07-22'
  recorded_by: coordinator
