# Authorized removals of otherwise-immutable run artifacts.
#
# Run records are append-only (AGENTS.md rule 4): a defective run is superseded
# by a NEW run id, never edited or deleted. tools/check_run_immutability.py
# enforces this. Deletion is therefore an EXCEPTION that must be recorded here
# before it will pass, so that an authorized removal is auditable rather than
# silently exempt. An unlisted modification or deletion still fails.
#
# Each entry must name: the path prefix removed, who authorized it, when, why,
# and where the removed content remains recoverable (git history is not erased).
authorized_removals:
  - path_prefix: experiments/EXP-SEMAEV-001/runs/
    authorized_by: user
    date: '2026-07-21'
    reason: >-
      User requested removal of the toy-curve ECDLP work added in this session
      ("Remove the toy curve stuff"). Toy-scale methodology instances only; no
      cryptographic sensitivity.
    recoverable_at: git history (commit 3c7131e and its parents)
  - path_prefix: experiments/EXP-SEMAEV-002/runs/
    authorized_by: user
    date: '2026-07-21'
    reason: Same removal request as EXP-SEMAEV-001.
    recoverable_at: git history (commit 3c7131e and its parents)
  - path_prefix: experiments/EXP-SEMAEV-003/runs/
    authorized_by: user
    date: '2026-07-21'
    reason: Same removal request as EXP-SEMAEV-001.
    recoverable_at: git history (commit 3c7131e and its parents)
