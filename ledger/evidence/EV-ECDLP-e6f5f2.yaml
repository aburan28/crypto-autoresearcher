  inference: >-
    Compose J1 and J2 and the round yields no recordable disposition. The six
    blocking repairs were performed, twelve conjuncts were checked separately
    and three mechanically, the nine lower-severity items were addressed with
    one reasoned declined sub-option, the archive is byte-clean, and the
    load-bearing Proposition was independently blind re-derived for the second
    time in this lane and found sound. That is a real and unusual quality of
    execution and it is recorded as such. But the re-issued artifact asserts at
    least four things its ground does not support, and one of its headline
    self-reported consequences is factually wrong on the corpus text - and wrong
    in the direction that made the artifact look MORE adverse to itself and to
    the corpus than the records warrant. A false universal sentence of exactly
    the class the round was commissioned to remove was reintroduced in the same
    section as the repair. Recording the erratum disposition now would ship a
    known-false universal, a self-contradicting cost line, an unscoped
    record-level negative conclusion, and a refuted census into the ledger
    behind a disposition label. The correct action is one bounded, zero-compute
    correction superseding by reference and never by edit, whose required
    content includes the threshold-sensitivity re-census the red team names as
    the cheapest falsification control in this lane, followed by the toy-scale
    measurement that supplies the null object this lane has never had.

  boundaries:
    - >-
      B-1. Everything established here is scoped to ECDLP-IDEA-436 disjunct D1,
      the pairwise coordinate-valuation profile, over the parameter class E over
      F_p with good reduction, S of order n with gcd(n,p) equal to 1, a
      Weierstrass model over Z_p realising the good reduction with discriminant
      valuation 0, the canonical order-n prime-to-p lift, the truncation
      convention with cap r, and both indices nonzero modulo n. Outside that
      class the collapse argument does not run as written, and per O-4 the
      EVALUATION ROUTE of Proposition E fails outright on a non-minimal integral
      model even though the disposition survives there.
    - >-
      B-2. Disjunct D2, a fixed statistic of the precision-r coordinate digits
      of a SINGLE lifted point, is NOT gated by this round and is not disposed.
      It remains open with the sub-question and the name-your-coincidence bar
      attached, that bar carrying its own self-label as a framing rather than a
      result.
    - >-
      B-3. KN-OPEN-3417fc is NOT closed, resolved or narrowed by this record. It
      quantifies over any computable non-group-theoretic coordinate or valuation
      invariant, and its own negative-resolution criterion is a MEASUREMENT at
      toy p that has not been performed. D1 is that open problem own headline
      worked example, which makes both a future disposition and the missing
      measurement more consequential than the phrase one named family conveys.
    - >-
      B-4. Nothing here bears on ECDLP hardness, on any deployed or standardized
      curve, or on any attack, speedup, novelty, breakthrough, closure or
      cryptographic-scale transfer, in ANY direction. Pollard rho and BSGS are
      unchallenged and no exponent moves. The anomalous additive transfer lies
      OUTSIDE the scope entirely, because gcd(n,p) equal to 1 excludes every
      generator of a curve of cardinality p, so this lane says nothing about it
      and must not be read as saying anything about it.
    - >-
      B-5. This record makes no official status change of any kind.
      ECDLP-IDEA-436, KN-FIND-002, KN-FIND-b7e091, EV-GGM-79e710, EV-GGM-001,
      KN-OPEN-3417fc, DEC-20260831-a9716f and DEC-20260901-70ba34 are untouched
      and stand exactly as committed. Corrections supersede and never overwrite.
    - >-
      B-6. Zero runs, zero experiments, zero implementations, zero p-adic
      arithmetic, zero timing, on the producer side and on both review sides. No
      seed, no sample, no measured obstruction. Any statement in this record
      that reads like a quantity is a derived value over a stated hypothesis
      class and is labelled as such.
    - >-
      B-7. The adjudication recorded in control_b_disagreement is a statement
      about what two committed corpus records SAY and about whether a criterion
      stated in this lane fires on them. It is NOT a statement about which
      reading of the incidence oracle governs the corpus, NOT a retiering of
      either finding record, and NOT an answer to any sub-question of
      DEC-20260901-70ba34.
    - >-
      B-8. Both reviewers recorded resolved_model_id as claude-opus-5 and
      recorded it as NOT probe-verified. The identifiers are session
      configuration, not verified configuration, and judgement across this lane
      is correlated.

  unresolved_confounds:
    - >-
      UC-1. No null-object control exists anywhere in this lane, because zero
      runs have occurred across four sessions and two rounds. The reported
      flatness in the precision parameter has never been measured against an
      object of the same shape for which it should NOT hold. The cheapest
      discriminating design is now RC-RT-2, the two-model toy tabulation on a
      minimal model and on the explicit non-minimal E prime with predictions
      pre-registered, which is a strict subset of RC-1 and is better than the
      record own declared negative control because the model constant provably
      moves the quantity. Neither has been run.
    - >-
      UC-2. Control B remains non-independent by construction. M1 and M2 were
      abstracted FROM the four KN-FIND-002 classifications and then validated BY
      reproducing them, which is a fit statistic on the training set. The O-6
      correction gives M2 one corpus firing instance independent of D1 but does
      not give it a HELD-OUT one, so RC-3, a held-out object in the FIRING
      direction outside both finding records, remains required and undischarged.
    - >-
      UC-3. The threshold sensitivity of the census is UNMEASURED. The red team
      states an expectation that an n to the o(1) threshold would change the
      endomorphism, elliptic-net and incidence rows and would stop the
      corroboration narrowing to the handle branch, and it labels that as what
      the re-census would determine rather than as a finding. This record
      likewise carries it as a PREDICTION TO BE CHECKED and adopts no predicted
      census row as a result. Note in particular that the corrected endomorphism
      simulator computes a Frobenius eigenvalue from a public characteristic
      polynomial, which is local bit-work rather than a handle operation, so
      whether it fires under a relaxed threshold depends on how the threshold
      treats local bit-work - which is itself part of what the re-census must
      declare.
    - >-
      UC-4. Which oracle interface the machine-checkable classifier of
      EXP-GGM-001 implemented is UNKNOWN to this record. No session in this lane
      has opened experiments/EXP-GGM-001/simulability_test.py; the erratum
      itself records RC-4, a frozen regression fixture against that file, as
      required and undischarged, and notes that every reproduction in this lane
      is of PROSE and never of an implementation. That fact is decisive for the
      routed round Q1 and is not supplied here.
    - >-
      UC-5. The erratum remains uncorrected at the time of this record. The
      false universal sentence, the contradicted cost line, the two unscoped
      record-level sentences and the refuted census all stand in the committed
      artifact a later reader will open. Records are immutable, so the repair is
      a superseding correction artifact and never an edit.
    - >-
      UC-6. Two external pointers remain unopened by anyone in this program, and
      the corpus literature entry the licensing discussion leans on discloses
      that its own underlying paper full text was never read. Both are correctly
      marked in the erratum and neither is load-bearing on anything recorded
      here.

