  round_composition:
    composition_rule: >-
      Joints are the load-bearing steps of the claim and are conjunctive by
      construction, as templates/research-records.md states them. A blinded
      reviewer reports on its own joint and cannot see the other, so neither
      report is a whole-claim verdict and the Coordinator composes them. A
      validator holds on J1 and a red team breaks on J2 is therefore a SPLIT,
      and the claim as stated does not carry. This is the second consecutive
      split on this artifact lineage; the first is recorded in EV-ECDLP-048824.
    joints:
      - joint_id: J1
        name: 'Are the six blocking repairs of DEC-20260831-a9716f actually discharged'
        owner_task: TASK-20260901-a8e281
        owner_role: validator
        requested_policy: review-adversarial
        reasoning_effort: xhigh
        resolved_model_id: claude-opus-5
        resolved_model_probe_verified: false
        independent_session: true
        attested_verdict: holds
        full_disposition_as_recorded: 'passed, with five findings, all recorded non-blocking on J1'
      - joint_id: J2
        name: >-
          Is the model-free re-founding sound, and does the two-part disposition
          claim only what it supports
        owner_task: TASK-20260901-8def30
        owner_role: red-team
        requested_policy: review-adversarial
        reasoning_effort: xhigh
        resolved_model_id: claude-opus-5
        resolved_model_probe_verified: false
        independent_session: true
        attested_verdict: breaks
        full_disposition_as_recorded: >-
          Breaks on the SECOND half of the joint only. Proposition E itself was
          independently re-derived and found sound; the break is that the
          erratum asserts things its ground does not support, and that one of
          its headline findings is refuted on a pre-registered break condition
          the review plan itself declared.
    composed_disposition: >-
      The repairs were performed and the load-bearing mathematics holds, on two
      blind re-derivations across two rounds plus one independent non-blind
      re-derivation in this one. The re-issued artifact
      nevertheless overclaims in at least four identified places and states one
      headline consequence that is refuted on the corpus text. The erratum
      recommended disposition is therefore NOT recorded as official in this
      archive. ECDLP-IDEA-436 status is unchanged and its record remains frozen.
      KN-OPEN-3417fc is not closed, resolved or narrowed. D2 remains not gated.

  observations:
    - >-
      O-1 (J1 and J2, derivation tier, convergent). Proposition E is SOUND. The
      validator wrote and SEALED a full independent re-derivation before opening
      either blind_from path, sealed sha256
      1df2e97b01f31430b9f6539fec54b8db49dfc740cc0f545afcf5426bb804944c,
      timestamped 2026-09-01T16 56 50Z, and reached the same statement, the same
      route and five caveats that match the erratum. The red team, in a separate
      blinded session and without reading the validator report, re-derived
      Proposition E from its stated ingredients and reports no error and no gap.
      STATED PRECISELY, BECAUSE INDEPENDENCE IS NOT ONE THING: the validator
      re-derivation is BLIND, sealed before it opened the artifact, as the plan
      required; the red-team re-derivation is INDEPENDENT BUT NOT BLIND, since
      that session had read the erratum, and it is recorded as re-derived from
      the stated ingredients rather than accepted from the producer reading. One
      blind and one independent re-derivation in this round, plus the sealed
      blind re-derivation of the prior round recorded as O-1 of EV-ECDLP-048824,
      agree on the two-valued dichotomy and on the group-theoretic separating
      predicate. Scope: the value-set claim only, over the repaired parameter
      class of boundary B-1.
    - >-
      O-2 (J1). The six blocking repairs R-F1, R-OBJ1, R-OBJ2, R-OBJ6, R-OBJ7
      and R-OBJ8 of DEC-20260831-a9716f are PERFORMED in the erratum body and
      not merely named in the producer own audit table. The validator checked
      twelve conjuncts separately against the verbatim repair text, verified
      three of them mechanically by grep over the erratum bytes rather than by
      reading, read the producer audit table only after checking the body, and
      found zero rows that overstate and zero that understate. All nine
      lower-severity items are addressed, with one sub-option declined and
      reasoned, so the task card Gate 4 silence test passes with zero silent
      items.
    - >-
      O-3 (J1, artifact integrity). The snapshot archive is admissible. Commit
      3cf1ccf68 is an ancestor of HEAD, changes exactly the four declared paths
      with insertions only, and all three bound producer hashes recompute
      identically from the commit AND from the working tree. The supersession is
      by reference and not by edit: the superseded memo hashes identically at
      its own snapshot commit and in the working tree, and that hash matches the
      one the erratum quotes in its own header. ECDLP-IDEA-436, KN-FIND-002 and
      KN-FIND-b7e091 are byte-identical to their state at the snapshot commit.
      The validator re-ran every hash check after HEAD advanced mid-review to
      89242533a and recorded that as procedure note PN-1 rather than absorbing
      it.
    - >-
      O-4 (J2, F-RT1, major; independently reached at low severity by the
      validator as F-V1). The erratum reintroduces a FALSE UNIVERSAL SENTENCE of
      exactly the class R-F1 was commissioned to remove, in the same section as
      the repair. The sentence, quoted verbatim from section C.1 with markdown
      backticks removed and no other change, reads: Consequently Proposition E
      of section C.2 holds on every admissible integral model, with the single
      F_p comparison joined by the public model constant c. It is refuted by the
      erratum OWN counterexample model constructed three paragraphs above, E
      prime given by Y squared equals X cubed plus p to the fourth times A X
      plus p to the sixth times B, obtained by the admissible substitution with
      u equal to one over p. On E prime the discriminant valuation is 12, the
      reduction is the singular cubic, and every prime-to-p torsion point
      reduces to the singular point, so the F_p test of Proposition E returns
      EQUAL for every index pair while the correct functional value is the
      minimum of 2 and r off the plus-or-minus locus and r on it. Proposition E
      as boxed is therefore false on E prime for r greater than 2. Adding the
      public model constant c does not save it, because c fixes the VALUE while
      the failure is in the TEST. Both reviewers reached this independently and
      both record that it does not change the disposition; they differ on
      severity, the red team calling it major as a false universal and the
      validator calling it low as a wording inconsistency with the correct
      covariant form the same document states at its section F. This record
      adopts the red team characterisation on the merits, because the sentence
      as written is a universal quantification that is false on an object the
      artifact itself constructs, and adopts the validator observation that the
      DISPOSITION is model-independent while the EVALUATION ROUTE is not. Only
      the two-valuedness and the group-theoretic separating predicate survive
      every admissible model change.
    - >-
      O-5 (J2, F-RT2, major). The cost qualification is stated correctly once
      and contradicted inside the section that discharges the interface repair.
      Section C.2 states, verbatim with backticks removed, that the oracle saves
      at most two scalar multiplications per query, O(log n) group operations,
      and nothing else, and explicitly declines the unqualified phrase literally
      nothing. Section C.5, in the note carried forward that argues the
      model-free ground is indifferent to Fork D, states verbatim that the
      O(log n) materialisation is a cost the adversary pays with or without the
      oracle. On the integer branch the adversary does not materialise the two
      points when it uses the oracle and does materialise them when it does not,
      so the materialisation is a cost paid only WITHOUT the oracle. The two
      sentences cannot both stand, and the second restores the unqualified claim
      the first declined, inside the very repair of the interface question. The
      red team supplies the sharper and correct statement, recorded here because
      it strengthens the erratum rather than weakening it: on the integer
      interface the predicate is decided from j, k and the public n by two
      reductions modulo n and one comparison, so the saving is O(log n) BIT
      operations and no group element and no field element is touched, which
      makes the Fork D indifference claim true on a correct premise.
    - >-
      O-6 (J2, F-RT5, major, and the factual centre of this round). THE ERRATUM
      HEADLINE CENSUS IS REFUTED ON THE CORPUS TEXT. The erratum states,
      verbatim from section E item 2 with backticks removed: So the repaired M2
      fires on none of the four corpus-recorded oracles. And from section E item
      3: M2 now has exactly one firing instance anywhere in this program corpus,
      namely D1 itself, and zero independent ones. Both sentences are wrong. The
      repaired M2 fires on the incidence CHECK oracle as the corpus records it.
      The three texts are set out under control_b_disagreement below and this
      Coordinator session read all three directly from the committed tree.
    - >-
      O-7 (J2, F-RT6, major). The O(1) overhead threshold in the repaired M2 is
      an UNDECLARED MODELLING CHOICE WITH A FITTED MOTIVE, and it is load-
      bearing for three reported consequences. DEC-20260831-a9716f states the
      motive verbatim in its own R-OBJ6 repair text: D1 is unaffected because
      the memo exhibits exactly such a simulator. The witness threshold was
      therefore chosen after seeing the instance it is then reported as
      classifying, which is a quantifier-order defect. The threshold is also
      stricter than any mathematics in play requires: an n to the o(1) overhead
      bound blocks the anomalous transfer psi by the same Level 2 argument, and
      preserves the exponent-1/2 conclusion the criterion exists to license,
      because an oracle simulable with overhead c(n) equal to n to the o(1)
      turns a T-query algorithm into a generic algorithm using T times c(n)
      group operations, forcing T to be Omega of n to the one half minus o(1).
      The erratum inherited the threshold from its task card and applied it
      faithfully; the defect is that the census produced by the threshold is
      then reported as a fact about the objects while the boundary that produced
      it is nowhere declared as a choice.
    - >-
      O-8 (J2, F-RT7, major). Record-level tier leakage survives the two-part
      split, in two bolded and unscoped sentences. Section D.7 part b reads,
      verbatim with backticks removed: Under either reading lambda at least one
      half which exceeds 0.45, so the record own promotion gate fails. Section
      G, the Pareto and cost-accounting section a Coordinator composing a
      decision reads for headline quantities, reads: The record own promotion
      gate fails, by a different term than the record predicted. Both are
      derived from Corollary 4.2, a statement about the D1 oracle informative
      query density; nothing in the erratum computes lambda for any D2
      functional. The gate is a gate on the RECORD, whose hypothesis is the
      disjunction of D1 and D2, so an unscoped assertion that it fails asserts
      the record cannot be promoted, which is precisely the record-level
      disposition the erratum Part 3 withdraws. The provenance is visible: both
      sentences are inherited nearly verbatim from section 8 of the superseded
      memo, where the disposition WAS record-level and the sentence was in
      scope. The repair changed the disposition and did not re-scope the
      inherited sentence.
    - >-
      O-9 (both joints, Control A). The proves-too-much control on anomalous
      curves under the repaired constructive M2 is CONFIRMED BY BOTH REVIEWERS
      independently: M2 does not fire on psi, the implication chain never
      starts, the known-false conclusion is never reached, and the exponent-1/2
      corroboration is not broken by this control. BOTH ALSO QUALIFY THE PASS,
      independently and in the same direction. The validator records F-V3, that
      the control passes at the ANTECEDENT level and that the word passes
      conveys more than was established, since a burden-of-construction
      criterion is trivially non-firing on every object nobody has tried. The
      red team records F-RT10, the stronger form: because the proves-too-much
      control fires only when the argument GOES THROUGH on a known-false object,
      and a burden-of-construction criterion can never go through on an object
      whose simulator nobody has built, the control can no longer FAIL for M2 on
      any object whatsoever, so the pass is real and close to vacuous. Both
      record that the control remains fully discriminating for M1, where it
      fires, and both record that M1 being broken as a closure rule by the
      anomalous curve remains the most valuable single result in this lane. The
      discriminating burden for M2 has migrated entirely onto RC-3, a held-out
      object in the FIRING direction, which is undischarged.
    - >-
      O-10 (J2, F-RT10 consequence, recorded because it survives O-6). Even with
      an independent corpus firing instance, the repaired M2 is a DEFINITION
      rather than an empirically validated criterion. Firing is by construction
      the exhibition of an O(1) handle-only simulator; for D1 that simulator is
      exhibited outright in section 5.1 of the superseded memo and the imported
      bound applies to the exhibited simulator directly, so M2 is a NAME for
      that route rather than a second route to it. Calling it a second, weaker,
      model-bound route overstates it by one route. One corpus firing instance
      is also not a HELD-OUT one, so RC-3 remains wanted.
    - >-
      O-11 (both joints, structural, reached from OPPOSITE verdicts). Both
      reviewers independently reached the same structural point: whatever
      happens to M2 standing, it does not touch the D1 ground, because
      Proposition E uses neither M1 nor M2, no oracle model and no imported
      generic bound. The validator reaches it from a CONFIRMED Control B, the
      red team from a REFUTED one. That agreement across opposite control
      outcomes is the most robust single finding of this round, and it is what
      makes the re-founding commissioned by R-OBJ1 retrospectively necessary
      rather than merely tidier.
    - >-
      O-12 (J2, F-RT3 and F-RT4, medium, both strengthening). The cost statement
      should be three-case rather than two-case, and the phrase the handle
      interface is used with two incompatible meanings. Case one, integer
      interface: two reductions modulo n and one comparison, O(log n) bit
      operations, no group or field element touched. Case two, coordinate-
      bearing points, which includes a rho walk state and the structured model:
      one F_p x-coordinate comparison, plus a small fixed number of F_p
      multiplications first if points are held projectively or in Jacobian form.
      Case three, opaque handles: one inversion and two equality tests, because
      the adversary holds no coordinates at all. The erratum sentence asserting
      that the party holding the two points has the handle interface conflates
      cases two and three, and in the opaque-handle model no F_p comparison is
      available to that party at all. The conclusion survives on all three
      readings and is strongest in case one; what does not survive is the stated
      reason.
    - >-
      O-13 (J2, F-RT8 and F-RT9, medium, coherence and scope hygiene). F-RT8:
      the erratum Part 1 borrows the frozen record own contractual gate as
      authority for disposing D1, and Part 3 declines that same gate stated
      record-level consequence, without argument. The red team judges the
      erratum probably right on the merits, because H is written as a
      disjunction and the frozen family the gate names is D1, but records that
      it never makes the argument, leaving a downstream reader to resolve the
      conflict in favour of whichever sentence is more legible. F-RT9: a
      hypothesis Proposition E needs is absent from the Scope of Part 1 block,
      namely the truncation and cap convention, which the frozen record does not
      supply and which the superseded memo says the frozen record does not
      supply; the nonidentity hypothesis is likewise in the prose and not in the
      bullet list a later record will copy. Same shape as R-F1 at lower
      severity: a hypothesis living outside the list.
    - >-
      O-14 (both joints, controls before belief). NO null-object control exists
      for this lane, because zero runs occurred in the producer session and in
      both review sessions. The erratum names the canonical artifact tell
      against itself, that the reported image size is flat in the precision
      parameter, and states correctly that the flatness here is derived rather
      than measured so the tell does not fire automatically. Both reviewers
      accept that handling as the obligation discharged rather than evaded. The
      declared negative control of ECDLP-IDEA-436 has not been run,
      KN-OPEN-3417fc own negative-resolution criterion is an unrun measurement
      at toy p, and RC-1 remains required and undischarged. The red team adds a
      sharper and cheaper design, RC-RT-2: tabulate the functional at small p on
      a minimal good-reduction model AND on the explicit non-minimal E prime,
      for r in one through four, with the predictions pre-registered. The
      derivation makes fully determined and DIFFERENT predictions on the two
      models, so the model constant is a parameter that provably moves the
      quantity, which is exactly what the flat-in-r tell demands and what the
      record own declared negative control does not supply.
    - >-
      O-15 (observation about a prior committed decision, carried from validator
      F-V5). The final clause of the R-OBJ6 repair text of DEC-20260831-a9716f,
      verbatim, is: D1 is unaffected because the memo exhibits exactly such a
      simulator. Under the repaired constructive M2 that clause is FALSE on the
      integer branch, because the exhibited simulator is O(1) on handles only
      and integer indices force O(log n) materialisation first. The producer
      reported this against its own commissioning decision rather than
      conforming to it, and the validator records that willingness as the single
      strongest indicator that the six discharges are real rather than
      performative. The decision is immutable and is not edited; this record
      supersedes that clause by reference, per AGENTS.md rules 4 and 15.

  control_b_disagreement:
    status: >-
      THE TWO REVIEWERS FACTUALLY DISAGREE ON CONTROL B, AND THIS COORDINATOR
      SESSION ADJUDICATED IT ON THE MERITS BY READING THE THREE SOURCE TEXTS
      DIRECTLY. The adjudication is recorded in full rather than reported as a
      composed outcome, because a split on a matter of fact is the one thing a
      composition must not smooth over.
    what_each_reviewer_reported:
      validator_TASK_20260901_a8e281: >-
        CONFIRMED on all four oracles. Jet does not fire because the repaired M2
        forbids coordinate access and field arithmetic outright. Endomorphism
        does not fire, by two independent routes. Elliptic-net does not fire at
        O(log N). Incidence does not fire at O(B to the m), scored from
        KN-FIND-002 item 4. The validator then drew the derived conclusion that
        the repaired M2 has exactly one firing instance in the corpus and zero
        held-out ones, so it is a restatement of the fact that a three-line
        simulator was exhibited for D1, while arguing that this drains the
        CORROBORATION and leaves the GROUND untouched because Proposition E uses
        neither M1 nor M2.
      red_team_TASK_20260901_8def30: >-
        REFUTED, stated with its condition attached. The review plan states the
        control object as the four corpus-recorded oracles of KN-FIND-002 AND
        KN-FIND-b7e091, so the red team ran the repaired M2 against the oracle
        definitions in BOTH records. It agrees with the validator on jet,
        endomorphism and elliptic-net. On incidence it reports that the erratum
        scored only the KN-FIND-002 definition, and that the repaired M2 FIRES
        on the incidence CHECK oracle as KN-FIND-b7e091 and its evidence record
        EV-GGM-79e710 record it.
    the_three_source_texts_read_directly_by_this_coordinator_session:
      note: >-
        Quoted verbatim from the committed tree, with markdown backticks removed
        where present and no other change. Every quotation below was opened at
        its own path by this session and is not taken from either reviewer.
      repaired_M2_firing_condition:
        where: 'ideas/artifacts/ECDLP-IDEA-436/ggm_simulability_gate_erratum_20260831.md, section C.4, the boxed statement'
        text: >-
          M2 fires on an augmented oracle O if and only if there is an EXPLICIT
          simulator answering each query to O using O(1) group operations,
          inversions and equality tests on handles, and no other access - no
          coordinate access, no field arithmetic, no local bit-work whose cost
          grows with the instance.
      corpus_check_interface:
        where: 'ledger/evidence/EV-GGM-79e710.yaml, observation O-2'
        text: >-
          Oracle C (incidence) SIMULABLE. The incidence check (does
          P_{i1}+...+P_{ir}=Q?) is fully checkable via group operations and
          equality tests (at most m group ops per query).
        companion: >-
          knowledge/findings/KN-FIND-b7e091.md records the same oracle as
          simulable in O(m) group operations per query, the oracle output being
          determined by group operations and equality tests alone.
      corpus_search_interface:
        where: 'knowledge/findings/KN-FIND-002.md, body item 4'
        text: >-
          Incidence oracle (O(B^m)) decompositions are found by brute-force
          summing m-subsets of the factor base, costing O(B^m) group operations.
          For fixed B, m this is constant, but B grows with problem size. Not
          closed at 1/2 by the constant-overhead bound.
    adjudication: >-
      THE RED TEAM IS CORRECT, AT FIXED m. The simulator for the incidence CHECK
      interface is explicit and one line: add the m factor-base handles with the
      group law and compare the sum to the target handle with one equality test.
      It uses group operations and equality tests on handles and no other
      access, with no coordinate access, no field arithmetic and no local
      bit-work growing with the instance. Its cost is at most m group operations
      per query, which is O(1) for a fixed decomposition size m. Every clause of
      the repaired M2 firing condition is satisfied, so the repaired M2 FIRES on
      the incidence CHECK oracle. That oracle is corpus-recorded, is named in
      the review plan declared control object, and is INDEPENDENT of D1. The
      erratum scored the incidence row using only the KN-FIND-002 SEARCH
      interface, which reports WHICH subsets sum to the target at O(B to the m),
      and did not score the CHECK interface, which verifies whether a GIVEN
      subset sums to the target at m group operations. Two different oracle
      interfaces share one name in this corpus, and only one of the two was
      scored.
    stated_condition_on_the_adjudication: >-
      The refutation holds if m is a fixed decomposition size, which is how both
      records use it and how index calculus uses it, and it is unaffected by
      KN-FIND-002 own note that B grows with problem size, since the CHECK cost
      is m group operations and does not depend on B. If m were instead allowed
      to grow with the instance, m group operations would be non-constant and
      the repaired M2 would not fire on the CHECK oracle either. This session
      does not settle which reading the originating BATCH-060 work intended,
      and it must not: that is exactly sub-question Q1 of DEC-20260901-70ba34,
      which is owned by an open review-breakthrough round and whose decisive
      unread artifact is experiments/EXP-GGM-001/simulability_test.py.
    what_is_unconditional: >-
      Independently of how m is read, the erratum ran a firing census against
      only one of two conflicting corpus definitions of the same oracle, did not
      disclose that it had done so, and reproduced the superseded memo dismissal
      that the disagreement does not bear on this gate - which was true for the
      gate and is NOT true for a firing census under a criterion the gate did
      not have. The census is therefore unsupported as stated whichever reading
      governs.
    consequences_for_stated_claims_in_the_erratum:
      - >-
        The section E item 2 sentence that the repaired M2 fires on none of the
        four corpus-recorded oracles is WRONG.
      - >-
        The section E item 3 sentence that M2 has exactly one firing instance
        anywhere and zero independent ones is WRONG. It has at least two, and at
        least one of them is independent of D1 and is recorded in the corpus.
      - >-
        The section E item 2 statement that the M2 score of Control B drops to
        zero is WRONG.
      - >-
        The validator DERIVED conclusion, recorded as its finding F-V4, that the
        repaired M2 has become a restatement of its single instance, is
        therefore also wrong on its premise. A holds verdict on joint J1 does
        not immunise a Control B finding reached inside it: the control was
        shared by both reviewers by the plan own design, and on a shared control
        the more completely scored run governs. The validator J1 verdict on the
        six repairs is unaffected and stands.
      - >-
        The direction of the correction is FAVOURABLE to M2 and adverse to the
        erratum self-report. The refutation partly rescues M2: the prior round
        objection OBJ-5, that M2 has no held-out object in the firing direction,
