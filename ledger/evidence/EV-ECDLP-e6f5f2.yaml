      - >-
        Nothing in this correction touches Proposition E, the D1 ground, or the
        two-part split. Both reviewers say so from opposite verdicts, which is
        O-11.
    why_the_two_reviewers_diverged:
      mechanical_cause: >-
        Scope of the control object, not a mathematical disagreement. The
        committed review plan names the control object as the four
        corpus-recorded oracles of KN-FIND-002 AND KN-FIND-b7e091. The red team
        ran it against both records. The validator ran it against the
        KN-FIND-002 definitions and reported CONFIRMED directly from that source
        record with, in its own words, no interpretation required. Neither
        reviewer misread its own source; the validator ran a narrower control
