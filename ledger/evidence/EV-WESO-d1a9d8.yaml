  observations:
    - id: OBS-1
      what: NC2d-PROPER pooled p-scaling exponents and the FC-4 verdict
      source: >-
        experiments/EXP-P13-NC2d/runs/RUN-P13-NC2d-a/manifest.yaml (result.pooled,
        result.FC_4) and
        coordination/goals/GOAL-P13-001/batches/BATCH-403f13/tasks/TASK-20260804-241b87/nc2d_results.json;
        independently recomputed in validation_report.yaml CHK-2.
      text: >-
        At ell in {47, 101, 151, 211} over three primes, with the frozen estimator
        (OLS of log2(median per_entry) on log2(log2 p), ell fixed effects):
        alpha_primary = 1.1321 (raw 1.1320907), alpha_null = 1.0715 (raw
        1.0715207), pooled gap = 0.0606 (raw 0.0605699) against the pre-registered
        FC-4 threshold of 0.15. FC-4 DID NOT FIRE. The batch's pre-registered
        RERANK TRIGGER, conditioned on FC-4 firing, therefore did not fire either.
    - id: OBS-2
      what: NC2d-PROPER per-ell estimates
      source: >-
        nc2d_results.json (nc2d_proper.per_ell) and manifest.yaml
        (result.per_ell_results).
      text: >-
        ell = 47: alpha_primary 1.1055 (se 0.0057), alpha_null 1.0784 (se 0.0020),
        gap 0.0270. ell = 101: 1.1318 (0.0162), 1.0938 (0.0375), gap 0.0381.
        ell = 151: 1.1407 (0.0177), 1.0512 (0.0050), gap 0.0894. ell = 211: 1.1504
        (0.0164), 1.0626 (0.0158), gap 0.0877. The two largest gaps are about 59 per
        cent of the FC-4 threshold, which is the basis of Red Team objection
        RT-OBJ-A.
    - id: OBS-3
      what: Jackknife range, FC-2, and the no-trend check
      source: >-
        manifest.yaml (result.jackknife, result.no_trend, result.FC_2),
        nc2d_results.json, validation_report.yaml CHK-2 and qualification Q-1.
      text: >-
        The leave-one-ell-out range is [1.1259982, 1.1409560] on the Validator's own
        recomputation, contained in the pre-registered band [0.85, 1.15], so FC-2
        DID NOT FIRE. The no-trend check gives b = 0.0206 (raw 0.020580, se 0.0013)
        against a 0.10 threshold: PASS. TWO RECORD-INTEGRITY NOTES TRAVEL WITH THIS
        OBSERVATION. (i) The same interval is rendered [1.1260, 1.1409] in the run
        manifest and [1.1260, 1.1410] in nc2d_results.json; no verdict depends on
        the last digit, and the raw value governs. (ii) The interval was described
        as a "95% CI" in the dispatching handoff summary; the frozen specification
        defines it as the min and max of four leave-one-out estimates, and that
        definition governs (Validator Q-1).
    - id: OBS-4
      what: NC2d controls, and confirmation that the measurements are real
      source: >-
        manifest.yaml (result.controls) and red_team_report.yaml
        (obj_1_phi_evaluation).
      text: >-
        C-PHI-VERIFY passes at all four ell: the SHA-256 of each Phi_ell file
        matches the hash committed in RUN-PEC-49c773-a, so the polynomials are
        bit-identical to those of the prior run. C-BASE-PRIME passes at p1 and p2
        (Miller-Rabin on the first 20 prime bases, p congruent to 3 mod 4,
        j(E_0) = 1728, and (p+1)P = infinity for three independently chosen random
        points). C-BASE-2 passes at every ell at both primes. The Red Team examined
        the hypothesis that the arms were simulated or synthetic and recorded it as
        CONTRADICTED by the artifacts: real polynomial-GCD and poly_powmod work
        through the committed instrument, with root-finding multiplication counts
        consistent with the expected loop count.
    - id: OBS-5
      what: Comparison with the prior C-PSCALE arm, and what it does not do
      source: manifest.yaml (result.comparison_to_prior); nc2d_results.json.
      text: >-
        The prior arm in EXP-PEC-49c773 at ell in {3, 5, 7, 11, 13} gave
        alpha_primary 1.1597, alpha_null 0.9935, gap 0.1662, and FC-4 FIRED. THAT
        FIRING STANDS AS RECORD AND IS NOT LIFTED BY THIS RUN: a post-hoc
        restriction of the ell-grid cannot lift a pre-registered falsifier
        (DEC-20260802-48c72c adjudication E). The present run is a measurement at a
        DIFFERENT, pre-registered ell range under a frozen successor contract, which
        is the only route DEC-20260802-48c72c allowed for retiring the label - and
        it retires it only at that range and at these prime sizes.
    - id: OBS-6
      what: NC2b-SLOPE, a zero-compute synthetic-slope test on committed numbers
      source: >-
        coordination/goals/GOAL-P13-001/batches/BATCH-403f13/tasks/TASK-20260804-241b87/nc2b_results.json,
        experiments/EXP-P13-NC2b/runs/RUN-P13-NC2b-a/raw-result.json;
        independently checked in validation_report.yaml CHK-3.
      text: >-
        Input: the committed 47-ell C-NULL series of RUN-PEC-49c773-a, SHA-256
        13f8f3fa55dc2dfeabe29d4d01f60d5d69370485fae523b208a7b53e6128add6, verified
        before use. On W-MID (ell >= 11, n = 43) the null refit gives
        gamma_null_refit = -0.003547422 and level 12.284968689, against the nominal
        REF_null 12.2595, a difference of 0.0255 bits. The series was multiplied
        pointwise by ell^s for the declared s in {0.4, 0.8} and the corrected
        estimator was required to recover s*log2(B_opt) + REF_null at five field
        sizes. ALL TEN W-MID CHECKS PASS; the worst recovery error is 0.0926 bits
        against the 0.75-bit tolerance, leaving 0.6574. Gate NC2b-SLOPE-G1: PASS.
        The run's own non_claim is carried unchanged: "PASS validates the INSTRUMENT
        only; cannot be cited as validation of L1." Zero new measurements were made.
    - id: OBS-7
      what: An anomaly inside NC2b that is recorded rather than absorbed
      source: nc2b_results.json (anomaly); validation_report.yaml CHK-3; red_team_report.yaml obj_3.
      text: >-
        gamma_null_refit = -0.003547 differs from the -0.013241 that
        DEC-20260802-48c72c had recorded, because the expected value was fitted on
        a 21-ell series (ell 11..101, EXP-PEC-6be870) while the frozen NC2b
        specification uses the 47-ell C-NULL of EXP-PEC-49c773. The gate uses the
        refit value from the specified input, so the verdict is valid. The Red Team
        records the residual concern: a 3.7-fold sensitivity of gamma_null to the
        ell range suggests the null per-entry cost is not a stable power law in ell
        across the full range, which is a calibration-accuracy concern and a further
        reason the PASS may not be read as validating L1.
    - id: OBS-8
