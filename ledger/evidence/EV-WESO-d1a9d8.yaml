  inference: >-
    WITHIN ell in {47, 101, 151, 211} AND p in {2^20, 2^30, 2^40}, and under the
    frozen EXP-P13-NC2d estimator, the primary and null p-scaling exponents differ
    by 0.0606, well inside the pre-registered 0.15, and the leave-one-ell-out range
    lies inside [0.85, 1.15]. The MECHANISM-INCONSISTENT designation attached to
    assumption L5 by the FC-4 firing at ell in {3, 5, 7, 11, 13} is therefore
    retired AT THIS ell RANGE AND AT THIS PRIME SCALE, by measurement rather than by
    argument - and only there. The prior firing stands unretracted for its own ell
    range. SEPARATELY, the measured alpha is 1.1321, not the derived 1.0, and that
    13 per cent excess is propagated into no c-table row, no bracket and no margin;
    SP-10 of DEC-20260802-48c72c is NOT lifted, so alpha = 1 remains labelled
    DERIVED and is still never "measured-consistent". NC2b-SLOPE establishes that
    the corrected estimator recovers a KNOWN non-zero exponent to within 0.0926 bits
    of a 0.75-bit tolerance at all ten evaluation points, which is a statement about
    the INSTRUMENT and not about assumption L1. NOTHING HERE BEARS ON HEURISTIC 1,
    on the conditional p^{1/3+o(1)} theorem, or on the concrete NIST-I question,
    which stays INCONCLUSIVE for a fourth batch. THE ONE DECISIVE OPEN ITEM -
    Heuristic 1's tail at the operating point - remains unmeasured, and its single
    dispatch failed at infrastructure, which is not evidence in either direction.

  boundaries:
    - >-
      SCALE. Three primes only: 1048571 (about 2^20), 1073741783 (about 2^30) and
      1099511627563 (an 80-bit F_{p^2}). AGENTS.md core rule 7: this is toy and
      medium scale and may never be presented as cryptographic-scale validation.
    - >-
      ell RANGE. Four degrees only: 47, 101, 151, 211, all above the instrument's
      KARATSUBA_THRESHOLD of 16. Nothing is established at ell outside this set, and
      the gap-versus-ell trend beyond ell = 211 is unmonitored: the per-ell gaps
      rise 0.0270, 0.0381, 0.0894, 0.0877, so the two largest already reach about
      59 per cent of the FC-4 threshold and no control was pre-registered for gap
      stability at larger ell (RT-OBJ-A).
    - >-
      THE PRIOR FALSIFIER IS NOT LIFTED. FC-4 fired at ell in {3, 5, 7, 11, 13} in
      EXP-PEC-49c773 (gap 0.1662) and that firing stands as record. Two ell ranges,
      two facts, never conflated.
    - >-
      NC2b IS AN INSTRUMENT CHECK. It is a zero-compute synthetic-slope test on 47
      already-committed numbers. It validates recovery of a known exponent; it is
      not a test of assumption L1, and SP-12 and MA-7 of DEC-20260802-48c72c bind
      unchanged.
    - >-
      NO COST NUMBER MOVES. This record updates no c value, no bracket, no margin
      and no concrete-cost table. All eight mandatory attachments MA-1 through MA-8
      and all twelve standing prohibitions SP-1 through SP-12 of DEC-20260802-48c72c
      remain in force on every downstream citation.
    - >-
      HEURISTIC 1 IS UNTOUCHED AND ITS GAP IS OPEN. NC-3/NC-6 did not execute. The
      promotion-gate requirement that every conditional dependence carry archived
      validation evidence or a scheduled validation experiment is not met by this
      record, and no part of it may be read as narrowing that gap.
    - >-
      THE BASELINE CONSTANT k IS STILL UNQUANTIFIED. The three sources exist at
      their stated venues; none states k in its abstract, and the Wesolowski body
      was not read for it.
    - >-
      STATISTICAL POWER. Each per-ell fit uses three primes, hence one residual
      degree of freedom, and the leave-one-ell-out procedure averages per-ell alphas
      rather than refitting the pooled OLS, which narrows the reported interval
      (RT-OBJ-C). No confidence interval is reported for the pooled gap at all
      (RT-OBJ-E), so "the gap is comfortably below 0.15" is asserted with practical
      headroom rather than demonstrated with quantified uncertainty.
    - >-
      NO REPLICATION. One run per experiment. Reviewer recomputation on the same
      committed data is verification, not replication.

  unresolved_confounds:
    - >-
      CROSS-SESSION LEVERAGE AT p3. The highest-leverage point of every per-ell fit
      is the committed 8-j median from RUN-PEC-49c773-a, measured in a different
      session from the fresh 4-j p1 and p2 arms (deviation D-2, RT-OBJ-D). A
      systematic session-specific offset at p3 would shift every per-ell alpha in
      the same direction rather than adding noise. It is not bounded by any control
      in this run.
    - >-
      NULL POWER-LAW INSTABILITY. gamma_null moves from -0.013241 on the 21-ell
      series to -0.003547 on the 43-ell W-MID series, a factor of about 3.7,
      suggesting the null per-entry cost does not follow a single stable power law
      in ell over the full range (RT-OBJ-3/OBJ-3 genuine_concern). The gate is
      robust to it at the tested tolerance; the functional form is not thereby
      established.
    - >-
      SOURCE OF THE 0.13 ALPHA EXCESS. alpha = 1.1321 against a derived 1.0 is
      systematic across all four ell and is unexplained by any control in this run
      (RT-OBJ-B). Whether it is an artifact of the pure-Python instrument, of the
      three-point p-axis, or a real property of the pipeline is not discriminated
      here.
    - >-
      ONE IMPLEMENTATION FAMILY. All arms run through the same committed
      per_entry_cost.py instrument in pure Python. A measured exponent from an
      unoptimised implementation is an upper bound on the achievable per-entry
      exponent and simultaneously a lower bound with respect to costs excluded in
      the attack's favour; the two directions are not netted, exactly as
      DEC-20260802-48c72c recorded for the prior runs.

  validator_verdict: accept_with_qualifications
  validator_task: TASK-20260804-cf1ae3
  red_team_verdict: pass_with_constraints
  red_team_task: TASK-20260804-83d874
  review_side_analysis_is_not_run_evidence: >-
    SP-5 of DEC-20260802-48c72c, as extended, binds these two reviews as it bound
    BATCH-003's. Analyses the reviewers performed on committed data - notably the
    Red Team's estimate that a proper one-residual-degree-of-freedom confidence
    interval would "likely span [0.95, 1.31] per individual ell", its alternative
    regressor computation, and its cryptographic-scale extrapolations of the alpha
    excess (about 1.27x at NIST-I, 1.39x at NIST-V) - are cited as REVIEW FINDINGS
    under their report ID and NEVER as run evidence. They open and close no gate,
    and none of them appears as an observation above.
