  restatement_only: >-
    THIS RECORD CONTAINS NO NEW MEASUREMENT. It restates values already present in
    committed BATCH-403f13 artifacts, each attributed to the artifact it came from,
    and adds no arithmetic of its own. The Coordinator authoring it recomputed
    nothing and does not present itself as having done so; the independent
    recomputation on the record is the Validator's (TASK-20260804-cf1ae3).

  direction: neutral
  direction_note: >-
    NEUTRAL WITH RESPECT TO H-WESO-001, AND THAT IS THE ACCURATE READING RATHER
    THAN A HEDGE. The hypothesis asserts a Heuristic-1-conditional p^{1/3+o(1)}
    algorithm and a possible concrete threat to SQIsign-family parameters. This
    evidence bears on neither: the Red Team states it explicitly - "The conditional
    asymptotic theorem (p^{1/3+o(1)} conditional on Heuristic 1) is unaffected by
    these measurements" - and nothing here touches Heuristic 1 or moves
    concrete_threat_nist1 off INCONCLUSIVE.
    WHAT IT DOES CONTAIN, BOTH SUB-DIRECTIONS RECORDED AND NOT NETTED: (a) toward
    the derivation used inside this programme's own cost model, the FC-4 non-firing
    at ell in {47, 101, 151, 211} retires the MECHANISM-INCONSISTENT designation on
    assumption L5 AT THAT ell RANGE AND PRIME SCALE, by measurement; (b) against
    the attack, the same measurement puts alpha at 1.1321 rather than the
    theoretical 1.0, a 13 per cent excess that raises modelled per-entry cost and
    is propagated into no c-table row. Recording one and not the other would
    misstate the record in one direction or the other.

  strength: preliminary
  strength_note: >-
    One authorized run per experiment (RUN-P13-NC2d-a, RUN-P13-NC2b-a), each
    executed once, unreplicated. Both reviewers recomputed the arithmetic from the
    SAME committed data, which is verification, not replication - the same
    distinction DEC-20260802-48c72c drew for EV-PEC-857664. `replicated` would
    require an independent instance, which does not exist.

  claim_tier: medium
  claim_tier_note: >-
    The largest field measured is p = 1099511627563, an 80-bit F_{p^2}; the other
    two arms are p = 1048571 (about 2^20) and p = 1073741783 (about 2^30), which
    are toy. `medium` is the ceiling the largest arm allows and matches the tier
    this programme already assigned to the same prime in EV-PEC-857664. AGENTS.md
    core rule 7 binds: nothing here may be presented as cryptographic-scale
    validation.

  certificate_refs: []
  certificate_note: >-
    No solve, relation or break is claimed, so no solution certificate exists or is
