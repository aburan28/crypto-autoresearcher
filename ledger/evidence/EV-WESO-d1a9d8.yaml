    input-integrity certificates: SHA-256 of each Phi_ell file verified against the
    hashes committed in RUN-PEC-49c773-a, and SHA-256 of the NC2b input series
    verified before use.

  proof_status: empirical_only
  proof_status_note: >-
    DECLARED, not defaulted. The stated direction rests on measurement and on
    arithmetic over committed measurements; there is no counterexample certificate
