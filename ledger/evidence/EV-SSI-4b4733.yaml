    - id: O-M1
      text: >-
        LABELLED-NORM-HOM-LIFT remains a construction gap. Its public sender is
        explicit, but no efficient distribution-matched sampler, complete
        Hom(E,C) lift, singleton message-fiber proof, or QPT attacker-to-complete-
        EndRing extractor is supplied. O1--O6 all remain open. Its public finite
        reference decoder costs O(L), so polynomial L supplies no asymmetry.
    - id: O-M2
      text: >-
        The exact simultaneous-full-module-conjugation syntax is rejected.
        Solving XT=TU and YT=TV recovers the normalized conjugator projectively;
        one ordinary H query and zero decryption queries then recover the
        challenge message, with advantage 1/2 for distinct messages. Conditional
        actual-message correctness discharges only O3 for accepted keys and
        matching encodings; O4 is contradicted and O1, O2, O5, and O6 stay open.
    - id: O-composition
      text: >-
        The frozen joint vector is J1 breaks, J2 inconclusive, J3 inconclusive,
        J4 breaks, J5 breaks, and J6 inconclusive. Two proposals were evaluated
        and zero survived for implementation, theorem, or parameter selection.
    - id: O-objectives
      text: >-
        Novelty, a complete EndRing reduction, security against QPT adversaries
        in the QROM, and a NIST Category-5 concrete parameter claim are all
        unestablished. This evidence does not establish a quantum-secure PKE.
