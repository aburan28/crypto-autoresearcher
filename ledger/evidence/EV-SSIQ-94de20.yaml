  hypothesis_id: H-SSIQ-9e2c71
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  batch_id: BATCH-004
  experiment_ids: [EXP-SSIQ-a85692]
  run_ids: [RUN-SSIQ-a85692-a]
  type: empirical
  direction: neutral
  direction_note: >-
    NEUTRAL FOR A THIRD, DISTINCT REASON, not the same shape as EV-SSIQ-29fcbb
    (frozen window returned a number but the estimator was biased) or
    EV-SSIQ-9a0396 (the real-arm label source did not exist at all). Here the
    real-arm label SOURCE exists and was computed successfully (delta_E via
    direct in-session smooth-degree search, Phi_ell independently re-verified),
    but the PHASE -1 COVERAGE GATE that must pass before any descent test runs
    was never cleared: the confirmatory prime set came out empty under the
    frozen contract's own truncation-fallback rule. H-SSIQ-9e2c71's real-arm
    prediction (gamma_greedy < gamma_random) was NEVER COMPUTED. Nothing here
    supports, weakens, or is inconclusive about that prediction.
  strength: inconclusive
  strength_note: >-
    inconclusive as "not tested," not "tested weakly." What IS firm: the
    delta_E-computation instrument itself works (independently re-executed,
    reproduces bit-for-bit/qualitatively; Phi_ell sourcing independently
    re-fetched and Velu-verified for ell in {3,11,23}; C-SEARCH-BIAS
    correlations reproduced to 14 significant figures). The campaign-level
    preliminary cap from EV-SSIQ-e43afd is unchanged.
  claim_tier: toy
  claim_tier_note: >-
    Toy scale, matching H-SSIQ-9e2c71.scope_ceiling: graphs from 203 to 1800
    vertices, p up to 21601 (15 bits), smoothness bound B=X=23. No result
    transfers to cryptographic scale, and none is claimed to.
  proof_status: empirical_only
  proof_refs:
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-a/raw-result.json
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-a/execution_report.yaml
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-004/reviews/VAL-BATCH-004.md
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-004/reviews/RT-BATCH-004.md
  preregistration_binding:
    specification: experiments/EXP-SSIQ-a85692/specification.yaml
    freeze_commit: 96ad45de
    verified_by: TASK-20260805-798a16
    detail: >-
      The Validator confirmed the frozen contract (commit 96ad45de,
      2026-08-05T09:11:25Z) precedes the run's start (09:33:07Z) by ~22
      minutes, code.commit in the manifest is bound to the frozen commit, and
      the pre-freeze review (RT-PREFREEZE-EXP-SSIQ-a85692.md, verdict
      FREEZE-WITH-FIXES, PF-1 through PF-4 applied) is the contract this run
      actually executed.
  observations:
    - id: O-1
      statement: >-
        THE INSTRUMENT WORKS: the delta_E-computation route is independently
        confirmed genuine, not merely claimed. The Validator re-fetched
        Sutherland's modular-polynomial database live for ell in {3, 11, 23}
        (spanning small/medium/largest used) and got byte-identical content;
        independently re-ran velu_verify.py for ell=3 and ell=23 (the largest
        actually used) and got all_ok=True, 3/3 test curves, zero residual on
        every trial, via an independently-implemented route (exact rational
        Velu-formula isogeny + naive point counting) as the frozen contract
        requires. A full independent re-execution of compute_delta_e.py
        reproduced DATA-UNAVAILABLE-BLOCKED. C-SEARCH-BIAS correlations
        (0.09611 true-target, 0.03083 random-target) were recomputed from raw
        rows and matched to 14 significant figures. This closes the exact gap
        BATCH-003 left open: a computable, in-session delta_E label source
        that does not depend on WISDE.
      supported_by: [TASK-20260805-81ffe0, TASK-20260805-798a16]
    - id: O-2
      statement: >-
        THE PHASE -1 GATE FAILED, CORRECTLY DERIVED FROM THE FROZEN CONTRACT,
        AND THE EXECUTOR FOLLOWED THE NON-IMPROVISATION RULE CORRECTLY. The
        mandatory feasibility smoke test (3 vertices at the largest
        pre-registered prime, p=21601, per the pre-freeze PF-1 fix) measured
        1.9574s/vertex. The pre-registered truncation fallback applies this
        SINGLE measurement flat, ascending by prime size, against an
        individual per-prime cap T_prime = 0.5*7200/12 = 300s, and stops
        extending the confirmatory prefix at the first prime whose estimate
        exceeds it. The smallest prime (2437, 194 non-F_p-rational vertices)
        estimates at 379.7s > 300s, so the prefix is empty on the first
        prime tested: 0 of 12 primes confirmatory. The Executor disclosed an
        informal anomaly (A-1, a smaller dev-time measurement at the smallest
        prime) and correctly did NOT substitute it into the mechanical
        result -- exactly the GD-4 discipline this campaign adopted. The
        Validator's independent re-derivation of the code (compute_delta_e.py
        lines 331-360) confirms this is a mechanically exact, faithful
        implementation of the frozen contract's text, not a producer
        deviation.
      supported_by: [TASK-20260805-81ffe0, TASK-20260805-798a16]
    - id: O-3
      statement: >-
        A NEW CONTRACT DEFECT IS NAMED, GD-7, AND IT IS THE DOMINANT FINDING
        OF THIS BATCH. The Red Team identified, and the Coordinator
        independently re-verified by hand from the run's own already-
        committed per_prime_estimate numbers (zero re-measurement, zero
        model correction), that T_prime's individual per-prime reading is
        not the only one the contract's own budget reservation supports.
        Summing the SAME flat-extrapolation estimates ascending by prime
        (379.7, 598.9, 900.4, 1162.7, 1405.4, 1691.2, ... seconds) against a
        CUMULATIVE reading of the reserved budget: the running total stays
        under the contract's own reserved half-budget (3600s = 0.5*7200)
        through the fourth prime (cumulative 3041.7s; a fifth would bring it
        to 4447.1s, over) and under the FULL 7200s budget through the sixth
        prime (cumulative 6138.3s; a seventh would bring it to 8123.0s,
        over). A cumulative-prefix reading of the identical already-committed
        numbers therefore admits 4 primes on the reserved half-budget and 6
        on the full budget -- clearing the Phase -1 gate's own stated
        4-prime floor, without touching the per-vertex cost estimate at all.
        The individual per-prime cap (T_prime = a fixed 1/12 share) is a
        legitimate design for guaranteeing even coverage IF all 12 primes
        were expected to be admitted, but it is the wrong check for an
        ASCENDING-PREFIX selection that already discards the expensive tail:
        a prefix that stops early should be checked against the budget it
        actually uses, not against an equal share sized for a full,
        never-attempted 12-prime run. This formula was finalized into the
        frozen contract during the pre-freeze fix pass and was never itself
        stress-tested the way the B/X pin was (RT-PREFREEZE Finding 8) --
        the same failure mode GD-4 exists to catch, one layer downstream of
        where GD-4 first caught it.
      supported_by: [TASK-20260805-b5873f]
      confidence: high
    - id: O-4
      statement: >-
        A SECOND, SMALLER, ORTHOGONAL COST-MODEL CONCERN WAS ALSO
        INDEPENDENTLY FOUND (Validator, F-1) AND DOES NOT BY ITSELF CLEAR THE
        GATE. The single-largest-prime, flat-extrapolation cost estimate is
        directionally conservative (a defensible pre-freeze design choice,
        RT-PREFREEZE Finding 1/8) but plausibly overstates true per-vertex
        cost at the 1-2 smallest primes by roughly 1.3-2.3x, on a margin thin
        enough (1.27x at the smallest prime) that three independent
        correction models (the run's own disclosed anomaly A-1; a
        Theorem-1.5 degree-scaling model; a per-prime Lemma-3.2
        table-size-scaling model) all place the smallest prime's corrected
        cost under T_prime=300s. The Validator's own construction of these
        models found this ALONE never admits more than 1-2 of 12 primes --
        it is real, and worth fixing, but it is not the dominant effect: O-3
        (the budget-allocation formula) is what actually reaches the 4-prime
        floor, using zero cost-model correction.
      supported_by: [TASK-20260805-798a16]
    - id: O-5
      statement: >-
        BOTH REVIEWERS INDEPENDENTLY CONFIRM THIS WAS NOT AN EXECUTOR ERROR
        AND NOT AN OVERCLAIM. No sentence in the reviewed artifacts asserts
        the descent test ran; descent_metrics.ran is stated as false and
        phase_minus1_real_search is empty. The smoke test's 3-vertex sample
        is never generalized as coverage. C-SEARCH-BIAS's weak correlations
        (0.096, 0.031, both below the contract's own 0.1 comparability
        threshold) are explicitly and correctly not read as evidence about a
        real delta_E-gradient, since no real-arm M-GAP exists to compare
        them against; this data is orphaned by the Phase -1 failure and
        should be carried forward and re-checked once a real M-GAP exists,
        not read as a verdict either way. Anomaly A-1 was disclosed
        prominently and correctly not substituted into the mechanical
        result. The 90.57s of 7200s actually spent (1.26%) is stated
        plainly, not obscured.
      supported_by: [TASK-20260805-798a16, TASK-20260805-b5873f]
    - id: O-6
      statement: >-
        THE CHEAPEST UNBLOCK IS A VERSIONED AMENDMENT TO THE SAME CONTRACT,
        NOT A NEW BUILD AND NOT ABANDONMENT OF L4. The Red Team's ranked
        recommendation: (a) correct the truncation fallback's budget check
        from an individual per-prime cap to a cumulative-ascending-prefix
        check against the reserved budget (a formula fix, re-derivable at
        zero compute cost from data already committed in this run's own
        raw-result.json, per O-3); (b) execute Phase -1 on the resulting
        corrected prefix (an estimated 3042-6138s of the 7200s budget, using
        the run's own unimproved, still-conservative per-vertex cost
        figure -- ample headroom remains even without applying O-4's
        correction). The Red Team flags a caveat the Coordinator adopts: the
        cheapest corrected prefix (4-6 of 12 primes, all toward the small
        end) narrows the tested N-range relative to the originally intended
        203-1800-vertex span, which risks the same narrow-fitting-window
        estimator bias documented in instrument_calibration for a related
        estimator (DEC-20260805-be2f87) -- so a BATCH-005 amendment should
        widen coverage where cheaply possible (e.g. per-prime B/X pinning
        for the excluded larger primes), not simply take the cheapest
        admissible prefix and stop there.
      supported_by: [TASK-20260805-b5873f]
  inference: >-
    H-SSIQ-9e2c71's real-arm prediction could not be tested. This is neither
    support nor weakening: the delta_E-computation instrument, once
    independently verified to work (O-1), hit a Phase -1 coverage gate whose
    failure is now understood to be substantially a CONTRACT-FORMULA defect
    (GD-7, O-3) rather than genuine infeasibility of the direct-computation
    route at these toy parameters. Unlike BATCH-003's WISDE data-availability
    wall (which required a route change to resolve), this batch's blocker is
    correctable within the SAME experiment via a versioned amendment, using
    budget the run itself left almost entirely unspent. L4 remains OPEN,
    highest priority, now MORE tractable than before this batch: the hard
    part (a working, independently-verified delta_E instrument) is done, and
    the remaining blocker has a named, concrete, near-zero-cost fix.
  boundaries:
    - >-
      H-SSIQ-9e2c71's real-arm prediction (gamma_greedy < gamma_random) is
      UNTESTED, not weakly tested and not refuted. No claim about a
      delta_E-gradient existing or not existing is supported by this record
      in either direction.
    - >-
      NO CLAIM IS MADE ABOUT WHETHER A p^{1/4} ALGORITHM EXISTS, is likely, or
      is near. asymptotic_claim stays null throughout, as the frozen contract
      and hypothesis require.
    - >-
      GD-7's cumulative-vs-individual budget arithmetic is independently
      re-verified by the Coordinator directly from already-committed numbers
      in raw-result.json (zero re-measurement, zero new computation) and is
      therefore evidence of a contract-formula property, not itself a claim
      about what a corrected Phase -1 run would find. Whether a real
      descent-vs-random gap is detectable on the corrected prefix remains to
      be executed.
    - >-
      Toy scale throughout: p up to 21601 (15 bits), graphs up to 1800
      vertices, smoothness bound B=X=23. Nothing transfers to cryptographic
      scale.
    - >-
      Evidence strength capped at preliminary, campaign-wide and unchanged by
      this batch: independence remains session-only (both reviewers again
      recorded fallback_used: true, resolved_model_id: claude-sonnet-5,
      independence_kind: session).
  unresolved_confounds:
    - >-
      Whether the corrected, cumulative-budget prefix (4-6 primes) actually
      exhibits a detectable greedy-vs-random descent gap is the open question
      this evidence record cannot answer -- that is BATCH-005's task.
    - >-
      O-4's cost-model overstatement (1.3-2.3x at the smallest 1-2 primes) is
      independently real but secondary; a future amendment should still
      correct it (e.g. a second smoke test at the smallest prime) for
      accuracy, even though O-3 alone already clears the gate.
    - >-
      The narrowed N-range risk flagged in O-6 (small-prime-only coverage
      repeating the shape of a documented estimator bias) is unresolved and
      is recorded as a design constraint for BATCH-005, not evaluated here.
    - >-
      Model independence remains absent and unverifiable in this environment,
      unchanged from every prior batch.
