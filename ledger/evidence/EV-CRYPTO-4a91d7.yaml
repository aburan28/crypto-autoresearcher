  unresolved_confounds:
    - "The blind task's read is still a single, LLM-mediated fetch-and-convert of the primary source, not a second independently-typeset cross-check or a human mathematician's verification of the surrounding proof (e.g. the cited '[27, Lemma 6.26]' and Xu's Theorem 3.5 that Theorem 2.4's own proof relies on were checked for citation only, not independently re-derived)."
