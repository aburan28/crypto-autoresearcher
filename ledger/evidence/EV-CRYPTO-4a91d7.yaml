  proof_status_note: >-
    Applies specifically to the two headline findings this record concerns
    (Theorem 2.4's ineffectiveness; Family L's absence from the cited
    source), NOT to the audit bundle's other 110+ OPEN cells, which remain
    empirical_only/unverified-beyond-internal-consistency per
