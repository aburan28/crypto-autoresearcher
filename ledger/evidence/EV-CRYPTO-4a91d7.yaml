  obstruction:
    statement: >-
      Two disclosed, source-specific missing prerequisites currently block a
      source-matched certificate for this experiment's addition-pullback
      moment target from the cited source (arXiv:2511.09459v1): (1)
      Theorem 2.4 supplies no explicit/computable formula for its implicit
      constant as a function of (d, c(M)) -- only non-constructive
      existence, with Remark 1.2 explicitly disclaiming polynomial/effective
      dependence for this paper's own method (obligation O06, OPEN for all
      14 family-K/L symbolic cases). (2) specification.families.L (R^1 of
      the Legendre family v^2=z(z-1)(z-u), u!=0,1,infinity) does not appear
      anywhere in the cited source under any name or notation, confirmed by
      an exhaustive full-text search including the paper's own dedicated
      worked-examples section (obligation O01, OPEN for case-02/04/06/08/
      10/12/14, and every downstream O02-O04/O07/O09 cell chained from it
      per open-obligations.yaml).
    quantity: >-
      Obligation status for O06 (all-extension effective moment bound)
      across all 14 family-K/L symbolic cases, and O01 (family-specific
      source content) for the 7 family-L symbolic cases.
    value: >-
      OPEN for every named cell (open-obligations.yaml groups
      GAP-O06-EFFECTIVENESS [14 obligation cells] and GAP-O01-L [7
      obligation cells]; the related, weaker GAP-O01-K [7 obligation cells,
      bare-notation-only] is also OPEN). Independently corroborated -- not
      merely internally re-asserted by the same task chain -- by
      TASK-20260928-b9a4de's direct, blind primary-source read.
    measured_by:
