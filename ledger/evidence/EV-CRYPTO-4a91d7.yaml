    - experiments/EXP-CRYPTO-6505c6/audits/TASK-20260913-c6df88/moment-certificates.yaml
  observations:
    - >-
      The audit bundle (experiments/EXP-CRYPTO-6505c6/audits/TASK-20260913-c6df88/,
      20 files) formalizes specification.yaml's frozen 160-cell obligation
      matrix and 400-cell chart-coverage matrix. Direct re-tally (not trusted
      from audit-report.md's prose): obligation-results.yaml has exactly 160
      rows, status counts CERTIFIED=30, REFUTED=6, OPEN=112,
      NOT_APPLICABLE_WITH_CERTIFICATE=12 (sum 160), matching its own
      status_tally and checker-results.yaml's obligation_status_tally
      exactly. chart-coverage.yaml has exactly 400 rows, CERTIFIED=216,
      OPEN=32, NOT_APPLICABLE_WITH_CERTIFICATE=152 (sum 400), likewise
      matching. open-obligations.yaml's own 14 obligation-group + 2
      chart-group cell counts independently sum to 112 and 32. No
      discrepancy found across audit-report.md's prose summary, the two
      per-file tallies, checker-results.yaml, and open-obligations.yaml's
      independent grouping.
    - >-
      HEADLINE FINDING 1 (Theorem 2.4 ineffectiveness, obligation O06, OPEN
      for all 14 family-K/L cases per open-obligations.yaml
      GAP-O06-EFFECTIVENESS): independently CONFIRMED by TASK-20260928-b9a4de,
      a blind task that fetched arXiv:2511.09459v1 directly (abs page, HTML
      rendering, and the raw PDF converted to text with pypdf in an isolated
      venv) without opening this audit bundle, the source digest, or the
      prior corroborating handoff. It quotes Theorem 2.4's conclusion (4)
      verbatim ("the implicit constant depend[s] only on d and c(M)" --
      existential, no formula) and Remark 1.2 verbatim ("whereas [a cited
      prior work] provides estimates where the dependency on the complexity
      ... is polynomial, this is not the case in this paper, due to the use
      of qualitative results in Quantitative Sheaf Theory"), and reports
      grepping the whole 57-page/~126,000-character text for
      "effective"/"explicit" and finding no effective version anywhere.
    - >-
      HEADLINE FINDING 2 (Family L total absence from the cited source,
      obligation O01 OPEN for case-02/04/06/08/10/12/14 per
      open-obligations.yaml GAP-O01-L): independently CONFIRMED by the same
      blind task, via an exhaustive full-text search for "Legendre",
      "Legendre family", "Legendre normal form", and the equation patterns
      z(z-1)(z-u)/x(x-1)(x-u) -- zero matches, including in Section 9 (the
      paper's own dedicated worked-examples section covering hypergeometric,
      Kloosterman-type, orthogonal-monodromy and finite-monodromy sheaves,
      but never a Legendre-family construction under any name).
    - >-
      PROVES-TOO-MUCH CONTROL (Family K / quadratic Kummer sheaf) PASSED:
      the review plan (ledger/handoffs/TASK-20260928-14fdee.yaml) required
      checking that the same blind methodology could find a known-present
      object, since no independently-known-false object exists to
      substitute in a literature-presence check. The blind task found the
      identical "bare notation" passage the audit itself had already
      reported (Section 2, just before Proposition 2.3, defining generic
      L_chi notation with no quadratic specialization) -- an exact match to
      the audit's own prior characterization -- confirming the Family-L
      negative is a genuine absence, not search-shallowness.
    - >-
      Both corroborated findings were stated at unequal coordinator_prior
      confidence before the blind check ran (~75% for finding 1, ~50-60% for
      finding 2, the latter explicitly flagged as the weaker,
      same-object-different-name-vulnerable claim). The weaker finding came
      back the more thoroughly confirmed of the two (an exhaustive search of
      the paper's own dedicated examples section, not merely a keyword grep).
  inference: >-
    The audit's own per-family classification (K: INCONCLUSIVE; L:
    INCONCLUSIVE; overall: INCONCLUSIVE for both families, per
    specification.outcomes.per_family and specification.outcomes.partial) is
    internally consistent and is now independently corroborated on its two
    load-bearing findings, rather than resting only on the unverified digest
    chain audit-manifest.yaml itself flagged. This strengthens the basis for
    those two findings without upgrading any obligation cell, certifying
    either family, or producing an exact counterexample to either
    main-target claim -- none exists in counterexamples.yaml, and none is
    manufactured here. No per-cell status, and no overall audit verdict,
    changes as a result of this review.
  boundaries:
    - "Scoped strictly to arXiv:2511.09459v1 (the v1-tagged text; the blind task explicitly re-fetched this exact version after noting the unversioned URL currently resolves to v3)."
    - "This review independently re-derived exactly two headline findings plus one proves-too-much control; it did not independently re-verify the other 110+ OPEN cells (Sections 5-6's moment-bound proof, Sections 3.1-3.2's Goursat's Lemma / coinvariant-vanishing criterion, the n-vs-d transcription ambiguity, family K's classical facts beyond bare notation, the off-diagonal shared-locus dimension, or the matched-null certificates)."
    - "artifact-sha256.json's 19 listed digests were checked for presence/well-formedness only, not recomputed against file bytes -- no hashing tool was available in this review round."
