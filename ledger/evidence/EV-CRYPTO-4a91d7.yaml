        ledger/handoffs/TASK-20260928-14fdee.yaml's dispatch and this
        record's observations)
    scope: >-
      Scoped strictly to arXiv:2511.09459v1 as read by both the original
      digest chain and the independent blind check. Does NOT rule out: (a)
