  scope_statement: >-
    This record corrects the narrow EV-WESO-001 statement that, with zero
    hidden overhead, the vOW middle regime beats Delfs-Galbraith at every
    tested budget w=2^30..2^80 for all five sizes. Under the corrected
    anchored law, that statement is false as stated. This record does not
    establish a deployed attack, security margin, exponent improvement,
    parameter recommendation, hypothesis transition, or goal completion.
  observations:
    - >-
      The corrected law is T(w) = T_full * sqrt(M/min(w,M)), equivalently
      log2T(w) = log2T_full + 0.5*max(0,log2M-log2w) + c*sqrt(log2p).
      The crossover is log2w_star = log2M + 2*(log2Tfull +
      c*sqrt(log2p) - log2TDG). At w=M the penalty is zero, and it remains
      zero for w>M.
    - >-
      The immutable successor raw result gives c=0 crossovers 54.739597462664136,
      69.2364342245119, 81.64362615310625, 87.26944225770191, and
      102.55760729743037 for log2p=256,384,512,576,768 respectively. The
      independent Validator and Red Team recomputed these values from the
      raw optimal and baseline fields; their maximum reported residuals are
      3e-14 bits and zero, respectively.
    - >-
      For log2p=256, c=0, the corrected model is slower than the baseline at
      log2w=30,40,50 with log2T values 140.36979873133208,
      135.36979873133208, and 130.36979873133208, then faster at
      log2w=60,70,80 with values 125.36979873133207,
      120.36979873133207, and 115.36979873133207. Therefore the old
      all-budgets statement is falsified within this exact model scope.
    - >-
      DEC-20260806-a00a28's separate approximate crossover near 49.5 is
      reproducible from the paper-pair anchor 92.5 + 2*(106.5-128) = 49.5.
      It is not the successor's optimized p=256 crossover 54.739597462664136.
      The value must be relabeled as a paper-pair approximation or superseded
      by a future additive decision statement; this record does not mutate the
      predecessor decision.
    - >-
      The paper-pair sanity control remains a joint partial failure: zero of
      five complete rows are within the declared 0.75-bit tolerance. This
      correction admits the successor's conditional model output but does not
      call it a successful five-row paper reproduction.
    - >-
      The successor manifest records dirty_tree: true, stdout retains the
      legacy RUN-WESOVOW-001 heading, raw-result.json has no standalone
      top-level schema field, and the snapshot receipt retains pending
      post-commit null fields. These provenance limitations are preserved.
    - >-
      No new experiment was run for this batch. The source, predecessor run,
      predecessor evidence, and predecessor decision were not edited.
  inference: >-
    Within the declared conditional cost-model scope, EV-WESO-001's
    all-budgets/all-fields crossover inference is superseded by the corrected
    successor values above. The result is an interpretation correction only;
    it is not evidence for or against a cryptanalytic attack or SSI security.
  boundaries:
    - >-
      The comparison is in F_{p^2}-operation and table-entry coordinates for
      log2p in {256,384,512,576,768}, log2w in {30,40,50,60,70,80}, and the
      declared c scenarios. It is not a hardware-time or end-to-end attack
      measurement.
    - >-
      c=0 is an attack-favorable scenario, not a calibrated default. Table
      construction, bandwidth, hashing, communication, parallel scheduling,
      and other practical costs remain outside this correction.
    - >-
      The five field labels do not establish applicability to deployed
      SQIsign or any reduction from OneEnd to an isogeny security claim.
    - >-
      No asymptotic promotion gate, security claim, breakthrough claim, or
      goal-completion criterion is satisfied.
  unresolved_confounds:
