evidence:
  id: EV-AES-64750e
  hypothesis_id: null
  hypothesis_id_note: >-
    DELIBERATELY NULL, same documented-null allowance as EV-AES-5478a0 and
    its predecessors (CORR-20260802-009). This record binds to the
    2026-09-01 idea round's two cheapest falsification-relevant stages
    (DEC-20260901-b6b959): one is an instrument/record verdict (F1 halt),
    the other a pipeline-defence audit. Neither binds a hypothesis;
    RQ-AES-003 carries no hypothesis this record would attach to.
  experiment_ids: []
  run_ids: []
  task_ids:
    - TASK-20260901-3dffdc
    - TASK-20260901-e2e66e
    - TASK-20260901-75360b
    - TASK-20260901-d004bb
    - TASK-20260901-b309a2
  type: measurement
  direction: mixed
  direction_note: >-
    MIXED by construction: arm 2 (B4 exclusion-toggle audit) corroborates
    the pipeline's integrity in the exact tested scope; arm 1 (ec54fe
    Stage 0) invalidates the idea record's census OBJECT (a derivation
    defect), which is an instrument/record verdict and explicitly NOT
    evidence against the affine-skeleton mechanism question (rule 5).
  strength: moderate
  strength_basis: >-
    MODERATE, and deliberately split in what it covers. PIPELINE SIDE
    (B4, arm 2): the identity delta(OFF)-delta(ON) = 0 = trivial-trial
    count held EXACTLY on both arms at full 2^30 with trial-by-trial
    set-identity verified (hits_OFF \ hits_ON = trivial_set = empty;
    AES hit set identical to the 14 committed comparator indices; FF hit
    set [1, 270788492]), and the ENABLED builds arithmetically reproduced
    the committed immutable receipts L1-AES-R5-P30 (14 hits, identical
    indices and digests) and M1-FF-P30 (1 hit, digests) field-exact, with
    the build-pair diff verified to be exactly one #define line. This is
    as strong a pipeline-integrity confirmation as the exposure allows,
    but its POWER over the nonzero-delta path is VACUOUS at 2^30: the
    expected trivial-trial count is ~0.25/arm, zero were realized, so
    the audit verified the identity 0=0 and cannot at this exposure
    detect a defect that only manifests with nonzero trivial trials
    (disclosed per the idea record's own zero-or-one regime). RECORD
    SIDE (F1, arm 1): the F1 halt itself is fully validated -- the
    archived anchor object reproduces exactly under fresh code (ranks
    32,0,0,0 of P_j(D*M)P0^T, D5*M5=I128 both directions, empirical
    q0^q1=p0^p1 and W=4-|A| on 100% of keyed trials) while the record's
    census object T=M5^-1 Z_{CW[0]} M5 yields ranks 32,32,32,32 with
    P(W>=1)=2^-32, contradicting the anchor requirement; the validator
    independently re-derived both rank sets in fresh sparse GF(2) code
    with zero discrepancies. Strength stays moderate rather than strong
    because the pipeline audit's nonzero path is vacuous at this
    exposure and the F1 result closes only the specific census
    formulation, not the mechanism question it was meant to probe.
  claim_tier: toy
  claim_tier_basis: >-
    Reduced-round (r=5) AES-shaped SPN probe geometry at 64-bit block,
    trials at 2^30 for the B4 arms; the census arm is pure sparse GF(2)
    linear algebra over the campaign's frozen cell geometry with zero
    cipher compute and zero fixture-arm trials (F1 halt before any arm
    ran). No crypto-scale, medium-scale, affected-scheme or asymptotic
    claim is made or implied, and no comparison to published
    cryptanalysis is made in either direction (RQ-AES-003 R3).
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []

  observations:
    - id: OBS-B803-1
      statement: >-
        ARM 1 (IDEA-20260901-ec54fe STAGE 0): F1 FIRES -- THE IDEA
        RECORD'S CENSUS OBJECT IS A DERIVATION DEFECT, AND ALL ITS
        READINGS ARE VOID. Under fresh, independent byte-level code the
        ARCHIVED anchor object reproduces exactly: D5*M5 = I128 in both
        directions, word-map ranks of P_j(D*M)P0^T are 32,0,0,0, and
        empirically q0^q1 = p0^p1 with W=3 on 100% of 1000 keyed anchor
        trials (consistent with EV-AES-048545 O-7). The record's census
        object T = M5^-1 Z_{CW[0]} M5 at the same anchor yields ranks
        32,32,32,32 with exact P(W>=1) = 2^-32, contradicting the
        required 32,0,0,0 / P=1.0, so F1 fired by the record's own
        blocking rule and the producer halted at run 1 (exit 5 by
        design), before any non-anchor cell and before the fixture arm
        (0 trials run). Divergence localization (all checks on actual
        keyed cipher values): the harness pair-difference map in the
        affine limit is the IDENTITY for every r, S, key (DE = id, since
        swap preserves XOR difference), giving deterministic W = 4-|A|
        (verified 6 cells x 500-1000 trials); q0^p0 = M^-1 Z_keep M d
        (keep-mask variant) holds 1000/1000 while the zero-mask T
        describes NO instrument quantity (0/1000); the keep-mask variant
        also ranks 32,32,32,32, so the mask sign is not the only issue.
        Classification: derivation defect in the proposal's P1/object,
        NOT an instrument defect; repair guidance recorded in the
        producer's RESULTS.json (identity-map census or a redefined
        one-sided statistic). Per rule 5 this is NOT evidence against
        the affine-skeleton mechanism; the mechanism question is
        untouched by this arm.
    - id: OBS-B803-2
      statement: >-
        ARM 2 (IDEA-20260901-02f7c4 B4): THE EXCLUSION-TOGGLE AUDIT
        PASSES C4 WITH A VACUOUS-POWER DISCLOSURE. Signed W>=1 delta
        (OFF - ON) = 0 and trivial-trial count T = 0 EXACTLY on both
        arms at full 2^30 (1,073,741,824 trials each): AES r=5 arm
        (hits 14 on both builds, identical committed comparator indices)
        and fresh-key SipRound-Feistel null-object arm (hit [1,
        270788492] on both builds). Trial-by-trial set identity
        verified: hits_OFF \ hits_ON = trivial_set = empty on both
        arms. Preregistered prediction confirmed: disabling raises the
        W>=1 count by exactly the trivial-trial count (0 = 0). Power
        disclosure (preregistered): expected T ~ 0.25/arm at 2^30, so
        the nonzero-delta path of C4 is vacuous at this exposure --
        the identity holds exactly but was only tested at zero.
    - id: OBS-B803-3
      statement: >-
        ARM 2 INTEGRITY BONUS: THE ENABLED BUILDS ARE ARITHMETICALLY THE
        STANDARD CAMPAIGN BUILD. Field-by-field exact reproduction of the
        committed immutable receipts L1-AES-R5-P30 (14 hits, identical
        indices, digests) and M1-FF-P30 (1 hit, plaintext and key-stream
        digests), including first-trial keys. The exclusion toggle was
        located and cited in the harness lineage (BATCH-015
        rc8probe_freshfeistel.c:441 wword gate, :443 trial skip; lineage
        from BATCH-014 rc8probe_feistel.c:196/198), and the build-pair
        diff is exactly the one #define EXCLUDE_TRIVIAL line. This
        closes the standing question of whether the campaign's hit
        counts could be inflated or deflated by the exclusion logic:
        at the tested exposure the logic changes nothing, and its
        arithmetic is verified by signed delta rather than code reading
        alone (per the idea record's C4 design).
    - id: OBS-B803-4
      statement: >-
        VALIDATION: the independent validator (fresh session, fresh
        sparse GF(2) code, zero producer-code reuse) re-derived the
        anchor rank sets for the anchor cell plus one additional cell
        at every r=1..10 and three extra r=5 cells (archived object
        32,0,0,0 vs record object 32,32,32,32 / P=2^-32, matching the
        producer exactly), verified the F1 halt procedurally (1/8 runs,
        exit 5, no non-anchor cells, no fixture arm), re-counted the B4
        W>=1 totals from raw receipts trial-by-trial on all four arms
        (deltas 0=0 both arms; P1-P7 identities hold), diffed the two
        B4 sources itself (one #define line), and confirmed snapshot
        b4c40ce42 by hash. Zero discrepancies; two bugs found during
        validation were in the validator's own code, fixed and disclosed
        with buggy intermediates discarded. All controls passed:
        preregistration mtime ordering both producers, frozen-cell-set
        closure (only the anchor cell computed, no post-hoc cells),
        toggle-diff claim, snapshot hash verification.
  tested_parameters: >-
    Arm 1: r=5 reduced-round AES-shaped SPN probe geometry, 64-bit
    halves, the idea record's FROZEN cell set (only the anchor cell
    computed before the F1 halt; 6 cells x 500-1000 keyed trials for
    divergence localization). Pure sparse GF(2) linear algebra for the
    census objects (zero cipher compute); the 2^30 fixture arm was NOT
    RUN (F1 halt). Arm 2: r=5 AES arm and fresh-key SipRound-Feistel
    null-object arm, each in two builds (exclusion ON/OFF), full 2^30
    trials per arm (4 arms total), campaign-standard exposure, up to 8
    threads (determinism preserved). Comparator: BATCH-009's frozen
    matched-exposure rule as carried by EV-AES-e4c091 / BATCH-015's
    verified frozen_comparator block.
  actual_scope: >-
    Arm 1 closes ONLY the specific census formulation
    T = M_r^-1 Z_{CW[S]} M_r (zero-mask and keep-mask variants) as a
    description of the instrument's pair-difference map: it is void at
    the anchor and the readings it would have produced are invalid.
    It says NOTHING about the affine-skeleton mechanism itself, which
    remains open and now has a repaired-object route. Arm 2 closes ONLY
    the exclusion-toggle audit at 2^30 exposure where zero trivial
    trials were realized: the exclusion logic changes no count and its
    arithmetic is exact in the tested zero regime; the nonzero-delta
    path is untested at this exposure by construction. Neither arm
    speaks to other exposures, other null objects, or any deployed
    cipher.
  transfer_assumptions: >-
    None beyond the stated scopes. In particular NO transfer from the
    B4 pipeline verdict to any mechanistic claim, and NO transfer from
    the F1 record-defect verdict to a negative mechanistic result
    (rule 5 stated explicitly in the record's decision rule).

  unresolved_confounds:
    - >-
      Arm 1: the affine-skeleton mechanism question (WHERE the r=5
      excess lives, given five substitute/geometry exclusions) is
      untouched -- the census object was void, so the geometry-driven
      vs nonlinearity-driven dichotomy is not yet discriminated. A
      repaired object (identity-map census or redefined one-sided
      statistic, per the producer's localization) is the concrete
      route and must carry its own falsification design.
    - >-
      Arm 2: C4's nonzero-delta path is vacuous at 2^30 (expected
      T ~ 0.25/arm, zero realized). If a future exposure regime
      realizes nonzero trivial trials, the audit must be re-run there;
      the identity 0=0 does not certify the arithmetic beyond the
      zero regime.
    - >-
      Seed-to-seed variance of the AES-side excess (14 vs 19 hits,
      EV-AES-5478a0 OBS-B16-3) remains unexplained and is unaddressed
      by this batch.
    - >-
      The external citations underpinning the comparator statistics
      (Garwood 1936; exact conditional binomial) remain provenance
      'recalled' -- pointers, not support (carried from prior records).

