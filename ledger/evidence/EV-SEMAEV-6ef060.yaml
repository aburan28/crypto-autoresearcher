        so speedup → 2^{m-1}. The speedup grows with m.
    - id: O-3
      text: >-
        At OPTIMAL B (heuristic ≈ 1) for each m: gamma_m ≈ 0.5-0.8 (intermediate).
        Effective speedup at optimal m: 2^{m-1} × 0.6-0.8.
        For optimal m_opt = sqrt(log N / log log N): speedup ≈ 2^{m_opt} × 0.7.
    - id: O-4
      text: >-
        CRYPTOGRAPHIC SCALE IMPLICATION: For N=2^256, optimal m_opt ≈ 5.65 (sqrt(256/8)).
        BKK speedup at m_opt: 2^{4.65} × 0.7 ≈ 22x constant factor improvement.
        This changes the Semaev leading constant by ~log(22)/sqrt(256×8) ≈ 0.11.
        Effective improvement: exp(0.11 × sqrt(256×8)) ≈ exp(5) ≈ 150x at crypto scale.
        NOT an exponent improvement, but a substantial practical improvement.

