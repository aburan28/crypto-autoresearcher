  proof_status: derivation
  proof_status_note: >-
    H-MONO-59f6a6 is a protocol/instrument hypothesis whose per-member
    forced outputs rest on hand derivations (Steps 1-2 of `mechanism`: the
    structural upper bound U and inertia lower bound L for N1, N2,
    N2-twin, N4), stated and frozen before any run. This experiment is a
    toy-scale exact census CHECKING those derivations against a
    base-change ladder, independently re-derived from scratch (not merely
    re-read) by both reviewers: the validator re-derived N2's inertia
    argument via an independent elementary quadratic-residue counting
    proof and hand-verified N4's Z/3 group theory; the red-team
    hand-derived N4's full (3,3,1,3) sequence from field theory and
    independently re-derived N2/N2-twin/N1's R_k values directly from raw
    permutation data using from-scratch closure code.
  proof_refs:
    - ledger/hypotheses/H-MONO-59f6a6.yaml#mechanism
    - experiments/EXP-MONO-a20e48/reviews/validator/validation-report.yaml (independent re-derivation)
    - experiments/EXP-MONO-a20e48/reviews/red-team/red-team-report.yaml (independent re-derivation)

  observations:
    - >-
      ALL SIX PRE-REGISTERED PREDICTIONS CONFIRMED EXACTLY, BOTH RUNS. N1
      (the m=3 Semaev cover already assigned D_4 by H-MONO-0b3def) held at
      R_k=8 with NO DROP at any k=1..4, in both runs — the single most
      consequential possible outcome named explicitly by the hypothesis
      (a drop would have contradicted H-MONO-0b3def STEP 4 and
      KN-FIND-a8990a Theorem A's arithmetic-equals-geometric clause), and
      it did not occur. N2 (the planted separator h_sep) showed the exact
      forced period-2 contrast R_k = 4,2,4,2. N2-twin (the true-(Z/2)^2
      control) held constant at R_k=4 at every k. N4 (Y^3-2) reached the
      exact forced period-3 sequence R_k = 3,3,1,3. N5 (the scoped-down
      S_5 nearby-object control) returned UNDECIDED at every k in both
      runs, with both bounds (U=120, L=1) reported, regardless of density
      match quality. The N2 sample-size control was unchanged across a
      100x sample increase (exhaustive vs. S=1,000 vs. S=100,000, all
      R_1=4). The labelling control agreed on all four verdict-bearing
      members in both runs.
    - >-
      INDEPENDENT RE-DERIVATION FROM RAW DATA, NOT RE-VERIFICATION OF
      SUMMARIES. Both reviewers wrote from-scratch verification code
      (never importing battery.py/tower.py/fieldext.py) and recomputed
      R_k directly from `per_base_point_log/*.jsonl`'s raw permutation
      field for N1, N2, N2-twin, matching the Executor's reported values
      exactly in every (member, run, k) cell. N4 (single exact
      computation, no per-point log) was independently hand-derived by
      both reviewers from Frobenius-on-roots-of-Y^3-2 field theory,
      matching the reported permutations element-by-element at every k.
      The Validator additionally wrote a THIRD, wholly independent
      implementation of N1's k=1 classifier (fresh sqrt_mod, hand-rolled
      Fp2/Fp4 complex-method tower, sharing no code with the Executor's
      arm or with EXP-MONO-4c7479's fp_common.py) and spot-checked 10
      points spanning all five outcome classes, matching exactly including
      full permutation tuples — mitigating a shared-implementation-bug
      explanation for the clean pass.
    - >-
      N1 REPRODUCTION CONTROL INDEPENDENTLY VERIFIED FROM BOTH SIDES' RAW
      LOGS. Both reviewers recomputed the k=1 exhaustive class histogram
      directly from THIS contract's raw per-point log and separately from
      EXP-MONO-4c7479's own previously-committed raw log, and confirmed
      an exact match (including a nonzero `four_cycle` count), ruling out
      a fabricated or mislabelled historical reference.
    - >-
      DETERMINISM CONFIRMED. Exact/exhaustive cells (N1 k=1, N4 all k, N2/
      N2-twin k=1) are byte-identical between the two runs, as required
      (seed-free by construction); sampled cells (N1/N2/N2-twin k=2,3,4;
      N3, N5 all k) differ in raw draws between runs but agree in every
      derived R_k / verdict, exactly the seed-invariance pattern the
      contract specifies. Independently confirmed by the Validator via
      direct diff of `raw-result.json` between runs.
    - >-
      SAMPLING RISK IS NOT THE OPERATIVE UNCERTAINTY FOR N1'S HEADLINE
      RESULT. Both reviewers independently computed the coupon-collector
      false-negative probability at the pre-registered S=10,000 as
      astronomically small (~10^-580 for N1's order-8 group, ~10^-1249 for
      the order-4 objects), far below HEUR-AG-2's own conservative 0.999
      floor, and both note that N1's result is existence-proof-grade
      (closure of exhibited group elements): a genuinely smaller
      arithmetic group would deterministically cap closure below U
      regardless of sample size, so "N1 held at 8" cannot be an artifact
      of unlucky sampling. The correctness of the field-arithmetic
      classifier itself is the operative question, addressed by the next
      two items.
    - >-
      DISCLOSURE-PRECISION GAP ON THE PRE-RUN BUG CATCH, FOUND
      INDEPENDENTLY BY BOTH REVIEWERS. `implementation.md` credits "the
      required ring-homomorphism self-test" with catching a
      Frobenius-exponent defect in `tower.Level2` before any official run
      (using the ladder step's own field order q1=q0^2 instead of the
      base field's order q0 when computing the order-4 automorphism).
      Both reviewers independently grepped the committed implementation
      and found no dedicated, standalone regression test for this
      property exists; `git log --follow` on `tower.py` shows exactly one
      commit, already containing the corrected code, so the narrative
      cannot be corroborated from the archive (no earlier buggy commit,
      no diff, no retained self-test transcript). Both reviewers then
      independently reconstructed the literally-disclosed bug in a
      disposable copy and reran it against the real seeded sampling
      procedure: it produces a loud, uncaught `RuntimeError` on the first
      level-2-requiring point of N1's k=1 exhaustive census (44,521
      points), not a silent wrong value — mechanistically consistent with,
      though not proof of, "caught before any official run." This is a
      disclosure-precision finding, not a correctness finding: the actual
      regression protection that exists is an emergent, undocumented-as-
      such property of N1's own Frobenius-image point-matching logic
      (confirmed by the Validator to fire immediately on reintroduction of
      the bug), and N1 is the only battery member whose classification
      ever reaches `tower.Level2` (N2/N2-twin only reach Level1; N4
      bypasses the tower entirely).
    - >-
      A REAL, GENERAL METHODOLOGICAL WEAK POINT IN THE CLOSURE-ORDER
      WITNESS, CONSTRUCTED BY THE RED TEAM (J2). "Generated-subgroup
      closure order equals the structural upper bound U" is a weaker
      correctness witness for a multi-generator group than the record
      implicitly treats it as. The Red Team constructed a maximally-broken
      `tower.Level2.frob` (identity map, i.e. level-2 Frobenius never
      implemented) and ran it against N1's real seeded sampling procedure:
      it does NOT crash; every point needing a level-2 lift is silently
      reclassified into the `identity` stratum (the `four_cycle` class
      vanishes entirely), yet the surviving generators — which never need
      level 2 — still close to the full order-8 D_4 group by composition
      alone, because two reflections from distinct D_4 conjugacy classes
      already generate the whole group. A record reporting only closure
      order and the labelling control could not have distinguished this
      broken run from the real one. THE ACTUAL ARCHIVED RUN IS NOT
      AFFECTED: both reviewers independently confirmed, directly from raw
      per-point logs (not the Executor's summary), that the `four_cycle`
      stratum is genuinely present with structurally-plausible, nonzero
      density at every tested k (~24-26% of samples at k>=2, matching
      D_4's 2/8 class-size density; exact match to EXP-MONO-4c7479's own
      committed histogram at k=1) — ruling out the specific silent-failure
      mode constructed. The general point about closure-order-alone being
      an insufficiently strong witness stands as a design lesson for any
      future record in this family working with a group that has more
      than one "layer" of field-extension lift (D_4, S_4, S_5, ...); the
      Red Team names a concrete, cheap retrofit (require all forced
      conjugacy classes/strata observed with nonzero count, not just
      closure order == U) as `next_concrete_action`.
    - >-
      PROVES-TOO-MUCH CONTROL PASSED. The Red Team constructed a second,
      independently maximally-broken protocol variant ("always report no
      drop": `Level1.conj` = identity) and confirmed it is caught
      immediately and unambiguously at every k by the exact same
      independent verification method used to certify N2's real result —
      confirming the method has genuine discriminating power rather than
      rubber-stamping whatever the archived log said.
    - >-
      N3'S ONE DISCLOSED ~3-SIGMA EXCURSION IS UNREMARKABLE UNDER
      MULTIPLE COMPARISONS. The Red Team independently recomputed the
      one flagged cell (N3, run 2, k=4, class "1^4": 56/2000 observed vs.
      83.33 forced, -3.06 s.e.) exactly from raw data, then computed the
      multiple-comparisons context across the battery's ~96-116
      quasi-independent density checks: expected exceedance count at a
      3-s.e. threshold ~0.26-0.31, P(>=1 exceedance) ~= 23-27%. Observing
      exactly one such excursion is squarely within the expected range
      under pure chance.
    - >-
      N5'S FORCED-UNDECIDED VERDICT INDEPENDENTLY CONFIRMED NOT DENSITY-
      DERIVED. The Red Team confirmed by direct code inspection that N5's
      UNDECIDED verdict is hardcoded unconditionally in run_experiment.py,
      never derived from the measured density — ruling out any path by
      which a good S_5-density match could have been smuggled into a
      DECIDED verdict. N5's measured density profile shows ordinary
      scatter (deviation range -2.58 to +2.30 s.e.) with visibly different
      histograms across independent draws at each k, evidence against
      non-independent draws rather than for it.
    - >-
      MINOR DISCLOSED ITEMS. (a) Measured wall-clock (~450-460s per run)
      exceeded the frozen contract's own cost_note estimate ("seconds to
      low tens of seconds") by roughly 15-30x, disclosed by the Executor
      as a protocol_deviation and independently confirmed by the Red Team;
      stayed well inside the 1800s budget cap in both runs, no stopping
      rule triggered. (b) The labelling control's per-point raw logs were
      not retained by design (only the aggregate `matches_primary: true`
      flag survives); unlike every other primary metric, neither reviewer
      could independently re-derive it from archived raw data and it was
      taken on the Executor's summary alone. (c) Neither reviewer's
      `resolved_model_id` was probe-verified (`model_verified: false` in
      both attestations); both flag this explicitly.

  metric_results:
    - metric: N1_R_k_no_drop
      forced: "8 at every k=1..4"
      observed: "8 at every k=1..4, both runs, independently re-derived from raw data"
      result: pass
    - metric: N2_period2_contrast
