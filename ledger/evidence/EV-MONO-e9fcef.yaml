      result: pass
    - metric: N2_twin_constant
      forced: "4 at every k"
      observed: "4 at every k, both runs, independently re-derived"
      result: pass
    - metric: N4_period3_sequence
      forced: "3,3,1,3"
      observed: "3,3,1,3, both runs, independently hand-derived and code-verified"
      result: pass
    - metric: N5_undecided
      forced: "UNDECIDED at every k, regardless of density match"
      observed: "UNDECIDED at every k, both runs; hardcoded rather than density-derived, confirmed by code inspection"
      result: pass
    - metric: N2_sample_size_control
      forced: "R_1 unchanged across exhaustive/1e3/1e5"
      observed: "R_1=4 identically across all three, both runs"
      result: pass
    - metric: labelling_control
      forced: "alternate convention gives same abstract group order"
      observed: "confirmed for N1/N2/N2-twin/N4, both runs; raw log not retained (disclosed gap)"
      result: pass_with_disclosed_gap
    - metric: closure_order_witness_strength
      forced: "not applicable — a design-review finding, not a pre-registered metric"
      observed: "closure order == U is satisfiable from a strict generator subset when missing classes are products of surviving ones (constructed on N1: identity-Level2 mutation)"
      result: general_design_lesson_actual_run_unaffected

  empirical_evidence_created: true
  mathematical_evidence_created: true
  scientific_evidence_created: true
  scientific_effect: >-
    Supports H-MONO-59f6a6's claim that a base-change ladder over F_{p^k}
    (k=1..4) can separate arithmetic from geometric monodromy, at toy
    scale (p=211, six frozen battery objects), including correct refusal
    to overclaim on the nearby-object control (N5). Corroborates, without
    proving, H-MONO-0b3def's already-derived claim that the m=3
    symmetric-base Semaev cover's arithmetic and geometric monodromy
    coincide (N1 did not drop). No ECDLP claim. No m>=4 claim. No
    relation-rate claim. Surfaces one general, actionable design lesson
    (closure-order-alone as an insufficient witness for a multi-generator
    group) for future records in this family, with the actual archived
    run independently confirmed unaffected by the specific failure mode
    constructed.

