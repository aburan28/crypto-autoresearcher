  scope_statement: >-
    THIS RECORD ASSERTS NO MEASUREMENT. No experiment ran, no run record
    exists, and nothing here supports or weakens any hypothesis about SSI,
    SQIsign, or the supersingular isogeny problem. It records the outcome of
    one independent red-team review of an ideation-and-design package, in the
    manner of EV-ICEX-001. Direction is neutral and the claim tier is
    not_applicable by construction, not by caution.

  observations:
    - >-
      SNAPSHOT INTEGRITY HOLDS. The reviewer independently recomputed 5 of the
      11 declared path_sha256 values via `git show 69441f1a:<path>`; all
      matched. Content binding is operative; commit_sha/parent_sha are null,
      which CLAUDE.md makes advisory.
    - >-
      OBJ-1 (BLOCKING, dispatcher-verified). EXP-SSI-697354 cannot be executed
      as frozen. RG-REPRODUCTION-GATE declares its configuration as "unbounded
      memory, memoryless baseline", which selects MC_P13. Under MC_P13's own
      formula, which subtracts 0.5*min(log2 w, L_mem), T_A(256) = 118.4613 -
      46.25 = 72.2113, against the gate's asserted band [118.25, 118.75]. The
      frozen reference block and preregistered_prediction.Q1 omit the memory
      term entirely. An Executor must therefore either fail the blocking gate
      or make an undeclared protocol choice, and invalidation_rules forbids
      both. The dispatcher reproduced the arithmetic independently.
    - >-
      OBJ-2 (BLOCKING, dispatcher-verified at source). The MC_P13 charging is
      an arithmetic error rather than a modelling convention.
      experiments/EXP-WESOVOW-001/cost_model.py records
      `T_w_vOW: "T_full / sqrt(min(w, M))"`, taking the square root of a memory
      COUNT rather than a RATIO. The decisive check is its own boundary: at
      w = M, an honest law must return T_full, and this one returns
      T_full / sqrt(M). The dispatcher evaluated it: at NIST-I the deviation is
      exactly 0.5 * L_mem = 46.25 bits, attacker-favourable, uniformly in w
      above the clamp; the reviewer reports 46.25 / 69.30 / 90.65 bits at
      NIST-I/III/V, and 2 * 46.25 = 92.5 reproduces the committed L_mem exactly.
    - >-
      OBJ-2 CONSEQUENCE FOR A COMMITTED RECORD. EV-WESO-001's committed finding
      that the method "beats Delfs-Galbraith at every tested budget
      w = 2^30..2^80" is reported by the reviewer as a direct product of this
      offset; correctly anchored, the crossover sits at log2 w ~ 49.5 entries.
      That is a correction owed to a committed evidence record and is recorded
      here as owed, not as made. It is not adjudicated by this batch.
    - >-
      OBJ-2 IS UNDETECTABLE BY THE CONTRACT'S OWN CONTROLS. MONO-1..4 are
      differential and invariant to a constant offset; RG-1..5 evaluate with
      the memory term absent; SANITY-1 audits the sign, not the anchor; XCHK-1
      recomputes the same expression. A cost-model error of 46 bits passes
      every gate the contract declares.
    - >-
      OBJ-3 (BLOCKING). IDEA-20260806-62ba9d's rank floor is unsound. It
      conflates the Z-span of the outputs with the order they generate: every
      subfield of B_{p,inf} has degree dividing 2, so two non-commuting
      non-scalar endomorphisms already generate a rank-4 order, giving k >= 2
      rather than k >= 3 -- which fires the record's own falsification
      condition 5. Further, reference [35] is identified at line 328 of the
      very file the record declares READ (Page-Wesolowski, "... One
      Endomorphism ... are Equivalent"), and corpus record SC-2 states
      "Theorem 7.2 reduces EndRing to OneEnd_lambda". Both give k = 1. The
      1.585-2.585 bit figures and the 32-43% sota_delta must be withdrawn.
    - >-
      THE 62ba9d PREMISE SPLITS. Its structural half is UPHELD: paper line 226
      prices "the concrete cost of the algorithm" at Algorithm 3, so Section
      4.1 does price OneEnd while SQIsign key recovery is Isogeny. Its novelty
      half is REFUTED: GOAL-SSIQ-001 GD-1 states the same premise verbatim and
      was discharged at BATCH-002, with SC-1 (GRH at the Isogeny arrow), SC-2
      (OneEnd_lambda, singular) and SC-3 (concrete cost not inheritable) all
      committed. The proposal's novelty search missed them because it grepped
      "Corollary 1.2" and not "Proposition 8.5".
    - >-
      A QUALITATIVE CORRECTION IS NEVERTHELESS OWED TO EV-SSI-59f7a2. It labels
      a OneEnd cost as a SQIsign security figure without carrying SC-1 or SC-3.
      The reviewer notes that the string "GRH" appears ZERO times in
      EV-SSI-59f7a2, H-SSI-7fe2bf, or EXP-SSI-697354. The correction is
      qualitative, not numeric; the 2^{120-123} value itself is not challenged
      by this finding.
    - >-
      CONTROL CAPABILITY -- THE CENTRAL ADVERSE FINDING. Of the 14 assertions
      in EXP-SSI-697354, the reviewer computed that ZERO can return a negative
      about the mathematical object. RG-5 has minimum gap 2.5241 and maximum
      11.2756 against a bar of <=6.5 or >=10.5; the null arm D_null0 is
      identically E(P) in [11.9613, 13.6621], so F4 would require a < 0.0039
      and F6 would require E <= 4.9, neither reachable; MONO-4 is forced above
      10 bits against a 0.5-bit bar; MONO-5's four limbs all pass on data
      frozen inside the contract itself. The reviewer records this as "batch 34
      of the pattern", against the 33 consecutive SSI batches already on record
      whose controls all passed because none could fail (KN-TECH-1a5b7e).
    - >-
      THE ONE OBJECT-LEVEL CONTROL IN THE BATCH is ARM M of
      IDEA-20260806-b60c35, and it is blocked on a sampler that does not exist.
    - >-
      THE vOW CONVENTION CONFLICT IS DECIDABLE, AND NEITHER COMMITTED READING
      IS RIGHT. MC_P13 has the right shape and the wrong anchor; MC_VOW
      misattributes the paper's own interpolation curve to a baseline the paper
      states has negligible memory. The designer's HEUR-XO-3 two-valued axis is
      therefore a false dichotomy. Separately, H-SSI-7fe2bf lines 327-330 and
      the specification's SANITY-1 contradict each other on the sign of the
      alleged pathology, inside a single frozen snapshot.
    - >-
      THE SYNTHESIS SENTENCE IS WRONG AND THE DESIGNER WAS RIGHT TO REFUSE IT.
      Gaps below target are 9.5387 / 21.9537 / 38.8387 bits at NIST-I/III/V and
      GROW with level. The reviewer adds two corrections in the designer's
      favour: the inversion originates in EV-WESO-001's own inference block,
      whose observations block says margins "survive" meaning the ATTACK's
      advantage; and SCOPE-A and SCOPE-B are numerically identical at
      log2 k_DG = 0, so the contract's Q5 counts one observation twice.
    - >-
      DUPLICATION. Four of five proposals are not duplicates against their
      named nearest neighbour plus two to four further proposals the reviewer
      chose independently; IDEA-20260806-62ba9d is a partial duplicate. The
      reviewer enumerated all 267 proposal files. The producer's disclosed
      recall gap of 100 of 257 cost exactly one finding -- the Proposition 8.5
      cluster -- which is the one that broke its own top-ranked proposal.
    - >-
      RUNNABILITY. The stdlib-only primary path is confirmed: the reviewer
      reproduced all five frozen fit constants and all four T_A(256) values in
      pure `math`. Two gaps remain: stdlib_modules_permitted omits `re` and
      `ast`, which two mandatory parsing steps require, and the
      invalidation-protected w grid lives in H-SSI-7fe2bf line 500 rather than
      in the frozen specification.
    - >-
      THE "VACUOUSLY SATISFIED" WORDING IS PRESENT in escalation_rules as the
      contract requires, but its stated mechanism holds only under MC_VOW.
      Under MC_P13 no cell is ever memory-masked, so the required disclosure
      does not describe what the contract would actually do.

  dispatcher_verification:
    - >-
      The dispatcher independently confirmed OBJ-1 and OBJ-2 by arithmetic and
      by reading experiments/EXP-WESOVOW-001/cost_model.py at source, rather
      than accepting the report. The boundary check (w = M must return T_full)
      is the decisive one and it fails.
    - >-
      DEPENDENCY CLAIM CORRECTED, AND THE ERROR IS THE DISPATCHER'S. Both task
      cards in this batch stated "SageMath and g6k are ABSENT; numpy is
      present." The dispatcher asserted that without checking. numpy and sympy
      are BOTH absent in this environment (`import numpy` and `import sympy`
      both raise ModuleNotFoundError; `harness/runner.py` cannot import). The
      SSI contract is unaffected because it independently chose a stdlib-only
      primary path, but the instruction was false when given.

  inference: >-
    This package produced five proposals and one frozen contract. The contract
    is NOT executable as frozen (OBJ-1) and rests on a cost model with a
    46-bit anchor error its own controls cannot detect (OBJ-2). Its declared
    control set is incapable of returning a negative about the object under
    study. One proposal's headline quantities are withdrawn (OBJ-3). Nothing
    here is evidence about SSI in either direction; the correct reading is
    that the batch produced candidate material plus a set of defects, and that
    the defects are the useful output.

  boundaries:
    - No experiment ran. No run record exists. No claim tier above
      not_applicable is available to this record.
    - The corrections owed to EV-WESO-001 and EV-SSI-59f7a2 are RECORDED AS
      OWED here and are not made by this record. Both are committed and require
      superseding records under AGENTS.md rule 4.
    - The reviewer is a single independent session. Under AGENTS.md rule 12 a
      breakthrough or contradiction claim requires review-breakthrough at max;
      no such claim is advanced here, so that gate is not invoked.
    - The synthesis document analysis/SSI-ECDLP-SYNTHESIS-20260803.md is not
      amended by this record.

  unresolved_confounds:
    - Whether MC_P13's error propagates beyond EV-WESO-001 into other committed
      margin rows in the P13 and SSI campaigns. Not surveyed.
    - Whether the correct vOW anchoring changes the sign of any conclusion in
      GOAL-P13-001, whose estimator work shares the same cost model.
    - The producer's audit head-read 12 of 19 target proposals; the reviewer
      closed the enumeration gap but did not re-read all 19 in full either.

