evidence:
  id: EV-ECRANK-b6c9b6
  hypothesis_id: H-ECRANK-28dba7
  experiment_ids: [EXP-ECRANK-e1e30e]
  run_ids: [RUN-ECRANK-e1e30e-001, RUN-ECRANK-e1e30e-002, RUN-ECRANK-e1e30e-003]
  type: theoretical
  direction: supports
  strength: strong
  claim_tier: toy
  claim_tier_note: >-
    The tier vocabulary in docs/claims-and-verification.md is indexed by ECDLP
    field bit-size and does not describe this result; `toy` is recorded as the
    least-asserting available label rather than as a description. The governing
    scope statement is in `boundaries`: these are EXACT algebraic certificates
    about named curves over named fields, not measurements extrapolated to a
    larger regime.
  certificate_refs:
  - experiments/EXP-ECRANK-e1e30e/certificates/cert_deg32_eigenspace.json
  - experiments/EXP-ECRANK-e1e30e/certificates/cert_deg64_eigenspace.json
  - experiments/EXP-ECRANK-e1e30e/certificates/cert_deg16_multiplicity.json
  - experiments/EXP-ECRANK-e1e30e/certificates/cert_deg32_multiplicity.json
  - experiments/EXP-ECRANK-e1e30e/certificates/cert_deg2_rank31.json
  - experiments/EXP-ECRANK-e1e30e/certificates/cert_deg8_control.json
  - experiments/EXP-ECRANK-e1e30e/certificates/verification_summary.json
  proof_status: certificate
  proof_refs:
  - experiments/EXP-ECRANK-e1e30e/source/verify_certificate.py
  - experiments/EXP-ECRANK-e1e30e/source/verify_quadratic_lift.py
  - experiments/EXP-ECRANK-e1e30e/source/verify_record_curve.py
  - experiments/EXP-ECRANK-e1e30e/runs/RUN-ECRANK-e1e30e-002/verify_all.stdout.log
  observations:
  - >-
    EXACT, UNCONDITIONAL, NO NUMERICS. E : y^2 = x^3 + 405x + 16038 (minimal
    model [1,-1,1,0,0], conductor 53) has rank E(K) >= 32 over
    K = Q(sqrt -2, sqrt -3, sqrt -5, sqrt 7, sqrt 13), [K:Q] = 32. All 32
    classes of the group V carry a rational point on the corresponding quadratic
    twist; each point is verified on-curve and non-torsion in exact rational
    arithmetic by a verifier that never calls PARI; independence is by distinct
    Galois characters. cert_deg32_eigenspace.json, verifier errors 0.
  - >-
    EXACT, UNCONDITIONAL, NO NUMERICS. E : y^2 = x^3 + 5805x + 973998 (minimal
    model [1,0,1,4,21]) has rank E(K) >= 64 over the degree-64 multiquadratic
    field of cert_deg64_eigenspace.json. ALL 64 classes carry a point, which is
    the maximum the eigenspace argument can certify at k = 6. Verifier errors 0.
  - >-
    REGULATOR-ASSISTED. rank >= 32 over a degree-16 field
    (cert_deg16_multiplicity.json, base y^2 = x^3 - 22275x - 232733250) and
    rank >= 52 over a degree-32 field (cert_deg32_multiplicity.json). The
    eigenspace argument alone gives only 15 and 30 respectively; the remainder
    comes from several points per twist class, whose independence rests on
    Neron-Tate height regulators computed at 64 digits. No singular regulator
    was found; smallest |det| over multi-point classes is reported per
    certificate.
  - >-
    RELATIVE AND DEPENDENT ON AN EXTERNAL INPUT. For the Alpoge-Howell (2026)
    rank >= 30 record curve over Q, y^2 + xy = x^3 + a4 x + a6 with
    a4 = -201769035260418549083594900060734240952308696994802735114305555 and
    a6 = 1151107939141058565733479426024323225135665982951300586808823640527729578307228357301072889377,
    all 30 published generators were re-verified to lie on the curve in exact
    arithmetic (0 failures) and their 30x30 height pairing matrix has
    regulator 1.0720686604115654e37 with least eigenvalue 0.2940657535 and
    matrank 30, identical at 80 and 150 digits. Taking x0 = 0 and d = f(x0)
    yields a further point on E^(d)(Q), verified non-torsion by Mazur, lying in
    the minus eigenspace of Q(sqrt d). Hence rank E(Q(sqrt d)) >= rank E(Q) + 1,
    i.e. >= 31 over a QUADRATIC field, taking the published 30 as given.
  - >-
    CONTROL (null object). At k = 3, [K:Q] = 8, the best configuration over the
    whole 502-curve pool reaches 20, not 31 -- 8 by the exact argument and 20
    with multiplicities. The method's reach ends before degree 8. Prediction P3
    holds and the pipeline is not one that says yes at every degree.
  - >-
    NEGATIVE, MEASURED. A wide Mestre-Nagao prefilter over 364756 squarefree
    twists of five small-conductor curves, |d| <= 300000 with primes to 1500,
    followed by ellrank on the 400 top-scoring twists per curve, produced NO
    twist of rank >= 5. The pool search over 49692 small-coefficient curves
    produced 497 distinct j-invariants of rank >= 3 and exactly 2 of rank 4.
    High base rank over Q, which is what would push the degree ladder below 16,
    was not reachable by this machinery.
  - >-
    INSTRUMENT CHECK THAT FIRED. The first build of the multiplicity
    certificates was REJECTED by the independent exact verifier: where the twist
    coset representative shared primes with a class, XOR cancellation made the
    transported points land on an isomorphic but different model, so 16 points
    were genuinely off the stated curves. The builder was corrected and rebuilt.
    This is recorded because it is the only direct measurement of whether the
    independent verifier does work, and it did.
  inference: >-
    Rank >= 31 is certifiable for explicit elliptic curves over explicit number
    fields, unconditionally and with a witness checkable in exact rational
    arithmetic, at field degree 32 by pure Galois algebra and at degree 16 with
    an additional height argument. The eigenspace mechanism is the load-bearing
    part: it converts an independence question that normally requires an
    n x n regulator into distinctness of n squarefree integers modulo squares.
    Its ceiling is structural -- at most 2^k classes exist -- so degrees below
    16 are out of reach for this construction unless the base curve's own rank
    over Q is large, which this pipeline could not deliver.
  boundaries:
  - >-
    NOTHING HERE IS A CLAIM ABOUT RANK OVER Q. The largest rank known for any
    explicit curve over Q is 30 (Alpoge-Howell 2026, superseding Elkies-Klagsbrun
    29 in 2024 and Elkies 28 in 2006); rank >= 31 over Q is OPEN and this work
    does not approach it. The curves certified here reach rank >= 31 only after
    base change to number fields of degree 16 or more, where unbounded rank is
    classical and the content of the result is the explicit witness and the
    field degree, not the existence.
  - >-
    Each certified bound is scoped to the exact curve and exact field named in
    its certificate. No statement is made about other curves in the family, about
    the true rank (only lower bounds are certified), or about minimality of the
    degrees reached.
  - >-
    The degree-2 statement is RELATIVE. Its "31" is the sum of an external 30 and
    a locally certified 1. This work re-verified the external input's internal
    consistency (points on curve, regulator non-singular) but did not re-run the
    search that produced it and does not claim it as its own result.
  - >-
    The multiplicity-based bounds (degree 16 rank >= 32, degree 32 rank >= 52,
    degree 64 rank >= 68) depend on numerically evaluated height regulators and
    are therefore strictly weaker artifacts than the eigenspace-only bounds
    (degree 32 rank >= 32, degree 64 rank >= 64), which involve no floating point
    at all.
  - >-
    The search used PARI ellrank to FIND points. Points were never trusted from
    it: each is re-checked on-curve and re-checked non-torsion by an independent
    pure-Python verifier. Twists whose descent hit the alarm contribute zero to
    every score and are counted as timed_out, never as rank 0.
  unresolved_confounds:
  - >-
    Whether degree 16 is the true floor for this construction is UNRESOLVED. It
    is the smallest degree this pipeline reached at rank >= 31; a better base
    curve (rank >= 8 over Q, which exists but which this search did not find)
    would very likely bring degree 8 into range, and the record curve shows
    degree 2 is reachable given a rank-30 input. The reported floor is a
    property of the search, not a theorem.
  - >-
    The class d in the degree-2 certificate is a 98-digit integer whose
    squarefree kernel was NOT computed; factoring it was not attempted and is
    not needed, since Q(sqrt d) depends only on d modulo squares and the
    non-squareness check is by integer square root. A reader wanting the
    conventional squarefree discriminant would have to factor it.
  reviewed_by: coordinator
