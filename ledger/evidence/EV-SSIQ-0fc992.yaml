  preregistration_binding:
    specification: experiments/EXP-SSIQ-a85692/specification_v6.yaml
    freeze_commit: 66753c92
    verified_by: TASK-20260806-ff3023
    detail: >-
      specification_v6.yaml frozen 2026-08-06 at commit 66753c92, after
      THREE pre-freeze Red Team review rounds (round 1: DO-NOT-FREEZE,
      three blocking findings including a new GD-12-shaped defect in
      PART B's original basin-accounting convention; round 2:
      DO-NOT-FREEZE again, two new blocking findings found INSIDE the
      round-1 fix's own explanatory text; round 3: FREEZE-WITH-FIXES, no
      blocking defect survived). The Validator independently confirmed
      manifest.yaml's code.commit equals the freeze commit and fully
      re-ran the run script from a clean directory, reproducing every
      output artifact byte-for-byte (true C-REPRO).
  observations:
    - id: O-1
      statement: >-
        GD-12 IS GENUINELY FIXED AT THE CODE LEVEL. descent_walk_hardened.
        greedy_descent_hitting_time_v2 is a bit-identical superset of the
        frozen, unedited descent_hitting_time.greedy_descent_hitting_time
        (confirmed by direct line-by-line comparison, independently, by
        both the Validator and this Coordinator), adding only
        terminal_vertex to every returned dict. The corrected cross-check
        (comparing is_structural_local_min(terminal_vertex), never
        is_structural_local_min(start) as v5's defective version did,
        restricted to trapped:True walks per GD-12's own boundary-
        condition fix) PASSES on all four primes with ZERO disagreements
        across all 1316 trapped=True walks checked -- in direct contrast
        to RUN-SSIQ-a85692-e (v5), whose uncorrected cross-check failed on
        every prime (93/138/234/267 disagreements). The required
        equivalence regression also passes on all 3 constructed inputs
        covering all 3 return branches, including the exact p=2437
        (148,37) case v5's own diagnosis hand-traced, matching its
        predicted terminal_vertex (1617, 1793) exactly.
      supported_by: [TASK-20260806-fea335, TASK-20260806-e3499d, TASK-20260806-ff3023, TASK-20260806-bb916b]
      confidence: high
    - id: O-2
      statement: >-
        THE ZERO-DISAGREEMENT RESULT IS NOT A HOLLOW PASS ON A POPULATION
        OF TRIVIAL 0-STEP SELF-TRAPS -- INDEPENDENTLY CONFIRMED BY THE RED
        TEAM VIA A RECONSTRUCTED WALK-LENGTH DISTRIBUTION, RE-VERIFIED BY
        THIS COORDINATOR DIRECTLY AGAINST THE ARCHIVED RUN DATA. Of the
        1316 total trapped=True walks across four primes, 670 (50.9%) are
        genuine multi-step walks whose terminal vertex differs from their
        start -- not 0-step self-traps (per prime: 84/170 = 49.4% at
        p=2437, 120/234 = 51.3% at p=3889, 216/392 = 55.1% at p=5737,
        250/520 = 48.1% at p=7333). CORRECTION TO RT-BATCH-009's OWN TEXT:
        that report's "Bottom line up front" section states "624 (47.4%)"
        for this total, which is internally inconsistent with its own
        Front-1 table and every other section of the same report (all of
        which correctly state 670/50.9%) -- this Coordinator independently
        recomputed the total directly from
        funnel_structure_diagnostic.json's own sum_basin/n_basin_eligible
        fields (170-86, 234-114, 392-176, 520-270 = 84+120+216+250 = 670)
        before writing this record, and 670/1316 = 50.9% is the value
        used here, not RT-BATCH-009's inconsistent "624/47.4%." These 670
        genuinely-moved cases are EXACTLY the vertices RT-BATCH-008
        (the same reviewer's own prior report) identified as v5's false
        disagreements (93-9=84, 138-18=120, 234-18=216, 267-17=250) --
        an independent arithmetic cross-triangulation that the corrected
        cross-check reconciles the same underlying set of vertices GD-12
        was named against, not a different, easier population.
      supported_by: [TASK-20260806-bb916b]
      confidence: high
    - id: O-3
      statement: >-
        ANOM-1 (depth(m) == 0 for every one of 646 basin-eligible and all
        95/132/194/287 total structural local minima, on all four primes,
        zero exceptions) IS A REAL, CONTROL-CONFIRMED SIGNAL, NOT A
        COARSE-ALPHABET PIGEONHOLE ARTIFACT. The Red Team ran a
        delta_E label-permutation null control the run package itself did
        not perform (30 trials/prime: hold the real, rebuilt graph fixed,
        randomly permute the SAME archived delta_E value multiset across
        its vertices, recompute the depth==0 fraction among local minima)
        and found the null control reproduces only 35-57% depth==0 (mean
        across trials, varies by prime), while the real, unpermuted data
        gives 100% on every prime. THIS COORDINATOR INDEPENDENTLY
        REPRODUCED THIS CONTROL A FIFTH TIME before writing this record
        (15 trials, p=2437, seed 99: real 100% vs. null mean 57.9%,
        range 50.0-69.3% -- consistent with the Red Team's own
        independently-seeded 30-trial result of mean 57.1%, range
        46.6-67.9% for the same prime). If ANOM-1 were purely a pigeonhole
        consequence of a small delta_E alphabet spread over a 3-regular
        graph, the null control would already reproduce ~100%; it does
        not. This is evidence of genuine spatial autocorrelation in how
        delta_E is distributed across the graph -- neighbouring vertices'
        delta_E values cluster far more tightly than a random assignment
        with the same value distribution would produce.
      supported_by: [TASK-20260806-bb916b]
      confidence: high
    - id: O-4
      statement: >-
        THE FUNNEL-STRUCTURE MECHANISM QUESTION DEC-20260806-357b30 NAMED
        AS BATCH-009's SECOND RESUME ACTION IS REFRAMED, NOT ANSWERED OR
        FULLY CLOSED. The REQUIRED CORRELATION (depth vs basin_size) is
        undefined (zero variance in depth) for a STRUCTURAL reason
        confirmed by O-3's control, not by bad luck: this batch's delta_E
        labelling scheme (only 8/11/13/13 distinct integer values per
        prime, CORRECTING execution_report.yaml's own ANOM-1 text, which
        understated this as "8-11" -- p=5737 and p=7333 both have 13,
        independently re-verified by this Coordinator directly against
        raw-result.json) produces universal depth==0 given the graph's
        genuine spatial autocorrelation (O-3). funnel_structure_diagnostic.
        json's own top_decile_concentration measurement (17.1%/16.7%/
        18.1%/18.9% of trapped=True walks captured by the top-decile local
        minima by basin size, per prime -- only mildly above the 10%
        uniform baseline) stands independently of the correlation's
        failure and remains a real, if modest, measurement: it is NOT the
        same claim as "the correlation is undefined," and the two must not
        be blended into a single "no funnel structure" conclusion (per
        RT-BATCH-009 Front 4/OBJ-4(ii)). A future amendment attempting this
        question needs a depth operationalization with demonstrated
        non-degenerate variance at whatever delta_E resolution it runs at
        (e.g. graph-hop distance to the nearest strictly larger-delta
        vertex, or a run at a larger smoothness bound B/X), verified by
        the same null-permutation control (O-3) before being relied on.
      supported_by: [TASK-20260806-bb916b]
      confidence: medium
    - id: O-5
      statement: >-
        TWO SMALL, DISCLOSED NUMERIC SLIPS IN execution_report.yaml's
        ANOM-1 PROSE ARE RECORDED HERE AS CORRECTIONS, NOT APPLIED BY
        EDIT (run records are immutable; RUN-SSIQ-a85692-f's own
        execution_report.yaml stays exactly as archived). (1) "only 8-11
        distinct integer values observed per prime" understates p=5737
        and p=7333, which both have 13 distinct delta_E values, not <=11
        -- the correct counts are 8/11/13/13, independently re-verified by
        this Coordinator directly against raw-result.json (see O-4). (2)
        "all 95/324/478/611-scale local-minimum populations... also show
        depth==0 universally" mislabels three of its own four numbers:
        324/478/611 are p=3889/5737/7333's VERTEX counts, not their
        local-minimum counts -- the correct local-minimum counts are
        132/194/287 (matching DEC-20260806-357b30 D-4's own prior
        41-47%-of-vertices figures: 132/324=40.7%, 194/478=40.6%,
        287/611=47.0%). Neither slip affects ANOM-1's core validity
        (independently reconfirmed four times across the Executor,
        Coordinator, Validator, and Red Team), but both are exactly the
        "trace a producer's own confidence-building prose" pattern this
        campaign's GD-9/PF-8/PF-9 lineage exists to catch -- here caught
        by the Red Team in a run record's own disclosed-but-uncorrected
        prose, and additionally in the Red Team's own report text by this
        Coordinator (see O-2's correction).
      supported_by: [TASK-20260806-bb916b]
      confidence: high
  inference: >-
    GD-12 is closed: the corrected cross-check genuinely and
    non-trivially confirms corrected_equivalence_proof against real
    archived data, independently verified by four separate parties across
    five from-scratch re-derivations (Executor x2, Coordinator, Validator,
    Red Team), and the interesting case (start != terminal) is
    cross-triangulated as exactly the same vertex population v5's broken
    cross-check flagged as false disagreements -- not a different, easier
    subset. PART B ran successfully as specified and surfaced a genuine,
    now control-confirmed empirical anomaly (delta_E's universal local
    ties, O-3) that reframes rather than closes the funnel-structure
    mechanism question: the specific depth operationalization this
    amendment used is structurally uninformative at this delta_E
    resolution, for a real, now-understood reason, not a code defect and
    not evidence against a funnel mechanism. The mild-but-real top-decile
    concentration measurement (O-4) stands on its own, separately from the
    undefined correlation. Nothing in this record bears on H-SSIQ-36e970's
    status or lever L4's viability.
  boundaries:
    - >-
      This run makes NO claim about H-SSIQ-36e970, about a delta_E-
      gradient's existence, or about a p^{1/4} algorithm. Lever L4 is NOT
      retired by this record. "GD-12 is fixed" must not be read as
      progress toward resolving H-SSIQ-36e970's DATA-UNAVAILABLE-BLOCKED
      status (per RT-BATCH-009 Front 4/OBJ-4(i)).
    - >-
      ANOM-1's control-confirmed spatial-autocorrelation signal (O-3)
      concerns UNDIRECTED local clustering of delta_E values and must not
      be read as evidence toward H-SSIQ-36e970's DIRECTIONAL-gradient
      question (greedy vs. random hitting-time efficiency) -- related
      subject matter, not the same test (per RT-BATCH-009 Front 4/
      OBJ-4(iii)).
    - >-
      The mild top-decile concentration measurement (17-19% vs. 10%
      uniform baseline) and the undefined depth/basin-size correlation are
      DIFFERENT claims resting on different evidence and must not be
      blended into one "no funnel structure" conclusion (O-4, per
      RT-BATCH-009 Front 4/OBJ-4(ii)).
    - >-
      Evidence strength capped at preliminary, campaign-wide and
      unchanged by this batch: independence remains session-only.
  unresolved_confounds:
    - >-
      The funnel-structure question is REFRAMED, not resolved: a future
      amendment needs a depth operationalization with demonstrated
      non-degenerate variance at whatever delta_E resolution it runs at
      (O-4), the highest-ranked open question this batch leaves for L4.
    - >-
      The delta_E label-permutation null control (O-3) exists only in
      RT-BATCH-009's own report text and this evidence record's citation
      of it, independently reproduced twice (Red Team, this Coordinator)
      but never itself run as part of an archived Executor task or
      committed as a standalone artifact. A future amendment relying on it
      further should re-run and archive it formally.
    - >-
      Model independence remains absent and unverifiable in this
      environment, unchanged from every prior batch.
