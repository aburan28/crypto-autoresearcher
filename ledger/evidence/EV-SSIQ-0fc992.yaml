  proof_status: empirical_only
  proof_refs:
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-f/corrected_crosscheck.json
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-f/funnel_structure_diagnostic.json
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-f/execution_report.yaml
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-009/reviews/VAL-BATCH-009.md
