  claims_the_red_team_tested_and_withdrew:
    - >-
      The merge resolution. Both main-side blob OIDs (d4dcb845, abee2032) were
      verified byte-identical to this branch's commits 47a684f2 and 3ec55418,
      and 6290e316 is the only main-side commit touching either record.
      Objection withdrawn; NOT a high-severity finding.
    - >-
      The snapshot split. Legitimate, and the BATCH-001 precedent supports it a
