      the batch's weakest analysis.
    - >-
      Corpus provenance. The three filed entries do NOT repeat the phantom
      downloads/ pattern recorded in KN-OPEN-3f7a21; they carry URL, byte count
      and sha256, and the red team exercised the re-acquisition path itself.

  what_this_evidence_does_not_establish:
    - >-
      NOTHING about whether HQC's decoding-failure-rate model is correct.
      Nothing was measured. A17 being unproved is a statement about the
      LITERATURE.
    - >-
      NOT that A17 is false. Its failure direction is explicitly undetermined.
    - >-
      NOT that HQC's security claim is defective. The published DFR was checked
      against the corrected value and is consistent with it.
    - >-
      NOT any statement about HQC's standardized parameter sets beyond the two
      documentation defects recorded in CORR-20260802-3ae664. The toy ceiling
      stands.

