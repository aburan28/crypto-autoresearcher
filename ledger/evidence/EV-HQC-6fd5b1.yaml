  observations:
    - id: O-1
      statement: >-
        RQ-HQC-001.constraints[0] IS NOW DISCHARGED. Three primary sources are
        FILED as KN-LIT entries: KN-LIT-b9e1a8 (HQC specification 22/08/2025,
        citation_verified read), KN-LIT-1c9474 (Aragon-Gaborit-Zemor HQC-RMRS,
        arXiv:2005.10741, read) and KN-LIT-4c1133 (eprint 2026/461, web,
        abstract only). Experiment design is UNBLOCKED for the first time in
        this campaign.
      support: >-
        TASK-20260802-63b16a; provenance levels independently confirmed as
        earned by TASK-20260802-32250e and hard-sampled by TASK-20260802-caddef.
      strength_of_this_observation: verified_by_two_independent_sessions
    - id: O-2
      statement: >-
        The specification's printed RS-S3 minimum distance 49 is wrong; its own
        definitions give 59, on four independent routes. The value 49 IS PRINTED
        IN THE SOURCE, so the BATCH-001 transcription was faithful.
      support: CORR-20260802-3ae664; five byte-identical re-acquisitions across four sessions
      strength_of_this_observation: verified_by_direct_quotation_and_four_derivations
    - id: O-3
      statement: >-
        THE PUBLISHED DFR WAS NOT COMPUTED WITH 49. Table 5 and Table 11 are
        consistent with 59, so the defect is documentation and not a defect in
        HQC's security claim.
      support: TASK-20260802-caddef duty 1, answering a question the Coordinator posed and neither producer had asked
      why_this_matters: >-
        It is the difference between "a standardized specification has a stale
        parameter in a table" and "a standardized algorithm's security claim
        was computed from a wrong value". This program checked, and it is the
        former. Recorded prominently so the 50.7-bit figure is never cited as
        the latter.
    - id: O-4
      statement: >-
        A17 — the assumption that the inner-decoder block failures are i.i.d.,
        so that their sum is Binomial — is stated nowhere and proved nowhere in
        either primary source, and NEITHER SPEC Theorem 6.1 NOR RMRS Theorem 4.3
        IS PROVED AT ALL.
      support: >-
        TASK-20260802-15971b proof search; independently reproduced by
        TASK-20260802-32250e (SPEC occurrences of i.i.d / identically /
        correlat = 0/0/0 over 51 pages; 0 appendices in either document; all
        four Proof tokens in each document resolved, and neither theorem is
        among them).
      robustness: >-
        The negative SURVIVED a vocabulary-robustness control that
        TASK-20260802-caddef ran and the producer had not: memoryless,
        exchangeab*, disjoint, mutually, jointly, pairwise, outer, erroneous all
        return 0 in both documents. This is a SEARCHED negative, not a fatigue
        report.
      scope_limit: >-
        SPEC pp.1-5 were omitted from the producer's "complete location
        inventory" (red team O6). The sweeps covered them and the negative
        survives; the COMPLETENESS CLAIM was false, the RESULT was not.
    - id: O-5
      statement: >-
        A17 is load-bearing: Theorem 6.1 depends on it entirely and is terminal,
        and Table 5's DFR column and Theorem 6.3's (q_RO + q_D)*delta term
        depend transitively. Props 6.1.3/6.1.4 and Table 11 do not.
      support: TASK-20260802-15971b load-bearing trace
    - id: O-6
      statement: >-
        THE DIRECTION OF A17's FAILURE CANNOT BE SIGNED FROM THE PAGE, and the
        obstruction is structural rather than a lack of effort. Two mechanisms
        of opposite sign are both present — latent-mixture common-mode is
        strictly optimistic by Jensen, fixed-weight negative association is
        pessimistic — and the distortion reduces to the joint moment
        mu_{delta_e+1}, NOT to pairwise correlation. Because mu_m is not
        determined by mu_2, SECOND-MOMENT DATA IS STRUCTURALLY INCAPABLE OF
        SIGNING IT, and all published evidence is second-moment.
      support: >-
        TASK-20260802-15971b sensitivity derivation; leading-term shares, log2 K
        and every rho threshold independently recomputed by TASK-20260802-32250e.
      why_this_matters: >-
        This is the batch's strongest result. It converts "we should measure the
        DFR" from a preference into a NECESSITY WITH A NAMED OBSTRUCTION: the
        question cannot be settled by reading, by any amount of further reading,
        or by any second-moment statistic. That is precisely the closure
        standard docs/inventor-protocol.md demands of a negative.

  unexpected_observations:
    - id: U-1
      statement: >-
        A SECOND STALE CROSS-REFERENCE OF THE SAME FAMILY AS THE 49. The
        specification's internal references to Propositions 6.1.3 and 6.1.4 are
        inconsistent, and the resolution — Table 11's printed values are
        numerically 6.1.4's, because Theorem 6.1 with 6.1.3's p_i misses Table
        5's own targets by 5.75 / 6.08 / 12.28 bits while 6.1.4 clears — was
        derived only by the red team.
      discovered_by: TASK-20260802-caddef objection O2, resolving what TASK-20260802-15971b had valued as A19
      recorded_in: CORR-20260802-3ae664 part C

  defects_found_in_this_batch:
    - id: D-1
      severity: high
      found_by: TASK-20260802-caddef objection O1
      statement: >-
        THE A19 RETARGET RECOMMENDATION FAILS ON REASONING WHILE ITS ARITHMETIC
        HOLDS. A19's 10.61 / 7.96 / 16.79 bits is arithmetically correct — the
        red team verified it, calibrating its Prop 6.1.3 implementation against
        RMRS's own published Table 4 — but the bits ARE NOT VALUE. A19 is a
        stale cross-reference, and resolving it moves ZERO published bits.
      consequence: >-
        The campaign is NOT retargeted. See DEC-20260802-9664c6 D-3.
    - id: D-2
      severity: high
      found_by: TASK-20260802-caddef objection O2
      statement: >-
        A SECOND FLAG-WITHOUT-RESOLUTION IS NOW FROZEN IN THE IMMUTABLE CORPUS.
        KN-LIT-b9e1a8 item 3 records the 6.1.3/6.1.4 inconsistency and never
        derives its resolution — verbatim the failure mode this Coordinator
        faulted BATCH-001 for on the 49, committed by the batch that was
        correcting it.
      coordinator_verification: CONFIRMED against the filed entry.
      remedy: >-
        The entry is immutable and is NOT edited. CORR-20260802-3ae664 part C
        supplies the resolution and binds to the entry.
    - id: D-3
      severity: medium-high
      found_by: TASK-20260802-caddef objection O3
      statement: >-
        The claim that "A17 is implied by A5 applied to disjoint blocks" HOLDS
        ONLY ON THE MODEL SPACE (M). On the true space (T) the producer's own
        section 2.1 declares A5's antecedent false, so the implication is
        VACUOUS there — and (T) is the space that matters. BATCH-001 red-team
        objection O10's framing of A17 as a distinct assumption IS THEREFORE NOT
        REFUTED.
      consequence: >-
        The A17 lane keeps its standing. The null control fired, and then the
        red team found the null control itself was applied on the wrong space.
    - id: D-4
      severity: medium
      found_by: TASK-20260802-32250e defect D-1
      statement: >-
        The A17 artifact frozen at 9baa7d87 repeats the FALSIFIED attribution
        ("the transcription's own error") — and it was frozen AFTER the reversal
        had already been committed at a89e7542 and after the Coordinator had
        recorded confirming it from the PDF. No number moves.
      whose_failure: >-
        THE COORDINATOR'S. It confirmed the reversal, then snapshot-froze an
        artifact repeating the falsified claim without flagging it in the
        receipt. Superseded in CORR-20260802-3ae664 part A.
    - id: D-5
      severity: medium
      found_by: TASK-20260802-caddef objections O4, O6, O8, O9, O10
      statement: >-
        A cluster of overstated claims, each corrected rather than softened.
        (i) "A19 is settled by reading, not measuring" names the wrong mechanism
        — arithmetic settles it — and is refuted by two prior sessions that read
        the same sentences. (ii) The producer's "complete location inventory"
        omits SPEC pp.1-5. (iii) The Coordinator's a89e7542 receipt claimed the
        BATCH-002 OPENING COMMIT MESSAGE blamed the transcription; it did not —
        the Coordinator overstated the extent of its own error while correcting
        it. (iv) KN-LIT-b9e1a8's "one exception" undercounts its
        program-derived claims. (v) The A17 section 8 omits SPEC reference [24].
    - id: D-6
      severity: low
      found_by: TASK-20260802-caddef objection O7
      statement: >-
        The BATCH-002 snapshot split left both handoff objective/inputs blocks
        in TASK-20260802-a4f56a still describing a joint two-producer snapshot.
        The archive block and dependencies were amended correctly; the prose was
        not.

