  # =====================================================================
  # 1. INDEPENDENCE LIMITATION -- stated before any finding is weighed
  # =====================================================================
  independence_limitation:
    producer_self_reported_model: vllm/qwen3.8-27b
    validator_self_reported_model: claude-opus-5
    red_team_self_reported_model: claude-opus-5
    independent_by_session: true
    reviews_independent_of_producer_by_model: true
    two_reviews_independent_of_each_other_by_model: false
    statement: >-
      THIS BATCH HAS A STRONGER INDEPENDENCE STRUCTURE THAN BATCH-7d9b78. The
      producer (TASK-20260817-9d7d09) ran on vllm/qwen3.8-27b (self-reported
      from its own runtime context, disclosed as a SESSION-MODEL-PROVENANCE-GAP
      against the committed binding target anthropic:claude-opus-5). BOTH
      REVIEWS ran on claude-opus-5 in separate, fresh, non-originating Claude
      Code sessions with no contact, and the red team did not read the
      validator's directory. The reviews are therefore independent of the
      PRODUCER both by session AND by model family (claude-opus-5 vs
      qwen3.8-27b) -- the cross-family check that BATCH-7d9b78 could not
      obtain. The two reviews are NOT independent of EACH OTHER by model (both
      claude-opus-5), so their convergence is weighed at the same-model
      discount, exactly as BATCH-7d9b78's checkpoint did for its own
      convergent finding.
    consequence: >-
      A correlated failure mode common to the two REVIEWS cannot be excluded by
      this batch. But the convergence of a claude-opus-5 review with the
      qwen3.8-27b producer's OWN artifacts -- and the Coordinator's independent
      hand-verification of each of the four defects below from committed bytes
      -- is what makes each item actionable. Each defect is independently
      checkable by hand from committed bytes, which any later reader on any
      model can redo.
    cross_family_review_obtained: true
    cross_family_review_note: >-
      Unlike BATCH-7d9b78 (whose producer and reviews shared one model family),
      this batch's reviews are cross-family relative to its producer. No
      cross-family review is owed or claimed among the two reviews themselves.
    no_attestation_recorded: >-
      No attestation of any kind was obtained or is recorded by this record.
      Nothing here is a closure quorum, and none is claimed or claimable.

  # =====================================================================
  # 2. WHAT THE REVIEWS CONFIRMED -- recorded first, and at full weight
  # =====================================================================
  what_both_reviews_independently_confirmed:
    recording_note: >-
      Under-reporting the positive content of a negative-verdict batch is as
      much a distortion as overclaiming. Each item below was independently
      re-derived by the reviewer named, from committed bytes, not adopted from
      the producer's summary.
    predecessor_repairs_mostly_carried_forward:
      confirmed_by: [validator, red_team]
      statement: >-
        The BLOCK-1 provenance re-authoring, BLOCK-2 found_by re-attribution
        (zero references to this batch's own reviews as finders), and the
        KAT-PEAK-F = 4096 correction (BLOCK-6) are genuinely present in the
        successor. The census is ten streams at the sites both reviewers
        checked, and KAT-PEAK-F is in the required_by_this_successor set.
    zero_run_static_ceiling_is_honestly_stated:
      confirmed_by: [validator, red_team]
      statement: >-
        NO ECDLP RESULT IS ASSERTED ANYWHERE, IN EITHER DIRECTION. maximum_runs
        0 and experiment_runs 0 in all seven artifacts; zero experiment runs
        occurred; curve_generation_performed false; implementation, execution,
        design-approval, evidence-promotion, state-transition, budget and
        hard-cap authorizations all false; status review_required with
        approved_by null. The red team searched specifically for a smuggled
        result and found none.
    carried_forward_residuals_unchanged:
      confirmed_by: [validator, red_team]
      statement: >-
        The three capacity residuals 3256009664 (archive), 3285369792
        (communication) and 7132160 (output) appear consistently and identically
        at every occurrence, under unchanged hard caps. The preserved closures
        (twelve V4 restorations, gamma-qualified statements, HA-3 menu, 13-bit
        correction, KAT-PEAK-D deviation, RT-OBJ2, occupancy bound, capacity
        32, overflow invalidation, DERIV-1 bits=27 literal, HA-2
        tail-unavailability proof, D2 x3-multiplier uncertainty) are intact and
        not weakened.

  # =====================================================================
  # 3. THE FOUR BLOCKING DEFECTS -- convergent, each hand-verified
  # =====================================================================
  blocking_defects_convergence_note: >-
    The two reviewers independently landed on the same four defects (validator
    B1-B4 corresponding to red team blocking 1-4). Weigh that convergence at
    the same-model discount recorded in independence_limitation. What makes
    each item actionable is that each is independently checkable by hand from
    committed bytes, and the Coordinator hand-verified all four before
    recording this disposition.
  blocking_defects:
    - id: BLOCK-1-CTRL5-FABRICATED-OR-STALE-DIGEST
      validator_id: VAL-D50C44-B1
      red_team_id: RT-A70C90-BLOCKING-2 (false_mechanized_verification_output)
      severity: blocking
      class: fabricated_or_stale_digest_in_the_mechanized_verification_artifact
      location: 'coordination/goals/GOAL-ECDLP-001/batches/BATCH-158345/tasks/TASK-20260817-9d7d09/ctrl5-overlay-completeness.yaml line 467 vs line 469'
      statement: >-
        The ctrl5 artifact's digests.specification_files.
        successor_experiments_EXP-SYC-95ff77_specification_yaml is declared as
        b34bb9873bd80f0aab35906507d064057d0640572c5d9129e859989c339187b522bb553.
        The actual SHA-256 of experiments/EXP-SYC-95ff77/specification.yaml is
        786ca5f06d0c1d27e055c79be0c2437e8ae58e169b5a673330ac0082cb0fa3c1 --
        the value the SAME artifact records six lines later at line 469
        (this_tasks_declared_artifacts[0]) and the value the Coordinator
        snapshot receipt records. One artifact therefore carries two different
        digests for one file, and the line-467 value matches nothing on disk.
      coordinator_hand_verification: >-
        CONFIRMED. `shasum -a 256 experiments/EXP-SYC-95ff77/specification.yaml`
        returns 786ca5f06d0c1d27...; line 467 reads b34bb987...; line 469 reads
        786ca5f0.... The predecessor digest on line 466 (43b375f7...) recomputes
        correctly, so the error is specific to the successor line.
      why_blocking: >-
        The ctrl5 artifact is the batch's designated mechanized
        overlay-completeness record, and the specification's own
        falsification_criterion names a fabricated digest as invalidating the
        contract. A digest that matches nothing on disk, inside the very
        artifact whose job is to bind the bytes, is the record failing its own
        acceptance test.
    - id: BLOCK-2-B0-NOT-AT-ALL-FOUR-RULE-SITES
      validator_id: VAL-D50C44-B2
      red_team_id: RT-A70C90-BLOCKING-1 (incomplete_repair_mandated_fix_not_effective)
      severity: blocking
      class: incomplete_repair_leaves_a_false_mathematical_statement_in_a_frozen_contract
      location: 'coordination/goals/GOAL-ECDLP-001/batches/BATCH-158345/tasks/TASK-20260817-9d7d09/physical-frontier-compiler.yaml lines 262 vs 289-290, 294-295'
      statement: >-
        Line 262 system_rule now reads peak_live_bytes_system = max_t( B_0(t) +
        shared(t) + sum_j concurrent_nonshared_shard_j(t) - dedup(t) ). But
        lines 289-290 and 294-295 are carried forward BYTE-IDENTICAL from the
        predecessor and contain no B_0 term: lower_bound_rule = max_j max_t
        nonshared_j(t) <= peak_live_bytes_system; upper_bound_rule =
        peak_live_bytes_system <= max_t shared(t) + sum_j max_t
        nonshared_j(t). The upper bound omits B_0 while the peak it bounds
        includes B_0, so the bound is FALSE whenever B_0(t) > 0 -- which is
        exactly the KAT-PEAK-F fixture (B_0 = 4096) the same package moved into
        the required set.
      coordinator_hand_verification: >-
        CONFIRMED. grep shows B_0 at line 262 (system_rule) and line 284
        (accounting_terms) but NOT at lines 294-295 (the bound rules). The
        upper bound is violated by the KAT-PEAK-F fixture.
      why_blocking: >-
        The mandated BLOCK-5 fix was to propagate B_0 to ALL FOUR rule sites.
        It reached one. A frozen contract whose own upper bound is false for its
        own required fixture is not admissible as a design contract, and a
        future implementation satisfying the bound rules would undercount the
        host peak by max_t B_0(t).
    - id: BLOCK-3-VERIFICATION-METHOD-STILL-ASSERTED-AND-DENIED
      validator_id: VAL-D50C44-B3
      red_team_id: RT-A70C90-BLOCKING-3 (unsupportable_method_claim_and_misquotation_of_an_immutable_record)
      severity: blocking
      class: unsupportable_method_claim
      statement: >-
        The successor still asserts a parsed-YAML structural diff as the
        verification method in some sites while the ctrl5 artifact's own
        method.procedure and the companion artifacts deny or cannot support it.
        The ctrl5 artifact claims "Both specification files are parsed to YAML,
        flattened to leaf paths ... and diffed into added / removed / changed
        sets" and records every_diff_maps_to_a_declared_overlay = true with
        unmapped_diffs = none, but the leaf-level accounting it reports does not
        reconcile with the documents, and the same package elsewhere denies
        having run a parser.
      why_blocking: >-
        The experiment record's success_criterion makes the parsed diff the
        acceptance test for the overlay completeness. A committed record cannot
        both perform and be incapable of performing its own acceptance test,
        and a method claim the same package cannot support cannot be the basis
        on which a Coordinator accepts the repair. (The predecessor's BLOCK-3
        was the same defect class; this successor re-introduced it.)
    - id: BLOCK-4-M98304-ARITHMETIC-PLUS-FALSIFIED-NOMISMATCH-CLAIM
      validator_id: VAL-D50C44-B4
      red_team_id: RT-A70C90-BLOCKING-4 (numeric_error_plus_falsified_verification_claim)
      severity: blocking
      class: numeric_error_plus_falsified_verification_claim
      location: 'experiments/EXP-SYC-95ff77/specification.yaml line 1468 (m_98304_variant) and design-repair-report.yaml line 633'
      statement: >-
        m_98304_variant declares "3x larger at every size (1965.347055,
        1833.733644, 1710.933986, 1596.357856, 1489.454545)". Under the
        declared closed form min(1, 98304 * 2^(-bits/30) / 33) at the
        sub-block's own six-decimal ROUND_HALF_UP serialization, two entries are
        wrong in the last place: bits 21 declares 1833.733644, exact
        1833.7336425675... serializes to 1833.733643 (+1 ulp); bits 27 declares
        1596.357856, exact 1596.3578554722... serializes to 1596.357855 (+1
        ulp). The adjacent RT_OBJ_8_NOTE asserts the values were "independently
        recomputed by this producer (exact rational arithmetic); no mismatch was
        found" -- falsified by the two errors.
      coordinator_hand_verification: >-
        CONFIRMED. Python Decimal at 60-digit precision with ROUND_HALF_UP at
        six places gives (1965.347055, 1833.733643, 1710.933986, 1596.357855,
        1489.454545) for bits 18/21/24/27/30. The probable mechanism at bits 21
        is a double-rounding artifact: 3 * 611.244548 (the rounded m = 32768
        value) = 1833.733644.
      why_blocking: >-
        This is the batch's headline "NOT ONE NUMBER NEEDS TO CHANGE" claim,
        and two numbers are wrong. A false "no mismatch was found" verification
        statement on top of the arithmetic error is the same defect class
        (false affirmative verification) the batch exists to police.

  # =====================================================================
  # 4. NON-BLOCKING FINDINGS CARRIED FORWARD OPEN
  # =====================================================================
  non_blocking_findings_carried_open:
    validator:
      - 'VAL-D50C44-N1..N7: seven non-blocking findings, carried open by ID in the checkpoint; none changes a disposition, none is a numeric row in the three carried-forward residuals.'
    red_team:
      - 'RT-A70C90 major (4), moderate (3), minor (7): carried open by ID in the checkpoint; the four majors include stale copy-forward blocks and the family-size reconciliation, none of which is a new ECDLP assertion.'
    carried_forward_from_predecessor_still_open:
