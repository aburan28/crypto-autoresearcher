        status: open_non_blocking_deferred
      - id: RT-OBJ4
        status: open_non_blocking_deferred
      - id: PEAK-AGGREGATE-FIT-UNPROVED
        status: open
        note: 'BLOCK-2 WIDENS the quantity being fitted by max_t B_0 without the record disclosing that its own repair did so; the fit against the 2 GB host ceiling remains unproved.'

  # =====================================================================
  # 5. THE RESIDUALS -- carried forward exactly, closed by nothing
  # =====================================================================
  capacity_residuals_carried_forward_exactly:
    status: open_not_repaired_correctly_disclosed
    archive_over_cap_bytes: 3256009664
    communication_over_cap_bytes: 3285369792
    output_over_cap_bytes: 7132160
    caps_unchanged: true
    no_cap_raised: true
    closable_only_by: >-
      a Coordinator-authorised cap amendment or scope reduction recorded as a
