      claimed none.

  # =====================================================================
  # 6. BOUNDARIES
  # =====================================================================
  boundaries:
    - 'ZERO EXPERIMENT RUNS EXIST. This is a static package review at the zero-run ceiling and nothing in it is empirical evidence of any kind.'
    - 'NOTHING HERE BEARS ON H-SYC-b854f4 OR ON ECDLP, IN EITHER DIRECTION. Every finding is about paperwork: a digest that matches nothing, a bound that omits a term its own fixture exercises, a method claim the package cannot support, and two last-place arithmetic errors. Both reviews state this in their own words and neither asserts any mathematical negative or positive about the hypothesis.'
    - 'A REVISE verdict means the receipt is not yet admissible as evidence because of record-integrity defects. It is not a mathematical result, and per AGENTS.md rule 3 apparatus, capacity, provenance, cap and budget residuals are never evidence against a mathematical hypothesis.'
    - 'Toy 18/21/24/27/30-bit ladder with 32 curves, 256 roots, 4 public models, 3 eta strata, capacity 32 and U8 width. transfer_authorized is false and cryptographic_scale_claim is forbidden in the reviewed scope.'
    - 'Pollard rho at about 0.886*sqrt(N) group operations and standard BSGS remain the unchallenged program baselines. Nothing in this batch challenges, approaches, or comments on them.'
    - 'The verdicts bind to the bytes at 3d9e8eb18421c772a5fce134df7fdcd0fe704d30 and to nothing later.'
