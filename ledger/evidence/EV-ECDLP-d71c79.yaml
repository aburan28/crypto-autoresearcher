  hypothesis_id_note: >-
    Neutral zero-run static design-review evidence about the ARTIFACT
    EXP-SYC-95ff77 only. It neither supports nor weakens H-SYC-b854f4, and it
    says nothing whatever about ECDLP, about any elliptic curve, or about any
    scale beyond the frozen toy ladder of 18, 21, 24, 27 and 30 bits. The
    hypothesis_id field records which record the artifact belongs to, not a
    direction on it.
  experiment_ids: [EXP-SYC-95ff77]
  run_ids: []
  run_ids_note: >-
    EMPTY BY CONSTRUCTION, NOT BY OMISSION. EXP-SYC-95ff77 declares
    maximum_runs 0 and experiment_runs 0; zero experiment runs occurred in this
    batch; no run record, seed stream, curve, target, fixture execution, or
    measurement of any kind exists anywhere in the reviewed set. Both
    independent reviews confirmed this separately.
  type: pre_implementation_design_review
  type_note: >-
    Same value as the direct predecessors EV-ECDLP-96bf56, EV-ECDLP-cb151c and
    EV-ECDLP-56cf10 in this same chain. It is not one of the three template
    values (empirical | theoretical | literature) because none of them
    describes a zero-run review of a static contract; the chain's established
    value is reused rather than a new one invented.
  direction: neutral
  strength: inconclusive
  claim_tier: toy
  certificate_refs: []
  certificate_refs_note: 'No solve, relation, or measurement is claimed, so no run certificate is owed or offered.'
  proof_status: not_applicable
  proof_status_note: >-
    No adverse transition of any hypothesis rests on this record. The
    disposition is `revise` on an artifact, not `weaken` or `reject_scoped` on
    a theory, so no hypothesis-level refutation artifact is owed and none is
    claimed. Both reviews nonetheless produced DERIVATION-GRADE refutation
    artifacts against CLAUSES OF THE ARTIFACT UNDER REVIEW, each checkable by
    hand with zero execution: (a) the ctrl5 overlay-completeness artifact
    carries two different SHA-256 digests for the same file (line 467
    b34bb987... vs line 469 and the snapshot receipt 786ca5f0...), the former
    matching nothing on disk; (b) the physical-frontier-compiler upper_bound_rule
    omits the B_0 term that its own system_rule includes, so the bound is false
    for the KAT-PEAK-F fixture (B_0 = 4096 > 0); (c) two m_98304_variant
    literals are wrong by one unit in the last place under the record's own
    declared closed form and six-decimal serialization. These are statements
    about sentences, digests and paths inside EXP-SYC-95ff77, never about
    H-SYC-b854f4, which is why proof_status stays not_applicable at the
    hypothesis level.
  proof_refs:
    - experiments/EXP-SYC-95ff77/specification.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-158345/tasks/TASK-20260817-9d7d09/design-repair-report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-158345/tasks/TASK-20260817-9d7d09/verification-and-null-kats.yaml
