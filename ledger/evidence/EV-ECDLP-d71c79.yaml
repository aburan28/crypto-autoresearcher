    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-158345/red-team/TASK-20260817-a70c90/runtime-session-receipt.json
  obstruction_note: >-
    No obstruction block is recorded and none is owed. Direction is neutral, no
    lane is closed, no hypothesis or experiment status moves, and zero runs
    exist, so there is no measured quantity over a stated scope that a later
    reader could reuse or invert. The obstruction that DOES exist in this lane
