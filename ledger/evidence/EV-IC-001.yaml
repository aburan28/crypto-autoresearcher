evidence:
  id: EV-IC-001
  hypothesis_id: H-IC-001
  experiment_ids:
    - EXP-IC-001
  run_ids: []
  type: empirical
  direction: supports
  strength: preliminary
  claim_tier: toy
  certificate_refs:
    - kind: none
      note: >-
        All 480 decomposition runs found no decompositions (B^2/N << 1 at
        bits >= 12); certificate kind=none, verified=true.
    - kind: discrete_log
      note: >-
        All 24 rho baselines solved with verified discrete-log certificates
        (verifier: independent-recompute). Rho now reports total_group_operations
        (ALL group ops: precompute + walk + verify) fixing the v1 calibration bias.
  proof_status: empirical_only
  proof_refs:
    - experiments/EXP-IC-001/analysis.md
  observations:
    - >-
      528 runs (24 precompute, 24 rho, 240 fixed, 240 naive), all completed_valid,
      dirty: false, at commit 5cae8198. Bit sizes 8/12/16/20/24/28/32/36, seeds
      1/2/3, B=14, m=2, K=10 targets, sympy Groebner, Python 3.13.1, macOS arm64.
    - >-
      T_desc in group-op equivalents (median Groebner seconds × total_group_ops
      / wall_seconds) is ~32,000-55,000 across all bit sizes. Groebner wall-time
      is ~0.04s and the calibration factor is ~1M group_ops/second.
    - >-
      T_desc/sqrt(N) ratio decreases monotonically: 10,055 (8-bit) → 6,681
      (12-bit) → 4,528 (16-bit) → 1,121 (20-bit) → 1,741 (24-bit) → 237
      (28-bit) → 113 (32-bit) → 32 (36-bit). This confirms H-IC-001's prediction
      that the ratio decreases with bit size.
    - >-
      1/24 instances has K* finite: seed 2 at 36-bit, ratio=0.1743, K*=~509M.
      This instance has N ~ 3.4×10^10 (sqrt(N) ~ 184K) >> T_desc ~ 32K.
    - >-
      The success criterion (T_desc < sqrt(N) for >= 2/3 seeds at any bit size)
      is NOT met. The falsification criterion (all K* = infinity) is also NOT
      met. The result is inconclusive but trending toward the hypothesis.
    - >-
      The critical threshold is sqrt(N) ~ 40K, requiring N > 1.6×10^9 (bit
      sizes > ~31). At 36-bit, only 1/3 seeds has N large enough due to
      Hasse-bound variation in #E(F_p)'s largest prime factor.
  inference: >-
    The evidence partially supports H-IC-001: the T_desc/sqrt(N) ratio decreases
    monotonically as predicted, and one instance at 36-bit has finite K*. However,
    the success criterion (>= 2/3 seeds) is not met. The result is inconclusive:
    more seeds at 36-bit or larger bit sizes would likely push more instances
    below the threshold. The result is implementation-bound (sympy vs Python rho).
  boundaries:
    - Toy scale only (max 36 bits); implementation-bound (sympy Buchberger vs
      Python rho on macOS arm64). A faster Groebner implementation would lower
      T_desc_gops, shifting the crossover to smaller bit sizes.
    - B=14, m=2 only; all Groebner solves return trivial ideals (no decompositions
      found). Cost for non-trivial systems may differ.
    - The S_rel heuristic (N/B)*T_desc is not directly measured at bits >= 16
      where no relations are found.
    - The Hasse-bound variation in N means some 36-bit instances have N too
      small for the crossover; more seeds would help.
  unresolved_confounds:
    - The calibration factor (~1M group_ops/sec) is dominated by Python overhead
      in both rho and sympy; a C implementation of either would change the
      crossover point.
    - T_desc on trivial ideals (no solution) may not represent cost for
      non-trivial Groebner systems.
    - Only 3 seeds at 36-bit; the variance in N across seeds is large
      (sqrt(N) ranges from 355 to 184K at 36-bit).
  reviewed_by: coordinator
