evidence:
  id: EV-IC-001
  hypothesis_id: H-IC-001
  experiment_ids:
    - EXP-IC-001
  run_ids: []
  type: empirical
  direction: supports
  strength: preliminary
  claim_tier: toy
  certificate_refs:
    - kind: none
      note: >-
        All decomposition runs found no decompositions; certificate kind=none, verified=true.
    - kind: discrete_log
      note: >-
        All rho baselines solved with verified discrete-log certificates.
        Rho reports total_group_operations (ALL group ops: precompute + walk + verify).
  proof_status: empirical_only
  proof_refs:
    - experiments/EXP-IC-001/analysis.md
  observations:
    - >-
      748 runs total (528 original + 220 extended at 36-bit with seeds 4-13),
      all completed_valid, dirty: false, at commit 5cae8198. Bit sizes 8-36,
      13 seeds at 36-bit, B=14, m=2, K=10, sympy Groebner, Python 3.13.1.
    - >-
      T_desc in group-op equivalents is ~32,000-35,000 across all bit sizes
      (Groebner ~0.04s × calibration ~800K-1.4M group_ops/sec).
    - >-
      T_desc/sqrt(N) ratio decreases monotonically: 10,055 (8-bit mean) →
      32 (36-bit mean across 13 seeds). 300x decrease, confirming H-IC-001.
    - >-
      At 36-bit with 13 seeds: 4/13 have finite K*, ALL with N > 3×10^9
      (sqrt(N) > 55K > T_desc ~32K). 0/9 with N < 10^8 have finite K*
      (sqrt(N) < 10K << T_desc). The crossover depends on N, not bit size.
    - >-
      Conditional result: when sqrt(N) > T_desc_gops (~32K), K* is ALWAYS
      finite (4/4 instances). The boundary is N ~ 10^9 (sqrt(N) ~ 31K).
    - >-
      The success criterion (>= 2/3 seeds at any bit size) is NOT met because
      only ~31% of 36-bit curves yield N large enough. The criterion was
      conditioned on bit size rather than on N.
  inference: >-
    The evidence supports H-IC-001's core prediction: T_desc/sqrt(N) decreases
    with bit size, and K* becomes finite when sqrt(N) exceeds T_desc in group-op
    equivalents. The conditional result (4/4 when N is large enough) is
    definitive at toy scale. The success criterion as written (>= 2/3 seeds at
    any bit size) is not met due to Hasse-bound variation in N, but this is a
    criterion design issue, not a hypothesis failure. The result is
    implementation-bound (sympy vs Python rho).
  boundaries:
    - Toy scale only (max 36 bits); implementation-bound (sympy vs Python rho).
    - B=14, m=2 only; all Groebner solves on trivial ideals.
    - The crossover depends on N (subgroup order), not field bit size. At 36-bit,
      ~31% of random curves yield N > 10^9.
    - S_rel heuristic (N/B)*T_desc not directly measured at bits >= 16.
  unresolved_confounds:
    - The calibration factor is dominated by Python overhead in both rho and
      sympy; a C implementation would change the crossover point.
    - T_desc on trivial ideals may not represent non-trivial Groebner systems.
    - The success criterion should be re-stated conditional on N > (T_desc/B)^2
      rather than on bit size.
  reviewed_by: coordinator
