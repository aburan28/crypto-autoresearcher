evidence:
  id: EV-IC-001
  hypothesis_id: H-IC-001
  experiment_ids:
    - EXP-IC-001
  run_ids: []
  type: empirical
  direction: supports
  strength: preliminary
  claim_tier: toy
  certificate_refs:
    - kind: none
      note: >-
        All decomposition runs found no decompositions; certificate kind=none, verified=true.
    - kind: discrete_log
      note: >-
        All rho baselines solved with verified discrete-log certificates.
        Rho reports total_group_operations (ALL group ops: precompute + walk + verify).
  proof_status: empirical_only
  proof_refs:
    - experiments/EXP-IC-001/analysis.md
  observations:
    - >-
      748 runs total (528 original at 8-36 bit + 220 extended at 36-bit with
      seeds 4-13), all completed_valid, dirty: false, at commit 5cae8198.
      B=14, m=2, K=10, sympy Groebner, Python 3.13.1, macOS arm64.
    - >-
      T_desc in group-op equivalents is ~32,000-35,000 across all bit sizes
      (Groebner ~0.04s × calibration ~800K-1.4M group_ops/sec).
    - >-
      T_desc/sqrt(N) ratio decreases monotonically: 10,055 (8-bit mean) →
      32 (36-bit mean across 13 seeds). 300x decrease, confirming H-IC-001.
    - >-
      At 36-bit with 13 seeds: 4/13 have finite K*, ALL with N > 3×10^9
      (sqrt(N) > 55K > T_desc ~32K). 9/9 with N < 10^8 have K* = infinity
      (sqrt(N) < 10K << T_desc). The crossover boundary is N ~ 10^9.
    - >-
      REVISED SUCCESS CRITERION (v3): "K* finite for >= 2/3 of instances
      where sqrt(N) > T_desc_gops." Result: 4/4 instances with sqrt(N) >
      T_desc have finite K*. This is 4/4 = 100% >> 2/3 threshold.
      SUCCESS CRITERION MET.
    - >-
      REVISED FALSIFICATION CRITERION (v3): "K* = infinity for ALL instances
      where sqrt(N) > T_desc_gops." Result: 0/4 instances with sqrt(N) >
      T_desc have K* = infinity. FALSIFICATION CRITERION NOT MET.
  inference: >-
    The evidence supports H-IC-001 under the revised (v3) success criterion:
    K* is finite for 4/4 instances where sqrt(N) > T_desc_gops (100% >> 2/3
    threshold). The T_desc/sqrt(N) ratio decreases monotonically (300x across
    8-36 bits) as predicted. The crossover boundary is sharp at N ~ 10^9
    (sqrt(N) ~ 32K ≈ T_desc in group-op equivalents). The result is
    implementation-bound (sympy Buchberger vs Python rho on macOS arm64).
  boundaries:
    - Toy scale only (max 36 bits); implementation-bound (sympy vs Python rho).
    - B=14, m=2 only; all Groebner solves on trivial ideals (no decompositions).
    - The crossover depends on N (subgroup order), not field bit size. At 36-bit,
      ~31% of random curves yield N > 10^9.
    - S_rel heuristic (N/B)*T_desc not directly measured at bits >= 16.
    - The v3 criterion revision was prompted by the v2 criterion's failure to
      account for Hasse-bound N variation; the revision is documented in
      amendments/v2_to_v3.yaml.
  unresolved_confounds:
    - The calibration factor is dominated by Python overhead in both rho and
      sympy; a C implementation would change the crossover point.
    - T_desc on trivial ideals may not represent non-trivial Groebner systems.
    - Only 4 instances satisfy sqrt(N) > T_desc; more would strengthen the
      result toward replicated/strong.
  reviewed_by: coordinator
