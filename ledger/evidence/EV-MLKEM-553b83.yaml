  inference: >-
    Approximation 4.9's region measure, instantiated exactly, reproduces the
    archived whole-band survival shape to within about 1.06 to 1.13 times the
    counting-noise floor using a single normalisation parameter. The whole-band
    misfit this program reported for three batches was a property of its own
    Gaussian-Phi surrogate. What survives the substitution is a systematic
    S-shaped shape error concentrated in the well-measured count>=1000 sub-band,
    at 13x to 26x the floor depending on floor protocol and parameter count,
    with lag-1 autocorrelation 0.99907. That residual is now a characterised
    object rather than an unexplained ratio.

  boundaries:
    - >-
      Two archived toy-dimension files (q=241, m=40, n=43 and n=50); resolved
      band only, which reaches about 15 percent of the operating threshold; raw
      undivided score scale; one fitted normalisation, so shape only and no
      absolute-level test.
    - >-
      Establishes NOTHING about ML-KEM security in either direction, nothing
      about Carrier et al.'s Kyber cost figures, and nothing about Table 5.1.
    - >-
      Not a validation of Approximation 4.9. A one-parameter shape fit at
      1.06-1.13x the counting floor on two toy curves is compatible with the
      approximation being right and does not establish it.
    - >-
      One implementation plus one independent validator. No red-team pass on
      this batch, no replication. Four claims the validator could not check for
      budget reasons.

