  what_this_evidence_is: >-
    The first instantiation in this program of the object it has been naming
    since BATCH-009: the exact region measure built from source equations
    (4.10), (4.11) and (4.24), fitted against the archived measurement and
    compared to BATCH-009's Gaussian-Phi surrogate. Zero new sampling.

  observations:
    - >-
      P-1 (ESTABLISHED, and it is POSITIVE). The exact region measure fits the
      whole band far better than the surrogate, WITH ONE FEWER FREE PARAMETER
      and its exponent frozen at whatever (4.10)/(4.11)/(4.24) imply. rms as a
      multiple of the counting-noise floor: surrogate at its own exponent 2.07x
      (n=43) and 2.13x (n=50); surrogate best-over-p 1.25x and 1.30x; exact model
      1.04x and 0.97x on the published floor. The validator reproduced the exact
      model by an independent implementation -- Upsilon via Poisson's integral
      rather than a series, no Decimal, different quadrature -- obtaining
      0.355665 and 0.317216 against the producer's 0.355665 and 0.317217, and
      matching all eight M2 cells, both M4 cells and every log2 A to five
      decimals.
    - >-
      P-2 (ESTABLISHED, and it CORRECTS THREE BATCHES OF THIS PROGRAM'S OWN
      WORK). The one-fewer-parameter claim is confirmed and strengthened: two
      structurally different second parameters, F(A*G^s) and F(A*G*v^c), each
      select their null value EXACTLY on the whole band and buy nothing. So the
      whole-band misfit that BATCH-009, BATCH-010 and BATCH-011 recorded really
      was a property of the SURROGATE, not of Approximation 4.9's region measure.
      That is recorded here as plainly as any adverse finding in this goal.
    - >-
      P-3 (SUPERSEDES the word "CLOSED"; validator D-1, moderate). Survival
      counts are CUMULATIVE, so the counting residual is a Brownian motion in
      1/lambda rather than white noise. The published floor is the zero-free-
      parameter floor, but every rms here profiles a normalisation, which removes
      6 to 11 percent of a Brownian residual. Protocol-correct floors are about
      0.314 and 0.300, moving the exact model to 1.13x and 1.06x and the
      count>=1000 figures to 26.3x and 26.2x. All models move by the same factor
      so NO COMPARISON CHANGES, but "closed" and "at the floor" are not
      supported, and ANOM-4 DISSOLVES ENTIRELY: nothing sits below its floor. The
      Coordinator recomputed the ratio shift.
    - >-
      P-4 (ESTABLISHED, SURVIVES, and is STRENGTHENED). The count>=1000 misfit is
      NOT an artifact of the Gaussian-Phi substitution. Surrogate 16.5x and
      24.8x; exact model 23.9x and 23.4x with its exponent frozen, or 13.2x and
      20.1x at matched parameter count. Both attacks on this comparison failed:
      scanning p from 8 to 32 puts the surrogate's count>=1000 optimum genuinely
      INTERIOR at p about 20 (rms 0.2419), so 16.5x is real and not a grid-edge
      artifact; and an alternative two-parameter embedding reaches 13.57x against
      M3's 13.23x, so the matched-count construction does not flatter the exact
      model.
    - >-
      P-5 (THE MISFIT IS NOW CHARACTERISED). ANOM-8's systematic S-shaped
      residual is exactly what the count>=1000 ratio measures: residual lag-1
      autocorrelation 0.99907, high-frequency content 0.00074 bits against a
      0.3498-bit level, and refitting on the sub-band moves it by 0.0004 bits.
      Pure systematic shape error, not noise. The validator ran a
      polynomial-baseline achievability check and then DECLINED TO USE IT, on the
      ground that Brownian noise puts about 99.6 percent of its energy in its
      first twelve Karhunen-Loeve modes so the baseline is not an achievability
      argument. That refusal is recorded because it is the correct call.
    - >-
      P-6 (THE COUNTING FLOOR IS RIGHT, on three independent computations). The
      validator derived it from scratch with its own Poisson window, its own
      branch switch at 2e5 and a three-term asymptotic 1/lambda + (7/4)/lambda^2
      + 4/lambda^3 it derived itself, and reproduced EVERY published digit of
      both columns: whole band 0.340570 and 0.327569; count>=10 0.163689 and
      0.155755; count>=1000 0.014627 and 0.015192; count>=1e5 0.001072 and
      0.001357. C_T = value * nb_iteration * q^k_fft is exact to 1.36e-16 and
      1.82e-16; the C>=1 conditioning is right; the branch switch costs at most
      4e-10. Plug-in lambda is defensible: smoothing moves the floor by at most
      0.44 percent and DOWNWARD. An over-dispersion control the package did not
      run gives phi = 0.92 to 1.22 against 1.0 for Poisson.
    - >-
      P-7 (STRUCK, validator D-2, moderate). report.md section 3.2's claim that
      "the rms value at the edge is not scan-limited, only the argmin location"
      is FALSE. At count>=1e5 the rms falls from 0.1899 at the p=20 grid edge to
      0.0713 at p=15, a factor of 2.66. Table 3.4's "177x -> 61.4x" is therefore
      a tie, 66.5x against 61.4x, and MUST BE STRUCK. The count>=1000 verdict is
      unaffected.
    - >-
      P-8 (ANOM-1 CONTAINED; BATCH-010 GENUINELY UNAFFECTED). A Gauss-Legendre
      node-ordering bug made the kernel's kept set non-contiguous for T > 1612,
      worth up to 0.44 bits in the deep tail and inflating whole-band rms from
      0.355665 to 0.369045. It was caught BY A CONTROL that aborted attempt 2,
      not by inspection, and the superseded value is recorded rather than
      deleted. The validator confirmed the fix is correct -- a global sort in u
      makes the kept set an interval, hence contiguous -- and that the assertion
      tests exactly that per score. Crucially it confirmed STRUCTURALLY that
      BATCH-010 cannot express the defect: exponent_neighbourhood_scan.py
      addresses the full band per node with no slice arithmetic, and
      jensen_bias_bound.py uses order-independent zip. BATCH-010's 0.705494 is
      corroborated at 0.705502.
    - >-
      P-9 (SMALLER DEFECTS, recorded). D-3: the envelope_dominates_last_lobe
      truncation control is FALSE for both Upsilon_a and Upsilon_b in both files
      and report.md states its numbers as bounds anyway; the validator enlarged
      the grids and confirmed the conclusion survives, G(v) unchanged in double
      precision to v=14. D-4: two peak-RSS values in one package. D-5: the
      count>=1000 "every digit" agreement compares the red team's delta-method
      value to the producer's truncated-Poisson value. D-6: DEV-1, no impact --
      the validator ran --mode floor from the commit and reproduced all eight
      values. D-7: DEV-2 and model_verified false. D-8: ANOM-4's reason (i) is
      under 0.5 percent and has the wrong sign.
    - >-
      P-10 (COORDINATOR PREMISE FALSIFIED, third time in this goal). The
      dispatch message asserted PDF page 20 was among the archived extracts. It
      is not: the set holds pages 23, 25, 26, 27 and 37 only, confirmed directly
      by the Coordinator. The handoff body was correct. (4.10) and (4.11) were
      read from the read-only vendored PDF with its sha256 verified.
    - >-
      P-11 (RT-10 NARROWED). alpha has no locus in (4.10), (4.11), (4.22),
      (4.23) or (4.24); every alpha on page 23 sits inside (4.19), the GOOD-guess
      threshold. alpha = 2 changes no number in the wrong-guess chain, so the
      alpha identification is not load-bearing for this check.

