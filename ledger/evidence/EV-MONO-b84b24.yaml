        recalibration shows ~65% empirical false-positive rate at m=4 for
        the pre-registered band at n=30 null draws; raising draws to 200
        flips the one escalated cell's label; a null-object control shows
        a reproducible both-seed exceedance is near-certain (P=0.996)
        under the null alone; no cell survives Bonferroni correction over
        ~96 comparisons
      result: inconclusive_instrument_uncalibrated_neither_direction_supported
    - metric: ordering_control_compliance
      forced: "rewrite the rule if it labels a null cell the same as a treatment cell"
      observed: "the null arm itself is ABOVE_BAND on 17/192 combinations, including one exceeding the escalated treatment value by 3.4x; not caught by the Executor"
      result: contract_stopping_rule_violated_disclosed

  empirical_evidence_created: true
  mathematical_evidence_created: true
  scientific_evidence_created: true
  scientific_effect: >-
    The unconditional identities (I1)-(I3) underlying H-MONO-663fb4 are
    reconfirmed. The record's own primary discriminating question (is the
    real factor base's character bias exceptional?) is NOT answered by
    this run in either direction: the run's escalated "yes" signal is
    retracted by two independent, convergent lines of evidence, and the
    run's own calibration is shown too weak (n=30 null draws, uncorrected
    multiple comparisons, a heavy-tailed statistic) to certify a "no"
    either. This CONTRADICTS the run's own escalated finding specifically,
    while leaving H-MONO-663fb4's core mathematical claims and its
    "controlled null" default-outcome branch untouched and requiring a
    properly-calibrated replication to test. A genuinely valuable,
    convergently-demonstrated methodological lesson is produced: fixed-
    multiplicative-band null calibration at n~30 draws is inadequate for
    higher-moment (m>=3) character-bias ratio statistics in this program's
    toy-scale instrument family, and a draw-count-sensitivity scan plus a
    null-object control should be mandatory before any such escalation is
    trusted. No ECDLP, relation-rate, or cryptographic-scale claim in
    either direction. Does not close KN-OPEN-009.

