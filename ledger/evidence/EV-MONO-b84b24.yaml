  proof_status: derivation
  proof_status_note: >-
    H-MONO-663fb4's identities (I1)-(I3) are unconditional Fourier-analytic
    derivations, exercised (not re-proven) by Stage 0/2, and both
    independent reviewers reconfirmed them via fresh code with bit-for-bit
    or exact agreement. The CENTRAL DISCRIMINATING QUESTION this contract
    exists to answer (K3/K4: is the real x-coordinate factor base's
    character bias distinguishable from a matched random symmetric subset)
    is NOT settled by this run in either direction: both reviewers,
    independently and by different methods, showed the run's own
    pre-registered [0.7,1.4]/[0.85,1.15] bands against a 30-draw matched
    null are severely miscalibrated for the heavy-tailed m=3,4 statistic,
    and that the single headline "reproducible" escalation (the J0 curve
    at F=N/2) does not survive either an automorphism-mechanism check or,
    decisively, a second-independent-curve replication.
  proof_refs:
    - experiments/EXP-MONO-c819ba/reviews/validator/validation-report.yaml (bootstrap recalibration of the null; heavy-tail diagnosis; orbit-structure refutation of the automorphism story)
    - experiments/EXP-MONO-c819ba/reviews/red-team/red-team-report.yaml (254 independently-constructed curves; draw-count-sensitivity flip; Bonferroni correction; null-object control)

  observations:
    - >-
      STAGE 0, THE SUBGROUP AND COSET-UNION CONTROLS, AND STAGE 1 ALL
      HOLD ROBUSTLY, INDEPENDENTLY RECONFIRMED BY BOTH REVIEWERS. The m=1
      and m=2 exact identities on the frozen fixture, the subgroup
      positive control's exact forced values (N/h-1 = 1 and 3 on both
      capable curves), and the coset-union control's closed-form C/F=1/√2
      were all independently re-derived and matched to exact or
      near-machine precision by both reviewers using fresh code. Stage 1's
      seven verbatim quotations were independently spot-checked against
      the actual source records by both reviewers and found accurate,
      including the genuinely new corpus finding that KN-FIND-4c9e71's own
      later correction section reverses an "O(1) max-C" verdict recorded
      in DEC-20260804-0a4bc2/-4f3a3b without either decision record being
      updated.
    - >-
      THE HEADLINE ESCALATED FINDING (A REPRODUCIBLE, WELL-BEHAVED-NULL
      ABOVE-BAND SIGNAL ON THE j=0 CURVE AT F=N/2) IS RETRACTED, WITH TWO
      INDEPENDENT, CONVERGENT LINES OF EVIDENCE. The Executor correctly
      escalated this per the frozen contract's own falsification_criterion(d)
      rather than adjudicating it — but both independent reviewers,
      using entirely different methods, found it does not survive
      scrutiny: (a) the Validator independently confirmed the point-level
      order-3 automorphism identity f(ωx)=f(x) holds exactly, but then
      showed the ACTUAL F=N/2 scan-order-prefix factor base used in this
      run SPLITS 75.5% of the automorphism orbits it touches — refuting
      the "extra-automorphism artifact" explanation by direct computation,
      not merely leaving it unconfirmed; (b) the Red Team independently
      constructed 124 FRESH j=0 curves and 130 matched random-ordinary
      curves (254 new curves total, none from the original panel) under
      the identical construction and test procedure, and found NO j=0
      enrichment for the escalation pattern (12.1% of j=0 curves show the
      both-seed-above-band pattern at m=4, versus 20.0% of random-ordinary
      curves — Fisher exact p=0.092, i.e. if anything LESS common on j=0
      curves) — decisively refuting BOTH the automorphism-artifact theory
      AND any claim that this is a genuine, curve-family-general
      exceptional-locus finding.
    - >-
      THE ROOT CAUSE IS A CALIBRATION FAILURE OF THE RUN'S OWN NULL
      CONTROL DESIGN FOR HIGHER-MOMENT STATISTICS AT SMALL DRAW COUNTS —
      INDEPENDENTLY DIAGNOSED AND QUANTIFIED BY BOTH REVIEWERS. The
      Validator's 20,000-trial bootstrap calibration of the pre-registered
      bands, under the null being exactly true, found an ACTUAL empirical
      false-positive rate of approximately 65% at m=4 — not the few
      percent a nominal band implicitly assumes — because the underlying
      statistic (a ratio of variance-of-higher-moment quantities) is
      severely right-skewed and the 30-draw null population the frozen
      contract specifies cannot estimate its spread reliably. The Red Team
      independently confirmed this three further ways: (i) a fine F-scan
      showed the "above-band" pattern occurs at 52-69% of F-ladder rungs
      for BOTH j=0 and random-ordinary curve families, with F=N/2 not even
      a local maximum of the effect; (ii) raising the null draw count from
      30 to 200 on the SAME J0/F=N/2 cell made the signal FLIP DIRECTION
      (L3 fell from 1.165-1.170, above band, to 1.133, BELOW band); (iii)
      a null-object control (3,000 replicates, a held-out random subset
      standing in for the "real" arm) found P(at least one cell
      reproducibly above-band across both seeds, panel-wide) = 0.996 —
      essentially certain by chance alone under the run's own design —
      and P(meeting the Executor's FULL escalation criterion, including
      the null-vs-null gate) = 0.382, far above any credible false-alarm
      rate. Applying a Bonferroni correction over the ~96 tested cells,
      NO cell in the archived run reaches nominal significance.
    - >-
      A DIRECTLY APPLICABLE FALSIFIER OF THE AUTOMORPHISM THEORY WAS
      ALREADY PRESENT, UNNOTICED, IN THE ARCHIVED DATA. The Red Team
      observed that J1728 — the panel's OTHER extra-automorphism curve
      (complex multiplication by i, order-4 automorphism) — is reported
      IN_BAND in both runs. If j=0/j=1728's extra automorphisms were
      driving the effect, J1728 should show it too; it does not. This
      falsifier required no new computation, only reading the already-
      archived table with the right question in mind.
    - >-
      A GENUINE PROTOCOL VIOLATION OF THE CONTRACT'S OWN ORDERING_CONTROL
      CLAUSE WAS FOUND, PREVIOUSLY UNNOTICED. The frozen contract's own
      text states: "if the rule emits the same label on a null and on a
      treatment arm, it discriminates nothing and must be rewritten before
      any treatment output is read." The Red Team found the NULL arm
      itself is out-of-band at 55 of 192 null-vs-null combinations and
      ABOVE_BAND at 17 of them — including a null-arm cell (CM1 at F=N/2,
      m=4) reading 6.378, 3.4 times the escalated J0 treatment value. By
      the contract's own literal rule, this should have halted
      interpretation of every treatment cell; instead the ordering control
      was applied only as a narrower per-cell noise screen. This is a
      genuine, disclosed non-compliance with the frozen contract's own
      stopping rule, not a new discovery about the underlying mathematics.
    - >-
      A POSSIBLE, EXPLICITLY NOT-ESTABLISHED SECONDARY DIRECTION IS NAMED
      BY THE RED TEAM FOR FUTURE WORK, NOT CLAIMED HERE. Aggregating
      across all archived and newly-constructed cells, the real arm's
      variance ratio is more often BELOW its matched null's than above
      (median 0.757 across the 32 archived cells; median 0.892-0.904
      across the Red Team's 254 new curves) — the hypothesis's own
      pre-registered "more uniform than random" branch (K3's own
      two-sided framing: "a ratio below [the band] means the factor base
      is MORE uniform than random, which is also a finding"). The Red
      Team explicitly declines to claim this as established (the archived
      cells are not independent draws, and a naive sign-test overstates
      significance at p=0.050) and names it only as a direction a properly
      independent, properly-powered replication should measure.
    - >-
      NO SCOPE CREEP, CONFIRMED BY BOTH REVIEWERS. `asymptotic_claim: null`
      holds throughout; no ECDLP, cost, or exponent claim appears anywhere
      in the record. The Stage-1 corpus-inconsistency finding (KN-FIND-4c9e71
      reversing a decision-record verdict internally) is reported, not
      adjudicated, exactly as the frozen contract requires.
    - >-
      MODEL-CORRELATION CONFOUND, DISCLOSED. H-MONO-663fb4's own text
      flags that its producer and EV-MONO-a0a89c's reviewers all resolved
      to claude-opus-5. This round's Red Team resolved to claude-opus-5
      (matching); the Validator's resolved model should be checked against
      its own attestation and disclosed exactly as measured in the
      composing decision, not assumed.

