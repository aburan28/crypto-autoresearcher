        IN_BAND, establishing this is a design-level issue, not one
        specific to J0.
    red_team:
      task_id: red-team-mono7-c819ba
      report_path: experiments/EXP-MONO-c819ba/reviews/red-team/red-team-report.yaml
      receipt_path: experiments/EXP-MONO-c819ba/reviews/red-team/runtime-session-receipt.json
      joint: J2-adversarial-verification
      verdict: breaks
      verdict_scope: >-
        "Breaks" applies to the escalated J0/F=N/2 finding specifically,
        not to the run's underlying correctness (independently reproduced
        the exact measurement to 12+ significant digits) nor to the core
        identities (all held). Constructed 254 new curves (124 j=0, 130
        random-ordinary) finding zero j=0 enrichment; found J1728 is
        IN_BAND in the archived data, an already-present falsifier of the
        automorphism theory; ran a fine F-scan, a draw-count-sensitivity
        test (30->200 flips the label), a 3,000-replicate null-object
        control (P=0.996 of a spurious both-seed exceedance somewhere on
        the panel), and a Bonferroni correction (no cell survives);
        additionally found the contract's own ordering_control stopping
        rule was violated by the archived null arm itself, uncaught by
        the Executor.
    independence_note: >-
      Fresh, independent sessions with disjoint joint ownership (J1 vs J2)
      and mutual blindness (both attest read_sibling_reports: false, with
      the Validator explicitly disclosing — without opening — that the
      Red Team's report directory appeared mid-session), dispatched
      concurrently AFTER the Coordinator's snapshot commit, correcting
      this session's sequencing back to the pattern established with
      EXP-MONO-12ce1c. Both reviewers converged on the same substantive
      conclusion via largely disjoint methods (bootstrap recalibration vs.
      254-curve construction plus draw-count sensitivity), which is itself
      strong evidence the conclusion is robust rather than an artifact of
      either reviewer's own approach.

