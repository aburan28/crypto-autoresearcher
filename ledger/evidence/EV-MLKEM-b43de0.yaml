  headline_framing: >-
    The separation is statistically far stronger than the producer claimed AND
    carries no information about the dual-attack independence heuristic. Both
    are established here. An ensemble with no lattice, no sieve, no matrix A and
    no modulus reproduces the entire phenomenon, so what the statistic detects
    is that y is a function of x -- true by construction of a dual vector.

  scope_statement: >-
    Nine independent instances at dimension 60 (m=35, n=25), q=127, secret
    centred-binomial eta=2, error rounded-Gaussian sigma=2, g6k bgj1_sieve,
    17,919 vectors each, plus Stage B on three instances. Toy scale.

  claim_tier_note: >-
    `measurement_toy_scale`. The dual-membership certificates re-verify with 0
    violating entries; they certify the vectors, not any inference from scores.

  direction_note: >-
    `refutes` with respect to this program's own reading of the separation. It
    is not a statement about ML-KEM in either direction.

  strength_note: >-
    `strong`: the refutation is constructive rather than statistical. The red
    team exhibited ensembles that reproduce the phenomenon while removing the
    lattice entirely, and derived the collapse analytically BEFORE measuring.

  what_is_established:
    - >-
      THE MEASUREMENT REPLICATES AND IS MUCH STRONGER THAN REPORTED. The
      validator rebuilt the instrument from scratch, regenerated instances 0/1/2
      from BATCH-f75059's seeds, and re-measured with its own seeds,
      permutations, error draws and row ordering: excesses 1.2943 / 1.3190 /
      1.3956 against the producer's 1.3056 / 1.2901 / 1.3461. The surrogate is a
      genuine row permutation, verified as exact INTEGER MULTISET identities on
      3/3 instances (Y row multiset, all 25 column marginals, ||y||^2 multiset,
      X untouched). The nine instances are independent draws, 9/9 distinct on
      every downstream quantity except the saturation target n_vectors.
    - >-
      A STRONGER STATISTIC THE PRODUCER DID NOT REPORT: the real pairing is
      strictly the maximum of its 11 pairings in all 9 instances, and strictly
      the minimum on correct-minus-best, joint p = 11^-9 = 4.24e-10. Exact sign
      and exact Wilcoxon tests both give p = 0.003906, the smallest attainable
      at n = 9. The producer's aggregation rule was not chosen to flatter.
    - >-
      AND THE QUANTITY IS FORCED. The red team derived, before measuring, that
      since Y[i,k] = a_k . x_i mod q the near-miss score collapses to a single
      Fourier coefficient F(e - a_k) of the x-database, at a frequency where the
      database is COHERENT BY CONSTRUCTION because a_k . x_i is small exactly
      when the vector is short. The real arm therefore tends to a nonzero
      N-independent floor while the permuted arm is a product of marginals with
      spread proportional to N^-1/2. Sign and growth are fixed a priori.
    - >-
      CONSTRUCTED ENSEMBLES CONFIRM IT. E1 -- iid Gaussian x in Z^35 with
      y := x[0:25], NO lattice, NO sieve, NO matrix A, NO modulus -- reproduces
      the entire phenomenon: near-miss excess 17.08, row-permuted arm 0.1082
      against the real data's 0.1066, decay 3.05/6.05/11.21/17.16 monotone
      increasing, uniform 0.983 (no separation), secret-distribution 1.480
      (intermediate) -- the same graded contrast. E2 (same marginals,
      independent y) gives 1.037 with flat decay, so the instrument works. E3
      (valid dual family of the REAL A via fpylll BKZ, no sieve, 0 membership
      violations on 447,975 entries) separates at 5.43. Sieving is not
      necessary; the lattice is not necessary; y = f(x) is sufficient.
    - >-
      THE HEURISTIC'S OWN NULL WAS ALREADY IN THE CODE AND NEVER REPORTED. Both
      arms sit 7.1x and 9.4x BELOW the iid prediction. The headline compared two
      objects that both fail the test, to each other. Reporting
      sd_ratio_to_iite against 1.0 costs zero compute.
    - >-
      THE MONOTONE GROWTH IS ALGEBRAICALLY IMPLIED by any non-zero fixed
      separation. The validator fits sd_real^2 = k/(2N') + b^2 with
      sqrt(k) = 0.1062 -- the surrogate's own flat value -- and b = 4.84e-04,
      reproducing all four points to under 0.4%. The red team fits
      sqrt(1 + beta N') with beta from the single N' = 17919 point to under
      0.2 sigma, and its lattice-free E1 obeys the same law. The control
      excludes the sampling-noise class only; the protocol's decay parameter is
      t, not N'.
    - >-
      ONE ALTERNATIVE MECHANISM IS REFUTED, in the producer's favour. The
      validator noticed an unreported geometric coupling,
      corr(||x||^2, ||y||^2) = -0.886, and RAN the missing control
      (NULL-NORMSTRAT, permutation within ||y||^2 bins): excess 1.3445 / 1.2705
      / 1.3705. The separation survives, so it is not the norm coupling. It is
      the algebraic pairing, which is what the red team's ensembles identify.
    - >-
      The two headline statistics are one effect (r = -0.9387 across instances),
      and the graded contrast across candidate groups is a distance curve
      (E3 sweep 5.36 -> 1.28 for delta = 1 -> 16), reproduced with no lattice.
    - >-
      STAGE B'S ARITHMETIC IS SOUND AND ITS NULL IS STRUCTURALLY BLIND. Line 540
      read from the pinned source, 15 = 25 - 10 - 0, m + k_lat = 50 = beta_sieve,
      beta_bkz exponent 0; all Nf values re-derived by hand to 13 significant
      figures; ML-KEM-512 reference 2685.6646571506 = 2^11.3910634600 confirmed
      independently. In Stage A the candidate-discriminating phase is
      -2 pi Y[i,j]/q, a function of y_i. In Stage B it is
      theta_ij = 2 pi[(x_i^T A_fft s_fft)/q - (ahat_i . c_j)/p], a function of
      x_i ALONE, so the pairing carrier psi_i is candidate-independent and
      multiplies every candidate's row-i term identically -- it cannot generate
      across-candidate contrast at first order. Confirmed empirically: SENS-1
      (psi identically 0, MAXIMAL removal) lands beyond NULL-ROWPERM and on the
      OPPOSITE side from real.

  what_is_not_established:
    - >-
      That sieve-produced dual vectors depart from the independence heuristic.
      The statistic cannot show it.
    - >-
      Anything about ML-KEM. No break, no security proof, no FIPS 203 parameter
      set affected or cleared, no speedup, no cost claim, no exponent moved.
    - >-
      That the heuristic holds. After three batches the actual question is
      untested; only this program's attempts at it have been refuted.
    - >-
      Any crypto-scale statement from this observable.

  narrowest_supported_statement: >-
    At dimension 60 with q = 127, across nine independent LWE instances with
    17,919 g6k bgj1_sieve vectors each, the ratio between a real dual-vector
    database and a row-permuted surrogate on near-miss score spread is
    1.3169 +/- 0.0188, with the real pairing strictly extremal among its 11
    pairings in 9 of 9 instances (joint p = 4.24e-10), reproduced independently
    by a validator using its own instrument, seeds and permutations. That ratio
    carries no information about sieving or about score independence: an
    ensemble of iid Gaussian vectors with y defined as a coordinate slice of x
    -- no lattice, no sieve, no matrix and no modulus -- reproduces the excess,
    the monotone decay, and the graded candidate-group contrast; a valid
    non-sieve BKZ dual family of the same lattice separates at 5.43; the growth
    in N' is algebraically implied by any fixed separation; and both arms lie
    7.1x and 9.4x below the iid prediction that would actually test the
    heuristic. No ML-KEM break. No security proof. No statement about FIPS 203
    parameters at any tier.

  narrowest_supported_statement_provenance: >-
    Composed by the Coordinator from RT-20260803-d2e23e's ensemble results and
    VAL-20260803-3fc363's independent reproduction, after both archived reviews
    were committed.

