      supported_by: RT-20260803-d2e23e OBJ-3

  inference: >-
    Three batches pursued a quantity whose sign and growth were fixed before any
    data were taken. Every control the program ran was passed and none could
    have failed. What broke it was deriving the statistic's value under the null
    not being tested, and constructing an ensemble stripped of everything the
    campaign believed was doing the work. The measurement is sound, is stronger
    than claimed, and means nothing about the heuristic.

  heuristics_relied_on:
    - id: H-SCALE-1
      statement: That toy-scale behaviour transfers to cryptographic dimensions.
      status: >-
        MOOT for this observable, which is forced at every scale.

  boundaries:
    - Toy scale. dim 60, q = 127, one sieve family, nine instances.
    - >-
      The red team's collapse is a first-order derivation. It identifies the
      dominant mechanism; it does not account for every residual.
    - >-
      Seven validator items are `unable_to_check` -- all timings, memory,
      smoke-run counts and stage ordering -- because the container replacement
      destroyed the producer's scratch space.

  unresolved_confounds:
    - >-
      The 7.1x and 9.4x departure from the iid model present in BOTH arms. It is
      the quantity that actually tests the heuristic, it was computed by the
      producer's own code, and it has never been reported or nulled.
    - >-
      Whether a norm-matched valid-lattice surrogate separates. Named by the red
      team as the deciding check and not yet run.

  evidence_integrity_findings:
    - id: INT-1
      finding: >-
        Snapshot commit 555a5762 states "I draw no conclusion from them here"
        and then draws two -- "the most encouraging thing in this package" and
        "the rule adopted last batch worked". `REPLICATES` and `provably` are
        interpretations, the ML-KEM-512 figure drops the producer's local
        disclaimer, "flat to within 0.001" is 0.001058, and "pooled z of +50.6"
        is a one-sample t with 8 degrees of freedom equal to 50.5456.
      raised_by: RT-20260803-d2e23e OBJ-9, OBJ-10; VAL-20260803-3fc363 DEF-3, DEF-7
      materiality: >-
        The red team searched for a security claim and found NONE anywhere in
        the message, and states explicitly that this is NOT an overclaim of the
        e08462ac kind. The defect is self-contradiction and dropped qualifiers,
        not scope inflation.
    - id: INT-2
      finding: >-
        "Uniform curves within 0.005 of the mean" is not reproduced; the maximum
        deviation is 0.008483. Both quoted SENS-2 z values are instance 0's, the
        best case of nine, and are unlabelled.
      raised_by: VAL-20260803-3fc363 DEF-6, DEF-8
      materiality: Moderate; presentation, not correctness of the underlying data.

