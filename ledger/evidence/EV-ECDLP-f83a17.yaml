evidence:
  id: EV-ECDLP-f83a17
  hypothesis_id: H-ECDLP-feb405
  experiment_ids: [EXP-ECDLP-1ed445]
  run_ids: [RUN-ECDLP-1ed445-001]
  type: empirical
  direction: supports
  strength: preliminary
  claim_tier: toy
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []

  observations:
    - >-
      G1 NULL CALIBRATION PASS: C_null(measured) matches Gumbel prediction
      sqrt(ln((N-1)/2) + gamma_E) to sub-percent at all four rungs (errors:
      0.05%, 0.21%, 0.52%, 0.10%). The null arm's extreme-value theory is
      confirmed to high accuracy.
    - >-
      G2 CTRL-AP PASS: planted arithmetic progression fires at exactly sqrt(512)
      = 22.627 at all rungs. Relative errors <= 8.6e-6. The DFT instrument is
      demonstrably correct and sensitive.
    - >-
      G3 CTRL-THETA PASS: all four theta sweeps are strictly monotone decreasing
      from sqrt(B) at theta=0 to C_null at theta=1. The canonical artifact tell
      (non-decay when the destroying parameter increases) does NOT fire. The signal
      decays as planted structure is diluted.
    - >-
      G4 RATIO: R_mean per rung = 1.334, 1.280, 1.275, 1.342. All within
      falsification bounds [1.05, 1.40]. Slightly above preregistered prediction
      [1.10, 1.32] at bits=20 and bits=26 (by 1-2%), recorded as ANOM-001.
    - >-
      G5 PRIMARY METRIC: alpha_resid(mean) = -0.001. 95% CI: [-0.048, +0.046].
      INDISTINGUISHABLE FROM ZERO. The EC-specific growth exponent after null
      normalization is below 0.020 across 2^20 to 2^26.
    - >-
      G6 ADVERSARIAL MAX: alpha_resid(max) = -0.013. 95% CI: [-0.085, +0.059].
      Also indistinguishable from zero. Even the worst-case curve shows no
      systematic growth after normalization.
    - >-
      G7 MODEL SEPARATION: power-law R^2 = 0.969, sqrt(log) R^2 = 0.956,
      log-log-log R^2 = 0.950. All three models fit equally well over the tested
      range. The four rungs (bits 20-26) are INSUFFICIENT to distinguish competing
      growth models. Separation requires p > 2^34.
    - >-
      G8 ADDITIVE RESIDUAL: delta = C_EC - C_null approximately constant
      (~1.0-1.4) across rungs. Log-log slope 0.031, not significantly different
      from zero.
    - >-
      k*-IN-F: 0 of 80 curves have k* in the factor base. This answers the
      DEC-20260804-7af513 next_action question NEGATIVELY, but is likely trivial
      given B/N ~ 10^{-5}.
    - >-
      ANOM-002: N-mismatch at bits=26 (cofactor-4 curve N=8.4M vs cofactor-1
      N=33.5M). Systematic upward bias of ~0.09 in R at this rung. Within G1's
      5% tolerance but a real effect that should be controlled in replication.

  inference: >-
    The character-sum ladder succeeds at its primary objective: measuring C_EC
    relative to a matched random null, across four rungs spanning 2^20 to 2^26.
    The headline finding is that R = C_EC/C_null is approximately CONSTANT at
    ~1.28-1.34, and the EC-specific growth exponent alpha_resid is
    indistinguishable from zero (point estimate -0.001, 95% CI containing zero).
    This is CONSISTENT WITH H-ECDLP-feb405's prediction that the EC factor base
    does not carry a growth signal above the null. The null's forced value
    (Gumbel extreme-value theory) is confirmed to sub-percent, validating the
    normalization instrument. The competing growth models do not separate at this
    range, so the experiment CANNOT determine whether C grows as sqrt(log p) or
    as p^alpha for small alpha. Direction is SUPPORTS because the preregistered
    prediction (alpha < 0.020) is confirmed, but strength is only PRELIMINARY
    because (a) scale is toy (bits <= 26), (b) a divergence beginning above 2^26
    is fully consistent with every measured value, and (c) the models that
    would indicate trouble do not separate until p > 2^34.

  boundaries:
    - >-
      Claim tier is TOY. All measurements are at bits <= 26. A cryptographic curve
      operates at bits >= 224. No inference about deployed curves is supported.
    - >-
      This is NOT an ECDLP attack, NOT a refutation of H-PSEUDO, NOT a security
      claim in any direction.
    - >-
      A flat R at toy scale is CONSISTENT WITH H-ECDLP-feb405 but does NOT
      establish it at crypto scale. A divergence beginning above 2^26 is fully
      consistent with every measurement here.
    - >-
      The k*-in-F null result is likely trivial (B/N ~ 10^{-5}) and does not
      constitute evidence about the mechanism.
    - >-
      Competing growth models do NOT separate at this range (all R^2 > 0.95).
      Saying "the growth is flat" and "the growth is sqrt(log)" are both
      compatible with these data.
    - >-
      ANOM-002 (N-mismatch at bits=26) introduces a ~7% systematic effect that
      could bias R upward at the largest rung. This does not invalidate the
      measurement but should be controlled in any replication.

  unresolved_confounds:
    - >-
      Whether R remains constant above 2^26. The tested range is too narrow to
      rule out a divergence that begins at larger scales.
    - >-
      Whether the slight G4 exceedance (R=1.33-1.34 vs predicted [1.10, 1.32])
      indicates the true population R is slightly above 1.32, or is sampling
      variance with 8 mean-statistic curves per rung.
    - >-
      The N-mismatch at bits=26 (ANOM-002) could systematically inflate R by
      ~0.09. In a replication, the null should be calibrated per-curve rather
      than per-rung.
    - >-
      No correspondence trick is known that would extend this measurement to
      crypto scale without enumerating the full DL table.

  reviewed_by: coordinator
  recorded_at: '2026-08-07'
