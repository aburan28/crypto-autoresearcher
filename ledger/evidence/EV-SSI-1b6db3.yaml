  scope_statement: >-
    The frozen Section 4.1 passage supports describing the quoted computation
    as a rough OneEnd-side cost model for the paper's Algorithm 3 path. Its
    SQIsign rows establish relevance to parameter reevaluation, not a direct
    key-recovery or scheme-specific security result. Any Isogeny/SQIsign
    transfer must carry SC-1's GRH condition at the cited reduction boundary,
    and SC-3 means the OneEnd-side concrete cost is not automatically
    inheritable without a separate reduction-aware cost analysis.
  observations:
    - >-
      Section 4.1 gives at log2(p) approximately 256 a rough lower bound of
      2^106.5 F_{p^2}-operations and memory at least 2^92.5 under a one-field-
      operation-per-table-entry assumption and a tightness assumption for P0.
      The source explicitly warns that table generation is underestimated and
      that the P0 bound may overestimate 1/P0.
    - >-
      EV-SSI-59f7a2's toy-scale cost-model refinement and red-team conversion
      are preserved as historical model observations. Its 2^{120-123} bracket
      is not recalculated, independently endorsed, or changed by this record.
      It is carried only as an un-recalculated, model-dependent OneEnd-side
      bracket pending separate numerical and reduction-aware analysis.
    - >-
      The predecessor's unqualified inference that this bracket is a direct
      concrete security estimate at SQIsign NIST-I is superseded. The paper's
      broader SQIsign relevance discussion is retained; relevance does not
      supply the missing reduction instantiation or scheme-specific security
      accounting.
    - >-
      SC-1 is carried explicitly: GRH enters at the Isogeny arrow through [35,
      Proposition 8.5] and is not an assumption listed in the frozen source's
      Corollary 1.2. SC-3 is carried with the Red Team's necessary wording:
      no automatic concrete-cost inheritance, while a future explicit
      reduction-aware analysis could in principle transfer a bound.
    - >-
      SC-2 remains a separate standing condition on future candidates and is
      neither solved nor silently folded into this correction.
    - >-
      Both independent reviews agree that this is documentary only. No
      experiment, new run, numeric recalculation, security conclusion,
      exponent claim, hypothesis transition, or goal completion follows.
  boundaries:
    - >-
      This record corrects the label and transfer conditions only; it does not
      establish a direct SQIsign security level or key-recovery cost.
    - >-
      It does not recalculate the predecessor's AES-equivalent conversion,
      toy-scale extrapolation, per-entry model, time-memory tradeoff, or
      physical-memory interpretation.
    - >-
      It does not assert that a future reduction-aware cost analysis exists or
      what numerical value such an analysis would produce.
    - >-
      No hypothesis status, experiment status, asymptotic promotion gate, or
      completion criterion changes.
