      control (8.03 % > 7.38 %, both below modelled). The prediction is
      disclosed as not independent of the smoke run; the criteria are
      interval-sign criteria and do not use smoke values.
    - >-
      Measured against modelled: the target keeps 44 % of the modelled
      persistent saving and 27 % of the modelled one-shot saving; the control
      keeps 53 % and 51 %. The one-shot dilution is larger on the target,
      whose route has two 5-isogeny steps each way against one 3-step for
      the control.
    - >-
      Against the index-calculus baseline and the matched rho: not
      applicable; known-scalar k*P wall-clock in one implementation. The GAE
      pricing band of AGENTS.md section 5a does not apply (not an ECDLP
      comparison).

  inference: >-
    On other/BADA55-VPR-224, on this host, with bench.c at cc -O2
    -march=native, one-shot variable-base k*P routed through the 5·5
    neighbour's a = -3 model is measurably faster than k*P on E with E's
    own generic-a doubling: 3.07 % (95 % CI 2.33 % to 3.53 %), and the
    persistent form 6.76 % (5.77 % to 7.80 %). The measured saving is well
    below the modelled one, as predicted. The frozen on_positive branch
    applies: supported at the measured tier for this curve, host, compiler
    and implementation only.

  boundaries:
    - >-
      One curve (other/BADA55-VPR-224, 224-bit; recalled context: a curve
      published to demonstrate manipulable generation, not a deployed
      standard; pointer only) and one constructed control; 64 points, 41
      repetitions, seed 20261016.
    - >-
      One shared KVM host without pinning, frequency control or isolation;
      cc 13.3.0 -O2 -march=native; generic 4-limb CIOS with S = M; an untuned
      A0; variable-time code; one Fermat inversion inside every arm.
    - >-
      Nothing transfers to other hosts, compilers, optimised libraries,
      dedicated squaring, constant-time or complete formulas, fixed-base k*P,
      or other curves, including the GLV curves of EXP-ENDO-7494e7.
    - >-
      Known-scalar cost only. Faster known-scalar multiplication does not
      establish faster unknown-scalar recovery (AGENTS.md). Wall time is not
      a measured bound.

  unresolved_confounds:
    - Host contention (O4) is symmetric and does not move any gate, but a single shared host remains the main limitation; the spec names the independent-runner replication as the remedy.
    - A0 is a generic implementation; a tuned E-side implementation could narrow or erase the gap.
    - Correctness was checked on repetition 0 outputs only; later repetitions repeat the same deterministic computation.
    - The A/A margin [0.95, 1.05] was fixed with smoke values in view (disclosed).

