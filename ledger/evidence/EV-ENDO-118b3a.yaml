  comparison:
    - >-
      Gates (gate_resolution): correctness, both A/A gates and the positive
      control pass, so the target's A1/A0 and A2/A0 inferences are released.
    - >-
      Success criterion: target ratio_A2_over_A0 95 % CI upper bound < 1.
      Met: 0.9767. The falsification (lower bound >= 1) and inconclusive
      (CI contains 1) branches do not apply. Every gate outcome and interval
      side is unchanged when the contention-flagged repetitions are dropped.
    - >-
      Preregistered prediction: persistent saving in (0, 15.205 %) - observed
      6.76 %; one-shot in (0, 11.441 %) - observed 3.07 %; one-shot <
