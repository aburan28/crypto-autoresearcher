      rung_certified_rank_distribution {"0": 12, "1": 1}) are FALSE and present 12
      infrastructure outcomes as certified rank 0. The report's own alarm discipline (applied
      to SET A/B) is not applied to RT-CONTROL-2. This is red-team objection OBJ-001 (critical,
      sustained). The rank-distribution contrast is therefore NOT valid as stated.
  - id: OBS-6
    statement: >-
      THE TRACE MAP WAS NOT CONSTRUCTED. The null object's section-freeness is argued by
      irreducibility + Galois group S_6, which is mathematically sound but is the exact
      argument the review plan says not to accept as proof. The required trace-map
      construction (P + P^sigma of a Galois-conjugate pair of sections) was not performed by
      the producer or the red team (PARI nffactor did not converge within budget). This is
      red-team objection OBJ-002 (major, sustained).
