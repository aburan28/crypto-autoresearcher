      certified rank->=12 fibres measured (4 of them) came from SET B, and the best is at
      naive height 118.22777364040874, on MESTRE'S OWN PUBLISHED TUPLE A
      (-17,-16,10,11,14,17) at t = 23 -- NOT a tuple this program found. It sits
      +48.888932 above the frozen r >= 12 frontier value, +38.899099 above the
      construction-class benchmark 79.32867457792244, and +31.454080 worse than the
      campaign's standing best at certified rank >= 12 (86.77369390941135). C1'
      condition 1 (first exhibited by this program) therefore FAILS.
  - id: OBS-4
    statement: >-
      THE ADDITIVE-FIBRE CORRECTION. The naive ceiling formula 18 - deg_gcd - (m_inf - 1)
      overcounts by 1 per additive (cusp) fibre. The correct formula adds n_additive, detected
      by gcd(DD, a2^2 - 3*a4). The producer's computation accounts for this; the validator
      independently confirmed it on 15/15 families.
  - id: OBS-5
    statement: >-
      THE RT-CONTROL-2 NULL OBJECT IS DEFECTIVE. 12 of 13 rung fibres were
      alarm-interrupted (status attempted_not_measured, reason
      pari_ellrank_alarm_point_search_truncated), not measured; only 1 rung fibre was measured
