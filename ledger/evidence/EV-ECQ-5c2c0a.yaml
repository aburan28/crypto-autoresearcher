    statement: >-
      NO CELL WAS TAKEN. cell_taken is false on every row of best_candidates.json, on every
      metric, at every rank threshold, in the fourth and final batch of the campaign. Nothing
      was submitted to the ICARM endpoint and no network call was made.
  - id: OBS-3
    statement: >-
      NO CERTIFIED RANK-12 FIBRE WAS FOUND ANYWHERE IN THE TARGET STRATUM. The best
      certified rank over SET A (the target stratum, at 138/146 coverage) is 11, at
      naive height 77.85764339540441 -- below the benchmark but at rank 11, not 12, and
