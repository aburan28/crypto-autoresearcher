      immutable and remain exactly as committed. MF-2 is withdrawn by
      SUPERSESSION, by reference, which is what both reviews required and what the
      package's own SR-5 demands.
    counter_restatement: >-
      The residual and much smaller true statement is: the frozen contract's
      obligation-8 provenance line is exact about location and value, and
      imprecise only in that the cited queue renders the integer with a thousands
