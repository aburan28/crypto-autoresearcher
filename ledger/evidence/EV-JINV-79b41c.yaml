  convergent_finding_mf2_withdrawn:
    status: WITHDRAWN_BY_SUPERSESSION
    what_mf2_asserted: >-
      The producer's second material finding asserted that the frozen contract
      attributes the literal 441350 to the committed BATCH-d7e255
      dispatch_queue.json "where it does not occur", so that the contract's
      obligation-8 provenance line does not reproduce.
