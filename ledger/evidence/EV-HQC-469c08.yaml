  type: empirical
  type_note: 'A genuine measurement authorized by DEC-20260809-186c86''s next_actions (adopting the Red
    Team''s named counterexample from EV-HQC-3a0372 observation O8): repeat stage_a.py''s real,
    unmodified decode_blocks-injection pipeline on shards 5000 and 6000 THEMSELVES (the same two shards
    TASK-20260809-a79e4f''s stage 1 used) at a genuinely new, disjoint trial range (indices [5000,15000)
    per shard, never previously requested by any task in this campaign, obtained via a discard-prefix
