  observations:
  - 'O1. WHAT IS UNDER REVIEW AND WHAT AUTHORIZED IT. DEC-20260809-186c86''s next_actions authorized
    TASK-20260814-8bbdd2, a discard-prefix repeat of the T=20,000 matched-pair extension on shards
    5000/6000 themselves, pre-registered in design.md before any data was generated (confirmed by both
    reviewers: design.md''s Sections 2-8 match matched_pair_repeat.py line-for-line). The run is reported
    valid_measurement, exit code 0, one script invocation. Independent review: Validator TASK-20260814-73d513
    (verdict passed / ADMIT / MECHANICALLY_SOUND), Red Team TASK-20260814-a49f1c (does not contest any
    reported number; raises interpretive objections about coverage of the pre-registered framing and
    surfaces new per-shard evidence -- see O5-O8 below).'
  - 'O2. DISJOINTNESS SELF-CHECK AND THE NEW F[:, 0:n_e-1] STANDING INVARIANT, BOTH FAIL-CLOSED VALIDITY
    GATES, BOTH PASS. All 4 (shard, variant) calls'' discarded prefix [0:5000) reproduces
    TASK-20260809-a79e4f''s committed per_trial_S arrays bit-identically (elementwise and via
    histogram), independently reconfirmed by the Validator from a separately-written driver run TWICE
    (identical result both times) and by the Red Team from its own re-run and instrumentation. The new
    F[:, 0:n_e-1] structural invariant (EV-HQC-3a0372 O11''s named, previously-untested check) PASSES on
    both shards, 0/1,100,000 mismatches, independently recomputed by the Validator from scratch and
    matching exactly. This is the first runtime, array-level (not merely row-sum S) confirmation that
    the V3 injection wrapper touches only the last block on the crossed/fresh-trial-range arms.'
  - 'O3. MATCHED-PAIR STATISTICS ON THE RETAINED TAIL (T=10,000/shard, T=20,000 pooled), k=m=17. Pooled:
    diff (defected-undefected) = +0.012680459248862519, SE_paired = 0.032968496689324056,
    SE_unpaired = 0.296295, ratio (unpaired/paired) = 8.987228, z_paired = 0.384624. Per-shard:
    shard 5000 diff=-0.0214712904572103/SE_paired=0.017519668259777004/z=-1.2256; shard 6000
    diff=+0.03834606796994677/SE_paired=0.05672541366346499/z=0.6760. The Validator independently
    re-implemented the estimator FROM the mathematical definition (not by calling matched_pair.py''s own
    functions) on independently regenerated raw per-trial data and matched every one of these values to
    full double-precision exactness (max absolute error 4.16e-17 to 5.11e-13, floating-point summation
    noise only), across all 25 evaluable k=2..26, not merely k=17.'
  - 'O4. SE-VS-TRIAL-COUNT EXPONENT REFIT, THREE POINTS ON SHARDS 5000/6000 ALONE (never 8001/8002):
    T=5,000 (SE=0.137502, mean of the two shards'' own committed T=5,000 paired SEs), T=10,000
    (SE=0.096781, TASK-20260809-a79e4f''s committed pooled stage-1 SE), T=20,000 (SE=0.032968, this
    task''s own pooled retained-tail SE). Fitted alpha = 1.030146864960655 by OLS on log(SE) vs log(T),
    OUTSIDE the pre-registered [0.4, 0.6] consistency band. Independently reproduced exactly by the
    Validator (1.0301468649606556, difference 4.44e-16) and by the Red Team (own independent OLS refit,
    exact match).'
  - 'O5. DEC-20260809-186c86''S PRE-REGISTERED BINARY FRAMING DOES NOT CLEANLY COVER THE MEASURED VALUE
    (Red Team, and independently agreed by this Coordinator on re-derivation). The frozen next_actions
    text names exactly two outcomes: SE at T=20,000 "lands near 0.068-0.070" (the 1/sqrt(T)-continuation
    figure from the T=10,000 point, 0.096781/sqrt(2) = 0.06843; shard-specific reading) or SE "collapses
    the same way stage 2 did" (approximately 0.017905, TASK-20260809-a79e4f stage 2''s pooled fresh-shard
    figure; general-refutation reading). The measured pooled SE at k=17, 0.032968, satisfies NEITHER
    literal condition: it is 0.03546 (linear) / ln-ratio 0.7385 from the "near 0.068-0.070" reference and
    0.01506 (linear) / ln-ratio 0.6109 from the "collapses" reference -- roughly 2.4x closer in absolute
    distance and ~1.2x closer in log-distance to the collapse reference, but with no stated tolerance
    band around either named number in the frozen rule, applying either label requires an undisclosed
    judgment call the rule itself does not resolve.'
  - 'O6. INDEPENDENTLY RECOMPUTED SINGLE-SHARD-ONLY (UNPOOLED) LOCAL EXPONENTS ACTIVELY UNDERCUT, NOT
    MERELY FAIL TO CONFIRM, THE "SHARD-SPECIFIC TO 8001/8002" READING (Red Team, from raw per-trial data
    it generated itself; underlying per-shard SE values independently corroborated to full precision by
    the Validator''s O3 recomputation). Shard 5000 ALONE: SE(T=5,000)=0.125106 -> SE(T=10,000, this
    task''s own new disjoint tail)=0.017520, local exponent = 2.836, point-estimate sign flips
    (+0.1018 -> -0.0215). Shard 6000 ALONE: SE(T=5,000)=0.149899 -> SE(T=10,000)=0.056725, local
    exponent = 1.402, sign stable (+). BOTH single-shard exponents are far outside [0.4, 0.6], and shard
    5000''s alone (2.836) EXCEEDS the original pooled fresh-shard step''s local exponent (2.434,
    EV-HQC-3a0372 O8) that this whole scaling-characterization task was designed to disambiguate -- from
    an ORIGINAL, non-fresh shard, on a genuinely new disjoint draw.'
  - 'O7. FOUR-SHARD SE TABLE AT T~10,000/shard, ALL SHARDS THIS CAMPAIGN HAS EVER MEASURED AT THAT SCALE
    (Red Team). shard 5000 = 0.017520 (this task, new tail); shard 6000 = 0.056725 (this task, new
    tail); shard 8001 = 0.024506 (TASK-20260809-a79e4f stage 2); shard 8002 = 0.022097
    (TASK-20260809-a79e4f stage 2). A 3.24x spread among four shards, with shard 5000 -- an ORIGINAL
    shard -- now showing the SINGLE LOWEST SE of all four, lower than either "anomalous" fresh shard.
    This looks like broad shard-to-shard heterogeneity in this estimator''s variance at T~10,000/shard
    for this defect class, not a property specific to 8001/8002; it is new evidence this task''s own
    committed artifacts (which report only the pooled fit) do not themselves surface.'
  - 'O8. POOLING-CONVENTION ASYMMETRY, PRESENT IDENTICALLY IN BOTH 3-POINT FITS, UNTESTED FOR BIAS (Red
    Team, an open, non-blocking finding). In both the original 4-shard alpha=1.470 fit
    (EV-HQC-3a0372 O6) and this task''s 2-shard alpha=1.030 fit (O4 above), the T=5,000 point is the
    ARITHMETIC MEAN of two independent, single-shard point-in-isolation SEs, while the T=10,000 and
    T=20,000 points are the SE of a single, jointly POOLED (concatenated-histogram) two-shard dataset --
    two structurally different statistics on the same log-log line. Holding shard identity fixed (this
    task''s whole purpose) removes the shard-identity confound between steps but does NOT remove this
    pooling-convention asymmetry, which has never been isolated from genuine trial-count scaling in
    either fit. The pooled SE (0.032968) sits much closer to shard 5000''s own SE (0.0175) than to shard
    6000''s (0.0567) or their simple average (0.0371) -- consistent with, though not proof of, the
    concatenated-histogram pooling compressing the reported SE given the O7 heterogeneity. Not computed
    in this batch: an inverse-variance-weighted alternative to compare against.'
  - 'O9. ALTERNATIVE EXPLANATION TESTED AND REFUTED AT THE CELLS CHECKED: NaN-jackknife-dropout artifact
    (Red Team). matched_pair.py''s jack_se normalizes leave-one-batch-out replicates by the full batch
    count regardless of how many are finite -- a latent bias risk if any replicate is non-finite. The Red
    Team instrumented this directly on all 4 of this task''s retained-tail arms (200 replicates each,
    pooled 400) at k=17 and, near the evaluable_k floor, at k=25 and k=26 on both shards/variants, and
    additionally re-derived it for TASK-20260809-a79e4f''s original stage-1/stage-2 arms: 0/200
    non-finite replicates EVERYWHERE CHECKED. This narrows, but does not close, the concern -- not
    re-checked at every k or for any other defect class/parameter set.'
  - 'O10. DOCUMENTATION-ACCURACY FINDING, INDEPENDENTLY AND IDENTICALLY FOUND BY BOTH REVIEWERS WITHOUT
    CONFERRING. design.md Section 1 states sha256_file, core_seconds, git_state and load_module are
    "reused directly, verbatim, not re-derived" from matched_pair.py, in the same bullet as the four
    genuinely-imported, statistically load-bearing functions (make_defected_decode_blocks,
    matched_pair_stats, arm_hists, cell). Both reviewers, independently, diffed matched_pair_repeat.py
    and found the four named utility functions are actually LOCALLY RE-DEFINED (load_module renamed
    load_module_fail_closed), not imported via mp_mod.*, while the four load-bearing functions genuinely
    ARE imported via mp_mod.* as claimed. Both reviewers independently diffed the local copies
    byte-for-byte against matched_pair.py''s originals and confirmed identical bodies -- structurally
    forced by a bootstrap chicken-and-egg problem (matched_pair.py''s own load_module cannot be called to
    load matched_pair.py before it exists as a module object), not a careless deviation, and with NO
    effect on any reported number, since none of the four participates in the disjointness comparison,
    the F-invariant comparison, or the estimator. Both reviewers assess this as a documentation-accuracy
    finding, not a computation-soundness defect, and neither treats it as blocking their ADMIT-equivalent
    verdict.'
  - 'O11. VALIDITY. All fail-closed selftests PASS (sha256 pin mismatch, injection-invariant mismatch).
    D2/D3 hard invariants: 0/0 violations on all 4 calls (full 15,000-trial call each), no truncation, no
    crash. Run reported valid_measurement per design.md''s own pre-registered Section 8 criteria.
    Independently confirmed by the Validator (own driver, run twice, identical both times) and the Red
    Team (own re-run plus instrumentation). matched_pair.py''s sha256 pin
    (66266a6178eb46e0b37ec0afdb2620064db56bff82318498e2dd83af1bd1c821) independently recomputed and
    confirmed genuine by both reviewers; stage_a.py and measure.py''s pre-declared pins also reconfirmed.'
  - 'O12. MEASURED SPEND: 36.818 core-seconds / 36.785 wall-clock seconds, against the 500 core-second /
    1,800 wall-clock authorization (7.4% / 2.0% of budget), 1 of 2 authorized runs used. Cross-checked
    by the Coordinator against run_manifest.yaml.budget, matched_pair_repeat_results.json.budget and
    stdout.log (all agree to 3 decimals); independently plausibility-checked by both reviewers'' own
    comparable from-scratch runs (Validator: 35.8-36.9s wall-clock on two runs; Red Team: ~36.97
    core-seconds / ~36.8 wall-seconds on its own re-run). No infrastructure event of any kind occurred.'
  - 'O13. BRANCH A (POSITIVE DETECTION) HAS STILL NEVER FIRED IN THIS CAMPAIGN. This task''s own pooled
    z_paired at k=17 (0.3846) is far below the |z|>=1.96 threshold; |diff|+1.96*SE = 0.07728 < 0.19 would
    ALSO satisfy an un-superseded Branch B-style clean-null condition, exactly as TASK-20260809-a79e4f
    stage 2''s numbers did -- whatever produces these small SEs at large T continues to co-occur with "no
    detected effect" (Red Team). The Red Team''s BATCH-2ecaa1 standing objection is explicitly not
    retired by this batch either.'
  inference: 'APPLYING DEC-20260809-186c86''S PRE-REGISTERED FRAMING EXACTLY AS WRITTEN: the frozen rule
    names exactly two outcomes for the measured pooled SE at k=17 on shards 5000/6000 -- "near 0.068-0.070"
    (shard-specific) or "collapses the same way stage 2 did" (approximately 0.017905, general refutation).
    The measured value, 0.032968, satisfies NEITHER (O5): it is not within any stated tolerance of
    0.068-0.070, and it is not equal to, nor obviously "the same collapse as," 0.017905 (roughly 1.84x
    larger). Per the handoff''s own explicit instruction for exactly this contingency ("if the measured
    value falls in neither named zone, say so plainly and record an inconclusive/ambiguous finding rather
    than forcing it into one of the two branches"), THIS RECORD DOES NOT APPLY EITHER NAMED LABEL. THE
    VALIDITY GATES THAT WOULD FORBID ANY INTERPRETATION (the disjointness self-check, the F[:, 0:n_e-1]
    invariant) BOTH PASS, independently confirmed (O2), so this is not a Branch-D-style infrastructure
    non-result either -- it is a genuine, admissible, but ambiguous measurement with respect to the
    specific pre-registered binary test. SEPARATELY, AS A SYNTHESIS OF WHAT ELSE THIS TASK''S OWN NEW DATA
    SHOWS (not a re-selection of which named branch fired, since neither did): the Red Team''s newly
    computed single-shard-only local exponents (O6) and four-shard SE table (O7) point AWAY FROM, not
    merely fail to confirm, the "shard-specific to fresh shards 8001/8002" reading -- an ORIGINAL shard
    (5000), drawing a genuinely new disjoint sample, shows a local exponent (2.836) MORE extreme than the
    fresh-shard step it was meant to disambiguate, and the single lowest SE of any of the four shards ever
    measured at this scale. This is evidence consistent with general shard-to-shard estimator
    heterogeneity rather than shard freshness specifically, though from only two single-shard data points
    it is a directional lean, not a confound-free result -- the design that would supply that (a matching
    second trial count on shards 8001/8002, run without pooling) has not been run. A newly surfaced,
    independent, UNTESTED confound (O8, the pooling-convention asymmetry present identically in both this
    task''s and the original fit) further means the reported pooled SE cannot yet be cleanly attributed
    to trial-count scaling, shard identity, or pooling convention in isolation. On the campaign-level
    question this batch was dispatched to inform -- whether the alpha=1.47/1.03 SE-vs-T anomaly is
    shard-specific or general -- NOTHING IS SETTLED BY THE PRE-REGISTERED TEST ITSELF, but the balance of
    the newly available evidence leans toward general estimator/shard heterogeneity over a fresh-shard-
    specific artifact, without yet excluding either. KN-TECH-00f082''s own falsification/narrowing
    condition (mirroring DEC-20260809-186c86''s binary framing) is, by the same reasoning, ALSO not
    cleanly triggered by this measurement: KN-TECH-00f082 therefore STANDS UNMODIFIED, neither confirmed
    as filed nor superseded, pending the narrower follow-up task named in the companion decision.'
