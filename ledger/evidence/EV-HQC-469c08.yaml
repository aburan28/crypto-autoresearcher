    (1.030146864960655) as both the executor and the Validator. Two independent sessions, two
    independent implementations, one number each time this was checked.'
  claim_tier: toy
  claim_tier_note: 'TOY, hard ceiling, inherited unchanged from EV-HQC-3a0372, EV-HQC-dd85c1,
    EV-HQC-67a6ec and RQ-HQC-001. PS-R3 reduced parameters (n=7187, n_e=56, n_2=128, dup=1, N=7168,
