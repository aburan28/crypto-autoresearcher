    8001/8002 specifically or general to the estimator.'
  direction: neutral
  strength: replicated
  strength_note: 'Describes the MEASUREMENT, not the campaign-level detection question, which this record
    leaves exactly as undiscriminated as EV-HQC-3a0372 left it. Every reported statistic -- the
    disjointness self-check, the new F[:, 0:n_e-1] structural invariant, per-shard and pooled
