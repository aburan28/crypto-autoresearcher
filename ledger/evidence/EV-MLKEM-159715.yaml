      means T-CIPHNOISE-CLOSED fires, aggregate CLOSED-ALL. BOTH REVIEWS INDEPENDENTLY
      RE-DERIVED THIS from their own recomputed beta figures, with no producer import, and
      CONFIRM IT CORRECT (Validator RECOMP-4; Red Team's own "Standard checks"). NEITHER
      REVIEW DISPUTES THE BRANCH CALL -- the Red Team states this explicitly ("This is not a
      rejection of the branch call"), and the Validator's CTRL-3 states the branch is ROBUST
      to its own m-sweep chaos finding specifically because M2 never sets "best" at
