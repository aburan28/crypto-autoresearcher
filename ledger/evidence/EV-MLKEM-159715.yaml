  # ==================================================================
  # ITEM 1 -- THE CORRECTED, NARROWED CITABLE WORDING FOR THE M2 FIGURE
  # ==================================================================
  m2_magnitude_corrected_citable_wording: >-
    T-CIPHNOISE-CLOSED FIRES CORRECTLY AND MECHANICALLY -- both independent reviews confirm
    this from their own recomputed numbers, with no producer import, and neither asks to
    reopen or reverse the branch call; the CLOSED-ALL verdict does NOT depend on trusting the
    255-bit M2 magnitude specifically (even the worst chaotic-band reading either review found,
    beta=558 at m=222, remains far below beta(key-side)=855). WHAT IS NOT SUPPORTED, adopted
    directly from both reviews' own convergent language (the Validator's CTRL-2/CTRL-3; the
    Red Team's "narrowest_supported_statement" and "counterexample_or_mutation"), verified
    against both reports' cited probes rather than invented fresh: the specific characterization
    of "255 core-SVP bits, roughly two orders of magnitude beyond H-MLKEM-11aabf's predicted
    2-4 bit floor" as a stable, trustworthy MEASUREMENT of "the effect of removing compression
    noise" (the hypothesis's own stated mechanism). beta(M2)=617 at reduced_m=236 is a
    deterministic, reproducible ARITHMETIC FACT (both reviews reproduce it exactly, five
    repeated calls by the Validator all read 617) -- but it sits inside a demonstrated,
    reproducible, chaotic/near-breakdown region of primal_bdd/RC.MATZOV's own cost landscape
    at this severely sample-starved (m<<n, reduced_m=236 vs base m=n=1024, ~23%) construction:
    total optimizer failure (rop=+inf, no finite-cost configuration found) below m~218-220; a
    chaotic, non-monotone band from there to roughly m~240-250 (beta ranging ~558-908/905 in
    that band, both reviews); a SINGLE-UNIT change from the producer's actual m=236 to m=237
    swings beta from 617 to 908/905 -- a ~290-bit jump for a 0.1%-of-n change in sample count
    (independently confirmed by both reviews, Validator's fine sweep and Red Team's probe5); the
    function is smooth and monotone only above m~240-250, saturating at the key-side value (855)
    as m approaches the base 1024. The mechanism is source-verified, not merely observed (Red
    Team): estimator/lwe_primal.py's Bai-Galbraith embedding-enlargement construction floors
    the internal d-optimizer's search grid at d>=n=1024 regardless of how small m is, and no
    InsufficientSamplesError-style validity guard exists for this attack path tied to m vs n
    (unlike this same estimator's lwe_dual.py/lwe_guess.py/lwe_bkw.py, which do raise one for
    their own success conditions) -- the instrument silently returns a number from deep inside
    the chaotic band with no warning. THE CORRECTED, NARROWED READING A FUTURE CITATION MUST
    CARRY: "beta(M2)=617 at ML-KEM-1024's reduced_m=236 is a deterministic, reproducible
    reading of the pinned instrument at that exact input, and the QUALITATIVE conclusion it
    supports (M2 < M0, so the honest treatment cannot make the ciphertext-side lattice more
    favourable to the defender than the naive treatment already suggests, and CLOSED-ALL is
    unaffected regardless of the magnitude) is robust. The SPECIFIC MAGNITUDE (255 bits below
    M0, ~2 orders of magnitude beyond the hypothesis's own predicted floor) is NOT supported as
    a stable or trustworthy measurement of the hypothesized mechanism, because the pinned
    estimator's own primal_bdd/RC.MATZOV optimizer is demonstrably non-smooth in the m<<n
    regime this specific construction requires, with no validity-range guard warning against
    using it there, and the SAME construction one sample away from the actual reduced_m returns
    a beta ABOVE M0 (908/905 at m=237/240) rather than below it -- which, had reduced_m's
    rounding landed there instead (it does not: 785408/3329 = 235.929..., rounding
    unambiguously to 236 under any tie-breaking convention, independently re-checked), would
    have FIRED F(b) rather than leaving it NOT FIRED. Any downstream use of the '255 bits' or
    'beta(M2)=617' figures -- including any knowledge-promotion write-up or future citation of
    T-CIPHNOISE-CLOSED -- must carry this caveat in the same sentence." This is NOT a violation
    of PREREG-7, whose own text explicitly anticipated the possibility that Stage B's own
    numbers might not warrant unqualified citation (section 3.6's general licensing structure,
    section 6's scope discipline); it is a scope correction to what the resulting discharge,
    cited bare, would otherwise be read to mean.

  # ==================================================================
  # ITEM 2 -- THE M0==M1 FORCED IDENTITY: A PREREG-7 PROTOCOL-DESIGN DEGENERACY
  # ==================================================================
  m0_m1_identity_finding: >-
    beta(M0)=beta(M1) EXACTLY at every tested parameter set -- not merely equal integers but
    bit-identical stddev fed to the estimator and bit-identical log2(rop) returned -- is
    INDEPENDENTLY RE-DERIVED, symbolically AND numerically, by both reviews, and BOTH TRACE
    THE FORCE TO A PREREG-7 PROTOCOL-DESIGN DEGENERACY, not a producer execution defect.
    PREREG-7 section 3.2 specifies M1 as feeding the estimator "a single effective distribution
    constructed as [the] properly class-weighted mixture." Because the fibre-size classes M1
    conditions on PARTITION the full population that M0's own population-average distribution
    already mixes over, the law of total probability applied to sums of independent random
    variables forces M0's and M1's fed distributions to be IDENTICAL before any measurement,
    independent of q=3329's specific fibre counts -- confirmed by both reviews at BOTH d_u=10's
    767x3/257x4 partition AND d_u=11's 767x1/1281x2 partition, two structurally different
    partitions, same forced equality both times. Combined with the pinned estimator's own
    Xe cost path being variance-only for primal_bdd (independently source-verified: grepping
    estimator/lwe_primal.py's entire call graph for every Xe. use finds only Xe.stddev, never
    a pmf or higher moment -- the producer's own section-1 obligation-4a finding, which
    neither review needed to re-derive since it is a direct, checkable code-search result),
    THERE WAS NO WAY FOR M1, AS PREREG-7 SECTION 3.2 SPECIFIES IT, TO EVER PRODUCE A NUMBER
    DIFFERENT FROM M0 -- the identity is forced before any measurement, by the specification
    plus the instrument's own variance-only cost path. PRACTICAL UPSHOT, STATED IDENTICALLY BY
    BOTH REVIEWS INDEPENDENTLY: C2's "three declared noise models," as actually executable
    against this pinned instrument under PREREG-7's own M1 specification, are only TWO
    distinguishable readouts (M0=M1, and M2), not three. WHAT THIS MEANS FOR H-MLKEM-11aabf
    GOING FORWARD, per both reviews' own forward guidance (not a closure of the noise-
    heterogeneity question itself): a future construction wanting to actually test genuine
    per-coordinate noise heterogeneity against this pinned, variance-only estimator would need
    EITHER a different attack construction (e.g. a row-rescaling/whitening technique, a real,
    different technique from "mixture-then-convolve-then-feed-one-marginal", which this pinned
    estimator's LWEParameters API does not itself expose) OR an instrument extension that
    consumes more than the first two moments of a per-coordinate-varying noise model. This is
    forward guidance for a possible future, separately-commissioned hypothesis or protocol
    amendment, not a decision this record makes on H-MLKEM-11aabf's behalf.

  # ==================================================================
  # ITEM 3 -- THE M1 FALSIFICATION-COVERAGE GAP
  # ==================================================================
  m1_falsification_coverage_gap: >-
    H-MLKEM-11aabf.predictions bundles beta(M1) together with beta(M2) under one metric row
    ("beta(M1), beta(M2) relative to beta(M0) at ML-KEM-1024 ... minimum_effect: a reduction
    of 2 to 4 core-SVP bits"; "at ML-KEM-512/768 ... under 1 bit"), but
    HEUR-MLKEM-11aabf-1's own falsification_condition checks ONLY beta(M2) >= beta(M0) -- NO
    condition in H-MLKEM-11aabf's own falsification_conditions (F(a)-(d)) fires when M1's own
    stated minimum_effect (a nonzero reduction) fails to materialize. Found INDEPENDENTLY by
    both reviews (Validator CTRL-4-FALSIFICATION-COVERAGE-GAP-M1; Red Team's own objection 2).
    The measured M1 effect is not merely "below the predicted range" -- per item 2 above it is
    PROVABLY, EXACTLY ZERO at every parameter set, a forced identity given M1's own frozen
    construction, directly contradicting the predicted minimum_effect for the M1 half of that
    bundled row. This is a genuine, pre-existing gap in H-MLKEM-11aabf's own falsification
    design (present in the hypothesis record before PREREG-7, correctly and verbatim
    transcribed by PREREG-7, so it is NOT an artifact of this batch, its producer, or PREREG-7's
    own authoring). It does not by itself falsify anything (no wired condition exists to fire),
    but it means H-MLKEM-11aabf's own predictions were only PARTIALLY tested by this batch's
    own falsification machinery, and a future amendment to H-MLKEM-11aabf (a versioned
    protocol_amendment record, never a silent edit to falsification_conditions after seeing this
    outcome) would be needed to give M1's own prediction a wired check.

  # ==================================================================
  # ITEM 4 -- CARRIED FINDINGS, AT FULL WEIGHT
  # ==================================================================
  carried_findings: >-
    ART-3B (Validator, single-source, minor): FIPS 203 eq (4.7) literally restricts
    Compress_d/Decompress_d to d<12; the "d=12 gate" both PREREG-7 and the producer's own
    script use is a natural but technically unflagged EXTENSION beyond that stated domain
    (FIPS 203's own d=12 mechanism is ByteEncode12/ByteDecode12, a lossless integer-mod-q
    encoding, a different function). Independently confirmed this does NOT affect correctness
    of the reported d=12 result: the extended map is well-defined, stays inside Z_q throughout
    (0 out-of-range values across all d), and is injective by pigeonhole (2^12=4096 > q=3329),
    confirmed field-by-field by the exhaustive census, not merely the pigeonhole argument
    alone. The strict phrase "FIPS 203's own Compress_12" is not literally accurate and should
    be read with this caveat; the arithmetic and every claimed property still hold.
    No InsufficientSamplesError guard (Red Team, single-source, source-verified): grepped
    across estimator/*.py, only lwe_dual.py, lwe_guess.py and lwe_bkw.py raise this error for
    their own success conditions; lwe_primal.py/lwe_parameters.py raise it only for m<1 --
    there is no lower bound check tied to n anywhere in the primal_usvp/primal_bdd call graph.
    reduced_m=236 against n=1024 is not flagged, warned about, or rejected by the instrument in
    any way. Directly supports m2_magnitude_corrected_citable_wording above.
    Both protocol deviations (FIPS 203 PDF fetch; centering-bug fix) independently confirmed
    genuine and honestly described by both reviews, including a second, independent fetch of
    the primary source matching the producer's quoted text word-for-word and symbol-for-symbol,
    and independent confirmation that the one remaining uncentered-subtraction site
    (mutual_information_delta_bin_d12) cannot be affected by the wraparound bug because it only
    ever evaluates to 0 at d=12 (every fibre a singleton there).
    Null control at ML-KEM-512/768 (0 singletons at d_u=10, forced by the exact census, not an
    unexplored construction choice) independently confirmed by both reviews.

