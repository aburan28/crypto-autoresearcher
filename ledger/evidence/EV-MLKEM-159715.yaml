  termination_branch:
    branch: T-CIPHNOISE-CLOSED, read off PREREG-7 section 3.6's frozen precedence.
    read_off: >-
      T-CIPHNOISE-NODATA does not fire (Stage A clears F(a)/F(d); section 1's estimator
      infrastructure re-verification and API-surface check both succeed, independently
      re-confirmed by both reviews). The three parameter sets AGREE: ML-KEM-512 CLOSED
