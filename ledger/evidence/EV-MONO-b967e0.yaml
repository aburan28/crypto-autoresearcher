  run_ids: [RUN-MONO-98abb2-1]
  type: joint_regime_confirmation_non_discriminating_due_to_a_proven_coincidence_point
  direction: confirms_additive_form_on_a_new_joint_h_plus_h_minus_curve_but_does_not_exclude_the_named_rival
  strength: >-
    valid_exact_match_independently_reproduced_from_scratch_but_the_named_rival_also_matches_exactly_at_this_specific_point_by_a_proven_algebraic_identity_so_no_discrimination_occurred_here
  claim_tier: toy
  proof_status: empirical_only
  proof_status_note: >-
    A single exact measurement, independently reproduced. Unlike
    EV-MONO-fae201 (which achieved genuine discrimination), this run's
    own comparison is degenerate: both competing predictions are
    identical at the specific curve found, by a proven algebraic identity
    (see CORR-20260904-b9f9c1), so the exact match is real but
    non-informative as between the two named hypotheses.
  proof_refs:
    - experiments/EXP-MONO-98abb2/reviews/validator/validation-report.yaml (independent J1/J2 from-scratch reproduction; proof that h_+ != h_- is sufficient for non-coincidence)
    - experiments/EXP-MONO-98abb2/reviews/red-team/red-team-report.yaml (exact closed-form identity for D_prod - D_sum; tight max(h_+,h_-)>=2 characterization)
    - ledger/corrections/CORR-20260904-e526e0.yaml (original self-disclosure, superseded)
    - ledger/corrections/CORR-20260904-b9f9c1.yaml (superseding correction, severity and fix upgraded)

  summary: >-
    On a curve with h_+=1, h_-=1 simultaneously (p=103, A=1, B=11; n_+=58,
    n_-=42), found by the SAME fixed search order as the two prior
    experiments in this sub-thread, the exhaustive census of 161,700
    distinct-split base points matches the additive D3 prediction EXACTLY
    (R1_sum=R2_sum=0) -- but the named multiplicative rival D_prod ALSO
    matches exactly (R1_prod=R2_prod=0), because h_+=h_-=1 is, by a
    closed-form identity both independent reviewers proved
    (D_prod - D_sum = h_-(h_+-1)n_+ + h_+(h_--1)n_-), the UNIQUE point in
    the admissible domain {h_+>=1, h_->=1} where the two formulas
    coincide. The Validator independently reproduced every number from
    scratch (own group-law code, own classification driver) with zero
    disagreement, and independently proved h_+ != h_- is sufficient (given
    n_+,n_->0) to avoid the coincidence. The Red Team independently
    derived the full, tighter characterization and identified this as a
    RECURRENCE of the same degeneracy pattern already seen once in this
    sub-thread (EXP-MONO-4e6faa's own h_-=1 curve), leading to a
    superseding correction (CORR-20260904-b9f9c1) upgrading severity and
    replacing the proposed fix with the proven-tight condition
    max(h_+,h_-)>=2.

  what_this_supports: >-
    (1) The additive closed form D_sum = h_+ n_- + h_- n_+ continues to
    match exactly when BOTH terms are simultaneously nonzero -- a
    genuinely new confirmation the pure h_-, h_+=0 slice (KN-FIND-edd62c)
    could not provide, even though it does not by itself discriminate the
    additive form from every conceivable rival. (2) The specific named
    multiplicative rival D_prod is NOT excluded by this run, contrary to
    this experiment's own pre-registered expectation -- corrected in
    CORR-20260904-e526e0/CORR-20260904-b9f9c1.

  what_this_does_not_support: >-
    Does NOT discriminate the additive form from the named multiplicative
    rival (both match here). Does NOT, by itself, warrant extending
    KN-FIND-edd62c's own knowledge-corpus promotion to the full bivariate
    form -- that requires a follow-up on a curve where max(h_+,h_-)>=2,
    not yet run. Does not test the non-split strata. Does not make any
    relation-rate, cost, exponent, or cryptographic-scale claim.

  independent_review:
    validator:
      report: experiments/EXP-MONO-98abb2/reviews/validator/validation-report.yaml
      verdict: >-
        J1 (curve construction, blind census): holds, all facts and the
        full 161,700-point census independently reproduced from scratch.
        J2 (coincidence algebra): holds -- confirmed the h_+=h_-=1
        identity, and independently proved (case analysis + exhaustive
        39M-point bounded search) that h_+ != h_- is sufficient to avoid
        coincidence given n_+,n_->0 (guaranteed by the Hasse bound in the
        toy range). Proves-too-much control: passes, correctly predicts
        non-coincidence on both prior experiments' own curves. Zero
        disagreement with the Executor's reported values across 26
        compared quantities.
    red_team:
      report: experiments/EXP-MONO-98abb2/reviews/red-team/red-team-report.yaml
      verdict: >-
        J3 (correction completeness): the scope_of_error claim in
        CORR-20260904-e526e0 is numerically correct but under-cited the
        directly relevant precedent (EXP-MONO-4e6faa's own h_-=1
        degeneracy); recommended upgrading severity from low to medium
        since this is a recurrence of a previously-fixed pattern, not an
        isolated oversight. J4 (fix sufficiency): derived the exact
        closed-form identity D_prod-D_sum = h_-(h_+-1)n_+ + h_+(h_--1)n_-,
        proving the coincidence set over the admissible domain is exactly
        the single point (1,1) and that "h_+ != h_-" is sufficient but not
        tight; recommended the exact replacement "max(h_+,h_-)>=2".
    independent_session: true
    blindness_confirmed: >-
      Both reviewers launched as fresh subagents in one dispatch message.
      Validator disclosed a sibling red-team-report.yaml already existed
      when it checked, but its contents were never read. Red Team
      confirmed neither review directory existed when it started.

  metrics:
