    R2_sum_2plus1plus1: 0
    R1_prod_1^4: 0
    R2_prod_2plus1plus1: 0
    found_curve: {p: 103, A: 1, B: 11, Z: 3, tau: 4, n_plus: 58, n_minus: 42, h_plus: 1, h_minus: 1, D_sum: 100, D_prod: 100}
    curves_scanned_before_success: 10316
    stratum_size_censused: 161700
    coincidence_identity: "D_prod - D_sum = h_-(h_+-1)n_+ + h_+(h_--1)n_-, zero iff (h_+,h_-)=(1,1) over the admissible domain"

  source_refs:
