  proof_status: derivation
  proof_refs:
    - experiments/EXP-JMV-004/runs/RUN-JMV-004-a/cost_model.md
    - experiments/EXP-JMV-004/runs/RUN-JMV-004-a/crossover.csv
    - experiments/EXP-JMV-004/runs/RUN-JMV-004-a/constants_table.csv
    - experiments/EXP-JMV-004/runs/RUN-JMV-004-a/source_statements.md
    - "experiments/EXP-JMV-004/runs/RUN-JMV-004-a/analysis.md (section: 'COORDINATOR ADDENDUM (2026-09-07) -- C1 STATUS: PASSED (VAL-20260907-b0832b)')"
    - experiments/EXP-JMV-004/reviews/VAL-20260907-b0832b.yaml

  observations:
    - >-
      Sign of log(k/c), PRIMARY convention (k=Li(m)/2), q=2^256, read
      directly from crossover.csv: robust NEGATIVE (both logarithm
      conventions, all 5 swept C values, no degree- or log-convention flip)
      at delta=0.25 and delta=0.5 (10/10 cells each, e.g. rows
      bits=256,delta=0.25,{bits,natural},C in {0.5,1,2,4,8}, and the
      equivalent delta=0.5 rows).
    - >-
      At delta=1.0, q=2^256: C=0.5 flips sign between the bits and natural
      logarithm conventions (bits positive, natural negative;
      log_convention_flip_bits_vs_natural=True on both rows) --
      CONVENTION-DEPENDENT per E2-CONVENTION, not a directional result.
      C=1.0 under bits flips between the PRIMARY and ALT degree conventions
      (sign_half=negative, sign_full=positive, degree_convention_flip=True)
      -- also convention-dependent; under natural, C=1.0 is a clean
      negative (sign_half=negative, sign_full=negative, no flip). C in
      {2.0,4.0,8.0} is a clean negative under both conventions.
    - >-
      At delta=2.0, q=2^256: C in {0.5,1.0,2.0,4.0} gives sign_half=positive
      AND sign_full=positive under BOTH bits and natural log conventions
      (8/8 cells agree, zero flips of either kind) -- a fully
      convention-robust NON-VACUOUS result. C=8.0 gives sign_half=negative
      under both log conventions but sign_full=positive under both -- a
      pure degree-convention flip, reported CONVENTION-DEPENDENT, not as a
      directional negative.
    - >-
      Crossover (modelled reduction cost = rho = 2^(bits/2)), PRIMARY
      per-step variant (phi_l O(l^3), typical l ~ Theta(m)),
      delta=2.0, C=1.0, bits convention, read directly from crossover.csv:
      bits=160 -> cost_over_rho=4152.618358...  (cheaper_than_rho=False);
      bits=192 -> cost_over_rho=0.6103178524... (cheaper_than_rho=True);
      bits=224 -> cost_over_rho=0.0000637392... (cheaper_than_rho=True).
      Crossover bit size = 192 for this (log_convention, C, per-step
      variant) slice; analysis.md section 5 independently reports the same
      192-bit crossover for the natural log convention at the same
      (delta=2.0, C=1.0) slice. No crossover exists anywhere in the grid
      at delta in {0.25,0.5,1.0}, C=1.0, because sign_half never reaches
      positive at any grid bits value there (total cost recorded as
      NA_ratio_not_positive throughout).
    - >-
      For the OPTIMISTIC/CAVEATED per-step variants (velu O(l), sqrt_velu
      O(sqrt l), phi_l best-case l=2) at delta=2.0, C=1.0, bits, bits=160
      (the smallest grid bits value where sign_half first turns positive):
      cost_over_rho already far below 1 for all five non-primary variants
      (phi_l best-case l=2: 1.180e-22; velu typical: 9.669e-15; velu
      best-case: 3.777e-19; sqrt_velu typical: 2.951e-23; sqrt_velu
      best-case: 2.086e-23), all cheaper_than_rho=True. Per
      constants_table.csv's own applicability caveat (a uniformly random
      split prime generically lacks cheap rational l-torsion), these
      variants are not established as applicable to this setting and their
      earlier crossover must not be read as the load-bearing figure.
    - >-
      C1 (source-transcription control) passed via VAL-20260907-b0832b, an
      independent digit-level check against the retrieved, sha256-pinned
      PDF by a reviewer who did not produce the transcription. 4 of 5
      transcribed statements match exactly or as closely as the source
      permits (Theorem 1.1, Corollary 1.2's completeness gap, Lemma 4.1,
      Proposition 3.1). Section 4.3's k-formula is a partial match: the
      held numeric value (k=Li(m)/2) is asymptotically consistent with the
      source's actual formula (lambda_triv ~ pi(m)/e ~ m/(e log m)) for
      every cell this run's grid evaluates (|D|=4q always implies the
      source's own e=2 condition here), but the held transcription's
      stated mechanism ("one generator per split prime") is the opposite
      of the source's own text (two ideals of norm p per split prime,
      divided by the unit-count constant e), and e is absent from
      constants_table.csv. This does not change any already-computed cell
      (VAL-20260907-b0832b verdict_scope) and is handled by
      CORR-20260907-b7e0f3.
    - >-
      Independent internal replication of the deterministic computation
      (manifest.yaml DEV-3): a second Executor session re-executed
      compute_grid.py in an isolated scratch directory and diffed the
      resulting raw.json byte-for-byte against the committed one (only the
      non-deterministic elapsed_seconds field differed), and independently
      hand-recomputed one grid cell (bits=256, delta=1.0, convention=bits,
      C=1.0) at mp.dps=60 from first principles, matching the archived
      value exactly.

  inference: >-
    Under the branch-(a) proven, GRH-conditional bound of the JMV
    isogeny-expander random self-reduction, evaluated as a stated
    deterministic cost model (Proposition 3.1 walk length x phi_l O(l^3)
    per-step modular-polynomial cost, typical l ~ Theta(m)) at q up to
    2^512 and delta up to 2.0, the required eigenvalue separation
    log(k/c) is robustly vacuous at q=2^256 for the smaller swept degree
    parameters (delta in {0.25, 0.5}, across the full C sweep) and becomes
    robustly non-vacuous only at the largest swept delta (2.0), and only
    for 4 of the 5 swept values of the unpinned Lemma 4.1 constant C. At
    that same delta and C=1.0, the PRIMARY per-step cost model shows a
    genuine crossover against sqrt(n): the modelled reduction cost exceeds
    rho below 192 bits and falls below rho at and above 192 bits. All
    three of H-JMV-002's own quantitative predictions (a robust-negative
    cell at q>=2^128/delta<=1; a crossover ratio >=1 at some q>=128 bits;
    the delta needed for non-vacuity strictly exceeding the smallest
    tested delta) are satisfied by this grid. This supports H-JMV-002's
    scoped statement about the stated cost model's arithmetic, exclusively
    within the tested grid, the branch-(a) bound, and the cited/swept
    constants -- it is not a statement about ECDLB hardness, real attack
    cost, or GRH.

  boundaries:
    - >-
      Zero curve instances tested at any size. q enters only as a
      parameter of a deterministic closed-form model; nothing here is a
      measurement on P-256, on any NIST/Koblitz curve, or on any curve at
      all.
    - >-
      Scoped to branch (a) ONLY (the proven, explicit-constant GRH-
      conditional Lemma 4.1 bound). Branch (b) (a constant EXP-JMV-003
      would measure) is not approved, not executed, and not consumed
      anywhere in this run (manifest.yaml branch_b_and_exp_jmv_003_status).
    - >-
      Scoped to the swept grid exactly: q_bit_sizes in {64,...,512},
      delta in {0.25, 0.5, 1.0, 2.0}, C in {0.5, 1, 2, 4, 8}, both
      logarithm conventions for m's formula, PRIMARY degree convention
      (k=Li(m)/2) with the ALT convention (k=Li(m)) reported only as an
      E2-CONVENTION sensitivity check. No claim is made about any
      unswept delta, C, or q outside this grid, and no crossover claim is
      made for the OPTIMISTIC/CAVEATED per-step variants beyond the
      explicit caveat that they are not established as applicable.
    - >-
      The Section 4.3 k-formula's stated DERIVATION (not its numeric
      value) is confirmed inaccurate relative to the source by
      VAL-20260907-b0832b; see CORR-20260907-b7e0f3. This is numerically
      inert for every cell in this run's own |D|=4q grid but is a genuine
      transcription defect that should be repaired before this cost model
      is reused with a different |D| convention (e.g. one that could reach
      disc(O) in {-3,-4}, where e != 2).
    - >-
      Every quantitative statement is GRH-conditional (Lemma 4.1's bound
      is GRH-conditional as held and as confirmed against the source).
      Nothing here confirms or disconfirms GRH.
    - >-
      Vacuity findings are phrased, and must continue to be phrased, as
      "Corollary 1.2 is asymptotically sound but concretely UNPROVEN at
      the evaluated parameters under this model" -- never as "the
      corollary is false" or "the reduction fails in practice"
      (specification.yaml claim_boundary, invalidation_rules).
    - >-
      This is a reduction cost audit, not an attack. It produces no
      ECDLP attack, no attack-cost improvement, and must not be attached
      to GOAL-ECDLP-001, GOAL-CRYPTO-001, or read as evading the D1 or
      BAR-AMORT-D2 barriers, which concern attacks (RQ-JMV-001's own
      constraints; specification.yaml condition C2).

  unresolved_confounds:
    - >-
      C in {0.5,...,8} remains unpinned (Bach-Sorenson explicit GRH
      constants, JMV ref [2], not held in this program's corpus); the
      non-vacuity finding at delta=2.0 does not hold at C=8 under the
      PRIMARY degree convention (though it does under the ALT convention,
      making that specific cell convention-dependent rather than settled
      in either direction).
    - >-
      eps (Prop 3.1's |S|=eps*h parameter) is a declared, non-paper-sourced
      assumption (0.5, sensitivity-checked at {0.1,0.5,0.9}); it has no
      effect on the sign of log(k/c) (the headline quantity here) but does
      affect r/total cost weakly, inside a logarithm.
    - >-
      The with-precomputation cost variant (charging Phi_l's storage,
      order m^2 coefficients per step, k_half*m^2 for the full generating
      set) is reported only as a coefficient-count order of magnitude, not
      converted to a field-operation or byte figure, because no
      per-coefficient bit-size formula is held in this program's corpus
      (NOT_COMPUTABLE_WITHOUT_CITATION in constants_table.csv). The
      crossover finding above uses the free-precomputation variant only.

  obstruction_note: >-
    No `obstruction` block: per templates/research-records.md, that block is
    required only when `direction` is weakens|contradicts, or on a record
    closing a goal lane. This record's direction is `supports`, and
    EXP-JMV-004 is not attached to any goal lane (RQ-JMV-001 is explicitly
    detached from GOAL-ECDLP-001/GOAL-CRYPTO-001), so no obstruction datum
    is being recorded here. The reversal-question check (AGENTS.md
    "resource_check" discipline, applied out of diligence even though not
    schema-required for a supports-direction record) was still performed:
    no active theory in this program currently takes a vacuous-at-2^256 or
    non-vacuous-at-2^256 finding about the branch-(a) JMV separation as its
    own premise. KN-TECH-ee6696 (committed 2026-09-05, F3 row) explicitly
    records this as an open gap: "no KN-* record names the obstruction for
    the plain isogeny-walk-to-a-weaker-curve family (Jao-Miller-Venkatesan
    random self-reduction) on ordinary prime-field curves. The open
    question is RQ-JMV-001." H-ECTD-001 and H-ECTD-19017a (active) cite
    JMV's qualitative expander-mixing theorem (KN-LIT-237/KN-LIT-7631) only
    as weak motivation for their own, distinct HEUR-ECTD-TAIL-1 heuristic,
    and explicitly state this must be "validated via KS/exceedance against
    an explicit exchangeability null (within-class permutation), not via
    JMV citation alone" -- i.e. they do not take any concrete cost-model
    vacuity/non-vacuity conclusion as a premise, only the paper's
    qualitative mixing statement, and they say so explicitly. H-JMV-71b222
    (status: proposed, same RQ-JMV-001 track) is a separate
    source-transcription-verification and cross-level-connectivity
    hypothesis, orthogonal in scope to this run's concrete-cost-model
    finding and not premised on it. This finding is therefore a genuinely
    new, currently unconsumed datum, not a resource any committed theory
    already spends.

  reviewed_by: coordinator
