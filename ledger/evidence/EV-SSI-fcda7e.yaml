  observations:
    - >-
      EXP-SSI-S1 contract designed satisfying RT-CTRL-001: chi2_7 statistic on
      kernel-scalar residues mod 7, SIM-UNIFORM-KERNEL simulator with 4 calibration
      criteria, p=6143 toy parameter set, TV distance threshold >= 0.05.
    - >-
      Validator verdict REVISE: three of four RT-CTRL-001 elements PASS; Element 4
      (power analysis) FAIL due to mathematical errors in the derivation. Power
      analysis corrected (REV-1/REV-2): binding guarantee restated as power >= 0.95
      for concentrated biases at aggregate level, ~0.73 for diffuse biases.
    - >-
      REV-3 (control non-rejection alpha = 0.05) and REV-4 (basis-invariance note)
      applied as recommended improvements.
    - >-
      All experimental soundness criteria PASS: controls (PASS), stop rules (PASS),
      budget separation (PASS), preregistration (PASS), falsifiability (PASS),
      scope honesty (PASS).
    - >-
      One technical concern (minor): chi2_7 basis invariance makes canonical basis
      specification non-critical for the statistic but may affect reproducibility
      of individual scalar values. Noted in contract.
  inference: >-
    EXP-SSI-S1 is ready for Coordinator approval and subsequent execution. The
    contract is falsifiable, properly controlled, honestly scoped (toy-only), and
    the corrected power analysis is transparent about limitations for diffuse biases.
    The experiment's primary expected outcome is a clean negative (no leakage
    detected), which would validate the methodology and close the specific
    statistic/modulus/prime combination.
  boundaries:
    - No curve computation was performed; this is a design review.
    - No implementation exists yet; the contract specifies what to build.
    - No security claim, break, or asymptotic improvement is asserted.
    - Even a positive result at toy scale would not imply deployed SQIsign weakness.
    - Power guarantee is conditional on bias pattern (strong for concentrated, moderate for diffuse).
  unresolved_confounds:
    - >-
      Diffuse biases (TV = 0.05 spread across 3+ bins) have only ~0.73 power
      at aggregate level. A negative result for concentrated biases does not
      fully rule out diffuse biases.
    - >-
      Toy parameter (p=6143) may not reflect KLPT behavior at cryptographic scale.
      This is acknowledged in scope and evidence_class = toy_or_derivation_only.
  reviewed_by: coordinator
