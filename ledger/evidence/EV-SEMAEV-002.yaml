evidence:
  id: EV-SEMAEV-002
  hypothesis_id: H-SEMAEV-002
  experiment_ids: [EXP-SEMAEV-002]
  run_ids:
    - RUN-SEMAEV-yield-b12-s1
    - RUN-SEMAEV-yield-b12-s2
    - RUN-SEMAEV-yield-b12-s3
    - RUN-SEMAEV-yield-b14-s1
    - RUN-SEMAEV-yield-b14-s2
    - RUN-SEMAEV-yield-b14-s3
    - RUN-SEMAEV-yield-b16-s1
    - RUN-SEMAEV-yield-b16-s2
    - RUN-SEMAEV-yield-b16-s3
  type: empirical
  direction: neutral
  strength: inconclusive
  claim_tier: toy
  certificate_refs:
    - RUN-SEMAEV-yield-b12-s1
    - RUN-SEMAEV-yield-b14-s1
    - RUN-SEMAEV-yield-b16-s3
  observations:
    - all 9 runs completed_valid; one decomposition certificate per run verified
    - at bits=12 (decomposition counts 60-91) all structured/random yield ratios
      are <= 1.18
    - at bits=14-16 (counts 3-29) ratios scatter 0.55-2.33, tripping the 1.5x
      threshold in 4 cells but with inconsistent direction (random wins at b14s2)
  inference: >-
    The data do not discriminate a >1.5x structured yield advantage from no
    effect plus low-count sampling noise. The threshold excursions occur only in
    tiny-count cells whose Poisson intervals span 1.0, and the direction is
    inconsistent, so they are noise, not a structural effect. At the only
    adequately-powered cells (bits=12) the ratios corroborate no material
    structured advantage, consistent in spirit with the campaign's m=3
    rejected_scoped H-FB-001. The v1 protocol lacked a minimum-count power gate.
  boundaries:
    - toy prime fields, bits 12-16, m=2 (S_3), factor base size 20, 300 targets
    - independent clean-room implementation; not a substitute for m=3 EXP-FB-001
  unresolved_confounds:
    - yield-ratio variance uncontrolled at low decomposition counts (high bits)
    - only bits=12 cells are adequately powered
  reviewed_by: coordinator
