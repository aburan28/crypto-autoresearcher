  summary: >-
    A hash-bound deterministic reanalysis of the frozen 40-cell m=3 source
    grid supports the preregistered separation: Arm B's MITM split has lower
    counted field-addition work than exhaustive Arm A, while the structured
    query diagnostic is reported separately against matched random Arm C.
    The result is an implementation-level toy observation, not an ECDLP
    attack, theorem, asymptotic improvement, or oracle-specific speedup claim.
  observations:
    - metric: mean_field_operations_B_over_A
      value: 0.055657994843265765
      range: [0.03213432911649647, 0.09259259259259259]
      count: 40
      interpretation: >-
        The declared field-operation proxy charges the MITM split at about
        5.57% of exhaustive Arm A work across all valid cells.
    - metric: mean_field_operations_C_over_A
      value: 0.039343976718488036
      count: 40
      interpretation: >-
        The matched random-query MITM control has a separate field-operation
        ratio; this is not folded into the B/A split comparison.
    - metric: mean_candidates_verified_B_over_C_nonzero_C
      value: 3.7543605110164
      count: 40
      interpretation: >-
        Structured x-coordinate queries verify more candidates than matched
        random queries in this toy control. This descriptive ratio is not
        called a yield gain or speedup.
    - metric: relations_A_minus_B
      value: 0
      count: 40
      interpretation: >-
        Exhaustive and structured MITM arms have equal relation counts in all
        cells; no yield improvement is claimed.
  controls:
    source_hashes: PASS
    source_cells_and_arms: PASS
    arithmetic_identities: PASS
    right_half_cardinality_and_random_collision: PASS
    independent_validator: >-
      PASS in validation_report_v2.yaml after the provenance-only v3 correction;
      the earlier REVISE report remains immutable and is superseded for admission.
  inference: >-
    The measured constant-factor proxy reduction is attributable to the declared
    MITM split under the frozen m=3 implementation. The B/C diagnostic does not
    establish an oracle advantage; it instead supplies the required nearby
    control. Hash, arithmetic, and scope controls passed independently.
  boundaries:
    - >-
      All cells are 7-8 bit prime-field toy instances with m=3 and a two-way
      split; no crypto-scale correspondence is asserted.
    - >-
      Hash-table construction, lookup, allocation, cache, and memory-bandwidth
      costs are outside the field-operation proxy.
    - >-
      Pollard rho remains the generic asymptotic and memory baseline; no
      exponent improvement or practical-security reduction follows.
    - >-
      RUN-ECDLP-288336-001 is invalid provenance evidence and is not pooled
      with the valid repaired run.
  unresolved_confounds:
    - >-
      Other m, partitions, fields, curve families, oracle outputs, and full
      end-to-end wall-clock costs remain untested.
    - >-
      The candidate ratio is a descriptive query-control metric and does not
      by itself identify a cryptographic oracle mechanism.
  inventor_accounting:
    dominated_by: Pollard rho on the declared prime-field ECDLP scope
    sota_delta:
      generic_time_exponent: 0.0
      memory_exponent: 0.0
      data_query_improvement: 0
      cryptographic_security_bits_reduced: 0
    named_obstruction: >-
      In the tested scope the MITM table changes counted work by a constant
      factor while increasing memory; the query control supplies no oracle
      advantage signal.
    forward_guidance: >-
      Pursue a new structural ECDLP direction outside this exact x-oracle MITM
      boundary, or design a separately approved m/curve/oracle successor with
      the same charged controls.
