evidence:
  id: EV-ECDLP-cb151c
  hypothesis_id: H-SYC-b854f4
  hypothesis_id_note: >-
    Neutral zero-run static design-review evidence about the artifact
    EXP-SYC-75f7d2 only. It neither supports nor weakens H-SYC-b854f4, and it
    says nothing whatever about ECDLP, about any elliptic curve, or about any
    scale beyond the frozen toy ladder of 18, 21, 24, 27 and 30 bits.
  experiment_ids: [EXP-SYC-75f7d2]
  run_ids: []
  type: pre_implementation_design_review
  direction: neutral
  strength: inconclusive
  claim_tier: toy
  proof_status: not_applicable
  proof_status_note: >-
    No adverse transition rests on this record, so no refutation artifact is
    owed for a hypothesis-level negative and none is claimed. The batch did
    nonetheless produce a derivation-grade refutation artifact against clauses
    of the ARTIFACT under review: the red team's RT-OBJ-C evaluates the
    record's own frozen closed form at the record's own omitted preregistered
    parameter and exhibits an exact counterexample. That artifact is a
    statement about sentences in EXP-SYC-75f7d2, not about H-SYC-b854f4, which
    is why proof_status stays not_applicable at the hypothesis level. Its
    files are listed in proof_refs.
  proof_refs:
    - experiments/EXP-SYC-75f7d2/specification.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-a723af/tasks/TASK-20260815-1f5c95/design-repair-report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-a723af/tasks/TASK-20260815-1f5c95/runtime-session-receipt.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-a723af/archives/TASK-20260815-32220b/snapshot-receipt.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-a723af/reviews/TASK-20260815-508861/validation-report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-a723af/reviews/TASK-20260815-508861/runtime-session-receipt.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-a723af/red-team/TASK-20260815-47a2e9/red-team-report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-a723af/red-team/TASK-20260815-47a2e9/runtime-session-receipt.json
    - ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-a723af.yaml
  obstruction_note: >-
    No obstruction block is recorded and none is owed. Direction is neutral,
    no lane is closed, no hypothesis or experiment status moves, and zero runs
    exist, so there is no measured quantity over a stated scope that a later
    reader could reuse. Recording a prose obstruction here would be exactly
    the fatigue report AGENTS.md forbids.
  scope_statement: >-
    Independent Validator TASK-20260815-508861 (verdict incomplete, disposition
    REVISE, six named items) and independent Red Team TASK-20260815-47a2e9
    (verdict REVISE, fourteen objections) both reviewed the frozen snapshot
    dd84e57db95b66caa2e1445a79db309611deb06b of the zero-run static successor
    EXP-SYC-75f7d2. This record supports only withholding implementation,
    execution, approval and any status transition, and carrying the named
    defects and the exact open cap residuals into one further zero-run static
    successor. It is not empirical, cryptanalytic, performance, asymptotic,
    security-impact, closure or breakthrough evidence, and no figure in it may
    be read as a crypto-scale, transfer or extrapolation claim.
  review_verdicts:
    validator: 'incomplete / REVISE'
    red_team: REVISE
  snapshot_reviewed:
    commit: dd84e57db95b66caa2e1445a79db309611deb06b
    snapshot_task_id: TASK-20260815-32220b
    producer_task_id: TASK-20260815-1f5c95
    experiment_id: EXP-SYC-75f7d2
    supersedes_experiment_id: EXP-SYC-b11b38

  # =================================================================
  # 1. The convergent defect: the batch's strongest evidential fact
  # =================================================================
  convergent_defect:
    id: CONVERGENT-C-HA2-1
    reached_independently_by:
      - VAL-A723AF-R2
      - RT-OBJ-A
    contact_between_reviewers: none
    statement: >-
      Specification clause C-HA2-1-deterministic-worst-case infers worst-case
      INADEQUACY of candidate_index capacity 32 from the UPPER bound
      X <= 8*(L-1), with no attainment witness anywhere in the record, its read
      scope, or the inherited compiler. An upper bound lying above capacity
      shows only that no worst-case adequacy certificate is available; it does
      not show that any admissible instance actually reaches 33.
    why_the_asymmetry_is_internal: >-
      The successor's other two item-(b) claims do supply attaining laws. C-HA2-2
      exhibits the two-point law on {0, 33} with mass E[X]/33 at 33, which
      attains the Markov bound exactly. C-HA2-3 exhibits the covering
      construction, which attains familywise probability 1 at the tabulated
      slices. C-HA2-1 alone asserts a definite_negative_fact with no witness,
      so the defect is measured against the artifact's own standard of proof.
    regression_against_the_immutable_predecessor: >-
      EXP-SYC-b11b38 phrased it correctly as "cap adequacy is not proved in the
      simultaneous-tail or worst-case sense". The successor converted a correct
      NOT-PROVED into an incorrect PROVED-NOT. That the FAIL_not_worst_case_safe
      label was inherited from TASK-20260813-e04de4 does not validate the
      inference; a review label is not a proof.
    also_affects: >-
      the specification limitations line "No finite-N candidate_index tail
      exists", which should read that no finite-N tail BOUND is DERIVABLE from
      HA-2; and C-HA2-5, which relies on C-HA2-1 having settled the matter.
    what_is_unaffected: >-
      The operative contract is identical under either phrasing: capacity
      adequacy is not claimed, a realized occupancy above 32 invalidates the
      apparatus without truncation, and implementation stays blocked. This is a
      precision defect in a stated negative, not a hidden positive claim.
    independence_qualifier: 'see independence_limitation below; the convergence is by session, not by model'

  # =================================================================
  # 2. RT-OBJ-C: the sharpest finding, independently recomputed
  # =================================================================
  sharpest_finding:
    id: RT-OBJ-C
    severity: blocking_for_item_b
    recomputed_by_the_dispatching_session: true
    recomputation_result: CONFIRMED_EXACTLY
    preregistration_gap: >-
      H-SYC-b854f4's frozen test_boundary declares FOUR preregistered
      coverage_gamma_values, namely 0/1, 5/18, 3/10 and 1/3. EXP-SYC-75f7d2
      tabulates TWO of them and omits the hypothesis's own declared leading
      null, gamma_x = 0/1.
    counterexample_at_one_ladder_point:
      gamma_x: '0/1'
      bits: 30
      family_size_m: 32768
      expected_X: 0.0009765625
      expected_X_form: 'E[X] = 2^-10 at gamma_x = 0/1 and bits = 30'
      familywise_first_moment_bound: 0.9696969697
      familywise_first_moment_bound_exact: '32768 * 2^-10 / 33 = 32/33'
      bound_status: 'NON-VACUOUS from HA-2 alone, strictly less than 1'
      covering_arc_length_p: 2.959280e-05
      one_over_m: 3.051758e-05
      covering_construction_status: >-
        FAILS its own stated hypothesis p >= 1/m at this point, so the arcs do
        not cover [0,1) and the familywise supremum there is 32/33, not 1.
    exact_crossing_rule: 'gamma_x <= 1/3 - (15 - log2 33)/bits'
    crossing_by_size_m_32768:
      - bits: 18
        crossing_gamma_x: -0.21975588
        contains_admissible_gamma: false
      - bits: 21
        crossing_gamma_x: -0.14074314
        contains_admissible_gamma: false
      - bits: 24
        crossing_gamma_x: -0.08148358
        contains_admissible_gamma: false
      - bits: 27
        crossing_gamma_x: -0.03539281
        contains_admissible_gamma: false
      - bits: 30
        crossing_gamma_x: 0.00147980
        contains_admissible_gamma: true
        contains_the_declared_null: true
    the_correction_opened_the_window:
      confirmed_by_the_dispatching_session: true
      statement: >-
        Under the PRE-correction family size m = 98304 the crossing is negative
        at every ladder size, reaching only -0.05135228 at bits = 30, so the
        blanket sentences would have held. The record's own 98304 -> 32768
        correction is what OPENED this window, and the blanket sentences were
        NOT re-checked after it was applied. The correction itself is right and
        conservative in the direction claimed; the defect is the un-rechecked
        prose.
    what_this_falsifies_at_exactly_one_ladder_point:
      - 'C-HA2-4: "no reparameterisation inside the frozen ladder can rescue it"'
      - 'B-R1: "permanently under HA-2 as stated"'
      - 'the specification success_criterion: "capacity adequacy is not derivable from HA-2 at all"'
      - 'the design-repair-report summary: "it will never be closed by a better argument from the current heuristic"'
    what_this_does_not_establish: >-
      Nothing about capacity adequacy in fact, nothing about H-SYC-b854f4's
      truth, and nothing outside the single point (gamma_x = 0/1, bits = 30) at
      m = 32768 and capacity 32. It establishes only that the record closed a
      question it had not closed.

  # =================================================================
  # 3. RT-OBJ-D: the method ceiling was UNDER-reached
  # =================================================================
  under_reached_method_ceiling:
    id: RT-OBJ-D
    severity: blocking_for_item_b
    statement: >-
      C-HA2-6 ROUTE-A says a NEW numbered heuristic, provisionally HA-2T, would
      be required to constrain the second moment. That second moment is ALREADY
      numbered HA-3-subpolynomial-root-clustering in the same hypothesis record
      H-SYC-b854f4, which the producer read to obtain HA-2. HA-3 states
      kappa_N = E[X^2]/E[X] = N^o(1) for gamma_x < 1/3, about the same X.
    consequence_recorded_not_endorsed: >-
      The red team recomputed both branches. Under the record's own frozen
      convention o(1) := 0, kappa_N = 1 forces X into a Bernoulli law and the
      overflow probability becomes exactly 0, which would make the C-HA2-3
      covering law inadmissible. Without that convention, with kappa_N = K
      constant, the exact per-tuple maximum is (K-1)*mu/1056 and the familywise
      first-moment bound is non-vacuous for kappa_N below roughly 1.0645 to
      1.1023 across the ladder. NEITHER branch establishes capacity adequacy and
      this record does not assert it; the red team imposed the same discipline
      on its own objection.
    what_it_does_establish: >-
      method_ceiling_reached_here is wrong in the rarer direction: the ceiling
      was UNDER-reached, not over-claimed. C-HA2-6 is the one clause that
      claims to enumerate what would suffice and it omits the cheapest live
      route, available with no new heuristic, no hypothesis amendment and no
      write-scope expansion.
    second_order_finding: >-
      The frozen o(1) := 0 convention is load-bearing in BOTH directions, and
      the record deployed it only in the direction that produces a negative.

  # =================================================================
  # 4. RT-OBJ-F: blocking for item (c)
  # =================================================================
  item_c_completeness_hole:
    id: RT-OBJ-F
    severity: blocking_for_item_c
    statement: >-
      The frozen replacement rule is system_peak_live_bytes =
      max_t ( S(t) + sum over j = 1..8 of B_j(t) ), where S is bytes live in
      shared regions and B_j is bytes live in shard j's non-shared regions. The
      record's own replacement_rule.time_base declares all eight shards AND THE
      SETUP PROCESS co-located on a single host. The setup process's private,
      non-shared allocations belong to no shared region and to no B_j, so the
      formula omits them entirely and returns zero for a host holding only setup
      allocations. budget.maximum_memory_gb = 2 is a HOST-level quantity, which
      is exactly the quantity the formula fails to compute. No FORBIDDEN-R rule
      covers the omission: FORBIDDEN-R6 covers a missing SHARD stream only.
    why_it_is_a_defect_and_not_a_residual: >-
      Item (c) IS the replacement-rule repair, so a completeness hole in the
      replacement rule is a defect in the deliverable itself.
    cheapest_falsifier: >-
      one line, KAT-PEAK-F: the setup process allocates 4096 private non-shared
      bytes live on [0,20), no shard allocates anything, no shared regions
      exist. True system peak 4096; the frozen formula returns 0.

  # =================================================================
  # 5-6. Validator-named defects independently confirmed
  # =================================================================
  validator_named_defects:
    - id: VAL-A723AF-R1
      item: b
      class: arithmetic_error
      severity: minor_must_fix
      confirmed_by_the_dispatching_session: true
      statement: >-
        The specification's C-HA2-6 ROUTE-B text "this forces the index width
        above U8 (8184 needs 14 bits)" is wrong. 2^13 = 8192 >= 8184, so 13
        bits suffice, and even reserving one sentinel value keeps the
        requirement at 8192 values and therefore 13 bits.
      same_check_confirms_the_surrounding_row: >-
        8*(L-1) equals 504, 1016, 2040, 4088 and 8184 and the excesses over
        capacity 32 are exactly 472, 984, 2008, 4056 and 8152. Those are exact.
      what_is_unaffected: >-
        13 bits still exceeds U8 and still forces at least a 2-byte
        byte-aligned field, so B-R3's "widens from 1 byte to at least 2" stays
        correct and ROUTE-B is not adopted in any case.
    - id: VAL-A723AF-R3
      item: c
      class: conformance_gap_against_the_frozen_requirement
      severity: moderate
      statement: >-
        KAT-PEAK-D binds SEVEN simultaneous shards plus one staggered shard,
        while the frozen BATCH-080a9c blocker SYSTEM-PEAK-LIVE-CONCURRENCY
        names EIGHT simultaneous shards, one staggered shard and shared
        allocation counted exactly once. The record nonetheless claims literal
        conformance.
      why_the_deviation_may_be_the_better_design: >-
        With eight simultaneous shards plus a staggered one, FORBIDDEN-R2 and
        FORBIDDEN-R3 would both evaluate to 24 and the fixture would not
        separate them; D as written separates them at 24 versus 22. The defect
        is the assertion of literal conformance, not the 7+1 choice.
      required_repair: record the deviation and its reason explicitly as a reasoned deviation.
    - id: VAL-A723AF-R5
      item: b
      class: scoping_and_derivational_precision
      severity: minor
      statement: >-
        Three sentence-level corrections with no figure movement: C-HA2-2's
        supremum is over the frozen-convention mean rather than over HA-2 as
        literally written; C-HA2-4's non-vacuity conditions should be strict
        inequalities, since at equality the clipped bound is exactly 1 and
        still vacuous; and C-HA2-3's "entire interval [0,1], both endpoints
        attained" is proved only at the endpoints, the mixture argument being
        missing rather than wrong.
    - id: VAL-A723AF-R6
      item: cross_cutting
      class: accuracy_of_a_stated_count
      severity: cosmetic
      statement: >-
        The design-repair-report summary says "Ten residuals remain open" while
        the enumerated identifiers number thirteen. No residual is dropped and
        both artifacts enumerate the same thirteen; only the count label is
        wrong.

  # =================================================================
  # 7. What survived: the clean integrity finding
  # =================================================================
  what_survived_both_reviews:
    arithmetic_core_confirmed_by_both:
      - 'every E[X] literal at gamma_x = 5/18 and at gamma_x = 1/3, to sixteen places'
      - 'the Markov bound P[X >= 33] <= E[X]/33, WITH its attaining two-point law, so the per-tuple bound is exact and HA-2 is informative per tuple'
      - 'the covering construction, valid AT THE TWO TABULATED SLICES only'
      - 'the union-bound closed forms 2^(15 - bits/18)/33 and 2^(15 - bits/18)/11'
      - 'both non-vacuity thresholds, 179.20090585 and 207.73023086'
      - 'the deterministic rows 504/1016/2040/4088/8184 and the excesses 472/984/2008/4056/8152'
      - 'every cap figure, including the three residuals and the two unaffected slacks'
      - 'all five KAT-PEAK fixtures with their falsifier values, the dedup check and the validity bracket'
      - 'all cited sha256 literals, each recomputed from the committed objects'
    integrity_finding:
      statement: >-
        NEITHER review found a fabricated hash, an invented run, a fabricated
        timing or statistic, a raised cap, a silently dropped residual, an
        experiment execution, a generated curve, a status transition, or any
        crypto-scale, ECDLP, curve or transfer reading. The red team searched
        specifically for a transfer reading and found zero. Every objection in
        both reports is about reach, completeness or framing, not about
        integrity.
      scope: 'the two artifacts at snapshot dd84e57db95b66caa2e1445a79db309611deb06b'

  # =================================================================
  # 8. Item (d) remains open
  # =================================================================
  item_d_open:
    status: NOT_REPAIRED_AND_CORRECTLY_DISCLOSED
    archive_over_cap_bytes: 3256009664
    communication_over_cap_bytes: 3285369792
    output_over_cap_bytes: 7132160
    caps_unchanged: true
    disclosed_alternative_archive_derivation_over_cap_bytes: 5405757888
    both_reviews_recomputed_every_figure: true
    why_it_could_not_be_closed_here: >-
      Closing it requires a Coordinator-authorised cap amendment or scope
      reduction recorded as a versioned protocol_amendment. This batch held
      neither authority. Declining to close it is correct behaviour, not a
      failure, and it is the reason the four-item contract is incomplete.
    open_qualifications_from_the_red_team:
      - 'RT-OBJ-H: the smaller of two disclosed derivations was adopted with a rationale that runs the wrong way for the operative amendment decision.'
      - 'RT-OBJ-I: the adopted x3 triples an 8388608-byte output reserve embedded in archive_hashing while the output cap stays 8388608.'
      - 'RT-OBJ-J: D-R4 is an unsearched closure presented as a finding, standing beside a candidate the record itself named in OBS-2.'
      - 'RT-OBJ-K: the seven-artifact overage attribution is minimal only within an undeclared packed-stream-preserving policy class; 23 four-artifact drop sets also fit.'
      - 'RT-OBJ-M: exact event-time peak evaluation has an uncharged event-log cost that lands on this same open item.'

  # =================================================================
  # 9. Disclosed defect in the DISPATCHING SESSION'S OWN work
  # =================================================================
  disclosed_defect_in_this_programs_own_archival_work:
    raised_as: OBS-V1
    raised_by: TASK-20260815-508861
    confirmed: true
    subject: coordination/goals/GOAL-ECDLP-001/batches/BATCH-a723af/archives/TASK-20260815-32220b/snapshot-receipt.json
    statement: >-
      The snapshot receipt committed at dd84e57d retains the authoring
      Coordinator's prose fields hash_provenance.path_sha256_state
      EMPTY_BY_CONSTRUCTION_NOT_BY_OMISSION,
      hash_provenance.parent_sha_state NULL_BECAUSE_UNOBSERVED_NOT_BECAUSE_ABSENT
      and hash_provenance.computed_by_this_session 0, while the committed file
      carries three real path_sha256 values and an observed parent_sha. The
      dispatching session added the provenance keys when filling and did not
      update those state fields. self_inclusion.difference_here and
      reader_warning are stale for the same reason.
    direction_of_error: >-
      CONSERVATIVE. It understates what is present. The validator recomputed all
      three declared hashes from the committed blobs and all three match, and
      the red team independently confirms the same three, so the archive IS
      content-bound for the three producer artifacts.
    blocking: false
    disposition: >-
      The receipt is committed and immutable. It is recorded here for
      supersession by a future correction record. No edit to it is proposed and
      none may be made.

  # =================================================================
  # 10. Independence limitation, stated plainly
  # =================================================================
  independence_limitation:
    validator_resolved_model: claude-opus-5
    red_team_resolved_model: claude-opus-5
    independent_by_session: true
    independent_by_model: false
    statement: >-
      Both reviews of THIS batch resolved to claude-opus-5. They ran in
      separate, fresh sessions with no contact, so they are independent by
      SESSION, but they are NOT independent by MODEL. The convergence recorded
      in convergent_defect is therefore WEAKER evidence than cross-model
      convergence would be, and it must not be described anywhere as
      independent corroboration across models.
    note_on_the_red_teams_own_receipt: >-
      The red team's independence_attestation observes that the two
      provenance-clean reviews of the PREDECESSOR, TASK-20260813-dec63b and
      TASK-20260813-e04de4, were served by gpt-5.6-sol. That was true of the
      predecessor batch. It is not true of this one: BATCH-a723af obtained no
      cross-family review, and the red team's inference of model-family
      independence for its own review does not extend to the pairing that
      produced the convergence.
    consequence: >-
      A correlated-model failure mode common to both reviews cannot be excluded
      by this batch. Any later reader weighting the convergent defect must
      apply this discount.

  # =================================================================
  # Boundaries
  # =================================================================
  boundaries:
    - 'Zero experiment runs exist. EXP-SYC-75f7d2 declares maximum_runs 0, and the producing role''s committed tool surface has no shell, so zero runs is structurally true and not merely declared.'
    - 'No run record, evidence beyond this record, seed stream, curve, target, fixture execution or measurement exists anywhere in the reviewed set.'
    - 'Nothing here is negative mathematical evidence. No apparatus, capacity, provenance, cap or budget residual recorded above bears on H-SYC-b854f4 or on ECDLP (AGENTS.md rule 3).'
    - 'Toy 18-to-30-bit ladder with 32 curves, 256 roots, 4 public models and 3 eta strata. transfer_authorized is false and cryptographic_scale_claim is forbidden in the reviewed scope.'
    - 'The 179.20090585-bit non-vacuity threshold is an arithmetic property of a frozen symbolic expression at fixed capacity and fixed family size. It is NOT a transfer, an extrapolation of a measurement, or a statement about parameterisation at a cryptographic order, and it may never be quoted without this sentence.'
    - 'Pollard rho at about 0.886*sqrt(N) group operations and standard BSGS remain the unchallenged program baselines. Nothing in this batch challenges, approaches or comments on them.'
    - 'Whether X can actually reach 33 in the real apparatus is undecided and cannot be decided from a static record; that is precisely the gap named in CONVERGENT-C-HA2-1.'
    - 'The verdicts bind to the bytes at dd84e57db95b66caa2e1445a79db309611deb06b and to nothing later.'
    - 'Both reviews resolved to the same model; see independence_limitation.'
  unresolved_confounds:
    - 'Producer and reviewer model identities are runtime self-reports; no provider-side attestation exists and the committed bindings carry last_probed null.'
    - 'The inherited archive multiplier and communication extrapolation rest on no per-record byte formula in either compiler document, so the three cap residuals are exact arithmetic over an inexact derivation.'
    - 'RT-OBJ-E leaves it unstated which of two readings reconciles the 32768 distinct-variable count with the 8*(L-1) row derived by dividing the census by 98304. The direction of the item-(b) conclusion is unaffected; the record''s internal consistency is not.'
  implementation_authorized: false
  execution_authorized: false
  experiment_runs: 0
  scientific_status_changed: false
  claim_tier_moved: false
  hard_cap_raised: false
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Zero-run dual-REVISE static design review. The only durable candidates are
      defects in an unapproved artifact, and the strongest evidential fact
      (CONVERGENT-C-HA2-1) rests on two same-model reviews. Strength is
      inconclusive, far below the replicated/strong bar, and nothing here is a
      finding about ECDLP, about H-SYC-b854f4, or about any object outside this
      batch's own paperwork.
  reviewed_by: coordinator
  recorded_at: '2026-08-15'
  recorded_by_task: TASK-20260815-a943bf
