  claim_tier: toy
  certificate_refs: []
  certificate_refs_note: >-
    This record's own claim (scoped_homogeneity / resource_incomplete) is not
    a claimed solve or relation, so certificate_refs is empty per
    docs/claims-and-verification.md; both runs' top-level certificate.kind is
    none (pure measurement runs). Real nested kind:discrete_log rho/bsgs
    sub-certificates exist and were independently re-verified (see
    proof_refs and observations below); they back CTRL-RHO/CTRL-BSGS, not a
    claimed discovery of this evidence record.
  proof_status: empirical_only
  proof_refs:
  - coordination/goals/GOAL-ECTD-001/batches/BATCH-fca4e2/reviews/TASK-20260806-5bc785/validation_report.yaml
  - coordination/goals/GOAL-ECTD-001/batches/BATCH-fca4e2/reviews/TASK-20260806-5bc785/validation_notes.md
  - coordination/goals/GOAL-ECTD-001/batches/BATCH-fca4e2/archives/TASK-20260806-4455ac/snapshot-receipt.json
  - experiments/EXP-ECTD-001/runs/RUN-ECTD-001-screen/raw-result.json
  - experiments/EXP-ECTD-001/runs/RUN-ECTD-001-screen/per_class_meter_tables.json
  - experiments/EXP-ECTD-001/runs/RUN-ECTD-001-screen/planted_control_receipt.json
  - experiments/EXP-ECTD-001/runs/RUN-ECTD-001-screen/permutation_stability_table.json
  - experiments/EXP-ECTD-001/runs/RUN-ECTD-001-screen/null_arm_receipts.json
  - experiments/EXP-ECTD-001/runs/RUN-ECTD-001-screen/rho_bsgs_receipts.json
  - experiments/EXP-ECTD-001/runs/RUN-ECTD-001-impl/raw-result.json
  - ledger/hypotheses/H-ECTD-001.yaml
  - experiments/EXP-ECTD-001/specification.yaml
  observations:
  - >-
    RUN-ECTD-001-screen completed all 5 designed classes (class_seed_201
    through class_seed_205, master seed range per spec), every completed
    class landing at exactly 40-bit N (root cause in F-3 below). No class's
    meter reading passed the full confirmed-outlier gate (permutation-stable
    AND null-passing AND excludes the planted curve); decision_branch:
    scoped_homogeneity per spec.decision_table, independently recomputed by
    TASK-20260806-5bc785 from raw per-class data rather than trusted from the
    producer's stated field, and reaching the same branch. CTRL-PLANTED-
    OUTLIER's planted curve was genuinely recovered as an outlier in every
    completed class (the instrument-validity gate), ruling out
    instrument_void.
  - >-
    RUN-ECTD-001-impl completed 1 designed class as an implementation smoke
    test (not a homogeneity-scale run); decision_branch: resource_incomplete,
    independently confirmed by the same reviewer. Contributes no homogeneity
    reading in either direction.
  - >-
    Independent Validator TASK-20260806-5bc785 (independent_session: true,
    policy review-adversarial, resolved_model_id claude-sonnet-5,
    fallback_used: true and disclosed) returned verdict valid. AC-1..AC-6
    (commit/artifact integrity) all PASS with all 38 non-self-referencing
    path_sha256 entries independently recomputed and matched. MR-1..MR-4
    (metric recomputation) all pass, including a full byte-exact
    from-scratch reproduction of class_seed_203 and 3/3 independent rho/bsgs
    k*G=Q spot-checks. CTRL-PLANTED-OUTLIER, CTRL-PERMUTATION,
    CTRL-OUTSIDE-CLASS, CTRL-DEGREE-PROFILE, CTRL-RHO, CTRL-BSGS all PASS on
    independently re-derived raw data. All 5 self-tests independently
    re-executed and passed.
  - >-
    Validator finding F-1 (severity material): CTRL-RHO's stated empirical
    justification for substituting plain for negation-map Pollard rho
    ("~2.5% degenerate collisions, >500x sqrt(N) step counts") is
    unsubstantiated by any artifact in the committed tree and reads as a
    fabricated statistic under AGENTS.md rule 9. Independently reconfirmed by
    the dispatching Coordinator session directly against the driver code and
    both runs' logs (no negation-fold implementation exists anywhere; no
    log/artifact contains the cited figures; the shipped degenerate_restarts
    counter measures the generic trivial-relation case, not a negation-
    specific pathology). Recorded as CORR-20260806-2f98f4 in this same
    archive commit. Scope: confined to the prose justification for the
    substitution; does NOT touch any reported meter value, certificate, or
    the decision_branch determinations above, all independently re-derived
    from raw data by the Validator and, for one certificate and the
    meter-constancy finding, separately re-derived by the dispatching
    session itself before the Validator's report existed.
  - >-
    Validator finding F-2 (severity minor, on the merits a genuine
    structural N/A): CTRL-NO-CLASS-INVARIANT-ENDPOINT is absent from every
    committed artifact, not even as an N/A note, though EXP-ECTD-001 never
    nominates a secret endpoint under any decision_branch (spec's own
    what_this_experiment_is_NOT is explicit) so the control's precondition
    never arose. Recorded here as the N/A ruling the finding itself
    recommended, in ledger/hypotheses/H-ECTD-001.yaml's updated notes, rather
    than left unrecorded.
  - >-
    Validator finding F-3 (severity minor): the disclosed N-bit-range
    deviation text ("uses the low end of the [40,44] range") understates how
    narrow the achieved scope is -- every observed N is exactly 40 bits,
    never 41-44, because driver/fp.py's random_prime returns an exact-width
    prime and Hasse's theorem confines N to that width regardless of the
    [40,44] band passed to find_seed_curve. Compliant with the letter of the
    frozen n_bit_range=[40,56]; the achieved-scope framing is corrected in
    H-ECTD-001.yaml's status_scope.scope_boundary_note rather than by editing
    the frozen spec or the immutable run package.
  - >-
    Validator finding F-4 (informational): groebner_solving_degree_d_reg=14
    and macaulay_rank_defect_at_first_fall=2 are identical across every
    tested curve at this toy parameter regime (fb_size=8). The Validator
    independently assessed this as a plausible genuine combinatorial-
    invariant effect, not an aliasing bug, on independent mathematical
    grounds (consistent with KN-FIND-c41ea9's fixed-structure finding for
    the m=3 Semaev cycle type). The dispatching session separately
    reproduced meter constancy on two fresh curves with different (a,b)
    under a different RNG seed before the Validator's report existed,
    ruling out an aliasing bug by direct re-execution. Practical
    consequence: these 2 of 5 primary meters carried zero discriminating
    power in this toy configuration; recorded as an instrument limitation
    for future EXP-ECTD-001-family batches, not as a defect in this run.
  - >-
    Validator finding F-5 (informational): no trapdoor / crypto-scale /
    exponent-improvement language found anywhere in the 39 committed
    artifacts; the one match is a negation/prohibition disclaimer, not a
    claim.
  - >-
    No experiment beyond EXP-ECTD-001's frozen scope was run. No trapdoor
    signal of any kind. No ECDLP exponent claim. All four asymptotic-claim
    promotion gates remain OPEN (unchanged from EV-ECTD-002).
  inference: >-
    scoped_homogeneity on the 5-class screen weakens H-ECTD-001's confirmed-
    outlier reading at 40-bit N, and only that reading; it does not license
    support, reject_scoped, or any statement about the mechanism's broader
    scope, path-hiding, or crypto-scale relevance. resource_incomplete on the
    impl run is a budget/scope fact about a 1-class smoke test, not a second
    homogeneity data point. The material fabrication defect found in the
    rho-substitution justification text (F-1 / CORR-20260806-2f98f4) is
    disclosed and scoped; it changes the record's honesty bookkeeping, not
    the empirical reading above, which two independent parties (Validator
    and Coordinator) each re-derived from raw data rather than from that
    prose.
  boundaries:
  - Toy tier only (all completed classes at exactly 40-bit N). No claim about
    41-56-bit N, medium, or crypto-scale curves.
  - Single, unreplicated batch. No second seed, second host, or second
    independent implementation of the driver exists yet.
  - >-
    Screen coverage is 5 classes; the hypothesis's own statement requires
    ">=5 enumerated classes" as a floor, not a ceiling -- this is the minimum
    admissible class count, not a broad sweep.
  - No path-hiding, public-detection, vertical-barrier, or DDH claim; those
    lanes (IDEA-20260731-017/018) are untouched by this evidence.
  - >-
    2 of the 5 primary meters (d_reg, macaulay_rank_defect) carried zero
    discriminating power at this toy fb_size=8; only the remaining meters
    were informative discriminators in this run (F-4).
  unresolved_confounds:
  - >-
    CORR-20260806-2f98f4: the plain-vs-negation-map rho substitution's
    stated empirical justification is fabricated prose with no supporting
    artifact; the substitution itself remains a legitimate disclosed
    protocol deviation, but its documented rationale must not be cited as a
    measurement in any future record.
  - >-
    CTRL-NO-CLASS-INVARIANT-ENDPOINT was not recorded as N/A in the run
    package itself (F-2); the N/A ruling now lives in this evidence record
    and in H-ECTD-001.yaml rather than in the immutable run artifacts.
  - >-
    KN-LIT-7633 Dent-Galbraith PDF citation_verified:false carries over
    unresolved from EV-ECTD-002 (still blocks PI-C; not exercised by this
    batch).
  reviewed_by: coordinator
