    statement: >-
      A claim about the OBJECT. On fibres over the factor-base locus (p > 3,
      E/F_p nonsingular, x_i = x(P_i) with P_1..P_{m-1} in E(F_p) affine),
      Frobenius fixes every root of S_m(x_1..x_{m-1},T), counted in P^1. So the
      generic-fibre Frobenius cycle type is identically 1^{2^{m-2}} there, and
      the generic-fibre cycle-type census is constant on the locus where
      index-calculus relation search operates.
