  run_ids: []
  run_ids_absent_reason: >-
    ZERO CHARGED EXPERIMENT RUNS WERE AUTHORISED OR CONSUMED. batch.yaml
    declares `charged_runs_authorised_this_batch: 0` and defines the term: a
    charged run is a run directory, a RUN-* identifier, a manifest, an armed
    deadline and a consumed ceiling. This batch created none of those. Every
    execution in it is either an ACCEPTANCE TEST of the producer's own suite or
    a REVIEWER'S ADVERSARIAL PROBE, and neither is a run under a contract.
    Naming a RUN-* here would be a fabricated identifier (AGENTS.md rule 9).
    The executions are identified instead by their archived artifacts, which are
    bound by content: the producer's twelve declared artifacts and twelve
    disclosed `failed_infrastructure` artifacts under
    coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/tasks/TASK-20260826-602395/,
    and each reviewer's probe directory under
    coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/reviews/.
    `maximum_runs: 1` appears on every queue handoff for the mechanical reason
    disclosed as PD-1 (tools/research_dispatch.py `validate_handoff` rejects a
    non-positive integer); the field value is the dispatcher's minimum and is
    not an authorisation.
  type: instrument_repair
  type_note: >-
    Vocabulary chosen to match this batch's declared claim ceiling
    `instrument_repair` rather than the template's empirical/theoretical/
    literature triple, following the precedent EV-MLKEM-59e4a4 set with
    `instrument_control` in this same goal. The word is descriptive; it asserts
    nothing beyond what `observations` below state.
  direction: neutral
  direction_note: >-
    NEUTRAL, AND NOT FOR WANT OF A SIGNAL. There is no mathematical proposition
    for this record to support or weaken: it records that six named defects of a
    recording instrument were repaired and that the repairs FIRE at d=64
    surrogate scale. An instrument that can now record an outcome has not
    observed one. The one WEAKENING this batch produced is against the WORDING
    of a committed prior decision, not against any evidence or hypothesis, and
    it is recorded in DEC-20260826-9d7d93 rather than as a direction here (see
    observation 7).
  scale_of_every_observation: >-
    STATED ONCE, BINDING ON EVERY LINE BELOW. d=64 only. Producer board: d=64,
    beta=20, mpfr_bits=53, q=3329, one seed, one host, fpylll 0.6.4, psutil
    7.2.2, Python 3.11.15, one strategies file identified by content
    (sha256 f516b0a6f0c580cff72e1e2c3562c44dc6f17e8f99613e9e4020e35481b27a18),
    one suite execution. Validator additionally at beta=25 and beta=46, same d,
    same precision, same host. Red Team additionally at d=64/beta=20 in-process
    with `arm_signals=False`. NO d=512 REDUCTION WAS RUN AT ANY PRECISION UNDER
    ANY LABEL BY ANYONE IN THIS BATCH, AND NO mpfr_bits=100 CELL WAS RUN. The
    largest executed dimension anywhere in the package is 64, which the
    Validator verified by searching every .json, .jsonl, .log, .py, .md and
    .yaml under the producer task directory (J3(a)
    `no_output_reports_d512_or_mpfr100_as_RUN`).

  observations:
    - >-
      1. THE FINDING THAT REACHES THE NEXT RUN, GIVEN FIRST BECAUSE IT IS THE
      ONE WITH FORWARD CONSEQUENCE. v2's `tours_definition` (lines 745-751) and
      implementation_report.md 5.1 both assert that the counted set "is exactly
      the set of ('tour', i) tracer contexts upstream opens, BECAUSE UPSTREAM
      OPENS ONE SUCH CONTEXT AROUND EACH self.tour(...) CALL AND AROUND NOTHING
      ELSE." THAT BECAUSE-CLAUSE IS FALSE FROM BLOCK SIZE 46 UPWARD. In the
      installed fpylll 0.6.4, `fpylll/algorithms/bkz2.py` lines 77-79,
      `svp_preprocessing` calls `self.tour(...)` once per entry of
      `params.strategies[block_size].preprocessing_block_sizes`, per
      `svp_reduction`, per tour, and NO tour context is opened around those
      calls -- the context is opened only by `__call__`. MEASURED, NOT ARGUED,
      by the Validator at d=64, beta=46, mpfr_bits=53, seed 2049284461, under
      the pinned strategies bytes: 13 top-level loop iterations against 260
      `tour` calls, a 20x divergence on one d=64 cell, b0 121.57302332343306,
      trace root children labelled tour = 13
      (validation-report.yaml J1 `part_c_finding_the_warrant_is_wrong_where_the_next_run_lives`,
      probe output probes/partC_beta46_tracer.json).
    - >-
      2. THE COUNT IS UNAFFECTED; ONLY THE STATED WARRANT FAILS. v2 counts
      DRIVING-LOOP ITERATIONS, not `tour` invocations, so it returns 13 in that
      regime too and is right for a better reason than the one it gives. The
      producer's D5 equivalence control is likewise unaffected at beta >= 46,
      because it counts trace ROOT CHILDREN, which are only the driving loop's
      contexts. WHAT IS AFFECTED IS A SENTENCE A SUCCESSOR MAY INHERIT INSTEAD
      OF THE MECHANISM: a reader who accepts "one context per self.tour call"
      and reimplements the count as a tour-call counter overcounts by a factor
      of about d at beta=55 and is exactly right at beta=20 and beta=25.
    - >-
      3. WHY NO TEST THIS BATCH COULD HAVE RUN WOULD HAVE CAUGHT IT, AND WHY IT
      BITES AT EXACTLY THE NEXT CELL. In the pinned strategies file
      f516b0a6f0c580cff72e1e2c3562c44dc6f17e8f99613e9e4020e35481b27a18,
      `preprocessing_block_sizes` is EMPTY for every block size 0..45 and
      non-empty from 46 up -- [18] at 46, [26] at 50, [36] AT 55, [38] at 56,
      [76] at 100. At beta=20 and beta=25 the two candidate readings of "tours"
      are NUMERICALLY IDENTICAL, so neither the producer's whole board
      (beta=20) nor the Coordinator's blinded cell (beta=25) could distinguish
      them. beta=55 IS THE PINNED d=512 CELL OF THIS GOAL. The [36] entry at
      block size 55 is independently corroborated by a COMMITTED PRIOR RECORD
      from a different batch and a different review session: EV-MLKEM-59e4a4
      observation 4 records the Validator of BATCH-f9780d confirming "101
      entries; block 55 carrying preprocessing_block_sizes [36] and 21 pruning
      parameters". That corroboration is artifact-level and prior; it is not
      relief from AGENTS.md rule 12, which is unmet across both rounds.
    - >-
      4. THE BLIND RE-DERIVATION SUCCEEDED, ON A CELL THE PRODUCER NEVER RAN.
      At d=64, beta=25, mpfr_bits=53, q=3329, seed 613149553 (the Validator's
      own evaluation of the pinned formula; the VALUE was withheld from it), the
      Validator independently derived 13 TOURS and b0 = 130.15375522819156 from
      a construction transcribed from the pinned predecessor and NOT from v2,
      before it opened any producer file. Both b0 readings agree bit-for-bit
      (row-0 norm and sqrt of the GSO r_00 = 16940.0 exactly, also equal after an
      explicit M.update_gso()); three separate OS processes give [13, 13, 13]
      and the identical b0; a second independent route (`bkz(par, tracer=True)`,
      root children ['lll', ('tour',0)..('tour',12)]) gives the same 13. The v2
      instrument, run afterwards on the same cell under strategies bytes named
      on both sides, returns 13 tours and b0 130.15375522819156, break reason
      auto_abort, 13 tours_table rows. THE TWO AGREE EXACTLY. The driving
      session had SEALED that exact answer outside the repository BEFORE
      dispatching the round, together with what each possible mismatch would
      mean; both sealed files are published verbatim in DEC-20260826-9d7d93.
      WHAT THIS AGREEMENT IS: evidence about ONE QUANTITY at ONE CELL on one
      host. It is not replication, it does not transfer to beta=20, it does not
      transfer to d=512, and it says nothing about ML-KEM. WHAT IT BUYS: the
      producer never ran, tuned or checked beta=25, so its loop transcription
      was exercised at a block size it was not fitted to and did not fail, did
      not misbehave and did not silently change quantity.
    - >-
      5. THE VALIDATOR'S NAMED RESIDUAL: THE STRATEGIES FILE IS STILL NOT BOUND
      BY CONTENT AT RUN TIME. v2 resolves it by a path computed from module
      location, COMPUTES its sha256 at lines 401 and 591, WRITES it into
      environment.json and into the cell record, and COMPARES IT TO NOTHING.
      There is no expected-hash constant for it anywhere in the file;
      `PINNED_PREDECESSOR_SHA256` exists but is only copied into the run_header
      and is likewise never compared. A RECORDED HASH THAT IS NEVER CHECKED IS
      PROVENANCE, NOT BINDING. Failure modes, as established by the Validator:
      a MISSING file is loud and safe (`RuntimeError: Cannot open strategies
      file.`, reproduced, caught into `status: ERROR` with the STARTED stub
      surviving -- a genuine improvement on the predecessor); DIFFERENT BYTES
      are accepted SILENTLY; `--no-strategies` records no strategies field at
      all, recoverable only from `env["argv"]`. MEASURED COST ON ONE CELL, the
      same beta=25 cell at the same seed: pinned bytes give 13 tours and b0
      130.15375522819156, omitting them gives 26 tours and b0
      130.28046668629952. PTM-1 established WHY the omission is silent: a
      strategies-free `BKZ.Param` does not raise, it yields a TRIVIAL set of 26
      entries with ONE pruning parameter set at block size 25 where the pinned
      file has 101 entries and 21, and `BKZ.DEFAULT_STRATEGY` in this build is
      a build-time path that does not exist in this container. AN EXPLICIT PATH
      THAT IS WRONG FAILS LOUDLY; OMISSION DEGRADES SILENTLY. This is the exact
      failure class BATCH-f9780d died of and the class this goal's own
      DEC-20260824-5e222e names.
    - >-
      6. THE RED TEAM'S STRONGEST FINDING (F1): NOTHING IS JOURNALLED BETWEEN
      THE STARTED STUB AND THE FIRST `tour_start`. `refresh_partial_payload()`
      runs at cell start (v2 line 560) and not again until the pre-tour refresh
      (line 646), and the sampler cannot refresh in between because fplll holds
      the GIL through each prologue C call. The two prologue timings the
      instrument does compute -- `outer_lll_reduction_elapsed_seconds` and
      `pre_loop_lll_elapsed_seconds` -- are written into `result`, which reaches
      disk ONLY via `cell_final`, i.e. only if the cell returns. MEASURED:
      `journal_has_any_prologue_record_kind: false`, record kinds in order
      [cell_started_stub, tour_start, tour_progress, tour_start, tour_progress,
      tour_start], `outer_lll_in_signal_payload: false`,
      `pre_loop_lll_in_signal_payload: false`
      (probes/probe_payload_lifetime_output.json). AT d=64 THE BLIND WINDOW IS
      0.000378 s AND NO ACCEPTANCE TEST COULD SEE IT. AT d=512 THE SAME
      CONSTRUCTION'S OUTER LLL ALONE IS MEASURED IN A COMMITTED RECORD AT
      498.9597418308258 s, with the killed first attempt at 508.58293199539185 s
      (EV-MLKEM-59e4a4 observation 2), and the pre-loop `lll_obj` at
      mpfr_bits=100 on d=512 is inside the interval that record brackets the
      75-bit failure to. A d=512 cell killed in that window flushes `tours: 0`
      with `elapsed_seconds_at_refresh` frozen near zero for a cell that has run
      for minutes: NOT AN EMPTY RECORD BUT A CONFIDENTLY WRONG MACHINE-READABLE
      ONE, which is the precise harm this goal exists to stop.
    - >-
      7. THE SIZING THE NEXT RUN EXISTS TO PRODUCE IS STILL NOT COMPUTABLE (Red
      Team J6). DEC-20260815-3e8e9c condition (i) calls the tours-per-hour cost
      curve "exactly the quantity a Stage-1 sizing decision needs and does not
      have". A tours-per-hour figure is a THROUGHPUT; total cost = prologue +
      sum over N tours, and a throughput without a work quantity is not a
      budget. Under `flags=BKZ.AUTO_ABORT` with `max_loops == 0` (the boundary
      EV-MLKEM-59e4a4 records) N is set by `auto_abort.test_abort()`, which
      tests the evolution of the SLOPE of the log GSO norms -- and the
      instrument records exactly two GSO summaries per tour, `gso_r00` and
      `gso_log_det_0_d`, A FIRST VALUE AND A SUM, FROM WHICH A SLOPE CANNOT BE
      RECOVERED. Seven quantities ARE computable from a capped killed cell
      (C1-C7: exact prologue cost given one completed tour, the per-tour wall
      cost SEQUENCE rather than a mean, per-tour CPU, a lower bound on the
      in-flight tour, an accounted-elapsed check, the per-tour basis-quality
      trajectory, and RSS as a per-tour lower bound plus the process-wide
      kernel high-water mark). Seven are not (M1-M7), of which M1, the number
      of tours to completion, is decisive. THE FINDING IS AGAINST THE
      PRESCRIPTION, NOT THE PRODUCER: the producer implemented what was
      prescribed, implemented it well, and gave a per-tour SEQUENCE where a rate
      was asked for.
    - >-
      8. F4 / THE VALIDATOR'S J2-F3, REACHED SEPARATELY BY BOTH REVIEWERS FROM
      DIFFERENT PROBES: `_H_PAYLOAD` IS NEVER RESET AND THE HANDLERS ARE NEVER
      DISARMED. `run_cell`'s `finally` clears the itimer, stops the sampler and
      restores precision; it does not clear `_H_PAYLOAD` and does not restore
      SIGTERM/SIGINT to `SIG_DFL`. Source checks:
      `source_contains_payload_reset: false`,
      `source_contains_SIG_DFL_restore: false`,
      `source_H_ARMED_ever_set_false: false`. MEASURED after a cell whose true
      status was COMPLETED with 9 tours, the armed payload still decodes to
      `{status: KILLED_PARTIAL, failed_infrastructure: true, tours: 9,
      tour_in_flight_index: null}`, and at the start of cell 2 the payload
      identity is still cell 1's. The matched pair runs TWO cells and `main`
      calls `rebuild_results` over the whole accumulated journal between them,
      so at d=512 with a large tours table this window is not a microsecond.
      Two lines in the existing `finally` fix it. THE AGREEMENT BETWEEN THE TWO
      REVIEWERS ON THIS POINT IS NOT INDEPENDENT CORROBORATION -- see
      `reviewer_independence_and_its_limits` below.
    - >-
      9. A SECOND, UNDISCLOSED VALIDATOR RESIDUAL (J2-F1): THE HANDLER'S STDOUT
      NOTICE IS UNCONDITIONAL. Invoking the producer's own
      `_signal_flush_and_die` (imported from the committed file, not
      reimplemented) with `_H_FD` set to a descriptor that is not open, the
      journal write raises and is swallowed by `except Exception: pass`, and the
      handler nonetheless writes "[v2] signal received; pre-serialised partial
      record flushed" to fd 1 and exits 143. The three writes are guarded
      independently, so the fd-1 notice is not evidence that the journal write
      succeeded. Reachable real case: a full filesystem during a long d=512 run.
      One line fixes it. Related and lower: `os.write`'s return value is
      discarded at both write sites, so the report's "cannot interleave" is
      right about ATOMICITY and stronger than the mechanism supports about
      COMPLETENESS; no short write occurred in any of the Validator's ten kill
      runs and this is a code-reading finding, not an observed failure.
    - >-
      10. THE PRODUCER'S OWN HEADLINE SCALE HAZARD IS PROBABLY NOT THE HAZARD
      (Red Team F2). Disclosed item 4 names unbounded `tours_table` growth and
      says a cell with THOUSANDS of tours would suffer. The only committed tour
      count anywhere near the target regime is EV-MLKEM-59e4a4 OBJ-4: at d=80,
      beta=55, 26 TOURS, 274.29 s at 75 bits and 277.56 s at 100 bits. Tens, not
      thousands. The hazard that does bite -- the handler deferred for a whole
      tour, for which the instrument has NO mitigation and offers only a lower
      bound -- is correspondingly under-weighted. The limit of that claim is
      stated by the reviewer itself: no d=512 tour count exists in any committed
      record, 14448 s is a lower bound on an unfinished computation, and d=80 is
      not d=512. It will be settled free by the first d=512 tours_table ever
      written.
    - >-
      11. WHAT HOLDS, STATED SO THIS RECORD IS NOT ONE-SIDED (J2). Ten real
      subprocess kill scenarios -- no signal, SIGKILL, SIGTERM, SIGINT, double
      SIGTERM, a 30-signal SIGTERM/SIGINT burst against a 1 ms heartbeat, a
      startup race, a kill during a declared inter-tour sleep, the instrument's
      own SIGALRM cell timeout, and a late between-tours SIGTERM -- produced
      ZERO unparseable, truncated, empty or interleaved journal lines. Exactly
      one handler record in each signalled scenario. Status always matched the
      SIGNAL delivered (SIGTERM/SIGINT to KILLED_PARTIAL, SIGALRM to
      TIMED_OUT_PARTIAL); exit codes 143/130/142 are exactly 128+15, 128+2,
      128+14, consistent with `os._exit(128+signum)` from signal context. The
      startup race left NO journal at all, which is conservative and correct.
      PTM-2 PASSES BY ABSENCE ON BOTH HALVES: no handler record and no
      KILLED_PARTIAL with no signal delivered, and none after SIGKILL -- the two
      NEGATIVE CONTROLS the producer's 39-assertion suite does not contain, all
      of whose assertions are of the form "X is present or equal". The
      Validator supplied both and both pass, which is what makes the green board
      mean anything. DEC-20260815-3e8e9c condition (v) is DISCHARGED WITH THE
      LITERAL `failed_infrastructure` LABEL in all three required places
      (directory names, inside each flushed record, and in the evidence file),
      with all twelve artifacts of the two killed executions and the tiny cell
      present, git-tracked and nothing deleted. BATCH-f9780d's deviation is not
      carried a second time.
    - >-
      12. ARTIFACT AND FIGURE INTEGRITY (J3). All 23 receipt-bound paths
      recomputed 23/23 FROM DISK and 23/23 FROM THE COMMIT BLOB, zero
      mismatches, zero missing -- and then RE-VERIFIED 23/23 both ways at a
      LATER commit after the repository head moved mid-review, with `git diff
      --name-only` showing that not one bound path had changed. The declared
      zero-byte acceptance_stderr.log is bound at the sha256 of the empty byte
      string, correctly. The twelve declared producer artifacts and the twelve
      disclosed `failed_infrastructure` artifacts are set-equal to the receipt's
      and to git's, in both directions. The pinned predecessor still hashes to
      bc0524ee432a2327bc4a5cfff5d8f5d79b590d37b2f38ea428c78af5abb25035 and has a
      single commit in its history -- the completed archive that binds it is
      intact and the immutability constraint was honoured. 44 quantitative
      figures in implementation_report.md were WALKED (not spot-checked) against
      the raw JSON they cite: 43 reproduce EXACTLY, 0 disagree, 1 is
      presentational (the report writes "<= 4.44e-16" where the raw value is
      4.440892098500626e-16, false read as a strict inequality and right read as
      the three-significant-figure rounding it is).
    - >-
      13. THE SIX PASSES, ADJUDICATED RATHER THAN COUNTED. D1-D6 all PASS, 39
      assertions behind them (D1 4, D2 13, D3 6, D4 5, D5 5, D6 6), zero
      failures, zero NOT_REACHED, summary map consistent with the per-defect
      entries. BOTH REVIEWERS ADJUDICATED THE BOARD SEPARATELY AND BOTH ACCEPT
      ALL SIX AS CORRECTLY REPORTED AT THE SCOPE THE FILE ITSELF STATES. Two
      defects in the board are named and neither is a wrong status: (a) D1's
      one-liner claims a stub "written BEFORE the cell began" and none of its
      four checks verifies the word "before" -- the claim is nevertheless TRUE,
      established two ways by the Validator (source: `journal.write(started)` at
      v2 line 551 against the first lattice call at line 593; artifacts: an
      O_APPEND journal preserves write order and `cell_started_stub` precedes
      the first `tour_start` in its own T8 journal); (b) the board carries no
      carve-out on the kill-time guarantee, and D1's `asserted` clause "the
      exact record BATCH-f9780d's 100-bit cell did not leave" is defensible for
      the STUB at d=512 and not for the flushed partial record, which does not
      survive SIGKILL and is deferred mid-tour. Both repairs are successor
      records, never edits.
    - >-
      14. D6 RE-DERIVED INDEPENDENTLY FROM THE DEFINITION (NOT BLIND, AND NOT
      DESCRIBED AS BLIND). corrected/defective = q^(1/2 - 1/(2d)), b0-independent
      by construction, reproducing 57.24230824954366 at (q=3329, d=512) and
      54.8456813814762 at (q=3329, d=80); b0-independence measured over seven b0
      values and four dimensions with max relative deviation 4.441e-16. The
      load-bearing premise vol^(1/d) = q^(1/2) was checked EMPIRICALLY and not
      only asserted, against the producer's own real d=64 basis
      (57.697486947007526 against sqrt(3329) = 57.697486947006624, agreeing to
      9.0e-13). PTM-3 gave the check teeth: it accepts exactly the
      (corrected, predecessor-line-78) pair at exactly the stated d, and REJECTS
      three known-false candidates including the vacuous corrected/itself case
      and a third wrong formula that is b0-independent for a trivial reason;
      of twelve tested dimensions only d=512 rounds to 57.242 and only d=80 to
      54.8457.
    - >-
      15. AN INCIDENTAL FINDING AGAINST A COMMITTED ARTIFACT OF ANOTHER TASK,
      CONFIRMED. The producer's observation that in fpylll 0.6.4
      `M.get_log_det(0, d)` returns the log-determinant of the GRAM matrix -- so
      TASK-20260815-f14d3c's `exp(log_det/d)` computes vol^(2/d) rather than
      vol^(1/d) -- was verified INDEPENDENTLY ON A MATRIX OF KNOWN DETERMINANT
      rather than on the producer's construction: for diag(3,5,7), det = 105,
      `M.get_log_det(0,3) = 9.307920700315046`, log(105) = 4.653960350157523,
      ratio EXACTLY 2.0. The producer's paired statement that this does NOT
      change D6 is also correct: v2's reported `root_hermite_factor` is
      `(b0/q**0.5)**(1/d)` and calls `get_log_det` nowhere; the log-det appears
      only in the separate per-tour `delta_0_from_gso_logdet` field, where v2
      already uses the corrected `exp(logdet/(2d))`. THE REMEDY IS A SUPERSEDING
      RECORD BY WHOEVER OWNS THE AFFECTED ARTIFACT, not an edit by this producer
      and not a ruling here; the confirmation is recorded so that owner has an
      independent second observation to cite.
    - >-
      16. TWO DEFECTS TRANSFER TO d=512 WITHOUT QUALIFICATION, per the Red
      Team's per-defect analysis, and this is stated because it is the batch's
      real gain: D1 (the fsync'd STARTED stub, O(1) in d, on disk before
      anything can go wrong, surviving SIGKILL and container stop alike because
      it does not depend on the handler) and D6 (dimension-safe float
      arithmetic). D2, D3 and D4 CAN silently fail only at scale, with named
      mechanisms. D5's count is dimension-independent, with one latent divergence
      reported and correctly weighted as inert: v2 runs a sampler thread and
      `process_time()` is process-wide, so its MAX_TIME break test would see
      slightly more CPU than upstream's -- dead under the pinned
      `flags=BKZ.AUTO_ABORT`, live only if MAX_TIME were ever set.

  admissible_now:
    - >-
      At d=64, beta=20, mpfr_bits=53, q=3329, on one host with fpylll 0.6.4 and
      strategies bytes f516b0a6f0c580cff72e1e2c3562c44dc6f17e8f99613e9e4020e35481b27a18,
      the successor instrument `rt_ctrl_1_matched_pair_v2.py` writes a per-cell
      STARTED stub before the cell begins, flushes a status-correct partial
      record when a real signal is delivered to a real subprocess, emits and
      flushes per-tour progress every tour, records resources machine-readably
      with a getrusage cross-check, counts tours by a stated mechanism that
      agrees with upstream `BKZReduction.__call__` at that cell, and computes the
      root-Hermite factor by the standard definition. Six named defects of the
      predecessor instrument are repaired and each repair was shown to FIRE.
    - >-
      At d=64, beta=25, mpfr_bits=53, q=3329, seed 613149553, under named and
      verified strategies bytes, the instrument's tour count and final b0 agree
      EXACTLY (13 and 130.15375522819156) with an independent construction
      transcribed from the pinned predecessor by a reviewer that had not read the
