evidence:
  id: EV-MLKEM-09d715
  hypothesis_id: null
  hypothesis_id_note: >-
    EXPLICITLY NULL, AND THE NULL IS THE HONEST VALUE. This record is about an
    INSTRUMENT, not about a mathematical object. Naming a hypothesis here would
    invite exactly the inference the batch cannot support. H-MLKEM-7d9bcc stays
    `proposed` and EXP-MLKEM-42ea04 stays `review_required` with
    `approved_by: null`, carried unchanged from DEC-20260815-3e8e9c's binding
    list through DEC-20260824-5e222e and BATCH-762807's own opening
    (batch.yaml `what_this_batch_explicitly_does_not_do`). Nothing in this
    record moves either, and nothing here is evidence for or against any
    hypothesis about ML-KEM, about lattice hardness, or about the obstruction
    RT-CTRL-1 targets. The predecessor instrument record EV-MLKEM-59e4a4 named
    H-MLKEM-7d9bcc with a note saying it did not move it; this record takes the
    stricter option that tools/validate_ledger.py explicitly provides for a
    control or instrument check bearing on no hypothesis, because a repair that
    ran zero lattice reductions above d=64 bears on none.
  experiment_ids: []
  experiment_ids_note: >-
    NO EXP-* CONTRACT WAS FROZEN FOR THIS WORK, and that was declared at opening
    rather than discovered here (batch.yaml `procedure_deviations` PD-4). The
