evidence:
  id: EV-FALSIFY-67150b
  hypothesis_id: H-FALSIFY-40538b
  question_id: RQ-FALSIFY-a2c501
  experiment_ids: [EXP-FALSIFY-d770c1]
  run_ids: [RUN-FALSIFY-d770c1-003]
  findings_under_test: [KN-FIND-2a8b7e, KN-FIND-c7d31e]
  type: empirical
  direction: contradicts
  direction_note: >-
    Contradicts KN-FIND-2a8b7e's growing-with-m speedup law and its crypto-scale
    extrapolations. Supports KN-FIND-c7d31e's theorem, which the same run
    reproduces to 4 decimal places. The two findings contradict each other
    already; this evidence localises the cause.
  strength: strong
  claim_tier: toy
  proof_status: empirical_only
  proof_refs:
    - experiments/EXP-FALSIFY-d770c1/specification.yaml
    - experiments/EXP-FALSIFY-d770c1/runs/RUN-FALSIFY-d770c1-003/raw-result.json
    - experiments/EXP-FALSIFY-d770c1/runs/RUN-FALSIFY-d770c1-003/manifest.yaml
    - experiments/EXP-FALSIFY-d770c1/runs/RUN-FALSIFY-d770c1-003/stdout.log
  recorded_at: '2026-08-08'

  observations:
    - id: O-1
      text: >-
        F-9 SWEEP ORIGIN. A mechanical sweep for numeric quantities quoted at
        more than one value across the corpus returned two groups. One was the
        C(p) exponent already recorded in EV-FALSIFY-40291d. The other was
        "speedup", quoted as 3.3x and 5.9x in KN-FIND-2a8b7e and as 1.5-1.7x in
        KN-FIND-8f2c90. Following that pointer surfaced the defect below, which
        is larger than the disagreement that revealed it.
    - id: O-2
      text: >-
        THE TWO FINDINGS ASSERT INCOMPATIBLE LAWS. KN-FIND-c7d31e proves
        speedup = (m+1)/2, LINEAR in m. KN-FIND-2a8b7e fits
        gamma_m ~ 0.86 * 0.68^(m-2), concludes speedup ~ 1.72 * 1.36^(m-2)
        "geometrically growing", and extrapolates m=6 -> 5.9x, m=7 -> 8.0x,
        m=8 -> 10.9x. The two diverge without bound: ratio 1.27 at m=4, 1.68 at
        m=6, 2.42 at m=8. KN-FIND-c7d31e nonetheless states it "provides the
        combinatorial foundation for the empirical improvements in
        KN-FIND-2a8b7e". At most one of the two can hold, and the corpus records
        both as mutually supporting.
    - id: O-3
      text: >-
        THE DECAY IS CONFOUNDED WITH B. KN-FIND-2a8b7e's four rows are measured
        at B = 54, 18, 12, 10 -- B falls as m rises. Per-target success depends
        strongly on B (RUN-FALSIFY-d770c1-001 moved it from 0.61 to 1.000 at
        fixed m=3 by raising B alone). Holding B FIXED and re-measuring, the
        per-step ratio that the finding fits at a constant 0.68 becomes:
        B=12: 0.754, 0.829, 1.096; B=18: 0.893, 1.280, 1.127;
        B=24: 1.004, 1.290, 1.002.
        The ratios rise toward and past 1.0 instead of decaying at 0.68. There
        is no geometric decay in m at fixed B. The decay the finding attributes
        to m is produced by the simultaneous reduction in B.
    - id: O-4
      text: >-
        MECHANISM OF THE CONFOUND. As m rises at fixed B, mean decomposition
        multiplicity rises steeply -- 1.06 to 4.42 at B=12, 1.10 to 95.04 at
        B=24 -- and per-target success saturates at exactly 1.0000 (B=18 m=5,
        B=24 m=4 and m=5). A saturated quantity cannot exhibit the decay being
        fitted. Shrinking B as m grows is what keeps the measured quantity off
        its ceiling, and the resulting trend was read as an m-dependence.
    - id: O-5
      text: >-
        THE THEOREM IS REPRODUCED, AGAIN. Per-decomposition retention equals the
        proved (m+1)/2^m at every B tested: 0.7500 vs 0.7500 and 0.5000 vs
        0.5000 at m=2,3. The m=4 and m=5 residuals shrink as B grows -- m=5
        gives 0.2309, 0.2182, 0.2113 at B = 12, 18, 24 against a theoretical
        0.1875 -- the decay-under-the-parameter-meant-to-destroy-it signature of
        a finite-factor-base multiset artifact rather than a mechanism. This
        doubles as the positive control: the instrument reads the quantity the
        theorem is about.
    - id: O-6
      text: >-
        SHARED ROOT WITH EV-FALSIFY-2a5e46. KN-FIND-2a8b7e's gamma column
        (0.86, 0.66, 0.35, 0.27) is the same column reproduced in
        KN-FIND-c7d31e's verification table, and it is a per-target measurement:
        at the reported parameters, measured per-target is 0.8681 at m=2 against
        0.86 reported, and 0.6933 at m=3 against 0.66 reported, while
        per-decomposition is 0.7497 and 0.5000. One estimand error propagated
        into two findings, and the corpus treats each as corroborating the other.

  interpretation: >-
    KN-FIND-2a8b7e's headline result -- a geometrically growing BKK speedup, with
    named crypto-scale figures of 3.3x at m=4 and 5.9x at m=6 -- rests on a decay
    fitted across rows in which B was not held fixed. At fixed B the decay does
    not occur. The law it produces contradicts the proved linear law in the very
    finding the corpus names as its foundation, and the extrapolations to m=6,7,8
    are the part of the claim most sensitive to the confound.

  what_this_does_not_establish: >-
    This does not show that BKK sparse checking gives NO speedup. The proved
    per-decomposition bound (m+1)/2 stands and was reproduced here. Nor does it
    establish the true speedup at cryptographic parameters in either direction:
    everything measured is at p=1009 with B <= 24 and m <= 5, and the honest
    statement is that the corpus's growing-with-m evidence does not survive its
    own control, not that growth is impossible. KN-FIND-8f2c90's 1.5-1.7x figure
    is a DIFFERENT quantity (m=2 mixed-volume, 2*gamma) and is not tested here;
    it was the pointer that led to this probe, not its target.

  dominated_by: not_applicable_methodological
  sota_delta:
    time_exponent: not_applicable
    note: >-
      Withdraws support from a claimed geometrically growing constant factor.
      The surviving supported statement is the theorem's linear (m+1)/2.

  proposed_correction: >-
    Superseding records that (a) withdraw KN-FIND-2a8b7e's gamma ~ 0.86*0.68^(m-2)
    fit and the speedup ~ 1.72*1.36^(m-2) law as confounded with B, (b) withdraw
    the m=6/7/8 extrapolations that depend on them, (c) relabel its gamma column
    as per-target success with the B at which each row was taken, and (d) remove
    from KN-FIND-c7d31e the claim to be the combinatorial foundation of a
    geometric law its own theorem contradicts. New records only, never edits
    (AGENTS.md rule 4). Coordinator authority.

  knowledge_promotion: warranted
  knowledge_promotion_reason: >-
    The reusable rule is a design rule: a trend fitted across rows in which a
    second parameter also moved is a trend in neither variable. Both defects
    found in this corpus so far are instances -- B moving with m here, p moving
    with nothing controlled in EV-FALSIFY-40291d. Proposed as a technique entry,
    subject to Coordinator approval.

  scope_limits: >-
    p=1009, curve y^2 = x^3 + x + 1, m in {2,3,4,5}, B in {10,12,18,24,54},
    exhaustive multiset enumeration. Toy scale throughout; no crypto-scale claim
    is made or refuted.

  independent_review_required: true
  independent_review_note: >-
    This record contradicts a headline empirical claim and touches a finding
    carrying confidence: proved. AGENTS.md rule 12 applies before any status
    change follows.

  authority_note: >-
    Evidence only. No hypothesis status changed, no finding edited or
    superseded; only the Coordinator may do that (AGENTS.md rule 1).
