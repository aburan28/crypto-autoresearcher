    specification and DEC-20260822-d7c2d0 F-8.
  run_ids: []
  run_ids_note: >-
    The six runs of this record -- RUN-MDFIVE-b6-primary-md4-prod,
    RUN-MDFIVE-b6-primary-md5-prod, RUN-MDFIVE-b6-null-md4-prod,
    RUN-MDFIVE-b6-null-md5-prod, RUN-MDFIVE-b6-primary-md4-smoke-a,
    RUN-MDFIVE-b6-primary-md4-smoke-b -- live under
    coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/tasks/
    TASK-20260822-767bb1/runs/, outside the validator's run index
    (experiments/*/runs/*/manifest.yaml), following the BATCH-7215fa
    precedent EV-MDFIVE-24e077 run_ids_note. Every one of the 40 bound paths
    (6 runs x 6 artifacts + driver + tests + execution report + derived
    analysis + task cards) is sha256-bound by the TASK-20260822-b325fe
    snapshot receipt, and the four production runs were additionally cold-
    re-run by an independent validator session with exact integer agreement
    (7600/7600, VAL-20260822-7f5ed3). The two smoke runs are the
    determinism double-run (byte-identical except wall_seconds).
  question_id: RQ-MDFIVE-6870c1
  batch_id: BATCH-ebac02
  type: empirical
  direction: weakens
  direction_note: >-
    `weakens`, primitive-scoped, against the hypothesis's implicit
    near-injectivity premise at 12-bit window resolution. At the distribution
    level (100 fixed-word seeds per primitive), MD4's forward 12-bit channel
    fails the pre-registered injectivity criterion on 99 of 100 seeds (max 15
    of 16, threshold 12), which rules out the seed-lottery reading of the
    batch-5 point observation: the collapse is not a seed artifact of this
    construction, it is a property of the construction at MD4. For MD5 the
    picture is different on this dimension: 65 of 100 seeds meet the 12-bit
    threshold (median 13), so forward 12-bit distinctness is NOT the binding
    obstruction for MD5 -- but MD5's raw CTL-PO5 candidate count remains
    structured (median 12 against a healthy expectation of order 1, 52 of 100
    seeds at or above the declared ceiling 4), so the collision structure
    persists there at the candidate-count dimension. Nothing here touches the
    hypothesis's mechanism claim (that at separation 10 the declared
    observable depends on both free words), which batch 5 CONFIRMED; and
    nothing here supports any speedup at any scale. THE ROUTING ANSWER
    (construction vs seed vs criterion) is a Coordinator composition made in
    DEC-20260822-d7c2d0, not an observation of this record.
  strength: single_run
  strength_note: >-
    `single_run`, and the word is chosen against two wrong grades. NOT
    `replicated` in the batch-5 sense: the batch-5 grade rested on TWO
    from-scratch reviewer reimplementations (validator and red team, sharing
    no code) reproducing the headline integers. In batch 6 the red team --
    the designated owner of the blind re-derivation -- FAILED on
    infrastructure and its tier is PAUSED (DEC-20260822-d7c2d0 F-4), so the
    independent re-derivation of the threshold and the independent
    re-implementation of the distributions are BOTH outstanding. What IS on
    record: (1) a cold re-run of the frozen driver (same implementation,
    fresh processes, independent session) reproduces ALL 7600 per-seed
    integers across the four production runs exactly (VAL-20260822-7f5ed3);
    (2) the validator independently recomputed the summary statistics from
    the per-seed raw records and they match (VAL-20260822-40389d V1
    internal-consistency block); (3) the batch-5 seed 20260821 reproduces the
    batch-5 gate integers exactly (9 fwd32 / 4 fwd12), tying this instrument
    to the batch-5 code path that the two batch-5 reimplementations already
    validated. A same-implementation cold re-run plus internal consistency
    plus cross-batch seed reproduction is a real chain, but it localises
    nothing to an implementation-independent derivation; the upgrade to
    `replicated` requires the paused red-team blind re-derivation (or an
    independent from-scratch recomputation) and is the named successor
    condition. NOT `strong`: no algebraic fact of the kind ANOM-1 carried
    (proved independence) is in play; every load-bearing number is a
    measured integer distribution at one construction.
  claim_tier: fixed_word_seed_distribution_characterization_and_routing_input_only
  claim_tier_note: >-
    Scale: MD4 and MD5 Round 1 only (16 of 48 / 64 steps), construction
    i_word=2, j_word=12, S=8, p=3, m=12, k=20, k_gate=4, k_ctl_po5=6,
    100 fixed-word seeds 20260821..20260920 per primitive,
    target_seed := fixed-word seed (declared pairing). Claim ceiling
    `analyzed`; this record may never be read or promoted as `supported`.
    The derived-analysis quantities (GF(2) rank of the four single-bit
    toggle vectors; HEUR-H3 duplicate counts) carry no new random draws and
    are labeled DERIVED at their point of use; the implementation was
    cross-checked against an independent naive closure computation with 0
    mismatches over 30000 probe vectors.
  proof_status: empirical_only
  proof_refs: []
  proof_status_basis: >-
    No cryptanalytic claim is made or reviewed in this record. It
    documents (1) the under-contract fixed-word-seed distributions of the
    batch-5 instrument at 100 seeds per primitive (O-1..O-4, measured),
    (2) the derived, labeled analyses (O-5, O-6), (3) the determinism
    evidence (O-7), (4) the corrected RC-4 mask model and its
    adjudications (O-8), and (5) the review round state including the
    red-team infrastructure failure (DEC-20260822-d7c2d0 F-4).
    `empirical_only` in the sense EV-MDFIVE-1a2952 uses the word: the
    load-bearing content is measured integers and their review, not a
    derived or proven statement.
  observations:
    - id: O-1
      quantity: md4_primary_forward_and_backward_distinctness_distribution
      value: >-
        fwd_32bit: min 3, median 11, max 16, 47/100 seeds >= 12;
        fwd_12bit: min 1, median 4, max 15, 1/100 seeds >= 12;
        bwd_32bit: 64/100 seeds >= 12; bwd_12bit: median 12.
        CTL-PO5 (k1=k2=6) raw candidate count: min 2, median 48, max 512,
        99/100 seeds at or above the declared ceiling 4. RC-4 surviving
        (y XOR z) mask positions per seed: histogram {1: 1, 2: 4, 3: 28,
        4: 67}. 605 observed-vs-predicted departures adjudicated beyond
        declared tolerance.
      source: RUN-MDFIVE-b6-primary-md4-prod
      provenance: measured
      caveat_refs:
        - KN-TECH-bb7e9f (ANOM-1 boundary carried forward)
        - DEC-20260822-40bf14 F-4 (caveat forward-citation constraint)
    - id: O-2
      quantity: md5_primary_forward_and_backward_distinctness_distribution
      value: >-
        fwd_32bit: 16/16 for all 100 seeds; fwd_12bit: min 6, median 13,
        max 16, 65/100 seeds >= 12; bwd_32bit: 16/16 for all 100 seeds;
        bwd_12bit: median 12, 57/100 seeds >= 12. CTL-PO5 raw candidate
        count: min 2, median 12, max 128, 52/100 seeds at or above the
        declared ceiling 4. RC-4 surviving positions: {4: 100}. 170
        departures adjudicated.
      source: RUN-MDFIVE-b6-primary-md5-prod
      provenance: measured
      caveat_refs:
        - >-
          AN-B6-2 (MD5 bwd_12bit limited, 57% at threshold, median 12;
          the backward 12-bit channel is the weaker MD5 dimension, recorded
          in the execution report anomalies)
    - id: O-3
      quantity: null_object_control_distribution
      value: >-
        Both primitives: fwd_32bit and fwd_12bit 16/16 for all 100 seeds
        (the additive non-multiplexer mixer's forward channel is injective,
        as the structural argument predicts); raw candidate count 64..256
        (median 128). Backward channel structurally degenerate: null-md4
        bwd_32bit = bwd_12bit = 1 for all seeds; null-md5 bwd_32bit = 16,
        bwd_12bit = 1 for all seeds. The degeneracy is a zero-coefficient
        affine property of the null object, recorded as DEGENERATE -- not a
        control pass or fail; the RC-5 control is validated on the forward
        channel only.
      source: RUN-MDFIVE-b6-null-md4-prod, RUN-MDFIVE-b6-null-md5-prod
      provenance: measured
      caveat_refs: [execution-report.yaml RC-5 structural degeneracy disclosure]
    - id: O-4
      quantity: cross_batch_seed_reproduction
      value: >-
        Seed 20260821 (MD4 primary) reproduces the batch-5 gate integers
        exactly: distinct_fwd_32bit = 9, distinct_fwd_12bit = 4 (EV-MDFIVE-
        24e077 O-2). CTL-PO5 raw count for that seed is 24 here versus 8 in
        batch 5: a DECLARED target-seed difference (this sweep pairs
        target_seed := fixed-word seed = 20260821; batch 5 used
        target_seed = 8975323), recorded as AN-B6-1. Non-contradiction,
        mechanism of the difference named.
      source: RUN-MDFIVE-b6-primary-md4-prod per_seed[0]
      provenance: measured
      caveat_refs: [AN-B6-1]
    - id: O-5
      quantity: gf2_rank_of_single_bit_toggle_vectors
      value: >-
        DERIVED (no new random draws; rank of the four single-bit toggle
        vectors per seed, implementation cross-checked against an
        independent naive closure computation, 0 mismatches over 30000
        probe vectors): primary-md4 rank_12bit {0: 17, 1: 31, 2: 35, 3: 14,
        4: 3}; primary-md4 rank_32bit {1: 2, 2: 18, 3: 39, 4: 41};
        primary-md5 rank_12bit {2: 12, 3: 34, 4: 54}; primary-md5
        rank_32bit {4: 100}; null objects rank 4 at both resolutions for
        all seeds. Reading: at 12 bits the MD4 forward window frequently
        loses rank entirely (17 of 100 seeds rank 0; 48 of 100 rank <= 1),
        while MD5 retains full rank at 32 bits for every seed and loses at
        most one dimension at 12 bits for none.
      source: derived-analysis-b6.json (from the four production raw-result files)
      provenance: derived
      caveat_refs: [derived-analysis-b6.json derivation and cross-check note]
    - id: O-6
      quantity: heur_h3_uniformity_premise
      value: >-
        HEUR-H3 (numbered, pre-registered in the frozen contract): over the
        100 seeds per primitive, duplicate high-mask pairs = 0; duplicate
        target-low pairs = 16 (MD4), against a birthday expectation of
        ~19.3 for 100 draws over the 2^12 low space. The uniformity premise
        is NOT falsified by the sweep.
      source: derived-analysis-b6.json
      provenance: derived
      caveat_refs: [execution-report.yaml HEUR-H3 block]
    - id: O-7
      quantity: determinism
      value: >-
        smoke-a / smoke-b (same 3-seed configuration, two fresh processes)
        byte-identical except wall_seconds; the four production runs cold-
        re-run by the independent validator session (fresh processes,
        driver sha256 4aa7b6f0... verified against the snapshot receipt)
        match all 7600 compared per-seed integers exactly, zero
        mismatches (VAL-20260822-7f5ed3).
      source: RUN-MDFIVE-b6-primary-md4-smoke-{a,b}; reviews/TASK-20260822-7f5ed3/comparison-result.json
      provenance: measured
      caveat_refs: []
    - id: O-8
      quantity: rc4_mask_model
      value: >-
        RC-4 static (y XOR z) mask check, corrected carry-free first-order
        linearization (DEV-5: the first implementation mislabeled the F-
        argument registers and two position-update edges; all six runs were
        regenerated with the corrected trace and the distinct/CTL-PO5
        integers are byte-identical, isolating the fix to the mask trace).
        Modeled-vs-measured surviving-position adjudications: MD4 73/400,
        MD5 103/400 -- departures are carry-rescue / cancellation events,
        expected for a carry-free first-order model, and are adjudicated
        per the contract rather than treated as model failure.
      source: execution-report.yaml RC-4 block; the six run directories
      provenance: modeled_plus_measured
      caveat_refs: [DEV-5]
