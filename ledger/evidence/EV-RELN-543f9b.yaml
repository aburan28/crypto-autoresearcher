evidence:
  id: EV-RELN-543f9b
  hypothesis_id: H-RELN-427bfd
  experiment_ids: [EXP-RELN-141a86]
  run_ids:
    - RUN-RELN-141a86-stage0a
    - RUN-RELN-141a86-stage0bcde
    - RUN-RELN-141a86-stage0c-repair
  type: empirical
  direction: neutral
  strength: inconclusive
  claim_tier: toy
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []
  observations:
    - >-
      A second attempt at the Stage-0c structural-recovery gate for INV-1
      (canonical complexity 9), INV-7 (p_fail 9 / p_exist 11), and INV-8
      (10) -- all over 6-leaf packs -- built a streaming, hash-deduplicated
      enumerator (source/grammar_engine_lean.py) validated exactly against
      the original grammar_engine.py on every case the original could
      complete (up to 427,569 forms), with one real bug found and fixed
      during validation (a repr(-0.0) != repr(0.0) equality defect causing
      under-deduplication).
    - >-
      All four remaining targets (INV-1 mean, INV-7 p_fail, INV-7
      p_exist, INV-8 d_reg) were run as separately monitored subprocesses
      with continuous /proc-based memory sampling under a real 6000-second
      wall-clock / 13 GB memory hard cap. All four hit the 6000-second cap
      without completing. Peak resident memory was 7.61-7.94 GB for three
      of the four (well under the 13 GB cap and still climbing, never
      plateaued) and 12.98 GB for the fourth (INV-8), which came closest
      to the memory limit but was still killed by the time cap first.
    - >-
      This re-diagnoses the binding constraint measured in EV-RELN-b3c6ef:
      the original brute-force engine's termination was framed there as
      memory-driven (terminated to avoid OOM); this run's leaner,
      independently-validated, more memory-efficient engine shows the
      actual bottleneck at these packs/complexities is pure-Python CPU
      time over an estimated tens of millions of candidates within a
      single complexity level, not memory storage. The prior finding's
      OUTCOME (structural recovery undetermined for these three targets)
      is unchanged; its stated CAUSE is refined by this record, which does
      not edit or contradict EV-RELN-b3c6ef -- both stand as accurate
      measurements of their own runs.
    - >-
      No between-level checkpoint was reached for any of the four targets
      (each stayed stuck mid-level for its full ~100-minute run), so no
      per-level growth breakdown could be recovered this time either; this
      is a disclosed limitation of the current implementation's
      instrumentation, not a further finding.
    - >-
      Per the frozen contract's own stopping rule, Stage 1 was correctly
      not attempted a second time. Every structural-recovery attempt
      across both runs used true blind enumeration; the targeted-
      minimality-proof alternative explicitly authorized in
      TASK-20260907-f41930 was not used, and this is disclosed rather than
      silently substituted.
    - >-
      INV-A4 and INV-A6 remain PASSED (both numerically and structurally,
      carried forward unchanged from RUN-RELN-141a86-stage0bcde, not
      re-run); their status is unaffected by this record.
  inference: >-
    NO SCIENTIFIC READING IS OFFERED. This remains instrument failure at
    the Stage-0c structural-recovery gate. The practical implication for
    any FUTURE attempt: a memory-efficiency fix alone is insufficient: the
    next credible route to clearing this gate is either (a) a compiled or
    vectorized enumerator (the combinatorial explosion at these packs is
    CPU-bound in pure Python, not memory-bound), (b) a wall-clock budget
    well beyond one session (the growth was still climbing, not plateaued,
    at 6000s for three of four targets, so more time alone might suffice
    for those, though not obviously for INV-8's memory trajectory), or (c)
    the targeted-minimality-proof method named in the handoff but not yet
    attempted. This is engineering guidance for a future task, not a
    finding about any candidate invariant.
  boundaries:
    - >-
      Toy scale; Stage 0a-0c only, across two attempts. Stage 0e, Stage 1
      and Stage 2 remain entirely not_run for this contract.
    - >-
      The re-diagnosis (CPU-time-bound, not memory-bound) is scoped to
      this run's specific host, its 6000s/13GB caps, and a pure-Python
      implementation; it says nothing about whether a differently
      engineered instrument on different hardware would face the same
      bottleneck.
  unresolved_confounds:
    - >-
      Whether a substantially longer wall-clock budget (rather than a
      different algorithm) would let the three near-8GB targets complete,
      since their memory was still climbing steadily rather than
      plateauing or blowing up, is not determined by this run.
  obstruction: null
  reviewed_by: coordinator
