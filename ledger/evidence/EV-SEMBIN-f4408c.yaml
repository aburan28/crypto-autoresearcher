    - id: O-8
      text: >-
        THE GRANT THE CHARGING NEEDS IS THE STRONG FIRST-FALL-DEGREE ASSUMPTION (B1).
        The D^omega charge is Lemma 2's, derived from Nagao's Assumption 1 as quoted
        (l. 416-417: the degree of every polynomial appearing in the F4 computation is
        <= d_F), i.e. solving degree = first fall degree. Proposition 5 alone bounds
        only the first fall degree and is stated with its proof omitted (footnote 6).
        A weaker grant (d_F <= 4, solving degree d_solve >= 5) is exactly ARM K's rise
        and erases every survivor (O-7). The run's T1 counts monomials of degree <= 4
        without field-equation reduction (true-d_F reading); the squarefree count
        differs by 0.0004 bits at N = 40541, immaterial. Literature on the first-fall
        vs solving-degree gap is named by the reviewer as RECALLED pointers only
        (Petit-Quisquater 2012; Kosters-Yeo 2015; Galbraith-Gaudry 2016) and is not
        support for anything in this record.
    - id: O-9
      text: >-
