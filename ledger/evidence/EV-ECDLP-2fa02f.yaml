      excluded by this batch. But the convergence of a claude-opus-5 review
      with the qwen3.8-27b producer's OWN artifacts -- and the Coordinator's
      independent hand-verification of each of the three second-round blocking
      findings from frozen bytes -- is what makes each item actionable. Each
      finding is independently checkable by hand from committed bytes, which
      any later reader on any model can redo.
    no_attestation_recorded: >-
