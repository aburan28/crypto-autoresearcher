    H-SYC-b854f4, and it says nothing whatever about ECDLP, about any elliptic
    curve, or about any scale beyond the frozen toy ladder of 18, 21, 24, 27
    and 30 bits. The hypothesis_id field records which record the artifacts
    belong to, not a direction on it.
  experiment_ids: [EXP-SYC-c5f30f, EXP-SYC-4725b3]
  run_ids: []
