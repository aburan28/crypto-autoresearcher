    zero_run_ceiling_holds:
      confirmed_by: [round_two_validator, round_two_red_team]
      statement: >-
        A sweep of all seven artifacts for affirmative claim vocabulary
        returns only negations and disclaimers. NO ECDLP ASSERTION IN EITHER
        DIRECTION exists anywhere in the package, and this record makes none.

  # =====================================================================
  # 3. WHAT THE REVIEWS FOUND -- the residuals, exactly
  # =====================================================================
  the_blocking_findings:
    - id: VAL-B0465B-B1
      summary: >-
        The RT-DB50A3-B1 dedup-range repair was applied to the companion
        compiler page only; the identical FALSE bound `0 <= dedup(t) <=
        sum_j nonshared_j(t)` survives in the FROZEN CONTRACT at
        specification.yaml:1243, byte-identical to the predecessor,
        undisclosed, under a disposition of REPAIRED. Counterexample: B_0 and
        shared co-resident on one 4096-byte page, no nonshared term: dedup =
        4096, the bound asserts 4096 <= 0. Verbatim the class the batch
        declared blocking, in the more authoritative of the two documents
        carrying the field. Fix is one line plus a lemma pointer; no number
        changes.
    - id: RT-0F62F9-B1
      summary: >-
        The certifying artifact records a WRONG numeric literal: the
        exact_prefix for 2^(-7/6) ends ...539935 where the true value ends
        ...539936, confirmed by the reviewer by two independent routes
        (Decimal at 150 digits, and a Newton solve of x^6 = 2^-7 using no
        transcendental function) and re-verified by the Coordinator. It is
        neither a truncation nor a rounding of the true value; it sits under
        an "exact" label and a result verdict, was never recomputed, and is
        contradicted by the first-round validator's own independently
        computed ...539936.
    - id: RT-0F62F9-B2
      summary: >-
        d4_crossing_rule states a formula (gamma_x <= 1/3 - (15 - log2 33)/
        bits) that does not generate its own recorded m_98304_bits_30 value
        (-0.05135228): the stated formula yields +0.00147980 at bits 30, and
        the generating form 1/3 - (15 - log2 11)/bits was stated nowhere.
        Verbatim the RT-DB50A3-B2/B3 class, three entries below the two the
        successor did correct. The value is correct and no conclusion
        changes.

  the_major_findings:
    - id: RT-0F62F9-M1
      summary: >-
        The RT-DB50A3-M2 repair is asserted in universal form at six sites
        and is false: the recomputation command output begins at section [3]
        with [1] and [2] absent package-wide and no elision marker, five of
        ten recomputation entries carry no pasted output at all, and the
        receipt asserts output it does not contain. The digest half IS
        genuinely repaired and every pasted line is byte-correct.
    - id: RT-0F62F9-M2
      summary: >-
        The design-repair-report D1 disposition is a stale copy-forward: it
        asserts this successor's ctrl5 records the EXP-SYC-95ff77 digest
        786ca5f0..., which appears ZERO times in that file; only the trailing
        filename was updated in the identity re-authoring. CTRL-5 is
        structurally blind to this failure mode (the leaf DID change, so it
        is a legitimately mapped changed row).
    - id: RT-0F62F9-M3
      summary: >-
        The B1 dedup-range repair has NO discriminating control: every KAT
        fixture passes identically under the false predecessor range and the
        corrected range (KAT-PEAK-3 accounting_b: 8 <= 16 and 8 <= 15;
        KAT-PEAK-F: 0 <= 0 both ways), and this is not disclosed, where the
        same gap WAS disclosed for the M1 lower-bound half one edit earlier.
    - id: RT-0F62F9-M4
      summary: >-
        Scope and authority: the committed batch contract admits exactly one
        successor (EXP-SYC-4725b3) and its next_action prescribed `paused` on
        precisely the contingency that produced the second successor; the
        authority basis was asserted rather than reconciled in the frozen
        record. Reconciled in DEC-20260818-e08691 (intra-batch repair
        consumes no batch; the pause prescription was deferred once, on the
        user's explicit continuing instruction, and is now applied).

  non_blocking_findings_carried_open:
    round_two_validator: 'VAL-B0465B-N1..N11 (eleven), by ID'
    round_two_red_team: 'RT-0F62F9-D1..D5 (five moderate) and RT-0F62F9-N1..N6 (six minor), by ID'
    round_one_still_open: 'RT-DB50A3-N5 (note-only); VAL-E0FA83-N1..N3 discharged by the second successor and verified; VAL-E0FA83-N4 genuinely repaired'
    carry_from_54th: 'all 21 items (VAL-D50C44-N1..N7, RT-A70C90 M1..M4/D1..D3/N1..N7) remain carried by ID, none silently dropped'

  claim_boundary: >-
    THE EXACT CLAIM BOUNDARY OF THIS RECORD. It certifies only that the
    second successor's arithmetic is reproducible and correct (zero numeric
    mismatches over every literal, bound, row and pasted string the
    validator checked), that its digests are the true on-disk values, that
    CTRL-5 is complete and sound over the 446 rows it enumerates, that the
    preserved closures and carried residuals are intact, that three
    record-integrity defects (one false bound in the frozen contract, one
    wrong 40-digit literal, one formula label that does not generate its own
    recorded value) stand in the package's account of itself, and that the
    pre-registered pause contingency fired. It certifies NOTHING about the
    ECDLP, about H-SYC-b854f4, about the feasibility, cost, security
    relevance or scientific merit of the design, about whether the design
    would run correctly if implemented, or about whether the peak-live-bytes
    apparatus fits under any cap. NO measurement, run, curve, target, solver,
    speedup, attack, asymptotic result, cryptographic-scale transfer,
    novelty, closure or breakthrough is asserted, implied, or contradicted
    here in either direction. A REVISE verdict on a record-integrity defect
    is NOT a mathematical negative about the hypothesis, the design, or
    ECDLP: it is a statement about the package's account of itself, exactly
    as the prior rounds' were. The capacity residuals,
    ha2_simultaneous_tail_unavailability and peak_aggregate_fit remain OPEN
    and are not disposed of by this record.
