  what_the_reviews_independently_confirmed:
    recording_note: >-
      Under-reporting the positive content of a negative-verdict batch is as
      much a distortion as overclaiming. Each item below was independently
      re-derived by the reviewer named, from frozen bytes, not adopted from
      the producer's summary.
    b1_mathematics_correct:
      confirmed_by: [round_two_validator, round_two_red_team, coordinator]
      statement: >-
        The corrected dedup range 0 <= dedup(t) <= B_0(t) + shared(t) +
        sum_j nonshared_j(t) - M(t) is TRUE for every admissible census
        instance both reviewers constructed, with equality (tightness) on the
        one-page two-term, shared-plus-two-nonshared and full TEN-term
        instances; the union-size lemma is a valid set-containment argument;
        the lower bound is genuinely re-derived from it; and dedup_hi is a
        consistent envelope. The defect is WHERE the repair was applied
        (companion page only, not the frozen contract), not whether it is
        right.
    zero_numeric_mismatches_in_second_successor:
      confirmed_by: [round_two_validator]
      statement: >-
        Every closed-form literal, bound, row, sum, slack, threshold and
        serialization the second successor asserts was recomputed at 60-digit
        Decimal precision and matches; all 24 pasted 60-digit command-output
        strings reproduce digit-for-digit, so no command output in the package
        is fabricated.
    ctrl5_genuine_and_complete:
      confirmed_by: [round_two_validator, round_two_red_team]
      statement: >-
        CTRL-5 survives a from-scratch reimplementation on every axis: 25/25
        count fields, all fifteen enumerated path sets set-equal in both
        directions with zero missing / zero spurious / zero duplicates over
        all 446 rows, all 446 overlay references declared, 0 value mismatches
        out of 372 recorded values, 16/16 must-differ fields differ, 8/8
        identical-by-construction fields genuinely identical, 12/12 V4 items
        byte-exact against EXP-SYC-793304.
    digests_true:
      confirmed_by: [round_two_validator, round_two_red_team]
      statement: >-
        All eight digests (seven pasted shasum stdout lines plus the ctrl5
        self-digest supplied by the snapshot receipt) are the true on-disk
        SHA-256 values, independently recomputed; no digest anywhere matches
        nothing on disk.
    first_round_repairs_genuine_on_the_companion_side:
      confirmed_by: [round_two_validator, round_two_red_team]
      statement: >-
        RT-DB50A3-B2, B3, M1, D2, D3, D4 and VAL-E0FA83-N4 are genuinely
        repaired, each verified by independent recomputation or by reading
        the repaired bytes; N1 (alias map), N3 (version capture) and N4
