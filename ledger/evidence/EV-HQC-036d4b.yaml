  observations:
  - 'THE MATCHED-PAIR REANALYSIS ITSELF CONFIRMS THE PILOT''S ORIGINAL NULL WAS GENUINE, NOT MERELY AN
    ARTIFACT OF THE WEAK COMPARISON DESIGN. Using the Red Team''s own matched-pair method, reproduced
    independently by both the executor and the Validator with structurally different implementations
    (exact agreement to the reported digits), the k=17 comparison gives diff=+0.0516, SE=0.0966 (3.12x
    tighter than the pilot''s original design), z=+0.534 -- still not significant, and |z| never exceeds
    0.632 across k=2..26. The tighter design resolved the pilot''s comparison-method weakness but did not
    reveal a hidden signal at the tested injection point.'
  - 'A CLOSED-FORM "DOUBLE DILUTION" STRUCTURAL FORMULA WAS DERIVED, INDEPENDENTLY RE-DERIVED FROM FIRST
    PRINCIPLES BY BOTH REVIEWERS (not merely arithmetic-checked), AND CONFIRMED CORRECT AS A MATHEMATICAL
    STATEMENT: Delta(log2_A_k) = (k/n_e)*Delta_p/ln2 * [mubar_{k-1}/mubar_k - 1/q_hat], where a single-
    block perturbation''s effect on the k-way aggregate statistic is diluted twice -- once by the k/n_e
    fraction of blocks actually affected, and again by a bracket term that vanishes exactly under an
    i.i.d.-blocks approximation. The Validator independently re-derived this via a combinatorial
    decomposition of E[C(S,k)] over k-subsets containing/not containing the perturbed block and confirmed
    it exactly. The Red Team independently re-derived it from measure.py''s actual log2_A_from_hists
    definition and confirmed the same formula to four significant figures.'
  - 'BUT THE RED TEAM FOUND THE FORMULA''S UNDERLYING APPROXIMATION IS ALREADY CONTRADICTED BY THIS
    CAMPAIGN''S OWN DATA, WHICH UNDERMINES THE 4.33e8 REQUIRED-T FIGURE AS A PRECISE NUMBER, NOT AS A
    MATHEMATICAL DERIVATION. Applying the SAME i.i.d.-blocks approximation the dilution formula relies on
    to the UNDEFECTED system predicts mubar_16/mubar_17 = 1/q_hat exactly -- but the campaign''s own
    committed PS-R3 baseline shows this ratio deviates by 13.4 percent (this is, in fact, restating
    EV-HQC-b71230''s own headline finding: the independence assumption is measurably wrong at these
    parameters). The two terms that nearly cancel to produce the tiny reported residual (0.012749 and
    -0.011244, netting to 0.001505) are each roughly 8.5x the surviving total, so an unmodeled correlation
    effect of the SAME ORDER as the campaign''s own headline anti-correlation signal would swamp the
    reported residual entirely -- plausibly making the TRUE required-T smaller, not larger, than 4.33e8.
    The Validator separately confirmed none of four independent Delta_p point estimates (the Red Team''s
    10.7 percent, the executor''s own reproduction, and two per-shard estimates) is itself statistically
    distinguishable from zero (McNemar |z| < 2 in every case), so 4.33e8 is one point on a wide, disclosed
    uncertainty band, not a decision-grade figure.'
  - 'THE DECISIVE NEW RESULT, WHICH THE EXECUTOR''S OWN TASK DECLINED TO COMPUTE AND THE RED TEAM SUPPLIED
    INDEPENDENTLY: applying the SAME validated dilution formula to a GLOBAL injection (V1-class,
    off-by-one truncation applied to ALL 56 blocks simultaneously, rather than V3''s single last-block
    injection) removes the k/n_e dilution factor entirely. The propagated effect scales by n_e (=56)
    relative to a single-block injection, and the required T scales down by n_e-squared (=3136)
    accordingly, giving an estimated required T of roughly 1.38e5 -- CHEAPER than the frozen
    specification''s own undefected T_req of 3.09e5, not more expensive. This was verified numerically
    using only already-committed numbers, with no new sampling, and directly reverses the pessimistic
    framing this batch''s own dispatch briefing had adopted before review.'
  - 'A COORDINATOR FRAMING ERROR WAS CAUGHT BEFORE IT ENTERED ANY PERMANENT LEDGER RECORD. The dispatch
    briefing for this batch''s reviews described the 4.33e8 figure as implying real-sampler injection is
    "astronomically infeasible... roughly 216,500 core-seconds... two orders of magnitude beyond budget."
    The Red Team confirmed by direct search that this framing does not appear anywhere in the reviewed,
    committed artifacts (reanalysis_report.md, reanalysis_results.json) and overclaims beyond what the
    executor''s own correctly-hedged report supports. Recorded and retracted here rather than allowed to
    stand uncorrected, per this campaign''s standing discipline of naming Coordinator overreads.'
  inference: 'The V3 (last-block-only) injection point is now understood, not merely suspected, to be a
    structurally poor choice for detecting this defect class: its k/n_e=1/56 dilution factor makes any
    real effect at that point extremely hard to distinguish from noise at any affordable T, independent
    of whether the defect itself would be a real problem in deployed HQC. This is a genuine methodological
    finding about instrument design, confirmed by two independent first-principles re-derivations. It is
    NOT evidence that real-sampler defect injection is infeasible in general: the same analysis, applied
    to a GLOBAL injection instead of a single-block one, suggests the opposite -- a required T cheaper
    than the specification''s own baseline T_req. The campaign''s next step should test this directly
    rather than either abandoning real-sampler work (unwarranted, given the global-injection projection)
    or committing further budget to refining the V3/single-block line (unwarranted, given the demonstrated
    structural dilution).'
  boundaries:
  - Toy. A reanalysis of already-collected data plus derived projections; no new experiment was run at
    either the tested (V3, single-block) or the projected (V1, global) injection point. No statement about
    A17, HQC''s decoding-failure rate, or any standardized parameter set.
  - This evidence record does not reopen, revise, or supersede EV-HQC-b71230, EV-HQC-db1fd9,
    EV-HQC-9a30d3, EV-HQC-163374, EV-HQC-bfb257, or EV-HQC-67a6ec, all of which stand exactly as archived.
  - "The ~1.38e5 required-T for a global injection is a PROJECTION from the same formula whose reliability
    is itself in question (per the independence-approximation critique above) -- it has NOT been measured
    or run, and the Red Team named two cheap, no-new-sampling controls that should validate the formula's
    reliability before this projection is trusted to better than an order of magnitude."
  - H-HQC-18d1b4 is untouched by this record in either direction; it remains PROPOSED.
  unresolved_confounds:
  - 'THE DILUTION FORMULA''S RELIABILITY ITSELF IS NOW AN OPEN QUESTION, NAMED BY THE RED TEAM WITH TWO
    CONCRETE, CHEAP, NO-NEW-SAMPLING CONTROLS: (1) an empirical conditional-vs-unconditional mubar_{k-1}
    check, comparing the formula''s i.i.d.-blocks assumption against already-collected PS-R3 data
    directly; (2) an SE-scaling in-range check. Both should run before either the 4.33e8 or the 1.38e5
    figure is treated as more than an order-of-magnitude estimate.'
  - The global-injection required-T projection has never been tested; a global (V1-class) pilot is the
    natural next experiment to both validate the dilution-formula projection and obtain the campaign''s
    first real signal (or a properly-powered null) through the actual cryptographic sampler.
  - Whether the excess correlation the dilution formula''s i.i.d. approximation ignores (the same 13.4
    percent deviation underlying EV-HQC-b71230''s own headline finding) would make a global injection''s
    true required-T higher or lower than 1.38e5 is unresolved; the Red Team''s argument shows the
    direction is ambiguous, not settled.
  reviewed_by: coordinator
