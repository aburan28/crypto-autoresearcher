  knowledge_promotion:
    promoted: []
    not_warranted: >-
      The methodological pattern here -- a diagnostic added in direct
      response to an earlier diagnostic's demonstrated blind spot can itself
      carry a real, quantifiable miscalibration (comparing a two-sided-
      selected statistic against a one-sided-calibrated threshold), and the
      correction can be tested cheaply by direct Monte Carlo before being
      adopted -- is genuinely reusable and is exactly the kind of technique
      knowledge/techniques/ exists to hold. It is not yet promoted because
      (a) it rests on one instrument, one pair of tested alternatives, and
      has not itself been independently red-teamed as a standalone technique
      claim; (b) the corrected calibration has not yet been adopted into any
      frozen contract, so there is no committed downstream use to point a
      corpus entry at. REVISIT CONDITION: if a future v4 (or a documentation
      correction to v3) adopts the corrected D4 calibration and it is
      independently reviewed in that context, promote at that point.

