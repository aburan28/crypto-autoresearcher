  scope: >-
    NARROW, as EV-INSTR-600710 was. This evidence bears on whether amendment
    v3 change E11's D3/D4/D5 diagnostic -- the concurrent session's own repair
    to the same acceptance-rule gap EV-INSTR-600710 identified -- is a
    genuinely well-calibrated discriminator between HEUR-INSTR-4 and a
    competing heavy-tailed explanation, as opposed to a diagnostic that
    merely fires often (which the simpler D1/D2 exceedance-count check in
    EV-INSTR-600710 turned out to be, once the matched-shape Gaussian arm was
    checked). It does not bear on H-INSTR-444c7b's H1, H2 or the scheduling
    half of H3, and makes no curve-side claim of any kind. claim_tier toy,
    sota_delta 0.

  summary: >-
    DEC-20260811-45583f paused dispatching a real successor SR3 v3
    characterisation run against the concurrently-approved
    amendments/v3.yaml, because it was not known whether v3's own repair
    (change E11's D3/D4/D5 diagnostic, scoped to fb=18/fb=22, requiring
    recurrence across 2+ rungs) would actually catch the kind of alternative
    EV-INSTR-600710 already demonstrated slips past v3's unchanged T2
    acceptance rule 18.8% of the time. This record captures the empirical
    answer, assembled across two dispatched tasks and independently verified
    by this Coordinator, a Validator and a Red Team, each performing at least
    one full independent from-scratch reproduction.

    STUDENT-T(5) ARM (the known-bad alternative). D5 fires within the exact
    rung window T2's own first-pass-wins rule would actually have measured
    before stopping, in 94/94 (100%, Wilson 95% CI [96.1%, 100%]) of the
    replications that reach accepted_rung. The structural "D5 could be
    foreclosed by an early accept" concern DEC-20260811-45583f's own
    rationale named does not manifest for this alternative: first-accepts
    never land before rung 7, leaving >= 4 rungs of D3/D4 data available in
    every case (RUN-INSTR-d5check-b8faf7).

    GAUSSIAN ARM (the matched-shape null-object control this Coordinator
    added after noticing the original task's own scope omitted it -- the
    SAME control that revealed EV-INSTR-600710's own D1/D2 diagnostic was
    weaker than first framed). D5 fires in only 21/485 (4.33%, Wilson 95% CI
    [2.85%, 6.53%]) of the Gaussian arm's own accepted replications, as
    implemented (D4 calibrated on the sample maximum only). Independently
    reproduced FOUR times in total (this Coordinator's own preliminary
    check; a Validator's from-scratch reproduction, VAL-20260811-1045a7; a
    Red Team from-scratch reproduction; and RUN-INSTR-d5check-gaussian-d7a937's
    own formal, committed run) -- all four agree on 21/485 exactly. Two of
    those four reproductions (the Validator's and the Red Team's) initially
    produced a WRONG number (20/485) due to a real bug (numpy
    SeedSequence.spawn()'s statefulness silently substituting draws when
    reused across two check passes in the same script), each caught only by
    mandatory cross-validation with a second, independently-structured
    implementation -- itself a demonstration of why this figure needed
    multiple independent reproductions before being relied upon.

    A GENUINE, QUANTIFIED CALIBRATION DEFECT, FOUND AND CHARACTERISED BY THE
    RED TEAM, INDEPENDENTLY CONFIRMED BY THE VALIDATOR AND BY
    RUN-INSTR-d5check-gaussian-d7a937. Comparing abs(D3's leave-one-out
    z-score) against D4's own threshold -- which is calibrated only on the
    sample MAXIMUM's LOO z-score, a one-sided quantity -- gives an ACTUAL
    per-rung-per-row false-positive rate of ~2%, not the nominal 1% implied
    by "the 99th percentile" and not the "roughly 1-in-100 to 1-in-300"
    amendment v3's own text states. This is because conditioning on "this
    point won the extremity contest" is not independent of the tail event,
    so the effective test size is close to the sum of both one-sided tails
    rather than half of it. RECALIBRATING D4 to the LOO z-score of the
    ACTUAL two-sided-selected D3 statistic (rather than the max alone) and
    rerunning both arms through the identical truncated-window pipeline
    drops the Gaussian-arm false-fire rate to 8/485 (1.65%, Wilson 95% CI
    [0.84%, 3.22%] -- independently reproduced twice more, by the Red Team's
    own ad hoc check at 7/485 and by RUN-INSTR-d5check-gaussian-d7a937's
    formal, committed run at 8/485; the two differ by one count out of 485
    due to ordinary Monte-Carlo-threshold noise between independently-seeded
    calibrations, not a substantive disagreement) WHILE LEAVING THE
    STUDENT-T ARM'S HEADLINE UNCHANGED AT 94/94 (100%). The defect, once
    corrected, IMPROVES D5's discriminating power; it does not undermine the
    finding.

    NET DISCRIMINATING CONTRAST: 100% (Student-t) vs. 4.33% (Gaussian,
    as-implemented) or 1.65% (Gaussian, properly calibrated) -- roughly a
    23x to 60x ratio, materially stronger than EV-INSTR-600710's own raw
    exceedance-count diagnostic (100% vs. 12.6%, roughly 8x).

    A REAL, UNRESOLVED RESIDUAL RISK, NAMED BY THE RED TEAM AND CONFIRMED IN
    THIS TASK'S OWN GAUSSIAN-ARM DATA. The structural "early accept
    forecloses D5's recurrence check" concern did not manifest for the
    Student-t(5) alternative (which never accepts before rung 7), but the
    SAME Gaussian-arm dataset shows 3 of 485 replications DO accept as early
    as rung 5 -- the bare 2-rung minimum window D5 needs -- and while none of
    those 3 happened to fire D5 in this finite sample, nothing about D5's
    design prevents a 2-of-2 coincidence at that minimal window in a
    resample or under a different alternative. The structural door
    DEC-20260811-45583f's rationale named is empirically real in this exact
    dataset; it simply did not open for the specific alternative tested.

  direction: supports
  direction_note: >-
    SUPPORTS, narrowly, the claim that amendment v3's E11 repair is a
    materially better-calibrated discriminator than the D1/D2 diagnostic
    EV-INSTR-600710 characterised, for the ONE heavy-tailed alternative
    tested against the ONE matched-shape null tested. It does NOT establish
    that E11 is sufficient by any pre-declared standard (none exists
    anywhere in this campaign's records -- R2(i), still open), does NOT
    establish that D5 would catch every plausible heavy-tailed alternative
    (only two specific distributions at one seed were tested), and does NOT
    close the early-accept-foreclosure risk in general (only for the tested
    alternative, which happens not to trigger it). It does not establish or
    revisit anything about HEUR-INSTR-4's own truth value (V1's charge,
    still inconclusive) and does not move H-INSTR-444c7b's status.

  strength: preliminary
  strength_note: >-
    Preliminary for reasons directly analogous to EV-INSTR-600710's own: (1)
    exactly two distributions were tested (Student-t df=5, Gaussian), not a
    swept family; (2) no pre-registered acceptable false-accept-rate target
    exists to judge either 4.33% or 1.65% against; (3) the corrected-D4
    variant (1.65%), while independently reproduced twice, has not itself
    been adopted into amendment v3's own text -- the amendment's "1-in-100 to
    1-in-300" claim is now known to be measurably inaccurate as implemented
    and should be corrected before further reliance; (4) the early-accept-
    foreclosure risk is confirmed structurally real (3/485 cases at the bare
    minimum window) even though it did not manifest for the tested
    alternative. Toy scale throughout (13 density rows restricted to fb=18/
    fb=22 for D3/D4/D5, seed counts up to 1536, pure statistical
    simulation); no transfer to cryptographic scale is claimed or implied.

  independent_review:
    validator:
      id: VAL-20260811-1045a7
      verdict: incomplete
      what_it_established: >-
        Fully reproduced the Student-t headline (94/94) across all 500
        replications from scratch, the D4 max-only calibration bit-for-bit,
        and 5 individual D3 LOO spot checks -- all exact matches. Flagged the
        missing Gaussian-arm null-object control as the reason for an
        "incomplete" rather than "passed" verdict (citing
        docs/inventor-protocol.md section 3 and this exact batch's own prior
        lesson), then independently reproduced it anyway (catching and
        fixing a SeedSequence-reuse bug in its own first attempt), confirming
        21/485 and the ~2% (not 1%) effective per-rung-per-row false-positive
        rate via its own Monte Carlo (1.946%-2.029% across n=96 and n=1536).
        Explicit that neither its own nor the Coordinator's reproduction
        constitutes admissible evidence absent a proper committed run.
    red_team:
      id: (returned as text output this session; not separately filed as a corpus record)
      verdict: neither_full_clear_nor_blanket_reaffirmation
      what_it_established: >-
        Independently reproduced 21/485 (after the same SeedSequence bug and
        fix), quantified the calibration defect via direct Monte Carlo
        (1.97% at n=96), tested and confirmed the fix (7/485 corrected,
        Student-t unchanged), and found the 3/485 early-rung-5-accept cases
        in the Gaussian arm's own data -- the concrete demonstration that the
        structural foreclosure risk is real, not merely hypothetical.
        Explicit recommendation: narrow DEC-20260811-45583f's pause rather
        than fully clear or fully reaffirm it.

