evidence:
  id: EV-FALSIFY-440677
  hypothesis_id: H-FALSIFY-40538b
  question_id: RQ-FALSIFY-a2c501
  experiment_ids: [EXP-FALSIFY-d770c1]
  run_ids: [RUN-FALSIFY-d770c1-001]
  finding_under_test: KN-FIND-a1f3c2
  type: empirical
  direction: supports
  direction_note: >-
    Supports the FINDING under test, and correspondingly contradicts prediction
    P-1 of the hypothesis that filed this experiment. Recorded as `supports`
    with respect to KN-FIND-a1f3c2, which is the claim the run was built to
    break.
  strength: moderate
  claim_tier: toy
  proof_status: empirical_only
  proof_refs:
    - experiments/EXP-FALSIFY-d770c1/specification.yaml
    - experiments/EXP-FALSIFY-d770c1/runs/RUN-FALSIFY-d770c1-001/raw-result.json
    - experiments/EXP-FALSIFY-d770c1/runs/RUN-FALSIFY-d770c1-001/manifest.yaml
  recorded_at: '2026-08-08'

  observations:
    - id: O-1
      text: >-
        KN-FIND-a1f3c2 asserts the monodromy of the m-th Semaev summation
        polynomial is exactly C_2^(m-2) for EVERY non-singular prime-field curve
        and EVERY m >= 3. C_2^(m-2) acting simply transitively on 2^(m-2) sheets
        is a regular cover, so every unramified specialisation must factor into
        irreducible factors of EQUAL degree, and every non-identity element of
        C_2^(m-2) has order 2. Admissible shapes are exactly [1]*2^(m-2) and
        [2]*2^(m-3). One inadmissible shape refutes the claim.
    - id: O-2
      text: >-
        m=4, primes 11..103: 906 usable specialisations, 435 skipped as
        degenerate. Shapes observed: [2,2] 723 times, [1,1,1,1] 183 times.
        ZERO inadmissible shapes. The 79.8/20.2 split is consistent with the
        Chebotarev prediction 3/4, 1/4 for a regular C_2^2 cover.
    - id: O-3
      text: >-
        m=5, primes 11..103: 368 usable specialisations, 629 skipped. Shapes:
        [2,2,2,2] 342 times, [1,1,1,1,1,1,1,1] 26 times. ZERO inadmissible
        shapes. No factor of odd degree above 1 was observed anywhere, and a
        single such factor would have required an odd-order element in a group
        of exponent 2.
    - id: O-4
      text: >-
        Controls. Null object: the minimal polynomial of +-s_1 +- ... +- s_k with
        s_i^2 = d_i, whose Galois group embeds in C_2^k and has exponent 2 by
        construction, returned 0 inadmissible shapes in 1340 trials at m=4 and
        932 at m=5. Positive control: S_4 and S_5 vanished on 207 and 101
        genuine relations respectively with 0 failures. Both controls passed, so
        the measurement is reportable.
    - id: O-5
      text: >-
        HARNESS INCIDENT, recorded because it is the most transferable result of
        this run. An uncontrolled first version of the m=5 probe reported 128 of
        457 specialisations (28.0%) as violations, including shapes [1,7], [3,5]
        and [8]. Those shapes are impossible for any group of exponent 2 and
        would have refuted a `proved`-adjacent finding decisively. Every one was
        an artifact: the intermediate resultant S4(x1,x2,x3,X) drops degree in X
        at some interpolation nodes, the Sylvester matrix silently shrinks, and
        interpolating across two normalisations yields a polynomial that is not
        the summation polynomial. Enforcing full nominal degree at every node
        removed all 128. The null object was clean in BOTH versions, which is
        precisely what localised the fault to the S5 construction rather than to
        the factorisation code.

  interpretation: >-
    KN-FIND-a1f3c2 was attacked with the sharpest cheap test available to it and
    was not refuted at m=4 or m=5 over primes 11..103.

  what_this_does_not_establish: >-
    This is a NON-REFUTATION, not a proof, and it does not raise the finding's
    proof_status. Three limits bind. First, the recorded proof sketch still
    argues "for generic parameters, these m-1 quadratic extensions are
    independent" and the finding still quantifies over EVERY curve; that
    quantifier gap is a defect in the ARGUMENT and no amount of sampling closes
    it, because an exceptional locus is by definition where genericity fails.
    Second, the sweep samples uniformly, so an exceptional locus of density below
    roughly 1/300 would not have been seen at these sample sizes; special
    families most likely to carry one -- CM curves, j=0 and j=1728, curves with
    full rational 2-torsion, anomalous and supersingular curves -- were NOT
    enumerated as such. Third, m >= 6 is untested, and the independence
    assumption has more to strain against as m grows.
    The correct reading is that the finding's CONCLUSION survived a real attempt
    on it while its recorded PROOF remains a derivation with an unrepaired
    quantifier step.

  dominated_by: not_applicable_methodological
  sota_delta:
    time_exponent: not_applicable
    note: >-
      No algorithmic claim. This record audits a corpus finding and reports that
      it held.

  knowledge_promotion: not_warranted
  knowledge_promotion_reason: >-
    A non-refutation at toy scale adds no new mathematical content and must not
    be promoted into the corpus as support: doing so would convert "we tried to
    break this and could not, at 11..103, for m in {4,5}" into apparent
    corroboration of a universal claim, which is the exact inflation this
    experiment exists to detect. The targeted-family sweep in
    docs/falsification-program.md F-1b is the successor that could change this.

  successor_task: >-
    F-1b in docs/falsification-program.md: re-run the m=4/m=5 sweep over
    ENUMERATED special families rather than uniform random curves, and extend to
    m=6, before any statement about KN-FIND-a1f3c2's universal quantifier is
    made either way.

  authority_note: >-
    Evidence only. No hypothesis status changed and no finding modified; only
    the Coordinator may do that (AGENTS.md rule 1).
