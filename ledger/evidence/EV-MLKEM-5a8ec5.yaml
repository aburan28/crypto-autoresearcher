  what_this_evidence_is: >-
    An adjudication of published text and code provenance under partially
    restored network access. It is evidence about the STANDING of four of this
    program's own prior findings, not a measurement of ML-KEM security. Nothing
    here bears on whether ML-KEM's parameters are sound.

  observations:
    - >-
      E-1 (ESTABLISHED, independently confirmed three times). The immutable run
      artifact
      experiments/EXP-MLKEM-010/vendor-lock/Carrier-2022-1750-hal-05406481.pdf
      is byte-identical to what https://hal.science/hal-05406481/document
      served on 2026-08-02: sha256
      083b142256eecaebfa72dfccf847151b2175666a3979cef4e7383376757b8005,
      1252838 bytes, HTTP 200. Recorded by the producer, re-derived by the
      Coordinator against the on-disk artifact, and re-derived again by the
      validator from its own independent download. KN-FIND-016 was therefore
      not derived from a copy that has since been replaced.
    - >-
      E-2 (ESTABLISHED). In that artifact, Table C.2 row CN / Kyber-512 reads
      log2(Tsample) = 143.30. The KN-FIND-016 transcription error is unfixed in
      the source the program holds. The same extract reads CC / Kyber-512
      log2(Pwrong) = -119.57, matching the figure KN-FIND-012 cites, which
      corroborates the extract against prior program work.
    - >-
      E-3 (INFERRED, NOT BYTE-PROVEN). The identification of that HAL object
      with ePrint 2022/1750 revision 3 of 3 (dated 2025-06-11) rests on
      retrieved metadata -- PDF /ModDate 2025-06-11, /Producer PDFLaTeX, the
      four-author current title on the title page, HAL deposit 2025-12-09
      postdating the last revision, and Unpaywall reporting the HAL location as
      version 'submittedVersion' -- and NOT on ePrint-hosted bytes, which
      returned HTTP 403 (cf-mitigated: challenge) on every attempt. A
      2023/302.pdf control failed identically, establishing the denial is
      path-class-wide rather than specific to this paper. Both the validator
      and the Coordinator reached the same wall independently.
    - >-
      E-4 (NEGATIVE, INFRASTRUCTURE). No GitHub head commit was observed for
      kevin-carrier/CodedDualAttack. api.github.com and github.com both
      returned 403 under a session-scoped repository denial; a numpy/numpy
      control failed identically. KN-FIND-014 is therefore NEITHER confirmed
      NOR contradicted. Per AGENTS.md rule 5 this is an infrastructure fact and
      is not evidence in either direction. The producer identified
      raw.githubusercontent.com as apparently reachable and deliberately
      declined to use it, on the ground that the session carries an explicit
      access denial; that abstention is recorded as correct conduct.
    - >-
      E-5 (CORRECTED BY RED TEAM -- the batch's own error). The producer
      dismissed Ducas-Pulles as not commensurable with Carrier Fig 4.1 on the
      ground that their T is a sample count rather than a score threshold. That
      is true of their Figure 4 and FALSE of their Figure 3, which is a score
      survival function structurally like Carrier Fig 4.1, with Figure 5 giving
      the good-target counterpart on the same axis at n = 40-90 and 2^45
      samples per curve. The Q3 label survives on the narrow "nobody
      experimentally measures Carrier's Pwrong at the aligned operating
      threshold" reading; the supporting claim that Ducas-Pulles "transfers
      nothing" does not survive. The residual named by KN-OPEN-016 is an
      INSTANTIATION gap, not a measurement-type gap.
    - >-
      E-6 (NULL-OBJECT CONTROL FAILED). The corpus-absence result for Q3 was
      produced by testing whether the token "Pwrong" -- Carrier's own notation
      -- appears in the retrieved full texts. Run against a paper that does
      report the quantity under different notation, that test returns False.
      Under docs/inventor-protocol.md "controls before belief", the corpus null
      is an artifact of the search instrument and is not admissible as evidence
      that no such measurement exists.
    - >-
      E-7 (DERIVATION, Coordinator-verified). log2(4000 * 241^3) = 35.7045.
      KN-FIND-012 records the Pwrong floor of the archived Fig 4.1 left-panel
      simulation as log2(Pwrong) ~ -35.70 at the last T with Pwrong > 0. These
      agree to two decimals because 1/N is the smallest nonzero value an
      N-sample empirical survival function can represent. The observed floor is
      therefore the ESTIMATOR'S RESOLUTION LIMIT, not a property of the
      distribution being estimated. Promoted as KN-FIND-031.
    - >-
      E-8 (SCOPE CORRECTION). E-1 establishes provenance for KN-FIND-016 only.
      KN-FIND-012, -013 and -014 trace to the CodedDualAttack repository and
      its data, which E-4 could not reach. KN-FIND-012 additionally carries no
      commit pin at all: EXP-MLKEM-011/specification.yaml records a bare branch
      URL and the run records its data path under /tmp. Those three findings
      remain provenance-unverified.
    - >-
      E-9 (INCIDENTAL, retrieved). ePrint 2022/1750 was retitled between
      revisions. The 2023 objection literature cites a three-author "Faster
      dual lattice attacks by using coding theory"; the current revision is
      four-author "Assessing the Impact of a Variant of MATZOV's Dual Attack on
      Kyber" (independently corroborated by the Unpaywall title field). Any
      reconciliation of KN-LIT-7617 against Ducas-Pulles must account for this.
    - >-
      E-10 (INCIDENTAL, retrieved abstracts only). ePrint 2026/1400 and
      2026/1326 build directly on this attack family and 2026/599 proves a
      code-based analogue "without using any model". 2026/1326's abstract
      states it corrects a parameter issue in previous Kyber estimates with
      22/31/41-bit reductions and cites Qu-Xu (ASIACRYPT 2025), which was never
      retrieved. The lane is active, not saturated.

  inference: >-
    The single durable result of this batch is E-1 + E-2: the erratum KN-FIND-016
    reports is real and unfixed in a source whose provenance is now pinned by
    three independent hash checks. Everything else the batch attempted was
    either blocked by access (E-3, E-4) or found defective on review (E-5, E-6,
    E-8). The batch's most valuable output is not its intended deliverable: it
    is E-7, an exact derivation showing that the Pwrong "floor" underpinning
    KN-FIND-012's headline 84-bit gap is a sampling-resolution artifact.
    KN-OPEN-016's residual is unchanged in substance but sharpened in
    description: the measurement that is missing is Carrier's Pwrong at the
    aligned operating threshold, and the reason it is missing is that the
    published simulation ran out of samples, not that the quantity is hard to
    define.

  boundaries:
    - >-
      Adjudication of published text and code provenance only. No key recovery,
      no cost model, no re-optimization, no G6K run, no measurement of any
      lattice quantity.
    - >-
      Establishes nothing about ML-KEM's security margin. ML-KEM is not broken
      and this record must never be cited as bearing on that.
    - >-
      E-2's "unfixed" is scoped to the HAL-hosted object. It is not a statement
      about ePrint-hosted bytes, which were never retrieved.
    - >-
      E-7 qualifies the interpretation of KN-FIND-012's floor value. It does
      not refute KN-FIND-012's coverage observation (fraction_inside = 0),
      which is a statement about disjoint T-ranges and stands unchanged.
    - >-
      No novelty claim is made or implied for any quantity. E-6 removes the
      basis on which one might have been asserted.

