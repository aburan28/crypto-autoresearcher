evidence:
  id: EV-MLKEM-5a8ec5

  record_status: independent_replication_not_authoritative
  authoritative_record: >-
    EV-MLKEM-017 on origin/main is the AUTHORITATIVE evidence record for
    GOAL-MLKEM-003 BATCH-007, together with DEC-20260802-15cadd. This record was
    written independently, under the same launch decision DEC-20260802-002 and
    the same task IDs, by a session that did not know the other execution
    existed. It was renamed from EV-MLKEM-017 to clear the collision
    (CORR-20260802-d8ba0e) and is retained because an independent execution that
    reaches the same verdicts is worth more than a discarded duplicate.
  replication_of: EV-MLKEM-017
  agreement_with_authoritative_record: >-
    Q1 agrees exactly: verdict confirmed_in_current_source, the same vendored
    artifact sha256 083b1422...b8005, and the same declared limitation that
    ePrint-hosted bytes were never retrieved so the HAL/ePrint-rev-3 identity is
    inferred. Both executions' red teams independently derived the counting
    resolution identity recorded here as E-7. The other execution additionally
    pinned the revision with an OAI-PMH datestamp (2025-06-11T13:35:08Z) that
    this execution did not obtain.
  divergence_from_authoritative_record: >-
    KNOWLEDGE PROMOTION. This record's decision (DEC-20260802-735e6a) promoted
    E-7 as KN-FIND-031. DEC-20260802-15cadd declined to promote, on the ground
    that E-7 would supersede coverage statistics carried by KN-FIND-012 and
    KN-FIND-014, making it a contradiction between validated evidence records,
    which AGENTS.md rule 12 gates behind an independent review-breakthrough
    review at max effort. THAT READING IS CORRECT AND THIS ONE WAS NOT:
    promoting E-7 through an ordinary batch decision routed around a gate that
    exists precisely for this case. KN-FIND-031 is withdrawn pending that review
    (CORR-20260802-d8ba0e). E-7 itself is unaffected -- it is arithmetic, and it
    was reproduced twice independently -- only its promotion to official
    knowledge standing is gated.
