  # ------------------------------------------- limitations ON THIS EVIDENCE ITSELF
  limitations_on_this_evidence:
    - id: L-1
      severity: PRINCIPAL
      title: >-
        CTRL-4 CONDITION (ii) IS A TAUTOLOGY OF THE CONSTRUCTOR. THE STRUCTURE
        LIMB OF THIS RECORD ESTABLISHES THE LENGTH PROPERTY AND NOT
        PHI-INVARIANCE.
      argument: >-
        harness.endomorphism_la._build_phi_invariant_factor_base mutates its
        output on exactly one path - orbit = [x, (zeta3 * x) % p,
        (zeta3 * zeta3 * x) % p] followed by xs.extend(orbit) - with xs never
        permuted, never inserted into and never appended to elsewhere, and the
        return xs[:B] preserving the first floor(B/3) contiguous triples intact.
        CTRL-4 condition (ii) then re-evaluates THE SAME ARITHMETIC EXPRESSION
        THE CONSTRUCTOR USED against the values that expression produced. IT IS
        A MIRROR TEST.
      the_mutation_was_RUN_not_argued: >-
        The TASK-20260730-034 red team called the committed builder at B = 192
        on CURVE-J12S1 with zeta3 = 5 (cube 125 mod 2293) and with zeta3 = 1234
        (cube 1799 mod 2293), NEITHER A CUBE ROOT OF UNITY, AND BOTH CTRL-4
        CONDITIONS REPORTED PASS IN BOTH CASES. AN ASSERTION THAT PASSES ON A
        FACTOR BASE BUILT FROM A NON-CUBE-ROOT IS NOT AN ASSERTION ABOUT
        PHI-INVARIANCE. This single mutation defeats the reading "both CTRL-4
        structure assertions PASS, therefore the factor base is phi-invariant as
        the derivation assumes".
      what_survives: >-
        ONLY CONDITION (i), len(F) == B. OF THE TWO LIMBS OF HYPOTHESIS D-3,
        ONLY THE LENGTH LIMB WAS ACTUALLY TESTED. Any successor sentence of the
        form "D-3 holds on committed code", without that qualification, would
        violate the batch's own prohibition against treating D-3 as established
        beyond what the probe measures.
      what_the_condition_structurally_cannot_see: >-
        THE ONE STRUCTURAL VARIABLE THE LADDER IS BUILT ON. The frozen contract
        states that at B = 3q + 1 the last phi-orbit is TRUNCATED to a single
        element whose phi-image is not in F. Condition (ii) checks only COMPLETE
        blocks and is therefore BLIND BY CONSTRUCTION to the truncated tail. At
        B = 193 the probe correctly records the tail index [192] and checks
        nothing about it.
      the_identities_do_nevertheless_hold: >-
        STATED SO THE LIMITATION IS NOT MISREAD AS A DEFECT IN THE ARITHMETIC.
        Both the probe and the validator evaluated 192 identities at each B with
        zero failures, and the red team claims no counterexample exists,
        offering SELF-F1 as the test that would falsify its own objection:
        exhibit any (inst, B, zeta3) whose complete blocks violate the identity,
        and this limitation falls entirely.
