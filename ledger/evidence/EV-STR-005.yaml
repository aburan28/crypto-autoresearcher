    - id: O-6
      what: >-
        TWENTY-FOUR OF THE TWENTY-EIGHT SUPPLY UNITS REPORT A SATURATED
        INSTRUMENT CONSTANT RATHER THAN A SUPPLY MEASUREMENT, AND THE MEMBERS
        ARE NAMED. len(relations) = 60 = Q at L24, L25, L48, L49, A12M3 and
        A13M3, both arms - TWELVE UNITS. len(relations) = 106 or 107 = Q at L96,
        L97, X96 and X97, both arms - EIGHT UNITS. len(relations) = 183, the
        target-cycle ceiling, at L192 and L193, both arms - FOUR UNITS. ONLY L12
        AND L13, BOTH ARMS - FOUR UNITS - REPORT AN UNCENSORED NUMBER: 29 and 17
        at L12 (arms A-prime and E-prime), 31 and 20 at L13.
      basis: empirical_only
      consequence: >-
        len(relations) should rise with Q and flatten when either the quota or
        the distinct-target supply binds. It is flat at exactly Q, or at exactly
        183, at 24 of 28 units. ANY LADDER STATEMENT ACROSS B BUILT ON THOSE
        CELLS IS CONFOUNDED ABOVE THE CEILING, and the two cells the batch was
        built around, L192 and L193, are the two most confounded in it.
    - id: O-7
      what: >-
        THE 183 CEILING IS A PROPERTY OF THE COMMITTED TARGET GENERATOR, NOT OF
        THE CURVE, THE FIELD OR EITHER FACTOR BASE, AND BOTH REVIEWS FIND THIS
        INDEPENDENTLY. harness.endomorphism_la._collect_relations generates
        targets by k = (t_idx + 1) * c mod (n - 1) + 1 with
        c = max(2, inst.seed % max(2, n - 3)). On CURVE-J12S1, n = 733 and the
        derived seed is 100, so c = 100 and gcd(100, 732) = 4; the progression
        visits exactly (n - 1) / gcd(c, n - 1) = 732 / 4 = 183 distinct k
        values, and both reviewers confirmed by direct computation that these
        yield exactly 183 distinct target x-coordinates. 183 IS 732/4, A
        DIVISIBILITY ACCIDENT OF THE DERIVED SEED AGAINST n - 1.
      basis: empirical_only
      the_validator_pinned_it_further: >-
        IT IS GENUINE SATURATION OF THE GENERATOR'S IMAGE AND NOT A
        BREAK-CONDITION ARTIFACT, AND IT IS NOT EXHAUSTION OF THE CURVE. The
        validator simulated the loop's own generator over t ranges of 300, 1010
        and 5000 and obtained 183, 183, 183 - INVARIANT - so the
        range(num_targets * 5) break is not the binding constraint. But over all
        k in 1..n-1 the curve affords 366 distinct x-coordinates
        (= (n - 1)/2, since k and n - k share an x), and the loop reaches
