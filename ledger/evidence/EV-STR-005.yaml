    - id: O-2
      what: >-
        PART A, CONDITION (ii), THE BLOCK IDENTITY. At B = 192 and at B = 193 the
        probe checked 64 complete blocks and 192 individual identities
        F[3j + k] == pow(zeta3, k, p) * F[3j] % p, with ZERO failures and an
        EMPTY failing (j, k) list at each. At B = 193 the single tail index
        [192] lies outside every complete block and NOTHING WAS CHECKED ABOUT
        IT. The validator re-derived the same 192 identities independently at
        each B and also found zero failures.
      basis: empirical_only
      CRITICAL_QUALIFICATION_THAT_TRAVELS_WITH_THIS_OBSERVATION: >-
        THE IDENTITIES HOLD AND THE CHECK IS NON-INFORMATIVE. See limitation L-1.
        This observation establishes NO property of the factor base and MUST NOT
        be reported as verified phi-invariance.
    - id: O-3
      what: >-
        THE LENGTH CLAUSE HAD A LARGE UNQUANTIFIED MARGIN AT THE TESTED
        PARAMETERS, AND THE RED TEAM QUANTIFIED IT. Re-running the committed
        builder read-only, it measured 139 draws consumed at B = 192 against a
        permitted trial bound of 10600 (about 76.3x) and 140 against 10650
        (about 76.1x). It measured 1099 liftable x-coordinates affording 366
        distinct full phi-orbits on this instance, verified that the liftable
        set is CLOSED under x -> zeta3 * x because a = 0 makes
        (zeta3 * x)^3 + b = x^3 + b so the per-member curve test rejects
        nothing, and locates the first short return at B of about 1142 -
        ROUGHLY SIX TIMES THE TESTED B.
      basis: empirical_only
      status_of_the_figures: >-
        RED-TEAM DIAGNOSTIC, EXPLICITLY LABELLED BY THAT SESSION AS NOT A BATCH
        MEASUREMENT AND NOT EVIDENCE. Carried here because it is what makes O-1
        interpretable. The boundary sweep was run on CURVE-J12S1 ONLY; the red
        team names that gap itself under SELF-F3 as a live falsifier of its own
        objection.
    - id: O-4
      what: >-
        PART B. All twenty-eight (cell, arm) units completed with terminal
        status `completed` and valid true. |factor_base| == B at 28 of 28.
        include_phi_orbits was passed as the literal False at 28 of 28 calls
        plus the 4 determinism repeats, verified by the validator BOTH from the
        per-record field AND from the driver source, which contains exactly ONE
        _collect_relations call site with no conditional and no other path.
        `units_not_completed_named` is the empty set and the validator
        independently finds it empty.
      basis: empirical_only
    - id: O-5
      what: >-
        THE PRE-REGISTERED SUPPLY CLAUSE WAS EVALUATED AT ALL 28 UNITS AND DID
        NOT FIRE, AND THIS IS REPORTED WITH ITS MARGIN AND NEVER AS "THE
        FALSIFICATION CONDITION PASSED". shortfall = max(0, R_base(B) -
        len(relations)) equals 0 at 28 of 28 units; the MAXIMUM SHORTFALL OVER
