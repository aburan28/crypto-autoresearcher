  # ---------------------------------------------------------------- observations
  observations:
    - id: O-1
      what: >-
        PART A, CONDITION (i), THE LENGTH LIMB OF HYPOTHESIS D-3. At snapshot
        commit e3cf9fdd, on CURVE-J12S1, harness.endomorphism_la._build_phi_invariant_factor_base
        returned a list of length EXACTLY 192 when called with B = 192, and of
        length EXACTLY 193 when called with B = 193. Both report PASS on
