  strength: preliminary

  strength_justification: >-
    `preliminary` AND NOT HIGHER, ON FOUR GROUNDS THAT ARE STATED RATHER THAN
    LEFT TO BE INFERRED.
    (1) ONLY ONE OF THE PRE-REGISTERED CONDITION'S CLAUSES WAS A REAL TEST. The
    supply clause (shortfall >= 2) was genuinely capable of firing and was
    cleared - the tightest unit L12/arm_E_prime returned 17 relations where
    firing required 3 or fewer against R_base = 5. The length clause
    (len(F) != B) was capable in principle and DEAD IN PRACTICE at these
    parameters: the committed builder consumed 139 of 10600 permitted draws at
    B = 192 and 140 of 10650 at B = 193, a margin of about 76x, and the red team
    measures the first short return at B of about 1142 on this instance, roughly
    six times the tested B.
    (2) TWENTY-FOUR OF THE TWENTY-EIGHT SUPPLY UNITS REPORT A SATURATED
    INSTRUMENT CONSTANT rather than a supply measurement (see O-6). Only the
    four L12/L13 units report an uncensored number.
    (3) ONE HOST, ONE SOFTWARE STACK, ONE REALISATION PER CELL, TWO INSTANCES.
    Every quantity is DETERMINED, not sampled; the independent validator's
    separate-process re-execution of all 28 units and both Part A assertions is
    a REPRODUCTION OF A DETERMINISTIC COMPUTATION and is NOT a replication
    across instances, seeds, machines or implementations of the instrument.
    (4) THE PRINCIPAL STRUCTURAL ASSERTION IS NON-INFORMATIVE (see
    limitations_on_this_evidence.L-1).
    `replicated` IS EXPRESSLY REFUSED. Reproducing a deterministic function on
    the same host against the same committed bytes is not replication in this
    ledger's sense, and assigning `replicated` here would also trip the
    knowledge-promotion gate on a record that establishes no durable claim.
    `anecdotal` IS ALSO REFUSED as understating: eight of eight artifact hashes
    were independently re-derived from git object content by two sessions, all
    28 units and both assertions were re-executed in a SEPARATE PROCESS by a
    non-originating validator with zero mismatches, R_base and Q were recomputed
    at 14 of 14 cells before the probe's table was read, and the falsification
    condition was independently recomputed rather than accepted.

