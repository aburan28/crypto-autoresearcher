  # --------------------------------------------------------------- what this is
  title: >-
    Two structure assertions on harness.endomorphism_la._build_phi_invariant_factor_base
    at B = 192 and B = 193 on CURVE-J12S1, and twenty-eight base-row supply
    counts from harness.endomorphism_la._collect_relations with
    include_phi_orbits = False at fourteen named cells and two named factor
    bases. A TOY-SCALE COMMITTED-CODE INSTRUMENT PROBE. NOT AN ATTACK, NOT AN
    ATTACK IMPROVEMENT, NOT A CRYPTANALYTIC RESULT, NOT A CLOSURE, AND NOT A
    TEST OF H-STR-002's MECHANISM.

  hypothesis_id: H-STR-002
  hypothesis_id_note: >-
    RECORDED FOR LANE PROVENANCE AND FOR NOTHING ELSE. THIS RECORD MOVES
    H-STR-002 IN NEITHER DIRECTION AND BEARS ON NO PREDICTION OF IT. H-STR-002
    STAYS `weakened` on DEC-20260727-009's grounds, which are untouched here,
    and ledger/hypotheses/H-STR-002.yaml is NOT staged, NOT edited and NOT
    superseded by any card of BATCH-015. The probe measures no alpha, no
    phi_alpha, no displacement rank, no misalignment set, no rank deficiency, no
    yield and no cost, and it invokes no closure of either arm. Queue rule N-1
    binds this field.

