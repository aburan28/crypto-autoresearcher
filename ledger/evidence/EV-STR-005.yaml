        EMPTY. THE TIGHTEST UNIT IN THE WHOLE PROBE IS L12/arm_E_prime, at
        len(relations) = 17 against R_base = 5, where firing required
        len(relations) <= 3 - clear of the firing threshold by a factor of 5.7
        and of R_base itself by 3.4x.
      basis: empirical_only
      independence: >-
        The validator recomputed shortfall at all 28 units by the pre-registered
        rule from its own re-execution, confirms fired = false and maximum
        shortfall 0 INDEPENDENTLY AND NOT ON THE EXECUTOR'S WORD, and separately
