        CONSTRUCTION, with hits = attempts = 183 in both arms and the loop's
        remaining 827 of 1010 iterations doing nothing but continue. NO CELL ON
        CURVE-J12S1 CAN EVER OBTAIN MORE THAN 183 BASE ROWS regardless of B or
        Q, so any future execution at larger quota on this curve HITS THE SAME
        WALL SILENTLY. The shortfall is nonetheless 0 because 183 remains far
        above R_base = 65 and 66, which is why the falsification condition
