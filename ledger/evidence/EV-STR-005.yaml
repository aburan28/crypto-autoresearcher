        the two pre-registered clauses with no third clause, no threshold
        substitution and no re-weighting. The red team reached the same
        conclusion by the same two routes.
      why_this_limb_matters: >-
        THIS WAS THE ONE REAL TEST IN THE PROBE AND IT WAS PASSED. The red team,
        which found the other two limbs uninformative, records this one as
        GENUINELY CAPABLE: at B = 12 and m = 2 the pair-coverage argument gives
