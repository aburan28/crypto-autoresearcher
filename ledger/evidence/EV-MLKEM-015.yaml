evidence:
  id: EV-MLKEM-015
  hypothesis_id: H-MLKEM-014
  experiment_ids: [EXP-MLKEM-015]
  run_ids: [RUN-MLKEM-015-001]
  type: empirical
  direction: supports
  strength: preliminary
  claim_tier: medium
  certificate_refs: []
  proof_status: empirical_only
  proof_refs:
    - experiments/EXP-MLKEM-015/runs/RUN-MLKEM-015-001/results.json
    - experiments/EXP-MLKEM-015/runs/RUN-MLKEM-015-001/summary.md
    - experiments/EXP-MLKEM-015/runs/RUN-MLKEM-015-001/kyber_official_security_estimates.txt
    - experiments/EXP-MLKEM-015/execution-report.yaml
    - experiments/EXP-MLKEM-015/source-lock.yaml
  observations:
    - >-
      Under pinned lattice-estimator 3e48ef4 with RC.MATZOV, dual_hybrid+fft
      log2(rop) is 143.79 / 203.79 / 273.82 for Kyber512/768/1024, while
      primal_bdd is 140.20 / 200.96 / 270.72. Dual does not beat primal
      (gaps +3.59 / +2.83 / +3.09 bits).
    - >-
      Carrier (KN-LIT-7617) claimed dual costs 139.5 / 195.1 / 259.7 sit
      4.29 / 8.69 / 14.12 bits below the estimator dual_hybrid+fft.
      MATZOV-2022 (KN-LIT-110) claimed 137.5 / 193.5 / 257.8 sit
      6.29 / 10.29 / 16.02 bits below the same instrument.
    - >-
      primal_bdd under MATZOV is nevertheless below NIST classical cutoffs
      143/207/272 by 2.80 / 6.04 / 1.28 bits on all three sets — so the
      MATZOV gate-count revision alone pressures category margins via the
      primal, independent of dual-attack headlines.
    - >-
      ADPS16 primal_usvp 118.55 / 182.21 / 255.21 reproduces pq-crystals
      Kyber.py classical core-SVP 118 / 183 / 256 within 0.55 / 0.79 / 0.79 bits
      (CTRL-OFFICIAL-CORESVP).
  inference: >-
    H-MLKEM-014 is supported at claim_tier medium under the pinned instruments.
    For KN-OPEN-016 this narrows the residual question: any dual claim that
    undercuts these dual_hybrid+fft numbers by several bits (Carrier / MATZOV-2022)
    must justify ingredients beyond the public MATZOV dual in lattice-estimator,
    while category-margin pressure under MATZOV costing already appears in
    primal_bdd. This is not a cryptanalytic break of ML-KEM and carries no
    solution certificate.
  boundaries:
    - Named cost models only; cross-model comparisons are out of scope for the decision rule
    - lattice-estimator matzov dual ≠ Carrier polar-code repair
    - Module-LWE modeled as LWE via schemes.Kyber*
    - No FIPS-203 text was readable under network policy; Kyber Round-3 (KN-LIT-7618) is the parameter primary
  status: accepted_with_qualifications
  review_refs:
    - coordination/goals/GOAL-MLKEM-003/batches/BATCH-001/tasks/TASK-20260731-002/validation_report.yaml
    - coordination/goals/GOAL-MLKEM-003/batches/BATCH-001/tasks/TASK-20260731-003/red_team_report.yaml
  created_at: '2026-07-31'
