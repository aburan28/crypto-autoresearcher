evidence:
  id: EV-INSTR-03fdcf
  hypothesis_id: null
  hypothesis_note: >-
    This record moves no hypothesis. H-INSTR-fffbfb asks whether NULL-C can be
    REPLACED by a blocked permutation; this record asserts only an instrument
    fact about why the version-1 ladder's non-monotone verdicts arise, and
    settles the replacement question in neither direction.
  question_id: RQ-INSTR-f8faa0
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aa267f
  experiment_ids:
  - EXP-INSTR-85b102
  run_ids:
  - RUN-INSTR-85b102-poolA-c
  - RUN-INSTR-85b102-poolB-b
  - RUN-INSTR-85b102-poolC
  - RUN-INSTR-85b102-poolD
  type: empirical
  direction: refutes
  direction_note: >-
    Refutes the version-1 execution report's own attribution of its non-monotone
    ladder verdicts to Monte-Carlo error. It refutes an instrument
    interpretation, not a mathematical hypothesis.
  strength: replicated
  strength_justification: >-
    `replicated` and no higher, on the calibration set before the fact by
    RT-20260808-5e244e's B5: the count reproduces at two primes and four pools,
    under two independent re-implementations of the verdict rule (the
    Coordinator's and the reviewer's) and against a third derivation from
    per_curve.csv and rung_table.json that imports no harness code at all. It is
    NOT higher because every run is toy scale, one backend, and one campaign.
  claim_tier: toy
  certificate_refs:
  - >-
    certificate.kind: none, EXPLICITLY. This is a re-derivation over committed
    artifacts, not a solve or a relation. The verification that stands in place
    of a certificate is the closed-form premise check: the null mean re-derived
    from per_curve.csv and rung_table.json using the specification's own
    formulas with NO harness import, over 720 cells, maximum relative deviation
    6.5e-16.
  proof_status: empirical_only
  proof_refs:
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-aa267f/reviews/breakthrough/report.yaml
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-aa267f/reviews/red-team-nonmonotonicity/report.yaml
  - ledger/corrections/CORR-20260807-732541.yaml
  - ledger/corrections/CORR-20260808-045334.yaml
  observations:
  - >-
    THE NON-MONOTONE VERDICTS ARE NOT MONTE-CARLO ERROR. Every ladder cell stores
    an EXACT closed-form null mean carrying zero Monte-Carlo error. Re-running the
    contract's own verdict rule on that exact ratio instead of the empirical one
    returns the IDENTICAL 74 of 144 non-monotone cells, with 144 of 144 cells
    agreeing. Setting the Monte-Carlo error to exactly zero changes nothing, so
    Monte-Carlo error cannot be the cause. Independently reproduced three times:
    by the Coordinator, by RT-20260807-743198, and by RT-20260808-5e244e.
  - >-
    THE PARAMETRIC VERSION AGREES. Of the 59 non-degenerate-to-non-degenerate
    reversals, 55 exceed three combined Monte-Carlo standard errors against an
    expectation of 0.08 under the most generous instance of the noise hypothesis.
  - >-
    WHETHER A CELL REVERSES IS GOVERNED BY THE FUNCTIONAL'S COUPLING TO THE GROUP
    ORDER. Functionals that are exact or affine functions of N are monotone in 24
    OF 24 cells; every other functional is non-monotone in 74 of 120. Fisher exact
    one-sided 2.6e-09. Consequently Delta_max(N) does not order the null means of
    functionals the N-blocking does not act on, and the contract's
    `what_non_decay_means` clause fires BY CONSTRUCTION on those functionals.
  - >-
    NEGATIVE RESULT, RECORDED WITH THE POSITIVE ONE. No mechanism beyond
    N-coupling is identified, and the campaign's attempt to find one failed: the
    CTRL-VALUESHUFFLE control designed for that purpose is VOID
    (CORR-20260808-045334), its terminal state STRUCTURE_PRESENT is withdrawn as
    uninterpretable, and the m = 3 sum-set localization is withdrawn as
    unsupported.
  inference: >-
    The version-1 execution report attributed its non-monotone ladder verdicts to
    Monte-Carlo noise. That attribution is refuted, and the governing variable is
    instead the functional's coupling to the group order N -- the very variable
    the blocking ladder is built on. This is an instrument finding about how the
    blocked-permutation ladder behaves, and it bears on how every ladder verdict
    in this campaign must be read: a non-rising ratio on an N-uncoupled
    functional is expected behaviour of the design, not an unnamed-nuisance tell.
  boundaries:
  - >-
    Toy scale only: p in {4001, 6007}, four declared pools, one campaign, one
    backend. NOTHING TRANSFERS TO CRYPTOGRAPHIC SCALE AND NOTHING IS OFFERED.
  - >-
    This says NOTHING about isogeny-class structure, endomorphism rings, or ECDLP
    cost. sota_delta is zero on every axis; no speedup against any baseline is
    produced or claimed.
  - >-
    It does not establish that NULL-C should be replaced OR retained. That is
    H-INSTR-fffbfb's question and this record does not answer it.
  - >-
    The clustering result is measured over the declared functional list of one
    contract. Whether N-coupling governs reversal on a different functional family
    is untested.
  unresolved_confounds:
  - >-
    NO MECHANISM IS IDENTIFIED BEYOND N-COUPLING, and the one control built to
    look for one was void. What produces the residual reversals among N-uncoupled
    functionals is unknown and is NOT claimed to be anything.
  - >-
    `two_torsion_x` sits at the resolution floor with R = 0.647 at POOL_C R4 and
    R = 0.912 at POOL_D R3. FLAGGED, NOT CLAIMED: no control has been run against
    it and this record attaches no interpretation to it.
  - >-
    The version-1 execution report's section 12 item 3 is defective in BOTH
    clauses: its noise attribution (refuted here) and its descriptive claim that
    most non-monotone cells lie within ~0.5% of 1 at the free rung, which is 21 of
    74 (28%), median |R_free - 1| = 0.0155. Neither clause may be cited.
  reviewed_by: coordinator
  review_provenance: >-
    COMPLETE, AND THE REVIEW THAT PERMITTED THIS RECORD ALSO VOIDED THE WORK IT
    WAS COMMISSIONED TO BLESS. RT-20260808-5e244e is the AGENTS.md rule 12
    `review-breakthrough` review, dispatched by this Coordinator with an explicit
    instruction to be willing to fail the line. It reached all five of its
    questions. It UPHELD B1 -- the finding recorded above -- while ruling the
    CTRL-VALUESHUFFLE control VOID (the statistic is invariant under the
    correctly matched conditional null: a within-finest-band shuffle returns
    exactly 50 in 30 of 30 replicates, p = 1.0), demonstrating that a pure-N
    surrogate with zero arithmetic content reproduces the whole result (residue
    median 48 against the observed 50, below the committed null minimum in 60 of
    60 draws), and showing the Coordinator's exclusion set was the weakest
    defensible one on a monotonically decaying sequence. This record asserts ONLY
    what that review permitted, in the scope it permitted.

    Earlier in the chain: the version-1 execution was independently validated
    (five checks, passed_with_findings) and the non-monotonicity was separately
    reviewed by RT-20260807-743198, whose N-coupling clustering result is carried
    here. The Coordinator independently re-derived the 74/74 count before
    recording it.

    LIMITATION CARRIED, NOT CONCEALED: every review in this chain resolved to the
    same model on the same backend as the Coordinator, so "independent" means
    independent context and a fresh adversarial reading, not independent
    judgement from a different model.
  permitted_assertion_verbatim: >-
    On the four operative runs of EXP-INSTR-85b102 (RUN-INSTR-85b102-poolA-c,
    -poolB-b, -poolC, -poolD; p in {4001, 6007}; claim_tier toy, sota_delta zero
    on every axis), the 74-of-144 non-monotone ratio verdicts along the N ladder
    are NOT Monte-Carlo error -- re-running the contract's own verdict rule on
    the exact, zero-Monte-Carlo closed-form null mean returns the identical 74
    cells with 144 of 144 agreeing, and 55 of the 59
    non-degenerate-to-non-degenerate reversals exceed three combined Monte-Carlo
    standard errors against an expectation of 0.08 -- and whether a cell reverses
    is governed by the functional's coupling to the group order, monotone in 24
    of 24 cells whose functional is an exact or affine function of N and
    non-monotone in 74 of 120 others (Fisher exact one-sided 2.6e-09), so
    Delta_max(N) does not order the null means of functionals the N-blocking does
    not act on and the contract's `what_non_decay_means` clause fires by
    construction on them; this says nothing about isogeny-class structure,
    endomorphism rings, or ECDLP cost.
  permitted_assertion_note: >-
    This sentence was written by RT-20260808-5e244e as the exact scope it would
    permit, and is reproduced verbatim rather than paraphrased. Any citation of
    this record should quote it whole; shortening it drops the boundary clauses
    that make it true.
