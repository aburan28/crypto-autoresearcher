# =============================================================================
# EV-ICPERF-10c5fc -- the Riemann-Roch decomposition-oracle panel on ECC2K-130
#
# WHAT THIS RECORD IS: a measured characterisation of the Riemann-Roch (Nagao)
# point-decomposition oracle on the exact Certicom ECC2K-130 curve, against
# three controls: Semaev-via-SAT on matched targets, brute-force pair
# enumeration as a null object, and rho's own multi-target amortisation law.
#
# WHAT IT IS NOT: it is not a boundary-table row, and it does NOT discharge
# GOAL-ICPERF-e6b6a4 criterion C1. No relation matrix Lambda, no full-DLP
# solve S, and no matched-rho column on this host is computed from these runs.
# C1 remains UNMET. The panel measures an ORACLE, which is one phase of one
# column.
#
# EXTERNAL PROVENANCE. Every artifact cited here lives in a DIFFERENT
# repository (github.com/aburan28/crypto) and no RUN-* record exists in this
# ledger for any of it. The binding is therefore content-first, exactly as
# CLAUDE.md "Archive receipts bind to CONTENT first" requires: each artifact is
# named with its sha256 as read from `crypto` at origin/main commit 50ea716.
# A reader who cannot reach that commit can still verify the bytes.
# =============================================================================
evidence:
  id: EV-ICPERF-10c5fc
  hypothesis_id: null
  hypothesis_id_note: >-
    Null deliberately. The panel was designed and run in another repository
    outside this ledger's hypothesis lifecycle, so there is no approved
    hypothesis whose prediction it scores. Naming H-ICPERF-cc4847 or
    H-ICPERF-2c57cc here would assert that a prediction of one of them had been
    tested; none was. This is the same category error CORR-20260916-b35a05
    corrects, and it is avoided rather than repeated.
  experiment_ids: []
  experiment_ids_note: >-
    Empty for the same reason. The six rounds ran under contracts frozen in the
    other repository (research/nagao_relations/solver_{10..15}/contract.json),
    each written before its own execution, but none is an EXP-* record here.
  run_ids: []
  run_ids_note: >-
    Empty, and this is the honest reading: these are not this program's runs.
    The artifacts are bound by content below instead.
  goal_ids:
    - GOAL-ICPERF-e6b6a4
  question_ids:
    - RQ-ICPERF-94c86e
  type: empirical
  direction: weakens
  direction_basis: >-
    Weakens the proposition that a Riemann-Roch decomposition oracle gives
    index calculus a route below rho on ECC2K-130. Every one of the four
    measurements below points the same way, and two of them are controls that
    would have had to come out differently for the direction to be `supports`.
  strength: replicated
  strength_basis: >-
    Replicated rather than strong. The RR-versus-Semaev separation (32/32
    against 0/32 at d = 6) is a wide margin on 128 trials with 0 errors and 28
    independently re-verified relations, and the null-object control was run
    before belief rather than after. It is not `strong` because every number is
    at toy dimension d <= 8 on a curve whose real base is d = 131, because the
    d = 7 operation ratio was WITHDRAWN (see unresolved_confounds), and because
    no reviewer in this program has read the artifacts.
  claim_tier: toy
  claim_tier_basis: >-
    Toy, unambiguously. The curve is the real ECC2K-130 (K_0: y^2 + xy = x^3 + 1
    over GF(2^131), #E = 4r with r the 129-bit prime
    680564733841876926932320129493409985129), but the factor bases are
    F_2-subspaces of dimension d = 4..8, and the subspace-structure round
    reached d = 80 only for an EXISTENCE question, not for relation search. No
    statement here transfers to d = 131 without an assumption that is not
    tested.
  certificate_refs: []
  certificate_refs_note: >-
    No solve is claimed, so no solution certificate is owed. The 28 relations
    ARE independently re-verified, but by a re-derivation inside the run script
    rather than by a certificate this ledger's wrapper can re-check: `verify()`
    rebuilds each point from its abscissa, tries all eight sign patterns, and
    raises unless a signed sum reaches the target. That is a relation check, not
    a claim-tier certificate, and it is not asserted as one.
  proof_status: derivation
  proof_refs:
    - >-
      The target-side degree-2 vanishing-ideal result is a DERIVATION, not a
      measurement: nested V_d implies nested D_d implies a shrinking degree-2
      ideal, so the ideal being exactly trivial at d = 6 forces it trivial for
      every d >= 6, at both m = 3 and m = 4. The m = 4 exact-kernel computation
      (d = 5 dim 6967, d = 6 dim 0 over 140400 distinct points, rank 8647)
      supplies the base case; monotonicity supplies the rest.
  observations:
    - >-
      SOLVER SEPARATION (solver_10, 128 trials, 0 errors, 28 verified
      relations). At d = 6 on matched ECC2K-130 targets with identical
      factor-base constraints and identical budgets, the Riemann-Roch encoding
      in L(4O) (f = x^2 + ax + c + by, div(f) = (P_1)+(P_2)+(P_3)+(-R)-4(O))
      returned 32 of 32; Semaev-via-SAT returned 0 of 32. The oracle-equality
      assertion was deliberately stood down where no exhaustive oracle exists
      (an `AnyExpected` sentinel), so the 32/32 is a relation count that
      `verify()` re-derived, not an agreement with a stored answer key.
    - >-
      NULL OBJECT BEATS THE METHOD (solver_12). Brute-force pair enumeration
      over the factor base -- the null object, carrying none of the
      Riemann-Roch structure -- cost 0.494x the field operations of the
      quadratic-image RR search at d = 6, on IDENTICAL solution sets. The
      structure is not paying for itself at the measured dimension.
    - >-
      METHOD CEILING IS QUADRATIC WITH A SMALL CONSTANT (solver_13). The ratio
      of RR candidates to |F|^2/2 read 3.00, 3.12, 2.33, 1.92, 1.99 at
      d = 4, 5, 6, 7, 8, and the operation ratio fell 2.83 -> 1.55 across the
      same range. So the oracle realises the generic Theta(|F|^2) cost of 3SUM
      over a group with a constant near 2. This PARTIALLY FALSIFIED the frozen
      prediction, which said "roughly flat"; the ratio fell instead, and the
      result is reported against the prediction rather than around it.
    - >-
      AMORTISATION DOES NOT COMPETE WITH RHO (solver_11). The share of the
      relation search amortisable across a target batch measured 0.12% at
      d = 6 and 0.07% at d = 7. Rho amortises k simultaneous DLPs as
      sqrt(k r), so per-target cost falls as 1/sqrt(k) (GLS / Kuhn-Struik; the
      same law is enforced in the other repository at src/ecc_safety.rs:416).
      A 0.12% shared prefix cannot reach that. This is the measurement that
      bears most directly on the parallel session's 16-target claim of 28%
      fewer instructions and 22% less time: whatever that benchmark shared
      across its batch, it was not this oracle's relation search.
    - >-
      THE STRUCTURE CERTIFICATE EXPIRES AT d = 6 (solver_14 defective,
      solver_15 sound). Weil descent of S_4 in a V-basis gives 131 Boolean
      equations in 3d unknowns, total degree 6, multidegree (2,2,2). A LINEAR
      no-certificate -- some functional lambda with lambda(S_4(x_1,x_2,x_3,x(R))) = 1
      for all of V^3 -- exists iff the affine span of the value set misses 0.
      Measured span dimensions were 71, 97, 123 at d = 4, 5, 6, and the span
      SATURATES the full 131 from d = 7 onward (confirmed by direct measurement
      at d = 45). So the certificate that can cheaply rule out decomposability
      stops existing at d = 6, while existence itself remains open to d = 45.
    - >-
      THE PRODUCT LAW AND THE FREE-ORACLE FLOOR (derivation, not measurement).
      relations x targets x oracle = m * 2^131 independently of dim V, so the
      required oracle speedup is 2^-(70.19 + log_2 m). Charging the oracle
      NOTHING AT ALL, the floor table reads m = 2 -> 2^89.25,
      m = 3 -> 2^68.58, m = 4 -> 2^56.40, m = 5 -> 2^48.44, m = 6 -> 2^42.85,
      m = 8 -> 2^35.61, against rho's 2^60.8090 reference (which already
      includes the <-1> x <pi> speedup). Read carefully: the m = 3 free-oracle
      floor is WORSE than rho. Only m >= 4 is even in principle below it, and
      m = 4 by 2^-4.41.
    - >-
      THE FAMILY BOTTOM, MEASURED. The best orbit-union configuration at m = 2
      bottoms at 2^124.99, which is 2^+64.18 times rho; the implicit base is
      2^132.58, or 2^+71.77 times rho. The coverage/scaling bound
      min(1, C(B+2,3)/r) and yield conservation (KN-FIND-007: mean yield
      C(B+m-1,m)/N for EVERY base of size B) together explain why widening the
      Hamming-weight base or adding summands moves the cost within this family
      and never out of it -- which is what the parallel session's four
      screening configurations (weight 2/8/10 with 3 summands, weight 2 with 14
      summands) found empirically: 12 natural queries, no relations within
      budget.
  inference: >-
    On ECC2K-130 at the dimensions reachable on this hardware, the
    Riemann-Roch decomposition oracle is a CORRECT but STRUCTURALLY INERT
    improvement: it beats Semaev-via-SAT decisively and loses to brute-force
    pair enumeration, it realises the generic quadratic cost of the underlying
    3SUM rather than beating it, and its amortisable share is three orders of
    magnitude short of rho's 1/sqrt(k). The arity arithmetic then bounds the
    whole family from the other side: even a FREE oracle leaves m = 3 above
    rho, so no oracle engineering at m = 3 can produce a crossover, and m = 4
    offers at most 2^4.41 of headroom before any oracle cost is charged.
    The honest summary is that this line does not produce an index-calculus
    algorithm faster than rho on ECC2K-130, and the reason is arithmetic rather
    than implementation.
  boundaries:
    - >-
      Curve: exactly ECC2K-130, K_0: y^2 + xy = x^3 + 1 over GF(2^131), in a
      permuted type-II optimal normal basis. Nothing here is claimed for any
      other curve, including the other Certicom challenge curves or the FIPS
      binary curves.
    - >-
      Factor-base dimension: d = 4..8 for every relation-search and
      cost-ratio number. The d = 45 and d = 80 figures are span-dimension
      measurements for the certificate question ONLY and carry no relation-search
      cost.
    - >-
      Summand count: m = 3 for the solver panel. The m = 4 numbers are the
      free-oracle floor (derivation) and the exact-kernel computation, not
      relation search.
    - >-
      Solver: the panel's own RR quadratic-image search and pair enumeration,
      plus Semaev-via-SAT. No Groebner engine was run in this panel; the
      Groebner side of this comparison is GOAL-ICPERF-e6b6a4's own instrument
      work and is untouched here.
    - >-
      Budget: identical per-configuration caps across the matched arms, which
      is what makes the 32/32-versus-0/32 comparison meaningful. Timeouts are
      recorded as timeouts and are NOT read as negative mathematical evidence
      (AGENTS.md rule 3) -- which is precisely the rule the withdrawn d = 7
      ratio broke.
    - >-
      Rho reference: 2^60.8090 is a PUBLISHED figure for ECC2K-130 with the
      <-1> x <pi> speedup, not a measurement on this host. Every "versus rho"
      statement above is arithmetic against that published number. The matched
      same-host rho column that C1 requires does not exist.
  unresolved_confounds:
    - >-
      WITHDRAWN NUMBER, disclosed rather than buried. solver_12's d = 7
      operation ratio compared a COMPLETED pair enumeration against solver_10
      d = 7 arms that TIMED OUT, which makes it a comparison between a finished
      run and an unfinished one. It is withdrawn in
      research/nagao_relations/solver_12/CORRECTION.md, the derived column is
      nulled, and raw.jsonl is left untouched. Only the d = 6 figure of 0.494x
      is quoted anywhere in this record, and any later reader quoting a d = 7
      operation ratio from this panel is quoting a retracted value.
    - >-
      solver_14 is DEFECTIVE and superseded, not deleted:
      research/nagao_relations/solver_14/DEFECT.md records that
      `plantedTarget()` enumerated all 2^d - 1 abscissas (16.7M lifts at
      d = 24) and the round was killed by its author at d = 12. solver_15
      re-ran it with sampling and reached d = 80. No solver_14 number is cited
      above.
    - >-
      No independent reviewer in THIS program has read any of these artifacts.
      Two adversarial reviews did run in the other repository's session (they
      caught an arity error that claimed the m = 4 prize of 2^56.40 for an
      m = 3 object whose floor is 2^68.58, and a headroom overstatement of
      2^11.44 that requires a materialised orbit-union base unavailable for an
      F_2-subspace), and both corrections are already folded into the
      observations above. That is not the same as review under this ledger's
      independence checks.
    - >-
      Constant-factor question left open: whether an implementation with a
      better constant than the panel's could beat pair enumeration at d = 6 is
      NOT settled. It is also not the question that matters, because the
      free-oracle floor bounds the family regardless of the constant.
  obstruction:
    statement: >-
      On ECC2K-130 the decomposition-oracle family is bounded below by its own
      arity arithmetic, not by oracle implementation quality: the product law
      relations x targets x oracle = m * 2^131 is independent of dim V, so with
      the oracle charged ZERO the family's floor at m = 3 already exceeds rho.
      Separately, and for the implementation rather than the family: the
      Riemann-Roch encoding realises the generic Theta(|F|^2) cost of 3SUM over
      a group with constant near 2, so it is not beating the structureless null.
    quantity: >-
      (a) free-oracle floor at m = 3, in bits, against the ECC2K-130 rho
      reference of 2^60.8090; (b) ratio of RR search field operations to
      brute-force pair-enumeration field operations at d = 6; (c) ratio of RR
      candidates to |F|^2/2; (d) amortisable share of the relation search
      across a target batch.
    value: >-
      (a) 2^68.58, i.e. 2^+7.77 WORSE than rho, with m = 4 at 2^56.40 the first
      row below it and only by 2^-4.41; derivation from the product law, no
      error bar applies. (b) 0.494x at d = 6 on identical solution sets -- the
      null object is roughly twice as cheap. (c) 3.00, 3.12, 2.33, 1.92, 1.99
      at d = 4, 5, 6, 7, 8; single-configuration measurements, no replicate
      spread recorded, so no error bar is claimed. (d) 0.12% at d = 6 and
      0.07% at d = 7, against rho's per-target 1/sqrt(k).
    measured_by: []
    measured_by_note: >-
      No RUN-*/EXP-* id exists, and stating one would be a fabrication. The
      values are read from the external artifacts bound by content in
      external_provenance below -- (a) from the note's section 5.3, (b) from
      solver_12/summary.json at d = 6 only, (c) from solver_13/summary.json,
      (d) from solver_11.
    scope: >-
      ECC2K-130 only (GF(2^131), #E = 4r, r the 129-bit prime above); m = 3 for
      (b), (c), (d); m in {2,...,8} for the (a) floor table; factor-base
      dimension d = 4..8; the panel's own solvers. The obstruction is claimed
      for no other curve, no other m at (b)-(d), and no larger d.
    resource_check:
      examined: true
      reading: >-
        The check ran and found TWO readings, one of which is already in use.
        (i) The product law read forwards is a SPECIFICATION, not just a bound:
        it says exactly what an m = 4 oracle must cost to clear rho
        (2^-(70.19 + 2) speedup, 2^4.41 of headroom), which converts an
        open-ended search into a costed target. That is how the m >= 4 rows
        remain live work rather than closed. (ii) The span saturation at d = 7
        is a resource for the CONVERSE question: a value set whose affine span
        fills F_2^131 from d = 7 is a statement that S_4's Weil descent is
        non-degenerate there, which is the input a first-fall-degree argument
        needs. Against that: the target-side degree-2 vanishing ideal is
        EXACTLY TRIVIAL for all d >= 6 at both m = 3 and m = 4 (proved by the
        monotonicity argument in proof_refs), which kills the low-degree
        certificate route on the target side. That derivation was what retired
        the top-ranked fresh candidate during the portfolio pass, and it is
        recorded here so no later session re-proposes it.
      spawned_ids: []
      spawned_ids_note: >-
        None yet. Reading (i) is what makes the Certicom-binary and FIPS-binary
        cost-table work the ranked successor named in successor below; when that
        is authored as an IDEA-*/H-*, it belongs in this list via a superseding
        record, never by editing this one.
