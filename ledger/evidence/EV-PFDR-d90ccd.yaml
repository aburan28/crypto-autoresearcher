  cross_joint_reading:
    note: >-
      The Coordinator's own composition across joints that no single blinded
      reviewer could see. Identity and arithmetic only, from archived values;
      labelled as this Coordinator's, not a reviewer's finding.
    F6_with_F7_identity: >-
      Per instance, with X = 2*S_3, ratio_rank^2 = 4S^2/(r_rank*N) =
      ratio_frozen^2 * (r_frozen/r_rank), an exact identity. Fitted on the same
      55 rows, OLS slopes therefore add exactly: slope(log2 ratio_rank) =
      slope(log2 ratio_frozen) + (1/2)*(slope(log2 r_frozen/|F|) - slope(log2
      r_rank/|F|)) = -0.033838 + 0.5*(0.040822 - 0.002959) = -0.014907, which
      equals F7's -0.014907 (VR calibration/out/f7.stdout). So F7's decline is
      the r_frozen ratio's decline (the harvested pair count approaching the
      X^2/N collision budget) plus half the growth of the pair multiplicity
      r_frozen/r_rank. The red team's descriptive per-rung aggregate T under
      r_frozen at m = 4 on mode (45 premise-holding instances per rung) falls
      from 2.507 at 12 bits to 1.115 at 30 bits (99% [1.070, 1.161]) and 1.128
      at 32 bits (99% [1.089, 1.182]) (RT attacks/out/09_agg_by_rung.json), and
      the exactly generic replica follows the same path over 12..24 bits as its
      harvested share of X^2/N rises from 0.45 to 0.77 (red team F6,
      09b). The lemma in aggregate (DN D6) bounds this T at >= 1, so, IF the
      lemma holds for this adaptive engine, the first component has roughly
      10% headroom left at 30..32 bits and the F7 decline cannot continue as a
      power law. A continuation below 1 beyond calibrated error would be the
      TW-BREAK aggregate condition. This reconciles F7 with F6 (no sub-floor
      reading, no aggregate violation). It does not decide the asymptotic
      question, because the adaptive-engine expectation form (DN D3) is
      unproven.

