  claim_tier_note: >-
    The `claim_tier` enum is toy|medium|crypto, and this record is
    provenance/literature-tier: `type: literature`, about what published
    sources say and about the retrieval and statistical status of the
    program's own reading of them. It is never a measurement of ML-KEM
    security. `toy` is the honest ceiling because the only measured data
    touched anywhere in this record are Carrier's archived verifyModel outputs
    at q=241, m=40, n=43/50 and Ducas-Pulles' published score samples at
    n=40..90 — toy dimensions against Kyber's beta approximately 384-816.

  direction_note: >-
