    about ML-KEM security, about Carrier's Kyber cost figures, or about whether
    the dual attack beats the primal attack. Observation O11 would, if adopted,
    weaken H-MLKEM-011's headline coverage statistic — but that is a
    contradiction of validated evidence records (EV-MLKEM-011, EV-MLKEM-013) and
