  inference: >-
    BATCH-007 was an adjudication of published text and code, and independent
    review corrected its headline on two of its three questions. What it
    establishes, exactly: (1) the Table C.2 CN/Kyber-512 cell reads 143.30 in
    the authors' most recent self-deposited full text, now verified from bytes
    retrieved fresh from the authoritative repository, and no correction exists
    in any retrievable source including a HAL deposit made roughly six months
    after the last ePrint revision — but whether the ePrint-hosted revision-3
    bytes read the same is INDETERMINATE, because nobody has seen them;
    (2) Carrier's code head is the pinned commit, so Q2 adds no information
    about KN-FIND-014 beyond confirming nothing changed, and the k_fft alignment
    that all aligned statistics depend on remains a single un-replicated run;
    (3) Q3's broad negative-existence form is FALSE — Ducas-Pulles report
    measured Pwrong at the measured Pgood=1/2 threshold, on a common score scale,
    with a 9.12-bit floor excess at n=90 that I verified myself — while its
    narrowed form, about Carrier's polar-coded score at Carrier's Fig 4.1
    parameters, stands; and (4) the coverage statistic the program has been
    headlining is confounded: all three archived Pwrong files stop exactly at
    -log2(nb_iteration * q^k_fft), so fraction_inside=0 and the ~421 aligned
    T-gap measure how far the sample reached, not a gap in the distribution.
    Findings (3) and (4) are corrections to THIS PROGRAM's posture, not to
    Carrier. Nothing here is evidence about ML-KEM security in either direction,
    and no conjunction of the three verdicts licenses a security inference:
    "the erratum survives" does not imply "the security claim is wrong". Under
    AGENTS.md rule 12, finding (4) is a contradiction of validated evidence
    records and routes to independent `review-breakthrough` at `max` before it
    may change the official status of EV-MLKEM-011 or EV-MLKEM-013; their status
    is unchanged by this record.

  boundaries:
    - >-
      Not a measurement of ML-KEM security. FIPS 203 / ML-KEM parameter sets are
      neither affected nor cleared by anything in this record. No security level,
      cost model, or attack complexity is asserted or revised; COST-MLKEM-001 is
      untouched.
    - >-
      Q1 is indeterminate with respect to the bytes hosted at eprint.iacr.org for
      revision 3. Supported statement: "the authors' most recent retrievable
      self-deposited full text reads 143.30 and no correction was found."
      Unsupported statement: "the current ePrint revision reads 143.30."
    - >-
      BOUNDARY ON KN-FIND-012 AND KN-FIND-014 COVERAGE STATISTICS
      (red-team objection 2, coordinator-verified): `fraction_inside = 0` and the
      aligned T-gap of about 420.56 are BUDGET-LIMITED quantities. Each archived
      Pwrong file's support ends exactly at its counting-resolution floor
      1/(nb_iteration * q^k_fft), so those numbers state where the sample
      expired, not where the distribution ends. The nb_iteration required to
      reach the aligned Pgood minimum at score 2222.56 was not computed in this
      batch. Any future use of those statistics must carry this boundary. This is
      a boundary recorded on a new evidence record; it changes no field of
      KN-FIND-012, KN-FIND-014, EV-MLKEM-011 or EV-MLKEM-013, which are immutable
      and are superseded, never overwritten (AGENTS.md rule 4).
    - >-
      The Ducas-Pulles counter-evidence measures the MATZOV / Dual-Sieve-FFT
      score as reconstructed in their section 2.3, not Carrier's polar-coded
      score under Approximation 4.9, and at n=40..90 — toy scale against Kyber's
      beta approximately 384-816 (AGENTS.md rule 7). It refutes Q3's broad form
      and does not settle Carrier's.
    - >-
      Q2's confirmation is by object identity (head == pin). It establishes that
      the repository was not updated between 2025-04-13 and 2026-08-02 and that
      the quoted code facts are accurate there; it is not corroboration by an
      independent source and not a re-derivation of KN-FIND-014's interpretation.
    - >-
      No G6K run, no fresh lattice computation, no new sieve, and no cost model
      were executed or built in BATCH-007. KN-OPEN-016 remains open; this record
      does not resolve whether the dual attack beats the primal attack.
    - >-
      Where measured data are touched at all, they are toy-parameter
      (q=241, m=40, n=43/50 for Carrier; n=40..90 for Ducas-Pulles). No
      crypto-scale claim is made or implied.
    - >-
      This record makes no status change to EV-MLKEM-011, EV-MLKEM-013,
      KN-FIND-012, KN-FIND-013, KN-FIND-014, KN-FIND-016 or KN-OPEN-016.

  unresolved_confounds:
    - >-
      The counting-resolution confound itself: verified arithmetically, but its
      consequence for the official standing of EV-MLKEM-011 and EV-MLKEM-013 is
      unresolved pending the AGENTS.md rule 12 `review-breakthrough` review at
      `max`. Until that review exists, the contradiction is recorded as
      alleged-and-coordinator-verified and nothing downstream may treat those
      records as corrected.
    - >-
      The k_fft=3 alignment convention (EV-MLKEM-013's synthetic identity check)
      is a single un-replicated run and was not re-derived in BATCH-007. If it is
      wrong, every aligned Q3 statistic moves, and neither the validator's report
      nor the executor's would have caught it.
    - >-
      Guo-Johansson (ASIACRYPT 2021, KN-LIT-109) full text remains unretrieved by
      the executor, the validator and the red team; OpenAlex reports no
      open-access location and the Lund record exposes no full-text link. That
