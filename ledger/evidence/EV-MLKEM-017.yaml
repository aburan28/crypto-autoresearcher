    before it may change their official status. It is therefore carried here as
    alleged-and-coordinator-verified, and no status changes. Red-team objection
    11 named `direction: supports` on any such hypothesis as the failure mode to
    watch for; it is not realized.

  observations:
    # ---------------------------------------------------------------- Q1
    - >-
      Q1 CORRECTED to `indeterminate` with respect to the bytes hosted at
      eprint.iacr.org for revision 3 of ePrint 2022/1750. The executor
      (TASK-20260802-101) recorded `confirmed_in_current_source`; the validator
      (TASK-20260802-103, defect D1) found every cited observation reproduced but
      the verdict LABEL not entailed, and recommended `indeterminate`; the red
      team (TASK-20260802-104, objection 7) reached the same conclusion. No byte
      of the ePrint-hosted full text was observed by anyone: executor HTTP 403
      Cloudflare; validator HTTP 403 at 2026-08-02T17:42:52Z; red team HTTP 403
      (R1, 5381 B, sha256 aa340c87...). The identification of the adjudicated
      text with that revision rests on administrative metadata (ePrint history
      "2025-06-11: last of 3 revisions"; OAI datestamp 2025-06-11T13:35:08Z;
      embedded /ModDate 2025-06-11T13:28:36Z; HAL deposit record; OpenAlex and
      Semantic Scholar OA-location enumeration) plus a validator-added
      content-level link (abstract token similarity 0.888, all six headline
      numbers present in both). None of those touches Appendix C, which is the
      only thing Q1 asks about.
    - >-
      Q1 SUB-FINDING A (survives at full strength). In the authors' most recent
      self-deposited full text — HAL hal-05406481 v1, submitted 2025-12-09,
      sha256 083b142256eecaebfa72dfccf847151b2175666a3979cef4e7383376757b8005,
      1252838 bytes — Table C.2 block "CN:" row Kyber-512 reads
      "-120.51 7.71 143.30 117.91 124.00 0.71 -7.49"; "143.30" occurs exactly
      once document-wide and "134.30" occurs zero times. Established three
      independent ways: executor pypdf extraction; validator by a hand-written
      zlib content-stream decoder (291 FlateDecode streams, no pypdf) AND by
      pypdf 6.14.2, which agree, page 37 byte-identical to the vendored extract;
      red team from FRESH bytes fetched 2026-08-02 (R4/R5/R6, HTTP 200,
      1252838 B, same sha256, cmp-clean against
      experiments/EXP-MLKEM-010/vendor-lock/Carrier-2022-1750-hal-05406481.pdf).
    - >-
      Q1 SUB-FINDING B (survives at full strength). No authors' correction of
      that cell exists in any retrievable source. ePrint's own current record
      shows no revision after 2025-06-11, and the HAL deposit — made 2025-12-09,
      roughly six months after that last ePrint revision — still carries 143.30.
      If the authors had corrected the cell, their own December-2025 deposit is
      where it would have appeared.
    - >-
      Q1 COLLATERAL CORRECTION (red-team objection 6, material). The executor
      recorded the HAL document/file URLs as unretrieved behind an Anubis
      proof-of-work interstitial and used that, with the ePrint 403, to explain
      why no byte comparison was possible. Plain curl retrieved the file at three
      HAL URLs. Two consequences, both recorded: (a) favourable — the vendor-lock
      artifact is reproducible today from the authoritative repository, so
      SUB-FINDING A now rests on freshly retrieved bytes rather than only on a
      once-vendored snapshot; (b) unfavourable — the executor's gloss that
      /CreationDate D:20260721165108+02'00' is "HAL cover-page stamping at
      download time, 2026-07-21" is falsified, since a download on 2026-08-02
      carries the same 2026-07-21 stamp. That gloss is withdrawn. It sat inside
      the argument asking a reader to trust embedded PDF timestamps as revision
      evidence; SUB-FINDINGS A and B do not depend on it.

    # ---------------------------------------------------------------- Q2
    - >-
      Q2 RECORDED AS "unchanged since derivation / no new information", not as
      corroboration (red-team objection 8; validator Q2 scope_limit).
      `git ls-remote` resolves HEAD and refs/heads/main of
      kevin-carrier/CodedDualAttack to
      9c1367f85d26038244bc83c025d84c0b7006f2ee — executor at 2026-08-02T17:23:58Z,
      validator independently at 17:42:53Z, advertising no other ref — and that
      is the exact commit EXP-MLKEM-013/specification.yaml pins in
      source_refs.code_commit. Head equals pin, so "has the code changed since
      KN-FIND-014 was derived?" is closed by object identity and yields zero new
      bits about the finding. The quoted code facts hold verbatim at that commit
      (FFT_sample.py sha256 2a5f3dedceb68b0836efc92f0b58294ce4193a9553493e7c0d4e4ce67b922531
      identical at head, at raw.githubusercontent /main, and in
      experiments/EXP-MLKEM-013/vendor-lock/; the validator regenerated the full
      167-file sha256 manifest byte-identically).
    - >-
      Q2 RESIDUAL, STATED EXPLICITLY. EV-MLKEM-013's synthetic identity check
      (raw cosine sum == fftn(.).real, factor exactly k_fft) was NOT re-run in
      BATCH-007 — not by the executor, not by the validator, not by the red team.
      The k_fft=3 alignment convention that converts the raw T-gap into the
      reported aligned 420.5579 is taken as frozen from a single un-replicated
      2026-07-31 run, and every aligned Q3 statistic depends on it.
    - >-
      Q2 SCOPE. The asymmetry lives in verifyModel/ScoreExperimentalDistribution/,
      a verification-model directory. No retrieved artifact shows that
      directory's convention produced Table 5.1 or Table C.2, so nothing here
      reduces to a statement about the paper's published analysis.

    # ---------------------------------------------------------------- Q3
    - >-
      Q3 NARROWED, AND ITS BROAD FORM FALSIFIED. Q3 as posed ranged silently over
      two different score functions with different answers (red-team objection 1;
      validator defect D3). NARROWED FORM, supported: no source retrieved in
      BATCH-007 reports a measured Pwrong at or near the aligned Pgood approx 1/2
      operating threshold FOR CARRIER'S POLAR-CODED SCORE at Carrier's Fig 4.1
      parameters. BROAD FORM, false: "no source has measured Pwrong at the
      aligned Pgood operating threshold" does not hold.
    - >-
      Q3 COUNTER-EVIDENCE, INDEPENDENTLY VERIFIED BY THE COORDINATOR under
      TASK-20260802-105. I fetched
      https://raw.githubusercontent.com/ludopulles/DoesDualSieveWork/main/data/bdd_scores_n90.csv
      (23345 B, sha256 8f16c416...) and .../unif_scores_n90.csv (80027 B,
      sha256 9e5685a3...) myself. Both carry N=377126, i.e. a common score scale
      with no k_fft-style rescaling required. The first bdd score with
      cdf_real >= 0.5 is 3521.487; the first unif score >= it is 3655.211, whose
      measured log2_sf_real is -46.415 against a predicted -55.53 — a 9.12-bit
      floor excess, in the direction that INCREASES Pwrong, with the measured
      uniform support extending 1.11x past the threshold. A measured Pwrong AT
      the aligned Pgood=1/2 threshold therefore exists in the published
      literature.
    - >-
      Q3 COUNTER-EVIDENCE AT THE OTHER FIVE DIMENSIONS, recorded on the red
      team's retrievals (R13/R14 sha256 lists) and NOT re-verified by me:
      measured log2(Pwrong) at the measured Pgood=1/2 threshold is -7.301
      (predicted -7.403) at n=40, -10.135 (-10.252) at n=50, -14.655 (-14.729)
      at n=60, -21.712 (-21.789) at n=70, -33.151 (-33.235) at n=80, with
      support factors 4.10/3.71/2.35/1.94/1.46. I verified the n=90 row only;
      the other five are reported here with their source and their unverified
      status, not asserted as coordinator-checked.
    - >-
      Q3 STEELMAN, CARRIED HONESTLY (red team's own narrowing). Ducas-Pulles
      measure the MATZOV / Dual-Sieve-FFT score of [LW21, GJ21, MAT22] as
      reconstructed in their section 2.3 — NOT Carrier's polar-coded score under
      Approximation 4.9 — and at n=40..90, which is toy scale against Kyber's
      beta approximately 384-816. This does NOT establish that Carrier's Pwrong
      has been measured at Carrier's threshold. The real defect is that Q3 never
      said which of the two questions it was asking, and the two have different
      answers.
    - >-
      Q3 RETRIEVAL FACT (red-team objection 9; process, not mathematics). The
      source carrying the counter-evidence was recorded by the executor as
      unretrievable after two attempts against a single host (eprint.iacr.org).
      The red team reached the paper in three hops — OpenAlex (R7) -> CWI
      repository landing (R9) -> https://ir.cwi.nl/pub/33407/33407.pdf (R11,
      HTTP 200, 1021750 B, sha256 947f2826...) — and the authors' data repository
      in one more (R12, ludopulles/DoesDualSieveWork @
      f390d77b21d40d711add90791fbe86d2c695ce35). Counted from provenance.json,
      the confirming side of Q1 received about 17 attempts across eight hosts;
      the source most likely to REFUTE Q3 received two attempts on one host; the
      executor spent 1260 s of a granted 3000 s, so this was not budget-forced.
      The program's own corpus entry for that source, KN-LIT-111, records
      "The ePrint abstract was fetched and read" under "Not verified here" — the
      full text has been reachable and unread. This is an infrastructure and
      process fact about the search, never evidence about the mathematics
      (AGENTS.md rule 5).

    # ------------------------------------------- counting-resolution confound
    - >-
      COUNTING-RESOLUTION CONFOUND, INDEPENDENTLY VERIFIED BY THE COORDINATOR
      under TASK-20260802-105 (red-team objection 2, blocking). All three
      archived Carrier Pwrong files terminate exactly at their counting-resolution
      floor -log2(nb_iteration * q^k_fft). I recomputed each: nb_iteration=4000
      gives -log2(4000 * 241^3) = -35.70450 against the recorded -35.7045
      (delta 0.0000); nb_iteration=1 gives -23.7387 against the recorded -23.74;
      nb_iteration=6000 gives -36.2894 against the recorded -36.29. The validator
      reached the same result from the other direction (defect D5): the last
      positive value equals exactly one observed count,
      1/(4000 * 241^3) = 1.7860305406935986e-11, bit-for-bit the recorded
      value_at_last_positive, and all 1804 entries are integer multiples of that
      quantum. The FFT scores all q^k_fft candidates per iteration, so the run
      scores 4000 * 241^3 = 55,990,084,000 = 2^35.7045 candidates and 2^-35.7045
      is its smallest representable non-zero empirical probability.
    - >-
      WHAT THE CONFOUND DOES AND DOES NOT SHOW. The support endpoint T=1802 is
      set by run length, not by the score distribution; nb_iteration was never
      varied and the identical measurement was never run against a matched-budget
      control. Under docs/inventor-protocol.md section 3 this is the artifact
      tell in its exact form — the parameter that is supposed to destroy the
      coverage gap is nb_iteration, the endpoint is a closed form in that
      parameter, and it was never increased. It does NOT show that
      fraction_inside=0 or the aligned T-gap 420.5579 were computed incorrectly;
      the validator recomputed both exactly. It shows they are confounded with
      the sample budget and therefore cannot be read as properties of the score
      distribution.

    # ------------------------------------------------------- package integrity
    - >-
      PACKAGE INTEGRITY (validator VAL-20260802-b1cb71, verdict
      ADMISSIBLE_WITH_DEFECTS; role-terminal verdict `incomplete`). Snapshot
      commit 38cc4402087bae7578472d03dffda61764d1d3bf is reachable from HEAD,
      has the declared parent b71403265d782449e227c10f46f3b076d8a47761, and
      changes exactly its 46 declared paths; every declared artifact sha256
      recomputes; all 22 vendored bodies match their provenance records; the
      immutable experiments/EXP-MLKEM-010/vendor-lock PDF was not touched. Seven
