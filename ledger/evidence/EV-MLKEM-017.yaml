      citation was found by the validator or the red team, and the executor's one
      mis-identified source (ePrint 2021/948, which is not Guo-Johansson) was
      caught and preserved by the executor rather than deleted.
    - >-
      RED-TEAM VERDICT: `blocking_objections` (RT-20260802-3a440d), 11 objections.
      Its `clears_to_pass_with_constraints_if` list carries four conditions,
      treated here as the repair specification; this record implements all four
