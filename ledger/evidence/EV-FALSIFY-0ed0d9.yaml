evidence:
  id: EV-FALSIFY-0ed0d9
  hypothesis_id: H-FALSIFY-40538b
  question_id: RQ-FALSIFY-a2c501
  experiment_ids: [EXP-FALSIFY-d770c1]
  run_ids: []
  run_ids_note: >-
    No run. The mathematical test F-8 pre-registered turned out to be MOOT, for
    the reason given in O-3, and the surviving defect is documentary. Nothing was
    executed because nothing needed to be.
  findings_under_test: [KN-FIND-9d2f56, KN-FIND-ff4a46]
  type: analytical
  direction: contradicts
  direction_note: >-
    Contradicts KN-FIND-9d2f56 as it currently reads. Does NOT contradict its
    theorem body, which ff4a46 leaves unchanged and which this record does not
    dispute. What is contradicted is the record's title and framing, by its own
    repair.
  strength: strong
  claim_tier: theory
  proof_status: derivation
  proof_status_basis: >-
    A documentary comparison of two committed records plus three exact field
    checks. No mathematics was executed.
  proof_refs:
    - knowledge/findings/KN-FIND-9d2f56.md
    - knowledge/findings/KN-FIND-ff4a46.md
  recorded_at: '2026-08-08'

  observations:
    - id: O-1
      text: >-
        RULE 2 SAVED THIS PROBE, FOR THE FOURTH TIME. KN-FIND-9d2f56 states the
        theorem as a disjunction -- beta_1 >= Omega(sqrt(N)) OR <r_2> = o(1) --
        and then adds "Equivalently: sub-rho critical complex (beta_1 < sqrt(N))
        requires yield above the random baseline". On a first reading those look
        contradictory: the disjunction gives sub-rho => yield o(1), the
        restatement gives sub-rho => yield above baseline. They are NOT
        contradictory. o(1) is the negligible level, so "not o(1)" IS "above the
        baseline" once the baseline is identified with the pseudorandom
        AT-heuristic yield, which is exactly the identification KN-FIND-ff4a46
        makes. Reading the repair before filing prevented a fourth false
        refutation from this program.
    - id: O-2
      text: >-
        THE REPAIR IS WELL MADE. KN-FIND-ff4a46 states the corrected orientation
        plainly -- "Holding = pseudorandom = AT-heuristic yield (the baseline);
        sub-rho critical complex requires FAILURE of this baseline" -- leaves the
        theorem body explicitly unchanged, supplies a repaired corollary that is
        "explicitly neutral: necessary condition only", and carries three
        non-claims including "no claim that sub-rho combinatorial ECDLP is
        achievable or impossible". It also carries a machine-readable
        `repair_target: KN-FIND-9d2f56` field.
    - id: O-3
      text: >-
        F-8's PRE-REGISTERED TEST IS THEREFORE MOOT, and is recorded as moot
        rather than skipped. F-8 was written to test an "exact condition" claim
        as an iff by constructing complexes on both sides of the threshold. That
        premise no longer holds: ff4a46 has already narrowed the claim to a
        NECESSARY condition and explicitly disclaims sufficiency. There is no iff
        left to falsify. Constructing the complexes would test a claim the corpus
        has already withdrawn.
    - id: O-4
      text: >-
        BUT THE WITHDRAWAL IS INVISIBLE FROM THE RECORD IT WITHDRAWS. Three exact
        checks on KN-FIND-9d2f56 as committed: (i) its `superseded_by` is null,
        although ff4a46 says in terms "This record supersedes KN-FIND-9d2f56's
        wording"; (ii) it contains zero references to ff4a46; (iii) its TITLE
        still reads "Betti-Yield duality -- H-PSEUDO is the exact condition for
        sub-rho combinatorial ECDLP". That title is the precise formulation
        ff4a46 exists to remove, and which ff4a46 warns "can be read as claiming
        H-PSEUDO is a *sufficient* condition".
    - id: O-5
      text: >-
        SO THE READER GETS THE WITHDRAWN CLAIM WITH A `proved` LABEL. A reader or
        retrieval query landing on KN-FIND-9d2f56 sees confidence: proved,
        evidence_level: theorem, and a title asserting an exact condition, with
        nothing indicating that its own repair has narrowed it to a necessary
        condition only. The corrected wording exists, is correct, and is
        unreachable from where the reader starts.
    - id: O-6
      text: >-
        THE ONE MACHINE-READABLE LINK IS A SINGLETON. `repair_target` is a good
        field and exactly ONE record of 58 uses it. No tool reads it -- it is
        absent from tools/validate_ledger.py's schema -- so it currently
        documents the relationship for humans who already found ff4a46, which is
        the population that does not need it.

  interpretation: >-
    The mathematics is fine and the repair is good. The defect is that the repair
    is one-directional in the strongest possible case: ff4a46 asserts supersession
    of 9d2f56's wording, and 9d2f56 records `superseded_by: null` and keeps the
    withdrawn formulation in its title under a `proved` label. This is the
    generic F-8a defect (EV-FALSIFY-2feed0) in its sharpest instance -- here the
    repair does not merely amend, it declares supersession, and the field that
    would carry that declaration is empty.

  what_this_does_not_establish: >-
    Nothing about whether the Betti-Yield theorem is true; its body was not
    checked and ff4a46 leaves it untouched. Nothing about whether sub-rho
    combinatorial ECDLP is achievable -- ff4a46 explicitly declines that question
    and so does this record. No claim that anyone has actually been misled by the
    title. And no claim that `superseded_by` is the RIGHT field here: ff4a46
    supersedes the wording while preserving the theorem, which is a partial
    supersession the schema may not model, and deciding what to record is the
    Coordinator's, not this record's.

  dominated_by: not_applicable_methodological
  sota_delta:
    time_exponent: not_applicable
    note: No algorithmic claim.

  proposed_correction: >-
    The minimum that makes the repair reachable: record the relationship on the
    9d2f56 side. If a partial supersession cannot be expressed by
    `superseded_by`, add the reciprocal of ff4a46's own `repair_target` -- a
    `repaired_by: KN-FIND-ff4a46` field -- and have tools/validate_ledger.py
    recognise both, so the singleton convention becomes a checked one. Failing
    any record change, the build-time back-link index proposed in
    EV-FALSIFY-2feed0 covers this case too and touches no immutable record.
    Coordinator authority.

  knowledge_promotion: not_warranted
  knowledge_promotion_reason: >-
    A linkage defect in one record pair. The general form is already recorded in
    EV-FALSIFY-2feed0 and promoting this instance separately would double-count
    it.

  scope_limits: >-
    KN-FIND-9d2f56 and KN-FIND-ff4a46 as committed at this branch head, and the
    three field checks named in O-4. The theorem body was not evaluated.

  independent_review_required: false
  independent_review_note: >-
    Asserts no mathematics and contradicts no mathematical claim; it compares two
    committed records and reports three field values, all re-checkable in
    seconds. The substantive orientation question was settled by
    DEC-20260806-08b9ed, not here.

  authority_note: >-
    Evidence only. No record edited, no field added, no finding superseded
    (AGENTS.md rule 1).
