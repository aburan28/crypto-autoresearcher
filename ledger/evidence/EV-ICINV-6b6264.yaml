    write scope. A defect in the driver that happens to emit correct values is
    not excluded by anything in this receipt (VAL-20260810-dc8bd8 limitations).
  - >-
    THE EXECUTED SAGE ARTIFACT IS ONE HOP FROM THE PINNED ONE. `sage foo.sage`
    executes a preparser-generated foo.sage.py; only the .sage file is pinned.
    The validator regenerated the .sage.py with `sage --preparse` and found it
    identical except the autogenerated source-path comment, so nothing here is
    unverifiable -- but a successor whose .sage uses preparser-sensitive syntax
    does not get that for free (check A6).
  - >-
    INFERENCE-POLICY DIVERGENCE, CARRIED IN THE RECORD RATHER THAN ABSORBED.
    AUTORESEARCH_POLICY was unset, so the executing session was not launched with
    the adapter-resolved environment; the adapter resolves executor-implementation
    to anthropic:claude-sonnet-5 (effort=medium) and claude-opus-5 answered, while
    the handoff set fallback_allowed false. Both manifests record
    inference.fallback_used true with the reason. The validator TESTED the "no
    model in the loop" defence rather than accepting it, by re-deriving every
