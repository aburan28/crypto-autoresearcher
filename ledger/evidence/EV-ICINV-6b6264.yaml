  unresolved_confounds:
  - >-
    NO NEARBY-OBJECT CONTROL EXISTS. C-CONTROL-SET is the contract's own null
    object and was never drawn, so there is no measured comparison between the
    class and 138 curves from other traces. The interpretive gap for the S_4
