  strength: inconclusive
  strength_justification: >-
    `inconclusive` describes this record's standing FOR H-ICINV-d5e351, which is
    what the field means, and it is set by the run's terminal state rather than
    by any measurement. The hypothesis asks whether the Semaev geometry of a
    curve is an isogeny-class invariant; deciding it requires four invariant
    families on the class AND on a matched nearby-object control, and this
    receipt carries one family on the class alone. No amount of internal quality
    in what was computed converts a one-family, control-free measurement into
    evidence about class invariance.

    WHAT IS NOT WEAK HERE, STATED SO THE FIELD IS NOT MISREAD. The facts listed
    under `observations` are exact symbolic computations over F_p and over QQ,
    each re-derived from the contract's own formulas by an independent validating
    session (VAL-20260810-dc8bd8) in two engines that share no code with the run
    driver, with zero disagreements on all 138 members. Those facts are as solid
    as this campaign's methods can make them AT THE TESTED SCOPE. They are simply
    not facts about isogeny-class invariance. The single strength field takes the
    hypothesis-level value; per-observation standing is stated inside each
    observation.

  claim_tier: toy
  claim_tier_justification: >-
    One prime p = 4001 (about 12 bits), one trace t = 30, one isogeny class of
    138 curves, arities m in {3, 4}, degrevlex, standard grading after
    homogenisation with respect to x0. NO ATTACK, NO EXPONENT, NO SPEEDUP.
    sota_delta ZERO on every axis. dominated_by parallel Pollard rho with
    distinguished points at 0.886 sqrt(N) group operations and O(1) memory
    (KN-TECH-001, KN-TECH-006) and, on CM curves, its automorphism-discounted
    variant (KN-TECH-018). NO TRANSFER IS CLAIMED to another prime, class,
    arity, grading or monomial order, and none to the deployed f_V-bearing
    formulation the campaign harness actually runs.

