    which this record does not touch.
  - >-
    THE RUN PACKAGE IS ADMISSIBLE THROUGH s1, NOT THROUGH s0 ALONE.
    VAL-20260810-dc8bd8 check R3 records that s0 taken by itself FAILS the
    contract's EXTREME-CURVE LISTING tail check: it reports {439: 137, 391: 1}
