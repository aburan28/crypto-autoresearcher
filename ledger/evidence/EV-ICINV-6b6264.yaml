    a76673596, and they are cited here as such -- not as an output of
    EXP-ICINV-e0cd8f and not under any frozen contract of their own.
  - >-
    THE RUN DRIVER ITSELF IS LESS WELL TESTED THAN THE NUMBERS IT REPORTS. The
    validator re-derived every reported value from the contract's formulas rather
