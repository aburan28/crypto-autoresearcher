    drawn. ideals_built 0, resolutions_computed 0. A not_computed cell is a
    statement about a gate, never about a curve.
  - >-
    NOT ESTABLISHED -- NO VERDICT. Neither CLASS-INVARIANT nor CLASS-VARYING was
    emitted and neither may be inferred from this record or from any artifact it
    cites. Three of four invariant families were not computed; what was computed
    covers the class only, with no control set. The validator grepped the entire
    run package and execution report and confirmed every occurrence of either
    string lies inside an options list or a negative declaration
    (VAL-20260810-dc8bd8 check T1).

  inference: >-
    EXP-ICINV-e0cd8f terminated at its own SR3 backend gate before building a
    single ideal, so this receipt establishes exactly two things about the tested
    object -- that the p = 4001, t = 30 class has 138 Hurwitz-certified members
    with 138 distinct j-invariants, and that S_3 monomial support is 13 on every
    one of them while S_4 monomial support is 439 on 137 of them and 391 on the
    single member with j = 2257 -- and it establishes that the 391 is a
    j-invariant degeneration of the fourth summation polynomial with no reference
    to the trace or to any isogeny. It establishes NOTHING about whether Semaev
    geometry is an isogeny-class invariant, in either direction, and it moves no
    hypothesis. The correct reading of the run's terminal state is that the
    campaign lacks an instrument, not that the mathematics answered.

  boundaries:
  - >-
    SCOPE, EXACTLY. p = 4001, t = 30, D = -15104 = -59 * 16^2, one isogeny class
    of 138 curves, arities m in {3, 4}, degrevlex, standard grading after
    homogenisation with respect to x0, f_V-FREE Jacobian ideal, SageMath 10.9 and
    sympy 1.14.0 on a 14-core arm64 host. Nothing outside that list is tested and
    nothing is claimed outside it.
  - >-
    NON-TRANSFERABLE TO SOLVING TIME BY THE CONTRACT'S OWN CENTRAL ARGUMENT.
    Removing the factor-base membership polynomials f_V is what makes the
    measured object a functional of the curve at all, and by exactly the same
    argument it is what makes any result here non-transferable to the deployed
    f_V-bearing formulation, in which the solving degree is pinned by |V| rather
    than by the curve. The campaign's committed -0.44% and -0.67% Groebner-time
    pair against an exact 23-31% drop in S_3 support is the standing
    demonstration. NOTHING HERE IS A PREDICTED GROEBNER SPEEDUP.
  - >-
    THE S_4 FAMILY IS A CONTRACT SECONDARY METRIC AND FACTORS THROUGH j. Its
    support is constant on the full weighted orbit, hence a function of the
    j-invariant alone, so it cannot separate a curve property from a model
    property and cannot carry isogeny-class information. Any later citation of
    the {439: 137, 391: 1} multiset MUST carry the adjudication recorded above;
    citing it as a within-class difference, as CLASS-VARYING evidence, or as an
    unexplained anomaly is a misuse of this record.
  - >-
    GOAL-ENDO-001 COMPLETION CRITERIA. NONE of C1-C4 is met by this receipt and
    none is claimed. C1 IS NOT MET BY AN INFRASTRUCTURE STOP: it requires an
    executed, independently reviewed run or an archived closure decision naming
    an obstruction with forward guidance, and a run that never reached an outcome
    state is neither. C2 (the RQ-ICINV-475b5e gating lane adjudicated) is NOT
    met. C3 and C4 are untouched.
  - >-
    HYPOTHESIS AND LANE STATE, UNCHANGED. H-ICINV-d5e351 stays `specified`.
    H-ICINV-6c7920 stays `specified` and is neither presumed true nor false --
    nothing here bears on it or on EV-ENDO-10109d in either direction.
