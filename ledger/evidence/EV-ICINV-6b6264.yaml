  observations:
  - >-
    ESTABLISHED (SR1, C-SUPPORT discharged, independently re-derived). The
    monomial support of S_3 = (x1 - x2)^2 x3^2 - 2((x1 + x2)(x1 x2 + a) + 2b) x3
    + ((x1 x2 - a)^2 - 4b(x1 + x2)) is 13 generically, 9 at a = 0 and 10 at
    b = 0. Computed in SageMath 10.9 and in sympy 1.14.0 by the run, and
    RE-DERIVED INDEPENDENTLY by VAL-20260810-dc8bd8 (check M1) in both engines
    plus a hand count. The reference values were READ FROM the committed
    red_team_notes.md at run time and bound by source_sha256
    414d850b5b91a5718fb4c178a2c2d36da16269346fe45f535d5d54d57eea1850, which the
    validator re-hashed from the snapshot commit; nothing was transcribed
    (CORR-20260807-a24675 discipline).
  - >-
    ESTABLISHED (SR2, C-CENSUS discharged, independently re-derived from
    scratch). The ordinary isogeny class at p = 4001, t = 30 has EXACTLY 138
    members. D = t^2 - 4p = -15104 = -59 * 16^2, fundamental discriminant
    D_0 = -59, conductor f = 16. Observed weighted mass sum 2/|Aut(E)| = 138
    equals the Hurwitz-Kronecker mass H(4p - t^2) = H(15104) = 138; the |Aut|
    multiset is {2: 138}; the 138 members carry 138 DISTINCT j-invariants; every
    member has order 3972; all 253 traces at p = 4001 agree with the mass formula
    with ZERO disagreements. VAL-20260810-dc8bd8 (check M3) re-enumerated the
    class with no harness code in the path, obtained SET EQUALITY of the 138
    j-invariants with class-census.json, and re-verified all 138 recorded rows
    individually (trace, j, cardinality, |Aut|) with 0 failures. It also closes
    the count in closed form: Kronecker(-59, 2) = -1 since -59 = 5 mod 8, so
    h(-59 f'^2) = 3, 9, 18, 36, 72 for f' = 1, 2, 4, 8, 16, summing to 138.
  - >-
    ESTABLISHED (measurement). S_3 MONOMIAL SUPPORT IS CONSTANT AT 13 ACROSS ALL
    138 CLASS MEMBERS -- multiset {13: 138}, one distinct value. Cross-checked on
    all 138 by sympy inside the run with zero disagreements, and re-derived on
    all 138 by VAL-20260810-dc8bd8 (check M2) with zero mismatches. THIS IS NOT A
    CLASS-INVARIANCE RESULT: it is the contract's own PRE-REGISTERED DERIVED
    prediction (specification.yaml preregistered_prediction), forced by T4 fixing
    D_0 = -59 so that j = 0 and j = 1728 are absent and a != 0 != b on every
    member. Observing it confirms the instrument and the enumeration; it was
    derived before execution and cannot be reported as a finding.
  - >-
    ESTABLISHED (measurement, contract SECONDARY metric). S_4 monomial support
    over the class is the multiset {439: 137, 391: 1} -- two distinct values.
    The single deviating member is TOY-P12-bc0b3378, (a, b) = (441, 294),
    j = 2257, support 391 against the class mode 439. It survives C-GAUGE
    (u = 1711, gauged model (2118, 2496), support 391 again) and the sympy
    cross-check, and VAL-20260810-dc8bd8 (check M4) re-derived S_4 symbolically
    over GF(4001)[a,b] and re-evaluated all 138 members with zero mismatches,
    plus an independent sympy recomputation on the outlier, its gauged model and
    12 further members.
  - >-
    ESTABLISHED AND DECISIVE FOR HOW THE PRECEDING OBSERVATION MUST BE READ --
    THE S_4 OUTLIER CARRIES NO ISOGENY-CLASS CONTENT, AND THIS RECORD FORBIDS
    CITING IT AS THOUGH IT DID. Established by VAL-20260810-dc8bd8
    (s4_outlier_adjudication), by algebra rather than by a control. (i) 48 of the
    439 S_4 coefficients carry the factor a^3 + 8b^2 OVER QQ[a,b], not merely
    over F_4001 -- so it is not an accident of characteristic 4001; over F_4001
    the same locus reads b^2 - 500 a^3 = 0 because 8 * 500 = 4000 = -1 mod 4001.
    (ii) That locus is a SINGLE j-INVARIANT: on a^3 = -8b^2 one gets
    4a^3 + 27b^2 = -5b^2 and j = 1728 * 4a^3/(4a^3 + 27b^2) = 1728 * 32/5, which
    is 2257 in F_4001; the validator verified j = 2257 on ALL 4000 non-singular
    points of the locus. (iii) EXACTLY ONE class member lies on it, and there is
    NO OFF-BY-ONE: no member satisfying the condition scored 439 and no member
    scored 391 without satisfying it, and the class has 138 distinct
    j-invariants so no second member can lie on a single-j locus. (iv) The full
    stratification of S_4 over QQ[a,b] yields six special j in F_4001 -- 135,
    1426, 2180, 2257, 2836, 3344 -- so an arbitrary 138 curves drawn from the
    3999 admissible j contain 138 * 6/3999 = 0.207 of them on average, stated as
    arithmetic and explicitly NOT as a p-value or any run statistic. (v)
    DECISIVELY, THE CONDITION NEVER MENTIONS THE TRACE OR ANY ISOGENY: it is a
    polynomial identity in (a, b), so even a far rarer coincidence would carry no
    class information. The C-CONTROL-SET null was never drawn, and the algebra
    supplies exactly what it would have shown -- a j-invariant coincidence, not a
    class effect.
  - >-
    ESTABLISHED (C-GAUGE discharged). Every invariant the run computed was
    recomputed on (u^4 a, u^6 b) for a per-curve u drawn from seed 20260810, and
    agreed on all 138 members. VAL-20260810-dc8bd8 re-verified all 138 entries
    itself: the gauged model equals (u^4 a, u^6 b) in GF(4001), the exact
    weighted identity S_3^{(u^4 a, u^6 b)}(u^2 x1, u^2 x2, u^2 x3) = u^8 *
    S_3^{(a,b)}(x1, x2, x3) holds in GF(4001)[x1, x2, x3], and support is
    preserved -- zero failures. RECORDED WITH ITS LIMIT, from the same report:
    S_3 is weighted-homogeneous of weight 8, so this identity cannot fail unless
    the code is wrong, and the same scaling shows support is constant on the full
    orbit {(l^2 a, l^3 b)} including both quadratic twists. C-GAUGE discharges
    "the implementation is right", NOT "the difference is real".
  - >-
    ESTABLISHED (run integrity, from VAL-20260810-dc8bd8 checks A1-A7, R1, R2,
    R7). Both runs carry all 15 contract-required artifacts plus two declared
    extras; all 7 executed source files are pinned by sha256 and re-hashed by the
    validator against the snapshot commit; check_run_source_provenance.py
    --strict passes on both. The two runs report IDENTICAL per-curve values on
    all 138 members and the identical SR3 outcome, so the second run is not
    rerunning until a favourable number appears -- s1 supersedes s0 only to widen
    the cross-check subsample from 20 to 21 curves so that it contains the
    deviating member, which s0's rule did not. 2 runs of a maximum 8; 45.26 s
    wall against 7200 s per run; 14.72 s CPU against 6 h; 91.8 MB peak RSS
    against 8 GB; stderr empty in both runs. NO BUDGET WAS EXHAUSTED, so no
    budget event is available to be mistaken for a result.
  - >-
    NOT ESTABLISHED -- GATE STATEMENTS UNDER AGENTS.md RULE 5, EVERY ONE OF THEM,
    AND NEVER CONSTANCY AND NEVER A NULL RESULT. Not computed, because SR3 fired
    before any ideal was built: the singular locus of S_m = 0 and its dimension
    and degree; the graded Betti table; Castelnuovo-Mumford regularity; the
    elimination-polynomial degree and F_p-factorisation type; the C-KOSZUL
