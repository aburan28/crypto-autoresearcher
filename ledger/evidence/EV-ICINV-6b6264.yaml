  - >-
    THE S_4 DEGENERATION STRATIFICATION IS VALIDATOR-DERIVED, NOT RUN-PRODUCED.
    The six special j-invariants, the factor multiplicities over QQ[a,b] and the
    4000-point locus check appear in VAL-20260810-dc8bd8 and in no run record.
