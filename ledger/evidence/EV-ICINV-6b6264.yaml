  forward_lead_non_evidence:
    status: >-
      NON-EVIDENCE. FIVE CURVES, NO CONTROL, NOT PRE-REGISTERED, NOT GAUGE- OR
      ORDER-CHECKED, PRODUCED BY A CAPABILITY PROBE AND NOT BY ANY RUN. It
      establishes nothing and may not be cited as a measurement, a trend or a
      lead about isogeny classes. It is recorded because it bears on how the
      successor contract is written and on whether the SR3 stop blocked work of
      value.
    observation: >-
      On five class members -- (441, 294), (17, 1345), (109, 2740), (134, 1423),
      (148, 2766) -- the elimination ideal I_3 intersect F_p[x_3] is generated by
      exactly the curve's own cubic x^3 + a x + b, with F_p-factorisation type
      [1, 1, 1] on the first four and [1, 2] on (148, 2766)
      (VAL-20260810-dc8bd8 validator_capability_probe).
    why_it_matters_if_it_generalises: >-
      One of the contract's four PRIMARY invariant families would then be the
      splitting type of the 2-division polynomial, i.e. a function of E(F_p)[2].
      That is NOT preserved by 2-isogenies and is already non-constant on these
      five members, so the CLASS-VARYING direction could be reached for a reason
      with no Semaev content -- mirroring exactly what the S_4 outlier turned out
      to be. A successor contract that does not anticipate this can buy a verdict
      without buying an answer.
    what_it_does_not_do: >-
      It does not establish that the shape is generic across the class, does not
      predict any invariant, and does not license reading the elimination family
      in either direction. It must be reproduced under a frozen contract with
      C-GAUGE, C-ORDER and the control set before it is anything at all.
    second_probe_finding: >-
      The same probe found that Sage 10.9's MPolynomialIdeal has no `.degree()`
      method, the sibling of the handoff's recorded `.betti()` gap, so a
      successor must obtain singular-locus degree by another route on the PRIMARY
      backend as well as on any cross-check backend.

