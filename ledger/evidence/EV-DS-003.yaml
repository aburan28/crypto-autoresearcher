  what_is_established:
    - >-
      E-1 PACKAGING BRANCH FALSIFIED. The first branch of the frozen
      packaging_falsification_rule ("unplanted R rises toward >=0.5, and/or
      usable yield collapses to resource_exhaustion with near-zero successes")
      is NOT what happened. Both real arms reached 200/200 usable relations with
      stop_reason relations_target_reached, empirical success probability 1.000,
      no resource exhaustion, and R = 0.0322 (bootstrap CI [0.0267, 0.0387]).
      Planted-yield packaging is falsified as the explanation of the previous
      package's yield. This is a genuine, durable result and this run must NOT
      be written up as a failed run.
    - >-
      E-2 TARGETS WERE GENUINELY UNPLANTED, VERIFIED INDEPENDENTLY. The
      Validator regenerated the 4000-point uniform target stream from seed 101
      with its own sampler (lift_x attempts 7872 matching, target_stream_sha256
      4a020749... matching) and confirmed the 200 certificate targets are, in
      order, exactly the first 200 stream points on both real arms.
      planted_m_sums_used is false and the driver contains no planted-target
      path. RT038-B7's yield-source defect is repaired as to target provenance.
    - >-
      E-3 RELATIONS ARE REAL. 1200/1200 relation certificates verified in-run
      across six arm-conditions with zero failures; the Validator independently
      re-derived 400/400 primary certificates using elliptic-curve arithmetic it
      wrote itself, checking on-curve-ness, arity m=4, factor-base membership
      (127 distinct summands over exactly 64 x-coordinates, sha256 matching the
      recorded fb_x_hash) and the point sum.
    - >-
      E-4 SYNTHETIC-PLANT THEATER REMOVED AND MISSING DATA HONESTLY RECORDED.
      synthetic_known_answer_used false, no synth_R / synth_Rn constants,
      planted_bug_detected assigned from measured data rather than hardcoded,
      and CTRL_NULL_RHO recorded as status "not_measured" with rho_calib_ratio
      null instead of the previously hardcoded 1.0. RT038-B3's control-theater
      complaint is repaired as to the synthetic plant; its rho-calibration and
      null-object limbs are NOT.
    - >-
      E-5 PACKAGE INTEGRITY. VAL-20260801-001 returned ADMISSIBLE after
      re-running the driver end to end from the recorded command and seed
      (deterministic content reproduced exactly; wall-derived costs to 1-3%),
      reproducing both bootstrap CIs exactly, and re-verifying 13/13 snapshot
      blob hashes against Git. Cell binding 20/64/4/101 shows zero drift across
      six artifacts; backend id matches the planted package exactly.
    - >-
      E-6 A MEASURED INTRA-EXPERIMENT ENUMERATION DIFFERENCE EXISTS. At this
      cell a depth-2 hash-join over factor-base pair-sums collected 200 verified
      4-term relations in 0.1431 s of wall while a depth-3 enumeration over the
      same factor base took 4.4503 s (R_wall = 0.0322); the run's own
      deterministic charged-unit ledger gives R_unit = 1914080/130630800 =
      0.01465, recomputed by the Coordinator from raw-result.json. Both proxies
      agree that the split arm enumerates substantially fewer candidates. That
      is a statement about enumeration depth, not about Semaev structure.

  what_is_not_established:
    - >-
      N-1 THE FAVOURABLE R / R_null FIGURES DO NOT EVIDENCE
      STRUCTURE-DEPENDENCE. R and R_null are WALL-CLOCK ratios: the frozen cost
      identity is cost = reported_wall * rho_gop_per_second / max(n_usable,1),
      n_usable = 200 on every arm and rho_gop_per_second cancels, so
      R = wall_split/wall_naive exactly. Charged units never enter R. The same
      raw-result.json yields R_null = 465080/486040 = 0.957 under charged units
      against 111.45 under wall — a 116x disagreement between two proxies in one
      file, recomputed independently by the Coordinator. summary.json's
      optimistic_assumptions_restated[0] ("Charged units use a frozen backend
      cost proxy ... optimistic for BOTH arms equally") describes a quantity
      that is not the reported one and is CORRECTED here (RT047-B1).
    - >-
      N-2 THE 111 IS AN AMORTIZATION ASYMMETRY. null_split_search rebuilds a
      4096-entry table INSIDE every per-target attempt (269 attempts) and none
      of that work is charged to backend units, while the real split arm builds
      its claw table ONCE (0.0113 s amortized over 200 relations). R_null
      compares an unamortized arm against an amortized one (RT047-B1, RT047-C3).
    - >-
      N-3 THE REAL ARM EXERCISES NO ELLIPTIC-CURVE OR SEMAEV STRUCTURE. With
      SMOOTHNESS_ABORT = False the is_B_smooth branch never executes; with
      D_HALF[4]=2 the encoding mask is 41 bits while x < p = 752627 < 2^20, so
      encode_intermediate is provably the identity; the candidate loop accepts
      only on exact group equality. What was measured is a generic hash-join
      meet-in-the-middle over pair-sums of a 128-point signed factor base,
      available on any group with any factor base (RT047-B2).
    - >-
      N-4 THE NULL OBJECT IS NOT MATCHED. NULL-DS-RANDOM-MULTIHOMOGENEOUS
      admits no composition law (null_full_hit is a blake2b random-oracle test
      with hit density 1/64), so no meet-in-the-middle is possible on it even in
      principle, and null_split_search's productive path is a 50x-diluted copy
      of null_naive_search. A control guaranteed to fail for a reason unrelated
      to the hypothesis is not a control (inventor-protocol section 3). The
      "matched null object" conjunct of H-DS-001's prediction is UNEVALUATED,
      not satisfied.
    - >-
      N-5 CTRL-RT025-PLANT-LIVE IS NOT DISCHARGED. The /4 divisor is applied to
      the split arms only, so R_on/R_off = 1/4 identically by algebra (measured
      echoes 0.2512 and 0.2499). Reading B is a threshold-free strict inequality
      that cannot fail under a split-only divisor > 1 and would fire identically
      on a genuine 4x algorithmic improvement: its false-positive rate is 1 and
      it was chosen after the numbers were in hand. Reading A — the only reading
      with contractual provenance (spec-v2 R < 0.5 AND R_null < 0.9) — returned
      FALSE with the plant both ON and OFF (discriminates: false); with the
      plant on, R_null = 27.20, still ~30x above the 0.9 gate. The frozen
      detection machinery failed the plant. Reading C (true/reported wall
      = 4.005, 4.000) is expressly non-contractual and audits the
      instrumentation, not the null gate (RT047-B3; Executor PD-1 / AN-2).
    - >-
      N-6 NO S1_met, NO SUPPORT, NO ASYMPTOTIC OR CRYPTO-SCALE CLAIM, NO
      HEUR-DS-1 VALIDATION. H-DS-001 requires R < 0.5 at B >= 64 on at least TWO
      bit sizes among {16,20,24}; this package supplies ONE bit size, one B, one
      m, one seed, unreplicated. The criterion is arithmetically unmeetable from
      this run independent of every objection above. assembled_E_proxy is null /
      "not_computed (out of control scope)". HEUR-DS-1 was not sampled and its
      F3 observation in EV-DS-002 stands unchanged.
    - >-
      N-7 THE MECHANISM WAS NEVER TESTED — IN EITHER DIRECTION. Every real arm
      in the EXP-DS-001 series to date has run with smoothness_abort = false, so
      no run has yet exercised the smoothness claw the hypothesis is about.
      Nothing here supports rejecting H-DS-001 any more than supporting it.

  central_finding: >-
    THE RUN LANDED OUTSIDE BOTH BRANCHES OF A RULE DRAFTED AS A DICHOTOMY: IT
    FALSIFIED PACKAGING WITHOUT ESTABLISHING STRUCTURE. The frozen
    packaging_falsification_rule offered exactly two outcomes — packaging
    (R rises toward 0.5 and/or yield collapses) or true structure-dependent
    rewrite (R < 0.5 with CI excluding 0.5 AND R_null >= 0.9 AND live plant
    detected). Branch 1 is definitively not what happened. Branch 2 is not
    established: its first conjunct is satisfied as measured but measures wall
    time on a structure-free generic meet-in-the-middle; its second holds only
    under the wall proxy against an unmatched null (0.957 under the run's own
    charged units); its third fails outright. The honest label is a THIRD
    OUTCOME — the mechanism remains untested because the instrument does not
    measure it.

  narrowest_supported_statement: >-
    At exactly one toy cell (p = 752627, prime-order subgroup n = 241, curve
    group order 753848, B = 64 / 128 signed points, m = 4, seed = 101, 200
    relations per arm, unplanted uniform-random targets, smoothness_abort =
    false, backend ds001-v2-point-sum-membership+charged-units-v1, one
    unreplicated run on one macOS arm64 host), a depth-2 hash-join
    meet-in-the-middle over factor-base pair-sums collected 200 independently
    verified 4-term relations in 0.1431 s of measured wall while a depth-3
    enumeration over the same factor base took 4.4503 s, giving R_wall = 0.0322
    (bootstrap CI [0.0267, 0.0387]) and R_unit = 0.0147; all 1200 relation
    certificates re-verified; both real arms decomposed 200/200 unplanted random
    targets, consistent with the ~16 expected representations per target these
    parameters imply. The measurement is silent on Semaev/multihomogeneous
    structure.

  observations:
    - >-
      O-1: VAL-20260801-001 ADMISSIBLE. 14/14 declared snapshot paths, 13/13
      source hashes matched, parent 64c069ab confirmed, full from-scratch
      re-execution reproducing all deterministic content and both CIs exactly.
    - >-
      O-2: R = 0.03216272974914815, CI [0.026748552, 0.038719771];
      R_null = 111.44703608667204, CI [97.837, 128.239]; both recomputed exactly
      by the Validator from the archived per-arm walls and yields.
    - >-
      O-3: PROXY SENSITIVITY DISCLOSURE (RT047-B1 discharging requirement).
      Under the run's own deterministic charged-unit ledger, R_unit = 0.01465
      and R_null_unit = 0.95688. Under the frozen R_null >= 0.9 gate the unit
      proxy passes by 6%, not by 12000%; the gate is NOT robust to proxy choice.
    - >-
      O-4: r1_observation_label S1_eligible_on_null_axis is an OBSERVATION LABEL
      only. R-1 (F2-over-S1) did not fire under the wall proxy; official S1_met
      remains false and F2 remains unfired, as it has across all 54 prior cells.
    - >-
      O-5: END-TO-END DOMINANCE. Relation collection alone on the split arm, at
      the 64 relations index calculus needs before linear algebra can start,
      costs 64 x 1033.91 = 66,170 rho-equivalent group operations against the
      MEASURED CTRL_RHO receipt of 744 group operations (certificate_verified
      true) to solve this instance outright: 88.9x worse. The naive arm is
      2765x rho. Memory: 8256 claw-table entries against modeled BSGS's 16
      stored elements. Recomputed by the Coordinator from R_cell.json and
      raw-result.json.
    - >-
      O-6: AN-5 TEST-BOUNDARY DEVIATION, disclosed by the Executor. The instance
      has p = 752627 (20-bit FIELD), full group order 753848 and prime-order
      subgroup n = 241 (~7.9 bits). H-DS-001's test_boundary names "16-, 20- and
      24-bit PRIME-ORDER SUBGROUPS". The membership search runs over the full
      group while the rho/BSGS baselines are computed over n = 241. Any prose
      saying "at 20 bits" must say which 20 bits.
    - >-
      O-7: CTRL-RT025-PLANT-LIVE NOT DISCHARGED (N-5 / RT047-B3). The control
      file's self-asserted discharges list [RT038-B7, CTRL-RT025-UNPLANTED,
      CTRL-RT025-PLANT-LIVE] must NOT be carried forward unamended: RT038-B7 is
      PARTIALLY discharged, CTRL-RT025-UNPLANTED is discharged as to the
      unplanted-target facet only, CTRL-RT025-PLANT-LIVE is NOT discharged.
    - >-
      O-8: RT038-B1..B7 + M1 all remain binding. RT038-B3 and RT038-B4 are
      undischarged and now STRONGER (the null-object and cost-identity defects
      are confirmed unrepaired code and contract). RT038-B2, B5, B6 unchanged.
    - >-
      O-9: PD-2 BLOB DRIFT ADJUDICATED. The live CTRL-RT025-UNPLANTED.yaml and
      v2_ctrl_unplanted.yaml differ from the blobs reviewed at cac4d8b4 by
      exactly five lines, all DEC-id remaps from the origin/main collision
      recorded in CORR-20260801-001; the Validator confirmed by direct git diff
      that cell, target_mode, backend clause, smoothness_abort, relations_target,
