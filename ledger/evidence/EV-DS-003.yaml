      (control 42022e88..., amendment 93b9e86f...) and records that the
      review-to-execution hash chain was broken by an id remap and not by an
      edit to science-bearing content.
    - >-
      O-10: H-IC-001 and H-STR-002 untouched by this run, this review cycle and
      this record.

  open_items_carried_forward:
    - >-
      D-1 (VAL, minor): manifest.result.certificate.verifier attributes 1200
      relations to a compound verifier, but verify_certificates.py checks ONE
      exemplar and omits factor-base-membership and arity checks. The 1200
      figure rests on the in-driver verifier; the underlying fact is true, the
      attribution is loose. Repair by wording in any successor manifest.
    - >-
      D-2 (VAL, minor): only the 400 primary-arm certificates are archived
      per-certificate; the 800 companion-arm certificates exist as counts only
      and cannot be re-verified from artifacts alone without re-running.
    - >-
      D-3 (VAL, minor, MATTERS FOR ANY REPLICATION): PER_TARGET_CAP_SECONDS =
      5.0 is a hard-coded per-attempt truncation (ds001_ctrl_unplanted.py lines
      67, 207, 278) that appears in no contract and no artifact field. It
      demonstrably never bound here (largest per-relation wall 0.1196 s, 42x
      under the cap), but at larger parameters it truncates the slower (naive)
      arm FIRST and would bias R downward. It MUST be declared in the contract
      before this driver is reused at any larger parameter.
    - >-
      D-4 (VAL, cosmetic): manifest.artifacts uses absolute host paths;
      manifest.inference omits degraded_requirements (inert, degraded_allowed
      false); the TASK-045 snapshot receipt carries commit_sha null.
    - >-
      RT047-B1: R/R_null are wall ratios, not cost-model quantities; 116x
      proxy disagreement on R_null. Discharged as to disclosure by O-3; the
      underlying cost-identity defect is UNREPAIRED.
    - >-
      RT047-B2: unmatched null object plus a structure-free real arm; R_null
      discriminates nothing. UNREPAIRED. RT047-CTRL-1 is the named test.
    - >-
      RT047-B3: CTRL-RT025-PLANT-LIVE undischarged; the detector has never been
      run against a no-plant condition, so its specificity is asserted, not
      measured. A numeric, pre-registered, specific predicate must be fixed in a
      superseding control before any plant rerun (RT047-CTRL-3).
    - >-
      RT047-B4: end-to-end domination by matched rho and BSGS; no Pareto or
      attack-cost claim is available and dominated_by may not be null.
    - >-
      RT047-B5: one cell, one seed, unreplicated, and a 7.9-bit prime-order
      subgroup against a test boundary asking for 20.
    - >-
      RT047-M1 (advisory): the bootstrap resamples per-relation walls but holds
      each arm's fixed overhead constant (8% of the real split arm, 36% of the
      null split arm), so the CIs are anticonservative by an unquantified
      amount. Immaterial at R = 0.032; material at a future near-threshold cell.
    - >-
      RT047-H4: the implicit, unnumbered heuristic "wall-clock ratio on this
      host is a faithful proxy for algebraic cost" is load-bearing for every
      number in the package and appears nowhere as a numbered heuristic with a
      falsification condition.
    - >-
      RT047-C2/C4/C5/C6: charge_backend_units is a constant 40 per call and
      charges neither the split arm's table-build additions nor the naive arm's
      per-candidate E.add; the eliminated enumeration level is a memory purchase
      never charged against rho or BSGS; total expected cost = per-attempt cost
      x inverse success probability is untested because success probability was
      structurally 1.0; rho_gop_per_second derives from a sub-millisecond
      capture and must caveat every absolute gops figure.

  dominated_by: >-
    Matched Pollard rho, MEASURED on this exact instance (CTRL_RHO: 744 group
    operations total, 0.000515 s, certificate_verified true, O(1) memory with
    distinguished points), and matched BSGS (modeled 2*ceil(sqrt(241)) = 32
    group operations / 16 stored elements; even the generous full-group figure
    is 1738 ops / 869 stored). The split arm's RELATION-COLLECTION STAGE ALONE
    costs ~66,170 rho-equivalent group operations and holds 8256 claw-table
    entries, so it is dominated on TIME and on MEMORY by both baselines. It is
    additionally dominated by the generic meet-in-the-middle baseline in the
    sense that matters most: on the evidence of RT047-B2 the split arm IS that
    baseline, so it holds no advantage over it by construction.
  dominated_by_check_performed: >-
    Every frontier row checked across time, memory and data/queries against both
    baseline receipts present in raw-result.json plus the generic-MITM
    alternative, by RT-20260731-047 and re-derived by the Coordinator from
    R_cell.json (64 x 1033.909835504201 = 66,170.2 vs 744 = 88.94x). `null` is
    inadmissible here and would be a fabrication under AGENTS.md rule 5 /
    inventor-protocol section 5.
  sota_delta: >-
    -8,800% on time versus matched measured rho for relation collection alone
    (66,170 vs 744 group operations, 88.9x worse); -51,500% on memory versus
    modeled BSGS (8,256 vs 16 stored elements). The only positive delta in the
    package is INTRA-EXPERIMENTAL and is not a state of the art: the split arm
    is 31x cheaper in wall (68x in charged units) than the naive arm of the same
    harness at this one cell.

  inference: >-
    The control package is an admissible toy-tier receipt that repairs the
    planted-target and synthetic-plant defects and falsifies the packaging
    branch of the frozen rule, while establishing that the three quantities
    carrying the structure-dependent reading (R, R_null, planted_bug_detected)
    are artifacts of the measurement apparatus. It does not establish S1_met,
    does not support or weaken H-DS-001's mechanism, does not validate or refute
    HEUR-DS-1, does not discharge CTRL-RT025-PLANT-LIVE, and moves no asymptotic
    claim. Official disposition is inconclusive on mechanism with partial repair
    confirmed (DEC-20260801-003, issued in the queue as DEC-20260731-020).

  boundaries:
    - >-
      Toy tier only, one cell: p = 752627 (20-bit field), prime-order subgroup
      n = 241 (7.9 bits), B = 64, m = 4, seed = 101, one unreplicated run, one
      host. Not medium, not crypto, not a scaling study.
    - Backend is ds001-v2-point-sum-membership+charged-units-v1 (exact point-sum
      membership with a constant charge), NOT a Groebner or resultant solve; the
      naive-vs-split comparison under a real algebraic membership backend is
      unmeasured.
    - R and R_null are wall-clock ratios; the charged-unit ledger disagrees by
      2.20x on R and 116.5x on R_null. Neither proxy is a defensible operation
      count.
    - >-
      Single unreplicated empirical_only set: reject_scoped is forbidden
      (docs/claims-and-verification.md, refutation artifacts).
    - No crypto-scale claim, no asymptotic claim, no affected-scheme scope; all
      four asymptotic promotion gates remain OPEN.
    - Does not describe or re-score the planted relations=200 package
      (EV-DS-002) or the relations=15 package (EV-DS-001), and does not alter
      H-IC-001 or H-STR-002.

  unresolved_confounds:
    - >-
      UC-1: The measured advantage is not separated from generic
      meet-in-the-middle. No measurement in the EXP-DS-001 series has ever run
      the identical algorithm against a structure-destroyed object of the same
      shape (RT047-CTRL-1).
    - >-
      UC-2: The artifact tell is unmeasured. Nobody has asked what R should do
      as B — the parameter that would distinguish 1/(2B) generic-MITM scaling
      from smoothness-tracking behaviour — increases (RT047-CTRL-2).
    - >-
      UC-3: The live-plant detector has no measured specificity: it has never
      been run under a divisor-1.0 negative control or an opposite-sign plant
      (RT047-CTRL-3).
    - >-
      UC-4: The index-calculus regime was never entered. With ~16 expected
