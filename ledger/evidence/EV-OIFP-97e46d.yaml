  observations:
    - id: O-1
      text: >-
        RUN-OIFP-001 executed EXP-OIFP-0ca0c9 at bits=20 (20 reps) and bits=40
        (resource_exhaustion). Snapshot 9edde63a3. Pre-exec PASS (RT-20260804-038).
        Validity: partial_valid_resource_exhaustion.
    - id: O-2
      text: >-
        Bits=20 selection bias: 14/20 reps produced class_size=2 (degenerate;
        trivial 1-step collision regardless of algorithm). 18/20 reps had class_size ≤ 8.
        The mean collision steps of 2.4 (vs p^{1/4}=32) reflects this bias, NOT
        algorithm efficiency. Success criterion technically met but vacuous.
    - id: O-3
      text: >-
        Two large-class reps (class_size=309 and 384): collision at 13 and 17 steps
        respectively, consistent with O(sqrt(class_size)) ≈ 18. This is the only
        data consistent with the H-OIFP-097d1a mechanism. Two reps are insufficient
        for a statistical conclusion.
    - id: O-4
      text: >-
        CTRL-PLANTED (bits=20): 3/3 passed (1-step collision for direct neighbor). ✓
        CTRL-RANDOM-WALK: mean 3.9 steps (comparable to isogeny MITM at this
        scale — no structural advantage of isogeny graph over random regular graph
        detectable at toy scale with small classes).
    - id: O-5
      text: >-
        Critical insight from Red Team (OBJ note): BFS MITM requires O(h(D)) = O(sqrt(p))
        class enumeration before any MITM step. Total end-to-end BFS MITM cost is
        O(sqrt(p)), the SAME as L[1/2] class group DLP. The O(p^{1/4}) advantage
        applies only to the COLLISION STEP, not to the full algorithm. The correct
        implementation for sub-sqrt(p) total cost is a Pollard-rho distinguished-point
        random-walk MITM that avoids full class enumeration.
    - id: O-6
      text: >-
        Bits=40: resource_exhaustion at all 20 reps. NOT negative evidence (AGENTS
        rule 5). The partial enumeration at rep-0 (4730 nodes in 30s) confirms large
        classes exist at bits=40 but full BFS MITM requires >>300s per rep.

  dominated_by: L[1/2] class group index calculus for OIFP; Pollard rho for ECDLP
