  observations:
  - THE SENSITIVITY DEMONSTRATION IS NOW REAL AND IT FAILED ITS OWN THIRD GATE. G1 (high end) clears by
    11.9-19.3x (z = +47.80 / +66.24 / +52.56 / +77.24) and G2 (low end) does not fire anywhere (+2.19
    / +2.03 / -1.36 / +1.02), giving a dynamic range of 46.6-75.9 SE that the superseded demonstration
    could not exhibit. G3 (monotonicity) fails in all four cells, so the pre-registered verdict is INVALID
    and the real arm is measured but NOT interpreted.
  - THE FREEZE WAS GENUINELY ENFORCED, AND THE VALIDATOR STRENGTHENED THE FINDING. It recomputed the pre-registration
    sha256 three independent ways -- report block, the PREREG_MD constant rebuilt by executing the script,
    and results.json -- all giving 2893a6b0..., 7339 bytes, byte-identical. It then traced all ten template
    substitutions to sigma_over_mu(beta,d) alone and reproduced them, establishing that THE FROZEN TEXT
    CONTAINS NO QUANTITY TUNABLE TO DATA without editing the script and moving the hash. Enforcement fails
    closed three ways before any lattice is touched.
  - THE INVALID VERDICT IS CORRECT AND NOT SELF-PUNISHMENT. The validator checked the PARTIAL clause under
    all three defensible readings -- prose, as-coded (which is MORE lenient to the executor), and the
    most lenient it could construct -- and PARTIAL is excluded in all four cells under all three. Every
    cell has at least two consecutive violating steps.
  - 'THE HEADLINE ABSENCE CLAIM IS WRONG, AND THE RED TEAM COMPUTED THE CORRECTION EXACTLY. B2-A reported
    the departure "absent below gate" in the LLL-only and BKZ arms. The statistic T2 estimates is a deterministic
    scalar of the tail frame, V = sum_a (P_aa - beta/d)^2, computable with ZERO error draws. Computed
    exactly on 16 bases: LLL excess +0.1863 (+10.2 sd, 16 of 16 bases) at d=100 and +0.4386 (+16.6 sd,
    16 of 16) at d=140; BKZ-30 +0.1400 (+9.9 sd, 16 of 16) at d=140. REDUCTION SUPPRESSES THE DEPARTURE
    BY 15-50x; IT DOES NOT ZERO IT. The instrument''s detection floor is V ~ 2.2, five to fifteen times
    above the surviving residual.'
  - BOTH READINGS THE COORDINATOR PUT TO THE RED TEAM ARE WRONG. It is a basis-PRESENTATION property AND
    the instrument is blind to what survives reduction. Resolving the residual statistically would need
    roughly 1000 frames per arm against the 8 that were run.
  - THE CLAIMED MECHANISM IS GEOMETRICALLY FALSE. B2-A attributed the non-decay to the tail window sitting
    inside the q*I block. The tail window's energy in that block is 0.00000; it lies in the complementary
    I_k block at fraction 1.00000, with T = beta^2/k (18.357 against 18.000 at d=100, beta=30) -- a generic
    subspace CONFINED TO a coordinate block, not coordinate-aligned. The stated boundary beta <= d-k is
    right only by the coincidence k = d/2.
  - '"THE FALSIFIER FIRED, THEREFORE ARTIFACT" DOES NOT FOLLOW. A zero-free-parameter geometry model gives
    D(60)/D(30) = 1.544 at d=140 against a measured 2.095 and a pre-registered 0.603, and it predicts
    the d=100 beta=60 reversal. The growth was predictable before the run, so the pre-registered 1/sqrt(beta)
    law was the wrong null to have frozen.'
  - 'The Gaussian-error null of the null PASSES in all four cells: the coordinate-aligned projector that
    moves the statistic 48-77 SE under CBD moves it by nothing under a spherical error.'
  - THE BKZ CACHE THE BATCH CARD PROMISED DID NOT EXIST. The prior batch's cache directory was an ephemeral
    session scratchpad, now gone. All 32 reductions were recomputed from the same seeds and verified against
    the prior batch's own results.json at MAX DEVIATION 0.0 in both fields. The Coordinator's card asserted
    a cache that was not there; the seeds were the cache.
  inference: 'B2-A repaired the instrument''s sensitivity demonstration -- it now spans a genuine dynamic
    range and can fail, which is what the batch was for -- and then failed its own third gate on a grid
    the governing decision had frozen too coarsely. Independently of that, the batch''s substantive claims
    about WHERE the alignment departure lives did not survive review: the departure is a property of how
    the basis is presented, it SURVIVES reduction at 15-50x suppression rather than vanishing, the instrument
    cannot resolve what survives, and the mechanism offered for its non-decay is false. What is established
    is about the apparatus and the geometry, not about ML-KEM.'
  boundaries:
  - NOTHING here bears on ML-KEM security, on any FIPS 203 parameter set, or on any cost model. Claim
    tier TOY.
  - No hypothesis status moves. The real arm was measured and explicitly NOT interpreted.
  - The exact-V computation that corrects the absence claim is the RED TEAM'S, computed on 16 bases with
    zero error draws. It is a derivation about the frame, not a new sampled measurement.
  - The residual after reduction is established as NONZERO and as BELOW THIS INSTRUMENT'S FLOOR. Neither
    "the departure vanishes under reduction" nor "the departure is present in reduced bases at a detectable
    level" is supported.
  unresolved_confounds:
  - THE INSTRUMENT CANNOT SEE THE SURVIVING RESIDUAL. Detection floor V ~ 2.2 against residuals of 0.14-0.44;
    roughly 1000 frames per arm would be needed against the 8 run. Every "absent" verdict in this lane
    is an upper bound, and must be written as one.
  - The block-boundary mechanism is refuted as stated but the true geometry is characterised on two series
    with one crossing point. The discriminating test -- any k != d/2 -- was named by the executor as unevaluated
    and remains so.
  - 'coord_t0 at d=140 lands at 0.7544 against a band edge of 0.7537: NEITHER by 0.1 percent. The call
    stands under rounded and unrounded bands, but it is a knife-edge where a less careful producer would
    have rounded into CONSISTENT.'
  - 'HARNESS GAP, THE COORDINATOR''S: the pre-registration freeze is SELF-REPORTED. The snapshot preceded
    the reviews, correctly, but it came after the run, so nothing externally notarizes that the pre-registration
    existed before the measurement. Only splitting the producer task -- freeze, snapshot, then measure
