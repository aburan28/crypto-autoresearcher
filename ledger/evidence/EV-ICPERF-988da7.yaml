  type: empirical
  direction: weakens
  direction_basis: >-
    Weakens the proposition that a bounded-degree membership ideal for a
    Frobenius-stable weight-bounded factor base gives point decomposition an
    algebraic oracle cheaper than enumeration -- i.e. weakens RQ-FROB-7d8dd4's
    decision target (b) for the WEIGHT-BOUNDED ORBIT-UNION family with the
    paper's three Hamming-ideal presentations at m = 2, w = 2, and for that
    family only; the sibling closure for the shift-parameterised family is
    EV-FROB-b6e1e9. Every encoding, at every size,
    resolved only after nearly all coordinates of one summand were fixed, and
    the registered success conditions (2) and (3) were met by none. The
    record also CORRECTS one claim in the other repository's decomposition
    note (see observations): that correction is accounting, not evidence for
    or against any attack, and it moves no operation count.
  strength: preliminary
  strength_basis: >-
    Preliminary, and the ceiling is deliberate. In favour: the protocol was
    pre-registered with its falsification target before any cell ran; every
    target of every cell agrees with an exhaustive oracle that labelled it
    first; every "yes" carries a verified decomposition; there are zero
    timeouts, zero encoding violations, and a budget sweep and two controls
    (subspace baseline, monomial ideal) were run through the same solver.
    Against: n <= 19 only, w = 2 only, m = 2 only, 8 targets per cell at
    n >= 17, one solver (the producing session's own truncated F4), a
    four-point exponent fit, and NO reviewer in this program has read any of
    it. `replicated` would require a second engine or a second
    implementation reproducing the tame-depth behaviour, and none exists.
  claim_tier: toy
  claim_tier_basis: >-
    Toy, unambiguously: field degrees 7-19 against a challenge at 131, and
    the other repository's own high-fidelity gate at n = 83 was not run
    (its AGENTS.md section 8a requires it for any IMPROVEMENT claim; none is
    made, so none was owed).
  certificate_refs: []
  certificate_refs_note: >-
    No solve is claimed, so no claim-tier certificate is owed. What IS checked
    on every target: the oracle answer equals the exhaustive label, and each
    reported decomposition R = P_1 + P_2 is re-verified on the curve with both
    summands re-checked for membership in F_w. That is a relation check
    inside the run, not a certificate this ledger's wrapper can re-run.
  proof_status: empirical_only
  proof_refs: []
  proof_status_note: >-
    Empirical only for everything measured. The one structural statement --
    that F_w = {P : wt_NB(x(P)) <= w} is Frobenius-stable at every n with a
    popcount membership test -- is a two-line argument (Frobenius is a cyclic
    shift of normal-basis coordinates; cyclic shifts preserve weight) and is
    stated in the other repository's note section 0 and decomposition note
    section 6.3, but no derivation note exists as a separate artifact, so it
    is not claimed as `derivation` here.
  observations:
    - >-
      CORRECTNESS, FIRST. Every target of every cell -- n in {7, 11, 13, 17,
      19} times {SUB, MONO, C, FC, QFC}, 24 targets per cell at n <= 13 and 8
      at n >= 17, 480 oracle answers in all -- agrees with the exhaustive
      oracle; every "yes" carries a decomposition re-verified on the curve;
      zero timeouts against the 2^13-call cap; zero encoding violations. The
      negative result below is therefore a statement about cost, not about a
      broken oracle.
    - >-
      THE ALGEBRA RESOLVES ONLY AT THE BOTTOM OF THE TREE. Mean tame depth
      (summand coordinates fixed before GroebnerSafe returned a linear basis)
      for the paper's three presentations: 7.4-10.4 of 13 at n = 13; 14.7,
      16.2 and 15.4 of 17 for FC, C and QFC at n = 17; 17.8, 18.2 and 18.2 of
      19 at n = 19. The registered condition was "at most n - 3 at n >= 13";
      at n = 19 the best encoding sits at n - 1.2. The subspace baseline, run
      through the SAME solver, is tame at the root or one level below it at
      every size (depth 0.00 at n = 17 and 19).
    - >-
      CALLS PER TARGET GROW FASTER THAN THE CANDIDATE COUNT. Mean GroebnerSafe
      calls per target at n = 17: C 93.5, FC 56.9, QFC 68.8, MONO 22.3, SUB
      1.00, against |F_w| = 137; at n = 19: C 135, FC 113, QFC 135, MONO
      33.8, SUB 1.00, against |F_w| = 229. The ratio calls/|F_w| RISES with
      n: 0.10-0.12 at n = 11, 0.42-0.68 at n = 17, 0.49-0.59 at n = 19.
      Least-squares exponents of log2 calls per target in log2 |F_w| over
      n = 11, 13, 17, 19: C 2.43, FC 1.87, QFC 2.48, MONO 1.51, SUB -0.87.
      The registered threshold for H1 was 0.8 for at least one of C, FC,
      QFC. None is within a factor of two of it.
    - >-
      THE CONTROL RESOLVES HIGHER, AND THAT IS NOT GOOD NEWS FOR THE PAPER'S
      PRESENTATIONS. The naive monomial ideal (all C(n, w+1) degree-(w+1)
      monomials, 1,957 generators at n = 19) resolves 6-8 levels higher in
      the tree than C/FC/QFC (depth 8.8 of 17, 11.8 of 19). So the lifted
      presentations buy bounded degree at the price of the linear-algebra
      information the truncated basis reaches within a budget. MONO is not a
      candidate either: its exponent is 1.51 and its generator count is the
      thing the paper's constructions exist to avoid.
    - >-
      THE ENGINE IS BOUNDED, NOT EXCUSED. Budget sweep on the same four
      n = 11 targets at 2^26, 2^28 and 2^30 XORs per call: mean tame depth
      FC 5.36 / 5.10 / 4.38, QFC 4.12 / 3.71 / 2.50, MONO 3.71 / 2.00 / 2.00.
      Sixteen times the budget removes one to two levels of an 11-level tree
      and does not collapse it. Every target correct at every budget. A
      better F4 would move the depth, not the exponent -- stated as the
      producing note's reading, not as a measurement at larger n.
    - >-
      WHAT THE CONSTRUCTION DOES ESTABLISH (accounting correction to the
      other repository's decomposition note, its new section 6.3). Section 6
      of that note said a Frobenius-stable orbit union "has no low-degree
      membership polynomial", so the last summand must be looked up in a
      MATERIALISED base of 2^l stored points, and its section-6 table charged
      that storage against every orbit-collapsed row. In a normal basis the
      set F_w = {P : wt_NB(x(P)) <= w} is a Frobenius-stable orbit union at
      every n with a popcount membership test and, by the paper, a
      bounded-degree membership ideal. So the 2^l storage is a cost of that
      note's enumeration oracle, not of the collapse, and a weight base
      removes it with NO change to the operation count: the family's bottom,
      2^124.99 at m = 2, is unchanged. Class by that repository's own rule:
      accounting. NOTHING IN THIS LEDGER CITED THE STORAGE TERM -- EV-ICPERF-
      10c5fc quotes the 2^124.99 operation count, which stands -- so no CORR-
      is filed here.
    - >-
      COST PER CALL, AS A PRACTICALITY NOTE ONLY. The paper's encodings spend
      0.5-2 x 10^8 row-word XORs per call, almost all of it in wild calls
      that end at the budget; per target the wall time is 10^5-10^6 times the
      exhaustive scan at the same n (the scan finished in 40-250 microseconds
      per target at n = 13-19). Uncalibrated against curve operations, and
      therefore not a boundary-table quantity.
  inference: >-
    The paper's Classic McEliece conclusion -- the Prange point wins, and
    every coordinate left to the algebra costs Groebner calls the
    combinatorial saving does not repay -- transfers intact to point
    decomposition on K_0 at every size run. The Hamming-ideal oracle is
    correct and useless at these sizes: it is the exhaustive oracle with a
    Groebner computation bolted onto each candidate, with a calls-per-target
    exponent of 1.9-2.5 in |F_w| where the exhaustive oracle is exponent 1.
    The durable part is structural and modest: a Frobenius-stable factor base
    at prime n with no storage and an algebraic membership ideal exists, so a
    sentence in the decomposition note was wrong about storage and right
    about everything else. No operation count moves, no verdict moves, and
    no cost row of this program is affected.
  boundaries:
    - >-
      Field degrees n = 7, 11, 13, 17, 19; the exponent fits use the four
      primes 11-19 (four points). Nothing at n = 83 or 131, and the
      cyclotomic structure that distinguishes those degrees (irreducible
      nontrivial block at 53, 83, 131; split block at 31) was not exercised
      because no size above 19 was run.
    - >-
      Weight w = 2 at every n (the protocol registered w = 3 at 17 and 19 and
      RESULT.md records the deviation, made before those cells ran, for
      runtime). At w = 2 the digit constraint is y_1 y_2 = 0; larger w changes
      the root constraint and the tree shape and was not measured.
    - >-
      Summand count m = 2 (one S_3 link, quadratic in normal-basis
      coordinates). Neither m >= 3 nor the paper's GBDecode outer loop was
      run; RESULT.md lists both as not run.
    - >-
      Solver: the producing session's own degree-truncated Boolean F4 (pair
      degree 6, Gebauer-Moeller, field pairs, eager linear propagation,
      2^28 XOR budget, 2^26-word matrix cap), self-tested against brute force
      on 1,200 random systems in CI. Not Magma, M4GB or msolve. The budget
      sweep bounds the engine dependence at n = 11 only.
    - >-
      Targets: 24 per cell at n <= 13, 8 per cell at n >= 17 (seeds 0..7).
      Means over 8 targets carry real variance; the trend across n is
      monotone and steep, but no per-cell error bar is claimed.
    - >-
      Unit: GroebnerSafe calls per target and elimination row-word XORs.
      Neither is calibrated against curve operations, so nothing here enters
      a boundary table in this program's hardware-independent unit.
  unresolved_confounds:
    - >-
      A stronger Groebner engine could resolve higher in the tree. The sweep
      says 16x budget buys one to two levels at n = 11; whether a
      state-of-the-art engine buys a factor rather than a few levels at
      n = 19 is not measured. The exponent gap (1.87 versus 0.8) would need
      a factor.
    - >-
      Degree truncation at pair degree 6 covers the FC presentation's
      degree bound L + 1 = 5 at n = 19 but a higher truncation was not swept.
    - >-
      No independent reviewer in THIS program has read the crate, the
      protocol or the frozen results. Automated review in the other
      repository posted a low-risk summary and no defect finding is recorded
      from it; the two material defects disclosed in RESULT.md were found by
      the producing session itself.
    - >-
      The producing session both designed and ran the experiment
      (independent_session: false in this ledger's terms). Pre-registration
      limits what that can do to the verdict -- the threshold was fixed
      before any cell ran -- but it is not independence.
  obstruction:
    statement: >-
      For the Hamming-ideal membership encoding of a Frobenius-stable
      weight-bounded factor base on K_0 over GF(2^n), the ISD-like
      MultiSolve/OracleT search with a degree-truncated Boolean F4 returns a
      linear basis only after nearly all coordinates of one summand are
      assigned, so its cost per target grows faster than the exhaustive
      oracle's |F_w| and the algebraic oracle never beats the Prange point at
      any size run.
    quantity: >-
      (a) mean tame depth in summand coordinates, of n; (b) mean GroebnerSafe
      calls per target, and its least-squares exponent in |F_w| over
      n = 11, 13, 17, 19; (c) the change in (a) under a 16x per-call budget
      increase at n = 11.
    value: >-
      (a) at n = 19: FC 17.8, C 18.2, QFC 18.2 of 19; SUB 0.0. (b) at
      n = 19: FC 113, C 135, QFC 135 calls per target against |F_w| = 229;
      exponents FC 1.87, C 2.43, QFC 2.48 (MONO 1.51, SUB -0.87) against the
      registered threshold 0.8. (c) FC 5.36 -> 4.38, QFC 4.12 -> 2.50 of 11.
      Means over 8 targets at n >= 17 and 24 at n <= 13; no spread is
      reported, so no error bar is claimed.
    measured_by:
      - EXP-ICPERF-3fa3c7
    measured_by_note: >-
      EXP-ICPERF-3fa3c7 is this ledger's EXTERNAL CONTRACT RECORD and naming
