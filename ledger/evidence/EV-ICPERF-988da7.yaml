      bound by sha256 in external_provenance below.
    scope: >-
      K_0 : y^2 + xy = x^3 + 1 over GF(2^n), n in {7, 11, 13, 17, 19}; w = 2;
      m = 2; the paper's C, FC and QFC presentations with the XRev-BitFold
      order; the producing session's truncated F4 at pair degree 6 and the
      budgets stated. Claimed for no other w, no m >= 3, no larger n, no
      other engine, and not for the GBDecode outer loop.
    resource_check:
      examined: true
      reading: >-
        The check ran and found one reading, already spent: the structural
        fact that a Frobenius-stable factor base at prime n can have a
        popcount membership test and a bounded-degree membership ideal. Read
        forwards it removes a storage term from the other repository's
        section-6 table (done, as its section 6.3) and says nothing about
        operations. Read as a specification it says what an algebraic oracle
        on such a base would have to do to matter: resolve at depth well
        below n - 3, i.e. beat the exhaustive scan by a factor growing with
        n, and the measured behaviour is the opposite -- calls/|F_w| RISES
        with n. The check also looked for a resource in the MONO-versus-
        lifted gap (the control resolves 6-8 levels higher) and found none
        that survives: the control's generator count C(n, w+1) is what the
        lifted presentations exist to avoid, and its own exponent is 1.51.
        No theory takes this measurement as its hypothesis.
      spawned_ids: []
      spawned_ids_note: >-
        None. The open question left -- whether ANY membership presentation
        of a Frobenius-stable non-subspace base admits an oracle that
        resolves above the Prange point, at m >= 3 or with a stronger engine
        -- is KN-OPEN-5e3dd0, which cites this record and spawns nothing on
        its own.
