# =============================================================================
# EV-ICPERF-988da7 -- Hamming ideals as a point-decomposition oracle on the
#                     Koblitz curve K_0 over GF(2^n): the Prange point wins
#
# WHAT THIS RECORD IS: a pre-registered, frozen, fully verified NEGATIVE
# result on one oracle, plus one accounting correction to a cost claim in the
# other repository's decomposition note. The paper's Hamming ideals give a
# Frobenius-stable factor base at prime n an algebraic membership test with
# no storage -- which that note said prime n forbids -- and the resulting
# Groebner oracle is then measured to be the exhaustive oracle with a Groebner
# computation attached to each candidate.
#
# WHAT IT IS NOT: not a boundary-table row, not an end-to-end cost, not a rho
# ratio, and not evidence about ECC2K-130 at n = 131. Every number below is at
# n <= 19. RESULT.md in the other repository calls the whole thing a STAGE
# DIAGNOSTIC of one oracle, and this record does not upgrade that.
#
# EXTERNAL PROVENANCE. Every artifact lives in github.com/aburan28/crypto and
# is bound by sha256 below. No RUN-* record exists in this ledger for any of
# it. The standing of such records here is the one DEC-20260918-4b7e21 gave
# EV-ICPERF-10c5fc and EV-ICPERF-a8080e: a POINTER with a named ceiling, not
# a citable strength grade of this program, until a Coordinator decision says
# otherwise. This record is written to that ceiling from the start.
# =============================================================================
