  completion_criteria_impact: >-
    NONE for either goal. For GOAL-FROB-6333a9 this record neither discharges
    nor advances a criterion: it closes one more algebraic description of an
    orbit union at m = 2 and toy n, which is a boundary its next_action must
    not re-cross, not progress toward its rich-n decision. For
    GOAL-ICPERF-e6b6a4: Criterion C1 requires a fully measured
    boundary row per family with matched rho on the same machine; this record
    measures one oracle in an uncalibrated unit and computes no relation
    matrix, no full-DLP solve and no rho column. C2 is untouched: nothing is
    promoted to tools/ with a validator-run test. Reporting an oracle
    characterisation as progress against C1 is what CORR-20260916-402547
    corrects on the sibling campaign, and it is not done here. No hypothesis
    status changes on this record.
  successor: >-
    None planned by the producing session, and none is proposed here beyond
    the open question in KN-OPEN-5e3dd0. Revisit conditions, in decreasing
    order of cheapness: (1) a second Groebner engine (msolve or Magma's F4)
    on the frozen n = 17 and n = 19 systems, reporting tame depth in the same
    unit -- if it moves the depth by a factor rather than a few levels the
