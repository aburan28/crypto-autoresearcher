  observations:
    - >-
      O-1 (R1, the deciding fact). deg S_{m+1} in the m unknowns is m 2^{m-1} =
      4 / 12 / 32 / 80 at m = 2 / 3 / 4 / 5, with per-variable degree 2^{m-1},
      and the digit substitution and multilinear reduction preserve it (a
      block-multigrading argument, checked directly at (m, s) = (2,2), (2,3),
      (2,5), (3,4) by Moebius inversion over the Boolean cube). Hence
      delta = m min(2^{m-1}, s) = m 2^{m-1} at every table cell, D_0 - delta < 0,
      and rows(D_0) = Ncols(n, D_0 - delta) = 0 at ALL 54 cells and at every
      D_0 = 2 threshold row. The "2m" of H-PFDR-06fd60 (A) and
      IDEA-20260830-84cdb7 (A) is correct only at m = 2, which is not in the
      grid.
    - >-
      O-2 (R2). Even granting a generator of degree delta, the priced object
      cannot do what HEUR-001's second clause asks. The degree-D_0 Macaulay
      matrix has at most Ncols(n, D_0 - delta) rows against Ncols(n, D_0)
      columns, so its corank stays above 2^27 at every headline cell against
      N_sol = O(1), and the deficiency does not fall to O(1) until
      D >= n + delta - 1 (348 at n = 269, delta = 80). The closure loophole
      cannot act below the generator degree, so d_lf >= d_ff >= delta + 1 =
      13 / 33 / 81 at m = 3 / 4 / 5 - and EXP-PFDR-cbdefb measures exactly
      d_ff = delta + 1 at its boundary cells (5 at (m 2, s 2), 7 at (m 3, s 2)).
      At the derived first-fall degree one rank costs 2^504 at the (256, m 5)
      balance against 2^216 for full guessing and 2^269 for the whole digit cube.
    - >-
      O-3 (R4, unconditional on HEUR-001, on D_0 and on omega). The generator
      cannot be written down at the cells that carry the claim. Its top-degree
      part alone has binom(s, 2^{m-1})^m nonzero terms = 2^221.3 at
      (256, m 5, D_0 4, omega 2), exceeding that cell's entire claimed total of
      2^108.76 by 2^112.5, and the same at every m = 5 cell (excess 2^81.8 to
      2^115.7); it is marginal at m = 4 (-0.57).
    - >-
      O-4 (R4, moves a FROZEN threshold). cost_unit is declared "F_p field
      operations" while prior_time_log2 = 127.8254 is 0.886 sqrt(N) GROUP
      operations, and the two are subtracted directly. Any conversion of at
      least 2 field operations per group operation - which every addition
      formula exceeds - flips (256, m 4, D_0 4, omega 2) at +0.914,
      (256, m 5, D_0 6, omega 2.807) at +0.226 and (128, m 5, D_0 4, omega 2) at
      +0.219, and moves the frozen 256-bit threshold row for (m 4, omega 2) from
      "T >= rho at D_0 = 4" to "T < rho at D_0 = 4". The bias direction is
      conservative for the claim; the near-tie verdicts are not robust to the
      artifact's own declared unit. Separately, memory_log2 is the factor base
      only - the dense Ncols(n, D_0)^2 working set that the Ncols^omega time
      charge presupposes exceeds it by up to 2^39.9 at three of the four cells
      declared affected.
    - >-
      O-5 (R3, SURVIVES). The null-slice reproduction of IDEA-20260808-da1428
      holds WITH the corrected generator degree delta = m 2^{m-1}: C(k) strictly
      decreasing with argmin at the enumerative leaf, ratios -1.00 and
      -1.807 = 1 - omega, at all six fixture cells and both omega, and
      independently at all 54 balanced table cells. Fixture F1 survives the
      correction. The enumerative assembly slope is exactly 1.0 (N^1) and the
      C = 1 limit is 2/(m+1) exactly at m = 3, 4, 5.
    - >-
      O-6 (R3, SURVIVES). The marginal-cost sign derivation of claim (C) is
      correct within the model. Exact log2 ratios bracket 0 within 1-3 residual
      variables of the predicted crossing D_0/(1 - 2^{-1/omega}) (at D_0 = 4,
      omega = 2 the prediction is 13.66 and the exact sign change falls between
      n - k = 11 and 13), and both reviewers reproduce the crossing constants
      13.66 / 20.49 / 27.31 (omega 2) and 18.28 / 27.42 / 36.56 (omega 2.807).
    - >-
      O-7 (R3 and V2, SURVIVES after repair). P5's interior-band cost keeps only
      the top binomial binom(2(D_0 - m), D_0), which is 0 whenever D_0 < 2m. The
      residual Macaulay matrix at k_c has Ncols(2(D_0 - m), D_0) columns, equal
      to 2^{2(D_0-m)} for D_0 <= 2m, and the corrected band cost
      2^{n - (2 - 2 omega)(D_0 - m)} is still exponential in n, so the
      qualitative claim stands. The package reported the degenerate values as
      null and did not repair the frozen prediction, which is the correct
      handling.
    - >-
      O-8 (R1 proves-too-much object 2, SURVIVES). The m = 2 arithmetic is
      right. All 18 m = 2 cells sit above rho with minimum margin +40.48 in log2
      (64 bits, D_0 4, omega 2) and maximum +137.44, and m = 2 is the only
      region of the grid where the priced matrix has any rows at all
      (delta = 4, so D_0 in {6, 8} gives 2.5e4 to 2.0e8 rows).
    - >-
      O-9 (V2 and R4, SURVIVES). The cost bookkeeping charges TOTAL expected
      cost, not per-attempt cost. Both reviewers independently re-derived the
      balance from B relations with per-target success probability
      B^m/(m! N) and 2^m C per call, obtaining exactly B^{m+1} = m! 2^m C N and
      T = 2 B^2 - the frozen formula. Success is never set to 1 and the inverse
      success probability is carried in every tabulated number. Both omega
      appear on every cell, the o(1) is disclosed per cell as
      2^m Ncols(ms, D_0)^omega, eight optimistic assumptions each carry a bias
      direction, dominated_by is filled and correctly signed, and affected_scope
      opens "NONE unconditionally".
    - >-
      O-10 (V2, an accounting fact about the package's own design). The
      observation-collision design of H-PFDR-06fd60's proof_search_map is
      DEGENERATE AT EVERY TABLE CELL. The interior band is named as the
      observable separating "HEUR-001 true everywhere" from "a partial bound at
      k = 0 only", and the validator verified independently that k_c lies
      OUTSIDE the guessing range at 54 of 54 cells and that P5's top binomial is
      zero at 6 of the 9 (m, D_0) pairs. At every cell in the table the two
      hypotheses are observationally identical under this design. The package
      emits the facts that imply this and does not draw the consequence.
    - >-
      O-11 (V3, a reporting defect requiring correction by supersession).
      execution-report.md anomaly A2 states that P5's binomial is zero at "7 of
      the 9 (m, D_0) pairs"; the emitted artifact
      (thresholds.yaml.interior_band_HEUR002_only_fixture_ms) and the
      validator's independent recomputation both give 6 of 9 - zero at (3,4),
      (4,4), (4,6), (5,4), (5,6), (5,8) and nonzero at (3,6) = 1, (3,8) = 45,
      (4,8) = 1. BOTH VALUES WITH SIGN - reported 7, verified 6, the report
      overstates by +1. Severity narrative only; no cell, threshold, fixture,
      curve or scope statement depends on the count. Run records are immutable,
      so the correction belongs here and in a superseding note, never as an edit.
    - >-
      O-12 (V3 and R1, literal criterion accounting, recorded as failures rather
      than re-scored). Success criterion item (3) is MET under the contract's own
      listed hand values (max signed discrepancy 0.1516) and under
      H-PFDR-06fd60 (D) (max 0.1884), and NOT MET under IDEA-20260903-dcf857 (D)
      as a whole, where (256, m 4, D_0 6, omega 2.807) is +1.5966 against "about
      2^150". Prediction P3 (k* = 0) holds at 54/54 under the C(k) frozen in
      specification.inputs.cost_model and FAILS at 4 of 54 under the same model
      plus the enumeration-leaf charge frozen in H-PFDR-06fd60.assumptions - at
      n = 119, 110, 139, 154, so P3's "n = ms in the hundreds" does not excuse
      them. The package emitted both argmins per cell and reported the failing
      reading as anomaly A1 rather than selecting the flattering one. Criterion
      (2) is met by 0.1189 in log2 at its binding cell, the same order as the
      package's own n +/- 1 rounding sensitivity of 0.119. No criterion is
      re-scored by this record; a re-scoring needs a versioned protocol_amendment.
    - >-
      O-13 (R1 proves-too-much, the strongest structural finding). Holding the
      arithmetic fixed and varying the object places the DIRECT presentation -
      whose floor d_lf >= B = 2^47 is proven in IDEA-20260808-afe4ce - on the
      same side of the conclusion as the digit presentation, and scoring BETTER
      (2^94.95 against 2^108.76). The missing separator is precisely the row
      count: the generator degree never enters the cost. The survival is nowhere
      localised because no step of the argument ever compares D_0 with any
      generator degree; D_0 enters only through Ncols(., D_0). This needs no
      degree measurement to state.
    - >-
      O-14 (R4, method ceiling). Once D_0 is required to be at least delta, the
      largest claim this resource measure can support is log2 T = 342.97 at
      (256, m 5, omega 2, D_0 = 80, one Macaulay row) against rho's 127.83 - a
      ceiling 2^215 ABOVE the baseline. Under the alternative reading of D_0 as
      a MULTIPLIER degree the matrix would have 2^240 columns at the same cell,
      so that reading does not rescue the cells either. The reviewer could find
      no reading of D_0 under which the tabulated cells price a matrix that
      could solve.
    - >-
      O-15 (R1 OBJ-9, provenance, recorded because it is actionable). The error
      pre-dates this package. IDEA-20260830-84cdb7 claim (A) states "one
      generator of total degree 2m (degree 2 in each x_k)", contradicting this
      program's own KN-TECH-002. It propagates into 84cdb7's null d_reg, into
      H-PFDR-06fd60 (A)-(B), into the contract's CTRL-CONFOUNDERS-NAMED (iv),
      and into every cell here. IDEA-20260903-e1e38b (D3-D4) corrected it on
      2026-09-03; the correction had not reached this contract.

  inference: >-
    Compose V1-V3 with R1-R4 and the package is a valid receipt for an
    arithmetic that prices an impossible object at every cell it uses to make a
    claim. The receipt is admissible at derivation tier - the archive is what
    the script produces, the script is what the frozen formulas produce, and the
    zero-run contract is honoured in the committed snapshot. The formulas are
    not admissible as a pricing of the digit presentation at m >= 3: the
    substituted generator has degree m 2^{m-1}, so every bounded-slice cell at
    m in {3,4,5} and every D_0 = 2 row charges a Macaulay matrix with zero rows,
    and the four cells reported as beating rho are among them. That conclusion
    is independent of HEUR-001 and waits on no measurement. Independently of it,
    the generator cannot be written down at any m = 5 cell. What survives is
    real and is recorded with the same care - the null-slice reproduction under
    the corrected degree, the marginal-cost sign derivation, the corrected
    interior band, the m = 2 arithmetic and the total-cost bookkeeping - and it
    is the honest content of the package.

  largest_justified_claim: >-
    Scoped to the tested arithmetic (d = 2 digit presentation, m in {2,3,4,5},
    D_0 in {2,4,6,8}, omega in {2, 2.807}, log2 N in {64,128,256}, exact integer
    binomials, no curve at any scale): the digit-substituted summation generator
    has reduced total degree m min(2^{m-1}, s), which is m 2^{m-1} at every cell
    of the table, so every bounded-slice cell at m in {3,4,5} and every D_0 = 2
    row of EXP-PFDR-c04716 prices a Macaulay matrix with zero rows and the
    headline "beats rho at m = 5 for D_0 <= 6 at omega = 2" is VOID BY
    DERIVATION, independently of HEUR-001; any D_0 that could satisfy HEUR-001
    is at least m 2^{m-1}, and at that floor the same balance gives
    log2 T = 342.97 at (256, m 5, omega 2) against rho's 127.83.

  boundaries:
    - >-
      B-1. Zero runs, zero seeds, zero curves, zero sampled points, zero
      timings. Every number is either an exact integer binomial identity or an
      estimate conditional on HEUR-001. No measurement of any kind occurred.
    - >-
      B-2. No cryptographic-scale label. The log2 N in {64, 128, 256} rows are
      estimates about parameter sizes, not results at those sizes, and the
      contract says so.
    - >-
      B-3. Nothing here is a universal impossibility claim. It is NOT concluded
      that a bounded last fall degree is impossible for the digit presentation -
      a D_0 = m 2^{m-1} + O(1) constant in s is excluded by no argument in this
      round - nor that the digit presentation is worse than the direct one,
      whose floor m 2^{m-1} does not grow with the factor base, unlike
      IDEA-20260808-afe4ce's B, which is a real structural gain.
    - >-
      B-4. The scope of the degree floor is wider than this experiment: it is a
      property of the summation polynomial, so it applies to every presentation
      that keeps S_{m+1} as a generator, at every base d, not only at d = 2. The
      artifact does not make that scope statement and it should.
    - >-
      B-5. H-PFDR-06fd60 carries an asymptotic-complexity claim. Under the four
      promotion gates it may not move toward supported here at all; its ceiling
      is analyzed, and this record reaches that ceiling from the adverse side.
    - >-
      B-6. Judgement across this round is correlated: producer and both
      reviewers report the same model family with model_verified false and no
      adapter resolution record.

  unresolved_confounds:
    - >-
      UC-1. The validator did not audit cost_table.py line by line (750 lines).
      It read the docstring, the imports and targeted greps for nondeterminism
      and side effects, ran it twice, and reimplemented every load-bearing
      quantity. Equality with the archive is strong evidence about the
      arithmetic, not a proof that no unused branch does something else.
      ck-curves.yaml (19305 lines) was re-derived at the level of invariants,
      not point by point.
    - >-
      UC-2. The validator's F2 second pass is NOT blind. Its pre-hashed first
      pass gave slope omega - 1 and disagreed with the archive by 2.0 in the
      exponent; agreement at 2 omega - 1 was reached only after cost_table.py
      was opened and IDEA-20260808-da1428's mandated root-finding leaf charge
      was read. Both passes are preserved. F2's headline exponent is therefore
      not a property of the Macaulay column counting alone.
    - >-
      UC-3. The Huang-Kosters-Yeo relation that would connect HEUR-001's two
      clauses is carried as provenance recalled with verified_by null. Neither
      reviewer opened the source; it backs nothing in this record.
    - >-
      UC-4. No 384-bit or 512-bit rows exist, against
      docs/evidence-and-reproducibility.md "Concrete-cost estimation artifacts".
      The direction is conservative - the claimed margin GROWS with N at
      (m 5, D_0 4, omega 2): -19.06 at 256, -39.08 at 384, -59.43 at 512 - so
      the omitted sizes are where the claim would look strongest.
    - >-
      UC-5. No reviewer re-derived the classical degree law from a published
      source in this round. KN-LIT-001 is cited at key-claim level and
      KN-TECH-002 at header level.

  obstruction:
    statement: >-
      The digit-substituted summation generator's reduced total degree is
      m 2^{m-1}, not 2m, so a Macaulay matrix at any bounded degree D_0 below it
      has no rows at all. This is a property of the OBJECT - the summation
      polynomial S_{m+1} has per-variable degree 2^{m-1} and the digit
      substitution and multilinear reduction preserve it - and not a property of
      any attempt to price it.
    quantity: >-
      rows(D_0) = Ncols(n, D_0 - delta) with delta = m min(2^{m-1}, s), counted
      at every cell of the frozen 54-cell grid and at every threshold row; and
      the derived first-fall floor d_ff >= delta + 1.
    value: >-
      delta = 4 / 12 / 32 / 80 rows-degree at m = 2 / 3 / 4 / 5 (exact integers,
      no error bars - this is exact arithmetic, not a measurement).
      rows(D_0) = 0 at 54 of 54 cost-table cells and at every D_0 = 2 threshold
      row, for D_0 in {2, 4, 6, 8}. Floor d_ff >= delta + 1 = 5 / 13 / 33 / 81 at
      m = 2 / 3 / 4 / 5. At the floor, log2 T = 342.97 at (256, m 5, omega 2)
      against rho's log2 T = 127.83, a gap of +215.14 in log2. Independently,
      the generator's top-degree part has binom(s, 2^{m-1})^m = 2^221.3 nonzero
      terms at (256, m 5, D_0 4, omega 2), against that cell's whole claimed
      total of 2^108.76.
    measured_by:
      - EXP-PFDR-c04716
      - EXP-PFDR-5726af
      - EXP-PFDR-cbdefb
    measured_by_note: >-
      EXP-PFDR-c04716 supplies the 54-cell grid whose rows are counted.
      EXP-PFDR-5726af supplies the independent symbolic confirmation of the
      degree at m = 3 (RUN-PFDR-5726af-htop, total degree 12, per-variable
      [4,4,4], top form a single monomial with coefficient 1).
      EXP-PFDR-cbdefb supplies the measured d_ff = delta + 1 at its boundary
      cells (5 at (m 2, s 2), 7 at (m 3, s 2)), which is the floor at the two
      arities where it can be measured. The degree derivation itself was
      performed by the red team of TASK-20260904-6681da and is archived under
      proof_refs; it is not a run.
    scope: >-
      d = 2 digit presentation of IDEA-20260830-84cdb7, m in {2,3,4,5},
      D_0 in {2,4,6,8}, omega in {2, 2.807}, log2 N in {64,128,256}, exact
      integer binomials, no curve sampled. The DEGREE fact itself is a property
      of S_{m+1} and holds at every base d and every presentation keeping
