  boundaries:
    - >-
      ONE ADVERSARIAL READING OF A DRAFTED, UNAPPROVED CONTRACT AMENDMENT. No
      attack, no certificate, no security claim about SQIsign, CSIDH or any
      standardized parameter set in either direction; no exponent or asymptotic
      claim; no crossover, margin, speedup or baseline-comparison value derived,
      recomputed, tabulated or cited; no experiment executed and no run record read
      or written. THIS ROUND MEASURES NOTHING ABOUT ANY ISOGENY PROBLEM.
    - >-
      THE AMENDMENT'S ADEQUACY IS NOW EXAMINED BY TWO SESSIONS AND BY NO MORE, of
      one model family, under one orchestrating session, with blindness lifted for
      the second. That is corroboration by two METHODS, never agreement between
      distinct models.
    - >-
      NO SCRATCH SCRIPT OF THIS ROUND IS ARCHIVED. Every mechanical result here -
      the splice parse, the 23-pattern exercise, the 144-shape sweep, the exemption
      probes, the proves-too-much runs - was produced by scripts written OUTSIDE
      the repository and reported in prose with their inputs quoted. They are
      re-runnable in principle by anyone with a shell against the snapshot-bound
      artifacts, and re-checkable from no committed artifact today. RT-1 is the
      only one with a second-session re-run behind it.
    - >-
      EXERCISING A PATTERN SHOWS IT CAN FIRE, NOT THAT THE VOCABULARY COVERS THE
      DRIFT CLASS. The R2 result closes the question `is there a second pattern
      that can never fire` and leaves entirely open the question `does this
      vocabulary catch the phrasings that would actually occur`. The red team
      checked index 7's non-redundancy specifically; nobody has checked coverage.
    - >-
      SEVERAL CONCLUSIONS ARE CONDITIONAL ON QUANTITIES DELIBERATELY NOT EVALUATED,
      above all the sign of A in RT-2, which is a prohibited quantity. No
      reachability status, deviation, margin or crossover was computed by anyone.
    - >-
      THE RED TEAM DID NOT OPEN inputs/, EV-SSI-5d954c, EV-SSI-7a3e91, the
      BATCH-2e6130 amendment record or the BATCH-256a94 artifacts, and did NOT
      independently confirm that the law incorporated by clause_2's reference is
      what the draft says it is. Its verdicts are conditional wherever the
      package's reasoning depends on one of those.
    - >-
      NO COMPLETION CRITERION OF GOAL-SSI-001 IS MET OR APPROACHED. The three
      criteria require a mechanism with charged attack estimates materially
      improving a matched baseline, independent review of that mechanism, and its
      committed archive. This round read a contract, a draft and an instrument.

