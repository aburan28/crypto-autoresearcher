  observations:
    - >-
      Three expansion IDEA records were produced targeting exactly the lanes
      BATCH-001 left undeveloped: IDEA-20260731-004 (the QROM Fiat-Shamir
      extractor loss term L_QROM on FAEST's tau-round VOLEitH commit-and-open
      instance and the charged QROM forgery bound at the deployed set),
      IDEA-20260731-005 (an algebraic solving-degree census of the degree-3
      AES constraint system augmented with partial VOLE openings I_open,
      against the matched AES baseline), IDEA-20260731-006 (establishment of
      the faest_em_* Even-Mansour OWF matched baseline, which the 001..003
      records had explicitly declared unestablished in-repo, plus the
      structural-shortcut question for the AES-based public permutation P).
    - >-
      All three ideas are schema-complete, object-first (each names an exact
      attack object), carry the matched AES-128 baseline (2^126.1 biclique,
      KN-LIT-2701) under one cost convention with the RSF-1 one-pair data
      budget caveat carried, and label every unverified deployed number
      (field, kappa, tau, modes, digest lengths) as UNVERIFIED pending the
      RSF-5 spec v2.0 PDF-text gate. Novelty verdicts: IDEA-004 unverified
      (the 2026 Renyi-divergence retightening is unfiled), IDEA-005
      speculative, IDEA-006 adaptation. No idea claims a breakthrough.
    - >-
      Independent red-team review (TASK-20260731-009, review-adversarial,
      independent_session: true, resolved model
      opencode/deepseek-v4-flash-free) returned ADMIT on all three ideas with
      zero fatal objections and eleven nonfatal objections (OBJ-4-1..4,
      OBJ-5-1..3, OBJ-6-1..4). Completion gate passed: receipt validity,
      schema/object-first, matched-baseline correctness, novelty honesty,
      falsifiability/controls, and Pareto honesty all verified.
    - >-
      The strongest adversarial findings, carried into BATCH-002 design: the
      QROM reconstruction must name the quantum-grinding charge (Grover-on-salt
      ~2^{kappa/2} vs classical 2^kappa), a term that can exceed the probed
      slack (OBJ-4-1); the algebraic barrier's confirmation side is
      near-vacuous at deployed size, so the discriminating content is in the
      falsification direction and the per-S-box scale control (OBJ-5-1); the
      EM category claim sits at exactly 2^n with zero slack, so "backed by the
      baseline" overstates a knife's-edge condition, and P2's inversion-cost
      ratio is a weak discriminator — the informative probe is the toy P's ANF
      degree / differential profile vs the random-P null (OBJ-6-1, OBJ-6-2).
    - >-
      Snapshot receipt verified: commit 0e6befda (parent eb2a5abb) changes
      exactly the five declared paths and all four recorded SHA-256s match the
      working tree and committed blobs byte-for-byte.
  inference: >-
    The expansion closes the three named undeveloped lanes from BATCH-001
    with schema-complete, matched-baseline-bearing proposals, all admitted by
    independent review. The idea pool for RQ-FAEST-001 now spans six admitted
    records covering the consistency-check term, the grinding/repetition
    forgery model, the commitment-binding term, the QROM extractor loss, the
    algebraic constraint-system census, and the Even-Mansour OWF baseline.
    The RSF-5 spec v2.0 PDF-text blocker remains the single gating dependency
    for BATCH-002 experiment design; the review's eleven nonfatal objections
    are accepted as scope refinements for the design contracts. This is a
    literature/theoretical ideation outcome, not empirical evidence and not a
    cryptanalytic result.
  boundaries:
    - No hypothesis, experiment, run, or certificate was created in the expansion.
    - No empirical evidence was produced; EV-FAEST-002 records the expansion ideation outcome only.
    - No claim about FAEST's deployed security was made or validated.
    - The matched AES baseline is a comparative bound, not a deployed-scale FAEST forgery result.
    - Toy-scale measurements (if later designed) are toy-tier and cannot be presented as crypto-scale validation (AGENTS.md rule 7).
