evidence:
  id: EV-HAWK-001
  hypothesis_id: RQ-HAWK-001
  hypothesis_id_note: >-
    The hypothesis_id field carries the RESEARCH QUESTION id, following the
    convention of EV-AES-001, because GOAL-HAWK-001 has NO hypothesis. active_hypothesis_ids is empty and BATCH-001
    creates none. This record documents a SOURCE-ACQUISITION result, not a test of
    any prediction, and it is filed so the batch's findings are citable rather
    than living only in a working tree.
  experiment_ids: []
  run_ids: []
  goal_id: GOAL-HAWK-001
  question_id: RQ-HAWK-001
  batch_id: BATCH-001
  type: literature
  direction: neutral
  direction_note: >-
    NEUTRAL is the correct value and is chosen deliberately. Nothing here supports
    or weakens any claim of this program, because this program has made none about
    HAWK. The record's content is about what OTHER PEOPLE claim and about what
    could be obtained.
  strength: inconclusive
  strength_note: >-
    A reading batch cannot produce replicated or strong evidence. The two censuses
    were independently re-measured and agree exactly, which makes the FACTS here
    solid; the STRENGTH field is about evidential force toward a hypothesis, and
    there is no hypothesis.
  claim_tier: toy
  claim_tier_note: >-
    RQ-HAWK-001 sets a toy-tier ceiling until a certified instance at or above the
    scheme's own parameter scale exists. No such instance exists in this program.
    NOTHING IN THIS RECORD MAY BE CITED AS A STATEMENT ABOUT DEPLOYED HAWK
    PARAMETERS.
  certificate_refs: []
  proof_status: not_applicable
  proof_refs: []

  observations:
    - id: OBS-1
      statement: >-
        The disclosed attack (Straznickas-Weis, "HAWK-n Key Recovery Reduces to SVP
        in Dimension n/2 + 1") contains NO numbered heuristic and no conjecture.
      measurement: >-
        Regex census over a pdfminer.six extraction of the full 78015-character
        text: Heuristic 0, Conjecture 0, Assumption 1, Theorem 28, Lemma 60,
        Proposition 19, unconditional 4.
      independently_reverified: >-
        YES. TASK-20260802-006 re-acquired the PDF (sha256 byte-identical to the
        recorded 056faead...ac89, 748154 bytes), re-extracted three times, and
        reproduced all seven counts exactly, with a negative control for
        split-token matches and a positive control confirming lowercase
        "heuristic" occurs 14 times.
      scope_correction: >-
        The REDUCTION is unconditional. THE PAPER is not heuristic-free: its
        gate-count totals, its released implementation ("the heuristic
        implementation of section 6.2, not the provable reduction of section 5")
        and its non-power-of-two conductor scope claim are explicitly heuristic.
        See CORR-20260802-008 defect 3.
    - id: OBS-2
      statement: >-
        van Gent-Pulles 2025 contains EXACTLY ONE numbered heuristic (Heuristic 1),
        plus an unnumbered group-theoretic argument in section 5.
      measurement: Regex census over the full 39268-character extraction; Conjecture 0.
      independently_reverified: >-
        YES, by TASK-20260802-006, from a byte-identical re-acquisition
        (sha256 56107a8a...af50, 554496 bytes).
    - id: OBS-3
      statement: >-
        The ePrint abstract for iacr:2026/1318 is COMPLETE at 2031 characters and
        was never truncated. Its 30/06 update states that the main algorithm
        "appears to run in super-polynomial time", names the cause (fractional
        ideals omitted from a count of ideals of norm q' in O_F), and reports that
        HEURISTICS 1-3 HAVE BEEN INDEPENDENTLY EXPERIMENTALLY VERIFIED.
      measurement: >-
        Page 18133 bytes, abstract 2031 chars, OAI-PMH datestamp 2026-07-05 - i.e.
        unchanged since before KN-LIT-7670 was written.
      how_it_was_found: >-
        By TASK-20260802-007 (Red Team) objection O1, and confirmed by the
        Coordinator against the live page. The producer had recorded the abstract
        as "truncated mid-sentence"; the truncation was a 1600-character DISPLAY
        cap in this program's own extraction script. See CORR-20260802-008
        defect 1.
    - id: OBS-4
      statement: >-
        Source obtainability under this harness: eprint.iacr.org PDFs are blocked
        by an origin-side Cloudflare challenge for every report number tested
        (2026/1318, 2026/890, 2025/928, 2025/1376, 2025/215); eprint HTML abstract
        pages are reachable; cic.iacr.org and anthropic.com serve PDFs directly.
      not_a_network_policy_denial: >-
        The agent proxy reported enabled true with recentRelayFailures [] during
        the attempts. THE BLOCKER IS ORIGIN-SIDE BOT PROTECTION, NOT THE HARNESS
        NETWORK POLICY, and the goal's second pause condition is written about the
        network policy.

  inference: >-
    GOAL-HAWK-001's objective is framed around "the reported classical
    POLYNOMIAL-TIME smLIP key-recovery attack on HAWK". Against the obtained
    sources that framing does not pick out a live target. For iacr:2026/1318 the
    polynomial-time claim is WITHDRAWN BY ITS OWN AUTHORS (OBS-3). For the
    disclosed attack the result is unconditional but EXPONENTIAL - the authors
    state 2^{(n/2+1)+o(n)} with a provable sieve oracle - so it is an
    exponent-halving result, not a polynomial-time one. The goal therefore needs
    re-scoping, and DEC-20260802-007 records that as a `refine`.

  boundaries:
    - >-
      NOTHING IS VERIFIED. No step of any reduction was checked, no lemma
      re-derived, no implementation run, no heuristic tested. This program has run
      no HAWK experiment and holds no HAWK certificate.
    - >-
      NO ASSESSMENT OF HAWK'S SECURITY IS MADE IN EITHER DIRECTION. In particular
      the 2^150 -> 2^108 and 2^288 -> 2^182 gate figures and the reported HAWK-256
      key recovery appear only inside KN-LIT-7592's own "Not verified here" body
      and are NOT adopted, repeated or relied on by this record.
    - >-
      The four heuristics of iacr:2026/1318 REMAIN UNREAD. Only its abstract and
      30/06 update were obtained; the PDF is Cloudflare-gated. The goal's
      source-acquisition obligation is therefore PARTIALLY discharged.
    - >-
      The HAWK Round-3 specification remains unread, so every [HAWK25] table
      reference relayed here is second-hand.
    - >-
      Formula-level transcription is unreliable. Both transcription files are
      pdfminer.six extractions of two-column LaTeX. TASK-20260802-006 confirmed no
      claim depends on a damaged formula, but also found that
      disclosed_attack_transcription.md lacks a global damage caveat and leaves at
      least four damaged renderings unmarked.
    - >-
      Model independence is PROCEDURAL ONLY. Producer, validator and red team all
      resolved to claude-opus-5. NOTHING HERE IS ADMISSIBLE TOWARD THE AGENTS.md
      RULE 13 THREE-MODEL CLOSURE QUORUM.

  unresolved_confounds:
    - >-
      Pause condition 2's non-firing rests on routes A4 (arXiv) and A5 (Semantic
      Scholar) having returned TEMPORARY 429s that this session itself caused. The
      Red Team upheld the conclusion but objected that "retry available" has no
      retry-by date, owner or queued task, which makes the condition
      unfalsifiable. Route A6 was declared but never attempted for iacr:2026/1318
      by the producer; the Red Team attempted it (Imperial Spiral DSpace,
      totalElements 0).
    - >-
      Whether the disclosed attack constitutes a strictly stronger position than
      van Gent-Pulles is UNDETERMINED. The two are quoted in different units -
      blocksize beta = n/4+1 under heuristic BKZ versus oracle dimension n/2+1 -
      and were never placed in a common cost unit. CORR-20260802-008 defect 2.
    - >-
      BATCH-001's snapshot archives were executed in a shape research_dispatch.py
      rejects: the TASK-20260802-005 receipt was committed in bb54c7ab, SEPARATE
      from the artifacts it binds (3a39803c), whereas the tool requires an archive
      commit to contain its own receipt. The artifacts ARE committed and
      hash-bound and the declared-equals-committed check passed for each commit
      individually, but the QUEUE DOES NOT RENDER in that shape. This is an
      evidence-integrity bookkeeping defect of the same family as
      CORR-20260729-003, and it is recorded rather than repaired by rewriting
      pushed history.

  reviewed_by: coordinator
  independent_reviews:
