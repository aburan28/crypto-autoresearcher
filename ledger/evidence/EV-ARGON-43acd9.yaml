    - RUN-ARGON-2608c2-4da88e
    - RUN-ARGON-2608c2-1a1711
    - RUN-ARGON-2608c2-e0b77a
  type: empirical
  direction: neutral
  direction_note: >-
    Not `supports`/`weakens`/`contradicts` because no measurement bearing on
    H-ARGON-ef2f0b's substantive claim (rho, the Argon2 DAG's
    depth-robustness relative to a uniform-reference null) exists anywhere
    in this run set. Every run in run_ids belongs exclusively to the
    REQUIRED `bcf891_independent_known_family_calibration` exact-tier
    stage, which is a precondition gate on TWO SYNTHETIC calibration
    families (`family_A_doubling_graph`, `family_B_pure_chain`), not on
    Argon2 itself. No `G_real`/`G_unif` graph, no rho value, no KS
    statistic, and no seed-consistency check exists in this run set for any
    (variant, t, q) cell.
  strength: inconclusive
  strength_note: >-
    "Data do not distinguish the relevant explanations"
    (docs/evidence-and-reproducibility.md) -- literally true here: there is
    no rho/KS data of any kind to distinguish H-ARGON-ef2f0b's confirming
    and falsifying outcomes. This is procedural/tooling inconclusiveness
    (a REQUIRED gate could not be certified within budget), not a
    contradictory or ambiguous *measurement* of the hypothesis.
  claim_tier: toy
  certificate_refs: []
  certificate_note: >-
    No run in this set claims a solve or relation of any kind (every
    manifest carries `certificate: {kind: none}`, per
    docs/claims-and-verification.md, correct for a pure-measurement
    contract). The certificate-discipline requirement is inapplicable to
    this evidence record, not merely unmet.
  proof_status: not_applicable
  proof_status_note: >-
    docs/claims-and-verification.md's refutation-artifact ladder
    (counterexample certificate -> derivation note -> declared
    empirical_only) governs an ADVERSE transition against a hypothesis
    resting on a result that speaks to its prediction. Nothing in this run
    set speaks to H-ARGON-ef2f0b's prediction in either direction, so there
    is no rung of that ladder to climb; `not_applicable` is the honest
    label, not a downgrade from `empirical_only`.
  proof_refs: []
  observations:
    - >-
      5 of 6 REQUIRED `calibration_exact_tier` cells certified
      `calibration_error_ratio = greedy_|S*| / exact_|S*|` inside the
      required `[1.0, 1.5]` window, each via a CBC branch-and-cut solve
      independently confirmed `proven_optimal` (not merely
      `LpStatus == "Optimal"`, which this task's own implementation.md
      documents as an unreliable signal on its own -- fixed by redirecting
      OS file descriptor 1 and parsing CBC's real log text):
      family_A_doubling_graph q=16 (ratio 1.2000, 5.3s), family_A_doubling_
      graph q=32 (ratio 1.3750, 39.3s), family_B_pure_chain q=16/32/64
      (ratio 1.0000 at all three, each <0.02s -- the pure chain's minimum
      removal set is always exactly 1 node, its own midpoint).
    - >-
      family_A_doubling_graph at q=64 (the sixth REQUIRED cell) did NOT
      certify: CBC exhausted a declared 150s time limit (log:
      "Stopped on time limit") with a valid, independently-`verify_ok`
      incumbent upper bound of 17 and a dual lower bound that only reached
      4.433 (rounds to 5) after an additional 300s ad hoc diagnostic
      extension. The true exact minimum for this cell is therefore known
      only to lie in [5, 17], so the true `calibration_error_ratio`
      (greedy 21 / true exact) lies in [1.235, 4.20] -- a range straddling
      and mostly exceeding the required [1.0, 1.5] window, not a point
      value either inside or outside it.
    - >-
      Coordinator independent re-verification: run count (6/6 planned),
      manifest schema completeness, RNG-seed accounting (none needed;
      documented why), and raw-result.json vs manifest.yaml vs
      execution_report.md agreement were all independently re-checked
      cell-by-cell and found to agree exactly, with no discrepancy in
      either direction. A brute-force re-derivation (independent of both
      the greedy heuristic and the ILP formulation) at q=16 reproduces both
      families' exact minimum removal sizes exactly (family_A: 5, family_B:
      1), corroborating the pipeline's correctness on the certifying cells.
    - >-
      Exhaustive search of every artifact under
      `experiments/EXP-ARGON-2608c2/runs/` (logs, raw results, commands,
      environment files, and the retained-but-unexercised `_lib/
      argon2_lane.py`/`_lib/ks.py` source) for any reference to `argon2`,
      `G_real`, `G_unif`, `rho`, or `KS` found none: the calibration gate's
      procedural ordering was genuinely honored, not merely claimed.
  inference: >-
    Per specification.yaml's stopping_rules (first entry, binding
    "at EVERY exact_tier_size" for BOTH calibration families before any
    Argon2 construction), 5 of 6 certifying cells does not satisfy the
    gate -- there is no partial-credit reading of that text, and the
    uncertified q=64 cell is a genuine, disclosed, three-times-
    cross-checked (rejected big-M, rejected lazy-cutting-plane, from-
    scratch branch-and-bound) combinatorial-optimization tractability
    finding specific to family_A_doubling_graph's adversarial
    many-overlapping-path structure under open-source CBC, not an
    implementation defect. The Executor's halt before constructing any
    G_real/G_unif graph is the contractually correct response to this
    finding, independently confirmed here rather than accepted on the
    Executor's own characterization. This finding is entirely about the
    MEASUREMENT PIPELINE'S calibration precondition and carries no
    information about RFC 9106, Argon2, or H-ARGON-ef2f0b's mechanism in
    either direction (AGENTS.md rule 3: a resource-exhaustion/procedural
    halt is never negative evidence, and here there is additionally no
    positive-direction data either -- the hypothesis's subject matter was
    simply never brought into contact with data by this run set).
  boundaries:
    - >-
      Scope: exactly two synthetic calibration graph families
      (family_A_doubling_graph, family_B_pure_chain), exactly three exact
      sizes (16, 32, 64), one open-source ILP solver (CBC 2.10.3 via pulp
      3.3.2, no commercial solver reachable in this environment), 150s
      declared / 300s diagnostic time budget, on a 4-vCPU/15GiB host.
      Nothing here transfers to a different solver, longer budget,
      different family construction, or to Argon2 itself.
    - >-
      The [5, 17] bracket at family_A q=64 is a measured fact (certified
      feasible upper bound and certified dual lower bound); the true value
      within that bracket is unknown and this record does not guess at it.
    - >-
      claim_tier: toy (all tested q <= 64, well inside the toy-tier
      bound). No claim about Argon2, RFC 9106, HEUR-001, HEUR-002, or any
      parameter set's suitability is made or implied anywhere in this
      record. No password, credential, leaked corpus, or third-party
      dataset was used or referenced (GOAL-ARGON-001 binding constraint).
  unresolved_confounds:
    - >-
      Whether a stronger ILP formulation, a structure-specific exact
      algorithm for family_A_doubling_graph (its log-degree,
      doubling-distance structure is not exploited by the generic tight-M
      MILP used here), or a commercial solver would close the q=64 gap
      within a comparable or larger time budget is untested -- three
      formulation attempts were tried and rejected (see
      experiments/EXP-ARGON-2608c2/implementation.md), but the space of
      possible formulations is not exhausted. See KN-OPEN-9c41af.
    - >-
      Whether the same tractability wall would recur at exact_tier_size=64
      under a re-dispatch of the IDENTICAL gate design is not tested by
      this record (no re-dispatch occurred), but is treated as plausible
      given the qualitative growth pattern already observed between q=16,
      32, and 64 for family_A (removal-set size and solve time both grow
      sharply), per DEC-20260906-3b6bdc's rationale for `pause` over
      `refine`.
  obstruction: null
  obstruction_note: >-
    No obstruction block: this record's decision (`pause`, see
    DEC-20260906-3b6bdc) does not close H-ARGON-ef2f0b or EXP-ARGON-2608c2
    on "no route remains" -- a concrete unblock path exists (stronger
    formulation, commercial solver, or a versioned protocol_amendment
    narrowing family_A's exact_tier_sizes), per
    agents/coordinator.md's closure gate, which requires an obstruction
