  experiment_ids: [EXP-MLKEM-42ea04]
  run_ids: []
  run_ids_note: >-
    No ledger RUN-* record exists for this task, matching this goal's own
    established PREREG-driven-Stage-0/infra-task pattern (cf. EV-MLKEM-098182,
    EV-MLKEM-ef0261). TASK-20260815-6e4c02's own run_manifest.yaml declares
