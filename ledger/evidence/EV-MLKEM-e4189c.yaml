    calibration-instance-generality finding (independently, live executed
    by the Red Team at two separate bases, with a bit-identical-seed
    counterexample at each); the notarization chain. It is explicitly NOT
    claimed for: whether (d=512, beta=55) or (d=512, beta=70) would clear a
    full BKZ tour at their own properly-calibrated precision (unmeasured by
    anyone -- an open question this record states plainly rather than
    closes); or whether the deeper (d=512,beta=40) failure mode would
    recur at a materially higher precision than 69 bits (also unmeasured).

