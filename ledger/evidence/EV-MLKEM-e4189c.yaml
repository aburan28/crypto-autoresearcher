  type: empirical

  direction: neutral
  direction_note: >-
    NEUTRAL, and correct, not a hedge. T-PROJNOISE-NODATA fires again for
    this narrower follow-up package (0/3 d=512 main-grid cells cleared a
    full BKZ tour). PREREG-8's own FORBIDS clause bars any C1/C2 statement
    in either direction and this record makes none. What this record DOES
    adjudicate: (a) the reported bisection (69 bits at (d=512, beta=40)) and
    the reported 0/3 main-grid outcome are genuine and reproducible,
    independently re-executed by both reviews; (b) the task's own framing of
    "69 bits" as d=512's own dimension-level minimum is DECISIVELY FALSIFIED
    by the Red Team's own live, executed OBJ-1 control at (d=512, beta=55)
    and (d=512, beta=70); (c) as a direct consequence, only ONE of the three
    reattempted cells was actually tested at its own correctly-calibrated
    precision, and the narrower, corrected reading of what this batch shows
    is the load-bearing content of this record. See
    cell_by_cell_precision_status below.

  validator_verdict: passed
  validator_verdict_note: >-
    TASK-20260815-2f026b (VAL-20260815-2f026b) returned `passed`. The
    notarization chain (TASK-20260815-af296c's own snapshot commit
    71d62ecc6fbae1762f0f14a510d195cd7dabf803, self-referential follow-up
    186980fdf59466cffdcac5964484df6e5e8d5e85) was independently checked in
    both directions with git plumbing and every declared hash independently
    recomputed and matched. The construction and seed formula were diffed
    programmatically against probe1_bisection_generality.py and
    TASK-20260814-534f80's own worker_main_cell() and found byte-identical
    (no critical finding). The bisection was independently spot-checked live
    (a fresh, non-imported re-implementation at 68/69 bits, (d=512, beta=40))
    and reproduced exactly (68 ERROR, 69 COMPLETED, bit-identical seed). ALL
    THREE reattempted main-grid cells (exceeding the "at least one"
    completion_gate floor) were independently re-attempted live and
    reproduced exactly, down to the precise traceback call-site line
    numbers, at the producer's own reported precision (69 bits) --
    PER_BASIS_FEASIBILITY_CAP_V3=14400s confirmed applied exactly by source
    inspection and results cross-check. ONE finding is disclosed: a
    non-load-bearing wall-clock bookkeeping/narrative-arithmetic defect (see
    arithmetic_errors_disclosed below). The Validator's own review scope
    reproduced what the producer actually ran (all 3 cells at the
    beta=40-derived 69 bits); it did not itself test whether 69 bits is
    adequate for (d=512, beta=55)/(d=512, beta=70)'s own bases -- that
    question is answered by the Red Team's OBJ-1, below.

  red_team_verdict_summary: >-
    TASK-20260815-85e02a (RT-20260815-85e02a) does not challenge the
    reported 0/3 outcome, the notarization chain, or the construction/seed
    fidelity, but raises OBJ-1 (severity: critical), the completion_gate's
    own required generality challenge: the task's own writeup frames "69
    bits" as "d=512's own minimum adequate isolated-LLL-step precision," a
    property of the DIMENSION. The Red Team independently ran the identical
    isolated-LLL-step harness at the OTHER two main-grid bases -- (d=512,
    beta=55, seed=452658293) and (d=512, beta=70, seed=915347894), both
    seed-verified bit-identical to the producer's own reported
    main_grid_reattempt_seeds_used -- at mpfr_bits=69 (the value borrowed
    from beta=40) and mpfr_bits=100 (known-succeeding at beta=40). RESULT AT
    BOTH OTHER BASES: 69 bits -- ERROR (identical
    `ReductionError('infinite loop in babai')`); 100 bits -- COMPLETED. This
    is confirmed, by direct inspection of this host's own installed fpylll
    0.6.4 bkz.py source, to be the EXACT SAME operation
    (`BKZReduction.__call__`'s own first call, `self.lll_obj()`, bkz.py:123)
    that (d=512, beta=55) and (d=512, beta=70) already fail on in phase (b)
    of this task's own reattempt -- so the isolated-step probe is not an
    analogy for phase (b)'s own result at those two cells, it is a direct,
    independent re-execution of the SAME operation, now bracketed to (69,
    100] bits at each of those two other bases. OBJ-2 (severity: high) notes
    (d=512, beta=40)'s own deeper-but-still-failing full-tour result (past
    the initial `lll_obj()` call, inside `svp_preprocessing`) is a FOURTH
    recurrence of KN-FIND-f54a82's own already-promoted isolated-step-vs-
    full-tour pattern -- a DIFFERENT axis from OBJ-1's calibration-instance-
    generality axis -- and flags, without deciding, that OBJ-1 here may
    supply the second recurrence DEC-20260814-8ec2e5's own knowledge-
    promotion bar named. OBJ-3 (severity: high) names an omitted forward-
    looking cost: the true cost of a genuinely, individually calibrated
    attempt at every d=512 main-grid cell is at least 3 bisections + 3
    reattempts, not 1 bisection + 3 reattempts, which this task's own
    budget_justification never named. OBJ-4 (severity: medium) independently
    confirms the same two arithmetic errors the Validator found and
    discloses a third, minor one. The Red Team's own narrowest_supported_
    statement states plainly that this task's own headline -- "0/3 cells
    failed even at a properly-calibrated precision" -- is NOT supported;
    what is supported and reproducible is "0/3 at an under-calibrated-for-
    2-of-3-cells precision." The Red Team's own required_controls name
    CTRL-2 (a genuine per-cell bisection at (d=512, beta=55) and (d=512,
    beta=70)) and CTRL-3 (a reattempt of each cell's full BKZ tour at its
    OWN properly-bisected precision) as the decisive next step, with its own
    caveat that even that would not itself be fully decisive per OBJ-2's
    pattern -- a full-tour-level precision search remains a further,
    costlier step.

  # ==================================================================
  # THE TERMINATION BRANCH
  # ==================================================================
  termination_branch:
    branch: >-
      T-PROJNOISE-NODATA fires AGAIN, for this narrower follow-up package,
      per PREREG-8 sections 2.3 and 4.3 item 1.
    read_off: >-
      n_cells_attempted_at_full_tour = 3, n_cells_completed = 0 -- exactly as
      every prior batch of this goal's Stage-0 history found. This is a
      narrower, d=512-only re-measurement of Stage 0, not a new named
      branch; PREREG-8's own MEANS clause applies exactly as before,
      confirmed independently by both reviews (neither challenges the
      branch).
    what_this_licenses: >-
      Citing the corrected-construction, dimension-appropriately-bisected
      (d=512, beta=40) bisection result and the 3-cell main-grid reattempt's
      own real per-cell outcomes (all 3 ERROR, exact tracebacks and
      wall-clock, none NOT_COMPUTED) as a standalone, reportable
      infrastructure-timing deliverable. Nothing else.
    what_this_forbids: >-
      Any statement about C1 or C2's truth, in either direction, at any of
      the 3 cells. Neither the producer, nor either review, nor this record
      makes one anywhere.

  # ==================================================================
  # CELL-BY-CELL PRECISION STATUS -- THE LOAD-BEARING SECTION
  # ==================================================================
  cell_by_cell_precision_status: >-
    THE TASK'S OWN "0/3 AT A PROPERLY, DIMENSION-APPROPRIATELY-BISECTED
    PRECISION" FRAMING IS NOT ADMISSIBLE AS STATED, AND MUST NOT BE LUMPED
    TOGETHER. Only ONE of the three reattempted cells was tested at its own
    correctly-calibrated precision:
    (1) (d=512, beta=40) -- TESTED AT ITS OWN CORRECT, GENUINELY-BISECTED
    PRECISION (69 bits, a genuine 1-bit-resolution minimum determined
    exactly at this instance: 68 bits ERROR, 69 bits COMPLETED at the
    isolated-step level, independently spot-checked live by the Validator).
    RESULT: 0/1 -- ERROR, but at a materially DEEPER call site (inside
    `svp_preprocessing`'s own windowed `lll_obj()` call, during the first
    tour's SVP-block reduction, PAST `BKZReduction`'s own initial
    `self.lll_obj()` call) than the predecessor batch's under-calibrated
    65-bit run, or than (d=512, beta=55)/(d=512, beta=70)'s own failures in
    this same batch (both of which fail at the identical, shallower site as
    the predecessor's 65-bit run: `bkz.py:123`'s `self.lll_obj()`, the FIRST
    call `BKZReduction.__call__` makes, before any tour begins). Per the Red
    Team's own OBJ-2, this deeper-but-still-failing outcome is a FOURTH
    independently-observed recurrence of KN-FIND-f54a82's own already-
    promoted isolated-step-vs-full-tour permissiveness pattern -- confirming
    that even a genuinely, correctly-calibrated isolated-step precision does
    not guarantee a full-tour completion, at the ONE cell where the
    calibration was actually done correctly this batch.
    (2) (d=512, beta=55) and (d=512, beta=70) -- TESTED ONLY AT A BORROWED
    PRECISION (69 bits, bisected at (d=512, beta=40)) NOW DECISIVELY SHOWN
    INADEQUATE FOR THEIR OWN BASES. The Red Team's own OBJ-1, a live,
    independently-executed, seed-bit-identical control, directly falsifies
    "69 bits generalizes within d=512": at BOTH other bases, 69 bits ERRORs
    and 100 bits COMPLETES at the isolated-LLL-step level -- the exact
    operation both cells' own phase-(b) tracebacks already fail on. These
    two cells' own true minimum adequate precision lies somewhere in (69,
    100], an interval this task's own single-instance bisection design could
    not detect and did not attempt to detect. NEITHER CELL HAS BEEN
    ATTEMPTED, AT ANY LEVEL (isolated-step or full-tour), AT A PRECISION
    ACTUALLY ADEQUATE FOR ITS OWN BASIS. Their status remains GENUINELY OPEN,
    not "failed at a properly-calibrated precision."
    THE NARROWEST SUPPORTED STATEMENT, matching the Red Team's own
    narrowest_supported_statement verbatim in substance: "At (d=512,
    beta=40) specifically, raising isolated-step precision from the
    predecessor's under-calibrated 65 bits to a genuinely bisected 69 bits
    changes the full-tour failure site materially (deeper) but does not
    clear a full tour within a 14400s cap. At (d=512, beta=55) and (d=512,
    beta=70), the 0/2 outcome reported this batch is evidence only of
    failure at an under-calibrated-for-those-two-bases precision, NOT
    evidence that a properly, individually calibrated attempt at either
    basis would also fail." This record adopts that narrower statement, not
    the task's own broader "0/3 at a properly-calibrated precision" framing.

  # ==================================================================
  # WHAT THIS DOES AND DOES NOT LICENSE FOR THE NEXT DECISION
  # ==================================================================
  admissible_now:
  - "The bisected minimum precision (69 bits) at (d=512, beta=40), isolated-
    LLL-step level -- independently spot-checked and reproduced exactly
    live by the Validator."
  - "(d=512, beta=40)'s own full-tour reattempt at that precision: ERROR,
    at a materially deeper call site than before -- independently
    reproduced live by the Validator, with identical traceback line
    numbers."
  - "(d=512, beta=55) and (d=512, beta=70)'s own full-tour reattempt AT THE
    BORROWED 69-BIT PRECISION: ERROR, at the same shallow call site as the
    predecessor's 65-bit run -- independently reproduced live by the
    Validator, at the SAME (borrowed) precision the producer used."
  - "OBJ-1: the (d=512, beta=40)-bisected 69-bit precision does NOT
    generalize within d=512 -- independently, live executed by the Red Team
    at both other main-grid bases, with the boundary bracketed to (69, 100]
    bits at each."
  - "OBJ-2: (d=512, beta=40)'s own deeper-but-still-failing full-tour result
    is a fourth recurrence of KN-FIND-f54a82's own already-promoted
    isolated-step-vs-full-tour pattern."
  - "The notarization chain and all committed producer/snapshot artifact
    hashes -- independently re-verified in both directions with git
    plumbing by both reviews."

  not_admissible_now:
  - >-
    "0/3 d=512 CELLS FAILED EVEN AT A PROPERLY, INDIVIDUALLY CALIBRATED
    PRECISION." Only 1 of 3 cells was tested at its own correctly-calibrated
    precision. The other 2 remain genuinely untested at their own adequate
    precision, at any level -- directly falsified as a claim by the Red
    Team's own executed OBJ-1 control. See cell_by_cell_precision_status
    above.
  - >-
    "69 BITS IS d=512's OWN MINIMUM ADEQUATE PRECISION," STATED WITHOUT
    NAMING THE (d, beta) INSTANCE IT WAS DETERMINED AT. 69 bits is a
    property of ONE calibration instance ((d=512, beta=40), isolated-step
    level), not a general property of the dimension -- the exact same
    caution EV-MLKEM-098182 already recorded for the predecessor's 65-bit
    figure, now recurring one level deeper (within-dimension-across-beta,
    not merely across-dimension).
  - >-
    ANY TREATMENT OF THIS BATCH'S OWN 0/3 OUTCOME AS LICENSING
    DEC-20260814-4ac30a's OWN NAMED ESCALATION BRANCHES (upstream fplll bug
    report, alternate fplll/fpylll build/version, or a scoped-down
    dimension) AS RIPE. See escalation_ruling in DEC-20260815-201633 -- the
    primary Coordinator determination this record supports.
  - >-
    ANY CLAIM THAT (d=512, beta=55) OR (d=512, beta=70)'S OWN TRUE MINIMUM
    PRECISION IS KNOWN. It is bracketed to (69, 100] by the Red Team's own
    OBJ-1, not determined.

  # ==================================================================
  # ARITHMETIC ERRORS DISCLOSED -- NON-LOAD-BEARING, NOT CORRECTED IN PLACE
  # ==================================================================
  arithmetic_errors_disclosed: >-
    BOTH REVIEWS INDEPENDENTLY CONFIRM THE SAME TWO ARITHMETIC ERRORS IN
    run_manifest.yaml's OWN NARRATIVE PROSE (also echoed in writeup.md and
    in the commit message for snapshot commit 71d62ecc): (1) a
    double-counted total: run_manifest.yaml's own prose states "2662.76s +
    4080.23s = 6742.99s," but main_grid_d512_reattempt_results.json's own
    `total_script_wall_clock_seconds` (4080.23s) is ALREADY measured from
    the top of `main()`, before phase (a) begins, so it already includes
    the full 2662.76s bisection cost -- adding it a second time inflates the
    reported total by exactly that amount; the TRUE total is ~4080s
    (internal-JSON-derived). (2) a digit-transposed outer-timestamp delta:
    run_manifest.yaml and writeup.md both state "~4779s" as the authoritative
    outer wall-clock bound, but run_end_utc.txt minus run_start_utc.txt
    independently recomputes to 4179s exactly (both reviews' own independent
    Python datetime recomputation agree to the second) -- a single-digit
    transposition (4179 -> 4779), not a data problem; run_start_utc.txt and
    run_end_utc.txt themselves are correct and sha256-verified. THE RED
    TEAM'S OWN OBJ-4 ADDITIONALLY DISCLOSES A THIRD, MINOR ERROR THE
    VALIDATOR DID NOT FLAG: writeup.md's own prose claims "8 trials total"
    for the bisection ("6 further trials ... plus the two endpoints"), but
    only 7 trials are actually listed and actually run (65, 100, 82, 73, 69,
    67, 68 bits -- 2 endpoints + 5 bisection steps, exactly what a correct
    1-bit-resolution binary search over a width-35 window requires); "6
    further trials" should read "5."
    NONE OF THESE THREE ERRORS IS LOAD-BEARING. None changes any
    cap-compliance determination, any cell/trial status, or any seed value:
    even the inflated 6742.99s/4779s figures remain far under the 48000s
    overall budget cap and the 14400s per-cell cap, and every raw per-trial
    and per-cell figure this record's own conclusions depend on
    (bisection_d512_results.json, main_grid_d512_reattempt_results.json) is
    correct and independently reproduced by both reviews. THESE ARE
    MISCOMBINATIONS OF REAL, CORRECTLY-RECORDED RAW FIGURES, NOT INVENTED
    ONES, AND NOTHING FALSE WAS COMMITTED AS A LEDGER CLAIM -- run_manifest.yaml
    and writeup.md are immutable producer artifacts and are NOT edited by
    this record or by this Coordinator; a correction, if ever warranted,
    would be a superseding record, not an in-place edit. Recorded here
    plainly so a future reader citing "the task took ~4779s" or "~6743s" (or
    "8 bisection trials") is pointed at figures that do not exist in the
    raw, hash-verified data: the correct totals are ~4080s
    (internal-JSON-measured) to 4179s (outer-timestamp-measured), and 7
    bisection trials, not 8.

  # ==================================================================
  # BUDGET AND CAP COMPLIANCE
  # ==================================================================
  budget_and_cap_compliance: >-
    Both reviews independently confirm BISECTION_D512_BUDGET_SECONDS=3600s
    (bisection used 2662.76s, not exhausted) and
    PER_BASIS_FEASIBILITY_CAP_V3=14400s (largest cell cost: 631.74s, 4.4% of
    the cap) were applied exactly as specified, neither loosened nor
    tightened. No cell was skipped for budget reasons; no cell hit its cap
    (all 3 failed via a hard ReductionError exception, not a timeout). The
    Red Team's own COST-3 makes the important, narrowing observation that
    because every failure this batch was a hard exception rather than a
    timeout, PER_BASIS_FEASIBILITY_CAP_V3's own sizing was never actually
    tested as binding in either direction this batch: "adequate" here should
    be read as "adequate-and-untested-as-binding," not
    "adequate-and-validated-as-binding" -- a future cell that gets past the
    initial hard-exception boundary could behave very differently under the
    same cap.

  observations:
  - "Phase (a): a genuine 1-bit-resolution bisection at (d=512, beta=40),
    isolated-LLL-step level, determined 69 bits as the minimum adequate
    precision AT THAT EXACT INSTANCE (68 bits ERROR, 69 bits COMPLETED; 7
    trials total -- 2 endpoints + 5 bisection steps -- 2662.76s of a 3600s
    budget, not exhausted)."
  - "Phase (b): 0/3 d=512 main-grid cells completed a full BKZ tour at 69
    bits. (d=512,beta=40): ERROR, deeper site (past initial lll_obj(),
    inside svp_preprocessing), 631.74s. (d=512,beta=55): ERROR, shallow site
    (bkz.py:123 self.lll_obj(), before any tour), 389.37s. (d=512,beta=70):
    ERROR, same shallow site, 396.35s. All well inside the 14400s cap."
  - "OBJ-1 (Red Team, critical): the beta=40-bisected 69 bits does NOT
    generalize within d=512 -- live, executed control at (d=512,beta=55) and
    (d=512,beta=70), both seed-identical to the producer's own reported
    values, both ERROR at 69 bits and COMPLETED at 100 bits at the isolated-
    step level, the exact operation both cells' own full-tour failures
    already report."
  - "OBJ-2 (Red Team, high): (d=512,beta=40)'s own deeper-but-still-failing
    result is a fourth recurrence of KN-FIND-f54a82's own already-promoted
    isolated-step-vs-full-tour pattern."
  - "OBJ-3 (Red Team, high): the forward-looking cost model implicitly
    assumed one bisection would calibrate all three cells; the true cost of
    properly calibrating all three is at least 3 bisections + 3 reattempts."
  - "Two arithmetic errors independently confirmed by both reviews (double-
    counted 6742.99s total; digit-transposed ~4779s vs. correct 4179s), plus
    a third, minor one (Red Team only: '8 trials' vs. actual 7) -- all
    non-load-bearing, disclosed and not corrected in place."

  inference: >-
    No statistical inference is drawn in this record. The termination
    branch is read directly off PREREG-8's own frozen precedence against
    the measured/observed cell outcomes. The cell-by-cell precision status
    is a direct comparison of the producer's own reported precision
    determination against the Red Team's own independently, live-executed
    generality control -- not a statistical estimate.

  strength: replicated
  strength_basis: >-
    `replicated` is claimed for the admissible-now core listed above ONLY:
    the bisection result and both halves of its endpoint reproduction (live
    spot-checked exact by the Validator); the 0/3 main-grid outcome and each
