  strength_basis: >-
    The run is valid (J1-J3 hold), but its decision-bearing outcome does not
    discriminate between the explanations at issue, for three reasons. First,
    the single interval exclusion that produces OUT-SLOPE-INTERVAL is within
    the Monte Carlo error of its own endpoint. Second, it is reversed by row
    order and by about 35% of bootstrap seeds. Third, it comes from a
    procedure that fails the round's proves-too-much control. The data
    resolve the m = 6 slope no more finely than about +-0.03 (method
    ceiling), so they neither refute nor confirm 1/12. Evidence-hierarchy
