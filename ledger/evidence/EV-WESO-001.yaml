  observations:
  - 'Independent reviewer (TASK-20260724-P13-REV): core mathematics SOUND conditional on Heuristic
    1; Theorem 1.1 asymptotics independently recomputed and confirmed; Lemma 3.2/3.4/3.5 SOUND.
    Defects: Algorithm 1 never seeds the list (GAP-1, confirmed against Panny''s implementation);
    Corollary 1.2 cites a nonexistent Proposition 8.5 of [35] and the isogeny direction is
    GRH-conditional as published (GAP-2); Section 4.1 UNVERIFIABLE-AS-WRITTEN; Theorem 1.5/[4]
    flagged load-bearing.'
  - 'Scoped repair review (TASK-20260724-P13-REV-R1): tail verified SOUND; arXiv:2607.14624
    fetched and confirmed to state exactly the used (p/2)^{1/3} bound (GAP-7 closed); the
    [35] citation defect double-confirmed (Proposition 8.4 is the needed direction and is
    GRH-conditional; no Proposition 8.5 exists); both smoothest-sample consistency checks
    of Section 4.2 recompute correctly; the Section 4.1 ''lower bound'' overestimates the
    provable bound by ~2.2 bits; van Oorschot-Wiener [43] verified.'
  - 'Producer analysis (TASK-20260724-P13-HEUR): Heuristic 1 has a provable first moment via
    Eichler/Brandt trace formulas and reduces to near-disjointness of rare events; no fluctuation
    channel found that can break the 1/3 exponent; naive refutation routes (forced small-prime
    divisibility, parity, sum-of-two-squares bias) provably absent or refuted; one constant-factor
    signed bias against smoothness identified (ramified small primes demote L(1,chi) Euler
    factors); the paper''s Figures 1-2 cannot distinguish competing size models.'
  - 'Executor run (EXP-WESOVOW-001, RUN-WESOVOW-001): the paper''s five concrete (time, memory)
    pairs reproduce only within 0.05-3.51 bits (partial control failure, honestly disclosed);
    with zero hidden overhead the vOW middle regime beats Delfs-Galbraith at every tested
    budget w = 2^30..2^80 for all five sizes; overhead scenario 2^{c*sqrt(log2 p)} shifts
    the crossover by 2c*sqrt(log2 p) bits.'
  - 'Validator (TASK-20260724-P13-VAL): run receipt VALID-WITH-OBSERVATIONS; all 7 hash bindings
    match; independent rerun numerically identical; 67/67 metric recomputations pass including
    an independent Dickman-rho quadrature; record-keeping observations only, none affecting
    admissibility.'
  - 'Red team (TASK-20260724-P13-RT): interpretation falsified as stated — Figures 1-2 test
    only the body of the distribution while Heuristic 1 is a tail statement at u ~ 13 with
    zero sample resolution; the c = 0 scenario is the most attack-favorable corner, not a
    neutral default, and a defensible calibration c ~ 1.8 shrinks the NIST-I margin to ~2.3
    bits (inside the irreproducibility band); NIST-III/V margins survive all tested scenarios;
    end-to-end baseline named as parallel Delfs-Galbraith with constant-factor improvements
    at equal hardware.'
  - 'INCIDENT-20260724-P13-01 (infrastructure, not evidence): a concurrent session switched
    the shared worktree across branches mid-pipeline; the original source snapshot commit
    ef345b5 became unreachable from HEAD and the frozen file vanished from the working tree.
    Content restored byte-identical (SHA-256 ca34a0f7...a9cf unchanged) and rebound on the
    current branch; a scoped repair task (REV-R1) covered the review scope affected by the
    outage. Producer artifacts were uncommitted-but-present and were snapshot-committed after
    the incident.'
  inference: The conditional theorem is sound at review level; the practical-security question
    for NIST-I parameters is undecidable from the current record because the margin is smaller
    than the cost model's irreproducibility band; NIST-III/V retain comfortable margins under
    every tested overhead scenario. The deciding control is an empirical calibration of the
    per-entry table construction cost (red-team NC-2).
  boundaries:
  - No cryptographic-size computation was performed; this is a review-and-model assessment
    of an external claim.
  - The conditional-validity position is exactly conditional on Heuristic 1 and on the verified
    external bound arXiv:2607.14624.
  - The executor's cost numbers are observations about an explicit scenario model, not measurements
    of a real attack.
  - The red team's c ~ 1.8 calibration is itself an estimate; neither it nor c = 0 is a measurement.
  - Nothing here bears on CSIDH/(qt-)Pegasis or torsion-based schemes.
  proof_status_conditionality: conditional_on_heuristic
  proof_status_note: 'Held `conditional_on_heuristic`, which is not one of the four proof
    statuses. docs/claims-and-verification.md section ''Heuristic-conditional claims'' is
    explicit that a conditional result IS a derivation record whose statement begins ''Assuming
    Heuristic N, ...'' -- the conditionality lives in the statement, not in proof_status.
    This record already enumerates Heuristic 1, so `derivation` is the status that doctrine
    assigns it. The original marker is preserved verbatim in proof_status_conditionality so
    nothing is lost, and the claim is NOT thereby discharged: per the same section, only an
    unconditional proof of the heuristic or a stronger unconditional result removes the qualifier,
    and experimental validation at any scale does not. Recorded under CORR-20260802-012.'
