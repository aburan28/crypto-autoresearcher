    correction. The negative is robust: the lower envelope of NAGAO-1994's
    minimal-model naive height is 109.5051651866501 at t = +-62, measured on
    three independent implementations over 141221 fibres spanning the entire
    crossover region and every denominator up to 60, with the envelope RISING on
    both sides of an interior minimum and no cell taken on any of the board's
    four metrics at any threshold. An empty admissible box, measured and scoped,
    is a real result. The correction is that this surface's Shioda-Tate ceiling
    is 15, not the 18/17 the campaign has been carrying, so Axis A1's headroom
    above the cited geometric rank 13 is 2.
    The most reusable thing here is neither of those. It is the OBSTRUCTION,
    which is now derived rather than attributed: h(E_t) = 12d log|t| + O(1) with
    d >= ceil((r+2)/10) forced by Shioda-Tate, hence slope >= 1.2(r+2). Buying
    generic rank buys a steeper height law, so the small-parameter lever
    exhausts inside a bounded region, and inside that region the binding
    quantity is the family's own O(1) constant. THAT REFRAMES A2 RATHER THAN
    CLOSING IT: among surfaces of the same d the constant varies enormously --
    Mestre's 1982 rank-12 curve sits 30.18 below Nagao's best fibre -- so
    "search over families at fixed d, minimising the constant" is a live, untried
    and strictly better-posed version of the axis than "specialise at small t".
    Measuring that constant costs about two seconds and 1e5 fibres per family,
    and it would have rejected NAGAO-1994 before this batch was dispatched.
    What must NOT be inferred: that the specialisation axis is structurally
    closed. Two construction-class curves already on the frozen board sit +9.99
    and +11.80 from two of the three targets. This scopes A FAMILY AND A LEVER,
    not a method class.

