  obstruction:
    statement: >-
      A CLAIM ABOUT THE OBJECT, NOT ABOUT THE ATTEMPT. For an elliptic surface of
      degree d over P^1 the minimal Weierstrass model has deg a4 <= 4d and
      deg a6 <= 6d, so the fibre's naive height satisfies
      h(E_t) = 12d log|t| + O(1); Shioda-Tate caps generic Mordell-Weil rank at
      10d - 2, so a family of generic rank r has d >= ceil((r+2)/10) and
      therefore an asymptotic height slope of at least 1.2(r+2). BUYING GENERIC
      RANK BUYS A STEEPER HEIGHT LAW. The small-parameter lever on which
      GOAL-ECQ-002's axis A2 rests is consequently confined to a bounded region
      of small-Weil-height parameters, and inside that region the fibre height is
      set by the family's own O(1) constant rather than by the parameter. For
      the transcribed NAGAO-1994 (d = 2, slope 24) that constant puts the lower
      envelope at 109.5051651866501, which is 24.32 to 40.17 above the three
      pre-declared cells.
    quantity: >-
      (i) lower envelope of the minimal-model naive height over the parameter
      space, in natural-log units; (ii) the asymptotic slope of that height in
      log|t|; (iii) the crossover parameter separating the flat and asymptotic
      arms.
    value: >-
      (i) 109.5051651866501 at t = +-62, second lowest 109.531002, over 141221
      fibres on an independent code path and 7593 on a second; agreement between
      three implementations to 1e-9 / 1e-10; the argmin model's minimality proved
      exhaustively (no p < 20000 with p^4|c4 and p^6|c6, exhaustive since
      |c4|^(1/4) = 9186). No error bars: these are exact integer computations
      followed by one logarithm, so the only uncertainty is the agreement
      tolerance quoted.
      (ii) 24.14 measured over t = 1000..20000 (R^2 = 0.891, n = 77) against
      12d = 24 predicted at d = 2; the flat arm has slope 0.062 with
      R^2 = 0.00005 (n = 40).
      (iii) |t| ~ 89, with the observed argmin at |t| = 62.
    measured_by:
    - RUN-ECQNAG-f88f54-004
    - RUN-ECQNAG-f88f54-005
    - RUN-ECQNAG-f88f54-006
    - RUN-ECQNAG-f88f54-007
    - TASK-20260823-72505a          # validator; own minimalisation, 1137 + 7593; NO RUN RECORD
    - TASK-20260823-eaf799          # red team; RT-C-A/B/C, 141221 fibres; NO RUN RECORD
    measured_by_note: >-
      The two largest figures come from reviewer tasks that produced no run
      records. Declared, not glossed: the envelope is replicated by independent
      implementation, not certified by archived enumeration.
    scope: >-
      The transcribed NAGAO-1994 quartic and its Jacobian Weierstrass model over
      Q(t); parameter regions as listed in B-10; naive height under the
      BATCH-f2341e convention; PARI 2.15.4 / cypari 2.5.6 / Python 3.11.15. The
      12d slope law and the 1.2(r+2) bound are claimed for minimal Weierstrass
      models of elliptic surfaces over P^1 generally, with the O(1) term
      UNMEASURED outside this family. The 109.505 figure is claimed for this
      surface and nowhere else.
    resource_check:
      examined: true
      reading: >-
        THE SAME MEASUREMENT IS AN ASSET UNDER A DIFFERENT THEORY, and the
        reversal is the batch's most useful output. If the binding quantity is
        the O(1) constant of a minimal-degree-d family rather than the
        parameter, then families become RANKABLE BY A CHEAP MEASUREMENT: compute
        the lower envelope of the minimal-model naive height over the crossover
        band, about two seconds and 1e5 fibres per family, and rank candidates by
        that envelope instead of by generic rank. Among surfaces of the same d
        the constant varies enormously -- Mestre's 1982 rank-12 curve is 30.18
        below Nagao's best fibre -- so "search over families at fixed d,
        minimising the constant" is a live, untried and strictly better-posed
        version of axis A2 than "specialise at small t". Two smaller resources
