  - id: OBS-2
    what: >-
      NO CELL ON ANY OF THE BOARD'S FOUR SCORED METRICS, AND THE CHECK IS NOW
      EXHAUSTIVE OVER THRESHOLDS. The Coordinator's own post-hoc table compared
