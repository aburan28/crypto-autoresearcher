  observations:

  - id: OBS-1
    what: >-
      NO RECORD CELL WAS TAKEN. NOT ONE, ON ANY METRIC, AT ANY RANK THRESHOLD.
      The measured minimum minimal-model naive height of the transcribed
      NAGAO-1994 family is 109.5051651866501, attained at t = +-62, against
