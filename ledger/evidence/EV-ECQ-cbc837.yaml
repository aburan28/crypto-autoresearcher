  proof_status: derivation
  proof_status_detail: >-
    STATED PER CLAIM RATHER THAN AVERAGED; the record-level label is the
    strongest checkable basis supporting the DIRECTION (contradicts), in the
    order docs/claims-and-verification.md sets.
    (i) NO COUNTEREXAMPLE CERTIFICATE IS AVAILABLE FOR THE CLAIM ACTUALLY MADE,
    and saying so is the honest first step. H-ECQ-a609f8's claim is EXISTENTIAL
    ("some small t gives a curve under the cell"); a single instance cannot
    refute an existential claim, so no exhibited fibre -- not even the proved
    minimal model at t = 62 -- is a counterexample certificate here. What that
    instance certifies is the VALUE of the envelope at its argmin, which is a
    different and weaker thing.
    (ii) THE DERIVATION NOTE IS AVAILABLE AND IS WHAT THIS LABEL RESTS ON. Two
    independent derivations, both checkable step by step from committed
    statements: the red team's slope bound -- for an elliptic surface of degree
    d over P^1 the minimal Weierstrass model has deg a4 <= 4d and deg a6 <= 6d,
    so h(E_t) = log max(|c4|^3, c6^2) = 12d log|t| + O(1); here
    deg(a4, a6) = (8, 12) gives d = 2 and 12d = 24 against a MEASURED 24.14, and
    Shioda-Tate's cap rank <= 10d - 2 forces d >= ceil((r+2)/10) and hence slope
    >= 1.2(r+2) for generic rank r -- and the validator's fibre-configuration
    computation giving this surface's own Shioda-Tate ceiling as 15. Both are
    arguments about the OBJECT and neither needs any free-text program
    attribution. They establish that the small-parameter lever exhausts inside a
    bounded region and that inside it the height is set by the family's own O(1)
    constant. THEY DO NOT ESTABLISH THAT NO t WORKS, and this record does not
    read them as if they did.
    (iii) THE BOUNDED-SEARCH COMPONENT IS EMPIRICAL AND IS REPLICATED, which is
    what lifts the composite above `empirical_only`: 141221 fibres on one
    independent path, 7593 on a second, 1137 re-derived on the same second path,
    569 distinct curves on the producer's, zero below any target on any of them.
    An empirical-only refutation on a single unreplicated run would have
    required `weaken` plus replication; this is neither single nor unreplicated,
    and the derivation in (ii) was produced before the decision that relies on
    it.
