  - id: OBS-18
    what: >-
      t = 0 WAS GUARANTEED IN ADVANCE TO DROP, AND IT SHOULD NEVER HAVE BEEN
      USED TO TEST THE RANK PRIOR. a1 = a3 = 0 and a4, a6 contain only even
      powers of t, so sigma: t -> -t is an involution of the surface and
      MW tensor Q = V+ (+) V-. A section in V- has x even and y ODD in t, so at
      t = 0 its y-coordinate vanishes, it specialises into E_0[2], and it
      contributes NOTHING to rank E_0(Q). The entire anti-invariant eigenspace
      dies at t = 0. Measured certified rank 6 at t = 0 against a generic ~12 is
      exactly the 6 + 6 split that shape predicts. This is a property of the
      family's SHAPE, not a fact about whether it is Nagao's. t = 2 giving 11 is
      an ordinary Silverman specialisation exception -- finitely many are
      allowed and one parameter short by one is not a pattern.
    consequence_for_the_recorded_prior: >-
      P3 ("certified rank >= 12 at small t") is CONTRADICTED ON ITS FACE -- at
      small t the score is 1 for (t = 1, rank 14) and 2 against (t = 0 rank 6,
      t = 2 rank 11), and t = 62 is not small t -- BUT ITS if_contradicted
      ACTION MUST NOT BE TAKEN. That action reads a sub-12 rank as evidence the
      coefficients are not Nagao's and withdraws the family. The eigenspace
      argument and the null-controlled -A_p measurement of OBS-10 both say the
      inference is wrong. Source retrieval remains owed on the strength of
      OBS-7, not of P3.

