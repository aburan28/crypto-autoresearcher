      RESCALED point ((t+703)/15, 1248*N(t)/75) does. The red team (RT-CORR-O2)
      inverted the diagnosis and made it sharper: every one of the thirteen
      distinct integer coefficients of the transcribed quartic is EXACTLY
      divisible by 1557504 (14017536/S = 9; 28035072/S = 18; 4205260800/S = 2700;
      247954636800/S = 159200; 330112972800/S = 211950; 617005209600/S = 396150;
      46063725926400/S = 29575350; 99527168931840/S = 63901710;
      1388825681338368/S = 891699592; 10445363957523456/S = 6706476489;
      443009190070886400/S = 284435346600; 6473450277365760000/S =
      4156297690000), so the transcription equals 1557504 * Q0 for an integral
      Q0 and the PUBLISHED section lies on y^2 = Q0 exactly, unmodified. The
      orchestrating session confirmed the divisibility over all 14 nonzero
      coefficients (13 distinct values); the two counts are consistent.
    what_this_overturns: >-
      IT OVERTURNS A COMMITTED CLAIM OF THIS PROGRAM'S OWN. BATCH-f2341e
      recorded the verdict "FAILS" on the retrieved (quartic, point) pair.
      DEC-20260823-51726e R1 and EV-ECQ-d9ffe6 OBS-1 called that a FALSE
      NEGATIVE and reinstated NAGAO-1994 on the strength of it; the Coordinator
