  type: empirical

  direction: contradicts
  direction_scope: >-
    CONTRADICTS H-ECQ-a609f8's CENTRAL CLAIM, WITHIN THE TESTED SCOPE. The
    hypothesis states that NAGAO-1994 specialised at small rational t and
    certified by exact descent "produces curves over Q whose minimal models are
    small enough to take at least one PRE-DECLARED cell". Its own falsification
