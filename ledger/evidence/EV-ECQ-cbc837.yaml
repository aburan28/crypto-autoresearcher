    closest_approach_anywhere: +2.571 on Faltings height. A near-miss is not a record, and +2.57 is not a near-miss.

  - id: OBS-3
    what: >-
      THE EMPTINESS IS ROBUST FAR BEYOND WHAT WAS ASKED, AND THE ENVELOPE RISES
      RATHER THAN MERELY FLATTENING. The red team attacked the cheapest
      available route to overturning an empty box -- the region 60 < |t| at
      denominator > 1, which is exactly where the measured minimum sits and
      which NEITHER producer probe covered (the declared box stops at |t| <= 60,
      the wide probe is denominator 1 only) -- and searched 141221 fibres:
      integers 1..20000, all rationals 30 <= t <= 140 of denominator <= 60, and
      separately all rationals 40 <= t <= 200 of denominator <= 12 (7361).
      GLOBAL MINIMUM STILL EXACTLY 109.505165 AT t = +-62; second lowest
      109.531002; nothing below. Denominator monotonically HURTS: per-denominator
      minima 109.51, 117.79, 135.84, 134.43, 148.10, 144.16, 156.18, 151.07,
      162.21, 156.42, 167.03, 160.80. The validator ran an independent
      7593-parameter sweep on its own code path (integers 0 <= t <= 5000 plus
      rationals |num| <= 200, den <= 12) and found 0 below any target, with band
      minima 111.217 / 109.505 / 117.795 / 174.134 over H(t) in [1,10), [10,100),
      [100,1000), [1000,5000) -- an INTERIOR minimum near H(t) = 62 with the
      envelope rising in both directions.
    decay_control: >-
      The red team named search volume as the parameter that should destroy an
      empty box and checked what the measurement does as it increases: 109.531
      at 569 distinct fibres, 109.505 at 141221, no further descent. That is a
      controlled null, not a quantity failing to decay. The empty box is not an
      artifact tell.
    volume_multiplier: 248x the producer's 569 distinct curves.

  - id: OBS-4
    what: >-
      THE PRODUCER'S HEIGHT LAW IS THE WRONG FUNCTIONAL FORM, AND THE REPORTED b
      IS AN ARTIFACT OF WHERE THE BOX WAS PLACED. The reported single-line fit
      over the declared box is naive_height = 135.975835 + 0.387490 log H(t),
      R^2 = 0.00041752, n = 457 -- reproduced EXACTLY by the validator's own
      least squares. The validator adds that R^2 = 0.000418 means Pearson
      r = 0.0204, t = 0.44, p ~ 0.66: the slope is statistically
      indistinguishable from zero, so the printed "parameter budget"
      (h_target - a)/b, giving max log H = -171.97 / -155.40 / -131.06 and
      max H = 2.06e-75, is a division by a quantity consistent with 0 and
      carries no information. The red team supplies the reason: the true law is
      PIECEWISE and the producer fitted one line across a V whose vertex sits at
      the edge of its own box. Small-|t| arm h = 119.42 + 0.062 log|t|,
      R^2 = 0.00005, n = 40; large-|t| arm h = 11.32 + 24.14 log|t|,
      R^2 = 0.891, n = 77 over t = 1000..20000; crossover |t| ~ 89; observed
      argmin |t| = 62.
    why_it_matters_even_though_the_conclusion_does_not_use_it: >-
      The producer says explicitly that the fit is not the deciding number and
      is right. But H-ECQ-a609f8's MECHANISM is the sentence "the height grows
      only LOGARITHMICALLY in the parameter, so the binding constraint is the
      family's own (a, b)", and it was carried forward from BATCH-f2341e as
      surviving unfalsified. It rests on the (a, b) pair, and the pair as
      reported is meaningless. The mechanism is replaced by OBS-5's derived law,
      which is stronger.

  - id: OBS-5
    what: >-
      THE DERIVED OBSTRUCTION, WHICH REPLACES A HAND-WAVING MECHANISM WITH A
      MEASURED AND DERIVED ONE. For an elliptic surface of degree d over P^1 a
      minimal Weierstrass model has deg a4 <= 4d and deg a6 <= 6d, so
      h(E_t) = 12d log|t| + O(1). Here deg(a4, a6) = (8, 12), d = 2, 12d = 24 --
      against a measured asymptotic slope of 24.14. Shioda-Tate caps generic
      rank at 10d - 2, so buying generic rank r forces d >= ceil((r+2)/10) and
      hence SLOPE >= 1.2(r + 2). Consequences, stated as claims about the
      object: buying generic rank r >= 9 at least doubles the growth rate of
      fibre height in the Weil height of the parameter; the usable fibres are
      therefore confined to a bounded region of small-height parameters, of
      which there are ~e^{2H} up to height H; and inside that region the height
      is dominated by the family's own O(1) constant, not by the parameter.
      That is precisely what 141221 fibres measured.
    status_of_the_derivation: >-
      NOT A HEURISTIC. It follows from the degree bounds for a minimal
      Weierstrass model over P^1 plus the Shioda-Tate cap. Its O(1) term is
      UNMEASURED in general and is exactly the quantity the next action makes
      measurable.

  - id: OBS-6
    what: >-
      THE SHIODA-TATE CEILING OF THIS SURFACE IS 15, NOT THE 18 / 17 CARRIED IN
      THE CAMPAIGN'S RECORDS. Validator finding F1, computed from the
      transcribed model and independently reproduced by the orchestrating
      session: deg Delta = 20 (not 24 -- the degree-24 terms cancel exactly) and
      Delta is SQUAREFREE, giving 20 finite fibres all of type I_1;
      v_inf(Delta) = 24 - 20 = 4 with v_inf(a4) = 0, so the fibre at t = infinity
      is multiplicative of type I_4; Euler number 20*1 + 4 = 24, exactly what a
      K3 requires. Shioda-Tate rho = 2 + sum_v (m_v - 1) + rank MW with
      sum_v (m_v - 1) = 3 gives a trivial lattice of rank 5, and rho <= h^{1,1}
      = 20 gives rank MW(E/Qbar(t)) <= 15, hence rank E(Q(t)) <= 15 as well.
    where_the_18_17_came_from: >-
      They are the GENERIC elliptic-K3 bound 10d - 2 with all fibres
      irreducible. They are recorded in
      BATCH-f2341e/tasks/TASK-20260823-d1cb76/candidate_families.json, were
      restated in DEC-20260823-51726e R4/R5 as a correction of a producer guard
      that was failing open by 20, and were carried into this batch's task card
      by the Coordinator. THE PRODUCER OF THIS BATCH DID NOT RESTATE THEM; this
      finding attaches to the inherited record and to the Coordinator's use of
      it, not to TASK-20260823-f88f54.
    consequence: >-
      No contradiction is created -- Scholten's geometric rank 13 needs rho = 18
      <= 20, so the computation is a non-trivial consistency check on the
      transcription that PASSES. What changes is the headroom: Axis A1's
      premise is "replace the rank-8 base with something bigger", and this
      base's hard cap is 15 geometric against a cited rank of 13. HEADROOM IS 2,
      NOT 4 OR 5. Any plan that budgets against 17 budgets against a number this
      object does not have.

  - id: OBS-7
    what: >-
      THE TRANSCRIBED QUARTIC IS PROVABLY NOT NAGAO'S PUBLISHED EQUATION: IT IS
      1557504 = 1248^2 TIMES IT. Both reviewers found this independently and
