    targets, and the emptiness survives a search 248 times larger than the one
    that produced it. THE CONTRADICTION DOES NOT ADOPT CLAUSE 1'S OWN
    QUANTIFIER. Clause 1 reads an empty box as "this family cannot take those
    cells at any parameter"; no statement here is quantified over all t in Q,
    and no argument bounding the fibre height below over the whole parameter
    space was attempted by anyone. See boundaries B-2.
    IT ALSO CONTRADICTS THE COORDINATOR'S POST-HOC METHOD-CLASS EXPLANATION of
    the same null result -- see OBS-11 and OBS-12 -- and that contradiction is
    on a retrieved primary source, not on an internal measurement.
    IT DOES NOT TOUCH C2, which was met by DEC-20260823-51726e and is judged
    separately; OBS-5 adds a qualification to C2's citation, not a reversal.

