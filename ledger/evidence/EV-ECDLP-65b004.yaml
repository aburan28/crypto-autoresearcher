summary: >
  Full cell grid for EXP-SEMAEV-f48dd1 (x-oracle Semaev yield discrimination)
  with corrected yield metric. All 120 arm-runs (40 configs × 3 arms) completed
  successfully. Corrected Δ = 0.01202 (95% CI: [0.00593, 0.01811], t(7)=4.665,
  p=0.0023) is statistically significant. However, Y_A = Y_B exactly, indicating
  the x-oracle provides cost reduction via MITM filtering, not yield improvement
  over exhaustive search.

