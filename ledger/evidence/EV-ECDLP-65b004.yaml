        t_statistic: 11.003
        p_value: 1.60e-13
        ci_95: [0.00980971, 0.01422959]
        note: "Invalid due to pseudo-replication"
    
      corrected_n8:
        t_statistic: 4.665
        p_value: 0.0023
        ci_95: [0.00593, 0.01811]
        degrees_of_freedom: 7
        note: "Valid statistic using group-level means"

  interpretation:
    primary_finding: >
      The x-oracle MITM (Arm B) finds exactly the same relations as exhaustive search
      (Arm A), but with fewer field operations. The yield improvement Δ = 0.012 is
      relative to random predictor (Arm C), not relative to exhaustive search.
    
    hypothesis_implications:
      H_XOR_YIELD: >
        NOT SUPPORTED in original formulation. The x-oracle does not improve yield
        (relations per enumeration space) over exhaustive search. It provides cost
        reduction via MITM filtering (fewer field operations to find the same relations).
      
    red_team_concerns:
      - "The experiment tests 'oracle vs random noise' not 'oracle vs exhaustive search'"
      - "Y_A = Y_B exactly, so the correct comparison shows zero yield advantage"
      - "Δ = 0.012 is a metric artifact, not a signal of oracle efficiency"
      - "No cost model provided; 'speedup' is undefined without total work measurement"
      - "Toy-scale parameters have no clear path to crypto-scale extrapolation"

