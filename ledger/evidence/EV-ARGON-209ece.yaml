evidence:
  id: EV-ARGON-209ece
  hypothesis_id: null
  hypothesis_id_note: >-
    No ledger/hypotheses/ record exists yet for this proposal by design;
    TASK-20260809-4e04eb was scoped as a PROPOSE-only idea-generator task, not
    a /design-experiment step. This evidence record is about the proposal
    artifact and its review, not about a tested hypothesis.
  experiment_ids: []
  run_ids: []
  type: proposal_review
  direction: mixed
  direction_note: >-
    Not support/weaken of any tested claim (nothing was tested; runs_authorized: 0
    throughout this batch). "mixed" here means: the proposal's own content held
    up under independent challenge (supports admissibility), while its DEDUP
    FIRST duty did not (weakens readiness for promotion as-is).
  strength: preliminary
  claim_tier: proposal
  certificate_refs: []
  proof_status: not_applicable
  proof_refs:
    - coordination/goals/GOAL-ARGON-001/batches/BATCH-09d69e/tasks/TASK-20260809-4e04eb/proposal.md
    - coordination/goals/GOAL-ARGON-001/batches/BATCH-09d69e/tasks/TASK-20260809-4e04eb/receipt.yaml
    - coordination/goals/GOAL-ARGON-001/batches/BATCH-09d69e/archives/TASK-20260809-862322/snapshot-receipt.json
    - coordination/goals/GOAL-ARGON-001/batches/BATCH-09d69e/reviews/TASK-20260809-28c68e/validation_report.yaml
    - coordination/goals/GOAL-ARGON-001/batches/BATCH-09d69e/reviews/TASK-20260809-a0f79c/red_team_report.md

  observations:
    - >-
      Producer (TASK-20260809-4e04eb, idea-generator) proposed a falsifiable,
      non-vacuous hypothesis: Argon2's per-lane memory-access DAG has
      materially weaker depth-robustness (rho = |S*_real|/|S*_unif| <= 0.5 at
      every tested RFC-recommended (t,q) pair) than a window-matched
      uniform-reference null, IF the within-window reference-offset selection
      is recency-biased (C6, explicitly named as the load-bearing, tested-not-
      assumed premise). A separate, cheaper KS-test precondition on C6 itself
      is designed to run first.
    - >-
      RFC 9106 could not be obtained by the producer via WebFetch/WebSearch
      (identical backend-model infra error across 6 route attempts) --
      disclosed honestly, not worked around by recalling the spec from memory.
      Every algorithm-level premise (C1-C7) was labeled RECALLED, UNVERIFIED.
    - >-
      Independent Validator (TASK-20260809-28c68e) verified the snapshot
      commit's hash/parent integrity (PASS), independently re-derived that the
      stated mechanism/prediction/falsification criterion are explicit and
      computable (PASS), confirmed no real credential data and no smuggled
      security verdict/recommendation (PASS both), and confirmed the flagged
      factual error in sibling proposal IDEA-20260809-a915ea's dominated_by
      field is real (PASS). Critically, the Validator independently obtained
      RFC 9106 via raw HTTP fetch (curl, not WebFetch/WebSearch) and spot-
      checked all seven RECALLED claims (C1-C7) against the actual primary
      text: ALL SEVEN CONFIRMED ACCURATE at the confidence level each was
      claimed, including the medium-low-confidence C6 (directionally
      confirmed; the producer's recalled formula had the right shape but an
      imprecise exponent, which the producer correctly declined to assert as
      fact). Overall verdict: passed (admissibility) / pass_with_qualifications
      (two minor defects noted, F-1 and F-3 below).
    - >-
      Independent Red Team (TASK-20260809-a0f79c) found the falsifiability
      design genuinely non-vacuous (no escape hatch in the rho middle zone),
      confirmed no scope creep beyond one title-vs-body framing defect, and
      independently corroborated the RFC 9106 access failure (their own
      WebFetch/WebSearch attempts failed identically; also confirmed no local
      downloads/ corpus exists that the producer could have missed). The
      Red Team's central finding: the producer's "DEDUP FIRST" duty, marked
      satisfied: true in its own receipt, is factually incomplete. Nine
      proposals exist under RQ-ARGON-141710 (`grep -l "RQ-ARGON-141710"
      ledger/proposals/*.yaml`), not the five the producer found -- all nine
      pre-date this batch's opening (committed in 0f4698ebd, a verified
      ancestor of the goal-activation commit dce4cf061). The producer's dedup
      searched for the literal string "Argon2" in proposal bodies rather than
      joining on question_id, missing IDEA-20260809-ac5947 (the direct
      downstream tradeoff-attack proposal this graph work exists to feed,
      already built on a915ea's object), IDEA-20260809-bcf891 (a stronger,
      already-designed calibration control against independently-known
      depth-robust and known-shallow graph families -- explicitly named by
      bcf891 itself as "a precondition for a915ea's numbers being usable"),
      and IDEA-20260809-bf5139/c13b8b (not characterized in detail by either
      review; existence only confirmed).
    - >-
      Both independent reviews, working from different tool access (validator
      had Bash/curl; red-team's WebFetch/WebSearch failed identically to the
      producer's), corroborate that the RFC 9106 WebFetch/WebSearch failure is
      a genuine session/tool-level infrastructure defect (a stale/unavailable
      backend model id), not a producer excuse, and that raw HTTP fetch is a
      working alternate route in this environment.
    - >-
      Both reviews independently flagged the same minor process defect (F-1):
      the Coordinator's own snapshot-archive commit (TASK-20260809-862322,
      commit da073ca9d) touched dispatch_queue.json (two task-state flips)
      outside that task's declared write_scope/artifact_paths, alongside the
      two properly-declared artifacts. Self-disclosed in the commit message at
      the time; content-neutral (does not affect the hash-verified proposal
      content); recorded here per both reviewers' recommendation rather than
      silently absorbed.

  inference: >-
    The proposal's CONTENT is admissible and independently corroborated on
    every dimension checked (integrity, internal consistency, honest
    RFC-access disclosure, RECALLED-claim accuracy against the real primary
    text, no scope creep, no fabricated data). It is NOT yet reconcilable with
    the existing sibling proposal set as filed: reconciliation against
    IDEA-20260809-ac5947 and IDEA-20260809-bcf891 in particular is a
    precondition for treating this as ready input to a /design-experiment
    step, per both independent reviewers' explicit recommendation. This is a
    resource-allocation and record-consolidation finding, not a finding that
    the hypothesis itself is wrong, unfalsifiable, or out of scope.

  boundaries:
    - No experiment ran; no measurement of rho, or of anything else, exists.
    - >-
      RFC 9106's C1-C7 spot-check (via the Validator's independent fetch) is a
      strong corroboration but is not a formal KN-LIT citation filing; RFC
      9106 is not yet a filed primary source in this program's knowledge
      corpus under this goal.
    - >-
      No claim about Argon2's security, any parameter set's safety, or any
      attack's cost is made or supported by this record, consistent with the
      goal's explicit prohibition.
    - >-
      This record does not adjudicate which of the reconcilable sibling
      proposals (a915ea, ac5947, this task's proposal) should be the surviving
      formalization -- that is an explicit Coordinator decision named as the
      required next action, not resolved here.

  unresolved_confounds:
    - >-
      Red Team's "null-vs-theory gap": G_unif (window-matched uniform null)
      correctly isolates the within-window selection rule, but neither the
      producer nor either reviewer could confirm whether a window-truncated
      null is the comparison the (unread) depth-robust-graph asymptotic
      literature itself makes, versus a construction with edges spanning the
      full prior history at multiple scales. Cannot be resolved until that
      literature is read.
    - >-
      The 0.5/0.8 rho thresholds are declared, not derived from any specific
      theorem's notion of "material" weakening.
    - C6's exact numeric transform remains RECALLED-imprecise (right shape, wrong exponent, self-corrected as unasserted).
    - >-
      Whether comparing against known-depth-robust/known-shallow calibration
      families (bcf891's design) changes confidence in any future rho
      measurement is untested.

  reviewed_by:
    - "validator (TASK-20260809-28c68e, independent_session: true, verdict: passed/pass_with_qualifications)"
    - "red-team (TASK-20260809-a0f79c, independent_session: true, verdict: conditional_pass_content/fail_dedup_duty)"
