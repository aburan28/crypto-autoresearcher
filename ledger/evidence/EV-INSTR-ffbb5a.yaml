  id: EV-INSTR-ffbb5a
  hypothesis_id: H-INSTR-fffbfb
  question_id: RQ-INSTR-f8faa0
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aa267f
  experiment_ids:
  - EXP-INSTR-85b102
  run_ids:
  - RUN-INSTR-85b102-gates-b
  - RUN-INSTR-85b102-poolA-c
  - RUN-INSTR-85b102-poolB-b
  - RUN-INSTR-85b102-poolC
  - RUN-INSTR-85b102-poolD
  - RUN-INSTR-85b102-scorecard-d
  type: empirical
  direction: supports
  strength: preliminary
  strength_justification: >-
    Capped at `preliminary` rather than `replicated` because the deciding
    clause for adoption (SC8: power >= 0.90 at the finest non-degenerate
    rung) was verified by this Coordinator's direct recomputation from raw
    committed data, not by a separate independent reviewing session.
    `validator-instr` independently validated C1 (the S1 gate) and C2 (size
    calibration, corrected to 17/17 non-degenerate CTRL-SIZE0 cells by
    CORR-20260807-0f5d56) at `passed_with_findings`; its dispatch scope did
    not include power. See DEC-20260809-4081cc limitations for the full
    breakdown of what is independently reviewed versus Coordinator-verified.
  claim_tier: toy
  certificate_refs:
  - >-
    certificate.kind: none, EXPLICITLY, on every run this evidence cites. No
    solve, relation, or discrete log is claimed; every check is a re-derivable
    statistic over a completely enumerated, census-certified isogeny class
    set (`class_census` agrees, 0 failures at both primes).
  proof_status: empirical_only
  proof_refs:
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-aa267f/reviews/validator-instr/validation_report.yaml
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-aa267f/execution/EXP-INSTR-85b102/execution_report.md
  - ledger/decisions/DEC-20260809-4081cc.yaml
  observations:
  - >-
    C1 (DIAGNOSIS) CONFIRMED, INDEPENDENTLY VALIDATED. The closed-form
    free-permutation null mean reproduces the committed 664x contamination
    ratio as exactly the group order plus the 2-torsion term:
    mean_c Var(z_c)/4 = 0.24938572928901642 against the committed
    0.24938572928898783 (residual 2.859e-14, tolerance 1e-9); closed-form
    free-rung null mean 1.035750008010729e-05 against the committed
    1.0357263552475702e-05 (relative residual 2.284e-05, tolerance 1e-3).
    Falsifier F1 did not fire.
  - >-
    C2 (DESIGN) CONFIRMED. The blocked permutation on class-partition-
    coarsening blocks (N-band or twist pair) is a valid conditional test with
    a closed-form null mean, `E[T_pi | B] = mean_c S^2_block(c)`, matching the
    empirical Monte-Carlo mean at every non-degenerate rung. The synthetic
    trace-independent labelling (CTRL-NULLOBJ) and the delta=0 planted-effect
    row (CTRL-SIZE0) stay inside the exact two-sided 99% Binomial(200, 0.05)
    interval [3, 19] at every non-degenerate rung of every pool: 28 of 28
    CTRL-NULLOBJ cells, 17 of 17 non-degenerate CTRL-SIZE0 cells (corrected
    count, CORR-20260807-0f5d56). Falsifier F3 did not fire at any rung.
  - >-
    C3 (UTILITY -- "THE CLAUSE THAT CAN SAY THE FIX IS WORSE THAN THE
    DISEASE") CONFIRMED. Power at 0.8 within-class standard deviations at the
    finest non-degenerate rung is 1.000 (200 of 200 replicates) at every one
    of the four pools, at both tested primes. Independently recomputed by
    this Coordinator directly from `controls.json`'s raw
    `rejections`/`replicates` pairs at the 0.8-sd planted-effect row: POOL_A
    (p=4001, R2_NBAND_w2) 200/200; POOL_B (p=4001, R3_NBAND_w3) 200/200;
    POOL_C (p=4001, R4_NBAND_w4) 200/200; POOL_D (p=6007, R3_NBAND_w3)
    200/200. Falsifier F4 (power below 0.90) did not fire anywhere.
  - >-
    THE EXPERIMENT CONTRACT'S SC8 (nuisance-budget reduction >= 10x AND power
    >= 0.90 at the finest non-degenerate rung, its own "clause that can
    return a negative") is cleared by large margins at all four pools, both
    tested primes, independently recomputed by this Coordinator from raw
    `nuisance_budget_weighted` values: POOL_A 662.16 -> 17.558 (37.7x); POOL_B
    2406.80 -> 18.463 (130.4x); POOL_C 3489.11 -> 1.0878 (3207.5x); POOL_D
    1593.16 -> 13.503 (118.0x). Had any prime failed to clear both bars at
    every pool, SC8's own text specifies the recorded conclusion would be
    "the stratified null is not better than the free one at these pools";
    that branch did not fire.
  - >-
    C4 (CONSEQUENCE, PREDICTED FALSE FOR THE CALIBRATION FUNCTIONAL ON
    PURPOSE) CONFIRMED AS PREDICTED. `order` and `full_liftable` sit at the
    resolution floor (p-hat at 9.999e-05, the floor) at every non-degenerate
    rung of every pool, because N = p+1-t is injective in the trace and no
    non-degenerate blocking removes that contrast. This is the mechanism's
    predicted failure mode for the calibration functional, observed exactly
    as predicted, not a null result for the design as a whole.
  - >-
    THE TWIST-BLOCKING CONTRADICTION OF THE PARENT PROPOSAL
    (IDEA-20260807-34754f) IS CONFIRMED, INDEPENDENTLY VALIDATED. Twist
    blocking moves the observed/null ratio by 7.20% at POOL_A against a
    pre-registered ~7% derived before any run, with p_lower pinned at the
    resolution floor at every one of the four pools and both primes --
    contradicting the parent proposal's own prediction that stratified
    p-values would rise above 0.05.
  - >-
    NEGATIVE, RECORDED WITH THE POSITIVE. No functional triggered falsifier
    F7 (a genuine between-class effect surviving the finest non-degenerate
    blocking while its matched pure-N surrogate does not) at both primes
    simultaneously. `two_torsion_x` at POOL_D approaches but does not cross
    that bar (R = 0.897 against a required < 0.25, CTRL-NSURR excess 0.911)
    and is flagged, not claimed, as an unresolved lead (DEC-20260808-3312cc
    N11).
  inference: >-
    All four of H-INSTR-fffbfb's numbered claims are supported or confirmed
    as predicted on the four declared pools at both tested primes, and none
    of the hypothesis's seven falsification conditions (F1-F7) fired on any
    operative run. The experiment contract's own adoption test (SC8) is
    cleared by margins of 3.7x to 320x on the nuisance-reduction requirement
    and exactly at ceiling on the power requirement. The campaign's free
    label-permutation null (NULL-C) is demonstrated, at this toy scale and on
    these pools, to be measuring the group order rather than isogeny
    structure, and a blocked permutation on a class-invariant coarsening is
    demonstrated to remove that contamination while retaining full power to
    detect a genuine planted effect -- the capability H-INSTR-fffbfb set out
    to test.
  boundaries:
  - >-
    Toy scale only: p in {4001, 6007}, four declared pools, the largest prime
    factor of N around 12 bits. NOTHING HERE TRANSFERS TO CRYPTOGRAPHIC SCALE
    AND NOTHING IS OFFERED. sota_delta is zero on every axis; no speedup
    against any baseline is produced or claimed.
  - >-
    This is an INSTRUMENT finding. It governs how a class-level permutation
    null may be read; it says nothing about whether the functionals measured
    are attack-relevant (RQ-ICINV-475b5e's question), does not adjudicate
    isogeny-class invariance in either direction, and does not bear on
    H-STR-002 or H-ENDO-001. GOAL-ENDO-001 pause condition P2 is not engaged.
  - >-
    Does not retire, replace, or deprecate `harness/exp_icinv.py::
    permutation_null`. The free permutation is retained at rung R0_FREE as
    the contamination diagnostic; this record demonstrates a capability, not
    an executed retirement of existing code.
  - >-
    Does not address the density-independent within-class over-dispersion of
    DEC-20260807-41c173 N8, a different, WITHIN-class object handled by
    EXP-ICINV-4d33aa, nor the non-monotonicity finding of EV-INSTR-03fdcf,
    which concerns individual functionals' own decay curves along the ladder
    -- a question this record does not depend on and is not contradicted by.
  unresolved_confounds:
  - >-
    SC8's power/nuisance-budget quantities are, by the frozen contract's own
    construction, properties of the block partition and a synthetic planted
    effect rather than of any single real functional -- a wording ambiguity
    in the experiment contract's operationalization of C3, named and adopted
    under the reading DEC-20260809-4081cc states explicitly, not resolved
    silently.
  - >-
    The power claim (C3/SC8) has not yet been checked by a separate
    independent reviewing session, only by this Coordinator directly from raw
    data. This is the reason strength is capped at `preliminary` and
    H-INSTR-fffbfb's status is `supported_scoped` rather than `supported`.
  reviewed_by: coordinator
  review_provenance: >-
    PARTIAL. `validator-instr` (coordination/goals/GOAL-ENDO-001/batches/
    BATCH-aa267f/reviews/validator-instr/validation_report.yaml,
    `passed_with_findings`) independently re-derived the S1 gate at full
    precision (C1) and the CTRL-NULLOBJ/CTRL-SIZE0 size calibration (C2),
    correcting the non-degenerate CTRL-SIZE0 count from the Executor's
    reported 16/16 to the true 17/17 (CORR-20260807-0f5d56) -- a conservative
    correction that admits no inadmissible rung and changes no verdict. It
    also independently confirmed the eleven-function zero-behavioural-change
    receipt and the pre-registered twist-blocking contradiction. Its dispatch
    scope did NOT include the power claim (C3/SC8), which this record's
    Coordinator instead independently recomputed directly from the raw
    `rejections`/`replicates` and `nuisance_budget_weighted` fields in each
    operative pool's committed `controls.json`, reproducing the execution
    report's SC8 table exactly (37.7x/130.4x/3207.5x/118.0x reduction, 200 of
    200 power at every deciding rung). This is a first-hand recomputation
    from already-committed artifacts, not a fresh adversarial reviewing
    session, and is named as such rather than presented as equivalent to the
    independent validation C1/C2 received.
