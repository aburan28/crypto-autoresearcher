evidence:
  id: EV-AES-e4c091
  hypothesis_id: null
  hypothesis_id_note: >-
    DELIBERATELY NULL. This record measures whether a probe-geometry-plus-
    counting artifact survives cipher substitution; RQ-AES-003 carries no
    hypothesis about the r=5 yoyo statistic. Naming one would manufacture a
    binding the result does not have. Admitted under the documented-null
    allowance recorded in CORR-20260802-009.
  experiment_ids: []
  run_ids: []
  task_ids:
    - TASK-20260803-a0a7b9
    - TASK-20260803-cca84d
    - TASK-20260803-1f6b64
  type: measurement
  direction: refutes_own_prior_reading
  strength: moderate
  strength_basis: >-
    MODERATE. The construction was checked line by line by an independent
    validator, who traced the injectivity-rejection and inverse-query logic in
    yoyo_sbox_v4.c and confirmed it implements the exact conditional law of a
    uniform random bijection given the four oracle queries per trial, found no
    exploitable residual structure, and ruled the cross-trial birthday bound
    (2^-56 at <=2^36 queries in 2^128) a valid, slightly conservative union
    bound. All three headline intervals and both null-object R_null readings
    were independently reproduced to the digit TWICE -- once by the Coordinator
    before archiving, once by the validator afterward, each in code written
    from scratch rather than re-running analyze.py. The instrument's
    equivalence to v3 was independently rebuilt and re-run by the Coordinator,
    reproducing a bit-exact match to BATCH-008's K-EQUIV-R5-K1-A2. What holds
    strength at moderate rather than strong: the "pooled" N1+N2 statistic
    silently double-counts overlapping trials (see OBS-B9-5) and the primary
    preregistered comparison (matched exposure) rests on a modest count (14 vs
    1); and every party -- producer, Coordinator, validator -- resolves to one
    model under standing basis 0137a051eb5828789eb267fa83c8278086578d4c, so
    NOTHING HERE COUNTS TOWARD A CLOSURE QUORUM.
  claim_tier: toy
  claim_tier_basis: >-
    One reduced-round AES-shaped SPN at r=5 and r=10, C1 convention, one key,
    one probe geometry (amask=1, smask=1), trials from 2^30 to 2^33 on one
    machine. No crypto-scale, medium-scale, affected-scheme or asymptotic claim
    is made or implied, and no comparison to published cryptanalysis is made in
    either direction (RQ-AES-003 R3).
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []

  observations:
    - id: OBS-B9-1
      statement: >-
        THE CAMPAIGN'S OWN ABSENCE CLAIM -- THAT NO SECTION 3 NULL OBJECT HAD
        EVER BEEN RUN FOR THE r=5 STATISTIC -- WAS TESTED BEFORE ANY
        MEASUREMENT AND FOUND TRUE. SEARCH_RECORD.md enumerated 1040 campaign
        files, 440 parseable JSON arms across 9 batches, and reported exactly
        two prior cipher specifications campaign-wide (aes, rand:<seed>). The
        decisive finding -- an exhaustive walk of every arm carrying a
        whist/W_ge1* key -- was reproduced independently by both the
        Coordinator (a direct count against the live tree) and the validator
        (a fresh detached-worktree checkout of the cited revision). This is
        the first absence claim in this campaign's recent run of four to
        survive independent testing.
      status: CONFIRMED by two independent re-derivations
    - id: OBS-B9-2
      statement: >-
        THE NULL OBJECT SUBSTITUTES THE CIPHER, NOT A COMPONENT, AND ITS
        CONSTRUCTION IS SOUND. A lazily-sampled uniform random bijection on 128
        bits, realised with exactly four oracle queries per trial. The
        validator traced the forward draws (injectivity-rejection on the
        second ciphertext) and the inverse draws (exact domain-exclusion sets
        for D(c0')/D(c1')) and found the implementation matches the exact
        conditional law required, with no exploitable residual structure.
      status: CONFIRMED by independent line-by-line code review
    - id: OBS-B9-3
      statement: >-
        THE r=5 EXCESS DID NOT SURVIVE CIPHER SUBSTITUTION. With probe
        geometry, masks, seed, arm id and trial count held fixed, and the
        plaintext stream PROVEN identical to the matched live arm by an
        order-sensitive digest, the ideal-permutation arm read 1 hit in 2^30
        trials (R_null=1.00, 95% CI [0.025, 5.572]) and 6 hits in 2^33
        (R_null=0.75, 95% CI [0.275, 1.632]) against the matched 5-round arm's
        14. The preregistered decision rule returns OUTCOME-A. Matched-exposure
        comparison: p=0.0009765625, rate ratio 14.0, 95% CI [2.130, 592.0]. At
        8x exposure on the null arm alone: p=8.792e-10, rate ratio 18.67, 95%
        CI [6.739, 59.266].
      status: >-
        CONFIRMED. Every figure independently recomputed to the reported digit
        by both the Coordinator (before archiving) and the validator
        (afterward), in two independently-written implementations, neither of
        which reused the producer's analyze.py.
    - id: OBS-B9-4
      statement: >-
        THE r=10 OBJECTION WAS ADDRESSED CORRECTLY BY NOT USING FULL 10-ROUND
        AES AS THE NULL OBJECT. r=10 is another point of the SAME one-parameter
        SPN family under test, not a cipher substitution; its own reading at
        the null is what the hypothesis under test PREDICTS, so using it as
        that hypothesis's control would be circular. The r=10 arm is correctly
        retained and reported only as the campaign's existing decay check, kept
        separate from the null-object comparison.
      status: CONFIRMED by independent review of the reasoning
    - id: OBS-B9-5
      statement: >-
        THE "POOLED" N1+N2 STATISTIC DOUBLE-COUNTS OVERLAPPING TRIALS. N1
        (2^30 trials) and N2 (2^33 trials) share identical cipher_stream_seeds
        and thread_seeds; N2 is the same PRNG run 8x longer, so N1's 2^30
        trials are a byte-for-byte prefix of N2's. The producer correctly
        excluded the six unpreregistered geometry arms (G1-G6) from any pooled
        statistic on exactly this non-independence ground, but did not apply
        the same check to N1 vs N2, and RESULTS.json reports a pooled figure
        (7 hits / 9,663,676,415 trials, p=5.86e-10, CI [6.80, 52.70]) that
        silently treats them as independent. Confirmed directly by the
        Coordinator (matching seed fields) and by the validator (subset check
        on the raw hit-trial indices).
      status: >-
        CONFIRMED. Does NOT change OUTCOME-A: the preregistered decision rule
        is keyed to the matched-exposure comparison (N1 alone against the live
        arm), which is unaffected. The 8x-exposure comparison (N2 alone) is
        also unaffected and is the correct number to cite for the tightest
        available interval, NOT the pooled figure. The pooled figure in
        RESULTS.json is WITHDRAWN as a decision-relevant number by this
        record; it is not deleted from the immutable producer artifact.
    - id: OBS-B9-6
      statement: >-
        SIX UNPREREGISTERED GEOMETRY ARMS (G1-G6) WERE RUN AS AN EXTENSION.
        G1-G3 (amask varied) came back bit-identical to N2 on every statistic;
        the producer's own explanation -- the surrogate draws ciphertexts from
        a stream disjoint from the plaintext stream, so amask cannot change
        sampled outputs under this null object -- was verified true by the
        validator directly against the code. G4-G6 (smask varied) correctly
        differ and are NOT claimed identical. No pooled CI is computed over any
        of G1-G6, correctly.
      status: CONFIRMED, both the pathwise identity and its correct exclusion from pooling

  defects_carried:
    - id: D-B9-1
      statement: >-
        RC-11's trial-index pairing does not sharpen the interval. n11=0 (no
        trial index hits in both the r=5 and r=10 arms), so the paired McNemar
        test collapses to arithmetically the same binomial(15, 1/2) as the
        unpaired conditional-binomial test. The producer reported this plainly
        rather than dressing it up, and the validator independently confirmed
        the reduction from the raw hit_trials arrays.
    - id: D-B9-2
      statement: >-
        SEARCH_RECORD.md's file-count table (1040 campaign files, 444 JSON,
        13444 experiment files) does not reproduce exactly against a clean
        checkout of the cited revision (the validator got 1016/442/13430).
        Flagged as an imprecision in the count, not a falsification of the
        absence claim -- the decisive S4 enumeration (exactly two prior
        sbox_spec forms) reproduced exactly by two independent parties.
    - id: D-B9-3
      statement: >-
        The Coordinator's own task card for the validator mischaracterized an
        infrastructure event: it described "one SIGTERM during v4 development,
        caught by a smoke test" as a single event. In fact two SEPARATE,
        correctly-disclosed events exist in two different batches -- this
        task's own JSON-formatting build bug (caught by a 2^20 smoke run, fixed
        before any measurement arm ran) and BATCH-008's actual SIGTERM
        (recorded in EV-AES-8b8dcf's D-B8-1, cited by this task only as the
        reason its own arms ran in the background). The validator could not
        confirm the composite claim because it does not exist as described,
        and reported that rather than papering over the mismatch. Neither
        underlying event is negative mathematical evidence; the defect here is
        entirely in how the Coordinator briefed the reviewer.
    - id: D-B9-4
      statement: >-
        The same task card overstated the G1-G6 finding as "bit-identical to
        N2" across all six arms; the producer's own RESULTS.json is precise
        and only claims this for G1-G3. Minor, and caught before it could
        propagate into this record.

  boundaries:
    - >-
      This is a NEGATIVE result about ONE artifact explanation for the r=5
      excess -- probe geometry plus counting under a structureless cipher -- at
      one probe geometry (amask=1, smask=1), one key, trials from 2^30 to 2^33.
      It removes that explanation and leaves every other standing.
    - >-
      It does NOT establish that the r=5 excess is real, does not identify a
      mechanism, and does not support any claim about AES or any cryptographic
      scheme.
    - >-
      Session and implementation independence only. NO MODEL INDEPENDENCE
      under standing basis 0137a051eb5828789eb267fa83c8278086578d4c; nothing
      here counts toward a closure quorum.
    - >-
      The primary preregistered comparison (matched exposure, 14 vs 1) rests
      on a modest absolute count. The 8x-exposure comparison on the null arm
      alone (14 vs 6) is more informative and should be cited over the
      withdrawn pooled figure.
    - >-
      Residual limitation U4, named by the producer: an ideal permutation does
      not model any GENERIC 128-bit-block-cipher interaction that isn't
      captured by "structureless"; a second, differently-constructed null
      object (e.g. a wide-block Feistel or a non-AES keyed PRP) was
      deliberately not improvised this batch, because a weaker ad-hoc control
      raises more questions than it settles.

  unresolved_confounds:
    - Whether OUTCOME-A depends specifically on idealness rather than merely on structurelessness (U4 above) is untested.
    - A second, independent null-object construction has not been run.
    - Seed-varied replicates of the null-object arm are correlated by construction (same defect class as N1/N2 and G1-G6); none exist yet that are genuinely independent.
    - Exposure beyond 2^33 would tighten R_null's CI further; not reached this batch.

  reviewed_by:
    - >-
      TASK-20260803-1f6b64 (independent validator; verdict PASSED; independently
      reviewed the null-object construction line by line, independently
      reproduced every statistic from raw run JSONs in code written from
      scratch, and found two errors in the Coordinator's own task card in
      addition to the producer-side findings above)
  reviewed_at: 2026-08-05
  red_team_reviewed: false
  red_team_note: >-
    NO RED TEAM REVIEWED THIS BATCH, as with BATCH-007 and BATCH-008. Recorded
    plainly. The validator nonetheless found a real, previously unflagged
    defect (the N1/N2 pooled double-count) and two defects in the Coordinator's
    own briefing, which is a reason to think a red team would find more, not
    fewer.

  inference:
    policy: coordinator-orchestration-code
    requested_policy: coordinator-orchestration-code
    resolved_model: claude-sonnet-5
    fallback_used: true
    model_verified: false
    standing_basis: 0137a051eb5828789eb267fa83c8278086578d4c
