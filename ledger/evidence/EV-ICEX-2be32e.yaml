  scope_statement: >-
    THIS RECORD ASSERTS NO MEASUREMENT. No experiment ran and no run record
    exists. Nothing here supports or weakens any hypothesis about prime-field
    ECDLP, index calculus, or any solving-degree question. It records one
    independent red-team review of an ideation-and-design package. Direction is
    neutral and claim_tier is not_applicable by construction.

  observations:
    - >-
      SNAPSHOT INTEGRITY HOLDS. The reviewer independently recomputed ALL TEN
      declared path_sha256 values, both against the working tree and against
      `git show f3d3b7e6:<path>`; all matched. commit_sha/parent_sha are null,
      so content binding is the operative one, which CLAUDE.md makes explicit.
    - >-
      F-1 (CRITICAL, dispatcher-verified). EXP-ICEX-146ff5 cannot execute to an
      output. GATE-A arm A3's second clause states
      T*/(c_LA*B*^2) == (m+omega-1)/(m-1); the correct identity is
      T*/(c_LA*B*^omega). The two coincide ONLY at omega = 2, and the arm's own
      grid is omega in {1.90, 2.00, 2.10, 2.20, 2.40}. The stated form deviates
      from the correct one by a factor B*^(omega-2), which the dispatcher
      confirmed is unity exactly at omega = 2 and nowhere else on the grid. The
      reviewer evaluated at 50-digit Decimal: m=5, omega=1.90 gives 0.2050
      against target 1.4750; m=8, omega=2.40 gives 247.38 against 1.3429.
      INV-GATE therefore fires, the run set is completed_invalid, and nothing
      is emitted. ST-2 forbids in-flight repair.
    - >-
      F-1 SECONDARY. The contract demands "exact rational equality" at
      tolerance zero, which is unattainable at non-integer omega through
      Decimal: 50 digits returns 1.4749...9989. The tolerance and the
      arithmetic backend are mutually inconsistent as specified.
    - >-
      F-2 (CRITICAL). The headline window shape is wrong. The admissibility
      clause d <= omega/(m-1) is derived at the harvest-all optimum and then
      applied globally, including to the one-relation-per-target branch whose
      operating point is the kink B_k = (m!N)^{1/m}, where mu = 1 and
      T_r = B_k >> 1 and the clause is vacuous. Applied only where it was
      derived, sup W(m,2) at m = 7..12 becomes 5/14, 3/8, 7/18, 2/5, 9/22,
      5/12 -- MONOTONICALLY INCREASING. The design report's "bounded and NOT
      monotone in m", its peak at m in {6,7}, its 2/(m-1) decay, and its stated
      contrast with IDEA-20260803-fa9839 all collapse. The reviewer separately
      confirmed the contract reproduces its own pre-registered table
      (EMPTY, EMPTY, 1/4, 3/10, 1/3, 1/3, 2/7, 1/4, 2/9, 1/5, 2/11) exactly:
      it is internally consistent and externally wrong.
    - >-
      F-3 (CRITICAL, dispatcher-verified). IDEA-20260806-3b91c7's novelty
      framing is refuted by a committed record its own audit declined to open.
      Re-running the audit's capped E10 grep uncapped (109 files, not the 40 it
      stopped at) surfaces knowledge/literature/KN-LIT-013.md, the source_ref
      of KN-TECH-005, which states: "tight (a construction achieves S*T^2 ~ N),
      so with advice the online cost can beat the classic sqrt(N) generic
      bound." The dispatcher opened the file and confirms that text at lines
      28-30. The corpus already holds the achievability row the proposal
      presents as missing.
    - >-
      F-4 (CRITICAL). IDEA-20260806-7ea402 is refuted by its own sota_delta.
      Claim (A) defines cost through the cumulative ncols(D) = sum_{i<=D}
      C(n,i), then computes the degree jump as C(n,D+1)/C(n,D) = 6/7 < 1. The
      cumulative ratio at n=12, D=6 is 3302/2510 = 1.3155, giving a jump of
      1.731 at omega = 2 -- cost RISES, it does not fall. The record's own
      sota_delta field already states J(12,6) = 1.731.
    - >-
      MAJOR FINDINGS (5). IDEA-20260806-20f6ab books its C(m,m/2) gain on the
      wrong axis: build cost is unchanged and the join is already Theta(m!) at
      its own operating point, so the time gain is zero. IDEA-20260806-c5d183's
      theorem is correct but its exhaustiveness claim misses approximate
      equivariance as a fourth class. IDEA-20260806-7ea402's "4.5% of a gap of
      24,621" is 28.9%, verified by the reviewer at source in EV-SIG-008.
      D_trial is uncoupled from B while the optimizer raises B, and e = 1 alone
      moves emptiness from m <= 3 to m <= 4. PM-5 is a Pareto claim compared
      against the wrong frontier, leaving its dominated_by: NOT APPLICABLE
      unchecked.
    - >-
      CONTROL CAPABILITY. CTRL-NULL and CTRL-DEGENERATE arm D1 are identities
      rather than controls. CTRL-CONVENTION cannot fail under one of its two
      readings. GATE-A performs ZERO external calibration -- which is the one
      thing the source proposal required of it and the reason this contract was
      selected. The reviewer recommends GATE-A be relabelled as an
      internal-consistency check rather than a calibration gate.
    - >-
      THE CONTRACT IS NOT ZERO-COMPUTE. It declares 5 runs and 0.25 CPU-hours,
      and CTRL-NULL emits measured means. The batch objective and the routing
      argument both rested on it being a pure derivation.
    - >-
      THE THREE STANDING SCREENS. The reviewer re-ran all three independently
      and AGREES with the producer in 15 of 15 cells. Disagreement is confined
      to reasoning -- IDEA-20260806-9d47e2's citation is not load-bearing for
      its headline -- and to matters outside the screens' scope.
    - >-
      AUDIT DEBTS TESTED AT SOURCE. The producer reported 262/262 and 64/64
      coverage but disclosed a 40-file cap on a knowledge/ grep and that
      EV-SIG-008 and EV-DREG-008 were read via the synthesis rather than at
      source. Both debts were material: the capped grep concealed F-3, and the
      second-hand reading of EV-SIG-008 produced the 4.5%-versus-28.9% error.
      A disclosed audit limit is not a discharged one.
    - >-
      THE sigma = 0 CALIBRATION IS A REAL KNOWN-ANSWER EDGE BUT IS NOT
      DISCRIMINATING: Shoup's rival law passes it identically. The
      discriminating point is sigma = 1/3.

  dispatcher_verification:
    - >-
      The dispatcher independently confirmed F-1 by evaluating the B*^(omega-2)
      discrepancy factor across the arm's own omega grid, and F-3 by opening
      knowledge/literature/KN-LIT-013.md and reading lines 28-30 directly.
    - >-
      DEPENDENCY CLAIM CORRECTED, AND THE ERROR IS THE DISPATCHER'S. This
      batch's task card stated "numpy is present". The dispatcher asserted that
      without checking. `import numpy` and `import sympy` both raise
      ModuleNotFoundError in this environment and harness/runner.py cannot
      import. The specification's dependency verification section is therefore
      factually wrong, and it is wrong because the instruction it was reasoning
      from was wrong.

  inference: >-
    This package produced five proposals and one frozen contract. The contract
    cannot execute to an output (F-1), its headline window shape is derived
    outside the region where its own admissibility clause holds (F-2), and its
    calibration gate performs no external calibration -- which was the single
    property that justified selecting this proposal. Two of five proposals are
    refuted, one of them by a record its own audit's capped grep concealed and
    one by a number already present in its own sota_delta field. The useful
    output of this batch is the defect set, not the contract.

  boundaries:
    - No experiment ran. No run record exists. No claim tier above
      not_applicable is available.
    - Nothing here bears on whether prime-field ECDLP is weak or strong, on
      whether any sub-rho algorithm exists, or on any solving-degree question
      in GOAL-SDEG-001, GOAL-DREG-001 or GOAL-SIG-001.
    - The reviewer is a single independent session. No breakthrough or
      contradiction claim is advanced, so AGENTS.md rule 12's
      review-breakthrough gate is not invoked.
    - F-2's corrected window values are the REVIEWER's derivation and have not
      themselves been independently checked. They are recorded as a finding
      against the contract, not as an established result.

  unresolved_confounds:
    - Whether F-2's corrected monotone-increasing window survives its own
