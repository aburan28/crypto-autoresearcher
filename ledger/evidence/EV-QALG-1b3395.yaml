evidence:
  id: EV-QALG-1b3395
  hypothesis_id: H-CSIDH-3eaede
  experiment_ids:
  - EXP-CSIDH-c65945
  run_ids:
  - RUN-CSIDH-c65945-001
  type: literature
  direction: weakens
  strength: strong
  claim_tier: crypto
  claim_tier_note: >-
    "crypto" describes TESTED SCALE only, per docs/claims-and-verification.md:
    CSIDH-512's actual, standardized class-group order was independently
    re-derived and used throughout, not a toy or symbolic N. It does NOT
    mean an attack, speedup, or security-margin claim is made -- none is;
    see boundaries below.
  certificate_refs: []
  proof_status: derivation
  proof_refs:
  - experiments/EXP-CSIDH-c65945/runs/RUN-CSIDH-c65945-001/applicability_audit.md
  - experiments/EXP-CSIDH-c65945/runs/RUN-CSIDH-c65945-001/class_group_order.md
  observations:
  - >-
    Premise (i) of H-CSIDH-3eaede -- that Simon 2026's zero-noise DCP
    specialization is a legitimate instantiation of its own stated theorem
    when applied to CSIDH-512's actual, non-power-of-2 class-group order N
    -- is NOT satisfied under CSIDH-CHG-2's operative test
    (applicability_outcome: B, NOT-APPLICABLE-AS-STATED). No page/lemma-citable
    statement, in Simon 2026's own text or in any of its three cited
    predecessors (Regev 2004, Kuperberg 2005, Ettinger-Hoyer), names a
    technique extending Simon's N=2^n-restricted proof (Section 2.2) to
    general, non-power-of-2 N with that technique's own preconditions
    checked against CSIDH-512's actual N.
  - >-
    CSIDH-512's exact class-group order N (258 bits,
    3*37*1407181*51593604295295867744293584889*31599414504681995853008278745587832204909)
    was independently obtained from CSI-FiSh (IACR eprint 2019/498, Section
    3, p.8) and cross-verified against the CSI-FiSh reference
    implementation's own parameter file, exact agreement -- confirmed by
    two additional, fully independent reviewer sessions, each re-fetching
    both sources live and re-deriving the arithmetic from scratch, with the
    Validator additionally cross-checking primality via four independent
    methods (sympy, from-scratch Miller-Rabin/Fermat, GNU `factor`, OpenSSL
    `prime`) and the Red Team independently locating a third,
    differently-authored citation (Peikert 2019/725, EUROCRYPT 2020) that
    states the identical N.
  - >-
    A dedicated, constructive attempt to overturn outcome B -- testing
    whether Kuperberg 2005's own citable general-N technique (a CRT
    decomposition plus automorphism relabeling, Section 5 Algorithm 2) is
    actually algorithm-agnostic and therefore should count toward Simon's
    construction -- failed on two independently-verified structural
    grounds: Kuperberg's technique is stated for an ORACLE-model
    construction while Simon's is SAMPLE-based (an interface mismatch), and
    no source anywhere defines an analog of Kuperberg's general-N recovery
    step compatible with Simon's binary-recursive, fault-tolerant proof
    machinery for an odd-modulus component. A third, independent instance
    of the same CRT technique (Childs-Jao-Soukharev 2014, Appendix Algorithm
    8/Theorem A.1) was found and confirmed to belong to the same
    oracle/sieve family, reinforcing rather than weakening outcome B.
  - >-
    A proves-too-much control applied CSIDH-CHG-2's operative test,
    unchanged, to Kuperberg's own Theorem 1.1 (also originally proved only
    for N=2^n) and correctly returned outcome A, since Kuperberg's own
    paper supplies the citable general-N patch for his own construction --
    confirming the test discriminates correctly between "patched in the
    same paper" and "never patched anywhere in the citable record," rather
    than being a blanket rejector of every N=2^n-first proof structure.
  inference:
    validation_report: coordination/goals/GOAL-QALG-001/reviews/RUN-CSIDH-c65945-001-validation/report.yaml
    validation_verdict: REVISE
    validation_revise_basis: >-
      REVISE was for three correctable, disclosed defects (Kuperberg
      citation misattribution; Simon Theorem-vs-Proof scope-disclosure
      gap; unmeasured/overrun wall-clock timing), all addressed by
      CORR-20260906-4c1b57, and NOT for either primary metric, which the
      validator's own verdict_rationale states are "CONFIRMED correct as
      reported."
    red_team_report: coordination/goals/GOAL-QALG-001/reviews/RUN-CSIDH-c65945-001-redteam/report.yaml
    red_team_verdict: SUSTAINED
  boundaries:
  - >-
    Scoped ONLY to premise (i) of H-CSIDH-3eaede's two-premise conditional:
    whether Simon 2026's construction is a legitimate instantiation at
    CSIDH-512's actual N, under the currently citable literature. It is a
    CITATION-EXISTENCE finding, not a mathematical-impossibility proof --
    both independent reviews explicitly warn that this test cannot
    distinguish "no citable reduction currently exists" from "no reduction
    is mathematically possible," and this evidence record preserves that
    distinction rather than collapsing it.
  - >-
    Does NOT test premise (ii) (the crossover-order/cost-model question
    against Kuperberg's sieve), which remains untested and, per
    H-CSIDH-3eaede's own conditional (AND) structure, is now moot for this
    specific hypothesis chain given premise (i)'s negative outcome.
  - >-
    Makes NO claim about Simon 2026's Lemma 3 correctness, CSIDH's
    security, an attack, a speedup, or a security-margin revision. Simon
    2026 remains an unverified, unrefereed preprint throughout.
  - >-
    Does not foreclose a future, not-yet-published literature result
    (e.g., a noise-tolerant analog of Kuperberg's/CJS's CRT patch for an
    odd-modulus component, the specific technical gap the red-team's
    review identifies as the highest-value next literature-search
    question) from later satisfying premise (i).
  unresolved_confounds:
  - >-
    RUN-CSIDH-c65945-001's own wall-clock timing is unmeasured and
    disclosed as overrunning specification.yaml's stated budget by
    roughly 3x (see CORR-20260906-4c1b57) -- an instrumentation and
    budget-compliance gap, not evidence bearing on this finding's
    correctness, which both independent reviews re-derived from scratch
    regardless of the original run's timing.
  obstruction:
    statement: >-
      No citable, page/lemma-located primary-source statement extends
      Simon 2026's N=2^n-restricted DCP erasure proof to a general,
      non-power-of-2 dihedral group order. This is a claim about the
      currently citable literature, not a proof of mathematical
      impossibility: Kuperberg's own general-N patch (Section 5, Algorithm
      2) is bound to an oracle-query interface and a sieve-specific
      digit-recovery step that Simon's sample-based, binary-recursive,
      fault-tolerant erasure construction does not share and for which no
      source defines a replacement.
    quantity: "applicability_outcome (categorical: A or B)"
    value: "B (NOT-APPLICABLE-AS-STATED)"
    measured_by:
    - RUN-CSIDH-c65945-001
    scope: >-
      CSIDH-512's actual class-group order N (independently re-derived,
      258 bits), under Simon 2026's specific erasure/noise-tolerance
      technique as currently published, checked against its own cited
      predecessors (Regev 2004, Kuperberg 2005, Ettinger-Hoyer) and,
      beyond the contract's required four, Childs-Jao-Soukharev 2014 and
      Peikert 2019/725. Does not address whether some other,
      not-yet-published or not-yet-located technique could bridge this
      gap.
    resource_check:
      examined: true
      reading: >-
        The red-team review's constructive attempt to flip this into a
        resource for outcome A (testing whether Kuperberg's CRT/automorphism
        technique is algorithm-agnostic, per attack step 1) is the reversal
        check: it failed on two independently-verified structural grounds
        (oracle-vs-sample computational-model mismatch; no odd-modulus
        analog of Simon's binary-recursive proof machinery exists in any
        checked source), and a third independent instance of the same
        technique (CJS Appendix Algorithm 8) was found and confirmed to
        belong to the same oracle/sieve family, reinforcing rather than
        supplying a resource for outcome A. The red-team's own
        next_concrete_action names the sharper, unresolved technical
        question this obstruction narrows to: whether any published or
        citable construction defines a noise-tolerant (not merely
        error-free) recovery procedure for an odd-modulus component -- a
        "yes" there would be the single most direct route to reopening
        premise (i).
      spawned_ids: []
  claim_ceiling_compliance: >-
    Verified independently by both the Validator (SCOPE-CHECK) and the Red
    Team (attack step 5): no location in the run's artifacts or the
    archival commit message exceeds specification.yaml's declared scope.
  recorded_by: coordinator
  recorded_at: '2026-09-06'
