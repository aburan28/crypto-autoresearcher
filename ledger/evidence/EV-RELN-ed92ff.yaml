evidence:
  id: EV-RELN-ed92ff
  hypothesis_id: H-RELN-427bfd
  experiment_ids: [EXP-RELN-141a86]
  run_ids:
    - RUN-RELN-141a86-stage0a
    - RUN-RELN-141a86-stage0bcde
    - RUN-RELN-141a86-stage0c-repair
    - RUN-RELN-141a86-stage0c-minimality
  type: empirical
  direction: neutral
  strength: preliminary
  claim_tier: toy
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []
  observations:
    - >-
      Stage-0a's hash (f1aec620f8cb19318e6d6459174bd79b80daf6dd46fdacf6afdf2468c7cac7f2)
      was re-verified exactly at both the start and end of this run.
    - >-
      Per-level checkpointing (write-temp, fsync, atomic rename after each
      completed complexity level) was implemented and DEMONSTRATED to
      survive a real SIGKILL: a live worker was killed mid-run at
      complexity level 5, and a fresh process reading the checkpoint file
      recovered 5 complete, well-formed level records with correct
      cumulative counts. This closes the infrastructure gap disclosed in
      EV-RELN-543f9b.
    - >-
      TARGETED MINIMALITY (exhaustive search strictly below the target's
      canonical complexity, plus direct construction and node-counting of
      the known closed form at that complexity) recovered three
      previously-open controls: INV-1 conservation mean (levels 1-8
      exhaustive, no match, 1898s wall-clock, 2.02 GB peak; known form
      node-counts to 9 exactly, zero residual on 144 real cells), INV-7
      p_fail (levels 1-8 exhaustive, no match, 1782s, 1.86 GB peak; known
      form node-counts to 9 exactly, zero residual on 15 real cells), and
      INV-8 semi-regular degree (levels 1-9 exhaustive, no match, 1796s,
      4.44 GB peak; known form node-counts to 10 exactly, zero residual on
      549 real rows). Each is explicitly labeled "recovered by targeted
      minimality," a methodologically distinct claim from INV-A4 and
      INV-A6's blind-search recovery: it proves no lower-complexity match
      exists AND that the known form exists at exactly the canonical
      complexity, which together establish the known form as the unique
      minimal-complexity match -- not literally "found by unguided blind
      search," though it establishes the same fact the gate is meant to
      protect (that the target expression is genuinely the simplest one
      consistent with the data).
    - >-
      INV-7 p_exist (canonical complexity 11, same 6-leaf pack as p_fail)
      was attempted last, as anticipated: levels 1-8 completed
      exhaustively with no match, but the external 6000-second hard cap
      killed the process mid-generation of level 9; extrapolation from the
      completed levels' growth rate suggests level 9 alone would require
      roughly 12-14 hours. Direct construction confirms the known form
      node-counts to exactly 11 with float-epsilon residual (1.1e-16).
      This control remains OPEN, reported as resource_exhaustion, never a
      negative or positive result.
    - >-
      One disclosed deviation: a mistaken concurrent CLI invocation
      briefly re-ran INV-1's enumeration and overwrote its checkpoint file
      with stale in-progress state twice before being killed; the
      untouched original worker-result was verified byte-identical on
      regeneration both times, so no measured result was lost or altered
      (full timeline in
      experiments/EXP-RELN-141a86/runs/RUN-RELN-141a86-stage0c-minimality/implementation.md).
    - >-
      Updated five-control table: INV-A4 PASS (blind search, prior run),
      INV-A6 PASS (blind search, prior run), INV-1 PASS (targeted
      minimality, this run), INV-7 p_fail PASS (targeted minimality, this
      run), INV-8 PASS (targeted minimality, this run), INV-7 p_exist OPEN
      (resource_exhaustion). FOUR OF FIVE recovery controls now pass; the
      contract's own Stage-0c stopping rule requires ALL FIVE before Stage
      1 runs ("any recovery control is not recovered on the primary
      engine... Stage 1 does not run"). Per the handoff's explicit
      constraint, the executor did NOT proceed to Stage 1 and reported
      this status for a Coordinator decision instead of resolving it
      unilaterally.
  inference: >-
    NO STAGE-1 VERDICT IS OFFERED OR AUTHORIZED. This record establishes
    that four of the contract's five Stage-0c recovery controls are now
    affirmatively passed (three by a methodologically distinct but
    arguably equally or more rigorous method than blind search), and that
    the fifth (INV-7 p_exist) is honestly open with a concrete cost
    estimate for closing it (~12-14 hours for level 9 alone on this
    implementation). Whether this four-of-five state is sufficient to
    authorize Stage 1 under the contract's literal text, whether the
    targeted-minimality method's PASSES should count identically to
    blind-search PASSES for gate purposes, and whether to invest further
    compute in p_exist or accept it as open via a versioned amendment, are
    all Coordinator/user decisions not made by this record.
  boundaries:
    - >-
      Toy scale; Stage 0a-0c only, across three attempts. Stage 0d
      (already valid, unaffected), Stage 0e, Stage 1, and Stage 2 remain
      not_run pending the gate decision above.
    - >-
      The targeted-minimality recoveries are scoped exactly to the stated
      leaf packs, complexity caps, and control tables; they say nothing
      about whether the SAME method would recover p_exist's complexity-11
      target without the ~12-14 hour level-9 search, which this run did
      not attempt to shortcut further.
  unresolved_confounds:
    - >-
      Whether targeted-minimality PASSES should be treated identically to
      blind-search PASSES for the Stage-0c gate's purpose, or whether the
      contract's text requires a versioned amendment to formally accept
      the distinct method, is not resolved by this record and is named
      explicitly as a decision point.
  obstruction: null
  reviewed_by: coordinator
