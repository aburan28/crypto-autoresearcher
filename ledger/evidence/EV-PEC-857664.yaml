    - id: OBS-H
      subject: "A-3 IS THE KARATSUBA RECURSION STAIRCASE - the batch's real structural contribution, and it is absorbed by the contract's own pairing rule"
      text: >-
        A-3 as archived: gamma_B = 0.810034 on W-MID against 0.958496 on W-TOP,
        with the S-B nested quadratic over ell >= 101 at 0.167076, bootstrap CI
        [0.141153, 0.192587] excluding zero. THE MECHANISM, REACHED INDEPENDENTLY
        BY BOTH REVIEWERS FROM DIFFERENT DIRECTIONS.
        RED TEAM (RT3-C2), from the residuals: KARATSUBA_THRESHOLD = 16 makes the
        recursion depth constant on the bands ell in [15,30], [31,62], [63,126],
        [127,254]. Residuals about each series' own W-MID linear fit DROP at
