  inference: >-
    Four things follow, and they must be kept separate.
    (1) THE REPAIR HOLDS, AND THAT IS A METHODOLOGICAL RESULT, NOT A RESULT ABOUT
    THE ATTACK. The corrected law recovers the level of an object whose level is
    known (0.271670 bits of a 0.75-bit tolerance) where the superseded law misses
    it by up to 12.605090 and fails everywhere; the seam is measurably gone
    (0.395971 -> 0.017345 bits at 101/103); null coverage is 1.0000 in every
    fitted window by construction; and C-REPRO reproduces 884 overlapping samples
    bit-for-bit, so the seam-free refit is genuinely comparable to the fit it
    supersedes. Validator findings F-1 and F-3 are RESOLVED and F-4 PARTIALLY.
    Both reviewers reproduced the corrected c independently to ~1e-16. NC2b
    changed an ESTIMATOR, not a measurement, and by itself it moves no claim
    about the attack.
    (2) MEASURED, at `medium` tier and scoped to the tested range: on a
    homogeneous, complete-grid, fully null-controlled response, the per-entry
    cost of Algorithm 1's table construction follows a power law with exponent
    0.9328644281 (schoolbook) and 0.8100336227 (Karatsuba) over ell >= 11 at
    p ~ 2^40, with fitted levels at ell = 1 of 2^9.298 and 2^9.731. Section 4.1's
    one-F_{p^2}-operation-per-entry convention remains REFUTED AT THE TESTED
    SCALE, in the attack's DISFAVOUR, and now on a stronger footing than in
    EV-PEC-2e67ff: the refutation does not depend on the exponent, on the
    extrapolation law, or on the seam, because the run's own null object - flat
    in ell by construction and now covering 100 per cent of every fitted window -
    still costs 4914.45 to 5118.83 multiplications per entry, i.e. REF_null =
    12.2595 measured bits above the assumed 1.
    (3) A NEW STRUCTURAL FINDING, and it is the batch's real contribution: the
    measured curve carries the RECURSION STRUCTURE OF ITS OWN MULTIPLICATION
    ROUTINE as a phase-locked sawtooth, and a free null-object control on the
    EXPLANATION - the depth regressor at -0.0749 bits/level on IMPL-B and +0.0066
    on IMPL-A - separates the two. Two consequences pull in opposite directions
    and neither is netted away. Because the contract's pairing rule forces a
    W-TOP slope to be used with its own W-TOP intercept, the artifact costs only
    1.007 bits of NIST-I margin instead of the 2.4-bit excursion an unpaired
    reading produces. And because IMPL-B leaves the shared reduction schoolbook,
    gamma_B = 0.810 is a TRANSIENT whose gain must saturate, so the bracket's low
    end is the OPTIMISTIC reading and the high end is the defensible one for this
    implementation family.
    (4) NOT DECIDED: the concrete NIST-I question. All eighteen measured-gamma
    readings put the modelled margin at w = 2^30 in [8.3498, 13.1544], whose
    worst member clears both irreproducibility bands by 4.8 to 6.1 bits - so the
    SIGN is robust. The MAGNITUDE is not: with L4 the defensible span is 13.94
    bits (alpha = 1 throughout) to 16.62 bits (alpha in {0, 1, alpha_hat})
    against bands of 2.2309 and 3.5133, i.e. four to seven times the band, and
    its width is still set almost entirely by a subroutine nobody has written.
    The narrowing is real - width 17.27 -> 13.94, and the low end up 2.95 bits,
    with the old 5.40 low end abolished because it came from a quadratic on a
    mixed response - and it is not a determination. A pre-registered falsifier
    fired (FC-4) and stands. The programme's own correction RT3-C1 says every
    margin row above is 0.60 to 1.00 bits pessimistic, and RT3-C9 says the
    baseline side of the comparison has still not been instrumented at all.

  pareto:
    note: >-
      Carried per docs/inventor-protocol.md section 5. Every row names what
      dominates, on which axis, and whether it was checked.
    dominated_by_is_null: false
    dominated_by:
      - axis: "time (per-entry F_{p^2} multiplications, measured)"
        dominator: >-
          The run's own IMPL-B over IMPL-A, by a log2 ratio rising from 0.1118
          (ell 17) to 0.4905 (ell 211), with EQUALITY at the six ell below the
          Karatsuba threshold. The headline measurement is dominated by a routine
          inside the same file.
        status: "CHECKED, recomputed by the Red Team from the 752 committed samples"
      - axis: "time (asymptotic per-entry exponent)"
        dominator: >-
          Any batched Sutherland-type modular-polynomial evaluation with batched
          root-finding, which drives the per-entry cost toward O~(log p) and
          removes 11.50 to 13.25 of the 21.23 to 25.22 modelled NIST-I overhead
          bits. Named in the frozen paper's own Lemma 3.3 footnote and credited
          to Damien Robert.
        status: >-
          STRUCTURALLY ESTABLISHED from the committed pipeline and from Algorithm
          1's own batch availability (N ~ M/ell >> ell arguments per ell), NOT
          MEASURED. The Sutherland literature was again not retrieved; this axis
          remains UNCHECKED for the third consecutive batch.
      - axis: "time (this implementation's own asymptote)"
        dominator: >-
          IMPL-A dominates IMPL-B asymptotically, AGAINST the measured ordering,
          because poly_rem_monic is schoolbook in both so the Karatsuba gain
          saturates and gamma_B -> gamma_A. Committed evidence: per-band
          increments of log2(A/B) 0.1118, 0.1178, 0.1163, 0.0921.
        status: "CHECKED as a trend on four increments; SUGGESTIVE, not established"
      - axis: "memory / data"
        dominator: >-
          Delfs-Galbraith dominates the attack on memory at every w: 2^93.28
          table entries at NIST-I against negligible memory. The model's +0.5
          bits of margin per bit of memory is approximately cancelled by real
          access latency beyond DRAM, which is why every row is quoted at
          w = 2^30. A genuine trade, not a Pareto improvement.
        status: "CHECKED against RUN-WESOVOW-001 per_field memory rows"
      - axis: "queries / oracle access"
        dominator: "not applicable; neither the attack nor the baseline is query-bounded"
        status: "CHECKED and recorded rather than omitted"
      - axis: "the estimator itself"
        dominator: >-
          The corrected law dominates the superseded law on the only axis either
          was ever tested on: 0.271670 bits of null-gate error against 12.605090,
          at a 0.75-bit tolerance. Its narrowness is objection RT3-C6 and finding
          V-1: the gate tests LEVEL RETENTION and has no power against L1, L2,
          L5 or the pairing rule.
        status: "CHECKED, and its limits are recorded rather than netted"
    sota_delta:
      quantity: "width of the defensible modelled NIST-I margin interval at w = 2^30"
      before_this_batch: >-
        [5.40, 22.67] bits, width 17.27, with the low end produced by a quadratic
        on a compositionally inhomogeneous series and the high end by the
        unimplemented batched-evaluation scenario.
      after_this_batch: >-
        Measured-gamma readings only (6 fits x 3 alphas): [8.3498, 13.1544],
        width 4.805. Adding L4 at alpha = 1 throughout: [8.3498, 22.2927], width
        13.9429. Allowing alpha in {0, 1, alpha_hat}: [8.3498, 24.9708], width
        16.6210.
      delta: >-
        On the like-for-like alpha = 1 convention the width falls from 17.27 to
        13.94 bits, a narrowing of 3.33 bits (19.3 per cent), and THE LOW END
        RISES BY 2.95 BITS (5.40 -> 8.35). The qualitative gain exceeds the
        numerical one: the old low end came from a quadratic on a mixed response
        and NO LONGER EXISTS, while the new low end comes from a homogeneous,
        fully null-controlled, complete-grid fit. WHAT DID NOT CHANGE: the
        residual width is still dominated by a subroutine nobody has written, and
        it is still four to seven times the irreproducibility band.
      honest_negative_component: >-
        Two corrections in this batch move the number against the programme's
        convenience and are recorded as such: RT3-C1 shifts the whole table 0.60
        to 1.00 bits toward the attack, making the objection that forced this
        batch smaller; and RT3-C2's saturation reading moves the bracket's low
        end 1.75 bits away from the attack. Neither was requested by any task
        card and neither favours the position the Red Team argued in BATCH-002.

  boundaries:
    - >-
      Scoped to p = 1099511627563 (a single prime, 80-bit F_{p^2}), to the 47
      prime degrees 2 <= ell <= 211, to this pure-Python implementation pair
      sharing every line but poly_mul, to this counting convention, and to this
      budget (one run, 791.751 s). AGENTS.md rule 7 applies in full: this is
      never cryptographic-scale validation.
    - >-
      Every statement about NIST-I/III/V is an EXTRAPOLATION under the corrected
      law, conditional on L1-L6, and carries NO claim tier. At NIST-I the
      relevant ell ~ B_opt ~ 2^14.2 lies about 6.48 octaves beyond the top of the
      measured range on W-MID and about 18 octaves at log2 p = 768. THIS
      EXPERIMENT DOES NOT REDUCE THAT GAP BY A SINGLE OCTAVE, whatever the
      estimator does.
    - >-
      The experiment cannot discriminate between per-entry cost laws that agree
      over ell <= 211 and diverge at ell ~ 2^14.2. RT3-P1 shows the identifiabilty
      fiber is now MEASURED rather than merely named: schoolbook and Karatsuba
      differ by 0.4905 bits at ell = 211 and by 11.50 against 13.25 bits at
      ell = 2^14.2, and a quasi-linear M would sit in the same fiber at the low
      end and diverge by a further ~11.5 bits at the top. The separator remains a
      third implementation at a different M-exponent (NC2c) and it is unbuilt.
    - >-
      A measured gamma from an unoptimised implementation is an UPPER bound on
      the achievable per-entry exponent, so it is anti-attack by construction and
      can never show the attack is more expensive than the paper claims.
      Conversely the excluded costs are excluded in the attack's favour, so the
      same gamma is simultaneously a LOWER bound with respect to them. The two
      directions are NOT netted. RT3-P3 states the method ceiling exactly: this
      method can narrow the overhead FROM ABOVE within [0, 1] in the exponent,
      and it has now done that to a 4.805-bit span on the measured-gamma axis. It
      is at that ceiling.
    - >-
      The supported quantifier order is "for THIS implementation pair, at THIS p,
      there exists gamma such that for all ell in [11, 211] per_entry ~
      A * ell^gamma". The uniform form over implementations, primes or ell ranges
      is NOT claimed, which is why the exponent of record is the PAIR
      (gamma_A, gamma_B) and never a collapsed scalar. RT3-P2 records the
      residual violation one level up: alpha is a witness estimated on
      ell in {3,5,7,11,13} and applied to a fit over ell in [11, 211], which the
      pairing rule does not forbid and a successor contract should.
    - >-
      Nothing here bears on Heuristic 1, on P0, on CSIDH, on (qt-)Pegasis, or on
      torsion-based constructions. Nothing here supports any security-parameter
      action. No universal impossibility claim is made anywhere in this record.
    - >-
      C-PSCALE's alpha, its FC-4 firing and its band verdict rest on three primes
      at 40-, 60- and 80-bit fields and carry a `toy` ceiling; they may not be
      cited above it.

  unresolved_confounds:
    - >-
      L4 / RT2-C4 / RT3-C8: batched Sutherland-type or quasi-linear evaluation is
      still unimplemented and is worth 11.50 to 13.25 bits at NIST-I - 48 to 59
      per cent of the corrected overhead and STILL THE DOMINANT TERM. NC2c is the
      separator.
    - >-
      L1: the 6.48-to-18-octave extrapolation. RT3-H1 records that it is the only
      assumption in the list with NEITHER a falsification condition NOR a
      random-model justification, and the only one that can move the answer by
      more than a few bits. RT3-P1 sharpens the transfer challenge: per_entry is
      not an unstructured empirical curve but 4*log2(p)*M(ell)/(ell+1) for a KNOWN
      M, and the measured curve visibly carries that M's recursion structure - so
      the object being extrapolated is a property of poly_mul_kara and
      poly_rem_monic, not of Algorithm 1.
    - >-
      L2 / RT3-C1: the charging point at ell = B_opt overstates the entry-weighted
      cost by 0.60 to 1.00 bits at every field size. Declared, now quantified, and
      applied to no archived row. L2-WEIGHT is the zero-compute control.
    - >-
      L5 / FC-4 / V-7: the p-scaling derivation is CONTRADICTED IN MECHANISM by
      the run's own null arm. alpha = 1 is not falsified (FC-2 correctly did not
      fire, by 1.35 per cent) but its derivation is. NC2d-PROPER, at ell in
      {47, 101, 151, 211}, is the only legitimate way to retire the label.
    - >-
      V-1 / RT3-C6: the NC2b-G1 tolerance has no variance term, so the PASS is
      about 1.4 noise units rather than a 0.478-bit cushion, and the gate has no
      power against L1, L2, L5 or the pairing rule. NC2b-SLOPE - the committed
      null multiplied pointwise by ell^s for declared s - is the zero-compute gate
      that would have power against L1.
    - >-
      F-4 as it stands: gamma_A and gamma_B remain NON-INDEPENDENT. C-SEED bounds
      the per-sample split-structure cost ratio on 6 of 47 ell but computes no
      gamma_B' and therefore does not bound the effect on the fitted exponent.
    - >-
      RT2-C7 / RT3-C9: the comparison charges measured overhead to the attack
      while Delfs-Galbraith keeps the nominal one-operation-per-step convention.
      Plausibly 5-7 bits back to the attack, unmeasured, of known sign, and
      applied to no number. It is now the largest UNMEASURED term after L4 and is
      cheaper to measure than anything else outstanding (NC2f).
    - >-
      The end-to-end baseline constant k from the frozen bibliography's [15]
      (Santos-Costello-Shi subfield acceleration) and [3] (Adj et al. concrete
      constants) is still unquantified in this repository. No task in BATCH-001,
      002 or 003 fetched either. Every margin row carries that constant-factor
      uncertainty in addition, in the attack's disfavour if k > 1.
    - >-
      RT3-H0: Heuristic 1's tail at the operating point sets P0 and moves every
      margin row identically, and remains untested since BATCH-001. This is now
      the binding uncertainty in the programme, not a background caveat.
    - >-
      A-3 itself is only EXPLAINED, not eliminated: the band model is a regressor
      fitted to committed data, and NC2a-BAND (extending the grid past ell ~ 521
      and moving KARATSUBA_THRESHOLD to 8 so the band boundaries must MOVE with
      it) is what would prove the mechanism rather than fit it.

