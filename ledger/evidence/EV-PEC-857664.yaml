        schoolbook series. The decomposition closes: 0.8919 - 0.0749 = 0.8170
        against the measured W-MID slope 0.8100, to 0.007.
        VALIDATOR (A-3 assessment), from the instrument: per_entry_cost.py
        substitutes ONLY poly_mul; poly_rem_monic - the modular reduction every
        poly_powmod iteration performs after every multiplication - is SCHOOLBOOK
        and SHARED, with cost Theta(ell^2) in the counted unit. As ell grows,
        Karatsuba drives IMPL-B's multiplication term below the shared quadratic
        reduction, so IMPL-B's total becomes REDUCTION-DOMINATED and its measured
        exponent must rise toward IMPL-A's. Three signatures confirm it: the A/B
        cost ratio saturates (1.000 at ell 13, 1.295 at 101, 1.396 at 151,
