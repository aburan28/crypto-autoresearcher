evidence:
  id: EV-PEC-857664
  hypothesis_id: H-WESO-001
  experiment_ids: [EXP-PEC-49c773]
  run_ids: [RUN-PEC-49c773-a]
  supersedes_analysis_of: EV-PEC-2e67ff
  supersession_note: >-
    EV-PEC-2e67ff is NOT edited, withdrawn, or deleted. It remains the evidence
    record of RUN-PEC-6be870-a and of the BATCH-002 review. This record carries
    the seam-free re-measurement and the corrected estimator that supersede that
    record's ANALYSIS layer (its OBS-D exponent, OBS-E extrapolation and OBS-M
    margin arithmetic), and corrects three statements of this programme's own
    prior records in `corrections_to_this_programmes_own_record` below. Where the
    two records disagree numerically, this one governs, and the disagreement is
    named rather than silently resolved.
  type: empirical
  direction: weakens
  direction_binding: >-
    `weakens` is bound to ONE thing, as in EV-PEC-2e67ff: the frozen paper's
    Section 4.1 cost convention that "constructing a table costs a single
    F_{p^2}-operation per entry". It is NOT bound to the conditional asymptotic
    theorem (untouched by this batch), NOT to Heuristic 1 (untouched), and NOT to
    the sign of the NIST-I margin, which this record leaves INCONCLUSIVE. The
    refutation of the convention is now carried on a complete 47-ell grid with
    100 per cent null coverage rather than on a 46-slot grid with 54 per cent
    coverage, so it is firmer than in EV-PEC-2e67ff. One component moves the
    other way inside the law and is recorded rather than netted: RT3-C1 prices
    the charging-point assumption L2 at 0.60 to 1.00 bits PRO-attack.
  strength: preliminary
  strength_justification: >-
    Capped at `preliminary`, unchanged from EV-PEC-2e67ff, for reasons that are
    NOT defects of this execution. (1) The frozen contract's own replication
    clause binds: "One run is authorized (maximum_runs 1). Eight j-samples per
    ell provide within-run replication of the per-ell statistic; they do NOT
    provide independent replication of the run, and the resulting evidence
    strength may not be recorded above `preliminary` on that basis alone"
    (EXP-PEC-49c773, replication.note). One run was authorized and one executed.
    (2) C-REPRO's 884 bit-for-bit agreements with RUN-PEC-6be870-a are
    replication of the INSTRUMENT and of the determinism claim, explicitly not of
    the inference - the contract says so, the Validator says so (M-6), and the
    Red Team quantifies the limit: 484 of this run's 752 primary samples are
    bit-identical to the superseded run, so the seam-free series is 36 per cent
    new data plus a re-derivation. A deterministic instruction counter
    reproducing itself demonstrates determinism, not robustness to a different
    instrument. (3) Both independent reviewers recomputed every headline number
    from the SAME committed raw data with their own code; that is arithmetic
    verification of admissibility, which is what it claims to be, and it is not a
    second measurement. The Validator's verdict is VALID-WITH-OBSERVATIONS
    (admissible), not `replicated`.
    WHAT WOULD RAISE IT: a second authorized run under a different instrument
    (NC2c's third implementation is the obvious carrier) or an independent
    re-measurement at a different prime over the fitted range (NC2d-PROPER
    partially). Neither exists.
  claim_tier: medium
  claim_tier_derivation: >-
    Mechanical, per docs/claims-and-verification.md: max field bit size =
    2 * 40 = 80, which lies in (32, 96], so the tier is `medium`. The contract
    declares scale_relevance.tier `medium` on the same rule and the Validator
    confirms it (HV-4). C-PSCALE additionally measures at p = 1073741783 (2^30,
    60-bit F_{p^2}) and p = 1048571 (2^20, 40-bit F_{p^2}), which are `toy`;
    every C-PSCALE statement, including alpha_hat and the FC-4 firing, carries a
    `toy` ceiling and may not be cited above it. The extrapolated overhead
    parameter c carries NO claim tier at any field size, under any reading: it is
    a declared model substitution into RUN-WESOVOW-001's already-published
    scenario grid. AGENTS.md rule 7 applies in full: an 80-bit-field measurement
    over ell <= 211 is never cryptographic-scale validation.
  certificate_refs: []
  certificate_note: >-
    RUN-PEC-49c773-a declares result.certificate.kind = none with a stated
    reason: a pure measurement run claiming no discrete-log solve and no
    factor-base relation has nothing to certify in the sense of
    docs/claims-and-verification.md. The independent verification artifacts are
    controls, not solve certificates: C-ALT.1 (71760 roots re-evaluated by an
    uninstrumented Horner path, 0 failures), C-ALT.2 (root-set identity at all
    376 (ell, j) pairs), C-SEED (root-set identity at all 24 IMPL-B / IMPL-B'
    pairs under a genuinely different Cantor-Zassenhaus stream) and C-BASE.5
    (23772 chain relations, 0 nonvanishing). The Validator independently
    reconstructed C-ALT.2 over all 376 pairs and C-SEED over all 24, and
    reimplemented the frozen proof-of-concept's count() from
    inputs/P13-PANNY-POC/p-one-third.py, reproducing count(2,16)=46,
    count(2,64)=190, count(3,27)=218, count(3,81)=890, count(5,125)=2960 exactly.
  proof_status: derivation
  proof_status_justification: >-
    This record carries adverse sub-calls - that the reading "A-3 is a genuine
    rise of the per-entry exponent" is displaced by an implementation artifact,
    that assumption L5's derivation is contradicted in mechanism, and that the
    NC2b-G1 tolerance derivation omits a variance term. Per
    docs/claims-and-verification.md ("Refutation artifacts") the strongest
    checkable artifact each admits was sought BEFORE the call, and each is a
    checkable argument plus a committed instance rather than a machine-verified
    proof. Labelled `derivation`, never "proved".
    (i) A-3: the discriminating artifact is a NULL-OBJECT CONTROL ON THE
    EXPLANATION, not on the signal. The integer regressor depth(ell) - the number
    of Karatsuba recursion levels for operand length ell+1 at
    KARATSUBA_THRESHOLD = 16, read from the committed instrument
    experiments/EXP-PEC-6be870/implementation/per_entry_cost.py - takes
    -0.0749 bits per level on IMPL-B (R^2 0.999158 -> 0.999758, max |residual|
    0.0537 -> 0.0293 bits, 72 per cent of the residual variance) and +0.0066 on
    IMPL-A with the identical regressor. A regressor that explains the recursive
    routine and does nothing on the non-recursive one, on the same points, is the
    control. Both reviewers reached the mechanism independently and from
    different directions: the Red Team from the residual sawtooth phase-locked to
    the threshold, the Validator from reading that poly_rem_monic is schoolbook
    Theta(ell^2) and SHARED by both implementations.
    (ii) L5: the artifact is a pre-registered falsifier that FIRED against its own
    derivation - FC-4, |alpha_primary - alpha_null| = 0.1661896244 > 0.15 - on the
    run's own null arm, which is the nearby object for exactly this question.
    (iii) The NC2b-G1 tolerance: the artifact is the run's OWN confirmatory arm,
    NC2b-G1-prime, failing at W-TOP / log2 p = 768 by 0.920520 bits on an object
    whose true exponent is zero by construction, plus the analytic prediction
    intervals the Validator computed (VALIDATOR-SIDE, see SP-5 as extended).
    All three artifacts are internal to data committed at 84356221 BEFORE this
    record. The two review analyses that state the arguments are archived in the
    SAME ledger commit as this record (see archival_order_caveat).
  proof_refs:
    - coordination/goals/GOAL-P13-001/batches/BATCH-003/reviews/TASK-20260802-8e00fe/red_team_report.yaml
    - coordination/goals/GOAL-P13-001/batches/BATCH-003/reviews/TASK-20260802-c50ea2/validation_report.yaml
    - experiments/EXP-PEC-49c773/runs/RUN-PEC-49c773-a/raw-result.json
    - experiments/EXP-PEC-49c773/specification.yaml
    - experiments/EXP-PEC-6be870/implementation/per_entry_cost.py
  proof_refs_loci:
    karatsuba_band_control: >-
      red_team_report.yaml RT3-C2 (per-band residual profile, the depth
      regressor, the per-band local slopes, the decomposition
      0.8919 - 0.0749 = 0.8170 against the measured W-MID slope 0.8100) and
      counterexample_or_mutation; validation_report.yaml anomaly_assessments A-3
      (the shared schoolbook poly_rem_monic, the A/B ratio saturation 1.000 at
      ell 13 -> 1.295 at 101 -> 1.396 at 151 -> 1.4055 at 199 -> 1.4049 at 211,
      and the W-TOP collapse of the exponent gap to 0.012692). The instrument
      line references (KARATSUBA_THRESHOLD at per_entry_cost.py line 214,
      poly_rem_monic at lines 236-240) are to the file committed at 49166fa5 and
      byte-unchanged since, SHA-256
      aea73ef79c3bdf6091b1fd61950bd8449618b295effd9d39a096f65197020ef1.
    fc4_firing: >-
      raw-result.json controls.C-PSCALE; execution_report.yaml anomaly A-2;
      validation_report.yaml M-5 (alphas reproduced to 2e-16) and V-7;
      red_team_report.yaml RT3-C3 (the ell-restricted table).
    gate_power_and_its_limit: >-
      raw-result.json nc2b.gate (10 evaluations) and its power_check (the
      superseded law missing REF_null by 12.176314 to 12.605090 bits and failing
      all ten); validation_report.yaml M-2, A-1 and V-1; red_team_report.yaml
      RT3-C6.
    entry_weighting_bias: >-
      red_team_report.yaml RT3-C1 (exact enumeration at (X, B) = (10^7, 100) and
      (10^8, 215), plus a Dickman asymptotic with a marching rho validated at
      rho(2) = 0.3068528, rho(4) = 0.00491093, rho(8) = 3.2321e-8). This is a
      RED-TEAM-SIDE derivation over committed constants, not a run measurement,
      and is cited as a review finding under SP-5 as extended.
    archival_order_caveat: >-
      The run package, including every per-sample residual the band control is
      computed from, the full-range null, and C-REPRO, was archived at 84356221
      (TASK-20260802-18f85d) BEFORE this record, as the refutation-artifact rule
      requires. The two BATCH-003 review reports that state the arguments are
      assigned to THIS ledger archive (TASK-20260802-c1f7c8,
      archive.source_task_ids) and to no other archival task, so they must be
      staged in the same commit as this record; a decision resting on an
      uncommitted review is not durable evidence. Recorded as a sequencing
      observation and not repaired by back-dating anything - the identical
      observation was recorded in EV-PEC-2e67ff for BATCH-002.

  scope_of_the_measurement:
    instance: >-
      p = 1099511627563, the largest prime below 2^40 congruent to 3 mod 4 -
      independently re-derived by the Validator, which searched downward from the
      bound and confirmed primality by Miller-Rabin on 12 bases. F_{p^2} =
      F_p[T]/(T^2 + 1), field_bits 80. Seed curve E_0 : y^2 = x^3 + x, j = 1728,
      supersingularity controlled by C-BASE.1 rather than by citation alone.
      C-PSCALE additionally measures at p = 1073741783 (2^30) and p = 1048571
      (2^20), both verified prime, = 3 mod 4, and largest below their bounds.
    degrees: >-
      47 prime isogeny degrees over 2 <= ell <= 211, ALL acquired and ALL
      admitted, 0 excluded by any membership condition. Core grid complete at 26
      primes INCLUDING ell = 97, which RUN-PEC-6be870-a lost to a transient
      curl-35 obstruction; extension complete at 21 primes 103..211. 8 j-indices
      at every admitted ell under BOTH implementations, at the identical j-set
      {0..7}. 752 primary samples, 752 null samples, 24 C-SEED samples,
      4298701780 counted F_{p^2} multiplications. The optional tail 223..251 was
      not attempted (deviation D-2); the Validator verified from the committed
      superseded record that all seven tail ell return curl exit 63 against the
      frozen 67108864-byte per-ell cap, so its expected yield is zero.
    implementation: >-
      The SAME pure-Python implementation pair as RUN-PEC-6be870-a, imported by
      path with its SHA-256 recorded and matched: IMPL-A schoolbook, IMPL-B
      Karatsuba, sharing every line except poly_mul. The modular reduction
      poly_rem_monic is schoolbook in BOTH. SageMath is not installed; the frozen
      Panny proof-of-concept was not executed and served as a frozen algorithmic
      reference and baseline fixture only.
    unit_and_conventions: >-
      One counted F_{p^2} multiplication (a squaring counts 1), carried unchanged
      from the superseded contract, because that is the unit Section 4.1 costs at
      1 per entry (C-BASE.6, gamma_paper = 0). Additions and subtractions not
      counted; inversions in a separate register; Phi_ell storage and I/O,
      coefficient reduction, hashing and table access excluded - all in the
      attack's favour, so the measured exponent is simultaneously a LOWER bound
      with respect to those components. The two directions are NOT netted.
    budget: >-
      One run, 791.751 s wall of a 5400 s allowance, 2540.126 CPU-s = 0.706
      CPU-hours of a 6.0 CPU-hour allowance, peak RSS 0.1371 GiB of 8 GB.
      maximum_runs 1 honoured; no phase deadline was hit. NC2b was complete and
      on disk at t = 0.015 s against its 600 s hard gate.

  coordinator_validity_pre_checks:
    performed_before_any_interpretation: true
    expected_run_count: >-
      1 authorized (maximum_runs 1), 1 executed, 1 terminal, 0 invalid, 0 failed.
      Two reduced-grid code rehearsals were executed into session scratch before
      the authoritative launch and are DISCLOSED in the execution report; nothing
      they produced entered the repository, they are cited as evidence nowhere,
      and they consumed no run id. Disclosure rather than omission is the correct
      handling.
    manifest_schema: >-
      Complete. One literal gap persists and is carried from BATCH-002 finding
      F-8: the inference block cannot name a concrete probe-verified resolved
      model identifier, because this runtime does not expose one to the subagent.
      That is the honest course under INFAMEND-20260802-P13-002, and the
      requirement is recorded as UNVERIFIED rather than asserted as met.
    seed_integrity: >-
      All seeds recorded: 8 walk seeds, n_walk = 120, bootstrap seed 20260802,
      the Cantor-Zassenhaus seeding rule, and the C-SEED stream label. C-REPRO
      reproduces 884 overlapping samples of RUN-PEC-6be870-a bit-for-bit on every
      counted field, independently reconstructed by the Validator by indexing
      both runs and intersecting, with six spot checks of its own choosing.
      C-SEED confirms the alternative stream is genuinely different (cz_attempts
      differ at 23 of 24 pairs; the seed strings differ) while the root sets are
      identical at all 24.
    raw_summary_agreement: >-
      NUMBERS AGREE; LABELS DO NOT, AND THE DISTINCTION IS THE FINDING. The
      Validator recomputed from raw per-sample data with its own code: all nine
      linear fits to deviation 0.0e+00, all fifteen nested quadratics to 8.5e-10,
      the corrected c at 120 rows to max |dc| = 4.441e-16, the C-PSCALE alphas to
      2e-16, the null gate to the last reported digit, and its own sum of
      per-sample costs 4298701780 equal to the recorded total. Against that, five
      LABELLING defects (V-2, V-3, V-4, V-5, V-6) and one machine-readable
      hierarchy inversion (RT3-C10a) are recorded below in
      record_integrity_defects. None changes a gating number; all are corrected
      here by superseding note and never by editing an archived file.
    control_comparability: >-
      The null object is of the same shape as the primary - same harness, same
      counting unit, same denominator convention, ell+1 entries by ell+1
      successive non-backtracking 2-isogeny steps - and its per-entry cost is
      O(1) in ell BY CONSTRUCTION. Coverage is now a PRECONDITION of membership
      (condition C-3) and the null runs before the primary, so the BATCH-002
      coverage gap cannot recur under any truncation. Two comparability limits
      remain and are carried: F-4's independence limb is NOT restored by design
      (gamma_A and gamma_B share the split structure), and C-NULL is flat by
      construction, so it has no power against assumption L1 (RT3-C6).
    conclusion: >-
      The run set is VALID AND ADMISSIBLE and is NOT returned to the Executor. No
      defect found by either reviewer is an execution defect. The one protocol
      deviation with a governance edge (D-1) is a COORDINATOR defect and is
      recorded as such in DEC-20260802-48c72c.

  observations:

    - id: OBS-A
      subject: "Receipt integrity, supersession integrity, and independent reproduction"
      text: >-
        Validator VAL-20260802-5a24d2 (TASK-20260802-c50ea2, independent
        session): verdict VALID-WITH-OBSERVATIONS, i.e. admissible evidence at
        the scope the run declares; 12 of 12 gating controls PASS on the
        Validator's own recomputation, with C-PSCALE the non-gating thirteenth,
        executed and correctly classified. All ten declared artifacts present;
        thirty hash comparisons (working tree, committed blob, receipt) agree;
        commit 84356221 reachable from HEAD with parent 809490aa, changing
        exactly the eleven declared paths. SUPERSESSION INTEGRITY VERIFIED BY GIT
        RATHER THAN BY INSPECTION: the tree object of experiments/EXP-PEC-6be870/
        is 970ecafc7db69ffda56aa9e6341863040cc054a1 at 49166fa5, at 84356221 and
        at HEAD, with no intervening commit touching the path and a clean
        worktree - so the superseded run was treated as read-only input data
        exactly as the contract's invalidation rule demands. The frozen contract
        is byte-unchanged since its own snapshot e9a850f2 (SHA-256
        2d53dbda3834674187e180726d4201bbf80debf92f719b4e897156454f8147f0), so
        every prediction, tolerance, window, estimator, pairing rule and
        falsification consequence was fixed before any datum of this run existed.
        The Red Team independently confirmed the working tree matches 84356221
        and refitted all six (series x window) fits itself, reproducing every
        printed digit.
    - id: OBS-B
      subject: "THE REPAIR HOLDS - NC2b's null gate PASSES, and the superseded law fails the same gate by a factor of about seventeen"
      text: >-
        NC2b-G1, the gate of record on the committed null, PASSES. Worst
        |N_null - REF_null| = 0.271670 bits of a pre-registered 0.75-bit
        tolerance, at (W-MID, log2 p = 768), leaving 0.478330 bits of margin. The
        Validator recomputed the gate from RUN-PEC-6be870-a's committed
        controls.C-NULL.per_ell_per_entry with its own implementation of the
        frozen law and agrees at every one of the evaluation points to every
        digit reported, including the worst case and the margin, and confirms
        that the tolerance (0.75), the evaluation level (alpha = 0) and the
        reference statistic (median over the window's own fitted ell of
        log2 per_entry_null) are the ones the frozen contract fixed - not relaxed
        ones. POWER, INDEPENDENTLY REPRODUCED: applying the SUPERSEDED law
        N = gamma_null * log2(B_opt) (i.e. A = 1) to the same null object gives
        misses of 12.176314 to 12.605090 bits, worst 12.605090 at (W-MID, 768),
        failing at every point. The gate therefore has real power against the
        exact defect it was built to catch. c_null at NIST-I, W-MID, alpha = 0 is
        0.759087 against the ~0.77 pre-registered in DEC-20260802-8227b9's
        repair clause. The corrected c from the CARRIED superseded W-MID fit
        (log2 A = 8.924066290325673, gamma = 0.9739199259643186 - confirmed by
        the Validator as exactly the committed superseded values) is 1.422108 at
        alpha = 0 and 1.589488 at alpha = 1 at NIST-I; both were independently
        reproduced, as were the other eight rows and all 30 rows of the NC2b
        table.
    - id: OBS-C
      subject: "THE GATE IS WEAKER THAN ITS MARGIN SUGGESTS - a contract defect, not an execution defect (Validator V-1)"
      text: >-
        THE TOLERANCE DERIVATION HAS NO VARIANCE TERM. The frozen contract fixed
        0.75 bits from the committed null's REALISED properties only - 0.202 bits
        of flatness span plus |gamma_null| * log2(B_opt) = 0.346 bits, summed to
        about 0.55 and rounded up. The extrapolated level N = a + b*x0 inherits
        the null slope's SAMPLING error multiplied by a lever arm of up to
        log2 B_opt = 26.1, and that term is absent. Validator-side analytic OLS
        95 per cent prediction intervals: committed null W-MID at
        log2 B_opt = 14.2 gives +/- 0.1506, at 26.1 gives +/- 0.3523; the NEW
        8-point W-TOP null gives +/- 0.4875 and +/- 1.3626 respectively.
        CONSEQUENCE, WHICH BOTH FACTS BELONG IN THE RECORD TOGETHER: the observed
        worst miss 0.271670 sits comfortably inside its own +/- 0.3523 noise
        band, and the remaining 0.478330 bits is about 1.4 noise half-widths -
        so the PASS is a genuine pass at the frozen tolerance and is a ONE-NOISE-
        UNIT pass, not a 0.478-bit cushion. On the 8-point W-TOP arm the fixed
        0.75-bit tolerance is roughly HALF the 95 per cent half-width of the very
        quantity it constrains, so the failing confirmatory arm A-1 has
        essentially no resolving power in either direction: its failure is not
        evidence that the estimator is biased at 768 bits, and a pass there would
        not have been evidence that it is unbiased. ATTRIBUTION: this is a defect
        in the FROZEN CONTRACT's tolerance derivation, which the Coordinator
        wrote, not an Executor deviation; the Executor applied the frozen number
        and reported the disagreement, which is the correct handling. The gate
        nevertheless still discriminates against the defect it was built for
        (12.605090 bits against 0.75), and that is why both facts are recorded
        rather than one.
    - id: OBS-D
      subject: "THE SEAM IS GONE, and its size is confirmed by direct measurement (Validator F-1: RESOLVED)"
      text: >-
        47 acquired ell, 47 admitted, 0 excluded. The Validator did not read the
        producer's membership code: it rebuilt the response from the 752
        per-sample records, required the frozen membership conditions C-1..C-4
        directly, aggregated by median over the common j-set and refitted. Both
        implementations carry data at EVERY admitted ell at the IDENTICAL j-index
        set {0..7}, so the pointwise minimum is evaluable everywhere and the
        response cannot switch constituent. The superseded-comparison table shows
        exactly 25 of 46 overlapping ell at zero difference - precisely the core
        grid where the superseded response already used IMPL-B - and 21 nonzero,
        ALL on the extension 103..211 and ALL negative. At ell = 103 the
        difference is -0.378627 bits, reproducing the +0.3731-bit definitional
        step BATCH-002 measured at the seam. The step across 101 -> 103 falls
        from 0.395971 bits in the superseded mixed response to 0.017345 bits in
        this run's S-MIN, against 0.027440 bits expected from a smooth exponent
        of ~0.97. ell = 97 was re-acquired at 5651385 bytes with SHA-256
        093fead98fcde6966e652ac2651552f8be050c4433f6d7f341baaf71dc3d16ab -
        exactly the byte length and hash the Validator obtained when it fetched
        that URL itself during BATCH-002 - so the BATCH-002 obstruction is
        confirmed transient and this run's core grid is complete at 26 primes.
        47 of 47 fetches returned HTTP 200 with no obstruction.
    - id: OBS-E
      subject: "NULL COVERAGE IS NOW 100 PER CENT OF EVERY FITTED WINDOW, structurally rather than by luck (Validator F-3: RESOLVED)"
      text: >-
        C-NULL coverage as an explicit fraction: W-ALL 47 of 47 = 1.0000, W-MID
        43 of 43 = 1.0000, W-TOP 8 of 8 = 1.0000. The Validator verified this by
        reconstructing the null sample index rather than by reading the coverage
        field, confirming the null ell set is EXACTLY the admitted ell set with
        all 16 (implementation, j_index) combinations present at each of the 47
        ell, and recomputing the per-ell null aggregate with maximum deviation
        0.0 at every ell. Its own refits: gamma_null = +0.003268842163 (W-ALL,
        n=47), -0.003547422350 (W-MID, n=43), +0.049694860976 (W-TOP, n=8), all
        |.| <= 0.15 with bootstrap CIs containing zero; full-grid flatness
        4914.45 / 5118.83 = 0.9601 over ell 2..211, inside the required
        2^{+/-0.5}. THE REPAIR IS STRUCTURAL, WHICH IS THE RIGHT KIND: coverage
        is a PRECONDITION of membership (condition C-3), not a verdict recorded
        afterwards, and the null runs at execution_order step 5 before the
        primary - confirmed by the Validator from the archived phase timings and
        the stdout transcript. Under this construction F-3 cannot recur under any
        truncation.
    - id: OBS-F
      subject: "F-4 PARTIALLY RESOLVED - the correctness limb is bought back and verified; the independence limb is NOT restored, by explicit design"
      text: >-
        The contract RETAINED the paired Cantor-Zassenhaus stream (seeded on
        (ell, j_index), not on implementation) and bought back the correctness
        half through the new control C-SEED, stating the trade in both directions
        and making the loss BINDING. C-SEED: 24 pairs at ell {11,23,53,101,127,
        211} x j {0..3}; the Validator confirmed the streams genuinely differ
        (cz_attempts differ at 23 of 24 pairs, e.g. 12 vs 21 at ell = 11, j = 0)
        while root-set identity holds at all 24 on its own roots_sha256
        comparison, and reproduced the cost ratio range [0.977665, 1.100636],
        median 0.999217. So a shared-pipeline defect that survives a change of
        SPLIT STRUCTURE is now excluded on those 24 samples, which C-ALT.2 alone
        could never have shown. WHAT IT DOES NOT BOUND: C-SEED covers 6 of 47 ell
        (12.8 per cent), 4 of 8 j, and one implementation, and the receipt
        computes no gamma_B' at all, so it bounds the per-sample split-structure
        cost ratio and NOT the effect on the FITTED EXPONENT, which is the
        quantity F-4 was about.
        THE BINDING CONSEQUENCE, CARRIED HERE BECAUSE THE RUN'S MOST-QUOTED FILE
        OMITS IT (finding V-4): gamma_A and gamma_B REMAIN NON-INDEPENDENT
        ESTIMATES. No record may present their agreement, or their difference, as
        agreement between two independent implementations. Their difference
        0.1228308054 is a measurement of the MULTIPLICATION-ROUTINE effect under
        a FIXED SPLIT STRUCTURE and nothing more.
    - id: OBS-G
      subject: "The seam-free measurement: exponents, levels, and the five pre-registered verdicts"
      text: >-
        Primary window W-MID (43 admitted ell >= 11), all recomputed by the
        Validator from raw samples at deviation 0.000e+00 and independently
        refitted by the Red Team to every printed digit:
        S-A gamma 0.9328644281, log2 A 9.2983509117, se 0.00222577, R^2
