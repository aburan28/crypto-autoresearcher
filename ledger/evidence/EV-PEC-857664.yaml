        ell, for this pipeline. The measured approach 0.887 -> 0.965 is an
        approach to that ceiling from below, not an unbounded rise, and the
        c = 2 scenario - which needs per-entry ~ ell^2 - is killed by a METHOD
        CEILING rather than by a flat measurement. DEC-20260802-8227b9
        adjudication D's retirement of that scenario is therefore confirmed on a
        stronger basis than it was made on.
