    - id: OBS-J
      subject: "RT3-C1 - AN OBJECTION THAT CUTS AGAINST THE RED TEAM'S OWN PRIOR WORK, and is quantified for the first time"
      text: >-
        GIVEN FULL WEIGHT BECAUSE IT MOVES THE NUMBER TOWARD THE ATTACK AND
        AGAINST THE OBJECTION THAT FORCED THIS BATCH. Charging the full per-entry
        cost at ell = B_opt OVERSTATES the table-build overhead. Algorithm 1's
        outer loop is `for ell <= B`, so with ell taken in increasing order an
        entry of degree d receives its final extension at ell = P(d), the LARGEST
        PRIME FACTOR of d, and Lemma 3.3 charges each batch of (<=) ell+1 new
        entries at the cost of computing the ell-neighbours. The correct
        multiplier is therefore the ENTRY-WEIGHTED MEAN of ell^gamma over the
        distribution of P(d), not B_opt^gamma. QUANTIFIED (Red-Team-side
        derivation over committed constants, not a run measurement): by EXACT
        ENUMERATION of every B-smooth d <= X with its largest prime factor,
        weighted by d and cross-checked against a psi(d) weighting that changes
        the answer by less than 0.001 - at (X, B) = (10^7, 100), w = 3.500,
        269882 smooth d: Delta = 0.598 bits at gamma 0.810 and 0.676 at gamma
        0.933, mass fraction with P(d) <= B/2 = 0.335; at (10^8, 215), w = 3.430,
        2792530 smooth d: Delta = 0.625 and 0.704, mass fraction 0.384. By
        DICKMAN ASYMPTOTIC with a marching rho validated at rho(2) = 0.3068528,
        rho(4) = 0.00491093, rho(8) = 3.2321e-8: NIST-I Delta = 0.868 (gamma
        0.810) / 0.969 (gamma 0.933); log2 p = 768: 0.899 / 1.001. THE HONEST
        RANGE IS Delta = 0.60 to 1.00 BITS AT EVERY FIELD SIZE, i.e. c at NIST-I
        is OVERSTATED by 0.038 to 0.063 and the modelled NIST-I margin is
        UNDERSTATED by 0.6 to 1.0 bits. ARTIFACT CHECK, applied to the
        correction itself: Delta should be nearly flat across the five field
        sizes because w moves only from 3.49 to 5.40, and it is (0.87-0.90); a
        Delta varying strongly across those rows would have been the artifact
        tell. STATUS: assumption L2 DECLARED this and got its sign right
        ("attack-unfavourable within the law ... the entry-weighted mean of
        ell^gamma is at most B^gamma"); nobody priced it until now. An eliminated
        modelling dimension is not free until its own cost is charged. The
        correction is NOT applied to any archived row - it shifts the whole table
        uniformly and changes no ordering - and every margin figure in this
        record is therefore 0.60 to 1.00 bits PESSIMISTIC.
    - id: OBS-K
      subject: "A PRE-REGISTERED FALSIFIER FIRED (FC-4), IT IS LOCALISED, AND IT IS NOT TALKED AWAY"
      text: >-
        FC-4 FIRED. C-PSCALE's primary arm gives alpha_hat = 1.1596976732
        (pooled with ell fixed effects) against a null arm of 0.9935080487, a gap
        of 0.1661896244 > 0.15, so the designation is MECHANISM-INCONSISTENT with
        the primary alpha designation unchanged - exactly the pre-registered
        consequence, applied as written. This matters because the contract's own
        derivation argued the p-scaling is a property of the SHARED poly_powmod
        loop and must therefore be common to both objects; the measurement
        contradicts that argument. Assumption L5 is now DERIVED-AND-CONTRADICTED-
        IN-MECHANISM rather than merely DERIVED.
        THE DIAGNOSIS (RT3-C3): the firing is driven by ell = 3 and ell = 5 and
        nothing else. Same estimator, same committed medians, only the ell set
        restricted: {3,5,7,11,13} gives gap 0.1662, FIRES, band OUT; {7,11,13}
        gives 0.0178, no fire, band IN; {11,13} gives 0.0015, no fire, band IN.
        The per-ell primary values fall monotonically (1.2614, 1.2377, 1.0940,
        1.1181, 1.0873) while the per-ell null values rise (0.8590, 0.8625,
        1.0436, 1.1056, 1.0968). Three reasons the small-ell end is the wrong
        place to measure alpha, all read off committed artifacts: all five ell
        lie BELOW KARATSUBA_THRESHOLD = 16, so the IMPL-A and IMPL-B cost
        multisets are BIT-IDENTICAL there and the "primary arm" is a
        schoolbook-only measurement saying nothing about the series that supplies
        the bracket's low end; anomaly A-4 records that the two largest W-MID
        residuals are at ell = 11 and 13, so alpha is estimated where the primary
        fit is at its worst; and only ell = 11 and 13 lie inside W-MID at all.
        THE GOVERNANCE POSITION, ADOPTED AS THIS RECORD'S OWN AND STATED BY THE
        RED TEAM AGAINST ITS OWN ANALYSIS: A POST-HOC RESTRICTION OF THE ell-GRID
        CANNOT LIFT A PRE-REGISTERED FALSIFIER. FC-4 fired as written, the
        MECHANISM-INCONSISTENT designation STANDS, and the Executor was right not
        to touch it. What the analysis buys is a diagnosis and a successor design
        (NC2d-PROPER), not a lifting. That distinction is the difference between
        a diagnosis and an excuse.
        FC-2 CORRECTLY DID NOT FIRE, AND THE CLASSIFICATION IS THE RIGHT ONE. The
        jackknife interval [1.1342844597, 1.1778020727] OVERLAPS the
        pre-registered [0.85, 1.15] band without containment, because
        1.1342844597 < 1.15. FC-2 requires DISJOINT. The alternative per-ell
        reading [1.0872800752, 1.2613505271] gives the same classification, and
        the Validator verified both. A NEAR-MISS THAT BELONGS ON THE RECORD: the
        point estimate would have had to be 1.1754 rather than 1.1597 - a 1.35
        per cent move - for FC-2 to fire, so alpha = 1 is alive by a hair rather
        than comfortably.
        PROPORTION: the whole alpha question is worth
        log2(256/40) * (1.1597 - 1) = 0.4277 bits at NIST-I and 0.6809 bits at
        log2 p = 768. FC-4 fired on the smallest term in the corrected law.
        SCALE CEILING: three points at 40-, 60- and 80-bit fields, i.e. a
        toy-ceilinged three-point basis for statements at 256..768 bits.
    - id: OBS-L
      subject: "The dominant residual term is unchanged and unmeasured, and the Red Team checked and discarded its own candidate replacement"
      text: >-
        RT2-C4 recomputed against the corrected law (RT3-C8): the removable
        ell-dependent part is gamma * log2(B_opt). For S-B/S-MIN W-MID that is
        0.810034 * 14.2 = 11.502 bits of a 21.233 (alpha 0) to 23.911 (alpha 1)
        bit total, 48 to 54 per cent; for S-A W-MID it is 0.932864 * 14.2 =
        13.247 bits of 22.545 to 25.223, 53 to 59 per cent. In BATCH-002 the
        figure was 13.25 of 25.43 (52 per cent), so the seam removal lowered the
        ABSOLUTE term while the SHARE held at roughly half. IT REMAINS THE SINGLE
        LARGEST RESIDUAL TERM IN THE COST MODEL - larger than the entire
        measured-gamma span (4.805 bits of margin), the alpha question (0.43),
        L2 (0.60-1.00), A-3 (1.01), and three to six times the irreproducibility
        bands.
        AN OBJECTION THE RED TEAM RAISED AGAINST ITSELF, CHECKED, AND DISCARDED -
        RECORDED RATHER THAN PRESSED: a candidate Theta(ell) instantiation floor
        immune to faster multiplication. mults_instantiate is EXACTLY
        (ell+1)(ell+2) at all 752 committed samples (the Validator confirms 752
        of 752 independently), i.e. ell+2 multiplications PER ENTRY, a gamma = 1
        term worth 14.2 bits at ell = 2^14.2, which under a quasi-linear
        root-finding scenario would dominate and reinstate gamma = 1. IT DOES NOT
        SURVIVE: Algorithm 1 specialises Phi_ell at N ~ M/ell >> ell arguments
        per ell, and multipoint evaluation of the ell+2 coefficient polynomials
        at N arguments costs O~(ell^2 + N*ell), i.e. O~(1) per entry once
        N >> ell; the same argument batches the root-finding to O~(log p) per
        entry. So the post-batching floor is O~(log p), not Theta(ell), and
        RT2-C4 stands. The p-independence guard also holds under extrapolation
        and was checked rather than assumed: f_indep rises only from 0.002116
        (ell = 11) to 0.002265 (ell = 211), extrapolating to ~0.008 at
        ell = 2^14.2 and p = 2^40 and ~0.0012 at p = 2^256, against a 0.05
        threshold, so FC-3 correctly does not fire and the whole-intercept
        scaling stands (max f_indep = 0.0032546786, independently confirmed).
        FLAGGED, UNVERIFIED, AND RELIED ON BY NOTHING: the Red Team's
        recollection that Sutherland's modular-polynomial evaluation is
        O~(ell^2) per specialisation. The source was not retrieved this session -
        the third consecutive batch in which this programme has not fetched it -
        and no number in this record depends on it.
    - id: OBS-M
      subject: "Modelled NIST-I margin arithmetic at w = 2^30 - a model substitution carrying NO claim tier"
      text: >-
        Red-Team recomputation from committed constants (log2 T_full =
        108.73088958800618, T_DG = 2^128, log2 B_opt = 14.2 from RUN-WESOVOW-001;
        (log2 A, gamma) from RUN-PEC-49c773-a), using the committed model's own
        vOW interpolation margin(w) = 128 - (108.73089 - 0.5*log2 w +
        overhead_bits). Base margin at zero overhead 34.2691.
        EIGHTEEN MEASURED-GAMMA READINGS (6 fits x 3 alphas) land in
        [8.3498, 13.1544], a span of 4.805 bits: most adverse S-A W-TOP at
        alpha_hat (overhead 25.9193, c 1.619957, margin 8.3498); least adverse
        S-B W-ALL at alpha 0 (21.1147, 1.319669, 13.1544). The worst clears the
        2.2309-bit NIST-I time irreproducibility band by 6.1 bits and the
        3.5133-bit maximum-deviation band by 4.8 bits.
        HEADLINE BRACKET ROWS: BRACKET LOW S-B/S-MIN W-MID alpha 0 (21.2332,
        1.327077, 13.0359); S-A W-MID alpha 0 (22.5450, 1.409064, 11.7241);
        S-B W-MID alpha 1 (23.9113, 1.494456, 10.3578); BRACKET HIGH S-A W-MID
        alpha 1 (25.2231, 1.576444, 9.0460); S-B W-MID at alpha_hat (24.3390,
        1.521187, 9.9301); S-A W-MID at alpha_hat (25.6508, 1.603174, 8.6183);
        A-3 reading S-B W-TOP alpha 1 (24.9183, 1.557395, 9.3508); RT3-C2
        saturation reading, S-B intercept with gamma -> gamma_A, alpha 0
        (22.9781, 1.436129, 11.2910).
        ADDING L4 (batched/quasi-linear evaluation, UNIMPLEMENTED) opens the span
        to [8.3498, 22.2927] at alpha = 1 throughout (width 13.9429) or
        [8.3498, 24.9708] allowing alpha in {0, 1, alpha_hat} (width 16.6210).
        CORRECTIONS NOT APPLIED TO THESE ROWS, NAMED SO THEY ARE NOT LOST: every
        row is 0.60 to 1.00 bits PESSIMISTIC by RT3-C1 (OBS-J); RT3-C9's
        symmetric-realism term, plausibly 5-7 bits back to the attack, is
        unmeasured and deliberately applied to no row; and the end-to-end
        baseline constant k from the frozen bibliography's [15] and [3] remains
        unquantified after three batches, in the attack's disfavour if k > 1.
        EVERY NUMBER IN THIS OBSERVATION IS A MODEL SUBSTITUTION UNDER L1-L6 AND
        CARRIES NO CLAIM TIER. None of it is a measured cryptographic-scale
        margin.
    - id: OBS-N
      subject: "What this batch does NOT touch, recorded so the caveats are not lost among the results"
      text: >-
        NOTHING HERE BEARS ON HEURISTIC 1, and the run says so itself. The Red
        Team's July objections RT-H1..RT-H4 remain open and untouched: the
        paper's Figures 1-2 test the BODY of the smoothness distribution while
        Heuristic 1 is a TAIL statement at u ~ sqrt(log p); the walk-based
        quaternion sampler is unvalidated; the ell = 2 parity channel is
        untested; and the disjointness content has no supporting data anywhere in
        the record. Controls NC-3 and NC-6 remain UNRUN since BATCH-001. This is
        entered here rather than deferred because P0 sits inside EVERY margin row
        in OBS-M: a constant-factor error in P0 at the operating point moves all
        of them by the same amount, so a programme that has now resolved the
        measured-gamma contribution to a 4.805-bit span while P0 carries an
        unbounded constant-factor uncertainty has three of four batches spent on
        a term that is not the binding one.
        RT3-C9, RECORDED AS A NEAR-MISS SO NOBODY ELSE MAKES THE INFERENCE: the
        C-NULL object walks ell+1 non-backtracking 2-ISOGENY steps and measures
        4914.45 to 5118.83 counted multiplications per step (2^12.26 to 2^12.32)
        at p ~ 2^40. It is tempting to read that as a measured Delfs-Galbraith
        walk-step cost, which would return ~12.3 bits (14.9 scaled to 256) to the
        attack's margin and roughly halve the corrected overhead. THAT READING IS
        WRONG AND IS PROHIBITED: the null's 2-isogeny step is computed through
        Phi_2 root-finding on the same pipeline and inherits the whole
        2*log2(p^2) exponentiation, whereas a competent Delfs-Galbraith
        implementation walks by Velu on a 2-torsion point at tens of F_{p^2}
        operations plus one subfield test. The asymmetry is not merely a
        convention: the attack genuinely needs Phi_ell at ell ~ 2^14.2 while
        Delfs-Galbraith only ever needs 2-isogenies. RT2-C7 therefore stands
        exactly as scoped - a one-sided anti-attack bias of known sign and
        unmeasured magnitude - and NC2f, not this batch, measures it.

  corrections_note: >-
    Each correction is recorded here because the artifact carrying the error is
    immutable. Nothing archived is edited (AGENTS.md rule 4). Where a
    correction bears on a prior official record, that record's prior text is
    preserved and the correction is stated beside it.
  corrections_to_this_programmes_own_record:
    - id: CORR-1
      what: "The NC2b-G1 evaluation count is TEN, not fifteen."
      detail: >-
        NC2b-G1 is evaluated on 2 null windows x 5 field sizes = 10 points, and
        raw-result.json's nc2b.gate.evaluations list contains exactly 10 entries,
        as does its power_check list. Fifteen is NC2b-G1-PRIME's count (3 windows
        x 5 fields). The wrong count appears in manifest.yaml (internally
        contradictory, since it also writes "2 null windows x 5 field sizes"), in
        execution_report.yaml, and in the orchestrating session's snapshot commit
        message for 84356221 - which is immutable, so the correction must live
        here. Both reviewers caught it independently (Validator V-5, Red Team
        RT3-C6).
      what_does_not_change: "The verdict PASS, the worst case 0.271670 bits at (W-MID, log2 p = 768), and the margin 0.478330 are all correct."
    - id: CORR-2
      what: "gamma(S-MIN, W-MID) is 0.8100336226739335; the digit string 0.8100343886 is not in the archive."
      detail: >-
        The value 0.8100343886 was relayed in session prose (the dispatching
        message for TASK-20260802-c50ea2 and again for this task) and appears
        NOWHERE in the run package. The archived value is 0.8100336226739335 and
        the Validator's independent refit from raw samples gives exactly
        0.8100336226739335. The discrepancy is in the handoff prose, not in the
        receipt.
      what_does_not_change: "Nothing. The two differ in the seventh decimal place and are immaterial at every reported precision. Recorded so the archive remains the authority over session prose."
    - id: CORR-3
      what: "'The run measured A directly' is withdrawn. A is the fit's extrapolation to ell = 1."
      detail: >-
        RT3-C7, the Red Team retracting its own RT2-C1 sentence. There is no
        ell = 1 datum and there cannot be: Phi_1 is not in the design, the
        smallest measured ell is 2, and W-MID's smallest is 11, so the intercept
        sits 3.46 octaves below the nearest observation on the primary window. A
        is a fitted parameter at an unobserved abscissa. DEC-20260802-8227b9
        adjudication A repeated "while the run measured A = 2^8.924 directly",
        and EV-PEC-2e67ff OBS-E carries the same phrasing; both are immutable and
        both are CORRECTED HERE. This is a correction to this programme's OWN
        prior official record, not only to a reviewer's.
      what_does_not_change: >-
        The substance and the binding prohibition of adjudication A are
        unaffected, because the corrected law never uses A alone: it uses
        log2 A + gamma * log2(B_opt), the fit's PREDICTED LEVEL AT ell = B_opt,
        and the repair prices that COMBINATION with a joint bootstrap rather than
        pricing the intercept. THE CORRECT PHRASING, binding on every downstream
        record: "the fitted per-entry cost curve, evaluated at ell = B_opt, is
        21.2 to 25.2 bits above Section 4.1's convention", never "the measured
        prefactor is 2^9.73". The ell-INDEPENDENT floor is separately and BETTER
        evidenced by the null object's own measured level REF_null = 12.2595
        bits, which IS a measurement.
    - id: CORR-4
      what: "'Flat at 0.93-0.97 with no acceleration whatever' is withdrawn; the correct statement is a BOUNDED approach to the schoolbook ceiling."
      detail: >-
        The Red Team withdraws its BATCH-002 RT2-C2 sentence. The seam-free
        per-band local slopes for IMPL-A rise monotonically: 0.8871 (ell 17..31),
        0.9420 (37..61), 0.9452 (67..127), 0.9647 (131..211) - a rise of 0.078
        across four bands, consistent with the Validator's 0.0225 curvature and
        inconsistent with "no acceleration at all". The BATCH-002 rolling-window
        table was too coarse to see it.
      what_this_does_to_DEC_20260802_8227b9_adjudication_C: >-
        THE RULING SURVIVES ITS INPUT BEING CORRECTED, AND THAT IS SAID PLAINLY
        RATHER THAN GLOSSED. Adjudication C(3) cited the Red Team's "then flat at
        0.933-0.972 out to ell 197" profile in support of the small-ell-
        concentration ruling, and that profile is now corrected. The ruling
        nevertheless holds, for two reasons that do not depend on it. FIRST, the
        discriminating control adjudication C itself named - a homogeneous
        nested-window curvature with bootstrap CIs on a seam-free series - now
        exists and rules the same way: S-A gives 0.022425 (W-ALL) -> 0.011169
        (ell >= 11) -> 0.006708 (ell >= 23) -> 0.007982 (ell >= 43) -> 0.016042
        (ell >= 101, CI [-0.000697, +0.039126] INCLUDING ZERO). Dropping the four
        smallest ell halves it and at the top of the range it is no longer
        distinguishable from zero. SECOND, the Coordinator's own BATCH-002
        consistency arithmetic in adjudication C(2) PREDICTED a rise of 0.207
        bits of slope between the Red Team's bottom and top homogeneous windows
