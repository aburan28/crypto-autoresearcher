    - id: OBS-I
      subject: "THE COUNTER-CONSIDERATION THE RED TEAM RECORDED AGAINST ITS OWN SIDE - the bracket's LOW end is the optimistic one"
      text: >-
        Recorded in full because it moves the number against the reading a
        downstream record would prefer. THE SAME BAND STRUCTURE IMPLIES
        gamma_B = 0.810 IS NOT AN ASYMPTOTIC EXPONENT. Because IMPL-B substitutes
