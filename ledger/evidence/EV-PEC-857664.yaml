        gamma_B -> gamma_A = 0.9329, the low end rises to c = 1.436129 and the
        NIST-I margin falls from 13.036 to 11.291 bits, i.e. -1.75 bits. THE HIGH
        END OF THE BRACKET IS THE DEFENSIBLE ONE FOR THIS IMPLEMENTATION FAMILY,
        and a record quoting only 1.327077 would be quoting the reading this
        analysis specifically undermines. The Validator reaches the same
        conclusion by a different route (its A-3 item (3)): the low end rests on
        a gamma averaged over a range in which the same series' local exponent
        has already risen to ~0.96-1.01 by ell = 211, so it is not a conservative
