  what_this_evidence_is: >-
    An adversarial pass on BATCH-012's positive finding, run because that finding
    had received less scrutiny than the four adverse findings it corrected. It
    both NARROWS the claim and PUTS ITS SURVIVING CORE ON FIRMER GROUND than
    BATCH-012 did. Zero new sampling.

  supersedes_reasoning_in: EV-MLKEM-553b83
  supersession_note: >-
    EV-MLKEM-553b83 is immutable and not edited. Its P-1 and P-3 whole-band
    framing is superseded here by S-1 through S-4; its P-4, P-5, P-6 and P-8
    stand, and its P-2 stands only in the narrowed form S-5 states.

  observations:
    - >-
      S-1 (THE FINDING SURVIVES, ON BETTER GROUND THAN IT WAS GIVEN). At MATCHED
      parameter count the exact region measure fits strictly better than the
      Gaussian-Phi surrogate: 0.3556 against 0.7055 (n=43) and 0.3172 against
      0.6969 (n=50), a factor of 1.98x and 2.20x which the Coordinator
      recomputed. Decisively, 98.6 percent (n=43) and 90.8 percent (n=50) of that
      improvement lands on the C >= 1000 rows WHERE THE COUNTING FLOOR IS
      NEGLIGIBLE. The improvement is therefore not a tail artifact and depends on
      no floor protocol. On those measurable rows the misfit drops from 64.7x to
      23.9x -- better, and still not closed.
    - >-
      S-2 (THE HEADLINE DOES NOT SURVIVE, and the reason is decisive). The
      whole-band statistic carries dof = 1.55 (n=43) and 1.51 (n=50) under the
      validator's OWN D-1 covariance min(1/lambda, 1/lambda'), against 422 and
      471 under a white-noise reading. A perfect model's ratio therefore has a
      sampling standard deviation of about 57 percent, which the Coordinator
      confirmed as 1/sqrt(2*dof). "Fits the whole band at 1.06-1.13x the
      counting-noise floor" is three significant figures on a statistic whose one
      sigma is about plus or minus 0.5. STRUCK, together with every variant:
      "at the floor", "CLOSED", and ANOM-4's "below its floor" -- which was never
      an anomaly, because the statistic cannot resolve it.
    - >-
      S-3 (THE WHOLE-BAND STATISTIC IS STRUCTURALLY UNABLE TO SEE THE MISFIT).
      99.91 percent of its denominator comes from C < 1000 rows and 81 percent
      from 310 rows with C < 10. The red team derived the exact identity
      ratio^2 = 0.5919 + (measurable misfit variance)/209.126, so the measurable
      misfit is attenuated 1147-fold, and A MODEL PERFECT ON EVERY MEASURABLE ROW
      WOULD READ 0.769x, NOT 1.00x. The Coordinator verified sqrt(0.5919) =
      0.7694. A controlled null makes the same point: on the low-count rows the
      surrogate that the C >= 1000 statistic rejects at 64.7x scores 0.799x and
      0.817x, indistinguishable from the exact model's 0.770x and 0.581x.
    - >-
      S-4 (D-1 IS UNDERSTATED AND ITS STATED REASONING HAS THE WRONG SIGN). The
      red team reproduced the validator's h == 1 numbers exactly, then applied the
      validator's own printed leverage vector: the whole-band factor is 0.896 not
      0.923, and the count >= 1000 factor is 0.709, not "between 0.90 and 1" as
      the validator reasoned -- the opposite direction. The factor is also derived
      in the delta regime and applied to a truncated-Poisson floor 20 percent
      away. Since S-2 shows the whole-band reading is uninterpretable anyway, this
      is a correction to a quantity that should not be quoted.
    - >-
      S-5 (THE ATTRIBUTION CLAIM IS NARROWED, AND WAS PARTLY REDUNDANT).
      "The misfit was the surrogate's, not Approximation 4.9's" survives only in
      the matched-parameter, measurable-rows form of S-1. The unqualified version
      and the phrase "corrects three batches" are struck. The red team also
      observes that EV-MLKEM-2e668d C-1 had ALREADY struck the whole-band
      argument and C-3 had ALREADY corrected the attribution, one batch earlier --
      so part of what BATCH-012 presented as new correction was re-litigation of
      a correction the program had already made.
    - >-
      S-6 (COORDINATOR'S OWN SUGGESTED ATTACK REFUTED, recorded because a failed
      attack is a result). The fitted-normalisation objection this Coordinator
      raised in the handoff -- that one free scale might rescue almost any
      monotone shape -- is REFUTED: null one-parameter monotone families score
      4.86x to 56.9x, not about 1x. Also refuted and recorded so no successor
      re-runs them: the deep-tail-artifact objection, the beta_sieve fork, the
      flat-likelihood objection, and the search for a second ANOM-1-style
      ordering assumption, of which none exists.
    - >-
      S-7 (FAVOURABLE, discharging a standing premise). The validator's
      "unverified premise" about beta_sieve = beta_1 is DISCHARGEABLE from the
      archive: page26_fig41.txt states "betasieve = 44" and "betabkz = 35,
      betasieve = 41". The red team reports this killed its own sharpest planned
      attack, and reports it anyway.
    - >-
      S-8 (ANOM-7's SIGNIFICANCE INVERTED). Truncating psi_lsc at mu - 4 sigma
      improves the headline by 9.4 percent and 3.4 percent while the C >= 1000
      fit gets WORSE (n=43) or is unchanged (n=50). The headline gain is bought
      entirely by going further below the tail floor, which is another way of
      seeing S-3.
    - >-
      S-9 (A RESIDUAL THE ONE PARAMETER CANNOT ABSORB). Residuals of +0.5476 bits
      at T = 405 (C = 1.26e7, about 1348 sigma) and +0.4667 at T = 270 (about
      7350 sigma) sit at leverage 0.10 to 0.20, so they are not absorbable by the
      single normalisation. This is the S-shaped error of EV-MLKEM-553b83 P-5
      localised and made quantitative.
    - >-
      S-10 (ALL FOUR BUDGET-BLOCKED CLAIMS ANSWERED, and one goes further AGAINST
      the package while another goes FOR it). n=50 M1 whole-band argmin: 0.427413
      at p = 22.25 against the producer's 0.427416, genuinely interior. n=50
      count >= 1000: 0.376293 at p = 20, interior, so the Claim-2 baseline stands.
      n=50 count >= 1e5: 0.188832 at p = 16 (139.1x) against the grid edge's
      217.8x, SO D-2's n=50 leg is now measured rather than expected and that row
      must be struck too. n=50 M3 s-curve: reproduced, but its count >= 1000
      argmin is grid-limited -- s = 0.94 gives 18.82x, BETTER than the published
      20.12x, which favours the package. n=50 slope row: reproduced to every
      printed digit. ANOM-7 variant: reproduced on both files to 1e-6.
    - >-
      S-11 (AN OPEN CONTROL, reported as inconclusive rather than as evidence).
      Every model sits 16 to 42 percent below the deep-tail floor. D-1 covers at
      most 10 percent and plug-in lambda at most 0.44 percent with the wrong sign.
      The red team attempted a deep-tail dispersion test twice and NEITHER
      settles it (0.20-0.81 biased low; 1.27-2.72 biased high). It is recorded as
      inconclusive.

  independent_recomputation_by_the_red_team: >-
    Three implementations written from scratch: the counting floor (a FOURTH
    independent computation, all eight values exact), the surrogate leg (a FIFTH
    implementation of the BATCH-009 cross-check, 0.705491 and 0.696880), and the
    exact region measure end to end -- Upsilon by Poisson's integral, region by
    monotone-segment inversion of Upsilon_a, its own psi_lsc mixture and its own
    quadrature -- a THIRD implementation of M2 agreeing on all eight cells to
    9e-5 bits and every log2 A to five decimals.

  inference: >-
    The exact region measure genuinely fits better than the surrogate, by about a
    factor of two at matched parameter count, and the improvement is concentrated
    where the data can actually see it. That is the defensible claim and it is
    now supported by five independent implementations. What is not defensible is
    any absolute whole-band reading: that statistic has fewer than two effective
    degrees of freedom, attenuates the measurable misfit 1147-fold, and would
    score a perfect model at 0.769x. The program should stop quoting whole-band
    ratios entirely and report the C >= 1000 comparison, where the misfit is
    23.9x and unclosed.

  boundaries:
    - >-
      Two archived toy-dimension files, resolved band only (about 15 percent of
      the operating threshold), raw undivided score scale, one fitted
      normalisation, shape only with no absolute-level test.
    - >-
      Establishes NOTHING about ML-KEM security in either direction, and nothing
      about Carrier et al.'s Kyber cost figures.
    - >-
      Approximation 4.9 is still NOT validated. A better-fitting model with an
      unclosed 23.9x misfit on the measurable rows is not a validated one.
    - >-
      One adversarial pass. S-11's deep-tail dispersion question is open and its
      two attempts are recorded as inconclusive, not as evidence.

