  proof_refs:
  - coordination/goals/GOAL-HQC-001/batches/BATCH-a5c525/reviews/TASK-20260806-069687/validation_report.yaml
  - coordination/goals/GOAL-HQC-001/batches/BATCH-a5c525/reviews/TASK-20260806-e13ecc/red_team_report.md
  - coordination/goals/GOAL-HQC-001/batches/BATCH-a5c525/tasks/TASK-20260806-77443e/cost_model.md
  observations:
  - 'A GROUNDED COST MODEL, NOT AN EXPERIMENT, WAS PRODUCED, AND BOTH REVIEWERS ADMIT IT. TASK-20260806-77443e
    benchmarked stage_a.py''s actual (T)-sampler (CTRStream, fixed_weight_support, ring multiplication,
    decode_blocks) on 3,500 calibration trials (5.69 core-seconds), measuring full-pipeline throughput at
    2,227 trials/core-second -- matching three independent prior-batch measurements (2,061 / 2,090 / 2,168
    t/cs) -- but also disclosing a separately-timed per-stage sum of only 788 t/cs, an unresolved ~2.6-2.8x
    internal discrepancy at the time of the executor''s report.'
  - 'THE VALIDATOR RESOLVED THE THROUGHPUT DISCREPANCY WITH INDEPENDENT EXPERIMENTS THE EXECUTOR DID NOT
    RUN. Reversing measurement order made the pessimistic figure jump to 1,669 t/cs when warm, which
    REFUTES the executor''s specific hypothesis that decode_blocks lacks warm-up (isolating decode_blocks
    alone showed no first-call/warm-call difference at all). The Validator attributes the gap instead to
    CPython interpreter warm-up plus structural loop differences, and concludes the OPTIMISTIC figure
    (~2,168-2,227 t/cs, anchored on the actual T=1e7 PS-R3 production run, EV-HQC-b71230) is the more
    trustworthy planning basis, since a real run amortizes cold-start within its first few hundred trials.'
  - 'REQUIRED-T AND COST-TABLE ARITHMETIC WERE INDEPENDENTLY VERIFIED, WITH ONE GENUINE DEFECT FOUND AND
    CORRECTED. The Validator independently recomputed the Wilson-CI sizing (~24,700) and all T_req figures
    against experiments/EXP-HQC-982268/specification.yaml''s own frozen sample_size_derivation -- exact
    match, none misapplied from a different (set, k) cell. One arithmetic defect was found: the PS-R5 cost
    row mixed a throughput figure into a cost-in-core-seconds cell, producing a spurious range where a
    single ~1,717 core-second value belongs; corrected here rather than left in the artifact. The
    ~4,978-second remaining-campaign-budget figure was independently re-derived from the goal record''s own
    text and confirmed.'
  - 'AFFORDABILITY, AT EACH SCALE, IS NOW ESTABLISHED RATHER THAN ESTIMATED. PS-R3 SCALE: AFFORDABLE, 139-392
    core-seconds against ~4,978 remaining, robust to which throughput figure is used -- both reviewers
    independently confirm this. STANDARDIZED-PARAMETER SCALE: MIXED, confirmed by the Validator''s corrected
    arithmetic -- PS-A''s true k=m=16 cell is astronomically INFEASIBLE (roughly 1e38-1e39 core-seconds);
    PS-A k=3 and PS-R1 k=m=16 exceed remaining budget by roughly 2-5x (not affordable now, not astronomically
    infeasible); PS-R5 is technically in-budget but MARGINAL, consuming 35-45 percent of all remaining
    budget in one run.'
  - 'THE RED TEAM PRICED IN THIS CAMPAIGN''S OWN TRACK RECORD AND NARROWED THE RECOMMENDATION FURTHER. The
    executor''s and Validator''s "cheap, 139-392 core-seconds" figure for PS-R3 scale does not price in that
    every batch in this campaign to date (four consecutive: V1 through V3, plus the cost-model batch itself)
    has needed at least one disclosed correction cycle, and that the required-T derivation carries forward
    the V1-V3 detection-rate range -- already shown, in EV-HQC-163374, to be a mixture-dependent artifact of
    a toy design constant -- into the real sampler''s structurally different distribution, which the cost
    model itself admits it cannot supply a defect-specific power calculation for. Pricing in the correction-
    cycle pattern, the Red Team estimates true expected cost at roughly 300-800 core-seconds in the
    favorable case, but potentially thousands to tens of thousands if the chosen injection point''s effect
    size proves small -- a scenario the cost model names as a mechanism but never prices as a number.'
  - 'ALL THREE PRODUCERS OFFERED A RECOMMENDATION RATHER THAN A DECISION, AND THEY CONVERGE ON SCOPE BUT
    DIFFER ON GRANULARITY. Executor: PARTIAL-GO, PS-R3-scale only. Validator: confirms PS-R3-scale is
    affordable, does not itself recommend a go/no-go framing beyond the affordability read. Red Team:
    PARTIAL-GO, narrower than the executor''s -- fund a small PILOT injection at the narrowest defect class
    first (not the full T_req-scale run immediately), with a pre-committed stopping rule: if the pilot needs
    structural redesign rather than an in-place fix, escalate to a PAUSE review against this goal''s own
    declared pause_conditions rather than an automatic rebuild. PAUSE was given serious, explicit
    consideration by the Red Team and not recommended outright, but the substantive case for it (six batches
    of instrument-trust work with zero progress on the goal''s other two completion criteria; the
    standardized-parameter computation confirmed infeasible by roughly 38-39 orders of magnitude) is named
    on the record rather than dismissed.'
  inference: 'A real-sampler defect-injection experiment at PS-R3''s reduced-parameter scale is affordable
    by every producer''s independent accounting, and the mechanical injection point requires no new
    machinery. It is the first genuinely tractable path this campaign has toward exercising the actual code
    path OPEN-6 is concerned with, after three control-arm generations that structurally could not. But the
    campaign''s own track record -- and the fact that the detection-rate assumption feeding the cost
    calculation is itself known to be a toy-scale artifact rather than a transferable figure -- argue for a
    narrower first step than a full T_req-scale committed run: a small, cheap pilot that tests whether the
    injection is even mechanically sound and produces any measurable signal, with an explicit, pre-committed
    decision point rather than open-ended iteration if it does not.'
  boundaries:
  - Toy. A cost model and a small (3,500-trial) calibration benchmark; no experiment was run and no
    statement about HQC, A17, its decoding-failure rate, or any standardized parameter set is made or
    warranted by this record.
  - This evidence record does not reopen, revise, or supersede EV-HQC-b71230, EV-HQC-db1fd9, EV-HQC-9a30d3,
    or EV-HQC-163374, all of which stand exactly as archived.
  - The PS-R3-scale affordability figure rests on the OPTIMISTIC throughput figure the Validator judged more
    trustworthy; if that judgement is wrong, the true cost could be up to roughly 2.8x higher, still likely
    affordable at this scale but with a narrower margin than the headline figure suggests.
  - The required-T calculation's detection-rate assumption is explicitly flagged as unvalidated at the real
    sampler; the actual power of a real-sampler injection experiment at the derived T is unknown until run.
  - H-HQC-18d1b4 is untouched by this record in either direction; it remains PROPOSED.
  unresolved_confounds:
  - 'The PS-R3-scale cost estimate has never been corroborated against an actual defect-injected run --
    both the optimistic and pessimistic throughput figures were measured on the UNDEFECTED pipeline. Whether
    injecting the defect changes the per-instance cost (e.g. by changing branch patterns in decode_blocks or
    triggering different code paths) is unmeasured.'
  - Whether the ~8.8-20 percent detection-rate range from the planted-content arms transfers, even
    approximately, to the real sampler''s bit-heterogeneous output is unknown and will only be settled by
    running the pilot itself.
  - The correction-cycle pricing the Red Team applied is itself an estimate, not a measurement; the true
    expected cost of a real-sampler injection line of work, including iteration, will only be known after
    at least one attempt.
  reviewed_by: coordinator
