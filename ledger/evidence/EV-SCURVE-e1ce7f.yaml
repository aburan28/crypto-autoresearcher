  observations:
    - >-
      SR1 (raw source re-transcription) discharged for lane L3: RFC 7748 and RFC 8032 raw-fetched via
      curl (sha256 279ca0ecc5e92e2962e27b846986aeb74729d9dd34bd4a04a362f80dcb596ad3 and
      ed63657ff389301282b169b0abde9b5dd2c7e4d524fdfa5da6ff3094fc93c4c3), every L3-relevant value
      line-cited from the raw bytes, independently re-fetched and re-cited by a fresh validator
      session with identical results.
    - >-
      Lane L3 (base-point) certificate: M1 (curve448, Montgomery) and M3 (edwards448/Ed448-Goldilocks,
      the intake object) both certify cleanly -- on-curve, non-identity, l*B=O, Hasse-interval-unique --
      independently reproduced by a fresh validator session using its own from-scratch implementation
      (own Montgomery ladder, own twisted-Edwards addition law, own exact-integer Hasse test) against
      values from its own independent RFC re-fetch.
    - >-
      M2 (the large-d birational Edwards curve) triggers lane L3's own stated falsifier: l*B equals the
      order-2 point (0, p-1), not the identity. This was independently diagnosed, not merely observed,
      via four supporting checks (d is a genuine quadratic non-residue; the point and its algebraic
      negation double consistently as true negatives; RFC 7748's own stated birational map recovers
      curve448's base point u=5 exactly from the M2 point; 2*l*(x,y) independently computes to the
      Edwards identity, confirming the true order is 2*l). All four sub-claims were independently
      re-derived by a fresh validator session and confirmed correct. Root cause: this specific
      non-normalized birational chart maps the Montgomery group identity to the Edwards curve's own
      2-torsion point rather than to its chosen identity (0,1) -- a property of the specific coordinate
      chart, not a transcription defect or a curve weakness. Recorded as a fourth, measured outcome
      outside lane L3's anticipated three-way taxonomy (all_candidates_agree /
      candidates_differ_but_all_verify / some_candidate_fails), per AGENTS.md's requirement to preserve
      unexpected observations rather than force-fit or discard them.
    - >-
      All three of lane L3's declared controls (positive: order-4/order-2l point constructions;
      parameter-matched negative: Curve25519; same-shape null: quadratic twist + 1000 random pairs +
      bit-decay sweep) ran and passed before any candidate result was treated as a finding, per global
      precondition P4 -- independently re-run by the validator with its own code, own random seed, and
      own control-point constructions, with matching qualitative results.
    - >-
      ONE GENUINE, SCOPED DEFECT was independently found and confirmed by the validator, not softened:
      the producer's stated M1 order-4 positive-control point (u=1, v=528950...173011) does not
      actually lie on curve448 (156328, the required curve-equation value at u=1, is not a quadratic
      residue mod p; the given v is a genuine square root of the unrelated constant 156324, correctly
      computed but attached to the wrong u-coordinate -- the correct pairing is u=p-1, not u=1). This is
      isolated to one redundant auxiliary control sub-case: it does not affect the M1/M2/M3 certificate
      itself (verified against the actual transcribed base points, not this fabricated auxiliary
      point), does not touch the M2 diagnosis, and global precondition P4 remains substantively
      satisfied via three other independently-valid positive-control demonstrations (M1 order-2l; M3
      order-4; M3 order-2l).
    - >-
      A separate, non-load-bearing factual error was also found: base-point-audit.yaml's environment
      note claims RFC 7748 states Curve25519's prime is congruent to 3 mod 4; RFC 7748 line 183 in fact
      states it is congruent to 1 mod 4 (only curve448's prime is congruent to 3 mod 4). No modular
      square root over p25519 is actually computed anywhere in the certificate, so this error did not
      propagate into any reported value, but it is a confirmed factual error in the record as written.
