      semi-regular series (E-G's reading, pre-data prior (a), KN-OPEN-3c8f51's
      "It does not explain degree 4" applied to S_3) do not transfer to S_3.
      It does NOT block anything at other n, curves, V, m, or under F4.
    quantity: >-
      (i) a = number of U62 instances with a W_4 refutation carrying a
      verified degree-disciplined W_4 witness, and the first W_4 iteration
      containing 1. (ii) The degree-fall profile of M_4: dim(M_4 cap
      B_{<=3}), the number of independent linear forms in M_4, and the fall
      profile of the ell-substituted degree-4 space R'_4, each against the
      exactly semi-regular reference.
