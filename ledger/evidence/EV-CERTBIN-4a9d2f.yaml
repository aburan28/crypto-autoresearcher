  replication_note_answer: >-
    The plan's tier_ruling asked whether J5/J6 and J1 may stand in for
    "replication" of C1 at its toy scope, or whether the decision must be
    `replicate`. ANSWER: they may, for C1 and nothing wider. Reasons:
    (1) C1 is an exact, deterministic statement about 62 fixed archived
        Boolean systems. Nothing is sampled, so a second producer run of the
        same code can only reproduce an identity; what replication must
        exclude is an implementation or reading error.
    (2) J5 is a blind re-derivation from the specification text on ALL 62
        U62 instances (plus 35 controls), by a session that saw no producer
        code, value or expectation, with the LITERAL W_4 rule and two internal
        cross-implementations. J6 compared it with the run: 2267 cells agree,
        0 disagree.
    (3) Every one of the 62 now carries a per-instance, degree-disciplined
        W_4 witness (J5 wcerts.jsonl.gz) accepted by J5's separate-process
        checker AND by J6's own checker, written before J6 read any J5 code
        (67 of 67 pool W_4 refutations W-certified; 75 of 75 checker
        controls pass). Independently, the red team built 62 structured
        W^(1) witnesses (C_4, a) verified against two constructions (J7). A
        verified per-instance certificate is a proof of that instance's
        statement; it does not need a second sample.
    (4) J1 verified all 268 flat certificates author-independently.
    (5) The surprise (pre-data prior (a) overturned) is LOCATED, not just
        observed: J7 shows S_3's substituted degree-4 space contains all of
        B'_{<=3} on 61/62 (codim 1 on idx 893) against the semi-regular
        [0, 0, 16, 288]. A `replicate` decision would re-measure a certified
        identity.
    NOT REPLICATED, and not claimed: any rate on another curve, V or n
    (EXP-CERTBIN-3f06d1 for curves and V; the n = 19 cell for n), the
    mechanism beyond sufficiency of the exhibited routes, and S_3-specificity
    relative to systems sharing S_3's convolution quadratic part (N-CONV,
    untested).
