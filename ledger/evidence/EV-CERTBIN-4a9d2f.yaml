      (i) a = 62 of 62 (CP95 [0.9422, 1]; exact per instance, no error bar
      on each instance's membership), first iteration 1 on 62/62. (ii)
      dim(M_4 cap B_{<=3}) = 964-978 on U62 against 323 on 124/124 nulls; M_4
      contains 4-12 independent linear forms on U62 (modal 10) against 0
      semi-regular; R'_4 fall profile [1, 18, 154, 834] (d = 0..3) on 61/62
      and [1, 17, 153, 833] on 1/62 against the semi-regular [0, 0, 16, 288];
      98-112 non-trivial degree-4 syzygies on U62 against 0 on the nulls.
      Exact linear-algebra ranks, no sampling error.
    measured_by: [RUN-CERTBIN-c417e0, EXP-CERTBIN-e94b27]
    measured_by_note: >-
      (i) is read from RUN-CERTBIN-c417e0 closures.jsonl.gz and
      certificates.jsonl.gz, re-derived blind by J5 (TASK-20260924-1f6a3c)
      and W-certified by J6 (TASK-20260924-b2c7f1). (ii) is reviewer
      computation on the archived instances of RUN-CERTBIN-c417e0 by the red
      team (TASK-20260924-d95e70, j7-mechanism/, j8-nulls/), with dim(M_4 cap
      B_{<=3}) also equal to the run's new_fallen_per_iteration[0] and to
      J5's value (J6).
    scope: >-
      n = 17, f = t^17 + t^3 + 1, m = 2, l = 9, V = {deg < 9}, one curve
      (A = 97044, B = 126251, h = 4), x(2E) subgroup targets, the archived
      sets U62 (and C20, S10 for (ii)) and the two null sets, the frozen
      closures M_4, W_4, M_5. Claimed nowhere else. It is NOT a lane closure:
      KN-OPEN-3c8f51 items (A) and (B) stay open, and the tier tripwire
      (review plan; TASK-20260924-8f03d6 LC-2) is not engaged.
    resource_check:
      examined: true
      reading: >-
        Taken over from RT-20260924-d95e70 J10 resource_check and extended.
        Three theories take these measurements as their HYPOTHESIS.
        (R1) DEGREE-4 POLYNOMIAL CALCULUS. Under the red team's reading of the
        retrieved PC definition (its adaptation; not relied on for the
        decision), 1 in W_D iff a degree-D PC refutation over F_2 with
        Boolean axioms exists. Then every U62 and C20 attempt has a degree-4
        PC refutation, which is the hypothesis of degree-bounded PC search
        (CEI96, recalled pointer only). Worth anything only where
        enumeration does not dominate: m >= 3 or chained, where nothing is
        measured.
        (R2) LINEARIZATION-FIRST SOLVING. After substituting ell, R'_4
        contains the whole linear part of the vanishing ideal (S10: codim s
        at d = 1), so a degree-4 solve returns the affine hull of the
        solutions. Dominated by oracle A at m = 2.
        (R3) A DEGREE-FALL THEORY FOR STRUCTURED BILINEAR SYSTEMS. The m = 2
        descent is S_3 = phi(x_1 x_2) + x_R^2 (x_1 + x_2)^2 + B, with
        phi(y) = y^2 + x_R y of rank 16 on the 17 convolution forms, and ell
        the cokernel functional Tr(. / x_R^2) (J7 structure.json, 92/92).
        The large D = 4 falls are the hypothesis of such a theory, and
        consistent with KN-LIT-7604's reported first fall degree 2 (kb,
        abstract-level). N-CONV (RC-A) is its cheapest discriminating test.
        COORDINATOR EXTENSION. (i) The non-semi-regularity measurement is the
        hypothesis of the n = 19 design (KN-OPEN-3c8f51 item B): persistence
        of S_3's M_4 falls with n is exactly what that cell measures, and
        RC-B (compute R'_4's fall profile before applying any semi-regular
        prediction) is the cheap pre-check. (ii) It is NOT evidence for or
        against Semaev's Assumption 1: the cell lies on its diagonal, so a
        low refutation degree is that assumption's content at work, and W_4
        is not F4.
