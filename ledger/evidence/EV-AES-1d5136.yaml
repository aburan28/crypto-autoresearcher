evidence:
  id: EV-AES-1d5136
  hypothesis_id: null
  hypothesis_id_note: >-
    DELIBERATELY NULL. This record is a red-team synthesis across three prior
    evidence records, reclassifying what they jointly establish and identifying
    a residual risk none of them addresses. RQ-AES-003 carries no hypothesis
    about the r=5 yoyo excess; naming one here would manufacture a binding this
    record does not have. Admitted under the documented-null allowance recorded
    in CORR-20260802-009.
  experiment_ids: []
  run_ids: []
  task_ids:
    - TASK-20260805-a13fce
    - TASK-20260805-50dc8a
    - TASK-20260805-234661
    - TASK-20260805-3b11d3
  type: synthesis_and_review
  direction: reclassifies_own_prior_reading
  strength: moderate
  strength_basis: >-
    MODERATE. The red team's substantive claims were checked, independently and
    from first principles, by TWO separate validator sessions: one that
    correctly refused on an admissibility ground unrelated to substance (see
    process defect below) but nonetheless performed a full advisory shadow
    review, and a second, scoped successor that spot-checked the first's
    re-derivations, independently re-verified the two load-bearing technical
    claims against source code and arithmetic rather than trusting either prior
    report, and rendered the terminal verdict. Both sessions independently
    reproduced the SAME figures from raw committed sources without copying from
    each other, and neither found any fabrication. What holds strength at
    moderate: this is a synthesis of existing evidence rather than a new
    measurement, its two named required controls with the most discriminating
    power (RC-B, RC-D) are unrun, and every party across all four batches this
    record touches resolves to one model under standing basis
    0137a051eb5828789eb267fa83c8278086578d4c, so NOTHING HERE COUNTS TOWARD A
    CLOSURE QUORUM.
  claim_tier: toy
  claim_tier_basis: >-
    A synthesis over BATCH-007, BATCH-008 and BATCH-009, all toy-tier, reduced-
    round AES-shaped SPN, C1 convention. No crypto-scale, medium-scale,
    affected-scheme or asymptotic claim is made or implied, and no comparison to
    published cryptanalysis is made in either direction (RQ-AES-003 R3).
  certificate_refs: []
  proof_status: derivation
  proof_refs:
    - coordination/goals/GOAL-AES-003/batches/BATCH-010/tasks/TASK-20260805-a13fce/red_team_report.yaml
    - coordination/goals/GOAL-AES-003/batches/BATCH-010/tasks/TASK-20260805-3b11d3/validation_report.yaml

  observations:
    - id: OBS-B10-1
      statement: >-
        THE CAMPAIGN'S "COMPOSED CLAIM" ACROSS BATCH-007/008/009 IS NOT A FLAT
        CONJUNCTION OF FOUR PEER CONTROLS, AND DEC-20260805-9a1c47's next_actions
        TEXT STATES IT AS THOUGH IT WERE. BATCH-008's "not byte-local" and "not
        S-box-specific" findings are BOTH computed through the SAME unmodified
        driving code as the live arm (yoyo_sbox_v2's worker(): the amask-draw-
        with-rejection loop, the smask trivial-swap detector, and the W>=1
        counting predicate, carried unchanged through v3 and reused byte-
        identical by the BATCH-006 27-arm dataset). Neither is an inventor-
        protocol section-3 null object in the strict sense: the byte-locality
        check is an analytic formula applied to live-cipher data; the S-box
        check compares S-box choices measured through the identical shared
        harness. Only BATCH-009's ideal-permutation substitution is a genuine
        alternative-generative-process control.
      status: >-
        CONFIRMED by the red team and independently re-verified by two
        validator sessions against the actual v2/v3/v4 source.
    - id: OBS-B10-2
      statement: >-
        READ CORRECTLY, BATCH-008 AND BATCH-009 COMPOSE INTO SOMETHING STRONGER
        THAN THREE PARALLEL CHECKMARKS -- NOT "NOT BYTE-LOCAL, NOT S-BOX-
        SPECIFIC, NOT GEOMETRY" AS THREE INDEPENDENT ITEMS, BUT "THE EXCESS
        REQUIRES AN ACTUAL ROUND FUNCTION, AND GIVEN ONE, IT IS NEITHER BYTE-
        LOCAL NOR S-BOX-SPECIFIC" AS A SINGLE TIGHTER CLAIM. BATCH-009's null-
        object arm reads AT the analytic null rather than inflated, which
        disfavours a shared-harness counting bug independent of the actual
        round function -- because such a bug would have inflated the ideal-
        permutation arm too, and it did not. This retroactively supplies
        BATCH-008's missing discriminating power against the shared-harness-
        artifact alternative.
      status: CONFIRMED by the red team; independently re-derived by both validator sessions
    - id: OBS-B10-3
      statement: >-
        A RESIDUAL RISK CLASS SURVIVES EVERY CONTROL RUN SO FAR: a bug in the
        shared harness whose EFFECT is conditional on interacting with actual
        round-function structure would inflate the live AES arm and the 27
        random-S-box arms (any bijective S-box has branch structure to interact
        with) but NOT the ideal-permutation arm -- exactly the observed pattern.
        No control in this campaign distinguishes this class from a genuine
        round-5 SPN-structure signal, because every check so far either
        verifies enc_r/dec_r correctness, rederives the PW/CW index tables from
        ShiftRows, or verifies that a diff's ADDED lines are inert -- never re-
        verifies the untouched shared base.
      status: >-
        THE GENERAL RISK CLASS IS CONFIRMED LIVE AND UNTESTED. The red team's
        SPECIFIC ILLUSTRATIVE MECHANISM -- an aliasing between the PW/CW index
        tables and the MixColumns/ShiftRows branch structure -- IS NOT
        MECHANICALLY LIVE AS WRITTEN. Both validator sessions independently
        read yoyo_sbox_v2.c and confirmed PW/CW are used only as byte-offset
        indices into worker()'s own I/O arrays, while MixColumns/ShiftRows/
        SubBytes live entirely inside the opaque T0-T3/U0-U3 tables inside
        enc_r/dec_r, which worker() calls as black boxes. No code path joins
        the two. This is a narrow overstatement of mechanistic precision in an
        otherwise sound argument, hedged by the red team's own "for instance,"
        and does not undermine the closure ruling.
    - id: OBS-B10-4
      statement: >-
        WEAKEST LINK: BATCH-009. Its central count is the smallest of the three
        (14 vs 1 at matched exposure, or 14 vs 6 at 8x exposure), its code
        (yoyo_sbox_v4) is the newest and least cumulatively scrutinized in the
        lineage, and unlike BATCH-007 (whose raw r=5 excess IS independently
        corroborated by valprobe.c, a completely separately-authored codebase,
        at 14.5x, r=5, amask=2 -- confirmed by both validator sessions against
        TASK-20260803-cddc64's validation_report.yaml item M2), BATCH-009's
        SPECIFIC claim that the excess vanishes under cipher substitution has
        never been tested by any non-v2-lineage codebase. This is stated as a
        priority for further scrutiny, not as a defect: BATCH-009's own
        construction was independently checked line-by-line and found sound
        (TASK-20260803-1f6b64), which is a separate axis from lineage-external
        corroboration and the two are not in tension.
      status: CONFIRMED by the red team; the weakest-link case and its four supporting facts independently re-checked
    - id: OBS-B10-5
      statement: >-
        THE SHARED-KEY RISK NAMED IN THIS BATCH'S OWN TASK CARD WAS SEARCHED
        AND FOUND FALSE. Five distinct derived keys have been tested campaign-
        wide at r=5/amask=1/smask=1/AES S-box: BATCH-005's D-AES-K1/K2/K3
        (14, 14, 8), BATCH-004's Y-AES-main (~13.5 per 2^30), and BATCH-006's
        B0-AES-REF (12) -- all elevated over the analytic null, none near it,
        with BATCH-005's own preregistered key-main-effect test finding no
        detectable key-to-key variation (G^2 p=0.24734580566758235; cell
        homogeneity p=0.45730017978460535, both independently recomputed by
        this batch's validator from raw source). The excess is not a property
        of the one key shared by BATCH-008 and BATCH-009.
      status: >-
        CONFIRMED, search recorded per CORR-20260803-8fa302's rule (Python
        glob over 5027 files, executed 2026-08-05). The task card's implied
        premise -- that the shared key was an untested risk -- was itself an
        overcaution the search corrected.
    - id: OBS-B10-6
      statement: >-
        UNDERSTATEMENT FOUND: BATCH-008's OBS-B8-7 (S-box-specificity, its own
        "most useful item") used only 2 of the 5 already-available AES r=5
        data points (12 and 14) against the 27-arm random-S-box distribution,
        rather than all 5 (14, 14, 8, ~13.5, 12; mean 12.3 against the random
        distribution's mean 15.48). The qualitative conclusion is not disputed
        by this record -- RC-C (below) proposes confirming it under the fuller
        evidence base -- but the batch that ran the check had four more
        directly relevant AES data points sitting in its own campaign history
        and did not use them.
      status: CONFIRMED by the red team, independently corroborated by both validator sessions

  process_defect:
    what: >-
      THE COORDINATOR DISPATCHED THE FIRST INDEPENDENT VALIDATOR (TASK-20260805-
      234661) BEFORE RUNNING THE SNAPSHOT ARCHIVE (TASK-20260805-50dc8a),
      VIOLATING THIS CAMPAIGN'S CORE SEQUENCING RULE that a producer's artifact
      is snapshot-archived and dispatcher-verified BEFORE any independent
      review reads it.
    consequence: >-
      TASK-20260805-234661 correctly refused to validate, since at its check
      time no snapshot archive existed and the red team report itself was
      untracked in git. Its refusal was the correct application of its
      operating rule ("refuse to validate a working-tree-only producer
      receipt") and is NOT a defect in that task; it is preserved as evidence
      and its substantial advisory shadow review is credited above.
    repair: >-
      Caught by the Coordinator immediately after dispatch, before the
      validator returned. The snapshot archive was run and dispatcher-verified
      at commit 4a08aa1c within minutes. A scoped successor validator
      (TASK-20260805-3b11d3) was dispatched against the corrected, durable
      state and rendered the terminal admissible verdict, independently
      confirming the predecessor's substantive findings rather than repeating
      its work from scratch.
    why_the_risk_did_not_materialize: >-
      The red team report was already complete and static in the working tree
      at dispatch time, and the Coordinator had already read and independently
      spot-checked several of its claims before dispatching the first
      validator. The specific failure mode the sequencing rule exists to
      prevent -- a producer revising an artifact after seeing a review -- did
      not occur. The rule was still broken and this record states so plainly
      rather than treating a benign outcome as evidence the rule did not
      matter.

  defects_carried:
    - id: D-B10-1
      statement: >-
        RC-A, the red team's rank-1 "cheapest" required control, is
        underpowered by roughly 16-64x at its stated exposure. At the
        campaign's established rate (~14 hits per 2^30 trials, ~1.304e-8 per
        trial), expected hits at 2^24 trials are ~0.22, giving roughly an 80%
        chance of zero comparable hit events in a single run -- the control
        would be vacuous as specified. Reaching a handful of comparable events
        needs roughly 2^28-2^30 trials. RC-A's priority ranking and underlying
        logic are not disputed; only its stated cost/exposure needs correcting
        before it is dispatched as a next action. Confirmed independently by
        both validator sessions from first-principles arithmetic.
    - id: D-B10-2
      statement: >-
        See OBS-B10-3: the red team's illustrative aliasing mechanism is a
        narrow overstatement, hedged by its own "for instance," not a
        fabrication.

  boundaries:
    - >-
      This record reclassifies what BATCH-007/008/009 jointly establish; it
      does not add a new measurement and does not change any of their
      individual numeric results.
    - >-
      No mechanism is named for the r=5 excess by this record or by any of the
      three batches reviewed. The residual risk class in OBS-B10-3 remains open
      and untested by any control run to date.
    - >-
      Session and implementation independence only. NO MODEL INDEPENDENCE under
      standing basis 0137a051eb5828789eb267fa83c8278086578d4c; nothing here
      counts toward a closure quorum.
    - >-
      RC-B and RC-D, the two controls with the most power to convert lineage-
      internal findings into lineage-independent ones, are unrun.

  unresolved_confounds:
    - >-
      Whether the residual shared-harness risk class (OBS-B10-3) is a genuine
      round-5 SPN-structure signal or a subtler instrument artifact remains
      untested by any control to date; RC-A as specified cannot settle it at
      the exposure the red team proposed.
    - >-
      BATCH-008's byte-locality claim and BATCH-009's cipher-substitution claim
      have never been tested by any codebase outside the v2-v3-v4 lineage
      (RC-B would settle this).
    - The 32-bit-vs-24-bit localization question (EV-AES-8b8dcf boundary) remains open.
    - Whether OUTCOME-A (BATCH-009) depends on idealness specifically versus mere structurelessness (U4) remains open; RC-D would address this.

  reviewed_by:
    - >-
      TASK-20260805-234661 (independent validator; verdict INVALID on
      admissibility grounds only, preserved and credited for its advisory
      shadow review, which independently reproduced the red team's cited
      figures and identified D-B10-1 and D-B10-2 before the successor
