  # =====================================================================
  inference: >-
    THE PRE-REGISTERED READING READING-NOT-IDENTIFIED FIRED CORRECTLY AND
    MECHANICALLY AND STANDS. In the measured window - eight primes over log2 p in
    [20, 40], B <= 32, one host, one Sage build, one session - the p-dependence
    of the host-normalised per-entry table-construction cost of Algorithm 1 is
    BELOW THE PRE-REGISTERED DETECTION THRESHOLD OF c = 0.1975, and the design
    would have detected c = c_star at seventeen times the GOF-3 threshold. That
    second clause is not optional: a record that banks the first sentence and
    drops the second has banked a null it did not earn. WHAT THE RUN CANNOT SEE
    IS NOT p; IT IS B. The overhead the NIST-I question turns on is 30.76 bits at
    w = 2^30; the measured c supplies 2.22 of them, and the remaining about 28.5
    bits, if they exist, live in a B-dependence measured 9.2 bits below the
    operating point. Two further limits are carried and neither is repaired here:
    the measured window may itself be a floor of the interpreted implementation
    rather than a property of Algorithm 1 (raised by non-evidentiary red-team
    probes, O-12), and the measured level of 1568-1933 F_{p^2}-operation
    equivalents per entry is an UPPER BOUND on an optimised implementation's cost
    (EA-4), so it establishes safety in no direction. THE NIST-I CONCRETE MARGIN
    REMAINS INCONCLUSIVE EXACTLY AS DEC-20260724-016 LEFT IT. NOTHING HERE
    MEASURES THE NIST-I MARGIN, TESTS HEURISTIC 1, REPAIRS GAP-1 OR GAP-2,
    VALIDATES SECTION 4.1, MOVES ANY ASYMPTOTIC-CLAIM PROMOTION GATE, OR
    RECOMMENDS ANY PARAMETER.

  strength_basis: >-
    `preliminary`, ASSIGNED ON THE MERITS AND NOT ON THE QUALITY OF THE
    VERIFICATION. FOR a higher strength: the verification is exceptional - 656
    independently recomputed quantities with zero disagreements and a largest
    difference of 3.3e-16 from a genuinely independent reimplementation,
    byte-identical reproduction of three derived artifacts from the archived raw
    data alone, 13 of 13 digest bindings, pre-registration ordering established
    from the commit graph, and three null objects returning three zeros. AGAINST:
    ONE EXECUTION, ONE HOST, ONE SAGE BUILD, ONE SESSION, UNREPLICATED, over a
    narrow p window whose flatness may itself be an artifact of that window, on
    the axis that both reviewers independently identified as THE SMALLER ONE. NOT
    `replicated` - a single unreplicated one-host run set cannot reach it, and no
    second host or second session exists. NOT `strong` - the measured axis does
    not carry the question. NOT `inconclusive` - the record is not empty of
    result: a real per-entry cost level was measured, the controls are clean, and
    the power analysis discriminates decisively between "small effect here" and
    "no resolution", which is more than an inconclusive record contains. NOT
    `contradictory` - nothing in the package contradicts anything else, and the
    three false statements of record are labelling and completeness overstatements
    superseded above, none of which touches a carried number.

  direction_basis: >-
    `neutral`, AND THE REASON IS RECORDED RATHER THAN LEFT IMPLICIT. The fired
    reading identifies no exponent and carries no c, so this record moves no
    adjudicated position of H-P13-001 in either direction. The one piece of
    directional information the data contain - the exclusion of c ~ 1.9 in the
    measured regime by a factor of about 8, which points at the THREATENED
    direction and away from the comfortable one - is NOT recorded as a direction,
    because EXP-SSI-002 pre-registered identification gates and no exclusion gate,
    and converting a null into a bound after the fact is exactly the post-hoc
    criterion movement S-10 forbids. It is recorded as an observation (O-9) and as
    a design requirement on the successor contract.

  # =====================================================================
  boundaries:
    - >-
      B-1 SCOPE. Eight primes at log2 p in {20, 23, 26, 29, 32, 35, 38, 40};
      three smoothness bounds with B <= 32 and ell <= 31; two implementation
      variants; two seeding strategies; 34 mandatory cells plus 2 re-executions;
      ONE host, ONE Sage 10.9 build, ONE session, ONE execution; 178.666 s of
      compute. Every conclusion is scoped to exactly that.
    - >-
      B-2 p <= 2^40 IS NOT CRYPTOGRAPHIC SIZE. log2 p = 40 against a NIST-I
      target of 256 is a 6.4-fold extrapolation in log2 p. TOY-SCALE EVIDENCE IS
      NOT PRESENTED HERE AS CRYPTO-SCALE VALIDATION, claim_tier is `toy`, and no
      artifact of this record asserts the NIST-I margin as measured.
    - >-
      B-3 EA-3 IS THE BINDING LIMITATION AND IT IS UNREPAIRED. The measured B
      regime never reaches the operating B: B <= 32 measured against log2 B* =
      14.200 selected by the committed model at log2 p = 256, a factor 588 and
      9.2 bits entirely outside the measured range, against a per-entry cost
      given only as (B + log p)^{O(1)}. NEITHER THE RUN NOR EITHER REVIEW BEARS
      ON THE OPERATING (p, B) POINT.
    - >-
      B-4 NO ATTACK. No attack was executed at any size, none is authorized by
      this record, and no parameter change is recommended by it. No endomorphism,
      no isogeny E -> E^{(p)} and no EndRing instance was solved at any size. No
      solution certificate exists.
    - >-
      B-5 HEURISTIC 1 IS NOT UNDER TEST AND IS NEITHER VALIDATED, SUPPORTED,
      WEAKENED NOR REFUTED. Nothing in this run samples the smoothness
      distribution of the smallest conjugate-isogeny degree, and its tail at the
      operating point u ~ 13 retains ZERO experimental resolution. H-P13-001's
      heuristic_1_status is carried unchanged.
    - >-
      B-6 GAP-1 IS NOT REPAIRED. Supplying SEED-A was an implementation decision
      taken so that Algorithm 1 could be executed at all; it discharges nothing in
      the frozen text. The red team adjudicated the choice and could not break it
      - SEED-A charges the whole first layer to the timed window, which is the
      conservative direction for a cost floor, the SEED-A/SEED-B ratios are within
      2-3%, and at >= 1500 entries per cell any seeding choice weighs O(1/1500) -
      but a failed attack on a decision is not a repair of the defect.
    - >-
      B-7 GAP-2 IS NOT TOUCHED, and Section 4.1 REMAINS UNVERIFIABLE-AS-WRITTEN
      with its stated lower bound overestimating the provable bound by about 2.2
      bits. CTRL-COUNT compared realised table sizes against it as an OBSERVATION
      and not as a re-adjudication.
    - >-
      B-8 NO ASYMPTOTIC CLAIM. All four asymptotic-claim promotion gates of
      agents/coordinator.md remain OPEN and this record asserts none of them as
      met. H-P13-001 stays at `analyzed`.
    - >-
      B-9 THE EXTRAPOLATION SUPPORTS NO NIST-I STATEMENT. The red team stated
      that in those words and gave a reason stronger than the contract's own: the
      contract's reason (EA-1, statistical reach) is about width, whereas the
      measured window may not contain the quantity the extrapolation needs at all,
      in which case the extrapolation is not merely wide but BIASED. Either way,
      no NIST-I statement is carried.
    - >-
      B-10 A SAGE PROOF OF CONCEPT'S COST IS AN UPPER BOUND (EA-4). Interpreted
      Python, one build, no batched modular polynomial evaluation - which the
      frozen source's own Lemma 3.3 footnote names as the likely fast route and
      which this batch does not implement. A LARGE MEASURED COST DOES NOT
      ESTABLISH A SAFE MARGIN, and this asymmetry of licensing was pre-registered
      before any measurement existed, not discovered after one.
    - >-
      B-11 EA-5 IS CARRIED ADDITIVELY, NOT ABSORBED. Every margin figure computed
      through the committed EXP-P13VOW-001 model inherits that model's own
      0.05-3.51 bit reproduction band against the frozen source's five concrete
      pairs (the partial control failure of RUN-P13VOW-001). Neither review
      audited the model's internals; both imported it unmodified and checked its
      sha256 against the recorded value.
    - >-
      B-12 THE PSI MACHINERY DIVERGES FROM AN EXACT ENUMERATED COUNT AT THESE
      TINY X (declared deviation D-12), and the Kohel classical modular polynomial
      database is NOT INSTALLED on this host, so V-1 uses PARI's polmodular, which
      COMPUTES Phi_ell from scratch rather than retrieving it. Both are disclosed
      by the producer and both accountings are fitted and reported; but the
      contract's stated premise that Phi_ell come from a precomputed database DID
      NOT HOLD on this host, and that is a precondition any B-axis successor must
      resolve before it can measure what it intends to measure.
    - >-
      B-13 MODEL-LEVEL INDEPENDENCE IS UNAVAILABLE UNDER THIS HARNESS AND IS NOT
      CLAIMED. Executor, Validator and Red Team all resolve to claude-opus-5 with
      model_verified false, because Claude Code cannot resolve the GPT-5.6-family
      policy aliases in orchestration/model-policies.yaml. Independence here is
      SESSION-LEVEL AND IMPLEMENTATION-LEVEL AT BEST, and correlated blind spots
      between the three roles are NOT excluded by this design. CTRL-RT039-A's
      adversarial-mutation-selection rule - the perturbations tested against are
      chosen by a party other than the control's author - is named as the binding
      MITIGATION and IS NOT A SUBSTITUTE; the red team followed it and states that
      the mitigation is precisely why the design defect surfaced at all, since the
      shared model protected the mechanical execution layer but not the SELECTION
      layer where the prime range was chosen. NO MODEL-LEVEL INDEPENDENT
      CONFIRMATION IS ASSERTED BY THIS RECORD.
    - >-
      B-14 WHAT NEITHER REVIEW CHECKED. The Validator did NOT re-execute the
      measurement stage - it verified the fit stage byte-identically and
      recomputed every derived quantity independently, but did not re-measure a
      single timing, so a producer-side error in the MEASUREMENT harness would not
      have been caught. It also did not recompute the Lemma 3.2 / Section 4.1
      bound values per cell, did not recompute the MIX-1 per-ell medians, and did
      not re-execute the 1800 CTRL-COUNT spot-check witnesses. The Red Team did
      not run any B sweep at all, did not attack FIT-ELL on the primary series,
      did not audit the committed cost model's internals, did not use a second
      host, did not probe the V-2 route past the frozen ceiling, and did not
      re-derive CTRL-DRIFT from raw timings. Each named these gaps explicitly
      rather than leaving them to be discovered.
    - >-
      B-15 NOTHING HERE BEARS ON CSIDH, (qt-)PEGASIS OR TORSION-BASED SCHEMES,
      which the assessed attack does not cover, and nothing here places this batch
      on any attack frontier. The red team recorded the Pareto position as
      "not_applicable_no_attack_point_produced" after checking all three axes -
      no time-to-solve, no memory-for-a-solve, no query count exists to place -
      and sota_delta as 0 bits against the Delfs-Galbraith end-to-end baseline.
      IF ANY DOWNSTREAM RECORD PLACES THIS BATCH ON A FRONTIER, THAT RECORD IS
      OVERSTATING IT.

  unresolved_confounds:
    - >-
      UC-1 WHETHER THE MEASURED FLATNESS IS A PROPERTY OF ALGORITHM 1 OR OF THE
