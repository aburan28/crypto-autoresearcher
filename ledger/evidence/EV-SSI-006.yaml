      series. Settleable by re-analysis of the archived raw data alone.
    - >-
      UC-3 THE B-DEPENDENCE, WHICH IS WHERE THE DECISION-RELEVANT OVERHEAD WOULD
      HAVE TO LIVE, IS UNMEASURED AT ANY SCALE BY ANYTHING IN THIS BATCH OR EITHER
