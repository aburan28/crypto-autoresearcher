evidence:
  id: EV-MDFIVE-f3e1ca
  hypothesis_id: null
  hypothesis_id_note: >-
    Explicitly null, not omitted: this is an instrument-calibration record for
    RQ-MDFIVE-6870c1. It measures the search instrument at a declared
    encoding, seed, and ceiling; it asserts nothing about MD5 (SC-2) and no
    hypothesis is supported, weakened, or rejected by it.
  experiment_ids: []
  run_ids:
    - RUN-MDFIVE-calib-v0-s0
    - RUN-MDFIVE-calib-v16-s0
  question_id: RQ-MDFIVE-6870c1
  batch_id: BATCH-1f30fe
  type: empirical
  direction: neutral
  strength: single_run
  strength_note: >-
    The calibration is one target run plus one null-object control run under
    one protocol, one seed, and one encoding. It is not a replication (the
    null run is a control, not a repeat of the target), so single_run is the
    honest tier; the pair's R ratio is the control comparison, not a
    reproducibility claim.
  claim_tier: blind_calibration_execution_and_instrument_verdict_only
  proof_status: empirical_only
  proof_refs: []
  proof_status_basis: >-
    No cryptanalytic claim is made or reviewed in this record. It documents
    the executed blind calibration (BCP-2), its decision-table outcome, its
    cost anchor, and the two independent reviews of the frozen package.

  observations:
    - id: O-1
      text: >-
        CALIBRATION OUTCOME (row R6). The blind target run
        (RUN-MDFIVE-calib-v0-s0, standard MD5, seed 0, 900 s ceiling,
        run_wrapped) and the null-object run (RUN-MDFIVE-calib-v16-s0,
        round constants cyclically shifted by 16, identical in every other
        respect) BOTH FAILED: each exhausted its declared search space
        (2^21 = 2,097,152 second blocks, meet table over the low 40 digest
        bits) with stop_reason table_full, neither reaching the 900 s wall
        (54.179836 s and 55.156728 s wrapper-measured respectively), each
        with exactly one 40-bit-key partial hit carrying a 0-bit MSB prefix
        (random-collision signature, no progress toward a full 128-bit
        match), certificate kind none. Per BCP-2's decision table the pair
        lands on row R6 (target FAIL, variant FAIL): shows "the instrument
        found nothing on either object within budget"; does_not_show "that
        no collision path exists for either (SC-4)". R = 55.156728 /
        54.179836 = 1.018031, within TOL = 2 (COMPARABLE; the tolerance was
        fixed before acquisition, not tuned). A clean failure at comparable
        cost rules out both "found by search" and "found by recall" equally
        at this instrument, encoding, seed, and ceiling (SC-4).
    - id: O-2
      text: >-
        COST ANCHOR (what a dependent goal may cite). The bounded
        2^21-block birthday enumeration with a 40-bit-key meet table costs
        ~54-55 s wall at the declared encoding (hex 512-bit blocks, full
        128-bit digest equality) on this hardware, wrapper-measured
        (timing_source: wrapper on both runs; no caller-supplied timing).
        The declared search space is ~2^64 blocks away from a full 128-bit
        match, so the declared instrument cannot, at this budget, close a
        collision by search. The 900 s ceiling was never reached by either
        run, so cost = measured wall_seconds (not the ceiling). The
        instrument IMPLEMENTATION cost (TASK-20260821-f5f96a, 1500 s
        declared, ~6513 s actual, disclosed overrun with Coordinator
        ruling) is a batch cost, charged to the batch budget, and is
        distinct from and must not be read as the search cost (K4, red
        team).
    - id: O-3
      text: >-
        PRE-DISPATCH GATE. The BCP-2 pinned canonicalization, run verbatim
        on the quarantined payload with hash-only access, reproduces the
        pre-registered digest 2ea0083baa99e0af841f09e14ed5a5ab0488f2b8df0c5ffe1512e0be5cc05002.
        Three independent recomputations agree: the BATCH-312472
        coordinator pre-freeze, the target run at dispatch (Python 3.12.8 /
        PyYAML 6.0.3), and the validator at review time (same
        interpreter/PyYAML). The payload was never opened in any context
        (hash-only is the declared gate mechanic); its sha256
        e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5
        is unchanged at freeze.
    - id: O-4
      text: >-
        INPUT CLOSURE. Both runs' input sets were sealed as closed
        hash-manifested sets before the runs (target manifest sha256
        c5128a8488b8ccf9c13fabe53d83f5a33bd376e907042040e74fcf0895f52e82;
        null manifest sha256 e15e9c6f0206386265845676fa910af5ae52693e5dc03cd210b6777d892cd256,
        with the T-prime table as its own sealed entry
        299ca169fff6c3f700839817af6a2a86926b77f7395b2012e0311d1ae08c5a23).
        The sole specification input is RFC 1321 (inputs/rfc1321-md5.txt,
        sha256 284a79d148400d9cd2a423211d1103b5cef0fb9256a4cbe6d7ebe5197c3149dd,
        provenance: retrieved from rfc-editor.org 2026-08-21). Both
        CONSUMPTION intersections with the quarantine MANIFEST sha256 list
        are empty. The null run's variant (T-prime[i] = T[(i+16) mod 64])
        was verified to be EXACTLY the declared cyclic shift and nothing
        else: the red team recomputed the table from the RFC 1321 section
        3.4 constants (0 mismatches against the sine definition, 64
        distinct values) and found no second unannounced difference (K2);
        the validator independently recomputed the full 64-entry table and
        diffed it (check 5, pass).
    - id: O-5
      text: >-
        ROUND VERDICTS. Two concurrent independent reviews under the
        pre-committed plan review-plan-9c62ae.yaml (written in the batch
        opening commit, before either reviewer ran; the Coordinator prior
        K1-K5 recorded in the plan before any report returned): red team
        TASK-20260821-9c62ae (resolved model zai/glm-5.2, xhigh,
        independent session) verdict holds-with-named-gaps - joints K1-K5
        all hold, proves-too-much objects D/E/F all rejected as the plan
        declares, blind re-derivation of the REDISCOVERY-eligibility
        predicate from BCP-2's evidence_record_requirement section only
        agrees with the implemented behavior on D and F, blind_from
        respected, NO prior overturns (the prior - FAIL/FAIL row R6 - held).
        Validator TASK-20260821-aabf94 (resolved model zai/glm-5.2, xhigh,
        independent session) determination HOLDS - all seven mechanical
        checks pass on its own re-run output (gate recompute MATCH, ceiling
        reports internally consistent with the run records, wrapper timing,
        CONSUMPTION empty, T-prime exact, suite 35 passing, firewall
        carry-over with no regression), 0 defects. The two determinations
        agree; the four red-team named gaps (DEF-1..DEF-4, all
        minor/informational, none batch-halting) are dispositioned in
        DEC-20260821-6df1e9 F-3.
    - id: O-6
      text: >-
        INSTRUMENT VERDICT (the claim this batch is licensed to make). The
        bounded enumeration instrument (harness/run_md5_calib.py, sha256
        50f75444c7c9a80e2fc15c5f06649b7af9c51201ab0ac49fed4eb9e6aa26aed1;
        standalone MD5 from the RFC text + deterministic 2^21-block
        birthday search, 40-bit-key table) at the declared encoding, seed,
        and ceiling: (a) executes BCP-2's blind protocol honestly (gate,
        seal, run, report - all verified independently); (b) cannot, at
        the declared budget, close a full 128-bit match by search (the
        declared space is ~2^64 blocks short); (c) shows no recall tell -
        the search report carries real search history (blocks evaluated,
        fragments tried, table size, ceiling/exhaustion stop, one random
        40-bit partial), not an instant answer; (d) is not an artifact of
        the target structure - the identical-cost null object (R =
        1.018031) shows the measurement decays as the parameter meant to
        destroy the signal destroys it. This is a statement about the
        instrument at the declared scope, never evidence about MD5 (SC-4).
        The method-ceiling audit (what instrument class could close the
        64-step gap, and at what cost) and the MD4 lower control remain
        OPEN AND UNATTEMPTED and are the first step of the next batch,
        which opens with MD4, not MD5 (SC-5).
    - id: O-7
      text: >-
        DISCLOSED DEVIATIONS (carried to DEC-20260821-6df1e9 for formal
        disposition; none affects the R6 verdict). (1) f5f96a strategy: the
        card suggested "differential/MTM" as an example; the executor
        implemented and declared a bounded birthday (collision-by-
        enumeration) search - accepted, the differential path would have
        imported knowledge of the published path into the instrument
        being calibrated. (2) f5f96a budget: ~6513 s actual vs 1500 s
        declared (~4.3x), continued past the ceiling to finish
        load-bearing deliverables - accepted as a disclosed budget
        outcome, halt-rule breach recorded as a procedural deviation.
        (3) f5f96a smoke records: pre-correction smoke run records
        (pre-fix module sha e5dcf29d...) were deleted and replaced by
        same-ID post-correction records after the docstring fix; the lost
        pre-correction bytes are unrecoverable; the post-correction
        records (module sha 50f75444...) are the binding ones.

