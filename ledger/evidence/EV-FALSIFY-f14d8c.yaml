evidence:
  id: EV-FALSIFY-f14d8c
  hypothesis_id: H-FALSIFY-40538b
  question_id: RQ-FALSIFY-a2c501
  experiment_ids: [EXP-FALSIFY-d770c1]
  run_ids: []
  run_ids_note: >-
    Arithmetic over two committed tables; the computation is quoted in the
    observations and needs no run package.
  findings_under_test: [KN-FIND-015, KN-FIND-013]
  type: analytical
  direction: inconclusive
  direction_note: >-
    KN-FIND-015's derived arithmetic is fully consistent and its measurements are
    not verifiable in this environment. KN-FIND-013 carries an internal
    inconsistency this probe can exhibit but not resolve. Neither is refuted.
  strength: moderate
  claim_tier: theory
  proof_status: derivation
  proof_status_basis: >-
    Exact arithmetic over published table values. No measurement was made and
    no estimator was run.
  proof_refs:
    - knowledge/findings/KN-FIND-015.md
    - knowledge/findings/KN-FIND-013.md
  recorded_at: '2026-08-08'

  observations:
    - id: O-1
      text: >-
        RULE 2. CORR-20260731-004 names KN-FIND-015 but is an ID-remap record
        (record_id MERGE-ID-REMAP-GOAL-MLKEM-003-DUAL-ATTACK) and does not
        correct it. Both records are current. KN-FIND-013 is one of the three
        sibling repairs of KN-FIND-012 identified in EV-FALSIFY-2feed0.
    - id: O-2
      text: >-
        KN-FIND-015's DERIVED ARITHMETIC IS FULLY CONSISTENT, 12 of 12 checks.
        Carrier gaps: 143.79-139.5=4.29, 203.79-195.1=8.69, 273.82-259.7=14.12
        against recorded 4.3 / 8.7 / 14.1. MATZOV-2022 gaps: 6.29 / 10.29 / 16.02
        against 6.3 / 10.3 / 16.0. primal_bdd below NIST: 2.80 / 6.04 / 1.28
        against 2.8 / 6.0 / 1.3. And primal_bdd is below dual_hybrid+fft in all
        three sets, so "best = primal_bdd" holds as stated.
    - id: O-3
      text: >-
        BUT ITS MEASUREMENTS ARE NOT VERIFIABLE HERE, and this is a limit of the
        environment rather than a criticism. The primal_bdd and dual_hybrid+fft
        columns come from lattice-estimator at pinned commit
        3e48ef421ec256afddb3e7d2249a77eab6e9ba12 under RC.MATZOV. That package is
        not installed and the commit cannot be fetched. What is checked here is
        the record's arithmetic, not its estimates. The pinning is itself good
        practice and is what would make an independent reproduction possible
        elsewhere.
    - id: O-4
      text: >-
        KN-FIND-013's CROSSOVER DELTA IS NOT THE SIMPLE GAP, which is correct and
        expected. Recorded Delta: 9.5 / 14.4 / 14.8. NIST minus baseline CC:
        3.5 / 11.9 / 12.3. Delta exceeds the gap by 6.0 / 2.5 / 2.5, consistent
        with HEUR-S1 routing Delta through R inside a logarithm so that one bit
        of Pwrong underestimation buys less than one bit of CC.
    - id: O-5
      text: >-
        THE IMPLIED CONVERSION RATE IS INCONSISTENT ACROSS THE THREE SETS.
        Dividing gap by Delta gives CC bits purchased per Delta bit:
        Kyber-512 0.37, Kyber-768 0.83, Kyber-1024 0.83. The 768 and 1024 rows
        agree to two decimal places; Kyber-512 differs from them by a factor of
        2.2. Under a single cost model with parameters varying smoothly across
        the three sets, a rate that is flat for two of them and less than half
        for the third is the kind of thing that wants an explanation.
    - id: O-6
      text: >-
        AND IT CANNOT BE RESOLVED FROM THE RECORD. KN-FIND-013 states HEUR-S1 in
        words -- "an underestimation of log2(Pwrong) by Delta bits is paid as
        +Delta in log2(R*(N*Tdec+TFFT)) inside Theorem 4.1" -- but does not
        reproduce the Theorem 4.1 cost expression or the per-set parameters, so
        Delta is not recomputable from what the record supplies. The column
        header says "Case A crossover Delta", implying other cases exist that the
        record does not give. This is a REPRODUCIBILITY GAP, not a demonstrated
        error: the Kyber-512 rate may be a genuine regime difference, and this
        probe cannot tell.
    - id: O-7
      text: >-
        CROSS-RECORD CONSISTENCY IS GOOD. KN-FIND-013's baseline CC column
        (139.5 / 195.1 / 259.7) matches KN-FIND-015's "Carrier claim" column
        exactly, and both match the figures KN-FIND-015 attributes to Carrier.
        The two records agree on their shared inputs.
    - id: O-8
      text: >-
        BOTH RECORDS SCOPE THEMSELVES WELL. KN-FIND-015 labels its own level
        "Empirical / estimate level (not a cryptanalytic certificate)", tags
        itself `contested`, and lists non-claims including "Not a break of
        ML-KEM / FIPS 203; no key recovery; no solution certificate".
        KN-FIND-013 labels its result "(conditional)", calls KN-FIND-012's ~84
        bit figure "an *upper reference*, not a measured error", and its
        non-claims read "Conditional sensitivity only. Not a corrected security
        level. Not an ML-KEM break."

  interpretation: >-
    KN-FIND-015 is arithmetically sound and honestly scoped; its estimates need
    an environment with lattice-estimator to check and the record pins what is
    needed to do so. KN-FIND-013 is honestly scoped too, but its central column
    cannot be recomputed from the record, and the conversion rate implied by its
    own numbers is inconsistent across the three parameter sets by a factor of
    2.2 at Kyber-512.

  what_this_does_not_establish: >-
    Nothing about ML-KEM or Kyber security, and no view on whether dual attacks
    beat primal ones -- KN-FIND-015's substantive claim is untested here because
    its instrument is unavailable. KN-FIND-013 is NOT shown to be wrong: an
    inconsistent implied rate is a question, and the model that would answer it
    is absent from the record rather than absent from the world. No attempt was
    made to locate the Theorem 4.1 expression in coordination/ or in the
    inputs/ paper text, which is where a follow-up should start.

  dominated_by: not_applicable_methodological
  sota_delta:
    time_exponent: not_applicable
    note: No algorithmic claim.

  proposed_correction: >-
    For KN-FIND-013: state the Theorem 4.1 cost expression and the per-set
    parameters used, or cite the exact artifact containing them, so Delta is
    recomputable; and either explain the Kyber-512 rate or recheck it. For
    KN-FIND-015: no correction proposed -- record an explicit note that
    reproduction requires lattice-estimator at the pinned commit, which the
    record already supplies. Coordinator authority.

  knowledge_promotion: not_warranted
  knowledge_promotion_reason: >-
    An arithmetic check of two records plus one unresolved question. Not
    knowledge.

  scope_limits: >-
    The published tables in KN-FIND-013 and KN-FIND-015 as committed at this
    branch head. No estimator was run; no external source consulted.

  independent_review_required: false
  independent_review_note: >-
    Refutes nothing and asserts no mathematics. O-5 raises a question for whoever
    holds the Theorem 4.1 model; it is not a contradiction of a validated record.

  authority_note: >-
    Evidence only. No hypothesis status changed, no finding edited or
    superseded (AGENTS.md rule 1).
