    2.6 table -- are labelled instrument checks and never certificates, which the
    Validator also verified.

  proof_status: derivation
  proof_refs:
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-9e3584/reviews/TASK-20260809-444fe7/red_team_report.md
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-9e3584/reviews/TASK-20260809-444fe7/probes/probe_nullroute.py
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-9e3584/reviews/TASK-20260809-444fe7/probes/probe_nullroute_output.json
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-9e3584/reviews/TASK-20260809-444fe7/probes/probe_c2_centered.py
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-9e3584/reviews/TASK-20260809-444fe7/probes/probe_c2_centered_output.json
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-9e3584/reviews/TASK-20260809-3f1dc4/validation_report.yaml
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-9e3584/tasks/TASK-20260809-cda2f6/results_relvar.json
  proof_status_note: >-
    `derivation` is claimed for THREE specific negative instrument results and for
    nothing else, and the split is stated so no successor reads the label as
    covering the batch.
    DERIVATION-BACKED, each with a BUILT counterexample or an exact algebraic
    argument archived in this same commit.
    (a) RT-7: MS_S, MS_P and MS_res in se_decomposition are functions of centred
    deviations only, so a constant offset added to every entry of the 8x4 table
    adds the same constant to the grand mean, to every row mean and to every column
    mean and leaves all three algebraically unchanged. SE, nu_eff and the
    NEGATIVE-VARIANCE-COMPONENT flag are therefore invariants of the constant-
    offset group action. The measured 8.527e-16 over the frozen ladder (reproducing
    the producer's reported 8.53e-16) and 8.938e-11 at offsets of 1e6 * SE are the
    signature of an exact identity; a structured one-column injection moves the
    recovered SE by 11.68 relative. Section C2 therefore ran in the could-not-FIRE
    arrangement prereg 5.4 claims to have averted.
    (b) RT-1: bit identity of 8 IEEE-754 doubles is a property of an ARITHMETIC
    ROUTE, not of a function. The counterexample is built rather than argued: the
    same closed form X_null evaluated by QR of B^T (R2) and on an ambient-isometry
    presentation BH (R5) is 0 of 38 cells bit-identical, agrees with the closed form
    to 5.07e-14 and 3.11e-14 relative, reproduces the notarized prereg 2.6 table at
    304 of 304 cell-by-basis entries to every printed digit, walks G-REL1 at 10 of
    10 and G-REL2 at 19 of 19, and is ADMITTED by G-VAR.
    (c) RT-6: for a null with SE ratio 1 the expected c_min is 1 + t_{n-1,0.998},
    which FALLS with more draws (5.207 at n = 8 to 3.878 as n grows) while the
    carried headline c = 6 lies above it at every n, so the null count saturates
    UPWARD toward 48 of 48 with more data rather than decaying.
    EMPIRICAL_ONLY, DECLARED AS SUCH: every count, every mean, every paired t,
    every detection floor, the mu amplitude statistic, the Monte-Carlo falsifier
    probability, the two Validator null families and the centered C2 ladder. These
    are measurements at the stated scope and carry no derivation.
    NO REFUTATION ARTIFACT IS OWED HERE because no adverse transition is made: the
    decision this record supports is `revise`, no hypothesis status moves, and
    nothing is weakened or rejected. The three derivation items above are archived
    ahead of the decision that cites them, in the same commit, so that a successor
    can check them rather than take them.

  coordinator_verification_performed:
    declared_because_a_coordinator_claim_about_the_record_was_falsified_once_in_this_goal: >-
      BATCH-cbe023 produced a Coordinator claim about the git record that its
      Validator then proved false (that batch's F-1). This block therefore
