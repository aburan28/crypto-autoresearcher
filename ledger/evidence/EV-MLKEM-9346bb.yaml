    control_comparability: >-
      CHECKED AND SATISFIED, with two DECLARED LIMITS. Satisfied: the X_mp =
      rawtail MUST-PASS guard was frozen in the notarized text at 1aa7db53 and
      cannot have been chosen after seeing which candidates passed, because no
      producer file exists at that commit; it fired (G-REL1 10 of 10, G-REL2 14 of
      19), and its five failing cells are all at beta = d/2 where the mirror map is
      self-symmetric and all five fall below their own detection floors. G-VAR is
      non-vacuous in both directions -- it refuses rdet and X_null at 38 of 38 each
      while admitting lam1n, hkz and rawtail at 0 of their cells bit-identical, and
      the Validator re-verified the admit side by rebuilding the bases and
      measuring rawtail's between-basis sd directly (0.154583 at L7 beta 5,
      0.040189 at L1 beta 15). The negative controls behave: Section B-prime's
      c = -6 gives n_fire 0 of 48, and Section C2's delta = 0 reproduces every
      committed value at relative deviation exactly 0.0. DECLARED LIMIT ONE: the
      guard's amplitude is one to two orders of magnitude above the candidates' --
      mu median 0.224 against hkz 16.3 and lam1n 2.30, its mirrored gap 79x to 266x
      the candidate's at identical cells -- so it certifies that the criterion can
      fire and NOT that it resolves an effect of the candidates' size (RT-3).
      DECLARED LIMIT TWO: Section C2's positive control is confined to the
      estimator's own invariance class, so it is not comparable to the SE-inflation
      failure AM-14(b) names (RT-7).
    artifact_policy_per_producer: >-
      4 of 4 PASS. Durable command.txt, stdout.log and stderr.log present in every
      task directory with byte counts matching each manifest's stderr_bytes 0 and
