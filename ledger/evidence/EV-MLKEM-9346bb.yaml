  the_RT1_VP5_adjudication:
    why_this_block_exists: >-
      The two reviews reach different-sounding conclusions about how general the
      G-VAR refusal is, and the Validator did not read the Red Team's probes (it
      records that it deliberately did not, and that any disagreement is therefore
      genuine rather than an artifact of shared inputs). This is adjudicated
      explicitly rather than left in prose.
    what_each_reviewer_actually_measured:
      red_team_RT_1: >-
        Six arithmetic routes to log|det B| scored through the same gate path. R0
        (closed form) and R1 (slogdet of B) and R3 (slogdet of UB) are 38 of 38
        bit-identical and REFUSED. R2 (QR of B^T), R4 (0.5 slogdet of BB^T) and R5
        (slogdet of BH) are 0 of 38 bit-identical and ADMITTED. All six reproduce
        the notarized prereg 2.6 table at 304 of 304 entries and walk G-REL2 19/19.
      validator_V_P5: >-
        One counterfactual route -- X_null computed the way its definition literally
        reads, (beta/d)(1/d) times slogdet of the ACTUAL matrix B -- at all 38 cells
        over all 8 bases. Bit-identical at 38 of 38, exactly as the matrix-free form
        is; at L7 beta 5 the two routes agree bitwise.
    the_adjudication: >-
      THEY ARE NOT IN CONFLICT, AND THE EVIDENCE DISCRIMINATES CLEANLY. The
      Validator's V-P5 route IS the Red Team's R1 row, and the two reviewers report
      THE SAME RESULT FOR IT: 38 of 38 bit-identical. There is no route on which
      both measured and disagreed. The union of their measurements is a single
      consistent table, and what differs is the QUESTION each answered.
    ruling_1_R_OUT_1_STANDS_AND_IS_NOT_AN_ARTIFACT_OF_THE_PRODUCERS_ROUTE_CHOICE: >-
      UPHELD ON THE VALIDATOR'S GROUND AND ON THE RED TEAM'S OWN CONCESSION. The
      sharpest available objection to the headline -- that X_null's zero dispersion
      is an artifact of never touching a basis -- is REFUTED BY MEASUREMENT: the
      matrix route gives the identical refusal. The Validator opened that objection
      itself and then killed it, and reports doing so at the same weight as its
      adverse findings. The Red Team independently confirms the same route at R1 and
      states in terms that RT-1 does not overturn R-OUT-1. The producer's
      implementation choice is a DISCLOSURE GAP (F-9: it is disclosed only in a
      source-code docstring and is not among the manifest's two declared
      implementation_completions) AND NOTHING MORE.
    ruling_2_THE_GENERALITY_CLAIMED_FOR_THE_REFUSAL_FALLS: >-
      UPHELD FOR THE RED TEAM, AND UNREBUTTED. Nothing the Validator measured bears
      on routes R2, R4 or R5, and the Validator does not claim otherwise. The
      Red Team exhibited a BUILT counterexample: the same function of (d, k, beta, q)
      evaluated by a different float path is ADMITTED while reproducing the notarized
      table at 304 of 304 entries. Therefore report_relvar.md section 5(iii)'s "it
      cannot be tuned into or out of firing" is FALSE AS STATED AND NOT CITABLE, and
      the docstring at measure_relvar.py:260 asserting that the zero dispersion is
      "a property of the observable and not of a float path" asserts what the code
      cannot deliver. This is corroborated INSIDE THE PRODUCER'S OWN ARTIFACT by
      rdet_T1_ambient_isometry_residual = 3.865e-12 (OBS-3), which I verified myself.
    ruling_3_THE_NARROW_POINT_WHERE_THEY_WOULD_DIVIDE_IF_PRESSED: >-
      The Validator writes that the matrix-free choice is "NOT load-bearing". That
      is TRUE OF THE VERDICT and FALSE OF THE JUSTIFICATION. R-OUT-1 does not depend
      on it (ruling 1); the claim that bit identity operationalizes AM-11's
      quantification over FUNCTIONS does depend on it, and that claim is false
      (ruling 2). Both statements stand; neither reviewer is corrected.
    what_remains_genuinely_UNRESOLVED_and_its_named_successor_test: >-
      NEITHER REVIEW TESTED WHETHER A SCALED DISPERSION CRITERION ACTUALLY
      SEPARATES. The Red Team proposes one and gives its target behaviour but did
      not implement it as a criterion; the Validator did not consider it. THE NAMED
      SUCCESSOR TEST, and it is cheap: implement G-VAR2 as between-basis sd measured
      against the candidate's own between-cell range at fixed (d, k), reported as a
      38-cell profile rather than an all-cells Boolean, and validate it against the
      six routes ALREADY BUILT AND COMMITTED IN probe_nullroute.py, whose committed
      output states the required behaviour in advance: ALL SIX routes to X_null and
      to rdet must be REFUSED while lam1n, hkz and rawtail remain ADMITTED. Estimated
      seconds to low minutes at d <= 40 with no new reduction, by comparison with the
      measured 0.31 s of probe_nullroute.py and the measured 48.38 s of the producer
      run it would replace. UNTIL THAT RUNS, NO ADMISSIBILITY CLAIM IS REPORTABLE
      FROM THIS GATE IN EITHER DIRECTION.

  the_AM13_consistency_check_ruling_for_P_R6:
    who_assigned_it: >-
      The Validator, finding F-4: "I do not adjudicate whether AM-13's clause, whose
      surrounding text is about Section B, formally reaches Section R; that scope
      call is the Coordinator's. I record the fact." This block answers it.
    the_clause: >-
      AM-13 of DEC-20260808-05b684, final sentence: "Additionally, a prediction
      whose falsifier is empty conditional on a bit-exact reproduction check is not
      a prediction and must be labelled a CONSISTENCY CHECK."
    the_fact_to_be_ruled_on: >-
      P-R6 asks whether this run's L7/L8 beta-5 paired t is below t_crit, against a
      quoted figure of -0.064 that the BATCH-cbe023 Red Team obtained from the SAME
      frozen basis construction with the SAME carried seed formula through the SAME
      carried HKZ pipeline. Its falsifier is empty unless the two implementations or
      the two platforms differ, and the record does NOT establish that they differ
      (C-F5). It is not labelled a CONSISTENCY CHECK.
    ruling: >-
      AM-13's FINAL CLAUSE IS GENERAL AND REACHES SECTION R. P-R6 IS RECORDED HERE
      AS A CONSISTENCY CHECK, NOT AS A PREDICTION, AND IT DOES NOT COUNT TOWARD
      SECTION R'S EMPIRICAL CONTENT.
    grounds:
    - >-
      TEXT. The clause is stated without restriction. It names no section, no count,
      and no null family, and it is introduced by "Additionally", which separates it
      from the count-specific requirement preceding it. AM-12 in the same decision
      is likewise stated in general terms and has been applied across sections
      without objection.
    - >-
      CARRY. DEC-20260808-05b684's own next_actions bind "AM-10 through AM-14 above
      and their binding carries" into EVERY SUCCESSOR PRE-REGISTRATION, with no
      section qualification, and this batch's four task cards carry them that way.
    - >-
      PURPOSE. The clause exists so that a prediction whose falsifier is empty is
      not counted as evidential content. That purpose is identical wherever the
      prediction sits, and reading the clause as Section-B-only would let the
      identical defect pass in any other section -- which is what happened here.
    what_this_ruling_is_NOT:
    - >-
      IT IS NOT A FINDING OF PRODUCER NON-COMPLIANCE, and I decline to make one. The
      clause's surrounding text is about Section B and the ambiguity is the
      amendment's, not the producer's. Ruling otherwise would change a success
      criterion after observing the outcome, which my own contract forbids. The
      producer labelled P-R6 as it read the clause, and the reading was defensible.
    - >-
      IT IS NOT A RE-LITIGATION OF AM-13. Its merits are untouched; this is a scope
      reading, which is what the Validator asked for and what only the Coordinator
      may give.
    prospective_effect: >-
      Carried forward as AM-15 in DEC-20260809-afe29b: AM-13's final clause binds
      EVERY section of EVERY successor pre-registration in this goal, and a
      prediction meeting its antecedent must be labelled CONSISTENCY CHECK in the
      pre-registration itself, before the run.
    consequence_for_the_count: >-
      With P-R7 removed by both reviews and P-R6 ruled a consistency check, Section
      R's genuinely open predictions number ONE: P-R1. This is why OBS-9 records one
      rather than the Red Team's two, and the divergence and its reason are both on
      the record.

  the_F7_ruling_on_the_immutable_notarized_text:
    the_fact: >-
      The binding carry from DEC-20260808-05b684 says the committed real count of 29
      of 48 may not appear without the exact-null benchmark of 47 of 48 in the same
      sentence. FOUR occurrences carry the count with no benchmark in the same
      sentence or line: prereg.md line 576 (the P-B1 bullet, INSIDE THE NOTARIZED
      FROZEN TEXT AT 1aa7db53), report_nullfam.md line 37, report_nullfam.md line 89
      and results_nullfam.json line 4382. Seven other occurrences are compliant,
      including the required headline sentence at report_nullfam.md line 25 and the
      stdout log, which carry both counts.
    why_it_cannot_be_repaired: >-
      Editing prereg.md would destroy the property the notarization exists to
      establish -- that the frozen text provably predates every measurement it
      governs -- which is the strongest single property of this batch, verified in
      both directions by both reviews. Editing the three producer artifacts would
      edit committed run records, which AGENTS.md rule 4 forbids and which would
      additionally invalidate their own declared hashes. THE BREACH IS DECLARED, NOT
      REPAIRED.
    ruling: >-
      THE CARRY IS RESTATED AS A CITATION RULE RATHER THAN AN OCCURRENCE RULE. It
      binds what any artifact QUOTES, not what an already-frozen text contains.
      Concretely and bindingly: (i) no successor may quote prereg.md line 576,
      report_nullfam.md line 37 or line 89, or results_nullfam.json line 4382 in
      isolation; (ii) every citation of the committed real count of 29 of 48 carries
      the exact-null benchmark of 47 of 48 in the SAME SENTENCE, as every occurrence
      in this record and in DEC-20260809-afe29b does; (iii) the purpose -- that the
      real count never travels without the benchmark showing it is not evidence of
      an effect -- is met at DOCUMENT level in all four cases, since both counts
      appear prominently in the same short document, and the Validator says so.
    prospective_effect: >-
      Carried forward as AM-15(b): a binding non-citation carry is enforced at the
      point of QUOTATION and must be written that way when it is created, because a
      carry expressed as an occurrence rule is unsatisfiable the moment it touches
      an immutable text.

