evidence:
  id: EV-MLKEM-9346bb

  hypothesis_id: null
  hypothesis_id_note: >-
    DELIBERATELY NULL, for the same reason as EV-MLKEM-9b8f7f and EV-MLKEM-cd9878.
    BATCH-9e3584 measured INSTRUMENTS, not lattices: an admissibility gate over a
    frozen candidate list plus a parameter-determined null (Section R), a null
    family for a monotonicity count (Section B-prime), a re-derived relative floor
    (Section C1), and an injecting positive control for a variance decomposition
    (Section C2). Every producer report and the frozen contract state that no
    verdict in the batch adjudicates any claim about a lattice. Naming a hypothesis
    here would invite exactly the inference these runs cannot support.

  experiment_ids: []
  experiment_ids_note: >-
    No EXP-* record governs this batch. The frozen contract is the notarized
    pre-registration
    coordination/goals/GOAL-MLKEM-005/batches/BATCH-9e3584/tasks/TASK-20260809-4011dd/prereg.md,
    sha256 190cf4740b0ecefdbe7d1da0868a6258352b044ae5e99da470060f94049c70ea,
    notarized in commit 1aa7db5313f6d3da1f366443d4d6066597393402 by
    TASK-20260809-91cf76 before any producer was dispatched. The Validator
    recomputed that sha256 from the worktree file, from the blob inside 1aa7db53,
    from the sidecar prereg_sha256.txt and from every producer's task-card constant
    and reports all four equal (N-6).

  run_ids: []
  run_ids_note: >-
    No RUN-* index record exists. The twenty-eight producer artifacts (four
    packages of seven: script, raw JSON, report, run_manifest.yaml, command.txt,
    stdout.log, stderr.log) are snapshot-committed at
    c034ef38003028a20b8e97f7f0a55bd6a16fdb5d by TASK-20260809-4d928d. Producer
    runs: TASK-20260809-cda2f6 (Section R, the LEAD), TASK-20260809-311784
    (Section B-prime, AM-13 null family), TASK-20260809-97d6cf (Section C1, AM-14
    c/d/e), TASK-20260809-3eb72c (Section C2, AM-14 b). Each is 1 of 1 run, VALID.
    ARTIFACTS ARE CITED BY THEIR COMMITTED FILENAMES ONLY -- measure_relvar.py /
    results_relvar.json / report_relvar.md; measure_nullfam.py /
    results_nullfam.json / report_nullfam.md; rescore_c1.py / results_c1.json /
    report_c1.md; posctl_c2.py / results_c2.json / report_c2.md. The names in the
    original dispatch_queue.json for -311784, -97d6cf and -3eb72c are DANGLING
    (defect D3) and must never be used to cite anything.

  type: empirical

  direction: neutral
  direction_note: >-
    NEUTRAL, and this is the honest reading rather than a hedge. Nothing in this
    batch supports, weakens or contradicts any hypothesis about lattices, about
    reduction, about the Beta tail law, or about ML-KEM. What it establishes is
    about four instruments. The batch's lead outcome R-OUT-1 is a REFUSAL -- the
    AM-4/AM-8 admissibility gate is INADMISSIBLE under G-VAR -- and a refusal
    licenses no admissibility claim in either direction. Both independent reviews
    say so in terms and neither asserts one.

  strength: replicated
  strength_basis: >-
    `replicated` is claimed for MEASUREMENT REPRODUCIBILITY and for a short list of
    NAMED INSTRUMENT FACTS. It is NOT claimed for any statement about lattices and
    NOT claimed for the single-source items enumerated in (iv).
    (i) REPRODUCIBILITY, AT A DEPTH THIS GOAL HAS NOT PREVIOUSLY REACHED. The
    Validator (TASK-20260809-3f1dc4) recomputed every reported statistic in all
    four sections from the rawest retained quantity with its own implementation --
    936 per-basis entries across 117 scored cells, the paired statistics at all 95
    G-REL2 cells with data, 48 live Section B-prime steps at all 11 c values, and
    every field of every Section C1 and C2 target from the committed raw 8x4 Delta
    tables -- at 1e-12 relative with ZERO mismatches across roughly ten thousand
    comparisons, and re-executed the lead end to end from source, reproducing
    results_relvar.json BITWISE on every key except wall-clock timings (49
    differences, all `secs` fields). The Red Team (TASK-20260809-444fe7)
    independently reproduced every G_REL2 aggregate from its own per-basis entries
    at max deviation 0.0 at all five candidates, and reproduced the whole
    results_nullfam.json n_fire table exactly across the c grid.
    (ii) NINETEEN FORCED OR CARRIED VALUES RE-DERIVED AS FIRST-CLASS ARTIFACTS,
    several by paths touching no producer code: the entire 38-cell X_null
    closed-form table of prereg 2.6 re-derived by exact rational parameter
    arithmetic times a 40-digit logarithm, agreeing with the frozen six-decimal
    table AND with the run's recorded doubles at 1e-13; rdet = q^((d-k)/d)
    re-derived at all 38 cells at 40 digits; three Student-t quantiles obtained by
    inverting the exact CDF through the regularized incomplete beta and
    cross-checked by direct quadrature of the density; log(3329) confirmed to the
    last double.
    (iii) INSTRUMENT FACTS REPLICATED ACROSS INDEPENDENT OBJECTS. (a) The
    inadmissibility of the gate under G-VAR does not rest on the producer's
    evidence: the Validator BUILT two parameter-determined observables the producer
    never saw -- V2_logdens and V3_nullscaled -- and both walk G-REL1 at 10 of 10
    and G-REL2 at 19 of 19 and 16 of 19 respectively through the producer's own
    imported gate code while bit-identical across all 8 bases at 38 of 38 cells,
    with V3 bounded by 0.5322, INSIDE the failing candidate hkz's own realized
    magnitude range. A third observable of its own, V1_gsa_tail, correctly FAILS
    the same gate, so the demonstration is not that its probes pass everything.
    (b) The Section B-prime direction reproduces on two null families the Validator
    built with different seed constructions: n_fire(c=6) of 35 of 48 and 39 of 48,
    against the producer's 35 of 48. (c) The 30-for-30 content match of the
    declared artifact hashes was verified three times at two different HEADs by the
    Validator and independently by the Red Team's probe_gitrecord.py, which
    additionally verified them AT THE DECLARED COMMITS. (d) rdet's zero dispersion
    (OBS-R1) was confirmed by three routes -- the committed results, the
    Validator's own rebuild of all 8 bases at all 10 lattices through slogdet on
    the actual matrix, and the exact closed form.
    (iv) SINGLE-SOURCE, AND NOT COVERED BY THE LABEL. The Red Team's route-
    dependence result (RT-1, six arithmetic routes through probe_nullroute.py) is
    ONE probe in ONE run by ONE reviewer; the Validator did not test routes R2, R4
    or R5 and explicitly declines to have adjudicated them. Its 20000-rep Monte
    Carlo giving P(P-B1 falsifier) = 0.00175 is its own model, disclosed as such.
    Its centered C2 control, its mu amplitude statistic and its recovered N-C
    denominators are each one probe, one run. Sections C1 and C2 rest on ONE
    committed input file, BATCH-cbe023's results_am7.json, whose sha256 the
    Validator verified and whose contents nobody re-measured; if that file is
    wrong, C1 and C2 are wrong with it and neither review would detect it. The
    Validator's re-execution and every probe of both reviews ran on the SAME
    machine and the SAME library versions as the producers, so bitwise agreement
    establishes REPRODUCIBILITY AND NOT PORTABILITY.
    (v) AND THE COUNTERWEIGHT, WHICH THE LABEL DOES NOT SOFTEN. A reproducible
    measurement of a quantity whose verdict was determined by its own design is a
    reproducible measurement and nothing more. Exactly ONE of Section R's seven
    predictions was an open empirical question at the moment of notarization
    (OBS-9); Section C2's P-C2e could not have failed, being an exact symmetry of
    the estimator under test (OBS-12); Section B-prime's P-B1 falsifier had
    probability 0.00175 under the null AM-13 itself mandates, and the second
    conjunct of its PASS clause is a tautology (OBS-11); and Section C1's P-C1a was
    deterministically unable to pass while P-C1c was near-dead on numbers committed
    before the re-score (OBS-13).

  claim_tier: toy
  claim_tier_note: >-
    TOY, UNCONDITIONALLY, at q = 3329, d in {20, 30, 40, 100, 140}, the frozen k
    values, the frozen beta grid, 8 frozen bases per lattice drawn from
    numpy.random.default_rng([1, d, k, i]), 48 HKZ reductions with max
    hkz_violation 0.0, reduction-dependent candidates at d <= 40 ONLY and no
    reduction beyond the frozen HKZ pipeline, N = 2^20 CBD errors and 13
    independent Haar frame stacks in Section B-prime, and one committed 8x4 Delta
    table per target in Sections C1 and C2. NOTHING in this record bears on ML-KEM
    security, on any FIPS 203 parameter set, on any attack cost, or on any cost
    model. No number here transports to beta = 606, d = 1420 or any other parameter
    set by extrapolation, by analogy or by any other route. There is no algorithm,
    no attack and no cost model in this batch, hence NO CRYPTOGRAPHIC BASELINE, and
    `dominated_by` and `sota_delta` are null FOR THAT REASON and not by omission --
    checked against every axis (time, memory, data/queries) by establishing that
    the batch claims none of them. Both reviews state this independently and the
    Validator verified that no artifact contains a cost claim, a bit-security
    figure or a FIPS 203 parameter set.

  certificate_refs: []
  certificate_refs_note: >-
    NONE, and correctly none. certificate.kind is `none` in all four producer
    manifests, which the Validator verified. No solve and no relation is claimed
    anywhere in this batch. The instrument checks it does run -- HKZ-violation
