  validity_verification:
    performed_before_any_interpretation: >-
      Required by my own contract and by this task's completion gate. Run set is
      VALID and COMPLETE; nothing here goes back to a producer.
    expected_run_count: >-
      4 producers, expected_runs 1 each, used_runs 1 each, 4 of 4 accounted for.
      No producer was re-run, no run was discarded, selection_applied is `none` at
      the lead and no producer applied a selection rule.
    schema_complete_manifests: >-
      4 of 4 run_manifest.yaml files PRESENT and schema-complete per the
      Validator's per-producer audit, each declaring its seven artifacts under
      their COMMITTED names as plain scalars with zero committed-but-undeclared and
      zero declared-but-missing files.
    seed_integrity: >-
      Section R records basis_A, haar_T1, permutation_T2 and unimodular_T3 plus a
      seed-integrity statement; Section B-prime records seed_error, seed_haar and
      seed_nullfam with an explicit completion disclosure for seed_nullfam;
      Sections C1 and C2 correctly record a note rather than a seed table because
      they take no draw, and C1 declares its committed input by path AND by sha256
      (f5304b21e9fa8b1d5f3f3d37af6f3d064452dceb70bd0b7263ace65d419f7546, verified).
      The 8 frozen basis indices are carried verbatim from the prior batch's seed
