      CLOSES THE BATCH-cbe023 SECTION C EVIDENCE-INTEGRITY GAP, which is the one
      process obligation this batch discharged outright.
    not_computed_cell_audit: >-
      All 28 NOT COMPUTED cells (8 G-REL1 and 20 G-REL2 entries, lam1n and hkz at
      L1, L2, L4, L5) are GENUINELY STRUCTURAL: d = 100 and d = 140 exceed the
