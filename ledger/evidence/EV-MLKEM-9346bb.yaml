  corrections_applied_before_any_citation:
    source: Validator TASK-20260809-3f1dc4, corrections_required_before_any_of_this_is_cited.
    binding: >-
      ALL SEVEN ARE APPLIED IN THIS RECORD AND IN DEC-20260809-afe29b, and each is
      restated here as a standing citation rule so that a successor reading only
      this record inherits it.
    C-F1: >-
      report_relvar.md section 2's "X_null clears a 0.10 relevance threshold by a
      factor of 6 to 31, in both clauses, at every cell" IS FALSE AS WRITTEN AND IS
      NOT CITABLE. Measured: the minimum over all scored cells is 4.87x at L1/L2
      beta 15; 13 further G-REL2 cells sit at exactly 5.71x and one at 4.97x, so 15
      of the 19 G-REL2 cells fall BELOW the stated lower bound. G-REL1 ranges 12.17x
      to 31.03x and G-REL2 ranges 4.87x to 6.00x. THE CITABLE STATEMENT IS "by a
      factor of 4.9 to 31". No verdict changes: every cell still clears tau_rel =
      0.10 and R-OUT-1 stands.
    C-F2: >-
      In the nine-row hkz table of report_relvar.md section 5(i), use 0.1353 (not
      0.1354) for the L7/L8 beta 10 |X| entry and 0.0070 (not 0.0071) for the
      L11/L12 beta 20 max(|X|,s_X) entry. Immaterial to every verdict; it does
      establish that the report tables were transcribed by hand rather than emitted
      from the results file, which bears on the other tables.
    C-F3: >-
      THREE of Section R's seven predictions are forced by algebra -- P-R2, P-R3 and
      P-R5 -- not four. The report's fourth member is a sub-clause of P-R2 counted
      twice. The error runs in the producer's own disfavour and is corrected anyway.
    C-F4: >-
      "Three predictions of actual empirical content" IS NOT CITABLE. Exactly ONE,
      P-R1, was an open empirical question at the moment of notarization. See OBS-9
      and the AM-13 scope ruling below.
    C-F5: >-
      THE CROSS-PLATFORM FRAMING IS NOT CITABLE, IN report_relvar.md SECTIONS 5(i)
      AND 8 AND IN THE c034ef38 COMMIT MESSAGE. The BATCH-cbe023 Red Team's
      environment is recorded NOWHERE -- the Validator searched that report and all
      six files of its probes directory and found no platform, Python, numpy, host
      or environment block of any kind. What the producer's own run_manifest.yaml
      correctly contrasts against is BATCH-cbe023's SECTION A PRODUCER environment
      (macOS-26.6-arm64, Python 3.13.1, numpy 2.4.0, scipy 1.15.3, fpylll 0.6.4);
      the report and the commit message escalate "the Section A producer's" to "the
      reviewer's", which the record does not support. THE AGREEMENT ITSELF IS REAL,
      VERIFIED TWICE AND IS CITABLE: the Validator matched the committed per-basis
      hkz values at L7/L8 beta 5 to the printed precision at every basis with the
      derived mean gap, both sds and the paired t agreeing to every reported digit,
      and the Red Team compared all committed per-basis values and reports 24 of 24
      pairs agreeing at 6 decimals with max absolute deviation 4.84e-07 -- exactly
      the rounding of the predecessor's printed precision. The Red Team further
      established, AGAINST ITS OWN THESIS, that no function is AST-identical between
      the predecessor's probe, measure_relvar.py and the declared common ancestor
      measure_am4.py (identifier-set Jaccard 0.66 to 0.77), so three textually
      distinct implementations agree on shared seeds. CITE IT AS: a portability
      result across three implementations, with fpylll pinned at 0.6.4 in both runs
      and the reduction input bit-identical across platforms BY CONSTRUCTION (PCG64
      seed sequence into exact int64). It cannot detect an error in the shared
      specification or in fpylll 0.6.4 and is not independent confirmation of
      correctness.
    C-F6: >-
      THE HEADLINE IS REPLICATED AND EXTENDED, NEVER NEW, AND THIS IS THE MOST
      CONSEQUENTIAL OF THE SEVEN. X_null, its exact definition, its scale floor
      s_X = 1.0 and BOTH headline figures the report gives for it -- G-REL1 best
      mean 3.1035 and G-REL2 best mean 0.6000 -- were ALREADY BUILT, MEASURED AND
      COMMITTED by the BATCH-cbe023 Red Team as objection RT-A1, in
      probe_A1_null_observable.py and its committed output, and were quoted verbatim
      in DEC-20260808-05b684 rationale (iii) together with G-NUM 3.33e-14 and G-INV
      4.71e-14. The Validator re-derived both figures in closed form and they are
      digit-identical to RT-A1's. RT-A1 IS CITED NOWHERE IN THIS BATCH; only RT-A2
      is. Moreover "the gate admits an observable that carries no information" was
      already the Coordinator's own recorded reading of BATCH-cbe023. AGAINST the
      producer: the headline is not this batch's discovery and presenting it without
      attribution overstates novelty. FOR the producer: it makes the finding
