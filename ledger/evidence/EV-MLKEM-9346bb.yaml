  inference: >-
    BATCH-9e3584 PRODUCED FOUR ADMISSIBLE RESEARCH RECEIPTS AND NO STATEMENT ABOUT
    A LATTICE, and both of those are real outcomes. The receipts are admissible at
    a depth this goal has not previously reached: the notarization chain holds in
    both directions under git plumbing two independent sessions ran themselves, all
    30 declared hashes match at two HEADs and at the declared commits, roughly ten
    thousand recomputations from raw return zero mismatches, the lead re-executes
    bitwise, nineteen forced values re-derive by paths several of which touch no
    producer code, all 28 NOT COMPUTED cells are genuinely structural, and the
    artifact policy passes for all four producers. THE LEAD OUTCOME R-OUT-1 STANDS:
    the AM-4/AM-8 gate is INADMISSIBLE under G-VAR, no admissibility claim is
    reportable from it in either direction, and that conclusion does not rest on the
    producer's evidence -- two observables the Validator built and the producer never
    saw walk the same gate through the same code, and the sharpest objection to the
    headline was opened and then refuted by measurement. BUT THE HEADLINE IS
    REPLICATED AND EXTENDED FROM BATCH-cbe023 RT-A1, NOT NEW, and the forward
    inference it invites is now bounded: adding G-VAR does not repair the gate,
    because bit identity refuses an arithmetic route rather than an observable, and
    the same closed form evaluated by QR or on an ambient-isometry presentation is
    ADMITTED while reproducing the notarized table at 304 of 304 entries. That is
    the batch's most transportable result and it was produced by review, not by the
    producers. Beside it stand three could-not-fail findings the reviews established
    and the producers did not: exactly ONE of Section R's seven predictions was open
    at notarization; Section B-prime's pre-registered falsifier had probability
    0.00175 under the null its own amendment mandates, its decay conjunct is a
    tautology, and its count SATURATES rather than decays with more data; and Section
    C2's positive control is confined to the exact invariance class of the estimator
    it tests, so SE inflation of the kind AM-14(b) names remains UNTESTED. Against
    that, four things the reviews tried to break and could not, reported at the same
    weight: the guard fires under the pinned floor, the null-family direction
    survives two independently seeded rebuilds, the N-C exclusion mechanism is
    confirmed and moves the instrument toward falsifiability, and the producer's own
    diagnosis of P-C2c is confirmed by the control it correctly declined to run. THE
    COMPOSITIONAL STATEMENT IS THE ONE A SUCCESSOR MUST CARRY: deleting G-VAR leaves
    the gate admitting X_null; adding G-VAR in its present form leaves it admitting
    X_null-by-QR; so the strengthened invariant still does not imply that an admitted
    observable carries lattice information, and the first step that fails is the
    OPERATIONALIZATION of dispersion, not its motivation. C3 IS STILL UNMET AND
    STILL MEETABLE, and the reason has changed for the FIFTH consecutive batch --
    which is itself the finding and is recorded rather than smoothed.

