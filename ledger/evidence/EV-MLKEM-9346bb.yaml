    c2_the_centered_control_the_producer_declined_was_built_and_confirms_it: >-
      report_c2.md section 4 records P-C2c FALSIFIED, diagnoses it as a defect in
      prereg 5.2's own SHOULD-NOT-catch clause rather than in the instrument,
      proposes a centered variant and DECLINES TO RUN IT because it is unregistered.
      THE REFUSAL TO SELF-RESCUE IS CORRECT DISCIPLINE. The Red Team built it,
      recording its expectation in the probe source BEFORE running that the producer
      would be right: on D_centered = D - mean(D) with the frozen ladder, frozen
      alpha_pair and frozen tau_rel at both floors, 0 OF 10 TARGETS FIRE AT
      delta/SE <= 1.0. THE PRODUCER'S DIAGNOSIS IS CONFIRMED -- the single fire at
      delta/SE = 1.0 in the committed run is arithmetic on a target whose committed
      |t| was already 88.5% of its own critical value, not instrument
      over-sensitivity.
    c2_the_control_yields_a_quantity_the_batch_did_not_otherwise_have: >-
      The instrument's own sensitivity ladder in delta/SE units, isolated from each
      target's committed effect. 4 OF 10 TARGETS ARE NOT REACHABLE AT ALL BY A 12-SE
      INJECTION and they are exactly the four degenerate-nu_eff targets above; the
      remaining six first fire between 3 and 12 SE depending on the floor in use.
      report_c2.md section 5 already says the control correctly does not fire there;
      the centered ladder shows this is a property of their CRITICAL VALUES and not
      of their committed effects.
    c1_detection_floor_citation_rule: >-
      Exactly one of the ten targets is NEGATIVE_VARIANCE_COMPONENT under the
      committed se_decomposition -- d100_b40 / graded_t0.0025, nu_eff 21.0 by the
      residual-df fallback -- and it is the target carrying the 3.91% figure. THE
      3.91% FIGURE IS NOT CITABLE WITHOUT THE NEGATIVE-VARIANCE-COMPONENT
      QUALIFIER; the tightest non-degenerate floor is 10.83% relative and the
      family-level bound over targets with a well-defined two-way SE is about 10.8%
      relative. The report handles this correctly in prose; the presentational risk
      is that report_c1.md's table cell carries the bold figure with the qualifier
      only in the paragraph below, which is where a downstream quotation loses it.
  - id: OBS-14
    section: cross-cutting
    status: The compositional statement, and it is the batch's real forward finding.
    statement: >-
      DELETING G-VAR leaves the AM-4/AM-8 gate admitting X_null -- this batch's own
      lead finding and BATCH-cbe023's before it. ADDING G-VAR IN ITS PRESENT FORM
      leaves the gate admitting X_null-by-QR and X_null-by-ambient-isometry. So the
      strengthened invariant still does not imply the target property -- that an
      admitted observable carries information about the lattice -- and THE FIRST
      STEP THAT FAILS IS THE OPERATIONALIZATION OF DISPERSION, not its motivation.
      A criterion that draws its line at exactly zero cannot distinguish "no
      information" from "information at 1e-16", and those are thirteen orders of
      magnitude apart in a quantity the artifact ALREADY RECORDS (float_sd).
    named_repair_offered_as_forward_guidance_not_as_a_result: >-
      Replace bit identity with a SCALED dispersion test -- between-basis sd
      measured against the candidate's own between-CELL range at fixed (d, k) --
      and report the 38-cell profile rather than an all-cells Boolean. On the
      measured numbers that separates cleanly: the escaping routes sit at 1e-13
      against a between-cell range of order 1, while hkz sits at 2.4e-2. SEPARATELY,
      G_VAR_REFUSES as implemented (measure_relvar.py:614-619) is an ALL-CELLS test:
      an observable parameter-determined at 37 of 38 cells and basis-dependent at 1
      is admitted, and nothing in the artifact records how close it came. G-VAR
      reports a Boolean where it holds a 38-cell profile.
  - id: OBS-15
    section: process
    status: Recorded because suppressing it would be worse. Not a mathematical result.
    statement: >-
      The batch's two Coordinator snapshot archives (TASK-20260809-91cf76,
      TASK-20260809-4d928d) are TERMINALLY DEFECTIVE and are superseded by
      DEC-20260809-afe29b. Each receipt rode in a different commit (502d15a0) from
      the artifacts it declares, and nine of the producer snapshot's 28 declared
      artifact names do not exist under those names (D3). BOTH REVIEWS VERIFIED THE
      COORDINATOR'S ACCOUNT OF THIS INDEPENDENTLY AND BOTH REPORT IT CORRECT in
      every particular they could test, including the D3 table at exactly 9 dangling
      and 9 undeclared, one-for-one per task.
    the_refinement_that_matters_for_citation: >-
      D3 IS A COORDINATION-RECORD DEFECT, NOT A PRODUCER DEFECT. Each of the four
      producers' own run_manifest.yaml declares its seven artifacts under their
      COMMITTED names, as plain scalars, with zero committed-but-undeclared and zero
      declared-but-missing files per producer. The dangling names exist only in the
      frozen task cards inside dispatch_queue.json. The producers did not write
      files under names other than the ones they themselves declared; they wrote
      files under names other than the ones THE QUEUE declared for them.
    what_is_intact: >-
      All 30 declared artifacts match their recorded sha256, verified three times at
      two HEADs by the Validator and again at the DECLARED COMMITS by the Red Team's
      probe_gitrecord.py. The notarization chain holds in both directions. THE BYTES
      ARE INTACT AND THE COORDINATION RECORD'S BINDING IS NOT.
    a_factual_correction_the_red_team_offers_against_its_own_task_card: >-
      Its card stated that its predecessor's probes "were lost to exactly this".
      THEY WERE NOT. All six BATCH-cbe023 probe files are present in the HEAD tree,
