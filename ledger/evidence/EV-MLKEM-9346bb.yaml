    raw_summary_agreement: >-
      ZERO mismatches at 1e-12 relative across roughly ten thousand comparisons,
      recomputed by the Validator from the rawest retained quantity in every
      section, plus a bitwise from-scratch re-execution of the lead, plus the Red
      Team's independent reproduction of every G_REL2 aggregate at max deviation
