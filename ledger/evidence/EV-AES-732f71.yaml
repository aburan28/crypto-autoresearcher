evidence:
  id: EV-AES-732f71
  hypothesis_id: null
  hypothesis_id_note: >-
    DELIBERATELY NULL, same documented-null allowance as EV-AES-b2910a
    and predecessors (CORR-20260802-009). This record is Stage 0 of the
    repaired nonlinearity dilution ramp (IDEA-20260901-363851): the
    first measurement of the candidate carrier e = (q0^q1)^(p0^p1)
    under a nonlinear S-box, plus the independent reviews that narrowed
    its interpretation. RQ-AES-003 carries no hypothesis this record
    would attach to.
  experiment_ids: []
  run_ids: []
  task_ids:
    - TASK-20260901-7e0b71
    - TASK-20260901-13dfed
    - TASK-20260901-91adc1
    - TASK-20260901-6efcd8
    - TASK-20260901-4c0410
  type: measurement
  direction: mixed
  direction_note: >-
    MIXED by construction: the preregistered Stage-0 arm fired
    (S0-CARRIER-ALIVE under its own decision rule) and its arithmetic
    was validated with zero discrepancies, but the independent red team
    broke the arm's INTERPRETATION (tautology + proves-too-much), so
    the carrier clause of the sealed verdict remains, in substance,
    named-unmeasured. Both facts are recorded at full strength.
  strength: moderate
  strength_basis: >-
    MODERATE, split across what is and is not established. ESTABLISHED
    (strong for its kind): the instrument work -- Gate 0 reproduced the
    committed L1-AES-R5-P30 receipt FIELD-BY-FIELD at seed 531001
    (14/14 hit indices, all 25 trial-map fields identical, diffs
    exactly the preregistered allowed list), which simultaneously
    proves the per-trial wt(e) logging is non-perturbing at full
    exposure, executes the red team's J5 arm, and validates the
    ramp's instrument; the validator reproduced the exchangeability
    p-value EXACTLY as a rational (6.8027e-59) through three
    independent fresh implementations written blind from the spec,
    recounted the r=6 reference (3 hits, dead band, tripwire not
    fired), recomputed the frozen-family digests (AES S-box rebuilt
    algebraically from FIPS-197), and verified the snapshot 41/41 by
    hash -- zero discrepancies on any number. NOT ESTABLISHED (the
    interpretation): the red team demonstrated that under amask=1 the
    support of d = p0^p1 is pinned to PW word 0 = {0,5,10,15}, so any
    hit vanishing on word 1, 2 or 3 has wt(e) <= 12 DETERMINISTICALLY,
    for ANY round function; 10 of the 14 hits are exactly that class
    (and sit at the top of the forced envelope, Z=4 on 13/14), while
    the 4 active-word hits sit at wt(e) = 16 -- the miss peak -- with
    subclass p_small = 1.0 exactly. The preregistered statistic's
    significance is therefore 100% carried by a theorem of the
    instrument's definitions, and the proves-too-much control FIRES:
    the same raw statistic on the known-dead r=6 arm (3 hits) gives
    p_small = 3.95e-5, 'confirming the carrier' on a dead arm; the
    exchangeability test is correctly calibrated under its own null
    but cannot detect this tautology (its H0 is deterministically
    false by construction here). Strength stays moderate because the
    positive content is an instrument validation plus one
    unadjudicated residual, not a carrier detection.
  claim_tier: toy
  claim_tier_basis: >-
    Reduced-round (r=5, r=6) AES-shaped SPN probe geometry, 64-bit
    halves, trials at 2^30, one seed (531001) for the carrier arm. No
    crypto-scale, medium-scale, affected-scheme or asymptotic claim is
    made or implied, and no comparison to published cryptanalysis is
    made in either direction (RQ-AES-003 R3).
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []

  observations:
    - id: OBS-2F1-1
      statement: >-
        GATE 0 + J5: THE LOGGING-ON INSTRUMENT REPRODUCES THE COMMITTED
        RECEIPT FIELD-BY-FIELD AND THE FIRST wt(e) MEASUREMENT EXISTS.
        The affarm046e worker (per-trial wt(e) logging added to the
        BATCH-fe0bdc affarm046 lineage) reproduced L1-AES-R5-P30 at
        seed 531001, full 2^30: 14/14 hit indices identical (ordered),
        all 25 trial-map fields identical (whist, W_ge1_*, trivial,
        nontrivial, thread_seeds, plaintext_stream_digest,
        sbox_first8), diffs exactly the five preregistered allowed
        fields (labels + timings) -- non-perturbation proven at full
        exposure, and the same run is the red team's J5 carrier arm.
        Carrier readings: 14 hits with byte-weights wt(e) in {11 x3,
        12 x7, 16 x4} (bit weights 40-68) against a miss distribution
        with 93.9% of its mass at wt(e) = 16; the preregistered exact
        one-sided exchangeability test read p_small = 6.8027e-59
        (rational, denominator 1073741810^14, reproduced exactly by
        the validator through three independent implementations).
    - id: OBS-2F1-2
      statement: >-
        r=6 KNOWN-DEAD REFERENCE: 3 hits at full 2^30 (whist
        [1073741821, 3, 0, 0, 0]), inside the carried dead band <= 8;
        the F6 tripwire (>= 9, halt + escalate) did NOT fire.
        Report-only: miss mean wt(e) moves between r=5 and r=6
        (8556380367/536870905 vs 17112759836/1073741821), no decision
        content.
    - id: OBS-2F1-3
      statement: >-
        RED TEAM: THE CARRIER INTERPRETATION IS A TAUTOLOGY AT amask=1
        AND THE PREREGISTERED STATISTIC PROVES TOO MUCH. From the
        instrument definitions (affarm046e.c:353-422): amask=1 pins
        supp(d = p0^p1) to PW word 0 = {0,5,10,15}; W counts vanishing
        PW words of q0^q1; e = (q0^q1)^(p0^p1). Hence any hit
        vanishing on word 1, 2 or 3 has wt(e) <= 12 deterministically,
        for any round function -- 10 of the 14 hits are exactly that
        class, sitting at the TOP of the forced envelope (11-12 of max
        12; Z = 4 on 13/14, no extra cancellations), while the 4
        active-word hits sit at wt(e) = 16 (the miss peak) with
        subclass p_small = 1.0 exactly. PROVES-TOO-MUCH FIRES: the
        same raw statistic on the known-dead r=6 arm (3 hits {16,16,12},
        masks {1,1,2}) gives p_small = 3.9458e-5 <= 0.05 -- it
        'confirms the carrier' on a dead arm, saved from a formal
        reading only by the spec's n >= 5 power floor. The
        exchangeability test is exactly calibrated under its null but
        CANNOT detect the tautology: its H0 is deterministically false
        by construction here, alive or dead. Additional findings: the
        miss distribution itself fits a Poisson(1/16) zero-byte
        geometry (both sides of the test are geometry), and Z=4
        uniformity points AWAY from the accidentally-affine-compatible
        mechanism.
    - id: OBS-2F1-4
      statement: >-
        SCOPE-NARROWED READING (adopts the red team's restatement):
        Gate 0 reproduced the receipt field-by-field (non-perturbation
        proven); the first wt(e) measurement under a nonlinear S-box
        reads hits {11 x3, 12 x7, 16 x4} vs 93.9% miss mass at 16; the
        preregistered arm S0-CARRIER-ALIVE fired MECHANICALLY, but the
        measured separation is 10/14 a theorem of the instrument's
        definitions and 4/14 null; the carrier interpretation is
        NEITHER ESTABLISHED NOR FALSIFIED at t=1 -- the
        correctly-conditioned statistic is unmeasured. One UNADJUDICATED
        RESIDUAL is recorded per rule 8: within the forced envelope,
        3/10 hits sit at wt(e) = 11 where the naive envelope count
        expects ~0.6 -- a 1-byte excess that the tautology does not
        explain, but that no test in this batch adjudicates. The sealed
        verdict's carrier clause (EV-AES-ec53f1 OBS-FE0-4) stays, in
        substance, NAMED-UNMEASURED. The genuine support signature the
        red team names for any future carrier claim: extra zero bytes
        of e BEYOND the forced envelope, decaying jointly with the
        excess along the ramp.
    - id: OBS-2F1-5
      statement: >-
        VALIDATION: the independent validator (fresh session, fresh
        code written blind from the frozen spec, no producer source
        opened, 2/4 runs) confirmed S0-CARRIER-ALIVE under the record's
        decision rule with ZERO discrepancies: p_small reproduced as an
        exact rational through three independent implementations
        (iterative DP, polynomial squaring, multinomial closed form);
        Gate-0 receipt identity verified by reading both receipts;
        source-diff verified logging-only (17 hunks, 65/65 deleted
        lines classified, trial stream/RNG/counters unchanged, logging
        block pure reads after all decisions; one benign note: a
        return statement added to an info mode); r=6 recount 3 hits;
        frozen-family digests recomputed with the AES S-box rebuilt
        algebraically from FIPS-197 (k in {0,1,8,16} match, arm table
        bindings = frozen k=16, R7 rerun = R3); snapshot 162597e93
        verified 41/41 with parent and changed-set checks; chronology
        matches the DEV-3 disclosure exactly. The red team (fresh
        session, blind to the validator, 1/2 runs) returned
        verdict-must-narrow with the tautology derivation and the
        proves-too-much firing above; its 0-run controls (mask-
        conditioned restatement, Poisson fit, Z=4 reading) were
        executed in-report.
  tested_parameters: >-
    Probe: r=5 carrier arm (full AES S-box, k=16, amask=1, smask=1,
    seed 531001, 2^30, 2 threads) and r=6 known-dead reference (same
    geometry, 4 threads). Frozen dilution family S_k digested for k in
    {0,1,2,4,8,12,16} (pinned row-major position order) though Stage 0
    ran only k=16 and the k=0 identity seat. Comparator: carried
    frozen comparator/excess_E convention, unchanged; receipt identity
    against L1-AES-R5-P30.
  actual_scope: >-
    One probe geometry, one seed, toy tier. The positive content is an
    instrument validation (receipt identity + non-perturbation) and
    one unadjudicated 1-byte residual inside a deterministic envelope.
    No carrier claim is established; no ramp point beyond Stage 0 was
    run; nothing here speaks to deployed AES, other geometries, or
    other masks (the tautology itself is amask=1-specific).
  transfer_assumptions: >-
    None beyond the stated scope. In particular: NO transfer of the
    mechanically-fired S0-CARRIER-ALIVE arm to any carrier claim (the
    statistic is definition-dominated at amask=1); NO transfer of the
    r=5/r=6 miss-mean movement (report-only).

  unresolved_confounds:
    - >-
      The correctly-conditioned carrier statistic (mask-conditioned /
      envelope-relative) is UNMEASURED. Cheapest controls (red team):
      mask-conditioned restatement of the already-committed data (0
      runs); seed-531002 J5-2 arm with mask decomposition as
      co-primary (~2 min on campaign hardware).
    - >-
      The 1-byte residual within the forced envelope (3/10 hits at
      wt(e)=11 vs naive ~0.6) is unadjudicated: it may be the first
      genuine carrier signature or an envelope-counting artifact; only
      the conditioned statistic can tell.
    - >-
      Single seed 531001 (comparator-side seed variance 14 vs 19 on
      record, EV-AES-5478a0 OBS-B16-3); the 14 hits are the 14
      committed L1-AES-R5-P30 seats themselves (no fresh sampling at
      this seed).
    - >-
      Stage 1a/1b of the ramp are blocked on the statistic
      redefinition: spent before it, they would measure the same
      tautology.
    - >-
      Boundary falsifiers named by the red team stand against any
      future carrier claim (in the report): no extra zero bytes beyond
      the forced envelope; no joint decay along the ramp; the
      conditioned statistic reading null at t=1; the residual not
      replicating at seed 531002.

