      Wilson-Hilferty cube-root approximation to the chi-square quantile) to
      s_x's main pool (k=487, mu0=479.278), obtaining L/mu0=0.9280,
      U/mu0=1.1105 against the reported [0.92786,1.11049] -- a legitimate
      exact-Poisson CI, not a mislabeled normal-approximation interval."
    - >-
      Positive control: frozen_positive_control_curve.json's 4 primes
      (11987, 12007, 12011, 12037) each appear in
      RUN-ECDLP-e36df2-021..024's own flagged_x_degenerate_m field as
