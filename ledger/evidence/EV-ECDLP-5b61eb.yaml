      flagged the engineered m=2 coincidence on 4/4 primes directly from raw
      artifacts, independent of pooled-summary.json's 'm2_flag_rate: 4/4'
      summary field (which agrees)."
    - >-
      s_rand's 95% CI [0.98172,1.16929] contains 1, confirmed by the same
      blind recomputation above: the chance-level null model and its
      implementation are not broken."
    - >-
      Chi-square periodicity explanation independently spot-checked on a
      THIRD instance beyond design_note.md's own two (p=14821/n=415;
      p=12853/n=12958): curve_idx=2, p=7487, n=413 -- chi-square/dof ratio
      359.92 vs N_i/n (using n_total_after_exclusion=148952) predicted
      360.66, ratio-of-ratios 0.998 (within 0.21%, well inside the ~15%
      tolerance), confirming the diagnostic anomaly is the named periodicity
      artifact and not a computation defect, on data not already spot-checked
      at hypothesis-authoring or design-note time."
    - >-
      specification.yaml's success_criterion outcome (1) SUPPORTED's four
      named conditions (Stage 0 passes; positive control 4/4; s_rand CI
      contains 1; both rho_hat_x/rho_hat_y CIs contain 1 and exclude >=3) all
      hold on direct inspection of raw artifacts, independent of the
      executor's or design_note.md's own classification; no other of the
      four disjoint outcomes (FALSIFIED, SPLIT/INCONCLUSIVE, INSTRUMENT
      INVALIDATION) is text-consistent with the observed numbers."
    - >-
      Sensitivity check (mu0_target=40, curve_idx=1, full independent re-run):
      s_x=1.0043 CI[0.855,1.173], s_y=0.8913 CI[0.751,1.051], s_rand=1.0734
      CI[0.919,1.247] -- all CIs contain 1, none near 3; qualitative verdict
      unchanged under this tail check."
  inference: >-
    The repaired test design -- m=1 tautology removed, cross-prime
    +-1-degeneracy screen, resolution-matched sample size (mu0_target=20,
    power >=0.90 to resolve a 3x effect at alpha=0.01), two independently
    realized non-homomorphic contrast sections, one null-object control, one
    engineered positive control, one sensitivity check -- makes H-ECDLP-6a9479
    claim (3) decidable at toy scale for the first time, and both independent
    coordinate sections read as chance: rho_hat_x and rho_hat_y both have 95%
    exact-Poisson CIs containing 1 and excluding any value >=3, agreeing in
    verdict (not split). Both instrument-validity controls pass: s_rand (the
    method-only null object) reads as chance, and the positive control's
    known, certain m=2 coincidence is caught by the screen on 4/4 of its
    primes, confirming the screen excludes only the named degeneracy class
    and does not silently miss it. This is toy-scale empirical evidence
    consistent with (not a new proof of) KN-TECH-73630e's uniqueness theorem:
    at this repaired resolution, no systematic linearity of the Teichmuller-
    style non-homomorphic contrast is resolvable. It closes
    DEC-20260911-74c9dc's carve-out of claim (3) with a decided verdict,
    where EXP-ECDLP-a26bde's original design could not discriminate "no
    systematic linearity" from "one coincidence" at all.
  boundaries:
    - >-
      Toy tier: 6 curves (the 5 original global curves plus 1 engineered
      positive-control curve), 24 (curve,prime) instances, primes in
      [2^10,2^14), m ladders up to N_i=ceil(20*p_i) (~19-20 binary
      doublings, up to ~3.3x10^5 per instance). No transfer to cryptographic
      scale is claimed or implied.
    - >-
      This record decides H-ECDLP-09125b alone. It does not reopen or modify
      H-ECDLP-6a9479, which remains status: analyzed with claim (3) refine,
      immutable, per that hypothesis's own status_note.
    - >-
      A null/absence-of-systematic-effect result, consistent with but not a
      re-derivation or strengthening of KN-TECH-73630e's uniqueness theorem;
      the theorem is cited and assumed, not proved here.
    - >-
      No attack, no exponent claim anywhere: every tested multiple m is
      generated from a global point whose scalar is known to the generator.
    - >-
      asymptotic_claim is null throughout (per H-ECDLP-09125b); this is a
      statistical repair of one contrast-arm test, not a complexity claim, so
      the four asymptotic-complexity promotion gates (CLAUDE.md) do not apply
      to this record.
  unresolved_confounds:
    - >-
      Single-reviewer (coordinator) review, no mutual blindness, per the
      handoff's disclosed procedure_deviations; mitigated by a genuine
      blind_rederivation of pooled k/mu0/rho_hat performed before consulting
      pooled-summary.json, matching it exactly, and by an independent hand
      check of the CI construction and a third, previously-unchecked
      chi-square/periodicity spot-check, rather than merely re-stating the
      design_note.md's own conclusions.
    - >-
      The Stage 3 falsification-bar wording ambiguity noted in
      design_note.md section 5 (point-estimate>=3 in the procedure text vs.
      CI-lower-bound>=3 in success_criterion/falsification_criterion) is
      recorded but not load-bearing here: both readings agree
      (not_falsified_by_this_bar for both s_x and s_y under both
      interpretations). A future run closer to the 3x boundary would need
      this ambiguity resolved by a protocol amendment before being decidable.
    - >-
      The chi-square diagnostic's periodicity explanation is now checked on
      three (curve,prime) instances (two from design_note.md, one
      independently by this review) out of 24; it is not exhaustively
      verified on all 24, though the mechanism (m*d(s(S)) mod p not sharing
      the short period n) is a general argument, not an empirical pattern-match
      per instance.
  reviewed_by: coordinator
