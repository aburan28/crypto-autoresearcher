  proof_status: derivation
  proof_refs:
    - >-
      experiments/EXP-ECDLP-e36df2/design_note.md (section 4c: the
      periodicity derivation resolving the chi-square-diagnostic anomaly --
      d(s_x(mS)) is exactly periodic in m with period n, not p, because both
      s_x(mS) and t(mS) depend on m only through m mod n, so the chi-square
      test's assumed model (N_i independent draws over p categories) is the
      wrong null; the true independent-sample count tracks N_i/n, verified
      directly on three distinct (curve,prime) instances -- design_note.md's
      own two spot-checks (p=14821/n=415 digit recomputation; p=12853/n=12958
