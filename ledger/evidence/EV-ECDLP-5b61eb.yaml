      (p=7487/n=413, curve_idx=2: chi-square/dof ratio 359.92 vs N_i/n
      predicted 360.66, ratio-of-ratios 0.998, within 0.21%) -- and this
      derivation is why the diagnostic's anomaly does not affect the primary
      rho_hat statistic, which does not share the short period)."
    - >-
      experiments/EXP-ECDLP-e36df2/design_note.md (sections 1-2, 5: the s_y
      and s_rand construction code paths, the cross-prime screen's exact
      definition, and the two recorded protocol deviations -- Stage 0's
      ladder interpretation and the Stage 3 falsification-bar wording
      ambiguity, both non-load-bearing for this outcome since both readings
      agree)."
    - >-
      experiments/EXP-ECDLP-e36df2/analysis.md (this review's own blind
      rederivation of pooled k/mu0/rho_hat for s_x, s_y, s_rand from the 24
      raw-result.json files before consulting pooled-summary.json; its
      independent hand-check of the exact-Poisson/Garwood CI construction via
      the chi-square/gamma-quantile relationship on s_x's main pool, matching
      the reported CI to Wilson-Hilferty-approximation precision; and its
      independent confirmation of both proves_too_much objects directly from
      raw artifacts)."
  observations:
