evidence:
  id: EV-AES-b2910a
  hypothesis_id: null
  hypothesis_id_note: >-
    DELIBERATELY NULL, same documented-null allowance as EV-AES-ec53f1 and
    predecessors (CORR-20260802-009). This record is the hardening battery
    for EV-AES-ec53f1's scope-narrowed CONFIRMED-MISMATCH-ALIVE verdict:
