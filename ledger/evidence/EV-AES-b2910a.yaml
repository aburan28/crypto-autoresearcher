  experiment_ids: []
  run_ids: []
  task_ids:
    - TASK-20260901-74271d
    - TASK-20260901-2f56b3
    - TASK-20260901-b064ff
    - TASK-20260901-f26b32
  type: measurement
  direction: corroborating
  strength: moderate
  strength_basis: >-
    MODERATE, raised in what it covers relative to EV-AES-ec53f1 but not
    to strong. All five preregistered controls met their expectations
    with zero validator discrepancies (112/112 checks, 4/4 validator
    runs, fresh-code re-derivation throughout): J4 (load-bearing) the
    r=6 random-bijection arm read DEAD (2 hits at 2^30 vs frozen
    excess_E = 2^30, band <=8), so the factor-contrast reading
    generalizes from the AES S-box to nonlinearity within the tested
    subclass; J3 the second-seed affine rerun reproduced hits = 2^30,
    T = 0, W = 3 on 100% nontrivial (deterministic law, seed/key
    variance discharged for the affine arm); J2 the keyed bridge held
    500/500 at r = 3 and r = 7 (empirical coverage now r in
    {2,3,5,6,7}); J1 the census extension r = 11..16 stayed flat
    (160/160 instances, guards D_r*M_r = M_r*D_r = I128 all r = 1..16,
    keyed r = 16 cell 500/500, r*_aff still undefined); GUARD the
    identity law held 0/500 on the dead Feistel substitute, converting
    the proves-too-much non-transfer from derivation-only to an
    empirical seal (the law discriminates alive 100% vs dead 0%).
    Strength stays moderate because J4's DEAD reading is
    SUBCLASS-SCOPED (nibble-wise lift of a uniform 16-symbol
    permutation -- a strict subclass of 256-byte bijections; the
    red team's O-3 256-byte recipe was not the implementation, a
    disclosed deviation), the GUARD key match to the committed M1
    receipt is transitive (BATCH-014 outside validator read scope),
    and everything remains one probe geometry at toy tier.
  claim_tier: toy
  claim_tier_basis: >-
    Reduced-round AES-shaped SPN probe geometry, r <= 16 census
    extension, arms at r in {3, 6, 7, 16}, trials at 2^30 for the two
    full arms, one machine. No crypto-scale, medium-scale,
    affected-scheme or asymptotic claim is made or implied, and no
    comparison to published cryptanalysis is made in either direction
    (RQ-AES-003 R3).
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []

  observations:
    - id: OBS-999-1
      statement: >-
        J4 (LOAD-BEARING): THE r=6 RANDOM-BIJECTION ARM READS DEAD.
        With the S-box replaced by a frozen random bijection (drawn
        once at pinned seed 46064002 before the arm, arm seed
        46064001, full 2^30 trials), the instrument read 2 hits (two
        W=1 null-shape events; analytic null E ~ 1.0; excess ratio
        1.9e-9 against the frozen excess_E = 2^30; zhist at Z = 0),
        inside the preregistered DEAD band (<=8). Under the
        preregistered consequence map this seals the factor-contrast
        reading at r=6 beyond the AES table: death tracks nonlinearity
        within the tested subclass. SCOPE: the bijection class tested
        is the nibble-wise lift of a uniform 16-symbol permutation
        (task-card wording, preregistered deviation from the red
        team's 256-byte O-3 recipe) -- a strict subclass of 256-byte
        bijections; this is n=1 additional nonlinear S-box at r=6 and
        the generality statement is subclass-scoped accordingly. The
        independent validator reproduced the frozen table byte-exactly
        by Fisher-Yates redraw at the pinned seed.
    - id: OBS-999-2
      statement: >-
        J3: THE SECOND-SEED AFFINE RERUN REPRODUCES THE DETERMINISTIC
        LAW. At seed 46063002 (key 34230a62... derived by the pinned
        formula) the r=6 affine arm read hits = 2^30, T = 0, W = 3 on
        100% of nontrivial trials, whist [0,0,0,2^30,0] -- matching
        the first-seed reading exactly. The seed/key-variance confound
        (EV-AES-ec53f1 confound 1, comparator-side 14-vs-19) is
        discharged for the affine arm itself at 2^30.
    - id: OBS-999-3
      statement: >-
        J2 + J1: EMPIRICAL LAW COVERAGE WIDENS AND THE r-FREE
        DERIVATION SURVIVES EXTENSION. Keyed bridge cells at r = 3 and
        r = 7 held the identity law + W law on 500/500 each (one
        trivial swap at r=3, in-band for rho = 8, recorded per rule
        8), widening empirical coverage to r in {2,3,5,6,7}. The
        census extension r = 11..16 stayed flat on 160/160 instances
        with guards D_r*M_r = M_r*D_r = I128 at every r = 1..16; the
        keyed r = 16 cell held both laws on 500/500 (canonical rcon
        continuation 6c,d8,ab,4d,9a,2f disclosed); r*_aff remains
        undefined and the window is cipher-touched at r = 16. The
        validator re-derived the full rho table r = 1..16 in fresh
        sparse GF(2) code cell-for-cell, matching both the
        preregistration (r=1..10) and the producer receipt (r=11..16).
    - id: OBS-999-4
      statement: >-
        GUARD: THE PROVES-TOO-MUCH NON-TRANSFER IS NOW EMPIRICALLY
        SEALED. On the dead keyed murmur3-fmix64 Feistel substitute
        (EV-AES-dec938 lineage; key bdf38231... matched to the
        committed M1 receipt transitively), the identity law held on
        0/500 trials -- the PASS direction (the law must fail where
        the D-affine premise does not hold). The C/Python port parity
        was exact on a 512-trial stream and detcheck deterministic.
        Composed with OBS-999-3: the identity law discriminates the
        alive skeleton (100%) from the dead substitute (0%) -- an
        empirical seal of what was derivation-only in EV-AES-ec53f1.
    - id: OBS-999-5
      statement: >-
        VALIDATION: the independent validator (fresh session, fresh
        code, no producer source opened, 4/4 runs) derived ALL-SEALED
        independently from the preregistered consequence map with zero
        numerical discrepancies (112/112 checks): full rho table
        r=1..16 re-derived; FIPS C.1 KAT + r5/r10 anchors + rcon
        continuation reproduced from scratch; all three arm keys
        re-derived via the pinned formula (kst = seed ^ 0xA5A5...,
        post-increment splitmix64, little-endian); independent
        Fisher-Yates redraw at the pinned seed reproduced the frozen
        bijection byte-exactly; fresh single-threaded keyed smokes at
        r = 3/6/7/16 held both laws on 600/600. Scope notes: snapshot
        b4dfdf9c7 binds 40 of 47 receipt-named artifacts (7 gitignored
        .pyc build caches unbound -- bookkeeping, contents verified in
        the working tree); GUARD M1 key match transitive.
  tested_parameters: >-
    Probe: campaign geometry, census extension r = 11..16 over the
    frozen 100-cell set; keyed bridge cells r = 3, 7, 16 (500 trials
    each); two full arms at 2^30 (J4 random-bijection r=6, J3 affine
    r=6 second seed); GUARD arm 500 trials on the keyed
    murmur3-fmix64 Feistel substitute. Comparator: the carried frozen
    comparator/excess_E = 2^30 convention, unchanged.
  actual_scope: >-
    One probe geometry, toy tier. J4's generality statement is scoped
    to the nibble-wise lift of a uniform 16-symbol permutation (n=1
    additional nonlinear S-box at r=6); the 256-byte bijection class
    remains untested. Empirical law coverage r in {2,3,5,6,7,16-keyed};
    census flatness r = 1..16 by derivation conditioned on KAT-anchored
    convention. Nothing here speaks to deployed AES, other geometries,
    or other substitute families beyond the named Feistel guard.
  transfer_assumptions: >-
    None beyond the stated scopes. In particular: NO transfer of the
    J4 DEAD reading to arbitrary 256-byte bijections (subclass only);
    NO transfer of the GUARD seal to substitute families other than
    the keyed murmur3-fmix64 Feistel tested.

  unresolved_confounds:
    - >-
      The 256-byte random-bijection class (the red team's O-3 recipe)
      remains untested; J4 seals only the nibble-wise-lift subclass.
      Cheapest control: one r=6 arm with a 256-byte uniform random
      bijection at 2^30 (~2-4 min), a natural follow-up if the
      generality statement is ever spent beyond the subclass.
    - >-
      Comparator-side seed variance (AES 14 vs 19 hits, EV-AES-5478a0
      OBS-B16-3) is untouched by this battery (the battery sealed the
      affine side, not the comparator side).
    - >-
      The candidate carrier e = (q0^q1)^(p0^p1) remains unmeasured
      under a nonlinear S-box (EV-AES-ec53f1 confound 4; bcb117's
      first ramp point, RANK 2 of DEC-20260901-3150f0 as re-ranked by
      this batch's close).
    - >-
      The seven boundary falsifiers of EV-AES-ec53f1 stand, minus the
      ones this battery discharged: the identity-law-on-substitute
      falsifier is now empirically guarded; the alive-random-bijection
      falsifier is narrowed to the 256-byte class.

