    - >-
      BLIND RE-DERIVATION AGREEMENT. The validator performed the review
      plan's required blind re-derivation of the demo receipt's host_binding
      values from the repaired schema's provenance declarations and the
      host's own identity surfaces, deliberately never opening
      emit_host_binding_v2.sh or emit_procedure_v2.md at all until after the
