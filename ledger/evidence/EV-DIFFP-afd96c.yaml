    - id: O-8
      title: >-
        DEV-1 IS A GENUINE SPECIFICATION ERROR, THE CONTRACT'S OWN KNOWN ANSWER IS UNREACHABLE BY
        ANY IMPLEMENTATION, AND THE DISCLOSURE IS COMPLETE IN KIND AND INCOMPLETE IN WEIGHT.
      measured_by: TASK-20260824-e1062f under R3-J2, defect D-5.
      the_classification_ruled: >-
        DEV-1 IS CORRECTLY CLASSIFIED AS A specification_error, IT IS NOT AN IR-6 IN-RUN REPAIR, AND
        IT IS ALSO A GENUINE DEFECT IN THE CONTRACT -- the two are not alternatives here, because the
        specification error IS the contract defect. Not IR-6: the forced set lives in the module as
        the constant NULL_FORCED_PAIRS with its declaration text, the module's sha256 is pinned
        IDENTICALLY IN ALL FIVE RUN MANIFESTS, and run 1 -- the run that produced the null data in
        the first place -- already pinned the final module, so the exemption demonstrably predates
        the datum it applies to within the charged run set.
      why_the_contract_is_defective: >-
        ITS LITERAL KNOWN ANSWER IS SELF-CONTRADICTORY AND NO IMPLEMENTATION COULD REACH IT.
        CTL-GRAPH-NULL demands NO EDGE for EVERY pair on a population drawn with independent
        coordinates "subject to CTL-WF", while CTL-WF's own W2, W3 and W4 FORCE three of those pairs
        -- each forcing verified from the gate's source. A population satisfying the gate cannot have
        those coordinates independent. A SECOND UNREACHABILITY THE PRODUCER DOES NOT NAME AND THE
        REVIEWER DOES: the contract also mandates per-primitive analysis at H-4, which makes
        `primitive` a constant column on every sub-population BY CONSTRUCTION, and
        in_linearized_code is not an md5 key component at all.
      the_material_fact_the_package_does_not_report: >-
        F1 DOES 15 OF THE 19 EXCUSALS AND F2 DOES 4, AND IF F1 WERE REMOVED THE STOP WOULD FIRE. On
        md5, 11 edges are returned, 1 excused by F2 and 10 by F1; on sha1, 8 edges, 3 by F2 and 5 by
        F1. The producer's DEV-1 reports the literal quantity (md5 11, sha1 8) and the STOP quantity
        (0, 0) and describes both families but never states which family carries the weight. THE
        DISCLOSURE IS COMPLETE IN KIND AND INCOMPLETE IN WEIGHT.
      why_that_does_not_make_the_control_a_sham_and_it_was_checked_rather_than_assumed: >-
        THE 15 F1 EXCUSALS WERE ENUMERATED INDIVIDUALLY. On md5 they are the five (X -> primitive)
        pairs and the five (X -> in_linearized_code) pairs; on sha1 they are the five (X ->
        primitive) pairs. EVERY ONE IS A COLUMN CONSTANT BY THE ANALYSIS'S OWN SCOPING -- `primitive`
        because the graph is computed per primitive as H-4 requires, and the md5 flag because the
        committed serialiser never emits it on md5. NOT ONE F1 EXCUSAL CONCEALS A PAIR THAT COULD
        HAVE BEEN A REAL DEPENDENCY, the STOP quantity is 0 on both primitives, and 41 of 60 pairs
        return NO EDGE. THE CONTROL FIRES.
      the_forced_set_was_enumerated_before_the_run_with_one_honest_qualification: >-
        F2 WAS ENUMERATED; F1 IS A PREDICATE, NOT AN ENUMERATION, AND IT WAS DECLARED BEFORE THE RUN
        BUT NOT QUANTIFIED. NOTHING WAS WIDENED AFTER THE DATA WAS SEEN so far as any artifact can
        show. F2 is four literal pairs in module source, each exactly the pair one named CTL-WF check
        forces, WITH NO SLACK. The residual, recorded: whether an earlier, narrower NULL_FORCED_PAIRS
        was ever run and widened cannot be determined, because an uncharged predecessor leaves no
        artifact; the weak but real evidence against a widening is F2's lack of slack.
      the_edge_detectors_null_object_control_does_fire: >-
        ON NULL POPULATION B THE DETECTOR RETURNS NO EDGE ON 19 OF 30 MD5 PAIRS AND 22 OF 30 SHA1
        PAIRS -- 41 OF 60 -- WHILE ON THE DECLARED POPULATION IT RETURNS NO EDGE ON ONLY 10 OF 30 AND
        14 OF 30. IT DISCRIMINATES BETWEEN THE TWO POPULATIONS, which is exactly what the control has
        to demonstrate, and it does not return NO EDGE for a reason that would hold whatever the
        detector did. Null population A is reported separately and correctly and is NOT relied on for
        that capacity: its md5 sub-population for (message_difference, in_linearized_code) returns
        EDGE, and the module names a TRUER reason than the contract's own -- the flag is None on
        every md5 object because plant_from_pair never sets it and the committed serialiser never
        reads it on md5.
      the_well_formedness_gate_both_sides_fire: >-
        ACCEPT: all 16 census entries and all 80 strict orbit images accepted, 0 failures,
        recomputed independently. REJECT: 8 of 8 deliberately malformed objects rejected -- a SHA-1
        entry with the flag flipped and the dv held fixed, which is null family (e) as
        DEC-20260824-af6d5c P-4 specified it -- with the violated check named (W3). A GATE THAT
        ACCEPTED EVERYTHING WOULD NOT BE A GATE AND THIS ONE DOES NOT.

    - id: O-9
      title: >-
