    in_linearized_code} -- the unique dependency-breaking depth-2 subset the graph names. THAT IS WHY
    THIS ROUND'S ADVERSE FINDING IS ALSO ITS NEXT MEASUREMENT.
    WHAT NONE OF THIS SAYS: nothing about MD5, SHA-1, any published characteristic, any difference
    space, any novelty status, any cost or any attack complexity. NO PATH IS CLAIMED NEW FOR EITHER
    PRIMITIVE AT ANY TIER. A PASSING CONTROL IS NOT AN IMPROVEMENT. An instrument whose profile becomes
    READABLE is a better-understood instrument and is not a result about either primitive. WITH A
    READABLE CENSUS OF ZERO A NON-MEMBER VERDICT CARRIES NO INFORMATION ABOUT THE LITERATURE AT ALL.

