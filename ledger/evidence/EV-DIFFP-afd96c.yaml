      the_scope_fact_that_travels_with_the_integer_0_wherever_it_is_cited: >-
        ALL NINE ADJUDICATED CELLS ARE `NOT DETECTED` FOR BOTH INSTRUMENTS AND THE UNDERLYING TABLE
