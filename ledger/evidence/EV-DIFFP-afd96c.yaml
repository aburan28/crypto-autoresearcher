        WHAT IT DOES NOT TAKE WITH IT: IT DOES NOT INVALIDATE THE DIFFERING-CELL COUNT AND DOES NOT
        CHANGE IT. The diagonal cells are outside the adjudicated set for both instruments and O-E
        agrees with the honest instrument on that cell too, both NOT DETECTED. It invalidates the WORD
