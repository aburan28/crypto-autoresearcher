    - id: O-11
      title: >-
        THE STRUCTURAL CLAIM OFFERED TO GOAL-SHA1-001 IS CONFIRMED IN ITS LONG FORM, IS FALSE AS
        WRITTEN IN ITS SHORT FORM, AND THE SHORT FORM IS THE ONE IN THE FROZEN CONTRACT.
      confirmation: >-
        CONFIRMED FROM THE COMMITTED SOURCE INDEPENDENTLY. primitives.sha1_in_linearized_code(words)
        returns sha1_expand(words[:16], len(words)) == list(words), so on an object whose flag is True
        AND whose flag was computed on the words it serialises, the whole message-difference value is
        the expansion of its own first sixteen words and the message_difference COMPONENT carries at
        most 512 bits. IT IS THE STATEMENT THAT THE SHA-1 MESSAGE EXPANSION IS A GF(2)-LINEAR CODE
        WHOSE CODEWORDS ARE DETERMINED BY THEIR FIRST SIXTEEN WORDS -- A TEXTBOOK PROPERTY OF THE
        EXPANSION, RESTATED ABOUT THIS KEY. IT IS NOT NEW, IT CARRIES NO CRYPTANALYTIC CONTENT, AND
        NONE IS CLAIMED HERE OR ANYWHERE.
      the_refutation_of_the_short_form: >-
        THE SHORT FORM DROPS THE THREE WORDS THAT MAKE IT TRUE. The producer's O_RT2 block says
        "carries at most 512 bits OF MESSAGE DIFFERENCE plus one flag bit rather than the 2560 bits
        its serialised width suggests", which is correct. The restatement in the same file's
        `what_is_NOT_concluded`, AND THE IDENTICAL SENTENCE IN THE FROZEN CONTRACT'S `scale_relevance`,
        both read "a SHA-1 membership key's apparent 2560 bits are at most 512 plus one flag bit",
        WITHOUT "of message difference". 2560 IS THE WIDTH OF ONE COMPONENT, NOT OF THE KEY. The
        strict sha1 key also carries step_delta -- a tuple of `length` 32-bit words, up to 2560 bits
        more, and NOT determined by dv[:16] because it depends on cv, m and mp -- plus primitive,
        length and block_index. THE SHORT SENTENCE ATTRIBUTES ONE COMPONENT'S WIDTH TO THE WHOLE KEY
        AND IS FALSE AS WRITTEN.
      does_it_carry_its_scope_everywhere_it_appears: >-
        NO. The CENSUS scope travels with both forms. THE COMPONENT SCOPE TRAVELS ONLY WITH THE LONG
        FORM, AND THE SHORT FORM IS THE ONE IN THE FROZEN CONTRACT AND IN THE SENTENCE EXPLICITLY
        ADDRESSED TO GOAL-SHA1-001. This is the most consequential defect in the package for a
        DOWNSTREAM CONSUMER, and it is one dropped prepositional phrase.
      a_second_scope_the_package_does_not_state: >-
        The claim's antecedent is "an object whose flag is TRUE", but the flag is only a predicate of
        the SERIALISED message difference on objects where the two coincide. MEASURED COUNTEREXAMPLE:
        the committed plant_from_pair at step range (0,10) yields stored flag True with
        sha1_in_linearized_code(obj.dv) False, and ON THAT OBJECT THE FLAG BEING TRUE IMPLIES NOTHING
        AT ALL ABOUT THE dv. The claim is sound for gate-accepted objects at full step range and is
        FALSE for objects the committed constructor produces at extent below 16.
      the_form_in_which_it_may_be_offered_to_GOAL_SHA1_001_and_no_other: >-
        "THE MESSAGE-DIFFERENCE COMPONENT of a SHA-1 membership key carries at most 512 bits on
        objects that are in the linearized code AND whose flag is the predicate of the serialised
        difference; the rest of the key is unaffected." OFFERED IN THAT FORM OR NOT AT ALL.

    - id: O-12
      title: >-
        NULL FAMILY (e) IS RETIRED IN SUBSTANCE WHILE BEING DESCRIBED AS OPEN, AND THE PRECONDITION
        BUILT FOR IT IS THE THING THAT FORBIDS IT.
      the_measurement: >-
        The contract's open_directions says family (e) "becomes executable by a later batch and is not
        executed here", the precondition being the gate this batch builds. BUT
        wellformedness-gate-result.json USES FAMILY (e) AS THE GATE'S REJECT SIDE -- "a SHA-1 entry
        with in_linearized_code FLIPPED and the dv held fixed" -- at reject_side checked 8, rejected
        8, wrongly_accepted empty. And d_in_linearized_code is reported NOT_CONSTRUCTIBLE at 40 of 40
        rejected on each primitive. AN INDEPENDENT CONSTRUCTION AGREES at 8 of 8 rejected on sha1 and
        0 constructible on md5.
      the_objection_upheld: >-
        FAMILY (e) AS DEC-20260824-af6d5c P-4 SPECIFIES IT -- FLIP THE FLAG, HOLD THE dv FIXED -- IS
        NOW PROVED NOT CONSTRUCTIBLE UNDER CTL-WF, BECAUSE W3 IS EXACTLY ITS NEGATION. Describing it as
        "executable by a later batch" is not a bounded negative with forward guidance; it is an open
        direction whose gate makes it EMPTY. A COUNT OF REJECTED DRAWS IS NOT A STATEMENT ABOUT THE
        PROBLEM.
      the_forward_guidance_that_was_owed_and_missing_and_is_now_recorded: >-
        WHAT REMAINS GENUINELY OPEN IS A DIFFERENT FAMILY: one that perturbs the FLAG AND THE dv
        TOGETHER so that the pair stays MUTUALLY CONSISTENT -- for instance replacing the dv by a
        non-codeword and setting the flag False, which probes whether the instrument separates in-code
        from out-of-code objects at all. THAT FAMILY IS SPECIFIED NOWHERE IN THIS BATCH. It is named
        here as an OBLIGATION AND A CANDIDATE, EXPLICITLY NOT AS EVIDENCE, and it is carried into the
        single next_action.

    - id: O-13
      title: >-
        THE CLOSURE AUDIT'S PASSES, REPORTED AS EXPLICITLY AS ITS FAILURES BECAUSE A CLEAN RESULT IS A
        RESULT.
      the_md5_lane: >-
        NO CLOSURE FOUND. Every committed artifact of this batch in the reviewer's read scope was
        searched for "exhaust", "deprioriti", "screened" and "closed" against the MD5 arm. The
