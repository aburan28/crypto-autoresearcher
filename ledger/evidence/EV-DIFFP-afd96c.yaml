      where_the_phrasing_risk_actually_sits: >-
        NOT IN THE PRODUCER'S PACKAGE, WHERE THE HONEST SENTENCE IS ALREADY WRITTEN, BUT IN
        batch.yaml's OWN OPENING SUMMARY, WHICH SAYS "the fifteen-subset lattice is bought by argument
        rather than by compute" WITH NO QUALIFIER IN THAT SENTENCE. THAT IS THIS COORDINATOR ROLE'S
