      the_ruling_and_it_is_the_boundary_case_so_the_reasoning_is_given_in_full: >-
        NOT AN IR-6 VIOLATION. AGAINST: a change to how a classifying statistic is computed, made
        after seeing an output, moving two of six rows into agreement with a target the producer had
