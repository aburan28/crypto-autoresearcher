        contract's pre-registered P-C of EXACTLY ONE. THE SUBSETS ARE {message_difference,
        in_linearized_code}, breaking on sha1 and the pre-registered one, and {length, step_delta},
        breaking on MD5 because on md5 `length`'s only derived determiner is step_delta and the
        subset deletes both, and NOT breaking on sha1 because message_difference also determines
        length there and the subset retains it.
      the_second_refuted_pre_registration_of_this_contract: >-
        P-C IS REFUTED BY THE MEASUREMENT AND IS REPORTED BY THE PRODUCER RATHER THAN HIDDEN. TWO OF
        THE FROZEN CONTRACT'S OWN PRE-REGISTERED PREDICTIONS ARE REFUTED THIS ROUND -- P-B at O-2 and
        P-C here -- and both are reported by the party they cost. THAT IS THIS BATCH'S STRONGEST
        INTERNAL CREDIT AND IT IS RECORDED AS ONE. Whether the second subset's derivation is sound
        was NOT audited by the Red Team, which did not audit all fifteen, and R3-J3's audit did not
        separately rule on it either; it is recorded as an unaudited derivation rather than as a
        verified one.
      the_sentence_that_must_reach_the_headline_and_does: >-
        THE DEPTH-2 LATTICE'S DEPENDENCY-BREAKING SUBSETS ARE NAMED BY ARGUMENT; THE FOURTEEN
        NON-BREAKING SUBSETS ARE NOT MEASURED, AND THREE OF THEM ARE ALREADY MEASURED TO HIDE A
        KNOWN-FALSE INSTRUMENT. "DOES NOT BREAK A DEPENDENCY" NEVER MEANS "CANNOT HIDE A KNOWN-FALSE
        INSTRUMENT". depth2-classification.json carries that sentence verbatim under
        `what_this_does_not_buy` and names O-C, O-C-prime and O-C-double-prime, unprompted.
      the_sharpening_that_is_better_than_the_caveat: >-
        THE TWO READINGS ARE THE SAME FACT SEEN TWICE, AND THAT IS WHY THE PHRASE IS DANGEROUS. The
        graph's derived edges say `length` and `in_linearized_code` are REDUNDANT. O-C, O-C-prime and
