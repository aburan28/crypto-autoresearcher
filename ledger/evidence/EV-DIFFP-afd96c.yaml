      nothing_is_reported_as_a_fraction_a_pass_a_score_or_a_margin: >-
        H-5 AND IR-10 SATISFIED. Every result JSON was scanned for `percent`, `% of`, `pass rate`,
        `passed the`, `score`, `margin` and fraction-named keys, and every hit is either a DISCLAIMER
        or the word "re-scored". THERE IS NO AFFIRMATIVE FRACTION, PERCENTAGE, PASS, SCORE OR MARGIN
        ANYWHERE. One contract-text TENSION is recorded as a tension and not as a producer defect:
        IR-10 forbids the literal form "N of M cells" while H-5 requires the integer "beside the number
        of cells adjudicated", and the execution report writes "0 differing cells of 9". The producer
        did NOT report a pass -- the per-cell table and the exclusion list are both present -- and the
