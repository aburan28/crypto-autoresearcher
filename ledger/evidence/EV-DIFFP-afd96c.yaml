        THE DETERMINATION: THE SUB-ARM BINDS A PARTITION CLASS AND STILL BINDS NO CELL VERDICT AND NO
        DIFFERING-CELL COUNT. Not one of the nine adjudicated cells, and not one of the independent
        twelve, turns on an isolation result -- the cell rule is membership of a perturbed draw under
