    - id: O-3
      title: >-
        THE PARTITION BREAKS ON THE CORRESPONDENCE BETWEEN THE RULE AS WRITTEN AND THE RULE AS
        IMPLEMENTED, AND ON THE PER-PRIMITIVE SCOPE H-4 REQUIRES EVERY CLASS TO CARRY. BOUNDED.
      measured_by: TASK-20260824-e1062f under R3-J3, defects D-1, D-2, D-3.
      D_2_the_undeclared_clause: >-
        R2 AS THE MODULE'S OWN ASSIGNING_RULE STRING STATES IT READS "a declared family's own
        declaration names the deleted component as EXACTLY what it moves while holding the rest
        fixed". THE IMPLEMENTATION ADDS AN UNDECLARED CLAUSE: derive_partition filters the R2
        candidate list by `and n == "d_message_difference"`, so R2 can fire for ONE component
        and one only, BY NAME.
        THE COUNTERFACTUAL WAS MEASURED RATHER THAN ASSERTED TO MATTER. Under the rule AS
        WRITTEN, two more rows would be ENTAILED: d_step_delta declares it moves exactly
        step_delta and holds every other key component fixed and is CONSTRUCTIBLE at 368 draws
        constructed and 368 accepted by the gate on each primitive, and d_block_index is
        likewise 368 of 368. THE COUNTS WOULD BECOME provably 2 / not_probed 1 / probed 0 /
        entailed 3 / contingent 0, AND THE AGREEMENT WOULD FALL FROM 5 OF 6 TO 3 OF 6.
        THE DIRECTION IS WHY THIS IS MAJOR: THE UNDECLARED CLAUSE IS LOAD-BEARING AND IT MOVES
        THE RESULT TOWARD THE PRE-REGISTERED TARGET.
        THE STRONGEST DEFENCE OF THE CODE, STATED AS FORCEFULLY AS THE REVIEWER STATED IT AND
        ADOPTED BY THIS CLOSE: CTL-PART scopes the partition to the DECLARED PERTURBATION of
        each declared null family read from the committed contract EXP-DIFFP-4b165f, and
        d_step_delta and d_block_index are NEW families of THIS contract, built for stage 3,
        which did not exist when BATCH-efcae7 produced the verdicts being re-partitioned.
        Classifying step_delta as ENTAILED by a family invented in the very contract that is
        re-reading the earlier verdicts would be anachronistic and would make the partition
        partly self-fulfilling.
        THE BREAK, STATED EXACTLY: THE ROW CLASSES ARE DEFENSIBLE AND THE RULE TEXT IS FALSE OF
        THE FUNCTION THAT EMITS IT. A reader given only partition-derived.json's own account of
        how each row was assigned cannot reproduce two of the six rows. That is an H-7 violation
        and the fix is one clause of text.
      D_1_the_primitive_blind_probing_profile: >-
        THE sha1 BRANCH OF THE `step_delta` ROW IS ASSIGNED CONTINGENT_ON_THE_INSTRUMENT BY THE
        ISOLATION TEST, AND EVERY ONE OF THE FIVE EXAMPLES IT CARRIES IS AN MD5 DRAW MATCHED
        AGAINST AN MD5 CENSUS ENTRY -- NULL-MD5-9983c910 against PLANT-MD5-05, NULL-MD5-1dc9644d
        against PLANT-MD5-06, NULL-MD5-8ee15c5c against PLANT-MD5-05, NULL-MD5-12dbedf2 against
        PLANT-MD5-06 and NULL-MD5-12c43f2e against PLANT-MD5-02. There is not one SHA-1 object in
        the SHA-1 branch's evidence and the two branches' example lists are BYTE-IDENTICAL.
        THE MECHANISM IS STRUCTURAL AND NOT A DATA ACCIDENT: probing_profile() is computed ONCE
        over the draws of BOTH primitives against the entries of BOTH primitives, and
        derive_partition() then indexes it as probing[comp] INSIDE the per-primitive loop, so
        both branches receive the identical primitive-blind profile.
        THE HONEST ANSWER WAS RECOMPUTED RATHER THAN INFERRED. Restricted to sha1 draws against
        sha1 entries with the same committed attribution function, `step_delta` has
        isolating_draw_count 0 AND own_source_differing_count 0; restricted to md5 it has 6 and
        32. SO THE HONEST sha1 BRANCH FIRES R5 NOT_PROBED_BY_A_DECLARED_FAMILY, NOT R3
        CONTINGENT_ON_THE_INSTRUMENT.
        WHAT IT CHANGES AND WHAT IT DOES NOT: it changes the emitted `primitive_scope` field and
        nothing else. The emission is {md5: CONTINGENT, sha1: CONTINGENT}; the correct emission
        is {md5: CONTINGENT, sha1: NOT_PROBED}. The ROW class is unchanged because the
        combination rule takes the strongest per-primitive class and md5's R3 is strongest either
        way. It is an H-4 violation and an H-7 violation and it is the precise shape of defect
        CORR-20260824-c1c8b1 already recorded once against this goal.
        THE ROWS WHERE IT COULD HAVE MATTERED MORE WERE CHECKED AND IT DOES NOT: for
        `message_difference` the restricted profile is 2568 on md5 and 520 on sha1, both nonzero,
        so R2 fires on both anyway; for `primitive`, `length`, `block_index` and
        `in_linearized_code` the restricted isolating counts are 0 on both primitives, matching
        the unrestricted profile. THE DEFECT BITES ON EXACTLY ONE BRANCH OF ONE ROW.
      D_3_the_undeclared_truncation: >-
        The step_delta row prints isolating_draw_count 6 beside an isolating_examples list of 5,
        ON BOTH PRIMITIVE BRANCHES, and nothing in partition-derived.json declares the
        truncation -- zero occurrences of `truncat`, `first 5`, `at most 5` or `capped`. The cap
        is real, being `if len(...) < 5` in probing_profile, but it exists only in source and not
        in the artifact a reader reads. Minor and mechanical; one declared field closes it.
      the_narrowest_valid_conclusion_stated_before_the_detail_can_be_over_read: >-
        THE SIX ROW CLASSES, THE CLASS COUNTS 2/2/0/1/1, THE AGREEMENT OF 5 OF 6 ROWS AND THE
        IDENTITY OF THE DISAGREEING ROW ARE UNCHANGED BY EVERY DEFECT ABOVE, AND ALL OF THEM WERE
        DERIVED INDEPENDENTLY BY HAND BEFORE THE PRODUCER'S FILE WAS OPENED. THIS IS NOT A STOP
        and it is not evidence about MD5, SHA-1 or any difference space in either direction.

    - id: O-4
      title: >-
        THE WORD `PROVABLY` SURVIVES AS A NARROWED THEOREM ABOUT THE SERIALISATION FORMAT AND
        THIS BATCH'S OWN GATE, AND DOES NOT SURVIVE AS A STATEMENT ABOUT THE MEMBERSHIP KEY.
      measured_by: TASK-20260824-7d9f92 under R3-J5, objections RT-J5-1 through RT-J5-6.
      what_is_proved_and_is_worth_having: >-
        THE COMMITTED STRICT SERIALISATION UNDER THE VERIFIED GENERATOR SET {E1, E3, E4, E5}
        EMITS COMPONENTS THAT ARE REDUNDANT GIVEN OTHER EMITTED COMPONENTS, SO DELETING THEM IS
        THE IDENTITY MAP ON THE KEY OVER THE POPULATION THIS BATCH'S OWN WELL-FORMEDNESS GATE
        ADMITS. Specifically `length` is len(step_delta) on both primitives; `in_linearized_code`
        is sha1_in_linearized_code(message_difference) on sha1 objects the gate admits; and on
        md5 `in_linearized_code` is not emitted at all.
      what_is_NOT_proved: >-
        IT IS NOT A THEOREM ABOUT MD5, ABOUT SHA-1, OR ABOUT THE INSTRUMENT'S DETECTION POWER
        AGAINST FAMILIES IN GENERAL, and the quantifier BY ANY FAMILY ranges only over families
        EVERY DRAW OF WHICH PASSES CTL-WF -- a restriction that DID NOT EXIST when BATCH-efcae7
        measured the rows being re-partitioned.
      RT_J5_1_the_gate_that_makes_the_edge_true_is_the_edge: >-
        MAJOR. CTL-WF check W3 reads, verbatim, "sha1: obj.in_linearized_code ==
        primitives.sha1_in_linearized_code(list(obj.dv))". Edge E4 says the flag is a function of
        the serialised message difference. W3 says an object is admissible only if its flag
        EQUALS that function of its serialised message difference. THOSE ARE THE SAME SENTENCE.
        Every family whose draws the gate admits therefore satisfies the edge BY ADMISSION, so
        "undetectable by any family" is "undetectable by any family whose draws already satisfy
        the edge". THE STEP AT WHICH THE ARGUMENT SURVIVES IS THE GATE, AND THE GATE IS A NEW
        ARTIFACT OF THIS BATCH.
        MEASURED COUNTEREXAMPLE, BUILT FROM COMMITTED CODE: the COMMITTED
        pathobj.plant_from_pair applied to the SAME seeded pair that produces census entry
        PLANT-SHA1-00, at step range (0, 10), yields stored in_linearized_code True while
        primitives.sha1_in_linearized_code(list(obj.dv)) returns False, at dv_words 11. W3
        REJECTS AN OBJECT THE COMMITTED CONSTRUCTOR PRODUCED. At (0,79), (0,15), (8,40) and
        (16,79) the two agree, so the disagreement is at SHORT extents rather than at every
        non-full range.
        WHY IT IS NOT PEDANTRY: BATCH-efcae7's depth-1 rows were measured WITHOUT this gate, over
        families never required to pass it, so a class derived under the gate is being attached
        to a verdict measured without it. THAT IS A POPULATION SUBSTITUTION and it must be stated
        in the class, not in a limitations block.
      RT_J5_4_one_class_name_two_different_arguments: >-
        MAJOR, AND CONFIRMED FROM THE PRODUCER'S OWN COMMITTED ARTIFACT RATHER THAN FROM A
        CONSTRUCTION. partition-derived.json's in_linearized_code row, md5 branch, carries class
        PROVABLY_UNDETECTABLE_BY_ANY_FAMILY, rule_fired R1, and `forcing_edges: []`, with the
        `because` text stating that the component is not a component of the md5 membership key at
        all. But R1 as the producer declares it is "some component the row RETAINS determines the
        deleted one by an edge that carries a DERIVATION from committed source", and on md5 there
        is no such component and no such edge. R1 FIRES WITH A NULL ANTECEDENT ON A DIFFERENT
        ARGUMENT: the ablation is the identity because the field is ABSENT.
        BOTH ARGUMENTS YIELD UNDETECTABILITY AND THEY ARE NOT THE SAME CLAIM. "This component is
        recoverable from what the key retains" is a redundancy statement about the key. "This
        component was never in the key" is a statement that the row is empty. The combination rule
        then requires PROVABLY_UNDETECTABLE to hold ON EVERY PRIMITIVE, so the row's class is
        carried half by a vacuous branch. A CLOSE THAT QUOTES "1 PROVABLY UNDETECTABLE" WITHOUT
        THE SPLIT IS QUOTING ONE NUMBER OVER TWO DIFFERENT THEOREMS, AND THIS RECORD DOES NOT.
      RT_J5_5_the_second_provably_row_is_a_property_of_a_python_tuple: >-
        MODERATE, AND THE EDGE IS SOUND AND THE ROW'S CLASS IS EARNED. What it proves is that the
        serialiser emits a field already implied by the ARITY of another field. TWO OF THE SIX
        ROWS ARE NOW PROVABLY_UNDETECTABLE AND THE THREE GROUNDS ARE: A TUPLE CARRIES ITS OWN
        LENGTH; A FIELD IS ABSENT ON MD5; AND A REDUNDANT RECOMPUTED PREDICATE IS A FUNCTION OF
        ITS OWN ARGUMENT. A record that reports "the graph proved two of six depth-1 rows
        undetectable by any family" without those three grounds beside it is reporting a stronger
        sentence than the derivations support.
      RT_J5_2_and_RT_J5_3_and_RT_J5_6_the_three_supporting_narrowings: >-
        RT-J5-2, MODERATE: the empirical witness for the flag edge is taken where Y is CONSTANT
        and it is provably impossible for it to be otherwise on a planted census. Measured: the
        eight SHA-1 census entries take EXACTLY ONE distinct value of in_linearized_code, True.
        Derived: sha1_expand is GF(2)-linear and plant_from_pair sets full_dv[i] = w[i] XOR wp[i]
        where w and wp are expansions, so full_dv = sha1_expand(m XOR mp) is ALWAYS a codeword and
        the flag is ALWAYS True. NO PLANTED SHA-1 OBJECT CAN EVER HAVE FLAG FALSE, AND NO SEED
        CHOICE CAN FIX IT. No artifact may cite that witness as corroboration of the edge.
        RT-J5-3, MODERATE: FIVE committed generator actions carry the flag rather than recomputing
        it, not two, and the producer's own disclosure names two. Measured on a source object with
        one bit of dv[40] flipped and the flag honestly recomputed to False: act_E1_shift(+1)
        carried False while the image's recomputed flag is True -- DISAGREE; align_E1 of that
        image the same, AND THE IMAGE'S dv DIFFERS FROM THE SOURCE'S; act_E2_rotate(7),
        act_E3_negate and act_E6_reindex(3) agree. THE ONE THAT MATTERS IS align_E1, WHICH IS
        CALLED INSIDE THE COMMITTED adjudicator.canonical() AND controlpower.variant_keys() FOR
        EVERY SHA1 OBJECT WITH step_start > 0. The derivation's coverage of generator images is
        therefore true of THIS CENSUS -- where every dv is a codeword and the code is closed under
        all five actions -- and is not true of the class. THE HONEST WORDS FOR THE GENERATOR-IMAGE
        PART OF THE POPULATION ARE "VERIFIED ON THESE OBJECTS", NOT "PROVABLY".
        RT-J5-6, MINOR: the flag predicate is a CONSTANT FUNCTION at short step ranges. Measured
        over 100 uniformly random word lists per length, sha1_in_linearized_code returns True 0
        times of 100 at length 15, 100 of 100 at length 16, and 0 of 100 at length 17. So on any
        step range of extent 16 the predicate is the constant True and carries zero bits about the
        message difference, and below 16 it is the constant False and CONTRADICTS the stored flag
        of any genuine in-code object. The producer's "at full step range" scope limit is
        NECESSARY BUT IS NOT THE WHOLE LIMIT.
      what_the_validator_independently_confirmed_about_the_two_declared_scope_limits: >-
        BOTH ARE REAL, MEASURED SEPARATELY AND BLIND TO THE ABOVE. (a) The flag is computed by
        plant_from_pair from the FULL 80-word expansion while the serialised value is the
        step-range slice and the two coincide only at FULL step range, which is where every
        planted entry sits -- confirmed, the sha1 population having exactly one length, 80. (b)
        act_E1_shift and act_E2_rotate carry the flag rather than recomputing it, so the
        derivation covers their images only because W3 is MEASURED on them -- confirmed for E1,
        whose 64 images are in the population, while E2 is not in the STRICT generator set so
        naming it is over-cautious rather than wrong. FOR THOSE 64 OBJECTS THE CLAIM IS MEASURED,
        NOT DERIVED, AND THE PRODUCER SAYS SO.

    - id: O-5
      title: >-
        THE OFF-DIAGONAL MATRIX AS A TABLE, WITH ITS DIFFERING-CELL COUNT BESIDE THE CELLS
        ADJUDICATED, ITS FULL EXCLUDED-CELL LIST WITH REASONS, AND THE NULL-OBJECT CONTROL
        OUTCOMES THAT GIVE THE COUNT ITS CAPACITY TO BE LARGE.
      the_denominator_first_because_that_is_the_order_it_was_checked_in: >-
        THE FULL MATRIX IS SIX FAMILIES BY SIX ROWS = 36 AGGREGATE CELLS. 9 ADJUDICATED + 27
        EXCLUDED = 36, RECONCILED. EXCLUSIONS BY REASON: diagonal 3, forced_by_the_graph 6,
        not_constructible 18. TASK-20260824-e1062f reconstructed the cell selection independently
        from its own edge records and its own forced_rows and got adjudicated 9, excluded 27, with
        the IDENTICAL per-reason split. The 9 adjudicated cells are the three constructible
        families d_message_difference, d_step_delta and d_block_index crossed with the three rows
        each that are neither their own diagonal nor graph-forced.
      the_18_not_constructible_cells_the_largest_class: >-
        VERIFIED TRUE ON EVERY DRAW OF EVERY PRIMITIVE: d_length 40 constructed / 40 rejected / 0
        accepted on md5 and on sha1; d_primitive 40/40/0 on both; d_in_linearized_code 40/40/0 on
        both, all recomputed from the committed gate.
        AND THE REASON IS A THEOREM AND NOT A SAMPLING ACCIDENT, WHICH IS WHY IT WAS DERIVED
        RATHER THAN COUNTED: d_length shortens step_range to (a, b-1) while holding step_delta and
        the message difference fixed, so len(step_delta) != length and W4 must fail, and on sha1
        len(dv) != length so W2 must fail too -- and those are precisely the two derived edges E1
        and E3. d_primitive relabels md5 as sha1 and back, so the object has delta_m where dv is
        required, failing W2, and a flag inconsistent with a dv, failing W3. d_in_linearized_code
        flips the flag with the dv held fixed, which is W3's negation by construction. THE
        FAMILIES ARE NOT UNLUCKY; THEIR DECLARATIONS ARE UNSATISFIABLE GIVEN THE GRAPH. No cell
        returns to the adjudicated set and the denominator does not move.
        THE INDEPENDENT SECOND OPINION: TASK-20260824-7d9f92's own CTL-WF-equivalent gate,
        constructed without ever reading the producer's module, agreed on ALL SIX constructibility
        verdicts -- which is evidence that NOT CONSTRUCTIBLE is a property of the DECLARATION
        rather than of one implementation, and is NOT proof that no other honest construction of
        those families exists, as that reviewer states itself.
