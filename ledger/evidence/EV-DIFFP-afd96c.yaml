  observations:

    - id: O-1
      title: >-
        THE DEPENDENCY GRAPH, AS A TABLE, WITH EVERY EDGE'S DERIVATION STATUS AND EVERY
        `empirical_only` LABEL.
      read_from: >-
        tasks/TASK-20260824-68ba87/dependency-graph-result.json, read by TASK-20260824-aed5ca
        directly from the JSON, and re-measured edge by edge against committed source by
        TASK-20260824-e1062f under R3-J2.
      the_table_of_derivation_carrying_edges: >-
        FOUR ORDERED PAIRS CARRY BOTH A WRITTEN DERIVATION FROM COMMITTED SOURCE AND AN
        EMPIRICAL WITNESS, AND EACH IS GIVEN WITH ITS PRIMITIVE SCOPE AND ITS WITNESS'S
        CAPACITY TO FAIL.
        E1. md5 (step_delta -> length), derived_and_witnessed. Derivation:
        pathobj.PathObject.length is not a stored field but the PROPERTY step_range[1] -
        step_range[0] + 1, and plant_from_pair builds exactly one modular difference per step
        of the closed range; adjudicator.serialize emits step_delta as the FULL TUPLE under
        STRICT, so len(step_delta) is recoverable from the ABLATED key. RULED SOUND, measured
        at len(step_delta) == length on all 5832 objects of the declared population across
        both primitives with ZERO exceptions. WITNESS CAPACITY: THE WITNESS CANNOT FAIL --
        distinct_Y is 1, `length` being the constant 64 on the whole md5 population.
        E2. sha1 (step_delta -> length), derived_and_witnessed. Same derivation, RULED SOUND,
        measured on 3208 sha1 objects with zero exceptions. WITNESS CAPACITY: CANNOT FAIL --
        distinct_Y is 1, `length` being the constant 80 on the whole sha1 population.
        E3. sha1 (message_difference -> length), derived_and_witnessed. Derivation:
        plant_from_pair sets dv = full_dv[a:b+1] over the closed range; act_E1_shift sets dv =
        full[a+s : b+s+1] with step_range = (a+s, b+s), preserving both sides; act_E3_negate
        leaves dv untouched; perturb_message_difference XORs in place and perturb_by_codeword
        XORs an 80-word codeword element-wise, neither changing the word count. RULED SOUND,
        measured at len(dv) == length on all 3208 sha1 objects with zero exceptions. The
        derivation states in terms that it does NOT hold on md5, where delta_m is always 16
        words whatever the length, and the graph is consistent with that: no such md5 edge is
        labelled derived. WITNESS CAPACITY: CANNOT FAIL -- distinct_Y is 1.
        E4. sha1 (message_difference -> in_linearized_code), derived_and_witnessed. Derivation:
        primitives.sha1_in_linearized_code(words) returns sha1_expand(words[:16], len(words))
        == list(words), a pure function of the word list; perturb_message_difference and
        perturb_by_codeword RECOMPUTE the flag after modifying the dv, and act_E1_shift does
        NOT -- it carries the flag over. RULED SOUND, measured at obj.in_linearized_code ==
        sha1_in_linearized_code(list(obj.dv)) on all 3208 sha1 objects with ZERO exceptions,
        including all 64 E1-shift images. WITNESS CAPACITY: THIS IS THE ONLY EDGE OF THE GRAPH
        WHOSE WITNESS COULD HAVE FAILED AND IT DID NOT -- distinct_Y is 2, at 608 flag-true
        and 2600 flag-false objects over 3177 distinct X-groups, all constant.
      the_constructor_enumeration_which_is_the_load_bearing_check: >-
        AN OMITTED CONSTRUCTOR IS THE CHEAPEST WAY FOR A DERIVATION TO BE TRUE OF ITS OWN
        EXAMPLES AND FALSE OF THE POPULATION, SO IT WAS ENUMERATED RATHER THAN ASSUMED. Under
        the strict generator set frozenset(E1, E3, E4, E5) the object-level constructors that
        can reach the declared population are EXACTLY FIVE: pathobj.plant_from_pair (the 16
        census entries), equivalence.act_E3_negate, equivalence.act_E1_shift (sha1 only, 8
        shifts), controlpower.perturb_message_difference and controlpower.perturb_by_codeword.
        Established by reading adjudicator.orbit_images, which emits images for E3, E6, E1 and
        E2 ONLY -- E4 and E5 produce NO object-level image at all, acting on the SERIALISATION,
        and E2 and E6 are not in STRICT so their images never enter the population. THE FOUR
        DERIVATIONS NAME ALL FIVE OF THOSE CONSTRUCTORS AND OMIT NONE. The population
        provenance corroborates the enumeration arithmetically: md5 has 8 census + 8 orbit
        images, sha1 has 8 census + 72 orbit images.
      the_empirical_only_labels_as_a_table: >-
        22 EDGES ARE LABELLED `empirical_only`, 14 ON MD5 AND 8 ON SHA1. All 22 are EDGE
        verdicts with no derivation in the module's DERIVATIONS table, and all 22 carry the
        label. H-1's forbidden-word check is CONFIRMED CLEAN: the strings `theorem`,
