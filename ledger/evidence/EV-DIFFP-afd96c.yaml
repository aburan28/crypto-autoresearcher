        are NOT used for it anywhere in this batch. There is no affirmative use anywhere.
      no_partition_class_rests_on_an_empirical_only_edge: >-
        CONFIRMED BY ENUMERATION rather than by assertion. Every forcing edge every partition
        class cites was extracted and looked up in the graph; there are exactly four, they are
        E1 through E4 above, and all four are `derived_and_witnessed`. NOT ONE IS
        empirical_only.
      the_finding_that_governs_how_this_table_may_be_read: >-
        ALL 22 EMPIRICAL_ONLY EDGES ARE CONSTANT-COLUMN ARTIFACTS AND SO ARE THREE OF THE FOUR
        DERIVED ONES. Y_CONSTANT_ON_POPULATION measured TRUE on 22 of 22 empirical_only edges
        with ZERO exceptions, every one having Y in {length, block_index, in_linearized_code},
        each taking a single value on its whole sub-population; nine md5 and six sha1 of them
        additionally carry LOW_DISTINCT_X. SINGLETON_GROUPS_ONLY is FALSE on every pair of both
        primitives, so the all-singletons degeneracy does not occur here at all.
        THE ARITHMETIC THAT MAKES THIS A FINDING RATHER THAN A FOOTNOTE: the graph reports 20
        EDGE verdicts on md5 and 16 on sha1, and OF THOSE 36, EXACTLY ONE -- E4 -- IS AN EDGE
        WHOSE WITNESS HAD THE CAPACITY TO FAIL. A summary sentence of the form "the graph
        contains N edges" is off by a factor of more than thirty in what it suggests, and no
        record of this goal may write one.
        WHY THIS DOES NOT DAMAGE THE FOUR DERIVED EDGES: H-1 requires a derivation AND a
        witness, and for the three vacuous ones the DERIVATION is doing all the work and is
        sound -- `length = len(step_delta)` is a definitional identity of the committed
        PathObject and does not need a witness to be true. THE HONEST STATEMENT IS THAT H-1's
        CONJUNCTION IS SATISFIED IN NAME FOR THREE OF THE FOUR DERIVED EDGES AND IN SUBSTANCE
        FOR ONE. A third label is owed and is named in the decision's corrections_owed.

    - id: O-2
      title: >-
        THE PARTITION, AS A TABLE, WITH EVERY ROW'S BASIS, THE DERIVED CLASS BESIDE THE
        COMPARED ONE, AND EVERY DISAGREEMENT NAMED ON BOTH SIDES.
      read_from: >-
        tasks/TASK-20260824-68ba87/partition-derived.json and partition-compared.json, read by
        TASK-20260824-aed5ca from the JSON; the assigning rule re-applied by hand to every row
        on every primitive by TASK-20260824-e1062f BEFORE it opened the producer's directory.
      the_six_rows_with_their_bases: >-
        ROW `primitive`: derived NOT_PROBED_BY_A_DECLARED_FAMILY by rule R5. BASIS -- no
        declared family isolates it, restricted isolating count 0 on both primitives.
        Pre-registered NOT_PROBED. AGREE.
        ROW `length`: derived PROVABLY_UNDETECTABLE_BY_ANY_FAMILY by rule R1 on BOTH
        primitives. BASIS on md5 -- forcing edge E1, so deleting `length` leaves step_delta
        whose serialised tuple has length equal to it by the PathObject property, and the
        ablated key separates exactly what the unablated key separates. BASIS on sha1 --
        OVERDETERMINED, two forcing edges E2 and E3, either alone sufficing. Pre-registered
        NOT_PROBED_BY_A_DECLARED_FAMILY. THIS IS THE ONE DISAGREEING ROW.
        ROW `message_difference`: derived ENTAILED_BY_THE_PERTURBING_FAMILYS_OWN_DECLARATION by
        rule R2. BASIS -- d_message_difference declares it moves exactly that component;
        restricted isolating counts 2568 on md5 and 520 on sha1, both nonzero, so R2 fires on
