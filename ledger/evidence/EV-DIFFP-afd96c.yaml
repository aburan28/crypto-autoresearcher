        ON THE IDENTITY OF THE DISAGREEING ROW AND ITS FORCING EDGES.
        WHAT THAT CORROBORATION IS WORTH, STATED BY ITS OWN AUTHOR AND ADOPTED HERE: it is
        corroboration that the rule AS WRITTEN, APPLIED BY A SECOND READER, reaches the
        producer's row classes, and it is NOT INDEPENDENT OF THE PRODUCER'S RULE TEXT. The
        reviewer reproduced the IMPLEMENTED behaviour BECAUSE IT READ THE CODE and not only the
