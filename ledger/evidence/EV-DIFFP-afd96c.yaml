    - id: O-6
      title: >-
        THE DIFFERING-CELL COUNT IS A DIAGNOSTIC AND NEVER A DECISION VARIABLE, AND THE EXCLUSION
        RULE THAT PRODUCES IT CANNOT SEE THE INSTRUMENT UNDER TEST. THIS IS THE ROUND'S PRINCIPAL
        ADVERSE FINDING.
      measured_by: TASK-20260824-7d9f92 under R3-J8 and R3-J6, objections RT-J8-1, RT-J8-2, RT-J8-3, RT-J8-4.
      the_whole_answer_in_one_sentence: >-
        THE DIFFERING-CELL COUNT CANNOT DISTINGUISH THE HONEST INSTRUMENT FROM AN INSTRUMENT THAT
        RETURNS NON-MEMBER FOR EVERY OBJECT -- BOTH GIVE 0 OF 9 -- AND IT GIVES THE SAME 0 FOR O-E.
      the_two_counts_side_by_side_from_the_producers_own_artifact: >-
        Over the same 9 adjudicated cells: honest versus honest 0; honest versus O-E 0; honest
        versus always_non_member 0; honest versus always_member 9. From the independent
        re-implementation over 24 adjudicated per-primitive cells: 0, 0, 0 and 24.
        THE OBJECT THAT SETTLES IT: always_non_member fails the planted-positive control OUTRIGHT
        at 0 hits of 96 attempts, against 96 of 96 for the honest instrument and 96 of 96 for
        always_member. So an instrument that identifies NOTHING WHATSOEVER produces the same
        differing-cell count as the honest one.
      RT_J8_1_the_instrument_independent_forcing_rule: >-
        MAJOR, AND IT IS THIS ROUND'S O-P7 -- an object outside everything the review plan named.
        The forced_by_the_graph exclusion's own reason reads that "a component RETAINED by the row
        determines Y, so the row's projection is injective wherever the unablated key is". The
        retained determiner is message_difference and the determined component is the flag. O-E IS
        THE PROJECTION THAT DROPS message_difference ON SHA-1. Under O-E the row does not retain the
        determiner, the injectivity argument has no antecedent, and the cell is NOT FORCED. THE
        EXCLUSION IS A PROPERTY OF THE HONEST KEY AND IS APPLIED AS THOUGH IT WERE A PROPERTY OF THE
        CELL.
        MEASURED, BY A RUN-TIME PROJECTION WRAPPER OVER THE COMMITTED VARIANT LIST WITH NO COMMITTED
        FILE TOUCHED: cell (d_message_difference, row deleting in_linearized_code, sha1) is HONEST
        NOT DETECTED and O-E DETECTED. Every other forced cell agrees between the two instruments.
        Adding the six forced cells back moves the count from 0 of 24 to 1 OF 30 PER-PRIMITIVE
        CELLS, AND IT IS THE ONLY DIFFERING CELL ANYWHERE IN THE 72-CELL PER-PRIMITIVE MATRIX --
        diagonal, forced and adjudicated together.
        WHAT IT DOES AND DOES NOT MEAN, ADOPTED VERBATIM IN SUBSTANCE FROM ITS AUTHOR: IT DOES NOT
        MEAN THE REPORTED 0 IS WRONG -- under the exclusion rule as declared, 0 is the correct
        integer and it was reproduced independently. IT MEANS THE ADJUDICATED SET WAS CHOSEN BY A
        RULE THAT CANNOT SEE THE INSTRUMENT UNDER TEST, and that on this family set the rule happens
        to delete the single cell that would have separated them. WHETHER THAT IS COINCIDENCE OR
        STRUCTURE IS NOT SOMETHING ONE MEASUREMENT CAN DECIDE, AND NO INTENT IS CLAIMED OR IMPLIED.
        THE STRUCTURAL POINT IS INDEPENDENT OF INTENT: AN EXCLUSION RULE THAT IS
        INSTRUMENT-INDEPENDENT CANNOT BE USED TO BOUND AN INSTRUMENT-DEPENDENT QUANTITY.
      the_same_fact_explains_the_round_2_break_and_that_is_the_deepest_thing_this_round_found: >-
        Committed j8_results.json records O-E at d_sha1_k_ge_1_member 0 even though O-E is BLIND to
        the sha1 message difference -- because the family-(d) sha1 draw ALSO flips the recomputed
        flag, which the retained flag component then separates. THE ONLY DELETION THAT EXPOSES O-E
        IS THE PAIR {message_difference, in_linearized_code}, WHICH IS THE UNIQUE
        DEPENDENCY-BREAKING DEPTH-2 SUBSET THE GRAPH NAMES. THE INSTRUMENT'S BLIND SPOT AND THE
        GRAPH'S ONE INTERESTING EDGE ARE THE SAME OBJECT.
      RT_J8_2_which_capacity_was_demonstrated: >-
        MAJOR. Over the 9 adjudicated cells the honest instrument reports NOT DETECTED 9 of 9 and
        DETECTED 0 of 9; over the independent 24, 24 of 24 NOT DETECTED. THE ADJUDICATED SET IS A
        CONSTANT. always_member attains 9 of 9 BY CONSTRUCTION, returning MEMBER for every object
        and so flipping every NOT DETECTED cell whatever the families are. THAT DEMONSTRATES THE
        COUNTING CODE CAN EMIT A LARGE NUMBER AND DEMONSTRATES NOTHING ABOUT WHETHER ANY REAL
        INSTRUMENT COULD BE TOLD APART BY THESE CELLS BUILT FROM THESE FAMILIES. The batch opening's
        licence -- "so the count has a demonstrated capacity to be large" -- IS TRUE OF THE CODE AND
        FALSE OF THE EXPERIMENT.
        THE CREDIT THAT BELONGS BESIDE IT AND IS RECORDED RATHER THAN OMITTED: THE PRODUCER MAKES
        EXACTLY THIS ARGUMENT ITSELF, UNPROMPTED, ABOUT THE OTHER ARM, in a field named
        `the_always_non_member_arm_is_vacuous_here_and_that_is_said_plainly`. The objection is that
        the SAME sentence is owed to the always_member arm in the other direction and there it is
        not made.
      the_independent_convergence_of_the_two_reviews_on_this_point: >-
        TASK-20260824-e1062f REACHED THE SAME ONE-DIRECTIONALITY BY A DIFFERENT ROUTE AND RECORDED
        IT AS D-10: the always_non_member arm's predicted extreme is 0 ONLY BECAUSE the honest
        instrument reports DETECTED on ZERO of the nine adjudicated cells, so the arm is
        ARITHMETICALLY PINNED AND CANNOT FAIL. H-6's literal condition is met and the run correctly
        did not stop, and H-6's TWO-SIDED CAPACITY IS DEMONSTRATED IN ONE DIRECTION ONLY.
        THE NAMED REPLACEMENT, BUDGETED: an adjudicated cell set containing at least one cell the
        honest instrument reports as DETECTED. Concretely -- admit the three DIAGONAL cells, whose
        honest value is DETECTED by the very theorem used to exclude them, into a SEPARATE
        capacity-only arm kept OUT of the differing-cell denominator, and run always_non_member
        against them. It costs three cells of compute and turns a pinned 0 into a falsifiable 3.
      RT_J8_3_is_it_being_used_as_a_decision_variable: >-
        MODERATE. NOT BY THE PRODUCER, WHICH COMPOSES NO VERDICT UNDER H-11 AND IR-8 AND WRITES
        `how_that_integer_must_be_read` -- "Zero does not mean the instrument is good and nonzero
        would not mean it is bad" -- WHICH IS CORRECT AND IS A CREDIT. THE RISK IS ENTIRELY AT THE
        CLOSE, AND EXP-DIFFP-04082e's `the_two_pre_distinguishable_outcomes` ALREADY FRAMES IT AS AN
        INTEGER-VALUED TWO-OUTCOME DISCRIMINATOR, WHICH IS A DECISION THE INTEGER IS NOT ENTITLED TO
        MAKE. WHAT THE QUANTITY ACTUALLY IS: an INDICATOR, not a count. On this cell set it takes the
        value 0 for every instrument that does not flip a cell to DETECTED, and the only way to flip
        one is to drop a component the row retains AND have the family move only that component --
        which on this family set happens at exactly one cell, and that cell is excluded. SO THE
        QUANTITY IS A ONE-BIT FUNCTION OF A NINE-CELL CONSTANT SET, AND THE BIT IS 0.
        WHAT SHOULD REPLACE IT: the per-cell table and the per-instrument verdict vector, which the
        producer already reports, with the aggregate dropped as a headline; if an aggregate is
        wanted, the honest one is the number of adjudicated cells on which ANY declared instrument
        differs from ANY other, which is 0 of 9 here and would have told a reader immediately that
        the cell set has no variance.

