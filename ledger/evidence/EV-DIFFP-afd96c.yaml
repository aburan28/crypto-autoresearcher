        ROW `step_delta`: derived CONTINGENT_ON_THE_INSTRUMENT by rule R3. BASIS --
        isolating_draw_count 6, and those six are the six draws CORR-20260824-c1c8b1 records.
        Pre-registered CONTINGENT. AGREE ON THE ROW CLASS AND THE ROW'S PER-PRIMITIVE SCOPE IS
        MEASURED WRONG -- see O-3.
        ROW `block_index`: derived NOT_PROBED_BY_A_DECLARED_FAMILY by rule R5. BASIS --
        restricted isolating count 0 on both primitives. Pre-registered NOT_PROBED. AGREE.
        ROW `in_linearized_code`: derived PROVABLY_UNDETECTABLE_BY_ANY_FAMILY by rule R1. BASIS
        ON SHA1 -- forcing edge E4. BASIS ON MD5 -- NOT AN EDGE AT ALL, and the artifact says
        so by emitting `forcing_edges: []` with the ground that the component IS NOT IN THE MD5
        MEMBERSHIP KEY, the committed serialiser's flag clause being gated on obj.primitive ==
        "sha1", so deleting it is the identity on every md5 key. Pre-registered PROVABLY
        UNDETECTABLE. AGREE ON THE NAME AND THE TWO PRIMITIVES CARRY DIFFERENT ARGUMENTS -- see
        O-4.
      the_class_counts_stated_as_a_partition_and_never_as_a_fraction: >-
        DERIVED: provably_undetectable 2, not_probed 2, probed_and_genuinely_not_detected 0,
        entailed_by_construction 1, contingent_on_the_instrument 1. PRE-REGISTERED: 1, 3, 0, 1,
        1. Both sum to the six depth-1 rows. Rows agreeing: 5 of 6. THE ONE DISAGREEING ROW IS
        `length`.
      the_pre_registration_this_refutes_and_it_is_the_contract_s_and_not_only_a_prior_s: >-
        EXP-DIFFP-04082e's OWN COMMITTED, FROZEN, PUBLICLY READABLE PRE-REGISTERED PREDICTION
        P-B IS REFUTED BY THE MEASUREMENT, AND THE PRODUCER REPORTS THE DISAGREEMENT RATHER
        THAN SOFTENING IT. That is a better fact than any sealed prior's, because both
        reviewers could see it independently.
      how_the_word_DISAGREEMENT_MAY_BE_READ_ON_THIS_ROW_AND_IT_IS_NARROWER_THAN_IT_LOOKS: >-
        THE TWO CLASSES ARE NOT THE SAME KIND OF STATEMENT AND ARE NOT CONTRADICTORY.
        NOT_PROBED_BY_A_DECLARED_FAMILY is a COVERAGE statement about a finite declared family
        set. PROVABLY_UNDETECTABLE_BY_ANY_FAMILY quantifies over EVERY POSSIBLE FAMILY and is
        strictly stronger, so if `length` is undetectable by any family then a fortiori no
        declared family detected it: THE DERIVED CLASS REFINES THE PRE-REGISTERED CLASS ON THIS
        ROW RATHER THAN CONTRADICTING IT. A close that read "1 of 6 rows disagree" as "either
        the graph or BATCH-efcae7's reading is wrong" would be over-reading its own artifact,
        and THIS CLOSE DOES NOT READ IT THAT WAY. On this row the question of which side is
        wrong does not arise.
      the_order_claim_and_its_limit: >-
        RULED ADEQUATELY LIMITED, IN H-2's REQUIRED FORM VERBATIM -- ORDER_DECLARATION states
        "NO TOOL HERE CAN CHECK READ ORDER, SO THIS IS CORROBORATION AND NOT PROOF" -- and it
        volunteers the disclosure that WEAKENS it: the frozen contract itself prints the
        pre-registered target with its per-row assignment, so the producer could not have been
        blind to the TARGET, only to the VERDICT COLUMN. THE DISTINCTION IS RULED REAL BUT
        THINNER THAN IT SOUNDS, and on this record the thin version is still enough: the module
        hard-codes PRE_REGISTERED_PARTITION as a literal dict of the six target classes, so the
        producer had the answer key in its own source, and blindness to the verdict column buys
        only blindness to what BATCH-efcae7's raw entries would have added beyond the target.
        It is nonetheless REAL, because the target is a CLASS ASSIGNMENT and not a derivation:
        knowing that `length` should come out NOT_PROBED tells you nothing about which edges the
        graph will contain.
      contamination_ruling: >-
        NO CONTAMINATION AND THE STOP DOES NOT FIRE. derive_partition() takes (components,
        edges_by_prim, families, probing, key_components_by_prim) and references neither
        PRE_REGISTERED_PARTITION nor read_batch_efcae7_column(); in run_partition() the write of
        partition-derived.json textually and causally precedes the read of the compared column.
        partition-derived.json contains NO occurrence of `c5bb72`, NO occurrence of `b16b01`, NO
        occurrence of the target string and NO pre-registered class value, and its 15
        occurrences of `efcae7` and 11 of `DETECTED` are all accounted for.
        partition-compared.json records partition_derived_sha256_at_comparison_time and it was
        recomputed and equals the sha256 of the derived file as archived, which binds the
        comparison to exactly that derived content and rules out a derived file rewritten after
        the comparison. THAT IS NOT PROOF OF READ ORDER AND IS NOT PRESENTED AS SUCH.
      the_good_faith_test_and_its_measured_answer: >-
        THE ARTIFACT CARRIES A FIELD LITERALLY NAMED observations_not_used_by_the_assigning_rule
        WITH TWO ENTRIES POINTING IN OPPOSITE DIRECTIONS. Observation 1 -- that the committed
        serialiser appends the flag if and only if the primitive is sha1, so on any key retaining
        the flag the primitive is recoverable from the key's COMPONENT-NAME SET alone -- would
        have moved the `primitive` row to PROVABLY_UNDETECTABLE, AWAY from the target, and was
        RECORDED AND DECLINED on the stated and correct ground that it is a statement about the
        key's SHAPE and not an ordered-pair dependency between component VALUES, which is the
        only object CTL-DEP's formalism decides. Observation 2 -- that `length` is determined by
        `step_delta` on both primitives and additionally by `message_difference` on sha1 -- IS
        used, is the sole cause of the one disagreement, and CUTS AGAINST the target.
        THE MEASURED ANSWER: one unused observation whose use would have cut against the target,
        recorded and declined on a principled ground; one used observation that cuts against the
        target and was taken; and NO observation used to move the result TOWARD the target. What
        DOES move the result toward the target is not an observation at all but the two
        UNDECLARED mechanisms at O-3 and O-7, and they are reported as such rather than as
        evidence of intent, WHICH THIS RECORD DOES NOT ASSERT AND CANNOT MEASURE.
      independent_hand_derivation_before_reading: >-
        TASK-20260824-e1062f applied the assigning rule ITSELF, by hand, on paper, to each of
        the six rows on each primitive, from the frozen contract and the committed module, and
        committed the written record to its scratch file at 2026-08-26T01:43:09Z BEFORE the
        first read of the producer's directory. IT AGREED ON ALL SIX ROWS, ON BOTH PER-PRIMITIVE
