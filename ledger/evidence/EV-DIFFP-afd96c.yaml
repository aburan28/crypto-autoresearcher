      J13: >-
        ANSWERED. VERDICT BREAKS, ON A MEASURED COUNTEREXAMPLE, IN TWO SEPARABLE PARTS.
        PART 1, RELOCATION: EXCLUDING THE DIAGONAL DOES NOT ANSWER J13; IT MOVES IT INTO THE
        not_constructible COLUMN. Of the 36 family-by-row cells, 18 -- EXACTLY HALF -- are excluded
        because three of the six declared families cannot be honoured at all under CTL-WF, a further 3
        as diagonal and 6 as forced. NINE CELLS REMAIN. The off-diagonal remainder is therefore
        measuring WHICH OFF-DIAGONAL FAMILIES COULD BE CONSTRUCTED AT ALL far more than it is
        measuring the instrument: THE CONSTRUCTIBILITY TEST DECIDES HALF THE MATRIX BEFORE ANY
        ADJUDICATION RUNS.
        PART 2, THE THEOREM IT RELOCATES ONTO IS FALSE ON SHA-1 FOR THE ONE FAMILY THE CONTRACT
        REUSES. The diagonal cell is excluded with its value stated as a theorem -- "a family
        perturbing exactly the set S while holding every other key component fixed makes the row
        deleting S DETECTED BY CONSTRUCTION". MEASURED: for d_message_difference against the row
        deleting message_difference, md5 DETECTED and SHA1 NOT DETECTED. WHY IT FAILS THERE: its
        HYPOTHESIS IS FALSE. controlpower.perturb_message_difference HONESTLY RECOMPUTES
        in_linearized_code from the perturbed dv and the committed PERTURBATION_DECLARATION says so in
        the field `recomputed_because_derived_from_the_perturbed_component`; a random bit flip takes
        the dv out of the linearized code, so on sha1 the draw moves TWO key components. It does not
        perturb "exactly the set {message_difference}". The row deleting message_difference retains
        the flag, the flag differs, the draw is a NON-MEMBER, and the cell is NOT DETECTED.
        THE NARROWEST REPAIR THAT SAVES THE THEOREM, AND THE THEOREM IS SOUND WHEN CORRECTLY
        INSTANTIATED: for this family on sha1, S = {message_difference, in_linearized_code}, so the
        theorem applies to the DEPTH-2 row deleting that pair -- which is BATCH-efcae7's declared
        multi-deletion row 5 and the unique dependency-breaking depth-2 subset the graph names.
        INSTANTIATE S FROM THE FAMILY'S ACTUAL MOVED-COMPONENT SET PER PRIMITIVE RATHER THAN FROM ITS
        NAME, and report the sha1 diagonal cell as MEASURED NOT DETECTED rather than as an excluded
        theorem.
        THE PER-PRIMITIVE SPLIT EXISTS AND IS STATED AS THE MIXED THING IT IS RATHER THAN ROUNDED TO
        EITHER END: on md5 the diagonal theorem HOLDS for all three constructible families, measured
        DETECTED in all three; on sha1 it HOLDS for d_step_delta and d_block_index and FAILS for
