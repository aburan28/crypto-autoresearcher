    KEY FORMAT'S OWN REDUNDANCY. Every load-bearing integer reproduces in two further implementations
    and the two theorem-like claims this batch bought reduce, on measurement, to three grounds: a tuple
    carries its own length; a field is absent on md5; and a redundant recomputed predicate is a
    function of its own argument -- the third holding only over a population a gate of this batch's own
    construction admits BY ASSERTING THAT VERY PREDICATE.
    AND THE OFF-DIAGONAL PROFILE CARRIES NO INFORMATION ABOUT THE INSTRUMENT AT THE SCOPE MEASURED, FOR
    A REASON SHARPER THAN "THE MATRICES AGREED": the differing-cell count of 0 over 9 adjudicated cells
    is the same 0 an instrument that returns NON-MEMBER FOR EVERY OBJECT produces, that instrument
    failing the planted-positive control outright at 0 hits of 96 against the honest instrument's 96 of
    96; the always_member arm's 9 of 9 demonstrates the COUNTING RULE's capacity and not the FAMILY
    SET's; three of the six declared families are not constructible at all, removing 18 of 36 cells
    before any adjudication runs; and THE SINGLE CELL IN THE ENTIRE 72-CELL PER-PRIMITIVE MATRIX ON
    WHICH THE HONEST INSTRUMENT AND A KNOWN-FALSE ONE DIFFER IS THE ONE THE GRAPH'S
    INSTRUMENT-INDEPENDENT EXCLUSION RULE REMOVES.
    THE ONE SENTENCE THAT IS WORTH MORE THAN ALL THE INTEGERS: THE INSTRUMENT'S BLIND SPOT AND THE
    GRAPH'S ONE INTERESTING EDGE ARE THE SAME OBJECT. O-E survives the strengthened suite because the
    family-(d) sha1 draw also flips the recomputed flag, which the retained flag component then
