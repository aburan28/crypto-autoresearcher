  inference: >-
    H-SEMBIN-97ea23 is SUPPORTED, moderate, in scope, on its pre-registered test: none
    of its five falsification conditions fired, the gate that could have voided it
    passed at four implementations, and every numeric prediction the contract stated
    was met exactly (O-1, O-3, O-6, O-8, O-10). The support is narrower than the
    hypothesis's prose. Claim C1 -- that charging the vOW baseline at its own T x Mem
    minimum moves the memory-charged crossover by +85 in n and 29.0 bits and lands both
    coherent crossovers above 409 -- is supported under all four storage readings and
    is the finding of this record. Claim C2 is supported only in the one reading of its
    wording the contract fixed (sparse reading, parent metric set, persistent
    crossover) and is false in every other combination the wording admits (O-4, O-5);
    its headline that the indeterminacy is "NOT a property of the storage reading" is
    contradicted by the fact that which parameter is larger is decided by the storage
    reading's size (O-5). Claim C3 is supported under the hard budget semantics by
    0.33 bits and false under the soft, penalty semantics (O-6, O-7). The proves-too-much
    control passed at the untuned point (O-14), so the machinery is trusted to the
    extent a closed form can be. The most consequential observation is not a
    prediction at all: the dense accounting on which the parent's n = 409 verdict and
    the whole "indeterminacy" rest is below the only 33 measurements that exist under
    both readings of the MB column, while both sparse accountings upper-bound them
    under reading B (O-9); no reading is picked, and the gap between them is 20 bits
    at n = 409. COST-SEMBIN-e9960c is the surface of which COST-SEMBIN-8d123b's
    crossover table is one slice, reproduced inside it to 4.8e-5 bits. Nothing here is
    a statement about the security of any curve, in either direction.

