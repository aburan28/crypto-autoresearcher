  claim_tier_note: >-
    The contract declares claim_tier `crypto` because every formula is evaluated
    DIRECTLY at n in [3, 700] including the FIPS binary labels, with no extrapolation.
    That is a property of the arithmetic, not of any measurement: nothing is
    instantiated on any curve, no discrete logarithm is solved, and the only measured
    data anywhere in this family (Semaev's Tables 1-2, 33 MAGMA rows at N ~ 30-60) is
    compared against the model in C10 and does NOT transfer. The tier therefore says
    "the derivation is stated at cryptographic parameters", never "something was
    measured there". Under docs/claims-and-verification.md the record asserts nothing
    above a derivation.
