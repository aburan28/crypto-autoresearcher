        fit; Semaev infeasible where every m exceeds the budget; at p = 0 the
        baseline's time 204.33 is budget-independent) is exactly Semaev's cheapest
        memory over m: sparse 65.33 at m = 8 (relation store 62.27 (+) working set
        65.15), dense 80.07 at m = 6 (79.27 (+) 78.86), rows x cols 64.64 at m = 8,
        nnz+index 55.83 at m = 10. Band dense vs sparse 65.33-80.07, width 14.74,
        sparse turns first: re-derived blind to < 1e-3 bits. C3 as worded (dense_row_echelon
        vs semaev_sparse, hard budget, below 2^65) HOLDS with 0.33 bits to spare.
        rows_times_cols_dense vs dense_row_echelon disagrees at 64.64 < 65 -- not a
        pair C3 names, but the complement to "0.33 bits to spare". The plan's
        "62.31 bits at m = 4 (sparse)" was arm-f's n = 163 DENSE value, corrected. At
        m <= 7 the RELATION STORE (k >= 59) dominates sparse memory entirely; without
        it the cheapest sparse memory would be 59.15 at m = 2, so the band's lower
        edge is a relation-store fact as much as a working-set fact (O-2).
    - id: O-7
      text: >-
        THE SOFT BAND IS THE PRODUCT METRIC'S n = 409 MARGIN RE-EXPRESSED AS A BUDGET,
        AND THE SOFT SEMANTICS IS A PENALTY, NOT A BOUND (M4). fixed_budget_soft[B] is
        cost = T x max(1, Mem/B): the baseline is shrunk to fit (penalty 0), Semaev may
        exceed and pays the exceedance RATIO multiplicatively. At p = 0 the soft flip
        is B* = Mem_vOW(record) - margin_product(409, metric-reoptimised m) = 40.26 -
        (-7.69) = 47.95 (dense) and 40.26 - 11.67 = 28.59 (sparse); the run's
        28.5897 / 47.9533 reproduce. At B = 2^28.59 bits (~50 MB) the sparse "winner"
        uses 2^66.5 bits. C3's own wording -- "any cost model that fixes a physical
        memory budget RATHER THAN charging memory multiplicatively" -- arguably excludes
        this semantics, which above B charges memory multiplicatively. Under it the
        two readings disagree at every budget in 2^28.6-2^47.9, inside physically
        realisable budgets: C3 is FALSE under the soft semantics and TRUE under the
        hard. The band is a legitimate row of the surface and a caveat, not a second
        budget semantics on equal footing.
