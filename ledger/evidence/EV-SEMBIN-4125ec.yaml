    - id: O-1
      text: >-
        THE ARITHMETIC IS WHAT THE ARTIFACTS SAY, AND IT RE-DERIVES BLIND (M1). From the
        statements of HEUR-VOW-CURVE (T = W(1/M + 1/w), Mem = 3n max(w, M), W = 0.886 x
