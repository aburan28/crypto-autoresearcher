        the invariance T x Mem = 6nW along the ray w = M to 1e-6 bits. 24 surface cells
        across every axis recompute to <= 4.9e-5 bits (the records' printing precision).
        The 1,556,684 collision pairs recount exactly. The validator RE-EXECUTED
        run_all.py: all ten arm/surface/controls JSON files are byte-identical to the
        committed run; only resources.json (timings) differs.
    - id: O-2
      text: >-
        THE EXACT RELATION-STORE CONVENTION IS LOAD-BEARING FOR REPRODUCTION (M1,
        unexpected). The producer's implementation.md and the attestable
        own_rederivation.py state 2^{ceil(n/m)} rows of (m k + 2n) bits, log2-summed
        with the working set. The validator's non-blind rederive_pre_code.py also
        tried no store, 2^k bits and the approximate 3n x 2^k total; the approximation
        happened to reproduce the parent's sparse cells to <= 4e-5 bits (the others
        miss n = 571 by 4.5e-4), but it is not the family convention and equals the
        exact width only when m divides n. It moves no crossover, but the exact
        relation-store term sets the lower edge of the ARM F band (O-6).
    - id: O-3
      text: >-
        C1 -- THE COHERENT BASELINE MOVES THE CROSSOVER BY +85 IN n AND -29.0 BITS UNDER
        EVERY STORAGE READING (M1, ARM B). record_point_M1_w30 -> own_curve_product_minimum:
        dense 435 -> 520, sparse 375 -> 460, rows x cols 376 -> 462, nnz+index 344 ->
        429; shift in bits at 409 is exactly -29.0 = -(30 - 1) in all four readings
        because the record point pays 2^30 of memory for a one-bit time saving over
        w = M = 1. Both coherent crossovers exceed 409. The vOW product excess is 29.0 at
        163 / 233 / 283 / 409 / 571. The sect113r2-calibrated ratio gives 486 (dense) /
        424 (sparse) with margin -25.49 / -5.18 at 409. Predicted values met exactly.
    - id: O-4
      text: >-
        C2 -- THE STORE-VERSUS-METRIC RANGE IS TRUE FOR (SPARSE, PARENT METRIC SET) AND
        FALSE FOR EVERY OTHER COMBINATION THE WORDING ADMITS (M2). Ranges of the
        PERSISTENT crossover at (p = 0, kappa = 1, h = 1, record point, unceiled k,
        stage1_argmin): over the parent's declared store grid {30, 40, 48, 60} under
        time_memory_product -- dense 93 (435, 406, 382, 342), sparse 96 (375, 344, 319,
        279), rows x cols 96, nnz+index 96; over the PARENT's metric set {time_only,
        product} at store 30 -- dense 132, sparse 72, rows x cols 73, nnz+index 41; over
        THIS contract's full 28-metric set -- dense 162, sparse 103, rows x cols 105,
        nnz+index 390 (10 nulls). So sparse: 96 > 72 (true) but 96 < 103 (false);
        dense: 93 < 132 and 93 < 162 (false under both). The hypothesis says "the
        sparse crossover ranges more widely ... than over the whole metric set" and
        names NEITHER metric set; the contract's falsification wording ("for the sparse
        reading") is satisfied against the parent set only.
    - id: O-5
      text: >-
        THE CROSSOVER DEFINITION FLIPS C2 EVERYWHERE, BY 300 VERSUS 0, FOR AN ARTEFACT
        REASON (M2, prior OVERTURNED). Under FIRST crossing the store range is 0 and the
        metric range is 300 for every reading: with store >= 30 the record-point
        baseline pays 2^30 x 3n bits at every n, so at n = 3..9 Semaev's product cost is
        below it and the first crossing is n = 3 for every store value -- the low-n
        artefact the contract's C8 exists to label. The Coordinator expected the
        definition to move ranges by < 10 and flip nothing. It flips every ordering.
        The persistent and parent-window (250-650) definitions, which carry the run's
        figures, differ by at most 3 in n (dense store 48: 379 vs 382) and flip nothing.
        Further (M2, unexpected): the dense ordering is reversed not because its store
        range is small (93 vs 96) but because the dense working set is so large that
        the product metric alone moves the crossover 132 in n from time_only -- so
        "which parameter is larger" is decided by the SIZE of the storage reading, i.e.
        by C10's data (O-9), not by the store.
    - id: O-6
      text: >-
        C3 -- THE HARD-BUDGET BAND IS 65.33-80.07 BITS AT n = 409 AND C3 HOLDS BY 0.33
        BITS; THE THIRD READING THE RUN CARRIES CROSSES 2^65 FROM THE OTHER SIDE BY 0.36
