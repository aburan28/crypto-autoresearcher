      observed: "exact match, independently reconfirmed by both reviewers via fresh code"
      result: pass
    - metric: dual_path_control_100_real_arm_cells
      forced: "route1/route2 agreement <1e-9 relative"
      observed: >-
        confirmed exactly by both reviewers via full deterministic
        re-execution; scope is the 100 real-arm cells specifically, not
        the >20,000 null/null-object/legacy draws (validation-coverage
        gap, no disagreement found on a 120-draw supplementary check)
      result: pass_within_disclosed_scope
    - metric: stage2_null_object_gate_and_stage3_holm_bonferroni_real_arm
      forced: "gate cannot trigger falsely; real-arm test can detect a true effect"
      observed: >-
        the declared per-curve, Holm/Bonferroni-corrected procedure had
        ZERO statistical power at n=200 across all four declared families
        (floor 1/201 exceeds every family's alpha/m threshold by 5-10x),
        confirmed exactly and independently by both reviewers from raw
        data; the reported "gate passed" / "zero significant curves" was
        the design's only possible outcome
      result: uninterpretable_zero_power_by_construction
    - metric: p5_enrichment_fisher_exact
      forced: not_pre_registered_in_a_direction
      observed: >-
        arithmetically correct (independently reproduced exactly by both
        reviewers) but its independence assumption is violated two
        independent ways: 100% prime+B+t_used collision across matched
        pairs (Defect 2, sharpened), and 58% supersingular contamination
        of the j0 arm (new Validator finding); qualitative "no
        enrichment" reading assessed by the Red Team as unlikely to
        reverse under a corrected reconstruction, but the reported
        p-values are not citable as formally valid
      result: compromised_qualitative_reading_probably_robust
    - metric: legacy_panel_positive_controls
      forced: "subgroup exact N/h-1; coset-union closed form"
      observed: >-
        subgroup-availability precondition unmet (only RO3 has 4|n2 vs
        >=2 required), both correctly SKIPPED per the frozen contract's
        own fallback, confirmed by the Red Team directly in
        run_experiment.py; this cycle's mandatory positive control was
        therefore not re-exercised, relying entirely on EXP-MONO-c819ba's
        prior (n=30) panel's confirmation
      result: skipped_per_contract_relying_on_prior_experiments_control

  empirical_evidence_created: true
  mathematical_evidence_created: false
  scientific_evidence_created: true
  scientific_effect: >-
    H-MONO-663fb4's unconditional identities are re-exercised, not newly
    evidenced. This record's entire marginal contribution -- a corrected-
    calibration test of whether the real x-coordinate factor base's
    character bias is distinguishable from a matched random symmetric
    subset (K3/K4) -- FAILED FOR A NEW, DISTINCT, DOCUMENTED REASON from
    EXP-MONO-c819ba's failure (uncontrolled false-positive rate at n=30):
    a design with mathematically zero statistical power at n=200 given
    its own declared multiple-comparison families, confirmed
    unconditionally and independently by two reviewers. K3/K4 remains
    open after two consecutive experiments that each failed for a
    distinct, now-documented reason. The accumulated (imperfect, non-
    pre-registered) evidence across both experiments leans mildly,
    non-conclusively, toward no exceptional locus at the tested toy scale,
    per the Red Team's refinement of this Coordinator's own
    characterization. No ECDLP, relation-rate, or cryptographic-scale
    claim in either direction. Does not close KN-OPEN-009.

