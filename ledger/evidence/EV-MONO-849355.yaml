  proof_status: derivation
  proof_status_note: >-
    H-MONO-663fb4's identities (I1)-(I3) are unconditional and untouched by
    this record; Stage 0 re-exercised them on a fixture and both reviewers
    independently reconfirmed. THIS RUN'S ENTIRE MARGINAL CONTRIBUTION --
    a corrected-calibration test of the K3/K4 discriminating question --
    is unusable: both independent reviewers, using disjoint methods
    (fresh Holm-Bonferroni re-implementation vs. direct extraction-and-
    comparison scripting against the frozen implementation), confirmed
    that the declared Stage-2/Stage-3 procedure had ZERO statistical
    power at any true effect size, an unconditional arithmetic fact about
    the chosen (n=200, m~49-100, alpha=0.05) design, not a data-dependent
    judgment call.
  proof_refs:
    - experiments/EXP-MONO-670aa6/reviews/validator/validation-report.yaml (independent Holm-Bonferroni re-implementation; blind re-derivation of both defects; exact reproduction of every reported number)
    - experiments/EXP-MONO-670aa6/reviews/red-team/red-team-report.yaml (independent extraction-and-comparison scripting against the frozen implementation; Fisher-combined exploratory reanalysis; proves-too-much cross-check against EXP-MONO-c819ba)

  observations:
    - >-
      STAGE 0 AND THE DUAL-PATH CHECK ON THE 100 REAL-ARM CELLS HOLD,
      INDEPENDENTLY RECONFIRMED BY BOTH REVIEWERS. The Stage-0 fixture
      identities reproduce exactly (m2 variance-identity relative
      residual ~3.75e-15); the route-1 (direct convolution) vs route-2
      (FFT-derived) agreement on all 100 real-arm cells, both runs, is
      independently re-derived to <1e-9 relative by full deterministic
      re-execution. The Red Team additionally found this specific claim
      had been implicitly OVER-GENERALIZED in the archive: the >20,000
      null/null-object/legacy-graded draws underlying the actual p-value
      machinery were computed via route 2 ALONE, with per-draw self-
      diagnostics computed and then discarded rather than cross-checked
      or persisted. The Red Team ran its own supplementary 120-draw
      cross-check on the panel's highest floating-point-stress curves and
      found zero disagreement (max residual 4.5e-8) -- a validation-
      COVERAGE gap, not a demonstrated correctness failure, but the
      archive's own language should be read as scoped to the 100 real-arm
      cells specifically, not generalized to the full computation.
    - >-
      THE EXPERIMENT'S ENTIRE DECLARED PRIMARY TEST (STAGE-2 NULL-OBJECT
      GATE, STAGE-3 HOLM/BONFERRONI REAL-ARM TEST) HAD ZERO STATISTICAL
      POWER BY DESIGN, CONFIRMED INDEPENDENTLY AND EXACTLY BY BOTH
      REVIEWERS. At n=200 matched-null draws, a two-sided permutation
      p-value has floor 1/(n+1) = 1/201 ~= 0.004975. The declared families
      had 49-100 tests, giving Holm's most-lenient rejection threshold
      alpha/m in [0.0005, 0.00102] -- 5x to 10x BELOW the floor. This means
      NO cell in either family, either run, could ever have reached
      corrected significance, at ANY true effect size: the decision rule
      was a constant function of the data before a single draw was
      collected. Both reviewers independently re-derived this from first
      principles and then confirmed it against the archived data: the
      actual minimum p-value achieved across every curve, both
      statistics, both families, both runs is exactly 0.004975124378109453
      = 1/201, the theoretical floor, hit exactly in RUN-2. This
      unconditional arithmetic fact directly falsifies this contract's own
      `approval_requirements` bullet asserting the null-object gate
      "genuinely can trigger (i.e. is not tautologically satisfied)" --
      that requirement was unsatisfiable by this design and was not
      checked, by this Coordinator, before approval (Validator
      OTHER-FINDING-1). The "Stage-2 gate passed" and "Stage-3 zero
      significant curves" results carry NO discriminating information
      about H-MONO-663fb4's K3/K4 question from the DECLARED procedure.
    - >-
      THE PRIMARY PANEL'S TWO CURVE FAMILIES ARE NOT INDEPENDENTLY
      CONSTRUCTED, CONFIRMED AND SHARPENED BY BOTH REVIEWERS BEYOND THE
      ORIGINAL DISCLOSURE. `panel_primary.py`'s seed derivation never
      includes a family discriminator, so the prime `p` (and, as both
      reviewers independently discovered by re-running the frozen,
      unmodified implementation, the coefficient `B` and the acceptance
      index `t_used`) are IDENTICAL between the j0 and random-ordinary
      curve at every one of the 50 matched curve_ordinals, in 50/50 (100%)
      of realized pairs -- not "many" or "most." The Red Team further
      found the same missing-discriminator pattern independently recurs
      in `controls.py`'s null-sampling seed key, meaning the null-draw
      streams for the two families are also correlated, not only their
      panel construction. This is a genuine, total violation of the
      panel's own "100 independently-constructed curves" and "no two
      panel curves share a construction stream" claims, and it
      invalidates the independence assumption behind P5's Fisher-exact
      enrichment comparison specifically. The Red Team's own practical
      assessment: the qualitative "no enrichment" reading in the archived
      numbers is unlikely to be REVERSED by this defect (no established
      mechanism ties character-bias exceptionality to the shared p/B
      rather than to the treatment variable A), but the reported p-values
      (0.617, 1.0) should not be cited as formally valid going forward.
    - >-
      A SECOND, INDEPENDENT REASON P5'S "J0 VS RANDOM-ORDINARY" COMPARISON
      IS COMPROMISED, DISCOVERED BY THE VALIDATOR AND NOT PREVIOUSLY
      QUANTIFIED: 29 of the 50 realized j0 curves (58%) have p = 2 mod 3
      and are therefore FORCED supersingular (N = p+1 exactly), versus
      1/50 for the random-ordinary family, because the frozen v1
      curve_construction text names no ordinary-vs-supersingular
      rejection (a rejection was tried during implementation and removed
      after it was found to eliminate ~half of j0 slots -- this review
      independently computed and confirmed the exact figure, 58%). A
      family that is 58% supersingular is not "j=0 curves" in the generic
      sense either H-MONO-663fb4 or this contract's own
      `random_ordinary_curves` definition intends, independent of and in
      addition to the prime-collision defect above.
    - >-
      K3/K4 REMAINS OPEN, BUT NOT IN THE SENSE OF "ZERO ACCUMULATED
      INFORMATION" -- THE RED TEAM'S REFINEMENT OF THIS DISPOSITION IS
      ADOPTED. This Coordinator's original correction record characterized
      the guaranteed-null design as carrying "zero discriminating
      information... in either direction," which the Red Team correctly
      flagged as slightly overstating the vacuum: it conflates the
      DECLARED procedure's power (genuinely zero) with the archived DATA's
      information content (not zero). Three independent, non-floor-
      limited readings already on file -- (i) the Red Team's own
      exploratory, non-pre-registered Fisher-combined-probability
      reanalysis of this run's own archived per-curve p-values (combined
      p in [0.357, 0.993] across all four family/run cells, no signal),
      (ii) EXP-MONO-c819ba's own independently-constructed 254-curve
      enrichment test (12.1% vs 20.0%, Fisher p=0.092, opposite direction
      to the hypothesis), and (iii) that same review's continuous z-score
      reanalysis -- all lean mildly, non-conclusively, toward no
      exceptional locus. The corrected characterization: K3/K4 remains
      open in the sense that NO PROPERLY POWERED, PRE-REGISTERED TEST HAS
      YET RUN across two consecutive experiments; it is not open in the
      sense that nothing at all is known. The exploratory reanalysis is
      NOT presented as evidence toward H-MONO-663fb4's status (per this
      contract's own invalidation_rules on post-hoc reanalysis) and
      changes nothing here; it is named as informative context for
      ranking the next action.
    - >-
      A CHEAP, ALREADY-COMPUTABLE, NON-FLOOR-LIMITED ALTERNATIVE STATISTIC
      WAS IDENTIFIED FOR A SUCCESSOR CONTRACT. The Red Team's Fisher-
      combined-probability test, pooling per-curve raw p-values WITHIN
      each family (independent of the cross-family collision above),
      sidesteps the floor-vs-threshold problem entirely because it applies
      no per-test multiplicity correction. This should be PRE-REGISTERED
      as a second primary metric alongside the per-curve Holm test in any
      successor contract, not substituted post-hoc.
    - >-
      A CROSS-CUTTING FINDING, DISCLOSED BUT NOT REOPENING ANY PRIOR
      RECORD: the Red Team's proves-too-much check found the IDENTICAL
      floor-vs-threshold arithmetic defect, unremarked, in
      EXP-MONO-c819ba's own already-closed Red Team review (its
      "Bonferroni over 96 = 1.000" sentence, at n=30, floor 1/31~=0.032 vs
      alpha/96~=0.00052). That sentence was exactly as vacuous as this
      run's own failure, but EV-MONO-b84b24/DEC-20260830-891d39's overall
      conclusion never depended on it -- four other, non-floor-limited
      lines of evidence carried the actual weight. This is filed as a
      documentation addendum to KN-TECH-7745e6.md (2026-08-31), not a
      reopening of EV-MONO-b84b24's disposition. It also traces the origin
      of this contract's defect: EXP-MONO-c819ba's Red Team's own
      `next_concrete_action` recommended, verbatim, the "200 draws...
      Bonferroni over the full 96-comparison family" design that became
      EXP-MONO-670aa6's frozen text -- the defect was baked in at the
      point of recommendation, not introduced later, and was checked by
      neither that Red Team, that Validator, KN-TECH-7745e6's authors, nor
      this Coordinator's own approval.
    - >-
      A THIRD, GENUINE PROCESS FINDING: THIS EXPERIMENT'S OWN
      APPROVAL_REQUIREMENTS WERE UNSATISFIABLE BY CONSTRUCTION AND WERE
      NOT CHECKED BEFORE APPROVAL (Validator OTHER-FINDING-1). This
      Coordinator's own approval text asserted "independent review
      confirms the null-object gate... genuinely can trigger" as a
      condition of approval; per the unconditional floor-vs-threshold
      arithmetic, this could not have been true of the design as drafted,
      and no artifact shows it was checked pre-approval. A worked
      remedy (compute floor vs. alpha/m for every declared family at
      design time, before any draw) is named as knowledge/techniques/
      KN-TECH-95a42b.md.
    - >-
      GOVERNANCE: AN ELEVENTH OUT-OF-BAND "CURSOR AGENT" COMMIT, THIS TIME
      SUBSTANTIVELY CORRECT ON ITS TWO MOST SEVERE NAMED DEFECTS,
      INDEPENDENTLY VERIFIED RATHER THAN ADOPTED. CORR-20260831-d15d36
      discloses commit 837e51ae5, which edited this contract's frozen
      specification.yaml AFTER the run completed. This Coordinator did
      NOT adopt the edit as an authorized protocol amendment (the
      contract's own invalidation_rules require a versioned amendment for
      exactly this kind of post-observation change); instead this
      Coordinator, and independently both reviewers, re-derived the two
      most severe named defects from the archived data and source code
      directly. The currently-committed specification.yaml (post-edit)
      no longer describes what RUN-MONO-670aa6-1/2 actually executed
      against (the original text is preserved only in git history at
      commit 9e0e460e3) -- a documentation-currency hazard for any future
      reader who does not also read CORR-20260831-d15d36, flagged by the
      Validator (OTHER-FINDING-4) and named by the Red Team as a required
      control for any successor (a machine-readable pointer at the top of
      the specification file).

