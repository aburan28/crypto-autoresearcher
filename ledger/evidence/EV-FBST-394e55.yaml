evidence:
  id: EV-FBST-394e55
  hypothesis_id: H-FBST-c8a080
  experiment_ids: [EXP-FBST-190234]
  run_ids: [RUN-FBST-190234-002]
  recorded_at: '2026-08-07'
  type: empirical
  direction: supports
  strength: replicated
  strength_note: >-
    Upgraded from EV-FBST-8949fc's `preliminary` to `replicated`: this run gives 40
    curves of EXACTLY the same order at 7 independently chosen targets (280 curves per
    construction, not the 2-8 of the incidental groups it deepens), with a proper Wilson
    confidence interval on the pooled rate. Still one implementation, one prime, one
    session, and not independently reviewed -- see boundaries.
  claim_tier: toy
  certificate_refs: []
  proof_status: empirical_only
  proof_refs:
    - experiments/EXP-FBST-190234/specification.yaml
    - experiments/EXP-FBST-190234/runs/RUN-FBST-190234-002/raw-result.json

  observations:
    - id: OBS-1
      text: >-
        DELIBERATE HUNT, NOT INCIDENTAL COLLISION. Seven target orders N were chosen: the
        five that showed relation-rank deficiency in RUN-FBST-190234-001's incidental
        same-N groups (3919, 3947, 4007, 4021, 4099), plus the two most-frequent prime
        orders found by scouting 4000 fresh random curves at p=4001 (4027, 4057, neither
        previously flagged). For each target, random (A,B) at p=4001 were drawn until 40
        curves of EXACTLY that order were found, each independently re-verified by
        [N]P = O. All seven reached depth 40; 9710-20998 trials per target
        (~1/(4*sqrt(p)) hit rate, as expected for a roughly uniform Hasse-interval draw).
    - id: OBS-2
      text: >-
        THE DISENTANGLING RESULT, NOW AT REAL DEPTH. Across all 7 targets x 40 curves =
        280 curves per construction, `uniform_random`, `sidon_dl` and `small_multiples`
        remained EXACTLY invariant -- zero exceptions, at both B=16 and B=24. This is the
        same structural guarantee EV-FBST-8949fc OBS-2 reported at incidental depth 2-8;
        confirming it at depth 40 does not change the conclusion (it could not, since the
        seeding is deterministic in (N,B,name)) but removes any doubt that the earlier
        small groups were too thin to trust.
    - id: OBS-3
      text: >-
        THE QUANTIFIED DEFICIENCY RATE. Pooled over all 7 targets at B=16: 14/280
        curves gave a rank-deficient `smallest_x` base, a rate of 5.0%, Wilson 95% CI
        [3.0%, 8.2%]. Per-target rates: N=3919 2.5%, N=3947 0.0%, N=4007 12.5%, N=4021
        7.5%, N=4027 5.0%, N=4057 5.0%, N=4099 2.5% -- all in {0/40, 1/40, ..., 5/40},
        consistent with a common underlying rate near 5% rather than a small number of
        wildly different per-curve-order rates. Deficiency by more than 1 rank occurred
        once (N=4007: one curve at rank 14, four at rank 15).
    - id: OBS-4
      text: >-
        THE RATE FALLS SHARPLY WITH B. Pooled over the same 7 targets at B=24: 1/280,
        0.36%, Wilson 95% CI [0.06%, 2.0%] -- and that one deficiency occurred at
        N=3919, the same order that was also the least-deficient-looking of the five
        original targets at B=16 (2.5%, tied for lowest). The 95% CIs at B=16 and B=24
        do not overlap (B=16 floor 3.0% > B=24 ceiling 2.0%), so this is not noise: the
        deficiency rate drops by roughly an order of magnitude between these two sizes,
        consistent with the qualitative pattern already seen in RUN-FBST-190234-001
        (rank saturates as B grows toward N).
    - id: OBS-5
      text: >-
        A CONCRETE SMALL-SAMPLE CORRECTION. RUN-FBST-190234-001 found N=3947 deficient in
        1 of its 8 incidental curves (12.5%), the deepest incidental group in that run.
        Hunted to depth 40 here, N=3947 shows 0/40 deficient (0.0%). The true rate for
        this specific order, at n=40, is most plausibly close to the pooled 5% or lower
        -- the incidental 12.5% was consistent with, but not a reliable estimate of, that
        rate; a single event in 8 trials has enormous sampling variance. This is not a
        retraction: EV-FBST-8949fc's own boundaries section named exactly this weakness
        ("group depths are mostly 2-3 curves... A study that deliberately hunted for many
        curves of one target order would give tighter estimates") and this run is that
        study.
    - id: OBS-6
      text: >-
        COVERAGE SPREAD IS TIGHTER, AND MORE INFORMATIVE, AT REAL DEPTH. B=16 coverage
        spread (max - min within a target's 40 curves) across the 7 targets: 0.028 to
        0.046, all within a factor of 1.6 of each other. EV-FBST-8949fc reported a median
        of 0.031 and a MAX of 0.238 over incidental groups of size 2-8; the depth-40
        spreads found here (0.028-0.046) sit near that median and nowhere near that max.
        With n=2, the sample max-minus-min is itself a noisy statistic with a fat right
        tail; 0.238 was very likely an extreme order-statistic draw from a small sample,
        not a representative effect size. The true within-order coverage spread at B=16,
        N~4000, is better estimated as roughly 0.03-0.05 than as "up to 0.24."

  inference: >-
    This run converts EV-FBST-8949fc's qualitative finding (relation rank CAN differ
    across curves of the same order) into a quantified one: at B=16, N~4000, the rate is
    approximately 5% (Wilson 95% CI 3.0-8.2%), falling to roughly 0.4% at B=24, a drop
    the non-overlapping confidence intervals show is real rather than sampling noise.
    Both the disentangling proof (three constructions exactly invariant, now at n=280
    per construction) and the qualitative direction of the original finding survive
    unchanged. What changes is precision, and one specific correction: N=3947's
    incidental 12.5% deficiency rate does not replicate at depth 40 (0.0%), illustrating
    exactly the small-sample risk EV-FBST-8949fc flagged about its own evidence rather
    than contradicting it.

    Operationally, a ~5% chance that a standard smallest-x factor base of size 16 is
    rank-deficient by one is a modest but real number: any real index-calculus
    implementation already collects more relations than the bare minimum for exactly
    this kind of reason, so this quantifies a known operational margin rather than
    discovering a new failure mode. Its value here is narrower and more useful within
    this program: it is a real, disentangled, curve-dependent number on the factor-base
    locus, of the kind paper section 11 Question 2 asked whether any existed, now with
    an actual rate rather than an existence claim.

  boundaries:
    - >-
      ONE PRIME. All 7 targets are orders realized at p = 4001. Nothing here shows the
      ~5%/~0.4% rates transfer to a different p, a different B/N ratio outside {16,24}
      relative to N~4000, or to composite-order curves (this whole battery uses
      prime-order curves throughout).
    - >-
      Toy scale, N ~ 4000 (12 bits). No claim, in either direction, about how this rate
      scales with N -- that would need targets spanning a wide range of orders, which
      this run does not provide (all 7 targets are close together, within about 5% of
      each other, an artifact of hunting at one fixed p).
    - >-
      Scouted targets (4027, 4057) were chosen because they occurred often among 4000
      random draws at p=4001, which correlates with nothing about their relation-rank
      behaviour a priori; they behaved statistically indistinguishably from the five
      targets chosen because they had ALREADY shown deficiency, which is reassuring
      (no evidence the original five were cherry-picked into looking special) but is
      itself only 2 fresh data points.
    - >-
      Nothing here bears on ECDLP hardness, and no exploitable lever is identified --
      same scope as EV-FBST-8949fc, restated because a number this specific (5.0%, a
      CI) can look more actionable than it is.

  unresolved_confounds:
    - >-
      NO INDEPENDENT REVIEW. Rule 12 not met, same as every other record in this
      session's chain. The deepening design itself is a partial mitigation for the
      SPECIFIC weakness it targets (thin replication) but not a substitute for a second
      implementation or a second reviewer.
    - >-
      The scouting step (pick the most-frequent prime orders among 4000 draws) could in
      principle introduce a subtle selection effect -- e.g. if orders with certain
      arithmetic properties are both more likely to be drawn AND more likely to show
      deficiency. This was not checked. The five pre-flagged targets, chosen for the
      OPPOSITE reason (already known to be deficient, not frequency), showing the same
      pooled rate as the two frequency-scouted ones is evidence against a strong version
      of this confound, not proof against it.
    - >-
      Wilson intervals assume the 7 per-target rates are draws from a single common
      binomial rate; OBS-3's per-target numbers are broadly consistent with that but were
      not formally tested (e.g. no chi-square homogeneity test was run).

  reviewed_by: none
