  observations:
    - id: O-1
      text: >-
        Measured Semaev m=2 relation collection rate at p=1009 (N=951, B=54, heuristic=1.53)
        for different fractions of the factor base checked per target:
        B/4 (13 checks): 51% success; B/2 (27 checks): 67%; 3B/4 (40 checks): 77%; B (54 checks): 78%.
    - id: O-2
      text: >-
        BKK factor-2 improvement in practice: checking B/2 gives 67/78 = 86% of the full yield
        with 2x speedup. Net practical speedup: ~2x / (1/0.86) ≈ 1.72x in relation collection.
        This is consistent with the BKK/mixed-volume analysis: MV = B/2 (half the Bezout bound)
        suggests checking B/2 pairs captures the "essential" decompositions.
    - id: O-3
      text: >-
        For the full index calculus with B close to the optimal: the BKK insight gives a
        CONSTANT FACTOR improvement (~1.7x) in relation collection cost. This improves the
        CONSTANT c in exp(c*sqrt(log N * log log N)) by a factor ~1/log(1.72) ≈ 0.81 — a
        ~19% improvement in the exponent constant. Not exponent-moving, but genuine improvement.

  dominated_by: Standard Semaev index calculus at exp(c*sqrt(log N * log log N))
