evidence:
  id: EV-ECDLP-921b5d
  hypothesis_id: H-ECDLP-a40416
  experiment_ids: [EXP-ECDLP-c373eb]
  run_ids: [RUN-ECDLP-c373eb-2]
  type: empirical
  direction: supports
  strength: preliminary
  claim_tier: toy
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []

  round_disposition: >-
    SPLIT VERDICT. J1 holds, J2 breaks. The joints are conjunctive by the
    plan committed before either reviewer launched, so the claim under
    review -- that RUN-2 jointly with RUN-1 suffices to upgrade
    KN-FIND-1ba0fe from `preliminary` to `replicated` -- DOES NOT CARRY.
    RUN-2 is accepted as a sound second measurement; the confidence upgrade
    is refused.

  observations:
    - id: O-1
      joint: J1
      statement: >-
        The validator (TASK-20260903-6048dc, review-adversarial, xhigh, fresh
        blinded session) independently re-derived RUN-2's instance and full
        tabulation using methods sharing nothing with the producer's:
        point count by two methods (Legendre symbol and square-table),
        canonical lift by EXHAUSTIVE DIGIT SEARCH with per-level uniqueness
        recorded (vs. the producer's Newton/Hensel iteration), affine
        sequential chain arithmetic (vs. the producer's Jacobian
        double-and-add), and division polynomials psi_41 as an independent
        order-n criterion, calibrated on F_p before use. Verified
        n*S_hat = exact projective identity at p^8 AND p^20 by two
        independent criteria. Result: zero per-pair mismatches across all
        780 canonical and all 780 null entries; x_hat and y_hat (23-digit
        integers) identical to the producer's.
      measured_by: [RUN-ECDLP-c373eb-2]
    - id: O-2
      joint: J1
      statement: >-
        Sealed-before-open protocol was honoured and is mechanically
        verifiable: sealed_block_sha256
        0c683572efa10fbe690b5b738080732a9b9d192ce365bd46bfc4cb3c449c9809.
        This Coordinator INDEPENDENTLY RECOMPUTED that hash from the stored
        canonical-JSON block and it matches exactly, so the sealed content is
        tamper-evident and genuinely predates the comparison phase.
      measured_by: [RUN-ECDLP-c373eb-2]
    - id: O-3
      joint: J1
      statement: >-
        Object B (proves-too-much) control returns a DIFFERENT and CORRECT
        verdict on the known-false object, as required. The validator's
        argument begins "[41]S_hat = O exactly"; on the null lift that step
        is false, so the argument does not reach flatness -- run unchanged it
        predicts image {0, t} with t = 1, which is what is observed. The
        validator strengthened this beyond the brief into a DOSE-RESPONSE
        SWEEP: perturbing the lift to depth t = 1..9 yields image exactly
        {0, min(t,8)} every time. This independently rules out the
        precision-artifact hypothesis, which would have pinned the cap
        regardless of t. This is a genuine addition to the round's evidence
        that the null-lift control alone did not supply.
      measured_by: [RUN-ECDLP-c373eb-2]
    - id: O-4
      joint: J2
      statement: >-
        The red team (TASK-20260903-d02517, review-adversarial, xhigh, fresh
        blinded session) established that RUN-1 and RUN-2 are ONE
        IMPLEMENTATION run on two instances, not two implementations:
        270 vs 282 executable lines with 266 in common; the entire executable
        difference is five lines (p, A/B, n, the triples literal, and one
        added assert), every function byte-identical, the remainder docstring.
        THIS ORCHESTRATING COORDINATOR INDEPENDENTLY RE-VERIFIED THIS COUNT
        (266 common, 4 lines only-in-RUN-1, 15 only-in-RUN-2 of which 11 are
        docstring) rather than accepting the reviewer's figure. Consequently
        P(agree | shared systematic error) = 1, and the agreement carries
        likelihood ratio 1 on the hypothesis at issue.
      measured_by: []
    - id: O-5
      joint: J2
      statement: >-
        The order-n block RUN-2's manifest names `independent_certificate` is
        NOT independent of what it certifies: both runs compute it as
        scalar_mult(n, S_hat) == (0,1,0) using the same jac_add/jac_dbl used
        everywhere else, and the manifest's own text concedes it is
        "recomputed via the SAME double-and-add scalar multiplication used
        everywhere else in this script." Each script already contains an
        unused independent group law (fp_add/fp_mul) that is never
        cross-checked against the Jacobian core. The naming overstates the
        check's standing.
      measured_by: []
    - id: O-6
      joint: J2
      statement: >-
        Object A (proves-too-much) control PROVES TOO MUCH -- the argument
        for the upgrade SURVIVES against two runs of the same systematically
        wrong script, where the conclusion is known false. Every clause still
        holds there: two distinct instances; agreeing image (guaranteed by
        shared code); a null control returning a different image (same shared
        code, differing identically in both); an order-n certificate
        (computed by the wrong arithmetic itself); and a spot-check against a
        "second path" (scalar_mult vs scalar_mult_naive, both calling
        jac_add, at pair (5,12) in both runs). The survival is located
        precisely: at the silent step "the two runs agree, therefore the
        agreement is evidence about the mathematics," which assumes
        conditional independence given the mechanism. Patching the argument
        to require reproduction "by an implementation sharing no code with
        the producer" does NOT license Object A -- it discriminates -- and
        that patched form is the program's own operative standard, which
        RUN-2 does not satisfy.
      measured_by: []
    - id: O-7
      joint: J2
      statement: >-
        Two defects in the upgrade TARGET itself, independent of RUN-2's
        quality. First, docs/evidence-and-reproducibility.md defines
        `replicated` in one table row only -- "reproduced from a clean run,
        preferably independently" -- with no instance count, independence only
        a preference, and no axis named; that documented threshold does not
        decide this case, and the gap is itself a finding. The OPERATIVE
        standard is stricter and near-unanimous: of 50 `replicated` evidence
        records, 31 ground the label in independent implementation or
        re-derivation, and EV-DIFFP-1e08cc states it outright
        ("`replicated` DESCRIBES HOW MANY IMPLEMENTATIONS PRODUCED A NUMBER").
        Second, `replicated` is not in the KN-FIND `confidence` vocabulary at
        all: 0 of 81 findings use it, and the templates define no `confidence`
        field for knowledge entries. The upgrade as framed was partly
        malformed.
      measured_by: []
    - id: O-8
      joint: J2
      statement: >-
        Scope: both runs draw from one narrow configuration -- p 1009 -> 1013
        (the next prime), (A,B) (1,1) -> (2,2), n 47 -> 41, first hit from a
        disclosed 3x25 search box, same deterministic S-selection rule, no
        within-curve S diversity, and r=8, GUARD=4, null depth e=1, ordinary,
        minimal model all fixed or asserted out. This is repetition of one
        configuration rather than replication of the finding across its
        claimed scope. KN-FIND-1ba0fe's own forward guidance says a second
        instance moves it "toward" `replicated`, not to it.
      measured_by: []

  inference: >-
    O-1 through O-3 establish that RUN-2 is a sound measurement and that its
    reported numbers are correct: an independent re-derivation by genuinely
    different methods reproduced roughly 1560 per-pair values and two 23-digit
    coordinates exactly, the seal is tamper-evident and Coordinator-recomputed,
    and the proves-too-much control discriminates correctly with a
    dose-response sweep that additionally rules out the precision-artifact
    explanation. O-4 through O-8 establish, equally soundly, that this does
    NOT license the confidence upgrade: the two runs share 266 of ~270
    executable lines, so their agreement is correlated rather than
    corroborating; the internal order-n certificate is not independent of the
    arithmetic it checks; the upgrade argument demonstrably proves too much
    against a known-false object; and the target label is both
    under-defined in the corpus and absent from the KN-FIND vocabulary.
    Both conclusions are correct and they are not in tension: RUN-2 measured
    the right thing correctly, and measuring the right thing correctly a
    second time with the same code is not replication.

  boundaries:
    - >-
      The round validates RUN-2 as a measurement. It does NOT establish
      replication, and no record may cite this evidence as replication.
    - >-
      Both runs remain ~10-bit toy instances from one narrow configuration
      family; nothing here transfers to cryptographic scale, and no transfer
      argument is made.
    - >-
      Per the control's own standing limitation, a finite-precision
      computation observes only "at least r", never literal infinity. The
      reported on-fibre value 8 is a sentinel for exact ring equality at the
      truncation cap, not a measured valuation.
    - >-
      J2's objections O-4 through O-6 concern implementation independence,
      not mathematics. They do not impugn Proposition E, whose derivation is
      classical and was separately confirmed; they bound what two runs of one
      script can evidence.

  unresolved_confounds:
    - >-
      UC-1: no cross-implementation check of the group law exists in either
      run. The unused fp_add/fp_mul path in both scripts is never
      cross-checked against the Jacobian core that produces every reported
      number. FG-1 below is designed to close exactly this.
    - >-
      UC-2: neither parameter that should move the measured quantity was
      swept within the runs themselves -- r in {4,8,16} (on-fibre must track
      r) and null depth e in {1,2,3,4} (null image must read {0,e}). The
      validator's own t=1..9 sweep partially closes the second of these from
      outside the run package, but it is a reviewer artifact, not a run.
    - >-
      UC-3: the good-reduction / minimal-model premise has no null object
      anywhere in this experiment.

  recorded_at: '2026-09-03'
  decided_by: null
