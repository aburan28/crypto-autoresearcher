evidence:
  id: EV-HQC-7e4b28
  hypothesis_id: null
  hypothesis_id_note: DELIBERATELY NULL. BATCH-c5703d repaired an INSTRUMENT and ran no measurement arm.
    Naming H-HQC-18d1b4 would invite the inference that something was learned about the joint failure
    law. Nothing was.
  experiment_ids:
  - EXP-HQC-982268
  run_ids:
  - RUN-HQC-982268-STAGEA-a
  type: empirical
  direction: neutral
  strength: preliminary
  claim_tier: toy
  certificate_refs: []
  proof_status: empirical_only
  proof_refs:
  - coordination/goals/GOAL-HQC-001/batches/BATCH-c5703d/reviews/TASK-20260806-301f68/validation_report.yaml
  - coordination/goals/GOAL-HQC-001/batches/BATCH-c5703d/reviews/TASK-20260806-42c153/red_team_report.md
  - coordination/goals/GOAL-HQC-001/batches/BATCH-c5703d/tasks/TASK-20260806-dbadc8/amendment_v2.yaml
  observations:
  - 'R1 IS REAL AND INDEPENDENTLY REPLICATED. The validator re-implemented the estimator (0.0 difference
    against stage_a.log2_A_from_hist; 9.9e-14 bits against the exact rational) and measured the v2 rule
    at 0.256-0.282 percent over 35 cells with its own seeds and constants, against the producer''s claimed
    0.252-0.290 percent. The equivalence the calibration rests on -- A_k = 1 for all k if and only if
    S is Binomial -- is exactly true: the factorial-moment matrix is unit upper-triangular and exact rational
    back-substitution gives max difference EXACTLY 0. The old rule''s mis-sizing survives to Stage B (validator:
    1.83 percent at PS-R1 k=16, 2.20 percent at PS-R5 k=30), so it was never a small-T artifact.'
  - 'TWO BLOCKING DEFECTS BAR THE AMENDMENT. VF-1: the critical constants AS TRANSCRIBED into amendment_v2.yaml
    are rounded to five decimals, truncating 4.8-8.6 percent off half-widths of 2.2e-5 to 5.5e-5 bits,
    so the transcribed rule realizes 0.610 / 0.419 / 0.551 percent at k=2 for PS-R1 / PS-R3 / PS-R5 --
    against printed values of 0.274 / 0.262 / 0.283 and the amendment''s own [0.002,0.004] gate. The rule
    is calibrated; the artifact that encodes it is not. VF-3: PS-A''s q-sensitivity block has ZERO rows,
    while 3*SE(q-hat)/q-hat is 3.33 percent at PS-A against 0.06-0.12 percent elsewhere, and at plus/minus
    3 SE the PS-A k=2 and k=3 cells leave the acceptance band -- and those two cells are exactly what
    the amended success criterion funds.'
  - THE ADVERTISED DETECTION LIST IS WRONG, AND THE REASON IS STRUCTURAL. The red team injected eight
    variants into the real instrument over 400,000 trials, with a re-implemented decoder matching stage_a.decode_blocks
    on all 400,000 x 46 decodes. CTRL-POSHOM genuinely fires on a block-0 tie rule (Q/df 571.5) and on
    a single masked coordinate in the last block (Q/df 17.31 at a q-hat shift of only -0.19 percent) --
    both real wins. But it is BLIND to off-by-one truncation, to a wrong (interleaved) block partition,
    and to the last block reading one coordinate early, all of which the amendment lists on the catch
    side. The cause is that the ring-shift invariance which FORCES the null also protects every shift-equivariant
    defect.
  - THE RECALIBRATED RULE IS CALIBRATED FOR THE NULL IT WAS FIT ON, NOT THE ONE IT WILL FACE. The red
    team constructed a law matching E[S] to 1.1e-16 and E[C(S,16)] to relative error exactly 0 -- so log2
    A_16 = 0 identically -- at total variation 8.9e-5 from the calibration binomial.
  - 'R5 WAS CLOSED BY THE REVIEW, NOT BY THE PRODUCER. The producer specified the oracle gate but declined
    to verify it, BATCH-003 being outside its read scope, and said so. The validator ran it against the
    real BATCH-003 oracle: 13 configurations, 40 cells, max difference 7.11e-15 bits against a 1e-12 tolerance,
    12 cells above 1 bit and 18 negative. The gate passes -- with ZERO slack at its own 40-cell coverage
    floor.'
  - 'R3 CONFIRMED IN FULL: the cap sits 39.06-69.99 (M)-sigma above the (M) mean while the (T) maximum
    is only 4.00-4.20 (M)-sigma above it, so the two laws differ in DISPERSION and not location and no
    location detector can separate them. D1 already separates at 78.77-135.42 SE.'
  - 'R4 ARITHMETIC EXACT AND DOMINANCE CONFIRMED: T_stab 1.452e8 / 1.000e6 / 2.554e7; PS-R3 at T=1e7 costs
    4,852 core-seconds for MDE80 0.092 bits, against PS-R1 at T=1e9 costing 391,346 for 0.128 and PS-R5
    at T=1e8 costing 66,590 for 0.175. PS-R3 is better on resolution AND cost.'
  - 'THE OBJ-3 DISPUTE IS RESOLVED AS AGREEMENT, NOT AS A CORRECTION. VF-5: the previous red team''s 5.4x
    is a VARIANCE ratio and the producer''s 1.78-2.33x are SD ratios, which square to 3.18-5.43x. The
    formula at q_for_sizing reproduces the tabulated SEs to 0.3 percent, so the producer''s diagnosis
    -- wrong q, not wrong formula -- is right and is worth having, but it refines the earlier finding
    rather than overturning it. The Coordinator''s BATCH-c5703d interim report repeated the producer''s
    "correction" framing without checking the units; this record corrects it.'
  - 'OPEN-7 RESOLVED IN THE PRODUCER''S FAVOUR: the validator measures PS-R5 k=30 v1 size at 7.775 percent
    (stage_a batching) and 7.835 percent (producer batching), reproducing the producer''s 7.76 percent;
    the previous red team''s 12.7 percent (38/300) does not reproduce, and batching is excluded as the
    cause.'
  - 'OPEN-8 CONFIRMED as a real disclosure surface: log2 A_2 is recoverable in two lines from the already-committed
    Stage-A (T) S-histograms. The producer''s refusal to compute the CTRL-POSHOM exact constant was correct
    and FORCED, because that constant IS the k=2 measurement (E[Q_raw] = (n_e-1)(1 - cbar/v) and A_2 =
    1 + cbar/q^2, both verified by the validator).'
  inference: 'The repair is real where it was measured and is not yet usable as written. R1''s calibration
    replicates independently and R3, R4 and R5 are confirmed -- R5 by a reviewer doing the work the producer
    declined. But the amendment''s encoded constants realize three to four times their intended size,
    its most sensitive parameter set has no sensitivity analysis at all, and its new primary control is
    blind to three of the defects it advertises catching, for a structural reason that will not go away
    by relisting: the invariance that forces the null also protects shift-equivariant defects. Both reviews
    independently reach the same shape of conclusion -- admit the direction, refuse the artifact. What
    is established is about the APPARATUS.'
  boundaries:
  - 'NOTHING here bears on HQC decoding-failure rates, on assumption A17 or A5, on the joint failure law,
    or on any standardized HQC parameter set. Claim tier: toy.'
  - H-HQC-18d1b4 is unchanged at proposed. No measurement arm ran and none could.
  - The v2 amendment is a PROPOSAL. experiments/EXP-HQC-982268/specification.yaml is untouched, verified
    by the validator at sha256 9b93108c, last changed at cab9633e.
  - 'CTRL-POSHOM clause (b) is UNEVALUATED, not passed: no reference distribution and no committed pairwise-by-position
    artifact exist.'
  - The CTRL-ORACLE pass has zero slack at its 40-cell coverage floor; it is a pass, not a margin.
  unresolved_confounds:
  - 'VF-2: the producer''s headline "measured out-of-sample size" is near-tautological -- the validator
    ran the same procedure on a standard normal and got 0.2476-0.2894 percent, 99.5 percent inside the
    claimed band. The measurement is necessary but far weaker evidence than it reads as.'
  - The red team's constructed near-null (TV 8.9e-5, log2 A_16 = 0 identically) shows the rule's size
    is unknown off its calibration point; how far off matters has not been quantified.
  - CTRL-POSHOM's detection power was measured against one declared bias family only.
  - The red team exceeded its wall-clock authorization by roughly 40 percent (about 2,100 seconds against
    1,500 authorized) and reported the overrun rather than trimming it. Its findings stand; the budget
    breach is recorded.
  reviewed_by: coordinator
