      TASK-20260803-33f760 (independent red team; complete; returned OBJ-1
      refuting this batch's own headline gap claim, a successful fiber attack,
      and a 28x cost mispricing)
    - >-
      TASK-20260803-73a6f4 (independent validator; INCOMPLETE -- substantively
