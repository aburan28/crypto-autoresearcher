evidence:
  id: EV-AES-752cf1
  hypothesis_id: null
  hypothesis_id_note: >-
    DELIBERATELY NULL. BATCH-005 was a control-and-close batch: a byte-width
    replication of a mechanism previously settled only in a nibble analogue, and
    a deconfounding of an apparent S-box effect. Neither bears on a hypothesis
    RQ-AES-003 carries. Admitted under the documented-null allowance recorded in
    CORR-20260802-009.
  experiment_ids: []
  run_ids: []
  task_ids:
    - TASK-20260803-6d88ba
    - TASK-20260803-48a239
    - TASK-20260803-07605c
    - TASK-20260803-73a6f4
    - TASK-20260803-33f760
  type: measurement
  direction: supports_prior_reading
  strength: weak
  strength_basis: >-
    WEAK, AND THE BINDING REASON IS THAT ITS VALIDATOR NEVER RENDERED A VERDICT.
    The validation report is substantively complete -- 42 KB of checks, with T1
    through T4 recomputed in the validator's own code matching the producer to
    three decimals, the T4 power reproduced by exact enumeration at 0.8156
    against a reported 0.816, and an exact Clopper-Pearson interval computed on
    the R2:R1 rate ratio -- but its `verdict` and `verdict_note` fields read
    PLACEHOLDER because the validating session terminated before filling them.
    A review with matching arithmetic and no ruling is not a passed review. The
    red team reviewed fully and returned a substantial adversarial reading, so
    this batch has one complete review and one incomplete one.
  claim_tier: toy
  claim_tier_basis: >-
    Reduced-round AES-shaped SPN at r in {2,4,5,6,7,10} on one machine: one 2^32
    diagonal coset at byte width under one key and one base, and a software
    T-table / AES-NI yoyo probe at 2^30 to 2^33 trials. No crypto-scale,
    medium-scale, affected-scheme or asymptotic claim is made or implied, and no
    comparison to published cryptanalysis is made in either direction.
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []

  observations:
    - id: OBS-B5-1
      statement: >-
        THE BYTE-WIDTH ARM WAS RUN AND THE MECHANISM DIES BETWEEN r=5 AND r=6 AT
        GF(2^8), SO THE NIBBLE ANALOGUE DID NOT MISLEAD. Under the four-zero
        non-singular mixing matrix at r=6, j0=0, on the full 2^32 coset, the
        statistic n = sum_v C(m_v,2) reads 2147565862 with gcd of nonzero fiber
        sizes 1, twelve distinct nonzero fiber sizes, max_occ 12 and a
        Poisson-shaped occupancy histogram -- the fiber-divisibility signature is
        ABSENT. Under AES MixColumns at the same r, key, base and index it reads
        2147523716 with gcd 1 and max_occ 12. BATCH-002 measured the same matrix,
        key, base and index at r=5 with max_occ 2816 and every nonzero fiber size
        a multiple of 256.
      status: >-
        Producer measurement; arithmetic checked by the red team, which did not
        dispute it. The validator's checks of this arm are recorded but carry no
        verdict.
      why_it_mattered: >-
        The BATCH-004 validator had ruled that a GF(2^4) nibble instrument can
        establish that the mechanism exists, dies and admits a counterexample at
        r=5 but CANNOT establish the round count at which GF(2^8) decays -- the
        mod-8 margin is 2x the modulus at nibble width against 32x at byte width.
        A contradiction here would have meant a central conclusion rested on a
        misleading analogue. There is none.
    - id: OBS-B5-2
      statement: >-
        THE APPARENT S-BOX EFFECT DOES NOT SURVIVE DECONFOUNDING. In a 3x3
        factorial separating S-box from key and stream, T1 gives G2 = 1.5599,
        p = 0.45842, and T4 gives an exact binomial p = 0.83408 WITH THE SIGN
        REVERSED against BATCH-004's p = 0.023. The exact Clopper-Pearson 95%
        interval on the R2:R1 rate ratio from 47 against 44 is [0.606, 1.443],
        and BATCH-004's 1.86 lies OUTSIDE it.
      status: >-
        CONFIRMED by the red team, which recomputed all four statistics from the
        nine counts in its own code and matched the producer to three decimals.
      what_it_does_not_establish: >-
        The 80%-power detectable ratio of about 1.73 is parameterisation-
        dependent: under a sum-preserving alternative it is about 1.85, and power
        at 1.73 under that parameterisation is 0.693. The companion figure 0.816
        is unconditional and correct.
    - id: OBS-B5-3
      statement: >-
        THE RED TEAM REFUTED THIS BATCH'S OWN HEADLINE GAP CLAIM. The snapshot
        receipt asserted that "NO ARM IN THIS CAMPAIGN HAS EVER MEASURED THE PRP
        NULL THAT EVERY EXCESS FACTOR DIVIDES BY". That is FALSE AS WRITTEN, and
        the producer's own wording -- which said only that the null is "analytic
        and unverified by measurement in this campaign" -- had been compressed
        into a stronger claim by the Coordinator.
      status: CONFIRMED; recorded as CORR-20260803-c92db5
      what_the_record_now_shows: >-
        Eleven prior r >= 6 null arms exist, aggregate 57 observed against 58.0
        modelled (EV-AES-8b8dcf OBS-B8-6). This was the FIRST of four
        absence-claim failures in two days, and it was found by an adversarial
        reader rather than by any reproduction check.
    - id: OBS-B5-4
      statement: >-
        THE RED TEAM'S FIBER ATTACK ON THE DIVISIBILITY ENDPOINT SUCCEEDED.
        Holding the claimed observation fixed and varying the object: BATCH-001's
        seven aes_r5 arms and BATCH-002's two M0 r=5 arms sit on the
        "residue forced" side with the observation absent, while BATCH-005's
        r6_M1 and r6_CTRL sit on the "residue free" side with the same
        observation absent. PREIMAGES ON BOTH SIDES. The missing separator is
        whatever distinguishes r=5 from r=6 in the no-divisibility regime, and
        the campaign has no candidate for it.
      status: CONFIRMED by the red team; not disputed
    - id: OBS-B5-5
      statement: >-
        RC-8 WAS MISPRICED BY ABOUT 28x IN THIS BATCH'S COST MODEL, BLOCKING THE
        ONE UPGRADE-CAPABLE CONTROL. Separately, the byte-width arm's binding
        constraint is MEMORY rather than CPU: the 8 GB cw=16 array means exactly
        one M1-class arm can run at a time, so the byte-width queue is serialised
        at about 2000 s per arm regardless of core count.
      status: >-
        CONFIRMED by the red team; the mispricing is recorded as
        CORR-20260803-9a67de.
    - id: OBS-B5-6
      statement: >-
        SCOPE IS NOT INFLATED IN THE PRODUCER ARTIFACTS, AND THE RED TEAM PUT
        THAT ON THE RECORD AS UNUSUAL. Both preregistrations state the toy tier,
        both name their dropped arms with what each would have settled, both state
        what no outcome could establish, and one records an inconvenient residue
        reading under a field literally named
        "recorded_because_it_is_inconvenient". The scope problems in this batch
        are in the Coordinator's compressions and in one propagated factual error,
        NOT in the measurements.
      status: CONFIRMED by the red team

  defects_carried:
    - id: D-B5-1
      statement: >-
        THE VALIDATION REPORT CARRIES NO VERDICT. Its `verdict`, `verdict_note`
        and `parser_confirmation.parsed_ok` fields read PLACEHOLDER. Archived
        unedited per the BATCH-003 precedent.
    - id: D-B5-2
      statement: >-
        THE VALIDATION REPORT DOES NOT PARSE. Its `summary_line_audit` block at
        line 528 opens as a mapping (`binding_rule:`) and continues as a sequence
        at the same indentation. The block is human-readable and unambiguous; the
        defect is mechanical. Archived unedited.
    - id: D-B5-3
      statement: >-
        THE SAME REPORT CONTAINS A PROSE CLAIM THAT A PARSER WAS RUN ON IT AND
        THAT IT PARSED TWICE. It does not parse. The claim was almost certainly
        true when written and false after a later edit, which is why a
        self-reported parse check inside an artifact cannot substitute for
        parsing it. This is the origin of the rule, adopted from BATCH-008
        onward, that the ARCHIVE task parses every staged file itself, whole-file.
    - id: D-B5-4
      statement: >-
        BOTH REVIEW REPORTS WERE SUPPRESSED FROM VERSION CONTROL BY A
        DIRECTORY-FORM .gitignore ENTRY and existed only in an ephemeral
        container filesystem until CORR-20260803-ba2eb7 caught it. 109 KB of
        independent review, invisible to `git status`, which reported a clean
        tree throughout.
    - id: D-B5-5
      statement: >-
        Undeclared seed departure and the DR-3 tail-probability errors carried
        forward from the prior batch remain on the record; neither changes a
        verdict here.

  boundaries:
    - >-
      One key, one base, one projection index j0=0, one machine. Nothing here is
      a statement about full-round or deployed AES.
    - >-
      OBS-B5-1 establishes the byte-width decay at ONE matrix and ONE j0. Both
      unmeasured directions -- other matrices M0, other j0 -- are named and unrun.
    - >-
      Session and implementation independence only. NO MODEL INDEPENDENCE under
      standing basis 0137a051eb5828789eb267fa83c8278086578d4c; nothing here
      counts toward a closure quorum.
    - >-
      The red team re-executed the producers' STATISTICS from their recorded
      counts in its own code; it re-ran no counting engine and no yoyo arm. Its
      implementation independence is partial and it says so.

  unresolved_confounds:
    - The separator distinguishing r=5 from r=6 in the no-divisibility regime is unidentified (OBS-B5-4).
    - The validator's checks of the byte-width arm carry no verdict, so that arm has one complete adversarial review and no completed validation.

  reviewed_by:
