evidence:
  id: EV-MONO-91bca2
  hypothesis_id: H-MONO-d4c511
  experiment_id: EXP-MONO-4e6faa
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  recorded_at: '2026-09-04'
  recorded_by: coordinator

  run_ids: [RUN-MONO-4e6faa-1]
  type: targeted_stress_test_h_minus_nonzero_curve_plus_independent_review
  direction: supports_d3_h_minus_dependence_partially_refutes_e4_only_rival
  strength: >-
    exact_zero_tolerance_match_independently_reproduced_from_scratch_but_algebraically_incapable_of_testing_the_claimed_linear_functional_form_at_this_minimal_h_minus_value
  claim_tier: toy
  proof_status: empirical_only
  proof_status_note: >-
    A single exhaustive-census run at one curve, one prime, compared
    exactly (zero tolerance) against a pre-registered closed-form
    prediction. Not a derivation or proof of the closed form in general;
    a toy-scale empirical test of one instance of it, independently
    reproduced by the Validator's own from-scratch computation.
  proof_refs:
    - experiments/EXP-MONO-4e6faa/reviews/validator/validation-report.yaml (independent J1/J2 from-scratch reproduction and blind rederivation)
    - experiments/EXP-MONO-4e6faa/reviews/red-team/red-team-report.yaml (J3 code audit; J4 scope-limitation finding and h_-=3 follow-up candidate)

  summary: >-
    On an h_->0 curve found by exhaustive search (p=101, A=1, B=0; Z=3,
    n_+=48, n_-=50, h_+=0, h_-=1), IDEA-20260904-4f614a's exact closed form
    (D3) for the m=4 symmetric-base distinct-split census matches an
    exhaustive census (152,096 base points) EXACTLY: R1=R2=R3=0 for #1^4,
    #2+1+1 and #2+2. This is independently reproduced from scratch by the
    Validator (own group-law code for the curve/twist arithmetic, own
    driver for the census, own recomputation of the prediction) with zero
    disagreement against the Executor's reported values. The rival "the
    invariant is #E[4] alone" hypothesis is decisively refuted on this same
    curve (its own prediction is off by 48 on #1^4 and -144 on #2+1+1).
    Red Team independently confirms the code is correct but identifies a
    real, disclosed limit on what this ONE point can support: h_-=1 is the
    minimal positive value h_- can take, and 1^k=1 for any k, so this run
    cannot distinguish the CLAIMED LINEAR form of the h_- term from other
    functional forms that would agree at h_-=1 (e.g. a quadratic or a step
    function). Red Team also found, for free, that h_-=3 curves are common
    (200 of 10,100 non-singular (A,B) pairs at p=101 alone) -- a concrete,
    cheap next step that would discriminate linear from quadratic scaling.

  claim_tier: toy
  what_this_supports: >-
    (1) The D3 closed form's own h_- term is not identically wrong: its
    zero-free-parameter prediction survives exact contact with a curve it
    was never fit to, on the specific count values at h_-=1. (2) The named
    rival hypothesis "the invariant is #E[4] alone, twist-independent" is
    FALSIFIED on this curve, specifically and concretely -- this is real
    discriminating evidence between the two competing explanations named
    in IDEA-20260904-4f614a's own text, not merely a fit. (3) This is the
    FIRST evidence-eligible (approved specification, executor run,
    independent Validator+Red-Team review) confirmation of the D3 formula
    at all: the two "witness curve" integer triples IDEA-20260904-4f614a
    cites as prior context are, as that idea record and H-MONO-d4c511
    themselves already disclosed, a non-evidence-eligible probe from
    EXP-MONO-0e6e8f's own red-team report ("REVIEW-SIDE PROBE ONLY... not
    evidence-eligible, MUST be re-run under an approved specification
    before it is cited") -- the Validator's own proves-too-much control
    independently re-derived both of those curves' parameters from scratch
    and confirmed the same D3 formula reproduces them too, but this
    evidence record does not elevate their status; they remain probe-level
    context, not archived evidence, and this run is the first archived
    evidence for D3 under this program's own rules.

  what_this_does_not_support: >-
    Does NOT close IDEA-20260904-4f614a's own named "retrodiction bias"
    gap in full. Per Red Team's J4 finding: an exact match at h_-=1 is
    algebraically incapable of distinguishing the claimed linear
    dependence (D contains a term h_- * n_+) from any other functional
    form f(h_-) with f(1) = 1 (e.g. h_-^2 * n_+, a step function, etc.),
    because all such forms agree at h_-=1. This run therefore supports
    "the D-term genuinely depends on h_- (not just on h_+ alone)" and
    "the invariant is (#E[4], #E^d[4]), not #E[4] alone" strongly, but
    supports "the h_- dependence is specifically LINEAR" only weakly (the
    same weight one data point always carries for a one-parameter family
    passing through it). Does not test the non-split (Z<3) strata. Does
    not make any relation-rate, cost, exponent, or cryptographic-scale
    claim. Does not re-scope H-MONO-93bc4d's own already-closed
    collision-rate formula (named but explicitly deferred, per
    H-MONO-d4c511's own claim_boundary).

  independent_review:
    validator:
      report: experiments/EXP-MONO-4e6faa/reviews/validator/validation-report.yaml
      verdict: >-
        J1 (curve/twist construction, independent code): holds, all 9
        facts confirmed from scratch. J2 (blind Stage-1 reclassification +
        Stage-2 recomputation): holds, full exhaustive 152,096-point census
        independently reproduced, R1=R2=R3=0 confirmed from the
        Validator's own numbers. Proves-too-much control: holds, with the
        non-evidence-eligible-probe caveat above. Zero disagreement found
        against the Executor's reported values across 20+ independently
        derived numbers. sha256 reuse-binding and certificate
        classification both independently confirmed correct.
    red_team:
      report: experiments/EXP-MONO-4e6faa/reviews/red-team/red-team-report.yaml
      verdict: >-
        J3 (new resultant cross-check code): the code is genuinely
        non-tautological as claimed (embedding degree-0 ring elements
        provably never triggers RC.F3's reduction rule), but it is WEAK --
        it re-derives from the same upstream S3 elimination table that
        RC.qe_from_sym already reads, so it cannot catch an error in that
        shared upstream derivation, and it samples only 0.02% of the
        stratum. It is not hollow, but it is largely redundant with an
        already-passed, stronger check from EXP-MONO-815525's own review
        round, and should not be over-cited as independent assurance
        beyond what it actually is. J4 (minimal h_- scope check): PARTIAL
        closure of the retrodiction-bias gap, per the summary above.
        Discretionary check: h_->0 curves are common (825/1650 = 50% of
        Z=3 curves at p=101), so this was not a hard-won stress test in
        the sense of requiring a long search -- disclosed as a correction
        to any impression that finding one was itself informative; the
        INFORMATIVE part is the exact match, not the search difficulty.
        Found, unprompted, that 200 of the already-enumerated (A,B) pairs
        at p=101 have h_-=3, h_+=0 (e.g. A=1, B=33) -- a concrete, free
        candidate for a follow-up discriminating linear vs. non-linear
        h_- dependence.
    independent_session: true
    blindness_confirmed: >-
      Both reviewers launched as fresh subagents in one dispatch message,
      unable to see each other's output. Validator confirmed it could not
      have read the Red Team directory (did not exist yet at the time).
      Red Team confirms it read the Validator's report only AFTER forming
      and recording its own J3/J4 conclusions.

  metrics:
