evidence:
  id: EV-FALSIFY-4e9c78
  hypothesis_id: H-FALSIFY-40538b
  question_id: RQ-FALSIFY-a2c501
  experiment_ids: [EXP-FALSIFY-d770c1]
  run_ids: [RUN-FALSIFY-d770c1-006]
  findings_under_test: [KN-FIND-a8990a, KN-FIND-a1f3c2]
  type: empirical
  direction: supports
  direction_note: >-
    Supports both findings and correspondingly contradicts prediction P-1 of the
    hypothesis that filed this experiment, for the fifth time.
  strength: moderate
  claim_tier: toy
  proof_status: empirical_only
  proof_refs:
    - experiments/EXP-FALSIFY-d770c1/runs/RUN-FALSIFY-d770c1-006/raw-result.json
    - experiments/EXP-FALSIFY-d770c1/runs/RUN-FALSIFY-d770c1-006/manifest.yaml
    - experiments/EXP-FALSIFY-d770c1/falsify/run_families.py
  recorded_at: '2026-08-08'

  observations:
    - id: O-1
      text: >-
        F-1b WAS RE-SCOPED BEFORE IT WAS RUN, TWICE. Its original motivation --
        an unrepaired quantifier gap in KN-FIND-a1f3c2's proof sketch -- was
        voided by CORR-20260808-3d4031. Then a draft of this probe was about to
        assert that neither KN-FIND-a8990a's run nor RUN-FALSIFY-d770c1-001 had
        tested special families. That was checked before being written down and
        it is FALSE: a8990a's RUN-SMON-e5cbe6-001 enumerates 20 curves labelled
        12 generic-j, 1 "j=0, p=1 mod 3", 1 "j=0, p=2 mod 3", 1 "j=1728,
        p=1 mod 4", 1 "j=1728, p=3 mod 4 (supersingular)" and 4 "full rational
        2-torsion". That is a deliberate family design. F-1b as pre-registered is
        substantially SUBSUMED by work already in the corpus.
    - id: O-2
      text: >-
        WHAT WAS ACTUALLY UNCOVERED, and is the only new coverage here:
        ANOMALOUS curves, #E(F_p) = p. No such label appears in a8990a's run. An
        exhaustive (a,b) scan over p in 11..47 found 339 of them, alongside 850
        supersingular, 1578 full-2-torsion, 300 j=0, 300 j=1728 and 7380
        generic-j.
    - id: O-3
      text: >-
        ZERO VIOLATIONS ON EVERY FAMILY, at m=4 and m=5. ANOMALOUS: 0 in 190
        usable specialisations at m=4 and 0 in 91 at m=5. supersingular: 0 in 151
        and 0 in 43. j=0: 0 in 96 and 0 in 40. j=1728: 0 in 74 and 0 in 26.
        full-2-torsion: 0 in 61 and 0 in 20. generic-j: 0 in 99 and 0 in 43.
        Every observed shape was [2,2] or [1,1,1,1] at m=4, and [2,2,2,2] or
        [1]*8 at m=5 -- the admissible dichotomy, on every family.
    - id: O-4
      text: >-
        THE ANOMALOUS RESULT IS THE INTERESTING ONE, AND IT IS NEGATIVE.
        Anomalous curves are precisely where prime-field ECDLP is completely
        broken, by the Smart / Satoh-Araki / Semaev lift attack in linear time.
        If any family were going to carry an exceptional monodromy locus -- some
        structural signature visible in the summation cover -- these were the
        obvious candidates. Their summation-cover factorisation behaviour is
        indistinguishable from generic curves. The monodromy therefore carries NO
        signal about the one prime-field family whose ECDLP is known to be easy.
        That closes an obvious place to look, which is worth recording precisely
        because it is where someone would look next.
    - id: O-5
      text: >-
        INSTRUMENT UNCHANGED, CONTROLS NOT RE-RUN. This uses the same
        admissible-shape code path as RUN-FALSIFY-d770c1-001, whose null object
        (0/1340 and 0/932 false violations) and positive control (207/0 and
        101/0) established it. Only the curve selection differs. Recorded
        explicitly so that "controls passed" is not claimed for a run that did
        not execute them.

  interpretation: >-
    The C_2^(m-2) dichotomy survives on every special family reachable at toy
    scale, including one the corpus had not tested. Combined with
    RUN-FALSIFY-d770c1-001 and a8990a's own 241,643 specialisations, the
    finite-scale consequences of Theorem A are now checked by two independent
    implementations across six curve families.

  what_this_does_not_establish: >-
    Sampling within families, not exhaustive over them: 8 to 14 curves per family
    with 18 parameter tuples each, so a rare exceptional locus inside a family
    could still be missed. m >= 6 remains untested and is the only structural
    direction left at this scale. And this adds nothing to the PROOF: Theorem A
    is a derivation whose argument no independent reviewer has read, which is the
    gap a8990a names for itself and which no amount of finite-scale agreement
    closes. The anomalous negative in O-4 is scoped to the monodromy of the
    summation cover; it says nothing about anomalous curves generally.

  dominated_by: not_applicable_methodological
  sota_delta:
    time_exponent: not_applicable
    note: >-
      No algorithmic claim. The one forward-looking content is the negative in
      O-4: the summation-cover monodromy does not distinguish anomalous curves.

  knowledge_promotion: not_warranted
  knowledge_promotion_reason: >-
    A non-refutation adds no mathematical content, and F-1b turned out to be
    largely a re-run of coverage the corpus already had. The anomalous negative
    is a single toy-scale observation and belongs in evidence until someone has a
    reason to build on it.

  successor_task: >-
    F-1b is now CLOSED as pre-registered. The remaining direction is m >= 6,
    where the cover has degree 16 and the independence structure has most to
    strain against. That is a real test and is not run here. The more valuable
    successor remains the one a8990a names: a reviewer reading Theorem A and
    Lemma 3.2, not further finite-scale checks.

  scope_limits: >-
    p in 11..47; m in {4,5}; 8-14 curves per family; 18 parameter tuples per
    curve; families identified by exhaustive (a,b) scan at each prime.

  independent_review_required: false
  independent_review_note: >-
    Contradicts nothing and asserts no new claim; a non-refutation reported as
    such.

  authority_note: >-
    Evidence only. No hypothesis status changed, no finding edited or
    superseded (AGENTS.md rule 1).
