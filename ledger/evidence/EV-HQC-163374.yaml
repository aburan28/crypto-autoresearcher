  observations:
  - 'THE V3 ARM REPLACED V2''S TWO FIXED WORST-CASE TEMPLATES WITH A GENUINELY HETEROGENEOUS ENSEMBLE.
    TASK-20260806-e1700f built each planted block via rejection sampling: fresh Bernoulli(0.35) 128-bit
    content, redrawn until its true decode (via the real decode_blocks) matches the block position''s
    intended fail/succeed label. The Validator independently confirmed heterogeneity with a fresh,
    independently-seeded 5,000-block sample (5,000/5,000 distinct). Main run: T = 500,000, all 17 tested
    cells MATCH the closed-form planted value. Separate detection-rate run: boundary-shift flip rate
    measured four independent ways, clustering at ~10.47 percent unconditional (Wilson 95 percent CI
    [10.42,10.51], T = 2,000,000) and ~20.12 percent margin-conditioned, using 946.3 of 1800 authorized
    core-seconds.'
  - 'BOTH INDEPENDENT REVIEWERS CONVERGED, WITHOUT CONFERRING, ON A CORRECTION TO THE EXECUTOR''S OWN
    FRAMING: the apparent close agreement between V3''s ~10.5 percent and the V2-batch Red Team''s ~8.8
    percent baseline (EV-HQC-9a30d3) is NOT independent confirmation of one portable "natural detection
    rate." The Validator first decomposed the rate by target-position label (fail-labeled content flips
    ~21 percent of the time, margin mean ~4.3; succeed-labeled content flips ~5.6 percent, margin mean
    ~12.4) and showed reweighting these two conditional rates by V3''s own planted label mix (q = 9/28,
    about 32.1 percent fail) reproduces V3''s ~10.5 percent, while reweighting the SAME two rates by the
    natural Bernoulli(0.35) population''s own decode-label mix (about 21.1 percent fail) reproduces the
    Red Team''s ~8.8 percent almost exactly. The Red Team then independently confirmed and completed
    this: a fresh 4,000,000-sample stratified measurement reproduces every one of V3''s reported figures
    to within 0.02-0.03 percentage points using only the one already-known constant q. The ~1.19x gap
    between the two headline figures is FULLY EXPLAINED by this one arithmetic relationship, not a
    residual finding -- the two numbers are exactly-related toy quantities differing by a fixed design
    constant, not two independent measurements of the same underlying quantity.'
  - 'THE RED TEAM DIRECTLY ANSWERED THE REQUIRED CEILING RECKONING (DEC-20260806-cf5102''s next_actions):
    YES, THE CONTROL-ARM LINEAGE HAS REACHED ITS CEILING. V3''s own result is offered as the sharpest
    evidence for this: its "new" headline number is almost entirely arithmetically recoverable from what
    the V2-batch review already established, rather than a genuinely new independent data point. The Red
    Team explicitly recommends against dispatching a V4 of the same shape and names the next informative
    step: defect injection directly into the real cryptographic sampler path (CTRStream,
    fixed_weight_support, ring_mul_sparse/dense) rather than another planted-content construction that
    substitutes for it.'
  - Both reviewers independently ADMIT the artifacts as honest, reproducible, and budget-compliant, with
    no fabrication found across three generations of scrutiny (V1, V2, V3). Both independently judge the
    disposition as PARTIALLY CLOSES / PARTIALLY CLOSED, "more than V2 but less than the run package''s own
    framing suggests" (Validator) and "by less than the framing suggests" (Red Team) -- convergent
    language, reached independently.
  inference: 'Across three control-arm generations, this campaign has established a real, if narrow,
    fact: at least one construction demonstrates that a boundary-index-shift defect CAN be detected by
    the measurement pipeline''s own estimator statistic (V2), and a calibrated instrument now exists that
    measures roughly how OFTEN such a defect would be expressed as a flip under one specific toy planted-
    label mixture (V3) -- though that figure is a mixture-dependent, not population-invariant, quantity,
    and the V3-vs-V2-Red-Team "agreement" that looked like independent confirmation is a compositional
    artifact of a known constant, not new corroborating evidence. What remains completely untouched
    across all three generations is OPEN-6''s actual object of concern: whether the REAL cryptographic
    sampler (which none of V1, V2, or V3 ever runs) harbors a subtle defect that would produce PS-R3''s
    -244.1-to--32.4 null-SD anti-correlation signal (EV-HQC-b71230) as an artifact. Both independent
    reviewers, unprompted to agree with each other, conclude that further iteration on planted-content
    control arms has diminishing returns relative to testing the real sampler directly.'
  boundaries:
  - 'Toy. Two authorized runs (main MATCH/MISMATCH check, detection-rate experiment), one seed family, no
    replication. This is an instrument check, not a measurement of HQC.'
  - This evidence record does not reopen, revise, or supersede EV-HQC-b71230, EV-HQC-db1fd9, or
    EV-HQC-9a30d3, all of which stand exactly as archived.
  - The measured ~10.5 percent / ~20.1 percent detection rates are correctly computed for the specific
    population V3 actually drew (its own planted label mixture); they are not population-invariant
    "natural" rates and should not be cited as such without the q-dependence stated.
  - The block-level detection rate measured here is not the same quantity as the estimator-level
    (log2_Ahat_k) response to an injected defect; V2''s injection experiment measured the latter (at
    overwhelming margin, for its worst-case templates), V3 measured only the former.
  - The cryptographic (T)-sampler (CTRStream, fixed_weight_support, ring arithmetic) remains entirely
    unexercised across all three control-arm generations to date.
  - H-HQC-18d1b4 is untouched by this record in either direction; it remains PROPOSED.
  unresolved_confounds:
  - 'OPEN-6 IS PARTIALLY CLOSED, NOT CLOSED, AND THE CONTROL-ARM APPROACH OF THIS SHAPE IS ASSESSED BY
    BOTH INDEPENDENT REVIEWERS AS HAVING REACHED ITS CEILING. The named next step is a change in kind, not
    another iteration: inject a defect directly into the real cryptographic sampler path (CTRStream,
    fixed_weight_support, ring_mul_sparse/dense in stage_a.py) and measure whether the resulting DFR-
    measurement pipeline detects it, rather than constructing yet another planted-content proxy for that
    path.'
  - "The block-level-vs-estimator-level gap identified above is itself unresolved: no arm has yet measured
    what fraction of block-level flips (of the kind V3 quantifies) propagate to a detectable
    log2_Ahat_k-level MISMATCH under REALISTIC (non-worst-case) content, as opposed to V2's worst-case
    demonstration that flips CAN propagate."
  reviewed_by: coordinator
