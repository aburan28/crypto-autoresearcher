    - kind: decomposition
      count: 68
      verified: true
      note: >-
        68 of the 748 committed runs carry metrics.decomposition_found true,
        metrics.is_trivial_ideal false and an independently re-verified
        certificate of kind "decomposition". These are enumerated exactly in
        run_ids below. They occur ONLY at field_bits 8, 12 and 16.
    - kind: discrete_log
      count: 34
