    independently reviewed twice (TASK-20260727-004 / RT-20260727-001 and
    TASK-20260727-012 / RT-20260727-002), and returned REVISE both times.
    Execution (TASK-20260727-005) was never authorized and never occurred.
    No SC1-SC4 or F1-F4 outcome exists here as a run result, because no run
    exists. Falsifier F2 was declared unreachable at N >= 1e9 by the v1-to-v2
    amendment BEFORE any execution, and RT-20260727-002 confirmed that
    declaration while restating it as conditional on heuristic H3 rather than
    true "by construction".

