  # ------------------------------------------------------- observations
  observations:
    - id: OBS-1
      title: The zero-decomposition statement is false as an absolute claim and true in the decision-bearing regime
      detail: >-
        The 748 committed EXP-IC-001 run records contain 68 runs with
        metrics.decomposition_found true, metrics.is_trivial_ideal false and a
        verified certificate of kind "decomposition"; 612 runs with
        is_trivial_ideal true; and a certificate census of {none: 646,
        decomposition: 68, discrete_log: 34}. Mode census {fixed: 340,
        naive: 340, fixed_precompute: 34, absent: 34}. Decompositions occur
        ONLY at field_bits 8 (56 of 60 runs), 12 (10 of 60) and 16 (2 of 60).
        Across all 500 runs at field_bits >= 20 there are ZERO decompositions,
        and zero across the 68 runs that carry no field_bits. Therefore the
        statement "all Groebner solves on trivial ideals (no decompositions)"
        recorded in EV-IC-001 boundaries, echoed in DEC-20260726-005
        limitations and in EXP-IC-001/analysis.md, is FALSE AS WRITTEN and is
        TRUE exactly at field_bits >= 20 - which contains every instance with
        N >= 1e9 and all four instances DEC-20260726-005 rests on (36-bit
        seeds 2, 5, 10, 11). The confound survives intact across the entire
        decision-bearing regime; only the absolute framing was wrong. Superseded
        by CORR-20260727-005.
    - id: OBS-2
      title: Per-instance decomposition table
      fixed_mode:
        - {field_bits: 8,  seed: 1, N: 23,   decompositions_of_10: 9}
        - {field_bits: 8,  seed: 2, N: 41,   decompositions_of_10: 9}
        - {field_bits: 8,  seed: 3, N: 5,    decompositions_of_10: 10}
        - {field_bits: 12, seed: 1, N: 31,   decompositions_of_10: 1}
        - {field_bits: 12, seed: 2, N: 37,   decompositions_of_10: 2}
        - {field_bits: 12, seed: 3, N: 2377, decompositions_of_10: 2}
        - {field_bits: 16, seed: 3, N: 479,  decompositions_of_10: 1}
        - {all_other_27_instances: 0}
      naive_mode: >-
        Identical at every instance (9, 9, 10, 1, 2, 2, 1; 0 elsewhere),
        summing to 34. 34 fixed + 34 naive = 68.
      note: >-
        The two exceptional targets at 8-bit are t0 at (8, seed 1) and t2 at
        (8, seed 2); every other 8-bit target decomposed in both modes.
    - id: OBS-3
      title: The descent cost that DEC-20260726-005 compared against sqrt(N) is the cost of one FAILED attempt in the decision-bearing regime
      detail: >-
        At every instance with N >= 1e9 the committed record contains zero
        successful decompositions. T_desc_gops as recorded is therefore the
        cost of one decomposition ATTEMPT, not of one successful descent.
        H-IC-001's own cost model charges the same operation two different
        ways: WITH yield inside S_rel = (N/B) * T_desc, and WITHOUT yield
        inside the per-target term K*(T_desc + T_verify). The two are
        inconsistent, and in the regime where the decision lives the
        per-target term is the wrong one. This is a derivation from
        H-IC-001's own stated assumptions and needs no new run.
    - id: OBS-4
      title: The crossover fails from committed data UNCHARGED, against the correct multi-target baselines
      exhaustive_table_baseline: >-
        Precomputing all N multiples of P costs N-1 group additions with N
        stored elements and 0 group operations per target. EXP-IC-001 charges
        S_rel = (N/B) * T_desc_gops, so S_rel/N = T_desc_gops/B, which is
        INDEPENDENT of N. At 36-bit seed 2 this is 32021/14 = 2287. Over all
        34 instances it ranges 1908 to 4142 (single derivation, RT-20260727-002).
        The index-calculus precomputation therefore exceeds exhaustive
        enumeration of the entire group by roughly three orders of magnitude
        at every instance, and the per-target cost is about 32,023 group
        operations against O(1).
      preprocessing_frontier_baseline: >-
        S*T^2 = Omega~(N) (KN-LIT-013, Corrigan-Gibbs and Kogan, EUROCRYPT
        2018; restated in KN-TECH-005), balanced at S = T = N^(1/3): online
        cost N^(1/3) per target with N^(1/3) advice elements. Substituting
        N^(1/3) for sqrt(N) in K* = ceil((S_rel + S_LA)/(baseline - T_desc -
        T_verify)) gives a NEGATIVE denominator, i.e. k_star_vs_frontier =
        infinity, at ALL 34 instances - not merely the four headline ones -
        because max N^(1/3) = 3232 while min T_attempt = 21374. This holds
        UNCHARGED, with T_desc frozen at EXP-IC-001's own recorded value, with
        no yield model and no new run.
      exact_integer_cube_roots_at_the_four_headline_instances:
        - {instance: "36-bit seed 2",  N: 33766959953, n_cbrt: 3232, T_desc_gops: 32021, per_target_ratio: 9.91}
        - {instance: "36-bit seed 5",  N: 11875729387, n_cbrt: 2281, T_desc_gops: 30110, per_target_ratio: 13.20}
        - {instance: "36-bit seed 10", N: 3480617339,  n_cbrt: 1515, T_desc_gops: 35014, per_target_ratio: 23.11}
        - {instance: "36-bit seed 11", N: 17366619409, n_cbrt: 2589, T_desc_gops: 33191, per_target_ratio: 12.82}
      arithmetic_disputes_adjudicated_in_this_session: >-
        Two disagreements existed in the prior record and are settled here by
        exact integer multiplication, not by preference. (a) 3232 versus 3240
        at 36-bit seed 2: 3232^3 = 33,760,903,168 <= N = 33,766,959,953 <
        3233^3 = 33,792,250,337, while 3240^3 = 34,012,224,000 > N. RT-20260727-001
        and RT-20260727-002 are correct with 3232; the orchestrator's 3240
        came from rounding EXP-IC-001/analysis.md's "~3.4e10" and is WRONG.
        (b) 2589 versus 2590 at 36-bit seed 11: 2589^3 = 17,353,862,469 <= N =
        17,366,619,409 < 2590^3 = 17,373,979,000. RT-20260727-002's 2589 is
        correct; RT-20260727-001's 2590 is an off-by-one. Neither correction
        changes any conclusion; both are recorded because an unadjudicated
        three-line integer computation left open in a ledger record is an
        unmade computation, not honest uncertainty.
      honest_caveat: >-
        The Corrigan-Gibbs and Kogan offline phase is unbounded, so the
        frontier comparison is an ONLINE-cost and advice-size comparison, not
        an offline-time comparison. The exhaustive-table baseline has a fully
        explicit bounded offline cost and already suffices on its own. Both
        are closed-form comparisons on committed numbers, stated as
        derivation and never as measurement.
    - id: OBS-5
      title: The EXP-IC-001 v3 success criterion is near-tautological, and it was revised after the v2 criterion was observed to fail
      detail: >-
        From EXP-IC-001/specification.yaml metrics.crossover_K_star, K* is
        finite exactly when T_desc_gops + T_verify < sqrt(N) with T_verify
        frozen at 2 group operations. The v3 criterion conditions on
        sqrt(N) > T_desc_gops and then reports the rate at which K* is finite.
        The conditioning event and the outcome event differ by a window of
        TWO group operations against a T_desc_gops of roughly 32,000. The
        narrowest actual margin sqrt(N) - T_desc_gops across the four
        conditioning-set members is 23,982 (36-bit seed 10), about 1.2e4 times
        wider than the failure window. The reported "4/4 = 100% >> 2/3
        threshold" in EV-IC-001 is therefore an arithmetic consequence of its
        own conditioning, not a measurement.
      compounding_history: >-
        EXP-IC-001/analysis.md lines 51-54 record that the v2 criterion was
        NOT met and "The result is inconclusive". amendments/v2_to_v3.yaml
        then revised the criterion, citing the observed 4/13 and 4/4 numbers
        in its own reason field, and recorded confirmatory_status: preserved.
        Under docs/task-lifecycle.md section 5 an outcome-driven revision is
        exploratory and cannot be evaluated against the original confirmatory
        criterion. The defensible status is exploratory_only. Superseded by
        CORR-20260727-006.
      what_survives_as_genuine_measurement: >-
        Two things, and this record does not dispute either: (i) the magnitude
        of T_desc_gops, about 3.0e4 to 3.6e4 across all 34 instances, and
        (ii) that 4 of 13 random 36-bit curves have isqrt(N) above that
        constant. Everything downstream of the conditioning is arithmetic.
    - id: OBS-6
      title: The reachable-set bound is 392, tight and attained; H3 holds empirically; H1 is false as stated; H2 deviates anti-conservatively
      detail: >-
        harness/semaev.py::_find_decomposition iterates unordered index pairs
        with repetition (C(14,2) + 14 = 105) and tests four sign combinations
        per pair; on the 14 diagonal pairs the four combinations give at most
        2 distinct non-identity points, so the tight maximum is
        4*C(14,2) + 2*14 = 392, not the 420 the EXP-IC-002 v1 specification
        used. RT-20260727-002 measured |S| exactly at all 34 instances: 392 is
        attained at 24 of them and never exceeded; max |S| over 8-bit
        instances is 191. The 420 bound errs in the conservative direction
        (it overstates yield by at most 7.1%).
      heuristics:
        - id: H1
          statement: targets are effectively uniform in <P>
          status: FALSE_AS_STATED
          evidence: >-
            EXP-IC-001 derives targets by the deterministic stride
            k = ((idx+1)*stride) mod (n-1) + 1. At (8, seed 3) with N = 5 the
            ten committed target_k values are {1, 3} repeated - 2 distinct
            targets, not 10. Every other instance has 10 distinct target_k.
        - id: H2
          statement: S behaves like a uniform random subset of E when intersected with <P>
          status: DEVIATES_ANTI_CONSERVATIVELY_AT_2_OF_4_HEADLINE_INSTANCES
          evidence: >-
            Single derivation (RT-20260727-002). Measured |S intersect <P>|
            against the uniform null |S|/h with cofactors h = 2, 4, 16, 3:
            200 vs 196.0 (z = +0.40), 132 vs 98.0 (z = +3.97), 24 vs 24.5
            (z = -0.10), 158 vs 130.7 (z = +2.93). S is a structured,
            negation-closed signed sumset, not a uniform random subset. The
            deviation is ANTI-conservative for this record's direction - it
            makes the true yield LARGER than the counting model predicts, and
            so favours H-IC-001 - but its magnitude (1.2x-1.4x) is nowhere
            near the roughly seven orders of magnitude at stake.
        - id: H3
          statement: the s3_eval pre-filter is complete (it cannot reject a true hit)
          status: PROVABLE_AND_EMPIRICALLY_CLEAN_BUT_NEVER_VALIDATED_INSIDE_A_RUN
          evidence: >-
            The derivation is correct: if s1*A_i + s2*A_j = R then
            s1*A_i + s2*A_j + (-R) = O is a sum of three affine points with
            x-coordinates v_i, v_j, x(R), so S3(v_i, v_j, x(R)) vanishes.
            RT-20260727-002 additionally ran the check read-only at ALL 34
            instances: the filter rejected 0 reachable points at 0 instances.
            That probe wrote no repository file and produced no run record; it
            is a red-team derivation, not archived evidence. CTRL-I, which
            would have validated H3 inside a run, was never executed because
            EXP-IC-002 was never executed.
        - id: H4
          statement: >-
            the EXP-IC-001 calibration factor (rho total_group_operations /
            wall_seconds) faithfully converts Groebner wall time into
            group-operation equivalents
          status: UNNUMBERED_IN_THE_SOURCE_CONTRACT_AND_NEVER_TESTED
          evidence: >-
            The committed calibrations span 554,930 to 1,477,926 ops/s, a
            2.66x spread, which alone moves the UNCHARGED crossover threshold
            in N by about 7.1x. Neither EXP-IC-001 nor EXP-IC-002 tests this
            sensitivity. It is the assumption DEC-20260726-005's crossover
            rests on most directly.
    - id: OBS-7
      title: EXP-IC-002 would not have changed the conclusion, and both independent reviews said so
      detail: >-
        TASK-20260727-004 (RT-20260727-001) returned REVISE with five blocking
        objections, the decisive one an EXECUTION defect: as frozen, CTRL-G
        plus stopping rule 4 halt the primary arm at instance 1 of 34.
        TASK-20260727-012 (RT-20260727-002) re-reviewed the amended contract
        and also returned REVISE, with four blocking objections, and
        additionally reconstructed EVERY primary and secondary metric of the
        primary arm from committed records read-only. On the R3-repaired
        metric it found SC4 = 0.8143 < 0.90, so the design's own falsification
        criterion F3 FIRES, and SC1 clause 2 fails by 2.6% (2.0524 vs 2.0).
        What the four run arms would genuinely have added is artifact
        durability plus two integrity controls (CTRL-A membership predicate,
        CTRL-C factor-base rebuild at B'), not a new mathematical fact.
    - id: OBS-8
      title: Observations that run AGAINST this record's own direction, recorded rather than omitted
      detail: >-
        (a) The trivial-versus-non-trivial Groebner cost comparison comes out
        in H-IC-001's favour: pooled median groebner_seconds 0.040484 s over
        306 trivial solves versus 0.038775 s over 34 non-trivial solves, ratio
        0.958 (single derivation, RT-20260727-001). Non-trivial systems are if
        anything marginally FASTER at this parameterization, so EV-IC-001's
        recorded confound "T_desc on trivial ideals may not represent
        non-trivial Groebner systems" is not live at B = 14, m = 2.
        (b) H2 deviates anti-conservatively (OBS-6). (c) The 420 -> 392 bound
        error was in the conservative direction. (d) H-IC-001 never claimed a
        cryptanalytic advantage: it declares itself implementation-bound, and
        DEC-20260726-005's own next_actions already record K* at 3e8-5e8 and
        "no practical advantage at toy scale". (e) Charging yield at a fixed
        B = 14 proves the tested CONFIGURATION useless; a real
        point-decomposition index calculus balances B against N so that the
        yield term is not dominant, and nothing here bears on that.
    - id: OBS-9
      title: Completeness gap, direction favourable to this record
      detail: >-
        The tightest baseline in the actual operating regime - multi-target
        Pollard rho (van Oorschot-Wiener, J. Cryptology 12(1), 1999; Kuhn and
        Struik, SAC 2001), about c*sqrt(K*N) total for K targets - is absent
        from CTRL-E, from CTRL-E2 and from the knowledge corpus (KN-LIT-012
        and KN-TECH-006 record only the single-target distinguished-points
        form). RT-20260727-002 estimates roughly 7e5 operations at the
        committed K = 10 on 36-bit seed 2 against S_rel = 7.72e13 for the IC
        precomputation alone, and explicitly declines to assert the constant
        c. This record likewise does not assert c. The omission points AGAINST
        H-IC-001, so recording it is a completeness duty, not a correction.

  # ---------------------------------------------------------- inference
  inference: >-
    Within B = 14, m = 2, the 34 committed EXP-IC-001 toy instances (8-36 bit
    primes, N from 5 to 3.377e10), the sympy 1.14.0 Buchberger and Python
    Pollard rho stack on macOS arm64, and EXP-IC-001's own group-operation
    calibration, the support verdict DEC-20260726-005 recorded on H-IC-001
    does not survive re-analysis of its own committed inputs, for three
    independent reasons. First, its stated ground - "the revised (v3) success
    criterion is MET, 4/4" - is not a confirmatory result: the criterion was
    revised after the v2 criterion had been observed to fail, using the
    observed outcome to select the replacement, and the replacement is
    satisfied whenever no instance falls inside a two-group-operation window
    against a T_desc of roughly 32,000. Second, the per-target cost it
    compares against sqrt(N) is the cost of one decomposition ATTEMPT: at
    every instance with N >= 1e9 the committed record contains zero
    successful decompositions, and H-IC-001's own model charges that same
    operation with yield elsewhere. Third, and independently of any yield
    model, the comparison was made against a single-target baseline: against
    the exhaustive log table the IC precomputation alone costs
    S_rel/N = T_desc/B = 1.9e3-4.1e3 times more, and against the
    S*T^2 = Theta~(N) frontier at S = T = N^(1/3) the crossover K* is
    INFINITE at all 34 instances, uncharged.
    What is NOT established, and is not asserted here: that H-IC-001's literal
    prediction fails. Against the matched rho baseline that EXP-IC-001 itself
    declared, T_desc_gops < sqrt(N) at 4 of 34 instances remains arithmetically
    true on the committed numbers, and H-IC-001's own falsification condition
    ("K* = infinity for ALL tested instances where sqrt(N) > T_desc_gops") is
    NOT met. The experiment designed to replace the failed accounting with a
    measurement, EXP-IC-002, was reviewed REVISE twice and never executed, so
    no measured replacement exists. The correct disposition is therefore that
    the support verdict's basis fails while the hypothesis itself is not
    refuted within its own declared terms: weaken, not reject.
    NOTHING here is a cryptanalytic improvement, a closure, an impossibility
    result, or evidence about index calculus in general. No asymptotic
    exponent moves in either direction.

  # --------------------------------------------------------- boundaries
  boundaries:
    - >-
      CLAIM BOUNDARY. Scope: factor base B = 14, decomposition arity m = 2
      (S_3 summation polynomial), the 34 committed EXP-IC-001 toy instances on
      8-36 bit prime fields with prime subgroup orders N from 5 to
      33,766,959,953 (about 35 bits), 10 deterministic targets per instance,
      ONE solver stack (sympy 1.14.0 Buchberger versus Python Pollard rho,
      Python 3.13.1, macOS arm64), and EXP-IC-001's own wall-time-to-group-
      operation calibration. Nothing outside that scope is in evidence in
      either direction.
    - >-
      NO ASYMPTOTIC EXPONENT MOVES, in either direction, by supporting,
      weakening or rejecting H-IC-001 at this parameterization. This is a
      scope correction to one ledger claim about one toy configuration. It is
      not an ECDLP result, not a cryptanalytic improvement, not a closure and
      not an impossibility result. The controlling references for what is
      actually possible in this setting remain S*T^2 = Omega~(N) (KN-LIT-013,
      KN-TECH-005) and the Shoup generic bound, neither of which is moved.
    - >-
      Not target-class in either direction under the governing rule quoted in
      goal integrity note INT-BATCH006-002. docs/target-result-profile.md does
      not exist in this tree and is NOT cited as present.
    - >-
      This record contains no new measurement. It re-analyzes committed run
      records. It creates no run, no timing and no certificate. Where a
      quantity was derived by a single party it is flagged single_derivation
      in replication_map and is not load-bearing.
    - >-
      A finite or infinite K* here says nothing about whether multi-target
      index-calculus amortization is possible with a properly sized factor
      base, at other (B, m), with other solvers, over binary or extension
      fields, or at any deployed parameter size.
    - >-
      The claim tier is toy and may not be raised by any downstream citation
      of this record.

  # ------------------------------------------------- unresolved confounds
  unresolved_confounds:
    - >-
      EXP-IC-002 was never executed, so the yield-charged descent cost was
      never MEASURED inside a run wrapper with certificates. Everything in
      OBS-4 and OBS-6 is derivation over committed records, re-derived by
      independent parties but not carried by an immutable run package of its
      own.
    - >-
      Heuristic H3 (s3_eval filter completeness) is proved on paper and clean
      in a read-only probe at all 34 instances, but has never been validated
      inside a run. If it were false, the 68/748 census and the per-instance
      table would be measuring the filter rather than the reachable set, and
      the census correction would inherit that. Cost to close: one assertion
      inside an enumeration loop the primary arm already runs.
    - >-
      Heuristic H4 (the wall-time-to-group-operation calibration) is untested.
      Its committed 2.66x spread moves the UNCHARGED crossover threshold in N
      by about 7.1x, and the crossover DEC-20260726-005 rests on is a
      comparison of two Python interpreter overheads.
    - >-
      The multi-target Pollard rho baseline (OBS-9) is absent and its constant
      is not asserted. The direction is favourable to this record, so the gap
      is a completeness defect rather than a correctness one, but it remains
      open.
    - >-
      Several quantities are single-derivation only (replication_map). In
      particular the SC4 Spearman 0.8143, the |S| measurements, the CTRL-I
      probe and the H2 z-scores rest on one non-originating session each.
    - >-
      EV-STR-002's parallel confound - "All Groebner solves on trivial ideals
      (no decompositions at B >= 27)" - is UNTOUCHED by this record. No census
      of the EXP-STR-002 run records has been run. H-STR-002 and
      DEC-20260726-006 are outside this record's scope entirely.

