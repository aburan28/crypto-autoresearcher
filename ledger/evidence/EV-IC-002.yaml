  type: theoretical
  evidence_kind: derivational_reanalysis_of_committed_run_records
  type_note: >-
    LOCAL SCHEMA EXTENSION (evidence_kind, run_id_coverage, replication_map)
    over templates/research-records.md, declared here rather than assumed.
    This record is NOT a new experiment and reports NO new measurement. It is
    a derivation over the 748 immutable EXP-IC-001 run records already
    committed to this repository. Every quantity below is a deterministic
    function of committed blobs; none of it was produced by executing a
    solver, timing a run, or enumerating a set inside a run wrapper in this
    batch. templates/research-records.md offers only empirical | theoretical
    | literature, so `theoretical` is recorded as the closest available value
    and this note carries the precise kind.

  direction: weakens
  strength: replicated
  strength_justification: >-
    The load-bearing items - the decomposition census, the per-instance
    decomposition table, the zero-decomposition fact at field_bits >= 20, and
    the closed-form multi-target baseline arithmetic - are deterministic
    functions of immutable committed blobs and have been derived
    independently by four non-originating parties (RT-20260727-001,
    RT-20260727-002, the dispatching orchestrator, and this Coordinator
    session) in agreement. That is replication in the strongest sense a
    derivation admits. Items derived by only ONE party are flagged
    single_derivation in replication_map below and are NOT load-bearing for
    the decision this record supports.
  claim_tier: toy
  claim_tier_justification: >-
    Largest tested prime-order subgroup is N = 33,766,959,953 (about 35 bits)
    on an 8-36 bit prime field. Nothing here is at, near, or informative
    about cryptographic scale.

