# EV-DTREE-b47c19 — C1 claim only (exact-enumeration slope of P_dec vs B',
# testing HEUR-001's exponent gamma = m-1 = 2 against the competing birthday
# model gamma ~ m = 3). Filed separately from the C2 (depth-2 cost) claim
# per review-evidence instructions: the two outcomes are not the same kind
# of finding and must not be collapsed into one undifferentiated verdict.
# See EV-DTREE-2e8f6a for C2.
#
# Independently re-verified by the Coordinator during /review-evidence
# (2026-08-09), not merely transcribed from experiments/EXP-DTREE-001/analysis.md
# or execution-report.yaml: the full 18-cell (3 tiny curves x 6 B' values)
# lambda table was recomputed by hand directly from RUN-DTREE-001/raw.json's
# "tiny_instances" block and cross-checked against the identical table
# independently re-embedded in RUN-DTREE-002/raw.json's "lambda_tables"
# block (both files agree exactly, to the last digit, on all 18 cells).
evidence:
  id: EV-DTREE-b47c19
  hypothesis_id: H-DTREE-001
  experiment_ids: [EXP-DTREE-001]
  run_ids: [RUN-DTREE-001, RUN-DTREE-002]

  type: empirical
  direction: neutral
  strength: inconclusive
  claim_tier: toy
  claim_tier_justification: >-
    The only instances this claim was ever tested against are the 8/10/12-bit
    tiny curves (max field bit size 12 <= 32), so toy is both the tested
    ceiling and, since no cell qualified, the ceiling on what "tested" even
    means here.

  certificate_refs: []
  certificate_note: >-
    Both RUN-DTREE-001 (freeze) and RUN-DTREE-002 (confirmatory slope fit)
    carry certificate.kind: none in their manifests and raw.json, correctly:
    this is a pure counting/enumeration measurement, not a claimed solve or
    relation, so per docs/claims-and-verification.md there is nothing to
    certify and the record says so explicitly rather than leaving the field
    blank. There is nothing to spot-check here via independent EC arithmetic
    for this specific record; that check was performed instead on the C2
    certificates (RUN-DTREE-006 decomposition certificate and RUN-DTREE-010
    discrete-log certificate — see EV-DTREE-2e8f6a and this review's report
    for the full manual re-derivation).

  proof_status: not_applicable
  proof_status_declaration: >-
    DECLARED, NOT DEFAULTED. This record makes no claim about HEUR-001's
    truth value in either direction — it reports that the pre-registered test
    of HEUR-001's exponent never produced discriminating data. The
    refutation-artifact ladder in docs/claims-and-verification.md
    ("Refutation artifacts: proof before rejection") governs ADVERSE
    transitions (weaken, reject_scoped, hypothesis -> rejected); none is made
    here, about HEUR-001 or about H-DTREE-001's C1 claim. not_applicable is
    therefore the accurate proof_status, not a placeholder.
  proof_refs: []

  observations:
    - id: OBS-1
      title: The frozen slope grid rule, applied to the frozen tiny-curve seeds, yields 0 qualifying cells (design_infeasible)
      text: >-
        RUN-DTREE-001 (freeze) computed the exact lambda = C(B',3)/n table
        for every B' in {8,9,10,11,12,13} on all three tiny curves
        (8-bit: p=241, n=23, seed 1; 10-bit: p=1009, n=19, seed 1; 12-bit:
        p=3571, n=31, seed 1) — 18 cells total. I recomputed all 18 lambda
        values directly by hand from the raw C(B',3) and n values recorded in
        RUN-DTREE-001/raw.json and confirm every value and every
        "qualifies": false flag exactly, e.g. B'=8: C(8,3)=56, lambda =
        56/23 = 2.43478... (8-bit), 56/19 = 2.94737... (10-bit),
        56/31 = 1.80645... (12-bit); B'=13: C(13,3)=286, lambda =
        286/23=12.43478..., 286/19=15.05263..., 286/31=9.22581... — all far
        above the lambda_max=0.7 qualification ceiling, and every other
        tested B' in between likewise. total_qualifying_cells: 0 in both
        RUN-DTREE-001/raw.json and RUN-DTREE-002/raw.json (the two files
        carry byte-for-byte identical lambda tables, cross-checked). Because
        C(B',3) is strictly increasing in B' for fixed n, the smallest tested
        B'=8 gives the smallest lambda for each curve, and that smallest
        lambda already exceeds 0.7 at all three curves by more than a factor
        of 2.5 — so no B' beyond the tested range 8-13 could ever have
        qualified either; this is not an artifact of stopping the grid early.
      verified_by_coordinator: true
    - id: OBS-2
      title: Precision correction to a shorthand in analysis.md/implementation.md ("n >= 71.4")
      text: >-
        Both analysis.md and implementation.md describe the qualification
        threshold as "the rule requires n >= 71.4" (= 50/0.7, using the grid
        rule's c_min=50 directly). This is a NECESSARY but not SUFFICIENT
        condition and is a mild imprecision, not a computational error: the
        grid rule's own B' floor (B'>=8) means the smallest C(B',3) value
        that can actually occur is C(8,3)=56, not 50 (no B'=8 gives C(B',3)
        anywhere between 50 and 55; there is no achievable cell there). The
        precise necessary-and-sufficient threshold, given the grid as
        actually constructed, is n >= C(8,3)/0.7 = 56/0.7 = 80, not 71.4.
        This does not change any conclusion — the tested n values (19, 23,
        31) fall far below EITHER number — but I flag it because the task
        asked me to check specific numeric claims rather than trust the
        write-up, and this is one instance where the exposition is loose
        without being wrong about the outcome.
      verified_by_coordinator: true
    - id: OBS-3
      title: Diagnostic-only point outside the frozen grid (not part of the confirmatory fit)
      text: >-
        RUN-DTREE-002/raw.json's diagnostic_illustrative_points block records
        P_dec at B'=8 (below the grid's B' floor is not the issue here — B'=8
        IS the floor; this point is diagnostic because it was never claimed
        to satisfy lambda<=0.7, only computed for illustration) as 0.9565
        (8-bit), 0.4211 (10-bit), 0.1935 (12-bit) — confirmed exactly against
        the raw JSON (0.9565217391304348, 0.42105263157894735,
        0.1935483870967742). These illustrate deep saturation at the
        smallest allowed B', not a measurement inside the registered
        non-saturated regime, and the specification's own required_artifacts
        and success_criterion never treat this point as confirmatory.
      verified_by_coordinator: true
    - id: OBS-4
      title: Root cause is the frozen instance-generation procedure, not the solver or the enumeration code
      text: >-
        harness.toycurve.generate_instance(seed, field_bits) accepts the
        FIRST candidate curve (deterministic search order) whose largest
        prime factor n meets a weak bar (n.bit_length() >= 3 and n >= 5) — it
        does not search for a curve with a large prime-order subgroup near p.
        For seed=1 at 8/10/12 bits this gives n=23, 19, 31 (all far below 80,
        and non-monotonic — 12-bit's n=31 exceeds 10-bit's n=19 despite the
        larger field). Read directly from harness/toycurve.py (source
        inspected during this review); the specification names this exact
        function and these exact seeds and authorizes no alternative search,
        so RUN-DTREE-001 correctly recorded design_infeasible per the
        freeze-stage stop rule rather than improvising a different grid or
        seed.
      verified_by_coordinator: true
    - id: OBS-5
      title: Confirmatory stage is a clean no-op, not a degraded or partial result
      text: >-
        RUN-DTREE-002/raw.json: confirmatory_slope_fit.applicable: false,
        ctrl_enumeration_audit.applicable: false, tail_checks.applicable:
        false, slope_gamma: null, slope_ci_95: null. No slope was fit, no CI
        computed, no comparison to gamma=2 or gamma=3 made, and the
        CTRL-ENUMERATION-AUDIT (which per the invalidation_rules would have
        invalidated the slope measurement on any disagreement) never ran
        because there was nothing to audit. This is a clean "zero cells"
        outcome, not a partially-populated or degraded one.

  inference: >-
    Per AGENTS.md rule 5 ("A timeout, crash, or implementation failure is not
    evidence against a mathematical hypothesis"), I read design_infeasible as
    an infrastructure/instance-generation design defect, not a scientific
    result bearing on HEUR-001's exponent. The specification's own freeze
    stage anticipated exactly this possible outcome and pre-designated
    design_infeasible as a stop-rule condition distinct from a measured
    result ("If the frozen grid yields fewer than 6 non-saturated cells...
    stop and record design_infeasible... do not improvise a new grid") —
    this was not an unanticipated crash, it is the protocol's own named
    escape valve, triggered and followed exactly as written. The defect is
    specific and localized: generate_instance's deterministic weak-bar
    search, at seed 1, does not reliably produce curves with subgroups large
    enough for the grid rule to ever populate at 8-12 bits. That is a
    property of one specific instance-generation procedure and one specific
    seed choice, not of the (B'/N)^(m-1) heuristic, the birthday-counting
    alternative, or of prime-field point-decomposition index calculus in
    general. HEUR-001 is therefore neither supported nor weakened nor
    refuted by this run: it remains exactly as untested as before
    EXP-DTREE-001 executed, and its own falsification_condition (a 95% CI
    excluding m-1=2, computed from >=6 fitted cells) was never triggered
    because no CI was ever computed. I emphasize this because it would be a
    mistake to read "the experiment ran and produced design_infeasible" as
    if it had produced a null or weak result on HEUR-001 in some diluted
    sense — it produced no result on HEUR-001 at all.

  boundaries:
    - >-
      Toy tier, 8/10/12-bit fields, seed 1 only (the frozen tiny_instance_seeds
      mapping uses seed 1 for all three tiny sizes). No other seed was tested
      for the tiny curves, so this record cannot say whether a different seed
      under the SAME generate_instance function would populate the grid
      (plausible, since generate_instance's weak bar is seed-dependent) or
      whether the defect is structural to the function regardless of seed —
      that distinction is exactly what a successor run would need to resolve.
    - >-
      Scoped to this exact grid rule (B'>=8, C(B',3)>=50, lambda<=0.7,
      >=6 cells required) and this exact enumeration implementation
      (curvegroup.py's exact curve-group-law enumeration, itself
      cross-checked in the specification's design against an independent
      Semaev-identity audit path, though that audit never ran here since
      there were no cells to audit).
    - >-
      Says nothing about the C2 (depth-2 cost) claim, which does not depend
      on the tiny curves at all — see EV-DTREE-2e8f6a for that claim's
      separate, independently reasoned disposition.

  unresolved_confounds:
    - id: CONF-1
      text: >-
        Whether generate_instance's weak-bar search would populate the grid
        under a DIFFERENT seed (without touching the frozen function itself)
        is untested. This is the cheapest first thing a successor run should
        check, since it requires no code change to the frozen harness.
      status: open, not investigated by this experiment or this review

  reviewed_by: coordinator
  reviewed_at: '2026-08-09'
