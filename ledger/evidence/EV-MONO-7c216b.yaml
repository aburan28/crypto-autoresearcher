  observations:
    - >-
      STAGE 0 (symbolic identity gate): PASS. Independently re-derived by
      the Validator from scratch (not re-read from the Executor's
      transcript): all three T-coefficient forms of S_3(t1,t2,T) in
      (e1,e2), c1=f(t1)+f(t2), c0=f(t1)f(t2), and disc_T(S_3)=16 f(t1)f(t2)
      confirmed exact term-by-term. Matches `stage0_transcript.json`
      byte-identically in both runs.
    - >-
      PRIMARY METRICS P1, P2, P3: PASS EXACTLY at every one of the 6
      committed (p,A,B) cells, both runs. P1 (arm(a)/arm(b) disagreement
      off the instrument-degeneracy stratum) = 0 across ~164,000 base
      points total. P2 (distinct labelled permutations realized) = exactly
      8 at every cell -- the exceptional-locus signal RQ-MONO-001 hunts
      did NOT fire on any tested curve. P3 (per-instance agreement between
      the observed class and the class forced by the character-triple
      recipe) = 1.000 exactly. The Validator independently reproduced this
      with FRESH, differently-structured code (a direct biquadratic
      Z-substitution classifier, not the Executor's distinct-degree
      factorization) exhaustively over two full cells (p=101 and p=211,
      A=1,B=1: 10,201 and 44,521 points respectively) and found zero
      mismatches against the logged per-base-point data, ruling out a
      shared-implementation-bug explanation for the clean pass.
    - >-
      ARM INDEPENDENCE AND F_p^4 ARITHMETIC: independently verified by the
      Validator via direct code reading (arm_a.py never references c1/c0/
      arm_b; arm_b.py never references t1/t2/f_of/lift_y) and by hand
      re-derivation of the F_{p^4} square-root and genuine p-power-map
      routines the inert chi(c0)=-1 branch requires to realize the 4-cycle
      class. The Validator explicitly constructed and ruled out the
      plausible bug of substituting F_{p^2}-level conjugation for the
      true F_{p^4} Frobenius (which would cap realizable element order at
      2 and could never produce a 4-cycle) -- the actual code does not
      have this bug.
    - >-
      DETERMINISM: independently confirmed. All exhaustive-arm outputs
      (everything except the random-quartic control's draws) are
      bit-identical between the two seeded runs; only the random-quartic
      histograms differ, as the frozen contract requires.
    - >-
      RANDOM-QUARTIC NULL CONTROL: PASS at both primes, both runs (S_4
      Chebotarev densities reproduced within 3 binomial standard errors,
      type 3+1 emitted in every case), independently re-verified by the
      Validator. The instrument-adequacy precondition for interpreting any
      negative from the Semaev arms is satisfied.
    - >-
      MATCHED-ORDERED-BASE CONTROL, CORRECTED READING (supersedes the
      Executor's own DEV-1 framing; see CORR-20260830-938af0 for the full
      correction). The Executor's `execution_report.yaml` reported this
      control as NOT matching the contract's forced value at every cell
      (`matches_forced_value: false`), comparing the observed
      {1^4:2652-12210, 2.1.1:4752-22200, 2^2:1892-12432} counts (zero
      4-cycles at every cell) against a SUPERSEDED forced-value wording
      ("exactly two types {1^4,2^2}"). Independent git forensics (this
      Coordinator, corroborated by the Validator's Finding F1) establish
      that the specification text actually in force when the Executor ran
      (commit d810634a6, a descendant of the out-of-band commit 5f0d0dec1)
      already read "FORCED exactly 0 four-cycles, with every realized type
      in {1^4, 2.1.1, 2^2}". The observed data SATISFIES this forced value
      exactly, at every cell, both runs. DEV-1 is a stale-comparison
      artifact in the Executor's own reporting, not a deviation from the
      as-executed contract and not evidence against H-MONO-0b3def.
    - >-
      MATCHED-ORDERED-BASE CONTROL, INDEPENDENT GROUP-THEORY VALIDATION
      (Red Team J2). From first principles, re-deriving the relationship
      between KN-FIND-a8990a's Theorem A/B construction (the degree-2
      T-polynomial S_3(t1,t2,T), whose 2 roots are x(P1+P2) and x(P1-P2),
      with Galois group order 2, `(Z/2)^2 / <sigma1 sigma2>`) and
      H-MONO-0b3def's own degree-4/8 mechanism (the labelled four points
      {P1,-P1,P2,-P2}, Galois group over the strict ordered base
      `<sigma1,sigma2> = (Z/2)^2`, order 4): Theorem B's group is an
      INDEX-2 QUOTIENT of the finer order-4 group by the diagonal subgroup
      `<sigma1 sigma2>`. Over the strict ordered base (no tau), the four
      elements {id, sigma1, sigma2, sigma1 sigma2} act on the four
      labelled points with cycle types {1^4, 2.1.1, 2.1.1, 2^2}
      respectively -- THREE types among four group elements, matching
      exactly what the Executor's control observed, with 2.1.1 the
      largest bucket (two of four elements map to it). IDEA-20260830-
      1a08f9's own S5 citation ("Theorem B forces every Frobenius element
      over the ordered base to be one of 1^4 and 2^2") is therefore a
      genuine citation/translation error: it applies Theorem B's
      conclusion about the coarser, order-2 quotient object to the finer,
      order-4 object without accounting for the quotient map. This error
      predates this batch (it is in the original 2026-08-30 proposal) and
      was carried into H-MONO-0b3def's proof_search_map.baseline_embedding
      before being corrected mid-flight by the disclosed out-of-band edit
      and independently re-derived here. The Red Team corroborated the
      corrected reading two further ways independent of both the
      out-of-band edit and the Executor's code: (i) the hypothesis's own
      S6 character-triple recipe, applied literally to ordered pairs,
      already predicts all three types -- an internal inconsistency
      within the pre-correction document; (ii) exact per-curve (S,N,Z)
      counts computed from first principles (S,N = counts of x with
      f(x) a square/nonsquare in F_p, Z = f's root count) predict
      class-count proportions S(S-1):2SN:N(N-1) for {1^4,2.1.1,2^2} that
      match the observed per-cell counts closely.
    - >-
      CLASS-DENSITY ANOMALY, RESOLVED AS A SCOPED FALSIFIER OF
      HEUR-WREATH-3 (Red Team J3). The `identity` and `sigma1_sigma2`
      class densities deviated from their forced 1/8 values by up to
      ~10.2 binomial standard errors at 5 of 6 cells; `sigma_i`,
      `block_swap_involution`, and `four_cycle` stayed within 3 s.e. at
      every cell. The Red Team derived, from first principles (writing
      S=(p-t-Z)/2, N=(p+t-Z)/2 with t the curve's Frobenius trace), that
      Theorem B's proven O(1/p) trace-cancellation applies only to the
      EVEN-in-t combinations S^2+N^2 and 2SN (explaining why the other
      three classes, which are built from these combinations, correctly
      stay within band). The identity and sigma1_sigma2 densities instead
      depend on S(S-1) and N(N-1) SEPARATELY, whose difference
      S(S-1)-N(N-1) = -t(p-Z-1) is exactly LINEAR and ODD in t, hence does
      NOT cancel at first order: identity_density ~ 1/8 - t/(4(p-Z)),
      predicting a deviation of approximately -0.756*t standard errors at
      this census's scale. Checked against all 6 cells using independently
      computed curve traces t (not the classifier's own code): sign-correct
      and within ~15-30% of the observed deviation at every cell (e.g.
      p=211,A=4,B=1: t=13 predicts -9.83 s.e., observed -10.23 s.e.;
      p=211,A=1,B=1: t=-11 predicts +8.31, observed +7.74). This is a
      REAL, DETERMINISTIC, CURVE-TRACE-DRIVEN effect, generically of order
      p^{-1/2} since |t|=Theta(sqrt(p)) for a typical curve -- diagnostic
      of the p^{-1/2} scaling H-MONO-0b3def's falsification_conditions
      item 5 and HEUR-WREATH-3 explicitly name as a two-sided falsifier,
      not a too-tight statistical band at small p. The two-different-
      curves-per-prime panel cannot cleanly show p-scaling empirically
      (confounded by each curve's own differing t, a limitation the frozen
      contract itself disclosed in advance), but the analytic derivation
      settles the question without needing that empirical fit.
    - >-
      SCOPE OF THE J3 FALSIFICATION. This is scoped exactly to
      HEUR-WREATH-3 (the equidistribution-with-O(1/p)-error heuristic) and
      to the identity and sigma1_sigma2 class densities specifically. It
      does NOT touch: containment in D_4 (never in question -- the block
      system is preserved by construction), the exceptional-locus/
      all-8-permutations claim (P2=8 held at every cell), the per-instance
      recipe check (P3=1.000 held exactly), or the other three class
      densities (sigma_i, block_swap_involution, four_cycle), which are
      built from trace-cancelling combinations and correctly stayed within
      band. H-MONO-0b3def's core claim (a), (b), (c) -- the D_4 structure
      and its uniform, argument-based (not census-based) realization -- is
      SUPPORTED, not falsified, by this batch.
    - >-
      GOVERNANCE FINDING, DISCLOSED NOT SILENTLY ABSORBED (CORR-20260830-
      938af0; CORR-20260830-778068 for the unrelated prior instance).
      Between this contract's approval and the Executor completing its
      run, TWO out-of-band commits (5f0d0dec1, a1269ac26) by the external
      git identity "Cursor Agent <cursoragent@cursor.com>" edited the
      FROZEN, approved specification.yaml and the paired hypothesis
      directly, without a task/decision reference and without a versioned
      protocol_amendment, in violation of this contract's own
      approval_status text. This Coordinator's OWN initial disclosure of
      this (in the snapshot receipt) was itself incomplete and factually
      wrong about which edit the Executor's run reflected; corrected in
      CORR-20260830-938af0. The edits' CONTENT is independently verified
      correct (by the Validator's and Red Team's own from-scratch
      derivations, not by deferring to the edits), so the run's scientific
      validity is unaffected -- but this is the THIRD such out-of-band
      edit by the same identity found in this session across two unrelated
      goals, worth the user's attention as an operational pattern
      independent of this record's scientific content.

