        verified four times total (that batch's own Validator/Red Team when
        first derived, and this batch's Red Team and Validator again). This
        basis is itself disclosed by its own original authors as a DERIVED
        x3-multiplier inference, not a directly-measured formula (an
        alternative additive-delta derivation gives a different, larger
        total of 7713503488, used as a robustness check, not adopted). For
        communication_scheduled_bytes, NO comparable per-row basis exists
        anywhere in the inherited chain; the producer's
        NOT_ACHIEVABLE_WITHOUT_FABRICATION conclusion IS well-supported for
        communication specifically. This is a genuine premature-closure
        defect under docs/inventor-protocol.md, not evidence of fabrication.
    - id: V2-BLOCKER-REPAIR-PROSE-SILENTLY-TRIMMED
      found_by: [validator TASK-20260815-0825b2 finding V-2-BLOCKER-REPAIR-PROSE-SILENTLY-TRIMMED]
      detail: >-
        The successor's specification.yaml states, twice, that the
        blocker_repairs block is "CARRIED FORWARD UNCHANGED ... nothing else
        in it is touched." A byte-level diff against the frozen predecessor
        EXP-SYC-793304 shows this is FALSE: five distinct sub-fields of
        supporting mathematical reasoning in the HA-2 tail-unavailability
        proof (lemma L2's non_vacuity_requirement.interpretation and
        union_bound_conservatism_note; lemma L3's explicit conclusion
        sentence; lemma L4's why_this_matters; lemma L5's worked_bound
        moment-order argument) are ABSENT from the entire six-file successor
        package with no disclosure. Two further sub-fields were relocated
        without disclosure but their underlying facts survive elsewhere
        (reformatting, not loss). No numeric row, bound, or final
        disposition label changed anywhere -- independently recomputed and
        confirmed matching exactly. Provenance/completeness defect, not a
        reversed mathematical conclusion.

