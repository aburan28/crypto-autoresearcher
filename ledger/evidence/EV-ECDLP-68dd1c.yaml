        J2 independently retrieves MPZ and verifies that ell is the sole
        cross-phase advice in ordinary bits and k is one complete main-phase
        black-box interaction count. With all predicate internals and wrapper
        costs charged, ell=B^(9/4+o(1)), k=B^(5/4+o(1)), and success is at most
        B^(-1/4+o(1))=N^(-1/20+o(1)).
      - >-
        J3 confirms every nearby-object argument stops at the first missing
        premise and no coordinate, P1553, target-conditioned, random-only,
        opaque-handle, unbounded-word, or non-subset-stable transfer survives.
        It also identifies an open structured interval-DLP successor at the
        two-restriction boundary.
      - >-
        The statement-only rederiver independently obtains the universal
        witness, exact call count, public-deck injectivity, labelled join,
        decoder, resource exponent, and stopping boundary while reading no
        producer or sibling output.
  supported_core:
    model: MPZ dense prime-order generic group, optionally with exactly the shared oracle ro(v)=RO(pi(v)) of Corollary 3
    interface: >-
      One target-independent exact existential object for arbitrary public
      signed occurrence-labelled decks, stable under every canonical dyadic
      cumulative restriction of exactly F0,F1,F2, with full public
      reconstructible F3 and F4 lineage.
    construction: >-
      Let B=N^(1/5), m=2^ceil(log2(B)), C=sum_i=0^4 m^i,
      F_i={(i,d,sigma,[sigma(d+1)m^i]P)}, and R=Q+[C]P.
    universal_witness: >-
      For Q=[x]P with canonical x=sum_i a_i*m^i, the five actual occurrences
      d_i=a_i and sigma_i=+1 sum to [x+C]P=R.
    exact_restriction_calls: 3*log2(2m)=3*(ceil(log2(B))+1)
    public_join: exactly 2m F3 insertions, exactly 2m F4 complement scans, and at most 2m emitted matches
    decoder: x_hat=(sum_i=0^4 sigma_i(d_i+1)m^i-C) mod N
    advice_bits: ell=B^(9/4+o(1)) after complete ordinary-bit serialization
    aggregate_main_interactions: >-
      k=B^(5/4+o(1)), including target and public-deck construction, every
      predicate-internal MPZ interaction, all restrictions, reconstruction,
      dictionary work, scans, replay, decoding, shared-RO calls, and final
      verification.
    success_bound: 3*ell*(k+1)^2/N=B^(-1/4+o(1))=N^(-1/20+o(1))
    consequence: >-
      A universal exact or nonvanishing complete-transcript solver satisfying
      every frozen premise would succeed on every fresh target, contradicting
      the MPZ bound for sufficiently large N.
  two_restriction_successor:
    status: open_unverified_mechanism
    exact_structure: >-
      After isolating only F0 and F1, each fixed sign vector for the remaining
      F2,F3,F4 scalar sum produces a contiguous interval
      s2*[1,m]+m*s3*[1,m]+m^2*s4*[1,m] of exactly m^3 integers. The signed
      union has at most eight such intervals.
    standard_upper_bound: >-
      Normalizing by m^(-2) modulo N reduces each sign case to interval DLP.
      A standard baby-step/giant-step split uses O(S+m^3/S) generic
      interactions and O(S) stored encodings, minimized at S=m^(3/2).
    current_rectangle: >-
      When construction and lookup interactions are included in the same hard
      k=m^(5/4+o(1)) cap, the standard m^(3/2) route does not fit. This is an
      upper-bound accounting observation, not a lower bound. A separately
      frozen proof audit must determine whether preprocessing, interval
      overlap, or a different multipoint mechanism changes the conclusion.
  limitations:
    - The exact cumulative predicate is a premise; no record establishes that it exists or can be implemented at the stated resources.
    - The MPZ theorem bounds phase-crossing advice and generic black-box interactions, not preprocessing time, ordinary bit-operation time, or main solver memory.
    - The result is distributional over fresh uniform generic challenges and representation randomness, not a pointwise coordinate-bearing theorem.
    - It does not cover coordinate-aware elliptic-curve, Semaev, resultant, field-oracle, P1553 target-local, or representation-sensitive algorithms.
    - It does not cover target-conditioned advice, persistent uncharged opaque handles, unbounded unit-cost words, multiple or arbitrary-domain random oracles, random-deck-only support, non-subset-stable predicates, or marginal per-query success.
    - The two-restrictable-deck interval route remains open and unverified; no m^(5/4) construction or lower bound is established.
    - It is not an ECDLP algorithm, generic ECDLP lower bound, P1553 impossibility, attack, speedup, SOTA movement, B71 admission, closure, completion, or breakthrough.
