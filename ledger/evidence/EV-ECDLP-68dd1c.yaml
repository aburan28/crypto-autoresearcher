    composition:
      - >-
        J1 proves the universal all-positive base-m witness, exact cumulative
        three-deck bisection, within-deck signed injectivity of F3 and F4 for
        sufficiently large prime N, exact 2m insertion plus 2m scan join with
        at most 2m outputs, labelled decoding, and final verification.
