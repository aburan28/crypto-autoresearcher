  observations:
    - >-
      The content-first snapshot receipt binds the runtime-harness attachment
      producer directory at commit af9b1a5fd4e9b97bc025d28cd6c86bb4920c2534
      with first parent 35ea20c3aff58d3ee9c2f8d9e561422de0022fb0. The snapshot
      changes exactly seven paths (six producer artifacts plus the snapshot
      receipt itself), all under BATCH-820ee8, and touches no ledger, queue,
      review, or goal path. Both reviewers independently verified the snapshot
      commit's reachability from HEAD, its parent, its exact changed-path set,
      and the SHA-256 hashes of all six producer artifacts against the snapshot
      receipt.
    - >-
      Validator task TASK-20260830-78281a, report
      coordination/goals/GOAL-ENDO-001/batches/BATCH-820ee8/reviews/TASK-20260830-78281a/validation-report.yaml
      and runtime receipt
      coordination/goals/GOAL-ENDO-001/batches/BATCH-820ee8/reviews/TASK-20260830-78281a/runtime-session-receipt.json,
      independently returns J1-schema-v2-semantics-and-v5-consistency HOLDS
      within the exact static schema-extension and v5-consistency scope. The v2
      schema extends v1 by adding three host_binding fields (host_id,
      filesystem_id, filesystem_mount) with declared provenance, verification
      semantics, and failure behavior; no v1 field is removed, renamed, or
      reinterpreted. The v5 binding_rule_v2, missing_receipt_field, and
      receipt_field_absent_handling are byte-identical to v5. The v5 STOP is
      preserved at the binding-rule layer on caller-supplied and missing
      bindings. The one named weakening (v2 schema-validity does not imply v5
      binding-rule satisfaction) is disclosed in
      receipt-schema-v2.yaml.v1_compatibility_weakening_of_v5_stop, not hidden.
      Backward compatibility claims are accurate against both v1 corpus
      receipts on disk. The validator records no scientific result,
      authorization, status change, or experiment run.
    - >-
      BLIND RE-DERIVATION AGREEMENT. The validator performed the review plan's
      required blind re-derivation of the demo receipt's host_binding values
      from the host's own identity surfaces, never reading the producer's
      emit_procedure.md or emit_host_binding.sh (blind_from respected; hashes
      computed for integrity verification only, content not inspected). The
      re-derivation queried `hostname` (yielding Adams-MacBook-Pro.local) and
      `df -P .` (yielding /dev/disk5s1 and /Volumes/SSD990) and AGREED on all
      three values against demo-receipt.json: host_id AGREEMENT,
      filesystem_id AGREEMENT, filesystem_mount AGREEMENT, overall AGREEMENT.
      Per the review plan's agreement_means, this agreement is evidence that
      the demo receipt's host_binding values were captured from the real host
      identity surfaces the v2 schema's provenance declarations point to. No
      suspect (schema provenance declaration or procedure) is implicated. This
      is recorded evidence the demo values are real, not hand-written.
    - >-
      Red-team task TASK-20260830-d85fdf, report
      coordination/goals/GOAL-ENDO-001/batches/BATCH-820ee8/reviews/TASK-20260830-d85fdf/red-team-report.yaml
      and runtime receipt
      coordination/goals/GOAL-ENDO-001/batches/BATCH-820ee8/reviews/TASK-20260830-d85fdf/runtime-session-receipt.json,
      independently returns J2-emit-procedure-verifiability-and-demo-reality
      BREAKS and J3-stop-control-integrity-and-escape-surface HOLDS. The J2
      break is on RT-J2-O1 (material, open): emit_host_binding.sh resolves
      hostname and df through PATH, so a caller who prepends fake binaries to
      PATH makes the procedure emit caller-controlled values for all three
      host_binding fields THROUGH the procedure, contradicting the package's
      provenance claim ("never read from caller input, environment variables
      the caller controls, or repository state"). This is within the v5 threat
      model (caller-supplied bindings) and is NOT disclosed in the package. The
      J3 hold confirms the v5 STOP fires correctly in all three required cases
      (caller-supplied, missing, v1-under-v2), with the named weakening
      disclosed, and no new v2-specific escape found that defeats the binding
      rule when evaluated.
    - >-
      OBJECTION RT-J2-O1: severity material, status open, class
      provenance_claim_violated_by_path_manipulation. The emit_host_binding.sh
      script uses PATH-resolved hostname and df binaries, not absolute paths. A
      caller controlling PATH can prepend a directory containing fake hostname
      and/or df binaries and the script emits those caller-supplied values as
      the host_binding fields. Confirmed by execution: fake hostname in PATH
      made the script emit host_id="caller-controlled-hostname"; fake df in
      PATH made the script emit filesystem_id="/dev/fakedev" and
      filesystem_mount="/mnt/fake". This contradicts the provenance claim in
      receipt-schema-v2.yaml and the claim in emit_procedure.md that "a caller
      can no longer supply arbitrary host_binding values THROUGH the emit
      procedure." Required repair: absolute-path command resolution OR an
      explicitly narrowed provenance claim that PATH is trusted infrastructure.
    - >-
      OBJECTION RT-J2-O2: severity material, status disclosed_in_package,
      class self_attestation_gap. The host_binding fields are self-attested by
      the emitting session; nothing INDEPENDENTLY cross-checks the capture at
      emission time. A compromised emitting session can hand-write a receipt
      with arbitrary values, or run the script on a different host and paste
      the output. Independent reviewer verification is the cross-check but is
      not automatic. This IS disclosed in the package
      (what_this_does_not_attest, limitation_disclosed: true). The
      coordinator's prior expected this finding. It is the expected scope of
      what this batch closes, not a defect. Required repair: none (disclosed
      limitation, not a defect; the v5 threat model does not cover a malicious
      runtime).
    - >-
      OBJECTION RT-J2-O3: severity minor, status partially_disclosed, class
      cwd_dependence_not_fully_disclosed. The script captures the working
      directory's filesystem (df -P .), not a fixed host identity. Running the
      script from a different mount point produces different (real)
      filesystem_id and filesystem_mount values. Confirmed by execution: from
      /tmp the script emitted filesystem_id="/dev/disk3s5" and
      filesystem_mount="/System/Volumes/Data" (different from the worktree
      root's /dev/disk5s1 and /Volumes/SSD990). The schema says "the filesystem
      device identifier of the working directory the procedure runs in," but
      the paste-from-different-mount attack is not explicitly called out.
      Required repair: document the paste-from-different-mount attack in
      emit_procedure.md and/or receipt-schema-v2.yaml.
    - >-
      OBJECTION RT-J3-O1: severity minor, status open, class
      missing_field_stop_does_not_cover_empty_or_null. The v5
      missing_receipt_field STOP fires on ABSENCE (key not present), not on
      emptiness or null. A hand-written receipt with host_binding.host_id = ""
      (empty string) or null has the key PRESENT, so the missing_receipt_field
      STOP does NOT fire. The binding_rule_v2 then catches these via
      inequality (if evaluated). This is a specific instance of the named
      weakening, not a new escape. Required repair: extend missing_receipt_field
      to fire on empty-after-normalization values, not just absent fields.
    - >-
      PROVES-TOO-MUCH CONTROL PASSED. The red team ran the argument "this
      package makes the host binding authoritative" against all three
      known-false objects declared in the review plan: (PTM-1) a package whose
      emit procedure reads host_binding from an env var the caller controls --
      rejected; (PTM-2) a package whose demo receipt contains values with no
      corresponding host identity surface -- rejected; (PTM-3) a package whose
      STOP control checks only field presence, not provenance -- rejected. All
      three were rejected by the review method, which is discriminating: it
      caught the actual package's PATH manipulation (RT-J2-O1) and
      self-attestation (RT-J2-O2) issues by the same method. The
      proves-too-much control passes.
    - >-
      PRIOR-VS-OUTCOME COMPARISON. The review plan's coordinator_prior
      (recorded before any reviewer ran) predicted the real fight in J2 would
      be self-attestation: the emit procedure captures values from the host's
      identity surfaces, but nothing INDEPENDENTLY cross-checks the capture, so
      the enforceability gap narrows without fully closing. The prior expected
      this to come back as a disclosed limitation rather than a REVISE, because
      the v5 rule's threat model was caller-supplied bindings, not a malicious
      runtime. THAT PART WAS VINDICATED: RT-J2-O2 is exactly the predicted
      self-attestation gap, and it IS disclosed in the package. THE PRIOR WAS
      OVERTURNED IN THE DIRECTION THE PLAN SAID TO TREAT SKEPTICALLY: the red
      team found RT-J2-O1, a material UNDISCLOSED defect (PATH manipulation)
      stronger than the predicted limitation. PATH is an environment variable
      the caller controls, and the script's output is determined by which
      binaries PATH resolves, so a caller CAN supply values THROUGH the
      procedure -- contradicting the provenance claim. This is within the v5
      threat model (caller-supplied bindings) and is NOT disclosed. That is
      why the disposition is REVISE rather than a PASS-with-limitation. The
      plan's decision_if_overturned clause said to preserve any defect without
      outvoting it; the J2 break is preserved.
    - >-
      INDEPENDENCE CHECKER RESULT. The local command
      python3 tools/check_review_independence.py --batch
      coordination/goals/GOAL-ENDO-001/batches/BATCH-820ee8 PASSES: 2 reports,
      every joint owned and attested (J1 by TASK-20260830-78281a, J2 and J3 by
      TASK-20260830-d85fdf), blindness respected (both reviewers attest
      read_sibling_reports: false), controls declared (proves-too-much over
      three known-false objects, blind re-derivation with blind_from paths
      respected). This contrasts with the six vocabulary/shape mismatches
      recorded in DEC-20260825-dc7a01 for BATCH-90392b: the BATCH-820ee8 review
      plan was authored in the check_review_independence.py vocabulary (joint:
      keys, string attack_plan: fields, proves_too_much.failure_signature),
      and the vocabulary-compliant plan worked. No procedure deviation arises
      from the checker.
    - >-
      RED-TEAM PROCEDURE DEVIATION PD-1. The red team disclosed that at the
      very end of the review, after both artifacts were written, it ran `ls` on
      the sibling validator directory
      (coordination/goals/GOAL-ENDO-001/batches/BATCH-820ee8/reviews/TASK-20260830-78281a/)
      to confirm whether it existed. This listed the filenames
      (runtime-session-receipt.json, validation-report.yaml) but did NOT read
      any file contents. The filenames are the expected deliverables from the
      dispatch queue and reveal no verdict, finding, or content. This is a
      minor deviation from the strict "do not read anything under" rule: `ls`
      reads directory entries, not file contents. No sibling file was opened,
      cat'd, read, or inspected. This deviation is recorded, not absorbed
      silently.
    - >-
      HOST-BINDING-ENFORCEABILITY ASSESSMENT. Against the v5 threat model
      (caller-supplied bindings): NARROWED, but LESS than the package claimed.
      The emit procedure removes the caller's ability to supply values through
      the SCHEMA (the script reads host surfaces and accepts no arguments).
      However, the PATH manipulation finding (RT-J2-O1) shows a caller CAN
      supply values THROUGH the PROCEDURE by controlling PATH, which is within
      the v5 threat model. The package's claim "a caller can no longer supply
      arbitrary host_binding values THROUGH the emit procedure" is FALSE. The
      self-attestation gap (RT-J2-O2) is disclosed and expected. The
      CWD-dependence (RT-J2-O3) is partially disclosed. Against a
      malicious-runtime threat model: NOT CLOSED. HOST-BINDING-ENFORCEABILITY
      is narrowed from "specifiable rule, no harness" to "emitted rule with
      runnable harness and declared verification, residual self-attestation
      gap disclosed, PLUS PATH manipulation gap NOT disclosed, PLUS
      CWD-dependence gap PARTIALLY disclosed." The PATH gap means the narrowing
      is incomplete against the v5 threat model. HOST-BINDING-ENFORCEABILITY is
      NOT closed.
    - >-
      The composed scoped disposition is J1-schema-v2-semantics-and-v5-
      consistency HOLDS, J3-stop-control-integrity-and-escape-surface HOLDS,
      J2-emit-procedure-verifiability-and-demo-reality BREAKS, overall batch
      scoped REVISE. The reports are independent scoped inputs, not votes or
      goal-closure attestations. The J2 break is not outvoted: it stands, and
      the disposition is REVISE rather than PASS because of it.
