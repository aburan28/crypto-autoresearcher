  hypothesis_id: null
  hypothesis_id_note: >-
    No hypothesis exists. GOAL-MCE-001 BATCH-002 is a correction-and-
    transcription batch; RQ-MCE-e65b3c still forbids designing an experiment
    before primary text is in hand, and active_hypothesis_ids stays empty.
  experiment_ids: []
  run_ids: []
  type: literature
  direction: neutral
