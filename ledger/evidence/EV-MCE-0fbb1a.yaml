  claim_tier: toy
  certificate_refs: []
  proof_status: not_applicable
  proof_refs: []
  observations:
    - id: O-1
      what: >-
        Esser-Bellini estimator output for Classic McEliece's five parameter
        sets transcribed in full: 15 rows x 10 columns = 150 cells, 0
        not-obtained, 0 [RECALLED-NOT-READ]. Shape: 5 parameter sets x 3 memory
        models (mem 0, 1/3, 1/2) x 8 algorithm columns (Prange, Stern, Dumer,
        BC, BJMM, pdw, MO, BM).
      basis: >-
        TASK-20260803-cb44ab, snapshot b30400a9. Extraction cross-checked three
        ways by the producer (pypdf row-major, pdfminer column-major, and a
        geometry rebuild from LTChar coordinates verifying each value sits under
        its own header): 150/150 agree. Independently re-extracted and diffed by
        TASK-20260803-8cf2b6: 150/150 reproduce, with header and first-row cell
        centres matching to 0.1 pt.
      source_correction: >-
        THE ATTRIBUTION IN THIS PROGRAM'S EARLIER RECORDS WAS WRONG. The table
        is Table 1 of mceliece-security-20221023.pdf -- the SUBMITTERS' OWN
        security guide -- captioned "Output of the Esser-Bellini estimator". It
        is the designers' document reporting a third party's estimator output,
        NOT a third-party paper. Six records and two handoffs called it
        "Esser-Bellini SEC Table 1" and dropped that qualifier. Found by red
        team TASK-20260803-9ab856 R-4; the producer had written it correctly.
    - id: O-2
      what: >-
        The costing convention behind those numbers is THREE PHRASES and no
        formula. Verbatim: mem 0 is "a model making a physically implausible
        assumption of free access to arbitrarily large amounts of memory"; mem
        1/3 "a model assigning cube-root costs to memory access"; mem 1/2 "a
        model assigning plausible square-root costs to memory access". No unit
        and no definition of the quantity charged. The model is deferred to the
        estimator paper (eprint 2021/1243), which was NOT read -- only its
        abstract page was fetched, for bibliographic identity.
      basis: TASK-20260803-cb44ab convention_as_stated.md; 12 hedges recorded verbatim.
      source_own_hedges: >-
        The source states its own numbers "should be expected to be superseded
        by larger numbers from future estimators" and "are underestimates of bit
        operations", and its caption carries an unenumerated "Some cost
        components are ignored in all estimates".
    - id: O-3
      what: >-
        A memory-charged ISD baseline at Classic McEliece's parameters is NOT
        established by this transcription, and the gap is named rather than
        filled. "Computed" is not satisfied by a citation: the convention is
        NAMED in the source rather than stated, time-memory tradeoffs are absent
        outright, a memory figure exists for 1 of 120 cost cells, and no
        affected-vs-safe statement is possible while there is no transcribed
        left-hand side.
      basis: >-
        TASK-20260803-cb44ab baseline_gap_statement G1-G12. Independently
        upheld by red team TASK-20260803-9ab856 R-3, which scores 0 of 6 of the
        completion criterion's stated requirements as met.
      consequence: >-
        GOAL-MCE-001's second completion criterion is FURTHER away than
        BATCH-002-OPENING section 4 described, not closer.
    - id: O-4
      what: >-
        Five superseding knowledge entries were drafted, independently reviewed,
        and FILED: KN-LIT-c4c2ac (supersedes 4c8135), 819780 (71d1a0), 6b5b72
        (13a01d), 45b1b2 (7ee1a9), 15c85b (e37d4c). Both reviews confirm all
        five fix their stated defect and drop nothing the originals had right.
        KN-LIT-c4c2ac keeps all three conjuncts and ADDS a field condition
        (q in {2,3}) the original never carried.
      basis: >-
        TASK-20260803-a53f73; validator TASK-20260803-8cf2b6 verified the three
        conjuncts in one sentence of the re-fetched arXiv PDF and confirms only
        "the whole content of its practical reading" is retracted.
    - id: O-5
      what: >-
        Five specification-family entries FILED: KN-LIT-48b4eb, 7b78de, b7f8f8,
        209151, 9a7860. The Classic McEliece specification family was genuinely
        not held by this corpus before today, confirmed by two independent dedup
        runs (14 string probes plus a sha256 probe on all five documents, 0
        hits; four near-misses opened individually and confirmed non-duplicates).
      basis: TASK-20260803-a53f73 and TASK-20260803-f3aece agree on every probe.
    - id: O-6
      what: >-
        THE TAG CORRECTION DOES NOT ACHIEVE ITS STATED RETRIEVAL PURPOSE.
        tools/build_knowledge_index.py contains no occurrence of superseded_by;
        collect_rows() never reads it and INDEX.md has no superseded column, so
        superseded entries appear unmarked. The old entries keep their
        key-recovery tag, and
        `grep "key-recovery" knowledge/INDEX.md | grep -c -i distinguish`
        returns 4 before filing and 4 after.
      basis: >-
        Red team TASK-20260803-9ab856 R-1; verified independently by the
        Coordinator before recording (grep on the builder returns no occurrence;
        the count returns 4).
      consequence: >-
        DEC-20260803-a5b9b1's next_action promised the "distinguisher is not
        break" constraint would become "enforceable by grep". That promise is
        FALSE as designed and is retracted in DEC-20260803-18d8f3 D-3.
        Supersession is the correct IMMUTABILITY mechanism; it is not a
        RETRIEVAL mechanism, and this program conflated the two.
    - id: O-7
      what: >-
        Tag-defect prevalence, measured independently three times with three
        different parsers, in exact agreement: across 7947 tagged corpus files,
        52 key-recovery, 9 distinguisher, 4 BOTH, 5 distinguisher-only. The
        both-set is exactly the four entries named in DEC-20260803-a5b9b1 D-5.
        Within the 137 entries filed 2026-08-03: 36 / 4 / 4 / 0.
      basis: >-
        Red team TASK-20260803-08e883 (BATCH-001), producer TASK-20260803-a53f73,
        validator TASK-20260803-8cf2b6.
      consequence: >-
        The defect is LOCAL to the 2026-08-03 sweep, not a corpus-wide
        convention failure: correct single-tagging already existed elsewhere.
        BATCH-001's "4 of 4" framing was the 137-entry sub-population figure
        stated without its scope.
    - id: O-8
      what: >-
        A published cheapest-falsification control in a committed review report
        DOES NOT REPRODUCE. TASK-20260803-08e883 (BATCH-001 red team) asserted
        that KN-LIT-4c8135 mentions Goppa "exactly once" and published the
        control result `grep -c -i goppa` -> 1. The command returns 2.
      basis: >-
        Producer TASK-20260803-a53f73 found it; red team TASK-20260803-9ab856
        adjudicated against its own predecessor; validator TASK-20260803-8cf2b6
        checked every git revision of the file and found only one content
        revision, which also returns 2.
      aggravating: >-
        The BATCH-001 report QUOTED BOTH OCCURRENCES in the same paragraph as
        the control result claiming one. It printed its own disconfirming
        evidence. The error then propagated into DEC-20260803-a5b9b1 D-4 and
        BATCH-002-OPENING section 2, both false as committed.
    - id: O-9
      what: >-
        Two anomalies in the transcribed table, recorded and deliberately
        unresolved: the source never expands its own column abbreviations
        (BC/BJMM/pdw/MO/BM); and 8192128/mem-0/Dumer reads 307.4 against Stern
        303.2 where the other four mem-0 rows agree to ~0.1. The validator
        confirms 307.4 is real in the source and correctly column-assigned, so
        it is not an extraction artifact.
      basis: TASK-20260803-cb44ab; confirmed TASK-20260803-8cf2b6.
  inference: >-
    NOTHING IS ESTABLISHED ABOUT CLASSIC McELIECE'S SECURITY IN EITHER
    DIRECTION, and this record asserts nothing of the kind. No solver ran, no
    experiment was designed, no hypothesis exists, and no distance between the
    2026 attack regime and Classic McEliece was computed.

    What the batch establishes is corpus state and source content: ten
    knowledge entries are filed and five predecessors are marked superseded; a
    published estimator-output table is transcribed at 150/150 cells with its
    convention recorded verbatim; and the convention turns out to be three
    phrases without a formula, in the submitters' own document, deferred to a
    paper this program has not read.

    The batch's most useful output is negative and about this program rather
    than about McEliece: a correction it committed to does not do what its own
    decision record promised (O-6), and a falsification control it published
    does not reproduce (O-8).
  boundaries:
    - >-
      Scoped to the sources obtained on 2026-08-03 and to the five parameter
      sets of the specification's section 7. The transcribed table is the
      SUBMITTERS' document reporting a third party's estimator output; under
      this program's own rule (EV-MCE-332f99 O-7) a party to the claim is not
      an independent confirmation.
    - >-
      No cost was computed and no costing convention was adopted. ISD-FC-2026
      remains NOT ADOPTED (DEC-20260802-344883 D-6) and this goal does not bind
      to it.
    - >-
      iacr:2026/1232 is still unread. Nothing in this batch changes that, and
      KN-LIT-7c4620 remains citation_verified: web.
    - >-
      claim_tier is toy; RQ-MCE-e65b3c's ceiling is unchanged.
    - >-
      Both reviews are independent sessions on ONE resolved model
      (claude-opus-5), the same as both producers and the Coordinator. NOT
      admissible toward an AGENTS.md rule 13 quorum; no attestation is recorded
      and none may be synthesized later.
  unresolved_confounds:
    - >-
      O-6 is repaired in the record but NOT in the tooling. The corpus still
      has no retrieval-level supersession awareness, so any future grep-based
      novelty or scoping check reads superseded entries as live. Named as the
      leading candidate for BATCH-003.
    - >-
      Validator qualification: TASK-20260803-cb44ab's "no arithmetic of any
      kind" certification is contradicted by its own anomaly note, whose stated
      range "0.1-0.2" recomputes as 0.0-0.1. No transcribed value is affected.
    - >-
      Validator qualification: the producer's claim that BJMM appears nowhere
      outside the table header is false -- it appears in the source's
      bibliography -- and propagates to two files. No value affected.
    - >-
      Producer prose slip, caught by the validator: "4 of 7" is the
      literature-only figure; corpus-wide it is 4 of 9 by the producer's own
      table. O-7 above states the measured numbers rather than either summary.
    - >-
      The estimator paper (eprint 2021/1243) defining the cost model is still
      unread, so the convention behind every number in O-1 is known only by the
      three phrases in O-2.
