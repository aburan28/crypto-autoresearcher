  inference: >-
    EXCLUDED CLASS, stated exactly. On each of the 42 power-bearing records the data exclude every
    single-digit function f in {a_i(x(s_tor([k]P))), a_i(y(s_tor([k]P))) : i = 0..4} for which some pair
    (t, j), with t in F_p nonzero and j in Z/n, has
    tau_{t,j}(f) = | (1/h) sum_{k=1..h} e(t f(k)/p) e(-j k/n) | >= rho_min(p,n) = sqrt((ln((p-1)n) + 12)/h),
    with h = (n-1)/2. (The statistic is X = h tau^2 and X >= T iff tau >= rho_min.) The 42 records are the 33
    CM-canonical integer models and the 9 naive-lift random curves of RUN-CZLIFT-037e5f and RUN-CZLIFT-d37ca4,
    with 53 <= p <= 571, 47 <= n <= 613, one random generator P per record and precision 5. rho_min is
    0.28-0.98, median 0.50. For generator-covariant leaks through the even x-digits at n < 109 the effective
    floor is about 1.44 rho_min. On the pair j = 0 the excluded event is a digit-value bias, not a dependence
    on k. In words: no improvement meeting the predefined threshold was observed over the tested instances,
    parameters, solver and resource budget. NOT EXCLUDED: nonlinear or pseudorandom encodings of k (digit 0 is
    one; CHIRP and INV pass), multiplicative characters of digits (LEGMSB passes), leaks with tau below
    rho_min or carried by fewer than about sqrt(T h) values of k, multi-digit functions, digits beyond index
    4, other Weierstrass models, lifts or generators, and any n > 613. The 30 records with n <= 41 exclude
    nothing (trivial bound). On the hypothesis title the evidence is non-discriminating (see direction_scope).
    The specification's decision_impact.on_positive (closing the canonical-section clause of H2 at the
    character level; a pointer in KN-TECH-73630e) is NOT warranted by this evidence.

  boundaries:
    - 'Valid only on the 42 power-bearing records listed in tested_scope. The 30 records with n <= 41 are excluded from every statement.'
    - 'Single-pair additive-character correlation on one digit, half range, one generator per record, one model per curve, precision 5.'
    - 'Detection floor rho_min = sqrt(T/h) per record, 0.28-0.98; about 1.44x higher for covariant even x-digit leaks at n < 109.'
    - 'Toy tier; p <= 571, n <= 613. No transfer, extrapolation or scaling law to larger n is asserted. rho_min falls only like sqrt(ln(pn)/n).'
    - 'The arbitrary-lift arm is 9 power-bearing random curves with one naive integer lift each; the claim that both arms behave alike rests on that.'
    - 'No statement about deployed curves, cryptographic sizes, or the security of any system.'

  unresolved_confounds:
    - 'The shuffled control shares the permutation-invariant t = 0 term with the real series. Its full-range half-subsample reintroduces the negation mirror, and on D = -3 it inherits mu_6 orbits. It is not the null of the real series, and the bias runs toward the hypothesis (RT R2).'
    - 'The pre-registered null (|S|^2/h ~ Exp(1) per pair, Gumbel maximum) is an unnumbered random-model heuristic. It is violated by D = -3 y-digits (above), digit 0 (below) and the shuffled series. The margin of 12 absorbed the deviations without being calibrated to them.'
    - 'The falsification criterion admits a per-row reading and a per-digit aggregate reading. Under the aggregate reading a planted DL function does not falsify (VAL PTM-1 decision_rule_note). This is moot for these zero counts and load-bearing for any successor.'
    - 'Generator dependence: the half-range statistic is not invariant under change of generator for even (x) digit functions, and one generator per record was used.'
    - 'Model dependence: digit functions belong to one Weierstrass model per curve; a Z_p change of model mixes digits.'

  confound_assessment:
    - comparison: real series vs shuffled-digit control
      verdict: not_isolated
      basis: >-
        The control shares the t = 0 value-multiset term with the real series. It samples from the full range,
        so the negation mirror enters the control but not the real series. On D = -3 it carries the mu_6
        repetitions. Per-row spike probability is up to 0.167 against a stated e^-12 (RT rt_d3_output.json,
        rt_d3_aggregate_output.json).
    - comparison: real series vs uniform-digit control
      verdict: randomized
      basis: >-
        Fresh seeded uniform digits of the same shape. Calibrated on 420 power-bearing rows (ln N - 0.92 +
        0.90 G). It differs from the real series only in the digit source, but it cannot reproduce structured
        nulls (D = -3 symmetry, Weil-type cancellation of digit 0).
    - comparison: CM-canonical arm vs random-naive arm
      verdict: not_isolated
      basis: >-
        The arms differ in curve family, lift type, p and n distribution, and power (33 vs 9 power-bearing
        records). One naive lift per random curve. Both give 0 spikes, but the comparison isolates no lift
        effect.

  obstruction: null
  obstruction_note: >-
    The direction is supports, and no lane is closed, so no obstruction block is required, and none is
    asserted. The red team's reading (RT obstruction_and_resource_reading) is recorded here so it is not lost.
    The measured quantity, single-pair tau < rho_min in [0.28, 0.98] at n <= 613, is a toy-scale absence of
    one gross leak class. It is not an obstruction, and no record may cite it as the reason this lane is
    closed. The provable boundary needs no experiment: s_tor restricted to <P> is a polynomial-time group
    isomorphism onto its image, and the formal logarithm vanishes on torsion (KN-TECH-73630e). Any gain must
    therefore come from the encoding (the digits).
  resource_reading:
    examined: true
    reading: >-
      The theory that takes this measurement as its hypothesis is Fourier learning for hidden-number and
      hard-core problems (Boneh-Venkatesan 1996; Akavia-Goldwasser-Safra 2003; citations checked by
      RT-20261023-dcb217, not re-read here). Because s_tor is a computable homomorphism, g(k) =
      psi(a_i(s_tor([k]P))) has exact shift-query access g(d + r) via Q + [r]P. The Fourier mass tau =
      max_j |g^(chi_j)| is then the parameter of a DL algorithm costing about tau^-2 polylog(n) s_tor
      evaluations once the heavy coefficient is located. The red team's order-of-magnitude breakeven against
      rho is tau* ~ (c log^2 n / sqrt n)^(1/2), i.e. n^(-1/4) up to polylog factors. Whiteness for every j is
      the hypothesis under which this route fails. This experiment checks it only at tau >= 0.28 and
      n <= 613. For digit 0, Weil-type subgroup-sum bounds (Kohel-Shparlinski; Lange-Shparlinski as stated
      in Farashahi-Shparlinski arXiv:1005.4771 Lemma 5) explain the below-null maxima. For digits i >= 1 no
      such bound is known. Filed as the open problem KN-OPEN-d3a6f0, which is a question and not a resource
      claim. It changes no status.
    spawned_ids: [KN-OPEN-d3a6f0]

