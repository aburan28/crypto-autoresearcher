  proof_refs: []

  headline_framing: >-
    The row-permutation excess is a closed-form functional of the two arrays --
    the alignment of the y columns with the near-neighbour geometry of x -- and
    it measures nothing about the independence heuristic. Lattice membership is
    not what it reads: a family that is NOT in the lattice separates at 12.15,
    harder than any valid dual family measured.

  scope_statement: >-
    One LWE instance at dimension 60 (m=35, n=25), q=127, plus four constructed
    dual and non-dual families and three reviewer-constructed families. Toy
    scale.

  claim_tier_note: >-
    `measurement_toy_scale`. Membership certificates re-verified independently;
    they certify the vectors, not any inference from scores.

  direction_note: >-
    `refutes` with respect to this program's own reading. Not a statement about
    ML-KEM in either direction.

  strength_note: >-
    `strong`: both reviewers produced predictive closed forms and each built the
    family the producer's design excluded. Every printed digit of every arm was
    reproduced by the validator with a scorer written from the definition.

  what_is_established:
    - >-
      T1 RETURNED NEITHER NAMED OUTCOME, and the producer reported that rather
      than choosing a nearest label. SIEVE 1.2704 (z 6.4); MATCHED_BKZ 5.4311
      (z 167.6); MATCHED_LONG 5.3844 (z 695.7); NORMMATCH_RANDDIR 1.0868
      (z 2.4). The card's outcome B -- sieve separates, matched family does not,
      therefore the effect is about sieving -- is EXCLUDED.
    - >-
      MATCHED_BKZ IS a valid dual family of the same lattice and IS disjoint
      from the sieve database. Verified by the validator directly rather than
      assumed: 0 violating entries in 2,032,675, by int64 and by exact Python
      bigint on a 400-row sample; 0 zero rows, 0 duplicate (x,y), 0 duplicate x,
      0 v/-v pairs; intersection with the sieve empty both sign-canonically and
      raw; the 72 dropped collisions reproduce.
    - >-
      THE NORM MISMATCH DOES NOT EXPLAIN THE 4x GAP -- but the producer's
      evidence did not show that, and the validator built the family the design
      excluded to settle it. VAL_SIEVE_SUMS (certified, sieve provenance) at
      mean 362.5/258.1 separates at 1.2115, against MATCHED_LONG at 397.5/270.0
      separating at 5.3844: matched norms, 4.4x apart. Doubling the sieve's
      norms moves its excess slightly DOWN.
    - >-
      THE EXCESS IS FORCED AND HAS A CLOSED FORM. The red team derived
      excess = sqrt(1 + rho) with
      rho = sum_{i != i'} <y_i, y_i'> K(i,i') / sum_i ||y_i||^2 K(i,i),
      K = 0.5[exp(-c||x-x'||^2) - exp(-c||x+x'||^2)], and measured rho WITH NO
      SCORING AT ALL: rho = 0.718 / 31.35 / 34.39 predicts 1.3108 / 5.6880 /
      5.9487 against measured 1.2937 / 5.4461 / 5.4298. rho is linear in N
      (subsampling to 6000 predicts 1.1138 / 3.3909 against measured 1.1017 /
      3.3303). The validator independently fit a first-order model using only
      the x-database pair-distance kernel and the y columns, predicting all five
      excesses to 2-10%.
    - >-
      LATTICE MEMBERSHIP IS NOT WHAT THE STATISTIC READS. The producer's
      NORMMATCH_RANDDIR drew Gx and Gy as INDEPENDENT normals
      (surrogate.py:685-688), so it differed from a dual family in two ways at
      once. The red team built the missing arm -- the sieve's own ||x_i||,
      ||y_i|| row for row (EXACT, better than MATCHED_BKZ's +17%/+40%), random
      directions NOT in the lattice, but y_i := normalise(R^T x_i) * ||y_i|| --
      and measured excess 12.1507, against 0.9767 for the producer's
      construction.
    - >-
      THE QUANTITY IS PAIR-REDUCTION SENSITIVE, WHICH EXPLAINS THE ORDERING. The
      validator applied one round of pair reduction -- the sieve's own operation
      -- to the same pool: excess drops 5.4311 -> 3.2439 at unchanged mean
      ||x||^2. It is NOT raw clustering: the phase-free neighbour count is
      ANTI-correlated with separation (SIEVE has the highest neighbour count at
      6456 and separates least). The quantity is the alignment of the y columns
      with the near-neighbour geometry of x, on the same axis as the batch-3 red
      team's E1 at 17.078.
    - >-
      T2 both arms fail the reference. Real 7.126x below, row-permuted 9.385x
      below -- but see the integrity findings: those figures are computed
      against 1.0 in a passage arguing 1.0 is the wrong reference; against
      c4(8) = 0.96503 they are 6.877x and 9.057x. The producer's closed form for
      the shortfall reproduces to 0.57% pooled (max 1.105%).
    - >-
      T4 both items resolved and reproduced: Stage B shortfall 10.611x
      (measured N = 4253 against modelled Nf = 45128.788, labelled
      measured-vs-modelled), and the null-registry contradiction resolved
      correctly -- both statements are true of DIFFERENT statistics, so
      statistic_reads_the_object must be recorded per statistic, section 5.3 is
      correct and the JSON field is defective.

  what_is_not_established:
    - >-
      Anything about ML-KEM. No break, no security proof, no FIPS 203 parameter
      set affected or cleared, no speedup, no cost claim, no exponent moved.
    - >-
      That the independence heuristic holds or fails. Four batches in, NOTHING
      this campaign has measured tests it. Both reviewers say so explicitly.
    - >-
      That the sieve is distinctive. Its low separation is a consequence of pair
      reduction, reproduced by applying pair reduction to a non-sieve pool.

  narrowest_supported_statement: >-
    At dimension 60 with q = 127, on one LWE instance, the row-permutation
    excess statistic takes values 1.2704 (g6k sieve), 5.4311 and 5.3844 (valid
    non-sieve BKZ dual families, certified and disjoint from the sieve), 1.0868
    (norm-matched random directions with independently drawn y), 12.1507
    (norm-exact random directions with y a deterministic function of x, NOT in
    the lattice), 1.2115 (certified sums of sieve vectors at 2x the sieve's
    norms) and 3.2439 (the BKZ pool after one round of pair reduction). These
    are predicted to 2-10% by a closed form in the x-database pair-distance
    kernel and the y columns, computable with no scoring, and linear in N. The
    statistic measures the alignment of the y columns with the near-neighbour
    geometry of x; it does not measure lattice membership, it does not measure
    sieving as such, and it does not measure across-candidate score
    independence, which is what the dual-attack heuristic asserts. No ML-KEM
    break. No security proof. No statement about FIPS 203 parameters.

  narrowest_supported_statement_provenance: >-
    Composed by the Coordinator from RT-20260804-37a8f2's closed form and
    VAL-20260804-a84239's constructed families, after both reviews were
    complete.

  observations:
    - id: OBS-1
      statement: >-
        The red team recorded its own falsified hypothesis: it expected
        near-duplicate clustering, and MATCHED's median minimum pairwise
        distance^2 is 364 against the sieve's 294 -- FURTHER apart, not closer.
        Greedy pair separation changes nothing (3.2973 against 3.3303).
      supported_by: RT-20260804-37a8f2
    - id: OBS-2
      statement: >-
        The build is not bit-reproducible from its recorded command. `_sample()`
        stops on wall clock, so the same script with the same seeds produced
        10.1M draws against 8.75M, 29,032 pool vectors against 27,550, and 74
        collisions against 72 -- a different family. It IS reproducible from the
        transcript's realised counts, which the validator did bit-for-bit.
      supported_by: VAL-20260804-a84239 DEF-1; RT-20260804-37a8f2 OBJ-5
    - id: OBS-3
      statement: >-
        Raw vectors are not archived, so the membership certificate is not
        checkable from the snapshot alone. Both reviewers regenerated the
        families to check it.
      supported_by: VAL-20260804-a84239 DEF-2

  inference: >-
    The campaign designed a check that named its own refutation, and the check
    returned a third outcome neither branch anticipated. Both reviews then
    showed that outcome is forced too, by a closed form measurable without
    scoring anything. Four batches have now produced four quantities whose
    values were determined before any measurement. What has never been measured
    is the thing the heuristic actually asserts.

  heuristics_relied_on:
    - id: H-SCALE-1
      statement: That toy-scale behaviour transfers to cryptographic dimensions.
      status: >-
        MOOT for this observable, which is a geometric functional forced at
        every scale.

  boundaries:
    - Toy scale. dim 60, q = 127, ONE instance.
    - >-
      The closed forms are first-order. The red team's predicts to 2-10%; the
      validator's independent model likewise. They identify the mechanism, not
      every residual.
    - >-
      Pre-registration ordering is UNABLE TO CHECK: surrogate.py v1 was not
      archived and its hash and timestamp are unattested. Mitigating, as the
      validator notes: the frozen rule mechanically emitted a verdict hostile to
      BOTH named outcomes, which is not what a post-hoc rule looks like.

  unresolved_confounds:
    - >-
      What the heuristic actually asserts -- across-candidate score dependence
      -- has not been measured in four batches.
    - >-
      The FFT-bin candidate family, unmet since batch 3.

  evidence_integrity_findings:
    - id: INT-1
      finding: >-
        The claim that T2's iid shortfall had "never been reported in three
        batches" is FALSE. RT-20260803-d2e23e section 3 reported 7.1x and 9.4x.
        The false claim appears in the producer's report, in the Coordinator's
        snapshot commit message e8cc366e, AND in the new knowledge entry
        KN-TECH-9d21c4.
      raised_by: VAL-20260804-a84239 DEF-4
      materiality: >-
        High as provenance. The Coordinator asserted novelty for a finding an
        archived reviewer had already recorded, and propagated it into a
        knowledge entry. Corrected in DEC-20260804-5c9fe1.
    - id: INT-2
      finding: >-
        7.126x and 9.385x are computed against 1.0 in the same passage that
        argues 1.0 is the wrong reference. Against c4(8) = 0.96503 they are
        6.877x and 9.057x. Carried into KN-TECH-9d21c4.
      raised_by: VAL-20260804-a84239 DEF-3; RT-20260804-37a8f2 OBJ-6
      materiality: Moderate. Direction unchanged, magnitude overstated.
    - id: INT-3
      finding: >-
        The T1 sensitivity demonstration is scored against the MOST separating
        arm, giving about 50x; against the sieve it is 3.1x. The red team adds
        that the "about 50x dynamic range" divides by noise, its own replication
        giving -0.023.
      raised_by: VAL-20260804-a84239 DEF-7; RT-20260804-37a8f2 OBJ-8
      materiality: >-
        Moderate, and it is the failure the new knowledge entry was meant to
        prevent -- obligation 3 has no threshold and no named comparator.
    - id: INT-4
      finding: >-
        The Coordinator's snapshot commit message e8cc366e contains six
        present-indicative conclusions after stating "I draw no conclusion",
        plus the reference error of INT-2. The red team notes that BATCH-c45baf
        OBJ-9 named this exact class and the fix was not applied.
      raised_by: RT-20260804-37a8f2 OBJ-7
      materiality: >-
        A REPEAT of an identified defect, which is worse than a new one. Both
        reviewers searched for a security claim and found NONE.

  coordinator_observations_unreviewed: []

