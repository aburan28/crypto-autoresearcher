  scope_statement: >-
    Neutral record-acceptance of an arithmetic/review package only. The
    package recomputes a corrected charging-law comparison from committed
    EXP-WESOVOW-001 and RUN-WESOVOW-001 literals; those identifiers are source
    context, not a new experiment or run measurement. No hypothesis status,
    research-direction status, goal status, security claim, attack claim,
