    - >-
      No hypothesis status, experiment status, research-direction status, or
      GOAL-SSI-001 status changes. The goal remains active and its completion
      criteria are not met or approached by this arithmetic package.
    - >-
      The P=512 citation prohibition is unchanged. The two-anchor disagreement
      is an unresolved interpretation boundary, not evidence for lifting it.
  unresolved_confounds:
    - >-
      RG-2 tests the corrected law at a supplied log2(M) used as the exact cap
      input and therefore does not independently validate the provenance of
      that memory anchor.
    - >-
      RG-3 is a capable-of-failing discrimination control at one low-memory
      probe, not a universal control over every point of the six-budget grid.
    - >-
      The anchor-dependent P=512 crossover and endpoint signs require a source
      reconciliation and fresh independent review before any citation or
      official interpretation.
