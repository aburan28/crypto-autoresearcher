  observations:
    - >-
      The snapshot-bound producer package contains a 240-row recomputation:
      120 rows for the fitted_opt anchor and 120 for the PAPER_PAIRS anchor,
      covering field sizes 256, 384, 512, 576 and 768, log2(w) values 30, 40,
      50, 60, 70 and 80, and overhead c values 0.0, 0.5, 1.0 and 2.0.
      The two anchors remain separate in every row.
    - >-
      The independent Validator report records zero formula mismatches above
      2e-12 for corrected time, committed/null time, overhead, speedup and
      crossover when its arithmetic recomputation is compared with the
      producer table. This is a review observation about committed literals,
      not a newly measured runtime or attack result.
    - >-
      RG-1 is recorded as CONFIRMED: 120 committed-law cells reproduce with
      maximum absolute difference 0.0 at tolerance 1e-9. RG-2 is recorded as
      CONFIRMED WITH CAVEAT: 10 exact-cap rows pass the corrected identity and
      distinguish the committed/null law, while the supplied log2(M) is also
      the cap input. RG-3 is recorded as CONFIRMED: all 10 rows at the fixed
      log2(w)=30 probe discriminate the corrected and committed/null laws.
    - >-
      The fitted_opt and PAPER_PAIRS anchors produce different crossover
      behavior, including opposite signs at the P=512, w=2^80, c=0 endpoint.
      The Validator therefore preserves anchor ambiguity and does not choose
      an anchor for an official interpretation.
    - >-
      The exact boundary is preserved: "The `P=512` crossover value and its
      `w=2^80` sign are **NOT citation-eligible**. This task does not lift that
      prohibition. Only a committed Coordinator decision on independently
      reviewed evidence can lift it."
  inference: >-
    The committed review supports accepting this record as a neutral,
    arithmetic-only correction and measurement-hygiene outcome. It does not
    support a hypothesis-level inference: the producer and Validator establish
    only that the stated ratio-anchored formula and its finite-grid arithmetic
