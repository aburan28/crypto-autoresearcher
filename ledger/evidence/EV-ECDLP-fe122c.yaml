    - id: SYSTEM-PEAK-LIVE-CONCURRENCY
      status: CONFIRMED_CORRECT_RULE_AND_SIX_DISCRIMINATING_KATS
      by: [validator TASK-20260815-9b0fb4, red-team TASK-20260815-d7c570]
