  observations:
    - PRODUCER-POLICY-RESOLUTION-BINDING, HA2-EXPECTATION-NOT-TAIL, and SYSTEM-PEAK-LIVE-CONCURRENCY are each independently recomputed and confirmed genuinely repaired, not merely re-asserted.
    - >-
      A. Markov-bound serialization mislabel (red-team CTRL-HA2-MARKOV-TRUNCATION-RELABEL;
      validator VAL-9B0FB4-MARKOV-SERIALIZATION-LABEL -- same finding, independently
      reached): 3 of 5 tuplewise-Markov rows (bits 18, 27, 30) match half-up
      rounding, not the declared truncation. Numbers correct and slightly
      more conservative; only the stated derivation method is wrong.
    - >-
      B. Bit-width arithmetic error (red-team only, CTRL-BITWIDTH-CORRECTION):
      three artifacts state "needs at least a 14-bit index" for 8185
      admissible candidate_index values; 2^13=8192 >= 8185, so 13 bits
      suffice. New to this successor; sits in forward guidance for a
      not-taken route and does not affect the REVISE disposition.
    - >-
      C. Peak-KAT suite coverage gap (red-team CTRL-PEAK-PARTIAL-OVERLAP-KAT,
      independently confirmed sound by the validator's own full recomputation
      of the same six KATs): all six current KATs test only full-coincidence
      or full-disjointness topologies; none tests genuine partial overlap.
      Red Team constructed a concrete counterexample (shard j live on
      [j,j+4) for j=1..8, shared=0, dedup=0; correct peak 4 throughout the
      interior) that a plausible-but-wrong implementation special-casing
      only the two extreme topologies would pass all six existing KATs
      while failing.
    - >-
      D. Archive/communication itemization gap (red-team only,
      CTRL-ARCHIVE-COMMUNICATION-ITEMIZATION): the output residual has a
      12-row itemized manifest independently re-summed by both reviewers to
      exactly 15520768; archive and communication remain opaque scalars with
      no itemized per-mount/per-stream breakdown anywhere.
    - >-
      E. Repair-commit-provenance mislabel in the snapshot receipt's own
      repair_disclosure block (validator only, VAL-9B0FB4-REPAIR-COMMIT-PROVENANCE-LABEL)
      -- corrected via CORR-20260815-092c9f, not by another producer
      successor task.
    - RT-OBJ3 (crossover-N estimate) and RT-OBJ4 (k-list/generalized-birthday baseline) remain open, non-blocking, and deferred, confirmed not narrowed by either reviewer.
    - Archive, communication, and output overages remain exactly 3256009664, 3285369792, and 7132160 bytes, plus a newly disclosed PEAK-AGGREGATE-FIT-UNPROVED residual with no numeric figure anywhere in the inherited chain, honestly disclosed rather than concealed.
    - RT-OBJ2's closure, the worst-case candidate_index bound [504,1016,2040,4088,8184] against capacity 32, the thirty-third-distinct-value overflow rule, and the DERIV-1 bits=27 literal 0.0000304579734802 all independently recompute unweakened.
    - Quarantine of EXP-SYC-24123d, TASK-20260811-5e4a0f, and TASK-20260813-a8dc5e confirmed cited nowhere as evidence or authority by either reviewer.
