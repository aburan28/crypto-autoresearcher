    three carries no cross-implementation-family or cross-platform weight; it carries
    generation-class weight, because the Validator and Red Team each independently
    transcribed PREREG-3's formulae and independently read the raw source code rather than
    importing the producer's module or each other's findings, and reached F-1/RT-1 by
    partially different supporting evidence (the Validator's epsilon-contrast class; the Red
    Team's same-host record and built rdet control). THIS DECISION DOES NOT EXEMPT ITSELF
    FROM THE STANDARD F-1/RT-1 APPLIES TO THE PRODUCER: both reviews of this batch are, by
    their own account, two SESSIONS ON ONE MODEL -- the identical shape of dependence F-1/RT-1
    criticizes in PREREG-3's own "ROUTE-I" claim.

