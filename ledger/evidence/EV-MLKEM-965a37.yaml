  # ==================================================================
  # THE TERMINATION BRANCH
  # ==================================================================
  termination_branch:
    branch: T-C3LANE-OPEN-PARTIAL, read off PREREG-3 3.5's frozen precedence.
    read_off: >-
      COVERED = 18 of 27 cells (lam1n 9/9, hkz 9/9; rawtail 0/9 counted, 1 ROUTE-W-labelled
      and excluded), so T-C3LANE-NODATA does not fire. D_route(X,L,b) = 0.0 exactly (bit-
      identical at every matched basis) at all 18 covered cells, while s_c^fib(X,L,b) is
      strictly positive at every one (lam1n: 0.0388-0.0848; hkz: 0.0038-0.0239) -- no ties,
      so every covered cell verdicts EXCEEDS and none verdicts DOES NOT EXCEED. ALL-CLEAR
      cannot hold on this data; SOME-EXCEEDS holds, and PREREG-3 3.5's stated precedence
      gives it priority over ALL-CLEAR whenever both could otherwise be read from the same
      data, so T-C3LANE-OPEN fires and T-C3LANE-OBSTRUCTED is precluded. Coverage 18/27 <
      27/27 (or 16/27 < 27/27 under RT-2's correction), so the -PARTIAL suffix applies.
      BOTH REVIEWS RE-DERIVED ALL OF THIS INDEPENDENTLY from results_c3lane.json's raw
      per-cell verdicts with NO producer import (Validator MR-1..MR-4, 27/27, 0 mismatches;
      Red Team section 5, same branch). BOTH REVIEWS CONFIRM THE BRANCH IS ROBUST: the
      Validator under a stricter L7-only coverage reading (CC-5: excluding all 12 am4-
      derived L9/L11 cells, COVERED = 6/27, all 6 EXCEEDS, same branch); the Red Team under
      its own corrected coverage reading (RT-2: COVERED = 16/27 genuine, all 16 EXCEEDS,
      same branch). T-C3LANE-OBSTRUCTED could not have fired under any reading either
      review could construct, because that requires ALL-CLEAR (every covered cell DOES NOT
      EXCEED), which is arithmetically impossible given D_route = 0.0 and s_c^fib strictly
      positive at every covered cell under either reading.
    the_clause_quoted_verbatim_from_prereg_3_3_5: >-
      "T-C3LANE-OPEN -- FIRES WHEN COVERED is non-empty and SOME-EXCEEDS holds (dispersion
      exceeds route disagreement at at least one covered cell). MEANS: at that cell, the
      reduction-dependent observable carries measurable fibre content beyond what its two
      committed routes disagree about -- the numerical floor that blocked A-1 for the
      in-scope candidates is not shown to block this one."
    what_it_licenses_quoted_verbatim: >-
      "a statement that 'a successor assumption analogous to A-1, restricted to the
      reduction-dependent candidates and to the covered cells/routes, has a domain worth
      stating' -- and nothing stronger."
    what_it_forbids_quoted_verbatim_and_honoured_in_full:
    - treating this as A-1 held for lam1n/hkz/rawtail (A-1 was never stated over them and
      this measurement does not state it now)
    - specifying any dispersion criterion, fibre clause or gate on the strength of this
      branch alone
    - any claim about ML-KEM, any FIPS 203 parameter set, any attack cost or any cost model
    - closing, pausing or completing GOAL-MLKEM-005
    the_license_further_qualified_by_the_central_finding: >-
      Given F-1/RT-1 (below), the domain-worth-stating license this branch permits is itself
      qualified beyond PREREG-3 3.5's own floor: worth stating ON THE COVERED CELLS, UNDER
      CODE-SHARED CROSS-ENVIRONMENT REPRODUCIBILITY, NOT UNDER INDEPENDENT VERIFICATION. A
      future reader citing T-C3LANE-OPEN-PARTIAL from this batch may not silently upgrade it
      to "independently confirmed." This qualification is stated here so it travels with the
      branch's license at every future citation, exactly as this goal's "PORTABILITY not
      cross-platform" qualification already travels with the L7/L8 headline.

  # ==================================================================
  # RC-1 / RC-2 DISCHARGE
  # ==================================================================
  rc1_rc2_discharge:
    rc1: >-
      DISCHARGED. BATCH-6b6e78's headline count of 1,416 changing VAR-F cells is superseded:
      the count is 1,313 under PREREG-2 2.6's own declared route_provenance. Carried verbatim
      from PREREG-3 section 1 into TASK-20260813-7b3039's report_c3lane.md, with NO
      recomputation (measure_a1.py, results_a1.json and report_a1.md, commit
      4e466c6bf221ea002fe84311baccdb816081a8cd, were not read for re-derivation, not edited
      and not re-run). Both reviews independently confirm the carry is verbatim (Validator
      CC-1; Red Team section 6). What is unchanged, restated: 49 of 330 blocks change
      verdict; concentration on routes R4 and R2 only; zero contribution from R0/R1/R3/R5;
      route R2's own contribution of exactly 20; and T-A1-FALSIFIED-PARTIAL, which remains
      the branch that fired for BATCH-6b6e78 and is untouched by this correction.
    rc2: >-
      DISCHARGED. The false "P-A12a mis-scored HELD ... left unedited" narrative of
      report_a1.md section 10 and the TASK-20260813-48240d archive commit message is
      superseded: results_a1.json's PREDICTION_REGISTER.items["P-A12a"].OUTCOME reads
      "FALSIFIED", not "HELD", and always did. Carried verbatim from PREREG-3 section 2 into
      report_c3lane.md, with NO recomputation. Both reviews independently re-confirmed this
      DIRECTLY against the committed results_a1.json, never via any report's prose (Validator
      CC-3: "HELD" occurs exactly 3 times in the raw file, never against P-A12a; Red Team
      section 6). The immutable commit 4e466c6bf221ea002fe84311baccdb816081a8cd and its
      message are NOT edited and remain history; this record and DEC-20260813-28d7b2 are the
      correction a later reader needs. The substantive value (FALSIFIED at 22 cells) was
      correct throughout and needed no correction.
    not_durable_until: >-
      Both RC-1 and RC-2 are discharged AS TEXT by this record; per PREREG-3 3.7, "RC-1 and
      RC-2 are discharged only when that record commits and the verifier accepts it" -- this
      record freezes and publishes the text, and discharge becomes durable and official only
      once this ledger archive commits and the post-commit verifier accepts it.

  # ==================================================================
  # THE CENTRAL FINDING -- CONVERGENT, INDEPENDENTLY FOUND BY BOTH REVIEWS
  # ==================================================================
  central_finding_f1_rt1: >-
    F-1 (Validator, severity MAJOR) / RT-1 (Red Team, severity CRITICAL): PREREG-3's
    "ROUTE-I" is not algorithmically independent of ROUTE-P. `make_A`, `build_basis` and
    `hkz_profile` -- the actual numerical kernel that produces every lam1n/hkz value at
    every covered cell -- are shared VERBATIM across all three named sources
    (`measure_am4.py` -> `measure_relvar.py` -> `replicate_l7l8.py`), each downstream file's
    own docstring stating so explicitly ("CARRIED VERBATIM from ..."). For `L7` the two
    "routes" additionally ran on the SAME HOST (`results_l7l8.json`'s own `environment`
    block: `ENVIRONMENTS_DIFFER: false`, every field matching the producer's). For `L9`/`L11`,
    `results_am4.json` genuinely ran on a different host (macOS vs Linux), but runs the SAME
    carried-verbatim code, so environment diversity alone does not establish algorithmic
    independence -- and this goal's own binding carry already bars over-reading that kind of
    match ("'genuinely cross-platform' is NOT citable"). `D_route = 0.0` at every one of the
    18 covered cells is therefore explained by SAME-CODE, CROSS-ENVIRONMENT REPRODUCIBILITY,
    not by independent-algorithm cross-validation. `report_c3lane.md`'s own characterization
    of the L9/L11 contribution -- "This is a genuinely independent computation ... executed
    in a different environment" -- OVERSTATES what it establishes; the "different
    environment" clause is true narrowly but is not disclosed alongside the shared-kernel
    fact.
    THIS CHANGES NO NUMBER AND NOT THE TERMINATION BRANCH (both reviews independently confirm
    robustness above). It DOES change what the EXCEEDS verdicts and T-C3LANE-OPEN's licensed
    statement can be read to support: the batch shows the observables' fibre dispersion is
    nonzero and detectable through this pipeline, and exceeds this specific corpus's own
    same-code reproducibility floor -- it does NOT show that two algorithmically
    independent implementations agree that the dispersion is real.
    THE RED TEAM'S OWN-THESIS-COMPLICATING CONTROL, reported honestly and at full weight
    against its own argument: it built `D_route(rdet)` at `L11`, basis 0, comparing
    `results_relvar.json` (Linux) against `results_am4.json`'s `probe_L_supplementary` block
    (a genuinely different host, macOS) -- real cross-machine data, not the same-host L7
    case -- using the corpus's own carried-verbatim `rdet_of`/`build_basis` code. Result:
    `D_route(rdet) = 0.0` exactly, confirming the code-sharing mechanism generalizes beyond
    lam1n/hkz to a candidate nobody in this goal disputes. HOWEVER, `rdet`'s own `s_c^fib` is
    ALSO exactly `0.0` at every cell checked, because `|det B| = q^(d-k)` is algebraically
    independent of the random matrix draw -- the same "forced by algebra" phenomenon this
    goal's own `G_VAR`/`AM-11` machinery already documents for `X_null`. So `rdet` TIES OUT
    (`"DOES NOT EXCEED"` under the frozen tie rule) rather than demonstrating a false-positive
    `EXCEEDS`. The Red Team searched `results_relvar.json`'s own candidate list and found no
    non-target candidate that is simultaneously not one of the three under scrutiny and has
    genuine, non-algebraically-forced fibre dispersion. RECORDED PLAINLY: WHETHER THE 18 (OR
    16) EXCEEDS VERDICTS WOULD STILL FIRE UNDER GENUINE ALGORITHMIC INDEPENDENCE REMAINS
    OPEN. This control neither confirms nor refutes that question; it is not resolved either
    way by this batch.

  # ==================================================================
  # THE COVERAGE-DEFECT FINDING -- RED TEAM ALONE
  # ==================================================================
  coverage_defect_finding_rt2: >-
    RT-2 (Red Team, severity MAJOR, single-source): `results_am4.json`'s `gates.<X>.G_REL1`
    block reports `hkz` only at the two `REL1_PAIR` endpoint betas per lattice (`L9`: 7 and
    22; `L11`: 10 and 30) -- never the middle beta either lattice's 3-point grid uses (`L9`:
    15; `L11`: 20). `measure_c3lane.py` never reads `X_hi` (confirmed by direct grep of the
    committed source) and reuses the single beta_lo-based comparison uniformly across all
    three betas of each lattice for `hkz`. The Red Team verified `hkz` genuinely depends on
    beta (`am4`'s own `X_lo` != `X_hi`: `L9` -0.3334 vs -0.1125; `L11` -0.4247 vs -0.1310),
    unlike `lam1n`, which does not (`X_lo == X_hi` exactly, so `lam1n`'s equivalent reuse is
    legitimate and this finding does not extend to it). Consequence: `hkz/L9_b15` and
    `hkz/L11_b20` are FALSELY MARKED COVERED with no genuine per-beta `am4` comparison at
    all; `hkz/L9_b22` and `hkz/L11_b30` cite the WRONG BETA's value as their `D_route`
    source (numerically harmless -- the Red Team independently computed the true `beta_hi`
    comparison for both mislabelled cells and it is also exactly `0.0`, so no reported
    `D_route` value is numerically wrong on the evidence checked). GENUINE COVERAGE NARROWS
    FROM 18 TO 16 OF 27 (9 `lam1n` + 7 genuinely-covered `hkz`: `L7` all 3, `L9` `b7`/`b22`,
    `L11` `b10`/`b30`). EFFECT ON THE TERMINATION BRANCH: NONE -- all 16 genuinely-covered
    cells still verdict EXCEEDS, so `T-C3LANE-OPEN-PARTIAL` still fires. This is a
    coverage-table / provenance-labelling defect in `R-C-OUT-0`, which PREREG-3 3.2
    explicitly designates a first-class, independently-checkable deliverable, not (on the
    evidence checked) a verdict-flipping one. NOT independently cross-checked by the
    Validator, whose own report does not address this specific defect; recorded here as
    single-source pending a superseding correction of `R-C-OUT-0`.

  # ==================================================================
