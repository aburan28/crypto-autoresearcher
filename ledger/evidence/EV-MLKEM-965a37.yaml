    other's write scope, independently read the actual source code of all three named
    ROUTE-P/ROUTE-I scripts and independently reached the same conclusion by different
    supporting methods -- the Validator via a line-for-line function-body diff plus a
    corpus-internal contrast class (near-epsilon-but-nonzero residuals where the comparison
    is a genuine algebraic transform rather than re-executed code); the Red Team via the same
    diff plus the L7 same-host environment record plus a BUILT control on `rdet` across
    genuinely different hosts. It is explicitly NOT claimed for the two single-source items:
    the coverage-table defect (RT-2, Red Team alone, not yet cross-checked by the Validator)
    and the folded-YAML-scalar defect (F-2, Validator alone, not yet cross-checked by the Red
    Team) -- both are recorded as findings of `anecdotal`/single-session strength, not rounded
    into the `replicated` claim.
    WHAT `replicated` DOES NOT MEAN HERE, restated because it is load-bearing every time this
    goal writes it: NOT model-level and NOT environmental. AGENTS.md rule 12 is UNMET AND
    UNWAIVED. The producer, the Validator and the Red Team all resolve to the SAME MODEL
    (claude-sonnet-5) on, per the Red Team's own `host_measured` note, the same sandboxed
