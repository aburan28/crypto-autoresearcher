  strength: replicated
  strength_basis: >-
    `replicated` is claimed for the admissible core listed above -- the arithmetic at all 27
    cells, the aggregate verdict, and the termination branch -- each independently re-derived
    from the frozen text by a Validator implementation that imports NO producer module and by
