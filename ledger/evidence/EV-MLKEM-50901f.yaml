  type_note: >-
    Measurement plus a scope analysis of the cost model. Continues
    EV-MLKEM-da9e3b at the same toy scale (dim 60, q=127) with a real
    instrument rebuild, per-group error bars, and the vector-null batch 1 owed.
  direction: mixed
  strength: moderate
  claim_tier: measurement_toy_scale
  certificate_refs:
    - "dual-membership: 447,975 entries recomputed from A and X alone, 0 violations, by BOTH reviewers independently"
  proof_status: empirical_only
  proof_refs: []

  headline_framing: >-
    The instrument is NOT blind. The red team's row-permutation null -- which
    preserves both multisets and every column marginal and removes only which y
    pairs with which x -- separates the real sieve database from its surrogate
    on the statistics that actually read y, and the separation does not decay
    as 1/sqrt(N) while the surrogate's does. The batch's own PAC-1 blindness
    conclusion, and the Coordinator's restatement of it, are refuted.

  scope_statement: >-
    One primary instance plus 9 replicates at dimension 60 (m=35, n=25),
    q=127, secret centred-binomial eta=2, error rounded-Gaussian sigma=2, g6k
    bgj1_sieve, 17,919 vectors. Toy scale. Nothing here is a statement about
    FIPS 203 dimensions or about ML-KEM's security.

  claim_tier_note: >-
    `measurement_toy_scale`. The dual-membership certificate was independently
    recomputed by both reviewers from A and X alone; it certifies the vectors,
    not any inference from their scores.

  direction_note: >-
    `mixed`: the batch's central negative conclusion is refuted, one positive
    separation is reported for the first time in this campaign, and the batch's
    own impossibility headline is narrowed to the harness.

  strength_note: >-
    `moderate` and not higher: the separation is ONE UNREPLICATED REVIEWER
    COMPUTATION on one instance. The cheapest replication is named below and
    was not run in this batch.

  what_is_established:
    - >-
      THE ROW-PERMUTATION NULL SEPARATES THE REAL DATABASE FROM ITS SURROGATE.
      Preserving the exact multiset of x, the exact multiset of y, and every
      column marginal, and removing only the pairing:
      near-miss sd ratio 0.142888 real against 0.105408 +/- 0.000991 permuted
      (+35.6%, about 38 surrogate sd); correct minus best-of-8 near-miss
      0.001522 against 0.001761 +/- 0.000011 (-13.6%, about 22 sd, five times
      the batch's own instance sd). Random directions of matched ||x|| give
      0.104707 +/- 0.001475 and 0.001808 +/- 0.000011.
    - >-
      THE SEPARATION DOES NOT DECAY LIKE THE SURROGATE'S. Excess at
      N' = 500/2000/8000/17919 is 1.062/0.987/1.193/1.354: the surrogate decays
      as 1/sqrt(N), the real database does not. This is the inventor-protocol
      decay control applied to the reviewer's own finding, by the reviewer.
    - >-
      PAC-1's GENERALISATION IS REFUTED, and the mechanism is identified.
      NULL-V's `statistic` field is mean_i cos(2 pi x_i . e / q) -- the
      correct-secret score, which CONTAINS NO y AT ALL. Lattice membership is
      exactly y = A^T x mod q. A statistic that never reads y cannot depend on
      it except through ||x||, which the surrogate matches by construction. So
      NULL-V could not fail with respect to three of the four objects its own
      `removes_object` field names. That is batch 1's NULL-T defect one level
      up.
    - >-
      P1's IMPOSSIBILITY RESULT IS REAL BUT NARROW. Nf line 540 is a genuine
      identity with no override path, and R1 (k_lat = n) is forced by the run
      (mean ||y||^2 = 129.56, rms 2.28 per coordinate -- all 25 secret
      coordinates genuinely absorbed). But R2 is a FREE DESIGN CHOICE:
      compare.py:372-379 is literally `if k==0 and k==25`. R1 alone pins
      (k_enum, k_fft) = (0, 0), so the tuple (35, 0, 0, ., ., 60) IS
      admissible, gives Nf = 2.978518720180076, and the producer's own
      wellposedness.md section 5 uses it. Honest maximal scope: any design that
      sieves the full m+n dual lattice AND scores at least one candidate not
      equal to s. NOTHING HERE BEARS ON KN-OPEN-016.
    - >-
      The instrument rebuild was real -- a new venv, both packages from scratch,
      both KN-TECH-14efa5 link fixes needed and applied, /tmp/sagevenv never
      invoked. RT OBJ-9 from batch 1 is answered.
    - >-
      P1b closed a four-batch-old gap. 10 of 10 known-answer checks passed.
      Callable identity confirmed: LWE.dual_hybrid IS
      estimator.lwe_dual.matzov (type MATZOV), while
      estimator.lwe_dual.dual_hybrid is a different module-level function
      wrapping DualHybrid. KA-6 round-trips the pinned repo's own documented
      Kyber512 value, reproduced independently by both reviewers at
      log2(rop) = 115.50989392, beta = 395, p = 5, zeta = 0, t = 40.
    - >-
      D1 is Sheppard's correction, principled and not fitted:
      Var = 4.0833333 = sigma^2 + 1/12 exactly, closed form
      exp(-a_x / 12 sigma^2) = 0.98162 predicting both the -1.8% offset and the
      decile trend with zero free parameters. Both reviewers verified this
      independently.
    - >-
      The certificate re-derives exactly: 447,975 entries recomputed from A and
      X alone by each reviewer's own integer arithmetic, 0 violations.

  what_is_not_established:
    - >-
      Anything about ML-KEM. No break, no security proof, no FIPS 203 parameter
      set affected or cleared, no speedup, no cost claim.
    - >-
      That the independence heuristic fails. The separation is one statistic on
      one instance, unreplicated, at toy scale.
    - >-
      That the instrument is blind. That conclusion is refuted, but its
      refutation is likewise one reviewer computation.
    - >-
      Any statement about MATZOV.Nf's domain. P1's result is about this
      harness's design choices, not about the cost model.
    - >-
      Anything reachable at the corner this design occupies. At the pinned
      estimator's own ML-KEM-512 optimum (zeta = 0, t = 40, p = 5) the term
      exp(k_fft/3 (sigma_s pi / p)^2) equals 2685.7 = 2^11.39. This design's
      corner is the corner the optimiser never selects.

  narrowest_supported_statement: >-
    At dimension 60 with q = 127, on one LWE instance and one g6k bgj1_sieve
    database of 17,919 vectors certified to lie in the dual lattice, a
    row-permutation surrogate that preserves the multiset of x, the multiset of
    y, and every column marginal, and removes only the x-y pairing, differs
    from the real database on statistics that read y: near-miss score sd ratio
    0.142888 against 0.105408 +/- 0.000991, and correct-minus-best-of-8-near-
    miss 0.001522 against 0.001761 +/- 0.000011. The excess does not decay as
    1/sqrt(N) over N' = 500 to 17,919 while the surrogate's does. This is one
    unreplicated computation by one reviewer on one instance at toy scale. It
    is not a statement about ML-KEM, about FIPS 203 parameters, about the cost
    of any attack, or about whether the dual-attack independence heuristic
    holds at cryptographic scale. No break. No security proof.

  narrowest_supported_statement_provenance: >-
    Composed by the Coordinator from RT-20260803-dc7568's measured table after
    both reviews were complete. It fills no field of either reviewer's schema.

  observations:
    - id: OBS-1
      statement: >-
        The 1015x ambiguity range the producer reported for N_pred is
        MANUFACTURED: 8 of its 12 grid cells violate the very identity that
        proves emptiness. Over consistent cells the spread is 1.38x.
      supported_by: RT-20260803-dc7568
    - id: OBS-2
      statement: >-
        The R-A reading is TESTABLE and was not tested: N_pred 2.98-5.65
        against a measured distinguishing threshold near N' = 8.
      supported_by: RT-20260803-dc7568
    - id: OBS-3
      statement: >-
        The producer's proof premise `candidates_differ_on_coordinates = 25` is
        falsified by its own vectors.json for 19 of 33 wrong candidates -- the
        8 near-miss differ on exactly 1. The conclusion survives under the
        stronger correct premise. A defective proof of a true statement, and
        the 351-pair enumeration is a tautology that could not have caught it.
      supported_by: VAL-20260803-124629 defects 2 and 3
    - id: OBS-4
      statement: >-
        Sheppard's correction does NOT shrink at cryptographic q -- it grows
        with a_x (7.7x on N for a rounded Gaussian at a = 18.4). ML-KEM is
        spared only because CBD deviates at fourth order (1.24x-1.38x).
      supported_by: RT-20260803-dc7568
    - id: OBS-5
      statement: >-
        Near-miss decay control, run by the validator because the producer
        skipped it: c4-corrected sd ratio 0.146/0.213/0.234/0.325/0.352/0.352
        at Hamming distance 1/2/3/5/8/12. The quantity DOES decay under the
        parameter meant to destroy it, so the canonical artifact tell does not
        fire.
      supported_by: VAL-20260803-124629

  inference: >-
    Batch 2 was designed to make a comparison well-posed and instead produced
    two results neither reviewer expected: the comparison this harness can make
    is narrower than claimed, and the instrument is sharper than the batch
    concluded. The first positive separation of this campaign exists, on the
    statistics that read y, with its own decay control run by the reviewer who
    found it. It is one computation on one instance and is recorded at exactly
    that weight.

  heuristics_relied_on:
    - id: H-SCALE-1
      statement: >-
        That behaviour at dimension 60, q = 127 transfers to cryptographic
        dimensions.
      status: >-
        OPEN and known incomplete, inherited unchanged from EV-MLKEM-da9e3b.
        OBS-4 above is direct evidence that at least one correction behaves
        OPPOSITELY to the naive expectation as scale grows.

  boundaries:
    - Toy scale. dim 60, q = 127, one modulus, one sieve algorithm.
    - >-
      The separation is unreplicated. The cheapest replication -- emit the 9
      replicate instances' (x, y) and repeat the row-permutation null, roughly
      ten minutes of numpy with no sieve -- was named by the red team and NOT
      run in this batch.
    - >-
      Ingredient-2 uniform precision is 1.00 +/- 0.05, not the "0.2%" the
      producer reported; the validator puts the overstatement at about 25x and
      the red team at about 8x.

  unresolved_confounds:
    - >-
      Whether the row-permutation separation survives the 9 replicate
      instances. Unrun.
    - >-
      Whether the near-miss concentration has any counterpart at a corner the
      optimiser would actually select, given the 2^11.39 term is identically 1
      here.

  evidence_integrity_findings:
    - id: INT-1
      finding: >-
        The Coordinator's snapshot commit message at e08462ac states that the
        headline observable "CANNOT distinguish the sieve database from any
        vector family of the same lengths" and that "the design cannot yet see
        what the campaign wants to see". Both are FALSE UNIVERSALS drawn from
        one statistic, one surrogate and one instance, and both are refuted by
        the row-permutation null.
      raised_by: RT-20260803-dc7568
      materiality: >-
        High, and this is the FOURTH Coordinator overclaim in an immutable
        commit message in this program (BATCH-010, 1cd863b1, 8cc51677, now
        e08462ac). It is the first in the PESSIMISTIC direction, which the
        inventor protocol treats as symmetric with overclaiming: it would have
        argued away the campaign's only positive signal. All four were caught
        by red team; none by the Coordinator.
    - id: INT-2
      finding: >-
        The producer's PAC-1 blindness conclusion rests on a null whose
        statistic does not read y, so it could not fail with respect to three
        of the four objects its own `removes_object` field names. The batch-1
        NULL-T defect recurred one level up, in the batch designed to fix it.
      raised_by: RT-20260803-dc7568
      materiality: >-
        High. The corrective rule adopted in DEC-20260803-d810d0 PD-1 required
        each null to NAME the object whose removal it tests. It did name them.
        Naming is not sufficient; the statistic must be able to see the object.
    - id: INT-3
      finding: >-
        EV-MLKEM-da9e3b's OBS-6 z-statistic was mis-specified: a rank among 9
        was treated as normal. The observed event has probability 0.1020
        against the exchangeable 1/9 = 0.1111 -- a one-in-nine event scored as
        one-in-a-hundred. The OBSERVATION as written is true; the statistic
        attached to it is not.
      raised_by: VAL-20260803-124629; RT-20260803-dc7568 concurring on the facts
      materiality: >-
        Moderate. Recorded here as a correction of interpretation. EV-MLKEM-
        da9e3b is NOT superseded -- see the decision's reviewer-disagreement
        block.

  coordinator_observations_unreviewed: []

