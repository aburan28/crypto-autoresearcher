    - >-
      Controls and baselines: CTRL-QUERY-COUNT, CTRL-PRNG-NO-COLLISION,
      CTRL-YIELD-REF independently re-derived true in 20/20 instances;
      CTRL-BLOB well-formed and cross-record consistent but not independently
      recomputed from file bytes this session (see unresolved_confounds).
    - >-
      Resource limits: 30s/arm-run and 3600s total budget, both far from
      binding (2.30s external wall used for the entire 60-arm-run batch).
    - >-
      Scale-relevance label: toy-scale, direct computation at 7-8 bit field
      size (matches specification.yaml's own scale_relevance.tier: toy).
      This record makes no claim about medium- or cryptographic-scale
      behavior (AGENTS.md rule 7).
    - >-
      Largest claim this data justifies: under the declared charged-cost
      unit (one field operation = one E.add as performed by the frozen
      harness.toycurve add), across the 4 of 8 pre-registered toy-scale
      (p,b) cells reached (p in {101,103}, b in {0.4,0.5}, m=3), the
      x-oracle-guided MITM arm did NOT reach the complete relation set more
      cheaply than the structure-only random-null MITM arm; the reverse held
      in every one of the 20 measured instances, for an identified and
      code-grounded (though not fully closed-form-proven) reason. This does
      NOT establish the same holds at the two untested cells, at other m, at
      other charge-unit conventions, or at any non-toy scale.
  unresolved_confounds:
    - >-
      Charge-unit-convention dependence: H-XOR-a227dc's own stated
      assumption is that the charged unit is implementation-defined; a
      different accounting (e.g. charging a cheap y-sign pre-check before a
      full 2-add verification) could change the ranking. Not explored here.
    - >-
      Untested cells (p=107, p=211) leave the pre-registered tail check
      (ranking stability at the largest cell) open; the scaling argument in
      `inference` is a plausibility note, not a proof, for those cells.
    - >-
      No independent SHA-256 recomputation of CTRL-BLOB or the artifact
      hashes was performed this session (no shell/code-execution tool
      available to this reviewer); well-formedness and cross-record
      consistency were checked instead. This is the same category of gap
      that let a prior fabricated-hash defect through three earlier
      independent reviews (DEC-20260808-6a7ac4's disclosed finding on
      EV-ECDLP-65b004).
    - >-
      The derivation's step 4 (companion false positive) is stated as
      "generic" (assumes S is not 2-torsion); the exact zero-deviation match
      across all 20 instances is consistent with this not perturbing the
      tested cells, but this was not separately verified by enumerating
      which, if any, table sums are 2-torsion in these specific instances.
    - >-
      GENERALITY OF THE EXACT 2x RATIO: the derivation's steps 1-4 show the
      negation-pairing mechanism is ALWAYS present (every genuine hit is
      always accompanied by at least one guaranteed companion false
      positive, at any |F|) -- but whether candidates_verified_B stays
      EXACTLY 2*R_B, as measured at all 4 tested cells, additionally assumes
      no OTHER pairs share a bucket beyond the guaranteed +S/-S pair. At the
      tested cells T (non-identity pairs, 132 or 380) is comparable to or
      exceeds p (101 or 103), so buckets are plausibly over-subscribed on
      average; the exact-2x measurement means this did not add further
      false positives at these specific instances, but at larger |F| (the
      untested cells, or b>0.5) table density grows further and additional
      genuine hash collisions beyond the guaranteed pairing become more
      plausible, which could push the ratio above 2x (making Arm B relatively
      MORE expensive, not less) rather than hold at exactly 2x. This is a
      second, distinct reason -- beyond the 2-torsion caveat below -- that
      the exact ratio, though it fully explains the 4 tested cells, is not
      established as a fixed constant across untested parameters.
    - >-
      No independent second implementation or session has run this exact
      charged-cost script; the mandatory reviewer/validator/red-team passes
      specification.yaml's own required_artifacts calls for ("mandatory
      because this is the first charged-cost artifact in this lane") have
