  inference: >-
    DERIVATION (docs/claims-and-verification.md "Refutation artifacts" tier
    2 -- a checkable, code-grounded argument, not a curve-fit to output
    numbers): why candidates_verified_B is exactly 2*R_B. (1)
    harness/toycurve.py's negate((x,y)) returns (x,-y mod p): negation
    preserves the x-coordinate; add returns the identity exactly when
    x1==x2 and (y1+y2)%p==0 (standard group law, independently confirmed by
    reading the actual implementation, not assumed from textbook EC facts).
    (2) build_factor_base (full_grid.py) inserts, for each chosen
    x-coordinate, both the lifted point P and its negation -P (unless
    2-torsion), so F is closed under negation -- the frozen code's own
    docstring already relies on exactly this fact to derive
    T=|F|*(|F|-1), independently confirmed consistent with this reading.
    (3) arm_b_x_oracle keys its hash table by x(P2+P3) alone, discarding the
    sum's y-coordinate. For any right-pair (P2,P3) with sum S=P2+P3!=O, the
    negation-pair (-P2,-P3) is also enumerated (F closed under negation),
    with sum -(P2+P3)=-S (negation is a group homomorphism); since
    x(-S)=x(S), BOTH pairs land in the same table bucket H[x(S)]. (4) A
    genuine relation requires P1=-(P2+P3)=-S for some table entry (P2,P3);
    checking x(P1)=x(S) finds it. But the SAME bucket lookup also iterates
    the negation-pair (-P2,-P3): checking P1=-S against it computes
    P1+(-P2)+(-P3) = -S-P2-P3 = -S+(-S) = -2S, which is O only if S is
    2-torsion -- generically not. So every genuine relation is generically
    accompanied by exactly one guaranteed companion false positive, charged
    at 2 field adds, from the SAME bucket lookup. (5) This reproduces the
    measured pattern exactly (candidates_verified_B=2*R_B,
    false_positives_B=R_B, zero deviation across all 4 cells/20 instances).
    A counterexample certificate (tier 1) does not apply: that mechanism is
    scoped to claimed solves/relations checkable by recomputing a specific
    witness (kind: discrete_log|decomposition); F2 is a numeric-count
    inequality, not an existential witness, so the certificate schema does
    not fit it. WHAT THIS DOES AND DOES NOT ESTABLISH: steps 1-4 generally
    and fully explain why Arm B's OWN charged cost is structurally double
    the pre-registered formula's assumption -- a fact about the code, true
    at any cell using this construction. They do NOT by themselves force
    C_B>C_D: that additionally depends on the empirical size of R_B (real
    Semaev-relation density of the specific curve/factor base) relative to
    Arm D's chance-collision rate (~Q*T/p), which are number-
    theoretic/probabilistic facts about the tested instances, not algebraic
    identities. At the 4 tested cells the corrected C_B (|F|^2+4*R_B)
    exceeds C_D by a wide margin in every case; recomputing the ORIGINAL
    uncorrected pre-registered formula at the actual measured R_B values
    already predicts C_B>C_D in 3 of the 4 cells (196 vs 175.4; 208 vs
    174.8; 596 vs 547.6) -- only cell (101,0.5) has the original model
    predicting the hoped-for direction, by a modest ~5% margin that does
    not survive the 2x correction -- so the qualitative failure is not a
    subtle artifact riding entirely on this review's correction. A rough,
    explicitly non-rigorous scaling note: both R_B (~|F|^3/N per the sibling
    experiment's own "expected relations" heuristic) and D's expected
    chance-collision count (~Q*T/p ~ |F|^3/p) grow at roughly the same cubic
    rate in |F|, so nothing here suggests the margin should obviously close
    at the untested, larger cells -- but N/p varies curve-to-curve (Hasse
    bound), so this is a plausibility note about the two untested cells, not
    a prediction. SEPARATELY: the oracle's information content is
    CONFIRMED, not contradicted -- R_D/R_B stayed at 0.6%-1.5%, far under
    the F3 near-null threshold; Arm D essentially never stumbles onto
    genuine relations by chance. What is contradicted is that this
    informational advantage converts into a field-operation cost advantage
    under the SPECIFIC declared charge model: the x-only signal that makes
    the oracle informative is coarser than what verification needs (cannot
    distinguish +S from -S) and pays a fixed, deterministic tax for that
    coarseness that Arm D's rarer, cruder collisions do not pay at these
    tested densities.
  boundaries:
    - >-
      Curve family: short Weierstrass toy curves y^2=x^3+Ax+B over prime
      fields F_p, deterministic first-nonsingular-with-order->=5 curve
