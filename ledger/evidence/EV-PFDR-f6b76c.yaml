  type: empirical
  direction: weakens
  direction_scope: >-
    Read against the STRUCTURAL BRANCH of H-PFDR-2765d2: the alternative that
    the x-structured base small_x yields a non-generic excess of distinct
    nonformal TT relations at m = 4, kappa_rel > 1. On 10200 fresh curves
    (c = 2010..7109 at 30 and 32 bits) small_x TT4 shows no excess: kappa_rel
    0.998, z_A -0.068 against t_dec 2.349. The governing one-sided upper
    bound is 1.043, below the 1.15 target, and the achieved X_rel is 1.06
    (NR-01 to NR-03). The frozen outcome is O-A3, "no excess, bounded at the
    target". This is the cell that EV-PFDR-ad6274 left open: on the
    EXP-PFDR-011cd0 curves its upper bound was 1.1711, not below target
    (NR-28). The two readings are discordant in that sense. They are not
    contradictory: 011cd0 detected nothing either; it only failed to exclude.
    "weakens" is the net direction for the lever at this cell. It is not a
    statement that the mechanism is impossible, and it covers no N outside
    30-32 bits.
  strength: preliminary
  strength_basis: >-
    A valid, pre-registered confirmatory experiment with large n (5100
    curves per rung), in-design matched randoms, a known-null arm, four null
    pseudo-cells, a real-data permutation null, a planted arm at the target
    and a full planted arm. An independent three-reviewer round attacked it:
    - blind re-derivation from rows: exact integer counts, and both bounds
      within Monte Carlo error;
    - red-team recalibration with its own generator and seeds;
    - departure models and a common-mode yardstick.
    It is not "replicated": one producer session, one engine, one run set.
    It is not "strong": the scale is toy (two rungs), and one null-control
    criterion is uninformative at this design (J-PCNULLR; NR-12).
  claim_tier: toy
  claim_tier_basis: max log2 p = 32 (30 and 32 bits) -- docs/claims-and-verification.md mechanical rule (toy = max field bit size <= 32)

  proof_status: empirical_only
  proof_refs:
    - experiments/EXP-PFDR-0b3699/runs/RUN-PFDR-0b3699-analysis/analysis.json (primary, mutation, contrast, PC-NULL-R and PC-R readings; archived by TASK-20261008-398fce; NR-01 to NR-04)
    - coordination/review/pfdr-0b3699-20261009/reviews/TASK-20261009-a92ff3/rederivation.yaml (blind re-derivation from rows; NR-05 to NR-09)
    - coordination/review/pfdr-0b3699-20261009/reviews/TASK-20261009-33b5cf/report.yaml (validity from artifacts, G-REL-style recount, J-A3 review computation; NR-10, NR-19, NR-20)
