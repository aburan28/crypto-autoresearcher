  analysis:
    observation: >-
      Pooled over 30 and 32 bits (10200 curves):
      - small_x C_A 2561 against C_R 2565.0, with V 2607;
      - kappa_rel 0.998, z_A -0.068, calibrated p 0.524;
      - t_A 2.349, t_perm 2.344, so t_dec 2.349 (NR-02).
      Bounds (NR-03):
      - signed-quantile U_A 1.0360, simulated coverage 0.946 / 0.943 / 0.946
        at kappa 1.00 / 1.10 / 1.15;
      - |dev|-quantile bound 1.0434, coverage 0.974 / 0.972 / 0.974;
      - the |dev| bound governs by AR-3.
      Achieved X_rel 1.06 under both plantings (NR-03).
      Mutation small_x_offset: kappa 1.039, z_M 1.713, calibrated p 0.044;
      contrast z_Delta -1.454 against t_Delta 1.637 (NR-04).
      Per rung (secondary): small_x kappa 1.019 at 30 bits and 0.979 at
      32 bits.
    comparison: >-
      Against EXP-PFDR-011cd0's reading of the same cell (upper bound 1.1711,
      not below target; per-rung kappa 1.017 and 1.178; NR-28). The 32-bit
      elevation did not recur on fresh curves.
      Against the planted target: planted_target is detected, with C_X 3040,
      z 8.06 and kappa 1.185 (NR-17). Detection of kappa 1.15 at the realised
      n is at least 0.9997 under Poisson and compound planting (red team
      J-PLANT).
    inference: >-
      At this cell, these sizes, this engine and these curves, a small_x TT4
      relation-level excess of kappa_rel >= 1.15 is excluded by a one-sided
      bound with simulated coverage about 0.97. The design was able to see
      that excess. The recorded outcome O-A3 survives the blind re-derivation,
      recalibration, every assessed dispersion law, a common-mode yardstick
      and proves-too-much.
    limitation: >-
      One run set, toy scale, one engine. The governing-bound choice is at
      Monte Carlo resolution (both bounds well below 1.15). PC-NULL-R
      criterion (i) is uninformative at this design. The common-mode
      yardstick (EXP-PFDR-011cd0's rate) shares the FactorBase.random
      construction.
    blind_rederivation_agreement: >-
      The comparison_rule fixed in the plan before dispatch (DEC-20261010-b662c7 R-1):
      - C_A, 3 x C_R and C_M are equal as integers;
      - V, z_A, z_M and z_Delta are equal within 1e-15 relative;
      - signed bound 1.03591 against 1.03602 (difference 1.2e-4);
      - |dev| bound 1.04335 against 1.04336 (difference 7.2e-6); tolerance
        0.005;
      - governing choice equal (|dev|), at Monte Carlo resolution;
      - re-applying the outcome table gives O-A3.
      NR-02 to NR-08.
    review_recalibration: >-
      Red team values (NR-14):
      - t_A 2.357 (MC SE 0.019) and t_perm 2.361, within 1.6 combined SE of
        calibration.json;
      - rho1_hat_b and D bitwise equal;
      - every null-arm feature inside the fitted model's 99% predictive range.
      The source of t_dec flips at Monte Carlo resolution. This is
      immaterial at z_A -0.068.
    coverage_and_departures: >-
      The governing (|dev|) bound's coverage at kappa 1.15 is at least 0.956
      under every assessed departure law (NR-16). The signed bound's coverage
      under compound planting is about 0.93. Under no law consistent with the
      null arms does the outcome class change.
      Common mode: crossing z_A = t_dec needs a null-rate factor of 1.0575.
      The admitted pooled 99% upper end is 1.0297 (NR-15).
    unexpected_observations: >-
      - U-1 to U-4: only U-4 entries, all planted arms (validator J-VAL (8)).
      - The blind re-deriver's signed coverage at kappa 1.00 differs by 2.86
        binomial SE between two seed sets. Read as Monte Carlo fluctuation
        and reported, not discarded (a92ff3 AD-9).

