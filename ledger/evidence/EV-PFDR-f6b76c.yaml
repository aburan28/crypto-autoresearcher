  proof_status_note: >-
    Declared empirical_only. The adverse direction rests on one valid,
    unreplicated run set. A calibrated upper bound is a measurement, not a
    counterexample certificate. No derivation shows why small_x should carry
    no excess: HEUR-2765d2-H2's random-model justification is recalled and
    lies outside the proven range. Per docs/claims-and-verification.md, this
    takes weaken plus replication, never reject_scoped. Every artifact above
    was archived (398fce package; 0ffc37 review snapshot) before the decision
    that relies on it.

