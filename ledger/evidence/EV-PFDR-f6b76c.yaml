  claim_boundaries:
    curve_family_and_field: 'generate_prime_order_curve(bits, c, p_filter=subgroup_prime_filter([3,4,5], 0.15)), prime fields, fresh seeds c = 2010..7109 per rung (disjoint from EXP-PFDR-011cd0''s c = 10..)'
    bit_sizes: 30 and 32, pooled for the decision; per rung secondary
    instance_generation: per design.json final_n_b 5100, pinned before RA-04; G-CURVE on all 81600 census rows
    solver_and_version: crypto_autoresearcher.index_calculus mitm engine, EXP-PFDR-011cd0 build 38be58dad plus EC-A1 only; m = 4, table arity 2, min_fill; TT over the whole table
    parameter_range: base size s_sub = max(4, |F_sub|); arms small_x, small_x_offset, subgroup, three matched randoms, known_null_sub, planted_sub (planted_target derived)
    controls_and_baselines: matched randoms; known-null arm; four null pseudo-cells (PC-NULL-R); permutation null; planted_target (PC-R-T) and planted_sub (PC-R-D); all pass
    resource_limits: 4 workers, 3.5e9-byte per-process address-space cap, 14 GB; every run completed_valid
    scale_relevance:
      label: toy-scale
      justification: direct computation at log2 p <= 32; no correspondence or embedding to larger N; no transfer asserted
    transfer_and_extrapolation_assumptions:
      - "Band pooling: the decision statistic pools 30 and 32 bits, so the bound is about the pooled ratio."
      - "No extrapolation in N: nothing is claimed for N above 32 bits or for growth of kappa_rel with N."
      - "No transfer to other bases, classes, m, arities, engines or deployed curves (TW-SCOPE)."
    largest_claim_justified: >-
      On 10200 fresh generated prime-order curves at 30 and 32 bits, with the
      mitm engine at m = 4 and table arity 2, the small_x base shows no
      relation-level TT excess over matched random bases (kappa_rel 0.998).
      An excess of kappa_rel >= 1.15 is excluded by a one-sided bound of
      1.043 (|dev| quantile, simulated coverage about 0.97). The detection
      limit is X_rel 1.06. Single unreplicated run set; empirical only.
  boundaries:
    - "Negative-result semantics: no small_x TT4 excess meeting the calibrated threshold was observed at these sizes, engine and curves. This does not show that no structure exists, that kappa_rel does not grow with N, or that another base, class or algorithm cannot exploit the mechanism."
    - Lead 2 of IDEA-20260928-4e2be7 is NOT closed. At 30-32 bits all 21 FAM-1 cells are now weakened, but small_x TT4 rests on this run and the other 20 on EXP-PFDR-011cd0. Growth with N is untested.
    - Whether a later reject_scoped may cite this reading is a composition-time question (specification O-A3 meaning); it needs an independent replication first.
  unresolved_confounds:
    - "Rung heterogeneity across experiments: EXP-PFDR-011cd0's 32-bit kappa 1.178 against 0.979 here. Chance and a curve-set-dependent effect are not separated by two runs."
    - The null-control informativeness gap (PC-NULL-R (i) degenerate; (ii) second-order and blind to common mode), closed here only by review-time computations.
    - "Common mode: the yardstick is EXP-PFDR-011cd0's random rate, which shares FactorBase.random; against U the pooled rho1 99% interval is [0.957, 1.015] (red team)."

  # ---------------------------------------------------------------------------
  obstruction:
    statement: >-
      On generated prime-order curves at 30-32 bits and this mitm engine, the
      small_x base supplies distinct nonformal TT relations at m = 4 at the
      matched-random rate within a calibrated one-sided bound below the
      lever's 1.15 target. This blocks reading small_x, at these sizes, as a
      relation source with a target-size constant excess. It is a measured
      property of the base's relation supply. It does not block growth with
      N, other bases, classes or engines.
    quantity: >-
      The governing one-sided upper bound on kappa_rel (small_x over the
      matched-random mean of distinct nonformal monic TT relations, CC-1 to
      CC-10 pooled over 30 and 32 bits), and the achieved detection limit
      X_rel; both dimensionless ratios.
    value: >-
      Governing bound 1.0434 (|dev| quantile; simulated one-sided coverage
      0.972 to 0.974); signed-quantile bound 1.0360. Point kappa_rel 0.9984.
      X_rel 1.06 under Poisson and compound planting (NR-02, NR-03).
      Reproduced blind to within 1.2e-4 (NR-07).
    measured_by:
      - RUN-PFDR-0b3699-table
      - RUN-PFDR-0b3699-calibrate
      - RUN-PFDR-0b3699-analysis
      - EXP-PFDR-0b3699
    measured_by_note: Read from RA-06 analysis.json; re-derived blind from rows by TASK-20261009-a92ff3 and reproduced by the red team's own bounds. No new run.
    scope: >-
      small_x, TT, m = 4, 30 and 32 bits pooled; curves c = 2010..7109; this
      engine (mitm, arity 2, min_fill). Claimed nowhere else; in particular
      not for N above 32 bits or the growth exponent delta.
    resource_check:
      examined: true
      reading: >-
        Read the other way round, the bound says that the cheaply canonical
        base "the s smallest liftable x" behaves like a uniformly random
        base, in TT relation supply, at 30-32 bits. A theory that wants a
        deterministic, cheaply verifiable factor base to behave like a
        random one could take this as its hypothesis (as EV-PFDR-ad6274's
        resource_check read for the other 20 cells). Its best case is a
        constant-factor saving in base selection or reproducibility. It
        cannot move an exponent, so it is not ranked as an exponent lever,
        and none was spawned. The bound is also the sensitivity any later
        structured-base ladder (Part C) must beat.
      spawned_ids: []

