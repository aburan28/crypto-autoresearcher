    statement: >-
      The values those artifacts publish were computed with the set-OR product
      (CORR-20260929-616d03) and are SUPERSEDED by RUN-SEMBIN-3a4248's reduced
      and formal columns (O-3, O-4). None of those files is edited. Readers
      citing the MEASUREMENT1 comparison must cite this record instead and name
      the convention. Sentence by sentence: "Semaev's d_ff is pinned at 2 in
      every cell" survives only as a median statement (12/80 draws at 3).
      "The null's d_ff rises with n' - 3 at n'=3, 4 at n'=4" does NOT survive
      as stated: true at n = 4, 5, 6, false at n = 7 (3 -> 3). "The deficit
      therefore widens with the factor-base dimension" holds at n = 4, 5, 6
      (1 -> 2) and not at n = 7 (1 -> 1). The (7,3) exception (deficit 0) is
      gone: the corrected deficit there is 1. Section 4's limits (d_ff is not
      the solving degree; degree-profile-only null; toy scale) stand unchanged.
      Per the frozen interpretation_map, the MEASUREMENT1 comparison as
      published may not be cited for either convention.

  inference: >-
    On exactly MEASUREMENT1's 80 Semaev and 200 null systems, at toy tier, under
    the differencing d_ff with the XOR Boolean-ring product and either row
    filter: the Semaev median is 2 in all 8 cells; the degree-profile-matched
    null median exceeds it by at least 1 in all 8 cells, including (7,3); and
    the null median rises from n' = 3 to n' = 4 at n = 4, 5, 6 but not at n = 7.
    H-SEMBIN-d8c4fe is therefore contradicted under both conventions by its P3
    component, while its P1 and P2 components hold. The interpretation_map
    clause "for c = reduced ... the published pattern was an artifact of the
    set-OR product" is applied here only to the part of the pattern that
    changed: the product is the established cause of the (7,3) median moving
    2 -> 3, which is what had made the published P3 hold at n = 7. It is NOT
    evidence that the n = 4-6 rises or any deficit were artifacts; those
    survive the correction unchanged in median. For formal the failure is not
    attributed to the product alone (the row filter also differs), although
    formal and reduced medians coincide everywhere. The surviving Semaev-versus-
    null deficit is an UPPER BOUND on any structural deficit, because the null
    is matched on degree profile only and the block-multiaffine null
    (MEASUREMENT1 N1) has not been run.

  boundaries:
    - >-
      Toy tier: (n, n') in {4,5,6,7} x {3,4}; N = 2n' in {6, 8}; Dmax = 6 (equal
      to N at n' = 3); at most 7 equations. One curve (y^2 + xy = x^3 + x^2 + 1),
      characteristic 2, m = 2 (S_3). No transfer to n > 7, n' > 4, m > 2, other
      curves, other characteristics, or cryptographic parameters.
    - >-
      Exactly MEASUREMENT1's seeds and systems. Semaev seeds 7919 n + 131 n' + s
      (s = 0..9); null seeds 31 n + 7 n' + t (t = 0..24), all 25 nulls per cell
      matched to the single s = 0 Semaev system. A re-computation, not a fresh
      sample.
    - >-
      d_ff is the differencing definition. Not Nagao 2013/549 Definition 1, not
      literal 2015/984 Definition 5 or 6, not the solving degree, last fall
      degree or degree of regularity. Nothing about subexponentiality, ECDLP
      cost, or any curve's security in either direction.
    - >-
      Identity presentations only. Nothing about recombination separation
      (H-SEMBIN-934774, KN-OPEN-7f0511 (A)); the definitional refinement on that
      question is carried separately by CORR-20260929-d6ddce.
    - >-
      Exact median comparisons on 10 and 25 values, as preregistered. No
      statistical test, no error bar on a population quantity, and no claim
      about the distribution the draws come from.

