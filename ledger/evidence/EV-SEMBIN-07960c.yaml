    - >-
      INSTRUMENT SHORTCUT. boolean_macaulay.fall_profile starts at D = 1 with
      dim V_0 := 0, which would misreport d_ff = 1 on a system with a constant
      generator. The validator found 0 constant generators and dim V_0 = 0 in
      all 280 systems, so it has no effect here.
    - One model family serves every role by runtime inheritance. Session independence is real; model independence is not claimed.

  obstruction:
    statement: >-
      On MEASUREMENT1's degree-profile-matched null systems at n = 7, the median
      differencing first fall degree (XOR Boolean-ring product, field equations
      reduced in every product) does NOT increase from n' = 3 (N = 6) to n' = 4
      (N = 8), under either the reduced or the formal row filter. The universal
      claim "the null's d_ff rises with n'" over n in {4,5,6,7} is therefore
      false on these systems. This is a claim about the measured object, not
      about the attempt.
    quantity: >-
      Delta_n = (null median d_ff at (n,4)) - (null median d_ff at (n,3)),
      integer, per convention; median of 25 draws per cell
    value: >-
      Delta_7 = 0 (3 - 3) under reduced and 0 (3 - 3) under formal. For
      contrast Delta_4 = Delta_5 = Delta_6 = +1 under both. Exact integer
      medians on a fixed finite set; no sampling error bar applies to this
      set-level statement. Distance to flipping the n = 7 comparison: +10
      (reduced) / +5 (formal) draws at 4 in (7,4), or +6 (reduced) / +12
      (formal) draws at 2 in (7,3). Descriptive means at n = 7: 2.72 -> 3.12
      reduced, 2.96 -> 3.32 formal (not scored).
    measured_by:
      - RUN-SEMBIN-3a4248
      - EXP-SEMBIN-473340
    measured_by_note: >-
      Recomputed blind by VAL-20260929-sembin473340 (vbr.py; 48/48 identical
      distributions, including both n = 7 null cells in both conventions).
    scope: >-
      Exactly the (7,3) null systems (seeds 238..262) and (7,4) null systems
      (seeds 245..269), each matched to the s = 0 Semaev system of its cell;
      E: y^2 + xy = x^3 + x^2 + 1 over F_{2^7}; Dmax 6; conventions reduced and
      formal. Claimed nowhere else. It closes H-SEMBIN-d8c4fe only, and closes
      no lane: the Semaev-versus-null comparison stays open under N1 and N3.
    resource_check:
      examined: true
      reading: >-
        YES, a theory takes this measurement as its hypothesis rather than its
        refutation, and it is recorded as a POINTER, not a finding. If the
        null's first fall degree tracks the generic (semi-regular) behaviour of
        n quadratic Boolean equations in N = 2n' variables, then it is a
        function of (n, N) jointly, and a flat n' step at large n is predicted
        rather than anomalous. The Boolean semi-regular Hilbert series
        (1+t)^N / (1+t^2)^n with d_reg the index of its first non-positive
        coefficient is RECALLED (Bardet-Faugere-Salvy line of work; provenance
        recalled, no agent in this program opened the source, verified_by
        null). The Coordinator's own unverified arithmetic on that recalled
        formula gives d_reg = 3 for every n in 4..7 at N = 6, and d_reg = 4, 4,
        4, 3 for n = 4, 5, 6, 7 at N = 8, with the n = 7, N = 8 case exactly on
        the boundary (degree-3 coefficient 56 - 7*8 = 0). That matches all 8
        corrected null medians, including the flat n = 7 step, and the observed
        (7,4) mixture of 3s and 4s is what a boundary case would look like; the
        one median it does not match is the superseded legacy (7,3) value 2.
        CAVEATS, all binding: post hoc on 8 medians; assumes the null has n
        nonempty quadratic equations (empty components are dropped and the
        systems are inhomogeneous); first fall degree equals d_reg only for
        genuinely semi-regular systems, itself a recalled claim; nothing here
        is evidence. Its use: it turns N3 (larger n') from a trend-watch into a
        preregistrable test, and it offers an analytic null rung alongside N1.
        It is routed to the idea-generator in DEC-20260929-e37785 next_actions.
      spawned_ids: []
      spawned_ids_note: >-
        None filed. The idea-generator authors the IDEA (with a retrieved,
        not recalled, citation) under a minted id if it survives its own
        prior-art and null-object checks.

