evidence:
  id: EV-PEC-2e67ff
  hypothesis_id: H-WESO-001
  experiment_ids: [EXP-PEC-6be870]
  run_ids: [RUN-PEC-6be870-a]
  type: empirical
  direction: weakens
  direction_binding: >-
    `weakens` is bound to ONE thing: the frozen paper's Section 4.1 cost
    convention that "constructing a table costs a single F_{p^2}-operation per
    entry", which the concrete-threat arithmetic of H-WESO-001 inherits. It is
    NOT bound to the conditional asymptotic theorem (untouched by this record),
    and it is NOT a statement about the sign of the NIST-I margin, which this
    record leaves INCONCLUSIVE. The measured per-entry cost is larger than the
    convention assumes, i.e. the direction is against the paper's cost
    accounting and in the attack's DISFAVOUR at the tested scale.
  strength: preliminary
  strength_justification: >-
    Capped at `preliminary` for three independent reasons, none of which is a
    defect of the execution. (1) The frozen contract's own replication clause:
    "Eight independent j-samples per ell provide within-run replication of the
    per-ell statistic; they do NOT provide independent replication of the run
    itself, and the resulting evidence strength may not be recorded above
    `preliminary` on that basis alone" (EXP-PEC-6be870, replication.note). One
    run was authorized and one was executed. (2) Validator finding F-1
    (VAL-20260802-d9e2c1) and red-team objection RT2-C2 (RT-20260802-96d908)
    independently establish that the headline response variable is not a single
    series across the fitted range, so the point estimate is not settled. (3)
    The pre-registered extrapolation law that carries the measurement to a
    NIST-I statement is defective (RT2-C1, adjudicated in DEC-20260802-8227b9).
    The Validator's own recommendation reaches the same ceiling. All four
    pre-registered admissibility conditions were nonetheless MET, so the
    contract itself does not impose the cap; these three grounds do.
  claim_tier: medium
  claim_tier_derivation: >-
    Mechanical, per docs/claims-and-verification.md: max field bit size =
    2 * 40 = 80, which lies in (32, 96], so the tier is `medium`.
    RUN-PEC-6be870-a records inputs.parameters.field_bits = 80 so the tier
    derives mechanically (tools/validate_ledger.py, tier_of_run). A `medium`
    record may assert a stable measured effect on the tested medium range and
    may NOT assert cryptographic-scale (P-256+/NIST-I+) behaviour. The batch's
    prose calls this "toy scale" because the isogeny degrees reach only
    ell <= 211 against an operating point of ell ~ B_opt ~ 2^14.2 and because
    p ~ 2^40 is far below any cryptographic prime; the mechanical tier and the
    prose do not conflict, and the stricter of the two governs any statement
    about NIST parameters. The extrapolated overhead parameter c carries NO
    tier at all: it is a declared model substitution.
  certificate_refs: []
  certificate_note: >-
    RUN-PEC-6be870-a declares result.certificate.kind = none with a stated
    reason: it is a pure measurement run claiming no discrete-log solve and no
    factor-base relation, so there is nothing to certify in the sense of
    docs/claims-and-verification.md. The independent verification artifacts are
    controls, not solve certificates: C-BASE.5 (23772 chain relations
    Phi_ell(j_i, j_{i+1}) = 0 re-checked by a separate bivariate evaluator) and
    C-ALT.1 (all 30616 reported roots re-evaluated by an uninstrumented Horner
    path). The Validator re-verified 1480 of those relations with an evaluator
    it wrote itself, built from the integer bivariate coefficients.
  proof_status: derivation
  proof_status_justification: >-
    This record carries an adverse call - that the pre-registered extrapolation
    law is defective as a measure of the overhead the NIST-I question needs.
    Per docs/claims-and-verification.md ("Refutation artifacts") the strongest
    checkable artifact the result admits was sought before the call. What
    exists is a counterexample INSTANCE plus a checkable argument, both internal
    to committed data: (i) the run's own C-NULL series, an object whose
    per-entry cost is O(1) in ell BY CONSTRUCTION, measured at 5118.83
    (ell = 2) and 4903.13 (ell = 101) counted F_{p^2} multiplications per entry
    - 2^12.32 and 2^12.26 against Section 4.1's assumed 2^0 - on which the
    frozen law returns c_null = gamma_null * 14.2 / 16 = -0.0132 * 0.8875 =
    -0.0118 ~ 0; and (ii) the arithmetic identity that the overhead over the
    one-operation-per-entry convention is log2(A) + gamma * log2(B_opt) bits,
    of which the law retains only the second term. It is labelled `derivation`
    and never "proved": no formal certificate block exists in the sense of the
    certificate discipline, which covers claimed solves and relations, and the
    argument is checkable by an independent reader step by step rather than
    machine-verified. Both the Red Team (independent session, RT2-C1) and the
    Coordinator re-read the two load-bearing numbers directly from the
    committed raw-result.json.
  proof_refs:
    - coordination/goals/GOAL-P13-001/batches/BATCH-002/reviews/TASK-20260802-96d908/red_team_report.yaml
    - coordination/goals/GOAL-P13-001/batches/BATCH-002/reviews/TASK-20260802-9ade2e/validation_report.yaml
    - experiments/EXP-PEC-6be870/runs/RUN-PEC-6be870-a/raw-result.json
  proof_refs_loci:
    counterexample_instance: >-
      raw-result.json controls.C-NULL: gamma_null_primary_W_MID =
      -0.013241522288809005, bootstrap CI [-0.03349104106813048,
      0.00803413720034009], flatness_smallest_ell.per_entry = 5118.833333333334
      (ell = 2), flatness_largest_ell.per_entry = 4903.127450980392 (ell = 101),
      flatness_ratio 0.9578603427174924. Archived at 49166fa5, before this
      record.
    measured_intercept: >-
      raw-result.json fit.windows W-MID: intercept = 8.924066290325673 bits,
      i.e. A = 2^8.924 ~ 486 F_{p^2} multiplications per entry at ell = 1,
      p ~ 2^40. Archived at 49166fa5, before this record.
    derivation_and_p_scaling: >-
      red_team_report.yaml RT2-C1 and counterexample_or_mutation; the p-scaling
      is read off the committed implementation (per_entry_cost.py computes roots
      as gcd(x^{p^2} - x, f) via poly_powmod at exponent Q = p*p, whose binary
      loop runs 2*log2(p) iterations), giving A(2^256)/A(2^40) = 256/40 = 6.4,
      i.e. +2.678 bits. DERIVED FROM THE COMMITTED PIPELINE, NOT MEASURED: p
      was held at a single value by design, so the p-axis has n = 1
      (RT2-C3). Control NC2d discriminates it.
    archival_order_caveat: >-
      The counterexample instance and the intercept were archived at 49166fa5
      (TASK-20260802-ca5bdc), before this record, as the refutation-artifact
      rule requires. The two review analyses that state the argument are
      archived in the SAME ledger commit as this record rather than in an
      earlier snapshot, because the BATCH-002 dispatch plan assigns the review
      reports to this ledger archive and to no other archival task. Recorded as
      a sequencing observation, not repaired by back-dating anything.

  scope_of_the_measurement:
    instance: >-
      p = 1099511627563, the largest prime below 2^40 congruent to 3 mod 4
      (independently re-derived by the Validator). F_{p^2} = F_p[T]/(T^2 + 1),
      field_bits 80. Seed curve E_0 : y^2 = x^3 + x, j = 1728, supersingularity
      controlled by C-BASE.1 rather than by citation alone.
    degrees: >-
      45 prime isogeny degrees actually measured over 2 <= ell <= 211 (46 grid
      slots; ell = 97 absent, see completion_gate below), 8 samples per ell on
      the surviving core grid under both implementations, 4 samples per ell on
      the optional extension under IMPL-A only.
    implementation: >-
      One pure-Python implementation PAIR sharing every line except the
      polynomial-multiplication routine: IMPL-A schoolbook, IMPL-B Karatsuba.
      SageMath is not installed; the frozen Panny proof-of-concept was NOT
      executed and served as a frozen algorithmic reference only.
    unit_and_conventions: >-
      One counted F_{p^2} multiplication (a squaring counts 1), because that is
      the unit Section 4.1 costs at 1 per entry. Additions/subtractions not
      counted; inversions in a separate register (declared sensitivity charging
      3 multiplications each moves gamma_A by -0.00024); Phi_ell storage and
      I/O, coefficient reduction, hashing and table access excluded - all in the
      attack's favour, so the measured exponent is simultaneously a LOWER bound
      with respect to those components. The two directions are NOT netted.
    budget: >-
      One run, 396.204 s of a 5400 s allowance, 940.57 CPU-seconds of a 6.0
      CPU-hour allowance, peak RSS 0.1544 GiB of 8 GB. maximum_runs 1 honoured.

  observations:
    - id: OBS-A
      subject: "Receipt integrity and independent reproduction"
      text: >-
        Validator VAL-20260802-d9e2c1 (TASK-20260802-9ade2e, independent
        session): verdict VALID-WITH-OBSERVATIONS, i.e. admissible evidence at
        the scope the run declares. All 10 declared path_sha256 bindings of the
        snapshot receipt re-verified on disk (0 mismatches, 0 missing); snapshot
        commit 49166fa5 reachable from HEAD with the recorded parent
        0d366061 and adding exactly the 11 declared paths as additions; the
        frozen contract proved to be an ancestor commit (0e773e9a) and
        byte-unchanged since freeze, so the prediction, the primary window, the
        estimator, the bootstrap parameters, the curvature rule, the
        admissibility conditions and the extrapolation law were all fixed before
        any datum existed. Every reported statistic the Validator attempted to
        recompute reproduced from the raw per-sample data: the three window
        slopes to a difference of 0.0e+00, all three bootstrap CIs to 1e-16 or
        better, the curvature and gamma_local_top exactly, all 20 extrapolated c
        values to better than 1e-12. ELEVEN primary samples of the Validator's
        OWN choosing (deliberately not the three the Executor re-checked)
        re-executed BIT-FOR-BIT on every counted field. The modular-polynomial
        provenance chain was verified end to end including a LIVE RE-FETCH of
        phi_j_11.txt (HTTP 200, 6188 bytes, SHA-256 985c6a76ca7cc2802ba3f9fd48112fe0d82ffe11dbaa5f49c57526658338b352,
        byte-for-byte the recorded values). No evidence of tuning anywhere in
        the archive.
    - id: OBS-B
      subject: "All ten pre-registered controls pass, and the Validator concurs on all ten"
      text: >-
        C-INSTR (four exact sub-checks), C-NULL, C-BASE.1 through C-BASE.6,
        C-ALT.1 and C-ALT.2 all PASS as specified; the Validator marks eight of
        them PASS-VERIFIED against its own recomputation and re-derivation, with
        two qualifications recorded separately (C-NULL coverage, F-3; C-ALT.2
        independence, F-4). Supporting counts: 484 primary samples and 400 null
        samples with 0 counter-isolation failures; mults_instantiate equals the
        analytic (ell+1)(ell+2) at all 484 samples; per-worker accounting sums
        to 1511133917 counted multiplications, equal to the Validator's own sum
        over all 884 samples; root regularity exactly ell+1 at 484/484 samples;
        all 40 C-BASE.4 enumerations reproduce the frozen proof-of-concept's
        count(B, X) EXACTLY (46, 190, 218, 890, 2960); 23772 chain relations
        vanish; 30616 roots verified independently. This is a high-quality
        measurement and the Red Team says so in terms ("the controls, the
        instrumentation, the provenance battery, and the executor's honesty are
        all better than the interpretation resting on them").
    - id: OBS-C
      subject: "THE BATCH'S SOLID POSITIVE RESULT - Section 4.1's one-operation-per-entry convention is refuted at the tested scale, in the attack's DISFAVOUR"
      text: >-
        Measured per-entry cost, median over the j-pool, in the paper's own
        unit: 1843.5 counted F_{p^2} multiplications at ell = 2 and 94023.4 at
        ell = 211, against Section 4.1's assumed 1. That is 10.8 to 16.5 bits
        above the convention. The refutation does NOT depend on the defective
        extrapolation law, on the ell-exponent, or on the F-1 seam: the run's
        own C-NULL object, whose per-entry cost is O(1) in ell BY CONSTRUCTION,
        still costs 4903-5119 multiplications per entry (2^12.3). The
        ell-independent component is structural in the committed pipeline -
        root-finding requires x^{p^2} mod f, i.e. ~2*log2(p) polynomial
        squarings per batch of ell+1 entries - so no choice of multiplication
        routine removes it; only its polynomial-degree cofactor changes. The Red
        Team's own most attack-favourable constructible scenario (quasi-linear
        or batched multiplication, gamma -> 0, intercept only, p-scaled) still
        carries 11.60 bits of NIST-I overhead, not 0. Scope: measured at
        p ~ 2^40 for this implementation pair; the structural argument for the
        surviving intercept is DERIVED from the committed pipeline and the Red
        Team's analysis, NOT measured for a quasi-linear implementation (NC2c).
    - id: OBS-D
      subject: "The measured exponent, and what the pre-registered bands say about it"
      text: >-
        Reported W-MID (pre-registered primary window, ell >= 11) gamma_hat =
        0.9739199259643186 with union interval gamma_reported =
        [0.8691362629109963, 0.9783098339537538], half-width 0.0546. Mechanical
        verdict against the frozen prediction (gamma = 1, band [0.75, 1.25]):
        "confirmed"; classification band: "linear regime, per-entry cost ~ ell".
        Both anchors the contract named before any datum therefore fall OUTSIDE
        the measured interval for this implementation pair over this range: the
        paper's gamma_paper = 0 and red-team RT-C1's gamma = 2. The Validator
        confirms this verdict is ROBUST to the F-1 defect below, because every
        homogeneous exponent it computed (0.7929 through 0.9735) also lies
        inside [0.75, 1.25]. Homogeneous readings, independently reproduced by
        both reviewers: gamma_A (IMPL-A alone, ell 11..211) = 0.9332;
        gamma_B (IMPL-B alone, ell 11..101) = 0.7929; gamma_A over 11..101 =
        0.9179; gamma_A over 103..211 = 0.9588.
    - id: OBS-E
      subject: "DEFECT 1 (critical, inference layer) - the pre-registered extrapolation law discards the measured level"
      text: >-
        Red-team objection RT2-C1. The frozen law c = gamma * log2(B_opt) /
        sqrt(log2 p) maps the fit's SLOPE and discards its INTERCEPT, implicitly
        setting A = 1 in per_entry = A * ell^gamma. The run measured A directly:
        fit.windows.W-MID.intercept = 8.924066290325673 bits, i.e. A = 2^8.92 ~
        486 multiplications per entry at ell = 1. Nine measured, ell-independent
        bits are dropped before c is computed. The refutation is INTERNAL and
        decisive: applied to the run's own C-NULL object - per-entry cost O(1)
        in ell by construction, measured at 2^12.3 per entry - the same law
        returns c_null ~ 0, i.e. it reports "no overhead" for an object the same
        run measured at ~4900 F_{p^2} multiplications per entry against an
        assumed 1. A control that passes its own pre-registered criterion while
        refuting the estimator built on top of it is the most informative object
        in the run. Coordinator note: both load-bearing numbers were re-read
        directly from the committed raw-result.json by this Coordinator, in
        addition to the Red Team's derivation and the Validator's exact
        reproduction of the C-NULL statistics. Intercept-corrected, and with the
        intercept's log-p scaling, c at NIST-I is ~1.42 (measured intercept) to
        1.589 (p-scaled) under the linear reading and 1.804 under the most
        pessimistic constructible quadratic - NOT 0.864.
    - id: OBS-F
      subject: "DEFECT 2 (high, contract layer) - the primary response changes definition inside the fitted range"
      text: >-
        Validator finding F-1 and red-team objection RT2-C2, reached
        independently in separate sessions. The contract's C-ALT
        carry_forward_rule makes the primary per_entry(ell) the MINIMUM over
        implementations where both have data; execution_order step 8 runs the
        optional extension under IMPL-A only. The fitted response is therefore
        min(IMPL-A, IMPL-B) for 11 <= ell <= 101 and IMPL-A ALONE for
        103 <= ell <= 211, with a purely definitional step of +0.373 bits
        (= log2 of the cost ratio 1.2954 at ell = 101) at the seam, sitting near
        the right end of the regressor range where a positive step maximally
        inflates a fitted slope. THE SELF-EVIDENT TELL: the reported W-MID gamma
        0.9739 EXCEEDS BOTH of its constituents (IMPL-A 0.9332, IMPL-B 0.7929).
        A pointwise minimum of two power laws cannot have a larger exponent than
        either. Fit quality is also materially worse for the mixed response than
        for the homogeneous one on the same window (R^2 0.9837 vs 0.99976;
        max |residual| 0.2915 vs 0.0597 bits, with the largest W-MID residuals
        sitting exactly at the seam). ATTRIBUTION, recorded as the Validator
        determined it: this is a CONTRACT-INTERNAL INCONSISTENCY EXECUTED
        LITERALLY - fit_protocol.response, C-ALT.carry_forward_rule and
        execution_order step 8 are jointly inconsistent once the optional
        extension runs, and the contract never resolved the interaction. It is
        NOT an Executor deviation: the Executor followed all three literally,
        recorded the rule verbatim in raw-result.json, and reported gamma_A and
        gamma_B separately, so the defect is fully visible and fully
        recomputable from the archive without a new run. It is also NOT among
        the four underspecifications the Executor declared (U-1..U-4), so it
        stands as a gap in the Executor's own underspecification audit.
        DIRECTION: the artifact INFLATES gamma and therefore inflates c, i.e. it
        biases AGAINST the paper's Section 4.1 assumption and TOWARD RT-C1. It
        is not a favourable-rounding artifact and must not be read as one.
    - id: OBS-G
      subject: "Curvature and the misspecification declaration - the one point on which the two reviewers disagreed"
      text: >-
        Reported: quadratic on W-ALL gives c_quad = 0.04881463440717395 with
        bootstrap CI [0.045314559665060074, 0.06252235267120246] excluding zero,
        so the contract's rule declares the single-exponent model MISSPECIFIED
        and carries gamma_local_top = 1.170607376340235 through the
        extrapolation as a declared sensitivity. RED TEAM (RT2-C2): the
        misspecification "fired on a composition artifact" - its rolling
        8-point local slopes show the apparent acceleration confined EXACTLY to
        the three windows straddling the ell = 101 seam, while the homogeneous
        IMPL-A local slope is flat at 0.93-0.97 from ell = 17 through ell = 197;
        and the quadratic's sign flips across nested windows (+0.0488 on W-ALL,
        +0.0841 on W-MID, +0.1016 on ell >= 23, +0.0443 on ell >= 43, -0.2951 on
        ell >= 101), so it cannot be extrapolated in either direction. It
        explicitly declines to argue the exponent is still rising. VALIDATOR
        (F-1, "what survives"): the misspecification verdict SURVIVES on a
        homogeneous IMPL-A response - curvature 0.0225 with CI [0.0194, 0.0366],
        still excluding zero, under the contract's own bootstrap procedure and
        seed - with gamma_local_top 1.0187 rather than 1.1706, i.e. real but
        roughly half the reported size, and with the entire 1.02 -> 1.17 gap
        attributable to the seam. The adjudication of this disagreement is
        DEC-20260802-8227b9, section adjudication_of_reviewer_disagreement.
    - id: OBS-H
      subject: "Null-object coverage (Validator F-3)"
      text: >-
        C-NULL was executed at its frozen step-5 position and therefore covers
        ell 2..101 only, while the optional extension (step 8) added ell
        103..211 to every fitted window afterwards. Quantified by the Validator:
        21 of 46 W-ALL points (46%), 21 of 42 W-MID points (50%) and 8 of 8
        W-TOP points (100%) lie OUTSIDE null coverage, so half of the
        PRE-REGISTERED PRIMARY window is un-null-controlled on the receipt, in
        the sense of docs/inventor-protocol.md section 3. Numerically it barely
        moves the interval: W-TOP is NOT load-bearing, since dropping it
        entirely moves the union from [0.86914, 0.97831] to [0.86914, 0.97781],
        a change of 0.0005. MITIGATION, and its limit: the Validator ran a
        supplementary null over ell 103..211 itself and obtained gamma_null =
        +0.0039 (and +0.0383 on the top 8), with the full-range null spanning
        only 0.202 bits from ell = 2 to ell = 211 - no manufactured
        ell-dependence is detectable in the uncontrolled region. That
        measurement is VALIDATOR-SIDE, was produced in the review session, is
        not part of the producer receipt, and does not repair it. Attribution:
        the frozen execution_order caused this; the Executor recorded it as AN-5
        rather than improvising a post-hoc null.
    - id: OBS-I
      subject: "C-ALT.2 is weak as an independence control (Validator F-4)"
      text: >-
        Cantor-Zassenhaus splitting is randomised and the contract fixed no seed
        for it; the Executor seeded it on (ell, j_index) and NOT on
        implementation, and declared this as underspecification U-3. The
        Validator's judgement, in two parts. (1) NO DIRECTIONAL BIAS: both
        implementations traverse identical split structures, which is a paired
        design that removes split-structure variance and makes cost_A/cost_B a
        clean estimate of the multiplication-routine effect alone. (2) But it
        REDUCES C-ALT.2 to a test of the shared multiplication routine: IMPL-A
        and IMPL-B share every line of the pipeline except that routine AND
        share the random stream, so a defect in instantiate(), poly_rem_monic,
        poly_gcd, poly_powmod, the exponent Q, or the CZ recursion would produce
        identical WRONG root sets in both and C-ALT.2 would still report
        200/200. COROLLARY THE DOWNSTREAM READER MUST CARRY: gamma_A and gamma_B
        are NOT independent estimates of the exponent. The correctness burden
        falls on C-ALT.1 and C-BASE.5, both of which the Validator re-verified
        against an evaluator built from the integer bivariate coefficients, so
        the burden is discharged - but by those controls, not by C-ALT.2.
    - id: OBS-J
      subject: "Completion gate UNMET; ell = 97 is an infrastructure obstruction, never mathematical evidence"
      text: >-
        The contract binds its completion gate to the 26-prime core grid at 8
        samples each. 25 of 26 were achieved: Phi_97 could not be retrieved
        during the run's acquisition phase (curl return code 35, "Recv failure:
        Connection reset by peer", HTTP status 000, 11.118 s), so the contract's
        own on_cap_or_failure clause dropped that ell and recorded the
        obstruction with URL and timestamp. Per AGENTS.md rule 5 this is an
        infrastructure outcome and is NEVER mathematical evidence about the
        attack. The Executor recorded the gate as NOT MET and substituted no
        value. The Validator verified the absence five independent ways
        (including that the producer's scratch directory holds exactly 46
        phi_j_*.txt files with no phi_j_97.txt), re-fetched the URL itself and
        obtained HTTP 200, 5651385 bytes, SHA-256
        093fead98fcde6966e652ac2651552f8be050c4433f6d7f341baaf71dc3d16ab -
        EXACTLY the byte length and hash the Executor recorded for an earlier
        session copy it did not use. That both AUTHENTICATES the Executor's
        record and shows the obstruction was transient. The Validator further
        measured ell = 97 supplementarily (validator-side, not part of the
        receipt): including it moves W-MID from 0.973920 to 0.972576, an effect
        of 0.0013, about 2.5% of the reported half-width. The gap is immaterial
        to every reported number and the gate nevertheless remains UNMET as a
        matter of record; only a Coordinator-authorised successor run can close
        it.
    - id: OBS-K
      subject: "Admissibility of the fit, and the fake-precision warning"
      text: >-
        All four pre-registered admissibility conditions are MET: half-width
        0.0546 <= 0.25; max |residual| on W-MID 0.2915 <= 0.75 bit; R^2 on W-MID
        0.9837 >= 0.98 (margin 0.0037); controls pass. The Validator confirms the
        run is contract-compliant here and the interval formally admissible. But
        it records the sharper point: the contract adopted the across-window
        union interval expressly because "with a near-deterministic counter the
        sampling CI understates the real uncertainty, which is model
        misspecification, and reporting the narrow interval alone would be fake
        precision" - and the union it produced does NOT contain the
        misspecification the same contract detected, since gamma_local_top =
        1.1706 sits 3.5 reported half-widths above the interval's top. The
        mechanism installed to absorb misspecification demonstrably did not
        absorb it. QUOTING [0.8691, 0.9783] ALONE WOULD BE EXACTLY THE FAKE
        PRECISION THE CONTRACT SET OUT TO AVOID.
    - id: OBS-L
      subject: "Red-team retraction of its own prior calibration (RT-C1)"
      text: >-
        In an independent session and against committed data, the Red Team
        PARTIALLY RETRACTS its own July objection RT-C1, which is the calibration
        the current H-WESO-001 position rests on. Two errors, both named by the
        Red Team itself. (1) ARITHMETIC: RT-C1 step (b) correctly divides by
        ell+1 and step (c) then charges ell^2 PER ENTRY anyway, so its gamma = 2
        is off by exactly one factor of ell. Lemma 3.3 of the frozen paper
        amortises explicitly over "each batch of (<=) ell + 1 new entries", and
        the run's committed samples confirm entries(ell) = ell + 1 at all 484
        samples (C-BASE.3, 484/484 exactly ell+1 distinct roots; the
        non-backtracking convention subtracts one only at ell = 2). The correct
        naive schoolbook calibration is gamma = 1 - precisely what the contract
        pre-registered and approximately what the homogeneous IMPL-A series
        measured (0.9332). (2) QUOTATION: RT-C1 headlined the c = 2.0 margin row
        (2.27 bits) while its own derivation supported only c >= 1.78 (5.87
        bits), overstating the objection by 3.6 bits. WHAT SURVIVES, and the Red
        Team calls it the load-bearing half: that c = 0 is not a neutral default
        and that the omitted per-entry work is UNMEASURED rather than small.
        That now stands confirmed and strengthened - but through the INTERCEPT
        (OBS-E), not through the exponent. FLAG CARRIED FORWARD AT THE RED TEAM'S
        OWN INSISTENCE: intercept-corrected c at NIST-I (1.42-1.80) lands
        numerically near RT-C1's original 1.78-1.88 for an entirely different and
        better-supported reason. That is a COINCIDENCE, not a confirmation of the
        original argument, and no record may read it as one.
    - id: OBS-M
      subject: "Modelled NIST-I margin arithmetic - a model substitution carrying NO claim tier"
      text: >-
        Red-team recomputation from committed constants (log2 T_full =
        108.7309, T_DG = 2^128, log2 B_opt = 14.2 from RUN-WESOVOW-001; fit
        intercepts and slopes from RUN-PEC-6be870-a), using the committed model's
        own vOW interpolation, margin(w) = 128 - (108.7309 - 0.5*log2(w) +
        overhead). At w = 2^30: paper convention (per_entry = 1) 34.27 bits;
        law-as-frozen at the reported gamma 20.44 bits; law + measured intercept
        11.52 bits; law + intercept scaled to p = 2^256 (the Red Team's preferred
        linear reading) 8.84 bits; quadratic W-ALL + p-scaled intercept (most
        pessimistic constructible, and itself inflated by the seam) 5.40 bits;
        quasi-linear or batched evaluation with gamma -> 0 and the p-scaled
        intercept only 22.67 bits; the old c = 2.0 row 2.27 bits, NOT supported
        by this data. Irreproducibility bands inherited from RUN-WESOVOW-001 via
        assumption L3: 2.2309 bits (the tightest correct band for a NIST-I TIME
        statement) and 3.5133 bits (the largest absolute deviation anywhere in
        that control, a MEMORY deviation at log2 p = 768). EVERY NUMBER IN THIS
        OBSERVATION IS A MODEL SUBSTITUTION UNDER ASSUMPTIONS L1-L4 AND CARRIES
        NO CLAIM TIER. None of it is a measured cryptographic-scale margin.

  inference: >-
    Three things follow, and they must be kept separate. (1) MEASURED, at
    `medium` tier and scoped to the tested range: the per-entry cost of
    Algorithm 1's table construction in the paper's own unit is not 1 but
    1843.5 to 94023.4 counted F_{p^2} multiplications over 2 <= ell <= 211 at
    p ~ 2^40 for this implementation pair, with a power-law exponent of 0.9332
    (schoolbook) and 0.7929 (Karatsuba) on homogeneous series and an
    ell-independent prefactor of 2^8.92 per entry. Section 4.1's
    one-operation-per-entry convention is therefore refuted at the tested scale,
    in the attack's DISFAVOUR. (2) DERIVED, carrying no tier: the pre-registered
    law that was to carry this to a NIST-I overhead parameter is defective - it
    retains the exponent and discards the measured level, and the run's own
    null object demonstrates the consequence - so the reported c values
    (0.771 / 0.864 / 0.868 at NIST-I) do not represent the overhead the NIST-I
    question needs, and the intercept-corrected values are ~1.42-1.80. (3) NOT
    DECIDED: the concrete NIST-I question. The defensible modelled margin spans
    5.40 to 22.67 bits at w = 2^30, a width of 17.27 bits against
    irreproducibility bands of 2.23 and 3.51 bits, and that width is set almost
    entirely by quantities this experiment did NOT measure - the polynomial
    multiplication routine (worth up to 13.25 bits) and the p-scaling of the
    intercept (2.7 bits) - not by anything it did measure. What HAS changed is
    which scenarios are live: the "overhead swallows the NIST-I advantage"
    branch is no longer supported by any reading constructible from this data,
    and neither is the c = 0 corner inherited from Section 4.1. The surviving
    question is whether the modelled advantage is roughly 5 bits or roughly 23
    bits. That is a real narrowing and it is not a determination.

  pareto:
    note: >-
      Carried at the Red Team's explicit instruction (docs/inventor-protocol.md
      section 5). The run package itself carries no such block because the
      contract did not require one for a pure measurement; that is recorded as a
      gap, not a violation.
    dominated_by_is_null: false
    dominated_by:
      - axis: "time (per-entry F_{p^2} multiplications)"
        dominator: >-
          The run's OWN IMPL-B. Over ell 11..101 IMPL-B is cheaper at every
          ell >= 17, by a factor rising to 1.2954, with homogeneous exponent
          0.7929 against IMPL-A's 0.9179 on the same range. The headline
          measurement is dominated by a routine inside the same file.
        status: "CHECKED, from the committed per_ell cost_ratio_A_over_B"
      - axis: "time (asymptotic per-entry exponent)"
        dominator: >-
          Any quasi-linear polynomial multiplication (Kronecker substitution,
          FFT) or batched Sutherland-type modular-polynomial evaluation - the
          route the frozen paper's own Lemma 3.3 footnote names and credits to
          Damien Robert - which drives gamma toward 0 up to polylog and removes
          up to 13.25 of the 25.43 modelled NIST-I overhead bits.
        status: >-
          STRUCTURALLY ESTABLISHED from the committed pipeline (gamma =
          exponent(M) - 1, corroborated by the run's own two-implementation
          pair), NOT MEASURED. The external Sutherland literature was not
          retrieved this session; that axis is UNCHECKED.
      - axis: "memory / data"
        dominator: >-
          Not applicable to the measured quantity, which stores nothing and
          queries nothing. For the downstream claim: the attack's memory is
          2^93.28 entries at NIST-I against Delfs-Galbraith's negligible memory,
          and the model's +0.5-bit-per-memory-bit credit is approximately
          cancelled by real access latency beyond DRAM. The attack does NOT
          dominate Delfs-Galbraith on the memory axis at any tested w; the
          comparison is a genuine trade, not a Pareto improvement.
        status: "CHECKED against RUN-WESOVOW-001 per_field memory rows"
    sota_delta:
      quantity: "width of the defensible NIST-I margin interval at w = 2^30"
      before: >-
        Scenario family c in {0, 0.5, 1, 2} with no measurement anywhere: margin
        in [2.27, 34.27] bits, width 32.00 bits, lower end INSIDE the 3.51-bit
        irreproducibility band.
      after: >-
        Margin in [5.40, 22.67] bits, width 17.27 bits, lower end OUTSIDE both
        the 3.51-bit and the 2.23-bit band.
      delta: >-
        Narrowing of 14.73 bits, i.e. 46% of the prior uncertainty width, plus
        the qualitative gain that the lower end now clears the irreproducibility
        band. What it is NOT: a determination of c. The residual 17.27-bit width
        is dominated by the unimplemented multiplication routine and the
        unmeasured p-scaling, and the run's own headline c = 0.864 is not inside
        the corrected interval at all.

  boundaries:
    - >-
      Scoped to p = 1099511627563 (a single prime, 80-bit F_{p^2}), to the 45
      prime degrees actually measured in 2 <= ell <= 211, to this pure-Python
      implementation pair, to this counting convention, and to this budget (one
      run, 396 s). AGENTS.md rule 7 applies in full: this is never
      cryptographic-scale validation.
    - >-
      Every statement about NIST-I/III/V derived here is an EXTRAPOLATION under
      a law now known to be defective, conditional on assumptions L1-L4, and
      carries no claim tier. The measured range never reaches ell >> log2(p^2)
      = 80, and at NIST-I the relevant ell ~ B_opt ~ 2^14.2 lies about 6.5
      octaves beyond the top of the measured range; the extension of any power
      law across that gap is assumed, not observed.
    - >-
      The experiment cannot discriminate between per-entry cost laws that agree
      over ell <= 211 and diverge at ell ~ 2^14. That identifiability limit is
      inherent to the measured range and is not removed by any precision within
      it; the batched-evaluation route is the concrete collision candidate and
      the missing separator is a third implementation at a different
      multiplication exponent (NC2c).
    - >-
      A measured gamma from an unoptimised implementation is an UPPER bound on
      the achievable per-entry exponent, so it is anti-attack by construction and
      cannot be used to argue that the attack is more expensive than the paper
      claims. Conversely the excluded costs (Phi_ell storage and I/O, coefficient
      reduction, hashing and table access) are excluded in the attack's favour,
      so the same gamma is simultaneously a LOWER bound with respect to those
      components. The two directions are NOT netted.
    - >-
      Nothing here bears on Heuristic 1: this is a cost measurement, not a
      smoothness measurement. Nothing here bears on CSIDH, (qt-)Pegasis, or
      torsion-based constructions, which the attack does not cover. Nothing here
      supports any security-parameter action.
    - >-
      The record makes no universal impossibility claim and no claim about
      Algorithm 1 as such: the supported quantifier order is "for THIS
      implementation pair, there exists gamma such that for all ell in the
      measured range", never the uniform form over implementations or primes.

  unresolved_confounds:
    - >-
      F-1 / RT2-C2: the fitted response changes definition at the ell = 101/103
      seam. The headline gamma, the curvature magnitude and gamma_local_top are
      all inflated by it; only a homogeneous re-fit or NC2a settles the residual.
    - >-
      F-3: half of the pre-registered primary window and all of W-TOP are
      un-null-controlled on the receipt. The Validator's supplementary null over
      103..211 (+0.0039) is not part of the receipt and does not repair it.
    - >-
      F-4 / U-3: shared Cantor-Zassenhaus stream and a shared pipeline make
      gamma_A and gamma_B non-independent, and would let a defect in the shared
      code pass C-ALT.2 unnoticed.
    - >-
      RT2-C3: p was held at a single value, so the p-axis has n = 1. The
      intercept's linear-in-log2(p) scaling, worth +2.678 bits at NIST-I, is
      DERIVED from the committed pipeline and not measured. NC2d discriminates.
    - >-
      RT2-C4 / assumption L4: batched Sutherland-type or quasi-linear
      multiplication is not implemented and is worth up to 13.25 bits at NIST-I,
      more than everything the run did measure. It is the dominant term in the
      residual uncertainty, and it is the paper's own stated expectation about
      how the list would be populated.
    - >-
      RT2-C7: the comparison charges measured overhead to the attack while
      leaving Delfs-Galbraith at the same nominal one-operation-per-step
      convention. Plausibly worth 5-7 bits back to the attack; unmeasured, of
      known sign, and deliberately not applied to any number above. The baseline
      constant k from the frozen bibliography's [15] and [3] remains unquantified
      in this repository.
    - >-
      RT2-H0: Heuristic 1's tail at the operating point sets P0 and therefore
      moves every margin row by the same amount, and remains untested. A
      programme that resolves c to +-2 bits while P0 carries an unbounded
      constant-factor uncertainty has optimised the wrong term.
    - >-
      F-7: W-TOP's bootstrap completed 1991 of 2000 replicates and the cluster
      bootstrap degenerates on extension ell that hold only 4 j-indices;
      mechanically explained and worth at most 0.0013 on the CI endpoints.
    - >-
      OBS-J: the core-grid completion gate is UNMET (ell = 97).
    - >-
      F-8: the manifest's inference block does not name a concrete resolved model
      identifier, because the runtime does not expose it to the subagent; the
      honest course under INFAMEND-20260802-P13-002, but the literal contract
      requirement is unmet. A future contract should place that obligation on
      the dispatching layer, which can name it.

