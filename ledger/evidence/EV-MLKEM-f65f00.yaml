  # ==================================================================
  # THE TERMINATION BRANCH
  # ==================================================================
  termination_branch:
    branch: T-HKZINDEP-CONFIRMED, read off PREREG-5 2.6's frozen precedence, no -PARTIAL
      suffix.
    read_off: >-
      COVERED = 6/6 (every one of the 6 named cells had confirmed ROUTE-P per-basis ground
      truth AND was computed within budget). ALL-SURVIVE holds: VERDICT''(hkz, L, b) = EXCEEDS
      at every one of the 6 covered cells (D_route'' = 1.7763568394002505e-15 uniformly,
      s_c^fib ranging 0.0038-0.0239, thirteen orders of magnitude larger). Under PREREG-5 2.6's
      precedence, T-HKZINDEP-NODATA does not fire (COVERED non-empty; fpylll was genuinely
      available, independently re-verified by the lead and both reviews in three separate
      sessions); between T-HKZINDEP-ARTIFACT and T-HKZINDEP-CONFIRMED, SOME-ARTIFACT does not
      hold at any cell, so T-HKZINDEP-CONFIRMED fires. |COVERED| = 6 = 6, so no -PARTIAL
      suffix. BOTH REVIEWS INDEPENDENTLY RE-DERIVED THIS from the raw per-cell VERDICT'' array
      with no producer import and CONFIRM IT CORRECT (Validator termination_branch_check; Red
      Team section 5, Fourth target). NEITHER REVIEW DISPUTES THE BRANCH CALL -- both state
      this explicitly.
    what_it_licenses_per_prereg_5s_own_text_quoted_verbatim: >-
      "for the covered cells only, BATCH-fbb639's hkz EXCEEDS verdicts may be cited WITHOUT
      EITHER EV-MLKEM-965a37's F-1/RT-1 code-sharing qualification OR EV-MLKEM-5aa471's
      reduction-quality qualification -- the SAME discharge lam1n already received in
      BATCH-6e08fe, extended to hkz on this batch's own, quality-matched evidence." SEE
      hkz_discharge_corrected_citable_wording BELOW FOR WHY THIS DEFAULT LICENSE TEXT, TAKEN
      LITERALLY AND UNQUALIFIED, OVERSTATES WHAT THIS BATCH'S OWN EVIDENCE ESTABLISHES, DESPITE
      THE BRANCH ITSELF FIRING CORRECTLY AND MECHANICALLY.
    what_it_forbids_unchanged: >-
      Extending the discharge to any UNCOVERED (middle-beta) cell; any claim about ML-KEM, any
      FIPS 203 parameter set, any attack cost or any cost model; closing, pausing or completing
      GOAL-MLKEM-005; treating this as A-1 held for hkz. This record makes none of those
      forbidden claims.

  # ==================================================================
  # ITEM 1 -- THE CORRECTED, NARROWED CITABLE WORDING
  # ==================================================================
  hkz_discharge_corrected_citable_wording: >-
    T-HKZINDEP-CONFIRMED FIRES CORRECTLY AND MECHANICALLY -- both independent reviews confirm
    this from the raw data, with no producer import, and neither asks to reopen or reverse the
    branch call. ROUTE-I'' (fpylll public API, Branch A) reproduces ROUTE-P's archived hkz
    values to within {0, 2^-50, 2^-49} (max D_route''=1.776e-15) at all 6 covered cells (48/48
    matched bases), far below every s_c^fib (0.0038-0.0239). BOTH INDEPENDENT REVIEWS, VIA
    GENUINELY DIFFERENT METHODS (Validator: a from-scratch reimplementation of BOTH routes'
    reduction algorithms establishing that the raw HKZ-reduced Gram-Schmidt norms are
    BIT-IDENTICAL at every one of 21 tested (cell, basis) pairs, with the entire measured
    D_route'' traced to a downstream logdet-formula choice and ZERO measured disagreement in
    the actual reduction output; Red Team: a same-code-rerun null-control proving zero
    execution-time numerical noise in this pipeline, plus a third, independently-structured
    implementation converging to ROUTE-P's archived value to the same quantized precision),
    CONVERGE ON A CORRECTION PREREG-5 2.6'S OWN DEFAULT LICENSE TEXT MUST CARRY: PREREG-5 2.2
    Branch A's own fidelity-matching mandate -- requiring ROUTE-I'' to replicate ROUTE-P's
    exhaustive-enumeration structure "as closely as an independently-written wrapper allows" --
    means near-machine-epsilon agreement is close to a MATHEMATICAL CERTAINTY for ANY two
    correctly-converged HKZ-quality (exhaustive-enumeration) implementations, REGARDLESS of
    code-level independence, once both reach genuine HKZ quality. THE CORRECTED, NARROWED
    READING A FUTURE CITATION MUST CARRY (adapted from the Validator's own
    termination_branch_check.what_this_branch_may_and_may_not_be_cited_for and the Red Team's
    own narrowest_supported_statement, verified against both reports' cited evidence): "a
    genuinely non-code-shared, correctly HKZ-quality-matched route agrees with ROUTE-P's
    archived hkz values to floating-point precision at the 6 covered cells, the behavior
    expected of two implementations that both genuinely reach the true HKZ-reduced
    (successive-minima) profile via exhaustive enumeration to convergence -- a result this
    batch's own built controls (a same-code-rerun null baseline; a third, independently-
    structured implementation; a from-scratch dual-route reimplementation) positively
    corroborate. This measurement has genuine, demonstrated power to catch a WRAPPER-level bug
    (basis construction, GSO initialization order, insertion/postprocessing bookkeeping,
    tolerance handling) -- exactly the class of bug BATCH-fbb639's original code-sharing
    concern (F-1/RT-1) was about, and exactly what PREREG-5 2.2's license was written to permit
    checking this way -- and it does so more decisively than BATCH-6e08fe's LLL-quality
    ROUTE-I' did, which showed real, structured disagreement (0.015-0.223) at these SAME
    cells, confirming this instrument is not vacuous in general and DOES detect a genuine
    fidelity mismatch when one exists. A READER IS NOT ENTITLED to cite this discharge as
    ruling out a bug shared by the two routes' common definitional formula, basis-construction
    helper, or fpylll's own Enumeration/LLL kernel -- both ROUTE-P's hkz_profile and
    ROUTE-I'''s hkz_route_ii call the SAME underlying fpylll.Enumeration(...).enumerate(...)
    primitive for their respective decisive HKZ-sweep and verification-enumeration steps
    (Validator IND-4), so a defect at that shared level would be reproduced identically by
    construction; this batch's design does not, and given the fidelity-matching mandate
    STRUCTURALLY CANNOT, test that, regardless of how small D_route'' reads -- which was
    arguably the ORIGINAL question this three-batch campaign (BATCH-fbb639's code-shared
    comparison; BATCH-6e08fe's LLL-quality re-implementation; this HKZ-quality attempt) set
    out to answer." This is NOT a violation of PREREG-5, whose own text anticipated and
    explicitly pre-empted the "same library" objection (PREREG-5 2.2 Branch A: "Using the SAME
    underlying library ROUTE-P uses is EXPLICITLY LICENSED"); it is a scope correction to what
    the resulting discharge, cited bare, would otherwise be read to mean.

  # ==================================================================
  # ITEM 2 -- PREREG-5 2.8'S REVISIT CONDITION -- WHICH ARM FIRES, AND WHAT IT IS WORTH
  # ==================================================================
  revisit_condition_ruling: >-
    PREREG-5 2.8 (carried verbatim from DEC-20260813-1aae44 section 11) states two arms: "if
    the HKZ-quality ROUTE-I'' shows D_route' staying at or near machine epsilon at the covered
    cells, that DISCHARGES hkz's status to T-INDVERIFY-CONFIRMED-equivalent for those cells,
    exactly as lam1n's discharged" (arm 1); "if it shows D_route' still growing toward
    s_c^fib's scale even at matched HKZ fidelity, THAT is the genuine test PREREG-4 2.8's
    revisit condition anticipated, and ITS consequent ... SHOULD fire at that point" (arm 2).
    THE DATA SATISFIES ARM 1, LITERALLY AND UNAMBIGUOUSLY: D_route'' = 1.776e-15 at every one
    of the 6 covered cells, thirteen orders of magnitude below the smallest s_c^fib (0.0038) --
    "at or near machine epsilon" by any reading. Arm 2's antecedent (growth toward s_c^fib's
    scale) is not merely unsatisfied but is the OPPOSITE of what was measured. hkz's status
    THEREFORE DOES MOVE TO T-INDVERIFY-CONFIRMED-equivalent FOR THESE 6 CELLS, superseding the
    "neither confirmed nor flagged" status DEC-20260813-1aae44 left it in -- the antecedent of
    arm 1 is satisfied on its own frozen terms, and PREREG-5 2.6 already operationalized this
    exact outcome as T-HKZINDEP-CONFIRMED, which fired mechanically, per section 1/termination
    branch above.
    DOES THE CORRECTED, NARROWED READING FROM ITEM 1 CHANGE WHAT THIS DISCHARGE IS WORTH? IN
    PART, AND THE PART MATTERS, BUT IT DOES NOT CHANGE WHICH ARM FIRED. The discharge is a
    genuine status improvement -- hkz moves from "neither newly confirmed nor newly flagged"
    to a status the frozen text itself names T-INDVERIFY-CONFIRMED-equivalent -- but "exactly
    as lam1n's discharged" is not the correct measure of its strength. lam1n's discharge rests
    on lambda_1 being an EXACT, algorithm-independent invariant with a unique correct value:
    ANY correct implementation of exact SVP enumeration, at ANY reduction quality sufficient to
    certify it, lands on the identical integer, so lam1n's agreement is evidence against
    code-sharing REGARDLESS of whether the two routes' reduction quality is matched. hkz's
    agreement here is evidence of a DIFFERENT and narrower kind: it is near-certain specifically
    BECAUSE PREREG-5 2.2's own fidelity-matching mandate forces both routes to exhaustive
    enumeration to convergence, which makes the GSO-tail profile itself an essentially unique
