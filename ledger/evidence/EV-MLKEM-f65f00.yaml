  # ==================================================================
  # ITEM 4 -- THE FALSE "REUSED IDENTICALLY" CLAIM (RT-9)
  # ==================================================================
  logdet_correction: >-
    THE PRODUCER'S INDEPENDENCE DECLARATION (measure_hkz_indep.py module docstring, written
    before any D_route'' number is computed, per PREREG-5 2.2 point 4) STATES, VERBATIM: "The
    hkz observable's own definition itself ... where logdet = (d-k)*log(q) (the exact
    closed-form determinant of this lattice family) ... is REUSED IDENTICALLY." THIS IS
    CHECKABLY FALSE, per the Red Team's direct reading of the committed, already-archived
    measure_relvar.py (RT-9). ROUTE-P's actual, as-run hkz computation
    (measure_relvar.py:564,569-570) uses `logdet = prof["logdet"]`, where
    `prof["logdet"] = 0.5*sum(log(r))` (measure_relvar.py:295-352, hkz_profile) -- the
    EMPIRICAL, GSO-summed determinant estimate from ROUTE-P's OWN post-reduction Gram-Schmidt
    norms, basis-DEPENDENT (each basis has its own reduction and its own accumulated
    rounding). The closed form `(d-k)*log(q)` DOES appear in measure_relvar.py, but only inside
    `x_null_of` (lines 260-266), computing a DIFFERENT candidate (X_null), never hkz. The Red
    Team quantified the resulting numerical gap directly: for L9 (d=30, k=9) the two logdet
    estimates differ by 9.47e-16, contributing EXACTLY 8.881784e-16 = 2^-50 to the resulting
    hkz value -- ONE OF THE EXACT TWO NONZERO DEVIATION MAGNITUDES FOUND THROUGHOUT THE
    PRODUCER'S OWN REPORTED PER-BASIS ARRAYS (the 14/48 cases at 2^-50, per RT-10's tally
    below). At L7 and L11 the closed-form and empirical logdet/d values happen to coincide to
    double precision (0.0 diff), consistent with the per-basis-varying, not per-lattice-
    uniform, pattern the producer's own data shows. THIS RECORD ADOPTS THE CORRECTION THE RED
    TEAM'S OWN REPORT NAMES AS OWED: the committed record must describe the two routes as
    DELIBERATELY SUBSTITUTING a different, though mathematically-equivalent-in-exact-arithmetic
    but numerically DISTINCT logdet estimator -- NOT as "identical reuse" -- and must credit
    this substitution as ONE concrete, positively identified, quantified source of D_route'',
    not attribute the entire residual to unspecified "summation-order rounding" (which the
    producer's own hkz_indep_writeup.md section 8 does, and which RT-10 below shows is itself
    an incomplete characterization). This factual correction does not change D_route'',
    VERDICT'', the aggregate reading, or the termination branch in any respect -- D_route''
    remains 1.776e-15 at every cell either way, thirteen orders of magnitude below every
    s_c^fib.

  # ==================================================================
