  third_attempt_boundary_ruling: >-
    PREREG-5 2.8 / DEC-20260813-1aae44 section 11 declared BATCH-a6fab5 "the THIRD dedicated
    attempt at hkz's independent-verification question" and stated a boundary that fires
    literally only under T-HKZINDEP-NODATA branch (b) (fpylll unavailable AND a from-scratch
    HKZ implementation judged infeasible): in that case, no FOURTH iteration of "the same
    measurement" is licensed absent a change in tooling. T-HKZINDEP-NODATA did NOT fire here --
    T-HKZINDEP-CONFIRMED fired, on the MORE favourable branch the declared boundary did not
    literally contemplate. TWO QUESTIONS FOLLOW, RULED SEPARATELY.
    (a) DOES REACHING T-HKZINDEP-CONFIRMED COUNT AS "REACHING GENUINELY HKZ-QUALITY
    INDEPENDENCE" FOR PURPOSES OF THE BOUNDARY, SUCH THAT NO FURTHER ITERATION OF THIS SAME
    MEASUREMENT DESIGN IS LICENSED REGARDLESS OF THE NARROWER SCOPE? YES. The boundary's
    purpose, read from its own text and from DEC-20260813-1aae44's rationale for commissioning
    this batch, was to prevent open-ended re-running of the ROUTE-P-vs-ROUTE-I''-style
    comparison once the tooling question (fpylll availability) was resolved one way or the
    other. Tooling WAS resolved (fpylll available, independently confirmed in three separate
    sessions: the lead, the Validator, the Red Team), a genuinely HKZ-quality, non-code-shared
    route WAS built, and the measurement reached its designed terminal state
    (T-HKZINDEP-CONFIRMED, no -PARTIAL suffix, 6/6 covered). Running a FOURTH code-independent,
    HKZ-quality-matched re-implementation of the identical ROUTE-P-vs-ROUTE-I'' comparison
    would not learn anything new: this batch's own reviews' controls (a same-code rerun
    proving zero execution noise; a third, differently-structured implementation converging to
    the same quantized precision) already demonstrate, directly, what a fourth iteration of
    THIS SAME measurement design would show -- near-certain convergence, regardless of code
    independence, because that is what the fidelity-matching mandate forces by construction.
    RULING: the boundary IS satisfied for the ORDINARY ROUTE-P-vs-ROUTE-I'' comparison design;
    no fifth-generation ROUTE-I''' of that same shape is licensed for hkz absent a genuinely
    new consideration (e.g. a different reduction library entirely, which this record does not
    anticipate changing the outcome given the mathematical argument in item 1).
    (b) DOES THE NARROWER DIAGNOSTIC POWER LICENSE A FURTHER, DIFFERENTLY-DESIGNED TEST -- THE
    MUTATION-TESTING CONTROL BOTH REVIEWS PROPOSE (inject a known defect into a COPY of the
    shared basis-construction/definitional code and confirm D_route'' actually catches it)?
    ASSESSED ON THE MERITS, EXTENDING PREREG-5 2.7'S OWN THREE-PART REPAIR-BAR TEST TO THIS
    SPECIFIC QUESTION (not merely citing either review's opinion that it would not count as a
    "fourth iteration"): (1) DOES IT SPECIFY A NEW CRITERION, CLAUSE OR GATE? No. It is a
    diagnostic/instrument-power CALIBRATION check -- a positive control with a KNOWN, injected
    ground truth -- not a new dispersion criterion, admissibility gate, or working assumption
    over any candidate; it touches no A-1 sub-clause. (2) DOES IT RE-VERIFY A MEASUREMENT
    ALREADY MADE, OR MEASURE A GENUINELY DIFFERENT OBJECT? It measures a DIFFERENT OBJECT: not
    "does ROUTE-I'' agree with ROUTE-P on hkz" (already measured three times, across
    BATCH-fbb639, BATCH-6e08fe and this batch), but "does the D_route'' comparison mechanism
    detect a KNOWN, deliberately injected defect in the code path both routes are licensed to
    share." This is a null-object/positive-control experiment of the kind docs/inventor-
    protocol.md section 3 ("controls before belief") already requires elsewhere in this
    campaign's own conventions and was never built for this specific D_route mechanism --
    PREREG-5 3.1's own "could-not-fail" check addressed only whether D_route''/s_c^fib were
    FIXED BY CONSTRUCTION, not whether the comparison has POWER to detect a shared-code defect,
    which is a distinct question this record's item 1 shows was never actually tested. (3) IS
    ITS OUTCOME A VERIFICATION RESULT ABOUT hkz's OWN PRIOR MEASUREMENT, OR A REPAIRED GATE'S
    PASS/FAIL? Neither. Its outcome is a statement about the INSTRUMENT's OWN calibration/power
    -- it does not reopen, reverse, or re-score T-HKZINDEP-CONFIRMED's firing, does not touch
    hkz's admissibility, and licenses no new claim about any lattice. RULING: the
    three-part test is satisfied for the mutation-testing control exactly as it was satisfied
    for this batch's own measurement (PREREG-5 2.7) and for DEC-20260813-1aae44's own acts
    (section 4) -- it is NOT a further consecutive gate/criterion repair, and it is NOT barred
    by the third-attempt boundary, which targeted the ORDINARY comparison design specifically,
    not an instrument-calibration control of a structurally different kind. I AGREE WITH BOTH
    REVIEWS' ARGUMENT ON ITS MERITS, having independently re-derived it rather than adopting
    it by citation. The underlying open question -- whether this specific instrument has real
    power against a shared-code defect at the definitional-formula or fpylll-kernel level --
    remains genuinely open and is not resolved by anything in this record; a mutation-testing
    control is the cheapest available test that would close it. See next_actions for whether
