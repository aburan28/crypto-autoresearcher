  proof_status: derivation
  proof_status_note: >-
    LAYERED, STATED SEPARATELY SO NEITHER LAYER BORROWS THE OTHER'S WARRANT. (1) The code-
    independence finding (reduction/enumeration step non-code-shared from both barred
    lineages) is a DERIVATION: a direct, checkable structural comparison of the actual
    committed source (import-statement grep plus class-identity comparison via
    inspect.signature, both reviews), giving zero verbatim-copy hits and two genuinely distinct
    fpylll BKZReduction classes. (2) The central methodological finding -- that near-machine-
    epsilon agreement is near-certain for any two correctly-converged HKZ-quality
    implementations regardless of code independence -- rests on a near-proof-like mathematical
    argument (exhaustive, pruning=0 enumeration to a fixed point provably computes the
    successive minima of the projected sublattices, a genuine lattice invariant, not an
    implementation artifact) COMBINED WITH built empirical controls that positively corroborate
    it (a same-code-rerun null baseline showing zero execution noise; a from-scratch
    reimplementation of both routes reproducing bit-identical raw GSO norms at 21/48 pairs; a
    third, independently-structured implementation converging to the same quantized precision).
    This is closer to a mathematical necessity, empirically corroborated, than a pure
    statistical inference -- but it is NOT a machine-checked proof, and both reviews present it
    as such. (3) The logdet-formula mechanism (RT-9/RECOMP-4) is a DIRECT, CHECKABLE
    ARITHMETIC FACT: reading the two cited formulas off the committed scripts and computing
    their numeric difference reproduces the reported residual exactly. NEITHER THIS RECORD NOR
    EITHER REVIEW CLAIMS THE UNDERLYING QUESTION -- WHETHER A DEFECT SHARED AT THE FPYLLL-
    ENUMERATION-KERNEL LEVEL OR IN THE ROUTES' COMMON DEFINITIONAL/BASIS-CONSTRUCTION FORMULA
    WOULD BE CAUGHT BY THIS INSTRUMENT -- IS RESOLVED. Both reviews independently conclude the
    instrument has near-zero power there; neither built (and this batch's own design cannot
    build, per its own fidelity-matching license) a test that would positively confirm or
    refute a shared-kernel defect's absence.

