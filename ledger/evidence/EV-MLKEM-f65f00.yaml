  carried_findings: >-
    RT-10 (MODERATE, Red-Team-alone): hkz_indep_writeup.md section 8's characterization of the
    uniform D_route''=2^-49 as reflecting "floating-point summation-order rounding ... of order
    a few 2**-52" understates how structured the pattern actually is. Direct per-basis,
    per-bit diffing of the producer's OWN already-reported route_p_values/route_ii_values
    (no new reduction) shows all 48 (cell, basis) comparisons take EXCLUSIVELY one of three
    exact values -- 0 (20/48), 2^-50 (14/48), or 2^-49 (14/48) -- never anything else, with the
    raw IEEE-754 mantissa-bit difference always an exact power of two that scales with each
    value's own binade, so the ABSOLUTE deviation, not the relative ULP count, is invariant
    across a >100x range of hkz magnitudes (d=20-40, hkz from -0.0038 to -0.45). This is the
    signature of a small, fixed set of deterministic bit-level causes (of which the
    logdet-formula mechanism, item 4, is now one, positively identified and quantified), not
    diffuse independent rounding noise. The report's description should be corrected
    accordingly; this does not change any number or the termination branch, and the producer's
    own report already discloses the pattern as "not anticipated" rather than hiding it -- the
    correction narrows the offered EXPLANATION, it does not allege concealment.
    RT-11 (MINOR, Red-Team-alone, explicitly NOT a finding about the producer): the Red Team's
    own probe4_third_independent_implementation.py exhibited an unresolved, basis-specific
    slow/wrong-answer anomaly at hkz/L7_b5 basis i=0 (53.9s, wrong value despite the probe's own
