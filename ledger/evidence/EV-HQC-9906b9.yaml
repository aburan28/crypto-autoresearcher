        parent: 0f3af2874d2e0b26b4dbd9ac51f1ffbabdeeaef4
        claims: [TASK-20260802-6344ed]
        declared_paths: 5
    producer_artifacts:
      - coordination/goals/GOAL-HQC-001/batches/BATCH-001/tasks/TASK-20260802-6344ed/source_access_log.yaml
      - coordination/goals/GOAL-HQC-001/batches/BATCH-001/tasks/TASK-20260802-6344ed/dfr_model_transcription.md
      - coordination/goals/GOAL-HQC-001/batches/BATCH-001/tasks/TASK-20260802-6344ed/corpus_dedup_report.md
      - coordination/goals/GOAL-HQC-001/batches/BATCH-001/tasks/TASK-20260802-6344ed/proposed_kn_lit_entries.md
      - coordination/goals/GOAL-HQC-001/batches/BATCH-001/tasks/TASK-20260802-0100a5/isd_costing_convention.md
