      - task: TASK-20260802-b8d69f
        role: validator
        verdict: ADMIT_WITH_QUALIFICATIONS
        path: coordination/goals/GOAL-HQC-001/batches/BATCH-001/reviews/TASK-20260802-b8d69f/validation_report.yaml
      - task: TASK-20260802-73a352
        role: red-team
        verdict: ADMIT_WITH_REQUIRED_CORRECTIONS
        path: coordination/goals/GOAL-HQC-001/batches/BATCH-001/reviews/TASK-20260802-73a352/red_team_report.md

  observations:
    - id: O-1
      statement: >-
        The HQC specification of 22/08/2025 (51 pp., sha256 174186cb...5406d)
        and Aragon-Gaborit-Zemor HQC-RMRS (arXiv:2005.10741, sha256
        cbb7dbd6...5446) were obtained in full text. The analytic
        decoding-failure-rate model is transcribed: SPEC 6.1.1 (error-vector
        distribution, Props 6.1.1/6.1.2, Eqs 1-3), 6.1.2 (Prop 6.1.3 union
        bound, Prop 6.1.4 improved bound with proof, Eqs 4-7), 6.1.3 (Theorem
        6.1, the concatenated-code binomial tail) and the 6.2.2
        delta-correctness -> Theorem 6.3 IND-CCA2 join where the
        (q_RO + q_D)*delta term enters.
      support: TASK-20260802-6344ed; independently re-acquired byte-identical by TASK-20260802-b8d69f
      strength_of_this_observation: verified_by_independent_reacquisition
    - id: O-2
      statement: >-
        The transcription carries 23 numbered assumptions (A1-A23), 11 verbatim
        hedges (H1-H11) and 10 published-text anomalies (X1-X10), contiguous
        with no gaps, with 15/15 displayed formulas in the load-bearing
        sections marked IMAGE-VERIFIED against rendered pages and exactly one
        formula marked EXTRACTION-DAMAGED.
      support: >-
        Counts recounted independently by TASK-20260802-b8d69f; 25 spot-checks
        against the re-acquired primary text returned 0 discrepancies, and the
        validator found no evidence of memory-reconstruction.
      strength_of_this_observation: verified_by_independent_recount
    - id: O-3
      statement: >-
        The transcribed model reproduces the specification's own published
        numbers. TASK-20260802-73a352 recomputed the full chain in exact
        rationals: Prop 6.1.1 + Eq (2) reproduce p-star to all four published
        digits at all three parameter sets, Prop 6.1.4 reproduces Table 11
        (-10.793 / -14.138 / -11.321 against published -10.79 / -14.14 /
        -11.30), and Theorem 6.1 yields 2^-132.86 / 2^-193.88 / 2^-260.51
        against targets 2^-128 / 2^-192 / 2^-256. Nine agreements.
      support: TASK-20260802-73a352 section 3
      strength_of_this_observation: independent_arithmetic_control
      what_this_does_and_does_not_mean: >-
        THIS IS A TRANSCRIPTION-FIDELITY CONTROL, NOT A VALIDATION OF THE
        MODEL. It shows the transcription faithfully reproduces what the
        specification computes. It does NOT test whether the model's
        predictions match reality, which is the entire point of this goal and
        has not been attempted. No assumption was tested and no measurement
        was made.
    - id: O-4
      statement: >-
        A proposed memory-charged ISD costing convention (ISD-FC-2026 v1) was
        produced, scheme-independently, charging all five mandated items:
        memory volume, memory access, precomputation, list
        construction/storage, and per-iteration linear algebra. 47 items, of
        which 24 are cited to a record and 23 are the producing agent's own
        choice. Five falsification hooks are stated.
      support: TASK-20260802-0100a5; counts recounted exactly by TASK-20260802-b8d69f
      status: PROPOSED, NOT ADOPTED
    - id: O-5
      statement: >-
        The hard scheme-independence gate on the convention holds: an
        exhaustive integer enumeration over both convention deliverables found
        zero HQC or SDitH concrete parameter numbers.
      support: TASK-20260802-b8d69f duty 5
      strength_of_this_observation: verified_by_exhaustive_enumeration

  unexpected_observations:
    - id: U-1
      statement: >-
        THE CORPUS THIS PROGRAM READS FROM CANNOT SUPPORT ITS OWN PROVENANCE
        MARKINGS. 7457 of 7666 knowledge/literature entries carry
        citation_verified: read. The downloads/ tree those entries cite does
        not exist, is not gitignored, and has never been git-tracked; 7421
        entries cite a path inside it and 7477 carry an in-record note saying
        they were bulk-seeded from a PDF's first two pages with heuristically
        parsed metadata.
      discovered_by: >-
        Fragments reported independently by BOTH producers; scope measured by
        TASK-20260802-b8d69f; every headline number above re-measured
        independently by the Coordinator before this record was written.
      recorded_under: AGENTS.md rule 8 (unexpected observations must be recorded, not silently discarded)
      framing_correction: >-
        THE COORDINATOR'S ORIGINAL FRAMING WAS WRONG AND IS CORRECTED HERE.
        The snapshot receipt for TASK-20260802-1f2e40 called the two producers'
        independent convergence on this defect 'the most consequential thing in
        this batch'. TASK-20260802-73a352 objection O9 refutes that as a
        CONTROLLED NULL: at 7421/7666 = 96.8% prevalence, any two agents
        touching the corpus would hit it, so convergence is near-certain and
        carries no independent evidential weight. The FINDING stands; the
        INFERENCE FROM CONVERGENCE does not.
      scope_limits:
        - >-
          The absence of downloads/ does NOT by itself prove any individual
          read never happened. knowledge/SEEDING.md defines the read level as
          an ACT ("only after fetching the actual source"), not as a retained
          artifact. The defect is that 99.5% of the corpus is now
          UN-RE-VERIFIABLE, and that the bulk-seed note on 7477 entries is in
          direct tension with the read marking on those same entries.
        - >-
          This observation is OUT OF SCOPE for RQ-HQC-001, which asks about
          HQC's DFR model. It is recorded because rule 8 is not conditional on
          an observation being on-topic.
      concrete_instance_inside_this_goal: >-
        KN-LIT-2141 (Guo-Johansson), the one corpus record directly on this
        goal's DFR-attack lane, is at citation_verified: read with no retained
        artifact, and its recorded key claim reads '264' where the publisher
        abstract reads 2^64 - confirmed by TASK-20260802-b8d69f as a flattened
        superscript.
      promoted_to: KN-OPEN-3f7a21

  defects_found_in_this_batch:
    - id: D-1
      severity: high
      found_by: TASK-20260802-73a352 (objection O1)
      statement: >-
        The transcription records RS-S3 as [90, 32, 49] and files the
        inconsistency as a SOURCE anomaly (X6), when it is almost certainly the
        transcription's OWN extraction error. A Reed-Solomon code is MDS, so
        d = n - k + 1 = 90 - 32 + 1 = 59; the transcribed delta = 29 gives
        2*29 + 1 = 59 independently. Both routes force 59.
      coordinator_verification: >-
        INDEPENDENTLY CONFIRMED by the Coordinator by direct arithmetic before
        this record was written. Both computations reproduce 59.
      consequence_if_uncorrected: >-
        TASK-20260802-73a352 computes the error as worth 50.7 bits at NIST-5
        (2^-260.51 against 2^-209.77), i.e. it would manufacture a false
        finding that HQC-5 misses its DFR target by 46 bits. This is precisely
        the kind of artifact that must die in review rather than in a
        publication.
      status: MUST BE CORRECTED BEFORE ANY KN-LIT ENTRY IS FILED
    - id: D-2
      severity: high
      found_by: TASK-20260802-73a352 (objection O2)
      statement: >-
        The Coordinator's claim - carried in the TASK-20260802-1f2e40 snapshot
        receipt and in that commit's message - that eprint.iacr.org served
        pages with no Cloudflare challenge and therefore contradicted
        GOAL-HAWK-001 BATCH-002 IS FALSE AS STATED. HAWK recorded
        pdf_endpoint BLOCKED and html_endpoint REACHABLE; the producer tested
        three HTML endpoints only and never the PDF endpoint, so it never
        tested the claim it was said to contradict.
      coordinator_verification: >-
        INDEPENDENTLY CONFIRMED by the Coordinator: eprint.iacr.org/2026/1498.pdf
        returns HTTP 403 while eprint.iacr.org/2026/1498 returns HTTP 200. The
        HAWK finding STANDS UNREFUTED.
      correction_mechanism: >-
        The receipt and commit message are immutable and are NOT rewritten.
        This record supersedes them on the point. Anyone reading either must
        read D-2 with it.
      surviving_half: >-
        The csrc.nist.gov half of the same producer report IS supported and is
        strengthened by the red team: csrc.nist.gov returned HTTP 200 with real
        content and www.nist.gov also returns 200, against
        RQ-HQC-001.provenance's record of unreachability via proxy CONNECT 403.
        RQ-HQC-001 is immutable; the correction supersedes, and the practical
        consequence is that a recorded source-access blocker in this program is
        stale and other goals may be resting on it.
    - id: D-3
      severity: medium-high
      found_by: TASK-20260802-73a352 (objections O4 and O5)
      statement: >-
        TWO COORDINATOR CLAIMS IN BATCH-001-OPENING.md SECTION 4 ARE OVERREADS,
        and both are corrected here. (a) 'The goal's next_action is already
        partly discharged because IDEA-20260801-011 exists' is WRONG:
        IDEA-20260801-011 is one of 21 proposals filed 2026-08-01, one per
        research question across the whole roster - a bulk sweep, not a
        /propose-ideas run for RQ-HQC-001. (b) 'The proposal is not executable
        as specified' is OVERSTATED: it was blocked by
        RQ-HQC-001.constraints[0], an external precondition, not internally
        defective, and two of the Coordinator's sub-charges are withdrawn.
      coordinator_verification: >-
        CONFIRMED by the Coordinator: 21 proposals carry an IDEA-20260801-*
        identifier, spread across ~20 distinct question_ids.
      what_the_coordinator_missed: >-
        The red team found the real named-rule violation that section 4 did NOT
        find: dominated_by is null with no frontier check in 20 of the 21 swept
        proposals, which is a docs/inventor-protocol.md Pareto-honesty
        requirement, not a scheduling observation.
      note_on_process: >-
        This is the second consecutive campaign in which a Coordinator
        'the goal's next_action is defective' claim was found to be an overread
        by its own red team; GOAL-HAWK-001 BATCH-001 is the first. The
        Coordinator flagged that precedent in the handoff and asked to be
        checked against it. Being checked worked; making the error twice is the
        finding.
    - id: D-4
      severity: medium
      found_by: TASK-20260802-73a352 (objection O8)
      statement: >-
        The TASK-20260802-1f2e40 receipt reports RQ-HQC-001's precondition
        'DISCHARGED' on a paraphrase. The constraint says primary sources must
        be 'filed as KN-LIT entries'. Nothing is filed. The precondition is
        discharged for ACQUISITION and remains open for FILING - premature by
        exactly one step.
      status: corrected here; the decision records the precondition as PARTLY discharged
    - id: D-5
      severity: medium
      found_by: TASK-20260802-73a352 (objections O6 and O7)
      statement: >-
        In ISD-FC-2026, the mandatory F4 self-audit is under-determined by the
        convention's own rules (U2 and section 3(g) never pin N; Wiener's form
        is F = Theta(T r m^{1/3}) at p = Theta(m^{2/3}/r)), and the second
        stated reason for the cube-root memory-access choice is circular.
        Separately, the producer's self-nomination of U4b as 'the most abusable
        clause' is REJECTED: U4b is well guarded, and the actually abusable
        surface is U3 plus section 9, which silently obliges the program to
        re-derive every baseline it compares against.
      status: >-
        ISD-FC-2026 is NOT ADOPTED by this decision. These are the conditions
        on adoption.
    - id: D-6
      severity: low-medium
      found_by: TASK-20260802-b8d69f
      statement: >-
        The proposed KN-LIT entry for the specification both states and
        disclaims the content of the one EXTRACTION-DAMAGED formula, SPEC Eq
        (13). The validator rendered SPEC p.44 and found the transcription
        EXACT - the marker is over-cautious, not wrong - and SPEC 6.2.3 (p.45)
        supplies the same content in undamaged prose. A one-line superseding
        citation fix at filing.
    - id: D-7
      severity: low
      found_by: TASK-20260802-0100a5 (self-reported), verified by the Coordinator and TASK-20260802-b8d69f
      statement: >-
        TASK-20260802-0100a5 read beyond its declared read_scope (into
        knowledge/literature past KN-LIT-7565, KN-OPEN-017, knowledge/INDEX.md,
        and GOAL-SSI-001 BATCH-002 artifacts), on the grounds that the
        program's only existing full-cost convention instance lives there. NO
        WRITE left write_scope: the snapshot commit contains exactly the two
        declared artifacts plus the Coordinator receipt. Recorded as a
        deviation rather than waived.

  what_this_evidence_does_not_establish:
    - >-
      NOTHING about whether HQC's decoding-failure-rate model is correct,
      optimistic, or pessimistic. The model was transcribed. It was not tested.
      No decoding trial was run at any parameter set, reduced or standardized.
    - >-
      NOTHING about HQC's IND-CCA security, its concrete ISD cost, or its
      implementation-attack surface.
    - >-
      That ISD-FC-2026 is the right costing convention, or any convention at
      all. It is proposed and explicitly not adopted.
    - >-
      That any KN-LIT entry is filed. None is. RQ-HQC-001's filing precondition
      remains open.
    - >-
      Any statement about HQC's standardized parameter sets. The toy ceiling
      stands.

  review_independence_limitation: >-
    Both reviews were INDEPENDENT SESSIONS but NOT INDEPENDENT MODELS. No
    policy alias in orchestration/model-policies.yaml resolves under this
    Claude Code harness (CLAUDE.md: subagent frontmatter supports only Claude
    models, so all subagents run model: inherit), so validator and red team
    both ran with requested_policy review-adversarial, resolved_model_id
    claude-opus-5, fallback_used true, and the xhigh reasoning floor that
    policy requires is unverifiable here. NOTHING IN THIS RECORD IS ADMISSIBLE
    TOWARD THE AGENTS.md RULE 13 CLOSURE QUORUM.
  inference:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: claude-opus-5
    fallback_used: true
    model_verified: false
