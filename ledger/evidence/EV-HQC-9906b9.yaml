evidence:
  id: EV-HQC-9906b9
  experiment_id: null
  experiment_id_note: >-
    No experiment exists. BATCH-001 was a source-acquisition and
    convention-fixing batch: no decoding trial was run, no measurement was
    made, and no run record was produced. This evidence record documents what
    the batch READ and what two independent reviews found in it. It is filed
    against the goal and question, not against an EXP-*.
  goal_id: GOAL-HQC-001
  question_id: RQ-HQC-001
  hypothesis_id: RQ-HQC-001
  hypothesis_id_note: >-
    NO HYPOTHESIS EXISTS FOR THIS GOAL. active_hypothesis_ids was empty before
    this record and is empty after it, and nothing here creates one. The schema
    requires this field to be present and to resolve, so it carries the
    QUESTION id, following the convention already used by EV-HAWK-001. Read it
    as 'the question this evidence is filed against', NOT as an assertion that
    any H-HQC-* exists.
  run_ids: []
  run_ids_note: >-
    Empty and correct. runs_authorized was 0 for both producers. No run
    manifest is claimed, and no timing, statistic, or measurement appears in
    this record.
  batch_id: BATCH-001
  recorded_at: '2026-08-02'
  owner: coordinator

  direction: inconclusive
  direction_note: >-
    'inconclusive' is the only honest value. The batch tested NOTHING about
    HQC. It obtained and transcribed the object that a future experiment would
    test. An evidence record that read a specification carries no direction on
    the security question, and calling this 'support' for anything would be
    the exact overclaim AGENTS.md rule 7 forbids.

  claim_tier: toy
  claim_tier_note: >-
    RQ-HQC-001 sets a toy ceiling until a certified instance at or above
    standardized parameter scale exists. Nothing in BATCH-001 approaches that,
    and the ceiling is untouched.
  proof_status: not_applicable
  proof_refs: []
  certificate:
    kind: none
    reason: >-
      No solve, relation, or break is claimed, so there is nothing to certify.

  strength: n/a
  strength_note: >-
    Evidence strength grades how well a result supports a claim about the
    research question. This batch makes no such claim. Recorded as n/a rather
    than forced onto the scale.

  source_artifacts:
