    - id: O-CEST
      text: >-
        CEST-PKE has independently rederived accepted-key selected-message
        correctness via psi_E([r]P)=[r]psi_E(P). O2 breaks on unavailable
        honest interfaces and O5 breaks because only EndRing-solver-to-break is
        available; the scheme transcript factors through one evaluator.
    - id: O-ERMCE
      text: >-
        ER-McE is contradicted in its exact raw ciphertext syntax. For distinct
        m0,m1, exactly one residual c-m_i G_pub has weight t under the declared
        distance at least 2t+1, yielding IND-CPA success probability 1 and
        advantage 1/2. This is a static derivation, not an experiment and not a
        break of general McEliece.
    - id: O-gap
      text: >-
        The selected complete-ring-necessity and attacker-extraction gap was
        not repaired by RWCT-PKE. Fresh review returned R1/R2/R3=breaks:
        decryption is ill-typed, zero-coin identity acceptance is ambiguous,
        all-variable words can cancel to one evaluator, and the real-key,
        extraction, and basis-alignment arrows remain missing.
    - id: O-obstruction-scope
      text: >-
        RWCT's factorization through restricted word evaluators is exact, but
        no strict efficient quotient, collision pair, meta-reduction, or
        reconstruction impossibility is proved. The proposed family-level
        obstruction is inconclusive rather than a no-go theorem.
    - id: O-final
      text: >-
        Three candidate packets were produced and independently evaluated.
        Finalist count is zero; no candidate has complete O1--O6 discharges,
        no implementation or parameter run is warranted for these exact
        syntaxes, and the goal remains active.
    - id: O-validation
      text: >-
        Both review-independence checks pass. tools/validate_ledger.py returns
        the inherited 105 diagnostics plus 1210 grandfathered legacy
        diagnostics, with no batch-local diagnostic after proposal-metadata
        correction.
  inference: >-
    A complete EndRing witness used by KeyGen establishes sufficiency only.
    Before another PKE wrapper, the campaign needs one basis-independent,
    publicly samplable trapdoor interface whose inversion works from any
    complete evaluable basis and whose exact selected-message attacker can be
    converted into a complete-ring solver. Current candidates do not provide
    that interface.
  boundaries:
    - No secure PKE, KEM, KEX, reduction to EndRing, parameter set, implementation, practicality, or deployment claim.
    - No primary paper was read; novelty and exact nonduplication remain unverified.
    - The ER-McE counterexample applies only to the stated raw exact-weight syntax.
    - The CEST and RWCT correctness identities are conditional on valid interfaces and keys; they do not imply confidentiality.
    - Missing reductions are incomplete routes, not universal impossibility theorems.
    - The report diagram and PDF are navigation and presentation artifacts, not evidence.
  unresolved_confounds:
    - Efficient exact sampling of real public keys from the bare EndRing challenge distribution.
    - Complete typed polynomial-time key generation and decryption interfaces.
    - Whether a distribution-specific restricted evaluator tuple reconstructs a complete ring.
    - Correctly directed attacker-to-complete-ring extraction with quantitative loss and oracle simulation.
    - Primary-source comparison with Seta, SiGamal, LIT-SiGamal, UPKE, and generic seeded compositions.
