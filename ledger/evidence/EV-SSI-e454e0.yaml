    - id: O-method
      text: >-
        The frozen propose/evaluate/gap-feed/propose/evaluate method completed:
        two mutually blind initial producers, one immutable initial snapshot,
        disjoint O1--O3 and O4--O6 reviews, deterministic composition, one
