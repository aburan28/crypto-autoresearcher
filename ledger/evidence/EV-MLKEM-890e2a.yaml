  what_this_evidence_is: >-
    The per-cell occupancy regression the BATCH-016 red team specified, run at
    full resolution (301 and 496 cells) instead of three terciles, with the null
    distribution of every coefficient measured rather than assumed, plus an
    independent validation that rebuilt the instrument from scratch. It settles
    whether BATCH-016's rejection of the counting floor as a reference point was
    a binning artifact. Zero new sampling of the physical system.

  execution_provenance: >-
    EXECUTION ATTEMPT 2. Attempt 1 reported completion and was then destroyed by
    a session container reset before any snapshot commit, leaving no artifact.
    Under AGENTS.md rule 5 that loss is not mathematical evidence in either
    direction; under rule 9 the numbers it reported into the session have no
    archived artifact behind them and are cited NOWHERE in this record. Attempt 2
    was dispatched WITHOUT being told them, so it is an independent execution and
    not a confirmation. Recorded as AMEND-BATCH-017-001.

  observations:
    - >-
      W-1 (ESTABLISHED, AND IT IS THE RESULT). THE n=43 MID-BAND SUB-POISSON
      DEFICIT IS STRUCTURAL AT PER-CELL RESOLUTION AND IS NOT A TERCILE-BINNING
      ARTIFACT. It survives on four independent footings the validator supplied,
      three of which the producer did not run: the 164 cells with occupancy below
      0.02 -- where the independent-iteration floor moves the reference by at most
      2 percent -- read mean t = 0.6811 against calibrated nulls 0.9959 +/- 0.1084
      (N1) and 0.9995 +/- 0.1114 (N2), z = -2.91 and -2.86; it survives
      restriction to leverage at or below the band mean (0.7215 on 145 cells); it
      is monotone across four occupancy quartiles at 0.973, 0.835, 0.778, 0.621,
      which is the WRONG DIRECTION for the floor-attaining member; and it is
      visible in the RAW INCREMENTS WITH NO RATE MODEL AT ALL, linearly-detrended
      var/mean of 0.453, 0.561 and 0.660 on the last 25, 50 and 100 cells against
      an expectation of 1 with sampling sd 0.29, 0.20 and 0.14.
    - >-
      W-2 (THE FLOOR-ATTAINING MEMBER IS REJECTED JOINTLY AT EVERY DEGREE, AND
      THIS INVERTS THE ONE ROW THAT LOOKED LIKE A RESCUE). The producer's degree
      sweep reported that n=43's slope FLIPS SIGN at degree 2 and reads only
      +1.55 sd from the floor member there, which on a slope-only reading would
      have reinstated the floor. It does not. The floor member predicts the PAIR
      (slope, intercept) = (-1, +1), and at degree 2 the observation is
      (-0.499, +1.278). The validator's joint Mahalanobis test gives D^2 = 27.97
      with 0/400 replicates as extreme at degree 2, against 13.62 with 1/400 at
      degree 5. THE ROW THAT APPEARED TO RESCUE THE FLOOR MEMBER REJECTS IT
      HARDEST. The Coordinator confirmed this by a different route -- reparametrising
      to (slope, phi), which is an invertible linear map of (slope, intercept),
      with its own binomial sampler and its own seed -- obtaining D^2 = 28.23 with
      0/400 at degree 2 against 12.07 with 1/400 at degree 5. The mechanism is
      plain once seen: at degree 2 phi = 1.237 is an EXCESS at +4.45 sd ABOVE the
      floor member, not a deficit.
    - >-
      W-3 (THE DEGREE CHOICE IS NOT RESEARCHER DEGREES OF FREEDOM, verified in the
      archive rather than in the report). BATCH-014's dispersion_control_c1.py
      selects the degree by forward selection on the deviance at chi^2_{1,0.95} =
      3.841 with the whole sweep published, and its results.json records
      chosen_degree 5 for the n=43 mid band and 3 for n=50. That criterion
      predates this question, so the degrees are INHERITED, not chosen after
      seeing the slope. For n=43 the criterion actively REJECTS degree 2, deviance
      drop 96.6 against the threshold, twenty-five times over, and the verdict is
      stable across the whole at-or-above-selected family (z vs N2 of +3.57 to
      +3.98 at degrees 5-8). QUALIFICATION RECORDED: n=50's selection is a
      knife-edge, degree 3-to-4 deviance drop 3.39 against 3.841, a 12 percent
      margin. BATCH-016's tercile result inherits the same exposure -- mild for
      n=43, decisive for n=50.
    - >-
      W-4 (STRUCK, AND THE STRIKE IS THE MOST IMPORTANT CORRECTION HERE). The
      producer's "second surprise" -- that the deficit sits in the INTERCEPT,
      occupancy-independent, at -2.3 sd under BOTH nulls -- IS STRUCK. The
      validator established the algebraic identity intercept = phi - slope * xbar
      with xbar = sum(D)/(K*nb) fixed and degree-invariant, from which
      E[intercept] = 1 under BOTH nulls follows as an identity of the regressor
      origin, because N1 and N2 differ by exactly 1 in expected slope and by
      exactly xbar in expected phi. "Agreement under both nulls" therefore carries
      NO MORE INFORMATION THAN AGREEMENT UNDER ONE. The Coordinator confirmed the
      identity to 0.00e+00 at all seven degrees and confirmed floor = 1 - xbar to
      1.11e-16. The intercept is also numerically almost the pre-existing ANOM-5
      statistic, differing from phi by slope * xbar = 0.016 or 0.17 of its own
      null sd, and its z of -2.32 is WEAKER than the archived phi z of about
      -2.36. It is not a new signal and it is not the right handle.
    - >-
      W-5 (PARTLY RE-LITIGATION, AND THE COORDINATOR'S BATCH DESIGN SHARES THE
      BLAME). The substance of W-4's intended claim was ALREADY REPORTED in
      BATCH-016's objections.md section 3b: low-occupancy tercile phi = 0.6371
      against 1.0072 +/- 0.1451 (N1) and 0.9971 +/- 0.1430 (N2), described there
      as "-2.55 sd below both", with the explicit sentence "The deficit is
      entirely inside the cells where the floor correction is 0.5 %". The
      Coordinator verified this directly by grep on the archived file. The
      BATCH-017 intercept restates that result at a WEAKER |z| by extrapolation
      rather than by direct measurement. The producer claimed novelty only for the
      degree sweep, which is correct, so this is a framing defect -- but the
      Coordinator dispatched a batch without pointing the producer at section 3b,
      and that is a Coordinator error.
    - >-
      W-6 (A NEW INSTANCE OF THIS PROGRAM'S SIGNATURE FAILURE MODE, found
      INDEPENDENTLY by the Coordinator and by the validator before either saw the
      other). The occupancy regressor is severely skewed -- n=43 median 0.0162,
      mean 0.0817, max 0.7392, a 46-fold spread -- so the SLOPE is not a 301-cell
      statistic. Its participation ratio 1/sum(w^2) on the information weights
      w_i = (x_i - xbar)^2 / Sxx is 33.0 EFFECTIVE CELLS OF 301, with 11 cells
      carrying half the information; for n=50 it is 73.4 of 496. Both parties
      obtained 33.0 and 73.4. The Coordinator's deletion diagnostic adds that
      DROPPING THE 5 HIGHEST-OCCUPANCY CELLS OF 301 FLIPS THE n=43 SLOPE FROM
      +0.19718 TO -0.23417, while the intercept moves only from +0.78618 to
      +0.80604. The framing "301-cell resolution against 3 terciles" implies a
      gain in independent lever arms that the design does not deliver. THIS IS THE
      SAME ERROR CLASS AS THE WHOLE-BAND STATISTIC RETIRED IN BATCH-013 for
      carrying O(1) effective degrees of freedom against 1803 and 2310 rows.
    - >-
      W-7 (THE SIGN FLIP DOES NOT INVALIDATE THE z, and saying so is necessary
      because it is the obvious misreading of W-6). The N1 and N2 replicates are
      generated at the fitted mu, so each replicate carries the SAME occupancy
      geometry and the SAME leverage concentration; the measured null sd already
      prices it in and the comparison stays apples-to-apples. W-6 is a statement
      about how many cells the slope's INFORMATION comes from, not a defect in its
      calibration.
    - >-
      W-8 (THE MECHANISM IS NOT IDENTIFIED, and the package's language overstepped
      it). Occupancy is a NEAR-MONOTONE function of the score index over both
      bands -- 3 non-monotone steps in 300 for n=43, 0 in 495 for n=50 -- so an
      occupancy effect and any smooth score-position effect are PERFECTLY
      CONFOUNDED by this design. Testing the floor member remains valid, because
      it predicts a specific curve; but "occupancy-independent level shift" and
      "occupancy-graded effect" attribute a mechanism this design cannot identify.
      The valid statement is narrower and is the one this record adopts: THE
      DEFICIT LIVES WHERE THE FLOOR IS INOPERATIVE AND THEREFORE IS NOT A FLOOR
      EFFECT.
    - >-
      W-9 (n=50 IS NOT A SECOND INSTANCE, AND IS NOT A WEAK ONE EITHER -- IT IS
      CONTRARY). The producer's "n=50 at every degree >= 4 is consistent with the
      floor-attaining member" is STRUCK as a file-level statement; it is
      slope-only. n=50's mid-band phi is 1.09 to 1.11, an EXCESS sitting +2.1 to
      +2.3 sd ABOVE the floor member; its low-occupancy subset reads z = +0.46,
      no deficit at all; and a joint test rejects the floor member there too, at
      2/400 for degree 3 and 9/300 for degree 5. Separately its slope genuinely
      cannot discriminate: the separation statistic is identically 1/sd(slope|N2)
      because the two nulls differ by exactly 1 in expected slope, and n=50's
      occupancy lever arm is 3.2x shorter (max 0.227 against 0.739), giving
      Sxx = 1.18 against 6.56 and a separation of 0.85 sd against 3.05. So n=50's
      slope corroborates and refutes nothing, while its LEVEL anomaly has the
      OPPOSITE SIGN to n=43's. BATCH-016 section 4 had already noted this requires
      two mechanisms.
    - >-
      W-10 (THE NULL CALIBRATION IS SOUND, AND ITS STATED REASON IS WRONG). N2 is
      correctly the PER-CELL minimum-variance member: the validator re-derived
      Var(D) >= mu(1 - mu/nb) from the 0/1 bound plus Cauchy-Schwarz and confirmed
      Binomial(nb, mu/nb) attains it with equality. It is NOT the joint
      minimum-variance object -- it is independent across cells, while the
      physical process couples cells within an iteration -- and NEITHER NULL
      CARRIES ANY CROSS-CELL DEPENDENCE. The full refit per replicate is
      sufficient for the shared-rate-model dependence, and now quantified: an
      analytic variance treating cells as independent with mu known reproduces the
      refit-calibrated slope sd to within 4 percent and the intercept sd to within
      3 percent, so the refit contributes little to the SPREAD, though it does move
      the N2 null mean from -0.980 to -1.005. The package's own explanation of why
      the OLS standard error is unusable is therefore WRONG: the measured ratio
      0.469 to 1.405 is essentially sqrt(Var_null(t)/s2_observed), driven by
      heteroscedasticity and kurtosis, NOT chiefly by fit-induced dependence as
      the package asserts. The producer was right to refuse to quote the OLS SE
      and right to label it INVALID_DO_NOT_QUOTE; it was wrong about the reason.
    - >-
      W-11 (SMALLER DEFECTS, RECORDED). D-5: the serial-correlation deflation
      sqrt(1 + 2 rho_1) is a heuristic for a MEAN, mis-targeted at the slope, and
      uses rho_1 of the RESIDUALS where the averaged series is their SQUARES;
      the correct first-order factor is 1.015 against the applied 1.099, an
      overstatement of about 6.5x. It is conservative, so no conclusion moves, but
      it is applied to the slope z and NOT the intercept z, so the two headline
      numbers were quoted under different conventions, and at K = 301 no
      serial-correlation correction is resolvable at all. D-8: BATCH-015's
      imported N1 generator is NOT a Poisson sampler for lambda >= 30 -- it returns
      round(lambda + sqrt(lambda) * Z) with a non-negativity reject -- and 205 of
      301 n=43 mid-band rates exceed 30; measured effect on E[t] and Var[t] is
      under 0.5 percent, so it is immaterial here, but it is undisclosed in BOTH
      BATCH-015 and BATCH-017 and propagates to anything reusing that generator.
      D-9: report.md misstates a seed example and two autocorrelation values that
      are correct in results.json and in the code, and the snapshot receipt records
      407 lines where the file has 411; no computed result depends on any of them.
    - >-
      W-12 (TWO DEFECTS THAT BELONG TO THE COORDINATOR, NOT THE PRODUCER). D-10:
      the frozen contract declared exactly three artifact paths, which excluded
      stdout, stderr and any machine-readable resource receipt, so the "18.1 MB
      peak RSS" in report.md has no archived receipt and AGENTS.md's artifact
      policy is not met. The cause is the contract this Coordinator froze; it is
      fixed by widening the declared artifact list, not by the producer. D-11: a
      .pyc was written into BATCH-015's ARCHIVED, IMMUTABLE task directory by an
      importlib load of its module. It was gitignored and entered no commit and
      affected no number. Attribution is NOT established: BATCH-016's red team,
      this batch's producer, and the Coordinator's own re-derivations all imported
      that module. The Coordinator removed it, restoring the directory to its
      committed bytes, and records its own contribution to the ambiguity.

  reproduction_tally: {claims_adjudicated: 36, reproduced: 28, not_reproduced: 6, unable_to_check: 2}

  independent_reimplementation_by_the_validator: >-
    Nothing imported from BATCH-015 or BATCH-017. Own parser (float times M, not
    Decimal), Legendre basis with Cholesky IRLS against the producer's Chebyshev
    with Gaussian elimination, own exact Poisson and Binomial samplers by
    inverse-CDF-from-the-mode against the archive's Knuth and recursive-Beta, own
    seeds, plus a closed-form null variance and a model-free dispersion statistic.
    Fitted values and hat diagonals are basis-invariant in exact arithmetic, so
    this genuinely tests the linear algebra rather than re-running it: slope,
    intercept and phi reproduce at ALL 14 (file, degree) cells to at least six
    significant figures, with sum(h) = P exactly.

  inference: >-
    BATCH-016's rejection of the counting floor as a reference point SURVIVES the
    sharper instrument and is not an artifact of tercile binning. The n=43
    mid-band sub-Poisson deficit is real at per-cell resolution, sits where the
    floor is inoperative, is monotone in occupancy the wrong way for the
    floor-attaining member, and is visible in the raw increments with no rate
    model at all. The floor-attaining member is rejected jointly at every degree
    examined, including the one degree whose marginal slope appeared to rescue it.
    What does NOT survive is the mechanism: occupancy and score position are
    perfectly confounded by this design, so the deficit cannot be called
    occupancy-independent or occupancy-graded. What also does not survive is the
    intercept framing, which is an identity of the regressor origin and a weaker
    restatement of a measurement BATCH-016 had already made directly. n=50 is not
    a second instance of the phenomenon; its level anomaly has the opposite sign,
    and its slope cannot discriminate the two nulls at any degree.

  boundaries:
    - >-
      Two archived toy-dimension files (q=241, m=40, n=43 and n=50); mid band
      only; raw undivided score scale. Establishes NOTHING about ML-KEM security
      in either direction, and nothing about Carrier et al.'s Kyber cost figures.
    - >-
      The MECHANISM of the deficit is unidentified. Occupancy and smooth
      score-position effects are perfectly confounded by this design (W-8).
    - >-
      Neither null carries cross-cell dependence, while the physical process
      couples cells within an iteration. N2 is the per-cell minimum-variance
      member, NOT the joint one, so "below the floor" is below a floor computed
      under an independence assumption the process does not satisfy (W-10).
    - >-
      The n=50 leg rests on a degree selection with a 12 percent margin (W-3), and
      its slope has 0.85 sd of null separation (W-9). It settles nothing.
    - >-
      The slope is a 33-effective-cell statistic for n=43 and a 73-effective-cell
      one for n=50, not 301 and 496 (W-6).

