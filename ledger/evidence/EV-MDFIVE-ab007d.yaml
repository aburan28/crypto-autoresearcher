    gate_2_numbered_heuristics_validated: >-
      PARTIALLY MET, AND NOW WORSE THAN AT OPENING. HEUR-H2 is a proved
      algebraic fact, independently reconfirmed (met). HEUR-H1 was intended
      to be validated this batch but its test is INVALIDATED by ANOM-1 (O-3)
