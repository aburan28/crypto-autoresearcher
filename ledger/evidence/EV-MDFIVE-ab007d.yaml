      alone caps any claim below `supported` per gate 2's own text. HEUR-H3
      is honestly left unvalidated, named as explicit future work.
    gate_3_concrete_cost_honesty: >-
      NOT MET. A measured cost-scaling TABLE ENTRY exists for this batch's
      own degenerate instrument (O-5), correctly labeled and distinguished
      from the modeled sketch, but no concrete-cost table at standardized
