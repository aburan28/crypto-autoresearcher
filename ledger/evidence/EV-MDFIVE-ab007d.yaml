  proof_status_basis: >-
    ANOM-1's root cause is a proved algebraic fact about the frozen
    construction (register A after step 9, tuple position 1 of
    backward_step's return, is copied through from state10 -- computed
    BEFORE word9 is ever consulted -- while only tuple position 0 depends on
    the word supplied). This is a derivation, not merely an empirical
    observation, and is independently re-derived (not just re-checked) by two
    reviewers from the RFC word-schedule text and the module's own algebra
    alone. The H1 matching-window statistics (constant, zero-variance across
    1000 independent target draws) are the corroborating EMPIRICAL signature
    of the same proven fact, not a separate basis.

  observations:
    - id: O-1
      text: >-
        ANOM-1 -- THE MECHANISM DEFECT. H-MDFIVE-bf7767's mechanism section
        states that chunk2's backward-computed value of the declared matching
        quantity (register A immediately after step 9) "is a function of free
        word9." This is FALSE for the frozen construction: word 9 is first
        used at step 10 (RFC 1320/1321's own sequential word schedule), so by
        construction nothing computed at or before step 9 -- including
        register A after step 9 -- can depend on it. Independently confirmed
        four separate ways (see strength_note). The MITM search's raw
        solution set at k1=k2=10 is consequently NOT a genuine two-free-word
        joint search result: once the true word8 is located (which happens
        for exactly one word8 among 1024 tried, as it must), every one of the
        1024 word9 candidates is reported as a full 20-bit "match," because
        chunk2's own computed value does not vary with word9 at all. The
        search DID correctly and reproducibly locate the true word8 -- the
        single genuinely-verified pair, re-confirmed against the full 16-step
        forward computation by both reviewers independently, is exact -- but
        it supplies zero discriminating power over word9. This is a defect in
        the frozen hypothesis's own construction (the choice of split point
        S=9 paired with the matching quantity "register A after step 9"), not
        an implementation error: the module's correctness controls (RFC
        vectors, H2 backward-inversion regression fixture, independent
        full-computation re-verification) all pass exactly.
    - id: O-2
      text: >-
        THE "512x SPEEDUP" NUMBER, CORRECTLY READ. 2048 total chunk
        evaluations vs. a 1,048,576 (2^20) naive-all-pairs baseline over the
        SAME restricted 2-word space is a real, independently-recomputed
        measurement (1048576/2048 = 512.0 exactly; re-derived by both
        reviewers from raw counters, not trusted from the execution report).
        Per O-1, the correct reading is "512x fewer evaluations to locate
        word8 via a search that is effectively one free word, not two" --
        this is evidence about how cheaply this DEGENERATE instrument locates
        a single free word inside a fixed 9-step chunk, not evidence of a
        genuine two-free-word joint MITM speedup, and it is not evidence
        bearing on MD4/MD5 full-primitive preimage resistance at any scale.
        The k1=k2=6 brute-force-equality control (success_criterion 1) passed
        exactly (64/64 identical result sets) but is a VACUOUS pass for this
        specific defect: naive_all_pairs_search reads the identical
        word9-independent tuple position as mitm_search, so the two
        implementations are guaranteed to agree regardless of whether the
        intended two-free-word construction works. This vacuity was
        independently derived by the red team before reading the Executor's
        own disclosure of it (convergent, not discrepant).
    - id: O-3
      text: >-
        HEUR-H1 STATISTICS AND D3 DISPOSITION. The MD4 arm's matching-window
        collision count is CONSTANT (2048) across all 1000 independently
        drawn targets (variance 0), against a Poisson(lambda=256) prediction
        -- 112 standard deviations from the mean, chi-square statistic
        127577.51 (independently recomputed bit-for-bit by both reviewers
        from raw counters), tail p-value 0 at floating-point resolution. The
        MD5 arm shows the identical zero-variance signature at a different
        constant (32768). Read literally, HEUR-H1's own frozen
        falsification_condition ("a reproducible (>=3 independent target
        draws), non-shrinking heavier-than-Poisson tail") has fired: 1000/1000
        identical draws is trivially reproducible, non-shrinking, and
        maximally heavier-than-Poisson. THE COORDINATOR RULING (see the
        companion decision DEC-20260821-1215e5 F-3 for the full rationale):
        this run's test of HEUR-H1 is INVALIDATED by the ANOM-1 construction
        defect, not a genuine falsification of H1. The deterministic,
        zero-variance signature is explained by O-1 (the matching-window
        observable is a near-deterministic function of word8 and the fixed
        words alone, not of an independent draw over both free words as H1's
        random-model claim requires) plus the Executor's disclosed secondary
        observation (a near-affine relationship between word8 and the
        matching-window value, since word8 is used at chunk1's own last step
        with no further Round-1 mixing before the comparison). H1's
        substantive claim (whether F's single-step balance property
        extrapolates to the ITERATED 9-step composition) was never actually
        exercised by an instrument whose observable does not vary with a
        genuinely independent second free word. HEUR-H1 therefore remains
        OPEN -- neither validated nor falsified at this scale -- pending a
        corrected split point/matching quantity in a future batch. This
        ruling is recorded plainly rather than by omission, per the red
        team's explicit request (D3) for an unambiguous Coordinator
        disposition.
    - id: O-4
      text: >-
        R = 1.0 (MD5/MD4 CONDITIONAL NEAR-OBJECT RESULT). The authorized,
        identically-bounded MD5 arm (parameter-identical to the MD4 arm in
        every field but --target/--target-seed, independently verified from
        primary command.txt/manifest.yaml artifacts by the red team, not
        merely from narrative) produced full_target_hits and total_chunk_
        evaluations numerically IDENTICAL to the MD4 arm across all 1000
        independent target draws, giving R = 1024/1024 = 1.0, within the
        pre-declared null range [0.5, 2.0]. Per H-MDFIVE-bf7767's own framing
        this would ordinarily read as a controlled null (Round 1 alone
        carries none of MD5's added multi-round security margin at this
        scale) -- but per O-1, R=1.0 is close to MECHANICALLY FORCED here:
        both primitives share the IDENTICAL word schedule, and ANOM-1's
        word9-independence finding is a property of that shared schedule
        (not of either primitive's shift table or additive constants, the
        only two things --target actually varies). R=1.0 is therefore NOT
        informative evidence for or against the stated null hypothesis at
        this scale; it is reported honestly (as the frozen contract requires,
        "whatever its value") but is not credited as a genuine MD4-vs-MD5
        divergence measurement. matching_window_hits does differ 16x between
        arms (2048 MD4 vs 32768 MD5) -- a real, measured bucket-collision
        structure difference between the two shift/constant tables -- but
        this does not translate into any full_target_hits difference in this
        degenerate instrument.
    - id: O-5
      text: >-
        COST-SCALING TABLE (MEASURED, THIS INSTRUMENT ONLY). Throughput
        102899-289607 chunk-evaluations/sec (single-core, unoptimized
        Python), internally consistent with reported total_chunk_evaluations
        / wrapper_measured_wall_seconds ratios (independently re-verified by
        the validator, check 6). Correctly and distinctly labeled MEASURED
        (this task) vs. IDEA-20260821-e46061's MODELED cost_scaling_sketch
        (BATCH-1f30fe's 38,711 blocks/sec anchor) -- no modeled/measured
        mislabeling found by either reviewer (K5 holds; check 6 pass). The
        two tables use genuinely different, disclosed cost units (Round-1
        chunk evaluations here vs. full-message birthday-search blocks
        there); no gap-closing estimate toward the goal's ~2^64-block
        instrument-class question is computed by either table, and none
        should be inferred from this batch -- see promotion_gate_assessment
        and the companion decision's F-8.
    - id: O-6
      text: >-
        REVIEW ROUND OUTCOME. Two independent reviews under review-plan-
        67a1b6.yaml: red team (TASK-20260821-67a1b6, resolved model
        claude-sonnet-5, xhigh, independent session) round_verdict
        holds-with-named-gaps (K2/K3/K5/K6 hold; K1/K4 hold-with-named-gaps;
        0 batch-halting findings; defects D1/D2/D3 named, all disposed below
        and in the companion decision). Validator (TASK-20260821-1601d6,
        resolved model claude-sonnet-5, xhigh, independent session)
        determination HOLDS-WITH-NAMED-GAPS (6/7 mechanical checks pass
        cleanly; check 7 carries a named, well-grounded but not fully
        bisected environmental gap on one pre-existing, out-of-scope test
        failure; 2 minor/informational defects, neither fabricated, missing,
        or unrecomputable). Both reviews independently and exhaustively
        re-derived the primary certificate, the H1 statistics, and ANOM-1
        itself from raw artifacts and fresh code, rather than trusting the
        Executor's report. No prior overturn against the review plan's own
        bar (K2 widening or K3 non-reproducibility); the two named gaps
        (D1/K1, D3/K4) surfaced a structurally different and more significant
        finding (the ANOM-1 root cause) than the Coordinator's pre-recorded
        prior anticipated, reported plainly rather than folded into "the
        prior was right" (red-team coordinator_prior_comparison).
    - id: O-7
      text: >-
        DEFECT DISPOSITIONS (full rationale in the companion decision
        DEC-20260821-1215e5). D1 (K1, audit-1's bottleneck claim (b) and
        proof_obligation #2 rested on an unverified, later-falsified
        assumption): recorded as an open direction for a future
        corrected-instrument design, not resolved by this batch, per
        executor.md's prohibition on redesigning a frozen hypothesis
        mid-task. D2 (K5, machine-readable run artifacts carry the headline
        512x-implying metrics with no ANOM-1 caveat pointer, while every
        current prose document does carry it): ruled adequately disclosed at
        this batch's `analyzed` claim tier for CURRENT documents (no document
        in the package overclaims), with a binding forward constraint --
        this and any future record citing RUN-MDFIVE-primary-md4-v2/-h1-md4/
        -md5-conditional's raw-result.json metrics must also carry the
        ANOM-1/O-1 caveat forward; no corrective TASK-* is spawned this batch
        (see DEC-20260821-1215e5 F-4). D3 (K4, HEUR-H1's falsification_
        condition literally fired): dispositioned as O-3 above -- this run's
        H1 test is INVALIDATED by ANOM-1, not a genuine falsification of H1,
        which remains OPEN and untested at this scale.

  boundaries:
