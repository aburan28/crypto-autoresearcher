      itself clear gates 1-3, which remain unmet.
    overall: >-
      A claim missing any gate may reach `analyzed`, never `supported`
      (agents/coordinator.md). Three of four gates are unmet here; this
      record is capped at `analyzed` accordingly, consistent with
      H-MDFIVE-bf7767's own interpretation_limits.

