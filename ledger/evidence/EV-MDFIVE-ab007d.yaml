      bounded-scale batch.
    gate_4_independent_review: >-
      MET FOR WHAT WAS REVIEWABLE. Independent review-adversarial (xhigh) red
      team and validator passes both ran, both independently re-derived the
      primary results and ANOM-1 itself, per AGENTS.md rule 12 / CLAUDE.md
