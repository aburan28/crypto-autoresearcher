  obstruction:
    statement: >-
      In a Round-1 splice-and-cut MITM chunk-separation instrument, choosing
      the matching quantity as a register value computed strictly BEFORE the
      chunk's own free word is ever consumed by the word schedule makes that
      free word's channel of the joint search provably non-discriminating --
      the matching-window and full-target observables are mathematically
      independent of that word, regardless of how the observable is chosen
      or how large its window is.
    quantity: >-
      Dependence of the declared matching quantity (register A immediately
      after step 9, tuple position 1 of backward_step's return) on free
      word9 (first consumed at step 10).
    value: >-
      Zero measured dependence: 0 of 50 uniformly-random 32-bit word9 samples
      (red team, exceeding the declared 10-bit window) produced a distinct
      backward-derived value (all 50 identical); 0 of 1000 independently
      drawn targets showed any variance in matching-window or full-target
      hit counts attributable to word9 (variance = 0 in both counts, both
      primitives). Positive control: the same test on word8 (which SHOULD
      vary) gave 50/50 distinct values, confirming the search apparatus
      itself is not broadly non-discriminating.
    measured_by:
      - RUN-MDFIVE-primary-md4-v2
      - RUN-MDFIVE-h1-md4
      - RUN-MDFIVE-md5-conditional
      - TASK-20260821-67a1b6 (red-team independent re-derivation)
      - TASK-20260821-1601d6 (validator independent re-derivation)
    scope: >-
      Claimed only over the exact frozen construction tested: MD4/MD5 Round
      1, split point S=9, matching quantity = register A immediately after
      step 9 read from backward_step's tuple position 1. NOT claimed over
      splice-and-cut / MITM chunk-separation techniques in general, over
      other split points, or over other matching-quantity choices (e.g.
      backward_step's tuple position 0, which the red team's hand algebra
      shows DOES depend on the supplied word) -- those are explicitly
      untested, not ruled out.
    resource_check:
      examined: true
      reading: >-
        This measurement is a diagnostic resource, not only an obstruction:
        it identifies, before any further compute is spent, exactly which
        output position of a chained backward composition genuinely carries
        a given free word's dependency (tuple position 0, "old_a", per the
        red team's hand-derived algebra) versus which position is a
        pass-through copy (tuple position 1). A corrected split-point/
        matching-quantity design for this same instrument family -- reading
        the discriminating position, or choosing a split point where the
        natural matching register has already consumed both free words -- is
        the direct, cheap next step this measurement makes concrete rather
        than open-ended, and is named as the batch-5 candidate in the
        companion decision's next_actions and GOAL-MD5-001.next_action. No
        other standing hypothesis in this program's ledger currently reads
        this measurement as its own resource.
      spawned_ids: []
      spawned_ids_note: >-
        No IDEA-*/H-* record exists yet naming the corrected split point as
        its own hypothesis; this is deferred to a batch-5 idea-generator
        task per DEC-20260821-1215e5's next_actions, since this closing task
        may not itself author new IDEA-*/H-* records (out of write_scope).

