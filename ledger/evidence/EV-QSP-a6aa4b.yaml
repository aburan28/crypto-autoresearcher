  - >-
    THE DEGENERATE BRANCH THAT CARRIES (B)'s FIRST STEP IS CORRECT, EXACTLY
    TIGHT, AND WAS NEVER MEASURED BY THIS EXPERIMENT. 26 degenerate instances
