    was convened to evaluate.
    NOTHING HERE ASSERTS ANYTHING ABOUT ANY DEPLOYED CURVE. No curve, group or
    point was constructed in this contract. rho on ECC2K-130 stands at 2^60.9
    (KN-LIT-096) and nothing here touches it.

