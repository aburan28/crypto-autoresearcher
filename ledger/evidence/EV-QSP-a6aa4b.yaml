    rests on the DERIVATION and not on the enumeration; the enumeration could
    only have refuted it, and did not, over roughly 340000 candidates from two
    implementations with no shared lineage.
    The n = 131 quantity that RQ-QSP-f9bbdb left open is now established on two
    lineages with no shared code: over the 244 non-linearized F_2-coefficient
    lambda of exact degree 3..7 at n' = 33, the largest number of K-rational
    roots of X^{2^33} - lambda(X) is 132, against the 2^33 a complete splitter
