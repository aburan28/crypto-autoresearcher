  obstruction:
    statement: >-
      THE K-RATIONAL FIBRE OF THE QUASI-SUBFIELD RELAXATION IS BOUNDED BY THE
      DEGREE OF THE DIFFERENCE POLYNOMIAL D, AND AT THE TARGET PARAMETERS THAT
      BOUND IS 26 BITS SHORT OF WHAT AN ATTACK WOULD NEED. This is a claim about
      the OBJECT -- the root set of L = X^{p^{n'}} - lambda(X) in K -- and not
      about any attempt to compute it: every K-root of L is a root of
      D(Y) = Lambda_{q+1}(Y) - Y^{p^{n'-r}}, so N_K(L) <= deg D <=
      max(d^{q+1}, p^{n'-r}) whenever D != 0, and a completely splitting L at
      r >= 1 therefore needs d^{q+1} >= p^{n'}, i.e. beta >= n/(n + n' - r).
      A SECOND, DIFFERENT OBSTRUCTION BLOCKS THE RECORD RATHER THAN THE OBJECT,
      and is recorded here because a later reader needs both: the closure reading
      (E) requires a LOWER bound on the solver exponent kappa, and the only
      retrieved constraint in either frozen source is an UPPER bound.
    quantity: >-
      (i) N_K(L), the number of DISTINCT K-roots of L = X^{2^{n'}} - lambda(X),
      and its ratio M1 = N_K(L) / max(d^{q+1}, 2^{n'-r}); (ii) the threshold
      kappa_crit = 1/(2 beta_min) above which no quasi-subfield factor base beats
      generic algorithms under the Proposition 8 cost model.
    value: >-
      (i) At n = 131 over F_2[z]/(z^131 + z^13 + z^2 + z + 1): max N_K(L) = 132
      at n' = 33 (attained by exactly 4 of 244 candidates), and max N_K(L) = 2 at
      n' = 44 and at n' = 66. NO ERROR BARS: these are exact integer counts of
      finite sets, exhaustive over a fully specified candidate set, with no
      estimator anywhere, 546/546 root lists independently re-verified by the run
      wrapper, and the n' = 33 maximum, argmax, histogram and orbit structure
      independently re-derived BLIND by a disjoint method with exact agreement.
      A complete splitter at those cells would need 2^33 / 2^44 / 2^66, so the
      shortfall at n' = 33 is log2(132) = 7.04 bits against 33, a factor of
      2^25.96. M1 = 0.054977 / 0.074074 / 0.222222 there; the largest M1 anywhere
      is exactly 1.000, attained at (7,3) by lambda = X^2 + X, and exceeded
      nowhere in 45436 producer candidates or 291997 + 2400 independent ones at
      p in {2,3,5,7}.
      (ii) kappa_crit = 260/262 = 130/131 = 0.9923664 at n = 131 (from
      beta_min = 131/260 = 0.5038462 at n' = 130, q = 1, r = 1), exact rational
      arithmetic; the general worst case n' = n-1 gives kappa_crit = (n-1)/n
      exactly -- 0.857 at n = 7, 0.968 at n = 31, 0.9924 at n = 131, 0.9961 at
      n = 257 -- tending to 1. H1 itself assumes kappa >= 1, so (E)'s margin over
      its own assumption is exactly 1/n: 0.76% at n = 131 and 0 in the limit. The
      cited 4.876 is an UPPER bound on kappa in both frozen sources and bounds
      nothing in the direction (E) needs.
