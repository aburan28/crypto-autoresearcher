  - >-
    ADVERSE, (E): THE CLOSURE READING IS REFUTED IN ITS STATED REASON. (E)
    asserts that no quasi-subfield factor base beats generic algorithms BECAUSE
    "the required beta < 1/(2 kappa) is unreachable since beta > 1/2 forces
    kappa < 1, five times below Rojas' 4.876". A factor base beats generic iff
    alpha_beta > 1 iff the solver is CHEAP, so excluding one requires a LOWER
    bound on kappa. Both frozen sources give 4.876 as an UPPER bound: Euler-Petit
    Proposition 7 says kappa is "currently majored by 4.876"
    (inputs/EULER-PETIT-2019-QSP/paper_fulltext.md:2597) and Huang Lemma 3.1
    gives the eliminant cost as a big-O. Exact arithmetic: at n = 131 the
    smallest beta admitted by (B) over n' = 2..130 is 131/260 at n' = 130
    (q = 1, r = 1) = 0.5038462, so alpha_beta > 1 requires
    kappa < 260/262 = 130/131 = 0.9923664; the general worst case n' = n-1 gives
    the threshold exactly (n-1)/n, tending to 1. H1's own formal statement
    assumes kappa >= 1, SO (E)'s ENTIRE MARGIN OVER ITS OWN ASSUMPTION IS 1/n --
    0.76% at n = 131 AND ZERO IN THE LIMIT -- NOT A FACTOR OF FIVE.
  - >-
    ADVERSE, (E): H1's DECLARED RIGOROUS INGREDIENT IS CONTRADICTED BY ITS OWN
    CITED APPENDIX. H1's random_model_justification asserts the eliminant "has
    degree M(E)" and that root-finding "costs at least M(E)". Huang Appendix A.1
    says the polynomials are of degree "bounded by M(E)" and that root-finding's
    cost "can be neglected in the overall complexity estimation"
    (inputs/HUANG-2020-JMC-QSP/paper_fulltext.md:1116-1118). The step that would
    convert the upper bound into the equality H1 needs is the BKK /
    generic-attainment statement that H1 ITSELF marks `RECALLED` and describes as
    supporting "nothing by itself", which AGENTS.md rule 9 bars from discharging
    supporting_results. After honouring that label H1 has NO RETRIEVED SUPPORT IN
    THE DIRECTION (E) USES IT. This is a defect in the RECORD's argument, not a
    claim that H1 is false.
  - >-
    ADVERSE, (E): PROMOTION GATE (2) IS UNSATISFIED INDEPENDENTLY OF THE ABOVE.
    H-QSP-5540d7 heuristic_assumptions[H1].validation_experiment_ids is [];
