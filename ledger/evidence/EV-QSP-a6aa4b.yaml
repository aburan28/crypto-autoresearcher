  procedure_deviations:
  - id: PROC-1
    what: >-
      The orchestrating session committed the sibling red team's COMPLETED report
      to the shared branch at 8f15567f6 while this mutually-blind round was still
      running, and committed the other two reviewers' in-flight artifacts at
      600bc97af and c0b3125ec. review_plan.blindness.mutual is true and
      lifted_for is empty.
    fault: >-
      THE ORCHESTRATING SESSION'S, NOT ANY REVIEWER'S. Recorded that way
      deliberately. The validator disclosed in full what it saw -- the path via
      git ls-tree and the commit subject line, which names joints already in the
      plan it was given and carries no verdict, finding or number -- and states
      every verdict and number in its report was fixed by its own computation
      before the commit landed. The red team declares read_sibling_reports false.
      The blind re-deriver ran no git command of any kind.
    effect: >-
      The round's independence survives ON THIS EVIDENCE, but blindness has been
      converted from a property of the round's SETUP into a property of three
      reviewers' RESTRAINT, which is the weaker guarantee and is undetectable
      downstream unless written down. This is where it is written down.
    remedy: >-
      TASK-20260917-43701b is NOT edited -- the plan's own rule requires a
      superseding record and a handoff is immutable. DEC-20260917-793ae2 NA-2
      mints the superseding card carrying this deviation into
      review_plan.procedure_deviations.
  - id: PROC-2
    what: >-
      Commit c0b3125ec is labelled a work-in-progress snapshot and in fact
      contains the validator's FINAL 814-line report.
    effect: >-
      No artifact content is affected. The commit log misstates the state of a
      deliverable at that commit, so a later reader reconstructing "what was in
      flight when" from commit subjects would be wrong -- which is exactly the
      reconstruction PROC-1 makes someone want to do.
    remedy: >-
      History is pushed and is NOT rewritten (AGENTS.md "Durable research
      commits"). The correction travels in the superseding record of NA-2.
  - id: PROC-3
    what: >-
      The coordinator subagent that wrote the review plan had no Bash tool and
      produced an unparseable YAML file; the orchestrating session quoted one
      scalar so it would parse, changing no content. Already disclosed in
      TASK-20260917-5b9153 and its receipt.
    ruling: >-
      ACCEPTED as a serialisation repair, on the same test that accepts the
      producer's PD-5: it altered no key, no value and no meaning, and it was
      disclosed before any reviewer read the card. The systemic finding is worth
      routing separately -- TWO INDEPENDENT YAML-EMISSION DEFECTS IN ONE ROUND,
      BOTH FROM AGENTS WITH NO SHELL -- and that is a tooling item, not a
      campaign one. NA-6.
  - id: PROC-4
    what: >-
      The blind re-deriver deliberately skipped the agent-bus inbox check and ran
      no git or merge-digest command, and disclosed both in section 0 of its
      report rather than doing them quietly or omitting them silently.
    ruling: >-
      THE RIGHT CALL, AND IT SHOULD BE PRECEDENT. The inbox check is a standing
      convention; blindness is a property of one round's setup and cannot be
      restored once destroyed. Two blind_from paths are bus records
      (MSG-20260917-97a8d4, MSG-20260916-945e58) and an inbox render addressed to
      a review role could surface exactly those; git log/show and a merge digest
      render other agents' work by construction. The cost is stated and accepted:
      if a peer sent it something it needed it did not see it, and nothing in its
      output depends on repository state -- the statement is the whole input. A
      blind re-derivation whose blind_from includes bus records is exempt from
      the inbox convention and MUST say so in its report, which this one did.
  - id: PROC-5
    what: >-
      A post-round fix to the validator's own instrument j1_kcoef.c (commit
      4e74a24af) after Cursor Bugbot found its irreducibility test was the
      order-of-one-element test rather than the Rabin gcd criterion.
    ruling: >-
      J1's VERDICT IS NOT DISTURBED. The defect is in a PRECONDITION CHECK -- is
      the declared modulus irreducible -- and not in a counting routine; the
      precondition was independently confirmed true for all ten moduli; only
      (5,6) has an n with two distinct prime factors, the configuration where the
      order-of-one-element test and the Rabin criterion can diverge, and its
      modulus X^6 + X + 2 is irreducible; and a re-run under the corrected
      criterion reproduces the committed output byte for byte. TWO CONDITIONS
      ATTACH. (a) The byte-for-byte reproduction receipt must ride the ledger
      archive: the artifact a later reader finds at HEAD is not the artifact that
      produced the committed output, and only that receipt closes the gap --
      asserting it in prose does not (NA-3). (b) The lesson generalises and is
      the reviewer's own: its known-answer fixture caught two of its bugs and did
      not cover its own precondition test, which an external linter caught
      instead.

