    heuristic caps the claim below `supported` -- so the blockage is a scheduling
    fact and not the reason.
  - >-
    ADVERSE, THE EMPIRICAL HEADLINE: "732 CERTIFICATE-BEARING EXACT COUNTS AT
    n = 131" OVERSTATES BY 186 (34%). The archive carries 732 candidate rows at
