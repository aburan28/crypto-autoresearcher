    732 enumerated candidates and on nothing else.
    THE CLOSURE READING (E) IS NOT PROMOTABLE AND ITS STATED REASON IS REFUTED.
    Two independent grounds: promotion gate (2) is unsatisfied because H1 is
    unvalidated, which caps the claim below `supported` regardless of the state
