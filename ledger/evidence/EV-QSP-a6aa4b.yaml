  - >-
    THE BOUND IS ATTAINED, AND NOW AT ODD CHARACTERISTIC TOO. At p = 2 the ratio
    is exactly 1 at (7,3) by X^2+X and X^2+X+1 (N = 8 = bound) and at (7,4) by
