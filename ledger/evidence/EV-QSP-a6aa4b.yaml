  - >-
    NULL-MODEL CONTROL, NEW IN THIS ROUND, WHICH REMOVES AN ANOMALY RATHER THAN
    EXPLAINING IT. Non-F_2 roots arrive only in orbits of size 131, so the
    expected number of lambda carrying an orbit is 244/131 = 1.86 against 4
