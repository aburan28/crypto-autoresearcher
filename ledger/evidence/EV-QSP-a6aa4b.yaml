    at two splitters" and overturns CORR-20260917-8b80cc's inference of "at least
    four".
  - >-
    (A) DOES VISIBLE EXCLUSION WORK, NOT ONLY PASSIVE SATISFACTION. Three of the
    356 near-complete Stage-2 rows sit strictly below the exact corollary --
