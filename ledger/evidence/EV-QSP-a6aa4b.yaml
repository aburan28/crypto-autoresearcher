    correct sentence is "732 exact counts at n = 131, 546 of them
    certificate-bearing".
  - >-
    ADVERSE, THE EMPIRICAL HEADLINE: "THREE AGREEING INSTRUMENTS" IS TWO, AND AT
    n = 131 IT IS ONE. Static call-graph analysis of the committed qspcore.py:
    I1, I2, I3 and verify_roots_f2 all bottom out on clmul, deg, polymod and
    square; gcd is shared by I2 and I3 and not I1; I1 HAS NO PRIMITIVE OF ITS
