evidence:
  id: EV-FALSIFY-4144a5
  hypothesis_id: null
  hypothesis_id_note: >-
    Two harness-integrity observations and one negative result about this
    program's own scope. Bears on no mathematical hypothesis. Filed under
    RQ-FALSIFY-a2c501 SQ-5.
  question_id: RQ-FALSIFY-a2c501
  experiment_ids: [EXP-FALSIFY-d770c1]
  run_ids: []
  run_ids_note: >-
    Static analysis of validator output and committed directory contents; the
    commands are quoted inline and re-run in seconds.
  findings_under_test: [KN-FIND-ac28ed]
  type: analytical
  direction: inconclusive
  direction_note: >-
    Reports why F-5 cannot yet be run, and corrects a characterisation this
    program has repeatedly used. Contradicts no finding.
  strength: moderate
  claim_tier: not_applicable
  claim_tier_note: Non-mathematical.
  proof_status: certificate
  proof_status_basis: Counted properties of committed files and validator output.
  proof_refs:
    - knowledge/findings/KN-FIND-ac28ed.md
    - tools/validate_ledger.py
  recorded_at: '2026-08-08'

  observations:
    - id: O-1
      text: >-
        F-5 IS BLOCKED ON UPSTREAM WORK, NOT SKIPPED. F-5 was pre-registered to
        re-cost the BKK speedup end to end, with target generation and linear
        algebra included. The record it would audit, EV-SEMAEV-7f7d22, does not
        exist: it is a RESERVED identifier. DEC-20260805-364e9e reserves it "for
        this track", DEC-20260805-661790 records it "reserved", and
        DEC-20260806-08b9ed states it "remains correctly reserved and bound by
        BATCH-122". No decision treats it as established evidence.
    - id: O-2
      text: >-
        AND THE REQUIREMENT F-5 WOULD IMPOSE IS ALREADY IMPOSED. KN-FIND-ac28ed
        states: "EV-SEMAEV-7f7d22 must be pre-registered against exact rational
        arithmetic with the linear-algebra and memory terms included. The
        'provable' label on the speedup transfer is downgraded to a model
        assumption: KN-FIND-c7d31e's speedup theorem applies to the membership
        predicate, not to the beta transfer to the full linear-algebra cost
        model." That is F-5's thesis, recorded on 2026-08-06, before F-5 was
        written. Running a cost model now would pre-empt a pre-registration the
        corpus has deliberately scheduled and would repeat the
        already-recorded-diagnosis error of CORR-20260808-733115.
    - id: O-3
      text: >-
        A FRAMING THIS PROBE ALMOST FILED, AND IT WAS WRONG. On finding that
        EV-SEMAEV-7f7d22 is absent while five ledger records cite it, the
        obvious reading is "decisions resting on evidence that does not exist".
        Checking the decisions refutes it: they describe the identifier as
        reserved and one says so in those words. This would have been the sixth
        false finding of this program had it not been checked, after the F-1
        degree drop, the F-10d aggregation, the F-7 order, the F-8 disjunction
        and the F-1b coverage premise.
    - id: O-4
      text: >-
        A CHARACTERISATION THIS PROGRAM HAS REPEATEDLY USED, NOW CORRECTED. This
        session has cited "259 pre-existing validator errors" as context in a PR
        comment and several summaries, in a way that reads as disorder in the
        corpus. The current count is 256 and the composition matters more than
        the total: 56 "missing required field", 45 "run directory missing
        artifact", 33 "run missing required field", 19 "evidence references
        unknown run", 17 certificate-kind, 11 "expected top-level key 'run'",
        8 missing run command. That is overwhelmingly LEGACY SCHEMA DEBT in run
        manifests, which tools/validate_ledger.py's own comments acknowledge as
        roughly 680 pre-current-schema manifests.
    - id: O-5
      text: >-
        AND THE DANGLING-REFERENCE ERRORS ARE MOSTLY A FILE-FORMAT MISMATCH. Of
        256 errors, 32 are unknown-reference errors naming 12 distinct ids. The
        referenced records largely EXIST: RUN-YIELD-004, -005, -006 and
        RUN-OIFP-001 all have directories under experiments/, each containing
        manifest.JSON where check_run() discovers only
        experiments/*/runs/*/manifest.YAML. RUN-OIFP-001 additionally carries
        command.txt, environment.json, stdout.log and stderr.log -- a complete
        run package in the wrong serialisation. These are not missing runs and
        not unsupported claims; they are records the discovery glob cannot see.

  interpretation: >-
    F-5 should not be run until EV-SEMAEV-7f7d22 exists, and the requirement it
    would have asserted is already on the record in KN-FIND-ac28ed. Separately,
    the validator's error count is a poor proxy for corpus health and this
    program should stop using it as one: the errors are dominated by a schema
    migration that never finished, not by claims lacking support.

  what_this_does_not_establish: >-
    Not a claim that the schema debt is harmless -- a run whose manifest the
    validator cannot read is a run whose controls and certificate discipline go
    unchecked, which matters for exactly the reasons this program exists. Nor a
    claim that all 256 errors are benign; only the 32 unknown-reference ones
    were examined, and only four of their twelve ids were opened. The remaining
    224 were classified by message text, not investigated. And nothing here
    evaluates the BKK end-to-end cost question itself, which stays open.

  dominated_by: not_applicable_methodological
  sota_delta:
    time_exponent: not_applicable
    note: No algorithmic claim.

  proposed_correction: >-
    (a) For the run records: either migrate the manifest.json packages to
    manifest.yaml, or teach check_run() to discover manifest.json and validate
    it under the same schema. The second touches no archived artifact and is
    therefore preferable under AGENTS.md rule 4. (b) For F-5: leave it
    pre-registered and blocked, with EV-SEMAEV-7f7d22 named as its
    precondition. Coordinator authority for both.

  knowledge_promotion: not_warranted
  knowledge_promotion_reason: >-
    Housekeeping observations plus a scoping decision about this program's own
    backlog. Not knowledge.

  scope_limits: >-
    validate_ledger.py output at this branch head; the 32 unknown-reference
    errors classified, four of their twelve ids opened; the other 224 errors
    grouped by message text only.

  independent_review_required: false
  independent_review_note: Asserts no mathematics; every figure re-derivable in seconds.

  authority_note: >-
    Evidence only. No record edited, no manifest migrated, no validator changed
    (AGENTS.md rule 1).
