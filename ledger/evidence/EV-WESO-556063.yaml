  inference: >-
    WITHIN ell in {47, 101, 151, 211} AND p in {2^20, 2^30, 2^40} ONLY: the
    pre-registered falsifier FC-4 does not fire (gap 0.0606 against 0.15) and
    FC-2 does not fire, so assumption L5's p-scaling exponent is
    MEASURED-CONSISTENT AT THE TESTED OPERATING RANGE and the
    MECHANISM-INCONSISTENT designation may be retired AT THAT SCOPE - by
    measurement, which is the only route DEC-20260802-48c72c left open. The
    retirement is scoped and nothing more: the earlier firing at
    ell in {3,5,7,11,13} stands, alpha's measured value 1.1321 is 13 per cent
    above the theoretical 1.0 and has not been propagated into any c-table row
    or margin row, the primary-minus-null gap is already at about 59 per cent
    of its threshold at ell = 151 and 211 with no control on its trend beyond
    ell = 211, and the NC2b-SLOPE PASS validates the instrument's sensitivity
    to a known non-zero slope rather than assumption L1 itself. Heuristic 1 is
    untouched and unvalidated. No completion criterion of GOAL-P13-001 is
    approached, no promotion gate of agents/coordinator.md is newly satisfied,
    and no claim about the Wesolowski attack at cryptographic parameters is
    supported by anything in this record.

  boundaries:
    - "TOY/MEDIUM SCALE ONLY. p in {2^20, 2^30, 2^40}, i.e. F_{p^2} of 40, 60 and 80 bits, ell <= 211, pure Python, one implementation family. Never a cryptographic-scale result (AGENTS.md rule 7)."
