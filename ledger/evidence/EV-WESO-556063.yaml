  coordinator_validity_pre_checks:
    performed_before_any_interpretation: true
    expected_run_count: >-
      Two authorized (one per frozen contract), two executed, two terminal,
      both `completed_valid` with exit code 0 and empty stderr. A THIRD run
      was authorized under EXP-P13-NC36 (TASK-20260804-6519fa) and did not
      execute; it is classified failed_infrastructure and contributes no datum.
    manifest_schema: >-
      Both run manifests carry the required top-level blocks (id,
      experiment_id, status, code, environment, inputs, timing, result). The
      carried model-identifier gap persists and is recorded rather than
      papered over: `model_verified: false`, "model identifier is from
      configuration, not probe-verified", under INFAMEND-20260802-P13-002.
    seed_integrity: >-
      Deterministic throughout and stated: four walk seeds
      (20260802001..20260802004) carried from EXP-PEC-49c773;
      Cantor-Zassenhaus streams seeded on (ell, j_index) inside the committed
      instrument; the C-BASE-1 control stream seeded on the prime bound. The
      instrument is byte-identical to the committed one
      (per_entry_cost.py sha256
      aea73ef79c3bdf6091b1fd61950bd8449618b295effd9d39a096f65197020ef1,
      `instrument_matches_committed: true`). NC2b consumed
      RUN-PEC-49c773-a/raw-result.json at the verified sha256
      13f8f3fa55dc2dfeabe29d4d01f60d5d69370485fae523b208a7b53e6128add6.
    raw_summary_agreement: >-
      AGREES ON EVERY GATING NUMBER, WITH ONE ROUNDING DISCREPANCY RECORDED
      RATHER THAN SMOOTHED. The Validator's independent recomputation gives
      raw jackknife bounds [1.1259982, 1.1409560]. nc2d_results.json reports
      the interval as [1.1260, 1.1410]; RUN-P13-NC2d-a/manifest.yaml reports
      it as [1.1260, 1.1409]. Both are roundings of the same computed pair and
      neither changes the FC-2 verdict, since the test is disjointness from
      [0.85, 1.15] and 1.1409560 < 1.15 either way. The discrepancy is a
      labelling inconsistency between two summaries of one computation and is
      recorded here because it is recorded nowhere else.
    control_comparability: >-
      The null arm is measured by the same instrument, at the same primes, at
      the same ell, in the same run, and its alpha is estimated by the same
      OLS on the same regressor. Comparability is by construction. The three
      declared controls all pass (see certificate_note).
    conclusion: >-
      The run set is VALID and ADMISSIBLE and is not returned to the Executor.
      No defect found by either reviewer is an execution defect. The defects
      this reconciliation repairs are ARCHIVAL and belong to the Coordinator
      side, not to TASK-20260804-241b87.

  observations:
    - id: OBS-1
      title: "NC2d-PROPER: FC-4 DID NOT FIRE at the operating ell range."
      text: >-
        EXP-P13-NC2d / RUN-P13-NC2d-a. C-PSCALE re-run at ell in
        {47, 101, 151, 211} at p1 = 1048571 (2^20), p2 = 1073741783 (2^30) and
        p3 = 1099511627563 (2^40), IMPL-A (schoolbook), j-pool size 4 for the
        fresh p1/p2 arms. Regressor log2(log2 p), per the frozen specification.
        Pooled by OLS with ell fixed effects (within-ell demeaning):
        alpha_primary = 1.1321 (raw 1.1320907), alpha_null = 1.0715 (raw
        1.0715207), gap = 0.0606 (raw 0.0605699) against the pre-registered
        threshold 0.15. FC-4 DID NOT FIRE. The RERANK TRIGGER of
        BATCH-403f13/dispatch_queue.json therefore also did not fire.
    - id: OBS-2
      title: "NC2d-PROPER: per-ell estimates, and the gap's own upward drift."
      text: >-
        alpha_primary / se, alpha_null / se_null, gap, by ell -
        47: 1.1055 / 0.0057, 1.0784 / 0.0020, 0.0270;
        101: 1.1318 / 0.0162, 1.0938 / 0.0375, 0.0381;
        151: 1.1407 / 0.0177, 1.0512 / 0.0050, 0.0894;
        211: 1.1504 / 0.0164, 1.0626 / 0.0158, 0.0877.
        The gaps at ell = 151 and 211 are 0.0894 and 0.0877, i.e. about 59 per
        cent of the 0.15 threshold, against about 0.03 at ell <= 101. The
        pre-registered no-trend check constrains alpha_primary against
        log2(ell) and PASSES (b = 0.0206, raw 0.020580, se 0.0013, against a
        0.10 tolerance); IT DOES NOT CONSTRAIN THE GAP, and no gap-vs-ell
        control was pre-registered or executed. This is red-team objection
        RT-OBJ-A and it is carried, not answered.
    - id: OBS-3
      title: "NC2d-PROPER: FC-2 DID NOT FIRE, and the no-trend check passed."
      text: >-
        Leave-one-ell-out jackknife bounds [1.1259982, 1.1409560] (reported
        rounded as [1.1260, 1.1410] and [1.1260, 1.1409]; see
        coordinator_validity_pre_checks.raw_summary_agreement). FC-2 requires
        the interval to be DISJOINT from the pre-registered band [0.85, 1.15];
        it is contained in it, so FC-2 DID NOT FIRE. The Validator records
        (qualification Q-1) that this interval is the min/max of four
        leave-one-out estimates as the frozen spec defines it, and is NOT a
        95 per cent confidence interval however a handoff summary labelled it.
    - id: OBS-4
      title: "The prior FC-4 firing, for comparison, and it is not lifted."
      text: >-
        EXP-PEC-49c773 measured, at ell in {3, 5, 7, 11, 13}, alpha_primary
        1.1597, alpha_null 0.9935, gap 0.1662 - FC-4 FIRED. At ell in
        {47, 101, 151, 211} the gap is 0.0606. The DEC-20260802-48c72c
        diagnosis (the firing was driven by ell in {3,5}, below
        KARATSUBA_THRESHOLD = 16, where the two implementations are
        bit-identical) is consistent with this measurement. THE PRIOR FIRING
        IS NOT LIFTED AND IS NOT RETRACTED: it stands as an uncontradicted
        matter of record for its own ell range, exactly as the run's own
        non_claims_restated states.
    - id: OBS-5
      title: "NC2b-SLOPE: the gate PASSES, and it validates the instrument, not L1."
      text: >-
        EXP-P13-NC2b / RUN-P13-NC2b-a, zero new compute, arithmetic on the
        committed 47-ell C-NULL series of RUN-PEC-49c773-a at verified sha256.
        W-MID is ell >= 11, n = 43. Refit gamma_null = -0.003547422 with
        log2_A_null = 12.284968689, i.e. REF_null_used = 12.284968689 against
        the nominal 12.2595, a difference of 0.0255 bits. Synthetic slopes
        s in {0.4, 0.8}: recovered gamma_s_hat 0.396453 and 0.796453 on W-MID
        (0.403269 and 0.803269 on W-ALL). All ten W-MID checks (five field
        sizes x two s values) pass; per-field recovery errors are 0.0504
        (NIST-I, log2 p 256), 0.0631 (NIST-III, 384), 0.0741 (NIST-V, 512),
        0.0791 (576) and 0.0926 (768) bits, worst error 0.0926 against a
        0.75-bit tolerance, margin remaining 0.6574. Gate NC2b-SLOPE-G1 PASS.
        THE RUN'S OWN NON-CLAIM GOVERNS AND IS ADOPTED HERE: "PASS validates
        the INSTRUMENT only; cannot be cited as validation of L1."
    - id: OBS-6
      title: "NC2b-SLOPE: an anomaly recorded, and a real residual concern under it."
      text: >-
        gamma_null_refit = -0.003547 differs from the -0.013241 that
        DEC-20260802-48c72c anticipated, by 0.009694. The attribution is
        established and benign as to the gate: the expected value was fitted
        on the 21-ell nc2b series (ell 11..101) of EXP-PEC-6be870, while the
        frozen NC2b specification requires the 47-ell C-NULL series of
        EXP-PEC-49c773, which is the input actually used. The Red Team
        confirms the gate survives even if the whole discrepancy is added to
        the worst error (0.0926 + about 0.075 = about 0.168 bits against
        0.75). THE RESIDUAL CONCERN IS NOT THE GATE: gamma_null moves by a
        factor of about 3.7 between the two ell ranges, which is evidence that
        the null per-entry cost does NOT follow one stable power law in ell
        across the operating range. Recorded, not resolved.
    - id: OBS-7
      title: "Bibliographic subtask: three sources retrieved, k not obtained."
      text: >-
        All three requested sources were found and identified.
        Sutherland, "On the evaluation of modular polynomials", ANTS-X, The
        Open Book Series 1 (2013) 531-555, arXiv:1202.3985, DOI
        10.2140/obs.2013.1.531. Corte-Real Santos, Costello and Shi,
        "Accelerating the Delfs-Galbraith Algorithm with Fast Subfield Root
        Detection", CRYPTO 2022 Part III, LNCS 13509, 285-314, DOI
        10.1007/978-3-031-15982-4_10 (located by DOI; no preprint found).
        Adj, Cervantes-Vazquez, Chi-Dominguez, Menezes and
        Rodriguez-Henriquez, "On the Cost of Computing Isogenies Between
        Supersingular Elliptic Curves", SAC 2018, LNCS 11349, 322-343, IACR
        ePrint 2018/313, DOI 10.1007/978-3-030-10970-7_15.
        THE OBJECTIVE WAS NOT MET: the baseline constant k is not stated in
        any of the three abstracts, only abstracts were read, and k therefore
        remains unquantified after four batches. The retrieval is recorded as
        a retrieval; no value was substituted or inferred.
    - id: OBS-8
      title: "NC-3/NC-6 did not execute. This is infrastructure, not evidence."
      text: >-
        TASK-20260804-6519fa, against the frozen contract EXP-P13-NC36,
        recorded status failed_infrastructure with the reason "Executor
        subagent returned empty result (no text output, no artifacts)", and
        `states_a_finding: false`. The feasibility gate FG-1 did not run; no
        pilot statistic exists; P0_predicted was never computed. Per AGENTS.md
        rule 5 this is an infrastructure outcome and is NEVER evidence for or
        against Heuristic 1. Heuristic 1's tail at the operating point remains
        entirely untested, now across all four batches of this campaign.
    - id: OBS-9
      title: "Independent review: two verdicts, both admissible, both qualified."
      text: >-
        Validator TASK-20260804-cf1ae3, independent session, verdict
        `accept_with_qualifications`, `admissible: true`. Five checks: CHK-1
        hash check PASS (SHA-256 independently recomputed for the four task
        artifacts and the four experiment artifacts, all matching
        receipt.json); CHK-2 NC2d arithmetic PASS (pooled alphas, gap,
        jackknife, regressor provenance and no-trend all reproduced); CHK-3
        NC2b arithmetic PASS_WITH_NOTE (all ten checks, gamma_null anomaly
        explained); CHK-4 bibliographic PASS; CHK-5 scope PASS
        (`states_a_finding: false` throughout, no status change claimed,
        NC-3/NC-6 correctly characterised). Two informational qualifications:
        Q-1 the "95% CI" mislabelling of the jackknife range, Q-2 that
        TASK-20260804-6519fa's own artifacts are untracked and absent from the
        reviewed snapshot.
        Red Team TASK-20260804-83d874, independent session, verdict
        `pass_with_constraints`. It confirmed the Phi_ell measurements are
        real and not simulated (canonical MIT source files, hash-matched to
        RUN-PEC-49c773-a; genuine supersingular primes; 39 s of wall clock
        consistent with computation rather than lookup) and that the
        regressor conflict was resolved correctly in favour of the frozen
        spec. Six labelled objections: RT-OBJ-A (gap-vs-ell trend unmonitored
        beyond ell = 211, a MISSING CONTROL); RT-OBJ-B (the alpha = 1.13
        excess over the theoretical 1.0 is not propagated into any c-table
        row); RT-OBJ-C (three p values and one residual degree of freedom per
        per-ell fit, and the simplified jackknife understates uncertainty);
        RT-OBJ-D (p3 is the highest-leverage point and is committed
        cross-session data, not a fresh measurement); RT-OBJ-E (no confidence
        interval on the pooled gap, so "significantly below 0.15" is asserted
        rather than demonstrated); RT-OBJ-F (Heuristic 1 completely
        unvalidated). None of the six is an execution defect.
    - id: OBS-10
      title: "Budget and deviations, recorded."
      text: >-
        TASK-20260804-241b87 consumed 42.0 s of a 3600 s task budget;
        RUN-P13-NC2d-a 39.142 s of a 1800 s run budget, RUN-P13-NC2b-a
        0.010 s. Two protocol deviations are declared in the NC2d manifest and
