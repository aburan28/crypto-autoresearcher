  certificate_note: >-
    No discrete-log solve and no factor-base relation is claimed, so there is
    nothing to certify in the sense of docs/claims-and-verification.md. The
    independent verification artifacts are CONTROLS: C-PHI-VERIFY (SHA-256 of
