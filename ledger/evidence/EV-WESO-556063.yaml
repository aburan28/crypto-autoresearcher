  direction: supports
  direction_binding: >-
    `supports` is bound to EXACTLY ONE claim and to nothing else: that at
    ell in {47, 101, 151, 211} and p in {2^20, 2^30, 2^40}, the pre-registered
    falsifier FC-4 does not fire, so the MECHANISM-INCONSISTENT designation
    attached to assumption L5 by DEC-20260802-48c72c adjudication E may be
    retired AT THAT SCOPE and by measurement, which
    DEC-20260802-48c72c stated is the only legitimate way to retire it.
    IT IS NOT BOUND TO: the conditional asymptotic theorem p^{1/3+o(1)}
    (untouched by this batch); Heuristic 1 (untouched, and unvalidated - see
    boundaries); the sign or magnitude of the NIST-I margin (INCONCLUSIVE and
    unmoved); the citability of any c value (governed unchanged by
    DEC-20260802-48c72c citability_ruling and SP-1..SP-12); or the prior FC-4
    firing at ell in {3,5,7,11,13} in EXP-PEC-49c773, which STANDS
    uncontradicted as a matter of record for that ell range.

  strength: preliminary
  strength_justification: >-
    One authorized run per experiment, one executed, one terminal. Both
    reviewers recomputed the reported arithmetic from the SAME committed raw
    data with their own code, which is verification of admissibility rather
    than a second measurement. NC2d re-uses the committed p3 per-entry medians
    from RUN-PEC-49c773-a (deviation D-2 of that run's manifest), so the p3
    arm - the highest-leverage point of every per-ell regression - is not an
    independent re-measurement at all. Nothing here is `replicated`. WHAT
    WOULD RAISE IT: an independent re-measurement of the p3 arm, or a fourth
    and fifth prime, which would also address red-team objection RT-OBJ-C
    (three points and one residual degree of freedom per per-ell fit).

  claim_tier: toy
  claim_tier_derivation: >-
    The record's substantive claim is a C-PSCALE p-scaling statement, and
    EV-PEC-857664.claim_tier_derivation already ruled, for this programme,
    that "every C-PSCALE statement, including alpha_hat and the FC-4 firing,
    carries a `toy` ceiling and may not be cited above it" - because the
    regression's two low-leverage points are p1 = 1048571 (2^20, a 40-bit
    F_{p^2}) and p2 = 1073741783 (2^30, a 60-bit F_{p^2}). The p3 arm alone
    (1099511627563, an 80-bit F_{p^2}) would mechanically admit `medium` under
    docs/claims-and-verification.md, and this record declines it: the tighter
    of the two legal ceilings governs the record as a whole. AGENTS.md rule 7
    applies in full and no figure here is a cryptographic-scale measurement.

  proof_status: empirical_only
  proof_status_justification: >-
    The basis for the stated direction is a MEASUREMENT against a threshold
    fixed before any datum of this run existed (EXP-P13-NC2d, frozen under
    TASK-20260804-c802a9), together with three passing controls and two
    independent reviews that reproduced its arithmetic. It is not a
    counterexample certificate and it is not a derivation note - neither
    exists for this claim in this repository - so the basis is DECLARED
    `empirical_only` rather than labelled above what it is. The declaration
    is the requirement; the absence of a proof is not the failure
    (docs/claims-and-verification.md, "Refutation artifacts").
