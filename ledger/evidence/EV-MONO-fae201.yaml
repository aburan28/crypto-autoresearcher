  strength: >-
    decisive_exact_match_independently_reproduced_from_scratch_AND_the_underlying_mechanism_independently_re_derived_via_two_separate_combinatorial_methods_confirming_linearity_is_structurally_forced_not_merely_data_compatible
  claim_tier: toy
  proof_status: derivation
  proof_status_note: >-
    Unlike EV-MONO-91bca2 (proof_status: empirical_only, a single exact
    measurement), this record's strength rests equally on Red Team's own
    independent re-derivation of IDEA-20260904-4f614a's STEP 4/5 argument
    -- proving, via two separate combinatorial methods (multiplicity
    counting and direct 4-orbit combinatorics under the Klein four-group
    action), that the mechanism gives NO combinatorial slot for an h_-^2
    or h_+*h_- interaction term. Linearity is a structural consequence of
    the mechanism, not an empirical curve-fit that happens to extrapolate.
  proof_refs:
    - experiments/EXP-MONO-ee06e2/reviews/red-team/red-team-report.yaml (independent J4 re-derivation of STEP 4/5, disjointness proof, structural-linearity finding)
    - experiments/EXP-MONO-ee06e2/reviews/validator/validation-report.yaml (independent J1/J2 from-scratch reproduction and blind rederivation)
    - ledger/proposals/IDEA-20260904-4f614a.yaml (original STEP 1-5 derivation)

  summary: >-
    On a curve with h_-=3, h_+=0 (p=101, A=1, B=33; n_+=52, n_-=46),
    found by the SAME fixed search order as EXP-MONO-4e6faa
    (adjusted only to require h_->=2), the exhaustive census of 152,096
    distinct-split base points matches the linear D3 prediction EXACTLY
    (R1_lin=R2_lin=0) while a named quadratic rival is decisively excluded
    (R1_quad=-312, R2_quad=936). This is the SECOND independent exact
    confirmation of the linear form (after EXP-MONO-4e6faa's h_-=1 curve),
    at a genuinely different, non-minimal h_- value capable of
    discriminating functional form. The Validator independently
    reproduced every number from scratch (own group-law code, own
    classification driver, own D_lin/D_quad computation) with zero
    disagreement. The Red Team independently confirmed the Executor's
    search contained no hard-coding toward the specific (A,B)=(1,33) pair
    a prior review had already flagged -- the fixed declared order alone
    determined the outcome (135 (A,B) pairs examined, matching exactly).
    Most significantly, the Red Team independently RE-DERIVED
    IDEA-20260904-4f614a's own STEP 4/5 mechanism from the group law
    alone (not by trusting the prose) and confirmed: (i) fixed-point sets
    of distinct halvable 2-torsion points are provably disjoint; (ii) the
    chi-half assignment follows from rationality of points on E vs. its
    twist; (iii) the STEP 5 bookkeeping (A_+ = 3n_+/2 - 3h_+) is
    reproducible by two independent combinatorial methods, which show the
    mechanism gives NO combinatorial slot for a nonlinear term -- so this
    experiment's exclusion of D_quad is a genuine corroboration of a
    SOUND, independently-verified derivation, not merely a second
    curve-fit data point.

  what_this_supports: >-
    (1) The D-term's dependence on h_- is specifically LINEAR, confirmed
    exactly at two distinct, non-adjacent values (h_-=1, h_-=3), with a
    plausible non-linear alternative decisively excluded at h_-=3. (2)
    IDEA-20260904-4f614a's own STEP 4/5 mechanism is now independently
    re-derived and confirmed sound (not merely plausible) -- the
    linearity is a structural consequence of independent, additive
    fixed-point-pair counting, not an artifact of the specific curves
    tested. (3) Together with EV-MONO-91bca2, this closes the
    retrodiction-bias gap IDEA-20260904-4f614a itself named IN FULL for
    the h_- term specifically: H-MONO-d4c511's own outcome (I) is now
    fully, not merely partially, earned.

  what_this_does_not_support: >-
    Does NOT test the h_+ term or any h_+/h_- interaction: BOTH curves
    tested so far (EXP-MONO-4e6faa's h_-=1 and this experiment's h_-=3)
    have h_+=0. Per Red Team's own discretionary finding, a concrete
    curve with h_+=1 AND h_-=3 simultaneously (p=103, A=1, B=11) is
    already identified and untested -- the closed form's FULL bivariate
    form (both h_+ and h_- terms, and any interaction between them) is
    not yet empirically exercised, only the univariate h_- slice with
    h_+ held at 0. Does not test the non-split strata. Does not make any
    relation-rate, cost, exponent, or cryptographic-scale claim. Does not
    re-scope H-MONO-93bc4d.

  independent_review:
    validator:
      report: experiments/EXP-MONO-ee06e2/reviews/validator/validation-report.yaml
      verdict: >-
        J1 (curve/twist construction, independent code): holds, all 14
