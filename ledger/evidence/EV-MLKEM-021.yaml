  # ==================================================================
  # UNRESOLVED CONFOUNDS - every one the two reviews list
  # ==================================================================
  unresolved_confounds:
    - >-
      THE UNCOVERED INSTRUMENT PATH, AND IT CARRIES THE LOAD. `matzov` at
      Kyber-768 and Kyber-1024 has no Sage-computed reference. The harness
      control covers `primal_bdd` and `dual_hybrid(fft=True)`; the only Sage
      anchor for `matzov` anywhere is the pin's Kyber-512 doctest. All three
      sessions used the same Sage-free instrument at the same pin, so a defect in
      lattice-estimator 3e48ef4 itself, or in the shim on a path the control does
      not cover, would be invisible to all of us. This is the batch's single
      point of failure and its cheapest falsification (see the successor).
    - >-
      THE NIST CUTOFFS 143 / 207 / 272 ARE THE DENOMINATOR OF EVERY MARGIN
      SENTENCE AND HAVE NEVER BEEN READ FROM PRIMARY TEXT BY THIS PROGRAM (H8;
      EV-MLKEM-020 H11; EV-MLKEM-015 boundaries). Neither reviewer endorses them.
      The red team names an unchecked archived candidate,
      inputs/MLKEM-DUAL-SOURCES-20260802/fips203_selected_text.txt, and asks
      whether it contains a numeric classical gate-count floor at all.
    - >-
      WHETHER CARRIER'S NEAREST-NEIGHBOUR FIT IS COEFFICIENT-IDENTICAL TO
      RC.MATZOV's NN_AGPS TABLE. This is DEF-6's hinge and nothing in the archive
      settles it. A 15-35% coefficient mismatch inside a term worth 5.56 / 6.55 /
      6.25 bits would by itself cover the entire surviving MATZOV-2022 residual
      (+1.52 / +0.99 / +2.20). The same argument applies to dimensions-for-free,
      worth 8.00 / 10.31 / 12.99 bits, where "applied by both sides" is sourced
      for EXISTENCE and not for MAGNITUDE.
    - >-
      H15 AND THE R HALF OF H17. Carrier's polar-code decoder and zero-secret
      iteration are not implemented at the pin; Carrier's outer repetition
      log2 R = 9.39 / 9.49 / 15.15 has no estimator counterpart and is unmapped -
      larger than ANOM-3's entire margin on all three sets and larger than the
      residual it would have to explain. Sizing R changes the frozen cost model
      and needs a Coordinator amendment. Until then no residual below ~2 bits
      should be read as meaningful.
    - >-
      CARRIER'S TABLE 5.1 IS NOT ARCHIVED, so ANOM-4 cannot be resolved and the
      published target itself carries a 0.29-0.35 bit ambiguity at Kyber-768/1024
      (headline minus archived-table sum = -0.010031 / +0.289554 / +0.349991).
    - >-
      GLOBAL OPTIMALITY OF ANY STAGE. Both the producer's searches and the
      validator's are LOCAL boxes; DEF-10 (a beta_sieve step-2 parity artifact
      worth ~0.04 bits, where the validator's own sweep missed the producer's
      optimum and the validator point-verified the producer's as correct)
      demonstrates the grids have artifacts. The box-doubling control (RC-4) that
      would test whether the Carrier agreement is a property of the box was NOT
      RUN.
    - >-
      STAGE-ORDER DEPENDENCE (H10). D2/D3/D4 are order-dependent and no
      reordering was run by anyone. D1 and the total are order-free, so the
      finding is unaffected; the SPLIT between D2, D3 and D4 is not established.
    - >-
      NO NULL OBJECT OF THE RIGHT SHAPE FOR EITHER HEADLINE (N7). CTRL-6 is a
      null of the wrong shape (magnitudes 60-120 bits, cannot fail
      informatively); the free archived nulls (Carrier's C0 and CN rows, plus
      +-3-bit shifted targets) were not run; and RC-1, the null LWE instance
      whose distribution defeats the dual distinguisher, has not been run.
    - >-
      THE MEMORY RECONSTRUCTION IS AN INFERENCE ON A BORROWED MODEL. "FFT table =
      p^{k_fft} cells" is inferred from the pin's own time formula, not quoted
      from MATZOV-2022; the sieve-database term inherits EV-MLKEM-020's own
      downgrade of 2^(0.2075n) to `construction_with_partial_support`, and the
      o(n) in 2^(0.2075n + o(n)) is unbounded here.
    - >-
      THE DATA / QUERY AXIS IS UNMEASURED BY ANYONE IN THIS CAMPAIGN. `matzov`
      fixes m = params.n (lwe_dual.py:583-584) while Carrier optimises m to
      475 / 636 / 802. The LWE sample budget is a real cost axis in a KEM setting
      and no record has priced it.
    - >-
      THE TWO ATTACKS CANNOT BE NORMALISED TO A COMMON SUCCESS PROBABILITY IN
      THIS INSTRUMENT. `MATZOV.__call__` takes no `success_probability` and
      applies no repetition, pricing ONE PASS at advantage 0.5; its siblings
      `dual`/`dual_hybrid` take `success_probability = 0.99` and report
      `repetitions`. The two sides are not doing the same per-attempt-cost x
      inverse-success-probability bookkeeping, and the instrument offers no way
      to make them.
    - >-
      A SHARED INSTRUMENT DIVERGED FROM THE REVIEWED SNAPSHOT, THIRD RECURRENCE.
      The producer's receipt honestly pins shim/sage/all.py at 6f93583d...702
      (the file at 0100fdbc^), while the tree at the reviewed snapshot
      12e97be8e04e carries 32d60a64...aab because the Coordinator's shim commit
      0100fdbc landed 31 seconds before the snapshot. Anyone checking out the
      reviewed snapshot exercises a different instrument. Bounded here to
      <= 1.9e-09 bits BY A REVIEWER RUNNING IT, not by the archive. Third
      recurrence of the class EV-MLKEM-020 records as EI-2 and the second
      involving this shim.
    - >-
      THE SNAPSHOT ARCHIVE RECEIPT CARRIES NO COMMIT BINDING
      (`commit_sha: null`, `parent_sha: null`,
      `verification.status: pending_post_commit`), so the dispatcher's
      post-commit verifier cannot be run against it. Both reviews performed the
      four checks by hand and all passed - 12e97be8e04e is reachable from HEAD,
      has the declared parent 0100fdbcc331, changes exactly the eight declared
      paths, and all seven artifact sha256 match - but the receipt itself does
      not carry what AGENTS.md "Durable research commits" requires.
    - >-
      REVIEW PROVENANCE. Both reviews requested `review-adversarial` at `xhigh`
      in independent sessions and both recorded `fallback_used: true` with
      `model_verified: false`, because this Claude Code harness cannot resolve
      orchestration/model-policies.yaml policy aliases. Neither is a rule-12
      `review-breakthrough` pass and neither claims to be. The same caveat
      applies to this Coordinator session, which did not run
      `python3 -m orchestration.adapter doctor --probe`.

