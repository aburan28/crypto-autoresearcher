    4.592472 / 8.387943 lower than `LWE.primal_bdd` under the same cost model.
    That is a statement about two entry points of one instrument, at one pin, in
    a convention that charges nothing for memory and reports none for either
    attack. It is NOT the statement "the dual attack beats the primal attack":
    the two figures come from cost derivations that differ in what they assume
    (one is an explicitly truncated asymptotic resting on the independence law
