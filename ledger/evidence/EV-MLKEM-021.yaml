  # ==================================================================
  # FRAMING - the red team's judgement, adopted as this record's own
  # ==================================================================
  headline_framing: >-
    THE INTERNAL FINDING DOES NOT SURVIVE AS STATED. This record adopts
    RT-20260803-f42495's central judgement rather than the producer's framing,
    and rather than the framing of my own unreviewed Coordinator note.
    Two things are established and one is not.
    ESTABLISHED: the published-vs-estimator dual cost gap that this whole batch
    was built on is 96.36 / 85.43 / 81.33 percent an artifact of the Coordinator
    comparing the published figures against the WRONG ESTIMATOR CALLABLE
    (`estimator.lwe_dual.dual_hybrid(fft=True)`, the Espitau-Joux-Kharchenko
    hybrid) rather than against `estimator.lwe_dual.matzov`, which is what the
    estimator's own public name `LWE.dual_hybrid` resolves to at
    `estimator/lwe.py:13`. That is a source fact plus a deterministic evaluation
    and it reproduced independently twice.
    NOT ESTABLISHED: that "the dual attack beats the primal attack" is a finding
    rather than an artifact of comparing two incommensurable cost derivations.
    `matzov` is costed from an EXPLICITLY TRUNCATED asymptotic - the estimator's
    own authors annotate `lwe_dual.py:551` "# p.29, we're ignoring O()" - and
    from the closed-form advantage law whose independence assumptions
    Ducas-Pulles (KN-LIT-111) dispute; `primal_bdd` carries no such disclaimer
    and does not rest on that law. Kyber-512's entire 0.543432-bit margin is
    SMALLER THAN ONE DROPPED FACTOR OF 2. Sharing the disputed law contaminates
    the COMPARISON precisely because only one side carries it, so "within the
    estimator's own frame" presupposes a single frame that does not exist.

  # ==================================================================
  # SCOPE, TIER, DIRECTION, STRENGTH - stated before any number
  # ==================================================================
  scope_statement: >-
    THREE CALLABLES, ONE COST MODEL, ONE INSTRUMENT, ONE PIN. Everything here
    concerns `estimator.lwe_dual.matzov`, `estimator.lwe_dual.dual_hybrid` with
    `fft=True`, and `LWE.primal_bdd`, under `RC.MATZOV`, as served by
    lattice-estimator 3e48ef421ec256afddb3e7d2249a77eab6e9ba12 through the
    Sage-free harness (tools/sage_free_estimator), at the three FIPS 203
    parameter sets (n = 512/768/1024, q = 3329). `arora_gb`, `dual` and
    `primal_hybrid` do not execute in this harness, and `matzov` fails under
    `RC.Kyber`; all four fail loudly rather than returning a wrong cost, and all
    were verified by running them. No sentence in this record says "best attack".
    No sampling, no G6K, no lattice computation, no network retrieval.

  claim_tier_note: >-
    `medium` is a ceiling on a COST-MODEL ESTIMATE, not on a measurement. The
    parameters really are the FIPS 203 ones, so AGENTS.md rule 7 is not strained
    - there is no toy-to-crypto extrapolation here. Equally, nothing was EXECUTED
    at any scale: this is not crypto-scale validation, it is arithmetic over a
    pinned cost model at crypto-scale parameters. An estimate under eighteen
    numbered modelling choices, four of them unvalidated and one unverifiable,
    cannot carry `crypto`.

  direction_note: >-
    `neutral` WITH RESPECT TO H-MLKEM-014, and this is a scoping statement, not a
    hedge. None of H-MLKEM-014's four conjuncts is falsified as literally
    written. Conjunct (1) names `dual_hybrid with fft=True`, and that callable
    was reproduced here at 143.788478 / 203.787863 / 273.817268, still ABOVE
    primal_bdd by +3.589005 / +2.829148 / +3.093644 - so falsification condition
    1 ("dual_hybrid+fft < primal_bdd ... by >= 0.5 bits") is NOT met by the
    function the hypothesis names. Conjunct (2) is still arithmetically true.
    Conjunct (3) is a free-memory statement reproduced at delta 0.00e+00.
    What this batch is adverse to is not the hypothesis text: it is (a) the
    Coordinator scouting premise that motivated BATCH-011, (b) the interpretive
    reading that the campaign built on EV-MLKEM-015's `inference` field, and
    (c) my own unreviewed significance note. Those are weakened in
    DEC-20260803-85adf8. Whether the callable divergence also contradicts the
    INTERPRETIVE INTENT of H-MLKEM-014 and of EV-MLKEM-015 is exactly the
    "contradiction of established evidence" determination that AGENTS.md rule 12
    routes to `review-breakthrough` at `max`, and that review HAS NOT HAPPENED.
    This record therefore does not make it, and no downstream record may read
    `neutral` as an endorsement of either side of it.

  strength_note: >-
    `preliminary`, and the cap is deliberate. It is set by the record's WEAKEST
    LOAD-BEARING LINK, not by its strongest.
    WHAT IS STRONGER THAN `preliminary` AND IS SAID SO HERE: the D1 callable
    identity is a source fact (`estimator/lwe.py:13` reads
    `from .lwe_dual import matzov as dual_hybrid`) that the validator confirmed
    by EXECUTION - `estimator.lwe.dual_hybrid is estimator.lwe_dual.matzov`
    returns True, `... is estimator.lwe_dual.dual_hybrid` returns False - and the
    Kyber-512 instance of ANOM-3 is readable from the pinned upstream
    repository's OWN COMMITTED DOCTEST with no shim and no patch involved. Those
    two do not depend on this program's instrument at all.
    WHY THE RECORD IS NEVERTHELESS CAPPED, three reasons each sufficient:
    (1) ONE PRODUCING SESSION. The package is one executor run; the validator and
    red team re-derived it but did not produce an independent package.
    (2) AN UNCOVERED INSTRUMENT PATH CARRIES THE LOAD. `matzov` at Kyber-768 and
    Kyber-1024 has NO Sage-computed reference of any kind - the harness control
    covers `primal_bdd` and `dual_hybrid(fft=True)` only, and the sole Sage
    anchor for `matzov` anywhere in this campaign is the pin's own doctest at
    KYBER-512. All three sessions share that one uncovered path, so an instrument
    defect there would be invisible to all of us. Those two numbers carry
    ANOM-3's 4.59 and 8.39-bit margins, D1's 7.42 and 11.48 bits, the Carrier
    residuals and every below-cutoff sentence for 768/1024.
    (3) NO RULE-12 REVIEW. Both reviews are `review-adversarial` at `xhigh` with
    `fallback_used: true` and `model_verified: false`, as is this Coordinator
    session. Neither is a `review-breakthrough` pass at `max` and neither claims
    to be.
    The ARITHMETIC alone is replicated - 26 of 26 recomputations reproduced, zero
    `not_reproduced`, maximum deviation 1.9e-09 bits, on an independently written
    script, on a separate clone, under a DIFFERENT floating-point rounding
    convention - and that is recorded as a property of the arithmetic, not as the
    strength of the record.

  # ==================================================================
  # WHAT IS ESTABLISHED
  # ==================================================================
  what_is_established:

    - id: E1
      title: THE D1 ATTACK-FUNCTION IDENTITY, AND ITS SHARE OF THE GAP.
      detail: >-
        `estimator/lwe.py:13` reads `from .lwe_dual import matzov as dual_hybrid`,
        so the estimator's PUBLIC name `LWE.dual_hybrid` resolves to
        `class MATZOV` (`estimator/lwe_dual.py:496`, instantiated at :689), the
        implementation of MATZOV-2022 Theorem 7.6. The MODULE-LEVEL function
        `estimator.lwe_dual.dual_hybrid` (:742) is a different object - the
        Espitau-Joux-Kharchenko dual hybrid over `DualHybrid` whose FFT
        distinguisher (`lwe_dual.py:191`) hardcodes the FFT modulus to 2 and
        cites the Independence Heuristic of ia.cr/2023/302.
        Under RC.MATZOV at the pin the two differ by
        D1 = +4.132436767026718 / +7.421619713624693 / +11.481587677563027 bits,
        which is 96.36% / 85.43% / 81.33% of the total gap
        (S0 - Carrier = +4.288478 / +8.687863 / +14.117268).
        D1 is also the entire source of the superlinear-in-beta growth the
        Coordinator's scouting treated as a systematic modelling difference:
        gap/beta 0.010668 / 0.014104 / 0.016321 (at beta 402/616/865) collapses
        to residual/beta 0.000403 / 0.002150 / 0.003203 after D1 alone and
        brackets zero after D1-D4.
      independently_reproduced: >-
        VAL-20260803-cc262c M1, M2, M3, M4, M5, M6 (own script, own clone,
        different `.n()` convention, deltas 0.0 except the Kyber-768 CTRL-4
        rounding term at 1.41e-11); RT-20260803-f42495 quantitative_claim_ledger
        (own clone, own patch, controlled at delta 0.000e+00 against the pin).
      what_it_is_not: >-
        It is not a claim that either cost model is right, and it is not a
        correction of any record. See `rule12_status`.

    - id: E2
      title: EV-MLKEM-015'S INFERENCE MISIDENTIFIED THE CALLABLE.
      detail: >-
        EV-MLKEM-015's `inference` field says any dual claim undercutting its
        numbers "must justify ingredients beyond the public MATZOV dual in
        lattice-estimator". The callable it actually ran was NOT the public
        MATZOV dual: the red team verified the invocation at
        `experiments/EXP-MLKEM-015/implementation/reproduce_estimates.py:16`
        (`from estimator.lwe_dual import dual_hybrid`) and :43, i.e. the record
        imported the module-level function directly and never touched the public
        alias. The public MATZOV dual already sits 4.13 / 7.42 / 11.48 bits below
        the number that inference treats as the bar, with NO ingredient beyond
        the public estimator. The same conflation appears in EV-MLKEM-015's
        boundary line "lattice-estimator matzov dual != Carrier polar-code
        repair", which uses the word "matzov" for a function that is not
        `matzov`. Both reviews reached this independently: VAL
        `ev_mlkem_015_judgement` ("NEITHER_CLEANLY - correct in its measurements,
        over-general in one clause, and materially wrong in its inference"), RT
        OBJ-6 ("RIGHT ABOUT WHAT IT NAMED, WRONG IN ITS INFERENCE").
        The defect is older and wider than one record: RT OBJ-6 further verified
        that `experiments/EXP-MLKEM-015/specification.yaml:45` enumerates
        `attack in {primal_usvp, primal_bdd, dual_hybrid}`, so the experiment
        CONTRACT never enumerated the estimator's MATZOV implementation, and that
        contract passed a validator and a red team in BATCH-001 and was reused
        through BATCH-010.
      status_of_this_item: >-
        RECORDED AS AN OBSERVATION AND A REVIEWERS' JUDGEMENT, NOT AS A
        CORRECTION. AGENTS.md rule 12 is UNMET AND UNWAIVED. Correcting a
        validated evidence record's inference is precisely the "contradiction of
        established evidence" that routes to `review-breakthrough` at `max`.
        EV-MLKEM-015 keeps its status, its numbers and its
        `accepted_with_qualifications` label, and this record performs no
        supersession. Both reviews say the same thing and neither performed it
        either. What a superseding record WOULD have to say, if a rule-12 review
        ever authorizes one, is recorded verbatim in VAL-20260803-cc262c
        `what_i_recommend_a_record_should_say`.

    - id: E3
      title: ANOM-3'S KYBER-512 INSTANCE IS A DOCUMENTED PROPERTY OF THE PIN.
      detail: >-
        COORDINATOR-RUN CORROBORATION, recorded as mine. The pinned estimator's
        OWN COMMITTED DOCTEST at `estimator/lwe.py:124` shows, with no shim, no
        patch and no instrument of this program involved,
        `bdd :: rop: ~2^140.2 ... beta: 389, eta: 422, d: 1005` and
        `dual_hybrid :: rop: ~2^139.7 ... beta: 387`. So 2^139.7 < 2^140.2 is a
        documented property of lattice-estimator 3e48ef4 as published upstream,
        and the doctest's bdd beta/eta/d match this harness's primal_bdd output
        (389/422/1005) EXACTLY - which is independent external validation of the
        Sage-free harness on the primal path at Kyber-512.
        Independently reproduced by the validator (M9, "reproduced independently
        and strengthened", every integer exact and every log2 to printed
        precision) and by the red team (its own patch reproduces
        rop 2^139.6560 / red 2^139.5466 / guess 2^135.8809 / beta 387 / p 5 /
        zeta 0 / t 50 / beta' 391 against the committed doctest).
      what_it_strengthens_and_what_it_does_not: >-
        It strengthens the REALITY of the internal comparison at Kyber-512 - the
        ordering is not an artifact of this program's shim - and it strengthens
        nothing about the comparison's MEANING. A doctest records what the
        estimator prints, not whether either cost derivation is sound. It also
        covers KYBER-512 ONLY, which is where ANOM-3's margin is smallest
        (0.543432 bits) and where the red team's decay test kills it.

  # ==================================================================
  # WHAT IS NOT ESTABLISHED
  # ==================================================================
  what_is_not_established:

    - id: N1
      title: NOT ONE FRAME - THE TWO COSTS ARE NOT COMMENSURABLE AT THIS RESOLUTION.
      detail: >-
        `primal_bdd` is costed in `lwe_primal.py` from a BKZ simulation plus one
        SVP call at eta+1. `matzov` is costed from an explicitly TRUNCATED
        asymptotic: `estimator/lwe_dual.py:551` carries the estimator authors'
        own comment "# p.29, we're ignoring O()", and the sample-count law at
        :552-556 is the closed-form advantage law with `mu = 0.5` at :539 and no
        term modelling dependence between score contributions - the structure
        Ducas-Pulles (KN-LIT-111) argue is unsound for this family. `primal_bdd`
        carries no such disclaimer and does not rest on that law.
        ANOM-3's Kyber-512 margin of 0.543432 bits is SMALLER THAN ONE DROPPED
        FACTOR OF 2. The asymmetry runs in exactly the wrong direction for the
        split my note proposed: sharing a disputed assumption contaminates the
        comparison BECAUSE only one side carries it.
      source_locus: estimator/lwe_dual.py:551 (one line, re-runnable at the pin, no compute)
      raised_by: RT-20260803-f42495 OBJ-3(i)

    - id: N2
      title: THE BATCH'S OWN DIAGNOSTIC CONVICTS ANOM-3, AND IT WAS NOT APPLIED.
      detail: >-
        The task card and gap_report section 4 both rest on the rule "a gap that
        grows with beta is a systematic modelling difference, not noise". That is
        the rule the batch used to convict the Coordinator's scouting gap
        (gap/beta 0.01067 / 0.01411 / 0.01632, monotone). ANOM-3's own margin has
        the SAME monotone shape: margin/beta = 0.0014042 / 0.0077971 / 0.0101919
        at beta 387 / 589 / 823. The diagnostic was applied to the finding that
        embarrassed the scouting and was not applied to the finding that flatters
        the campaign. That asymmetry is recorded as a finding in its own right,
        under AGENTS.md rule 9 and docs/inventor-protocol.md section 3.
      raised_by: RT-20260803-f42495 OBJ-3(ii)

    - id: N3
      title: THE DECAY TEST WAS RUN, AND THE HONEST ANSWER IS PER PARAMETER SET.
      detail: >-
        The parameter whose increase should destroy the signal is N-inflation -
        the exact direction in which the Ducas-Pulles objection acts if the
        independence law understates the sample count required for a given
        advantage. The red team inflated `Nf`'s output by 2^delta with FULL
        re-optimisation inside RC.MATZOV, using a MATZOV subclass that reproduces
        the pinned optimum at delta = 0 to EXACTLY 0.000e+00 on all three sets,
        so the mutation is controlled.
        KYBER-512: N x 2^0 -> +0.543432, x2^1 -> +0.276399, x2^2 -> +0.076049,
        x2^4 -> -0.331512. FLIPS at delta ~ 2.3732 bits. Understating the
        required sample count by a factor of 5.2 erases ANOM-3 entirely at
        Kyber-512, which is well inside the uncertainty the Ducas-Pulles
        objection opens.
        KYBER-768: still +0.728911 at N x 2^16. Not bracketed.
        KYBER-1024: still +5.233394 at N x 2^16. Not bracketed.
        So the quantity DOES decay under the parameter meant to destroy it at
        Kyber-512 - the canonical artifact tell, inverted: it decays, which per
        inventor-protocol section 3 is what a real signal is supposed to do at
        768/1024 and what an artifact does at 512. The honest statement is
        FRAGILE AT KYBER-512, GENUINELY ROBUST AT KYBER-768 AND KYBER-1024, and
        it is recorded in the direction it falls rather than collapsed to a
        single verdict.
      caveat: >-
        Ducas-Pulles's own repaired constant was NOT retrieved and was NOT
        invented. This is a sensitivity, not their correction, and the red team
        labels it so. RC-2 (extend to 2^24 / 2^32 and bracket 768/1024) is
        recorded as an owed control.
      raised_by: RT-20260803-f42495 OBJ-3(iii), counterexample_or_mutation

    - id: N4
      title: MEMORY WAS DISCARDED IN THE MIGRATION, AND THE ORDERING FLIPS.
      detail: >-
        The migration from `dual_hybrid(fft=True)` to `matzov` silently discarded
        the only memory figure the instrument supplied on the dual side, and
        nobody noticed until the red team read the cost dictionaries:
        `dual_hybrid(fft=True)` reports `MEM` = 2^92.699292 / 2^135.198091 /
        2^184.641891 and `REPETITIONS` = 1; `matzov` reports NEITHER; `primal_bdd`
        reports neither. ANOM-3 therefore compares two attacks in a convention
        where memory is free AND unreported, having replaced the one attack that
        at least printed a number.
        RECONSTRUCTED PEAK MEMORY (Z_q-element unit, EV-MLKEM-020's convention):
        matzov FFT table p^{k_fft} = 2^116.0964 / 2^120.0000 / 2^240.0000 cells,
        sampling sieve database 2^91.0603 / 2^131.4803 / 2^177.7429, peak
        2^116.0964 / 2^131.4803 / 2^240.0000, against primal_bdd's 2^88.494071 /
        2^131.657286 / 2^180.924993. The recipe is CALIBRATED, not invented: the
        red team's reconstruction reproduces EV-MLKEM-020's published primal
        log2 M to |delta| < 4.0e-07.
        CONSEQUENCE A - THE ORDERING. The memory-charge exponent that flips
        ANOM-3 is c_flip = 0.019688 at Kyber-512, which is BELOW EV-MLKEM-020's
        OWN primal c* of 0.03164649 and 17x below the 3D-mesh convention 1/3; and
        0.141988 at Kyber-1024. At Kyber-768 `matzov` uses 0.1770 bits LESS
        memory than primal_bdd, so charging WIDENS its margin and there is no
        flip at any c >= 0.
        CONSEQUENCE B - REPORTED IN THE DIRECTION IT FALLS. Against the cutoffs
        (H8 caveat inline: 143/207/272 have never been read from primary text by
        this program), matzov's own EV-MLKEM-020-style c* is 0.028803 / 0.080877 /
        0.040268 versus primal_bdd's 0.031646 / 0.045886 / 0.007055. So matzov's
        undercut is MORE memory-robust than primal_bdd's at Kyber-768 and
        Kyber-1024 and slightly less at Kyber-512. ANOM-3 does not rescue any
        security reading - every one of these is one to two orders of magnitude
        below 1/3, exactly as EV-MLKEM-020 found - but it is not uniformly more
        fragile either, and saying otherwise would be as dishonest as the
        overclaim.
        FINALLY: at Kyber-1024 the reconstructed FFT table is 2^240 cells against
        a claimed total cost of 2^262.34. A cost model that charges nothing for
        2^240 cells of storage is not costing an algorithm anyone could run.
      labelled_inference: >-
        "FFT table = p^{k_fft} cells" is an INFERENCE from the pin's own time
        formula (`T_fftf` at lwe_dual.py:513 costs an FFT over Z_p^k as
        C_mul*k*p**(k+1); `T_tablef` at :516-523 updates "the table"). It is NOT
        a quotation from MATZOV-2022, whose primary text nobody retrieved. The
        sieve-database figure inherits every sourcing defect EV-MLKEM-020's own
        red team recorded against 2^(0.2075n), which that record downgraded to
        `construction_with_partial_support`. Self-consistency cross-check:
        log2 N = 81.0788 / 119.7530 / 165.9385 against 0.2075*beta_sieve =
        81.1325 / 120.9725 / 166.8300 - the sieve produces just enough vectors on
        all three sets.
      raised_by: RT-20260803-f42495 OBJ-4

    - id: N5
      title: THE SECURITY READING IS DISSOLVED TWICE OVER.
      detail: >-
        FIRST, BY THE SHARED ASSUMPTION. The estimator's `matzov` implements the
        very sample-count law whose independence assumptions Ducas-Pulles
        dispute, and Carrier's stated contribution is precisely to AVOID those
        assumptions. Two cost models landing within a bit or two of each other
        while resting on different foundations is an observation, not
        corroboration of either foundation. Both reviews confirmed the source
        fact this rests on (`Nf` derives N from a closed form with `mu = 0.5` and
        no dependence structure); it is sound and sufficient ON ITS OWN.
        SECOND, BY MEMORY CHARGING. N4's reconstructed c* figures put every
        undercut here one to two orders of magnitude below every named hardware
        convention, which is the same conclusion EV-MLKEM-020 reached for the
        primal by a different route.
        CONSEQUENTLY: no sentence of the form "ML-KEM sits below its NIST
        category" is supported by this batch, and the arithmetic
        cutoff - matzov(S1) = +3.343959 / +10.633757 / +9.664320 is recorded ONLY
        with the H8 caveat inline - the cutoffs 143/207/272 are secondary-sourced
        from a parenthetical in Carrier's abstract and MATZOV Table 1's "Required
        Security Level By NIST" column, no FIPS 203 or NIST call text is readable
        under this program's network policy, and the free-memory gate count is a
        deliberately CONSERVATIVE floor chosen in the defender's favour
        (EV-MLKEM-020 OBJ-10). Sitting under a deliberately conservative floor
        computed in a model that charges nothing for 2^240 cells is a statement
        about a convention, not about ML-KEM.
      raised_by: RT-20260803-f42495 OBJ-3, OBJ-4, OBJ-5; VAL-20260803-cc262c ANOM-3 scope_limits

    - id: N6
      title: THE CARRIER AGREEMENT IS BOUNDED BY A SEARCH BOX, NOT BY A MODEL.
      detail: >-
        D2, D3 and D4 are NOT differences between the estimator and the
        publication. They measure the ESTIMATOR'S OWN OPTIMISER SLACK - grid
        resolution, unoptimised m, unpassed beta_sieve - applied to ONE SIDE
        ONLY, with no matching relaxation of Carrier's fixed published number.
        Only D1 is of the type the task card asked for. Summing them into a
        column headed "total attributed" is what produces parts exceeding the
        whole: `fraction_attributed` 1.112888 / 1.070009 / 0.978413 and residuals
        of -0.484118 / -0.608231 / +0.304744 after D1-D4. The producer disclosed
        this in three places and called it bracketing; the red team's diagnosis
        is that a one-sided relaxation started above a target will cross it for
        ANY target it started above, so the crossing carries no information about
        Carrier. The producer's own H9 states the boxes are LOCAL, which means a
        wider search makes S4 strictly cheaper on all three sets and "the pinned
        estimator reproduces Carrier's headline" degrades into "the estimator
        undercuts Carrier by an amount bounded only by the size of the search
        box". The box-doubling control that would settle it (RC-4) was NOT RUN.
      permitted_precision: >-
