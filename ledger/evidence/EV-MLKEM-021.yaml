  # ==================================================================
  # INFERENCE
  # ==================================================================
  inference: >-
    THE BATCH'S PREMISE WAS THE COORDINATOR'S OWN ERROR, AND THE FINDING THAT
    REPLACED IT DOES NOT SURVIVE AS STATED. BATCH-011 was dispatched to account
    for a published-vs-estimator dual cost gap that grew with beta and therefore
    looked like a systematic modelling difference. Between 81% and 96% of that
    gap, and all of its growth, is the Coordinator having compared the published
    figures against the wrong estimator callable. That is established, source-
    checkable and independently reproduced twice, and it is the durable content
    of this batch.
    What the correction surfaced - that `estimator.lwe_dual.matzov`, the object
    the estimator's public `LWE.dual_hybrid` name actually binds to, is cheaper
    than `primal_bdd` by 0.543432 / 4.592472 / 8.387943 bits - is REAL as an
    instrument fact (the Kyber-512 instance is in the pin's own committed
    doctest) and is NOT a finding about attacks. Only one side of that comparison
    carries an explicitly truncated asymptotic and the disputed independence law;
    at Kyber-512 the entire margin is smaller than one dropped factor of 2, it
    dies under 2.4 bits of sample-count inflation, and it dies under a
    memory-charge exponent of 0.0197 - below the primal's own c* from
    EV-MLKEM-020. At Kyber-768 and Kyber-1024 the same margins survive 16 bits of
    inflation and, at 1024, a charge exponent up to 0.142, so the honest
    statement is per parameter set and is recorded that way. The security reading
    is dissolved twice over, by the shared assumption and by memory charging, and
    no sentence here says any FIPS 203 parameter set misses a NIST category.
    Two Coordinator errors were found by review and are corrected on the record
    in DEC-20260803-85adf8: the mis-transfer of EV-MLKEM-020's per-attack c* to a
    different attack, and an over-read of a grep that led my note to assert the
    estimator prices no false positives at all when the analytic union-bound term
    is present at lwe_dual.py:555.
    Nothing here changes the status of any record. AGENTS.md rule 12 is UNMET and
    UNWAIVED; ANOM-3 is not recorded as correcting EV-MLKEM-015, and both
    independent reviews explicitly declined to perform that correction too. This
    is not an ML-KEM break, not a security proof, and carries no solution
    certificate.

