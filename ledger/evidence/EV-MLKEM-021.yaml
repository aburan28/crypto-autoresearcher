    - >-
      KN-OPEN-016 IS UNTOUCHED. It asks what the dual attack costs AFTER the
      heuristics are repaired. This batch measured the cost BEFORE repair, in an
      implementation of the unrepaired law. The red team's N-inflation sweep is
