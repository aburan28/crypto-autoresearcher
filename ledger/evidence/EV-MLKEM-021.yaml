    - id: N8
      title: MU IS NOT THE CULPRIT, AND MY NOTE POINTED AT IT.
      detail: >-
        The red team subclassed MATZOV, rescaled N by the exact bracket ratio for
        a new mu, verified the subclass reproduces the pin at delta 0.000e+00,
        and swept mu with full re-optimisation inside RC.MATZOV: mu = 2^-10 costs
        +0.109951 / +0.000000 / +0.000000 bits; mu = 2^-40 costs
        +0.109952 / +0.000000 / +0.000000; mu = 2^-128 costs
        +0.267033 / +0.000001 / +0.000000. Tightening the target advantage by 128
        bits costs the attacker at most 0.267 bits at Kyber-512 and nothing
        measurable at 768/1024, because log(1/mu) is one additive term in a
        bracket dominated by k_fft*log(p) (50*log 5, 60*log 4, 120*log 4) and
        because at 768/1024 the required N sits BELOW the sieve's free output.
        CONSEQUENCE, BINDING ON THIS RECORD AND ON EVERY DOWNSTREAM ONE: mu = 0.5
        may NOT be described as the load-bearing assumption. The load-bearing
        objects are the advantage law itself (`exp(4*(lsigma_s*pi/q)**2)` at
        lwe_dual.py:553) and the union-bound bracket at :555. H17 is re-scored
        accordingly: its mu half is now SIZED and negligible; its R half remains
        unsized and is LARGER than ANOM-3's entire margin on all three sets.
        The producer's own remediation proposal (gap_report section 8 item 2,
        "expose mu ... the largest nameable remaining term") would have spent a
        Coordinator cost-model amendment on a quarter-bit knob.
      raised_by: RT-20260803-f42495 OBJ-2

