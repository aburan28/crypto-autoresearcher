  boundaries:
    - No secure, complete, IND-CCA2, EndRing-only, post-quantum, practical, deployable, or universally novel EigenX scheme is established.
    - The J4 result is a scoped defect in the exact proposed CCA oracle simulation, not an impossibility theorem for Naor--Yung, EI-DXWE, EndRing PKE, or an amended candidate.
    - The full-ring result is conditional witness-interface necessity, not universal decoder or representation necessity.
    - EI-DXWE and its optional relation-specific xO route are separate strong uninstantiated assumptions and are not consequences of EndRing hardness.
    - General auxiliary-input EWE has a conditional implausibility boundary; this does not unconditionally refute every restricted relation-specific construction.
    - Missing algorithms, source full text, setup details, costs, parameters, and correctness bounds remain open obligations rather than nonexistence evidence.
    - Report, diagram, PDF, hashing, parsing, and visual inspection operations are administrative evidence work, not scientific measurements.
  unresolved_confounds:
    - Exact efficient K0 sampler, D_ER law, retry tail, complete evaluable-certificate generation, and erased-state guarantee.
    - Executable R_CER gate, dual, field-embedding, total extension-degree, DegUB, torsion, parser, and decoder algorithms.
    - Uniform EI-DXWE or relation-specific xO instantiation for the exact external instance and adaptive auxiliary distribution.
    - Exact strong-USS NIZK game, total CRS/parser behavior, and a concrete matching construction.
    - Pointwise witness-independent DX correctness or an adversarial-valid-ciphertext robustness game with q_D-scaled loss.
    - Universal decoder non-factorization, concrete parameters, total cost, implementation behavior, and full LIT-SiGamal comparison.
