  observations:
    - id: O-review-vector
      text: >-
        The exact independent owner vector is J1=inconclusive,
        J2=inconclusive, J3=inconclusive, J4=breaks, and J5=inconclusive. The
        frozen-plan independence checker passed for all five reports. J6 then
        passed the released Markdown, Mermaid, SVG, eleven-page PDF, source
        links, and claim boundaries with no requested corrections.
    - id: O-r-cer
      text: >-
        Conditional on genuine homomorphism gates, correct duals,
        conservative degree bounds, common field embeddings, and a complete
        executable verifier, the torsion equality, trace-discriminant, and
        index-one argument makes each accepted R_CER witness a complete
        evaluable rank-four basis of End(E). Those verifier algorithms and the
        exact Decode_CER grammar remain incomplete, so J1 is inconclusive.
    - id: O-external-extraction
      text: >-
        The attacker-to-EndRing direction is coherent only under the separately
        named EI-DXWE assumption for the same externally supplied instance and
        exact adaptive auxiliary view, with a uniform extractor, distribution
        match, sound R_CER decoding, and explicit loss. Ordinary self-sampled
        XS-WE cannot embed the independent external challenge. No matching
        primitive or theorem is instantiated, so J2 is inconclusive.
    - id: O-full-ring-boundary
      text: >-
        The declared recipient interface accepts only complete R_CER witnesses,
        and the named path, one-endomorphism, abstract-order, torsion, rank-one,
        and strict-suborder substitutes fail that syntax. The packet proves no
        non-factorization or representation lower bound excluding a compressed,
        cached, reconstructed, or opaque smaller decoder on identical public
        data, so J3 is inconclusive.
    - id: O-cca-break
      text: >-
        Real Dec decrypts both components and rejects on bottom, wrong length,
        or disagreement. The proposed reduction decrypts only the component
        whose independently sampled witness it knows. A true L_EQ query using
        adversarially selected valid encryption coins can therefore make real
        Dec return bottom while the simulator returns a message. Honest
        average epsilon_DX correctness does not exclude this event, and the
        proposed loss lacks a robust-correctness or q_D-scaled term. J4 breaks
        O5 at this exact oracle-simulation step.
    - id: O-assumptions-sources-cost
      text: >-
        EndRing_D_ER, K0, EI-DXWE, optional relation-specific external-aux xO,
        adaptive ZK plus strong-USS NIZK, CRS, erasure, parsing, and costs are
        kept separate. Directly inspected Seta, FESTA, SiGamal, supersingular
        key-updatable PKE, and EigenX-v2 differ materially in scoped mechanism,
        but the comparison is not exhaustive and establishes no universal
        novelty. K0, all core primitives, parameters, and total costs remain
        uninstantiated, so J5 is inconclusive.
    - id: O-source-limit-and-path-defect
      text: >-
        Full LIT-SiGamal text was not retrieved: ePrint returned HTTP 403 and
        Springer returned an HTML interstitial. J5 also records invalid source
        path strings for the producer directory and snapshot receipt. Its
        recorded producer hashes equal the actual frozen packet hashes and its
        released artifact hash matches, but those invalid path strings supply
        no provenance and were not corrected in the frozen review.
    - id: O-obligations
      text: >-
        Conjunctive composition leaves O1, O2, O3, O4, and O6 open and O5
        contradicted. There are zero reviewed discharges. The candidate is an
        incomplete candidate with a scoped CCA-transform obstruction, not a
        secure construction.
    - id: O-documentation
      text: >-
        The released report set preserves the exact joint and obligation
        vectors, zero-run boundary, source limits, assumption separation, and
        sole next action. J6 independently inspected the actual SVG and every
        page of the final eleven-page PDF and returned pass.
  inference: >-
    Close BATCH-5313dc as archived while GOAL-SSI-2fa82a remains active. The
