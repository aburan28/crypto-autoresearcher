      observed: "no second same-prime matched pair exists in the declared range"
      result: not_applicable

  empirical_evidence_created: true
  mathematical_evidence_created: false
  scientific_evidence_created: true
  scientific_effect: >-
    This record does NOT corroborate H-MONO-45183a Part B's (N,tau)-only
    completeness claim, and does NOT establish a curve-specific
    exceptional-locus deviation. Both independent reviewers, via
    completely disjoint methods, converge on INCONCLUSIVE as the honest
    label: the tested design examined only 1 of >=101 available
    matched-(N,tau) cells in its own declared range (an undisclosed
    search-scope choice, not a fact about number-theoretic scarcity), the
    pre-registered two-sided test landed just outside conventional
    significance while every alternative standard framing of the
    identical data landed just inside it, the design's own power
    characterization was shown wrong for the actual cell found (moderate,
    not negligible, power at the observed effect size), and the one
    control this run actually applied (fixed/random-sign) was already
    known, before this contract was written, to be tautological for this
    construction -- while the ONE control this lane's own prior review
    (EXP-MONO-12ce1c OBJ-6) showed to be genuinely discriminating for the
    exact mechanism in question was never applied. H-MONO-1d50ac's own H1
    heuristic assumption is corrected in place to reflect this precedent.
    No ECDLP, relation-rate, or cryptographic-scale claim in either
    direction. Does not close KN-OPEN-009. The concrete, cheap,
    independently-converged-upon next action (extend to the cross-prime
    cells; apply the transversal-vs-group-uniform control) is named as
    this record's own next_action, not yet executed.

