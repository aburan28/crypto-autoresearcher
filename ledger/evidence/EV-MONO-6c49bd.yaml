    - metric: stage1_independent_reproduction
      forced: "both curves within 3 SE of G7's predicted rate"
      observed: "ordinary 0.309 SE (unremarkable); CM 2.427 SE (independently corrected from reported 2.424 SE), both formally passing the 3-SE gate but with an 8x asymmetry between the two curves' own precision"
      result: pass_per_contract_gate_asymmetry_flagged
    - metric: stage2_direct_comparison_two_sided_fisher_exact
      forced: "pre-registered, two-sided, genuinely open"
      observed: >-
        p=0.06598 (independently reconfirmed exactly by both reviewers via
        two disjoint from-scratch methods); not significant at the
        pre-registered two-sided alpha=0.05
      result: not_significant_at_pre_registered_test_borderline_under_every_alternative_framing_examined
    - metric: stage3_replication
