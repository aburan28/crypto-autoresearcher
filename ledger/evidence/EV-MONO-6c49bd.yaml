  proof_status: derivation
  proof_status_note: >-
    H-MONO-45183a Part B's closed form (6(tau-1)/N) remains a derivation,
    unmodified. Both reviewers independently, via wholly disjoint methods
    (a from-scratch brute-force re-derivation plus exact-Fraction
    arithmetic, vs. a from-scratch blind reimplementation plus alternative
    statistical framings), confirmed every reported number bit-for-bit or
    to full precision, and both converged on the SAME substantive
    disposition: this run is INCONCLUSIVE, not corroborating, for reasons
    neither this Coordinator's own pre-review framing nor the Executor's
    own execution_report fully anticipated.
  proof_refs:
    - experiments/EXP-MONO-64aaa4/reviews/validator/validation-report.yaml (six independent recomputations; the design-time power-check claim independently shown wrong; the OBJ-6 precedent cross-reference)
    - experiments/EXP-MONO-64aaa4/reviews/red-team/red-team-report.yaml (cross-prime search-scope finding; alternative statistical framings; the missing discriminating control)

  observations:
    - >-
      EVERY CONSTRUCTION AND ARITHMETIC CLAIM IS INDEPENDENTLY
      RECONFIRMED BY BOTH REVIEWERS VIA WHOLLY DISJOINT METHODS. Both
      independently re-derived the matched pair's own curve parameters
      (p=617, N=580, tau=4, j_ord=227, j_cm=494=1728 mod 617) from
      scratch; both independently confirmed the "3 drawn points, 4
      canonical sign classes" construction is the UNIQUE reading
      consistent with H-MONO-45183a's own B-1/B-2 text (the rejected
      "4 points" literal reading is self-contradictory against the
      contract's own "4 sign classes" count); both independently
      confirmed the fixed-sign/random-sign dual-arm control is
      mathematically tautological for this construction via an
      independently-derived group-theoretic permutation argument. The
      Validator additionally performed a full clean-room re-execution
      reproducing every number bit-for-bit; the Red Team performed a
      fully blind, zero-repository-code reimplementation from the frozen
      spec text alone, which also reproduced every headline number
      exactly (after independently discovering and correcting a
      documentation defect -- see below).
    - >-
      THE "EXHAUSTIVE SEARCH, EXACTLY ONE MATCHED PAIR" HEADLINE IS
      TECHNICALLY TRUE BUT MATERIALLY INCOMPLETE, FOUND INDEPENDENTLY BY
      BOTH REVIEWERS. The Stage-0 search, as actually coded, only checks
      for (N,tau) coincidences between curves constructed AT THE SAME
      PRIME. The frozen contract's own text explicitly contemplates a
      wider reading ("at that SAME prime OR, if declared explicitly in
      advance, at a different prime within the range"), but no such
      declaration was ever made, and this narrowing was never disclosed
      as an interpretation decision (unlike the other decisions
      implementation.md does disclose). Both reviewers independently
      re-scanned the archived, hash-verified stage0_transcript.json and
      found >=100 CROSS-PRIME matched-(N,tau) cells that were never
      searched for, measured, or acknowledged -- several at primes far
      cheaper than 617 (e.g. N=124, tau=4 at p=109 (ordinary) vs p=139
      (CM j=0)). The Validator assesses same-prime-only as "very likely
      the scientifically correct choice" (a cross-prime match would
      confound field/characteristic with endomorphism ring); the Red
      Team argues the closed form's own (N,tau)-only functional form
      names no dependence on p, making a cross-prime match an equally
      valid, arguably STRICTER instance of the exact question this record
      asks. Both agree: regardless of which reading is preferred, the
      choice determines which of >=101 candidate pairs becomes "the"
      tested pair, was never surfaced as a choice, and collapsed a
      hundred-plus-cell search space down to a single point estimate at
      near-zero additional cost to explore further.
    - >-
      THE "NOT SIGNIFICANT (p=0.066), NO LARGE DEVIATION" FRAMING
      UNDERSELLS A GENUINELY BORDERLINE RESULT, CONFIRMED BY BOTH
      REVIEWERS INDEPENDENTLY. The pre-registered, two-sided Fisher-exact
      test (p=0.066) is independently reconfirmed exact by both reviewers
      via different methods (a from-scratch log-factorial hypergeometric
      computation, and scipy cross-checked against a manual two-proportion
      z-test). BOTH reviewers, independently, computed a one-sided
      Fisher-exact test in the observed direction (CM rate higher):
      p in [0.029, 0.033] across four alternative-but-standard framings
      (one-sided Fisher, two-proportion z-test one-sided, and a
      pair-count-based variant) -- ALL crossing the conventional 0.05
      threshold. THIS IS NOT PRESENTED AS GROUNDS TO ADOPT A ONE-SIDED
      TEST POST HOC: H-MONO-1d50ac's own predictions explicitly
      pre-register a TWO-SIDED test, and that commitment is honored, not
      overridden. It IS presented, per both reviewers, as evidence that
      the result sits one conventional test-choice away from significance
      in every direction examined, which "not significant" alone does not
      communicate to a reader.
    - >-
      THE VALIDATOR INDEPENDENTLY SHOWED THIS CONTRACT'S OWN DESIGN-TIME
      POWER CLAIM WAS WRONG FOR THE CELL ACTUALLY FOUND. The contract's
      `comparison_test_power_check` (written generically before Stage 0
      ran) claims the test is "powered to detect a multiplicative rate
      difference of order 2x or more... NOT powered to detect a sub-20%
      relative difference." Independently computed (normal-approximation
      power calculation, cross-checked against a 300-replication Monte
      Carlo Fisher-exact simulation) at the actual matched pair's
      parameters (n=20000, ~620 expected pairs): power reaches 80% at only
      a ~16.4% relative difference and 92-95% at 20%, NOT requiring
      anything close to 2x -- the contract's generic pre-registration was
      never revisited against the specific (N,tau) cell Stage 0 actually
      found. At the ACTUALLY OBSERVED ~11% relative difference, power is
      ~42-47%: moderate, not negligible. This means p=0.066 is a
      genuinely moderately-powered, borderline null, not the
      "underpowered, so uninformative" reading the contract's own prose
      and the execution_report's own framing both suggest.
    - >-
      A SECOND-ORDER SIGNAL, ALSO FLAGGED BY BOTH REVIEWERS: THE CM
      CURVE'S OWN WITHIN-CURVE RESIDUAL (2.427 SE, independently
      recomputed -- see next observation for the small arithmetic
      correction) IS ROUGHLY 8x LARGER THAN THE ORDINARY CURVE'S
      (0.309 SE). Both curves "pass" Stage 1's loose 3-SE gate (designed
      to catch gross construction failures, not to certify comparable
      precision), but the Red Team notes a 2.4+ SE single-curve deviation
      is, under the record's own normal approximation, a roughly 1.5%
      two-sided tail event on its own -- notable, though NOT dispositive
      given the "look-elsewhere" effect across the many curves this
      lane's experiments have now constructed (the Red Team's own
      explicit caution against over-reading this in isolation). The
      Validator separately flags that Stage 1's per-curve CM deviation
      and Stage 2's between-curve comparison are NOT independent lines of
      evidence -- both are computed from the same four raw counts, and a
      difference-of-Z-scores recombination (independently computed,
      Z_cm - Z_ord = 1.935, two-sided p~=0.053) lands in the identical
      borderline region as both. Citing Stage 1's pass and Stage 2's
      non-significance as two separately corroborating facts risks
      double-counting one underlying signal; this record treats Stage 2's
      p=0.066 as THE primary statistic, with Stage 1's per-curve numbers
      as diagnostic context only.
    - >-
      A GENUINE, RECURRING, PREVIOUSLY-UNDISCLOSED PROCESS GAP: THIS
      COORDINATOR'S OWN HYPOTHESIS CONVERSION INHERITED A STALE,
      ALREADY-SUPERSEDED HEURISTIC CHARACTERIZATION. Both reviewers
      independently found that the "tautological dual-convention control"
      disclosed in this run is NOT a new discovery -- it is the identical
      mathematical fact already established in this lane by
      EXP-MONO-12ce1c's own Red Team report (OBJ-6), which
      H-MONO-45183a's OWN status_note already cites when it says Part B
      was "rescoped to the transversal sampling convention actually used
      (its own sign-convention control was empty by implementation)."
      Neither implementation.md nor execution_report.yaml for
      EXP-MONO-64aaa4 cites OBJ-6 or EXP-MONO-12ce1c's report anywhere --
      this Coordinator, when converting IDEA-20260831-d29a71 into
      H-MONO-1d50ac, cited H-MONO-45183a's own H1/HEUR-COIN-1 text
      unmodified without checking that hypothesis's OWN status_note for a
      relevant, already-recorded correction. H-MONO-1d50ac's H1 has been
      corrected in place (additive note, per immutability discipline;
      original text retained) to cite this precedent. MORE
      CONSEQUENTIALLY: OBJ-6 did not stop at diagnosing the tautology --
      it MEASURED the actual discriminating axis (transversal vs.
      genuinely group-uniform sampling), finding a real ~2x (not o(1/N))
      effect at m=4, because transversal sampling structurally forces the
      singleton-branch probability to exactly 0, which is the exact
      load-bearing assumption behind B-2's own 6(tau-1)/N formula. This
      run never applies that already-known-discriminating control to
      EITHER matched curve, despite it being directly on point for this
      record's own completeness question.
    - >-
      TWO MINOR, GENUINELY NEW DOCUMENTATION DEFECTS, BOTH INDEPENDENTLY
      DISCOVERED, NEITHER AFFECTING ANY MEASURED VALUE. (1) The Validator
      found the execution_report's headline "2.424 SE" figure for the CM
      curve's deviation independently recomputes, via exact Fraction
      arithmetic from the same raw counts and the same SE formula, to
      2.427 SE -- a small, real, reproducible discrepancy, not a rounding
      artifact reproducible by any alternative defensible formula. (2)
      The Red Team found implementation.md's own worked example of its
      role-string convention ("e.g., 'cm1728'") does not match what the
      code actually computes ("cmj1728", because the code overwrites
      curve_cm["j"] with a string label); following the disclosed prose
      literally reproduces a WRONG number (662 instead of 681), resolved
      only by reading the actual source. Both are disclosed for
      correction in any future citation; neither changes the archived
      numbers, which both reviewers independently reproduced correctly
      from the raw data regardless.
    - >-
      BOTH REVIEWERS NAME THE IDENTICAL, CHEAP, CONCRETE NEXT ACTION,
      REACHED INDEPENDENTLY VIA DIFFERENT REASONING PATHS: extend Stage
      1-2's measurement to the already-constructed >=100 cross-prime
      matched-(N,tau) cells sitting in the archived stage0_transcript.json
      (curves already built; ~4s of Stage-1/2 compute per cell observed
      in this run, so the full extension is on the order of minutes, not
      hours), AND apply EXP-MONO-12ce1c OBJ-6's own already-validated
      transversal-vs-group-uniform discriminating control to both
      matched curves at p=617. Together these would (a) convert an n=1
      point estimate sitting near a significance threshold into a
      genuine multi-cell distribution, supplying the missing null-object
      baseline for "how often does a single cell land this close to
      significance by chance alone," and (b) test the actual axis
      (transversal-sampling-artifact magnitude vs. endomorphism ring)
      this record's own completeness question turns on, rather than the
      already-known-tautological sign-convention axis it happened to run.

