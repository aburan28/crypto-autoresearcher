  proof_refs:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-003/tasks/TASK-20260728-010/mechanism_candidates.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-003/tasks/TASK-20260728-010/mechanism_hunt_note.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-003/tasks/TASK-20260728-011/debt_discharge_report.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-003/tasks/TASK-20260728-011/independent_check_note.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-003/tasks/TASK-20260728-011/KN-TECH-058-draft.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-003/reviews/TASK-20260728-013/red_team_report.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-003/reviews/TASK-20260728-013/falsification_review.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-003/archives/TASK-20260728-012/snapshot_commit_receipt.json
  authoritative_artifacts: >-
    The BATCH-002 authoritative baseline is unchanged and remains
    coordination/goals/GOAL-SSI-001/batches/BATCH-002/tasks/TASK-20260728-009/baseline_recommendation_v2.yaml.
    BATCH-003 adds no baseline figure of its own. The reviewed producer package
    is bound by commit b978f883d5b2f1cbb45e138fb190c166862162ff, whose parent,
    reachability, exact five-path changed set and five SHA-256 digests were
    recomputed and matched by the independent reviewer RT-20260728-013 (gate
    R7). That reviewer did NOT verify the receipt's pushed_to_origin or
    ran_alone claims, and this Coordinator session has no shell and verified
    nothing itself.
  observations:
    - >-
      S1, THE BATCH'S SCREENING INSTRUMENT, HOLDS AS A CONDITIONAL TRANSFER
      LEMMA AND IS INDEPENDENTLY RE-DERIVED. In the Wesolowski architecture
      (Algorithms 1 to 3 of inputs/P13-WESOLOWSKI-2026/paper_fulltext.md),
      replacing Theorem 1.5's degree bound by a rigorous bound p^{beta} valid
      for EVERY supersingular E and sizing X as B^{1/2}p^{beta/2} gives expected
      time and memory p^{beta+o(1)}. The time exponent EQUALS the structural
      degree-bound exponent one for one and there is NO SECOND CHANNEL: the
      reviewer looked for one and found none, checking that the inverse-success
      factor depends on beta only through u and moves favourably as beta falls,
      that the modular-polynomial cost B^{O(1)} is beta-independent, and that no
      additive p^{Omega(1)} term dominates a smaller table. Bookkeeping is
      per-attempt cost times inverse success probability throughout. At
      beta = 1/3 it reproduces the archived headline. CONDITIONAL on the
      restated smoothness heuristic C1-H1, whose random-model transfer is the
      acknowledged weak point: the smallest isogeny degree is a MINIMISED,
      structured quantity, not a uniformly random integer.
    - >-
      CANDIDATE C1 IS UNDECIDED AND ITS DECISIVE INGREDIENT WAS NOT LOCATED.
      Replacing Theorem 1.5's bound with beta below 1/3 would move the
      conditional time tier one for one by S1. Reference [4] of the archived
      text, the source of Theorem 1.5 and the single load-bearing ingredient of
      the whole p^{1/3} result, WAS NOT IDENTIFIED: three web searches and two
      fetches, one of which returned HTTP 403, all recorded as attempts with
      their outcomes. Its proof technique, its tightness status and whether its
      authors conjecture an improvement are UNKNOWN to this program. C1 is
      therefore a research direction, not a mechanism, and its novelty status is
      unverified. It inherits the disclosed superpolynomial o(1) unchanged, so
      even a success would lower an exponent nobody can evaluate at realisable
      p.
    - >-
      C1'S RANKING IS UNDERCUT BY THE BATCH'S OWN TOOLKIT, AND THIS IS THE
      SHARPEST FINDING OF THE REVIEW (objection O8). The screen applied
      Eichler-type Hurwitz class-number sums to REJECT C4 and never turned the
      same machinery on C1, where it points AGAINST the candidate: composing a
      degree-m isogeny E to E^{(p)} with the dual of Frobenius yields an
      endomorphism of degree m*p, and requiring the count of pairs (E, alpha)
      with deg alpha at most N to cover all Theta(p) supersingular curves gives
      N of order p^{4/3}, that is beta of order 1/3. ON THE COUNTING HEURISTIC
      beta = 1/3 IS ESSENTIALLY TIGHT. That is C1's own falsification condition
      1 arriving from the artifact's own toolkit at zero compute rather than
      from the reference that could not be retrieved. WHAT THIS IS NOT: it is a
      sketch, not a completed sum, and it is a counting heuristic applied to a
      MINIMISED structured quantity, which is the same random-model-transfer
      failure mode that makes C1-H1 doubtful and which cuts both ways. C1 is NOT
      dead and beta = 1/3 is NOT proved optimal.
    - >-
      C2 IS REJECTED BY DERIVATION, INSIDE ONE NAMED FAMILY, AND THE DERIVATION
      WAS RE-DERIVED INDEPENDENTLY. Enlarging the single target E^{(p)} to the
      family of curves within degree K of it cannot help: minimality gives
      D_K at least D_1/K, so the cost Theta(K^2)*B*D_K is at least
      Theta(K)*B*D_1 and K = p^{delta} RAISES the exponent to 1/3 + delta. The
      reviewer re-derived the inequality, confirmed it survives the cyclicity
      worry, and tested the sharing evasion the artifact names as its own
      falsification condition: one enlarged list from E^{(p)} sits inside a
      radius-K*X neighbourhood of size Theta((KX)^2), the same K^2X^2. SCOPE,
      WHICH TRAVELS WITH THE RESULT: rejected for COMPOSE-WITH-A-SMALL-ISOGENY
      families only. Families defined by a different structural relation, such
      as higher-dimensional Kani constructions or Galois conjugates over a
      larger field, are NOT covered and nothing is declared impossible.
    - >-
      C4'S DIRECT TRANSFER IS REJECTED BY A STRUCTURAL DEGENERATION, AND THE
      DEGENERATION EXPLAINS THE SOURCE'S OWN SAFE LINE. For E with a model over
      F_p the Frobenius conjugate E^{(p)} is isomorphic to E, so the smallest
      isogeny E to E^{(p)} has degree 1 and the endomorphism the architecture
      returns is the Frobenius pi, which lies in the a-priori-known Z[pi]. The
      mechanism recovers NOTHING beyond the known suborder on the whole F_p
      locus. This is a genuine structural explanation of the archived text's own
      line-35 statement that group-action constructions like CSIDH are safe from
      the attack, rather than a restatement of it, and it says the same about C1
      even if C1 succeeds. It is labelled very likely folklore and is recorded
      only because it is absent from the corpus. The repaired transfer, seeking
      the smallest endomorphism outside Z[pi], is screened UNLIKELY on a
      counting estimate the producer labels unverified three times and which
      this record does not adopt as a derivation.
    - >-
      C3 IS UNDECIDED AND ITS FLOOR LEMMA S3 EXPLAINS A COINCIDENCE. For a
      recognizable, walkable subgraph W the Delfs-Galbraith-type mechanism costs
      p^{1+o(1)}/|W| plus |W|^{1/2+o(1)}, minimised at |W| = p^{2/3} with value
      p^{1/3+o(1)}. Both consistency checkpoints reproduce under independent
      re-derivation: |W| = p^{1/2} returns p^{1/2}, and an F_p-rational input
      returns p^{1/4} because the hitting term vanishes. S3 therefore explains
      why the heuristic-conditional frontier and the optimum of an entirely
      different mechanism are BOTH 1/3. C3 would BEAT the unconditional tier
      (1/2 to 1/3) and only TIE the conditional one, and BOTH HALVES MUST BE
      QUOTED TOGETHER. Its distinct value is that it is the ONLY candidate
      screened that escapes the disclosed superpolynomial o(1) rather than
      inheriting it: p^{1/3}(log p)^{O(1)} dominates p^{1/3+o(1)} with a
      superpolynomial o(1) at every realisable p.
    - >-
      TWO SCOPE DEFECTS ATTACH TO C3 AND ARE RECORDED RATHER THAN REPAIRED
      HERE. (a) Objection O9: the unchecked-recollection label on C3's
      orientability-hardness blocker holds in the prose fields but NOT in
      screen_verdict, which reads LIVE_BUT_BLOCKED_ON_A_KNOWN_HARD_SUBPROBLEM
      and whose token KNOWN_HARD asserts a literature fact the artifact
      elsewhere disclaims. The recommendation leans on that recollection twice.
      The new_attack_mechanism flag is ROBUST regardless, because C3 can at best
      tie and a tie is not a detection; the C1-over-C3 RANKING is not robust.
      (b) Objection O11, a cross-artifact catch available only to a reviewer
      reading both packages: S3 charges the hitting cost as REJECTION SAMPLING,
      and the sibling task's own RC4 retrieval quotes Delfs-Galbraith offering a
      steered alternative, a depth-first search through all short paths from
      E_0. If a directed search reaches W below p/|W|, the V-shape and its 1/3
      floor both move. S3 lists a cost-model error as a falsification condition
      but does not name this evasion.
    - >-
      LEMMA 4-PRIME(b): CONCLUSION CONFIRMED, PROOF REFUTED AS WRITTEN,
      REPLACEMENT SUPPLIED AND INDEPENDENTLY CHECKED INCLUDING THE CASE MOST
      LIKELY TO FAIL. The BATCH-002 erratum argued that each covered point's
      side bit is independent of the colliding endpoint; that is FALSE, since
      with y = h(u) the endpoint g(y) is the walk endpoint from E_{b(u)} and so
      is a function of the side bit. The conclusion survives by UNIFORMITY
      ACROSS CONDITIONINGS rather than by independence: conditioned on each of
      the four side configurations the pairwise endpoint-collision probability
      is the same (1 plus or minus o(1))/n_V, so Bayes returns the prior and
      rho = 1/2 - o(1). The reviewer re-derived the L2 input, the Bayes step,
      the prior under the PRF model, AND the diagonal configuration where it
      expected the argument to break, where Cauchy-Schwarz is unavailable and
      the quantity is 1/n_V + ||e||_2^2 - it does not break. CONSEQUENCE:
      THE MEMORY-INDEPENDENCE CONCLUSION OF THE BATCH-002 ERRATUM STANDS ON THE
      ARGUMENT SUPPLIED IN TASK-20260728-011 AND RE-DERIVED IN
      TASK-20260728-013, AND NOT ON THE ERRATUM'S OWN ARGUMENT.
    - >-
      O6, A CIRCULARITY THAT CHANGES A DEPENDENCY LABEL AND IS NOT INHERITED
      QUIETLY. The replacement argument for Lemma 4-prime(b) CONSUMES THE L2
      BOUND, which is exactly the substitution the same discharge's objection O1
      shows is NOT licensed by the numbered heuristic H1-prime, a
      total-variation statement. The discharge nevertheless recorded control RC8
      with blocks reading Nothing. THAT IS WRONG AND IS CORRECTED HERE: RC8 is a
      PRECONDITION OF THE VERY CONCLUSION THE DISCHARGE PRESERVED. The correct
      label for memory independence is: STANDS, CONDITIONAL ON THE L2 SPECTRAL
      BOUND, which is proved inside the erratum's own section 2.1(i) but is NOT
      the numbered heuristic that three downstream lemmas cite. RC8 is carried
      as a LIVE GATE, not as a cosmetic restatement, and its blocks field must
      read that it blocks the L2 step of the Lemma 4-prime(b) replacement and
      hence memory independence as currently supported.
    - >-
      D1 IS CONFIRMED AND CORRECTLY DOWNGRADED TO BOOKKEEPING. At the restated
      sizing the cross-side claw count satisfies C = omega(M) and not
      C = Theta(M), so RT-20260728-007's note_on_lemma_4_robustness is wrong on
      its repaired-regime half and right on its near-bijective half. Both the
      discharge and the reviewer re-derived it. BUT NOTHING DOWNSTREAM CONSUMES
      C: the erratum's framing of D1 as its one substantive disagreement
      overstates the stake, and the genuinely load-bearing item was Lemma
      4-prime(b), which no session had checked until this batch. A discharge
      that self-downgrades its predecessor's headline disagreement and then
      names the unchecked item as the real one is behaving correctly, and the
      reviewer found no self-serving asymmetry in its verdicts.
    - >-
      TWO FURTHER HEURISTIC-INVENTORY DEFECTS, EACH WITH A PEN-AND-PAPER
      COUNTEREXAMPLE RE-DERIVED INDEPENDENTLY. O1: H1-prime is numbered as a
      total-variation statement but consumed as an L2 statement by three
      downstream steps. The counterexample costs a sheet of paper - mass
      1/n_V + p^{-1/4} on one vertex has total-variation distance p^{-1/4},
      satisfying H1-prime as numbered, yet collision probability Theta(p^{-1/2}),
      inflating the count by Theta(p^{1/2}). O2: the descent hitting probability
      needs eps greater than 1/2, not greater than 0, since the error term
      sqrt(S)*||e||_2 = polylog*p^{-1/4-eps/2} must be o(p^{-1/2}). NO EXPONENT
      MOVES on either, since the walk length stays Theta(log p); both are
      quantifier and inventory defects, and O2 is the second time in two batches
      that a fixed quantifier was reintroduced one section later.
    - >-
      RC4 IS PARTIALLY CLOSED WITH A FINDING THAT CONTRADICTS THIS PROGRAM'S OWN
      ERRATUM, AND THE CONTRADICTION WAS RECORDED BY THE SESSION THAT FOUND IT.
      The retrieved descent is ONE LONG RANDOM WALK from each endpoint, run
      until it hits a supersingular curve defined over F_p, NOT the erratum's
      restart form, so the erratum's restart repair is an IN-REPO SUBSTITUTE
      rather than what the authors do. Two limits travel with this. First,
      objection O10: what was retrieved is ar5iv's rendering of arXiv:1310.7789,
      so the finding is sound for the arXiv version and UNVERIFIED for the
      published DCC version. Second, it licenses NO claim that Delfs-Galbraith
      is wrong. The quantitative inner-search memory figure and the
      F_p-rationality criterion were NOT obtained, and RC4 stays OPEN.
    - >-
      O5, A SOURCING DEFECT STRONGER THAN THE ONE PREVIOUSLY RECORDED. Two
      retrievals under the identifiers KN-LIT-078 lists returned TWO DIFFERENT
      ABSTRACTS, one containing no p^{1/4} figure at all, while KN-LIT-078
      relays its p^{1/2} and p^{1/4} figures FROM the abstract. Every F_p figure
      in this program is therefore relayed from a source that is not stable
      across its own identifiers. NO LABEL IS DOWNGRADED AND NO RANKING MOVES:
      the direction of the discrepancy is unknown, the likeliest explanation is
      an unverified arXiv-versus-DCC version difference, and absence of a stable
      source is not evidence the figure is wrong. The honest repair is the
      marker contested_across_retrievals ALONGSIDE relayed_from_abstract
      wherever the figure is quoted, which is applied in KN-TECH-058 and is
      carried as control RC14 for KN-LIT-078 and the BATCH-002 v2 record.
    - >-
      RC5 FAILED ENTIRELY AND THE FAILURE IS THE CLEANEST SOURCING DISCIPLINE IN
      THE BATCH. Five attempts returned nothing of Wiener's own text: two parse
      errors naming a Content-Length versus Transfer-Encoding conflict, a 303
      redirect to a paywall authorization endpoint, and one retrieval that WAS
      opened, identified as a 2013 student seminar slide deck, and DISCARDED
      rather than cited. A search-engine summary restating the exponent was
      refused as not the paper, and a fetch summariser's inferred storage figure
      was identified as an inference and not adopted. Nothing was reconstructed.
      RC5 stays OPEN in its entirety.
    - >-
      KN-TECH-058 IS ADMITTED INTO THE CORPUS, ON A FULL LOCATOR CHECK RATHER
      THAN A SPOT-CHECK. The independent reviewer re-extracted ALL THIRTEEN
      cited lines of the archived primary text itself and matched every
      quotation verbatim, including the van Oorschot-Wiener interpolation buried
      in the tail of a roughly 950-character line and the one clause that could
      plausibly have been an unsourced addition. KN-TECH-029 is superseded under
      a NEW id and is NOT edited. This is a CORPUS-CURRENCY SUPERSESSION SOURCED
      TO ARCHIVED PRIMARY TEXT, not a KN-FIND promotion of an internal finding.
    - >-
      COMPLETION FLAG. new_attack_mechanism_detected is FALSE, now reached
      independently in FOUR sessions across two batches, the reviewer stating
      explicitly that it reached the verdict on its own reasoning rather than by
      deferral. THEREFORE BATCH-003 SATISFIES NO GOAL-SSI-001 COMPLETION
      CRITERION. Criterion 1 fails because nothing materially improves a matched
      baseline and no exponent moves. Criterion 2 is not met by a review that
      found no surviving mechanism to verify. Criterion 3 is this archive, which
      asserts no success. Nothing was manufactured to satisfy a completion
      route, and the reviewer states independently that no BATCH-003 output
      could satisfy one.
    - >-
      DECLARED-VERSUS-COMMITTED INTEGRITY NOTE, RECORDED RATHER THAN SILENTLY
      RECONCILED BECAUSE THIS CAMPAIGN HAS ONE GOAL PERMANENTLY UNRENDERABLE
      FROM EXACTLY THIS MISMATCH. The BATCH-003 opening and the dispatch queue
      declared_commit_sets pre-registered that TASK-20260728-014 commits EIGHT
      paths if review gate R2 returns ADMIT and SIX otherwise. R2 RETURNED
      ADMIT, and the executing card nevertheless declares SIX. SIX IS WHAT IS
      COMMITTED. The delta is exactly the two TASK-20260728-013 review paths,
      reported to the archiving session as ALREADY COMMITTED SEPARATELY, so that
      re-declaring them would make the declared set differ from what this commit
      actually changes - the same reduction, for the same reason, as BATCH-002's
      ledger archive, which declared six and committed four. THE DEVIATION
      REDUCES SCOPE AND DOES NOT EXPAND IT, both knowledge/ paths are present as
      the ADMIT branch requires, and no path outside the declared six is staged.
      WHAT IS NOT ASSERTED: this session has no shell, ran no git command and
      made no commit, so it did NOT verify that the two review paths are
      committed; and the queue's own rule that a path-set reduction be preceded
      by a recorded QUEUE-AMEND entry was NOT satisfied - amendment_records in
      the BATCH-003 queue is empty, the queue is deliberately outside every
      archive's declared paths, and this ledger record is therefore where the
      reduction is recorded instead of there.
  inference: >-
    Accept BATCH-003 at the derivation-and-literature tier as a BOUNDED SCREEN
    that detected no attack mechanism, produced two scoped negative results with
    displayed derivations, converted one carried debt item from unreviewed into
    confirmed-on-a-replaced-proof, and promoted one corpus-currency correction.
    Do NOT read it as a rejection of any direction: C1 and C3 are UNDECIDED, the
    rejections of C2 and C4 are scoped to named families and were reached inside
    one bounded screen on a single model lineage, and no hypothesis record
    exists to move. The decision-relevant residue is threefold. First, RC8 is
    upgraded from cosmetic to a LIVE GATE by O6, because the preserved
    memory-independence conclusion now rests on a statement absent from the
    numbered heuristic inventory. Second, RC11 - completing the Eichler/Hurwitz
    count for the F_{p^2} case - is the cheapest decisive gate the batch
    produced, it costs one pen-and-paper session, and it can settle C1's premise
    more cheaply than a retrieval that has now failed twice; if it lands at 1/3
    it converts S1 from a lever into a BARRIER capping the whole architecture at
    p^{1/3+o(1)}, which the screen itself names as the valuable outcome. Third,
    the C1-over-C3 ranking is NOT supported by the record as it stands, since it
    leans on an unrun count that disfavours C1 and an unverified recollection
    that disfavours C3. Under docs/target-result-profile.md rule A1 nothing here
    is target-class, and no asymptotic-complexity claim approaches supported:
    all four promotion gates are unmet by a batch that computes nothing.
  boundaries:
    - >-
      Zero curve computation, zero runs, zero experiments. No empirical claim at
      any tier or scale. The batch names no prime, no curve, no field size and no
      parameter set, so nothing here may be quoted as validation at any scale and
      nothing establishes concrete bit security for any deployed system.
    - >-
      Every p^{1/3+o(1)} figure is CONDITIONAL on Heuristic 1 of
      inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, which this program has
      neither validated nor challenged and holds no evidence bearing on, and
      sits above an o(1) the source's own authors disclose as superpolynomial.
      Dropping that qualifier downstream is a claim-tier violation.
    - >-
      S1 is conditional on the restated smoothness heuristic C1-H1; S3 is
      conditional on H1-prime; the Lemma 4-prime(b) replacement is conditional on
      the L2 spectral bound and on the PRF model for h. None of these is
      validated, no validation experiment is scheduled, and toy-scale sampling
      would validate none of them at cryptographic scale.
    - >-
      S2 and S3 are SCOPED SCREENS INSIDE NAMED MECHANISM CLASSES, never
      impossibility claims. S2 covers compose-with-a-small-isogeny families only.
      S3 bounds one mechanism class under a rejection-sampling cost model and
      must never be quoted as a general lower bound on path-finding.
    - >-
      The memory-independence line concerns a construction THIS REPOSITORY
      specified: the side bit b is a design element of the BATCH-002 erratum's
      own Algorithm 2, not a property of any published algorithm. Confirming
      Lemma 4-prime(b) confirms internal consistency of this repository's
      construction and says nothing about Delfs-Galbraith, about the archived
      source, or about any deployed scheme. The 1/2 factor is the one standard
      van Oorschot-Wiener already loses to the same device.
    - >-
      A theorem that a resource does not help is a NEGATIVE result about
      attacks, not an attack mechanism. Nothing in BATCH-003 beats or matches a
      baseline and nothing claims to.
    - >-
      Candidates were admitted on the TIME exponent ONLY, by the frozen card. No
      candidate here has been shown admissible on FULL COST, and no downstream
      record may read as if one had.
    - >-
      Scoped to the surviving supersingular assumptions named in the card:
      endomorphism-ring and path-finding over F_{p^2} at unrestricted degree, and
      the F_p and CSIDH class-group lane through C4's degeneration only. The
      SIDH/SIKE torsion-image setting was never a target. Nothing here closes
      CGL, SQIsign, CSIDH hardness, KN-OPEN-013, KN-OPEN-014, KN-OPEN-015, or
      any quantum question.
    - >-
      Four lanes were NOT screened and no verdict of any sign is offered on
      them: higher-dimensional Kani and superspecial-abelian-surface mechanisms
      (the one lane with a demonstrated record of collapsing an isogeny exponent,
      and the most likely home of a family evading S2's scope), quaternion-side
      and Deuring-correspondence mechanisms, index-calculus relation collection
      for the CSIDH class-group action, and quantum mechanisms of any kind.
  unresolved_confounds:
    - >-
      RC8 IS A LIVE GATE, NOT A RESTATEMENT. Per O6, memory independence stands
