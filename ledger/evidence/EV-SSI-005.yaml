    parameter set or deployed system. Under docs/target-result-profile.md rule
    A1 NOTHING IN BATCH-003 IS TARGET-CLASS.
  certificate_refs: []
  proof_status: derivation
  proof_status_basis: >-
    Every adverse or scoped-negative statement below rests on algebra displayed
    in place in an archived artifact and independently re-derived by a
    non-originating session, not on an empirical_only basis and not on a
    counterexample certificate. The two pen-and-paper counterexamples in the
