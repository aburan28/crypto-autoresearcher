evidence:
  id: EV-SSI-005
  hypothesis_id: IDEA-20260725-001
  hypothesis_id_basis: >-
    STRUCTURAL ANCHOR ONLY, AND NOT A CLAIM THAT THIS RECORD BEARS ON THAT
    IDEA. The evidence schema requires a non-null hypothesis_id and NO H-SSI-*
    hypothesis record exists; IDEA-20260725-001 remains at idea stage and its
    premise was closed on its exact tested scope by EV-SSI-004, which BATCH-003
    neither revisits nor reopens. The substantive anchor of this record is
    RQ-SSI-001 through GOAL-SSI-001 BATCH-003. Nothing here supports, weakens,
    or contradicts IDEA-20260725-001.
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  batch_id: BATCH-003
  experiment_ids: []
  run_ids: []
  run_ids_basis: >-
    EMPTY BY CONSTRUCTION, NOT BY OMISSION. BATCH-003 was a zero-compute
    mechanism screen with a zero-compute debt discharge and a zero-compute
    review. No experiment was designed, approved, or executed; no isogeny was
    evaluated, no j-invariant computed, no graph sampled, no curve touched. All
    three producing sessions (TASK-20260728-010, TASK-20260728-011,
    TASK-20260728-013) independently record curve_compute_performed false. There
    is therefore no run to cite, and no empirical claim at any tier arises from
    this record.
  type: theoretical
  direction: neutral
  direction_basis: >-
    NEUTRAL, AND THE NEUTRALITY IS ITSELF THE FINDING. There is no hypothesis
    record for this evidence to support or weaken, and the batch moved no
    exponent in either direction: two candidates were rejected by derivation
    inside named families, two remain undecided, and the one preserved
    conclusion carried in from BATCH-002 (memory independence) stands on a
    DIFFERENT argument than the one that was archived for it. Recording this as
    supports would overstate a screen that detected no mechanism; recording it
    as weakens would enact an adverse transition on a single unreplicated
    single-model lineage, which the Coordinator contract forbids.
  strength: preliminary
  strength_basis: >-
    CAPPED IN ADVANCE AND CAPPED AGAIN ON THE RESULT. (1) MODEL INDEPENDENCE WAS
    UNAVAILABLE, pre-registered as a cap by the BATCH-003 opening and by the
    dispatch queue model_independence_record: the adapter resolves
    review-adversarial to claude-opus-5 on the anthropic backend and REFUSES the
    distinct model glm-5.2 on the zai backend, whose binding ceiling is high
    against a policy requiring xhigh and whose credentials are unset. Producer,
    discharge session and reviewer all self-report claude-opus-5, none ran an
    adapter probe, and every session records model_verified false. This is the
    FIFTH consecutive GOAL-SSI-001 session on one self-reported model identity.
    EV-SSI-005 may not exceed preliminary on this ground alone. (2) The
    independent reviewer did NOT read the BATCH-002 source artifacts; its checks
    of Lemma 4-prime(b), D1, O1 and O2 ran against the DISCHARGE'S RESTATEMENT,
    so a misquotation of the erratum would not have been caught, and the
    reviewer names this as the most important limitation of its own review.
    (3) One independent review was commissioned, not two, and no validator ran.
    (4) The decisive external ingredient of the batch's highest-ranked candidate
    was searched for and NOT located.
  claim_tier: theory
  claim_tier_basis: >-
    Theory, derivation and literature. TOY-FREE IN THE STRICT SENSE: the batch
    names no prime p, no curve, no field size, no parameter set and no instance
    of any kind, so the toy-medium-crypto ladder does not apply at all rather
