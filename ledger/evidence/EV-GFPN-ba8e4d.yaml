  narrowed_statement_N1: >-
    For EcGFp5 (y^2 = x(x^2 + 2x + 263z)) and EcMasFp5 (y^2 = x^3 + 3x + 8z^4)
    over F_p[z]/(z^5 - 3), p = 2^64 - 2^32 + 1, EXP-GFPN-726eb2 (RUN-GFPN-b71f2f,
    RUN-GFPN-3bbef2) produced certificate-bearing values, independently
    re-derived, for:
    - the group order and cofactor (2 and 1);
    - the MOV embedding degree ((n-1)/5, n-1);
    - the CM discriminant (|D| 322 bits, fundamental, conductor 1, for both);
    - the quadratic-twist factorisation and twist rho cost (120.6583 and
      101.9321 bits);
    - a re-enumeration of each published parameter search, in which the
      published curve is the first acceptable candidate and every predecessor
      carries a rejection witness.
    It also produced provenance tags for eleven published figures. The
    self-reports reproduce except EcMasFp5's "323 bits" CM bit length, which
    recomputes to 322; the integer D reproduces exactly.

  inference: >-
    The certified values in N1 stand independently of the producer's
    instrument, labels and control. The audit TABLE as committed is not a
    SafeCurves-style verdict instrument: its PASS labels mean "computed with a
    certificate", it passes known-false curves, and its control did not
    exercise it. The hypothesis predicted coverage (all SafeCurves-style
    criteria) that the frozen contract never declared. What H-GFPN-ee4d45 can
    carry is N1, with the unexamined criteria named. That is a refinement, not
    a support of the hypothesis as stated, and not a weakening: nothing
    contradicts the values or the certificate-regeneration mechanism.

  scope_sentence: >-
    Adopted verbatim from TASK-20260923-01af16 joint_J6, with the J2 rulings
    applied:
    "EXP-GFPN-726eb2 establishes, for EcGFp5 (y^2 = x(x^2 + 2x + 263z)) and
    EcMasFp5 (y^2 = x^3 + 3x + 8z^4) over F_p[z]/(z^5 - 3),
    p = 2^64 - 2^32 + 1, only: certificate-bearing values for the group
    order and cofactor, the MOV embedding degree of the prime-order
    subgroup, the CM discriminant and its fundamental discriminant, the
    quadratic-twist factorisation and its Pollard-rho cost, a re-enumeration
    of each published parameter search under the producer's reading, and
    provenance tags for eleven published figures, with the self-reports
    compared (one mismatch: EcMasFp5's '323 bits', recomputed 322). The
    audit tables' 'PASS' means 'computed with a certificate' (for
    rigidity: the published search's first hit equals the declared
    parameters); no SafeCurves threshold was applied. NOT examined: the
    SafeCurves field (the field is F_{p^5}, not prime), equation, base-point,
    ladder, completeness and indistinguishability criteria; the combined
    curve-and-twist cost for x-only ladders; extension-field transfer by
    Weil descent / GHS / Diem covers at n = 5, where the design note's cited
    k >= 11 theorem does not apply (IDEA-20260920-10547b, goal C3, open);
    summation-polynomial index calculus cost and the validity of the
    142-bit figure (EXP-GFPN-05ff43, C1); oracle-assisted static DH (C2);
    and whether either curve meets a 128-bit level. Affected: none -- this
    audit threatens no deployed system. Safe: none certified -- no system
    using EcGFp5 or EcMasFp5 may cite this audit as evidence of SafeCurves
    conformance or of 128-bit security."
    Coordinator additions:
    - J4 pinned the published search procedure verbatim from the frozen
      texts, so "under the producer's reading" is also the frozen reading.
    - The J2 rulings are applied: conductor 1 for both curves (not 2 for
      EcGFp5), and the EcMasFp5 cm row is FAIL under the frozen criterion.

  boundaries:
    - Curves -- exactly EcGFp5 and EcMasFp5 as published, over F_p[z]/(z^5 - 3), p = 2^64 - 2^32 + 1. Field -- F_{p^5} (320 bits). No other curve, prime or extension degree.
    - Metrics -- the nine declared primary metrics only. Six SafeCurves criteria (field, equation, base, ladder, complete, ind) and extension-field transfer at n = 5 are NOT examined; rho, MOV/anomalous transfer and twist are partial; no threshold is applied anywhere.
