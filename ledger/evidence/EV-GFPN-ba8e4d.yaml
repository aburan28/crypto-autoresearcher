    - Instances -- one deterministic audit per curve plus one control; seeds not applicable.
    - Nothing about attack cost, index calculus, the 142-bit figure's validity, OA-SDH, GHS/Diem covers, or any 128-bit claim.
    - Negative-result phrasing is not needed; no negative is asserted about either curve.
