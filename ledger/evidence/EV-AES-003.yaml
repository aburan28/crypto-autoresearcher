      count, is asserted by this record. No distinguisher, no key recovery, no
      speedup, no structural excess, and no barrier statement about AES.
    - >-
      Nothing here concerns full-round AES (10/12/14 rounds), AES-NI-deployed
      AES, or the security of any system that uses AES. Claim tier is toy /
      reduced-round, as ceilinged by RQ-AES-001 and GOAL-AES-001.
    - >-
      Group A's graph results are scoped to ONE object: the directed 1020-node
      (lambda,k) graph induced by the AES MixColumns circulant (02,03,01,01) over
      GF(2^8) modulo 0x11B, and its 2-step graph. Proposition 801-1 is scoped to
      its four stated hypotheses and says nothing about families that violate any
      of them; in particular (H1) requires the same map at all four word
      positions of a layer and (H2) requires deterministic propagation for EVERY
      state, and the two D-705-5 scope holes remain open and untouched. The
      constant 32 is an UPPER BOUND on survival length and is not shown tight.
      The identification of one interface Phi with one round is PROP-701-I's
      modelling convention carried over, established by nothing in this batch,
      and independently ruled OPTIMISTIC rather than conservative.
