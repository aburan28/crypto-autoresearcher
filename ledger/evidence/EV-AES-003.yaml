      Group A's gate is scoped to a GF(2^4) ANALOGUE with modulus 0x13, to the
      three 4x4 circulant matrices actually run (target (02,03,01,01), null_1
      identity, null_2 (01,01,01,06)) plus the validator's order-5 control
