      overturn. THE VALIDATOR ACCEPTED THE RULING AND DID NOT OVERTURN IT, on a
      basis it executed rather than assumed: amendment 002 imposes the stanza on
      "every declared SOURCE-CODE artifact" and a prose report is not source
      code; the covering manifest lists the report by path, kind, digest and an
      explicit covered_by_this_manifest_inference_block: true, stating
      comment_block_inference_stanza: false honestly rather than concealing it;
      and the validator recomputed the report's digest from the COMMITTED blob
      itself (bf238554...9df9, match). It named what would have overturned the
      ruling — a digest mismatch, a missing provenance entry, or amendment text
      quantified over "declared artifacts" rather than "declared source-code
      artifacts" — and found none of them. The ruling stands; the underlying
      per-artifact-class ambiguity in the card language remains and is carried
