    # ---- (A) OD-1, THE EXTENSION, AND THE REDESIGNED GATE ---------------
    - >-
      A-1 (scope statement, load-bearing). Observation group A is DERIVATION
      content plus one exhaustive toy-scale computation: the algebra of AES
      components, a 1020-node graph over GF(2^8), a proposition about projection
      families, and a falsification gate that runs entirely in a GF(2^4)
      analogue. IT IS NOT MEASUREMENT OF A CIPHER. Nothing in it is a
      cryptanalytic claim, a distinguisher, or a barrier statement about AES
      security, and it may never be upgraded into one.
    - >-
      A-2. THE DIAMETER IS EXACT AND INDEPENDENTLY RECOMPUTED. The directed
      1020-node (lambda,k) graph of verify_derivation.py claim C11 — nodes
      (lambda,k) for lambda in GF(2^8)* and k in {0,1,2,3}, edges (lambda,k) ->
      (lambda*M[j][k], j) with M the AES MixColumns circulant (02,03,01,01) —
      has forward diameter 30 and reverse diameter 30, radius 30, eccentricity
      distribution {30: 1020}, realizing pair (lambda=0x01,k=0) ->
      (lambda=0x84,k=0), and 0 ordered pairs with no path. The validator rebuilt
      the graph from its own GF(2^8) log/antilog tables (cross-checked against an
      independent shift-and-xor multiply on all 65536 ordered pairs, 65536/65536
      agreeing), took no code or constant from the producer, and recomputed the
      diameter by TWO independent algorithms — bitset frontier expansion from
      every node, and boolean-matrix powering of (I+A) with an additive binary
      search for the least all-ones power. NO DISCREPANCY OF ANY KIND.
    - >-
      A-3. THE UNIFORM ECCENTRICITY IS GENUINE AND FORCED, NOT A BFS ARTIFACT —
      and the validator supplied the reason the producer recorded only as an
      unexpected observation. It verified computationally over all 4080 edges
      that (lambda,k) -> (c*lambda, k) for c in GF(2^8)* and (lambda,k) ->
      (lambda, k+1 mod 4) are both graph automorphisms (the first because the
      edge rule is scalar-equivariant, verified at c = 0x03 which it confirmed
      primitive; the second because M is circulant, so M[j][k] = M[j+1][k+1]).
      Together they act TRANSITIVELY on all 1020 nodes, so the graph is
      vertex-transitive and radius = diameter is a THEOREM here rather than a
      coincidence. This is an addition to the producer's record, not a
      correction of it.
    - >-
      A-4. THE 2-STEP GRAPH AND THE GOVERNING CONSTANT. G^2 has diameter 16,
      radius 16, eccentricity distribution {16: 1020}, and a self-loop at every
      one of its 1020 nodes (because M[k+2][k]*M[k][k+2] = 01*01 = 1), so
      reachability in G^2 is monotone. The covering number n* — the number of
      G^2 steps needed for the four-node start set S0(mu,i) = {(mu*M[k][i], k) :
      k = 0..3} to cover all 1020 nodes, maximised over all 1020 starts — is 15,
      attained uniformly (distribution {15: 1020}), witness (mu=0x01, i=0). The
      validator recomputed n* = 15 itself and ruled the substitution of the
      covering number for the diameter CORRECT AND FORCED rather than convenient:
      global statements arrive only every two interfaces (Lemma 2), each further
      pair of interfaces advances a held node by one G^2 step (Lemma 3),
      reachability is monotone (Lemma 4, 1020/1020 self-loops measured
      independently), and the start set has four nodes rather than one. It could
      construct no reading of the derivation in which d = 30 on G is the
      governing quantity. 2 + 2n* = 32 stands. Non-tightness is recorded (R2):
      nothing shows 32 is tight, and no smaller constant is asserted.
    - >-
      A-5. PROPOSITION 801-1 FOLLOWS. Under hypotheses (H1) one map per layer
      applied at all four super-box word positions, (H2) deterministic
      propagation across each interface Phi = ARK.MC.SR for EVERY state, (H3)
      pi^(0) not injective, and (H4) L >= 2 + 2n* = 32, the conclusion is that
      pi^(L) is constant (indeed pi^(r) is constant for every r >= 32).
      Corollary 801-2: a genuinely lossy layer-dependent family survives at most
      31 consecutive interfaces. The validator worked Lemmas 1-4 and the
      Assembly step by step, as TASK-20260731-705 worked PROP-701-I's three
      steps, AND FOUND NO ERROR. The single point at which PROP-701-I consumed
      round-independence — re-applying Step 1 with the SAME pi at the next
      interface — is correctly located, and Lemma 2 replaces it with (H2) at
      that interface, a hypothesis the layer-dependent family is assumed to
      satisfy anyway: bookkeeping, not a new assumption, exactly as claimed.
    - >-
      A-6. THE PRODUCER DID NOT CONFLATE A GRAPH FACT WITH A STATEMENT ABOUT
      PROJECTIONS, and this is recorded plainly because it was the risk the
      snapshot receipt flagged. The small-diameter fact is never used as a
      statement about projections; it enters only through Lemma 3, which DERIVES
      an implication between invariance statements (A_r(lambda,k) => A_{r+2} at
      the G^2-successors) and then counts steps. The graph is a bookkeeping
      device for a derived implication, not a proxy for the object.
    - >-
      A-7 THE OPERATIVE OUTCOME OF THIS BATCH: PROPOSITION 801-1 IS IN-SCOPE
      VACUOUS. The independent ruling, in the validator's own words carried
      verbatim on its recommendation: the proposition "is true, correctly
      derived, and bites nowhere this campaign is looking". Corollary 801-2
      permits a lossy layer-dependent family to survive up to 31 consecutive
      interfaces; RQ-AES-001 scopes in-scope round counts to 3-7, which admit at
      most 7 interfaces, leaving a margin of 24 interfaces of untouched window.
      Every in-scope configuration lies strictly inside the permitted window, and
      would still do so if the scope were widened four-fold. The bound is also in
      the WRONG DIRECTION to be useful here: a result that mattered at 3-7 rounds
      would have to say lossy families die QUICKLY; this says they die
      EVENTUALLY, at a constant 4.5x outside the scope ceiling. THE PRODUCER DID
      NOT UNDERSTATE IT: residual R1 states it accurately, and the manifest field
      verdicts.od1_extension carries the same limitation in the same sentence as
      the "FOLLOWS", so there is no gap between the report's honesty and the
      manifest's. This is a REAL OUTCOME recorded as one and not as a null: OD-1
      is mathematically advanced and operationally unmoved, and anyone later
      citing Proposition 801-1 in support of a statement about 3-7-round AES
      would be citing a vacuous instance.
    - >-
      A-8. THE INTERFACE-TO-ROUND CONVERSION IS OPTIMISTIC, NOT CONSERVATIVE,
      AND A-7 IS ROBUST TO IT. Phi = ARK.MC.SR is exactly one AES round's linear
      tail, and there is one MixColumns per round, so two interfaces cannot be
      packed into one round: L interfaces costs at least L rounds under any
      consistent reading. The producer's 1 interface = 1 round is therefore the
      MOST FAVOURABLE possible conversion for the proposition, flagged as a
      modelling convention in R5 rather than asserted, which the validator judged
      adequate. Under any other defensible reading (e.g. tying Phi to the
      two-round super-box) 32 interfaces pushes further out, to ~64 rounds. 32 >>
      7 under every reading.
    - >-
      A-9. THE REDESIGNED GATE DISCRIMINATES, ON THE VALIDATOR'S OWN FROM-SCRATCH
      RE-RUN. GATE-701-C v2 runs exhaustively over all 65535 nonzero Delta in
      GF(2^4)^4. Readings, pre-registered then measured, and then independently
      re-measured: target circulant (02,03,01,01) predicted and measured
      65535/65535 reaching GF(2)-closure dimension 16, histogram {16: 65535};
      null_1 identity predicted and measured 0/65535, histogram {1: 65535};
      null_2 circulant (01,01,01,06) predicted 0/65535 at dimension <= 8 and
      measured 0/65535, histogram {8: 65535}, matching even the secondary
      "exactly 8" expectation with no slack. The three readings 16 / 1 / 8 are
      pairwise distinguishable QUALITATIVELY, not by a threshold, and each is
      uniform over all 65535 Delta. VOID-A, VOID-B, VOID-C and FAIL_ESCALATE all
      fail to fire on the producer's readings and on the validator's. The
      validator re-implemented the entire gate from scratch — its own GF(2^4)
      arithmetic cross-checked on all 256 ordered pairs, its own Gauss-Jordan
      rank, its own subgroup closure, its own SCC routine by pairwise
      reachability closure rather than Kosaraju, its own GF(2) echelon closure —
      and reproduced every figure exactly. This is now a THIRD independent
      implementation for target and null_1 and a second for null_2, which closes
      the producer's own checks_not_run item on that point.
      null_1's BATCH-002 predicted stall dimension of 4 is CORRECTED to 1; the
      correction is stated as a correction, the BATCH-002 record is left
      unedited, and the validator independently measures 1.
    - >-
      A-10 DEFECT V-804-1 (MAJOR, and it is the reason the closure stays
      withheld). THE GATE DISCRIMINATES BUT IT IS NOT AN INSTRUMENT FOR THE
      PROPERTY THE REDESIGN NAMES. The redesign's stated content is that null_2
      negates the NECESSARY ingredient of Step 3 — that the entries of M generate
      the whole multiplicative group, hence that the (lambda,k) graph is strongly
      connected. The validator built the null object NOBODY BUILT: the producer's
      own deterministic selection rule applied verbatim to the OTHER nontrivial
      proper subgroup of GF(2^4)* (order 5, {1,8,a,c,f}), yielding the first
      invertible circulant (01,01,01,08). That matrix has all entries nonzero, is
      invertible (rank 4), has entries in a PROPER subgroup, and its (lambda,k)
      graph is NOT strongly connected (3 SCCs of size 20) — and it reads
      65535/65535 at dimension 16, IDENTICAL TO THE TARGET. It would have fired
      VOID-A. Consequences, stated precisely: failure of strong connectivity does
      NOT move the gate reading, since three non-strongly-connected matrices read
      1, 8 and 16; the gate cannot isolate strong connectivity; and the property
      actually producing the stall is SUBFIELD CONFINEMENT — for H = GF(4)*, the
      set S = GF(4)*mu is closed under ADDITION as well as under H, trapping the
      GF(2)-closure inside S^4 of dimension 4*2 = 8, whereas for the order-5
      subgroup {0} u H is not closed under addition, there is no trap and the
      closure fills. That mechanism is exactly what the producer's own section
      0.3 hand argument names correctly, so this is a LABELLING-AND-ISOLATION
      defect, not a fabrication and not outcome selection. The validator adds the
      sharper statement: strong connectivity IS genuinely necessary to
      PROP-701-I's Step 3 as an argument step, but the GF(2^4) gate does not
      measure Step 3's graph spreading — it measures a GF(2)-span closure, a
      finer and different object, and spans can fill where the graph does not
      connect. The gate is a faithful instrument for the ENGINE'S OUTCOME, not
      for the ENGINE'S STATED HYPOTHESIS. DEC-20260731-025's precondition on any
      future reject_scoped of the round-independent single-word deterministic
      class is therefore ONLY PARTIALLY MET.
      COORDINATOR-SIDE CORROBORATION, labelled as such and NOT independent
      validation: this Coordinator independently confirmed that the entries {1,8}
      of the validator's order-5 null generate a subgroup of order 5, proper in
      the order-15 group with index 3 — exactly the 3 SCCs reported — and that
      both nulls are equally admissible under the producer's own rule.
    - >-
      A-11 DEFECT V-804-2 (minor, auditability not integrity), WITH ITS EXPOSURE
      RECORDED RATHER THAN SMOOTHED. The pre-registration ordering IS recorded in
