    - >-
      Z-6 RULING ON REFERRED DEFECT D-803-1 (low, coordination drafting).
      od1_and_gate_redesign_report.md carries a Provenance POINTER plus manifest
      digest binding rather than an in-text inference block, while its sibling
      prose artifact repair_report_er6.md carries a full in-text block. The
