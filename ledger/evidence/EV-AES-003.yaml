    - >-
      Z-5. SUPERSESSION AND IMMUTABILITY CONFIRMED. `git diff --name-status
      d4f7a7e0 HEAD` shows no BATCH-001 or BATCH-002 committed artifact modified
      in place — every entry is an addition except the coordinator ledger record
