  headline_non_result: >-
    THIS BATCH PRODUCED NO CRYPTANALYTIC RESULT AND NO CLAIM ABOUT AES OF ANY
    KIND, AT ANY ROUND COUNT. No distinguisher, no key recovery, no speedup, no
    measured structural excess, and no barrier statement about AES is asserted
    here. Zero cryptanalytic compute was spent on AES itself. What exists is:
    (A) an exact graph computation and a correctly derived extension of
    PROP-701-I to layer-dependent projection families, which an independent
    session ruled IN-SCOPE VACUOUS — true, correctly derived, and constraining
    nothing at the round counts this campaign studies; together with a
    redesigned falsification gate that DOES discriminate (16 / 1 / 8) but that
    an independent control shows is NOT an instrument for the property the
    redesign names, so DEC-20260731-025's precondition on any future
    reject_scoped is only PARTIALLY met and the closure stays WITHHELD;
    (B) a mutation-control instrument on which ER-6 is closed on its
    (key length x final_mix_columns) axis, verified by a fault the validator
    wrote itself and detected through an executed comparison that diverged, with
    the coverage boundary now machine-readable and claim C0 executing and
    passing; and (C) TWO NEW DEMONSTRATED FALSE GREENS produced by the
    independent validator on the repaired instrument, bringing the count to FIVE
    escapes across THREE repairs.

  strength_scoping: >-
    `replicated` is scoped STRICTLY to the items below, each of which a session
    that did not author it re-executed and, where applicable, recomputed by its
    own from-scratch implementation taking no code or constants from the
    producer: (A1) the (lambda,k) graph figures — 1020 nodes, forward and
    reverse diameter 30, radius 30, eccentricity distribution {30: 1020},
    realizing pair (0x01,0) -> (0x84,0), G^2 diameter and radius 16, 1020/1020
    self-loops in G^2, covering number n* = 15 uniform over all 1020 starts —
    recomputed by the validator under TWO independent diameter algorithms with
    no discrepancy; (A2) the three GATE-701-C v2 readings 16 / 1 / 8, each
    uniform over all 65535 nonzero Delta, now reproduced by a THIRD independent
    implementation; (A3) the null_2 construction facts (all entries nonzero,
    rank 4, entries generating the order-3 proper subgroup {1,6,7}, 5 SCCs of
    size 12 equal to the cosets of H); (B1) the ER-6 before/after, re-created by
    the validator from its own fault text and independently confirmed real by
    direct ciphertext comparison; (B2) the regression and coverage-boundary
    figures (212 executed comparisons, no-op undetected with 0 divergences on
    the pristine module, 25 generated cells, six non-empty (key length x fmc)
    cells); (B3) the D-705-2 diff and the 17 PASS / 0 FAIL / 0 SKIP re-run
    including C0; and (C1) the EXISTENCE of the two new false greens V-804-4 and
    V-804-5, each demonstrated on a module independently proved wrong by
    ciphertext comparison before the control was run. Five escape instances now
    exist across two independent sessions, which is what `replicated` attaches
    to for group C.
    It does NOT attach to: any claim about AES at any round count; the closure
    status of PROP-701-I, which remains WITHHELD (A-9); the generalisation that
    the class of false-green escapes is not closable by enumeration, which is a
    REASONED JUDGEMENT and not a proof of impossibility (C-4); the ER-8-restore
    conjecture, which is UNRESOLVED (C-3); or the ten-second pre-registration
    margin, which is self-attested and was not auditable from the committed
    bytes (A-11). Cross-model independence is unavailable throughout: both
    producers, the validator and the Coordinator resolve to the same model under
    inference-amendment 0137a051.

