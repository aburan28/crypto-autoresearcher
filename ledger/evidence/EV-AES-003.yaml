  # =====================================================================
  observations:

    # ---- (Z) EVIDENCE INTEGRITY -----------------------------------------
    - >-
      Z-1. The producer snapshot commit e2f8facb040009e92e1000769efe9659ee60494b
      (parent c114e51512e7033943f0a17bbacb1296932bc6a6) was verified against Git
