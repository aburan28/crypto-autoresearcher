  inference: >-
    Two findings, deliberately not merged, and a third that spans neither.
    (A) The campaign's only exponent-relevant lane advanced mathematically and
    did not move operationally. The diameter, the 2-step graph, the covering
    number and the vertex-transitivity that forces the uniform eccentricity are
    all exact and independently recomputed; Proposition 801-1 correctly extends
    PROP-701-I from round-independent to layer-dependent projection families
    with the explicit constant 2 + 2n* = 32 interfaces, better than OD-1's own
    ~2d = 60 estimate, and the single point at which round-independence was
    consumed is located and replaced by bookkeeping rather than by a new
    assumption. AND IT IS IN-SCOPE VACUOUS: the untouched window of 31 interfaces
    contains every in-scope round count 3-7 with a margin of 24, and the bound
    runs in the wrong direction for the regime this campaign studies. The
    redesigned gate DOES discriminate — 16 / 1 / 8, pre-registered, proved by
    hand before measurement, reproduced from scratch — but an equally admissible
    sibling null under the producer's own rule, negating the same named
    ingredient, reads identically to the target and would have voided the gate.
    So the gate is a faithful instrument for the engine's OUTCOME and not for its
    STATED HYPOTHESIS, DEC-20260731-025's precondition is only partially met, and
    the official scoped closure of the round-independent single-word
    deterministic class STAYS WITHHELD for the second consecutive batch. Controls
    before belief applies to closures, and it applies twice.
    (B) The instrument is repaired exactly where it was broken and is escapable
    exactly where nobody had looked yet. ER-6 is closed on its axis by an
    executed comparison that diverged, the regression is non-vacuous, the
    coverage boundary is machine-readable and matches the code, and C0 executes
    and passes — and in the same session the independent validator produced TWO
    NEW FALSE GREENS on the repaired instrument, one in a coverage cell that is
    empty by construction and one through an observability channel nobody had
    closed.
    (C) The count is now five escapes across three repairs, and the reason is
    structural: each repair closes one cell of an open-ended product of axes or
    one channel of an open-ended observation set, against an adversary model
    strictly stronger than the instrument. H-1 is a closed property and is met;
    H-3 as an enumeration is not meetable by an instrument of this design. That
    is a reasoned judgement supported by five measured escapes, not a proof, and
    it is recorded as such.
    NOTHING IN ANY OF THE THREE IS A CRYPTANALYTIC RESULT OR A CLAIM ABOUT AES AT
    ANY ROUND COUNT.

  boundaries:
