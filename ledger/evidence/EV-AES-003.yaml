      setting. IT IS NOT EVIDENCE ABOUT GF(2^8) AND CERTAINLY NOT ABOUT AES. Its
      discriminating reading licenses no closure: the property it discriminates
      on is subfield confinement, not the strong connectivity the redesign named.
    - >-
      Group B is scoped to mutation_control_v3.py as committed in e2f8facb, to
      the eight fault mutants, one no-op mutant and four injected failure probes
      actually run, to the 25 generated (key length x fmc x round count) cells
