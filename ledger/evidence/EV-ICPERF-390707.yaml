  independence_checker_result: >-
    `tools/check_review_independence.py` COULD NOT SERVE THIS ROUND WHEN IT RAN, AND
    THAT IS ITSELF A FINDING (O-11). The tool took exactly one `--plan` and had no
    notion of an addendum, so it held every task to the BASE plan's owners map, which
    predates the split. Run against the base plan it reported TASK-20260913-6c5729 as
    failing to claim joint V2 -- a joint the governing addendum had removed from it --
    and the mirror-image failures were reported against TASK-20260915-195b0c for
