  claim_tier: toy
  claim_tier_note: >-
    `toy`, and the tier is the point rather than a caveat on it. Every number is a
    solver measurement on 60 shipped instances over F_{2^15}, F_{2^17}, F_{2^19} at
    l <= 6 -- group orders 32494, 131174, 525086 -- on one 4-CPU host, six engine
    builds, two runs. No discrete logarithm is solved at any cryptographic
    parameter, no asymptotic exponent is claimed or moved, and nothing here says
    index calculus beats or loses to any generic attack on any curve. Under
    docs/claims-and-verification.md the strongest thing this record asserts is
    "these engines behaved this way on these instances", plus one certified
    classification (the twist reading of O-1) that carries its own verification.
