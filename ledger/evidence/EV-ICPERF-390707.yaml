  certificate_note: >-
    The 30 shipped S certificates are decomposition certificates re-verified
    independently: the reviewer's own GF(2^n) and binary-curve arithmetic, written
    from the curve equation and the shipped modulus before any producer code was
    opened, accepts 30/30 under LSB-first bit order and 0/30 under MSB-first, so
    the convention is settled by the data. The exhaustive V^3 enumeration is a
    stronger object than a certificate: for all 60 instances it decides root
    existence by enumeration rather than by trusting a solver, and it agrees with
    the run's SAT/UNSAT verdict on 60 of 60.
