  predictions_scored:
    P1_certificates_and_every_sat_answer_a_decomposition: >-
      FAILS AS WORDED; ITS STATED CONSEQUENCE IS DISCHARGED (O-1, O-2, O-15). The
      certificate half holds outright: 30/30 verify under independent arithmetic, and
      the bit-order convention is settled by the data rather than assumed. The second
      half -- "every SAT answer any engine returns is a valid decomposition" -- is
      false, on 5 of 205 answers, all one x-set on one instance. But P1's falsification
      condition says a failure "invalidates the instance set as an instrument UNTIL
      EXPLAINED", and it is now explained to certificate standard: the answers are
      roots of the shipped system that decompose on the QUADRATIC TWIST, which a system
      encoding S_4 = 0 cannot exclude, because S_4 vanishes on x-coordinates over the
      algebraic closure and E and its twist share none of their points but all of their
      x-coordinate arithmetic in the relevant sense. The instrument is sound; the
      PREDICTION IS DEFECTIVE, and a superseding restatement must read "every SAT answer
      is a valid decomposition on E or on its quadratic twist, with the side recorded",
      which is exactly the object IDEA-20260915-3f1964 proposes and O-2 mostly built.
      Never by editing the frozen hypothesis.
    P2_wdsat_at_least_10x_below_every_finishing_groebner_engine: >-
      NULL, AND NOW NULL FOR A DIAGNOSED AND FIXABLE REASON (O-3, O-4, O-5). No Groebner
      engine finished in either run, so nothing is asserted, in either direction, under
      core rule 5. What the review adds is the cause, and it is not the mathematics: an
      address-space cap that is not a memory limit for this process, and a parse error in
      generated scripts that would have zeroed the column at any memory limit. THE
      DECISIVE FINDING IS THAT THE COLUMN IS MEASURABLE HERE -- Singular slimgb in 167 s
      and Macaulay2 F4 in ~50 s, agreeing on gb_size = 43, maxdeg = 2, non-unit, both
      inside the contract's per-row budget. P2 is unmeasured, not unmeasurable, and the
      successor is a well-specified repair rather than an open question.
    P3a_core_order_identity: >-
      HOLDS (summary.json, V3). 60 of 60 instances, zero mismatches. It was declared an
      identity check on the `-g` wiring rather than a finding and it is scored as one.
    P3b_noncore_first_censored_at_least_2x_slower: >-
      HOLDS NUMERICALLY BY ORDERS OF MAGNITUDE, AND ITS MECHANISM READING IS NOW CARRIED
      BY A SHARPER OBJECT (O-6, O-7). Censored ratio lower bounds 218.7, 555.8, 1034.5,
      51.7, 1843.3, 50.6 against a threshold of 2, with censoring able only to understate
      them. The relabelling control reaches the same conclusion by a route with no `-g`
      flag in it at all, 135x on the default configuration, which is why the control's
      FAILURE strengthens rather than weakens this prediction. P3b and P6 are one finding
      about variable order.
    P3c_cryptominisat_pure_cnf_at_least_10x_wdsat_at_l6: >-
      HOLDS, AFTER CORRECTING A REPORTING BUG THAT DID NOT MOVE IT (O-8). The four
      reported entries were one number, n19l6/U's 83.500, written under four keys by a
      loop-variable leak. Corrected: 10.396, 34.472, 67.460, 83.500 over all-10 medians
      and 26.071, 34.468, 327.664, 82.629 over the matched 5-instance subset. All eight
      clear 10; the tightest, n17l6/S, clears it by 4%, which the Coordinator's prior
      named in advance. The declared breaking artifact -- a corrected ratio under 10 --
      does not fire. One caveat the correction exposes: the all-10 column compares medians
      over different instance sets, and the matched-subset column is the like-for-like one.
    P4_gaussian_elimination_does_not_help: >-
      HOLDS, AND IS THE MOST ROBUST PREDICTION IN THE ROUND (summary.json, O-10). `-x` is
      4.1-7.2x SLOWER on all six cells, every default median exceeds the 0.05 s floor, and
      excluding every high-load row moves any cell by at most 0.3% and flips nothing.
      This is the one prediction whose verdict survives every correction the review made
      without qualification.
    P5_u_over_s_conflicts_at_least_2x_and_groebner_ratio_in_half_to_two: >-
      SAT CLAUSE HOLDS; GROEBNER CLAUSE UNEVALUATED, NOT HELD (O-8). WDSat U/S conflict
      ratios 3.63, 6.69, 6.11 and CryptoMiniSat-XOR 11.45, 3.67, 6.45, all >= 2 on every
      cell, and the Coordinator's feared n17 failure did not occur (6.69, not 2.4). The
      Groebner clause is guarded on a row key present on 0 of 504 rows, so it was never
      evaluated and nothing recorded that it was skipped: `P5 holds: true` in both runs is
      a true statement about half the prediction, presented as the whole. It is void
      rather than false, and void for the same reason P2 is (O-3, O-4).
    P6_null_objects_at_least_10x_harder_in_conflicts: >-
      THE MEASUREMENT HOLDS WHERE IT IS EVALUABLE; THE MECHANISM READING IN P6's OWN
      WORDING IS NOT SUPPORTED BY THIS DESIGN (O-6, O-7, O-9). Ratios 114.30 (n15l5) and
      20.06 (n17l6), both >= 10, reproducing exactly and holding under the pooled
      aggregation too (117.21, 21.75); the minimum conflict count over all nine finished
      nulls is 34.6x and 16.0x its cell's structured median, so no finished null comes
      near structured order and the "finishing null with fewer conflicts" artifact does
      not fire. n19l6 is UNEVALUABLE: all six nulls hit the 180 s timeout, none reports a
      conflict count, so no censored bound exists on the quantity P6 names -- the 76.7x
      censored WALL bound supports the DIRECTION and does not evaluate the prediction, and
      the top-level `true` that dropped this cell is wrong (O-8). P6's clause "i.e. the
      solver's speed is a property of the descended structure, not of the size" IS NOT
      SUPPORTED: relabelling the structured instance alone reproduces the gap to within a
      factor of two, so the design cannot separate structure from index order. Recorded as
      "null objects are slower where they finish", without the mechanism reading, which is
      the consequence the review plan pre-committed to for exactly this control failure.
      A second, smaller reason for caution: the nulls differ systematically from their
      templates in constant-term count (O-9), an unmeasured difference.

  inference: >-
    H-ICPERF-cc4847 is WEAKENED, in scope, on its own pre-registered test, and the
    weakening is narrower and more useful than that word suggests. Its three title
    clauses come apart. (1) "Every shipped certificate verifies" is SUPPORTED outright
    and at certificate standard (O-1, O-2, O-15). (2) "The gap is carried by the
    core-variable branching order rather than by XOR Gaussian elimination" is SUPPORTED
    and, on the branching-order half, strengthened: P3a is an identity, P3b is censored
    at 50-1843x, P3c clears 10x on all eight corrected comparators, P4 shows `-x` is
    4-7x slower everywhere and survives every load correction, and the relabelling
    control reaches the branching-order conclusion by a route with no `-g` flag in it
    (O-6, O-7). WDSat's branching order IS its index order, statically, read off
    wdsat.c. (3) "The in-repo measurement reproduces the direction and rough magnitude
    of the reported SAT-over-Groebner gap" IS UNMEASURED -- the Groebner column is empty
    in both runs, for two infrastructure reasons now diagnosed, and under core rule 5
    that is not evidence against the clause. The two failures that make this `weakened`
    rather than `supported` are: P1 false as worded on 5 of 205 answers, explained as
    twist decompositions to a standard that discharges its own stated consequence and
    leaves the prediction's WORDING as the defect; and P6's mechanism clause
    unsupported, because the null-object comparison it rests on is confounded with
    variable order by the control the plan itself designed to catch that. What the
    program gains is sharper than what it loses: a certified twist classification and an
    exhaustive V^3 table that agrees with the solvers on 60/60, a diagnosis converting
    P2 from an open question into a specified repair (limit kind AND value, plus a
    two-line convert.py fix), the finding that the Groebner column IS measurable on this
    host inside the contracted budget, and a corrected sqrt(n) Koblitz factor for a
    future rho baseline whose two larger companions -- Pohlig-Hellman at n = 15 and a
    seven-element class set -- are now on the record before the column is built.
    Nothing here asserts anything about the security of any curve, and nothing here
    compares index calculus to any generic attack, because the run reports no generic
    baseline at all (O-13).

  boundaries:
    - >-
      Tested scope: 60 vendored instances at (n, l) in {(15,5), (17,6), (19,6)},
      10 S + 10 U per cell, plus 18 generated null objects; six engine builds
      (WDSat rebuilt per instance sizing, CryptoMiniSat 5.11, CaDiCaL 1.7, MiniSat 2.2,
      Macaulay2 1.22, Singular 4.3.2); one 4-CPU 15 GB host; two runs of 504 rows.
      Group orders 32494, 131174, 525086. Nothing is claimed for any n or l the
      generator does not ship, for Magma F4 or PolyBoRi (absent), for the end-to-end
      attack whose other phases are unmeasured here, or for any cryptographic parameter.
    - >-
      P2 and P5's Groebner clause are UNMEASURED, not negative. The Macaulay2 column is
      an RLIMIT_AS artifact compounded by a parse error in every generated script (O-3,
      O-4); the Singular column is a real right-censored bound on `std` and says nothing
      about F4 or slimgb (O-5). No Groebner engine's completion time on these systems is
      established for any cell by either run.
    - >-
      P6's ratio is evaluated on two cells of three and its mechanism reading on none:
      the n19l6 cell is unevaluable in conflicts, and the relabelling control shows the
      structured-versus-null comparison cannot separate structure from index order
      (O-6, O-7). The relabelling result itself is one instance, one config, one label,
      ten seeds; whether the collapse occurs on S instances, at l = 6, or under -x/-b/-g
      is unmeasured.
    - >-
      The null objects differ from their templates in constant-term count on 18 of 18,
      in the same direction (O-9). The effect on conflict counts is unmeasured and is
      not claimed to be zero.
    - >-
      n15l5-8-S has 32 roots where every other instance has one and is not comparable
      to the others as a benchmark instance (O-17a). Every median over the n15l5 S cell
      includes it.
    - >-
      Conflict-based comparison exists for two engines of six: Macaulay2 rows carry no
      `stats` and CaDiCaL and MiniSat rows carry empty ones (O-17b).
    - >-
      The V6 baseline arithmetic rests on a named heuristic -- that the walk induced on
      the orbit space of the automorphism group is itself a random walk on r/k classes --
      which is standard and known to be imperfect (fruitless cycles under the negation
      map, whose detection cost it does not model). It also inherits KN-LIT-73f7e1's
      disclosure that the 0.886 = sqrt(pi/4) constant is `recalled` in this program and
      attributed to sources no agent here has opened; van Oorschot-Wiener's own constant,
      read at source, is sqrt(pi/2) with no negation map. At n = 15 the constant is
      meaningless in any case (O-14b).
    - >-
      Independence rests partly on reviewer self-report. Two unattested predecessor
      attempts over the first reviewer's joints exist in its task directory, only one of
      which was disclosed before the round (O-18); the reviewer opened neither, and the
      Coordinator can verify that claim only from its account and from the fact that its
      `work/` scripts reference neither directory.
    - >-
      The independence checker could not compose the round's addenda when the round ran
      and has been repaired since; no Coordinator-side run of the repaired checker over
      BOTH attestations against the composed plan is claimed.

  unresolved_confounds:
    - >-
      Whether the shipped U targets were generated by the loop that was read at source.
      The measured decomposable fractions predict 5.57 decomposable targets in 30 and one
      is observed, P(X <= 1) = 0.0148 (O-16). Settled with no solver by regenerating U
      targets at a recorded seed. Until then every statement about "U instances" is a
      statement about these 30 files, not about uniform targets.
    - >-
      How much of the 20-114x structured-versus-null conflict gap is descended structure
      and how much is an index order that exposes the core (O-6, O-7). Separating them
      requires a null object whose variable order is scrambled the same way, or a
      structured object relabelled and then re-sorted so the core is contiguous again.
      Until then P6 measures their conjunction.
    - >-
      Whether the constant-term shape mismatch (O-9) carries any of that gap. Unmeasured;
      it is one Boolean per equation out of 42-52 whose degree-1, -2 and -3 structure is
      identical.
    - >-
      What any Groebner engine's completion time on these systems actually is. Two
      engines agree on the ANSWER for one instance (O-3, O-5) and no cell has a measured
      time. This is the single largest hole in the boundary table's first row.
    - >-
      Whether P3c's ratio should be read over matched instance sets or all 10, which
      moves n19l6/S from 67.5 to 327.7 (O-8). Both clear the threshold; the reported key
      names neither.
    - >-
      Whether n15l5-8-S should be excluded from medians or flagged, and what the n15l5
      cell's numbers are without it (O-17a). Unrecomputed.

  dominated_by: >-
    Not a Pareto question in the frontier sense: this record moves no frontier row and
    claims no exponent. The relevant comparison for the campaign -- solver-based PDP
    against a matched generic attack on the same group and host -- DOES NOT EXIST in
    either run (O-13), so no domination relation can be asserted in either direction, and
    asserting one would be a fabrication under core rule 9. What the record does supply
    toward that comparison is the corrected generic-side arithmetic (O-12, O-14) and the
    statement that the Groebner side is measurable and unmeasured (O-3, O-5). On the
    solver side, the run's own SAT column is dominated by nothing it measured and compared
    against nothing it did not.
  sota_delta:
    time_exponent: unchanged
    memory_exponent: unchanged
    note: >-
      No exponent is moved, none is claimed, and at n <= 19 none could be. The
      quantitative deltas this record carries are all internal to the instrument: the
      corrected P3c ratios (10.4-83.5, from one number reported four times), the
      corrected Koblitz factor (sqrt(n) = 3.87-4.36 against the sqrt(2n) = 5.5-6.2 a
      program proposal asserted), and a 12.4x overstatement that would follow from using
      sqrt(#E) rather than sqrt(r) at n = 15.

  knowledge_promotion: deferred
  knowledge_promotion_reason: >-
    Three candidates, none promoted here, none declined. (a) "WDSat's default branching
    order IS the ANF's variable index order, statically, so any measurement that varies
    the index order varies the solver's decision sequence" -- this is a two-line fact
    about a specific solver's source, read at source, and it is the reason the relabelling
    control is a direct probe rather than a proxy. It is the strongest KN-TECH candidate
    in the round and belongs in the corpus once a second instance and a second
    configuration confirm the collapse (O-6's limits). (b) "A Weil-descended S_4 system
    cannot distinguish E from its quadratic twist, so a PDP benchmark's SAT answers must
    be classified by side and not merely accepted or rejected" -- promotable as a KN-TECH
    caveat, and the natural home for it is the successor experiment that builds the
    side-classified table (IDEA-20260915-3f1964), so it is promoted with that record and
    not ahead of it. (c) "RLIMIT_AS is not a memory limit for a garbage-collected algebra
    system: Macaulay2 reserves 21x its resident peak in address space" -- an operational
    finding that would save every future Groebner row in this program, and the reason to
    wait is that it is one engine on one host and the accompanying number that actually
    binds (>= 8 GiB resident per child at n15l5) is measured at one cell.

