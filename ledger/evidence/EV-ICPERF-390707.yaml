    joints_owned and inventing a V2 verdict, correctly naming that as a fabrication
    under core rule 9, and escalated it as a Coordinator call. The Coordinator's
    answer was to teach the checker to compose addenda (commit on this branch, with
    tests in tools/test_review_independence_addenda.py pinning that an addendum may
    add a joint, reassign an owner and add a proves-too-much object, and may NOT
    remove a joint or weaken a control). Against the COMPOSED plan the second
    reviewer reports the tool confirms V2 is reassigned to it and raises no problem
    with its ownership, verdict shape or blindness; its six residual complaints are
    all "joint X is assigned to TASK-20260913-6c5729, which filed no attestation",
    an artifact of a blinded reviewer being able to pass only its own file. A
    Coordinator-side run over both attestations against the composed plan is a
    successor step and is NOT claimed here as having been performed.

  observations:
    - id: O-1
      text: >-
        P1's FIVE UNVERIFIED SAT ANSWERS ARE TWIST DECOMPOSITIONS, CERTIFIED FOUR WAYS,
        AND THE INSTRUMENT IS NOT INVALIDATED (V1, blind; the Coordinator's prior on
        this joint is CONFIRMED). The single x-set {0x14, 0x22, 0x29} returned by four
        WDSat configurations and by CryptoMiniSat on n19l6-19-U is: (i) a genuine root
        of the shipped system -- 52/52 ANF equations satisfied under the reviewer's own
        parser, and 2364/2364 OR plus 52/52 XOR clauses of the independent CNF-XOR
        encoding; (ii) a genuine root of the summation polynomial -- f3 = 0 under
        independent arithmetic, against f3 = 0x45b28 under the rejected MSB-first
        reading; (iii) NOT on E -- all three x_i and x_R have trace 1; and (iv) a
        decomposition ON THE QUADRATIC TWIST y^2 + xy = x^3 + 1, holding for 2 of 8
        sign choices, which is the same signature as all 30 genuine certificates. The
        producer's decoder rejected for the right reason under the right convention:
        its recorded `why` reads `x = 0x14 is not an x-coordinate on the curve`, and
        0x14 is exactly the LSB-first reading. None of the three conditions the
        Coordinator named as mind-changing fired.
    - id: O-2
      text: >-
        THE EXHAUSTIVE V^3 ENUMERATION AGREES WITH THE SOLVERS ON 60 OF 60 INSTANCES,
        WHICH RETIRES THE "IS THE U LABEL A CERTIFICATE" QUESTION FOR THIS INSTANCE SET
        (V1). 5984 triples per n15l5 instance and 45760 per l = 6 instance, f3 evaluated
        at every multiset: zero mismatches with the run's SAT/UNSAT status. n19l6-19-U
        has EXACTLY ONE root and it is the twist one -- there is no E-decomposition of
        its target in V^3, so no solver could have returned one and (d) "something else"
        is excluded. Of 67 roots across all 60 instances, 45 are all-on-E, 1 all-on-twist,
        21 mixed (cancelling-pair configurations, all in one instance). This is the
        object IDEA-20260915-3f1964 proposed to build, largely built as a side effect of
        the review; the successor experiment inherits it rather than starting from zero.
    - id: O-3
      text: >-
        THE MACAULAY2 COLUMN IS AN RLIMIT_AS ARTIFACT AND THE GROEBNER COLUMN IS
        MEASURABLE ON THIS HOST -- IT WAS SIMPLY NOT MEASURED (V2, the Coordinator's
        prior confirmed in its main clause and REFINED IN ITS ESCAPE CLAUSE). At the
        moment of death under the harness's 6 GiB address-space cap, Macaulay2 held
        VmPeak 5.996 GiB against VmHWM 2.575 GiB -- it hit the cap on the quantity
        RLIMIT_AS measures while using 43% of it in real memory. Uncapped, the identical
        committed script runs F4 to completion in ~50 s wall, reserving 145 GiB of
        address space against a 6.8 GiB resident peak, a 21x ratio. Pinning to one CPU
        still aborts (VmPeak 5.33-5.58 GiB against VmHWM 2.59 GiB), so multi-threading
        is not the mechanism; the reservation behaviour is. Under core rule 5 the 32
        `infrastructure_exit_-6` rows are an infrastructure observation and are NOT
        evidence about F4's memory behaviour. THE ESCAPE CLAUSE MATTERS: unconstrained
        peak RSS is 6.71-6.82 GiB, which does exceed the contract's own 6 GB child
        budget by ~12%, so an equivalent 6 GiB RSS watchdog would also kill this row --
        later, at ~50 s, and for an honest reason. A successor must change both the
        limit KIND and its VALUE (>= 8 GiB resident per child at n15l5; larger cells
        unmeasured).
    - id: O-4
      text: >-
        A SECOND, INDEPENDENT DEFECT MEANS THE HARNESS AS COMMITTED COULD NEVER HAVE
        RECORDED A MACAULAY2 RESULT AT ANY MEMORY LIMIT (V2, unanticipated by the plan;
        core rule 8). All 32 committed `.m2` scripts carry, at line 49,
        `gens_ = flatten entries G;` -- `_` is Macaulay2's subscript operator, so this
        is a parse error. It is raised AFTER the F4 computation finishes, so the
        computation runs and its answer is discarded with exit code 1. It originates in
        experiments/EXP-ICPERF-66fd51/code/convert.py lines 51-54 and is present in the
        scripts of BOTH runs. Lifting RLIMIT_AS alone would have converted 32 rows of
        `infrastructure_exit_-6` into 32 rows of `infrastructure_exit_1`. With the two
        reporting lines repaired and no cap, the run prints
        `gb_size=43 maxdeg_gb=2 is_unit=false`.
    - id: O-5
      text: >-
        SINGULAR'S 900 s STOP IS A REAL CENSORED OBSERVATION ABOUT `std`, AND `slimgb`
        FINISHES THE SAME IDEAL IN 167 s (V2). The invocation is fair: the system
        Singular was given is the system Macaulay2 was given, compared as normalised
        monomial sets across all four instances with a `.sing` (42 variables, 42 ideal
        generators, 42 field equations, identical as an ordered set, 2684 monomial totals
        each). The 900 s was spent computing, not waiting -- cpu/wall = 1.00, memory
        climbing monotonically to 0.85 GiB against a 6 GiB cap. `option(redSB)` is not
        the cause. But `std` is: the same ring, ideal and options with `slimgb(I)`
        returns in 167.4 s at 3.22 GiB with gb_size = 43, maxdeg = 2, vdim = 3, non-unit
        -- AGREEING WITH MACAULAY2's F4 on the same three quantities. Two independent
        engines agree on the answer, both inside the contract's own 900 s and 6 GiB
        budget, once the two harness defects are removed. `slimgb` is not the contracted
        engine and this is one instance on one host; it is recorded as an observation and
        not as a substitute for the `singular_std` column or a verdict on P2.
    - id: O-6
      text: >-
        THE RELABELLING CONTROL FAILS, AND P6 CANNOT SEPARATE DESCENDED STRUCTURE FROM
        AN INDEX ORDER THAT EXPOSES THE CORE (proves_too_much object 2; the plan's own
        declared failure signature is met). Xn15l5-11-U.anf with a uniformly random
        permutation of its 42 variable indices -- the same system, renamed by a bijection,
        with header counts, constant count 36, total terms 2147 and the per-equation
        degree multiset multiset all verified identical, on the same byte-identical
        binary -- costs a median 4,224,251 conflicts across ten seeds against the shipped
        order's 31,257. That is 135x the structured count and 0.55x the matched null's
        7,697,173; 9 of 10 seeds exceed both of the plan's thresholds and the tenth is
        still 3.84x. THE CONTRAST IS THE SHARPEST NUMBER IN THE ROUND: the structured
        instance's conflict count spans 361x across variable orders while its matched
        null spans 2.14x over three seeds. An identity-permutation control reproduces
        the source file byte-for-byte and its 31,257 conflicts, so the rewriter is not
        the effect. The mechanism is read off the solver source and not inferred: in
        wdsat.c the default branching sequence is literally the index order
        (`set[j-1] = j`, descended in order, no activity heuristic), so the generator's
        emission order IS the branching order.
    - id: O-7
      text: >-
        THE SAME MEASUREMENT READ THE OTHER WAY IS THE STRONGEST SUPPORT IN THE ROUND
        FOR THE BRANCHING-ORDER CLAUSE (Coordinator composition of O-6 with P3). P3b
        scrambled the order via `-g` and measured a censored >= 50x slowdown; the
        relabelling control scrambles the order in the FILE, on the default
        configuration, with no `-g` wiring in the path at all, and measures 135x on one
        instance. Two independent routes to the same conclusion, one of which cannot be
        an artifact of the `-g` flag. What fails is not the branching-order mechanism but
        the NULL-OBJECT COMPARISON: since relabelling alone reproduces the
        structured-versus-null gap to within a factor of two in the median, P6's design
        cannot attribute that gap to the descended structure. This does not say the
        structure is irrelevant -- the structured system stays cheaper per conflict
        (1.7 us/conflict against the null's 5.9) and one order in ten stayed within 4x
        of the shipped order -- it says P6 as designed does not isolate it. P3b and P6
        are therefore ONE finding about variable order, not two mechanisms.
    - id: O-8
      text: >-
        EVERY PER-CELL NUMBER IN summary.json RECOMPUTES EXACTLY, AND THREE OF ITS SIX
        `holds` BOOLEANS DO NOT (V3). 156 of 156 per-cell values -- every median wall
        time, every median conflict count, every finished-row count -- reproduce to the
        last printed digit from results.jsonl under an independent reduction written
        before summary.py was opened. Three defects, none of which moves a verdict:
        (a) P3c is one number written under four keys. summary.py line 131 reads `L`
        inside the P3b loop where `L` is never rebound, so it holds the last cell/label
        of an earlier loop, n19l6/U. The corrected per-cell ratios are 10.396 (n17l6/S),
        34.472, 67.460, 83.500, and against the matched 5-instance subset 26.071, 34.468,
        327.664, 82.629 -- ALL EIGHT >= 10, so P3c survives, with n17l6/S clearing the
        threshold by 4% exactly as the Coordinator's prior predicted. (b) P5's Groebner
        clause is never evaluated: it is guarded on a row key `engine_cpu_s` that appears
        on 0 of 504 rows, and nothing records that it was skipped, so `P5: holds: true`
        is a true statement about half the prediction labelled as the whole. (c) P6's
        top-level boolean drops the unevaluable n19l6 cell from its conjunction and
        reports `true` on the strength of two cells of three; the per-cell block is
        honest and the boolean is not.
    - id: O-9
      text: >-
        THE NULL OBJECTS MATCH THEIR TEMPLATES ON FIVE SHAPE MEASURES AND DIFFER
        SYSTEMATICALLY ON THE SIXTH (V4). 18/18 match on variable count, equation count,
        total-degree histogram excluding the constant, per-equation degree multiset
        excluding the constant, and variable support. 0/18 match on the number of
        constant terms, and all 18 differ in the same direction: mean constant fraction
        0.510 for the nulls against 0.823 for the templates -- a fair coin per equation
        against a property of the descended system. The run's `shape_matches_template:
        true` is correct under the producer's declared sizing tuple, which does not
        include the constant; the plan's breaking artifact is worded over the
        "monomial-degree profile", which does. It fires weakly. Its effect on conflict
        counts is UNMEASURED and is not asserted to be harmless.
    - id: O-10
      text: >-
        TIMING INTEGRITY HOLDS, AND THE HIGH LOAD WAS THE RUN'S MEMORY OF ITS OWN
        MACAULAY2 PHASE (V5). Two host suspensions of 43866 s and 59032 s fall BETWEEN
        rows and no row spans either; across all 442 non-Macaulay2 rows
        `wall_s - cpu_s` lies in [0.0003 s, 0.1695 s], so not one row lost a measurable
        amount of wall time to anything, and restricted to the 94 high-load rows the
        maximum is 0.1378 s. Zero rows exceed their timeout by more than 45 ms. Of 21745
        ordered row pairs, 0 are provably concurrent. The 125 rows launched at
        loadavg > 2 are 31/32 phase C and 82/90 phase D, and the Macaulay2 rows consumed
        2.7 CPU-seconds per wall-second: load decayed monotonically 4.55, 4.29, ..., 2.23
        with nothing running concurrently. TWO LIMITS. The plan's exclusion test cannot
        evaluate P3c, because phase D is 82/90 high-load and excluding high-load rows
        leaves 0 rows on n17l6/S -- there is no low-load control in this run for the
        phase-D engines, so the test measures phase membership. P4's exclusion moves any
        cell by at most 0.3% and flips nothing. The Coordinator's prior said "wall_s
        within 2 s of 2x cpu_s"; the relation in the data is wall ~ 1x cpu to within
        0.17 s except on Macaulay2 where cpu EXCEEDS wall. The prior's substance was
        right and its stated relation was not.
    - id: O-11
      text: >-
        RUN-ICPERF-4ec9b9 SHOWS THE FIRST RUN'S MEDIANS WERE TIMINGS AND NOT LOAD
        ARTIFACTS, AND REPAIRS NOTHING ELSE (AMD-20260915-4ec9b9). 31 of 31 per-cell
        median conflict counts are identical to the last digit; 55 wall-time medians move
        0.24% at the median with one cell over 10%, and that one a half-second
        measurement. It is less contaminated (48 rows above loadavg 2 against 125) and
        not clean, from its own Macaulay2 phase. It carries both defects of O-3 and O-4 --
        32 identical aborts, the same convert.py line -- so P2 is null there for the same
        reason, and it carries all three summary.py defects of O-8 because summary.py was
        deliberately not changed mid-flight. V2 also cross-checked its four WDSat rows and
        the null against its own re-measurement: identical on every deterministic
        quantity.
    - id: O-12
      text: >-
        THE BENCHMARK CURVE IS KOBLITZ, AND THE CORRECTION TO A FUTURE RHO BASELINE IS
        sqrt(n) AND NOT sqrt(2n) (V6; this CORRECTS IDEA-20260915-8fe0ef, which the
        reviewer deliberately did not read, scoring only the claim quoted in the V6
        addendum). find_points.sage line 8 is `EllipticCurve(K,[1,1,0,0,1])`, i.e.
        y^2 + xy = x^3 + x^2 + 1, whose five coefficients are all in F_2, so the curve is
        the base change of a curve over F_2 and tau(x,y) = (x^2,y^2) is an endomorphism.
        Point counts from the F_2 trace t = 1 and the recursion: 32494 = 2*7*11*211,
        131174 = 2*65587, 525086 = 2*262543, each confirmed by an independent brute-force
        count over all 2^n x-values. On the order-r subgroup tau acts as lambda = 21 mod
        211, 17184 mod 65587, 84450 mod 262543, each of multiplicative order exactly n
        with -1 not a power of lambda, so the <tau,-1> orbit is the full 2n = 30, 34, 38
        and the addendum's breaking artifact does not fire. The correction factor against
        a NEGATION-ONLY baseline is sqrt(n) = 3.873/4.123/4.359; sqrt(2n) is the factor
        against a baseline with no equivalence classes at all. The quoted claim was
        internally inconsistent -- its formula evaluates to sqrt(n) and its asserted
        number is sqrt(2n) -- and wrong in the direction of overstating the correction.
    - id: O-13
      text: >-
        NOTHING IN THE RUN MOVES UNDER O-12, BECAUSE THE RUN REPORTS NO GENERIC BASELINE
        AT ALL (V6). A search of manifest.yaml, summary.json, task-report.md, command.txt
        and specification.yaml for rho, baseline, generic, pollard, vow, oorschot, koblitz
        and frobenius returns one hit, a timeout budget key. The frozen contract and the
        hypothesis both say so in terms ("No rho comparison exists in this batch"). So the
        V6 addendum's framing -- "the negation-only Pollard rho baseline that
        RUN-ICPERF-305ca3 compares its SAT column against" -- describes a baseline and a
        comparison that DO NOT EXIST, and the Coordinator withdraws it. What V6 establishes
        is a correction to the FUTURE boundary table of RQ-ICPERF-94c86e, not a defect in
        this run: that question already requires matched rho and BSGS measured on the same
        group and host, so a negation-only implementation on this curve would understate
        rho's speed by sqrt(n), and the correction must be carried by the implementation
        rather than by arithmetic applied afterwards.
    - id: O-14
      text: >-
        TWO EFFECTS LARGER THAN THE KOBLITZ FACTOR AT THESE PARAMETERS, WHICH THE FUTURE
        BASELINE COLUMN MUST STATE (V6, unanticipated). (a) n = 15 has a fully smooth
        group order, 32494 = 2*7*11*211, so Pohlig-Hellman reduces the whole ECDLP to the
        order-211 subgroup, and using sqrt(#E) instead of sqrt(r) overstates the generic
        baseline by a factor of 12.4 -- more than double the Koblitz factor, on a different
        axis. At n = 17 and 19 the cofactor is 2 and the same substitution costs sqrt(2).
        Any baseline column must use r, and must say which it used. (b) At n = 15 the
        asymptotic constant is meaningless: r/(2n) = 211/30 ~ 7 equivalence classes, so the
        3.32 group operations in V6's table are arithmetic and not a prediction. n = 17 and
        19 give 1929 and 6909 classes.
    - id: O-15
      text: >-
        THE POSITIVE CONTROLS PASS, INCLUDING ONE RUN 5.7x STRONGER THAN ASKED
        (proves_too_much object 1). The plan asked for one bit of x_1 flipped on each of
        the 30 certificates; the reviewer ran every single-bit flip -- 170 objects. The
        checker accepted 0 of 170, and f3 was nonzero on 170 of 170 where the plan allowed
        one zero. Of the 170 perturbed values 78 are still ON E, so the checker rejects on
        the decomposition and not merely on curve membership. Swapping n19l6-19-U's target
        for n19l6-1-S's and keeping the x-set is rejected under both bit conventions with
        f3 nonzero both ways. Separately, V6's nearby-object control behaves correctly: the
        same Weierstrass shape with a_6 = a (the field generator, outside F_2) is
        non-singular, tau is NOT an endomorphism, the F_2 trace recursion gives the wrong
        point count at all three n, and no Frobenius speedup is available. The Koblitz
        argument does not prove too much.
    - id: O-16
      text: >-
        THE SHIPPED U TARGETS ARE DECOMPOSABLE FAR LESS OFTEN THAN UNIFORM TARGETS ARE,
        AND THIS IS AN OBSERVATION AND NOT A FINDING (V1, unanticipated; core rule 8).
        Exhaustive enumeration over V^3 gives exact decomposable fractions per cell --
        0.1898, 0.2871, 0.0799 -- and a 300-sample Monte Carlo over genuinely uniform
        draws agrees (54/300, 73/300, 23/300, with 0 disagreements in 900 samples between
        the closed-form membership test and the exhaustive root search). Those fractions
        predict 5.57 decomposable targets among the 30 shipped U instances; ONE is
        observed, per cell 0/10, 0/10, 1/10 against 1.90, 2.87, 0.80, with P(X <= 1) =
        0.0148. Two controls were run: the on-E/on-twist split of the 30 U targets is
        17/13, consistent with uniform, so this is not a trace bias; and the reviewer's
        root-existence model agrees with the solver on 60/60, so the model is not wrong
        about these instances. It is post-hoc at n = 30 and 1.5% is unusual without being
        extraordinary; the mundane readings are that the vendored files were not produced
        by the loop read at source, or were filtered, or that this is the 1.5%. It costs no
        solver to settle: regenerate U targets with the shipped generator at a recorded
        seed and measure the fraction directly.
    - id: O-17
      text: >-
        THREE INSTRUMENT DEFECTS THAT LIMIT WHAT ANY SUCCESSOR ROW CAN COMPARE
        (V2, V3, V1; core rule 8). (a) n15l5-8-S IS DEGENERATE: its target x_R = 0x12 lies
        inside the subspace V itself and it has 32 distinct roots where every other
        instance has one. Its certificates verify and P1 is unaffected, but a solver
        finding any of 32 solutions is solving an easier problem; it belongs in the
        instrument's known-quirks list and should be excluded from or flagged in every
        median. (b) THE `stats` BLOCK IS EMPTY FOR THREE ENGINES: all 32 Macaulay2 rows
        carry no `stats` at all, all 60 CaDiCaL and MiniSat rows carry an empty one, and
        only CryptoMiniSat reports (88 of 90). Conflict-based comparison is available for
        two engines of six. (c) THE RUN CANNOT NAME ITS SINGULAR VERSION: bench.py's
        version probe leaves stdin inherited, and `Singular --version` prints its banner
        then blocks reading stdin whenever stdin never reaches EOF. Reproduced exactly
        under a pty and an open pipe; with /dev/null it returns in 0.0 s. The four solver
        rows are unaffected (solver children get stdin=DEVNULL) and the installed engines
        run directly are Singular 4.3.2 and Macaulay2 1.22, the versions the hypothesis
        names -- so the contract's engine statement is right even though the run's own
        environment record could not confirm it.
    - id: O-18
      text: >-
        A SECOND UNATTESTED PREDECESSOR ATTEMPT EXISTS AND IS DISCLOSED HERE BECAUSE THE
        ROUND'S DISCLOSURES COVERED ONLY ONE (V1, unanticipated). Disclosure D-1 records
        one abandoned attempt in `scratch/` from ~09:16-09:33Z. There is a SECOND, in
        `artifacts/`, written 12:35-13:33Z on 2026-09-15, covering V1, V3, V4, V5, V6 and
        a prepared control object -- a nearly complete pass over those joints with no
        report.md and no attestation.yaml, covered by no disclosure. The reviewer handled
        it as the Coordinator had handled `scratch/`: it listed the file NAMES to write
        the paragraph and opened none of their contents, and everything it reports is
        re-derived by scripts under `work/` that reference neither directory. TWO SILENT
        PREDECESSORS IS A DIFFERENT INDEPENDENCE STORY FROM ONE, and the honest reading is
        that this round's independence rests on the reviewer's own account of what it did
        not read, which the Coordinator accepts and cannot verify from the artifacts alone.
        Both predecessors' numbers are excluded from this record. The mechanism that
