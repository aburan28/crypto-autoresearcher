    order of magnitude below the x100 prediction at the tested scope). It
    says nothing at n=8 beyond a completed in-cap zero on the disclosed
    integer sub-lattice (F3_n8 did not fire). It also CORRECTS the v2
    round's working interpretation of the IV-1C shortfalls: they are
    genuine dependencies (Q-rank 6 at three of eight d=(1..1) n=8 control
    tuples, surviving a 400-prime enlargement), not a prime-set artifact.
