  # ==================================================================
  # VERDICT AWARENESS -- READ THIS SECTION BEFORE CITING ANYTHING BELOW
  # ==================================================================
  validator_verdict: passed
  validator_verdict_note: >-
    The Validator (TASK-20260813-71d65d, VAL-20260813-71d65d) returned `passed`. Both
    archives verify at full change-set equality (0 extra, 0 missing, all 11 committed path
    hashes independently recomputed from the git object database). RC-3 is carried
    verbatim. The obligation-0 coverage table (12/18) is independently re-derived cell for
    cell. The termination branch T-INDVERIFY-ARTIFACT-PARTIAL is read correctly in
    aggregate and per-cell. The reduction/enumeration step is independently verified
    genuinely non-code-shared by direct code-body comparison. A `passed` verdict here means
    the receipt is ADMISSIBLE EVIDENCE of what it reports; it does NOT mean the
    reduction-quality-vs-code-sharing question for hkz is settled -- the Validator's own
    section 6 (THE CRUX) states plainly it is not, and proposes the qualification carried
    into this record below.

  red_team_verdict_summary: >-
    The Red Team (TASK-20260813-7930a6, RT-20260813-7930a6) states up front: "the mechanical
    arithmetic is correct given the frozen inputs and PREREG-4's own precedence rule";
    T-INDVERIFY-ARTIFACT-PARTIAL fires correctly, per-cell-split, per PREREG-4 2.6's own
    "reports BOTH" clause. It confirms the reduction/enumeration step is genuinely
    non-code-shared by an independent line-level diff PLUS a structural argument (fpylll is
    hard-imported by every barred implementation and is absent in this environment, so the
    barred kernel could not have run here regardless of intent). It reasons quantitatively
    about whether lam1n's ~1e-15 agreement is "too good" (it is not, bounded by a built
    null-object control) and builds a SECOND, independently-structured LLL implementation
    that reproduces hkz's disagreement with ROUTE-P at essentially the same magnitude at
    every covered cell -- its central objection (RT-4, MAJOR) is that PREREG-4's own
    MEANS-text for T-INDVERIFY-ARTIFACT attributes hkz's disagreement to code-sharing when
    this batch's own design confounds code-independence with reduction depth, and its two
    controls point toward reduction depth as the better-supported driver.

  admissible_now:
