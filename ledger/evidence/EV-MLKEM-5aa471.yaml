evidence:
  id: EV-MLKEM-5aa471

  hypothesis_id: null
  hypothesis_id_note: >-
    DELIBERATELY NULL, in the same sense as EV-MLKEM-965a37, EV-MLKEM-aa39ad and their
    siblings. This batch (BATCH-6e08fe, governed by PREREG-4) is an instrument/independence
    verification of an already-reported route comparison (BATCH-fbb639's part (c)), not a
