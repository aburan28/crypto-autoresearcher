    change-set equality independently verified by both reviews: Validator AC-3..AC-5; Red
    Team's own "Commit verification" section, 8/8).

  type: empirical

  direction: neutral
  direction_note: >-
    NEUTRAL, and measured rather than hedged, exactly as EV-MLKEM-965a37's direction was.
    This record adjudicates no proposition about a lattice and licenses no A-1 statement for
    lam1n or hkz. It is a SPLIT RESULT stated plainly: for lam1n's 6 covered cells, an
    existing qualification is discharged; for hkz's 6 covered cells, an existing
    qualification is neither discharged nor newly extended -- see termination_branch and
    revisit_condition_ruling below. Both reviews independently confirm this split is not an
