    own "Commit verification" section).

  run_ids: []
  run_ids_note: >-
    No RUN-* identifier is minted anywhere in this batch's committed artifacts (grep-checked
    by the Validator; none found). ONE lead producer, ONE measurement invocation
    (measure_route_reimpl.py, 981.52 s of an 1800 s task budget), reported at full precision
