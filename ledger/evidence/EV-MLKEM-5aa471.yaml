  strength: replicated
  strength_basis: >-
    `replicated` is claimed for the admissible core listed above: the arithmetic at all 12
    covered cells, the aggregate verdict, the termination branch, the code-independence
    finding for the reduction/enumeration step, and the ROUTE-P exclusion discipline -- each
    independently re-derived or re-checked by a Validator implementation and a Red Team
    implementation built separately, agreeing with the producer and with each other at
    every item checked by both. `replicated` is ALSO claimed for lam1n's L7/L9 confirmation
    specifically (a THIRD, independently-built implementation -- the Validator's -- matches
    to 0-2.665e-15, the Red Team's structural/environmental argument and calibration find no
    evidence it is implausibly small) and for the reduction-quality-confound account for
    hkz specifically (found independently by both reviews via partially different methods:
    the Validator's pattern-correlation analysis plus theoretical mechanism account; the Red
    Team's second, independently-coded LLL implementation). It is explicitly NOT claimed
    for the single-source items: lam1n's exact L11 numeric values (the lead's alone; the
    Validator's own L11 attempt did not complete within its probe budget -- L-1), the F-1
    PREREG-4 drafting-gap finding (Validator alone), findings F-2/F-3 (Validator alone),
    findings RT-5/RT-6/RT-7 (Red Team alone) -- all recorded as `anecdotal`/single-session
    strength, not rounded into the `replicated` claim.
    WHAT `replicated` DOES NOT MEAN HERE, restated because it is load-bearing every time
    this goal writes it: NOT model-level and NOT environmental. AGENTS.md rule 12 is UNMET
    AND UNWAIVED. The producer and both reviews resolve to the SAME MODEL (claude-sonnet-5)
    on, per both reviews' own measured records, the SAME HOST AND STACK (Linux vm
    6.18.5-fc-v20, Python 3.11.15, numpy 2.4.6, fpylll absent in all three sessions
    independently confirmed). This is stated with particular force here because this
    batch's own central finding is that reduction-quality mismatch, not code-sharing,
    explains hkz's disagreement -- and this record's own two "independent" reviews share the
    identical environmental constraint (fpylll's absence) that drove the confound in the
    first place, exactly as EV-MLKEM-965a37 named the same irony for its own reviews of the
    producer's independence claim. THIS RECORD DOES NOT EXEMPT ITSELF FROM THE STANDARD IT
    APPLIES ELSEWHERE.

  claim_tier: toy
  claim_tier_note: >-
    TOY, UNCONDITIONALLY. Scope: q = 3329; d in {20, 30, 40} (L7, L9, L11 ONLY); lam1n, hkz
    ONLY (rawtail out of scope for this measurement, PREREG-4 2.1); the frozen beta grids of
    PREREG-4 2.1; up to N_BASES = 8 per covered cell, narrower where matched (5/8 at
    lam1n/L11 due to 3 SVP-enumeration timeouts); binary64 only. NO reduction above d=40 was
    performed anywhere, at any point (verified independently by both reviews). Every number
    in this batch is either read directly from an already-committed file or a measured
    output of a genuinely new (bounded, d<=40) LLL+enumeration computation. No number here
    transports to beta = 606, d = 1420 or any FIPS 203 parameter set by extrapolation,
    analogy or any other route. `certificate.kind: none` -- no discrete-log solve or
    factor-base relation is claimed anywhere; the D_route'/VERDICT' comparison is an
    INSTRUMENT/INDEPENDENCE CHECK, never a certificate.

  proof_status: derivation
  proof_status_note: >-
    LAYERED, AND THE LAYERS ARE NOT THE SAME STRENGTH -- STATED SEPARATELY SO NEITHER
    BORROWS THE OTHER'S WARRANT. (1) The code-independence finding for the
    reduction/enumeration step is a DERIVATION in the strict sense EV-MLKEM-965a37 used the
    word: a direct, checkable structural comparison of the actual committed source
    (line-by-line body diff, zero verbatim-copy flags at a 5-line threshold) plus a
    structural environmental-impossibility argument (fpylll absent, hard-imported by every
    barred file), independently constructed by both reviews. (2) lam1n's near-machine-
    epsilon agreement rests on a near-proof-like argument: lambda_1 is an exact,
    algorithm-independent lattice invariant with a UNIQUE correct value, so two CORRECT
    implementations of exact SVP enumeration must agree on it regardless of code -- this is
    closer to a mathematical necessity than an empirical measurement, and both reviews state
    it this way. (3) The reduction-quality-confound account for hkz is EMPIRICAL/
    STATISTICAL, not a derivation: it rests on a pattern of signatures (sign consistency,
    dimension scaling, beta-window shrinkage; a second independent LLL implementation
    reproducing the same disagreement) that BOTH reviews independently judge to point toward
    reduction depth rather than code-sharing, plus one THEORETICAL, UNVERIFIED mechanistic
    account (head-concentration / determinant-conservation, Validator section 6
    sub_question_1) offered as consistent-with-the-evidence, not independently confirmed by
    a further targeted experiment. NEITHER REVIEW, NOR THIS RECORD, CLAIMS THE
    REDUCTION-QUALITY-VS-CODE-SHARING QUESTION FOR hkz IS PROVEN. The one experiment that
    would settle it directly (a quality-matched, HKZ-quality genuinely independent route) was
    not built by the lead, the Validator, or the Red Team -- fpylll remained unavailable to
    all three.

  proof_refs:
