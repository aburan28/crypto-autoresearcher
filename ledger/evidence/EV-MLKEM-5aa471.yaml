  # ==================================================================
  # THE TERMINATION BRANCH
  # ==================================================================
  termination_branch:
    branch: T-INDVERIFY-ARTIFACT-PARTIAL, read off PREREG-4 2.6's frozen precedence.
    read_off: >-
      COVERED = 12/18 (all 6 middle-beta cells genuinely UNCOVERED at both candidates,
      exactly matching PREREG-4's stated expectation, independently re-derived by both
      reviews). SOME-ARTIFACT holds: at least one covered cell -- in fact all 6 hkz covered
      cells -- has VERDICT' = DOES NOT EXCEED. Under PREREG-4 2.6's stated precedence
      (SOME-ARTIFACT dominates ALL-SURVIVE whenever both could otherwise be read from the
      data, which is exactly this case, per-cell, by candidate), T-INDVERIFY-ARTIFACT fires
      as the aggregate branch label. |COVERED|=12<18 triggers the -PARTIAL suffix. BOTH
      REVIEWS INDEPENDENTLY RE-DERIVED THIS from the raw per-cell VERDICT' array with no
      producer import and CONFIRM IT CORRECT in aggregate and per-cell (Validator section 4;
      Red Team section 4).
    per_cell_split_required_by_prereg_4_2_6s_own_reports_both_rule: >-
      "A batch that fires T-INDVERIFY-ARTIFACT at some cells and would independently have
      fired T-INDVERIFY-CONFIRMED at others reports BOTH." Applied exactly as this data
      requires: lam1n's 6 covered cells (L7_b5, L7_b15, L9_b7, L9_b22, L11_b10, L11_b30)
      independently satisfy ALL-SURVIVE among themselves (VERDICT'=EXCEEDS at every one,
      D_route' at 2.220e-15 to 9.992e-15) and fire under T-INDVERIFY-CONFIRMED's license.
      hkz's 6 covered cells (the same beta/lattice set) all show VERDICT'=DOES NOT EXCEED
      (D_route' 0.0153 to 0.2235) and fire under T-INDVERIFY-ARTIFACT's license. Both
      reviews independently confirm this split is the CORRECT reading of PREREG-4 2.6's own
      text (Validator termination_branch_reading; Red Team section 4).
    what_lam1ns_branch_licenses_quoted_verbatim: >-
      "for the covered cells only, BATCH-fbb639's EXCEEDS verdicts may be cited WITHOUT
      F-1/RT-1's 'not under independent verification' qualification."
    what_hkzs_branch_licenses_quoted_verbatim: >-
      "the flagged cell(s)' EXCEEDS verdict FROM BATCH-fbb639 must be recorded as
      methodologically unsupported in a superseding record, and no successor may cite it
      without that flag" -- SEE revisit_condition_ruling BELOW FOR WHY THIS CONSEQUENT DOES
      NOT FIRE FOR hkz ON THIS BATCH'S OWN EVIDENCE, DESPITE THE BRANCH ITSELF FIRING
      CORRECTLY AND MECHANICALLY.
    what_both_forbid_unchanged: >-
      Retroactively changing T-C3LANE-OPEN-PARTIAL itself (BATCH-fbb639's own,
      correctly-read, frozen-clause outcome, unaffected by anything in this batch); any
      claim about ML-KEM, any FIPS 203 parameter set, any attack cost or any cost model;
      closing, pausing or completing GOAL-MLKEM-005; extending T-INDVERIFY-CONFIRMED's
      discharge to any UNCOVERED cell (F-1/RT-1's qualification continues to apply there,
      unchanged); treating lam1n's discharge as A-1 held for lam1n (PREREG-3 3.5's exclusion
      of lam1n/hkz/rawtail from A-1's scope is unchanged).

  # ==================================================================
  # RC-3 DISCHARGE
  # ==================================================================
  rc3_discharge: >-
    DISCHARGED. BATCH-fbb639's coverage table (R-C-OUT-0 of results_c3lane.json) falsely
    marked hkz/L9_b15 and hkz/L11_b20 as COVERED; results_am4.json's gates.hkz.G_REL1.all
    block reports hkz only at each lattice's two REL1_PAIR endpoint betas, never the middle
    beta either lattice's 3-point grid uses, and measure_c3lane.py never reads X_hi.
    hkz/L9_b15 and hkz/L11_b20 are restated as UNCOVERED, not COVERED. hkz/L9_b22 and
    hkz/L11_b30 are restated with the corrected TRUE beta_hi-based D_route source,
    numerically UNCHANGED at exactly 0.0 for both. lam1n's equivalent beta reuse is
    legitimate and excluded from this correction (X_lo == X_hi exactly). GENUINE COVERAGE
    OF BATCH-fbb639's OWN 27-CELL TABLE NARROWS FROM 18 TO 16 OF 27: lam1n 9/9 unaffected,
    hkz 7/9 genuinely covered. This narrowing does NOT reopen, reduce or extend
    T-C3LANE-OPEN-PARTIAL (unchanged, PREREG-4 section 1, carried not re-litigated here).
    Carried verbatim from the Red Team's own already-computed probe
    (probe_coverage_beta_mismatch.py / _output.json, BATCH-fbb639/reviews/TASK-20260813-6ab893),
    with NO recomputation, into TASK-20260813-ea2e96's report_route_reimpl.md, and
    independently re-confirmed by both reviews of THIS batch directly against the primary
    source (Validator AC-6, AC-7; Red Team's independent diff of RC3_TEXT against PREREG-4's
    own blockquote, exact match modulo one em-dash normalization). This record and
    DEC-20260813-1aae44 freeze and publish the correction as committed, citable text;
    durability follows this ledger archive's commit and verifier acceptance.

  # ==================================================================
  # lam1n -- T-INDVERIFY-CONFIRMED, DISCHARGED FOR SIX CELLS
  # ==================================================================
  lam1n_confirmed_discharge: >-
    THE ANTECEDENT IS SATISFIED AND THE DISCHARGE IS PLAIN. For lam1n's 6 covered cells
    (L7_b5, L7_b15, L9_b7, L9_b22, L11_b10, L11_b30), T-INDVERIFY-CONFIRMED's own antecedent
    -- genuine algorithmic independence, ALL-SURVIVE among lam1n's own cells -- is fully
    satisfied and is NOT subject to the reduction-quality confound that qualifies hkz below:
    lambda_1 is an exact, algorithm-independent lattice invariant with a unique correct
    value. Two CORRECT implementations of exact SVP enumeration must land on the identical
    integer regardless of code, because the decision problem they solve has one right
    answer (Red Team section 2); ROUTE-P's own HKZ pipeline ALSO certifies lambda_1 exactly
    (BKZ+HKZ-sweep+independent-enumeration-verification), so both sides target the same
    certified quantity, and reduction quality is therefore not a live confound for this
    comparison the way it is for hkz's GSO-tail statistic (which reads the profile at
    indices 1..d-1, not the certified index-0 minimum). Per PREREG-4 2.6,
    T-INDVERIFY-CONFIRMED FIRES for these 6 cells (D_route' = 2.220446e-15 at L7_b5/L7_b15,
    2.664535e-15 at L9_b7/L9_b22, 9.992007e-15 at L11_b10/L11_b30; matched bases 8/8 at L7/L9,
    5/8 at L11) and DISCHARGES, for these six cells specifically, EV-MLKEM-965a37's F-1/RT-1
    qualification. BATCH-fbb639's EXCEEDS verdicts at lam1n/L7_b5, lam1n/L7_b15,
    lam1n/L9_b7, lam1n/L9_b22, lam1n/L11_b10 and lam1n/L11_b30 MAY NOW BE CITED WITHOUT the
    "not under independent verification" caveat -- the strongest genuinely independent
    confirmation this goal's history has produced.
    TWO HONEST LIMITATIONS, STATED PLAINLY, NEITHER OF WHICH REOPENS THE DISCHARGE. (1) The
    Validator's own THIRD, independently-built implementation (probe_indep_reimpl.py,
    importing nothing from the lead's script -- a different Gram-Schmidt bookkeeping
    strategy and a different enumeration offset-visiting order) confirmed lam1n' at L7 (8/8
    bases, full float64 precision) and L9 (8/8 bases, 6/8 at full float64 precision) to
    0-2.665e-15, the SAME order of magnitude the lead reported -- but did NOT independently
    reach L11 (d=40) within its own probe budget, its own enumeration function's coarse
    timeout-check granularity causing a 532.62 s overshoot past a nominal 45 s cap. This is
    an infrastructure limitation of THIS validation probe (VAL-20260813-71d65d limitation
    L-1), reported honestly rather than smoothed over; it is NOT evidence against the
    lead's L11 result, which the Validator separately confirmed internally consistent
    (correct exclusion of the 3 timed-out bases, AC-11), but L11's numeric lam1n' values
    remain single-source (the lead's alone) at this batch's close. (2) The Red Team
    quantified, from the lead's own already-archived per-basis timeout log (route_i_prime_
    per_basis_log; zero new reduction), that including the 3 timed-out L11 bases (indices
    1, 5, 6) at their best-found-before-timeout values rather than excluding them would
    leave 2 of 3 (bases 1, 6) already at 1e-15-scale agreement, but the third (basis 5)
    carries a real, non-trivial residual of 0.0276. Had it been included, D_route' for
    lam1n/L11_b10 and lam1n/L11_b30 would have risen from the reported 9.99e-15 to 0.0276 --
    THE VERDICT WOULD NOT HAVE FLIPPED (s_c^fib=0.0388 > 0.0276, EXCEEDS still holds), BUT
    THE MARGIN NARROWS FROM THE REPORTED "NEAR MACHINE EPSILON" FRAMING TO APPROXIMATELY
    1.4x. This exact margin is recorded here so a future reader knows how close the L11
    result came, not merely that it held (Red Team RT-6, section 5).

  # ==================================================================
  # hkz -- T-INDVERIFY-ARTIFACT-PARTIAL FIRES CORRECTLY; ITS MEANS-TEXT IS QUALIFIED
  # ==================================================================
  hkz_qualification_citable_wording: >-
    For the 6 hkz covered cells (L7_b5, L7_b15, L9_b7, L9_b22, L11_b10, L11_b30),
    T-INDVERIFY-ARTIFACT fires correctly per PREREG-4 section 2.6's frozen precedence
    (D_route' = 0.0153 to 0.2235, exceeding s_c^fib at every one). PREREG-4's own MEANS-text
    for this branch, quoted from DEC-20260813-28d7b2, attributes the disagreement to "a
    methodological artifact of code-sharing". THIS ATTRIBUTION IS NOT SUPPORTED BY THIS
    BATCH'S OWN EVIDENCE AND MUST NOT BE CITED UNQUALIFIED. Both independent reviews,
    working via different methods, converge on a different, better-supported explanation: a
    REDUCTION-QUALITY MISMATCH. ROUTE-I' for hkz necessarily used LLL(delta=0.99)-only
    reduction (fpylll and every alternative lattice-reduction library were confirmed
    unavailable in the run environment by the lead and independently re-confirmed live by
    both reviews), compared against ROUTE-P's genuinely HKZ-quality pipeline (BKZ block=d +
    explicit HKZ sweeps + independent per-index enumeration verification) -- i.e. two
    computations of DIFFERENT REDUCTION DEPTH, not merely different code, were compared. The
    reduction/enumeration step itself is independently verified GENUINELY NON-CODE-SHARED
    by both reviews (Validator OR-1: direct line-by-line body comparison, no meaningful
    overlap outside the licensed block-matrix construction; Red Team section 1: zero
