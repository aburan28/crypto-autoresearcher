    ANY CITATION OF hkz's T-INDVERIFY-ARTIFACT-PARTIAL FLAG THAT ATTRIBUTES IT TO
    CODE-SHARING, in PREREG-4 2.6's own default prose, WITHOUT the qualification stated in
