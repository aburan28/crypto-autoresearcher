  revisit_condition_ruling:
    lam1n: >-
      DISCHARGED. See lam1n_confirmed_discharge above. The antecedent (D_route' small under
      genuine algorithmic independence, and for lam1n specifically not subject to a
      reduction-quality confound because lambda_1 is an exact algorithm-independent
      invariant) is satisfied. T-INDVERIFY-CONFIRMED's license applies plainly to the 6
      lam1n covered cells.
    hkz: >-
      RULED NOT TO FIRE, ON THIS BATCH'S OWN EVIDENCE, FOR hkz SPECIFICALLY.
      DEC-20260813-28d7b2's original revisit condition (restated in PREREG-4 section 2.8)
      licenses its consequent -- flagging BATCH-fbb639's hkz EXCEEDS verdicts as
      methodologically unsupported in a superseding record -- IF D_route grows toward
      s_c^fib's scale "under genuine algorithmic independence" (DEC-20260813-28d7b2's own
      words, quoted in PREREG-4 2.6's T-INDVERIFY-ARTIFACT MEANS-text). "Genuine algorithmic
      independence" in that clause's own context was designed to test whether a
      code-independent second route would still confirm BATCH-fbb639's original D_route=0.0
      finding, distinguishing "the observable's dispersion is real" from "the original
      agreement was a code-sharing artifact." This batch's own executed test for hkz IS
      code-independent (both reviews independently verify the reduction/enumeration step
      shares no code with the barred lineage) but is NOT quality-matched: it necessarily
      compares an LLL-quality route against ROUTE-P's HKZ-quality pipeline, an entirely
      different, orthogonal variable from code-sharing. Given both reviews' convergent
      finding that this quality mismatch, not code-sharing, is the better-supported
      explanation for the observed disagreement (see hkz_qualification_citable_wording), the
      test PREREG-4 part (b) actually ran for hkz does NOT isolate whether BATCH-fbb639's
      original EXCEEDS verdict was a code-sharing artifact -- the Red Team's second,
      independently-coded LLL implementation shows ANY LLL-quality route disagrees with
      ROUTE-P's HKZ-quality pipeline by roughly this much, REGARDLESS of whether
      BATCH-fbb639's original ROUTE-I was code-shared or not. THE ANTECEDENT OF THE REVISIT
      CONDITION -- A GENUINE, QUALITY-MATCHED TEST OF WHETHER CODE-INDEPENDENCE ALONE
      CHANGES THE ANSWER -- IS THEREFORE NOT SATISFIED FOR hkz BY THIS BATCH'S OWN
      CONVERGENT FINDING. ITS CONSEQUENT ACCORDINGLY DOES NOT FIRE FOR hkz: BATCH-fbb639's
      hkz EXCEEDS verdicts are NOT flagged methodologically unsupported on this batch's
      evidence alone.
      THIS IS A COORDINATOR-LEVEL RULING, STATED AS SUCH, THAT GOES BEYOND WHAT EITHER
      REVIEW LITERALLY RECOMMENDED. Both the Validator (required_corrections RC-V1) and the
      Red Team (next_concrete_action), having verified the branch fires correctly per
      PREREG-4's literal mechanical rule, recommended applying the flag with the causal
      attribution corrected rather than withholding the flag. I judge the stronger reading
      correct because the flag's entire PURPOSE, as DEC-20260813-28d7b2 itself states, is to
      record that "the EXCEEDS verdicts reported in BATCH-fbb639 were a methodological
      artifact of code-sharing, not a finding about lam1n/hkz" -- and recording that
      specific causal claim about hkz, when this batch's own convergent evidence shows it is
      NOT the better-supported explanation, would misinform a future reader more than it
      would inform one. This does not reopen, weaken or contest either review's own
      findings -- both are carried at full weight above -- it is a judgment about what
      RECORDING THE FLAG, as opposed to recording the qualified wording alone, would
      communicate to a reader who does not read past the flag itself.
      hkz's BATCH-fbb639 EXCEEDS VERDICTS THEREFORE REMAIN EXACTLY AS QUALIFIED BY
      BATCH-fbb639's OWN CLOSE (DEC-20260813-28d7b2's central-finding qualification: worth
      stating on the covered cells, under code-shared cross-environment reproducibility, not
      under independent verification) -- NEITHER NEWLY CONFIRMED (T-INDVERIFY-CONFIRMED did
      not fire for hkz; SOME-ARTIFACT held at all 6 hkz covered cells) NOR NEWLY FLAGGED
      METHODOLOGICALLY UNSUPPORTED ON A CODE-SHARING BASIS.
      T-INDVERIFY-ARTIFACT-PARTIAL ITSELF, AS THE MECHANICALLY-FIRED BRANCH, IS NOT
      REOPENED, RE-SCORED OR REVERSED BY THIS RULING -- exactly as PREREG-4 2.8's own text
      requires ("this does NOT retroactively change T-C3LANE-OPEN-PARTIAL"), and by the
      identical logic this ruling does not retroactively change T-INDVERIFY-ARTIFACT-
      PARTIAL's own firing either. What changes is only what a future reader may conclude
