  - "no reduction above d=40 occurred anywhere, independently verified by both reviews
    (Validator AC-10; Red Team's own no-reduction confirmation)"
  - "both archive commits' change-set equality and hash verification, independently
    re-run by both reviews via their own git plumbing (Validator AC-1..AC-5; Red Team's own
    'Commit verification' section)"
  - "the reduction-quality-confound account for hkz's disagreement (see
    hkz_qualification_citable_wording below), found INDEPENDENTLY BY BOTH REVIEWS via
    different methods -- the Validator's pattern-correlation analysis of the lead's own
