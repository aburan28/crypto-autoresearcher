  # NAMED DRAFTING GAP IN PREREG-4 -- BOTH READINGS RECORDED, NEITHER RESOLVED
  # ==================================================================
  f1_prereg4_drafting_gap: >-
    Validator F-1, MINOR-TO-MODERATE, single-source, NOT a producer defect. PREREG-4 section
    2.2 point 1 literally bars copying code that "turns the frozen instance matrix A into a
    basis object ready for reduction" -- on its face this covers build_basis -- while point 3
    explicitly licenses only reconstructing "the SAME numeric matrix A", narrower language
    that does not, in so many words, extend to the block-matrix embedding
    B=[[I_k,A],[0,qI_{d-k}]]. The lead's make_A_indep/build_basis_indep are line-for-line
    structurally identical to the barred lineage's make_A/build_basis. BOTH READINGS ARE
    RECORDED, NEITHER RESOLVED HERE. Reading A (the Validator's own judgment, defensible):
    the block-matrix assembly is a deterministic, zero-degrees-of-freedom function of A and
    the lattice's own public definition, properly read as covered by point 3's SAME license,
    because (i) there is no algorithmic choice space here the way there is in a reduction
    algorithm, (ii) point 3's own final sentence names the REDUCED basis and the OBSERVABLE
    EXTRACTION -- not the pre-reduction embedding -- as the protected surface, and (iii)
    treating identical B-assembly as a violation would make PREREG-4's own construction
    unsatisfiable by design, since every route in this corpus must reduce the SAME numeric
    basis for the comparison to test anything at all. Reading B (a stricter reading a future
    reader could reach): point 1's literal text names the basis-construction step without
    qualification, and a stricter drafting would require it to be named explicitly as
    licensed rather than inferred from point 3's narrower text. THIS DOES NOT CHANGE ANY
    NUMBER, VERDICT OR TERMINATION-BRANCH READING IN THIS BATCH -- the reduction/enumeration
    step, which actually determines every reported D_route' value, is independently
    verified genuinely non-code-shared regardless of how this gap is read. Named here as a
    DRAFTING GAP IN PREREG-4 for a future pre-registration in this lineage to close
    explicitly (e.g. by naming the block-matrix assembly step, not only the matrix A itself,
    as licensed), NOT SILENTLY RESOLVED EITHER WAY.

