  obstruction:
    statement: >-
      A character-tower membership filter built from a Semaev summation
      polynomial's own branch discriminants, where each branch value is
      itself computed via elliptic-curve point addition on already-fixed,
      already-on-curve factor-base coordinates, can never reject a
      genuine on-curve candidate target -- because the discriminant's
      quadratic character reduces identically to the target's own
      on-curve membership test (f(T) is a square), which is guaranteed
      true for every genuine relation-search candidate by definition of
      being a curve point.
    quantity: >-
      chi(disc_branch(T)) / chi(f(T)), ratio, for every branch, every
      tested m, every tested curve
    value: "1 (identical), exactly, at all 6 tested (p,m) cells and generically for any (A,B) by symbolic derivation"
    measured_by: [RUN-MONO-7f39bf-3, RUN-MONO-7f39bf-4]
    scope: >-
      This specific construction (branch values obtained via EC point
      addition on fixed on-curve coordinates, discriminant taken in the
      free/target variable), m in {4,5}; the identity's derivation is
      curve-generic.
