evidence:
  id: EV-MLKEM-59e4a4
  hypothesis_id: H-MLKEM-7d9bcc
  hypothesis_id_note: >-
    Same hypothesis the predecessor evidence EV-MLKEM-e4189c is bound to. This
    batch adds a tour-level observation at one of that record's own bases; it
    does not move the hypothesis, whose status is unchanged by this record.
  experiment_ids: []
  experiment_ids_note: >-
    No EXP-* contract was frozen for this work. RT-CTRL-1 is a Red-Team-requested
    control dispatched directly by DEC-20260824-526f89 under GOAL-MLKEM-005's
    next_action, executed as TASK-20260824-b3e9da in BATCH-f9780d.
  run_ids: []
  run_ids_absent_reason: >-
    EMPTY, AND THIS IS A DISCLOSED GAP RATHER THAN AN OMISSION. The producer
    wrote a results JSON, not a RUN-* manifest, so no run record exists to
    reference and naming one would be a fabricated identifier. The two
    executions are identified instead by their archived artifacts and
    timestamps, all receipt-bound at commit e17d95cbfdfcdb047c682c89a626745fe53b72e2:
    attempt 2 (run of record) 2026-08-25T06:21:19Z to 11:12:59Z, exit 124;
    attempt 1 05:13:39Z to 06:21:08Z, killed by the runtime at ~4030 s with its
    artifacts preserved under *.attempt1_killed.*. That the harness produced no
    run manifest for a dispatched producer is itself an instrument gap and is
    named in DEC-20260824-5e222e's next_action.
  run_ids_note: >-
    Attempt 2 is the run of record (2026-08-25T06:21:19Z to 11:12:59Z, exit 124
    at its own timeout). Attempt 1 (05:13:39Z to 06:21:08Z) was terminated by the
    runtime background-task manager at ~4030 s, far inside the 21600 s ceiling;
    its artifacts are preserved under *.attempt1_killed.* and receipt-bound. It
    is listed because it independently reproduced the 75-bit result, not because
    it completed.
  type: instrument_control
  direction: neutral
  direction_note: >-
    NEUTRAL, and not for want of a signal: the designed contrast has data on ONE
    side only. No direction on precision at tour level is licensed by this batch.
  observations:
    - >-
      Cell mpfr_bits=75 (the REFERENCE arm) reached a TERMINAL ERROR,
      "ReductionError: b'infinite loop in babai'", at 3051.823137998581 s on
      attempt 2 and 2974.328118801117 s on attempt 1 -- two independent attempts,
      seed_used 452658293 in both, identical error string.
    - >-
      The failure is NOT at BKZ.Param. Outer LLL completed (498.9597418308258 s /
      508.58293199539185 s), the mpfr GSO was built (gso_float_type_used "mpfr"),
      and the content-pinned strategies file opened. The task card's
      `either_errors_at_BKZ_Param` instrument-failure branch does not apply.
    - >-
      Cell mpfr_bits=100 (the TARGET arm) produced NO RECORD. It ran at least
      14448 s, was SIGTERM'd at the wall-clock cap, and has no entry in the
      results JSON at all: no status, no tours, no root-Hermite factor, no
      seed_used, no error string. Nothing was estimated or inferred.
    - >-
      The strategies input was bound by CONTENT, sha256
      f516b0a6f0c580cff72e1e2c3562c44dc6f17e8f99613e9e4020e35481b27a18, identical
      across the recorded cell and archived beside the runner. The Validator
      independently confirmed it is a genuinely tuned schedule (101 entries;
      block 55 carrying preprocessing_block_sizes [36] and 21 pruning
      parameters), not the pruning-free substitute.
  admissible_now:
    - >-
      At (d=512, beta=55, seed 452658293, q=3329, fpylll 0.6.4, mpfr_bits=75), a
      full BKZ reduction terminates in a ReductionError rather than completing,
      reproducibly across two attempts in this container, under strategies bytes
      DIFFERENT from those of every prior recorded run of this cell. The failure
      is therefore not an artefact of the absent libfplll8 strategies file.
  not_admissible_now:
    - >-
      Anything about mpfr_bits=100 at tour level. The cell produced no record.
      Its >= 14448 s runtime is a LOWER BOUND ON AN UNFINISHED COMPUTATION -- not
      a cost, not a completion, and not evidence that higher precision avoids the
      error.
    - >-
      Any comparison against the predecessor's 2502.74 s. That is a
      cross-container figure under unrecoverable strategies provenance, and it is
      itself a FAILURE time, not a cost -- DEC-20260815-3e8e9c says so in terms.
    - >-
      Any statement about ML-KEM at any FIPS 203 parameter set. Claim tier is toy
      and this is one basis at one dimension.
  validator_verdict: incomplete
  validator_verdict_note: >-
    VAL-20260824-bc488d (TASK-20260824-bc488d), independent session reading
    snapshot e17d95cbfdfcdb047c682c89a626745fe53b72e2. Explicitly not `passed`
    (the producer's own completion-gate item 1 fails on its face; three of six
    gate items are checkable on one cell only; two metrics the gate names were
    unrecordable even on success), not `failed` (the missing cell is a wall-clock
    cap plus a recording defect -- infrastructure, never negative evidence), and
    not `invalid` (nothing unsound, fabricated or hand-edited). All 15
    path_sha256 recomputed from both commit blobs and disk: 15/15, zero
    mismatches.
  red_team_verdict_summary: >-
    RT TASK-20260824-6fc282, independent session, nine probes run in-container.
    Its own framing: "This batch establishes less than it looks like, and it
    establishes less than it could have for the compute it spent -- but the
    specific thing it does establish (the 75-bit failure is terminal,
    reproducible, and not at BKZ.Param) is solid and I do not challenge it."
  arithmetic_errors_disclosed:
    - >-
      OBJ-1 / R-3a and M-6, reached independently by both reviews: THE INSTRUMENT
      COULD NOT HAVE RECORDED A SUCCESS EVEN IF IT HAD GOT ONE. fpylll never
      assigns a `tours` attribute (0 occurrences in bkz or bkz2, verified after a
      real BKZ call), so a COMPLETED cell would have written tours: null; and the
      runner's root-Hermite formula computes b0^(1/d)/q^(1/2) where the
      definition requires (b0/q^(1/2))^(1/d), wrong by q^(1/2-1/(2d)) = 57.242 at
      d=512. Nothing recorded is wrong only because no cell completed.
    - >-
      OBJ-4, MEASURED rather than argued: per-operation parity in the 2-limb
      regime HOLDS (update_gso ratio 100/75 bits 0.937 at d=128, 1.017 at d=256;
      at tour level d=80/beta=55 completes in 274.29 s at 75 bits and 277.56 s at
      100 bits, 1.2 per cent apart, with IDENTICAL tour counts of 26). But TOTAL
      cost parity does not follow from per-operation parity, because total =
      per-operation cost x operation count and operation count is exactly what
      precision moves. The budget model asserted the premise that was true and
      irrelevant.
  budget_and_cap_compliance: >-
    Cumulative 21538 s (producer-reported) against a 21600 s ceiling; the
    Validator's recomputation from the archived timestamps gives 21549 s, leaving
    51 s of headroom. The CEILING ended the task, not a scientific stopping
    point. Reporting marks at 3600 s and 14400 s were both passed and reported.
  strength: single_run
  strength_basis: >-
    The 75-bit observation is reproduced twice in this container and, on the
    committed record, once on a different host in the predecessor batch -- which
    would ordinarily support `replicated`. It is recorded as `single_run` because
    the BATCH's designed object, the matched pair, has one arm with no data at
    all, and because both reviews record AGENTS.md rule 12 as UNMET AND UNWAIVED:
    producer, Coordinator, Validator and Red Team are all the same model family,
    so their agreement is correlated judgement and is not independent
    corroboration.
  claim_tier: toy
  claim_tier_note: >-
    d=512, beta=55, q=3329, one seed, one container, one host. No transfer to
    FIPS 203 is asserted and none is available from this record.
  certificate_refs: []
  proof_status: empirical_only
  proof_status_note: >-
    An instrument observation and two independent reviews of it. No theorem, no
    derivation of a cost, and no solve or relation is claimed, so no certificate
    is due (docs/claims-and-verification.md).
  proof_refs: []
  boundaries:
    - The executed unit is NOT "one full BKZ tour". BKZ.Param(block_size=55, flags=BKZ.AUTO_ABORT) has max_loops == 0 and BKZReduction loops `while True`, so it is a full reduction of unbounded tour count. Inherited wording defect from GOAL-MLKEM-005.next_action and DEC-20260815-3e8e9c, not an executor deviation.
    - Localisation of the exception to a TOUR is NOT supported by this batch's artifacts. The runner stores only the exception type and message, so the failure is bracketed to the interval between the LLL.Reduction construction and the return of bkz(par) -- an interval that still contains BKZ.Param and the pre-tour lll_obj call.
    - The matched-pair property (same basis, same seed, same strategies bytes, differing only in mpfr_bits) is established from the PINNED SOURCE plus the Validator's re-execution of its preamble. It is NOT an observation of the 100-bit run, which wrote nothing.
  unresolved_confounds:
    - Cell ORDER is uncontrolled -- 75 always first, never counterbalanced -- so any cross-cell wall-clock difference would confound precision with position. Bounded at about 3 per cent by the repeat-measurement spread, and costless here because one cell has no data.
    - The reference container's strategies bytes and libfplll8 version are unrecoverable, so cross-container byte-identity cannot be restored by any future run.
  reviewed_by: [TASK-20260824-bc488d, TASK-20260824-6fc282]
  review_sources:
