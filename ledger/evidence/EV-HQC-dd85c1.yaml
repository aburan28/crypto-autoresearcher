  run_ids: []
  run_ids_note: 'NO RUN EXISTS AND NONE IS CLAIMED. This record covers an ANALYSIS deliverable produced
    without any invocation of stage_a.py, measure.py, or any sampler: TASK-20260807-db4230''s
    reanalysis_report.md and required_t_derivation.py, committed on main at f4bcb89ab ("research:
    GOAL-HQC-001 matched-pair reanalysis + required-T derivation (TASK-20260807-db4230)") under
    coordination/goals/GOAL-HQC-001/batches/BATCH-2ecaa1/tasks/TASK-20260807-db4230/. The empirical
    inputs it reasons over are the already-committed artifacts of TASK-20260806-77a574 (snapshot
    17d5fb54, covered by EV-HQC-67a6ec) and the two BATCH-2ecaa1 review reports. Cited by path, per this
    campaign''s established convention for coordination-task artifacts.'
  type: theoretical
  type_note: 'Deliberately NOT "empirical". Nothing was measured. Section 1 of the deliverable is a
    structural argument read off committed code and committed shard indices; Section 2 is algebra over
    constants copied verbatim from committed artifacts. Its empirical inputs are other records'' (EV-HQC-67a6ec''s)
    measurements, and this record inherits their limits without adding a new observation of its own.'
  direction: neutral
  strength: inconclusive
  strength_note: '"inconclusive" is chosen over "preliminary" deliberately and describes the
    CAMPAIGN-LEVEL question, not the deliverable''s workmanship. On the question this analysis was
    dispatched to settle -- does the injected V3 defect propagate to a detectable joint-moment effect --
    the record still cannot discriminate between "genuinely near zero" and "real at ~0.19-0.21 log2
    units at k=17". Two components of the deliverable are individually firm and are recorded as such in
    observations O2 and O5: the structural impossibility finding (checkable against committed code) and
    the arithmetic of the required-T table (re-verified, see O5). Firm components of an analysis do not
    raise the strength of an undiscriminated conclusion.'
  claim_tier: toy
  claim_tier_note: 'TOY, HARD CEILING, inherited unchanged from EV-HQC-67a6ec and RQ-HQC-001. PS-R3
    reduced parameters (n=7187, n_e=56, N=7168, m_load_bearing_order=17, per pilot_results.json), one
    defect class (V3, last-block-window-read-early), one injection point (decode_blocks, block n_e-1),
    T=5,000 per arm. NOTHING HERE IS A STATEMENT ABOUT HQC''s IND-CCA security, its decoding-failure
    rate, assumption A17 or A5, or any standardized parameter set.'
  certificate_refs: []
  certificate_refs_note: 'No solve, relation, or factor-base claim is made or implied; the deliverable
    itself declares certificate.kind = none (reanalysis_report.md preamble). certificate_refs is
    correctly empty rather than omitted.'
  proof_status: derivation
  proof_refs:
  - coordination/goals/GOAL-HQC-001/batches/BATCH-2ecaa1/tasks/TASK-20260807-db4230/reanalysis_report.md
  - coordination/goals/GOAL-HQC-001/batches/BATCH-2ecaa1/tasks/TASK-20260807-db4230/required_t_derivation.py
  - coordination/goals/GOAL-HQC-001/batches/BATCH-2ecaa1/reviews/TASK-20260806-92aecb/red_team_report.md
  - coordination/goals/GOAL-HQC-001/batches/BATCH-2ecaa1/reviews/TASK-20260806-8d4d48/validation_report.yaml
  proof_status_note: 'derivation, not empirical_only and not certificate. The load-bearing claims of this
    record are (a) an impossibility argument that follows from committed code and committed shard
    indices, and (b) a closed-form power calculation whose inputs are all cited constants. Both are
    checkable by re-reading the cited artifacts and redoing the arithmetic; neither rests on a new
    observation. No counterexample certificate is available or applicable.'
  observations:
  - 'O1. WHAT IS UNDER REVIEW AND WHAT AUTHORIZED IT. DEC-20260806-9a4551 closed BATCH-2ecaa1 with
    disposition refine and named exactly one next action in three ordered steps: (1) a matched-pair
    reanalysis of TASK-20260806-77a574''s already-collected pilot data, free and requiring no new
    sampling; (2) a real required-T derivation from the defect''s own measured 10.7 percent local effect
    size; (3) ONLY IF GENUINE AMBIGUITY REMAINS after (1) and (2), a positive-control pilot at a
    less-diluted injection point (V1). Steps (1) and (2) were executed by TASK-20260807-db4230 and are
    committed at f4bcb89ab. This evidence record is their first adjudication; none existed before.'
  - 'O2. STEP (1) WAS ATTEMPTED AND IS STRUCTURALLY IMPOSSIBLE ON THE PILOT''S OWN DATA. Two independent
    facts, each checked against committed code and each alone sufficient for this dataset.
    (a) RETENTION: pilot_injection.py never serialized the per-trial failure-indicator array F_all (or
    per-trial S in trial order); pilot_results.json carries only each arm''s WHOLE-ARM S_histogram, a
    np.bincount that destroys trial identity, so per-trial values are unrecoverable even within one arm.
    Independently corroborated by the Validator, who had to REGENERATE raw per-trial F arrays with its
    own wrapper rather than read them from the committed JSON (validation_report.yaml,
    metric_recomputations, first entry).
    (b) DESIGN: the two arms used DISJOINT PRNG shards -- 5000 defected, 6000 undefected -- and
    stage_a.py keys each shard by sha_key(ps_id, "T", shard, MASTER_SEED), so defected trial i and
    undefected trial i are drawn from independent streams. NO MATCHED PAIR EVER EXISTED TO RECOVER.
    This second fact is the deeper one: it holds regardless of what was written to disk. The
    between-shard design is therefore not a data-retention gap that better serialization would have
    avoided; it is an irreversible design choice, and the moment to make it differently has passed for
    this dataset.'
  - 'O3. THE NEAREST EXISTING SUBSTITUTE NARROWS THE AMBIGUITY WITHOUT RESOLVING IT. The only
    matched-pair measurement of the propagated effect anywhere in this campaign''s committed record is
    the Red Team''s own Probe 2 (red_team_report.md section 0), collected INDEPENDENTLY on fresh shard
    424242 -- it is not, and the deliverable does not present it as, a reanalysis of the pilot''s data.
    At k=17, T=5,000 matched pairs: point_true = -0.9360, point_def = -0.7438, diff = +0.1922, SE
    unpaired (independent-arm quadrature) = 0.5514 giving z = 0.349, SE matched-pair jackknife = 0.1982
    giving z = 0.970; local (block-level) flip rate 533/5000 = 0.1066 at z about 24.4. The correctly
    specified instrument at the same trial count therefore clears NEITHER a significance bar (|z| >=
    1.96) NOR a clean-null bar; its approximate 95 percent interval, 0.192 +/- 1.96 x 0.198, contains
    both zero and effects several times the point estimate. AMBIGUITY IS NARROWED, NOT RESOLVED.'
  - 'O4. THE SIGN IS UNSTABLE ACROSS THREE INDEPENDENT SAMPLES, NOT TWO -- A CORRECTION TO THE
    TWO-SAMPLE FRAMING. The record contains three independent estimates of the k=17
    defected-minus-undefected difference: the pilot itself (between-shard, shards 5000/6000, T=5,000 per
    arm) diff = -0.20690654775122042, combined jackknife SE = 0.44367723947809695, z =
    -0.46634474194485875 (pilot_results.json, defected_minus_undefected, k=17, is_prespecified_cell:
    true); the VALIDATOR''s own fresh between-shard sample at shards 7777/7778, T=2,000 per arm, diff =
    +0.5082, SE = 0.8292, z = +0.613 (validation_report.yaml, independent_reproduction, fourth check);
    and the Red Team''s fresh matched-pair probe, diff = +0.1922 (O3). TWO OF THE THREE ARE POSITIVE,
    and the third is the pilot''s own. The accurate statement is therefore "the sign of this difference
    is unstable across independent samples at T of a few thousand", NOT "the unpaired estimate is
    negative and the paired estimate is positive" -- the Validator''s third estimate is unpaired AND
    positive AND the largest in magnitude, which the two-sample framing omits. Both reviewers noted the
    sign was not predicted a priori (design.md section 4). Sign instability at this magnitude is what an
    effect small relative to the T=5,000 noise floor looks like; it is consistent with, and not proof
    of, a small or zero propagated effect.'
  - 'O5. STEP (2) WAS DELIVERED, AND ITS ARITHMETIC RE-VERIFIES. required_t_derivation.py applies
    T_req = T0 x (SE(T0) x z / delta)^2 with T0 = 5,000 and SE(T0) = 0.1982 (the Red Team''s matched-pair
    jackknife SE at k=17). Matched-pair design: 20,426 (delta=0.1922, z=1.96) / 41,686 (delta=0.1922,
    z=2.80); 17,625 / 35,970 (delta=0.20690654775122042); 18,864 / 38,498 (delta=0.20). Between-shard
    cross-check: 158,092 / 322,636 (Red Team unpaired SE 0.5514); 88,331 / 180,267 (pilot SE 0.4437).
    The specification''s own undefected-estimator T_req, 3.09e5, is cited by the script for scale only
    and is a different target quantity. VERIFICATION PERFORMED: the session driving this Coordinator
    role re-executed required_t_derivation.py and reports that its printed values reproduce the report''s
    tables verbatim; the Coordinator additionally re-derived every cell above by hand from the cited
    constants and confirms each to the digits shown. The primary stated range, T_req about 1.8e4 to
    4.3e4, is a rounding of the exact bracket [17,625, 41,686]; 41,686 rounds to 4.2e4, so the report''s
    upper figure is generous by about 3 percent. Immaterial, recorded for exactness.'
  - 'O6. CORRECTION TO THE DELIVERABLE''S HEADLINE POWER-DEFICIT FIGURE. reanalysis_report.md section 2
    states the matched-pair T_req is "roughly 5-18x smaller than the between-shard design''s derived
    T_req for detecting the identical effect size". THE 18x IS NOT A LIKE-FOR-LIKE COMPARISON. At fixed
    delta and fixed z the ratio is exactly (SE_unpaired / SE_paired)^2, independent of both: with the
    Red Team''s own two SEs from ONE dataset, (0.5514/0.1982)^2 = 7.74 (equivalently, the reported 2.78x
    SE ratio squared, 2.782^2 = 7.74), and substituting the pilot''s between-shard SE, (0.4437/0.1982)^2
    = 5.01. The report''s 18x is obtained by dividing the SMALLEST matched-pair cell (17,625, at
    delta=0.2069 and z=1.96) by the LARGEST between-shard cell (322,636, at delta=0.1922 and z=2.80) --
    crossing both delta and z. THE DEFENSIBLE FIGURE AT THE LOAD-BEARING CELL k=m=17 IS 5.0x TO 7.7x,
    with 7.7x being the single-dataset like-for-like value. The direction of the finding is unchanged
    and remains substantial; its magnitude was overstated by about 2.4x at the top end. Separately, the
    2.8x-10.6x SE range quoted throughout this campaign is a range ACROSS k (2.78x at k=17, about 10.6x
    at k=2, about 1.63x at k=24, per red_team_report.md section 0), not a range at the load-bearing
    cell; in required-T terms those correspond to about 7.7x at k=17, about 112x at k=2 and about 2.7x
    at k=24.'
  - 'O7. THE REQUIRED-T FIGURES ARE MODELED, NOT MEASURED, AND THE MODEL IS UNVERIFIED. The derivation
    assumes the matched-pair jackknife SE scales as 1/sqrt(T). The deliverable states this limitation
    itself and flags it as an assumption rather than a measured scaling law, correctly: only ONE trial
    count (T=5,000) of matched-pair data exists anywhere in the record, so the exponent has never been
    fitted or checked at a second T for this design. Every T_req figure in O5 inherits that assumption,
    and so does any budget sized from it.'
  - 'O8. THE SINGLE INPUT THE WHOLE DERIVATION RESTS ON IS UNREPLICATED AND ITS SOURCE CODE IS NOT
    COMMITTED. SE_paired(T=5000, k=17) = 0.1982 and diff = +0.1922 come from the Red Team''s Probe 2,
    which red_team_report.md section 7 describes as two short scratch scripts of about 20 wall-seconds,
    reproducible from the sha256-pinned imports but NOT committed to the repository. No second party has
    reproduced them. The number is honestly reported and its provenance is fully disclosed by its
    author; the gap is that a figure now sizing the campaign''s next experiment has one source, one
    session, one shard (424242), and no committed script. Recorded as a limitation of the evidence base,
    not as an allegation about the Red Team''s work.'
  - 'O9. A STRICTLY CHEAPER RECONSTRUCTION EXISTS, ITS FEASIBILITY IS ALREADY DEMONSTRATED, AND THE
    EXECUTOR CORRECTLY DECLINED TO RUN IT. Because stage_a.py''s PRNG is a deterministic function of the
    committed shard index, re-decoding the already-committed shard 5000 through the UNMODIFIED
    decode_blocks (and shard 6000 through the defected wrapper) reconstructs genuine matched pairs at
    T=5,000 per shard with ZERO new entropy. The deliverable identifies this and estimates roughly 2-3
    core-seconds per arm. IT IS STRONGER THAN THE DELIVERABLE CLAIMS: the Validator has ALREADY executed
    the forward half of exactly this procedure and obtained S-histograms BIT-IDENTICAL to
    pilot_results.json''s committed arrays (validation_report.yaml, independent_reproduction, "exact
    reproduction of the executor''s committed shards"), so the determinism this reconstruction depends
    on is demonstrated in the committed record rather than assumed. What the Validator did NOT do is the
    CROSSED configuration -- shard 5000 undefected, shard 6000 defected -- which is precisely the
    missing half of each pair. The executor declined to run it because its brief forbade any new pipeline
    invocation, read conservatively, and flagged it for Coordinator authorization instead. That refusal
    was correct: a budgeted scope is not renegotiated by the agent operating under it.'
  - 'O10. PROCESS OBSERVATION, RECORDED HONESTLY RATHER THAN OMITTED. TASK-20260807-db4230 ran WITHOUT a
    committed task card and WITHOUT a handoff envelope. Neither
    coordination/goals/GOAL-HQC-001/batches/BATCH-2ecaa1/tasks/TASK-20260807-db4230/task_card.yaml nor
    ledger/handoffs/TASK-20260807-db4230.yaml exists, and the BATCH-2ecaa1 dispatch_queue.json contains
    no entry for it (its five tasks are
    TASK-20260806-77a574, -1281e1, -8d4d48, -92aecb, -8d6974). Its artifacts were written into
    BATCH-2ecaa1''s task directory AFTER that batch''s ledger archive TASK-20260806-8d6974 had already
    completed, so they fall under no archival task of that queue. It was produced on branch
    claude/run-remaining-experiments-jymjz4 and merged as f4bcb89ab. IT RECEIVED NO INDEPENDENT
    VALIDATOR OR RED TEAM REVIEW. ITS STATUS IS THEREFORE A COORDINATOR-VERIFIED ANALYSIS DELIVERABLE,
    NOT AN INDEPENDENTLY REVIEWED ONE. NO REVIEW VERDICT AND NO ATTESTATION IS RECORDED FOR IT HERE,
    BECAUSE NONE WAS OBTAINED. The Coordinator''s own verification is limited to what O5 and O6 state:
    reading the sources, re-deriving the arithmetic, and finding one overstatement.'
  - 'O11. THE DERIVED REQUIRED-T IS AFFORDABLE, BY ARITHMETIC ON COMMITTED THROUGHPUT FIGURES. Measured
    full-pipeline throughput is about 2,100 trials/core-second (executor: 2,097.6 defected / 2,105.6
    undefected; Validator''s independent 4-repeat means 2,090.8 / 2,096.6 with std about 48). At that
    rate 41,686 trials cost about 20 core-seconds to generate and decode once; a matched-pair design
    needs a SECOND decode pass over the same trials, whose cost is bounded above by another full
    pipeline pass, so the total lies between roughly 20 and 40 core-seconds. THE DECODE-ONLY FRACTION
    HAS NEVER BEEN MEASURED SEPARATELY IN THIS CAMPAIGN AND IS NOT ESTIMATED HERE; the bound is stated
    rather than a point figure invented. For scale, EV-HQC-bfb257''s cost model priced the FULL
    T_req = 3.09e5 run at 139-392 core-seconds. The consequence is material for prioritization: the
    "expensive full-scale commitment" the campaign has been deferring for two batches is, at PS-R3, a
    few hundred core-seconds, and the derived matched-pair T_req is an order of magnitude below that.'
  inference: 'DEC-20260806-9a4551''s step (1) is DISCHARGED AS IMPOSSIBLE rather than completed: the
    pilot''s committed data structurally cannot yield matched pairs (O2), and the closest existing
    matched-pair evidence narrows the ambiguity without resolving it (O3, O4). Step (2) is DELIVERED and
    its arithmetic re-verifies (O5), subject to one corrected headline figure (O6), one unverified
    scaling assumption (O7), and one unreplicated load-bearing input (O8). THE PRECONDITION OF STEP (3)
    -- "only if genuine ambiguity remains" -- IS THEREFORE MET, on the deliverable''s own analysis and
    on this Coordinator''s independent check of it. What the analysis additionally establishes, and what
    DEC-20260806-9a4551 could not have known when it wrote its three steps, is that the ordering it
    fixed is no longer the cheapest information-per-cost path: a deterministic zero-entropy
    reconstruction of the pilot''s own shards is available and already demonstrated feasible (O9), and
    the derived matched-pair T_req is affordable at a few tens of core-seconds (O11), so the design that
    can actually discriminate the two competing explanations is now within reach of a single bounded
    task. THIS RECORD ASSERTS NOTHING ABOUT HQC. It bears on the campaign''s instrument and on how to
    spend its next tens of core-seconds, and on nothing else.'
  boundaries:
  - 'TOY, HARD CEILING. PS-R3 reduced parameters only (n=7187, n_e=56, N=7168, k=m=17), one defect class
    (V3, last-block-window-read-early), one injection point (decode_blocks block n_e-1), T=5,000 per
    arm, one estimator, one solver. No statement about HQC''s IND-CCA security, its decoding-failure
    rate, assumption A17 or A5, or any standardized parameter set. No extrapolation to standardized
    parameters is made, and none is licensed: standardized-parameter real-sampler runs remain out of
    scope and unauthorized.'
  - 'THIS IS ANALYSIS AND ARITHMETIC OVER ALREADY-COMMITTED ARTIFACTS, NOT A NEW MEASUREMENT. No sampler
    was invoked, no PRNG draw was made, no trial was run, and no new observation of any kind was
    produced. Every empirical input belongs to records that already exist (EV-HQC-67a6ec and the two
    BATCH-2ecaa1 review reports) and this record cannot be stronger than they are.'
  - 'NOT INDEPENDENTLY REVIEWED. Per O10, TASK-20260807-db4230 had no task card, no handoff envelope, no
    queue entry, and no Validator or Red Team pass. Nothing in this record may be cited as
    independently reviewed, and no review verdict or attestation is recorded for it because none was
    obtained.'
  - 'H-HQC-18d1b4 IS UNTOUCHED IN EITHER DIRECTION AND REMAINS PROPOSED. Six consecutive batches of
    instrument-trust, feasibility, pilot and now reanalysis work have not moved it, and this record does
    not move it either.'
  - 'NONE OF THE FOUR ASYMPTOTIC-COMPLEXITY PROMOTION GATES IS ENGAGED, ADDRESSED, OR CLAIMED. This
    program advances no asymptotic-complexity claim of its own in this record.'
  - 'This record does not reopen, revise, or supersede EV-HQC-67a6ec, EV-HQC-bfb257, EV-HQC-163374,
    EV-HQC-9a30d3, EV-HQC-db1fd9 or EV-HQC-b71230, all of which stand exactly as archived. O6 corrects a
    figure stated in an UNREVIEWED coordination artifact (reanalysis_report.md), not in any committed
    evidence record.'
  unresolved_confounds:
  - 'THE PRIMARY ONE IS UNCHANGED FROM EV-HQC-67a6ec AND IS NOW SHARPER: whether a genuine
    boundary-shift defect in the real sampler would be caught by this campaign''s measurement
    methodology remains untested at adequate power. Both "the propagated effect at k=17 is genuinely
    near zero" and "it is on the order of 0.19-0.21 log2 units" remain consistent with every measurement
    on record. The single matched-pair measurement that exists gives z = 0.970.'
  - 'THE 1/sqrt(T) SCALING OF THE MATCHED-PAIR JACKKNIFE SE IS ASSUMED AND NEVER MEASURED (O7). Only one
    trial count of matched-pair data exists. If the exponent differs materially, every required-T figure
    in O5 and every budget sized from them is wrong by a corresponding factor.'
  - 'SE_paired = 0.1982 AND diff = +0.1922 ARE UNREPLICATED AND THEIR SCRIPT IS UNCOMMITTED (O8). One
    source, one session, one shard.'
  - 'The monkey-patch injection technique''s behavior under multiprocessing remains untested, carried
    forward unchanged from EV-HQC-67a6ec. A single-process pilot cannot rule out a defect that manifests
    only under parallel dispatch.'
  - 'NO POSITIVE CONTROL HAS EVER BEEN RUN THROUGH THE REAL-SAMPLER PIPELINE. Across the whole campaign
    the decode_blocks-level-defect to log2_Ahat_k detection chain has never once produced a fired cell
    from a known-present defect (red_team_report.md section 2, objection 5). Every null this campaign
    has reported through that chain is therefore uncalibrated in the controls-before-belief sense of
    docs/inventor-protocol.md.'
  - 'Mechanical soundness is established for exactly ONE of the four named injection points
    (decode_blocks), which is also the structurally easiest to wrap externally; V1 (global off-by-one)
    and the other three points remain untested at the real sampler. Carried forward from
    EV-HQC-67a6ec and red_team_report.md section 1.'
  - 'The campaign''s wall-clock accounting convention is not reconciled anywhere in the record. The
    figure "roughly 4,973 of 10,800 seconds remain" is carried forward from BATCH-2ecaa1''s checkpoint
    and repeated by reanalysis_report.md section 0; it is cited here AS THAT REPORT''S FIGURE and is NOT
    independently re-derived. Successive checkpoints report roughly 7,000, then 4,978, then 4,973
    without a stated basis for what is debited against the total. Flagged, not resolved.'
  reviewed_by: coordinator
