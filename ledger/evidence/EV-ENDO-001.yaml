  superseded_source_record_note: >-
    The last two proof_refs are REF-20260728-001, the superseded refutation record,
    committed at 457d2209. It is cited for provenance and is NOT the basis of this
    record. The basis is REF-20260728-002, which supersedes it and which adopts the
