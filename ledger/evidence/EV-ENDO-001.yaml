  - >-
    SYNTHETIC CELLS SUPPORT NO ATTACK CLAIM. The contract's higher-rank cells are
    synthetic by its own labelling, and nothing about a realizable attack follows
    from any of them.
  - >-
    TOY SCALE. One 33-bit prime, one 30-bit subgroup order, one curve, one
    secondary j = 1728 instance at 28 bits. No crypto-scale validation is claimed
    or implied.
  - >-
    THE WITHDRAWN INSTRUMENT WAS PARETO-DOMINATED BEFORE IT WAS FROZEN. About
    2^(r+1) sqrt(N) time with 2^r sqrt(N) memory against BSGS at about
    1.5 to 2 sqrt(N) time and sqrt(N) memory, and against rho at about
    0.886 sqrt(N/|Aut|) with O(w) memory and linear parallel speedup; no
    time-memory point where it wins. That is recorded in IDEA-20260727-005's own
    target_complexity.tradeoff_note, committed before the contract was frozen.
  - >-
    ALL FOUR ASYMPTOTIC-CLAIM PROMOTION GATES REMAIN OPEN. No exponent moves in
    either direction. No completion criterion of GOAL-ECDLP-001 is met or
    approached.
  - >-
    THE LEDGER DOES NOT VALIDATE. tools/validate_ledger.py exits nonzero with 986
    error lines and eleven specifications unparseable. This record neither repairs
