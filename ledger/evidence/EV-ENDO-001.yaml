  - >-
    SCOPE. The frozen J0 eigenvalue_source only; ranks r at least 3 only; prime N
    only. Nothing about r = 1 or r = 2. Nothing about family GEN. About J1728 only
    the observation that its frozen cells escape by a synthetic-draw accident, not
    by mathematics.
  - >-
    P1 IS UNDISTURBED AND P3 IS UNADJUDICATED. The index and determinant pinning at
