  type: theoretical
  direction: contradicts
  strength: strong
  strength_justification: >-
    `strong` applies to the NARROW clause in `inference` below and to nothing else.
    Its core is an algebraic identity - Vieta on a monic quadratic over the field
    Z/N - independently re-derived from the frozen contract by a non-originating
    Validator session, and instantiated by that session on a real curve with an
    embedded independent re-checker that passed 42 checks with 0 failures. It is
    NOT `replicated` in the run sense, because there are no runs to replicate; it
    is `strong` in the sense that the stated direction rests on a level-1
    counterexample certificate plus an instance-free derivation, which is the
    strongest checkable basis this claim admits. Independence is SESSION-LEVEL and
    IMPLEMENTATION-LEVEL ONLY - not model-level, not hardware-level - and
    correlated-model error between the deriving and the checking session is not
    excluded.
  claim_tier: toy
  claim_tier_note: >-
    The identity itself is instance-free and universally quantified over prime N,
    so no tier vocabulary applies to it. The tier is set by the single
    COUNTEREXAMPLE INSTANCE that certifies it - p = 4294967539 at 33 bits with
    N = 613557433 at 30 bits - which is toy under AGENTS.md rule 7. Nothing here
    is presented as crypto-scale or as scale-matched to anything, and the
    counterexample instance rules out an arithmetic slip; it does not establish
    generality, which rests on the derivation.
  certificate_refs:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/reviews/TASK-20260728-012/instantiation.json
  certificate_note: >-
    This is a COUNTEREXAMPLE certificate under docs/claims-and-verification.md,
    "Refutation artifacts", level 1. It is NOT a run certificate and NOT a claimed
    discrete-logarithm solve of any cryptographic interest: the value k = 365480133
    was CHOSEN by the producing session to build the instance, and the recovery of
    it by the C3 reduction is a demonstration on a self-constructed 30-bit
    instance. No discrete logarithm was solved to produce anything in this record.
  proof_status: certificate
  proof_status_per_clause:
    C1_P2_refutation: 'certificate (level 1) - instantiation.json plus the instance-free Vieta derivation'
    C2_definitional_defect: 'derivation (level 2)'
    C3_constructibility_and_reduction: 'derivation (level 2), instantiated on the same toy instance'
    C4_k_independent_sublattice: 'derivation (level 2), instantiated on the same toy instance'
    retraction_R1_counterexample: >-
      derivation (level 2) ONLY. The construction that voids the retracted
      two-point cap - a genuine curve-backed lambda_3 = a + b lambda_2 whose
      relation lattice has generic first minimum about N^(1/3) against
