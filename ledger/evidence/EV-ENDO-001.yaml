    confirmed nor refuted by anything here.
  - >-
    THIS RECORD MOVES NEITHER H-STR-002 NOR H-IC-001. Both remain `weakened`, per
    DEC-20260727-009 and DEC-20260727-008 respectively, and neither is touched by
