  observations:
  - >-
    ZERO RUNS. EXP-ENDO-001 has no run record, no manifest, no raw result and no
    output of any kind anywhere in the history of this branch. Nothing in this
    batch was measured.
  - >-
    SNAPSHOT INTEGRITY PASSED WITHOUT RESERVATION. Both independent sessions
    verified commit 457d220962f73a3070ebf3d9cb74354d87baf02f against Git - parent
    4f87e165 as declared, reachable from HEAD, exactly five declared paths changed,
    all five path SHA-256 recomputing from the committed blobs, clean working tree,
    and experiments/EXP-ENDO-001/specification.yaml NOT among the committed paths,
    so the frozen contract was not edited in place and the pre-registration
    ordering holds.
  - >-
    VIETA IDENTITY, RE-DERIVED INDEPENDENTLY. For prime N, if L^2 + L + 1 has a
    root in Z/N it splits, giving lambda_2 + lambda_3 = -1 and lambda_2 lambda_3 =
    1, so with lambda_1 = 1 the three eigenvalues of the frozen J0 source sum to 0
    mod N identically. The existence hypothesis N = 1 mod 3 is FORCED, not free:
    phi acts as a scalar of order 3 on the prime-order group and lambda = 1 would
    force N to divide Norm(zeta_3 - 1) = 3.
  - >-
    COUNTEREXAMPLE, COMPUTED. On y^2 = x^3 + 7 over F_p with p = 4294967539,
    N = 613557433, lambda_2 = 290635917 and lambda_3 = 322921515, the vector
    (1,1,1,0,0,0) satisfies the W_3 congruence with residue 0 and has infinity norm
    1, against a predicted N^(1/6) = 29.150266997. The on-curve form
    P + phi(P) + phi^2(P) = O returned the point at infinity - a CTRL-CERT replay
    that certifies a TRUE relation yielding NO discrete logarithm. Over the
    contract's own frozen field sizes the predicted value ranges from about 4.8 to
    about 25 while the true value is 1 at every one of them.
  - >-
    THE DEGENERACY IS SPECIFIC TO r >= 3 ON THIS TRIPLE. On the same instance,
    W_2 (dimension 4, determinant N) gave an LLL infinity-norm upper bound of 98
    against a predicted N^(1/4) = 157.4 - no collapse - and W_1 gave an exact
    infinity-norm minimum of 1081 against N^(1/2) = 24770. Both are SINGLE
    INSTANCES and neither is a distribution claim.
  - >-
    HEUR-1 AND HEUR-2 BREAK AT THESE CELLS. W_r contains a deterministic rank-2
    family of forced witnesses, giving about 3721 certain witnesses in the r = 3
    box against a Poisson mean of about 64; and HEUR-2's hypothesis explicitly
    excludes the algebraic relations forced by the endomorphism ring while its
    conclusion is asserted unconditionally, so its carve-out and its conclusion
    cannot both stand here.
  - >-
    THE LLL ROUTE OF THE PRIOR RECORD HAS AN UNSTATED GAP AND THE REPAIRED
    REDUCTION HAS NONE. LLL may return a vector with B = 0, and does on W_3, where
    it returns (0,0,0,-1,-1,-1) with A = B = 0. The deterministic replacement -
    nullspace of the basis matrix over Z/N, normalised at the first coordinate,
    with k read off coordinate r + 1 - is polynomial time, needs no LLL, has no
    failure case at any r >= 1, and recovered k = 365480133 with [k]P = Q from a
    randomly scrambled W_2 basis in which k appeared in no entry.
  - >-
    FOUR DISTINCT EFFICIENTLY COMPUTABLE SCALARS EXIST AT j = 1728, VERIFIED ON A
    REAL CURVE. p = 268435597, a = 4, N = 33555217, with phi(P) = [16416912]P,
    phi^2(P) = [-1]P and phi^3(P) = [-16416912]P. Under the contract's own
    distinct-scalar criterion J1728's genuine_r_bound would be 4, not 2, and norm-1
    congruence vectors exist for the coordinate choice (1, i, -i) that the contract
    itself freezes as J1728's eigenvalue_source. The frozen J1728 cells escape the
    collapse only because the contract declares them synthetic.
  - >-
    A GENUINE r = 3 CONSTRUCTION EXISTS THAT DOES NOT DEGENERATE. phi_3 = a + b phi
    is a genuine endomorphism on the same j = 0 curve, evaluable as
    [a]P + [b]phi(P), passing CTRL-EIGEN, with relation vector (a, b, -1); R_3 has
    determinant N in dimension 3, so a relation of norm at most X = N^(1/6) is a
    measure-zero accident. This is a DERIVATION and was not computed on a
    curve-backed triple in this batch.

  inference: >-
    THE NARROW CLAUSE, AND NOTHING WIDER. For the eigenvalue multiset
    {1, lambda_2, lambda_3} frozen in EXP-ENDO-001 at
    inputs.curve_families[J0].eigenvalue_source - lambda_2 and lambda_3 the two
    roots of L^2 + L + 1 = 0 mod N for prime N at least 3 - Vieta gives
    1 + lambda_2 + lambda_3 = 0 mod N identically, so the integer vector
    (1,1,1,0,...,0) lies in W_r(k) for every rank r at least 3 and every k, and the
    infinity-norm first minimum of W_r is EXACTLY 1 on those cells. EXP-ENDO-001
    prediction P2 and H-ENDO-001 prediction 2, which predict about N^(1/(2r))
    there, are FALSE on exactly those cells. Two supporting statements, both at
    derivation level and both scoped: for prime N the k-independent sublattice of
    W_r is exactly R_r x R_r and every vector of it is certificate-void under
    CTRL-CERT; and for the class of attacks that construct a basis of W_r(k) and
    then reduce it, the construction step already requires k, since writing down
    such a basis at any r >= 1 is polynomial-time equivalent to solving the
    instance.
  inference_forbidden_readings:
  - >-
    NOT at family level and NOT at rank level. "On family J0 at every r >= 3" is
    FALSE as a statement about the family: other curve-backed eigenvalue choices on
    the same j = 0 curves admit no short relation and the first minimum is about
    N^(1/(2r)).
  - >-
    NOT that the constructible sublattice is useless. R_r is the GLV decomposition
    lattice, whose short vectors underlie GLV scalar splitting and the
    automorphism-quotient rho walk. The retracted clause asserting that every
    attacker-writable vector carries zero information about k is FALSE and does not
    appear in this record.
  - >-
    NOT that non-constructibility is the operative mechanism for the contract's
    measured cost curve. The specified algorithm is a box enumeration that never
    constructs W_r.
  - >-
    NOT that the genuine rank bound of J0 is 2 because End(E) has Z-rank 2. That
    inference is retracted; the governing invariant is relation-freeness at
    threshold X = ceil(N^(1/(2r))), not rank.
  - >-
    NOT an impossibility claim, NOT a closure of the endomorphism lane, NOT an
    attack, NOT an attack improvement, NOT a cryptanalytic result, and NOT
    progress on any promotion gate.

  boundaries:
  - >-
    ZERO RUNS AND NO MEASUREMENT. This record interprets no measurement because
