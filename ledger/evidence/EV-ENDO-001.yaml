evidence:
  id: EV-ENDO-001
  hypothesis_id: H-ENDO-001
  experiment_ids:
  - EXP-ENDO-001
  run_ids: []
  run_ids_disclosure: >-
    ZERO RUNS EXIST. The empty list is not an omission. EXP-ENDO-001 was never
    executed, in BATCH-009 or any other batch; its Executor card TASK-20260728-005
    was cancelled before dispatch after the independent contract review returned
    REVISE, and no driver, results or runs directory was ever created. Two
    independent non-originating sessions verified this against Git
    (VAL-20260728-001 artifact_checks, RT-20260728-002 snapshot_binding). NO
