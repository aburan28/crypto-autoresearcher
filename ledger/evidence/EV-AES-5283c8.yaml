    - >-
      ITEM 2's DISCLOSED COST IS REAL, LOCATED, AND ADEQUATE — AND CARRIES
      TWO RESIDUAL COSTS THE PRODUCER DID NOT NAME. The rejection message now
      under-enumerates the accepted vocabulary (it says
      discrete_log|decomposition|none while key_recovery is accepted); the
      validator confirmed the disclosure in three committed places (a 12-line
      comment at the code site, a "KNOWN DISCREPANCY, RECORDED RATHER THAN
      HIDDEN" bullet in docs/claims-and-verification.md declaring that
      document authoritative, and the snapshot commit message) and judged it
      adequate and correctly located. It additionally named two costs the
      producer did not: (i) two downstream prose sites are now stale —
      coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-261bb4/scripts/runner.py:16
      and .../TASK-20260824-02c3e4/scripts/runner.py:16 both assert the
      narrower vocabulary; both are immutable committed coordination
      artifacts, so the remedy is a superseding note and never an edit, and
