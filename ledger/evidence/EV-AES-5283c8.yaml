      (TASK-20260901-6afe39); ITEM 4 the BATCH-286bcd opening binding
      supplement (TASK-20260901-d88346). All four were snapshot-committed at
      ee80ce45691a791638a614c441d0904775cea142 before review, and BOTH
      reviewers independently bound themselves to that commit (red team
      `snapshot_binding`; validator `snapshot_commit_read` with
      `snapshot_is_ancestor_of_head: true`). The validator recomputed all 17
      snapshot path hashes at that commit: 17 of 17 MATCH the declared
      path_sha256.
    - >-
      THE TWO REVIEWS WERE MUTUALLY BLIND AND EACH ATTESTS TO IT. The red
      team's `sibling_validation_report_read: false` carries an explicit
      attestation that it did not open, read, grep or list the contents of
      the validator's directory (one `find` line showing a budget_stamps
      file existed is disclosed). The validator's
      `read_sibling_reports: false` carries the mirror attestation, including
      the disclosure that while it worked HEAD advanced by one commit
      (27a51339b, the dispatching session's release of TASK-20260901-3ad5d2)
      whose SUBJECT LINE it read in `git log --oneline` while checking
      whether HEAD had moved, and no part of whose report it read. Blindness
      within this round is therefore declared, attested on both sides, and
      not lifted.
    - >-
      ITEM 2 (BLK-1 TOOLING FIX) HOLDS, AND IT IS THE MOST STRONGLY
      DISCHARGED ITEM IN THE BATCH. VAL J1 verdict `holds`, method
      `reproduced_in_isolated_worktree`. The validator did not accept the
      producer's or the Coordinator's byte-identical claim: it re-ran the
      validator itself on the unedited pre-fix tree and the patched tree and
      diffed the FULL ERROR-LINE SET (4 lines pre, 4 lines post, sorted-set
      diff empty; 1210 grandfathered suppressed both runs; no stale-baseline
      note), confirmed the declared patch equals the diff actually committed
      (110 lines both sides, zero hunks), and confirmed the patch applies to
      the pre-fix tree and reproduces the snapshot bytes by per-file sha256.
      It then built the controls a byte-identical whole-repo run cannot
      supply: a DISCRIMINATING probe over the pre-fix and post-fix modules
      showing the fix flips exactly the three key_recovery cases and nothing
      else; a NULL-OBJECT control over four variants (unknown kind string,
      empty string, missing key, near-miss typo "key-recovery") all emitting
      the protected literal BYTE-EXACT under both modules; a REGRESSION check
      on discrete_log, decomposition, none and decomposition-verified-false;
      an EXPLANATORY check enumerating certificate.kind across every run
      manifest under experiments/ (zero declare key_recovery: 1527 none, 126
      decomposition, 90 discrete_log, plus legacy out-of-vocabulary kinds),
      so byte-identical output is the PREDICTED behaviour of a working fix
      rather than the signature of a dead path; and a COUNTERFACTUAL in which
      it reworded the message itself and measured the producer's stated cost
      (suppression 1210 -> 1098, exactly 112 fewer; 116 = 4 + 112 errors
      emitted; the baseline contains exactly 112 lines ending in the
