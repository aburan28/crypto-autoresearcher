    - >-
      ITEM 2 DOES NOT CLOSE BLK-1, AND NEITHER PRODUCER NOR REVIEWER CLAIMS
      IT DOES. The validator states it explicitly
      (`blk1_closure_statement`: "This report does NOT declare BLK-1 closed
      ... Closure is a Coordinator decision") and the executor states the
      matching limit in its own SC-9 list: tools/cairn_bridge.py has no
      key_recovery checker, the two-implementation independent verifier
      protocol-amendment-GOAL-AES-002-001 demands is not implemented in
      harness/runner.py, and check_run enforces no structure on key_bits,
      rounds, statement.pairs or statement.key. A conforming run may now
      RECORD `kind: key_recovery`; the independent verification machinery
      that would make such a record mean anything does not yet exist.
    - >-
      ITEM 4 (ARCHIVE BINDING SUPPLEMENT) HOLDS, FULLY RECOMPUTED. VAL J2
      verdict `holds`, method `full_independent_recomputation`: the card
      asked for a SAMPLE of the declared sha256 values and the validator
      recomputed ALL of them — 44 of 44 independent hash comparisons AGREED,
      MISMATCHES 0 — plus every entry's `identical_at_head` boolean and every
      `standalone_receipt_cross_check.receipt_declared_sha256` (22 of 22
      each). `git show --name-status 6223df070` lists 22 paths, all type A,
      SET-EQUAL to the supplement's declared set, and the 22 / 2 previously
      pinned / 20 newly bound split of F-VAL4c225b-1 is independently
      CONFIRMED (1 dispatch_queue.json + 9 task cards + 10 ledger handoffs).
      Supporting claims spot-reproduced exactly: the 5 commits / 86
      insertions / 42 deletions of dispatch_queue.json churn, and the
      receipt-commit-sha discrepancy (a2073bbbf IS an ancestor of HEAD,
      2c1aebf21 is NOT, both real commits with parent 6223df070 and the same
      subject). F-VAL4c225b-1 is therefore discharged AS DESCRIBED, with the
      producer's own stated limit intact (§8): no mechanism was built to make
      tools/research_dispatch.py CONSUME the supplement; it is a descriptive
      record for Coordinator and human review, not a new machine check.
    - >-
      ITEM 1 (AMENDMENT 004) PASSES EVERY MECHANICAL CHECK THE VALIDATOR
      APPLIED. VAL J3 verdict `holds`, method `rule_applied_by_me_then_
      compared`: the validator extracted the two resolving-text blocks,
      applied each rule ITSELF to the required inputs, wrote down its own
      verdicts, and only then compared. (a) The Gap B proves-too-much control
      on the m=0 definitional reference was RE-DERIVED independently to
      BUNDLED and found FORCED, with the reading that proves too much
      explicitly foreclosed by B-1's "PROCEDURAL SEPARATION IS NOT THE TEST"
      sentence; the validator additionally checked the arithmetic the control
      guards (m=0 does not discriminate the two readings by TOTAL — both give
      2^(k-1) — so the real absurdity is DOUBLE charging, which B-1 plus B-3
      block, leaving CM-1's definitional 2^127 / 2^191 / 2^255 figures where
      CM-1 put them). (b) Gap A was executed as code: clauses A-1/A-2/A-3 and
      the red team's REJECTED candidate rule were encoded as two predicates
      and run on six inputs (three implementation techniques x two
      specification-level attack descriptions); AMD-004 is total,
      single-valued and implementation-invariant on all six, while the
      rejected rule is not — reproducing 004's stated rejection reason BY
      EXECUTION rather than reading it back. (c) amendment 001, 002, 003 and
      CM-1 are independently confirmed BYTE-UNCHANGED by sha256 over
      committed blobs at the batch's opening commit 69f52eba4 and at HEAD.
    - >-
      AND ITEM 1's REPAIR IS BROKEN, ON INDEPENDENT ADVERSARIAL READING, IN
      BOTH OF ITS TWO BLOCKS. Red team J1 disposition: BOTH BLOCKS BROKEN,
      three verdict-level splits plus one further split. GAP A: OBJ-1
      (MEDIUM_HIGH) — A-2 and A-3(i) carry NO precedence rule between them,
      while clause B-1 carries one for its own conflict case, and the most
      ordinary attack shape there is (last-round partial key guessing,
      attack Q) lands exactly in the gap: reader 1 applies A-3(i) and charges
      a determinate (N/S_k + X/X_k) AEU-k figure, reader 2 finds A-3(i)'s
      antecedent UNMET because the relabelled bytes are received element (d)
      ciphertext bytes — neither already computed nor already charged — falls
      back to A-2, and returns INADMISSIBLE / UNADJUDICABLE. OBJ-2 (HIGH) —
      A-2's two halves are NOT equivalent: the consumption test is
      INTENSIONAL and the "that is" gloss is EXTENSIONAL, and because
      ShiftRows and MixColumns are invertible F_2-linear maps, any downstream
      predicate can be PULLED BACK at specification time; attacks P and P'
      compute the same function of the same inputs with identical N and
      identical X, yet A-2 gives them opposite verdicts out of its own single
      sentence, and under the extensional reading Route 3's bar is not merely
      ambiguous but EMPTY for the whole linear layer. GAP B: OBJ-3
      (MEDIUM_HIGH) — B-1 supplies no rule for a DATA-DEPENDENT EARLY-ABORTED
      evaluation, which is neither "a full evaluation" nor any of the
      statically partial forms B-1 enumerates; on attack S the two conforming
      readers differ by the entire N-verification term (about a factor of 256
      in the worked case) and the submitter's reading is the cheaper one,
      while B-4's mandatory binary disclosure field cannot be filled honestly
      in either value. OBJ-4 (MEDIUM) — B-2 levies the charge on "the
      survivors of the last production stage", and NOTHING IN 004
      INDIVIDUATES A STAGE; attack H, written as one loop with no syntactic
      stage boundary, splits the readers by exactly the additive N_survivors
      term that AMB-6 states it is closing, and B-3's anti-abuse sentence
      does not reach it because B-3 forbids RELABELLING and attack H performs
      none.
    - >-
      THE PATTERN, NOT ANY SINGLE OBJECTION, IS THIS BATCH'S FINDING. Round
      one (RT-20260901-1af5d9) broke -003 by showing its undefined word
      "independent" admitted two verdicts; -004 defines "independent" and the
      break RELOCATES to a newly-undetermined distinction inside the
      definition — the intensional/extensional split in A-2 (OBJ-2). Round
      one broke -003's under-determined "distinct"; -004 replaces "distinct"
      with a full-evaluation test and the break RELOCATES to the word
      "stage" in B-2, which nothing individuates (OBJ-4), and to the
      unstated status of an early-aborted evaluation (OBJ-3). TWO ROUNDS OF
      SPECIFICATION REPAIR HAVE NOW FAILED THE SAME WAY. Two structural
      facts make this more than a tally. (i) OBJ-2 IS HIGH AND REQUIRES NO
      DISHONEST DESCRIPTION: attack P' is a complete, honest, fully
      A-4-compliant specification of the same attack written in pulled-back
      form from the start, so clause A-4 — which 004's own limitation L4
      names as its defence at exactly this point ("A RED TEAM SHOULD ATTACK
      EXACTLY HERE") — is STRUCTURALLY INCAPABLE of catching it, there being
      nothing concealed to disclose. (ii) OBJ-3 ESCAPES 004's OWN
      PROVES-TOO-MUCH CHECK PROVABLY: the m=0 reference cannot early-abort,
      having no stored partial state and having to finish the encryption
      before any ciphertext byte exists, so it still classifies as BUNDLED
      under both readings and the check 004 did perform cannot reach attack
      S. The red team's proof-architecture challenge locates the asymmetry
      that produced this: 004 ran a proves-too-much/nearby-object check and
      recorded a REJECTED DRAFT (B-0) for clause B-1, and ran NO analogous
      check anywhere on clauses A-1 to A-4 — and two of the three J1 breaks
      are in the A block.
    - >-
      WHAT HELD IN ITEM 1, RECORDED SO THE BREAKS ARE NOT OVERSTATED. HELD-1:
      the OVER-CORRECTION direction was attacked with two sieve constructions
      and NO break was found; B-1's error direction is, as 004 claims,
      against the claimant for statically-partial production work, and
      OBJ-3/OBJ-4 are in the other direction. HELD-4: A-3(ii)'s "IF AND ONLY
      IF it realises an S-box application ALREADY COUNTED IN N, AT MOST ONE
      SUCH APPLICATION PER ACCESS" resists the on-the-fly-computed-table
      attack the task card names — the one-application-per-access cap
      forecloses the amortisation move — and the red team records it as the
      strongest text in the amendment. HELD-2: the supersession is confined
      as 004 claims — `git diff` of -003 between its introducing commit
      df9f89135 and the snapshot returns EMPTY, and no clause of 004 changes
      an item_3 (kind, count) verdict or item_4's separate-axis rule. Clause
      A-1's invariance-under-implementation-technique gain is real and is
      independently reproduced by execution (VAL J3(b)); it does close AMB-5's
      fused T-table case. The two lower-severity J2 findings are recorded and
      neither is a reopening: OBJ-5 (LOW) — B-1 makes membership in the
      element (d) data set a precondition of a cost classification for the
      first time, an UNDISCLOSED COUPLING plus a one-line B-4 disclosure gap;
      OBJ-6 (LOW) — the "IT IS NOT A WIDENING OF ROUTE 3" bullet is argued
      for A-1..A-3 and asserted for the whole amendment, while A-4 and B-4
      are prospective NARROWINGS creating two new inadmissibility grounds the
      package nowhere accounts for.
    - >-
      ITEM 3 (C2 DESIGN v2): DEFECT 1's REPAIR HOLDS, ON BOTH REVIEWS AND BY
      DIFFERENT METHODS. VAL J4 verdict `holds`, method
      `parsed_traced_and_re_executed`: the validator implemented S1 and S2
      exactly as the v2 text specifies and traced the draw order for both
      arms across 24 cases (3 key sizes x 2 tiers x 4 sample indices),
      obtaining BYTE-IDENTICAL state_0 (and K, K') across arms on all 24, an
      S2 draw count of exactly 2R (20/24/28 for R=10/12/14), and no S1/S2
      sub-seed collision over 1200 sampled indices. It also CONFIRMED THE
      DEFECT BEING REPAIRED rather than assuming it (v1's own
      `SEED(key_size, arm, tier)` provably drew different key pairs per arm,
      so v1's byte-identical-state_0 claim was false as written) and ran an
      adversarial probe for an undeclared fifth stream on the plaintext term
      (P is fixed per key size, not drawn). The red team reached the same
      disposition independently by tracing the construction (HELD-3), and
      additionally searched for a stream the design NEEDS but does not
      DECLARE, finding none, and accepted v2's stated reasons for preferring
      the indexed-sub-seed form over the sequential single stream its own
      predecessor round had proposed.
    - >-
      AND ITEM 3's REPAIR IS SYMMETRIC-BLIND, WHICH THE MECHANICAL PASS DOES
      NOT REACH. OBJ-7 (MEDIUM_HIGH): v2 adds a two-layer run-time
      verification for the stream it just fixed (GATE-PAIRSYNC Layer A exact
      comparison, Layer B streaming digest, plus GATE-ROUND0 on h_0) and
      NONE AT ALL for stream S2 — the 2R independent 128-bit replacement
      round keys that are the ENTIRE content of the structural null. No gate
      recomputes NULLRK_SUBSEED independently, no required artifact records
      any S2 value, and no invalidation rule references S2. The worked fault
      F is an ordinary implementation slip the design's own phrase "draw
      exactly 2*R independent 128-bit strings in this FIXED order" invites if
      read as two draws of R: re-instantiating random.Random for the second
      trajectory yields RKnull_K[r] == RKnull_Kprime[r] for every r, i.e. a
      COMMON-round-key null rather than the specified INDEPENDENT-round-key
      null. Nothing catches it: the KAT passes, GATE-ROUND0 passes (h_0 comes
      from RK[0], which fault F does not touch), GATE-PAIRSYNC passes (the
      fault is entirely downstream of every quantity either layer compares),
      ARM-ANCHOR passes (it uses S3), and two distinct states driven through
      the same round function still diffuse, so CONVERGED(ARM-NULL) plausibly
      reads TRUE, rules 1a/1b pass, rule 4 never fires, and the run is
      declared INTERPRETABLE with a null control that is not the specified
      null. The red team further observes that the DEFECT 1 fix makes
      GATE-ROUND0's ARM-NULL half DEGENERATE — with state_0 byte-identical by
      construction and GATE-PAIRSYNC proving it, running GATE-ROUND0 on
      ARM-NULL is a byte-for-byte repeat of running it on ARM-REAL and
      carries zero information about S2 — and that v2 carried GATE-ROUND0
      forward "UNCHANGED FROM v1" without noting that its own fix hollowed
      out one of that gate's two arms. VAL J4's cell-(iv) check is correct
      and does not reach this: it verifies that an ARM-NULL-only excess
      routes to NULL-CONTROL-ONLY FAILURE, whereas fault F produces no
      excess at all.
    - >-
      ITEM 3's DEFECT 2 REPAIR IS REAL BUT UNDER-BOUND, AND THE DESIGN SAW
      THE CASE. OBJ-8 (MEDIUM): invalidation rule 1b's CONVERGED window
      [5, R] is justified in the design as holding ARM-NULL to exactly the
      test ARM-REAL already faces, but [5, R] was originally chosen as a
      FALSIFICATION MARGIN deliberately generous to the TREATMENT arm;
      transplanting a generous-to-the-treatment threshold onto the NULL
      control inverts its function, since a null control's job is to
      demonstrate that the instrument nulls out. The worked series (AES-128,
      TVD_1..TVD_10 = 0.30, 0.28, 0.25, 0.20, tau, tau, tau, tau, tau, tau
      in BOTH arms) passes rule 1a, gives CONVERGED TRUE for both arms, never
      fires rule 4, satisfies success_criterion (b), and routes to cell (i)
      "CH-1 HOLDS" — while the null arm sat at a large unexplained excess for
      four consecutive rounds in an arm whose round keys are independent
      uniform strings and which therefore has no key-schedule structure
      available to explain it. v2 identified this exact case and made the
      only check that would catch it (TVD_4 <= tau for the arm) explicitly
      NON-BINDING, on the stated ground that a threshold change was outside
      the revision's scope. The red team calls that a defensible scope
      decision and an indefensible silence: the case is not entered in the
      design's own open-items list.
    - >-
      ONE VALIDATOR SUB-CLAIM IS REPORTED AS UNVERIFIABLE RATHER THAN
      PASSED, AND IT IS A PROCESS FINDING AGAINST THIS COORDINATOR. On the
      pre-archive edit to C2 v2's `experiment.controls`, the validator
      verified that the restored list is EQUAL ELEMENT BY ELEMENT, VERBATIM,
      to v1's five-item list (Python equality on the parsed lists and on each
      entry), that the authoring session's explanatory scalar survives
      verbatim as `controls_restored_note`, and that v1 itself is
      byte-unchanged (sha256 e111a7bb..., matching the earlier red-team
