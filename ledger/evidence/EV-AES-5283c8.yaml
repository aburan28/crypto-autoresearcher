  # =====================================================================
  # INFERENCE.
  # =====================================================================
  inference: >-
    THIS BATCH ESTABLISHES NO CRYPTANALYTIC MEASUREMENT AND NO COST CLAIM,
    AND ASSERTS NOTHING ABOUT AES AT ANY ROUND COUNT IN EITHER DIRECTION.
    What it establishes, per item, is: (1) THE TOOLING REPAIR (ITEM 2) AND
    THE ARCHIVE REPAIR (ITEM 4) ARE SOUND AND INDEPENDENTLY VERIFIED — the
    BLK-1 alternative fix is a working fix rather than a no-op, flipping
    exactly the three key_recovery cases while a near-miss typo still hits
    the protected literal byte-exact (VAL J1), at a disclosed cost that was
    independently measured (112 stale entries, 116 errors) rather than
    argued; and the binding supplement's 44 declared hashes and 22/2/20 split
    recompute exactly (VAL J2), discharging F-VAL4c225b-1 as described. (2)
    THE SPECIFICATION REPAIR (ITEM 1) IS NOT SOUND ON INDEPENDENT ADVERSARIAL
    READING, and this is true SIMULTANEOUSLY with the validator's mechanical
    pass: amendment 004's clauses do what they say on the cases they were
    tested against — the m=0 proves-too-much control is forced and
    independently re-derived, the A-clause verdict is total, single-valued
    and implementation-invariant across three techniques, A-3(ii) is tight,
    and the supersession is confined (VAL J3; HELD-1, HELD-2, HELD-4) — while
    four constructions show two conforming readers reaching opposite verdicts
    inside its own text (OBJ-1, OBJ-2, OBJ-3, OBJ-4). Both are true and
    neither cancels the other, because they test different things: applying a
    rule to the cases its author chose, versus searching for cases the rule
    does not determine. (3) THE DECISIVE CONTENT IS THE PATTERN, NOT THE
    TALLY: -003 was broken by an undefined word, -004 defines the word and
    the ambiguity RELOCATES to a newly-undetermined distinction inside the
    definition ("independent" -> the intensional/extensional split in A-2;
    "distinct" -> the un-individuated "stage" in B-2). Two rounds of
    specification repair have now failed the same way, and the failure is
    structural rather than accidental: 004's own stated defence (clause A-4's
    disclosure duty, limitation L4) cannot reach OBJ-2 because attack P'
    conceals nothing, and 004's own proves-too-much check provably cannot
    reach OBJ-3 because the m=0 reference cannot early-abort. (4) THE C2 v2
    DESIGN REPAIR IS HALF SOUND: DEFECT 1's byte-identical-state_0 fix holds
    under an independent re-implementation over 24 traced cases (VAL J4) and
    an independent trace (HELD-3), but the fix verifies only the stream it
    repaired — GATE-PAIRSYNC guards S1 and nothing guards S2, the stream that
    CONSTITUTES the null, so an ordinary implementation slip silently
    substitutes a different null control and passes every gate and every
    invalidation rule (OBJ-7) — and DEFECT 2's window is borrowed from a
    falsification margin rather than derived from the null object, leaving a
    four-round null-arm anomaly invisible to every binding rule (OBJ-8). (5)
    THE EVIDENCE-QUALITY FACT THAT BOUNDS ALL FOUR: model independence across
    this batch is ZERO (OBS-E3858F-3), so the agreement between these two
    reports is ONE DRAW FROM A CORRELATED PAIR. This bounds the two
    directions asymmetrically and both are stated: the validator's passes are
    mechanical reproductions from committed bytes, which a correlated
    reviewer can still perform validly; the red team's breaks are one
    reader's post-hoc constructions, which is exactly the selection effect
    RC-6's pre-frozen panel exists to remove, and the fact that a second
    session found breaks at a similar rate is NOT evidence that the text is
    objectively breakable at that rate.

