  observations:

  - id: OBS-1
    what: >-
      THE MOST IMPORTANT THING IN THIS BATCH. NAGAO-1994 -- rank EXACTLY 12
      over Q(t), peer-proved, the highest exactly-known Q(t) rank available to
      this campaign -- WAS SET ASIDE ON A FALSE NEGATIVE, and the orchestration
      layer then repeated that false negative to the user as evidence of good
      discipline.
    detail: >-
      TASK-20260823-d1cb76 ran exactly one computational check in its entire
      session (it had no code-execution tool) and reported that it FAILED.
      Substituting x = (t+703)/15 into the transcribed quartic and clearing
      15^4, it computed two coefficients by hand: at t^6, left 451584 against
      right 703343886336 (= 14017536 - 6307891200 + 709637760000); at t^5, left
      3403008 against right 5300198572032. THE ARITHMETIC IS EXACTLY RIGHT --
      the validator confirmed both symbolically. THE CONCLUSION IS FALSE. The
      validator computed all seven coefficients: right/left = 1557504 at EVERY
      ONE of t^0, t^1, ..., t^6, and 1557504 = 1248^2. A constant perfect-square
      ratio is absorbed exactly by the rescaling y -> 1248*y, so the point
      ((t+703)/15, 1248*N(t)/75) LIES EXACTLY ON THE TRANSCRIBED QUARTIC, with
      N(t) = -224t^3 - 844t^2 + 900484t + 2161725. The validator verified this
      as an exact polynomial identity, not numerically, and the ORCHESTRATING
      SESSION independently reproduced it. The producer's written justification
      -- "by factors that are not squares and so are not absorbed by any
      rescaling" -- is false, and it was decidable from the two numbers the
      producer had already printed, with one division, with no code-execution
      tool. Its secondary tell (the quartic has only even powers of t while the
      point has odd powers) is likewise not evidence of corruption: it is
      consistent with E being defined over Q(t^2) with sections split by the
      t -> -t eigenspace decomposition, which the producer itself noted "is not
      by itself contradictory".
    consequence: >-
      The candidate record marks NAGAO-1994 "NOT USABLE AS TRANSCRIBED" and
      "UNRELIABLE -- DO NOT USE", the recommendation moved to MESTRE-1991-QT11
      (rank >= 11, sourced from Mestre's paper TITLES, the CRAS notes never
      opened) partly because of it, and the producer's own honest accounting
      records "sota_delta vs Nagao 12 -> -1" without recording that the -1 was
      SELF-INFLICTED. NAGAO-1994 IS REINSTATED AS A CANDIDATE by this record,
      pending source retrieval.
    scope_of_the_correction_stated_precisely: >-
      This does NOT establish that the transcribed coefficients are Nagao's
      equation. It establishes only that the evidence offered for "corrupted,
      or belonging to different models" DOES NOT SUPPORT that conclusion:
      equation and point are internally consistent up to y -> 1248*y, which is
      the ordinary difference between y^2 = Q(x) and y^2 = lambda^2 Q(x), or a
      dropped constant factor in the extraction of one coordinate. SOURCE
      RETRIEVAL IS STILL REQUIRED before the family is used, and the validator
      states this limit itself.
    corroboration_in_the_other_direction: >-
      With the transcription no longer discredited, the validator re-derived
      Nagao's surface degree from those same coefficients: deg A = 8,
      deg B = 12, gcd(A,B) = 1 (minimal), deg Delta = 20, hence d = 2 EXACTLY,
      an elliptic K3, ceiling 18 over C-bar and 17 over Q(T). The producer's
      conditional d <= 2 derivation was correct and its condition is now much
      better supported than its own record says.
    responsibility: >-
      TWO LAYERS, BOTH RECORDED. (a) THE PRODUCER: a false conclusion filed
      under `verified_here`, decidable from its own printed numbers. (b) THE
      ORCHESTRATION LAYER: it relayed the false negative onward as an example
      of a producer honestly reporting its own method failure. Reporting your
      own failure IS the behaviour this program wants and the producer deserves
      credit for it -- but a self-reported failure is a CLAIM UNDER TEST like
      any other, and the layer that repeated it did not test it. That is the
      error, and it is the Coordinator's.
    source: [validation_report J1-F1 / §1.4, verdict.yaml J1-F1, candidate_families.json NAGAO-1994]

  - id: OBS-2
    what: >-
      C2's ACTUAL DELIVERABLE, AND IT IS REAL. Mestre's construction was
      regenerated in this repository from scratch, and its surface degree is
      d = 2 EXACTLY -- an elliptic K3 -- correcting the producer's "d >= 2,
      <= 4".
    detail: >-
      The validator wrote its own bivariate-polynomial code over Q (exact
      Fraction; sympy absent) and rebuilt the construction from the six
      integers, for BOTH published 6-tuples (-17,-16,10,11,14,17) and
      (399,380,352,47,4,0): p(x,T) = q(x-T)q(x+T), g the polynomial part of
      sqrt(p), r = g^2 - p. Results: p = g^2 - r holds IDENTICALLY; deg_x r = 4
      for both tuples -- so the producer's OWN stated withdrawal falsifier
      ("if deg_x r is 5 for both published 6-tuples, MESTRE-1991-QT11 must be
      withdrawn") was run and PASSED; all 12 sections (+-T + a_i, g(+-T+a_i,T))
      lie on y^2 = r(x,T) IDENTICALLY IN T, 12/12. The T-degrees of
      (r_4, r_3, r_2, r_1, r_0) are (4,4,6,6,8), NOT the producer's predicted
      (6,7,8,9,10). Then deg_T A = 12, deg_T B = 18 for Y^2 = X^3 - 27I X -
      27J, with v_{T=0}(A) = 4 and v_{T=0}(B) = 6 so the model is non-minimal
      at T = 0; after reduction deg A' = 8, deg B' = 12, gcd(A',B') = 1 (no
      further non-minimal place), deg Delta' = 20, giving
      d = max(ceil(8/4), ceil(12/6)) = 2 EXACTLY. Consistency check on the
      ceiling: deg Delta' = 20 on the affine line plus an Euler contribution 4
      at T = infinity gives 24 = 12d at d = 2. Shioda-Tate ceiling therefore
      10d - 2 = 18 over C-bar, 17 over Q(T) under the cited Elkies refinement.
    why_the_correction_matters_beyond_the_number: >-
      The producer filed the predicted T-degrees (6,7,8,9,10) under
      `verified_here` as a "hand weighted-degree argument". They are wrong, and
      the ceiling derived from them -- deg A <= 16, deg B <= 24, d <= 4,
      ceiling up to 38 -- is TWENTY ABOVE the true 18. H-ECQ-d60d07's
      proof_search_map declares method_ceiling exists "so that an over-claim is
      visible immediately". A ceiling loose by 20 is that guard FAILING OPEN:
      it would have admitted a claimed rank of 30 without complaint. The
      direction of the error is safe (an upper bound stated too high cannot
      license a false rejection) and the producer did mark it "must be
      confirmed by the executor", which is why this is a defect and not a
      fabrication. It was confirmed -- by the validator, not by the executor.
    source: [validation_report §1.1 / §1.2 / J1-F2, verdict.yaml metric_recomputations and proof_architecture_checks]

  - id: OBS-3
