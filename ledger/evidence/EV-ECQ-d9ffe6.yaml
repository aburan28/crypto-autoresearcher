  - id: OBS-10
    what: >-
      THE SOFT-CELL CLAIM: real under one null, absent under the null the data
      itself names. The Coordinator's stated alternative was arithmetically
      unavailable and is retired.
    detail: >-
      Three separate results, in the order they bear on the claim.
      (a) THE COORDINATOR'S OWN PROPOSED ALTERNATIVE IS DEAD. The task card
      offered "an artifact of how few rank-15 curves anyone has submitted". The
      r>=15 cell is a minimum over 115 curves and r>=14 over 125 -- ten extra
      draws, not a small-sample regime -- and there are MORE curves of rank
      exactly 15 (15) than of rank exactly 14 (10). The counting story predicts
      the OPPOSITE of what is observed. Retired, not carried forward as
      unresolved uncertainty.
      (b) THE JUMP IS REAL UNDER EXCHANGEABILITY. Medians of the rank-13/14/15
      groups are 141.8 / 144.3 / 145.3 (flat), so a permutation test needs no
      trend model: over 200000 relabelings (seed 20260823), P(step >= 33.58) =
      0.01465, P(min of the rank-15 group >= 118.77) = 0.01622, P(min of the
      rank-14 group <= 85.19) = 0.62376. So the Coordinator's binary question
      has a clean answer under this null: #244 is UNREMARKABLE and #276 is THE
      HIGH ONE. Trend-corrected (log h = 3.5549 + 0.0974 r on ranks 10-20,
      n = 158) and look-elsewhere-corrected over the ten thresholds 11..20 with
      30000 draws, p < 3.3e-5 both locally and after multiplicity.
      (c) IT DOES NOT SURVIVE THE PROGRAM CONTROL. The board ships the
      generative-search-program covariate in its own `commentary` field and the
      campaign never read it. Permuting height residuals WITHIN each program,
      preserving the program x rank incidence, raises p from < 3.3e-5 to
      0.21747. The parameter that should destroy the signal destroys it. The
      incidence is the reason: ELKIES_JMM23 {12:2, 13:2, 14:1} stops at 14;
      KLAGSBRUN {12:1, 13:1, 14:1, 16:1, 20:1} SKIPS 15; MESTRE_SPEC runs
      {11:3, 12:7, 13:5, 14:6, 15:12, 16:29, 17:17, 18:14, 19:6, 20:6}. The
      85.19 -> 118.77 step is the SEAM BETWEEN SEARCH PROGRAMS.
    two_hazards_the_softness_framing_hid: >-
      The r>=15 margin to the runner-up is 1.872, i.e. 1.58% -- the
      second-thinnest in its rank window (against 4.82, 6.42, 9.14, 7.07, 8.17,
      3.50% at r>=13, 14, 16, 17, 19, 20; only r>=18 at 0.42% is thinner) and
      sixth-thinnest across all 29 thresholds. And the cell is moving fast:
      214.162 (2026-05-27) -> 131.746 -> 127.132 -> 125.334 -> 120.642 ->
      118.770 (2026-08-21T08:28Z), i.e. the incumbent landed 41 HOURS BEFORE
      THE PRE-REGISTERED FREEZE, at an ambient rate of ~10% in 84 days. A cell
      whose top two entries are 1.6% apart is CONTESTED, not abandoned.
    limits_of_this_finding_stated_by_the_reviewer_itself: >-
      The program classification comes from free-text commentary present on 250
      of 289 curves; 39 carry none and fall into OTHER. The permutation nulls
      assume height residuals are exchangeable after a log-linear rank trend,
      within group or within program, an approximation calibrated on this
      dataset alone. These are statements about ONE frozen snapshot of ONE
      leaderboard and about the attributions its commentary discloses.
    source: [redteam_report §3.1-§3.4 / §3.7, objections OBJ-1 / OBJ-3 / OBJ-4 / OBJ-5, analysis/redteam_controls.py controls 0, 1, 3, 5]

