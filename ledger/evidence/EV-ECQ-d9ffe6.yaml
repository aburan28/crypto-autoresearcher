    source: [RUN-ECQPIPE-01d3d9-005, executor report §2 and §5, validation_report §2.5 and J1-F3, redteam PA-3 and HC-2]

  - id: OBS-7
    what: >-
      THE MESTRE-NAGAO ORDERING STEP: neither validated nor refuted. The
      Coordinator's comparison to GOAL-ECQ-001 was ITSELF AN ERROR, and the
      correction goes in the statistic's favour -- but the step does not earn
      its place AS PLACED.
    detail: >-
      Measured (RUN-ECQPIPE-01d3d9-011..-014, four families, box t = p/q with
      |p| <= 15, q <= 2, 47 points, top-15 by MN against 15 uniform draws,
      seed 20260823): mean certified rank 3.117 ordered vs 2.483 random,
      difference +0.633, two-sided permutation p = 0.067; naive height
      difference -2.59, p = 0.76; min naive height 15.72 ordered vs 11.39
      random. Every one of these recomputes exactly under the validator's
      independent implementation, with permutation p-values agreeing within
      Monte-Carlo error (0.06785 vs 0.06830; 0.75926 vs 0.76901).
      THE COORDINATOR'S COMPARISON ERROR, corrected by the red team:
      GOAL-ECQ-001's p = 6.1e-8 is a TOP-vs-BOTTOM contrast (28/29 vs 0/9
      reaching rank >= 9). The contrast comparable to this batch's is
      TOP-vs-RANDOM, 28/29 vs 16/25, which recomputes by Fisher exact to
      p = 3.4e-3 two-sided. The five orders of magnitude live entirely in the
      bottom arm, WHICH THIS BATCH NEVER RAN. Further, the arm overlap that the
      executor honestly disclosed UNDERSTATES the effect rather than inflating
      it: with 47 box points and 15 per arm, E[shared] = 15^2/47 = 4.79 (32% of
      the random arm), so the observed difference is (47-15)/47 = 0.681 of the
      disjoint-arm contrast, implying +0.930 rather than +0.633. At p = 0.067,
      |z| = 1.83 and SE ~ 0.346, so n = 32 per arm suffices at the corrected
      effect; the batch ran 60 with 24 of 60 ordered-arm draws also appearing
      in the control arm. THIS IS AN UNDER-POWERED DESIGN, NOT A NULL RESULT.
    why_it_still_does_not_earn_its_place_as_placed: >-
      The campaign's target is a JOINT condition (rank >= 15 AND height <
      118.770). Mestre-Nagao is a marginal RANK proxy. The batch measured
      height directly and found no advantage (-2.59, p = 0.76), with the
      smallest curve of each family coming as often from the random arm. The
      r>=15 incumbent's own published commentary reaches the same conclusion
      independently and states it as its design rationale: "gating on exact
      naive height or log|D| already under the standing record BEFORE any
      Mestre-Nagao scoring: record fibres are downward height fluctuations at
      fixed T-scale, not top Nagao scorers." Two independent measurements agree.
      The remedy is to REORDER, not to drop: gate on exact naive height first
      (falsifier_height.py measures (a,b) in seconds), then use MN to order
      WITHIN the height-admissible set.
    licence_status: >-
      H-ECQ-d60d07 assumption 2's licence for MN as an ORDERING prefilter is
      NOT disturbed for RANK, and is NOT established for HEIGHT. Its stated
      scope is wider than what supports it and must be narrowed, not withdrawn.
    source: [executor report §3, validation_report §2.5 / J2-G6, redteam "The Mestre-Nagao control" / OBJ-11 / OBJ-12 / HC-1]

