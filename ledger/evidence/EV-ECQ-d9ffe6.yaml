  inference: >-
    THIS BATCH DID NOT TAKE A RECORD CELL AND DID NOT COME CLOSE. It built and
    independently corroborated a correct instrument, it obtained and certified
    in-repo the K3 base the campaign needed, and it discovered that the target
    it was aimed at is the one place its own method has already done its best
    work. All three of those are results; only the first two are progress.
    Judged against the campaign's two criteria, and judged separately:
    C1 IS NOT MET. No curve produced by this program takes any frozen cell at
    any rank. The best certified rank was 7 at naive height 91.263 against a
    r>=7 cell of 35.779; the best certified rank obtained anywhere in the batch
    from the recommended base was 11 at h = 107.614 against a r>=11 cell of
    61.507. Nothing was submitted and the live board was not re-read. Worse for
    C1 than the miss: as WRITTEN it is satisfiable by three curves that have
    been in Cremona's tables since the 1980s, so it must be tightened to C1'
    BEFORE any candidate curve exists.
    C2 IS MET, on the standard C2 actually sets and not by implication from
    anything. Mestre's family was regenerated in this repository from the
    published construction rather than transcribed; p = g^2 - r and all twelve
    sections hold identically in T; the surface degree is d = 2 EXACTLY -- an
    elliptic K3 -- with Shioda-Tate ceiling 18 over C-bar and 17 over Q(T),
    correcting a producer guard that was failing open by 20; and
    rank E(Q(T)) >= 11 > 8 is certified in-repo by exact descent at two
    specialisations rather than cited from a paper title. The base-rank gap
    that closed GOAL-ECQ-001 at 8 is therefore CLOSED as C2 defines closing it.
    Four things bind that verdict and none of them is optional: it was
    delivered by the REVIEWER and not by the producer commissioned for it; it
    is a LOWER BOUND that is also the ceiling of the method used; it is
    UNREPLICATED with no archived exhibited-point certificate; and C2 being met
    changes NOTHING about C1, which is the axis the campaign's headline lives
    on.
    The hypothesis's targeting clause is WEAKENED and its mechanism clause is
    not. The soft-cell framing was the Coordinator's, it was stated in the goal
    record before any evidence existed, and it does not survive the one control
    that matters: conditioned on the generative search program the board itself
    discloses, the 85.19 -> 118.77 step is a p = 0.22 fluctuation, and within
    Mestre-family specialisation 118.77 at rank 15 is the method's global best
    over ranks 12-20. The deficit numbers are 0.00 at r = 15 and 49.24 at
    r = 14. The campaign aimed at the cell where its lever has no room.
    Two corrections run the other way and are recorded with equal weight. The
    highest exactly-known Q(t) rank available was discarded on arithmetic that
    was decidable-and-wrong, and the orchestration layer amplified that error
    instead of testing it; NAGAO-1994 is reinstated. And the Mestre-Nagao
    ordering step was compared against the wrong contrast: the honest
    comparable is p = 3.4e-3, the disclosed arm overlap attenuates the effect
    to 0.681 rather than inflating it, and the design was under-powered rather
    than negative. Neither correction is a licence: the ordering step is placed
    wrongly in the pipeline for a JOINT rank-and-height target, and two
    independent measurements -- this batch's own control and the incumbent's
    published design rationale -- say gate on exact height first.
    NOTHING HERE IS PROGRESS TOWARD RANK >= 31 OVER Q, which remains an open
