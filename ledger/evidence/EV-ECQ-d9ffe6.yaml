      DEMO-SEC5-BIGCOEFF differs from DEMO-SEC5-r5 only by large constants
      inside the section coordinates and has a = 506.63, four times the target,
      so it admits NO PARAMETER AT ALL. "Small parameter" does not imply "small
      height"; "small family coefficients AND small parameter" does. The
      hypothesis's mechanism sentence omits that conjunct. Reading the slope
