    detail: >-
      RUN-ECQPIPE-01d3d9-005, operationalisation fixed in falsifier_height.py
      BEFORE the numbers were read (X = log H(t), H = max(|num|, den);
      Y = naive height of the minimal model; least squares over ~130 points per
      family, |p| <= 30, q <= 3). H-ECQ-d60d07 declares the mechanism falsified
      if "minimal models of small-parameter specialisations are not small".
      That did not happen: naive height grows LINEARLY IN log H(t), i.e. only
      logarithmically in the parameter, with R^2 up to 0.94 in the
      highest-rank family. Fits: h = 17.97 + 2.14 logH (generic rank 0),
      15.29 + 5.59 (rank 1), 8.70 + 21.19 (rank 3), 5.56 + 67.37 (rank 5),
      506.63 + 102.66 (rank 5, big coefficients). Every fit, and every
      admissible log H under the target (47.1764 / 18.5279 / 5.1937 / 1.6804 /
      -3.7782), recomputes IDENTICALLY to full double precision under the
      validator's independent implementation.
