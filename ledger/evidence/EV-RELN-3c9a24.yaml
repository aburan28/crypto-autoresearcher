  observations:
    - >-
      Run integrity (VAL-20261001-25c0f3). All 42 run-package and 69
      implementation hashes match; snapshot commit 160bd52f03 has the declared
      parent and changes exactly the receipt's paths. C-7 passed at launch
      (15-minute load 13.28 <= 14; 12.8 GiB free on / and 85.9 GiB on the
      repository volume). 9/9 cells completed with empty stderr, no watchdog or
      memory event, and 32 rewire plus 32 Erdos-Renyi null replicates per
      budget.
    - >-
      Independent reproduction (VAL-20261001-25c0f3). The validator wrote its
      own curve arithmetic and seed-label derivation and re-scanned all 65,838
      attempts: every outcome, relation and decomposition count matches. Graph
      statistics for all 18 fixture-budgets match with zero differences, and the
      frozen analysis.py agrees with the independent recomputation on all 145
      compared quantities.
    - >-
      Frozen verdict: inconclusive ("neither C-5 rule holds"). Supercritical
      fails on several independent clauses: the A1 lower confidence bound is
      undefined because cycle rank is 0 at 8 of 9 fixtures; the 16-bit A2 lower
      bound is -0.73; the A1 trend is undefined; and the ER null mean exceeds 1/4
      in all three A2 cells (0.69, 0.70, 0.82). Certified-subcritical fails
      because 17 of 18 fixture-budgets have giant fraction >= 0.05 (only
      b24-s13-A1 passes).
    - >-
      Proves-too-much control (VAL-20261001-25c0f3) passes. A planted mean-degree-3
      ER graph (|V| 46 and 85) is never called certified-subcritical; planted
      forests are never called supercritical (the matching forest is
      certified-subcritical); planting one ER fixture into the matching set flips
      the verdict to inconclusive; a fragmented planted object reaches
      supercritical-enriched. All three verdicts are reachable.
    - >-
      Enrichment against the matched null (red team TASK-20261001-ece593). The
      cycle-rank excess of the honest graph over its degree-preserving rewire
      null at A2 is 0.033 delta_proof units, s.e. 0.028, n = 9, 95% t-CI
      [-0.031, 0.098], against the 0.25 gate; in absolute terms 4.28 +- 4.93
      excess cycles of 315 (1.4% +- 1.6%). Relative edge density against log q
      has slope -0.083 +- 0.023 at A1 (subcritical, diverging from threshold)
      and +0.013 +- 0.021 at A2 (flat, mean degree 1.7-2.6). Post-hoc analysis by
      the red team, not a frozen C-5 quantity.
    - >-
      Blind re-derivation comparison (Coordinator, from RD-20261001-4aefce and
      cells/b16-s13.json). Re-derived parameters B = 9, B2 = 70, A1 = 199,
      A2 = 574 equal the run's exactly. The run's A1 graph (|V| 14, |E| 9,
      cycle rank 0, giant fraction 0.214) and A2 graph (|V| 24, |E| 28, cycle
      rank 6, giant fraction 0.917) lie inside the re-derived ranges over all 48
      readings per budget (A1 cycle rank 0-2, giant >= 0.100; A2 cycle rank
      3-14, giant >= 0.500). Certified-subcritical fails at both budgets under
      every reading, as in the run. The run uses L = 6 (C-2's count of liftable
      x-classes below B), the reading under which J3 found A2 delta_proof can
      exceed 1/4 in some readings; the run's value is 0.0.
  inference: >-
    RUN-RELN-a695fe is valid and its frozen verdict, inconclusive, is
    reproduced independently. The verdict is structurally forced rather than
    informative about enrichment: at A1 the graphs are below the percolation
    threshold so the supercritical rule's A1 clause cannot be met, and at 16
    bits certified-subcritical is unreachable by construction (F-1 below).
    What the run does measure is that the honest two-large-prime graph's cycle
    rank at A2 is indistinguishable from a degree-preserving random rewire
    (excess 0.033 +- 0.028 delta units against a 0.25 gate). On these nine
    fixtures the cycle-rank statistic shows no enrichment, and once the budget
    fixes the edge count it cannot show any, because cycle rank is determined
    by |E|, |V| and the number of components. This neither supports nor
    rejects H-RELN-4d092c: the hypothesis's enrichment claim is untested by a
    statistic that its own null determines.
  boundaries:
    - >-
      Toy tier. Nine EXP-RELN-c5a377 v4 fixtures (16/20/24-bit ordinary
      prime-field curves, seeds 11/12/13); exact x < B2 two-point decomposition
      generator; B = ceil(p^{1/5}), B2 = ceil(p^{2/5}); budgets A1 = ceil(q^{1/2})
      and A2 = ceil(q^{3/5}); cycle-rank statistic only.
    - >-
      F-1 (VAL-20261001-25c0f3, must-fix scope): any graph with an edge has giant
      fraction >= 2/|V|, so certified-subcritical requires |V| > 40. All six
      16-bit fixture-budgets have |V| <= 34. The subcritical branch was testable
      only at 20 and 24 bits.
    - >-
      Not claimed over other graph statistics (short-cycle counts, minimum cycle
      basis length distribution), other budgets, other B2 exponents, Semaev or
      extension-field decompositions, or larger q.
  unresolved_confounds:
    - >-
      Which L the delta_proof logarithm uses decides whether A2 delta can exceed
      1/4 on b16-s13 (L = 6 versus ceil(q^{1/5}) = 9; RD-20261001-4aefce U-9).
      The run used L = 6. The review plan's wording ("ceil(q^{1/5})") was a
      Coordinator error, recorded in DEC-20261001-7fa9f9.
    - >-
      Protocol v4 adopts by reference 18 open-question rulings whose content is
      only in implementation_report.yaml (AMD-20260929-988139;
      RD-20261001-4aefce U-1), so the frozen protocol is not self-contained for
      a blind re-deriver.
    - >-
      The ER null mean excludes replicates with cycle rank 0, biasing it upward
      in sparse cells (VAL-20261001-25c0f3 advisory). No effect on this verdict.
  obstruction:
    statement: >-
      The honest two-large-prime summation graph's cycle rank equals that of a
      random graph with the same degree sequence. Cycle rank is |E| - |V| + c,
      so once the attempt budget fixes the edge count the graph carries no
      cycle-space enrichment, and whether it is supercritical is decided by the
      budget relative to the percolation threshold (below at A1, above at A2).
    quantity: >-
      Cycle-rank excess of the honest graph over its degree-preserving rewire
      null at budget A2, in delta_proof units: log_L(cycle_rank_treatment /
      mean cycle_rank_rewire), averaged over fixtures.
    value: >-
      0.033 delta_proof units (dimensionless), s.e. 0.028, n = 9 fixtures, 95%
      t-CI [-0.031, 0.098]; gate 0.25. Aggregate excess 4.28 +- 4.93 cycles of
      315 (1.4% +- 1.6%).
    measured_by: [RUN-RELN-a695fe, EXP-RELN-c5a377]
    computed_by:
