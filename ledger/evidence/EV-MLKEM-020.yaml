  # ------------------------------------------------------------------
  # SCOPE, TIER, DIRECTION, STRENGTH - stated before any number
  # ------------------------------------------------------------------
  scope_statement: >-
    ONE ATTACK, ONE COST MODEL, ONE INSTRUMENT. Everything here concerns
    `primal_bdd` under `RC.MATZOV` as served by lattice-estimator
    3e48ef421ec256afddb3e7d2249a77eab6e9ba12 through the Sage-free harness
    (tools/sage_free_estimator), evaluated at the three FIPS 203 parameter sets
    (n = 512/768/1024, q = 3329) at the beta/eta/d that MINIMISE A FREE-MEMORY
    GATE COUNT. Arora-Groebner is unavailable in this harness, and the validator
    established that `dual` and `primal_hybrid` also fail to execute in it, so
    the served attack set is narrower than the producer's own scope statement
    said. No sampling, no G6K, no lattice computation, no network retrieval.

  claim_tier_note: >-
    `medium` is the ceiling and it is a ceiling on a COST-MODEL ESTIMATE, not on
    a measurement. The parameters really are the FIPS 203 ones, so there is no
    toy-to-crypto extrapolation (AGENTS.md rule 7 is not strained here) - but
    nothing was executed at any scale, and the validator records this exactly:
    "this is not toy-scale evidence dressed as crypto-scale, and it is also not
    crypto-scale VALIDATION". A cost-model estimate under twelve numbered
    modelling choices, several unvalidated, cannot carry `crypto`.

  direction_note: >-
    `neutral` WITH RESPECT TO H-MLKEM-014, and that is the honest reading rather
    than a hedge. H-MLKEM-014's conjunct (3) - primal_bdd under MATZOV has
    log2(rop) strictly below 143/207/272 - is a FREE-MEMORY (c = 0) statement.
    This batch reproduces it at delta 0.00e+00 and then computes a different
    quantity, in a different convention, that a c = 0 statement cannot be
    contradicted by. This record therefore neither supports nor weakens
    H-MLKEM-014, and it does NOT contradict, correct, or qualify EV-MLKEM-015.
    Both reviews state this independently (red team OBJ-2; validator
    overclaim_assessment). Its positive content is a new conditional statement
    about the charge interval, recorded in `what_survives` below.

  strength_note: >-
    `replicated` refers to the ARITHMETIC AND THE INVARIANCE, not to any
    heuristic and not to any measurement - there is no measurement here to
    replicate. What is replicated: every quantitative claim in the package was
    independently recomputed by two independent sessions
    (TASK-20260803-90327f, TASK-20260803-e29029) that did not author it, each on
    its own clone of the pinned estimator, with maximum absolute discrepancy
    0.000e+00 over every stored Z_q entry and <= 4.7e-09 on independently
    bisected Model B; and the Coordinator ran a third, adversarially named
    falsification (below). What is NOT replicated and is not claimed to be:
    no numbered heuristic is validated by this record, the memory model is
    borrowed rather than derived (see `what_does_not_survive_scrutiny`), and the
    NIST cutoffs remain unverifiable from primary text.

  # ------------------------------------------------------------------
  # THE ACTUAL FINDING - stated as the reviews framed it, not as the
  # package framed it
  # ------------------------------------------------------------------
  headline_framing: >-
    THE NUMBER IS AN INEVITABILITY; THE ROBUSTNESS OF THE INEQUALITY IS THE
    FINDING. c* = margin / log2(M) is an identity in two quantities that both
    pre-date this batch: EV-MLKEM-015's free-memory margin (deliberately not
    revised, H1) and the sieve-database size 2^(0.2075*n_peak) * n_peak. Because
    Kyber was parameterised to sit within a few bits of a category boundary, and
    because any sieve at cryptographic dimension has log2 M = O(100), a critical
    exponent of order 1e-2 is forced by the shape of the problem before any
    instrument runs. "c* is 10.5x below 1/3" IS the sentence "the Kyber-512
    margin is 10.5x smaller than 29.498 bits", and the ratio moves INVERSELY
    with the undercut - Kyber-1024's 47.2x is large precisely BECAUSE its
    undercut is the smallest of the three. The package led with eight
    significant figures and buried the part that is not forced: that the
    INEQUALITY c* << 1/3 survives every mutation anyone has yet applied to it.
    This record adopts the red team's framing (RT-20260803-e5a272, OBJ-1) as its
    own.

  what_survives:
    - >-
      THE ARITHMETIC. log2(rop) = 140.1994731076207 / 200.9587149140538 /
      270.7236234535225 against NIST classical cutoffs 143 / 207 / 272, i.e.
      free-memory margins +2.800527 / +6.041285 / +1.276377 bits (positive =
      undercut). log2 M_peak = 88.494071 / 131.657286 / 180.924993 Z_q elements.
      c* (Model A, Z_q) = 0.03164649 / 0.04588645 / 0.00705473; c* (Model B,
      per-term) = 0.03277120 / 0.04701194 / 0.00720010. Reproduced independently
      twice, maximum absolute discrepancy 0.000e+00 over every stored Z_q entry
      (VAL C8) and deltas <= 4.70e-09 on an independently bisected Model B
      (VAL C3).
    - >-
      THE SIEVE-DIMENSION RESOLUTION, which the task card warned would change the
      answer, is CONFIRMED against the pinned source rather than asserted. The
      validator read all five cited lines verbatim (lwe_primal.py:465, :482,
      :488, :490; reduction.py:800) and verified PROGRAMMATICALLY the non-obvious
      inheritance step - type(RC.MATZOV).__mro__ is MATZOV -> GJ21 -> Kyber ->
      ReductionCost -> object with `__call__` defined ONLY on Kyber - so
      RC.MATZOV genuinely executes the d4f path. Effective sieve dimensions
      bkz 353.197381 / 557.152930 / 792.144373 and svp 385.084530 / 590.132012 /
      825.235330; eta+1 > beta on all three sets so the final BDD/SVP call sets
      peak memory.
    - >-
      THE INEQUALITY c* < 1/3 IS INVARIANT UNDER EVERY MUTATION APPLIED TO IT,
      and this is the part of the batch that is not forced by algebra:
      (a) SIEVE-MEMORY EXPONENT. Red-team RT-B3 replaced the sourced 0.2075 with
      an arbitrary exponent across [0.05, 0.40]: Kyber-512 c* = 0.100582 /
      0.059462 / 0.031646 / 0.022564 / 0.017221 at 0.05 / 0.10 / 0.2075 / 0.30 /
      0.40. All below 1/3, over an 8x range of the one input the community
      disputes.
      (b) MEMORY UNIT. c* moves 0.03504819 -> 0.03164649 -> 0.03041438
      (Kyber-512, vectors -> Z_q -> packed bits), 0.04933579 -> 0.04588645 ->
      0.04467010 (768), 0.00745389 -> 0.00705473 -> 0.00691766 (1024). The bound
      is structural: the units differ by the additive log2(n) + log2(12) ~ 12.2
      bits on a base of 73-171 bits, so an order-of-magnitude unit slip is
      arithmetically impossible in this chain (VAL memory_unit_finding).
      (c) CHARGE MODEL. Model B (each term charged by its own sieve's memory)
      gives c* strictly above Model A on all three sets, as it must since
      M_bkz < M_peak. Both are far below 1/3.
      (d) SIEVE-DIMENSION CHOICE. Using the BKZ sieve instead of the SVP sieve
      changes c* by only +8.25% / +5.55% / +3.98% (0.03425604 / 0.04843445 /
      0.00733552) with no sign change; the estimator's own floored-d4f convention
      moves it by < 0.2%.
      (e) ATTACKER RE-OPTIMISATION WITHIN THE COST MODEL. Red-team RT-C put the
      M^c charge inside the reduction cost model and let the estimator
      re-optimise: at c = 1/3 the re-optimum recovers only +0.461 / +0.441 /
      +0.353 bits (at c = 1/6, +0.147 / +0.131 / +0.068) against an undercut that
      would need 26.70 / 37.84 / 59.03 bits to restore. A within-family
      re-optimising attacker CANNOT recover the undercut. Marked
      `unable_to_check` by its own author because a charged reduction cost model
      is an uncovered path with no Sage reference; recorded here with that label
      intact.
      (f) THE NAMED CHEAPEST FALSIFIER, run by the Coordinator - see
      `coordinator_independent_falsification` below. It does not falsify.
    - >-
      THE CONSERVATIVE BRANCHES WERE TAKEN, twice, in the direction that WEAKENS
      the package's own headline. Applying d4f to the memory dimension lowers
      log2 M and therefore RAISES c* (without it: log2 M 96.4970 / 142.3317 /
      194.4727 and c* 0.02902190 / 0.04244512 / 0.00656327); and taking peak =
      max over sequential sieves rather than their sum also raises c* relative to
      the per-term Model B. Both established by the validator (VAL-CTRL-B, C3),
      not by the producer.
    - >-
      SCOPE DISCIPLINE. Both reviews hunted for an ML-KEM break claim and for an
      implied security proof and found neither. The package states in its report,
      its script docstring, its results.json and its receipt that a raised
      estimate is not a proof of security; it refuses "best attack overall"
      phrasing; it refuses to close KN-OPEN-016 or KN-OPEN-017; and it labels its
      own unsourced conventions as its own construction. The red team records
      "Scope inflation: NONE FOUND, and this deserves saying."

  what_does_not_survive_scrutiny:
    - >-
      c* AS A HEADLINE NUMBER IS AN IDENTITY, NOT A DISCOVERY (OBJ-1, major).
      Both of its inputs pre-date the batch; it is exactly linear in the margin
      at fixed log2 M; and c* = 1/3 corresponds to a margin of 29.498 bits on
      Kyber-512. Eight significant figures are unwarranted in any case: the
      package's own H11 concedes that a one-bit cutoff error moves c* by
      0.0113 / 0.0076 / 0.0055, the last of which is 78% of Kyber-1024's entire
      c*. Two significant figures is the most this quantity supports.
    - >-
      THE MEMORY MODEL IS BORROWED, NOT DERIVED FROM THE ATTACK (red team,
      H4/H5 challenge; the sharpest sourcing attack in either review).
      `grep -n "mem" estimator/lwe_primal.py` returns NOTHING and lwe_primal
      never calls `short_vectors`, so the instrument supplies NO memory figure
      for this attack at all. The 0.2075 literals cited from reduction.py:415,
      :854, :936 live inside `short_vectors()`, a function `primal_bdd` does not
      invoke, annotated by the estimator's own authors with the comment
      "# pick something"; and H5's "numerator and denominator live in one
      convention" borrows its convention from lwe_dual.py:172, a different
      module serving a different attack. MATZOV.NN_AGPS
      (reduction.py:972-998) carries only time-fit coefficients and no space
      entry. The CONSTRUCTION is defensible - the closed form log2(sqrt(4/3)) =
      0.20751874963942182 checks out at |delta| 1.874964e-05, and the corpus
      treats 2^(0.2075n) as the kissing-number floor - but H4's claim to be
      "SOURCED THREE WAYS, none of them an assumption made here" is not
      supported, and BDGL16 primary text was retrieved by nobody in this batch.
    - >-
      CONTROLS-BEFORE-BELIEF IS FORMALLY UNMET (OBJ-3 major; validator D3, D1).
      CTRL-5, the package's declared null object, sets log2 M = 0 so that
      M^c = 1 for every c: it asserts x * 1^c == x, a property of exponentiation
      that would pass identically if the memory figure were off by fifty bits,
      if the sieve dimension were the wrong one, or if the unit chain were
      inverted. Three further controls (CTRL-4, CTRL-7, and CTRL-6 in large part)
      are likewise algebraic identities that cannot fail, so "all eight controls
      passed" is 4 substantive checks plus 4 identities. The red team ran two
      nulls of the right shape that DO discriminate: a sign null (Kyber-1024
      scored against 207 gives margin -63.7236 and c* = -0.352210; Kyber-512
      against 128 gives -12.1995 and c* = -0.137856) and the denominator null
      (b) above. Those two, not CTRL-5, are what the inventor protocol asks for.
    - >-
      A REAL ARITHMETIC BUG IN A DURABLE ARTIFACT (OBJ-6, moderate,
      `not_reproduced`). memory_charged_derivation.py:151 computes
      log2_vectors + log2(sieve_dim) + log2_q, i.e. it multiplies the Z_q-element
      count by q = 3329 instead of by log2 q = 11.700873. results.json therefore
      reports log2_memory_bits_information_theoretic = 100.194944 / 143.358160 /
      192.625866 where the correct values are 92.042616 / 135.205831 /
      184.473537 - an error of +8.152329 bits on all three sets. It feeds a c*
      row (0.02795078 / 0.04214120 / 0.00662619) and it runs IN THE DIRECTION OF
      THE CONCLUSION, because an overstated M understates c*. It is not in the
      report's headline (which tabulates vectors / Z_q / packed-12-bit, all
      correct), but the report's "across three units c* moves by about 15%"
      excludes a fourth unit that sits wrong in the durable results.json. NOT
      REPAIRED HERE: run records and archived artifacts are immutable, and the
      correction is recorded rather than written over the file (AGENTS.md rule 4).
    - >-
      THE H9 ACCESS-FRACTION MODEL HAS THE WRONG SHAPE AND IS NOT INDEPENDENT
      EVIDENCE (OBJ-4, OBJ-5). It is multiplicative, f * T * M^c, so at c = 0 it
      returns a cost BELOW the estimator's own free-memory gate count that CTRL-2
      pins at delta 0.0 (at f = 2^-20: 120.1995 / 180.9587 / 250.7236 against the
      pinned 140.1995 / 200.9587 / 270.7236). The correctly shaped model is
      additive, (1-f)*T + f*T*M^c. At f = 1 the two coincide exactly so the
      HEADLINE c* is untouched; the sensitivity rows are not (at f = 2^-10 the
      additive form gives 0.142125 / 0.121674 / 0.058086 against the published
      0.144648 / 0.121841 / 0.062326). Direction: the published form INFLATES c*,
      i.e. is biased AGAINST the batch's own conclusion. Separately, the H9 table
      is the c = 1/3 row re-expressed - solving (margin + log2(1/f))/log2 M = 1/3
      returns exactly the charged margins -26.6975 / -37.8445 / -59.0320 - and so
      is not the independent robustness check the report presents it as.
    - >-
      c* IS A PER-ATTACK QUANTITY CARRYING A SCHEME-LEVEL NAME (OBJ-9). The
      scheme-level question - what charge is needed before NO attack undercuts
      the cutoff - is a MAXIMUM over the attack frontier and is unknown. The
      direction is stated too weakly in H12: a LOW-memory attack has a small
      log2 M, so even a modest undercut would give it a LARGE c*, and the
      scheme-level exponent could in principle exceed 1/3 while this one sits at
      0.03. No deliverable in the package carries `dominated_by` or `sota_delta`.
    - >-
      "SOURCED" ON c = 1/3 IS A TRANSFER BY ANALOGY (OBJ-7). KN-LIT-094 (Wiener)
      supplies ONE worked example - BSGS, n^(1/2) steps -> n^(2/3+o(1)) full cost
      - from which the batch back-derives a general T*M^(1/3) law and applies it
      to a bucketed list-decoding sieve with a different access pattern. Whether
      the exponent transfers is precisely the question KN-OPEN-017 poses and
      declares unanswered, and KN-LIT-094's own corpus entry records under "Not
      verified here" that the 3D wiring bound was not re-derived. The headline
      therefore compares c* against an exponent whose applicability to this
      algorithm is the open problem cited as the motivation. The ratio-to-1/2
      sentence is worse: 1/2 is unsourced AND arithmetically redundant given
      1/3.
    - >-
      THE FREE-MEMORY CONVENTION'S PURPOSE IS NEVER STATED (OBJ-10). H6
      establishes that the convention EXISTS; it never says why. A free-memory
      gate count is a conservative LOWER BOUND on attack cost, chosen so a
      security claim is not hostage to a hardware model - KN-LIT-094's own corpus
      entry records that Wiener "states explicitly that counting only processor
      steps is a conservative choice for the cryptographer". Charging memory
      always moves an estimate in the defender's favour. A reader of the package
      alone cannot tell whether the free-memory result was OVERTURNED or merely
      DEPARTED FROM, and only one of those would be a criticism. It is the
      latter.
    - >-
      THE DIRECTION WAS FIXED BY ALGEBRA, NOT TESTED (OBJ-11). For M >= 1 and
      c >= 0, T*M^c >= T: memory charging can only raise the estimate. The
      inventor protocol's decay test - name the parameter whose increase destroys
      the signal - has no answer here. RECORDED EXPLICITLY AS **NOT** A RULE-9
      CONCERN, and the red team holds that position: KN-OPEN-017 posed the
      question on 2026-07-24, before this batch; the Coordinator's BATCH-010
      objective pre-registered "report the margin in whichever direction it
      falls"; reporting an inconvenient direction is compliance with rule 9, not
      a breach of it; and the package declined the overclaim available to it.

  # ------------------------------------------------------------------
  # COORDINATOR-RUN FALSIFICATION - the reviews' named cheapest check
  # ------------------------------------------------------------------
  coordinator_independent_falsification:
    run_by: coordinator
    run_under_task: TASK-20260803-341aad
    run_when: after both independent reviews were complete and read
    why: >-
      The red team named exactly one check as the cheapest falsification of the
      batch's headline and did NOT run it (its one-run budget was spent on the
      known-answer control and RT-A/B/C): cost the primal attacks under the
      POLYNOMIAL-MEMORY, enumeration-based reduction cost models already shipped
      in the pin (estimator/reduction.py:1040-1049). If any landed below
      143 / 207 / 272, then a memory-charged best attack would still undercut and
      the sentence "the undercut does not survive the memory charges examined
      here" would fall immediately. AGENTS.md requires me to seek the strongest
      checkable refutation the result admits before relying on it; the reviews
      named it, so I ran it.
    what_i_ran: >-
      All 18 combinations of {RC.CheNgu12, RC.ABFKSW20, RC.ABLR21} x
      {primal_bdd, primal_usvp} x {Kyber-512, Kyber-768, Kyber-1024} in the same
      pinned harness.
    results_log2_rop:
      RC.CheNgu12:
        primal_bdd: [275.37, 479.17, 738.33]
        primal_usvp: [280.79, 485.36, 745.26]
      RC.ABFKSW20:
        primal_bdd: [263.54, 464.95, 721.04]
        primal_usvp: [247.05, 412.81, 619.72]
      RC.ABLR21:
        primal_bdd: [243.28, 426.81, 662.41]
        primal_usvp: [219.04, 361.48, 541.65]
    outcome: >-
      THE NAMED FALSIFIER DOES NOT FALSIFY. Against the cutoffs 143 / 207 / 272
      there are ZERO below-cutoff cases in 18. The smallest margin anywhere is
      RC.ABLR21 primal_usvp on Kyber-512 at 219.04 against 143, i.e. the
      enumeration-costed attack is +76.04 bits ABOVE the cutoff before any memory
      charge is applied at all (Kyber-768: +154.48; Kyber-1024: +269.65).
    why_that_settles_it_for_c_greater_than_zero: >-
      These are c = 0 figures and enumeration is polynomial-memory, so charging
      raises them by a negligible amount - but the argument does not even need
      that. T*M^c >= T for M >= 1 and c >= 0, so no charge can move an
      already-above-cutoff cost below the cutoff. The falsification route the red
      team named is therefore closed at every c, not merely at c = 0.
    arithmetic_consequence_flagged_as_such: >-
      Under the OPTIMISTIC-FOR-ENUMERATION assumption that the enumeration
      models' own memory charge is negligible, the charged sieve-based primal
      stays cheaper than the cheapest enumeration-costed primal in this
      instrument until c ~ 0.89 / 1.22 / 1.50 respectively
      ((219.04 - 140.1995)/88.494071, (361.48 - 200.9587)/131.657286,
      (541.65 - 270.7236)/180.924993). This is a Coordinator arithmetic
      consequence of my figures and the package's log2 M, quoted to two decimals
      because my inputs are; it is NOT a validated crossover, it does not price
      enumeration memory, and it does not close KN-OPEN-017.
    what_this_run_is_not: >-
      A charged enumeration cost model is an UNCOVERED PATH: the harness
      known-answer control covers primal_bdd/RC.MATZOV only, so these 18 figures
      carry no Sage reference and are `unable_to_check` in the sense both reviews
      use that term. They are strong enough to close the named falsification
      route - a 76-bit gap is not a rounding question - and they are not strong
      enough to support any claim about enumeration costs in their own right.

  # ------------------------------------------------------------------
  # THE NUMBERED HEURISTICS THE CONCLUSION DEPENDS ON
  # ------------------------------------------------------------------
  heuristics_relied_on:
    source_file: coordination/goals/GOAL-MLKEM-003/batches/BATCH-010/tasks/TASK-20260803-648a0b/heuristics.yaml
    note: >-
      Every one of H1-H12 is load-bearing for some statement above. The
      `validation_status` column is the producer's, amended where a review
      changed it; `checked_by` names who actually executed a check.
    entries:
      - id: H1
        statement: EV-MLKEM-015's free-memory baseline and margins, unchanged.
        validation_status: validated_this_batch
        checked_by: producer CTRL-0/CTRL-2; validator (own clone, delta 0.0); red team (own run, delta 0.0)
      - id: H2
        statement: RC.MATZOV sieves in the d4f-reduced dimension; two sieves, peak is the final SVP call.
        validation_status: validated_this_batch
        checked_by: >-
          validator, from the pinned source verbatim plus a programmatic __mro__/__call__
          check; quantified as +3.98..+8.25% on c* if the BKZ sieve were used instead
      - id: H3
        statement: Peak sieve memory is max over sequential sieves, not their sum.
        validation_status: unvalidated (argued, bounded at <= 1 bit; Model B sidesteps it)
        checked_by: nobody; both reviews accept the bound and raise no objection
      - id: H4
        statement: Sieve database is 2^(0.2075*n) vectors.
        validation_status: >-
          DOWNGRADED BY THIS RECORD from `checked_against_source` to
          `construction_with_partial_support`: the closed form checks out
          (|delta| 1.874964e-05) and the corpus treats it as the kissing-number
          floor, but the instrument literal cited lives in a function primal_bdd
          never invokes and BDGL16 primary text was not retrieved.
        checked_by: producer CTRL-3; validator (closed form reproduced); red team (sourcing falsified by grep)
      - id: H5
        statement: Memory unit is elements of Z_q, M_zq = n * 2^(0.2075n).
        validation_status: >-
          unit chain validated; PROVENANCE DOWNGRADED - the convention is
          borrowed from estimator/lwe_dual.py:172, a module serving a different
          attack, because lwe_primal supplies no memory figure at all.
        checked_by: validator (chain reproduced, instrument citations verified verbatim); red team (borrowing identified)
      - id: H6
