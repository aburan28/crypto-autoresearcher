  # ------------------------------------------------------------------
  # OBSERVATIONS (schema field)
  # ------------------------------------------------------------------
  observations:
    - >-
      Under lattice-estimator 3e48ef421ec256afddb3e7d2249a77eab6e9ba12 via the
      Sage-free harness, primal_bdd/RC.MATZOV costs 140.1994731076207 /
      200.9587149140538 / 270.7236234535225 bits at the three FIPS 203 parameter
      sets, reproducing RUN-MLKEM-015-001 at delta 0.00e+00 (three independent
      sessions), i.e. free-memory margins of +2.800527 / +6.041285 / +1.276377
      bits below the NIST classical cutoffs 143 / 207 / 272.
    - >-
      Charging the whole gate count by M^c against the peak sieve database
      (log2 M = 88.494071 / 131.657286 / 180.924993 Z_q elements) erases that
      undercut for every c above c* = 0.03164649 / 0.04588645 / 0.00705473
      (Model A) or 0.03277120 / 0.04701194 / 0.00720010 (Model B). c* is the
      identity margin / log2(M): both inputs pre-date this batch.
    - >-
      THE INEQUALITY c* < 1/3 IS INVARIANT under the sieve-memory exponent across
      [0.05, 0.40], across all three memory units, across both charge models,
      across the BKZ-vs-SVP sieve-dimension choice, under within-RC.MATZOV
      memory-aware re-optimisation, and under the polynomial-memory enumeration
      falsifier the red team named and the Coordinator ran. That invariance, not
      the value of c*, is this batch's finding.
    - >-
      The undercut survives on an INTERVAL, 0 <= c < c*, of positive width - not
      only at the single point c = 0. Any statement of the form "the undercut
      survives only under literally free memory" is stronger than the artifacts
      support; see `evidence_integrity_findings` below, where a Coordinator
      overclaim of exactly that form is recorded and corrected.
    - >-
      The eighteen enumeration-costed primal figures the Coordinator ran land
      219.04-745.26 bits, with ZERO below-cutoff cases and a smallest excess of
      +76.04 bits (RC.ABLR21 primal_usvp, Kyber-512, 219.04 vs 143). The cheapest
      falsification route either review could name is therefore closed at every
      c, since T*M^c >= T.
    - >-
      Four defects survive into the durable record and are recorded rather than
      repaired: an 8.152329-bit arithmetic error in results.json's
      information-theoretic memory unit which feeds a c* row IN THE DIRECTION OF
      THE CONCLUSION (OBJ-6); a null-object control that cannot fail, leaving the
      inventor-protocol controls-before-belief obligation formally unmet (OBJ-3);
      a memory model whose sourcing claim is not supported because the attack's
      own estimator module supplies no memory figure at all (H4/H5); and a
      multiplicative access-fraction model that at c = 0 returns a cost below the
      instrument's own pinned gate count (OBJ-5).

  # ------------------------------------------------------------------
  # INFERENCE
  # ------------------------------------------------------------------
  inference: >-
    THE MODEST FINDING IS REAL AND THE FRAMING WAS WRONG. What this batch
    established is a ROBUSTNESS statement, not a magnitude: for the single attack
    primal_bdd under RC.MATZOV at the free-memory operating point, the memory
    charge that erases EV-MLKEM-015's undercut is one to two orders of magnitude
    below every named hardware convention, and that INEQUALITY is invariant to
    every mutation two independent reviews and the Coordinator have applied to it
    - the sieve-memory exponent over an 8x range, the memory unit, the charge
    model, the sieve-dimension choice, attacker re-optimisation inside the cost
    model, and a polynomial-memory enumeration alternative that misses the
    cutoffs by 76 to 270 bits. The VALUE of c*, by contrast, is an identity in
    two pre-existing numbers and is forced by the shape of the problem: Kyber
    sits within a few bits of a category boundary and any cryptographic-dimension
    sieve has log2 M = O(100). Reporting it to eight significant figures
    contradicts the package's own H11, under which a one-bit cutoff error moves
    Kyber-1024's c* by 78% of its value. Against that, four things do not survive
    scrutiny and are recorded above: the borrowed provenance of the memory model,
    the vacuous null object, the 8.152329-bit unit error, and the wrongly shaped
    access-fraction model. NONE of this is a statement about ML-KEM security.
    A memory charge that raises an estimated attack cost above a NIST cutoff is
    not a security proof; it is a statement about one cost model, at one
    parameter set, under twelve numbered heuristics of which H3, H6, H8, H9, H10
    and H11 are unvalidated and H11 is unverifiable in this environment. And it
    does not contradict, correct, or qualify EV-MLKEM-015, whose undercut is a
    c = 0 statement that a c > 0 computation cannot reach.

  # ------------------------------------------------------------------
  # BOUNDARIES
  # ------------------------------------------------------------------
  boundaries:
    - >-
      NOT AN ML-KEM BREAK AND NOT A SECURITY PROOF. No FIPS 203 parameter set is
      affected or cleared by this record. No solve, no relation, no certificate;
      `certificate_refs` is empty because there is nothing to certify.
    - >-
      ESTIMATES, NEVER MEASUREMENTS. Every figure is a cost-model estimate from a
      pinned estimator plus numbered modelling choices. The validator states it
      plainly: it "reproduced the arithmetic, the source citations and the
      controls; the validator did not and could not establish that the cost model
      is correct."
    - >-
      ONE ATTACK. c* is the critical exponent OF primal_bdd under RC.MATZOV at
      the free-memory optimum. The scheme-level exponent is a MAXIMUM over the
      attack frontier and is unknown; a low-memory attack has small log2 M, so a
      modest undercut there would give a LARGE c*.
    - >-
      THE SERVED ATTACK SET IS NARROWER THAN THE PACKAGE SAYS. Arora-Groebner is
      unavailable (PowerSeriesRing is a raising stub), and `dual` and
      `primal_hybrid` also fail to execute in this harness. All three fail loudly
      rather than returning a wrong cost, which is the safe behaviour, but the
      scope documentation understates the narrowness in the direction that
      understates how large the free-memory undercut might be.
    - >-
      THE c = 1/3 AND c = 1/2 CHARGED COSTS ARE UPPER BOUNDS on a memory-aware
      attacker, not that attacker's cost (H10). The within-RC.MATZOV re-optimum
      recovers under half a bit, but everything outside RC.MATZOV - tuple
      sieving, reduced-database sieving, enumeration hybrids - is untested and is
      where that row could still move materially.
    - >-
      KN-OPEN-016 AND KN-OPEN-017 REMAIN OPEN. This batch computes only HALF of
      KN-OPEN-017's declared closure condition: it prices the near-neighbour list
      and replaces its ACCESS PATTERN with the crudest possible model. The
      instrument cannot supply a working-set exponent (MATZOV.NN_AGPS carries
      only time-fit coefficients), so that half must be closed from literature or
      left open. Bound already established by the red team: locality alone cannot
      restore the undercut at c = 1/3 unless log2 M_eff <= 3*margin = 8.40 /
      18.12 / 3.83 bits, which no sieve of this family has.
    - >-
      AGENTS.md RULE 12 IS UNMET AND UNWAIVED. This record changes nothing about
      EV-MLKEM-011, EV-MLKEM-013, EV-MLKEM-017, H-MLKEM-011, H-MLKEM-013,
      KN-FIND-012 or KN-FIND-014, and treats none of them as corrected. The
      KN-FIND-012 restatement and the KN-FIND-014 withdrawal recorded as PENDING
      in DEC-20260802-937ba9 remain owed and are not cancelled.
    - >-
      NO HYPOTHESIS STATUS CHANGES. H-MLKEM-014 stays `analyzed`; nothing here
      moves it toward `supported`, `weakened` or `rejected`. COST-MLKEM-001 is
      untouched.

  # ------------------------------------------------------------------
  # UNRESOLVED CONFOUNDS
  # ------------------------------------------------------------------
  unresolved_confounds:
    - >-
      THE NIST CUTOFFS ARE UNVERIFIABLE FROM PRIMARY TEXT, AND THEY ARE THE
      DENOMINATOR OF THE WHOLE EXERCISE. 143 / 207 / 272 are inherited from
      RUN-MLKEM-015-001 and from corpus entries KN-LIT-7617 / KN-LIT-110; no
      FIPS 203 or NIST call text is readable under this program's network policy,
      exactly as EV-MLKEM-015 recorded, and neither reviewer endorses them. A
      one-bit error moves c* by 0.0113 / 0.0076 / 0.0055 - 78% of Kyber-1024's
      entire c*. Kyber-1024's 0.00705473 must not be read as precise to three
      significant figures.
    - >-
      RC.MATZOV SUPPLIES NO LOW-MEMORY SIEVE MODEL, so the memory-aware
      attacker's true optimum outside the family is not computable with this
      instrument. The red team's within-family ceiling argument bounds what
      re-optimisation can recover INSIDE RC.MATZOV (the charge adds c*0.2075 per
      unit sieve dimension against a free-memory term growing at ~0.296 in the
      opposite direction, so recovering 26.70 bits would need to shrink the sieve
      dimension by ~386, the entire sieve); it bounds nothing outside it.
    - >-
      THE MEMORY FIGURE IS NOT SUPPLIED BY THE ATTACK'S OWN INSTRUMENT PATH.
      lwe_primal.py has no memory field and never calls short_vectors. Every
      memory number here comes from a construction assembled by the producer out
      of a literal in an uncalled function and a convention from a different
      module. This is the confound that a future low-memory or access-pattern
      model would have to settle, and it is not settled here.
    - >-
      THE o(1) IN 2^(0.2075n + o(n)) IS UNBOUNDED HERE. The corpus entries the
      batch cites (KN-LIT-6625, KN-LIT-6765) state the exponent WITH an o(n)
      term; the batch uses the bare exponent. At n_peak ~ 385-825 an o(n) term is
      not obviously negligible and nothing in the package bounds it. Direction
      unknown, which is the point.
    - >-
      A SHARED INSTRUMENT WAS EDITED MID-BATCH. See
      `evidence_integrity_findings`. The edit does not touch the primal path and
      the red team's run predates it, but the class of confound - a reviewed
      snapshot's instrument changing under review - is real and is recorded.
    - >-
      BOTH REVIEWS USED THE SAME INSTRUMENT AT THE SAME PIN AS THE PRODUCER, which
      is what the known-answer control makes admissible, so a defect in
      lattice-estimator 3e48ef4 itself, or in the Sage-free shim on a path the
      control does not cover, would be invisible to all three of us. D4 is one
      instance of exactly that class surfacing.

