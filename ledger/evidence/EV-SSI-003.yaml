  observations:
    - >-
      F1 fix verified correct by independent red-team review (SUPPORT verdict,
      independent_session: true). Per-processor walk-function variation using
      seeded hash functions h_i(x) = H(i || x) mod (l+1) gives genuinely
      distinct walks from E_0 and E_1. P = p^{1/4} useful processors restored.
      Collision between any E_0-walk and any E_1-walk yields path E_0 -> E_1.
    - >-
      VW full-cost exponents confirmed: p^{1/2} (F_{p^2}) and p^{1/4} (F_p
      conditional on unproven F_p subgraph mixing). MITM full-cost p^{2/3}
      (F_{p^2}) and Delfs-Galbraith full-cost p^{1/3} (F_p) unchanged from
      BATCH-002 and confirmed correct.
    - >-
      N1 reconciled: clock cycle set by per-processor storage O(1), not shared
      table, because table is accessed only at distinguished points. Amortized
      table access O(p^{-1/6}), subconstant.
    - >-
      N2 reconciled: "stored kernels" corrected to "recomputed kernels"
      throughout. Polynomial space preserved.
    - >-
      N3 reconciled: l specified as small fixed prime (l=2 for CGL). Per-step
      costs polynomial in log p for fixed l.
    - >-
      N4 reconciled: birthday bound assumes O(log p) mixing steps (Ramanujan
      property). Exponent unaffected if collision occurs before mixing.
    - >-
      Nonfatal NF2: birthday bound on Ramanujan graph is heuristic (birthday
      paradox on mixed walks), not direct Wiener group-theorem transfer. KN-TECH
      entry should note this.
    - >-
      Complete matched-baseline package is coherent: MITM/DG/VW full-cost
      exponents + VW analogue definition (walk model, distinguished predicate,
      collision-to-path reconstruction with seeded hash functions) + matched-
      baseline recommendation (VW under full cost, not MITM/DG). Ready for
      knowledge promotion.
  inference: >-
    The corrected derivation is mathematically sound. The F1 fix is correct and
    complete. The complete matched-baseline package (MITM p^{2/3}, DG p^{1/3},
    VW p^{1/2}/p^{1/4} + VW analogue + recommendation) is coherent and ready for
