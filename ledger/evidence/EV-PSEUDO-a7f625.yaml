  observations:
    - id: O-1
      text: >-
        Measured C = max|hat{1_F}(k)| / sqrt(B) for:
        (a) EC multiplication sequence x([j]G): C = 3.126
        (b) Random permutation psi: Z/N → F_p (5 trials): mean C = 2.572 (range 2.41-2.84)
        At p=1009, B_frac=0.05, B≈53.
    - id: O-2
      text: >-
        The random permutation C ≈ 2.57 ≈ sqrt(log N) (where N≈951: sqrt(log 951) ≈ 2.6).
        This matches the theoretical O(sqrt(log N)) bound for random bijections.
    - id: O-3
      text: >-
        Surprising: C_EC (3.13) > C_random (2.57). EC multiplication sequences are
        SLIGHTLY LESS Fourier-flat than random bijections. The EC structure adds
        ~(3.13/2.57 - 1) ≈ 22% extra Fourier roughness at p=1009.
        At larger p: C_EC ~ p^{0.079} >> sqrt(log p) = C_random prediction.
        The EC sequence becomes increasingly WORSE than random for large p.
    - id: O-4
      text: >-
        Implication for H-PSEUDO: random bijections satisfy H-PSEUDO with C = O(sqrt(log N))
        (provable via standard random set theory). EC sequences have C ~ p^{0.079} which
        grows faster than sqrt(log p) at large p. H-PSEUDO for EC sequences requires a
        proof that is HARDER than for random bijections — EC structure adds difficulty.
    - id: O-5
      text: >-
        The "LC connection" (IDEA-24b025): EC sequences have high linear complexity (LC ~ N/2)
        but are LESS flat than random bijections. High LC does not imply high Fourier flatness.
        IDEA-24b025 is likely blocked by the same finding.

  dominated_by: Pollard rho at exponent 1/2
  sota_delta: {time_exponent: not_applicable}

  knowledge_promotion: not_warranted
  knowledge_promotion_reason: >-
