evidence:
  id: EV-AES-dec938
  hypothesis_id: null
  hypothesis_id_note: >-
    DELIBERATELY NULL. This record is an artifact-exclusion/null-object
    measurement about the r=5 yoyo statistic's excess, extending BATCH-009's
    own null-object control (EV-AES-e4c091) to a second, differently
    constructed substitute. RQ-AES-003 carries no hypothesis this record
    would bind to; naming one would manufacture a relationship this record
    does not have. Admitted under the documented-null allowance recorded in
    CORR-20260802-009, the same pattern used by EV-AES-e4c091 and
    EV-AES-acddd0.
  experiment_ids: []
  run_ids: []
  task_ids:
    - TASK-20260805-b95720
    - TASK-20260805-051ba3
    - TASK-20260805-063dbf
  type: measurement
  direction: corroborating
  strength: moderate
  strength_basis: >-
    MODERATE, matching the precedent set by BATCH-009's own null-object
    exclusion (EV-AES-e4c091, moderate) and BATCH-011's independent-instrument
    replication (EV-AES-acddd0, moderate). RC-D (rank 1, DEC-20260805-f2086a)
    tested residual limitation U4 -- whether BATCH-009's OUTCOME-A (the r=5
    excess did not survive substituting AES with an IDEAL random permutation)
    depended on the substitute being ideal specifically, or would also hold
    under a deterministic, non-ideal, independently-constructed substitute.
    A keyed, fixed-16-round Feistel PRP was built (round function: a pure
    64-bit multiply/xor-shift avalanche mix, the public murmur3 fmix64
    finalizer constants, zero GF(2^8) field arithmetic) and BATCH-009's
    matched-exposure comparison was rerun against it at 2^30 (matched to
    BATCH-009's own N1 arm) and 2^33 (8x, mirroring BATCH-009's own N1/N2
    design) trials. BOTH THE INDEPENDENCE AUDIT AND THE DETERMINISM PROPERTY
    -- the two properties this control's validity depends on -- were verified
    BY DIRECT CODE READ, not by trusting the producer's own audit prose, by
    an independent validator who also independently recomputed every
    statistic (including the easy-to-get-wrong exposure-weighted p0=1/9 null
    probability for the M2-vs-r5 comparison) in fresh code and reported a
    clean `passed` verdict with zero defects found. Both arms read
    OUTCOME-A': M1 (0 hits vs a 14-hit frozen comparator at matched
    exposure, p=1.22e-4) and M2 (9 hits, tracking its own ~8-event analytic
    null, CI [0.51, 2.14] containing 1, far below the ~112 hits an
    AES-level rate extrapolated to 8x exposure would predict). STRENGTH IS
    CAPPED AT MODERATE, NOT HIGHER, BECAUSE THIS IS ONE FIXED CONSTRUCTION
    AT ONE KEY: no decay check (varying the Feistel round count) and no
    second key/seed were run, so this control establishes absence for this
    ONE 16-round instance, not for the class of "sufficiently non-AES
    deterministic PRPs" as a varied parameter -- both the producer and the
    validator name this limitation explicitly rather than it being surfaced
    only in review. Every party resolves to one model under standing basis
    0137a051eb5828789eb267fa83c8278086578d4c, so NOTHING HERE COUNTS TOWARD
    A CLOSURE QUORUM.
  claim_tier: toy
  claim_tier_basis: >-
    Reduced-round (r=5) AES-shaped SPN probe geometry (amask=1, smask=1),
    one machine, one 16-round Feistel construction, one key, trials up to
    2^33. No crypto-scale, medium-scale, affected-scheme or asymptotic claim
    is made or implied, and no comparison to published cryptanalysis is made
    in either direction (RQ-AES-003 R3).
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []

  observations:
    - id: OBS-B14-1
      statement: >-
        THE FEISTEL SUBSTITUTE IS GENUINELY INDEPENDENT OF AES AND OF EVERY
        PRIOR NULL-OBJECT INSTRUMENT IN THIS CAMPAIGN, CONFIRMED BY DIRECT
        CODE READ RATHER THAN ASSERTION. The round function (feistel_F) is a
        pure 64-bit multiply/xor-shift avalanche mix using the public
        murmur3 fmix64 finalizer constants (0xff51afd7ed558ccd,
        0xc4ceb9fe1a85ec53) under plain Z/2^64 wraparound arithmetic -- zero
        GF(2^8) field multiplication, zero AES S-box/MixColumns/ShiftRows
        vocabulary in any executable statement (every AES-vocabulary token
        in the source appears only inside a provenance-disclosure comment),
        and zero shared code, symbol, or architecture (no dom[]/rng[]
        pair-storage, no injectivity-rejection logic) with the
        yoyo_sbox_v2-v4 or rc8probe-ideal (perm128) lineage. Independently
        confirmed by the validator via a fresh grep invocation against the
        actual source files (rc8probe.c, yoyo_sbox_v4.c, both
        rc8probe_ideal.c files), not by trusting the producer's own
        grep transcript.
      status: CONFIRMED independently by producer (TASK-20260805-b95720) and validator (TASK-20260805-063dbf)
    - id: OBS-B14-2
      statement: >-
        THE CONSTRUCTION IS DETERMINISTIC, NOT RESAMPLED PER TRIAL --
        VERIFIED ON TWO INDEPENDENT GROUNDS, THE PROPERTY THIS ENTIRE
        CONTROL'S VALIDITY DEPENDS ON. (1) Code-path tracing: round subkeys
        are derived exactly once in main(), before any worker thread is
        spawned, from a global RK[] array that is read but never written by
        any measurement worker. (2) A mechanical determinism self-check
        (detcheck: same key+input -> same output; decrypt inverts encrypt;
        round-key schedule reproducible; over 4096 trials, zero fixed
        points) gated every measurement arm before it ran, per
        PREREGISTRATION.md's own binding gate. Had the construction instead
        resampled per trial, it would have been a second, weaker idealness
        test rather than a structuredness test, collapsing this batch's
        entire premise -- both the code and the mechanical gate confirm this
        did not happen.
      status: CONFIRMED independently by producer and validator, cross-checked by code trace and mechanical gate
    - id: OBS-B14-3
      statement: >-
        BOTH MEASUREMENT ARMS READ OUTCOME-A' -- THE r=5 EXCESS DOES NOT
        REAPPEAR UNDER THIS STRUCTURED, DETERMINISTIC, NON-AES SUBSTITUTE,
        EXTENDING BATCH-009's OUTCOME-A ONE FURTHER STEP ALONG U4. M1 (2^30
        trials, matched exposure to BATCH-009's own N1/P1 arm): 0 hits
        against the frozen comparator's 14 (independently re-read from
        BATCH-009's own committed P1-R5-PAIR.json, key_hex
        bdf3823182ad657dab3d556b3886ba72, seed 531001, matching field for
        field); exact conditional-binomial test (exposure-exact p0,
        0.500000000225) gives p=0.00012207031250000008, ratio CI lower
        bound 3.317. M2 (2^33 trials, 8x exposure, mirroring BATCH-009's own
        N1/N2 design): 9 hits, tracking its own analytic null of ~8 events
        (rate ratio 1.125, 95% CI [0.51, 2.14], containing 1) and far below
        the ~112 hits an AES-level rate scaled to 8x exposure would predict;
        exposure-weighted conditional-binomial test against r5 (p0=1/9, the
        methodologically correct null probability for this asymmetric-
        exposure design, NOT p0=0.5) gives p=1.336455492547555e-08, ratio CI
        [5.02, 32.59]. Both statistics independently recomputed to matching
        precision by the validator in fresh scipy code, including the
        exposure-weighted p0 for M2, flagged in advance as the easy place to
        get wrong.
      status: >-
        CONFIRMED independently by producer (TASK-20260805-b95720, analyze
        code) and validator (TASK-20260805-063dbf, independent scipy
        recomputation), verdict passed, zero defects found

  defects_carried: []

  boundaries:
    - >-
      This record establishes that the r=5 excess's absence under cipher
      substitution (BATCH-009's OUTCOME-A) is not specific to the substitute
      being an IDEAL random permutation -- it also holds under this one
      fixed, deterministic, non-ideal, independently-constructed Feistel
      PRP, at one key, up to 2^33 trials. It does NOT establish this for the
      class of all non-AES deterministic PRPs as a varied parameter (no
      decay check on Feistel round count, no second key/seed run), does NOT
      resolve U4, and does NOT establish anything about full-round or
      deployed AES or about published cryptanalysis in either direction.
    - >-
      Session and implementation independence only. NO MODEL INDEPENDENCE
      under standing basis 0137a051eb5828789eb267fa83c8278086578d4c; nothing
      here counts toward a closure quorum.
    - >-
      M1 and M2 share the same key/seed and are NOT independent replicates
      of each other (M2's trial stream is a superset prefix of M1's, the
      same non-independence class EV-AES-e4c091 OBS-B9-5 flagged for
      BATCH-009's own N1/N2 arms); reported and compared to the r5 frozen
      comparator separately, never pooled.

  unresolved_confounds:
    - >-
      U4 (whether OUTCOME-A depends on idealness vs. mere structurelessness)
      is narrowed, not resolved: this record adds one data point (one
      16-round Feistel construction, one key) consistent with idealness NOT
      being the operative factor, but does not test other Feistel round
      counts, other deterministic PRP families, or other keys/seeds.
    - >-
      The cipher-substitution mechanism (BATCH-009's central claim, tested
      against a genuinely independent instrument in BATCH-011/BATCH-012)
      remains open at the memory-bounded exposures reached so far
      (EV-AES-837cd8 unresolved_confounds, unchanged by this record).
    - >-
      RC-C's own finding (EV-AES-d81acf, BATCH-013) that "five points" does
      not mean "five independent samples" against the comparison population
      remains unaddressed by this record, which is orthogonal to it.

  reviewed_by:
