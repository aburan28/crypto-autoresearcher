evidence:
  id: EV-PFDR-55d067
  recorded_at: '2026-09-07'
  hypothesis_id: H-PFDR-2139a5
  question_id: RQ-PFDR-ae2fba
  experiment_ids:
    - EXP-PFDR-a76b91
  run_ids:
    - RUN-PFDR-20260907-587a55
    - RUN-PFDR-20260907-2b0b0f
    - RUN-PFDR-20260907-d934ea
    - RUN-PFDR-20260907-f0b0d7
  type: empirical

  direction: neutral
  direction_note: >-
    NEUTRAL, and the word is chosen because this audit produced no directional
    scientific evidence about first-fall degree values: the native degree
    controls (groups 1 and 3) are unmeasured, because the Definition 1.3 /
    Example 4.4 zero-slot grading interface remains unresolved exactly as the
    frozen protocol prescribes, so the pre-registered triples (3,5,5) at q=3
    and (3,9,9) at q=5 are neither confirmed nor refuted. What the audit DID
    produce is an instrument-level observation, recorded at its own scope:
    zero invalid acceptances among the eight tested fixtures (8 of 8,
    checker-verified in all four groups), and the declared controls behaved as
    designed (altered Boolean signatures rejected as incompatible absent an
    interface proof; the finite-table-to-uniform-constant inference rejected
    by quantifier order; the F_19 rational-target fiber enumerated and found
    inadmissible). That observation is NOT presented as support for the full
    hypothesis H-PFDR-2139a5: the hypothesis's certificate machinery for
    native degree comparisons was never exercised, because no native degree
    value exists to certify.

  strength: preliminary
  strength_note: >-
    Preliminary per the hierarchy of docs/evidence-and-reproducibility.md: a
    valid experiment with limited instances, seeds, and scale. Four bounded
    runs, one seed (0), zero independent instances, eight deterministic toy
    fixtures, no replication across instances or engines. The strength applies
    to the instrument-level observation only; the native degree component is
    unmeasured and carries no strength in either direction.

  claim_tier: toy
  claim_tier_note: >-
    The contract's own declared tier, never exceeding the runs' parameters:
    q in {3, 5} in the ordinary ring F_q[w,x,y,z] with the four frozen
    generators (x^2-x, x*y-1, w^q-w, w^(q-1)*z^(q-1)-1), grevlex w>x>y>z,
    degree filter 0..10 (never reached), plus the declared F_19
    rational-target enumeration control. No prime-digit transfer, no
    asymptotic inference, no cryptographic-scale label.

  certificate_refs: []
  certificate_refs_note: >-
    Every manifest's result.certificate is {kind: none, verified: null,
    verifier: null}; no run claims a solve or a relation, so no verified: true
    certificate is required and none is cited. The group-4 certificates.json
    (RUN-PFDR-20260907-f0b0d7) additionally carries a `quantifier` block
    (finite_certificate_implies_no_uniform_constant: false,
    finite_table_would_only_bound_supplied_constants: true, with a written
    argument) and a `domain` block (exact enumeration of the F_19 fiber at
    x = 9: rhs 2, roots []). The quantifier block is a LOGICAL ARGUMENT about
    quantifier order, not a discrete_log certificate; it does not change the
    manifest's certificate kind and is cited here as an argument, not a
    certificate.

  proof_status: empirical_only
  proof_status_note: >-
    Declared explicitly: the strongest checkable basis for the stated
    direction is the executed experiment itself. No certificate, no derivation
    note, and no machine-checked proof backs any degree statement, because no
    degree value was produced. The quantifier-order rejection and the F_19
    enumeration are exact finite computations recorded in the run artifacts,
    which is the empirical_only tier, not a derivation.

  proof_refs:
    - experiments/EXP-PFDR-a76b91/runs/RUN-PFDR-20260907-f0b0d7/certificates.json

  observations:
    - >-
      O-1 (the measured component). incorrectly_accepted_claims is 0 in all
      four raw results and all four canonical manifests: 8 of 8 fixture records
      with no invalid acceptance, checker-verified in all four groups (checker
      passed: true, checked_fixture_count 2 per group, identical verbatim
      output in every run).
    - >-
      O-2 (the unmeasured component). native-q3 and native-q5 are status
      unmeasured with d_ff, d_lf, sd_bounds all null, reason "Definition 1.3
      grades slots using deg(fi) in B; Example 4.4 includes w^q=0 in B without
      explicit zero-slot grading or top-before-quotient convention.";
      universal-equality and supplied-gap-one are status inconclusive with
      certified_witness null, reason "No certified native witness; control
      predictions cannot be substituted." No degree estimate was substituted
      anywhere.
    - >-
      O-3 (the controls). boolean-q3 and boolean-q5 are status incompatible
      ("Boolean quotient signature differs from ordinary ring; no interface
      proof; ordinary certificate reuse rejected."); uniform-gap is status
      rejected_inference ("A finite table cannot refute existence of an
      unspecified uniform constant; no asymptotic conclusion."); rational-
      target is status inadmissible (admissible false, rational_y [], exact
      enumeration of the declared fiber: field 19, x 9, rhs 2, roots []).
    - >-
      O-4 (the instrument under enforced bounds). All four groups launched
      serially in the pinned container (image
      sha256:1c633a1d80264a1ff31824a06a5b8ea8566e6277bd7af4fa5db6dd993d4ec4de,
      CPython 3.10.12 payload) under --memory 8589934592 --memory-swap
      8589934592 --cpus=1 with a 900 s wall limit per run; every supervisor
      receipt reports status completed and payload_exit_code 0; payload CPU
      0.0017-0.0022 s and peak RSS 15.6-15.8 MB per run; total charged wall
      600.0131275 s of the 3600 s cap (600.0 s setup charged to group 1 per
      the predecessor convention). No rerun, no protocol deviation, no
      censored run.

  inference: >-
    The instrument behaved as designed under the enforced 8 GiB / 1 CPU / 900
    s boundary: the acceptance logic rejected every claim it was designed to
    reject on the tested surface and accepted nothing invalid among the eight
    fixtures. No mathematical degree value was produced, so the pre-registered
    native triples (3,5,5) and (3,9,9) are neither supported nor refuted, and
    nothing transfers beyond the eight toy fixtures. The disposition is
    inconclusive per the contract's own success_criterion ("Missing decisive
    certificates yield inconclusive"), recorded in DEC-20260907-b608b8.

  largest_justified_claim: >-
    For the eight frozen fixtures of EXP-PFDR-a76b91 (q in {3,5} ordinary-ring
    native systems and their altered Boolean signatures; the two finite
    universal claims; the uniform-gap and F_19 rational-target controls),
    seed 0, container CPython 3.10.12, pinned image
    sha256:1c633a1d80264a1ff31824a06a5b8ea8566e6277bd7af4fa5db6dd993d4ec4de,
    8 GiB / 1 CPU / 900 s bounds: zero of eight fixture records was
    incorrectly accepted, the altered signatures were rejected as incompatible
    absent an interface proof, the finite-table-to-uniform-constant inference
    was rejected by quantifier order, and the F_19 fiber at x = 9 is empty.
    No native first-fall, last-fall, or solving-degree value was measured at
    any q, and no statement about elliptic curves, the ECDLP, or any
    cryptographic scale is justified by this record.

  boundaries:
    - >-
      B-1. Exact fixtures: native-q3, native-q5 (ordinary F_q[w,x,y,z],
      generators x^2-x, x*y-1, w^q-w, w^(q-1)*z^(q-1)-1, grevlex w>x>y>z,
      q in {3,5}); boolean-q3, boolean-q5 (same generators plus the Boolean
      quotient w^2-w, x^2-x, y^2-y, z^2-z); universal-equality and
      supplied-gap-one (finite universal claims over the native systems);
      uniform-gap and rational-target (F_19, curve [2,15], target_x 9).
    - >-
      B-2. Container image digest
      sha256:1c633a1d80264a1ff31824a06a5b8ea8566e6277bd7af4fa5db6dd993d4ec4de
      (Ubuntu 22.04.5 base; CPython 3.10.12 payload interpreter; the host
      interpreter is not the payload interpreter); boundary --network=none
      --read-only --memory 8589934592 --memory-swap 8589934592 --cpus=1
      --pids-limit=64 --cap-drop=ALL; 900 s wall per run, 3600 s total.
    - >-
      B-3. Seed 0 everywhere; zero independent instances; the eight fixtures
      are deterministic objects, not a sample. No statistical population is
      sampled and no tail claim is made (contract tail_checks).
    - >-
      B-4. The degree-filtered Macaulay/closure machinery of the frozen
      protocol (groups 1 and 3) was never executed: the native arithmetic
      stops at the unresolved interface before any matrix is formed.
    - >-
      B-5. No timeout, crash, or infrastructure failure is treated as
      mathematical evidence; the unmeasured status is a design property of the
      frozen protocol, not a failure of this successor.

  unresolved_confounds:
    - >-
      UC-1. The Definition 1.3 / Example 4.4 zero-slot grading interface
      (top-before-quotient convention; whether a zero image of a slot is a
      weighted slot or a deleted slot) remains unresolved. It blocks every
      certified native witness and is recorded as KN-OPEN-046735. Until it is
      resolved against the source, native fixtures record unmeasured and no
      degree estimate is substituted.
    - >-
      UC-2. The checker is a separate implementation but from the same
      Executor session (independent_session: false per the manifests' own
      note); it is not independent research validation. The zero-acceptance
      count rests on the producer's driver plus its same-session checker.
    - >-
      UC-3. The Coordinator's Step A re-verification in this review session
      was by direct inspection of the committed artifacts (file inventory,
      cross-record hash consistency, structural conformance of the four
      manifests against schemas/run-manifest.schema.json, raw/manifest
      agreement, certificate kinds); the machine re-runs (jsonschema
      validation, sha256 recomputation, tools/validate_ledger.py) were not
      executed in that session, which has no shell tool, and are pending for
      the orchestrating session before archival.
    - >-
      UC-4. The four archived command.txt files hold the payload command as
      a JSON-encoded string rather than verbatim (the adapter's write()
      helper encoded every object). The verbatim payload command is carried
      by each manifest's run.code.command and each supervisor receipt; the
      defect is a recording-format issue, fixed prospectively by
      e0756e31f (branch-only at review time).
    - >-
      UC-5. Post-archive tooling fix e0756e31f (adapter.py: verbatim string
      writes; persist schema-validation failures) was committed to this
      branch by a separate session after the runs archive; it is not on
      origin/main at review time. The frozen hash block certifies the files
      as executed; no run receipt was altered by it.

  obstruction: null
  obstruction_note: >-
    Deliberately null and stated rather than omitted. The block is required
    when direction is weakens or contradicts and on any record closing a
    lane; this record does neither - direction is neutral and no lane is
    closed. The unresolved grading interface is a precisely statable unknown,
    and it is promoted as the open problem KN-OPEN-046735 rather than dressed
    as a blocking quantity here.

  claim_boundary: >-
    No attack, speedup, novelty, breakthrough, closure, hardness result,
    universal impossibility, or cryptographic-scale transfer is claimed in any
    direction. No degree prediction is promoted to an observation. No timeout,
    crash, or infrastructure failure is treated as mathematical evidence.

