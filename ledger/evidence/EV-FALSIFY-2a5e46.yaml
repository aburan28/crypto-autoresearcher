evidence:
  id: EV-FALSIFY-2a5e46
  hypothesis_id: H-FALSIFY-40538b
  question_id: RQ-FALSIFY-a2c501
  experiment_ids: [EXP-FALSIFY-d770c1]
  run_ids: [RUN-FALSIFY-d770c1-001]
  finding_under_test: KN-FIND-c7d31e
  type: empirical
  direction: contradicts
  direction_note: >-
    Contradicts the finding's VERIFICATION SECTION and its stated causal
    mechanism. Does NOT contradict the theorem's algebra, which was reproduced
    exactly. The scope of the contradiction is stated precisely in O-6.
  strength: strong
  claim_tier: toy
  proof_status: empirical_only
  proof_refs:
    - experiments/EXP-FALSIFY-d770c1/specification.yaml
    - experiments/EXP-FALSIFY-d770c1/runs/RUN-FALSIFY-d770c1-001/raw-result.json
    - experiments/EXP-FALSIFY-d770c1/runs/RUN-FALSIFY-d770c1-001/manifest.yaml
  recorded_at: '2026-08-08'

  observations:
    - id: O-1
      text: >-
        KN-FIND-c7d31e (confidence: proved, evidence_level: theorem) derives
        gamma_m = Pr[at least m-1 of m i.i.d. Uniform{1..B} indices lie in the
        first half] = (m+1)/2^m, and speedup >= (m+1)/2. It then reports a
        verification table at p=1009 in which empirical gamma EXCEEDS the
        theoretical value in all four rows -- 0.86 vs 0.750, 0.66 vs 0.500,
        0.35 vs 0.313, 0.27 vs 0.188 -- and attributes the excess to "EC group
        law gives ~0.1 bonus in gamma above the theoretical floor". The excess
        is non-monotone in m (+0.11, +0.16, +0.04, +0.08).
    - id: O-2
      text: >-
        THE THEOREM IS CORRECT. Direct simulation of the finding's own model
        (i.i.d. Uniform{1..B}, one decomposition, B=64, 400000 trials per m)
        reproduces (m+1)/2^m to within |error| <= 0.0011 at m = 2, 3, 4, 5.
        Nothing in this record disputes the combinatorial identity.
    - id: O-3
      text: >-
        THE STATED MECHANISM IS FALSIFIED. On the real curve y^2 = x^3 + x + 1
        over F_1009, with the factor base sorted by x-coordinate and the BKK
        sparse check implemented as described, the PER-DECOMPOSITION retention
        at m=3 is 0.5000 against a theoretical 0.5000 -- absolute error 0.0000 --
        at every tested factor-base size B in {10, 16, 24, 32, 40}. The elliptic
        curve group law contributes exactly nothing to gamma. The claimed
        "~0.1 bonus" does not exist as a group-law effect.
    - id: O-4
      text: >-
        THE EXCESS IS AN ESTIMAND MISMATCH. At the same measurements the
        PER-TARGET success rate -- at least one of a target's decompositions
        being BKK-visible -- runs 0.6419, 0.6079, 0.7738, 0.9515, 1.0000 as B
        runs 10, 16, 24, 32, 40, tracking mean decomposition multiplicity 1.486,
        1.468, 2.782, 5.798, 11.106. The theorem predicts the first quantity;
        the verification table reports numbers in the range of the second.
    - id: O-5
      text: >-
        NULL OBJECT CONFIRMS. A purely combinatorial null -- a target carrying k
        i.i.d. decompositions, containing no elliptic curve of any kind --
        produces per-target rates that bracket every reported table value at
        multiplicity between k=1 and k=2: m=2 reported 0.86 against 0.748/0.938;
        m=3 reported 0.66 against 0.499/0.750; m=4 reported 0.35 against
        0.312/0.529; m=5 reported 0.27 against 0.187/0.341. The entire reported
        excess is reproduced with the named mechanism absent.
    - id: O-6
      text: >-
        SCOPE OF THE CONTRADICTION. Standing: the identity gamma_m = (m+1)/2^m;
        the derivation; the inequality speedup >= (m+1)/2 read as a
        per-decomposition lower bound. Not standing: the verification table as
        evidence for the theorem, since it measures a different estimand; the
        sentence "EC group law gives ~0.1 bonus in gamma above the theoretical
        floor"; and any speedup figure quoted from the empirical column,
        including the headline "guaranteed speedup >= 2.5-3.0x, observed ~3.3x"
        at N=2^256, to the extent the "observed" number derives from that column.
    - id: O-7
      text: >-
        WHY IT MATTERS BEYOND WORDING. Per-target success is not a constant of
        the model. It is driven from 0.61 to 1.000 by raising B alone at fixed
        m=3, at which point every target is solvable and the quantity has
        saturated. A number that can be moved across its entire range by a
        parameter the finding does not report cannot be carried to N=2^256 as a
        universal constant. The residual excess in per-decomposition retention at
        m=4 behaves the opposite way and confirms the diagnosis: it DECAYS
        monotonically with B (0.0375 at B=8, 0.0273 at B=12, 0.0210 at B=16,
        0.0168 at B=20), the signature of a finite-factor-base multiset
        counting artifact rather than a mechanism -- the decay-under-the-
        parameter-meant-to-destroy-it test from docs/inventor-protocol.md, run
        in the direction that exonerates the theorem.
    - id: O-8
      text: >-
        Controls for this probe: the theorem's own model reproduced to 0.0011
        (O-2) serves as the positive control on the visibility predicate, and
        the curve-free null object (O-5) as the negative. Both passed.

  interpretation: >-
    KN-FIND-c7d31e's theorem survives and its empirical verification does not.
    The finding presents a correct combinatorial result together with a table
    that appears to confirm it and in fact measures something else, plus a
    causal story for the gap that a null object refutes. The record's
    evidence_level: theorem is defensible for the identity; the "Verification"
    and "Cryptographic significance" sections are not supported by what was
    measured.

  proposed_correction: >-
    A superseding record for KN-FIND-c7d31e that (a) keeps the theorem and its
    proof unchanged, (b) relabels the verification table's empirical column as
    per-target success and states the factor-base size and mean multiplicity at
    which it was taken, (c) deletes the "EC group law gives ~0.1 bonus"
    sentence as falsified, and (d) restates the cryptographic-significance
    paragraph in terms of the per-decomposition bound only. Under AGENTS.md
    rule 4 and CLAUDE.md rule 2 this is a NEW record superseding the old one,
    never an edit. Only the Coordinator may issue it.

  dominated_by: not_applicable_methodological
  sota_delta:
    time_exponent: not_applicable
    note: >-
      This record makes no algorithmic claim of its own. Its effect on the
      corpus is to remove empirical support from a claimed 3.3x observed speedup,
      leaving the theorem's (m+1)/2 per-decomposition bound as the supported
      statement.

  knowledge_promotion: warranted
  knowledge_promotion_reason: >-
    The estimand-mismatch pattern -- derive a per-object probability, verify with
    a per-target rate, explain the gap by naming an unmodelled mechanism -- is
    reusable, was found by a cheap null object, and applies to any yield or
    retention claim in this corpus. Promotion is proposed as a technique entry,
    NOT as a mathematical finding, and requires Coordinator approval.

  scope_limits: >-
    One curve (y^2 = x^3 + x + 1 over F_1009), m in {3,4}, factor bases up to
    B=40, multisets enumerated exhaustively. The finding's own verification table
    is at p=1009, so this is a like-for-like audit of its stated evidence, not a
    crypto-scale claim. Nothing here bounds the true speedup of BKK sparse
    checking at cryptographic parameters in either direction.

  independent_review_required: true
  independent_review_note: >-
    This record contradicts part of a finding carrying confidence: proved and
    evidence_level: theorem. AGENTS.md rule 12 and the model policy require an
    independent review-adversarial session by a reviewer that did not originate
    the claim before any status change follows from it.

  authority_note: >-
    Evidence only. No hypothesis status changed, no finding edited or
    superseded; only the Coordinator may do that (AGENTS.md rule 1).
