evidence:
  id: EV-SSIQ-48d274
  hypothesis_id: null
  hypothesis_id_note: >-
    Explicitly null, not omitted: this batch executes a three-point
    intermediate-budget truncation sweep, the follow-up RT-BATCH-012
    itself named. It does not test H-SSIQ-36e970's real-arm prediction,
    and its own headline finding (see O-3 below) is independently
    confirmed by this batch's own Red Team to be ORTHOGONAL to
    RT-BATCH-011's RNG-sharing determinism question -- a new, standalone
    finding about search-budget truncation itself, not a datum for or
    against H-SSIQ-36e970.
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  batch_id: BATCH-013
  experiment_ids: [EXP-SSIQ-a85692]
  run_ids: [RUN-SSIQ-a85692-j]
  type: empirical
  direction: neutral
  direction_note: >-
    NEUTRAL toward H-SSIQ-36e970 (see hypothesis_id_note). Toward the
    truncation-instrument question this batch was built to answer (does
    the resolved-value distribution shift toward the true population mix
    as budget grows, per RT-BATCH-012's own falsifiable prediction), this
    evidence is STRONGLY POSITIVE AND, UNIQUELY IN THIS CAMPAIGN'S
    HISTORY, PROVEN RATHER THAN MERELY OBSERVED: the resolved-value
    distribution does shift toward the true population mix as budget
    grows, via a directly-traced, code-level mechanism (not a
    correlation), independently confirmed twice on two separate real
    executions with different resolved-vertex sets.
  strength: preliminary
  strength_note: >-
    preliminary, campaign-wide cap unchanged (session-only independence,
    same model family across producer and both reviewers) -- but this
    record documents the STRONGEST epistemic basis this campaign has
    produced for any single finding to date, and the cap here reflects
    only the INDEPENDENCE-TIER ceiling this campaign has applied
    uniformly since BATCH-001, not any weakness in the finding itself.
    Unlike every prior batch's "0 differences" or "N/M matches" style
    result, this finding was (a) independently DERIVED from first
    principles (Dijkstra correctness of build_smooth_table plus a named,
    testable wall-clock-monotonicity premise) BEFORE being checked
    against the data, by the Red Team; (b) that derivation's every
    testable consequence (exact subset-nesting of the three resolved
    vertex sets; strictly monotone-non-increasing values on all 10
    multiply-resolved vertices; zero exceptions) was independently
    verified against raw per_vertex_records by both this Coordinator and
    the Red Team; and (c) the Validator INDEPENDENTLY RE-EXECUTED the
    entire run from a clean scratch directory and found the identical
    directional pattern (100% new_value > archived_value, 0 exceptions)
    on a SECOND, genuinely different search with a different
    resolved-vertex set (26/109/175 resolved vs. the original's
    25/106/187) -- true C-REPRO of the finding itself, not merely of the
    artifact bytes.
  claim_tier: toy
  claim_tier_note: >-
    Toy scale, single prime p=2437, N=203 vertices. Third amendment in
    this lineage (after v8, v9) to spend real, non-recoverable delta_E
    search compute (474.15s of a 1200s budget, across three sweep
    points).
  proof_status: derivation
  proof_status_note: >-
    UPGRADED from empirical_only, the tier every other evidence record in
    this campaign has used, because the headline claim (O-3 below) rests
    on a code-level derivation from Dijkstra correctness
    (find_roots_with_multiplicity's self-verification, established by
    RT-BATCH-011 and re-confirmed here) plus one named, explicitly
    testable premise, not on a fit to observed data alone -- and every
    testable consequence of that derivation was independently checked
    against raw data with zero exceptions, twice (once per reviewer, and
    a third time via the Validator's own independent re-execution).
  proof_refs:
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-013/reviews/RT-BATCH-013.md
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-013/reviews/VAL-BATCH-013.md
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-j/truncation_sweep_comparison.json
    - experiments/EXP-SSIQ-a85692/implementation/compute_delta_e.py
    - experiments/EXP-SSIQ-58b642/implementation/build_isogeny_graph.py
  preregistration_binding:
    specification: experiments/EXP-SSIQ-a85692/specification_v10.yaml
    freeze_commit: ca905c24
    verified_by: TASK-20260806-aefc34
    detail: >-
      specification_v10.yaml frozen 2026-08-06 at commit ca905c24, after
      TWO pre-freeze review rounds. Round 1 (DO-NOT-FREEZE): four blocking
      findings, all directly demonstrated against the committed spec text
      and real underlying code (PF-1 a graph-rebuild-count self-
      contradiction; PF-2 an incomplete failure-isolation scope; PF-3 a
      false code-verified justification for an unnecessary duplicate
      function; PF-4 a citation of a non-existent module-level import).
      Round 2 (FREEZE-WITH-FIXES): all four independently re-verified
      genuinely fixed against the real code, two new advisories (PF-9,
      PF-10) applied. The Validator independently confirmed
      manifest.yaml's code.commit equals the freeze commit, DYNAMICALLY
      tested both previously-unexercised failure paths (PF-2's per-sweep-
      point isolation, PF-10's step-0 unwrapped propagation) via
      monkeypatch harnesses against the real unmodified module, and
      independently RE-EXECUTED the full run from a clean scratch
      directory, reproducing the directional finding exactly on a
      genuinely different search.
  observations:
    - id: O-1
      statement: >-
        EXECUTION FIDELITY IS CLEAN, INDEPENDENTLY CONFIRMED BY BOTH
        REVIEWERS, INCLUDING DYNAMIC TESTS OF BOTH PREVIOUSLY-
        UNEXERCISED FAILURE-ISOLATION PATHS. All 3/3 sweep points
        succeeded (sweep_point_error null throughout); the Validator
        built two independent monkeypatch harnesses against the real,
        unmodified delta_e_truncation_sweep_v10.py to force each
        previously-dormant failure path for real: PF-2's per-sweep-point
        isolation (forced a failure at b=0.8 only; confirmed b=0.6 and
        b=1.0 completed unaffected and the artifact was written with
        n_sweep_points_succeeded=2/3) and PF-10's unwrapped step-0
        failure mode (forced a graph-build failure; confirmed the
        exception propagated uncaught with zero artifacts written). The
        Red Team independently confirmed both mechanisms by direct code
        read and raised no objection to execution fidelity, cost/budget
        honesty (474.15s of 1200s, 39.5%), or scope (OBJECTIVE_BOUNDARY
        correctly excludes any PERSISTS/WEAKENS label or claim about
        H-SSIQ-36e970/lever L4). This Coordinator's own precommit checks
        independently re-derived the same coverage figures from raw JSON
        before the snapshot commit, converging with both reviewers.
      supported_by: [TASK-20260806-62e105, TASK-20260806-5af708, TASK-20260806-aefc34, TASK-20260806-d4379a]
      confidence: high
    - id: O-2
      statement: >-
        THE COMPARISON LOGIC ITSELF IS GENUINELY DIRECTION-BLIND,
        INDEPENDENTLY TRACED BY BOTH REVIEWERS -- RULING OUT A
        COMPARISON-CODE ARTIFACT AS THE SOURCE OF THE DIRECTIONAL
        FINDING BEFORE ATTRIBUTING IT TO THE SEARCH ALGORITHM.
        compare_against_archived/compare_against_v8
        (delta_e_truncation_probe_v9.py, genuinely imported unchanged by
        v10, never modified) perform a single unconditional equality
        test (matches vs. differs) with no directional branch (<, >, >=,
        <=) anywhere in either function -- confirmed by direct read by
        both the Red Team and the Validator independently. This is a
        necessary precondition before the observed 100%-directional
        pattern can be attributed to the search algorithm's own behavior
        rather than an asymmetric bug in how values are compared.
      supported_by: [TASK-20260806-d4379a, TASK-20260806-aefc34]
      confidence: high
    - id: O-3
      statement: >-
        THE HEADLINE FINDING -- A TRUNCATED SEARCH NEVER RETURNS A
        SMALLER delta_E VALUE THAN THE SAME SEED'S COMPLETE SEARCH,
        FREQUENTLY RETURNING A STRICTLY LARGER ONE -- IS A PROVEN
        STRUCTURAL PROPERTY AT THIS TOY SCALE, NOT MERELY AN OBSERVED
        CORRELATION, AND IS THE STRONGEST-EVIDENCED SINGLE CLAIM THIS
        CAMPAIGN HAS PRODUCED. The Red Team derived the expected sign
        from first principles BEFORE checking the data: build_smooth_table
        is a best-first (Dijkstra) expansion whose finalized degree for a
        vertex, once assigned, is the graph's true minimal reachable
        degree regardless of exploration order (guaranteed by
        find_roots_with_multiplicity's self-verification, the identical
        mechanism RT-BATCH-011 already established); given a FIXED
        per-vertex RNG seed (confirmed byte-identical seed_used across
        all three sweep points, independently spot-checked) and no
        wall-clock dependency in seed derivation, the heap push/pop
        sequence up to any point in time is IDENTICAL regardless of
        declared budget -- so table(b1) is a strict prefix of table(b2)
        for b1<b2, modulo exactly one named, testable premise (a larger
        declared budget permits at least as many completed iterations on
        the same hardware). This Coordinator independently re-verified
        this premise's two directly-checkable consequences against raw
        per_vertex_records: (a) the three resolved vertex sets nest
        EXACTLY, s(0.6) subset s(0.8) subset s(1.0), zero exceptions in
        either direction (sizes 25/106/187); (b) every vertex resolved at
        2+ budgets with a changed value (14 pairwise comparisons, 10
        unique vertices) has a value that is STRICTLY LOWER at the larger
        budget, zero increases. The Validator went further and
        INDEPENDENTLY RE-EXECUTED the entire run from a clean scratch
        directory: a genuinely different search (different resolved-
        vertex sets, 26/109/175 vs. the original 25/106/187) reproduced
        the IDENTICAL directional pattern on its own 62 differing triples
        -- 100% new_value > archived_value, zero exceptions, confirmed on
        a second real computation, not merely re-derived from the same
        data.
      supported_by: [TASK-20260806-d4379a, TASK-20260806-aefc34]
      confidence: high
    - id: O-4
      statement: >-
        CONVERGENCE UNDER TRUNCATION IS VALUE-ORDERED AND SHARP, SHOWN AT
        THE VERTEX-IDENTITY LEVEL, NOT MERELY THE AGGREGATE-COUNT LEVEL.
        This Coordinator independently reconstructed, from run-j's own
        raw data and the archived ground truth, that the 34 vertices this
        run resolved to delta_E=2 at b=1.0 are EXACTLY (zero symmetric
        difference) the true archived population's own 34 delta_E=2
        vertices, and likewise for all 70 delta_E=3 vertices -- both
        sub-populations FULLY CONVERGED to their correct values by b=1.0,
        strictly below the 1.14993s natural-completion floor. By
        contrast, of the 35 resolved vertices whose true value is
        delta_E=5, only 1 resolved correctly; of the 16 resolved vertices
        whose true value is delta_E=7, zero resolved correctly (all 16
        resolved to some larger, non-minimal value). This is not a
        surprising complication of O-3's mechanism -- it is its predicted
        signature (shallow collisions are locked in earliest by
        best-first search order) and is independently confirmed at the
        strongest possible granularity (vertex-set identity, not
        aggregate count).
      supported_by: [TASK-20260806-d4379a]
      confidence: high
    - id: O-5
      statement: >-
        THE RAW DIFFERS-PROPORTION TREND (16.0% AT b=0.6, 7.5% AT b=0.8,
        26.7% AT b=1.0) IS NON-MONOTONIC AND MUST NOT BE CITED BARE --
        ITS DIP AT b=0.8 IS A COMPOSITION EFFECT, NOT A CHANGE IN
        PER-VERTEX RISK. The Red Team traced this directly: at b=0.6 the
        tiny 25-vertex resolved set already includes some contested
        delta_E=4 cases; at b=0.8 the resolved set balloons by absorbing
        a large, already-converged block of delta_E=3 vertices (49 of
        70, none yet miscounted) alongside the already-converged
        delta_E=2 block, diluting the proportion; at b=1.0, resolution
        reaches materially deeper true values (delta_E=5 through 16) for
        the first time in volume, and per O-4 these deep, newly-resolved
        vertices are disproportionately NOT yet converged -- so the jump
        to 26.7% reflects WHICH vertices newly entered the resolved set,
        not a rising divergence probability at fixed depth. Any future
        citation of this proportion trend must state this composition
        explanation, not the bare percentages, to avoid the exact
        opposite misreading ("truncation gets worse with more budget")
        from what the data actually supports (more budget resolves
        harder vertices, which have not yet had time to converge -- a
        materially weaker and different claim).
      supported_by: [TASK-20260806-d4379a]
      confidence: high
    - id: O-6
      statement: >-
        THE FROZEN CONTRACT'S OWN PF-7 CONJUGATE-PAIR-CORRECTION
        DISCIPLINE, ORIGINALLY REQUIRED ONLY FOR RESOLVED-VERTEX COUNTS,
        MUST BE EXTENDED TO THE DIFFERS COUNTS BEFORE ANY FUTURE
        CITATION STATES A BARE "62 DIFFERENCES." The Red Team computed
        the conjugate-pair structure of the 62 differing triples
        themselves (not merely the resolved sets): b=0.6 yields 3
        effective independent units from 4 raw (1 pair + 2 singles);
        b=0.8 yields 5 of 8 (3 pairs + 2 singles); b=1.0 yields 26 of 50
        (24 pairs + 2 singles) -- approximately 34 effective independent
        units total, not 62, a ~45% reduction. This does NOT weaken the
        directional claim itself (every unit, paired or not, points
        the same direction, O-3), but it does bound any future magnitude
        claim ("how often does truncation produce a wrong value at this
        budget") and must be stated alongside any raw count.
      supported_by: [TASK-20260806-d4379a]
      confidence: high
    - id: O-7
      statement: >-
        THIS FINDING IS ORTHOGONAL TO, NOT A NARROWING OR REOPENING OF,
        BATCH-011's OWN RNG-SHARING DETERMINISM CONCLUSION -- A CRITICAL
        SCOPE BOUNDARY BOTH REVIEWERS INDEPENDENTLY CONFIRMED. BATCH-011
        (DEC-20260806-f7d62d, EV-SSIQ-69ba8b) concluded that
        two_sided_search's output is provably RNG-invariant WHENEVER THE
        SEARCH COMPLETES WITHOUT TRUNCATION -- a determinism argument
        whose premise is completeness, independent of which RNG scheme
        (shared-sequential vs. independent-per-vertex) drove the search.
        That premise is untouched by this run: this run's own internal
        check confirms RUN-SSIQ-a85692-b (archived, shared-RNG, complete)
        and RUN-SSIQ-a85692-h (v8, independent-RNG, complete) continue to
        agree exactly at every vertex (comparison_1 and comparison_2
        report identical differing-vertex sets at every budget, since
        their two source maps are themselves value-identical). What this
        batch adds is a DIFFERENT axis: not "does RNG-sharing matter" but
        "does TRUNCATION matter, independent of RNG scheme" -- and the
        answer, now proven, is yes. This is directly useful for designing
        any FUTURE truncation-based probe of BATCH-011's own boundary
        question (any such probe must now control for or explicitly
        reason about this confound), but it does not itself answer,
        narrow, or reopen that question, exactly as this run's own
        OBJECTIVE_BOUNDARY states.
      supported_by: [TASK-20260806-d4379a]
      confidence: high
  inference: >-
    RUN-SSIQ-a85692-j executes exactly as specification_v10.yaml requires,
    confirmed independently by both the Validator (true C-REPRO, dynamic
    fault-injection tests of two previously-unexercised failure paths,
    and independent re-execution reproducing the headline finding on a
    genuinely different search) and the Red Team (execution fidelity
    clean; the headline directional finding independently derived from
    first principles BEFORE checking the data, then confirmed with zero
    exceptions against raw data). This batch establishes, at toy scale
    and with the strongest epistemic basis this campaign has produced to
    date, that budget-truncated delta_E search systematically and
    provably biases the returned upper bound upward (never downward),
    convergence to the true value proceeding strictly in ascending order
    of true delta_E depth. This finding is orthogonal to BATCH-011's own
    RNG-sharing determinism conclusion (O-7) -- it is a new, standalone
    instrument-behavior finding, not evidence for or against
    H-SSIQ-36e970, and it directly informs how any future truncation-based
    probe of BATCH-011's original boundary question must be designed.
  boundaries:
    - >-
      No claim about H-SSIQ-36e970, a delta_E-gradient's existence, or a
      p^{1/4} algorithm. Lever L4 is NOT retired.
    - >-
      This finding does NOT bear on, narrow, or reopen BATCH-011's own
      RNG-sharing determinism conclusion (O-7) -- that conclusion rests
      entirely on search completeness, which this run never provides at
      any sweep point (all three budgets remain strictly below the
      1.14993s natural-completion floor).
    - >-
      Any future citation of the raw "62 differences" count, or the
      16.0%/7.5%/26.7% proportion trend, MUST include the conjugate-pair-
      corrected effective sample size (~34, not 62, per O-6) and the
      composition explanation for the proportion trend (per O-5), not
      the bare numbers.
    - >-
      Despite proof_status: derivation, the underlying wall-clock-
      monotonicity premise (a larger declared budget permits at least as
      many completed iterations on the same hardware) is a physical, not
      mathematical, assumption -- verified true with zero exceptions in
      this batch's own data (twice, on two separate executions), but not
      something the code itself enforces or guarantees at a different
      scale or under heavier system load.
    - >-
      Toy scale throughout (p=2437, N=203); nothing transfers to
      cryptographic scale. Evidence strength stays capped at preliminary
      by this campaign's own session-only-independence convention,
      despite the derivation-tier proof_status.
  unresolved_confounds:
    - >-
      RT-BATCH-013's own named next control: one more sweep point at
      1.1-1.2s (straddling, and for some vertices at or above, the
      observed 1.14993s natural-completion floor) to directly test
      whether delta_E>=5 convergence begins there while delta_E=2/3
      remain exactly converged -- the cheapest concrete test of whether
      convergence is genuinely monotone-in-budget across the full value
      range.
    - >-
      RT-BATCH-011's own original truncation-boundary question (does the
      RNG-sharing confound reopen under truncation) remains UNRESOLVED --
      this batch establishes a necessary design consideration (truncation
      itself is a confound requiring control) for any future probe
      attempting to answer it, but does not answer it.
    - >-
      Model independence remains absent and unverifiable in this
      environment, unchanged from every prior batch.
