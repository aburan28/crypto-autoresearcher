        transcript, no-extra-oracle premise, exact serialization of every
        reusable table key, label, coefficient, frame, and lookup state, and
        aggregate charging of all predicate, scan, replay, and verification
        interactions.
      - >-
        J3 confirms that every known-false control stops at a named absent
        premise. It preserves the full-group denominator N, identifies the
        real but subconstant B^(-1/4+o(1)) one-restriction route at the frozen
        budget, and rejects any coordinate, P1553, target-conditioned,
        opaque-handle, marginal-success, SOTA, or B71 transfer.
      - >-
        The statement-only rederiver independently obtains the normalized
        interval identity, all eight endpoints, bijective unranking, table and
        scan exponents, decoder, and conditional MPZ substitution. It flags
        the same-oracle reusable-multimap premise and the constant-size N=2
        exception without reading producer or sibling outputs.
  supported_core:
    model: MPZ dense prime-order generic group, optionally with exactly the shared oracle ro(v)=RO(pi(v)) of Corollary 3
    asymptotic_scope: sufficiently large prime N; the constant-size N=2 case is excluded from the interval extractor and is directly solvable
    interface: >-
      One target-independent exact universal object for arbitrary public
      signed occurrence-labelled decks, stable under every canonical dyadic
      cumulative restriction of exactly F0 and F1, with full public
      reconstructible F2, F3, and F4 lineage and no extra oracle.
    construction: >-
      Let B=N^(1/5), m=2^ceil(log2(B)), C=sum_i=0^4 m^i,
      F_i={(i,d,sigma,[sigma(d+1)m^i]P)}, R=Q+[C]P, and D=[m^2]P.
    universal_witness: >-
      For Q=[x]P with canonical base-m digits x=sum_i d_i*m^i, the five
      all-positive occurrences sum to [x+C]P=R.
    exact_restriction_calls: 2*log2(2m)=2*(ceil(log2(B))+1)
    residual_intervals: >-
      For each of eight sign vectors tau, T=e2+m*e3+m^2*e4 equals
      A_tau+r for one unique rank 0<=r<m^3; rank and labels are recovered by
      exact sign-dependent base-m unranking.
    interval_table: >-
      Before Q, serialize the complete multimap of exact reusable dense keys
      for [j]D together with every j and lookup-framing value for
      0<=j<ceil(m^(7/4)). The same persistent generic encoding is used online;
      no opaque handle or target-dependent state crosses phases.
    interval_scan: >-
      For every tau, normalize the residual by [A_tau]D and scan
      ceil(m^3/ceil(m^(7/4))) giant blocks, replaying every matching j,
      rejecting padded ranks, unranking labels, decoding x_hat, and verifying
      [x_hat]P=Q.
    advice_bits: ell=B^(9/4+o(1)) after complete ordinary-bit serialization
    aggregate_main_interactions: >-
      k=B^(5/4+o(1)), including public reconstruction, every inlined
      restriction interaction, all giant steps and dense queries, multimap
      lookups and collision replay, decoding, shared-RO calls, and final
      verification.
    success_bound: 3*ell*(k+1)^2/N=B^(-1/4+o(1))=N^(-1/20+o(1))
    consequence: >-
      A universal exact solver, or one with asymptotically nonvanishing
      complete-transcript success, satisfying every frozen premise would solve
      every fresh target while MPZ bounds its average success by a quantity
      tending to zero. Such a solver therefore cannot exist inside this exact
      ordinary-generic resource rectangle.
  one_restriction_boundary:
    status: open_unverified_mechanism
    residual_structure: >-
      With only F0 restricted, fixed signs leave four normalized mixed-radix
      digits and intervals of length m^4. This packet supplies no applicable
      constant-success interval-preprocessing theorem for that residual.
    same_budget_full_group_route: >-
      The retrieved full-group construction at S=B^(9/4+o(1)) and
      T=B^(5/4+o(1)) has only B^(-1/4+o(1)) residual success. Independent
      composition with the outer event yields B^(-1/2+o(1)), not nonvanishing
      success.
    constant_success_full_group_time: B^(11/8+o(1)), above the B^(5/4+o(1)) online cap
    direct_interval_bsgs_time: B^(7/4+o(1)) with the frozen table budget
    conclusion: >-
      These are upper-bound and composition observations, not a lower bound.
      A new interval-specific preprocessing or non-multiplicative composition
      theorem could still change this boundary.
  limitations:
    - The exact cumulative predicate is a premise; no record constructs it or establishes it for P1553.
    - MPZ supplies the enclosing generic extraction bound, not the signed-deck object, occurrence labels, subset-stability guarantee, or complete-transcript guarantee.
    - The table must use the same persistent generic encoding and serialize a complete multimap including keys, coefficients, framing, collision state, and occurrence lineage; uncharged opaque handles are outside scope.
    - The result is distributional over a fresh uniform generic target and representation randomness; an all-target exact solver is stronger and therefore covered, but no pointwise MPZ theorem is claimed.
    - Preprocessing interactions are unbounded in MPZ; only the crossing advice bits and complete online interaction count are bounded here.
    - The N=2 prime case makes D=[m^2]P the identity and is excluded from the stated asymptotic extractor; it is a direct constant-size case.
    - It does not cover coordinate-aware elliptic-curve, Semaev, resultant, field-oracle, P1553 target-local, representation-sensitive, or random-deck-only algorithms.
    - It does not cover target-conditioned advice, multiple or arbitrary-domain random oracles, non-subset-stable predicates, marginal per-query success, unbounded unit-cost words, or nonserialized persistent state.
    - The one-restriction interval route remains open and unverified; no B^(5/4) construction, lower bound, or composition theorem is established.
    - It is not an ECDLP algorithm, generic ECDLP lower bound, P1553 impossibility, attack, speedup, SOTA movement, B71 admission, closure, completion, or breakthrough.
