  scope_statement: >-
    This record SUPPORTS H-MONO-45183a's Part A containment claim (the
    m-th Semaev summation cover's monodromy is NOT full symmetric for
    m>=4, contradicting a premise of KN-OPEN-009) via strong, multiply-
    independent evidence, and SUPPORTS Part B's sublocus root-multiplicity
    claim scoped to the transversal sampling convention. It corrects the
    record's own headline framing (the raw specialization count
    overstates its discriminating power relative to the dual-path
    cross-check and independent third-path census) and names extensive
    control-design and reporting-accuracy limitations inherited from or
    introduced during execution, none of which reverse the core findings.
    It creates no ECDLP claim, no relation-rate claim, no cryptographic-
    scale claim, and does not close KN-OPEN-009 (only its symmetric-
    monodromy half is addressed; the imprimitivity half and the
    relation-rate half are untouched). GOAL-MONO-001 remains paused; this
    experiment drew on no part of its campaign budget.
