  proof_status: derivation
  proof_status_note: >-
    H-MONO-45183a's Part A CONTAINMENT claim (geometric/arithmetic monodromy
    of the m-th Semaev summation cover embeds in the elementary abelian
    (Z/2)^(m-2), never the full symmetric group) is an unconditional
    algebraic derivation (Kummer theory over a UFD plus the group law),
    exercised — not re-proven — by this experiment. The EQUALITY claim
    (the full (Z/2)^(m-2) is actually realized, HEUR-KUM-2) is conditional
    on S_m's irreducibility, unproven at m>=4, and is corroborated here
    empirically (G8: 2^(m-2) distinct Frobenius permutations genuinely
    realized at m=4 and m=5, confirmed independently by the Red Team) —
    corroboration, not proof. Both reviewers independently re-derived the
    containment argument from scratch and, critically, independently
    discovered and proved a STRONGER structural fact neither the contract
    nor the Executor stated: because F_p has a unique quadratic extension
    F_{p^2}, any chord-formula signed-sum construction of this shape can
    only ever produce roots of degree 1 or 2 over F_p, regardless of
    curve — making the frozen contract's own mandatory cross-curve null
    control mathematically unsatisfiable by design (the Red Team confirmed
    this holds for literally any companion object, including a singular
    cubic, a quartic, and a curve-free constant). The genuine, powerful,
    independent evidence for the Galois claim rests on the dual-path
    cross-check (64,000 total comparisons across both runs, demonstrated
    ~89% power to detect a real violation via coefficient-corruption
    mutation testing) and the Red Team's own third, wholly independent
    verification, including an EXHAUSTIVE census of all 2,915,514
    admissible triples at p=103 (M1=0, M2=1.000000 exactly) — not on the
    raw 960,000-specialization Path-1-only headline count, which both
    reviewers independently proved is logically forced to succeed by
    construction and therefore closer to an implementation check than an
    independent Chebotarev-style discriminant.
  proof_refs:
    - ledger/hypotheses/H-MONO-45183a.yaml#mechanism (A-1 through A-3, B-1 through B-3)
    - experiments/EXP-MONO-12ce1c/reviews/validator/validation-report.yaml (independent re-derivation of the field-degree argument; G8 corroboration of HEUR-KUM-2)
    - experiments/EXP-MONO-12ce1c/reviews/red-team/red-team-report.yaml (independent proves-too-much construction; third-path exhaustive 2.9M-triple census; dual-path mutation-testing power measurement)

  observations:
    - >-
      STAGE 0 (BASELINE REPRODUCTION) HOLDS EXACTLY, INDEPENDENTLY
      CONFIRMED THREE TIMES. The m=3 split-frequency identity matches
      EV-MONO-a0a89c's own committed OBS-3 closed form exactly (symbolic,
      exact-fraction arithmetic) on all 105 baseline curves, confirmed by
      the Executor, independently re-confirmed on all 105 curves by the
      Validator (not a sample), and used as a fixed baseline by the Red
      Team.
    - >-
      PART A'S CONTAINMENT CLAIM IS ROBUSTLY, MULTIPLY-INDEPENDENTLY
      SUPPORTED — THE CENTRAL RESULT OF THIS RECORD, DIRECTLY BEARING ON
      KN-OPEN-009. The dual-path cross-check (an independently-coded
      direct signed-sum classifier versus an independently-coded explicit-
      polynomial-construction-and-factorization classifier) found ZERO
      disagreements over 64,000 total comparisons across both runs. The
      Red Team independently measured this cross-check's discriminating
      power directly (not assumed): corrupting a single S_4 coefficient by
      +1 produces 88.8-89.9% disagreement between the two paths — the
      cross-check has real, demonstrated power to catch a genuine
      violation, it is not vacuous. The Red Team additionally built a
      THIRD, wholly independent classifier (its own Sylvester-determinant
      and factorization code, sharing no lines with either Executor path)
      and ran an EXHAUSTIVE census of all 2,915,514 admissible triples at
      p=103 — M1=0, M2=1.000000 exactly, no sampling involved at all. The
      Validator independently reproduced M1=0/M2=1.000 on a fresh
      no-shared-code sample. Together these constitute strong, multiply-
      independent evidence for the containment claim.
    - >-
      BUT THE HEADLINE "960,000 SPECIALIZATIONS, ZERO VIOLATIONS" FRAMING
      OVERSTATES WHAT M1/M2 ALONE ESTABLISH — BOTH REVIEWERS INDEPENDENTLY
      DISCOVERED THIS, AND IT IS THE RECORD'S MOST IMPORTANT METHODOLOGICAL
      FINDING. Because Stage 2's M1/M2 metrics are computed EXCLUSIVELY
      from the direct signed-sum path (Path 1), and because F_p has a
      UNIQUE quadratic extension F_{p^2}, any root produced by this
      construction (chord-formula rational functions of x-coordinates in
      F_p and y-coordinates each individually in F_p or F_{p^2}) can
      ONLY EVER have degree 1 or 2 over F_p — a 4-cycle or 3+1 split is
      not merely improbable, it is mathematically IMPOSSIBLE for this
      construction shape, independent of the cover's true abstract
      monodromy. M1=0 and M2=1.000 are therefore close to a NECESSARY,
      near-tautological consequence of the construction once "roots are
      signed sums" is already established (itself independently verified
      by the dual-path cross-check against Path 2's unconstrained
      factorization) — not an independent Chebotarev-style measurement
      against the full-symmetric alternative. The Validator confirmed the
      classification code itself is not blind (feeding it a genuine 2+1+1
      root set correctly flags M1); the issue is that Path 1's own
      construction can never GENERATE such an input. The real evidential
      weight for ruling out full-symmetric monodromy rests on the
      dual-path cross-check and the independent third-path census named
      above, not on the raw Path-1 specialization count.
    - >-
      THE MANDATORY CROSS-CURVE NULL CONTROL WAS UNSATISFIABLE BY DESIGN
      — A FLAW IN THE 25-DAY-OLD ORIGINAL CONTRACT, NOT AN EXECUTION
      DEFECT, INDEPENDENTLY CONFIRMED AND STRENGTHENED BY BOTH REVIEWERS.
      `measured_null_1` (mixing points from two different curves) was
      required by the frozen contract to exhibit 4-cycles/3+1 splits;
      it did not, in either run. The Executor's own "Finding 1" (Frobenius
      acts by sign-flip on each point independently of which curve it
      lives on) is algebraically correct — both reviewers independently
      re-derived it from the actual code, not the prose. The Red Team went
      further with a proves-too-much construction: substituting the
      companion "curve" with a singular cubic, an unrelated quartic, and
      even a curve-free constant, ALL still produced only the two
      Kummer-allowed cycle types — proving the null is unsatisfiable for
      ANY companion object whatsoever, not merely for curves. The
      contract's own premise ("the sign-torsor argument does not apply
      across two curves") is mathematically false. This is a genuine
      control-design flaw in H-MONO-45183a's own 25-day-old derivation,
      not a defect in this record's execution or a threat to the
      containment finding — but per the frozen contract's own literal
      text, and its own explicit `ordering_control` clause ("if the rule
      emits the same label on a null and a treatment arm, the rule
      discriminates nothing and must be rewritten before any treatment
      output is read" — never cited by the Executor despite being exactly
      the applicable clause), Stage 2 is formally VOID. This decision
      does not lift that literal trigger; it explains its cause precisely
      and separately credits the independent dual-path/third-path evidence
      that does not depend on Stage 2's own (flawed) control design.
    - >-
      TWO NUMERICAL DISCREPANCIES FOUND IN THE EXECUTOR'S OWN REPORTING OF
      measured_null_1, DISCLOSED. `execution_report.yaml` and
      `implementation.md` both state "4986 and 4762 valid trials" for the
      two runs; the Red Team recomputed directly from the committed
      artifact and found run 1's actual value is 4,793. Separately,
      `implementation.md`'s stated split-rate figures ({62%, 38%}) match
      neither the corrected artifact data nor either competing model; the
      Red Team independently derived the CORRECT cross-curve-torsor-forced
      prediction (P(split) = a^2 b + (1-a)^2(1-b) = 0.2550, using the
      construction's own two independent quadratic-character probabilities
      a, b) and found the ACTUAL committed data matches it closely (0.2591
      and 0.2516, both under 1 s.e.) — the correct numbers support Finding
      1 MORE strongly than the Executor's own (incorrect) reported
      numbers did. A reporting-accuracy defect, not a substantive one.
    - >-
      PART B'S M4 SIGNAL IS REAL AND MATCHES FORCED VALUES CLOSELY;
      tau=1's FORCED-ZERO HOLDS EXACTLY. 15 of 16 curve-m cells matched
      their forced sublocus-collision-rate value within 3 standard errors
      (the one exception, CM2 at m=5, sigma=4.20, is the smallest-order,
      highest-tau curve in the panel); tau=1 curves gave exactly zero
      collisions across 20,000 valid tuples per (curve,arm), both runs.
      Both reviewers independently re-derived the forced M4 formulas from
      H-MONO-45183a's own step B-2 and confirmed the reported values
      match exactly.
    - >-
      FINDING 2's STATED MECHANISM (BIRTHDAY PARADOX) IS FALSIFIED BY THE
      RED TEAM, BUT ITS CAUSAL CLAIM IS CORROBORATED BY A DIFFERENT, MORE
      PRECISE MECHANISM — REVEALING PARTS A AND B ARE NOT INDEPENDENT, A
      GENUINE STRUCTURAL FINDING NEITHER THE CONTRACT NOR THE EXECUTOR
      ANTICIPATED. The Executor attributed M3's large sigma deviations
      (up to 24 at m=5 on small curves) to a birthday-paradox coincidence
      rate among 2^(m-2) draws from a group of order N. The Red Team
      confirmed the CAUSAL claim (excluding "nondistinct_roots" cases does
      bias M3 in the observed direction and magnitude — re-including them
      recovers M3 close to its forced value in every case) but found the
      STATED birthday-paradox FORMULA has no tau-dependence, while the
      real data shows strong tau-dependence (e.g. RO1: tau=1, exclusion
      rate 0.2124; CM2: tau=4, exclusion rate 0.7578). The actual driver
      is PART B's OWN root-multiplicity (E[2]-collision) mechanism, not a
      generic birthday coincidence — meaning the two "independent" parts
      of this hypothesis are coupled: Part B's collisions are literally
      the filter responsible for Part A's M3 exclusion-stratum bias. This
      does not affect M1/M2 (unaffected by this stratum) but is a genuine
      structural insight about the record's own design.
    - >-
      FINDING 3'S CONTROL WAS EMPTY (NOT MERELY MATHEMATICALLY FORCED TO
      AGREE, BUT LITERALLY NEVER INDEPENDENTLY SAMPLED), AND THE RED TEAM
      IDENTIFIES AND MEASURES THE CONTROL THAT SHOULD HAVE RUN INSTEAD.
      The Executor's "Finding 3" (fixed-sign and random-sign conventions
      give identical results because sign choice is a bijective
      relabeling) is algebraically correct — confirmed independently by
      both reviewers — but the Red Team found the two arms, as
      IMPLEMENTED, draw literally IDENTICAL index sequences from the same
      seeded stream, so the control could never have been informative
      regardless of the algebra. HEUR-COIN-1's own stated gap (uniform
      TRANSVERSAL sampling of x-coordinates versus genuinely GROUP-UNIFORM
      sampling, since drawn points exclude 2-torsion by construction) is
      the control that would actually discriminate; the Red Team measured
      it directly and found a real 1.84-2.08x effect at m=4 on every
      tau>=2 curve. Part B's forced-value claims should be understood as
      scoped specifically to the TRANSVERSAL sampling convention this
      record actually used, not as convention-independent.
    - >-
      THE THREE MANDATORY GRADED CONTROLS WERE NEVER COMPUTED OR REPORTED
      BY THE EXECUTOR DESPITE BEING REQUIRED BY THE FROZEN CONTRACT — THE
      RED TEAM RECONSTRUCTED THEM AND FOUND FAVORABLE RESULTS, A MATERIAL
      POSITIVE THE ORIGINAL RECORD FAILED TO CLAIM. graded_control_2
      (tau-ladder): reconstructed slope 6.2323 against the forced 6 — a
      close match. graded_control_3 (scale ladder, the contract's own
      named "canonical artifact tell"): the sublocus collision rate
      genuinely decays as 1/N across all five reconstructable cells — the
      artifact-tell does NOT fire, which is exactly the passing outcome
      the contract specifies. This is a real completeness gap in the
      Executor's own deliverable, independently remedied by the Red Team
      with results that strengthen, not weaken, Part B's disposition.
    - >-
      THE 8-CURVE PANEL IS EFFECTIVELY 4 INDEPENDENT SAMPLING STREAMS, NOT
      8 — DISCLOSED BY THE RED TEAM, NOT BY THE EXECUTOR. Curves sharing a
      prime (three curves share p=421; two CM curves share p=103) draw
      from the identical seeded `spec-x` stream, confirmed by bit-identical
      diagonal-stratum counts across those curves. This does not
      invalidate any reported metric (each curve's own construction, e.g.
      A/B, still differs, and the metrics are computed per-curve) but
      means the panel's claimed 8-fold independence for any
      cross-curve-correlation purpose is really 4-fold, disclosed here as
      a named limitation on panel diversity.
    - >-
      HEUR-KUM-2 (THE EQUALITY CLAIM, NOT MERELY CONTAINMENT) IS
      EMPIRICALLY CORROBORATED, NOT MERELY ASSUMED. Both reviewers
      independently confirmed the record correctly distinguishes the
      PROVED, unconditional containment (monodromy embeds in (Z/2)^(m-2))
      from the UNPROVED, conditional equality (the full group is
      realized, contingent on S_m's irreducibility at m>=4) — and that
      G8 (realized distinct Frobenius permutation count) genuinely reaches
      2^(m-2) at both m=4 and m=5, corroborating HEUR-KUM-2 empirically
      at these toy parameters rather than leaving it an unexamined
      assumption.
    - >-
      MODEL-CORRELATION CONFOUND PARTIALLY MITIGATED THIS ROUND, DISCLOSED
      PRECISELY. H-MONO-45183a's own `interpretation_limits` flags that
      its producer and EV-MONO-a0a89c's reviewers all resolved to
      claude-opus-5, a standing confound. This round: the Validator
      resolved to claude-sonnet-5 (this session's default) — genuine model
      independence relative to the original derivation's authorship — while
      the Red Team (dispatched under this Coordinator's `opus` override)
      resolved to claude-opus-5, matching the original producer's family
      and NOT adding model independence on its own joint. Recorded exactly
      as measured, not rounded up to "resolved" or down to "unresolved."
    - >-
      NO SCOPE CREEP, CONFIRMED BY BOTH REVIEWERS. `asymptotic_claim: null`
      holds throughout with justification; `dominated_by` is a genuinely
      checked null on every axis, not an unexamined field. One precision
      note (Red Team): the hypothesis's own corollary language ("the
      generic full symmetric/wreath monodromy premise... is false for
      m>=4") should be read as addressing only the SYMMETRIC half of that
      premise; the wreath/imprimitivity half is a separate, related but
      distinct structural claim.

