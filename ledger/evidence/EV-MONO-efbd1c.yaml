  scientific_effect: >-
    SUPPORTS H-MONO-45183a's Part A containment claim (the m-th Semaev
    summation cover's monodromy embeds in the elementary abelian
    (Z/2)^(m-2), never the full symmetric group) via multiple independent
    lines of evidence — most decisively the dual-path cross-check
