evidence:
  id: EV-SYMF-d46055
  title: Reviewed partial symmetric-cryptanalysis frontier, batch 1
  goal_id: GOAL-SYMF-c00fa1
  question_id: RQ-SYMF-5ab172
  batch_id: BATCH-303ce8
  hypothesis_id: null
  hypothesis_id_note: >-
    This is literature-acquisition and review evidence for a persistent
    knowledge ledger. GOAL-SYMF-c00fa1 has no active mathematical hypothesis,
    and naming one here would fabricate a linkage.
  experiment_ids: []
  run_ids: []
  run_ids_note: >-
    No cryptanalytic experiment or attack execution occurred. Producer work was
    retrieval and transcription; review work was parsing, source re-reading,
    bounded search, and logical/dominance checking.
  type: literature
  direction: neutral
  direction_scope: >-
    Neutral with respect to cryptographic security claims: this record reports
    what selected primary papers claim and how a reviewed partial frontier was
    compiled. It supports neither the correctness of the published attacks nor
    the absence of stronger attacks. It does establish that the frozen 67-row
    producer view cannot be promoted unchanged because all three review joints
    broke.
  strength: preliminary
  strength_justification: >-
    The producer snapshot is hash-bound; one independent Validator exhaustively
    checked its frozen structure; one sibling-blind Red Team re-read a risk-
    based primary-source sample, blindly re-derived SHA-1, and searched for
    omissions. This is strong evidence about the named transcription and schema
    defects, but only preliminary evidence about the literature frontier: the
    search was bounded, many rows were not individually source-checked, and no
    attack was reproduced.
  claim_tier: crypto
  claim_tier_note: >-
    The rows concern standardized primitives at their native parameters,
    including full-round SHA-1 and AES. This descriptive tier does not promote
    author-reported literature claims to reproduced cryptanalytic evidence;
    reduced-round scope remains explicit on every affected row.
  certificate_refs: []
  certificate_refs_note: >-
    No solve, collision, key, trail, or independently verified certificate was
    produced in this batch. Paper-supplied demonstrations remain author-
    reported and are linked rather than copied.
  proof_status: not_applicable
  proof_refs:
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/reviews/TASK-20260825-bb6d5d/validation-report.yaml
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/reviews/TASK-20260825-9eda3a/red-team-report.yaml
  snapshot_binding:
    task_id: TASK-20260825-568663
    commit: 5fc23783da8a2e62e2b3ab8728e47c48958ce02f
    parent: c1e25f665935fdd80291dda84ddf7e94f2632276
    source_artifacts: 18
    receipt_sha256: 4672a147afe4ad4e1009a0db2d5cc66ed51443058572f313723f33ab2a3f61fa
  review_results:
    J1_schema_and_comparison_key_separation:
      verdict: breaks
      report: coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/reviews/TASK-20260825-bb6d5d/validation-report.yaml
      report_sha256: 4ba24d30cc3ea6883fadbdb7ef96fc4fb5fd7a4e3a466cd0a874c0d0d95a93f4
      findings:
        - The literal eleven-field key omits primitive, variant, and class and creates artificial cross-target dominance.
        - The block count overlay targets nonexistent summary rather than counts.
        - Frozen coverage structurally assigned 128 of 399 required family cells.
        - Qualitative negligible memory cannot be arithmetically ordered against 2^15 words.
    J2_primary_source_transcription:
      verdict: breaks
      report: coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/reviews/TASK-20260825-9eda3a/red-team-report.yaml
      report_sha256: 78f75f1c7f0bf7770c714aefdcf4915a1abd366a25de73b2c805382bd5c3d158
      findings:
        - SHA-1 chosen-prefix rows omit source-explicit storage, RAM, graph construction, and manual-preparation costs.
        - The full-MD4 no-precomputation row omits source-reported memory 2^64.
        - The full AES-256 four-related-key row omits source-reported memory 2^77 to 2^77.5.
        - The four-round AES row requires 2^125.72, a corrected locator, and a separate partial-key-recovery result kind.
    J3_coverage_and_frontier_overclaim:
      verdict: breaks
      report: coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/reviews/TASK-20260825-9eda3a/red-team-report.yaml
      findings:
        - A full-round long-message SHA-1 second-preimage row was omitted.
        - Two-related-key 12/13-round AES-256 tradeoffs were omitted.
        - The now-retrievable SHA-2 paper supplies missing 47-step SHA-256 and 51-step SHA-512 cost vectors.
  observations:
    - id: O-SYMF-1
      statement: >-
        The snapshot contains 67 unique rows with all frozen required fields;
        after its immutable overlay it has 39 producer frontier flags and 28
        non-frontier flags. Those flags are input, not the canonical decision.
    - id: O-SYMF-2
      statement: >-
        The canonical version-2 view admits 21 partial-frontier rows and nine
        source-checked baselines with frontier unresolved. Every other snapshot
        row is named as pending correction or snapshot-only.
    - id: O-SYMF-3
      statement: >-
        SHA-1 has no single scalar frontier. The reviewed 2^61.2 value is the
        theoretical full-round identical-prefix collision cost on a GTX-970-
        equivalent convention; the 2017 demonstrated identical-prefix row is
        2^63.1; chosen-prefix theory remains 2^63.4 at headline level but its
        canonical row is pending resource-axis correction.
    - id: O-SYMF-4
      statement: >-
        RIPEMD-160 ePrint 2026/1744 is a 42-of-80-step result: expected 2^47.4,
        with three reported pairs and measured 560-core runs normalized to about
        2^41.9 and 2^43.9 reduced compression calls. It is not a full break.
    - id: O-SYMF-5
      statement: >-
        The bounded search located no demonstrated practical full-round single-
        key AES key recovery. Biclique single-key, chosen-key distinguishers,
        four-related-key full-round, and two-related-key reduced-round results
        remain distinct comparison domains.
  canonical_artifacts:
    - knowledge/frontiers/symmetric-cryptanalysis.yaml
    - knowledge/frontiers/symmetric-source-index.yaml
    - knowledge/frontiers/symmetric-frontier-schema.yaml
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/coverage-manifest.yaml
  citations:
    - ref: IACR-ePrint-2026-1744
      provenance: retrieved
      verified_by: TASK-20260825-9eda3a
      claim: 42/80-step RIPEMD-160 collision rows, expected and demonstrated costs, and explicit non-full-break boundary.
    - ref: USENIX-Security-2020-Leurent-Peyrin
      provenance: retrieved
      verified_by: TASK-20260825-9eda3a
      claim: SHA-1 identical-prefix and chosen-prefix headline costs plus source-explicit resource axes.
    - ref: IACR-ePrint-2017-190
      provenance: retrieved
      verified_by: TASK-20260825-9eda3a
      claim: Demonstrated full-round identical-prefix SHA-1 collision and 2^63.1 realized effort.
    - ref: IACR-ePrint-2011-449
      provenance: retrieved
      verified_by: TASK-20260825-9eda3a
      claim: Full-round single-key AES biclique baseline values.
    - ref: IACR-ePrint-2024-1447
      provenance: retrieved
      verified_by: TASK-20260825-9eda3a
      claim: Omitted 12/13-round AES-256 two-related-key tradeoffs requiring a successor.
  boundaries:
    - This is a reviewed partial census as of 2026-08-25, not all known attacks.
    - Literature values are author-reported unless a row explicitly says otherwise.
    - No attack, trail, collision, key recovery, or certificate was reproduced.
    - Failure to locate a paper in the bounded search proves nothing about its existence.
    - Reduced/full-round, collision/preimage, trail/distinguisher/key-recovery, and single/related/chosen-key domains never collapse.
  unresolved_confounds:
    - Seven frozen producer rows require source-field correction.
    - Three omitted SHA-1/AES rows and one AES partial-key result kind require structured successor rows.
    - The primitive backlog and 399-cell coverage ledger remain overwhelmingly partial.
  reviewed_by: coordinator
