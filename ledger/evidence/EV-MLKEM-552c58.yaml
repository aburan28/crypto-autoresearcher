    sensitivity -- which BOTH REVIEWS reached INDEPENDENTLY, via GENUINELY DIFFERENT METHODS
    (an exhaustive all-7-shifts closed-form diagnostic on already-archived data vs. a 200,000-
    trial-per-distribution Monte Carlo null-object simulation across 3 distributions with zero
    lattice content), WITHIN THIS SINGLE BATCH, working blind to each other's write scope. This is
    a STRONGER basis for `replicated` than several of this goal's prior single-batch promotions
    had (those relied on convergent-but-narrower built controls; here the central finding is
    reached by two methods that do not share a single line of code or a single computational
    primitive). It is explicitly NOT claimed for: the Red Team's specific MODERATE recommendation
    to strengthen PREREG-6 2.6's own forward-boundary text (Red-Team-alone, though not
    contradicted by the Validator); the Red Team's MINOR phrasing objection (Red-Team-alone).
    WHAT `replicated` DOES NOT MEAN HERE, restated because it is load-bearing every time this goal
    writes it: NOT model-level and NOT environmental. AGENTS.md rule 12 is UNMET AND UNWAIVED. The
    producer and both reviews resolve to the SAME MODEL (self-reported claude-sonnet-5) and, per
    the Red Team's own measured record, the SAME HOST AND STACK. See rule_12_disclosure below,
    including the Validator's own disclosed model-resolution discrepancy.

  claim_tier: toy
  claim_tier_note: >-
    TOY, UNCONDITIONALLY. Scope: q = 3329; d in {20, 40} (L7, L11 ONLY -- L9 not attempted);
    hkz ONLY (lam1n and rawtail out of scope); exactly the 2 named cells (hkz/L7_b5, hkz/L11_b30);
    up to 8 bases per cell (8/8 matched at both). NO reduction above d=40 was performed anywhere
