  strength: replicated
  strength_basis: >-
    `replicated` is claimed for: the mechanical arithmetic and termination branch at both covered
    cells (independently re-derived AND, for the specific cyclic-shift mechanism, independently
    REPRODUCED from scratch by both reviews via direct fpylll re-runs); the mechanical diff
    (independently re-extracted by both reviews via two structurally different extractors); and,
