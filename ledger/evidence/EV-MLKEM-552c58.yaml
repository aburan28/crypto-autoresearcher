    factor-base relation is claimed anywhere; the D_route_mut/VERDICT_mut comparison is a
    MUTATION-TESTING (positive) CONTROL on an INSTRUMENT, never a certificate.

  proof_status: derivation
  proof_status_note: >-
    LAYERED, STATED SEPARATELY SO NEITHER LAYER BORROWS THE OTHER'S WARRANT. (1) The mechanical
    diff and cyclic-shift-mechanism findings are DIRECT, CHECKABLE FACTS: a machine-generated
    diff (reproduced by two structurally different extractors) and a direct fpylll re-computation
    matching the lead's own reported values bit-for-bit. (2) THE CENTRAL FINDING -- that
    s_c^fib(hkz,L,b) is exactly np.std(X, ddof=1) of the same 8-element array PREREG-6's
    prediction computes its cyclic-adjacent-max-difference from -- is a DIRECT, CHECKABLE
    ARITHMETIC FACT, independently confirmed by both reviews via bit-exact recomputation. THAT
    THIS MAKES DETECTION NEAR-CERTAIN for this defect class is a near-proof-like ORDER-STATISTIC
    ARGUMENT (max of n=8 cyclic-adjacent differences vs. the sample standard deviation of the same
    n=8 values is a generic small-sample dispersion relationship, not specific to lattices, HKZ,
    or fpylll) COMBINED WITH built empirical controls that positively corroborate it (the
    Validator's exhaustive enumeration of all 7 possible shifts against already-archived data;
    the Red Team's 200,000-trial-per-distribution Monte Carlo simulation across 3 distributions
    with zero lattice content, finding P(exceed) >= 99.998%, matching the real-cell range
    2.29x-2.79x almost exactly). This is closer to a mathematical/statistical necessity,
    empirically corroborated, than a pure statistical inference -- but it is NOT a machine-checked
    proof, and neither review presents it as such. NEITHER THIS RECORD NOR EITHER REVIEW CLAIMS
    THE UNDERLYING QUESTION -- WHETHER D_route HAS MEANINGFUL SENSITIVITY TO A SUBTLER,
    SUB-THRESHOLD SHARED-CODE DEFECT -- IS RESOLVED. See mutctrl_open_question_ruling below.

  proof_refs:
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-8d09f5/reviews/TASK-20260813-01f482/probes/probe5_structural_relationship_diagnostic.py
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-8d09f5/reviews/TASK-20260813-01f482/probes/probe5_structural_relationship_diagnostic_output.json
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-8d09f5/reviews/TASK-20260813-01f482/probes/probe4_independent_fpylll_recompute.py
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-8d09f5/reviews/TASK-20260813-01f482/probes/probe4_independent_fpylll_recompute_output.json
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-8d09f5/reviews/TASK-20260813-0881f0/probes/rt_reverify.py
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-8d09f5/reviews/TASK-20260813-0881f0/probes/rt_reverify_results.json
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-8d09f5/reviews/TASK-20260813-0881f0/probes/rt_rerun_lead_script_results.json

  # ==================================================================
  # THE TERMINATION BRANCH
  # ==================================================================
  termination_branch:
    branch: T-MUTCTRL-DETECTED, unsuffixed, |COVERED| = 2/2, read off PREREG-6 2.6's frozen
      precedence.
    read_off: >-
      COVERED = {hkz/L7_b5, hkz/L11_b30} (2/2). T-MUTCTRL-NODATA does not fire (COVERED
      non-empty; fpylll genuinely available, independently re-verified by the lead and both
      reviews in three separate sessions). |COVERED| = 2, so T-MUTCTRL-MIXED is checked first and
      does not fire (both cells agree VERDICT_mut = "DOES NOT EXCEED"). Both cells agree, so
      T-MUTCTRL-DETECTED fires unsuffixed: D_route_mut(hkz/L7_b5) = 0.06658934890771118 against
      s_c^fib = 0.023887966155964283 (margin ~2.79x); D_route_mut(hkz/L11_b30) =
      0.00948000985335451 against s_c^fib = 0.003818306775026579 (margin ~2.48x). BOTH REVIEWS
      INDEPENDENTLY RE-DERIVED THIS from the raw route_p_values/route_mut_values arrays with no
      producer import and CONFIRM IT CORRECT. NEITHER REVIEW DISPUTES THE BRANCH CALL -- the Red
      Team states explicitly "This is not a rejection of the branch call."
    what_it_licenses_per_prereg_6s_own_text_quoted_verbatim: >-
      "citing this as a positive calibration result for the D_route mechanism against THIS
      defect class, at THIS approximate magnitude, at the cell(s) tested -- narrowly. It answers,
      for this one defect class, the open question KN-FIND-d29ece named: the instrument is not
      blind to every conceivable shared-code defect, at least not one of this shape and size."
      SEE mutctrl_corrected_citable_wording BELOW FOR WHY THIS DEFAULT LICENSE TEXT, TAKEN
      LITERALLY AND UNQUALIFIED, OVERSTATES WHAT THIS BATCH'S OWN EVIDENCE ESTABLISHES, DESPITE
      THE BRANCH ITSELF FIRING CORRECTLY AND MECHANICALLY.
    what_it_forbids_unchanged: >-
      Generalizing to any OTHER defect class (a sign flip, a logdet-constant error, any defect
      inside fpylll's own C/Cython kernel); to any UNCOVERED cell of the other 4 in this goal's
      6-cell hkz set; to any claim about hkz's own admissibility, T-HKZINDEP-CONFIRMED's own
      correctness, or any ML-KEM/FIPS 203/attack-cost/cost-model claim; closing, pausing or
      completing GOAL-MLKEM-005. This record makes none of those forbidden claims.

  # ==================================================================
  # ITEM 1 -- THE CORRECTED, NARROWED CITABLE WORDING
  # ==================================================================
  mutctrl_corrected_citable_wording: >-
    T-MUTCTRL-DETECTED FIRES CORRECTLY AND MECHANICALLY -- both independent reviews confirm this
    from the raw data, with no producer import, including via BUILT CONTROLS that directly rule
    out an fpylll-convergence-artifact alternative explanation (Validator: a direct, independent
    fpylll recomputation of one basis matching the lead's reported value bit-for-bit; Red Team:
    an independent call of the FROZEN, UNMUTATED route on the shifted index at every matched
    basis at both cells, also bit-exact). The mutant genuinely, mechanically computes basis slot
    i as a correctly-converged HKZ profile of slot (i+1) mod 8, mislabeled as slot i -- not "some
    large deviation," the SPECIFIC predicted mechanism, confirmed to within the same ~2^-49 floor
    this lineage established for genuine HKZ-quality convergence. THE CORRECTED, NARROWED READING
    A FUTURE CITATION MUST CARRY (adapted from the Validator's own CTRL-2-NULL-OBJECT-FINDING
    and the Red Team's own narrowest_supported_statement, verified against both reports' cited
    probes): "the D_route/D_route'' comparison mechanism, applied unchanged, correctly flags a
    defect that substitutes one archived basis's correctly-computed value for a different (also
    correctly-computed) archived basis's value, at hkz/L7_b5 and hkz/L11_b30 -- demonstrating the
    comparison is not fixed-by-construction to always report EXCEEDS and does report a genuine
    basis-mislabeling as a discrepancy. It does NOT demonstrate that the mechanism has meaningful
    sensitivity at a magnitude that probes anywhere near its actual detection boundary, because
    the tested magnitude was never an independently chosen or controllable parameter: for this
    entire defect class (any full basis-index swap), at ANY of the 6 archived hkz cells, the
    predicted margin over s_c^fib is a near-tautological consequence of comparing a max-of-8
    cyclic-adjacent-difference statistic to the SAME 8-element array's own sample standard
    deviation -- a generic small-sample order-statistic fact holding for essentially any
    continuous distribution with non-trivial dispersion, independent of fpylll, HKZ reduction, or
    lattice dimension entirely (null-object control: P(exceed) >= 99.998% across 3 distributions,
    200,000 trials each, matching the real archived-cell range 2.29x-2.79x almost exactly; an
    exhaustive check of all 7 possible cyclic shifts, not only the k=1 PREREG-6 chose, predicts
    DETECTED at both cells for every one of them). The genuine (unmutated) agreement this
    lineage's own prior batch measured sits ~13-14 orders of magnitude BELOW s_c^fib
    (D_route''=1.776e-15); this batch's injected defect sits ~2.5-2.8x ABOVE it. Nothing in this
    document, or in this entire defect class, maps any part of that ~13-order-of-magnitude gap --
    the two data points sit at opposite extremes with nothing tested near the boundary that
    actually determines whether the mechanism has real sensitivity to a SUBTLER shared-code
    defect (a small arithmetic slip, a rounding truncation, an off-by-one affecting one matrix
    entry), which is exactly the failure mode KN-FIND-d29ece was concerned about and exactly the
    kind this defect CLASS structurally cannot produce a small-magnitude instance of." This is NOT
    a violation of PREREG-6, whose own could-not-fail analysis (section 3.1) addressed only
    whether D_route_mut/VERDICT_mut were fixed by construction, never whether the comparison has
    power to detect a defect at a magnitude that meaningfully probes its sensitivity -- a distinct
    question this record's central finding shows was never actually tested by this batch's
    design, and, per the reasoning in mutctrl_forward_boundary_ruling below, cannot be tested by
    ANY member of this same defect class, at any archived cell.

  # ==================================================================
  # ITEM 2 -- PREREG-6 2.8'S FORWARD BOUNDARY
  # ==================================================================
  mutctrl_forward_boundary_ruling: >-
    PREREG-6 2.6's declared forward boundary states: because T-MUTCTRL-DETECTED fired (unsuffixed
    here), "no further mutation-testing control of this SAME defect class (seed-index off-by-one)
    at these SAME two cells is licensed by this document alone -- a genuinely DIFFERENT defect
    class ... is a NEW question requiring its own, separately-commissioned Coordinator decision,
    not an automatic successor." READ LITERALLY, this bars two specific things -- (a) the SAME
    defect class (any basis-index swap/seed-shift) (b) at these SAME two cells -- and nothing
    else; it does not, on its own text, bar the same class at a different cell, nor does it bar a
    genuinely different defect class anywhere, though the latter explicitly requires a new,
    separately-commissioned Coordinator decision rather than proceeding as an automatic
    successor. RULING, GIVEN BOTH REVIEWS' CONVERGENT FINDING: a same-class attempt at a
    different cell of the archived 6 (e.g. hkz/L11_b10, the genuinely tightest cell per
    cell_selection_correction below) is NOT separately barred by this literal boundary, but IS
    judged, on the merits, uninformative and therefore NOT WORTH COMMISSIONING: the Red Team's
    MODERATE objection and this record's own central finding show the entire seed-index/basis-
    swap defect class is STRUCTURALLY incapable of landing appreciably below ~1.8x s_c^fib (the
    null-object control's own 5th-percentile-scale floor) at ANY of the 6 archived cells,
    independent of which cell is chosen -- so a same-class attempt at hkz/L11_b10 would very
    likely also read DETECTED and would teach nothing this batch has not already taught. A
    GENUINELY DIFFERENT defect class -- specifically, the reviews' own proposed next step: a
    CONTINUOUSLY-PARAMETERIZED, sub-threshold-scale defect (e.g. perturbing one or more matrix
    entries of the shared basis-construction code by a small, SWEPT epsilon, rather than
    substituting an entire different archived basis) -- is NOT barred by this section's text
    (it is a different defect class, explicitly carved out as requiring, not forbidden by, a new
    Coordinator decision) and IS judged warranted on the merits: it is the only construction
    either review or this record can name whose predicted effect size is NOT structurally tied,
    by construction, to s_c^fib itself, so it is the only remaining design that could actually
    locate the true detection/non-detection crossover empirically. THIS DECISION IS THE
    SEPARATELY-COMMISSIONED COORDINATOR DECISION PREREG-6 2.6 REQUIRES for that different defect
    class: it licenses the design in principle, on the merits ruled here, but see next_actions
    below for whether and when it is the single next bounded task this goal actually dispatches,
    which is a separate, portfolio-level question ruled in item 7 / ruling_7 below and is NOT
    automatically "yes" merely because the design is licensed.

  # ==================================================================
  # ITEM 3 -- KN-FIND-d29ece'S OPEN QUESTION, PRECISELY RULED
  # ==================================================================
  mutctrl_open_question_ruling: >-
    KN-FIND-d29ece named, as its own open question (section 5/7 item 3): "whether a defect shared
    at the fpylll-enumeration-kernel level, or in the routes' common definitional/basis-
    construction code, actually exists" -- and named (section 6 item 3/4) a mutation-testing
    control, injecting a known defect and confirming the comparison mechanism detects it, as "the
    decisive further check this failure mode calls for" and "the cheapest available check that
    closes this gap." STATED PRECISELY AND HONESTLY, NOT LET TO READ AS MORE INFORMATIVE THAN THE
    REVIEWS SHOW: THIS BATCH DOES NOT CLOSE THAT QUESTION, AND DOES NOT MEANINGFULLY NARROW IT IN
    THE SENSE THAT MATTERS. What WAS learned, genuinely and for the first time in this campaign:
    (i) the D_route/D_route'' comparison mechanism is not vacuous or fixed-by-construction to
    always report EXCEEDS -- it can and does correctly flag a full basis-index mislabeling,
    confirmed via a genuinely injected, known defect rather than an assumed one (this is a real,
    if modest, increment: PREREG-6 3.1's own could-not-fail analysis addressed only the
    construction question, not whether the mechanism had ever been POSITIVELY exercised against
    a known defect at all -- it now has, once); (ii) fpylll converges reliably on freshly-drawn
    matrices at this toy scale (an infrastructure fact, independently corroborated by direct
    re-runs in both reviews' own sessions). What was NOT learned, and remains EXACTLY as open as
    before this batch ran: whether D_route has meaningful sensitivity to a SUBTLE shared-code
    defect -- the kind KN-FIND-d29ece was actually concerned about (a small arithmetic slip, a
    rounding truncation, a wrong constant, a defect inside fpylll's own kernel) -- because the
    defect class this batch's own design was restricted to (PREREG-6 2.2's own reasoning for why
    a full-basis-swap defect, and not a sign-flip or logdet-constant defect, was chosen: its
    predicted effect is computable exactly in advance) turns out, per the central finding above,
    to have been chosen precisely because it is the one construction whose predicted effect is a
    near-tautological function of the SAME statistic that defines the pass/fail threshold --
    which is exactly why it cannot inform the sensitivity question near the boundary that matters.
    THE HONEST SUMMARY: "the cheapest available check" KN-FIND-d29ece named turned out, once
    built and reviewed, to be cheap because it was structurally guaranteed to succeed, not because
    it was informative -- a genuinely useful negative-methodological result in its own right
    (see knowledge_promotion below) but NOT a discharge, partial or otherwise, of KN-FIND-d29ece's
    own named open question, which REMAINS FULLY OPEN and is now more precisely understood to
    require a differently-shaped test (see mutctrl_forward_boundary_ruling above) than the one
    this batch built.

