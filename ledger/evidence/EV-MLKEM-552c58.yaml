    / s_c^fib) at all 6 archived hkz cells: hkz/L7_b5 = 2.788x (LOOSEST of the six -- the tested
    cell), hkz/L7_b15 = 2.555x, hkz/L9_b7 = 2.341x, hkz/L9_b22 = 2.369x, hkz/L11_b10 = 2.287x
    (TIGHTEST of the six -- NOT tested), hkz/L11_b30 = 2.483x (3rd loosest / 4th tightest,
    neither extreme -- the second tested cell). The two tested cells do NOT bracket the
    tightest-and-a-looser pair: one of them is literally the single loosest/easiest cell of the
    entire archived 6-cell set, and the genuinely tightest cell was left untested. THIS RECORD
    ADOPTS THE CORRECTION BOTH REVIEWS' OWN REPORTS NAME AS OWED: PREREG-6 2.1's stated rationale
    must be read as incorrect, and any future citation of PREREG-6 2.1 should carry this
