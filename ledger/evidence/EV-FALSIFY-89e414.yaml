evidence:
  id: EV-FALSIFY-89e414
  hypothesis_id: H-FALSIFY-40538b
  question_id: RQ-FALSIFY-a2c501
  experiment_ids: [EXP-FALSIFY-d770c1]
  run_ids: []
  run_ids_note: >-
    No run record. F-6 is a documentary audit of a closure argument against the
    standard docs/inventor-protocol.md already imposes. Its whole method is
    reading the record and counting its rows; there is nothing to execute.
  finding_under_test: KN-FIND-e7a3b1
  type: analytical
  direction: contradicts
  direction_note: >-
    Contradicts the UNIVERSAL form of the closure claim and one internal count.
    Does NOT contradict the eight individual closures, each of which names a real
    obstruction, and does not assert that any closed approach in fact works.
  strength: moderate
  claim_tier: theory
  proof_status: derivation
  proof_status_basis: >-
    An argument about the structure of another argument, plus one exact count of
    table rows. No new mathematics and no measurement.
  proof_refs:
    - knowledge/findings/KN-FIND-e7a3b1.md
    - docs/inventor-protocol.md
  recorded_at: '2026-08-08'

  observations:
    - id: O-1
      text: >-
        RULE 2. check_currency.py reports no supersession and no withdrawal for
        KN-FIND-e7a3b1. It is named in 5 coordination/ documents, which the
        extended checker now surfaces as advisory; those were read, and the
        relevant one is recorded in CORR-20260808-733115 rather than here.
    - id: O-2
      text: >-
        THE STANDARD BEING APPLIED is the corpus's own, not an imported one.
        docs/inventor-protocol.md requires that a negative result claiming a lane
        is dead carry (a) a named obstruction, (b) an argument, and (c) forward
        guidance naming what remains open, and states that a count of
        screened-and-rejected mechanisms is a fatigue report whose honest status
        is `unverified`. The protocol says explicitly that this applies to the
        program's own standing saturation conclusions, which is what makes
        KN-FIND-e7a3b1 a legitimate target.
    - id: O-3
      text: >-
        (a) NAMED OBSTRUCTION -- PASSES, and well. Each tabulated approach carries
        a specific obstruction rather than "we tried it and it did not work", and
        the record supplies a unifying one: DL_G(P) = 1_{x([j]G) < t} is not
        algebraic in j over F_p, so every analytic method either requires
        algebraic structure the DL lacks (Weil, Michel-Venkatesh, Weyl), or is
        computational rather than information-theoretic (DDH), or requires
        non-abelian structure that E(F_p) = Z/N lacks (BGS). That is a real
        obstruction, stated at the right level of generality.
    - id: O-4
      text: >-
        (c) FORWARD GUIDANCE -- PASSES. "One conditional approach remains: Hecke
        characters for CM curves ... conditional on CM structure, this might give
        C = O(sqrt(N/B)) -- but inapplicable to standard cryptographic curves."
        That names a live route and its limitation. The record also declares
        H-PSEUDO a new open problem rather than a dead one, which is forward
        guidance of the strongest kind.
    - id: O-5
      text: >-
        (b) ARGUMENT -- PASSES FOR THE EIGHT, FAILS FOR THE UNIVERSAL. The
        section is titled "All standard analytic proof approaches are closed" and
        the record's title says "all six standard analytic methods are closed".
        What is supplied is a table of specific approaches with specific
        obstructions, plus a three-way taxonomy. The taxonomy is offered as the
        reason all approaches fail, but it is nowhere argued to be EXHAUSTIVE
        over analytic methods -- that every future analytic approach must fall
        into (a), (b) or (c) is asserted, not established. Enumerating members of
        an unbounded class and concluding "all" is the inference the closure
        standard exists to catch. The eight closures stand; the universal does
        not follow from them.
    - id: O-6
      text: >-
        AN INTERNAL COUNT IS WRONG. The record's title and frontmatter say "all
        SIX standard analytic methods are closed". The table carries EIGHT data
        rows: Weil/etale cohomology, Michel-Venkatesh equidistribution, DDH
        conditional proof, BGS spectral gap, Weyl/WvdC differencing, DL random
        permutation assumption, Shparlinski/ECCG Fourier expansion, and
        MAGCS/Tate pairing. Six and eight are not the same number, and a reader
        auditing the closure cannot tell which two the title means to exclude.
    - id: O-7
      text: >-
        ONE ROW RESTS ON A NUMBER NOW UNDER CORRECTION. The "DL random
        permutation assumption" row is closed on the grounds that it is
        "empirically refuted (C grows as p^{0.079} != O(sqrt(log p)))". That
        exponent is the subject of EV-FALSIFY-40291d as narrowed by
        CORR-20260808-733115, and the corpus's own BATCH-086 analysis argues it
        is plausibly a finite-size artifact. If 0.079 does not survive, this row
        loses its stated ground -- which does not make the approach work, but
        does mean one of the eight closures is currently unsupported by the
        reason given for it.

  interpretation: >-
    KN-FIND-e7a3b1 is NOT a fatigue report. It clears two of the closure
    standard's three requirements outright and clears the third for each
    individual approach it tabulates. The defect is narrower and specific: a
    universal quantifier over an unbounded class ("all standard analytic proof
    approaches") carried by an enumeration of eight, with the taxonomy that would
    justify the leap asserted rather than argued. Two subsidiary defects: the
    title's count disagrees with the table, and one row's stated ground is a
    number now under correction.

  what_this_does_not_establish: >-
    Nothing here suggests any of the eight approaches actually works, and no
    attempt was made to construct one that evades the taxonomy -- which is what
    a real refutation of this closure would require. The unifying obstruction
    looks sound to this reader, and it may well be that every analytic method
    does fall into (a), (b) or (c); the objection is that the record asserts this
    rather than arguing it, not that it is false. This audit is documentary: no
    mathematics was checked, and a reader competent in analytic number theory
    might either supply the exhaustiveness argument in a paragraph or name a
    ninth method immediately. Neither was attempted here.

  dominated_by: not_applicable_methodological
  sota_delta:
    time_exponent: not_applicable
    note: No algorithmic claim.

  proposed_correction: >-
    A superseding record that (a) reconciles the count -- either six rows or a
    title saying eight, (b) restates the universal as what the evidence carries:
    "the eight standard analytic approaches tabulated below are closed, each for
    the named obstruction; we conjecture the taxonomy is exhaustive over analytic
    methods and do not prove it", (c) marks the DL-random-permutation row as
    resting on an exponent under correction, and (d) keeps the unifying
    obstruction and the Hecke-character forward guidance unchanged, since both
    are the record's strongest parts. Under the closure standard the universal's
    honest status until the taxonomy is argued is `unverified`; the eight
    individual closures are not affected. Coordinator authority.

  knowledge_promotion: not_warranted
  knowledge_promotion_reason: >-
    An audit of one record's quantifier is not knowledge. The reusable content --
    that enumerating members of an unbounded class does not establish a universal
    over it -- is already D1 in docs/falsification-program.md and already stated
    in the inventor protocol.

  scope_limits: >-
    KN-FIND-e7a3b1 as committed at this branch head. KN-FIND-7e4b90, the other
    `proved_negative` record, was checked for currency and NOT audited; it
    remains open under F-6.

  independent_review_required: true
  independent_review_note: >-
    This contradicts the universal form of a record carrying
    confidence: proved_negative. AGENTS.md rule 12 applies before any status
    change follows. A reviewer competent in analytic number theory is the right
    one here, since the substantive question is whether the taxonomy is in fact
    exhaustive.

  authority_note: >-
    Evidence only. No hypothesis status changed, no finding edited or
    superseded; only the Coordinator may do that (AGENTS.md rule 1).
