  # ------------------------------------------------------------------
  # OBSERVATIONS
  # ------------------------------------------------------------------
  observations:
    # -------------------------------------------- EV-MLKEM-011 adjudication
    - >-
      VERDICT ON EV-MLKEM-011: `claim_survives_narrowed`
      (reviewer REV-20260802-f17ef8, TASK-20260802-de2957). The
      counting-resolution confound raised as BATCH-007 red-team objection 2 and
      as validator defect D5 is confirmed EXACTLY, not approximately. For the
      left-panel file (q=241, m=40, n=43, n_fft=8, k_fft=3, n_lat=35,
      avg_N=25971, nb_iteration=4000, 1804 data lines): q^k_fft = 13,997,521;
      nb_iteration * q^k_fft = 55,990,084,000 = 2^35.704452; the last positive
      survival index is T=1802 and the first zero is T=1803; the last positive
      value printed in the file equals 1/(nb_iteration * q^k_fft) =
      1.7860305406935986e-11 = 2^-35.70445229 as an EXACT IEEE-754 equality
      (difference 0.0); and every one of the 1804 values is an exact integer
      multiple of that quantum. The second archived file (n=50, nb_iteration=6000,
      2311 lines) reproduces the same structure - nb_iteration * q^k_fft =
      83,985,126,000 = 2^36.289415, last positive T=2309 with value
      1.190687027129065666e-11, all 2311 values integer multiples.
    - >-
      WHAT THAT MAKES THE RUN. It is an unsmoothed POOLED COUNTING ESTIMATE. It
      cannot report any Pwrong below its quantum, so its zeros at scores >= 1803
      are an UPPER BOUND and not a measured zero: Pwrong(1803) <= 2^-34.12 at 95%
      under an independence assumption the pooled design does not satisfy, and
      <= 2^-10.38 under maximal within-iteration clustering (the q^k_fft
      candidates inside one FFT share the same N dual vectors and the same
      target). AGENTS.md rule 5, extended from infrastructure failures to
      statistical ones by docs/inventor-protocol.md section 3: an instrument that
      cannot resolve a separation is not evidence that the separation is absent.
    - >-
      WHAT MUST BE WITHDRAWN FROM EV-MLKEM-011's PHRASING (recommendation, not
      executed here - see rule12_status): the phrase "does not intersect the
      Pgood approx 1/2 operating threshold" read as a property of the
      distributions; "fraction of Pgood scores with T <= 1802 is exactly 0" read
      as a coverage measurement rather than as a resolution bound; and the
      `scale_note` field, which defers T statistics to EV-MLKEM-013's k_fft
      alignment (void - see below).
    - >-
      WHAT STANDS IN EV-MLKEM-011. Every recorded number recomputes exactly:
      Pgood (n=4000) min 6667.673616, median 11964.473718, max 17822.813537,
      mean 11983.505048, sample sd 1720.0862, reproducing the record's
      "min approx 6668, median approx 11964, max approx 17823"; and the
      Kyber-scale distances below the toy instrument floor of -35.704452, from
      Table C.2 column CC (-119.57 / -177.79 / -244.03), are 83.8655 / 142.0855 /
      208.3255 bits, reproducing both the record's "approx 84 bits" and
      pwrong_scope_gap.json's -83.86554770664802. That fourth observation is a
      DYNAMIC-RANGE statement about the instrument; the confound does not weaken
      it, it explains it and makes it sharper.
    - >-
      NON-CONFOUNDED RESTATEMENT OF EV-MLKEM-011 (reviewer's, carried here as a
      pending restatement and NOT as an edit to that immutable record). Carrier's
      archived Fig 4.1 left-panel run validates Approximation 4.9 only over the
      band its counting resolution permits, Pwrong in [2^-35.70, 2^-1], while the
      Kyber cost table applies that approximation at 2^-119.57 / 2^-177.79 /
      2^-244.03, i.e. 83.87 / 142.09 / 208.33 bits below the validated band; and
      no counting experiment at those parameters could have extended the band to
      the operating threshold. This is a statement about the REACH OF THE
      EXPERIMENTAL VALIDATION. It is not a distributional separation, it does not
      show that Approximation 4.9 fails, and it is not a claim about ML-KEM
      security.

    # -------------------------------------------- EV-MLKEM-013 adjudication
    - >-
      VERDICT ON EV-MLKEM-013: `claim_void`, and NOT merely from the confound.
      The reviewer read the archived FFT_sample.py (sha256
      2a5f3dedceb68b0836efc92f0b58294ce4193a9553493e7c0d4e4ce67b922531, the exact
      artifact EV-MLKEM-013 cites) in full rather than the two method bodies in
      isolation, and found that `init()` contains
      `for i in range(len(decoded)):` whose loop index `i` is NEVER USED, so each
      dual-vector phase is accumulated into the scalar cell T[tuple(decoded)]
      len(decoded) = k_fft times. `FFT()`'s `/self.k_fft` therefore CANCELS that
      duplication rather than rescaling the score. I read that code myself and
      confirm the unused index.
    - >-
      RECOMPUTATION. Against the archived file as written, FFT_sample.FFT()
      reproduces Score_Function.compute_score() with ratio 1.000000000000 -
      maximum absolute deviation 1.1e-13 across five (q, k_fft, m, N_vectors)
      settings - so EV-MLKEM-013's primary metric `scale_factor_k_fft`
      recomputes to 1, not 3. The counterfactual pins the mechanism: delete the
      duplicated loop and the ratio becomes exactly 1/k_fft (0.333333333333 at
      k_fft=3, 0.500000000000 at k_fft=2, 0.250000000000 at k_fft=4). The
      `synthetic_check` string archived in RUN-MLKEM-013-001/results.json is what
      one obtains by building the table WITHOUT init(), so the recorded check did
      not exercise the code path it certified.
    - >-
      CODE-INDEPENDENT CORROBORATION, WHICH I VERIFIED MYSELF. Under the paper's
      own Model 4.7 (F_wrong ~ D + N(0, N/2)) the raw-scale standard deviation is
      sqrt(avg_N/2); a /k_fft scale would give sqrt(avg_N/2)/k_fft. Treating the
      score as symmetric and zero-mean, I computed sigma = sqrt(E[F^2 | F >= 0])
      from each file's own survival column and obtained 113.9051 (n=43) and
      114.1781 (n=50) against sqrt(avg_N/2) = 113.9539 and 113.9517 - ratios
      0.9996 and 1.0020 - and against the /k_fft alternative sqrt(avg_N/2)/3,
      ratios 2.9987 and 3.0060. The reviewer computed the same quantity with a
      different estimator (the integer-grid identity
      E[F^2] = 2 * sum_{t>=1} (2t-1) P(F >= t)) and reported 113.7914 and
      113.9783, i.e. ratios 0.998574 / 1.000233 against the raw prediction and
      2.995722 / 3.000698 against the aligned one. MY DIGITS DIFFER SLIGHTLY FROM
      THE REVIEWER'S; they are two estimators of the same quantity and the
      conclusion - ratio approximately 1.00 against the raw scale versus
      approximately 3.0 against the /k_fft scale, in two independent files - is
      robust to that choice. Both archived Pwrong files are on the UNDIVIDED RAW
      COSINE-SUM SCALE, the same scale as Pgood. This holds whatever script wrote
      the files.
    - >-
      CONSEQUENCES OF THE VOID VERDICT. (i) There is NO k_fft normalization
      asymmetry in Carrier's verifyModel and no scale alignment is warranted;
      the archived code is self-consistent. (ii) EV-MLKEM-013's aligned figures -
      Pgood min/median/max 2222.557872 / 3988.157906 / 5940.937846 and the T-gap
      420.557872 - are a WRONG UNIT CONVERSION; they are arithmetically correct
      given their premise and the premise is false. (iii) EV-MLKEM-011 did NOT
      "overstate the T-gap by factor 3"; its raw figures were already on the
      correct common scale. (iv) EXP-MLKEM-013's frozen falsification criterion
      ("Pwrong FFT/k_fft is NOT a constant multiple of the Pgood cosine sum") was
      not triggered because it IS a constant multiple - the multiple is 1. The
      criterion was written in a form that could not catch this failure mode.
    - >-
      WEAKER, EXPLICITLY NON-LOAD-BEARING CORROBORATION. Evaluating
      Approximation 4.8's threshold formula (4.19) at the Fig 4.1 caption
      parameters reproduces the RAW Pgood median at alpha = 2.0125 (alpha = 2
      gives T = 12021.89 against the measured 11964.47, 0.48 percent), whereas the
      /k_fft-aligned median would require alpha = 4.88. alpha was SCANNED, not
      read from any archived source (see `could_not_determine`), so this is
      corroborative only and nothing rests on it.

    # -------------------------------------------- correction to BATCH-007 RT
    - >-
      CORRECTION TO THE BATCH-007 RED TEAM (RT-20260802-3a440d objection 2), and
      the most consequential single item in this record. On the corrected raw
      scale the gap from the instrument limit (score 1802) to the Pgood MEDIAN -
      the operationally relevant point, since the paper selects T so that
      Pgood approx 1/2 - is 10162.473718 score units, not the 420.56 the
      objection quotes from EV-MLKEM-013's void alignment, and not the
      minimum-based 4865.673616 that EV-MLKEM-011 quotes. Extrapolating the
      file's OWN measured tail slope over three fit windows puts log2(Pwrong) at
      that point between -128.7 and -153.0 (windows [1000,1600], [1200,1740],
      [800,1400]; slopes -0.009153, -0.009382, -0.011541 bits per score unit),
      i.e. ROUGHLY 93 TO 117 BITS BELOW THE COUNTING FLOOR of -35.704452,
      requiring on the order of 2^105 to 2^129 iterations against the 4000
      actually run.
    - >-
      SO: objection 2's DIAGNOSIS stands - the coverage statistics are confounded
      with run length - but its IMPLIED REMEDY is wrong by approximately 100
      bits. "Just run longer, as Ducas-Pulles did" is not available at the Fig 4.1
      parameters; a counting estimator cannot reach a 2^-129 survival probability
      at all. The approximately 4-bit-looking deficit that made the objection
      appear decisive was itself an artifact of the void k_fft alignment. Any
      successor task that plans "increase nb_iteration" is planning an impossible
      run. This extrapolation is a DIAGNOSTIC under a stated functional
      assumption, not a measurement, and is used only to size the instrument
      deficit and to reject that remedy.

    # -------------------------------------------- discriminator
    - >-
      DISCRIMINATOR BETWEEN "NO MASS THERE" AND "TOO FEW SAMPLES TO SEE MASS":
      the archived data favours the latter, on two independent tells. (a) The
      measured log-survival FLATTENS toward the floor rather than steepening -
      local slope magnitude falls from 0.045543 bits per score unit on [400,600]
      to about 0.010 past T=1000 (0.010054 on [1000,1200], 0.006112 on
      [1400,1600]), then wanders in the Poisson-noise regime (counts <= 10 from
      T=1490, count exactly 1 for the last 62 values of T). A distribution
      approaching a genuine right endpoint accelerates its decay; this one
      decelerates. (b) At the floor the measured survival exceeds a pure
      N(0, avg_N/2) survival at the same z = 15.8360 by 150.51 bits
      (-35.704452 versus -186.2151), so the tail there is carried entirely by
      Model 4.7's D component, which the model does not truncate near 1802. The
      non-coverage is a property of the run, not of the distributions.

    # -------------------------------------------- archival defects
    - >-
      ARTIFACT-POLICY DEFECTS FOUND (validator-grade, recorded not repaired).
      A1 (high): experiments/EXP-MLKEM-013/runs/RUN-MLKEM-013-001/command.txt
      reads "[command-not-captured-at-execution]", manifest.yaml repeats that
      string in code.command, stdout.log contains only "# No live stdout
      captured", and stderr.log is empty - so the synthetic check that produced
      the incorrect scale_factor_k_fft = 3 cannot be re-executed or inspected
      from the archive. This violates the AGENTS.md artifact policy and is the
      proximate reason the error stood for two batches. A2 (medium):
      EXP-MLKEM-013/specification.yaml names Algorithm.py in source_refs.files
      but it is not in required_artifacts and is archived nowhere.
      A3 (medium): the third archived Pwrong file (beta037_beta144_N200001) is
      not in the repository at all. A4 (low): the BATCH-008 task card's
      read_scope and inputs point at experiments/EXP-MLKEM-013 for the .out
      files, which exist only under experiments/EXP-MLKEM-011/vendor-lock/data/;
      the reviewer read them read-only and recorded the deviation. A5: the
      EXP-MLKEM-013 falsification criterion could not catch a scale factor of 1
      (see above).

  # ------------------------------------------------------------------
  # COORDINATOR INDEPENDENT VERIFICATION
  # ------------------------------------------------------------------
  coordinator_independent_verification:
    verified_by: coordinator
    verified_under_task: TASK-20260802-9abae7
    scope: >-
      AGENTS.md requires the Coordinator to verify validity before interpreting a
      producer result, and this batch's result contradicts standing records, so I
      did not take the reviewer's arithmetic on trust. Three checks, all from the
      archived bytes at experiments/EXP-MLKEM-011/vendor-lock/data/ and
      experiments/EXP-MLKEM-013/vendor-lock/FFT_sample.py, all re-runnable by any
      reader from those paths. No separate transcript is archived and none is
      asserted.
    checks:
      - item: counting-resolution identity, left-panel Pwrong file
        what_i_computed: >-
          The last positive survival value in the file against
          1/(nb_iteration * q^k_fft), and whether every value in the file is an
          integer multiple of that quantum.
        result: >-
          Bit-for-bit exact: last positive value == 1/(4000 * 241^3) ==
          1.7860305406935986e-11 == 2^-35.70445229, an EXACT float equality.
          Every value in the file is an integer multiple of that quantum, with
          maximum relative deviation 2.16e-16. The run is a pooled counting
          estimate; its zeros above score 1802 are an upper bound, not a measured
          zero. Reproduced. (The reviewer's independent formulation of the same
          multiplicity check reports maximum relative deviation 1.360e-16 for
          this file; the two are different formulations of one check and both are
          at the float-noise level.)
      - item: the unused loop index in the archived FFT_sample.py
        what_i_did: >-
          Read the archived file directly rather than relying on the reviewer's
          transcription.
        result: >-
          Confirmed. `init()` contains `for i in range(len(decoded)):` and the
          index `i` is never used inside the loop body, so the phase is
          accumulated len(decoded) times into the scalar cell T[tuple(decoded)].
      - item: >-
          code-independent consequence - which score scale are the archived
          Pwrong files on?
        what_i_computed: >-
          sigma = sqrt(E[F^2 | F >= 0]) from each file's own survival function,
          treating the score as symmetric and zero-mean, against Model 4.7's
          sqrt(avg_N/2) and against the /k_fft alternative.
        result: >-
          113.9051 (n=43) and 114.1781 (n=50) against sqrt(avg_N/2) = 113.9539
          and 113.9517: ratios 0.9996 and 1.0020. Against sqrt(avg_N/2)/k_fft the
          ratios are 2.9987 and 3.0060. Had the score been divided by k_fft=3 the
          first ratio would be approximately 3.0. Both archived Pwrong files are
          therefore on the UNDIVIDED RAW cosine-sum scale, the same scale as
          Pgood. Reproduced, by a different estimator than the reviewer's.
    estimator_discrepancy_recorded_honestly: >-
      My sigma digits (113.9051, 114.1781) differ slightly from the reviewer's
      (113.7914, 113.9783). These are two estimators of the same quantity applied
      to the same immutable file, and I do not claim to have resolved which is
      the better one. The conclusion is robust to the choice: on either estimator
      the ratio against the raw prediction is approximately 1.00 and the ratio
      against the /k_fft prediction is approximately 3.0, in two independent
      files, which is a separation of a factor of three - far larger than the
      difference between the estimators.
    not_verified_by_me:
      - >-
        The five-setting recomputation of FFT_sample.FFT() versus
        Score_Function.compute_score() (ratio 1.000000000000, max abs deviation
        1.1e-13) and its counterfactual. Recorded on the reviewer's computation;
        I confirmed the mechanism by reading the code and confirmed the
        consequence by the independent variance route above.
      - >-
        The tail-slope extrapolation and the 2^105-2^129 iteration figures.
        Recorded on the reviewer's computation and flagged as a diagnostic under
        a stated functional assumption, not a measurement.
      - >-
        The Gaussian-excess figure (150.51 bits at z = 15.8360) and the local
        slope table. Recorded on the reviewer's computation.
      - >-
        The Approximation 4.8 / alpha corroboration, which is explicitly
        non-load-bearing and whose alpha was scanned rather than read.

  # ------------------------------------------------------------------
  # WHAT THE REVIEW COULD NOT DETERMINE
  # ------------------------------------------------------------------
  could_not_determine:
    - >-
      THE THIRD ARCHIVED PWRONG FILE IS NOT IN THE REPOSITORY. The
      nb_iteration=1, avg_N=200001 file (beta037_beta144_N200001) exists here
      only as a header extract and a sha256 in the input manifest, so BATCH-007's
      -23.74 table row is UNVERIFIABLE FROM REPOSITORY BYTES. Only the floor
      arithmetic -log2(1 * 241^3) = -23.738668 was confirmed. BATCH-007's
      objection-2 table presents three rows as if all three had been checked
      against archived data; one was not. Rows 1 and 2 were verified exactly.
    - >-
      ALGORITHM.PY IS NOT ARCHIVED, so which code path actually wrote the .out
      files is NOT DETERMINABLE FROM REPOSITORY BYTES. The k_fft conclusion does
      not depend on it - EV-MLKEM-013's claim is specifically about
      FFT_sample.py, which is archived, and the variance test is a property of
      the data rather than of any script - but the residual is real and is
      recorded rather than argued away.
    - >-
      THE INSTRUMENT'S EFFECTIVE RESOLUTION IS A LOWER BOUND, NOT A DEMONSTRATED
      VALUE. The q^k_fft candidates inside one FFT share the same N dual vectors
      and target, so they are not independent, and the archive carries no
      per-iteration exceedance breakdown from which the effective replicate count
      could be recovered. 2^-35.7045 is therefore a lower bound on the resolution
      limit. The far-tail count structure (counts 1, 2, 3, ... rather than jumps
      of q^k_fft) argues against extreme clustering, but that is an argument, not
      a measurement.
    - >-
      NUMPY WAS UNAVAILABLE in the review session, so numpy.fft.fftn was replaced
      by a direct evaluation of its documented definition
      (A[k] = sum_n a[n] exp(-2*pi*i*k.n/q) per axis), self-checked against the
      closed form for a single-delta table. The reviewer notes the identity is
      also derivable by hand from the code text and that the two agree. This is
      recorded as a methodological substitution, not hidden.
    - >-
      ALPHA IN APPROXIMATION 4.8 APPEARS IN NO ARCHIVED EXTRACT. It was scanned
      rather than read, and the resulting corroboration is treated as
      corroborative only. Nothing in this record rests on it.

  # ------------------------------------------------------------------
  # RELATION TO EV-MLKEM-017
  # ------------------------------------------------------------------
  relation_to_ev_mlkem_017: >-
    EV-MLKEM-017 IS NARROWED BY THIS RECORD, NOT FALSIFIED BY IT, and its status
    is unchanged. Its Q2 RESIDUAL observation stated explicitly that
    EV-MLKEM-013's synthetic identity check had NOT been re-run in BATCH-007 by
    anyone, that "the k_fft=3 alignment convention that converts the raw T-gap
    into the reported aligned 420.5579 is taken as frozen from a single
    un-replicated 2026-07-31 run", and that "every aligned Q3 statistic depends
    on it"; its `unresolved_confounds` repeated the point and added "if it is
    wrong, every aligned Q3 statistic moves". This review resolves exactly that
    stated residual, in the direction the record itself flagged as possible. The
    consequence is that any sentence in EV-MLKEM-017 or DEC-20260802-15cadd
    quoting an ALIGNED score statistic - the aligned Pgood minimum 2222.56, the
    aligned T-gap of approximately 420.56 - inherits the void alignment and
    should be read on the raw scale instead (Pgood minimum 6667.673616; distance
    to the operating threshold 10162.473718). EV-MLKEM-017's Q1 sub-findings, its
    Q3 narrowing and Ducas-Pulles counter-evidence, its package-integrity
    findings and its non-claims are untouched by this record. Correcting a
    record's dependent statistic while its own text predicted the dependency is
    the system working, not a defect discovered late; and per rule12_status no
    field of EV-MLKEM-017 is edited here.

  # ------------------------------------------------------------------
  # INFERENCE
  # ------------------------------------------------------------------
  inference: >-
    A zero-compute re-analysis of already-archived toy-parameter bytes produced
    two results and one correction. FIRST, the counting-resolution confound is
    real and exact: Carrier's archived Pwrong survival functions are unsmoothed
    pooled counting estimates whose support endpoints are budget-determined by
    construction, so `fraction_inside = 0` measures the instrument and not the
    score distribution, and the run's zeros above its floor are upper bounds. The
    honest content of EV-MLKEM-011 is a dynamic-range statement - Fig 4.1
    validates Approximation 4.9 only over Pwrong in [2^-35.70, 2^-1], while the
    Kyber table applies it 83.87 / 142.09 / 208.33 bits below that band - and
    every number that record states recomputes exactly. SECOND, and unexpectedly,
    EV-MLKEM-013's k_fft normalization asymmetry does not exist: the archived
    init() accumulates each phase k_fft times and FFT()'s division cancels it, so
    the recomputed scale factor is 1, corroborated code-independently by the
    archived data's own variance in two files at ratios 0.9996 and 1.0020 against
    the raw prediction versus 2.9987 and 3.0060 against the aligned one. The
    aligned statistics 2223 / 3988 / 5941 and the T-gap 420.56 are a wrong unit
    conversion, and EV-MLKEM-011's raw figures were already on the correct common
    scale. THIRD, that correction inverts the practical force of BATCH-007's
    blocking objection: on the raw scale the operating threshold sits roughly 93
    to 117 bits of survival probability below the instrument floor, needing
    approximately 2^105 to 2^129 iterations, so the objection's diagnosis stands
    while its implied "run longer" remedy is wrong by approximately 100 bits.
    Finally, the archived data affirmatively favours "mass exists beyond the
    floor that this instrument cannot count" over "no mass there", because the
    log-survival flattens toward the floor rather than steepening and sits 150.51
    bits above the model's Gaussian component there. NONE OF THIS IS ADJUDICATED.
    It is a contradiction of validated evidence records, AGENTS.md rule 12 routes
    that to `review-breakthrough` at `max`, that policy cannot be served in this
    environment, and so no status changes and no knowledge entry moves. What this
    record establishes is what the re-analysis found and what remains blocked.

