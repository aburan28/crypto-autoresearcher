      scale: ECBND1h05a2ea918f3c measures it at 1.089 [0.927, 1.261] x floor
      over degrees 41-61, and no medium verdict exists.
    - One epoch, one session, one host class; strength preliminary.
    - Constant level only; both fitted exponents are description, not law (fixed-cost signature, candidate r_squared 0.379).
    - Unit is ecbench.gae; blind to field-operation cost by design.
    - Isolation L0; no wall-clock figure is a bound here.
    - bounded: true; the uncharged axis is reported, not deciding.
    - >-
