  inference: >-
    At toy scale on four Koblitz curves (r = 2^15.4 to 2^21.0), under
    group-operation accounting with canonicalisations, partition hashes and
    table work counted but not charged, the lean tuned signed-Frobenius walk
    performs 0.299 [0.235, 0.402] of the strong lock-step walk's operations
    and stores 0.560 [0.483, 0.656] of its table, with the difference
    located in the strong walk's fixed set-up (71 % of its total here). The
    verdict reads advances at the constant level; no exponent moved. This is
    an engineering fact about the reference at toy sizes -- the strong
    walk's set-up is a fixed charge that dominates when sqrt r is a few
    hundred -- and the ledger adopts the sealed bound ECBND1hbc8602528f48
    (4.996 [2.985, 7.374] x floor, 0.017 sqrt r entries) as a measured
    known-results row at toy tier.
  boundaries:
    - Toy tier only; extension degrees 17-29; r <= 2^21. Nothing is asserted at medium or cryptographic sizes.
    - >-
